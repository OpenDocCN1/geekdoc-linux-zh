  md: '# # Jobs and Processes


    # ## IN THIS CHAPTER


    +   1. Keeping Track of running processes

    2. Foreground and background processes

    3. Managing processes

    4. Managing output

    5. Moving jobs between foreground and background

    6. The screen program


    Just as Unix is designed as a multi-user operating system, it is also designed
    as a true multitasking system. Many personal computer users are accustomed to
    running multiple programs at one time with an operating system like MacOs or Windows,
    but Unix multitasking is a different matter. In this chapter, you will learn the
    difference between the two methods and how to work with jobs and processes under
    Unix.


    Personal operating systems use a style of multitasking called task switching.
    Task switching involves allocating the computer''s processor cycles to each running
    program, allowing any given program to take all the time it needs to accomplish
    a particular task. This is why Windows and Macintosh computers sometimes "hang";
    the processor is locked by a certain job, and cannot do any other work until that
    job is finished. Since the process may be a background task, you might have no
    idea what is causing the system to lock up.


    Given that Unix machines have dozens of users logged in at any given time, generating
    a different set of demands on the processor, task switching is not practical.
    Instead, Unix uses a style of multitasking called time slicing. With time slices,
    processor cycles are allocated to each running program. When program''s designated
    cycles are finished, the next program starts to work with the'
  merge: -1
  pgno: 71
