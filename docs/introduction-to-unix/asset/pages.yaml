    # Printer Administration


    Administering printers used to be one of the more troublesome aspects of Unix
    system administration. However, this has changed with the recent maturation of
    the Common Unix Printing System, or CUPS. The problem with Unix printing is that
    no two variants handled print jobs in the same way. The configuration files were
    obscure, and could not be shared among machines. Even with the advent of graphical
    configuration tools for printers, it seemed that no two variants agree on how
    to run things.


    CUPS, on the other hand, replaces all of these systems with a consistent interface
    that works across many Unix variants. At the time this was written, CUPS was supported
    under Linux, FreeBSD, and at least seven Unix variants including IRIX, HP-UX,
    AIX, and Solaris. In addition, it is now the primary printing system on several
    of these variants.


    In the real world of legacy networks, of course, you may find yourself a system
    that does not have CUPS installed. In this case, you will need to roll your sleeves
    and find the documentation which explains exactly how your system''s printer works.
    However, if you are the person in charge of the system, consider replacing any
    non-CUPS printing system with a CUPS-enabled variant. It will save a lot of time
    in the long run.


    # Working with CUPS


    If you have a Unix variant which will work with CUPS but do not have the CUPS
    software installed, obtain it at the CUPS Web site (see Appendix D: Internet Resources)
    and install it using the process described above. Once it is working, shut down
    any running print servers that were previously installed and configured.


    One of the advantages of CUPS is that you can use a simple Web interface to manage
    and administer your print services. Open your Web browser and enter the address
    http://localhost:631/ in the address box. You should see a page like the one in
    Figure 17.1.


    # Adding a Printer


    To add a printer, click on the link labeled "Do Administrative Tasks." The "Admin"
    page will appear, as shown in Figure 17.2.'
