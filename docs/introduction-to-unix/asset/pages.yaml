    **Interface** The method by which the user interacts with the operating system.
    Unix interfaces can be text-based or graphical.


    **Line Editor** A type of text editor which handles only one line at a time. Line
    editors have been supplanted by visual editors like vi, and by graphical editors.


    **Internet** A type of network which connects several networks together. For example,
    the Internet is an network which connects many LANs or Wans.


    **Links** An alias for a file. There are two types of links: symbolic and hard.
    Symbolic links refer to another actual file. Hard links involve a separate inode
    with a different name; this inode refers to the file inode.


    # H


    **Heterogeneous network type.** A heterogeneous network has machines of more than
    one operating system. That is, a Linux machine and a Macintosh heterogeneous.
    These networks are managed with software operating systems that each understand
    other.


    # J


    **Homogeneous network type.** On a homogeneous network, all machines are running
    the same operating system.


    # M


    **Job Number** A unique identifying number started by a particular user. See Identification
    Number.


    **Macro** There are two definitions for macro:


    +   1. A series of commands or operations performed on a selected section of data,
    invoked with a keystroke or single command. This definition is often used in the
    context of an application program.

    2. The substitution of a length function. This is defined in programming, where
    macros can save a number of keystrokes.


    # I


    **Inode** The description of which disk block is occupied by a particular file.
    The information is stored in an inode, which is used to allocate disk space to
    new files.


    **Kernel** The lowest level component of the operating system.


    **Manual Page** A text file which describes the function of a specified program
    or command. Manual pages are accessed with the *man* command.


    See Superblock.


    **Integer** Any whole number: positive, negative, or zero. Integers cannot contain
    fractions or decimals.


    **Key Bindings** Functions are evoked by a keystroke combination or a particular
    key with an assigned function. These bindings are usually found in text editors,
    particular Emacs, but can also be found in other elements of the operating system.


