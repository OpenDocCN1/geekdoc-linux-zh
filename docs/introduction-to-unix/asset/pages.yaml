- img_proc: true
  md: '# Electronic Mail Clients


    Most Unix installations include the very basic program mail. mail can either be
    used interactively or run as a standalone program. The mail program is not particularly
    user-friendly and does not have a wide array of features, so most system administrators
    install other programs to make mail management easy. These electronic mail readers
    come in both text-based and graphical formats.


    # MAIL


    Should you find yourself in a situation where mail is the only mail client available
    to you, you can use this basic program to manage incoming and outgoing mail. However,
    this program is not widely used as a primary mail client, with most users preferring
    one of the more advanced clients described below. As the text editor vi, though
    it is good to know the basics of mail so that you can access your e-mail if you
    are on a machine with limited software and have no access to other mail clients.


    To check mail with the mail program, issue the command


    ```

    mail i

    ```


    at the shell prompt. The program will either display a "new mail" message, as
    shown in Figure 9.1, or will show a list of messages in your incoming mail folder.
    You can read message by entering the message number.


    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_145_0.png)


    > FIGURE 9.1 Use the mail command to check for new incoming messages.


    To compose a new message, you must start at the shell prompt. Issue the command


    ```

    mail recipient@address

    ```'
