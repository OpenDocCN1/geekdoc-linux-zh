  md: 'Text files are usually created and managed with a specialized program called
    a text editor. Text editors are simpler than word processors since they are not
    designed to format text, but simply to manage it. There are a number of text editors
    available for Unix systems. One of the most widely used editors is vi, and it
    is introduced in this chapter. Other text editors are covered in Chapter 8, Other
    Text Editors.


    # What Is Text?


    The concept of "text" is more specific in the Unix world than it is in general
    conversation. You may be familiar with a number of definitions for text in everyday
    usage: the printed material on a page, a particular book (often assigned for a
    course), or a sentence or two used as a basis for speech or essay. In the Unix
    context, however, text is a specific technical term.


    Text is a visual display which complies with a particular standard. In the United
    States, the standard is the American Standard Code for Information Exchange, or
    ASCII. This code assigns specific binary codes to individual letters, numbers,
    punctuation marks, and keyboard combinations.


    The operating system parses keystroke input into this code, and translates it
    into the binary information which is used to perform the requested action. For
    example, when you type the Unix command ls at the prompt, the operating system
    must translate the letters l and s into the binary codes 01101100 and 01100111.
    The operating system determines the appropriate response, resolves the resulting
    output according to the ASCII standard, and delivers a listing of files in the
    current directory to the standard output.


    There are different codes for character sets. Pictographic languages like Chinese
    or Korean do not use ASCII. Even European languages like French or German have
    characters that are not found in the English language, so they have their own
    codes as well. In order to display non-English languages on a given system, the
    correct fonts must be installed and configured appropriately.


    As with other computer standards, the ASCII standard means that a particular block
    of text will be displayed on any computer that recognizes this standard. In case
    of ASCII, all computers and operating systems recognize this code, with the single
    exception of very old IBM mainframes. You are unlikely to run into one of these
    machines, most of them have been scrapped or turned over to museums. ASCII is
    one of the true standards in the Unix world, even more than the graphical windowing
    system


