  md: 'To illustrate this concept, assume that the input consists of the sentence


    I have a pet dog.


    The fields are assigned in this manner:


    ```

    $1 = I

    $2 = have

    $3 = a

    $4 = pet

    $5 = dog

    ```


    If you are on a Linux with a pet dog | awk ''print $3''


    the output would consist of the word "a." The command edits the third field

    in the line.


    Like sed, awk commands are usually used on a specified input file. Assume

    that the example sentence has been saved to a file named dog.txt. The awk

    command can then be issued with the syntax


    ```

    awk ''print $3'' dog.txt

    ```


    to get the same output value.


    > Note: When using awk, especially in the context of shell programs, make sure
    that you

    not confuse awk fields with shell variables. It is easy to mistake one for the
    other

    they both use the $ character as identification. Always be aware of which ele\ments
    are inside the awk command structure which are not.


    The pet dog example may seem excessively simple for what is, after all, a powerful
    formatting program. In practical use, awk can be invoked in\ministrative tasks
