- img_proc: true
  md: '# Running Servers


    # CHAPTER 19


    # IN THIS CHAPTER


    +   1. Services and servers

    2. Selecting services

    3. Web servers

    4. Mail servers

    5. FTP servers

    6. News servers

    7. Remote access servers


    Although a network can function with the normal commands and programs included
    in the basic operating system, many administrators want to offer content to the
    outside world as well as enable their users to bring content in from external
    networks. In order to provide material for users on other networks, such as the
    Internet, a network must run specialized software. These programs are called servers,
    and recognize the unique format of various requests sent to the network. Each
    request is then provided with appropriate files.


    While running services is not necessary, many people choose to set up a network
    simply so they can provide services. For others, servers are their main job. Many
    businesses and other employers hire people specifically to manage individual servers,
    whether it be e-mail or Web. Once a server is in place, it can quickly assume
    a critical role in network management.


    291'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# # What Is a Service?


    Services are usually involved with gathering or distributing information across
    a large network or mesh of networks. Most familiar services are Internet-related
    services like Web servers, mail servers, and the like. However, not all are Internet
    services. Some internal services which have already been described in this book
    include the Window System and NFS, the Network File Server described briefly in
    Chapter 16, Basic System Administration: Part I.


    All services, whether internal to the network or external, client-server architecture
    as introduced in Chapter 18, The X Window System. In some cases, with Web servers,
    the clients are usually external and connect across an Internet connection. In
    other cases, as with Windows, clients are usually from the internal network. Both
    client connections are managed by the server in the same way, barring any extra
    security precautions taken by the network for external connections through the
    Internet.


    # # Selecting Services


    It is common for administrators of new networks (and even some old ones) to run
    many services. In fact, a few networks run for what than necessary. Some reasons
    for having the hardware and software to handle multiple services, wanting to serve
    your user base with locally managed services, or being curious about how the various
    servers work. All of these can be valid reasons, but there are drawbacks to running
    a variety of services that do not get much use.


    When a server process is running, it consumes system resources. If it is not being
    accessed frequently, consumption is less than that of a busy server, but the program
    still requires resources to function. A running server process is also a security
    risk, especially if you do not know that it is running. There are some people
    who configure new servers to see how they work, and then turn them off or delete
    the programs. The service thus offers a convenient point of entry for someone
    who wants to break into the network.


    Selecting an appropriate suite of services for a given network requires research.
    The administrator must ask a series of questions that can help to narrow down
    the decision:


    +   - What services does the user base need and use on a frequent basis?


    +   - What is the purpose of the network?


    +   - How does the network connect to the Internet?'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# World Wide Web Services


    +   - Does the Internet offer services which would otherwise need to

    run locally?


    +   - What file types would be served by the local network?


    A network which is small and noncommercial may only need an e-mail server

    and possibly an FTP server. In fact, even e-mail may be provided by the

    upstream Internet connection. A large commercial network, however, may

    eed to run multiple servers to manage their Web presence, as well as

    remote access and e-mail. A community network might offer a news server as

    well as e-mail and limited Web functions.


    In selecting services, the network administrator must also consider any restrict-ions
    which are stipulated by upstream providers or other associated networks.

    A small home network connected to the Internet with a cable modem, by

    example, is probably barred from running a Web server across that modem\unless
    the service agreement is for a business plan, not a personal plan; busy plans
    are far more expensive. Before you make choices about

    run services, the terms of every user agreement affecting your net-work. The choice
    may have already been made for you if you are barred from

    running servers at all.


    If you have permission to run services and you know the basic needs of

    user base, you can begin to decide what services to offer. Many networks need

    FS to handle filesystem management, and you will need X if you

    plan to offer graphical interfaces anywhere on the network. Depending on

    y upstream service provider and your own time commitment or skill level,

    y may choose to run an e-mail server to handle mail locally. A Web server is

    useful for those with fast Internet connections (where, of course, a

    Web server is permitted), while some administrators may want to offer an

    ray newsgroups.


    Remember that your user base''s needs may change from time to time.

    Be sure to evaluate your service portfolio every few months, checking the logs

    to see how much an individual service is really being used. If your users claim

    to want a news server and never read it, it is best to pull that

    service. Also, keep an eye on security. The more services, the more potential

    problems. If your operating system turns on services by default at installation,

    go through and turn off the services you neither want need.


    # World Wide Web Services


    Web pages are provided by Web servers. When a user requests a page through

    a browser, the browser sends a specially formatted message to the appropriate

    Web server, asking for the desired page and any associated files that may be

    atched to it, as images or sound files. To display properly in a Web'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# CHAPTER 19 Running Servers


    browser, the files must be formatted according to the Hyper Text Markup Language
    (HTML) standard. File requests and transfers are handled according to the Hyper
    Text Transfer protocol, or HTTP. Any server chosen to handle traffic must be compliant
    with the HTTP standards.


    The most popular Web server in the world is the Apache web server. Apache runs
    on Unix, and is Free Software. It is released under the GNU Public License (see
    Chapter 1) and can be obtained free of charge. Although Microsoft''s Internet
    Server, or IIS, is popular among those who administer Windows networks, IIS cannot
    be run on other platforms, where Apache has been ported to every known and stable
    operating system. Apache is the best choice. It is robust, to manage, and unlikely
    to crash. Documentation and help are also freely available online.


    # Apache


    Apart being a powerful and easy-to-manage Web server, Apache has the added benefit
    of being modular. This means, that unlike Unix itself, functions are separated
    into individual units. An administrator can choose to run all Apache modules,
    a stripped-down set of modules that provides only the basic functions, or a set
    where those extremes meets the need of the site''s community without adding extra
    system load. Modularity is one of the key Unix philosophies, and it is illustrated
    in the way Apache works.


    Apache''s modular nature is particularly useful when it comes to the machine it
    needs. The core server program is actually quite small. It can run on a machine
    with as little as eight MB of RAM and six MB of disk space. (Typical ideal desktop
    systems currently on sale at your local big-box computer retailer costing well
    under $1,000) will probably have at least 128MB of RAM and several gigabytes of
    hard disk space, Granted, the site being served by a minimal installation must
    be text-only and low-bandwidth, but it is possible. One of typical systems would
    serve an non-commercial site quite nicely for a few years. Apache can provide
    the resources you need, though you may be limited in the modules you can use or
    the type of files if you are limited in system resources.


    Installing Apache is unusually simple. Although working with the server is beyond
    the scope of this text, the Apache configuration file has been included in Appendix
    C, Common Configuration Files. It is a well commented file, and is easy to read
    if you have no experience running the server, since it is an excellent example
    of program comments. The complexity of Apache comes from the interplay of modules
    and their work.


    # Tech


    If you are interested in running Apache, there is a wealth of information available
    on the Web. See Appendix D, Internet Resources, for some sites Apache skills are
    valuable to your Unix knowledge, and those who are considering a career in Unix
    will find that Apache experience often gives them an edge.


    # Other Web Servers


    If for some reason, you don''t want to run Apache, there are other alternatives
    to it and IIS. Some administrators simply don''t need a server that is as-powerful
    as Apache. They serve only particular file types or security concerns'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'that aren’t addressed by various patches and workarounds. Still others just
    like running software that''s different and unusual. Although Web servers as other
    server types, mostly popular as the development community as other because Apache
    is the figurative 800-pound gorilla in this category, there are a few other servers
    which might be more attractive to network and Web administrators.


    # boa


    A GNU program, boa is a Web server that handles multiple incoming requests in
    a different manner than Apache. Although it is still in limited use and under
    active development, boa can handle robust traffic and may be a good alternative
    for small sites.


    # Jigsaw


    The Jigsaw server is a product of the World Wide Web Consortium (the people who
    manage the HTTP standard, among other functions). It is HTTP compliant and is
    used by W3C programmers to test new HTTP functions. Jigsaw is unusual in that
    it''s a Java program, making it platform-independent.


    # WN


    For those administrators who like Apache and its functions but don’t have the
    space for a full installation, the WN project offers a server with many of the
    same abilities but a smaller disk footprint. WN supports secure connections and
    new design tools like Server Side Includes (SSIs). It also offers great documentation,
    which is somewhat unusual in a small Open Source project.


    # Electronic Mail Servers


    Most networks run mail servers. Once a user base gets to a certain size, it is
    more efficient to handle mail locally than to rely on software provided by upstream
    servers. E-mail has a normal part of doing business and of personal communication,
    however, getting a mail message from sender to recipient can be more complicated
    than it seems.


    Mail travels from the sender''s program, a client called the user agent or mail
    user agent (MUA). The MUA transfers the finished message to a mail agent located
    on the local network. MTA is the program commonly referred to as an Internet connection.
    The MTA transfers the message through the network''s Internet connection, which
    is delivered through a TCP connection. Once the message arrives at its intended
    destination, that network''s delivery agent routes the message to the recipient.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# CHAPTER 19 Running Servers


    User agents are usually a personal choice. On Unix systems, a user might select
    one of the programs described in Chapter 9: Internet Applications. On Windows
    or Mac systems, a user might use Eudora or another POP or IMAP compliant agent.
    POP and IMAP are two standards which define the way in a mail client should connect
    to the mail pool and download waiting messages. In the same way, the delivery
    agent is a function of the operating system and is not really a matter of administrator
    choice. The decisions administrators must make about e-mail servers are decisions
    about transport agents.


    Whenever possible, avoid Microsoft Outlook. Most viruses that spread through-mail
    are written to exploit security holes in Outlook. You can greatly reduce your
    chance of getting an e-mail virus simply by switching to Eudora or another non-Outlook
    graphical mail client.


    > Warning:


    # Mail Server Options


    There are a number of mail servers available on the Unix platform. Some of them
    are quite old, while others are new and offer additional functions. No matter
    which server runs on your network, be aware that managing mail servers can be
    a complicated experience. Because so many machines and processes are involved
    in getting a single message from Point A to Point B, many things can go wrong
    in mail delivery—and often do. Due to this complexity fact that users are highly
    reliant on e-mail and become frustrated and annoyed when mail does not arrive,
    and you can see that mail server management is a specialized skill that requires
    both ability and solid people skills.


    Choosing a mail server is something that any administrator will do rarely, if
    at all. Changing from one mail server to another is a significant undertaking,
    mail systems tend to run on the same server. The server will be upgraded as necessary,
    but sendmail tend to stay sendmail systems and Postfix systems tend to stay Postfix.
    It is doubtful that any readers of this book will be involved in selecting a mail
    server before developing skills far beyond the scope of this course. Therefore,
    this section of the chapter is limited to describing the four most popular mail
    servers and their functions.


    # sendmail


    The sendmail program is the reliable warhorse of mail servers. sendmail has been
    around for years, has gone through multiple upgrades and new releases, and offers
    a level of flexibility and power for mail services that equals the strength of
    Apache for the Web. Those with old and robust networks will probably find a sendmail
    installation serving the e-mail needs of the network.


    The downside of sendmail is that it is hard to use. Note that configuration alone—not
    using the program, troubleshooting it, or anything else—requires'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# Electronic Mail Servers


    FAQ documentation that is nearly 30 pages long. Documentation for other parts
    of the program is even longer. Networks running sendmail tend to have dedicated
    administrators who work with little else the mail server. It is an amazing program
    that is still the most widely used mail server around the world, but it is not
    for the new administrator or the administrator of a small network.


    # Postfix


    The Postfix mail server is a good alternative to sendmail, especially for smaller
    networks that do not handle vast mails of each day. One of the main benefits of
    Postfix is that it is very easy to configure, regardless of the network architecture
    or platform being used. In addition to helpful comments throughout the configuration
    files, there is excellent documentation available on the Postfix web site. This
    server would be a good choice for a robust home network with multiple machines
    and users, or for small business or noncommercial use.


    # qmail


    Although it is the youngest of the mail servers described here, the qmail server
    is rapidly being adopted by networks which handle large amounts of mail and which
    need a secure server that does not require excessive amounts of time to administer.
    In fact, qmail is so robust that it is the mail server of choice for Hotmail,
    Microsoft''s free-based e-mail service. Microsoft has, in the past, tried to migrate
    Hotmail to its own Microsoft Exchange mail server, Exchange been unable to handle
    the load. While qmail''s scale may be overkill for very small networks, it is
    reliable to configure and works well on those small networks.


    # Exim


    The fourth mail server described here is Exim. This program, developed in England,
    is a small but growing fellow of people who want to run a Free mail mail with
    some unique features like spam filtering and address verification. Exim is reliable
    in some Unix variant distributions as a replacement for smail, a GNU mail transfer
    agent. Because mail is simply not acceptable from a security standpoint, anyone
    working on a network which uses smail should replace MTA installed with Exim.
    Those who are interested in running a network which uses primarily or solely Free
    software should consider Exim, which is reliable on smaller networks but has also
    been tested at production levels against most powerful servers and has performed
    acceptably.


    # POP and IMAP


    Those who administer electronic mail must also consider the user''s point of view.
    The vast majority of users neither know nor care what MTA is running on their
    system. To them, e-mail is managed by the mail client. For some users, that client
    is a Unix shell client like Pine or elm. These users are, from the administrative
    point of view, relatively low-impact. Such clients read'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# CHAPTER 19 Running Servers


    directly from the spool, in text mode, and do not require additional configuration.


    However, many more users prefer to work with their e-mail in a graphical environment.
    Those using a graphical desktop environment like KDE or Gnome can select the desktop''s
    native graphical e-mail client. Other users, who pull their e-mail from a Unix
    mail server, will use Windows or Mac mail clients. To supply messages to these
    clients, the administrator must use a POP or IMAP server to transfer messages
    from the spool to the individual client upon request.


    Note:


    POP, Post Office Protocol, and IMAP, Internet Message Access Protocol, are two
    methods of managing mail flow between graphical e-mail clients and the text mail
    spool hosted on the network.


    POP and IMAP services offer an additional level of security for the administrator.
    Unlike Pine or em users, POP and IMAP users never log directly into the network
    to get their mail. The users must have an account on the mail server machine,
    so that the POP or IMAP process can be authenticated and mail transferred, but
    there is no direct login as there must be with a direct-from-spool client. If
    you are running a mail server, it is probably a good idea to set up POP and IMAP
    servers so that your users can work with their messages remotely.


    # FTP Servers


    One of the more traditional services that is routinely offered is FTP, the File
    Transfer Protocol. This service allows users to connect and upload or download
    files. In order to provide FTP service, you must install an FTP server. If your
    operating system''s distribution does not come with an FTP server, there are several
    that are available on the Internet as Free Software. The two most popular FTP
    servers are WU-FTPD, and ProFTPD.


    If your file transfer needs light, consider the scp utility that uses the SSH
    suite of programs, as it is more secure than FTP.


    Note:


    Once installed and running, these servers will listen on port 21 for incoming
    connections. Those attempting to connect will be prompted for a username and password
    which will be checked just as if they would were logging in. The FTP server provides
    the ability to browse for a desired file and download it.


    Obviously, only users with accounts can access your system in this way. If you
    want to provide FTP service to the Internet at large, you must enable anonymous
    FTP service. In order to set up anonymous FTP service, you will'
  merge: -1
  pgno: 310
- img_proc: true
  md: 'first set up a file system for the use of anonymous users. The FTP server will
    restrict anonymous users to only this file system so that they cannot "fool around"
    on the rest of the system. You must then configure the server to accept anonymous
    connections.


    This procedure is different for each server, so read your server''s documentation
    to learn how to do it.


    > Note:


    # News Servers


    All of the services described in this chapter, the average administrator is least
    likely to run a server. Since the rise of the Web and various bulletin board programs
    written for HTTP transmission, USENET news has begun to fade as the primary method
    of time-independent online discussion. However, there are still many people who
    access newsgroups to participate in the myriad of discussions that happen on USENET
    daily.


    Running a server can be somewhat complicated due to the transmission method used
    by news posts. Unlike the Web, where a single page exists at a single location,
    an USENEN post is posted on hundreds of sites around the world. The site at which
    you read news has four or five upstream feeds, which provide redundant copies
    of some groups and unique copies of others. In turn, that site might feed a few
    downstream sites with some of the posts stored on the machine where you access
    news. The messages that exist on your local machine are all stored locally, and
    posts made locally are propagated to every other news server or through this mesh
    of feeds.


    Small sites have only one upstream feed and no downstream feeds. This practice
    is easy to maintain, but does run the risk of lost posts or incomplete propagation
    of local posts. In addition, the single upstream site might not carry every hierarchy
    you want to carry. For smaller hierarchies or those which cover non-local regions,
    you may need to obtain other feeds. Managing feeds involves checking for dropped
    messages, and interacting with news administrators at those other sites to be
    sure that traffic flows smoothly.


    As described in Chapter 9, Internet Applications, USENET groups are organized
    in hierarchies. Some sites only feed major hierarchies, while others feed smaller
    or esoteric feeds. Feeds are not restricted geographically; if your users want
    to read the Italian national hierarchy, you could get a feed from an Italian site
    if necessary. However, a feed closer to you geographically will feed faster with
    less signal loss. When more than one upstream site can feed the same hierarchies,
    pick the one that is closest physically. It will usually provide the best service.


    > Note:'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# INN


    The news server used by most heavy-traffic sites is INN, an acronym for Inter
    Net News. The INN server is capable of handling vast amounts of traffic through
    multiple streams of input. It is easily configured and is fairly straightforward
    to administer. The software is under active development. Because it is so widely
    used, there is little reason to choose any other.


    Once installed, INN can get up and running quickly. The administrator must define
    all incoming newsfeeds, specifying which hierarchies and groups are provided by
    each. The newsfeed configuration also determines what sites are served by your
    news server; if you propagate the posts made by your local users, you must set
    this properly or posts will never appear on other servers.


    Apart from newsfeed configuration, the other elements of INN configuration are
    more subjective. The administrator must define the various expansions for groups.
    A group''s expiration time defines how long messages in that group will age on
    the server before they are deleted. Some administrators set groups so that they
    never expire and all posts are always available. Other groups should be expired
    rapidly because so much traffic can overwhelm a news pool, such as the alt.binaries*
    hierarchy.


    Hierarchies like binaries., with their massive traffic, are often heavy for illegal
    activity. Much of the traffic in binaries groups consists of illegal copies of
    copyrighted software and images, like bootleg copies of Windows or photographs
    of pornographic magazines. Because the liability issues are unclear, and more
    news news administrators'' choose to carry only text groups, and not those groups
    which allow binary (encoded) posts.


    Once the server is set up properly, most news administrators spend time each day
    reviewing the news pool, checking INN''s behavior, and fixing small problems.
    Good administrators also spend time on user behavior and education. Users who
    post commercial messages to inappropriate news-groups, who persist in posting
    abusive or off-topic content, or otherwise violate the USENET standards must be
    disciplined; those who make errors inadvertently must be educated. As with other
    users, strong local policies go a long way toward making your site secure and
    respected for its user behavior.


    One thing to remember is that, for a news administrator to be effective, the administrator
    should be an active USENET participant. USENET constantly discusses itself, its
    expectations of users and administrators, and its mechanics. An administrator
    who does not read USENET-related groups is one who may not know about the latest
    security risks, new releases of INN, and updated group lists. If you are not interested
    in news, it is better not to run a server than it is to run badly or inattentively.


