- img_proc: true
  md: 'Text editors are similar to word processors, but there are some important

    differences. A word processor, like Microsoft''s Word or Core''s WordPerfect,

    is a WYSIWYG program. What You See Is What

    You Get, and it means that the document or file will print exactly as it is

    played on the screen. The word processor applies a number of

    invisible formatting directions to the text in order to create a visually

    depealing document. Opening a word-processed file in a text editor

    produces a series of nonsense characters, which is how formatting

    codes translate into pure ASCII. Because of these formatting codes, word

    processors must run in a graphical user environment which can translate

    codes into pure visual representation. There are no word processors for text-

    mode environments.


    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_110_0.png)


    The original word processors were intended for professional publishers. They

    worked in text, and the formatting codes were inserted into the text by hand.

    Users couldn''t see the result until the page was printed. WYSIWYG editors

    developed in response to these programs, so that users could see what each effect

    formatting code had on the document. If you''d like to see a version of one of
    these

    early typesetting programs, take a look at LaTeX. LaTeX is still used in aca-

    demic circles, as it''s particularly effective at scientific and mathematical
    equations.


    # # Line Editors vs. Visual Editors


    As with any type of program, text editors have evolved through the years. The

    liest text editors were line editors, which permitted the user to work on

    line of one file at a time. Since there are obvious drawbacks to a pro-

    gram, the next generation of text editors permitted the user to work on

    entire file at once. These editors are called visual editors, and most of the
    text

    editors used today fall into this category.


    The first Unix editor was called ed, short for "editor." Due to the-

    im limitations of cra''s monitors, ed was a line editor. To use ed and other

    line editors, the user must enter each line of file as a separate section. The

    method is used to edit an existing file, and the user must know each

    particular line number in order to work on that line of the file. The longer the

    file, the more troublesome it is to work with a line editor.


    Surprisingly, ed is still around. In fact, it may be installed on the system you''re

    using for this case. While it is difficult to use, ed is extremely useful in situa-

    tions where only the most basic functions are available, such as a devastating

    system crash has damaged your terminal. Basic ed skills are included in

    Chapter 8, Other Text Editors.


    As monitor technology advanced through the years, programmers took

    advantage of the new capabilities to build more advanced text editors. One of'
  merge: -1
  pgno: 110
- img_proc: true
  md: 'the first full-screen, or visual, text editors to be released as vi. Visual
    editors like vi take advantage of the full monitor screen. Instead of working
    by line, a user can display an entire file, or much of it will fit on the screen
    at once. Visual editors allow the user to scroll through the file, move between
    lines, and even cut and paste material from line to line. None of this was possible
    with plain line editors.


    While it may seem a strange thing to get excited about, choosing a text editor
    is something many people have strong opinions. Whether or not most people use
    vi, most will agree that it''s one of the most important editors available to
    Unix users. vi is available on a vast number of systems, it''s usually installed
    by default. This means that, if your system crashes or you need to use a system
    that doesn''t have your favorite text editor, every Unix user should know the
    basics of vi. Even if you choose another text editor as your favorite, learn enough
    vi to use it in an emergency.


    Throughout this, we assume that you will use a text editor to create or edit any
    text files which are required for a particular operation. Do not use a word processor
    to edit these files; even if you save them as plain text and import the files
    into your Unix account, they may not work properly.


    > Note:


    # The vi text Editor


    The vi text editor offers a number of features not found in earlier-generation
    line editors, but it may seem difficult or unintuitive for users who are accustomed
    to modern word processors. With vi, all commands are entered on the keyboard instead
    of using a mouse for some work, and there is no menu system to select the appropriate
    action. Despite these differences, most users find that vi runs much faster than
    their regular word processor, and that files are much smaller.


    > Note:


    vi is pronounced "vee eye," "vye" or "vee".


    To start the vi text editor, log into your Unix shell account and type vi at the
    system prompt. The text editor will open on your screen, as shown in Figure 1.
    To work with a particular file in vi, use the file name as part of the command:


    ```

    vi filename

    ```


    Whether you open an existing file or a new file, you will not be able to enter
    new text immediately. One of the unusual aspects of vi is that it has two separate
    modes: insert mode and edit mode.


    > Tech Tip

    Your system may have a version of vi called vim. This version of vi works the
    same way. It uses the .vimrc configuration, not the .xrc file described in this
    chapter. If you are using vim and find differences between what you read here
    or learn in how the vi editor works, consult its documentation.'
