  md: '# GNU Emacs


    As its name suggests, the GNU Emacs text editor is an integral part of the GNU
    operating system described in Chapter 1, What Is Unix? In fact, Emacs was the
    first part of the GNU system to be created. If any text editor can make a legitimate
    challenge to vi as the most important editor, Emacs is it. GNU Emacs is not installed
    by default on all Unix systems, but those who would like to try it can download
    from http://www.gnu.org.


    The proper name of the editor is GNU Emacs, though the first component is dropped
    in casual conversation.


    The main attraction of Emacs is its raw power. Emacs allows the user to edit several
    files at the same time, move back and forth between files, cut and paste text
    between files, use shell commands from within the Emacs environment, and a host
    of other actions not possible in most text editors released before Emacs (and
    many others released it). In fact, if a user is inclined to be replacing a regular
    shell environment, Emacs can be used as an entire user environment. This is managed
    by running a regular shell session within Emacs; though such a method is not really
    more useful than running a separate process outside Emacs, this capability could
    be used in certain programs.


    Unfortunately, the price of this power is a steep learning curve. Emacs is complicated
    and has a somewhat obscure user interface. Emacs is also a large program, both
    in terms of the disk space it occupies and the memory it requires. This is generally
    not much of a problem, but users on old or limited hardware may experience problems
    with this editor. Figure 8.1 shows output from the top command, with Emacs process
    consuming a significant portion of processor cycles.


    # Starting GNU Emacs


    Start Emacs as you would any other program, by issuing the command emacs at the
    system prompt.


    The editor will open with a blank screen, as shown in Figure 8.2. To open Emacs
    for work on a previously saved text file, issue the command emacs filename


    Despite having been developed as a text-based program, GNU Emacs has also been
    modified to run under the X Window System, which allows Unix variants to run graphical
    user interfaces. (X is introduced in Chapter 18, The X Window System.) In this
    chapter, Emacs is described in its text form; therefore, if you are working on
    a system that uses graphical interfaces, you will need to invoke Emacs without
    its X modifications. So with the command'
