  md: 'Run control files are configuration files which are always read at start-up.
    They usually have the file suffix .rc or use the "rc" component in the file name,
    and can be read and managed with a text editor. There are two types of run control
    files: system-wide and individual.


    # System-wide Run Control Files


    System-wide run control files are configured by the system administrator. These
    files set the default behavior for the specified program, which defines how the
    program will appear to any user on the system (unless user defines their own run
    control files as described in the next section). The default behavior is the baseline
    from which any other configuration will stem, and there are some elements of program
    behavior which can only be controlled in a system-wide configuration file. These
    files should have permissions so that users can view, but not modify, them.


    The system-wide run control file for a normal bash installation is the file /etc/profile.
    An /etc/profile taken from a Linux system might look like this:


    ```

    # /etc/profile

    # System wide environment and startup programs

    # Functions and aliases go in /etc/bashrc


    if ! echo $PATH | /bin/grep -q "/usr/X11R/bin" ; then

    PATH="$PATH:/usr/X11R/bin"

    fi

    ulimit -S 0c 1000000 > /dev/null 2>&1

    if [ ''id -gn'' = ''id -um'' -a ''id -u'' -gt 14 ]; then

    umask 002

    else

    umask 022

    fi


    USER=''id -un''

    LOGNAME=$USER

    MAIL=''/var/spool/mail/$USER''


    HOSTNAME=''/bin/hostname''

    HISTSIZE=1000


    if [ -z "INPUTRC" -a ! -f "$HOME/.inputrc" ]; then

    INPUTRC=/etc/inputrc

    fi


    export PATH USER LOGNAME MAIL HOST HISTSIZE INPUTRC

    ```'
