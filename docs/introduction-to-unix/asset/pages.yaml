- img_proc: true
  md: 'This command has a number of options, but one of the most useful is the - flag,
    which causes at to take input from a specified file rather than from the keyboard.
    A series of commands can be stored in a file, which is invoked with the syntax


    ```

    at -f <command file> <time>

    ```


    # bash


    The bash command invokes the Bourne shell Again environment, taking the syntax


    ```

    bash [<command>]

    ```


    The command opens a bash shell session. If a shell command or the name of a script
    is given as an argument, that command or script will be run in a bash shell session
    regardless of what shell is being used.


    # cat


    The cat command prints the contents of a named file to the standard output, usually
    the monitor. cat takes the syntax


    ```

    cat <options> <file(s)>

    ```


    cat has several options, including


    +   -n numbers the lines of output

    -s collapses consecutive blank lines into one single blank line


    One of the most common uses of cat is to concatenate several files into one new
    file for easier reference to the data contained in the individual files, as in
    the command


    ```

    cat <file 1>><file2><file3> >> <newfile>

    ```


    # cd


    The cd command is used to change directories in the file system. If the command
    is issued without a specified target directory, you will be taken to your home
    directory. cd takes the syntax


    ```

    cd [directory]

    ```'
