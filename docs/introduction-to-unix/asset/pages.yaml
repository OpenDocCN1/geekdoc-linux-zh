  md: '# The Open Source Movement


    Whether or not, many people see an ideological and political conviction in the
    goals of the Free Software Foundation and, by extension, in the Linux community
    (because Linux is so closely integrated with GNU software). Richard Stallman''s
    writings rely heavily on his concepts of morality, freedom, assistance, and other
    philosophical ideas. This has led many observers to conclude, with unquestionable
    justification, that the thrust of the FSF efforts are anti-capitalist. Whatever
    Stallman''s personal feelings be, the GNU license and software documents contain
    no provisions that prevent commercial use.


    However, some advocates of Free Software think that a political approach is not
    the best way to get one''s product adopted in the business community, especially
    if the product is perceived as anti-corporate. Eric Raymond, in particular, has
    argued that the key to acceptance of Free Software is in getting it into corporate
    installations and, in order for this to happen, the case for Free Software must
    be made in language that is both understandable and appealing to business leaders.


    Raymond is a programmer and author who came to prominence as the result of a sociological
    experiment. He hypothesized that not only was Free Software a good thing from
    a point of view, but that the very fact that the software was created a developmental
    environment that would build better software in less time. To test this theory,
    he wrote a program called "fetchmail This program retrieves electronic mail from
    a remote server and delivers it to local users'' mail programs. At the time Raymond
    wrote fetchmail there was no equivalent in any Unix variant. Raymond replaced
    fetchmail under the GNU GPL, and was quickly gratified to see that people were
    working on his program and improving it.


    Raymond then wrote an article called "The Cathedral and the Bazaar," which compared
    the world of software, developed in a closed system or "cathedral," to the world
    of free software, developed openly in the "bazaar," of public participation. This
    article has become one of the most influential pieces written about software development
    and is responsible for at least one company''s decision to release its program
    code rather than keep it private: Netscape.


    You can read "The Cathedral and the Bazaar," along with Raymond''s other writings,
    at http://www.tuxedo.org/esr.


    One of the key points in the essay is a subtle shift in semantics. Raymond does
    not use the term Free Software to describe openly developed code. Rather, he introduces
    the term Open Source Software. In keeping with Raymond''s desire to make this
    software business-friendly, the change in terms removes the perceived anti-business
    bias that had hindered Free Software from being widely adopted. Raymond has been
    criticized for this choice but has noted that he is'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'trying to help the movement and not to steal its thunder: “Open Source’ is
    a marketing program for ‘Free Software,’ he has said.


    To a great extent, this marketing program has been successful, and Free/Open Source
    Software has found some acceptance in corporate circles. IBM, for example, has
    embraced Linux and is now selling servers with Linux preinstalled. Other companies
    have used Linux for significant parts of their technological infrastructure. Stallman,
    Raymond has founded an organization to promote his views. Learn more about the
    Open initiative at http://www.opensource.org.


    # Flavors of Unix


    The fragmentation of Unix into a number of competing variants has led to a divergence
    in how these varying systems function. To the average end user, this is not a
    concern since the user interface is reasonably consistent from system to system.
    For the programmer or system administrator, the differences can be of extreme
    importance. Luckily for the programmers, though, all Unix variants are POSIX-compliant.
    This means that all the variants adhere to a particular standard so they execute
    correct functions in the same way.


    POSIX, or the Portable Operating System Interface, is a set of standard interfaces
    that allows programs to run on a variety of Unix variants. As long as the operating
    system uses POSIX-compliant mechanisms, it can run regardless of the actual variant
    in use. The POSIX standard is administered by the Institute of Electronics and
    Engineers, or IEEE.


    > Note:


    As you learn more about Unix, you will see that the internal workings of a Unix
    system depend on a number of crucial files and configurations. Unfortunately,
    these are the elements that work differently under different variants, so you
    must be able to see the differences and know how to work with them. The major
    cause of these variances is the “family tree” of the particular variant you are
    using.


    # BSD versus SysV


    This family-tree issues stem from the differences between the original AT&T Unix
    and the Berkeley Software Distribution Unix variant. As described earlier in this
    chapter, the BSD was written in response to AT&T’s decision to charge for its
    Unix. All Unix variants that descend from AT&T/Bell Labs are called SysV Unices,
    after the fifth release of AT&T Unix (the most popular version), while Unix variants
    that descend from Berkeley Unix are called BSD Unices.'
  merge: -1
