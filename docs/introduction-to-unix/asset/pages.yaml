  md: 'unusual location. Make the necessary repairs or install the required libraries
    and try the installation procedure again.


    All that remains at this point is to install the binaries and configuration files
    in the appropriate locations in the filesystem. Some packages can do this for
    you if you simply type


    ```

    make

    ```


    at the prompt. Other packages will not. As always, the documentation is your guide.
    If you choose to make the make install, remember that the files will be installed
