- img_proc: true
  md: 'At the bottom of the screen, there are two rows which contain several commands.
    These rows are context-sensitive, meaning that the commands shown will change
    depending on the current task you are doing. Commands shown while you are reading
    messages will be different from commands shown while you compose a message or
    when you are working with the Address Book. PINE commands are usually issued as
    keystrokes using the Ctrl key, as commands are issued in the Pico text editor.


    To compose a new message, use the c command. This opens the Pico editor, unless
    you have defined any editor in your PINE run controls. The commands across the
    bottom of the screen will change to reflect basic Pico commands. When you have
    finished entering the text of your message, issue the ''x'' command. PINE asks
    whether you want to send the message or not; press the Enter key to send the message.


    There are extensive help and tutorial files available from the main PINE menu.
    PINE can also be configured as a news reader, and offers an excellent folder-based
    method of organizing saved messages. The Address Book both saves messages and
    allows you to create address groups to send messages to a large group of recipients
    with one address, rather than typing each individually.


    # Configuring PINE


    Although PINE has a set of run files like most other programs, you should never
    need to access these files directly. The integrated configuration utility in PINE
    contains almost every user-configurable variable in the run control files, and
    is easy to use.


    To configure PINE, select the Setup option from the main PINE menu. Enter an addition
    command, chosen from the rows at the bottom of the screen, to define the task
    you want to perform. Usually, this is the C,"Config" option. This command opens
    a screen containing the various parameters for definition. Use the arrow keys
    to scroll through the list until you find the desired option. Press the Enter
    key to select the variable, and then enter the value you want to have. If the
    variable is an ON/OFF choice, pressing Enter will automatically change the value
    to its opposite.


    # Graphical Electronic Mail Programs


    A number of programs are available to manage electronic mail user environments.
    PINE or Elm will work just as well in a graphical environment as a text environment,
    run within a terminal window, but some users prefer a mail reader written specifically
    for graphical use. If you prefer a text mail reader, though, there is no reason
    to change your user environment.


    Graphical mail clients provide point-and-click mouse access to messages, and offer
    functions which eliminate the need to memorize commands.'
