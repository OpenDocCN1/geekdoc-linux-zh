  md: '# Case Study: Setting Up a Simple Network


    In this section, you will work through the process of setting up a small network
    of linked machines. Once the machines are all hooked together, you will connect
    the entire network to a larger network using one of the computers as a simple
    router/gateway. While it is not necessary to perform this project in order to
    understand it, doing so may help you gain hands-on experience with building networks.


    In order to complete this project, the following equipment is necessary:


    +   * 4 personal computers running Linux

    * 5 Ethernet Network Interface Cards (one PC should have two NICs)

    * 5 segments of Category 5 twisted-pair cable with RJ-45 jacks

    * 1 Ethernet mini-hub having at least five ports


    In addition to the hardware, you will also need the following items:


    +   * An available connection to an ethernet network, preferably with access to
    the Internet, and all IP numbers associated with that network

    * The IP numbers of two available DNS servers


    Set aside the computer with two NICs for. It will serve as the gateway machine,
    but it is best to construct the rest of the network first.


    Connect each of the three remaining machines to the hub with a length of Category
    5 cable. Use the shortest length of cable that will span the distance between
    machine and hub without being too tight. Make that the hub is plugged into an
    electrical source and is running properly. Check all the RJ-45 jacks to ensure
    they are securely in place.


    Assign each machine an IP number with 192.168.1. IP numbers in the 192.168 range
    are reserved for use on any private network. No machine with a direct connection
    to the Internet may use these numbers. In this project, only the gateway machine
    will have an IP number outside the network. For example, the first PC might be
    192.168.1.1, the second and third 192.168.1.3.


    In addition to the IP number, give each machine a name. While machine names can
    be thematic, for this project you can select simple names like PC1, PC2, and PC3.
    The machine name is stored as the value of the HOSTNAME environment variable.
    You should also create a file at /etc/hostname that contains the machine name,
    so that the computer will automatically check for its name at bootup.'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'On machine, configure and activate the ethernet interface. For example, on
    PC1 you would issue the command


    ```

    ifconfig eth0 192.168.1.1 up

    ```


    On PC2, the command would


    ```

    ifconfig eth0 192.168.1.2 up

    ```


    and on PC3,


    ```

    ifconfig eth0 192.168.1.3 up

    ```


    Once you have connected, named and numbered the machines, they should all be able
    to talk to each other. To verify this, do "ping test." On PC1, issue the command


    ```

    ping 192.168.1.2

    ```


    You should see output like:


    ```

    PING 192.168.1.2 from 192.168.1.1 : 56(84) bytes of data.

    64 bytes from 192.168.1.2: icmp_seq=0 ttl=225 time=5.785 msec

    64 bytes from 192.168.1.2: icmp_seq=0 ttl=225 time=415 msec

    64 bytes from 192.168.1.2: icmp_seq=0 ttl=225 time=412 msec

    64 bytes from 192.168.1.2: icmp_seq=0 ttl=225 time=426 msec

    64 bytes from 192.168.1.2: icmp_seq=0 ttl=225 time=412 msec

    ```


    This output continues until you press Ctrl+C to stop it.


    ping is a utility that sends a packet to the designated address at regular intervals.
    When the packet arrives at its destination, it is echoed back to the originating
    machine. If you get an error message or there is no output, there is a problem
    with your connection. Ping each machine from the other two machines to make sure
    that all the connections are working in both directions.


    At this point, it is useful to set up some basic name resolution that you don''t
    have to continue typing identical IP numbers. This network does not have access
    to a name server, there is a tradeoff for very small networks. On each machine,
    create a file /etc/hosts that contains these lines:


    ```

    127.0.0.1 localhost.localdomain  localhost

    192.168.1.1  PC1

    192.168.1.2  PC2

    192.168.1.3  PC3

    ```


    Save the file and edit the editor. Now, issue the command


    ```

    ping PC2

    ```


    instead of


    ```

    ping 192.168.1.2

    ```'
