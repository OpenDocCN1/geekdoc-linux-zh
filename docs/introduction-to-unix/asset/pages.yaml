- img_proc: true
  md: '# CHAPTER 5 Jobs and Processes


    should not be possible to start another program—much less work with one—while
    the original program is running.


    This problem is solved with the concept of foreground and background processes.
    When you give a shell command or start a program, the program is run in the foreground.
    It is your primary task, and takes over the terminal and system resources until
    it is finished. A program run in the background works differently. When you run
    a program in the background, the shell prompt returns as soon as the command is
    issued, allowing you to perform other tasks or use other programs while you are
    waiting for the background process to finish.


    The shell offers the ability to switch back and forth between foreground and background
    processes, to bring a background process to the foreground for interactive work,
    and to move a foreground process to the background if it is going to take a while
    to finish. This process manipulation is possible in shells, but is a particular
    feature of the bash used in this book. With a bit of practice, it is easy to adopt
    moving processes.


    To start a process in the background, simply issue the ampersand character at
    the end of the command line when you issue the command that invokes your desired
    program. That is, issue the command as


    ```

    command &

    ```


    The resulting output will look a bit different than when you issue the command
    without the ampersand. The shell prompt will return immediately, and you should
    see the message


    +   [1] 29098


    Messages like this are described in the next section of this chapter.


    The ability to run programs in the background, while useful, brings up some issues
    which must be resolved in order to avoid future problems. The first issue is simply
    the problem of getting access to the background processes. In order to work with
    foreground and background, you must be able to move processes between the foreground
    and background. You must also be able to identify all running processes so you
    know which process should be moved. The top command, described earlier, is useful
    for monitoring active processes but is not particularly helpful for ongoing process
    administration.


    The second issue involves handling output of foreground and background processes.
    If you run a program which produces output to the terminal screen, that output
    will print to the monitor whether or not the process is running in the foreground.
    The output from a background process can therefore interfere with, or interrupt,
    the output of a foreground process. Fortunately, this problem is easily managed.'
  merge: -1
