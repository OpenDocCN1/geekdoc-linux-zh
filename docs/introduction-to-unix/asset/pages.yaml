    # The set Command


    vi has a number of parameters that control its default behavior. Use these parameters
    to configure vi so that it works most efficiently by setting the value for the
    parameters using the set command. set takes the syntax


    ```

    :set argument-value

    ```


    where argument is the name of the parameter and value is the setting you want
    parameter to have.


    Some parameters have only two values: on and off. For these parameters, usually
    formatting options like autoindent or autowrite, use the syntax


    ```

    set argument

    ```


    or


    ```

    set noargument

    ```


    where argument is the name of the parameter. Adding the prefix "no" turns off
    the parameter, and issuing the name of the parameter turns it on. Table 7.7 shows
    some of the common user parameters.


    # vi Run Control Files


    While the set command can be used to change the value of a particular parameter
    during a given session, it is possible to set parameters so that they will provide
    the chosen settings every time vi is started. For many formatting parameters,
    this is extremely useful and will save time user settings each time you use the
    editor.


    Chapter 6: The Shell Environment introduced the concept of run control files,
    files which manage the way in which a particular program operates. vi


