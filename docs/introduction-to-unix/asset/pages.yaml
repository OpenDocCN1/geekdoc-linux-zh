  md: 'which will execute in different ways depending on the variable values set by
    the individuals running the program.


    Variables can be named anything, whether or not the name makes sense to a human
    reader, as long as the name is constructed of letters; while numbers can be used
    in variable name, those numbers often have particular effect in a programming
    situation and can cause unexpected results. If numbers must be used in a variable
    name, keep them to the end of the name as in VARIABLE3, rather than 3VARIABLE.
    Shell names are traditionally written in capital letters to distinguish them from
