    # Changing the Field Separator


    If whitespace is an inappropriate selection as delimiter for certain field types,
    it is easy to change. Suppose that you want to work with the /etc/passwd field,
    which stores its informations in fields separated by colons. Do this with the
    -F flag, specifying the character that you prefer awk as a delimiter. For example,
    if you want to take the first and third fields from /etc/passwd, use the awk command
    as


    ```

    awk -F '':'' ''{print $1 "\t" $3}'' /etc/passwd

    ```'
