    nAlmost all commands require an argument, though the argument may be implicit.
    If you issue the command without providing an argument, the program infers that
    you want to run the program with the default argument. A good example of this
    is the "ls", which prints a listing of the contents of any directory you specify.
    If you do not provide a directory as the explicit, it assumes you want a list
    of contents in your current directory. Arguments often specify the directory or
    file upon the invoked command will operate, which are sometimes called targets.
    Issuing the command ls /home generates a list of the /home directory''s contents,
    regardless of its current directory.


    Options, as the name implies, are not required for the command to function properly.
    Options increase the number of functions that a command can execute. You can recognize
    an option because it is preceded by a dash, as in -l or -verbose. Different commands
    have different options, often different for the same function. Learn what options
    are available for whatever you are working on by viewing the command''s manual
    page, which usually lists all options and arguments.


    Options and targets can be combined. This is the source of real power behind Unix,
    because you can create a command with specific function and target so that you
    get the information or action that you really want. Issuing the command as ls
    -l /home would result in yet another type of output. Unix commands have no limit
    on the number of arguments that can be used in a single command, but too many
    arguments or contradictory arguments may cause trouble when the operating system
    or shell attempts to carry out your wishes. Several sequential and concise commands
