    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_179_1.png)


    FIGURE 11.3 The layout of a hub topology network.


    As Ethernet hardware has become cheaper and is more easily purchased, hub networks
    have become increasingly popular regardless of network size. Many small home networks
    now operate on Ethernet hubs, as do very large networks in corporations or academic
    institutions. One of the reasons that topology is so attractive that it is easy
    to add or remove machines from the network simply by adding or removing a single
    cable from that machine to the hub. Under a ring or bus topology, the entire network
    may be affected as the central cable is rerouted.'
