  md: '# CHAPTER 11 Networking II. Fundamentals of Unix Networking


    Issue the command ifconfig without any arguments to see the current status of
    all configured network interfaces. On a machine without any active network connections,
    like the machine being added to this example network, the output will look something
    like this:


    ```

    lo Link:encap:Loopback

    inet addr:127.0.0.1 Mask:255.0.0.0

    UP LOOP RUNNING MTU:16436 Metric:1

    RX packets:20163 errors:0 dropped:0 overruns:0 frame:0

    TX packets:20163 errors:0 dropped:0 overruns:0 carrier:0

    collisions:0 txqueuelen:0

    ```


    lo is a network interface which the Operating system uses to talk to itself. The
    IP address visible in the second line, 127.0.0.1, is a special IP number that
    always refers to the current machine itself. In other words, regardless of what
    an individual machine assigned IP number may be, it also has a second IP number
    of 127.0.0.1 and thinks of itself in those terms.


    In order to use the ifconfig program to bring an ethernet connection, you must
    have superuser privileges. You must also know the new IP number which is assigned
    to that machine. With both those conditions, you can connect the machine to the
    network with the command


    ```

    ifconfig eth0 192.168.1.111 up

    ```


    The argument eth0 refers to the interface. The first ethernet interface card is
    referred to as eth0; should you have a second NIC, it would be called eth1. The
    command, issued above, tells the computer to assign the IP address 192.168.1.111
    to the first device, and then to activate it. To deactivate an ethernet device,
    issue the command


    ```

    ifconfig eth0 down

    ```


    The eth.x designation is Linux-specific. Other Unix variants use different designations.
    For example, FreeBSD uses the designation "ep.x" in the command ifconfig ep0 192.168.1.11
    up. Sun Solaris uses the designation "lex". Before check the documentation to
    see how ethernet interfaces should be named in the command.


    At this point, if you issue the ifconfig command without arguments, you will see
    a different output than you did before the new interface was configured.


    ```

    eth0 Link encap:Ethernet HWaddr:00:BC:BB:D0:7E

    inet addr:192.168.1.111 Bcast:192.168.0.255

    Mask:255.255.255.0

    UP BROADCAST MULTICAST MTU:1500 Metric:1

    RX packets:1480424 errors:217 dropped:0 overruns:213

    frame:217

    ```


    > Note:'
