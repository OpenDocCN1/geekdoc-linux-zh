    # Variable Interpolation


    The PATH variable example in the previous section provides an example of variable
    interpolation. Interpolation is the process which happens when one uses the variable
    with the $ operator to designate a place where the value of the variable is to
    be used. For example:


    ```

    ANIMAL="horse"

    echo "My favorite animal is the $ANIMAL"

    ```


    The output of these two lines would be


    My favorite animal is the horse.


    In this instance, the word "horse" has been interpolated in place of the variable
    name. This is fairly common in interactive scripts, and will be discussed in more
    detail later in this chapter.'
