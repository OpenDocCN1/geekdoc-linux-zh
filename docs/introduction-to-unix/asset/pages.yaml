  md: 'Shell programs are composed of variables and commands, along with other structural
    details. The variables used in shell programs can be environmental variables defined
    outside the program as regular shell values, or can be program variables constructed
    specifically for the program being written. Variables can be either scalar variables,
    containing a single piece of information, or array variables, taking several data
    points as the value. Variables must be named and their initial value declared
    before they can be used in a program operation.


    Once variables have been constructed, both the variables and their values can
    be used in program sections. The concept of flow controls most program scripts,
    defining how the program runs. There are two types of flow control: conditional
    and iterative. Conditional flow causes a particular code block to run only if
    a specified condition is met, while iterative flow control causes a particular
    block to repeat until a specified condition is achieved. There are a number of
    code constructs which can be used to manage both types of flow control.


