  md: '# Environment Variables


    # MAIL


    The MAIL variable defines the location where electronic mail is stored. This variable
    is used by your mail program and by the shell; the mail program uses this location
    to identify the file contains incoming messages, while the shell uses this variable
    if you have asked the shell to notify you when new mail arrives. The value of
    the MAIL variable is a path name, usually like


    ```

    /var/spool/mail/$USER

    ```


    Note that the path name uses the USER variable so that the entry can be the same
    for each person on the system. Each variable is invoked, the shell will look in
    your configuration for the value of USER.


    The bash shell prefixes variables with the $ character to draw a distinction between
    the named variable VARIABLE and the text string "variable."


    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_91_0.png)


    # PS1


    The PS1 variable contains the format of the bash system prompt. In addition to
    simple text strings, the bash prompt can escape sequences to represent particular
    information. Escape sequences are a way of representing generalized information:
    type of sub-variable, in a sense. For example, the escape sequence u represents
    the variable $USER, so the command


    ```

    export PS1 = "u"

    ```


    causes your user name to appear as the system prompt. Table 6.2 shows the various
    escape sequences which are valid for the PS1 variable''s value.


    # HOSTNAME


    This variable contains the name of the computer. The machine name is usually assigned
    when the operating system is installed, and is especially useful when working
    on a network which keeps different segments of the operating system on different
    machines.


    # PATH


    The PATH variable tells the shell where to look for executable programs when you
    type a command. For example, you use the ls command to get a directory listing,
    you are actually running a program which might have the full name of /bin/ls.
    The shell knows to look in the /bin directory because directory is part of the
    PATH variable''s value. To see the current value of PATH on your system, issue
    the command


    ```

    echo $PATH

    ```


    You will get an output that is quite long, containing a number of paths separated
    by colons.'
