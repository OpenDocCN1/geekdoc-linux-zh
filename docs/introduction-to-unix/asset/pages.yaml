  md: 'The diff command compares the files by checking each character in the first
    file against each character in the second file. If there are a number of differences,
    such as when the two files are completely different than being versions of the
    same file, diff''s output is piped to a file since it will be quite long.


    The du command prints output showing the amount of disk space occupied by a specified
    file or directory. If issued without a specific target, du will show the disk
    space consumed by the user using the command. It takes the syntax


    ```

    du [options] <file or directory name>

    ```


    du options include


    +   - b The size in bytes

    - c A listing of each directory and its size, including the total space used on
    the disk

    - h Uses common sizes, such as kilobytes or megabytes

    - k Uses kilobytes regardless of file or directory size

    - m Uses megabytes regardless of file or directory size

    - s Counts only the size of top-level directories

    - s Displays the size of the directory in which the command is issued


    The echo command prints a specified text string to the screen, and takes the syntax


    ```

    echo [options] <string>

    ```


    If issued without options or a string, echo will print a blank line. If issued
    with the syntax


    ```

    echo -n <string>

    ```


    echo will print the string without also printing a new line.


    The exit command ends the current shell process, and takes the syntax


    ```

    exit [<value>]

    ```'
