  md: '# Unix as Cultural Phenomenon


    development of the personal computer operating systems. In this section of the
    chapter, we cover the three major movements focused on Unix: the Free Software
    movement, the Linux and FreeBSD communities, and the Open Source movement. Although
    you may never be involved in the Unix community at a level deep that you "take
    sides," it is a good idea to learn what the major arguments are so that you can
    recognize them in conversation or in further reading.


    # The Free Software Movement


    The Free Software movement is attributable to the work of one man: Richard Stallman.
    Stallman was a programmer at the Massachusetts Institute of Technology''s artificial
    intelligence laboratory. In 1971, he and his lab team were working on a DEC PDP-10
    computer for which they had written an effective operating system. At that time,
    the culture of programming was open. People routinely shared software, and there
    was no concept that software could be "owned" by any one person or company.


    MIT purchased a new PDP-10 that asked Stallman to change over the DEC operating
    system rather than install the lab''s operating system. Stallman set to work but
    soon learned that DEC required him to sign a non-disclosure agreement before he
    could begin to work with their code. This upset Stallman mighty, since he felt
    DEC was trying to keep him from helping his fellow programmers by sharing his
    insights and innovations. Although non-disclosure agreements are now common, in
    part because software is such a lucrative field, in 1971 Stallman saw the request
    as a shift in the moral underlying computer programming.


    In response to this situation, Stallman began on a new project: an operating system
    that would be freely available and open to all. He called it GNU, an acronym for
    "GNU''s Not Unix." Stallman wanted to create an operating system that worked exactly
    like Unix but contained no proprietary software. In order to ensure that GNU could
    never become proprietary, he drafted a license that allowed others to use the
    operating system under certain constraints:


    +   - the software can be used for any purpose

    - the user has the right to copy and redistribute the software

    - the user has the right to modify the software and distribute the changes

    - the user must grant these rights to all subsequent users


    In other words, if you want to modify a piece of GNU-licensed software and then
    distribute your work, you must permit others to distribute it as well. This license
    is known as the GNU General Public License, or GPL, and there is a vast amount
    of software available under these terms.


    With the GPL in place, Stallman released the first piece of the operating system:
    GNU Emacs, a text editor. He felt that a good text editor was necessary'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'order to work on the rest of the system, GNU Emacs offered a number of features
    not found in other text editors of the time. This program is still in use today,
    and is covered in Chapter 8: Other Text Editors. After GNU Emacs was released,
    Stallman began to work on other software packages. Many of these programs became
    popular utilities among programmers and system administrators, and you will learn
    about several of them in this book. The popularity of GNU programs stemmed from
    three major features: they were free of charge, they could be compiled on just
    about all Unix systems,and—if they didn''t work for a particular system—they could
    be modified the source code was freely available.


    As software began to take off, Stallman found that he wasn''t the only working
    on the project. Many programmers began to use their free time to work on GNU software.
    These volunteers sent their work to Stallman, who would evaluate the code and
    wrap it into the "official" GNU releases. Other programmers started to release
    their own projects under the GNU license; some of these projects were incorporated
    into Stallman''s releases, and some were independent. No matter how the code was
    released, Stallman''s original vision was being born out. Programmers were openly
    sharing code and modifications without restraint.


    The GNU project became so successful that, in 1985, the Free Foundation was established.
    The PSF gave the GNU project an organizational structure and the ability to employ
    people to work on GNU projects and accept charitable donations. Learn more about
    the various projects under the Free Foundation umbrella by visiting their Web
    site: http://www.fsf.org.


    # Linux and FreeBSD


    As successful as the GNU project has been, it has not yet reached its goal of
    a stand-alone, fully functional, operating system. This is because Stallman has
    not yet finished the kernel, the part of the operating system that interacts directly
    with the computer''s hardware. Stallman''s design for the GNU kernel is based
    on advanced computational theory that proved difficult to implement.


    Fortunately, others stepped in to fill this gap. In 1991, a Finnish student named
    Linus Torvals began to work on his own kernel, a project that would eventually
    plug the major hole in the GNU software system. Torvals was unhappy with his IBM
    386 and the MS-DOS operating system, which was the state of the art at that time.
    He enjoyed working on his university''s Unix computer and wanted to have something
    similar on his personal machine, but soon learned that, if he wanted something
    like that, he''d have to write it himself.


    By October 1991, Torvals was far enough along in his project that he could see
    a lot of potential. However, he knew he couldn''t do all the work himself. Luckily,
    the Internet was popular enough on campuses at'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'point (though hardly visible in the non-academic world) that could tap a wide
    range of fellow computing enthusiasts for help. He posted a message to USENET
    newsgroup, informing people that his project was available for download and asking
    for suggestions. In the next few months, enough progress had been made on Torvalds''
    kernel that it could be called "fairly usable." The group continued to work, and
    the first official release of a stable Linux kernel came in 1994.


    By combining the Linux kernel with the array of utilities available from the GNU
    project, users now had access to a complete operating system that would run on
    personal computers, and it was fast. As time went by, other programmers could
    build bundles of software contained GNU software, the Linux kernel, and special
    programs that would install everything properly. These bundles, called *distributions*,
    are the way that GNU and Linux software is packaged today.


    Although most people call this operating system "Linux," Stallman has correctly
    noted that it should be called "GNU/Unix" since it includes components of both
    systems. While this is certainly true, "Linux" is now the common name for the
    package and it is the name used in this book.


    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_21_0.png)


    Today, there are a number of competing Linux distributions: over 100 at the last
    count. Each distribution has a different focus. Some are for profit, some are
    available at charge, some are designed for Macintosh computers, some for handsets,
    and others for any circumstance one can imagine. Three of the most popular distributions
    are Red Hat, Debian, and Slackware. Red Hat is designed for ease of use and installation,
    Debian, and Slackware aim to be as true to old-style Unix as possible.


    Of course, Linux variants are not the only PC-based Units. There are several distributions
    that are based on the Berkeley Software Distribution described earlier in this
    chapter. The most commonly used BSD variant is FreeBSD, which is free of charge
    and offers the source code to those who want to develop it further. Unlike Linux,
    however, FreeBSD is not covered by the GNU GPL, so some code may not be available.
    FreeBSD can be freely used, modified, and redistributed, nobody is under obligation
    to make the source code for modifications available. This means that FreeBSD can
    be used as part of a proprietary package; in fact, the latest version of the Macintosh
    operating system, MacOS X, is built on a FreeBSD


    The other difference between Linux and FreeBSD is that FreeBSD is developed by
    a small, closed group of programmers. While they take some contributions from
    the FreeBSD community, it is very different from the free-wheeling and open Linux
    development community. There are advantages to both approaches. In addition, FreeBSD
    is often preferred by those who want to have a "real Unix" on their machines,
    since FreeBSD and the other PC BSD variants use original BSD Unix code.'
  merge: -1
