  md: "# CHAPTER 15 Shell Programming IV: Signals and Status\n\nfor example, it was\
    \ a mathematical operation) or with the success or failure of the command. The\
    \ exit status is also sometimes called the return value because it is returned\
    \ after the command is finished. By using this value, you can cause your programs\
    \ to behave in different ways depending on the success or failure of a particular\
    \ command embedded in the program.\n\nConsider a simple flow control statement\
    \ that looks like this:\n\n```\nif [ VAR = 1 ]\nthen\n  <some action>\nfi\n```\n\
    \nEmbedded in the if statement of this fragment is an implicit use of exit status.\
    \ Remember that the square brackets represent a test command. The example could\
    \ be rewritten as\n\n```\nif (test VAR = 1)\nthen\n  <some action>\nfi\n```\n\n\
    The test command is a command like any other. As such, it returns an exit status.\
    \ In this case, it returns a value of zero if the expression is evaluating true,\
    \ and a value of 1 if it is false. This is consistent with the values that most\
    \ commands return.\n\nZero is the value returned when a command succeeds; any\
    \ other value represents failure. In most cases, the value for failure is 1, but\
    \ in some situations failure may be represented by other numbers if the program\
    \ distinguishes between different types of failure. These unusual values will\
    \ usually be described in the command's manual page or other documentation.\n\n\
    In the example above, a return value of 0 from the test command is interpreted\
    \ as a true condition by the if command. When the returned value is 0, the enclosed\
    \ code will be executed. A return value of 1 from the test command would be interpreted\
    \ as false, so the enclosed code would not be executed and the program would move\
    \ to the next non-positional block of code.\n\nIn other words, an if block written\
    \ as\n\n```\nif (0)\nthen\n  <some action>\nfi\n```\n\nwould execute. Since the\
    \ value is always a positive result, the action will always be performed. Consider\
    \ the code\n\n```\nif ( cd /<some_directory> )\nthen\n  ls\n```"
