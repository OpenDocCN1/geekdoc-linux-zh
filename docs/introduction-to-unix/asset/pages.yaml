    # Disk Management


    Next to working with users, working with the system''s hard disks takes up a great
    amount of administrators'' time. Disks, like any other storage medium, must be
    regularly cleaned and organized in order to work most efficiently. This is as
    as a desk or table as is of a single computer or a network.


    # What Is a Disk?


    A disk, at its simplest, is a storage device. There are removable disks, sometimes
    called floppies, which encase a thin flexible medium in a harder outside. Early
    floppies were quite large, and the 3.5" disk is the standard for removable disk
    media. Hard disks were originally rigid and very large; the earliest disk-based
    computers had little storage space in comparison with their size.


    Today, the names for storage media bear little resemblance to their actual construction.
    A disk might be a diskette, a hard disk, a CD-ROM, a DVD, a Mini-Disc, a Zip disk,
    or one of several other technologies. They are all recordable media, though, and
    may may all be used on the same network. When discussing Unix disk management,
    the implied disk is the computer''s hard disk.'
