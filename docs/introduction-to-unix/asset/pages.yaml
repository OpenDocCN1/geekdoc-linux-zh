  md: '# The GNU Emacs Screen


    The Emacs is divided into three parts. The biggest part of the screen is the text
    area. At the bottom of the screen are the mode line and the mini-buffer. These
    areas provide important information about Emacs and the file working on.


    The mode line is the highlighted in reverse color. If your terminal displays in
    black and white, the mode line will be black text on white background, rather
    than the normal white text on black background. The mode line displays information
    about the current buffer, such as its name and the segment of the file that is
    currently being displayed. The information in the mode line changes according
    to what is being done in the window.


    Directly below the mode line is the mini-buffer. The mini-buffer stores an echo
    of the most recent commands. Prompts will appear in the mini-buffer, as with other
    information and messages from the editor. Track your recent actions by keeping
    an eye on the mini-buffer.


    # Control and Meta Sequences


    The use of control and meta sequences is the main difference between Emacs and
    other text editors. These sequences are managed with the Ctrl and Alt (Esc) keys.
    Ctrl is called the control key because it is used in combination with other keystroke
    and does not have functions assigned to it. The meta key is Alt on most keyboards,
    some older terminal keyboards may use the Esc as the meta key.


    In Emacs documentation style, stroke combinations using these keys take a particular
    format: C-x. The Ctrl key is abbreviated as C-, and the meta key as M-. Thus,
    the key combination of Ctrl-a, is expressed as Emacs as Ca. The keyst combination
    of Alt and c is expressed as M-c. Tables 8.1 and 8.2 show common and meta sequences
    used to maneuver through text files and manage the Emacs screen.


    # Buffers


    Another difference between Emacs and other text editors is that most other programs
    hide much of their work behind the user interface. Emacs leaves everything out
    in the open, which adds extra elements to the user experience. One of these elements
    is the buffer, a concept common to all text editors but is hidden in every editor
    Emacs.


    The buffer is a safety valve. When a user works on a file in an editor, he is
    not working directly on the file as it was last saved to the disk. Rather the
    file has using a programming term which refers to any area of memory which is
    set aside for a program''s working data. When the file is saved, the contents
    of the buffer replace the data previously saved on the hard disk under that file
    name.'
  merge: -1
