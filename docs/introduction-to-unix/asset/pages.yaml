  md: '# CHAPTER 4 The File System


    On a small network or standalone machine, the various home directories will probably
    be kept in a parent directory called /home. The home directory is a subdirect
    of the root directory, and thus a top branch on the organizational chart of the
    machine''s files. A given user''s home directory is usually designated by the
    user name; that, if user "daria" has the home directory /home/daria.


    When a user logs into the account, she logs into her home directory and remains
    her location unless she explicitly moves to another location. That is, if she
    creates a new file, that file will automatically receive the name /home/username/filename.
    If you use any partial or relative path names to move to another file, these names
    will be interpreted as relative to your home directory.


    You can return to your home directory by issuing the command

    cd

    no matter where you are on the machine.


    > Note:


    # The pwd Command


    Although it is often safe to assume that you are in your home directory, the pwd
    command can be used to find your exact location. This command can also be used
    to learn the complete path of your current location if you need it to identify
    a file or return to that location at a later time. pwd is an acronym for "print
    working directory." Issuing this command generates output which contains the complete
    path to the current directory, as


    ```

