  md: 'This is lengthy output which contains a number of fields on each line. While
    it is relatively easy to read, it would be faster to strip away the fields which
    are not needed at the moment. In order to strip out every field except ID number
    and command invoked, use the command


    ```

    ps aux | awk ''print $2 \"t\$ $1''

    ```


    Note some unusual elements of this command syntax. First, awk elements are enclosed
    in curly braces. When using a shell context, the commands must also be enclosed
    in single quotes to prevent the curly braces from being interpreted by the shell.
    Second, the command includes an awk-specific metacharacter, "t". This metacharacter
    stands for tab character, which is inserted between the two desired fields. The
    metacharacter is enclosed in quotation marks so that it will be interpreted as
    such awk. Other awk metacharacters include "b" for a backspace, and "n" for a
    new line.


    With those syntactic elements in place, this revised command results in the output


