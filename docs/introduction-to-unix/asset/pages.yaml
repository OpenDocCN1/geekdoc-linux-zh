  md: '# The X Window System


    # IN THIS CHAPTER


    +   1. What is the X Window System?

    2. How X Windows works

    3. Features of X Windows

    4. Window managers and desktop environments

    5. Installing and starting X

    6. X Windows and networks

    7. Customizing the X environment

    8. X Windows and security

    9. X Windows and Adaptive user environments


    In many situations throughout this book, you have had the opportunity to work
    with Unix in two ways: at the shell command prompt, and through a graphical user
    interface. While most computer users are more familiar with graphical interfaces
    and find text-based prompts to be unusual or difficult to work with, these interfaces
    are relatively new. In the first decades of Unix, users could only interact with
    the operating system through the shell prompt, and that is why many programs and
    commands are still best used within the shell.


    In 1984, however, a new standard was issued that made graphical interfaces possible.
    This was a landmark year for computer users, as it was also the year in which
    the first Macintosh was released, also with a graphical user interface. (The first
    release of Microsoft Windows was still some years away.) The Macintosh interface,
    Unix graphical display, and Windows all stem from the same research done at the
    Xerox Palo Alto Research Center in the 1970s, but implementation of that research
    took different paths over the intervening years.'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'Graphical display on a Unix system is possible because of the X Window System.
    This is a graphical interface which underlies any user-level/ graphical interfaces
    installed on the computer, such as the desktop programs KDE, Gnome, or Xian. In
    this chapter, you will learn the theory behind the X Window System, how it works
    with user-level programs, and some administrative techniques for working with
    X.


    # # What is the X Window System?


    The X Window System is both a system and a standard. More precisely, the term
    X Window System can be applied to the standard and to any programs which implement
    it, which can be confusing in casual conversation. With other standards discussed
    in this text, the X Window System standard defines the way in which Unix systems
    create and manage graphical images which display on the user''s monitor.


    Unix itself not a graphical system and does not have the functions to render visual
    images on the screen (except for text). If you were to install a graphical program
    directly on top of Unix, the operating system could not draw the pictures necessary
    to use the program. This is where X comes in. X is an intermediary which acts
    as an interpreter between the operating system and the graphical software, allowing
    the two to work together in displaying visual images. The standard defines the
    various rules which graphical software must obey in order to have images rendered.


    Most Unix installations include an X Window System program as part of the default
    software. X is so critical to modern Unix system that it is difficult to find
    systems that do not run some version of X Windows. Commercial Unix variants probably
    run commercial X implementations or versions of X which have been written designed
    for personal computers use the X implementation FreeBSD86, which works with personal
    computer architecture rather than large servers and their specialized hardware.
    Although most versions of X Windows software are written for Unix, there are a
    few releases which can run under Windows as well.


    The current version of the X Window Standard is X11R6, the sixth revision of the
    eleventh version of the standard. Changes in X are slow, unlike some standards
    which are still under active development, and it is not likely that a new version
    will be released in the immediate future. Thus, any documentation you might find
    on the Web or in X-related books is properly valid as long as the book is relatively
    new.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# How X Windows Works


    The X Window System confuses many people because it is neither part of the operating
    system nor part of the user interface. Although X makes graphical user interfaces
    possible, it is not directly accessible for ordinary users. Because it holds this
    intermediary role, it is easy to forget about when describing the way in which
    the computer and user interact.


    X uses a client-server architecture, as shown in Figure 18.1. Client-server design
    is common in networking, as it reduces the overall system resource impact and
    allows machines across the network to share programs and hardware. In a system,
    the server process is designed to provide a given array of functions for individual
    clients. These clients may be on the same machine as the server, or may be connections
    from external computers. For example, a Web server provides requested files for
    client browsers, which connect across the network or Internet to the server.


    In the same way, the server provides the tools needed for a particular graphical
    process to individual client requests, usually coming from various userlevel programs.
    When you open an MP3 player on the desktop, for example, both the desktop and
    the player will call on the X server for assistance in rendering the new appearance
    of the screen to show the player and the desired skin on the player.


    Client-server architecture is remarkably stable. X uses this design even when
    running on a standalone machine, as it mimics the way in which a regular networkwork
    operates. If the server crashes, it is unlikely that the whole machine will crash
    with it; compare this to Windows, where graphics rendering problems can cause
    the entire system to lock up. Under Unix, the graphical interface crashes, you
    can solve the problem from a text prompt.


    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_289_0.png)


    FIGURE 18.1 A schematic showing client-server architecture.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Features of X Windows


    Separating X from the operating system has a number of benefits, as well as a
    number of features which are distinctly different from operating systems where
    the graphical interface is tightly enmeshed with the user experience. Because
    X is optional, it is self-sufficient and set apart from regular operating system.
    If a machine does not run graphical software, it doesn''t need an X server. Thus,
    the administrator of that machine does not need to configure or administer. X
    is resource-intensive, a machine without it will probably run faster and more
    efficiently than if the X server runs even when it is unused.


    When X is functional, it does require significant system resources. Given that
    graphical functions are inherently resource-intensive, X Windows is remarkably
    streamlined. One reason for this elegance is that the X System is designed for
    networks. The system must be simple enough that a number of clients can make sophisticated
    requests of the server without overloading its capabilities, but powerful enough
    to respond to multiple requests at once. Under networked X, for example, it is
    possible to display programs running on one machine on the monitor of another
    machine, as long as they are both connected to the server and properly configured.
    Although Windows NT now has this feature, and some Web-driven conferencing tout
    this as a major breakthrough, X has this capacity for years.


    Although X runs perfectly well on stand-alone computers, large networks may find
    it more efficient to run one X server and have individual clients connect to it,
    rather than each machine running its own X server. In fact, many hardware vendors
    sell X terminals as part of large cluster installations. An X terminal is simply
    a stripped-down machine with a network connection, a monitor, and some memory.
    These terminals connect to the X server to get their graphical display, and to
    other machines on the network for user functions.


    Another benefit of X is that, because it is a standard, individual interpretation
    of the standard should work well together. A heterogeneous network has machines
    running several flavors of Unix, each with its own client software, should still
    be able to use a single X server to manage displays on all the machines. As long
    as the individual variants'' X'' software meets the X standard, problems are minimized.


    # Window Managers and Desktop Environments


    If X is not user-level software, what is the software which provides the graphical
    user interface? There are three different program types that affect what you see
    on the screen: display managers, window managers, and graphical desktop'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# Window Managers and Desktop Environments.


    environments. Some machines use all three, while others use only two and still
    others integrate all the functions into one program.


    A display manager is the program which actually interacts with the X software
    on your machine. When you click an icon with your mouse, or open a new program,
    the display manager routes your request to the X client, which then makes a connection
    to the X server. The default X display manager is called, logically enough, xdm.
    (Depending on the graphical user interface installed on your machine, xdm may
    be replaced by a specialized program required by your GUI.) Display managers are
    not usually user-level programs. Although you can open the program, it is best
    to make configurations with specific tools rather than edit any xdm files directly.
    All managers with graphical capabilities have a functional display manager.


    A window manager is a form of graphical user interface. The window manager is
    a program which determines how various graphical elements appear on your screen:
    individual windows, icons, backgrounds or wallpaper, and so on. The window manager
    also controls the interaction between the items on the screen and any pointing
    devices installed on the computer, like a mouse or a tablet/pen pointing device.
    Some window managers are very basic, providing only a set of windows, each of
    which contains a shell prompt. Other window managers are quite elaborate and might
    be well called graphical desktop environments.


    Graphical desktop environments are complex user interfaces which offer a high
    level of configurability and have a number of integrated programs. The most popular
    desktops are KDE, Gnome, and Xianian (an offshoot of Gnome). Figure 18.2 shows
    the Gnome desktop. These desktops work just like the interfaces under Windows
    or Macintosh. They have Start buttons, icons on the desktop, status bars, various
    entertainment and configuration programs, and the ability to change appearance
    by applying new themes. If you are using a personal Unix variant, it probably
    installed a desktop by default.


    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_291_0.png)


    FIGURE 18.2 The Gnome integrated desktop environment.'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# CHAPTER 18 The X Window System


    What is is the basic difference between a window manager and a graphical desktop?
    After all, both have multiple windowing and user-configurable appearance. The
    difference is that a window manager is simply a way to manage multiple individual
    sessions, each in its own window, but you cannot drag and drop information between
    windows or use the mouse to move between directories. They are not native X functions,
    so the window manager can''t handle them. When using an integrated desktop, additional
    code allows these drag and drop actions. Although the two types of programs may
    look nearly identical, they offer very different approaches to programs and file
    management.


    In general, people who have extensive experience with Windows or Macintosh will
    find an integrated desktop much easier and familiar to use. Because desktops offer
    so many graphical system tools, it is possible to perform almost every Unix job
    through some desktop accessory. Window managers are better suited for users who
    are comfortable with the interface, and who don''t do a lot of work with the mouse.
    Users with slow computers or limited system resources may need a window manager;
    X already consumes a good portion of resources, and adding intensive graphical
    desktop may overwhelm the machine.


    You don''t have to run any of graphical interface at all. If the only want to
    do on your machine involves shell prompts and text files, then consider removing
    X client/server software completely.


    > Note:


    # Installing and Starting X


    In the vast majority of cases, the X Window Server should install as part of the
    operating system. In fact, X is often the first component to install; most modern
    Unix variants use a graphical interface, which requires X to run. If you see graphical
    elements on the screen, the X client/server software is working appropriately.


    Should these elements not appear, however, there may be a problem with the X server:
    Most problems with X stem from hardware conflicts. If your machine uses a video
    card or other hardware that X does not recognize, the server may refuse to cooperate
    with your machine. The only solution is to replace the offending piece of hardware.
    Frankly, this type of conflict is usually found only with cheap knock-offs, with
    not name-brand cards.


    X runs without any need for user interaction. Should you see the monitor freeze
    while you are working, chances that the X process has failed. There are a number
    of reasons why the server might crash, and none of them are reasons for panic.
    Simply press the Ctrl+Alt+Backspace keystroke combi


    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_292_0.png)'
  merge: -1
  pgno: 292
- img_proc: true
  md: 'nation to stop and restart the server, and you should be able to continue without
    a problem. Because X runs independently of the operating system, you won''t need
    to reboot.


    # X Windows and Networks


    As explained earlier in this chapter, the X Windows System was designed to be
    networkable. Because individuals clients access the X server to obtain the tools
    they need to draw their graphical elements, the X processes can be spread across
    multiple machines without significant degradation. Whether the local client connects
    to an X server on the local machine or to a server running on another machine
    on the network makes no difference to the client program.


    From an administrative point of view, this architecture is a benefit. A single
    machine can be dedicated as an X applications server, to which all the other machines
    on the network connect in need of X applications. As you will see in the section
    of customizing X, such a dedicated machine could also act as a font server, taking
    even more strain off the local user machines. In fact, the users could use all
    X terminals with no significant hard of their work; since Unix allows remote file
    systems to be mounted as if they were local, an X terminal display programs and
    files stored on a different machine.


    The trick to using X successfully across a network is to ensure that the environment
    variable DISPLAY is configured appropriately. This variable must be defined on
    both the client machines and the X server machine. With as other environment variables,
    you can check the current value of the DISPLAY variable by issuing the command


    ```

    echo $DISPLAY

    ```


    at the shell prompt. It is likely that the output will say


    :0


    or


    ```

    localhost:0

    ```


    Both of these values are fine, and will permit remote X use.

    Next, log into the X applications server. You can do this directly if you have
    physical access to the computer, or remotely with one of the remote access programs
    described in the networking section of this book. Issue the command


    ```

    export $DISPLAY="/local-machine-name\:0"

    ```


    at the shell prompt, substituting the actual host name for local-machine-name.

    This command enables the local, or client, machine to display whatever output'
  merge: -1
  pgno: 293
- img_proc: true
  md: 'would normally be displayed on the monitor of the server machine. In short,
    it changes the standard output of the server machine from its own monitor to the
    monitor of the client machine.


    In some cases, this simple export will not solve a miscommunication between the
    two machines. If you see an error message that says


    cannot connect to X-server


    then you must log out of the server machine. On the client machine, issue the
    command


    ```

    xhost +remote-machine

    ```


    where remote-machine is either the IP number or host name of the X server computer.
    This will identify the appropriate destination as an environment variable on the
    local machine, allowing X commands and output to flow between the two computers
    across the network. Reconnect to the X server machine, and reissue the command


    ```

    export DISPLAY="/local-machine:0"

    ```


    The connection should establish properly at this point.


    # X across the Internet


    At this point, a question may occur to you. Since X can be displayed across networks,
    since the Internet is essentially a very large network, can X be displayed across
    the Internet? The simple answer is yes, and it happens all the time. If a person
    on a Unix machine opens a Web browser and views a remote page, she has an X session.
    However, this is not a true X session since she has not configured her display
    to reveal the standard output of the remote machine; her browser is simply drawing
    the elements on the local monitor through a normal client/server connection.


    Instead, consider a situation in when a Windows user is connected to the Internet.
    This person wants to work remotely with a program or set of files on a Unix network
    in another country. Under Unix, this would be simple. The user would configure
    the remote output as described above, Since Microsoft Windows does not use the
    X System to handle its graphical display, though can the user work with the remote
    data? The answer is Broadway.


    Broadway is the code name for an element of the Window System which has been fully
    incorporated into the latest versions. Broadway provides Web-based X sessions,
    regardless of the operating system on the client machine. This works because the
    X standard and the HTTP standard have been combined to create a new subprotocol
    which uses existing HTTP formats to deliver content. The Windows user in this
    example can pull up the programs or files through her Web browser, run the X session,
    and out without installing new software, change her operating system, or waste
    time on tedious reconfigurations.'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# # Customizing the X Environment


    Configuring X software is something that is usually left to system or network
    administrators. Because the user experience with X is filtered through user-level
    software like graphical desktop environments or window managers, user configurations
    are made to those programs and not directly to X software itself. However, there
    are system-wide elements which the administrator can enhance or add, and which
    benefit all users on the network regardless of what end-user software they might
    prefer.


    # ## Fonts


    Next to the basic ability to draw graphical elements on the monitor, one of the
    biggest advantages of X Window System is the ability to use multiple fonts. Different
    fonts, or typefaces, serve different functions in X environment. Some fonts are
    used to label individual windows, others to label icons on the desktop or to make
    entries in menus, and others are user-selected within a program like a word processor.
    Fonts are used as elements of graphics and design components for Web pages, presentations,
    and other file types.


    Unlike Windows or Macintosh computers, though installing new fonts on a Unix system
    is not necessarily an easy task. Font installation is an administrative task,
    not an end-user job. Because fonts are a function of X, adding new ones or removing
    unused typefaces requires X configuration. Depending on your operating system,
    the individual steps required to install a new font will be different. The same
    general rules apply regardless of Unix variant, though:


    +   1. Identify and download the compressed font package from a font archive or
    a CD.


    +   2. Decompress the file. Read any documentation included in the package.


    +   3. Convert the font format, if necessary, to a format recognized by X. This
    is usually done by the **bdftofcf** converter included with the X software package.


    +   4. Create a new subsubdirectory of the fonts directory and move the new font
    to the new location.


    +   5. Rebuild the fonts directory. This is done with the X command **mkfontdir**.


    +   6. Define the new font''s path name in the appropriate X server configuration
    file.


    +   7. Configure the X server to recognize the new font path, by adding the path
    to the server''s environment variables.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# CHAPTER 18 The X Window System


    +   8. Save and exit any open text files.


    +   9. Restart the X server.


    Obviously, these steps are too general to use as directions for a specific installation.
    If you are administering an X server and need to know how to add new fonts for
    your particular server software and operating system, consult the documentation
    to learn the appropriate method. In particular, Solaris users should follow their
    documentation closely; Solaris, Sun''s personal variant uses a proprietary X server.
    Linux and FreeBSD use the XFree86 X server, with documentation and assistance
    can be easily found on the Web.


    # Font Servers


    Fonts take up a lot of space. Pictographic fonts, like those used for Chinese,
    Korean, and Japanese, take up even more space than character-based fonts like
    those used for English and other Western languages. Networks which provide a large
    range of fonts to users often face space concerns because of the intensive resource
    consumption. For networks running Linux, however, a new option has recently been
    developed: the font server.


    The font server separates font management from the basic tasks performed by the
    server and client software. Under a font server set-up, each individual machine
    on the Linux network could run its own X server and clients, but no fonts locally.
    Instead, when a new font was needed, the X server would connect to the network''s
    font server and obtain the necessary files to produce the desired typeface. For
    networks where many users work in pictographic or ideographic languages, a font
    server can be an elegant solution for storing individual font files on each workstation
    those fonts are needed.


    The drawback of the font server concept is that the software is somewhat unreliable.
    It is under active development, and continues to get better, but still is not
    an ideal and bug-free solution. For administrators who need the help that a font
    server can provide, it is a workable option now. For others, who would like the
    flexibility of a font server but are not in immediate need, it may be best to
    wait until the software is more advanced and connections are more seamless. Regardless
    of the amount of work required to install and operate a font server, however,
    the concept is exciting and will surely be portant to


    # Colors


    Although desktop environments and window managers do not handle font configuration,
    they do a very good job at managing color configurations. In fact, managing system
    colors is so much easier with a desktop environment than this is by configuring
    X directly that most people prefer to use the software and its multiple color
    tools. Some interface offer color picker tools, so that appropriate colors can
    be selected from a palette. In contrast, handling colors'
  merge: -1
  pgno: 296
- img_proc: true
  md: 'within X software requires that you know either the color name or its hex value.
    For those administrators who prefer to work directly with X, however, color management
    commands are relatively straightforward and easy to manage.


    In dealing with color, X''s primary function is to define default colors. These
    defaults apply to various screens like window borders, icons, typefaces, and so
    on. In addition, the various elements of a particular program might have default
    color selections take their values from the default X configuration. Change the
    values by changing the configuration for each element.


    For personal configurations, the values of these defaults are contained in the
    file .Xresources, stored in your home directory. (If you have never changed an
    X color, the file may not exist. You can copy the basic file from /etc/sk/.Xresources
    if necessary.) This file lists the configurable elements and shows the current
    color name associated with each. Administrators who want to make system-wide changes
    to X default colors should place a file for each configured window in the app-defaults
    subdirectory stored in the X tree, using the syntax of .Xresources.


    # Hex Values and Color Names


    When editing a color configuration file, X will accept color identifications in
    three versions: RGB, color name, and hex value. All colors on a computer screen
    are made up of a mixture of red, green, and blue. The RGB value is a name which
    indicates the precise amount of each color, as in rgb:FF/FF/FF. FF is the highest
    possible amount of color, and 0 is the complete absence of color. The color rgb:FF/FF/FF
    has the color name, and hex #FFFFFF. Although X uses RGB names as its native method
    of producing colors, it is easier to use hex names when editing various elements.


    Hexadecimal notation is a way of describing an individual color through a six-digit
    number. Some RGB values translate directly to hex, like white or black (rgb:00/00/00
    and #000000), while other values bear little resemblance to their hex equivalents.
    Anyone who works with Design is already familiar with hex values. The X name is
    the least specific value, and is thus the least reliable. The best way to work
    with colors under X is to consult a comprehensive color chart that shows X color
    name, hex value, and RGB value for each possible X. A number of such charts are
    available on the Web; consult the Internet Resources appendix for specific URLs.


    # Windows and Security


    This age of viruses and malicious behavior, it is sometimes startling to realize
    that basic software, integral to the normal user experience, is not secure. The
    client and server software used to manage Window System systems is one of these
    programs. X''s insecurity is due to several factors: it was developed'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# CHAPTER 18 The X Window System


    in a more trusty era, it is intended primarily for local network use; and it still
    permits connections through nonsecure programs like telnet. Despite these issues,
    X is so critical that workarounds have been developed to address the legitimate
    security concerns of administrators and users.


    Of all remotely accessible services that run on a network or individual machine,
    X is certainly not the most attractive. Cracking X does not grant Internet access
    for a cracker, nor does it unlock valuable files. Still, malicious attempts on
    X can result in local output being viewed by someone without appropriate clearance,
    including passwords, sensitive data, and the contents of open buffers. X settings
    can also be changed, sometimes with a virus-like program that causes system damage
    when the server is used. Crackers can interfere with active X sessions, closing
    down windows while users are working within them. Where gaining illegal access
    to remote machines makes something profitable, cracking X is more of a troublemaker''s
    pastime.


    If you are not a system administrator, there is little you can do about security
    as there is little you can do directly with X on your machine. For those who administer
    X on their networks, there are a few protective steps you can take to minimize
    the chance of an X crash and lessen the chance of truly damaging invasion. Luckily,
    these are the same steps you would take to secure the network in general, so there
    is little extra work involved in controlling over X functions.


    # Remote Access


    In the current era of networking, there is no reason to insure remote access software
    on any network with valuable content, including Internet access. (A constant Internet
    connection is as valuable as any data file to the cracker community.) If your
    machines permit telnet or login connections, stopping them are easily defeated
    and do nothing to protect passwords as they travel between local and remote computers.


    Instead, change every remote access on your network to require an SSH connection.
    Because SSH is a secure connection that employs encryption to scramble passwords,
    it provides much more control over people logging into your network remotely.
    SSH is easy to configure, and there are numerous SSH clients for every operating
    system that you may connect to your network. SSH also forwards X connections without
    alteration, so users can run remote X sessions through SSH without noticing the
    difference.


    # Ports and Access


    More specific security measures can be taken by restricting the ports which X
    connections use, and by limiting those machines which can have access. X uses
    ports 6000 through 6063 to manage remote connections to the server. If you shut
    down access to these ports, except for users from a defined range of IP numbers,
    you will go a long way toward stopping unauthorized use of'
  merge: -1
  pgno: 298
- img_proc: true
  md: 'X server. You can also configure the file /etc/x0.hosts. Machines listed in
    this file are the only ones allowed to access the X server; machines not listed
    in the file which attempt to connect will receive the error message


    Xlib: connection to machinename:0 refused by server

    Xlib: Client is not authorized to connect to Server

    Error: Can''t open display


    There are other ways to enhance X security which involve small bits of data which
    on an authorized machine''s hard drive. Since X is a vast and complex subject,
    there are a number of security methods which have evolved for various parts of
    the standard. The important thing to remember is that the X System is inherently
    insecure. Any attempts to lock down ports, restrict access ways or require security
    validation are tighten control over your network, but they do not change X into
    a secure system. With any other administrative issue, the best solution is to
    control what you can and keep a close eye on your system and your users.


    # X Windows and Adaptive User Environments


    For the majority of Unix users, the graphical capabilities provided by the X Window
    System are a delight. Graphical displays make it possible to use sophisticated
    software, pointing devices, and other visual and spatial elements which bring
    new levels to the Unix user experience. For a small but significant minority of
    Unix users, however, graphical elements are actually a distraction; in some cases,
    they can make Unix nearly impossible to use.


    Users who need adaptive software, such as designed for the visually impaired,
    often find that elements of graphical displays defeat the programs intended to
    make the computer easier to use. Many of the adaptive programs still were written
    before X, so they require a shell interface to provide workable data. When confronted
    with a graphical user interface, some of these programs cannot handle the new
    environment. Frankly, as concerns have been raised, new elements have been added
    to the X standard in order to meet the needs of the adaptive-software community.


    There are three main categories of disability which require adaptive software:
    low vision, blindness, and limited mobility. Users with low vision need screen
    magnification and other adaptations that enhance the display with high contrast
    and no extraneous background decoration. Blind users must rely on screen readers,
    programs which translate the standard output into spoken output or to Braille
    type. Users with limited mobility require the largest range of adaptation; some
    need only minor configurations to make the keyboard and mouse easier to handle,
    while others use a pointing'
  merge: -1
  pgno: 299
- img_proc: true
  md: 'device mounted on a headband or held in the mouth. Varying levels of fine and
    gross motor control can affect the level of adaptive assistance needed.


    The X Window System offers elements which address each of these areas. Various
    X has taken advantage of these hooks, including the graphical desktop environments.
    Keyboard configuration is particularly widespread, allowing users to determine
    whether a key will repeat when it will print. This is useful for those who move
    slowly. X also offers the StickyKeys option, which allows the keys in a keystroke
    combination to be pressed sequentially rather than simultaneously. X developers
    have done best with adaptations that involve time needed to complete a task or
    address motor control issues.


    Adaptations for visual impairment are not as easily integrated into market software.
    Because visual interpreters were not initially developed to a standard, different
    kinds of software interpret data in different ways. The X developers have addressed
    this issue by adding hooks into their programs so that a given hook can produce
    a consistent and repeatable effect.


    Whether or not you have a physical impairment that affects your ability to use
    a Unix machine, your network may have users who do. The administrator may be aware
    of adaptive needs using his user base, and keep on top of new advances in adaptive
    technologies. Sometimes, the best solution is the easiest. Most adaptive software
    still works with a plain shell interface, rather than an X-based graphical session.
    When possible, keep text-based on your system if it duplicates graphical programs.
    For example, keep the text-based Web browser Lynx available as well as graphical
    browsers Netscape or Opera. Working with your users to keep the network accessible
    is a good idea, both ethically and legally.


    Early users worked only in the text-based shell environment. With the development
    of the X Window System, however, X has expanded into graphical user interfaces
    and graphics-intensive programs. The X Window System is a standard which defines
    how graphical elements should be displayed on a monitor. It is also the generic
    name for software which implements the protocol. X users client-server architecture,
    which provides exceptional stability for machines. This architecture means X runs
    a process, and individual X-based programs connect to the server to receive the
    tools they need to draw individual graphical elements on the screen.


    X is built for networks, it is scalable and relatively frugal with system resources.
    Users can run a variety of software which takes advantage of X Windows, including
    the graphical interfaces window manager or desktop environments. Administrators
    can configure X to a wide range of character-based, photographic, and ideographic
    fonts for users, as well change the default system colors. Unfortunately, X has
    no security risks, but the advantages of the service far outweigh them. Reasonable
    security precautions should avert most possible trouble. X is also a critical
    part of designing adaptive software for users with disabilities.'
  merge: -1
  pgno: 300
