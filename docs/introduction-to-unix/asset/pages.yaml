  md: 'The text is general enough that it can be used with almost every Unix variant,
    and all the variants which are likely to be found in an academic setting. Of course,
    hands-on work is the best way to gain comfort with Unix, and we encourage students
    (and instructors) to consider installing Linux or FreeBSD on a spare machine.
    This allows students to explore root-restricted programs and functions, as well
    as demystifying the operating system through familiarity. Red Hat or Debian Linux
    and FreeBSD are the most user-friendly choices. If your academic set-up offers
    both graphical interfaces and text mode access, note that we have concentrated
    on text mode, or terminal window access, throughout the book, since it is hard
    to predict how many systems still run as text-only.


    # Acknowledgments


    Our thanks to the McGraw-Hill team who put this book together and shepaired it
    through the process. Particular thanks to Dan Silverburg, who acquired the project,
    and Diana del Castillo, who managed it. The entire team, from proofreading to
    production, was a pleasure to work with. The academic reviewers who viewed each
    chapter offered useful suggestions that made this a better text.


    As always, our thanks to David Fugate at Waterside Productions. Russ Allbery and
    Matt Gerber offered constructive suggestions and comments while we put together
    the table of contents and wrote the bulk of the book.'
