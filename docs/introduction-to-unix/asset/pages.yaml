    lar behavior patterns, you''ll be able to spot unusual or strange patterns in
    your logs and regular scans.


    The most secure systems restrict the behavior of individual users as much as possible.
    Configure permissions so that each user has the most limited permissions, and
    expand each permission as needed rather than global permissions and going back
    to crack down when there is a problem. Use user groups to sort your user base
    into segments which can be given access to certain programs but not others.


    Most internal security problems stem from bad user and administrative habits.
    Do your users routinely tape passwords to the monitor? Do they share passwords
    or accounts? Do they dial in home and let their kids surf the Web from behind
    the company firewall? Turning to administrative responsibilities, do you have
    strong and clear policies explaining passwords, account usage, disk space limitations,
    and other important topics? Do you remind your users of these policies regularly
    and make sure that new technology is still covered? Remember that it is always
    easy to make a policy looser, but is nearly impossible to make new restrictions
    on people who are used to doing what they want.


    # External Security


    Most people think of external security measures first when confronted with the
    idea of security behavior. External security software deals with intrusions into
    your network from outside. These are usually cracks from external networks like
    the Internet, which break into your system without proper authorization. The stories
    you see on the news are usually stories about external intrusion.


    The problem with external security is that it is the hardest element to control.
    You don''t know what the shadowy hacker halfway the globe is planning to do, or
    what he''s thinking. Your reaction must happen after the intrusion, because you
    do not know the person and cannot identify suspicious behavior before the problem
    occurs. This is why many external security programs and consultants use names
    that evoke locks, barred wire, lockdowns, and other physical images of barred
    entry. External security is focused on locking down as many points of entry, rather
    than on the motivation of the unknown intruder.


    There are some simple steps you can take to enhance external security without
    having to buy expensive software. First, shut down any services that you don''t
    need. If you don''t get a few, run a network server, and so on. Some services
    may be automatically configured when you install the operating system. You''ll
    need to scan your active processes to see what''s running and what can be stopped
    without affecting normal activity on the machine.


    Next, require that secure connections be used for any external connection to the
    machine. Replace telnet and login with SSH. Replace file programs with secure
