- img_proc: true
  md: 'Along similar lines, Digital Subscriber Lines (DSL) use phone lines to accomplish
    the same task. While using the same infrastructure as dial-up modems, DSL uses
    them in a different way. With the DSL technology, users get higher speeds and
    on-connections. They can also use the telephone and DSL connection at the same
    time, unlike a regular modem. Like cable modems, DSL technology is spreading as
    local telephone companies invest in the required hardware.


    Native networking functions in the Unix system allow a user to work on a machine
    across the network as if they were working directly on a keyboard plugged into
    that machine. Remote access and file transfer programs allow users to log into
    these remote machines, execute commands remotely, or transfer files between machines.
    The initial forms of these commands are still used, but security issues which
    may them an unwise choice. More secure versions are increasingly popular, and
    offer a better solution for remote access.


    Networks operate by transmitting packets of information between machines connected
    by wires or other interfaces. These packets are constructed according to the guidelines
    of the TCP protocol. The other major Internet protocol, the Internet Protocol,
    defines how machines are named and identified on the Internet. These machine names
    are composed of four sets of numbers between 0 and 255. However, because humans
    remember better than numbers, the Domain Name Service allows letter-based machine
    names to be translated into the IP numbers which the network recognizes.


    Network hardware ranges from simple modems to complex routers. These devices enable
    multiple computers, either, by dialing across a telephone line or connecting through
    a cable. Most people join a network by connecting their single computer for a
    temporary link to a larger web of machines, a portion of which may be machines
    which are permanently wired to each other and which have a constant link.


