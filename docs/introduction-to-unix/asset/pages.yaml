  md: '# Managing Users


    One of the most time-consuming administrative activities is managing the user
    base. Users must be added, deleted, monitored, and educated on a regular basis.
    The larger the system, the more time must be spent on users. Those who are simply
    running a personal Unix variant at home must manage users, since the most basic
    installation has at least two users: root and the regular user account of the
    machine''s owner. The root account should never be used for ordinary tasks, a
    separate personal account must be created.


    Depending on the Unix variant in question, the administrator may be able to use
    a specialized user management tools to handle regular tasks. On many systems,
    these tools use appealing graphical interfaces that allow mouse or menu use. However,
    it is always good to know how to perform administrative tasks at the command line,
    since the graphical interface may be missing or corrupted for some reason. When
    working on your particular machine, consult its documentation to learn the intricacies
    of any specialized software available to root.


    # Adding Users


    The most common user management task is adding new users. While Unix variants
    now offer convenient front ends to this process, you can add a new user directly
    at the command line. The process is more complex than with a graphical management
    tool, but it is still a straightforward job. To add a new user, you must create
    an entry in the /etc/passwd file for that person and assign a password, build
    the user''s home directory and all start-up files, and set any quotas or permissions
    necessary for that user.


    Almost every Unix variant has the useradd or adder program installed by default.
    This utility automates some of the tedium involved in building a new user account.
    The useradd program is discussed here, but adder works in almost exactly the same
    way. (See the manual page for further information.) At its most basic, useradd
    takes the syntax


    ```

    useradd [options] username

    ```


    That is, to create a basic account for the username synch, you would issue the
    command as


    ```

    useradd synch

    ```


    The useradd program creates a home and mail directory. However, useradd can not
    be used to define passwords. This is a good thing; password management should
    involve actual humans. You will have to define synch''s password by hand.


    Adding a new user with the basic useradd syntax still means that you have work
    to do. That command will not assign synch to any user groups, define sys'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'tem defaults, or provide any refinements to the account. Luckily, useradd options
    can be used to do all this (In fact, you can use useradd options to define the
    initial password, but it must be one that you select. useradd will not supply
    an initial password value.) The command


    ```

    useradd -g -G alpha gamma -s /bin/bash synch

    ```


    does quite a bit more than the basic command. With this command, the synch has
    been assigned to the primary group ''users'', but has also been assigned as a
    member of the user groups ''alpha'' and ''gamma''. In addition, synch''s default
    shell environment has been defined as bash. Table 16.1 shows other options that
    can be used with useradd.


    # Deleting Users


    Removing users is even easier than adding them. Why you would want to remove a
    user? There are several reasons for this. The user may no longer work or study
    at the site which hosts the network; the user may have violated some policy, causing
    her to be banned from the network; the account has had a security breach; or you
    have misspelled the user''s name when creating the new account. All of these,
    and many others, are valid reasons to remove a user account from the system.


    In the case of a security breach or a system policy, you may want to disable the
    account instead of removing it. Disabling the account means that the user cannot
    access it, but her files remain intact and all group and user IDs remain in force.
    E-mail sent to that user name will also be stored rather than having bounce because
    the username no longer exists. The account can be re-enabled when the problem
    has been repaired or any punishment for the violation is complete.


    # Table 16.1: adduser Options


    | Option | Function |

    | - | - |

    | -homedirectory | Defines the path for the user''s home directory |

    | -e date | Defines the date upon which the account will no longer be valid, taking
    the form YYYY-MM-DD |

    | -g groupname | Defines the user''s primary group |

    | -G groupname(s) | Defines any other groups to which the user will belong, separated
    by a comma only |

    | -p password | Defines the initial password assigned to the user |

    | -s shell | Defines the default shell environment |

    | -u number | Defines the user''s login ID number; if this option is not used,
    the number is automatically assigned'
