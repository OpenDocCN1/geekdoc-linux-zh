  md: '# Line Addresses


    Any sed command can take, as a prefix, a line number or range of line numbers.
    For example, if you want to restrict the editing action to a particular line in
    the file, just issue the command with that line number. In the command given above,
    the replacement could be limited to the fourth line of the file by changing the
    command to


    ```

    sed ''4s/IP/Intel Pentium chip/g''

    ```


    In this case, the sed command would go directly to the fourth line of the file,
    execute the substitution, and exit. To execute on multiple lines, issue the command
    as


    ```

    sed ''4,14s/IPC/Intel Pentium chip/g''

    ```


    The substitution will be executed on lines 4 through 14 of the file. It is also
    possible to group several commands and associate them with a range of line numbers,
    as in the complex command


    ```

    sed ''4,22 (

    s/IBM/International Business Machines/g

    s/Sun/Sun Microsystems/g

    s/DEC/Digital Equipment Corporation/g)

    )'' unix.txt''

    ```


    Obviously, this command is not something to be issued at the command line. However,
    complex sed commands like are commonly found in shell programs.


    # sed Scripts


    Once you start constructing complex sed commands, it becomes much easier to work
    with the commands when they are contained in separate files. When each complex
    construction is kept in its own file, the file can be invoked as part of the sed
    command. If the complex command above was saved to a file named sedcommands, for
    example, it could be invoked with a command like


    ```

    -f sedcommands unix.txt

    ```


    Note that, when saving the command to its own file, a target file text should
    not be specified. The target is specified when the actual sed command is constructed.
    This permits use of a given complex sed command on multiple target files without
    having to reconstruct the command for each individual target file.


    # sed Commands


    In addition to the search-and-replace substitution command, sed offers editing
    commands which allow specified strings to be deleted, appended, or inserted into
    the target text file. Unlike the substitution command,'
