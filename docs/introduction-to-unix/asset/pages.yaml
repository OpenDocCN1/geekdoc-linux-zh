    # Windows


    Using buffers in the manner described below will move sequentially from buffer
    to buffer, but displays only one buffer at a time. It is possible to have multiple
    buffers at one time, using the Emacs window. "Windows," in this sense, does not
    refer to the type of windows found in graphical interfaces, but rather to a simple
    division of the screen into multiple work areas.


    Windows can be useful in several situations. One of the most common uses is for
    a side-by-side comparison of two files, or of two parts of the same file. The
    window can be split vertically, as in Figure 8.3, or horizontally, as in Figure
    8.4.


