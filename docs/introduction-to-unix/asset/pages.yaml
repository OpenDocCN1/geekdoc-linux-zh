  md: '# Unix History and Background


    The world of computers is vastly different today than it was fifty years ago.
    Were it possible for you to visit a computer laboratory in the mid-1950s, or for
    a scientist from that lab to visit you in your classroom today, it might seem
    like you were not speaking the same language or performing the same tasks. The
    biggest difference is in the size of the computers; where the original computers
    took entire rooms, you can do your homework on a desktop or laptop machine, or
    even on a computer small enough to fit in your hand. As the size of a computer
    has dropped, the amount of memory in the machine, and the speed of its processor,
    have grown dramatically.


    Apart from the physical differences between these early machines and the machines
    used today, there are significant differences in the way they work. In fact, the
    original computers did not have operating systems. To those who came of age in
    the modern era of computing (roughly defined as anything after 1980), this is
    nearly unimaginable. The concept of an operating system, however, did not appear
    until well after computers were established as useful machines and not merely
    an unusual fad.


    If there was no operating system, how did the machines work? In the earliest days,
    the computer operator had to set up the machine to perform a particular task.
    That is, if the computer was needed to sort a batch of data, the operator would
    manually configure the computer''s electric for


    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_14_0.png)


    FIGURE 1.1 Early computers, such as ENIAC, far less computing power than the average
    laptop available.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Unix History and Background


    The circuits needed to be changed for each different job. Obviously, this took
    time and effort, but it was justified by the fact that changing the circuits was
    less work than it would require to do the computing task by hand. Most computers
    were configured to perform one job and were rarely reconfigured. This was the
    most efficient use of computing power, but didn''t allow for much flexibility.


    Compare with computing today. Now, we use small computers to perform a vast array
    of tasks, and can change from job to job without opening the machine, adding new
    hardware, or cutting off the power. The giant machines of the past are in museums
    or being sold on eBay. While we did not have room-size computers to laptops overnight,
    the change has been rapid. Those fifty years have been exciting scientifically
    and historically and have affected the world''s population more deeply than any
    other 50-year period of technological change.


    # The Rise of the Operating System


    One of the driving forces before the advance of computer technology is the desire
    to conserve effort. Computers were designed as timesaving devices, meant to free
    up human hands and for other, less tedious, work. It is easy to characterize this
    desire as "laziness," but not in the sense that sitting down to watch eight hours
    of evolution is lazy. Rather, the desire grows from a dislike of inefficient or
    repetitive work and a need to eliminate unnecessary effort. If you have to open
    your computer and change the wiring every time you want to do a different task,
    you will spend a lot of time with your head inside the machine rather than using
    time to get work done. Consequently, computer scientists are always looking for
    ways to get the computer to do its own work, conserving their efforts.


    While it''s fun to debate whether this is the greatest labor-saving innovation,
    most lists will include the development of the operating system. An operating
    system is a program whose function is to enable other programs to use the computer''s
    hardware. The advantage of this system is clear: instead of creating programs
    that require use of specific hardware, programmers can write programs that make
    use of the operating system. This saves time and effort, since the operating system
    is a known entity. It also removes the need for a human operator to reconfigure
    the machine for each step in the process.


    Consider the popular financial program Quicken. You can buy for Windows and install
    it on any kind of computer, as long as that computer is running the Windows operating
    system. It doesn''t matter what the specific hardware configuration is; as long
    as Windows runs properly, Quicken will too. In contrast, without an operating
    system, a program like Quicken would have to be rewritten for each individual
    computer because the hardware configuration changes from machine to machine.'
  merge: -1
