    # cp


    The cp command copies a named file to a new location, leaving the original file
    in its original location. cp takes the syntax


    ```

    cp <file 1> <file 2>

    ```


    where <file 1> is the original file and <file 2> is the target file. Do not use
    the name of an existing file as <file 2> unless you are prepared to have the contents
    of that file replaced by the contents of <file 1>.


    # crontab


    The crontab command to manage cron files, which are used for automated administrative
    tasks. This command edits the contents of the /etc/crontab file, and takes the
    syntax


    ```

    crontab [-u <user>] [-l|-r|-e]

    ```


    crontab has several options, including


    +   -u Defines the user who will specify the command. The default is the user
    issuing the crontab command

    -l Prints contents of /etc/crontab to the standard output

    -r Removes the entire contents of the current /etc/crontab file

    -e Adds the specified entry to the data already in /etc/crontab


    # date


    The date command prints the current time and date to the screen. If issued by
    the root account, the date command can also be used to set the system time and
    date. It takes the syntax


    ```

    date [options]

    ```'
