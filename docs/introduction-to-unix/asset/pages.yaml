- img_proc: true
  md: '# CHAPTER 1 What is Unix?


    SysV and BSD Units differ significantly in the way that they handle the configuration
    of various tasks that must be executed when the system is started up. BSD systems
    use a simple start-up program, while SysV uses a more complicated method that
    provides far more flexibility. There are several other aspects of the SysV/BSD
    incompatibility that are beyond the scope of this book, since they deal with the
    low-level elements of the computer''s operation. For our purposes, the differences
    at boot will be described in detail. Table 1.1 shows some of the more popular
    Unices, sorted into BSD and SysV columns.


    Since that original fork in the Unix family tree, there has been some development.
    Sun MicroSystem''s Solaris Unix, for example, combines elements of both SysV and
    BSD. Linux also offers elements of both styles. There is no consensus that one
    style is better than the other. Both systems have adherents and detractors, and
    it ends up being a matter of personal choice. However, it''s good to know how
    both kinds of Unix in the event that you are confronted with an unfamiliar flavor
    of Unix.


    # The Unix Philosophy


    Regardless of the type of Unix being developed, those who work on Unix variants
    have always subscribed to a set of principles that reflect the original theories
    behind Ritchie and Thompson''s work in the late 1960s. Over the years, programmers
    have taken care to maintain these design concepts and incorporate them whenever
    new features are added. These points are so critical to the concept of Unix that
    they have taken on the character of a design philosophy:


    Keep it small: the typical Unix system is composed of many small programs. Small
    programs are easy to understand, maintain, and improve. While each component may
    not be particularly powerful on its own, small modules can be combined into complex
    objects. Clever programmers can often find new uses for existing modules.


    | TABLE 1.1: Some Unix Variants Sorted by BSD or SysV Heritage |

    | BSD | SysV |

    | --- | --- |

    | OpenBSD | AIX |

    | FreeBSD | HP/UX |

    | BSD/OS | Linux |

    | NetBSD | SCO Unix |'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'Keep consistent: the modules that make up a Unix system tend to interact with
    each other in consistent ways. For example, every element of a Unix system is
    represented as a file. Every text file, program, every piece of hardware, and
    every other system element can be dealt with as a file. This consistency makes
    it easy to deal with all the elements of the operating system.


    Keep it configurable: all Unix programs can be made to behave in many ways as
    you can think of. Users can control the look and feel of their interface; administrators
    can configure system-wide behaviors; programmers can adapt or modify system functions.
    It is a rare Unix program that doesn''t have multiple configuration options.


    Keep it non-captive: Unix programs seek to avoid the "captive user interface."
    This means that programs do not assume the end user is always a human. Consider
    a Web browser; it does not work independently, but expects you to enter commands.
    In the Unix world, programs make use of other programs to generate input or process
    output. Whenever possible, Unix programs include a non-interactive mode that makes
    automation possible without human input.


    Keep it automatable: the idea of non-captive interfaces is related to the idea
    of automation. Unix administrators prefer to automate whenever possible, and Unix
    provides the means to do so. Commands can be encoded in a script or program that
    will run the commands automatically, and provides a task schedule to make use
    of downtime.


    With these principles in action, Unix programmers have developed a robust system
    that can be used in a vast array of situations: end users, automation, factory
    management, scientific testing, and many others.


    Although Unix is less than fifty years old, its history is surprisingly complex.
    The earliest computers were programmed by manually moving electrical connections
    within the machine. The first operating systems were written for individual computers,
    and were simply the software equivalent of moving the internal wires. In the mid-1960s,
    two programmers at AT&T''s Bell Labs created a method to move software from one
    computer to another; this method resulted in the Unix operating system and the
    concept of a compiler.


    When the federal courts declared AT&T a monopoly, the company had to give away
    Unix as part of its penalty. The company later began to charge for the operating
    system, leading to a springer in Unix development. Over the next twenty years,
    a number of Unix variants were created, and the Unix community began to separate
    into philosophical and technical subcommunities. Unix variants themselves fell
    into either the SysV or BSD category, depending on the code that was used to build
    the basic system. Regardless of the factor or beliefs that produced each variant,
    however, all Unices adhere to several general principles, including size and consistency.'
  merge: -1
