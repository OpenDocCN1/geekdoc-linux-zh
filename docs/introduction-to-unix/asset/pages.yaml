    # Network Printing


    One of the key features of the Unix environment is networkability. CUPS makes
    networking printers a much easier process than in the past. Some printers have
    built-in ethernet capability, while others can be attached to a machineynet which
    is, in turn, accessible to the network. No matter how the printer is networked,
    CUPS allows you to have a single printer which can be accessed and used from multiple
    points on the network.


    The most basic method of configuring clients to use this service is simply to
    do nothing. CUPS will recognize any available printer on the same subnet within
    30 seconds of its being brought online. For this to work, both the client and
    the server must be on the same subnet. That is, the first three numbers of each
    machine''s IP address must be the same.


    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_284_0.png)


    | Option | Function |

    |---|---|

    | Print Test Page | Prints a test page |

    | Stop/Start Printer | Toggles selected printer on or off |

    | Accept/Reject Jobs | Allows or throws new jobs in the print queue |

    | Modify Printer | Opens printer information dialog |

    | Configure Printer | Offers further configuration options |

    | Delete Printer | Removes printer profile from configuration |'
