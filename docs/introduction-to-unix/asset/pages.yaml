    Case Sensitive programs consider capital letters to be different than lower case
    letters. For example, a case sensitive system does not recognize A and a in the
    same way. Many programs are case sensitive and insensitive, as with the Web Apache,
    which can be configured to ignore case in URL requests. However, some systems
    are critically sensitive by default.


