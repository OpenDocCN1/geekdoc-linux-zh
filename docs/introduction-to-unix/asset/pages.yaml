  md: '# CHAPTER 2 Basic Unix Concepts


    services are available through commands that are designed to be embedded into
    programs; programs that will eventually be run by humans or by other programs.
    These kernel commands are called system calls because the programmer is calling
    upon the system''s services when she uses one of these commands in her program.
    The set of all acceptable system calls is referred to as the Programming Interface,
    or API.


    Every operating system has its own API, as many large-scale programs Before a
    programmer begins work on a program designed for a particular operating system
    or a module for a particular software environment, he must familiarize himself
    with the API for that programming environment. Calls that work under one system
    or program may not work with another, or may have unintended effects.


    # The Shell


    Although the kernel is remote by design, the user interfaces described above make
    possible to use the computer. Without the user interface, the computer would be
    a mildly unattractive box sitting on the desk or floor, or it would be neither
    accessible nor popular. On Unix systems, the user interfaces are shells.


    The term "shell" is generally used to describe a text-based user interface, as
    those traditionally functioned on Unix systems. In the last five years, however,
    graphical user interfaces, or GUIs, have become increasingly popular on Unix systems.
    GUIs are the interfaces that offer multiple windows, mouse interaction, and attractive
    visual decoration. Microsoft Windows and MacOS have used graphical user interfaces
    from the beginning, but GUIs are a latecomer to the Unix community. A GUI could
    be considered a shell in a technical sense, but the term is not used commonly.
    Many people run (text-based) shell sessions within a window on a graphical desktop
    in order to exploit features of the text-based interaction.


    As the name suggests, the shell acts as the operating system''s outer layer. Like
    the shell of a clam or a nut, a user sees the shell instead of the vulnerable
    contents. There are several types of shells, and an even bigger number of individual
    shells within each type. Unix variants, each shell is slightly different, but
    they all function in the same general manager. No matter what the quirks of any
    shell may be, the shell provides an interactive environment for the user to work
    with the operating system and to issue commands that ultimately determine the
    kernel.


    Most text-based shells are operated with keystrokes. As Figure 2.1 shows, the
    shell usually provides a command prompt and a cursor. Enter your commands by typing
    them on the keyboard and press the Return or Enter key, and the shell will begin
    to process the request, passing on the required system calls to the kernel.'
