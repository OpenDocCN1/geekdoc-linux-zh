  md: '# Ethernet Networking


    Most modern LANs are built around the ethernet concept. Ethernet is a term which
    was coined in 1972 at the Xerox research center in Palo Alto, California. The
    term refers to a network of machines connected by dedicated wires that carry nothing
    but data. Signals sent over an ethernet network are sent to all machines on the
    network; those signals are ignored by machines to which the signals are not addressed.


    These signals are coded with the individual machine''s hardware address, a unique
    number which identifies that machine alone. The hardware address, also sometimes
    called the MAC, or Media Access Control, is not the same as an IP number. The
    hardware address is coded into the network hardware by the manufacturer and cannot
    be edited or changed by the end user. The developers of Ethernet thought that
    this method of data propagation resembled the Victorian idea of a "luminiferous
    ether" which was thought to carry electromagnetic waves throughout the cosmos;
    those we call "ethernet."


    Today, for a network of dedicated wires to be considered, it must conform to the
    standard codified as IEEE Number 802.3. This standard governs the way in which
    information is carried over the network. As long as the network conforms to that
    standard, it is considered to be an ethernet network regardless of the hardware
    involved. Indeed, ethernet networks use a variety of physical media, including
    coaxial cable, twisted twisted pair cable (similar to telephone cable), and fiber
    optic cable. Of these options, twisted pair cable is both affordable and widely
    used.


    Twisted pair cable comes in many varieties, but two types are most popular: Category
    3 cable and Category 5 cable. The two types are basically the same, except that
    Category 5 is thicker and can carry data further before the signal begins to degrade.
    Each end of a twisted pair cable terminates in a modular plug that looks like
    the modular plug used for a telephone jack, slightly larger. This plug is called
    RJ-45. Most Ethernet Interface Cards sold today have a compatible RJ-45 jack.
    One of the cable plugs into the card, and the other into which also has RJ-45
    jacks.


    In contrast, ethernet networks which use coaxial hubs connect all the computers
    in a bus configuration, using the thicker coaxial''s capability to handle vast
    amounts of data in a relatively rapid manner. Coaxial cable is the same wire used
    to bring television into your home. It is relatively cheap, but is less flexible
    than twisted pair and is harder to conceal under carpets or inside walls.


    Fiber optic networks use a hub, like a twisted pair, but it must be a hub specially
    designed for fiber optic use. Fiber optic cable uses pulses of light, rather than
    electrical signals, to carry data through the network.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# 169


    technology is still quite new, and anyone wanting to build a fiber optic network
    must invest large sums in specialized hardware. Because coaxial or twisted pair
    ethernet is affordable, there is no real incentive to switch to fiber optic technology
    for the vast majority of networks.


    Ethernet can carry data at high speeds. The slowest type of ethernet data at a
    maximum rate of ten megabit (10 million bits) of data per second. By contrast,
    the fastest dial-up modem carries data at a maximum rate of 56 kilobytes (thousand
    bits) per second. However, there are also varieties of ethernet that can carry
    data at rates up to ten gigabits, or 10 billion bits, per second. The 10 gigabit
    ethernet is a new standard, and operates only over fiber optic hardware, but most
    conventional hardware can be used to transmit and receive data at 100 megabit
    or 1 gigabit per second.


    Though these numbers are impressive, most networks will operate slower than the
    maximum rating for their hardware. Network speed is very closely tied to network
    traffic. A busy road at rush hour, the more bits that are flying around the network,
    the more they tend to collide and slow each other down. Even though effective
    speed is always lower than maximum rated, fast network hardware on a congested
    network will still result in a faster user experience over slow hardware on a
    relatively clear network.


    # Configuring Ethernet under Unix


    Building an ethernet network on a set of Unix machines is straightforward. Assume
    that you have an existing network and want to add a new machine. This new machine
    has an appropriate network identification card installed, and has been attached
    to the network hub with a Category 5 twisted pair cable. All that remains is to
    "turn on the ethernet" by configuring the machine and hub to recognize each other.


    This configuration is done with the ifconfig command. Although the syntax used
    with ifconfig differs from Unix variant to variant, the command works in the same
    way on all machines. ifconfig is a powerful command with a myriad of uses. For
    the purposes of this chapter, only a few functions of ifconfig are used. To learn
    more, refer appendix A or see the ifconfig manual page by issuing the command


    ```

    man ifconfig

    ```


    at the shell prompt.'
