  md: '# Shell Programming III:

    Regular Expressions


    +   1. What is a regular expression?

    2. grep

    3. sed

    4. awk


    One of the more common tasks found in shell programs is the parsing of text.

    P is the act of analyzing text for certain specified words, phrases, or patterns.
    Obviously, a computer cannot understand the meaning of words or phrases in the
    same way that a human can. However, there are mechanisms which can be incorporated
    into a program that can identify and match particular strings of characters or
    other patterns in the text.


    Pattern matching, in shell programs, is done with regular expressions. A regular
    expression, also known as regex or regexp, is a symbol which stands for particular
    textual strings. Using these pattern-matching operators, you can specify the kinds
    of characters to be matched, the number of characters to be matched, their position
    in the text string, and so on.


    For example, assume that you want to print out a list of all the files in your
    home directory that have the suffix .txt. This is a simple pattern-matching operation
    used in conjunction with the ls command. At the shell prompt, issue the command


    ```

    ls *.txt

    ```


    The command returns, output a list of all files with the .txt extension. The asterisk
    used in this command is a pattern-matching operator which means "any combination
    of zero or more characters."'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# CHAPTER 14 Shell Programming: Regular Expressions


    In situations, the pattern-matching operator can be called a **metacharacter**,
    because it is a character which refers to other characters rather than acting
    as itself. That is, the asterisk used in


    ```

    ls *.txt

    ```


    command is not a literal asterisk; instead, it represents any other string of
    characters that fits its definition. As GNU Emacs uses the *metakey* in constructing
    keystroke commands, the metacharacter used in regular expressions is a symbolic
    representation of actual values.


    **.txt* component of the example command is a regular expression. The full value
    of this expression could be described as "any of zero or more characters, followed
    by the specific string ''*.txt". This pattern can match any file name from the
    bare. If the file contains not the ''*.txt'' component, it will match this regular
    expression. Such an expression is very broad, and may match a large portion of
    the searched dataset, but it is still useful for quick searches or in situations
    you might know the type of filename but not the specific name.


    In addition to the asterisk, there are a number of other pattern-matching operators.
    The specific function of these metacharacters depends on the program in which
    they are used. However, many of these metacharacters function in the same way,
    regardless of the program. This is due to common practice among those who develop
    regular expression programs, and to the rise of the POSIX standard. This standard
    governs a number of programming conventions, including the use of regular expressions.
    In the sections that follow, introduce various programs utilizing regular expressions,
    individual metacharacter behavior is described for each program.


    # grep, sed, and awk


    Most metacharacters, unlike the asterisk, are not used directly at the shell prompt.
    Instead, they are used within programs which have been written specifically for
    the purpose of processing regular expressions with a standard syntax. The most
    important of these programs are the Unix utilities **grep**, **sed**, and **awk**.
    Each of these programs is distinct, but together the trio works to accomplish
    a wide range of text-processing tasks.


    Commands using these utilities, and their related metacharacters, can be issued
    at the shell prompt or within a shell program. They are particularly useful when
    searching through a lengthy file for a specific entry or value. For example, you
    might write a system administration program that requires a particular value taken
    from a lengthy log file. Using a regular expression is the easiest way to automate
    the search.'
