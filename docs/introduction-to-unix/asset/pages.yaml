  md: '# Special Variables


    As mentioned earlier in this chapter, there are some restrictions on the characters
    that can be used in variable names. The reasons for some of these restrictions
    are obvious. For example, the mathematical operators (+, -, and the like) are
    reserved for mathematical operations within the shell program. Likewise, comparison
    operators such as <, >, = are restricted because they indicate particular operations
    that take place within the shell program.


    However, there is an additional set of symbols that cannot be used in variable
    names because they are already used as a set of existing variables. Variables
    have pre-defined meanings which can serve shorthand when writing shell programs.
    For example, the $ variable represents the process identification number of the
    current shell. If you wanted to see the value of the $ variable within the program,
    you could insert the line


    ```

    echo $$

    ```


    With any other variable, to use its value the variable name must be prepended
    with the $ . The $ operator is distinct from the $ variable. Table 13.1 shows
    the special variables which exist under the bash shell.


    # Conditional Flow Control


    With this understanding of variable construction, it is time to turn to variable
    use within shell programs. Apart from the simple interpolation shown above, the
    other main option for variables is to evaluate them. The program can


    | TABLE 13.1: Special Variables Under the bash shell |

    | Variable | Function |

    | --- | --- |

    | ? | Returns the exit status of the previous command |

    | $ | Returns the process identification number of the current shell process |

    | - | Returns the options given to the current shell process on start-up |

    | ! | Returns the process identification number of the last background command
    |

    | 0 | Returns the file name of the current script |

    | 1-9 | Returns the first through ninth command-line arguments given when invoking
    the current script; $1 is the first argument, $2 the second, etc. |

    | - | Returns the last argument given with the previous command |'
