  md: '# Preface


    # To the Student


    This text is a basic introduction to the complex world of the Unix operating system.
    Here, you will find information about several aspects of working with Unix, from
    simple personal tasks to shell programming and system administration. Unix is
    a powerful and ever-evolving system, which is now available in variants designed
    for every hardware platform and with configurations to suit any preferences or
    needs. It powers much of the world''s academic and business information technology,
    and is increasingly popular for home networks and machines.


    You may find Unix intimidating, especially if you have not worked with text-based
    operating systems before. Although it might be unfamiliar territory, explore the
    systems available to you and practice the unfamiliar commands you see in this
    book or elsewhere. You will come to see that, although the user interface can
    be uncomfortable, with Unix is like working on any other operating system, especially
    if you are working on a Unix installation which offers a graphical user interface,
    some of which are indistinguishable from Windows or MacOS.


    If you have a spare computer available to you, we strongly encourage you to consider
    downloading and installing a Unix variant for your own practice and exploration.
    The most popular Unix variants for personal computers are Linux and FreeBSD. There
    are more than a hundred Linux variants available on the Internet, but the Red
    Hat and distributions tend to be the friendliest for newcomers. FreeBSD has only
    one distribution, but it is also good for newcomers. While you are learning, it
    would be best to keep your Unix machine separate from your regular home computer,
    you should have one. You can run Unix on a 486, as long as you work primarily
    in text mode. Using the graphical interfaces can slow the system significantly
    if there is not enough RAM or a fast enough chip. Unix is best learned on hands.


    Whether this is the only Unix course you take or you are interested in pursuing
    a career related to Unix administration or development, this course will expose
    you to the various elements that make up the day of professional people. The Unix
    employment outlook is still vibrant, especially in academic and large corporate
    arenas. Even those who plan to work with Microsoft or Apple producis will benefit
    from Unix knowledge, since heterogeneous networks are increasingly the norm rather
    than the deviation.'
  merge: -1
  pgno: 4
- img_proc: true
  md: '# To the Teacher


    The text is designed to provide an overview of several critical areas of the Unix
    operating system. With this text, you can expose your students to a range of activities
    related to Unix, from simple filesystem navigation to scripting with sed and awk,
    as well as the various functions system administrators perform regularly. No matter
    what the focus of your particular course—from a survey of operating systems to
    a class designed for IT majors—you should find information here which will support
    your classroom activities.


    The text is divided into several sections so that it can be used in a variety
    of courses with different syllabi and emphasis. Most instructors will use the
    first two sections in their courses, especially if their students have little
    experience with multi-user operating systems.


    +   Chapters 1-6 provide an overview of Unix history, how the operating system
    works, how commands are given and processed, the file system and jobs and processes.
    This section also introduces the shell environment. The bash shell is the default
    used in this book.


    +   Chapters 7-9 introduce students to common Unix applications: various text
    editors, with an emphasis on vi, and some popular Internet applications which
    students can put to use if they are working in a networked environment. For those
    instructors who use electronic mail to communicate with their students, several
    e-mail clients are covered in this section.


    +   Chapters 10 and 11 introduce networking. From the most basic concepts of Unix
    networking to a case study in which students can build a small local network and
    connect it to the Internet, the ideas presented here are useful for students no
    matter their major or career goal.


    +   Chapters 12-15 focus on bash shell programming. Some instructors may not covering
    this material in their courses, while others find that programming is an excellent
    introduction to programming in general, especially if students are required to
    take more complex programming courses in their course of study. The basic concepts
    of shell scripting are introduced here, with increasingly complex scripts and
    examples.


    +   Chapters 16-19 are focused on system administration. Since sysadmin students
    are one of the most common destinations for Unix-skilled students, the jobs that
    routinely make up an administrator''s day are an important focus. These chapters
    introduce user and disk management, working with software, the X Window System,
    and running networked services: printing, Internet services, and remote access.
    Attention is also paid to secure management and working with disabled users.


    +   The appendices contain a brief command compendium, a glossary, a set of configuration
    files which you can use for examples or illustration, and a set of URLs for further
    study or exploration.'
  merge: -1
