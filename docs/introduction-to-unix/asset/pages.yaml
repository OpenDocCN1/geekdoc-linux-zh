  md: '# CHAPTER 9 Internet Applications


    In the days when the Internet was confined primarily to universities, government
    institutions, and technological corporations, this system promoted a refreshing
    exchange of ideas among users and a strong sense of community. Many USENET users
    developed deep friendships beyond screen, and hundreds of messages resulted from
    online conversations. Because nobody controlled the system, censorship was all
    impossible and the community vocally endorsed freedom of speech.


    # TABLE 9.1: The Nine USENET Hierarchies


    | Hierarchy | Subject |

    | alt.* | Wide variety of topics; hierarchy conceived as an alternative to the
    Big 8 |

    | comp.* | Computer and technical issues |

    | humanities.* | Discussion of literature, language, and other humanities |

    | misc.* | Any topic that doesn''t fit in other Big 8 hierarchies |

    | news.* | Discussion of issues relating to USENET news (current events falls
    under misc. soc.) |

    | rec.* | Recreational topics, such as hobbies, exercise, pets, and travel |

    | sci.* | Scientific topics, excluding computer-related subjects |

    | soc.* | Social sciences, including psychology, cultural issues, gender and relationship
    topics, and language |

    | talk.* | Topics which tend to spark intense debate; groups in the talk.* hierarchy
    are traditionally unmoderated, allowing completely free discourse |'
