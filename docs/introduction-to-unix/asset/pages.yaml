- img_proc: true
  md: '# Using Pattern Matching with awk


    When constructing awk commands, you can also use the same kind of patternmatching
    operations you would use in other regular expression constructions. awk has its
    own set of pattern-matching constructions, which offer the same type of flexibility.


    In the previous example using the lengthy output from the ps command, it is possible
    to use pattern-matching to pull out the processes which have an associated terminal,
    indicated by entries in the TTY column. To do so, use the command as


    ```

    ps aux | awk ''/tty/ (print $2 \t $11)''

    ```


    With this syntax, the print command is limited to only those lines which match
    the pattern "/tty/".


    # awk Scripts


    As with sed, you can also place complex awk commands in a separate file. That
    file can then be invoked as part of a scripted program and execute its operations
    on a variety of input files. If you were to save a complex awk command you would
    then invoke that file with a command as


    ```

    awk -f awkcommands input.file

    ```


    Shell programs often require that text be parsed in order to obtain data used
    as input for another process. Since computers do not have human minds, they rely
    on pattern-matching to analyze text input. Patternmatching is done with regular
    expressions, or sets of symbols which stand for particular types of text strings.
    These expressions can result in very broad matches with many results, or limited
    searches with few but specific returns. Pattern-matching is a feature of Unix
    programs and other programming languages.


    Three of the most Unix programs which use pattern-matching are grep, sed, and
    awk. grep is a program that searches an identified data source for a specified
    text string, and prints strings to the standard output. The sed program is a stream
    editor, which edits as it is generated. Unlike text editors or processors, sed
    is noninteractive and can run without user intervention. The awk program, like
    sed, works on data as it is generated; rather than editing it, however, awk formats
    to specified instructions. Of these programs, only grep is regularly run at the
    command line. All three are integral parts of shell programs, however, and can
    add a level of complexity to shell work that rivals that possible in dedicated
    programming languages.'
