  md: 'those machines that do accept remote connections with one of these programs,
    the program may not work exactly as described here due to some security patch
    has been added. If either situation is the case, you may have better luck with
    the commands described in the next section.


    # Secure Tools


    In response to the security problems posed by telnet and the "r commands," many
    system administrators have begun to use a replacement suite of tools. These tools
    are collectively known as SSH (or SSH''s Free Software counter-part, OpenSSH).
    SSH stands for Secure Shell.


    The SSH tools and scp operate in the same way as telnet, rsh, and but with one
    crucial difference: these tools use encrypted connections. In other words, when
    one machine connects to another using SSH, a piece of information called a key
    is the first data bit exchanged. This key is used to scramble all the information
    passing between the two machines, and is the code used to unscramble the data
    when it arrives at the other location.


    When the user is prompted for a password, the password is also sent in this encrypted
    form. A cracker lurking on the connection with a packet sniffer may be able to
    grab the encoded password, but because he does not have the appropriate key, for
    the encryption scheme to work properly, compatible SSH software must be running
    on both the local and remote machines. SSH has become so popular, though, that
    a healthy percentage of machines are now running the program suite.


    ssh

    The ssh can mimic either telnet or rsh, depending on how the command is given.
    For an interactive session like that started with telnet, ssh takes the syntax


    ```

    ssh -l login remote.machine.name

    ```


    as in

    ssh -l plee pub.bigcc.edu


    The "login" component of the command can be omitted if the user''s login name
    is the same on the remote machine as it is on the local machine. If the user accounts
    under the name plee on both machines, she can use


    ```

    ssh pub.bigcc.edu

    ```


    instead of the longer command. An alternative form of the long command is

    ssh loginremote.machine.name


    as in

    ssh plee pub.bigcc.edu'
