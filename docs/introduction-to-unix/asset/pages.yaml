  md: '# Hardware and Software


    In this section, you will learn about some of these hardware items. The descriptions
    provide a basic introduction to their function and the common network technologies
    they employ and represent. However, it is only a survey because individual manufacturers
    build components which require different software drivers to operate. If you work
    with networking hardware-devices, consult device''s manual for specific information
    on how to use it in your system.


    # Modems


    Most people have either used or seen a modem. A modem is the piece of hardware
    that allows network connections to be made over telephone lines. The word modem
    is a contraction of the term "modulator/demodulator." The first modems were called
    acoustic couplers because they translated the computer''s information into audible
    tones. The modem was a cradle into which a telephone receiver was nestled, and
    the tones played into the mouth-piece.


    As modems evolved, it became more common to simply plug the phone line into the
    itself, rather than rely on the handset. Today''s modems are usually internal,
    installed directly into the computer case. If the modem is external, a cable modem,
    it plugs into a socket on the back of the case.


    While significantly faster than the acoustic couplers of old, today''s modems
    still function in more or less the same way. Modems convert outgoing packets of
    information into electrical signals that are sent over telephone wires to a corresponding
    modem on the receiving end. The receiving modem decodes these signals, converting
    them back into data packets.


    The advantage of modems is that they can be used anywhere. As long as you have
    a phone line and the telephone modem, you can make a connection. The disadvantage
    of modems is that they are slow. The fastest modems are capable of transmitting
    data at a rate of 56,000 bits per second, whereas other methods of connection
    can be ten times that or


    While the term "modem" is used to describe other connection devices, like the
    cable modem, that device works differently from the telephone modem.


    # Ethernet


    Another common way to network computers is with Ethernet. Ethernet is a fanciful
    name given to a system in which computers on a network are connected with a bundle
    of dedicated wires. The most common form of Ethernet today is the 10baseT or 100baseT
    type. These types use cables with ends outsized phone jacks and are called RJ-45
    connectors. These cables plug into Network Interface Cards, or NICs, which are
    installed in the computers and are connected to network hubs.


    > Note:'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# CHAPTER 10 Networking I: Introduction to Unix Networking


    Ethernet has two advantages over dial-up networking. First, it''s much faster;
    second, it''s always on. Unlike modems, which have to be dialed into the receiving
    machine in order to work, machines connected by Ethernet are always connected.
    Ethernet''s disadvantage is that it only works over fairly short distances, about
    100 meters. You must run Ethernet cable anywhere you want to put network machines
    if you choose this method of networking.


    # Hubs


    Hubs are network switchboards designed to be used with 10/100baseT-type Ethernet.
    A hub is a fairly small and simple piece of equipment. It has a number of sockets,
    anywhere from four to twenty-four or more. Each computer on the network is plugged
    into the hub. The hub serves as a switchboard, effectively connecting every computer
    on the network to every other computer.


    # Routers


    Routers are another specialized piece of equipment. The purpose of a router is
    to connect between a local network, such as an Ethernet network, and an external
    network such as the Internet. Like hubs, routers act as switchboards but on a
    much greater level. Most routers are specially designed and built for this task,
    but it is also possible to convert a general-purpose computer to a router.


    Routers also have the secondary task of physically connecting Ethernet networks
    to the heavy-duty networks that are used to transport information across cities,
    states, and ultimately the world. This is done through heavy dedicated lines like
    T1 or T3, which are lines usually provided and maintained by the local telephone
    company or its partners. These lines carry huge amounts of data and often cost
    thousands of dollars each month. These connections require specialized interface
    hardware devices that are installed in the routers.


    # Cable and DSL


    One of the big problems facing Internet providers is how to provide customers
    with the speed and convenience of Ethernet while maintaining the low cost and
    universality of access that modems bring. Two technologies have emerged to bridge
    this gap: cable “modems” and DSL.


    Cable modems are small routers that connect an Ethernet NIC or a PCS port with
    the same sort of cable that is used to transmit cable television signals. Because
    this cable is already installed in many areas, it is easy to connect private residences
    to the Internet with this technology. Although the technology is still available
    in somewhat limited areas, cable companies are expanding their service rapidly.'
