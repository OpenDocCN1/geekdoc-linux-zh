  md: 'You might recognize these commands from the networking section of this book
    as the commands used to connect a Linux machine to an ethernet net-work to the
    Internet. A program could be saved, for example, under the file name /usr/local/net-up.
    By doing this, you need only invoke the command


    ```

    /usr/local/net-up

    ```


    in order to start the machine''s network functions.


    This type of shell program fulfils the basic shell components needed to be a “pro-gram,”
    but is overly simple. In particular, the program doesnt make decisions about how
    to execute itself, and decisions of many kinds are the core of what programs are
    meant to do. In order to make decisions, the program needs two elements: first,
    a means of storing and manipulating data, and second, a means of evaluating that
    data and taking action on it.


    The first of these elements is done with variables. As you have learned earlier
    in this book, variables are means by which the meaning of a piece of data can
    be separated from its function in the program. In this way, we can make grammatical
    use of data without needing to know the actual value of data. The second element
    is represented by the various flow control structures. Flow control structures
    are specific instructions that the programmer gives to the computer about how
    to evaluate data, and what actions to take if the data meets certain criteria.


    # What Is a Variable?


    In the most basic sense, a variable is a name given to a piece of information.
    Consider the algebraic expression x=1


    In this expression, the name of the variable is x and the value of that variable
    is 1. The fact that the variable''s value is 1 has no real value; we simply select
    as the value. It could easily have been 2, 385, or 38920573. The equal sign is
    used to define the variable.


    In a sense, you can think of the variable''s name as a box. The variable''s name
    is written on the side of the box: in this case, x. Inside the box is the value:
    in this case, 1. The box and its contents are separate from each other. If you
    want, you can replace the contents of the box with a different value. The variable
    will still have the same name, and will function in the way within a program.


    # Variable Names


    In order to create a variable, you must name it. Under Unix, the name of a variable
    can be almost anything. The only restrictions on variable names are'
