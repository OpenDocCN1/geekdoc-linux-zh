- img_proc: true
  md: '# Signals


    The previous section touches on another issue central to shell programming. Using
    exit status that one program can pass information to another program is a type
    of interprocess communication. In this case, that term is applied somewhat loosely
    as it is not necessarily diverse processes which communicate, but the concept
    behind the term is fairly accurate.


    A more complete sort of interprocess communication is handled by signals, as their
    name would suggest, flags with particular meaning. Unlike exit status, however,
    signals are a function of the operating system kernel and not of the shell. Signals
    are standardized across Unix variants, however, so a given signal will do the
    same thing on any Unix machine.


    In order to use a signal, three elements must be present. First, there must be
    a way to identify the process which is to receive the signal. Second, there must
    be a way to send the signal. Third, a signal trap must be available; a signal
    trap is a set of instructions in the receiving process which describes what is
    to be done when the signal is received.


    # Unique Identifiers


    The problem of identifying the receiving process has already been solved. Simply
    use the process identification number of the intended recipient process. How can
    this identification number be obtained if the recipient process has not yet started
    at the time the initial program runs? In particular, there must be a way in which
    the sending program can pull the receiving program''s PID and incorporate it.


    The shell has a function which can help in this situation. The special variable
    $ always stores the PID of its process as its value. Thus, you can use this variable
    to store the PID in a place where the sending program can always find it, in this
    code:


    ```

    echo $$ /var/run/program_name

    ```


    In this example, the intended recipient process writes its PID to a file in the
    /var/run directory. Note that you do not have to use the /var/run directory for
    your programs; however, under some variants like Linux, for the purpose of the
    directory.


    Once the PID has been written to that file, the sending process can access the
    file for the PID and use it to define a new program variable''s value, as in


    ```

    RECEIVERPID=''cat /var/run/program_name''

    ```'
  merge: -1
  pgno: 241
- img_proc: true
  md: 'Another option might be to place the PID into a shell environment variable,
    as in the command


    ```

    export RECEIVERPID=$$

    ```


    though many programmers would prefer the file approach.


    # Sending Signals


    Identifying the process ID number of the recipient program is the first step.
    Next, you will need to send a signal to the shell between the two programs. Since
    most signals are used to shut down the receiving process, a `kill` command is
    an intuitive name for this command.


    kill offers a wide range of signals which can be incorporated into shell programs
    or at the command line. The various options for `kill` can be generated with the
    command


    ```

    kill -1

    ```


    which produces the output


    +   1) SIGHUP 2) SIGINT 3) SIGQUIT 4) SIGILL

    5) SIGTRAP 6) SIGABRT 7) SIGBUS 8) SIGPGRP

    9) SIGKILL 10) SIGUSR1 11) SIGSEGV 12) SIGUSR2

    13) SIGPIPE 14) SIGARM 15) SIGTERM 16) SIGCHLD

    17) SIGCONT 18) SIGSTOP 19) SIGTSTP 20) SIGTTIN

