    Of the three components of the Unix operating system, the file system is the one
    of which users and administrators are most aware. While the shell is used to issue
    commands which cause the kernel to perform certain actions, it is the file system
    which provides the programs and data for the commands to use. The file system''s
    structure creates the landscape of the operating system, through which users can
    navigate with simple commands.


    This chapter introduces the basic Unix file system, well as basic navigational
    and file management commands. The concept of file permissions is introduced, permitting
    you to configure your personal files so that they can either be shared or protected
    from others. You will also learn the functions of various directories common to
    most Unix variants.'
