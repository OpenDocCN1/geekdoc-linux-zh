  md: 'Understanding how these parts work together to form a complete operating system
    is a critical foundation for further work with Unix. If you discover a problem
    on your Unix system, it is very helpful if you know the general area of the system
    where the problem is located, and know enough about how component works in order
    to begin solving the problem. When things are going well on your machine, you
    can use the same knowledge to make small changes that bring the machine to an
    optimum level of performance.


    # What Is an Operating System?


    As defined in Chapter 1, an operating system is the software whose function is
    to enable other programs to use the computer''s hardware. This means that the
    operating system must perform many small functions in order to execute the task
    desired by the computer''s user. For example, assume that you want to see a list
    of files in your home directory on the Unix computer. At the command prompt, you
    would type the command ls. The command launches the program. The program must
    be identified, found on the computer''s hard disk, stored in memory, loaded into
    the memory and run. Once the program has started, the computer must locate the
    desired directory on the hard disk, identify all the subdirectories and files
    in the desired directory, convert the file identities into human-readable characters,
    and display the output on the screen. Each of these steps are performed in the
    processor''s native language, which typically can only manipulate 32 or 64 bits,
    or discrete binary units, of information at a time.


    The user experience is quite different. While all of these microtasks are being
    executed, the user simply waits for the output. The user has done nothing but
    execute the command, or perhaps has clicked the mouse button, to get the displayed
    output. The difference between the user''s experience and the actual microtasks
    that manipulate electrical signals within the machine is the domain of the operating
    system, which exists to manage the various resources on the computer and allocate
    them as necessary.


    The operating system is responsible for controlling the processor, the hard disk(s),
    and the memory installed in the computer. It is also responsible for peripheral
    devices that may be attached, such as printers, external disk drives, modems,
    network cards, video or sound cards, and anything else that can be added to a
    computer temporarily or permanently. These devices and components use binary code,
    unintelligible to most humans, to understand their instructions and execute their
    operations. Without a functional operating system or the ability to communicate
    in pure binary code, there is no way to make the computer work.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# # Structure of a Unix Operating System


    All Unix variants have the same general structure: a modular system; you can install
    as many modules as you like to perform a wide array of functions, or you can install
    as few modules as are needed to keep the machine running. Moreover, these modules
    can be changed whenever necessary. The modular nature of Unix makes it extremely
    flexible, since you need only run the software necessary for your current requirements.
    The operating system has three general components: the kernel, the shell, and
    the file system.


    # ## The Kernel


    The kernel is the core of any Unix system. In fact, the only difference between
    any two Unix machines might be the kernel. The kernel runs constantly while the
    computer is powered on, and provides the core operating system functions. It is
    the supervisory element of the operating system, and is the link between user
    directions and hardware activity.


    Despite the central responsibility and critical nature of the kernel, it is not
    a program that a user can call or modify. The kernel will never show up on a list
    of programs currently running on the machine, even though it is constantly running
    program. The kernel is always out of sight that it can work without interference
    or damage.


    The kernel can be thought of as the "traffic cop" of the operating system. Its
    primary job is to manage the flow of electrical signals through the computer''s
    hardware. These electrical signals force the hardware to react in specific ways
    and either to perform a function or to generate output. This output is then translated
    by the kernel into a particular format that is interpreted by a given program
    or by the user. Since the computer is an electrical machine, the kernel is the
    manager of all impulses sent between the various cards and devices within the
    external case.


    Most users will have direct experience with the kernel: in fact, the system is
