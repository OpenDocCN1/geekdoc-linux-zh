  md: 'This command uses backslashes to define the actual meaning of the $ and characters,
    rather than their pattern-matching behavior. In addition, the possible return
    values are limited to prices that are and no more than $99.99. To get prices in
    other ranges, the command must be altered.


    # The Pluralizer


    As noted in the previous section, the command given would limit possible returns
    to two digits on either side of the dot. What happens if a price in the document
    is greater than $99.99? The command, as given, cannot add prices to the output.
    However, unless you already know the values in the document, you might not know
    that there are values of $100. In such situations, you might choose an alternative
    method of repeating a pattern and seeking matches.


    The expression \nm causes the pattern immediately preceding this string to repeat
    n times, but no more than m times. This allows a more elegant manner of writing
    the expression without requiring multiple repetitions of the same elements, which
    is both boring to write and more to error. Using this expression, the previous
    command can be rewritten as


    ```

    grep \$[0-9]\(1,\)\[0-9]\(2\) price.txt

    ```


    In this revised command, the element immediately to the left of the decimal place,
    [0-9], will be repeated at least one time. Because the expression uses the comma
    provides no upper boundary, there is no ceiling. The expression can repeat as
    many times as there are eligible values. To the right of the decimal, the expression
    \2} indicates that the expression [0-9] will repeat only twice. Because there
    is no comma between the curly brackets, the program cannot repeat the [0-9] expression
    fewer or than twice.


    The backslashes before the curly braces in this example do not mean that the curly
    braces have some specific pattern-matching function that is turning off. Rather,
    the backslashes are used to indicate that the curly braces should not be interpreted
    as literal curly braces to enclose particular strings of text. In other words,
    you can think of the curly brace operators as being the entire combination of
    backslashes and curly braces. Think of it as \{ and \} rather than as the individual
    elements of { and }.


    ```

    sed

    ```


    Now that you have learned how to construct regular expressions, and how to use
    grep to find matching strings, you can use both the expressions and the grep commands
    to process information. grep is not the tool best'
