    # Run Control Files In Other Shells


    In shells other than bash, configurations are handled in much the same manner
    but the file names are different. However, the configuration files are still edited
    with text editors, and they still run when the shell is booted. Under the Korn
    Shell, there are three important run control files:


    +   - kshrc This works much like .bashrc, and contains variable definitions and
    other commands which affect the shell environment.

    - .profile Like bash.profile document, this file controls the login environment
    for the Korn shell.

    - .sh_history The .sh_history file contains a list of the most recently issued
    commands in the shell. It normally contains the 100 most recent commands, but
    can be configured to display fewer or more depending on your needs.


    In editing these files, you will need to use a different set of environment variables
    than those used under bash. Table 6.4 shows some of the Korn shell environment
    variables.


