    # dd


    The dd command is used to copy a specified file to another location. It is often
    used to copy files to removable media like floppy diskettes, because dd streams
    the data without formatting. dd takes the syntax


    ```

    dd if=<input file> of=<output file>

    ```


    <output file> is usually the device name of whatever drive holds the disk to which
    you are moving the file.


    # declare


    The declare command is used to assign a particular type to a specified variable,
    and takes the syntax


