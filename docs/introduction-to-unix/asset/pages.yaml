- img_proc: true
  md: '# Directories


    Directories are also files, those files with a special function. A directory is
    a file which contains other files. In most graphical operating systems, directories
    are represented with a small graphic of a folder, which is exactly how they work.
    A directory file is not readable by humans, nor is it executable. It is merely
    a container. Directory files are covered in detail later in this chapter.


    # Links


    Links are files that refer to other files. In some cases, especially when writing
    shell scripts, it is necessary to refer to a single data construct in more than
    one way. When using links, one file can have more than one name, so that it can
    be used in different ways in different situations. This is not a common habit
    for average users, but it is frequently used by programmers and system administrators.


    There are two types of links: hard links and symbolic links. A hard link is literally
    another name for a given file. It is actually another directory entry which corresponds
    to the same inode as the original file, so any reference to the link will call
    the appropriate node, and thus the desired file. A symbolic link is a second file
    which contains the name of a given file. If the file is moved or renamed, the
    symbolic link will fail. Since hard links point to the same inode as the actual
    file, they do not fail.


    In most cases, hard and symbolic links work in the same way. One symbolic link
    on many systems is /bin/sh, which is a symbolic link to /bin/bash. Any programs
    that invoke the Bourne shell will trigger this symbolic link, and the program
    will run in the shell instead. Links are created with the ln command. The default
    behavior of ln is to create a hard link,


    ```

    ln [options] <linked-to-file> <name of link>

    ```


    In order to create a symbolic link, use the option -s.


    # Device Files


    Device files are special constructs that represent the pieces of hardware-connected
    to the computer. In the same way that a human can read or write a file, the computer''s
    processor can read from or write to a device. This enables the machine to move
    data between various hardware devices.


    For example, when the operating system instructs the computer to open a file,
    it must first open the device file representing the hard disk and then copy the
    contents of the specified file into memory. If the file is modified while it is
    open, the computer will once again open the device file and copy the modified
    form of the file back into the correct location. Should the user want to copy
    a file from a CD-ROM drive to a floppy disk, the operating system will handle
    files representing both of those devices in executing the command.'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'For those who run their own Unix machines or who are administrators on large
    networks, it is not uncommon to spend a good amount of time each day working with
    device files. Printers, sound and video cards, input devices, monitors, modems,
    and network cards are all handled through device files. The device file makes
    it easier to automate certain tasks with shell scripts, and means that any new
    piece of hardware can be administered like the existing devices without installing
    complicated or unusual new management software.


    # Named Pipes


    In Chapter 3, we introduced the concept of pipes. The pipes described were issued
    at the command prompt, and were intended for a single use. On a Unix system, it
    is possible to create pipelines that do not disappear after the command has been
    issued. These pipelines are permanent, until they are deleted, and can be reused
    or incorporated into different scripts and to pass data as input or output. Named
    pipes are also called FIFOs, an acronym drawn from the maxim “first in, first
    out."


    # Directories


    As defined, a directory is a type of file which is designed to contain other files.
    Directories can contain any kind of file, including other directories, which are
    then called subdirectories. Directories containing subdirectories are called parent
    directories. These names are relative; a given directory may be both a parent
    directory and a subdirectory, as most are on a Unix machine.


    Although commonly described with one-word names, the most proper way to refer
    to a file is to use its full path name. The path contains the file name, the directory
    which contains it, and any directory which contains the file''s home directory.
    Ultimately, all files on a Unix computer are contained within a single directory
    called the root directory. Do not confuse the root directory with the root, superuser,.


    The root directory is designated by the slash character, /. All files which reside
    in this directory are named /filename, while subdirectories contained in the root
    directory use the same syntax with a trailing slash, as in /directory/. The trailing
    slash is optional in most situations, but useful in cases where it is important
    to differentiate between a file and a directory with the same name. A file residing
    in a subdirectory of would have the path /directory/filename. It is not unusual
    for a given file to be located inside a multi-layered nest of directories. For
    example, on a Linux machine, the configuration file for the mail server program
    sendmail has the path /etc/rc.d/init.d/sendmail.'
