    # Netscape


    If you have a graphical user environment available on your Unix machine, you have
    more Web browsing options. Unix users have been rather fortunate, because the
    Netscape development team has always produced a Unix version of their product
    from the earliest release. In fact, Netscape''s predecessor Mosaic was originally
    developed only for Unix. It was not until Mosaic was absorbed into the Netscape
    project and the browser itself was that versions were also released for Windows
    and Macintosh.


    Although lasting behind Microsoft Internet Explorer in general, primarily because
    Explorer is the default Windows browser, competition does not exist in the Unix
    world. Netscape has remained consistently popular until very recently, when other
    development teams released new graphical browsers for the platform. The Netscape
    team is committed to Unix and to making their products consistent across all platforms.


    Netscape looks and works under Unix exactly as it does under Windows and Macintosh.
    Start Netscape by selecting its entry from your graphical environment''s Start
    menu, by clicking its icon on the desktop, or by opening a terminal window and
    issuing the command


    netscape


    # Mozilla


    One of the reasons behind Netscape''s decline in popularity, even among Unix enthusiasts,
    is the development of Mozilla. The Mozilla project began when Netscape, influenced
    by Eric Raymond''s writings, made the Netscape Web browser source code available
    to the public. Mozilla hoped that the Free Software and Open Source communities
    would use this code to create a better browser that would compete with Internet
    Explorer on the Windows platform.


    From Netscape''s perspective, this has met with limited success. While Mozilla
    is deemed an improvement over its Netscape predecessors, the process took much
    longer than Netscape anticipated at code release. In fact, the time this was written,
    Mozilla 1.0 had not yet been released; it is planned for release in 2002, and
    the second beta version has been available for time.


    From the Free Software and Open Source point of view, the Mozilla project has
    been a tremendous success. The resulting browser is nimble, streamlined, highly
    configurable, appealing to the eye, and above all, it is free in all senses of
    the word. Mozilla is a major accomplishment for the open development process.'
