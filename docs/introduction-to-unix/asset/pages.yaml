  md: '# 215


    suited to working with strings once they have been identified. Rather, the stream
    editor sed is the appropriate tool.


    Not unlike vi or GNU Emacs, sed is a text editor of sorts. In fact, sed is based
    on one of the original single-line text editors, ed. The main difference between
    vi, or similar text editors and an editor like sed that sed is intended to edit
    data as it is generated; the description of sed as a stream editor, since it edits
    the stream of data as it flows.


    In practical terms, this means that, with a single command, you can use a range
    of editing commands on a particular file or data source. These commands are noninteractive,
    which makes them ideal for shell programs and other scripting or programming needs.
    A program like sed works almost seamlessly with grep. Where grep identifies strings
    which match the specified patterns, sed can then edit those strings in accordance
    with predefined rules. Adding sed to grep increases the potential of a program,
    and allows additional complexity for each individual command within the script.


    The syntax places editing commands as arguments to the sed command itself. These
    editing commands are specific to sed; regular shell-based editing commands will
    not work within the sed and will cause the command to fail. Perhaps the most common
    sed operation is a simple search-and-replace. Suppose that you have a document
    called chip.txt, which contains a block of plain text. In this file, you have
    made multiple references to IPC. In order to replace this acronym with its full
    expanded value, you can use sed to identify and replace the specified text with
    a command like


    ```

    sed ''s/IPC/Intel Pentium chip/g'' chip.txt

    ```


    sed searches the file, identifies any strings of IPC, and replaces them with the
    correct value.


    This may seem uninteresting or obvious, however that almost every text editor
    and all word processors do the same thing. Without having to open an editor, pull
    in the file buffer, identify and change text strings, save the file, and edit.
    Sed can work noninteractively within a shell program, which a normal interactive
    text editor cannot.


    sed takes the syntax


    ```

    sed ''s/target/replacement/options'' source

    ```


    where target and replacement are specified text strings, and the source is the
    file or dataset upon which sed should work. The options are not required elements
    of the command, but can force sed to work in more complex ways. In the previous
    example, the goption forced sed to search the entire file for every occurrence
    of the IPC target. With the g or "global," option not been included, sed would
    have stopped searching after the first iteration of the string was found and replaced.


    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_227_0.png)'
