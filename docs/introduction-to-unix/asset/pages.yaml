  md: 'On machines running Unix, the appearance of text is controlled by the ASCII
    standard, which determines how individual characters are displayed and processed.
    In order to work with text Unix, you need to use a text editor. There are two
    major types of text editors: line editors and visual editors. The vi editor is
    a visual editor, and it is the most widely-found editor on Unix systems regardless
    of the variant used.


    The vi operates in two modes: insert and edit. Each mode has its own set of commands
    which allows you to perform text management tasks. With vi, you can cut and paste
    strings of text, replace or identify particular strings of text, or move through
    a file rapidly and accurately. Even though vi may seem confusing at first, knowing
    the basics of the editor is critical. Should your system crash or should you need
    to use a rescue diskette, vi will probably be the only editor to fix the text
    files which control your computer''s operation.


    +   1. What is the definition of "text" in a Unix context? What are standards
    important?

    2. What is the difference between a text editor and a word processor? What are
    the strengths and weaknesses of each program?

    3. How does a visual text editor differ from a line editor? What does "visual"
    mean in this context?

    4. Explain the difference between vi two modes, and the advantages to the editor''s
    system.

    5. Why does vi edit mode include cursor movement when the keyboard keys produce
    the same result? What are the advantages of keystroke combinations?

    6. Define "register", How do vi edit commands make use of the register?

    7. Why does vi use five different delete commands? In what situation is each command
    most useful?

    8. Explain how to use vi''s search functions to identify a particular line of
    text somewhere in the file.

    9. What is the difference between an abbreviation and a macro? Provide several
    examples of each function.

    10. What mechanism is used to alter vi''s behavior and user environment? What
    are some commonly used parameters?

    11. How would you save two different versions of the same file? What is the safest
    way to exit vi?'
  merge: -1
