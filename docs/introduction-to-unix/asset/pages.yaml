  md: 'In recent years, a number of programming languages have been developed. These
    languages include the regular expression processing functions of grep, sed, and
    awk. In particular, the Perl programming language has a powerful and flexible
    regular expression engine. Many system administrators have to prefer the fully
    integrated Perl language as an alternative to the somewhat fragmented Unix units.
    Perl is outside the scope of this book, but those who are interested in programming
    might enjoy it. Certainly, administrative scripts written in Perl are rapidly
    approaching the popularity of native shell programs.


    > Note:


    # # grep


    The term "grep" is an acronym for "Get Regular Expression Print." It is pronounced
    as a single syllable, rather than as individual letters or as "gee-prep". In fact,
    grep is used as a conversational verb in many situations. As the name implies,
    the grep program is designed to identify strings which match a specific regular
    expression, and then to print those strings to the standard output.


    The grep program takes the syntax


    ```

    grep pattern filename

    ```


    For example, if you wanted to search a log file named mail_log for the name mstern,
    you would issue the grep command as


    ```

    grep mstern mail_log

    ```


    Any entries in the mail_log file which contain the string mstern will print the
    standard output, usually the monitor.


    The grep command can also be issued without a specified input file. This allows
    you to pipe the output of an initial command to grep as the input source. For
    example, the command


    ```

    ls *.txt

    ```


    could be rewritten as


    ```

    ls | grep *.txt

    ```


    This example is not very useful, but the concept can be used to construct more
    elaborate expressions within a shell program or at the command prompt. If, for
    you needed to identify the process ID number of a running process, you could use
    grep to find the appropriate process. If you were looking for a Netscape process,
    the command might look like this:


    ```

    ps -x | grep netscape

    ```


    The command would return only processes with the string netscape, limiting the
    time needed to scan all running processes.'
