    # Assigning Variables


    As mentioned above, a variable cannot be used until it has been assigned. Assigning
    a variable involves giving it an initial value. This is done through the use of
    an assignment operator, which is the equal sign =. In the case of a scalar variable,
    the command is:


    ```

    ANIMAL = "horse"

    ```


    In the case of an array variable, the format is slightly more complex:


    ```

    ANIMALS = ("dog" "fish" "horse")

    ```


    The format of an assignment for an array variable must be a list of elements contained
    in quotation marks and separated by a space, with the entire list enclosed in
    parentheses. If one of these elements is missing, the variable''s value will not
    be set correctly.


    When you assign a variable, you create the variable name and also provide the
    initial value. The value of the variable can change throughout the course of a
    program, value definition is a valid command within such a script. However, when
    you initialize the variable, you should provide the value that it will use first.
    The name of the variable remains constant and cannot be changed; if you give an
    improper name to the variable, misspell it, or simply edit the program to reflect
    the appropriate


    # The $ Operator


    When using variables, it is important to distinguish between use of the variable
    itself and the use of the variable''s value. This is done with the $ operator.
    When this operator is placed at the start of a variable name, it provides a specific
    instruction to any program using the variable: "Use the value of this variable
    whenever it is invoked."


    A program may contain both a definition of the variable''s value and a state using
    the $ operator, as in these lines:


    ```

    ANIMAL=horse

    echo $ANIMAL

    ```'
