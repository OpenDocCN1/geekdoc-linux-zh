    the octal (base 8), hexadecimal (base 16), and binary numbers are equivalents
    of the decimal. Note that upper-case and lower-case numbers have different identifiers,
    and that the first 31 characters are actually control characters, which control
    the action of a printer or a terminal window.


    While there is no reason to memorize this, it is important to understand that
    the processor inside your computer doesn''t speak English (or Japanese, Faroese,
    or Portuguese). It only speaks binary; individual language standards make it possible
    for us to communicate with our machines, using the language we prefer. Even systems
    in non-English-speaking countries use the ASCII standard. For example, though
    operating systems may offer Chinese users a Mandarin user interface, the configuration
    files and scripts will still be written in ASCII text. Except for the ancient
    IBM mainframes mentioned earlier, there isn''t a computer running on any platform
    that runs without ASCII text.


    # Text Editors


    A particular type of program, called a text editor, is used to create and edit
    text files. Text editors are relatively simple programs which allow the user to
    work with text directly, but which do not provide a great deal of formatting.
    Formatting is not particularly necessary in a Unix environment, most text files
    are read in a terminal window or directly at the command prompt and do not need
    to be attractive to the reader.'
