- img_proc: true
  md: '# Major Unix Shells


    Although it may be difficult to see the range of options which differentiate one
    shell from another, significant differences exist. The primary reason is to provide
    particular functions for shell programming, especially functions which utilize
    common constructs in a particular programming language. Despite the emphasis on
    flexibility, user-level functions and configurability provide another way to بمعنى
    one from another.


    This section introduces several of the major shells, in terms of popularity and
    widespread use. These shells are available on almost all Unix variant, whether
    as the default shell or as an alternative which can be accessed by invoking the
    shell as a command at the prompt. While other shells may be downloaded and installed
    for a particular need or preference, one of these shells will probably be available
    as a back-up or in an emergency with a less developed shell.


    # The Bourne (Again) Shell


    We use the Bourne (Again) as the primary shell in this text. However, if you do
    not have the bash shell available, you can use the Bourne shell in all cases.
    The Bourne (Again) shell is a near-clone of the Bourne shell, and most bash commands
    should work well in sh (the Bourne shell).


    The Bourne (Again) shell was originally developed as a Free Software alternative
    to the proprietary Bourne shell, and intended to be as close as a copy possible
    without violating the existing shell''s copyrights. However, while working on
    the new shell, programmers decided to add some new features and to streamline
    some of the Bourne functions that were not as elegant as they could be. The resulting
    bash shell offers options which are not possible in Bourne:


    +   - ability to move the cursor with GNU Emacs combinations

    - ability to remember previous commands with a history log file navigable with
    the arrows

    - ability to complete file names from a truncated text string and the Tab key

    - improved script writing tools and functions


    Many systems have bash installed as the default shell, or as an alternative. It
    is more likely to be found on systems running the FreeBSD or Linux Unix variants
    which emphasize the use of Free Software, but bash is installed on a number of
    commercial Unix variants as well.


    # The Bourne Shell


    If the Bourne (Again) Shell is a derivative of the Bourne Shell, why not use the
    Bourne Shell itself? In fact, many people still do. The Bourne Shell is usually
    installed as the default shell on commercial Unix variants like HP-UX and'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# Major Unix Shells


    earlier versions of Solaris. It is also installed by many users who learned Unix
    on a commercial variant and who find it to be a good blend of power and ease of
    use.


    This ease of use comes from the Bourne Shell''s limited array of commands. Bourne
    was the first Unix shell, and it has not aggressively developed since then; therefore,
    not much has been added since those early days. Those who came to Bourne from
    later shells with more capability may be frustrated, especially in working on
    the command line.


    Despite its limited features, the Bourne Shell is favored by those who want a
    lean machine and dislike software that offers many useful functions. It is also
    useful to know the Bourne Shell if you plan to do much work on commercial Unix
    variants or if you plan to use graphical user interfaces exclusively. Users who
    plan to work primarily from the command line will probably want to upgrade to
    the Bourne (Again) Shell, which feels like Bourne but offers more options. In
    general, any program written for the Bourne Shell will run on the Bourne (Again)
    shell, but the reverse is not always true.


    # The Korn Shell


    Like the Bourne (Again) Shell, the Korn Shell offers a range of functions beyond
    those of the initial Unix Bourne Shell environment. In fact, the Korn Shell is
    second in popularity only to the Bourne shell, since it is a powerful shell that
    fixes some of the problems which Bourne has with editing directly on the command
    line. Users also appreciate the ability to configure the Korn so that it enables
    their favorite text editor, either or emacs.


    Chapter 5, Jobs and Processes, introduced the concept of foreground and background
    processes, and the techniques of process management. These operations, now standard
    in many shells, were first developed as part of the Korn Shell. Other Korn features
    include the use of a second type of variable (array variables), an easy-to-program
    menu system, and integer arithmetic usable from the command line. Programmers
    also like the Korn Shell for quick, small shell scripts.


    # The C Shells


    Two popular shells are based on the C programming language: csh and tcsh. While
    the most user may not notice a great deal of difference between the C shells and
    the Bourne shells, there are some significant differences once complex tasks are
    started. Many Unix variants provide one of the C shells as an alternative to the
    Bourne or Bourne (Again) default; users familiar with C may want to change their
    default shell for a more familiar environment.


    One of the major differences between the Bourne family and the C family is the
    way in which the C shells handle environment variables. Instead of editing'
