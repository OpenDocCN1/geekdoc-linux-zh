  md: '# LANs, WANs, and Internets


    The terms LAN, WAN, and internet are used quite casually in information technology
    conversations. Anyone who participates, no matter how marginally, in popular culture
    knows about "the Internet," and may also have heard of LANs or WANs. It is important
    to understand the difference between these three types of networks before moving
    further into specific construction details. Each of these terms refers to a particular
    network type, which manages data flow in a certain manner. Though the types are
    distinct, they are also related, and any given large network has sub-networks
    of a different type.


    # Local Area Networks


    The term LAN is an acronym for local area network. A LAN is any group of computers
    which are directly connected to each other, usually with wires. In common use,
    the term usually refers to an Ethernet network which occupies a building or office.
    A LAN can be built from as few as two machines to as many as can fit into the
    physical area. However, many system administrators opt to run smaller LANs rather
    than wire hundreds of computers into the same network. Practical considerations
    form the outer limit, rather than technical barriers.


    # Wide Area Networks


    WAN is an acronym for wide area networks, and refers to groups of machines which
    are networked across some distance. Typically, a WAN is comprised of several geographically
    dispersed LANs. These LANs may connect to each other through dial-up connections,
    or by dedicated lines. The VLAN, or Virtual LAN, is a WAN that uses connections
    over the Internet. WANs are often used to link separate offices within a company.
    For example, a corporation with offices in New York, Hong Kong, Paris, and Tiers
    would have a LAN in each office; those LANs, when hooked together, form the company-wide
    WAN.


    # Internets


    Finally, there are internets. You are no doubt to hearing about the Internet,
    with a capital I, usage which implies that there can be only one. However, in
    a purely technical sense, the term "internet" is somewhat looser. An internet
    is something like a supersized WAN. In fact, a WAN could be considered an internet
    if it manages data flow between, or "or," individual networks. However, an internet
    denotes greater disparity than merely geographical distance. For example, an internet
    may bridge networks owned by different institutions which use different operating
    systems and local network configuration. Several universities might link their
    LANs and WANs together'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'so that faculty members could work more easily. The resulting network is an
    internet.


    Today, most people talk about THE Internet, not AN internet, as if the Internet
    were a single monolithic network that every computer would eventually become part
    of. The Internet, however, is really a mesh of smaller networks that interconnect
    in the most public and open ways possible. It is a network of LANs and WANs, owned
    by diverse individuals, companies, and other institutions that hook together to
    create an infrastructure as universally available as possible. Individual networks
    join and detach from the larger mesh every minute, and the Internet is in constant
    flux.


    The phrase "Information Superhighway" is now a cliché, but the analogy of networks
    to physical roads is a useful one. Think of the individual computer as a house:
    the house is connected to the road by a driveway, which is just a very small road.
    The road connects many driveways, and connects to other roads to make up a neighborhood,
    or LAN. The neighborhoods, in turn, connect to larger roads which carry traffic
    throughout the city, or WAN. Cities are connected to each other through large
    state or interstate highways, building an internet. Your driveway in El Paso has
    a connection—indirect to anyone else''s driveway anywhere on the continent of
    North America. Each of these roads belongs to a different person or organization;
    roadways are personal property, roads belong to cities, highways belong to states
    or the federal government, yet they all connect to each other to carry where they
    want to go. This is the essence of the Internet.


    # Network Topology


    Networks can be differentiated by type, as described above, or by topology. The
    network type does not necessarily dictate a particular topology, though some topologies
    are more common to network types than others. A topology is a mapped shape; network
    topologies usually have descriptive names like ring, star, or bus. Some topologies
    are work equally well with very large numbers of machines. The hardware required
    for building each kind of topology will differ, though all require to connect
    the machines on the network.


    # The Bus Topology


    Under a bus topology, each machine is connected to a central cable. This cable,
    or bus, transfers data down its length until the data reaches the machine to it
    is addressed. Figure 11.1 shows a schematic of a bus topology network.


    Bus topologies are most efficient for small networks. Because incoming data must
    pass through the cable searching for the correct destination, data destined for
    the last machines attached to the bus will arrive more slowly than'
