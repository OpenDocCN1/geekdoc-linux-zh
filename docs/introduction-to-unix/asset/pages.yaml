    # The /proc Directory


    Those using Linux have an additional element which helps in managing active jobs
    and processes. The /proc directory contains a large number of virtual files which
    show the current state of the kernel as it runs and works with active processes.
    Files in /proc can be used by administrators to see specific data about a particular
    aspect of the kernel, or be used by other programs to get up-to-date information
    which can be used as input for a particular task.


    View files in /proc with the cat, less, or more commands. They can be opened or
    edited in text editors, but can be viewed easily with one of these programs. /proc
    files provide a vast amount of information how the kernel is working, though some
    of the files are hard to understand. For more information about your Linux system''s
    /proc directory, consult your documentation or visit the Red Hat Web site and
    see their related documents: http://www.redhat.com/docs/manual/linux/RHL-7.2-Manual/ref-guide/ch-proc.html.


    # The Screen Program


    Foreground and background processes form an important part of the Unix operating
    system. As a practical matter, though, it can be cumbersome to work with processes
    in this way, especially with multiple programs that send large amounts of output
    to the monitor. Many administrators and users prefer a more streamlined way of
    dealing with multiple processes.


    One of these streamlined methods is the program screen. screen is installed by
    default on many Unix variants, and is added by administrators on many more. This
    program allows the user to create any number of virtual terminals, each of which
    can run a separate job or multiple jobs. A virtual terminal is an additional shell
    process which, for text-based interfaces, works like multiple windows in a graphical
    user interface. It is possible to run background processes in screen terminals,
    and is even possible to nest other processes within existing screen terminal windows.'
