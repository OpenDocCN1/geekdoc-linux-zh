  md: '# APPENDIX A Common UNIX Commands


    # cfdisk


    Like the fdisk command, cfdisk is used to partition a hard disk. It takes the
    same syntax as that command but offers an interface which many users prefer.


    # chmod


    The chmod command is used to define and change file permissions. The command can
    be used only on files that you own, or by the root account. chmod uses the syntax


    ```

    chmod [u|g|a] (+|-) {r and/or w x} <filename>

    ```


    If you do not specify a level of permission, chmod assigns global permission to
    the file. That, chmod uses the "a" option by default unless you specify "u" or
    "g" when issuing the command. There are several levels of permission used with:


    +   * u Permission only to the owner of the file

    * g Permission to the user''s groups

    * a Global permissions, including those outside the local network

    * + Declares permissions on the named file to be changed

    * - Declares permissions on the named file to be removed

    * r read file permission, granting read-only access

    * w write file permission, granting read and edit permissions

    * x execute file permission, permitting the user to run the file if it is an executable
    binary: includes read and edit permissions


    chmod also takes numerical arguments, which are explained on the chmod manual
    page. Some of the most used chmod commands include


    +   * chmod a+r <filename> Gives permission on the named file to all users

    * chmod g+rw <filename> Gives read and write permission on the named file to the
    user''s group(s)

    * chmod a-x <filename> Removes execute permission from all users, including the
    file''s owner; follow this command that grants execute permission to the owner
    and others who need to use the file'
  merge: -1
