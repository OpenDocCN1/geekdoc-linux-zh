  md: '# Common UNIX Commands A


    This appendix contains information about a selection of Unix shell commands. There
    are hundreds, if not thousands, more commands available to the Unix user, depending
    on the variant and shell which you have chosen. The commands included here are
    those which are generally available on any Unix installation, though your particular
    situation may offer different commands or may not have a particular command installed.
    Check your local documentation if commands do not appear to behave in the expected
    manner when you execute them.


    # About These Commands


    The entries in this appendix use several typographical conventions to indicate
    the elements of each command:


    +   - Any information within square brackets is optional, as in [optional]

    - Any information within angle brackets must be replaced with an actual filename
    or program name without the angle brackets, as in <filename>

    - Any string of elements separated by a pipe character are mutually exclusive,
    as in a|b|c

    - If the elements appear within curly braces, one element must be selected, as
    in {a|b|c}

    - If string of elements appear within square brackets, the choice is optional.
    If you see [a|b], the choice may be a, or no selection.


    The entries provide only the most common uses of commands. Most of the commands
    have other options or an extended syntax which allows more sophisticated or targeted
    use. To see the complete list of elements for each command, consult its manual
    page to learn more. Manual pages can be found by issuing the command manual command
    at the prompt; if your system does not have manual pages installed for some reason,
    use a Web search engine to find the appropriate page.


    > Note:


    307'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# adduser


    The adduser command is used to create a new user account. It takes the syntax


    ```

    adduser [options] username

    ```


    Options for adduser include


    +   - c adds a comment when creating the account

    - d specifies the user''s home directory

    - e specifies an expiration date for this account

    - -M creates a user account without a home directory

    - -p specifies the initial password for the account (your system policies require
    users to change their passwords immediately on first login)

    - -s specifies the user''s default shell environment if they do not want to use
    the default shell


    # apropos


    The apropos command is used to search for a specified file in any directory on
    the computer, with a keyword. The command is often used to find a map page. apropos
    takes the syntax


    ```

    apropos <keyword>

    ```


    # at


    The at command schedules a command to be executed at a later time. It takes the
    syntax


    ```

    at [options] <time>

    ```


    By default, at takes its input from the standard input. If you issue the command


    ```

    at <time>

    ```


    the program will supply a prompt of


    ```

    at>

    ```


    where you can type the commands you wish to have executed at the specified time.
    it can also be used with a redirection operator, such as


    ```

    at <time> <command>

    ```'
  merge: -1
