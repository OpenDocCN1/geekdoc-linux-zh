    # PINE


    Another popular Unix electronic mail client is called PINE. Although the documentation
    does not confirm this, the general assumption is that PINE is an acronym for "Pine
    Is Not Elm." PINE is integrated with the Pico text editor. Though PINE will work
    with other editors if the configuration is changed, users who are comfortable
    with Pico will find PINE very easy to learn and use.


    Start PINE by issuing the command


    at the prompt. The client opens, as shown in Figure 9.4. The opening PINE screen
    contains a menu of options; move up and down the list with the arrow keys, and
    press Enter to select a particular option. The L key opens the mail folders screen,
    which shows the default program folders as well as any folders which you have
    created to store saved messages. The Inbox folder containing mail.


    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_148_0.png)


    FIGURE 9.4 The PINE e-mail client offers a range of editing tools, as well as
    an integrated news reader, and uses the Pico text editor.


    The Inbox folder contains a list of messages stored in the mail spool. Both read
    and unread messages are listed here; new messages have an N to their subject.
    Move up and down the list with the arrow keys, and press Enter to open a selected
    message.'
