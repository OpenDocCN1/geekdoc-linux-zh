  md: 'Remote devices are managed with a service called the Network File Service,
    or NFS. Mounting a remote device is much like mounting a local device, but requires
    a few extra steps. First, you must make some configurations on the remote machine.
    Log into the remote machine as root, and open the file /etc/exports in a text
    editor. Entries in this file the syntax


    ```

    filesystem permitted-machine

    ```


    If the local machine is called and stores the directory /sports, for example-plc,
    you''d make an entry in the remote /etc/exports file like this:


    ```

    /sports fred

    ```


    Save the file and exit the editor. Make sure that the remote machine''s NFS server
    is running, and issue the command


    ```

    exportfs

    ```


    at the remote machine''s prompt. Log out and return to the local machine''s shell
    to mount the filesystem.


    There are also extra steps to take when issuing the mount command. Specifically-mounting
    a filesystem over NFS requires that you specify the type for NFS, and you must
    provide specific path names for both the remote machine where the filesystem is
    housed and for the filesystem itself. Assuming that the remote machine is named
    barney, you''d issue the command


    ```

    mount -t nfs barney:/sports /news

    ```


    to mount the remote sports filesystem into the local mount point /news. Remote
    filesystems unmount in the same way as local devices, with the following command:


    ```

    umount /news

    ```


    NFS implementations vary according to the Unix variant you are using. FreeBSD,
    Linux, and similar Unix variants use the method described here. Users of other
    variants should consult their documentation.


    > Note:


    # Backups


    One very common task of the system administrator is that of making backups of
    the data contained on a computer system. Backups preserve data in the case of
    some catastrophic event such as a disk failure or a crash attack. It is essential
    to backup data on large machines such as servers or mainframes, which may contain
    data that are critical to the operation of an organization.


    There are quite a few methods available for doing backups. Large organizations
    sometimes make use of professionally written backup and recovery software.'
