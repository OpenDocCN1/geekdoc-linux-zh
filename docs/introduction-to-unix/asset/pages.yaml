  md: '# Other Text Editors


    # IN THIS CHAPTER


    +   1. GNU Emacs

    2. Pico

    3. joe

    4. NEdit


    The vi text editor, introduced in Chapter 7, is found on almost every Unix variant
    by default. Because of this widespread availability, it is important for every
    Unix user to have at least basic familiarity with the editor in case it is the
    only editor available in a stripped-down environment or in an emergency. Minimal
    skills allow users to repair damaged files in order to get back to their normal
    user environment.


    Although vi skills are important, many users find the editor to be unintuitive
    or difficult to use. Luckily for these users, there are a number of other text
    editors available as well. These editors range from nearly as popular as vi to
    some which are sparsely used or in new development. Some people use one editor
    for programming tasks and another to work with files.


    Four editors are introduced in this chapter. These editors appeal to different
    audiences and have different command and function sets. However, they are all
    accessible to any average user and can be utilized for both programming and for
    regular text. The GNU Emacs editor is the most complex of these four, and the
    Pico editor the simplest. Joe editor feels like a blend of Pico and Emacs, while
    NEdit represents the growing selection of graphical text editors.


    Even more than shell environments, the selection of a text editor is a personal
    choice. The "look and feel" of different editors varies widely, so it is useful
    to try as many editors as possible to find the one that is most comfortable. If
    any of these editors are unavailable on your system, you can download them from
    a Unix file archive and install the programs in your user account.'
  merge: -1
  pgno: 123
