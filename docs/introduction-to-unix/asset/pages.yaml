    # ## gdm.conf


    This file is the configuration file for the Gnome display manager. It controls
    the login screen appearance, as well as the behavior and appearance of various
    desktop environments and elements. It can be edited to change these system parameters,
    either with a text editor or Gnome''s graphical administration tools.


    ```

    [daemon]

    AutomaticLoginEnable=false

    AutomaticLogin=

    # If you are having trouble with using a single server for a long time and

    # want gdm to kill/restart the server, turn this on

    AlwaysRestartServer=false

    Configurator=/usr/bin/gdmconfig --disable-sound --disable-crash-dialog

    GnomeDefaultSession=/usr/share/gnome/default.session

    Chooser=/usr/bin/gdmchooser --disable-sound --disable-crash-dialog

    DefaultPath=/usr/bin/gdm/usr/bin/X11:/usr/local/bin:/usr/games/:

    /opt/gnome/bin

    DisplayDir=/etc/X11/gdm/Init

    Greeter=/usr/bin/gdmlogin --disable-sound --disable-crash-dialog

    Group=gdm

    HaltCommand=/sbin/shutdown -h now

    KillInitClients=true

    LogDir=/var/lib/gdm

    PidFile=/var/run/gdm.pid


    ```'
