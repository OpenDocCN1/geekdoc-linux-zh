  md: 'much more like data or programs that you have intentionally stored

    here. Nevertheless, the file system is an especially important part of the Unix

    operating system.


    One of the overarching design features of Unix is that the operating system

    handles everything as a file. All the programs installed on the machine, all the

    data created by users or other programs, and all the hardware devices\attached
    to the computer are represented as files. For example, when you

    create a file and save it to the hard disk, the kernel sees the hard disk as a

    file and opens it in order to write your text in the correct subdire-

    tory. Likewise, when you run a program, the kernel opens the program in

    to read the executable data contained within it. Files that contain other

    files are called directories to distinguish them from files that contain executable

    or parsable data.


    In addition to these executable and device files. Unix makes use of extensive

    text files to store information about how the system is configured. These-

    figuration files control a vast aspect of the system''s behavior. Con-

    figuration files can be used to control the programs that are initiated when

    the machine starts up, but the user sees when he logs in, how network con-

    ections are managed, and many other things.


    In fact, files may not be files at all! Unix uses a number of special

    types, though handled as a file by the operating system, have other

    functions. Links, for example, are dummy filenames that point to other files.

    Pipes serve as communication between programs. Some Unix

    variants also have "pseudo filesystems," which are used to track running

    processes. Linux, for example, uses the /proc directory to track these items.


    These examples illustrate the fact that files in Unix systems are more than storage

    devices. The file system itself is integral to the operation of the computer,
    and

    determ how smoothly a given process will run. Files are the Unix repre-

    sents itself; they are, in a certain way, Unix''s self-image.


    # Users


    People who are used to working with personal operating systems like Microsoft

    Windows or Apple MacOS may never have given any thought to the role that

    users play in an operating system''s design. Although Windows, for example,

    make provisions for multiple user profiles, these profiles are primarily used
    to

    alter the graphical user interface rather to provide hard authentication for

    security and privacy reasons. Some versions of Windows, such as Windows 95,

    Windows 98, and Windows ME, have little or no internal security. On machines

    running these Windows versions, programs and documents stored on the hard

    disk are available to all users, regardless of the user profile in operation.'
