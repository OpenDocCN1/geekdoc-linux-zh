    a run control file to manage parameter settings, including the values of abbreviations
    and macros which the user has already defined. Using the run control file to manage
    the vi environment is a good way to make the editor more comfortable and familiar.


    # Setting Your Preferences in vi


    The vi run control file is called .exrc, and should be located in your home directory.
    .exrc still not not exist after you have started and exited vi, you can make the
    file yourself. Simply open a new file in vi and save it with the name .exrc.


    Use the .exrc file to contain any commands that you want vi to execute automatically
    when the program starts up. Set commands are stored in this file, as well as macros
    or abbreviations that you may have configured. A sample .exrc file might look
    like this:


    +   - set list

    - set autoindent

    - set wrapmargin=80

    - abbr ms microsoft

    - map z :s/boys/children


    Note that, in the .exrc file, commands are not preceded by the colon. The colon
    is reserved for commands which are issued in edit mode.


    View the .exrc file as you would any other text file. If you want to view the
    file without making any edits, use the shell commands "less" or "more" to page'
