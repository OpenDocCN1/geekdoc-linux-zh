    have descriptive names like bus, ring, or hub. The hub topology is most common,
    especially since the development of ethernet networks, which join machines with
    standards-compliant cable which can carry vast amounts of data at high speeds.
    Ethernet networks are easy to configure under all Unix variants. Most networks,
