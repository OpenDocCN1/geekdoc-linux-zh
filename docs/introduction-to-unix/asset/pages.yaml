- img_proc: true
  md: '# CHAPTER 1 What is Unix?


    The reality of applications and operating systems is, of course, far more complicated
    than this example.


    The first operating systems were written specially for each machine. This was
    still an era of large computers, so it was not as onerous as a task it might seem.
    Each computer''s hardware was different, so the commands that made that particular
    set of hardware work were encoded into the machine''s specific operating system.
    With this new convenience, programmers could write programs for their computer
    far more quickly—as long as they understood the operating system.


    Note, in the years leading up to the early 1980s, there was no such thing as commodity
    software. That is, you couldn''t go to the store and buy a program; most software
    was written in-house by programmers who would be the computer''s primary users.
    These programs were still written for specific machines'' operating systems rather
    than the generic operating systems used in most personal computers today.


    # C and Unix


    In 1969, two researchers at Bell Labs became dissatisfied with the operating system
    running on their DEC PDP-7 computer. So, Ken Thompson and Ritchie wrote a new
    operating system. This new program was the first incarnation of Unix. Shortly
    after they wrote their operating system, Bell Labs bought a new computer, the
    DEC PDP11/20. Thompson and Ritchie wanted to keep using their operating system,
    so they decided to port, or transfer, the software to the new machine. As described
    earlier in this chapter, porting the operating system meant that it had to be
    completely rewritten to the new computer''s hardware configuration into account.
    Ritchie and Thompson felt that there had to be an easier way to port software;
    the result was the C programming language.


    The concept behind C is that it is possible, in theory, to write a program in
    language which can be converted into any machine''s native command language, regardless
    of what that native language might be. The problem with machine languages is that
    they are not very comprehensible to humans. To port a program by hand, the programmer
    must keep track of every bit of data and how a given machine handles that type.
    Thompson and Ritchie wanted to write a program once and convert it to the native
    language of any computer they wanted to run the program.


    Their solution uses a helper program called a compiler. The compiler is a program
    that is specific to a particular computer; a computer running Windows will use
    a different compiler than a computer running Linux, and the Linux compiler is
    different from the FreeBSD compiler. Individual versions of compilers for the
    same operating system will differ as, if the hardware configuration of the individual
    machines is different. To port a program to one'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Unix History and Background


    operating system to another, the programmer uses a program written in C as input
    for the compiler. The compiler then produces a machine language version of that
    program, which can be run on the compiler''s machine. With this technique, when
    a new computer arrived in the laboratory, all Thompson and Ritchie had to write
    a new compiler and recompile all the old programs for the new machine.


    In practice, of compiling and porting are not as simple as that. Even with the
    appropriate compiler, most programs have to be modified or tweaked before they
    run efficiently on a new computer. Still, this is far easier without rewriting
    the entire program from scratch. In fact, Thompson and Ritchie found the concept
    so useful that, in 1974, they rewrote their Unix operating system in C language.
    Even today, C remains popular among programmers, especially those who work primarily
    with Unix. Unix is still written in C, and C compilers exist for almost every
    piece of computing hardware.


    # The Growth of Unix


    At the same time as Ritchie and Thompson were working on Unix and C, their employer,
    Bell Labs, became embroiled in a legal argument that would have a great effect
    on computing. The federal government ruled that Bell Labs'' parent company, AT&T,
    was a monopoly in the telecommunications market, and demanded that AT&T take steps
    to break their stranglehold and permit competition. One of these steps involved
    Unix, as AT&T began to give the operating system to academic institutions free
    of charge. Universities, loved this gift, and Unix became very popular in the
    academic world. As graduates left college, they took their fondness for Unix with
    them, and the operating system to establish itself in the corporate world as well.


    In 1978, AT&T announced that it would start charging for Unix. The universities,
    which had formerly acquired the software for free, were understandably irritated.
    In reaction to AT&T''s announcement, the University of California at Berkeley
    announced it would create its own version of Unix. This version, known as Berkeley
    Software Development Unix (BSD Unix), was distributed not free of charge but free
    of any license restrictions—unlike AT&T''s Unix.


    At this point, the genius was out of the bottle and started to stay that. With
    the permissiveness of the BSD Unix license, along with all the copies of AT&T
    Unix still in existence, anybody who wanted Unix could get it. Even better, anyone
    who wanted Unix could write his or her version, from college students to major
    computing companies. The result was the wholesale fragmentation of Unix into a
    family of "Unix-like" systems. Each of these systems shares a Unix and many common
    commands and operations, but each variant has significant differences. People
    tend to'
