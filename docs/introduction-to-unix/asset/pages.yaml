  md: 'Unix, in contrast, was designed from the beginning as a multi-user operating
    system. This means that Unix not only has separate accounts and restrictions for
    each user, but that multiple users can use the operating system at the same time.
    Even personal computers running Unix variants designed for PCs, like FreeBSD or
    Linux, can host a number of simultaneous users, limited only by the number of
    network connections available to the machine. This multi-user approach comes from
    Unix''s heritage as an operating system for large machines that handled many users,
    both remote and working on the actual host.


    # Accounts


    Before a prospective user can begin to work on a Unix machine, she must have an
    account created by someone with administrative powers on the machine; users cannot
    create their own accounts. An account contains five distinct components:


    +   - a user name

    - a password

    - a user ID

    - one or more group IDs

    - a home directory


    The user name identifies all aspects of this account, including e-mail and Web
    addresses, as well as any permissions that may be set by the administrator. Group
    IDs are identifying users; the group ID is often a more effective way to identify
    a user than the user name, and the group ID is used to create sub-groups of users
    who have access to that machine. Groups may have access to different programs,
    different security permissions, or particular file-sharing abilities.


    All of these create a defined identity for the person who will use this account.
    She can log in, with a specified directory that contains her personal data, and
    access programs and files on the machine as long as she has been granted permission
    to do so. All users on this system will have accounts with the same basic components.
    In fact, some accounts will not be intended for humans, but are part of the operating
    system''s regular work.


    Having a distinct identity and a personal workspace allows the user to create
    private files. The level of privacy associated with a particular file is determined
    by the level of permission granted to it. Unix uses permission attributes to define
    who has access to a given file, and for what purpose. Permissions determine who
    can read the file, after the file, or execute the file if it is an executable
    program. Permissions are covered in more detail in Chapter 4: The File System.'
