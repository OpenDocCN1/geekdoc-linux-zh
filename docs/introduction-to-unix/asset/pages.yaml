    networking: Internet applications. These applications are designed to transport
    and view particular data types. Some Internet applications are user-oriented,
    like Web browsers; others are administrative, like fetchmail. In Chapter 10, Networking
    I and Chapter 11, Networking II, you will learn more about the concepts and mechanisms
    that underlie these popular applications and other Unix network


    # Electronic Mail


    Since the Internet was first developed (as ARPANet), electronic mail has been
    the most popular application. The concept of sending a text message from one machine
    to another is not limited to electronic mail; there is native messaging function
    under many Unix variants, but those messages print immediately to the recipient''s
    screen and require that the recipient be to get the message. Electronic mail,
    however, will wait patiently until it is opened and read.


    # Electronic Mail Protocols


    Everything else in the world of computer networking, the exchange of electronic
    mail between computers is governed by a protocol. A protocol is an exact description
    of the way in which a particular exchange of information must take place. The
    protocol specifies the type of information which one computer must send to another
    machine, and the exact format in which that information must be given.


    The Post Office Protocol, or POP, and the Internet Message Access Protocol, or
    IMAP, are the two most popular protocols governing the way in which electronic
    mail clients and servers communicate with each other. The client program is the
    user access program, while the server is the administrative program that collects
    and distributes all mail messages for a given system. A third protocol, the Simple
    Mail Transport Protocol, or SMTP, manages the manner in which servers communicate
    directly.


    # fetchmail


    Although Unix mail applications allow users to retrieve mail from a remote mail
    server, others do not. These readers can access mail directly from a local mail
    directory, one located on the same machine as the mail reader. If a system administrator
    has installed such a reader on his system, he—or the individual user—must also
    run a program that retrieves mail messages from a remote mail server and makes
    them available on the local machine for use.'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'The program used to manage remote mail retrieval is called fetchmail. fetchmail
    was introduced in Chapter 1, What is Unix?, as it was Eric Raymond''s experiment
    in writing open source software. The fetchmail program retrieves mail messages
    from a remote POP or IMAP server and brings them back to his home machine, delivering
    the messages to the local mail directory where users can access them. If you are
    not sure whether your mail client requires fetchmail, ask your system administrator.


    To run fetchmail, you must know four pieces of information:


    +   - the name of your remote mail server

    - your user name on the mail server machine

    - your password on the mail server machine

    - the e-mail protocol in use


    Once you have this data, create a file in your home directory .fetchmail. Enter
    the information in this format:


    ```

    poll <mail.server.name>

    proto <protocol>

    user <username>

    pass <yourpassword>

    ```


    A typical .fetchmail file might look like this:


    ```

    poll mail.bigcc.edu

    proto pop3

    user criswilson

    pass batt1ship

    ```


    Save the file and exit your text editor.


    You must set a specific set of permissions on this file. Because your mail server
    password is saved in plain text, leaving the file accessible means anyone who
    reads it will be able to access the server and intercept your mail. Issue this
    set of commands to restrict access as tightly as possible:


    ```

    chmod -rwx .fetchmailrc

    chmod u+rw .fetchmailrc

    chmod ug+x .fetchmailrc

    ```


    Consult Chapter 4, The File System, if you need to refresh your understanding
    of file permissions.


    Once .fetchmail is properly defined, you can run the program by issuing the command


    ```

    fetchmail

    ```


    at the system prompt. You will need to issue this command every time you want
    to check your mail.


    If this seems onerous to you, fetchmail has an automation option which causes
    the program to run silently in the background, accessing the mail server at'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'regular intervals and downloading any new messages. This option is set with
    the -d flag, which takes a numeric argument expressing the number of seconds between
    "gets." For example, the command


    ```

    fetchmail -d 360

    ```


    causes fetchmail to contact the mail server every six minutes, or 360 seconds.
    Issuing the command in this way means fetchmail will run constantly in the background
    until you stop it with the command


    ```

    fetchmail -q

    ```


    or until the process is killed by some other means.


    # # The SMAIL Variable


    Your electronic mail delivery should now be working properly, whether through
    your system administrator''s method of mail management or your own installation
    of fetchmail. No matter how it got, your mail messages should be stored in a local
    mail directory. To find the correct location, check the value of the SMAIL environment
    variable with the command


    ```

    $SMAIL

    ```


    The output will look something like this:


    ```

    /var/spool/mail/username

    ```


    If you don''t get a response from the echo command, ask your system administrator
    where your mail spool is located. A spool is a directory where incoming messages
    are stored. Assign that path name as the value for your personal SMAIL variable
    by placing an appropriate line in your shell run control file. For the bash shell,
    issue the command


    ```

    export MAIL="/var/spool/mail/username"

    ```


    username with your actual user ID. It is important to have this variable properly
    defined so that your personal mail client will look in the appropriate location
    for your mail. If the value is not correct, you won''t know you have mail.


    # # Electronic Mail Clients


    While mail can be read directly from the spool, it is not the preferred solution.
    Electronic mail clients offer a text editor, easy save options including nested
    folders, and other basic functions which make mail management much easier than
    reading the straight data feed. Reading mail from the spool may also cause the
    message format to be corrupted, so that messages cannot be displayed later in
    a mail client if desired.'
  merge: -1
