- img_proc: true
  md: 'Two routes are shown here. The first, 192.168.1.0, refers to the network to
    which this computer is physically connected. In order for any network connection,
    this route must exist. Otherwise, the machine would not know how to send packets
    outside itself. This route was created when the ifconfig command was issued.


    Note that the route is in .0 rather than the computer''s individual .111 Any IP
    number that is in 0 is a special one, and refers to the network as a whole than
    to a particular machine. This route is also associated with the interface eth0,
    which is the identity of the Network Interface Card as defined when the computer
    was added to the network.


    The second route in this output is the route for the loopback device. While it
    might seem strange that a machine needs a network designation in order to talk
    to itself, the loopback connection operates like any other connection in keeping
    with the “consistency” element of the Unix philosophy. Therefore, loopback routes
    are as essential as network routes.


    To add a new route, you must know the IP address of the gateway machine (router).
    For this example, assume that the IP address is 192.168.1.99. Use the


    ```

    route add default gw 192.168.1.99

    ```


    This command defines 192.168.1.99 as the default route. Any packets that are not
    destined for a machine on the local network will be sent to 192.168.1.99 and then
    redirected to the outside world. To see how this is reflected in the routing table
    for your machine, issue the


    ```

    netstat -r

    ```


    at the command prompt. The output will look something like this:


    | Destination Gateway Genmask Flags MSS Window Interface |

    | 192.168.1.0 | * | 255.255.255.0 | U | 40 0 0 eth0 |

    | 127.0.0.1 | * | 255.255.255.0 | U | 40 0 0 lo |

    | default | 192.168.1.99 | 0.0.0.0 | UG | 40 0 0 eth0 |


    The new route has added and is reflected in the output. Instead of a specific
    network designation, the new route is named “default” and the gateway machine
    is defined in its entry. Like the local interface, the new “default” route is
    associated with the eth0 network interface. This makes sense because if network
    traffic is destined for the Internet or some other external network and not a
    machine on the local network, the packets will still be sent and received through
    interface eth0.


    # DNS


    Once the machine has been configured and the routing set up properly, the network
    connection is fully functional. The machine can exchange data with'
  merge: -1
  pgno: 185
- img_proc: true
  md: 'any local machine as well as machines on external networks through the gateway.
    Before the machine can access the Internet and use it properly, though, there
    is one last task to be done.


    In the previous chapter, you learned about domain name resolution. Recall that
    Domain Name Servers are required so that computers can translate alphabetical
    machine names into IP numbers. To move across the Internet, the new machine must
    know how to locate the Domain Name Servers used by the network. These instructions
    are given by editing configuration


    usually mentioned in the plural, though only one DNS machine is used for any given
    reconciliation. It is common for networks to have multiple servers, usually 2.
    This extra machine acts as a backup. If the primary server is down, the secondary
    machine will be consulted automatically.


    In order to specify the addresses of the name servers, edit the configuration
    /etc/resolv.conf (or whatever the appropriate name is for your Unix variant, found
    by consulting the documentation). If no network configurations have yet been made
    on this machine, the file may not exist. You can create it by issuing the command


    ```

    touch /etc/resolv.conf

    ```


    Open the file in a text editor and place two lines in it:


    ```

    nameserver 192.168.0.101

    nameserver 192.168.0.102

    ```


    replacing these IP numbers with whatever IP numbers are the actual DNS addresses
    you use. Save the file, exit the text editor, and ensure that the file permissions
    are set so that the file is readable by issuing the command


    ```

    chmod a+r /etc/resolv.conf

    ```


    The machine is fully connected to the network and is able to make connections
    to machines on the Internet as well as on the local network.


    # Dial-up Networking


    If you are using Unix in a school or business setting, it is most likely that
    you will connect to the Internet or other external networks through an ethernet
    connection. With the increasing popularity of Linux and FreeBSD for small home
    Unix networks, however, many people must rely on dial-up connections for their
    Internet access. Dial-up networking is never an optimal solution, but has additional
    complications for the Unix user.'
  merge: -1
  pgno: 186
- img_proc: true
  md: 'Most dial-up connections are made through a commercial Internet service. Before
    you attempt to use a Unix machine for a dial-up connection, be sure that such
    a connection is compatible with Unix networking. Under Unix, a standard PPP (Point
    to Point Protocol) connection is used for dial-up networking. Provided that the
    Internet service offers a compliant connection, there should be no problem dialing
    and establishing a connection. However, some Internet companies—notably America
    Online and the Microsoft Network—use modified versions of the protocol that require
    specialized soft- not available for the Unix platform.


    It may be difficult to find out whether or not your Internet service provides
    Unix. Most technical service departments provide training about Unix, and customer
    service operators will say that Unix is not supported on your ISP. "Not supported,"
    does not necessarily mean that Unix is banned; it just means you probably won''t
    be able to rely on tech support for help if you run into a problem. The important
    element is that you sign up with an ISP that uses a standard unmodified PPP connection.


    If you are using Linux to connect via dial-up, the procedure is fairly simple.
    Most Linux distributions provide a graphical tool to assist with configuring the
    connection. Simply open the tool and follow the instructions to set up connection.


    Under other forms of Unix, the process can be more complicated. Under FreeBSD,
    you will need to edit the configuration file /etc/ppp/ppp.conf by adding a new
    section. Open the file in a text editor and add these:


    +   LOCALISP:

    set phone number

    set username login

    setkey password


    where the terms in it are replaced with the actual information. You could also
    change the name LOCALISP to any value you prefer, which is especially useful if
    you have more than one ISP. Save the file and exit the editor.


    Now, restart the PPP daemon so that it takes the new information into account.
    Issue the command


    ```

    ppp -auto LOCALISP

    ```


    (or whatever value you used to name the new entry). PPP is now configured and
    will be deployed automatically as soon as you issue any commands that require
    a network connection. FreeBSD will connect to the ISP in the named entry.


    Although this may seem relatively simple, other Unix variants use more complex
    methods to configure dial-up access. Like Linux, some variants provide a configuration
    tool, while others will work with configuration files. Your variant''s documentation
    will provide appropriate information about setting up dial-up networking on your
    machine.'
  merge: -1
