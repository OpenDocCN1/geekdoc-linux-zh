    # # File Permissions


    All files, no matter what type, have a set of attributes called permissions. Permissions
    control who has access to a file and for what purpose. There are three kinds of
    permissions: read, write, and execute. Each of these permissions uses three classifications
    to identify the user(s) who are granted that permission: owner, owner''s group,
    and all users. There are nine possible combinations of permissions.


    View a file permission configuration by issuing the ls command with the -l flag,
    as shown in Chapter 2. The output will look something like:


    ```

    [ave@barracuda WorkFiles]$ ls -l

    total 100

    -rw-rw-r-- 1 dave dave  28034 Feb 23 13:28 phone.txt

    -rw-rw-r-- 1 dave dave  16364 Apr 12 22:15 draft1.txt

    -rw-rw-r-- 1 dave dave  13748 Dec 01 08:43 salary.txt

    -rw-rw-r-- 1 dave dave   6932 Jan 18 17:56 bourse.jpg

    ```


    The group of characters at the beginning of each line indicates the permission
    status for the file named in that. The first character is a d, indicating that
    the file is a normal file. If it were a directory, the dash would be replaced
    by a "d".


    The next nine characters are divided into three groups of three characters Each
    first group refers to permissions for the file''s owner; the second group refers
    to members of the owner''s user groups; the third group refers to any global users
    who have access to the file. In the first group of three, the characters are rw-.
    This means that user Dave has read and write access to the files, but does not
    execute permission. This is reasonable since none of these files are executables.


    In the second group of three, the characters are also rw-. These permissions affect
    anyone who is of the same user group as Dave. User groups are assigned by the
    system administrator, and are used to sort the users on a given machine into similar
    groups. Groups of the same member work project might share a group, or a group
    might be used to identify users who have certain security'
