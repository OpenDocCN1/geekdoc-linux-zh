    if the package is a *.tgz or *.tar.gz file; and the command


    tar xvf filename


    if the package is a *.bz, *.bs2, *.tar.bz, or *.tar.bz2 file.


    Depending on the size of the archive, this process could take some time. The "v"
    option produces verbose output, meaning that you will see the name of each individual
