  md: 'data. However, a variable only needs to be defined as an environment variable
    if it is going to be used by more than one program.


    # Flow Control


    Flow control is a concept which does not have a analog outside of programming.
    Flow control is a set of constructs which allow the shell program to make decisions
    about how to execute itself. These constructs allow a section of a given program
    to be executed repeatedly as long as conditions permit, or executed conditionally
    when a specified set of parameters exists.


    Flow constructs are always used in conjunction with data variables. In this way,
    the program can respond to different types of data in different ways. If the datum
    represented by a variable says one thing, the program will behave in a particular
    manner. If the datum says something else, the program will behave differently.
    Often, the "art of programming" is the creative use of flow control.


    Although most users'' primary interaction with the shell is to issue single commands
    at the command prompt, the shell is actually a fully-featured and powerful environment.
    Using the various tools included in the shell, users and administrators can link
    complex sequences of commands and data interpretation to produce functional programs.
    These programs can be used for a myriad of tasks within the shell, but the most
    common uses of shell programs are to automate repetitive tasks and to simplify
    complex operations.


    Shell programs always begin with a line which invokes the shell itself. If the
    shell is not invoked, there will be no program to interpret the commands within
    the program. Any shell can run a program for it, but most shells have difficulty
    running scripts for other shells. After the shell is invoked, the program continues
    with the commands for its operation. These commands may be accompanied by comments,
    notes from the programmer which are intended for user help. Because they are set
    off with the hashmark character, comments are not parsed as part of the program.
    Some programs also identify data which is to be used as input for the program''s
    commands. Other programs make use of flow control, which is a programming construct
    permitting the program to make decisions about its behavior depending on input
    data or other elements.'
