    root directory. Note that Sandra can do this only if she has write permission
    on the root directory; however, if she is in a subdirectory in her own home directory,
    she can use the beginning slash to create a new subdirectories of her home directory.


    Just as it is possible to create a new directory when desired, it is also possible
