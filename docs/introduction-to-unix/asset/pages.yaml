    ongoing process which involves reviewing software archives on a regular basis,
    reading Unix news sources, and talking with other administrators in order to learn
    about revisions to installed programs or new programs which may help your machine
    run better. Managing print processes used to be a chore under Unix, but new software
    has made it easier to handle.


    Depending on your particular situation, you may not manage users or need to have
    extended experience with remote filesystems. However, anyone who works on a machine
    will probably need to install software at some point, whether in a user account
    or on the system as a whole. Most users expect to have access to a printer; while
    this chapter does not address the mechanics of an actual print job, it shows you
    how to add and configure new printers for your network. Printing is usually a
    function of the program which the user has used to make the document.


    259'
