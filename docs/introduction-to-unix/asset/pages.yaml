    # Managing User Groups


    User groups are a Unix concept which makes it easier to organize sub-sets of users
    and the various files and programs that they need. Individuals are assigned to
    groups, which in turn are granted permissions on particular aspects of the system.
    Granting permissions on an administrative program, for example, is much faster
    when it is just the group that needs permission rather than the 50 users assigned
    to that group.


    Groups can be assigned when the user account is first created, or at any point
    in the account''s existence. There is no limit to the number of groups possible
