  md: '# Managing User Groups


    If you used a graphical management tool to add the user account, you can use the
    same tool to delete the account. Depending on the tool, you may need to remove
    associated files and directories by hand, or the program might handle the data
    for you. Some user management tools, like the admintool program found under Solaris,
    also offer an account-lock option. This is an easy way to disable access temporarily.


    For users who used the userdel and adduser commands, there is another utility
    which removes accounts. The userdel program, as the name implies, is the opposite
    of adduser.


    ```

    userdel username

    ```


    Unlike usdel, userdel does not have a range of options. It takes only one -r flag.
    When userdel is issued with this flag, the program will remove the account''s
    associated home directory and all its contents at the same time, as in


    ```

