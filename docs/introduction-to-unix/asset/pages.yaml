    by issuing the command


    +   - g news.newsusers.questions


    trn pulls all articles from the local news pool and displays them.


    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_157_0.png)


    > FIGURE 9.9 The threaded reader trn makes it simple to keep track of newsgroup
    posts.


    The advantage of trn is that it is a threaded reader. As you move through the
    list of messages in a particular newsgroup, trn displays all the messages in one
    thread (under one subject line and its related messages) before moving to the
