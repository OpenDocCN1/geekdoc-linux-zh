- img_proc: true
  md: '# File System Types


    The first part of the Unix file system is the way in which the disk is organized.
    The method of organization is defined by the type of file system being used. Because
    all the data on a hard disk cannot be stored simultaneously in a computer''s memory,
    it must be stored on the disk in a way that makes it quick and easy to obtain
    the required data when it is called for. There are several different ways to organize
    the files, programs, and other data used to operate the machine, and different
    Unix variants rely on different file system types.


    All file system types have a boot block, which is the sector of the disk which
    loaded when the system is powered on. Because the boot block is loaded before
    the operating system, it is type-independent and there is only one boot block
    even if the disk is divided into multiple partitions. The boot block contains
    information needed to start the operating system, and as well as other initialization
    information.


    > Note:


    To the average user, the file system type is not noticeable. However, when you
    change permissions or start to work with more advanced administrative tools, knowing
    the file system type will help you understand how your commands affect the disk
    and its data.


    # EXT2


    The most common file system type under Linux is the EXT2 file system. Each partition
    on the disk contains a section superblock, which contains information about the
    file system itself. The superblock boots after the boot block. Its data includes
    information about the size of the filesystem, the number of free blocks on the
    disk and information about those blocks, the size of the inode list and information
    about free inodes, and other data when using disk space to execute or store data.


    An inode contains a description of the blocks which are occupied by a particular
    file, when the file was most recently modified, and what the file''s type is.
    You will see this in the subsequent sections. Unix files can be of a number of
    file types. The inode stores a description that indicates what kind of file is
    kept at a particular disk location. Each file has its own inode and, in fact,
    each inode has a unique identifying number. These inodes are all stored together
    in inode tables, the operating system uses to track empty and occupied inodes.
    Inodes also track file permissions and file ownership, but they do not store the
    file''s actual name.


    # UFS


    BSD, Solaris, and several other Unix variants use a file system called UFS, or
    the Unix File System. UFS resembles EXT2 in that it also uses superblocks and
    inodes to manage data organization and storage, but it is not as advanced.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Files and Directories


    Unfortunately, over the years, many Unix vendors and developers have independently
    added elements to their particular variant''s version of UFS. There are a number
    of file systems now called "UFS" which are incompatible, even though all are derived
    from the same basic structure.


    # FAT


    Although no Unix uses the FAT file system as its dominant method of organizing
    data, many users recognize it for compatibility between DOS/Windows files and
    the Unix operating system. The FAT file system was one of Microsoft''s first contributions
    to the computing world. Unlike EXT2, the FAT file system does not use inodes.
    Instead, it stores each file as a string of blocks. If there are not enough blocks
    in a sequence, FAT places a pointer to the remaining blocks in the last block
    of the sequence. Compare this to the inode method, which uses a table to identify
    all blocks that belong to a given file and uses disk space more efficiently, as
    well as conserving system resources. Because of the way in which FAT writes data,
    the physical disk mechanism must constantly move between the disk space and the
    actual location of the multiple blocks and block strings in which the file is
    stored. System resources are wasted as the operating system searches out each
    end of each block string rather than following the entire set of blocks allocated
    to this file from an inode table. Method of storing data can lead to slower system
    response or corrupted data. For this reason, those who use Windows must defragment
    their disk on a regular basis.


    # Files and Directories


    The core of the Unix file system is the file. Files are organized into directories,
    which may be contained within one other directories. In fact, the entire file
    system is nested within one root directory; Unix is not the only operating system
    to use this hierarchical concept; Windows and MacOS have brought the nested directory
    concept to the average computer user, with the visual construct of the file folder.


    # What Is a File?


    Because files are so central to the Unix concept, it is critical to define file
    as specifically as possible. Unfortunately, it is difficult to create a precise
    definition that still covers the range of uses which "file" covers. Consider the
    air surrounding us. It is everywhere around, it can be felt, and it is vital to
    life, but it cannot be seen. Likewise, files are so ubiquitous in the Unix operating
    system that it is hard to define them without saying, essentially, that we know
    them when we see them. Unfortunately, that glib answers'
