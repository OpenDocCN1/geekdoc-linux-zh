  md: '# # Basic System Administration: Part I


    # IN THIS CHAPTER


    +   1. The system administrator

    2. Managing users

    3. Managing user groups

    4. Disk management

    5. The Unix filesystem

    6. Mounting directories and devices

    7. Backups

    8. System security


    Sooner or later, most people who use Unix will start to perform some administrative
    tasks. Whether or not you become a professional system administrator, or even
    whether you install a computer Unix variant on one of your computers, will be
    exposed to tasks that are normally considered administrative. These tasks include
    dealing with user accounts, managing the disk and its allocation, and basic security
    control. Additional administrative jobs, primarily those that deal with software
    and print services, are introduced in Chapter 17: Basic System Administration,
    Part II.


    In the Unix environment, system administration is a job that almost anyone can
    perform. The person who holds the root account has final say over what and cannot
    be on the machine, individual users often invoke the same programs that administrators
    use. On some systems, users are responsible for functions that, on other systems,
    are the sole responsibility of the administrator. The differences are in part
    due to the culture of the organization which hosts the net-'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'work, and in part due to the willingness of the administrator to enlarge the
    scope of user abilities.


    In this chapter, we assume that you either have permission to perform certain
    tasks on your machine, or that you are the root account (having installed a personal
    computer Unix variant). On all well-configured systems, if you do not have permission
    to perform one of these commands and you do to execute it, the command will fail.
    However, your attempt will be recorded in system logs and may cause some curiosity
    about what you are doing; ask permission if necessary.


    Note:


    # The System Administrator


    In most situations, the term system administrator refers to "the person or persons
    who have access to the root account." The concept of root has been introduced
    earlier in this book, but it is especially important to discuss it in the context
    of system administration. The root account is one of the hallmarks of Unix, differentiating
    it from personal operating systems.


    Whoever has access to the root, or superuser, account has total and complete control
    over the machine. The root user can add or delete users, software, default settings,
    network connections, and any other activity which may be performed on the computer.
    Root can read any file in any directory, including files contained in personal
    user accounts. Root has no need for passwords, except for the root password, because
    the root account can assume the identity of any user account on the machine. Root,
    in short, is a dictator with absolute power.


    Why does Unix have so much power to one account? The root concept exists because
    everyone needs to have the authority. Root can do all things they need to be done,
    but it would be chaos if every user could change administrative settings whenever
    they chose to do so. Instead, the ability to affect the entire machine is limited
    to those with the root account, and individual users are limited to administering
    their own home directories.


    Obviously, with such power comes responsibility. The root holders may be tempted
    to sniff through user accounts, or to enforce rules based on how much they like
    a particular user. On a personal machine with only a few users, this might be
    more of an annoyance than a problem. In large networks, however, administrators
    must enforce system policies as ever-handedly as possible. In general, no matter
    how large or small the system, it is best to set down rules and administer the
    machine according to these policies. The ethics of system administration are a
    legitimate concern, both for the administrator and for the users on the network.'
  merge: -1
  pgno: 254
