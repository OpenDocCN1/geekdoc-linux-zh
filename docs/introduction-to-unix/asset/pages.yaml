    If you want them installed someplace else, you will have to move them by hand.


    # # Package Management Systems


    Installing software from source code has its advantages and its disadvantages.
    On one hand, you get a lot of control over the process when you install from source
    code. Many source code packages offer a large number of compile options. These
    options let you create a final binary that does exactly what you want, without
    wasting system resources on unnecessary functions. The price you pay for this
    flexibility is a lot of complexity that can range from the merely tedious to the
    babbling and frustrating.


    Package management systems reverse this situation. For most normal software installations,
    package management systems make installing a simple software process which often
    just a matter of issuing a single command. The disadvantage of these systems is
    that you are often limited to installing a piece of software that has been preconfigured
    to fit as many situations as possible. In most cases and for most users, this
    is not a problem and a package management system may represent significant time
    savings with little to no downside.


    Another advantage of package management systems is that they often create and
    maintain a database of the software installed on your system. This data allows
    the manager to check and report on any possible dependency or conflict issues
    when you install a new package, or get required libraries before an installation.
    Package management systems automatically check for new versions of your installed
    software and download updates when they are released.


    Yet another advantage of these management systems is that software which is not
    Open Source—that is, which is available only in a precompiled binary format—is
    available under certain package management systems. For example, the popular commercial
    vmware, a PC hardware emulator, is available in packages that are compatible with
    the RPM package management system. Such programs are never available as source
    code.'
  merge: -1
  pgno: 277
- img_proc: true
  md: 'There is no rule which decrees that a given system may have only software installed
    by a package manager or software compiled locally from source code. Most systems
    have both, and most administrators are equally fluent in the procedure required
    for both kinds of installation. The only caveat in this situation is that the
    package management system''s database, if it has one, will not know about the
    programs you have compiled yourself. This is not a problem of vast proportions,
    and at its worst would probably be a minor annoyance rather than a legitimate
    reason to avoid source code.


    # # Case In Point: RPM


    Package management systems are often specific to the particular Unix variant with
    which they are released. Since there are several of these systems, slightly different,
    it serves no purpose to describe each here. A review of the most popular package
    management systems, RPM, should give you a good idea of how similar programs work
    on other Unix variants.


    RPM, a recursive acronym means "RPM Package Manager," was developed for Red Hat
    Linux. Because RPM is Free software, however, the code was publicly released and
    has subsequently been adapted by other Linux distributions. RPM variants can be
    found on Linux Mandrake and SuSE Linux, among others.


    RPM is a simple program for almost all installations. To install a package,


    ```

    rpm -i packagename

    ```


    To uninstall a package, issue the command


    ```

    rpm -e packagename

    ```


    To upgrade a package, issue the command


    ```

    rpm -U packagename

    ```


    RPM, like all package management systems, only works with packages that are specially
    formatted for it. Such packages are usually called RPMs, and have a particular
    syntax:


    ```

    name version-number build-number.architecture.

    ```


    The first three elements are the main identifying information in the package name.
    Name and version number are self-evident.


    # # Build


    Build number refers to the particular binary version of the package. For example,
    a package distributor may compile the software five times to get just the right
    mix of compile-time options. The final version would be referred to as "build
    number 5" and that number would be reflected in the package name.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# Architecture


    The architecture component of the package name refers to the type of system for
    which the software is compiled. For example, most personal computers are identified
    as "i386", for "Intel 386". Of course, the Intel 386 processor has not been state-of-the-art
    for many years. However, software compiled for a386 will run on any Intel PC processor
    or clone of an Intel processor. From time to time, you may see packages compiled
    for Intel architectures, as in "i586" or "i686". Other common architecture designations
    include "ppc" for Macintosh, "alpha" for DEC Alpha processors, or "sparc" for
    Sun processors.


    You may also come across two other architectural designations from time to time:
    "noarch architecture. For example, programs written in interpreted languages such
    as Perl or Python will run on any architecture so long as the appropriate interpreter
    is installed properly. The "src" designation identifies packages which consist
    of software in source code. RPM has the ability to invoke the local compiler and
    to create binary programs from source code RPMs.


    Installing code RPMs is an advanced skill and is not dealt with in this chapter.
    If you want to learn more about this process, visit the RPM Web site and read
    the documentation. The site is listed in Appendix D. Resources.


    These elements are all joined to create the actual package name. An RPM file might
    have a name like this:

    d2unix-3.1-1386.rpm


    ```

    dos2unix-3.1-1386.rpm

    ```


    This name tells you the name of the package, dos2unix, the version 3.1, and the
    build number, 3. It also tells you the architecture required for this package,
    i386.


    To install this file, issue the command


    ```

    rpm -e dos2unix-3.1-1386.rpm

    ```


    To uninstall this file, issue the command


    ```

    rpm -i dos2unix-3.1-3

    ```


    Note that the architecture and package suffix has been left out of the command.
    This is because the package is installed, it is known to the RPM database only
    by the basic element of the package name. The architecture and .rpm suffix are
    added at that given point, since the software would not install incorrect architecture
    and the RPM program would not work with non-RPM-encoded package.


    In addition to these functions, RPM is network-aware. That is, if your local machine
    is connected to a network or to the Internet, you can simultaneously download
    and install a package by issuing the command with a full URL as in the following


    ```

    rpm -i ftp://some.server/rpms/dos2unix-3.1-i386.rpm

    ```


    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_279_0.png)'
  merge: -1
