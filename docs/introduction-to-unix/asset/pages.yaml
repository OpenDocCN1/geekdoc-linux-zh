    Electronic mail messages are transferred over network connections between the
    originating machine and the receiving machine. The end recipient receives messages
    through a mail reader program, which usually accesses the messages from a local
    file. A second program is to get the messages from a remote mail server to the
    local pool, which are accessible to the user''s client program. Typical mail readers
    include ELIM and PINE.


    The World Web is a method of sharing various file types without requiring the
    file components to be downloaded or by mail. The World Web requires a particular
    user client called a browser, which translates the file types into a single page
