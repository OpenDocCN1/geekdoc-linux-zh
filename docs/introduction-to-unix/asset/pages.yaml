    are a way to transfer data between an internal machine and an external machine
    without ever connecting the two. Both are excellent solutions for the small-to-medium
    network, and mandatory for larger networks with millions of connections daily.


    # Password Security


    Whether or not you become a system administrator, you can participate in one of
    the easiest security schemes by selecting an appropriate password and practising
    good password management. Passwords are like car keys. If someone steals your
    car keys, they can unlock and drive your car wherever they like. The car doesn''t
    know it''s you; all the car knows is what was inserted into the steering column.
    Just like the car, your Unix account doesn''t know the person entering your password
    isn''t you.


    Passwords should be strong passwords. The best passwords are a mix of alphabetical
    and numeric characters, as well as a mix of upper and lower case. Passwords should
    never be plain dictionary words. Many crackers use a dictionary program called
