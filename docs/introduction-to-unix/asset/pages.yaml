  md: '# scsh


    The scsh shell is based on the Scheme programming language. Scheme is a very powerful
    and elegant language which is not used widely, but which has a vocal and dedicated
    user community. Those users who program in Scheme will find the scsh shell intuitive
    and useful.


    # rc and es


    The rc and es do not implement the specific features of any one programming language.
    Rather, they attempt to bring modern programming techniques and abilities into
    the world of Unix shells, which are based on programming techniques more than
    30 years old. The major difference between most Unix shells and the rc and es
    shells is in the number of shell operations which are represented as function
    calls, programming constructs which exist in all languages but are not used for
    many operations in older Unix shells.


    # The Perl Shell


    Over the past few years, the Perl programming language has become quite popular
    among programmers and administrators. The Perl programming syntax is not different
    from the syntax used with bash, but there are significant differences. The Perl
    shell is an attempt to integrate Perl syntax with necessary shell functions. This
    shell is in an early stage of development.


    # Environment Variables


    The shell itself is a very basic program. Its primary function is to interact
    with the operating system, not to provide a comfortable user environment. However,
    shell developers have recognized that users need some consideration in order to
    make the shell easier to use and less difficult to work with.


    As a result, every shell is configurable to some extent. Some shells offer more
    options than others, but all shells provide some level of configurability. Options
    range from the appearance of the shell prompt to technical tricks which make shell
    programming easier. The common element of all these options is that they are controlled
    by environment variables.


    # Variables


    What is a variable? A variable is a text string, or name, which is used to associate
    a particular setting with a specific value. The variable is an abstraction. It
    allows a program to use a piece of information without knowing the actual information
    is. A programmer can write a general program, using variables,'
