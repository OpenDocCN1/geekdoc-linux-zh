  md: "# Signals\n\n# 231\n\nIn fact, signal 15 is the default value for the kill\
    \ command, you could actually just write kill `<process_ID>`, but you must follow\
    \ the syntax above for all other signal values.\n\nRegardless of the method you\
    \ choose, signal 15 will be sent to the process specified by the identification\
    \ number. What happens at that point depends largely on how the receiving process\
    \ has been configured to deal with signal. The exception to this guideline is\
    \ signal 9. No what code exists in the receiving process, signal 9 will always\
    \ stop that process from running.\n\nThe commonly used signals are SIGHUP (1),\
    \ SIGINT (2), SIGKILL (9), SIGSEGV (6), and SIGTERM (15). However, given that\
    \ 9 is the only signal that distinguishes itself in any significant way at a superficial\
    \ level, you can use whatever signal you prefer as long as you use signal 9 when\
    \ you really want to run a killing process.\n\nOf course, each of these signals\
    \ is slightly different. If they weren't, there would be no reason to have such\
    \ a list of signals. Most of these are used for inter-process communication with\
    \ the kernel and in other low-level system functions. Unfortunately, there is\
    \ little documentation describing the function of each signal. If you understand\
    \ the C language and are able to read C code, you can read the source code for\
    \ the kernel in which the signals are defined, assuming that the source for your\
    \ Unix variant is available. For most purposes in shell programs, however, you\
    \ will probably settle for a small subset of signals that you use consistently.\n\
    \n> Note:\n\n# Signal Traps\n\nIn order to use signals effectively, you must create\
    \ a signal trap. To do this, you must anticipate the particular signal that will\
    \ be received and decide what should happen when the signal appears. Not surprisingly,\
    \ signals are trapped with the trap command. For example,\n\n```\ntrap \"exit\
    \ 1\" INT\n```\n\nwould cause the program to exit with a status of 1 if a SIGINT\
    \ (signal 2) is received.\n\nAn example of this process can be found in this code\
    \ block:\n\n```\n#!/bin/bash\n# program that keeps looping until it gets a SIGINT\n\
    trap \"echo 'caught a SIGINT'; exit 1\" INT\nwhile 0\ndo\n  echo \"looping\"\n\
    \  sleep 10\ndo\n```\n\nThis program prints the word \"looping\" until it receives\
    \ a SIGINT, at which it prints \"caught a SIGINT\" and exits with a status of\
    \ 1."
