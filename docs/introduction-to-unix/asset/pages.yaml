  md: '# Electronic Mail Clients


    # Configuring Elm


    Elm has a large number of configuration options that modify its behavior. To set
    the most basic options, press the o key at the main Elm prompt to invoke the options
    command. A list of options, with associated values, appears. Type the letter associated
    with the parameter you want to change; the cursor will move to the appropriate
    entry, where you can change the value.


    For example, you can change the Elm editor from this screen. Changes made will
    not affect your general shell environment variables, so you could select Pico
    as your Elm editor but use vi in your normal shell. Replace the path name of the
    current editor with the path name of the editor you want to use. Press the Enter
    key to set the value and return to the options. Edit as many values as you like,
    then press the > key to save your changes. Press the i to leave the options menu
    and return to the main screen.


    If you wish to do more advanced configurations, you must edit the Elm run control
    file. This file is stored in a subdirectory of your home directory, using the
    path .elmrc. The .elmrc directory is created when you run Elm for the first time.
    If you have not made changes in the Elm option menu, you may not have an .elmrc
    file yet. This means that Elm is using the systemwide configuration file, usually
    stored at /usr/lib/elmrc-info, but possibly at another location depending on your
    Unix variant. Locate the file with the command


    ```

    where elmrc-info

    ```


    The path name will print to the screen. When you make changes on the Elm option
    menu, Elm copies this file into your .elmrc subdirectory and renames it .elmrc.


    Once the .elmrc file exists in your user account, you can edit it with a text
    editor. The file is too long to reproduce here, but it is well commented and easy
    to understand. A sample from the file looks like this:


    ```

    # Would you like to be asked for Carbon-Copy addresses #n# when sending a message?

    ### askcc = ON

    ```


    The hashmarks at the beginning of the line indicate that a line is not to be interpreted
    as program data when the .elmrc file is parsed at start-up. The actual option
    line is also preceded by two hashmarks, the option itself is not active and Elm
    will not prompt for cc: addresses when a new message is sent. Make the value active
    by removing the hashmarks and changing the value if desired, as in:


    ```

    # Would you like to be asked for Carbon-Copy addresses #n# when sending a message?

    askcc = OFF

    ```'
  merge: -1
  pgno: 147
- img_proc: true
