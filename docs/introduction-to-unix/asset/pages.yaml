- img_proc: true
  md: "# Creating Exit Status\n\nThese examples provide some insight into the importance\
    \ and usefulness of exit status to the shell programs. Exit status can also be\
    \ produced within individual shell programs. Remember that, as described in Chapter\
    \ 13, an exit statement can be added to a shell program to close a code loop.\
    \ That exit statement can take an argument composed of a number which will become\
    \ its exit status.\n\nTo illustrate this concept, consider the code block\n\n\
    ```\nif <normal execution>\n    exit 0\n  else\n    exit 1\n  fi\n```\n\nIn this\
    \ case, if the main action of the program executes as planned, the program will\
    \ exit with the status of zero. If something happens and the program does not\
    \ execute properly, it will have the exit status 1. The complexity of the example\
    \ can be expanded, as in\n\n```\nif <normal execution>\n    exit 0\n  elif <error_type_1>\n\
    \    exit 1\n  elif <error_type_2>\n    exit 2\n  elif <error_type_3>\n    exit\
    \ 3\n  elif <error_type_4>\n    exit 4\n  else\n    exit 5\n  fi\n```\n\nIn this\
    \ case, if the program failed, the exit status would identify the type of failure.\n\
    \nThe value of such examples is in their implication for your programs. Your programs\
    \ can use any command that can be issued at the shell prompt. This means that\
    \ you can also use your programs as commands nested into other programs. Since\
    \ your program can generate an exit value, that value can be used to carry information\
    \ from one program to another in a chain of consequences."
