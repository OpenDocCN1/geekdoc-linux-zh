  md: '# The World Wide Web


    The KMail screen has a menu bar, an icon bar, and three panes, or distinct windows.
    The upper left pane provides access to KMail''s sub-folders. These folders include
    the Inbox, the Outbox, a sent-mail folder, and the Local folder used to store
    messages you want to save. This pane also contains the Trash Can, where deleted
    messages are stored in case you need to recover them. Select a folder by clicking
    on it; the name of the current folder is highlighted.


    The pane to the right displays the messages stored in the highlighted folder.
    If the highlighted folder is the Inbox, then the messages displayed will be in
    the mail pool. The least pane, the message pane, displays the body of the current
    message selected in the message pane.


    To compose a new message, click on the "New Message" icon in the icon bar or select
    the "New Composer" option from the File menu. The KMail composer window opens,
    showing the message headers and a large text entry window. Fill in the headers
    and enter your message. To send the message, click the "Send" icon or select the
    "Send" entry from the File menu.


