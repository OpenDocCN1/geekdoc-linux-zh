- img_proc: true
  md: '# # Networking I:

    Introduction to Unix Networking


    # IN THIS CHAPTER


    +   1. Remote access and file transfer

    2. telnet and login

    3. rcp and rsh

    4. Secure tools

    5. Basic networking concepts

    6. TCP/IP

    7. Networking hardware


    The previous chapter introduced some common Internet applications used on the
    Unix platform. The Internet is the most commonly understood network, as most people
    comprehend how information travels between computers around the world along a
    number of pathways. In this chapter, you will learn the concepts behind the networks
    themselves.


    With this chapter, we move from personal user experience with Unix to the area
    of system administration. In the first nine chapters, you learned how to manipulate
    files and programs with simple commands. In the remainder of the text, you will
    learn to access a machine or programs as they affect the Unix machine and network
    as a whole. Once network connections are configured and established on a single
    machine, any user on that network can use the software installed on that single
    computer as long as she has been granted permission to do so.


    Because many of the functions involved in networking require superuser privileges,
    you will either need access to a machine on which you have (e.g., a personal computer
    running FreeBSD, Linux, or a similar variant) or your instructor will need to
    make arrangements for you to have these functions demonstrated.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# CHAPTER 10 Networking Introduction to Networking


    you are using a Personal Unix variant and have root, you will also need to have
    access to a network: preferably, one connected to the Internet so that you can
    download new software as needed or consult online documentation.


    # Remote Access and File Transfer


    Although the applications used to manage remote machines and to transfer files
    are user-level applications, they differ from the user applications described
    in Chapter 9, Internet Applications, because they do not involve the services
    with casual Internet users are familiar. Rather, these applications involve tools
    which make it possible to work with machines across a net-environment. Often,
    working with these other machines is exactly like using the local machine at which
    you are sitting.


    Specifically, these applications involve remote access and file transfer. Remote
    access programs allow a user to log into a machine on the network and use that
    machine just if it were the computer on her desk, no matter where that machine
    is located. For example, one of the applications of this text works on a machine
    in Palo Alto, California, from his desk in Boston. Other users of that machine
    log from European countries, Japan, and least eight U.S. states. In the same way,
    it is possible to log into a machine while travelling, to get electronic mail
    or check system function. Note that this means an actual login to the computer,
    as it were right in front of the user, as opposed to remote retrieval of electronic
    mail or viewing files through Web.


    File transfer is a function which allows users to download or upload files from
    one machine to another across a network. While this capability is built into all
    Web browsers, its function is not explicit in a browser as it is handled by normal
    Unix methods and software. File transfer programs are usually called FTP clients,
    an acronym for File Transfer Protocol.


    # telnet, login, rsh, and rcp: Why Nobody Uses Themymore


    The programs described in this section are rapidly becoming obsolete. Nonetheless,
    they are included here because they are still in use on many machines. The programs
    which have replaced them are built on these programs and their code, rather than
    being completely new inventions.


    The reason that these programs are becoming obsolete is to do with work security.
    These programs were written at a time when the practice of cracking, or breaking
    into networks without authorization, was less advanced and popular than it is
    today. These programs are used to establish a simple connection between individual
    machines, and allow the user to perform whatever tasks are needed on the remote
    machine.'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'The term "hacker" has been adopted by the media to describe people who attempt
    illegal entry to a network. This is a misuse of the term, which is an old nickname
    for someone who enjoys working on code to improve a piece of software. The correct
    term for those who try to break into systems for which they have no permission
    is "cracker". Such illegal conduct is abhorred by hackers.


    The simple nature of the connection created by these programs means that sensitive
    information, such as a password, is sent in clear text. The system having access
    to a class of tools packet sniffers makes it relatively simple matter to intercept
    these communications and capture passwords. A packet sniffer works by trapping
    the individual packets of information that make up the data stream and sending
    those packets to the cracker for further investigation.


    Another reason is the "r" commands are dangerous that it is possible to use them
    without passwords. As irresponsible as it may seem, a user can define a set of
    user and machine names which can be granted "trusted" access to the local machine.
    This is done by creating a file in the /etc/ directory called hosts.equiv. In
    that file one places a remote machine along with an optional user name and a plus
    or minus sign. For example,


    +   - flerbnernet.com


    will allow the user "sam" to log in the domain "flerbnernet.com". If any of these
    elements are left out, it is assumed that all values will satisfy the condition.
    Thus


    +   - sam


    will allow user "sam" to log in without a password from any remote machine, and
    the line


    +   - flerbnernet.com


    will allow any user to log in without a password from the "flerbnernet.com" domain.
    This begins to get really dangerous when you introduce this line:


    as will allow any user to log in without a password from anywhere.


    /etc/hosts.equiv cannot be used to provide passwordless access to the "root" account.


    Despite the security flaws in these programs, they still exist on Unix machines
    and actively used by many. There are several reasons for this. First, these programs
    are still quite useful, especially for programs which require a machine to connect
    to itself for various purposes. Second, the programs are useful in networks of
    trusted machines, or networks which do not connect to the Internet. Finally, these
    programs are often part of shell scripts or other administrative programs which
    were written in the years'
