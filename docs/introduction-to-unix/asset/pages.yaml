  md: 'other editing commands are usually given at the end of the pattern being matched.
    For example, to delete a piece of text, you might issue the command-


    ```

    sed ''/target/d'' input.file

    ```


    This command matches all occurrences of the text string target and deletes them
    when found. With the substitution command, you can restrict the deletion to a
    line or range of lines by prepending the command with a line number or range,
    as in


    ```

    sed ''22,25/target/d'' input.file

    ```


    The append command inserts text into the file after the point specified in the
    invocation. The append command takes the syntax


    ```

    sed ''/target/\''

    ```


    This is the text that will be appended. It may span several lines.'' input.file


    Note the backslash after a command, and that the backslash is repeated at the
    end of each incomplete line of text.


    The insert command is similar, except that it inserts the text immediately before
    the specified point. That is, command


    ```

    sed ''/target/i''

    ```


    This is the text that will be inserted, which can span several lines.'' input.file


    will insert the new text immediately before the string specified as the target.
    Should the text be placed at the incorrect spot, when append is used when intended,
    the delete command can take multiple lines of text as well.


    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_229_0.png)


    Like sed, awk is a program that operates line-by-line on its input. The difference
    between sed and awk lies in what each program was designed to do. Where sed is
    concerned primarily with editing, awk is more concerned with formatting output.
    The primary concept to keep in mind when using awk is that of the field.


    A field is a particular section of an input line. Each field is separated from
    the other fields in the line by a specific character called a delimiter. The default
    delimiter is any "whitespace" character that is, a space or tab character. In
    other words, a typical line of text would be broken up into individual words,
    and the spaces between each word would be interpreted as delimiters. Each field
    in a line is identified by the dollar sign character and a field number. Fields
    are numbered from left to right.'
