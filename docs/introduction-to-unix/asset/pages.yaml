  md: '# # Shell Programming I: Introduction to Shell Programming


    # IN THIS CHAPTER


    +   1. What is shell programming?

    2. Programs vs. scripts

    3. Anatomy of a shell program


    In the previous sections of this book, you have learned to use the shell to execute
    single commands, and to chain commands together with redirections and pipes. In
    this section of the text, you will learn to create entire programs from individual
    shell commands. These programs are in a repeatable format which does not need
    to be retyped each time you want to run that sequence of commands.


    Such programming of the shell is called, appropriately enough, shell programming.
    It is also sometimes known as system programming, especially when the programs
    serve an administrative function. However, system programming is a broader term
    which can also refer to programs which affect the running of the system but which
    are not necessarily composed of shell commands. For example, it is possible to
    do system programming in the Perl language. For this reason, we do not use the
    term "system programming" to refer to work done within the shell.


    # What Is Shell Programming?


    Shell programming is where the real power of Unix is unleashed. The shell''s command
    language is also a fully featured programming language, complete with the ability
    to handle data in complex ways, a very high degree of automation is within reach.
    For the system administrator, shell programs


    183'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# Automating Repetitive Tasks


    When system administrators think of the benefits of shell programming, one of
    the first areas is that of automating repetitive tasks. System administrators
    are often called to perform certain tasks at regular intervals. The classic example
    of this kind of task is the system backup. Most organizations that rely upon their
    Unix machines require their system administrators to make regular of all files
    housed on those computers. These backups are critical, since they are the only
    thing that stands between the organization and the loss of all its crucial data
    in the event of a system crash, disk failure, crash attack, or any other catastrophic
    event that might damage the system. Most networks have a version of their backup
    schedule. That is, the entire system might be backed up once a month, but certain
    directories would be backed up weekly or even daily, due to the importance of
    the data stored in those directories.


    Clearly, running backups on a frequent basis requires a large time investment
    for network administrators. Fortunately, backups is a fairly mechanical operation,
    and can be successfully automated with shell programs. These shell programs can
    then be run automatically with the Unix scheduling utility cron. With these simple
    tools, almost all the labor involved with regular backups can be eliminated. If
    the programs have been written and the automatic scheduler configured, the administrator''s
    work is reduced to double-checking that backups were performed as scheduled.


    Similar solutions can be applied to the myriad of other repetitive tasks found
    on most networks: disk space inventories, security audits, file type management,
    and the like. The automation of these tasks leaves the administrator free to concentrate
    on unique problems that inevitably appear in the course of daily network operations.
    What were once time-intensive tasks now require only regular checks.


    # Making the Complex Simple


    While shell programming can eliminate or sharply reduce time spent on repetitive
    tasks, it can also simplify complex jobs. There are a number of tasks that have
    lengthy command chains and may warrant time spent on streamlining the effort required.
    For some of these tasks, the effort put into the job may be significantly greater
    than the time it would require to create a programmed solution.


    For example, assume that you are the administrator of a large Unix network with
    hundreds of users. In reading your daily logs, you notice that the network is
    running out of disk space. You suspect that many users are keeping'
  merge: -1
  pgno: 196
- img_proc: true
  md: 'much data in their home directories. To solve this problem, you could examine
    the amount of disk space in each home directory and, if necessary, e-mail each
    user asking them to reduce the number of files. With hundreds of users, however
    this might take hours or days. The other solution would be to create a program
    that does the same thing. Writing the program would take less than an hour, and
    it can then run in the background while you go on to other work.


    # Programs and Scripts


    Many people refer to shell programs as scripts. For most purposes, these terms
    are synonymous. However, there is some controversy surrounding this usage. Some
    people believe that shell programming is not “real” programming because the native
    shell language does not have as many features as actual programming languages
    like C. Others draw a distinction by defining a program as something which must
    be compiled, or converted into binary code before running, and a script as something
    which is interpreted, or converted into binary code while running. Still others
    think of shell programs as scripts because they learned the terminology many years
    ago when shell languages were less developed than they are now.


    Whatever the reason for it, it is less precise to use the term script for shell
    programming. "Script" implies a rote series of steps or repeated verbatim each
    time it is run. Shell programs are more complex than that. Shell programs can
    evaluate data and make decisions about how to execute themselves, and they can
    change their behavior in response to their circumstances. The term “script” is
    too restrictive for such complex behavior. Nevertheless, the word is commonly
    used and you will use it frequently, even in this book.


    # Anatomy of a Shell Program


    A shell program is a simple text file. It can be read by humans and by machines.
    There are several components common to shell programs, no matter their function.
    These components are broad concepts which make up the overall framework of the
    program. In the remaining chapters of this section, these general ideas will be
    broken down into more specific constructs and program components.


    # Invoking the Shell


    Like other elements in the Unix operating system, shell programs are stored as
    text files. There is nothing particular about a shell program that appears different
    from a letter, a configuration file, or a journal entry.'
  merge: -1
  pgno: 197
- img_proc: true
  md: 'computer cannot tell that a file is a shell program by looking at the file\and
    any designations it may carry. In order to let the operating system know

    the file is a shell program, the program must invoke the shell as its first

    action.


    To invoke it, the first working line of the shell program must contain a

    line like this:


    ```

    #!path/to/shell

    ```


    where the string path/to/shell is replaced with the full path name of the shell

    y you want to execute this script. Should there be a number of shells installed

    of the system, any one of them may be used to run a particular script, even

    it is not the shell currently active in the user environment.


    The first "working line" of the program is the first line which will be parsed
    by the

    shell as a command. The first working line is not necessarily the initial line
    of the pro-

    gram. It may be preceded by comments, as explained below, which are intended for

    human readers and not for the shell.


    Thus, any shell program which is intended to invoke the bash shell would

    have the first working line of


    ```

    #!/bin/bash

    ```


    /bin/bash is the traditional location of the bash executable file. The

    construct #!, known as a hash-bang or shebang in Unix slang, indicates to the

    operating system that the specified shell must be started in order to run

    the program.


    # Comments


    Comments do not affect the operation of the shell program. Instead, they are

    notes written by the program''s creator and are intended for human users of

    the program. Comments may explain a particular construct or might warn the

    user of a potential problem.


    Many people, including programmers, underestimate the importance of com-\ments.
    Comments serve to keep a program understandable, regardless of its

    complexity. Every program should have a comment at its beginning in each section
    of

    the program explaining what that particular segment of the program is designed

    to do.


    When you are writing shell programs, and if you move on to write more com-\plex
    programs, you should add comments even if you never plan to share your

    programs with anyone else. Over the course of time, it is very easy to forget

    how a given program works, especially if it was only used a few times. Revising

    an old program can be a frustrating experience if it was not properly com-

    mented at the start.'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# Anatomy of a Shell Program


    To insert a comment into the program, simply start the comment line with the hashmark
    character, # as in


    ```

    # This line is a comment.

    ```


    Comments which occupy more than one line must have a hashmark at the beginning
    of each line, as in


    ```

    # This is a comment

    ```


    ```

    # which spans two lines.

    ```


    Note that the hashmark alone and the hashbang, #!, are two different things. The
    shell invocation is not a comment even though its initial character is the hashmark.


    # Commands


    Commands are the heart of a shell program. The central idea of shell programming
    involves chaining shell commands together to create complex behavior. In a shell
    program, you can use any command that might be issued at the prompt, which operates
    non-interactively or can be configured to do so. For example, you could use the
    ls command, but not the pico command, because the pico editor requires interactive
    data entry.


    It is important to remember that many Unix programs which normally run interactively
    have options which allow them to run non-interactively in a shell program. One
    such program is the text-based Web browsers, which has the --dump and --source
    options. These options allow a Web page or remote file to be grabbed by the shell
    and sent to the standard output without any intervention from the user. Such actions
    can be handy, perhaps to pull a local weather report or a set of sports scores
    at regular intervals. To learn more about changing the default behavior of a given
    Unix command, consult the program''s manual page or any other program documentation
    you might find.


    # Data


    If a program consists of a set of actions, the data is the object upon which those
    actions are performed. Data can be anything: numbers, words, expressions, or other
    commands. A program might draw data from a text file, a system log, a random number
    generator, or any other source on the machine.


    Data used by shell programs are stored in variables. In earlier chapters, you
    learned about environment variables, which store settings for the user environment.
    Program variables work in the same way, except that they are not exported to the
    system as a whole. They remain specific to the shell program in which they were
    created. This does not mean that you cannot use environment variables in a shell
    program; they are valid entries and types of'
