  md: '# The Shell Environment


    # IN THIS CHAPTER


    +   1. Major Unix shells

    2. Other Unix shells

    3. Environment variables

    4. Changing environment variables

    5. System-level control files

    6. Personal run control files


    The shell environment is the primary method of interaction between user and operating
    system. Though the shell has a very small interface—the system prompt—it part
    of every operation the user requests from the machine. There are a number of shells
    available to the Unix user, regardless of variant. Individual shells may be tailored
    to the programmer, to the user, or for some other reason. Several of these shells
    are profiled in this chapter.


    Users can configure the shell to fit their particular desires or needs. These
    configurations are managed with environment variables, a construct which allows
    the user to change the value of a particular variable without having to change
    any programs or scripts which use of the variable itself. Many of these variables
    are embedded in the shell''s run control files, text files which are parsed when
    the shell starts up at boot. Configurations are generally run in run control files,
    and many programs other than the shell use these files to manage user preferences.'
  merge: -1
