  md: '# CHAPTER 16 Basic System Administration: Part I


    # Physical Security


    Oddly, physical security is sometimes overlooked when the topic of network security
    comes up. While software is a very useful tool and works in the vast majority
    of security cases, physical security is another concern. If someone breaks into
    your apartment and takes your computer, that''s a security breach. They have your
    machine, with all its data, and any communications hardware they have taken. Such
    theft could be as damaging to you as a crack or a virus from a downloaded file.


    Physical security solutions are common sense. Lock your doors and windows. Carry
    homeowner''s or rental insurance, and engage your machines with your driver''s
    license number. Keep an inventory of your hardware, with serial numbers and receipts
    if possible. This will help the police if your property is stolen. If you have
    a roommate or friend who is prone to stupid pranks, figure out how to lock up
    the machines. Even a simple knob lock on a spare bedroom may be enough to dissuade
    those who are "trying to be funny" by tinkering with your network. At work, consider
    a separate room if you have many machines to keep safe. Such room should be well
    ventilated and may need extra cooling to deal with machine heat. Individual machines
    can be cabled to desks.


    A persistent thief can overcome most physical security precautions, but it is
    the casual thief that causes the most trouble. If someone really wants your data,
    they can just open the case and take the hard drive. Someone who grabs your machine
    and runs is looking for an easily pawned or fenced item. Take the same precautions
    with your computer equipment that you would with an expensive bicycle or stereo
    components.


    # Internal Security


    The more users on your network, the more security risks. Every new user is an
    additional potential breach. Administrators should make every attempt to get to
    know their user base, but rather familiarizing yourself with regular system behavior.
    Does b b log from home every night at 11:00 P.M. to download files? Have you ever
    seen user jkat log in on weekends? Once you know what regu'
