  md: 'Functions which a network provides to external users are managed by these services.
    These programs manage external client requests and return the desired file or
    files. Most networks run some services internally, like Windows or NFS, but the
    most well-known services are Internet-related. Services use client-server architecture.
    Administrators should choose an array of services based on the needs of the local
    user base and the purpose of the network. Since unused services are a security
    risk, it is best to run only the services which are needed and actually used.


    Web pages are transmitted over the HTTP and HTML protocols. The most popular Web
    server is Apache, which offers modular construction. Apache can serve a number
    of functions depending on the modules installed. For those uninterested in running
    Apache, other Web servers are available for Unix. There are fewer choices for
    electronic mail servers; most choice in e-mail is limited to users clients. Mail
    servers pass messages to and from external networks, distributing them to the
    appropriate recipient. Some administrators may use a USNEWS server. News require
    a level of commitment they should be monitored and reconfigured on a regular basis.
    Most news require multiple upstream servers to provide the best range of newsgroups.


    Many services do not need to run constantly. Rather, they can be started when
    an incoming request requires that, and shut down when needed. This saves CPU cycles
    and reduces overall system load. The input program helps manage services in this
    way. Some programs commonly run under inlet transfer and remote login access.


