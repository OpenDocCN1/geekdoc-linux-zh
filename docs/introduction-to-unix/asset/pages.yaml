  md: '# CHAPTER 2 Basic Unix Concepts


    # IN THIS CHAPTER


    +   1. What is an operating system?

    2. Structure of a Unix operating system

    3. The kernel

    4. The shell

    5. The file system

    6. Users

    7. Accounts

    8. The superuser

    9. Logging into your account

    10. Logging out of your account


    This chapter provides the framework you will need to understand the rest of the
    material in the text. No matter which flavor of Unix you use while studying the
    operating system, it will have these basic components. The many Unix variants
    may use different ways to accomplish the same task, but each of these methods
    uses the same components to achieve the same goal.


    Much like the human body, a Unix system is composed of various parts that work
    together and mutually support each other. For example, in the human body, the
    digestive system requires oxygen from the respiratory system, delivered by blood
    in the circulatory system, Likewise, the respiratory system requires the energy
    from digested food in order to keep the lungs and diaphragm moving. In the same
    way, a Unix system has different cycles and components that interact in order
    to perform the tasks you request.'
