    Note that most of the file is commented out. There are actually very active lines
    in the file, but the inactive lines are retained in case they need to be used
    at a later time. Entries in this file take syntax


    ```

    service socket protocol flags user path filename

    ```


    The service entries define the service; the socket and protocol entries define
    the data flow method used by the service; the flag entry define how sockets manage
    incoming connections; the user entry define the server''s owner; the path and
    filename entries locate the server in the filesystem.


    If you choose to run inet on your system, you will need to review and update the
    configuration files regularly. inet may not be the most efficient way of managing
    certain processes on your machine, or you might find that it handles your incoming
    requests better than running individual servers constantly. Certainly, inet is
    a valuable tool for providing services across the Internet.


    Some systems are migrating from inet to the xinetd daemon. Xinetd is more secure
    and offers more variety in configuration for specific network needs. Although
    it is currently used mostly on Linux networks, there is no reason why xinetd cannot
    be used on other network platforms as a drop-in replacement for standard inet.


