  md: '# # Shell Programming II:

    Variables and Flow Control


    IN THIS CHAPTER


    +   1. Shell program basics

    2. What is a variable?

    3. Assigning variables

    4. Special variables

    5. Conditional flow control

    6. Iterative flow control


    In this chapter, we introduce the basic techniques of shell programming. The chapter
    begins with a discussion of variables, explaining how to assign values to variables
    and how to manipulate those values. It concludes with a discussion of flow control,
    with a specific emphasis on using variables in flow control constructs.


    # # Shell Program Basics


    In Chapter 12, you learned that a shell program is composed of individual shell
    commands. A simple shell program might look like this:


    ```

    #!/bin/bash

    # Program to set up basic networking functions - must be

    run as "root"

    /sbin/ifconfig eth0 192.168.1.21

    /sbin/route add default gw 192.168.1.1

    ```'
