- img_proc: true
  md: '# CHAPTER 17 Basic System Administration: Part II


    # Managing Software


    One of the most common things a system administrator must do is to install software.
    If you have ever installed software on a Macintosh or a Windows-based PC, you
    probably had a fairly simple experience. Software manufacturers tend to provide
    installation programs which greatly reduce the amount of user input into this
    process. This is possible because these operating systems were created by a single
    manufacturer—Microsoft and Apple—which can provide detailed specifications to
    the software companies. These specifications can, in turn, help the companies
    create simple installation programs.


    In the Unix world, things are not always simple. Some distributors do provide
    package management software that makes the job of installation easy, but there
    is no guarantee that this will be the case when you download a new program. Software
    installation under Unix can be as simple as giving a single command, or as complicated
    as a scenario you can imagine. This should not scare you off, even at its most
    complex, Unix software management is ultimately comprehensible. Most software
    packages, especially those which are professionally produced, come with detailed
    instructions for installation.


    There are two general methods for installing software. Software can be compiled
    from source code, or installed directly as binary packages. Installing from source
    code has the advantage that one can often install a single package on any one
    of a variety of Unix variants; the disadvantage is that it is a more complicated
    procedure. Binary packages offer simplicity, but they are usually restricted to
    a single Unix variant; in the case of Linux, sometimes packages are restricted
    to a single Linux distribution.


    # Installing Software from Source Code


    A great deal of Unix software is available as source code. Source code is the
    form in which the programmer writes the program, which is human-readable and cannot
    be run directly as an executable file. This is true of packages which are released
    as Free or Open Source software. In order to install source code packages, the
    system administrator must run a compiler to convert the source code into an executable
    binary file which will run on particular system.


    In order for this conversion to work, you must have certain elements installed
    on your system. First, you must have a compiler. Most Unix systems install a compiler
    by default when the operating system is installed. Other systems have a compiler
    available, but it may not be available because the system administrator has never
    configured it properly.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Installing Software from Source Code


    Check to see whether or not you have a compiler available to you by issuing

    the command


    ```

    cc

    ```


    at the shell prompt, cc stands for "C compiler". Even if you are using a dif-

    fer compiler, the GNU C compiler GCC, there should be a

    symbolic link which starts the actual compiler when the cc command is

    invoked. If a compiler exists on your system, its location will print to the

    screen.


    If you get no output, no compiler is configured on your system. If you

    installed your operating system, such as FreeBSD or Linux, you will prob-

    able a compiler on the CDs or in the downloaded files which you used to

    install the operating system. Otherwise, you can download a current version of

    t GCC compiler from the GNU project at http://www.gnu.org/software/

    gcc/gcc.html. If at all possible, download a binary copy suitable for your plat-

    form, in order to install the compiler from source code, you would need

    a working compiler.


    Once you have a functional compiler, you will also need the program make.

    This is a program which helps to automate the compilation process. Again,

    You can check for the program by issuing the command


    ```

    make

    ```


    at the shell prompt. If there is no output, download make from any Unix soft-

    are archive.


    Most software also requires certain libraries to be installed on the system

    before the software is installed. Libraries are compilations of functions that

    programmers separate into individual files. These functions are commonly

    used, and segregating them in this way means that the function can be

    reused by multiple programs without having been written into each program.

    Unfortunately, there is no one ideal set of libraries which will allow you to

    install any program you like. Required libraries depend on the software pack-

    age you to install. The documentation comes with the package

    should tell you what you need.


    # Getting and Unpacking the Package


    The first step in the installation process is to obtain and unpack the soft-

    ware. Most software is obtained from a CD or from an online Web or FTP

    archive. Regardless of how you get the package, transfer it to your machine''s

    hard drive. You should store the package in a directory where you have set

    aside for this procedure. Many people like to use the directories /tmp or

    /usr/src.


    > To install the compiler from a binary pack-age, see the section of this chapter
    devoted to binary installations.'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'Because the /tmp directory, as its name implies, a temporary location, do not
    store important files or programs here. System administrators may wipe this regularly
    without checking to see what its contents are, assuming users will store important
    files in their own home directories. Once you have installed the program, you
    can delete the downloaded package from the temporary directory.


    The software package will usually come in the form of a tarball. A tarball is
    a collection of several files and/or subdirectories that have been archived into
    a single file. Tarballs are often compressed after they are archived, to make
    the file as small as possible. The filename of the tarball is usually given in
    a syntax which makes it easy to know what format the file is. The filename


    ```

    codename.tar

    ```


    indicates an uncompressed archive, while


    ```

    codename.tgz

    ```


    or


    ```

    codename.tar.gz

    ```


    indicates an archive which has been compressed with the gzip program. A file name
    of


    ```

    codename.tar.bz2

    ```


    or


    ```

    codename.tar.bz2

    ```


    or


    ```

    codename.tbz2

    ```


    or


    ```

    codename.tbz

    ```


    indicates an archive which has been compressed with the bzip2 program. bzip2 is
    similar to the more widely used gzip, but creates a smaller compressed file. bzip2
    is usually used when the file being compressed is very large, and is a useful
    program to have on your system.


    In order to unpack these files, you must use the tar command. tar is an abbreviation
    for "archive." The program was originally used to create backup files which were
    to be stored on tape drives. While it is still sometimes used for purpose, tar
    is now also used routinely to create compressed packages for a variety of purposes.
    To unpack the downloaded package, issue the command


    ```

    tar xvf file_name

    ```


    if the package is a *.tar file; use the command


    ```

    tar xvf filename

    ```'
