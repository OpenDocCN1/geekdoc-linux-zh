  md: '# Managing Processes


    In order to manage processes effectively, you need to know which processes are
    running and how to identify each of them. There are two Unix commands which are
    particularly useful for this job. Earlier, you learned about the top command,
    which provides a range of useful data but is not always the best administrative
    choice. Another command which generates similar output, but in a better format,
    is the ps command, an acronym for "process status."


    The ps command provides a view of the running processes, as does top. The difference
    is that the ps output is static, while top’s output constantly refreshes itself.
    The ps output is a snapshot of system performance at the moment when you issued
    the command. The advantage of ps is that it has a number of options which can
    modify its behavior in various useful ways.


    The default behavior of ps is to list only processes running in the terminal when
    ps is invoked. That, if you use the ps command in your personal user account,
    processes running in your account will be listed. If you use top in your user
    account, however, the output will show processes running in all accounts the machine.
    If you have more than one terminal window, as with the screen process described
    later in this chapter, ps will list only the processes running in the terminal
    window where it is invoked. The default output of ps looks like this:


    | PID TTY | TIME | CMD |

    |---|---|---||

    | 939 pts/0 | 00:00:00 | bash |

    | 1127 pts/0 | 00:00:00 | ps |


    The two processes shown in this output are the bash shell process and the ps itself.


    If you invoke a command in a particular terminal window and don''t see all the
    processes that you know running, however, issue the command with the -x option
    to force ps to run any processes running in your account. Output for the ps -x
    command looks like the output shown in Figure 5.3.


    Many of the processes listed in Figure 5.3 output are spawned by the graphical
    user interface, not by the user. They are still contained within the user''s account,
    though, they are listed. See the various ps options in Table 5.1.


    A key of ps output is the number in the left column. This is the process identification
    number. Every process running on the system is assigned a unique identification
    number. When a command is invoked with the ampersand character, forcing the program
    into the background, the process number of the background process will print to
    the screen, as in


    +   [1] 1179'
