  md: '# Basic Networking Concepts


    The **ssh** program can also be used noninteractively, to mimic the **rsh** program
    and issue single commands to the remote machine. For this result, the command
    takes the syntax


    ```

    ssh -l login remote.machine.name command

    ```


    or


    ```

    ssh loginremote.machine.name command

    ```


    As in the previous operation, the login name can be omitted if it is the same
    on both machines.


    These two commands make up the bulk of common SSH operations. Be aware, however,
    that SSH is a robust program with many options and modes not described here. If
    you want to learn more about the Secure Shell suite of tools, consult the manual
    page with the command


    ```

    man ssh

    ```


    The **scp** program is a replacement for the **rc** program. Like **rc**, **scp**
    is used to copy files between a local and a remote machine, but uses a secure
    connection to transfer the data. **scp** commands are constructed like **rc**
    commands, and take the syntax


    ```

    scp loginremote:/path/remote-file /path/local-file

    ```


    to transfer a file from the remote account to the local account. The syntax


    ```

    scp /path/local-file loginremote:/path/remote-file

    ```


    is used to transfer a file from the local machine to the remote machine, sc will
    prompt for a password before beginning the file transfer.


    # Basic Networking Concepts


    The programs described in the previous section of the chapter illustrate the most
    basic concepts of intermachine networking. With those concepts in mind, we can
    turn to a larger view of the network. This view helps to describe the basic infrastructure
    of a network, and how each individual computer fits into the picture.


    # How Networks Operate


    At the most basic level, a network works by transmitting bits of information between
    machines. These bits, or **packets**, are encoded into electrical signals by an
    **interface**: a modem or network card. The encoded packets are then sent, usually
    over a physical wire but sometimes through the air like a radio signal,'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'one interface, where they are decoded. The resulting information is then passed
    to the intended recipient. Typically, a large chunk of information, such as an
    electronic mail message or a Web page, is broken up into many small packets which
    are then reassembled at the receiving end. This is the case whether the network
    is a simple connection between two machines on the same table, or between many
    machines all over the world connected through the Internet.


    It is not necessary to understand the mechanics of each of these actions to understand
    the basic networking concepts. The way in which messages are broken apart reassembled,
    the way in which information is converted into transmittable signals, and other
    mechanisms are beyond the scope of this text. Fortunately, these are not activities
    in which the average user must participate in order to use the network. Instead,
    they are functions of the operating system and the computer''s hardware. For most
    work involving networks, you only need know how to manipulate network connections
    on the macro level.


    As noted previously, networks are controlled by various protocols. These govern
    the format of information exchange. The precise way in which a piece of hardware
    or software handles information is not particularly important, as long as that
    information is formatted in compliance with the protocol. How the machine handles
    data in its own space is irrelevant as long as it is properly when it arrives
    at another location.


    With the reassurance of protocol compliance, any number of programs responsible
    for network functions can interact freely without having to know how each of the
    other programs works. As long as all of the programs are protocol-compliant, they
    can pass data back and forth without problems. This is how messages and packets
    are passed along a net of machines with different hardware, different operating
    systems, and different kinds of software which handle network traffic: in short,
    a network exactly like the Internet.


    # TCP/IP


    The common language for networks connected to the Internet is a combination of
    protocols known as TCP/IP. TCP/IP stands for Transmission Control Protocol/Internet
    Protocol. It is not the only way in which network information can be shared, but
    because it is the standard for the Internet, it is by the most popular protocol
    for network transmission. Most people and institutions want their networks to
    be connected to the Internet, and so it seems appropriate to construct their private
    networks in compliance with TCP/IP.


    The TCP protocol governs how packets are created, and how they are transmitted
    across the networks. It is extremely technical, and is not generally of'
