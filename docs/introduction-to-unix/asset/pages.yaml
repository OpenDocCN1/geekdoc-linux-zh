  md: '# CHAPTER 11 Networking Fundamentals of Unix Networking


    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_178_0.png)


    FIGURE 11.1 The layout of a bus topology network.


    data destined for the first few machines hooked to the bus. While these are easy
    networks to build, they are becoming increasingly uncommon as low-cost networking
    equipment has arrived on the market.


    # ### The Ring Topology


    Ring topology is similar to bus topology, except that the central cable loops
    around in a circle instead of ending at the terminus of the cable length. It is
    slightly more efficient method of delivering data than a straight bus network.
    Figure 11.2 shows the schematic of a typical ring topology network.


    Most ring networks have one machine, usually the computer into which the beginning
    and end of the ring cable is plugged, which manages ring traffic. The token ring
    network, a variant of this topology, does not have a permanent network management
    machine. Rather, a discrete piece of data called a token passed along the ring.
    Whatever machine which controls the network. Like bus topologies, though, the
    ring topology is most effective for smaller networks and is passing out of favor.


    # ### The Hub Topology


    Most Ethernet networks use the hub topology, also known as the Star topology.
    In a hub network, each machine connects directly to a piece of hardware called
    a hub. The hub acts as a switch, receiving incoming data, determining the intended
    recipient, and distributing the data to that machine. Figure 11.3 shows the schematic
    of a typical hub network.'
