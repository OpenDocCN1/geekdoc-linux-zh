  md: '# fdisk


    The fdisk command is used to partition a specified device or disk. It takes the
    syntax


    ```

    fdisk <device>

    ```


    The fdisk program is interactive, and can be damaging to your computer if you
    use it without reading the documentation thoroughly before beginning to work with
    it.


    # fsck


    The fsck command checks and reports on the integrity of a specified filesystem.
    It takes the syntax


    ```

    fsck [options] <filesystem>

    ```


    fsck offers several options, including


    +   - -t Specifies filesystem type

    - -A Checks all filesystems, using the /etc/fstab file as its guide

    - -N Reports what would be checked, but does not actually check it

    - -R Skips the root filesystem when using the -A option to check all filesystems

    - -V Verbose mode

    - -a Make all necessary repairs automatically while checking filesystems

    - -r Converse of -a, requiring confirmation of each repair before it is systems
    made


    Because filesystems must be mounted "read only" before they can be checked with
    fsck. With the -R option, the root filesystem can continue to be mounted "read-write"
    so that it will work properly, all other filesystems checked on the machine will
    be read-only.


    # grep


    The grep command is used to search a specified input for a particular text string.
    It takes the syntax


    ```

    grep [options] <pattern> <filename>

    ```


    grep takes a number of options, which are fully described in its manual page.
    Check the manual page because some options may not be enabled on your system.'
