    Even though NEdit takes advantage of the graphical user interface, it is still
    only a text editor. It is not a word processor, so fancy formatting, fonts, and
    other visual options are not available. If you need a word processor for a Unix
    machine, investigate StarOffice for multiple platforms or WordPerfect for Linux,
    which has all the features found in WordPerfect for Windows or Macintosh.


    Although users need basic familiarity with the vi editor in the event of an emergency
    or the lack of any other installed editor, many find vi to too complicated or
    unintuitive for daily use. There are a number of other text editors which these
    users may prefer. These other editors have a range of functions and commands which
    make them suitable for various situations and user bases.


    GNU Emacs and vi are roughly equal in popularity. Emacs is a large and complicated
    program that can actually be used as a shell environment since it has so many
    internal functions. Emacs is difficult to learn, users appreciate its power when
    working on complicated documents. The editor can work on multiple files at one
    time, and can display different sections of the same file in adjacent windows.


    Pico and joe are editors that are simpler than either Emacs or vi. The Pico editor
    developed as part of a simple e-mail reader, uses a small set of commands and
    has a single user mode, and is best suited for scripts and text work. The joe
    editor is a bit more complex than Pico, but also has a single mode and a limited
    set of commands. Both offer friendly user interfaces.


    Graphical text editors are increasingly popular, as they blend basic editor functions
    with familiar dropdown menus and mouse input. The NEdit graphical editor includes
    a range of commands especially helpful to programmers. A graphical editor is usually
    included in a graphical desktop interface like KDE or Gnome.'
