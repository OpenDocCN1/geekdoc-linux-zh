  md: '# 247


    # Disk Partitions


    Even if you have a large hard disk on your Unix computer, you may not want to
    devote the entire disk to a single purpose. Under Unix, you can divide the disk
    into a number of smaller disks. This is called partitioning the drive. Partitions
    go by different names, depending on the Unix variant you are using. Under Solaris,
    a partition is called a ''volume''; under FreeBSD, it''s a ''slice''. No matter
    what it''s called, the intention is clear. A partition is part of a larger world.


    Why partition the hard drive? One of the most common reasons to do this is to
    separate system files from user files. By placing user files on a separate partition,
    a user cannot wander into restricted areas and noise around the system directories.
    It is also a security advantage, access to the system files is restricted. Users
    tend to take up much space on the disk as they are allowed, segregating user files
    to a separate partition means that disk user who packs his account full of MP3
    files will not take up space better suited for system logs or the mail pool.


    Disk partitions are usually created when the operating system is installed. Most
    installation managers are interactive, and you will be prompted to define partitions
    at an early stage in the installation. If you don''t create partitions during
    installation, it is possible to partition the disk at a later stage, but it is
    more difficult and more likely to cause fatal problems.


    When you partition a disk, all data on that disk is destroyed. Back before you
    start, some partitioning programs claim to be able to work without deleting data,
    but there are many treacherous steps in the process and such claims may not always
    be the case. Never partition a disk that is not backed up on a separate disk,
    and always assume the disk will be completely wiped by the partition. You will
    be pleasantly surprised if that does not happen, but wasting the time required
    to secure your data is far better than the alternative.


    > Warning:


    # The Unix Filesystem


    Individual partitions are treated as separate drives by the operating system.
    They are defined as individual devices, and each has its own entry in the /dev
    directory. Under Unix, the hardware devices which store data are a concept separate
    from the concept of the filesystem. The filesystem is the way in which files and
    directories are organized.


    In the Unix world, the filesystem is a top-down tree. The top directory is the
    / , and every other directory on the machine is stored under /. Thus, the /dev
    directory is actually a directory named "dev" which is stored in the / directory.
    When you write a path name for a particular file, you are providing a map to its
    location within the filesystem.'
