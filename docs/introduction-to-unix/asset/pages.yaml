    Most of the work done on a Unix system is handled through various text files.
    Administrative tasks and system configuration commands are controlled by the data
    kept in particular types of data files. Even the operating system itself is usually
    configured with basic text files. Many of the programs which administrators write
    to solve a problem or situation are simple text strings contained in text files,
    which are readable by humans as well as machines.


    Why is text so important in the Unix world, and why don’t many of these techniques
    use graphical interfaces? As described in previous chapters, Unix was developed
    before graphical windowed interfaces. While there are graphical front ends for
    a wide range of Unix tasks, not every Unix system is capable of using them. Every
    Unix system can use plain text files, though, and the skills needed to work with
    text are critical for anyone planning to use Unix, no matter how infrequently.'
