    the network is eventually attached to the Internet.


    Regardless of the reasons behind the shortage, it is no longer the threat it was.
    At the time this text was written, a new version of the Internet Protocol, called
    "IP version 6," had been drafted and is under revision. This new version expands
    the address space to 128 bits, doubling the length of the IP number. The expansion
    means that the pool of possible addresses will explode from 4.3 billion to 3.4
    × 10^38 IP addresses, a number with 37 zeros. That pool should not be exhausted
    soon.


    # Name Resolution


    Clearly, it would be difficult to remember every set of numbers that identify
    the various computers attached to the Internet. Computers can easily track these
    numbers, but humans tend to make mistakes. Humans remember words and names much
    better, and for this reason, naming machines and networks is now common practice.
    Indeed, some names have become so popular that they are now in common conversation.
    Amazon.com, Yahoo.com, and the like are not only the designated names of actual
    networks but are legal trademarks of brand names.


    How do these names get associated with the corresponding IP numbers? This is the
    job of the Domain Name Service, or DNS. DNS is a network of network and machine
    names and their associated IP numbers. An individual or organization registers
    a domain name, she must tell the registering authority address to maintain that
    domain name''s entry. Usually, two name servers are registered: a primary server
    and a backup. Likewise, when a new computer is connected to the Internet, a particular
    DNS server must be specified in its networking configuration so that the computer
    will know where to look when it tries to resolve an Internet address.


    # Networking Hardware and Software


    There is a huge variety of networking hardware available in catalogs and stores.
    From basic models to common network interface adapters and hubs, to heavy-duty
    interfaces which allow a machine to be connected to a major network artery like
    a T-1 line, the choice is nearly overwhelming. Likewise, there is a plethora of
    software available for any task from simple mail, news, and Web servers to software
    that turns a basic PC into a router, dedicated switchboard for Internet connections.'
