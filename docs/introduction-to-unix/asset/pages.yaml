  md: '# Shell Programming IV:


    # Signals and Status


    # 15


    # IN THIS CHAPTER


    +   1. Exit status

    2. Signals

    3. Signal traps

    4. Pulling together shell program concepts

    5. Selecting techniques


    In the previous chapters of this section, you have learned the basic structures
    of shell programs. In this chapter, the concepts of exit status and signals are
    introduced. While these are easy concepts to understand, they have significant
    implications for the complexity of any programs that contain them.


    With exit status and signal functions in your programs, you can create chains
    of programs that perform complicated sequences of actions. These actions are determined
    by the success or failure of individual elements within each script, or by the
    success or failure of a program itself. While these functions may be a bit complex
    for the types of administrative scripts that are written quickly to solve an immediate
    need, they show up in more extensive programs that you download from an archive
    or that you may spend some time crafting.


    # Exit Status


    Every command that is invoked in a Unix environment, whether it is given on the
    command line or in a shell program, generates an exit status. This status is a
    numerical value that corresponds with either the output of a program (if,


