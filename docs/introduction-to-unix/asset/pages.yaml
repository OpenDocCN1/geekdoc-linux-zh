  md: '# Filesystems and Devices


    the name of the filesystem to be mounted. For example, assume that you store user
    directories on a separate hard drive which has the device name hda2, and you want
    to make these directories available with the path name /home. The empty directory
    /home is the mount point.


    To create a mount point, use the same commands you would use to create an ordinary
    directory. As root, issue the command


    ```

    mkdir /home

    ```


    at the shell prompt. The directory will be created and is ready to have the filesystem
    mounted. Use the mount command to actually mount the directory. mount takes the
    syntax


    ```

    mount [options] device-point

    ```


    In this case, the command would be issued as


    ```

    mount /dev/hda2 /home

    ```


    Under some variants you may have to provide an option which defines the filesystem
    type. Your variant''s documentation, or the manual page, will explain the proper
    syntax for mount on your system, should it differ.


    Once you have finished with the filesystem, you can unmount it without shutting
    down the system. (There is rarely a reason to shut down a Unix system.) To remove
    a filesystem, use the unmount command. Note that there is no "n" in unmount, and
    there is no "unmount" Unix command. It is a simple command, taking the syntax


    ```

    unmount filesystem

    ```


    In this example, you would issue the command as


    ```

    unmount /home

    ```


    Once the filesystem has been unmounted, it disappears from the operating system.
    Files on that can no longer be accessed unless the filesystem is remounted. If
    the device is a removable media like a CD or a diskette, it can be removed from
    its drive once the unmounting is complete.


    Never remove a mounted device. It could cause a fatal crash of the operating system
    or even cause physical damage to the drive.


    ![](img/e6fb8a218ea8f2f7eb7377c5c0bdf5f3_261_0.png)


    # Mount Remote Devices


    One of the attractive features of Unix is that remote device can be mounted and
    used locally as if it were attached to the local machine. For corporate WANs,
    this can be a cost-efficient way to share files and work documents without removing
    removable media between offices. Simply mount the remote device and get the files
    necessary, then unmount when you are finished.'
