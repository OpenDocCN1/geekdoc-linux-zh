  md: '# grep Metacharacters


    The first regular expression metacharacter introduced in this chapter was the
    asterisk. *, represents "any combination of zero or more characters." In fact,
    the asterisk literally matches any value. The regular expression *txt can match
    the values t.txt, a.txt, b.txt, ab.txt, a.b.txt, ab15.txt, ab15.txt.log, and any
    other value that contains the .txt string somewhere in the name even if it is
    not the final element of the file name.


    Where the asterisk is used to match any value, regardless of its length, the dot
    character, is used to match any single character. The expression .txt will match
    axt, bxt, cxt, and so on. It will not match abxt or 13.txt.


    A group of characters contained within square brackets will match any single character
    which matches one of the specified characters.


    ```

    [aeiou]

    ```


    will match any single lower-case vowel if it is a unique string (not contained
    within a longer string). The expression


    ```

    [a-z]

    ```


    matches any single lower-case letter.


    With these commands, you could create a regular expression pattern that resembles
    this:


    ```

    [A-Za-z][aeiou].[1-9]*

    ```


    This pattern would identify any upper or lower-case letter, followed by a lower-case
    vowel, followed by any single character, followed by any group of zero or more
    characters. Possible matches for the expression include


    ```

    ao23CCCCC

    Bix9999.txt

    ```


    and many, many other possible strings. However, this pattern is not limited. Strings
    that would be ignored include


    +   - 89b4 (does not begin with a letter)

    - aba2.c (second character is not a vowel)

    - letter.txt (fourth character is not a number)


    # grep Meta-"noncharacters"


    In addition to the various metacharacters, there are a group of pattern-matching
    operators that do not represent characters. Rather, they represent additional
    conditions on the expression that are not character-oriented. Such characters
    can be used to specify the location of the text string within the file.'
