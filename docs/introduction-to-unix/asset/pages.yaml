    The shell environment is the program that allows users to interact with the operating
    system. The shell provides a shell prompt, where commands may be entered by the
    user, and it interprets commands so that the operating system can respond appropriately.
    There are a large number of shells available-to Unix, each with a different range
    of functions and features. Some shells emphasize particular programming constructs,
    while others focus on ease of use or administration. Selecting a shell is a matter
    of balancing personal taste with required functions.


    The Bourne is the original shell environment and is still the most frequently
    used shell. The Bourne (again) shell was developed as a Free alternative to the
    Bourne shell, and includes some upgraded and programming functions. The C shells,
    csh and csh, are designed to use programming constructs from the C language; while
    the individual user may not notice difference, those who program for the C writes
    scripts differently than those who program for Bourne. The Korn and Z shells are
    also popular, ranging from newly developed programs with very limited focus.


    Shells are configured with environment variables, which are maintained in control
    files. These files are parsed every time a new shell session starts, and the variables
    are implemented for session. System-wide control files are parsed first, and many
    administrative variables are set at that time. Personal control files are parsed
    next. Any variables that a user has defined will supersede the system default
    setting, giving users the ability to configure their own shells for specific needs.
    Run control files also allow users and administrators to define aliases, a way
    to configure the operation of a given command so that it runs with the same optional
    arguments each time it is invoked.'
