- img_proc: true
  md: '# CHAPTER 4 The File System


    not lead to a particularly subtle, fruitful, or effective understanding of what
    files actually do.


    A file is a named and ordered collection of bytes which has a unique name and
    which can be managed or manipulated as a single entity. In Chapter 3, you saw
    an example of output redirection which created a new file called "sortednames".
    "sortednames" is the name of the file: literally, *filename*. The file can also
    be identified by its specific location on the computer''s hard disk or by a numerical
    entry called *inode* in the operating system''s internal index. View any file''s
    node by issuing the `ls` command with the -i argument, and in Is 4. No matter
    what identifier you use to denote this particular file, the system will find it.


    # Types of Files


    Files serve many purposes on a Unix machine. For each purpose, there is a file
    type. These range from simple text files to placeholders used to manage hardware
    devices. The only thing some of these types have in common is they are all identified
    in the same manner when the operating system needs to call them for a particular
    task or command.


    # Text Files


    Text files, as the name implies, are files filled with text. Text files contain
    characters that are readable by humans: ordinary prose, source code for programs,
    configuration instructions for installed software, electronic emails, formatted
    prose which will display in a particular manner when opened by a specified program,
    scripts used for administrative jobs, and so on. The only common feature of these
    files is that, if you open the file, you will be able to read the contents—even
    if you can''t understand what it means.


    # Binary Files


    Binary files contain information that is intended for use by the computer or operating
    system. Binary files are most often programs which have already been compiled
    and are ready to run, but they may also be like a digital file in saw or MP3 format,
    an image, or data intended for use by another program. If you open a binary file
    in a text editor, you will see an unintelligible mess of gibberish. It is technically
    readable, but not by humans.


    > Note: Make the distinction between text and binary files whether or not the
    file can be read by human eyes. In the operating system''s opinion, there is little
    difference. It can parse human-readable text and binary files as easily as it
    can parse binary. In a purely technical sense, text and binary files are the same;
    however, to the ordinary user, there is a difference. Binary files are meant to
    be run as a program or viewed through an intermediary program that interpret the
    binary language. Text files can be read without interpretation and cannot be executed.'
