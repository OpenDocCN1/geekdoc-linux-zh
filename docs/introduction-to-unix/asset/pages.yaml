    installed. The user will see the same interface on different machines, as long
    as the shell is configured in the same way. This minimizes the differences between
    variants, and can be a useful trick for the system administrator when faced changing
    Unices or software across a network.


    # The File System


    It is easy to overlook the file system when thinking about the various components
    of an operating system. It is somewhat non-intuitive to think of the files stored
    on your computer as being part of the operating system, since they'
