  md: '# Preface


    Plurals of nouns, principal parts of verbs, and comparative and superlative forms
    of adjectives (adverbs) are known as inflected forms. Those formed by the regular
    addition of a suffix (such as -s, -ed, -ing, -er, -est) are well-known regular
    formations and are not shown in this dictionary. Inflections formed by an internal
    change in the spelling of the word (or no change) are shown inside parentheses.
    For nouns, the forms shown will be plurals (pl); for verbs, the forms shown will
    be past tense (past) and past participle (past part). The past and past participle
    are separated by a semicolon. If variant spellings are shown for any inflected
    form, it is set off by a slash (/).


    +   * grow vb grew; grown 1: come into existence and develop to maturity

    * knife knives: sharp blade with a handle ...

    * lie vb lay; lain 1: be in, in rest, or assume a horizontal position ...

    * moose moose: large heavy-antlered deer

    * prove vb proved; prov-en 1: test by experiment or a standard ...


    When a particular sense of a word is used in a special way, as used only in the
    plural form, information is indicated after the sense number.


    +   * re-fresh n 1: act of refreshing 2 pl: light meal


    If a particular sense the form of the inflection is not or regularly formed, information
    is also provided.


    +   * an-ten-na n 1 pl an-ten-nae: one of the long slender sensory organs on the
    head of an arthropod 2 pl an-ten-nas: metallic device for sending or receiving
    radio waves

    * young adj 1: being in the first or an early stage of life... ~ n young: persons
    or animals that are young

    * up adv 1: in or to a higher position or level... ~ vb 1 up; upped 2 upped; upped:
    move or cause to move upward...


    In the first example, the form of the plural is different for each of the two
    nouns and is therefore shown. In the second example, the plural form for the noun
    sense is unchanged. In the third example, the verb inflections for the past tense
    are different for each of these two verb senses.


    To show the range of entries on a page, guide words appear at the top, indicating
    the first main entry word and the last main entry word on that page.


    Common abbreviations, including those used in this book, are shown in a separate
    section immediately following the dictionary proper.'
