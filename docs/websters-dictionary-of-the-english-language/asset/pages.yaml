  md: '# # Preface


    This new dictionary is unique in many respects. While small in size, it contains
    more than 19,000 words that represent the very core of the language. It is intended
    to serve as a quick reference for spelling, hyphenation, and meaning of the words
    in everyday use. Conciseness of presentation necessarily requires special treatment
    of entries, and this book has a number of special features all its own.


    Entry words appear in **boldface type** with raised periods to indicate where
    they can be hyphenated at the end of a line in writing. Words that begin an entry
    paragraph are **main entry words** and are followed by definitions or cross-references
    to related entries.


    +   - **aard-vark**. . . : ant-eating African mammal

    - **abroad**. . **1** : over a wide area **2** : outside one''s country

    - **ate** **past** **of** **EAT**


    **Variant spellings** of bold words are shown following a comma,


    +   - **blond, blonde**. . . **1** : fair in complexion


    Labels indicating a word''s grammatical function in the sentence (**part of speech**)
    are shown as abbreviations in italics after the bold word.


    Within an entry paragraph, derived words with the same spelling but a different
    part of speech are represented by a *swung dash* and are provided with their own
    definitions.


    +   - **di-rect** vb **1** : cause to move or to follow a certain course ...

    - **adj** **1** : leading to or coming from a point without deviation or interruption
    ...


    Derived words are run on undefined at the end of the entry when their meanings
    are evident from the definitions preceding. This treatment allows for saving of
    space to permit many words to be entered and at the same time word relationships.


    +   - **ex-haust** vb **1** : draw out or develop complete **2** : use up ...

    ~ **n** : waste gas from an engine ... — **ex-haus-tion** n

    - **ex-haust-tie** adj


    Main entries with the same spelling but not derived from one another are entered
    separately, marked with a superscript.


    +   - **¹file** n : tool for smoothing or sharpening ...

    - **²file** vb **1** : arrange in order **2** : enter or record officially ...

    - **³file** n : row of persons or things one behind the other'
