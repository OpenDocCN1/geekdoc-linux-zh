    #!/bin/bash\n# life.sh: \"Life in the Slow Lane\"\n\n# #####################################################################\
    \ #\n# This is the Bash script version of John Conway's \"Game of Life\".\n# \"\
    Life\" is a simple implementation of cellular automata.\n# ---------------------------------------------------------------------\
    \ #\n# On a rectangular grid, let each \"cell\" be either \"living\" or \"dead\"\
    .\n# Designate a living cell with a dot, and a dead one with a blank space.\n\
    #  Begin with an arbitrarily drawn dot-and-blank grid,\n#+ and let this be the\
    \ starting generation, \"generation 0\".\n# Determine each successive generation\
    \ by the following rules:\n# 1) Each cell has 8 neighbors, the adjoining cells\n\
    #+   left, right, top, bottom, and the 4 diagonals.\n#\n#                    \
    \ 123\n#                     4*5\n#                     678\n#\n# 2) A living\
    \ cell with either 2 or 3 living neighbors remains alive.\n# 3) A dead cell with\
    \ 3 living neighbors becomes alive (a \"birth\").\nSURVIVE=2\nBIRTH=3\n# 4) All\
    \ other cases result in dead cells.\n# #####################################################################\
    \ #\n\nstartfile=gen0   # Read the starting generation from the file \"gen0\"\
    .\nALIVE1=.\nDEAD1=_\n               # Represent living and \"dead\" cells in\
    \ the start-up file.\n\n#  This script uses a 10 x 10 grid (may be increased,\n\
    #+ but a large grid will will cause very slow execution).\nROWS=10\nCOLS=10\n\n\
    GENERATIONS=10        #  How many generations to cycle through.\n            \
    \          #  Adjust this upwards,\n                      #+ if you have time\
    \ on your hands.\n\nNONE_ALIVE=80         #  Exit status on premature bailout,\n\
    \                      #+ if no cells left alive.\nTRUE=0\nFALSE=1\nALIVE=0\n\
    DEAD=1\n\navar=                 #  Global; holds current generation.\ngeneration=0\
    \          # Initialize generation count.\n\n# ==============================================================\n\
    \nlet \"cells = $ROWS * $COLS\"\n                       # How many cells.\n\n\
