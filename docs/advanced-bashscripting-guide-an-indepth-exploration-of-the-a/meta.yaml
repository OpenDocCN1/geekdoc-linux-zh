  md: "# Advanced Bash–Scripting Guide\n\n```\nE_NOTROOT=65\nE_NOPARAMS=66\n\nif [\
    \ \"$UID\" -ne \"$ROOT_UID\" ]\nthen\n  echo \"Must be root to run this script.\"\
    \n  # \"Run along kid, it's past your bedtime.\"\n  exit $E_NOTROOT\nfi\n\nif\
    \ [ -z \"$1\" ]\nthen\n  echo \"Usage: `basename $0` find-string\"\n  exit $E_NOPARAMS\n\
    fi\n\necho \"Updating 'locate' database...\"\necho \"This may take a while.\"\n\
    updatedb /usr &     # Must be run as root.\n\nwait\n# Don't run the rest of the\
    \ script until 'updatedb' finished.\n# You want the the database updated before\
    \ looking up the file name.\n\nlocate $1\n\n# Without the wait command, in the\
    \ worse case scenario,\n# the script would exit while 'updatedb' was still running,\n\
    # leaving it as an orphan process.\n\nexit 0\n```\n\nOptionally, **wait** can\
    \ take a job identifier as an argument, for example, **wait%1** or **wait $PPID**.\
    \ See the [job_id table](job_id table).\n\n> Within a script, running a command\
    \ in the background with an ampersand (&) may cause the script to hang until **ENTER**\
    \ is hit. This seems to occur with commands that write to stdout. It can be a\
    \ major annoyance.\n\n```\n#!/bin/bash\n# test.sh\n\nls -l &\necho \"Done.\"\n\
