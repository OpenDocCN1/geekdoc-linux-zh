  md: "# Advanced Bash–Scripting Guide\n\n# Example 11–6. Letting let do some arithmetic.\n\
    \n```\n#!/bin/bash\n\nlet a=11             # Same as 'a=11'\nlet a=a+5       \
    \    # Equivalent to let \"a = a + 5\"\n                    # (double quotes and\
    \ spaces make it more readable)\necho \"11 + 5 = $a\"\n\nlet \"a <<= 3\"     \
    \  # Equivalent to let \"a = a << 3\"\necho \"\\\"\\$a\\\" (=16) left-shifted\
    \ 3 places = $a\"\n\nlet \"a /= 4\"        # Equivalent to let \"a = a / 4\"\n\
    echo \"128 / 4 = $a\"\n\nlet \"a -= 5\"         # Equivalent to let \"a = a -\
    \ 5\"\necho \"32 - 5 = $a\"\n\nlet \"a = a * 10\"    # Equivalent to let \"a =\
    \ a * 10\"\necho \"27 * 10 = $a\"\n\nlet \"a %= 8\"        # Equivalent to let\
    \ \"a = a % 8\"\necho \"270 modulo 8 = $a  (270 / 8 = 33, remainder $a)\"\n\n\
    echo\n\nexit 0\n```\n\n# eval\n\n```\neval arg1 [arg2] ... [argN]\n```\n\nTranslates\
    \ into commands the arguments in a list (useful for code generation within a script).\n\
    \n# Example 11–7. Showing the effect of eval\n\n```\n#!/bin/bash\n\ny=`eval ls\
    \ -l`  # Similar to y=`ls -l`\necho $y          # but linefeeds removed because\
    \ \"echoed\" variable is unquoted.\necho\necho \"$y\"       # Linefeeds preserved\
    \ when variable is quoted.\n\necho; echo\n\ny=`eval df`     # Similar to y=`df`\n\
    echo $y          # but linefeeds removed.\n\n#  When LF's not preserved, it may\
    \ make it easier to parse output,\n#+ using utilities such as \"awk\".\n\nexit\
    \ 0\n```\n\n# Example 11–8. Forcing a log-off\n\n```\n#!/bin/bash\n```"
