  md: "# Advanced Bash–Scripting Guide\n\n```\ncat <<Endofmessage\n\nHello, there,\
    \ $NAME.\nGreetings to you, $NAME, from $RESPONDENT.\n\n# This comment shows up\
    \ in the output (why?).\n\nEndofmessage\n\n# Note that the blank lines show up\
    \ in the output.\n# So does the \"comment\".\n\nexit 0\n```\n\nQuoting or escaping\
    \ the \"limit string\" at the head of a here document disables parameter substitution\
    \ within its body. This has very limited usefulness.\n\n# Example 17–6. Parameter\
    \ substitution turned off\n\n```\n#!/bin/bash\n# A 'cat' here document, but with\
    \ parameter substitution disabled.\n\nNAME=\"John Doe\"\nRESPONDENT=\"the author\
    \ of this fine script\"\n\ncat <<'Endofmessage'\n\nHello, there, $NAME.\nGreetings\
    \ to you, $NAME, from $RESPONDENT.\n\nEndofmessage\n\n# No parameter substitution\
    \ when the \"limit string\" is quoted or escaped.\n# Either of the following at\
    \ the head of the here document would have the same effect.\n# cat <<\"Endofmessage\"\
    \n# cat <<\\Endofmessage\n\nexit 0\n```\n\nThis is a useful script containing\
