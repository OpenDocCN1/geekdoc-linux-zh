  md: "# # Chapter 10. Loops and Branches\n\nOperations on code blocks are the key\
    \ to structured, organized shell scripts. Looping and branching constructs provide\
    \ the tools for accomplishing this.\n\n# ## 10.1. Loops\n\nA *loop* is a block\
    \ of code that iterates (repeats) a list of commands as long as the loop control\
    \ condition is true.\n\n**for loops**\n\n*for (in)*\n\nThis is the basic looping\
    \ construct. It differs significantly from its C counterpart.\n\n```\nfor arg\
    \ in [list]\ndo\n    command...\ndone\n```\n\nDuring each pass through the loop,\
    \ `arg` takes on the value of each variable in the `list`.\n\n```\nfor arg in\
    \ \"$var1\" \"$var2\" \"$var3\" ... \"$varN\"\n# In pass 1 of the loop, $arg =\
    \ $var1\n# In pass 2 of the loop, $arg = $var2\n# In pass 3 of the loop, $arg\
    \ = $var3\n# ...\n# In pass N of the loop, $arg = $varN\n\n# Arguments in [list]\
    \ quoted to prevent possible word splitting.\n```\n\nThe argument `list` may contain\
    \ wild cards.\n\nIf **do** is on same line as **for**, there needs to be a semicolon\
    \ after list.\n\n```\nfor arg in [list] ; do\n```\n\n# **Example 10–1. Simple\
    \ for loops**\n\n```\n#!/bin/bash\n# List the planets.\n\nfor planet in Mercury\
    \ Venus Earth Mars Jupiter Saturn Uranus Neptune Pluto\ndo\n    echo $planet\n\
    done\n```"
