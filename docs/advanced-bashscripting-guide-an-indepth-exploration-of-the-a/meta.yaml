    # Backup


    # *dump*, *restore*


    The **dump** command is an elaborate filesystem backup utility, generally used
    on larger installations and networks. [42] It reads raw disk partitions and writes
    a backup file in a binary format. Files to be backed up may be saved to a variety
    of storage media, including disks and tape drives. The **restore** command restores
    backups made with **dump**.


    # *fdformat*


    Perform a low-level format on a floppy disk.


    # System Resources


    # *ulimit*


    Sets an *upper limit* on system resources. Usually invoked with the -f option,
    which sets a limit on file size (**ulimit -f 1000** limits files to 1 meg maximum).
    The -t option limits the coredump size (**ulimit -c 0** eliminates coredumps).
    Normally, the value of **ulimit** would be set in /etc/profile and/or ~/.bash_profile
    (see [Chapter 27](Chapter 27)).


    # *umask*


    User file creation MASK. Limit the default file attributes for a particular user.
    All files created by that user take on the attributes specified by **umask**.
    The (octal) value passed to **umask** defines the file permissions *disabled*.
    For example, **umask 022** ensures that new files will have at most 755 permissions
    (777 NAND 022). [43] Of course, the user may later change the attributes of particular
    files with `chmod`. The usual practice is to set the value of **umask** in /etc/profile
    and/or ~/.bash_profile (see [Chapter 27](Chapter 27)).


    # *rdev*


    Get info about or make changes to root device, swap space, or video mode. The
    functionality of **rdev** has generally been taken over by lilo, but **rdev**
    remains useful for setting up a ram disk. This is another dangerous command, if
    misused.


