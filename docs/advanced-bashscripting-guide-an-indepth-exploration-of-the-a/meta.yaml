  md: "# Advanced Bash–Scripting Guide\n\n```\n#!/bin/bash\n# timed-input.sh\n\n#\
    \ TMOUT=3            useless in a script\n\nTIMELIMIT=3  # Three seconds in this\
    \ instance, may be set to different value.\n\nPrintAnswer()\n{\n  if [ \"$answer\"\
    \ = TIMEOUT ]\n  then\n    echo $answer\n  else           # Don't want to mix\
    \ up the two instances.\n    echo \"Your favorite veggie is $answer\"\n    kill\
    \ $!  # Kills no longer needed TimerOn function running in background.\n     \
    \        # $! is PID of last job running in background.\n  fi\n\n}\n\n\n\nTimerOn()\n\
    {\n  sleep $TIMELIMIT && kill -s 14 $$ &\n  # Waits 3 seconds, then sends sigalarm\
    \ to script.\n}\n\nInt14Vector()\n{\n  answer=\"TIMEOUT\"\n  PrintAnswer\n  exit\
    \ 14\n}\n\ntrap Int14Vector 14   # Timer interrupt (14) subverted for our purposes.\n\
    \necho \"What is your favorite vegetable \"\nTimerOn\nread answer\nPrintAnswer\n\
    \n\n#  Admittedly, this is a kludgy implementation of timed input,\n#+ however\
    \ the \"-t\" option to \"read\" simplifies this task.\n#  See \"t-out.sh\", below.\n\
    \n#  If you need something really elegant...\n#+ consider writing the application\
    \ in C or C++,\n#+ using appropriate library functions, such as 'alarm' and 'setitimer'.\n\
    \nexit 0\n```\n\nAn alternative is using [stty](stty).\n\n# Example 9–3. Once\
    \ more, timed input\n\n```\n#!/bin/bash\n# timeout.sh\n```"
