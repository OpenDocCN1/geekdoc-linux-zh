  md: "# Advanced Bash-Scripting Guide\n\n```\nPASSES=7         # Number of file-shredding\
    \ passes.\nBLOCKSIZE=1      #  I/O with /dev/urandom requires unit block size,\n\
    \                 #+ otherwise you get weird results.\nE_BADARGS=70\nE_NOT_FOUND=71\n\
    E_CHANGED_MIND=72\n\nif [ -z \"$1\" ]   # No filename specified.\nthen\n  echo\
    \ \"Usage: `basename $0` filename\"\n  exit $E_BADARGS\nfi\n\nfile=$1\n\nif [\
    \ ! -e \"$file\" ]\nthen\n  echo \"File \\\"$file\\\" not found.\"\n  exit $E_NOT_FOUND\n\
    fi\n\necho; echo -n \"Are you absolutely sure you want to blot out \\\"$file\\\
    \" (y/n)? \"\nread answer\ncase \"$answer\" in\n[nN]) echo \"Changed your mind,\
    \ huh?\"\n      exit $E_CHANGED_MIND\n      ;;\n*)    echo \"Blotting out file\
    \ \\\"$file\\\".\";;\nesac\n\nflength=$(ls -l \"$file\" | awk '{print $5}')  #\
    \ Field 5 is file length.\n\npass_count=1\n\necho\n\nwhile [ \"$pass_count\" -le\
    \ \"$PASSES\" ]\ndo\n  echo \"Pass #$pass_count\"\n  sync         # Flush buffers.\n\
    \  dd if=/dev/urandom of=$file bs=$BLOCKSIZE count=$flength\n               #\
    \ Fill with random bytes.\n  sync         # Flush buffers again.\n  dd if=/dev/zero\
    \ of=$file bs=$BLOCKSIZE count=$flength\n               # Fill with zeros.\n \
    \ sync         # Flush buffers yet again.\n  let \"pass_count += 1\"\n  echo\n\
    done\n\nrm -f $file    # Finally, delete scrambled and shredded file.\nsync  \
    \         # Flush buffers a final time.\n\necho \"File \\\"$file\\\" blotted out\
    \ and deleted.\"; echo\n\n#  This is a fairly secure, if inefficient and slow\
    \ method\n#+ of thoroughly \"shredding\" a file. The \"shred\" command,\n#+ part\
    \ of the GNU \"fileutils\" package, does the same thing,\n```"
