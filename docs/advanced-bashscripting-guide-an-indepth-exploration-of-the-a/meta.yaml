  md: "# Advanced Bash–Scripting Guide\n\nThe **diff** command returns an exit status\
    \ of 0 if the compared files are identical, and 1 if they differ. This permits\
    \ use of **diff** in a test construct within a shell script (see below).\n\nA\
    \ common use for **diff** is generating difference files to be used with **patch**.\
    \ The -e option outputs files suitable for **ed** or **ex** scripts.\n\n**patch**:\
    \ flexible versioning utility. Given a difference file generated by **diff**,\
    \ **patch** can upgrade a previous version of a package to a newer version. It\
    \ is much more convenient to distribute a relatively small \"diff\" file than\
    \ the entire body of a newly revised package. Kernel \"patches\" have become the\
    \ preferred method of distributing the frequent releases of the Linux kernel.\n\
    \n```\npatch -p1 <patch-file\n# Takes all the changes listed in 'patch-file'\n\
    # and applies them to the files referenced therein.\n# This upgrades to a newer\
    \ version of the package.\n```\n\nPatching the kernel:\n\n```\ncd /usr/src\ngzip\
    \ -cd patchXX.gz | patch -p0\n# Upgrading kernel source using 'patch'.\n# From\
    \ the Linux kernel docs \"README\",\n# by anonymous author (Alan Cox?).\n```\n\
    \nThe **diff** command can also recursively compare directories (for the filenames\
    \ present).\n\n```\nbash$ **diff -r ~/notes1 ~/notes2**\nOnly in /home/bozo/notes1:\
    \ file02\nOnly in /home/bozo/notes1: file03\nOnly in /home/bozo/notes2: file04\n\
    ```\n\nUse **zdiff** to compare *gzipped* files.\n\n# diff3\n\nAn extended version\
    \ of **diff** that compares three files at a time. This command returns an exit\
    \ value of 0 upon successful execution, but unfortunately this gives no information\
    \ about the results of the comparison.\n\n```\nbash$ **diff3 file-1 file-2 file-3**\n\
    ====\n1:1c\n  This is line 1 of \"file-1\".\n2:1c\n  This is line 1 of \"file-2\"\
    .\n3:1c\n  This is line 1 of \"file-3\"\n```"
