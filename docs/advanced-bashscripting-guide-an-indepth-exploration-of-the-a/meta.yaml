  md: "Advanced Bash–Scripting Guide\n\n# Example 11–4. Using read with [file redirection](file\
    \ redirection)\n\n```\n#!/bin/bash\n\nread var1 <data-file\necho \"var1 = $var1\"\
    \n# var1 set to the entire first line of the input file \"data-file\"\n\nread\
    \ var2 var3 <data-file\necho \"var2 = $var2   var3 = $var3\"\n# Note non-intuitive\
    \ behavior of \"read\" here.\n# 1) Rewinds back to the beginning of input file.\n\
    # 2) Each variable is now set to a corresponding string,\n#    separated by whitespace,\
    \ rather than to an entire line of text.\n# 3) The final variable gets the remainder\
    \ of the line.\n# 4) If there are more variables to be set than whitespace-terminated\
    \ strings\n#    on the first line of the file, then the excess variables remain\
    \ empty.\n\necho \"------------------------------------------------------\"\n\n\
    # How to resolve the above problem with a loop:\nwhile read line\ndo\n  echo \"\
    $line\"\ndone <data-file\n# Thanks, Heiner Steven for pointing this out.\n\necho\
    \ \"------------------------------------------------------\"\n\n# Use $IFS (Internal\
    \ File Separator variable) to split a line of input to\n# \"read\", if you do\
    \ not want the default to be whitespace.\n\necho \"List of all users:\"\nOIFS=$IFS;\
    \ IFS=:     # /etc/passwd uses \":\" for field separator.\nwhile read name passwd\
    \ uid gid fullname ignore\ndo\n  echo \"$name ($fullname)\"\ndone </etc/passwd\
    \   # I/O redirection.\nIFS=$OIFS           # Restore original $IFS.\n# This code\
    \ snippet also by Heiner Steven.\n\nexit 0\n```\n\n# Filesystem\n\n# *cd*\n\n\
    The familiar **cd** change directory command finds use in scripts where execution\
