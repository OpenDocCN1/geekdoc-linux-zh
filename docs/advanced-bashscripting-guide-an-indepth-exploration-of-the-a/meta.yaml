  md: '# Chapter 13. System and Administrative Commands


    The startup and shutdown scripts in /etc/rc.d illustrate the uses (and usefulness)
    of many of these comands. These are usually invoked by root and used for system
    maintenance or emergency filesystem repairs. Use with caution, as some of these
    commands may damage your system if misused.


    # Users and Groups


    chown, chgrp


    The chown command changes the ownership of a file or files. This command is a
    useful method that root can use to shift file ownership from one user to another.
    An ordinary user may not change the ownership of files, not even her own files.
    [38]


    ```

    root# chown bozo *.txt

    ```


    The chgrp command changes the group ownership of a file or files. You must be
    owner of the file(s) as well as a member of the destination group (or root) to
    use this operation.


    ```

    chgrp --recursive dunderheads *.data

    # The "dunderheads" group will now own all the "*.data" files

    #+ all the way down the $PWD directory tree (that''s what "recursive" means).

    ```


    useradd, userdel


    The useradd administrative command adds a user account to the system and creates
    a home directory for that particular user, if so specified. The corresponding
    userdel command removes a user account from the system [39] and deletes associated
    files.


    > The adduser command is a synonym for useradd and is usually a symbolic link
    to it.


    id


    The id command lists the real and effective user IDs and the group IDs of the
    current user. This is the counterpart to the $UID, $EUID, and $GROUPS internal
    Bash variables.


    ```

    bash$ id

    uid=501(bozo) gid=501(bozo) groups=501(bozo),22(cdrom),80(cdwriter),81(audio)


    bash$ echo $UID

    501

    ```


    Also see Example 9-5.


    who


    Show all users logged on to the system.


    ```

    bash$ who

    ```'
