  md: '# Chapter 1. Why Shell Programming?


    A working knowledge of shell scripting is essential to everyone wishing to become
    reasonably adept at system administration, even if they do not anticipate ever
    having to actually write a script. Consider that as a Linux machine boots up,
    it executes the shell scripts in /etc/rc.d to restore the system configuration
    and set up services. A detailed understanding of these startup scripts is important
    for analyzing the behavior of a system, and possibly modifying it.


    Writing shell scripts is not hard to learn, since the scripts can be built in
    bite-sized sections and there is only a fairly small set of shell-specific operators
    and options [1] to learn. The syntax is simple and straightforward, similar to
    that of invoking and chaining together utilities at the command line, and there
    are only a few "rules" to learn. Most short scripts work right the first time,
    and debugging even the longer ones is straightforward.


    A shell script is a "quick and dirty" method of prototyping a complex application.
    Getting even a limited subset of the functionality to work in a shell script,
    even if slowly, is often a useful first stage in project development. This way,
    the structure of the application can be tested and played with, and the major
    pitfalls found before proceeding to the final coding in C, C++, Java, or Perl.


    Shell scripting hearkens back to the classical UNIX philosophy of breaking complex
    projects into simpler subtasks, of chaining together components and utilities.
    Many consider this a better, or at least more esthetically pleasing approach to
    problem solving than using one of the new generation of high powered all-in-one
    languages, such as Perl, which attempt to be all things to all people, but at
    the cost of forcing you to alter your thinking processes to fit the tool.


    When not to use shell scripts


    +   - resource-intensive tasks, especially where speed is a factor (sorting, hashing,
    etc.)

    - procedures involving heavy-duty math operations, especially floating point arithmetic,
    arbitrary precision calculations, or complex numbers (use C++ or FORTRAN instead)

    - cross-platform portability required (use C instead)

    - complex applications, where structured programming is a necessity (need typechecking
    of variables, function prototypes, etc.)

    - mission-critical applications upon which you are betting the ranch, or the future
    of the company

    - situations where security is important, where you need to guarantee the integrity
    of your system and protect against intrusion, cracking, and vandalism

    - project consists of subcomponents with interlocking dependencies

    - extensive file operations required (Bash is limited to serial file access, and
    that only in a particularly clumsy and inefficient line-by-line fashion)

    - need multi-dimensional arrays

    - need data structures, such as linked lists or trees

    - need to generate or manipulate graphics or GUIs

    - need direct access to system hardware

    - need port or socket I/O

    - need to use libraries or interface with legacy code

    - proprietary, closed-source applications (shell scripts are necessarily Open
    Source)


    If any of the above applies, consider a more powerful scripting language, perhaps
    Perl, Tcl, Python, or possibly a high-level compiled language such as C, C++,
    or Java. Even then, prototyping the application as a shell script might still
    be a useful development step.'
