  md: "# Advanced Bash–Scripting Guide\n\n```\ncommand1 2>& - | command2  # Also futile.\n\
    \nThanks, S.C.\n```\n\nUsing Bash [version 2+](http://www.tldp.org/LDP/abs/html/abs-guide.html#VERREF)\
    \ functionality may cause a bailout with error messages. Older Linux machines\
    \ may have version 1.XX of Bash as the default installation.\n\n```\n#!/bin/bash\n\
    \nminimum_version=2\n# Since Chet Ramey is constantly adding features to Bash,\n\
    # you may set $minimum_version to 2.XX, or whatever is appropriate.\nE_BAD_VERSION=80\n\
    \nif [ \"$BASH_VERSION\" \\< \"$minimum_version\" ]\nthen\n  echo \"This script\
    \ works only with Bash, version $minimum or greater.\"\n  echo \"Upgrade strongly\
    \ recommended.\"\n  exit $E_BAD_VERSION\nfi\n\n...\n```\n\nUsing Bash–specific\
    \ functionality in a Bourne shell script (`#!/bin/sh`) on a non–Linux machine\
    \ may cause unexpected behavior. A Linux system usually aliases **sh** to **bash**,\
    \ but this does not necessarily hold true for a generic UNIX machine.\n\nA script\
    \ with DOS–type newlines (`\\r\\n`) will fail to execute, since `#!/bin/bash\\\
    r\\n` is not recognized, *not* the same as the expected `#!/bin/bash\\n`. The\
    \ fix is to convert the script to UNIX–style newlines.\n\nA shell script headed\
    \ by `#!/bin/sh` may not run in full Bash–compatibility mode. Some Bash–specific\
    \ functions might be disabled. Scripts that need complete access to all the Bash–specific\
    \ extensions should start with `#!/bin/bash`.\n\nA script may not **export** variables\
    \ back to its [parent process](http://www.tldp.org/LDP/abs/html/abs-guide.html#PARENTPROC),\
    \ the shell, or to the environment. Just as we learned in biology, a child process\
    \ can inherit from a parent, but not vice versa.\n\n```\nWHATEVER=/home/bozo\n\
    export WHATEVER\nexit 0\nbash$ **echo $WHATEVER**\n\nbash$\n```\n\nSure enough,\
    \ back at the command prompt, $WHATEVER remains unset.\n\nSetting and manipulating\
    \ variables in a subshell, then attempting to use those same variables outside\
    \ the scope of the subshell will result an unpleasant surprise.\n\n# Example 32–1.\
    \ Subshell Pitfalls\n\n```\n#!/bin/bash\n# Pitfalls of variables in a subshell.\n\
    \nouter_variable=outer\n```"
  merge: -1
