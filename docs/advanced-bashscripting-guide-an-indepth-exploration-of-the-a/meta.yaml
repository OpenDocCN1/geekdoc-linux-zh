  md: '# Advanced Bash–Scripting Guide


    Strips the path information from a file name, printing only the file name. The
    construction **basename** $0 lets the script know its name, that is, the name
    it was invoked by. This can be used for "usage" messages if, for example a script
    is called with missing arguments:


    ```

    echo "Usage: `basename $0` arg1 arg2 ... argn"

    ```


    # dirname


    Strips the **basename** from a filename, printing only the path information.


    **basename** and **dirname** can operate on any arbitrary string. The argument
    does not need to refer to an existing file, or even be a filename for that matter
    (see [Example A–7](http://tldp.org/LDP/abs/html/exampleA-7.html)).


    # Example 12–27. basename and dirname


    ```

    #!/bin/bash


    a=/home/bozo/daily-journal.txt


    echo "Basename of /home/bozo/daily-journal.txt = `basename $a`"

    echo "Dirname of /home/bozo/daily-journal.txt = `dirname $a`"

    echo

    echo "My own home is `basename ~/`."         # Also works with just ~.

    echo "The home of my home is `dirname ~/`." # Also works with just ~.


    exit 0

    ```


    # split


    Utility for splitting a file into smaller chunks. Usually used for splitting up
    large files in order to back them up on floppies or preparatory to e-mailing or
    uploading them.


    # sum, cksum, md5sum


    These are utilities for generating checksums. A *checksum* is a number mathematically
    calculated from the contents of a file, for the purpose of checking its integrity.
    A script might refer to a list of checksums for security purposes, such as ensuring
    that the contents of key system files have not been altered or corrupted. The
    **md5sum** command is the most appropriate of these in security applications.


