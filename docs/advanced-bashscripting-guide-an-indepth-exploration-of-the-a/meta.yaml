  md: '# # Advanced Bash–Scripting Guide


    We will be using Bash, an acronym for "Bourne–Again Shell" and a pun on Stephen
    Bourne''s now classic Bourne Shell. Bash has become a *de facto* standard for
    shell scripting on all flavors of UNIX. Most of the principles dealt with in this
    book apply equally well to scripting with other shells, such as the Korn Shell,
    from which Bash derives some of its features, [2] and the C Shell and its variants.
    (Note that C Shell programming is not recommended due to certain inherent problems,
    as pointed out in a [news group posting](http://www.tldp.org) by Tom Christiansen
    in October of 1993).


    The following is a tutorial in shell scripting. It relies heavily on examples
    to illustrate features of the shell. As far as possible, the example scripts have
    been tested, and some of them may actually be useful in real life. The reader
    should use the actual examples in the the source archive (something-or-other.sh),
    [3] give them execute permission (`chmod u+rx scriptname`), then run them to see
    what happens. Should the source archive not be available, then cut-and-paste from
    the HTML, pdf, or text rendered versions. Be aware that some of the scripts below
    introduce features before they are explained, and this may require the reader
    to temporarily skip ahead for enlightenment.


    Unless otherwise noted, the book author wrote the example scripts that follow.'
  merge: -1
