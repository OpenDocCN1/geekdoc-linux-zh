    \ value trickery\n\n```\n#!/bin/bash\n# sum-product.sh\n# A function may \"return\"\
    \ more than one value.\n\nsum_and_product ()    # Calculates both sum and product\
    \ of passed args.\n{\n  echo $(( $1 + $2 )) $(( $1 * $2 ))\n# Echoes to stdout\
    \ each calculated value, separated by space.\n}\n\necho\necho \"Enter first number\
    \ \"\nread first\n\necho\necho \"Enter second number \"\nread second\necho\n\n\
    retval=`sum_and_product $first $second`        # Assigns output of function.\n\
    sum=`echo \"$retval\" | awk '{print $1}'`       # Assigns first field.\nproduct=`echo\
    \ \"$retval\" | awk '{print $2}'`   # Assigns second field.\n\necho \"$first +\
    \ $second = $sum\"\necho \"$first * $second = $product\"\necho\n\nexit 0\n```\n\
