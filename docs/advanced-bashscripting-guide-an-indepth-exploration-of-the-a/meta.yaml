- img_proc: false
  md: "# Advanced Bash–Scripting Guide\n\n```\n# Passing shell variables to the awk\
    \ part of the script is a bit tricky.\n# See the awk documentation for more details.\n\
    \n# A multi-line awk script is invoked by  awk ' ..... '\n\n# Begin awk script.\n\
    # -----------------------\nawk '\n\n{ total += $'\"${column_number}\"'\n}\nEND\
    \ {\n    print total\n}\n\n' \"$filename\"\n# -----------------------\n# End awk\
    \ script.\n\n\n#   It may not be safe to pass shell variables to an embedded awk\
    \ script,\n#   so Stephane Chazelas proposes the following alternative:\n#   ---------------------------------------------------------\n\
    #   awk -v column_number=\"$column_number\" '\n#   { total += $column_number\n\
    #   }\n#   END {\n#       print total\n#   }' \"$filename\"\n#   ---------------------------------------------------------\n\
    \nexit 0\n```\n\nFor those scripts needing a single do–it–all tool, a Swiss army\
    \ knife, there is Perl. Perl combines the capabilities of **sed** and **awk**,\
    \ and throws in a large subset of **C**, to boot. It is modular and contains support\
    \ for everything ranging from object–oriented programming up to and including\
    \ the kitchen sink. Short Perl scripts lend themselves to embedding in shell scripts,\
    \ and there may even be some substance to the claim that Perl can totally replace\
    \ shell scripting (though the author of this document remains skeptical).\n\n\
    # Example 34–4. Perl embedded in a Bash script\n\n```\n#!/bin/bash\n\n# Shell\
    \ commands may precede the Perl script.\necho \"This precedes the embedded Perl\
    \ script within \\\"$0\\\".\"\necho \"=============================================================\"\
    \n\nperl -e 'print \"This is an embedded Perl script.\\n\";'\n# Like sed, Perl\
    \ also uses the \"-e\" option.\n\necho \"=============================================================\"\
    \necho \"However, the script may also contain shell and system commands.\"\n\n\
    exit 0\n```"
