  md: "# Advanced Bash–Scripting Guide\n\nList open files. This command outputs a\
    \ detailed table of all currently open files and gives information about their\
    \ owner, size, the processes associated with them, and more. Of course, **lsof**\
    \ may be piped to `grep` and/or `awk` to parse and analyze its results.\n\n```\n\
    bash$ lsof\nCOMMAND     PID   USER   FD   TYPE   DEVICE  SIZE     NODE NAME\n\
    init          1   root   mem  REG    3,5     30748    30303 /sbin/init\ninit \
    \         1   root   mem  REG    3,5     73120    8069  /lib/ld-2.1.3.so\ninit\
    \          1   root   mem  REG    3,5     931668   8075  /lib/libc-2.1.3.so\n\
    cardmgr     213   root   mem  REG    3,5     36956    30357 /sbin/cardmgr\n...\n\
    ```\n\n# strace\n\nDiagnostic and debugging tool for tracing system calls and\
    \ signals. The simplest way of invoking it is **strace COMMAND**.\n\n```\nbash$\
    \ strace df\nexecve(\"/bin/df\", [\"df\"], [/* 45 vars */]) = 0\nuname({sys=\"\
    Linux\", node=\"bozo.localdomain\", ...}) = 0\nbrk(0)                        \
    \            = 0x804f5e4\n...\n```\n\nThis is the Linux equivalent of **truss**.\n\
    \n# free\n\nShows memory and cache usage in tabular form. The output of this command\
    \ lends itself to parsing, using `grep`, `awk` or **Perl**. The **procinfo** command\
