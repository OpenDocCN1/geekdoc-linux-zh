  md: "# Advanced Bash-Scripting Guide\n\n```\n#  Similar to the CPU stack, a push-down\
    \ stack stores data items\n#+ sequentially, but releases them in reverse order,\
    \ last-in first-out.\n\nBP=100          # Base Pointer of stack array.\n     \
    \           # Begin at element 100.\n\nSP=$BP          # Stack Pointer.\n    \
    \            # Initialize it to \"base\" (bottom) of stack.\n\nData=         \
    \  # Contents of stack location.\n                #  Must use local variable,\n\
    \                #+ because of limitation on function return range.\n\ndeclare\
    \ -a stack\n\npush()          # Push item on stack.\n{\nif [ -z \"$1\" ]  # Nothing\
    \ to push?\nthen\n  return\nfi\n\nlet \"SP -= 1\"\nstack[$SP]=$1\n\nreturn\n}\n\
    \npop()                   # Pop item off stack.\n{\nData=                   #\
    \ Empty out data item.\n\nif [ \"$SP\" -eq \"$BP\" ]  # Stack empty?\nthen\n \
    \ return\nfi                      #  This also keeps SP from getting past 100,\n\
    \                        #+ i.e., prevents a runaway stack.\n\nData=${stack[$SP]}\n\
    let \"SP += 1\"           # Bump stack pointer.\nreturn\n}\n\nstatus_report()\
    \         # Find out what's happening.\n{\necho \"-----------------------------------\"\
    \necho \"REPORT\"\necho \"Stack Pointer = $SP\"\necho \"Just popped \\\"$Data\\\
    \" off the stack.\"\necho \"-----------------------------------\"\necho\n}\n\n\
    # ======================================================\n# Now, for some fun.\n\
    \necho\n\n# See if you can pop anything off empty stack.\n```"
