  md: "lists the end of a file to `stdout` (the default is 10 lines). Commonly used\
    \ to keep track of changes to a system logfile, using the `-f` option, which outputs\
    \ lines appended to the file.\n\n# Example 12–11. Using tail to monitor the system\
    \ log\n\n```\n#!/bin/bash\n\nfilename=sys.log\n\ncat /dev/null > $filename; echo\
    \ \"Creating / cleaning out file.\"\n# Creates file if it does not already exist,\n\
    #+ and truncates it to zero length if it does.\n#  : > filename   also works.\n\
    \ntail /var/log/messages > $filename\n# /var/log/messages must have world read\
    \ permission for this to work.\n\necho \"$filename contains tail end of system\
    \ log.\"\n\nexit 0\n```\n\nSee also [Example 12–4], [Example 12–28] and [Example\
    \ 30–5].\n\n# grep\n\nA multi-purpose file search tool that uses [regular expressions].\
    \ It was originally a command/filter in the venerable **ed** line editor, *g/re/p*,\
    \ that is, *global – regular expression – print*.\n\n`grep pattern [file...]`\n\
    \nSearch the target file(s) for occurrences of *pattern*, where *pattern* may\
    \ be literal text or a regular expression.\n\n```\nbash$ grep '[rst]ystem.$' osinfo.txt\n\
    The GPL governs the distribution of the Linux operating system.\n```\n\nIf no\
    \ target file(s) specified, **grep** works as a filter on `stdout`, as in a [pipe].\n\
    \n```\nbash$ ps ax | grep clock\n765 tty1     S      0:00 xclock\n 901 pts/1 \
    \   S      0:00 grep clock\n```\n\nThe `-i` option causes a case-insensitive search.\n\
    \nThe `-w` option matches only whole words.\n\nThe `-l` option lists only the\
    \ files in which matches were found, but not the matching lines.\n\nThe `-r` (recursive)\
    \ option searches files in the current working directory and all subdirectories\
    \ below it.\n\nThe `-n` option lists the matching lines, together with line numbers."
