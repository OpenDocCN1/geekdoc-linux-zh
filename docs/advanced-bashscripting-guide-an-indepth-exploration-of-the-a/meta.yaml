    \ and weaknesses\n#           of each of these various approaches.\n```\n\n![](bbox=[0.13,\
    \ 0.6, 0.17, 0.62])\n\nThe DEBUG argument to **trap** causes a specified action\
    \ to execute after every command in a script. This permits tracing variables,\
    \ for example.\n\n# Example 30–6. Tracing a variable\n\n```\n#!/bin/bash\n\ntrap\
    \ 'echo \"VARIABLE-TRACE> \\$variable = \\\"$variable\\\"\"' DEBUG\n# Echoes the\
    \ value of $variable after every command.\n\nvariable=29\n\necho \"Just initialized\
    \ \\\"\\$variable\\\" to $variable.\"\n\nlet \"variable *= 3\"\necho \"Just multiplied\
    \ \\\"\\$variable\\\" by 3.\"\n\n# The \"trap 'commands' DEBUG\" construct would\
    \ be more useful\n# in the context of a complex script,\n# where placing multiple\
    \ \"echo $variable\" statements might be\n# clumsy and time-consuming.\n\n# Thanks,\
    \ Stephane Chazelas for the pointer.\n\nexit 0\n```"
