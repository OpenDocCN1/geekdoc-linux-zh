  md: "# Advanced Bash–Scripting Guide\n\n# Example 30–4. Trapping at exit\n\n```\n\
    #!/bin/bash\n\ntrap 'echo Variable Listing --- a = $a  b = $b' EXIT\n# EXIT is\
    \ the name of the signal generated upon exit from a script.\n\na=39\n\nb=36\n\n\
    exit 0\n# Note that commenting out the 'exit' command makes no difference,\n#\
    \ since the script exits in any case after running out of commands.\n```\n\n#\
    \ Example 30–5. Cleaning up after Control–C\n\n```\n#!/bin/bash\n# logon.sh: A\
    \ quick 'n dirty script to check whether you are on-line yet.\n\nTRUE=1\nLOGFILE=/var/log/messages\n\
    # Note that $LOGFILE must be readable (chmod 644 /var/log/messages).\nTEMPFILE=temp.$$\n\
    # Create a \"unique\" temp file name, using process id of the script.\nKEYWORD=address\n\
    # At logon, the line \"remote IP address xxx.xxx.xxx.xxx\"\n#                \
    \            appended to /var/log/messages.\nONLINE=22\nUSER_INTERRUPT=13\n\n\
    trap 'rm -f $TEMPFILE; exit $USER_INTERRUPT' TERM INT\n# Cleans up the temp file\
    \ if script interrupted by control-c.\n\necho\n\nwhile [ $TRUE ]  #Endless loop.\n\
    do\n   tail -1 $LOGFILE> $TEMPFILE\n   # Saves last line of system log file as\
    \ temp file.\n   search=`grep $KEYWORD $TEMPFILE`\n   # Checks for presence of\
    \ the \"IP address\" phrase,\n   # indicating a successful logon.\n\n   if [ !\
    \ -z \"$search\" ] # Quotes necessary because of possible spaces.\n   then\n \
    \     echo \"On-line\"\n      rm -f $TEMPFILE    # Clean up temp file.\n     \
    \ exit $ONLINE\n   else\n      echo -n \".\"        # -n option to echo suppresses\
    \ newline,\n                          # so you get continuous rows of dots.\n\
    \   fi\n\n   sleep 1\ndone\n\n# Note: if you change the KEYWORD variable to \"\
    Exit\",\n# this script can be used while on-line to check for an unexpected logoff.\n\
    ```"
