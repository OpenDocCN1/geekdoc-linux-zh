  md: "# # Chapter 28. /dev and /proc\n\nA Linux or UNIX machine typically has two\
    \ special-purpose directories, `/dev` and `/proc`.\n\n# ## 28.1. /dev\n\nThe `/dev`\
    \ directory contains entries for the physical *devices* that may or may not be\
    \ present in the hardware. [57] The hard drive partitions containing the mounted\
    \ filesystem(s) have entries in `/dev`, as a simple `df` shows.\n\n```\nbash$\
    \ **df**\nFilesystem           1k-blocks      Used Available Use%\nMounted on\n\
    /dev/hda6             495876    222748    247527  48% /\n/dev/hda1           \
    \   50755      3887     44248   9% /boot\n/dev/hda8             367013     13262\
    \    334803   4% /home\n/dev/hda5            1714416   1123624    503704  70%\
    \ /usr\n```\n\nAmong other things, the `/dev` directory also contains *loopback*\
    \ devices, such as `/dev/loop0`. A loopback device is a gimmick allows an ordinary\
    \ file to be accessed as if it were a block device. [58] This enables mounting\
    \ an entire filesystem within a single large file. See [Example 13-6](...) and\
    \ [Example 13-5](...).\n\nA few of the pseudo-devices in `/dev` have other specialized\
    \ uses, such as `/dev/null`, `/dev/zero` and `/dev/urandom`.\n\n# ## 28.2. /proc\n\
    \nThe `/proc` directory is actually a pseudo-filesystem. The files in the `/proc`\
    \ directory mirror currently running system and kernel *processes* and contain\
    \ information and statistics about them.\n\n```\nbash$ **cat /proc/devices**\n\
    Character devices:\n  1 mem\n  2 pty\n  3 ttyp\n  4 ttyS\n  5 cua\n  7 vcs\n 10\
    \ misc\n 14 sound\n 29 fb\n 36 netlink\n128 ptm\n136 pts\n162 raw\n254 pcmcia\n\
    \nBlock devices:\n  1 ramdisk\n```"
  merge: -1
  pgno: 292
