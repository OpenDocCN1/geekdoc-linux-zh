    # 9.2. Manipulating Strings


    Bash supports a surprising number of string manipulation operations. Unfortunately,
    these tools lack a unified focus. Some are a subset of [parameter substitution](link),
    and others fall under the functionality of the UNIX [expr](link) command. This
    results in inconsistent command syntax and overlap of functionality, not to mention
    confusion.


    # String Length


    *${#string}*


    *expr length $string*


    *expr "$string" : ''.*''*


    ```

    stringZ=abcABC123ABCabc


    echo ${#stringZ}                 # 15

    echo `expr length $stringZ`      # 15

    echo `expr "$stringZ" : ''.*''`    # 15

    ```


    # Length of Matching Substring at Beginning of String


    *expr match "$string" ''$substring''*


    > `$substring` is a [regular expression](link).'
