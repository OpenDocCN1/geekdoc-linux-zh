  md: 'When used in a non-interactive script, **mv** takes the *-f* (*force*) option
    to bypass user input.


    # rm


    Delete (remove) a file or files. The *-f* option forces removal of even readonly
    files, and is useful for bypassing user input in a script.


    > When used with the recursive flag *-r*, this command removes files all the way
    down the directory tree.


    # rmdir


    Remove directory. The directory must be empty of all files, including invisible
    "dotfiles", [29] for this command to succeed.


    # mkdir


    Make directory, creates a new directory. `mkdir -p project/programs/December`
    creates the named directory. The *-p* option automatically creates any necessary
    parent directories.


    # chmod


    Changes the attributes of an existing file (see [Example 11–8](Example 11-8)).


    ```

    chmod +x filename

    # Makes "filename" executable for all users.


    chmod u+s filename

    # Sets "suid" bit on "filename" permissions.

    # An ordinary user may execute "filename" with same privileges as the file''s
    owner.

    # (This does not apply to shell scripts.)

    ```


