  md: "# Advanced Bash–Scripting Guide\n\n```\nbash$ grep -n Linux osinfo.txt\n2:This\
    \ is a file containing information about Linux.\n 6:The GPL governs the distribution\
    \ of the Linux operating system.\n```\n\nThe `-v` (or `--invert-match`) option\
    \ *filters out* matches.\n\n```\ngrep pattern1 *.txt | grep -v pattern2\n\n# Matches\
    \ all lines in \"*.txt\" files containing \"pattern1\",\n# but ***not*** \"pattern2\"\
    .\n```\n\nThe `-c` (`--count`) option gives a numerical count of matches, rather\
    \ than actually listing the matches.\n\n```\ngrep -c txt *.sgml   # (number of\
    \ occurrences of \"txt\" in \"*.sgml\" files)\n\n\n#   grep -cz .\n#         \
    \   ^ dot\n# means count (-c) zero-separated (-z) items matching \".\"\n# that\
    \ is, non-empty ones (containing at least 1 character).\n#\nprintf 'a b\\nc  d\\\
    n\\n\\n\\n\\000\\n\\000e\\000\\000\\nf' | grep -cz .      # 4\nprintf 'a b\\nc\
    \  d\\n\\n\\n\\n\\000\\n\\000e\\000\\000\\nf' | grep -cz '$'    # 5\nprintf 'a\
    \ b\\nc  d\\n\\n\\n\\n\\000\\n\\000e\\000\\000\\nf' | grep -cz '^'    # 5\n#\n\
    printf 'a b\\nc  d\\n\\n\\n\\n\\000\\n\\000e\\000\\000\\nf' | grep -c '$'    \
    \ # 9\n# By default, newline chars (\\n) separate items to match.\n\n# Note that\
    \ the -z option is GNU \"grep\" specific.\n\n# Thanks, S.C.\n```\n\nWhen invoked\
    \ with more than one target file given, **grep** specifies which file contains\
    \ matches.\n\n```\nbash$ grep Linux osinfo.txt misc.txt\nosinfo.txt:This is a\
    \ file containing information about Linux.\n osinfo.txt:The GPL governs the distribution\
    \ of the Linux operating system.\n misc.txt:The Linux operating system is steadily\
    \ gaining in popularity.\n```\n\n> To force **grep** to show the filename when\
