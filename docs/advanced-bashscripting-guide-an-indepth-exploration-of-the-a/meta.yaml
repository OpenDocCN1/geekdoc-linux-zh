  md: "Advanced Bash–Scripting Guide\n\n*sdiff*\n\nCompare and/or edit two files in\
    \ order to merge them into an output file. Because of its interactive nature,\
    \ this command would find little use in a script.\n\n*cmp*\n\nThe **cmp** command\
    \ is a simpler version of **diff**, above. Whereas **diff** reports the differences\
    \ between two files, **cmp** merely shows at what point they differ.\n\n> Like\
    \ **diff**, **cmp** returns an exit status of 0 if the compared files are identical,\
    \ and 1 if they differ. This permits use in a test construct within a shell script.\n\
    \n**Example 12–8. Using cmp to compare two files within a script.**\n\n```\n#!/bin/bash\n\
    \nARGS=2  # Two args to script expected.\nE_BADARGS=65\n\nif [ $# -ne \"$ARGS\"\
    \ ]\nthen\n  echo \"Usage: `basename $0` file1 file2\"\n  exit $E_BADARGS\nfi\n\
    \ncmp $1 $2 > /dev/null  # /dev/null buries the output of the \"cmp\" command.\n\
    # Also works with 'diff', i.e.,   diff $1 $2 > /dev/null\n\nif [ $? -eq 0 ]  \
    \       # Test exit status of \"cmp\" command.\nthen\n  echo \"File \\\"$1\\\"\
    \ is identical to file \\\"$2\\\".\"\nelse\n  echo \"File \\\"$1\\\" differs from\
    \ file \\\"$2\\\".\"\nfi\n\nexit 0\n```\n\n> Use **zcmp** on *gzipped* files.\n\
    \n*comm*\n\nVersatile file comparison utility. The files must be sorted for this\
    \ to be useful.\n\n```\ncomm -options first-file second-file\n```\n\n**comm file-1\
    \ file-2** outputs three columns:\n\n+   ◆ column 1 = lines unique to file-1\n\
    ◆ column 2 = lines unique to file-2"
