- img_proc: false
  md: "```\nKeypress=$(head -c1)            # or $(dd bs=1 count=1 2> /dev/null)\n\
    \                                # on non-GNU systems\n\necho\necho \"Key pressed\
    \ was \\\"\"$Keypress\"\\\".\"\necho\n\nstty \"$old_tty_settings\"        # Restore\
    \ old settings.\n\n# Thanks, Stephane Chazelas.\n\nexit 0\n```\n\nAlso see [Example\
    \ 9–3](Example 9–3).\n\n> ### terminals and modes\n\nNormally, a terminal works\
    \ in the *canonical* mode. When a user hits a key, the resulting character does\
    \ not immediately go to the program actually running in this terminal. A buffer\
    \ local to the terminal stores keystrokes. When the user hits the **ENTER** key,\
    \ this sends all the stored keystrokes to the program running. There is even a\
    \ basic line editor inside the terminal.\n\n```\nbash$ stty -a\nspeed 9600 baud;\
    \ rows 36; columns 96; line = 0;\n intr = ^C; quit = ^\\; erase = ^H; kill = ^U;\
    \ eof = ^D; eol = <undef>; eol2 = <undef>;\n start = ^Q; stop = ^S; susp = ^Z;\
    \ rprnt = ^R; werase = ^W; lnext = ^V; flush = ^O;\n ...\nisig icanon iexten echo\
    \ echoe echok -echonl -noflsh -xcase -tostop -echoprt\n```\n\nUsing canonical\
    \ mode, it is possible to redefine the special keys for the local terminal line\
    \ editor.\n\n```\nbash$ cat > filexxx\nwha<ctl-W>I<ctl-H>foo bar<ctl-U>hello world<ENTER>\n\
    <ctl-D>\nbash$ cat filexxx\nhello world\nbash$ bash$ wc -c < file\n13\n```\n\n\
    The process controlling the terminal receives only 13 characters (12 alphabetic\
    \ ones, plus a newline), although the user hit 26 keys.\n\nIn non-canonical (\"\
    raw\") mode, every key hit (including special editing keys such as **ctl–H**)\
    \ sends a character immediately to the controlling process.\n\nThe Bash prompt\
    \ disables both `icanon` and `echo`, since it replaces the basic terminal line\
    \ editor with its own more elaborate one. For example, when you hit **ctl–A**\
    \ at the Bash prompt, there's no ^A echoed by the terminal, but Bash gets a `\\\
    1` character, interprets it, and moves the cursor to the beginning of the line.\n\
    \n*Stephane Chazelas*"
