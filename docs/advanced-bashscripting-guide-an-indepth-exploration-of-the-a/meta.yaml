    \ A \"zombie process\", that is, a process whose [parent](http://tldp.org/LDP/abs/html/glossary.html#PARENTPROC)\
    \ has terminated, cannot be killed (you can't kill something that is already dead),\
    \ but **init** will usually clean it up sooner or later.\n\n# *command*\n\nThe\
