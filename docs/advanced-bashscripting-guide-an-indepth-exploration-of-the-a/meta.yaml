    \n# *getty, agetty*\n\nThe initialization process for a terminal uses **getty**\
    \ or **agetty** to set it up for login by a user. These commands are not used\
    \ within user shell scripts. Their scripting counterpart is **stty**.\n\n# *mesg*\n\
    \nEnables or disables write access to the current user's terminal. Disabling access\
    \ would prevent another user on the network to [write](http://www.tldp.org/LDP/abs/html/system.html#WRITEREF)\
    \ to the terminal.\n\nIt can be very annoying to have a message about ordering\
    \ pizza suddenly appear in the middle of the text file you are editing. On a multi-user\
    \ network, you might therefore wish to disable write access to your terminal when\
    \ you need to avoid interruptions.\n\n# *wall*\n\nThis is an acronym for \"[write](http://www.tldp.org/LDP/abs/html/system.html#WRITEREF)\
    \ all\", i.e., sending a message to all users at every terminal logged into the\
    \ network. It is primarily a system administrator's tool, useful, for example,\
    \ when warning everyone that the system will shortly go down due to a problem\
    \ (see [Example 17-2](http://www.tldp.org/LDP/abs/html/system.html#EX17)).\n\n\
    ```\nbash$ wall System going down for maintenance in 5 minutes!\nBroadcast message\
    \ from bozo (pts/1) Sun Jul  8 13:53:27 2001...\n\n  System going down for maintenance\
    \ in 5 minutes!\n```\n\nIf write access to a particular terminal has been disabled\
    \ with **mesg**, then **wall** cannot send a message to it.\n\n# *dmesg*"
