  md: "# Advanced Bash–Scripting Guide\n\n```\n#!/bin/bash\n\n# script \"set-test\"\
    \n\n# Invoke this script with three command line parameters,\n# for example, \"\
    ./set-test one two three\".\n\necho\necho \"Positional parameters before  set\
    \ \\`uname -a\\` :\"\necho \"Command-line argument #1 = $1\"\necho \"Command-line\
    \ argument #2 = $2\"\necho \"Command-line argument #3 = $3\"\n\necho\n\nset \\\
    `uname -a\\` # Sets the positional parameters to the output\n                #\
    \ of the command \\`uname -a\\`\n\necho \"Positional parameters after  set \\\
    `uname -a\\` :\"\n# $1, $2, $3, etc. reinitialized to result of \\`uname -a\\\
    `\necho \"Field #1 of 'uname -a' = $1\"\necho \"Field #2 of 'uname -a' = $2\"\n\
    echo \"Field #3 of 'uname -a' = $3\"\necho\n\nexit 0\n```\n\nSee also [Example\
    \ 10-2](#).\n\n# unset\n\nThe **unset** command deletes a shell variable, effectively\
    \ setting it to *null*. Note that this command does not affect positional parameters.\n\
    \n```\nbash$ **unset PATH**\n\nbash$ **echo $PATH**\n\nbash$\n```\n\n# Example\
    \ 11–11. \"unsetting\" a variable\n\n```\n#!/bin/bash\n# unset.sh: Unsetting a\
    \ variable.\n\nvariable=hello                      # Initialized.\necho \"variable\
    \ = $variable\"\n\nunset variable                        # Unset.\n          \
    \                            # Same effect as   variable=\necho \"(unset) variable\
    \ = $variable\"   # $variable is null.\n\nexit 0\n```\n\n# export\n\nThe **export**\
    \ command makes available variables to all child processes of the running script\
    \ or shell. Unfortunately, there is no way to **export** variables back to the\
    \ parent process, to the process that called or invoked the script or shell. One\
