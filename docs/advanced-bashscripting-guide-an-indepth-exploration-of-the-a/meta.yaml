    \  local nhbd=$?\n\n\n  if [ \"$nhbd\" -eq \"$BIRTH\" ]  # Alive in any case.\n\
    \  then\n    return $ALIVE\n  fi\n\n  if [ \"$3\" = \".\" -a \"$nhbd\" -eq \"\
