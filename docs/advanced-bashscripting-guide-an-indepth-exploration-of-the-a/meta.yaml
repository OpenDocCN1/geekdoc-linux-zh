  md: "```\n# Counting to 6 in 5 different ways.\n\nn=1; echo -n \"$n \"\n\nlet \"\
    n = $n + 1\"   # let \"n = n + 1\"  also works.\necho -n \"$n \"\n\n: $((n = $n\
    \ + 1))\n#  \":\" necessary because otherwise Bash attempts\n#+ to interpret \"\
    $((n = $n + 1))\" as a command.\necho -n \"$n \"\n\nn=$(($n + 1))\necho -n \"\
    $n \"\n\n: $[ n = $n + 1 ]\n#  \":\" necessary because otherwise Bash attempts\n\
    #+ to interpret \"$[ n = $n + 1 ]\" as a command.\n# Works even if \"n\" was initialized\
    \ as a string.\necho -n \"$n \"\n\nn=$[ $n + 1 ]\n#  Works even if \"n\" was initialized\
    \ as a string.\n#* Avoid this type of construct, since it is obsolete and nonportable.\n\
    echo -n \"$n \"; echo\n\n# Thanks, Stephane Chazelas.\n\nexit 0\n```\n\nInteger\
    \ variables in Bash are actually signed *long* (32-bit) integers, in the range\
    \ of –2147483648 to 2147483647. An operation that takes a variable outside these\
    \ limits will give an erroneous result.\n\n```\na=2147483646\necho \"a = $a\"\
    \       # a = 2147483646\nlet \"a+=1\"         # Increment \"a\".\necho \"a =\
    \ $a\"       # a = 2147483647\nlet \"a+=1\"         # increment \"a\" again, past\
    \ the limit.\necho \"a = $a\"       # a = -2147483648\n                   #  \
    \    ERROR (out of range)\n```\n\nBash does not understand floating point arithmetic.\
    \ It treats numbers containing a decimal point as strings.\n\n```\na=1.5\n\nlet\
    \ \"b = $a + 1.3\"  # Error.\n# t2.sh: let: b = 1.5 + 1.3: syntax error in expression\
    \ (error token is \".5 + 1.3\")\n\necho \"b = $b\"       # b=1\n```\n\nUse [bc](bc)\
    \ in scripts that that need floating point calculations or math library functions.\n\
    \n**bitwise operators.** The bitwise operators seldom make an appearance in shell\
    \ scripts. Their chief use seems to be manipulating and testing values read from\
    \ ports or sockets. \"Bit flipping\" is more relevant to compiled languages, such\
    \ as C and C++, which run fast enough to permit its use on the fly."
