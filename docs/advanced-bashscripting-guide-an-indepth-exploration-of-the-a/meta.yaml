  md: '# Advanced Bash–Scripting Guide


    See [Example 12–23](link) and [Example A–13](link).


    Multiple output streams may be redirected to one file.


    ```

    ls -yz >> command.log 2>&1

    # Capture result of illegal options "yz" to "ls" in file "command.log".

    # Because stderr redirected to the file, any error messages will also be there.

    ```


    # Closing File Descriptors


    *n <&–*


    > Close input file descriptor *n*.


    *0 <&–, <&–*


    > Close `stdin`.


    *n >&–*


    > Close output file descriptor *n*.


    *1 >&–, >&–*


    > Close `stdout`.


    Child processes inherit open file descriptors. This is why pipes work. To prevent
    an fd from being inherited, close it.


    ```

    # Redirecting only stderr to a pipe.


    exec 3>&1                              # Save current "value" of stdout.

    ls -l 2>&1 >&3 3>&- | grep bad 3>&-    # Close fd 3 for ''grep'' (but not ''ls'').

    #             ^^^^   ^^^^

    exec 3>&-                              # Now close it for the remainder of the
    script.


    # Thanks, S.C.

    ```


    For a more detailed introduction to I/O redirection see [Appendix D](link).


    # 16.1. Using exec


    The **exec <filename** command redirects `stdin` to a file. From that point on,
    all `stdin` comes from that file, rather than its normal source (usually keyboard
    input). This provides a method of reading a file line by line and possibly parsing
    each line of input using [sed](link) and/or [awk](link).


    # Example 16–1. Redirecting `stdin` using exec


