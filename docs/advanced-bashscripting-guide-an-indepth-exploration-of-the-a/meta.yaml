  md: "# Advanced Bash–Scripting Guide\n\n```\n# See Hofstadter's book, \"Goedel,\
    \ Escher, Bach: An Eternal Golden Braid\",\n# p. 137, ff.\n\nLIMIT=100    # Number\
    \ of terms to calculate\nLINEWIDTH=20 # Number of terms printed per line\n\nQ[1]=1\
    \       # First two terms of series are 1.\nQ[2]=1\n\necho\necho \"Q-series [$LIMIT\
    \ terms]:\"\necho -n \"${Q[1]} \"        # Output first two terms.\necho -n \"\
    ${Q[2]} \"\n\nfor ((n=3; n <= $LIMIT; n++))  # C-like loop conditions.\ndo   #\
    \ Q[n] = Q[n - Q[n-1]] + Q[n - Q[n-2]]  for n>2\n# Need to break the expression\
    \ into intermediate terms,\n# since Bash doesn't handle complex array arithmetic\
    \ very well.\n\n   let \"n1 = $n - 1\"      # n-1\n   let \"n2 = $n - 2\"    \
    \  # n-2\n\n   t0=`expr $n - ${Q[n1]}` # n - Q[n-1]\n   t1=`expr $n - ${Q[n2]}`\
    \ # n - Q[n-2]\n\n   T0=${Q[t0]}            # Q[n - Q[n-1]]\n   T1=${Q[t1]}  \
    \          # Q[n - Q[n-2]]\n\n   Q[n]=`expr $T0 + $T1`  # Q[n - Q[n-1]] + Q[n\
    \ - Q[n-2]]\n   echo -n \"${Q[n]} \"\n\n   if [ `expr $n % $LINEWIDTH` -eq 0 ]\
    \  # Format output.\n   then  #    mod\n     echo # Break lines into neat chunks.\n\
    \   fi\n\ndone\n\necho\n\nexit 0\n\n# This is an iterative implementation of the\
    \ Q-series.\n# The more intuitive recursive implementation is left as an exercise.\n\
    # Warning: calculating this series recursively takes a *very* long time.\n```\n\
