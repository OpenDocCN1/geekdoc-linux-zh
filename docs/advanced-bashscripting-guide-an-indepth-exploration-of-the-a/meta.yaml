  md: '# Advanced Bash–Scripting Guide


    Print Working Directory. This gives the user''s (or script''s) current directory
    (see [Example 11–5](#)). The effect is identical to reading the value of the builtin
    variable `$PWD`.


    **pushd, popd, dirs**


    This command set is a mechanism for bookmarking working directories, a means of
    moving back and forth through directories in an orderly manner. A pushdown stack
    is used to keep track of directory names. Options allow various manipulations
    of the directory stack.


    **pushd** *dir-name* pushes the path *dir-name* onto the directory stack and simultaneously
    changes the current working directory to *dir-name*


    **popd** removes (pops) the top directory path name off the directory stack and
    simultaneously changes the current working directory to that directory popped
    from the stack.


    **dirs** lists the contents of the directory stack (compare this with the `$DIRSTACK`
    variable). A successful **pushd** or **popd** will automatically invoke **dirs**.


    Scripts that require various changes to the current working directory without
    hard–coding the directory name changes can make good use of these commands. Note
    that the implicit $DIRSTACK array variable, accessible from within a script, holds
    the contents of the directory stack.


    # Example 11–5. Changing the current working directory


    ```

    #!/bin/bash


    dir1=/usr/local

    dir2=/var/spool


    pushd $dir1

    # Will do an automatic ''dirs'' (list directory stack to stdout).

    echo "Now in directory `pwd`." # Uses back-quoted ''pwd''.


    # Now, do some stuff in directory ''dir1''.

    pushd $dir2

    echo "Now in directory `pwd`."


    # Now, do some stuff in directory ''dir2''.

    echo "The top entry in the DIRSTACK array is $DIRSTACK."

    popd

    echo "Now back in directory `pwd`."


    # Now, do some more stuff in directory ''dir1''.

    popd

    echo "Now back in original working directory `pwd`."


    exit 0

    ```


    # Variables


    **let**


    The **let** command carries out arithmetic operations on variables. In many cases,
    it functions as a less complex version of [expr](#).'
