  md: "# Chapter 8. Operations and Related Topics\n\n# 8.1. Operators\n\n**assignment**\n\
    \n*variable assignment*\n\nInitializing or changing the value of a variable\n\n\
    =\n\nAll-purpose assignment operator, which works for both arithmetic and string\
    \ assignments.\n\n```\nvar=27\ncategory=minerals  # No spaces allowed after the\
    \ \"=\".\n```\n\n> ⚠️ Do not confuse the \"=\" assignment operator with the ≡\
    \ test operator.\n\n```\n#     = as a test operator\n\nif [ \"$string1\" = \"\
    $string2\" ]\n# if [ \"X$string1\" = \"X$string2\" ] is safer,\n# to prevent an\
    \ error message should one of the variables be empty.\n# (The prepended \"X\"\
    \ characters cancel out.)\nthen\n    command\nfi\n```\n\n**arithmetic operators**\n\
    \n**+**  plus\n\n**−**  minus\n\n**\\***  multiplication\n\n**/**  division\n\n\
    **\\*\\***  exponentiation"
