  md: "# Advanced Bash-Scripting Guide\n\n```\ndo\n  read name                # Reads\
    \ from $Filename, rather than stdin.\n  echo $name\n  let \"count += 1\"\ndone\
    \ <\"$Filename\"          # Redirects stdin to file $Filename.\n#    ^^^^^^^^^^^^\n\
    \necho; echo \"$count names read\"; echo\n\n#  Note that in some older shell scripting\
    \ languages,\n#+ the redirected loop would run as a subshell.\n#  Therefore, $count\
    \ would return 0, the initialized value outside the loop.\n#  Bash and ksh avoid\
    \ starting a subshell whenever possible,\n#  +so that this script, for example,\
    \ runs correctly.\n#\n#  Thanks to Heiner Steven for pointing this out.\n\nexit\
    \ 0\n```\n\n# Example 16-3. Alternate form of redirected *while* loop\n\n```\n\
    #!/bin/bash\n\n# This is an alternate form of the preceding script.\n\n#  Suggested\
    \ by Heiner Steven\n#+ as a workaround in those situations when a redirect loop\n\
    #+ runs as a subshell, and therefore variables inside the loop\n#  +do not keep\
    \ their values upon loop termination.\n\n\nif [ -z \"$1\" ]\nthen\n  Filename=names.data\
    \      # Default, if no filename specified.\nelse\n  Filename=$1\nfi\n\n\nexec\
    \ 3<&0                 # Save stdin to file descriptor 3.\nexec 0<\"$Filename\"\
    \        # Redirect standard input.\n\ncount=0\necho\n\n\nwhile [ \"$name\" !=\
    \ Smith ]\ndo\n  read name                # Reads from redirected stdin ($Filename).\n\
    \  echo $name\n  let \"count += 1\"\ndone <\"$Filename\"          # Loop reads\
    \ from file $Filename.\n#    ^^^^^^^^^^^^\n\n\nexec 0<&3                 # Restore\
    \ old stdin.\nexec 3<&-                 # Close temporary fd 3.\n\necho; echo\
    \ \"$count names read\"; echo\n\nexit 0\n```"
