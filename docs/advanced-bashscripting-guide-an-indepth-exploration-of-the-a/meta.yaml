  md: "# Advanced Bash-Scripting Guide\n\n```\n# Written by Stephane Chazelas,\n#\
    \ and modified by the document author.\n\nINTERVAL=5                # timeout\
    \ interval\n\ntimedout_read() {\n  timeout=$1\n  varname=$2\n  old_tty_settings=`stty\
    \ -g`\n  stty -icanon min 0 time ${timeout}0\n  eval read $varname      # or just\
    \   read $varname\n  stty \"$old_tty_settings\"\n  # See man page for \"stty\"\
    .\n}\n\necho; echo -n \"What's your name? Quick! \"\ntimedout_read $INTERVAL your_name\n\
    \n# This may not work on every terminal type.\n# The maximum timeout depends on\
    \ the terminal.\n# (it is often 25.5 seconds).\n\necho\n\nif [ ! -z \"$your_name\"\
    \ ]  # If name input before timeout...\nthen\n  echo \"Your name is $your_name.\"\
    \nelse\n  echo \"Timed out.\"\nfi\n\necho\n\n# The behavior of this script differs\
    \ somewhat from \"timed-input.sh\".\n# At each keystroke, the counter resets.\n\
    \nexit 0\n```\n\nPerhaps the simplest method is using the `-t` option to [read](#).\n\
    \n# Example 9-4. Timed read\n\n```\n#!/bin/bash\n# t-out.sh (per a suggestion\
    \ by \"syngin seven)\n\nTIMELIMIT=4       # 4 seconds\n\nread -t $TIMELIMIT variable\
