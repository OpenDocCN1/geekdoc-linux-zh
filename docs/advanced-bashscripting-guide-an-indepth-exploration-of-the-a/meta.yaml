  md: '# Advanced Bash–Scripting Guide


    Sed determines which lines of its input that it will operate on from the *address
    range* passed to it. [65] Specify this address range either by line number or
    by a pattern to match. For example, *3d* signals sed to delete line 3 of the input,
    and */windows/d* tells sed that you want every line of the input containing a
    match to "windows" deleted.


    Of all the operations in the sed toolkit, we will focus primarily on the three
    most commonly used ones. These are **printing** (to *stdout*), **deletion**, and
    **substitution**.


    # Table B–1. Basic sed operators


    | Operator | Name | Effect |

    |---|---|---|

    | [address-range]/p | print | Print [specified address range] |

    | [address-range]/d | delete | Delete [specified address range] |

    | s/pattern1/pattern2/ | substitute | Substitute pattern2 for first instance of
    pattern1 in a line |

    | [address-range]/s/pattern1/pattern2/ | substitute | Substitute pattern2 for
    first instance of pattern1 in a line, over *address-range* |

    | [address-range]/y/pattern1/pattern2/ | transform | replace any character in
    pattern1 with the corresponding character in pattern2, over *address-range* (equivalent
    of *tr*) |

    | g | global | Operate on *every* pattern match within each matched line of input
    |


    > Unless the *g* (*global*) operator is appended to a *substitute* command, the
    substitution operates only on the first instance of a pattern match within each
    line.


    From the command line and in a shell script, a sed operation may require quoting
    and certain options.


    ```

    sed -e ''/^$/d'' $filename

    # The -e option causes the next string to be interpreted as an editing instruction.

    #  (If passing only a single instruction to "sed", the "-e" is optional.)

    #  The "strong" quotes ('''') protect the RE characters in the instruction

    #+ from reinterpretation as special characters by the body of the script.

    # (This reserves RE expansion of the instruction for sed.)

    #

    # Operates on the text contained in file $filename.

    ```'
