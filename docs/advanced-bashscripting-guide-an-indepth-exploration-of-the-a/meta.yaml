    \ UNIX text file is \\\"$NEWFILENAME\\\".\"\n\nexit 0\n```\n\n# Example 12–17.\
    \ rot13: rot13, ultra–weak encryption.\n\n```\n#!/bin/bash\n# rot13.sh: Classic\
