  md: "Advanced Bash–Scripting Guide\n\n```\nThis is the last line of the message.\n\
    ----------------------------------------\"\n# However, text may not include double\
    \ quotes unless they are escaped.\n```\n\nThe – option to mark a here document\
    \ limit string (`<<-LimitString`) suppresses tabs (but not spaces) in the output.\
    \ This may be useful in making a script more readable.\n\n# Example 17–4. Multi–line\
    \ message, with tabs suppressed\n\n```\n#!/bin/bash\n# Same as previous example,\
    \ but...\n\n#  The - option to a here document <<-  \n#  suppresses tabs in the\
    \ body of the document, but *not* spaces.\n\ncat <<-ENDOFMESSAGE\n\tThis is line\
    \ 1 of the message.\n\tThis is line 2 of the message.\n\tThis is line 3 of the\
    \ message.\n\tThis is line 4 of the message.\n\tThis is the last line of the message.\n\
    ENDOFMESSAGE\n# The output of the script will be flush left.\n# Leading tab in\
    \ each line will not show.\n\n# Above 5 lines of \"message\" prefaced by a tab,\
    \ not spaces.\n# Spaces not affected by  <<-  .\n\nexit 0\n```\n\nA here document\
    \ supports parameter and command substitution. It is therefore possible to pass\
    \ different parameters to the body of the here document, changing its output accordingly.\n\
    \n# Example 17–5. Here document with parameter substitution\n\n```\n#!/bin/bash\n\
    # Another 'cat' here document, using parameter substitution.\n\n# Try it with\
    \ no command line parameters,    ./scriptname\n# Try it with one command line\
    \ parameter,    ./scriptname Mortimer\n# Try it with one two-word quoted command\
    \ line parameter,\n#                                        ./scriptname \"Mortimer\
    \ Jones\"\n\nCMDLINEPARAM=1     # Expect at least command line parameter.\n\n\
    if [ $# -ge $CMDLINEPARAM ]\nthen\n  NAME=$1          # If more than one command\
    \ line param,\n                   # then just take the first.\nelse\n  NAME=\"\
    John Doe\"  # Default, if no command line parameter.\nfi\n\nRESPONDENT=\"the author\
    \ of this fine script\"\n```"
