  md: "# Advanced Bash-Scripting Guide\n\nOriginally a port from IRIX to Red Hat Linux,\
    \ **chkconfig** may not be part of the core installation of some Linux flavors.\n\
    \n```\nbash$ chkconfig --list\natd           0:off   1:off   2:off   3:on    4:on\
    \    5:on    6:off\n rwhod        0:off   1:off   2:off   3:off   4:off   5:off\
    \   6:off\n...\n```\n\n# *tcpdump*\n\nNetwork packet \"sniffer\". This is a tool\
    \ for analyzing and troubleshooting traffic on a network by dumping packet headers\
    \ that match specified criteria.\n\nDump ip packet traffic between hosts *bozoville*\
    \ and *caduceus*:\n\n```\nbash$ tcpdump ip host bozoville and caduceus\n```\n\n\
    Of course, the output of **tcpdump** can be parsed, using certain of the previously\
    \ discussed [text processing utilities](link).\n\n# Filesystem\n\n# *mount*\n\n\
    Mount a filesystem, usually on an external device, such as a floppy or CDROM.\
    \ The file `/etc/fstab` provides a handy listing of available filesystems, partitions,\
    \ and devices, including options, that may be automatically or manually mounted.\
    \ The file `/etc/mtab` shows the currently mounted filesystems and partitions\
    \ (including the virtual ones, such as `/proc`).\n\n**mount -a** mounts all filesystems\
    \ and partitions listed in `/etc/fstab`, except those with a `noauto` option.\
    \ At bootup, a startup script in `/etc/rc.d` (`rc.sysinit` or something similar)\
    \ invokes this to get everything mounted.\n\n```\nmount -t iso9660 /dev/cdrom\
    \ /mnt/cdrom\n# Mounts CDROM\nmount /mnt/cdrom\n# Shortcut, if /mnt/cdrom listed\
    \ in /etc/fstab\n```\n\nThis versatile command can even mount an ordinary file\
    \ on a block device, and the file will act as if it were a filesystem. **Mount**\
    \ accomplishes that by associating the file with a [loopback device](link). One\
    \ application of this is to mount and examine an ISO9660 image before burning\
    \ it onto a CDR. [[40]](link)\n\n# Example 13-5. Checking a CD image\n\n```\n\
    # As root...\n\nmkdir /mnt/cdtest  # Prepare a mount point, if not already there.\n\
    \nmount -r -t iso9660 -o loop cd-image.iso /mnt/cdtest   # Mount the image.\n\
    #                    \"-o loop\" option equivalent to \"losetup /dev/loop0\"\n\
    cd /mnt/cdtest       # Now, check the image.\n```"
