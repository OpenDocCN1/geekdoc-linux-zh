  md: "These are similar to the Bash comparison operators `&&` and `\\|\\|`, used\
    \ within [double brackets](double brackets).\n\n```\n[[ condition1 && condition2\
    \ ]]\n```\n\nThe **-o** and **-a** operators work with the **test** command or\
    \ occur within single test brackets.\n\n```\nif [ \"$exp1\" -a \"$exp2\" ]\n```\n\
    \nRefer to [Example 8-3](Example 8-3) and [Example 26-8](Example 26-8) to see\
    \ compound comparison operators in action.\n\n# 7.4. Nested if/then Condition\
    \ Tests\n\nCondition tests using the `if/then` construct may be nested. The net\
    \ result is identical to using the `&&` compound comparison operator above.\n\n\
    ```\nif [ condition1 ]\nthen\n  if [ condition2 ]\n  then\n    do-something  #\
    \ But only if both \"condition1\" and \"condition2\" valid.\n  fi\nfi\n```\n\n\
    See [Example 35-4](Example 35-4) for an example of nested *if/then* condition\
    \ tests.\n\n# 7.5. Testing Your Knowledge of Tests\n\nThe systemwide `xinitrc`\
    \ file can be used to launch the X server. This file contains quite a number of\
    \ *if/then* tests, as the following excerpt shows.\n\n```\nif [ -f $HOME/.Xclients\
    \ ]; then\n  exec $HOME/.Xclients\nelif [ -f /etc/X11/xinit/Xclients ]; then\n\
    \  exec /etc/X11/xinit/Xclients\nelse\n    # failsafe settings.  Although we should\
    \ never get here\n    # (we provide fallbacks in Xclients as well) it can't hurt.\n\
    \    xclock -geometry 100x100-5+5 &\n    xterm -geometry 80x50-50+150 &\n    if\
    \ [ -f /usr/bin/netscape -a -f /usr/share/doc/HTML/index.html ]; then\n      \
    \      netscape /usr/share/doc/HTML/index.html &\n    fi\nfi\n```\n\nExplain the\
    \ \"test\" constructs in the above excerpt, then examine the entire file, `/etc/X11/xinit/xinitrc`,\
    \ and analyze the *if/then* test constructs there. You may need to refer ahead\
    \ to the discussions of [grep](grep), [sed](sed), and [regular expressions](regular\
    \ expressions)."
