    # mkfifo


    This obscure command creates a *named pipe*, a temporary *first-in-first-out buffer*
    for transferring data between processes. [35] Typically, one process writes to
    the FIFO, and the other reads from it. See [Example A-13](Example A-13).


    # pathchk


    This command checks the validity of a filename. If the filename exceeds the maximum
    allowable length (255 characters) or one or more of the directories in its path
    is not searchable, then an error message results. Unfortunately, **pathchk** does
    not return a recognizable error code, and it is therefore pretty much useless
    in a script.


    # dd


    This is the somewhat obscure and much feared "data duplicator" command. Originally
    a utility for exchanging data on magnetic tapes between UNIX minicomputers and
    IBM mainframes, this command still has its uses. The **dd** command simply copies
    a file (or stdin/stdout), but with conversions. Possible conversions are ASCII/EBCDIC,
    [36] upper/lower case, swapping of byte pairs between input and output, and skipping
    and/or truncating the head or tail of the input file. A **dd --help** lists the
    conversion and other options that this powerful utility takes.


    ```

    # Exercising ''dd''.


    n=3

    p=5

    input_file=project.txt

    output_file=log.txt


    dd if=$input_file of=$output_file bs=1 skip=$((n-1)) count=$((p-n+1)) 2> /dev/null

    # Extracts characters n to p from file $input_file.



    echo -n "hello world" | dd cbs=1 conv=unblock 2> /dev/null

    # Echoes "hello world" vertically.



    # Thanks, S.C.

    ```


    To demonstrate just how versatile **dd** is, let''s use it to capture keystrokes.


    **Example 12-35. Capturing Keystrokes**'
