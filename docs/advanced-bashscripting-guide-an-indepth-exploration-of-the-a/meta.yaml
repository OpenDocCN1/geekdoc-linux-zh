    The escape also provides a means of writing a multi–line command. Normally, each
    separate line constitutes a different command, but an escape at the end of a line
    *escapes the newline character*, and the command sequence continues on to the
    next line.


    ```

    (cd /source/directory && tar cf - . ) | \

    (cd /dest/directory && tar xpvf -)

    # Repeating Alan Cox''s directory tree copy command,

    # but split into two lines for increased legibility.


    # As an alternative:

    tar cf - -C /source/directory |

    tar xpvf - -C /dest/directory

    # See note below.

    # (Thanks, Stephane Chazelas.)

    ```


    ![](bbox=[0.26, 0.36, 0.31, 0.388])


    > If a script line ends with a |, a pipe character, then a \\, an escape, is not
    strictly necessary. It is, however, good programming practice to always escape
    the end of a line of code that continues to the following line.


    ```

    echo "foo

    bar"

    #foo

    #bar


    echo


    echo ''foo

    bar''     # No difference yet.

    #foo

    #bar


    echo


    echo foo\

    bar     # Newline escaped.

    #foobar


    echo


    echo "foo\

    bar"     # Same here, as \ still interpreted as escape within weak quotes.

    #foobar


    echo


    echo ''foo\

    bar''     # Escape character \ taken literally because of strong quoting.

    #foor\

    #bar


    # Examples suggested by Stephane Chazelas.

