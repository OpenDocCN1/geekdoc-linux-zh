    This, in effect, creates an "anonymous" here document.


    # Example 17–8. "Anonymous" Here Document


    ```

    #!/bin/bash


    : <<TESTVARIABLES

    ${HOSTNAME?}${USER?}${MAIL?}   # Print error message if one of the variables not
    set.

    TESTVARIABLES

