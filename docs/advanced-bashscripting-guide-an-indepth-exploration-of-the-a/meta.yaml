  md: "```\nfor i      # ==> in [list] missing...\ndo       # ==> so operates on command\
    \ line arg(s).\n    case \"$i\" in\n        0b*)              ibase=2;;      \
    \ # binary\n        0x*|[a-f]*|[A-F]*) ibase=16;;     # hexadecimal\n        0*)\
    \               ibase=8;;       # octal\n        [1-9]*)           ibase=10;;\
    \      # decimal\n        *)\n            Msg \"illegal number $i - ignored\"\n\
    \            continue;;\n    esac\n\n    # Remove prefix, convert hex digits to\
    \ uppercase (bc needs this)\n    number=`echo \"$i\" | sed -e 's:^0[bBxX]::' |\
    \ tr '[a-f]' '[A-F]'`\n    # ==> Uses \":\" as sed separator, rather than \"/\"\
    .\n\n    # Convert number to decimal\n    dec=`echo \"ibase=$ibase; $number\"\
    \ | bc`  # ==> 'bc' is calculator utility.\n    case \"$dec\" in\n        [0-9]*)\
    \    ;;                     # number ok\n        *)         continue;;       \
    \     # error: ignore\n    esac\n\n    # Print all conversions in one line.\n\
    \    # ==> 'here document' feeds command list to 'bc'.\n    echo `bc <<!\n   \
