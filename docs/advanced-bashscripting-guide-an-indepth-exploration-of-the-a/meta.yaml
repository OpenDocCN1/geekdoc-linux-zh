    # 9.3. Parameter Substitution


    Manipulating and/or expanding variables


    # ${parameter}


    Same as $parameter, i.e., value of the variable parameter. In certain contexts,
    only the less ambiguous ${parameter} form works.


    May be used for concatenating variables with strings.


    ```

    your_id=${USER}-on-${HOSTNAME}

    echo "$your_id"

    #

    echo "Old \$PATH = $PATH"

    PATH=${PATH}:/opt/bin  #Add /opt/bin to $PATH for duration of script.

    echo "New \$PATH = $PATH"

    ```


    # ${parameter-default}


    If parameter not set, use default.


    ```

    echo ${username-`whoami`}

    # Echoes the result of `whoami`, if variable $username is still unset.

    ```


    This is almost equivalent to ${parameter:-default}. The extra : makes a difference
    only when parameter has been declared, but is null.


    ```

    #!/bin/bash


    username0=

    # username0 has been declared, but is set to null.

    echo "username0 = ${username0-`whoami`}"

    # Will not echo.


    echo "username1 = ${username1-`whoami`}"

    # username1 has not been declared.

    # Will echo.


    username2=

    # username2 has been declared, but is set to null.

    echo "username2 = ${username2:-`whoami`}"

    # Will echo because of :- rather than just - in condition test.

    ```'
