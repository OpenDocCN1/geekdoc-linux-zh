  md: '# # Chapter 6. Quoting


    Quoting means just that, bracketing a string in quotes. This has the effect of
    protecting special characters in the string from reinterpretation or expansion
    by the shell or shell script. (A character is "special" if it has an interpretation
    other than its literal meaning, such as the wild card character, *.)


    ```

    bash$ ls -l [Vv]*

    -rw-rw-r-- 1 bozo bozo 324 Apr 2 15:05 VIEWDATA.BAT

    -rw-rw-r-- 1 bozo bozo 507 May 4 14:25 vartrace.sh

    -rw-rw-r-- 1 bozo bozo 539 Apr 14 17:11 viewdata.sh


    bash$ ls -l ''[Vv]*''

    ls: [Vv]*: No such file or directory

    ```


    Certain programs and utilities can still reinterpret or expand special characters
    in a quoted string. This is an important use of quoting, protecting a command-line
    parameter from the shell, but still letting the calling program expand it.


    ```

    bash$ grep ''[Ff]irst'' *.txt

    file1.txt:This is the first line of file1.txt.

    file2.txt:This is the First line of file2.txt.

    ```


    Of course, `grep [Ff]irst *.txt` would not work.


    When referencing a variable, it is generally advisable in enclose it in double
    quotes (" "). This preserves all special characters within the variable name,
    except $, ` (backquote), and \\ (escape). Keeping $ as a special character permits
    referencing a quoted variable (`"$variable"`), that is, replacing the variable
    with its value (see Example 5-1, above).


    Use double quotes to prevent word splitting. [14] An argument enclosed in double
    quotes presents itself as a single word, even if it contains whitespace separators.


    ```

    variable1="a variable containing five words"

    COMMAND This is $variable1 # Executes COMMAND with 7 arguments:

    # "This" "is" "a" "variable" "containing" "five" "words"


    COMMAND "This is $variable1" # Executes COMMAND with 1 argument:

    # "This is a variable containing five words"


    variable2="" # Empty.


    COMMAND $variable2 $variable2 $variable2 # Executes COMMAND with no arguments.

    COMMAND "$variable2" "$variable2" "$variable2" # Executes COMMAND with 3 empty
    arguments.

    COMMAND "$variable2 $variable2 $variable2" # Executes COMMAND with 1 argument
    (2 spaces).


    # Thanks, S.C.

    ```


    Enclosing the arguments to an **echo** statement in double quotes is necessary
    only when word splitting is an issue.'
