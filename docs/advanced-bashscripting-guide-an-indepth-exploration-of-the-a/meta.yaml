    \ filename\n# or     ./rot13.sh <filename\n# or     ./rot13.sh and supply keyboard\
    \ input (stdin)\n\ncat \"$@\" | tr 'a-zA-Z' 'n-za-mN-ZA-M'  # \"a\" goes to \"\
