  md: "# # Chapter 3. Exit and Exit Status\n\n> ...there are dark corners in the Bourne\
    \ shell, and people use all of them.\n*Chet Ramey*\n\nThe **exit** command may\
    \ be used to terminate a script, just as in a C program. It can also return a\
    \ value, which is available to the script's parent process.\n\nEvery command returns\
    \ an *exit status* (sometimes referred to as a *return status*). A successful\
    \ command returns a 0, while an unsuccessful one returns a non-zero value that\
    \ usually may be interpreted as an error code. Well-behaved UNIX commands, programs,\
    \ and utilities return a 0 exit code upon successful completion, though there\
    \ are some exceptions.\n\nLikewise, functions within a script and the script itself\
    \ return an exit status. The last command executed in the function or script determines\
    \ the exit status. Within a script, an **exit *nnn*** command may be used to deliver\
    \ an *nnn* exit status to the shell (*nnn* must be a decimal number in the 0 –\
    \ 255 range).\n\n> When a script ends with an **exit** that has no parameter,\
    \ the exit status of the script is the exit status of the last command executed\
    \ in the script (*not* counting the **exit**).\n\n$? reads the exit status of\
    \ the last command executed. After a function returns, $? gives the exit status\
    \ of the last command executed in the function. This is Bash's way of giving functions\
    \ a \"return value\". After a script terminates, a $? from the command line gives\
    \ the exit status of the script, that is, the last command executed in the script,\
    \ which is, by convention, 0 on success or an integer in the range 1 – 255 on\
    \ error.\n\n# ## Example 3-1. exit / exit status\n\n```\n#!/bin/bash\n\necho hello\n\
    echo $?    # Exit status 0 returned because command executed successfully.\n\n\
    lskdf      # Unrecognized command.\necho $?    # Non-zero exit status returned\
    \ because command failed to execute.\n\necho\n\nexit 113   # Will return 113 to\
    \ shell.\n           # To verify this, type \"echo $?\" after script terminates.\n\
    \n# By convention, an 'exit 0' indicates success,\n#+ while a non-zero exit value\
    \ means an error or anomalous condition.\n```\n\n**$?** is especially useful for\
    \ testing the result of a command in a script (see Example 12-8 and Example 12-13)."
