    \ not appear in $ERRORFILE.\n# These redirection commands also automatically \"\
    reset\" after each line.\n#===================================================================\n\
    ```\n\n```\n2>&1\n    # Redirects stderr to stdout.\n    # Error messages get\
    \ sent to same place as standard output.\n```\n\n```\ni>&j\n    # Redirects file\
    \ descriptor i to j.\n    # All output of file pointed to by i gets sent to file\
    \ pointed to by j.\n```\n\n```\n>&j\n    # Redirects, by default, file descriptor\
    \ 1 (stdout) to j.\n    # All stdout gets sent to file pointed to by j.\n```\n\
    \n```\n0<\n<\n    # Accept input from a file.\n    # Companion command to \">\"\
    , and often used in combination with it.\n    #\n    # grep search-word <filename\n\
    ```\n\n```\n[j]<>filename\n    # Open file \"filename\" for reading and writing,\
    \ and assign file descriptor \"j\" to it.\n    # If \"filename\" does not exist,\
    \ create it.\n    # If file descriptor \"j\" is not specified, default to fd 0,\
    \ stdin.\n    #\n    # An application of this is writing at a specified place\
    \ in a file.\n    echo 1234567890 > File    # Write string to \"File\".\n    exec\
    \ 3<> File             # Open \"File\" and assign fd 3 to it.\n    read -n 4 <&3\
    \             # Read only 4 characters.\n    echo -n . >&3             # Write\
    \ a decimal point there.\n    exec 3>&-                 # Close fd 3.\n    cat\
    \ File                  # ==> 1234.67890\n    # Random access, by golly.\n```\n\
    \n```\n|\n    # Pipe.\n    # General purpose process and command chaining tool.\n\
    \    # Similar to \">\", but more general in effect.\n    # Useful for chaining\
    \ commands, scripts, files, and programs together.\n    cat *.txt | sort | uniq\
    \ > result-file\n    # Sorts the output of all the .txt files and deletes duplicate\
    \ lines,\n    # finally saves results to \"result-file\".\n```\n\nMultiple instances\
    \ of input and output redirection and/or pipes can be combined in a single command\
    \ line.\n\n```\ncommand < input-file > output-file\n```\n\n```\ncommand1 | command2\
    \ | command3 > output-file\n```"
