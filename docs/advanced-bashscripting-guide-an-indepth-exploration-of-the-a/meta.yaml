    \ one controls loop.\n# The *last* exit status is the one that counts.\ndo\necho\
    \ \"Input variable #1 (end to exit) \"\n  read var1\n  echo \"variable #1 = $var1\"\
    \ndone\n\n# Try to figure out how this all works.\n# It's a wee bit tricky.\n\n\
    exit 0\n```\n\nAs with a **for** loop, a **while** loop may employ C-like syntax\
    \ by using the double parentheses construct (see also [Example 9–25](#)).\n\n\
    # Example 10–17. C-like syntax in a while loop\n\n```\n#!/bin/bash\n# wh-loopc.sh:\
    \ Count to 10 in a \"while\" loop.\n\nLIMIT=10\na=1\n\nwhile [ \"$a\" -le $LIMIT\
    \ ]\ndo\n  echo -n \"$a \"\n  let \"a+=1\"\ndone         # No surprises, so far.\n\
    \necho; echo\n\n# +=============================================================+\n\
    \n# Now, repeat with C-like syntax.\n\n((a = 1))     # a=1\n# Double parentheses\
    \ permit space when setting a variable, as in C.\n\nwhile (( a <= LIMIT ))   #\
