    bash$ **pr -options file1.txt** | **lp**\n```\n\nFormatting packages, such as\
    \ **groff** and *Ghostscript* may send their output directly to **lp**.\n\n```\n\
    bash$ **groff -Tascii file.tr** | **lp**\n```\n\n```\nbash$ **gs -options** |\
    \ **lp file.ps**\n```\n\nRelated commands are **lpq**, for viewing the print queue,\
    \ and **lprm**, for removing jobs from the print queue.\n\n# tee\n\n[UNIX borrows\
    \ an idea here from the plumbing trade.]\n\nThis is a redirection operator, but\
    \ with a difference. Like the plumber's *tee*, it permits \"siphoning off\" the\
    \ output of a command or commands within a pipe, but without affecting the result.\
    \ This is useful for printing an ongoing process to a file or paper, perhaps to\
    \ keep track of it for debugging purposes.\n\n```\n                          tee\n\
    \             |------> to file\n```"
