    \ normally pass only value parameters to functions. [51] Variable names (which\
    \ are actually pointers), if passed as parameters to functions, will be treated\
    \ as string literals and cannot be dereferenced. *Functions interpret their arguments\
    \ literally.*\n\n# Exit and Return\n\n**_exit status_**\n\nFunctions return a\
    \ value, called an *exit status*. The exit status may be explicitly specified\
    \ by a **return** statement, otherwise it is the exit status of the last command\
    \ in the function (0 if successful, and a non–zero error code if not). This [exit\
    \ status](exit status) may be used in the script by referencing it as **_$?**.\
    \ This mechanism effectively permits script functions to have a \"return value\"\
    \ similar to C functions.\n\n**_return_**\n\nTerminates a function. A **return**\
    \ command [52] optionally takes an *integer* argument, which is returned to the\
    \ calling script as the \"exit status\" of the function, and this exit status\
    \ is assigned to the variable **_$?**.\n\n# Example 23–3. Maximum of two numbers\n\
    \n```\n#!/bin/bash\n# max.sh: Maximum of two integers.\n\nE_PARAM_ERR=-198   \
    \ # If less than 2 params passed to function.\nEQUAL=-199          # Return value\
    \ if both params equal.\n\nmax2 ()             # Returns larger of two numbers.\n\
    {                   # Note: numbers compared must be less than 257.\nif [ -z \"\
    $2\" ]\nthen\n  return $E_PARAM_ERR\nfi\n```"
