    # 9.4. Typing variables: declare or typeset


    The **declare** or **typeset** [builtins](https://tldp.org/LDP/abs/html/declareref.html)
    (they are exact synonyms) permit restricting the properties of variables. This
    is a very weak form of the typing available in certain programming languages.
    The **declare** command is specific to version 2 or later of Bash. The **typeset**
    command also works in ksh scripts.


    **declare/typeset options**


    *-r readonly*


    ```

    declare -r var1

    ```


    (`declare -r var1` works the same as `readonly var1`)


    This is the rough equivalent of the C **const** type qualifier. An attempt to
    change the value of a readonly variable fails with an error message.


    *-i integer*


    ```

    declare -i number

    # The script will treat subsequent occurrences of "number" as an integer.


    number=3

    echo "number = $number"    # number = 3


    number=three

    echo "number = $number"    # number = 0

    # Tries to evaluate "three" as an integer.

    ```


    Note that certain arithmetic operations are permitted for declared integer variables
    without the need for [expr](https://tldp.org/LDP/abs/html/expr.html) or [let](https://tldp.org/LDP/abs/html/let.html).


    *-a array*


    ```

    declare -a indices

    ```


    The variable `indices` will be treated as an array.


    *-f functions*


    ```

    declare -f

    ```


    A `declare -f` line with no arguments in a script causes a listing of all the
    functions previously defined in that script.


    ```

    declare -f function_name

    ```


    A `declare -f function_name` in a script lists just the function named.


    *-x [export](https://tldp.org/LDP/abs/html/export.html)*'
