  md: "# # Chapter 32. Gotchas\n\n> *Turandot: Gli enigmi sono tre, la morte una!*\n\
    \n*Caleph: No, no! Gli enigmi sono tre, una la vita!*\n\n*Puccini*\n\nAssigning\
    \ reserved words or characters to variable names.\n\n```\ncase=value0       #\
    \ Causes problems.\n23skidoo=value1   # Also problems.\n# Variable names starting\
    \ with a digit are reserved by the shell.\n# Try _23skidoo=value1. Starting variables\
    \ with an underscore is o.k.\n\n# However...     using just the underscore will\
    \ not work.\n_=25\necho $_           # $_ is a special variable set to last arg\
    \ of last command.\n\nxyz((!*value2     # Causes severe problems.\n```\n\nUsing\
    \ a hyphen or other reserved characters in a variable name.\n\n```\nvar-1=23\n\
    # Use 'var_1' instead.\n```\n\nUsing the same name for a variable and a function.\
    \ This can make a script difficult to understand.\n\n```\ndo_something ()\n{\n\
    \  echo \"This function does something with \\\"$1\\\".\"\n}\n\ndo_something=do_something\n\
    \ndo_something do_something\n\n# All this is legal, but highly confusing.\n```\n\
    \nUsing [whitespace](https://...) inappropriately (in contrast to other programming\
    \ languages, Bash can be quite finicky about whitespace).\n\n```\nvar1 = 23  \
    \ # 'var1=23' is correct.\n# On line above, Bash attempts to execute command \"\
    var1\"\n# with the arguments \"=\" and \"23\".\n\nlet c = $a - $b   # 'let c=$a-$b'\
    \ or 'let \"c = $a - $b\"' are correct.\n\nif [ $a -le 5 ]   # if [ $a -le 5 ]\
    \  is correct.\n# if [ \"$a\" -le 5 ]  is even better.\n# [[ $a -le 5 ]] also\
    \ works.\n```\n\nAssuming uninitialized variables (variables before a value is\
    \ assigned to them) are \"zeroed out\". An uninitialized variable has a value\
    \ of \"null\", *not* zero."
