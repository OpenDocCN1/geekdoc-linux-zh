    > Here documents create temporary files, but these files are deleted after opening
    and are not accessible to any other process.


    ```

    bash$ bash -c ''lsof -a -p $$ -d0'' << EOF

    > EOF

    lsof    1213 bozo   0r   REG   3,5    0 30386 /tmp/t1213-0-sh (deleted)

    ```


    Some utilities will not work inside a *here document*.


    For those tasks too complex for a "here document", consider using the **expect**
    scripting language, which is specifically tailored for feeding input into interactive
    programs.'
