  md: "# Advanced Bash–Scripting Guide\n\n```\n    # Beginning of inner loop.\n  \
    \  for b in 1 2 3 4 5\n    do\n      echo \"Pass $inner in inner loop.\"\n   \
    \   let \"inner+=1\"  # Increment inner loop counter.\n    done\n    # End of\
    \ inner loop.\n\n    let \"outer+=1\"    # Increment outer loop counter.\n   \
    \ echo              # Space between output in pass of outer loop.\n  done\n  #\
    \ End of outer loop.\n\n  exit 0\n```\n\nSee [Example 26-4](http://tldp.org/LDP/abs/html/example26-4.html)\
    \ for an illustration of nested \"while\" loops, and [Example 26-5](http://tldp.org/LDP/abs/html/example26-5.html)\
    \ to see a \"while\" loop nested inside an \"until\" loop.\n\n# 10.3. Loop Control\n\
    \nCommands Affecting Loop Behavior\n\n*break, continue*\n\nThe **break** and **continue**\
    \ loop control commands [[22]](http://tldp.org/LDP/abs/html/loopcontrol.html#FTNN.ANCHOR22)\
    \ correspond exactly to their counterparts in other programming languages. The\
    \ **break** command terminates the loop (breaks out of it), while **continue**\
    \ causes a jump to the next iteration of the loop, skipping all the remaining\
    \ commands in that particular loop cycle.\n\n**Example 10–20. Effects of break\
    \ and continue in a loop**\n\n```\n#!/bin/bash\n\nLIMIT=19  # Upper limit\n\n\
    echo\necho \"Printing Numbers 1 through 20 (but not 3 and 11).\"\n\na=0\n\nwhile\
    \ [ $a -le \"$LIMIT\" ]\ndo\n  a=$(($a+1))\n\n  if [ \"$a\" -eq 3 ] || [ \"$a\"\
    \ -eq 11 ]  # Excludes 3 and 11\n  then\n    continue  # Skip rest of this particular\
    \ loop iteration.\n  fi\n\n  echo -n \"$a \"\ndone\n\n# Exercise:\n# Why does\
    \ loop print up to 20?\n```"
  merge: -1
