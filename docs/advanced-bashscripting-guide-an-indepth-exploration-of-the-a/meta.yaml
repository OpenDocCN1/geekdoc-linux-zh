  md: '# Advanced Bash–Scripting Guide


    This is an alternate method of specifying a range of characters to match.


    +   - `[[:alnum:]]` matches alphabetic or numeric characters. This is equivalent
    to `[A-Za-z0-9]`.

    - `[[:alpha:]]` matches alphabetic characters. This is equivalent to `[A-Za-z]`.

    - `[[:blank:]]` matches a space or a tab.

    - `[[:cntrl:]]` matches control characters.

    - `[[:digit:]]` matches (decimal) digits. This is equivalent to `[0-9]`.

    - `[[:graph:]]` (graphic printable characters). Matches characters in the range
    of ASCII 33 – 126. This is the same as `[[:print:]]`, below, but excluding the
    space character.

    - `[[:lower:]]` matches lowercase alphabetic characters. This is equivalent to
    `[a-z]`.

    - `[[:print:]]` (printable characters). Matches characters in the range of ASCII
    32 – 126. This is the same as `[[:graph:]]`, above, but adding the space character.

    - `[[:space:]]` matches whitespace characters (space and horizontal tab).

    - `[[:upper:]]` matches uppercase alphabetic characters. This is equivalent to
    `[A-Z]`.

    - `[[:xdigit:]]` matches hexadecimal digits. This is equivalent to `[0-9A-Fa-f]`.


    POSIX character classes generally require quoting or [double brackets]([[ ]]).


    ```

    bash$ grep [[:digit:]] test.file

    abc=723

    ```


    These character classes may even be used with [globbing](globbing), to a limited
    extent.


    ```

    bash$ ls -l ?[[:digit:]][[:digit:]]?

    -rw-rw-r--  1 bozo  bozo         0 Aug 21 14:47 a33b

    ```


    To see POSIX character classes used in scripts, refer to [Example 12–14](Example
    12–14) and [Example 12–15](Example 12–15).


    [Sed](Sed), [awk](awk), and [Perl](Perl), used as filters in scripts, take REs
    as arguments when "sifting" or transforming files or I/O streams. See [Example
    A–10](Example A–10) and [Example A–15](Example A–15) for illustrations of this.


    "Sed & Awk", by Dougherty and Robbins gives a very complete and lucid treatment
    of REs (see the [Bibliography](Bibliography)).


    # 19.2. Globbing


    Bash itself cannot recognize Regular Expressions. In scripts, commands and utilities,
    such as [sed](sed) and [awk](awk), interpret RE''s.


    Bash does carry out filename expansion, a process known as "globbing", but this
    does *not* use the standard RE set. Instead, globbing recognizes and expands wildcards.
    Globbing interprets the standard wildcard characters, `*` and `?`, character lists
    in square brackets, and certain other special characters (such as `^` for negating
    the sense of a match). There are some important limitations on wildcard characters
    in globbing, however. Strings containing `*` will not match filenames that start
    with a dot, as, for example, `.bashrc`. [49] Likewise, the `?` has a different
    meaning in globbing than as part of an RE.'
