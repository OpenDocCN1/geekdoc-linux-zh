  md: "# # Chapter 2. Starting Off With a Sha-Bang\n\nIn the simplest case, a script\
    \ is nothing more than a list of system commands stored in a file. At the very\
    \ least, this saves the effort of retyping that particular sequence of commands\
    \ each time it is invoked.\n\n# ## Example 2-1. cleanup: A script to clean up\
    \ the log files in /var/log\n\n```\n# cleanup\n# Run as root, of course.\n\ncd\
    \ /var/log\ncat /dev/null > messages\ncat /dev/null > wtmp\necho \"Logs cleaned\
    \ up.\"\n```\n\nThere is nothing unusual here, just a set of commands that could\
    \ just as easily be invoked one by one from the command line on the console or\
    \ in an xterm. The advantages of placing the commands in a script go beyond not\
    \ having to retype them time and again. The script can easily be modified, customized,\
    \ or generalized for a particular application.\n\n# ## Example 2-2. cleanup: An\
    \ enhanced and generalized version of above script.\n\n```\n#!/bin/bash\n# cleanup,\
    \ version 2\n# Run as root, of course.\n\nLOG_DIR=/var/log\nROOT_UID=0     # Only\
    \ users with $UID 0 have root privileges.\nLINES=50       # Default number of\
    \ lines saved.\nE_XCD=66       # Can't change directory?\nE_NOTROOT=67   # Non-root\
    \ exit error.\n\nif [ \"$UID\" -ne \"$ROOT_UID\" ]\nthen\n  echo \"Must be root\
    \ to run this script.\"\n  exit $E_NOTROOT\nfi\n\nif [ -n \"$1\" ]\n# Test if\
    \ command line argument present (non-empty).\nthen\n  lines=$1\nelse\n  lines=$LINES\
    \ # Default, if not specified on command line.\nfi\n\n#  Stephane Chazelas suggests\
    \ the following,\n#+ as a better way of checking command line arguments,\n#+ but\
    \ this is still a bit advanced for this stage of the tutorial.\n#\n#    E_WRONGARGS=65\
    \  # Non-numerical argument (bad arg format)\n#\n#    case \"$1\" in\n```"
  merge: -1
