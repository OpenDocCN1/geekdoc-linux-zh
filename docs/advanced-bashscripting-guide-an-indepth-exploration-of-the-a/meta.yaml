  md: "# Advanced Bash–Scripting Guide\n\n```\n# Process/system related functions:\n\
    #-----------------------------\n\nfunction my_ps() { ps $@ -u $USER -o pid,%cpu,%mem,bsdtime,command\
    \ ; }\nfunction pp() { my_ps f | awk '!/awk/ && $0~var' var=${1:-\".*\"} ; }\n\
    \n# This function is roughly the same as 'killall' on linux\n# but has no equivalent\
    \ (that I know of) on Solaris\nfunction killps()    # kill by process name\n{\n\
    \    local pid pname sig=\"-TERM\"    # default signal\n    if [ \"$#\" -lt 1\
    \ ] || [ \"$#\" -gt 2 ]; then\n        echo \"Usage: killps [-SIGNAL] pattern\"\
    \n        return;\n    fi\n    if [ $# = 2 ]; then sig=$1 ; fi\n    for pid in\
    \ $(my_ps | awk '!/awk/ && $0~pat { print $1 }' pat=${!#} ) ; do\n        pname=$(my_ps\
    \ | awk '$1~var { print $5 }' var=$pid )\n        if ask \"Kill process $pid <$pname>\
    \ with signal $sig?\"\n            then kill $sig $pid\n        fi\n    done\n\
    }\n\nfunction my_ip()    # get IP adresses\n{\n    MY_IP=$(/sbin/ifconfig ppp0\
    \ | awk '/inet/ { print $2 } ' | sed -e s/addr://)\n    MY_ISP=$(/sbin/ifconfig\
    \ ppp0 | awk '/P-t-P/ { print $3 } ' | sed -e s/P-t-P://)\n}\n\nfunction ii()\
    \    # get current host related info\n{\n    echo -e \"\\nYou are logged on ${RED}$HOST\"\
    \n    echo -e \"\\nAdditionnal information:$NC \" ; uname -a\n    echo -e \"\\\
    n${RED}Users logged on:$NC \" ; w -h\n    echo -e \"\\n${RED}Current date :$NC\
    \ \" ; date\n    echo -e \"\\n${RED}Machine stats :$NC \" ; uptime\n    echo -e\
    \ \"\\n${RED}Memory stats :$NC \" ; free\n    my_ip 2>&- ;\n    echo -e \"\\n${RED}Local\
    \ IP Address :$NC\" ; echo ${MY_IP:-\"Not connected\"}\n    echo -e \"\\n${RED}ISP\
    \ Address :$NC\" ; echo ${MY_ISP:-\"Not connected\"}\n    echo\n}\n\n# Misc utilities:\n\
    \nfunction repeat()          # repeat n times command\n{\n    local i max\n  \
    \  max=$1; shift;\n    for ((i=1; i <= max ; i++)); do  # --> C-like syntax\n\
    \        eval \"$@\";\n    done\n}\n\nfunction ask()\n{\n    echo -n \"$@\" '[y/n]\
    \ ' ; read ans\n    case \"$ans\" in\n        y*|Y*) return 0 ;;\n\n```\n\nAppendix\
    \ G. A Sample .bashrc File\n\n375"
