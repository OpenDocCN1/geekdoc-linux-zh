  md: '# Advanced Bash–Scripting Guide


    This internal variable controls character interpretation in [globbing](https://tldp.org/LDP/abs/html/globbingref.html)
    and pattern matching.


    $LINENO


    This variable is the line number of the shell script in which this variable appears.
    It has significance only within the script in which it appears, and is chiefly
    useful for debugging purposes.


    ```

    last_cmd_arg=$_  # Save it.


    echo "At line number $LINENO, variable \"v1\" = $v1"

    echo "Last command argument processed = $last_cmd_arg"

    ```


    $MACHTYPE


    machine type


    Identifies the system hardware.


    ```

    bash$ echo $MACHTYPE

    i686-debian-linux-gnu

    ```


    $OLDPWD


    old working directory ("OLD–print–working–directory", previous directory you were
    in)


    $OSTYPE


    operating system type


    ```

    bash$ echo $OSTYPE

    linux-gnu

    ```


    $PATH


    path to binaries, usually /usr/bin/, /usr/X11R6/bin/, /usr/local/bin, etc.


    When given a command, the shell automatically does a hash table search on the
    directories listed in the *path* for the executable. The path is stored in the
    environmental variable, $PATH, a list of directories, separated by colons. Normally,
    the system stores the $PATH definition in /etc/profile and/or ~/.bashrc (see [Chapter
    27](https://tldp.org/LDP/abs/html/internalvariables.html)).


    ```

    bash$ echo $PATH

    /bin:/usr/bin:/usr/local/bin:/usr/X11R6/bin:/sbin:/usr/sbin

    ```


    **PATH=${PATH}:/opt/bin** appends the /opt/bin directory to the current path.
    In a script, it may be expedient to temporarily add a directory to the path in
    this way. When the script exits, this restores the original $PATH (a child process,
    such as a script, may not change the environment of the parent process, the shell).


    > The current "working directory", ./, is usually omitted from the $PATH as a
    security measure.


    $PIPESTATUS'
