  md: "The **unexpand** filter converts spaces to tabs. This reverses the effect of\
    \ **expand**.\n\n# **cut**\n\nA tool for extracting fields from files. It is similar\
    \ to the `print $N` command set in **awk**, but more limited. It may be simpler\
    \ to use **cut** in a script than **awk**. Particularly important are the -d (delimiter)\
    \ and -f (field specifier) options.\n\nUsing **cut** to obtain a listing of the\
    \ mounted filesystems:\n\n```\ncat /etc/mtab | cut -d ' ' -f1,2\n```\n\nUsing\
    \ **cut** to list the OS and kernel version:\n\n```\nuname -a | cut -d\" \" -f1,3,11,12\n\
    ```\n\nUsing **cut** to extract message headers from an e-mail folder:\n\n```\n\
    bash$ grep '^Subject:' read-messages | cut -c10-80\nRe: Linux suitable for mission-critical\
    \ apps?\nMAKE MILLIONS WORKING AT HOME!!!\nSpam complaint\nRe: Spam complaint\n\
    ```\n\nUsing **cut** to parse a file:\n\n```\n# List all the users in /etc/passwd.\n\
    \nFILENAME=/etc/passwd\n\nfor user in $(cut -d: -f1 $FILENAME)\ndo\n  echo $user\n\
    done\n\n# Thanks, Oleg Philon for suggesting this.\n```\n\n**`cut -d ' ' -f2,3\
    \ filename`** is equivalent to `awk -F'[ ]' '{ print $2, $3 }' filename`\n\nSee\
    \ also [Example 12–31](http://tldp.org/LDP/abs/html/example12-31.html).\n\n# **paste**\n\
    \nTool for merging together different files into a single, multi-column file.\
    \ In combination with **cut**, useful for creating system log files."
