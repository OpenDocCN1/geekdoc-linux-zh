    \ Bash resembles the `-D` option, but uses [gettext](https://www.gnu.org/software/gettext/)\
    \ \"po\" format.\n\nNow, build a `language.po` file for each language that the\
    \ script will be translated into, specifying the *msgstr*. As an example:\n\n\
