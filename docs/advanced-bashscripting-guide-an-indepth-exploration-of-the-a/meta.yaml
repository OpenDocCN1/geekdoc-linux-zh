  md: "# # Chapter 17. Here Documents\n\nA *here document* uses a special form of\
    \ [I/O redirection](https://tldp.org/LDP/abs/html/io-redirection.html) to feed\
    \ a command script to an interactive program, such as ftp, telnet, or ex. Typically,\
    \ the script consists of a command list to the program, delineated by a limit\
    \ string. The special symbol << precedes the limit string. This has the effect\
    \ of redirecting the output of a file into the program, similar to **interactive-program\
    \ < command-file**, where `command-file` contains\n\n```\ncommand #1\ncommand\
    \ #2\n...\n```\n\nThe \"here document\" alternative looks like this:\n\n```\n\
    #!/bin/bash\ninteractive-program <<LimitString\ncommand #1\ncommand #2\n...\n\
    LimitString\n```\n\nChoose a limit string sufficiently unusual that it will not\
    \ occur anywhere in the command list and confuse matters.\n\nNote that *here documents*\
    \ may sometimes be used to good effect with non-interactive utilities and commands.\n\
    \n# ### Example 17-1. dummyfile: Creates a 2-line dummy file\n\n```\n#!/bin/bash\n\
    \n# Non-interactive use of 'vi' to edit a file.\n# Emulates 'sed'.\n\nE_BADARGS=65\n\
    \nif [ -z \"$1\" ]\nthen\n  echo \"Usage: `basename $0` filename\"\n  exit $E_BADARGS\n\
    fi\n\nTARGETFILE=$1\n\n# Insert 2 lines in file, then save.\n#-----------Begin\
    \ here document--------------#\nvi $TARGETFILE <<x23LimitStringx23\ni\nThis is\
    \ line 1 of the example file.\nThis is line 2 of the example file.\n^[\nZZ\nx23LimitStringx23\n\
    #----------End here document------------------#\n```"
  merge: -1
  pgno: 241
- img_proc: false
  md: "# Advanced Bash–Scripting Guide\n\n```\n#  Note that ^[ above is a literal\
    \ escape\n#+ typed by Control-V <Esc>.\n\n#  Bram Moolenaar points out that this\
    \ may not work with 'vim',\n#+ because of possible problems with terminal interaction.\n\
    \nexit 0\n```\n\nThe above script could just as effectively have been implemented\
    \ with **ex**, rather than **vi**. Here documents containing a list of **ex**\
    \ commands are common enough to form their own category, known as *ex scripts*.\n\
    \n# Example 17–2. broadcast: Sends message to everyone logged in\n\n```\n#!/bin/bash\n\
    \nwall <<zzz23EndOfMessagezzz23\nE-mail your noontime orders for pizza to the\
    \ system administrator.\n    (Add an extra dollar for anchovy or mushroom topping.)\n\
    # Additional message text goes here.\n# Note: Comment lines printed by 'wall'.\n\
    zzz23EndOfMessagezzz23\n\n# Could have been done more efficiently by\n#      \
    \ wall <message-file\n# However, saving a message template in a script saves work.\n\
    \nexit 0\n```\n\n# Example 17–3. Multi-line message using cat\n\n```\n#!/bin/bash\n\
    \n# 'echo' is fine for printing single line messages,\n#  but somewhat problematic\
    \ for for message blocks.\n#  A 'cat' here document overcomes this limitation.\n\
    \ncat <<End-of-message\n-------------------------------------\nThis is line 1\
    \ of the message.\nThis is line 2 of the message.\nThis is line 3 of the message.\n\
    This is line 4 of the message.\nThis is the last line of the message.\n-------------------------------------\n\
    End-of-message\n\nexit 0\n\n#-------------------------------------\n# Code below\
    \ disabled, due to \"exit 0\" above.\n\n# S.C. points out that the following also\
    \ works.\necho \"-------------------------------------\nThis is line 1 of the\
    \ message.\nThis is line 2 of the message.\nThis is line 3 of the message.\nThis\
    \ is line 4 of the message.\n```"
