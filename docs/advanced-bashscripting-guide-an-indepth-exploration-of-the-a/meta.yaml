  md: "# # Chapter 19. Regular Expressions\n\nTo fully utilize the power of shell\
    \ scripting, you need to master Regular Expressions. Certain commands and utilities\
    \ commonly used in scripts, such as `expr`, `sed` and `awk` interpret and use\
    \ REs.\n\n# ## 19.1. A Brief Introduction to Regular Expressions\n\nAn expression\
    \ is a string of characters. Those characters that have an interpretation above\
    \ and beyond their literal meaning are called *metacharacters*. A quote symbol,\
    \ for example, may denote speech by a person, *ditto*, or a meta–meaning for the\
    \ symbols that follow. Regular Expressions are sets of characters and/or metacharacters\
