  md: "This construct tests for a condition at the top of a loop, and keeps looping\
    \ as long as that condition is false (opposite of **while** loop).\n\n```\nuntil\
    \ [condition-is-true]\ndo\n command...\ndone\n```\n\nNote that an **until** loop\
    \ tests for the terminating condition at the top of the loop, differing from a\
    \ similar construct in some programming languages.\n\nAs is the case with for/in\
    \ loops, placing the **do** on the same line as the condition test requires a\
    \ semicolon.\n\n```\nuntil [condition-is-true] ; do\n```\n\n# Example 10–18. until\
    \ loop\n\n```\n#!/bin/bash\n\nuntil [ \"$var1\" = end ] # Tests condition here,\
    \ at top of loop.\ndo\n  echo \"Input variable #1 \"\n  echo \"(end to exit)\"\
    \n  read var1\n  echo \"variable #1 = $var1\"\ndone\n\nexit 0\n```\n\n# 10.2.\
    \ Nested Loops\n\nA nested loop is a loop within a loop, an inner loop within\
    \ the body of an outer one. What happens is that the first pass of the outer loop\
    \ triggers the inner loop, which executes to completion. Then the second pass\
    \ of the outer loop triggers the inner loop again. This repeats until the outer\
    \ loop finishes. Of course, a **break** within either the inner or outer loop\
    \ may interrupt this process.\n\n# Example 10–19. Nested Loop\n\n```\n#!/bin/bash\n\
    # Nested \"for\" loops.\n\nouter=1           # Set outer loop counter.\n\n# Beginning\
    \ of outer loop.\nfor a in 1 2 3 4 5\ndo\n  echo \"Pass $outer in outer loop.\"\
    \n  echo \"---------------------\"\n  inner=1        # Reset inner loop counter.\n\
    ```"
  merge: -1
  pgno: 117
