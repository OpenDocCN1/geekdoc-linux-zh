  md: "# Advanced Bash–Scripting Guide\n\n```\nls -alR \t# List the files in the directory\
    \ tree there.\n\t# And so forth.\n```\n\n# umount\n\nUnmount a currently mounted\
    \ filesystem. Before physically removing a previously mounted floppy or CDROM\
    \ disk, the device must be **umounted**, else filesystem corruption may result.\n\
    \n```\numount /mnt/cdrom\n# You may now press the eject button and safely remove\
    \ the disk.\n```\n\n![](bbox=[0.278, 0.255, 0.323, 0.285])\n\nThe **automount**\
    \ utility, if properly installed, can mount and unmount floppies or CDROM disks\
    \ as they are accessed or removed. On laptops with swappable floppy and CDROM\
    \ drives, this can cause problems, though.\n\n# sync\n\nForces an immediate write\
    \ of all updated data from buffers to hard drive (synchronize drive with buffers).\
    \ While not strictly necessary, a **sync** assures the sys admin or user that\
    \ the data just changed will survive a sudden power failure. In the olden days,\
    \ a **sync; sync** (twice, just to make absolutely sure) was a useful precautionary\
    \ measure before a system reboot.\n\nAt times, you may wish to force an immediate\
    \ buffer flush, as when securely deleting a file (see [Example 12–36] or when\
    \ the lights begin to flicker.\n\n# losetup\n\nSets up and configures [loopback\
    \ devices].\n\n# Example 13–6. Creating a filesystem in a file\n\n```\nSIZE=1000000\
    \  # 1 meg\n\nhead -c $SIZE < /dev/zero > file  # Set up file of designated size.\n\
    losetup /dev/loop0 file           # Set it up as loopback device.\nmke2fs /dev/loop0\
    \                 # Create filesystem.\nmount -o loop /dev/loop0 /mnt     # Mount\
    \ it.\n\n# Thanks, S.C.\n```\n\n# mkswap\n\nCreates a swap partition or file.\
    \ The swap area must subsequently be enabled with **swapon**.\n\n# swapon, swapoff\n\
    \nEnable / disable swap partition or file. These commands usually take effect\
    \ at bootup and shutdown.\n\n# mke2fs\n\nCreate a Linux ext2 filesystem. This\
    \ command must be invoked as root."
