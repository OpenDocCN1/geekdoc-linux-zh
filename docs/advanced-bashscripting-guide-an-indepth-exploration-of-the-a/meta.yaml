  md: '# Advanced Bash–Scripting Guide


    **pipe.** Passes the output of previous command to the input of the next one,
    or to the shell. This is a method of chaining commands together.


    ```

    echo ls -l | sh

    # Passes the output of "echo ls -l" to the shell,

    #+ with the same result as a simple "ls -l".

    ```


    ```

    cat *.lst | sort | uniq

    # Merges and sorts all ".lst" files, then deletes duplicate lines.

    ```


    > A pipe, as a classic method of interprocess communication, sends the `stdout`
    of one process to the `stdin` of another. In a typical case, a command, such as
    `cat` or `echo`, pipes a stream of data to a filter for processing.


    **cat $filename | grep $search_word**


    The output of a command or commands may be piped to a script.


    ```

    #!/bin/bash

    # uppercase.sh : Changes input to uppercase.


    tr ''a-z'' ''A-Z''

    # Letter ranges must be quoted

    #+ to prevent filename generation from single-letter filenames.


    exit 0

    ```


    Now, let us pipe the output of `ls -l` to this script.


    ```

    bash$ ls -l | ./uppercase.sh

    -RW-RW-R--     1 BOZO BOZO       109 APR  7 19:49 1.TXT

    -RW-RW-R--     1 BOZO BOZO       109 APR 14 16:48 2.TXT

    -RW-R--R--     1 BOZO BOZO       725 APR 20 20:56 DATA-FILE

    ```


    The `stdout` of each process in a pipe must be read as the `stdin` of the next.
    If this is not the case, the data stream will *block*, and the pipe will not behave
    as expected.


    ```

    cat file1 file2 | ls -l | sort

    # The output from "cat file1 file2" disappears.

    ```


    A pipe runs as a [child_process](http://tldp.org/LDP/abs/html/intro-process.html),
    and therefore cannot alter script variables.


    ```

    variable="initial_value"

    echo "new_value" | read variable

    echo "variable = $variable"     # variable = initial_value

    ```


    If one of the commands in the pipe aborts, this prematurely terminates execution
    of the pipe. Called a *broken pipe*, this condition sends a [SIGPIPE signal](http://www.linuxdoc.org/HOWTO/mini/SIGPIPE.html).'
