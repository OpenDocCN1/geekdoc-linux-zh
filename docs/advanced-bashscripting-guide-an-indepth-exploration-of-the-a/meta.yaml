  md: "# Advanced Bash–Scripting Guide\n\nThis powerful tool parses command line arguments\
    \ passed to the script. This is the bash analog of the **getopt** library function\
    \ familiar to C programmers. It permits passing and concatenating multiple options\
    \ [25] and associated arguments to a script (for example `scriptname -abc -e /usr/local`).\n\
    \nThe **getopts** construct uses two implicit variables. `$OPTIND` is the argument\
    \ pointer (*OPTION INDEX*) and `$OPTARG` (*OPtion ARGument*) the (optional) argument\
    \ attached to an option. A colon following the option name in the declaration\
    \ tags that option as having an associated argument.\n\nA **getopts** construct\
    \ usually comes packaged in a [while loop](https://tldp.org/LDP/abs/html/while-loop.html),\
    \ which processes the options and arguments one at a time, then decrements the\
    \ implicit $OPTIND variable to step to the next.\n\n+   1. The arguments must\
    \ be passed from the command line to the script preceded by a minus (-) or a plus\
    \ (+). It is the prefixed - or + that lets **getopts** recognize command-line\
    \ arguments as *options*. In fact, **getopts** will not process arguments without\
    \ the prefixed - or +, and will terminate option processing at the first argument\
    \ encountered lacking them.\n2. The **getopts** template differs slightly from\
    \ the standard **while** loop, in that it lacks condition brackets.\n3. The **getopts**\
    \ construct replaces the obsolete **getopt** command.\n\n```\nwhile getopts \"\
    :abcde:fg\" Option\n# Initial declaration.\n# a, b, c, d, e, f, and g are the\
    \ options (flags) expected.\n# The : after option 'e' shows it will have an argument\
    \ passed with it.\ndo\n  case $Option in\n    a ) # Do something with variable\
    \ 'a'.\n    b ) # Do something with variable 'b'.\n    ...\n    e)  # Do something\
    \ with 'e', and also with $OPTARG,\n        # which is the associated argument\
    \ passed with option 'e'.\n    ...\n    g ) # Do something with variable 'g'.\n\
    \  esac\ndone\nshift $(($OPTIND - 1))\n# Move argument pointer to next.\n\n# All\
    \ this is not nearly as complicated as it looks <grin>.\n```\n\n**Example 11–13.**\
    \ Using getopts to read the options/arguments passed to a script\n\n```\n#!/bin/bash\n\
    \n# 'getopts' processes command line arguments to script.\n# The arguments are\
    \ parsed as \"options\" (flags) and associated arguments.\n```"
