    These files contain the aliases and environmental variables made available to
    Bash running as a user shell and to all Bash scripts invoked after system initialization.


    `/etc/profile`


    systemwide defaults, mostly setting the environment (all Bourne-type shells, not
    just Bash [56])


    `/etc/bashrc`


    systemwide functions and and [aliases](aliases) for Bash


    `$HOME/.bash_profile`


    user-specific Bash environmental default settings, found in each user''s home
    directory (the local counterpart to /etc/profile)


    `$HOME/.bashrc`


    user-specific Bash init file, found in each user''s home directory (the local
    counterpart to /etc/bashrc). Only interactive shells and user scripts read this
    file. See [Appendix G](Appendix G) for a sample .bashrc file.


    **logout file**


    `$HOME/.bash_logout`


    user-specific instruction file, found in each user''s home directory. Upon exit
    from a login (Bash) shell, the commands in this file execute.'
  merge: -1
