  md: "```\n#\n#  Each whitespace-separated \"word\" in the file\n#+ has been assigned\
    \ to an element of the array.\n\nelement_count=${#array1[*]}\necho $element_count\
    \         # 8\n```\n\nArrays permit deploying old familiar algorithms as shell\
    \ scripts. Whether this is necessarily a good idea is left to the reader to decide.\n\
    \n# Example 26–4. An old friend: *The Bubble Sort*\n\n```\n#!/bin/bash\n# bubble.sh:\
    \ Bubble sort, of sorts.\n\n# Recall the algorithm for a bubble sort. In this\
    \ particular version...\n\n#  With each successive pass through the array to be\
    \ sorted,\n#+ compare two adjacent elements, and swap them if out of order.\n\
    #  At the end of the first pass, the \"heaviest\" element has sunk to bottom.\n\
    #  At the end of the second pass, the next \"heaviest\" one has sunk next to bottom.\n\
    #  And so forth.\n#  This means that each successive pass needs to traverse less\
    \ of the array.\n#  You will therefore notice a speeding up in the printing of\
    \ the later passes.\n\nexchange()\n{\n  # Swaps two members of the array.\n  local\
    \ temp=${Countries[$1]} #  Temporary storage\n                              #+\
    \ for element getting swapped out.\n  Countries[$1]=${Countries[$2]}\n  Countries[$2]=$temp\n\
    \n  return\n}\n\ndeclare -a Countries  #  Declare array,\n                   \
    \   #+ optional here since it's initialized below.\n\nCountries=(Netherlands Ukraine\
    \ Zaire Turkey Russia Yemen Syria Brazil Argentina Nicaragua Japan Mexico Venezuela\
    \ Greece England Israel Peru Canada Oman Qatar Kuwait Liechtenstein)\n# \"Xanadu\"\
    \ is the mythical place where, according to Coleridge,\n#+ Kubla Khan did a pleasure\
    \ dome decree.\n\nclear                      # Clear the screen to start with.\n\
    \necho \"0: ${Countries[*]}\"  # List entire array at pass 0.\n\nnumber_of_elements=${#Countries[@]}\n\
    let \"comparisons = $number_of_elements - 1\"\n\ncount=1 # Pass number.\n\nwhile\
    \ [ \"$comparisons\" -gt 0 ]        # Beginning of outer loop\ndo\n\n  index=0\
    \  # Reset index to start of array after each pass.\n\n  while [ \"$index\" -lt\
    \ \"$comparisons\" ] # Beginning of inner loop\n```"
