  md: "# # Chapter 33. Scripting With Style\n\nGet into the habit of writing shell\
    \ scripts in a structured and systematic manner. Even \"on-the-fly\" and \"written\
    \ on the back of an envelope\" scripts will benefit if you take a few minutes\
    \ to plan and organize your thoughts before sitting down and coding.\n\nHerewith\
    \ are a few stylistic guidelines. This is not intended as an *Official Shell Scripting\
    \ Stylesheet*.\n\n# ## 33.1. Unofficial Shell Scripting Stylesheet\n\n+   - Comment\
    \ your code. This makes it easier for others to understand (and appreciate), and\
    \ easier for you to maintain.\n\n```\nPASS=\"$PASS${MATRIX:$(($RANDOM%${#MATRIX})):1}\"\
    \n# It made perfect sense when you wrote it last year, but now it's a complete\
    \ mystery.\n# (From Antek Sawicki's \"pw.sh\" script.)\n```\n\nAdd descriptive\
    \ headers to your scripts and functions.\n\n```\n#!/bin/bash\n\n#*******************************************#\n\
    #               xyz.sh\n#          written by Bozo Bozeman\n#               July\
    \ 05, 2001\n\n#          Clean up project files.\n#*******************************************#\n\
    \nBADDIR=65                           # No such directory.\nprojectdir=/home/bozo/projects\
    \  # Directory to clean up.\n\n#----------------------------------------------#\n\
    # cleanup_pfiles ()\n# Removes all files in designated directory.\n# Parameter:\
    \ $target_directory\n# Returns: 0 on success, $BADDIR if something went wrong.\n\
    #----------------------------------------------#\ncleanup_pfiles ()\n{\n  if [\
    \ ! -d \"$1\" ]  # Test if target directory exists.\n  then\n    echo \"$1 is\
    \ not a directory.\"\n    return $BADDIR\n  fi\n\n  rm -f \"$1\"/*\n  return 0\
    \   # Success.\n}\n\ncleanup_pfiles $projectdir\n\nexit 0\n```\n\nBe sure to put\
    \ the *#!/bin/bash* at the beginning of the first line of the script, preceding\
    \ any comment headers."
  merge: -1
  pgno: 313
- img_proc: false
  md: "# Advanced Bash–Scripting Guide\n\n+   • Avoid using \"magic numbers\", [62]\
    \ that is, \"hard-wired\" literal constants. Use meaningful variable names instead.\
    \ This makes the script easier to understand and permits making changes and updates\
    \ without breaking the application.\n\n```\nif [ -f /var/log/messages ]\nthen\n\
    \  ...\nfi\n# A year later, you decide to change the script to check /var/log/syslog.\n\
    # It is now necessary to manually change the script, instance by instance,\n#\
    \ and hope nothing breaks.\n\n# A better way:\nLOGFILE=/var/log/messages  # Only\
    \ line that needs to be changed.\nif [ -f \"$LOGFILE\" ]\nthen\n  ...\nfi\n```\n\
    \n+   • Choose descriptive names for variables and functions.\n\n```\nfl=`ls -al\
    \ $dirname`             # Cryptic.\nfile_listing=`ls -al $dirname`    # Better.\n\
    \nMAXVAL=10   # All caps used for a script constant.\nwhile [ \"$index\" -le \"\
    $MAXVAL\" ]\n...\n\nE_NOTFOUND=75                    # Uppercase for an errorcode,\n\
    \                                # and name begins with \"E_\".\nif [ ! -e \"\
    $filename\" ]\nthen\n  echo \"File $filename not found.\"\n  exit $E_NOTFOUND\n\
    fi\n\nMAIL_DIRECTORY=/var/spool/mail/bozo  # Uppercase for an environmental variable.\n\
    export MAIL_DIRECTORY\n\nGetAnswer ()                      # Mixed case works\
    \ well for a function.\n{\n  prompt=$1\n  echo -n $prompt\n  read answer\n  return\
    \ $answer\n}\n\nGetAnswer \"What is your favorite number? \"\nfavorite_number=$?\n\
    echo $favorite_number\n\n_uservariable=23                  # Permissable, but\
    \ not recommended.\n# It's better for user-defined variables not to start with\
    \ an underscore.\n# Leave that for system variables.\n```\n\n+   • Use exit codes\
    \ in a systematic and meaningful way.\n\n```\nE_WRONG_ARGS=65\n...\n...\nexit\
    \ $E_WRONG_ARGS\n```\n\nChapter 33. Scripting With Style"
