  md: "# Advanced Bash-Scripting Guide\n\n# Example 13-7. Adding a new hard drive\n\
    \n```\n#!/bin/bash\n\n# Adding a second hard drive to system.\n# Software configuration.\
    \ Assumes hardware already mounted.\n# From an article by the author of this document.\n\
    # in issue #38 of \"Linux Gazette\", http://www.linuxgazette.com.\n\nROOT_UID=0\
    \     # This script must be run as root.\nE_NOTROOT=67   # Non-root exit error.\n\
    \nif [ \"$UID\" -ne \"$ROOT_UID\" ]\nthen\n  echo \"Must be root to run this script.\"\
    \n  exit $E_NOTROOT\nfi\n\n# Use with extreme caution!\n# If something goes wrong,\
    \ you may wipe out your current filesystem.\n\nNEWDISK=/dev/hdb           # Assumes\
    \ /dev/hdb vacant. Check!\nMOUNTPOINT=/mnt/newdisk    # Or choose another mount\
    \ point.\n\nfdisk $NEWDISK\nmke2fs -cv $NEWDISK1       # Check for bad blocks\
    \ & verbose output.\n# Note:       /dev/hdb1, *not* /dev/hdb!\nmkdir $MOUNTPOINT\n\
    chmod 777 $MOUNTPOINT       # Makes new drive accessible to all users.\n\n# Now,\
    \ test...\n# mount -t ext2 /dev/hdb1 /mnt/newdisk\n# Try creating a directory.\n\
    # If it works, umount it, and proceed.\n\n# Final step:\n# Add the following line\
    \ to /etc/fstab.\n# /dev/hdb1   /mnt/newdisk   ext2   defaults   1 1\n\nexit 0\n\
    ```\n\nSee also [Example 13-6](http://www.tldp.org/LDP/abs/examples/zipusage.sh)\
    \ and [Example 29-3](http://www.tldp.org/LDP/abs/examples/quotedstring.sh).\n\n\
    # tune2fs\n\nTune ext2 filesystem. May be used to change filesystem parameters,\
    \ such as maximum mount count. This must be invoked as root.\n\n![](bbox=[0.36,\
