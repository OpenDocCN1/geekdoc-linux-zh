  md: "# # Advanced Bash–Scripting Guide\n\nCHange ROOT directory. Normally commands\
    \ are fetched from `$PATH`, relative to `/`, the default root directory. This\
    \ changes the root directory to a different one (and also changes the working\
    \ directory to there). This is useful for security purposes, for instance when\
    \ the system administrator wishes to restrict certain users, such as those `telnetting`\
    \ in, to a secured portion of the filesystem (this is sometimes referred to as\
    \ confining a guest user to a \"chroot jail\"). Note that after a `chroot`, the\
    \ execution path for system binaries is no longer valid.\n\nA `chroot /opt` would\
    \ cause references to `/usr/bin` to be translated to `/opt/usr/bin`. Likewise,\
    \ `chroot /aaa/bbb /bin/ls` would redirect future instances of `ls` to `/aaa/bbb`\
    \ as the base directory, rather than `/` as is normally the case. An alias `XX\
    \ 'chroot /aaa/bbb ls'` in a user's `~/.bashrc` effectively restricts which portion\
    \ of the filesystem she may run command \"XX\" on.\n\nThe `chroot` command is\
    \ also handy when running from an emergency boot floppy (`chroot` to `/dev/fd0`),\
    \ or as an option to `lilo` when recovering from a system crash. Other uses include\
    \ installation from a different filesystem (an `rpm` option) or running a readonly\
    \ filesystem from a CD ROM. Invoke only as root, and use with care.\n\n![Warning\
    \ Icon](https://www.tldp.org/LDP/abs/images/warning.gif) It might be necessary\
    \ to copy certain system files to a chrooted directory, since the normal $PATH\
    \ can no longer be relied upon.\n\n# ## lockfile\n\nThis utility is part of the\
    \ `procmail` package ([www.procmail.org](http://www.procmail.org)). It creates\
    \ a `lock file`, a semaphore file that controls access to a file, device, or resource.\
    \ The lock file serves as a flag that this particular file, device, or resource\
    \ is in use by a particular process (\"busy\"), and this permits only restricted\
    \ access (or no access) to other processes.\n\nLock files are used in such applications\
    \ as protecting system mail folders from simultaneously being changed by multiple\
    \ users, indicating that a modem port is being accessed, and showing that an instance\
    \ of Netscape is using its cache. Scripts may check for the existence of a lock\
    \ file created by a certain process to check if that process is running. Note\
    \ that if a script attempts create a lock file that already exists, the script\
    \ will likely hang.\n\nNormally, applications create and check for lock files\
    \ in the `/var/lock` directory. A script can test for the presence of a lock file\
    \ by something like the following.\n\n```\nappname=xyzip\n# Application \"xyzip\"\
    \ created lock file \"/var/lock/xyzip.lock\".\n\nif [ -e \"/var/lock/$appname.lock\"\
