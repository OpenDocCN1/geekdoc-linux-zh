    then                         #+ so no error if this script is run\n  mkdir $MOUNTPT\
    \             #+ multiple times.\nfi\n\ndd if=/dev/zero of=$DEVICE count=$SIZE\
    \ bs=$BLOCKSIZE  # Zero out RAM device.\nmke2fs $DEVICE                  # Create\
    \ an ext2 filesystem on it.\nmount $DEVICE $MOUNTPT          # Mount it.\nchmod\
    \ 777 $MOUNTPT              # So ordinary user can access ramdisk.\n         \
    \                       # However, must be root to unmount it.\n\necho \"\\\"\
    $MOUNTPT\\\" now available for use.\"\n# The ramdisk is now accessible for storing\
