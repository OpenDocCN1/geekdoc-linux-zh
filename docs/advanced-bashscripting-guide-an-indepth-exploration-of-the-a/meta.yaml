  md: "Advanced Bash–Scripting Guide\n\n```\necho\n\nPi12=$(printf \"%1.12f\" $PI)\n\
    echo \"Pi to 12 decimal places = $Pi12\"\n\nMsg=`printf \"%s %s \\n\" $Message1\
    \ $Message2`\necho $Msg; echo $Msg\n\n# As it happens, the 'sprintf' function\
    \ can now be accessed\n# as a loadable module to Bash, but this is not portable.\n\
    \nexit 0\n```\n\nFormatting error messages is a useful application of **printf**\n\
    \n```\nE_BADDIR=65\n\nvar=nonexistent_directory\n\nerror()\n{\n  printf \"$@\"\
    \ >&2\n  # Formats positional params passed, and sents them to stderr.\n  echo\n\
    \  exit $E_BADDIR\n}\n\ncd $var || error $\"Can't cd to %s.\" \"$var\"\n\n# Thanks,\
    \ S.C.\n```\n\n*read*\n\n\"Reads\" the value of a variable from `stdin`, that\
    \ is, interactively fetches input from the keyboard. The -a option lets **read**\
    \ get array variables (see [Example 26–2](http://tldp.org/LDP/abs/html/ex26-2.html)).\n\
    \n# **Example 11–2. Variable assignment, using read**\n\n```\n#!/bin/bash\n\n\
    echo -n \"Enter the value of variable 'var1': \"\n# The -n option to echo suppresses\
    \ newline.\n\nread var1\n# Note no '$' in front of var1, since it is being set.\n\
    \necho \"var1 = $var1\"\n\necho\n\n# A single 'read' statement can set multiple\
    \ variables.\necho -n \"Enter the values of variables 'var2' and 'var3' (separated\
    \ by a space or tab): \"\nread var2 var3\necho \"var2 = $var2    var3 = $var3\"\
    \n# If you input only one value, the other variable(s) will remain unset (null).\n\
    \nexit 0\n```"
