  md: "# Advanced Bash–Scripting Guide\n\nsemicolon.\n\n```\nwhile [condition] ; do\n\
    ```\n\nNote that certain specialized **while** loops, as, for example, a [getopts\
    \ construct](https://tldp.org/LDP/abs/html/), deviate somewhat from the standard\
    \ template given here.\n\n# **Example 10–14. Simple while loop**\n\n```\n#!/bin/bash\n\
    \nvar0=0\nLIMIT=10\n\nwhile [ \"$var0\" -lt \"$LIMIT\" ]\ndo\n   echo -n \"$var0\
    \ \"        # -n suppresses newline.\n   var0=`expr $var0 + 1`    # var0=$(($var0+1))\
    \ also works.\ndone\n\necho\n\nexit 0\n```\n\n# **Example 10–15. Another while\
    \ loop**\n\n```\n#!/bin/bash\n\necho\n\nwhile [ \"$var1\" != \"end\" ]     # while\
    \ test \"$var1\" != \"end\"\ndo                                # also works.\n\
    \   echo \"Input variable #1 (end to exit) \"\n   read var1                  \
    \   # Not 'read $var1' (why?).\n   echo \"variable #1 = $var1\"    # Need quotes\
    \ because of \"#\".\n   # If input is 'end', echoes it here.\n   # Does not test\
    \ for termination condition until top of loop.\n   echo\ndone\n\nexit 0\n```\n\
    \nA **while** loop may have multiple conditions. Only the final condition determines\
    \ when the loop terminates. This necessitates a slightly different loop syntax,\
    \ however.\n\n# **Example 10–16. while loop with multiple conditions**\n\n```\n\
    #!/bin/bash\n\nvar1=unset\nprevious=$var1\n\nwhile echo \"previous-variable =\
    \ $previous\"\n      echo\n      previous=$var1\n```"
