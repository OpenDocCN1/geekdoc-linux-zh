    # ## System Logs


    # ### *logger*


    Appends a user–generated message to the system log (`/var/log/messages`). You
    do not have to be root to invoke **logger**.


    ```

    logger Experiencing instability in network connection at 23:10, 05/21.

    # Now, do a ''tail /var/log/messages''.

    ```


    By embedding a **logger** command in a script, it is possible to write debugging
    information to `/var/log/messages`.


    ```

    logger -t $0 -i Logging at line "$LINENO".

    # The "-t" option specifies the tag for the logger entry.

    # The "-i" option records the process ID.


    # tail /var/log/message

    # ...

    # Jul  7 20:48:58 localhost ./test.sh[1712]: Logging at line 3.

    ```


    # ### *logrotate*


    This utility manages the system log files, rotating, compressing, deleting, and/or
    mailing them, as appropriate. Usually [crond](http://www.tux.org/pub/linux/system/admin/cron/)
    runs **logrotate** on a daily basis.


    Adding an appropriate entry to `/etc/logrotate.conf` makes it possible to manage
    personal log files, as well as system–wide ones.


    # ## Job Control


    # ### *ps*


    Process Statistics: lists currently executing processes by owner and PID (process
    id). This is usually invoked with `ax` options, and may be piped to [grep](http://www.tux.org/pub/Linux/utils/textutils/)
    or [sed](http://www.tux.org/pub/Linux/utils/textutils/) to search for a specific
    process (see [Example 11–8](http://tldp.org/LDP/abs/html/appendix-a.html#EX11A)
    and [Example 28–1](http://tldp.org/LDP/abs/html/appendix-b.html#PSAUX)).


    ```

    bash$ ps ax | grep sendmail

    ```'
