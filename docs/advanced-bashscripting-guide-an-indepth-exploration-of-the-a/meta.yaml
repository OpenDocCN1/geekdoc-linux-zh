  md: "# # Chapter 12. External Filters, Programs and Commands\n\nStandard UNIX commands\
    \ make shell scripts more versatile. The power of scripts comes from coupling\
    \ system commands and shell directives with simple programming constructs.\n\n\
    # ## 12.1. Basic Commands\n\n**Command Listing**\n\n*ls*\n\nThe basic file \"\
    list\" command. It is all too easy to underestimate the power of this humble command.\
    \ For example, using the -R, recursive option, **ls** provides a tree-like listing\
    \ of a directory structure. Other interesting options are -S, sort listing by\
    \ file size, -t, sort by file modification time, and -i, show file inodes (see\
    \ [Example 12-3](Example 12-3)).\n\n**Example 12-1. Using ls to create a table\
    \ of contents for burning a CDR disk**\n\n```\n#!/bin/bash\n\nSPEED=2        \
    \      # May use higher speed if your hardware supports it.\nIMAGEFILE=cdimage.iso\n\
    CONTENTSFILE=contents\nDEFAULTDIR=/opt      # Make sure this directory exists.\n\
    \n# Script to automate burning a CDR.\n\n# Uses Joerg Schilling's \"cdrecord\"\
    \ package.\n# (http://www.fokus.gmd.de/nthp/employees/schilling/cdrecord.html)\n\
    \n#  If this script invoked as an ordinary user, need to suid cdrecord\n#+ (chmod\
    \ u+s /usr/bin/cdrecord, as root).\n\nif [ -z \"$1\" ]\nthen\n  IMAGE_DIRECTORY=$DEFAULTDIR\n\
    \  # Default directory, if not specified on command line.\nelse\n  IMAGE_DIRECTORY=$1\n\
    fi\n\nls -lRF $IMAGE_DIRECTORY > $IMAGE_DIRECTORY/$CONTENTSFILE\n# The \"l\" option\
    \ gives a \"long\" file listing.\n# The \"R\" option makes the listing recursive.\n\
    # The \"F\" option marks the file types (directories get a trailing /).\necho\
    \ \"Creating table of contents.\"\n\nmkisofs -r -o $IMAGFILE $IMAGE_DIRECTORY\n\
    echo \"Creating ISO9660 file system image ($IMAGEFILE).\"\n\ncdrecord -v -isosize\
    \ speed=$SPEED dev=0,0 $IMAGEFILE\n```"
