  md: "# Advanced Bash–Scripting Guide\n\nPassing an array involves loading the space–separated\
    \ elements of the array into a variable with [command substitution](https://tldp.org/LDP/abs/html/commandsub.html).\
    \ Getting an array back as the \"return value\" from a function uses the previously\
    \ mentioned stratagem of *echoing* the array in the function, then invoking command\
    \ substitution and the ( ... ) operator to assign it to an array.\n\n# Example\
    \ 34–8. Passing and returning arrays\n\n```\n#!/bin/bash\n# array-function.sh:\
    \ Passing an array to a function and...\n#                   \"returning\" an\
    \ array from a function\n\nPass_Array ()\n{\n  local passed_array   # Local variable.\n\
    \  passed_array=( `echo \"$1\"` )\n  echo \"${passed_array[@]}\"\n  #  List all\
    \ the elements of the new array\n  #+ declared and set within the function.\n\
    }\n\noriginal_array=( element1 element2 element3 element4 element5 )\n\necho\n\
    echo \"original_array = ${original_array[@]}\"\n#                  List all elements\
    \ of original array.\n\n# This is the trick that permits passing an array to a\
    \ function.\n# *************************************\nargument=`echo ${original_array[@]}`\n\
    # *************************************\n#  Pack a variable\n#+ with all the space-separated\
    \ elements of the original array.\n#\n# Note that attempting to just pass the\
    \ array itself will not work.\n\n# This is the trick that allows grabbing an array\
    \ as a \"return value\".\n# ***************************************\nreturned_array=(\
    \ `Pass_Array \"$argument\"` )\n# ***************************************\n# Assign\
    \ 'echoed' output of function to array variable.\n\necho \"returned_array = ${returned_array[@]}\"\
    \n\necho \"=================================================\"\n\n#  Now, try\
    \ it again,\n#+ attempting to access (list) the array from outside the function.\n\
    Pass_Array \"$argument\"\n\n# The function itself lists the array, but...\n#+\
    \ accessing the array from outside the function is forbidden.\necho \"Passed array\
    \ (within function) = ${passed_array[@]}\"\n# NULL VALUE since this is a variable\
    \ local to the function.\n\necho\n```"
