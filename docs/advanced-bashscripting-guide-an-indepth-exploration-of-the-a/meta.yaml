  md: "# Advanced Bash-Scripting Guide\n\n```\necho \"Burning the disk.\"\necho \"\
    Please be patient, this will take a while.\"\n\nexit 0\n```\n\n# *cat, tac*\n\n\
    **cat**, an acronym for *concatenate*, lists a file to `stdout`. When combined\
    \ with redirection (`>` or `>>`), it is commonly used to concatenate files.\n\n\
    ```\ncat filename cat file.1 file.2 file.3 > file.123\n```\n\nThe `-n` option\
    \ to **cat** inserts consecutive numbers before all lines of the target file(s).\
    \ The `-b` option numbers only the non-blank lines. The `-v` option echoes nonprintable\
    \ characters, using `^` notation. The `-s` option squeezes multiple consecutive\
    \ blank lines into a single blank line.\n\nSee also [Example 12-21](#) and [Example\
    \ 12-17](#).\n\n**tac**, is the inverse of *cat*, listing a file backwards from\
    \ its end.\n\n# *rev*\n\nreverses each line of a file, and outputs to `stdout`.\
    \ This is not the same effect as **tac**, as it preserves the order of the lines,\
    \ but flips each one around.\n\n```\nbash$ cat file1.txt\nThis is line 1.\n This\
    \ is line 2.\n\n\nbash$ tac file1.txt\nThis is line 2.\n This is line 1.\n\n\n\
    bash$ rev file1.txt\n.1 enil si sihT\n .2 enil si sihT\n```\n\n# *cp*\n\nThis\
    \ is the file copy command. `cp file1 file2` copies `file1` to `file2`, overwriting\
    \ `file2` if it already exists (see [Example 12-5](#)).\n\nParticularly useful\
    \ are the `-a` archive flag (for copying an entire directory tree) and the `-r`\
    \ and `-R` recursive flags.\n\n# *mv*\n\nThis is the file *move* command. It is\
    \ equivalent to a combination of **cp** and **rm**. It may be used to move multiple\
    \ files to a directory, or even to rename a directory. For some examples of using\
    \ **mv** in a script, see [Example 9-15](#) and [Example A-3](#)."
