  md: "Advanced Bash–Scripting Guide\n\nEach of the above script header lines calls\
    \ a different command interpreter, be it /bin/sh, the default shell (bash in a\
    \ Linux system) or otherwise. [6] Using #!/bin/sh, the default Bourne Shell in\
    \ most commercial variants of UNIX, makes the script portable to non-Linux machines,\
    \ though you may have to sacrifice a few Bash–specific features (the script will\
    \ conform to the POSIX [7] sh standard).\n\nNote that the path given at the \"\
    sha-bang\" must be correct, otherwise an error message, usually \"Command not\
    \ found\" will be the only result of running the script.\n\n#! can be omitted\
    \ if the script consists only of a set of generic system commands, using no internal\
    \ shell directives. Example 2, above, requires the initial #!, since the variable\
    \ assignment line, lines=50, uses a shell-specific construct. Note that #!/bin/sh\
    \ invokes the default shell interpreter, which defaults to /bin/bash on a Linux\
    \ machine.\n\n> This tutorial encourages a modular approach to constructing a\
    \ script. Make note of and collect \"boilerplate\" code snippets that might be\
    \ useful in future scripts. Eventually you can build a quite extensive library\
    \ of nifty routines. As an example, the following script prolog tests whether\
    \ the script has been invoked with the correct number of parameters.\n\n```\n\
    if [ $# -ne Number_of_expected_args ]\nthen\n  echo \"Usage: `basename $0` whatever\"\
    \n  exit $WRONG_ARGS\nfi\n```\n\n# 2.1. Invoking the script\n\nHaving written\
    \ the script, you can invoke it by sh scriptname, [8] or alternately bash scriptname.\
    \ (Not recommended is using sh <scriptname, since this effectively disables reading\
    \ from stdin within the script.) Much more convenient is to make the script itself\
    \ directly executable with a chmod.\n\nEither:\n\n```\nchmod 555 scriptname (gives\
    \ everyone read/execute permission) [9]\n\nor\n\nchmod +rx scriptname (gives everyone\
    \ read/execute permission)\n\nchmod u+rx scriptname (gives only the script owner\
    \ read/execute permission)\n```\n\nHaving made the script executable, you may\
    \ now test it by ./scriptname. [10] If it begins with a \"sha-bang\" line, invoking\
    \ the script calls the correct command interpreter to run it.\n\nAs a final step,\
    \ after testing and debugging, you would likely want to move it to /usr/local/bin\
    \ (as root, of course), to make the script available to yourself and all other\
    \ users as a system-wide executable. The script could then be invoked by simply\
    \ typing scriptname [ENTER] from the command line."
  merge: -1
