    # *nl*


    Line numbering filter. **nl** *filename* lists *filename* to *stdout*, but inserts
    consecutive numbers at the beginning of each non-blank line. If *filename* omitted,
    operates on *stdin*.


    The output of **nl** is very similar to **cat -n**, however, by default **nl**
    does not list blank lines.


    **Example 12–21. nl: A self–numbering script.**


    ```

    #!/bin/bash

    # This script echoes itself twice to stdout with its lines numbered.

    # ''nl'' sees this as line 3 since it does not number blank lines.

    # ''cat -n'' sees the above line as number 5.

    nl `basename $0`

    echo; echo # Now, let''s try it with ''cat -n''

    cat -n `basename $0`

    # The difference is that ''cat -n'' numbers the blank lines.

    # Note that ''nl -ba'' will also do so.

    exit 0

    ```


    # *pr*


    Print formatting filter. This will paginate files (or *stdout*) into sections
    suitable for hard copy printing or viewing on screen. Various options permit row
    and column manipulation, joining lines, setting margins, numbering lines, adding
    page headers, and merging files, among other things. The **pr** command combines
    much of the functionality of **nl**, **paste**, **fold**, **column**, and **expand**.


    **pr -o 5 --width=65 *fileZZZ* | more** gives a nice paginated listing to screen
    of *fileZZZ* with margins set at 5 and 65.


    A particularly useful option is -d, forcing double-spacing (same effect as **sed
    -G**).


