  md: '# # 34.4. Optimizations


    Most shell scripts are quick ''n dirty solutions to non-complex problems. As such,
    optimizing them for speed is not much of an issue. Consider the case, though,
    where a script carries out an important task, does it well, but runs too slowly.
    Rewriting it in a compiled language may not be a palatable option. The simplest
    fix would be to rewrite the parts of the script that slow it down. Is it possible
    to apply principles of code optimization even to a lowly shell script?


    Check the loops in the script. Time consumed by repetitive operations adds up
    quickly. Use the [time](time) and [times](times) tools to profile computation-intensive
    commands. Consider rewriting time-critical code sections in C, or even in assembler.


    Try to minimize file i/o. Bash is not particularly efficient at handling files,
    so consider using more appropriate tools for this within the script, such as awk
    or Perl.


    Try to write your scripts in a structured, coherent form, so they can be reorganized
    and tightened up as necessary. Some of the optimization techniques applicable
    to high-level languages may work for scripts, but others, such as loop unrolling,
    are mostly irrelevant. Above all, use common sense.


    # # 34.5. Assorted Tips


    +   - To keep a record of which user scripts have run during a particular session
    or over a number of sessions, add the following lines to each script you want
    to keep track of. This will keep a continuing file record of the script names
    and invocation times.


    ```

    # Append (>>) following to end of each script tracked.


    date>> $SAVE_FILE      #Date and time.

    echo $0>> $SAVE_FILE   #Script name.

    echo>> $SAVE_FILE      #Blank line as separator.


    # Of course, SAVE_FILE defined and exported as environmental variable in ~/.bashrc

    #  (something like ~/.scripts-run)

    ```


    +   - The >> operator appends lines to a file. What if you wish to *prepend* a
    line to an existing file, that is, to paste it in at the beginning?


    ```

    file=data.txt

    title="***This is the title line of data text file***"


    echo $title | cat - $file >$file.new

    # "cat -" concatenates stdout to $file.

    #  End result is

    #+ to write a new file with $title appended at *beginning*.

    ```


    Of course, [sed](sed) can also do this.


    +   - A shell script may act as an embedded command inside another shell script,
    a *Tcl* or *wish* script, or even a [Makefile](Makefile). It can be invoked as
    as an external shell command in a C program using the *system()* call, i.e., *system("script_name");*.'
