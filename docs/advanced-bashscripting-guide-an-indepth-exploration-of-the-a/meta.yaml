    # Bibliography


    Dale Dougherty and Arnold Robbins, *Sed and Awk*, 2nd edition, O''Reilly and Associates,
    1997, 1-156592-225-5.


    To unfold the full power of shell scripting, you need at least a passing familiarity
    with **sed** and **awk**. This is the standard tutorial. It includes an excellent
    introduction to "regular expressions". Read this book.


    *


    Aeleen Frisch, *Essential System Administration*, 2nd edition, O''Reilly and Associates,
    1995, 1-56592-127-5.


    This excellent sys admin manual has a decent introduction to shell scripting for
    sys administrators and does a nice job of explaining the startup and initialization
    scripts. The book is long overdue for a third edition (are you listening, Tim
    O''Reilly?).


    *


    Stephen Kochan and Patrick Woods, *Unix Shell Programming*, Hayden, 1990, 067248448X.


    The standard reference, though a bit dated by now.


    *


    Neil Matthew and Richard Stones, *Beginning Linux Programming*, Wrox Press, 1996,
    1874416680.


    Good in-depth coverage of various programming languages available for Linux, including
    a fairly strong chapter on shell scripting.


    *


    Herbert Mayer, *Advanced C Programming on the IBM PC*, Windcrest Books, 1989,
    0830693637.


    Excellent coverage of algorithms and general programming practices.'
