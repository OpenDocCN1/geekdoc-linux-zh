  md: '# Advanced Bash–Scripting Guide


    # *exit*


    Unconditionally terminates a script. The **exit** command may optionally take
    an integer argument, which is returned to the shell as the [exit status](exit%20status)
    of the script. It is a good practice to end all but the simplest scripts with
    an **exit 0**, indicating a successful run.


    > If a script terminates with an **exit** lacking an argument, the exit status
    of the script is the exit status of the last command executed in the script, not
    counting the **exit**.


    # *exec*


    This shell builtin replaces the current process with a specified command. Normally,
    when the shell encounters a command, it forks off [26] a child process to actually
    execute the command. Using the **exec** builtin, the shell does not fork, and
    the command exec''ed replaces the shell. When used in a script, therefore, it
    forces an exit from the script when the **exec''ed** command terminates. For this
    reason, if an **exec** appears in a script, it would probably be the final command.


    An **exec** also serves to reassign [file descriptors](file%20descriptors). `exec
    <zzz-file` replaces `stdin` with the file `zzz-file` (see [Example 16–1](Example%2016–1)).


    # **Example 11–15. Effects of exec**


    ```

    #!/bin/bash


    exec echo "Exiting \"$\0\"."    # Exit from script.


    # The following lines never execute.


    echo "This will never echo."


    exit 0  # Will not exit here.

    ```


    > The `-exec` option to [find](find) is *not* the same as the **exec** shell builtin.


    # *shopt*


    This command permits changing shell options on the fly (see [Example 24–1](Example%2024–1)
    and [Example 24–2](Example%2024–2)). It often appears in the Bash [startup files](startup%20files),
    but also has its uses in scripts. Needs [version 2](version%202) or later of Bash.


    ```

    shopt -s cdspell

    # Allows minor misspelling directory names with ''cd''

    command.

    ```


    # **Commands**


