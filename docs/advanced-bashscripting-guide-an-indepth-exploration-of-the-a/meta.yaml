  md: "Advanced Bash–Scripting Guide\n\n# Example 28–1. Finding the process associated\
    \ with a PID\n\n```\n#!/bin/bash\n# pid-identifier.sh: Gives complete path name\
    \ to process associated with pid.\n\nARGNO=1  # Number of arguments the script\
    \ expects.\nE_WRONGARGS=65\nE_BADPID=66\nE_NOSUCHPROCESS=67\nE_NOPERMISSION=68\n\
    PROCFILE=exe\n\nif [ $# -ne $ARGNO ]\nthen\n  echo \"Usage: `basename $0` PID-number\"\
    \ >&2  # Error message >stderr.\n  exit $E_WRONGARGS\nfi\n\npidno=$( ps ax | grep\
    \ $1 | awk '{ print $1 }' | grep $1 )\n# Checks for pid in \"ps\" listing, field\
    \ #1.\n# Then makes sure it is the actual process, not the process invoked by\
    \ this script.\n# The last \"grep $1\" filters out this possibility.\nif [ -z\
    \ \"$pidno\" ]  # If, after all the filtering, the result is a zero-length string,\n\
    then                  # no running process corresponds to the pid given.\n  echo\
    \ \"No such process running.\"\n  exit $E_NOSUCHPROCESS\nfi\n\n# Alternatively:\n\
    #  if ! ps $1 > /dev/null 2>&1\n#  then                  # no running process\
    \ corresponds to the pid given.\n#    echo \"No such process running.\"\n#   \
    \ exit $E_NOSUCHPROCESS\n#  fi\n\n# To simplify the entire process, use \"pidof\"\
    .\n\nif [ ! -r \"/proc/$1/$PROCFILE\" ]  # Check for read permission.\nthen\n\
    \  echo \"Process $1 running, but...\"\n  echo \"Can't get read permission on\
    \ /proc/$1/$PROCFILE.\"\n  exit $E_NOPERMISSION  # Ordinary user can't access\
    \ some files in /proc.\nfi\n\n# The last two tests may be replaced by:\n#    if\
    \ ! kill -0 $1 > /dev/null 2>&1  # '0' is not a signal, but\n                \
    \                        # this will test whether it is possible\n           \
    \                             # to send a signal to the process.\n#    then echo\
    \ \"PID doesn't exist or you're not its owner\" >&2\n#    exit $E_BADPID\n#  \
    \  fi\n\nexe_file=$( ls -l /proc/$1 | grep \"exe\" | awk '{ print $11 }' )\n#\
    \ Or       exe_file=$( ls -l /proc/$1/exe | awk '{print $11}' )\n#\n# /proc/pid-number/exe\
    \ is a symbolic link\n# to the complete path name of the invoking process.\n```"
