    The **sz** and **rz** command set serves to transfer files to and from a remote
    host using the *zmodem* protocol. *Zmodem* has certain advantages over *xmodem*,
    such as greater transmission rate and resumption of interrupted file transfers.
    Like **sx** and **rx**, these are generally part of a communications package.


    # ftp


    Utility and protocol for uploading / downloading files to / from a remote host.
    An ftp session can be automated in a script (see [Example 17-7](http://tldp.org/LDP/abs/html/ex17-7.html),
    [Example A-4](http://tldp.org/LDP/abs/html/app-a.html#EXA4), and [Example A-11](http://tldp.org/LDP/abs/html/app-a.html#EXA11)).


    # cu


    *Call Up* a remote system and connect as a simple terminal. This is a sort of
    dumbed–down version of [telnet](http://tldp.org/LDP/abs/html/external.html#TELENET).


    # uucp


    *UNIX to UNIX copy*. This is a communications package for transferring files between
    UNIX servers. A shell script is an effective way to handle a **uucp** command
    sequence.


    Since the advent of the Internet and e–mail, **uucp** seems to have faded into
    obscurity, but it still exists and remains perfectly workable in situations where
    an Internet connection is not available or appropriate.


    # telnet


    Utility and protocol for connecting to a remote host.


    > The telnet protocol contains security holes and should therefore probably be
    avoided.


    # rlogin


    *Remote login*, initates a session on a remote host. This command has security
    issues, so use [ssh](http://tldp.org/LDP/abs/html/external.html#SSH) instead.


    # rsh


    *Remote shell*, executes command(s) on a remote host. This has security issues,
    so use **ssh** instead.


    # rcp


    *Remote copy*, copies files between two different networked machines. Using **rcp**
    and similar utilities with security implications in a shell script may not be
    advisable. Consider, instead, using **ssh** or an **expect** script.


    # ssh


    *Secure shell*, logs onto a remote host and executes commands there. This secure
    replacement'
