    # hostname


    Lists the system''s host name. This command sets the host name in an `/etc/rc.d`
    setup script (`/etc/rc.d/rc.sysinit` or similar). It is equivalent to **uname
    -n**, and a counterpart to the `$HOSTNAME` internal variable.


    ```

    bash$ **hostname**

    localhost.localdomain


    bash$ **echo $HOSTNAME**

    localhost.localdomain

    ```


    # hostid


    Echo a 32-bit hexadecimal numerical identifier for the host machine.


    ```

    bash$ **hostid**

    7f0100

    ```


    > This command allegedly fetches a "unique" serial number for a particular system.
    Certain product registration procedures use this number to brand a particular
    user license. Unfortunately, **hostid** only returns the machine network address
    in hexadecimal, with pairs of bytes transposed.


    The network address of a typical non-networked Linux machine, is found in `/etc/hosts`.


    ```

    bash$ **cat /etc/hosts**

    127.0.0.1                    localhost.localdomain  localhost

    ```


    As it happens, transposing the bytes of 127.0.0.1, we get 0.127.1.0, which translates
    in hex to **007f0100**, the exact equivalent of what **hostid** returns, above.
    There exist only a few million other Linux machines with this identical *hostid*.


