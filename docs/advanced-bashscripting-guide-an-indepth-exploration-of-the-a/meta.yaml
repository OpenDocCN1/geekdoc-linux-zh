    \ it\n\n# Above lines may be replaced by\n#  kill -9 `ps ax | awk '/ppp/ { print\
    \ $1 }'`\n\n\nchmod 666 /dev/ttyS3\n# Doing a SIGKILL on ppp changes the permissions\n\
    # on the serial port. Restore them to previous state.\n\nrm /var/lock/LCK..ttyS3\
    \   # Remove the serial port lock file.\n\nexit 0\n```\n\n# Example 11–9. A version\
    \ of \"rot13\"\n\n```\n#!/bin/bash\n# A version of \"rot13\" using 'eval'.\n#\
    \ Compare to \"rot13.sh\" example.\n\nsetvar_rot_13()            # \"rot13\" scrambling\n\
    {\n  local varname=$1 varvalue=$2\n  eval $varname='$(echo \"$varvalue\" | tr\
    \ a-z n-za-m)'\n}\n\nsetvar_rot_13 var \"foobar\"   # Run \"foobar\" through rot13.\n\
    echo $var                    # sbbone\n\necho $var | tr a-z n-za-m    # foobar\n\
    \                              # Back to original variable.\n\n# This example\
    \ by Stephane Chazelas.\n\nexit 0\n```\n\n> The **eval** command can be risky,\
    \ and normally should be avoided when there exists a reasonable alternative. An\
    \ `eval $COMMANDS` executes the contents of *COMMANDS*, which may contain such\
    \ unpleasant surprises as `rm -rf *`. Running an **eval** on unfamiliar code written\
    \ by persons unknown is living dangerously.\n\n# set\n\nThe **set** command changes\
    \ the value of internal script variables. One use for this is to toggle [option\
    \ flags](https://tldp.org/LDP/abs/html/options.html) which help determine the\
    \ behavior of the script. Another application for it is to reset the [positional\
    \ parameters](https://tldp.org/LDP/abs/html/internal.html) that a script sees\
    \ as the result of a command (`set \\`command\\``). The script can then parse\
    \ the fields of the command output.\n\n# Example 11–10. Using set with positional\
    \ parameters\n\nChapter 11. Internal Commands and Builtins"
