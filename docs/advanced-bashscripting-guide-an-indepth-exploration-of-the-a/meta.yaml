  md: "# Advanced Bash–Scripting Guide\n\n# logical operators\n\n```\n&&\n```\n\n\
    and (logical)\n\n```\nif [ $condition1 ] && [ $condition2 ]\n# Same as:  if [\
    \ $condition1 -a $condition2 ]\n# Returns true if both condition1 and condition2\
    \ hold true...\n\nif [[ $condition1 && $condition2 ]]    # Also works.\n# Note\
    \ that && operator not permitted within [ ... ] construct.\n```\n\n&& may also,\
    \ depending on context, be used in an [and list](https://tldp.org/LDP/abs/html/and_list.html)\
    \ to concatenate commands.\n\n```\n||\n```\n\nor (logical)\n\n```\nif [ $condition1\
    \ ] || [ $condition2 ]\n# Same as:  if [ $condition1 -o $condition2 ]\n# Returns\
    \ true if either condition1 or condition2 holds true...\n\nif [[ $condition1 ||\
    \ $condition2 ]]    # Also works.\n# Note that || operator not permitted within\
    \ [ ... ] construct.\n```\n\nBash tests the [exit_status](https://tldp.org/LDP/abs/html/exit-status.html)\
    \ of each statement linked with a logical operator.\n\n# Example 8–3. Compound\
    \ Condition Tests Using && and ||\n\n```\n#!/bin/bash\n\na=24\nb=47\n\nif [ \"\
    $a\" -eq 24 ] && [ \"$b\" -eq 47 ]\nthen\n  echo \"Test #1 succeeds.\"\nelse\n\
    \  echo \"Test #1 fails.\"\nfi\n\n# ERROR:   if [ \"$a\" -eq 24 && \"$b\" -eq\
    \ 47 ]\n#          attempts to execute  ' [ \"$a\" -eq 24 '\n#          and fails\
    \ to finding matching ']'.\n#\n#    if [[ $a -eq 24 && $b -eq 24 ]]    works\n\
    #    (The \"&&\" has a different meaning in line 17 than in line 6.)\n#    Thanks,\
    \ Stephane Chazelas.\n\nif [ \"$a\" -eq 98 ] || [ \"$b\" -eq 47 ]\nthen\n```"
