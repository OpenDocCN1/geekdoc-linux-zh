  md: "# Advanced Bash-Scripting Guide\n\nFollowing an **if**, neither the **test**\
    \ command nor the test brackets ( [ ] or [[ ]] ) are strictly necessary.\n\n```\n\
    dir=/home/bozo\n\nif cd \"$dir\" 2>/dev/null; then   # \"2>/dev/null\" hides error\
    \ message.\n  echo \"Now in $dir.\"\nelse\n  echo \"Can't change to $dir.\"\n\
    fi\n```\n\nThe \"if COMMAND\" construct returns the exit status of COMMAND.\n\n\
    Similarly, a condition within test brackets may stand alone without an **if**,\
    \ when used in combination with a [list construct](list construct).\n\n```\nvar1=20\n\
    var2=22\n[ \"$var1\" -ne \"$var2\" ] && echo \"$var1 is not equal to $var2\"\n\
    \nhome=/home/bozo\n[ -d \"$home\" ] || echo \"$home directory does not exist.\"\
    \n```\n\nThe (( )) construct expands and evaluates an arithmetic expression. If\
    \ the expression evaluates as zero, it returns an [exit status](exit status) of\
    \ 1, or \"false\". A non-zero expression returns an exit status of 0, or \"true\"\
    . This is in marked contrast to using the **test** and [ ] constructs previously\
    \ discussed.\n\n# Example 7–3. Arithmetic Tests using (( ))\n\n```\n#!/bin/bash\n\
    # Arithmetic tests.\n\n# The (( ... )) construct evaluates and tests numerical\
    \ expressions.\n# Exit status opposite from [ ... ] construct!\n\n(( 0 ))\necho\
    \ \"Exit status of \\\"(( 0 ))\\\" is $?.\"   # 1\n\n(( 1 ))\necho \"Exit status\
    \ of \\\"(( 1 ))\\\" is $?.\"   # 0\n\n(( 5 > 4 ))                           \
    \   # true\necho $?                                  # 0\n\n(( 5 > 9 ))      \
    \                        # false\necho $?                                  # 1\n\
    \nexit 0\n```\n\n# 7.2. File test operators\n\n**Returns true if...**\n\n–*e*"
