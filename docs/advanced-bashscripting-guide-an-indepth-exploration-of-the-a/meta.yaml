  md: "# Advanced Bash–Scripting Guide\n\n```\nremainder=1                       \
    \    #  If uninitialized variable used in loop,\n                            \
    \          #+ it results in an error message\n                               \
    \       #+ on first pass through loop.\n\nuntil [ \"$remainder\" -eq 0 ]\ndo\n\
    \   let \"remainder = $dividend % $divisor\"\n   dividend=$divisor           \
    \       # Now repeat with 2 smallest numbers.\n   divisor=$remainder         \
    \        # Euclid's algorithm\ndone\n                                      # Last\
    \ $dividend is the gcd.\n}\n\ngcd $1 $2\n\necho; echo \"GCD of $1 and $2 = $dividend\"\
    ; echo\n\n# Exercise :\n# ---------\n#   Check command-line arguments to make\
    \ sure they are integers,\n#+ and exit the script with an appropriate error message\
    \ if not.\n\nexit 0\n```\n\n**+=**\n\n\"plus–equal\" (increment variable by a\
    \ constant)\n\n**`let \"var += 5\"`** results in `var` being incremented by **5**.\n\
    \n**–=**\n\n\"minus–equal\" (decrement variable by a constant)\n\n\"times–equal\"\
    \ (multiply variable by a constant)\n\n**`let \"var *= 4\"`** results in `var`\
    \ being multiplied by **4**.\n\n**/=**\n\n\"slash–equal\" (divide variable by\
    \ a constant)\n\n**%=**\n\n\"mod–equal\" (remainder of dividing variable by a\
    \ constant)\n\n*Arithmetic operators often occur in an [expr](https) or [let](https)\
    \ expression.*\n\n# Example 8–2. Using Arithmetic Operations\n\n```\n#!/bin/bash\n\
    ```"
