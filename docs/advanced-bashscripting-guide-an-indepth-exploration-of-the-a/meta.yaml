  md: '# # Chapter 4. Special Characters


    # ## Special Characters Found In Scripts and Elsewhere


    #


    **Comments.** Lines beginning with a # ([with the exception of #!](http://google.com))
    are comments.


    ```

    # This line is a comment.

    ```


    Comments may also occur at the end of a command.


    ```

    echo "A comment will follow." # Comment here.

    ```


    Comments may also follow [whitespace](http://google.com) at the beginning of a
    line.


    ```

    # A tab precedes this comment.

    ```


    A command may not follow a comment on the same line. There is no method of terminating
    the comment, in order for "live code" to begin on the same line. Use a new line
    for the next command.


    Of course, an escaped # in an **echo** statement does *not* begin a comment. Likewise,
    a # appears in [certain_parameter_substitution_constructs](http://google.com)
    and in [numerical_constant_expressions](http://google.com).


    ```

    echo "The # here does not begin a comment."

    echo ''The # here does not begin a comment.''

    echo The \# here does not begin a comment.

    echo The # here begins a comment.


    echo ${PATH#*:}        # Parameter substitution, not a comment.

    echo $(( 2#101011 ))   # Base conversion, not a comment.


    # Thanks, S.C.

    ```


    The standard [quoting_and_escape](http://google.com) characters (" '' \) escape
    the #.


    Certain [pattern_matching_operations](http://google.com) also use the #.


    ;


    **Command separator.** [Semicolon] Permits putting two or more commands on the
    same line.


    ```

    echo hello; echo there

    ```


    Note that the ";" sometimes needs to be [escaped](http://google.com).'
