  md: '# Advanced Bash–Scripting Guide


    Trace the route taken by packets sent to a remote host. This command works within
    a LAN, WAN, or over the Internet. The remote host may be specified by an IP address.
    The output of this command may be filtered by [grep](grep) or [sed](sed) in a
    pipe.


    *ping*


    Broadcast an "ICMP ECHO_REQUEST" packet to other machines, either on a local or
    remote network. This is a diagnostic tool for testing network connections, and
    it should be used with caution.


    A successful **ping** returns an [exit status](exit status) of 0. This can be
    tested for in a script.


    ```

    bash$ **ping** localhost

    PING localhost.localdomain (127.0.0.1) from 127.0.0.1 : 56(84) bytes of data.

    Warning: time of day goes back, taking countermeasures.

    64 bytes from localhost.localdomain (127.0.0.1): icmp_seq=0 ttl=255 time=709 usec

    64 bytes from localhost.localdomain (127.0.0.1): icmp_seq=1 ttl=255 time=286 usec


    --- localhost.localdomain ping statistics ---

    2 packets transmitted, 2 packets received, 0% packet loss

    round-trip min/avg/max/mdev = 0.286/0.497/0.709/0.212 ms

    ```


    *whois*


    Perform a DNS (Domain Name System) lookup. The -h option permits specifying which
    *whois* server to query. See [Example 5-6](Example 5-6).


    *finger*


    Retrieve information about a particular user on a network. Optionally, this command
    can display the user''s ~/.plan, ~/.project, and ~/.forward files, if present.


    ```

    bash$ **finger** bozo

    Login: bozo                           Name: Bozo Bozeman

    Directory: /home/bozo                 Shell: /bin/bash

    On since Fri Aug 31 20:13 (MST) on tty1    1 hour 38 minutes idle

    On since Fri Aug 31 20:13 (MST) on pts/0    12 seconds idle

    On since Fri Aug 31 20:13 (MST) on pts/1

    On since Fri Aug 31 20:31 (MST) on pts/2    1 hour 16 minutes idle

    No mail.

    No Plan.

    ```


    Out of security considerations, many networks disable **finger** and its associated
