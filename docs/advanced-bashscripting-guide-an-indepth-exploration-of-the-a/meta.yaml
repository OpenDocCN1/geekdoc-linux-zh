  md: '# Advanced Bash−Scripting Guide


    Invoking **`builtin`** **`BUILTIN_COMMAND`** runs the command "`BUILTIN_COMMAND`"
    as a shell builtin, temporarily disabling both functions and external system commands
    with the same name.


    # *enable*


    This either enables or disables a shell builtin command. As an example, **`enable`**
    **`-n`** **`kill`** disables the shell builtin `kill`, so that when Bash subsequently
    encounters **`kill`**, it invokes `/bin/kill`.


    The `-a` option to **`enable`** lists all the shell builtins, indicating whether
    or not they are enabled. The `-f filename` option lets **`enable`** load a builtin
    as a shared library (DLL) module from a properly compiled object file. [27]


    # *autoload*


    This is a port to Bash of the *ksh* autoloader. With **`autoload`** in place,
    a function with an "autoload" declaration will load from an external file at its
    first invocation. [28] This saves system resources.


    Note that **`autoload`** is not a part of the core Bash installation. It needs
    to be loaded in with **`enable -f`** (see above).


    **Table 11−1. Job Identifiers**


    | Notation | Meaning |

    |---|---|

    | `%N` | Job number [N] |

    | `%S` | Invocation (command line) of job begins with string *S* |

    | `%?S` | Invocation (command line) of job contains within it string *S* |

    | `%%` | "current" job (last job stopped in foreground or started in background)
    |

    | `%+` | "current" job (last job stopped in foreground or started in background)
    |

    | `%-` | Last job |

    | `$!` | Last background process |'
