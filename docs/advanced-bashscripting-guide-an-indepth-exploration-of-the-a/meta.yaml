    | FC | comm, cmp | file compare |

    | FIND | grep | find strings in files |

    | MD | mkdir | make directory |

    | MKDIR | mkdir | make directory |

    | MORE | more | text file paging filter |

    | MOVE | mv | move |

    | PATH | $PATH | path to executables |

    | REN | mv | rename (move) |

    | RENAME | mv | rename (move) |

    | RD | rmdir | remove directory |

    | RMDIR | rmdir | remove directory |

    | SORT | sort | sort file |

    | TIME | date | display system time |

    | TYPE | cat | output file to `stdout` |

    | XCOPY | cp | (extended) file copy |


    Virtually all UNIX and shell operators and commands have many more options and
    enhancements than their DOS and batch file equivalents. Many DOS batch files rely
    on auxiliary utilities, such as **ask.com**, a crippled counterpart to [read](http://tldp.org/LDP/abs/html/).


    DOS supports a very limited and incompatible subset of filename [wildcard expansion](http://tldp.org/LDP/abs/html/),
    recognizing only the * and ? characters.


    Converting a DOS batch file into a shell script is generally straightforward,
    and the result ofttimes reads better than the original.


    # Example H–1. VIEWDATA.BAT: DOS Batch File


    ```

    REM VIEWDATA


    REM INSPIRED BY AN EXAMPLE IN "DOS POWERTOOLS"

    REM                     BY PAUL SOMERSON


    @ECHO OFF


    IF !%1==! GOTO VIEWDATA

    REM  IF NO COMMAND-LINE ARG...

    FIND "%1" C:\BOZO\BOOKLIST.TXT

    GOTO EXIT0

    REM  PRINT LINE WITH STRING MATCH, THEN EXIT.

    ```'
