  md: "# Chapter 11. Internal Commands and Builtins\n\nA *builtin* is a **command**\
    \ contained within the Bash tool set, literally *built in*. A builtin may be a\
    \ synonym to a system command of the same name, but Bash reimplements it internally.\
    \ [123] For example, the Bash **echo** command is not the same as `/bin/echo`,\
    \ although their behavior is almost identical.\n\nA *keyword* is a *reserved*\
    \ word, token or operator. Keywords have a special meaning to the shell, and indeed\
    \ are the building blocks of the shell's syntax. As examples, \"for\", \"while\"\
    , \"do\", and \"!\" are keywords. Similar to a *builtin*, a keyword is hard-coded\
    \ into Bash, but unlike a builtin, a keyword is not by itself a command, but part\
    \ of a larger command structure. [124]\n\n# I/O\n\n# *echo*\n\nprints (to `stdout`)\
    \ an expression or variable (see [Example 5-1]).\n\n```\necho Hello\necho $a\n\
    ```\n\nAn **echo** requires the `-e` option to print escaped characters. See [Example\
    \ 6-2].\n\nNormally, each **echo** command prints a terminal newline, but the\
    \ `-n` option suppresses this.\n\nAn **echo** can be used to feed a sequence of\
    \ commands down a pipe.\n\n```\nif echo \"$VAR\" | grep -q txt  # if [[ $VAR =\
    \ *txt* ]]\nthen\n  echo \"$VAR contains the substring sequence \\\"txt\\\"\"\n\
    fi\n```\n\nAn **echo**, in combination with [command substitution](link) can set\
    \ a variable.\n\n```\na=`echo \"HELLO\" | tr A-Z a-z`\n```\n\nSee also [Example\
    \ 12-15](link), [Example 12-2](link), [Example 12-30](link), and [Example 12-31](link).\n\
    \nBe aware that **echo** `command` deletes any linefeeds that the output of *command*\
    \ generates.\n\nThe [$IFS](link) (internal field separator) variable normally\
    \ contains `\\n` (linefeed) as one of its set of [whitespace](link) characters.\
    \ Bash therefore splits the output of *command* at linefeeds into arguments to\
    \ **echo**. Then **echo** outputs these arguments, separated by spaces.\n\n```\n\
    bash$ ls -l /usr/share/apps/kjezz/sounds\n-rw-r--r--   1 root   root       1407\
    \ Nov  7  2000 reflect.au\n -rw-r--r--   1 root   root        362 Nov  7  2000\
    \ seconds.au\n```"
  merge: -1
  pgno: 127
- img_proc: false
  md: "```\nbash$ `echo `ls -l /usr/share/apps/kjezz/sounds`\ntotal 40 -rw-r--r--\
    \ 1 root root 716 Nov 7 2000 reflect.au -rw-r--r-- 1 root root 362 Nov 7`\n```\n\
    \nThis command is a shell builtin, and not the same as /bin/echo, although its\
    \ behavior is similar.\n\n```\nbash$ `type -a echo`\necho is a shell builtin\n\
    echo is /bin/echo\n```\n\n# printf\n\nThe **printf**, formatted print, command\
    \ is an enhanced **echo**. It is a limited variant of the C language printf, and\
    \ the syntax is somewhat different.\n\n```\n`printf` *format-string... parameter...*\n\
    ```\n\nThis is the Bash builtin version of the /bin/printf or /usr/bin/printf\
    \ command. See the **printf** manpage (of the system command) for in-depth coverage.\n\
    \nOlder versions of Bash may not support **printf**.\n\n# Example 11–1. printf\
    \ in action\n\n```\n#!/bin/bash\n# printf demo\n\nPI=3.14159265358979\nDecimalConstant=31373\n\
    Message1=\"Greetings,\"\nMessage2=\"Earthling.\"\n\necho\n\nprintf \"Pi to 2 decimal\
    \ places = %1.2f\" $PI\necho\nprintf \"Pi to 9 decimal places = %1.9f\" $PI  #\
    \ It even rounds off correctly.\n\nprintf \"\\n\"                           #\
    \ Prints a line feed,\n                           # equivalent to 'echo'.\n\n\
    printf \"Constant = \\t%d\\n\" $DecimalConstant  # Inserts tab (\\t)\n\nprintf\
    \ \"%s %s \\n\" $Message1 $Message2\n\necho\n\n# =============================================#\n\
    # Simulation of C function, 'sprintf'.\n# Loading a variable with a formatted\
    \ string.\n```"
  merge: -1
