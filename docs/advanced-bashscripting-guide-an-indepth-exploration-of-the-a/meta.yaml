    # 9.7. The Double Parentheses Construct


    Similar to the [let]{.underline} command, the ((...)) construct permits arithmetic
    expansion and evaluation. In its simplest form, **a=$(( 5 + 3 ))** would set "a"
    to "5 + 3", or 8. However, this double parentheses construct is also a mechanism
    for allowing C-type manipulation of variables in Bash.


    # Example 9–25. C-type manipulation of variables


    ```

    #!/bin/bash

    # Manipulating a variable, C-style, using the ((...)) construct.


    echo


    (( a = 23 ))  # Setting a value, C-style, with spaces on both sides of the "=".

    echo "a (initial value) = $a"


    (( a++ ))     # Post-increment ''a'', C-style.

    echo "a (after a++) = $a"


    (( a-- ))     # Post-decrement ''a'', C-style.

    echo "a (after a--) = $a"


    (( ++a ))     # Pre-increment ''a'', C-style.

    echo "a (after ++a) = $a"


    (( --a ))     # Pre-decrement ''a'', C-style.

    echo "a (after --a) = $a"

    ```'
