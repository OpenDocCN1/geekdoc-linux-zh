    \ || return $BAD_PARAMS\n\n  case \"$1\" in\n  \"$2\") return $MATCH;;\n  *  \
    \  ) return $NOMATCH;;\n  esac\n\n}\n\n\na=one\nb=two\nc=three\nd=two\n\nmatch_string\
