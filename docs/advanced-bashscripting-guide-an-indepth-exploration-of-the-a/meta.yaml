  md: '# Advanced Bash-Scripting Guide


    # Notes


    +   These are referred to as [builtins](...), features internal to the shell.


    +   Many of the features of *ksh88*, and even a few from the updated *ksh93* have
    been merged into Bash.


    +   By convention, user-written shell scripts that are Bourne shell compliant
    generally take a name with a `.sh` extension. System scripts, such as those found
    in `/etc/rc.d`, do not follow this guideline.


    +   Some flavors of UNIX (those based on 4.2BSD) take a four-byte magic number,
    requiring a blank after the !, `#! /bin/sh`.


    +   The #! line in a shell script will be the first thing the command interpreter
    (**sh** or **bash**) sees. Since this line begins with a #, it will be correctly
    interpreted as a comment when the command interpreter finally executes the script.
    The line has already served its purpose – calling the command interpreter.


    +   This allows some cute tricks.


    ```

    #!/bin/rm

    # Self-deleting script.


    # Nothing much seems to happen when you run this... except that the file disappears.


    WHATEVER=65


    echo "This line will never print (betcha!)."


    exit $WHATEVER  # Doesn''t matter. The script will not exit here.

    ```


    Also, try starting a README file with a `#!/bin/more`, and making it executable.
    The result is a self-listing documentation file.


    +   *Portable Operating System Interface*, an attempt to standardize UNIX-like
    OSes.


    +   Caution: invoking a Bash script by `sh scriptname` turns off Bash-specific
    extensions, and the script may therefore fail to execute.


    +   A script needs *read*, as well as execute permission for it to run, since
    the shell needs to be able to read it.


    +   Why not simply invoke the script with `scriptname`? If the directory you are
    in ($PWD) is where *scriptname* is located, why doesn''t this work? This fails
    because, for security reasons, the current directory, "." is not included in a
    user''s $PATH. It is therefore necessary to explicitly invoke the script in the
    current directory with a `./scriptname`.


    +   The shell does the *brace expansion*. The command itself acts upon the *result*
    of the expansion.


    +   Exception: a code block in braces as part of a pipe *may* be run as a [subshell](...).'
