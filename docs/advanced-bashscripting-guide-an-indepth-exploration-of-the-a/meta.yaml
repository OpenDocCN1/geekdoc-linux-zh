    > **tr variants**


    The **tr** utility has two historic variants. The BSD version does not use brackets
    (**tr a-z A-Z**), but the SysV one does (**tr ''[a-z]'' ''[A-Z]''**). The GNU
    version of **tr** resembles the BSD one, so quoting letter ranges within brackets
    is mandatory.


