  md: "# # Chapter 20. Subshells\n\nRunning a shell script launches another instance\
    \ of the command processor. Just as your commands are interpreted at the command\
    \ line prompt, similarly does a script batch process a list of commands in a file.\
    \ Each shell script running is, in effect, a subprocess of the [parent](https://tldp.org/LDP/abs/html/parent.html)\
    \ shell, the one that gives you the prompt at the console or in an xterm window.\n\
    \nA shell script can also launch subprocesses. These *subshells* let the script\
    \ do parallel processing, in effect executing multiple subtasks simultaneously.\n\
    \n**Command List in Parentheses**\n\n```\n( command1; command2; command3; ...\
    \ )\n```\n\nA command list embedded between *parentheses* runs as a subshell.\n\
    \n> Variables in a subshell are *not* visible outside the block of code in the\
    \ subshell. They are not accessible to the [parent process](https://tldp.org/LDP/abs/html/parent.html),\
    \ to the shell that launched the subshell. These are, in effect, [local variables](https://tldp.org/LDP/abs/html/localvar.html).\n\
    \n**Example 20–1. Variable scope in a subshell**\n\n```\n#!/bin/bash\n# subshell.sh\n\
    \necho\n\nouter_variable=Outer\n\n(\ninner_variable=Inner\necho \"From subshell,\
    \ \\\"inner_variable\\\" = $inner_variable\"\necho \"From subshell, \\\"outer\\\
    \" = $outer_variable\"\n)\n\necho\n\nif [ -z \"$inner_variable\" ]\nthen\n   \
    \ echo \"inner_variable undefined in main body of shell\"\nelse\n    echo \"inner_variable\
    \ defined in main body of shell\"\nfi\n\necho \"From main body of shell, \\\"\
    inner_variable\\\" = $inner_variable\"\n# $inner_variable will show as uninitialized\
    \ because\n# variables defined in a subshell are \"local variables\".\n\necho\n\
    \nexit 0\n```"
