  md: "# Advanced Bash–Scripting Guide\n\n```\nexit 0\n```\n\n*$UID*\n\nuser id number\n\
    \ncurrent user's user identification number, as recorded in /etc/passwd\n\nThis\
    \ is the current user's real id, even if she has temporarily assumed another identity\
    \ through `su`. `$UID` is a readonly variable, not subject to change from the\
    \ command line or within a script, and is the counterpart to the `id` builtin.\n\
    \n# Example 9–5. Am I root?\n\n```\n#!/bin/bash\n# am-i-root.sh:   Am I root or\
    \ not?\n\nROOT_UID=0    # Root has $UID 0.\n\nif [ \"$UID\" -eq \"$ROOT_UID\"\
    \ ]  # Will the real \"root\" please stand up?\nthen\n  echo \"You are root.\"\
    \nelse\n  echo \"You are just an ordinary user (but mom loves you just the same).\"\
    \nfi\n\nexit 0\n\n\n# ============================================================\
    \ #\n# Code below will not execute, because the script already exited.\n\n# An\
    \ alternate method of getting to the root of matters:\n\nROOTUSER_NAME=root\n\n\
    username=`id -nu`              # Or...   username=`whoami`\nif [ \"$username\"\
    \ = \"$ROOTUSER_NAME\" ]\nthen\n  echo \"Rooty, toot, toot. You are root.\"\n\
    else\n  echo \"You are just a regular fella.\"\nfi\n```\n\nSee also [Example 2–2](Example\
    \ 2–2).\n\nThe variables `$ENV`, `$LOGNAME`, `$MAIL`, `$TERM`, `$USER`, and `$USERNAME`\
    \ are *not* Bash **builtins**. These are, however, often set as environmental\
    \ variables in one of the Bash **startup files**. `$SHELL`, the name of the user's\
    \ login shell, may be set from `/etc/passwd` or in an \"init\" script, and it\
