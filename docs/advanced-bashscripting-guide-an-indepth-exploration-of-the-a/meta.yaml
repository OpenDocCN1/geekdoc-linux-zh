    \ Cipher\n\nImplement the Playfair (Wheatstone) Cipher in a script.\n\nThe Playfair\
    \ Cipher encrypts text by substitution of each 2-letter \"digram\" (grouping).\
    \ Traditionally, one would use a 5 x 5 letter scrambled alphabet code key square\
    \ for the encryption and decryption.\n\n```\n    C O D E S\n    A B F G H\n  \
    \  I K L M N\n    P Q R T U\n    V W X Y Z\n\nEach letter of the alphabet appears\
    \ once, except \"I\" also represents\n\"J\". The arbitrarily chosen key word,\
    \ \"CODES\" comes first, then all the\nrest of the alphabet, skipping letters\
    \ already used.\n\nTo encrypt, separate the plaintext message into digrams (2-letter\n\
    groups). If a group has two identical letters, delete the second, and\nform a\
    \ new group. If there is a single letter left over at the end,\ninsert a \"null\"\
    \ character, typically an \"X\".\n\nTHIS IS A TOP SECRET MESSAGE\n\nTH IS IS AT\
    \ OP SE CR ET ME SA GE\n\nFor each digram, there are three possibilities.\n-----------------------------------------------\n\
    1) Both letters will be on the same row of the key square\n   For each letter,\
    \ substitute the one immediately to the right, in that\n   row. If necessary,\
    \ wrap around left to the beginning of the row.\n\nor\n\n2) Both letters will\
    \ be in the same column of the key square\n   For each letter, substitute the\
    \ one immediately below it, in that\n   row. If necessary, wrap around to the\
    \ top of the column.\n\nor\n\n3) Both letters will form the corners of a rectangle\
    \ within the key\n   square. For each letter, substitute the one on the other\
    \ corner the\n   rectangle which lies on the same row.\n\nThe \"TH\" digram falls\
    \ under case #3.\nG H\nM N\nT U             (Rectangle with \"T\" and \"H\" at\
    \ corners)\n\nT --> U\n```"
