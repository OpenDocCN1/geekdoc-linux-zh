  md: "# Advanced Bash–Scripting Guide\n\n```\n# Bash, version 2.02, introduced the\
    \ \"**\" exponentiation operator.\n\nlet \"z=5**3\"\necho \"z = $z\"    # z =\
    \ 125\n```\n\nmodulo, or mod (returns the remainder of an integer division operation)\n\
    \n```\nbash$ echo `expr 5 % 3`\n2\n```\n\nThis operator finds use in, among other\
    \ things, generating numbers within a specific range (see [Example 9-21](https://tldp.org/LDP/abs/html/numrange.html)\
    \ and [Example 9-22](https://tldp.org/LDP/abs/html/numrange.html)) and formatting\
    \ program output (see [Example 26-7](https://tldp.org/LDP/abs/html/printf-v-string.html)\
    \ and [Example A-6](https://tldp.org/LDP/abs/html/printfv-string.html)). It can\
    \ even be used to generate prime numbers, (see [Example A-14](https://tldp.org/LDP/abs/html/primegaps.html)).\
    \ Modulo turns up surprisingly often in various numerical recipes.\n\n# Example\
    \ 8-1. Greatest common divisor\n\n```\n#!/bin/bash\n# gcd.sh: greatest common\
    \ divisor\n#          Uses Euclid's algorithm\n\n#  The \"greatest common divisor\"\
    \ (gcd) of two integers\n#+ is the largest integer that will divide both, leaving\
    \ no remainder.\n\n#  Euclid's algorithm uses successive division.\n#  In each\
    \ pass,\n#+ dividend <--  divisor\n#+ divisor  <--  remainder\n#+ until remainder\
    \ = 0.\n#+ The gcd = dividend, on the final pass.\n#\n#  For an excellent discussion\
    \ of Euclid's algorithm, see\n#  Jim Loy's site, http://www.jimloy.com/number/euclids.htm.\n\
    \n\n# ----------------------------------------------------------\n# Argument check\n\
    ARGS=2\nE_BADARGS=65\n\nif [ $# -ne \"$ARGS\" ]\nthen\n  echo \"Usage: `basename\
    \ $0` first-number second-number\"\n  exit $E_BADARGS\nfi\n# ----------------------------------------------------------\n\
    \n\ngcd ()\n{\n\n  dividend=$1                    # Arbitrary assignment.\n  divisor=$2\
    \                     # It does not matter\n  #+ which of the two is larger.\n\
    \  # Why?\n\n```"
