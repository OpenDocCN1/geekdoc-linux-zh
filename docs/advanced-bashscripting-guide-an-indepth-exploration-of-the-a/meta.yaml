    \ of recursion can exhaust the script's stack space, causing a segfault.\n\n#\
    \ 34.7. Portability Issues\n\nThis book deals specifically with Bash scripting\
    \ on a GNU/Linux system. All the same, users of **sh** and **ksh** will find much\
    \ of value here.\n\nAs it happens, many of the various shells and scripting languages\
    \ seem to be converging toward the POSIX 1003.2 standard. Invoking Bash with the\
    \ `--posix` option or inserting a **set -o posix** at the head of a script causes\
    \ Bash to conform very closely to this standard. Even lacking this measure, most\
    \ Bash scripts will run as–is under **ksh**, and vice–versa, since Chet Ramey\
    \ has been busily porting **ksh** features to the latest versions of Bash.\n\n\
    On a commercial UNIX machine, scripts using GNU–specific features of standard\
    \ commands may not work. This has become less of a problem in the last few years,\
    \ as the GNU utilities have pretty much displaced their proprietary counterparts\
    \ even on \"big–iron\" UNIX. Caldera's recent release of the source to many of\
    \ the original UNIX utilities will only accelerate the trend.\n\n# 34.8. Shell\
    \ Scripting Under Windows\n\nEven users running *that other* OS can run UNIX–like\
    \ shell scripts, and therefore benefit from many of the lessons of this book.\
