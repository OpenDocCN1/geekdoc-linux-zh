  md: "# Advanced Bash–Scripting Guide\n\n```\n#!/bin/bash\n\n#View gzipped files\
    \ with 'most'\n\nNOARGS=65\nNOTFOUND=66\nNOTGZIP=67\n\nif [ $# -eq 0 ] # same\
    \ effect as:  if [ -z \"$1\" ]\n# $1 can exist, but be empty:  zmost \"\" arg2\
    \ arg3\nthen\n  echo \"Usage: `basename $0` filename\" >&2\n  # Error message\
    \ to stderr.\n  exit $NOARGS\n  # Returns 65 as exit status of script (error code).\n\
    fi\n\nfilename=$1\n\nif [ ! -f \"$filename\" ]   # Quoting $filename allows for\
    \ possible spaces.\nthen\n  echo \"File $filename not found!\" >&2\n  # Error\
    \ message to stderr.\n  exit $NOTFOUND\nfi\n\nif [ ${filename##*.} != \"gz\" ]\n\
    # Using bracket in variable substitution.\nthen\n  echo \"File $1 is not a gzipped\
    \ file!\"\n  exit $NOTGZIP\nfi\n\nzcat $1 | most\n\n# Uses the file viewer 'most'\
    \ (similar to 'less').\n# Later versions of 'most' have file decompression capabilities.\n\
    # May substitute 'more' or 'less', if desired.\n\nexit $?   # Script returns exit\
    \ status of pipe.\n# Actually \"exit $?\" unnecessary, as the script will, in\
    \ any case,\n# return the exit status of the last command executed.\n```\n\n#\
    \ compound comparison\n\n*-a*\n\n\tlogical and\n\n\t*exp1* *-a* *exp2* returns\
    \ true if *both* exp1 and exp2 are true.\n\n*-o*\n\n\tlogical or\n\n\t*exp1* *-o*\
    \ *exp2* returns true if either exp1 *or* exp2 are true.\n\n7.3. Comparison operators\
    \ (binary)"
