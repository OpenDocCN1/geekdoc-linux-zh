  md: "# Advanced Bash-Scripting Guide\n\n```\nif [ condition-true ]\nthen\n  command\
    \ 1\n  command 2\n  ...\nelse\n  # Optional (may be left out if not needed).\n\
    \  # Adds default code block executing if original condition tests false.\n  command\
    \ 3\n  command 4\n  ...\nfi\n```\n\nWhen *if* and *then* are on same line in a\
    \ condition test, a semicolon must terminate the *if* statement. Both *if* and\
    \ *then* are [keywords](http://). Keywords (or commands) begin statements, and\
    \ before a new statement on the same line begins, the old one must terminate.\n\
    \n```\nif [ -x \"$filename\" ]; then\n```\n\n# Else if and elif\n\n# elif\n\n\
    `elif` is a contraction for else if. The effect is to nest an inner if/then construct\
    \ within an outer one.\n\n```\nif [ condition1 ]\nthen\n   command1\n   command2\n\
    \   command3\nelif [ condition2 ]\n# Same as else if\nthen\n   command4\n   command5\n\
    else\n   default-command\nfi\n```\n\nThe `if test condition-true` construct is\
    \ the exact equivalent of `if [ condition-true ]`. As it happens, the left bracket,\
    \ `[`, is a token which invokes the **test** command. The closing right bracket,\
    \ `]`, in an if/test should not therefore be strictly necessary, however newer\
    \ versions of Bash require it.\n\nThe **test** command is a Bash [builtin](http://)\
    \ which tests file types and compares strings. Therefore, in a Bash script, **test**\
    \ does *not* call the external `/usr/bin/test` binary, which is part of the *sh-utils*\
    \ package. Likewise, `[` does not call `/usr/bin/[`, which is linked to `/usr/bin/test`.\n\
    \n```\nbash$ **type test**\ntest is a shell builtin\nbash$ **type '['**\n```"
