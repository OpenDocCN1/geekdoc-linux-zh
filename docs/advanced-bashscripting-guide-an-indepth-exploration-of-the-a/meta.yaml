  md: "Normally, inputting a \\ suppresses a newline during input to a **read**. The\
    \ -r option causes an inputted \\ to be interpreted literally.\n\n# Example 11–3.\
    \ Multi–line input to read\n\n```\n#!/bin/bash\n\necho\n\necho \"Enter a string\
    \ terminated by a \\\\, then press <ENTER>.\"\necho \"Then, enter a second string,\
    \ and again press <ENTER>.\"\nread var1    # The \"\\\\\" suppresses the newline,\
    \ when reading \"var1\".\n             #    first line \\\n             #    second\
    \ line\n\necho \"var1 = $var1\"\n#    var1 = first line second line\n\n# For each\
    \ line terminated by a \"\\\",\n# you get a prompt on the next line to continue\
    \ feeding characters into var1.\n\necho; echo\n\necho \"Enter another string terminated\
    \ by a \\\\ , then press <ENTER>.\"\nread -r var2  # The -r option causes the\
    \ \"\\\\\" to be read literally.\n              #    first line \\\n\necho \"\
    var2 = $var2\"\n#    var2 = first line \\\n\n# Data entry terminates with the\
    \ first <ENTER>.\n\necho\n\nexit 0\n```\n\nThe **read** command has some interesting\
    \ options that permit echoing a prompt and even reading keystrokes without hitting\
    \ **ENTER**.\n\n```\n# Read a keypress without hitting ENTER.\n\nread -s -n1 -p\
    \ \"Hit a key \" keypress\necho; echo \"Keypress was \\\"$keypress\\\".\"\n\n\
    # -s option means do not echo input.\n# -n N option means accept only N characters\
    \ of input.\n# -p option means echo the following prompt before reading input.\n\
    \n# Using these options is tricky, since they need to be in the correct order.\n\
    ```\n\nThe -t option to **read** permits timed input (see [Example 9–4](Example\
    \ 9–4)).\n\nThe **read** command may also \"read\" its variable value from a file\
    \ [redirected](redirected) to stdin. If the file contains more than one line,\
    \ only the first line is assigned to the variable. If **read** has more than one\
    \ parameter, then each of these variables gets assigned a successive [whitespace–delineated](whitespace–delineated)\
    \ string. Caution!"
