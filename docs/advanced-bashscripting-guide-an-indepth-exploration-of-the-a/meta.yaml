  md: "# Chapter 30. Debugging\n\nThe Bash shell contains no debugger, nor even any\
    \ debugging-specific commands or constructs. Syntax errors or outright typos in\
    \ the script generate cryptic error messages that are often of no help in debugging\
    \ a non-functional script.\n\n# Example 30-1. A buggy script\n\n```\n#!/bin/bash\n\
    # ex74.sh\n\n# This is a buggy script.\n\na=37\n\nif [$a -gt 27 ]\nthen\n  echo\
    \ $a\nfi\n\nexit 0\n```\n\nOutput from script:\n\n```\n./ex74.sh: [37: command\
    \ not found\n```\n\nWhat's wrong with the above script (hint: after the **if**)?\n\
    \nWhat if the script executes, but does not work as expected? This is the all\
    \ too familiar logic error.\n\n# Example 30-2. test24, another buggy script\n\n\
    ```\n#!/bin/bash\n\n#  This is supposed to delete all filenames in current directory\n\
    #+ containing embedded spaces.\n#  It doesn't work.  Why not?\n\n\nbadname=`ls\
    \ | grep ' '`\n\n# echo \"$badname\"\n\nrm \"$badname\"\n\n\nexit 0\n```\n\nTry\
    \ to find out what's wrong with [Example 30-2](#) by uncommenting the `echo \"\
    $badname\"` line. Echo statements are useful for seeing whether what you expect\
    \ is actually what you get.\n\nIn this particular case, `rm \"$badname\"` will\
    \ not give the desired results because `$badname` should not be quoted. Placing\
    \ it in quotes ensures that **rm** has only one argument (it will match only one\
    \ filename). A"
  merge: -1
  pgno: 300
- img_proc: false
  md: "partial fix is to remove to quotes from $badname and to reset $IFS to contain\
    \ only a newline, **IFS=$'\\n'**. However, there are simpler ways of going about\
    \ it.\n\n```\n# Correct methods of deleting filenames containing spaces.\nrm *\\\
    \ *\nrm *\" \"*\nrm *' '*\n# Thank you. S.C.\n```\n\nSummarizing the symptoms\
    \ of a buggy script,\n\n+   1. It bombs with an error message syntax error, or\n\
    2. It runs, but does not work as expected (logic error)\n3. It runs, works as\
    \ expected, but has nasty side effects (logic bomb).\n\nTools for debugging non-working\
    \ scripts include\n\n+   1. echo statements at critical points in the script to\
    \ trace the variables, and otherwise give a snapshot of what is going on.\n2.\
    \ using the **tee** filter to check processes or data flows at critical points.\n\
    3. setting option flags -n -v -x\n\n**sh -n scriptname** checks for syntax errors\
    \ without actually running the script. This is the equivalent of inserting **set\
    \ -n** or **set -o noexec** into the script. Note that certain types of syntax\
    \ errors can slip past this check.\n\n**sh -v scriptname** echoes each command\
    \ before executing it. This is the equivalent of inserting **set -v** or **set\
    \ -o verbose** in the script.\n\nThe -n and -v flags work well together. **sh\
    \ -nv scriptname** gives a verbose syntax check.\n\n**sh -x scriptname** echoes\
    \ the result each command, but in an abbreviated manner. This is the equivalent\
    \ of inserting **set -x** or **set -o xtrace** in the script.\n\nInserting **set\
    \ -u** or **set -o nounset** in the script runs it, but gives an unbound variable\
    \ error message at each attempt to use an undeclared variable.\n\n4. Using an\
    \ \"assert\" function to test a variable or condition at critical points in a\
    \ script. (This is an idea borrowed from C.)\n\n# Example 30-3. Testing a condition\
    \ with an \"assert\"\n\n```\n#!/bin/bash\n# assert.sh\n\nassert ()\n{        \
    \       # If condition false,\n                #+ exit from script with error\
    \ message.\n    E_PARAM_ERR=98\n    E_ASSERT_FAILED=99\n\n    if [ -z \"$2\" ]\
    \       # Not enough parameters passed.\n    then\n        return $E_PARAM_ERR\
    \   # No damage done.\n    fi\n```"
  merge: -1
  pgno: 301
