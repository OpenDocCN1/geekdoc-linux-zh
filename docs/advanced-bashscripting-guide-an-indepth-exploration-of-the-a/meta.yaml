  md: "```\necho; echo\n\necho Printing Numbers 1 through 20, but something happens\
    \ after 2.\n\n################################################################################\n\
    \n# Same loop, but substituting 'break' for 'continue'.\n\na=0\n\nwhile [ \"$a\"\
    \ -le \"$LIMIT\" ]\ndo\n    a=$(($a+1))\n\n    if [ \"$a\" -gt 2 ]\n    then\n\
    \        break  # Skip entire rest of loop.\n    fi\n\n    echo -n \"$a \"\ndone\n\
    \necho; echo; echo\n\nexit 0\n```\n\nThe **break** command may optionally take\
    \ a parameter. A plain **break** terminates only the innermost loop in which it\
    \ is embedded, but a **break** *N* breaks out of *N* levels of loop.\n\n# **Example\
    \ 10–21. Breaking out of multiple loop levels**\n\n```\n#!/bin/bash\n# break-levels.sh:\
    \ Breaking out of loops.\n\n# \"break N\" breaks out of N level loops.\n\nfor\
    \ outerloop in 1 2 3 4 5\ndo\n    echo -n \"Group $outerloop:    \"\n\n    for\
    \ innerloop in 1 2 3 4 5\n    do\n        echo -n \"$innerloop \"\n\n        if\
    \ [ \"$innerloop\" -eq 3 ]\n        then\n            break   # Try  break 2 \
    \ to see what happens.\n                    # (\"Breaks\" out of both inner and\
    \ outer loops.)\n        fi\n    done\n\n    echo\ndone\n\necho\n\nexit 0\n```"
