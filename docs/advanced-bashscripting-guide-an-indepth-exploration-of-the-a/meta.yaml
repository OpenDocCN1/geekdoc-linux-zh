  md: "# Chapter 29. Of Zeros and Nulls\n\n# /dev/zero and /dev/null\n\n# Uses of\
    \ /dev/null\n\nThink of `/dev/null` as a \"black hole\". It is the nearest equivalent\
    \ to a write-only file. Everything written to it disappears forever. Attempts\
    \ to read or output from it result in nothing. Nevertheless, `/dev/null` can be\
    \ quite useful from both the command line and in scripts.\n\nSuppressing `stdout`\
    \ or `stderr` (from [Example 12-2](example-12-2)):\n\n```\nrm $badname 2>/dev/null\n\
    #         So error messages [stderr] deep-sixed.\n```\n\nDeleting contents of\
    \ a file, but preserving the file itself, with all attendant permissions (from\
    \ [Example 2-1](example-2-1) and [Example 2-2](example-2-2)):\n\n```\ncat /dev/null\
    \ > /var/log/messages\n#  : > /var/log/messages  has same effect, but does not\
    \ spawn a new process.\n\ncat /dev/null > /var/log/wtmp\n```\n\nAutomatically\
    \ emptying the contents of a logfile (especially good for dealing with those nasty\
    \ \"cookies\" sent by Web commercial sites):\n\n# Example 29-1. Hiding the cookie\
    \ jar\n\n```\nif [ -f ~/.netscape/cookies ]  # Remove, if exists.\nthen\n  rm\
    \ -f ~/.netscape/cookies\nfi\n\nln -s /dev/null ~/.netscape/cookies\n# All cookies\
    \ now get sent to a black hole, rather than saved to disk.\n```\n\n# Uses of /dev/zero\n\
    \nLike `/dev/null`, `/dev/zero` is a pseudo file, but it actually contains nulls\
    \ (numerical zeros, not the ASCII kind). Output written to it disappears, and\
    \ it is fairly difficult to actually read the nulls in `/dev/zero`, though it\
    \ can be done with [od](od) or a hex editor. The chief use for `/dev/zero` is\
    \ in creating an initialized dummy file of specified length intended as a temporary\
    \ swap file.\n\n# Example 29-2. Setting up a swapfile using /dev/zero\n\n```\n\
    #!/bin/bash\n\n# Creating a swapfile.\n# This script must be run as root.\n\n\
    ROOT_UID=0       # Root has $UID 0.\n```"
  merge: -1
  pgno: 297
- img_proc: false
  md: "```\nE_WRONG_USER=65    # Not root?\n\nFILE=/swap\nBLOCKSIZE=1024\nMINBLOCKS=40\n\
    SUCCESS=0\n\nif [ \"$UID\" -ne \"$ROOT_UID\" ]\nthen\n  echo; echo \"You must\
    \ be root to run this script.\"; echo\n  exit $E_WRONG_USER\nfi\n\n\nif [ -n \"\
    $1\" ]\nthen\n  blocks=$1\nelse\n  blocks=$MINBLOCKS              # Set to default\
    \ of 40 blocks\nfi                              # if nothing specified on command\
    \ line.\n\nif [ \"$blocks\" -lt $MINBLOCKS ]\nthen\n  blocks=$MINBLOCKS      \
    \       # Must be at least 40 blocks long.\nfi\n\necho \"Creating swap file of\
    \ size $blocks blocks (KB).\"\ndd if=/dev/zero of=$FILE bs=$BLOCKSIZE count=$blocks\
    \  # Zero out file.\n\nmkswap $FILE $blocks            # Designate it a swap file.\n\
    swapon $FILE                    # Activate swap file.\n\necho \"Swap file created\
    \ and activated.\"\n\nexit $SUCCESS\n```\n\nAnother application of `/dev/zero`\
    \ is to \"zero out\" a file of a designated size for a special purpose, such as\
    \ mounting a filesystem on a [loopback device](Example 13–6) (see Example 13–6)\
    \ or securely deleting a file (see Example 12–36).\n\n# **Example 29–3. Creating\
    \ a ramdisk**\n\n```\n#!/bin/bash\n# ramdisk.sh\n\n#  A \"ramdisk\" is a segment\
    \ of system RAM memory\n#+ that acts as if it were a filesystem.\n#  Its advantage\
    \ is very fast access (read/write time).\n#  Disadvantages: volatility, loss of\
    \ data on reboot or powerdown.\n#                less RAM available to system.\n\
    #\n#  What good is a ramdisk?\n#  Keeping a large dataset, such as a table or\
    \ dictionary on ramdisk\n#+ speeds up data lookup, since memory access is much\
    \ faster than disk access.\n\nE_NON_ROOT_USER=70            # Must run as root.\n\
    ROOTUSER_NAME=root\n```"
