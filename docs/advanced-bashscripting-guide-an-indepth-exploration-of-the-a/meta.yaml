  md: "# # Chapter 15. Arithmetic Expansion\n\nArithmetic expansion provides a powerful\
    \ tool for performing arithmetic operations in scripts. Translating a string into\
    \ a numerical expression is relatively straightforward using [backticks](backticks),\
    \ [double parentheses](double parentheses), or [let](let).\n\n**Variations**\n\
    \n*Arithmetic expansion with backticks (often used in conjunction with [expr](expr))*\n\
    \n```\nz=`expr $z + 3`            # 'expr' does the expansion.\n```\n\n*Arithmetic\
    \ expansion with double parentheses, and using **let***\n\nThe use of backticks\
    \ in arithmetic expansion has been superseded by double parentheses $((...)) or\
    \ the very convenient **let** construction.\n\n```\nz=$(($z+3))\n# $((EXPRESSION))\
    \ is arithmetic expansion.   # Not to be confused with\n                     \
    \                           # command substitution.\n\nlet z=z+3\nlet \"z += 3\"\
    \    #If quotes, then spaces and special operators allowed.\n# 'let' is actually\
    \ arithmetic evaluation, rather than expansion.\n```\n\nAll the above are equivalent.\
    \ You may use whichever one \"rings your chimes\".\n\nExamples of arithmetic expansion\
    \ in scripts:\n\n+   1. [Example 12-6](Example 12-6)\n2. [Example 10-14](Example\
