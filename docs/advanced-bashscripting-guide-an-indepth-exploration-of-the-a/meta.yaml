  md: "# Advanced Bash-Scripting Guide\n\n```\n#             \"\"       ) lines=50;;\n\
    #         *![0-9]*) echo \"Usage: `basename $0` file-to-cleanup\"; exit $E_WRONGARGS;;\n\
    #             *       ) lines=$1;;\n#             esac\n#\n#* Skip ahead to \"\
    Loops\" chapter to understand this.\n\ncd $LOG_DIR\n\nif [ `pwd` != \"$LOG_DIR\"\
    \ ]    # or   if [ \"$PWD\" != \"$LOG_DIR\" ]\n                              \
    \  # Not in /var/log?\nthen\n  echo \"Can't change to $LOG_DIR.\"\n  exit $E_XCD\n\
    fi   # Doublecheck if in right directory, before messing with log file.\n\n# far\
    \ better is:\n# ---\n# cd /var/log || {\n#   echo \"Cannot change to necessary\
    \ directory.\" >&2\n#   exit $E_XCD;\n# }\n\n\n\ntail -$lines messages > mesg.temp\
    \ # Saves last section of message log file.\nmv mesg.temp messages           \
    \ # Becomes new log directory.\n\n# cat /dev/null > messages\n#* No longer needed,\
    \ as the above method is safer.\n\ncat /dev/null > wtmp   # > wtemp    has the\
    \ same effect.\necho \"Logs cleaned up.\"\n\nexit 0\n#  A zero return value from\
    \ the script upon exit\n#+ indicates success to the shell.\n```\n\nSince you may\
    \ not wish to wipe out the entire system log, this variant of the first script\
    \ keeps the last section of the message log intact. You will constantly discover\
    \ ways of refining previously written scripts for increased effectiveness.\n\n\
    The *sha-bang* (#!) at the head of a script tells your system that this file is\
    \ a set of commands to be fed to the command interpreter indicated. The #! is\
    \ actually a two-byte [4] \"magic number\", a special marker that designates a\
    \ file type, or in this case an executable shell script (see **man magic** for\
    \ more details on this fascinating topic). Immediately following the *sha-bang*\
    \ is a path name. This is the path to the program that interprets the commands\
    \ in the script, whether it be a shell, a programming language, or a utility.\
    \ This command interpreter then executes the commands in the script, starting\
    \ at the top (line 1 of the script), ignoring comments. [5]\n\n```\n#!/bin/sh\n\
    #!/bin/bash\n#!/usr/bin/perl\n#!/usr/bin/tcl\n#!/bin/sed -f\n#!/usr/awk -f\n```\n\
    \nChapter 2. Starting Off With a Sha-Bang"
  merge: -1
