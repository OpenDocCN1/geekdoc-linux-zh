  md: "**bitwise operators**\n\n+   - `<<` — bitwise left shift (multiplies by 2 for\
    \ each shift position)\n- `<<=` — \"left-shift-equal\"\n  - `let \"var <<= 2\"\
    ` results in `var` left-shifted 2 bits (multiplied by 4)\n- `>>` — bitwise right\
    \ shift (divides by 2 for each shift position)\n- `>>=` — \"right-shift-equal\"\
    \ (inverse of <<=)\n- `&` — bitwise and\n- `&=` — \"bitwise and-equal\"\n- `|`\
    \ — bitwise OR\n- `|=` — \"bitwise OR-equal\"\n- `~` — bitwise negate\n- `!` —\
    \ bitwise NOT\n- `^` — bitwise XOR\n- `^=` — \"bitwise XOR-equal\""
