  md: "# Chapter 7. Tests\n\nEvery reasonably complete programming language can test\
    \ for a condition, then act according to the result of the test. Bash has the\
    \ **test** command, various bracket and parenthesis operators, and the **if/then**\
    \ construct.\n\n# 7.1. Test Constructs\n\n+   - An **if/then** construct tests\
    \ whether the exit status of a list of commands is 0 (since 0 means \"success\"\
    \ by UNIX convention), and if so, executes one or more commands.\n- There exists\
    \ a dedicated command called [ (left bracket special character). It is a synonym\
    \ for **test**, and a builtin for efficiency reasons. This command considers its\
    \ arguments as comparison expressions or file tests and returns an exit status\
    \ corresponding to the result of the comparison (0 for true, 1 for false).\n-\
    \ With version 2.02, Bash introduced the [[...]] *extended test command*, which\
    \ performs comparisons in a manner more familiar to programmers from other languages.\
    \ Note that [[ is a keyword, not a command.\n\nBash sees `[[ $a -lt $b ]]` as\
    \ a single element, which returns an exit status.\n\nThe ((...)) and let... constructs\
    \ also return an exit status of 0 if the arithmetic expressions they evaluate\
    \ expand to a non-zero value. These arithmetic expansion constructs may therefore\
    \ be used to perform arithmetic comparisons.\n\n```\nlet \"1<2\" returns 0 (as\
    \ \"1<2\" expands to \"1\")\n(( 0 && 1 )) returns 1 (as \"0 && 1\" expands to\
    \ \"0\")\n```\n\n+   - An **if** can test any command, not just conditions enclosed\
    \ within brackets.\n\n```\nif cmp a b > /dev/null  # Suppress output.\nthen echo\
    \ \"Files a and b are identical.\"\nelse echo \"Files a and b differ.\"\nfi\n\n\
    if grep -q Bash file\nthen echo \"File contains at least one occurrence of Bash.\"\
    \nfi\n\nif COMMAND_WHOSE_EXIT_STATUS_IS_0_UNLESS_ERROR_OCCURRED\nthen echo \"\
    Command succeeded.\"\nelse echo \"Command failed.\"\nfi\n```\n\n+   - An **if/then**\
    \ construct can contain nested comparisons and tests.\n\n```\nif echo \"Next *if*\
    \ is part of the comparison for the first *if*.\"\n\n  if [[ $comparison = \"\
    integer\" ]]\n    then (( a < b ))\n  else\n    [[ $a < $b ]]\n  fi\n\nthen\n\
    \  echo '$a is less than $b'\nfi\n```"
  merge: -1
