    # **xargs**


    A filter for feeding arguments to a command, and also a tool for assembling the
    commands themselves. It breaks a data stream into small enough chunks for filters
    and commands to process. Consider it as a powerful replacement for backquotes.
    In situations where backquotes fail with a too many arguments error, substituting
    **xargs** often works. Normally, **xargs** reads from `stdin` or from a pipe,
    but it can also be given the output of a file.


    The default command for **xargs** is `echo`. This means that input piped to **xargs**
    may have linefeeds and other whitespace characters stripped out.


    ```

    bash$ **ls -l**

    total 0

    -rw-rw-r--   1 bozo  bozo         0 Jan 29 23:58 file1

    -rw-rw-r--   1 bozo  bozo         0 Jan 29 23:58 file2


    bash$ **ls -l | xargs**

    total 0 -rw-rw-r-- 1 bozo bozo 0 Jan 29 23:58 file1 -rw-rw-r-- 1 bozo bozo 0 Jan
    29 23:58 file2

    ```


    `ls | xargs -p -l gzip` gzips every file in current directory, one at a time,
    prompting before each operation.


    An interesting **xargs** option is `-n NN`, which limits to *NN* the number of
    arguments passed.


    `ls | xargs -n 8 echo` lists the files in the current directory in 8 columns.


    Another useful option is `-0`, in combination with `find -print0` or `grep -lZ`.
    This allows handling arguments containing whitespace or quotes.


    `find / -type f -print0 | xargs -0 grep -liwZ GUI | xargs -0 rm -f`


    `grep -rliwZ GUI / | xargs -0 rm -f`


    Either of the above will remove any file containing "GUI". *(Thanks, S.C.)*'
