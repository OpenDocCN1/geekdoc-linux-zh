    \ text files. Its syntax is similar to C.\n\n**wc**\n\n*wc* gives a \"word count\"\
    \ on a file or I/O stream:\n\n```\nbash $ **wc** /usr/doc/sed-3.02/README\n20\
    \       127      838 /usr/doc/sed-3.02/README\n[20 lines  127 words  838 characters]\n\
    ```\n\n**wc** **-w** gives only the word count.\n\n**wc** **-l** gives only the\
    \ line count.\n\n**wc** **-c** gives only the character count.\n\n**wc** **-L**\
    \ gives only the length of the longest line.\n\nUsing **wc** to count how many\
    \ *.txt* files are in current working directory:\n\n```\n$ ls *.txt | wc -l\n\
    # Will work as long as none of the \"*.txt\" files have a linefeed in their name.\n\
    \n# Alternative ways of doing this are:\n#       find . -maxdepth 1 -name \\*.txt\
    \ -print0 | grep -cz .\n#       (shopt -s nullglob; set -- *.txt; echo $#)\n\n\
    # Thanks, S.C.\n```\n\nUsing **wc** to total up the size of all the files whose\
    \ names begin with letters in the range d – h\n\n```\nbash$ **wc** [d-h]* | **grep**\
    \ total | **awk** '{print $3}'\n71832\n```"
