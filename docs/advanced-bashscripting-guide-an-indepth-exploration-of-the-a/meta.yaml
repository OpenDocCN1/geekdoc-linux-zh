  md: "# Advanced Bash–Scripting Guide\n\n```\nParse_Date ()             # Parse date\
    \ from command line params.\n{\n  month=${1%/*/*}\n  dm=${1%/*}            # Day\
    \ and month.\n  day=${dm#*/}\n  let \"year = `basename $1`\" # Not a filename,\
    \ but works just the same.\n}\n\ncheck_date ()             # Checks for invalid\
    \ date(s) passed.\n{\n  [ \"$day\" -gt \"$DIM\" ] || [ \"$month\" -gt \"$MIY\"\
    \ ] || [ \"$year\" -lt \"$REFYR\" ] && Param_Error\n  # Exit script on bad value(s).\n\
    \  # Uses \"or-list / and-list\".\n  #\n  # Exercise: Implement more rigorous\
    \ date checking.\n}\n\nstrip_leading_zero () # Better to strip possible leading\
    \ zero(s)\n{                       # from day and/or month\n  val=${1#0}     \
    \       # since otherwise Bash will interpret them\n  return $val           #\
    \ as octal values (POSIX.2, sect 2.9.2.1).\n}\n\nday_index ()         # Gauss'\
    \ Formula:\n{                    # Days from Jan. 3, 1600 to date passed as param.\n\
    \n  day=$1\n  month=$2\n  year=$3\n\n  let \"month = $month - 2\"\n  if [ \"$month\"\
    \ -le 0 ]\n  then\n    let \"month += 12\"\n    let \"year -= 1\"\n  fi\n\n  let\
    \ \"year -= $REFYR\"\n  let \"indexyr = $year / $CENTURY\"\n\n  let \"Days = $DIY*$year\
    \ + $year/$LEAPCYCLE - $indexyr + $indexyr/$LEAPCYCLE + $ADJ_DIY*$month/$M\"\n\
    \  # For an in-depth explanation of this algorithm, see\n  # http://home.t-online.de/home/berndt.schwerdtfeger/cal.htm\n\
    \n  if [ \"$Days\" -gt \"$MAXRETVAL\" ]  # If greater than 256,\n  then      \
    \                        # then change to negative value\n    let \"dindex = 0\
    \ - $Days\"        # which can be returned from function.\n  else let \"dindex\
    \ = $Days\"\n  fi\n\n  return $dindex\n\n}\n```"
