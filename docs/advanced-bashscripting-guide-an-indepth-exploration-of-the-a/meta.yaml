  md: "# Chapter 23. Functions\n\nLike \"real\" programming languages, Bash has functions,\
    \ though in a somewhat limited implementation. A function is a subroutine, a `code_block`\
    \ that implements a set of operations, a \"black box\" that performs a specified\
    \ task. Wherever there is repetitive code, when a task repeats with only slight\
    \ variations, then consider using a function.\n\n```\nfunction function_name {\n\
    command...\n}\n```\n\nor\n\n```\nfunction_name() {\ncommand...\n}\n```\n\nThis\
    \ second form will cheer the hearts of C programmers (and is more portable).\n\
    \nAs in C, the function's opening bracket may optionally appear on the second\
    \ line.\n\n```\nfunction_name()\n{\ncommand...\n}\n```\n\nFunctions are called,\
    \ *triggered*, simply by invoking their names.\n\n# Example 23–1. Simple function\n\
    \n```\n#!/bin/bash\n\nfunky ()\n{\n  echo \"This is a funky function.\"\n  echo\
    \ \"Now exiting funky function.\"\n} # Function declaration must precede call.\n\
    \n   # Now, call the function.\n\nfunky\n\nexit 0\n```\n\nThe function definition\
    \ must precede the first call to it. There is no method of \"declaring\" the function,\
    \ as, for example, in C.\n\n```\n# f1\n# Will give an error message, since function\
    \ \"f1\" not yet defined.\n\n# However...\n```"
