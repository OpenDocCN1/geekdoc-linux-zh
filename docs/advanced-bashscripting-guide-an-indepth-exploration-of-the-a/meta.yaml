    \n# Same results as with \"while\" loop in previous example.\n\nexit 0\n```\n\n\
    # Example 16–5. Redirected *for* loop\n\n```\n#!/bin/bash\n\nif [ -z \"$1\" ]\n\
    then\n  Filename=names.data           # Default, if no filename specified.\nelse\n\
