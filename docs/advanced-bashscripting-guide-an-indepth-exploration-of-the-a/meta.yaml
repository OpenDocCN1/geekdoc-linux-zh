  md: "# Advanced Bash–Scripting Guide\n\n```\n#> Another point of view.\nwhile [\
    \ \"$var1\" != \"end\" ]   #> while test \"$var1\" != \"end\"\n```\n\n+   - Using\
    \ the [$? exit status variable](http://tldp.org/LDP/abs/html/exit-status.html),\
    \ a script may test if a parameter contains only digits, so it can be treated\
    \ as an integer.\n\n```\n#!/bin/bash\n\nSUCCESS=0\nE_BADINPUT=65\n\ntest \"$1\"\
    \ -ne 0 -o \"$1\" -eq 0 2>/dev/null\n# An integer is either equal to 0 or not\
    \ equal to 0.\n# 2>/dev/null suppresses error message.\n\nif [ $? -ne \"$SUCCESS\"\
    \ ]\nthen\n  echo \"Usage: `basename $0` integer-input\"\n  exit $E_BADINPUT\n\
    fi\n\nlet \"sum = $1 + 25\"       # Would give error if $1 not integer.\necho\
    \ \"Sum = $sum\"\n\n# Any variable, not just a command line parameter, can be\
    \ tested this way.\n\nexit 0\n```\n\n+   - The 0 – 255 range for function return\
    \ values is a severe limitation. Global variables and other workarounds are often\
    \ problematic. An alternative method for a function to communicate a value back\
    \ to the main body of the script is to have the function write to `stdout` the\
    \ \"return value\", and assign this to a variable.\n\n# Example 34–6. Return value\
    \ trickery\n\n```\n#!/bin/bash\n# multiplication.sh\n\nmultiply ()           \
    \      # Multiplies params passed.\n{\n\n  local product=1\n\n  until [ -z \"\
    $1\" ]         # Until uses up arguments passed...\n  do\n    let \"product *=\
    \ $1\"\n    shift\n  done\n\n  echo $product             #  Will not echo to stdout,\n\
    }                           #+ since this will be assigned to a variable.\n\n\
    val1=`multiply 15383 25211`\necho \"val1 = $val1\"         # 387820813\n\nval2=`multiply\
    \ 25 5 20`\necho \"val2 = $val2\"         # 2500\n\nval3=`multiply 188 37 25 47`\n\
    echo \"val3 = $val3\"         # 8173300\n```"
