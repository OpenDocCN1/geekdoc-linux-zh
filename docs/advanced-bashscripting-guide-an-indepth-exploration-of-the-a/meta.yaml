  md: "# Advanced Bash–Scripting Guide\n\n```\n#!/bin/bash\n\nENDLESS_LOOP=1\nINTERVAL=1\n\
    \necho\necho \"Hit Control-C to exit this script.\"\necho\n\nwhile [ $ENDLESS_LOOP\
    \ ]\ndo\n  if [ \"$SECONDS\" -eq 1 ]\n  then\n    units=second\n  else\n    units=seconds\n\
    \  fi\n\n  echo \"This script has been running $SECONDS $units.\"\n  sleep $INTERVAL\n\
    done\n\nexit 0\n```\n\n*$SHELLOPTS* — the list of enabled shell [options](https://www.tldp.org/LDP/abs/html/options.html),\
    \ a readonly variable\n\n*$SHLVL* — Shell level, how deeply Bash is nested. If,\
    \ at the command line, $SHLVL is 1, then in a script it will increment to 2.\n\
    \n*$TMOUT* — If the *$TMOUT* environmental variable is set to a non–zero value\
    \ *time*, then the shell prompt will time out after *time* seconds. This will\
    \ cause a logout.\n\n> Unfortunately, this works only while waiting for input\
    \ at the shell prompt console or in an xterm. While it would be nice to speculate\
    \ on the uses of this internal variable for timed input, for example in combination\
    \ with [read](https://www.tldp.org/LDP/abs/html/intandextro.html), *$TMOUT* does\
    \ not work in that context and is virtually useless for shell scripting. (Reportedly\
    \ the *ksh* version of a timed **read** does work).\n\nImplementing timed input\
    \ in a script is certainly possible, but may require complex machinations. One\
    \ method is to set up a timing loop to signal the script when it times out. This\
    \ also requires a signal handling routine to trap (see [Example 30–4](https://www.tldp.org/LDP/abs/html/ex30-4.html))\
    \ the interrupt generated by the timing loop (whew!).\n\n# **Example 9–2. Timed\
    \ Input**"
