    # ## ptx


    The **ptx [targetfile]** command outputs a permuted index (cross–reference list)
    of the targetfile. This may be further filtered and formatted in a pipe, if necessary.


    # ## col


    This deceptively named filter removes reverse line feeds from an input stream.
    It also attempts to replace whitespace with equivalent tabs. The chief use of
    **col** is in filtering the output from certain text processing utilities, such
    as **groff** and **tbl**.


    # ## column


    Column formatter. This filter transforms list–type text output into a "pretty–printed"
    table by inserting tabs at appropriate places.


    # ### Example 12–20. Using column to format a directory listing


    ```

    #!/bin/bash

    # This is a slight modification of the example file in the "column" man page.


    (printf "PERMISSIONS LINKS OWNER GROUP SIZE MONTH DAY HH:MM PROG-NAME\n" \

    ; ls -l | sed 1d) | column -t


    #  The "sed 1d" in the pipe deletes the first line of output,

    #+ which would be "total         N",

    #+ where "N" is the total number of files found by "ls -l".


    # The -t option to "column" pretty-prints a table.


    exit 0

    ```


