  md: '# Advanced Bash–Scripting Guide


    ```

    echo "a = $a "             # Integer, still.

    echo


    b=${a/23/BB}               # Transform into a string.

    echo "b = $b"              # BB35

    declare -i b               # Declaring it an integer doesn''t help.

    echo "b = $b"              # BB35, still.


    let "b += 1"              # BB35 + 1 =

    echo "b = $b"              # 1

    echo


    c=BB34

    echo "c = $c"              # BB34

    d=${c/BB/23}               # Transform into an integer.

    echo "d = $d"              # 2334

    let "d += 1"              # 2334 + 1 =

    echo "d = $d"              # 2335


    # Variables in Bash are essentially untyped.


    exit 0

    ```


    Untyped variables are both a blessing and a curse. They permit more flexibility
    in scripting (enough rope to hang yourself) and make it easier to grind out lines
    of code. However, they permit errors to creep in and encourage sloppy programming
    habits.


    The burden is on the programmer to keep track of what type the script variables
    are. Bash will not do it for you.


    # 5.4. Special Variable Types


    *local variables*


    variables visible only within a code block or function (see also local variables
    in functions)


    *environmental variables*


    variables that affect the behavior of the shell and user interface


    > In a more general context, each process has an "environment", that is, a group
    of variables that hold information that the process may reference. In this sense,
    the shell behaves like any other process.


    Every time a shell starts, it creates shell variables that correspond to its own
    environmental variables. Updating or adding new shell variables causes the shell
    to update its environment, and all the shell''s child processes (the commands
    it executes) inherit this environment.'
