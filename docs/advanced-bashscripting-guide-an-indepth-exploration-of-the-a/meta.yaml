    \n  ((a += 1))   # let \"a+=1\"\n  # Yes, indeed.\n  # Double parentheses permit\
    \ incrementing a variable with C-like syntax.\ndone\n\necho\n\n# Now, C programmers\
    \ can feel right at home in Bash.\n\nexit 0\n```\n\nA **while** loop may have\
