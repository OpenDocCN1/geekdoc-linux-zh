  md: "# Advanced Bash–Scripting Guide\n\n```\n:VIEWDATA\nTYPE C:\\BOZO\\BOOKLIST.TXT\
    \ | MORE\nREM SHOW ENTIRE FILE, 1 PAGE AT A TIME.\n\n:EXIT0\n```\n\nThe script\
    \ conversion is somewhat of an improvement.\n\n# Example H-2. viewdata.sh: Shell\
    \ Script Conversion of VIEWDATA.BAT\n\n```\n#!/bin/bash\n# Conversion of VIEWDATA.BAT\
    \ to shell script.\n\nDATAFILE=/home/bozo/datafiles/book-collection.data\nARGNO=1\n\
    \n# @ECHO OFF      Command unnecessary here.\n\nif [ $# -lt \"$ARGNO\" ]    #\
    \ IF !%1!==! GOTO VIEWDATA\nthen\n  less $DATAFILE       # TYPE C:\\MYDIR\\BOOKLIST.TXT\
    \ | MORE\nelse\n  grep \"$1\" $DATAFILE   # FIND \"%1\" C:\\MYDIR\\BOOKLIST.TXT\n\
    fi\n\nexit 0             # :EXIT0\n\n# GOTOs, labels, smoke-and-mirrors, and flimflam\
    \ unnecessary.\n# The converted script is short, sweet, and clean,\n# which is\
    \ more than can be said for the original.\n```\n\nTed Davis' [Shell Scripts on\
