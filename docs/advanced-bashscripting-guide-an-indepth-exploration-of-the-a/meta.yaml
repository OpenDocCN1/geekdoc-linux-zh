    \ 0    0 SW    0.0  0.0   0:00 keventd\n     ...\n```\n\n## **nice**\n\nRun a\
    \ background job with an altered priority. Priorities run from 19 (lowest) to\
    \ -20 (highest). Only *root* may set the negative (higher) priorities. Related\
    \ commands are **renice**, **snice**, and **skill**.\n\n## **nohup**\n\nKeeps\
    \ a command running even after user logs off. The command will run as a foreground\
    \ process unless followed by &. If you use **nohup** within a script, consider\
    \ coupling it with a **wait** to avoid creating an orphan or zombie process.\n\
    \n## **pidof**\n\nIdentifies *process id* (pid) of a running job. Since job control\
    \ commands, such as [kill](https://tldp.org/LDP/abs/html/intro02.html#KILLREF)\
    \ and **renice** act on the pid of a process (not its name), it is sometimes necessary\
    \ to identify that pid. The **pidof** command is the approximate counterpart to\
    \ the $PPID internal variable.\n\n```\nbash$ **pidof xclock**\n880\n```\n\n###\
    \ **Example 13–4. pidof helps kill a process**\n\n```\n#!/bin/bash\n# kill-process.sh\n\
    \nNOPROCESS=2\n\nprocess=xxxxyyyyzzz  # Use nonexistent process.\n# For demo purposes\
