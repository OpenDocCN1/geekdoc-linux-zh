  md: '# Advanced Bash-Scripting Guide


    usleep


    Microsleep (the "u" may be read as the Greek "mu", or micro prefix). This is the
    same as **sleep**, above, but "sleeps" in microsecond intervals. This can be used
    for fine-grain timing, or for polling an ongoing process at very frequent intervals.


    ```

    usleep 30

    # Pauses 30 microseconds.

    ```


    > The **usleep** command does not provide particularly accurate timing, and is
    therefore unsuitable for critical timing loops.


    hwclock, clock


    The **hwclock** command accesses or adjusts the machine''s hardware clock. Some
    options require root privileges. The `/etc/rc.d/rc.sysinit` startup file uses
    **hwclock** to set the system time from the hardware clock at bootup.


    The **clock** command is a synonym for **hwclock**.


    # 12.4. Text Processing Commands


    Command Listing


    sort


    File sorter, often used as a filter in a pipe. This command sorts a text stream
    or file forwards or backwards, or according to various keys or character positions.
    Using the `-m` option, it merges presorted input files. The *info page* lists
    its many capabilities and options. See [Example 10-9] and [Example 10-10].


    tsort


    Topological sort, reading in pairs of whitespace-separated strings and sorting
    according to input patterns.


    diff, patch


    **diff**: flexible file comparison utility. It compares the target files line-by-line
    sequentially. In some applications, such as comparing word dictionaries, it may
    be helpful to filter the files through [sort] and **uniq** before piping them
    to **diff**. **diff file-1 file-2** outputs the lines in the files that differ,
    with carets showing which file each particular line belongs to.


    The `--side-by-side` option to **diff** outputs each compared file, line by line,
    in separate columns, with non-matching lines marked.


    There are available various fancy frontends for **diff**, such as **spiff**, **wdiff**,
    **xdiff**, and **mgdiff**.'
