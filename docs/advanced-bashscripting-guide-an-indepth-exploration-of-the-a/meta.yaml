    \n    fi\ndone <\"$file\"\n\nexit 0\n```\n\n**sed, awk**\n\nScripting languages\
    \ especially suited for parsing text files and command output. May be embedded\
    \ singly or in combination in pipes and shell scripts.\n\n[sed](sed)\n\nNon–interactive\
    \ \"stream editor\", permits using many **ex** commands in batch mode. It finds\
