  md: "# Advanced Bash–Scripting Guide\n\n```\necho \"Test #2 succeeds.\"\nelse\n\
    \  echo \"Test #2 fails.\"\nfi\n\n#  The -a and -o options provide\n#+ an alternative\
    \ compound condition test.\n#  Thanks to Patrick Callahan for pointing this out.\n\
    \nif [ \"$a\" -eq 24 -a \"$b\" -eq 47 ]\nthen\n  echo \"Test #3 succeeds.\"\n\
    else\n  echo \"Test #3 fails.\"\nfi\n\nif [ \"$a\" -eq 98 -o \"$b\" -eq 47 ]\n\
    then\n  echo \"Test #4 succeeds.\"\nelse\n  echo \"Test #4 fails.\"\nfi\n\na=rhino\n\
    b=crocodile\nif [ \"$a\" = rhino ] && [ \"$b\" = crocodile ]\nthen\n  echo \"\
    Test #5 succeeds.\"\nelse\n  echo \"Test #5 fails.\"\nfi\n\nexit 0\n```\n\nThe\
    \ && and \\|\\| operators also find use in an arithmetic context.\n\n```\nbash$\
    \ echo $(( 1 && 2 )) $((3 && 0)) $((4 \\|\\| 0)) $((0 \\|\\| 0))\n1 0 1 0\n```\n\
    \n# miscellaneous operators\n\n# comma operator\n\nThe **comma operator** chains\
    \ together two or more arithmetic operations. All the operations are evaluated\
    \ (with possible *side effects*, but only the last operation is returned.\n\n\
    ```\nlet \"t1 = ((5 + 3, 7 - 1, 15 - 4))\"\necho \"t1 = $t1\"                #\
    \ t1 = 11\n\nlet \"t2 = ((a = 9, 15 / 3))\"   # Set \"a\" and calculate \"t2\"\
    .\necho \"t2 = $t2    a = $a\"       # t2 = 5     a = 9\n```"
