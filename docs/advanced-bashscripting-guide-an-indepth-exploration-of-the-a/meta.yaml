  md: "# Advanced Bash–Scripting Guide\n\n```\nlet \"index+=1\"\ndone            #\
    \ $* sees all arguments as single word.\necho \"Entire arg list seen as single\
    \ word.\"\n\necho\n\nindex=1\n\necho \"Listing args with \\\"\\$@\\\":\"\nfor\
    \ arg in \"$@\"\ndo\n   echo \"Arg #$index = $arg\"\n   let \"index+=1\"\ndone\
    \            # $@ sees arguments as separate words.\necho \"Arg list seen as separate\
    \ words.\"\n\necho\n\nexit 0\n```\n\nFollowing a **shift**, the `$@` holds the\
    \ remaining command–line parameters, lacking the previous `$1`, which was lost.\n\
    \n```\n#!/bin/bash\n# Invoke with ./scriptname 1 2 3 4 5\n\necho \"$@\"    # 1\
    \ 2 3 4 5\nshift\necho \"$@\"    # 2 3 4 5\nshift\necho \"$@\"    # 3 4 5\n\n\
    # Each \"shift\" loses parameter $1.\n# \"$@\" then contains the remaining parameters.\n\
    ```\n\nThe `$@` special parameter finds use as a tool for filtering input into\
    \ shell scripts. The **cat \"$@\"** construction accepts input to a script either\
    \ from `stdin` or from files given as parameters to the script. See [Example 12–17](Example\
    \ 12–17) and [Example 12–18](Example 12–18).\n\n> The `$*` and `$@` parameters\
    \ sometimes display inconsistent and puzzling behavior, depending on the setting\
