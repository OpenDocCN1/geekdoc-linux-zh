  md: "# Advanced Bash–Scripting Guide\n\nspeeds things up a bit.\n\n**agrep** extends\
    \ the capabilities of **grep** to approximate matching. The search string may\
    \ differ by a specified number of characters from the resulting matches. This\
    \ utility is not part of the core Linux distribution.\n\n> To search compressed\
    \ files, use **zgrep**, **zegrep**, or **zfgrep**. These also work on non–compressed\
    \ files, though slower than plain **grep**, **egrep**, **fgrep**. They are handy\
    \ for searching through a mixed set of files, some compressed, some not.\n\nTo\
    \ search **bzip**ped files, use **bzgrep**.\n\n# look\n\nThe command **look**\
    \ works like **grep**, but does a lookup on a \"dictionary\", a sorted word list.\
    \ By default, **look** searches for a match in /usr/dict/words, but a different\
    \ dictionary file may be specified.\n\n# Example 12–13. Checking words in a list\
    \ for validity\n\n```\n#!/bin/bash\n# lookup: Does a dictionary lookup on each\
    \ word in a data file.\n\nfile=words.data  # Data file from which to read words\
    \ to test.\n\necho\n\nwhile [ \"$word\" != end ]  # Last word in data file.\n\
    do\n  read word     # From data file, because of redirection at end of loop.\n\
    \  look $word > /dev/null  # Don't want to display lines in dictionary file.\n\
    \  lookup=$?     # Exit status of 'look' command.\n\n  if [ \"$lookup\" -eq 0\
    \ ]\n  then\n    echo \"\\\"$word\\\" is valid.\"\n  else\n    echo \"\\\"$word\\\
    \" is invalid.\"\n  fi\ndone <\"$file\"   # Redirects stdin to $file, so \"reads\"\
    \ come from there.\n\necho\n\nexit 0\n\n# ---------------------------------------------------------------------------\n\
    # Code below line will not execute because of \"exit\" command above.\n\n# Stephane\
    \ Chazelas proposes the following, more concise alternative:\n\nwhile read word\
    \ && [[ $word != end ]]\n```"
