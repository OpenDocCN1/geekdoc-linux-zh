  md: "Shows and/or changes terminal settings. This complex command, used in a script,\
    \ can control terminal behavior and the way output displays. See the info page,\
    \ and study it carefully.\n\n# Example 13–1. setting an erase character\n\n```\n\
    #!/bin/bash\n# erase.sh: Using \"stty\" to set an erase character when reading\
    \ input.\n\necho -n \"What is your name? \"\nread name\t\t\t# Try to erase characters\
    \ of input.\n\t\t\t\t\t# Won't work.\necho \"Your name is $name.\"\n\nstty erase\
    \ '#'\t\t\t# Set \"hashmark\" (#) as erase character.\necho -n \"What is your\
    \ name? \"\nread name\t\t\t# Use # to erase last character typed.\necho \"Your\
    \ name is $name.\"\n\nexit 0\n```\n\n# Example 13–2. secret password: Turning\
    \ off terminal echoing\n\n```\n#!/bin/bash\n\necho\necho -n \"Enter password \"\
    \nread passwd\necho \"password is $passwd\"\necho -n \"If someone had been looking\
    \ over your shoulder, \"\necho \"your password would have been compromised.\"\n\
    \necho && echo  # Two line-feeds in an \"and list\".\n\nstty -echo    # Turns\
    \ off screen echo.\n\necho -n \"Enter password again \"\nread passwd\necho\necho\
    \ \"password is $passwd\"\necho\n\nstty echo     # Restores screen echo.\n\nexit\
    \ 0\n```\n\nA creative use of **stty** is detecting a user keypress (without hitting\
    \ **ENTER**).\n\n# Example 13–3. Keypress detection\n\n```\n#!/bin/bash\n# keypress.sh:\
    \ Detect a user keypress (\"hot keyboard\").\n\necho\n\nold_tty_settings=$(stty\
    \ -g)   # Save old settings.\nstty -icanon\n```"
  merge: -1
