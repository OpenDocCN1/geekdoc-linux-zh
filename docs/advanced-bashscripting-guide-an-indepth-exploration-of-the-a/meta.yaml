    # $PPID


    The $PPID of a process is the process id (pid) of its parent process. [18]


    Compare this with the [pidof](pidof) command.


    # $PS1


    This is the main prompt, seen at the command line.


    # $PS2


    The secondary prompt, seen when additional input is expected. It displays as ">".


    # $PS3


    The tertiary prompt, displayed in a [select](select) loop (see [Example 10-28](Example
    10-28)).


    # $PS4


    The quarternary prompt, shown at the beginning of each line of output when invoking
    a script with the [-x option](-x option). It displays as "+".


    # $PWD


    working directory (directory you are in at the time)


    This is the analog to the [pwd](pwd) builtin command.


    ```

    #!/bin/bash


    E_WRONG_DIRECTORY=73


