  md: "# # Chapter 34. Miscellany\n\n> Nobody really knows what the Bourne shell's\
    \ grammar is. Even examination of the source code is little help.\n\n— Tom Duff\n\
    \n# ## 34.1. Interactive and non–interactive shells and scripts\n\nAn *interactive*\
    \ shell reads commands from user input on a `tty`. Among other things, such a\
    \ shell reads startup files on activation, displays a prompt, and enables job\
    \ control by default. The user can *interact* with the shell.\n\nA shell running\
    \ a script is always a non–interactive shell. All the same, the script can still\
    \ access its `tty`. It is even possible to emulate an interactive shell in a script.\n\
    \n```\n#!/bin/bash\nMY_PROMPT='$ '\nwhile :\ndo\n   echo -n \"$MY_PROMPT\"\n \
    \  read line\n   eval \"$line\"\n   done\n\nexit 0\n\n# This example script, and\
    \ much of the above explanation supplied by\n# Stephane Chazelas (thanks again).\n\
    ```\n\nLet us consider an *interactive* script to be one that requires input from\
    \ the user, usually with `read` statements (see Example 11–2). \"Real life\" is\
    \ actually a bit messier than that. For now, assume an interactive script is bound\
    \ to a tty, a script that a user has invoked from the console or an xterm.\n\n\
    Init and startup scripts are necessarily non–interactive, since they must run\
    \ without human intervention. Many administrative and system maintenance scripts\
    \ are likewise non–interactive. Unvarying repetitive tasks cry out for automation\
    \ by non–interactive scripts.\n\nNon–interactive scripts can run in the background,\
    \ but interactive ones hang, waiting for input that never comes. Handle that difficulty\
    \ by having an **expect** script or embedded [here document](https://tldp.org/LDP/abs/html/here-docs.html)\
    \ feed input to an interactive script running as a background job. In the simplest\
    \ case, redirect a file to supply input to a `read` statement (`read variable\
    \ <file`). These particular workarounds make possible general purpose scripts\
    \ that run in either interactive or non–interactive modes.\n\nIf a script needs\
    \ to test whether it is running in an interactive shell, it is simply a matter\
    \ of finding whether the *prompt* variable, `$PS1`, is set. (If the user is being\
    \ prompted for input, then the script needs to display a prompt.)\n\n```\nif [\
    \ -z $PS1 ] # no prompt?\nthen\n```"
  merge: -1
  pgno: 316
- img_proc: false
  md: "```\n# non-interactive\n...\nelse\n  # interactive\n  ...\nfi\n```\n\nAlternatively,\
    \ the script can test for the presence of option \"i\" in the `$-` flag.\n\n```\n\
    case $- in\n*i*)     # interactive shell\n;;\n*)       # non-interactive shell\n\
    ;;\nesac\n# (Thanks to \"UNIX F.A.Q.\", 1993)\n```\n\nScripts may be forced to\
    \ run in interactive mode with the `-i` option or with a `#!/bin/bash -i` header.\
    \ Be aware that this can cause erratic script behavior or show error messages\
    \ even when no error is present.\n\n# 34.2. Shell Wrappers\n\nA \"wrapper\" is\
    \ a shell script that embeds a system command or utility, that saves a set of\
    \ parameters passed to that command. Wrapping a script around a complex command\
    \ line simplifies invoking it. This is especially useful with [sed](http://tldp.org/LDP/abs/html/sed.html)\
    \ and [awk](http://tldp.org/LDP/abs/html/awk.html).\n\nA **sed** or **awk** script\
    \ would normally be invoked from the command line by a `sed -e 'commands'` or\
    \ `awk 'commands'`. Embedding such a script in a Bash script permits calling it\
    \ more simply, and makes it \"reusable\". This also enables combining the functionality\
    \ of **sed** and **awk**, for example [piping](http://tldp.org/LDP/abs/html/special-chars.html)\
    \ the output of a set of **sed** commands to **awk**. As a saved executable file,\
    \ you can then repeatedly invoke it in its original form or modified, without\
    \ the inconvenience of retyping it on the command line.\n\n# Example 34–1. shell\
    \ wrapper\n\n```\n#!/bin/bash\n\n# This is a simple script that removes blank\
    \ lines from a file.\n# No argument checking.\n\n# Same as\n#   sed -e '/^$/d'\
    \ filename\n# invoked from the command line.\n\nsed -e /^$/d \"$1\"\n# The '-e'\
    \ means an \"editing\" command follows (optional here).\n# '^' is the beginning\
    \ of line, '$' is the end.\n# This match lines with nothing between the beginning\
    \ and the end,\n#+ blank lines.\n# The 'd' is the delete command.\n\n# Quoting\
    \ the command-line arg permits\n#+ whitespace and special characters in the filename.\n\
    ```"
  merge: -1
  pgno: 317
- img_proc: false
  md: "# Advanced Bash-Scripting Guide\n\n```\nexit 0\n```\n\n# Example 34–2. A slightly\
    \ more complex shell wrapper\n\n```\n#!/bin/bash\n\n# \"subst\", a script that\
    \ substitutes one pattern for\n# another in a file,\n# i.e., \"subst Smith Jones\
    \ letter.txt\".\n\nARGS=3\nE_BADARGS=65   # Wrong number of arguments passed to\
    \ script.\n\nif [ $# -ne \"$ARGS\" ]\n# Test number of arguments to script (always\
    \ a good idea).\nthen\n  echo \"Usage: `basename $0` old-pattern new-pattern filename\"\
    \n  exit $E_BADARGS\nfi\n\nold_pattern=$1\nnew_pattern=$2\n\nif [ -f \"$3\" ]\n\
    then\n    file_name=$3\nelse\n    echo \"File \\\"$3\\\" does not exist.\"\n \
    \   exit $E_BADARGS\nfi\n\n# Here is where the heavy work gets done.\nsed -e \"\
    s/$old_pattern/$new_pattern/g\" $file_name\n# 's' is, of course, the substitute\
    \ command in sed,\n# and /pattern/ invokes address matching.\n# The \"g\", or\
    \ global flag causes substitution for *every*\n# occurence of $old_pattern on\
    \ each line, not just the first.\n# Read the literature on 'sed' for a more in-depth\
    \ explanation.\n\nexit 0    # Successful invocation of the script returns 0.\n\
    ```\n\n# Example 34–3. A shell wrapper around an awk script\n\n```\n#!/bin/bash\n\
    \n# Adds up a specified column (of numbers) in the target file.\n\nARGS=2\nE_WRONGARGS=65\n\
    \nif [ $# -ne \"$ARGS\" ] # Check for proper no. of command line args.\nthen\n\
    \   echo \"Usage: `basename $0` filename column-number\"\n   exit $E_WRONGARGS\n\
    fi\n\nfilename=$1\ncolumn_number=$2\n```"
