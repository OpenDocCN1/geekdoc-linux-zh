  md: "# Advanced Bash–Scripting Guide\n\nMixing up = and *-eq* in a test. Remember,\
    \ = is for comparing literal variables and *-eq* for integers.\n\n```\nif [ \"\
    $a\" = 273 ]     # Is $a an integer or string?\nif [ \"$a\" -eq 273 ]   # If $a\
    \ is an integer.\n\n# Sometimes you can mix up -eq and = without adverse consequences.\n\
    # However...\n\na=273.0    # Not an integer.\n\nif [ \"$a\" = 273 ]\nthen\n  echo\
    \ \"Comparison works.\"\nelse\n  echo \"Comparison does not work.\"\nfi     #\
    \ Comparison does not work.\n\n# Same with   a=\" 273\"  and a=\"0273\".\n\n#\
    \ Likewise, problems trying to use \"-eq\" with non-integer values.\n\nif [ \"\
    $a\" -eq 273.0 ]\nthen\n  echo \"a = $a\"\nfi   # Aborts with an error message.\n\
    # test.sh: [: 273.0: integer expression expected\n```\n\nMixing up [integer](integer)\
    \ and [string comparison](string comparison) operators.\n\n```\n#!/bin/bash\n\
    # bad-op.sh\n\nnumber=1\n\nwhile [ \"$number\" < 5 ]    # Wrong! Should be  while\
    \ [ \"number\" -lt 5 ]\ndo\n  echo -n \"$number \"\n  let \"number += 1\"\ndone\n\
    \n# Attempt to run this bombs with the error message:\n# bad-op.sh: 5: No such\
    \ file or directory\n```\n\nSometimes variables within \"test\" brackets ([ ])\
    \ need to be quoted (double quotes). Failure to do so may cause unexpected behavior.\
    \ See [Example 7-5](Example 7-5), [Example 16-2](Example 16-2), and [Example 9-6](Example\
    \ 9-6).\n\nCommands issued from a script may fail to execute because the script\
    \ owner lacks execute permission for them. If a user cannot invoke a command from\
    \ the command line, then putting it into a script will likewise fail. Try changing\
    \ the attributes of the command in question, perhaps even setting the suid bit\
    \ (as root, of course).\n\nAttempting to use – as a redirection operator (which\
    \ it is not) will usually result in an unpleasant surprise.\n\n```\ncommand1 2>\
    \ - | command2  # Trying to redirect error output of command1 into a pipe...\n\
    #    ...will not work.\n```"
  merge: -1
