  md: "# Chapter 25. List Constructs\n\nThe \"and list\" and \"or list\" constructs\
    \ provide a means of processing a number of commands consecutively. These can\
    \ effectively replace complex nested **if/then** or even **case** statements.\n\
    \n# Chaining together commands\n\n*and list*\n\n```\ncommand-1 && command-2 &&\
    \ command-3 && ... command-n\n```\n\nEach command executes in turn provided that\
    \ the previous command has given a return value of true (zero). At the first false\
    \ (non-zero) return, the command chain terminates (the first command returning\
    \ false is the last one to execute).\n\n# Example 25-1. Using an \"and list\"\
    \ to test for command-line arguments\n\n```\n#!/bin/bash\n# \"and list\"\n\nif\
    \ [ ! -z \"$1\" ] && echo \"Argument #1 = $1\" && [ ! -z \"$2\" ] && echo \"Argument\
    \ #2 = $2\"\nthen\n  echo \"At least 2 arguments passed to script.\"\n  # All\
    \ the chained commands return true.\nelse\n  echo \"Less than 2 arguments passed\
    \ to script.\"\n  # At least one of the chained commands returns false.\nfi\n\
    # Note that \"if [ ! -z $1 ]\" works, but its supposed equivalent,\n#  if [ -n\
    \ $1 ] does not. However, quoting fixes this.\n#  if [ -n \"$1\" ] works.  Careful!\n\
    # It is best to always quote tested variables.\n\n# This accomplishes the same\
    \ thing, using \"pure\" if/then statements.\nif [ ! -z \"$1\" ]\nthen\n  echo\
    \ \"Argument #1 = $1\"\nfi\nif [ ! -z \"$2\" ]\nthen\n  echo \"Argument #2 = $2\"\
    \n  echo \"At least 2 arguments passed to script.\"\nelse\n  echo \"Less than\
    \ 2 arguments passed to script.\"\nfi\n# It's longer and less elegant than using\
    \ an \"and list\".\n\nexit 0\n```\n\n# Example 25-2. Another command-line arg\
    \ test using an \"and list\"\n\n```\n#!/bin/bash\n\nARGS=1        # Number of\
    \ arguments expected.\n```"
  merge: -1
  pgno: 274
- img_proc: false
  md: "# Advanced Bash–Scripting Guide\n\n```\nE_BADARGS=65  # Exit value if incorrect\
    \ number of args passed.\n\ntest $# -ne $ARGS && echo \"Usage: `basename $0` $ARGS\
    \ argument(s)\" && exit $E_BADARGS\n# If condition-1 true (wrong number of args\
    \ passed to script),\n# then the rest of the line executes, and script terminates.\n\
    \n# Line below executes only if the above test fails.\necho \"Correct number of\
    \ arguments passed to this script.\"\n\nexit 0\n\n# To check exit value, do a\
    \ \"echo $?\" after script termination.\n```\n\n*or list*\n\n```\ncommand-1 ||\
    \ command-2 || command-3 || ... command-n\n```\n\nEach command executes in turn\
    \ for as long as the previous command returns false. At the first true return,\
    \ the command chain terminates (the first command returning true is the last one\
    \ to execute). This is obviously the inverse of the \"and list\".\n\n# Example\
    \ 25–3. Using \"or lists\" in combination with an \"and list\"\n\n```\n#!/bin/bash\n\
    \n# \"Delete\", not-so-cunning file deletion utility.\n# Usage: delete filename\n\
    \nE_BADARGS=65\n\nif [ -z \"$1\" ]\nthen\n  echo \"Usage: `basename $0` filename\"\
    \n  exit $E_BADARGS\nfi\n\n\nfile=$1  # Set filename.\n\n[ ! -f \"$1\" ] && echo\
    \ \"File \\\"$1\\\" not found. \\\nCowardly refusing to delete a nonexistent file.\"\
    \n# AND LIST, to give error message if file not present.\n# Note echo message\
    \ continued on to a second line with an escape.\n\n[ ! -f \"$1\" ] || (rm -f $1;\
    \ echo \"File \\\"$file\\\" deleted.\")\n# OR LIST, to delete file if present.\n\
    # ( command1 ; command2 ) is, in effect, an AND LIST variant.\n\n# Note logic\
    \ inversion above.\n# AND LIST executes on true, OR LIST on false.\n\nexit 0\n\
    ```\n\n> If the first command in an \"or list\" returns true, it *will* execute.\n\
    \n> The [exit status](https://tldp.org/LDP/abs/html/exit-status.html) of an **and\
    \ list** or an **or list** is the exit status of the last command executed."
