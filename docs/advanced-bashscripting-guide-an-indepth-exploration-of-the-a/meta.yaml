    # $LC_COLLATE


    Often set in the `.bashrc` or `/etc/profile` files, this variable controls collation
    order in filename expansion and pattern matching. If mishandled, `LC_COLLATE`
    can cause unexpected results in [filename globbing](filename_globbing).


    As of version 2.05 of Bash, filename globbing no longer distinguishes between
    lowercase and uppercase letters in a character range between brackets. For example,
    **ls [A-M]*** would match both `File1.txt` and `file1.txt`. To revert to the customary
    behavior of bracket matching, set `LC_COLLATE` to `C` by an **export LC_COLLATE=C**
    in `/etc/profile` and/or `~/.bashrc`.


