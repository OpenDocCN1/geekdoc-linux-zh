  md: "# Advanced Bash–Scripting Guide\n\n```\ntcsh% echo $SHELL\n/bin/tcsh\ntcsh%\
    \ echo $TERM\nrxvt\n\nbash$ echo $LOGNAME\nbozo\nbash$ echo $SHELL\n/bin/tcsh\n\
    bash$ echo $TERM\nrxvt\n```\n\n# Positional Parameters\n\n$0, $1, $2, *etc.*\n\
    \npositional parameters, passed from command line to script, passed to a function,\
    \ or `set` to a variable (see [Example 5–5] and [Example 11–10])\n\n$#\n\nnumber\
    \ of command line arguments [19] or positional parameters (see [Example 34–2])\n\
    \n$*\n\nAll of the positional parameters, seen as a single word\n\n$@\n\nSame\
    \ as $*, but each parameter is a quoted string, that is, the parameters are passed\
    \ on intact, without interpretation or expansion. This means, among other things,\
    \ that each parameter in the argument list is seen as a separate word.\n\n# Example\
    \ 9–6. arglist: Listing arguments with $* and $@\n\n```\n#!/bin/bash\n# Invoke\
    \ this script with several arguments, such as \"one two three\".\n\nE_BADARGS=65\n\
    \nif [ ! -n \"$1\" ]\nthen\n  echo \"Usage: `basename $0` argument1 argument2\
    \ etc.\"\n  exit $E_BADARGS\nfi\n\necho\n\nindex=1\n\necho \"Listing args with\
    \ \\\"\\$*\\\":\"\nfor arg in \"$*\"  # Doesn't work properly if \"$*\" isn't\
    \ quoted.\ndo\n  echo \"Arg #$index = $arg\"\n```"
