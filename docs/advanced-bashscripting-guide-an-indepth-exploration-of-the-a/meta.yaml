    # B.2. Awk


    **Awk** is a full–featured text processing language with a syntax reminiscent
    of **C**. While it possesses an extensive set of operators and capabilities, we
    will cover only a couple of these here – the ones most useful for shell scripting.


    Awk breaks each line of input passed to it into *fields*. By default, a field
    is a string of consecutive characters separated by [whitespace](https://tldp.org/LDP/abs/html/whitespace.html),
    though there are options for changing the delimiter. Awk parses and operates on
    each separate field. This makes awk ideal for handling structured text files,
    especially tables, data organized into consistent chunks, such as rows and columns.


    Strong quoting (single quotes) and curly brackets enclose segments of awk code
    within a shell script.


    ```

    awk ''{print $3}'' $filename

    # Prints field #3 of file $filename to stdout.

    ```'
