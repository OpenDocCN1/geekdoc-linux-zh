  md: '# Advanced Bash–Scripting Guide


    +   * David Medinets, *Unix Shell Programming Tools*, McGraw–Hill, 1999, 0070397333.


    Good info on shell scripting, with examples, and a short intro to Tcl and Perl.


    +   * Cameron Newham and Bill Rosenblatt, *Learning the Bash Shell*, 2nd edition,
    O''Reilly and Associates, 1998, 1–56592–347–2.


    This is a valiant effort at a decent shell primer, but somewhat deficient in coverage
    on programming topics and lacking sufficient examples.


    +   * Anatole Olczak, *Bourne Shell Quick Reference Guide*, ASP, Inc., 1991, 093573922X.


    A very handy pocket reference, despite lacking coverage of Bash–specific features.


    +   * Jerry Peek, Tim O''Reilly, and Mike Loukides, *Unix Power Tools*, 2nd edition,
    O''Reilly and Associates, Random House, 1997, 1–56592–260–3.


    Contains a couple of sections of very informative in–depth articles on shell programming,
    but falls short of being a tutorial. It reproduces much of the regular expressions
    tutorial from the Dougherty and Robbins book, above.


    +   * Clifford Pickover, *Computers, Pattern, Chaos, and Beauty*, St. Martin''s
    Press, 1990, 0–312–04123–3.


    A treasure trove of ideas and recipes for computer–based exploration of mathematical
    oddities.


    +   * Arnold Robbins, *Bash Reference Card*, SSC, 1998, 1–58731–010–5.


    Excellent Bash pocket reference (don''t leave home without it). A bargain at $4.95,
    but also available for free download on–line in pdf format.'
