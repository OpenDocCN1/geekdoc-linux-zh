    OS, to the raw hard drive as an image.


    ```

    dd if=/dev/fd0 of=/home/bozo/projects/floppy.img

    ```


    Other applications of dd include initializing temporary swap files (Example 29–2)
    and ramdis (Example 29–3). It can do a low-level copy of an entire drive partition,
    although this is not necessarily recommended.


    People who have nothing better to do (with their time) are constantly thinking
    of interesting applications of dd.


