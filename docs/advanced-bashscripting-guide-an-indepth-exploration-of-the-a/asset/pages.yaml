    | | command invoked cannot | permission problem or command is not an executable
    |

    |---|---|---||

    | 127 | "command not found" | possible with $PATH or a typo |

    | 128 | invalid argument to exit | exit 3.14159 | exit takes only integer args
    in the range 0 – 255 |

    | 128+n | fatal error signal "n" | kill –9 $PPIDof | $? returns 137 (128 + 9)
    |

    | 130 | script terminated by Control-C | | Control-C is fatal error signal 2,
    (130 = 128 + 2, see above) |

    | 255* | exit status out of range | exit –1 | exit takes only integer args in
    the range 0 – 255 |


    According to the table, exit codes 1 – 2, 126 – 165, and 255 [661] have special
    meanings, and therefore should be avoided as user-specified exit parameters. Ending
    a script with exit 127 would certainly cause confusion when troubleshooting (the
    error "command not found" or a user-defined?). However, many scripts use exit
    1 as a general bailout out. Exit code 1 signifies so many errors, this might not
    add any ambiguity, but on the other hand, it would not be very informative.


    There has been attempt to systematize exit status numbers (see /usr/include/sysext.h),
    which is intended mostly for C and C++ programs. It would help to support a more
    standard for scripts. The author of this document restricts user-defined exit
    codes to the range 64 – 113 (in addition to 0, for success), to conform with the
    C/C++ standard. This would still leave 50 value codes, and make troubleshooting
    scripts more straightforward.


    All user-defined examples in the document now conform to this standard, except
    where overriding circumstances exist, as in Example 9–2.


    > Issuing a $? from the command line after a shell script exits results consistent
    with the table above only from the Bash or sh script. Running the C–shell or tsh
    may give different values in some cases.


    # # Appendix D. A Detailed Introduction to I/O and I/O Redirection


    written by Stephanie Chazelas, and revised by the document author


    A command expects the first three file descriptors to be available. The first,
    fd 0 (standard input, stdin), is for reading. The other two (fd 1, stdout and
    fd 2, stderr) are for writing.


    There is a stdin, stdout, and a stderr associated with each command. 1s 2>$1 means
    connecting the stderr of the command to the "resource" as the shell’s stdout.


    Appendix D. A Detailed Introduction to I/O and I/O Redirection


