  md: '# Advanced Bash–Scripting Guide


    Invoking **builtin** `BUILTIN_COMMAND` runs the command "BUILTIN_COMMAND" as a
    shell `builtin`, temporarily disabling both functions and external system commands
    with the same name.


    enable


    This enables or disables a shell builtin command. For an example, `enable -n`
    kills the shell builtin `kill`, so when Bash subsequently encounters kill, it
    invokes `/bin/kill`.


    The `-a` option to enable lists all the shell builtins, indicating whether or
    not they are enabled. The `-f` filename option enables load as a shared library
    (DLL) module from a properly compiled object file. [127]


    autoload


    This is a port to Bash of the **ksh** autoloader. With `autoload` in place, a
    function with "autoload" declaration will load from an external file at its first
    invocation. [28] This saves system resources.


    Note that `autoload` is not part of the core Bash installation. It needs to be
    loaded in `enable -f`


