    The words "argument" and "parameter" are often used interchangeably. In the context
    of the document, they have the same precise meaning, of a variable passed to a
    script or function.


    This applies to line arguments or parameters passed to a `function`.


    If $Parameter is null in a non-interactive script, it will terminate with a `127
    exit status` (the Bash error code for "command not found")


    These are shell `builtins`, whereas other loop commands, as `while` and `case`,
    provide `keywords`.


    This is for performance (builtins execute much faster than external commands,
    which usually require `forking for a process`) or because a particular builtin
    needs direct access to the shell internals.


    An exception to this is the `time` command, listed in the official Bash documentation
    as a keyword.


    A option is an argument that acts as a `flag`, switching behaviors on or off.
    The argument associated with a particular option indicates the behavior that the
    option (switches) goes on or off.


    When a command or the shell itself initiates (or spawns) a new subprocess to carry
    out a task, this is called `forking`. This new process is the `"child"`, and the
    process that `forked` off is the `"parent"`. While the child process is doing
    its work, the parent process is still running.


