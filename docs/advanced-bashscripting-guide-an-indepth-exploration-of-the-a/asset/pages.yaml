    \nOf the two, bc seems more useful in scripting. It is a fairly well-behaved UNIX\
    \ utility, and may be used in a pipe.\n\nBash can't handle floating point calculations,\
    \ and it lacks operators for certain important mathematical functions. Fortunately,\
    \ bc comes to the rescue.\n\nHere is a simple template for bc to calculate a script\
    \ variable. This uses command substitution.\n\n```\nvariable=$(echo \"OPTIONS;\
    \ OPERATIONS\" | bc)\n```\n\nExample 12–30. Monthly Payment on a Mortgage\n\n\
    ```\n#!/bin/bash\n# monthlypayment.sh: Calculates monthly payment on a mortgage.\n\
    \n# This is a modification of code in the \"mcalc\" (mortage calculator) package,\n\
    # by Jeff Schmidt and Mendel Cooper (yours truly, the author of this document).\n\
    # http://www.ibiblio.org/pub/Linux/apps/financial/mcalc-1.6.tar.gz [15k]\necho\n\
    echo \"Given the principal, interest rate, and term of a mortgage,\"\necho \"\
    calculate the monthly payment.\"\n\nbottom=1.0\necho\necho -n \"Enter principal\
    \ (no commas) \" \nread principal\necho -n \"Enter interest rate (percent) \"\
    \ # If El,12%, enter \"12\", not \".12\".\nread interest_r\necho -n \"Enter term\
    \ (months) \" \nread term\n\ninterest_r=$(echo scale=9; $interest_r/100.0\" |\
    \ bc) # Convert to decimal.\n# scale determines how many decimal places.\n\ninterest_rate=$(echo\
    \ scale=9; $interest_r/12 + 1.0\" | bc)\n\ntop=$(echo scale=9; $principal*$interest_rate$term\"\
    \ | bc)\necho; echo \"Please be patient. This may take a while.\"\n\nlet months=$term\
    \ - 1\nfor ((x=$months; x > 0; x--));\ndo\nbot=$(echo scale=9; $interest_rate^$x\"\
    \ | bc)\nbottom=$(echo scale=9; $bottom+$bot\" | bc)\n# bottom = $(($bottom +bot))\n\
