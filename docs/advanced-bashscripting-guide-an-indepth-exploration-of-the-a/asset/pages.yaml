    Trace the route taken by packets sent to a remote host. This command works in
    LAN, WAN, or over the Internet. The remote host may be specified by an IP address.
    The output of this command may be filtered by grep or sed in a pipe.


    # ping


    Broadcast an (ICMP ECHO_REQUEST) packet to other machines, either on a local or
    remote network. This is a diagnostic tool for testing network connections, and
    it should be used with caution.


    A successful ping returns exit status of 0. This can be used in a script.


