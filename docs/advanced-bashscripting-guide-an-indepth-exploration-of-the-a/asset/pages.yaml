    Identifies the shell hardware.


    ```

    bash$ echo $MACHCTYPE

    i686-debian-linux-gnu

    ```


    $OLDPWD


    old working directory ("OLD-print-working-directory", previous directory you were
    in)


    $OSTYPE


    operating system type


    ```

    bash$ echo $OSTYPE

    linux-gnu

    ```


    $PATH


    path to binaries, usually /usr/bin/, /usr/X1R6/bin/, /usr/local/bin/, etc.


    When given a command, the shell automatically does a hash search on the directories
    listed in

    the for the executable. The path is stored in the environmental variable, $PATH,
    a list of

    direct, separated by commas. The system stores the $PATH definition in

    /etc/profile and/or ~/.bashrc (Chapter 27).


    ```

    bash$ echo $PATH

    /bin:/usr/local/bin:/usr/X1R6/bin:/sbin:/usr/sbin

    ```


    PATH=$PATH: /opt/bin appends the /opt/bin directory to the current path. In a
    script,

    it may be expedient to temporarily add a directory to the path in this way. When
    a script exits, it

    restores the original $PATH (a child process, such as a script, may not change
    the environment of the

    parent process, the shell).


    ![](img/1ce1edffaa36e4f698a85430e71c6d3b_72_0.png)


    The current "working directory". . /. , is usually

    omitted from the $PATH as a security measure.


