  md: '# Advanced Bash-Scripting Guide


    ```

    ERRORFILE-script.errors


    bad_command1 2>$ERRORFILE      # Error message sent to $ERRORFILE.

    bad_command2 2>>$ERRORFILE # Error message appended to $ERRORFILE.

    bad_command3                # Error message echoed to stderr,

    +# and not appear in $ERRORFILE.


    # These redirection commands also automatically "reset" after each line.

    ==================================================================================

    ```


    ```

    2>&1

    # Redirects stderr to stdout.

    # Error messages get sent to same place as standard output

    ```


    ```

    i>j

    # Redirects file descriptor i to j.

    # All output of file pointed to by i gets sent to file pointed to j.

    ```


    ```

    >j

    # Redirects, by default, file descriptor 1 (stdout) to j.

    # All stdout gets sent to file pointed to j.

    ```


    ```

    0<


    # Accept input from a file.

    # Companion command to ">", and often used in combination with it.

    # grep search-word <filename

    ```


    ```

    [j]<filename

    # Open file "filename" for reading and writing, and assign file descriptor "j"
    to it.

    # If "filename" does not exist, create it.

    # If file descriptor "j" is not specified, default to fd 0, stdin.


    # An application of this is writing at a specified place in a file.

    echo 1234567890 > File # Write string to "File".

    exec 3<4 File # Open "File" and assign fd 3 to it.

    read -n 4 <3 # Read only 4 characters.

    echo -n . >&3 # Write a decimal point there.

    exec 3->4 # Close fd 3.

    cat File == 1234.67890

    # Random access, by golly.

    ```


    ```

    |# Pipe.

    # General purpose process and command chaining tool.

    # Similar to ">", but more general in effect.

    # Useful for chaining commands, scripts, files, and programs together.

    cat .txt | sort | uniq result-file

    # Sorts the output of all .txt files and deletes duplicate lines

    # finally saves results to "result-file"

    ```


    Multiple instances of input and output redirection/or pipes can be combined in
    a single command line.


    ```

    command <input-file >output-file

    command1|command2|command3 >output-file

    ```


    Chapter 16. I/O Redirection'
