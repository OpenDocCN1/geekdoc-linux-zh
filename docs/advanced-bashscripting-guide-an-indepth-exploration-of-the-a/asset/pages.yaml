- pgno: 12
  md: '# Chapter 3. Exit and Exit Status


    ...there are dark corners in the Bourne shell, and people use all of them.


    Bret Ramey


    The exit command may be used to terminate a script, just as in a C program. It
    can also return a value, which is available to the script''s parent process.


    Every command returns an exit status (sometimes referred to as a return status
    ). A successful command returns a 0, while an unsuccessful one returns a non–zero
    value that usually may be interpreted as an error code. Well-behaved UNIX commands,
    programs, and utilities return a 0 exit code upon completion, though there are
    some exceptions.


    Likewise, functions within a script and the script itself return an exit status.
    The last command executed in the function or script determines the exit status.
    Within a script, an exit may be used to deliver an nnn exit status to the shell
    (nnn must be a decimal number in the 0–255 range).


    ![](img/1ce1edffaa36e4f698a85430e71c6d3b_12_0.png)


    When a script ends with an exit that has no parameter, the exit status of the
    script is the exit status of the last command executed in the script (not counting
    the exit).


    $ reads the exit status of the last command executed. After a function, $ gives
    the exit status of the last command executed. In Bash''s way of giving functions
    a “return value”. After a script terminates, a $ from the command line gives the
    exit status of the script, the last command executed in the script, which is by
    convention, 0 on success or an integer in the range 1–255 on error.


    # Example 3–1. exit / exit status


    ```

    #!/bin/bash

    echo hello

    echo $ # Exit status 0 returned because command executed successfully.

    lsdkf # Unrecognized command.

    echo $ # Non-zero exit status returned because command failed to execute.

    echo

    exit 113 # Will return 113 to shell.

    # To verify this, type "echo $?"" after script terminates.


    # By convention, an ''exit 0'' indicates success,

    +# while a non-zero exit value means an error or anomalous condition.

    ```


    $ is especially useful for testing the result of a command in a script (Example
    12–8 and Example 12–13).


    ![](img/1ce1edffaa36e4f698a85430e71c6d3b_12_1.png)'
  merge: -1
  img_proc: true
- pgno: 13
  md: "The logical \"not\" qualifier reverses the outcome of a test or command, and\
    \ this affects its [exit status](exit status).\n\n# Example 3–2. Negating a condition\
    \ using !\n\n```\ntrue # the \"true\" builtin. \necho \"exit status of \\true\\\
    \" = \\$?  # 0\n\n! true\necho \"exit status of \\!true\\\" = \\$?  # 1\n# Note\
    \ that the \"!\" needs a space.\n# !true leads to a \"command not found\" error\n\
    # Thanks, S.C.\n```\n\nCertain exit status codes have [reserved meanings](reserved\
    \ meanings) and should not be user-specified in a script."
