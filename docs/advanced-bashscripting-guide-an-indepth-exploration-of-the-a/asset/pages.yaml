    \ argument list, including whitespace)\n\necho\n\nexit 0\n```\n\nIt is possible\
    \ to use command substitution to generate the [list] in a for loop. See Also Example\
    \ 12–34, Example 10–10 and Example 12–31.\n\n# Example 10–6. Generating the [list]\
    \ in a for loop with command substitution\n\n```\n#!/bin/bash\n# A for-loop with\
    \ [list] generated by command substitution.\n\nNUMBERS=\"9 7 3 8 37.53\"\n\nfor\
    \ number in `echo $NUMBERS` # for number in 9 7 3 8 37.53\ndo\n    echo -n \"\
    $number \"\ndone\necho\nexit 0\n```\n\nThis is a somewhat complex example using\
    \ command substitution to create the [list].\n\n# Example 10–7. grep replacement\
    \ for binary files\n\n```\n#!/bin/bash\n# bin-grep.sh Locates matching strings\
    \ in a binary file.\n\n# A \"grep\" replacement for binary files.\n# Similar effect\
