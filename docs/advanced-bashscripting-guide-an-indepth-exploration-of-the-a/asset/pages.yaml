- pgno: 115
  md: "# Advanced Bash–Scripting Guide\n\nsemicolon.\n\nwhile [condition] ; do\n\n\
    Note that certain specialized variable loops, as, for example, a getopts construct,\
    \ deviate somewhat from the standard template here.\n\nExample 10–14. Simple while\
    \ loop\n\n```\n#!/bin/bash\nvar0=0\nLIMIT=10\n\nwhile [ \"$var0\" -lt \"$LIMIT\"\
    \ ];\ndo\n    echo -n \"$var0 \"      # -n suppresses newline.\n    var0=$(expr\
    \ $var0 + 1)  var0=$((var0+1)) also works.\ndone\necho\nexit 0\n```\n\nExample\
    \ 10–15. Another while loop\n\n```\n#!/bin/bash\necho\nwhile [ \"$varl\" != \"\
    end\" ];  # while test \"$varl\" != \"end\"\ndo\n    # also works.\n    echo \"\
    Input variable #1 (end to exit)\"\n    read varl                        # Not\
    \ read '$varl' (why?).\n    echo \"variable #1 $varl\"         # Need quotes because\
    \ of \"#\"\n    # If input is 'end', echoes it here.\n    # Does not test for\
    \ termination condition until top of loop.\necho\ndone 0\n```\n\nA while loop\
    \ may have multiple conditions. Only the final condition determines the loop terminates.\
    \ This necessitates a slightly different loop syntax, however.\n\nExample 10–16.\
    \ while loop with multiple conditions\n\n```\n#!/bin/bash\nvarl=unset\nprevious=$varl\n\
    \nwhile echo \"previous-variable = $previous\"\n    echo\n    previous=$varl\n\
    ```"
