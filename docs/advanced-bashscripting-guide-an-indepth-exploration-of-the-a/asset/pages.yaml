  md: "# Advanced Bash–Scripting Guide\n\n```\nE_BADARGS=65 # Exit value if incorrect\
    \ number of args passed\n\ntest $# -ne $ARGS && echo \"Usage: basename $0 ARGS\
    \ argument(s)\" && exit E_BADARGS\n# If condition-1 true (wrong number of args\
    \ passed to script),\n# then the rest of the line executes, and script terminates.\n\
    ```\n\n```\n# Line below executes only if the above test fails.\necho \"Correct\
    \ number of args passed to this script.\"\n\nexit 0\n```\n\n```\n# To check exit\
    \ value, do a \"echo $?\" after script termination.\n```\n\ncommand-1 | command-2\
    \ || command-3 || ... command-n\nEach command executes true for as long as the\
    \ previous commands false. At the first\ntrue return, the command chain terminates\
    \ (the first command returning true is the last one to\nexecute). This is obviously\
    \ the inverse of the \"and\" and \"list\".\n\nExample 25-3. Using \"or lists\"\
    \ in combination with an \"and list\"\n\n```\n#!/bin/bash\n\n# \"Delete\", not-so-coining\
    \ file deletion utility.\n# Usage: delete filename\n\n_BADARGS=65\n\nif [ -z \"\
    $1\" ]\nthen\n    echo \"Usage: `basename $0` filename\"\n    exit $E_BADARGS\n\
    fi\n```\n\n```\nfile=$1 # Set filename\n\n[ -f \"$1\" ] && echo \"File \\$1\\\"\
    \ not found. \\\nCowardly refusing to delete a nonexistent file.\n# AND LIST,\
    \ to give error message if file list not present.\n# Note echo message continued\
    \ on a second line with an escape.\n\n[ -f \"$1\" ] || (rm -f $1; echo \"File\
    \ \\$file\\\" deleted\")\n# OR LIST, to delete if present.\n# ( command1 ; command2\
    \ ) is, in effect, an AND LIST variant.\n```\n\n```\n# Note logic inversion above.\n\
    # AND LIST executes on true, OR LIST on false.\n\nexit 0\n```\n\nIf the first\
    \ command in an \"and list\" or \"or list\" returns true, it will execute.\n\n\
    The exit status of an and list or or list is the exit status of the last command\
    \ executed.\n\nChapter 25. List Constructs"
