  md: "# Advanced Bash–Scripting Guide\n\nCommand substitution permits setting a variable\
    \ to the output of a loop. The key to is grabbing the output of an echo command\
    \ within the loop.\n\nExample 14–2. Generating a variable from a loop\n\n```\n\
    #!/bin/bash\n# csubloop.sh: Setting a variable to the output of a loop.\n\nvariable1=for\
    \ i in 1 2 3 4 5\ndo\n    echo -n \"$i\"      # The 'echo' command is critical\n\
    done                + to command substitution.\n\necho \"variable1 = $variable1\"\
    \ # variable1 = 12345\n\ni=0\nvariable2=while [ \"$i\" -lt 10 ]\ndo\n    echo\
    \ -n \"$i\"      # Again, the necessary 'echo'.\n    let i += 1         # Increment.\n\
    done\n\necho \"variable2 = $variable2\" # variable2 = 0123456789\n\nexit 0\n```\n\
    \n| Command substitution makes it possible to extend the toolset available to\
    \ Bash. It is simply a matter of writing a program or script that outputs to stdout\
