    # Example 26-4. An old friend: The Bubble Sort\n\n```\n#!/bin/bash\n# bubble.sh:\
    \ Bubble sort, of sorts.\n\n# Recall the algorithm for a bubble sort. In this\
    \ particular version...\n# With each successive pass through the array to be sorted,\n\
    # compare two adjacent elements, and swap them if they out of order.\n# At the\
    \ end of the first pass, the \"heaviest\" has sunk to bottom.\n# At the end of\
    \ the second pass, the \"heaviest\" has one sunk to bottom.\n# And so forth.\n\
    # This means that each successive pass needs to traverse the less array.\n# You\
    \ will notice a speedup in the printing of the later passes.\n\nexchange()\n \
    \ # Swaps two members of the array.\n  local temp=$(Countries[$1]) # Temporary\
    \ storage\n    # for element getting swapped out.\n\nCountries[$1]=Countries[$2]\n\
    Countries[$2]=$temp\n\nreturn\n```\n\n```\ndeclare -a Countries      # Declare\
    \ array,\n              # optional here since it's initialized below.\n```\n\n\
    Countries-(Netherlands Ukraine Zebra Turkey Yemen Syria Brazil Argentina Nicaragua\
    \ Japan M\n# \"Xanadu\" is the mythical place where, according to Coleridge,\n\
    #+ Kubla Khan did a pleasure dome decree.\n\n```\nclear\n# Clear the screen to\
    \ start with.\necho \"0: ${$Countries[@]}\"      # List entire array at pass 0.\n\
    \nnumber_of_elements=${#Countries[@]}\nlet comparisons = $number_of_elements -\
