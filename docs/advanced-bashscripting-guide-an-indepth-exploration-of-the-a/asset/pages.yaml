- pgno: 248
  md: '# # Chapter 19. Regular Expressions


    To fully utilize the power of shell scripting, you need to master Regular Expressions.
    Certain commands and utilities commonly used in scripts, such as expr, sed and
    awk interpret and use REs.


    # ## 19.1. A Brief Introduction to Regular Expressions


    An expression is a string of characters. Those characters that have an interpretation
    above and beyond their literal are called metacharacters. A quote symbol, may
    denote speech by a person, or a meta-meaning of the characters that follow. Regular
    Expressions are sets of characters and/or metacharacters that UNIX uses with special
    features. [47]


    The main uses for Regular Expressions (RE) are text searches and string manipulation.
    An RE matches a single character or set of characters (subscribing an entire string).


    +   * The asterisk matches any number of repeats of the character string or RE
    preceding it, including zero.

    * "1133*" matches 11 + one or more 3''s + possibly other characters: 113, 111312,
    and so forth.

    * The dot matches any character, except a newline. [48]

    * "13" matches 13 + at least one of any character (including a space): 1133, 11333,
    but not 13 (additional character missing).

    * The caret ^ matches the beginning of a line, but sometimes, depending on context,
    negates the meaning of a set of characters in an RE.

    * The dollar $ at the end of an RE matches the end of a line.

    * "^$" matches blank lines.

    * Brackets [...] enclose a set of characters to match in a single RE.

    * "xyz" matches the characters x, y, or z.

    * "[c-n]" matches any of the characters in the range c to n.

    * "[B-p-y]" matches any of the characters in the ranges B to P and k to y.

    * "[a-z0]" matches any lowercase letter or digit.

    * "[b-d]" matches all characters except those in the range b to d. This is negating
    or inverting the meaning of the RE (taking on a similar role to the ! in a different
    context).

    * Combined sequences of bracketed characters match common patterns. "[Yy][Ee][Ss]"
    matches'
