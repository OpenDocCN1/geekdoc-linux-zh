- pgno: 316
  md: "# Chapter 34. Miscellany\n\n> Nobody really knows what the Bourne's grammar\
    \ is. Even examination of the source code is little help.\n\nTom Duff\n\n# 34.1.\
    \ Interactive and non-interactive shells and scripts\n\nAn *interactive* shell\
    \ reads commands from user input on a *tty*. Among other things, such as a shell\
    \ reads startup files on activation, directs a prompt, and enables job control\
    \ by default. The user can *interact* with the shell.\n\nA shell running a script\
    \ is always a non-interactive shell. All the same, the script can still access\
    \ its *tty*. It is possible to eliminate an interactive shell in a script.\n\n\
    ```\n#!/bin/bash\nMY_PROMPT='$'\nwhile\n  echo -n \"$MY_PROMPT\"\n  read line\n\
    \  eval \"$LINE\"\ndone\n```\n\n# This example script, and much of the above explanation\
    \ supplied by\n# Stephanie Chazelas (thanks again).\n\nLet us consider an *interactive*\
    \ script one that requires input from the user, usually with [read] statements\
    \ (see [Example 11-2]). \"Real life is actually a bit messy than that. For now,\
    \ assume an interactive script is bound to a tty that a user has invoked from\
    \ the console or an xterm.\n\nInput start scripts are necessarily non-interactive,\
    \ they must run without human intervention. Many administrative and system maintenance\
    \ scripts are likewise non-interactive. Repetitive tasks cry out for automation\
    \ by non-interactive scripts.\n\nNon-interactive scripts can run in the background,\
    \ but otherwise one hang, waiting for input that never comes. Handle that by having\
    \ an *expect* script or embedded [here document] feed input to an interactive\
    \ script running as a background job. In the simplest case, redirect a file to\
    \ supply to the *read* statement (*read variable*). These particular workarounds\
    \ make general purpose scripts that run in either interactive or non-interactive\
    \ modes.\n\nIf a script needs to test whether it is running in an interactive\
    \ shell, it is simply a matter of finding whether the prompt variable, [PS1] is\
    \ set. (If the user is being prompted for input, then the script needs to display\
    \ a prompt).\n\n```\nif [ -z $PS1 ]; then no prompt?\nthen\n```"
  merge: -1
  img_proc: true
- pgno: 317
  md: "# # Advanced Bash–Scripting Guide\n\n```\n# non-interactive\n...\nelse\n  #\
    \ interactive\nfi\nAlternatively, the script can test for the presence of option\
    \ \"i\" in the S$- flag.\ncase $$- in\n  i*) # interactive shell\n    ;\n  *)\
    \ # non-interactive shell\n    ;;\n# (Thanks to \"UNIX F.A.Q.\", 1993)\n```\n\n\
    Scripts may be forced to run in interactive mode with the -i option or with a\
    \ #!/bin/bash -i header. Be aware that this can cause erratic shell behavior or\
    \ show error messages when no error is present.\n\n# 34.2. Shell Wrappers\n\n\
    A \"wrapper\" is a script that wraps a system command or utility, that saves a\
    \ set of parameters passed to that command. Wrapping a script around a complex\
    \ command simplifies invoking it. This is especially useful with sed awk.\n\n\
    A sed or awk would normally be invoked from the command line by a sed -e 'commands'\
    \ or awk 'commands'. Embedding such a script in a Bash script permits calling\
    \ it simply, and makes it \"reusable\". This also enables combining functionality\
    \ of sed and awk, for example piping the output of a set of sed commands to awk.\
    \ As a saved executable file, you can then invoke it in its original form or modified,\
    \ without the inconvenience of retyping it on the command line.\n\nExample 34–1.\
    \ shell wrapper\n\n```\n#!/bin/bash\n# This is a simple script that removes blank\
    \ lines from a file.\n# No argument checking.\n\n# Same as\n# sed -e '^$/d' filename\n\
    # invoked from the command line.\nsed -e '/$/d' \"$\"\n# The '-e' means an \"\
    editing\" command follows (optional here).\n# '^' is the beginning of the line,\
    \ '$' is the end.\n# This match lines with nothing between the beginning and the\
    \ end,\n# blank lines.\n# 'd' is the delete command.\n\n# Quoting the command-line\
    \ arg permits\n# whitespace and special characters in the filename.\n```\n\n#\
    \ 34.2. Shell Wrappers"
  merge: -1
  img_proc: true
- pgno: 318
  md: "# Advanced Bash–Scripting Guide\n\nexit 0\n\n# Example 34–2. A slightly more\
    \ complex shell wrapper\n\n```\n#!/bin/bash\n\n# \"sub\", a script that substitutes\
    \ one pattern for\n# another in a file,\n# i.e., \"Smith Jones letter.txt\".\n\
    \nARGS=3\nE_BADARGS=65    # Wrong number of arguments passed to script.\n\nif\
    \ [ $ -ne \"$ARGS\" ];\n    # Test number of arguments to script (always a good\
    \ idea).\nthen\n    echo \"Usage: basename $0 old-pattern new-pattern filename\"\
    \n    exit $E_BADARGS\nfi\n\nold_pattern=$1\nnew_pattern=$2\n\nif [ -f \"$3\"\
    \ ];\nthen\n    file_name=\"\\$3\"\nelse\n    echo \"File \\$3\\ does not exist.\"\
    \n    exit $E_BADARGS\nfi\n\n# Here is where the heavy work gets done.\nsed -e\
    \ \"s/$old_pattern/$new_pattern/g\" $file_name\"\n# 's' is, of course, the substitute\
    \ command in sed,\n# and /pattern/ invokes substitution for \"every*\"\n# The\
    \ \"q\", or global flag causes substitution for \"every*\"\n# occurence of $old_pattern\
    \ each line, not just the first.\n# Read the literature on 'sed' for a more in-depth\
    \ explanation.\n\nexit 0    # Successful invocation of the script returns 0.\n\
    ```\n\n# Example 34–3. A shell wrapper around an awk script\n\n```\n#!/bin/bash\n\
    \n# Adds a specified column (of numbers) in the target file.\n\nARGS=2\nE_WRONGARGS=65\n\
    \nif [ $ -ne \"$ARGS\" ];    # Check for proper no. of command line args.\nthen\n\
    \    echo \"Usage: basename $0 filename column-number\"\n    exit $E_WRONGARGS\n\
    fi\n\nfilename=$1\ncolumn_number=$2\n```\n\n# 34.2. Shell Wrappers\n\n313"
  merge: -1
  img_proc: true
- pgno: 319
  md: "# Advanced Bash–Scripting Guide\n\n```\n# Passing shell variables to the awk\
    \ part of the script is a bit tricky.\n# See the awk documentation for more details.\n\
    \n# A multi-line awk script is invoked by awk ' . . . '\n\n# Begin awk script.\n\
    # ----------------------\nawk '\n{\ntotal += \"$$(column_number)\"\n}\nEND {\n\
    \    print total\n}\n  \"$$filename\"\n# End awk script.\n```\n\n```\n# It may\
    \ not be safe to pass shell variables to an embedded awk script,\n# so Stephane\
    \ Chazelas proposes the following alternative:\n# ------------------------------------------------------------\n\
    awk -v column_name=\"$column_number\"\n{\ntotal += $column_number\n}\nEND {\n\
    \    print total\n}\n  \"$$filename\"\n```\n\nexit 0\n\nFor those scripts needing\
    \ a single do–it-all tool, a Swiss army knife, there Perl combines the capabilities\
    \ of sed and awk, and throws in a large subset of C, to boot. It is modular and\
    \ contains support for everything ranging from object-oriented programming up\
    \ to including the kitchen sink. Short Perl scripts lend themselves to embedding\
    \ in shell scripts, and there may even be some substance to the claim that Perl\
    \ can totally replace shell scripting (the author of this document remains skeptical).\n\
    \n# Example 34–4. Perl embedded in a Bash script\n\n```\n#!/bin/bash\n\n# Shell\
    \ commands may precede the Perl script.\necho \"This precedes the embedded Perl\
    \ script within \\\"$0\\*\"\n# ------------------------------------------------------------\n\
    echo\nperl -e 'This is an embedded Perl script.\\n' '\n# Like sed, Perl also uses\
    \ the \"-e\" option.\n# ----------------------------------------------------------------------------\n\
    echo \"However, the script may also contain shell and system commands.\"\n```\n\
    \nexit 0\n\n# 34.2. Shell Wrappers\n\n314"
