    \ links\ndo\n  echo \"$file\"\ndone | sort > \"$OUTPUTFILE\"  # stdout of loop\n\
    \      -----------------\nredirected to save file.\n\nexit 0\n```\n\nThere is\
    \ an alternative syntax to a for loop that will look very familiar to C programmers.\
