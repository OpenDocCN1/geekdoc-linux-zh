  md: "# Advanced Bash–Scripting Guide\n\nThe comma operator finds use mainly for\
    \ loops. See Example 10–12.\n\n# 8.2. Numerical Constants\n\nA shell script interprets\
    \ a number as decimal (base 10), unless number has a special prefix or notation.\
    \ A number preceded by a 0 is octal (base 8). A number preceded by 0x is hexadecimal\
    \ (base 16). A number with an embedded # is evaluated as BASE#NUMBER (this option\
    \ is of limited usefulness because of range restrictions)\n\nExample 8-4. Representation\
    \ of numerical constants:\n\n```\n#!/bin/bash\n# numbers.sh: Representation of\
    \ numbers.\n\n# Decimal\nlet \"dec = 32\"\necho \"decimal number = $dec\"    \
    \  # 32\n# Nothing out of the ordinary here.\n\n# Octal: numbers preceded by '0'\
    \ (zero)\nlet \"oct = 071\"\necho \"octal number = $oct\"      # 57\n# Expresses\
    \ result in decimal.\n\n# Hexadecimal: numbers preceded by '0x' or '0X'\nlet \"\
    hex = 07a\"\necho \"hexadecimal number = $hex\"  # 122\n# Expresses result in\
    \ decimal.\n\n# Other bases: BASE#NUMBER\n# BASE between 2 and 64.\n\nlet \"bin\
    \ = 2#111100111001101\"\necho \"bin = $bin\"                # 31181\n\nlet \"\
    b32 = 32#77\"\necho \"base-32 number = $b32\"     # 231\n\nlet \"b64 = 64#\"\n\
    echo \"base-64 number = $b64\"      # 4094\n\n# This notation only works for a\
    \ limited range (2 - 64)\n# 10 digits + 26 lowercase characters + 26 uppercase\
    \ characters + @ + _\n\necho\necho $((36#kz)) $((2#10101010)) $((16#AF16)) $((53#1aa))\n\
    \                                # 1295 170 44822 3375\n```\n\n# Important note:\n\
    # Using a digit out of range of the specified base notation\n# + will give an\
    \ error message.\n\n```\nlet bad_oct = 081\"\n```\n\n# 8.2. Numerical Constants"
