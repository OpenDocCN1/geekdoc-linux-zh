    This lists all the localized text. The -D option lists double–quoted strings prefixed
    by a $, without executing the script.


    ```

    bash --dump-po-strings localized.sh

    #: a:6

    msgid "Can''t cd to %s."

    msgstr ""

    #: a:7

    msgid "Enter the value: "

    msgstr ""

    ```


    The --dump-po-strings option to Bash resembles the -D option, but uses gettext
    "po" format.


    Now, build a language.po file for each language that the script will be translated
    into, specifying it. As an example:


    fr.


    ```

    #: a:6

    msgid "Can''t cd to %s."

    msgstr "Impossible de se positionner dans le répertoire %s.

    #: a:7

    msgid "Enter the value: "

    msgstr "Entrez la valeur : "

    ```


    Then, run msgfmt.


    ```

    msgfmt -o localized.sh.mo fr.po

    ```


    Place the resulting localized.sh.mo file in /usr/local/share/locale/fr/LC_MESSAGES
    directory, and at the beginning of the script, insert the lines:


    ```

    TEXTDOMAIN=/usr/local/share/locale

    TEXTDOMAIN=localized.sh

    ```


    If a user on a French system runs the script, she will get French messages.


    ![](img/1ce1edffaa36e4f698a85430e71c6d3b_373_0.png)


    With older versions of Bash or other shells, localization requires gettext, using
