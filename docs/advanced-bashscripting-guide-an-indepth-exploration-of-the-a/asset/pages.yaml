- pgno: 142
  md: '# 11.1. Job Control Commands


    Certain of the following job control commands take a "job identifier" as an argument.
    See the table at end of the chapter.


    jobs


    Lists the jobs running in the background, giving the job number. Not as useful
    as ps.


    ![](img/1ce1edffaa36e4f698a85430e71c6d3b_142_0.png)


    It is all too easy to confuse jobs and processes. Certain builtins such as kill,
    disown, and wait accept either a job number or a process number as argument. The
    fg. bg and jobs commands accept only a job number.


    ```

    bash$ sleep 100 &

    [1] 1384


    bash $ jobs

    [1]+ Running      sleep 100 &

    ```


    "1" is the job number (jobs are maintained by the current shell), and "1384" is
    the process number (processes are maintained by the system). To kill this job/process,
    either a kill %1 or a 1384 works.


    Thanks, S.C.


    disown


    Remove job(s) from the shell''s table of active jobs.


    fg. bg


    The fg command executes a job running in the background into the foreground. The
    bg command suspends a job, and runs it in the background. If no job number is
    specified, then the fg or bg command acts upon the currently running job.


    wait


    Stop script execution until all jobs running in background have terminated, or
    until the job number or process id specified as an option terminates. Returns
    the exit status of waited–for command.


    You may use the wait command to prevent a script from exiting before a background
    job finishes executing (which would create a dreaded orphan process).


    # Example 11–16. Waiting for a process to finish proceeding


    ```

    #!/bin/bash

    ROOT_UID=0 # Only users with SUID 0 have root privileges.

    ```'
  merge: -1
