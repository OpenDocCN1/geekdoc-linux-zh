  md: '# Advanced Bash–Scripting Guide


    The diff command returns an exit status of 0 if the compared files are identical,
    and 1 if they differ.

    This permits of using diff in a test construct within a shell script (see below).


    A common use for diff is generating difference files to be used with patch The
    -e options files suitable for ed or ex scripts.


    patch: flexible versioning. Given a difference file generated by diff, patch can
    upgrade a previous version of a package to a newer version. It is much more convenient
    to distribute a relatively small "diff" file than the entire body of a newly revised
    package. Kernel "patches" have become the preferred method of distributing the
    frequent releases of the Linux kernel.


    ```

    patch -pl <patch-file>

    # Takes all the changes listed in ''patch-file''

    # and applies them to the files referenced therein.

    # This upgrades to a newer version of the package.

    ```


    Patching the kernel:


    ```

    cd /usr/src

    gzip -cd patchXX.gz | patch -p0

    # Upgrading kernel source using ''patch''

    # From the Linux kernel docs "README"

    # by anonymous author (Alan Cox)?

    ```


    > The diff command can also recursively copy directories (the filenames present).


    ```

    bash$ diff -r ~/notes1 ~/notes2

    Only in /home/bozo/notes1: file02

    Only in /home/bozo/notes1: file03

    Only in /home/bozo/notes2: file04

    ```


    Use diff to compare gzipped files.


