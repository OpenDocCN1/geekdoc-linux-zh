- pgno: 271
  md: '# Chapter 24. Aliases


    A Bash alias is essentially nothing than a keyboard shortcut, an abbreviation,
    a means of avoiding typing a long command sequence. If, for example, we include
    **alias im="ls -l | more"** in the ~/.bashrc file, then each **im** at the command
    line will automatically be replaced by a **ls -l | more**. save a great deal of
    time at the command line and avoid having to remember complex combinations of
    commands and options. Setting **alias rm="rm -i"** (interactive mode) may save
    a great deal of grief, if it prevent inadvertently losing important files.


    In a script, aliases have very limited versatility. It would be nice if aliases
    could assume some of the functionality of the C preprocessor, such as macro expansion,
    but unfortunately Bash does not argue within the alias.[55] Moreover, a script
    fails to expand an alias within "compound constructs", such as if/then statements,
    loops, and functions. An added limitation is that an alias will not expand recursively.
    Almost invariably, whatever we would like an alias to do could be accomplished
    more with a function.


    Example 24-1. Aliases within a script


    ```

    #!/bin/bash

    # May need to be invoked with #!/bin/bash2 on older systems.


    sopt -s expand_aliases

    # Must set this option, else script will not expand aliases.


    # First, some fun.

    alias Jesse_James=echo "*Alias Jesse\" was a 1952 comedy starring Bob Hope."

    Jesse_James


    echo; echo;


    alias ll1="ls -l"

    # May use either escaped \" (single \'') or double (") quotes to define an alias.

    echo "Trying aliased \"*\"

    ll1 /usr/X11R6/mk* # Alias works.


    echo


    directory=/usr/X11R6/bin/

    prefix=* # See if wild-card causes problems.

    echo "Variables \"directory\" + \"prefix\" = $directoryprefix"

    echo


    alias ll1="ls -l $directoryprefix"

    echo "Trying listing \"*\"" in /usr/X11R6/bin stating with mk.

    lli1 # Long listing of all files in /usr/X11R6/bin with mk.

    # Alias handles concatenated variables, including wild-card o.k.


    TRUE=1

    ```


    Chapter 24. Aliases'
