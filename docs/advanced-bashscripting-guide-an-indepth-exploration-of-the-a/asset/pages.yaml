  md: '# Advanced Bash–Scripting Guide


    Terminator in a case option. [Double semicolon];


    ```

    case "$variable" in

    abc)    echo "$variable = abc";;;

    xyz)    echo "$variable = xyz";;;

    esac

    ```


    "dot" command. [period] Equivalent to source Example 11–14. This is a builtin.


    In a different context, as part of a regular expression, a "dot" matches single
