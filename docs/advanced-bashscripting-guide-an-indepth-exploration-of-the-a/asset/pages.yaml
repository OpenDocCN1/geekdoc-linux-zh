  md: '# Advanced Bash–Scripting Guide


    usleep


    Microsleep (the "u" may be read as the Greek "mu", or micro prefix). This is the
    same as sleep, above, but "sleeps" in microsecond intervals. This can be used
    for fine–grain timing, or for polling an ongoing process at very frequent intervals.


    ```

    usleep 30

    # Pauses 30 microseconds.

    ```


    The usleep command does not provide particularly accurate timing, and is therefore
    unsuitable for critical timing loops.


    hwclock, clock


    The hwclock command accesses or adjusts the machine’s hardware clock. Some options
    require root privileges. The /etc/rc/dc.rcysinit startup file uses hwclock to
    set the system time from the hardware clock at bootup.


    The clock command is a synonym for hwclock.


