    #!/bin/bash

    # Using "case" structure to filter a string.


    SUCCESS=0

    FAILURE=-1


    isalpha() # Tests whether *first character* of input string is alphabetic.

    {

    if [ -z "$1" ] # No argument passed?

    then

    return FAILURE

    fi


    case "$1" in

    [a-zA-Z]*) return $SUCCESS; # Begins with a letter?

