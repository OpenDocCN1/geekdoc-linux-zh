  md: "# Advanced Bash–Scripting Guide\n\nAntek Sawicki created the following script,\
    \ which makes very clever use of the parameter substitution operators discussed\
    \ in Section 9.3.\n\n# Example A–12. password: Generating random 8-character passwords\n\
    \n```\n#!/bin/bash\n# !/bin/bash2 on older machines.\n# May need to be invoked\
    \ with\n# Random password generator for bash 2.x by Antek Sawicki <tenox@tenox.tc,\n\
    # who generously gave permission to the document author to use it here.\n# -->\
    \ Comments added by document author -->\n\nMATRIX=\"0123456789ABCDEFGHIJKQRSTUVWXYZabcdefghijklmmnopqrstuvwxyz\"\
    \nLENGTH=${#MATRIX}\n\nwhile [ $n -le 1 ]; do\n# - is \"default substitution\"\
    \ operator.\n# Recall that if 'n' has not been initialized, set it to 1.\ndo\n\
    \  PASS=$SPASS${($RANDOM%${#MATRIX})):1}\n  # --> Very clever, but tricky.\n\n\
    \  # --> Starting from the innermost nesting...\n  # --> ${#MATRIX} returns length\
    \ of array MATRIX.\n  # --> ${RANDOM%${#MATRIX}} returns random number between\
    \ 1\n  # --> and length of MATRIX - 1.\n\n  PASS=$SPASS{($RANDOM%${#MATRIX})):1}\n\
    \  # --> returns expansion of MATRIX at random position, by length 1.\n  # -->\
    \ See (var:pos:len) parameter substitution in Section 3.3.1\n  # --> and following\
    \ examples.\n  PASS=$PASS... simply pastes this rest onto previous PASS (concatenation).\n\
    \  # --> To visualize this more clearly, uncomment the following line\n  # -->\
    \ echo \"$SPASS\"\n  # --> to see PASS building up,\n  # --> one character at\
    \ a time, each iteration of the loop.\n  let n+=1\n  # --> Increment 'n' for next\
    \ pass.\ndone\n\necho \"$SPASS\"\n\n# --> Or, redirect to file, as desired.\n\
    ```\n\nJames R. Van Zandt contributed this script, which used names and, in his\
    \ words, \"really exercises quoting and escaping.\",\n\nAppendix A. Contributed\
    \ Scripts"
