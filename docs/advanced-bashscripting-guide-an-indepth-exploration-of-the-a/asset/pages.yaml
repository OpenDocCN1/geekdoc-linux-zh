  md: "# Advanced Bash–Scripting Guide\n\n```\necho # Entire 'list' enclosed in quotes\
    \ creates a single variable.\nfor planet in \"Mercury Venus Earth Mars Jupiter\
    \ Saturn Uranus Neptune Pluto\"\ndo\necho $planet\ndone\nexit 0\n```\n\nEach [list]\
    \ element may contain multiple parameters. This is useful when processing parameters\
    \ in groups. In such cases, the set command (see Example 11-10) to force parsing\
    \ of each [list] element and assignment of each component to the positional parameters.\n\
    \n# Example 10-2. for loop with two parameters in each [list] element\n\n```\n\
    #!/bin/bash\n# Planets revisited.\n\n# Associate the name of each planet with\
    \ its distance from the sun.\nfor planet in \"Mercury 36\" \"Venus 67\" \"Earth\
    \ 93\" \"Mars 142\" \"Jupiter 483\"\ndo\n  set --\"$planet\" Parses and sets positional\
    \ parameters.\n  # the \"-\" prevents nasty surprises if $planet is null or begins\
    \ with a dash.\n\n# May need to save original positional parameters, since they\
    \ get overwritten.\n# One way of doing this is to use an array,\n  original_params=(\"\
    $@\")\n\necho \"$1\" $2,000,000 miles from the sun\n#--two concatenate zeros onto\
    \ parameter $2\ndone\n\n# (Thanks, S.C., for additional clarification.)\nexit\
    \ 0\n```\n\nA variable may supply the [list] in a for loop.\n\n# Example 10-3.\
    \ Fileinfo: operating on a file list contained in a variable\n\n```\n#!/bin/bash\n\
    # fileinfo.sh\n\nFILES=\"/usr/sbin/privatepw\n/usr/sbin/pwck\n/usr/sbin/go500gw\n\
    /usr/bin/fakefile\n/sbin/mkreiserfs\n  # List of files you are curious about.\n\
    \  /sbin/ypbins\n  # Threw in a dummy file, /usr/bin/fakefile.\n```\n\nChapter\
    \ 10. Loops and Branches"
