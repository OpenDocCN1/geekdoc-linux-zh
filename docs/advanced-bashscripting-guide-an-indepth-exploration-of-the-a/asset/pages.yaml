  md: '# Chapter 6. Quoting


    Quoting means that, bracketing a string in quotes. This has the effect of protecting
    special characters in the string from reinterpretation or expansion by the shell
    or shell script. (A character is "special" if it has an interpretation other than
    its literal meaning, such as the wild character, *)


    ```

    bash ls -l [V]*

    --rw-rw-r-- 1 bozo bozo 324 Apr 2 15:05 VIEWDATA.BAT

    --rw-rw-r-- 1 bozo bozo 507 May 14:25 vartace.sh

    --rw-rw-r-- 1 bozo bozo 539 Apr 14 17:11 viewdata.sh

    ```


    ```

    bash ls -l [V]*

    ls: [V]*: No such file or directory

    ```


    Certain programs and utilities can still reinterpret or expand special characters
    in a quoted string. This is an important use of quoting, protecting a command–line
    parameter from the shell, but still letting the calling program expand.


    ![](img/1ce1edffaa36e4f698a85430e71c6d3b_38_0.png)


    ```

    bash grep ''[Ffirst]* *.txt

    file1.txt:This is the first line of file1.txt.

    file2.txt:This is the First line of file2.txt.

    ```


    Of course, grep [Ffirst]* *.txt does not work.


    Use double quotes to prevent splitting. [114] An argument enclosed in double quotes
    presents itself as a single word, even if it contains spaces.


    ```

    variable1="a variable containing five words"

    COMMAND This $variable1 # Executes COMMAND with 7 arguments:

    # "This" is \"a variable\" containing \"five\" words"

    COMMAND "This is $variable1" # Executes COMMAND with 1 argument:

    # "This is a variable containing five words"

    variable2=""\ # Empty.

    COMMAND $variable2 $variable2 $variable2 # Executes COMMAND with no arguments.

    COMMAND "$variable2" "$variable2" "$variable2" # Executes COMMAND with 3 empty
    arguments.

    COMMAND "$variable2 $variable2 $variable2" # Executes COMMAND with 1 argument
    (2 spaces)

    ```


    # Thanks, S.C.


    ![](img/1ce1edffaa36e4f698a85430e71c6d3b_38_1.png)


    Enclosing the echo statement in double quotes is necessary only when word splitting
    is an issue.


    # Chapter 6. Quoting'
