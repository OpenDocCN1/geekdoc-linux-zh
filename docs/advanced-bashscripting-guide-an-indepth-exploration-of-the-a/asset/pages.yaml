    # TeX, gs


    +   - **TeX and Postscript** are text markup languages used for preparing copy
    for printing or formatted video display.


    **TeX** is Donald Knuth''s elaborate typesetting system. It is often convenient
    to write a shell script encapsulating all the options and arguments passed to
    one of these markup languages.


    *Ghostscript (gs)* is a GPL–ed Postscript interpreter.


    # groff, tbl, tqn


    Another text markup and display formatting language is **groff**. This is the
    enhanced GNU of the venerable UNIX roff/tbl display and typesetting package. *Manpages*
    use **groff** (see Example A–1).


    The **tbl** processing utility is considered part of **groff**, as its function
    is to convert table markup into **groff** commands.


    The **eqn** equation processing utility is likewise part of **groff**, and its
    function is to convert equation markup into **groff** commands.


    # lex, yacc


    The **lex** lexical analyzer produces programs for pattern matching. This has
