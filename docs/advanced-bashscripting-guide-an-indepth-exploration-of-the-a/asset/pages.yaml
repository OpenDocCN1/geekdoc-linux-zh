    # miscellaneous operators


    comma operator


    The comma operator chains together two or more arithmetic operations. All the
    operations are evaluated (with possible side effects), but only the last operation
    is returned.


    ```

    let t1 = ((5 + 3, 7 - 1, 15 - 4))

    echo t1 = \$t1      # t1 = 11

    ```


    ```

    let t2 = ((9, 15 / 3))  # Set "a" and calculate "t2"

    echo t2 = \$t2      a = \$5      a = 9

    ```


