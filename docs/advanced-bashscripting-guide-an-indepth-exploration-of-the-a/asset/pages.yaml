- pgno: 294
  md: "# Advanced Bash–Scripting Guide\n\n# Example 28–1. Finding the process associated\
    \ with a PID\n\n```\n#!/bin/bash\n# pid-identifier.sh: Gives complete path name\
    \ to process associated with pid\n\nARGNO=$# Number of arguments the script expects.\n\
    E_WRONGARGS=65\nE_BADPID=66\nE_NOSUCHPROCESS=67\nE_NOPERMISSION=68\nPROFILE=exit\n\
    \nif [ $ -ne $ARGNO ];\nthen\n    echo \"Usage: basename $0 'PID-number\" >&2\
    \ # Error message to stderr.\n    exit $E_WRONGARGS\nfi\n\npidno=$(ps ax | awk\
    \ '{ print $1 }' | grep $1)\n# Checks for pid in \"ps\" listing, field #1.\n#\
    \ Then makes it the actual process, not the process invoked by this script.\n\
    # The last \"grep $1\" filters out this process.\nif [ -z \"$pidno\" ];\nthen\n\
    \    # If, after all the filtering, the result is a zero-length string,\n    echo\
    \ \"No such process running.\"\n    # # no running process corresponds to the\
    \ pid given.\n    exit $E_NOSUCHPROCESS\nfi\n\nAlternatively:\nif ! $1 > /dev/null\
    \ 2>&1;\nthen\n    # no running process corresponds to the pid given.\n    echo\
    \ \"No such process running.\"\n    exit $E_NOSUCHPROCESS\nfi\n\n# To simplify\
    \ the entire process, use \"pidof\"\n\nif [ -r \"/proc/$1/$PROFILE\" ];\\ # Check\
    \ for read permission.\nthen\n    echo \"Process $1 running, ...\"\n    echo \"\
    Can't get read permission on /proc/$1/$PROFILE.\"\n    exit $E_NOPERMISSION #\
    \ Ordinary user can't access some files in /proc.\n# The last two lines may be\
    \ replaced by:\nif ! kill -0 $1 > /dev/null 2>&1; # '0' is not a signal, but\n\
    \    # this will test whether it is possible\n    # # to send a signal to the\
    \ process.\nthen\n    echo \"PID does not exist or you're not its owner\" >&2\n\
    \    exit $E_BADPID\nfi\n\nexe_file=$(ls -1 /proc/$1 | grep \"exe\" | awk '{ print\
    \ $11 }')\n# Or \n_file=$(ls -l /proc/$1/exe | awk '{print $11 }')\n\n# /proc/pid-number/exe\
    \ is a symbolic link\n# to the complete path name of invoking the process.\n```"
