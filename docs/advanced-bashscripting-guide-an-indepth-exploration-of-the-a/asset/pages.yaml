    \ hda 10 0 20 210 0 0 0 0 210 210\n...\n```\n\n```\nbash$ cat /proc/loadavg\n\
    0.13 0.42 0.27 2/44 1119\n```\n\nShell scripts may extract data from certain of\
    \ the files in /proc. [59]\n\n```\nkernel_version=$( awk '{ print $3 }' < /proc/version\
    \ )\n\nCPU=$( awk '/model name/ { print $4 }' < /proc/cpuinfo)\n\nif [ $CPU ==\
    \ Pentium ]\nthen\n    run_some_commands\nelse\n    run_different_commands\nfi\n\
    ```\n\nThe /proc directory contains subdirectories with unusual numerical names.\
    \ Every one of these names maps to the process ID of a currently running process.\
    \ Within each of these subdirectories are a number of files that hold useful information\
    \ about the corresponding process. The stat and status files keep running statistics,\
    \ the cmdline file holds the command–line arguments the process was invoked with,\
    \ and the exe file is a symbolic link to the complete path of invoking. There\
