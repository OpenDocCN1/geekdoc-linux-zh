    Sets an upper limit on system resources. Usually invoked with the -f option, which
    sets a limit on file size (ulimit -f 1000 limits files to 1 meg maximum). The
    -t option limits the coredump size (ulimit -c 0 eliminates cores). Normally, the
    value of ulimit would be set in /etc/profile and or ~/.bash_profile (see Chapter
    27).


    # umask


    User file creation MASK. Limit the default file attributes for a particular user.
    All files created by that user use the attributes specified by umask. (octal)
    value passed to umask defines the file permissions disabled. Of course, umask
    002 ensures that new files have at most 755 permissions (777 NAND and). [43] The
    user may later change the attributes of particular files with chmod. The usual
    practice is to set the value of umask in /etc/profile and/ ~/.bash_profile (see
    Chapter 27).


