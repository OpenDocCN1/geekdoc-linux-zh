  md: "# Advanced–Scripting Guide\n\n[54] Too many levels of recursion may crash a\
    \ script with segfault.\n\n```\n#!/bin/bash\nrecursive_function ()\n{\n  (( $1\
    \ < $2 )) && f $(( $1 + 1 )) $2;\n  # As long 1st parameter is less than 2nd,\n\
    \  # increment 1 and recurse.\n}\n\nrecursive_function 1 50000 # Recursion 50,000\
    \ levels!\n# Segfaults, of course.\n\n# Recursion this deep might cause a C program\
    \ to segfault\n# by using up all the memory allotted to the stack.\n\n# Thanks,\
    \ S.C.\nexit 0 # This script will not exit normally.\n```\n\n[55] However, aliases\
    \ seem to expand positional parameters.\n\n[56] This does not apply to csh, tsh,\
    \ and others not related to or descended from the classic Bourne shell (sh).\n\
    \n[57] The entries in /dev provide mount points for physical and virtual devices.\
    \ These entries are very little drive space.\n\nSome devices, as /dev/null, /dev/zero,\
    \ and /dev/urandom are virtual. They are not actual physical devices and exist\
    \ only in software.\n\n[58] A block device reads and/or writes data in chunks\
    \ or blocks, in contrast to a character device, which accesses data in character\
    \ units. Examples of block devices are a hard drive and CD ROM drive. An example\
    \ of a character device is a keyboard.\n\n[59] Certain system commands, such as\
    \ procinfo, free, vmstat, lsdev, and uptime do this as well.\n\n[60] By convention,\
    \ signal 0 is assigned to exit.\n\n[61] Setting the su permission on a script\
    \ has no effect.\n\n[62] In this context, \"magic numbers\" have an entirely different\
    \ meaning than the magic numbers used to designate file types.\n\n[63] Chet Ramey\
    \ promises associative arrays (a Perl feature) in a future Bash release.\n\n[64]\
    \ Those who can, do who can't... get an MCSE.\n\n[65] If no address range is specified,\
    \ the default is all lines.\n\n[66] *\n\nAppendix J. Copyright"
