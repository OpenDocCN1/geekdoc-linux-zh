    \n# Let's use the C \"comma operator\" to increment two variables simultaneously.\n\
    for ((a=1, b=1; a <= LIMIT; a++, b++)) # The comma chains together operations.\n\
    do\n  echo -n \"$a-$b \"ndone\n\necho; echo\n\nexit 0\n```\n\nChapter 10. Loops\
