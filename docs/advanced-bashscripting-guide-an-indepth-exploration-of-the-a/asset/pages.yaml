  md: '# Advanced Bash–Scripting Guide


    ```

    array0=( first second third )

    array1=( '' '') # "array1" has one empty element

    array2=() # No elements... "array2" is empty.


    echo


    echo "Elements in array0: ${array0[0]}"

    echo "Elements in array1: ${array1[0]}"

    echo "Elements in array2: ${array2[0]}"

    echo


    echo "Length of first element in array0: ${array0[0]}"

    echo "Length of first element in array1: ${array1[1]}"

    echo "Length of first element in array2: ${array2[2]}"

    echo


    echo "Number of elements in array0: ${array0[@]}" # 3

    echo "Number of elements in array1: ${array1[*]}" # 1 (surprise!)

    echo "Number of elements in array2: ${array2[*]}" # 0


    echo


    exit 0 # Thanks, S.C.

    ```


    The relationship of `$array_name[@]` and `$array_name[*]` is analogous to between
    @@ and $*$. This powerful array notation has a number of uses.


    ```

    # Copying an array.

    array2=(\${array1[@]}"

    # or

    array2="${array1[*]}"


    # Adding an element to an array.

    array=(\${array[0]}) "new element"

    # or

    array[\${#array[*]]="new element"


    # Thanks, S.C.

    ```


    The array=element1 element2 ... elementN initialization operation, with the help
    of command substitution, makes it possible to load the contents of a text file
    into an array.


    ```

    #!/bin/bash


    filename=sample_file


    # cat sample_file

    # 1 a b c

    # 2 d e f g


    dendeclare -a array1


    array1=$(cat "$filename" | tr ''\n'' '' '') # Loads contents

    # of $filename into array1.

    # list file to stdout.

    # change linefeeds in file to spaces.


    echo ${array1[@]} # List the array.

    # 1 a b c 2 d e f

    ```


