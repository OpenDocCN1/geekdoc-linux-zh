    \n# Else if and elif\n\nelif\n\nelif is a contraction for else if. The effect\
    \ is to make an inner if/then construct within an outer one.\n\n```\nif [ condition1\
    \ ]\nthen\n  command1\n  command2\n  command3\nelif [ condition2 ]\n  # Same as\
