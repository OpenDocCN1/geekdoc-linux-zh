- pgno: 301
  md: "# Advanced Bash–Scripting Guide\n\npartial fix is to remove quotes from $badname\
    \ and reset $IFS to contain only a newline, However, there are simpler ways of\
    \ going about it.\n\n```\n# Correct methods of deleting filenames containing spaces.\n\
    rm *\nrm - *\nrm **\nThank you. S.C.\n```\n\nSummarizing the symptoms of a buggy\
    \ script,\n\n+   1. It bombs with an error message syntax error,\n2. It runs,\
    \ but does not work as expected (logic error)\n3. It runs, works as expected,\
    \ but has nasty side effects (logic bomb).\n\nTools for debugging non-working\
    \ scripts include\n\n+   1. echo at critical points in the script to trace the\
    \ variables, and otherwise give a snapshot of what is going on.\n2. using the\
    \ tee filter to check processes or data flows at critical points.\n3. setting\
    \ option flags -n -v -x\n\n```\nsh -n scriptname for syntax errors without actually\
    \ running the script. This is the equivalent of inserting set -n or set -o noexec\
    \ into the script. Note that certain types of scripts can pass this check.\n\n\
    sh -v scriptname echoes each command before executing it. This is the equivalent\
    \ of inserting set -v or set -o verbose in the script.\n```\n\nThe -n and -v flags\
    \ work together. set -nv scriptname gives a verbose syntax check.\n\n```\nsh -x\
    \ scriptname echoes each result command, but in an abbreviated manner. This is\
    \ the equivalent of inserting set -x or set -o xtrace in the script.\n```\n\n\
    Inserting set -u or set -o nounset in the script runs, but gives an unbound variable\
    \ error at attempt to use an undeclared variable.\n\n+   4. Using an \"assert\"\
    \ function to test a variable or condition at critical points in a script. (This\
    \ is an idea borrowed from C.)\n\n```\n#!/bin/bash\nassert.sh\n\nasassert () {\n\
    \  E_PARAM_ERROR=98\n  +# exit from script with error message.\n  E_ASSERT_FAILED=99\n\
    }\n\nif [ -z \"$2\" ]; then\n  return $E_PARAM_ERROR\n  # No damage done.\nnfi\n\
    ```\n\n# Chapter 30. Debugging"
