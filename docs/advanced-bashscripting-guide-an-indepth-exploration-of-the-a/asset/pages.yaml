  md: "# Chapter 12. External Filters, Programs and Commands\n\nStandard UNIX commands\
    \ make shell scripts more versatile. The power of scripts comes from coupling\
    \ system commands and shell directives with simple programming constructs.\n\n\
    # 12.1. Basic Commands\n\n# Command Listing\n\nThe basic file \"list\" command.\
    \ It is all too easy to underestimate the power of this humble command. For example,\
    \ using the -R, recursive option, ls provides a tree-like listing of a directory\
    \ structure. Other interesting options are -s, sort by file size, -t, sort by\
    \ modification time, and -i, show file inodes (see [Example 12-3]).\n\nExample\
    \ 12-1. Using to create a table of contents for burning a CDR\n\n```\n#!/bin/bash\n\
    \nSPEED=2                # May use higher speed if your hardware supports it\n\
    IMAGEFILE=cdimage.iso\nCONTENTSFILE=contents\nDEFAULTDIR=/opt       # Make sure\
    \ this directory exists.\n\n# Script to automate burning a CDR.\n\n# Uses Josef\
    \ Schilling's \"cdrecord\" package.\n# (http://www.fokus.de/ntyp/employees/schilling/cdrecord.html)\n\
    \n# If this script is invoked as an ordinary user, need to sudo cdrecord\n+# chmod\
    \ u+s /usr/bin/cdrecord, as root.)\n\nif [ -z \"$1\" ];\nthen\n    IMAGE_DIRECTORY=$DEFAULTDIR\n\
    \    # Default directory, if not specified on command line.\nelse\n    IMAGE_DIRECTORY=$1\n\
    fi\n\nls -lRF $IMAGE_DIRECTORY > $IMAGE_DIRECTORY/$CONTENTSFILE\n# The \"l\" option\
    \ gives a \"long\" file listing.\n# The \"R\" option makes the recursive listing.\n\
    # The \"F\" option marks the file types (directories get a trailing /).\necho\
    \ \"Creating contents of table.\"\n\nmkkisofs -r -o $IMAGE_DIRECTORY\necho \"\
    Creating ISO9660 file system image ($IMAGEFILE).\"\n\ncdrecord -v -isosize speed=$SPEED\
    \ dev=0,0 $IMAGEFILE\n```"
