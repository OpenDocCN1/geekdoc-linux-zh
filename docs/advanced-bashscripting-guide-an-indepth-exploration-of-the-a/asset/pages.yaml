    \ other programming languages, shell scripts normally pass value parameters to\
    \ functions. [51] Variable names (which are actually pointers), if passed as parameters\
    \ to functions, will be treated as string literals and cannot be dereferenced.\
    \ *Functions interpret their arguments literally.\n\n# Exit and Return\n\nexit\
    \ status\n\nFunctions return a value, called an exit status. The exit status may\
    \ be explicitly specified by a return statement, otherwise it is the status of\
    \ the last command in the function (0 if successful, and a non–zero error code\
    \ if not). This exit status may be used in the script by referencing it as $.\
    \ This mechanism effectively permits script functions to have a \"return value\"\
    \ similar to C functions.\n\n# return\n\nTerminates a function. A return command\
    \ [52] optionally takes an integer argument, which is returned to the calling\
    \ script as the \"exit status\" of the function, and which exit status is assigned\
    \ to the variable $$.\n\n# Example 23–3. Maximum of two numbers\n\n```\n#!/bin/bash\n\
