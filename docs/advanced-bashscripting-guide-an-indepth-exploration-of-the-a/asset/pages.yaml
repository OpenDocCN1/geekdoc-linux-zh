- pgno: 137
  md: "# Advanced Bash–Scripting Guide\n\nThis powerful tools parse command line arguments\
    \ to the script. This is the bash analog of getopt library function familiar to\
    \ C programmers. It permits passing and concatenating multiple options [25] and\
    \ associated arguments to a script (example scriptname -abc -e /usr/local).\n\n\
    The getopt constructs two implicit variables. $OPTIND is the option (Index) and\
    \ $OPTARG (OptionArgument) the (optional) argument attached to an option. A colon\
    \ following the option name in the declaration tags that it identifies as having\
    \ an associated argument.\n\nA gets usually comes packaged in a while loop, which\
    \ processes the options and arguments one at a time, decrements the implicit $OPTIND\
    \ variable to step to the next.\n\n![](img/1ce1edffaa36e4f698a85430e71c6d3b_137_0.png)\n\
    \n+   1. The arguments must be passed from the command line to script preceded\
    \ by a minus (-) or a plus (+). It is the prefixed or + that lets getopt recognize\
    \ command–line arguments as options. In fact, getopt will not process arguments\
    \ without the prefixed - or +, and will terminate option processing at the first\
    \ argument encountered lacking them.\n2. The getopt differs slightly from the\
    \ standard while loop, in it lacks condition brackets.\n3. The gets constructs\
    \ replaces the obsolete getopt command.\n\n```\nwhile gets \":abc:fg\" Option\n\
    # Initial declaration.\n# a, b, c, d, e, f, and g are the options (flags) expected.\n\
    # The : - after option 'e' shows it will have an argument passed with it.\ndo\n\
    case $getopt in\n  a) Do something with variable 'a'.\n  b) Do something with\
    \ variable 'b'.\n\n  e) Do something with 'e', and also with $OPTARG\n      #\
    \ which is the associated argument passed with option 'e'.\n\n  g) Do something\
    \ with variable 'g'.\nesac\ndone\nshift $((OPTIND - 1))\n# Move argument pointer\
    \ to next.\n\n# All this is not nearly as complicated as it looks <grin>.\n```\n\
    \n# Example 11–3. Using gets to read the options/arguments to a script\n\n```\n\
    #!/bin/bash\n# 'getopts' processes command line arguments to script.\n# The arguments\
    \ are parsed as \"options\" (flags) and associated arguments.\n```\n\nChapter\
    \ 11. Internal Commands and Builtins\n\n132"
