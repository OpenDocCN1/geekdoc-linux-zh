  md: "# Advanced Bash–Scripting Guide\n\nThis is the last line of the message.\n\n\
    # However, text may not include double quotes unless they are escaped.\n\nThe\
    \ - option to mark a document limit string (<<LimitString) suppresses tabs (but\
    \ not spaces) in the output. This may be useful in making a script more readable.\n\
    \n# Example 17–4. Multi-line message, with tabs suppressed\n\n```\n#!/bin/bash\n\
    # Same as previous example, but...\n\n# The - option to here a document <<-\n\
    # suppresses tabs in the body of the document, but *not* spaces.\n\ncat <<-ENDMESSAGE\n\
    This is line 1 of the message.\nThis is line 2 of the message.\nThis is line 3\
    \ of the message.\nThis is line 4 of the message.\nThis is the last line of the\
    \ message.\nENDMESSAGE\n# The output of the script will be flushed left.\n# Leading\
    \ tab in each line will not show.\n\n# Above 5 lines of \"message\" preceded by\
    \ a tab, not spaces.\n# Spaces not affected by <<-\n\nexit 0\n```\n\nA document\
    \ supports parameter and command substitution. It is therefore possible to pass\
    \ different parameters to the body of the document, changing its output accordingly.\n\
    \n# Example 17–5. Here document with parameter substitution\n\n```\n#!/bin/bash\n\
    # Another 'cat' here document, using parameter substitution.\n\n# Try it with\
    \ no command line parameters, ./script\n# Try it with one command line parameter,\
    \ ./script Mortimer\n# Try it with one two-word quoted command line parameter,\n\
    # ./script \"Mortimer Jones\"\n\nCMDLINEPARAM=1    # Expect at least command line\
    \ parameter.\n\nif [ $ -ge $CMDLINEPARAM ];\nthen\n  NAME=$1\n  # then just take\
    \ the first.\nelse\n  NAME=\"John Doe\" # Default, if no command line parameter.\n\
    fi\n\nRESPONDENT=\"the author of this fine script\"\n```\n\nChapter 17. Here Documents"
