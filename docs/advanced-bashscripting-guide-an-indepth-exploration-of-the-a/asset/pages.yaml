  md: '# Chapter 15. Arithmetic Expansion


    Arithmetic expansion provides a powerful tool for performing arithmetic operations
    in scripts. Translating a string into a numerical expression is relatively straightforward
    using backticks, double parentheses, or let.


    # Variations


    Arithmetic expansion with backticks (often used in conjunction with expr)


    ```

    z=`expr $z + 3`    # ''expr'' does the expansion.

    ```


    Arithmetic expansion with double parentheses, ((...)) and the very convenient
