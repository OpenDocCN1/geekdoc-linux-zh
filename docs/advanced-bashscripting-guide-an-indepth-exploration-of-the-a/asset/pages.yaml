  md: "# Advanced Bash–Scripting Guide\n\nExample 16–4. Redirected until loop\n\n\
    ```\n#!/bin/bash\n# Same as previous example, but with \"until\" loop.\n\nif [\
    \ -z \"$1\" ]\nthen\n  Filename=names.data      # Default, if no filename specified\n\
    else\n  Filename=$1\nfi\n\nwhile [ \"$name\" != Smith ]\nuntil [ \"$name\" = Smith\
    \ ]\ndo\n  read name\n  echo $name\n  done=\"$Filename\"        # Redirects stdin\
    \ to file $Filename\n~~~~~~~~~~~\n```\n\n# Same results as with \"while\" loop\
    \ in previous example.\n\nexit 0\n\nExample 16–5. Redirected for loop\n\n```\n\
    #!/bin/bash\nif [ -z \"$1\" ]\nthen\n  Filename=names.data      # Default, if\
    \ no filename specified\nelse\n  Filename=$1\nfi\n\nline_count=`wc $Filename |\
    \ awk '{ print $1 }'`\n#                         Number of lines in target file.\n\
    # Very converted and kludgy, nevertheless shows that\n#+ it's possible to redirect\
    \ stdin within a \"for\" loop...\n#+ if you're clever enough.\n# More concise\
    \ is      line_count=$(wc < \"$Filename\")\n\nfor name in `seq line_count`\nwhile\
    \ [ \"$name\" != Smith ]\n# Recall that \"seq\" sequence of numbers.\n  # more\
    \ complicated than a \"while\" loop --\ndo\n  read name\n  echo $name\n  if [\
    \ \"$name\" = Smith ]\n    # Need all this extra baggage here.\n    break\n  fi\n\
    \  done=\"$Filename\"        # Redirects stdin to file $Filename\n~~~~~~~~~~~\n\
    \nexit 0\n```\n\nWe can modify the previous example to also redirect the output\
    \ of the loop.\n\n# 16.2. Redirecting Code Blocks"
