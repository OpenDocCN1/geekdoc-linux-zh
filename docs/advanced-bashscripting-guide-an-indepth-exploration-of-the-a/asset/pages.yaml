    \ characters: 0000000 1198195154n.\n# Here it finds a newline character,\n# so\
    \ it is ready to process the first line (0000000 1198195154).\n# It looks at its\
    \ <range><a>-s. The first and only one is\n\n# range           action\n# 1   \
    \            s/. // pp\n\n# The text line is in the range, it executes the action:\n\
    # tries to substitute the longest string with a space in the line\n# (\"0000000\"\
    \ with nothing (//), and if it succeeds, prints the result\n# (\"*p\" is a flag\
    \ to the \"s\" command, which is different from the \"p\" command\n\n# sed is\
    \ now ready to continue reading its input. (Note that before\n# continuing, if\
    \ -n option had not been passed, sed would have printed\n# the line once).\n\n\
    # Now, sed reads the remainder of the characters, and finds the end of the file.\n\
    # It is now ready to process its second line (which is also numbered '$') as\n\
    # it's the last one.\n# it sees no matched by <range>, so its job is done.\n\n\
    # In few this sed command means:\n# \"On the first line only, remove any character\
    \ up to the right-most space,\n# then print it.\"\n\n# A better way to do this\
    \ would have:\n# sed -e '$s/. //q'\n\n# Here, two <range><a>-s (could have been\
    \ written\n# sed -e '$s.*/' -e q):\n\n# range           action\n# nothing (matches\
    \ line)  s/. //\n# nothing (matches line)  q (quit)\n\n# sed, only reads its first\
    \ line of input. (substituted) before quitting\n# It performs both actions, and\
    \ prints the line (because of the \"q\" command)\n# since the \"-n\" option is\
    \ not passed.\n\n\n# A simpler alternative to the above 1-line script would be:\n\
