  md: "# Advanced Bash–Scripting Guide\n\n```\nread name\necho $name      # Reads\
    \ from $Filename, rather than stdin.\nlet \"count\" += 1\ndone <\"$Filename\"\
    \ # Redirects stdin to file $Filename.\n~~~~~~~~~~~\n```\n\necho; echo \"$count\
    \ names read\"; echo\n\n+   # Note that in some older shell scripting languages,\n\
    +# the redirected loop would run as a subshell.\n# Therefore, $count would return\
    \ 0, the initialized value outside the loop.\n# Bash and k avoid starting a subshell\
    \ whenever possible,\n# +so this script, for example, runs correctly.\n\n# Thanks\
    \ to Heiner Steven for pointing this out.\n\nexit 0\n\n# Example 16-3. Alternate\
    \ form of redirected while loop\n\n```\n#!/bin/bash\n\n# This is an alternate\
    \ form of the preceding script.\n\n# Suggested by Heiner Steven\n+# as a workaround\
    \ in those situations when a redirect loop\n+# runs as a subshell, and therefore\
    \ variables inside the loop\n+# +do do not keep their values upon loop termination.\n\
    ```\n\n```\nif [ -z \"$1\" ]\nthen\n  Filename=names.data      # Default, if no\
