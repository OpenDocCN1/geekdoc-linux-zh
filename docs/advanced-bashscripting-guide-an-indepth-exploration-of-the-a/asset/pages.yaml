  md: "# Chapter 25. List Constructs\n\nThe \"and\" and \"or\" constructs provide\
    \ a mean of processing commands consecutively.\nThese effectively replace complex\
    \ nested if/then or case statements.\n\nChaining together commands\n\nand list\n\
    \n```\ncommand-1 && command-2 && command-3 ... command-n\nEach command executes\
    \ in turn provided that the previous command has given a return value of\n(zero).\
    \ The first false (non-zero) return, the command chain terminates (the first command\n\
    returning false is the last one to execute).\n```\n\nExample 25–1. Using an \"\
    and list\" to test for command–line arguments\n\n```\n#!/bin/bash\n# \"and list\"\
    \n\nif [ ! -z \"$1\" ] && echo \"Argument $1 = $1\" && [ ! -z \"$2\" ] && echo\
    \ \"Argument $2 = $2\"\nthen\n    echo \"At least 2 arguments passed to script.\"\
    \n    # All the chained commands return true.\nelse\n    echo \"Less than 2 arguments\
    \ passed to script.\"\n    # At least one of the chained commands returns false.\n\
    fi\n# Note that \"if [ -n $1 ]\" works, but its supposed equivalent,\n# if [ -n\
    \ $1 ] does not. However, quote fixes this.\n# if [ -n \"$1\" ] works. Careful!\n\
    # It is best to always quote tested variables.\n```\n\n```\n# This accomplishes\
    \ the same thing, using \"pure\" if/then statements.\nif [ ! -z \"$1\" ]\nthen\n\
    \    echo \"Argument $1 = $1\"\nfi\nif [ ! -z \"$2\" ]\nthen\n    echo \"Argument\
    \ $2 = $2\"\n    echo \"At least 2 arguments passed to script.\"\nelse\n    echo\
    \ \"Less than 2 arguments passed to script.\"\nfi\n# It's longer and less elegant\
    \ than using an \"and list\".\n```\n\n```\nexit 0\n```\n\n```\n#!/bin/bash\nARGS=1\
    \ [ ! -z $i ] # Number of arguments expressed.\n```\n\nChapter 25. List Constructs"
