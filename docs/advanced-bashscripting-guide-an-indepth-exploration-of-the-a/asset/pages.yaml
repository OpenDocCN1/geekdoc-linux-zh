    # setserial


    Set or display serial port commands. This must be run by root user and is usually
    found in a system setup script:


    ```

    # From /etc/pcmia/dev/$DEVICE | sed -e ''s/\.*/IRQ: /\*/''

    setserial /dev/$DEVICE irq 0 ; setserial /dev/$DEVICE irq $IRQ

    ```


    # getty, agetty


    The initialization process for a terminal uses getty or agetty to set it up for
    login by a user. Commands are not used within shell scripts. Their scripting counterpart
    is stty.


    # mesg


    Enables or disables write access to the current user''s terminal. Disabling access
    would prevent another user on the network to write to the terminal.


    > It can be very annoying to have a message about ordering pizza suddenly appear
    in the middle of the text file you are editing. In a multi-user network, you might
    therefore wish to disable access to your terminal when you need to avoid interruptions.


    # wall


    This is an acronym for "write all", i.e., sending a message to all users at every
    terminal logged into the network. It is primarily a system administrator''s tool,
    useful, for example, when warning everyone that the system will shortly go down
    due to a problem (see Example 17–2).


    ```

    bash$ System going down for maintenance in 5 minutes!

    Broadcast message from bozo (pts/1) Sun Jun 8 13:53:27 2001...


    System going down for maintenance in 5 minutes!

    ```


    If access to a particular terminal has been disabled with mesg, then wall cannot
    send a message to it.


