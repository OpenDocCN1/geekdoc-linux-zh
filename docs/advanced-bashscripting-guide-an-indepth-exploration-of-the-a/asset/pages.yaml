  md: "# Advanced Bash-Scripting Guide\n\n```\n{ is a shell builtin\nbash$ type '['\n\
    [[ is a shell keyword\nbash$ type ']]'\n]] is a shell keyword\nbash$ type ''\n\
    bash: type: ]: not found\n```\n\nExample 7–2. Equivalence of [ ] and test\n\n\
    ```\n#!/bin/bash\necho\n\nif test -z \"$1\"\nthen\n    echo \"No command-line\
    \ arguments.\"\nelse\n    echo \"First command-line argument is $1\"\nfi\n\nif\
    \ [ -z \"$1\" ]; # Functionally identical to code block.\n# if [ -z \"$1\" ] should\
    \ work, but...\n+# Bash responds to a missing close bracket with an error message.\n\
    then\n    echo \"No command-line arguments.\"\nelse\n    echo \"First command-line\
    \ argument is $1\"\nfi\n\necho\n\nexit 0\n```\n\nThe ([ ]) construct the shell\
    \ equivalent of [ ]. This is the extended test command, adopted from ksh88.\n\n\
    No filename expansion or word splitting takes place between [ and ], but there\
    \ is parameter expansion and command substitution.\n\n```\nfile=/etc/passwd\n\
    if [ -e $file ]\nthen\n    echo \"Password file exists.\"\nfi\n```\n\nUsing the\
    \ [[ ... ]] construct, rather than [ ... ] can prevent many logic errors in scripts.\
    \ For example, the &&., ||, <, and > operators work within a [[ ] ] test, despite\
    \ giving an error within a [ ] construct.\n\nChapter 7. Tests\n\n43"
