- pgno: 44
  md: '# Chapter 7. Tests


    Every reasonably complete programming language test for a condition, then act
    according to the result of the test. Bash introduced the test command, various
    bracket and parenthesis operators, and the if/then construct.


    # 7.1. Test Constructs


    +   - An if/then construct tests whether the exit status of a list of commands
    is 0 (since 0 means "success" by UNIX convention), and if so, executes one or
    more commands.

    - There exists a dedicated command [[ left bracket special). It is a synonym for
    test, and a builtin for efficiency reasons. This command returns an status corresponding
    to the result of the comparison (0 for true, 1 for false).

    - With version 2.02, the [...] extended test command, which performs comparisons
    in a manner more familiar to programmers from other languages. Note that [[ is
    a keyword, not a command.


    Bash sees [[ $a -lt $b ]] as a single element, which returns an exit status.


    The ((...)) and let..., also return an exit status of 0 if the arithmetic expressions
    they evaluate to a non-zero value. These arithmetic expansion constructs may be
    used to perform arithmetic comparisons.


    ```

    let "<2" returns 0 (as "<2" expands to "1")

    (( 0 && 1 )) returns 1 (as "0 && 1" expands to "0")

    ```


    +   - An if can test any command, not just constructs enclosed within brackets.

    ```bash

    if cmp a b > /dev/null # Suppress output.

    then echo "Files and b are identical."

    else echo "Files and b differ."

    fi


    if grep -q Bash file

    then echo "File contains at least one occurrence of Bash.

    fi


    if COMMAND_WHOSE_EXIT_STATUS_IS_0_UNLESS_ERROR_OCCURRED

    then echo "Command succeeded."

    else echo "Command failed."

    fi


    An if/then construct can next nested comparisons and tests.

    then echo "Next *if* is part of the comparison for the first *if*."


    if [[ $comparison = "integer" ]]

    then (( a < b ))

    else

    [[ $a < $b ]]

    fi


    then

    echo "$a is less than $b"

    fi

    ```


