- pgno: 252
  md: '# Chapter 20. Subshells


    Running a shell script launches another instance of the command processor. Just
    as your commands are interpreted at the command line prompt, similarly does a
    script batch process a list of commands in a file. Each shell script running is,
    in effect, a subprocess of the parent shell, the one that gives you the prompt
    at the console or in x window.


    A shell script can also launch subprocesses. These subshells let the shell do
    parallel processing, executing multiple subtasks simultaneously.


    # Command List in Parentheses


    ( command1; command2; command3; )


    > A command list embedded between parentheses runs as a subshell.


    Variables in a subshell are not visible outside the block of code in the subshell.
    They are not accessible to the parent process, to the shell that launched the
    subshell. These are, in effect, local variables.


    # Example 20–1. Variable scope in a subshell


    ```

    #!/bin/bash

    # subshell.sh


    echo

    outer_variable=Outer

    {

    inner_variable=Inner

    echo From subshell, "inner_variable" = $inner_variable

    echo From subshell, "outer" = $outer_variable

    }

    echo

    if [ -z "$inner_variable" ]

    then

    echo "inner_variable undefined in main body of shell"

    else

    echo "inner_variable defined in main body of shell"

    fi

    echo "From main body of shell, "inner_variable" = $inner_variable

    # $inner_variable will show as uninitialized because

    # variables defined in a subshell are "local variables".


    echo

    exit 0

    ```'
  merge: -1
  img_proc: true
- pgno: 253
  md: "# Advanced Bash–Scripting Guide\n\nSee also Example 32–1.\n\n+\n\nDirectory\
    \ changes made in a subshell do not carry over to the parent shell.\n\n# Example\
    \ 20–2. List User Profiles\n\n```\n#!/bin/bash\n# allprofs.sh: print all user\
    \ profiles\n\n# This script written by Heiner Steven, modified by the document\
    \ author.\n\nFILE=.bashrc # File containing user profile,\n#+ was \".profile\"\
    \ in original script.\n\nfor home in awk -F: '$(print $6)' /etc/passwd\ndo\n \
    \   [ -d \"$home\"] || continue # If no home directory, go to next.\n    [ -r\
    \ \"$home\"] || continue # If not readable, go to next.\n    cd $home; [ -e $FILE\
    \ ] && $FILE\ndone\n\n# When script terminates, there is no need to 'cd' back\
    \ to original directory,\n+# because 'cd $home' takes place in a subshell.\n\n\
    exit 0\n```\n\nA subshell may be used to set up a \"dedicated environment\" for\
    \ a command group.\n\n```\nCOMMAND1\nCOMMAND2\nCOMMAND3\n(\nIFS=-/bin\nPATH=-C\n\
    unset TERMINFO\nset -C\nshift 5\nCOMMAND4\nCOMMAND5\nexit 3 # Only exits the subshell.\n\
    ```\n\n# The parent shell has not been affected, and the environment is preserved.\n\
    \nCOMMAND6\nCOMMAND7\n\nOne application of this is testing whether a variable\
    \ is defined.\n\n```\nif (set -u ; $variable) 2 /dev/null\nthen\necho \"Variable\
    \ is set.\"\nfi\n```\n\n```\n# Could also be written\n[[ $(variable-x) != $(variable-y)\
    \ != != y ]]\n# or\n[[ $(variable-x) != x$variable ]]\n# or\n[[ $(variable+x)\
    \ = x ]]\n```\n\nAnother application is checking for a lock file:\n\n```\nif (set\
    \ -C; : > lock_file) 2 > /dev/null\n```\n\n# Chapter 20. Subshells\n\n248"
