    # Appendix B. A Sed and Awk Micro–Primer


    This is a very brief introduction to the sed and awk text processing utilities.
    We will deal with only a few basics here, but that will suffice for understanding
    simple sed and awk constructs within shell scripts.


    sed: a non-interactive text editor


    awk: a field–oriented pattern processing language with a C–like syntax


    For all their differences, the two utilities share a similar invocation syntax,
    both use regular expressions, but read input by default from stdin, and both output
    to stdout. These are well–behaved UNIX tools, and they work together well. The
    output from one can be piped into the other, and their combined capabilities give
    shell some the power of Perl.


    ![](img/1ce1edffaa36e4f698a85430e71c6d3b_365_0.png)


    One important difference between the utilities is that while scripts can easily
    pass arguments to sed, it is more complicated for awk (see Example 34–3 and Example
    9–20).


    # B.1. Sed


    Sed is a non–interactive line editor. It receives input, from stdin or from a
    file, performs certain operations on specified lines of the input, one line at
    a time, then outputs the result to stdout or a file. Within a shell script, sed
    is usually one of several tool components in a pipe.


    Appendix B. A Sed and Awk Micro–Primer


    360'
