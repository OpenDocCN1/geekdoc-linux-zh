- pgno: 6
  md: '# Chapter 1. Why Shell Programming?


    A working knowledge of shell scripting is essential to everyone wishing to become
    adept at system administration, even if they do not anticipate ever having to
    write a script. Consider that as a Linux machine boots up, it executes the scripts
    in /etc/rc.d to restore the system configuration and set up services. A detailed
    understanding of these startup scripts is important for analyzing the behavior
    of a system, and possibly modifying it.


    Writing scripts is not hard to learn, since the scripts can be built in bite-sized
    systems and there is only a small set of shell-specific operators and operations
    A1 to learn. The syntax is simple and straightforward, similar to that of invoking
    and chaining together utilities at the command line, and there are only a few
    "rules" to learn. Most scripts work the first time, and debugging when the longer
    ones is straightforward.


    A shell script is a "quick and dirty" method of prototyping a complex application.
    Given even a limited subset of the functionality to a shell script, even if slowly,
    is often a useful first stage in development. Then the structure of the application
    can be tested and played, and the major pitfalls found before proceeding to the
    final coding in C, C++, Java, or Perl.


    Shell scripting hearns back to the Unix breaking complex projects into subtasks,
    of chaining together components and utilities. Many consider this a better, or
    at least esthetically pleasing approach to problem solving than using the one
    generation of high powered all-in-one languages, such as Perl, which attempt to
    be all things to all people, but at the cost of forcing you to alter your thinking
    processes to fix the tool.


    When not to use shell scripts


    +   * resource-intensive tasks, where speed is a factor (sorting, hashing, etc.)

    * procedures involving heavy-duty operations, especially floating point arithmetic,
    arbitrary precision calculations, or complex numbers (use C++ or FORTRAN instead)

    * cross-platform portability required (use C instead)

    * complex applications, where structured programming is a necessity (need typechecking
    of variables, function prototypes, etc.)

    * mission-critical applications when you are at the bench, or to the future of
    the company

    * situations where security is important, where you need to guarantee the integrity
    of your system and protect against intrusion, cracking, and vandalism

    * project consists of subsystems with interlocking dependencies

    * extensive file operations required (Bash is limited to serial file access, and
    that only in a particularly clumsy and inefficient line-by-line fashion)

    * need multi-dimensional arrays

    * need data structures, such as linked lists or trees

    * need to generate or manipulate graphics or GUIs

    * need direct access to system hardware

    * need port or socket I/O

    * need to use libraries or interface with legacy code

    * proprietary, closed-source applications (shell scripts are necessarily Open
    Source)


    If any of the above applies, consider a more powerful scripting language, perhaps
    Perl, Tcl, Python, or possibly a high-level compiled language such as C, C++,
    or Java. Even then, prototyping the application as a shell script might be a useful
    development step.


    Chapter 1. Why Shell Programming?'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# Advanced Bash–Scripting Guide


    We will be using Bash, an acronym for "Bourne–Again Shell" and a pun on Stephen
    Bourne''s classic Bourne Shell. Bash has become a de facto standard for shell
    scripting on all flavors of UNIX. Most of the principles dealt with in this book
    apply equally well to scripting with other shells, such as the Korn Shell, from
    which Bash derives some of its features, [2] and the C Shell and its variants.
    (Note that C Shell programming is not recommended due to certain inherent problems,
    as pointed out in a news group posting by Tom Christensen in October of 1993).


    The following is a tutorial in shell scripting. It relies heavily on examples
    to illustrate the features of the shell. As far as possible, the example scripts
    have been tested, and some of them may actually be useful in real life. The reader
    should use the actual examples in the source archive (`chmod u+rx something-or-other.sh`,
    [3] give them execute permission), then run them to see what happens. Should the
    source archive not be available, then cut-and-paste from the HTML, pdf, or text
    rendered versions. Be aware that some of the scripts below introduce features
    before they are explained, and this may require the reader to temporarily skip
    ahead for enlightenment.


    Unless otherwise noted, the author wrote the example scripts that follow.


    Chapter 1. Why Shell Programming? 2'
  merge: -1
  img_proc: true
- pgno: 8
  md: "# Chapter 2. Starting Off With a Sha-Bang\n\nIn the simplest case, a script\
    \ is nothing more than a list of system commands stored in a file. At the very\
    \ least, this saves the effort of retyping that particular sequence of commands\
    \ each time it is invoked.\n\nExample 2–1. cleanup: A script to clean up the log\
    \ files in /var/log\n\n```\n# cleanup\n# Run as root, of course.\n\ncd /var/log\n\
    cat /dev/null > messages\ncat /dev/null > wtmp\necho \"Logs cleaned up.\"\n```\n\
    \nThere is nothing unusual here, just a set of commands that could as easily be\
    \ invoked by one from the command line in a console or an xterm. The advantages\
    \ of placing the commands in a script beyond having to retype them time and again.\
    \ The script can easily be modified, customized, or generalized for a particular\
    \ application.\n\nExample 2–2. cleanup: An enhanced and generalized version of\
    \ above script.\n\n```\n#!/bin/bash\n# cleanup, version 2\n# Run as root, of course.\n\
    \nLOG_DIR=/var/log\nROOT_UID=0          # Only users with UID 0 have root privileges.\n\
    LINES=50            # Default number of lines saved.\nE_XCD=66             # Can't\
    \ change directory?\nE_NOTROOT=67         # Non-root exit error.\n\nif [ -ne \"\
    $ROOT_UID\" ];\nthen\n    echo \"Must be root to run this script.\"\n    exit\
    \ $E_NOTROOT\nfi\n\nif [ -n \"$1\" ];\n    # Test if command line argument present\
    \ (non-empty).\nthen\n    lines=$1\nelse\n    lines=$LINES # Default, if not specified\
    \ on command line.\nfi\n\n# Stephanie Chazelas follows the following,\n# as a\
    \ better way of checking command line arguments,\n# but this is still a bit advanced\
    \ for this stage of the tutorial.\n\n    E_WRONGARGS=65     # Non-numerical argument\
    \ (bad arg format)\n    case \"$1\" in\n```"
  merge: -1
  img_proc: true
- pgno: 9
  md: "# Advanced Bash–Scripting Guide\n\n```\n# == lines=50;\n# *[!0-9]*) echo \"\
    Usage: $basename $0\" file-to-cleanup\"; exit $E_WRONGARGS;\n# # lines=$1;\nesac\n\
    ```\n\n# Skip ahead to \"Loops\" chapter to understand.\n\n```\n$LOG_DIR\nif [\
    \ 'pwd' != \"$LOG_DIR\" ] # or if [ \"$PWD\" != \"$LOG_DIR\" ]\n# Not in /var/log?\n\
    then\necho \"Can't change to $LOG_DIR\"\nexit $E_XCD\nfi # Doublecheck if in right\
    \ directory, before messing with log file.\n```\n\n```\n# far better is:\n#\n\
    # cd /var/log || {\n  echo \"Cannot change to necessary directory.\" >&2\n  exit\
    \ $E_XCD\n}\n```\n\n```\ntail -$lines messages > mesg.tmp # Saves last section\
    \ of message log file.\nmv mesg.tmp messages # Becomes new directory.\n```\n\n\
    ```\n# cat /dev/null messages\n# No longer needed, as the above method is safer.\n\
    ```\n\n```\ncat /dev/null ~wtmp # ~wtmp has the same effect.\necho \"Logs cleaned\
    \ up.\"\n```\n\n```\nexit 0\n# A zero return value from the script upon exit\n\
    # indicates success to the shell.\n```\n\nSince you may not wish to wipe out the\
    \ entire system, this variant of the first script keeps the last section of the\
    \ message log. You will constantly discover ways of refining scripts for increased\
    \ effectiveness.\n\nThe *sha-bang* (#) at the head of a script tells your system\
    \ this is a set of commands to be fed to the command interpreter. The # is actually\
    \ a two-byte [magic number\", a special marker that designates a file type, or\
    \ in the case of an executable shell (see **man magic** for details on this fascinating\
    \ topic). Immediately following the *sha-bang* is a path name. This is the path\
    \ to the program that interprets the commands, whether it be a shell, a programming\
    \ language, or a utility. This command interpreter executes the commands in the\
    \ script, at the top (line 1 of the script), [5]\n\n```\n#!/bin/sh\n#!//bin/bash\n\
    #!//usr/bin/perl\n#!//usr/bin/tcl\n#!//bin/sed -f\n#!//usr/awk -f\n```\n\nChapter\
    \ 2. Starting Off With a Sha–Bang"
  merge: -1
  img_proc: true
- pgno: 10
  md: "# Advanced Bash–Scripting Guide\n\nEach of the script header lines calls a\
    \ different command interpreter, or /bin/sh, the default (bash in a Linux system)\
    \ or otherwise. [6] Using #!/bin/sh, the default Bourne Shell in most commercial\
    \ variants of UNIX, the script portable to non-Linux machines, though you may\
    \ have to sacrifice a few Bash-specific features (the script will conform to the\
    \ POSIX [7] standard).\n\nNote that the path given at \"sha-bang\" must be correct,\
    \ otherwise an error message, usually \"Command not found\" will be the only result\
    \ of running the script.\n\n#! can be omitted if the script consists only of a\
    \ generic system commands, using no internal directives. Example 2, above, requires\
    \ the initial #!, the variable assignment line, line=50, uses a shell-specific\
    \ construct. Note that #!/bin/sh invokes the default interpreter, which defaults\
    \ to /bin/bash on a Linux machine.\n\n![](img/1ce1edffaa36e4f698a85430e71c6d3b_10_0.png)\n\
    \nThis tutorial encourages a modular approach to constructing a script. Make note\
    \ of and collect \"boilerplate\" code snippets that might be useful in future\
    \ scripts. Eventually you can build a quite library of nifty routines. As an example,\
    \ the following script prolog tests whether the script has been invoked with the\
    \ correct number of parameters.\n\n```\nif [ $# -ne Number_of_expected_args ]\n\
    then\n    echo \"Usage: basename $0 whatever\"\n    exit WRONG_ARGS\nfi\n```\n\
    \n# 2.1. Invoking the script\n\nHaving written the script, you can invoke it by\
    \ sh scriptname, [18] or alternately bash scriptname. (Not recommended is using\
    \ sh <scriptname, since this effectively disables reading from stdin within the\
    \ script.) More convenient is to make the script itself directly executable with\
    \ chmod.\n\nEither:\n\n```\nchmod 555 scriptname (gives everyone read/execute\
    \ permission) [9]\n\nchmod +rx scriptname (gives everyone read/execute permission)\n\
    \nchmod u+rx scriptname (gives only the owner read/execute permission)\n```\n\n\
    or\n\nHaving made the script executable, you may now test it by ./scriptname.\
    \ [10] If it begins with a \"sha-bang\" line, the script calls the correct command\
    \ interpreter to run it.\n\nAs a final step, after testing and debugging, you\
    \ would likely like to move it to /usr/local/bin (as root, of course), to make\
    \ the script available to yourself and all other users as a system-wide executable.\
    \ The script could then be invoked by simply typing scriptname [ENTER] from the\
    \ command line.\n\n# 2.1. Invoking the script\n\n* This"
  merge: -1
