  md: "# Advanced Bash–Scripting Guide\n\n```\nParseDate () {\n  # Parse date from\
    \ command line params.\n  month=${1%%/*}\n  # Day and month.\n  day=${1#*/}\n\
    \  let year = `basename $1`  # Not a filename, but works just the same.\n}\n\n\
    check_date () {\n  # Checks for invalid date($s) passed.\n  [ \"$day\" -gt \"\
    $DIM\" ] || [ \"$month\" -gt \"$MIY\" ] || [ \"$year\" -lt \"$REFURY\" ] && Param_Error\
    \ \"Exit script on bad value($s)\"\n  # Uses \"or -and-list\"\n  # Exercise: Implement\
    \ more rigorous date checking.\n}\n```\n\n```\nstrip_leading_zero () {\n  # Better\
    \ to strip possible leading zero(s)\n  # from day/and or month\n  val=${1#0}\n\
    \  # since otherwise Bash will interpret them\n  return $val  # as octal values\
    \ (POSIX.2, sect.2.9.2.1).\n}\n```\n\n```\nday_index () {\n  # Gauss' Formula:\n\
    \  # Days from Jan. 3, 1600 to date passed as param.\n  day=$1\n  month=$2\n \
    \ year=$3\n\n  let \"month = $month - 2\"\n  if [ \"$month\" -le 0 ]; then\n \
    \   let \"month += 12\"\n    let \"year -= 1\"\n  fi\n\n  let \"year -= $REFURY\"\
    \n  let \"index = $year + $year / CENTURY\"\n}\n```\n\n```\nlet Days = $DAY*$year\
    \ + $year/LEAPCYCLE - $index + $year/$LEAPCYCLE + $ADJ_DAY*$month/$month/\n# For\
    \ an in-depth explanation of this algorithm, see\n# http://today-t-online.de/home/berndt.schwerdtfeger/cal.htm\n\
    ```\n\n```\nif [ \"$Days\" -gt \"$MAXRETVAL\" ]; then\n  # then change to negative\
    \ value\n  let \"dindex = 0 - $Days\"\nelse let \"dindex = $Days\"\n  # which\
