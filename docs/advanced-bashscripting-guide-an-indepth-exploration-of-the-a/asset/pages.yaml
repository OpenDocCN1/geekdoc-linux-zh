    \ during input to a read. The -r option causes an inputted \\ to be interpreted\
    \ literally.\n\nExample 11–3. Multi-line input to read\n\n```\n#!/bin/bash\necho\n\
    echo \"Enter a string terminated by a \\\\, then press <ENTER>\"\necho \"Enter,\
    \ enter a second string, and again press <ENTER>\"\nread var1\n    # The \\\"\
    \ suppresses the newline, when reading \"var1\"\n    # first line\n    # second\
    \ line\necho \"var1 = $var1\"\n    var = first line second line\n\n# For each\
    \ line terminated by a \\\"\n# you get a prompt on the next line to continue feeding\
    \ characters into var1.\necho;\necho \"Another string terminated by a \\\\, then\
    \ press <ENTER>\"\nread -r var2\n    # The -r option causes the \\\" to be read\
    \ literally.\n    # first line \\\\\necho \"var2 = $var2\"\n    # var2 = first\
    \ line \\\\\n# Data entry terminates with the first <ENTER>.\necho\n\nexit 0\n\
    ```\n\nThe read command has some interesting options that permit echoing a prompt\
    \ and even keystrokes without hitting ENTER.\n\n```\n# Read a keypress without\
    \ hitting ENTER.\nread -s -nl -p \"Hit a key keypress\"\necho; Keypress was \"\
    \\$keykeypress\\\"\"\n\n# -s option means not do echo input.\n# -n option accepts\
    \ only N characters of input.\n# -p option means the following prompt before reading\
    \ input.\n\n# Using these options is tricky, since they need to be in the correct\
    \ order.\n```\n\nThe -t option to read permits input (see Example 9–4).\n\nThe\
    \ read command may also mean \"read\" its variable value from a file redirected\
    \ to stdin. If it contains more than one line, only the first line is assigned\
