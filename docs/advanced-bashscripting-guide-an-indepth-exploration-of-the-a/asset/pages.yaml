- pgno: 313
  md: "# Chapter 33. Scripting With Style\n\nGet into the habit of writing shell scripts\
    \ in a structured and systematic manner. Even \"on–the-fly\" and \"written on\
    \ the back of an envelope\" scripts will benefit if you take a few minutes to\
    \ plan and organize your thoughts before sitting down coding.\n\nHerewith a few\
    \ stylistic guidelines. This is not intended as an Official Shell Scripting Stylesheet.\n\
    \n# 33.1. Unofficial Shell Scripting Stylesheet\n\n+   * Comment your code. This\
    \ makes it easier to understand (and appreciate), and easier for you to maintain.\n\
    * PASS=\"$PASSES(MATRIX:$($RANDOM$(#MATRIX))):):1\"\n* It made perfect sense when\
    \ you wrote it last year, but now it's a complete mystery.\n* (From Anton Sawicki's\
    \ \"pw.sh\" script.)\n\nAdd descriptive headers to your scripts and functions.\n\
    \n```\n#!/bin/bash\n\n****************************************************\n#\
    \ xyz.sh\n# written by Bozo Bozman\n# July 05, 2001\n\n# Clean up project files.\n\
    ****************************************************\n\nBADDIR=65      # No such\
    \ directory.\nprojectdir=/home/bozo/projects  # Directory to clean up.\n\n####################################################\n\
    cleanup_files() {\n# Removes all files in designated directory\n# Parameter: $target_directory\n\
    # Returns: 0 on success, $BADDIR if something went wrong.\n####################################################\n\
    cleanup_files() {\n  if [ ! -d \"$1\" ]; # Test if target directory exists.\n\
    \  then\n    echo \"$1 is not a directory.\"\n    return $BADDIR\n  fi\n\n  rm\
    \ -f \"$1\"*      # Success.\n  return 0\n}\n\ncleanup_files $projectdir\n\nexit\
    \ 0\n```\n\nBe sure to put the #!/bin/bash at the beginning of the first line\
    \ of the script, preceding any comment headers."
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Advanced Bash–Scripting Guide


    +   * Avoid using "magic numbers", [62] that is, "hard-wired" literal constants.
    Using meaningful variable names instead. This makes the script easier to edit
    and permits making changes and updates without breaking the application.


    ```

    if [ -f /var/log/messages ]

    then

    fi

    # A year later, you decide to change the script to check /var/log/syslog.

    # It is now necessary to change the script, instance by instance,

    # and hope nothing breaks.


    # A better way:

    LOGFILE=/var/log/messages # Only line that needs to be changed.

    if [ -f "$LOGFILE" ]

    then

    fi

    ```


    +   * Choose descriptive names for variables and functions.


    ```

    fl=''ls -al $dirname # Cryptic.

    file_listing=''ls -al $dirname # Better.


    MAXVAL=10 # All caps used for a script constant.

    while [ "$index" -le "$MAXVAL" ]

    ...


    E_NOTFOUND=75 # Uppercase for an errorcode,

    # and name begins with "E_"

    if [ ! -e "$filename" ]

    then

    echo "File $filename not found."

    exit $E_NOTFOUND

    fi

    ```


    ```

    MAIL_DIRECTORY=/var/spool/mail/bozo # Uppercase for an environmental variable.

    export MAIL_DIRECTORY

    ```


    ```

    GetAnswer ()

    {

    prompt=-n $prompt # Mixed case works well for a function.

    read answer

    return $answer

    }

    ```


    ```

    GetAnswer "What is your favorite number? "

    avorite_number=$?

    echo $favorite_number

    ```


    ```

    _uservariable=23 # Permissible, but not recommended.

    # It''s better for user-defined variables not to start with an underscore.

    ```


    +   * Use exit codes in a systematic and meaningful way.


    ```

    E_WRONG_ARGS=65

    ...

    exit $E_WRONG_ARGS

    ```


    Chapter 33. Scripting With Style


