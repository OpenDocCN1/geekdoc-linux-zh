  img_proc: true
- pgno: 366
  md: '# Advanced Bash–Scripting Guide


    Sed determines which lines of its input it will operate on the address range passed
    to it.

    [65] Specify this address range either by line number or a pattern to match. For
    example, 3d signals to delete line 3 of the input, and /windows/d tells that you
    want every line of the input containing a match to "windows" deleted.


    All of the operations in the sed toolkit, we will primarily focus on the three
    most commonly ones. These are printing (stdout), deletion, and substitution.


    Table B–1. Basic sed operators

    | Operator | Name | Effect |

    |---|---|--|

    | [address-range]/p | print | Print [specified address range] |

    | [address-range]/d | delete | Delete [specified address range] |

    | s/pattern1/pattern2/ | substitute | Substitute pattern2 for first instance of
    pattern1 in a line |

    | [address-range]/s/pattern1/pattern2/ | substitute | Substitute pattern2 for
    first instance of pattern1 in a line, over address-range |

    | [address-range]/y/pattern1/pattern2/ | transform | replace any character in
    pattern1 with the corresponding character in pattern2, address-range (equivalent
    of tr) |

    | g | global | Operate on every pattern match within each matched line of input
    |


    ![](img/1ce1edffaa36e4f698a85430e71c6d3b_366_0.png)


    Unless the g (global) operator is appended to a substitute command, the substitution
    operates only on the first instance of a pattern match within each line.


    From the command line -e and in a shell script, a sed operation may require quoting
    and certain options.


    ```

    sed -e ''^$/d'' $filename

    # The -e option causes the next string to be interpreted as an editing instruction.

    # (If passing only a single instruction to "sed", the "-e" is optional).

    # The "string" quotes ('''') protect the RE characters in the instruction

    # from reinterpretation as special characters by the body of the script.

    # (This reserves RE expansion of the instruction for sed.)

    # Operates on the text contained in file $filename.

    ```


    Appendix B. A Sed and Awk Micro–Primer


