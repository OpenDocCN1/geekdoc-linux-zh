  md: '# Chapter 26. Arrays


    Newer versions of Bash support one-dimensional arrays. Array elements may be initialized
    with the **variable[xx]** notation. Alternately, a script may introduce the entire
    array by an explicit **declare -a variable** statement. To dereference (find the
    contents of) an array element, use **curly bracket** notation, is, **${variable[xx]}**.


    Example 26–1. Simple array usage


    ```

    #!/bin/bash


    area[11]=23

    are[13]=37

    are[51]=UFOs


    # Array members need not be consecutive or contiguous.


    # Some members of the array can be left uninitialized.

    # Gaps in the array are o.k.


    echo -n "area[11]" = ""

    echo ${area[11]}      # (curly brackets) needed


    echo -n "area[13]" = ""

    echo ${area[13]}


    echo "Contents of area[51] is ${area[51]}"


    # Contents of uninitialized array variable point blank.

    echo -n "area[43]" = ""

    echo ${area[43]}

    echo "${area[43]} unassigned"


    echo


    # Sum of two array variables assigned to third

    rea[5]=expr ${area[11]} + ${area[13]}

    echo "area[5] = area[11] + area[13]"

    echo -n "area[5]" = ""

    echo ${area[5]}


    area[6]=expr ${area[11]} + ${area[5]}

    echo "area[6] = area[11] + area[5]*"

    echo -n "area[6]" = ""

    echo ${area[6]}

    # This fails because adding an integer to a string is not permitted.


    echo; echo; echo


    #------------------------------------------------------

    # Another array, "area2"

    # Another way of assigning array variables...

    # array_name=( XXX YYY ZZZ ... )

    ```


    Chapter 26. Arrays


