  md: "# Advanced Bash–Scripting Guide\n\n```\necho\nfor file in $FILES\ndo\nif [\
    \ ! -e \"$file\" ]    # Check if file exists.\nthen\n    echo \"$file does not\
    \ exist.\"; echo\n    continue\n    # On to next.\nfi\n\nls -l $file | awk '{print\
    \ $9}'    file size: \"$5\" # Print 2 files.\nwhatis basename $file    # File\
    \ info.\necho\ndone\n```\n\nThe [list] in a for loop may contain globbing, that\
    \ is, using wildcards for filename expansion.\n\n# Example 10–4. Operating on\
    \ files with a for loop\n\n```\n#!bin/bash\n# list-glob.sh: Generating [list]\
    \ in a for-loop using \"globbing\"\necho\nfor file *\ndo\n    ls -l \"$file\"\
    \ # Lists files in $PWD (current directory).\n    # Recall that the wild character\
    \ \"* matches everything\n    however, in \"globbing\", it does not match dot-files.\n\
    \n    # If the pattern matches no file, it is expanded to itself.\n    # To prevent\
    \ this, set thes nullglob option\n    # (shopt nullglob)\n    # Thanks, S.C.\n\
    done\necho\nfor file in []*\ndo\n    rm -f \"$file\" # Removes only files beginning\
    \ with \"j\" or \"x\" in $PWD.\n    echo \"Removed file \\$file\"\ndone\necho\n\
    ```\n\nOmitting the [list] in a for loop causes the loop to operate on @$, the\
    \ list of arguments given on the command line to the script. A particularly clever\
    \ illustration of this is Example A–14.\n\n# Example 10–5. Missing in [list] in\
    \ a for loop\n\nChapter 10. Loops and Branches 104"
