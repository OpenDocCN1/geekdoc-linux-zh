  md: "# Chapter 22. Process Substitution\n\nProcess substitution is the counterpart\
    \ to command substitution. Command substitution sets a variable to the result\
    \ of a command, as in dir_contents=-al or xref=$( grep word datafile). Process\
    \ substitution feeds the output of a process to another process (in other words,\
    \ it sends the results of a command to another command)\n\n# Command substitution\
    \ template\n\ncommand within parentheses\n\n>(command)\n\n<command)\n\nThese initiate\
    \ process substitution. This uses /dev/fd/<n> files to send the results of the\
    \ process within parentheses to another process. [151]\n\nThere is no space between\
    \ the \"<\" or \">\" and the parentheses. Space would give an error message.\n\
    \n```\nbash echo >(true)\n/dev/fd/63\nbash echo <(true)\n/dev/fd/63\n```\n\nBash\
    \ creates a pipe with two file_descriptors --fIn and fOut. The stdin of true connects\
    \ to fOut(dup2(Out), then Bash passes a /dev/fd/fIn argument to echo. On systems\
    \ lacking /dev/fd/<n> files use temporary files. (Thanks, S.C.)\n\n+   cat <ls\
    \ -1>\n# Same as\n  ls -1 | cat\nsort -k 9 (<ls -1 /bin) <ls -1 /usr) <ls -1 /X11R6/bin)\n\
    # Lists all the files in the 3 'main' directories, and sorts by filename.\n# Note\
    \ that three (count 'em) distinct commands are fed to 'sort'.\n\n+   diff <(command1)<command2)\
    \  # Gives difference in command output.\ntar cf >bzip2 -c > file.tar.bz2\n# Calls\
    \ \"tar cf /dev/fd/?\" dir\", and \"bzip2 -c > file.tar.bz2\".\n# Because of the\
    \ /dev/fd/<n> system feature,\n# the pipe between both commands needs not to be\
    \ named.\n# This can be enabled.\n# bzip2 -c pipe > file.tar.bz4\ntar cf pipe\
    \ dir\nrm pipe\n\nChapter 22. Process Substitution 252"
