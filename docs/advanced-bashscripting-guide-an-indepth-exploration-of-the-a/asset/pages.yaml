  md: '# Advanced Bash–Scripting Guide


    pipe. Passes the output of previous command to the input of the next one, or to
    the shell. This is a method of chaining commands together.


    ```

    echo ls -1 | sh

    # Passes the output of "echo ls -1" to the shell,

    # with the same result as a simple "ls -1".

    ```


    ```

    cat *.lst | sort | uniq

    # Merges and sorts all ".lst" files, then deletes duplicate lines.

    ```


    A pipe, as a classic method of interprocess communication, sends the stdout of
    one process to the stdin of another. In a typical case, a command, such as cat
    or echo, pipes a stream of data to a filter for processing.


    ```

    cat $filename | grep $search_word

    ```


    The output of a command or commands may be piped to a script.


    ```

    #!/bin/bash

    # uppercase.sh : Changes input to uppercase


    tr ''a-z'' ''A-Z''

    # Letter ranges must be quoted

    # to prevent filename generation from single-letter filenames.

    ```


    Now, let pipe the output of ls -1 /uppercase.sh


    ```

    bash ls -1 | /uppercase.sh

    -RW-WR-R-

    1 BOZO BOZO 109 APR 14 19:49 1.TXT

    -RW-WR-R-

    1 BOZO BOZO 109 APR 14 16:48 2.TXT

    -RW-WR-R-

    1 BOZO BOZO 725 APR 20 20:56 DATA-FILE

    ```


    The stdout of each process in a pipe must be read as the stdin of the next. If
    this is not the case, the data stream will block, and the pipe will not behave
    as expected.


    ```

    cat file file2 | ls -1 | sort

    # The output from "cat file file2" appears.

    ```


    A pipe runs a child process, and therefore cannot alter script variables.


    ```

    variable="initial_value"

    echo "new_value" | read variable

    echo variable="$variable"

    # variable = initial_value

    ```


    If one of the commands in the pipe above, this prematurely terminates execution
    of the pipe. Called a broken pipe sends a SIGPIPE signal.


    Chapter 4. Special Characters'
