  md: "# Advanced Bash–Scripting Guide\n\n```\n[ $varl != ] # Keeps track of what\
    \ $varl was previously.\n# For conditions on \"while\", but only last one controls\
    \ loop.\n# The *last* exit status is the one that counts.\ndo\necho \"Input variable\
    \ #1 (end to exit)\"\nread var\necho \"variable #1 = $varl\"\ndone\n\n# Try to\
    \ figure out this all works.\n# It's a wee bit tricky.\n```\n\nexit 0\n\nAs with\
    \ a for loop, a while loop may employ C-like syntax by using the double parentheses\
    \ construct (see also Example 9–25).\n\n# 10–17. C-like syntax in a while loop\n\
    \n```\n#!/bin/bash\n# wh-loopc.sh: Count to 10 in a \"while\" loop.\n\nLIMIT=10\n\
    a=1\n\nwhile [ \"$a\" -le $LIMIT ]\ndo\n  echo -n\"$a\"\n  let \"a+=1\"\n  # No\
    \ surprises, so far.\ndone\n\necho; echo\n\n############################################################\n\
    \n# Now, repeat with C-like syntax.\n((a = 1)) # a=1\n# Double parentheses permit\
    \ space when setting a variable, as in C.\n\nwhile (( a < LIMIT )) # Double parentheses,\
    \ and no \"$\" preceding variables.\ndo\n  echo -n\"$a\"\n  ((a += 1)) # let \"\
    a+=1\"\n  # Yes, indeed.\n  # Double parentheses permit incrementing a variable\
    \ with C-like syntax.\ndone\n\necho\n\n# Now, C programmers can feel right at\
    \ home in Bash.\n\nexit 0\n```\n\n![](img/1ce1edffaa36e4f698a85430e71c6d3b_116_0.png)\n\
    \nA while loop may have its stdin.redirected to a file by a < at its end.\n\n\
    until\n\nChapter 10. Loops and Branches"
