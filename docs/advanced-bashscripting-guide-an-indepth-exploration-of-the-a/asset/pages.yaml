- pgno: 385
  md: '# Advanced Bash–Scripting Guide


    | IF EXIST FILENAME | if [ -e filename ] | test file exists |

    | IF !%N==! | if [ -z "$N" ] | replaceable parameter "N" not present |

    | CALL | source or (.dot operator) | "include" another script |

    | COMMAND /C | source or (.dot operator) | "include" another script (same as CALL)
    |

    | SET | export | set an environmental variable |

    | SHIFT | shift | left shift command–argument list |

    | SGN | -lt or -gt | sign of (integer) |

    | ERRORLEVEL | $? | exit status |

    | CON | stdin | "console" (stdin) |

    | PRN | /dev/lp0 | (generic) printer device |

    | LPT1 | /dev/lp0 | first printer device |

    | COMI | /dev/ttyS0 | first serial port |


    Batch files usually contain DOS commands. These must be translated into their
    UNIX equivalents in order to convert a batch file into a shell script.


    # Table H–2. DOS Commands and Their UNIX Equivalents


    | DOS Command | UNIX Equivalent | Effect |

    | ASSIGN | In | link file or directory |

    | ATTRIB | chmod | change file permissions |

    | CD | cd | change directory |

    | CHDIR | cd | change directory |

    | CLS | clear | clear screen |

    | COMP | diff, comm, comp | file compare |

    | COPY | cp | file copy |

