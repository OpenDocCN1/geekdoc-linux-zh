  md: '# Advanced Bash–Scripting Guide


    This is an alternate method of [:alnum] matches alphanumeric or numeric characters.
    This is equivalent to [A-Za0-9].

    * [:alpha] matches alphabetic characters. This is equivalent to [A-Za-z].

    * [:blank] matches a space or tab.

    * [:cntrl] matches control characters.

    * [:digit] matches (decimal). This is equivalent to [0-9].

    * [:graph] (printable characters). Matches characters in the range of ASCII 33
    – 126. This is the same as [:print], below, excluding the space character.

    * [:lower] matches lowercase alphabetic characters. This is equivalent to [a-z].

    * [:print] (printable characters). Matches characters in the range of ASCII 32
    – 126. This is the same as [:graph], above, adding the space character.

    * [:space] matches whitespace characters (space and horizontal tab).

    * [:upper] matches uppercase alphabetic characters. This is equivalent to [A-Z].

    * [:xdigit] matches hexadecimal characters. This is equivalent to [0-9A-Fa-f].


    POSIX character classes generally require or double brackets ([[:).


    ```

    bash$ grep [[[:digit:]]] test.file

    ab=723

    ```


    These character classes may be used with globbing, to a limited extent.


    ```

    bash$ ls -1 [[[:digit:]][[:digit:]]?

    --rw-r--r-- 1 bozo Aug 21 14:47 a33b

    ```


    To see POSIX character classes used in scripts, refer to Example 12–14 and Example
    12–15.


    Sed, awk, and Perl, are used as filters, take REs as arguments when "sifting"
    or transforming files I/O streams. See Example A–10 and Example A–15 for illustrations
    of this.


    "Sed and "Aw", by Douglass and Robbins have a complete and lucid treatment of
    REs (see the Bibliography).


    # 19.2 Globbing


    Bash itself not recognize Regular Expressions. In scripts, commands and utilities,
    such as sed and awk, interpret RE''s.


    Bash carries out file expansion, a process known as "globbing", and expands wildcards.
    Glob interprets the standard wildcard characters, * and ?, list in square brackets,
    and certain other special characters (such as ^ for negating the sense of a match).
    There are some limitations on wildcard in globbing, however strings * will not
    match filenames that start with a dot, for example, .bashrc. [49] Likewise, the
    ? has a different meaning in globbing than as part of a RE.


    19.2. Globbing'
