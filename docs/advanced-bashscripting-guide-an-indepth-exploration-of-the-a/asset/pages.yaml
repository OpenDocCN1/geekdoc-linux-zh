    \ multiplication.sh\n\nmultiply () {\\  # Multiplies params passed.\n  local product=1\n\
    \  until [ -z \"$1\" ]; do  # Until uses up arguments passed.\n    let \"product\
    \ *= $1\"\n    shift\n  done\n  echo \"$product\"  # Will not echo to stdout,\n\
