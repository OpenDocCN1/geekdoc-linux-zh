- pgno: 234
  md: "# Advanced Bash–Scripting Guide\n\nSee Example 12–23 and Example A–13.\n\n\
    Multiple output streams may be redirected to one file.\n\n```\nls -yz >> command.log\
    \ 2>&1\n# Capture result of illegal options 'yz' to 'ls' in file 'command.log'\n\
    # Because stderr redirected to the file, any error messages will also be there.\n\
    ```\n\n# Closing File Descriptors\n\nn<&-\n\nClose input file descriptor n.\n\n\
    0<&-, <&-\n\nClose stdin.\n\nn>&-\n\nClose output file descriptor n.\n\n1>&-,\
    \ >&-\n\nClose stdout.\n\nChild processes inherit open file descriptors. This\
    \ is how pipes work. To prevent an fd from being inherited, close it.\n\n```\n\
    # Redirecting only stderr to a pipe\nexec 3>&1                               #\
    \ Save current \"value\" of stdout.\nls -l 2>&1 >3 3<&- | grep bad 3>&-  # Close\
    \ fd 3 for 'grep' (but not 'ls').\n----                                     \n\
    exec 3>&                               # Now close it for the remainder of the\
    \ script.\n```\n\n# Thanks, S.C.\n\nFor a more detailed introduction to I/O redirection\
    \ Appendix D.\n\n# 16.1. Using exec\n\nThe exec <filename redirects stdin to a\
    \ file. From that point on, all stdin comes from file, rather than its normal\
    \ source (usually keyboard input). This provides a method of reading a file by\
    \ line and possibly passing line of input using sed and/or awk.\n\nExample 16–1.\
    \ Redirecting stdin using exec\n\n```\n#!/bin/bash\n# Redirecting stdin using\
    \ 'exec'\n```\n\n16.1. Using exec"
  merge: -1
