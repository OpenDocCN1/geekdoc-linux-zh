  md: '# Advanced Bash–Scripting Guide


    # Notes


    +   [1]


    These are referred to as builtins, features internal to the shell.


    +   [2]


    Many of the features of ksh88, and even a few from the updated ksh93 have been
    merged into Bash.


    +   [3]


    By convention, user–written shell scripts are Bourne shell compliant generally
    take a name with a . extension. System scripts, such as those found in /etc/rc.d,
    do not follow this guideline.


    +   [4]


    Some flavors of UNIX (the based on 4.2BSD) take a four-byte magic name, requiring
    a blank after the!. #! /bin/sh.


    +   [5]


    The # line in a shell script will be the first command interpreter (sh or bash)
    sees. Since this line begins with a #, it will be correctly interpreted as a comment
    when the command interpreter finally executes the script. The line has already
    served its purpose – calling the command interpreter.


    +   [6]


    This allows some cute tricks.


    ```

    #!/bin/rm

    # Self-deleting script.


    # Nothing much seems to happen when you run this.. except that the file disappears.

    WHATEVER=65

    echo "This line will never print (betcha!)."


    exit $WHATEVER # Doesn''t matter. The script will not exit here.

    ```


    Also, trying to script a README file with a #!/bin/more, and making it executable.
    The result is a self-listing documentation file. (Wait, I missed some text)


    +   [7]


    Portable Operating System Interface, an attempt to standardize UNIX–like OSes.


    +   [8]


    Caution: invoking a Bash script by sh turns off Bash–specific extensions, and
    the script may fail to execute.


    +   [9]


    A script needs read, as well as execute permission for it to run, since the shell
    needs to be able to read it.


    +   [10]


    Why not simply invoke the script with scriptname? If the directory you are in
    ($PWD) is where scriptname is located, why does this work? For security reasons,
    the directory ," is not included in a user’s $PATH. It is therefore necessary
    to explicitly invoke the script in the current directory with a ./scriptname.


    +   [11]


    The shell does the brace expansion. The command itself acts upon the result of
    the expansion.


    +   [12]


    Exception: a code block in braces as part of a pipe may be run as a subshell.


