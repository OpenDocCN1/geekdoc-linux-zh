    is not searchable, then an error message results. Unfortunately, pathchk does
    not return a recognizable error code, and it is therefore much useless in a script.


    dd


    This is the somewhat obscure and feared "data duplicator" mincommand. Originally
    a utility for exchanging data on magnetic tapes between UNIX mincomputers and
    IBM mainframes, the command still has its uses. The dd command copies a file (or
    stdin/stdout), with conversions. Possible conversions are ASCII/EBCDIC, [36] upper/lower
    case, swapping of bytes between input and output, and skipping andor truncating
    the head or tail of the input file. A dd --help lists the conversion and other
    options that this powerful utility takes.


