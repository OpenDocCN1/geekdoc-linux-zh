    yes | fsck /dev/hdal fsck non-interactively (careful!).


    yes | rm -r dirname has same effect as rm -rf dirname (careful!).


    Be very cautious when piping yes to a potentially dangerous system command, such
    as fsck or fdisk.


    banner


    Prints arguments as a large vertical banner to stdout, using an ASCII character
    (default ''#''). This may be redirected to a printer for hardcopy.


    printenv


    Show all the environmental variables for a particular user.


    ```

    bash printenv | grep HOME

    HOME=/home/bozo

    ```


    lp


    The lp and l commands send file(s) to the print queue, to be printed as hard copy.
    [34] These commands trace the origin of their names to the line printers of another
    era.


    bash$ lp file.txt or bash lp <file.txt


    It is often useful to pipe the formatted output from pr to lp.


    bash$ pr -options file.txt | lp


    Formatting packages, as groff and Ghostscript may send their output directly to
    lp.


    bash$ groff -Tascii file.tr | lp


    bash$ gs -options | lp file.ps


    Related commands are lpq, for viewing the print queue, and lprm, for removing
    jobs from the print queue.


    tee


    [UNIX borrows an idea here from the plumbing trade.]


    This is a redirection operator, but with a difference. Like the plumber''s tee,
    it permits "siphon off" the output of a command or commands within a pipe, but
    without affecting the result. This is useful for printing an ongoing process to
    a file or paper, perhaps to keep track of it for debugging purposes.


    ```

    tee

    |------ to file

    ```


