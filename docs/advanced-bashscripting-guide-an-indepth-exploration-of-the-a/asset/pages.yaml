  md: "# Advanced Bash–Scripting Guide\n\nPassing an array involves loading the space-separated\
    \ elements of the array into a variable with command substitution. Getting an\
    \ array as the \"return value\" from a function uses the previously mentioned\
    \ strategy of echoing the array in the function, invoking command substitution\
    \ and the ( ... ) operator to assign it to an array.\n\n# Example 34-8. /bin/bash\
    \ and returning arrays\n\n```\n#!/bin/bash\n# array-function.sh: Passing an array\
    \ to a function and...\n#   \"returning\" an array from a function\n\nPass_Array\
    \ () {\n    local passed_array=() # Local variable.\n    passed_array=$(echo \"\
    $1\")\n    echo \"${passed_array[@]}\"\n    # List all the elements of the new\
    \ array\n    # declared and set within the function.\n}\n```\n\n```\noriginal_array=(element1\
    \ element2 element3 element4 element5)\necho\necho \"original_array = ${original_array[@]}\"\
    \n#   List all elements of original array.\n\n# This is the trick that permits\
    \ passing an array to a function.\n# **************************************************\n\
    argument=$(echo \"${original_array[@]}\")\n# **************************************************\n\
    #   Pack a variable\n# +with all the space-separated elements of the original\
    \ array.\n#   Note that attempting to pass the array itself will not work.\n\n\
    # This is the trick that allows an array as a \"return value\".\n# **************************************************\n\
    returned_array=$(Pass_Array \"$argument\")\n# **************************************************\n\
    #   Assign 'echoed' output of function to array variable.\necho \"returned_array\
    \ = ${returned_array[@]}\"\n\n```\n\n```\n# Try it again,\n# +attempting to access\
    \ (list) the array from outside the function.\nPass_Array \"$argument\"\nThe function\
    \ itself lists the array, but...\n# +accessing the array from outside the function\
    \ is forbidden.\necho \"Passed array (within function) = ${passed_array[@]}\"\n\
    #   NULL VALUE since this is a variable local to the function.\n```\n\necho\n\n\
    # 34.4. Optimizations\n\n*.**"
