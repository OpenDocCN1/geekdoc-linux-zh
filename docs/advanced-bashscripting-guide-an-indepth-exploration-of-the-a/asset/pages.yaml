  md: "# Advanced Bash–Scripting Guide\n\n```\ncase \"$variable\" in\n  \"$condition1\"\
    \n    command...\n    ;;\n  \"$condition2\"\n    command...\n    ;;\n```\n\nesac\n\
    \n![](img/1ce1edffaa36e4f698a85430e71c6d3b_121_0.png)\n\n+   - Quoting the variables\
    \ is not mandatory, since word splitting does not take place.\n- Each test line\
    \ ends with a right paren).\n- Each condition block ends with a double semicolon\
    \ ::;\n- The entire case block terminates with esac (case spelled backwards).\n\
    \n# Example 10–23. Using case\n\n```\n#!/bin/bash\n\necho \"Hit a key, then return.\"\
    \nread Keypress\n\ncase \"$Keypress\" in\n  [a-z]) echo \"Lowercase letter\";\n\
    \  [A-Z]) echo \"Uppercase letter\";\n  [0-9]) echo \"Digit\";\n  *) echo \"Punctuation,\
    \ whitespace, or other\";\n# Allows ranges of characters in [square brackets]\n\
    esac\n\n# Exercise:\n\n# As the script stands, it accepts a single keystroke,\
    \ then terminates.\n# Change the script so it accepts continuous input,\n# reports\
    \ on every keystroke, and terminates only when \"X\" is hit.\n# Hint: enclose\
    \ everything in a \"while\" loop.\nexit 0\n```\n\n# Example 10–24. Creating menus\
    \ using case\n\n```\n#!/bin/bash\n\n# Crude address database\n\nclear # The screen.\n\
    \necho \"Contact List*\"\necho \"      ------ ---\"\necho \"Choose one of the\
    \ following persons:\"\necho\n```\n\n# 10.4. Testing and Branching"
