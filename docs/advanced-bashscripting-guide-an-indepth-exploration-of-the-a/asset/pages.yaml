- pgno: 29
  md: '# # Chapter 5. Introduction to Variables and Parameters


    Variables are at the heart of every programming and scripting language. They appear
    in arithmetic operations and manipulation of quantities, string parsing, and are
    indispensable for working in the abstract with symbols - tokens that represent
    something else. A variable is nothing more than a location or set of locations
    in computer memory holding an item of data.


    # ## 5.1. Variable Substitution


    The name of a variable is a placeholder for its value, the data it holds. Referencing
    its value is called variable substitution.


    $


    Let us carefully distinguish between the name of a variable and its value. If
    **variable** is the name of a variable, then **variable** is a reference to its
    value, the data it contains. The only time a variable appears ''naked'', without
    the prefix, is when declared or assigned, when unset, exported, or in the special
    case of a variable representing a signal (see Example 30-4). Assignment may be
    with an = (var i1=2), in a read statement, and at the head of a loop (for var2
    in 1 2).


    Enclosing a referenced value in double quotes (\


    Note that **$variable** is actually an alternate form of **${variable}**. In contexts
    where the **$variable** syntax causes an error, the longer form may work (see
    Section 9.3, below).


    Example 5–1. Variable assignment and substitution


    ```

    ```bash

    #!/bin/bash


    # Variables: assignment and substitution


    a=375

    hello=$a


    #n# No space permitted on either side of = sign when initializing variables.


    # If "VARIABLE =value",

    # script tries to run "VARIABLE" command with one argument, "="value"

    # If "VARIABLE= value"

    # script tries to run "value" with

    #+ the environmental variable "VARIABLE" set to ""

    #

    ```

    ```


    Chapter 5. Introduction to Variables and Parameters


