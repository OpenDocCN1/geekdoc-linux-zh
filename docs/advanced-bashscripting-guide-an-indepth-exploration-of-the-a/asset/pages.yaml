  md: '# Advanced Bash–Scripting Guide


    Print Working Directory. This gives the user’s (or script’s) current directory
    (see Example 11–5). The effect is ideal to reading the value of the variable SPWD.


    pushd, popd, dirs


    This command set is a mechanism for bookmarking directories, a means of moving
    back and through directories in an orderly manner. A pushdown stack is used to
    keep track of directory names. Options allow various manipulations of the directory
    stack.


    pushd dir-name pushes the path dir-name onto the directory stack and simultaneously
    changes the current working directory to dir-name


    popd removes (pops) the top directory path off the directory stack and simultaneously
    changes the current working directory to that directory popped from the stack.


    dirs lists the contents of the directory stack (compare with the $DIRSTACK variable).
    A successful pushd or popd will automatically invoke dirs.


    Scripts that require changes to the current working directory without hard-coding
    the directory name changes can make good use of these commands. Note that the
    implicit $DIRSTACK array, accessible within a script, holds the contents of the
    directory stack.


    # Example 11–5. Changing the current working directory


    ```

    #!/bin/bash


    dir1=/usr/local

    dir2=/var/spool


    pushd $1

    # Will do an automatic ''dirs'' (list directory stack to stdout)

    echo "Now in directory `pwd`." # Uses back-quoted ''pwd''.


    # Now, do some stuff in directory `dir1`

    pushd $dir2

    echo "Now in directory `pwd`."


    # Now, do some stuff in directory `dir2`

    echo "The top entry in the DIRSTACK array is $DIRSTACK."

    popd

    echo "Now back in directory `pwd`."


    # Now, do some more stuff in directory `dir1`

    popd

    echo "Now back in original working directory `pwd`."


    exit 0

    ```


