    # sum, cksum, md5sum


    These are utilities for generating checksums. A cksum is a number mathematically
    calculated from the contents of a file, for the purpose of checking its integrity.
    A script might refer to a list of checksums for security purposes, such as checking
    the contents of key system files have not been altered or corrupted. The md5 command
    is the most appropriate of these security applications.


    Note that cksum also shows the size, in bytes, of the target file.


    ```

    bash cksum /boot/mlinuz

    1670054224 804083 /boot/mlinuz


    bash md5sum /boot/mlinuz

    0f43eceea8f09e0a2b5c1cdf333ba /boot/mlinuz

    ```


