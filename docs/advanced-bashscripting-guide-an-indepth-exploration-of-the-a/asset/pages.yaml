- pgno: 300
  md: "# Chapter 30. Debugging\n\nThe Bash shell contains no debugger, nor even any\
    \ debugging-specific commands or constructs. Syntax errors or outright typos in\
    \ the script generate cryptic error messages that are often of no help in debugging\
    \ a non-functional script.\n\n# Example 30–1. A buggy script\n\n```\n#!/bin/bash\n\
    # ex74.sh\n\n# This is a buggy script.\n\na=37\n\nif [$a -gt 27 ]\nthen\n  echo\
    \ $a\nfi\n\nexit 0\n```\n\nOutput from script:\n\n```\n./ex74.sh: [37]: command\
    \ not found\n```\n\nWhat's wrong with the above script (hint: the **if**)?\n\n\
    What if the script executes, but does not work as expected? *This is all the too\
    \ familiar logic error.*\n\n# Example 30–2. test24, another buggy script\n\n```\n\
    #!/bin/bash\n# This is supposed to delete all filenames in current directory\n\
    # containing embedded spaces.\n# It doesn't work. Why not?\n\nbadname=$(ls | grep\
    \ ' 'n\n# echo \"$badname\"\nrm \"$badname\"\n\nexit 0\n```\n\nTry to find out\
    \ what's wrong with Example 30–2 by uncommenting the **echo \"$badname\"** line.\
    \ Echo statements are useful for seeing whether you expect is actually what you\
    \ get.\n\nIn this particular case, **rm \"$badname\"** will not give the desired\
    \ results because $badname should not be quoted. Ploting it in quotes ensures\
    \ that **rm** has only one argument (it will match only one filename). A"
