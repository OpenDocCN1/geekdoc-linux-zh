  md: "# Chapter 11. Internal Commands and Builtins\n\nA builtin is a **command**\
    \ contained within the Bash tool, literally built in. A builtin may be a synonym\
    \ to a system command of the same name, but Bash reimplements it internally. [23]\
    \ For example, the Bash **echo** command is not the same as `/bin/echo`, although\
    \ its behavior is almost identical.\n\nA *keyword* is a reserved word, token or\
    \ operator. Keywords have a special meaning to the shell, and indeed are the building\
    \ blocks of the shell's syntax. As examples, \"for\", \"while\", and \"!\" are\
    \ keywords. Similar to a builtin, a keyword is hard-coded into Bash, but unlike\
    \ a builtin, a keyword is not by itself a command. [24]\n\n# I/O\n\necho\n\nprints\
    \ (to `stdout`) an expression or variable (see Example 5–1).\n\n```\necho Hello\n\
    echo $$\n```\n\nAn **echo** requires the `-e` option to print escaped characters.\
    \ See Example 6–2.\n\nNormally, each **echo** command prints a terminal newline,\
    \ but the `-n` option suppresses it.\n\nAn **echo** can be used to feed a sequence\
    \ of commands down a pipe.\n\n```\nif echo \"$VAR\" | grep -q txt; # if [[ $VAR\
    \ == *txt* ]]\nthen\n    echo \"$VAR\" contains the substring sequence \"\\txt\\\
    t\"\nfi\n```\n\nAn **echo**, in combination with [command substitution] can set\
    \ a variable.\n\n```\na=``echo \"HELLO\" | tr A-Z a-z`\n```\n\nSee Example 12–15,\
    \ Example 12–2, Example 12–30, and Example 12–31.\n\nBe aware that `echo command`\
    \ deletes any newlines that the output of `echo` generates.\n\nThe **IFS** (internal\
    \ field separator) normally contains `\n` (newline) as one of its whitespace characters.\
    \ Bash splits the input into arguments by linefeeds. Then `echo` outputs these\
    \ arguments, separated by spaces.\n\n```\nbash ls -l /usr/share/apps/kjerz/sounds\n\
    -rw-r-- 1 root root 1407 Nov 7 2000 reflect.au\n-rw-r-- 1 root root 362 Nov 7\
    \ 2000 seconds.au\n```\n\nChapter 11. Internal Commands and Builtins"
