  md: '# Advanced Bash–Scripting Guide


    The sz and rz command set serves to transfer files to from a remote using the
    zmodem protocol. Zmodem has certain advantages over xmodem, as such greater transmission
    rate and resumption of interrupted transfers. Like sx and rx, these are generally
    part of a communications package.


    # ftp


    Utility and protocol for uploading / downloading files to / from a remote host.
    An ftp session can be automated in a script (see Example 17–7, Example A–4, and
    Example A–11).


    # cu


    Call Up a remote system and connect as a simple terminal. This is a sort of dumb–down
    version of telnet.


    # uucp


    UNIX to UNIX copy. This is a communications package for transferring files between
    UNIX servers. A shell script is an effective way to handle a uuccp command sequence.


    Since the advent of the Internet and e–mail, uuccp seems to have faded into obscurity,
    but it still exists and remains perfectly workable in situations where an Internet
    connection is not available or appropriate.


    # telnet


    Utility and protocol for connecting to a remote host.


    ![](img/1ce1edffaa36e4f698a85430e71c6d3b_189_0.png)


    The telnet protocol contains security holes and should therefore probably be avoided.


    # rlogin


    Remote login, initiates a session on a remote host. This command has security
    issues, so use ssh instead.


    # rsh


    Remote shell, executes command(s) on a remote host. This has security issues,
    so use ssh instead.


    # rcp


    Remote copy, copies files between two different networked machines. Using rcp
    and similar utilities with security implications in a shell script may not be
    advisable. Consider, instead, using ssh or an expect script.


