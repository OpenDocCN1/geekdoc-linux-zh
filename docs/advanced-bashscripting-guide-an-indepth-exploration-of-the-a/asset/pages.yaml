  md: '# Advanced Bash–Scripting Guide


    touch


    Utility for updating access/modification times of a file to current system time
    or other specified time, but also useful for creating a new file. The command
    `touch zzz` will create a new file of zero length, named zzz, as zzz did not previously
    exist. Time-stamping empty files in a way is useful for storing data information,
    for keeping track of modification times on a project.


    The touch command is equivalent to : `>> new` (for ordinary files).


    at


    The at job control executes a set of commands at a specified time. Superficially,
    it resembles crond, however, at is chiefly useful for one-time execution of a
    command set.


    **at 2pm January 15** for a set of commands to execute at that time. These commands
    should be shell-compatible, for all practical purposes, the user is typing in
    an executable script one line at time. Input terminates with a `Ctrl-D`.


    Using either the -f option or redirection (<), at reads a command list from a
    file. This file is an executable script, though it is, of course, noninteractive.
    Particularly clever is including the `run-parts` command in the file to execute
    a different set of scripts.


    ```

    bash$ at 2:30 am Friday < at-jobs.list

    job 2 at 2000-10-27 02:30

    ```


    batch


    The **batch** job control command is similar to at, but it runs a command list
    when the system load drops below 8. Like at, it can read commands from a file
    with the -f option.


    cal


    Prints a neatly formatted monthly calendar to `stdout`. Will do current year or
    a large range of past and future years.


    sleep


    This is the shell equivalent of a wait loop. It pauses for a specified number
    of seconds, doing nothing. This can be useful for timing or in processes running
    in the background, checking for a specific event every often (see Example 30–5).


    ```

    sleep 3

    # Pauses 3 seconds.

    ```


    ![](img/1ce1edffaa36e4f698a85430e71c6d3b_157_0.png)


    The **sleep** command defaults to seconds, but minute, hours, or days may also
    be specified.


    ```

    sleep 3 h

    # Pauses 3 hours!

    ```


