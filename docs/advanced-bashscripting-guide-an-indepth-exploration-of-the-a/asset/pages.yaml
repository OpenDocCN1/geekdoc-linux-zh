    \nif cd \"$dir\" 2>/dev/null; then \"2>/dev/null\" hides error message.\n    echo\
    \ \"Now in $dir.\"\nelse\n    echo \"Can't change to $dir.\"\nfi\n```\n\nThe \"\
    if COMMAND\" construct returns the exit status of COMMAND.\n\nSimilarly, a condition\
    \ within test brackets may stand alone without an if, when used in combination\
    \ with a list construct.\n\n```\nvar=20\nvar=22\n[ \"$var\" -ne \"$var\" ] &&\
    \ echo \"$var is not equal to $var\"\n\nhome=/home/bozo\n[ -d \"$home\" ] || echo\
    \ \"$home directory does not exist.\"\n```\n\nThe (( )) expands and evaluates\
    \ an arithmetic expression. If the expression evaluates as zero, it returns an\
    \ exit status of 1, or \"false\". A non-zero expression returns an exit status\
    \ of 0, or \"true\". This is in marked contrast to the test and [ ] constructs\
    \ previously discussed.\n\nExample 7–3. Arithmetic Tests using (( ))\n\n```\n\
    #!/bin/bash\n# Arithmetic tests.\n\n# (( )) construct evaluates and tests numerical\
    \ expressions.\n# Exit status opposite from [ ... ] construct!\n\n(( 0 ))necho\
    \ \"Exit status of \\(( 0 ))\\\" is $?    # 1\n\n(( 1 ))necho \"Exit status of\
