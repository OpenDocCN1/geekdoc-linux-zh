    If a directory has the sgid flag set, then a file created within directory belongs
    to the group that owns it, not necessarily to the group of the user who created
    the file. This may be useful for a directory shared by a workgroup.


    -u


    set-user-id (suid) flag set on file


    A binary by root with set-user-id flag runs with root privileges, even when an
    ordinary user invokes it. [15] This is useful for executables (such as pppd and
    cdrecord) that need to access system hardware. Lacking the suid flag, these binaries
    could not be invoked by a non–root user.


    ```

    -rwsrxr-t 1 root 178236 Oct 2 2000 /usr/sbin/pppd

    ```


    A file with the suid flag shows an s in its permissions.


    -k


    ```

    sticky bit set

    ```


    Commonly known as the “sticky bit", the save–text–mode flag is a special type
    of file permission. If a file has this flag set, that file will be kept in cache
    memory, for quicker access. [116] If set on a directory, it restricts write permission.
    Setting the sticky bit adds t to the permissions on the file or directory listing.


    ```

    drwxrwxr-wt 7 root 1024 May 19 21:26 tmp/

    ```


    If a user does not own a directory that has the sticky bit set, but has write
    permission in that directory, he can only delete files in that he owns. This keeps
    users from inadvertently overwriting or deleting each other’s files in a publicly
    accessible directory, as /tmp.


