    # Playfair Cipher


    Implement the Playfair (Wheatstone) Cipher in a script.


    The Playfair Cipher encrypts text by substitution of 2-letter "digram" (grouping).
    Traditionally, one uses a 5 x 5 scrambled alphabet code key square for the encryption
    and decryption.


    ```

    CODES S

    A B F G H

    I K L M N

    P Q R T U

    V W X Y Z

    ```


    Each letter of the alphabet appears once, except "I" also represents "J". The
    arbitrarily chosen key word, "CODES" comes first, then all the rest of the alphabet,
    skipping letters already used.


    To encrypt, separate the plaintext message into digraphs (2-letter groups). If
    a group has two identical letters, delete the second, and form a new group. If
    there is a single letter left over at the end, insert a "null" character, typically
    "X".


    ```

    THIS IS A TOP SECRET MESSAGE

    TH IS AS AT OF SE CR ET ME SA GE

    ```


    --------------------------------------------------------------------------------


    +   1) Both letters will be on the same row of the key square

    For each letter, substitute the one immediately to the right, in that row.

    If necessary, wrap around left to the beginning of the row.

    2) Both letters will be in the same column of the key square

    For each letter, substitute the one immediately below it, in that row.

    If necessary, wrap around to the top of the column.

    3) Both letters will form the corners of a rectangle within the key square.

    For each letter, substitute the one on the other corner of the rectangle which
    lies on the same row.


    or


    --------------------------------------------------------------------------------


    ```

    The "TH" digram falls under case #3.

    GH

    MN

    T

    (Rectangle with "T" and "H" at corners)

    ```


    ```

    T -> U

    ```


