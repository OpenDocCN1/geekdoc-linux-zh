    ```

    cat filename file.1 file.2 file.3 > file.123

    The -n option to cat inserts consecutive numbers before all lines of the target
    file(s). The -b option numbers only the non-blank lines. The -v option echoes
    nonprintable characters, with ^ notation.

    The -s option squeezes multiple consecutive lines into a single blank line.

    ```


    See also Example 12–21 and Example 12–17.


    tac, is the inverse of cat, listing a file backwards from its end.


    reverses each line of a file, and outputs to stdout. This is not the same effect
    as tac, as it preserves the order of the lines, but flips each around.


    ```

    bash$ cat file1.txt

    This is line 1.

    This is line 2.


    bash$ tac file1.txt

    This is line 2.

    This is line 1.


    bash$ rev file1.txt

    .1 enil sihT

    .2 enil sihT

    ```


