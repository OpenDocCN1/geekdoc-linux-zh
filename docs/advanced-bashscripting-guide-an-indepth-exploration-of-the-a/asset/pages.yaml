  md: "# Advanced Bash–Scripting Guide\n\nThis construct tests for a condition at\
    \ the top of a loop, and keeps looping as long as condition is false (opposite\
    \ of while loop).\n\n```\nuntil [condition-is-true]\ndo\n  command...\ndone\n\
    ```\n\nNote that an until loop tests for the terminating condition at the top\
    \ of the loop, differing from a similar construct in some programming languages.\n\
    \nAs is the case with for in loops, placing the do on the same line as the condition\
    \ test requires a semicolon.\n\n```\nuntil [condition-is-true] ; do\n```\n\n#\
    \ Example 10–18. until loop\n\n```\n#!/bin/bash\nuntil [ \"$var\" = end ] # Tests\
    \ condition here, at top of loop.\ndo\n  echo \"Input variable $1\"\n  echo \"\
    (end to exit)\"\n  read var\n  echo \"variable #1 = $var\"\ndone\n\nexit 0\n```\n\
    \n# 10.2. Nested Loops\n\nA nested loop is a loop within a loop, an inner loop\
    \ within the body of an outer loop. What happens is that the first pass of the\
    \ outer loop triggers the inner loop, which executes to completion. The second\
    \ pass of the outer loop triggers the inner loop again. This repeats until the\
    \ outer loop finishes. Of course, a break within the inner or outer loop may interrupt\
    \ this process.\n\n# Example 10–19. Nested Loop\n\n```\n#!/bin/bash\n# Nested\
    \ \"for\" loops.\n\nouter=1      # Set outer loop counter.\n\n# Beginning of outer\
    \ loop.\nfor a in 1 2 3 4 5\ndo\n  echo \"Pass $outer in outer loop.\"\n  echo\
    \ \"----------------------\"\n  inner=1      # Reset inner loop counter.\n```\n\
    \n# 10.2. Nested Loops"
  merge: -1
  img_proc: true
- pgno: 118
  md: "# Advanced Bash–Scripting Guide\n\n```\n# Beginning of inner loop.\nfor b in\
    \ 1 2 3 4 5\ndo\necho \"Pass $inner in inner loop.\"\n  let inner+=1 # Increment\
    \ inner loop counter.\ndone\n# End of inner loop.\n\nlet outer+=1 # Increment\
    \ outer loop counter.\necho\n  # Space between output in pass of outer loop.\n\
    done\n# End of outer loop.\n\nexit 0\n```\n\nSee [Example 26–4](#) for an illustration\
    \ of nested \"while\" loops, and [Example 26–5](#) to see a \"while\" loop nested\
    \ inside an \"until\" loop.\n\n# 10.3. Loop Control\n\nCommands Affecting Loop\
    \ Behavior\n\nbreak, continue\n\nThe **break** and **continue** loop control commands\
    \ [22] correspond exactly to their counterparts in other programming languages.\
    \ The **break** terminates the loop (breaks out of it), while **continue** causes\
    \ a jump to the next iteration of the loop, skipping all the remaining commands\
    \ in that particular loop cycle.\n\nExample 10–20. Effects of break and continue\
    \ in a loop\n\n```\n#!/bin/bash\nLIMIT=19 # Upper Limit\necho\necho \"Printing\
    \ Numbers 1 through 20 (but not 3 and 11).\"\n\na=0\nwhile [ \\$$a -le \"$LIMIT\"\
    \ ]\ndo\n  a=$((a+1))\n\n  if [ \"$a\" -eq 3 ] || [ \"$a\" -eq 11 ] # Excludes\
    \ 3 and 11\nthen\n    continue # Skip rest of this particular loop iteration.\n\
    \  fi\n\n  echo -n \"$a \"\ndone\n\n# Exercise:\n# Why does loop print up to 20?\n\
    ```\n\n* 10.3. Loop Control\n\n113"
  merge: -1
  img_proc: true
- pgno: 119
  md: "# Advanced Bash–Scripting Guide\n\n```\necho; echo\necho Printing Numbers 1\
    \ through 20, but something happens after 2.\n######################################################################\n\
    # Same loop, but substituting 'break' for 'continue'\na=0\nwhile [ \"$a\" -le\
    \ \"$LIMIT\" ]\ndo\n  a=$((a+1))\n  if [ \"$a\" -gt 2 ];\n  then\n    break #\
    \ Skip entire rest of loop.\n  fi\n  echo -n \"$a \"\ndone\necho; echo; echo\n\
    exit 0\n```\n\nThe break command may optionally take a parameter. A plain break\
    \ terminates only the innermost loop in which it is embedded, but a break N breaks\
    \ out of N levels of loop.\n\n# Example 10–21. Breaking out of multiple loop levels\n\
    \n```\n#!/bin/bash\n# break-levels.sh: Breaking out of loops.\n\n# \"break N\"\
    \ breaks out of N level loops.\nfor outerloop in 1 2 3 4 5\ndo\n  echo -n \"Group\
    \ $outerloop: \"\n  for innerloop in 1 2 3 4 5\n  do\n    echo -n \"$innerloop\"\
    \n    if [ \"$innerloop\" -eq 3 ];\n    then\n      break # Try break 2 to see\
    \ what happens.\n      # (\"Breaks\" out of both inner and outer loops).\n   \
    \ fi\n  done\n  echo\ndone\necho\nexit 0\n```\n\n10.3. Loop Control"
  merge: -1
