- pgno: 241
  md: "# Chapter 17. Here Documents\n\nA here document uses a special form of I/O\
    \ redirection to feed a command script to an interactive program, such as | telnet\
    \ or ex. Typically, the script consists of a command list to the program, delineated\
    \ by a limit string. The special symbol << precedes the limit string. This has\
    \ the effect of redirecting the output of a file into the program, similar to\
    \ interactive-program < command-file, where command-file contains\n\n```\ncommand\
    \ #1\ncommand #2\n...\n```\n\nThe \"here document\" alternative looks like this:\n\
    \n```\n#!/bin/bash\ninteractive-program <<LimitString\ncommand #1\ncommand #2\n\
    ...\nLimitString\n```\n\nChoose a limit sufficiently unusual that it will not\
    \ occur anywhere in the command list and confuse matters.\n\nNote that here documents\
    \ may sometimes be used to good effect with non-interactive utilities and commands.\n\
    \n# Example 17–1. dummyfile: Creates a 2-line dummy file\n\n```\n#!/bin/bash\n\
    \n# Non-interactive use of 'vi' to edit a file.\n# Emulates 'sed'.\n\nE_BADARGS=65\n\
    \nif [ -z \"$1\" ]\nthen\n  echo \"Usage: basename $0 filename\"\n  exit $E_BADARGS\n\
    fi\n\nTARGETFILE=$1\n\n# Insert 2 lines in file, then save.\n#------Begin here\
    \ document------\nvi $TARGETFILE <<x23LimitStringx23\ni\nThis is line 1 of the\
    \ example file.\nThis is line 2 of the example file.\n'\\nZZ\nx23limitStringx23\n\
    #------End here document------\n```"
  merge: -1
  img_proc: true
