    # Tuning disk performance for

    z/VM Linux guests


    This chapter describes Direct Access Storage Device (DASD) and SCSI disk tuning
    for z/VM Linux guests. Topics include:


    +   - Disk and access options

    - Disk setup in z/VM and Linux on System z

    - Factors that influence disk I/O

    - Maximizing the operation of disks'
  merge: -1
