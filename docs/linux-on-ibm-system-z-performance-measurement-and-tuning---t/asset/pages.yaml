  md: '# Multipathing - failover mode versus multibus mode with SCSI disks


    Multipath I/O is a method to connect a computer system and the mass storage device
    using more than one path through buses, switches, controllers, and other connection
    devices. Multipathing increases system stability and resilience. There are two
    options with multipathing available:


    +   - Multibus is a load-sharing option. Be aware that multibus is not implementing
    load sharing, as known from System z FICON channel path groups.


    +   - Failover is a high-availability option.


    The failover mode shows better performance, lowers lower CPU costs, and ensures
    better throughput than multibus.


    More information about how to use multipathing and measurement results can be
    found here:

    http://www.ibm.com/developerworks/linux/linux390/perf/tuning_how_dasd_multipathing.html


    # 10.4.8 Parallel Access Value (PAV)


    The concurrent operation capabilities of the IBM TotalStore® Enterprise Disk Storage
    Systems and IBM TotalStorage Enterprise Storage Server allow the system to access
    volumes in parallel, which means that it can concurrently transfer data to or
    from the same volume from the system or system image. A volume that can be accessed
    parallel is called Parallel Access Value.


    When using PAV, the application or system can support simultaneous access to the
    logical volume by multiple users or processes. Read operations can be accessed
    simultaneously, but write operation can be accessed parallel only to different
    domains. Writes to the same domain must be serialized in order to maintain data
    integrity. The domain of an I/O operation is specified to ext to which the I/O
    operation applies.


    With PPR VM63952, zVM 5.2 supports PAV as minisks for guest operating systems
    such as Linux and zOS, which can exploit the PAV architecture. To use the PAV
    feature to z/VM 5.2, the devices must be dedicated to the guests.


    IBM DASD PAV volumes must be defined to z/VM as DASDs with 3390 Model 2, 3, or
    9 on a Storage Controller of 3390 Model 3 or 6, 2105, 2107, or 1750. It also supports
    3380 track-compatibility mode for the 3390 Model 2 or 3 DASD.'
  merge: -1
