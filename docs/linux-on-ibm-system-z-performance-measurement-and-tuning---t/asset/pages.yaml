    # ## 7.6 Swapping to DCSS


    We found improved support for DCSS in recent distributions. From Novel SUSE SLES9
    SP2 and Red Hat RHEL4 Update4 it is possible to define swap space in DCSS. There
    are some advantages to using a DCSS for swapping:


    +   - This option offers fast write into z/VM''s storage and swap caching when
    the Linux guest memory constrained by zVM is not.

    - It allows you shrink guest virtual memory while maintaining acceptable performance
    for peak workloads.

    - This solution requires no channel programs like VDISK access. Data transfers
    done by z/VM memory management only.

    - Low SIE break-rate is seen.


    Swapping to DCSS is the fastest known method. As with VDISK, the solution requires
    memory. But lack of memory is the reason for swapping. So it could be used preferably
    as a small fast swap device in peak situations. The DCSS swap device should be
    the first in a cascade of swap devices, where the following could be bigger and
    slower (real disk). The swapping to DCSS adds complexity. We did not measure the
    swapping to DCSS.


