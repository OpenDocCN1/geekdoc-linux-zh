    # 8.1.6 Shared versus dedicated processors


    When there are multiple processors on a system to be utilized by many different
    logical partitions, there is the option of dedicating processors to an LPAR. In
    general, this is only used for two reasons:


    +   - For benchmarks, to reduce questionable impacts from other workloads. When
    running benchmarks, the aim should be to factor out interference from other work
    that is running in the same time frame as completely as possible. Dedicating processors
