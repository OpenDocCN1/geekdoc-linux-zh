  md: 'The Breeder uses less CPU cycles because it avoids the cost of decompressing
    the RPM packages. The differences between the other methods are less obvious.
    For the installs that use an FTP server, the cost of the FTP server are roughly
    the same. The main difference between the first two methods must be attributed
    to the more efficient LCS driver in VM TCP/IP. The GUI method of installation
    uses a lot more CPU cycles because of the X-Windows applications and the additional
    network traffic (the portion for TCP/IP is slightly larger).


    If the installation was on a more CPU-constrained system, the larger demand for
    CPU cycles would have immediately translated into longer elapsed time as well.


    # DASD I/O comparison


    Another cost item to look at DASD I/O. Because the QuickStart method copies the
    RPM packages from disk instead of receiving them through the network, we expect
    a larger DASD I/O rate (but far less than double because RPM packages are compressed).
    This is confirmed by the graph in Figure 9-4.


    ![](img/a8398552a9cf58d3f3798c1dedb947c2_156_0.png)


    Figure 9-4 DASD I/O to install a system


    It is not clear whether the difference between the two FTP methods is significant,
    but it is not unlikely that a Linux program will do more I/O for the same work
    when it takes longer to complete.


    The increased amount of DASD I/O for the Breeder installation is significant.
    The Breeder uses an uncompressed copy of the file system to install on the target
    disks (saves a lot of CPU time). The drawback of that approach is that we do more
    I/O while saving CPU cycles. This is a very obvious effect of the trade-off you
    make when tuning a system. When you need to install a lot of systems in a short
    time, the z/VM disk cache you a lot of good. It would be attractive to make the
    Breeder virtual machine big enough to hold the entire image of the target disk
    in buffer.


    > Note: Because the Breeder first copies the target disk and then applies the
    personalization, it is possible to build a stock of copied target disks. The only
    thing left would be personalization after the host name and IP address are known.
    The stock could be replenished during the night or some other time when sufficient
