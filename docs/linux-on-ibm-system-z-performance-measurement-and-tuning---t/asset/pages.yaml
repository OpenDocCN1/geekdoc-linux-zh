    **Definition:** Figure 8-3 shows VM definition blocks on the dispatch and eligible
    lists. VM definition blocks represent virtual processors allocated to a virtual
    machine. By default, every virtual machine has at least one definition block (the
    base). Definition blocks are discussed in 8.3.4, "Scheduling virtual processors"
    on page 113.'
