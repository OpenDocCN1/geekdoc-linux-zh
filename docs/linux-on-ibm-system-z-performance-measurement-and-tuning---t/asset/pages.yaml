- img_proc: true
  md: "Plan swapping in advance. If swapping is to be expected as an exception, the\
    \ swap devices should be of high performance (that is, if running z/VM to finish\
    \ VDISK as the swap device with the highest priority). VDISK remains in main memory.\
    \ If main memory is a constrained resource in the environment, we do not recommend\
    \ the use of VDISK. Swapping on a regular base is observed at higher overcommit\
    \ rates, as often seen in low-utilized, consolidated environments.\n\n+   * Size\
    \ the Linux machine size is a trade-off between reducing the amount of Linux swapping.\n\
    * The optimal virtual machine size is a trade-off between reducing overall z/VM\
    \ memory usage and swapping in a Linux guest. As discussed in 2.2,\"Sizing considerations\
    \ for z/VM guests\" on page 11, reduce the virtual machine size of the Linux guest\
    \ to the point where swapping begins under normal load, and add an additional\
    \ amount to minimize swapping.\n* The amount of swap space allocate depends on\
    \ the memory requirements of your Linux guest.\n* The suggestion that swap space\
    \ be twice the memory size of a Linux machine should not apply to a z/VM guest.\
    \ If a Linux guest uses much swap space, it probably indicates that a larger virtual\
    \ machine size should be allocated to the guest.\n* Do not enable MDC on Linux\
    \ minisdisks.\nThe read ratio is not high enough to cover the overhead.\n* Swapping\
    \ to VDISK with the DIAGNOS access method is faster than swapping to DASD or SCSI\
    \ disk.\n In addition, when using a VDISK swap, your z/VM performance management\
    \ product can report swapping by a Linux guest.\n* Consider multiple swap devices\
    \ rather than a single, large VDISK swap. Using multiple swap devices with different\
    \ priorities can alleviate stress on the VM paging system when compared to a single,\
    \ large VDISK. As discussed in 7.4.1,\"Swapping with FBA discipline to VDISK\"\
    \ on page 87, a VDISK combined with a DASD swap device can provide a small, fast\
    \ swap (the VDISK) with spilower to a larger, slower DASD swap device.\n* Prefer\
    \ swap devices over swap files.\nLinux on System z is able to swap files instead\
    \ of partitions or swap disks. The swap introduces extra effort to handle the\
    \ file system.\n\n# 7.8.1 Cascaded swap devices\n\nThere is a good case for using\
    \ multiple swap devices with different priorities. Multiple swap devices with\
    \ different priority are available, Linux attempts to fill one with the highest\
    \ priority before using the next device. The algorithms for allocating space on\
    \ swap devices in Linux cache the active area to sweep over the device, which\
    \ reduces seeks on the device and increases the ability of Linux to build long\
    \ I/O chains.\n\nThis means that over the entire swap device has been referenced.\
    \ In the case of VDISK, this means that CP has to memory for the entire VDISK,\
    \ even though the Linux machine might only need a small portion of the VDISK at\
    \ any time. If memory contention is high enough, the contents of the VDISK are\
    \ gutted by CP and can be brought back when Linux next references that part of\
    \ the VDISK.\n\nIf we give the Linux virtual machine two smaller VDISKS instead\
    \ of one big VDISK and use them as swap devices with different priorities, the\
    \ footprint is effectively reduced by 50%."
