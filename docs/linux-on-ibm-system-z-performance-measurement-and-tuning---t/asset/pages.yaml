  md: '# WebSphere Studio Workload Simulator overview


    The WebSphere Studio Workload Simulator for z/OS and OS/390 is an application
    that allows you to create multiple virtual or simulated users in order to test
    load and performance.


    The Workload Simulator consists of two components: a controller and an engine.
    For high scalability, Workload Simulator''s Engine, which generates the load used
    during load-testing, is installed on a System z server. The load generated by
    the engine can be used to test any Web-serving environment (that is, the environment
    to be tested is not limited to z/OS). In our case, we tested at a WebSphere Application
    Server that was running on a Linux on System z guest. Workload Simulator supports
    multiple engines.


