    |RMHTUX01|.01|.01|.00|23K|24K||0|100|128M VUX,DISC,DSP |


    Even saving CPU resources is very welcome, the significant benefit of the changed
    timer behavior is that zVM dispatcher is able to recognize that the virtual machine
    is idle. When a virtual machine has a transaction that has ended and for more
    than 300 ms, the z/VM scheduler moves it into a long-term wait. It is not possible
    to reduce this value to a shorter idle time with standard v/VM configurations.
    When the 300 ms test idle is over, z/VM starts to page out of the working of the
    idle virtual machine when main memory is constrained. When the virtual machine
    becomes busy again (even if only a second or less), the page fault handling in
    necessary portions of the virtual machine''s memory. This reduces the footprint
    of the idle Linux virtual.


    > Note: With the on demand timer, an idle Linux virtual machine is reported as
    active by VM it wakes up frequently. Because when using the idle and active in
    this context. The idle Linux machine behaves much more like an interactive CMS
    user.


    When a guest with the demand timer uses a lot of CPU time when idle, that is normally
    caused by some process or kernel thread requesting wake-up calls. In some cases,
    these frequent wake-up calls are part of the application design or are caused
    by running daemons on the Linux system.


