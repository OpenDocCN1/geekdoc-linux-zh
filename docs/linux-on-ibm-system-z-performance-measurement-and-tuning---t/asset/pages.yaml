- img_proc: true
  md: '# 8.4 CP scheduler controls


    The CP scheduler can be influenced by two general types of controls:


    +   - SRM controls globally influence the overall processor resources.

    - Local controls influence how an individual virtual machine is regarded by the
    scheduler.


    # 8.4.1 Global System Resource Manager (SRM) controls


    Overall z/VM processor resources can be tuned using the CP SET SRM command.


    # The DSPBUF control


    The CP SET SRM DSPBUF command controls the number of users in the dispatch list.
    It permits you to overcommit or under-commit processor and I/O device resources.
    The command format is:


    ```

    SET SRM DSPBUF | i j k

    ```


    Where:


    +   - i Specifies the number of dispatch list slots available for E1, E2, and
    E3

    - j Specifies the number of dispatch list slots available for E2 and E3

    - k Specifies the number of dispatch list slots available for E3 users


    > Valid operand ranges are 32767 ≥ i ≥ j ≥ k ≥ 1.


    For example:


    ```

    SET DSPBUF 35 30 18

    ```


    This command allocates 35 slots on the dispatch list:


    +   - Five are guaranteed to E1 users (35–30).

    - Thirty are available to E2 and E3 users, 12 of (30–18) are guaranteed not to
    be occupied by E3 users.

    - Eighteen are available to E3 users (although these may be occupied by E1 and
    E2 users).


    > Important: Using DSPBUF to control dispatch lists is a very risky process. We
    do not recommend making adjustments to this control. It is better to use CP algorithms
    for dynamic control, dependent on the changing system conditions.


    # The LDUBUF control


    The CP SET SRM LDUBUF command partitions the commitment of the system’s resources.


    Definition: LDUBAF stands for loading user buffer. A loading user is a heavy user
    of paging resources and is expected to have a high paging rate. A loading user
    is defined as a user that takes five page faults within one time slice of work.
    relatively small, any user that takes five page faults within that time is totally
    consuming the equivalent of one paging device. Use the INDICATE QUEUES EXP command
    to display the current loading users.'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'The command format is:


    ```

    SET SRM LDUBUF i j k

    ```


    Where:


    +   * **i** Specifies the percentage of system paging resources available to E1,
    E2, and E3 users


    +   * **j** Specifies the percentage of system paging resources available to E2
    and E3 users


    +   * **k** Specifies the percentage of system paging resources available to E3
    users


    # The STORBUF control


    The CP SET SRM STORBUF command partitions the commitment of real storage in terms
    of pages based on the transaction class (E1, E2, E3) of a user. This command enables
    you to overcommit or under-commit real storage.


    The command format is:


    ```

    SET SRM STORBUF i j k

    ```


    Where:


    +   * **i** Specifies the maximum percentage of system storage available to E1,
    E2, and E3 users


    +   * **j** Specifies the maximum percentage of system storage available to E2
    and E3 users


    +   * **k** Specifies the maximum percentage of system storage available to E3
    users


    > Note: Valid ranges are 999 ≥ i ≥ j ≥ k ≥ 0. The default values for STORBUF are
    125%, 105%, and 95%, respectively.


    Performance gains may be realized by overcommitting the overall real storage when
    expanded storage is available. When you overcommit storage, a virtual machine''s
    working set is computed as before, but the apparent real storage available to
    virtual machines who want to enter the dispatch list appears larger. Therefore,
    more virtual machines are allowed into the dispatch list. This might result in
    higher paging rates, but often the benefit of reducing the elite list and moving
    users into the dispatch list offsets this. Expanded storage acts as a very effective,
    page buffer to real storage.


    The scheduler perceives the storage requirement for virtual machines that do not
    drop from queue to be much larger than actual. Because the scheduler cannot determine
    the real storage requirements, in this case, the STORBUF control can improve performance.
    This effectively disables the storage test discussed in 8.3.3, "Entering the dispatch
    list" on page 112.


    For Linux guests, the STORBUF control has been an inexact science. There was little
    difference in STORBUF value of 900, opposed to a value of 300. In both cases,
    the storage test was likely disabled. Conversely, when controlling a large population
    of CMS users, overcommitting real storage using STORBUF is a very effective and
    desirable control mechanism. With improvements to the Linux runs in guest mode,
    particularly the timer modification, it is worth experimenting with STORBUF overcommitment.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# The MAXWSS control


    The CP SET SRM MAXWSS sets the maximum working set that a normal user on the dispatch
    list is allowed to have. If the user''s working set size exceeds this percentage,
    that is dropped back into the eligible list from the dispatch list. The command
    format is:


    ```

    SET SRM MAXWSS m

    ```


    Where m specifies the maximum percentage of system pageable storage available
    to the user.


    MAXWSS is intended to prevent large virtual machines from acquiring a greatly
    excessive amount of system memory at the expense of smaller users.


    > Note: In order for this parameter to work as intended, virtual machines must
    reside in the eligible list (that is to say, the scheduler must consider the system
    to be storage constrained, based on the STORBUF settings).


    # The DPSLICE control


    A virtual machine is assigned a dispatch slice each time it is dispatched. The
    dispatch time slice is calculated at system initialization based on real processor
    speed and rewards a fixed number of instructions processed. This value can be
    changed by the CP SET SRM DPSLICE command:


    ```

    SET SRM DPSLICE min

    ```


    Where min specifies the minimum dispatching time slice (in milliseconds).


    > Note: Valid dispatching time slice values are in the range 100 ≥ min ≥ 1 .


    When a virtual machine is first dispatched, it runs until:


    +   * Its min time slice expires.

    * It completes the workload and proceeds to wait for more work.

    * It enters CP mode.

    * An interrupt occurs.


    When redpatched, the virtual machine is assigned a new dispatch slice. (If it
    relinquished the processor due to an interrupt, it is assigned the remaining portion
    of the previous dispatch slice.)


    # When to use SRM controls


    SRM controls can be used to ensure that:


    +   * Processor resources are utilized as much as possible.

    * Thrashing situations do not occur.

    * When performance is bad (and this will happen), some servers have preferential
    access to processor resources.


    For example, if performance is bad, you would still want TCP/IP (or perhaps a
    DNS server or manager) to perform well. Thus, it is preferable to utilize the
    SRM controls properly and not overuse the QUICKDSP option.


    > Important: The QUICKDSP option should be used for machines that need to run
    when things are very bad. Set QUICKDSP to the few that must absolutely perform,
    such as virtual machines that run mission-critical processes.'
  merge: -1
  pgno: 133
- img_proc: true
  md: 'You should use STORBUF to over-allocate storage when virtual machines do not
    drop from the queue. In this situation, the dispatching and scheduling algorithms
    become skewed. The true storage requirement is unknown, and proper scheduling
    is impossible. Installations have found when running many servers (idle servers
    that never drop from queue), the perceived storage is very high. Using STORBUF
    values to over-allocate storage can improve this situation.


    In an instance where virtual machines drop from queue, using STORBUF might not
    be appropriate.


    > Note: In order to drop from queue, Linux guests must run with the timer installed
    (see 8.3.5, "z/VM scheduling and the Linux timer patch" on page 113) and use an
    appropriate network architecture (see 11.2.1, "Seth device for OSA-Express QIO").


    For this case, if there is expanded storage, the SRM XSTORE command should be
    set to at least, or to its maximum value.


    In environments where there is considerable paging, paging should be controlled
    by the proper SRM LDBUF command. The default LDBUF in a paging environment allows
    the paging subsystem to be 100% consumed (see, 8.5, "Analysis of the SRM LDBUF
    control" on page 118). At the point where the paging subsystem is 100% utilization,
    by definition, there will be much value by increasing the LDBUF and allowing more
    users to consume paging resources.


    In 8.5, "Analysis of the SRM LDBUF control" on page 173), we examine the operation
    of some SRM controls.


    # 8.4.2 The CP QUICKDSP option


    The SET QUICKDSP command does only one thing, but it does very well. It should
    be used for service machines that are required to run, even when there are serious
    memory or processor constraints.


    The CP scheduler classifies virtual machines assigned to the QUICKDSP option as
    E0 virtual machines. An E0 virtual machine is added immediately to the dispatch
    whenever it has work to do, without waiting in the eligible list. The CP scheduler
    bypasses the normal storage, paging, and processes when moving virtual machines
    from the eligible list to the dispatch list.


    # 8.4.3 The CP SHARE command


    VM use the SHARE command to establish resource levels for the various CMS users,
    guests as Linux, and virtual machines. The first decision when using SHARE is
    to answer the question: whether to use ABSOLUTE or RELATIVE. You must decide on
    the amount of SHARE type that you want to allocate to each user. This involves
    consideration of the entire group of users running on the system, at the outset
    system creation, and each time a change to a SHARE is made.


    The simplest way to decide which to use for a specific server is to answer the
    question: As more users log on to this system, this service machine get more CPU
    or less?


    +   - A share says that this server should have a relative share of the processor,
    relative to all virtual machines in the dispatch and eligible lists. As more users
    log on, the share drops. Although the exact priority for a given user is indeterminate,
    this works very well'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'where, for example, a large community of CMS users need a fair share of the
    finite resources. A relative share evolves with the changing numbers of users,
    making way for newly logged on users, and also ensuring the fair sharing process
    is maintained when users stop using the system.


    +   > Absolute shares remain fixed up to the point where the sum of absolute shares
    is 100% or more, then all of the absolute shares for each user are established
    by using the sum of all absolute shares allocated as the divisor. An absolute
    share of 10% equals 10/100%, more than 100% is allocated across the system. If
    120% is allocated, the 10% share is then equal to 10/120.


    Servers such as TCP/IP or DNS servers might have a requirement that rises as the
    level of work increases. These servers have absolute shares. Some other virtual
    machines also have load-related requirements, for example, the CP monitor produces
    more records as users log on. You should consider giving small absolute shares
    to MONWRITE and the Performance Tool Kit. Generally, all other users should use
    relative. More important services not needing an absolute share, or more important
    users, should be given a higher relative share than the default value of 100.


    VM accounts at run time by considering the absolute share first, then moving to
    the relative holders. Note that all the shares relative to the currently scarce
    resource. Though this is generally CPU, there are occasions when other key resources
    are constrained.


    The size of the share is both a business decision and a performance decision.
    For example, one server is served a very high share, which might be as much of
    the system as the rest combined, one this server to be absolutely critical to
    your business. This server has the capability of taking resources whenever it
    needs them, but if this server starts looping, it could easily consume all the
    resource allocated.


    A simple way of looking at share values is, if there is heavy contention for the
    processor, what would you like to run to ensure you are meeting your mission goals?


    TCP/IP, with such a general key role in the network infrastructure, is an obvious
    candidate, as required services such as Domain Name system servers. TCP/IP and
    other required servers should have absolute values that approach the CPU consumption
    that would be required at peak loads. There is no value in giving more than that.
    Use your peak loading performance data to aim the overall system settings periodically.


    # 8.5 Analysis of the SRM LDUBUF control


    The purpose of the SRM LDUBUF command is to control page thrashing. Thrashing
    is a situation where paging is at a point where less work is accomplished because
    of contention for paging and storage devices. The following analysis shows some
    of the key points in evaluating the use of LDUBUF.


    When the loading capacity is evaluated by the scheduler, the number of paging
    devices is the loading capacity. Setting LDUBUF to the default of 100 85 allows
    100% of the total capacity (the number of paging devices) to be utilized. Thus,
    if there were several paging devices, seven users that were considered loading
    would allow others to be delayed on the elastic list until one or more of the
    existing users either dropped from the list or obtained their working set and
    stopped causing paging faults.


    For this analysis, a benchmark was used that would allocate storage, perform a
    function, and release the storage, which is typical of many Linux environments.
    What the measurements


    Linux on IBM z: Performance Measurement and Tuning'
