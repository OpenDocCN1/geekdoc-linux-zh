    # 10.4 Linux I/O schedulers


    The I/O scheduler optimizes disk access. Issuing each request directly to the
    disk results in a bad throughput, because this strategy causes a high amount of
    small requests, where in the worst case each request demands a completely different
    disk area. Data transfer rates from physical disks are very high, so transfer
    times are very short. The dominating part of access time is the disk latency,
    mainly caused by disk head movements of about 8 ms on average. The strategy for
    optimization is to minimize the number of I/O operations and disk head movements.'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'I/O schedulers mostly implement two functions:


    +   * Request merging

    This merges adjacent requests into one request.


    +   * Elevator

    This orders the requests to minimize seek times, considering the physical data
    location. (Seek time is the duration of a head movement to reach an addressed
    sector.) A prevent starvation functionality is required, which ensures that requests
    that are not in the seek order are served in an adequate time frame. Here the
    various I/O schedulers have different strategies.


    # New schedulers since kernel 2.6


    There are new schedulers available with Linux from kernel 2.6:


    +   * Noop scheduler

    The noop scheduler implements only the request merging function.


    +   * Deadline scheduler

    The deadline scheduler implements request merging and the elevator, and in addition
    tries to prevent request starvation (which can be caused by the elevator algorithm)
    by introducing a deadline for each request. It, prefers readers. Linux does not
    delay write processes until their data are really written to the disk, because
    it caches the data, while waits until its data are available.


    +   * Anticipatory scheduler (as scheduler)

    The anticipatory scheduler implements merging and the elevator, and optimizes
    for physical disks by avoiding too many head movements. It tries to solve situations
    where many write requests are interrupted by a few read requests. After a read
    operation it waits for a certain time frame for another and does not switch back
    immediately to requests. This scheduler is not intended to be used for storage
    servers.


    +   * Complete fair queuing scheduler (cfq scheduler)

    The complete fair queuing scheduler implements request merging and the elevator,
    and in addition benchmarks on the strategy to allow all users of a particular
    drive about the same number of I/O requests over a given time.


    # Default


    The default in kernel 2.6 was for a long time the anticipatory scheduler. A Novell/SUSE
    SLES9 and Red Hat RHEL4 installations have overwritten this with the cfq scheduler.
    With kernel 2.6.18 and later the default is the cfq scheduler.


    # Check for the current scheduler


    Searching (grep) in the /var/log/boot.msg file for the phrase io scheduler finds
    a line like:


    ```

    <Using deadline io scheduler

    ```


    That returns the name of the scheduler in use.'
  merge: -1
