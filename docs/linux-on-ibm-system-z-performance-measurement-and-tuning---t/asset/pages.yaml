    # 6.3 Exploiting the shared kernel


    We believe that it is important for the scalability of Linux on z/VM to share
    the Linux kernel in NSS. The ability to share the Linux kernel will be released
    and supported later in other service packages for SUSE distribution.


    > Note: To create a Linux system that utilizes NSS support for other SUSE releases
    or other distributions, be aware that your distributor might not support systems
    running with a compiled kernel. Because this might be the case, NSS support should
    be considered experimental. Depending on the level of support required, this approach
    might not be appropriate for your installation.


    To create a Linux NSS in SLES 10 with SP1 you need to:


    +   1. Define a skeletal system data file (SDF) for the compiled kernel using
    the CP DEFSYS command.

    2. Save the NSS-enabled kernel into the SDF using the CP SAVAYS command.


    For all distributors or release you need to:


    +   1. Compile the Linux kernel with the appropriate configuration options for
    NSS enabled.

    2. Define a skeletal system data file (SDF) for the compiled kernel using the
    CP DEFSYS command.'
