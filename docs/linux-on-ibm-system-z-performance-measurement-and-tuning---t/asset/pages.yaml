    # 2.1.4 Workload profile


    Real business applications have a workload profile that varies over time. The
    simplest form of this is a server that shows one or more peaks during the day.
    A more complicated workload profile is when the CPU intensive during part of the
    day, and I/O intensive during another part.


    The most cost-efficient approach to running many of these types of applications
    is if we adjust the capacity of the server during the day. While this might appear
    unrealistic, this is what we want z/VM to do. Portions of the virtual machine
    are brought into memory to run. Inactive virtual machines are moved to paging
    space to make room.


    # 2.2 Problem determination


    Problem determination requires the skills of a systems performance detective.
    It is a similar process to the work of a police detective who is trying to solve
    a crime. In case of IT systems performance, the crime is a performance bottleneck
    or a sudden worsening of response time. In the same manner as the police, the
    performance specialist asks questions, looks for clues, documents findings, reaches
    a hypothesis, tests the hypothesis by tuning or other means, and eventually solves
    the mystery, resulting in good system performance once again.


    # Where to start


    Usually there is some sort of clue to get you started in the bottleneck investigation.
    If not, start with simple questions that narrow the list of possibilities. Questions
    such as:


    +   * What software, hardware, or application changed?

    * When did the problem first occur?

    * Is the performance degradation consistent, or does it come and go?

    * Where is the problem answered? Does everyone feel the pain, or only some?


    These questions are answered by IT staff or by some of the performance tools that
    are discussed in Chapter 3, "Linux monitoring tools" on page 13.


    # Steps to take


    Bottleneck analysis and problem determination is greatly facilitated by sophisticated
    tools such as IT Tivoli OGAMON on z/VM and Linux. OMEGAMON detects performance
    problems and alerts you to the issue before everyone suffers under degraded response
    time. We use that tool for the following bottleneck analysis scenario.


    Bottleneck example:


    +   1. OMEGAMON sends out a warning alert for z/VM.'
