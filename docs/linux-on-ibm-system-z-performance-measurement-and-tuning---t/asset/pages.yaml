  md: 'performance data. This dual capability allows you to solve problems quickly
    and helps you to better and more easily manage a complex environment.


    OMEGAMON monitoring software provides a portal that is accessible via a desktop
    client or a browser. This portal interface allows users to monitor systems without
    having to be logged into Linux or z/VM. The portal provides a single point of
    control for monitoring all of you Linux and v/VM images as well as zOS and its
    subsystems, databases, Web servers, network services, and WebSphere MQ.


    The OMEGAMON portal displays the following types of data:


    +   Memory usage size, input and output (I/O) usage), and paging activity by workload
    manage

    - System-wide data by resource, as logical partition usage and paging data

    - System-wide spooling usage data

    - TCP/IP network statistics for enabled network virtual machines

    - HyperSockets utilization data

    - z/VM CPU data

    - Linux on IBM System z workload statistics


    The beginning phase of checking the performance of a system, or multiple systems,
    using the OMEGAMON product is to look at the high-level displays for each system.
    In our environment we are only concerned with the performance of z/VM and Linux
    guests. Since z/VM controls all of the hardware resources and virtualizes that
