    # 8.7 CPU time accounting


    Since Linux was ported to run on an IBM mainframe platform, there has been an
    outstanding issue with the way it collects and accounts utilization data. Traditionally,
    Linux ran as the exclusive operating system on a discrete, distributed hardware
    server, and the only requirements for a virtual server environment built into
    it reflected that role. When running on a mainframe, it becomes a virtual server
    environment, sitting on other virtual layers, a fairly radical shift, and so we
    should expect that some fundamental changes would be necessary. When, for example,
    a user issued the very common top command, the utilization numbers produced could
    be at considerable variance from the true values.


    In the operating space, Linux had moved from the environment it previously relied
    to keep track of what was really happening in time. Linux utilizes a tick-based
    CPU time accounting mechanism. When a time interrupt takes place, every 1/100th
    of a second on a System z system, Linux discovers which context has the interrupt,
    and charge accounts the total time slice to this context. For a kernel interrupt,
    the entire time slice is accordingly accounted as system time. In the following
    examples, the top bar shows Linux would account in a freelanding machine, and
    the figures of 2/100th for kernel and 7/100 for the user are correct. Compare
    and note how in the second and third bars, with the introduction of the 1/100th
    second interrupt, the gross timing inaccuracy when the context switches means
    there will be a varying level of deviation from the true values, depending on
    exactly when in time the ticks commence.'
