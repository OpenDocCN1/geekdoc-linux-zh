  md: 'With the PAV storage systems can present the same physical disk volume as a
    base device and one or more aliases. On System z, the base device and the aliases
    all can be assigned separate device numbers. Figure 10-8 illustrates the relationship
    between the base and alias devices for a volume.


    ![](img/a8398552a9cf58d3f3798c1dedb947c2_176_0.png)


    Figure 10-8 Relationship between the base and alias devices for a physical volume


    In 10-8, a disk volume space can be accessed as a base device or one of two aliases.
    The base represents the real DASD volume space, and the aliases are shadows of
    the base. The aliases have no owned data space, but are mapped to the same physical
    volume accessed by the base.


    If a Linux system has access to a base device and its aliases, the DASD device
    driver senses the base device and each alias as a different and independent DASD,
    and assigns a different device name to each of them, as shown on Figure 10-8.
    After a DASD is partitioned and all the base devices and aliases are newly initialized,
    the DASD device driver senses the partitions and assigns additional device name
    names for the partitions on both the base device and aliases, as illustrated on
    Figure 10-9.


    ![](img/a8398552a9cf58d3f3798c1dedb947c2_176_1.png)


    Figure 10-9 Relationship between the base and alias devices after partitioned
    seen from Linux guest


    Chapter 10. Tuning disk performance for z/VM Linux guests 159'
