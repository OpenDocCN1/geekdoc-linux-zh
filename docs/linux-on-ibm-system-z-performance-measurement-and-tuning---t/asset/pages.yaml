- img_proc: true
  md: '# 7.1 Linux swapping basics


    Over time, a Linux system uses all the available memory. When it does not need
    memory to run processes, it uses excess memory to cache data. The most obvious
    way to prevent this is to give the virtual machine more memory than it needs.
    Unfortunately, this is not always possible. Memory requirements vary over time
    as processes start and stop. Consequently, the virtual machine is either too big
    or too small.


    When the virtual machine is too small for the workload, Linux starts to swap.
    Pages from other processes are moved out and ordered on the Linux swap desks to
    make room for the pages of the process that need to run. If Linux swaps continuously,
    performance is affected. Occasional swapping inside Linux is not necessarily bad.
    The acceptable amount of swapping depends on the efficiency of the swapping mechanism.


    To compare the efficiency of swap device types for Linux, we ran a number of hogmem
    processes in a small virtual machine. The hogmem program is simple. The listing
    can be found in 7.9, "Program text for hogmem test" on page 99. It allocates the
    specified amount of virtual memory for the process and then accesses each page.
    When the amount of memory allocated by hogmem exceeds the free memory in Linux,
    some other pages are swapped out by Linux. When we run hogmem programs in parallel
    and allocate more virtual memory than what Linux can free up, constant swapping
    occurs (which slows down operation).


    When we IPL the kernel in a 128 MB virtual machine, the output of free -m, as
    shown in Example 7-1, shows that nearly half of that storage should be available
    for


    > Example 7-1 Available memory in an idle 128 MB virtual machine


    | total | used | free | shared | buffers | cached |

    |---|---|---|---|---|--|

    | Mem: | 116 | 55 | 60 | | 0 | 24 |

    | -/+ buffers/cache: | | 27 | 89 | | | |

    | Swap: | 7043 | | 7043 | | | |


    The output shows that 60 MB is not in. Much of the buffers and cache could be
    reclaimed by Linux when necessary, so 87 MB is what we can obtain without causing
    much swapping.


    After starting a 87 MB process, we re-examine memory usage in Example 7-2.


    > Example 7-2 Memory usage in 87 MB machine with 87 MB process


    # free -m

    | total | used | free | shared | buffers | cached |

    |---|---|---|---|---|--|

    | Mem: | 116 | 1 | | | 0 | 4 |

    | -/+ buffers/cache: | | 110 | 5 | | | |

    | Swap: | 7043 | 6 | 7036 | | | |


    This shows that Linux did not give all buffers and cache, but decided to do some
    things to swap:


    +   - Linux swapped 59 MB from the free pool, leaving 1 MB available to satisfy
    and demand urgent requests.


    +   - The remaining 28 MB was obtained from buffers/cache and by memory freed
    by swapping.'
