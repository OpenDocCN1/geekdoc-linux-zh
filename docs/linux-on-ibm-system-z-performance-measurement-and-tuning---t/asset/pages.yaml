  md: '# Linux monitoring tools


    The purpose of this book is to discuss the analysis of z/VM and Linux performance
    monitor data, rather than providing a comparison of monitoring tools. However,
    an overview of the tools used in writing this book is provided in this chapter
    as background information. It is important to understand the types of tools available
    for the System environment and the value they provide to a systems administrator
    or performance specialist.


    In this chapter, we start by describing the performance data produced by some
    of the IBM z/VM and Linux performance monitoring software products. These products
    can go beyond simple monitoring, with charting capabilities, problem diagnosis
    and alerting, and integration with other software for monitoring of other systems
    such as z/OS, databases, and Web servers. The real-time monitoring tools used
    in writing this book include the VM Performance Toolkit, and IBM Tivoli XE for
    z/VM and Linux. The historical post-processing software products include the VM
    Performance Reporting Facility and the VM Performance Analysis Facility. Following
    the sections on performance tuning software products, are discussions on simple
    tools or commands that are either provided with the operating systems or are available
    to the user community as free-ware.


    In each section, the performance tuning tools are discussed in the context of
    the steps involved in analyzing the performance of a system.'
  merge: -1
  pgno: 30
- img_proc: true
  md: "# 3.1 Introduction to system performance tuning tools\n\nSometimes the hardest\
    \ part of the process to improve system performance is deciding how to get started,\
    \ or what tool to use. Real-time monitors and tools provide useful information\
    \ in solving todays performance problem. Historical reporting tools give information\
    \ that can be useful for health checks, problem determination, and trend analyses.\
    \ Sophisticated monitoring software can also proactively check for performance\
    \ issues and automatically prevent outages.\n\nReal-time monitors can be as simple\
    \ as Linux or zVM commands that are built in each system. These commands might\
    \ be your first options for performance analysis if more robust software products\
    \ are not available. IBM Performance Toolkit and Tivoli OMEAGON on zVM and Linux\
    \ are also examples of real-time monitoring tools. They were used in combination\
    \ with our benchmarks to capture performance information. In this book, the IBM\
    \ OMEAGON suite of software is also referred to as OMEGAM. The zVM Performance\
    \ Toolkit and OMEAGON provide detailed system performance statistics in tabular\
    \ and graphic formats. They also have automatic computing capabilities that resolve\
    \ problem situations without operator intervention.\n\nHistorical reporting is\
    \ outside the scope of most system commands. Therefore, health checks, problem\
    \ determination, and trend analysis are best done by software that collects the\
    \ data for later analysis. After the data is collected, reporting tools can filter\
    \ the massive amount of data, helping to narrow the search for relevant information.\
    \ The historical reporting tools that were chosen for this book include IBM VM\
    \ Performance Reporting Facility and the VM Performance Analytics Facility.\n\n\
    # 3.2 IBM z/VM Performance Toolkit\n\nThe Performance Toolkit for zVM (also called\
    \ the Performance Toolkit) is designed to assist operators and system programmers\
    \ or analysts in the following areas:\n\n+   * System console operation in full\
    \ panel mode\nThe features have been designed to facilitate the operation of VM\
    \ systems, improving operator efficiency and productivity.\n* Performance monitoring\
    \ on zVM systems\n\nAn enhanced real-time performance monitor allows system programmers\
    \ to monitor system performance and analyze bottlenecks. Features included in\
    \ the monitor, and the manner in which data is displayed, have both designed to\
    \ improve the system programmer's productivity when analyzing the system, and\
    \ allow even a new user to work efficiently with the tool. The Performance Toolkit\
    \ can help system programmers to make more effective use of system resources,\
    \ increase system productivity, and improve user satisfaction.\n\nThe z/VM Performance\
    \ Toolkit features include:\n\n+   * Automatic threshold monitoring of many key\
    \ performance indicators with operator notification if user-defined limits are\
    \ exceeded\n* Special performance monitoring mode with displays for monitoring:\n\
    \  * General CPU performance\n  * System and user utilization and management"
  merge: -1
