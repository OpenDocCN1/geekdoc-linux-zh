  md: '+   Lower management costs


    By consolidating a number of physical servers onto a single or vastly smaller
    number of larger processors, complexity of the infrastructure is reduced, and
    common management tasks are concentrated and automated, which can greatly improve
    staff productivity.


    +   Improved provisioning


    Since virtual resources are abstracted from hardware and operating system issues,
