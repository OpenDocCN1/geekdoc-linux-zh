- img_proc: true
  md: '3. Save the NSS-enabled kernel to the SDF using the CP SAVESYS command.


    The kernel configuration option CONFIG_SHARED_KERNEL is used to enable the kernel
    code and data in memory segments. This is necessary because the shared kernel
    must be protected against updates from the Linux images that use that kernel.
    In S/390 architecture, protection is assigned on a segment basis (each segment
    is 1 MB in size).


    > Note: When Linux is running in dedicated memory (for example, on an Intel® server
    or in a S/390 LPAR), this option would not be used. It would only waste some of
    the memory dedicated to that server. However, when running Linux in a virtual
    machine, there is very little cost involved with virtual memory that is never
    used. It does not have to be provided by z/VM either (the memory below 3 MB can
    be compensated for giving the virtual machine slightly more memory).


    Figure 6-5 shows how a kernel map can look with new releases, for example, with
    SUSE 10.


    | VMSIZE | |

    |---||

    | 5 MB | Free to use / Kernel data (R/W) / Unused |

    | 1 MB | Kernel code (R/O shared) / Unused / Zero page, etc. |

    | 0 MB | |


    Figure 6-5 Linux memory map with shared kernel


    # 6.3.1 Building an NSS-enabled Linux kernel


    This procedure is intended for distribution that currently does not support the
    NSS in the kernel. If you are running a Linux with SLES10 SP1, you can refer to
    6.3.2, "Defining a skeletal system data file for the Linux NSS" on page 68. To
    build a Linux kernel for System 2:


    +   1. Obtain the kernel.

    2. Obtain and apply the zSeries-specific and S/390-specific patches and object
    code (OCO) modules.

    3. Configure and build the kernel.

    4. Copy the OCO modules to the appropriate locations in the file system.

    5. Copy the new kernel to the /boot directory and run the zip1 command.


    Details about building a Linux kernel for zSeries can be found in Linux on IBM
    eServer zSeries and S/390: TCP/IP Broadcast on z/VM Guest LAN, REDP-3596, at:http://www.ibm.com/redbooks/abstracts/redp3596.html'
