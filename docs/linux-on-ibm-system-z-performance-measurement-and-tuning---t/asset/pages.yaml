    # Linux swap cache


    Even the implementation of the swap cache in Linux reduces to the I/O burden.
    The copy of the swapped-out page is held on the swap device or if the page is
    eventually evicted, if the page has to be swapped out for the second time there
    are two options: if the page was not changed (is dirty), it can be simply discarded.
    If the page was already changed (it is dirty), it has to be brought out a second
    time. The page already has a location in the swap space that reduces the overhead
    for assigning a new location.


    > Note: The swap cache sometimes causes misleading swap and swap-out page information
    in monitoring commands. This is the case when using tools vmstat. The paragraphs
    show more pages swapped in swapped out.


    # 7.2 Linux swap options


    Linux on System has many options when it comes to choosing the appropriate swap
    device. Often installations use VDISK when running on z/VM, and ECKDD running
    in an LPAR with zVM. There are other options like the DIAGNOSE for 64-bit DASD
    (supported on zVM 5.2 or later), which was previously only available in 31-bit.
    When swapping a device, the most important thing is consider whether swapping
    is expected to be a normal every day processing, or whether swapping occurs occasionally.
    But, if an application starts swapping, the performance depends on the ability
    to transfer pages to and from the swap device quickly.'
