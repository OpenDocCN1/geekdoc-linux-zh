  md: 'Figure 10-6 shows an example database''s performance measurements. The test
    was carried out by the IBM Linux performance team in Boeblingen, Germany.


    ![](img/a8398552a9cf58d3f3798c1dedb947c2_173_0.png)


    Figure 10-6 Relative performance of a database experiment using randomized access


    The chart shows the influence of the caching mode on the performance. In this
    example the access was randomized, so random and inhibit caching modes have the
    best results. The normal caching mode is adapting to the randomized I/O and has
    a median performance. It is expected to get better performance over time if the
    usage pattern does not change much.


    In case of sequential access to the data, the sequential caching mode has the
    best results. The normal mode adapts over time.


    It is important to know before which cache mode is used. Otherwise, the self-adapting
    and optimizing modes should be preferred.


    # 10.4.7 Linux Logical Manager


    With Logical Manager (LVM) data striping and software RAID emulation (RAID 0),
    a single disk is mapped to several physical disks. This allows the system to initiate
    up as many simultaneous I/O operations as physical disks. The number of parallel
    I/O operations is limited by the resource channel, but it is not a one-to-one
    relationship. Each stripe cannot be placed on its own child. With FICON we do
    loadsharing, and with FCP we can use a round-robin method. But depending on the
    number of channels and physical disks, we may reuse the same FCP channel several
    times.


    When striping, contention can also occur at the control unit or at the disk. Ensure
    that the disks are distributed to different control units and define the minidisks
    on separate disk units.'
