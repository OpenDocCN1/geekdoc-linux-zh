    # 2.4 Benchmarking concepts and practices


    Performance is the key metric when trying to predict when a processor is out of
    capacity. High processor utilization is desirable from the standpoint of getting
    the most out of your investment, but not a true predictor for capacity planning
    purposes. As the workload grows on a processor, performance does not always change
    in a similar fashion. If a processor is running at 90% utilization grows by 10%,
    the performance will most likely get significantly worse. A system out of capacity
    when the performance becomes unacceptable and tuning efforts provide some relief.


    One of the characteristics of performance is that it scales in a non-linear fashion
    relative to processor utilization. This means that it can remain flat or nearly
    constant until utilization reaches a critical point, and then performance degrades
    becomes erratic. Typically happens when you push from the linear part of a performance
    versus utilization chart to the exponential part of the curve. This is called
    hitting the knee of the curve, and that where performance goes from mediocre to
    terrible in a short span of time.


    Not every workload behaves the same at any given processor utilization. Work that
    is designated as high priority in a system may perform fine when total utilization
    is 80%. Low priority is the first workload that notices the burden of an overloaded
    system. The performance of the low-priority workload demonstrates the exponential
    degradation, before high-priority work shows signs of stress. As the system nears
    maximum capacity, workload input may continue to grow, but system throughput may
    stay constant or perhaps down. Eventually the stress of an overloaded system affects
    all levels of workload— low, medium, and high priorities.


    Processor capacity and utilization are not the only factors affecting performance.
    Depending on the workload, performance is affected by all hardware components
    including disk, memory, and network. The operating system, software subsystems,
    and application code compete for those resources. The complexity of factors affecting
    performance means that there is no simple way to predict what happens when workloads
    change or hardware change. One of the best ways to evaluate the effects of changes
    in the computing environment is to run benchmarks.


    Benchmarks differ from modeling in that real hardware, software, and applications
    are run instead of simulated or modeled. A good benchmark contains many iterations
    testing a workload, with changes made between iterations. The changes include
    one or more of the following:


    +   - Increase or decrease of the workload

    - Increase, decrease, or change of hardware resources

    - Adjustments to tuning parameters


    After each benchmark iteration, the results are reviewed by the benchmark team
    before deciding on the next adjustment. Benchmarks are an excellent opportunity
    to try many-what scenarios. Benchmarks run during the writing of this book are
    discussed in the appendices.'
  merge: -1
