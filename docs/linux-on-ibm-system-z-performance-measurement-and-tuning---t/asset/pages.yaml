  md: '# # Linux on IBM System z: Performance Measurement and Tuning


    ![](img/a8398552a9cf58d3f3798c1dedb947c2_241_0.png)


    # ### Understanding Linux performance on System z


    In this IBM Redbooks publication we examine performance measurement and tuning
    for Linux as a z/VM guest on an IBM System z29 machine with a focus on the SLES
    10 2.6 kernel and z/VM 5.3.


    # ### z/VM performance concepts


    This book is intended for system administrators and IT architects responsible
    for deploying Linux servers under z/VM. We examine performance concepts and identify
    tuning parameters using examples, we investigate performance and tuning topics
    for the memory, processor, DASD, and networking subsystems. We provide tuning
    guidance at both the z/VM and Linux level. Performance is analyzed to maximize
    investment in Linux for System z.


    # ### Tuning z/VM Linux guests


    The system used in the writing of this book is an IBM System z/VM Version 5.3
    in an LPAR. The Linux distribution used in this book is NovelSE Linux Enterprise
    Server 10 (based on a Linux 2.6 kernel).


    The intent of this book is to provide guidance on measuring and optimizing performance
    using an existing System z configuration. The examples demonstrate how to make
    effective use of your System z investment. The workloads used are chosen to exercise
    a specific subsystem.


    # ### INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    # ### BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    IBM Redbooks are developed by the IBM International Technical Support Organization.
    Experts from IBM, Customers and Partners from around the world create content
    based on realistic scenarios. Specific recommendations are provided to help you
    implement IT solutions effectively in your environment.


    # ### For more information: ibm.com/redbooks


    SG24-6926-01  ISBN 0738485586'
