    # 7.3.2 Swapping with DIAGNO access method to DASD


    The Linux DASD driver uses the ECKD and FBA disciplines. In the past, the DIAGNO
    discipline had some bugs, and it was not used. The kernels built by SUSE and Red
    Hat, therefore, do not have the DIAGNO access method built into the kernel. This
    has changed over the years. Recent distributions come with the required dasd_diag_mod
    module and are able to use DIAGNO to access DASD. The latest distributions offer
    the DIAGNO option for 64-bit (zVM 5.2 or later is required).


    The DIAGNO access method of the Linux driver uses a high-level block I/O protocol
    (DIAG 250) to have CP perform the actual I/O operations when necessary. The measurements
    show the benefit of this protocol over the details chosen by the driver.


    # Enable DIAGNO I/O for the 3390 DASD


    The process involves:


    +   The disk is to be initially formatted under control of the ECKD discipline
    of the DASD driver. Before starting the Linux system, this disk was formatted
    with CMS and RESERVED. Linux commands dasfdet and ekswap also work here.


    +   Change to directory /sys/bus/ccw/devices/<addr>.


    +   The command echo 0 > online instructs the DASD driver to use the device.


    +   Ensure that the DIAGNO discipline module (dasd_diag_mod) is loaded.


    +   The command echo 1 > use_diag enables the DIAGNO access method.


    +   The command echo 1 > online instructs the DASD driver to use the device again.


    The DASD is used by DIAGNO access method from this point in time.


    # Swapping with DIAGNO access method


