  md: '# Mstone overview


    Mstone is a performance measurement tool available from the Mozilla project:

    http://sourceforge.net/projects/mstone


    Originally known as Mailstone, Mstone can be used for capacity planning and testing
    network mail servers. The Mailstone user guide can be found at:

