    # # Virtualization and server consolidation


    In this chapter, we discuss what virtualization is and what benefits we can get
    by by running Linux as a z/VM guest. We examine sharing real hardware resources
    using the virtualization technology provided by z/VM.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# ## 1.1 Server consolidation and virtualization


    The concept of virtualization, for example, where large numbers of virtual servers
    are consolidated into a small number of relatively large, physical servers, is
    rapidly becoming commonplace in centers around the world. The System z mainframe
    is ideally suited for this hosting server role.


    Selection of workloads suitable for virtualization needs to be done at a very
    early stage when planning to move workload on many discrete servers with non-shared
    resources. Some workloads mainly numbering crunching activity, for example, financial
    forecasting applications. Any application that relies on using a single resource
    is particularly heavy, in this case CPU with relatively low I/O and memory requirements,
    is not a good candidate for virtualization. The more commonly encountered workloads
    that use CPU, I/O and memory in a moderate, balanced fashion are likely to be
    good candidates, that can coexist far away in a shared resource infrastructure.


    We are wary of misleading comparisons, especially those that consider only one
    of the major resources. If we compare the cycle speed of a System z Pentium processor
    or a single processor on a multi-core processor chip, the comparison might appear
    to suggest that System z has no great advantage. If the workload uses 100% of
    CPU for 24 hours a day, the workload would easily use most of an System z for
    the whole day. Virtualizing this workload means effectively dedicating part of
    the CPU resource to a single workload, which is clearly not conducive to coexistence
    in a more idealized virtualized, shared pool environment.


    Even though a System z has multiple CPUs, with a higher maximum number than any
    other platform, that could actually allow the application to run very well, it
    is still not advisable to host such a workload on System hardware. Fortunately,
    in terms of real-world processing, such extremes are not typical, and there are
    very many situations where using System z makes a lot of sense. In this book,
    we use a case study that utilizes an IBM WebSphere workload generated by the Trade
    6 Benchmark to represent a balanced workload that is suited to virtualization.


    Consider the case where the workload does not use the machine for the full 24
    hours, but only for 12 hours. In this case there is another workload using the
    same amount of resources, but during the other 12 hours of the day. In that situation,
    we can put Linux systems on the System z and let them use all the cycles that
    they need. These two systems would have plenty coexist on the same mainframe,
    running as virtual guests. As seen in the examples presented in this book, they
    are using in total around half of the CPU power than would be if they are running
    on freestanding, discrete hardware.


    Total cost of ownership (TCO) is also another key factor when making the decision
    to build a virtualized environment on the mainframe. When all factors are into
    account, including hardware cost, software licensing, on-going support costs,
    space usage, and power costs related to running and cooling the room area, the
    System z is likely to deliver the overall lowest TCO for instances with a large
    investment, comprising many distributed servers. In addition, the reliability,
    availability, and serviceability that are known and proven strengths of the mainframe
    are additional positive factors.


    When multiple Linux systems run on the same System z, each Linux system is made
    to believe that it has dedicated access to a defined portion of the System z,
    using a technique known as timesharing. The System hardware and v/VM take care
    of the smoke and without necessarily dedicating portions to that Linux system
    in practice.'
  merge: -1
