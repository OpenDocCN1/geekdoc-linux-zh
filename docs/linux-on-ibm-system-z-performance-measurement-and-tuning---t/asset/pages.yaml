  md: 'the root file system device, virtual machines using the NSS must define a 201
    disk with a root Linux file system.


    # 6.4 Execute-in-place technology


    You can keep down memory requirements and improve your performance of virtual
    Linux using discontiguous saved segment (DCSS). In a virtualized environment,
    Linux images may need the same data at the same moment. Doing that, the same data
    might get loaded into memory several times. A major part of memory required by
    Linux is used for binary application files and for shared library files. This
    technology helps provide you a way to share memory for some application using
    a discontiguous saved segment by z/VM.


    When you plan to share data consider that:


    +   - Application files can only be shared by Linux instances that use the same
    version of an application.

    - Shared data must be read-only.

    - Applications and libraries that are frequently used by numerous Linux instances
    are good candidates.


    DCSS can be defined between Linux guest storage or in a storage gap. Using a storage
    gap is the preferred placement for a 64-bit Linux guest. Linux can access a DCSS
    through the execute-in-place file (xip2). The functionality of this is easy to
    understand.


    Linux load shared library and application files through the mmap(2) operation.
    mmap() maps the contents of a file into the application''s address space. The
    xip file system performs this operation by mapping the contents of the DCSS into
    the application''s address space while other files use a page cache. This feature
    is called execute-in-place because the files are not physically copied to a different
    memory location. With execute-in-place technology, Linux can.


    +   - Access files and libraries without I/O operations (which increases overall
    performance).

    - Run an application in a shared memory segment (which saves memory).


    # 6.4 Setting up a DCSS


    In this chapter we provide an example of how to use a DCSS. If you are planning
    to use this technology, refer to documentation available at:


    ```

    http://www.ibm.com/developerworks/linux/linux390/october2005_documentation.html

    ```


    # Plan for a DCSS


    The directory we are going to use for the example is /usr. The du -sk command
    shows how big the directory is. This is important when we define the DCSS. In
    our example the directory is 1035264 KB. We need to add some extra space in order
    to manage meta data and future space for software updates. We increase our directory
    up to 1258291 KB (1.2 GB).'
  merge: -1
  pgno: 88
- img_proc: true
  md: 'We are now ready to setup our DCSS. Refer to Table 6-2 to check the maximum
    DCSS allowed.


    # Table 6-2 Maximum DCSS size


    | Kernel | DCSS location | Maximum DCSS size |

    | 64-bit | Storage gap | 1919 MB |

    | 64-bit | Above guest storage | 2047 MB |

    | 31-bit | Either location | 1990 MB |


    In our example we choose to assign DCSS above guest storage. We now determine
    the start and end addresses of our DCSS. These addresses must be on a page boundary
    (4 KB) and in hexadecimal notation. In our example:


    +   - Start address: 512 MB = 0x20000000

    - End address: 512 MB + 1011 MB - 1 MB = 0x5F2FFFF

    - Start frame: 0x20000

    - End frame: 0x5F2FF


    Before the Linux kernel can use the DCSS above guest storage, it must be aware
    of the extended address space that covers the DCSS. To do, simply add a mem=<value>
    on your kernel parameter file, run zipl, and reboot it. In our example:


    ```

    mem=1523M

    ```


    # Create over-mounting script


    We choose to use an entire directory. This means we need to over-mount our DCSS
    on the directory that we are including in the segment. This directory resides
    on the root partition, so we need a script to run before system startup.


    IBM provides a sample script to be tailored, xipinit.sh. Example 6-5 shows the
    xipinit.sh tailored for our purpose. The changes we have made are in:


    # Example 6-5 xipinit.sh


    ```

    #!/bin/sh

    #

    xipinit.sh, Version 2

    #

    # (C) Copyright IBM Corp. 2002,2005

    #

    # /sbin/xipinit: use read only files from another file system

    #

    # default options

    # internals

    #set -v

    #FAKE=echo

    #mount point of xipimage

    ROMUNT="/mnt"

    #name of xipimage

    XIPIMAGE=$USXXIP

    #name of device node

    RODEV="dev/dscblk0"

    RODIRS="/usr",

    # make sure it ends with ,

    RODIRS="$RODIRS",

    ```'
