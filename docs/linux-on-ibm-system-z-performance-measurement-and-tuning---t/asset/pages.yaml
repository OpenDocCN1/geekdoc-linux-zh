- img_proc: true
  md: '# 10.1 Disk options for Linux on System z


    There are many options to choose for disk devices. There are Direct Access Storage
    devices (DASD) and Small Computer System Interface (SCSI) disks, and z/VM controlled
    devices like minidisk. Some of the devices are able to use different disciplines
    and access methods to communicate.


    # 10.1.1 DASD with ECKD or DIAGNOSE


    Linux on System z supports DASD devices like 3390 Mod. 3, 3390 Mod.9, and 3390
    Mod 27. Today these devices are emulated by storage subsystems. Different methods
    to connect to the DASD devices are available to choose from. The relatively slow
    ESCON® channel is still supported, but faster FICON adapters are available. Recent
    distributions use the DIAGNOSE discipline to access ECKD. The latest distributions
    offer the DIAGNOSE access for 64-bit Linux on System z (z/VM 5.2 or later is required).


    # 10.1.2 SCSI disk


    Support of FCP enables System z to attach to SCSI devices as well as these access
    devices from z/VM or Linux on System z. This connectivity provides enterprises
    with a wide range of storage solutions and may allow use of existing storage devices.
    Fibre Channel (FCP Channel) support means Linux instances on System z can attach
    to and communicate with SCSI devices using the Fibre Channel Protocol (FCP).


    # 10.1.3 z/VM minidisks


    This is the standard and most basic way that z/VM allocates resources to users
    and guest systems such as Linux. A large system volume, contains 3339 cylinders
    when formatted before being subdivided, of which 3338 are available for allocation
    to users. (The first cylinder, numbered 0, is reserved). Firstly, a new volume
    must be prepared by formatting, and then allocating the user extent, giving it
    type of PERM, denoting permanent user space. These prepared 3338 cylinders are
    typically split portions of length and allocated to users, often by using the
    DIRMAINT tool. An entry is created in the VM Directory entry to define the minidisk
    (DISK). If a directory management tool is not available, this entry can be prepared
    using the VM Edit editor. A line defining a minidisk in the Directory looks like
    this:


    ```

    DISK 0191 3390 61 20 1L6UIIR MR

    ```


    This shows, reading the fields from left to right, that line entry is defining
    a DISK, the virtual address, the emulated device type, the starting cylinder address,
    the size in cylinders, the volume name, and the mode or level of disk access privilege.
    Here MR denotes a conditional multiple-write mode.


    # 10.2 Factors that influence disk I/O


    In this section we discuss factors that influence disk I/O.'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# DASD I/O


    When evaluating DASD I/O performance, overall response time consists of several
    components, as depicted in Figure 10-1.


    ![](img/a8398552a9cf58d3f3798c1dedb947c2_164_0.png)


    Figure 10-1 Components of overall DASD response time


    These components are:


    +   - Queue time

    Queue time is a result of multiple users simultaneously accessing a device. If
    the device is busy servicing an I/O request, additional I/O requests wait in the
    queue. The length of an I/O request is the most variable, and under heavy load,
    it can be the most serious. High queue times can indicate operating system contention,
    or a high device service time (as I/O requests take longer to complete, requests
    for service from other users can cause queuing for heavily used devices).


    +   - Connect time

    Connect time is the actual time to transfer the data on the channel, normally
    less than 2 ms for a 4 K block of data.


    +   - Pending time

    Pending time is the time required to start an I/O operation. Normally, this amounts
    to less than 1 ms. High pending time reflects contention on the I/O path. This
    might be due to contention on the channel, the control unit, or on the DASD device.


    +   - Disconnect time

    Disconnect time is the time required by the control unit to access the data. This
    includes rotational delays, seek delays, cache management, and processing time
    inside the control unit. Disconnect time is normally less than 2 to 3 ms on cache
    controllers.


    +   - Service time

    Service time is the sum of pending, connect, and disconnect times.'
  merge: -1
  pgno: 164
- img_proc: true
  md: '+   - Response time

    Response time is the sum of queue and service times.


    # SCSI I/O


    When evaluating SCSI I/O performance, overall response time consists of several
    components:


    +   - Queue time

    If the device is busy servicing an I/O request, additional I/O requests wait in
    the queue. The length of time an I/O request waits for queuing is the queue. This
    component can be the most variable, and under heavy load can be the most serious.
    High queue times can indicate operating system contention, or a high fabric latency
    (as I/O requests take longer to complete, requests for service from other users
    can cause queuing for heavily used devices).


    +   - Fabric latency

    This is the time from entering the fabric until coming back. This includes all
    the time that is needed on the storage subsystem and in switches.


    +   - Channel latency

    Additional time spent in the channel to fulfill the request.


    # 10.3 Observing disk performance


    We monitor performance and identify performance issues using resource management
    tools. There are many ways to collect the data. Besides the online tools there
    are ECKD and SCSI statistics, too.


    # 10.3.1 DASD statistics


    Linux can collect performance stats on DASD activity as seen by Linux. The data
    collection is carried out by the DASD driver.


    Example 10-1 DASD statistics - how to use


    ```

    Turn on with

    echo > /proc/dasd/statistics

    Turn off with

    echo > /proc/dasd/statistics

    To reset: turn off and then on again

    Can be read for the whole system by /proc/dasd/statistics

    Can be read for individual DASDs by tunedasd -P /dev/dasd

    ```


    For more details refer to the following Web site:


    ```

    http://www.ibm.com/developerworks/linux/linux390/perf/tuning_how_tools_dasd.html

    ```


    # 10.3.2 SCSI statistics


    The Linux kernel 2.4 version of the device driver for FCP provides some basic
    statistics of the I/O traffic pattern for SCSI devices on Linux z.'
