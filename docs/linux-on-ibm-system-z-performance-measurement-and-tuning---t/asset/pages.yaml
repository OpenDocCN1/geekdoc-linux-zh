    # 11.6 Workloads and performance tools


    As mentioned in some parts of this chapter, we made our tests using different
    workload scenarios. These scenarios reproduce real cases of a production network
    traffic. We use different tools to manage our results. These results are:


    +   - netperf


    This is designed on a client-server model. It is divided into two processes, one
    to manage the server (netserver), and a client to control benchmarks (netperf).
    For more details refer to:


    > http://www.netperf.org


    +   - iperf


    This tool is based on a client-server model and is useful for throughput calculation.
    For more information refer to:


    > http://dast.nlarr.net/projects/iperf/


    Workload used in our tests are:


    +   - Request-response test (RR)


    This test describes data exchange like what usually happens in interactive environments,
    is long-running transport connections with small amounts of data being exchanged
    in a conversational way. For this workload, networking performance means transaction
    per wall clock second and CPU time consumed per transaction.


    +   - Connect-response (CRR)


    This test describes data exchange that usually happens with an HTTP server. That
    is, connection start, a small amount of data flows in, a moderate amount flows
    out, and the connection ends. For this workload, we are still interested in transactions
    per wall clock second and CPU time consumed per transactions (or multiple).


    +   - Streaming get (STRG)


    In this test, the connection is persistent, just as an RR. However, the data sent
    in one direction is very small (just a few bytes), and the data sent in the other
    direction is very large. This scenario illustrates the best-case rate at which
    the computing system can pump data across a communication link. In this environment
    what interests us are megabytes per wall clock second and CPU time used per megabyte
    send.


    Chapter 11. Network considerations 189'
