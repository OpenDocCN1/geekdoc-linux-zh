  md: '# 8.3.1 Entering the dormant list


    On logon, virtual machines are initially placed on the dormant list. Upon completing
    a transaction, virtual machines enter the dormant list from the dispatch list.


    > Note: This is referred to as being dropped from the queue.


    A virtual machine can enter the dormant list from the dispatch list if its elapsed
    time slice has expired and is waiting for a resource (such as a demand page-in).
    When processor time requires, virtual machines are moved to the eligible list.


    # 8.3.2 Entering the eligible list


    Upon entry to the eligible list from the dormant list, virtual machines are normally
    classified as E1 (E0 virtual machines move directly to the dispatch list). Virtual
    machines can enter the eligible list from the dormant list if they did not complete
    processing in their elapsed time slice. In this case, an E1 virtual machine drops
    to E2, the E2 virtual machines drop to the E3, and E3 machines remain in E3.


    # 8.3.3 Entering the dispatch list


    In order to move from the eligible list to the dispatch list, a virtual machine
    must pass three tests:


    +   - Storage test

    The virtual machine associated with working set must fit in real storage as it
    stands at that. We discuss this in "The STORBUF control" on page 115.

    - Paging test

    If User is a loading user, there must be room in the loading user buffer at that.
    Loading users are discussed in "The LDDBUF control" on page 114.

    - Processor test

    There must be room in the dispatch buffer. The dispatch buffer size is discussed
    in "The DSPBUF control" on page 114.


    A virtual machine on the dispatch list remains for the duration of its elapsed
    time slice. Elapsed time slices are assigned to virtual machines as they enter
    the eligible list and based on their transaction class.


    CP assigns an initial elapsed time slice of 1.2 seconds for E1 virtual machines
    during initialization. This value is dynamically adjusted during system operation:


    +   - As the number of virtual machines that complete processing in E1 increases,
    the size of the E1 elapsed time slice decreases.

    - As the number of E2 virtual machines increases, the size of the E1 elapsed time
    slice increases.

    - If the number of E1 virtual machines drops below a threshold, the number of
    E3 virtual machines increases above a threshold, the size of the E1 elapsed time
    slice increases.


    The E1 elapsed time slice will always be a value between 50 ms and 16 seconds.
    E0, E2, and E3 elapsed time slices are assigned 6, 8, and 48 times larger, respectively,
    than the E1 time slice.'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'The dispatch time slice is computed at CP initialization. Its value can be
    queried using the

    QUERY SRM DSPSLICE command.


    While on the dispatch list, a virtual machine runs for its designated elapsed
    time slice. If

    processing has not completed in that period, it is moved back to the eligible
    queue (with a

    lower workload classification if not already in the E3 queue).


    # ## 8.3.4 Scheduling processors


    Additional VM blocks are created for each virtual processor defined to a virtual

    machine. These additional blocks are linked to their respective base definition
    block. Both the

    base and any additional definition blocks cycle through the three scheduler lists.
    The base

    definition block owns the storage and most virtual resources for the virtual machine.
    As the

    base and additional definition blocks move through the lists, the base is always
    in a list at

    as high as any of its linked blocks.


    > Note: The hierarchy of lists is defined as (highest to lowest):


    +   1. Dispatch list

    2. Eligible list

    3. Dormant list


    This ensures that the resource requirements of the virtual machine as a whole
    are considered

    when scheduling a VM definition block. However, processor time consumed by any
    additional

    definition blocks is measured independently of the base. This value is used when
    scheduling

    that block on the dispatch list.


    To illustrate, consider a virtual machine with two virtual processors (and two
    VM

    corresponding definition blocks), both of which start in the dormant list. If
    the additional

    definition block becomes displaceable, both definition blocks (the base and the
    additional)

    move to the eligible list. After waiting in the eligible list, both blocks blocks
    move to

    the dispatch list and are given the same priority. As the additional definition
    block consumes

    resources, however, its dispatch priority is calculated independently from the
    9.6, "Performance effect

    of virtual processors" on page 140.


    # ## 8.3.5 z/VM scheduling and the Linux timer patch


    The Linux kernel keeps track of using a timer that interrupts at a constant rate
    (System z

    at 100 Hz). The Linux kernel maintains a global variable called jiffy, which is
    updated. A

    variable is updated and queues are inspected for work to be done. In a guest

    running on z/VM this behavior inherits within the z/VM scheduler model. With the
    10 ms timer

    interrupt, CP classified a Linux virtual machine as a long-running task and assigns
    it to Q3.

    from distinguishing from running and idling guests.


    Current distributions allow you to switch the timer interrupts on and off demand.
    With the

    demand timer patch enabled, Linux virtual machines are dispatched less frequently
    when

    they are idling. This significantly reduces the number of Q3 servers competing
    for resources.

    Reducing the concurrent number of tasks competing for resources reduces the contention
    field

    by the shorter tasks. For more details about the solution 9.3, "The Linux timer

    modification" on page 133.


    Chapter 8. CPU resources and the z/VM scheduler 113'
  merge: -1
