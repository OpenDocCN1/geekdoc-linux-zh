    # 10.4 Maximizing the operation of disks


    In this chapter we give recommendations about how to tune disk devices for optimal
    performance.


    # 10.4.1 I/O recommendations for DASD


    In general, to optimize I/O performance, use more parallel when possible.


    # Use more disks


    I/O operations to a single physical disk are serialized. Parallel simultaneous
    I/O operations are faster than I/O operations to a single disk.'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# Reduce contention points


    Contention for I/O resources can occur at several points in the I/O path:


    +   - DASD contention


    Multiple virtual machines can experience DASD contention when simultaneously accessing
    data to the same DASD device.


    +   - Control unit contention


    Contention can occur when two or more DASD devices share a common control unit.


    +   - Channel contention


    Contention can occur during simultaneous access of the control unit or DASD devices
    sharing the same channel.


    # 10.4.2 I/O recommendations for SCSI


    When using SCSI disks, keep them equally alternating over FCP adapters and WWNPs.
    With DASD, reduce contention points and use disks that are located physically
    in different ranges of the storage. Do not use consecutive disk addresses, but
    alternate the clusters, local control units, wpwns, device adapters, and ranks.


    # 10.4.3 I/O recommendations for z/VM minidis and Minidisk cache


    When using minidis allocations for a Linux guest, the usual placement considerations
    apply as just would to a non-Linux disk. You should aim to strip the DASD allocation
    for the system to manage many channels, chpids, and hardware-level caching as
    possible. Spread the minidis to ensure that there is balance in terms of overall
    I/O rates to all the DASD volumes. Do not place disks on the same volume, and
    ensure Linux swap disks are not on DASD volumes shared by import, performance-sensitive
    Linux application minid. This system-level infrastructure volumes are best placed
    apart from Linux and other volumes, and should not share volumes with each other.


    Minidisk cache (MDC) is data in memory (DIM) through caching technique that can,
    according to the allocations and usage patterns, the amount of real I/O that is
    done to DASD very dramatically. Values of 50% less DASD I/O can be achieved with
    sufficient main storage and expanded storage resources for MDC. (Note that the
    use of expanded cache is far less effective than using main storage.) There may
    be some trade-off with increased paging, if the amounts devoted to MDC cause memory
    constraint to become significant. For a Linux minidis to benefit from MDC, you
    need to understand the impact on the number of writes that are being performed.
    There is a processor overhead when updating MDC when the read operations are carried
    out. Unless the Linux minidis is mainly read only, or has a large majority of
    reads compared to writes, for that disk, the potential benefit from saving real
    I/O may be wiped out by the processor overhead.


    > Note: In any event, do not use MDC for Linux swap disks.


    # 10.4.4 Performance capabilities of hardware options


    Enterprise Systems Connection, ESCON, and the Fibre Connection, FICON, provide
    I/O connectivity based on fiber optic technology. FICON is faster than ESCON;
    FICON is available in various versions that differ in bandwidth.


    Linux on IBM System z: Performance Measurement and Tuning'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'SCSI uses connections via switch and uses the Fibre Channel Protocol (FCP).


    # Comparison ECKD DASD versus SCSI over FCP


    Traditional z I/O uses the channel subsystem and issues CCWs to access XCXD, CKD,
    or F disks. In an operating system like Linux, this requires a transformation
    from the block-oriented block device to CCW chains. From the ECKD protocol they
    do not use the count and keys information. The channel subsystem transfers the
    CCWs to the storage subsystem. The storage subsystem works with standard SCSI
    disks, and the channel programs have formate back to fix block format. See Figure
    10-5.


    ![](img/a8398552a9cf58d3f3798c1dedb947c2_170_0.png)


    Figure 10-5 Disk access translation


    Information about performance of SCSI and ECKD disk may be obtained here:

    http://www.ibm.com/developerworks/linux/linux390/perf/tuning_res_dasd_ds8000_ECKD.html


    # Generations of storage subsystems


    The biggest changes in performance are observed when migrating from one generation
    of storage subsystem to the next generation (choosing a post model). The caches
    are usually bigger and the performance of the storage subsystem increases tremendously.


    > Note: Keep in mind that shorter run times have a side effect. With the increase
    of the throughput we also need more CPU to drive the I/Os. This is true when we
    migrate from an older storage server to a newer one or when we replace 1 or 2
    Gbit channels with 4 Gbit channels when we use SCSI disks instead of ECKD to get
    more throughput.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# 10.4.5 DASD block size


    The formatting dasdfmt size provides options to format DASD I/O with different
    hard block sizes. The dasdfmt size of 4096b shows the best results in IOZone benchmark
    throughput and free disk space after formatting the DASD device. Further tests
    showed that this statement is independent of the request size issued by the application.
    Even small application requests (that is, 512b) showed the best throughput with
    4096b dasdfmt size.


    # 10.4.6 IBM storage subsystems caching modes


    Caching modes are strategies used by the storage subsystem to optimize its cache
    hit rate.


    # ESS caching modes


    The Linux FCP driver uses the ESS subsystem operating mode normal cache replacement.
    The mode cannot be changed for FCP/SCSI. This enables the ESS to switch between
    the standard algorithms depending on the actual I/O pattern. This is the preferred
    setting, also for DASD ECKD disks.


    The subsystem operating mode can be set for every single DASD and lasts until
    the next reboot of the Linux system. After a reboot the mode reverts to the default.
    If you want to set the mode permanently for a specific DASD, include the mode
    switch in a Linux startup script (for example, adding the commands to the appropriate
    run scripts in `/etc/init.d/rc3.d`).


    Define the cache on the storage server. The following caching modes are supported
    by modern Enterprise Storage Servers (ESSs):


    +   Normal (normal cache replacement)

    We recommend this. It has been the default mode for some years, starting from
    SLES 8 and Red Hat RHEL. The cache is managed by the ESS standard algorithms.
    This is the default value for FCP/SCSI and the default value for ECKD DASD in
    Normal/SLES9 and Normal/SLES8, starting with Service Pack 3 + Security update
    for Linux kernel, Release 200401112.


    +   Bypass (bypass cache)

    Cache is not used. This is a special mode and should be used carefully. Performance
    is moderate for random I/O.


    +   In way (inhibit cache loading)

    Tracks added into cache are cached in the middle of the last recently used (LRU)
    list, which causes an early removal of the item from cache. This is a special
    mode that should be used carefully. Performance is good for random I/O.


    +   Sequential (sequential access)

    Tracks following the accessed track are added to the cache, and tracks preceding
    the access may be removed from the cache. This is the default value (access) for
    ECKD DASD drives in Normal/SUSE SLES7 and earlier versions of SLES 8. This results
    in poor performance when random I/O is done.


    +   Prestage (sequential prestage)

    Tracks following the accessed track are added to the cache in anticipation of
    a near term requirement, and preceding tracks are removed from the cache.'
