    # 7.4.3 The advantages of a VDISK device purpose


    The advantages of VDISK are that a large swap area can be defined with very little
    expense. The VDISK is not allocated until the Linux server starts.


    # Enabling an FBA VDISK


    Because VDISK acts as an FBA device to Linux, the DASD driver uses the FBA discipline
    by default for Novel SUSE and Red Hat distributions.


    Just as the ECKD swap device, the VDISK must be initialized with the `mkswap`
    command before swapon can use the device. The contents of the VDISK are not preserved
    after off of the virtual machine (the data on VDISK is volatile), `mkswap` command
    must be issued after you start the virtual machine.


    There are a few different ways to do this:


    +   - Modify your scripts in Linux system to run the `mkswap` command early in
    the boot process. The disk can be picked up automatically when Linux processes
    the /etc/fstab file. The `swapon` command can be issued manually if required.


    +   - First IPL CMS in the Linux guest, and Linux to use the VDISK as a swap device
    just as a `mkswap` command was already used. If you also need to use CMS to connect
    virtual channel-to-channels (CTCs), this may be a good option.


    +   - Use some virtual machine to link all the VDISKS so that CP retains them
    after the Linux guest is logged off. You still need a process to initialize the
    disks after a 2/VML IPL.'
