- img_proc: true
  md: 'We compared five ways to install a Linux system on z/VM:


    +   RDR + FTP + Router


    The virtual machine is connected through IUCV to a VM TCP/IP stack as the virtual
    router. It IPLs from the virtual reader and instructs the RPM packages through
    FTP.


    +   RDR + FTP


    Similar to the first method, but in this case, the Linux virtual machine has its
    own OSA device. This also avoids the cost in the VM TCP/IP virtual router.


    +   QuickStart


    A single (R/O) minidisk is used that holds the starter system and a copy of the
    RPM packages. The minidisk is IPLed to get the ramdisk (instead of IPL from virtual
    reader). The minidisk is then mounted in the ramdisk system to install the packages
    (which avoids the network traffic and FTP server cost).


    +   Breeder


    A separate Linux machine (the Breeder) is a R/W link to the target minidisks of
    the new system and makes a copy of a preinstalled system onto the target minidisks.
    After the file is copied, the personalization is done (host and IP address, for
    example). This method also avoids the unzipping of the RPM packages.


    +   GUI + FTP + Router


    SUSE SLES 10 includes a X-Windows version of YaST. Even though this is a different
    installer and kernel version, we include it in the measurements to show some of
    the differences between the install methods.


    > Note: The QuickStart install method should not be confused with Red Hat Kickstart.
    Kickstart automation by obtaining installation parameters from a configuration
    file. No user prompting is required. The biggest savings, if any, are in elapsed
    time for the install, and therefore, also in the memory usage. For SuSE, there
    are options as Auto-YaST and Alice, but the versions we have still lacked some
    of the install options that are essential for Linux on z.


    For each of the tests, we installed the same minimal set of packages, just enough
    to get a working Linux system. The 130 packages in this set are approximately
    140 MB of RPM files to be loaded. When unpacked during the install, this results
    in 200 MB of data on the root device.


    The Breeder install process is a home-grown install process that we used. Even
    though the numbers are not immediately applicable to your own installation, we
    believe it is a representative measurement for what people are doing with various
    cloning approaches and DDR copies of minidisks.'
  merge: -1
  pgno: 154
