  md: '# 3.4 IBM z/VM Performance Analysis Facility


    This product, used in the production of some performance reports in this book,
    is no longer available for ordering.


    IBM Performance Analysis Facility/VM (VPAF 5684-130) aids an analyst in problem
    determination, tuning, and trend analysis. It utilizes interactive graphics and
    statistical correlations to performance history produced by the following IBM
    products: VMPRF and the VM Performance Toolkit. VPAF also allows you to view data
    from multiple systems. This can be used to compare data from the same system before
    and after changes have been made.


    The interactive graphics show how performance varies over time. It also provides
    statistical information about these variables, including minimum, maximum, and
    average values for the time period. The program calculates the coefficient of
    correlation between each of these variables and a coefficient of variance representing
    the relative variability of the data parameters under investigation.


    The VPAF chart shown in Figure 3-6 was created to view the correlation of virtual
    I/O to swap I/O after benchmarking of swapping devices.


    ![](img/a8398552a9cf58d3f3798c1dedb947c2_36_0.png)


    # 3.5 IBM Tivoli OMEGAMON XE on z/VM and Linux


    Tivoli OMEGAMON XE on z/VM and Linux is one of several Tivoli Management Services
    called Tivoli Enterprise Monitoring Agents. These products use shared technology
    components to monitor your mainframe and distributed systems on a variety of platforms,
    and to provide workstation-based reports that you can use to track trends and
    understand troubleshoot problems.


    Tivoli OMEGAMON XE on z/VM and Linux, V4.1.0 is a powerful product that gives
    you the ability to view data from multiple systems on one easy-to-use, flexible
    interface. With this monitoring agent, you can view VM data obtained from the
    Performance Toolkit for VM (also called the Performance Toolkit). You can also
    display Linux on z/VM'
  merge: -1
