- img_proc: true
  md: 'To copy data into DCSS:


    +   1. Load the DCSS module:

    # modprobe dcssblk


    +   2. Create the node for the /dev directory structure (the major number is indicated
    in /proc/devices/)

    # mknod /dev/dcssblk0 b 252 0


    +   3. Load the DCSS created:

    # echo "USRIP" > /sys/devices/dcssblk/add


    +   4. Change the access mode from share to exclusive-writable:

    # echo 0 > /sys/devices/dcssblk/USRIP/shared


    +   5. Create an ext2 file system on /mnt:

    # mk2fs -b 4096 /dev/dcssblk0


    +   6. Mount the file system on /mnt:

    # mount /dev/dcssblk0 /mnt/


    +   7. Copy the contents of /usr to /mnt:

    # cp -a /usr/* /mnt


    +   8. Save the DCSS:

    # echo 1 > /sys/devices/dcssblk/USRIP/save


    Do not worry if you see a message on the z/VM console USRIP is currently busy,
    it will be saved when it becomes idle. The segment is saved when you mount the
    file system.


    +   9. Unmount /mnt file system:

    # unmount /mnt


    # Testing the DCSS


    To test the DCSS created, mount the xip2 file system:

    # mount -t ext2 -o,xip /dev/dcssblk0 /mnt


    To see whether file system is mounted correctly, check the /proc/mounts file systems,
    as shown in Example 6-6.


