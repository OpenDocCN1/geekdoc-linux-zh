    # ## 10.4.10 Linux disk I/O setup


    The throughput and the cost for disk I/O depend on whether we direct I/O to the
    disk or whether we use a file system. The prerequisite to use direct I/O is that
    the system is ready to take over some of the functions a file system fully utilizes.
    Experiments using DBMS showed promising results for throughput and costs bypassing
    the file system for both DASD and SCSI disks.


    # ## 10.4.11 Linux file systems


    Besides the traditional ext2 file system we have today, various journaling file
    systems are included in the Linux distribution. Since they all have pros and cons,
    we cannot recommend a special file system. The performance depends on many parameters.
    At most, it depends on the character of the files, the workloads, and the kind
    of access (sequential, random, mixed). Journaling file systems have an overhead
    compared to non-journaling file systems. But its use is strongly recommended since
    data loss occurs less probably and the recovery time is much shorter in the case
    of an error.


    The most used is the ext3 file system because of stability and because because
    it has been developed on top of ext2. Many factors, like applications and tools,
    influence the decision of which file system to use. Performance varies, so it
    may be worthy to try different file systems with important and time-critical workload.


    Another nice feature ext3 offers the seamless migration from ext2. Just issue
    a "tune2fs -j <partition>" and the file system is mountable as ext3. If it has
    hundreds of gigabytes of data existing in ext2 and you do not want to interrupt
    production, back up, reform, and restore the data, ext3 is available for you.


    Results that show the performance influence on different file systems are at:


    http://www.ibm.com/developerworks/linux390/perf/tuning_res_journaling.htmresults'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# 10.4.12 Read-ahead setup


    Several components of the environment are candidates for performing read aheads.
    This makes sense if data is required to read in sequential order or if the data
    entity is big (huge database entries):


    +   - Applications

    - LVM

    - Block device layer

    - ESS


    On the other hand, the performance of the low hit workloads with high I/O load
    suffers from read-ahead operations.


    Each of mentioned components issues read-ahead activities. This leads to more
    I/O activity than requested. All components assume that subsequent data units
    will be needed soon:


    +   - With each database read the application may try to fill its cache with pages
    for a set of data.

    - For each page, the logical volume manager fetches a set of pages for subsequent
    file blocks. The default of 1024 pages is much to high and results in a performance
    degradation for this workload (but, once changed, this could not be higher than
    255 pages).

    - The Linux block device layer may also add some pages to each read request. For
    each file block the ESS gets a set of subsequent disk blocks (several disks if
    the logical volume is stripped).


    The overhead for managing the caches and the thrashing of the caches is high with
    data that is most likely needed. The big amount of physical disk read requests
    together with the physical limitations in terms of seek and latency times limited
    the speed of the database accesses in our test. Lowering the default settings
    of read ahead allows you to keep the data transfer path free for the requested
    data.'
  merge: -1
