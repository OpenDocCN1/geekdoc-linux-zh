    # 5.3.2 Conclusions for sizing z/VM Linux guests


    +   The Linux memory model has profound implications for Linux guests running
    under z/VM:

    * z/VM memory is a shared resource.


    Although aggressive caching reduces the likelihood of disk I/O in favor of memory
    access, the cost of caching must be considered: Cached pages in a Linux guest
    reduce the number of z/VM pages available to other z/VM guests.


    +   * A large virtual memory address space requires more kernel memory for Linux
    memory management.


    When sizing the memory requirements for a Linux guest, choose the smallest memory
    footprint that has a minimal effect on performance. Otherwise, all the remaining
    memory in the long run will be used for buffering and caching.


    > Note: To determine the smallest memory footprint required, decrease the size
    of the Linux virtual machine to the point where swapping begins to occur under
    normal load conditions. At that point, slightly increase the virtual machine size
    to account for some additional load.'
