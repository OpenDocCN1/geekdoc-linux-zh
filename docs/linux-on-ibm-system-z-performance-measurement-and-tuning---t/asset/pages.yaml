    ## query srm

    The cp query command displays some of the current z/VM system tuning parameters.
    Each of these parameters has a default setting that is appropriate for most environments.
    Later chapters in this book discuss potential adjustments to the defaults. The
    System Resource Manager (srm) parameters contained in this display include:


    +   - iabas - interactive bias, used to favor short transactions

    - idbuf - controls z/VM''s tolerance to induce paging

    - storbuf - can be used to encourage z/VM to oversee main memory

    - dispatching minor timeslice - the length of time that a single user holds onto
    a processor


