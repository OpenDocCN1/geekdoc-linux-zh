  md: '# Emergency scanning


    Emergency scanning is an indicator that the system is critically short of storage
    for some reason. When short of storage pages, the system begins a three-level
    scanning process: scan 1, scan 2, and then the most serious, emergency scanning.
    The system is being reduced to extreme measures while hunting for main storage
    pages, and the situation is so severe that it will steal them from any user. Ultimately,
    whether they are inactive, queue, or active, it eventually steals pages from shared
    segments and the CP system process. In short, the system is in a critical mess,
    storage wise. This also covers stealing pages from the monitor and MONCSS, two
    critical performance-related entities, and in this event, performance monitoring
    and reporting may be compromised or interrupted.


    # Below 2 GB line contrast and scenarios


    VM has enjoyed a long and distinguished history since the earliest versions were
    released over 40 years ago. In the world of Virtualization, it is the most functional,
    customizable operating system to be found on any platform. The latest Version
    5 enjoy reliability and stability other platforms can only remotely aspire to


    A major step in this evolution took place in v3.0, which introduced the initial
    64-bit support. The next milestone in this regard was v5.2.0, which added a number
    of major enhancements to 64-bit support.


    Prior to this, some of VM 64-bit releases were still operating in 31-bit mode,
    which implies an upper address of 2 GB. This could cause runtime issues when running
    Linux guests, for when they were performing I/O. Linux has the unfortunate tendency
    to grab and hold on all of the memory allocated to I/O buffer and cache. Linux
    guests, where a large part of it is merged for internal I/O buffer and cache,
    are now common on many systems. To perform real I/O in this scenario prior to
    VM v5.2.0, the system needed to use areas below the requesting virtual 2 GB line,
    and, as these were already in use by the virtual machine itself, the system had
    to resort to emergency scanning to find the pages that it requires to complete
    the I/O task.


    Figure-1 on 209 shows an example of a system in emergency scanning mode. The system
    was running zVM v4.4.0. Some experiments were carried out by using a different
    value for test idle, which is preset at 300 milliseconds within VM. Note that
    this is not a standard release function, and it was used here to understand the
    nature of the problems the system encountered, and to reduce their impact. For
    various versions, the system owner was unable to move to zVM v5, which at the
    time would have removed many of the reasons for ESCN being observed. But could
    we tune the system as it stood? Testing was carried out on the first of February,
    and with test idle reduced to 10 ms, the queue depth became much more effective,
    and the emergency scanning stopped. You can see the effects on the non transaction
    time (NT), which is used as a function of response time for many systems. Here
    we use for a different purpose, to show that queue depth is taking place, resulting
    in shorter sections. After the change was made to the system, NT-T performance
    improves. On average, this goes down to typical 1 second or less. The throughput
    of the system was much improved. However, some of this improvement is offset by
    the known beneficial effects of having idle set at 300 ms. This enables resource
    cycles to be saved by not dropping a virtual machine that becomes active in the
    test idle period. The system does not have to go through the process of rebuilding
    a virtual machine through all the various stages necessary to enable it to dispatch.


    208 Linux on IBM System z: Performance Measurement and Tuning'
