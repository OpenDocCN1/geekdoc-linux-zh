  md: '# 6.1 Memory tuning recommendations


    In this chapter we consider how to tune memory for Linux guests. Storage recommendations
    are very useful in virtualized environments, especially when the Hipervisor can
    overcommit resources. z/VM is the most functionally capable software hypervisor
    system in existence, and fine tuning in any of the key resource areas, as is recommended
    for best overall system performance.


    We now consider how to reduce system overhead, and then review functions introduced
    in Linux to optimize memory resources.


    # 6.1.1 Reduce operational machine size


    The memory footprint of servers should be minimized. There are several opportunities
    for reducing the size of operational memory:


    +   * Eliminate unneeded processes.

    * This sound intuitive, but it needs to be done. Processes such as cron should
    be eliminated when they do not perform functions.

    * Divide large servers into smaller specialized servers.

    * Service machines can be tuned explicitly to perform a function. Linux servers
    running many applications do not have these controls and can be difficult to manage.
    Separating functions into Linux guests can be done. This is not a recommendation
    to separate each and every server, since a separated guest needs a certain amount
    of memory to run its own Linux operating system.

    * Reduce machine size.

    * Minimize the virtual machine size to the lowest possible amount. Choosing this
    requires research and testing. Recommendations regarding the size of the Linux
    guest can be found in 5.3, "Sizing of virtual memory" on page 50.

    * Use a virtual disk for a swap device.

    * Using a VDISK with the DIAGNOSE access method as a swap device reduces the penalty
    of swapping. This recommendation is applicable only if you have a large amount
    of memory available on System z. Using virtual disk for swap, reduce the I/O generated
    by swap on real device, but at the same time the total amount of used storage.
    This tip is useful when a high paging rate comes from Linux and z/VM. In this
    situation is possible to experience effects of double paging (z/VM page guest
    storage swapped out by Linux) and use of VDISK as a swap device can help to reduce
    it.


    # 6.1.2 Reduce infrastructure storage costs


    Several opportunities for reducing infrastructure storage costs:


    +   * Use the DIAGNOSE driver for the DASD and MDC record cache.

    * Using a record-level minidisk reduces the amount of storage required for MDC.
    This requires the DIAGNOSE driver. For more information refer to IBM Linux on
    System z - Device Drivers, Features, and Commands, SC33-8289.


    60 Linux on IBM System z: Performance Measurement and Tuning'
