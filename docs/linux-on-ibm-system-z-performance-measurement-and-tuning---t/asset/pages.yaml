  md: '# OSA parameter: buffer_count


    The qeth device driver assigns 16 buffers for inbound traffic to qeth group device.
    Depending on the amount of available storage and amount of traffic, you can assign
    from 8 to 128 buffers.


    To understand Linux memory consumption (in case you are to modify this parameter),
    consider Linux memory usage for inbound data buffers for the devices (number of
    buffers) x (buffer size).


    The buffer size is equivalent to the frame size, which is:


    +   * For an OSA-Express CHPID in QDIO mode: 64 KB

    * For Hiphockets: depending on the Hiphockets CHPID definition, 16 KB, 24 KB,
    40 KB, or 64 KB


    Set the buffer_count attribute to the number of buffers that you want to assign.
    Example 11-6 shows the command used to modify the buffer_count parameter.


    # Example 11-6 Modify buffer_count parameter


    ```

    # echo <number> > /sys/bus/ccwgroup/drivers/qeth/<device_id>/buffer_count

    ```


    > Attention: The device must be offline while you specify the number of inbound
    buffers.


    # OSA parameter: checksuming


    Checksuming can be performed via software (TCP/IP stack) or via hardware (if the
    OSA card support it). To check how the checksum is performed, issue a command
    where device 0.0.c200 is assumed to be used, as shown in the Example 11-7.


    # Example 11-7 Display checksuming on device


    ```

    # cat /sys/bus/ccwgroup/drivers/qeth/0.0.c200/checksuming

    ```


    To change the checksuming parameter simply add the value for checksuming file
    with the echo command. Possible value are:


    +   * hw_checksuming: Checksuming is performed by the OSA adapter.

    * sw_checksuming: Checksuming is performed by the TCP/IP stack.

    * no_checksuming: Checksuming is suppressed.


    > Attention: The device must be offline while you change the checksuming parameter.'
