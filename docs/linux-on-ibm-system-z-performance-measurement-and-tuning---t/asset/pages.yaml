    # 3.10 Capacity planning


    Successful capacity planning involves projecting future needs based on past trends
    and business plans for growth. Although hardware costs continue to decline, software
    and personnel costs are rising. Since software and personnel costs are tied to
    hardware capacity, capacity planning is still important.


    Capacity planners judge when to buy more hardware based on current throughput
    and performance, plus growth expectations for the IT workload. Performance is
    a key indicator when predicting the time for a processor upgrade. High processor
    utilization is desirable from a clear viewpoint, but only so long as performance
    does not suffer.


    Capacity planners need tools more sophisticated than rules-of-thumb. Good modeling
    software enables the planner and her IT department to plan hardware upgrades before
    poor performance becomes a business inhibitor. Modeling tools available from IBM
    to IT departments with effective capacity planning for System environments include
    the z/VM Capacity Planner and the Tivoli Performance Modeler. A System that has
    only z/VM and Linux images can be modeled by the IBM z/VM Planner for Linux Guests
    on IBM System z Processors (IBM employees and authorized IBM Partners can use
    the tool with their customers). A system process that is running a combination
    of z/VM, Linux, and zOS images can be modeled using a combination of the IBM z/VM
    Planner for Linux Guests on IBM System z Processors and Tivoli Performance Modeler.


    # IBM z/VM Planner for Linux Guests on IBM System z Processors


    The z/VM Planner for Linux Guests on IBM System z Processors (z/VM-Planner) is
    a capacity-based productivity tool that runs under MicroSoft™™. It is designed
    to provide capacity planning insight for IBM processors running various Linux
    workload environments as guests under VM. Input the z/VM guest definitions and
    capacity requirements for each intended Linux guest. The total guest capacity
    requirement is calculated on the guest definitions and, since it is probable that
    all guests do not have peak utilization at the same time, a user-specified complementary
    peak percentage is used to calculate the true combined capacity requirements of
    the z/VM guests being sized. The tool also models z/VM processor requirements
    when merging new guests into existing VM images. The resulting guest capacity
    requirement is combined with that VM to support the entire complement of guests.'
