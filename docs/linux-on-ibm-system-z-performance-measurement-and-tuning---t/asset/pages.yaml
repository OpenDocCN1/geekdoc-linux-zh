  md: '# Effect of virtual processors

    on on CPU cost


    ![](img/a8398552a9cf58d3f3798c1dedb947c2_160_0.png)


    Figure 9-8 Measuring the cost of adding virtual processors


    In Figure 9-8 we see that when the number of virtual processors matches the number
    of real processors, the average transaction cost decreases slightly. More importantly,
    the average transaction rate increases significantly. Note, however, that as the
    number of virtual processors is increased beyond the number of real processors
    (two in this case), the overall transaction rate decreases, and the cost per transaction
    increases. This is due to the additional scheduling overhead incurred by CPU.


    When a Linux guest runs a processor-constrained workload, we recommend:


    +   - Defining the same number of virtual processors to the guest virtual machine
    as the number of real processors available to the LPAR.


    +   - Never defining more virtual processors to the guest virtual machine than
    the number of real processors available to the LPAR.'
