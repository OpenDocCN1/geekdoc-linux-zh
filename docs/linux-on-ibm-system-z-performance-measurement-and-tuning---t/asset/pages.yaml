  md: '# 9.2 The effect of idle servers on performance


    In a shared resource environment, there is no room for unnecessary processes.
    Servers that run cron jobs for historical reasons should be redesigned.


    Under z/VM, as a shared resource environment, it is not optimal to wake up servers
    to make sure the servers are active, or to monitor them to query current activity.
    In this environment, the virtual machines are tailored for optimal performance,
    and having unneeded interrupts or the work being performed detracts from the resources
    available for productive work.


    In a virtual environment, one of the most expensive uses of resources is waking
    up an idle server simply to perform a trivial task.


    Pinging a server to see whether it is alive keeps the server active. Also, simple
    checks to confirm whether particular processes are active can cause a large, cumulative
    drain on CPU. Both of these practices use resources that are likely better utilized
    by other servers performing real work. This type of expense should always monitored
    and minimized.


    These are two of the more common mistakes made in a virtual server infrastructure.
    It is generally not necessary to ping applications to ensure that they are alive
    or to monitor the performance of the virtual servers. When idle, the servers would
    normally not take significant amounts of either storage or processor resources.
    But when the applications are pinged or the servers are monitored, the server
    must have resident storage to provide the appropriate positive responses. A far
    better approach in this virtual environment for monitoring is to utilize the existing
    and mostly free (in terms of resource requirements) VM monitor.'
  merge: -1
