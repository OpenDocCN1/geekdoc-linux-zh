  md: '# Preface


    This IBM® Redbooks publication discusses performance measurement and tuning for
    Linux® for System z™. It is intended to help system administrators responsible
    for deploying Linux for System z understand the factors that influence system
    performance when running Linux as a z/VM guest.


    This book starts by reviewing some of the basics in a well-running Linux for System
    z. An overview of the monitoring tools that are available and were used throughout
    this book is also provided.


    Additionally, performance measurement and tuning at both the z/VM and the Linux
    level is considered. Some tuning recommendations are offered in this book as well.
    Measurements are provided to help illustrate what effect tuning controls have
    on overall performance.


    The system used in the writing of this book is IBM z9™ VM Version 5.3 in the LPAR.
    The Linux distribution used is SUSE Linux Enterprise Server 10. The examples in
    this book use the Linux kernel as shipped by the distributor.


    The z9 is configured for:


    | Main storage | 4 GB |

    | Expanded storage | 1 GB |

    | Minidisk cache (MDC) | 250 MB |

    | Total LPARs | 45 |

    | Processors | Four shared central processors (CPs) defined as an uncapped logical
    partition (LPAR) |


    The direct access storage devices (DAS) used in producing this IBM Redbooks publication
    are 2105 Enterprise Storage Server® (Shark) storage units.


    The intent of this book is to provide guidance on measuring and optimizing performance
    using an existing zSeries configuration. The examples are intended to demonstrate
    how to make effective use of your zSeries investment. The workloads were chosen
    to exercise a specific subsystem. Any measurements provided should not be construed
    as benchmarks.


    # The team that wrote this book


    This book was produced by a team of specialists from around the world at the International
    Technical Support Organization, Poughkeepsie Center.


    **Lydia Parziale** is a Project Leader for the ITSO team in Poughkeepsie, New
    York, with domestic and international experience in technology management including
    software development, project leadership, and strategic planning. Her areas of
    expertise include e-business development and database management technologies.
    Lydia is a Certified Specialist with an MBA in Technology Management and has been
    employed by IBM for 24 years in various technology areas.'
  merge: -1
  pgno: 12
