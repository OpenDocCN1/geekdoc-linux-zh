    machines. Test scenarios that employ multiple mail protocols and multiple simulated
    de-tailed mail clients can also be used to observe server response under heavy
    load. Although originally intended to test mail server performance, Mstone has
    features that make it suitable for overall system performance analysis. The Mstone
    configuration used in this book is shown in Figure C-1.


