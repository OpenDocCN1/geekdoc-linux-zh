- img_proc: true
  md: 'Each Linux system runs in its own virtual machine. The characteristics of virtual
    machine (memory size, number of CPUs) define the hardware that Linux sees. The
    allocation and tuning controls in z/VM specify how real hardware resources are
    allocated to the virtual machine.


    # ## 1.1.1 Virtualization of the CPU


    CPU virtualization is accomplished by timesharing. What this means is each Linux
    guest, in turn, gains access to a CPU for a period of time. After that time slice
    is completed, the CPU is free to run the work of the other Linux system. This
    cycle continues over time, with each system being serviced as it generates and
    more work.


    The cost of running both of these workloads on discrete servers is twice the cost
    for only one of them, but with System z, sharing the resources effectively, we
    run both workloads for the period of one. Real-world business applications in
    practice run far less than 50% of the time, so that allows us to run even more
    of these workloads on System z. The workload from these businesses is likely also
    not in a single, sustained burst per day, but multiple shorts over the entire
    day. The chances of spreading the total CPU requirements over the full day become
    better.


    Because the z/VM is specifically defined to timesharing, z/VM can switch between
    many system tasks in a very cost-effective manner. The evolution of this role
    may begin decades, and the z/VM we see today contains all the refinement and high
    levels of reliability expected in the modern world of information technology.


    # ## 1.1.2 Virtualization of memory


    In addition to the CPU requirements, the workload also has memory requirements.
    The amount of memory needed to contain the Linux system and allow it to run is
    the working set. Virtualization of memory on z/VM is done by a technique called
    paging. By placing the memory in a central shared pool, the Linux systems take
    turns using the main storage (also known as memory) of the machine. Paging volumes
    residing on disks, and expanded storage is used to hold the pages of the inactive
    Linux systems so that they can be brought in by z/VM when needed.


    The challenge for z/VM is also to bring in the working set of a Linux system in
    the shortest possible time when Linux has work to do, and fortunately it has the
    best architecture available, in terms of expanded storage, and advanced I/O subsystem,
    to be able to deliver the required results.


    # ## 1.1.3 Virtualization of the network


    When applications and servers want to connect to network resources or to other
    servers, the necessary resources must be put and into place. All the network resources,
    such as IP addresses, network adapters, LANs, and bandwidth management, can be
    virtualized in z/VM. With virtualization, network elements can be pooled and shared
    to make communication across the IT infrastructure factor, more efficient, cost-effective,
    secure, flexible, and available. Outages due to network device failure or software
    failure in the device are eliminated.


    Virtual LAN (VLAN) is used to provide a network infrastructure inside z/VM. VLAN
    provides the isolation to ensure that data would not be interspersed flowing across
    the shared network. Guests in the same VLAN communicate with each other directly,
    without the need for any routing outside of the box, or any intermediate hardware,
    which would'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'cause much latency. In fact, guests in the same VLAN can talk to each other
    with cross-memory speed.


    # ## 1.1.4 Levels of virtualization


    The virtual machine environment provided by zVM to run the Linux system is not
    the only virtualization that is taking place. The Linux system itself runs multiple
    processes, and the operating system allocates resources to each of these processes
    to allow them to get their work done. Some of the processes running on Linux multiple
    tasks can allocate their resources to those tasks. If the z/VM system runs in
    a logical partition (LPAR), which again uses the timesparing principle, z/VM also
    uses only part of the real hardware.


    These layers of virtualization make it hard for an operating system to find the
    best way to use the allocated resources. In many cases, tuning controls are available
    to solve problems, and allow the entire system to run very efficiently. When the
    operating system was not originally designed to run in a shared environment, some
    of the controls turned out to have surprisingly negative effects.


    # ## 1.1.5 Benefits of virtualization


    As IT systems are getting larger and more complicated, the cost of managing these
    systems is growing faster than the cost of new hardware for them. The primary
    concern of management is to decrease the costs and increase the revenue in the
    meanwhile. Virtualization can contribute to the overall management by lowering
    the cost, compared to the existing infrastructure, and by reducing its complexity
    and improving its flexibility to quickly respond to the business needs.


    More and more users realize that they can get the following benefits from virtualization
    by consolidating existing low-utility and unstable servers from their production
    and development environment to one or a small number of System boxes:


    +   * Higher resource utilization

    Running as z/VM, several Linux servers can share the physical resources of underlying
    box, resulting in higher levels of sustained resource utilization, comfortable
    even when approaching 100% for CPU. This is especially relevant for variable workloads
    whose average needs are much less than an entire dedicated resources and do not
    peak at the same time. Two workloads, which are only running in different halves
    of the day, are a very good example.


    +   * More flexibility

    Virtualization provides Linux guests with great flexibility. Linux servers can
    dynamically reconfigure resources without having to stop all of the running applications.


    +   * Improved security and guest isolation

    Each virtual machine on z/VM can be completely isolated from the control program
    (CP) and the other virtual machines. If one virtual machine crashes, none of the
    others is affected. Data is prevented from leaking across virtual machines and
    applications can communicate only over configured network connections.


    +   * Higher availability and scalability

    Linux servers running on z/VM can improve their availability due to the reliability
    of underlying mainframes, which have refined hardware and software architectures
    that have evolved over four decades. Physical resources can be removed, upgraded,
    or changed without affecting their users. z/VM enables its Linux guests to be
    easily scaled-up or scaled-out to accommodate ever-changing workload demands.'
