  md: '# IBM Trade Performance Benchmark sample


    The IBM Trade Performance Benchmark sample, also known as the Trade 6 application,
    is a sample WebSphere end-to-end benchmark and performance application. This Trade
    benchmark has been designed and developed to cover WebSphere''s programming model.
    This application provides a real-world workload, driving WebSphere''s implementation
    of J2EE 14 and Web services, including key WebSphere performance components and
    features.


    The Trade 6 application simulates a stock trading application that allows you
    to buy and sell stock, check your portfolio, register as a new user, and so on.
    In this IBM Redbooks publication, we use Trade 6 to generate workloads that are
    analyzed in their impact on system performance. The IBM Trade Performance Benchmark
    sample for WebSphere Application Service is available to download for free at:


    ```

    https://www14.software.ibm.com/webapp/imw/web/prelogin.do?source=trade6

    ```


    The three main Trade 6 components are listed below and in Figure A-1:


    +   - The IBM HTTP server

    - The HTTP server accepts client requests and delivers static content (HTML pages,
    images and styles). Dynamic requests are forwarded to the WebSphere Application
    Server through a server plug-in.

    - The WebSphere Application Server

    - The WebSphere Application Server creates dynamic content using JavaServer™ (JSPs)
    and Java Servlets. Pages are generated from data extracted from a DB2 database.
    All Trade-versions are WebSphere-version dependent, so Trade 6 only works with
    WebSphere Application Server V6.

    - The DB2 database

    - The DB2 database contains relational tables regarding simulated customer accounts
    and stock transactions. We used DB2 LUW v8.2.


    ![](img/a8398552a9cf58d3f3798c1dedb947c2_209_0.png)


    Figure A-1 Components of a typical Trade 6 deployment'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# Trade 6 Deployment options


    Several options are available when deploying Trade 6 on Linux for System z:


    +   * All components can run in a single Linux guest. This is referred to as a
    single-tier deployment.

    * Each component can run in a dedicated Linux guest. We refer to this as a three-tier
    deployment.


    We chose a three-tier deployment for this book, where we run the IBM HTTP server,
    WebSphere Application Server, and DB2 in their own Linux guests. Our deployment
    choice is depicted in Figure A-2.


    ![](img/a8398552a9cf58d3f3798c1dedb947c2_210_0.png)


    Figure A-2 Three-tier deployment


    Using a three-tier deployment enabled us to adjust the virtual machine size of
    each Linux guest more accurately, based on the task that particular guest performs.
    In addition, when measuring utilization, the three-tier deployment option allows
    us to attribute specific resource usage to a specific task.'
