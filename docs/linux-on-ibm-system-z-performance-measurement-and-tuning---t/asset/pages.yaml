    # # Fixes with VM releases that have removed much of the below 2 GB line constraint


    The zVM v5.2 release made considerable changes that allowed large real storage
    sizes to be fully explored for the first time. The key to these changes was the
    introduction of System Execution Space (SXS). CP runs in an address space of its
    own, which can be up to 2 GB in size. Before this release, SXS was identity mapped,
    and all logical addresses exactly corresponded to real addresses. When referencing
    a guest page, CP now uses mapping to a logical page in SXS. Most of the CP code
    can continue to run using 31-bit addressability, but most importantly, this removes
    the requirement to move pages below the 2 GB line, so CP code and most CP data
    structures can now be positioned above the 2 GB line. In this release, the maximum
    storage size for VM was 128 GB.


    zVM v5.3 introduced important enhancements to CP storage management. Page management
    blocks can now be positioned above the 2 GB line. Contiguous frame management
    has been further refined, and fast available list searching was introduced in
    this release. The maximum storage size for VM is now 256 GB. For more discussion
    and related performance test sees:


    ```

    http://www.ibm.com/perf/reports/zvm/html/530stor.html

    ```'
