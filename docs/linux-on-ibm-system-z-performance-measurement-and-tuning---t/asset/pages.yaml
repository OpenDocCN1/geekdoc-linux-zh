  md: '# 6.2.2 Maximum in-use virtual storage increased


    Before any page can be referenced in a given 1-megabyte segment of virtual storage,
    CP has to create a mapping structure for it called PaGe Management Block (PGMBK),
    which is 8 KB in size. Each PGMBK is pageable but must reside in real storage
    whenever one or more of the 256 pages in the 1 MB virtual storage segment it resides
    in real storage.


    With zVM 5.3 this page management block can reside above the 2 GB line so that
    zVM can support much larger amounts of in-use virtual storage.


    You can see that zVM 5.3 is not using PGMBK under the 2 GB line by looking at
    DSPACESH report provided by FCX123 panels in Performance Toolkit. Figure 6-2 shows
