    # 11.2.1 Qeth driver for OSA-Express (QDIO)


    Queued I/O is a highly efficient data transfer mechanism that satisfies the increasing
    volume of TCP/IP applications and bandwidth demands. It reduces system overhead
    and provides throughput. The components that make up QDIO are:


    +   - Direct Memory Access

    - Priority queuing

    - Dynamic OSA address table update

    - LPAR-to-LPAR communication

    - IP assist functions'
