  md: '![](img/a8398552a9cf58d3f3798c1dedb947c2_13_0.png)


    **Figure 1** The team that wrote this book: (from left) Mario Held, Karen Reed,
    Lester Peckover, Li Ma (Maria), Massimiliano Belardi (Max)


    **Massimiliano Belardi** is an Advisory IT Architect supporting IBM System & Technology
    Group in Italy. He joined IBM in 1998 and his areas of expertise include design
    anding support for System z and Linux-based architecture. He is strongly committed
    to supporting the growth of the System platform and Linux Solutions adoption.


    **Mario Held** is a Performance Analyst for the Linux on System z - System & Performance
    Evaluation Development in the IBM development lab in Boelingen, Germany, 2000.
    His area of expertise is the general performance of Linux on System z, and he
    specializes in gcc and glibc libr. He presents worldwide on all areas of performance.
    Between 1997 and 2000 he was a System Developer. For six years he an application
    programmer on the mainframe with a health insurance company in Germany.


    **Li Ya Ma** has been an IT Specialist for the IBM ATS team of China since 2005.
    She has domestic and international experience in performance benchmark on both
    Linux on z and WebSphere® Application Server on z/OS. She gives workshops and
    presentations, writes articles on the Linux on System z, from the basics to performance
    tuning. She is committed to supporting new growth of the System z and Linux solutions
    adoption in China.


    **Lester Peckover** is an Infrastructure, Enterprise Performance, and Capacity
    Architect in the United Kingdom. He has 32 years of experience in the IT field,
    during time covering IBM System xtm and System ntm, mainly specializing in System
    z; and, since 2000, Linux running on the mainframe. He has also worked on a number
    of other system platforms in performance and many other areas, specialising in
    visualisation. He has been with IBM for 18 years, and is a Senior IT Specialist.
    He started his academic training with a bachelor''s honors in Biochemistry, and
    then switched to research-based computational chemistry for his masters and doctor.
    His areas of expertise include performance analysis and modelling. He helped the
    tool now known as IBM Performance Tool Kit in its, first decade of development,
    as well as other IBM VM product programs and tools from other vendors. He has
    also taught and presented extensively on performance and capacity, plus various
    other systems management topics, in many countries across the world.


    **Karen Reed** is an IT Specialist supporting IBM Tivoli software in San Francisco,
    California. She has over ten years of experience in systems performance monitoring
    and automation software for System z and distributed systems.


    xii Linux on IBM System z: Performance Measurement and Tuning'
