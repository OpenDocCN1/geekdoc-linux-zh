    # 6.5 Cooperative memory management (CMM)


    The CMM is one of the solutions that allows an external entity, such as the z/VM
    resource manager (VRMM) or a third-party external monitor, to reduce the storage
    size of a Linux guest. The Linux module cmm has to be loaded to make the collaboration
    with the external monitor possible. The external monitors monitor the Linux guests
    and how these guests requests. Through the interfaces created with the cmm module,
    the Linux guest receives information about how much free memory should be available.
    When not free memory is available, the Linux guest starts to clear the cache,
    or other memory until it meets the threshold requirement. Under pressure, the
    Linux guest may start swapping.


    In the documentation, in cases CMM is referred to as CMM1.

    More details can be found in IBM Linux on System z - Device Drivers, Features,
    and Commands, SC33-8289-03:


    http://download.bolder.ibm.com/ibmd1/pub/software/dw/linux390/docu/126cdd03.pdf


    Or on the z/VM Web pages found at:


    http://www.ibm.com/sysman/vmrmcmm.html


    # Prerequisites to use CMM


    The module "cmm" has to be loaded within the involved Linux guests. VMRMSVM has
    to be well configured and started in z/VM.'
  merge: -1
  pgno: 92
- img_proc: true
  md: '# Setup of CMM


    To use z/VM to use CMM we created a VM Resource Manager (VMRM) configuration file
    [VMRM CONFIG A1] on the VMRSVM user ID that contained the following statement:


    ```

    NOTIFY MEMORY LNX001 LNX002 LNX003 LNX004 LNX005

    ```


    Or:


    ```

    NOTIFY MEMORY LNX00*

    ```


    We also added this statement to get VMRSVM messages:


    ```

    ADMIN MSUSERVM MAINT

    ```


    This statement VMRSVM messages to be sent to the MAINT user ID.


    The asterisk is a wild card. After creating the configuration file on the VMRSVM
    A-disk we logged off VMRSVM and issued a xautolog VMRSVM from user MINT to start
    the VMRSVM server.


    To stop the VMRSVM server, log on to VMRSVM and issue the command HMONITOR (or
    FORCE VMRSVM as user MINT)


    On the Linux servers we load the CMM kernel extension with the modprobe command
    as follows:


    ```

    modprobe cmm

    ```


    # 6.6 Collaborative memory management assistance (CMMA)


    Linux guests and the z/VM V5.3 control program (CP) exchange information regarding
    memory usage. This exchange of information allows both the guests and the z/VM
    host to optimize their management of memory, in the following ways:


    +   CP knows when a Linux application requests storage and can select pages for
    removal at a higher priority or reclaim the page frames without the overhead of
    paging-out their data content to extended storage or disk.


    +   CP recognizes clean disk pages, the contents of Linux is to reconstruct, allowing
    CP to bypass paging-out the data contents when reclaiming the backing frames for
    these pages. If Linux or it refers to the deferred disk, Page has been cleared
    and can read the contents from disk or reconstruct it.


    +   In conjunction with CMM, Page-Management Assist (HPMA) allows the machine
    to supply fresh backing page frames for guest memory when the guest requests a
    previously discarded page, eliminating the need for the z/VM Hypervisor to intercept
    and resolve these guest faults.


    For more details:


    ```

    http://www-01.ibm.com/common/ssi/cgi-bin/ssialias?infype=an&subtype=ca&appnam
    eGPAATMtmid-897/ENS207-019

    ```


    If CMM is enabled, the page flags are flagged differently compared to a Linux
    system not using this feature. When the page cache fills, each page gets flagged
    as stable or volatile. This starts with the boot process. Volatile flagged pages
    can get stolen by z/VM and provided to other guests. This is not the case for
    the pages that are flagged stable More'
