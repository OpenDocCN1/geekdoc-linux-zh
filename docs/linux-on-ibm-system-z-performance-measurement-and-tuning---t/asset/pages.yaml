  md: '# 6.3.2 Defining a skeletal system data file for the Linux NSS


    We examine the generated System.map file (shown in Figure 6-5 on page 66) to identify
    the zero page, shared kernel code, and non-shared kernel data regions in the constructed
    kernel.

    See Example 6-3.


    Example 6-3 Portions of the System.map to determine NSS configuration


    ```

    00000000 A _text

    00000298 T _iplstart

    00000880 T startup

    00010000 T _tstart

    00010400 T _pstart

    00011000 T _s30_readinfo_sccb

    0012080 T _pend


    00100000 T _text

    00100100 T _rest_init

    00100148 T _init


    004ef190 r _param_maxchannels

    004ef1b8 _param_format

    004ef1e0 R _stop_param

    00500000 D _ashared

    00500000 D _init_map

    00500310 D _init_task


    005ca000 d _per_cpu_flow_flush_tasklets

    005ca010 d _per_cpu_rt_cache_state

    005ca140 d _per_cpu_icmp_socket

    005ca480 A _per_cpu_cmd

    005cb000 A _bss_start

    005cb000 B _init_end

    005cb000 B _system_state

    005cb008 B _saved_command_line

    005cb010 B _per_cpu_offset

    ```


    We find the page range for each region based on the symbols that indicate the
    start and end of the region.



    > Note: The address we use to locate the end of the region is one byte past the
    end of the region. To subtract one byte in the calculation. Because pages are
    4 K in size, we calculate the page range by dropping the last three nibbles from
    the address.


    From the System.map file, we identify:


    +   * The region from _text to _pend is the zero page area. Using addresses 00000000
    and 00012080, we find that the page range is 0-12.

    * The region from _start to the symbol immediately before _stop is the shared
    kernel code. Using addresses 00010000 and 0004ef1e0, we find that the page range
    is 100-4ef.

    * The region from _ashared to _bss_start is the non-shared kernel data. Using
    addresses 00500000 and 0005cb000, we find that the page range is 500-5cb.


    From these values, we construct the following DEFSYS command:


    ```

    DEFSYS SLES10 0-12 EW 100-4ef SR 500-5ca EW MINSIZE=24M MACHMODE=XA,ESA

    ```'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'Parameters to the command:


    +   - SLES10

    nThe name to identify the NSS on IPL. By using different NSS names, you can have
    different versions of the kernel saved as NSS on a VM system. The IPL command
    identifies the NSS to be used by the virtual machine. Use this ability with care.
    Sharing is most efficient (both in memory and system administration) when many
    virtual machines share the same NSS.


    +   - 0-12 EW

    The range for the zero page region. This region is copied to each virtual machine
    in exclusive write mode (EW).


    +   - 100-4EF SR

    The range for the shared kernel code. Each virtual machine uses a shared, read-only
    copy (SR).


    +   - 500-5CA EW

    The range for the private kernel data. Each virtual machine uses an exclusive
    write copy.


    +   - MINSIZE=24M

    The minimum virtual machine size to use the NSS (only to prevent an IPL in a virtual
    machine where it will not fit anyway).


    +   - MACHMODE XA,ESA

    The NSS can be IPLed in an XA or Enterprise Systems Architecture (ESA) virtual
    machine.


    # 6.3.3 Saving the kernel in the Linux NSS


    The NSS-enabled kernel is saved into the skeletal DFS using the SAVYS command.
    For an example, we use the SAVELVX EXEC script from the How To Use VM Kernel support
    page at:


    ```

    http://www.vm.ibm.com/linux/linuxnss.html

    ```'
  merge: -1
