  md: '# 5.2.1 Page allocation


    There are various mechanisms available to allocate pages. A low-level allocation
    routine provides contiguous pages for in-kernel allocations, kernel modules, data
    areas, page cache, anonymous user pages, and other user-requested memory. The
    kernel uses a slab cache that provides a more sophisticated mechanism for allocations
    of objects of the same type, large scale users (block I/O, network, and so on).


    A busy Linux system following cache strategy uses most of the available memory
    for caching and processes. Usually, not all of the needed process pages are loaded
    in the main memory. Page fault handling is the method to bring required pages
    back into memory. Accessing invalid pages causes a page translation check triggered
    by hardware. Writing to invalid pages causes a protection exception check triggered
    by the hardware. The hardware provides the correct address using translation-exception.
    The Linux kernel page fault handler checks whether the address is in the Virtual
    Memory Area (VMA), and if so the page is loaded into memory by swap-in, or copy-on-write.
    The stack is able to grow automatically if required.


    Pages that are not used by any other process and have not been changed already
    are seen as available. These pages can be re-allocated without danger of data
    loss since the information is backed up on a permanent storage device (disk, tape).


    # 5.2.2 Aggressive caching within Linux


    Linux manages its memory with regard to the fact that it is running in a virtual
    machine. The Linux kernel, like most other UNIX® systems, uses an always full
    concept of memory management. It attempts to load as much information (applications,
    kernel, cache) into perceived memory resources as possible and caches it there.
    The target is to reduce the number of disk accesses as much as possible. Even
    the fastest disk devices are still slower than memory access.


    To illustrate Linux aggressive caching, we compare the memory usage of two Linux
    guests, one running in a 64 MB virtual machine, and the other in a 128 MB virtual
    machine. Each runs the Mstone workload over an eight-minute interval (the Mstone
    workload is discussed in Appendix C, "Mstone workload generator" on page 205).


    The test run has nearly the same working size not dependent on the available memory.
    The bigger memory size is not accounted for to available (free) memory, but used
    for buffers and caches.'
