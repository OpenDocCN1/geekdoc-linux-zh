    # 9.3 The Linux timer modification


    Traditionally, the Linux kernel keeps track of time using a timer that interrupts
    the kernel at a constant rate. On each interrupt, the global variable jiffies
    is incremented and queues are inspected for. On dedicated hardware, this has a
    minimal performance effect. However, when running Linux on zVM, this is not a
    good idea.


    Although this method of keeping track of time may not be the most efficient, the
    biggest problem for Linux on zVM is the Linux guest uses a little bit of the CPU
    every 10 ms. This causes the zVM scheduler to keep the guest in queue. Therefore
    unused memory pages in the Linux virtual machine cannot be trimmed. With many
    Linux guests holding on their working sets, zVM memory fills up quickly.


    This problem was addressed with the so-called demand timer patch. The patch is
    included in Linux on zVM distributions like Novell SUSE SLES8, SLES9, SLES0 and
    Red Hat RHEL3 Update 1, RHEL5.


    This patch does away with the 10 ms timer tick and sets the timer to pop only
    when the kernel needs to wake up. Even though this does not make a real load idle
    Linux guest, the periods between two timer ticks are normally long enough for
    zVM to recognize the guest as idle (and starting taking timers to trim memory
    pages if necessary).'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'Note: The on demand timer patch can be enabled by changing the kernel config
    option CONFIG_NO_IDLE_HZ=n and a kernel recompile. Alternatively, the on demand
    timer patch can be activated and deactivated permanently with the following convenient
    method. Use the sysctl command to switch the setting in the proc file system:


    +   1. sysctl -w kernel.hz_timer=1 enables the 100 Hz timer. The on demand timer
    patch is deactivated.

    2. sysctl -w kernel.hz_timer=0 disables the 100 Hz timer. The on demand timer
    patch is activated.


    Enable & disable "demand" timer patch on the fly (no reboot required but a permanent
    change, lost after reboot) echoing values 0 or 1 into /proc/sys/kernel/hz_timer.


    More details can be found following the link:

    http://www.ibm.com/developerworks/linux/linux390/perf/tuning_how_timerpatch.html


    Example-1 shows two virtual machines:


    +   ▶ RMHTUX01 runs with the timer patch applied.

    LNX009 runs an unpatched kernel.


    The%CPU column shows that the Linux machine with the demand timer fewer CPU resources.
    The amount of CPU resources looks small, but we should think of many guest resources
    as the consolidation of some hundred servers that already reality today.


    Example-1 Two guests, with one timer applied


    | <USERID>|CPU %|MEM %|EMC|PAG|WSS|RES|UR|PAGES|WSIZE|TYPE|CHAR,STAT |

