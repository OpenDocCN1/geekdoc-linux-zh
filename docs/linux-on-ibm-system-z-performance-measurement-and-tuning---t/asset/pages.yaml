  md: 'Record (record access)

    Only the records accessed by the channel program are added into the cache. This
    is a special mode and should be used carefully. Performance is good for random
    I/O.


    # DS8000 and DS6000 caching modes


    SARC provides the following:


    +   - Sophisticated, patented algorithms to determine what data should be stored
    in cache based on the recent access and frequency needs of the hosts

    - Pre-fetching, which anticipates data prior to a host request and loads it into
    cache

    - Self-learning algorithms to adaptively and dynamically learn what data should
    be stored in cache based on the frequency needs of the hosts


    For more detailed information refer to IBM TotalStorage DS8000 Series: Performance
    Monitoring and Tuning, SG24-7146.


    # Tunedasd command


    Use the Linux command tunedasd to switch between the subsystem operating modes.
    As the command name implies, it is working with DASD, not SCSI disks.


    +   - tunedasd -g or --get_cache

    Get the current storage server caching behavior.

    - tunedasd -c or --cache<behavior>

    Set the storage server caching behavior.


    Example 10-2 Set ESS caching mode from normal to sequential


    ```

    # tunedasd -g /dev/dasdc

    normal (2 cyl)

    ```


    ```

    # tunedasd -c sequential -n 2 /dev/dasdc

    Setting cache mode for device </dev/dasdc>...

    Bone.

    ```


    ```

    # tunedasd -g /dev/dasdc

    sequential (2 cyl)

    ```'
