    # 2.3 Sizing considerations for z/VM Linux guests


    +   - z/VM memory is a shared resource.


    Although aggressive caching reduces the likelihood of disk I/O in favor of memory
    access, the cost of caching must be considered. Cached pages in a Linux guest
    reduce the number of z/VM pages available to other z/VM guests.


    +   - A large virtual memory address space requires more Linux kernel memory.


    A larger virtual memory address space requires more kernel memory for Linux guest
    management. When sizing the memory requirements for a Linux guest, choose the
    smallest memory footprint that has a minimal effect on the performance of that
    guest. To reduce the penalty of occasional swapping that might occur in a smaller
    virtual machine, use swap devices, as discussed in Chapter 7, "Linux swapping"
    on page 79.


    Even though a 512 MB server does not require all memory, it will eventually be
    to use it. Its memory cost is four times that of the 128 MB server.


    More information about sizing practices for the Linux guest can be found in 5.3,
    "Sizing of Linux virtual memory" on page 50.'
