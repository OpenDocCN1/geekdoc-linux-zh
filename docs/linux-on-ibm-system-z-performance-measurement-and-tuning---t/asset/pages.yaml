- img_proc: true
  md: '# 4.1 The z/VM storage hierarchy


    Both z/VM and Linux use what is known as virtual storage, or virtual memory. Usually,
    the term storage is used by z/VM, while memory is used by Linux. In this chapter,
    storage is generally used to explain z/VM-related concepts, in other chapters
    related to Linux, memory is used. Keep in mind that these different terms refer
    to the same.


    Virtual, storage is a method of allowing more programs and to share real (physical)
    storage at the same time. At any given moment, a program can access only a small
    amount of storage, even over a period of time. It is very unlikely that it will
    access more than a fraction of the total storage that has been assigned to user.
    Virtual storage systems use a mechanism called paging to ensure that storage is
    actively being used by a program is in real storage; and another part that is
    not being used is temporarily saved to expanded storage or disks. Then real storage
    can be available for many other programs to use. In both z/VM and Linux, storage
    (called memory in Linux) is managed in  K pages.


    The z/VM storage hierarchy uses three types of storage:


    +   - Main storage

    This is directly addressable and fast-accessible by user programs. Both data and
    programs must be loaded into main storage (from input devices) before they can
    be processed by the CPU. The maximum size of main storage is restricted by the
    amount of physical storage.


    +   - Expanded storage

    Expanded storage also exists in physical storage, but is addressable only as entire
    pages. Physical storage allocated as expanded storage reduces the amount for main
    storage. Expanded storage is optional, and its size is configurable.


    +   - Expanded storage acts as a fast paging device. As demand for main storage
    increases, z/VM can page to expanded storage. Because it exists in physical storage,
    paging to expanded storage can be much faster than paging to Direct Access Storage
    Device (DASD).


    +   - Paging space

    Paging space resides on DASD. When paging demands exceed the capacity of expanded
    storage, z/VM uses paging space.'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'The relationship between the types of z/VM storage is depicted in Figure 4-1.


    # z/VM Storage


    ![](img/a8398552a9cf58d3f3798c1dedb947c2_52_0.png)


    Figure 4-1 The relationship between the types of z/VM storage


    The combination of main storage, expanded storage, and paging spaces forms the
    z/VM virtual storage address space. As illustrated in Figure 4-1, pages move within
    z/VM virtual storage to accommodate demands:


    +   * z/VM guests run in main storage.

    * When dispatched, guests execute in main storage. Not all guest pages need to
    reside in main storage when running. Inactive pages can reside in expanded storage
    or in paging spaces, or in both.

    * Paging occurs between main storage and expanded storage.

    * As demand for main storage increases, z/VM might move inactive guest pages to
    expanded storage. When those pages become active, z/VM moves them back to main
    storage.

    * Paging also occurs between main storage and paging space.

    * If no expanded storage is configured, z/VM pages between main storage and paging
    space. If the paging demand exceeds the expanded storage capacity, z/VM also pages
    to and from main storage and paging space.

    * Pages do not move directly between expanded storage and paging space.


    Pages that move from expanded storage to paging space must first be brought to
    main storage.'
