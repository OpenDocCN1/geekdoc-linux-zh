  md: '# 8.7.1 Virtual CPU time accounting and steal time


    In order to improve the accuracy of CPU time accounting on virtual systems, the
    mechanism must be able to hold distinguish between real and virtual CPU time,
    and recognize the concept of being in an involuntary wait state at some times.
    These wait states are referred to as steal time. The steal time is represented
    by the white space gaps within the shaded horizontal bars after the context is
    switched to kernel or user, respectively. This new methodology has been introduced
    on the System z platform. It dispenses with the old Linux elapsed time base, and
    replaces it with the System virtual CPU time. See Figure 8-10.


