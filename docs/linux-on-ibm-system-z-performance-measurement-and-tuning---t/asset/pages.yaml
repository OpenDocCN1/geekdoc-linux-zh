  md: '# How to use PAV


    PAV volumes can be used as both dedicated DASDs and minidisks. The difference
    is who should be responsible for optimizing the I/O performance. When using PAV
    volumes as dedicated DASDs, the performance benefits of PAV depend on how the
    Linux guests manage them, while in the case of using PAV volumes as minidisks,
    z/VM should take the responsibility of optimizing the I/O performance for the
    volumes used by multiple guests.


    # Use PAV volume as dedicated DASD


    PAV devices can be used as dedicated DASD to the Linux guests that are running
    on z/VM. Once the base and associated aliases are attached to the Linux guest,
    it should manage their use. z/VM does not optimize the I/O flowing through the
    base and alias subchannels. A real volume cannot be dedicated to multiple guests.
    In such a dedicated environment, the performance benefits of PAV entirely depend
    on the Linux guest.


    Example 10-3 and Figure 10-10 on page 161 illustrate a Linux guest with two dedicated
    physical volumes, each of which has a base device and two alias devices. z/VM
    dedicates two real virtual devices to the Linux guest, on which the DASD device
    driver senses them as different and independent DASDS.


    Example 10-3 An entry for Linux guest in USER DIRECTORY


    ```

    USER LINUX01 LNXME 2G 2G

    INCLUDE LNXOFL

    DEDICATE 1000 E100

    DEDICATE 1001 E200

    DEDICATE 1002 E201

    DEDICATE 1003 E101

    DEDICATE 1004 E202

    DEDICATE 1005 E203

    ```'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'Example 10-3 on page 160 shows an entry for the Linux guest in the USER DIRECTORY
    of z/VM. In this example, physical volumes E100 and E101 are dedicated to Linux
    guest LINUX01. Each of the physical volumes has aliases, from E200 to E203, and
    are also dedicated to the Linux guest, as shown in Figure 10-10. z/VM dedicates
    these devices as virtual volumes from 1000 to 1005, as seen from Linux as different
    volumes. These volumes can be configured for multipathing, and then organized
    into a volume group by stripping using LVM or other logical volume manager. The
    Linux guest should manage and optimize PAV volumes to get better performance by
    itself.


    ![](img/a8398552a9cf58d3f3798c1dedb947c2_178_0.png)


    Figure 10-10 The relationship between physical volumes and virtual volumes from
    a Linux guest


    # Use PAV volumes as minidisks


    When PAV volumes are used as minidisks, they support both full-pack and non-full
    minidisks in the same manner. A virtual machine can define one or more minidisks
    on the same physical volumes. The physical PAV volumes have a real base device
    and zero or more real aliases. Each minidisk on the physical volume has one virtual
    base device and zero or more virtual aliases. The number of virtual aliases for
    a guest should not exceed the number of real aliases defined in the hardware for
    the real volume.


    All I/O operations on minidisks through virtual base devices or virtual aliases
    are optimized by z/VM. z/VM automatically selects an appropriate subdomain only
    when full-pack minidisks are shared using LIST links or when multiple non-full
    minidisks are on a real PAV volume. Volume 10-11 on page 161 illustrates using
    PAV volumes as minidisks. There are two physical volumes, VOL001 and VOL002, each
    of which has a real base device and two real aliases. In the USER DIRECTORY of
    z/VM, DEV1 is defined with a full-pack minidisk, 100 on volume VOL001, which is
    linked by three other guests. These three guests define a 100-cylinder minidisk
    on volume VOL002 separately. By sharing minidisks on a real PAV volume in these
    two ways, I/O performance can be enhanced.'
