    # 9.4 OSA-Express QDIO enhancements for Linux under z/VM


    Enhancements to Linux qdio and qeth threads can increase the efficiency of Linux
    servers using Gigabit Ethernet or Fast Ethernet OSA-Express QDIO. Gigabit Ethernet
    throughput can increase by much as 40%, while the VM CP is reduced by 50%. Novell/SLE10
    systems have these qdio and qeth threads included in the distribution.


    # 9.5 Infrastructure cost


    Some of the resources used on z/VM to run Linux virtual machines can be seen as
    infrastructure cost. The resources used to run these utility services are not
    available for Linux virtual machines to run business applications. This does not
    mean that this utility services are not necessary. However, it does mean that
    it is worthwhile to review services and see whether savings can be realized.


    # 9.5.1 Installing systems


    There are many ways to install Linux systems. New systems can be cloned from an
    existing image, or you can do a fresh install for each system. For a fresh install,
    you can IPL from disk, tape, or from the virtual card reader. The packages can
    be loaded from a local disk or from a remote FTP or NFS server. This is when installing
    Linux on discrete servers, as well as you install in a virtual machine (with Linux
    on z/VM you have some options to automate the install)


    When installing Linux on discrete machines, the thing that matters most is to
    get the job done with minimal effort (or in the least amount of time). With Linux
    on System or z things are different because the virtual machines share pooled
    resources. The resources used for the installation of a new Linux system cannot
    be used by other Linux virtual machines running the business applications. Unless
    your z/VM system has plenty of unused resources, you should probably concentrate
    on doing the install using the least amount of resources.'
