    # 11.5.2 z/VM: Linux router versus VSWITCH


    z/VM 4.4.0, a feature called VSWITCH was introduced to provide a bridge to the
    network for Linux images. Before there were solutions to consolidate images under
    a z/VM Guest LAN routed to real network (LAN) with a Linux Router built in the
    z/VM Linux colony. This architecture was very useful, but introduced problems
    related to high availability. In fact, to provide high availability the routers
    must be duplicated. Introducing two images to provide connectivity introduces
    an overhead to manage it. Using VSWITCH reduced this overhead because it presents
    itself with high availability between two different network adapters.


    The virtual switch alleviate performance problems by moving data directly between
    the real network and the target or originating guest data buffers.


    Solutions based on Linux routers are still used when a Linux firewall is needed
    to control packets between the real network and the internal Linux network. If
    you are planning to use'
