  md: '# 11.5 High-availability costs


    As discussed in many sections in this chapter, network availability is one of
    the most common problems related to servers. When you plan a Linux architecture
    on System z you should consider single points of failure. Networking high-availability
    scenarios may influence the overall performance of systems. If you are in the
    z/VM scenario or Link aggregation support to perform an high-availability solution.
    It depends on your current System z, z/VM level, and network topology. If you
    are running Linux on LPAR to manage network failure with Linux software, for example,
    zebra. This software provides daemons to manage virtual IP addressing and dynamic
    routing. The following sections below show the costs of high-availability networking
    when you run your Linux systems in LPARs or as a guest of z/VM.


    # 11.5.1 LPAR: static routing versus dynamic routing


    In LPAR scenarios, you can architect a high-availability solution for adapters
    VIPA. VIPA allows you to assign IP addresses that are not associated with a particular
    adapter. This address can be routed to one real interface. When you decide to
    create static routing to do that or use a dynamic routing protocol able communicate
    with protocols in the network and updating routing table.


    Many distributions support quasga as the dynamic routing manager. Quagga use two
    daemons:


    +   zebra

    It provides kernel routing, redistribution of routes between different routing
    protocols and interface lookups.

    ospfd

    Open shortest path is a routing protocol classified as an interior gateway protocol.
    It distributes routing information between routers belonging to a single autonomous
    system.


    Using a daemon for dynamic routing introduces workload to be managed. Daemons
    like quasga usually wake up periodically, sending packets to neighbors to maintain
    connectivity. This period is set on the hello-interval parameter and can influence
    overall performance.


    Dynamic routing is important if you need a auto-managed high availability. If
    you use a static route, in case of loss of signals or some other problems related
    to the OSA interface card, you need to modify the routing configuration. The time
    between the problem being reported and the manual modification of the static route
    may influence the availability from the application and user point of view.


    In this example we show the differences between the static route and the dynamic
    route in terms of throughput and CPU usage by the system. In this test we use
    connect request reports.'
