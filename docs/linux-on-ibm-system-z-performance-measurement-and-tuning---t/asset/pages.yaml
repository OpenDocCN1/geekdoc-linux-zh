    # # 3.7 z/VM system tools


    Like Linux, the z/VM operating system has commands to display system performance
    information. These commands control program (CP) system commands. Entering the
    command qualifier of CP is not required. z/VM responds the same to cp indicate,
    as indicate.


    ## cp indicate

    The cp indicate command displays information about overall processor utilization
    (or LPAR processor utilization), paging rate, mini-disk cache rate, and users.
    Additional information about the z/VM indicate command can be found on the IBM
    Redbooks Web site (ref tips0592).


