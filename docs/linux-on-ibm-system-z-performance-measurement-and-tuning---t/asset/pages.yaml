  md: '**Important:** When running benchmarks, for consistency reasons, always use
    dedicated processors to reduce the impact of other workloads on the results.


    To justify the cost of System z implementations, the objective should always be
    high utilization. For System z, utilizations of over 90% are quite common. They
    are readily sustainable in workload throughput and response time terms. High utilization
    leverages the value of the reliability, availability, and serviceability of the
    System z systems. Other platforms rarely operate at high utilizations, many midrange
    systems peaking at 30%, and smaller server platforms at even lower levels. Dedicating
    physical resources such as processors to one LPAR has the potential for reducing
    the overall system utilization. Reducing system utilization reduces System z effectiveness
    and increases the cost per work.


    # 8.2 The CP scheduler


    The CP scheduler functions, by using time-sharing principles, attempts to keep
    as many of the logged-on virtual machines as possible operating concurrently.
    It contains many algorithms that take into account factors as the availability
    of processing time, paging resources, and real storage (compared to virtual machine
    requirements).


    The CP scheduler uses time slices in determining how long a virtual machine competes
    for access to the processor:


    +   - Elapsed time slice

    - Virtual machines compete for use of the processor for the duration of the elapsed
    slice.


    +   - Dispatch time slice


    During its elapsed time slice, a virtual machine can only control the processor
    for a duration of its dispatch time slice. This is often referred to as the minor
    slice.


    When the dispatch time slice for a virtual machine expires, the scheduler readjusts
    its priority relative to other virtual machines competing for the processor. When
    its elapsed time slice expires, the scheduler drops the virtual machine from the
    set competing for the processor. The scheduler then attempts to add another virtual
    machine eligible for processor resources into the competing.


    # 8.2.1 Transaction classification


    For dispatching and scheduling, virtual machines are classified according to their
    transaction characteristics and resource requirements:


    +   - Class 1

    - These virtual machines are designated as interactive tasks.


    +   - Class 2

    - These virtual machines are designated as non-interactive tasks.


    +   - Class 3

    - These virtual machines are designated as resource-intensive tasks.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '+   - Class 0


    A special class designation for virtual machines that require immediate access
    to processor resources. This class, which needs a special privilege called dispatch,
    is referred to as Class 0.


    For processor scheduling, started virtual machines reside on one of three lists:


    +   - Dormant list

    - Eligible list

    - Dispatch list


    # ## 8.2.2 The dormant list


    The dormant list contains virtual machines with no immediate tasks that require
    servicing. As virtual machines move from that state and begin to require processor
    resources, they move to the eligible list.


    # ## 8.2.3 The eligible list


    The eligible list consists of virtual machines not currently being considered
    for dispatch by a system resource constraint (for example, paging or storage).
    Virtual machines are kept back in the eligible list when demand for system resource
    exceeds what is available. Virtual machines on the eligible list are classified
    by their anticipated workloads


    +   - E1


    E1 refers to 1 virtual machines expected for short transactions. Upon entering
    the eligible list for the first time, virtual machines are classified as E1.


    +   - E2


    E2 refers to 2 virtual machines expected to perform medium-length transactions.
    These virtual machines drop to the eligible list after spending at least one elapsed
    time slice in E1 without completing processing.


    +   - E3


    E3 refers to 3 virtual machines expected to perform long-running transactions.
    E3 virtual machines spent at least two elapsed time slices on the eligible list
    without completing processing (at least one in E1 and in E2).


    Class 0 virtual machines never wait in the eligible list for processor resources.
    Instead, they move immediately to the dispatch list. These are classified as E0
    virtual machines. We discuss virtual machines in 8.4.2, "The CP QUICKDSP option"
    on page 117.


    As resources become available, virtual machines are moved from the eligible list
    to the dispatch list. Classification on the eligible list influences the priority
    and elapsed time slice assigned to the virtual machine by the scheduler when they
    move to the dispatch list. Priorities assigned in this way are intended to:


    +   - Slow down virtual machines that are resource intensive in favor of virtual
    machines that require fewer resources.


    +   - Ensure virtual machines receive a designated portion of the processor (see
    8.4.3, "The CP SHARE command" on page 117).


    +   - Control the amount and type of service based on virtual machine classification
    (E1, E2, or E3).'
