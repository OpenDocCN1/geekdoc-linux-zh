  md: 'pages in swap cache and page cache. As other UNIX operating systems, Linux
    uses the two-handed clock mechanism. In an endless loop, a function scans portions
    of memory to check current page usage:


    +   - The active list is checked for entries that can be added to the inactive
    list.


    +   - The inactive list is checked for entries that can be reused after content
    is removed or written.


    Linux memory pages are cleaned when:


    +   - The kswapd thread runs.

    kswapd sleeps most of the time. It gets invoked if the number of free pages is
    less than the pages_low variable. It runs until the pages_high mark is reached
    or there are no more pages to free.


    +   - pdflush threads are running.


    The purpose of the pdflush daemon is to write back dirty (modified) pages to disk.
    In older kernels the function is below a threshold, pdflush and updated are started.
    These write back pages to permanent devices so that the pages can be freed.


    After a specified time, the pdflush threads also up to write back pages that are
    dirty too long of a time.


    +   - Shrinking in kernel slab caches occurs.


    The pages in slab cache need certain algorithms, but are not so important since
    slab cache is relatively small.


    +   - The allocation route initiates direct freeing of pages.


    If the kswapd and the pdflush threads cannot keeping pace with the memory requirements
    of a process, the allocation route tries to free some pages.


