    # OProfile


    OProfile is an open source profiler for Linux systems. It offers profiling of
    all running code on a Linux system, the kernel, shared libraries, application
    binaries, and so on, provides a variety of statistics at a low overhead (varying
    from 1-8%) depending on the workload. It is released under the GNU GPL. OProfiler
    consists of a kernel driver, a daemon for collecting data, and tools for report
    generation.


    OProfile supports kernel 2.2, 2.4, and 2.6, and later. But, for Linux on System
    z only supports kernel 2.6 or later. For SUSE, the kernel level must be at least
    kernel-s390(x)-2.6.5-719, which starts from SLEPS2. For RedHat Linux, the kernel
    level must be at least kernel 2.6.9-22-EL, which is RHEL 4.


    OProfile utilizes CPU''s performance counters to count events for all of the running
    code, and aggregates the information into profiles for each binary image. However,
    System hardware currently does not have support for this high performance counters
    utilized by OProfile, so the interrupt is used instead.


    Example 3-1 illustrates a typical usage of OProfile on a Linux guest running on
    zVM. To use the OProfile tool, the timer should be turned off using command sysctl.
    After the profiling is done, turn up the opcontrol to tell OProfile the location
    of the vmlinux file corresponding to the running kernel. Then it is to collect
    the profile data. After the test and shutdown, the profiling report can be generated.
    Generated 3-19 on page 26 illustrates an output example from OProfile.


    Example 3-1 How to use OProfile on Linux on System z


    ```

    sysctl -w kernel.hz_time=1

    gzip /boot/vmlinux-2.6.5-7.201-s390.x


    opcontrol --image=/vmlinux-2.6.5-7.201-s390.x

    opcontrol ---start

    ```


