- img_proc: true
  md: 'We modify the script to use the DEFSYS command parameters specific to our kernel,
    as shown in Example 6-4.


    > **Note:** The original values used for the DEFSYS work when creating the SDF.
    However, these values create a larger NSS than required (and require more time
    to IPL).


    # Example 6-4. SAVELX EXEC to a Linux NSS


    ```

    /* SAVELX EXEC */

    /* get the system name and device to ipl */

    parse arg lxname devnum

    lname = strip(lxname)

    devnum = strip(devnum)

    /* figure out the line end character */

    ''pipe cp q term | var termout''

    parse var termout one my three

    myend = strip(myend)

    /* figure out the storage size | ''pipe cp q v stor | var stor''

    parse var stor one two stor

    /* construct the defsys command */

    ndoded = DEFSYS lxname 0-12 M 100-4RE SR 500-5SCA EM MACHMODE X,ESA''

    doded = define ''MINSIZE='' | storize

    say undef

    /* define the saved system */

    doded

    /* arrange to the ipl processing at the appropriate store, */

    /* at point a savesys will be issued */

    setSAVE = ''TRACE R 010000 CMD SAVESYS'' lxname

    setsave = setsave | myend ''TRACE END ALL''

    say setsave

    setsave = ''i1''

    doipl = devnum

    say doi

    /* all set, issue the ipl */

    doipl

    exit

    ```


    SAVELX EXEC requires two input parameters:

    in our example, we use the name SLES010.


    +   1. The name of the NSS-enabled kernel resides.

    2. The DASD device on the NSS-enabled kernel resides. This DASD device should
    be defined for each virtual machine using the NSS NSS.


    Assuming that the NSS-enabled kernel resides on virtual device 201, we save Linux
    using:

    SAVELX SLES010 201


    # 6.3.4 Changing images to use the shared kernel by NSS


    To boot the Linux NSS in a virtual machine, issue the CP IPL command using the
    name of the Linux NSS. In our example, the NSS is named SLES010:

    IPL SLES010


    Be aware that the NSS-enabled kernel is not booted from DASD, DASD device numbers
    for virtual machines when the NSS must match the numbers used when the NSS was
    created. For example, if the NSS-enabled kernel was created using a 201 disk as'
