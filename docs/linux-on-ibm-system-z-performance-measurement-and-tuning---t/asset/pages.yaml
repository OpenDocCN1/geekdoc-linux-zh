    # Conclusion


    Considerable savings can be made by using an efficient installation process. This
    is an important issue if you create a lot of Linux systems or when you want to
    deliver new systems very quickly.


    # 9.6 Performance effect of virtual processors


    Assigning virtual processors to a Linux virtual machine can be an effective means
    of matching System z resources to anticipated workload. Overall throughput can
    be affected by the number of processors assigned to a Linux virtual machine.'
