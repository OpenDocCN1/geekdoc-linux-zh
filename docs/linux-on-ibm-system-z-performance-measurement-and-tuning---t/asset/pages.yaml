  md: "# # 5.1 Components of the Linux memory model\n\nWe begin examining Linux memory\
    \ by looking at the components of memory allocation.\n\n# ## 5.1.1 Linux memory\n\
    \nWhen Linux boots, one of its first tasks is the division and allocation of memory\
    \ resources.\nMemory is divided into three main components:\n\n+   - Kernel memory\n\
    \  Kernel memory is where the actual kernel code is loaded, and where memory is\
    \ allocated\n  for kernel-level operations. Kernel operations include:\n  - Scheduling\n\
    \  - Process management\n  - Signaling\n  - Device I/O (including both to-disk\
    \ and to-network devices)\n  - Paging and swapping\n\nPages to host the kernel\
    \ code are marked at boot time as reserved and are not available\nfor later allocation.\
    \ The kernel is loaded at the bottom of memory. Kernel operations\nuse memory\
    \ of the buddy or slab objects.\n\n+   - User memory\n  User memory is where all\
    \ application code is loaded:\n  - Anonymous memory\n  - Shared memory (System\
    \ V or POSIX API)\n  - Memory mapped files\n\nThe need for user memory is satisfied\
    \ from the master page pool.\n\n+   - Page cache memory\n  Page cache caches pages,\
    \ as the name implies. The Linux kernels 2.4 and later\nhave no separate page\
    \ and buffer caches. The page cache is filled when read\nand write operations.\
    \ It hosts data from various sources:\n  - Read and write operations of regular\
    \ files\n  - Memory mapped files\n  - Operations against block device files\n\n\
    Page cache is intended to speed up overall system performance by reducing I/O\n\
    operations (which are inherently slower than memory access).\nThe kernel keeps\
    \ track of all the pages using a page array structure.\n\n> Note: Linux uses an\
    \ aggressive caching policy intended to reduce I/O when allocating main memory,\
    \ the theory being that memory is better utilized as cache, rather than leaving\
    \ it unused and available. This policy is illustrated in 5.2.2, \"Aggressive caching\
    \ within Linux\"\non page 48.\n\n# ## 5.1.2 Linux swap space\n\nLinux typically\
    \ asks for the creation of a swap device during initial installation of a system.\n\
    for of high memory demand, Linux temporarily moves less frequently accessed memory\n\
    to its swap devices. The free memory pages then become available for other use."
