    +   - General user data: resource consumption, paging information, IUCV and VMCF
    communications, wait states, response times


    +   - Detailed user performance, including status and load of virtual deices


    +   - Summary and detailed information about shared file system servers


    +   - Configuration and performance information for TCP/IP servers


    +   - Linux performance data - system execution space (SXS) performance data


    +   - Virtual networking and configuration data


    The collected performance data is also used to provide:


    +   - A re-display facility for many of the key figures shown on the general CPU
    performance and storage utilization panels, which allows browsing the last measurements
    (up to two hours)


    +   - Historical plots with a selection of up to four re-display variables, either
    as simple plots, or if the Graphical Data Display manager program (GDDM), 5684-007
    or 5684-168) is, available, in the form of GDDM graphics


    +   - Variable correlation plots (simple plots or GDDM graphics) that show how
    the values of specific variables are correlated to the values of another variable


    > Note: GDDM is required for generating graphics on the console of a virtual machine.
    However, no additional software is required when generating graphics with browsers
    using the WWW interface.


    For later reference, the accumulated performance data can also be used for creating:


    +   - Printed performance reports


    +   - Simple performance history files


    +   - Extended trend plans


    For capacity planning, the history files on disk can be used for:


    +   - Performance trend graphics


    +   - Numerical history data analysis


    What we now call the VM Performance Toolkit trace its origins seventeen years,
    and it has evolved from an operations console with a few performance commands,
    to a highly functional, varied, highly detailed reporting and real-time monitoring
    tool. Communication, and subsequent collection, data from a Linux guest allows
    it to produce a consolidated view of the hardware, LPAR, VM, and Linux levels.
    The user interface of the Performance Toolkit is simple, but can be extended by
    entering the full or abbreviated report name to go directly to the one you need.
    Once inside a report of many layers he have submenus, or further navigation is
    possible by placing the cursor under the variable and pressing the Enter key.
    Indeed, a report contains many layers of navigation, for example you can look
    at an ordered list of DASD volumes, and see the overall activity, plus controller
    functions. You can go deeper, and look at a given volume in detail, then go into
    further detail and look at minisk device activity. This type of navigation greatly
    facilitates problem determination, as well as making the overall understanding
    of your system, even down at level, much easier because of this


    # Chapter 3. Linux monitoring tools 15'
