  md: '# Elapsed time comparison


    In Figure 9-2, we show elapsed time for the five installation methods. Because
    each process uses some manual steps (navigation though YaST panels), this is not
    easy to measure. To get an idea of the elapsed time, we recorded the CPU usage
    per minute and discarded the intervals where the Linux system used little more
    than the idle load.


    # Elapsed time to install a system


    ![](img/a8398552a9cf58d3f3798c1dedb947c2_155_0.png)


    Figure 9-2 Elapsed time for installation using different methods


    The Breeder method is clearly the fastest. This should not be a big surprise because
    it avoids some steps that are relatively slow on System z. It is a bit surprising
    to see that taking out the virtual router does not make the second method faster.
    The reason for this is that the VM TCP/IP stack is more efficient in driving the
    OSA device (an OSA-2 Token Ring in case) than the Linux LCS driver. We believe
    that this difference can be attributed to the use of Diagnose9b in the VM TCP/IP
    stack.


    # CPU time comparison


    Probably more than the elapsed time is the CPU time used for the installation.
    The total CPU cost, as well as the breakdown of the cost per virtual machine,
    is shown in Figure 9-3.


    # CPU time to install a system


    ![](img/a8398552a9cf58d3f3798c1dedb947c2_155_1.png)


    Figure 9-3 CPU time used to install a system'
