  md: 'In Figure 8-1 on page 104, the z/VM LPAR in which the reported data is collected
    (A02) is shown. The overall report, which may be referenced from Appendix E. "Additional
    material" on page 211, shows what z/VM considers its processor utilization to
    be for each LPAR, as well as the total for all the partitions in the CPU machine.
    The term %Busy is what a physical processor is assigned to a logical node. LPARs
    are prioritized by weights, which are explained in 8.1.2, "Converting weights
    to logical processor speed" on page 106.


    All of %Busy and other processor utilizations shown in this report are in absolute
    numbers, meaning that these values are percentages of one processor. There is
    never a case of a reported percent of a percent, where one of the percent is not
    provided. Therefore, after the four columns for A02 are showed, the VM LPAR is
    using 6% of a possible 400% (four processors).


    The values for A02 and other LPARs in this example include:


    +   * Processor type and model.

    * Nr of configured partitions - total number of partitions on the entire system.

    * Nr of physical processors - total number of physical processors installed and
    enabled.

    * Dispatch interval (set to dynamic).

    * Partition - the name given to the logical partition.

    * Nr - the number of the logical partition.

    * Upid - the user partition ID for the logical partition.

    * #Proc - the total number of processors defined for the partition.

    * Weight - determines the share of time the partition is granted control of the
    controllers of processors.


    +   ►6 Wait collection (set to no) - This option determines whether the logical
    processor keeps running on the real processor until the time slice is complete,
    even though it does not work to execute and is waiting. If this is required, set
    the option to YES. If you want to hand control to processors before your time
    slice is up, when you are only waiting and not executing, set this to NO.


    +   ►6▄ Cap (set to no) - If the option set to here is yes, which that CPU is
    provided up to the allocated maximum. If set to no, CPU is provided up to the
    maximum, and beyond if it is available.


    +   ►6▄Load - This is the relative load of this partition, based on the time its
    logical processors were active, divided by the total available processor time,
    and expressed as a percentage.


    +   ►6▄ CPU - the CPU identification character allocated to each processor in
    the partition. This starts at 0 and counts up to the total number of CPUs assigned.


    +   ►6▄Ovhd - This is the percentage of elapsed time spent on the LPAR itself,
    the overhead for running and controlling the workload partitions it is responsible
    for.


    Some of these are discussed in 8.1.4, "LPAR options" on page 107.


    The following LPAR values are not shown in the example, but are reported by the
    VM performance tool kit:


    +   ►6▄Susp - This is the percentage of time that the logical processor was suspended
    and could provide service to the guest system by LPAR management time and contention
    for real processors.


