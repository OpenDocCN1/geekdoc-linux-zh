  md: '# 8.6 Virtual Machine Resource Manager


    Virtual Machine Resource Manager (VMRM) was introduced in zVM 4.3. It runs in
    a service virtual machine (VMRSVM) and dynamically manages the performance of
    workloads. VMRM uses a set of user-specified workload definitions and goals, compares
    these with the achieved performance, and makes adjustments accordingly. (It is
    conceptually similar to the Work Manager used by zOS.) The basic idea is to align
    performance objectives to be set in a manner more closely aligned with business
    objectives than has been previously.


    VMRM is only effective in a constrained environment because it works by prioritizing
    workloads to enhance their access to resources, and restricts other work''s access
    to those resources. If the z/VM system is not constrained, VMRM cannot enhance
    access to resources because they are readily available.


    A workload is a collection of one or more virtual machines treated as an entity
    for the purpose of performance management. Each workload has certain goals defined
    for it. These goals are for DASD and CPU utilization. A workload can have a DASD
    goal, a CPU goal, or both. A goal represents the importance of a workload for
    the particular installation. Configuration changes can be made at any time, but
    require the VMRM service machine to be stopped and restarted to make them effective.


    VMRM uses CP MONITOR to determine the level of activity on the system and when
    workloads are meeting the defined goals. VMRM allows some latitude, 5%, in making
    this determination (which avoids overreaction when a workload is near its goals).


    Every minute (the default) VMRM examines the system and picks a workload that
    is failing to meet its goals. If it finds one, it uses the CP SET SHARE and CP
    IOPORITY commands to adjust the workload to give it more access to the resource
    or resources for which the goals were not met. VMRM remembers workloads it adjusted
    recently and does not alter them for a while. Instead, it might consider another
    workload to adjust at the next interval.


    VMRM cannot adjust users with fixed CP I/O priorities. If you have defined users
    with absolute or hard SHARE, or absolute I/O priority, this has to be changed
    for VMRM to manage them. It also allows specific users that would be treated as
    part of a workload to be excluded from it, but would normally be more sensible
    to define such a user as part of the workload in the first place.


    # 8.6.1 Implications of VMRM


    Because VMRM sits adjusting performance parameters at frequent intervals, it is
    able to adjust to changing conditions. As the workload on the z/VM system changes
    over the course of a day, VMRM can make adjustments to the defined (and running)
    workloads in order to try to make them meet the goals defined for them. (It ensure
    that workloads meet their goals cannot create resources out of thin air.)


    Because VMRM adjusts z/VM tuning parameters, it might conflict with manual efforts
    to tune z/VM. In particular, manual use of the CP SET SHARE and CP SET IOPORITY
    commands is likely to cause problems, or at least unclear results.


    Support for I/O priority queuing added to z/VM to support VMRM. This is probably
    significant as the addition of VMRM itself.


    CP SET IOPORITY and the associated dictionary statement were added to z/VM to
    support VMRM. However, these can also be used for manual tuning.'
  merge: -1
