- img_proc: true
  md: '# 4.2 Guidelines for allocation of z/VM storage


    As discussed in 1.2.1, "Overcommitting resources" on page 5, overcommitted storage
    is a normal and desirable situation on z/VM. Storage overcommitment allows z/VM
    to provide more resource utilization (and, therefore, a lower cost). The z/VM
    storage hierarchy is designed to optimize paging on an overcommitted system.


    With 64-bit support, the question arises whether there is a need for expanded
    storage (why not configure all physical memory as main memory inside)? The general
    recommendation is to continue with z/VM with expanded storage.


    Expanded storage often results in more consistent or better response time. Factors
    that suggest expanded storage improves response time:


    +   Paging will likely occur in a z/VM system.

    The logic for allocating all physical memory as main storage is that paging only
    occurs if there is a shortage of main storage, and expanded storage only increases
    this possibility. However, overcommitment of storage on z/VM is a normal and healthy
    practice. Therefore, it is better to prepare for paging than to attempt to prevent
    it.

    p algorithms tuned for expanded storage.

    Paging algorithms in VM evolved around having a hierarchy of paging devices. Expanded
    storage is the high-speed paging device and DASD is the slower one. Moving pages
    from main storage to expanded storage is much more efficient than moving pages
    from main storage to expanded storage DASDs.

    Two GB Limitation.


    Before z/VM 3.1.0, VM only supports 31-bit, which means that all of the programs
    and data have to reside in the 2 GB address space. But even with 64-bit support
    started from release 3.1.0, factors of CP must reside below the 2 GB line until
    the release of 5.3. This can create contention for storage below 2 GB, which can
    be indicated by significant paging to DASD or expanded storage, and a large number
    of pages are still available above 2 GB in main storage. The storage definitely
    degrades performance. Systems with a 2 GB constraint may benefit from having more
    physical storage as expanded storage.


    > Note: Storage contention can be seen by the QUERY FRAMES command or from z/VM
    Performance Toolkit or MEGAMON.


    As a general estimate, it is good to start with expanded storage configured to
    be 25% of the physical storage allocated to z/VM. Many systems do not need more
    than 2 GB of expanded storage regarding the total storage available. If your system
    has a 2 GB storage constraint, configure all the storage that cannot be effectively
    used in main storage as expanded storage. From the result of QUERY FRAMES or Performance
    Toolkit, the number of frames (> G pages) on the available list can show how much
    storage can be configured as expanded storage, refer to:


    ```

    http://www.vm.ibm.com/perf/tips/storconf.html

    ```'
