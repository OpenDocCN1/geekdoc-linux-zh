    # 7.4 Switching to VDISK


    Many people today suggest using z/VM Virtual Disk (VDISK) as the swap device for
    Linux virtual machines. A VDISK is presented to the virtual machine as an emulated
    block architecture (FAA) DASD device (a virtual device of type 9336). When the
    covers, the VDISK is an address space that lives in the z/VM main memory. The
    virtual machine I/O instructions around the device, and CP implements this by
