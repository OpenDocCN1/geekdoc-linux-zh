  md: '# 9.6.1 Assigning virtual processors to a Linux guest


    CP shares all real processors defined to an z/VM LPAR. All virtual machines appear
    to have at least one processor (referred to as the base virtual processor). Additional
    virtual processors can be added to a virtual machine using the CP DEFINE CPU command.
    As shown in Figure 9-6, virtual processors share real processor resources.


    ![](img/a8398552a9cf58d3f3798c1dedb947c2_158_0.png)


    Figure 9-6 Virtual processors in a virtual machine


    In Figure 9-6, Linux guest LNXS02 has access to two physical IFLs. However, because
    it is a virtual uniprocessor, only one IFL may run at a time. Linux guest LNXS04
    is defined to have two virtual processors. Each virtual processor utilizes the
    physical IFLs in the LPAR.


    # 9.6.2 Measuring the effect of virtual processors


    Adding virtual processors to a virtual machine can improve performance for processor-constrained
    workloads. To examine the effects of defining virtual processors to a Linux guest,
    we consider the WebSphere Performance Benchmark Sample. Using the WebSphere Performance
    Benchmark Sample in a three-tier configuration, we determine the relative cost
    in terms of processor resources for each component of the workload:


    +   * The WebSphere Application Server

    * The HTTP server

    * The DB2 server


    > Note: We run each component in its own virtual machine and measure the processor
    resources expended during a simulation running five concurrent clients. The processor
    time spent by each virtual machine is attributed to the WebSphere Performance
    Sample component running in the respective z/VM guest.'
