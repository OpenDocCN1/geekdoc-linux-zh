    # 7.8 Recommendations for swapping


    The worst-case scenario is, for whatever reason, applications need more memory
    than usual, and that cannot be satisfied. This could be caused by newly introduced
    bad program code (memory leak) or the application starting a large number of threads.
    As a result, the Linux kernel starts to kill processes using the OOM-killer Linux
    kernel function. We see this as the worst case because abnormal application ends
    and potential data loss. Even if we swap devices and bring down the performance,
    it is definitely better than data loss and abnormal ending programs.'
