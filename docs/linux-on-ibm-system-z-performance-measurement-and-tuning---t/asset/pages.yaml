    # Tuning basics on System z


    Each hardware and software platform has unique features and characteristics that
    must be taken into consideration when tuning your environment. System z processors
    have been enhanced over the years to provide a robust set of features and the
    highest level of reliability. This chapter discusses general tuning methodology
    concepts and explores their practical application on a System z with Linux guests.
    Topics covered in this chapter include processor sharing, memory, Linux guest
    sizing, and benchmark methodology.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# 2.1 The art of tuning a system


    Performance analysis and tuning is a multi-process. Regardless of which tools
    you choose, the best methodology for analyzing the performance of a system is
    to start from the outside and work your way down to the small tuning details.
    Start by gathering data about the overall health of systems hardware and processes.
    How busy is the processor during the peak periods of each day? What happens to
    I/O response times during those peaks? Do they remain fairly consistent, or do
    elongate? Does the system memory constrained every day, paging waits? Can current
    systems provide user response times that meet service level agreements? Following
    a good performance analysis process can help you answer those questions.


    It is important to know what tools are available and the types of information
    that they provide (see Chapter 3, "Linux monitoring tools" on page 13). Equally
    important is when to use those tools and what to look for. Waiting until the telephone
    rings with complaints is too late to start tuning and collecting data. How will
    you know what is normal for your environment and what is problematic unless you
    check the system and utilization regularly Conducting regular checks on a system
    gives you performance and utilization information that can be used for capacity
    planning purposes.


    A zVM system employs many controls (tuning knobs) to influence how resources are
    allocated to virtual machines. Very few of these controls in zVM increase the
    amount of resources available. In most cases, the best that can be done is to
    take resources from one virtual machine and allocate them to another where they
    are better used. Whether it is wise to take resources away from one virtual machine
    and give them to another normally depends on the workload of these virtual machines
    and the importance of that work.


    Tuning rarely a one-size-fits-all approach. Instead, you will find that one type
    of workload performs poorly with another type of workload. This means that you
    must understand the workload that you run to and be prepared to review tuning
    your workload with changes.


    # 2.1.1 What tuning does not do


    It is important to understand that you cannot run more than you can fit in the
    machine. If your System with z has two CPUs and the workload you run consists
    of three Linux machines running WebSphere, where each of them runs a CPU for 100%
    all day, then it will not fit. There is no z/VM tuning that will make it, but
    there might be performance issues in the applications themselves to make the workload
    use less than 100% all day.


    When a System with z has four CPUs and the workload of three Linux machines each
    use a CPU for 100% all day, there is little to. In this case, z/VM has sufficient
    resources to give each Linux virtual machine what it requires (one might want
    to look into changes to the configuration that allow you to use all four CPUs
    and make things run faster).


    # 2.1.2 Where tuning can help


    Even when the different workloads add up to the total amount of resources available,
    you might find that you are still unable to run the workload with good performance.
    The reason for that might be that the system is short on one specific resource.
    In such a situation, proper tuning can make a difference. Before tuning the system
    and workload,'
  merge: -1
