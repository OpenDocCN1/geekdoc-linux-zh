    # 1.2 Sharing resources


    When a resource is shared, this can have different meanings:


    +   Multiple virtual machines take turns using a resource.


    This is most obvious with sharing the CPU. z/VM dispatches virtual machines one
    after the other on the real processor. The required resources are provided so
    effectively, each virtual machine believes it owns the processor during its time
    slice. Main memory is also shared, as pages in the working set of each virtual
    machine are brought in and out of main memory as needed. Again z/VM creates the
    illusion that a resource is owned by a virtual machine. Because there is need
    to manage and allocate the resources, this type of sharing is not free. There
    is an advantage in z/VM for switching back and between virtual machines. The amount
    of this overhead is dependent on the number of virtual machines competing for
    the CPU, but on a properly tuned system, it is a relatively small part of the
    total available resources.


    +   z/VM allows virtual machines to share memory pages.


    In this case, the virtual memory of the Linux machine is mapped in such a way
    that multiple machines point to the same page in real memory. As saving memory
    resources, this has important implications when serving the system, as only a
    single change is necessary to update all of the shared resources. In z/VM, this
    is done through named systems (NSS). It is possible to load the entire Linux kernel
    in NSS and have each code residing in their respective working set. There is no
    additional cost, in terms of memory resources, when virtual machines start to
    share the NSS. Note that not all memory is shared by using NSS. The virtual machines
    running in the z/VM layer also compete for memory to hold their working set. The
    NSS typically holds only a relatively small part of the total working set of the
    Linux virtual.


    # 1.2.1 Overcommitting resources


    It is possible to overcommit your hardware resources. When you run 16 virtual
    machines with a virtual machine size of 512 MB in a 4 GB z/VM system, you overcommit
    memory with a factor of two. This works as long as the virtual machines do not
    require the allocated virtual storage at exactly the same time, which is often
    the case.


    Overcommitting resources is a good thing. We also do this in this normal life.
    A restaurant, for example, could be seating 100 people and every customer to use
    the restrooms. The service can be provided with only a small number of restrooms.
    The same applies to a cinema, but that needs more restrooms per 100 people because
    of the expected usage pattern, which tends to be governed by the timing factors
    as movie start and end. This shows how the workload and the time it runs affect
    the ability to share a hardware resource.'
