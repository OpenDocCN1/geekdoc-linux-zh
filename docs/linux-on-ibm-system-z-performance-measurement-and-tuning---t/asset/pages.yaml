  md: 'need to understand what resource is the limiting factor in your configuration.
    Tuning changes tend to fall into one of these categories:


    +   - Use constrained resources.


    One of the benefits of running Linux systems under zVM is the ability to share
    and to overcommit hardware resources. The amount of memory that Linux thinks it
    owns is called virtual memory. The sum of the amounts of virtual memory allocated
    to each Linux guest can be many times the amount of real memory available on the
    host. zVM efficiently manages memory for Linux guests. With a system that is really
    memory constrained, one option might be to reduce overall zVM memory usage by
    using the virtual machine size of Linux guests.


    +   - Get a larger size of a constrained resource.


    It is easy for users to increase the virtual memory for Linux guests, since it
    is a quick change to the guest definition under zVM. However, needlessly increasing
    memory allocations can cause excessive paging (also known as thrashing) for the
    entire system. In the case of a system that is truly memory constrained, and when
    Linux memory sizes have been assigned judiciously, considering reserving some
    memory pages for particular virtual machine, at the expense of others. This can
    be done with a z/VM command (cp set).


    +   - Increase total available resources.


    The most obvious approach to solving memory issues is to buy more hardware. The
    cost of memory has declined over the years, so that may be a good option. However,
    additional resources can be made available by stopping unnecessary utility services
    in the Linux systems. By aware does not increase the amount of system resources.
    It simply allows resources to be used more effectively for critical workloads.


    # 2.1.3 Exchange of resources


    You can view tuning as the process of exchanging one resource for another. Changes
    to the configuration make an application use less of one, but more of the other.
    If you consider IT budget and staff as a resource as well, even the purchase of
    additional CPUs is an exchange of one resource for the other. When you tune your
    configuration to use less of resource, it should not be a surprise that it will
    use more of another resource. For example, the WebSphere benchmark server (discussed
    in Appendix A, "WebSphere performance benchmark server on page 19). This implementation
    of JEE Web services. In a multi-tier architecture using three Linux systems, WebSphere
    runs in one system, the IBM HTTP server in a second, and DB28 in a third system.
    Obviously, running multiple virtual machines increases some costs, because you
    duplicate the operating system and infrastructure, you have the additional cost
    of the machines, and particular items that could have been shared. By using three
    virtual machines, you can tune the resources given to each of these virtual machines.
    You can make the Web server very small so that it can be brought into memory easily
    and will run quickly. You can make the database machine larger so that it can
    cache a lot of data and avoid some of the I/O to do.


    By using different resources, zVM can dispatch on real CPUs independently. So
    the WebSphere server might be able to use more CPU cycles because it does not
    have to wait for the storage of the database to be brought in. By recording the
    number of transactions per second on an unconstrained system, you never see these
    subtle details. And indeed, in an unconstrained environment, it is best to make


