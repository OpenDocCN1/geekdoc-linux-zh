    z/VM v4.4, v5.1, v5.2 without PAV support, VSE, TPE, and CMS, they should rely
    on the underlying z/VM for PAV performance. z/OS guests can be configured to exploit
    PAV well as Linux.


    # Performance of PAV


    Generally speaking, disk performance depends on the time to do a single I/O operation
    on a single disk volume in z/VM. This time is generally understood as response
    time, which is composed of queue time and service time. Queue time is the guest''s
    I/O spends waiting to access the real volume. Service time is the time required
    to finish the I/O operation. PAV can help to increase the access paths to a volume
    by using multiple aliases devices, which leads to reducing the queue time. But
    if a volume is not experiencing queuing, adding aliases does not help enhance
    the performance, for the time required to perform an operation is not appreciably
    changed by the queue time. In some cases, increasing the number of aliases for
    a volume might result in the increased service time for that volume. Most of the
    time, the decrease in wait time outweighs the increase in service time, so the
    response time improves.


    162 Linux on IBM System z: Performance Measurement and Tuning'
  merge: -1
  pgno: 179
