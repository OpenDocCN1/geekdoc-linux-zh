  pgno: 127
- img_proc: true
  md: 'We discuss how the scheduler calculates priorities in 8.3.3, "Entering the
    dispatch list" on page 112.


    # 8.2.4 The dispatch list


    Virtual machines contending for processor time are placed on the dispatch list.
    Entries higher on this list are more likely to receive processor time. Virtual
    machines in the dispatch list retain the transaction classification assigned while
    waiting in the eligible list. Transaction classifications on the dispatch list
    are referred to as Q1, Q2, Q3, and Q0 (directly analogous to the E1, E2, E3, and
    E0 classifications on the eligible list).


    > Note: E0 virtual machines on the eligible list are included in the count of
    Q0 virtual machines displayed by the CP INDICATE LOAD command.


