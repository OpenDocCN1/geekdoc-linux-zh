    There is a correlation between the number of logical processors defined and active
    and the amount of overhead involved in slicing the physical processor between
    the logical processors. The more logical processors, the higher the overhead.


    # 8.1.1 LPAR overhead


    The LPAR overhead of managing all the various partitions under its control is
    broken down into two values by the VM Performance Tool Kit. %head, for each logical
    processor, is the overhead calculated as percentage of elapsed time that LPAR
    has spent running and controlling the partitions. In the example, the total overhead
    for all processors in all is 5.7%. The other figure at the end of the listing
    is the general LPAR management overhead, in which this example is 1.7%.


    > Note: The IBM Performance Tool Kit shows all processors types. Use general central
    processors (CP), Integrated Facility for Linux (IFL), Internal Coupling Facility
    (ICF), z29 Integrated Processor (zIP), and System z Application Processor (zAPP)
    are all shown.


    From the report, we see that there are 45 partitions defined. There are 106 logical
    processors shared between active guests, with 16 physical (non dedicated) processors
    on which to dispatch them (0–6), each with an overhead in the 5–6 range. The two
    dedicated processors (partition numbers 8 and 9) have no overhead in the example.
    However, this does not imply that the processors should be dedicated to LPARs
    to reduce overhead. The number of LPARs defined and the number of logical processors
    defined clearly relates to total overhead costs.


    > Note: To reduce physical overhead, use fewer LPARs and fewer logical processors.


    # 8.1.2 Converting weights to logical processor speed


    An LPAR is granted control of processors based on time slices. Each LPAR gets
    time slices based on the weighting factor for the LPAR. To determine the weight
    of each logical processor, use the following calculation:


    +   1. Add up the weights for the logical processors.'
