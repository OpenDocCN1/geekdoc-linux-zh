  md: '# ## 11.1 Selecting network options


    This section describes the different options that you can use to attach Linux
    on System z to an external network. Linux can use the network directly or by services
    managed by z/VM. The choice between the different solutions can influence overall
    performance.


    # ### 11.1.1 Physical networking


    Linux can be installed on LPARs and under z/VM. With Linux on LPAR the only choice
    we have is the direct attach to the network connecting the operating system directly
    to the OSA adapter, as shown in Figure 11-1.


    ![](img/a8398552a9cf58d3f3798c1dedb947c2_185_0.png)


    Figure 11-1 Direct attach to network


    Direct-attached networks are possible with z/VM, also, the DEDICATE command on
    the USER DIRECT definition for the Linux guest makes this possible. This means
    that Linux directly controls the network interface. This can be used when you
    do not have images to be managed.


    Using only one adapter may result in a single point of failure. If an OSA adapter
    fails, Linux no longer be available. To avoid this, it is possible to duplicate
    the network connection and use a high availability solution such as a virtual
    IP address. This normally introduces protocols to manage the dynamic routing,
    and the result is complete high availability with some overhead introduced by
    products to manage the routing, like zebra and the ospf daemon. If you want to
    use a high availability solution on Linux under z/VM we suggest using a virtualized
    network managed by VSWITCH, as described in 11.1.2, "Virtual networking" on page
    171.'
