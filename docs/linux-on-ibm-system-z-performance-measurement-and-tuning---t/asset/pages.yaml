- img_proc: true
  md: '# 4.3 z/VM use of storage


    The initial 64-bit support is provided by z/VM 3.1.0, and is incrementally improved
    through z/VM 5.3. The following discussion describes the use of storage below
    2GB-line throughout these releases, so as to tune your VM for better performance
    accordingly.


    While z/VM has 64-bit support and can support programs and data saved above 2
    GB of main storage (real storage), there are some areas of the control program
    (CP) that are limited to 31-bit (2 GB) addressing. From z/VM 3.1.0 through 5.1.0,
    all CP code and data structures have to reside below the 2 GB line, and most of
    the CP continues to use 31-bit addressing. A guest page can continue to reside
    above 2 GB and have instructions it can execute or reference without moving. But
    if a page is referenced by CP or requires CP processing, it must be moved to a
    frame below the 2 GB line in main storage before it can be manipulated by this
    31-bit CP code. This includes things as I/O channel programs and data (both SCH
    and QDIO), insertion of instructions, and locked pages (like QDIO for devices).


    For example, if a guest is executing an I/O while guest above 2 GB, CP needs to
    do page translation to process the virtual I/O. During the translation, the guest
    page is moved below 2 GB in main storage and locked until the I/O completes. The
    page remains in main storage until it is stolen or released. This may cause storage
    contention below the 2 GB line. When that occurs, pages have to be moved out of
    storage and back again in a short period of time.


    > Note: A page can be stolen during the CP processing, which is started when the
    number of available pages below 2 GB is low. During the CP processing, pages below
    2 GB are moved to expanded storage or paging DASDs. Since expanded storage is
    much faster than paging DASDs, it is better to configure expanded storage in the
    system.


    A page in main storage can be released explicitly or if the guest logs off or
    goes through system reset.


    Usually, a system that is constrained by 2 GB has symptoms of high paging activities
    and a large amount of main space above 2 GB. This can be determined by CP INDICATE
    LOAD OR CP QUERY FRAMES commands may vary from release. For details about these
    commands and related output, refer to the z/VM Commands and Utilities Reference.


    The reason why all CP and data have to reside below 2 GB is because CP’s address
    space. CP runs its own address called system execution (SXS), which can only be
    up to 2 G in size. Prior to z/VM 5.2, the SXS was identity-mapped, meaning that,
    all the logical addresses are as real as addresses in main storage. Since z/VM
    5.2, the SXS is no longer identity mapped, which allows pages in the SXS to reside
    in any part of storage, including the frames below 2 GB line. When CP wants to
    reference a guest page, it can map to a page in SXS and there is no need to move
    it below 2 GB. In addition, the CP control block that maps real storage was moved
    above 2 GB, and some additional modules are changed to 64-bit addressing. These
    changes eliminate most of the limitations to move pages below the 2 GB line (PGMBKs)
    in z/VM 5.2.


    PGMBKs in z/VM 5.2 must reside below 2 GB in real storage. A PGMBK contains the
    page tables and related page management for a 1-megabyte segment of storage. A
    PGMBK is 8 K in size and pageable. When it resides in real storage, a PGMBK is
    backed by two contiguous frames below 2 GB in main storage. If at least one of
    the 1-megabyte segment of virtual storage is backed by one of the frames in real
    storage,'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'PGMBK must reside in main storage. This limitation sets a maximum of 256 GB
    for the amount of active virtual storage that z/VM 5.2 can support. It may become
    an affecting factor when systems are getting larger. PGMBK usage can be checked
    using MEGAMON and z/VM Performance Toolkit. For more details refer to z/VM Performance
    Toolkit Guide, SC24-6156.


    The limitation on PGMBK is removed now in z/VM 5.3. PGMBKs can reside above the
    2 GB line in real storage. This greatly increases the maximum amount of in-use
    virtual storage supported by z/VM. With z/VM 5.2, the PGMBKs must reside below
    2 GB. If the entire first 2 GB of real storage could be allocated to resident
    PGMBKs, the limit of in-use virtual storage is 256 GB. With z/VM 5.3, PGMBKs can
    reside in any place of main storage, the limit of in-use virtual storage is determined
    by the size of total real storage of the z/VM system. The maximum size of real
    storage supported by z/VM is now increased from 128 GB in release 5.2 to 256 GB
    in release 5.3. That is greatly beyond the CP storage management design limit
    of 8 TB of in-use virtual storage. In addition, the management of contiguous frames
    is further improved, and the search for single and contiguous frames on the available
    list is much more efficient in z/VM 5.3. For more details about performance of
    z/VM 5.3, refer to:


    ```

    http://www.vm.ibm.com/perf/reports/zvm/html/zvm50.html

    ```


    # 4.4 Virtual storage as seen by Linux guests


    Virtual storage refers to the combination of main storage, expanded storage, and
    paging space. Linux guests running under z/VM see storage as a contiguous area
    extending from a low address of zero to a high address equal to the virtual machine
    size. However, these pages might not be contiguous in z/VM virtual storage, and
    might be moved out of main storage to accommodate demand. In fact, z/VM might
    move a Linux guest''s pages out of main storage without notifying the guest.


    38 Linux on IBM System z: Performance Measurement and Tuning'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# ## 4.4.1 The double paging effect


    The z/VM storage management process of paging Linux a guest''s pages out of main
    storage without notifying the guest may lead to a situation referred to as double
    paging, an effect illustrated in Figure 4-2.


    ![](img/a8398552a9cf58d3f3798c1dedb947c2_56_0.png)


    Figure 4-2 Illustrating the double paging effect


    Figure 4-2 depicts storage pages used by a Linux guest. The event sequence leading
    to double paging is denoted by the numbered arrows:


    +   1. Page B is moved out from z/VM main storage.

    This page is mapped to a running Linux guest. After a period of inactivity, z/VM
    moves the page to expanded storage.


    > Note: In this example, the page-out occurring to expanded storage. If no expanded
    storage was configured, the page-out would occur to paging space, an even more
    expensive operation.


    The page is now available for demand page-in. z/VM has stolen the page, but the
    Linux guest is unaware that the page-out occurred.


    +   2. Page B is paged into z/VM main storage in response to a page-out attempt
    by the Linux guest.

    To alleviate a storage constraint, Linux identifies inactive pages (including
    page B) to move to its swap device. The Linux guest page faults when attempting
    to access page B. This, in, causes z/VM to page-in storage B to satisfy that request.


    +   3. Linux completes its page-out attempt by moving page B to its swap device.'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'After page B is paged back into main storage, Linux pages it out to its swap
    device. In the end, z/VM has moved pages back into main storage simply to allow
    Linux to move it out again.


    Double page faults are not unique to Linux, z/OS running under z/VM can experience
    the same effect. It is a result of two parties attempting to manage memory at
    the same time. The solution is to ensure that one party does not attempt to page:


    +   - Make the Linux virtual machine size small enough for z/VM to keep in main
    storage.


    Using size estimation techniques to determine how much storage should be given
    to a Linux guest. It is better to give slightly more storage to the Linux guest
    than the working set size. Double paging might still occur if smaller Linux guests
    compete for z/VM storage.


    +   - Make the virtual/VM machine size large enough that Linux does not attempt
    to swap.


    This can lead z/VM to frequently page fault. This can be improved by PAGEX/PFAULT,
    an asynchronous mechanism that allows z/VM to inform Linux that a requested storage
    page is not resident in z/VM main storage. On receiving this notification, Linux
    attempts to dispatch another process.


    +   - Cooperative Memory Management (CMM).


    z/VM and Linux to manage storage separately, which leads to double paging. To
    avoid the problem, a new solution is needed to make z/VM and Linux cooperate efficiently
    in storage management. Storage usage information is passed from Linux guests to
    z/VM. The z/VM steals pages based on the current usage information. If the Linux
    guest accesses pages removed by z/VM, discard faults are delivered, and the Linux
    guest recreates the content of the discarded page. More details can be found in
    6.5, "Cooperative memory management CMM" on page 75.


    +   - Collaborative Memory Management Assist (CMMA).


    CMMA is the latest solution to solve the double paging issue. The pages are in
    use flagged when allocated and so it is easy to distinguish if they are able to
    be reused. Contrary to the CMM solution, the collaborative memory management assist
    is completely controlled by the Linux guest. More details in 6.6, "Collaborative
    memory management assist CMMA" on page 76.


    # 4.4.2 Allocating storage to z/VM guests


    Storage of z/VM virtual machine is assigned in the user directory entry. Two values
    in the directory entry policy storage for each user, as shown in Example 4-1:


    +   - The first value is the storage size of the z/VM''s virtual machine when
    it logs on.


    +   - The second value is the maximum storage size to which the virtual machine
    can change itself after it has logged on.


    Example 4-1 A user directory entry for Linux LXNMR1


    ```

    USER LXNMR1 LN4ME 512M 2 G

    INCLUDE BMDFLT

    IPL CMS

    MACHINE X

    OPTION LKNOPAS APPLMON

    NICDEF C200 TYPE QODIO LIN SYSTEM VSWITCH1

    NDISK 0191 3390 141 20 LX00IR MR

    NDISK 0101 3390 1001 1000 LXC3B

    NDISK 0201 3390 0001 3338 LXC3A

    ```


    10 Linux on IBM z: Performance Measurement and Tuning'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'The initial and maximum storage sizes are specified in the user directory entry,
    and the virtual storage size can be changed by commands. If a guest changes its
    virtual machine size, the storage is reset, and the initial program load (IPL)
    occurs again. As a result, the virtual machine size is something utilized by a
    human user, not by an operating system running in a virtual machine. Table 4-1
    lists some of the storage allocation activities.


    # Table 4-1 Storage allocation activities


    | Activity | Command or directory entry |

    |---|---|

    | Initial storage allocation | USER directory entry |

    | Maximum storage allowed | USER directory entry |

    | Change storage allocation | DEFINE STORAGE command |

    | Modify initial storage settings | DIRMAINT commandᵃ |

    | Display storage allocation | QUERY VIRTUAL command |


    #  4.4.3 VDISKS


    VDISKS are virtual disks, disks that/zVM create in virtual storage. VDISK is backed
    by a storage address space instead of by DASDs. When used, VDISK remains in main
    storage, which makes it very fast. Typical VDISK for Linux guests is a fast swap
    device (see 7.4.3, “The advantages of a VDISK swap device” on page 89).


    For I/O, z/VM does not mean the Linux guest''s swap file I/O buffers below the
    2 GB line in main storage. However, the page and segment tables define the VDISK
    address space (PGMBKs) are not possible and remain below the 2 GB address in main
    storage before z/VM 5.3. These PGMBKs can increase contention for storage I/O
    below 2 GB.


    If your system has plenty of real storage, latency in Linux swap I/O can be reduced
    by using VDISK as a swap device. If the system is storage-constrained below 2
    GB but rich, VDISK might be appropriate for a system if it is not necessarily
    unclear.


    #  4.4.4 Minidisk cache (MDC)


    Minidisk cache (MDC) is a data-in-storage technique that attempts to improve performance
    by decreasing the I/O to DASD Minidisk cache required for minidisk I/O at the
    expense of real or expanded storage. When paging to DASD increases, the amount
    of real and expanded storage decreases for the use of MDC. This may increase I/O
    in z/VM. When paging in z/VM is normal and healthy. Using MDC greatly decreases
    the real DAS I/O with some increase in paging I/O, it is still worth using.


    All minisks that meet the requirements for minidisk cache are enabled by default.
    The CP arbiter function determines how real or expanded storage can be used as
    minidisk cache and paging. If the arbiter favoring minidisk cache by using SET
    MDSCACHE STORAGE BIAS is more optimal for the system, it can be biased against
    or SET MDSCACHE XSTORE BIAS.


    The z/VM minidisk cache is implemented with a system cache where the storage for
    the cache is shared with all the users on the system. To prevent one of the users
    from impacting other users on the same system, a fair share limit is enforced
    by CP. If a user reaches the fair share limit, the I/O completes without inserting
    the data into the cache.'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'fair share limit can be overridden by using the NOMDFS operand on the OPTION
    statement in a user directory entry. We recommend that key users, such as server
    machines or guests that do I/O on behalf of many users, turn off the fair share
    limit.


    Since the use of minidisk cache usually leads to an increase in paging, the paging
    configuration should be appropriate. We recommend that the block size of page
    reads not go below 10, and paging space should not be mixed with other types of
    data, including spool space. Balancing the paging I/O over multiple control units
    is better.


    # 4.5 Influencing z/VM storage management


    Several factors can influence how z/VM manages storage. These include:


    +   - Update system software to the current level.


    +   - Improvements in z/VM storage management can be found by release. Utilize
    the latest technology with higher performance. More details about the storage
    management at different releases can be found in the z/VM performance report at:


    http://www.vm.ibm.com/perf/reports/zvm/html/index.html


    +   - Ensure that we are paging DASDs and the paths to them are not very busy.
    This makes paging as fast as possible. Use multiple devices as many DASD controls
    to permit overcommitted I/O. Use dedicated guests for z/VM paging, instead of
    fractional volumes, that is, do not mix pages with other space (user, spool, disk,
    and so), and make sure to define enough space so that you can do paging. Try to
    provide at least twice as much DAS paging space as the Linux guests'' virtual
    storage.


    +   - Use expanded storage for paging.


    As discussed in 4.2, "Guidelines for allocation of z/VM storage on page 36, expanded
    storage can improve overall performance. A good starting point is to define 25%
    of the real storage as expanded storage. If your system is not constrained by
    2 GB line, 2 G of expanded storage is usually enough.


    +   - Use segments.


    Typically, the Concurrent Monitor System (CMS) is run from a named system (NSS),
    but other operating systems can be, too. The advantage is that only one of the
    operating system resides accessible to all virtual machines. We discuss the creation
    of a Linux NSS in 6.3, "Exploiting the shared kernel" on page 65. By using a NSS,
    only one copy of the kernel is saved in main storage, and the pages making up
    this in main memory are shared with many virtual machines. This decreases storage
    requirements since there is not a separate kernel for each guest.


    +   - Explore discontinuous segments (DCS) when appropriate.


    One of the unique advantages of z/VM is the ability to share segments among virtual
    machines. There are a number of segments that may be predefined on your system.
    If they are not used, they should be loaded into main storage. Use the QUERY NSS
    MAP command to determine how many users are using a segment. When a segment is
    shared by many virtual machines, there is only one set of PGMBKBs in the main
    storage, which can greatly reduce the storage requirement if the content in the
    segment is required by a large number of Linux guests.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '+   Adjust SRM controls.


    These control how zVM manages virtual storage. System Resource Management (SRM)
    parameters are discussed in 8.4.1, "Global System Resource Manager (SRM) controls"
    on page 114.


    +   Ensure that system operation information records are properly retrieved and
    stored.

    zVM allows for the collection of various accounting, error, and system records
    during operation. A new installation of zVM typically defines virtual machines
    that are automatically logged at IP:


    +   - The DISKCNT virtual machine retrieves accounting records.

    - The EERP virtual machine retrieves error records.

    - The OPERSYMP virtual machine retrieves system records.


    If these machines store retrieving data, available system storage can be greatly
    reduced. Further details about these information collection facilities can be
    found in z/VM V5.3 z/VM: System Operation, SC24-6121.


    +   Use the CP RESERVED command to reserve pages for an important guest.

    The CP RESERVED command reserves real storage pages to a virtual machine. Although
    it can be used to improve performance of specified guests, it should be used sparingly.
    Otherwise, it would diminish the performance of the entire system.


    > Note: The Virtual-Fix (V=F) and Virtual-Real (V=R) types of virtual machines,
    also preferred virtual machines, which allow guest pages to remain permanently
    in real storage, are no longer supported by z/VM 5.1.0.


    For z/VM versions before 5.1.0, V=F or V=R are still optional. The V=F option
    is only available if the hardware processor is IPled in base ESA/390 and not in
    LPAR mode. There are limitations and restrictions associated with V-R and V=F.
    Both can adversely affect overall system performance.


    Although these factors influence virtual storage management, not all of them can
    be considered beneficial. In general, options that enable resource sharing are
    recommended for tuning overall system performance.


    # 4.6 Paging and spooling


    z/VM utilizes allocated DASD space for system storage that is available to all
    virtual machines running within that system. This DASD space is owned and controlled
    by the system (CP) and has distinct features.


    As already discussed, DASD space is used for virtual machine paging along with
    main storage and expanded storage. Paging needs to be as fast as possible. Because
    the data in paging is temporary, all data is discarded when z/VM is shut down.


    Here are some guidelines to set up the z/VM system for paging:


    +   - Provide at least twice much DASD paging space as the sum of the Linux guests''
    virtual storage size minus the main memory size. The CP ALLOC PAGE command can
    be used to see how much paging space the system has.


    +   - Use entire volumes for z/VM paging space. In other words, never mix paging
    I/O and non-paging I/O (user space, spooling, tdisk, and so) on the same page.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '+   ► Try to distribute the paging volumes over as many DASD control units
    as you can, and implement a one-to-one relationship between paging CHIPIDs and
    paging volumes. This makes the I/O concurrently occur to several paging DASDs
    through multiple paths.


    +   ► If the paging control supports NVS or DASDFW, turn them on by using the
    CP commands SET NVS ON or SET DASFW ON.


    Spool space is used to store data that is common to all virtual machines. Because
    z/VM simulates an environment of independent operating systems, each of these
    virtual machines has a designated reader, punch, and printer, just like the computer
    systems of old. Data sent to a virtual machine resides in the reader until deleted
    or read into a user''s minidisk, much like a mail-box. Data that is created as
    output is directed to the virtual printer or to the virtual punch.


    Spool space is also used for executable data or systems stored for access of all
    virtual machines, as NSS files. This creates a common location for system code,
    rather than each virtual machine requiring individual storage space. Because the
    contents of spool space are valid data, they are preserved across z/VM shutdowns
    and IPLs.


    Along with DASD space that is owned by specific virtual machines (better known
    as minidisks), z/VM allows for temporary minidisk space. This space can be allocated
    as needed by a virtual machine from the tdisk space created on the system, which
    allows you to define disks of various sizes with less consideration for placement.
    This is meant only to hold data that is being processed or does not need to be
    retained. When z/VM is shut down, data in the disk space is discarded. If a temporary
    minidisk (tdisk) is used, the minidisk cache should be disabled for that minidisk.'
