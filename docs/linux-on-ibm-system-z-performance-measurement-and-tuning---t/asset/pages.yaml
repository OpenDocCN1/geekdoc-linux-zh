- img_proc: true
  md: 'This example also shows partitioning resources (separate restrooms for male
    and female guests) reduces your capacity if the ratio between the two different
    workloads is not constant. Requirements such as service levels might require you
    to do so anyway. Frankly, the zVM system has ample flexibility to cope with similar
    practical situations within a computing system.


    When the contention on the shared resources gets higher, depending on the total
    resources available, the chances of queuing can increase. This is one consequence
    of sharing that cannot be avoided. When a queue forms, the requesters are delayed
    in their access to the shared resources, to a variable extent. Whether such a
    delay is acceptable depends on service levels in place on the system, and other
    choices you make.


    However, overcommitting is generally necessary to optimize the sharing of a resource.
    Big problems can arise when all resources in the system are being overcommitted,
    and are then required at the same time.


    # 1.2.2 Estimating the required capacity


    Some benchmarks deal with measuring the maximum throughput of an application.
    You will see references to the maximum possible number of transactions per second,
    the number of floating point operations per second, and the number of megabytes
    transferred per second for a given installed system. The maximum throughput of
    the system, when related to anticipated business volumes, can be a good indication
    of how the capacity requirements of the system should be planned. Other factors
    also determine how well a business application runs.


    With multiple virtual machines on z/VM competing for resources, the efficiency
    of the application and how well it runs on the installed hardware base are very
    important. Typical metrics for these measurements are based on a unit rate relation
    between workload and time, such as megabytes transferred per CPU second, or the
    number of CPU seconds required per transaction.'
