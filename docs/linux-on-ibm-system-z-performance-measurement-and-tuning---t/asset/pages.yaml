  md: 'When a memory residing on a swap device is accessed, Linux has to move it back
    into an available real memory page. Options for defining swap space for Linux
    on System z are discussed in Chapter 7, “Linux swapping” on page 79.


    # Swapping versus paging


    Swapping is the process of moving an entire address space to a swap device. Paging
    is the process of moving pages of memory to swap space. Recent kernels do not
    really swap anyone but move pages of memory to the swap device or swap file. Because
    of its inherent inefficiency (the old swapping requires frequent, expensive context
    switches) swapping has been modified. Although Linux now utilizes a paging algorithm,
    the name swap device has retained.


    Readers may still get confused when looking at a Performance Toolkit like the
    one in Example 5-1, where both paging and swapping rates are reported.


    Example 5-1 Memory and activity details panel


    | Total memory size | 493MB | Swap space size |

    | Total memory used | 298MB | % Swap space used 0.06% |

    | Used for buffer | 102MB | Swap-in rate 0/s |

    | Used for shared | 0MB | Swap-out rate 0/s |

    | Used for cache | 229MB | Page-in rate 0/s |

    | Total free memory | 40MB | Page-out rate 25.866% |


    These are values available in the Linux by Linux commands like procinfo. The values
    mean:


    +   - Page in: the number of disk blocks paged into memory. This means disk I/O
    in general.


    +   - Page out: the number of disk blocks paged from memory to disk. That means
    disk I/O in general.


    +   - Swap-in rate: the number of memory pages paged in swapspace.


    +   - Swap-out rate: the number of memory pages paged out to swapspace.


    The activity reported for page-in and page-out rate could be any disk I/O, like
    the flushing of cached file systems, but it is not related to writing to the swap
    space. More information about disk I/O is included in Chapter 10, “Tuning disk
    performance for JVM Linux guests” on page 145.


    # 5.2 Linux memory management


    Linux memory is divided into pages, and each page is usually 4096 bytes in size
    for s390 and s3900 architecture. Linux itself supports other page sizes but needs
    the support of the architecture, too. Pages are described by a unique structure.
    Pages are aggregated into memory zones. 64-bit Linux on System z allocates in
    the DMA zone and the normal zone. The 31-bit Linux on System z only takes the
    advantage of the DMA. Zones are grouped on nodes, which is currently not the case
    on s390 and s3900 architecture.'
