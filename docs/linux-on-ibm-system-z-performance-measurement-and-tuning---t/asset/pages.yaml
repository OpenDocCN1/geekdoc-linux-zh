    Example 10-4 illustrates the report from the performance toolkit. Along the columns,
    the following are interesting when tuning the PAV for disk performance:


    +   - I/O is the I/O rate for the device, in operations per second.

    - Serv (service time) is the average amount of time (milliseconds) the device
    uses when performing a single I/O.

    - Resp (response time) is the average amount of time (in milliseconds) that the
    guest machine receives for an I/O to mindisk the volume. Response time includes
    service time plus wait time (also known as queue time).

    - Req Queued is the average length of the queue for the real device. The average
    number of I/Os waiting in line to use the volume.


    Generally speaking, when you notice that a volume is experiencing queuing by observing
    the Req Queued from the performance toolkit, add aliases to volume until you run
    out of aliases capability, or until the queue is empty. The strategy for tuning
    PAV is to estimate the queue depth for the number of aliases, and add aliases
    for the volume the volume''s I/O rate maximizes the volume''s wait queue is empty,
    whichever comes first.


