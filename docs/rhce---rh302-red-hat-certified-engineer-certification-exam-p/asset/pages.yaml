    All programs in the directories of the above runlevel are symbolic link to programs
    in the directory /etc/rc.d/init.d. The directory /etc/rc.d/init.d contains the
    run scripts. Thus for a run level which scripts of the directory /etc/rc.d/init.d
    are to be run depends on the contents of the directory corresponding to the runlevels.


    # 2.3.4.2.Naming convention of files in runlevel directories


    The files in the runlevel directories have special naming convention. Name of
    all the programs either with S or K followed by 2 digits (0-9) and after that
    name of the service. All the programs (of run level directories) whose name begin
    with S starts the service and name begin with K stops the service.


    The two digits determine the order in which the services will run. E.g. the directory
    /etc/rc.d/rc5.d contains files for runlevel 5. It contains two files S10network
    and S56Inetd then the service S10network is run first. The concept of deciding
    the order in which the scripts will run remains the same for the files with name
    beginning with K.


