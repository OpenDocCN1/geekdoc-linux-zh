  md: '# 10.3.Sharing Folders


    The file /etc/exports contain the name of the folders which are to be shared.
    One directory entry is done on one line. The format of the /etc/exports file entry
    is


    ```

    directory-name host-name(options) #comments

    ```


    directory name is the name of the directory which is shared with other computers
    on network.


    The host names are the computers which have right to access the files.


    The options define security levels that is who can access and which users can
    access the directory.


    # 10.3.1.Format of hostname


    Multiple hostnames or lp address can be entered separated by blank. The combination
    of lp address and hostname can also be used. The format of the entry is


    ```

    hostname hostname2

    ```


    ```

    hostname1 hostname2 165.123.12.87

    ```


    All the hosts from a particular network can also be entered using the ip address/net
    mask format.


    ```

    192.168.1.1/255.255.255.0

    ```


    The wildcard characters *,? can also be used. ? matches any character and * matches
    any number of character. So for example if all the computers in the domain example.com
    should be allowed access directory files then enter the entry


    ```

    files *.example.com

    ```


    but if the access should be restricted to computers with first name of 5 characters
    use


    ```

    files ????.example.com

    ```


    The access can also be defined in terms of the NIS group. The


    NIS group can be preceded by the @ sign before the NIS group name. For example
    to give access to mynis group add entry'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# 10.3.2.Options format


    The valid options used in the /etc/exports file are


    **secure** – the client computer should connect using the port below 1024.if the
    insecure option is specified then any port can be used.


    **rw** – the clients can read the files for NFS volume and also write on the directory
    . The other option is ro which allows read operation only.


    **async** – It responds to the request before the changes made by the request
    are made permanent (that changes are written to disk).So this option improves
    performance but increases chance of inconsistencies. The sync option means server
    will respond to the request after the changes made by the request are permanent
    (that changes are written to disk) so there is no chance of inconsistency.


    **root_squash** – this option maps the root user of client (uid 0 gid 0) to anonymous
    uid and gid. The default value of anonymous uid and gid is 65534.The anonymous
    uid and gid value can be changed by using options anuid and anogid.


    **no_root_squash** – the root user of client is treated as the root user of the
    server as well ( the uid/gid of root is not mapped to the anonymous uid and gid).


    **all_squash** – map uid and gid of all users to anonymous uid and gid. Other
    option no_all_squash which causes mapping to be.


    Below is the sample /etc/exports file


    ```

    /home/vishnu *(sync,ro,secure,all_squash)

    ```


    ```

    /home/user1 ?????.example.com(async,rw,insecure,root_squash)

    ```


    In the first entry the directory /home/vishnu is made accessible


    by each computer (indicated by *) and options sync,ro,secure and all_squash is
    used.


    The second entry makes the directory /home/user1 accessible to computers with
    five letter name in domain example.com with options async,rw,insecure,and root_squash.'
