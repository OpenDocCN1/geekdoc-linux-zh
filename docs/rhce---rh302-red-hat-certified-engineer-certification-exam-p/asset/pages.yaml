  merge: -1
  pgno: 21
- img_proc: true
  md: '![](img/01872e44e0db1c79895b45feb5b484a6_22_0.png)


    This utility can be used to check the proper working of soundcard and reload the
    audio drivers and rewriting the configuration files.


    # 1.4.1.4.For network devices


    Enter the below command in terminal


    ```

    [root@localhost pub]## system-config-network

    ```


    or


    ```

    [root@localhost pub]## neat

    ```'
  merge: -1
  pgno: 22
- img_proc: true
  md: '![](img/01872e44e0db1c79895b45feb5b484a6_23_0.png)


    This utility is used to configure the network devices.


    +   - On devices tab all network devices detected by Red Hat Linux are listed.
    Any network device can be selected and activated.

    - On hardware tab the network hardware physically attached with computer and detected
    by Red Hat Linux can be configured.

    - IPSec tab is used to configure IPSec tunnel and host to connections.

    - DNS tab is used to configure system''s hostname and primary,secondary and tertiary
