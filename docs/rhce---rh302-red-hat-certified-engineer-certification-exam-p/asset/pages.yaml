    # ## 3.FILESYSTEM ADMINISTRATION


    # ### 3.1.Overview


    Red Hat uses the ext3 filesystem. It has journaling feature that improves recovery
    from crashes. The filesystems are organized in a hierarchy. The / filesystem is
    on top of the hierarchy. All other filesystems are contained in it in form of
    subdirectories.


    If a disk partition is mounted on a filesystem then all the sub directories and
    files below that mount point are stored on partition. Let the / partition and
    /usr partition are mounted on /dev/sda5 and /dev/sda6 partitions then the sub
    directories and files below the /usr are stored in the /dev/sda6 partition.


    All the filesystems which don''t have separate partition are stored in the partition
    of / filesystem.


    # ### 3.2.Filesystem Information


    /bin – it contains commands to be used by common users.'
