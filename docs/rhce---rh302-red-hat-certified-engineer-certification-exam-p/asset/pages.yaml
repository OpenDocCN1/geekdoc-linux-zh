  md: 'The yum command checks the configuration files and searches the locations mentioned
    in the configuration files for the package which is needed to be updated or installed
    by yum. The format of sample configuration file /etc/yum.conf is


    ```

    [main]

    cachedir=/var/cache/yum

    keepcache=0

    debuglevel=2

    logfile=/var/log/yum.log

    exactarch=1

    sosolete=1

    gpgcheck=1

    plugins=1

    metadata_expire=1800

    ```


    cachedir mentions the directory yum uses as the cache memory that is storage for
    storing temporary file.


    keepcache options value if 0 causes the headers and cache files to be deleted
    after successful installation and value 1 retains the files.


    The log file where yum writes the log information.


    The option gpgcheck if 1 forces yum to check the gpg keys of the packages and
    if 0 the gpg keys are not checked.


    The files in the directory /etc/yum.repos contain the location on the web which
    yum searches for the packages. Each file represents the location of the packages.
