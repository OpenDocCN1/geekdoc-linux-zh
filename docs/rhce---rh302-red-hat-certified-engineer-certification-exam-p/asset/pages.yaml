    /dev – it contains files representing the device of the system.


    /etc – it contains configuration file.


    /sbin – it contains administrative commands.


    /usr – contains user and administrative commands, user applications, and documentation.


    /var – it contains logs of different services, and directories of data used by
    services FTP, Web server.


    /proc – The /proc filesystem is virtual file system. This means that the /proc
    filesystem is not mounted on any partition. It contains system information and
    information about the processes running on the system. The process information
    is kept in a sub directory of the /proc. The name of the sub directory is same
    as that of process PID.


