  md: '# 9.SQUID SERVER


    # 9.1.Overview


    It is high performance proxy caching server for web clients with supporting HTTP,FTP,and
    Gopher data objects. Squid consists of a main server program squid, a Domain Name
    System lookup program dnsserver and some other modules for authentication and
    management tasks.


    # 9.2.Configuring Squid


    The directory /etc/squid contains the configuration files for squid server. The
    main configuration file for the squid server is /etc/squid/squid.conf. The squid
    configuration file is divided into sections


    # 9.2.1.Network options


    Under the network options the user can define the socket addresses. http_port
    define the socket addresses where Squid will listen for HTTP client requests.
    The socket address can be defined in three forms:


    +   - port alone

    - hostname with port'
  merge: -1
  pgno: 111
- img_proc: true
  md: '+   - IP address with port


    ```

    # Squid normally listens to port 3128

    ```


    ```

    http_port 3128

    ```


    #  9.2.2.Neighbor selection algorithm option


    Under this section user define the mapping of rules for the requests and neighbor
    which will be called if a request obeys the rule. For example


    ```

    hierarchy_stoplist cgi-bin ?

    ```


    means that when the URL consists of certain string of characters then the original
    server handles the request.


    #  9.2.3.Cache size options


    This section defines the options which control the cache size and swap memory
    used to handle the objects. For example


    ```

    #Default:

    ```


    ```

    cache_mem 8 MB

    ```


    This sets the cache size (RAM memory used to store the in transit objects that
    is objects that is in use),hotobjects(objects that are used often),and negative
    cache objects(recent failed requests).


    #  9.2.4.Log File and Cache directory section


    This section defines the directory which will be used as a cache directory.


    ```

    #Default:

    ```


    ```

    cache_dir ufs /var/spool/squid

    ```


    This section also defines the format of the squid log files. The cache dir /var/spool/squid
    contains the following files


    ```

    [root@localhost squid]## ls

    ```


    ```

    access.log cache.log squid.out store.log

    ```'
  merge: -1
  pgno: 112
- img_proc: true
  md: 'The Squid squid is stored in the file /var/run/squid.pid.


    # 9.2.5.Access control section


    This section defines the access control. By default no outside client is allowed
    to access the contents. The acl tag is used to define access control, the form
    of acl tag is


    ```

