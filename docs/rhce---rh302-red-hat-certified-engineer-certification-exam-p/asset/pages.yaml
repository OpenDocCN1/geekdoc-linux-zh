    # 3.6.RAID disks


    Linux uses the ext3 filesystem type which has journaling feature. Journaling feature
    means that

    it helps to recover from crashes and brings the filesystem into a consistent state.
    If power failure

    occurs when a system is running and it shuts down immediately (not a graceful
    shutdown that is

    system shuts down before user using the shutdown -h now command or from

    graphic panel choosing the shutdown option) leaves the filesystem in an inconsistent
    state.

    Journaling feature enables it to recover from such kind of crashes.


    But journaling feature is not sufficient to handle all the cases for example if
    one of the partition

    is damaged then the files cannot be recovered. RAID disks are used to improve
    disk perfor-

    ance minimize the chance of data loss.


    RAID devices are virtual devices created from two or more real block devices.
    This allows

    multiple devices to be combined into a single device to hold a single filesystem.


    Linux Software RAID devices are implemented through the md (Multiple Devices)
    device driver.


    Currently, Linux supports LINEAR md devices, RAID0 (striping), RAID1 (mirroring),
    RAID4,

    RAID5, RAID6, RAID10.


    # 3.6.1.Creating RAID device


    The RAID devices can be created during installation and after installation.-h


    # 3.6.1.1.During installation'
