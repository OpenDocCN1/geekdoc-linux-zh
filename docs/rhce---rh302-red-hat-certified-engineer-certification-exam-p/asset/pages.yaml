  md: '# 6.2.Getting Administration Rights


    # 6.2.1.The su command


    The su command is used to change the user id and group id of the user issuing
    the command to that of user mentioned on the su command. The format of the su
    command is


    ```

    su —user-name

    ```


    If user2 has entered this command in terminal then he will have the privilege
    of user-name (he can perform all actions which user1 perform using the terminal
    in which he entered the above command. Outside that terminal he won''t have the
    privilege of user1).


    # 6.2.2.Using the su


    Using the su command user can also get privilege of root user but the user will
    be prompted for the root user''s password. If he enters the password correctly
    then he gets the privilege of root user else he won''t get the privilege.


    The user id and group id of the root user is 0. Te user and group ids below 500
    are reserved for the administrative users. There are some administrative accounts
    which are automatically created by Linux but the user accounts cannot be used
    to log into the system as they are defined with the /sbin/nologin.nologin refuses
    login from the system. The user accounts are listed in the file /etc/passwd. Below
    is the sample /etc/passwd file


    ```

    root:x:0:0:root:/root:/bin/bash

