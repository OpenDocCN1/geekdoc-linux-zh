    charger-stream daytime-stream echo-dgram tcpmux-server time-stream cvs discard-dgram
    echo-stream tftp


    Each file correspond to a service which xinetd automatically starts when connection
    is made to that port.


    This on demand services should not be accessible by everyone. The access can be
    selective by the use of TCP wrappers.


    # 18.3.Using TCP wrappers


    The tcpd (tcp wrapper daemon) program can be set up to monitor incoming requests
    for xinetd services or in other words services which xinetd supports and also
    services that have one to one mapping onto executable files.


    If tcp wrapper is used if a client makes connection at a port for services like
    finger,talk,telnet and rsh (xinetd service) then first tcp wrapper daemon determines
    whether the connection will be allowed or refused. If the connection is allowed
    then the corresponding service is invoked to listen at the port. The tcpd authenticates
    the client using the files /etc/hosts.allow and /etc/hosts.deny.


    # 18.3.1./etc/hosts.allow


    It contains the list of ip address and subnet masks of clients who are allowed
    connection. This file is first scanned by tcpd.


    # 18.3.2./etc/hosts.deny


    Iit contains the list of ip address and subnet masks of clients who are not allowed
    connection. This file is scanned by tcpd after scanning the /etc/hosts.allow file.


    If an address is not specified in any file the connection is allowed.


    Format of the files /etc/hosts.allow and /etc/hosts.deny are same. The keyword
    ALL is specified for all clients. For example


    ```

    in.telnetd: .example.com

    fingered: ALL

    ```


    the connection for the telnet is allowed for clients from domain example.com and
    connection for the finger is allowed for all the clients.'
