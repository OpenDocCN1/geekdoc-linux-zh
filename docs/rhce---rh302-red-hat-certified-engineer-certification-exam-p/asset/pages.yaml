    is /etc/fstab contains the static information about the filesystem while /etc/mtstab
    contains the dynamic information about the filesystem. The sample /etc/mtstab
    file below


    | /dev/sda1 | | rw | 00 |

    | proc | /proc proc | rw | 00 |

