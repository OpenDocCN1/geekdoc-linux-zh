- img_proc: true
  md: '# INSTALLATION AND HARDWARE CONFIGURATION


    # 1.1.Overview


    Red Hat Linux is one of the major commercial Linux distributions available in
    market . Fedora Core Linux is an open source project of Red Hat. New version of
    Fedora Linux is released every six months.


    # 1.2.Installation


    Anaconda is the default installer in Red Hat Linux. The installation process can
    be broadly divided into many parts depending on the method used for installation


    +   * DVD

    * Network

    * Hard Disk


    # 1.2.1.Using DVD


    To begin installation using the DVD place the DVD media in the DVD drive of the
    computer and set the BIOS to boot from DVD drive. The steps of the installation
    process are


    +   * The DVD media is checked

    * Choose language to use during installation process.

    * Choose keyboard layout.

    * Choose install type. User can choose for new install


    or upgrade an existing installation.


    +   * Choose the software packages to install.

    * Choose partition scheme (options are automatic partition or manual partition)
    .

    * Choose partitioning (options are free space on hard disk,use current Linux partitions,use
    hard disk,and custom partition)

    * If custom partition option is create at least one / partition and swap partition
    (for dual boot system)

    * Install the boot loader to MBR.

    * Configure the network device.

    * Set the firewall options.

    * Choose the languages system should support.

    * Choose the time zone in system is.

    * Enter the root password.

    * Select the packages.


    After installation is complete remove the DVD media from DVD drive. The user had
    to accept the License terms,Configure the firewall,Configure the sound card.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '15


    Then the user is prompted for user name and password on the login screen.


    # 1.2.2.Using Hard Disk


    For installation from hard disk it is assumed that Red hat Linux is already running
    on the computer. In the hard disk install copy all the files of the DVD in a partition
    drive which is used during the new installation.


    Then copy the vmlinuz and initrd files of the DVD media in /boot directory. These
    files are needed to boot the installation process. GRUB is installed as the bootloader
    in Red Hat by by default. To boot the installation process the boot loader should
    be informed about the files copied in the /boot directory.


    The following entry is added in the /boot/grub/grub.conf file to achieve the purpose


    ```

    title Red Hat-Installation

    root (hd0,7)

    kernel /vmlinuz

    initrd /initrd.img

    ```


    root(hd0,7) means that /boot partition exists on eighth partition of first hard
    disk.


    After above steps reboot the computer. Choose Red Hat Installation on the Grub
    menu to begin the install process.


    # 1.2.3.Using Network


    For the network installation the installation files should be copied to the computer
    which will act as install server.


    In case of web server or HTTP server the files need to be copied in the directory
    /var/www/html.


    In case of NFS server the directory containing the installation files should be
    made accessible.


    In case of FTP server copy the files to directory /var/ftp/pub.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Note : when using the installation from Network or Hard disk choose the option
    INSTALL OR UPGRADE in text mode on the first screen of the Installation process.
    At the boot prompt enter the command askmethod


    ```

    :boot linux askmethod

    ```


    This lets the user to select the Installation Method.


    # 1.3.Kickstart File


    After successful installation of Red Hat Linux a kickstart file /root/anaconda-ks.cfg
    is created based on the options chosen by the user during the installation process.


    # 1.3.1.Creating Kickstart File


    User has a choice to use graphical utility to create kickstart file or open a
    text editor and write the commands.


    # 1.3.1.1.Text File


    +   - install

    - cdrom

    - lang en_US.UTF-8

    - keyboard us

    - xconfig --startxonboot

    - network --device eth0 --bootproto dhcp

    - rootpw --iscripted

    - firewall --enabled --port=22:tcp

    - authconfig --enableshadow --enablemd5

    - selinux --enforcing

    - timezone

    - bootloader --location=mbr --driveorder=sda --append="rhgb quiet"'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'The install option denotes new installation will denote upgrade of an existing
    system.


    cdrom shows the install method used. NFS,FTP,HTTP,hard drive are other options
    which can be used for NFS,FTP,HTTP,and hard disk methods.


    +   * For FTP method use option -url give the ftp url name

    * for HTTP method use option -url give the http url name

    * for hard drive use option harddrive --dir=/give directory path -partition=give
    partition

    * for NFS method use option nfs --server=servername --dir=directory name


    Third line shows the installation language to be used during installation.


    Fourth line chooses the keyboard layout.


    The xconfig is used to configure the monitor and video card.


    The network command is used to configure the network. In above case it configures
    the Ethernet interface.


    rootpw denotes the root password.


    firewall command sets the firewall label. option -enable means firewall is enabled,
    option disable means firewall disabled.


    selinux is used to set the security enhanced linux the options are - -enforcing,--permissive,--disable


    timezone is used to select the timezone of the user.


    bootloader command is used to set the partition where the default bootloader grub
    is installed.


    # 1.3.1.2.Graphical utility


    Open Terminal and type the command system-config-kickstart to start the kickstart
    configuration.


    ```

    [root@localhost ~]# system-config-kickstart

    ```'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'The user can use the graphical interface to choose the options and the kickstart
    file will be generated automatically.


    #  1.3.2.Use of Kickstart file


    It is used to automate the installation process. To use kickstart installation
    use following steps


    +   * create a kickstart file

    * copy the kickstart file from cdrom, on network or on Local hard drive

    * use above commands on the :boot prompt during the installation


    ks=cdrom: Kickstart from CDROM


    ks=file:<path> Kickstart from a file (path = ''fd0/ks.cfg'')


    ks=fftp://<path> Kickstart from FTP.


    ks=hd:<dev> Kickstart via harddrive (dev = ''hdal'', for example)


    ks=http://<path> Kickstart from HTTP.


    ks=nfs:(options):<path> Kickstart from NFS. NFS mount options


    ![](img/01872e44e0db1c79895b45feb5b484a6_18_0.png)'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# 1.4.Configuring Hardware


    The file /etc/sysconfig/hwconf contains the listing of installed hardware. The
    command kudzu can run to detect and configure the changed hardware on a system.
    kudzu is run every time Red Hat box is rebooted. It checks the file /etc/sysconfig/hwconf
    for the hardware installed and matches the data with the current hardware. Below
    is the format of the /etc/sysconfig/hwconf file


    ```

    class: CDROM

    nbus: SCSI

    detetached: 0

    device: scd0

    desc: "HL-DT-ST CD-RW GCE-8526B"

    host: 1

    id: 0

    channel: 0

    lun: 0

    ```


    ```

    class: VIDEO

    bus: PCI

    detetached: 0

    driver: i2c-i810

    desc: "Intel Corporation 82845G/GL[Brookdale-G]/GE Chipset Integrated Graphics
    Device"

    video.xdriver: i810

    ```'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'vendorId: 8086


    deviceID: 2562


    subVendorId: 8086


    subDeviceId: 2562


    pciType: 1


    pcidom: 0


    pcibus: 0


    pcidev: 2


    pcifn: 0


    The first entry is for a CDROM drive attached with the system and second is for
    the VIDEO card attached with the system. If any hardware is added or removed then
    it configures the added one and unconfigures the removed one. It then updates
    the data in /etc/sysconfig/hwconf. kudzu can be started in two modes


    +   - safe probe mode

    - no safe probe mode


    safe probe mode disables serial port probing,DDC monitor probing,PS/2 probing.


    To enable no safe probe mode on startup enter the line


    ```

    SAFE=no

    ```


    in the file /etc/sysconfig/kudzu.


    # 1.4.1.Graphical utilities


    # 1.4.1.1.For keyboard layout


    Enter the below command in terminal


    ```

    [root@localhost pub]## system-config-keyboard

    ```'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'The user can select the keyboard layout and press OK.


    # 1.4.1.2.For monitor and video card


    Enter the below command in terminal


