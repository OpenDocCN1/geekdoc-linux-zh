    # 14.NIS SERVER


    # 14.1.Overview


    Network Information Service (NIS) was created by Sun Microsystems. It is used
    to create an central information database which is kept at a server system and
    other computers on the network access the information. The computers which access
    the database information (maps) of the server are referred as as NIS domain.


    # 14.2.Setting NIS domain name


    The command domainname .or nisdomainname,and domainname are used to set the NIS
    domain name of the system. The formats of the commands are


    ```

    domainname domain-name-of-system

    ```


    ```

    nisdomainname domain-name-of-system

    ```


    ```

    ypdomainname domain-name-of-system

    ```


    The below command sets the NIS domain name of the system to localdomain


    ```

    [root@localhost ~]# domainname localdomain

    ```


    The commands if used without any options give the nis domain name of the system'
- md: '

    ```

    root@localhost ~]# domainname

    localdomain

    root@localhost ~]# nisdomainname

    localdomain

    root@localhost ~]# ypdomainname

    localdomain

    ```


    The NIS domain name of the system is lost when the computer is rebooted.


    ## 14.3. Configuring NIS


    The main configuration file of the NIS server is /etc/yp.conf. The sample /etc/yp.conf
    file is:


    ```

    # /etc/yp.conf - ypbind configuration file

    ```


    ```

    # Valid entries are

    ```


    ```

    #

    ```


    ```

    domain LOCALDOMAIN server LOCALHOST

    ```


    ```

    # Use server HOSTNAME for the domain NISDOMAIN.

    ```


    ```

    #

    ```


    ```

    # domain NISDOMAIN broadcast

    ```


    ```

    # Use broadcast on the local net for domain NISDOMAIN

    ```


    ```

    #

    ```


    ```

    # domain NISDOMAIN slp

    ```


    ```

    # Query local SLP server for ypserver supporting NISDOMAIN

    ```


    ```

    #

    ```


    ```

    # ypserver HOSTNAME

    ```


    # Use server HOSTNAME for the local domain. The IP-address of server must be listed
    in /etc/hosts.


    # broadcast


    # If no server for the default domain is specified or

    # none of them is reachable, try a broadcast call to

    # find a server.


    The entry `domain LOCALDOMAIN server LOCALHOST` defines the NIS domain name and
    the NIS server name of the system. The configuration file is read by the ypbind
    daemon.


    ## 14.4. Starting NIS server


    ### 14.4.1. Starting NIS server


    To start the NIS server daemon enter the below command in terminal:


    ```

    service ypserv start

    ```


    ### 14.4.2. Starting ypbind service


    The ypbind service handles requests for information from the NIS server. To start
    the ypbind service enter the below command:


    ```

    service ypbind start

    ```


    ## 14.5. Mapping Information


    The /etc/nsswitch.conf is used to include the NIS in the search path of the files
    by a client system. The sample /etc/nsswitch.conf is:


    # Legal entries are:


    ```

    # nisplus or nis+ Use NIS+ (NIS version 3)

    ```


    ```

    # nis or yp Use NIS (NIS version 2), also called YP

    ```


    ```

    # dns Use DNS (Domain Name Service)

    ```


    ```

    # files Use the local files

    ```


    ```

    # db Use the local database (.db) files

    ```


    ```

    # compat Use NIS on compat mode

    ```


    ```

    # hesiod Use Hesiod for user lookups

    ```


    ```

    # [NOTFOUND=return] Stop searching if not found so far

    ```


    the above list defines the valid entries which can be added in the /etc/nsswitch.conf
    file.


    ```

    passwd: files nisplus nis

    ```


    ```

    shadow: files nisplus nis

    ```


    ```

    group: files nisplus nis

    ```


    In the above example the client computers will search the files passwd, shadow,
    and group them and if the files are not found on the system then after they will
    search for the files on the nisplus domain.


    Next the Makefile in the directory /var/yp is edited to include the files which
    are being shared by the NIS server. The file names which should not be shared
    are commented out.


    The clients'' computers who are allowed access the NIS server information is added
    in the /var/yp/securenets file. The format of the entry in the /var/yp/securenets
    file is:


    ```

    netmask network

    ```


    example


    ```

    255.255.255.0 10.0.0.16

    ```


    so all the computers on the network 10.0.0.16 can access the NIS server information.


    The finer grain of control can be implemented using the file /etc/ypserv.conf.
    This file can be used to set rules that define which host computers can access
    files.


    The format of the file is:


    `ip address of network:file-name for which access is defined:security:mangle[::field]`


    the field is optional. The security has values as none(to allow access), port(to
    allow access from port below 1024), deny(denying access)


    the mangle field is having the value yes or no.


    ### 14.5.1. NIS database


    The NIS database of the files configured to share by the NIS server is created
    by using the ypinit command.


    ## 15. DHCP SERVER


    ### 15.1. Overview


    DHCP stands for the Dynamic Host Configuration Protocol. DHCP server is used to
    assign the ip address, netmask, DNS server and other information to the computers
    in its network. The client computers will have to select that they want to use
    the DHCP server for the information like ip address, netmask, and DNS server.
    The server then provides the requested information to the clients.


    ### 15.2. Starting the DHCP server


    To check the status of the dhcp server run the above command in the terminal:


    ```

    chkconfig --list dhcpd

    ```


    if the service is not running then enable the service by issuing the command:


    ```

    chkconfig dhcpd on

    ```


    after enabling the user can run the dhcpd service using the command:


    ```

    service dhcpd start

    ```


    ## 15.3. Configuration file


    The configuration file for the DHCP server is /etc/dhcpcd.conf. The configuration
    file is used to list the range of ip address out of which the server will assign
    a ip address to a computer on its network. It can also contain option to assign
    a particular address to a definite Ethernet address on the network.


    ## 15.4. Working of DHCP server


    The file /var/lib/dhcp/dhcpcd.leases contains information if a client has been
    assigned address by a dhcp server. For every client which has been assigned address
    one set of lease line is in the file /var/lib/dhcp/dhcpcd.leases.


    On the client computer if a user enters the command ifconfig -a then corresponding
    to the Ethernet interface which was assigned ip address using the dhcp server
    the user will be the ip address mentioned in the file /etc/dhcpcd.conf.


    ## 15.5. DHCP client


    The DHCP client can be configured using the utility Network Configuration. To
    invoke the Network Configuration window enter the below command in the terminal
    window:


    ```

    [root@localhost ~]# neat

    ```


    or


    ```

    [root@localhost ~]# system-config-network

    ```


    ![](img/01872e44e0db1c79895b45feb5b484a6_141_0.png)


    To configure a device to obtain the ip address, dns server information and other
    information needed for connecting to the internet from the dhcp server follows
    these steps:


    Choose the device listing. In the above example the device eth0 is chosen (Ethernet
    interface eth0).


    click on the edit button.


    This will throw a Ethernet device panel to the user.


    On the below Ethernet device panel choose the general tab


    ![](img/01872e44e0db1c79895b45feb5b484a6_142_0.png)


    To set up a dhcp client click on the option box Automatically obtain ip address
    settings with and in the dropdown menu items choose dhcp.


    User can also choose to obtain the DNS server information using dhcp by clicking
    on the check box Automatically obtain DNS information from provider.


    After making the changes the user should restart the network using the below command:


    ```

    service network start

    ```


    The dhclient is used to get the information from the dhcp server. The dhcp client
    (invoked by the command dhclient at boot time if the client is configured to obtain
    the ip address from the dhcp server at boot time) first checks the configuration
    file /etc/dhclient.conf for configuration parameters.


    The process id (PID) of the dhcp client (invoked by the command dhclient) is stored
    in the file /var/run/dhclient.pid.


