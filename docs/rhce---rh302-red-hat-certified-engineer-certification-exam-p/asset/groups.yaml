    User can check on the service and save changes.


    ## FILESYSTEM ADMINISTRATION


    ### 3.1.Overview


    Red Hat uses the ext3 filesystem. It has a journaling feature that improves recovery
    from crashes. The filesystems are organized in a hierarchy. The / filesystem is
    on top of the hierarchy.


    If a disk partition is mounted on a filesystem then all the subdirectories and
    files below that mount point are stored on it. Let the / partition and /usr partition
    be mounted on /dev/sda5 and /dev/sda6 then the sub directories and files below
    /usr are stored in /dev/sda6.


    All the filesystems which don''t have a separate partition are stored in the partition
    of / filesystem.


    ### 3.2.Filesystem Information


    /bin – it contains commands to be used by common users.


    /boot – it contains bootable Linux kernel and bootloader files.


    /dev – it contains files representing the device of the system.


    /etc – it contains configuration files.


    /sbin – it contains administrative commands.


    /usr – contains user and administrative commands, and documentation.


    /var – it contains logs of different services, and directories of data used by
    services FTP, Web server.


    /proc – The /proc filesystem is a virtual file system. This means that the /proc
    filesystem is not mounted on any partition. It contains system information and
    information about the processes running on the system. The process information
    is kept in a subdirectory of /proc. The name of the subdirectory is same as that
    of process PID.


    ### 3.2.1./etc/fstab file


    The file contains information about the filesystems. The sample /etc/fstab file
    is:


    | device | mount point | type | options | dump | pass |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | LABEL=/1 | / | ext3 | defaults | 0 | 1 |

    | LABEL=/opt | /opt | ext3 | defaults | 0 | 1 |

    | LABEL=/usr | /usr | ext3 | defaults | 0 | 1 |

    | LABEL=/home | /home | ext3 | defaults | 0 | 1 |

    | LABEL=/boot | /boot | ext3 | defaults | 0 | 1 |

    | tmpfs | /dev/shm | tmpfs | defaults | 0 | 0 |

    | devpts | /dev/pts | devpts | gid=5,mode=620 | 0 | 0 |

    | sysfs | /sys | sysfs | defaults | 0 | 0 |

    | proc | /proc | proc | defaults | 0 | 0 |

    | LABEL=SWAP-sda3 | swap | swap | defaults | 0 | 0 |

    '
  mdcn: '


    | | 运行 X11。作为 initdefault 默认条目的的良好选择。 |

    | 6 | 所有进程被终止并且系统重启。这对于 initdefault 来说不是一个好的选择。 |


    运行级别 0、1 和 6 是预留的。其他运行级别如 7, 8, 9, a, b, c 也可以用但未被使用。


    ### 2.3.4. 初始化系统


    脚本 `/etc/rc.sysinit` 在启动时运行一次。它是一个 shell 脚本，执行许多功能：


    - 设置系统主机名

    - 检查 SELinux 状态

    - 设置系统时钟

    - 初始化硬件

    - 配置内核参数

    - 挂载文件系统

    - 配置硬件

    - 启动并启用交换空间


    ### 2.3.4.1 启动服务


    为某个运行级别启动的服务取决于该运行级别目录中包含的文件。


    | 运行级别 | 目录 |

    | :--- | :--- |

    | 0 | /etc/rc.d/rc0.d |

    | 1 | /etc/rc.d/rc1.d |

    | 2 | /etc/rc.d/rc2.d |

    | 3 | /etc/rc.d/rc3.d |

    | 4 | /etc/rc.d/rc4.d |

    | 5 | /etc/rc.d/rc5.d |

    | 6 | /etc/rc.d/rc6.d |


    上述运行级别目录中的所有程序都是指向 `/etc/rc.d/init.d` 目录中程序的符号链接。`/etc/rc.d/init.d` 目录包含运行脚本。因此，对于一个运行级别，应该运行
    `/etc/rc.d/init.d` 目录中的哪些脚本，取决于该运行级别对应目录的内容。


    ### 2.3.4.2 运行级别目录中文件的命名规范


    运行级别目录中的文件具有特殊的命名规范。所有程序的名字都以 S 或 K 开头，后跟 2 位数字（0-9），然后是运行的名称。所有以 S 开头的程序（运行级别目录下的）都会启动服务，而以
    K 开头的程序则会停止服务。


    这两个数字决定了服务运行的顺序。例如，`/etc/rc.d/rc5.d` 目录包含运行级别 5 的文件。它包含文件 `S10network` 和 `S56Inetd`，则先运行服务
    `S10network`。对于以 K 开头的文件，决定脚本运行顺序的概念也保持相同。


    ### 2.3.4.3 /etc/rc.d/init.d 中脚本的格式


    该目录包含所有运行级别的脚本。以下是启动网络服务的示例文件。


    ```

    #! /bin/bash


    #


    # network 启用/禁用网络接通


    #


    # chkconfig: 2345 10 90


    # description: 激活/禁用所有配置为在启动时

    # 启动的网络接口。

    ```


    ### BEGIN INIT INFO

    # Provides: $network

    ### END INIT INFO


    行 `# chkconfig: 2345 10 90` 设置脚本在运行级别 2, 3, 4 和 5 中启动，优先级或顺序为 10；在其他运行级别情况下，以
    90 的优先级停止服务。


    在运行级别 5 目录 `/etc/rc/rc5.d` 中存在一个名为 `S10network` 的文件（因为网络服务在运行级别 5 以优先级 10 启动），而在运行级别目录
    `/etc/rc/rc1.d` 中存在一个名为 `K90network` 的文件，因为网络服务在运行级别 1 以优先级 90 停止。


    ### 2.3.4.4 确定当前和之前的运行级别


    要确定当前和之前的运行级别，使用以下命令：


    ```

    [root@localhost ~]# runlevel

    ```


    N 5


    字母 N 表示没有上一个运行级别（即运行级别没有更改）。5 表示当前运行级别为 5。


    ### 2.3.4.5 修改运行级别


    要更改当前运行级别，使用以下命令：


    ```

    [root@localhost ~]# telinit n

    ```


    字母 n 应替换为值 0, 1, 2, 3, 4, 5, 6；即，使用 `telinit 5` 切换到运行级别 5。init 进程会杀死切换到该运行级别所需的进程；在上面的情况下，它将为运行级别
    5 执行操作。


