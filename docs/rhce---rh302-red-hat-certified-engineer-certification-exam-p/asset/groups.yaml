    | Starting squid:. | [ OK ] |


    if the squid daemon is not running then use


    ```

    /etc/init.d/squid start

    ```


    command.


    Alternatively the command


    ```

    [root@localhost squid]# squid -k reconfigure

    ```


    causes the squid to read the configuration file again.


    ## 10.NFS SERVER


    ### 10.1.Overview


    In organizations it is common that the files are kept at one server. The files
    are accessible by some computers on the intranet of the organization. The access
    to files is defined by rules set at the server machine. NFS is example of a file
    server.


    ### 10.2.Starting NFS service


    To start the NFS service enter the below command in the terminal


    ```

    [root@localhost ~]# service nfs start

    ```


    | Starting NFS services: | [ OK ] |

    | --- | --- |

    | Starting NFS quotas: | [ OK ] |

    | Starting NFS daemon: | [ OK ] |

    | Starting NFS mountd: | [ OK ] |


    ### 10.3.Sharing


    The /etc/exports file contains the format for sharing directories. Each line represents
    a directory to be shared. The format is:


    `directory [host] (options)`


    options include:

    - **ro**: allows read-only access.

    - **rw**: allows read and write access.

    - **async**: allows writes to be written to disk asynchronously, improving performance.

    - **sync**: ensures writes are written to disk before the operation is completed.

    - **root_squash**: maps the root client to an anonymous user.

    - **no_root_squash**: does not map the root client.


    Example `/etc/exports`:


    ```

    /home/user1 192.168.1.0/24(rw,sync,root_squash)

    /share/userdata *(ro,async)

    ```


    After modifying the `/etc/exports` file, run the following command to apply the
    changes:


    ```

    exportfs -a

    ```

