    ## 3.6. RAID disks


    Linux uses the ext3 filesystem type which has journaling feature. Journaling feature
    means that it helps to recover from crashes and brings the filesystem into a consistent
    state. If power failure occurs when a system is running and it shuts down immediately
    (not a graceful shutdown that is system shuts down before user using the shutdown
    -h now command or from graphic panel choosing the shutdown option) leaves the
    filesystem in an inconsistent state. Journaling feature enables it to recover
    from such kind of crashes.


    But journaling feature is not sufficient to handle all the cases for example if
    one of the partition is damaged then the files cannot be recovered. RAID disks
    are used to improve disk performance minimize the chance of data loss.


    RAID devices are virtual devices created from two or more real block devices.
    This allows multiple devices to be combined into a single device to hold a single
    filesystem.


    Linux Software RAID devices are implemented through the md (Multiple Devices)
    device driver.


    Currently, Linux supports LINEAR md devices, RAID0 (striping), RAID1 (mirroring),
    RAID4, RAID5, RAID6, RAID10.


    ## 3.6.1. Creating RAID device


    The RAID devices can be created during installation and after installation.


    ### 3.6.1.1. During installation


    During installation of Red Hat Linux the RAID devices can be created using the
    disk druid partition manager.


    - On the druid menu selecting the raid button launches the raid options panel.

    - On that panel select a software raid partition button.

    - Create the partition with software raid the filesystem type

    - from the raid options panel select a device raid button

    - Enter the mount point, filesystem type, raid device, raid level information
    on the raid device panel.


    This creates the raid devices. The raid devices information can be monitored,
    viewed using the mdadm command after the installation.


    ### 3.6.1.2. Using mdadm command


    To create the RAID device using the mdadm command. mdadm command is all purpose
    command for raid devices. It creates, enables,semblessembles monitors the raid
    devices. The format of the mdadm command for creating raid devices is


    ```

    mdadm --create raid-device-name -level=n1 --raid devices=n2 hard-disk-device-name

    ```


    n1 is a number which denotes the raid level of the raid device. The values of
    n1 can be 0, 1, 4, 5, 6, and 10. The value of n2 is equal to the number of physical
    devices which forms the raid device /dev/md0. The hard-disk-device-name is name
    of the devices separated by spaces. The raid device name will be /dev/md0 if the
    first raid device is being created. To create a raid device /dev/md0 of level
    1 using the hard disks /dev/sda0,/dev/sda1,/dev/sda2 use the following command


    ```

    mdadm --create /dev/md0 --level=1 --raid devices=3 /dev/sda0 /dev/sda1 /dev/sda2

    ```


    ### 3.6.1.3. Other uses of mdadm


    The mdadm can be used to mark a device of a raid array to be marked as failed,
    remove it from the raid array or add it to raid array. Raid array means the physical
    devices which together makes a logical device. The various format of the mdadm
    command are


    ```

    mdadm raid-device-name -f hard-disk-device-name

    ```


    to mark the device as failed. Mark the device /dev/sda2 of the raid device /dev/md0
    of the above example as failure the command used is


    ```

    mdadm /dev/md0 -f /dev/sda2

    ```


    ```

    mdadm raid-device-name -r hard-disk-device-name

    ```


    is used to remove the device. Remove the device /dev/sda2 of the raid device /dev/md0
    of the above example the command used is


    ```

    mdadm /dev/md0 -r /dev/sda2

    ```


    ```

    mdadm raid-device-name -a hard-disk-device-name

    ```


    is used to add the device as a spare. To add the device /dev/sda2 of the raid
    device /dev/md0 of the above example the command used is


    ```

    mdadm /dev/md0 -a /dev/sda2

    ```


    ### 3.6.1.4. Information about a raid device


    The mdadm command is also used to see the detailed information about an active
    raid device. The command used for the purpose is given below


    ```

    mdadm --details raid-device-name

    ```


