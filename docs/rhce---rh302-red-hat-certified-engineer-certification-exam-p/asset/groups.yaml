    ## 3.4.1. 查找坏块 (badblocks)


    badblocks 命令用于搜索设备上的坏块。不应带有 `-w` 选项运行 badblocks 命令，因为 badblocks 会通过在设备的每个数据块上写入模式来搜索设备是否存在坏块，这将擦除设备上的数据。因此，对于有数据的文件系统，不应使用
    `-w` 选项通过 badblocks 进行检查。


    这些设备或文件系统应该使用 badblocks 命令，在不带任何选项或使用 `-n` 选项的情况下检查坏块。`-n` 选项是只读的，因此不会在设备块上写入数据，从而数据不会被擦除。


    要保护数据并检查坏块，请使用以下命令


    ```

    badblocks device-name or badblocks -n device-name

    ```


    要擦除数据并检查坏块，请使用以下命令


    ```

    badblocks -w device-name

    ```


