    ## 4.4.Using make


    The software packages are available in the tar.gz, tgz, and tar.bz2 format. The
    packages need to be uncompressed and then the source code is to be build using
    the. /configure, make and install commands.


    To uncompress the packages with tar.gz extension use the commands


    ```

    gunzip realplay.tar.gz

    ```


    This forms realplay.tar


    and then use the command


    ```

    tar xvf realplay.tar

    ```


    generates directory realplay.


    The two commands can be combined into one command


    ```

    tar xvfz realplay.tar.gz

    ```


    generates directory replay.


    If the source code is in tar.bz2 format then use the command


    ```

    bzip2 -d replay.tar.bz2

    ```


    It forms the directory replay.


    After uncompressing the package change the working directory of the terminal to
    the directory replay


    Now to install the package run the commands


    ```

    ./configure

    ```


    ```

    make

    ```


    ```

    make install

    ```


    The ./configure command configures the package for the platform of the system.


    The make command makes the package for the system.


    The command make install installs the package on the system.


    ## 4.5.Package Manager


    package manager is a graphical utility which gathers the information about the
    packages available over the web for update and installation. It searches the software
    repositories which have been defined in the yum configuration files. To invoke
    the Package Manager enter the below command in terminal


    ```

    [root@localhost redhat]# system-config-packages

    ```


    ![](img/01872e44e0db1c79895b45feb5b484a6_66_0.png)


    On the browse tab user can browse for the packages available over the web in different
    categories. On the search tab user can search for a package and on the list tab
    the user gets the listing of all the package, available package, and installed
    package depending upon the option chosen by the user.


    After choosing for the packages which need to be installed the user can decide
    to apply the changes on the panel. If the changes are applied then the packages
    are downloaded from web and are installed.


    ## 5. USER AND GROUP ADMINISTRATION


    ### 5.1.Overview


    Linux is a multi user operating system. During installation root user account
    has to be created (root user is administrator of the system). One more user account
    is asked to create (user may choose to create or skip). User account can also
    be created after installation. Each user belongs to a group account. Group account
    can also be created after installation.


    ### 5.2.Creating User Account


    The useradd command is used to create a new user. It is also used to update default
    values while creating a new user. The general format of the useradd command is


    ```

    useradd user-name

    ```


    ```

    useradd -D options

    ```


    ```

    useradd -D

    ```


    The first form is used to create a new user while the second form is used to override
    the default options used while creating a new user. The third form is used to
    view the default values which will be used while creating a user account.


