    \ shell 脚本。\n\n访问文件——/etc/postfix/access 文件用于定义有权访问 postfix 服务器的用户和系统。\n\n## 17.3.3.邮箱\n\
    \n目录 /var/spool/mail 包含与每个访问 postfix 邮件服务器的用户名对应的文件。这些文件充当信箱。由 postfix 服务器处理的用户入站邮件保存在这些文件中。例如，对于名为\
    \ jack 的用户，其信箱将是 /var/spool/mail/jack。\n\n## 17.3.4./var/spool/postfix\n\n该目录包含用于临时存储邮件的目录列表。\n\
    \n```bash\n[root@localhost mail]# cd /var/spool/postfix;ls\n```\n\n```\nactive\
    \ corrupt deferred hold maildrop private saved\n```\n\n```\nbounce defer flush\
    \ incoming pid public trace\n```\n\n在示例中，/var/spool/postfix 目录包含 `incoming` 子目录，用于临时存储尚未递送入站邮件。\n\
    \n`bounce` 用于临时存储退信的邮件。\n\n## 17.3.5.日志文件\n\n关于 postfix 服务器的日志信息记录在文件 /var/log/mailog、/var/log/mailog.1\
    \ 和 /var/log/mailog.2 中。var/log/mailog.2 文件包含 postfix 服务器接收和发送的每封邮件的日志。\n\n##\
    \ 17.4.切换 MTA\n\n在 Red Hat Linux 机器上，安装了 sendmail 和 postfix 两个服务器，但使用 sendmail\
    \ 作为默认 MTA。postfix 服务器被视为 sendmail 服务器的替代服务。\n\n替代服务和默认服务定义在 /var/lib/alternatives\
    \ 目录和 /etc/alternatives 目录中。etc/alternatives 目录的内容显示了系统上配置的默认服务。该目录包含条目：\n\n```\n\
    mta-sendmail\n```\n\n这使得 sendmail 成为默认邮件服务器。\n\nvar/lib/alternatives 目录包含文件 mta，它列出了其他邮件服务器。\n\
    \n要从桌面端切换邮件服务，请执行以下操作：系统工具 (System Tools) --> 邮件传输代理切换 (Mail Transport Agent Switch)。\n\
    \n在显示的窗口中选择 postfix 作为备邮件服务器。\n\n然后使用以下命令停止 sendmail 服务器并启动 postfix 服务器。\n\n```bash\n\
    [root@localhost alternatives]# service sendmail stop\n```\n\n| 正在关闭 sm-client:\
    \ | [ OK ] |\n| 正在关闭 sendmail: | [ OK ] |\n\n默认的 sendmail 服务器停止，使用以下命令启动 postfix\
    \ 服务器。\n\n```bash\n[root@localhost alternatives]# service postfix start\n```\n\
    \n启动 postfix：\n\npostfix 服务器取代 sendmail 成为邮件传输代理。它替换了 sendmail 组件并使用了 postfix\
    \ 组件，但邮箱和日志文件的位置在两个服务中保持不变。发送和接收邮件的用户不会看到任何区别，因为变化只发生在使用传输代理上。\n\n## 17.5.Dovecot\n\
    \ndovecot 用于配置 IMAP 和 POP3。IMAP 代表互联网消息访问协议（Internet message Access Protocol），POP3\
    \ 代表邮局协议（Post Office Protocol）。sendmail 和 postfix 的邮箱是单一个文件，因此使用上述协议来访问邮件。\n\n\
    ## 17.5.1.启动 Dovecot\n\n启用 dovecot 服务使用命令：\n\n```bash\nchkconfig dovecot on\n\
    ```\n\n启动 dovecot 服务使用命令：\n\n```bash\nservice dovecot start\n```\n\n## 17.5.2.配置文件\n\
    \ndovecot 服务的主配置文件是 /etc/dovecot.conf /etc/dovecot.conf 文件的示例格式如下：\n\n```bash\n\
    # 存储运行数据的基目录。\nbase_dir = /var/run/dovecot/\n```\n\nbase_dir 选项设置了 dovecot 存储运行数据的位置。base_dir\
    \ 将包含 master.pid 文件，该文件包含 dovecot 服务的进程 ID。\n\nprotocols = imap imaps pop3 pop3s\n\
    \nprotocols 选项设置了 dovecot 列出的协议。上面的示例设置了 dovecot 监听 imap、imaps、pop3 和 pop3s 协议。\n\
    \n```bash\nprotocols imap {\n  listen = *:143\n  listen = *:993\n}\npop3 {\n \
    \ listen = *:110\n  listen = *:995\n}\npop3s {\n  listen = *:995\n}\n```\n\n上述部分设置了\
    \ dovecot 监听 imap、imaps、pop3 和 pop3s 协议。\n\n用于错误消息的文件是：\n\nlog_stderr = /var/log/dovecot.log\n\
    \n用于信息消息的文件是：\n\nlog_mail = /var/log/dovecot.log\n\n用于调试消息的文件是：\n\nlog_maildebug\
    \ = /var/log/dovecot.log\n\n用于所有消息的文件是：\n\nlog_path = /var/log/dovecot.log\n\n\
    max_processes 定义了可以运行的邮件进程的最大数量。\n\n```\nmail_processes = 104\n```\n\n## 18.网络安全\n\
    \n### 18.1.概述\n\n网络安全正成为一项至关的任务。如果系统连接到网络，管理员应该关注网络安全。\n\n### 18.2.守护进程 xinetd\n\
    \n守护进程 xinetd 在系统启动时启动并监听许多端口。在 /xinetd.conf 中配置服务。\n\n/etc/xinetd.d 目录包含描述 xinetd\
    \ 将启动的服务的文件。这些服务是按需调用的，可以使用命令查看：\n\n```bash\nroot@localhost xinetd.d# system-config-services\n\
    ```\n\nimg/01872e44e0db1c7895b45feb484a655_0.png\n\n或者通过查看目录内容：\n\n```\n\n###\
    \ 18.3.使用 TCP wrappers\n\ntcpd (tcp wrapper 守护进程) 程序可以设置为监控 xinetd 服务的入站请求，或者说，监控与可执行文件有一一映射的服务。\n\
    \n如果使用了 tcp wrapper，当客户端在 finger、talk、telnet 和 rsh (xinetd 服务) 等服务的端口建立连接时，首先由\
    \ tcp wrapper 守护进程决定允许还是拒绝连接。如果允许连接，则调用相应的服务在端口上监听。tcpd 使用 /etc/hosts.allow 和\
    \ /etc/hosts.deny 文件验证客户端。\n\n#### 18.3.1./etc/hosts.allow\n\n它包含允许连接的客户端 IP 地址和子网掩码列表。tcpd\
    \ 首先扫描此文件。\n\n#### 18.3.2./etc/hosts.deny\n\n它包含不允许连接的客户端 IP 地址和子网掩码列表。tcpd 在扫描\
    \ /etc/hosts.allow 后扫描此文件。\n\n如果在任何文件中未指定地址，则允许连接。\n\n/etc/hosts.allow 和 /etc/hosts.deny\
    \ 文件的格式相同。关键字 ALL 表示所有客户端。例如：\n\n```\nin.telnetd: .example.com\nfingered: ALL\n\
    ```\n\n这意味着 telnet 连接允许来自 example.com 域名的客户端，而 finger 连接允许所有客户端。\n\n"
