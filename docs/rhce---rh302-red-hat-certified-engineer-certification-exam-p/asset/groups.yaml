    ## 6.3. Changing owner and group


    The chown command is used to change the owner or/and group of a file. The general
    format of the command is:


    ```

    chown owner:group file-name

    ```


    - Case 1: if only owner is specified but group is not specified, then the file
    owner is changed to owner and the group is changed to that of login group of owner.

    - Case 2: if owner and group both are specified, then the file owner is changed
    to owner and file group is changed to group.

    - Case 3: if owner is not specified but group is specified, then the group of
    file is changed to that of group.

    - Case 4: if owner and group both are not specified, then nothing happens.


    The chgrp command is used to change the group of a file. The format of the command
    is:


    ```

    chgrp group-name file-name

    ```


    which changes the group of file-name to group.


    The system administration can be divided into several parts:


    - Managing user accounts (creating, deleting, modifying user and group accounts)
    (discussed before)

    - Managing services to be run in a runlevel (discussed before)

    - Updating existing software and installing new software (discussed before)

    - Monitoring system performance

    - Automating tasks

    - Managing and tuning kernel


    ## 6.4. Monitoring System performance


    ### 6.4.1. Using System Monitor


    The system information can be viewed using the System Monitor utility. To start
    the system monitor utility follow these steps on desktop: go to system -> then
    go to administration -> then click on System Monitor.


    ![](img/01872e44e0db1c79895b45feb5b484a6_83_0.png)


    On the processes tab the user can see the listing of all the processes of the
    system at that moment.


    The user can click on a process and then can end process by clicking on the End
    Process button.


    Using the Edit menu option the user can Start Process, View Process, End Process,
    Kill Processes, and also change the priority of the process.


    Using the view menu option the user can choose the option to see only processes
    started by him (his) or all process or active processes on the system.


    Using the filesystems tab, the files currently mounted on the system are displayed.
    A user can also choose which information he/she wants to see for the processes
    using the Edit-preferences option of the menu.


    On the preferences window, the user can choose the time interval after which the
    information is to be refreshed.


    ### 6.4.2. Using top


    The top utility is started by using the top command in the terminal window. The
    top command gives various information about the system:


    - number of users currently logged on

    - load average of the system

    - total number of processes, no processes active, no processes sleeping, no of
    zombie processes

    - usage of swap memory

    - usage detail of RAM memory

    - the information about the processes of the system like PID (process identification
    number), % CPU usage, % memory usage, the command used for invoking the process.
    The process of today.


    ![](img/01872e44e0db1c79895b45feb5b484a6_84_0.png)


    ### 6.4.3. Other commands


    There are several commands available in Linux which can be used to view the system
    information.


    ### 6.4.3.1. Using vm


    The w command is used to view the users who are logged on the system and the processes
    running by it. It also shows the load average of the:


    ```

    [root@localhost ~]# w

    23:17:20 up 32 min, 2 users, load average: 0.10, 0.21, 0.19

    USER TTY LOGIN@ IDLE JCPU PCPU WCPU

    root pts/1 :0:0 23:08 1.00s 0.03s 0.00s w

    ```


    ### 6.4.3.2. Using uptime


    The uptime command is used to show the time for which system is running. Load
    average of the system and number of users logged on the system currently.


    ```

    [root@localhost ~]# uptime

    23:17:44 up 32 min, 2 users, load average: 0.19, 0.22, 0.19

    ```


    ### 6.4.3.3. Using vmstat


    The vmstat command is used to displays the virtual memory statistics.


    ```

    [root@localhost ~]# vmstat

    ```


    | procs --memory----swap---- | ---io----system-----cpu----- |

    |---|---|---|

    | r b swpd free cache | si so bi bo in cs id wa st |

    | 0 0 218808 20736 258632 0 0 144 38 114 435 7 189 2 0 |


    Under the proc heading it displays the no of processes waiting for run time (under
    r sub head-), no of processes in sleep (under sub head b).


    Under the memory heading it displays amount of virtual memory used(swpd), free,
    buffer memory, cache memory, under swap heading amount of memory swapped in from
    disk(si) and amount of memory swapped out(so).


    Under the CPU heading blocks received from block devices(bi), blocks sent to block
    devices(bo).


    Under the CPU heading, the CPU related information.


    ### 6.4.3.4. Using free


    It gives the amount of free and used memory space of the system.


    ```

    [root@localhost ~]# free

    ```


    | total | used | free | shared | buffers | cached |

    |---|---|---|---|---|---|

    | Mem: | 76686 | 55034 | 21620 | 0 | 22476 | 55092 |


    ### 6.4.3.5. Using kill


    The kill command is used to end a process.


