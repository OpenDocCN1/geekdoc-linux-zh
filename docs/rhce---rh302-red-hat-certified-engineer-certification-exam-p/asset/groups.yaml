    # ## 3.FILESYSTEM ADMINISTRATION


    # ### 3.1.Overview


    Red Hat uses the ext3 filesystem. It has journaling feature that improves recovery
    from crashes. The filesystems are organized in a hierarchy. The / filesystem is
    on top of the hierarchy. All other filesystems are contained in it in form of
    subdirectories.


    If a disk partition is mounted on a filesystem then all the sub directories and
    files below that mount point are stored on partition. Let the / partition and
    /usr partition are mounted on /dev/sda5 and /dev/sda6 partitions then the sub
    directories and files below the /usr are stored in the /dev/sda6 partition.


    All the filesystems which don''t have separate partition are stored in the partition
    of / filesystem.


    # ### 3.2.Filesystem Information


    /bin – it contains commands to be used by common users.'
  - '[PAGE 41]


    /boot – it contains bootable Linux kernel and bootloader configuration files.


    /dev – it contains files representing the device of the system.


    /etc – it contains configuration file.


    /sbin – it contains administrative commands.


    /usr – contains user and administrative commands, user applications, and documentation.


    /var – it contains logs of different services, and directories of data used by
    services FTP, Web server.


    /proc – The /proc filesystem is virtual file system. This means that the /proc
    filesystem is not mounted on any partition. It contains system information and
    information about the processes running on the system. The process information
    is kept in a sub directory of the /proc. The name of the sub directory is same
    as that of process PID.


    # 3.2.1./etc/fstab file


    The file contains information about the filesystems. The sample /etc/fstab file
    is


    | LABEL=/1 / ext3 defaults | 11 |

    | LABEL=/opt /opt ext3 defaults | 12 |

    | LABEL=/usr /usr ext3 defaults | 12 |

    | LABEL=/homel /home ext3 defaults | 12 |

    | LABEL=/boot /boot ext3 defaults | 12 |

    | tmpfs /dev/shm tmpfs defaults | 00 |

    | devpts /dev/pts devpts gid=5,mode=620 | 00 |

    | sysfs /sys sysfs defaults | 00 |

    | proc /proc proc defaults | 00 |

    | LABEL=SWAP-sda3 swap swap defaults | 00 |'
- md: '

    The first column represents the device name representing the filesystem.


    The second column represents the mount point in the filesystem.


    The third column denotes filesystem type. The filesystem types ext3,swap are associated
    with a device that is Partition of hard disk but the filesystems with type proc,sysfs,tmpfs
    are not associated with any partition of hard disk.


    The fourth column contains the options used while mounting the filesystem during
    the system boot using the mount command.


    The filesystem with the option autoao in the fourth field are not mounted during
    boot time.


    The defaults option mounts the filesystem with following options of mount rw,
    suid, dev, exec, auto, nouser, and async.


    - async: All I/O to the file system should be done asynchronously.

    - auto means automatically mounted at boot time.

    - dev: Interpret character or block special devices on the file system.

    - exec means allow execution of executable files,

    - rw means in read write mode,

    - suid: Allow set-user-identifier or set-group-identifier bits to take effect.

    - nouser: a non root user cannot mount the filesystem.


    ## 3.2.2./etc/mtstab


    To view the filesystems which are actually used by a Linux system type the command
    mount in terminal or view the contents of the /etc/mtstab file. The difference
    is /etc/fstab contains the static information about the filesystem while /etc/mtstab
    contains the dynamic information of the filesystem. The sample /etc/mtstab file
    below


    | /dev/sda1 | | rw | 00 |

    | proc | /proc proc | rw | 00 |

    | sysfs | /sys sysfs | rw | 00 |

    | devpts | /dev/pts | devpts | rw,gid=5,mode=620 | 00 |

    | /dev/sda12 | /opt | ext3 | rw | 00 |

    | /dev/sda10 | /usr | ext3 | rw | 00 |

    | /dev/sda9 | /home | ext3 | rw | 00 |

    | /dev/sda8 | /boot | ext3 | rw | 00 |

    | tmpfs | /dev/shm | tmpfs | | 00 |

    | none | /proc/sys/fs/binfmt_misc | binfmt_misc | rw | 00 |

    | sunrpc | /var/lib/nfs/rpc_pipefs | rpc_pipefs | rw | 00 |


    First column contains the disk partition which mounted.


    Second column contains the filesystem mounted.


    Rests of the columns are as that of the /etc/fstab file.


    ## 3.2.3.Mounting a filesystem


    To mount a filesystem mount command is used. The standard format of mount command
    is


    ```

    mount -t filesystem-type device-path-name directory-name

    ```


    If a user wants to mount cdrom media in directory /home/movie/home/movies then
    issue the command


    ```

    [root@localhost ~]# mount /dev/cdrom

    ```


    If a user wants to mount windows partition /dev/sda4 on /home/movie then issue
    the command


    ```

    [root@localhost ~]# mount -t vfat /dev/sda4 /home/movies

    ```


    ## 3.2.4.Unmounting a filesystem


    To unmount a filesystem use the following command


    ```

    umount directory-name- on-which-the-device-was-mounted

    ```


    To unmount the /dev/sda4 using the following command


    ```

    root@localhost ~#umount /home/movies

    ```


    To unmount a device when the device is no longer in use (at the time when the
    command is issued the device is in use so the command waits for the device). For
    example files are being copied from mounted directory /home/movies then below
    command will unmount the directory when copy is over.


    ```

    root@localhost ~#umount -l /home/movies

    ```


    To force unmounting of a directory use the below command


    ```

    root@localhost ~#umount -f /home/movies

    ```


    ## 3.2.5.Creating a filesystem


    A filesystem can be created on a device. A device can be floppy disks,rewritable
    Cd,rewritable DVDs and hard disk partitions.


    mkfs command is used to create the filesystems on a device. The format of the
    command is


    ```

    mkfs -t filesystem-type device-name

    ```


    For example ext3 filesystem is to be created on the re writable CD device then
    the command will be


    ```

    mkfs -t ext3 /dev/cdrom

    ```


    mkfs command is front end to the commands which are actually invoked to carry
    out the work of creating the filesystems on the device. The command which will
    be invoked depends on the filesystem which is to be created. Below is the list
    of commands and filesystems for which the commands will be invoked.


    | filesystem | Commands used |

    |---|---|

    | ext2 | mkfs.ext2, mke2fs, mkfs -t ext2 |

    | ext3 | mkfs.ext3, mke2fs, mkfs -t ext3 |

    | vfat | mkfs.vfat , mkfs -t vfat,mkdosfs,mkfs.mkdosfs |

    | ntfs | mkfs.ntfs,mkfs -t ntfs |

    | xfs | mkfs.xfs , mkfs -t xfs |

    | swap | mkswap |


    The commands mke2fs uses the configuration file /etc/mke2fs.conf. The configuration
    file contains the default parameters while creating the ext2 and ext3 filesystems.
    Below is the sample /etc/mke2fs


    [defaults]

    base_features=sparse,file,resize_inode,dir_index

    blocksize = 4096

    inode_ratio = 8192


    [fs_types]

    small = {blocksize = 1024, inode_ratio = 4096}

    floppy = {blocksize = 1024, inode_ratio = 4096}

    largefile = {inode_ratio = 1048576}

    largefile4 = {inode_ratio = 4194304}


    The defaults section of the file defines the default parameters used by mke2fs.
    The default parameters can be overridden from the command line. The fs_types section
    defines the default parameters which should be used for specific systems for blocksize
    is set to 1024.


    ## 3.3.Creating Swap space


    mkswap command is used to create a swap area on a device or file. If the system
    has less swap area no partition device can be used as swap area user is not willing
    to do that a swap area also can be created on a file. The file should be created
    using the following commands


    ```

    [root@localhost~]# dd=/dev/zero of=/home/swap bs=100000 count=10

    10+0 records in

    10+0 records out

    1000000 bytes (10 MB) copied, 0.37386 s,267 MB

    ```


    This creates a file named swap in the /home directory of size 10 MB. It is data
    (the output of the command swap will return data). The ls command below shows
    the file permissions attached with the swap file. The chmod command is used to
    change the file permissions of swap to 0 so that no one has the right to read,write
    or execute it.


    ```

    [root@localhost home]# ls -l swap

    -rw-r--r-- 1 root 1000000 2009-01-11 13:28 swap

    ```


    ```

    [root@localhost home]# chmod 0

    [root@localhost home]# ls -l swap

    ---------- 1 root 1000000 2009-01-11 13:28 swap

    ```


    Create swap space on the file


    ```

    [root@localhost home]# mkswap swap

    Setting up swapspace version 1, size = 994 kB

    ```


    ## 3.3.1.Enabling swap space


    The swap space created cannot be used by the system unless it is enabled using
    the swapapon command. The format of the swapapon command is


    ```

    swapapon device-name

    ```


    For example to enable the swap space created on the swap file above use the command


    ```

    [root@localhost home]# swapapon swap

    ```


    The file /proc/swaps shows the swap space area of the system. This file can be
    used to see whether the swap area is enabled by the system or not. To check the
    contents of the /proc/swaps enter the below command on terminal


    ```

    [root@localhost home]# cat /proc/swaps

    ```


    | Filename | Type | Size | Used | Priority |

    |---|---|---|---|---|

    | /dev/sda1 | partition | 819272 | 4 | -1 |

    | /home/swap | file | 9756 | 0 | -2 |


    The listing shows two swap areas on the system /dev/sda13 which is hard disk partition
    and /home/swap which is file.


    ## 3.3.2.Disabling swap space


    To disable a swap area use the swapoff. The format of the command swapoff is


    ```

    swapoff device-name

    ```


    To disable the swap area created on the file swap in case use the command


    ```

    [root@localhost home]# swapoff

    ```


    Now to check whether the swap file is disabled the contents of the file /proc/swaps


    ```

    [root@localhost home]# cat /proc/swaps

    ```


    | Filename | Type | Size Used | Priority |

    |---|---|---|---|

    | /dev/sda13 | partition | 819272 4 | -1 |


    ## 3.4.Checking and Repairing a filesystem


    The fsck command is used to check the linux filesystem and optionally repair it.
    The general format of the fsck command is


    ```

    fsck -t filesystem-type device-name

    ```


    If no device-name is specified on the command line then the command checks the
    filesystem in order they are mentioned in the /etc/fstab file.


    The fsck command is the end point to the commands which are invoked for different
    filesystem types. The command which will be invoked depends on the filesystem
    which is to be checked. Below is the list of commands and filesystems for which
    the commands will be invoked.


    | Filesystem | Commands used |

    |---|---|

    | ext2 | fsck.ext2, fsck -t ext2 |

    | ext3 | fsck.ext3, fsck -t ext3 |

    | vfat | fsck.vfat, fsck -t vfat,fsck.msdos |

    | ntfs | fsck.ntfs, fsck -t ntfs |

    | xfs | fsck.xfs, fsck -t xfs |

