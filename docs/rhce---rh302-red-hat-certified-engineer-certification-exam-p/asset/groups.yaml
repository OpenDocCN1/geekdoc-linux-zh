    ## 7.2.2. 将模块插入内核


    有时，如果硬件驱动程序不是内核的一部分，用户可能需要安装硬件设备。用户必须将驱动模块插入内核中。`insmod` 命令用于将驱动模块插入内核中。`insmod`
    命令的格式为：


    insmod file-name


    如果 file-name 为 –，则从标准输入读取模块。


    ## 7.2.3. 从内核移除模块


    `rmmod` 命令用于从内核中移除模块。该命令的格式为：


    rmmod module-name


    ## 7.2.4. 使用 modprobe 命令


    `modprobe` 命令可以将模块插入内核，也可以从内核中移除模块。


    `modprobe` 命令会插入其他依赖于通过命令插入的模块的模块。假设 module2 依赖于 module1，那么如果执行命令


    modprobe module1


    则 module1 和 module2 都会被插入，因为 module2 依赖于 module1。模块依赖关系列在位于 /lib/modules/*/uname
    -rf 目录下的 modules.dep 文件中。如果 module2 依赖于 module1，则该文件内容将为


    ```

    /lib/modules/*/kernel/crypto/module2.ko:

    ```


    ```

    /lib/modules/*/kernel/zlib_deflate/module1.ko

    ```


    ```

    /lib/modules/*/kernel/zlib_deflate/module1.ko

    ```


    在上面的示例中，模块 module1 和 module2 使用完全限定路径名列出。依赖模块位于分号左侧，独立模块位于分号右侧。


    但如果使用 `insmod` 命令，则只会插入 module1。


    命令 `modprobe -r module-name` 用于从内核中移除模块。


    示例 `modprobe.conf` 文件如下：


    ```

    alias eth0 via-rhine

    ```


    ```

    options snd-intel8x0 index=0

    ```


    ```

    install binfmt-0000 /bin/true

    ```


    `install` 选项用于运行模块名之后定义的命令。在上述情况下，如果执行命令


    modprobe binfmt-0000 /bin/true


    ## 7.3. 进程与内核信息


    ### 7.3.1. ps 命令


    `ps` 命令是一个用于获取系统中运行进程信息的命令。`ps` 命令有许多可用选项。命令 `ps aux` 用于显示系统当前正在运行的所有进程。


    ### 7.3.2. 更改进程优先级


    `renice` 命令用于更改运行进程的优先级。`renice` 命令的格式为：


    ```

    renice priority -p pid of process -u user-name -g group-id

    ```


    如果针对用户发布 `renice` 命令，该用户所有进程的优先级都会改变；如果针对组发布，则该组所有进程的优先级都会改变；如果针对进程 ID 发布，则更改该进程的优先级。


    ### 7.3.3. 使用 dmesg


    用于检查并打印启动消息。用户可以使用该命令捕消息。命令的格式为：


    ```

    dmesg -c -n level

    ```


    `-c` 选项在打印后清除内核环缓冲区。


    `-n` 选项设置将打印的消息级别。


    如果 level 的值为 1，则只打印严重错误消息。


    ```

    [root@localhost modprobe.d]# dmesg -c

    ```


    ```

    Linux version 2.6.21-1394.fc7 (kojibuilder@xenbuilder4.fedora.phx.redhat.com)
    (gcc version 4.1.2 200705202 (Red Hat 4.1.2-12)) #1 SMP Wed May 23 22:35:01 EDT
    2007

    ```


    BIOS 提供的物理内存映射：


    ```

    sanitize start

    ```


    ```

    sanitize end

    ```


    ```

    copy_e820_map() start: 0000000000000000 size: 0000000000009fc00 end: 0000000000009fc00
    type: 1

    ```


    ```

    ......

    ```


    ```

    ......

    ```


    ```

    ......

    ```


    是命令的输出。执行后，内核环缓冲区被清除，现在如果再次运行 `dmesg` 命令，将没有输出。


    ## 7.3.4. Syslog


    syslog 支持系统日志以及内核消息捕获。syslog 和 klogd 包含了 syslog 软件包，syslogd 支持系统日志。它使用配置文件 /etc/syslog.conf。该文件定义了不同系统消息将写入的文件。以下是
    /etc/syslog.conf 文件的示例：


    ```

    # 将所有内核消息记录到屏幕上。

    ```


    ```

    # 记录太多内容会弄乱屏幕。

    ```


    ```

    #kern.* /dev/console

    ```


    ```

    # 记录任何（邮件以外的）info 级或以上的消息。

    ```


    ```

    # 不记录私有认证！

    ```


    ```

    *info;mail.none;authpriv.none;cron /var/log/messages

    ```


    ```

    # authpriv 文件是有访问限制的。

    ```

    *authpriv.* /var/log/secure

    ```


    ```

    # 将所有邮件消息记录在一个地方。

    ```

    mail.* -var/log/maillog

    ```


    ```

    # 记录 cron 内容。

    ```

    cron.* /var/log/cron

    ```


    ```

    # 所有人接收紧急消息。

    ```

    *emerg

    ```


    ```

    # 记录 crit 级以上的错误到特殊文件。

    ```

    local.* /var/log/spooler

    ```


    ```

    # 将启动消息也记录到 boot.log。

    ```

    local.* /var/log/boot.log

    ```


    ## 7.4. 自动化任务 --


    上述文件定义包含授权和安全相关的消息。例如，PAM（可插认证模块）相关的消息记录在此文件中。cron 消息记录在文件中。文件名可以由 root 用户更改。klogd
    捕获消息。klogd 的进程 ID (PID) 定义在 /var/run/klogd.pid。内核消息源是 /proc/msg。如果文件不存在，klogd
    使用系统调用获取内核生成的任何消息。用户可以安排指定时间运行任务。at、batch 和 cron 设施用于在指定时间调度任务。


    ### 7.4.1. 使用 at


    `at` 命令用于在指定时间调度任务。该命令不能被所有用户使用。root 用户可以使用该命令。有两个文件决定哪些用户可以使用该命令。etc/at.allow
    列出允许使用命令的用户名。etc/at.deny 列出不允许使用命令的用户名。如果文件不存在，则首先检查 etc/at.allow 查看可以使用该命令的用户名。如果两个文件都不存在，则只有
    root 用户可以运行 `at` 命令。etc/at.allow 或 etc/at.deny 的示例格式为：用户名应每行一个，且用户名中不有空格。`at -l`
    命令用于列出所有调的任务（如果 root 用户运行此命令，将显示所有用户的调度任务）。列出的任务带有队列 的在队列中，带有 `=` 的正在执行，带有 `b`
    的在批队列中。


    ```

    [root@localhost ~]# atq

    ```


    | | | |

    | :--- | :--- | :--- |

    | 3 | Jan 16 22:44:00 2009 | a root |

    | 2 | Jan 16 22:49:00 2009 | a root |

    | 1 | Jan 16 23:39:00 2009 | = root |

    | 4 | Jan 16 23:03:00 2009 | a root |


    -m 在任务完成时，即使任务没有输出，也会向用户发送邮件。`at` 时间规格命令用于在那个时间调度任务。调度任务的三种方法是：


    ### 7.4.1.1. 使用管道


    可以使用管道调度命令列表，例如：


    ```

    [root@localhost ~]# ls -la | at now+5min

    ```


    ```

    job 1 at Fri Jan 16 22:39:00 2009

    ```


    要调度多个命令，请用分号分隔每个命令。


    ### 7.4.1.2. 使用 at 提示符


    如果输入时间规格，将向用户显示提示符，例如：


    ```

    [root@localhost ~#] at now+20min

    ```


    ```

    at> ps

    ```


    ```

    at> du

    ```


    ```

    at> <EOT>

    ```


    按下 CTRL+D 退出 at 提示符。在上面的示例中，ps 和 du 都调度了。


    ### 7.4.1.3. 使用文件


    `at-f filename time-specification` 命令用于通过文件名提供命令。文件的内容（文件名中的命令按时间规格执行）。


    atq – Atq 命令用于列出调度的任务。等同于


    ```

    at -l

    ```


    atrm – 命令用于删除调度的任务。格式为：


    ```

    atrm jobid

    ```


    在下例案例中，要删除任务 4，使用 `at -l` 命令给出所有调度任务的列表。


    ```

    [root@localhost ~#] at -1

    ```


    | | | |

    | :--- | :--- | :--- |

    | 3 | Fri Jan 16 22:46:00 2009 | a root |

    | 2 | Fri Jan 16 22:44:00 2009 | a root |

    | 1 | Fri Jan 16 22:39:00 2009 | = root |


    使用 atrm 删除任务 4。


