    ## 7.4.3.Using cron


    The cron facility is also used to schedule the jobs. The crontab jobs are executed
    by the cron daemon. The root user can access cron facility. The users can be given
    access to cron using two files.


    The /etc/cron.allow file is used to list the users who can use the cron facility.
    The /etc/cron.allow file is first searched by the cron facility if the file does
    not exist then the /etc/cron.deny file is searched. /etc/cron.deny lists the users
    names which are not allowed to access the cron facility. If both files don''t
    exist then only root user can use cron facility.


    The crontab -e command is used to create a crontab file. A text editor can be
    used to create a file-name.cron file.


