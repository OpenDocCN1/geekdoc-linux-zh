    ```bash

    SHELL=/bin/bash

    PATH=/sbin:/bin:/usr/sbin:/usr/bin

    MAILTO=

    HOME=/

    # run-parts

    01 **** root-parts /etc/cron.hourly

    02 4 *** root-parts /etc/cron.daily

    22 4 * 0 root run-parts /etc/cron.weekly

    42 4 1 * root run-parts /etc/cron.monthly

    ```


    The environment of the ( shell is set using this file.


    The SHELL parameter sets the shell to /bin/bash.


    The mail is done to root user (MAILTO parameter).


    The runparts define the time when the scripts in the directories /etc/cron.hourly,
    /etc/cron.daily, /etc/cron.weekly, and /etc/cron.monthly are executed by the cron
    daemon.


    ## 8. WEB SERVER


    ### 8.1.Overview


    The web server accepts the Hyper Text Transfer Protocol(HTTP) requests and sends
    a response to the client. The apache web server is the most used web server. The
    apache web server source code is freely downloadable.


    ### 8.2.Starting Apache


    The user should check whether the Apache web server is enabled in the runlevel
    or not. The chkconfig -list option is used to check whether the Apache web server
    is enabled or not.


    ```bash

    [root@localhost ~]# chkconfig --list

    httpd 0:off 1:off 2:on 3:on 4:on 5:on 6:off

    ```


    The httpd daemon corresponding to the Apache web server is enabled in runlevel
    2,3,4,5. If the service is not enabled then the command chkconfig httpd on is
    used. If the service is enabled in runlevel use the command service httpd to start.


    ```bash

    [root@localhost ~]# service httpd

    ```


    Starting httpd: [ OK ]


    After starting the service check the working of Apache web server by typing the
    address http://localhost in the address bar of the Mozilla Firefox (web browser)(img/01872e44db1c79895b48a6.png).
    This page is used to test the operation of the Apache HTTP server after it has
    been installed. If you can read this it means that the web server installed on
    this site is working properly, but has not been configured.


    - If you are a member of the general public: The fact that you are seeing this
    address that you just listed

    - If you are the website administrator: you may now add content to the directory
    /var/www/html/ until you so


    The Apache web server configuration directory is /etc/httpd. The directory contains
    configuration file, sub directories and symbolic links to other directories.


    ```bash

    [root@localhost httpd]# ls -l

    ```


    ```

    total 36

    drwxr-xr-x 2 root 4096 Jan 01 conf

    drwxr-xr-x 2 root 4096 Jan 01 conf.d

    lrwxrwxrwxx 1 root 19 Jan 01 logs -> ../var/log/httpd

    drwxr-xr-x 3 root 4096 Jan 01 modsecurity

    lrwxrwxrwxx 1 root 27 Jan 01 modules -> ../usr/lib/httpd/modules

    lrwxrwxrwxx 1 root 13 Jan 01 run -> ../var/run

    ```


    The conf directory contains the main Apache configuration file httpd.conf.


    The conf.d contains the configuration files relating to the languages(like Python,Perl,PHP),database(Mysql)
    and the authorization modules.


    The logs directory is symbolic link to /var/log/httpd directory which contains
    the httpd log information the modsecurity directory contains files relating to
    the security, http policy, and protocols related.


    The modules directory is symbolic link to the /usr/lib/httpd/modules directory
    which contains the library files for the Apache web server.


    The run directory contains the symbolic link to /var/run which contains the httpd.pid
    file which contains the PID of httpd daemon.


    ## 8.3.Main Configuration file


    /etc/httpd/conf/httpd.conf file is main configuration file for Apache web server.
    The file is divided into three parts:


    - Configuration directives for Apache web server process as whole.

    - Configuration parameters for the main server (not virtual hosts but these parameters
    also set default values for all virtual hosts)

    - Settings for virtual hosts.


    ### 8.3.1.Global Environment Configuration


    In the global environment configuration section the following attributes are set


    ```bash

    # Don''t give away too much information about all components

    # we are running. Comment out this line if you don''t mind remote sites

    # finding out what optional modules you are running

    ServerTokens OS

    ```


    This hides the additional subcomponent modules from the remote sites. The additional
    component configuration files reside in the /etc/httpd/conf.d directory.


    ```bash

    # ServerRoot: the top of the directory tree under which the server''s

    # configuration, error, and log files are kept.

    ServerRoot "/etc/httpd"

    ```


    The server root names the main directory where all the server information is kept.


    ```bash

    # Timeout: the number of seconds before receives and sends timeout.

    Timeout 120

    ```


    The server will wait for 120 secs for a response and after that the connection
    will timeout.


    # Listen: Allows you to bind Apache to specific IP addresses and/or ports, in
    addition to the default

    Listen 80


    In this case apache listens to port number 80. The port number can be changed
    to any port number by the user.


    ### Dynamic Shared Object (DSO) Support


    ```bash

    LoadModule auth_basic_module modules/mod_auth_basic.so

    LoadModule auth_digest_module modules/mod_auth_digest.so

    LoadModule authn_file_module modules/mod_authn_file.so

    ```


    The LoadModule loads the modules from the /usr/httpd/modules directory (the directory
    /etc/httpd/modules is a symbolic link to apache directory).

