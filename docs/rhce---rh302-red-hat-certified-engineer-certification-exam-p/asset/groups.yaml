    ## 15. DHCP 服务器


    ### 15.1. 概述


    DHCP 代表动态主机配置协议。DHCP 服务器用于为其网络中的计算机分配 IP 地址、子网掩码、DNS 服务器和其他信息。客户端计算机必须选择它们想要使用
    DHCP 服务器来获取 IP 地址、子网掩码和 DNS 服务器等信息。服务器向客户端提供请求的信息。


    ### 15.2. 启动 DHCP 服务器


    要检查 DHCP 服务器的状态，在终端中运行上述命令：


    ```

    chkconfig --list dhcpd

    ```


    如果服务未运行，则通过发布命令启用服务：


    ```

    chkconfig dhcpd on

    ```


    启用后，用户可以使用命令运行 dhcpd 服务：


    ```

    service dhcpd start

    ```


    ## 15.3. 配置文件


    DHCP 服务器的配置文件是 `/etc/dhcpcd.conf`。该配置文件用于列出 IP 地址范围，服务器将从该范围为网络上的计算机分配 IP 地址。它还可以包含为网络上特定的以太网地址分配特定地址的选项。


    ## 15.4. DHCP 服务器的工作


    `/var/lib/dhcp/dhcpcd.leases` 文件包含了客户端是否已由 DHCP 服务器 分配了地址的信息。对于每个分配了地址的客户端，`/var/lib/dhcp/dhcpcd.leases`
    文件中都有一组租约行。


    在客户端计算机上，如果用户输入命令 `ifconfig -a`，对于使用 DHCP 服务器 分配了 IP 地址的以太网接口，用户将看到 `/etc/dhcpcd.conf`
    文件中提到的 IP 地址。


    ## 15.5. DHCP 客户端


    可以使用网络配置（Network Configuration）工具配置 DHCP 客户端。要调用网络配置窗口，在终端窗口输入以下命令：


