    ```


    - The first field is minute (0-59)

    - The second field is hour (0-23)

    - The third field is day (0-31)

    - The fourth field is month (0-12). Jan,Feb,mar,Apr format is also used.

    - The fifth field is day of week(0-7). Sun,Mon,Tue format is also used. 0 and
    7 are used for Sunday

    - The value * in fields denotes all possible value.

    - After the times the command field follows.


    The crontab command -l is used to list all the crontab jobs.


    ```bash

    [root@localhost at]## crontab -l

    ```


