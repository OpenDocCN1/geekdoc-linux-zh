    The runlevels 0, 1 and 6 are reserved. Other runlevels like 7, 8, 9, a, b, c are
    also available but are not used.


    ### 2.3.4.Initializing System


    The script /etc/rc.sysinit is run once at the boot time. It is a shell script
    which performs many functions:


    - sets the hostname of the system

    - checks SELinux status

    - sets the system clock

    - Initializes hardware

    - Configures kernel parameters

    - Mounts the filesystems

    - Configures the hardware

    - Starts and enables the swap space


    ### 2.3.4.1.Starting Services


    The services which will be started for a runlevel depend on the files contained
    in the directory of the runlevel.


    | runlevel | directory |

    | 0 | /etc/rc.d/rc0.d |

    | 1 | /etc/rc.d/rc1.d | own| 2 | /etc/rc.d/rc2.d |

    | 3 | /etc/rc.d/rc3.d |

    | 4 | /etc/rc.d/rc4.d |

    | 5 | /etc/rc.d/rc5.d |

    | 6 | /etc/rc.d/rc6.d |


    All programs in the directories of the above runlevel are symbolic links to programs
    in the directory /etc/rc.d/init.d. The directory /etc/rc.d/init.d contains the
    run scripts. Thus for a runlevel, which scripts of the directory /etc/rc.d/init.d
    are to be run depends on the contents of the directory corresponding to the runlevels.


    ### 2.3.4.2.Naming convention of files in runlevel directories


    The files in the runlevel directories have a special naming convention. Name of
    all the programs either starts with S or K followed by 2 digits (0-9) and after
    that the name of the service. All the programs (of runlevel directories) whose
    name begin with S start the service and those whose name begin with K stop the
    service.


    The two digits determine the order in which the services will run. E.g. the directory
    /etc/rc.d/rc5.d contains files for runlevel 5. It contains two files S10network
    and S56Inetd, then the service S10network is run first. The concept of deciding
    the order in which the scripts will run remains the same for the files with name
    beginning with K.


    ### 2.3.4.3.Format of scripts in /etc/rc.d/init.d


    The directory contains the scripts of all the runlevels. Below is the sample file
    to start the network service.


    ```

    #! /bin/bash


    #


    # network Bring up/down networking


    #


    # chkconfig: 2345 10 90


    # description: Activates/Deactivates all network interfaces configured to

    # start at boot time.

    ```


    ### BEGIN INIT INFO

    # Provides: $network

    ### END INIT INFO


    The line `# chkconfig: 2345 10 90` sets the script to start in the runlevels 2,
    3, 4 and 5 with the priority or order 10 and in case of other runlevels it stops
    the service with the order or priority 90.


    In the runlevel 5 directory /etc/rc/rc5.d a file with name S10network will exist
    (as network service starts for runlevel 5 with the priority 10) and in the runlevel
    directory /etc/rc/rc1.d a file with name K90network will exist as network service
    stops with the priority 90 in runlevel 1.


    ### 2.3.4.4.Determining current and previous runlevel


    To determine current and previous runlevel use the below command:


    ```

    [root@localhost ~]# runlevel

    ```


    N 5


    The letter N denotes that there is no previous runlevel (that is, runlevel has
    not been changed). 5 denotes that the current runlevel is 5.


    ### 2.3.4.5.Changing runlevels


    To change the current runlevel use the below command:


    ```

    [root@localhost ~]# telinit n

    ```


    The letter n should be replaced by the values 0, 1, 2, 3, 4, 5, 6; that is, use
    telinit 5 to switch to runlevel 5. The init process kills the processes necessary
    to switch to that runlevel; in the above case it will do it for runlevel 5.


    ### 2.3.4.6.Configuring services for a runlevel


    User can decide the services which should run in a runlevel and which should not
    run in a runlevel. User can also see the status of each service in each runlevel.


    There are two methods to reorganize the services and view the information about
    the services in a runlevel.


    ### 2.3.5.Using command chkconfig


    The command chkconfig can be used to view the information about every service
    in a runlevel and start or stop them. It can also be used to add a new service
    or delete a new service as well.


    ### 2.3.5.1.Adding a new service


    To add a new service enter the below command in terminal:


    ```

    [root@localhost ~]# chkconfig --add newservice

    ```


    ### 2.3.5.2.Deleting a service


    To delete a service enter the below command in terminal:


    ```

    [root@localhost ~]# chkconfig --del newservice

    ```


    ### 2.3.5.3.Enable a service


    To enable a service enter the below command (while working in runlevel):


    ```

    [root@localhost ~]# chkconfig newservice on

    ```


    ### 2.3.5.4.Disable a service


    To disable a service enter the below command (while working in runlevel):


    ```

    [root@localhost ~]# chkconfig newservice off

    ```


    ### 2.3.5.5.List status


    To list the status of a service enter the below command:


    ```

    [root@localhost ~]# chkconfig --list newservice

    ```


    ### 2.3.5.6.Starting a service


    To start a service enter the below command:


    ```

    [root@localhost ~]# chkconfig newservice start

    ```


    ### 2.3.5.7.Stopping a service


    To stop a service enter the below command:


    ```

    [root@localhost ~]# chkconfig newservice stop

    ```


