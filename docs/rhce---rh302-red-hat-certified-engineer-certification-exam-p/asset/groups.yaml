    # chainloader +1


    The title is used to set the display name on the grub menu corresponding to the
    operating system. E.g. on grub menu:


    # Fedora-Linux


    # Windows


    is displayed.


    If user chooses fedora Linux on menu then the bootloader sees /dev/sda8 partition
    of the first hard disk (root (hd0,7) means the files needed to boot the operating
    system is present on the eighth partition of the first hard disk.


    kernel indicates the kernel which is loaded. The kernel gives the control to the
    init process which is called father of all processes. The initrd denotes the initial
    RAM disk boot image.


    The ro option on the kernel line means the partition is to be mounted read only.


    If the user chooses the windows option then the windows operating system is booted.


    The rootnof (hd0,0) means that grub will not mount the partition.


    The option chainloader +1 means that grub will call the other boot loader to boot
    the operating system.


    The option timeout=0 means that if user makes no choice then the first operating
    system in the file will be booted.


    The option timeout=5 means that the user will have to make choice in 5 seconds
    on the grub menu. If the user makes no choice in 5 seconds then the default operating
    system will boot.


    In the above file the default operating system that will boot is Fedora.


    ## 2.2.2.Configuring Grub


    There are two ways to configure the grub bootloader.


    - By editing the configuration file using text editors

    - by using Boot Configuration


    ## 2.2.2.1.Editing /grub/grub.conf using Text editors


    The configuration file can be edited using any of the text editors like vi, edit,
    and emacs. After making the changes grub has to be restarted to make the changes
    take place.


    ## 2.2.2.2.By using Boot Configuration


    To start the boot configuration graphical utility type the below command in the
    terminal window:


    ```

    [root@localhost ~]# system-config-boot

    ```


    ![](img/01872e44e0db1c79895b45feb5b484a6_28_0.png)


    The utility helps to choose operating system which will be booted in case user
    has not made any choice within the time period on the grub menu. It also helps
    the user to choose the timeout period in seconds. If the user chooses 5 seconds
    then grub will wait for 5 seconds for user to make a choice after it will boot
    the default operating system.


    ## 2.2.2.3.Password Protecting Grub


    Grub can also be password protected. This option is also available during the
    installation of Red Hat Linux. The MD5-encrypted password for grub can be generated
    using the command:


    ```

    [root@localhost ~]# man grub-md5-crypt

    ```


    in terminal. After entering the command the user is prompted to enter the password
    and then to verify the password user has reenter the password.


    ## 2.3.Starting init


    init is the father of all processes. The kernel starts the init process after
    mounting basic filesystems during the boot process. The init process has the pid
    (process identification number each and process running on the system has a unique
    number assigned to know them as PID) of 1.


    init looks to the file /etc/inittab and runs the script in the file /etc/inittab.
    The init process looks for the entry initdefault indicates the default runlevel
    with which system needs to be started up. If the initdefault is not mentioned
    in the file then the user has to enter the runlevel values in the console for
    the boot process to proceed.


    ## 2.3.1./etc/inittab file


    This file describes which processes are started at boot and during normal boot
    process (for run levels different numbers of processes are started). An entry
    in the inittab file has the following format:


    ```

    id:runlevel:action:process

    ```


    - id is the unique identifier.

    - runlevel is the value between 0,1,2,3,4,5 and 6 (some more values are available
    but not used). The runlevel of sysinit, boot, and bootwait entries are ignored.

    - Action describes the action to be taken.

    - process specifies the process to be executed.


    | init Action | Description |

    | :--- | :--- |

    | respawn | The process is restarted for this action. |

    | wait | The process will be started once when the specified runlevel is entered
    and init will wait for its termination. |

    | initdefault | an initdefault entry specifies the runlevel |

    | sysinit | entered after system boot. If none exists, init will prompt for runlevel
    on console. The process field is ignored. The process will be executed during
    system boot. The runlevel field is ignored. |

    | ctrltaltdel | If the user presses CTRL+ALT+DELETE keys of the keyboard together
    then the init responds by shutting down the system or rebooting (depending on
    the process set) |

    | powerfail | this action denotes that power failure has occurred and init takes
    the action depend-upon the process set for this action |

    | Powerokwait | If the powerfail action has occurred and the process mentioned
    for the powerfail action is to shutdown after 2 minutes then this action comes
    into picture if the power is restored before 2 minutes then the process for this
    action takes place. |


    Lines beginning with ''# /etc/'' are comments.


