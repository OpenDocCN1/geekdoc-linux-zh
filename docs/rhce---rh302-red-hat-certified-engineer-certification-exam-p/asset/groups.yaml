    # This self-study exam preparation guide for the RHCE - RH302 Red Hat Certified
    Engineer exam contains everything you need to test yourself and pass the Exam.
    Including all the exam topics, covered indeth and insider secrets, complete explanations
    of all RHCE subjects, test tricks and tips, over 250 realistic sample questions,
    and exercises designed to strengthen understanding of the RHCE concepts and prepare
    you for exam success on the first attempt are provided.


    Can you imagine valuing a book so much that you send the author "Thank You" letter?


    This book includes new exercises and sample questions never before print. Offering
    numerous sample questions, critical-saving tips plus information available nowhere
    else, this book will help you pass the RHCE - RH302 Red Hat Certified Engineer
    exam on your FIRST try.


