    ## 3.2.2./etc/mtstab


    要查看 Linux 系统实际使用的文件系统，请在终端输入 `mount` 命令或查看 `/etc/mtstab` 文件的内容。区别在于 `/etc/fstab`
    包含文件系统的静态信息，而 `/etc/mtstab` 包含文件系统的动态信息。下面的 `/etc/mtstab` 文件示例：


    | /dev/sda1 | | rw | 00 |

    | proc | /proc proc | rw | 00 |

    | sysfs | /sys sysfs | rw | 00 |

    | devpts | /dev/pts | devpts | rw,gid=5,mode=620 | 00 |

