    # INSTALLATION AND HARDWARE CONFIGURATION


    # 1.1.Overview


    Red Hat Linux is one of the major commercial Linux distributions available in
    market . Fedora Core Linux is an open source project of Red Hat. New version of
    Fedora Linux is released every six months.


    # 1.2.Installation


    Anaconda is the default installer in Red Hat Linux. The installation process can
    be broadly divided into many parts depending on the method used for installation


    +   * DVD

    * Network

    * Hard Disk


    # 1.2.1.Using DVD


    To begin installation using the DVD place the DVD media in the DVD drive of the
    computer and set the BIOS to boot from DVD drive. The steps of the installation
    process are


    +   * The DVD media is checked

    * Choose language to use during installation process.

    * Choose keyboard layout.

    * Choose install type. User can choose for new install


    or upgrade an existing installation.


    +   * Choose the software packages to install.

    * Choose partition scheme (options are automatic partition or manual partition)
    .

    * Choose partitioning (options are free space on hard disk,use current Linux partitions,use
    hard disk,and custom partition)

    * If custom partition option is create at least one / partition and swap partition
    (for dual boot system)

    * Install the boot loader to MBR.

    * Configure the network device.

    * Set the firewall options.

    * Choose the languages system should support.

    * Choose the time zone in system is.

    * Enter the root password.

    * Select the packages.


    After installation is complete remove the DVD media from DVD drive. The user had
    to accept the License terms,Configure the firewall,Configure the sound card.'
  - '[PAGE 15]


    15


    Then the user is prompted for user name and password on the login screen.


    # 1.2.2.Using Hard Disk


    For installation from hard disk it is assumed that Red hat Linux is already running
    on the computer. In the hard disk install copy all the files of the DVD in a partition
    drive which is used during the new installation.


    Then copy the vmlinuz and initrd files of the DVD media in /boot directory. These
    files are needed to boot the installation process. GRUB is installed as the bootloader
    in Red Hat by by default. To boot the installation process the boot loader should
    be informed about the files copied in the /boot directory.


    The following entry is added in the /boot/grub/grub.conf file to achieve the purpose


    ```

    title Red Hat-Installation

    root (hd0,7)

    kernel /vmlinuz

    initrd /initrd.img

    ```


    root(hd0,7) means that /boot partition exists on eighth partition of first hard
    disk.


    After above steps reboot the computer. Choose Red Hat Installation on the Grub
    menu to begin the install process.


    # 1.2.3.Using Network


    For the network installation the installation files should be copied to the computer
    which will act as install server.


    In case of web server or HTTP server the files need to be copied in the directory
    /var/www/html.


    In case of NFS server the directory containing the installation files should be
    made accessible.


    In case of FTP server copy the files to directory /var/ftp/pub.'
