    ## 9.3.Cache Manager utility


    The cache manager is a cgi utility for displaying information about the squid
    http proxy process as it runs. The configuration file for cache manager is /etc/squid/cachemgr.conf.
    The configuration file controls which servers will be managed by the cache manager.


    ```

    # This file controls which servers may be managed by

    ```


    ```

    # the cachemgr.cgi script

    ```


    ```

    #

    ```


    # The file consists of one server per line on the format


    # hostname:port description


    #


    # Specifying :port is optional. If not specified then


    # the default proxy port is assumed. :* or :any matches


    # any port on the target server.


    #


    # hostname is matched using shell filename matching, allowing


    # * and other shell wildcards.


    localhost


    In the above example the localhost server is managed by the cache manager.


    The cache manager can be invoked by typing the address http://server-name/cgi-bin/cachemgr.cgi.


    ## 9.4.Squid Daemon


    The squid daemon receives the configuration information from the squid daemon
    configuration /etc/sysconfig/squid. The sample format of the file


    # default squid options


    # -D disables initial dns checks. If you most likely will not to have an


    # internet connection when you start squid, uncomment this


    SQUID_OPTS="-D"


    # Time to wait for Squid to shut down when asked. Should not be necessary


    # most of the time.


    SQUID_SHUTDOWN_TIMEOUT=100


    After making changes in the configuration file restart the squid daemon if the
    squid daemon is already running using the command


    ```

    [root@localhost squid]# /etc/init.d/squid restart

    ```


    | Stopping squid:. | [ OK ] |

