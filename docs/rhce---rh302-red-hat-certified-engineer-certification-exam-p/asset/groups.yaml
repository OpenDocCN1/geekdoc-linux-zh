    - 情况 2：如果同时指定了所有者和组，则文件所有者将更改为 owner，文件组将更改为 group。

    - 情况 3：如果未指定所有者但指定了组，则文件的组将更改为 group。

    - 情况 4：如果所有者和组均未指定，则不发生任何变化。


