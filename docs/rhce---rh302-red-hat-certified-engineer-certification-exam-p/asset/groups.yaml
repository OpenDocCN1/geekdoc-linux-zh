    ## SYSTEM ADMINISTRATION


    ### 6.1. Overview


    The root user can perform all the tasks on the system. The root user is administrator
    account Red Hat Linux. During installation the root account must to create.


    ### 6.2.Getting Administration


    ### 6.2.1.The su command


    The su command is used to change the user id and group id of the user issuing
    the command to that of user. The format of su command is


    ```

    su user-name

    ```


    If user has entered this command in terminal then he will have the privilege of
    user-name (he can perform all actions using the terminal. Outside that terminal
    he won''t have the privilege of root).


    ### 6.2.2.Using the su


    Using the su command can also get privilege of root user but the user will be
    prompted for root user''s password. The user id and group ids below 500 are reserved
    for administrative users. There are some administrative accounts which are automatically
    created by Linux but the user accounts cannot be used to login into system as
    they are defined with /sbin/nologin. The user accounts are listed in the file
    /etc/passwd


    ```

    root:x:0:0:root:/bin/bash

    ```


    ```

    bin:x:1:1:bin:/sbin/nologin

    ```


    ```

    daemon:x:2:2:daemon:/sbin/nologin

    ```


    ```

    admin:x:3:4:admin:/var/admin:/sbin/nologin

    ```


    ```

    lp:x:4:7:lp:/var/spool/lp:/sbin/nologin

    ```


    ```

    sync:x:5:0:sync:/bin/sync

    ```


    ```

    shutdown:x:6:0:shutdown:/sbin/shutdown

    ```


    ```

    halt:x:7:0:halt:/bin/halt

    ```


    ```

    mail:x:8:12:mail:/var/spool/mail:/sbin/nologin

    ```


    The users bin,daemon,mail,and are defined with /sbin/nologin so those user accounts
    cannot be used to login into system. The root user must be created on a Linux
    machine and all other user accounts in above sample are automatically created.


    ### 6.2.3.Administrative commands


    ### 6.2.3.1./sbin and /usr/sbin directory


    The directory /sbin and /usr/sbin contain administrative commands. Only root user
    can use the commands Others must have given privilege to use those commands. The
    privilege can granted by the root user only.


    ### 6.2.4./etc/sudoers file


    The file /etc/sudoers defines group of similar command under an alias name. For
    example


    ## Command Aliases


    ## These are groups of related commands...


    ## Networking


    Cmd_Alias NETWORKING = /sbin/route, /sbin/ifconfig, /bin/ping, /sbin/dhclient,
    /usr/bin/net, /sbin/iptables, /usr/bin/rfcomm, /usr/bin/dial, /sbin/iwconfig,
    /sbin/mii-tool


    ## Installation and management of software


    Cmd_Alias SOFTWARE = /bin/rpm, /usr/bin/update, /usr/bin/yum


    ## Services


    Cmd_Alias SERVICES = /sbin/service, /sbin/chkconfig


    ## Updating the locate database


    Cmd_Alias LOCATE = /usr/sbin/updatedb


    ## Storage


    Cmd_Alias STORAGE = /sbin/fdisk, /sbin/sfdisk, /sbin/parted, /sbin/partprobe,
    /bin/mount, /bin/umount


    At first command aliases are defined in the /etc/sudoers file. STORAGE is defined
    for the commands /sbin/fdisk,/sbin/sfdisk,/bin/mount /bin/umount.


    In above case the command mount is in directory /bin. The explanation is any user
    can use mount to view the filesystems currently mounted on the system but only
    root can use it to mount a filesystem. Since normal users can not use commands
    in /sbin directory that is why mount command is in /bin directory.


    Then in the line /etc/sudoers default groups are defined with different levels
    of privilege.


    ```

    ## Allow root to run any commands anywhere

    ```


    ```

    root ALL=(ALL) ALL

