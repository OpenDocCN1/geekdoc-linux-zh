    # 18.NETWORK SECURITY


    #  18.1.Overview


    Network security is becoming a vital and challenging task. If a system is connected
    with network then the administrator should pay considerable attention to network
    security.


    # 18.2.The daemon xinetd


    The daemon xinetd is started when the system boots and listens on lot of ports
    corresponding to the services configured in the configuration of the xinetd daemon
    /xinetd.conf.


    The directory /etc/xinetd.d contains files describing to the services which xinetd
    will start if connection is made to that port number. These services are called
    on demand services and can be seen using the command


    ```

    root@localhost xinetd.d# system-config-services

    ```


    ![](img/01872e44e0db1c79895b45feb5b484a6_155_0.png)


    or by viewing the contents of the directory /etc/xinetd.d


    ```

    root@localhost:~# cd /etc/xinetd.d;ls

    ```


    charger-dgram daytime-dgram discard-stream rsync time-dgram'
  - '[PAGE 156]


    156

    charger-stream daytime-stream echo-dgram tcpmux-server time-stream cvs discard-dgram
    echo-stream tftp


    Each file correspond to a service which xinetd automatically starts when connection
    is made to that port.


    This on demand services should not be accessible by everyone. The access can be
    selective by the use of TCP wrappers.


    # 18.3.Using TCP wrappers


    The tcpd (tcp wrapper daemon) program can be set up to monitor incoming requests
    for xinetd services or in other words services which xinetd supports and also
    services that have one to one mapping onto executable files.


    If tcp wrapper is used if a client makes connection at a port for services like
    finger,talk,telnet and rsh (xinetd service) then first tcp wrapper daemon determines
    whether the connection will be allowed or refused. If the connection is allowed
    then the corresponding service is invoked to listen at the port. The tcpd authenticates
    the client using the files /etc/hosts.allow and /etc/hosts.deny.


    # 18.3.1./etc/hosts.allow


    It contains the list of ip address and subnet masks of clients who are allowed
    connection. This file is first scanned by tcpd.


    # 18.3.2./etc/hosts.deny


    Iit contains the list of ip address and subnet masks of clients who are not allowed
    connection. This file is scanned by tcpd after scanning the /etc/hosts.allow file.


    If an address is not specified in any file the connection is allowed.


    Format of the files /etc/hosts.allow and /etc/hosts.deny are same. The keyword
    ALL is specified for all clients. For example


    ```

    in.telnetd: .example.com

    fingered: ALL

    ```


    the connection for the telnet is allowed for clients from domain example.com and
    connection for the finger is allowed for all the clients.'
- md: '

    The service daemon is listed on the left if two service daemons are to be listed
    then the daemons are separated by comma (,) character. The semicolon acts as a
    separator between the daemon names and the address part. If multiple address is
    to be mentioned then the addresses are separated by comma.


    The ALL flag enables user to make the files as restrictive as it can be made.
    This enhances security.


    ## 18.4.Security Level Configuration


    The Security Level Configuration utility is used to set the security level of
    the system. To invoke the Security Level Configuration utility enter the below
    command in the terminal window


    ```

    [root@localhost~]# system-config-securitylevel

    ```


    ![](img/01872e44e0db1c79895b45feb5b484a6_157_0.png)


    On the Firewall Options tab the user can set the firewall is enabled or disabled.
    The trusted services are allowed to pass through the firewall. On the other ports
    the user can add the trusted ports by clicking on the Add button clicking on the
    Add button displays the below panel


    ![](img/01872e44e0db1c79895b45feb5b484a6_158_0.png)


    On the add port panel the user can enter the port and also the protocol (tcp and
    udp). after entering the value press ok.


    The user can click on the Advanced options tab to add a file containing iptables
    rules in the iptables save format. This allows user to add more complex rules
    and also customize the firewall.


    ![](img/01872e44e0db1c79895b45feb5b484a6_158_1.png)


    The user can browse and upload the file containing the user defined rules. After
    making the changes click on apply and then OK.


    ## 18.4.1.Configuration files


    There are two configuration files /etc/sysconfig/iptables and /etc/sysconfig/iptables-config.


    The file /etc/sysconfig/iptables contains the security level currently imposed
    on the system.

    This file is written by the Security Level Configuration utility.


    The file /etc/sysconfig/iptables-config is used to, load additional iptables modules.
    The additional modules help in NAT filtering and helpers. The sample /etc/sysconfig/iptables-config
    file is


    ```

    IPTABLES_MODULES="ip_conntrack_netbios_ip_conntrack_ftp"

    ```


    The directive IPTABLES_MODULES defines the modules which are loaded. In above
    example the modules ip_conntrack_netbios_ip_conntrack_ftp are loaded.


    - # Save current firewall rules on restart.

    - # Value: yes|no, default: no

    - # Saves all firewall rules to /etc/sysconfig/iptables if firewall gets restarted.


    ```

    IPTABLES_SAVE_ON_RESTART="no"

    ```


    If the value is yes then the rules are saved to the file /etc/sysconfig/iptables.


    ## 18.5.Command Reference


    | Command | Description |

    |---|---|

    | iptables -A | To append a security rule in current iptables rule |

    | iptables -D | Delete a rule |

    | iptables -R | Replace a rule |

    | iptables -I | Insert a rule |

    | iptables -L | List all rules |


    ## 19.PAM AND SELINUX


    ## 19.1.PAM


    PAM stands for Pluggable Authentication module. PAM is a system of libraries that
    handle the authentication tasks of applications (services) on the system.


    The configuration file /etc/pam.conf or the files in the directory /etc/pam.d
    is used for configuring-PAM. The contents of the file /etc/pam.conf is ignored
    if the files in the directory /etc/pam.d are present.


    ## 19.2./etc/pam.d


    The files in the directory /etc/pam.d correspond to the services which use PAM
    for authentication. For example the file passwd in the above directory contains
    the following line


    ```

    #%PAM-1.0

    auth include system-auth

    account include system-auth

    password include system-auth

    ```


    the first line is a comment.


    The second line contains the rule for the PAM. The format of the next lines are
    or rule lines


    type control module- path module-argument


    The type in above case is auth.


    PAM allows four types account, password, authentication, and session.


    - Account – the account type defines access to a service based on the availability
    of resource, time and other parameters.

    - authentication(auth) – the authentication type prompts the user for a password
    and if the user provides he/she can access the service.

    - Password – the password type is used to update the user information like changing
    user password.

    - Session – this type is used to perform the jobs (like logging) before a user
    access a service or after a user access service.


    The valid values for the control include required, sufficient, and optional.


    - Required – means that pam will return failure if this PAM modules returns failure.
    let three modules are called and if this module returns false then the resultant
    will be false but pam will call all the modules which are called for the process.

    - Sufficient – means that PAM returns success if this module returns success and
    other PAM modules will not be called which are to called for the process.

    - Optional – the success and failure of this module is this module returns PAM
    modules returns failure. let three modules are called and if this module returns
    false then the resultant will be false but pam will call all the modules which
    are called for the process. The format of the next lines are or rule lines


