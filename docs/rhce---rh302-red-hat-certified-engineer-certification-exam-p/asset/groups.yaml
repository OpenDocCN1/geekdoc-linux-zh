    ## 14.5. 信息映射


    `/etc/nsswitch.conf` 用于将 NIS 包含在客户端系统的文件搜索路径中。示例 `/etc/nsswitch.conf` 为：


    # 合法的条目有：


    ```

    # nisplus or nis+ 使用 NIS+ (NIS 版本 3)

    ```


    ```

    # nis or yp 使用 NIS (NIS 版本 2)，也称为 YP

    ```


    ```

    # dns 使用 DNS (域名系统服务)

    ```


    ```

    # files 使用本地文件

    ```


