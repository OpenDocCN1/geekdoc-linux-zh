    # ## 2.THE BOOT PROCESS


    # ### 2.1.Overview


    The boot process can be divided into many steps.


    +   - Checking of MBR (Master boot record) by BIOS.

    - Loading the bootloader in MBR.

    - Choosing Operating system to boot on bootloader menu.

    - Booting the Operating System


    # ### 2.2.Grub


    Grub is default bootloader if Red Hat Linux is installed in the system. When a
    system is booted the user sees the grub menu. The grub menu lists the operating
    systems which are installed on the system.


    Grub is able to boot non Linux operating system like Windows also. Grub boots
    the operating system chosen by the user on the grub menu. Every operating system
    displayed on the grub menu has its listing in the grub configuration file /boot/grub/grub.conf.'
