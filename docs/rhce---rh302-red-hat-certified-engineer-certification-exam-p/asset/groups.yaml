    ## 7.2.2.Inserting module into kernel


    Sometimes a user might need to install a hardware device if the hardware driver
    is not part of the kernel. The user has to insert the driver module into the kernel.
    The insmod command is used to insert a driver module into the kernel. The format
    of the insmod command is


    insmod file-name


    if the file-name is –- then the module is taken from the standard input.


    ## 7.2.3.Removing module from kernel


    The rmmod command is used to remove a module from the kernel. The format of the
    command is


    rmmod module-name


    ## 7.2.4.Using modprobe command


    The modprobe command can be used to insert a module into kernel ,and remove a
    module from the kernel.


    The modprobe command inserts other modules which are dependent on the module inserted
    using the command. Let module2 is module dependent on module1 then if the command


    modprobe module1 is executed the modules module1 and module2 both are inserted
    as the module2 is dependent on module1. The module dependencies are listed in
    the modules.dep file located in the directory /lib/modules/*/uname -rf. If module2
    is dependent on module1 then the file contents will


    ```

    /lib/modules/*/kernel/crypto/module2.ko:

    ```


    ```

    /lib/modules/*/kernel/zlib_deflate/module1.ko

    ```


    ```

    /lib/modules/*/kernel/zlib_deflate/module1.ko

    ```


    In above example the modules module1 and module2 are listed using fully qualified
    path name.

    The dependent module is on left side and the independent module is on the right
    side of the semicolon.


    But if the command insmod is used then the module1 is only inserted.


    The command modprobe -r module-name is used to remove the modules from the kernel.


    The sample modprobe.conf file is


    ```

    alias eth0 via-rhine

    ```


    ```

    options snd-intel8x0 index=0

    ```


    ```

    install binfmt-0000 /bin/true

    ```


    The install option is used to run the commands defined after the module name.
    In above case if the command


    modprobe binfmt-0000 /bin/true is executed.


    ## 7.3.Process and Kernel Information


    ### 7.3.1.The ps command


    The ps command is purpose command to get information about the processes running
    on the system. There are many options available for the ps command. The command
    ps aux is used to display all the processes currently running on the system.


    ### 7.3.2.Changing priority of process


    The renice command is used to change the priority of the running process. The
    format of the renice command is


    ```

    renice priority -p pid of process -u user-name -g group-id

    ```


    If the renice command is issued on user then the process priority of all processes
    of the user changes and if issued for group then the process priority of all processes
    owned by the group is changed and if issued for process id then the process priority
    is changed.


    ### 7.3.3.Using dmesg


    It is used to examine and print the boot up message. The user can use the command
    to capture messages. The format of the command is


    ```

    dmesg -c -n level

    ```


    The -c option clears the kernel ring buffer after printing


    -n option sets the level of messages which will be printed.


    If the value of level is 1 then the serious error messages are only printed.


    ```

    [root@localhost modprobe.d]# dmesg -c

    ```


    ```

    Linux version 2.6.21-1394.fc7 (kojibuilder@xenbuilder4.fedora.phx.redhat.com)
    (gcc version 4.1.2 200705202 (Red Hat 4.1.2-12)) #1 SMP Wed May 23 22:35:01 EDT
    2007

    ```


    BIOS-provided physical RAM map:


    ```

    sanitize start

    ```


    ```

    sanitize end

    ```


    ```

    copy_e820_map() start: 0000000000000000 size: 0000000000009fc00 end: 0000000000009fc00
    type: 1

    ```


    ```

    ......

    ```


    ```

    ......

    ```


    ```

    ......

    ```


    is the output of command. After the execution the kernel ring buffer gets clear
    now if the command dmesg is run again then there will be no output.


    ## 7.3.4.Syslog


    The syslog supports the system logging as well as kernel message trapping. The
    syslog and klogd comprises the syslog package, syslogd supports the system logging.
    It uses the configuration file /etc/syslog.conf. The file defines the files where
    different system messages will be written. Below is the sample /etc/syslog.conf
    file


    ```

    # Log all kernel messages to the screen.

    ```


    ```

    # Logging much else clutters up the screen.

    ```


    ```

    #kern.* /dev/console

    ```


    ```

    # Log anything (except mail) of level info or higher.

    ```


    ```

    # Don''t log private authentication!

    ```


    ```

    *info;mail.none;authpriv.none;cron /var/log/messages

    ```


    ```

    # The authpriv file has restricted access.

    ```


    ```

    *authpriv.* /var/log/secure

    ```


    ```

    # Log all the mail messages in one place.

    ```


    ```

    mail.* -var/log/maillog

    ```


    ```

    # Log cron stuff

    ```


    ```

    cron.* /var/log/cron

    ```


    ```

    # Everybody gets emergency messages

    ```


    ```

    *emerg

    ```


    ```

    # Save errors of level crit and higher in a special file.

    ```


    ```

    ucp.crit /var/log/spooler

    ```


    ```

    # Save boot messages also to boot.log.

    ```


    ```

    local.* /var/log/boot.log

    ```


    ## 7.4.Automating Tasks --


    # INN


    ```

    news.crit /var/log/news.crit

    ```


    ```

    news.err /var/log/news.err

    ```


    ```

    news.notice /var/log/news.notice

    ```


    In the above file /secure is defined to contain the authorization and security
    related messages. For example the PAM (Pluggable Authentication Module) related
    messages are logged in this file. The cron job messages are logged in the file.
    The file name can be changed by the root user if root wants to log the information
    into different file. The klogd captures the messages. The process id(PID) of klogd
    is defined in the file /var/run/klogd.pid. The source for kernel message is /proc/kmsg.
    If the file is not present then klogd uses a system call to obtain. The klogd
    daemon always runs on a running system and traps any messages which kernel generates.
    A user can schedule to run a job at a specified time. The at,batch,and cron facilities
    are used to schedule a job at a specified time.


    ### 7.4.1.Using at


    At command is used to schedule a job at a time and at daemon runs the job by the
    command. The command cannot be used by all the users. The root user can use the
    command. There are two files which determine which users can use the command.
    The file /etc/at.allow lists the name of the users who are allowed to use the
    command. The /etc/at.deny command lists the name of the users who cannot use the
    command. The /etc/at.allow file is first checked for the user name who can use
    the command if the file is not present then the /etc/at.deny is checked to see
    the users who cannot use the command. If both the files are not present then only
    root user can run at command. The sample format of /etc/at.allow or /etc/at.deny
    is mark. The user names should be one in a line and there should not be whitespace
    in the user name. The at -l command is used to list all the scheduled jobs(if
    root user runs this command scheduled of all users is displayed),if invoked by
    other users the scheduled job of only that user is displayed. The jobs which are
    listed have on right are in queue, the jobs which have = on right currently executing,
    and the jobs with b right are in batch queue.


    ```

    [root@localhost ~]# atq

    ```


    | | | |

    | :--- | :--- | :--- |

    | 3 | Jan 16 22:44:00 2009 | a root |

    | 2 | Jan 16 22:49:00 2009 | a root |

    | 1 | Jan 16 23:39:00 2009 | = root |

    | 4 | Jan 16 23:03:00 2009 | a root |


    -m sends mail to the user when the job completes even if the job has no output.
    The command at time-specification is used to schedule the job at that time. The
    three ways which jobs can be scheduled are


    ### 7.4.1.1.using pipe


    A list of command can be scheduled using pipe for example


    ```

    [root@localhost ~]# ls -la | at now+5min

    ```


    ```

    job 1 at Fri Jan 16 22:39:00 2009

    ```


    to schedule a number of commands write each command separated by semicolons.


    ### 7.4.1.2.Using at prompt


    The prompt is presented to the user if at time-specification is entered for example


    ```

    [root@localhost ~#] at now+20min

    ```


    ```

    at> ps

    ```


    ```

    at> du

    ```


    ```

    at> <EOT>

    ```


    press CTRL+D to come out of at prompt. In above example ps and du both are scheduled.


    ### 7.4.1.3.Using file


    The at-f filename time-specification command is used to give the command using
    the file-name. The contents of the file(commands in the file name is executed
    at time specification).


    atq – The Atq command is used to list the scheduled job. Same as


    ```

    at -l

    ```


    atrm – command is used to delete a scheduled job. The format is


    ```

    atrm jobid

    ```


    to delete the job 4 in below case use the command at -l gives listing of all scheduled
    jobs.


    ```

    [root@localhost ~#] at -1

    ```


    | | | |

    | :--- | :--- | :--- |

    | 3 | Fri Jan 16 22:46:00 2009 | a root |

    | 2 | Fri Jan 16 22:44:00 2009 | a root |

    | 1 | Fri Jan 16 22:39:00 2009 | = root |


    use atrm to delete job 4.

