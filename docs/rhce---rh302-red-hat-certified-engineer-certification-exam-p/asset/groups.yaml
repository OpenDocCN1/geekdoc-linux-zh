    # 19.2.SELinuxux


    SELinuxux stands for the Security Enhanced Linux. It is flexible access control
    architecture and provides support for the role based access control and multilevel
    security.


    # 19.2.1.SELinuxux administration


    The SELinux administration utility is used to configure the SELinux. To invoke
    the SELinux administration enter the below command in the terminal


    ```

    [root@localhost selinux]# system-config-selinux

    ```


