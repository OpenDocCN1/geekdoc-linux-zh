    # 18.4.1.Configuration files


    There are two configuration files /etc/sysconfig/iptables and /etc/sysconfig/iptables-config.


    The file /etc/sysconfig/iptables contains the security level currently imposed
    on the system.

    This file is written by the Security Level Configuration utility.


    The file /etc/sysconfig/iptables-config is used to, load additional iptables modules.
    The additional modules help in NAT filtering and helpers. The sample /etc/sysconfig/iptables-config
    file is


    ```

    IPTABLES_MODULES="ip_conntrack_netbios_ip_conntrack_ftp"

    ```


    The directive IPTABLES_MODULES defines the modules which are loaded. In above
    example the modules ip_conntrack_netbios_ip_conntrack_ftp are loaded.


    +   # Save current firewall rules on restart.


    +   # Value: yes|no, default: no


    +   # Saves all firewall rules to /etc/sysconfig/iptables if firewall gets restarted.


    ```

    IPTABLES_SAVE_ON_RESTART="no"

    ```


    If the value is yes then the rules are saved to the file /etc/sysconfig/iptables.


