    # 2.3.3.runlevel


    A runlevel is a software configuration of the system which allows only a selected
    group of processes to exist.


    | runlevel | Description |

    | 0 | It is used to halt the system. It should not be used in initdefault. |

    | 1 | Single user mode. No graphical tools are available. |

