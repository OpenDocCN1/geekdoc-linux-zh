    # 2.3.Starting init


    init is the father of all processes. The kernel starts the init process after
    mounting basic filesystems during the boot process. The init process has the pid
    (process identification number each and process running on the system has a unique
    number assigned to know them as PID) of 1.


    init looks to the file /etc/initabb and runs the script in the file /etc/initabb.
    The init process looks for the entry initdefault indicates the default runlevel
    with which system needs to be started up. If the initdefault is not mentioned
    in the file then the user has to enter the runlevel values in the console for
    the boot process to proceed.


    # 2.3.1./etc/initabb file


    This file describes which processes are started at boot and during normal boot
    process (for run levels different numbers of processes are started). An entry
    in the initabb file has the following format:


    ```

    id:runlevel:action:process

    ```


    +   - id is the unique identifier.

    * runlevel is the value between 0,1,2,3,4,5 and 6 (some more values are available
    but not used).The runlevel of sysinit, boot, and bootwait entries are ignored.

    * Action describes the action to be taken.

    * process specifies the process to be executed.


    | init Action | Description |

    |--- |--- |

    | respawn | The process is restarted for this action. |

    | wait | The process will be started once when the specified runlevel is entered
    and init will wait for its termination. |

    | initdefault | An initdefault entry specifies the runlevel |'
