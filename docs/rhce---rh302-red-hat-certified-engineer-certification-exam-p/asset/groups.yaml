    ## 7. Kernel SERVICES AND CONFIGURATION


    ### 7.1. Overview


    Linux kernel is operating system. The hardware drivers are installed to interface
    with the hardware. The deleted drivers are maintained as the modules of the kernel.


    ### 7.2. Kernel


    All the modules configured into the kernel are located in the directory /lib/modules/*.
    The * is replaced by the output of uname -r. The content of the directory is:


    ```

    [root@localhost 2.6.21-1394.fc7]## ls

    ```

    build modules.dep  modules.networking modules.symbols

    extra modules.eeee394map modules.ofmap modules.usbmap

    kernel modules.inputmap modules.pcmap source

    modules.alias modules.isapnpmmap modules.scsi modules

    modules.ccwmap modules.libata modules.seromap weak-updates


    The kernel subdirectory of the above output contains the drivers currently part
    of the kernel. The file modules.networking contains the name of the drivers for
    the network devices.


    ### 7.2.1. Modules Loaded into Kernel


    View the modules currently loaded into the kernel using the command lsmod. The
    file /proc/module contains the listing of modules currently loaded into the kernel.


    ```

    [root@localhost ~]# lsmod

    ```


    | Module | Size | Used by |

    |---|---|---|

    | i915 | 25793 | 3 |

    | drm | 78037 | 4 i915 |

    | ipt_MASQUADEADE | 7745 | 1 |

    | iptable_nat | 11461 | 1 |

    | nf_nat | 22125 | 2 ipt_MASQUADE,iptable_nat |


    The modinfo command can be used to view information about any of the loaded module
    into the kernel. For example to view information about the driver i915 of above
    case use the command:


    ```

    [root@localhost ~]# modinfo i915

    ```


    filename: /lib/modules/2.6.21-1394.fc7/kernel/drivers/char/drm/i915.ko


    license: GPL and additional rights


    description: Intel Graphics

