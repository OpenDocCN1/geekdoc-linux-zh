    b. /etc/pam.d/conf

    c. /etc/pam.d/pam

    d. /etc/pam.d

    Answer – d


    Explanation -- The contents of the file /etc/pam.conf is ignored if the files
    in the directory /etc/pam.d are present. The files in the directory /etc/conf.d
    correspond to the services use PAM for authentication.


