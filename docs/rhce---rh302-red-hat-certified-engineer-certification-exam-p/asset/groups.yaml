    ## 文件系统管理


    ### 3.1 概览


    Red Hat 使用 ext3 文件系统。它具有日志功能，可以从崩溃中恢复。文件系统组织成层次结构。`/` 文件系统位于层次结构顶部。


    如果磁盘分区挂载到文件系统，则所有子目录和文件都存储在那里。让 `/` 分区和 `/usr` 分区挂载到 `/dev/sda5` 和 `/dev/sda6`，则其子目录存储在其中。没有独立分区的文件系统存储在
    `/` 文件系统中。


    ### 3.2 文件系统信息


    bin 包含普通用户使用的命令。boot 包含引导 Linux 内文件。dev 包含代表系统设备的文件。etc 配置文件。sbin 包含管理命令。usr 包含用户和管理命令以及文档。var
    包含不同服务的日志，以及 FTP、Web 服务器使用的目录。/proc 文件系统是一个虚拟文件系统。这意味着 `/proc` 文件系统没有挂载在任何分区上。它包含系统信息以及系统中运行进程的信息。进程信息保留在
