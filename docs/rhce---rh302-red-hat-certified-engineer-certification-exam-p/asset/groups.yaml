    ## 4 PACKAGE MANAGEMENT


    ### 4.1. Overview


    A good operating system should allow the user to install and update software with
    ease. Red Hat offers the luxury of maintaining the package in a simple and efficient
    way. There are many options available to the user yum, rpm, and graphical utilities.


    ### 4.2. Using yum


    yum (Yellow Dog Updater*) is used to install and update the software packages
    in rpm format from software repositories over the web. yum uses configuration
    file /etc/yum.conf. The yum command checks the configuration files and searches
    the locations mentioned in configuration files for the package which is needed
    to be updated or installed by yum.


    ```

    [main]

    cachedir=/var/cache/yum

    keepcache=0

    debuglevel=2

    logfile=/var/log/yum.log

    exactarch=1

    gpgcheck=1

    plugins=1

    metadata_expire=00

    ```


    cachedir mentions the directory yum uses as cache memory for storing temporary
    file. keepcache value if 0 causes headers and cache files to be deleted after
    successful installation and value 1 retains the files. where yum writes log information.
    The option gpgcheck if 1 forces yum to check gpg keys and if 0 the gpg keys are
    not checked. The files in the directory /etc/yum.repos.d contain the location
    on the web which searches for the packages. Each file represents the location
    of the packages. The contents of the directory are


    ```

    [root@localhost etc]# cd yum.repos.d;ls

    ```


    fedora-development.repo fedora-updates.repo fedora-devel.repo fedora-updates.repo
    fedora-testing.repo


    Each file corresponds to a software repository on web. The file will be in below
    form:


    [fedora]

    name=Software-Server

    baseurl=give the http address of the server

    mirrorlist=give the address of mirror location

    enabled=1

    gpgcheck=1

    gpgkey=location of gpg key file


    The yum command takes a number of inputs. The general format of the command is
    yum option package-name. In case of some options yum''t need package name so the
    format becomes yum option.


    | Option | Description | usage |

    | --- | --- | --- |

    | install | Installs a package | yum install package-name |

    | update | Updates a package | yum update package-name |

    | check-update | Checks whether an update is available for the packages installed
    in the system | yum check-update |

    | remove | Removes the package and any dependent package from the system | yum
    remove package-name |

    | erase | Same as remove | Same as remove |


    # 4.3. Using rpm


    A lot of Red Hat software exists in rpm format. It is very easy to install the
    rpm packages by using the rpm command. The rpm command can be used to install,
    upgrade, verify, and uninstall the rpm software.


    | Option | Usage | description |

    | -i | rpm -i package-name | Install a package |

    | -U | rpm -U package-name | Updates package already installed on the system.
    If any previous version of package is not installed then the package is installed.
    |

    | -F | rpm -F package-name | Upgrade a previously installed package. |

    | -e | rpm -e package-name | Erases a package from system |

    | -q | rpm -q package-name | Queries about a package |

    | -V | rpm -V package-name | Verify an installed package against its original
    software package. If the in- |


    | | | |

    |---|---|---|

    | -v | rpm -v | stalled package matches with original software package then there
    is no output. |

    | | | Prints verbose information |

    | -vv | rpm-vv | Prints lots of verbose information |

    | -h | rpm-h | Prints # marks during the package processing using rpm. 50 # are
    printed when 100% processing is done. |


