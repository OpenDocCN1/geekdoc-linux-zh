    # 3.4.Checking and Repairing a filesystem


    The fsck command is used to check the linux filesystem and optionally repair it.
    The general format of the fsck command is


    ```

    fsck -t filesystem-type device-name

    ```


    If no device-name is specified on the command line then the command checks the
    filesystem in order they are mentioned in the /etc/fstab file.


    The fsck command is the end point to the commands which are invoked for different
    filesystem types. The command which will be invoked depends on the filesystem
    which is to be checked. Below is the list of commands and filesystems for which
    the commands will be invoked.


    | Filesystem | Commands used |

    | --- | --- |

    | ext2 | fsck.ext2, fsck -t ext2 |

    | ext3 | fsck.ext3, fsck -t ext3 |

    | vfat | fsck.vfat, fsck -t vfat,fsck.msdos |

    | ntfs | fsck.ntfs, fsck -t ntfs |

    | xfs | fsck.xfs, fsck -t xfs |'
- md: 'fsck command returns the following exit codes


    - 0 - No errors

    - 1 - File system errors corrected

    - 2 - System should be rebooted

    - 4 - File system errors left uncorrected

    - 8 - Operational error

    - 16 - Usage or syntax error

    - 32 - fsck canceled by user request

    - 128 - Shared library error


    The exit code returned when multiple file systems are checked is bit-wise OR of
    the exit codes for each file system that is checked.


    ## 3.4.1. Searching for badblocks


    The command badblocks searches for the badblocks on a device. The badblocks command
    should not run with the -w option as badblocks searches for the presence of badblocks
    on the device by writing a pattern on every block of the device which erases the
    data on the device. So, the filesystems which have data should not be checked
    with badblocks using the -w option.


    Those devices or filesystem should be checked for badblocks using the badblocks
    command without any option or with the -n option. The -n option is read only so
    no data is written on the device block and hence the data is not erased.


    To protect data and check for badblocks use the below command


    ```

    badblocks device-name or badblocks -n device-name

    ```


    To erase the data and check for the badblocks use the below command


    ```

    badblocks -w device-name

    ```


