    ## 17.MAIL SERVICES


    ### 17.1.Overview


    There are three parts of message transfer:


    - MTA – Mail Transfer Agent

    - MDA – Mail Delivery Agent

    - MUA – Mail User Agent


    MTA''s are also referred to as the mail server. The sendmail and postfix are examples
    of the mail server.


    ### 17.2.Sendmail


    To start the sendmail server type the below command in the terminal window:


    ```

    [root@localhost ~]# service sendmail start

    ```


    ### 17.2.1./etc/mail


    /etc/mail is the core directory of the sendmail. The files which are contained
    in the directory /etc/mail are divided into following category:


    #### 17.2.1.1.configuration file


    The main configuration file for the sendmail is /etc/mail/sendmail.cf. Many options
    which sendmail uses are also defined in the file /etc/mail/sendmail.mc. The file
    /etc/mail/sendmail.mc contains the sendmail default values like the location of
    the other configuration files to be used by the sendmail, location of the log
    files and database files.


    #### 17.2.1.2.Domain name mapping file


    The file /etc/mail/domainable contain the domain name mapping that is mapping
    the old domain name of the network to the new one.


    #### 17.2.1.3.Access file


    The /etc/mail/access defines the hosts and users from which the mail server sendmail
    accept mail for delivery or relay.


    #### 17.2.1.4.Virtual server file


    The file /etc/mail/local-host-name define the domain names for which the sendmail
    server of the system will act as a mail server.


    #### 17.2.1.5.Virtual users file


    The file /etc/mail/vertusertable defines the actions which sendmail should take
    after receiving mail from the trusted users and hosts.


    Apart from this files the directory /etc/mail also contains the .db files which
    are database files corresponding to the files described above for example access.db.


    ### 17.2.2.Generating the .db files


    To generate the .db files use the following approaches:


    ```

    /etc/init.d/sendmail reload

    ```


    or


    ```

    /etc/init.d/sendmail restart

    ```


    in above case the database files are automatically created as the sendmail in
    above case the database files are automatically created as the sendmail if the
    user wants to create the following for the sendmail the user wants to use the
    following command:

    ```

    /etc/mail

    ```


    ### 17.2.3.Checking the server


    The database files are automatically created as the sendmail if the user wants
    to create the following for the sendmail the user wants to use the following command:

    ```

    /etc/mail

    ```


    ### 17.2.4.Important files


    - 17.2.4.1./var/spool/mail: The directory contains the names that are using sendmail.
    These files contain the incoming messages received and processed.

    - 17.2.4.2./var/spool/mail/statistics: This file contains the collected statistics
    about sendmail.

    - 17.2.4.3./var/spool/mqueue: This directory keeps the outgoing messages until
    they are sent.

    - 17.2.4.4.Log files: The sendmail log information is maintained in three files
    /var/log/maillog, /var/log/maillog.1, and /var/log/maillog.2. The log files contain
    different level of information. The file /var/log/maillog.2 contains the detailed
    log information. An entry is made for each mail sent by the server or received
    by the server.


    ### 17.2.5.Actions taken by server on a mail


    There are four actions which the server can take:


    - RELAY – the server sends the message to the mail server request in the mail.

    - REJECT – the message is rejected and sender is informed that the message is
    rejected.

    - DISCARD – the message is rejected and sender is not informed that the message
    is rejected.

    - ERROR:user defined text message – inform the user why the server did not relay
    the message.


    This options are used to configure the options of a sendmail server. The options
    are used in the /etc/mail/access file. For example:


    ```

    # by default we allow relaying from localhost...

    ```


    ```

    Connect:localhost.localdomain RELAY

    ```


    ```

    Connect:localhost RELAY

    ```


    ```

    Connect:127.0.0.1 RELAY

    ```


    ## 17.3.Postfix


    It is a mail transfer agent that is mail server. The directory /etc/postfix contain
    the main configuration files and access related files used by the postfix server.


    ### 17.3.1.Starting postfix server


    The postfix server is not added in any run level by default (sendmail is generally
    there). So to add the postfix server use the command:


    ```

    [root@localhost postfix]# chconfig --list postfix

    ```


    ```

    [root@localhost postfix]# chkconfig --add postfix

    ```


    the first command shows that postfix is not in any runlevel.


    The second command adds the postfix server to run level which the user is currently
    logged on.


    To enable the postfix server enter the command:


    ```

    [root@localhost postfix]# chkconfig postfix on

    ```

