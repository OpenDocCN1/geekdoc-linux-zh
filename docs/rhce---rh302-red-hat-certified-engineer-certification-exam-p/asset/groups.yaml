    ks=http://path

    ks=nfs:options

    ```


    ![](img/01872e44e0db1c79895b45_18_0.png)


    ## 配置硬件


    `/etc/sysconfig/hwconf` 文件包含了已安装硬件的列表。运行该命令可以检测并配置系统中更改的硬件。它在每次 Red Hat 设备重启时都会运行。它检查
    `/etc/sysconfig/hwconf` 文件中的已安装硬件，并与当前硬件数据进行匹配。以下是 `/etc/sysconfig/hwconf` 文件的格式：


    | Key | Value |

    | :--- | :--- |

    | class | CDROM |

    | bus | SCSI |

    | detached | 0 |

    | device | scd0 |

    | desc | HL-DT-ST CD-RW G8526B |

    | host | 1 |

    | id | 0 |

    | channel | 0 |

    | lun | 0 |


    | class | VIDEO |

    | bus | PCI |

    | detached | 0 |

    | driver | i2c-i810 |

    | desc | Intel Corporation 82845G/GL[Brookdale]/GE Chipset Integrated Graphics
    Device |

    | videoriver | i810 |

    | vendorId | 8086 |

    | deviceID | 2562 |

    | subVendorId | 8086 |

    | subDeviceId | 2562 |

    | pciType | 1 |

    | pcicom | 0 |

    | pcibus | 0 |

    | pcidev | 2 |

    | pcifin | 0 |


    第一个项目是连接到系统的 CDROM 驱动器，第二个是连接到系统的显卡。如果添加或删除了任何硬件，它将配置添加的硬件并移除删除的。然后更新 `/etc/sysconfig/hwconf`
    中的数据。它可以通过两种模式启动：


    - 安全探测模式 (safe probe mode)

    - 无安全探测模式 (no safe probe mode)


    安全探测模式会禁用串口探测、DDC 显示器探测和 PS/2 探测。要在启动时启用无安全探测模式，请在 `/etc/sysconfig/kbd` 文件中输入以下行：


