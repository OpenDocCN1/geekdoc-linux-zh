    # 13.LDAP Server


    # 13.1.Overview


    LDAP stands for Lightweight Directory Access Protocol. It is used to create directories
    of information that can be shared among client applications over a network.


    # 13.2.Configuration


    The main directory of the ldap is /etc/ldap. The directory contains the configuration
    files and schema files for the ldap. The contents of the directory are


    ```

    [root@localhost ~]# ls -


    total 24

    drwxr-xr-x 2 root root 4096 2007-02-20 02:25 cacerts

    -rw-r--r- 1 root root 246 2007-02-20 02:25 ldap.conf

    drwxr-xr-x 2 root root 4096 2009-01-06 16:17 schema

    ```


    The file ldap.conf is the main configuration file for the ldap. The sample ldap.conf
    file is


    ```

    #

    # LDAP Defaults


    #

    # See ldap.conf(5) for details


    # This file should be world readable but not world writable.


    BASE dc=example, dc=


    URI ldap://ldap.example.com ldap://ldap-master.example.com:666


    SIZLIMIT 12


    TIMELIMIT 25

    ```


    BASE directive is used to set the set distinguished name in the ldap format using
    the dc=value format.


    URI specifies the uri of the ldap server to which the ldap library will attach.
    The server name can be specified or the ip address of the server can be specified.
    The port can also be specified on the URI directive.


    SIZELIMIT specifies the limit of results which will be returned when the ldap
    server is searched. If the value is set to 12 then 12 results will be returned
    as the output of a search.


    TIMELIMIT specifies the time limit which the ldap will take to answer the search
    request. The time limit of 15 in above example means that the ldap will take 15
    seconds to answer a search request.


    DEREF options specify the way an alias is dereferenced. The value of deref is
    never the alias as dereferenced. This is the default. The other values of the
    DEREF options are always,searching,and finding.


    The schema directory contains the schema files. The various schema files are


    - cosine.schema

    - inetorgperson.schema

    - nis.schema

    - samba.schema


    The default schema can be used by the user or edited by the user to create the
    directory information of his/her own. The structure used to create directories
    is the LDAP Data Interchange Format(LDIF). To create ldap directories user have
    to include the ldap schema he/she is using the configuration file /etc/openldap.conf


    For example to include /etc/ldap/samba.schema.


    ```

    include /etc/ldap/samba.schema.

    ```


    After editing the configuration file user can start creating the directories any
    of the ldap.


    The command slapd -t is used to check the /etc/ldap/ldap.conf for the syntax change.


    Create a directory entry with the extension .ldif and save the file.


    To add the contents of ldif file created to the ldap directory the command ldapadd
    is used.


    - ldapadd -a command adds a new entry to the ldap directory.

    - ldapmodify is used to modify the entries of the ldap server.

    - ldapdelete command is used to delete an entry from the ldap server.

    - ldapsearch is used to search the ldap directory using the search parameters.
    The number of entries which should be returned using the ldapsearch command is
    defined in the configuration file /etc/ldap/ldap.conf. The SIZIMIT option is used
    to define the number of rows. The time of search or the time within which the
    ldap server should respond is defined in the TIMELIMIT option.


    # 13.3.Starting the ldap


    Use the below command to start the ldap service


    ```

    service ldap start

    ```


    # 14.NIS SERVER


    # 14.1.Overview


    Network Information Service (NIS) was created by Sun Microsystems. It is used
    to create an central information database which is kept at a server system and
    other computers on the network access the information. The computers which access
    the database information (maps) of the server are referred as as NIS domain.


    # 14.2.Setting NIS domain name


    The command domainname .or nisdomainname,and domainname are used to set the NIS
    domain name of the system. The formats of the commands are


    ```

    domainname domain-name-of-system

    ```


    ```

    nisdomainname domain-name-of-system

    ```


    ```

    ypdomainname domain-name-of-system

    ```


    The below command sets the NIS domain name of the system to localdomain


    ```

    [root@localhost ~]# domainname localdomain

    ```


    The commands if used without any options give the nis domain name of the system.

