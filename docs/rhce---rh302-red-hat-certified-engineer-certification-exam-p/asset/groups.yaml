    ## 4 包管理


    ### 4.1. 概述


    良好的操作系统应该允许用户轻松地安装和更新软件。Red Hat 提供了以简单高效的方式维护包的便利。用户有许多可用选择：yum、rpm 和图形化工具。


    ### 4.2. 使用 yum


    yum（Yellow Dog Updater*）用于从网络上的软件源安装和更新 rpm 格式的软件包。yum 使用配置文件 `/etc/yum.conf`。`yum`
    命令会检查配置文件，并在配置文件提到的位置搜索 `yum` 需要更新或安装的包。


    ```

    [main]

    cachedir=/var/cache/yum

    keepcache=0

    debuglevel=2

    logfile=/var/log/yum.log

    exactarch=1

    gpgcheck=1

    plugins=1

    metadata_expire=00

    ```


    `cachedir` 提到 yum 用作缓存内存存储临时文件的目录。`keepcache` 值如果为 0，会在成功安装后删除文件头和缓存文件，值为 1 则保留文件。这是
    yum 写入日志信息的地方。`gpgcheck` 选项如果为 1，则强制 yum 检查 gpg 密钥。`yum` 检查 gpg 密钥。`[root@localhost
    ...]ls /etc/yum.repos.d`


    | 选项 | |

    | --- | --- |

    | install | 安装软件包 | yum |

    | update | 更新软件包 | yum |

    | check-update | 检查是否有可用更新 | yum |

    | remove | 移除软件包 | yum |

    | erase | 与 remove 同义 | yum |


    # 4.3. 使用 rpm


    许多 Red Hat 软件以 rpm 格式存在。使用 rpm 命令安装包非常方便。`rpm` 命令可以安装、升级、验证和卸载软件包。


