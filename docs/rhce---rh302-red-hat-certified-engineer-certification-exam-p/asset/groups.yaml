    ## Kickstart File


    Note: when using installation from Network or Hard disk choose the option INSTALL
    OR UPGRADE in text mode on the first screen of the Installation process. At boot
    prompt enter the command:


    ```bash

    boot

    ```


    After successful installation of Red Linux a kickstart file /root/anaconda-ks
    is created based on the options chosen by the user during the installation.


    ## Creating Kickstart File


    User has a choice to use graphical utility to create kickstart file or open a
    text editor and write the commands.


    ### Text File


    - install

    - cdrom

    - lang=en_UTF-8

    - keyboard

    - config --startx

    - network --device eth0 --boot dhcp

    - rootpw

    - firewall --enabled

    - authconfig

    - selinux --enforcing

    - timezone

    - bootloader --location=mbr --driveorder=sda --append="quiet"


    The install option denotes new installation will upgrade of an existing system.
    cdrom shows the install method NFS,FTP,HTTP are other options which can be used
    for NFS,FTP,hard disk.


    - For FTP method use -url the ftp name

    - for HTTP method use -url the http name

    - for hard drive use harddrive --dir=/path=partition

    - for NFS method use -nfs --servername --dir=directory name


    Third line shows the language used during installation. Fourth line chooses the
    keyboard layout. The config is used to configure the monitor and video card. The
    network command is used to configure the network. In the above case it configures
    the Ethernet interface. rootpw denotes the password. firewall sets the label -enable
    means enabled, option means disabled. selinux is used to set security enhanced
    linux options -enforcing,--permissive. timezone is used to select the timezone.
    bootloader command is used to set the partition where the default bootloader is
    installed.


    ## Graphical utility


    Open Terminal and type the command system-config-kick to start the configuration.


    ```bash

    root@localhost ~]# system-config-kick

    ```


    The user can use the graphical interface to choose the options and the kickstart
    file will be generated automatically. To use kickstart installation following
    steps:


    - create a kickstart file

    - copy the kickstart file from cdrom, network or Local hard drive

    - use above commands on boot prompt during the installation


    ```bash

    ks=cdrom

    ks=file:/path/anaconda-ks.cfg

    ks=ftp://path

    ks=hd:dev (dev = ''hd'', example)

    ks=http://path

    ks=nfs:options

    ```


    ![](img/01872e44e0db1c79895b45_18_0.png)


    ## Configuring Hardware


    The file /etc/sysconfig/hwconf contains the listing of installed hardware. The
    command can run to detect and configure changed hardware on the system. It runs
    every time Red Hat box is rebooted. It checks the file /etc/sysconfig/hwconf for
    the hardware installed and matches the data with the current hardware. Below is
    the format of the /etc/sysconfig/hwconf file:


    | Key | Value |

    | :--- | :--- |

    | class | CDROM |

    | bus | SCSI |

    | detached | 0 |

    | device | scd0 |

    | desc | HL-DT-ST CD-RW G8526B |

    | host | 1 |

    | id | 0 |

    | channel | 0 |

    | lun | 0 |


    | class | VIDEO |

    | bus | PCI |

    | detached | 0 |

    | driver | i2c-i810 |

    | desc | Intel Corporation 82845G/GL[Brookdale]/GE Chipset Integrated Graphics
    Device |

    | videoriver | i810 |

    | vendorId | 8086 |

    | deviceID | 2562 |

    | subVendorId | 8086 |

    | subDeviceId | 2562 |

    | pciType | 1 |

    | pcicom | 0 |

    | pcibus | 0 |

    | pcidev | 2 |

    | pcifin | 0 |


    The first entry is for a CDROM drive attached with the system and second is for
    a VIDEO card attached with the system. If any hardware is added or removed then
    it configures the added one and removes the removed one. It then updates the data
    in /etc/sysconfig/hwconf. It can be started in two modes:


    - safe probe mode

    - no safe probe mode


    safe probe mode disables serial port probing, DDC monitor probing, PS/2 probing.
    To enable no safe probe mode on startup enter the line:


    ```

    SAFE=no

    ```


    in the file /etc/sysconfig/kbd.


    ## Graphical utilities


    ### 1.4.1. For keyboard layout


    Enter the below command in terminal:


    ```bash

    root@localhost pub]# system-config-keyboard

    ```


    The user can select the keyboard layout and press OK.


    ### 1.4.1.2. For monitor and video card


    Enter the below command in terminal:


    ```bash

    root@localhost pub]# system-config-display

    ```


    ![](img/01872e44e0db1c79895b45feb5b48a6_21_0.png)


    - User can set the Resolution, Color depth under the setting tab

    - configure the monitor type and video card under hardware tab

    - Use dual type tab for second monitor type and video card.


    ### 1.4.1.3. For sound card


    Enter the below command in terminal:


    ```bash

    root@localhost pub]# system-config-soundcard

    ```


    ![](img/01872e44e0db1c79895b45feb5b48a6_22.png)


    This utility is used to add printers.


    ### 1.4.1.4. For network


    Enter the below command in terminal:


    ```bash

    root@localhost pub]# system-config-network

    ```


    ### 1.4.1.5. For date


    Enter the below command in terminal:


    ```bash

    root@localhost pub]# system-config-date

    ```


    ### 1.4.1.6. For time


    Enter the below command in terminal:


    ```bash

    root@localhost pub]# system-config-time

    ```


    ![](img/01872e44e0db1c79895b45feb5b48a6_23.png)


    This utility is used to set the network.

