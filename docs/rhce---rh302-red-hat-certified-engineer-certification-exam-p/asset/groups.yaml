    # ## 4.PACKAGE MANAGEMENT


    # ### 4.1.Overview


    A good operating system should allow the user to install and update software with
    ease. Red Hat offers the luxury of maintaining the package in a simple and efficient
    way. There are many options available to the user yum, rpm, and graphical utilities.


    # ### 4.2.Using yum


    yum (Yellow Dog Updater ,*Modified*) is used to install and update the software
    packages in rpm format from software repositories over the web. The yum uses the
    configuration file /etc/yum.conf and the configuration files in the directory
    /etc/yum.conf.'
