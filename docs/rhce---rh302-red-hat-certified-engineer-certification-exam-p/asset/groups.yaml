    enforcing – SELinux policies are enforced.


    Permissive – SELinux policies are checked but policy issues warning instead of
    enforcement.


    Disable-- SELinux policies are not enforced that is disabled.


    The SELinux administration changes the values in the SELinux configuration file
    /etc/sysconfig/selinux. The contents of the file are (for the above configuration
    of SELinux administration)'
