    what you are able to do to protect yourself from the most basic of attacks. Using
    this knowledge, you are also able to explore further in hacking if you wish to
    develop your skills and discover additional knowledge into creating your own programs
    and software.KeyloggerA keylogger is a very simple piece of software that is designed
    to track and record each keystroke made by the user of computer. These keystrokes
    and sequences are then stored on a log file that is accessed by the hacker who
    is able to discern your information such as email ID’s, passwords, banking details,
    credit card numbers and virtually anything else that you input into your machine
    using the keyboard. For this reason, many online banking sites and other highly
    secure web pages use virtual keyboards and even image identifying passcodes to
    provide you with access to your account since these cannot be recorded through
    keyloggers.How do you keyloggers gain access to your computer in the first place?
    These lines of code or software are often attached to files that are downloaded
    onto your computer without you being aware, known as Trojans (deriving from the
    Greek mythology of the Trojan Horse). These files then get to work are report
    back to the hacker with the information collecting from your computer. Other ways
    that these files are able to access your computer is if they are placed on the
    computer either through direct access, if someone was to have access to your computer
    with permission to allow them to place the file on the computer or through USB
    drives that they have provided to you with hidden files rooted within.  Keyloggers
    may also find themselves used in white hat purposes such as within organizations
    to ensure that employees are following the correct policies and procedures and
    not engaging in deceptive conduct. Denial of Service (DoS/DDoS)One of the most
    common forms of hacking attacks is the Denial of Service, as we had mentioned
    earlier. This involves causing a website to become unusable. The site is taken
    down due to the flooding of information and traffic, enough to overload the system
    as it struggles to process all the requests and is ultimately overwhelmed and
    crashes. These attacks are employed by hackers who aim to disrupt websites or
    servers that they want to cause destruction to for whatever their reason or motivation
    was. For example, a hacktivist hacker might take down a website that disagrees
    with their political views seeing it as their moral duty. Whereas a black hat
    hacker might take down the website of a competing organization to disrupt their
    services and sabotage the efforts of their competitor. A DoS attack is carried
    out using tools such as botnets or a network of infected systems which are then
    used almost as an army of zombified servers to repeatedly attack the target service,
    overloading it. These infected systems are created through emails and software
    which carry a virus and once infected, these zombie computers are able to be used
    at will by the hackers. It has been revealed through industry data that up to
    45% of organizations suffer from DDoS attacks resulting in millions of dollars
    worth of damage each year. Vulnerability ScannerTo detect weaknesses within a
    computer network, hackers use a tool known as vulnerability scanner. This could
    also refer to port scanners which are used to scan a specific computer for available
    access points that the hacker would be able to take advantage of. The port scanner
    is also able to determine what programs or processes are running on that particular
    port which allows hackers to gain other useful information. Firewalls have been
    created to prevent unauthorised access to these ports however this is more of
    a harm reduction strategy rather than a sure-fire way to prevent hackers.Some
    hackers are able to discern access points manually rather than using a program.
    This involves reading the code of a computer system and testing weaknesses to
    see if they are able to obtain access. They can also employ methods of reverse
    engineering the program to recreate the code if they are unable to view the code. Brute
    Force AttackIf you have ever wondered why you have a limited number chances to
    enter your password before being denied access, the server you are attempting
    to access has a safeguard against brute force attack. Brute force attack involves
    software that attempts to recreate the password by scanning through a dictionary
    or random word generator in an extremely short amount of time to hit on the password
    and gain access. For this reason, passwords have advanced to become far longer
    and more complex than they once were in the past, such as including characters,
    numbers, upper and lower-case letters and some going as far as barring words that
    are found in the dictionary. Waterhole AttacksWaterhole attacks are known by this
    name due to the fact hackers prey on physical locations where a high number of
    people will access their computers and exchange secure information. Similar in
    a way that a waterhole can be poisoned for the wildlife surrounding, the hacker
    can poison a physical access point to claim a victim. For example, a hacker may
    use a physical point such as a coffee shop, coworking space or a public Wi-Fi
    access point. These hackers are then able to track your activity, websites frequented
    and the times that you will be accessing your information and strategically redirect
    your path to a false webpage that allows the information to be sent through to
    the hacker and allow them to use it at a later time at their leisure. Be sure
    that when you are using public Wi-Fi, you have appropriate anti spyware and antivirus
    software to alert you when there may be suspicious activity while online.False
    WAPSimilarly, to the waterhole attack, the hacker can create, using software,
    a fake wireless access point. The WAP is connected to the official public wireless
    access point however once the victim connects they are exposed and vulnerable
    in that their data can be accessed at any point and stolen. When in public spaces,
    ensure that the WAP you are using is the correct one, they will generally have
    a password prior to access or a portal which will require you to enter a username,
    email address and password which is obtained from the administer. If you find
    the access point is completely open, this could be a cause for alarm knowing that
    this point is likely bait. PhishingAnother common technique used by hackers to
    obtain secure information from an unsuspecting victim is through phishing. Phishing
    involves a hacker creating a link that you would normally associate with a site
    that you commonly access such as a banking site or payment portal. However, when
    you input your details, they are sent to the hacker rather than the institution
    that you you believe you are sending them to. Phishing is often times done through
    sending false emails that appear as though they are from your bank or billing
    institution and generally request that you access your account to either update
    your details or make a payment. There are ways to distinguish whether you are
    being targeted for phishing such as checking the sender''s ID (which can still
    be falsified) or checking the details of the link that you have been provided
    and seeing that it doesn’t match up with the usual site that you fill your details
    in. You may also notice formatting issues with the email such as logos out of
    place or poor formatting that would indicate that the phisher is not using the
    correct template. Many institutions will insist that they would not request your
    details through email or ask you to update your details and if you do receive
    your bill through email, if you feel suspicious you can check with previous billing
    emails or even call your institution to double check that the email is genuine. Clickjacking
    AttacksIf you have ever attempted to stream a video on a less reputable site,
    you may have noticed that the interface can be quite confusing to navigate due
    to false play buttons or common sections after which you click on them and are
    then redirected somewhere else. These are known as Clickjacking attacks as well
    as UI Redress. While redirecting to the ad or another page may seem harmless,
    when done correctly these attacks can be quite sinister and potentially dangerous
    as they are able to capture your information. You need to exercise extra caution
    when using unfamiliar websites as they may not be as safe as they appear, with
    their interface taking you to a place right where the hacker wants you. Always
    be aware of the URL of each click you make and if it differs drastically from
    the website that you were just on, ensure that where you are taken does not involve
    any downloads or exchanging of details for your own protection. Bait and SwitchThe
    bait and switch technique involves the hacker supplying you with a program that
    appears to be authentic but when it faces it is a virus or a tool used by the
    hacker to access your computer. These can generally be found in unscrupulous websites
    that offer pirated programs, software, movies or games that are in high demand.
    Once you download the program, you will find that the file is not what you had
    intended and instead had loaded a virus to your computer to provide the hacker
    with access. Social EngineeringWe mentioned earlier, the social engineering techniques
    used by white hat hackers. This technique is often overlooked as a means of hacking
    however it can be quite effective. An example of social engineering is conning
    a system administrator into supplying details by posing as a user or an individual
    with legitimate access. These hackers are often thought of as con men rather than
    what we understand to be hackers, however it is a means of hacking nonetheless.
    Many of these hackers have a good understanding of the security practices of the
    organization in which they are attacking. They may not be as experienced or with
    a lower level security clearance than some of the higher ups. For example, they
    may phone up the employee on the helpdesk and request access to the system and
    without the experience to understand the consequences of providing information
    to an unknown source, give it up. There are a number of categories that social
    engineering can be placed in, these being:Intimidation - An example of intimidation
    would involve a superior such as a manager or supervisor calling the help desk
    technician, angry and threatening to punish the technician if their authority
    is questioned. Under pressure, the employee will comply and provide the information.
    Their questioning of the authority is promptly shut down as the employee values
    their job and offers to assist the hacker in securing the information. Helpfulness
    - On the opposite end of the spectrum, there is the helpfulness technique. This
    involves feigning distress and concern to take advantage of a technician''s nature
    to offer help and compassion. Rather than acting angry and placing pressure on
    the technician, the distressed hacker will act as though they themselves are under
    pressure and worrisome of the outcome. The technician will provide assistance
    in any way they can regardless of considering the consequences at the risk of
    causing further distress to the hacker. Name-dropping - Having the name of an
    authorised user provides the hacker with the advantage that they can pretend to
    be a specific person who should rightly have access to the information. This can
    be done by sourcing through web pages of companies which can be easily found online.
    Another example of this is the searching through documents that have been improperly
    discarded, providing vital details to the hacker.Technical - The other area of
    social engineering hacking is using technology as a means of support to obtain
    information. This can involve a hacker sending a fax or an email to a legitimate
    user which requires the user to respond with sensitive information. The hacker
    often poses as law information or a legal representative, requiring the information
    as part of an ongoing investigation for their files. Rootki tA rootkit finds its
    way onto your operating system through legitimate processes, using low-level and
    hard to detect program. The rootkit can assume control of the operating system
    from the user and since the program itself is hidden within the system binaries
    as replacement pieces of code, it can be incredibly difficult and virtually impossible
    for the user to detect and remove the program manually. Packet AnalyserWhen transmitting
    data across the internet or any other network, an application known as a packet
    analyser or packet sniffer can be used by a hacker to capture data packets which
    may contain critical information such as passwords and other records.Chapter 6
    : Basics of cyber security![](rsrc15T.jpg)As computing technology advances, so
    too does the risk of cyber terrorism on not only personal networks but also of
    government institutions, banking and security organizations, in which the damage
    can be quite widespread. Cyberterrorism is largely different from aforementioned
    cybercrime as the nature of cyber terrorism is more to inflict fear and devastation
    upon a network and it’s the institution it is contained within. Cyberterrorism
    can be conducted in order to reach some kind of personal objective through the
    use of computer networks and the internet with some experienced cyberterrorists
    being able to cause mass damage towards government systems, hospital records as
    well as national military and security programs that leave a country in a state
    of turmoil, terrified of further attacks. The objective for many cyberterrorists
    is often related to political or ideological agendas. Cyberterrorism can be challenging
    to prevent or protect systems from as it can be largely anonymous with unknown
    motivations and uncertainty over whether there could be repeated attacks again
    in the future. There is some argument over the exact definitions of cyber terrorism
    or whether it should be referred to as terrorism at all since the actions are
    not closely linked with conventional methods of terrorism and instead are towards
    information warfare, however since many of the motives are political in nature
    and targeted towards the disruption of infrastructure, the term loosely fits into
    the category of terrorism. Cyberterrorism can be committed by individuals, groups
    and organizations and in some cases by nation states attacking rival governments.
    Cyberterrorism is currently a major concern for both government and media sources
    due to the potential damages with government agencies such as the Federal Bureau
    of Investigations (FBI) and the Central Intelligence Agency establish targeted
    strike forces to reduce the damage caused by cyber terrorism. Cyberterrorism can
    be accomplished through a variety of techniques such as a network penetration
    and viruses that are created in order to disrupt and immobilize the system. Cyberterrorism
    is more dangerous than simple cybercrime for personal gain. Cyberterrorism can
    have serious consequences on the country and institutions that are attacked, placing
    lives at risk. As our technology improves, there are a number of ways to combat
    cyberterrorism by first anticipating and preparing for attacks and to implement
    a plan for prevention, following this we prepare for incident management to mitigate
    an attack limit the damage caused in the case that an attack has reached the target.
    Once an attack has occurred, the next stage of defence is to implement consequence
    management which is assessing the damage and taking note of how we are able to
    improve defences in the future, starting the process over once again. Traits of
    Cyber TerrorismAfter understanding the definition of cyber terrorism, many cyber
    terrorists have found to have very similar traits in common which can place them
    in the category of cyber terrorists. One such trait is that the victims of cyber
    terrorist attacks are specifically targeted rather than random in the case of
    hackers without clear objectives other than financial gain or entertainment. While
    there can be randomised cases of hackers releasing viruses or worms into the general
    public, there are often clear objectives for doing so with the victims being a
    specific group or nation that has been targeted for predetermined reasons by the
    hacker. Other objectives involve attacking an organization, industry, sector or
    economy for the purpose of inflicting damage or destroying their target. Finally,
    another common trait within cyber terrorism is to further the terrorist group''s
    own goals which could be financial, political, religious or ideological. These
    terrorists seek to achieve this goal by inflicting heavy damages on their target
    and make their own objectives obvious by publicising them. Types of Cyber Terrorism
    AttackCyberterrorism has been placed within three main categories by the Centre
    for the Study of Terrorism and Irregular Warfare at the Naval Postgraduate school
    in Monterey, California. These categories are simple-unstructured, advanced-structured
    and complex-coordinated. Simple-Unstructured - These are small-scale attacks and
    are generally performed by inexperienced hackers using widely available tools
    created by other people. The hackers behind these kinds of attacks generally lack
    command and control skills as well as possessing a limited learning capability. Advanced-Structured
    - These types of attacks are more sophisticated and can target multiple systems
    or networks and the hackers responsible possess the capability to modify or even
    create basic hacking tools. While the hackers possess limited command and control
    skills, they have an increase learning capability and present a significant risk
    depending on the organization they are targeting. Complex-Coordinated - At the
    higher end of the scale, coordinated and complex attacks can have a devastating
    effect on the system under attack with mass disruptions against integrated and
    heterogeneous defences. These types of hackers have the ability to create sophisticated
    hacking tools and have a strong command and control as well as an advanced capacity
    for further learning and skill development. Each of these sophistication and devastation
    and largely depend on the motivation and objectives of the hackers. Understanding
    each type of attack allows organizations to develop the proper counter measures
    to combat and prevent an attack as well as implement damage control in the wake
    of an attack. Incursion - The objective of an incursion attack is to gain access
    or penetrate the networks and systems which contain valuable information for the
    attacks. This is one of the more common attacks and has a much greater success
    rates for the terrorists. Due to the high number of loopholes available to hackers,
    terrorists are able to take advantage of weak security and vulnerabilities to
    obtain or even modify secure information which can then be recycled for further
    attacks against the organization or for the personal gain of the attackers. Destruction
    - This is a far more severe attack with the objective to infiltrate a computer
    system and inflict damage and ultimately destroy the network. For the organizations
    who are victim to these types of attacks, there can be incredible costs involved
    both in terms of repair and loss of revenue. An attacker intent on destruction
    can render an organization inoperable with their entire system thrown into disarray,
    impacting them financially and in some cases destroying their reputation as clients
    fear the security of their information following a serious attack.  In terms of
    governments, a destruction attack can plunge the systems into chaos. It can take
    some amount of time for an organization to recover fully from the most severe
    destruction attack, as is the objective for the hacker. Disinformation - Equally
    devastating can be that of disinformation. This involved spreading credibility
    destroying rumours and information, having a severe impact on the target. The
    rumours that are launched may or may not be true however they can be equally devastating
    and can still have long term effects on the organization or nation involved. Once
    these attacks are carried out, damage control can be quite challenging as information
    can spread regardless of whether the infiltration is contained. Information can
    relate to certain scandals and claims of corruption which can tarnish the reputation
    of individuals within the organization or the organization itself, leading to
    disruption of the order that has held the organization together. Denial of Service
    - We have mentioned denial of service earlier in this book as it one of the most
    common and widely known forms of attack. In terms of cyberterrorism, DoS attacks
    occur with businesses and entities that have an online presence with the attack
    rendering the website or service useless at the time of the attack. These types
    of attacks can therefore cause immense issues in both the social and economic
    function of the business, causing organizations to suffer massive losses.Defacement
    of Web Sites - While not as severe or damage, the defacement of a website can
    still have immense consequences for a business. Defacement of websites can involve
    websites to be changed completely, including a message from cyber terrorists for
    either propaganda or publicity purposes for them to achieve some type of cause.
    In other cases, hackers may cause the website to redirect to one in which they
    have established earlier which could also contain a message that they have devised
    to gain publicity and awareness of their propaganda or cause. These types of attacks
    have decreased in recent years as security measures have been heightened and hackers
    have a lower probability of access to web pages long enough to implement the changes
    and most major organizations effectively putting a stop to it. Strategies to Combat
    Cyber Terrorist ThreatsImplement strategic plans to counter cyber terrorist efforts
    will ensure that your organization has the means to combat any threats it may
    face. There are a number of strategies which a business can employee or in order
    to stay ahead and heighten their security capabilities in the face of a threat.
    These are: Prosecuting PerpetratorsMany attacks can behind the wall of anonymity
    with many smaller organizations failing to pursue and prosecute the hackers responsible.
    While this can be a costly activity, there are some advantages in identifying
    and taking the attackers to court. This can be a shock to the cyber terrorist
    community and set the standard for which other organizations should conduct themselves
    in the wake of an attack. If the case is particularly high profile, the organization
    can benefit from the hard-line response with the prosecuted hackers being an example
    to the rest of the criminal organizations that are determined to wreak havoc on
    your business. This example set can send waves throughout the rest of the community
    and can lead to improvements in the investigation and prosecution process of criminal
    cyber terrorists. Therefore, is always in the best interest of the parties that
    have been affected by an attack to seek justice. Develop New Security PracticesAs
    an organization faces an attack, they will follow through in revaluating their
    security and any potential loopholes that could be exploited. This involves further
    testing such as the pen-testing we explored earlier as a means of finding weaknesses
    and vulnerabilities and employing new security means to combat these. These activities
    require cooperation and coordinated efforts amongst all departments within an
    organization to ensure maximum effectiveness. Corporations should review international
    standard guidelines for security information to detail the steps that should be
    taken in order to secure organizations in terms of information security. As organizations
    further develop their security capabilities, they are able to adapt and modify
    the standard guidelines to comply with their own operations and needs to achieve
    the best results.Take a Proactive ApproachIt is important for both corporations
    and the general public to take a proactive approach as the threat from cyber terrorism
    becomes more sophisticated and targeted. This involves keeping up to date with
    the latest information within the cyber security sphere such as threats, vulnerabilities
    and noteworthy incidents as they will allow security professionals to gain a deeper
    insight into how these components could affect their organizations. From there
    they are able to develop and implement stronger security measures thereby reducing
    the opportunities for hackers to exploit for cyber-attacks. Organizations should
    constantly be on the forefront of cyber security having a multi-level security
    infrastructure in order to protect valuable data and user’s private information.
    All activities that are critical in nature should have security audits frequently
    to ensure all policies and procedures relating to security are adhered to. Security
    should be treated as an ongoing and continuous process rather than an aftermath
    of the consequences of an attack. Deploy Vital Security ApplicationsThere are
    many tools available for security professionals to protect their networks and
    they can provide a significant benefit to the job at hand. These applications
    involve firewalls, IDS, as well as anti-virus software that can ensure better
    protections against potential hackers. Using these security systems, security
    personnel are able to record, monitor and report any suspicious activities that
    can indicate the system is at risk. The applications are able to streamline the
    process, making the job far more efficient and effective. Utilizing these types
    of tools ensures that security personnel are assisted with the latest in prevention
    technology and have a greater probability of combating attackers. Establish Business
    Disaster Recovery PlansIn the event that an attack does occur, all businesses
    should have a worst-case scenario contingency plan in place to ensure that processes
    and operations are brought back to normally as soon as possible. Without such
    plans, the consequences can be disastrous leading to a loss in revenue and reputation
    on behalf of the business. Once these plans have been devised, they should be
    rehearsed regularly in order to test their effectiveness and also provide staff
    with training in the event of an attack. These plans should be comprised of two
    main components, these being, repair and restoration. From the perspective of
    repair, the attacking force should be neutralised as soon as possible with the
    objective to return operations to normalcy and have all functions up and running.
    The restoration element is geared towards having pre-specified arrangements with
    hardware, software as well as a network comprised of service vendors, emergency
    services and public utilities on hand to assist in the restoration process.Cooperation
    with Other FirmsYour organization would not be alone in dealing with the aftermath
    of a cyber-attack. Many organizations exist in order to deal with cyber terrorism
    threats both public and private. These groups can go a long way in helping with
    issues relating to cyber terrorism such as improving the security within your
