    # Hacking Hardware


    And you thought only software could do the job for you. Hacking hardware is a
    network of computers that will all work together to help find your password. These
    networks can be rented for a fee and will work at lightning speed to find your
    password. They are better known as botnets and are meant only to serve the purpose
    of cracking passwords.


    Similarly, graphical processing units (`GPUs`) are designed to help hack a password
    and are much more powerful than your regular `CPUs`. `GPUs` make use of a video
    card to find your password at a superfast speed.


    Apart from these, there are also small devices that have been built to cater to
    hacking account passwords. They might look small but will work faster than a few
    hundred `CPUs` all combined. These will make for great gizmos but you must be
    willing to shed upwards of $2000 to buy a single unit.


