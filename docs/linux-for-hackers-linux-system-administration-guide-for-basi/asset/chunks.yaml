    it out from the section you just read: Listing Directories and Files lsWhen your
    login, you will always be in your home directory. This will have the same name
    as you have for your username and it is where all your personal files and subdirectories
    will be saved. To find out the contents of your home directory, type in: % lsf
    there aren’t any, you will be returned to the prompt. Be aware that, using the
    ls command, you will only see the contents whose name does not start with a dot.
    The files that start with the dot are hidden files and will normally have some
    important configuration information in them. The reason they are hidden is because
    you should not be touching them. To see all the files, including those with the
    dot, in your home directory, type in % ls -aYou will now see all files including
    those that are hidden.  ls is one of those commands that is able to take options,
    and the above one, -a, is just one of those options. These will change how the
    command works, Making a DirectorymkdirTo make a subdirectory of the home directory,
    to hold the files you create, (for the purposes of this, we will call it linuxstuff,
    type in this in your current directory: % mkdir linuxstuffTo see that directory,
    type in % lsChanging to Another Directory cdcd means change directory from the
    current one to directory so, to change to the directory you just created, you
    would type in: % cd linuxstuffTo see the content, of which there shouldn’t be
    any right now, type ls ExerciseGo into the linuxstuff directory and then make
    another one called backups . and .. Directories Staying in the linuxstuff directory,
    type this in  % ls -aYou will see, and this is in all directories, two directories
    that are called . and .. In Linux, a single dot (.) signifies the current directory
    so if you were to type in (making sure to leave a space between cd and the single
    dot) % cd .you would stay exactly where you are in the linuxstuff directory While
    this might not seem to have much use at first look, you will soon find that by
    typing a dot as the current directory name will save you quite a bit of typing ..
    signifies the parent directory, which is the parent of the directory you are already
    in so if you were to type % cd ..you would go back one directory, in this case,
    to your home directory. Note – if you get lost in your file system, simply type
    cd at the prompt and you will be returned straight to your home directory Pathnamespwdpwd
    stands for print working directory and using a pathname lets you work out exactly
    where you are in the file system. he absolute pathname that goes with your home
    directory, you would type in cd, so you go bac to the home directory, and then
    type in % pwdYou should see something like this as the pathname /home/its/ug1/ee51vnAnd
    this means that the home directory is in a subdirectory called ug1, which is a
    group directory and this is located in the subdirectory called its, which is located
    in the home subdirectory, in the top level of the root directory named / ExerciseExplore
    your file system with the commands, cd, pwd and ls. Don’t forget, typing cd will
    take you back to the home directory Understanding PathnamesGo back to your home
    directory if you aren’t already there and type in % ls linuxstuffThis will list
    the contents of the home directory. Now type in % ls backupsNo such file or directory
     Why? You created a directory with that name earlier but you didn’t create it
    in the working directory. So, to get to backups directory, you either must use
    cd and specify the directory or you must use the pathname % ls linuxstuff/backups~
    (your home directory name)We can also use the tilde character (~ ) to refer to
    the home directory and to specify a path that starts at the home directory. So,
    if you typed in % ls ~/linuxstuffYou would see a list of what is in the linuxstuff
    directory, irrelevant of where you currently are in the file system. ExerciseLook
    at the following commands and work out what would be listed if you typed them: %
    ls ~% ls ~/..Section SummaryCommandMeaninglslists the files and the directories ls
    -alists all directories and files including those hidden mkdirmakes a new directory
     cd directorychange to the directory named cdchange back to the home directory cd
    ~change back to the home directory cd ..change to the parent directory pwdshows
    the pathname for the current directory Copying FilescpIf you wanted to copy file1
    in the working directory and name it file2, you would type in cp file1 file2First,
    go to  [this website](http://www.ee.surrey.ac.uk/Teaching/Unix/science.txt)  and
    copy the text into a file. Name it science.txt and save it to your linuxstuff
    directory So, now we are going to copy a file that is to be found in an open access
    part of the file system to the linuxstuff directory. First, you would get back
    to your linuxstuff directory by typing % cd ~/linuxstuffThen you would type the
    following at the prompt % cp /vol/examples/tutorial/science.txt . Note – do not
    forget to add the dot at the end The command is saying that we are going to copy
    the file called sceience.txt to linuxstuff but we will keep the name the same
     For the purposes of the next example, you must create a file named science.txt
    in your linuxstuff directory Moving Filesmvmv file1 file2 will move or rename
    file1 to file2 When you use the mv command, you will move the file and not copy
    it, ensuring that you still have just one file and not two. We can also use it
    to give a file a new name and we do this by moving it to the same directory it
    is already in but with a different name. Go back to your linuxstuff directory
    and type in the following % mv science.bak backups/. Now type in ls and the ls
    backups and see what has happened Removing a File or Directory rmrmdirTo delete
    a file, or remove it, we use the rm command. Let’s make a copy of science.txt
    and then we will delete it From your linuxstuff directory, type in % cp science.txt
    tempfile.txt% l s% rm tempfile.txt% lsIf you want to remove an entire directory,
    first make sure there are no files in it and then use the rmdir command. Have
    a go at removing the directory called Backups – Linux won’t allow it because it
    has something in it ExerciseUse mkdir to create a new directory named tempstuff
    and then use the rmdir command to remove it Displaying File Contents on the Screen clearBefore
    we move on, lets clear our terminal window of all the commands already typed in
    so that we can better understand what the output of the next commands are. To
    do this, type % clearAll the text will be removed and you will be left with the
    prompt. So, let’s move on to the next command catcat is used to concatenate and
    display a file’s content on your screen. Type in % cat science.txtYou will see
    that the file is bigger than the window size so it will scroll, making the contents
    hard to read lessThis command will write the file contents to the screen one page
    at a time so type in % less science.txtPress on your space bar if you need to
    see the next page and, if you have read enough, type in q. Note – if you have
    long files, use the command less rather than the command cat. headThis command
    will write the first ten lines of the specified file to your screen. Clear your
    screen and the type in: % head science.txtNow type% head -5 science.txt Look at
    what you go and decide what adding -5 did to the command tailAs opposed to the
    head command, the tail command will write the last ten lines of the specified
    file to the screen. Clear your screen and type in: % tail science.txtLooking Through
    a File’s Contents Using the less command, you can search for a keyword pattern
    in a text file. For example, if you wanted to find all the instances of science
    in the science.txt file, you would type in % less science.txtAnd then, staying
    in less, you type a forward slash and the work you want to search: /scienceAll
    the instances of the word are highlighted; to find the next instance, type in grepgrep
    is one the standard utilities on Linux and it is used to search for specific patterns
    or words. Clear your screen and type in % grep science science.txt Now you can
    see that the command grep prints each of the lines that have the word science
    in it Or has it?Now type in% grep Science science.txt grep is case sensitive and
    will distinguish between science and Science. If you want to ignore this case
    sensitivity, use -i. For example, type in % grep -i science science.txt  If you
    want to search for a specific pattern or phrase, it must be inside single quote
    marks. To search for spinning top, you would type in % grep -i ''spinning top''
    science.txt Other options with the grep command are: -v will display the lines
    that don’t match the specified text -n will precede each of the matching lines
    with the correct line number -c will only print out the total number of the matched
    lines Have a go at these and see what the results are. You can use more than one
    of these in one command so, to show the number of lines that do not include Science
    or science, you would type in % grep -ivc science science.txt wcThis is a neat
    utility and is short for word count. If you wanted to do a total word count on
    the science.txt file, you would type % wc -w science.txt If you want to know how
    many lines are in the file, type: % wc -l science.txt Section SummaryCommandMeaningcp
    file1 file2copies file 1 and names it file2 mv file1 file2moves or renames file1
    to file2 rm fileremoves a file rmdirremoves a directorycat filedisplays a file less
    fileshows one page of a file at a time head filedisplays just the first 10 lines
    of a file (or however many specified) tail filedisplays the last 10 lines) or
    however many specified) of a file grep “keyword” filesearch for a specific keyword
    in a file wc “keyword” filecounts how many characters or words are in a file RedirectionMost
    of the processes that are initiated by Linux commands will write to the terminal
    screen, which is the standard output. Many of them also take their input from
    the keyboard. As well as that, there are also those that write error messages
    to the terminal screen. Already, we have used the cat command to write a file’s
    contents to the terminal so now type the following, without specifying any file %
    catType a few words in using the keyboard, anything will do, and then press return Hold
    down CTRL and press the d key – this will finish the input When you run the cat
    command without a file, it will read the keyboard input and, when it receives
    the end of the file, the d, it will copy it to your terminal In Linux, we are
    able to redirect input and output. Redirecting OutputThe . symbol is used to redirect
    command output. For example, if we wanted to create a file with a name of list1,
    that had a list of fruits in it, we would type: % cat > list1 Then you type the
    names of a few fruits and, after each one, press return. For example applepearbananathen
    press ctrl+dThe cat command will read what was input from the keyboard and > will
    redirect it to the output, the screen, in a file named as list1\. If you wanted
    to read what the file had in it, you would type % cat list1ExerciseNow, using
    the same method, create a file named list2, with these fruits in it – plum, orange,
    grapefruit, mango. Now read the file contents Appending to Files>> will append
    the standard output to a file so, if we wanted to add some more items to list1,
    we would type % cat >> list1 And then the names of more fruits grapepeachorangeThen
    press CTRL+d to stop To read the file contents, type % cat list1You should, by
    now, have two files, one containing six fruits and one containing four fruits.
    Now we will join the two lists using the cat command into one file named biglist.
    Type in % cat list1 list2 > biglist This will read the contents of both lists,
    in turn, and then output the text from each into a new file called biglist To
    read the contents of biglist, type in  % cat biglistRedirecting InputTo redirect
    command input we use the < symbol. This will sort a list in numerical or alphabetical
    order. Type in % sortNow type some animal names in and press return after each
    of them: apecatdogbirdthen press CTRL+d to stop The output would be apebirdcatdogWhen
    you use < you can redirect input from a file instead of from the keyboard. For
    example, if you wanted a list of fruits sorted, you would type % sort < biglist The
    list will be sorted and output on the screen  If you wanted the sorted list to
    be output to a file, you would type % sort < biglist > slist The cat command is
    used for reading the contents of slist PipesIf you want to know who is on the
    same system as you, you would type in % whoOne way to get a list of names that
    has been sorted would be to type % who > names.txt% sort < names.txtThis is a
    rather slow method and you would need to remember that the temporary names file
    has to be removed when you are done. Really, what you are looking to do is connect the
    output from the who command straight to the input of the command called sort.
    This is what pipes are for and the symbol for the pipe is a vertical bar (|).
    For example, if you typed in % who | sort You would get the same result but it
    would be much quicker  If you wanted to find out how many other users have logged
    in, type in % who | wc -l ExerciseUse pipes to show all of the lines in list1
    and list2 that have the letter p in them and then sort the results AnswerAs this
    is a little more complex, I have opted to show you the answer this time: % cat
    list1 list2 | grep p | sort Section SummaryCommandMeaningcommand > filewill redirect
    the standard output to a specified file command >> filewill append the standard
    output to a specified file command < filewill redirect the standard input from
    a specified file command1 | command2will pipe command1 output to command2 input cat
    file1 file 2 > file0will concatenate or join files 1 and 2 to file0 sortwill sort
    the data  whowill show you who is logged on to the system with you Wildcards*
    is a wildcard character and it will match with none or more characters in a directory
    or file name. For example, go to your linuxstuff directory and type in % ls list*This
    shows you all of the files that are in the current directory, beginning with list… Now
    type in% ls *listThis shows all the files that end with …list in the current directory ?
    is another wildcard character and it is used to match one character only. So,
    for example, if you were to type ?ouse, it would match with files like mouse or
    house, but it wouldn’t match with grouse. Type in % ls ?listAnd see what happens Filename
    ConventionsIt is worth noting that directories are special file types so the naming
    conventions for files will also apply to a directory. When you name a file, you
    cannot use special characters, such as *, /, % and &. You also cannot use spaces
    so, when you name a file use numbers and letters, along with the underscore and
    the dot. Good namesBad namesproject.txtprojectmy_big_program.cmy big program c bob_billy.docbob
    and billy.docFile names begin with lowercase letters and end with a dot and a
    file extension that indicates the file contents. For example, if you have files
    that have C code n them, they may have the .c ending, such as prog1.c. To list
    all the files that have C code I the home directory, all you need to type at the
    command prompt is ls*c. from within the home directory HelpThere are plenty of
    online manuals providing information about commands. The pages will tell you what
    a command can do, the options that it can take and how each of those options will
    modify the command. If you wanted to read the page for a specific command, you
    would type in man. For example, if you wanted to know more about the wc command,
    you would type in % man wcOr you could type % whatis wcThis one would provide
    a short description of the command but wouldn’t give you any other information
    about options, or anything else. AproposWhen you do not know the name of the command
    exactly, you would type in % apropos keywordThis will provide you all the commands
    with the word keyword in the page header in the help manual. Try typing: % apropos
    copySection SummaryCommandMeaning*matches any amount of characters ?matches just
    one character man commandwill read the page in the online manual for a specific
    command whatis commandgives a short description of a specified command apropos
    keywordwill match a command with a keyword in the man page Command to execute:
    l sExplanation: this command allows you to list the contents of files and/or folders.Command
    to execute: pwdExplanation: the current directory is printed.Command to execute:
    cdExplanation: it allows you to access the selected folder.Command to execute:
    cpExplanation: it allows you to copy files.Command to execute: mkdirExplanation:
    it allows you to create a folder.Command to execute: rmdirExplanation: it allows
    you to remove a folder.Command to execute: touc hExplanation: it allows you to
    create a file.Command to execute: tarExplanation: it creates an archive for a
    certain file.Command to execute: clearExplanation: it allows you to return to
    an initial shell.Command to execute: adduserExplanation: it allows you to add
    a new user.Command to execute: chmodExplanation: it manages file and/or folder
    permissions.Command to execute: viExplanation: it allows you to edit a file .Command
    to execute: catExplanation: it allows manipulation of a file.Command to execute:
    grepExplanation: it searches a file for particular patterns.Command to execute:
    apt-getExplanation: package management. For example, apt-get install.Here above
    is a complete list of all the basic commands you should try out. They can help
    you to carry out the exercises I will propose to you in later chapters. You would
    be better to master them correctly.Network command sWorking as an ethical hacker
    requires you have a strong knowledge of the most common network commands.In the
    rest of the book, I will show you some of the most important ones. Try them out
    and you might even end up creating new combinations.Command to execute: ifconfigExplanation:
    utility to configure network interfaces. It will be very useful to view the IP
    address assigned to a machine.Command to execute: tracerouteExplanation: this
    command allows you to trace the path of an IP packet to the host network. It is
    very useful for performing troubleshooting activities such as, for example, verifying
    where in the path a certain IP packet stops or is lost.Command to execute: di
    gExplanation: this is a utility needed to query DNS. You will understand its mechanisms
    better in the next few chapters when I will explain what a DNS is and how we can
    organize an attack against it.Command to execute: telnetExplanation: this command
    allows us to make connections to remote hosts via the TELNET protocol. I want
    to clarify that this protocol allows a clear visualization of data without any
    encryption mechanisms. For this reason, it is not a very secure protocol.Command
    to execute: telnetExplanation: this command allows us to make connections to remote
    hosts via the TELNET protocol. I want to clarify that this protocol allows a clear
    visualization of data without any encryption mechanisms. For this reason, it is
    not a very secure protocol.Command to execute: nslooku pExplanation: this is another
    utility to interrogate DNS and to perform inverse resolution queries. In our exercises,
    we will often use this command.Command to execute: netstatExplanation: this is
    a command of the utmost importance. It allows you to view the network connections
    opened at a certain time. Useful in troubleshooting, it allows us to verify anomalies
    due to network connections that were not established or lost. Here again, take
    some time to improve your knowledge of this tool.Command to execute: ifup, ifdownExplanation:
    this command allows you to enable or disable network cards. It can be very useful
    in certain situations, perhaps when a reboot of network services is required.Command
    to execute: pin gExplanation: the PING command is used to check whether a certain
    host is active or not by sending special ICMP type packets to it and waiting for
    a response.Command to execute: arp -aExplanation: the ARP -A command provides
    us with a table of the links between a MAC address and an IP address. For example,
    it can be used when we want to exclude problems concerning the lower levels of
    the ISO/OSI model (data level).Here are all the commands related to networking.
    Of course, this list does not include them all, there would be much more to say.
    However, you will do great later if you begin to become familiar with these commands.Commands
    related to system managementCommand to execute: uptimeExplanation: this command
    shows you for how long a certain system has been active.Command to execute: user
    sExplanation: this command shows the user names of users connected to a system.Command
    to execute: who / whoamiExplanation: this is another command that informs us of
    how many users are connected to the system as well as some additional information.Command
    to execute: crontab -lExplanation: this command allows the display of scheduled
    jobs related to the current user. We will see later what the jobs are.Command
    to execute: less / moreExplanation: this command is very useful because it allows
    you to quickly view a file. Press the "q" key to exit this particular display.Command
    to execute: ss hExplanation: this command allows the connection to a remote host
    via an SSH protocol. The latter, unlike the TELNET one, carries out data encryption.
    For this reason, in the event of traffic interception, it will not be possible
    to clearly see any data.Command to execute: ftpExplanation: this command allows
    the connection to an FTP server via the FTP protocol. This protocol does not perform
    data encryption, so you need to pay attention when using it.Command to execute:
    service start / stopExplanation: this command allows you to start or stop a certain
    service. You will use it on many occasions.Command to execute: service start /
    stopExplanation: this command allows you to start or stop a certain service. You
    will use it on many occasions .Command to execute: free -hExplanation: this command
    shows the amount of free and used memory. For example, it can be used when there
    are performance problems on a machine.Command to execute: topExplanation: this
    command allows you to check the active processes in a system. It can be useful
    if a machine is running very slowly for no apparent reason.Command to execute:
    psExplanation: with this command you can view the active and running processes
    in a system.Command to execute: killExplanation: this command is used to terminate
    a certain process. However, it is necessary to first identify the PID related
    to that specific process.Chapter 3 : What is the use of logging for hackers![](rsrcN6.jpg)Daily,
    without our knowledge, most of our Internet use contributes to a growing portrait
    of who we are online. This portrait of you is more public than you think it is.
    Whenever we look at the Internet for information, it looks as if the Internet
    is looking back it us. We always leave something behind when we use websites for
    gathering information, sending emails or messages, social sharing etc. All these
    traces that we leave on the Internet are termed digital footprints .Digital footprints
    bring both benefits and costs. They offer the convenience of saving time by auto-filling
    the personal details when logging in into an account. The user does not have to
    retype all their details when logging in. Most users using the services of several
    companies realize that they are sharing the information consciously on social
    media sites. By uploading pictures, you can say that some degree of your privacy
    is lost. Footprints can be created by default when you''re shopping online or
    searching for something on Internet. Even by enabling your location services,
    digital footprints can be created. And, if you cannot see it, you cannot manage
    it. Using this portrait, companies target specific content to specific markets
    and consumers. This portrait also helps employers to look into their employees’
    backgrounds. Advertisers use digital footprints to track the movements of the
    users across websites. In simple words, whenever you go online and do a task,
    you will leave your digital footprint behind.There are different kinds of digital
    footprints, and it is wise to know about them and their effects.You should know
    that you can never bring your footprint count to zero. But following a few steps
    can reduce it. With those steps, managing your digital identity won''t be hard.Basically,
    the digital footprints of a user are the traces or stuff that they leave behind.
    Comments that you make on social websites like Facebook, email and application
    use, Skype calls, etc., all leave footprints. Other people can view them from
    a database. Here are some of the ways that you leave digital footprints.Websites
    and Online ShoppingProduct review sites and retailers often leave cookies on your
    computer. These cookies store your information and they can be used for tracking
    your movements from site to site. Advertising companies use these cookies and
    display advertisements related to your recent web searches online.Social MediaEvery
    one of those comments on Facebook, tweets on Twitter and +1s on Google plus leave
    a digital footprint. You can control these by keeping an eye on the default privacy
    settings set by your social media sites. They release new policies and settings,
    which result in the increase of your data visibility. Most of the people click
    OK at the end of the policy agreements without reading them.Laptops, Tablets and
    Mobile PhonesThere are websites that keep a list of devices that you have used
    for logging into their sites. That information is basically for securing your
    account. You should know that it is for your security and they are also storing
    information about your habits.How Big Is My Footprint?If you are interested in
    knowing how big your digital footprint is, there are several tools available for
    your use online. They can be accessed easily and you can add them to your system.
    They help in monitoring your footprints constantly and can help control it. Google
    is listed as one of the companies accused of collecting lots of user data. You
    can also measure the size of your footprint by having a look at how many advertising
    companies are permitted to track your browsing habits. Though you may not recollect
    permitting any of those advertising companies to place their cookies on your computer,
    some sites do it without asking the user. Cookies are nothing but small chunks
    of data that are created by web servers. These are stored on your computer and
    your web browser delivers them. Your preferences will be saved along with your
    online patterns in these cookies by the websites you frequently visit. Websites
    use this information for giving personalized experience to the users visiting
    them.Another method with which you can obtain a simple estimate on your footprint
    is by using the Digital Footprint Calculator. The EMC Corporation provides this
    service for both the Microsoft Windows and Mac operating systems. The user inputs
    the frequency of photo uploads, video uploads, phone usage, web browsing, emails,
    and your location information, and all this is considered by the software. After
    considering all of these, the calculator provides you with the actual file size
    of your presence on the Internet.Here are 10 steps that will help you to erase
    your digital footprint.'
