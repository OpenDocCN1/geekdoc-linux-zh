    # Vulnerability Scanner

    Vulnerability is defined as an unintended software flaw that can be used as an
    opening by hackers to send in malicious software like Trojan horses, viruses,
    worms, etc. A vulnerability scanner is a very efficient tool used for checking
    weak spots in a network or a computer system. It is basically a computer program.
    The sole purpose of the scanner is to access networks, applications, and computer
    systems for weaknesses. Both black hat hackers use this and computer security
    managers, who are usually white hat hackers or blue hat hackers, use this. The
    black hat hackers use it to find weaknesses and gain unauthorized access from
    those points. White hat hackers also check for weaknesses, but they do it to protect
    the computer systems rather than to gain entry .The data is transmitted through
    ports. The vulnerability scanner is used to check the ports that are open or have
    available access to a computer system. This is used for quickly checking the network
    for computers with known weaknesses. By limiting the ports, the firewall defends
    the computer, although it is still vulnerable.


    ## Benefits of Vulnerability Scanners

    * Early detection of problems

    * Security vulnerabilities can be identified easily

    * As it shows the vulnerabilities, they can be handled


    ## Types of Vulnerability Scanners


    ### Port Scanner

    A port scanner is a computer application that is designed solely for searching
    open ports on a host or a server. The person who intends to use this should have
    basic knowledge of `TCP/IP`. The attackers use it to identify services running
    on a server or a host with the intention of compromising it. The administrators,
    on the other hand, use it to verify their network''s security policies. A port
    scan is a process that sends requests to a selected range of ports with the goal
    of finding an active port. This can only find vulnerability and cannot be used
    for attacking or protecting. Most of the uses of this scan are to probe rather
    than attack. One can use the port scanner to scan multiple hosts in order to find
    a specific listening port. This process is called port sweep. These are particularly
    used for a specific type of service. One of them is a computer worm, which is
    SQL based. It may be used to port sweep ports that are listening on `TCP`.


    #### Types of port scanning:


    ##### TCP scanning

    These simple port scanners use the operating systems’ network functions when a
    `SYN` scan is not possible. This is called for when we scan by the `Nmap` (discussed
    in later chapters). The computer''s operating system will complete a three-way
    `TCP` handshake and then the connection will be closed immediately to avoid a
    `DoS` attack. An error code will be returned otherwise. The advantage of this
    mode of scanning is that the user doesn''t need any special privileges. However,
    this type of scanning is not very common, as the network function of an operating
    system prevents low-level control. In addition, this kind of scanning is considered
    to be ''noisy'' when using port scans. Therefore, this type of scan is not the
    preferred method, as the intrusion detection systems can log the IP address of
    the sender.


    ##### SYN scanning

    This is also a type of `TCP` scan. Here, the port scanner will generate raw IP
    packets by itself and will monitor for responses instead of using the network
    functions of the operating system. `SYN` scanning is also called "half-open scanning."
    This is so called because a complete `TCP` connection will never be opened. The
    `SYN` packets will be generated by the port scanner. The scanner will send a `SYN-ACK`
    packet when an open port is found. The host will close the connection before completing
    the handshake by responding with an `RST` packet. There are several advantages
    when we use raw networking. They are:

    1. The scanner gets complete control of the packets sent.

    2. The connection will not be received by the individual services.

    3. Scanner gets complete control of the response time. This type of scanning is
    recommended over `TCP` scanning.


    ##### UDP scanning

    `UDP` scanning is a connectionless protocol. Though this type of scanning is possible,
    there are technical challenges. A `UDP` back will be sent to the closed port and
    the post will respond with an `ICMP` response saying that the port is unreachable.
    The scanner looks for the `ICMP` responses. If there is no response from the host,
    the port is open. However, if the host is protected by a firewall, the scanner
    will receive a response saying that there is an open port, which is false. The
    `ICMP` rate limiting will also affect this method. All the ports appear to be
    open if the message is blocked. For this we can send some application-specific
    `UDP` packets as an alternative and hope that the application layer response is
    generated .


    ##### Window scanning

    This method is outdated and is rarely used. But window scanning is fairly trustworthy
    and can determine if a port is closed or open, filtered or unfiltered. This method
    can be used if there is a firewall on the host''s system.


    ### Network vulnerability scanner

    This type of scanner identifies the vulnerabilities in the security of a computer
    system that is connected to a network in order to tell if that particular system
    can be exploited or threatened. It is software that has a database of known flaws.
    It''ll scan the computer system for these known flaws by testing the system in
    order to make these flaws occur. Then it will generate a report of all these findings
    on that individual computer system, or a given enterprise.


    ### Web application scanner

    There are many ways in which architectural flaws and safety fallbacks can be checked.
    One such method is a web application security scanner, which acts as a communicator
    between the user and the application and identifies these issues. [-text]

    The most frequently used test is the black box test. This means that the user
    will have no idea what the logic behind the result is but will have clear-cut
    information about results that will give the complete information required. Mostly
    these scanners analyze by throwing random test cases that might occur in real-life
    scenarios and give results. These web applications are mostly entertained by users
    because they act as an easy platform to communicate with the system and therefore
    the user interface of these web applications play a major role in the success
    of an application.

    There are multiple actions the user can perform using these applications; among
    them are creating an account, querying the database by giving search criteria,
    adding a lot of required content, and also making different types of transactions.
    When there is a lot of information being stored, the user tends to store some
    of their personal information in these applications as well.

    It seems like an easy, convenient option but the fact that the security of the
    data is being compromised is one that most users tend to miss. And this is the
    very fact that the insider leaks and hackers cash in on. So it is not just the
    convenience that the user has to see, but they also need to make sure they keep
    a check on the extent of information they are sharing on these web applications.

    There are many various strengths of web application scanners; here are a few of
    them:

    * They come in handy for last-minute hurried checks for flaws.

    * They can check a lot of possible results that may be obtained when the same
    scenario is given different inputs and then they can recognize the anomalies.

