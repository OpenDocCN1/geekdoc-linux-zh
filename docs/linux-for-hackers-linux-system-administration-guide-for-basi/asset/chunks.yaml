- fmt: '

    We will go through tools available on Kali Linux for all the categories one by
    one and understand the purpose of each tool and how it will help us in the security
    domain.


    # Exploitation Tools


    On a network of computers, usually over the Internet, there are several web applications,
    which leave a system vulnerable due to bad code or open ports on the server which
    are publicly accessible. Exploitation tools help you to target a system and exploit
    the vulnerabilities in that system, thus helping you to patch vulnerability. Let’s
    go through all the Exploitation Tools available in Kali Linux one at a time.


    ## Armitage

    `Armitage` was developed by Raphael Mudge to be used with the `Metasploit` framework
    as its GUI frontend. `Armitage` is a tool that recommends exploits and is fairly
    simple to use as cyber-attack management tool which is available in the graphical
    form. It is open source and available for free security tool and is mostly known
    for the data it provides on shared sessions and the communication it provides
    through a single instance of `Metasploit`. `Armitage` helps a user to launch exploits
    and scans, get recommendations of exploits and explore the advanced features that
    are available in the `Metasploit` framework.


    ## The Backdoor Factory (BDF)

    The `Backdoor Factory` is a tool commonly used by researchers and security professionals.
    This tool allows a user to include his desirable code in executable binaries of
    a system or an application and continue execution of the binaries in normal state
    as if there was no additional code added to it. You can install this tool on your
    Kali Linux system using the following commands on the terminal.


    ```bash

    apt-get update

    apt-get install backdoor-factory

    ```


    ## The Browser Exploitation Framework (BeEF)

    The `Browser Exploitation Framework` is penetration testing tool built for testing
    exploits on the web browser. There has been an observation wherein web browsers
    have been targeted using vulnerabilities on the client-side. `BeEF` helps the
    user analyse these attack vectors on the client side. Unlike other tools, `BeEF`
    focuses on assessing the Web Browser which serves as an open door and it looks
    past the network layer and client’s system.


    ## Commix

    Providing use cases for penetration tester, web developers, and researchers, `Commix`
    (short for `COMMand Injection eXploiter`) works in a simple environment to test
    web applications. It basically allows a user to find the errors, bugs or vulnerabilities
    with respect to command injections in web applications. This tool easily allows
    you to identify and exploit a vulnerability of command injection. The `Commix`
    tool has been developed using the `Python` language.


    ## Crackle

    The `Crackle` tool in Kali Linux is a brute force utility used for cracking and
    intercepting traffic between bluetooth devices. Most bluetooth devices have a
    4-6 digit pairing code, which is in an encrypted format. Using `Crackle`, these
    codes can be decrypted if the pairing process between 2 devices is intercepted
    and thus allowing you to listen to all communication happening between the 2 devices.


    ## jboss-autopwn

    `JBoss Autopwn` is a penetration testing tool used in `JBoss` applications. The
    Github version of `JBoss Autopwn` is outdated and the last update is from 2011.
    It is a historical tool and not used much now.


    ## Linux Exploit Suggester

    The `Linux Exploit Suggester` tool provides a script that keeps track of vulnerabilities
    and shows all possible exploits that help a user get root access during a penetration
    test. The script uses the `uname -r` command to find the kernel version of the
    Linux operating system. Additionally it will also provide the `-k` parameter through
    which user can manually enter the version for the kernel of the Linux operating
    system.


    ## Maltego Teeth

    `Maltego` is a tool that is used for data mining and is interactive. It provides
    an interactive interface that outputs graphs which help in link analysis. Since
    it allows link analysis, `Maltego` is used for investigations on the Internet
    to find the relationship between information that is scattered over various web
    pages on the Internet. `Maltego Teeth` was developed later with an added functionality
    that gives penetration testers the ability to do password breaking, SQL injections
    and vulnerability detection, all using a graphical interface.


    ## sqlmap

    `sqlmap` is a Kali tool that is open source and is used for penetration testing.
    It allows automating the detection of SQL injection vulnerabilities and exploiting
    it to take over database servers. It comes equipped with a very powerful detection
    engine, a range of tools which will help an extreme penetration tester and switches
    that help fetch information like database fingerprinting, retrieving data from
    databases, access to the file system of the operating system and execute commands
    on the operating system.


    ## Yersinia

    `Yersinia` is a tool that detects exploits weaknesses in network protocols and
    takes advantage of it. It is a tool which is a solid framework for testing and
    analyzing deployment of networks and systems. It comprises of layer-2 attacks
    which exploit the weaknesses in various layer-2 protocols in a given network thus
    allowing a penetration tester to detect flaws in a layer-2 network. `Yersinia`
    is used during penetration tests to start attacks on network devices such as DHCP
    servers, switches, etc which use the spanning tree protocol.


    ## Cisco-global-exploiter

    The `Cisco Global Exploiter` (`CGE`) tool is a security testing exploit engine/tool,
    which is simple yet fast and advanced. Cisco switches and routers have 14 vulnerabilities
    which can be exploited using the `Cisco Global Exploiter` tool. The `Cisco Global
    Exploiter` is basically a perl script, which is driven using the command line
    and has a front-end that is simple and easy to use.


    ## Cisco-torch

    The `Cisco Torch` is an exploitation tool which varies from the regular scanners
    in the sense that it can be used to launch multiple and simultaneous scans at
    a given point in time which results in tasks getting done faster and more efficiently.
    In addition to the network layer, it also helps in fingerprinting systems in the
    application layer of the OSI model. This is something that even a tool like `NMAP`
    doesn’t provide.


    # Forensics Tools


    We will now list down and learn tools available in Kali Linux which are used in
    the Forensics domain.


    ## Binwalk

    The `Binwalk` tool is useful while working on binary image. lets lets scan through
    the image file for executable code that may be embedded in the image file. This
    is a very powerful tool for users who know what they are doing as it can be used
    to uncovering a loophole or a hack that is hidden in images. The `Binwalk` tool
    is developed in `python` and makes use of `libmagic` library from `python`, making
    it an apt tool for signatures that are created for the Unix system.


    ## Bulk-extractor

    The `bulk-extractor` tool is an interesting tool used by investigators who want
    to fetch specific data from a digital file. It helps retrieve URLs, email addresses,
    debit card numbers, etc. The tools can be used to scan through files and even
    images of disks. The best part is that even if the data is corrupted partially
    or in compressed format, the tool will still reach its depth to find the data.
    If there is data that you keep finding repeatedly, such as email addresses, URLs,
    you can create a search pattern for them which also ends up creating a histogram.


    ## Chkrootkit

    The `chkrootkit` tool is usually used in a live boot scenario. It is used locally
    to check the host machine for any rootkits that may be installed on the host.
    This therefore helps in the hardening of a system, ensuring it is not compromised
    and vulnerable to a hacker. The `chkrootkit` tool also has the ability to scan
    through system binaries for any modifications made, temporary deletion, string
    replacements, and log deletions.


    ## pof

    The `p0f` tool can help the user know the operating system of a host that is being
    targeted by intercepting the transmitted packages and examining them irrespective
    of whether the targeted host is behind a firewall or not. Given all these features,
    `p0f` in the hands of an advanced user, can detect presence of firewalls, use
    of NAT devices, and presence of load balancers as well.


    ## pdf-parser

    The `pdf-parser` tool is used in parsing PDF files to classify elements that are
    used in the file. The output of the tool on a PDF file will not be a PDF file.
    One may not recommend it for textbook cases of PDF parsers but it does help to
    get the job done. Mostly, its use case is PDF files, which you may suspect of
    embedded with scripts in them.


    ## Dumpzilla

    The `Dumpzilla` tool is developed in `python`. The purpose of this tool is to
    extract all information that may be of interest to forensics from web browsers
    like Seamonkey, Mozilla Firefox and Iceweasel.


    ## ddrescue

    The `ddrescue` tool is a savior of a tool. It helps in copying data from one block
    device such as a hard disc or a CD ROM to another block device. It is a savior
    because it copies the good parts first to avoid any read errors on the source.
    The `ddrescue` tool’s basic operation is completely automatic which means that
    once you have started it, you do not need to wait for any prompts like an error
    wherein you will need to stop the program or restart it. By using the `mapfile`
    feature of the tool, data will be recovered in an efficient fashion as it will
    only read the blocks that are required. You also get the option to stop the `ddrescue`
    process at any time and resume it again later from the same point.


    ## Foremost

    The `Foremost` tool is there to your rescue. This tool is an open source package
    which is easy to use and helps you retrieve data off disks that may have been
    formatted. It may not help recover the filename but will recover the data it held.
    A magical feature is that even if the directory information is lost, it can help
    retrieve data by referencing the header or footer of the file, making it a fast
    and reliable tool for data recovery. An interesting piece of fact is that `Foremost`
    was developed by special agents of the US Air Force.


    ## Galleta

    The `Galleta` tool helps you parse a cookie trail that you have been following
    and convert it into a spreadsheet format which can be exported for future reference.
    Cookies can be evidence in a case of cyber-crime and it can be a challenging task
    to understand them in their original format. The `Galleta` tool comes handy here
    as it helps in structuring data that is retrieved from cookie trails, which then
    can be run through other software for deeper analysis. The inputs for these analysis
    software need the date to be in a spreadsheet format, which is where the `Galleta`
    tool proves to be very useful.


    ## Volatility

    When it comes to memory forensics, `Volatility` is a very popular tool. Developed
    in the `python` language, this tool facilitates the extraction of data from volatile
    memory such as `RAM`. It is compatible with 32 bit and 64 bit architectures of
    almost all Windows variants and limited flavors of Linux and Android. The tool
    accepts memory dumps in various formats such as crash dumps, raw memory dumps,
    hibernation files, virtual snapshots, etc. The run-time state of the host machine
    and is independent of the investigation of the host. Passwords that are decrypted
    during run-time are stored in the `RAM`. Thus by retrieving the details of a password,
    `Volatility` comes as a savior for investigation of files that lie on the hard
    disk and may be encrypted with a password.


    ## Autopsy

    `Sleuth Kit` is a digital forensics toolkit which is open source and can be used
    with a wide range of file systems such as `FAT`, `EXT2`, `EXT3` and raw images.
    `Autopsy` is the graphical interface developed for `Sleuth Kit`, providing features
    such as Hash Filtering, Timeline analysis and searching for keywords. It is also
    very versatile as lets you add other modules to the existing set for when you
    launch `Autopsy`.


    ## Xplico

    `Xplico` is a forensic tool which is open source and is used for network forensics.
    If you wish to extract data from applications that use the network protocols or
    Internet, all popular network protocols such as `HTTPS`, `SMTP`, `IMAP`, `SIP`,
    `UDP` and others are supported by `Xplico`. It supports both `IPv4` and `SQLite`
    database used to store the output data from the tool.


    # Chapter 5: Process of hacking and how attackers cover their traces


    A computer as a standalone piece of hardware, is not an intelligent machine. It
    is the programs written for the computer that determine it can and cannot do.
    This chapter will teach you some the basic principles of programming as well as
    how to choose a programming language.


    ## Why You Need to Learn a Programming Language to Hack

    Computers operate using a series of switches. These electronic switches are turned
    on/off in different combinations. This creates the functions of a computer. For
    a computer to turn switch on or off, a program sends a message using binary code.
    Binary code is a series of 0s and 1s, with the 0s meaning on and the 1s meaning
    off. The problem with binary code is that it is incredibly complex. It would take
    even advanced programmers a long time to interpret the code, let alone alter it
    to do what they want. This is where a programming language comes in. A programming
    compiler translates pre-determined commands from the programming language into
    binary code that can be read by the computer.


    ## A Few Considerations (and Terms) Concerning Programming Languages

    To choose the best program to learn, you should consider what you want to do with
    your hacking/computer knowledge. Here are some common terms you may come across
    as you learn about the different languages:


    ### Language Generation

    Generally speaking, as technology has advanced, so have computer languages. Currently
    there are five generations:

    - First generation (`1GL`) were the most primitive. They were difficult to write,
    since it was written in binary code (0 and 1).

    - Second generation (`2GL`) are often referred to as assembly languages. It was
    the first step that allowed programmers to use symbolic names for commands, rather
    than just binary code.

    - Third generation (`3GL`) was another advancement, with higher level languages
    like `Javascript`, `Java`, `C`, and `C++` being developed. `3GL` allowed commands
    and words to be used in programming.

    - Fourth generation (`4GL`) is a type of coding similar to human language. This
    programming is common for database access, with some of the most common being
    `ColdFusion` and `SQL`.

    - Fifth generation (`5GL`) is the most advanced language by far, with its applications
    for neural networks. Neural networks imitate the inner workings of the human mind
    and are applied in the area of artificial intelligence.


    ### Procedure vs. Object-Oriented Programming

    Procedure-oriented programming uses a structured method. The problem (such as
    your hacking goal) is broken up into separate parts. Each individual part is known
    as a procedure. A main program allows the individual procedures to run, but also
    allows them to work together if needed. Procedure-oriented languages commonly
    used include `C`, `FORTRAN`, and `COBOL`.

    Object-oriented programming allows users to create relationships between different
    data types, which are called classes. Within the classes, different functions
    are given to each data type. This makes programming easier because the different
    data types can inherit pre-developed characteristics. New data types are easier
    to form for this reason. Some of the most common object-oriented language types
    include `Java`, `C++`, and `PHP`.


    ### Step 1 of Programming: Understanding Visual Basic Language

    Consider for a moment all the different parts of language that you learned in
    school. Programming language is similar to the language you speak:

    - Modules in programming are like chapters

    - Procedures in programming are like paragraphs

    - Lines of code in programming are like sentences

    Within the lines of code, there are programming elements, including:

    - Statements

    - Declarations

    - Methods

    - Operators

    - Keywords

    Each of these elements work together to write a line of code that the computer
    can understand. The specific way that words are arranged, as well as the words
    that are used, depends on which programming language you choose to use. Most hackers
    are familiar with at least one, however many hackers go beyond learning one to
    expand on their knowledge and abilities.


    ### Step 1: Learning to Write HTML

    One of the most basic programs to learn is HyperText Markup Language. You write
    text and then mark it to be read properly by the computer. Even though it is a
    web-based code, its simplicity makes it one of the best places to start in terms
    of coding. `HTML` uses basic words that you are familiar with.


    ### Step 2: Learning Python Language

    `Python` is one of the preferred languages of hackers. This introduction will
    be brief, since it can take an entire book and more to learn. `Python` language
    is incredibly powerful; however it still manages to remain simple. Its clear syntax
    is what makes it easy to learn.


    ### Step 3: Learning Your Choice of Languages

    Even though `Python` is one of the preferred languages, it is definitely not the
    only one. There are numerous programming languages and hackers choose to learn
    more than one.


    #### Web Languages

    These programming languages are typically used for creating/altering webpages:

    - `HTML`: HyperText Markup Language is the commonly used programming language
    for displaying text on a website. It is static, meaning the content does not change.

    - `Javascript`: This language is used to create interactive, dynamic content.

    - `XML`: Extensible Markup Language is similar to `HTML`, but more advanced.

    - `Java`: used to create applets, which are programs that function inside another
    program.

    - `PHP`: This is one of the most powerful languages. Its tasks include form validation,
    access to databases, and encryption of data.


    #### Software Languages

    Software languages are used for creating programs that can be executed, from those
    that only print text on a screen to operating systems with any number of functions:

    - `Java`: In addition to being a web language, it works for software. It allows
    creation of graphical programs, interactive user experiences, and more.

    - `Visual Basic`: `VBScript` is a language created by Microsoft especially for
    creating Windows applications.

    - `C Language`: applicable to the operating system, which is complex but allows
    the development of apps. Its uses include the creation of apps for games, as well
    as engineering and business programs.

    - `C++`: programming language is similar to `C`, as it is descendent of `C` programming.
    It is commonly used for graphical applications. Rather than being procedure-based
    like `C`, it is object-based.


    # Real World Example: A Guide for Writing Codes and Programs Using Python


    ## Step 1: Downloading and Installing Python and Other Essential Elements

    You can install `Python` by accessing the Python website. You should choose the
    latest interpreter for your operating system. `Python` is compatible with `Windows`,
    `OS X`, and `Linux`. You should note that if you are running an `OS X` or `Linux`
    system, they likely have `Python` already installed. Even so, you may want to
    download an updated program from the Python website, particularly if your computer
    setup is more than a few years old.


    Once you have the `Python` program, you are not yet ready to started. You will
    also need to download the `Python interpreter`. The interpreter is what will translate
    (as well as send) information between your text editor and your computer. Finally,
    you will need a text editor. While pre-installed programs like `TextEdit` or `Notepad`
    will work, it is easier to read and write programming codes using a job-specific
    text editor like `JEdit`, `TextWrangler`, or `Notepad++`.


    ## Step 2: Learning the Basics and Writing Your First Program

    With an interpreter, you are going to find that a high-level language like `Python`
    is easy to use. Still, you can make programming (and later hacking) easier by
    knowing the basics of the program and the absolute easiest way to learn those
    basics is to start programming so start `Python` and open the `Python Interpreter`.
    The code in this section must be attributed to https://www.stavros.io/tutorials/python/.


    ### Properties

    `Python` is a typed language which means that types will be enforced. It is implicitly
    and dynamically types which means that variables don’t need to be declared. It
    is case sensitive, so `name` and `NAME` are two separate variables with different
    meanings. `Python` is also object-oriented, which means everything in it is an
    object.


    ### Getting Help

    You can always get help in `Python`, from the interpreter. If for example, you
    wanted to know how a specific object worked, you would type `help(<name of object>)`
    in the interpreter. Other useful commands are `dir()`, which will show you the
    methods of a specified object, and `<name of object>.Doc`, which shows the documentation
    string of a specified object.


    ### Syntax

    In `Python`, there are no mandatory termination characters for statements and
    code blocks must be indented. Any statement that needs to be indented should end
    with a colon (`:`) and all comments begin with `#`. A comment is basically a note
    to yourself or to another person about what the code does. We use `=` to assign
    a value and we use `==` for equality testing. To decrease or increase a value,
    we use `+` or `-` operators on the right side.


    ### Data Type

    `Python` contains several data types, including `tuples`, `lists`, and `dictionaries`.
    You can use `sets` for sets, although these are built into later versions of `Python`.
    `Lists` are single dimensional although you can have other lists. A `dictionary`
    is associative array and a `tuple` is one-dimensional array. The first item in
    array is indexed as `0` and negative numbers are always counted from the end back
    to the beginning, with `-1` being the final item. `Array` ranges can be accessed
    using a colon (`:`). If you leave the start without a value, it will be assumed
    to be the first item, while leaving the end empty, it assumes to be the last item.
    Indexing is classed as inclusive-exclusive so if you specify `3:9`, the return
    would be the fourth item, which is `8`, the ninth item.


    ### Strings

    `Python` strings may be enclosed in single (`''`) or double quotes (`"`) and you
    can have one kind of string. Multiline strings should be enclosed in triple quotes
    (`''''''` or `"""`).


    ### Flow Control Statements

    The operators for flow control statements are `while`, `if` and `for`. In its
    place, you should use `if`. `for` is used to enumerate through members.


    ### Functions

    A function is declared with the keyword `def`. We set optional arguments in the
    declaration after the mandatory arguments and this is assigned to a value. When
    we use named arguments, we assign a value to the argument. Functions may return
    `tuples` and `lambda` functions are ad hoc, made up of statement. We pass parameters
    by reference but some types are immutable, such as `ints`, `strings`, etc., cannot
    be changed.


    ### Classes

    In `Python`, there is a small amount of inheritance in a `class`. We can declare
    a `private` variable and method by adding two or more leading underscores (`__`)
    and a maximum of one trailing underscore (`_`).


    # Chapter 7: Protect yourself from cyber attacks and secure your computer


    Now that you have a good understanding of hacking concepts and what is involved
    in the penetration of a system as well as you can turn hacking into a career,
    we want to get into the heart of the action and learning how to carry out an attack.
    This is for demonstration purposes to help strengthen your knowledge and ideally.


    ## Initial Preparation

    The first step toward setting up your environment is creating virtual machine
    to run on `VirtualBox`. You will need two machines, a target and a victim. You
    are able to download these online, they will come with files that we can extract
    as well as vulnerabilities to exploit. Once you have the files in place, extract
    them and create a new machine on `VirtualBox` and choose the type of machine.
    From there decide how much RAM your machine is running with, this isn’t too important
    so `512MB` is a good starting point. Your next task is then to select hard disk
    by checking "Use Existing Disk" option. You are able to click on the folder and
    select the appropriate file you had extracted.


    ## Creating a Network

    In order to access your machine you will need to establish a virtual network.
    This is to keep your machine safe from existing threats. You are able to do this
    through `VirtualBox` by going through File > Network > Host Only. Once you click
    the plus sign, you are able to add a new entry which will be your network. Now
    is time to add your virtual machine to the virtual network by selecting settings
    from the menu. From there you see the network tab which will allow you to click
    ''Attached to'' from Host-Only Adapter.


    ## Attacking Tools

    Now that your network and machine have been set up is time to acquire the tools
    to launch your attack. In this example we will be using `Kali` as it is simple
    to set up and can also run it live in a virtual machine. Once you have downloaded
    `Kali` as ISO file, open `VirtualBox` and click Add to create another machine
    which will be your attacker. For attacker you want to allocate some more memory
    to the machine of 2GB, if your machine has less than 4GB you may need to allocate
    less. Do not add a Virtual Drive. Wait. Wait, if you have ever attempted to stream
    a video on a less reputable site, you may have noticed that the interface can
    be quite confusing to navigate due to false play buttons or common sections after
    which you click on them and are then redirected somewhere else. These are known
    as `Clickjacking` attacks as well as `UI Redress`.


