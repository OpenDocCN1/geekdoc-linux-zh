    this in mind, let us go through with our virtual pen-test. Initial PreparationThe
    first step toward setting up your environment is creating virtual machine to run
    on VirtualBox. You will need two machines, a target and a victim. You are able
    to download these online, they will come with files that we can extract as well
    as vulnerabilities to exploit. Once you have the files in place, extract them
    and create a new machine on VirtualBox and choose the type of machine you will
    be using. From there you decide how much RAM your machine will be running with,
    this isn’t too important so selecting a small amount won’t affect your test, 512MB
    is a good starting point. Your next task is then to select a hard disk by checking
    the Use an Existing Disk option. You are able to click on the folder option and
    select the appropriate file that you had extracted from your download files and
    once that is all done, click create and your virtual machine and you are ready
    to move onto the next step. Creating a NetworkIn order to access your machine,
    you will need to establish a virtual network. This is to keep your machine safe
    from existing threats outside your control. You are able to do this through VirtualBox
    by going through File > Preferences > Network > Host Only Network. Once you click
    the plus sign, you are able to add a new entry which will be your virtual network.
    Now is time to add your virtual machine to the virtual network. You are able to
    do this by selecting your virtual machine and clicking settings from the menu.
    From there you will see the network tab which will allow you to click ‘Attacked
    to’ from and Host-Only Adaptor from the drop-down menu. Attacking ToolsNow that
    your network and machine have been set up it is time to acquire the tools to launch
    your attack. In this example, we will be using Kali as it is simple to set up
    and you can also run it live in a virtual machine. Once you have downloaded Kali
    as an ISO file, open VirtualBox and click Add to allow you to create another machine
    which will be your attacker. For your attacker, you want to allocate some more
    memory to the machine of around 2GB, if your machine has less than 4GB on the
    system, you may need to allocate less. You will not need to allocate any hard
    drive space, Kali is running live so check the box Do Not Add a Virtual Hard Drive.
    Once you are ready, hit create and your offending machine will be created. Ensure
    that you attach the machine to your network and change the adapter to host-holy.
    From here, you will start both machines and run Kali on your attack machine when
    prompted to add a bootable CD. You are then presented with the interface, and
    are ready to start scanning and gathering information from the Kali desktop interface.
     Gathering InformationThe next step in carrying out your attack is deciding upon
    your target. For the purpose of this experiment, we will be carrying out the attack
    on our victim server. In reality, this is a simple surface attack rather than
    focusing on the entire network that we had set up or the virtualization tools.
    From there it is time to gather information to discover the vulnerabilities that
    we will be exploiting. In order to do this, we will need to set this up in the
    software. This is where Metasploit will come into play as our framework for carrying
    out the pen-test, taking us through the process.To do this, we must first we must
    initiate the services through Kali by entering:“service postgresql start”“service
    metasploit start”Metasploit is best used through the console interface known as
    MSFConsole which is opened with“Msfconsole”Now you are ready to start your scan.Scanning
    for PortsIn order to gather information on ports, you can use Nmap which is built
    into MSFconsole. In order to set this up, you will first need to enter the IP
    address of the target which you can find by typing in“ifconfig”This will then
    bring up information on the IP address, labelled inet addr within the eth0 block.
    The IP address should be similar to other machines found on your network. By running
    a scan of the IP address by usingDb_map -sS -A *TARGET IP ADDRESS*You are able
    to have detailed list of all services running on the machine. From there you are
    able gather further information on each of the services to discover any vulnerabilities
    to exploit. Once you have found the weakest point, you are able to move into attack
    mode. ExploitationBy enter services into MSFconsole, you are able to access the
    database of information on the services running on the machine. Once you have
    discovered a service that is particularly vulnerable, you are able to scan this
    service to assess points of weakness. This is done by typingSearch *service name*You
    will be provided a list of exploits which you can take advantage and can then
    tell MSFconsole to exploit the model. Once you have set the target, you simply
    need to type the command “run” for the program to work its magic and access the
    port. You will then be able to see what you are able to do once operating from
    the computer with a number of commands at your disposal with the permissions provided
    to you by the service. From here you are able to extract data as well as upload
    data depending on your objective. Once you have accessed the machine, you will
    obviously want to ensure that you remained in control and fortunately Metasploit
    has a number of tools to assist. ConclusionWith this, we have now come to the
    end of this book. In the world of computer networking, security is given very
    high importance so as to protect data and safeguard the system from intruders.
    In spite of strict security guidelines and authentication schemes, hackers have
    managed to break into several systems skillfully, piquing the interest of common
    folk.Some hackers were able to develop groundbreaking utilities and websites like
    Facebook and Netflix (the founders of these websites are self-proclaimed hackers),
    so it is not surprising to see so many young people wanting to learn hacking.
    Before venturing into the depths of hacking, one needs to have clear-cut ideas
    about the basics of hacking. That is exactly what this book is intended for.I
    have explained all the concepts of hacking in a lucid and comprehensive manner;
    however, putting them all into practice may seem tough initially. But do not get
    discouraged. Hacking is all about practice, besides good problem solving skills.
    Make use of websites like “Hack this site,” which allow hackers to test their
    hacking skills legally. Also, do not think twice before seeking the help of a
    professional security specialist if you feel all of this is too technical for
    you.By now, you will have a good idea of what hacking is and the consequences
    that occur if an external or internal party attacks your system.And please note
    that the world of computers is always changing and advancing. The more advanced
    the system, the more you need to improve your knowledge .'
