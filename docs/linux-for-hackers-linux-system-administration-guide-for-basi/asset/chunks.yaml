  trans: "\n\n# 第 1 章：Linux 基础![](img/rsrc7J.jpg)\n\n当你想起操作系统时，最先出现在脑海中的两个是 Windows\
    \ 和 Mac OS。这些恰好是 2 个 of the most significant widespread and they have been around\
    \ for some time with many different versions. They are popular primarily because\
    \ of the computer systems they come with, and people usually use them simply because\
    \ they come pre-installed. Whereas these two are the most popular, there is another\
    \ operating system that is starting to gain some traction in the computer world;\
    \ the Linux operating system. For the most part, Linux is found on mobile devices,\
    \ smartphones, and tablets, but because it is open sourced and free, there are\
    \ now more people with computers and laptops that are beginning to use Linux as\
    \ their personal operating system. Since it is able to work with embedded systems,\
    \ Linux is useful on mobile devices, computers, smart watches, routers, gaming\
    \ consoles, controls, and even televisions.\n\nLinux is made with a straightforward\
    \ design that a lot of programmers like. It is straightforward and has a lot of\
    \ the power that other operating systems possess, but it is even easier to use.\
    \ A lot of programmers because it is open source, meaning they are able to use\
    \ it or make changes if they would like, and has all the features that they could\
    \ possibly want for computers, mobile devices, and more. Most people are familiar\
    \ with working on Windows or on the Mac OS, and they feel that Linux might not\
    \ be as safe as some of the other options - but this is just simply not the case.\
    \ In reality, Linux is one of the best operating systems out there. It is just\
    \ newer than and not as well-known as some of the other operating systems, but\
    \ since it is so easy to use and can also be used on mobile devices, it is quickly\
    \ growing in popularity.\n\n## Linux 如何诞生\n\nLinux was first released during 1991.\
    \ Initially, it was developed with the idea that it should be a free operating\
    \ system for Intel x9 based personal computers. However, it was soon changed to\
    \ become a more collaborative project, meaning that the source code was free to\
    \ use. Under the license terms for the operating system, it is able to be modified\
    \ and used for both non-commercial and commercial distribution. Since it is compliant\
    \ with `POSIX` or the Portable Operating System Interface’, it is a very reliable\
    \ operating system.\n\nThe best fact about Linux is that it is open sourced and\
    \ free to use, which may be why a lot of people are switching over to this operating\
    \ system. Mac OSX and Windows all cost something for the user to get and they\
    \ will either have to purchase the software on their own or have it put on a computer\
    \ for them. This can get costly when you factor in the number of updates required\
    \ for these operating systems. Since Linux is free, you are able to update at\
    \ any time without additional costs.\n\nThe open sourcing is helpful for both\
    \ the programmers as well as everyday users with Linux. Programmers are able to\
    \ use the various codes that are in the library in order to create some of their\
    \ own new code and release it for others to use. Those who are on Linux get the\
    \ benefits of better updates, newer features, and more, all thanks to the ability\
    \ of many programmers being able to work on the system at the same time. All of\
    \ this makes Linux an easy choice, especially going forward as it is compatible\
    \ with both smartphones and tablets also.\n\n## Linux 组件\n\nThere are seven main\
    \ components of Linux that you will encounter. They are as follows:\n\n### 可用性\n\
    Linux has thousands of applications that are available for the user to install\
    \ right away. In fact, as soon as you install the Linux system, you will be able\
    \ to install as many of the applications as you choose. Think of the applications\
    \ in Linux as similar to what you will find with the App Store and the Windows\
    \ Store, where you are able to pick out the applications that you want to work\
    \ with. Once you have done some searching and found the apps that you want, you\
    \ can directly download and install them to the Linux system.\n\n### 守护进程 (Daemons)\n\
    The Daemons are basically the components in Linux that are going to serve as the\
    \ background services. This would be things like scheduling, printing, and sound.\
    \ These are going to be launched at one of two times; either during the boot or\
    \ after you perform the desktop login.\n\n### 桌面环境\nThe environments for the desktop\
    \ refer to the different components that work with user interaction. Some of the\
    \ examples of these desktop environments include Enlightenment, Cinnamon, Unity,\
    \ and GNOME. Each of these is going to come with their own set of web browsers,\
    \ calculators, file managers, configuration tools, and some other features that\
    \ have been built into the environment.\n\n### 图形服务器\nThis is basically going\
    \ to be the subsystem inside of Linux. The main function that you are going to\
    \ see within this is that the graphical server it will show the different graphics\
    \ that are on your screen. Sometimes you will hear it being called the ‘X server’\
    \ or simply as ‘X.’\n\n### 引导程序\nAs you keep using Linux, it comes a moment when\
    \ you want to make sure that the system is going to boot up. The boot loader is\
    \ going to take over the boot process inside of the Linux management. It is often\
    \ going to be seen in the form of a splash screen. Once you see this splash screen\
    \ show up, it is going to proceed over to the booting process slowly.\n\n### 内核\
    \ (Kernel)\nThe next main component that you will see within the Linux system\
    \ is known as the kernel. This is essentially the core inside of Linux. It is\
    \ going to be in charge of managing the CPU, peripheral devices, and the memory\
    \ inside the Linux operating system.\n\n### Shell\nWe are going to talk about\
    \ the shell in more detail later on because it is vital when working with Linux,\
    \ so for now, we will keep things simple. The shell is basically going to be the\
    \ command line inside Linux. It is going to permit various controls based on the\
    \ commands that the user types into the interface interface. This is where you\
    \ are going to type in the codes and the commands that you want.\n\n## 下载 Linux\n\
    \nDownloading this system is pretty easy. You merely need to visit `www.ubuntu.com/downloads/desktop`\
    \ in order to get this onto your computer. Once it had time to get up, you should\
    \ also take some time to add some applications that you like. Some people like\
    \ to have it on the system, and others would rather just have it on certain times\
    \ when trying to do hacking. Both of these methods work fine; only depends on\
    \ what you want to do with Linux. If you just want to use Linux on the side as\
    \ additional part of your system, it is best to download it so that you can have\
    \ on the computer. It can take up a lot of space when you have operating systems\
    \ all the time.\n\n## 学习 Linux 命令\n\nThere are a lot of commands that you will\
    \ need to learn in order to get Linux to work well for your needs. Here we will\
    \ cover some of the main ones that you may find useful, and later we will get\
    \ into some the different things you are able to do. Some basic commands that\
    \ you should know how to perform with Linux include:\n\n- `mkdir`: 用于创建目录。\n-\
    \ `rm`: 删除文件，无需确认。\n- `w`: 显示关于当前用户的信息。\n- `uptime`: 显示系统运行时间、用户数以及平均负载。\n- `ls`:\
    \ 以格式显示文件列表，也可以显示自上次修改以来创建的新文件。\n- `who`: 显示日期、主机信息。\n- `less`: 允许快速查看文件，用于向上向下翻页。\n\
    - `more`: 更容易地查看文件，也可以显示百分比。\n- `top`: 实时显示任务和处理器活动，显示处理器和内存的使用情况。\n- `last`:\
    \ 显示关于用户活动的一些信息，包括内核版本、终端、启动时间和。\n\nAs you can see, Linux is a programming system\
    \ that is going to make it easier than ever to get tasks done, whether you are\
    \ working online, on the phone, on tablet, or through another method. It is free\
    \ to install, but it is still stable and will often work as well as other systems\
    \ that are available.\n\n# 第 2 章：命令行指南![](img/src96.jpg)\n\nThis is the end of\
    \ the chapter dedicated to Linux commands. We started with the general commands\
    \ and then introduced those related to networking as well as the main functions\
    \ of system. Now you are ready for the exercises I will present to you in the\
    \ following chapters. But first, let me explain how networks work and what are\
    \ the services most hackers use. The more essential but basic Linux commands that\
    \ you need to know so fire up Linux and play along. There will be exercises to\
    \ test your knowledge along the way, although I won’t be providing answers to\
    \ all of them because you should be able to work it out from the section you just\
    \ read:\n\n## 列出目录和文件\n### ls\nWhen your login, you will always be in your home\
    \ directory. This will have the same name as your username and it is where all\
    \ your personal files and subdirectories will be saved. To find out the contents\
    \ of your home directory, type in:\n```\nls\n```\nUsing the `ls` command, you\
    \ will only see the contents whose name does not start with a dot. The files that\
    \ start with the dot are hidden files and will normally have some important information\
    \ in them. The reason they are hidden is because you should not be touching them.\n\
    \nTo see all the files, including those with the dot, in your home directory,\
    \ type in: own```\nls -a\n```\nYou will now see all files including those that\
    \ are hidden. `ls` is one of those commands that is able to take options, and\
    \ the above one, `-a`, is just one of those options. These will change how the\
    \ command works.\n\n### 创建目录\n### mkdir\nTo make a subdirectory of the home directory,\
    \ to hold the files you create, for the purposes of this, we will call it `linuxstuff`,\
    \ type in:\n```\nmkdir linuxstuff\n```\nTo see that directory, type in:\n```\n\
    ls\n```\n\n### 切换到另一个目录\n### cd\n`cd` means change directory from the current\
    \ one to. to change to the directory you created, you would type in:\n```\ncd\
    \ linuxstuff\n```\nTo see the content, of which shouldn’t be any right now, type:\n\
    ```\nls\n```\n\n### . 和 .. 目录\nStaying in the `linuxstuff` directory, type this\
    \ in:\n```\nls -a\n```\nYou will see, and this is all directories called `.` and\
    \ `..`. In Linux, a single dot (`.`) signifies the current directory so if you\
    \ were to type in (making sure to leave a space between `cd` and the single dot):\n\
    ```\ncd .\n```\nyou would stay exactly where you are in the `linuxstuff` directory.\
    \ While this might not seem to have much use at first, you will soon find that\
    \ typing `..` signifies the parent directory, which is the directory you are already\
    \ in so if you were to type:\n```\ncd ..\n```\nyou would go back one directory,\
    \ to your home directory.\n\n### 路径名\n### pwd\n`pwd` stands for print working\
    \ directory and using a pathname lets you work out exactly where you are in the\
    \ file system. Absolute pathname that goes with your home directory, you would\
    \ type in cd then type in:\n```\npwd\n```\nYou should see something like `/home/its/ug1/`.\
    \ This means you are in a subdirectory called `its`.\n\n## 章节总结\n| 命令 | 含义 |\n\
    | :--- | :--- |\n| `ls` | 列出文件 |\n| `ls -a` | 列出所有目录和文件，包括隐藏文件 |\n| `mkdir` |\
    \ 创建新目录 |\n| `cd` | 切换到指定的目录 |\n| `cd ~` | 回到主目录 |\n| `cd ..` | 切换到父目录 |\n| `pwd`\
    \ | 显示当前工作目录路径 |\n\n## 复制文件\n### cp\nIf you wanted to copy `file1` in the working\
    \ directory and name it `file2`, you would type in:\n```\ncp file1 file2\n```\n\
    First, go to [this website](http://www.surrey.ac.uk/Teaching/science.txt) and\
    \ copy the text into a file. Name it `science.txt` and save it to your `linuxstuff`\
    \ directory. So, now we are going to copy a file that is found in open part of\
    \ the file system to `linuxstuff` directory. First, you would get back by typing:\n\
    ```\ncd ~/stuff\n```\nThen you would type the following at the prompt:\n```\n\
    cp science.txt .\n```\nNote – do not forget to add the dot at the end. The command\
    \ is saying that we are going to copy the file called `science.txt`. \n\n## 移动文件\n\
    ### mv\n`mv file1 file2` will move or rename `file1` to `file2`. When you use\
    \ the `mv` command, you will move the file and not copy it, ensuring that you\
    \ still have just one file and not two. We can also use it to give a file a new\
    \ name we do this by moving it to the same directory it is already in but with\
    \ a different name. Go back to `linuxstuff` directory and type in the following:\n\
    ```\nmv science.bak backups/\n```\nNow type in `ls backups` and see what has happened.\n\
    \n## 删除文件或目录\n### rm\n### rmd\nTo delete a file, or remove it, we use the `rm`\
    \ command. Let’s make a copy of `science.txt` and then we will delete it. From\
    \ your `linuxstuff` directory, type in:\n```\ncp science.txt tempfile.txt\nls\n\
    rm tempfile.txt\nls\n```\nIf you want to remove an entire directory, first make\
    \ sure there are no files in it and then use `rmdir` command. Have a go at removing\
    \ the directory called `Backups` – Linux won’t allow it because it has something\
    \ in it. Exercise: Use `mkdir` to create a new directory named `tempstuff` and\
    \ then use the `rmdir` command.\n\n## 在屏幕上显示文件\n### clear\nBefore we move on,\
    \ lets clear our window of all the commands already typed in that we can better\
    \ understand the output of next commands. To do this, type:\n```\nclear\n```\n\
    ### cat\n`cat` is used to concatenate and display a file’s content on your screen.\
    \ Type in:\n```\ncat science.txt\n```\nYou will see that the file is bigger than\
    \ the window so it will scroll, making the contents hard to read.\n\n### less\n\
    This command will write the file contents to the screen one page at a time. Press\
    \ on space bar if you need to see the next page and, if you have read enough,\
    \ type `q`.\n```\nless science.txt\n```\n### head\nThis command will write the\
    \ first ten lines of the specified file to your screen. Clear your screen and\
    \ type in:\n```\nhead science.txt\n```\nNow type:\n```\nhead -5 science.txt\n\
    ```\nLook at what you go and decide adding `-5` to the command.\n\n### tail\n\
    As opposed to the `head` command, the `tail` command will write the last ten lines\
    \ of the specified file to your screen. Clear your screen and type in:\n```\n\
    tail science.txt\n```\n\n## 浏览文件内容\nUsing the `less` command, you can search for\
    \ a keyword pattern in a text file. For example, if you wanted to find all instances\
    \ of `science` in the `science.txt` file, you would type in:\n```\nless science.txt\n\
    ```\nAnd then, staying in `less`, type a forward slash and the work you want to\
    \ search:\n```\n/science\n```\nAll the instances of the word are highlighted\n\
    \n### grep\n`grep` is one the standard utilities on Linux and is used to search\
    \ for specific patterns or words. Clear your screen and type in:\n```\ngrep science.txt\n\
    ```\n`grep` is case sensitive and will distinguish between `science` and `Science`.\
    \ If you want to ignore this case sensitivity, use `-i`. For example, to search\
    \ for `spinning top`, you would type in:\n```\ngrep -i 'spinning top' science.txt\n\
    ```\nOther options with the `grep` command are:\n- `-v`: will display the lines\
    \ that don’t match the specified text.\n- `-n`: will precede each of the matching\
    \ lines with the correct line number.\n- `-c`: will only print out the total number\
    \ of matched lines.\nHave a go at these and see what the results are. You can\
    \ use more than one of these in command, like:\n```\ngrep -ivc science.txt\n```\n\
    \n### wc\n`wc` is a neat utility and is short for word count. If you wanted to\
    \ do total word count on `science.txt` file, you would type:\n```\nwc -w science.txt\n\
    ```\nIf you want to know how many lines are in the file, type:\n```\nwc -l science.txt\n\
    ```\n\n## 章节总结\n| 命令 | 含义 |\n| :--- | :--- |\n| `cp file1 file2` | copies `file1`\
    \ and names it `file2` |\n| `mv file1 file2` | moves or renames `file1` to `file2`\
    \ |\n| `rm file` | removes a file |\n| `rmdir` | removes a directory |\n| `cat\
    \ file` | displays a file |\n| `less files` | shows one page of a file at a time\
    \ |\n| `head file` | displays the first 10 lines of a file |\n| `tail file` |\
    \ displays the last 10 lines of a file |\n| `grep \"keyword\" file` | searches\
    \ for a specific keyword in a file |\n| `wc \"keyword\" file` | counts how many\
    \ characters or words in a file |\n\n## 重定向\nMost of the processes initiated by\
    \ Linux commands will write to the terminal screen, which is the standard output.\
    \ Many of them also take their input from the keyboard. As well as that, there\
    \ are those that write error messages to the terminal screen. Already, we have\
    \ used the `cat` command to write a file’s contents to the terminal so now type\
    \ the following, without specifying any file:\n```\ncat\n```\nType a few words\
    \ using the keyboard, anything will do, and then press return. First, go to [this\
    \ website](http://www.surrey.ac.uk/Teaching/science.txt) and copy the text into\
    \ a file. Name it `science.txt` and save it to your `linuxstuff` directory. So,\
    \ now we are going to copy a file that is found in open part of the file system\
    \ to `linuxstuff` directory. First, you would get back by typing:\n```\ncd ~/stuff\n\
    ```\nThen you would type the following at the prompt:\n```\ncp science.txt .\n\
    ```\nNote – do not forget to add the dot at the end. The command is saying that\
    \ we are going to copy the file called `science.txt`.\n\n### 重定向输出\nThe `>` symbol\
    \ is used to redirect command output. For example, if we wanted to create a file\
    \ with a name of list1, that had a list of fruits in it, we would type:\n```\n\
    cat > list1\n```\nThen type the names of a few fruits and, each one, press return.\
    \ For example:\napple\npear\nbanana\nthen press `ctrl+d`\nThe `cat` command will\
    \ read what was input from the keyboard and `>` will redirect it to the output,\
    \ screen, in a file named list1. If you wanted to read what the file had in it,\
    \ you would type:\n```\ncat list1\n```\nExercise: Now, using the same method,\
    \ create a file named `list2`, with these fruits in it – plum, orange, mango.\
    \ Now read the file contents.\n\n### 追加文件\n`>>` will append the standard output\
    \ to a file so, if we wanted to add some more items to `list1`, we would type:\n\
    ```\ncat >> list1\n```\nAnd then the names of more fruits:\ngrape\npeach\norange\n\
    then press `CTRL+d` to stop. To read the file contents, type:\n```\ncat list1\n\
    ```\nYou should, by now, have two files, one containing six fruits and one containing\
    \ four. Now we will join the two lists using the `cat` command into one file named\
    \ biglist:\n```\ncat list1 list2 > biglist\n```\nThis will read the contents of\
    \ both lists, in turn, and then output the text from each into a new file. To\
    \ read the contents of biglist, type in:\n```\ncat biglist\n```\n\n### 重定向输入\n\
    To redirect command input we use `<` symbol. This will sort a list in numerical\
    \ or alphabetical order. Type in:\n```\nsort\n```\nNow type some animal names\
    \ and press return after each of them:\nape\ncat\ndog\nthen press `CTRL+d` to\
    \ stop. The output would be:\n```\ncat < biglist\n```\nWhen you use `<` you can\
    \ redirect input from a file instead of the keyboard. For example, if you wanted\
    \ a list of fruits sorted, you would type in:\n```\nsort < biglist\n```\nThe list\
    \ will be sorted and output to the screen. If you wanted the sorted list to be\
    \ output to a file, you would type:\n```\nsort < biglist > slist\n```\nThe `cat`\
    \ command is used for reading the contents.\n\n### 管道\nIf you want to know who\
    \ is on the same system as you, you would type in:\n```\nwho | sort\n```\nThis\
    \ is a rather slow method and you would need to remember that temporary file has\
    \ to be removed when you are done. Really, you are looking to do is connect the\
    \ output from `who` command straight to the input of `sort`. This is what pipes\
    \ are and the symbol for the pipe is a vertical bar (`|`). For example, if you\
    \ typed in:\n```\nwho | sort\n```\nYou would get the same result but much quicker.\
    \ If you wanted to find out many other users have logged in, type in:\n```\nwho\
    \ | wc -l\n```\nExercise: Use pipes to show all of the lines in list1 and list2\
    \ that have the letter `p` in them and then sort the results. Answer: As is a\
    \ little complex, I have opted to show you:\n```\ncat list1 | grep p | sort\n\
    ```\n\n## 通配符\n`*` is a wildcard character and will match with none or more characters\
    \ in a directory or file name. For example, go to `linuxstuff` directory and type\
    \ in:\n```\nls *\n```\nThis shows you all the files that are in the current directory,\
    \ beginning with `list`. Now type in:\n```\nls *\n```\n`?` is another wildcard\
    \ character and is used to match one character. So, for example, if you were to\
    \ type `ouse`, it would match with files like `mouse` or `house`. See what happens.\n\
    \n## 文件名规范\nIt is worth noting that directories are special file types so the\
    \ naming conventions for files will also apply to a directory. When you name a\
    \ file you cannot use special characters, such as `*`, `/`, and `&`. You also\
    \ cannot use spaces so, when you name a use numbers and letters, along with the\
    \ underscore and the dot. Good names: `project.txt`, `my_big_program`. Bad names:\
    \ `project`, `my program`, `bob_billy`. File names begin with lowercase letters\
    \ and end with a dot and file extension that indicates the file contents. For\
    \ example, if you have files that have `.c` ending such as `prog1.c`, all you\
    \ need to type at the command prompt is\n```\nls *.c\n```\n\n## 帮助\nThere are\
    \ plenty of online manuals providing information about commands. The pages will\
    \ tell you what a command can do, options it can take and how of those options\
    \ will modify the command. If you wanted to read the page for a command you would\
    \ type in `man`. For example, if you wanted to know more about the `wc` command,\
    \ you would type in:\n```\nman wc\n```\nOr you could type:\n```\nwhatis wc\n```\n\
    This one would provide a short description of the command but won’t give you other\
    \ information about options, or anything else.\n\n## Apropos\nWhen you do not\
    \ know the name of the command exactly, you would type in:\n```\napropos keyword\n\
    ```\nThis will provide you all the commands with the word keyword in the page\
    \ header in the help manual. Try typing:\n```\napropos copy\n```\n\n## 章节总结\n\
    | 命令 | 含义 |\n| :--- | :--- |\n| `*` | matches any amount of characters |\n| `?`\
    \ | matches just one character |\n| `man` | will read the page in the online manual\
    \ for a specific command |\n| `whatis` | gives a short description of a specified\
    \ command |\n| `apropos` | will match a command with a keyword in the man page\
    \ |\n\n## 网络命令\nWorking as ethical hacker requires have a strong knowledge of\
    \ the most common commands. In the rest of the book, I will show you some of the\
    \ important ones. Try them out and you might end up creating combinations.\nCommand\
    \ to execute: `ifconfig`\nExplanation: utility to configure network interfaces.\
    \ It will be very useful to view the IP address assigned to a machine.\nCommand\
    \ to execute: `traceroute`\nExplanation: this allows you trace the path of a IP\
    \ packet. It is very useful for performing activities such as, for example, where\
    \ a packet stops or lost.\nCommand to execute: `dig`\nExplanation: this is another\
    \ utility needed to query DNS. In our exercises, we will often use this command.\n\
    Command to execute: `ssh`\nExplanation: this command allows us the connection\
    \ to remote hosts via an SSH protocol. The latter, unlike the TELNET one, carries\
    \ out data encryption. For this reason, in the event of traffic interception,\
    \ it will not be possible to clearly see any data.\nCommand to execute: `telnet`\n\
    Explanation: this command allows us the connection to remote hosts via TELNET.\
    \ This protocol does not perform data encryption, so you need to pay attention\
    \ when using it.\nCommand to execute: `nslookup`\nExplanation: this is another\
    \ utility to interrogate DNS.\nCommand to execute: `netstat`\nExplanation: this\
    \ to view network connections.\nCommand to execute: `ifup`\nExplanation: this\
    \ command to enable or disable network cards. It will be very useful when.\nCommand\
    \ to execute: `ping`\nExplanation: this is used to check whether a host is active\
    \ by sending ICMP packets to it and waiting for a response.\nCommand to execute:\
    \ `arp -a`\nExplanation: this provides us with a table of the links between a\
    \ MAC address and an IP address.\n\n## 系统管理命令\n- `uptime`: 显示系统运行了多久。\n- `users`:\
    \ 显示连接到系统的用户名。\n- `who / whoami`: 显示连接到系统的用户数以及当前用户的一些信息。\n- `crontab -l`: 显示当前用户的计划任务。\n\
    - `less / more`: 允许快速查看文件。\n- `service start / stop`: 允许启动或停止某个服务。\n- `free -h`:\
    \ 显示空闲和已用内存。\n- `top`: 检查系统中的活跃进程。\n- `ps`: 查看系统中的活跃和运行中的进程。\n- `kill`: 用于终止特定的进程。\n\
    \n"
