  trans: '


    * 漏洞扫描器

    * 端口扫描器

    * Web 应用扫描器

    * 密码破解工具

    * 数据包嗅探器


    # 漏洞扫描器

    漏洞被定义为非意的软件缺陷，黑客可以利用这些缺陷作为突破口，发送特木马、病毒、蠕虫等恶意软件。漏洞扫描器是一种用于检查网络或计算机系统弱点的非常高效的工具。它基本上是一个计算机程序。该扫描器的唯一目的是访问网络、应用程序和计算机系统以寻找漏洞。黑帽客和计算机安全管理员（通常是白帽客或蓝帽客）都会使用它。黑帽客利用它来寻找漏洞并从这些点获取未经授权的访问。白帽客也会检查漏洞，但他们是为了保护计算机系统而不是为了进入。数据通过端口传输。漏洞扫描器用于检查已开放或对计算机系统具有访问权限的端口。这用于快速检查网络中具有已知漏洞的计算机。通过限制端口，防火墙可以防御计算机，尽管它仍然存在漏洞。


    ## 漏洞扫描器的益处

    * 尽早发现问题

    * 可以轻松识别安全漏洞

    * 由于它显示了漏洞，因此进行处理


    ## 漏洞扫描器的类型


    ### 端口扫描器

    端口扫描器是一种专门设计用于搜索主机或服务器上开放端口的计算机应用程序。意图使用此工具的人应该具备 `TCP/IP` 的基础知识。攻击者利用它来识别运行在服务器或主机上的服务，意图破坏它。另一方面，管理员利用它来验证其网络安全策略。端口扫描是一个向选定端口范围发送请求的过程，目标是寻找活动端口。这只能发现漏洞，而不能用于攻击或防护。这种扫描的大部分用途是探测而非攻击。可以使用端口扫描器扫描多个主机，以寻找特定的监听端口。这个过程被称为端口扫描（port
    sweep）。这些特别用于用于特定类型的服务。其中之一是基于 SQL 的计算机蠕虫。它可能被用于端口扫描在 `TCP` 上监听的端口。


    #### 端口扫描的类型：


    ##### TCP 扫描

    当无法进行 `SYN` 扫描时，这些简单的端口扫描器会使用操作系统的网络功能。这是在我们通过 `Nmap`（在后面的章节中讨论）进行扫描时发生的情况。计算机操作系统将完成三次
    `TCP` 握手，然后立即关闭连接以避免 `DoS` 攻击。否则将返回错误代码。这种扫描模式的优点是用户不需要任何特殊权限。然而，这种扫描并不常见，因为操作系统的网络功能阻止了低级控制。此外，在使用端口扫描时，这种扫描被认为是“有噪声的”。因此，这种扫描不是首选方法，因为入侵检测系统可以记录发送者的
    IP 地址。


    ##### SYN 扫描

    这也是 `TCP` 扫描的一种。在这里，端口扫描器将自行生成原始 IP 包并监控响应，而不是使用操作系统的网络功能。`SYN` 扫描也称为“半开放扫描”。之所以这样命名是因为永远不会建立完整的
    `TCP` 连接。`SYN` 包将由扫描器生成。当发现开放端口时，扫描器将发送 `SYN-ACK` 包。主机将在完成握手之前通过响应 `RST` 包关闭连接。当我们使用原始网络时有几个优势，它们是：

    1. 扫描器对发送的数据包有完全控制权。

    2. 连接不会被单个服务接收。

    3. 扫描器对响应时间有完全控制权。这种扫描优于 `TCP` 扫描。


    ##### UDP 扫描

    `UDP` 扫描是一种无连接协议。虽然这种扫描是可能的，但存在技术挑战。关闭的端口会发送一个 `UDP` 回传，端口将响应 `ICMP` 响应，表示端口不可达。扫描器寻找
    `ICMP` 响应。如果主机没有响应，则端口是开放的。然而，如果主机受到防火墙保护，扫描器将收到一个表示端口开放的响应，但这是错误的。`ICMP` 速率限制也会影响这种方法。如果消息被拦截，所有端口似乎都是开放的。对于这一点，我们可以发送一些特定特定的
    `UDP` 包作为替代，并希望生成应用层响应。


    ##### 窗口扫描

    这种方法已经过时，很少使用。但窗口扫描相当可靠，可以确定端口是关闭还是开放、被过滤的还是未被过滤的。如果主机系统上有防火墙，可以使用这种方法。


    ### 网络漏洞扫描器

    这种类型的扫描器识别连接到网络的计算机系统的安全漏洞，以判断特定系统是否可以被利用或威胁。它是一个拥有已知缺陷数据库的软件。它通过测试系统来触发这些已知缺陷，从而扫描计算机系统以寻找这些已知漏洞。然后它将对该单个计算机系统或给定企业生成关于所有这些发现结果的报告。


    ### Web 应用扫描器

    有很多方法可以检查架构缺陷和安全回退。其中一种方法是 Web 应用安全扫描器，它充当用户和应用程序之间的通信器并识别这些问题。

    最常用的测试是黑盒测试。这意味着用户将不知道结果背后的逻辑是什么，但将获得关于结果的清晰信息，提供所需的完整信息。大多数扫描器通过抛出可能在现实场景中发生的随机测试用例进行分析并给出结果。这些
    Web 应用深受用户欢迎，因为它们充当与系统通信的简单平台，因此这些 Web 应用的用户界面对于应用程序的成功起着至关作用。

    用户可以使用这些应用程序执行多种操作，其中包括创建账户、通过提供标准查询数据库、添加大量所需内容以及进行不同类型的交易。当存储大量信息时，用户倾向于在这些应用程序中存储一些个人信息。

    这看起来像是一个简单方便的选项，但数据安全受到破坏的事实是大多数用户往往会忽略的。这也是内部泄露和黑客可以可利用的事实。因此，用户不仅要考虑便利性，还需要确保控制自己在这些
    Web 应用上共享信息的程度。

    Web 应用扫描器有很多各种优点，这里是其中几个：

    * 它们对于最后的匆忙检查缺陷非常有用。

    * 它们可以检查在相同场景下给定不同输入时可能获得各种结果，然后可以识别异常情况。


    '
- fmt: '

    The tools that are used for web application testing, such as scanners, are independent
    of the programming language used. So, irrespective of the language that the web
    application is coded in, the tool can work in its own way, dynamically changing
    the inputs for different languages. This gives the users complete freedom to test
    all their applications. Where there are strengths, weaknesses exist too. Here
    are a few of the weaknesses:


    * One of the major weaknesses of these tools is that the hackers use the same
    tools. So if the users are able to find flaws in the system, the hackers can find
    them easily, too. This poses a major threat to the community.

    * Many updates are being made to the languages that are used in designing web
    applications and most of the users use tools that are available for free. These
    free tools are normally built to a basic level, so new modifications and updates
    will not be available. Therefore, the random inputs that are being thrown at the
    system to find the anomalies will not have the updated inputs. This means there
    are a lot of potential threats that can be caused because of these missing inputs.

    * There is a high chance that the first few tools will have zero results; this
    causes high anxiety in the users, which will ultimately result in them using the
    new tools. This will cause the creation of new tools and the extinction of old
    tools.

    * The excessive use of the tools can also be a problem, as it will help the attackers
    to check their test cases theoretically. It makes it easy for them to send botnets.
    These cause spam in the web applications that might lead to information leakage.

    * The malware used by the attackers can be updated using these botnets. This type
    of updated malware can be very difficult to remove.

    * As already mentioned, the software that is being used in web application designs
    is constantly being updated and the tools that are being used are dynamically
    programmed depending on the language that is being used by the web application.
    No one can give a 100% guarantee that the results obtained belong to the whole
    source code. To get the complete coverage of the web application there are testers,
    called penetration testers, who carefully and closely analyze the results to verify
    that the entire source code of the web application has been covered.

    * The users must be aware that these tools will not be able to detect logical
    flaws in the source code, such as leakage of information and low level of encryption
    of the data.

    * These tools also have a difficult time detecting any technical flaws. It doesn''t
    mean that they are incapable of doing so, but the web application has to provide
    the right clues to enable these tools to identify the technical flaws.


    ## Password Cracking Tools

    The process of recovering passwords is known as password cracking. It is done
    on passwords that are transmitted and stored in the computer system. With this,
    one can gain access to a computer system by gaining the password of the user.
    The time required for cracking a password depends entirely on the strength of
    the password used. Most of the methods used usually require the computer system
    to produce many passwords, which are then checked individually.


    There are a lot of methods for cracking passwords. Brute force is one of them.
    It is a time-consuming process that uses all possible combinations of letters
    and words until it succeeds. In methods like word list substitution, dictionary
    attacks are performed before using brute force. The password cracking tools make
    the process very easy.


    ## Packet Sniffers

    Packet sniffers are also called protocol analyzers, packet analyzers, or network
    analyzers. They are pieces of hardware or software that are used to intercept
    and log the digital traffic passing over a network. Packet sniffers are used for
    capturing and, if needed, even decoding the packet''s raw data. It later uses
    the captured data and analyzes it for information. Some packet sniffers act as
    reference devices by generating their own traffic. The protocol analyzers are
    not limited to the software side. There are also hardware-based protocol analyzers.
    Advantages of packet sniffers can be given as follows:


    * You can analyze network problems.

    * Packet sniffers help in detecting the misuse of network by external or internal
    users.

    * Network intrusion attempts can be detected.

    * You can debug the network protocol implementations.

    * The data in motion can be monitored.

    * Exploited systems can be isolated.

    * Network statistics can be gathered and reported.

    * The proprietary protocols used can be reverse-engineered over the network.

    * Packet sniffers can be used for spying on users on the same network. Sensitive
    information like user cookies or login details can be collected.

    * The client-server communications can be debugged.

    * The suspect content from the network traffic can be filtered.

    * Moves, additions, and changes can be verified.

    * The effectiveness of the internal control systems like the firewalls, spam filters,
    web filters, etc., can be verified.


    ## Popular Hacking Tools

    The following are some well-known hacking tools (software) that make the tedious
    process of hacking a lot easier.


    ### Cain and Abel

    This is a popular hacking tool that helps in the recovery of passwords from systems
    running under `Windows OS`. This software recovers passwords by sniffing networks
    through cryptanalysis. This tool also relies on the brute force method for achieving
    the required results. `VoIP` (Voice over IP) conversations can be hacked and recorded
    using this hacking tool. Some of the tasks that can be performed by this tool
    are:


    * It can decode passwords that are in a scrambled form.

    * It can calculate hashes on strings (a set of characters/a word). A hash is a
    code generated by using a mathematical function on a string. Passwords are usually
    hashed before storing them in the database.

    * It can crack most of the widely used hashes.


    ### John the Ripper

    This well-known tool helps in password cracking by matching a string with the
    correct password that has locked the system. In general, passwords are not stored
    in the database in their original form. If passwords are stored as they, it is
    easy for hackers to steal them and break into the system, so passwords are encrypted
    and then stored in the database. Encryption is the technique in which an algorithm
    or a mathematical formula is used to convert data into a form that cannot be understood.
    What actually happens is the hacker provides this tool with a string that they
    think could be the password to the system. This tool then performs encryption
    on the string using the same encryption algorithm that has been used to store
    the actual password. It then matches the encrypted string with the actual password,
    which is present in the database. This tool can also take words from the dictionary
    as input.


    ### Wireshark

    This tool works by capturing and analyzing the network/data traffic, which may
    contain sensitive information like usernames/passwords or confidential files.
    It sniffs the required data packets in the network, captures them, and sends them
    as output to the person who hacked it. Such tools are called packet sniffers.
    Also, network administrators can search for weak spots by troubleshooting the
    network using this tool.


    ### Nessus

    Nessus is a tool that scans a system for vulnerabilities. The hacker provides
    this tool with the `IP address` of the system they intend to hack. Then, the tool
    scans the system, identifies its vulnerabilities, and delivers them to the hacker.
    After analyzing its vulnerabilities, the hacker can attack the system using other
    suitable hacking tools. Both `Windows OS` and `Linux OS` support Nessus.


    ### Nmap

    Nmap is a tool that scans the network for hosts (computers that form the network).
    Some of the tasks that can be performed by Nmap are as follows:

