    - [Chapter 7 : Protect yourself from cyber attacks and secure your computer and\
    \ other devices](#part0011.xhtml)\n- [Conclusion](#part0012.xhtml)\n\n## Introduction\n\
    In the most elemental definition, hacking can be described as the act of exploiting\
    \ the weaknesses and shortfalls in a computer system, as well as the network of\
    \ such a system. In the exploitation of these weaknesses, illegal acts might include\
    \ stealing private information, accessing a network’s configuration and altering\
    \ it, sabotaging the structural view of the computer’s operating system and much\
    \ more.\n\nHacking is practiced in almost all countries. However, it predominates\
    \ in developed countries. The advancement of information and technology within\
    \ the last two decades has shown that most hackers are based in developing countries\
    \ such as in South Asia and Southeast Asia.\n\nThe term “hacker” is the source\
    \ of a lot of controversy today and is confusing to many people. Some regard a\
    \ “hacker” as someone who has the power to make a computer do anything at will.\
    \ In another context, a hacker is viewed as a computer security specialist whose\
    \ primary job is to find the loopholes in a computer system or network and fix\
    \ them. These loophole finders are sometimes referred to as crackers. All of these\
    \ ambiguities in the world of hacking have made it hard to identify that a hacker\
    \ is, a fact that also makes it extremely difficult to detect the activity of\
    \ a hacker who may be playing around with your system. plethora of reasons are\
    \ behind hacking. Some people are into hacking simply to make money. They can\
    \ steal your password, break into your private information or even alter your\
    \ correct information and make it incorrect all for monetary gain. Other hackers\
    \ are in the game just for a challenge or competition. Furthermore, some hackers\
    \ are the computer world’s equivalent of social miscreants, whose purpose is to\
    \ gain access to a network or system. After gaining access, these hackers will\
    \ render the network useless so that the users cannot use it properly. For example,\
    \ if a community is protesting against something, it can try to hack into a system\
    \ as a sign of protest against the authorities. It can choose to do this instead\
    \ of breaking other laws that it considers to be important. There are different\
    \ types of hackers who have various intentions. Based on their modus operandi,\
    \ we can classify hackers into the following:\n\n### 1. WHITE HAT HACKERS\nThese\
    \ are the good guys because they do not have evil intentions. Perhaps they are\
    \ named “white-hat” hackers because the color white signifies purity and cleanliness.\
    \ They hack into a system to eliminate its vulnerabilities or as a means of carrying\
    \ out research for companies or schools that focus on computer security. They\
    \ are also known as ethical hackers. They perform penetration testing and assess\
    \ the vulnerabilities of computer systems.\n\n### 2. BLACK HAT HACKERS\n"
