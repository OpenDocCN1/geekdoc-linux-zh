    # 硬件破解


    你还以为只有软件能为你完成工作吗？硬件破解是一个计算机网络，这些计算机将共同工作以帮助破解你的密码。这些网络可以付费租用，并以闪电速度寻找你的密码。它们更广为人知的僵尸网络（botnets），仅用于破解密码的目的。


