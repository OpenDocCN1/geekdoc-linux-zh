    discuss how you can deal with threats in the future and what this means for the
    wider community. Having this extended network available to you will enhance your
    efforts in resisting cyber-attacks as well as having a role in discussing other
    emerging threats and protecting organizations facing these same threats.Increasing
    Security AwarenessIn times where security threats are prevalent and this requires
    an increase in awareness with all issues relating to cyber security. Having your
    organization become an authority in raising awareness within the community will
    help educate other organizations in how they can defend themselves against attacks
    and strengthen their own security which in turn will damage the cyberterrorist
    community as they face a stronger resistance. You can also raise awareness within
    your own organization through security training programs which will help all employees
    equip themselves with the right skillset to combat threats that could arise through
    their own negligence and will also help them be more alert in times when threats
    could be present.Chapter 7 : Protect yourself from cyber attacks and secure your
