    # Chapter 1 : Linux Basics![](rsrc7J.jpg)


    When you think of operating systems, the two that most often come to mind are
    Windows and Mac OS. These happen to be 2 of the most significant widespread and
    they have been around for some time with many different versions. They are popular
    primarily because of the computer systems they come with, and people usually use
    them simply because they come pre-installed. Whereas these two are the most popular,
    there is another operating system that is starting to gain some traction in the
    computer world; the Linux operating system. For the most part, Linux is found
    on mobile devices, smartphones, and tablets, but because it is open sourced and
    free, there are now more people with computers and laptops that are beginning
    to use Linux as their personal operating system. Since it is able to work with
    embedded systems, Linux is useful on mobile devices, computers, smart watches,
    routers, gaming consoles, controls, and even televisions.


    Linux is made with a straightforward design that a lot of programmers like. It
    is straightforward and has a lot of the power that other operating systems possess,
    but it is even easier to use. A lot of programmers because it is open source,
    meaning they are able to use it or make changes if they would like, and has all
    the features that they could possibly want for computers, mobile devices, and
    more. Most people are familiar with working on Windows or on the Mac OS, and they
    feel that Linux might not be as safe as some of the other options - but this is
    just simply not the case. In reality, Linux is one of the best operating systems
    out there. It is just newer than and not as well-known as some of the other operating
    systems, but since it is so easy to use and can also be used on mobile devices,
    it is quickly growing in popularity.


    ## How Linux came into existence


    Linux was first released during 1991. Initially, it was developed with the idea
    that it should be a free operating system for Intel x9 based personal computers.
    However, it was soon changed to become a more collaborative project, meaning that
    the source code was free to use. Under the license terms for the operating system,
    it is able to be modified and used for both non-commercial and commercial distribution.
    Since it is compliant with `POSIX` or the Portable Operating System Interface’,
    it is a very reliable operating system.


    The best fact about Linux is that it is open sourced and free to use, which may
    be why a lot of people are switching over to this operating system. Mac OSX and
    Windows all cost something for the user to get and they will either have to purchase
    the software on their own or have it put on a computer for them. This can get
    costly when you factor in the number of updates required for these operating systems.
    Since Linux is free, you are able to update at any time without additional costs.


    The open sourcing is helpful for both the programmers as well as everyday users
    with Linux. Programmers are able to use the various codes that are in the library
    in order to create some of their own new code and release it for others to use.
    Those who are on Linux get the benefits of better updates, newer features, and
    more, all thanks to the ability of many programmers being able to work on the
    system at the same time. All of this makes Linux an easy choice, especially going
    forward as it is compatible with both smartphones and tablets also.


    ## Linux Components


    There are seven main components of Linux that you will encounter. They are as
    follows:


    ### Availability of applications

    Linux has thousands of applications that are available for the user to install
    right away. In fact, as soon as you install the Linux system, you will be able
    to install as many of the applications as you choose. Think of the applications
    in Linux as similar to what you will find with the App Store and the Windows Store,
    where you are able to pick out the applications that you want to work with. Once
    you have done some searching and found the apps that you want, you can directly
    download and install them to the Linux system.


    ### Daemons

    The Daemons are basically the components in Linux that are going to serve as the
    background services. This would be things like scheduling, printing, and sound.
    These are going to be launched at one of two times; either during the boot or
    after you perform the desktop login.


    ### Desktop environments

    The environments for the desktop refer to the different components that work with
    user interaction. Some of the examples of these desktop environments include Enlightenment,
    Cinnamon, Unity, and GNOME. Each of these is going to come with their own set
    of web browsers, calculators, file managers, configuration tools, and some other
    features that have been built into the environment.


    ### Graphical server

    This is basically going to be the subsystem inside of Linux. The main function
    that you are going to see within this is that the graphical server it will show
    the different graphics that are on your screen. Sometimes you will hear it being
    called the ‘X server’ or simply as ‘X.’


    ### The boot loader

    As you keep using Linux, it comes a moment when you want to make sure that the
    system is going to boot up. The boot loader is going to take over the boot process
    inside of the Linux management. It is often going to be seen in the form of a
    splash screen. Once you see this splash screen show up, it is going to proceed
    over to the booting process slowly.


    ### The kernel

    The next main component that you will see within the Linux system is known as
    the kernel. This is essentially the core inside of Linux. It is going to be in
    charge of managing the CPU, peripheral devices, and the memory inside the Linux
    operating system.


    ### The Shell

    We are going to talk about the shell in more detail later on because it is vital
    when working with Linux, so for now, we will keep things simple. The shell is
    basically going to be the command line inside Linux. It is going to permit various
    controls based on the commands that the user types into the interface. This is
    where you are going to type in the codes and the commands that you want.


    ## Downloading Linux

    Downloading this system is pretty easy. You merely need to visit `www.ubuntu.com/downloads/desktop`
    in order to get this onto your computer. Once it has had time to get up, you should
    also take some time to add on some applications that you like. Of course, you
    can always add additional apps later if you would like, but you can also choose
    to get Linux onto USB drive so that you can have it whenever you need. Some people
    like to have it running on the system at all times, and others would rather just
    have it on certain times when they are writing programs or trying to do hacking.
    Both of these methods work fine; only depends on what you want to do with Linux.
    If you just want to use Linux on the side as an additional part of your system,
    it is best to download it to the USB so that you can have on the computer. It
    can take up a lot of space when you have two operating systems all the time and
    can potentially cause the other to slow down.


    ## Learning some basic commands in Linux

    There are a lot of commands that you will need to learn in order to get Linux
    to work well for your needs. Here we will cover some of the main ones that you
    may find useful, and later we will get into some of the different things that
    you are able to do. Some basic commands that you should know how to perform with
    Linux include:


    - `mkdir`: good for creating directories.

    - `rm`: allows you to remove a file without having the confirmation prompt.

    - `w`: displays information about the current user on the computer, whether that
    is just you or have more than one user on your system, as well as the average
    load for the user.

    - `uptime`: displays information about the system, the number of users on the
    system, and how long the system has been running.

    - `ls`: displays a list of files in a format that you are able to read. It also
    will display any new files that were created since their last modification.

    - `who`: displays the date, time, and host information.

    - `less`: allows you to view your files quickly. It is also used for page down
    and page up options.

    - `more`: makes it easier to do a quick view of the files, and can also display
    percentages as well.

    - `top`: displays managed tasks and the processor activity in real time. It also
    goes through and displays how the processor and memory are being used.

    - `last`: displays some more information about the activity of the user on the
    system. Some of the information you will notice includes kernel version, terminal,
    system boot, date, and time.


    As you can see, Linux is a programming system that is going to make it easier
    than ever to get tasks done, whether you are working online, on the phone, on
    a tablet, or through another method. It is free to install, but it is still stable
    and will often work just as well if not cooler than some of the other operating
    systems that are available.


    # Chapter 2 : A Guide on how networking command line works![](src96.jpg)


    This is the end of the chapter dedicated to the main Linux commands. We started
    with the general commands and then introduced those related to networks as well
    as to the main functions of an operating system. Now you are ready for the exercises
    I will present to you in the following chapters. But first, let me explain how
    networks work and what are the services most ethical hackers use. The more essential
    but basic Linux commands that you need to know so fire up Linux and play along.
    There will be exercises to test your knowledge along the way, although I won’t
    be providing answers to all of them because you should be able to work it out
    from the section you just read:


    ## Listing Directories and Files

    ### ls

    When your login, you will always be in your home directory. This will have the
    same name as you have for your username and it is where all your personal files
    and subdirectories will be saved. To find out the contents of your home directory,
    type in:

    ```

    ls

    ```

    if there aren’t any, you will be returned to the prompt. Be aware that, using
    the `ls` command, you will only see the contents whose name does not start with
    a dot. The files that start with the dot are hidden files and will normally have
    some important configuration information in them. The reason they are hidden is
    because you should not be touching them.


    To see all the files, including those with the dot, in your home directory, type
    in:

    ```

    ls -a

    ```

    You will now see all files including those that are hidden. `ls` is one of those
    commands that is able to take options, and the above one, `-a`, is just one of
    those options. These will change how the command works.


    ### Making a Directory

    ### mkdir

    To make a subdirectory of the home directory, to hold the files you create, for
    the purposes of this, we will call it `linuxstuff`, type in:

    ```

    mkdir linuxstuff

    ```

    To see that directory, type in:

    ```

    ls

    ```


    ### Changing to Another Directory

    ### cd

    `cd` means change directory from the current one to so, to change to the directory
    you created, you would type in:

    ```

    cd linuxstuff

    ```

    To see the content, of which shouldn’t be any right now, type:

    ```

    ls

    ```


    ### . and .. Directories

    Staying in the `linuxstuff` directory, type this in:

    ```

    ls -a

    ```

    You will see, and this is all directories called `.` and `..`. In Linux, a single
    dot (`.`) signifies the current directory so if you were to type in (making sure
    to leave a space between `cd` and the single dot):

    ```

    cd .

    ```

    you would stay exactly where you are in the `linuxstuff` directory. While this
    might not seem to have much use at first, you will soon find that typing `..`
    signifies the parent directory, which is the parent of the directory you are already
    in so if you were to type:

    ```

    cd ..

    ```

    you would go back one directory, in this case, to your home directory.


    ### Pathnames

    ### pwd

    `pwd` stands for print working directory and using a pathname lets you work out
    exactly where you are in the file system. He absolute pathname that goes with
    your home directory, you would type in cd and then type in:

    ```

    pwd

    ```

    You should see something like the pathname `/home/its/ug1/`. This means that the
    home directory is in a subdirectory called `its`, `ug1`.


    ## Section Summary

    | Command | Meaning |

    | :--- | :--- |

    | `ls` | lists the files and the directories |

    | `ls -a` | lists all directories and files including those hidden |

    | `mkdir` | makes a new directory |

    | `cd` | change to the directory named |

    | `cd ~` | change back to the home directory |

    | `cd ..` | change to the parent directory |

    | `pwd` | shows the pathname for the current directory |


    ## Copying Files

    ### cp

    If you wanted to copy `file1` in the working directory and name it `file2`, you
    would type in:

    ```

    cp file1 file2

    ```

    First, go to [this website](http://www.ee.surrey.ac.uk/Teaching/Unix/science.txt)
    and copy the text into a file. Name it `science.txt` and save it to your `linuxstuff`
    directory. So, now we are going to copy a file that is to be found in an open
    access part of the file system to the `linuxstuff` directory. First, you would
    get back to your `linuxstuff` directory by typing:

    ```

    cd ~/linuxstuff

    ```

    Then you would type the following at the prompt:

    ```

    cp /vol/examples/tutorial/science.txt .

    ```

    Note – do not forget to add the dot at the end. The command is saying that we
    are going to copy the file called `science.txt` to `linuxstuff` but we will keep
    the name the same


    ## Moving Files

    ### mv

    `mv file1 file2` will move or rename `file1` to `file2`. When you use the `mv`
    command, you will move the file and not copy it, ensuring that you still have
    just one file and not two. We can also use it to give a file a new name and we
    do this by moving it to the same directory it is already in but with a different
    name. Go back to your `linuxstuff` directory and type in the following:

    ```

    mv science.bak backups/

    ```

    Now type in `ls` and the `ls backups` and see what has happened.


    ## Removing a File or Directory

    ### rm

    ### rmd

    To delete a file, or remove it, we use the `rm` command. Let’s make a copy of
    `science.txt` and then we will delete it. From your `linuxstuff` directory, type
    in:

    ```

    cp science.txt tempfile.txt

    ls

    rm tempfile.txt

    ls

    ```

    If you want to remove an entire directory, first make sure there are no files
    in it and then use the `rmdir` command. Have a go at removing the directory called
    `Backups` – Linux won’t allow it because it has something in it. Exercise: Use
    `mkdir` to create a new directory named `tempstuff` and then use the `rmdir` command.


    ## Displaying File Contents on the Screen

    ### clear

    Before we move on, lets clear our window of all the commands already typed in
    that we can better understand the output of the next commands. To do this, type:

    ```

    clear

    ```

    ### cat

    `cat` is used to concatenate and display a file’s content on your screen. Type
    in:

    ```

    cat science.txt

    ```

    You will see that the file is bigger than the window so it will scroll, making
    the contents hard to read.


    ### less

    This command will write the file contents to the screen one page at a time. Press
    on space bar if you need to see the next page and, if you have read enough, type
    in `q`.

    ```

    less science.txt

    ```

    ### head

    This command will write the first ten lines of the specified file to your screen.
    Clear your screen and type in:

    ```

    head science.txt

    ```

    Now type:

    ```

    head -5 science.txt

    ```

    Look at what you go and decide adding `-5` to the command.


    ### tail

    As opposed to the `head` command, the `tail` command will write the last ten lines
    of the specified file to your screen. Clear your screen and type in:

    ```

    tail science.txt

    ```


    ## Looking Through a File’s Contents

    Using the `less` command, you can search for a keyword pattern in a text file.
    For example, if you wanted to find all instances of `science` in the `science.txt`
    file, you would type in:

    ```

    less science.txt

    ```

    And then, staying in `less`, type a forward slash and the work you want to search:

    ```

    /science

    ```

    All the instances of the word are highlighted


    ### grep

    `grep` is one the standard utilities on Linux and is used to search for specific
    patterns or words. Clear your screen and type in:

    ```

    grep science.txt

    ```

    `grep` is case sensitive and will distinguish between `science` and `Science`.
    If you want to ignore this case sensitivity, use `-i`. For example, to search
    for `spinning top`, you would type in:

    ```

    grep -i ''spinning top'' science.txt

    ```

    Other options with the `grep` command are:

    - `-v`: will display the lines that don’t match the specified text.

    - `-n`: will precede each of the matching lines with the correct line number

    - `-c`: will only print out the total number of the matched lines

    Have a go at these and see what the results are. You can use more than one of
    these in command to show the number of lines that do not include `Science` or
    `science`, you would type in:

    ```

    grep -ivc science.txt

    ```


    ### wc

    `wc` is a neat utility and is short for word count. If you wanted to do a total
    word count on the `science.txt` file, you would type:

    ```

    wc -w science.txt

    ```

    If you want to know how many lines are in the file, type:

    ```

    wc -l science.txt

    ```


    ## Section Summary

    | Command | Meaning |

    | :--- | :--- |

    | `cp file1 file2` | copies `file1` and names it `file2` |

    | `mv file1 file2` | moves or renames `file1` to `file2` |

    | `rm file` | removes a file |

    | `rmdir` | removes a directory |

    | `cat file` | displays a file |

    | `less files` | shows one page of a file at a time |

    | `head file` | displays just the first 10 lines of a file (or however many specified)
    |

    | `tail file` | displays the last 10 lines or however specified of a file |

    | `grep "keyword" file` | searches for a specific keyword in a file |

    | `wc "keyword" file` | counts how many characters or words are in a file |


    ## Redirection

    Most of the processes that are initiated by Linux commands will write to the terminal
    screen, which is the standard output. Many of them also take their input from
    the keyboard. As well as that, there are also those that write error messages
    to the terminal screen. Already, we have used the `cat` command to write a file’s
    contents to the terminal so now type the following, without specifying any file:

    ```

    cat

    ```

    Type a few words in using the keyboard, anything will do, and then press return.
    Hold down `CTRL` and press the `d` key – this will finish the input. When you
    run the `cat` command without a file, it will read the keyboard input and, when
    it receives the end of the file, the `d`, it will copy it to your terminal. In
    Linux, we are able to redirect input and output.


    ### Redirecting Output

    The `>` symbol is used to redirect command output. For example, if we wanted to
    create a file with a name of `list1`, that had a list of fruits in it, we would
    type:

    ```

    cat > list1

    ```

    Then you type the names of a few fruits and, after each one, press return. For
    example:

    apple

    pear

    banana

    then press `ctrl+d`

    The `cat` command will read what was input from the keyboard and `>` will redirect
    it to the output, the screen, in a file named as `list1`. If you wanted to read
    what the file had in it, you would type:

    ```

    cat list1

    ```

    Exercise: Now, using the same method, create a file named `list2`, with these
    fruits in it – plum, orange, grapefruit, mango. Now read the file contents.


    ### Appending to Files

    `>>` will append the standard output to a file so, if we wanted to add some more
    items to `list1`, we would type:

    ```

    cat >> list1

    ```

    And then the names of more fruits:

    grape

    peach

    orange

    then press `CTRL+d` to stop. To read the file contents, type:

    ```

    cat list1

    ```

    You should, by now, have two files, one containing six fruits and one containing
    four. Now we will join the two lists using the `cat` command into one file named
    `biglist`:

    ```

    cat list1 list2 > biglist

    ```

    This will read the contents of both lists, in turn, and then output the text from
    each into a new file. To read the contents of `biglist`, type in:

    ```

    cat biglist

    ```


    ### Redirecting Input

    To redirect command input we use `<` symbol. This will sort a list in numerical
    or alphabetical order. Type in:

    ```

    sort

    ```

    Now type some animal names and press return after each of them:

    ape

    cat

    dog

    then press `CTRL+d` to stop. The output would be:

    ```

    cat < biglist

    ```

    When you use `<` you can redirect input from a file instead of the keyboard. For
    example, if you wanted a list of fruits sorted, you would type:

    ```

    sort < biglist

    ```

    The list will be sorted and output to the screen. If you wanted the sorted list
    to be output to a file, you would type:

    ```

    sort < biglist > slist

    ```

    The `cat` command is used for reading the contents.


    ### Pipes

    If you want to know who is on the same system as you, you would type in:

    ```

    who | sort

    ```

    This is a rather slow method and you would need to remember that temporary file
    has to be removed when you are done. Really, you are looking to do is connect
    the output from `who` command straight to the input of `sort`. This is what pipes
    are and the symbol for the pipe is a vertical bar (`|`). For example, if you typed
    in:

    ```

    who | sort

    ```

    You would get the same result but much quicker. If you wanted to find out many
    other users have logged in, type in:

    ```

    who | wc -l

    ```

    Exercise: Use pipes to show all of the lines in `list1` and `list2` that have
    the letter `p` in them and then sort the results.

    Answer: As is a little more complex, I have opted to show you the answer time:

    ```

    cat list1 list2 | grep p | sort

    ```


    ## Wildcards

    `*` is a wildcard character and will match with none or more characters in a directory
    or file name. For example, go to your `linuxstuff` directory and type in:

    ```

    ls list*

    ```

    This shows you all of the files that are in the current directory, beginning with
    `list`. Now type in:

    ```

    ls *list

    ```

    This shows all the files that end with `list` in the current directory. `?` is
    another wildcard character and is used to match one character only. So, for example,
    if you were to type `ouse`, it would match with files like `mouse` or `house`,
    but wouldn’t match `grouse`. Type in:

    ```

    ls ?list

    ```

    And see what happens.


    ## Filename Conventions

    It is worth noting that directories are special file types so the naming conventions
    for files will also apply to a directory. When you name a file, you cannot use
    special characters, such as `*`, `/`, and `&`. You also cannot use spaces so,
    when you name a file use numbers and letters, along with the underscore and the
    dot.

    Good names: `project.txt`, `my_big_program.c`

    Bad names: `project`, `my big program c`, `bob_billy.doc`

    File names begin with lowercase letters and end with a dot and a file extension
    that indicates the file contents. For example, if you have files that have C code
    in them they may have the `.c` ending such as `prog1.c`. To list all the files
    that have C code in the home directory, all you need to type at the command prompt
    is

    ```

    ls *.c

    ```

    from the home directory.


    ## Help

    There are plenty of online manuals providing information about commands. The pages
    will tell you what a command can do, the options it can take and how each of those
    options will modify the command. If you wanted to read the page for a command
    you would type in `man`. For example, if you wanted to know more about the `wc`
    command, you would type in:

    ```

    man wc

    ```

    Or you could type:

    ```

    whatis wc

    ```

    This one would provide a short description of the command but wouldn’t give you
    any other information about options, or anything else.


    ## Apropos

    When you do not know the name of the command exactly, you would type in:

    ```

    apropos keyword

    ```

    This will provide you all the commands with the word keyword in the page header
    in the help manual. Try typing:

    ```

    apropos copy

    ```


    ## Section Summary

    | Command | Meaning |

    | :--- | :--- |

    | `*` | matches any amount of characters |

    | `?` | matches just one character |

    | `man` | will read the page in the online manual for a specific command |

    | `whatis` | gives a short description of a specified command |

    | `apropos` | will match a command with a keyword in the man page |


    Command to execute: `ls`

    Explanation: this command allows you to list the contents of files and/or folders.

    Command to execute: `pwd`

    Explanation: the current directory is printed.

    Command to execute: `cd`

    Explanation: it allows you to access the selected folder.

    Command to execute: `cp`

    Explanation: this allows you to copy files.

    Command to execute: `mkdir`

    Explanation: it allows to create a folder.

    Command to execute: `rmdir`

    Explanation: it allows to remove a folder.

    Command to execute: `touch`

    Explanation: it allows to create a file.

    Command to execute: `tar`

    Explanation: it creates an archive for a certain file.

    Command to execute: `clear`

    Explanation: it allows to return to an initial shell.

    Command to execute: `adduser`

    Explanation: it allows to add a new user.

    Command to execute: `chmod`

    Explanation: it manages file permissions.

    Command to execute: `vi`

    Explanation: it allows to edit a file.

    Command to execute: `cat`

    Explanation: it allows manipulation of file.

    Command to execute: `grep`

    Explanation: it searches a file for particular patterns.

    Command to execute: `apt-get`

    Explanation: package management. For example, `apt-get install`. Here above is
    a complete list of all the basic commands you should try out. They can help you
    carry out the exercises.


    ## Network command

    Working as ethical hacker requires have a strong knowledge of the most common
    commands. In the rest of the book, I will show you some of the important ones.
    Try them out and you might end up creating combinations.

    Command to execute: `ifconfig`

    Explanation: utility to configure network interfaces. It will be very useful to
    view the IP address assigned to a machine.

    Command to execute: `traceroute`

    Explanation: this allows you to trace the path of an IP packet. It is very useful
    for performing activities such as, for example, where a packet stops or lost.

    Command to execute: `dig`

    Explanation: this is another utility needed to query DNS. In our exercises, we
    will often use this command.

    Command to execute: `ssh`

    Explanation: this command allows us to make connections to remote hosts via an
    SSH protocol. The latter, unlike the TELNET one, carries out data encryption.
    For this reason, in the event of traffic interception, it will not be possible
    to clearly see any data.

    Command to execute: `telnet`

    Explanation: this command allows us to make connections to remote hosts via TELNET
    protocol. This protocol does not perform data encryption, so you need to pay attention
    when using it.

    Command to execute: `nslookup`

    Explanation: this is another utility to interrogate DNS.

    Command to execute: `netstat`

    Explanation: this is a command of the utmost importance. It allows us to view
    the network connections opened at a certain time. Useful for verifying anomalies
    due to network connections were not established or lost. Here again, take some
    time to improve your knowledge.

    Command to execute: `ifup`

    Explanation: this command allows to enable or disable network cards. It will be
    very useful in certain situations, perhaps when a reboot of network services is
    required.

    Command to execute: `ping`

    Explanation: this is used to check whether a certain host is active or not by
    sending special ICMP packets to it and waiting for a response.

    Command to execute: `arp -a`

    Explanation: the ARP-A command provides us with a table of the links between a
    MAC address and an IP address. For example, it can be used when we want to exclude
    problems concerning the lower levels of the ISO/OSI model (data level). Here are
    all the commands related to networking. Of course, this list does not include
    them all, there would be much more to say. However, you will do great later if
    you begin to become familiar with these commands.


    ## Commands related to system management

    Command to execute: `uptime`

    Explanation: this command shows you for how long a certain system has been active.

    Command to execute: `users`

    Explanation: this command shows the user names of users connected to a system.

    Command to execute: `who / whoami`

    Explanation: this is another command that informs us how many users are connected
    to the system as well as some additional information.

    Command to execute: `crontab -l`

    Explanation: this command allows the display of scheduled jobs related to the
    current user. We will see later what the jobs are.

    Command to execute: `less / more`

    Explanation: this command is very useful because it allows to quickly view a file.
    Press the q key to exit this particular display.

    Command to execute: `ssh`

    Explanation: this command allows the connection to a remote host via an SSH protocol.
    The latter, unlike the TELNET one, carries out data encryption. For this reason,
    in the event of traffic interception, it will not be possible to clearly see any
    data.

    Command to execute: `ftp`

    Explanation: this command allows the connection to an FTP server via the FTP protocol.
    This protocol does not perform data encryption, so you need to pay attention when
    using it.

    Command to execute: `service start / stop`

    Explanation: this command allows you to start or stop a certain service. You will
    use it on many occasions.

    Command to execute: `free -h`

    Explanation: this command shows the amount of free and used memory. For example,
    it can be used when there are performance problems on a machine.

    Command to execute: `top`

    Explanation: this command allows you to check the active processes in a system.
    It can be useful if a machine is running very slowly for no apparent reason.

    Command to execute: `ps`

    Explanation: with this command you can view the active and running processes in
    a system.

    Command to execute: `kill`

    Explanation: this command is used to terminate a certain process. However, it
    is necessary to first identify the PID related to that specific process.


