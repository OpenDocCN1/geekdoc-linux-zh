    我们将逐一介绍 Kali Linux 中适用于所有类别的工具，并理解每个工具的作用以及它们将如何在安全领域为我们提供帮助。


    # 攻击工具 (Exploitation Tools)


    在计算机网络中（通常是在互联网上），会有多个 Web 应用程序，由于代码编写不当或服务器上公开可访问的开放端口，会导致系统变得脆弱。利用工具可以帮助你针对系统并利用该系统中的漏洞，从而帮助你修补漏洞。让我们一个一个来看
    Kali Linux 中可用的所有利用工具。


    ## Armitage

    `Armitage` 由 Raphael Mudge 开发，用作 `Metasploit` 框架的 GUI 前端。`Armitage` 是一个可以推荐漏洞利用的工具，作为一种以图形化形式提供的网络攻击管理工具，它的用法非常简单。它是一个开源且免费的安全工具，主要以其在共享会话（sessions）上提供的数据以及通过单个
    `Metasploit` 实例提供的通信而闻名。`Armitage` 帮助用户启动漏洞利用和扫描，获取利用建议，并探索 `Metasploit` 框架中提供的高级功能。


    ## 后门工厂 (The Backdoor Factory - BDF)

    `Backdoor Factory` 是研究人员和安全专业人员常用的工具。该工具允许用户将其所需的代码包含在系统或应用程序的可执行二进制文件中，并在正常状态下继续执行二进制文件，就像没有添加额外代码一样。你可以在终端中使用以下命令在你的
    Kali Linux 系统上安装此工具。


    ```bash

    apt-get update

    apt-get install backdoor-factory

    ```


    ## 浏览器利用框架 (The Browser Exploitation Framework - BeEF)

    `Browser Exploitation Framework` 是一个为测试 Web 浏览器漏洞而构建的渗透测试工具。观察发现，Web 浏览器正利用客户端漏洞成为攻击目标。`BeEF`
    帮助用户分析这些客户端攻击向量。与其他工具不同，`BeEF` 侧重于评估作为大门的 Web 浏览器，它会越过网络层和客户端系统。


    ## Commix

    `Commix` 为渗透测试人员、Web 开发人员和研究人员提供用例（`COMMand Injection eXploiter` 的缩写），在简单的环境中测试
    Web 应用程序。它基本上允许用户发现 Web 应用程序中命令注入相关的错误、漏洞 或漏洞。该工具可以让你轻松识别并利用命令注入漏洞。`Commix` 工具是用
    `Python` 语言开发的。


    ## Crackle

    Kali Linux 中的 `Crackle` 工具是一个用于破解和拦截蓝牙设备之间流量的暴力破解程序。大多数蓝牙设备都有 4-6 位的配对代码，该代码是加密格式的。使用
    `Crackle`，如果两个设备之间的配对过程被拦截，这些代码就可以被解密，从而让你监听两个设备之间发生的所有通信。


    ## jboss-autopwn

    `JBoss Autopwn` 是一种用于 `JBoss` 应用程序的渗透测试工具。`JBoss Autopwn` 的 Github 版本已经过时，最后更新是
    2011 年。它是一个历史性工具，现在不再常用。


    ## Linux 漏洞建议器 (Linux Exploit Suggester)

    `Linux Exploit Suggester` 工具提供了一个脚本，用于跟踪漏洞并显示所有可能的利用方法，帮助用户在渗透测试期间获取 root 权限。该脚本使用
    `uname -r` 命令查找 Linux 操作系统的内核版本。此外，它还会提供 `-k` 参数，用户可以通过它手动输入 Linux 操作系统的内核版本。


    ## Maltego Teeth

    `Maltego` 是一种用于数据挖掘的交互式工具。它提供了一个交互式界面，输出图表以帮助进行链路分析。由于它允许链路分析，`Maltego` 用于互联网调查，以发现分散在互联网各个网页上的上的信息之间的关系。`Maltego
    Teeth` 是后期开发的，增加了一个功能，让渗透测试人员能够使用图形化界面进行密码破解、SQL 注入和漏洞检测。


    ## sqlmap

    `sqlmap` 是一个开源的 Kali 工具，用于渗透测试。它允许自动检测 SQL 注入漏洞并利用该漏洞来接管数据库服务器。它配备了非常强大的检测引擎、一系列可以帮助极高水平的渗透测试人员的工具，以及可以帮助获取信息的开关，例如数据库指纹识别、从数据库中检索数据、访问操作系统的文件系统以及在操作系统上执行命令。


    ## Yersinia

    `Yersinia` 是一个检测网络协议弱点并利用这些弱点的工具。它是一个用于测试和分析网络及系统部署的坚实框架。它包含二层（layer-2）攻击，利用给定网络中各种二层协议的弱点，从而允许渗透测试人员检测二层网络缺陷。`Yersinia`
    在渗透测试期间用于对 DHCP 服务器、交换机等使用生成树协议（spanning tree protocol）的网络设备发起攻击。


    ## Cisco-global-exploiter

    `Cisco Global Exploiter` (`CGE`) 工具是一个安全测试利用引擎/工具，简单、快速且先进。思科（Cisco）交换机和路由器有 14
    个漏洞可以使用 `Cisco Global Exploiter` 工具进行利用。`Cisco Global Exploiter` 基本上是一个 perl 脚本，通过命令行驱动，并带有一个简单易用的前端。


    ## Cisco-torch

    `Cisco Torch` 是一种利用工具，它与普通扫描器的不同之处在于，它可以在特定时间启动多次同时扫描，从而使任务完成得更快、更高效。除了网络层外，它还帮助对
    OSI 模型应用层中的系统进行指纹识别。这是即使是如 `NMAP` 这样的工具无法提供的功能。


    # 取证工具 (Forensics Tools)


    我们现在列出并学习 Kali Linux 中用于取证领域的工具。


    ## Binwalk

    `Binwalk` 工具在处理二进制镜像时非常有用。让我们扫描镜像文件以寻找可能嵌入在镜像文件中的可执行代码。对于知道自己在做什么的用户来说，这是一个非常强大的工具，因为它可以揭示隐藏在图像中的漏洞或黑攻击。`Binwalk`
    工具是用 `python` 开发的，并利用了 python 的 `libmagic` 库，使其成为处理 Unix 系统特征的合适工具。


    ## Bulk-extractor

    `bulk-extractor` 工具是调查人员常用的一种有趣工具，用于从数字文件中提取特定数据。它可以帮助检索 URL、电子邮件地址、借记卡号等。这些工具可以扫描文件甚至是磁盘镜像。最棒的部分是，即使数据部分损坏或处于压缩格式，该工具仍然能够找到数据。如果反复发现数据（如电子邮件地址、URL），该工具可以帮助提取数据并最终创建一个直方图。


    ## Chkrootkit (chkrootkit)

    `chkrootkit` 工具通常用于现场启动（live boot）场景，用于在本地检查主机是否安装了任何 rootkits。该工具有助于加固系统，确保系统未被破坏。`chkrootkit`
    工具还可以扫描系统文件以检查任何修改、临时删除和日志删除。


    ## Pof (pof)

    `pof` 工具可以帮助用户通过拦截主机的传输包来检测其操作系统，无论目标是否在防火墙后面。考虑到这些功能，`pof` 还可以帮助检测防火墙、NAT 设备以及负载均衡器的存在。


    ## Pdf-parser (pdf-parser)

    `pdf-parser` 工具用于解析 PDF 文件以分类元素。由于该工具的输出是 PDF 文件，人们可能不会推荐将其用于教科书案例，但它有助于完成工作。`pdf-parser`
    也用于解析可能在 PDF 文件中嵌入的脚本。


    ## Dumpzilla (Dumpzilla)

    `Dumpzilla` 工具是用 `python` 开发的。该工具的目的是从感兴趣的 Web 浏览器（如 Seamonkey 和 Iceweasel）中提取信息。


    ## Drescue

    `ddrescue` 工具是一个救援工具，有助于将数据从一个设备（如硬盘或 CD-ROM）复制到另一个设备。它是一个救星，因为它首先复制部分以避免源端的任何错误。`ddrescue`
    工具的基本操作是完全自动的，这意味着一旦启动它，就不需要任何提示。通过该工具的 `mapfile` 特性，数据将高效地恢复，并且你可以随时停止并在以后重新启动。


    # 第 5 章：攻击过程以及攻击者如何掩盖踪迹


    计算机作为独立的硬件，并不是智能机器。是为计算机编写的程序决定了它能做什么做什么。本章将教你一些编程的基本原理以及如何选择编程语言。


    ## 为什么你需要学习编程语言来黑客

    计算机使用一系列开关运行。这些电子开关以不同的组合开启/关闭。这创建了计算机的功能。为了让计算机开启或关闭开关，程序使用二进制代码发送消息。二进制代码是 0
    和 1 的序列，其中 0 表示开启，1 表示关闭。二进制代码的问题在于它极其复杂。即使是高级程序员也要花费长时间来解释代码，更不用说修改它来实现想要的功能。这就是编程语言的用场。编程编译器将编程语言中的预定义命令翻译成计算机读取的二进制代码。


    ## 关于编程语言的若干考虑（和术语）

    要选择最适合学习的程序，你应该考虑想用你的黑客/计算机知识做什么。在学习不同语言时，你可能会遇到一些常见术语：


    ### 语言代 (Language Generation)

    通常来说，随着技术的进步，计算机语言也在不断发展。目前有五代：

    - 第一代 (`1GL`) 是最原始的。它们很难编写，因为它们是用二进制代码（0 和 1）编写的。

    - 第二代 (`2GL`) 通常被称为汇编语言。这是第一步，允许程序员对命令使用符号名称，而不仅仅是二进制代码。

    - 第三代 (`3GL`) 是另一项进步，开发了如 `Javascript`、`Java`、`C` 和 `C++` 等高级语言。

    - 第四代 (`4GL`) 是一种语言，用于数据库访问，最常见的是 `SQL`。

    - 第五代 (`5GL`) 是目前最先进的语言，用于神经网络。神经网络模仿人类思维。


    ### 面向过程 vs 面向对象编程 (Procedure vs. Object-Oriented Programming)

    面向过程的使用结构化方法。问题（例如你的黑客目标）被分成各个部分，每个部分被称为过程。面向对象的编程允许在不同的数据类型之间建立关系，称为类。这使得编程更容易。最常见的面向对象语言包括
    `Java`、`C++` 和 `PHP`。


    ### Volatility (Volatility)

    当涉及到内存取证时，`Volatility` 是一个非常流行的工具。它用 `python` 语言开发，便于从易失性内存（如 `RAM`）中提取数据。它兼容几乎所有
    Windows 变体、32 位和 64 位架构，以及 Linux 和 Android 版本。该工具接受各种格式的内存储，如崩溃储、休眠文件、虚拟快照等。主机的运行状态是独立于主机调查的。因此，通过运行期间解密的密码，`Volatility`
    对于调查位于硬盘上的可能被加密的文件来说是一个救星。


    ### Autopsy (Autopsy)

    `Sleuth Kit` 是一个开源数字取证工具包，可以用于各种文件系统，如 `FAT`、`EXT2`、`EXT3` 和镜像。`Autopsy` 是为 `Sleuth
    Kit` 开发的图形界面，提供了哈希过滤、时间线分析和关键词搜索等功能。它也非常多功能，允许你在启动 `Autopsy` 时向现有集合添加其他模块。


    ### Xplico (Xplico)

    `Xplico` 是一个开源取证工具，用于网络取证。如果你想从使用网络协议或互联网的应用程序中提取数据，`Xplico` 支持所有流行的网络协议，如 `HTTPS`、`SMTP`、`IMAP`、`SIP`、`UDP`
    等。它支持 `IPv4` 和用于存储工具输出数据的 `SQLite` 数据库。


    # 真实世界示例：使用 Python 编写代码和程序的指南


    ## 第一步：下载并安装 Python 和其他基本元素

    你可以访问 Python 网站安装 `Python`。你应该为你的操作系统选择最新的解释器。`Python` 兼容 `Windows`、`OS X` 和 `Linux`。你应该注意，如果你运行
    `OS X` 或 `Linux` 系统，它们可能已经安装了 `Python`。即使如此，如果你的电脑设置已有几年，你可能想从 Python 网站下载更新的程序。


    一旦有了 `Python` 程序，你还没有准备好。你还需要下载 `Python 解释器`。解释器会在文本编辑器和计算机之间翻译（以及发送）信息。最后，你需要一个文本编辑器。虽然预装的程序如
    `TextEdit` 或 `Notepad` 可以用，但使用特定的文本编辑器如 `JEdit`、`TextWrangler` 或 `Notepad++` 编写代码更容易。


    ## 第二步：学习基础知识并编写你的第一个程序

    有了解释器后，你会发现像 `Python` 这样的高层语言是非常容易用的。尽管如此，通过了解程序的的基础知识，可以让编程（以及后的黑客）变得更容易。学习这些基础知识最简单的方法是开始编程，启动
    `Python` 并打开 `Python 解释器`。本节的代码属于 https://www.stavros.io/tutorials/python/。


    ### 属性 (Properties)

    `Python` 是一种类型语言，这意味着类型将被强制。它是隐式和动态类型，这意味着变量不需要声明。它是区分大小敏感的，所以 `name` 和 `NAME`
    是两个含义不同的独立变量。`Python` 也是面向对象的，这意味着它内部的一切都是对象。


    ### 获取帮助 (Getting Help)

    你可以随时从解释器在 `Python` 中获取帮助。例如，如果你想知道特定对象是如何工作的，可以在解释器中输入 `help(<name of object>)`。其他有用命令是
    `dir()`，它将显示指定对象的方法，以及 `<name of object>.Doc`，它显示指定对象的文档字符串。


    ### 语法 (Syntax)

    在 `Python` 中，语句没有强制的终止符，代码块必须缩进。任何需要缩进的语句都应该以冒号 (`:`) 结尾，所有注释都以 `#` 开头。注释基本上是你写给自己或他人的关于代码作用的笔记。我们使用
    `=` 赋值，使用 `==` 进行等性测试。要减少或增加值，我们在右侧使用 `+` 或 `-` 运算符。


    ### 数据类型 (Data Type)

    `Python` 允许创建数据类型，这使得编程更容易。

    '
