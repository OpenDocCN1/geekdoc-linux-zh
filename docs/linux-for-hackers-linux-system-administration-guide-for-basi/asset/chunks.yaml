- fmt: '

    Searching for the applicants on the Internet has become a customary practice for
    employers before recruiting them. All of this information is given by search engines
    like `Google` and can be seen by anyone searching for you. If you search yourself
    on the net, there is the possibility of finding all the websites in which you
    have an account. You should also search for images. Getting an understanding of
    your footprint is the first step toward controlling it.


    ## 2. Deactivate your old social media accounts and check the privacy settings

    `Facebook`, `Google+`, `LinkedIn`, `Twitter`, `MySpace`, etc., are some of the
    social media sites that can be mined for personal information. If your privacy
    settings are not tight, viewers can get a look at your pictures, status updates,
    and posts that are in your personal life. You should always remember that the
    open web forgets about context and your posts can be misconstrued. There is a
    possibility of events happening years ago hampering your prospects. Although you’re
    personal life is separate from your professional life, your profile may not interest
    the people who are trying to hire you. You should always check your privacy settings
    of accounts in which you are active. For example, if it is your `Facebook` account,
    you can go to the account settings on the top right corner of your page and select
    the privacy option from the list. Here you can decide who can access your information,
    which can search you using your mobile number or email address, etc.


    In the case of `Twitter`, you can get to the settings by clicking on your avatar
    on the top right corner of your profile. This provides you with a range of account
    options and you can also make your profile private. Not adding your last name,
    or by using a different last name can completely hide your account.


    ## 3. Hide other information or add false information

    Honesty is not considered the best policy when you are dealing with accounts in
    social media sites if you wish to maintain a low profile. Some social media sites
    only allow you deactivate your account, but not to delete it completely. You should
    change your information as much as possible in such cases. Information like your
    profile name, email address, and profile picture should be changed before you
    deactivate your account. And if anyone tries to search for you, they will only
    be able to see the information you updated recently.


    ## 4. Contact webmasters

    You can remove your information by contacting the website''s webmasters and it
    is one of the best options available. You can ping them or mail them, explaining
