    专为那些了解赛车手狂热状态的人士准备。这款游戏被形象地命名为 ManiaDrive，是一款速度极快的游戏，拥有赛道转弯、惊心动魄的跳跃、背景音乐（ManiaDrive
    6）以及震撼的体验。ManiaDrive 实际上是 Nadeo Studio 的《Trackmania》游戏的克隆版。ManiaDrive 包含训练模式，让你为实战做好准备，并可以与其他玩家在线对战。你可以从
    maniaadrive.radium.org 开始驾驶。


    当你启动 ManiaDrive 时，确保阅读“新手故事”，它将引导你完成各项要求的动作。当你准备好接受挑战时，选择“专业故事模式”。这个游戏与其说是一场比赛，不如说是一场耐力测试。时钟计时，你的速度会被记录（在线针对他人或其他本地），因为比赛持续时间短，不到一分钟。如果你准备好应对这一点，可以从
    maniaadrive.radium.org 开始驾驶。


    图 6。是的，它看起来就是那样。路上有一个巨大的缺口。踩油门，跳跃，保持直行，并保持你的……


    在乡村驾驶。在没有其他车辆环绕的赛道上练习比赛。与对手竞争。在单台电脑上，你可以与另一台电脑进行 VDrift，此时你可以决定对手的模型和颜色（图 5）。VDrift
    可以作为服务器运行运行，或者在任何时间，你的积分都会记录。


    如果你愿意，可以使用特殊选项让游戏变得更真实、更困难。例如，你可以通过调整滑动条到所需的百分比，来决定每个因素对你转向的影响。百分比越高，高速行驶时的难度越大。你还可以为油门、刹车和转向设置不同的按键。离合器控制也可以定义。我承认在第一场比赛中，我发现使用自动挡更容易。这是另一点——确保在倒退之前已经挂好挡。我过了几场比赛才意识到我必须挂挡。如果你用
    S 键启动，按 1 键挂挡。如果你是自动挡，换将在你行驶时自动发生。


    说到这个，游戏真的这么好吗？我亲爱的阿姨！然而，那个时刻正向我们走来。好吧，我们今晚显然面对的那个“消失”章节，我认为最好的选择是最清新的。我可以从另一位作者那里告诉你，你同意我的观点。尽管如此，我仍然拥有冠军赛车，而
    Francis 的获胜赛车将出现在你面前。但现在，Francis 将成为你更好的作者，让你可以在空闲时享受另一场比赛。记住，mes，坐在你的 Linux 系统前绘图是保持安全的唯一方法。举起杯，让我们一起迎接另一位胜利者！祝杯！


    还有比这更多的选项，我会继续发现它们，但我想提到另一组可能重要的设置。鉴于这是一个 OpenGL 游戏，并且它需要性能较低的显卡的硬件 3D 加速，可能会发现游戏有些缓慢。


