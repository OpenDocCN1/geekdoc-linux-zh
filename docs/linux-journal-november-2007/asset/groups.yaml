    ## 特性：从 Heartbeat 启动


    只有在 Heartbeat 启动后才会运行。

    你可以通过串口或以太网链路发送心跳——这两种方式都可以正常工作。例如对于物理位置上接近的两个服务器集群，使用以太网也可以的。串口端口的配置非常简单；只需指定波特率和你使用的设备即可。串口设备是一个由于每个主机上的名称不同导致每个节点上的
    .cf 文件可能有所不同的地方。如果你不知道分配了哪个串口端口，请运行以下命令：


    ![](img/48ce16a1858bf2e5a6a924045fc3a4c0_55_0.png)


    STONITH 代表“头脑中的另一个节点”（The Other Node In The Head）。STONITH 设备通常是某种网络电源控制设备。查看支持的
    STONITH 设备类型的完整列表，并使用它查看如何配置它们。


    接下来，在 `ha.cf` 文件中，你需要列出你的节点。在每行上编辑每一个节点，例如：


    ```

    setserial -g /dev/tty5

    ```


    如果输出显示 "UART unknown"，则该设备不是真正的串口。如果你有串口端口，请通过实验找出哪一个是正确的。

    如果你决定使用以太网，你有几种配置方式的选择。对于双服务器集群，使用 ucast（单播）或 blast（广播）都是可行的。

    ucast 的格式为：


    ```

    node demos

    node phobos

    ```


    你必须使名称与 `uname -n` 的输出匹配。

    我的示例 `ha.cf` 文件中的最后条目是开启日志：


    ```

    use_log yes

    ```


    ```

    ucast <device> <peer-ip-address>

    ```


    ```

    ucast eth1 192.168.1.3

    ```


    如果我使用交叉线连接两个节点，我只需广播相应接口的心跳即可。这里有一个示例行：


    ## haresources 文件


    配置文件是 `haresources` 文件。在配置之前，你需要进行一些清理工作。也就是说，必须从所有级别的系统初始化（init）中移除所有你想让 Heartbeat
    运行的内容。

    在 Debian 风格的系统中，命令是：


    ```

    bcast eth3

    ```


    还有一种更复杂的方法称为组播（multicast）。该方法使用组播发送心跳消息。详情请查看文档。

    现在我们已经解决了 Heartbeat 的传输问题，可以定义自动故障转移（auto-fail）。你可以将 auto-fail 设置为 1 或关闭。如果设置为
    1 且主节点故障，备用节点将“回退”为主和备用节点；当主节点恢复时，它将成为备用节点。

    选择哪一个是随机的。如果你把服务器视为主，那么当节点故障时，备用节点变成主节点，而当主节点恢复时，备用节点变成主。备用节点没有主节点强大，就像你汽车上的备胎不是“真正的”轮胎一样，我喜欢主节点在返回后立即变回主。

    此外，当 Heartbeat 认为一个节点死亡时，这仅仅是一种猜测。在某些情况下，“死掉”的服务器仍然运行，这对其他节点成员会产生灾难性的后果。有时，确定一个节点是否死的唯一方法就是杀死它。这就是
    STONITH 发挥用场的地方。


    ```

    /usr/sbin/resource-agent -f <resource_name> <resource>

    ```


    ```

    <resource> <resource>

    ```


    节点名称是你希望在集群启动时使用的名称，如果你开启了 auto-fail，那么这台服务器将始终是主。它必须与 `ha.cf` 文件中的其中一个节点匹配。

    资源位于每个 `ha.directory/` 或 `/etc/init.d/` 中，如果你想创建自己的资源，它们应该遵循所示的 SL 风格脚本。文件夹中的某些脚本可以包含参数，你可以通过资源行传递参数。例如，脚本设置集群
    IP 地址，你可以这样指定：


    IPAddr::192.168.1.1


    在示例中，IPAddr 资源被指示设置集群 IP 地址 192.168.1.24，子网掩码为 24 位（255.255.255.0），并将其绑定到 eth0。你也可以传递其他选项；查看用于
    Heartbeat 的 `haresources` 示例获取更多信息。

    另一个常用资源是 Filesystem（文件系统）。该资源用于共享文件系统。这里有一个示例：


    ```

    Filesystem://dev/ether0/1:/opt/data

    ```


    上述 Filesystem 资源的参数从左到右依次为：设备（ATA-over-Ethernet）、挂载点（opt/data）和文件系统类型。对于 `/etc/init.d/`
    中的普通脚本，只要它们是通过该步骤启动和停止的，它们很有可能工作。列表 4 和 5 是列表 2 和 3 中定义的集群的 `haresources`，包含一组文件。列表
    2 和 4 中定义的集群非常简单，有两个资源——集群 IP 和 Web 服务器。其中一个服务器用于我的个人家庭。控制是手动的，内容通过每小时一次的 rsync
    任务保持同步。我对这两者都不太信任，但有了 Heartbeat，我从未遇到过超过半秒的停机——对于老猫来说不是。

    列表 3 和 5 中定义的集群稍微复杂一点。由 Nfs 集群管理。这些集群使用 RAID 15 阵列（来自 Coraid）形式的共享存储和一个 STONITH
    设备。STONITH 是为了在将共享存储转移到另一个节点之前确保资源确实已死亡。在这个集群中有五个资源，备用节点接管 IP 地址，挂载共享存储并启动。如果主集群出现问题，通常会持续几分钟到一小时——我们可以接受这一点。


    ## 故障排除


    现在你的集群配置完成后，使用以下命令启动：


    ```

    /etc/init.d/heartbeat start

    ```


    情况可能会完美运行，也完全不运行。坦率地说，开启日志后，heartbeat 会输出消息。heartbeat 会告诉你某条消息是否如你所想的那样在运行。在构建新集群时，我通常通过
    SSH 进入每个集群并跟踪文件：


    ```

    tail -f /var/messages

    ```


    在单独的情况下，我启动 Heartbeat。如果出现问题，有了良好的文档就非常容易。当我遇到问题时，文档非常有价值。在我的系统中，它位于 `/usr/share`
    目录下


    ## 结论


    我简要搜索了 Heartbeat 的功能。这是一份帮助你学习 Heartbeat 更高级功能的资源列表。这些包括 N 个节点的活动/被和活动/活动集群、DRBD，当你准备好时，希望不会像我开始学习
    Heartbeat 时那样感到恐惧。如果你足够仔细，你就会像我一样喜欢集群。


    Daniel Earhart 从 20 世纪 80 年代就开始使用计算机，那时他第一次使用 Apple II。在 Windows 上使用了多年后，他在 1996
    年发现了 Linux，并从那时起一直使用发行版。他与妻子孩子住在北卡罗来纳州。


