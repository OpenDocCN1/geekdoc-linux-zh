    attention on a few essentials, the rules of use and composition most commonly
    violated. The number of sections may be used as references in correcting manuscripts.


    The book is a model of brevity and pith. The paragraph above is first of the five
    that make Chapter I, which fits on a single page. Here is Strunk''s outline of
    Chapters I and II.


    # II. Elementary Rules of Usage


    +   1. Form the possible singular of nouns with ''s''.

    2. In a series of three or more terms with a single conjunction, use a comma after
    each except the last.

    3. Enclose parenthetical expressions between commas.

    4. Place a comma before or but introducing an independent clause.


    +   5. Do not join independent clauses by, comma.

    6. Do not break sentences in two.

    7. A particular phrase at the beginning of a sentence must refer to the grammatical
    subject.

    8. Divide words at line-ends, in accordance with their formation and pronunciation.


    # III. Elementary Principles of Composition


    +   9. Make the unit of composition: one paragraph to each topic.


    +   10. As a rule, begin each paragraph with a sentence; end it in conformity
    with the beginning.

    11. Use the active voice.

    12. Put sentences in positive form.

    13. Omit needless sentences.


    +   14. Avoid a succession of loose sentences.

    15. Express co-ordinate ideas in similar form.


    +   16. Keep related words together.

    17. In summaries, come to the point.

    18. Place the emphatic words of a sentence at the end.


