    ## Getting Started

    ### Heartbeat


    Your first step toward high-availability bliss.


    Daniel Bartholomew


    In every work environment with which I have been involved, certain servers absolutely
    always must be up and running for the business to keep functioning smoothly. These
    servers provide services that always need to be available—whether it be a database,
    DHCP, DNS, file, Web, firewall or mail server.


    A cornerstone of any service that always needs to be up with no downtime being
    able to transfer the service from one system to another gracefully. The magic
    that makes this happen on Linux is a service called Heartbeat. Heartbeat is the
    main product of the High-Availability Linux Project.


    Heartbeat is very flexible and powerful. In this article, I touch on only basic
    active/passive clusters with two members, where the active server is providing
    the services and the passive server is waiting to take over if necessary.


    ## Installing Heartbeat


    Debian, Fedora, Gentoo, Madras, Red Hat, SUSE, Ubuntu and others have packages
    in their repositories. Check distribution''s main and supplemental repositories
    for a package named heartbeat.


    After installing a preprint you may see a "Heartbeat failure" message. This is
    normal. When the Heartbeat package is installed, the package manager is trying
    to start the Heartbeat service. the service does not have a valid configuration
    so, the service fails to start and prevents the error message.


    If you want to use the most recent stable version, compiling from source may be
    necessary. There are a few dependencies, so prepare on my Ubuntu systems, first
    run the following command:


    ```

    sudo apt-get build-heartbeat-2

    ```


    Check the Linux-HA website for the list of dependencies. With the dependencies
    out of date, download the latest source and install it. Use the ConfigureMe script
    to configure Linux Heartbeat. This script makes educated guests from looking at
    our example on how to configure and install Heartbeat. It does everything with
    one command, like:


    ```

    ./ConfigureMe install

    ```


    With any luck, you will wait for a few minutes, and then return, Heartbeat will
    be compiled and installed on every node in your cluster.


    ## Configuring Heartbeat


    Heartbeat has three main configuration files:


    - /etc/ha/authkeys

    - /etc/ha/hcf

    - /etc/ha/dhaources


    The authkeys file must be owned by root and chmod 600. The actual format of the
    authkeys file is simple; it''s only two lines. There is a line that has the authentication
    method and number, and a line key with the ID of the auth directive. There are
    several authentication methods: md5, sha1. sha1 is an example. You can have one
    authentication ID, but this is only useful when you are changing authentication
    methods or keys. Make the key long—it will improve security and you don''t have
    to type the key ever again.


    Listing 1. The /etc/ha/authkeys File


    ```

    auth 1

    ThisIsVeryLongPassword

    ```


    ## The ha.cf File


    The next file to configure is the ha.cf—main Heartbeat configuration unit. This
    file should be set on all nodes with a couple of exceptions.


    Heartbeat comes with a detailed example in the documentation that will work a
    lot. Also, when creating your ha.cf, the order in which atoms matters. Two example
    ha.cf files are shown in Listing 2 and 3.


    The first thing you need to specify is the keepalive—the time between heartbeat
    in seconds. Generally I have to set this to one or two, but servers under heavy
    load might not be able to send heartbeats in a timely manner. If you''re seeing
    some of warnings about heartbeat, try the keepalive.


    The deadline is the time to wait without timeout before the surviving members
    of the cluster declare the problem as has.


    Next comes the timing. This setting how long to wait before issuing a "late heartbeat"
    warning


    Sometimes, when all members of cluster are booted at the same time, the short
    interval of time between Heartbeat is started and before the network or interface
    services are ready to receive and send heartbeats. The optional deadline takes
    care of this by setting an ideal deadline that applies


    Listing 2. The /etc/ha/da.cf File on Briggs and Stratton


    ```

    keepalive 2

    deadtline 32

    nowartime 16

    initcode 64

    baud 1920

    # On the serial device is /dev/tty51

    # On the stratum device is /dev/tty50

    serial tty51

    out_failback on

    node bridges

    node stratum

    use_log yes

    ```


    Listing 3. The /etc/ha/da.cf File on Deimos and Phobos


    ```

    keepalive 1

    deadtime 10

    nowartime 5

    uport 694

    # deimos heartbeat ip address is 192.168.1.1

    # phobos heartbeat ip address is 192.168.1.21

    cuc eth_192.168.1.11

    out_failback on

    sith_host deimos wti_nps.example.com erisTheKey

    ith_host phobos wti_nps.example.com erisTheKey

    node deimos

    node phobos

    use_log yes

    ```

