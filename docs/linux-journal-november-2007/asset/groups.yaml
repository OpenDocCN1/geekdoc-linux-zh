    \  return (pos);\n}\n```\n\nI am using conservative values here. Although it would\
    \ be much higher for Gigabit speeds. The values are determined by the demand buffer.\
    \ I have no better way to explain this, so I would say it could give you a bit\
    \ of performance boost. It is worth mentioning, because the TCP window size can\
    \ allow you to get optimal throughput.\n\nOther options can be set using the pseudo-filesystem\
    \ in Linux (including the above two), or when your Linux distributions set them\
    \ automatically, you won't have to tweak them.\n\nIt is also a good idea to use\
    \ PMTU (Path Maximum Unit Discovery) to avoid IP fragmentation. If fragmentation\
    \ can affect just performance, but it's more important to improve performance\
    \ by avoiding fragmentation at any cost, however HTTP servers use conservative\
    \ packet size. Doing so is not a very good way to work.\n\nInstead of using write(2)\
    \ or sendfile(2), could use the sendfile(2) system. This provides substantial\
    \ advantages in avoiding redundant copies, as bits are passed between the file\
    \ descriptor and socket descriptor directly. Be aware that this approach is not\
    \ possible across Unix.\n\n## Advanced Techniques in Design\n\nApplications should\
