    当前日期和时间被记录为自已经过的秒数。这个数字存储在符号长型中，这意味着在 32 位系统上，计数将一直持续到 UTC 2038 年 1 月 19 日 03:14:08，此时值将溢出变为负数。如果日期超过此类限制，将返回错误：


