    \ Linux Journal, PO Box 98308, Houston, TX 77208-98308 提供您的姓名和地址与我们联系。\n\n# Tim\
    \ Copeland\n\n# 实用型 Linux\n\n我热切地等待本期 LI [2007年9月] 来评测 Linux 盒子计划。你的计划很快就会实施，并从中获得一些想法。\n\
    \n# Kurt\n\n数字订阅：Linux Journal 的数字订阅现已提供，并通过电子邮件递送。请访问 www.linuxjournal.com 了解更多信息，或获取我们任何所有相关服务的联系方式。\n\
    \n我不公平地为被排除的事感到羞愧。我想要看到的是一个实用的 Linux 盒子。但你的“sedimenture”并没有比 ULB 更满足我的需求。你们的是免费的，不是吗？例如，看看显示图。它是最新、最强大的\
    \ DirectX 10！这怎么能是一个好的 Linux 盒子呢？\n\n编辑来信：我们欢迎您的来信，并鼓励您发送至 editor@linuxjournal.com\
    \ 或通过邮寄至 Linux Journal, 7572 Market Street, 200, Seattle, WA 98101-9837。为了版幅和清晰起见，信可能会经过编辑。\n\
    \n我正在寻找的东西可能不是别人在寻找的，但我认为有些人是值得在某类文章中展示这个计划的，正如\n\n对于示例代码和缺乏错误处理，我有一点小瑕疵要提。很难添加任何错误结尾。在\
    \ 2007 年 9 月份的信件中，Jack 指出不存在错误处理。Bash 脚本没有任何任何错误结尾。对于中级 Linux 用户，Jack 指出：\n\n\
    ```bash\nmkdir -p dimension\nif [ $? -ne 0 ]; then\n  echo \"could not create\
    \ $dimension\"\n  return\nfi\n```\n\n`-p` 将创建 $dimension 字符串中的所有目录，如果任何目录已存在，则不会冲突。这将为你未来的系统成为真正的特性。这是通过错误并向情况返回值来解释的。\n\
