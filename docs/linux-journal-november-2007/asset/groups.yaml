    人是出人意料且不可预测的。在计算机行业，你在每次与某个流行软件包的设计者面试时都能感受到这一点。例如，Perl 最初是为网络编程和文本处理设计的，这使其成为
    Web 编程的显而易的选择，但 Larry Wall 并不知道或预期他在 Web 发明之前就已经写了它。


    软件包的用户几乎总是会推向它的极限。这就是为什么一些最成功、流行的程序是那些鼓励你超越想象的程序。在软件行业的早期，这意味着获取功能的唯一方法就是向作者游说，然后希望下一个版本能包含所需的功能。在开源世界中，理论上任何人都可以添加功能，但由于功能的开发者人数较少且会引发激烈的辩论，添加一个新功能可能需要意想不到的长长时间。（而且分叉项目总是可能的；但这具有社会和技术上的收益）。


    有些程序有着创建插件的悠久传统。GNU 被认为是一个文本编辑器，但它附带了一个完整的编程语言版本。你可以在 Emacs 中创建任何你想要的东西，人们也确实做到了，比如电子阅读器、网页浏览器和极其复杂的计算器。Photoshop
    以其惊人的图形设计功能而闻名，但由于为平台开发的插件（以及因此）数量较少。


    Microsoft Office 虽然由 Linux 和开源支持者制作，但它因其内置功能而流行。当然，如果没有我添加到软件中的那半插件，Firefox 的用处将只有现在的一半。


    所以，用户将软件推向极限，而软件发行者能够让扩展程序变得可能，使其变得更有用。这如何转化为基于 Web 的软件时代？这对我们开发者又意味着什么？


    答案是日益无处不在的编程接口，或 API。如果你希望你的网站作为一个平台被认真对待，你就需要一个允许用户修改和扩展你应用的 API。API 正在成为基于 Web
    的应用程序中日益标准的一部分，尽管每个人都在使用这个词，但这个缩写词对每个人来说有许多不同的含义。


    从下个月开始，我将开始查看 Facebook 等机构提供的最新一批 API。但你不想后退一步，考虑软件提供的不同类型的 API 吗？如果你打算扩展它们、使用并与它们协作，那么
    Web 开发日益成为将其他网站连接起来的问题，而理解这些 API 可以解决这一问题。


    # 只读协议


    起初，Tim Berners-Lee 发明了 Web，他将其设计为一个只读媒介。但在大多数人在第一个十年里使用 Web 时，它是一个只读媒介。你可以用浏览器查看网站，但不能对其进行操作。网站没有
    API；如果你想通过程序更改内容——例如，为所有 Web 内容创建一个搜索索引——你就需要创建自己的“插件”，或使用 API 来让 HTML 理解这一点。


    这种情况在 20 世纪 90 年发生了变化，当时协议的开发变得突出，包括 Dave Weiner 创建了 RSS，RSS 标准代表简单或 RDF 数据格式。创建一个机器可读、频繁更新的站点检查摘要是很容易的。通过使用
    RSS，你可以在不进行任何更新的情况下获取更新。更重要的是，RSS 馈是以标准方式格式化的，带有标准标签，使得程序很容易解析并提取它们学到的信息。


    RSS 变成了同步的通用术语，也变成了几种不切实际（但相似）的格式的名称。另一组开发者创建了 Atom 协议，许多人认为它将取代所有的 RSS 格式。


    RSS 和 Atom 在今天仍然流行。这些分发馈最常见的用途是博客和新闻更新，允许用户跟踪哪些网站更新了内容。RSS 和 Atom 也可以用于其他方式，提供来自站点的各种类型数据的简单、可靠且机器可读的版本。如果你正在广播定期更新，那么
    RSS 和 Atom 可能是一个很好的起点。


    例如，著名的开发公司 Signals 为其 Highrise 联系人管理系统提供了近期活动的 Atom 馈。这对于你或你的团队聚合多个源源的信息非常有帮助。


    '
