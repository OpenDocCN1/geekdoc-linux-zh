    # Step-by-Step Implementation of a RHEL Cluster


    Implementation of RHEL clusters starts with the selection of proper hardware and
    connectivity. In many implementations (without IP load balancing), storage is
    used with one, or more than two, servers sharing the operating system and RHEL
    cluster.


    A properly designed cluster, whether you are building a RHEL-based cluster or
    an IBM HAC-based cluster, ensures no single point of failure. Keeping this in
    mind, you have to remove any single point of failure from your cluster design.
    For this purpose, you may need to go with redundant power supplies.


    Restart both cluster nodes after installing vendor-related hardware drivers and
    the RHEL cluster suite.


    # Network Configuration


    For network configuration, the best way is to use the network configuration GUI.
    However, if you use Ethernet bonding, the cluster configuration settings are simple.


    Ethernet bonding allows for a fault-tolerant network by connecting two Ethernet
    interfaces to one virtual device. The resulting-channel-bonding ensures that if
    one device fails, the other device will become active. Additionally, these Ethernet
    devices go to separate Ethernet switches or hubs, so that the single point of
    failure is eliminated, at the Ethernet hub level.


    # Software Installation


    Building a cluster cluster starts with the installation of RHEL on two cluster
    nodes. My setup has two HP Proant servers (DL740) with Smart Array (HP MSA 10000).
    I started with a RHEL 4 installation on both nodes. I updated to the latest available
    update version and system. I installed v4 update which was the latest version
    of RHEL when I was building the cluster.


    You need a valid software subscription for Red Hat, so you can log in to the Red
    Hat portal to download the latest ISO. You can then burn it to CDs or use USB.
    During the RHEL installation, you will configure various configuration settings,
    the most important ones are the date and time-zone configuration, network settings,
    and disk level selection.


    Another important option is network settings. Configuration of these settings
    can be left for a later stage, especially with-Ethernet (or Ethernet bonding)
    in a high-availability solution.


    To configure two network devices for bonding, perform the following on one:


    +   1) Creating devices in /etc/modules.conf. For example, to load the following
    module:


    ```

    alias bond0

    options bonding mode=10

    ```


    Doing this loads the driver with the bond0 interface name and passes options to
    the driver to configure it as an active-backup mapper for the network interfaces.


    +   2) Edit the /etc/sysconfig/network-scripts/ifcfg-eth0 configuration for file
    eth0 and the /etc/sysconfig/network-scripts/ifcfg-eth1 configuration for file
    eth1, which shows several identical details, as shown below:


    ```

    DEVICE=eth0

    USERCTL=none

    ONBOOT=yes

    MACADDR=

    SLAVE=yes

    BOOTPROTO=none

    ```


    This enables ethX with the X replaced by the name


    To install additional drivers after you have installed the OS. In my case, I installed
    the RHEL support package for the DL740 (HP Proiant server), which is available
    at h18000.www.hp.com/products/linux/dl740-drivers-cert.html.


    Then try installing the cluster software suite. This package, is available from
    the RHEL, and you definitely have to select the latest cluster package. I selected
    rhel-cluster-2.4.0 for my system, which was the latest cluster available at the
    time.


