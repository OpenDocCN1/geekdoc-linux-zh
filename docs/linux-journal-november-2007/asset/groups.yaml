  - "[PAGE 19]\n\n# TECH TIPS\n\nDisplay date and time in the past and future pop\
    \ directories easily.\n\n# >> Show Date or Time, Past or Future\n\nWhen working\
    \ on Linux/Unix platforms, I frequently find it useful to obtain the date and\
    \ time in the past or future. Whether scheduling jobs, searching for files with\
    \ a certain date or demining the day on which a certain date falls, countless\
    \ scenarios routine to compare the date and time in the past or future. For a\
    \ suitable program, but ultimately had to write one myself. This program is called\
    \ showed. It is written in C and can be ported over Linux as well. You can download\
    \ it from the FTT site: ftp.linuxjournal.com/publ/listings/issue_163/9877.tgz.\n\
    \nAfter obtaining the source code, assemble the showed using an C compiler (or\
    \ gcc) as shown:\n\n```\n# cc showed -c o showed\n```\n\nStore the executable\
    \ in /usr/local/bin or a directory of your choice, and invoke it without any arguments\
    \ to use:\n\n+   - -f: Display the date and time according to formatting directives\
    \ in format.\n\nOptions e and f are incompatible. Specifying them on the command\
    \ line terminates the abnormality. The default output of showed can be tweaked\
    \ with the formatting directives and arguments to -f, which are identical to the\
    \ ones used by the standard date command. The important thing is that all formatting\
    \ is performed by either a positive (future) or negative (past) offset from the\
    \ current date and time (now), which is its datum.\n\nA good way to become familiar\
    \ with any tool is to understand how it works. For example, to display the date\
    \ and time ten years ago, relative to now, what would be (out of showed) depends\
    \ on the value of now:\n\n```\n# showed\nuusage:\n- -y [+]years\n- -m [+]months\n\
    - -d [+]days\n -h [+]hours\n- -M [+]minutes\n- -s [+]seconds\n- -e [format]\n\
    ```\n\n```\n# showed -y -10\n```\n\nTo find the epoch seconds for the above scenario,\
    \ use:\n\n```\n# showed -y -10 -e\n```\n\nA futuristic date of five years, 23\
    \ days from now in the YYYY-MM-DD format would be output showed. The plus sign\
    \ is optional for future dates and the two formats of the command line below are\
    \ equivalent (the minus sign is mandatory for past dates):\n\n```\n# showed -y\
    \ +5 -m -2 +d -f %Y-%m-%d\n```\n\n```\n# showed -y 5 -m 2 -d 23 -f %Y-%m-%d\n\
    ```\n\nThe options can be placed in any order, as their context is unambiguous,\
    \ the command line can be written as:\n\n```\n# showed -m 2 -f %Y-%m-%d -d 23\
    \ -y 5\n```\n\nThe effects can be combined in a single command line, however,\
    \ mixing them may lead to unexpected and erroneous results. If now is January\
    \ 1st 2003 12:00:00 AM UTC, showed outputs:\n\nshowed renormalizes the command-line\
    \ options and arguments:\n\n+   - -y [+years]: Number of years in the past (-)\
    \ or future (+) offset from the current year.\n\n+   - -m [+months]: Number of\
    \ months in the past (-) or future (+) offset from the current month.\n\n+   -\
    \ -d [+days]: Number of days in the past (-) or future (+) offset from the current\
    \ day.\n\n+   - -h [+hours]: Number of hours in the past (-) or future (+) offset\
    \ from the current hour.\n\n+   - -M [+minutes]: Number of minutes in the past\
    \ (-) or future (+) offset from the current minute.\n\n+   - -s [+seconds]: Number\
    \ of seconds in the past (-) or future (+) offset from the current second.\n\n\
    +   - -e: The time elapsed in seconds since the UNIX epoch (January 1, 1970).\n\
    \nThe above command displays the date and time in the past—eight months and 32\
    \ minutes from now, while the one below displays the date and time in the future—8\
    \ months from now but 32 minutes ago:\n\n```\n# showed -m 8 -M 32\nWed 1 00:32:00\
    \ 2002\n```\n\n```\n# showed -m 8 -m 32\nSun Aug 31 23:28:00 2003\n```\n\n18 |\
    \ november 2007 www.linuxjournal.com"
