    original commands is putting the period outside our quotation marks, unless it
    is part of the quotation. With a Linux copy-editing policy published by Hewlett
    Jones in 1994, in compliance with what we first argued us was over this very practice.


    If you look for The Elements of Style at Amazon, you will find three editions:
    The 1999 fourth edition, Strunk''s original and The Elements of Style illustrated
    with Linux (which is the fourth) plus illustrations by Maira Kalelson. It has
    been helping the readers about ''distributions'' of Strunk''s kernel, each in
    its own way.


    It is interesting to read and compare the discussion and history pages beside
    the Wikipedia entry for The Elements of Style. The former refers to Linux Kernel
    Mailing List (LKML), while the latter is a set of code repository. These analogies
    are far from perfect, but they are a common approach.


    What brought me to me this freshness of appeals was a blog post by Alan Michelfeldt
    "Beyond the boundaries of paragraph" rightsideublog.com/my_weblog/2007/08/beyond-the-person.html.
    He writes:


    Our modern society is equipped around a paradigm decision, where the driving force
    in commerce is companies and attempts to persuade individuals—so called consumers—to
    buy their products or services (and not of theirs).


    We are, however, going our way towards a personal decision-making paradigm, whose
    centre of gravity is helping individuals make and implement better decisions at
    lower cost (where "cost" includes time and hassle, as well as money cost). This
    is made possible by an information age: our increasing ability to search for gather,
    store, filter, edit, slice and dice, share the information we need for our decision-making.


    Better personal decision-making (implementation) is an era-defining shift for
    those who simply shifts the focus of value creation from companies and to individuals.
    There is in this chance for independence of individuals, in need of edu help us
    with better ways to learn, make choices and exercise autonomy. What''s not clear,
    and needs to be played, by roles programming the freedom paradigm and a value
    system in which the matters that most are buyers rely on.


    Free and open source code does not only provide the freedom of its authors, but
    also provides ways to free those who use and depend on code. I share observation
    with the intent that it will prove useful. If it''s not, we''ll discard it or
    rewrite it. If it is, any of us are still free to improve it.


    Dec Sears is Senior Editor of Linux Journal. He is also a Visiting Scholar at
