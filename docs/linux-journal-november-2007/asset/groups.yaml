    # Lantronix''s SecureLinx Branch Office Manager


    Move over Swiss Army knife, Lantronix has released its new SecureLinx Branch (SLB)
    Office Manager appliance that integrates a console server management and an ethernet
    switch into 1U rack-mountable device. With SLB, system administrators can manage
    a diverse range of servers and IT infrastructure in branchremote offices from
    anywhere the Internet. SLB allows enterprises to avoid the cost of dedicated technicians
    and expensive overhead at each satellite facility.


    www.lantronix.com


    # Black Duck Software''s protexIP


    Software development with open-source code is great, but it can be complicated.
    This is why Black Duck Software created protexDevelopment (now v4), a platform
    that helps manage how their software assets are created, managed and licensed.
    protex helps developers and legal counsel in managing the use of code from open-source
    projects which have licensed under GPL or any those that have not. An index is
    included in KnowledgeBase, a library of open-source and vendor-added code components
    with licensing information for more than 140,000 components.


    www.blackducksoftware.com


    ![](img/48ce16a1858bf2e5a6a924045fc3a4c0_44_1.png)


    # Sendio''s I.C.E Box E-Mail Integrity Service Appliance


    We''ve been tracking the buzzing Sendio''s I.C.E Box, an e-mail appliance that
    reputedly blocks 100% of spam with no false positives. The I.C.E. Box has been
    shipping for several months, its credentials recovery card to our attention. Shunning
    the intent filter approach, the I.C.E Box provides a one-time verification that
    the sender of the message is someone with whom you wish to communicate while maintaining
    legitimate communications. The appliance integrates seamlessly with any e-mail
    server and LDAP environment. A built-in Kaspersky antivirus engine is also


    www.sendio.com




