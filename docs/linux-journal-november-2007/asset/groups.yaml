    # Red Hat Enterprise Linux Cluster Suite


    Building a highly available solution using RHEL

    BY KHURRAM SHIRAZ


    When mission-critical applications fail, so does your business. This is a true
    statement in today''s environments, where most organizations spend millions of
    dollars making their services available 24/7, 365 days a year.


    In view of this growing demand, almost every IT vendor is proudly offering solutions
    for such problems. Most commercial high-availability solutions include IBM''s
    HACMP, Veritas Cluster Server and HP''s Serveguard.


    If you''re looking for a commercial high-availability solution on Red Hat Enterprise
    Linux, the best choice is the Red Hat Cluster


    In 2002, Red Hat introduced the first member of its Red Hat Enterprise family
    of products, Red Hat Enterprise (originally called Red Hat Linux Advanced). Since
    then, the family of products has grown steadily, and now includes Red Hat Enterprise
    Linux ES (for entry- and mid-range servers) and Red Hat Enterprise Linux WS (for
    desktops/workstations). These products are designed specifically for use in enterprise
    environments to deliver superior application support, performance, availability
    and scalability.


    The original release of Red Hat Enterprise AS version 2.1 included a high-availability
    clustering feature as part of the base product. This feature was not included
    in the smaller Red Hat Enterprise Linux WS. With the growth of the Linux family,
    it became clear that high-availability clustering was a feature that should be
    made for both AS and ES server products. Consequently, with the release of Red
    Hat Enterprise Linux 3 in October 2003, the high-availability clustering feature
    was packaged as an advanced product called the Red Hat Cluster Suite, and it was
    featured for use on both the Enterprise Linux AS and Red Hat Enterprise Linux
    products.


    The RHEL cluster is a separately licensed product and can be purchased from Red
    Hat on top of Red Hat''s base ES Linux.


    46 | november 2007 www.linuxjournal.com


    # Red Hat Cluster Suite Overview


    The Red Hat Cluster Suite has two major features. The Cluster Manager provides
    high availability, and the other feature is IP load balancing (originally Piranha).
    The Cluster Manager and IP load balancing are complementary technologies that
    can be used individually or in combination, depending on application requirements.
    Both of these technologies are integrated in Red Hat''s Cluster. In this article,
    I focus on the Cluster Manager. Table 1 shows the main components of Cluster Manager.


