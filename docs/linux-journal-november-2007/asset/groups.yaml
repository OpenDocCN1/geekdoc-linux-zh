    authorization list, LDAP is to retrieve user authorization information from AD.
    The idea is to retrieve requests processed by Name Switch (NSS); NSS handles the
    replacement of UNIX/Linux configuration files (such as /etc/passwd, /etc/group
    and /etc/hosts) with centralized databases, and may cache them. NSS then uses
    the Name Caching Daemon (NSCD) to improve query performance. NSD is a daemon that
    provides a cache for the most common name requests. This can be very important
    when used against a LDAP user directory. Finally, NSS can connect to Active Directory
    to retrieve the authorization data under users. LDAP, handled by padi, a set of
    C libraries that allow LDAP directory to be used as a primary source of allies,
    ethers, groups, hosts, networks, and more. With authorization and authentication
    completely integrated with AD both LDAP and Kerberos, no user credentials need
    to be maintained


