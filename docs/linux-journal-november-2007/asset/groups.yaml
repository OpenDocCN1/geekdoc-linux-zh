    \nWe are growing a world of Linux Professionals.\n\n## High-Performance Network\
    \ Programming in C\n\nTCP/IP network programming in C on Linux is good. All the\
    \ advanced features of the stack are at your disposal, and you can do lot of interesting\
    \ things in user space without getting into kernel. The analogy to this is the\
    \ rich set of tools that Linux provides to measure throughput and performance.\
    \ Based on this you can tweak certain parameters or re-engineer your solutions\
    \ to achieve expected results. In this article, I focus on generic mechanisms\
    \ that are guaranteed to provide a noticeable improvement. Based on this, you\
    \ will be able to make the final touch with the right tools. \n\n### What is Bandwidth?\n\
    \nOnce we answer that question, \"How can we get the best out of our bandwidth?\"\
    \ defined by Wikipedia, is the difference between higher and lower cutoff of communication.\
    \ Is that all? According to Shannon, practically achievable is determined by the\
    \ level of noise in the channel, the data encoding used in such a way that the\
    \ protocol overhead is minimal and most of the bits are used to carry useful data.\
    \ TCP is the bottleneck in packet-switched environment. We have to contend with\
    \ other nodes on the network. There is no concept depicted in the environment\
    \ where your product is most likely to reside. This is something we can control\
    \ with a bit of.\n\n### Non-Blocking TCP\n\nHere's one way to maximize throughput:\
    \ non-blocking reads and writes is very easy, but if you are interested in using\
    \ blocking sockets, Listing shows a code fragment using fcnt(2) instead of setsopt(2)\
    \ for setting the socket descriptor to non-blocking mode. poll(2) or select(2)\
    \ to figure out when the socket is ready to read or write. select(2) cannot figure\
    \ out when the socket is ready to watch. How does non-blocking I/O provide better\
    \ throughput? The OS schedules the process either in the case of blocking and\
    \ non-blocking I/O. When you block, the process \"sleeps\".\n\n### Gather I/O\n\
