    \ multicore architectures without constantly hurting your program.\n\n**LI: so\
    \ is true RapidMind is actually a library of common/C++ operations, where the\
    \ exploration of multicore is transparent to the programmer?**\n\n**Cool:** RapidMind\
    \ is more than a simple library of \"called functions\". In fact, it is possible\
    \ to use the API to RapidMind to perform any arbitrary computation, and that execute\
    \ in parallel with a very high level of performance. We provide a sophisticated\
    \ multicore software platform that can leverage ways of parallelism, but we allow\
    \ the same developers to express their own computations in a familiar, single-threaded\
    \ way.\n\n**LI: How much, if anything, does the programmer need to know about\
    \ parallel processing techniques in order to use RapidMind?**\n\n**Cool:** We\
    \ believe that developers are the application experts and should have some involvement\
    \ in moving their applications into the world they already know. The key is to\
    \ let developers develop from an unfamiliar and frustrating path. RapidMind is\
    \ built upon already familiar arrays and functions. It is not necessary for a\
    \ developer to work with threads, vertices or synchronization. Fundamentally,\
    \ a developer can apply functions to arrays, and this automatically parallels\
    \ execution. A RapidMind-enabled program is a single-threaded sequence of parallel\
    \ operations and is much easier to understand, than the multithreaded model of\
    \ parallel programming.\n\n**LI: Can you give us a simple example (the includes\
    \ and declarations statements that would start a typical program?)**\n\n**Cool:**\
    \ If you include the header file and optionally activate the RapidMind namespace:\n\
    \nNext, you can declare variables using RapidMind types and arrays:\n\n```\nValuef\
    \ f= Array<2,ValueType3> a: b;\n```\n\nThe ValueType is equivalent to a float,\
    \ and the arrays you declare anywhere would need to manage large sets of data.\
    \ This can be declared anywhere would need to manage C++ variables: as members\
    \ of classes or as global arrays.\n\nA Program is the RapidMind representation\
    \ of a function and is executed by a sequence of operations placed between RM_BEGIN\
    \ and RM_END. The operations will be stored in the Program object. For example,\
    \ suppose we want to add a value f using a global variable, to every element of\
    \ an array. We would create a program object using these:\n\n```\nProgram prog\
    \ = RM_BEGIN(\nIn-ValueType3 c: Out-Value3 d:\n  c += f;\n) RM_END;\n```\n\nNote\
    \ that although the program may run on a multi-core, we can just refer to external\
    \ values in the same way we would from a function definition. It is not necessary\
    \ to write any other code to use the communication between the host processor\
    \ and any co-processors.\n\nTo apply this operation to an array a and put the\
    \ result in array b, invoking a parallel computation, we just use the program\
    \ object like a function:\n\n```\nb = prog(a);\n```\n\nOf course, in real applications,\
    \ program objects can contain a large number of operations, and a sequence of\
    \ collective operations on arrays (such as scatter, gather and reduce) would be\
