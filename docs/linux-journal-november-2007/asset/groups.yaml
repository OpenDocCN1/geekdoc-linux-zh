    # Thinking about APIs


    The historical evolution of Web sites into applications.


    REUVEN M. LERNER


    People are surprising and unpredictable. In the computer industry, here you have
    in every interview with the designer of a popular software package. For example,
    Perl was originally designed for network programming and text processing. This
    made it an obvious choice for web programming, but Larry Wall didn''t know or
    expect that he first wrote it before Web was invented.


    Users of software package almost always push its limits. That''s why some of the
    most successful and popular programs are those that encourage you to go beyond
    the imagination. In the early days of the software industry, this meant the only
    way to get your feature was to lobby the authors and then hope the next release
    would include the needed feature. With open source, anyone is theoretically able
    to add features, but features are generally smaller in number of developers and
    lengthy debates that erupt, it can take surprisingly long to add a new feature.
    (And it is always possible to fork a project; but this has social and technical
    benefits).


    Some programs have a long tradition of creating add-ons. GNU is known as a text
    editor, but it comes with a full-fledged version of the programming language.
    You can create almost anything you want in Emacs and people have done so, making
    e-readers, web browsers, and an extremely sophisticated calculator. Photoshop
    is famous for its amazing graphic design features, but because of the smaller
    number of plugins that were developed (and so) for the platform.


    Microsoft Office, which is right been made by Linux and open-source advocates,
    became popular because of its built-in features. And, of course, Firefox would
    not be half as useful if it weren''t for the half-plugins that I have added to
    software.


    So, users push software to the limits, and software publishers have been able
    to make more useful by making it possible to extend their programs. How does this
    translate into an era of Web-based software? And, what does this mean for us developers?


    The answer is the increasingly ubiquitous programming interface, or API. If you
    want your site to be taken seriously as a platform, you need to have an API that
    lets users, modify and extend your application. APIs are being increasingly standard
    part of Web-based applications, but despite everyone''s use of the term, acronym
    means many things different to people.


    Starting next month I get going to look at the latest batch of APIs such as Facebook,
    are offering. But do you want to take a step back and consider the different types
    of APIs that software offers? If you intend to extend them, and use and work with
    them, Web development is an increasingly matter of tying together from other sites,
    and understanding these APIs can retrieve it.


    # Read-Only Protocols


    In the beginning, Tim Berners-Lee invented the Web, he made it as a read-medium.
    But most people used the Web during the first decade, it was a read-only medium.
    You could view Web sites with your browser, but not work with them. There was
    no API for web sites; if you wanted to change the content programmatically—for
    example, to create a search index of all Web content—you would need to create
    your own "plugin, or use an API to teach the HTML to this.


    This changed in the 1990s, when the development of protocols became prominent,
    including Dave Weiner created RSS, RSS standards standing for either simple or
    RDF data format. It was easy to create a machine-readable, frequently updated
    summary of a site''s checks. By using RSS, you could get the updates without being
    any updates. More significant, RSS feeds were formatted in a standard way, with
    standard tags, making it easy for programs to parse and extract the information
    they learned.


    The RSS became both the generic term for synchronization and for several impractical
    (but similar) formats. A separate group of developers created the Atom protocol,
    which many people believe is up to replace all of the various RSS formats.


    RSS and Atom are still popular today. The most common use of these syndication
    feeds is for blog and news updates, allowing users to keep track of which sites
    have updated their content. RSS and Atom can be used in other ways as well, providing
    a simple, reliable and machine-readable version of various types of data from
    a site. If you are broadcasting regular updates then RSS and Atom are probably
    a good starting point.


    For example, the well-known development company Signals provides an Atom feed
    of recent activity in their Highrise contact management system. As it helps you
    or your team even more helpful to aggregate multiple people''s feeds into a single
    viewer, for example, a manager to get a sense of what (and how much) employees
    are getting each day.


    This came in different forms, all of which are used today. The first was XML-RPC,
    a simple protocol that used HTTP to send an XML-encoded invocation on a remote
    server. The server turned the XML-RPC request into a local function call and sent
    the result of the call (or an error message) in XML. The good news was (and is)
    XML-RPC is simple to understand, and that they are implemented in many languages,
    and they are generally compatible and interoperable.


    At the same time, XML-RPC was unable to handle some complex data types that people
    wanted to use. It didn''t have the official approval of or complete standard that
    would have necessary for it to enter the corporate arena. So, some of the original
    XML-RPC developers created SOAP (originally known as Simple Object Access Protocol,
    but now an acronym that doesn''t expand). SOAP is more sophisticated and complete
    than XML-RPC, but it had great many issues with compatibility, implementation
    and complexity. Today, there are SOAP implementations for many languages, and
    it continues to be used in a variety of ways, despite


