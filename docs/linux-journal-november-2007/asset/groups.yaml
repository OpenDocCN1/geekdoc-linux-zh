    \n# A Few Words on TCP\n\nTCP has been a field of intense research for decades.\
    \ It is an extremely complex protocol with heavy responsibility. We often forget\
    \ that TCP is what builds the Internet together due to how it connects networks,\
    \ but TCP ensures that routers are not overloaded and packets do not get lost.\
    \ Consequently, the impact of TCP on performance is higher than any other protocol.\
    \ It is doubt that researchers have written several papers on the topic. The field\
    \ is amazing but there is every possible layer of technology on which TCP/IP works\
    \ today. But, TCP is designed for working well through wireless networks. A high\
    \ latency link seems to question TCP's assumptions on size and round trip measurement.\
    \ It suffers from its share of defects. The congestion control algorithms, such\
    \ as slow start, congestion avoidance, fast transmit, and recovery on, When it\
    \ fails, it hits your performance. Normally, three duplicate packets are sufficient\
    \ for triggering congestion control mechanisms. What do you do, then? You drastically\
    \ decrease performance, especially if you have a high-speed network. But, all\
    \ being equal, the above techniques are the most useful methods for achieving\
    \ good performance for your applications.\n\n# Conclusion\n\nGoing for high performance\
    \ depends on heuristics and empirical data as well as proven techniques. As mentioned\
    \ previously, it is an art built by practice. However, once you get the feel for\
    \ it, it will be smooth. The moment you build a stable base for client/server\
    \ interactions, like this, building P2P frameworks on top is nothing great. Grish\
    \ is an open-source hacker deeply into Unix. In his free time, he likes to cook\
    \ vegetarian dishes and eat them out. He can be contacted at grish129@gmail.com.\n\
    \n# Resources\n\nPolipo User Manual: www.psijussieu.fr/jch-software/polipo/manual\n\
    \nTCP Tuning and Troubleshooting: www.openanal.com/pub/a/ilcmp/2005/tcp_tuning.html\n\
    \nWikipedia's Dictionary of Bandwidth: enwikipedia.org/wiki/Bandwidth\n\nAdvanced\
    \ Networking: beej.us/bgnet/output/html/multpage/advanced.html\n\nTCP and Congestion\
    \ Control Slides: www.nishida.org/so1/mgp0001.html\n\n# Multiple Associations\
    \ with Stream Control Transmission Protocol\n\nThe elegant way SCTP handles multiple\
    \ streams makes it ideal for things like chat clients. In two previous articles\
    \ (September and October 2007 issues of IETF), I looked at the basics of SCTP:\
    \ how you can use SCTP as a transport replacement for TCP and how you can use\
    \ SCTP to process multiple streams within a single association. Now I look at\
    \ how a single endpoint deals associations (connections to other endpoints). First\
    \ though, I explain how SCTP can give extra information about what is going within.\
    \ will need to examine each read to see whether it is an event or data to be processed.\
    \ This is quite straightforward. If the flags in the sctp_recvmsg() call has the\
    \ MSG_NOTIFICATION bit set, the message contains an event; otherwise it contains\
    \ data.\n\n```\nread = sctp_recvmsg(msg, ..., &flags);\nif (flags & MSG_NOTIFICATION)\n\
    \    handle_event(msg);\nelse\n    handle_data(msg, n);\n```\n\n# Events\n\nThe\
    \ SCTP stack can generate events when \"interesting\" things happen. By default,\
    \ all event generation is turned off for data. In the last article, I called sctp_recvmsg().\
    \ By default, this returns just the data. But I also wanted to find out how to\
    \ handle data events. If I had to turn on data_event, the SCTP stack would fill\
    \ the sctp_indinfo structure, which has the sctp_event field. Events are listed\
    \ in the sctp_event_structure:\n\n```\nstruct sctp_event_subscribe {\n    uint8_t\
    \ sctp_data_event;\n    uint8_t sctp_association_event;\n    uint8_t sctp_address_event;\n\
    \    uint8_t sctp_fail_event;\n    uint8_t sctp_error_event;\n    uint8_t sctp_shutdown_event;\n\
    \    uint8_t sctp_partial_delivery_event;\n    uint8_t sctp_adaptation_layer_event;\n\
    \    uint8_t sctp_authentication_event;\n};\n```\n\nEvents are used to tell the\
    \ following: if a new association started or if one terminated; a peer has changed\
    \ state, one of the interfaces becoming unavailable or a new interface becoming\
    \ active; if a remote error occurred; if remote peer shuts down; if partial delivery\
    \ has failed; and if authentication is available.\n\nIf an event enters the event\
    \ buffer, its first type must be put in the buffer that can be suitable for that\
    \ type of event. For example, how to handle such an event:\n\n```\nvoid handle_event(void\
    \ *buf) {\n    notification = buf;\nswitch(notification->sn_header.type) {\n \
    \   case SCTP_SHUTDOWN_EVENT:\n        struct sctp_shutdown_event *shut;\n   \
    \     shut = (struct sctp_shutdown_event *)buf;\n        printf(\"shutdown on\
    \ assoc id %d\\n\", shut->assoc_id);\n        shut->se_assoc_id();\n        break;\n\
    \    default:\n        printf(\"Unhandled event type %d\\n\", notification->sn_header.type);\n\
