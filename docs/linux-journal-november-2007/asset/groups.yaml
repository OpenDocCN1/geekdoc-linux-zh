    # 再次倾听你的思考！


    ## WhisperStation™

    酷炫……快速……静音！


    适用于 64 位 HPC、游戏和图形设计应用


    WhisperStation™ 最初是为汽车行业中一群对功耗敏感且要求严苛的高级工程师设计的，它集成了两个双核 AMD Opteron™ 或 Intel™
    EM64T™ 处理器、超静音风扇和电源，以及内部隔音设计，产生了一个强大但静音的计算平台。WhisperStation™ 标准配有 2 GB 高速内存、NVIDIA-GeForce
    或 Quadro PCI Express 显卡以及 20 英寸 LCD 显示。它可以根据您的精确硬件规格进行配置，支持任何 Linux 发行版。还支持 RAID。当作为
    Microway 集群的主节点使用时，WhisperStation™ 将让系统管理员非常满意！

    访问 www.microway.com 了解更多技术信息。


    体验“感知之声”。立即拨打 508-746-7341 联系我们的技术销售团队，今天就开始设计您的个性化 WhisperStation™。


    ## 选择 RapidMind


    **RapidMind 旨在快速推进多核编程的使用进展。** NICHOLAS PETRES


    编写支持多个 CPU 核心的应用程序并非易事，而且在某些情况下，如果你想获取一个现有的应用程序并将其适配到多核，情况会更加困难。似乎真正的突破可能还需要几年的时间。似乎
    RapidMind 有一个解决此问题的解决方案，该方案不需要对任何现有应用程序进行大规模重构，而且它的解决方案已经可用了。


    RapidMind 总裁兼首席执行官 Ray DePaul 和首席科学家 Michael Cool 讨论了 RapidMind 探索多核力量的方法。我们认为关注
    RapidMind 是重要的，因为随着制造商不断突破家庭开发的局限，当我们最终进入桌面市场时，一切都取决于此。如今有 3 台游戏机正在利用并行处理。我的工作负载中有一个四核处理器。我对此很满意，但当我同时运行应用程序或轻松运行运行时，我第一次真正感激这种多核带来的帮助。如果说有什么的话，在这台机器上运行的某些应用程序比我以前使用的单核
    CPU 慢，因为这款 Intel 芯片明显慢得多（2GHz 对比 3GHz）。


    那么，RapidMind 是否弥补了现有软件与计算模型之间的差距？


    **LI：您能简要描述一下 RapidMind，以及它设计用于解决的问题吗？**


    **DePaul：** RapidMind 是一个多核软件平台，允许开发人员利用处理器和加速器的力量，在工业中获得真正的竞争优势。通过 RapidMind，你可以开发应用程序，而对开发周期、成本和时间的影响降至最低。而且，我们允许您执行此操作，而无需学习新的编程语言、技能、复杂的
    IDE 和工具，即可适应任何多核架构，而不会不断损害您的程序。


    **LI：所以事实是，RapidMind 实际上是一个常用/C++ 操作的库，其中对多核的探索对程序员来说是透明的吗？**


    **Cool：** RapidMind 不仅仅是一个简单的“调用函数”库。事实上，可以使用 RapidMind 的 API 执行任何任意计算，并且这些计算会以非常高的性能并行执行。我们提供了一个复杂的get核软件平台，可以利用各种并行方式，但我们允许相同的开发者以熟悉的、单线程的方式表达他们自己的计算。


    **LI：为了使用 RapidMind，程序员需要了解多少并行处理技术知识？**


    **Cool：** 我们认为开发者是应用程序专家，应该参与将他们的应用程序迁移到他们已经熟悉的世界中。关键是让开发者从一个陌生且令人沮丧的路径中开发。RapidMind
    构建在已经熟悉的数组和函数之上。开发者没有必要处理线程、顶点或同步。从根本上说，开发者可以将函数应用到数组，这会自动并行化执行。启用 RapidMind 的程序是一个单线程的并行操作序列，比并行编程的多线程模型要理解得多。


    **LI：为了使用 RapidMind，程序员需要了解多少并行处理技术？**


    **Cool：** 我们认为开发者是应用程序专家，应该参与将他们的应用程序迁移到他们已经熟悉的世界中。关键是让开发者从一个陌生且令人沮丧的路径中开发。RapidMind
    构建在已经熟悉的数组和函数之上。开发者没有必要处理线程、顶点或同步。从根本上说，开发者可以将函数应用到数组，这会自动并行化执行。启用 RapidMind 的程序是一个单线程的并行操作序列，比并行编程的多线程模型要理解得多。


    （注：由于提供的原文中存在大量重复段落，翻译已已根据“不要重复输出原文”的原则进行了去重和逻辑整合。）


