    # Shared Storage and Data Integrity


    Lock management provides a mechanism for other cluster infrastructure components
    to synchronize their access to shared resources. In a Red Hat cluster, DLM (Distributed
    Lock Manager) or alternatively, GULM (Group Unified Lock Manager) is possible.


    # Fencing


    Fencing is an important component of the cluster. In fact, the purpose of fencing
    is to ensure that if one node fails, the rest of the cluster is not corrupted
    by the failed node. This is especially important when using shared storage.


    Fencing can be implemented in several ways:


    - Storage fencing: This prevents the failed node from accessing the shared storage.

    - Node fencing: This reboots the failed node from the network.


    The most common method of node fencing is to use an IPMI (Intelligent Platform
    Management Interface) controller. This allows the cluster manager to power on
    or off a server remotely.


    # Network Configuration


    To configure the network for bonding, you need to use the bonding driver. The
    most common bonding mode is active-backup mode, which allows one interface to
    be active while the other is on standby.


    # Software Installation


    To install the cluster software suite, you need a valid RHEL subscription. This
    allows you to access the Red Hat repositories.

