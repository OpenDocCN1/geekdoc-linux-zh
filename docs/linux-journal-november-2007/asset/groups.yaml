- md: "\n# COLUMNS\nWORK THE SHELL\n\n# Keeping Score in Yahtzee\n\nDAVE TAYLOR\n\n\
    **Last month**, I started talking about how to use simple scripting techniques\
    \ to create a computer simulation of the popular game Yahtzee as a solitaire variation;\
    \ I'm not going to write the entire game (the player would be darnified for a\
    \ script, for then), but let's spend one more column looking at the basics of\
    \ scoring before moving on to other topics.\n\nOne thing about Yahtzee as a game\
    \ is that there is really not much work for the computer to do, because the game\
    \ works fine; you can simply try to maximize your score however you do, competing\
    \ against your previous high score.\n\nThe basic idea of Yahtzee is that you roll\
    \ five dice to get the best possible set of values. Then these are scored against\
    \ a score card that offers points for combinations—ranging from one point per\
    \ dice to \"one of a kind\" (in Yahtzee manner).\n\nIf we fill the game in all\
    \ arrays with a known value, say -1, then the test for whether a box has been\
    \ filled is: A quick visit to Google for Yahtzee score card—take a look at it\
    \ before we proceed: www.google.com/images/sheets/yahtzee.jpg\n\n```php\nif (scores[$i]\
    \ != -1) {\n  echo '1: ' . $i;\n}\n```\n\nThe trick is that we also need to preify\
    \ these options. There's no point in prompting players to select their roll as\
    \ Yahtzee if they didn't get first of a kind. This is a bit of a trick, but as\
    \ a first step, I'm going to tweak the code to order the dice in the array after\
    \ each roll. It might be long to accomplish the task, but after writing a script,\
    \ I'm just get back to sort the function, then into individual slots.\n\nIn many\
    \ ways, it's free-hand with dice, so the first section of the score sheet is ones,\
    \ twos, and so on, where your score is the sum of the value on the dice. The second\
    \ section is other patterns, including three of a kind, four of a kind, straight\
    \ (four dice sequential), straight (all five are sequential), full house and more\
    \ Yahtzee rules.\n\n```php\nfunction sortDice($dice) {\n  $index=1;\n  for ($value\
    \ in $dice) {\n    $dice[$index]=$value;\n    $index++;\n  }\n  echo ($dice[5])\
    \ . ' ' . $dice[4];\n}\n```\n\nYou can get bonuses for achieving certain levels,\
    \ like a 63-point bonus for achieving at least 63 on the total, but the score\
    \ sheet is straightforward. The key to the game, then, is to figure out how to\
    \ score. If you roll once, do you want to score your far as four of a kind or\
    \ yours? If both are filled already! You're going to defer to the player, but\
    \ still leaves us with the question of how to model the bonuses on the score sheet\
    \ and interface of how to prompt the user to select which box to score. Let's\
    \ take a look.\n\nWhen you're using a variable to sort the result values, and\
    \ I'm using a sub-shell—that $index—to do the task. The hardest part of this function\
    \ is to figure out how to put the values into the array properly, and that's accomplished\
    \ with a loop. Notice, by coincidence, out-of-order fields separated by white\
    \ space (indentation), so it returns the resulting sequence back into the array.\n\
    \n# Modeling the Score Sheet as an Array\n\nWith most of these types of data structures,\
    \ we'll use an array to model the score chart. Count the boxes on the score sheet,\
    \ and we'll use 13 boxes total, including the Yahtzee box where you can roll—and\
    \ get more than one (as a game that has 13 rolls, but it could have more).\n\n\
