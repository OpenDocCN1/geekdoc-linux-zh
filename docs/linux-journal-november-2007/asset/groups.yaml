    No doubt, 29.4 is an impressive speed, but how could we lose some primes? Maybe
    we had 146,764 of them instead of 148,933. Maybe the compiler was not in being
    conservative and not parallelizing the loop. So look when we''ve caught a bug
    in our OpenMP program? Not even when we''ve caught a bug in the parallel version
    of the application it went to show how easy it is to parallelize anything. This
    means regression testing becomes when you are on the right track. The, how do
    we find the actual problem?


    The trouble with parallel programming is that it makes some sections of your application
    nondeterministic. That means now you have to deal with all sorts of problems you
    didn''t have to deal with before, as race conditions and resource allocation are
    the chief enemies. The nondeterminism introduced, something that makes POSIX threads
    quite fragile in most real-life situations—so much, that one of the parallel computing
    researchers, Professor Edward A. Lee, made a pretty scary prediction in his article
    "The Problem with Threads":


    I conjecture that multithreaded general-purpose applications are, in fact, so
    full of concurrency bugs that as software architectures become commonplace, these
    bugs will begin to show up as system failures. This scenario is bleak for concurrency
    vendors: the next generation of machines will be widely known as the on which
    many programs crash.


    As you can see, OpenMP, even though it introduces significantly less nondeterminism


    than POSIX threads, is still a menace. After all, even with the simplest usage
    of it was enough to introduce a bug. It seems regardless of how much we are parallelism,
    what is a tool that we have used without ever causing concurrency? I know of such
    threads freely available on Linux: Linux Checker and Sun Studio Thread Analyzer.
    And, here''s how you can use the other to catch data races (that we need to make
    thread analysis possible-command-line -instrument=datarace and that we have to
    collect data race events by specifying -r):


