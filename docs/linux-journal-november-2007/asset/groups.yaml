    ## NEW PRODUCTS


    ### ASUS Eee PC 700/701


    Fear not, gadget geek; for issues we''ll fully cover the ASUS Eee PC—so much that
    you''ll grumble "enough already!" The Eee PC is a new, ultralportable Linux-based
    laptop starting at no less than $259 US. ASUS is marketing the 700 model (2GB
    Flash storage, 256MB of RAM) which is mainly for PC owners seeking confidence,
    first-time computer users, low-income households and K-12 education, where the
    701 model (4GB Flash storage, 512MB of RAM) is for Windows users, Intel Celeron-M
    9000MHz processor, 7" display, 10/100Mbps Lan, 802.11 wireless, three USB 2.0
    ports, MMC SD card reader, VGA output, Windows with built-in web-camera (optional
    on the 700) and a four-cell battery. There are no optical drives, both models
    weigh in at 0.9kg. By the time of this writing, ASUS projects that dealers should
    have the Eee PC by late September 2007.


    www.aseeepc.com


    ![](img/48ce16a1858bf2e5a6a924045fc3a4c0_43_0.png)


    ### Lenovo''s ThinkPad Series Lenovo Notebooks


    A year ago we saw Lenovo dip its toe into the Linux waters by certifying and supporting
    its ThinkPad T60 laptop with user-installed SUSE Linux Enterprise Desktop (SLED).
    This year Lenovo is frolicking in the balmy Linux Sea, SLED preloaded and supported
    on its business-oriented ThinkPad Series. That says strong demand for Linux customers
    proved the primary option invite. Preloaded ThinkPads will be available to the
    general public in Q4 2007.


    www.lenovo.com/linux


    ![](img/48ce16a1858bf2e5a6a924045fc3a4c0_43_1.png)


    ### Storix, Inc.''s SBAdmin


    Storix, Inc., released SBAdmin v6.2, as the first backup and system recovery to
    integrate with IBM''s Tivoli Storage Manager (TSM). SBAdmin complements TSM''s
    features and capabilities for Linux and AIX systems. SBAdmin also writes directly
    to the TSM server, which cuts extraneous steps, saves time and increases reliability.
    In addition, the application provides TSM users with disaster-recovery capabilities,
    including a feature called Adaptable System Recovery, which enables a system to
    restore to the same or dissimilar hardware.


    www.storix.com


    ![](img/48ce16a1858bf2e5a6a924045fc3a4c0_43_2.png)


    ### Motorola MOTOMAGX Mobile Linux Platform


    In the near future, Motorola expects 60% of its handsets to run on Linux, and
    the new MOTOMAGX platform is a means for realizing that today. Motorola calls
    MOTOMAGX "next-generation mobile Linux platform" that will deliver new levels
    of openness, flexibility, and third-party applications on its devices. The company
    also hopes to empower its developer community in innovative ways. Currently, MOTOMAGX
    supports apps developed in Java ME and will soon support WebUI and native Linux
    environments.


    www.motorola.com


    ![](img/48ce16a1858bf2e5a6a924045fc3a4c0_43_3.png)


    42 | november 2007 www.linuxjournal.com


    ### Olive''s OPUS 307S


    Who knows you''ll find Linux next? One sure spot is the embedded brain inside
    Media Products'' new OPUS 307S audio system. The OPUS 3075, part of Olive''s OPUS
    N3 product line, is an audio component that goes in your stereo rack and contains
    all of your digital music on a 25GB hard drive. The OPUS can store up to 700 CDs
    in lossless quality. Improvements over the OPUS previous Olive devices include
    perpendicular recording technology for lower power consumption, higher storage
    density, improved long-term reliability and inaudible operation. In addition,
    Olive will include 300 of your CDs.

