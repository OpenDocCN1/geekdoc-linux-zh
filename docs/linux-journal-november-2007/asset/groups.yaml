    ## 入门

    ### Heartbeat


    你通向高可用天堂的第一步。


    Daniel Bartholomew


    在我参与过的每个环境中，某些服务器必须始终保持运行，业务才能继续顺畅进行。这些服务器提供了始终需要可用的服务——无论是数据库、DHCP、DNS、文件、Web、防火墙还是邮件服务器。


    任何需要一直运行且无停机服务的基石，都是能够将服务从一个系统优雅转移到另一个系统。在 Linux 上实现这一点的魔法是一个名为 Heartbeat 的服务。Heartbeat
    是高可用 Linux 项目的主要产品。


    Heartbeat 非常灵活且强大。在这篇文章中，我仅涉及了具有两个成员的基础活动/被动集群，其中活动服务器提供服务，而被动服务器在必要时等待接管。


    ## 安装 Heartbeat


    Debian、Fedora、Gentoo、Madras、Red Hat、SUSE、Ubuntu 等在仓库中都有相关包。检查发行版的主仓库和补充仓库中是否有名为
    `heartbeat` 的包。


    安装预发布版本后，你可能会看到“Heartbeat failure”消息。这是正常的。当安装 Heartbeat 包时，包管理器正尝试启动 Heartbeat
    服务。由于该服务没有有效的配置，因此服务启动失败并阻止了错误消息。


    如果你想使用最新的稳定版本，可能需要从源码编译。由于存在一些依赖项，在我的 Ubuntu 系统上，首先运行以下命令：


    ```

    sudo apt-get build-heartbeat-2

    ```


    访问 Linux-HA 网站获取依赖项列表。如果依赖项过时，下载最新的源码并安装。使用 `ConfigureMe` 脚本来配置 Linux Heartbeat。该脚本通过查看我们的示例来提供明智建议，关于如何配置
    Linux Heartbeat。使用：


    ```

    ./ConfigureMe install

    ```


    运气的话，你会等待几分钟，然后在每个节点上安装。


    ## 配置 Heartbeat


    Heartbeat 有三个主配置文件：


    - /etc/ha/authkeys

    - /etc/ha/hcf

    - /etc/ha/d


    authkeys 文件必须由 root 所有，且权限为 600。authkeys 文件的格式非常简单，只有两行。其中一行是认证方法，另一行是 ID。认证方法有：md5、sha1。sha1
    是一个示例。你可以有一个认证 ID，但这仅在更改认证方法时有用。


    列表 1. /etc/ha/authkeys 文件


    ```

    auth 1

    ThisIsLongPassword

    ```


    ## ha.cf 文件


    下一个配置的文件是 ha.cf——Heartbeat 的主配置。该文件应在所有节点上设置，少数除外。你需要指定的第一个参数是 keepalive——心跳之间的时间。通常我将其设置为
    1 或 2，但负载较大的服务器可能无法及时发送心跳。如果你看到关于心跳的警告，请尝试 keepalive。


    deadline 是在幸存集群成员宣布问题之前等待的时间。


    接下来是定时（timing）。该设置决定了在发布“延迟心跳”警告之前等待多久。


    有时，当集群的所有成员同时启动时，Heartbeat 启动与网络或接口服务准备好之间的时间间隔很短。可选的 deadline 通过设置理想的 deadline
    来解决这个问题。


    列表 2. Briggs 和 Stratton 的 /etc/ha/da.cf 文件


    ```

    keepalive 2

    deadtline 32

    nowartime 16

    initcode 64

    baud 1920

    ```

