    # TECH TIPS


    Display date and time in the past and future pop directories easily.


    # >> Show Date or Time, Past or Future


    When working on Linux/Unix platforms, I frequently find it useful to obtain the
    date and time in the past or future. Whether scheduling jobs, searching for files
    with a certain date or the day on which a certain date falls, routine to compare
    the date and time in the past or future. For a suitable program, but ultimately
    had to write myself. This program is called showdate. It is written in C and can
    be ported over Linux as well. You can download it from the site: ftp.linuxjournal.com/pub/listings/issue_16/showdate.tgz.


    After obtaining the source code, assemble the showdate using a C compiler (or
    gcc):


    ```

    showdate -c

    ```


    Store the executable in /usr/local/bin or a directory of your choice, and invoke
    it without any arguments to use:


    - -f: Display the date and time according to formatting directives in format.
    Options e and f are incompatible. Specifying them on the command line terminates
    the abnormality. The default output of showdate can be tweaked with formatting
    directives and -f, which are identical to the ones used by the standard date command.
    The important thing is that all formatting is performed by either a positive (future)
    or negative (past) offset from the current date (now), which is its datum. A good
    way to become familiar with any tool is to understand how it works. For example,
    to display the date and time ten years ago, what would depend on the value of
    now:


    ```

    showdate usage:

    - -y [+years]

    - -m [+months]

    - -d [+days]

    - -h [+hours]

    - -M [+minutes]

    - -s [+seconds]

    - -e: The time elapsed in seconds since the UNIX epoch (January 1, 1970).

    ```


    ```

    showdate -y -10

    ```


    To find the epoch seconds for the above scenario, use:


    ```

    showdate -y -10 -e

    ```


    A futuristic date of five years, 23 days from now in the YYYY-MM-DD format would
    be output. The plus sign is optional for future dates and the two formats of the
    command line below are equivalent (the minus sign is mandatory for past dates):


    ```

    showdate -y +5 -m -2 -d -f %Y-%m-%d

    ```


    ```

    showdate -y 5 -m 2 -d 23 -f %Y-%m-%d

    ```


    The options can be placed in any order, as their context is unambiguous, the command
    line can be written as:


    ```

    showdate -m 2 -f %Y-%m-%d -d 23 -y 5

    ```


    The effects can be combined in a single command line, however, mixing them may
    lead to unexpected and erroneous results. If now is January 1st 2003 12:00:00
    AM, showdate outputs:


    showdate recognizes the command-line options and arguments:


    - -y [+years]: Number of years in the past (-) or future (+) offset from the current
    year.

    - -m [+months]: Number of months in the past (-) or future (+) offset from the
    current month.

    - -d [+days]: Number of days in the past (-) or future (+) offset from the current
    day.

    - -h [+hours]: Number of hours in the past (-) or future (+) offset from the current
    hour.

    - -M [+minutes]: Number of minutes in the past (-) or future (+) offset from the
    current minute.

    - -s [+seconds]: Number of seconds in the past (-) or future (+) offset from the
    current second.


    The above command displays the date and time in the past—eight months and 32 minutes
    from now, while the one below displays the date and time in the future—8 months
    from now but 32 minutes ago:


    ```

    showdate -m 8 -M 32

    Wed Jan 1 00:32:00 2002

    ```


    ```

    showdate -m 8 -m 32

    Sun Aug 31 23:28:00 2003

    ```


    18 | november 2007 www.linuxjournal.com


    # TECH TIPS


    The capabilities of showdate can be leveraged to specify subjob scheduling times.
    When you want to schedule a batch 12 minutes and 35 seconds from now:


    ```

    $ showdate -l -p -d

    ```


    ```

    showdate -M 12 -s 35 -f %Y%m%d%H:%M:%S | xargs -f job-file -t

    ```


    The current date and time is recorded as the number of seconds that have elapsed
    since. This number is stored in a signed long, which means that on a 32-bit system,
    the bookkeeping will be forever until Tuesday January 19, 2038 at 03:14:08 UTC,
    when the value overflows and becomes negative. An error is returned if the date
    and time exceeds such a limit:


    Suppose you have changes in the first directory (/home/sangeeth/soft/release2/src/).
    To remove that directory from the list of directories that you created, do the
    following:


    ```

    $ popd

    ```


    ```

    $ showdate: required time exceeds system limit

    ```


    The above command removes the topmost directory (/home/sangeeth/soft/release2/src/)
    and performs a cd to the top directory, which will be the second directory (/home/sangeeth/soft/release2/scw/).


    Alternatively, one can pop particular directory from the list of directories by
    giving its ID (which is displayed beside it using dirs -l -p) to the command:


