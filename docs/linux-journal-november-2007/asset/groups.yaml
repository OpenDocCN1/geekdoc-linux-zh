  mdcn: "\n\n# 专栏\n操作 Shell 之术\n\n# 在大骰子（Yahtzee）中计分\n\nDAVE TAYLOR\n\n**上个月**，我开始讨论如何使用简单的脚本技术来创建一个流行的游戏——大骰子（Yahtzee）的计算机模拟，作为一种单机变体；我不会写出整个游戏（那样的话，玩家为了一个脚本会疯掉的），但在转向其他话题之前，让我们再花一栏栏的时间看看得分的基础知识。\n\
    \n大骰子作为一种游戏的一点是，计算机实际上不需要做太多工作，因为游戏本身运行得很好；你只需尝试以任何方式使得分最大化，与你之前的最高分竞争。\n\n大骰子的基本思想是投掷五枚骰子以获得可能的数值组合。然后根据计分卡对其进行评分，计分卡提供了各种组合的分数——从每个骰子1分到“五条相同”（大骰子方式）。\n\
    \n如果我们将游戏中的所有数组都填充一个已知值，例如 -1，那么测试某个单元格是否已填充的方法是：快速访问 Google 查一下大骰子计分表——在我们继续之前看一眼：www.google.com/images/sheets/yahtzee.jpg\n\
    \n```php\nif ($scores[$i] != -1) {\n  echo '1: ' . $i;\n}\n```\n\n诀窍在于，我们还需要预处理这些选项。如果玩家没有得到“五条相同”，那么提示玩家选择他们的投掷结果为大骰子是没有意义的。这有点小技巧，但作为第一步，我将修改代码在每次投掷后对数组中的骰子进行排序。完成这项任务可能很久，但在写完脚本后，我只需要回来处理排序函数，然后进入各个槽位。\n\
    \n在很多方面，它是对骰子的随手操作，因此计分表的第一部分是1、2、3……等等，你的得分是骰子上数值之和。第二部分是其他模式，包括三条相同、四条相同、顺子（四枚骰子连续）、顺子（五枚全部连续）、满葫芦以及更多的大骰子规则。\n\
    \n```php\nfunction sortDice($dice) {\n  $index=1;\n  for ($value in $dice) {\n\
    \    $dice[$index]=$value;\n    $index++;\n  }\n  echo ($dice[5]) . ' ' . $dice[4];\n\
    }\n```\n\n你可以通过达到某些水平获得奖金，例如总分达到至少63分可获得63分奖金，但计分表非常直观。那么，游戏的关键在于弄清楚如何计分。如果你投了一次，你是想把你的得分计为四条相同还是你的点数？如果两者都已满了呢！你会把决定权交给玩家，但仍然留了一个问题：如何模拟计分表上的奖金，以及如何界面提示用户选择为哪个单元格计分。让我们来看看。\n\
    \n当你使用变量对结果值进行排序时，而我正在使用一个子 shell——那个 $index——来完成任务。这个函数最困难的部分是弄清楚如何正确将值放入数组中，这是通过循环完成的。注意，巧合的是，无序的字段通过空格（缩进）隔开，因此它将结果序列返回数组中。\n\
