    ## DISTRIBUTED COMPILING with distcc


    You don''t need a cluster to get cluster-like performance out of your compiler.


    One of the most frustrating aspects of open-source development is all the time
    spent waiting for code to compile. Right now, compiling modules and libraries
    on a single machine takes me around three hours, and that''s just to get a desktop.
    Even with a core duo, it''s a lot of time to sit around and wait. With another
    pair of core machines at my disposal, I''d love to be able to use all of their
    processing power combined. distcc.


    distcc is a program that allows one to distribute the load of compiling across
    multiple machines over the network. It''s essentially a front end to GCC that
    works for C, C++, Objective C and Objective C++ code. It doesn''t require a large
    cluster of compile hosts to be useful—significant time decreases can be seen by
    merely adding one other similarly powered machine. It''s a very powerful tool
    in a workplace or university environment where you have a lot of workstations
    at your disposal, one of my favourite uses of distcc is to be to develop work
    on my laptop comfort of the cafe downstairs and push all the compiles over wireless
    to my most powerful desktop PC. Not only does it get done more quickly, but also
    the laptop stays quiet.


    It''s not necessary to use the same distribution on each system, but it''s strongly
    recommended that you use the same version of GCC. Unless you have set up cross-compilers,
    it''s also required that you use the same CPU architecture and the operating system.
    For example, Linux ELF binaries and some OSs (using a.out) are not, by default,
    to compile for each other. Code can miscompile in many creative and frustrating
    ways if the compilers are mismatched.


    JES HALL


    ## Installation


    The latest version of distcc is of 2.18.3. There are packages available for most
    distributions, or you can download the tarball and compile it. It follows the
    usual automake procedure of configure; make install; see the README and INSTALL
    files (for more details).


    distcc needs to be called in place of the compiler. You can simply export CC=distcc
    to replace it with distcc, but on development work, I prefer a little more detail
    to create links like in make -s, and set it at the end of your path script to
    work around since the version of distcc that I used, by KDE, and it has the widest
    compatibility (see distcc page for more information):


    ```bash

    ln -s /bin/cc gcc g++; which distcc PATH=$PATH:$PATH

    ```


    *If /bin is not at the beginning of your path, or you have your shell like:*


    ```bash

    export PATH=$PATH:$PATH

    setenv PATH=$PATH:$PATH

    ```


    for bourne- and C-compatible shells, respectively.


    ## Client Configuration


    Each client must run the distcc daemon and needs to allow connections from the
    master host on the distcc port (30632). The daemon can be started at any time
    by booting as root, depending on the distribution or environment. If distcc is
    started as an unprivileged user, it will retain ownership of UID. If it is started
    as root, it will attempt to change the distcc to nobody user. If you want to start
    the daemon as root (from an init script) and to user as nobody --user allows you
    to select which daemon should run:


    ```bash

    distcc --allow 192.168.0.254

    ```


    In this example, I use the --allow option. This accepts a host in common domain
    and restrict distcc access to the hosts hosted. It restricts access to the particular
    subject''s item on your home network--addresses in the 192.168.0.1--192.168.0.254
    range. If you are security-conscious, you could restrict to a single address or
    any range of addresses supported by this. I like to leave it plenty loose, because
    of which host is the master on what you''re compiling and when.


    ## Compiling


    Back on the system on which you plan to run your clusters, you need to know which
    of your cluster is there. There are two ways of doing this. You can add the IP
    addresses of your cluster to /etc/hosts, or you can export the variable distcc_HOSTS
    by whitespace. These names need you to resolve--add the names you use to /etc/hosts,
    or use the IP addresses of the hosts if you don''t have DNS:


    ```

    192.168.0.128 192.168.0.129 localhost

    ```


    The order of the hosts is extremely important, distcc needs to determine which
    hosts are more powerful or under load and simply distributes the compile jobs.
    For jobs that can run in parallel, such as configure tests, this means the first
    host will bear the brunt of the cluster. If you have multiple hosts with large
    difference in capacity to compile to the most powerful machines first and the
    last on list of hosts.


    Depending on the power of your running cluster, you might not want to include
    localhost in the list of hosts at all. Localhost is because--a design choice that
    you should make to ensure you have the same set of libraries and header files
    on each machine--and all of the link, which is often process-intensive on a large
    cluster. There is also a decent amount of processing overhead in sharing files
    between hosts. The distcc recommends that for other thumb, distance localhost
    should be placed on the last, for greater than five hosts, it should be excluded.


    Now that you have your cluster configured, compiling is very tricky if you do
    it without distcc. The main difference is when you make the command, you need
    to select multiple jobs, so that the other machines in the cluster have work to
    do. As a general, the number of jobs should appear-the number of CPUs you use.
    For a setup with three clusters, you might use 1 or 2 per cluster. If you have
    removed from your list of hosts, it will exclude CPU or CPUs in running.


    Figure 1. distcc-Monitoring a Cluster


    distcc includes two tools that can be used to watch progress of jobs. The cluster-based
    distcc-test is accessed via SSH. As the user the cluster job is running, executing
    the distcc-test $; where $ is the number of seconds at which you would like to
    refresh. For example, the following:


    ```bash

    distcc-test 5

    ```


    updates your monitor every seconds with complex job information. The graphical
    distcc-test is distributed as part of distcc you compile from, but it is not a
    separate package depending on your distribution. It provides information in a
    graphical-display that allows you to see at which hosts are being heavily utilized
    and which hosts are properly distributed. It follows.


    ## Feature Distributed cluster of distcc


    It doesn''t require a large cluster of hosts to be useful—significant compile
    time decreases can be seen by merely adding other one similarly powered machine.


    A few tries to get the order of hosts at the most optimal—tools distccgenmine
    make it easier to see which machines are being under-used or over-utilized while
    moving in the build.


    ## Over SSH without a key


    Create an SSH key using ssh-keygen -t dsa, add it to the target''s ~/.ssh/authorized_keys.

