    ## 使用 distcc 进行分布式编译


    你不需要集群也能让你的编译器获得类似集群的性能。


    开源开发中最令人沮丧的方面之一就是花费了大量时间等待代码编译。现在，在单机上编译模块和库大约需要花费我三个小时，而这仅仅是为了编译出一个桌面程序。即使是双核处理器（core
    duo），坐在那里等待也是非常耗费时间的。如果我还有另外对双核机器可用，我非常希望能够结合使用它们所有的处理能力。这就是 distcc。


    distcc 是一个程序，允许用户通过网络将编译负载分布到多台机器上。它本质上是 GCC 的一个前端，适用于 C、C++、Objective C 和 Objective
    C++ 代码。它并不需要大型编译主机集群才能发挥作用——仅仅是增加一台性能相的机器，就能看到编译时间的显著缩短。在拥有大量工作站的职场或大学环境中，这是一个非常强大的工具。我最喜欢
    distcc 的用法之一是在楼下的咖啡馆里舒适地用笔记本电脑进行开发，然后通过无线网络将所有编译任务推送到我最强大的桌面式电脑。这不仅完成得更快，还能让笔记本电脑保持安静。


    每个系统并不一定使用相同的发行版，但强烈建议你使用相同版本的 GCC。除非你设置了交叉编译器，否则还要求使用相同的 CPU 架构和操作系统。例如，Linux
    ELF 二进制文件和某些操作系统（使用 a.out）默认情况下是不能相互编译的。如果编译器不匹配，代码可能会以许多新奇且令人沮丧的方式出现编译错误。


    JES HALL


    ## 安装


    distcc 的最新版本是 2.18.3。大多数发行版都提供了相应的包，或者你可以下载 tar 包并进行编译。它遵循通常的 automake 流程：执行 `configure`；然后执行
    `make install`；请查看 README 和 INSTALL 文件（获取更多详情）。


    需要调用 distcc 来代替编译器。你可以简单地通过 `export CC=distcc` 将其替换为 distcc，但在开发工作中，我更倾向于使用更详细的方式来像
    `make -s` 那样创建链接，并将其放在路径脚本的末尾以解决，因为我使用的 KDE 提供的 distcc 版本具有最广泛的兼容性（更多信息见 distcc
    页面）：


    ```bash

    ln -s /bin/cc gcc g++; which distcc PATH=$PATH:$PATH

    ```


    *如果 /bin 不在路径的开头，或者你的 shell 如下：*


    ```bash

    export PATH=$PATH:$PATH

    setenv PATH=$PATH:$PATH

    ```


    分别对应 bourne 和 C 兼容的 shell。


    ## 客户端配置


    每个客户端必须运行 distcc 守护进程（daemon），并允许来自主主机在 distcc 端口（30632）的连接。可以通过以 root 身份启动随时启动守护进程，取决于发行版或环境。如果以非特权用户启动
    distcc，它将保留 UID 的所有权。如果以 root 启动，它将尝试将 distcc 更改 nobody 用户。如果你想以 root 启动（通过 init
    脚本）并作为 nobody 用户运行，--user 允许你选择应该运行哪个守护进程：


    ```bash

    distcc --allow 192.168.0.254

    ```


    在这个示例中，我使用了 `--allow` 选项。它接受公共域内的主机并将 distcc 访问限制在被允许的主机上。它限制了对家庭网络中特定项目的访问——地址范围为
    192.168.0.1--192.168.0.254。如果你注重安全，可以将其限制到单个地址或该功能支持的任何地址范围。我喜欢保持得宽松一些，因为这取决于哪台主机是主、你在编译什么以及何时。


    ## 编译


    回到计划运行集群的系统上，你需要知道集群中有哪些机器。有两种方法可以实现：你可以将集群的 IP 地址添加到 `/etc/hosts` 中，或者通过空格导出变量
    `distcc_HOSTS`。这些名称需要你进行解析——将你使用的名称添加到 `/etc/hosts` 中，或者如果你没有 DNS，则使用主机的 IP 地址：


    ```

    192.168.0.128 192.168.0.129 localhost

    ```


    主机的顺序至关重要，distcc 需要确定哪些主机性能更强或正处于负载状态，并简单简单地分发编译任务。对于可以并行运行的任务（例如配置测试），这意味着第一台主机将承担集群的大部分工作。如果你有多个编译能力差异较大的主机，请将最强大的机器放在列表的最前面，最弱的放在最后。


    根据你运行的集群性能，你可能不想在主机列表中包含 `localhost`。包含 `localhost` 是因为——你应该做的一种设计选择，以确保每台机器上都有相同的库和头文件——而且在大型集群中，主机之间共享文件会产生相当的进程开销。distcc
    建议，对于超过五台主机的情况，应该排除 localhost。


    图 1. distcc-监控集群


    distcc 包含了两个用于观察任务进展的工具。基于集群的 `distcc-test` 通过 SSH 访问。当用户运行集群任务时，执行 `distcc-test
    $`；其中 `$` 是你希望刷新的秒数。例如，以下：


    ```bash

    distcc-test 5

    ```


    每隔几秒更新一次监控，显示复杂的任务信息。图形化的 `distcc-test` 作为你编译的 distcc 一分发，但它不是一个独立的包。它提供了图形化显示的信息，让你查看哪些主机被利用得更充分，哪些主机分配得合理。后文。


    '
