    and they reside at the base of anything done in GIMP or ImageMagik or video editing.
    These functions by nodes. A node like a guitar pedal—accepts inputs and generates
    outputs, and those outputs can be routed to an infinite number of other nodes.
    This composite, uses the node chains to achieve one''s goal, and there are typically
    two types of nodes from which to choose. One type is family-like, user-friendly
    packaged plugins, which are often found in the middle of the universe. The other
    type is a set of mathematical interfaces that allow you to build effects yourself.
    This has the disadvantage of being far more visually complex and, for people,
    much harder to learn. However, if one starts to learn, the artist gets a much
    more versatile workflow, which is better suited to doing complex work. Node-based
    compositors available for Linux include Natron, Fusion (now owned by the Foundry)
    Domain and Blender (2);


