    # 共享存储与数据完整性


    锁管理为其他集群组件提供了同步访问共享资源的机制。在红帽集群中，可以使用 DLM（分布式锁管理器）或替代 GULM（组统一锁管理器）。


    # 围隔离 (Fencing)


    围隔离是集群的一个重要组件。事实上，围隔离的目的是确保当一个节点故障时，集群的其他部分不会被故障节点损坏。这在使用共享存储时尤为重要。


    围隔离可以通过多种方式实现：


    - 存储围隔离：防止故障节点访问共享存储。

    - 节点隔离：通过网络重启故障节点。


    节点隔离最常用的方法是使用 IPMI（智能平台管理接口）控制器。这允许集群管理器远程开启或关闭服务器。


    # 网络配置


    要配置用于绑定的网络，需要使用绑定驱动。最常见的绑定模式是主备模式，允许一个接口处于激活状态，而另一个处于备用。


    # 软件安装


    要安装集群套件，需要有效的红帽订阅。这允许您访问红帽存储库。


