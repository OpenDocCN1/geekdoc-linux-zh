    ## 专家加入。


    红帽的最新发布版本，它进入了红帽的系统。再次，这并没有错误或不法之处，这只是营销手段中的一个小花招——好吧，也许不那么小。


    太阳（Sun）声称红帽“让迁移变得更加困难”，这引出了一个问题：“从哪里迁移？”昨晚，我参加了我的 Linux 用户小组，那位混合使用 Solaris 和
    Linux 的演讲者哀叹，在 Solaris 系统上工作有多么困难，因为其包含了一套意想不到的工具集。他的演讲证实我所知的一些问题，并证明成为 Sun 的客户并不像他们声称的那样轻而易举。再次，我没有看到
    Sun 的营销部门阻止这种泼出去的牛奶。Sun 还声称版本之间具有二进制兼容性，但当我实际上检查条件时，它写着只要你不使用任何未发生变化或被使用的接口，你的程序就可以运行。这是保证吗？这听起来就像我见过的大多数软件产品的最终用户许可协议（EULA）一样——各种胡扯。


    我使用 Linux，并在 2007 年 6 月 22 日收到一条信息，邀请我参加一个一小时的会议，讨论我为什么要使用 Solaris。如果我报名、如果我符合资格、如果
    iPod 的数量（25 个）没有被删除，我就会用 iPod。嗯，即使我有 iPod，但选择那个 iPod 的意义何在？这既不违法也不不道德，即使是卑劣的营销。


    我为什么对此对一个显然设计糟糕的营销活动大做小做呢？毕竟，在过去的八年里我一直在营销部门工作。我知道在一个有许多人且经常发生冲突的大型公司里是什么感觉。我想象
    Sun 内部的人真的相信 FOSS（自由开源软件）以及他们对事的愿景。我知道其中一个。


    首先，Sun 声称自己是自由和开源社区的朋友，是 Linux 和 Unix 的爱好者。其硬件有一个系统至少被一个 Linux 发行版认证，并被列为 Linux
    的合作伙伴。我假设它正在赚钱，而且这样做也服务了服务器以及其上面的 Linux 系统。


    其次，Sun 在维护其带来的一致性方面有着长久且麻烦的历史——公司决策违背了其客户群的真实需求，例如：


    - 从 SunOS 到基于 BSD 的系统的多样化，有时需要（以及由于管理问题）将源代码转为 Solaris 1.x（尽管其基础是相同的）。

    - 对 Solaris 的支持和承诺，不仅一次，而是两次。

    - 忽略 SPARC 是大端序而 Intel 是小端序，导致二进制数据不兼容。“Sun 会处理那个问题，”Sun 侧身说道。“不，它没有，”对方原封回回。端序问题只要
    Tim 致力于让每个服务器模型都具有一致性和可靠性的过程，Sun 就一直推行这一点。质量流程确保了他们的服务器在交付时已准备就绪。


    他已经准备好了 AMD 目前提供的首个四核处理器。Opteron 的运行功率和热量与他们的双核对应品相同，因此升级的客户可以在不损害功耗的情况下受益。性能和电源管理为原生四核处理器提供了完美结合，它可以在一个单元中进行计算。


    当你与 Sun 合作时，你得到的不仅仅是一个强大的服务器——你得到了像 Tim 这样的专家。


    ## 列表


    随着大端机器进入市场，自从 Intel/AMD 占据主导地位 SPARC 成为街上的弱者后，已经进入了一个时代。


    第三，Sun 需要决定它长大后成为什么。它在操作系统上花费数百万美元，而它本可以通过支持 Linux 社区来满足客户需求，并意识到真正的敌人是来自一家不允许竞争的专有操作系统。Sun
    需要重新定义其策略，重新成为像 IBM 和 HP 那样的公司，同时又不让那些真正觉得为产品付费的 VAR（增值零售商）和经销商遭受损失。Sun 需要知道如何做到，但前提是它即将精通。


    第四，Sun 需要清理它的市场。它声称自己是“作为一家开源公司成立的”。实际上，Sun 是最早使用二进制分发模式的公司之一。这种模式确实被当时 AT&T 的许可策略所预见；当时
    UNIX 公司的任务是限制源代码，以促进 GUI 套件并帮助加利福尼亚伯克利完成 Berkeley 分发版。


    我不想说 Sun 从未帮助过开源社区或对其存在做出过贡献。目前，有几个 Sun 的个人对整个社区的贡献更多。但让我们从一个拥有闭源产品和标准历史的公司视角来看。


    Sun 在提到的这个时代拥有一些优秀产品，以及多宇宙和代码开发工具，员工 Richard Shapman 在第 80 页提到的就是利用这些工具的良好例子。Sun
    在服务器系统环境和解决方案方面也做了很好的工作。


    遗憾的是，雇佣相信自由和开源的优秀人才，与公司管理和营销文化所宣称的（即公司的方向）之间是有差异的。


    我是一个相信自由和开源的 Linux 用户，这意味着不仅仅是 Sun 提供的开源许可。它意味着客户可以轻松为 Sun 编写的代码做出贡献。如果 Sun 接受这一点并意味着客户可以轻松地回馈业务伙伴，我可以放心地向我的客户提出我的解决方案，而不必担心我的合作伙伴对我为难。我在
    Linux 内核的自由开源软件中发现了许多此类机会，以及正在构建并做出贡献的人。


    尽管如此，当我与他们接触时，我无法为他们解决复杂的问题，而且我使用的并不是我可能找到的更不开源的解决方案。如果这对客户的目标有价值，我将其视为一种战术解决方案，尽管战略性（长期）解决方案可能是
    FOSS。这可能会导致我为客户提倡 Solaris 解决方案。这就是我作为 Solaris 提供商所喜欢的，与客户合作的方式。


    36 | 2007年11月 www.linuxjournal.com


