    or five GULM servers can also run together, and in case failure of one or two
    servers can be tolerated, respectively. GULM servers are usually run on dedicated
    machines, although this is not a strict requirement.


    In, DLM is used in each cluster node. GULM is good for smaller clusters (up to
    two nodes), because it removes quorum requirements as imposed by the GULM mechanism.


    Based on DLM or GULM locking functionality, there are two basic techniques that
    can be used by the RHEL cluster for ensuring data integrity in concurrent accesses.
    The traditional way is the use of CLVM, which works with RHEL cluster implementations
    with LVM-based logical volumes.


    Another technique is GFS, a cluster filesystem that allows a cluster of nodes
    to simultaneously access a data block that is shared among the nodes. GFS distributes
    metadata and locks to handle concurrent operation in a cluster. To maintain filesystem
    integrity, GFS uses a lock manager (CMAN) to coordinate I/O. When one node changes
    data on a GFS filesystem, that change is immediately visible to the other nodes
    using those filesystems.


