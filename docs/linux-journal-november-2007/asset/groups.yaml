    hardware perspective, the technologies used, such as Storage Area Network (SAN),
    blade server and the x86_64 CPU, helped to manage the requirements of fact, access
    speed and high availability. However, open-source management might introduce new
    overhead. Although all the open-source packages used on our new system are mature
