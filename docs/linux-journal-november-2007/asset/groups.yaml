    ## 相关解决方案


    在我们深入探讨新的电子邮件系统之前，我想提到一下在高等教育环境中一些现有的 Linux/Unix 多服务器方案。首先，我们在期刊文章中讨论过的（见“资源”部分）的
    HEC 邮件系统影响了我们的设计，该系统基于 Cyrus-IMAP；其次，我们研究了剑桥大学的解决方案。它使用了 IMAP 代理前端服务器和多对 IMAP
    邮件服务器，它们之间相互数据。


    此外，卡内基·梅隆大学（CMU）部署了 Cyrus-IMAP、多个前端邮件更改器，并使用 Cyrus 合并聚合器（Cyrus-Merger Aggregator）构建了后端。哥伦比亚大学在
    2006 年将其电子邮件系统迁移到基于 Cyrus-IMAP 的解决方案，印度大学在 2005 年迁移到 Cyrus，斯坦福大学也同样如此。


    除了这些不同的相关解决方案外，其中一些使用了基于集群的方法来为邮件存储器提供邮件投递/接收服务。使用多个前端 MTA-MDA（邮件传输代理和邮件投递代理）服务器将邮件投递到后端邮件存储器，该存储器将数据存储在文件系统（例如
    Maildir）或 UNIX 或 Linux 上作为其邮件存储。


    ## 详细设计


    我们设计的独特特征如下：


    - 1. 我们没有使用目录服务（如 OpenLDAP）进行身份验证，而是将用户身份与 Windows 活动目录（AD）集成。

    - 2. 我们没有使用 LDAP 服务器来存储用户邮件路由设置，而是设计了一个关系型数据库来存储这些设置。

    - 3. 在邮件存储服务器中，我们没有使用主备式高可用集群设置（如 HEC 或剑桥大学开发的 Cyrus 复制技术），而是部署了 Cyrus 合并聚合器。与
    CMU 聚合器使用 MTA 服务器不同，我们将 MTA 和代理功能合并并运行在我们的前端邮件枢纽上。


    我们设计了一个电子邮件用户数据库（在主节点上运行 MySQL），作为中心存储，存储包括电子邮件用户、邮件路由、组联盟和邮件列表在内的信息。使用 PHP 开发了基于
    Web 的界面，允许用户更改设置。运行在前端的数据库查询会获取用户信息，管理员则应用这些设置。


    过滤器是因为路由器（或不是为了获取，而是为了邮件）。对于每条电子邮件消息，Postfix 记录到目的地（信封收件者）和源存储，然后选择将邮件代理器路由到更靠近目的地的地方。称为
    Maps（如传输、垂直和规范映射）的查找用于每个下一跳的邮件投递或电子邮件地址的解析。


    每个前端邮件枢纽上都运行着一个后台作业，用于拉取“mail”设置（邮件投递位置、电子邮件地址和别名信息），这些信息存储在电子邮件用户数据库中。


    我们电子邮件系统的原则是从单体架构扩展到多个共享相同处理负载的节点。在大规模环境中，扩展前端 MTA 服务器被认为比扩展后端邮件存储器更容易。前端本质上是无数据量的，在多个前端服务器上使用
    DNS 或 IP 负载均衡是典型的做法。然而，挑战在于设计数据所在处的系统。由于使用了集群化的共享存储，多个邮件服务器无法在统一的命名空间下共享相同的 IMAP/POP3
    进程。因此，使用单个邮件服务器是一个显而易见的选择，必须提高服务器硬件成本以适应不断增长的负载。配备四个 CPU 的中端服务器价格远高于此。


    ## 使用活动 Directory 及更多技术构建可扩展的高可用电子邮件系统


    图 5. 基于 AD 的 Linux 身份验证与授权


    Cyrus 节点使用 MUPDATE 协议，以便在处理完客户邮件后获取后端 Cyrus 节点的信息。后端 Cyrus 节点使用 MUPDATE 节点进行更改、删除和重命名信箱文件夹，以保持主节点拥有最新的信箱位置信息。主节点将这些更改同步到前端节点，由其引导
    IMAP/POP/POP3 流量。MUPDATE 协议用于处理位置变化。


    尽管这不是完全冗余的解决方案（主节点是单点故障），如果后端节点任一故障，用户将遭受中断，但聚合器设置将 IMAP 处理分配到多个服务器上，每个服务器承担 50%
    的负载。通过分工协作，新的主服务器仍然对多个服务器可用，并能够处理不断增长的用户和增加的需求。后端 Cyrus 节点与聚合器结合以扩展系统。


    ## 与活动目录 (Active Directory) 的集成


    我们新电子邮件系统的要求之一是将身份与目录服务集成。由于 Active Directory 服务已成为企业内部的标准，Cyrus (IMAP) 和 Postfix
    (SMTP) 已配置为从 AD 进行用户身份验证/授权。所有用户账户都可以从 AD 管理。大多数目录服务都是构建在 LDAP 之上的。LDAP 用于授权，并有其自己的
    Kerberos 客户端。对于身份验证，集成 AD 允许 Linux 电子邮件系统运行。


    Cyrus-IMAP 服务器在其后端架构中使用非常稳健稳定。它与 Maildir 或 mbox 邮件服务器不同，因为它被设计为作为“信箱服务器”——Cyrus
    以自己的格式存储邮件。更重要的是，支持多服务器设置。它通过使用多个前端引导 IMAP/POP/POP3 流量来扩展系统负载。我们采用了 Cyrus 聚合：如本文“相关解决方案”部分提到的，或者使用
    Red Hat 的 GFS 等文件系统在多个服务器之间共享信箱（GFS 要便宜得多）。


    '
