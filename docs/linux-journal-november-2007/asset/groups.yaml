    ## Related Solutions


    Before we zoom further into our new email system, I want to mention some of existing
    Linux/Unix multiple servers in higher-education environments. First, the HEC Mail
    system we discussed in a Journal article (see Resources) influenced our design,
    which is based on Cyrus-IMAP and second, we looked into Cambridge''s solution.
    It uses IMAP proxy-front servers and multiple pairs of IMAP mail servers replicating
    data to each other.


    Furthermore, Carnegie Mellon University (CMU), which deployed Cyrus-IMAP, multiple
    front-end mail changer and a Cyrus-Merger Aggregator set up the back end. Columbia
    University moved its e-mail system to a Cyrus-IMAP-based solution in 2006, and
    the University of India moved to Cyrus in 2005, and also by Stanford University.


    Apart from these related solutions which are different, some of them use a cluster-based
    approach that serves mail delivery/from the mail store. Multiple front-end MTA-MDA
    (Mail Transport Agent and Mail Delivery Agent) servers are used to deliver mail
    to the back-end mail store, which stores data in a filesystem (for example, Maildir)
    or on UNIX or Linux as their mail store.


    ## Detailed Design


    Some distinctive features of our design are the following:


    - 1. Instead of using a directory service (like OpenLDAP) for authentication,
    we integrate user identities with Windows Active Directory (AD).

    - 2. Rather than using an LDAP server to store user e-mail routing settings, we
    design a relational database to store these settings.

    - 3. In the mail store server, instead of using an active-passive-high availability
    cluster setup, like the HEC or the Cyrus replication developed at Cambridge, we
    deployed the Cyrus-Merger Aggregator. Unlike the CMU Aggregator uses MTA servers,
    we consolidate MTA and Proxy functions to run on our front-end mail hubs.


    We designed an e-mail user database (running MySQL on the Master node) to serve
    as a centralized store for information including e-mail users, e-routing, group
    alliances and mailing lists. Web-based user interfaces were developed using PHP
    to allow users to make changes to the settings. Database queries running on the
    front-end query the database for user and postmaster apply these settings.


    A filter is because of routers (or not fetch but for email). For each email message,
    Postfix logs to the destination (envelope recipient) and the source store and
    then chooses to route the e-mail messenger closer to the destination. Lookup called
    Maps (as Transport, Vertical, and canonical) are used for each next-hop mail delivery
    or e-mail address resolves to.


    A background job is running on each of the front-end mail hubs to pull the "mail"
    settings (email delivery location, e-mail addresses and alias information) is
    stored in the e-mail user database.


    Our principle of the e-mail system is scale out from monolithic architecture to
    multiple nodes sharing the same processing load. In a large-scale environment,
    scaling out the front-end MTA server is considered easier with scaling the back-end
    mail store. The front-end are essentially data-less, using DNS or IP load balancing
    on multiple front-end servers is a typical practice. However, the challenge is
    to design the system where the data resides. Using clustered, shared storage multiple
    mail servers cannot share the same IMAP/POP3 process to run under a unified namespace.
    Because of, using a single mail server is an obvious choice, one node must implement
    elevated server hardware expenses to accommodate the ever-increasing load. A mid-range
    server with four CPUs is much higher than the price.


    ## Building a Scalable High-Availability E-Mail System with Active Directory &
    More


    Figure 5. Linux Authentication and Authorization Against AD


    The Cyrus node uses the MUPDATE protocol, so that it gets the information about
    back-end Cyrus nodes after the e-mail for the customer. The back-end Cyrus nodes
    use the MUPDATE node to make the changes, deleting and renaming mailbox folders
    in order to keep the master updated with the most current mailbox location information.
    The Master node replicates these changes to the front-end nodes, which directs
    the IMAP/POP/POP3 traffic. The MUPDATE protocol is used to handle location changes.


    Although it is not a fully redundant solution (the Master node is a single point
    of failure), and users will suffer an outage if either of the back-end nodes are
    down, the aggregator setup divides the IMAP processing across multiple servers
    each taking 50% of the load. Division of labor, the new master server is still
    available to multiple servers and is capable of handling a growing user population
    and increasing demand. Back-end Cyrus nodes join with the aggregator to scale
    up the system.


    ## Integration with Active Directory


    One of the requirements of our new e-mail system is to integrate identities with
    the directory service. Because Active Directory services have been made a standard
    within corporate enterprises, Cyrus (IMAP) and Postfix (SMTP) are configured for
    user authentication/authorization from AD. All e-user accounts can be managed
    from AD. Most directory services are constructed on LDAP. LDAP for authorization,
    and it has its own Kerberos client. For authentication, an integrated AD is used
    to allow the Linux e-mail system.


    The Cyrus-IMAP server is robust and stable to use in its back-end architecture.
    It differs from Maildir or mbox IMAP servers as it is intended to be run as a
    ''mailbox-server''—the Cyrus server stores mail in its own proprietary format.
    More important, a multi-server setup using Cyrus Merger aggregation is supported.
    It scales the system''s load by using multiple front-end IMAPs to direct IMAP/POP/POP3
    traffic to back-end master mail nodes. It can handle other mailbox formats like
    MD-IMAP—for example, Cyrus''s universal pair-wise replication approach, mentioned
    in the Related Solutions section of this article, or using a clustered file system
    to share mailbox partitions between multiple servers with products like Red Hat''s
    GFS. These approaches are also customized to support the (Cambridge approach)
    or avoid external cost (GFS is significantly cheaper by Red Hat Inc.).


    So, the Cyrus IMAP aggregation was adopted: Two back-end servers were used, each
    handles half the population. Two Postfix front-end nodes are designed to serve
    the proxy. When e-mail clients connect through SMTP/IMAP3 to the front-end servers,
    the Cyrus proxy will communicate with three or more cluster-servers. Furthermore,
    a single-node architecture system scales poorly and creates a single point of
    failure.


    ## Resources


    Our new system is built on mostly open-source software. From the hardware perspective,
    the technologies used, such as Storage Area Network (SAN), helped to fulfill most
    of the requirements. At the time of writing, our new Linux e-mail system (MUMAIN)
    has been running in production for ten months. The entire system has been in a
    stable state with de-registration.


    Jack Chung holds a master''s degree in Information Science from Marshall, where
    he did his research.


    - [Scaling University''s ''E-Mail Service''](https://www-uscept.corp.com.au/-ann/fermes/2004-02-0aug/paper.html)
    by David Carter and Tony Finch.

    - [Hot Sentinel: Deployment of a Large-Scale Mail Implementation](https://www.linuxjournal.com/article/9233)
    by Lucy Lavocorte.

    - [Cyrus-IMAP Configuration](https://cyrusimap.cyrus.org/configuration)

    - [An Automated Utility Comparison of Open-Source IMAP Servers](https://www.usenn.org/entries/lios05/test/golubovsky/golubovsky.shtml)
    by Golubovsky

    - [Migration of AD C-Mod Infrastructure to Linux](https://www.pscf.mit.edu/imap/papers/64.pdf)
    by T. F. Freddie, Michael Green and J. A. Stiller.

