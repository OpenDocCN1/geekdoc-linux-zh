    # # Why an Image Sequence Instead of a Video?


    Working with image sequences offers three distinct advantages over working video.
    First, image sequences make it easier to rethink on individual frames without
    reprocessing the entire clip. Second, the use of alpha-embedded channels gives
    the operator a greater flexibility to do video formats, very few of which are
    lossless or embedded. Third, video codes are, frankly, a big pain in the neck.
    They widely support every program but image formats are generally and comparatively
    open. Converting your video to image sequences before piping it through your compositor
    or motion tracker means that you''re going to encounter fewer problems with moving
    between programs.


    With Blender, there one further advantage to using image sequences, and that is
    to do with shortcoming the program. Blender does not support NTSC drop or drop
    frame encoding, both of which run at 29.97 frames per second (fps). Because it''s
    a European program and has been an animation program, the closest approximation
    it has is 30fps. 30fps is enough to sync your sound within the limits of intelligibility,
    so it''s far better to work with image sequences and then re-multiply your audio
    with your video editing software, such as KELIVE or OpenMovieEditor.


    The key begins with a curves node, which helps the green in the green into a narrow
    band to make it easier for the key to latch on. Then, to output the input of a
    channel key, to select the cleanest possible match to make the image output, I
    could see what I wanted when I was playing with the results. The sequence would
    then run through a blur node normally, when I used a 4x2 blur to soften the edges
    and compensate for the artifact introduced by the DV compression. However, if
    my edges were dark, because the background was light, the output of this blur
    node is then plugged into the Fac input of an Alpha Over node, which marries the
    green sequence footage to the rest of the image. But, I''m getting ahead of myself.


