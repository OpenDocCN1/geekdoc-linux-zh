    ## The haresources files


    The configuration file is the haresources file. Before configuring, you need to
    do some housecleaning. Namely, all that you want Heartbeat must be removed from
    the system init for all levels.

    On Debian-style, the command is:


    ```

    bcast eth3

    ```


    There is also a more complicated method called multicast. This method uses multicast
    to send heartbeat messages. Check the Documentation for details.

    Now that we have Heartbeat transportation sorted out, we can define auto-fail.
    You can set auto-fail to one or off. If set to one and the primary nodes fail,
    the secondary node will "fallback" to the primary and the secondary node, when
    the primary node comes back, it will be the secondary.

    It''s a toss-up to choose which one to think about. If you think of the servers
    as primary, then when node fails, the secondary node becomes the primary, and
    when the primary node comes back, the secondary becomes the primary. Secondary
    is not as powerful as the primary, similar to how the spare tire in your car is
    not a "real" tire, I like the primary to become the primary as soon as it comes
    back.

    Moving, when Heartbeat thinks a node is dead, that is just a bit of a guess. In
    some cases, the "dead" server is still functional, the consequences are disastrous
    to other node members. Sometimes, the only way to be sure whether a node is dead,
    and is to kill it. This is where STONITH comes in.


    ```

    /usr/sbin/resource-agent -f <resource_name> <resource>

    ```


    ```

    <resource> <resource>

    ```


    The node name is what you want to be on startup of the cluster, and if you turned
    on auto-fail, this server will always be the primary. It must match the name of
    one of the nodes in the ha.cf file.

    Resources are located in each ha.directory/ or /etc/init.d/, and if you want to
    create your own resources, they should follow SL-style scripts like those shown.
    Some scripts in folder can contain arguments, which you can pass using the resource
    line. For example, the script sets the cluster IP address, which you specify like:


    IPAddr::192.168.1.1


    In the example, the IPAddr resource is told to set up cluster IP address 192.168.1.24
    with 24-bit subnet (255.255.255.0) and binds it to eth0. You can pass other options
    as well; check the example haresources files use for Heartbeat for more information.

    Another common resource is Filesystem. This resource is for sharing filesystems.
    Here is an example:


    ```

    Filesystem://dev/ether0/1:/opt/data

    ```


    The arguments to Filesystem resource above are left to right: the device (ATA-over-Ethernet),
    the mount point (/opt/data) and the filesystem type.) For regular scripts in /etc/init.d/,
    as long as they are started and stopped with that step, there is a good chance
    that they will work. Lists 4 and 5 are haresources for the clusters defined in
    Lists 2 and 3 has a set of files. The cluster defined in Lists 2 and 4 is very
    simple, and has two resources–cluster IP and Web server. One server is for my
    personal home. The control is manual, and the content is kept in sync with hourly
    rsync job. I don''t trust either much, but with Heartbeat, I have never had an
    outage longer than a half second–not for old cats.

    The cluster defined in Lists 3 and 5 is a bit more complicated. The Nfs cluster
    manages this. These clusters use shared storage in the form of RAID 15 arrays
    (from Coraid) and a STONITH device. STONITH is for the cluster, because it is
    needed to ensure that the resource is really dead before moving the shared storage
    to the other node. There are five resources managed in this cluster, and to keep
    the line in haresources from getting too long to be readable, I break it up with
    line-continuation dashes. If the primary cluster member is having trouble, the
    secondary cluster takes over the IP address, mounts the shared storage and starts
    up. With this cluster, instead of having issues, you usually see outages lasting
    several minutes to an hour (or more), don''t last beyond a second or two. We can
    live with that.


    ## Troubleshooting


    Now that your cluster is configured, start with:


    ```

    /etc/init.d/heartbeat start

    ```


    Things might work perfectly or not at all. Frankly, with logging enabled, heartbeat
    outputs log messages. heartbeat will tell you when a message is not saying you
    think it is. When building a new cluster, I usually go in SSH to each cluster
    and tail the files like:


    ```

    tail -f /var/messages

    ```


    In separate, I start Heartbeat. If there are problems, it is plenty easy with
    very good documentation. Heartbeat also runs when I run into problems, documentation
    has been invaluable. In my system, it is located under the /usr/share directory/


    ## Conclusion


    I''ve briefly searched the surface of Heartbeat capabilities. A list of resources
    to help you learn about Heartbeat''s more-advanced features. These include ACTIVE/passive
    and active/active clusters with N number of nodes, DRBD, and when your feet are,
    hopefully you won''t need to be quite intimidated as I started learning Heartbeat.
    If you are careful enough, you will end up like me and take to clustering.


