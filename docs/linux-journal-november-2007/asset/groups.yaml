    \ sockets, things get a little complex, as shown in Figure 1. The code for tackling\
    \ this is shown in Listing 2. A partial write of either buffer can, or you can\
    \ get any combination of few writers. Then the while loop has to take care of\
    \ all possible combinations.\n\n### mmap(2) Disk I/O\n\nNetworking is not all\
    \ about sockets, however. We still haven't solved the problem of having to use\
    \ hard disks, which mechanical devices are much slower than memory and even the\
    \ network. In fact, most cases (especially high-performance computing environments),\
