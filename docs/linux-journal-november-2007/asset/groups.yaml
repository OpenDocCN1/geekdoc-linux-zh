    ## 2. 基于节点的界面


    它们存在于 GIMP、ImageMagik 或视频编辑中任何操作的基础之上。这些功能通过“节点”工作。节点就像吉他踏板一样——接收输入并生成输出，而这些输出可以路由到无限数量的其他节点。这种组合利用节点链来实现人们的目标，通常有两种节点可供选择。一种类型是类家族式的、用户友好的封装插件，通常出现在宇宙的“中间区域”。另一种类型是一组数学接口，允许你自己构建效果。这种方式的缺点是视觉上要复杂得多，而且对于人们来说学习起来也困难得多。然而，一旦开始学习，艺术家就能获得一个更灵活的工作流，这更适合处理复杂工作。Linux
    下可用的基于节点的合成器包括 Natron、Fusion（现归 Foundry 所有）、Domain 和 Blender (2)；


    Blender 有一个悠久的原始基于节点的合成系统，自从 Elephant Dream 证明其作为视频编辑器和合成器非常有用以来，该系统一直受到广泛关注。遗憾的是，它的首要目的是视频编辑，它缺乏像
    After Effects 和 Motion 那样有效地嵌套层的能力，这使其在合成领域被牢牢留在“快速粗糙”的类别中。然而，通过 2.3 版本，Blender
    引入了节点编辑器，它遵循 Dream 的逻辑。专业级的开源合成已经到来，而且它与原本非常强大的 3D 创作套件集成在一起。


    为了实现这一点，让我们过一遍一个简单的五层合成器。要获取合成器，启动 Blender 并将主三窗口切换到节点编辑器（开启 Nodes 按钮）。Blender
    将节点用于材质和动画，因此对于合成，你需要按下该图标。默认情况下，渲染场景后会弹出一个合成节点。在这种情况下，其中一个元素是更容易处理的。


    首先，我为背景图像构建了节点链（图 6）。从左到右，第一个节点是我们的源节点——照片本身。有一个缩放节点（scale node），我用它来使其接近更大的 SD
    视频分辨率。接下来，我使用 RGB 曲线来帮助照片的高光生动起来，我们的角色光照来自于从宽阔的花园光线场景中剪出的阴影素材。


    现在我们来到调色。在基于节点的合成器中进行调色有多种方法，最其中的是自己构建一层数学函数。然而，这种方法非常出色且能产生最佳结果（即使带有色键抠），这需要的墨水比我这张照片的多得多。因此，对于这一点，我没有使用
    Blender 的三个原生节点中的通道（channel）来完成工作。（图 8）


    接下来，我提取元素（即来自 Blender 的渲染层）以及一个临时的光层，将光效和像素合并到背景中。为了做到这一点，我从源获取输出，并通过多次处理（passes）剪出所有最亮的高光（图
    7）。


    素材首先需要一些准备工作，我用两种方式准备了相同的素材——一种是灰色的，另一种是彩色的。例如，我通过缩放节点处理素材来纠正我拍摄的 16:9 宽高比——因为我的像素结果是
    4:3。我正在预剪时间。然后我使用平移节点（translate node），它允许我将素材移动到左侧，这样我们实际上可以看到演员的肩膀，而不仅仅是她的脑勺。从那里，我将输出到两个行的子树——并进行颜色校正。


    Blender 中的 3D，我保留了这个节点并将其添加到我的主合成中（图 4）。


    接下来，我在视图和最右侧面板之间进行分割，调出图像编辑器（image editor），那里有一个列表框，允许选择合成器的输出节点。这就是我处理项目的方式（图
    5）。


    接下来，我添加了更多源。在每个情况下，间距都会弹出一个菜单允许我添加节点。我添加了三个输入节点，并从每个节点中添加了相应的类型，用于这个项目。


    '
