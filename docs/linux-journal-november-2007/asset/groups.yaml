  - '[PAGE 45]


    # NEW PRODUCTS


    # Trinity''s Digital Audio Workstation


    Here is an audio device that is not brand-new but new to me and hopefully to you
    too—Trinity Audio Group''s Trinity Digital Audio Workstation. This slick, all-in-one
    device is a portable, professional recording studio that allows one to do anything
    imaginable with linear audio (for example, sample, edit, mix, play back and on).
    Trinity does everything your laptop with an audio interface can do, only conveniently
    and portably. Trinity runs on Linux and with WAV, MP3 and Ogg Vorbis files, such
    as the Trinity Hyperogue drum machine, Arbour and more. Built-in 802.11g Wi-Fi
    lets you podcast from the field.


    www.trinityaudiogroup.com


    ![](img/48ce16a1858bf2e5a6a924045fc3a4c0_45_0.png)


    ![](img/48ce16a1858bf2e5a6a924045fc3a4c0_45_1.png)


    # IBM''s Big Green Linux Initiative


    Thankfully, firms like IBM are starting to look at our serious environmental problems
    rather than at barriers. IBM''s new Green Linux initiative seeks to leverage Linux
    and other technologies to reduce costs and energy consumption by building cooler
    data centers for itself and its customers. Big Green Linux is a subset of IBM''s
    broader yet similar project. Big Green Linux will include server consolidation
    to System x and y platforms; new efficient products, such as the Information Border
    (such as tick low-power state); and others.


    www.ibm.com/linux


    ![](img/48ce16a1858bf2e5a6a924045fc3a4c0_45_2.png)


    # SugarCRM


    By the time you flip to this page, SugarCRM will have its new version 5.0 ready
    for you. This is the ninth release of the professional open-source customer relationship
    management package. New features, such as the ability to build custom modules,
    a new Ajax-mail client and a Multi-Instance On-Demand architecture, are said to
    "enhance the ability to build, customize, scale and upgrade the application";
    SugarCRM says its innovations are derived from feedback from 2,000 commercial
    customers and thousands of Open Source community members.


    www.sugarcrm.com


    ![](img/48ce16a1858bf2e5a6a924045fc3a4c0_45_2.png)


    # Trusted Computer Solutions'' Security Blanket


    Trusted Computer Solutions has long made security solutions for the CIA and other
    agencies in Washington, DC, and we do not have a new product, Security Blanket
    aims to harden your Linux server with the same favor. Trusted Computer Solutions
    calls Security Blanket "a system lock-down and security management tool that enables
    administrators to configure and enhance the security level of the Red Hat Enterprise
    Linux operating platform atomically." The product''s advantage is to simplify
    the current methods (such as using Bastile) "hardening" systems. This mini-LU
    drives up to one customized profiles or predefined industry-standard practices
    from the National Institute of Standards and the Center for Internet Security.
    Security Blanket covers Red Hat Enterprise Linux 4 and 5.


    ![](img/48ce16a1858bf2e5a6a924045fc3a4c0_45_4.png)


    www.trustedcs.com


    Please send information about Linux-related products to James Gray at newproducts@linuxjournal.com
    or New Products c/o Linux Journal, 1752 NW Market Street, #8200, Seattle, WA 98108.
    Submissions are edited for length and content.


