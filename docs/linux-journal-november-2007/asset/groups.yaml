    最后一步是跨集群同步配置。RHEL 集群管理和配置工具提供了“将配置保存到集群”的功能，它会在你启动集群时出现。在这里，对于第一次同步，最好手动发送集群配置文件，或使用
    `scp` 命令在各个节点之间同步 `/etc/cluster/config` 文件。


    你还需要特别注意在同步节点之间同步 UID 和 GID。这对于确保维持适当权限至关重要，特别是考虑到共享文件系统时。


    GRUB 允许你适应环境的特定需求。例如，RHEL 集群环境中的许多管理员会将 GRUB 超时时间降低到较低的值（如 2 秒），以加快重启速度。


    ## 与 RHEL 集群的数据库集成


    相同的 RHEL 集群基础设施可以用于提供高可用数据库，例如 Oracle、MySQL 和 IBM DB2。


    最重要的事情是将你的数据库相关服务基于共享 IP 地址的——因为你必须在集群的共享服务上配置 Oracle 实例。


    一旦同步完成，你可以在两个节点上启动集群服务。你应该按顺序启动和停止 RHEL 集群服务：


    接下来，在示例中，我们展示了如何使用未配置的 MySQL 集群为 MySQL 数据库服务提供高可用性，这是 RHEL 上常用的数据库之一。我假设两个集群节点上都安装了
    MySQL  RPM 包，并且 RHEL 集群已配置了服务地址 `172.16.2.188`。


    ```

    service cssd start

    service cman start

    service fence started

    service rgmanager start

    ```


    停止：


    ```

    service rgmanager stop

    service fence stop

    service cman stop

    service cssd stop

    ```


    如果你使用 GFS，`gfs` 和 `gmd` 服务的启动/关闭必须在该序列中。


    现在，只需使用集群配置工具定义一个域（其集群节点具有较高的优先级）。该域将拥有 MySQL 服务，该服务有两个私有资源（一个文件系统和一个获取的共享资源（IP
    地址））。


    其中一个私有资源将是文件系统（类型为 `/shared/mysql` 的挂载点），另一个私有资源应该是物理设备，指向被退役的磁盘点。数据库的内容在两个节点上都应该是可用的，位于
    http://www.linux.com/pub/ij/listings/i63/9759.cfg 中的第 3 个 LI 文件。


    在我的环境中，我不会在启动时启动集群，也不会在关闭 RHEL 节点时停止这些服务。然而，如果你的可用性需要 24/7 可用，你可以通过 `configcommand`
    轻松地做到。


    此脚本设置了 `/shared/mysql` 数据目录，它位于我们的共享 RAID 阵列上，应该在两个集群节点上都可用。


    ## 额外考虑因素


    可以使用任何 MySQL 客户端进行 MySQL 数据库的高可用性测试。我使用了 SQLquery，这是一个基于 Windows 的 MySQL 客户端。我连接到
    Common1，然后连接到此集群节点以查看故障转移结果。集群事件被触发，MySQL 数据库自动重启。这个故障转移过程花费了我分钟，进行得非常顺利。


    另一个考虑是将集群日志消息记录在不同的文件中。集群管理器将消息记录在 `/var/log/messages` 中，这在某些情况下可能很困难。为此，我编辑了
    `/etc/cluster` 文件以允许集群记录不同于默认日志文件的事件，并添加了以下行：


    ## 总结


    RHEL 集群技术可用于提供可靠的高可用基础设施，该设施可用于 24/7 业务需求以及应用程序。记住最重要的点是，在实施之前最好进行仔细计划，并在 RHEL
    集群上线之前，实施并测试你的集群以及所有可能的故障转移场景。一个文档良好的测试计划在这方面也有帮助。


    ```

    /var/log/messages /var/secure /var/log/mailog /var/log/spool

    /var/log/boot.log /var/log/cron /var/log/cluster

    /bin/kill -HUP -cat /var/log/syslog.d > /dev/null 2>&1

    /dev/null || true

    ```


