    \ 2007 | 81\n\n# 深度解析\n\n诚然，这段代码很笨（（有人会说它是脑残的），但让我们假设它是真实的应用程序。如果你可以做到，我们确实会从这种优化中获益。如果你不能，那么没有比编译器更适合帮助我们的工具了——它只需要理解代码的语义来执行顺序优化。理想情况下，我们需要一个能与我们对话的编译器，帮助我们理解源代码并根据这些信息做出更合理的调整。在这里，我们的\
    \ Studio C 让我们使用：\n\n```\n$ cc -fgL3 prime.c -o prime\n$ er_prime\n```\n\n源循环如下：\n\
    ```\nSource loop below:\n35    for (int i = 2; i < N; i++) /* 测试开始！ */\n```\n\n\
    函数从 `prime.c` 内联到代码中：\nFunction is inlined from source function_prime, line 14\
    \ has tag L4。\n\n最后，编译器用通俗易懂的语言向你解释它对源代码做了哪些转换以提高速度。不仅如此，它还识别了可以嵌套并证明并行化的区域。识别并行化很棒，但如何表达并行化呢？让编译器为我们做这件事可行吗？或者我们必须使用像\
    \ GOTOs 这样的指令？无论如何，消息是使用正确的编译器是可以的。但在我们继续之前，让我们记住“并行化程序”的第三步并建立一个基准：\n\n```bash\n\
    $ cc -fgL3 prime.c\n$ ./prime 200000\n```\n\n创建实验数据 test1.er\nNumber of numbers\
    \ between 2 and 200000 148933\n$ er_print -statistics test1.er\n\n整个程序的执行：\n\n\
    | 标签: | 表格: |\n|---|---|\n| 开始时间 (sec.) | 0.028 |\n| 持续时间 (sec.) | 3.364 |\n|\
    \ 总时间 (sec.) | 3.337 |\n| 平均数量: | 100 |\n\n-fast 命令行选项指示 Studio C 编译器为相同的架构生成尽可能快的代码。最后两个命令实际上执行并运行\
    \ main。我们现在知道，无论对源代码做什么，结果都不应该慢于 3.336 秒。考虑到这一点，让我们尝试让编译器不仅识别并行化 (-xautopar)，还表达它\
    \ (-autopar)：\n\n```bash\n$ cc -fxoptinfo -autopar prime.c -o prime\"prime.c\"\
    \n```\n\n\"prime.c\", line 14: 未并行，有多个出口\n\"prime.c\", line 14: 未并行，有多个出口\n\n\
    所以，通过两个额外的命令行选项，编译器可以解释为什么我们的两个循环（line 31 (-autopar) 和 lines 14 and 35）可以并行化 (-autopar)。这非常令人印象深刻，但让我们获得速度提升：\n\
    \n```bash\n$ export OPT_NUM_THREADS=4\n$ ./prime 200000\n```\n\n创建实验数据 test2.er\n\
    Number of numbers between 2 and 200000 148933\n$ er_print -statistics test2.er\n\
    持续时间 (sec.) 3.331\n\n好在如此（没有显著加快），我们不需要通过设置 OPT_NUM_THREADS 环境变量让运行时系统为我们处理任何源代码。或者我们有任何比第\
    \ 35 行更复杂的问题吗？如果编译器过于保守，就需要介入。但这是 OpenMP 的并行限制。OpenMP 的正式定义规定，如果平台包括 Linux 和 Windows\
    \ 在所有架构上都支持共享内存并行，我愿意将 OpenMP 视为一种帮助编译器细节化的方法。当我们使用 \"autopar\" 时，OpenMP 是用的。如此，添加这些建议的并行选项会有并发问题吗？任何指令，如果编译器不理解，它就会跳过。此时，免费编译器可以支持\
    \ OpenMP 2.5：Intel 编译器、GCC 4.2 等，那么我们如何使用 OpenMP 来提升编译器？只需在相应行添加以下指令：\n\n```c\n\
    #pragma omp parallel for\nfor (int i = 2; i < N; i++) /* 测试开始！ */\nif (is_prime(i))\
    \ {\n```\n\n并且不需要在命令行选项集中添加 -autopar：归根结底，作为软件开发者，我们别无选择完全拥抱并行的世界观。\n\n```bash\n\
    $ cc -fast -fxoptinfo -xautopar -xopomp prime.c -o prime\n\"prime.c\", line 14:\
    \ 未并行，有多个出口\n（注：此处原文重复，翻译按要求处理）\n\"prime.c\", line 31: 并行化，生成了串行版本\n\"prime.c\"\
    , line 35: 并行化，使用了用户指令\n```\n\n太好了，我们让应用程序中的三个循环完全并行化了。看看当出现时看起来困难得多：\n\n```bash\n\
    $ .prime 200000\nCreating database database.3\nNumber of numbers between 2 and\
    \ 200000: 146764\n$ er_print -statistics test.3 | grep Duration\n(sec.): 1.132\n\
    ```\n\n无疑，这是一个令人印象深刻的速度，但我们为什么会丢失一些质数呢？也许我们有 146,764 个，而不是 148,933 个。也许编译器没有并行化循环。所以看当我们在\
    \ OpenMP 程序中发现一个 bug 时？即使我们在应用程序的并行版本中发现了一个 bug，它也说明了并行化任何东西是多么简单。这意味着当你在正确的轨道上，回归测试变得有意义。\n"
