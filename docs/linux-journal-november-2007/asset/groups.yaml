    # 技巧


    showdate 的功能可以指定子任务调度时间。当你想要调度 12 分钟 35 秒后的批处理时：


    ```

    $ showdate -l -p -d

    ```


    ```

    showdate -M 12 -s 35 -f %Y%m%d%H:%M:%S | xargs -f job-file -t

