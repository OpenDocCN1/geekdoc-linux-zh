    \ interesting technique is scatter/gather I/O or using readv(2) and writev(2)\
    \ for network and I/O. Instead of using buffers as the unit of data transfer,\
    \ an array of buffers is used. Each buffer can have a different length, and you\
    \ can transfer large chunks of data between multiple sources. This could be a\
