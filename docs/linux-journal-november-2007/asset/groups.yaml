    # A Few Words on TCP


    TCP has been a field of intense research for decades. It is an extremely

    complex protocol with a heavy responsibility on the Internet. We often

    forget that TCP is what builds the Internet together without collapse

    due to how it connects networks, but TCP ensures

    that routers are not overloaded and packets do not get lost.


    Consequently, the impact of TCP on performance is higher than

    any other protocol today. It is no doubt that top-researchers

    have written several papers on the topic.


    The field is amazing but homogeneous. There is every possible

    layer of technology on which TCP/IP works today. But, TCP is-

    designed for working well through wireless networks. A high-

    latency link seems to question TCP''s assumptions on

    size and round trip measurement.


    It suffers from its share of defects. The congestion control

    algorithms, such as slow start, congestion avoidance, fast

    transmit, and recovery on, When it fails, it hits your

    performance. Normally, three duplicate ACK packets are sufficient

    for triggering congestion control mechanisms. What do you do,

    then? You drastically decrease performance, especially if

    you have a high-speed network.


    But, all being equal, the above techniques are of the most

    useful methods for achieving good performance for your applications.


    # Conclusion


    Gunning for high performance is not something to be taken lightly.

    It depends on heuristics and empirical data as well as proven

    techniques. As mentioned previously, it is an art perfect built by

    practice. However, once you get the feel for it, it will be smooth. The moment
    you

