    在其中，每个集群节点都使用 DLM。GULM 适用于较小的集群（多达两个节点），因为它消除了 GULM 机制强制实施的仲人数要求。


    基于 DLM 或 GULM 锁定功能，有两种基本技术可以供 RHEL 集群用于确保并发访问中的数据完整性。传统方法是使用 CLVM，它与带有基于 LVM 逻辑卷的
