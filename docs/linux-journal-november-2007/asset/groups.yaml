    # 技巧


    轻松显示过去和未来的日期和时间


    # 显示日期或时间，过去或未来


    在 Linux/Unix 平台上工作时，经常发现获取过去或未来的日期和时间非常有用。无论是调度任务、搜索具有特定日期的文件，还是比较过去或未来的日期和时间，我最终不得不写了一个程序，叫做
    `showdate`。它用 C 语言编写，也可以移植到 Linux 上。你可以从 ftp.linuxjournal.com/pub/listings/issue_16/showdate.tgz
    下载它。


    获取源码后，使用 C 编译器汇编 `showdate`：


    ```

    showdate -c

    ```


    将可执行文件存放在 /usr/local/bin 或你选择的目录，并在不带任何参数的情况下调用它：


    - -f 根据格式指令显示日期和时间。`e` 和 `f` 选项是不兼容的。`showdate` 的默认输出可以通过格式指令进行调整，这与标准的 `date`
    命令相同。重要的是，所有的格式化都是相对于当前日期（now）的正偏移（未来）或负偏移（过去）执行的。熟悉任何工具的好方法是理解它的工作原理。例如，显示十年前的日期和时间，取决于：


    showdate 用法:

    - -y [+years] 年

    - -m [+months] 月

    - -d [+days] 天

    - -h [+hours] 小时

    - -M [+minutes] 分

    - -s [+seconds] 秒

    - -e: 自 Unix 元（1970 年 1 月 1 日）以来经过的秒数


    ```

    showdate -y -10

    ```


    对于上述场景，使用：


    ```

    showdate -y -10 -e

    ```


    现在 23 天后的未来日期将以 YYYY-MM-DD 格式输出。对于未来日期，+ 号是可选的，下面的两个命令行格式是等效的（对于过去日期，减号是强制的）：


    ```

    showdate +5 -m -2 -f %Y-%m-%d

    ```


    ```

    showdate 5 -m 2 -d 23 -f %Y-%m-%d

    ```


    选项可以任何顺序放置，因为上下文是明确的，命令行可以写成：


    ```

    showdate -m 2 -f %Y-%m-%d -d 23 -y 5

    ```


    然而，将它们组合在同一个命令行中可能会导致意外的结果。如果现在是 2003 年 1 月 1 日凌晨 12:00:00，showdate 输出：


    showdate 识别以下命令行选项和参数：


    - -y [+years]: 当前年份过去或未来的年数。

    - -m [+months]: 当前月份过去或未来的月份数。

    - -d [+days]: 当前日期过去或未来的天数。

    - -h [+hours]: 当前小时过去或未来的小时数。

    - -M [+minutes]: 当前分钟过去或未来的分钟数。

    - -s [+seconds]: 当前秒过去或未来的秒数。


    上面的命令显示过去 8 个月 32 分钟的日期和时间，而下面的显示未来 8 个月但 32 分钟前的日期和时间：


    ```

    showdate -m 8 -M 32

    2002年1月1日 00:32:00

    ```


    ```

    showdate -m 8 -m 32

    2003年8月31日 23:28:00

    ```


