    ![](img/48ce16a1858bf2e5a6a924045fc3a4c0_57_0.png)


    early 2006, Marshall University laid out a plan to migrate HOBBIT (Figure 1),
    an HP OpenVMS cluster handling university-wide e-mail services. Plagued with increasing
    spam attacks, this cluster experienced severe performance degradation. Although
    our e-mail server moved to Microsoft Exchange in recent years, mailing list and
    student e-mail (using IMAP and POP3 services) were still served by OpenVMS with
    over 30,000 active users. HOBBIT''s e-mail software, PFS provided a limited feature
    set while charging a high licensing fee. A major bottleneck was discovered on
    its external disk system: the dated storage technology resulted in a limited disk
    I/O throughput (40MB/s at maximal) in an e-mail system doing intensive I/O operations.


    To replace the existing e-mail performance issues, we conducted brainstorming
    sessions, requirements analysis, product comparison and test-prototyping. We came
    up with the design of our new e-mail system: it is named MUNAI (Figure 2) and
    uses open-source software (Postfix, Cyrus-IMAP and MySQL) installed on Red Hat
    Enterprise. The core system consists of front-end e-mail hub and back-end e-mail
    store. The front-end e-mail uses two Dell servers running Postix on Linux. Network
    load balancing is configured to distribute load between them. The back-end consists
    of three additional blade servers running a Cyrus-Aggregation setup. Each back-end
    node is attached to a different storage group on the EMC Storage Area Network
    (SAN). A fifth server is designated as master node to control user e-mail settings.
    Furthermore, we use LDAP and Kerberos to integrate e-mail identities with Windows
    Active Directory. Figure 3 illustrates our new e-mail system architecture and
    the subsystem interactions with existing services, which include Webmail, AD and
    SMTP gateway. The block diagrams highlighted in red are the components to be studied
    in detail.


    ![](img/48ce16a1858bf2e5a6a924045fc3a4c0_57_1.png)


    # # Building a Scalable High-Availability E-Mail System with Active Directory


    # ## A large-scale implementation of a scalable Linux e-mail system with Active
    Directory.


    Jack Chongjie Xue'
