    # 14.7 Edge Detect Filters


    The Edge Detect filters find color changes in images and highlight them. This
    creates images with sharp contour lines. Each of these filters uses a different
    method of detecting edges, and will give you a different result.


    # 14.7.1 Edge


    The first of Edge Detect filters is simply called Edge. It does a simple edge
    detection on an image. Images that have this filter applied to them will become
    dark, with light-colored lines showing the edges. The Edge filter has two detection
    options (see Figure 14.58):


    +   ** Amount (1).** The slider bar ranges from 1.0 to 10.0, but larger values
    can be entered in the box beside it. Low values will result in many bright contour
    lines, and high values will result in fewer, darker, contour lines. It is important
    to use a high enough value to get rid of noise in an image without losing real
    edges.


    +   ** Empty Spaces (2).**


    +   a. **Wrap.** Used for tile images, although with this filter works well for
    most images.


    +   b. **Smear.** Blurs the empty spaces to fill them in.


    +   c. **Black.** Put black in empty spaces. For most filters, black does not
    produce desirable results, although it tends to work well with this filter.'
  merge: -1
  pgno: 242
- img_proc: true
  md: "# 14.7.2 Laplace\n\nThe Laplace filter is another edge detect filter. It tends\
    \ to create darker images with more contrast and less color shifting. For best\
    \ results, use the Gauss IIR filter (see page 194) with a radius between 1.5 to\
    \ 5.0 before running this filter. As with the Edge filter, the image becomes dark\
    \ and the contours become light. In this filter, the contours are always one pixel\
    \ wide. In layers that contain Alpha, the contours become black, and the flat\
    \ areas become transparent. There are no options for this filter.\n\n# 14.7.3\
    \ Sobel\n\nThe Sobel filter works similarly to the Laplace filter. The contour\
    \ lines can be more than one pixel wide, so it makes thicker lines. The contour\
    \ lines will have more color to them than Laplace. The lines are usually similar\
    \ to the inverse of the original colors. There are two options available for the\
    \ Sobel filter:\n\n+   - Edge Detection. This can be applied in any of three ways:\n\
    \  - Horizontally. Applying this filter only horizontally detects horizontal edges\
    \ and ignores vertical ones.\n  - Vertically. Applying the filter only vertically\
    \ does the opposite.\n  - Both. Applying the filter both horizontally and vertically\
    \ detects all edges.\n- Keep Sign of Result. If you apply this filter in one direction\
    \ only, there is an option to keep the sign of the result. This gives the new\
    \ image an embossed look, but it will retain the colored contour lines.\n\n# 14.8\
    \ Enhance Filters\n\nThe Enhance filters all improve the look of images, especially\
    \ scanned photographs and images made from a TV capture card. These filters are\
    \ very useful as a starting point for improving the quality of an image.\n\n![](img/f2e1dc39d482e76a84057f638c7a2d3f_243_0.png)"
  merge: -1
  pgno: 243
- img_proc: true
  md: '# 14.8.1 Deinterlace


    This first filter, Deinterlace, is used to interpolate fields lost when using
    a video capture card. Sometimes, only the odd or even fields get captured by these
    cards, and this filter fills in the lost information. You will have to experiment
    to see how much the image can be improved.


    The only option here is the choice to fill odd or even fields. This must be done
    using trial and error.


    # 14.8.2 Despeckle


    This filter is perfect for removing noise, dust, or scratches from an image. If
    your image is generally noisy, you will probably want to work on the entire image,
    using a small radius. If there are particles of dust or scratches on the image,
    use selections to isolate them, and apply the filter. This filter works by splitting
    the image into specific boxes and smoothing the color range in each of them (see
    example in Figures 14.59 and 14.60).


    This is a "quick and dirty" style of filter. Although it can be very useful, there
    is no replacement for human intuition and the Clone tool. If you are serious about
    repairing a photograph, there are better techniques that can be used. Also, be
    careful with this filter, as it can cause unwanted blurring. This filter is somewhat
    complicated—the following options (see Figure 14.61) are available:


    +   Adaptive (1). This algorithm can be very useful. It attempts to automatically
    calculate the best size of box to use, and it usually helps stop blurring. Changing
    the radius can still affect the image, although not as drastically.


    +   Recursive (2). This algorithm also attempts to automatically improve the image,
    but it will add to the blurring effect.


    +   Radius (3). This is probably the most important setting. Set the radius as
    small as possible, since larger radius will cause unnecessary blurring and take
    a long time.


    +   Affected pixels. This allows you to control the pixels that are affected by
    this filter.


    +   a. If you have lighter colored scratches, lower the white threshold (4), and
    set the black threshold (5) to 0.


    +   b. If the noise on the image is dark, raise the black threshold, and set the
    white threshold to 255.'
  merge: -1
  pgno: 244
