- img_proc: true
  md: '![](img/f2e1dc39d482e76a84057f638c7a2d3f_172_0.png)


    # Font


    This is the most important part of the window. It controls the actual font to
    be placed.


    +   - Font (1). Lists the fonts available on your system.

    - Font Style (2). Select a specific style (for example, Italic or Bold) if available
    to a font.

    - Size (3). Choose the size of the font to use. Can be set to pixels or points.

    - Text entry box (4). Enter text in this box. The preview is updated automatically
    whenever a change is made to the font.


    # Font Information


    All of the information about the specific font is displayed here. Values cannot
    be changed.


    # Filter


    This menu allows you to filter out different types of fonts depending on their
    properties.


    +   - Font Types. There are three choices here: Bitmap, Scalable, and Scaled Bitmap.

    - Foundry. The manufacturer of the font.

    - Weight. Determines the boldness of the font.

    - Charset. The character set of the font: English, Greek, and so on.

    - Slant. Determines the slant of the font: Italic, Roman, or Oblique.

    - Set Width. Determines the horizontal width of the font.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Drawing Tools: The Text Tool


    +   **Spacing.** Determines the spacing between letters. C and M options stand
    for character cell and monospaced, respectively. These produce spacing similar
    to computer terminals, in which each character occupies the same amount of space.
    P stands for proportional, which allows letters to occupy different amounts of
    space.


    # Usage


    The ability to use text is somewhat lacking in the GIMP, as it is for many image-manipulation
    programs. If you are going to be doing large amounts of text processing, you may
    want to use TeX'' or another typesetting program first, import it as a PostScript
    file into the GIMP.


    If you are only inserting small amounts of text, the Text Tool should be adequate.
    To get the best results, use anti-aliasing for your fonts. Also choose fonts that
    are scalable—for example Blippo or RoostHeavy—so that your text doesn''t look
    chunky.


    > See Also Fonts (110), Resizing Layers


    | 10.7 The Ink Tool | [K] |

    | Description | The Ink tool simulates painting with a calligraphic pen. It changes
    its width depending on the speed at which the cursor is moving. If you have a
    pen tablet that includes pressure and tilt support, the width of the pen depends
    on the pressure and the tilt |

    | Options | Determines the maximum radius of the nib (brush shape). Note that
    the brush size and shape are irrelevant |

    | Sensitivity | Determines how sensitive the tool is to change. A higher sensitivity
    will produce less uniform lines |

    | Tilt Sensitivity | Determines how sensitive the tool is to the tilt of a pen
    tablet. This option is not used if the pen tool is a mouse |

    | Speed Sensitivity | This option determines how sensitive the paint applied is
    to changes. Low sensitivity means that the width of the ink changes very little.
    Higher sensitivity will give a more realistic ink tool |

    | Angle | Determines the angle offset for the nib. This option is only used if
    you have a pen tablet |'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Drawing Tools: The Ink Tool


    # Nibs


    There are three different nibs, or brush shapes, that can be used with this tool:


    +   - Round

    - Square

    - Diamond


    # Usage


    The Ink tool was originally designed to help with the development of pen tablet
    drivers for X servers. This small program has grown into an excellent tool that
    simulates real ink very well. It produces the best results when using a pen tablet,
    but it is still useful when using a mouse. To use this tool, simply draw lines
    on your image, and move the mouse at varying speeds. The faster the cursor is
    moved, the thinner the line becomes. Figure 10.13 shows some example lines drawn
    this way.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_174_0.png)


    Figure 10.13 Some sample lines drawn with the Ink tool at various sensitivities.'
  merge: -1
  pgno: 174
