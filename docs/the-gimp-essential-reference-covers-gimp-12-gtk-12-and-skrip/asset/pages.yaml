- img_proc: true
  md: '# 14

    Filters


    Filters are the basis for all of the impressive effects in the GIMP. They can
    be run as stand-alone operations, or in combination with others to create interesting
    effects. This chapter is aimed at providing objective coverage of all filters
    so that you can see the potential for each one in turn. Remember that these filters
    can be applied to a whole layer, or to a specific selection. Some filters require
    specific criteria to use them, which is why sometimes a certain filter is grayed
    out—meaning that it cannot be used with the current image. See Table 14.1 or the
    section in this chapter discussing the specific filter for its requirements.


    Some of the common effects that can be created with the GIMP are described here,
    and there are also many tutorials on the Internet that use these filters. In this
    chapter, only those filters that come with the GIMP are described. Other filters
    can be downloaded from the GIMP Plug-In Registry, but they are not discussed in
    this chapter. For information on installing plug-ins, see page 112.


    If you have any knowledge of programming in C or related languages, look at the
    source code for the plug-ins. There is a lot to learn in the source code, and
    it will give you better understanding of exactly what the filters do.


    Remember the hotkeys for shortcuts found at the top of the Filters menu: Repeat
    Last [Alt+F] and Re-show Last [Shift+Alt+F]. Repeat Last runs the filter again
    with the same settings; Re-show Last brings back the dialog box for the filter,
    where applicable.


    In most filters, scrollbars will be used for preview images. Some of these filters''
    preview windows do not use scrollbars—you’ll need to click and drag the preview
    images to see the whole image.'
  merge: -1
