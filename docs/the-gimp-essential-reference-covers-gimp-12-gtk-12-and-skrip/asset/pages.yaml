  md: '# 286 Installing GIMP: Building and Installing the GIMP


    This library can be found at http://horac.tcu.cz/aa/. The GIMP will run safely
    without it, however.


    Another common error is that the MPEG library is not found. The logfile will read
    as follows:


    ```

    /usr/bin/ld: cannot open -lmpeg: No such file or directory

    ```


    This library is also not necessary, but if you find that you need it, you can
    download the MPEG library from ftp://yorick.mni.mcgill.ca/pub/mpeg/


    If any errors occur while you are checking for the JPEG, PNG, or TIFF library,
    go back and make sure the libraries are installed correctly. If these libraries
    are not working, you won''t be able to use that type of image—that is, the GIMP
    will compile correctly, but will refuse to open those images. When you are sure
    that everything is ready, type the following:


    ```

    make

    ```


    This will take a long time (grab that cup of coffee). When it has finished compiling,
    type the following:


    ```

    make install && ldconfig

    ```


    This will install all of the binaries for the GIMP. If you downloaded the extra
    data files, unpack that archive into /usr/local/src, and change into that directory.
    Type the following:


    ```

    ./configure && make install

    ```


    This will install the extra data files into your GIMP directory.

    You now have a working copy of the GIMP!! It''s time to begin using it. It is
    not recommended to work while you are the root user, so in as a regular user.
    Start X Windows. New window managers will come with a GIMP entry on the Start
    menu. It is time to load it. If you don''t have a GIMP entry, open up an xterm
    and type the following:


    ```

    gimp

    ```


    A dialog box will pop up asking if you want to set up your GIMP directory. Click
    on the Install button. The GIMP startup screen will pop up, and then the main
    GIMP toolbar will appear.


    > A new feature in GIMP 1.2 is the GIMP-Perl scripting extension. This extension
    is beta currently, and the installation can be difficult. Adventurous users may
    want attempt installation of this, but for most people is not really necessary.
    If you do to attempt the installation, you will need to install three more packages:

    1. GTK-Perl. The latest version is 0.5121, available from ftp://ftp.gimp.org/
    pub/gtk/perl.

    2. PDL. This is available from ftp://ftp.aao.gov.au/pub/pdl1/

    3. Parse. This is available from http://www.cpan.org/modules/by-module/Parse.'
