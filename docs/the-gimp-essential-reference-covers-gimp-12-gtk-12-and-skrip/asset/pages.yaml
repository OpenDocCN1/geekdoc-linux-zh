  md: '# Script-Fu: Coffee Stain 259


    # 15.1.1 Add Bevel


    This script uses a bumpmap to create a beveling effect on a layer. It is best
    used on images that contain alpha. If it is used on a layer with no alpha, it
    will bevel the edges of the layer, which is probably not the desired effect. The
    following options are available with this script:


    +   - Thickness. This option determines the size of the bevel in pixels, ranging
    from 0 to 30.


    +   - Work On Copy. When you turn on this option, you create a new image rather
    than working on the original image.


    +   - Keep Bump Layer. This keeps the layer used for the bumpmap instead of deleting
    it. This option is useful for seeing the effect of the Add Bevel script.


    > > See Also "Bumpmap" (page 228)


    # 15.1.2 Circuit


    This script creates a layer that looks like a circuit board. It is useful for
    creating a random texture. Currently, the circuit will always be black and white.
    The Circuit script uses the following options:


    +   - Oilily Mask Size. Determines the amount of oil painting that occurs. Any
    reasonable value can be entered.


    +   - Circuit Seed. A seed number used to generate the circuit board. Note that
    this is random: Using the same seed number will not give you the same image. Any
    value can be entered.


    +   - Background. Only available if you are using a separate layer. Does not fill
    in black background; it remains transparent.


    +   - Keep Selection. When this is turned on, the selection is not deleted after
    the script is finished running.


    +   - Separate Layer. Creates a separate layer rather than drawing on the active
    layer.


    > > See Also "Oilify" (page 192) and "Maze" (page 252)


    # 15.1.3 Coffee Stain


    This is one of the more interesting scripts. It simulates coffee stains on an
    image (see Figure 15.1). It works particularly well on scanned images. The script
    uses the following options:


    +   - Stains. The number of stains that appear on the image.


    +   - Darken Only. This makes the stains look more realistic, but it works better
    on lighter images.'
  merge: -1
  pgno: 282
- img_proc: true
  md: '260 Script-Fu: Coffee Stain


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_283_0.png)


    See Also "Distress Selection" (page 271)


    # ### 15.1.4 Fuzzy Border


    This script takes a layer or selection and makes its border “fuzzy”. The edges
    of the border are slightly random, and the degree of their fuzziness can be controlled.
    This script has the following options:


    +   - **Color.** Determines the color outside the border.


    +   - **Border Size.** Determines the average width of the border in pixels. This
    is an arbitrary value, but it should not exceed half the total size of the selection
    or layer.


    +   - **Blur Border.** When turned on, this option blurs the border to make it
    more fuzzy.


    +   - **Granularity.** Determines the roughness of the border. Lower numbers result
    in rougher borders.


    +   - **Add Shadow.** This option adds a drop shadow to the border.


    +   - **Shadow-Weight.** This is only available when Shadow-Weight is turned on.
    It determines the opacity of the shadow in percentage.


    +   - **Work On Copy.** When turned on, the script will create a new image, instead
    of working on the original.


    +   - **Flatten Layers.** This toggle will flatten the image after it has finished
    creating the border.


    * With'
  merge: -1
