  md: 'In this chapter, the installation, configuration, and usage of scanners and
    pen tablets are discussed. These are useful tools to have when working in the
    GIMP. Scanners are especially useful, and they are becoming less expensive. Pen
    tablets are not as common, but they are useful tools. The mouse is not the best
    tool to use for touching images.


    # 9.1 Sane


    Sane stands for Scanner Access Now Easy. It is an open source project aimed at
    supporting as many types of scanner hardware as possible. You will need this program
    if you want to use your scanner under Linux/Unix. Currently, SCSI scanners have
    the most support, although parallel port scanners are starting to be supported.
    There are many front-ends and plug-ins available with this package. Sane''s homepage
    is located at http://www.mostang.com/sane. There is also a program called XSane
    at http://www.wolfsburg.de/~rauch/sane/sansexane.html. It can run stand-alone,
    or as a GIMP plug-in.


    The following scanner models are supported:


    | Backend Version Status Manufacturer Model Comment | Manual Page |

