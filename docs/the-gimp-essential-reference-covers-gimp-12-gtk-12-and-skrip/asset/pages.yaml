  md: '# 15

    Script-Fu


    Script-Fu is the GIMP''s own scripting language, equivalent to macros in the Windows
    world. Despite their similarities, Script-Fu is much more powerful than macros
    because it allows you to change variables and turn different effects on and off.
    The scripts included here will give you a good idea of what can be done with the
    GIMP. If you need to perform the same or similar tasks with many photos, read
    about writing your own Script-Fu on page 83. This chapter assumes you are familiar
    with all of the filters found in Chapter 14. If you are not familiar with the
    filters, you will still be able to use these scripts, but you may not understand
    how they work.


    If a script is not running properly, make sure you are using the correct settings.
    A common error is to try using a script with a font that is not installed on your
    system.


    All of the scripts in Table 15.1 are found in the <Image>/Script-Fu menu unless
    otherwise noted.


    | Script | Page | RGB | Grayscale | Indexed | Layers | Alpha |

    |---|---|---|---|---|---|--|

    | Add Bevel | 259 | y | | x | y | y |

    | Add Border | 264 | r | x | x | y | y |

