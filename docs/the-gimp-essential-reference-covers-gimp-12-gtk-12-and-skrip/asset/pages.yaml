  md: '# 120 Performance: The egcs Compiler


    There is a lot of discussion about getting the most out of your computer. In this
    chapter, instead of focusing on your computer, we''ll cover various methods of
    improving the performance of the GIMP.The techniques described here are not for
    the faint of heart. If you are new to Linux/Unix, or you do not have superuser
    access, be very careful.


    # 8.1 Compiling with Optimization


    Most people are content with the basic version of the GIMP they get in their distribution.
    What they don''t realize is that these packages are made to run on almost any
    computer. For instance, there are no optimizations for these packages to run on
    their Pentium computer. Not having optimizations on packages like the GIMP is
    a waste, because not many people run the GIMP on a 386. Some distributions, like
    Stampede, are starting to optimize for Pentiums and higher. The following sections
    outline some steps you can take to optimize the GIMP for your machine.


    # 8.1.1 The egcs Compiler


    The first step to make the GIMP run faster is to use the latest and greatest compiler.
    It is available from http://egcs.cygnus. Additional information is provided at
    http://egcs.cygnus/faq.html. These compilers can be very difficult to install,
    so it is recommended that you download the appropriate package for your distribution.
    The egcs compiler is soon to become the official GNU compiler, so it will become
    the standard compiler on newer distributions.


    In Appendix A, "Installing the GIMP," the compilation of the GIMP is described.
    When you compile the GIMP, you add in optimizations through the configure command.


    When you type the configure command, put a CFLAGS entry with the additional options
    in front of it:


    ```

    CFLAGS=" -03 " /configure - < Additional Option added here. >

    ```


    The following compiler options are available. Note that these options are available
    for every CPU:


    +   - 01. This option adds some optimizations to the code. It will not sacrifice
    any debugging information. This is not needed unless you are debugging the GIMP.


    +   - 02. This is probably the best option to use with the GIMP. It performs various
    optimizations to the code, and may increase the file size somewhat.


    +   - 03. This option performs the greatest number of optimizations. It performs
    the same optimizations as -02, plus some additional ones. Try using this optimization
    level on the GIMP. If you notice that the GIMP begins to crash after this option
    is used, recompile with -02.'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# Performance: IBM RS/6000 and PowerPC Options


    The following sections are paraphrased from the EGCS site at http:// egcs.cygnus.com/onlinedocs/goc_2.html.
    There are many different processor architectures available to users, and using
    code that is specific to your machine will give you a noticeable increase in performance.
    Note which CPU you have and optimize for it.


    # 8.1.2 Sparc Options


    The following option is available if you are using a Sparc machine. -mcpu=cpu_type


    This option sets the instruction set, register set, and instruction scheduling
    parameters for a specific machine type.


    Supported values for cpu_type are as follows:


    +   - v7

    - cypress

    - v8

    - supersarc

    - sparlite

    - hypersarc

    - sparlite86x

    - f930

    - f934

    - sparclet

    - tsc701

    - v9

    - ultrasparc


    Some cpu types are subsets of others:


    +   - v7: cypress

    - v8: supersarc, hypersarc

    - sparlite:f930, f934, sparlite86x

    - sparclet: tsc701

    - v9: ultrasparc


    # 8.1.3 IBM RS/6000 and PowerPC Options


    Although these processors are different, they share many instructions, so they
    are in the same section for compiler options.'
