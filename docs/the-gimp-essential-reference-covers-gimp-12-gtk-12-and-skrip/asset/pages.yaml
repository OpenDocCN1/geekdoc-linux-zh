    14.8.3 Destripe

    The Destripe filter is used to remove stripe patterns from a scanned photograph.
    This filter is only useful in very specific situations. With the cost of high
    quality scanners steadily dropping, hopefully the need for this filter will decline.


    Using this filter is very easy. The slider bar along the bottom controls the width
    of the stripes to be removed. Since all pictures are so different, you will have
    to experiment to find the optimal value. The Histogram button along the side will
    create a grayscale "histogram" of the image.


    14.8.4 NL

    The NL filter can be thought of as the non-linear "Swiss army knife" filter. It
    can apply various operations to scanned images to improve them, and comes with'
