    In this chapter, we will begin to examine the GIMP in more detail. You will find
    the GIMP''s interface similar to Adobe Photoshop, particularly Version 3. By the
    end of this chapter, the interface and the most rudimentary techniques should
    be familiar to you. If you have used the GIMP before, you may want to skip this
    chapter.


    # 2.1 Getting Started with the GIMP


    When you first load the GIMP, the Toolbox appears (see Figure 2.1). This is where
    you will begin to use the GIMP. After you learn the shortcuts, you won''t often
    need to use the Toolbox. Until you do, this window will be frequently accessed.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_33_0.png)


    > Figure 2.1 The GIMP Toolbox with the Rectangular Selection Tool chosen, as well
    as black and white for the colors. Note the File and Xntns menus at the top.


    The layout of the Toolbox is simple. At the top are the File (1) and Xntns (2)
    menus. These are drop-down menus with other operations inside. On the left of
    the Toolbox are the icons for the various tools (3). For more information on these
    tools, see Chapters 11, 12, and 13. The currently selected tool will be indented
    and darker than any other. By default, the Rectangular Selection Tool is chosen.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Navigating the GIMP: Creating a New Image


    You can switch tools by clicking on them. To the right of the tools are the active
    colors. The color on top is the foreground (4), and below is the background color
    (5). The active color is indented. By default, the foreground color is black and
    the background color is white. The small black and white squares to the left (6)
    reset the colors to the default black and white. The double-headed arrow to the
    right (7) swaps the foreground and background colors. This operation is also available
    via the hotkey [X]. The current brush and pattern are shown (8) at the bottom-right
    of the Toolbox.


    # 2.1.1 Creating a New Image


    Follow these steps to create a new image:


    +   1. Click on the File menu in the Toolbox.

    2. Click on New [Ctrl+N].

    3 A dialog box will appear with several options, as seen in Figure 2.2.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_34_0.png)


    Figure 2.2 The New Image dialog box.


    +   1. The first option is size (1). The height and width can be chosen independently.
    The file size based on one layer is shown here.

    2. Real size can be chosen here (2). The size depends on the resolution (3), so
    choose that first.

    3. The next choice is whether the image is going to be RGB or grayscale (4). Note
    that you cannot create a new Indexed image. Most of the time, you will want to
    create an RGB image. If you need to work in black and white, however, choose grayscale.
    (For more information on image types, see “Image Types”, page 62.)

    4. The last choice you have is the background color (5). The choices are Background,
    White, Transparent, or Foreground.

    5. Click OK at the bottom of the dialog box, and a new window will be created.'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'When the new window is created, as in Figure 2.3, you will be able to edit
    it. There are several things to notice here:


    +   - **Rulers (1).** The rulers along the sides are measured in pixels.

    - **Yellow dotted lines.** If you enlarge the window size slightly, you will see
    these dotted lines around the edges more clearly. These show the size of the layer
    you are working on. Usually the dotted lines will be the size of the image, but
    they can be resized if necessary (“Resizing Layers,” page 42).

    - **Scrollbars (2).** These appear on the sides if your image is larger than the
    window you are working in.

    - **Image Menu button (3).** This button is used in case you only have two buttons.

    - **Mask toggles (4).** These buttons switch between QuickMask and Normal mode.

    - **Cursor Position (5).** The coordinates of the cursor are shown here.

    - **Status Bar/Cancel button (6).** This shows the status of plug-ins that are
    running, and the Cancel button can abort them.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_35_0.png)


    # ## 2.1.2 Basic Drawing Techniques


    Since you have a new image open, you might as well draw in it. Select a tool in
    the Toolbar. The Pencil will be a good one, see (3) in figure 2.1. Lines are drawn
    by clicking and dragging with the mouse. (Is there a paint program that doesn’t
    work this way?) Very simple and straightforward.


    # ## 2.1.3 Color Selection


    The Color Selection dialog box is very straightforward. It has some options that
    are very useful, if not always obvious.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Navigating the GIMP: Color Selection 13


    To access the Color Selection dialog box, double-click on the foreground or background
    color ((4) in Figure 2.1) on the Toolbox.


    The Color Selection dialog box appears, as shown in Figure 2.4. There are four
    different ways of selecting color:


    +   - The GIMP method

    - Watercolor method

    - Triangle method

    - GTK method


    # 2.1.3.1 The GIMP Method


    This represents a three-dimensional color cube''. In the large window, you are
    shown the current layer of this cube for a constant hue. In the smaller vertical
    bar (1) (refer to Figure 2.4), the range of layers for different hues is shown.
    If you click and drag along this vertical bar, you will see that the hue is the
    only HSV value that changes. The two squares at the top of this dialog box show
    the current color (2) and the previous color (3). The column of sliders and numbers
    along the right side show all of the values: H for hue (4), S for saturation (5),
    V for value (6), R for red, G for green, and B for blue (7). Note that hue has
    a range from 0 to 360 degrees, and saturation and value are percentages, ranging
    from 0 to 100. R, G, and B range from 0 to 255. There is also an area where color
    can be entered as a hex triplet (8), for use with Web pages.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_36_0.png)


    Figure 2.4 The Color Selection dialog box with hue selected as the Z axis on the
    Color cube.


    > *To fully understand this, it helps to have some background on the HSV and RGB
    color models. See page 5 for more information on Color Models.'
  merge: -1
  pgno: 36
- img_proc: true
  md: "# Navigating GIMP: Color Selection\n\nBy default, hue is taken to be the Z\
    \ axis in the color cube. This means that the vertical bar displays varying hue.This\
    \ makes the saturation change along the Y axis, or vertically in the large palette.Value\
    \ displays along the X axis, or horizontally in the large palette. The color cube\
    \ can be displayed on different axes as well. To do this, click on the button\
    \ beside the option you want to use as the Z axis. For example, clicking on the\
    \ button beside saturation would display it as the Z axis. Hue would become the\
    \ Y axis, and value would remain as the X axis. Follow these steps to choose a\
    \ color:\n\n+   1. Click on the large palette to find the approximate value you\
    \ need.\n2. Fine-tune it in one of the following ways:\n   a. Use the sliders.\n\
    \   b. Enter numerical values for the desired color.\n   c. Enter a hex value\
    \ for the desired color.\n3. Click the Close button at the bottom.\n\nIf you are\
    \ unhappy with this color, click Revert to Old Color to cancel the changes.\n\n\
    # 2.1.3.2 The Watercolor Method\n\nThis method lets you choose colors by simulating\
    \ a paint palette, shown in Figure 2.5. In the large window (1), the colors available\
    \ are shown. Click with the mouse button to add color to the \"brush.\" This is\
    \ shown in the smaller preview area (2). Avoid dragging with the mouse; this can\
    \ cause some strange colors. Once you are happy with the color, click the Close\
    \ button. If you want to create more colors, click the New button. A color history\
    \ (3) is shown as well, and colors can be selected from that. The amount of paint\
    \ picked up on the brush is controlled via a slider bar (4).\n\n![](img/f2e1dc39d482e76a84057f638c7a2d3f_37_0.png)\n\
    \nFigure 2.5 The Watercolor menu."
  merge: -1
  pgno: 37
- img_proc: true
  md: '# 2.1.3.3 The Triangle Method


    The triangle menu (shown in Figure 2.6) is based on the color wheel. The color
    is chosen in the large circle (1) around the perimeter of the triangle. Then the
    specific shade of color is chosen in the triangle (2). The selected color is shown
    in the bar below (3).


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_38_0.png)


    Figure 2.6 The Triangle menu.


    # 2.1.3.4 The GTK Method


    This menu (shown in Figure 2.7) permits the GTK method of choosing colors. It
    is used in scripts (see page 257) to select colors as well. It is similar to the
    GIMP method, but the color wheel (1) is different. The large color wheel here
    represents hue and saturation. As you move circularly around the wheel, the hue
    changes from 0 degrees to 359 degrees. If you move radially along the wheel, the
    saturation changes. The purest colors are on the outside edge; the least pure
    are found near the center. The value is then chosen through the bar along the
    side (2). The new color is shown at the bottom (3). Specific colors can also be
    entered with the slider bars (4), or using keyboard input (5).


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_38_1.png)


    Figure 2.7 The GTK menu.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# 16 Navigating GIMP: Tool Options


    # 2.1.4 Tool Options


    Now that you have the basics, learning the ways the different options behind the
    tools is important. There are three different ways to get to the options for a
    specific tool:


    +   - Double-click on the tool''s icon in the Toolbox.

    - Right-click on the image to get into the Image Root menu, or click on the arrow
    in the top-left corner of the image. Go into the Dialog menu, and then click on
    Tool Options.

    - Click on the File menu in the Toolbox, go to the Dialog menu, and click on Tool
    Options.


    The same window will appear for each method. The last two methods seem like a
    waste of time, assigning a hotkey to either one of them can save time. See page
    117 on the GIMP''s hotkeys to learn how to do this for information on specific
    tool options, see Chapters 10, 11, and 12.


    # 2.1.5 Undo and Redo


    Undo and Redo are indispensable tools. The hotkey for Undo is [Ctrl+Z]; for Redo
    the hotkey is [Ctrl+R]. Memorize these. If you wish to access them from a menu,
    they are found in the <Image>/Edit menu. Because storing what the image was like
    before the undo can take up RAM, the GIMP allows you to change the levels of Undo.
    See the "Interface Settings" section on page 17.


    # 2.2 Preferences


    The GIMP is highly customizable. The first place you will encounter this is in
    the Preferences menu. It is found in either the <Toolbox>/File/Preferences or
    <Image>/File/Preferences menu.


    The following selections are available in the Preferences menu:


    +   - New File

    - Display

    - Interface

    - Environment

    - Session

    - Monitor

    - Directories'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Navigating the GIMP: Interface Settings


    # 2.2.1 New File Settings


    The defaults when creating a new file are entered here.The following options are
    available:


    +   - Default Image Size and Unit. This is entered in pixels for the bitmap size.
    The real size can be entered in various units, although inches are the most common.


    +   - Default Resolution and Unit. The default resolution is selected here. The
    unit can also be chosen, or pixels/inch is the most common.


    +   - Default Image Type. Either RGB or Grayscale can be chosen here.


    # 2.2.2 Display Settings


    In the Display section, you can change display options.The following options are
    available:


    +   - Transparency Type. Determines the color used to represent transparency.
    The following choices are:


    +   a. Light Checks


    +   b. Mid-Tone Checks


    +   c. Dark Checks


    +   d. White Only


    +   e. Gray Only


    +   f. Black Only


    +   - Check Size. The following choices are available:


    +   a. Small


    +   b. Medium


    +   c. Large


    +   - Cubic Interpolation. Used when scaling images. It is slower, but looks better.
    If you have a slower computer, leave this option off.


    # 2.2.3 Interface Settings


    The next section in the Preferences menu is the Interface. Here you have control
    of part of the user interface of the GIMP. The following options are available:


    +   - Preview Size. This determines the sizes of previews for the Layers menu
    and various plugins that use previews. Larger previews take up more CPU resources,
    and also more screen real estate, but they look better. Previews can be turned
    off to save resources.


    +   - Levels of Undo. Increasing the levels of Undo helps when editing images,
    but uses a lot more RAM. If you have a computer that lacks RAM, consider reducing
    this value.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# Navigating GIMP: Interface Settings


    +   - Recent Documents List Size. Determines the number of recent files shown
    in the File menu.


    +   - Show Tool Tips. This toggle turns tool tips on and off. Show Tool Tips causes
    a description to appear over buttons. Again, this uses system resources, and can
    be disabled.


    In the Image Window subsection, the following options are available:


    +   - Resize Window on Zoom. This causes the window to exactly fit the image size
    when you zoom in or out. If the window will be bigger than the screen, the size
    won''t change; scrollbars will be used instead.


    +   - Show Rulers. Toggles the display of rulers on and off.


    +   - Show Statusbar. Toggles display of the status bar on and off.


    +   - Speed of the “Marching Ants”. “Marching ants” is the dotted line around
    selections you have made. The number here is counter-intuitive. It represents
    the millisecond delay before they are updated. A larger number means that the
    “ants” moves more slowly.


    +   - Image Title Format. Determines how the title of the image windows appears
    in the window manager. The following options are available:


    +   a. Custom


    +   b. Standard


    +   c. Show Zoom Percentage


    +   d. Show Zoom Ratio


    +   e. Show Reversed Zoom Ratio


    +   - Perfect–Slow Pointer Tracking. This improves the method to track the cursor,
    but it is slow. This can be left turned off.


    +   - Disable Cursor Updating. Normally, the GIMP changes its cursor depending
    on what tool you are using. This option use system resources, so it can be disabled.


    # 2.2.4 Environment Settings


    The Environment section of the Preferences menu controls how the GIMP uses the
    system resources, and how it interacts with them. In this section, the following
    settings are available:


    +   - Conservative Memory Usage. When this is unchecked, the GIMP loses speed,
    but also decreases memory needed.


    +   - Tile Cache Size. This changes the amount of space the GIMP can use on the
    hard drive. When this setting is increased, it prevents the GIMP from swapping
    to disk.


    +   - Maximum Image Size. Determines the maximum size of an image the GIMP can
    deal with.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# Navigating the GIMP: Directories Settings


    +   - Install a Color Map. This is necessary when using the GIMP on an 8-bit X
    server. If this is not checked, the window manager and other programs will use
    all of the colors available to the system, and the GIMP will be useless. Installing
    a color map ensures that the GIMP has as many colors as it needs. This may make
    other programs look strange when they are not active, but it will not cause any
    harm.


    +   - Colormap Cycling. This setting is not very obvious. It disables the “marching
    ants” dotted line; in its place it uses a solid color for the selection line.


    +   - Thumbnails. Turns the writing of image previews on and off. This is useful,
    and should be turned on.


    #  2.2.5 Session Settings


    This section controls the Session Management options. The following options are
    available:


    +   - Save Window Positions on Exit. This will keep track of the windows’ positions,
    and place them in the same position when the GIMP is restarted.


    +   - Clear Saved Window Positions. This button erases the stored window positions.


    +   - Always Try to Restore Session. This toggle makes the GIMP restore the session
    when it is restarted.


    +   - Save Device Status on Exit.


    #  2.2.6 Monitor Settings


    This section controls the monitor resolution settings. You can view or set the
    monitor resolution from either of the following:


    +   - From X server. Your resolution will be listed here.


    +   - Manually. The resolution can be set manually.


    #  2.2.7 Directories Settings


    This section is very simple. It displays the locations of the various directories
    that the GIMP uses. The following directories can be changed:


    +   - Temp


    +   - Swap


    The following directories are shown in the drop-down menu and can be changed after
    clicking on the + sign:


    +   - Brushes


    +   - Gradients'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# 20 Navigating GIMP: Directories Settings


    +   - Patterns

    - Palettes

    - Plug-Ins

    - Modules


    New directories are added by clicking on the New button. A directory''s priority
    can be raised via the arrow buttons. Directories can be deleted from the list
    by clicking on the trash can.


    # 2.3 Window Operations


    In this section, the various operations for working within an image are discussed.
    The operations are very easy to learn, and they are used repeatedly. They are
    all found in the <Image>/View menu. The following window operations are discussed
    in this section:


    +   - Resizing windows

    - Zooming

    - Using rulers and guides

    - Views


    # 2.3.1 Resizing Windows


    Resizing windows is probably one of the first things to learn about working with
    large images. You must remember that not all window managers are created equally
    (see Appendix C, “Window Manager Versus the GIMP”). It is difficult to describe
    the exact process to resize a window because it is not controlled by the GIMP.
    Usually, but not always, there will be handles on the bottom corners of the window
    that can be dragged. A single line might appear previewing the size of the new
    window, or the window may seem appear automatically. If the image is larger than
    the window, use the scrollbars to move around inside the window. If you have a
    mouse with three buttons, click and drag with the middle button to pan.


    # 2.3.2 Zooming


    Zooming the image can be done several different ways. The first is with the Zoom
    tool. The second, and probably the most often used, is with the - = keys (the
    minus and equal keys), - will zoom the image out, and will zoom in pressing. The
    1 key will display the image at real size, or 100%. The zoom factor can also be
    chosen in the <Image>/View/Zoom menu. The various ratios are displayed there.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Navigating the GIMP: Views 21


    Zooming is described by ratios. 1:1 means that one screen pixel is one image pixel.
    3:1 means that the image is three times bigger. Nine (3²) represent one image
    pixel. It is best to zoom in powers of 2 (1:2, 1:1, 2:1, 4:1, and so on). Arbitrary
    numbers cannot be entered; doing so would be useless.


    # 2.3.3 Using Rulers and Guides


    Rulers and guides are extremely useful for aligning layers and selections precisely.
    They are a boon to anyone creating logos for the Web, where precision in drop
    shadows or different letters is necessary. Ruler and guide operations are found
    in the <Image>/View menu. There are several options when using rulers and guides:


    +   * Toggle Rulers On and Off ([Shift+Ctrl+R]). If you need to use every bit
    of your screen that is available, this option may be necessary.


    +   * Toggle StatusBar On and Off ([Shift+Ctrl+S]). This option turns the status
    bar if you need even more real estate.


    +   * Toggle Guides ([Shift+Ctrl+T]). Guides are horizontal or vertical lines
    on an image. Guides are placed by clicking on a ruler and dragging the cursor
    into the image. Rulers must be toggled to use them. Guides are blue dotted lines
    (normally), and they turn red when they are moved, or a selection or layer on
    them.


    +   * Snap to Guides. Guides can be toggled to have layers and selections "snap"
    to them. Snap to Guides will not work when guides are toggled off.


    # 2.3.4 Views


    There are several other miscellaneous operations in the View menu:


    +   * Toggle Selection ([Ctrl+T]). This turns the "marching ants" on and off.


    +   * Dot for Dot. When this is turned on, pixels are used as the units in the
    rulers. Turned off, the default real unit is (usually inches).


    > There is no reason why other graphics programs allow people to do this, since
    it requires the program to invent pixels to fill in areas. This is a huge waste
    of resources, and it also gives false information about an image. Zooming in powers
    of 2 makes sense because at 2:1 zoom, each pixel actually occupies four pixels
    (a 22 square) onscreen. At 4:1, each pixel occupies 16 pixels onscreen. The program
    does not need to invent false information to display the pixels.'
  merge: -1
  pgno: 44
- img_proc: true
  md: "# Navigating GIMP: Views\n\n+   * Window Info ([Shift+Ctrl+I]). This operation\
    \ displays the following information for the current image:\n  a. Dimensions of\
    \ the image in pixels and real units.\n  b. Resolution.\n  c. Default unit.\n\
    \  d. Zoom factor, or scale ratio.\n  e. Display type (RGB, Grayscale, or Indexed).\n\
    \  f. Visual class and visual depth. These are determined from the X server itself.\
    \ It describes the color depth at which it is being displayed (8 bit, 16 bit,\
    \ 24 bit, or 32 bit).\n  g. Shades of Color hasn't been implemented yet.\n* New\
    \ View. This is very useful if you are working on a very large image, such as\
    \ a scanned. photograph. This option creates another window that is an exact copy\
    \ of the existing one. Anything done to the first image will show up on the second.\
    \ This feature allows you to zoom in on one image to pixel level detail for fine\
    \ adjustments, while viewing the changes on the other, less magnified, image.\
    \ Note that changes appear only after the mouse button is released, not as the\
    \ mouse is drawing on the image.\n* Shrink Wrap ([Ctrl+E]). This shrinks the window\
    \ to fit the image exactly. If the image is larger than the screen, it will not\
    \ work.\n\n# 2.4 Creating and Editing Selections\n\nThere is much to learn about\
    \ working with selections: There are many different operations for selections.\
    \ It is best to start learning the basic selections, and then move to more complicated\
    \ ones. Once you have a firm grasp on creating complicated selections, continue\
    \ on using the more interesting operations like feathering. The techniques described\
    \ in this chapter apply to all selection tools. For more detailed information\
    \ on a specific selection tool, see page 153.\n\n# 2.4.1 Basic Selection Techniques\n\
    \nSelections in the GIMP are fairly straightforward once you learn the theory\
    \ behind them. There are two modes for selections:\n\n+   * Active Selections.\
    \ This is what happens when the selection has first created. Dragging a selection\
    \ tool (for example the Rectangular Select) will create an active selection. The\
    \ cursor then changes to the arrow although the selection tool is still active.\
    \ If you move this selection, a floating selection will be created. If you click\
    \ without moving the selection, the selection will be canceled."
  merge: -1
  pgno: 45
- img_proc: true
  md: '# Navigating the GIMP: Copying and Cutting


    **Floating Selections.** The floating selection will appear in the Layers and
    Channels menu (see "Layers and Channels," page 37). Floating selections act like
    regular layers, except that selections cannot be made inside them. Note that this
    behavior is different from that of GIMP 1.0. You can draw, erase, and even apply
    filters inside the floating selection. The floating selection will act as a regular
    layer until anchored or made into a new layer.


    You can anchor a floating selection by doing any of the following:


    +   - Click inside the floating selection area with a selection tool.

    - Click on the Anchor Layer button in Layers and Channels menu.

    - Choose Anchor from the <Image>/Layers menu (<Ctrl+HJ>).


    The floating selection can also become a new layer by itself. Just click on the
    New Layer button in the Layers and Channels menu.


    A good technique to remember is this: Whenever a slightly complicated selection
    is made, save it to a channel. This helps avoid making the same selection many
    times ("Save to Channel," page 30).


    # 2.4.2 Copying and Cutting


    Copying and cutting both are very straightforward. Copying is accomplished as
    follows:


    +   1. Make sure to activate the selection, whether it is in a layer or inside
    a floating selection.

    2. To copy something, click on <Image>/Edit/Copy ([Ctrl+C]). This will copy the
    selection to the clipboard. If you wish to copy a composition of the visible layers,
    it will be copied. Only the current layer that has the selection will be copied.
    choose <Image>/Edit/Copy Visible. This will achieve the same result as though
    you had merged the visible layers, copied the selection, and then separated them
    again ("Merging Layers," page 42).


    To cut something, follow these steps:


    +   1. Activate the selection.

    2. To cut a selection from a layer, choose <Image>/Edit/Cut ([Ctrl+X]). This will
    remove the selection from the current layer and place it in the clipboard.


    When copying and cutting with images that have transparency, be aware that only
    the parts of the image with paint on them can be selected to be copied or cut.
    Any part of the selection with transparency in it will be ignored.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# 2.4.3 Pasting


    Pasting is very straightforward as well. When there is something in the clipboard
    from copying or cutting, this item can be pasted into the image. Paste the item
    by clicking on <Image>/Edit/Paste ([Ctrl+V]). Whenever an image is pasted this,
    it becomes a floating selection. At this point, it must be anchored to the current
    layer or become a new layer.


    Another option is to use Paste Into, found in the <Image>/Edit menu. This operation
    allows you to paste into an active selection. Anything outside of this selection
    will not be visible. When Paste Into is used, a floating selection is created.
    Because of this, if you already have a floating selection, it is canceled, and
    the new pasted floating selection is created. When you use Paste Into, the new
    floating selection must always be anchored into the current layer to achieve the
    effect. If you create a new layer, all of the paste buffer will appear, not just
    inside the active selection.


    # 2.4.4 Named Selections


    If you are doing a lot of copying, cutting, and pasting, you will want to take
    advantage of the Named buffer. This allows you to name your selections so that
    you can have multiple selections. Copy Named ([Shift+Ctrl+C]), Cut Named ([Shift+Ctrl+X]),
    and Paste Named ([Shift+Ctrl+V]) are all found in the <Image>/Edit menu.


    When you use Copy or Cut Named, a window will pop up asking for the name of the
    buffer. Enter a name for this selection, and it will be saved in the Named buffer.


    When Paste Named is used, a window will pop up with the listing of everything
    in the Named buffer. Click on the Paste, Paste Into, or Paste as New button to
    insert it into the image. Click on Delete to remove the selection from the Named
    buffer.


    The last Cut or Copy Named is also placed in the regular buffer, so the regular
    Paste will work to insert it into the image.


    # 2.4.5 Advanced Selections


    Using more complicated selections can be difficult. There are many different options
    available with each mouse-click.


    For all selection tools, keystrokes and mouse-clicks must be done in this order:


    +   1. Hold the Shift and or Ctrl key(s) before clicking the mouse button.

    a. Use Shift+click to create a union between the existing selection and the new
    one (see Figure 2.8). The cursor will show a + sign at the bottom to represent
    this.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Navigating the GIMP: Advanced Selections


    b. Use Ctrl+click to leave the difference between the selections (see Figure 2.9).
    The cursor will show a - sign at the bottom to represent this.

    c. Hold down keys and click to create the intersection between the two selections
    (see Figure 2.10). The cursor will show a ∩ sign at the bottom to represent this
    (For the Bezier Select and Intelligent Scissors, this must be done while clicking
    inside the chosen area in editing mode).


    2. Click the mouse button.


    3. Release the key(s) and drag the mouse to create a selection.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_48_0.png)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_48_1.png)


    Figure 2.8 A union (Shift+click) between a rectangular selection and a circular
    one.


    Figure 2.9 A difference (Ctrl+click) between the same rectangular selection and
    a circular one.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_48_2.png)


    Figure 2.10 An intersection (Shift+Ctrl+click) between the rectangular selection
    and a circular one.


    The Rectangular and Elliptical Select (see page 154) tools also use the keys (Shift,
    Ctrl or both) to constrain the shape of the selection.


    To constrain the shape and replace current selections, follow these steps:


    +   1. Click the mouse button.

    2. Press the key (Shift or Ctrl).

    3. Drag the mouse to create the proper selection.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Navigating GIMP: Advanced Selections


    To use both effects at once, follow these steps:


    +   1. Hold down the required keys (Shift, Ctrl, or both).

    2. Click the mouse button.

    3. Release the keys.

    4. Press and hold the required keys for the constraining effect.

    5. The mouse can then be dragged for the needed selection.


    If you make a wrong selection, it is possible to cancel the selection while you
    are still dragging. Hold down the right mouse button before releasing the mouse
    button to undo the new selection, and then release the right mouse button.


    To create selections around complicated objects, it is usually best to use the
    Intelligent Scissors tool to get the general shape of the image. Once the general
    shape is selected, convert it to a Bezier curve for fine-tuning. A new feature
    in GIMP 1.2 is Paths. Paths give much greater control of Bezier curves.


    If the object is quite complicated, and has a busy background, it will probably
    be necessary to zoom in very close. Then use the Freehand Select tool with the
    Shift and Ctrl key combinations to get every pixel right. If you do not need extreme
    precision, use the <Image>/Select/Feather to smooth the transition from the border
    to the background.


    # 2.4.6 Invert


    Invert is very useful when working with complicated selections. This option inverts
    the active selection so that anything that was not selected before is selected,
    and vice versa. Invert is found in <Image>/Select, and its hotkey is [Ctrl+I].


    # 2.4.7 All and None


    All and None are very straightforward. All ([Ctrl+A]) selects the entire current
    layer. None ([Shift+Ctrl+A]) cancels any active selection. Both of these operations
    are located in the <Image>/Select menu.


    # 2.4.8 Float


    Float creates a floating selection from an active selection. This option is used
    when you need a floating selection, but do not want to move the active selection
    that has been created. If there is an existing floating selection, it is canceled,
    and the active selection replaces it as the floating selection. Float is found
    in the <Image>/Select menu, and its hotkey is [Shift+Ctrl+L].'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# 2.4.9 Sharpen


    Sharpen removes the anti-aliasing from an active selection. When an elliptical
    selection is made, it is always slightly feathered, as seen in Figure 2.11. Sharpen
    removes this, resulting in an appearance such as that in Figure 2.12. This tool
    is useful if you have feathered a selection too much, and want to start over.
    Sharpen is found in <Image>/Select, and its hotkey is [Shift+Ctrl+H].


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_50_0.png)


    Figure 2.11 A regular elliptical selection. Note the smooth edge.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_50_1.png)


    Figure 2.12 The same selection after being sharpened. Note the jagged edge.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# Navigating the GIMP: Border


    # 2.4.10 Border


    Border replaces the active selection''s outer edges with a border. A window will
    pop up asking for the border''s size. When you are using borders, you must remember
    that it takes the active selection''s edges as the center of the border. If you
    make a border 10 pixels wide as in Figure 2.13, it will go inward 10 and outward
    10 pixels. Note that this is a smooth transition. To get a sharp border, use <Image>/Select/Sharpen
    ([Shift+Ctrl+H]). Border is found in the <Image>/Select menu.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_51_0.png)


    # 2.4.11 Feather


    Feather does the opposite of sharpen. It gradually fades out a selection by a
    specific amount. This is very useful when editing scanned photographs to make
    pasted parts look more natural. It makes them fit into different backgrounds much
    more easily. Feather is found in <Image>/Select, and its hotkey is [Shift+Ctrl+F].


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_51_1.png)


    # 2.4.12 Grow and Shrink


    Grow and Shrink change the size of active selections. They do this radially, so
    rectangular selections, or others with sharp corners, will lose the defined corners
    when Grow is used. Both Grow and Shrink are found in the <Image>/Select menu.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# 2.4.13 QuickMask


    QuickMask is a new addition to the GIMP, and it makes working with selections
    much easier. The techniques here are very similar to the next section, Save to
    Channel, because that''s how it was done in the days of yore. QuickMask mode is
    simply a shortcut to using channels.


    To enter QuickMask mode, click on the red square at the bottom-left corner of
    the image window. This will place a red screen over the image that represents
    an unselected area. A selected area is chosen by using drawing tools. White paint
    represents the selected area; black paint indicates that it is not selected. Shades
    of gray represent partial selection. This mode gives very precise control over
    selections, since regular tools, filters, and scripts can be used to delicately
    feather selections.


    To return to normal mode, simply click on the square with dotted line in the lower-left
    corner of the image window, and the QuickMask will be turned into a selection.


    QuickMask is the most important part of this section on selections. It is an invaluable
    tool when creating images from scanned photographs. Look at Figures 2.15 and 2.16
    to see QuickMask in action.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_52_0.png)


    Figure 2.15 The selection mask of a Porsche.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Navigating the GIMP: Save to Channel and Channel to Selection


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_53_0.png)


    **Figure 2.16** Viewing the selection mask of a Porsche in QuickMask mode. Note
    that the background seems very dull.


    # 2.4.14 Save to Channel and Channel to Selection


    Save to Channel, and its counterpart, Channel to Selection, require some basic
    knowledge of channels. See “Channels Menu” on page 48 for more information.


    Save to Channel takes the active selection and copies it to a channel for future
    use. In the Channels menu, it is displayed as a selection mask. Black appears
    on unselected portions. Where there is white paint, the selection is fully selected.
    Shades of grey represent partial selection. This selection mask can be edited
    with regular painting tools. The color of this selection mask can be changed by
    double-clicking on the channel name in the Layers and Channels menu, then clicking
    on the color box on the right.


    When you are satisfied with the selection, right-click on the name of the selection
    mask in the Channels menu (see Figure 2.17) and choose Channel to Selection ([Ctrl+S]).
    This is one of the more advanced operations, but it becomes necessary when working
    with scanned photos. The regular selection tools do not have enough features to
    create complicated selections in order to work with photos.'
  merge: -1
  pgno: 53
- img_proc: true
  md: "# Navigating the GIMP: Clear and Fill\n\n![](img/f2e1dc39d482e76a84057f638c7a2d3f_54_0.png)\n\
    \n**Figure 2.17** Using a selection mask allows for greater control with selections.\n\
    \n# 2.4.15 Select by Color\n\nSelect by Color allows you to select regions based\
    \ on their color. The interface to select by color is easy to learn:\n\n+   -\
    \ The window that pops up a selection mask of the image.\n- Selected areas are\
    \ white, unselected areas are black, and gray areas are partially selected.\n\
    - Areas are selected by clicking on the colors in the image.\n- The fuzziness\
    \ threshold slider at the bottom determines how much color change is required\
    \ for the selection to end.\n- On the right hand side are the controls which determine\
    \ how the selection acts:\n  a. Replace\n  b. Add (union)\n  c. Subtract (difference)\n\
    \  d. Intersect\n\nHold down the Shift and/or Ctrl key(s) while clicking to override\
    \ these options.\n\n# 2.4.16 Clear and Fill\n\nClear and Fill are simple tools\
    \ for working with selections or entire layers. Clear ([Ctrl+K]) removes all paint\
    \ from a selection, or if there is no selection, the entire active layer. If there\
    \ are layers or Alpha channels, the selection becomes transparent. If there is\
    \ no Alpha channel, the selection is set to the background color. The Fill ([Ctrl+.])\
    \ operation adds paint to the current selection. The selection is always the background\
    \ color even if there are layers or an Alpha"
  merge: -1
  pgno: 54
- img_proc: true
  md: '# 32 Navigating the GIMP: Clear and Fill


    channel. Fill is therefore useless when working with a flat image without an Alpha
    channel because it has the same effect as Clear, but it has no hotkey. Clear and
    Fill are both found in the <Image>/Edit menu.


    # 2.4.17 Stroke


    Stroke is an interesting operation. It uses the current brush and foreground color
    to draw a line wherever there is a selection edge. This is useful for drawing
    simple rectangles, ellipses, and curves with the selection tools. Experiment with
    different brushes and tools, especially with different brushes and the spacing
    for them (see page 171). Interesting effects can be created using selection masks
    as well. Stroke is found in the <Image>/Edit menu.


    # 2.5 Miscellaneous Operations


    The following operations do not fit into any specific category, but they are all
    useful shortcuts. Shortcuts are abundant in the GIMP (you just need to learn how
    to use them to save time).


    # 2.5.1 Printing from the GIMP


    In the PC world, support for PostScript is rather poor, and most people do not
    have printers that support PostScript. There is a free PostScript interpreter,
    GhostScript, which has support for most printers. Most Linux distributions come
    with this interpreter installed. This section assumes you have a PostScript printer,
    GhostScript installed and configured properly, or a PCL printer.


    Printing from the GIMP is fairly straightforward:


    +   Click on <Image>/File/Print to get to the Print menu. There are several options
    presented in this menu. In the top-right corner is the destination for the image.
    There are two choices:


    +   File


    +   Lp (line printer)


    Detailed options for each of these are found in the Setup button to the right.
    If you have a printer supported in the Drivers section, definitely use it. You
    may be able to use additional features provided by the printer driver, such as
    resolution or media type. If you do not have a supported printer, you should use
    the generic PostScript Level 1 or 2 drivers.


    +   When using the PostScript drivers, an option is available to use a PPD (PostScript
    Printer Description) file. This allows you to include specific instructions for
    your printer. If you have a PostScript printer, you can obtain the PPD file in
    any of the following ways:'
  merge: -1
  pgno: 55
- img_proc: true
