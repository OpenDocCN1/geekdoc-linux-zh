  md: '# Function Reference for Scripts: gimp_image_floating_selection


    # D.1.10 gimp_image_floating_selection


    Description This procedure returns the image''s floating_sel, if it exists. If
    it doesn''t exist, -1 is returned as the layer ID.


    Table D.10 gimp_image_floating_selection Variables

    | Variable Name | Type | Description |

    | --- | --- | --- |

    | floating_sel | PDB_LAYER | The image''s floating selection |

    | image | PDB_IMAGE | The image |


    # D.1.11 gimp_image_flatten


    Description This procedure flattens all visible layers into a single layer; it
    combines the visible layers in a manner analogous to merging with the ClipTo merge
    type. Non-visible layers are discarded, and the resulting image is stripped of
    its Alpha channel.


    Table D.11 gimp_image_flatten Variables

    | Variable Name | Type | Description |

    | --- | --- | --- |

    | image | PDB_IMAGE | The image |

    | layer | PDB_LAYER | The resulting layer |


    # D.1.12 gimp_selection_all


    Description This procedure sets the selection mask to completely encompass the
    image. Every pixel in the selection channel is set to 255.


    Table D.12 gimp_selection_all Variable

    | Variable Name | Type | Description |

    | --- | --- | --- |

    | image | PDB_IMAGE | The image |


    # D.1.13 gimp_layer_copy


    Description This procedure copies the specified layer and returns the copy. The
    newly copied layer is for use within the original layer''s image. It should not
    be subsequently added to any other image. The copied layer can optionally have
    an added Alpha channel. This is useful if the background layer in an image is
    being copied and added to the same image.'
