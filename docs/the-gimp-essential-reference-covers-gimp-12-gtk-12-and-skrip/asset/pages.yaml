- img_proc: true
  md: "# 48 Layers and Channels: Layer Masks\n\nOnce you have a satisfactory layer\
    \ mask, it can be applied. When a layer mask applied, it adds the Alpha channel\
    \ to the image and is then deleted. Any information outside the visible area is\
    \ lost. If you are unhappy with the layer mask, it can be discarded.\n\nTo apply\
    \ or discard a layer mask:\n\n+   1. Right-click on the layer name or thumbnail.\n\
    2. Click on Apply Layer Mask.\n3. Apply or discard the layer mask.\n   a. To apply\
    \ the layer mask, click on the Apply button.\n   b. To discard the layer mask,\
    \ click the Discard button.\n\n# 3.3 The Channels Window\n\nThe Channels window\
    \ is a part of the Layers and Channels window. It has two main uses:\n\n+   *\
    \ Editing specific color channels. This is used for working in certain color channels\
    \ only. It is very useful for restoring scanned photographs or adding artistic\
    \ effects to images.\n* Editing selection masks. This is similar to layer masks,\
    \ but these deal with selections instead of opacity. This is also very useful\
    \ in working with scanned photographs.\n\n# 3.3.1 Working in Specific Channels\n\
    \nThe advantage to using channels is that you can edit and view them independently.\
    \ To view individual channels, click on the eyeball beside the channel. Working\
    \ in individual channels is also very easy to do. Selected channels are highlighted\
    \ in blue. To select or deselect a channel, simply click on it near the thumbnail\
    \ or channel name.\n\nThere are two modes for working with channels:\n\n+   *\
    \ RGB Channels. In this mode, any combination of the Red, Green, or Blue channels\
    \ can be selected. Note that these control the channels in the active layer that\
    \ is highlighted in the Layers menu.\n* Selection Mask. In this mode, only one\
    \ selection mask can be selected. There are no active layers in this mode. This\
    \ is for working with selections.\n\n# 3.3.2 Channel Operations\n\nThere are several\
    \ operations available when working with channels. They are only available in\
    \ the Selection Mask mode. The Channels window is pictured in Figure 3.2."
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Layers and Channels: Selection Masks


    **New Channel.** A new channel can be created by using any of the following methods:


    +   a. Right-clicking on the channel names or thumbnails and choosing New Channel

    b. Using the hotkey [Ctrl+N]

    c. Clicking on the New Channel button


    A window will appear prompting for a name, opacity, and tint. It will be initialized
    with a 50% opacity value and tint of black by default. You can change the tint
    by clicking on the colored square.


    **Raise/Lower Channel.** Channels can be raised and lowered by using any of the
    following methods:


    +   a. Right-clicking on the channel name or thumbnail, and choosing Raise Layer
    or Lower Layer

    b. By using the hotkeys [Ctrl+F] and [Ctrl+B]

    c. The icons in the Channels window


    **Duplicate Channel.** Selection mask channels can be duplicated by using any
    of the following methods:


    +   a. Right-clicking on a channel name or thumbnail, and clicking Duplicate Channel

    b. Using the hotkey [Ctrl+C]

    c. Clicking on the Duplicate Channel icon


    **Delete Channel.** Channels can be deleted by using any of the following methods:


    +   a. Right-clicking a channel name or thumbnail, and clicking Delete Channel

    b. Using the hotkey [Ctrl+X]

    c. Clicking on the Delete Channel icon


    **New Name/Opacity/Tint.** Double-click on the layer name to change its name,
    opacity, or tint. By default, new channels are initialized to 50% opacity, but
    you may want to change this. The tint is changed by clicking on the colored square
    (set to black by default).


    # 3.3.3 Selection Masks


    The main reason to use channels is to work with selection masks. These are 8-bit
    (grayscale) representations of a selection. A black pixel represents an unselected
    area. White pixels represent fully selected pixels. Shades of gray represent partial
    selections. The advantage of working with selection masks is that you can control
    the selections with a channel. Any tool, filter, or script that can affect grayscale
    images can be used on it.'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'If you have an existing selection, it can be converted to a channel with the
    Save to Channel operation (see page 30).


    There are a few useful techniques to keep in mind when working with selection
    masks:


    +   - Use fuzzy brushes and tools to create smooth selection lines.

    - Try viewing the channel and changing its opacity for more control.

    Transparent areas are selected, black areas are unselected.


    After you have edited the channel, there are two ways to convert it back to a
    selection:


    +   - Right-click a channel name or thumbnail, and click Channel to Selection.

    - Use the hotkey [Ctrl+S].'
  merge: -1
