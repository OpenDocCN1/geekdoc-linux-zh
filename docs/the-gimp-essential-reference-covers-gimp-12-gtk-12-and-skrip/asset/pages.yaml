    +   - **Opacity.** The opacity of the layer (from *0 to 100*).


    +   - **Mode.** The combination mode of the layer. (See "Modes," page 44, for
    more information.)


    The output of this function is, once again, a list, so we need to use the car
    to get the proper names.


    The next step is to add the layers we created to the image. This is done through
    the gimp-image-add-layer function. We need to add both bgLayer and baseLayer to
    the image:


    ```

    (gimp-image-add-layer img bgLayer 1)

    (gimp-image-add-layer img baseLayer 0)

    ```


    The numbers at the end of the function represent the position of the layers. 0
    is the highest layer, 1 is next, and so on.


    # 6.3.2.4 Setting Colors


    We now set the foreground and background colors. These are set with lists that
    contain three numerical values. Note that the background color is a variable,
    and the foreground color is a constant. The colors are set with the gimp-palette-set
    functions:


    ```

    (gimp-palette-set-background bgColor)

    (gimp-palette-set-foreground (0 0 100))

    ```


    # 6.3.2.5 Clearing the Background Layer


    Now that the colors are set, we need to clear the bgLayer to set its color. (If
    we did not include this step, it would just be random colors.) This is done with
    the gimp-edit-clear function:


    ```

    (gimp-edit-clear bgLayer)

    ```


    # 6.3.2.6 Editing the Base Layer


    Next, we need to deal with the baseLayer. This must be cleared to transparency,
    but there is no alpha channel in this layer. We use the gimp-layer-add-alpha function
    to do this:


    ```

    (gimp-layer-add-alpha baseLayer)

    (gimp-edit-clear baseLayer)

    ```


    # 6.3.2.7 Adding Text


    Now we must create the text used in the script. This is done with another let*
    function. It looks like this:


    ```

    (let*

    (floatText

    (car

    gimp-text-fontname img baseLayer @ @ textStuff 5 TRUE fontSize PIXELS fontType)

    ```


