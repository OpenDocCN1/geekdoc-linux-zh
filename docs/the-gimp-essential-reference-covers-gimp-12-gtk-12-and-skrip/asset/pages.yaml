    # 7.2.2 The ImageMap Plug-In


    Location <Image>/Filters/Misc/ImageMap


    A new plug-in called ImageMap is still in active development, but has been proven
    to be very useful. It creates and saves image maps for Web pages through a very
    simple point-and-click interface. As a stand-alone program, it would be very useful.
    If it is not in the current distribution of the GIMP, you must download it off
    the Internet. This is a good example for the first plug-in to install. It can
    be found at http://registry.gimp.org/. A link to the plug-in''s homepage is provided
    at the GIMP Plug-In Registry. To use this program, you will need GTK+ 1.2.x and
    GIMP 1.0.4 or 1.1.x.


    # 7.2.2.1 Installing the ImageMap Plug-In


    Follow these steps to install the plug-in:


    +   - Download the latest version from the Plug-In Registry (discussed previously).

    - Unpack the package in your home directory. This will be available to all one
    user.

    - Change into the ImageMap plug-directory.

    - Type make && install. This will install the plug-in into your ~/.gimp directory.
    You do not need to use gimtool because the ImageMap plug-in includes a Makefile.

    - Restart the GIMP. The plug-in will be found in <Image>/Filters/Misc/ImageMap.


    # 7.2.2.2 Using the ImageMap Plug-In


    ImageMap'' has a very easy-to-learn interface, shown in Figure 7:1:


    +   - In the center, the current layer is displayed (1).

    - A list of html links to the right (2).


    > *This description assumes that you have basic knowledge of ImageMaps. For more
