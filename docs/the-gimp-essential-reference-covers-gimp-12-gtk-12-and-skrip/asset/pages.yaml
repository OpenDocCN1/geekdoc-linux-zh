    # ## 14.1 Animation Filters


    The first of the filters in the GIMP are the animation-related filters. Different
    scripts can create animations, or you can create them by hand, but the usefulness
    of these filters will cause you to revisit this section often.


    # ### 14.1.1 Animation Optimize and Unoptimize


    Animation Optimize and Unoptimize are actually the same plug-in—they are just
    run in a different order. Animation Optimize applies various optimizations to
    your layered file that is going to become an animation:


    +   - compares the layers of image, and changes any repeated pixels to transparency.
    This saves a lot of space when saving the animation as a GIF file. The optimization
    that is going to improve your animation is the addition of transparency.

    - Resizes layers to remove any unnecessary transparency. The amount of optimization
    that occurs depends on the type of image, the number of colors, and the complexity
    of the animation.


    Animation Optimize is run as the second to last operation on an image that is
    going to become an animation. The last operation is to convert the image to Indexed,
    so that it can be saved as a GIF file. Note that Animation Optimize applies a
    Threshold Alpha to the layers, so when you convert the image to Indexed, there
    should be little change regarding transparency. It does not adjust colors at all;
    this is left up to you you convert the image to Indexed.


    Animation Unoptimize undoes the optimization of an animation. Editing images that
    have been optimized is difficult because it is hard to visualize how the changes
    are going to affect the image. This filter aids in adding the pixels that were
    removed by Animation Optimize. The layer sizes are all resized to the image size
    as well. It does not improve the “look” of the transparency of an image, but it
    makes the editing of the animation much easier.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# 14.1.2 Animation Playback


    The Animation Playback filter is very simple. It does not make any changes to
    your image—it is just for reviewing animations that you have created. The interface
    (see Figure 14.1) is straightforward. Along the top is a status bar that shows
    which frame is being displayed. Below the status bar are the control buttons:


    +   - Play/Stop (1). Toggles the animation on or off.

    - Rewind (2). Brings you back to the beginning of the animation.

    - Step (3). Advances the animation frame by frame.


    When you are done previewing your animation, click the Close button (4) at the
    bottom of the window.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_210_0.png)


    Figure 14.1 The Animation Playback window displaying a simple animation.


    # 14.1.3 Filter All Layers


    Filter All Layers is useful for creating many different animations using plug-ins
    that are installed. It applies to every layer and any plug-in available to the
    GIMP. Filter All Layers can apply the plug-in with constant values, which would
    make a boring animation, or with varying values. There is no limit to what this
    filter can do. The only drawback to this filter is that it does not allow you
    to choose which layers are filtered: The beginning frame will always be affected.


    +   - The first step to this filter is to choose the plug-in that is going to
    be used. Simply click on the plug-in name (1), as shown in Figure 14.2.'
  merge: -1
  pgno: 210
- img_proc: true
