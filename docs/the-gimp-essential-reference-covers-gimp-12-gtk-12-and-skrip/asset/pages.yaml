    # D.1 Script Reference


    # D.1.1 gimp_drawable_get_pixel


    Description This procedure gets the pixel value at the specified coordinates.
    The num_channels argument must always be equal to the bytes-per-pixel value for
    the specified drawable.


    | Variable Name | Type | Description |

    |---|---|---|

    | drawable | PDB_DRAWABLE | The drawable |

    | num_channels | PDB_INT32 | The number of channels for the pixel |

    | pixel | PDB_INT8ARRAY | The pixel value |

    | x coordinate | PDB_INT32 | The x coordinate |

    | y coordinate | PDB_INT32 | The y coordinate |'
  merge: -1
