- img_proc: true
  md: "# 34 Navigating GIMP: Mailing Images from the GIMP\n\n# 2.5.2 Mailing Images\
    \ from the GIMP\n\nIf you are not going to be printing your image from home, or\
    \ you need to send it to a client, the Mail Image plug-in is very useful and easy\
    \ to use. It assumes you have a working Internet connection and email setup on\
    \ your system. The email address of the person is entered in the To field. A subject\
    \ can be entered as well. A brief comment can be entered if needed. The filename\
    \ is important. The GIMP automatically converts the image depending on the filename.\
    \ Be careful when you are using this feature: If the save fails, you will end\
    \ sending a blank email. Make sure the image type is correct for the format, and\
    \ that you have flattened or merged the layers as needed. The last option is the\
    \ format in which send the attachment. MIME is the best, but if the recipient\
    \ has an older email program, you may have to use uencoding. This plug-in is found\
    \ in <Image>/File/Mail Image.\n\n# 2.5.3 Taking Screenshots\n\nScreenshots can\
    \ be very useful, especially if you are writing a book about an image manipulation\
    \ program. It is entirely possible that there are other uses for it as well. The\
    \ Screenshot tool is found in <Toolbox>/File/Acquire/Screenshot.\n\nThere are\
    \ two main choices for taking a screenshot:\n\n+   - Grab a window\n- Grab the\
    \ whole screen.\n\nIf you are taking a screenshot only of a specific window, you\
    \ also have the option of not including decorations. Decorations are anything\
    \ the window manager has added, such as a toolbar or handles for resizing the\
    \ window. When taking full screenshots, it can be useful to show a menu's contents.\
    \ The delay allows this to take place. It can be set to whatever is needed.\n\n\
    To take a screenshot: then click Grab.\n\n+   1. Select the options you need,\
    \ then click Grab.\n   a. If you are grabbing a single window, click on the Grab\
    \ button you want.\n   b. If you are taking a full screenshot, click on the Grab,\
    \ and the window will disappear. Now you have time to adjust the screen as needed.\n\
    2. With all screenshots, it will beep twice before taking the screenshot, and\
    \ then the new image will appear. Note that the mouse cursor is not shown when\
    \ taking screenshots.\n\n> > you encounter any problems with colors distorting\
    \ in screenshots, try running your X server at a different bit depth with this\
    \ command:startx --bpp 16\nSome older distributions have problems with 24bpp screenshots."
  merge: -1
