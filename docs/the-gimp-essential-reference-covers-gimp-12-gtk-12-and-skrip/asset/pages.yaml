  md: '# Writing Your Own Script-Fu: Writing a Basic Script 91


    **■ Image type.** Determines the type of the image that can use the script.

    Some plug-ins cannot use certain image types, so this is used to avoid errors.

    The following types are available:


    +   a. RGB

    b. RGBA

    c. GRAY

    d. GRAYA

    e. INDEXED

    ff. INDEXEDA

    g. Asterisks can be used as wildcards (such as in RGB\*)


    The rest of the parameters in the script-fu-register function determine thendefault
