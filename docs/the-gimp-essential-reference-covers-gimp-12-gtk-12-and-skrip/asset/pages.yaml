  md: '# Function Reference for Scripts: gimp_display_new 331


    # D.1.81 gimp_layer_new


    Description This procedure creates a new layer with the specified width, height,
    and type. Name, opacity, and mode are also supplied parameters. The new layer
    still needs to be added to the image, as this is not automatic. Add the new layer
    with the gimp_image_add_layer command. Other attributes such as layer masks and
    offsets will be set with explicit procedure calls.


    | Table D.81 gimp_layer_new Variables |

    | Variable Name | Type | Description |

    | --- | --- | --- |

    | height | PDB_INT32 | The layer height (height > 0) |

    | image | PDB_IMAGE | The image to which to add the layer |

    | layer | PDB_LAYER | The newly created |

    | mode | PDB_INT32 | The layer combination modes: NORMAL (0), DISSOLVE (1), MULTIPLY
    (3), SCREEN (4), OVERLAY (5), DIFFERENCE (6), ADDITION (7), SUBTRACT (8), DAREN
    (9), ONLY (10), HUE (11), SATURATION (12), COLOR (13), VALUE (14) |

    | name | PDB_STRING | The layer name |

    | opacity | PDB_FLOAT | The layer opacity: (0 <= opacity <= 100) |

    | type | PDB_INT32 | The layer types: RGB_IMAGE (0), RGBA_IMAGE (1), GRAY_IMAGE
    (2), GRAYA_IMAGE (3), INDEXED_IMAGE (4), INDEXEDA_IMAGE (5) |

    | width | PDB_INT32 | The layer width: (width > 0) |


    # D.1.82 gimp_display_new


    Description Creates a new display for the specified image. If the image already
    has a display, another is added. Multiple displays are handled transparently by
    the GIMP. The newly created display is returned and can be subsequently destroyed
    with a call to gimp_display_delete. This procedure makes sense only for use with
    the GIMP UI.'
  merge: -1
