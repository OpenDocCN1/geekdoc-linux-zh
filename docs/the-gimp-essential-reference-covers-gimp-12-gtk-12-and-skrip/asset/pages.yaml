- img_proc: true
  md: 'Layers and channels are very important in the GIMP for doing more advanced
    image processing. If you have worked with other graphics programs, you may be
    familiar with the concepts of layers and channels. If you are not familiar with
    these simple concepts, by the end of this chapter you will be able to work with
    them easily.


    Layers work like pieces of painted glass being laid on top of one another. They
    can contain transparent layers, opaque areas, and semi-transparent layers. With
    fully opaque layers, you will only see the top layer. With transparent layers,
    you will be able to see through to the next layers, until there is an opaque section
    you cannot see through. With semi-transparent layers, you will see a combination
    of the layers, like looking through colored glass.


    Channels represent the color components of an image. They are 8-bit "layers."
    Because each channel is 8 bits, that means that there are 256 possible shades
    in each channel. The following list details the types of channels that the GIMP
    utilizes:


    +   - RGB. These images have all Red, Green, and Blue channels. Therefore there
    are 16.8 million (256 × 256 × 256) possible color combinations.

    - Grayscale. These images have only one channel. This means there is a maximum
    of 256 shades of gray.

    - Indexed. These images work slightly differently.They only have one channel,
    so there is a maximum of 256 colors, but they can be taken from any of the 16.8
    million possible colors.

    - Selection Masks/QuickMask. These are newer types of channels. Selection Masks
    are used to save complicated selections.They allow you to work with selections
    using the drawing tools found in the Toolbox.


    # 3.1 The Layers Window and Channels Window


    The first thing we will cover in this chapter is the layout of the Layers Window
    and Channels window. If you have used Photoshop before, this will be very familiar
    to you.


    # 3.1.1 Layout of the Layers Window


    Location <Image>/Layers menu


    The layout of this menu (see Figure 3.1) is fairly simple. At the top, the name
    and thumbnail of the image are shown (1). These two double as a drop-down box
    for selecting images. The Auto button (2) will automatically display any changes
    made to a layer. If this is left off, the thumbnails will not be updated. Next,
    the mode of the layer is shown (3). More information about modes is provided on
    page 44.'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'There is a Keep Transparent button (4), and an Opacity slider bar (5). For
    more information about transparency, see page 46. In the middle of the window,
    all the layers are shown. The eyeball icons (6) mean that the layer is currently
    visible. Layer masks (see page 47) are shown to the right of the layers (7). The
    cross icons (8) mean that the layer is linked for moving (see page 41). Along
    the bottom of this window are the icons for editing layers (9). The currently
    selected layer is highlighted in blue (10).


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_62_0.png)


    Figure 3.1 The Layers window.


    # 3.1.2 Layout of the Channels Window


    The Channels notebook page (see Figure 3.2) is accessed by clicking on the Channels
    tab (1) in the Layers and Channels window. If you are working on an RGB image,
    each color channel is shown here (2). Again, the eyeball icon (3) represents that
    the channel is being shown. Any additional channels that have been created displayed
    here (4). The icons along the bottom (5) are for creating, deleting, or moving
    these channels.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_62_1.png)


    Figure 3.2 The Channels window.'
  merge: -1
  pgno: 62
- img_proc: true
  md: '40 Layers and Channels: Viewing Individual Layers


    # 3.2 Layer Operations


    The operations found in this menu are extremely useful for working on any type
    of image. It is very helpful to know all the options in this menu. The layer to
    be edited is selected by clicking on the thumbnail of the image. It will then
    be highlighted in blue.


    # 3.2.1 Viewing Individual Layers


    A useful operation in the Layers menu (see Figure 3.3) is the ability to view
    certain layers and hide others. You can do this by clicking on the eyeball icons.
    Any combinations of layers can be turned on and off. Note that changing a layer''s
    visibility does not change which layer is currently selected. If you have many
    layers, and only want to view a specific one, hold down the Shift key while clicking
    the eyeball icon. All other layers will be hidden. To show them all again, just
    hold down the Shift key and click the eyeball again.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_63_0.png)


    Figure 3.3 The Layers window.


    # 3.2.2 Adding and Deleting Layers


    Once you begin to get into more complicated image manipulation, you will want
    to add and delete layers as you work.


    # 3.2.2.1 Adding Layers


    There are several different methods you can use to add a layer:


    +   - Click on the New Layer icon (1).

    - Right-click on the layer name or thumbnail, and choose New Layer (2).

    - Press the hotkey [Ctrl+N] when the Layers window is active.'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'When you have chosen one of the three preceding methods to add a layer, a new
    window similar to Figure 3.4 will pop up. This presents several options for the
    new layer:


    +   - Layer Name

    - Layer Width

    - Layer Height

    - Units. This is especially useful to use the percentage of the image size.

    - Layer Fill Type. This determines what paint is used to fill the layer.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_64_0.png)


    Figure 3.4 The New Layer menu.


    # 3.2.2.2 Deleting Layers


    Deleting layers is much simpler than adding layers. You can do either of the following:


    +   - Right-click on the layer name or thumbnail, and choose Delete Layer.

    - Press the hotkey [Ctrl+X] while the Layers window is active.


    # 3.2.3 Moving Layers


    When dealing with multiple layers, it is often necessary to move them. This is
    done via the Move tool, simply clicking and dragging them. The outline of the
    layer is shown with a yellow and black dotted line. This operation is straightforward
    unless you are dealing with transparency.


    When moving a layer with transparency, you must click on areas that contain paint.
    Paint on a specific area is indicated by the cursor becoming a cross like the
    Move tool''s icon. If you do not click on an area with paint, the next layer that
    contains paint will be selected and moved. When this is going to happen, the cursor
    turns into a hand icon. If there are no layers containing paint in that position,
    the cursor becomes an arrow. If you hold down the Shift key while clicking with
    the next layer, it will force a move of the active layer, rather than choosing
    the next layer with paint.


    Guides can be used to precisely align layers. See page 21 for more information.'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# 3.2.4 Resizing and Scaling Layers


    The ability to resize and scale layers gives very precise control over the alignment
    of combinations of layers. These operations are very similar to resizing and scaling
    the entire image (see pages 65 and 66). Resizing a layer only operates on an image''s
    borders. The contents do not change, so parts could be cut off. Scaling a layer
    actually changes the contents of the layer.


    To resize a layer, follow these steps:


    +   1. Right-click on the layer name or thumbnail.

    2. Click on Resize Layer [Ctrl+R] when the Layers window is active.

    3. Enter the new parameters for the layer:


    +   - New Width

    - New Height

    - Units

    - X ratio

    - Y ratio

    - X offset

    - Y offset


    The X and Y offset can also be controlled by clicking and dragging the box with
    the mouse.


    +   4. Click OK.


    To scale a layer, follow these steps:


    +   1. Right-click on the layer name or thumbnail.

    2. Click on Scale Layer [Ctrl+S] when the Layers window is active.

    3. Enter the new parameters for the layer:


    +   - New Width

    - New Height

    - Units

    - X ratio

    - Y ratio


    +   4. Click OK.


    # 3.2.5 Merging Layers


    Merging layers is useful when you are ready to put together your final product.
    Merge Visible Layers takes two or more layers that are visible (with the eye icon)
    and merges them into one. This technique is used when you have many layers that
    need to be consolidated, but you do not want to make a single-layer image'
  merge: -1
  pgno: 65
- img_proc: true
  md: '# Layers and Channels: Flattening Images


    because more work may be needed. This is the operation to use if you are making

    a GIF animation, or an image with transparency. When you choose to merge\visible
    layers, a window pops up that determines the size of the new layer.

    There are several ways to access the Merge Visible Layers operation:


    +   - Right-click on the layer name or thumbnail, and choose Merge Visible Layers.

    - Click on <Image>/Layers/Merge Visible Layers.

    - Press the hotkey [Ctrl+M] when the image or the Layers window is active.


    The following choices are available for merging:


    +   - Expanded as Necessary. This option creates a layer just large enough to\contain
    all of the merged layers.

    - Clipped to Image. This creates a layer big enough to contain all parts of

    the, as long as they are inside the image borders.

    - Clipped to Bottom Layer. This choice constrains the new layer size to

    the bottommost layer that is being merged.


    # 3.2.5.1 Merge Down


    A new feature in GIMP 1.2, Merge Down merges the active layer with the

    immediately below it.


    There are several ways to access the Merge Down operation:


    +   - Right-click on the layer name or thumbnail, and choose Merge Down.

    - Press the hotkey [Shift+Ctrl+M] when the image or the Layers window is

    active.


    # 3.2.6 Flattening Images


    Flattening images will be one of the last steps of completing an image. This

    operation takes all of the image''s layers and merges them into one final layer.

    It you to get rid of Alpha in your image, this is the way to do it''. If you

    hot have an opaque background, the current background color will be used.

    Flattening an image can be done in one of two ways:


    +   - Right-click on the layer name or thumbnail, and click Flatten Image.

    - Click on <Image>/Layers/Flatten Image.


    > ¹ Most formats do not support layers or alpha, including JPEGs. Flattening the
    image is necessary to

    save images in these formats.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# 3.2.7 Modes


    Previously, when layers have been described, there has been no mention of modes.
    Layers were simply described as slides stacking on top of each other. This definition
    was used because the layers were using the default setting, Normal mode. There
    are many other modes as well, and they do not apply solely to layers. Paint can
    work this way as well, as seen in the Brushes dialog box (see page 172).


    There are many modes available:


    +   - Normal

    - Dissolve

    - Behind

    - Multiply

    - Divide

    - Screen

    - Overlay

    - Difference

    - Addition

    - Subtract

    - Darken Only

    - Lighten Only

    - Hue

    - Saturation

    - Color

    - Value


    # 3.2.7.1 Normal


    This is the default mode. As previously described, it acts as if each layer is
    a piece of painted glass. If the paint is fully opaque, nothing below is it. If
    it is partially opaque, the paint on the layers underneath are shown.


    # 3.2.7.2 Dissolve


    Dissolve mode uses transparency to create its effect. It acts similarly to normal
    mode in fully opaque areas, but in semi-transparent areas, it uses a noise effect.
    In fully opaque areas, pixels are fully opaque. In semi-transparent areas, pixels
    are either fully transparent or fully opaque. This makes the layer look spotty
    and of low quality.


    # 3.2.7.3 Behind


    Behind mode can only place paint on transparent areas, giving the illusion of
    painting behind the existing paint on the layer. Semi-transparent areas combine
    normally.


    # 3.2.7.4 Multiply


    In Multiply mode, the pixel color combines to decrease the brightness of the paint
    below. This acts like two slides being projected through the same machine. Any
    black pixels in Multiply mode become fully opaque, and white pixels become fully
    transparent. Bright colors will affect pixels slightly, and dark colors will affect
    pixels more. This attribute of the Multiply mode makes it perfect for creating
    delicate shadows.


    # 3.2.7.5 Divide


    Divide mode works similarly to the Dodge tool. Mathematically speaking, each color
    value in the bottom channel is multiplied by 256, then divided by the value for
    the top layer. This means that black or very dark pixels in the top layer will
    set'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# Layers and Channels: Modes 45


    the color to white. White or very light paint in the top layer will not effect
    the image. Grey pixels will lighten the color below.


    # 3.2.7.6 Screen


    Screen is the opposite of Multiply. It bleaches the image, and always makes it
    brighter than the original image. This is analogous to aiming two slide projectors
    at the same point. Any black pixels become fully transparent, and white pixels
    become fully opaque. This mode is well suited for creating reflection effects.


    # 3.2.7.7 Overlay


    Overlay emphasizes shadows and highlights in an image. Black pixels will affect
    shadow areas by making them darker. White pixels will affect highlight areas by
    making them brighter. Midtone areas are tinted with the paint color. Overlay works
    well for superimposing text on images.


    # 3.2.7.8 Difference


    Difference mode can produce some dramatic results. It compares the brightness
    of the pixels in the image. The resulting pixel is the absolute value of the difference
    between the two pixels. For example, if you have a pixel that is R:80 G:96 B:255
    (light blue) on top of a R:255 G:100 B:100 (light red) pixel, the result would
    be |(80-255)|=175 |(96-100)|=4 |(255-100)|=155, or purple.


    # 3.2.7.9 Addition


    Addition adds the RGB values of the two layers together, to a maximum of 255 for
    each channel. This means that black pixels have no effect on the image (transparent),
    and white pixels are fully opaque. This is similar to Screen mode, but Addition
    depends more on the lower layer.


    # 3.2.7.10 Subtract


    Subtract is the opposite of Addition. It subtracts the RGB values of the upper
    layer from the lower layer. This means that black pixels behave as if they are
    transparent, but white pixels behave like they are any. Any colors on the upper
    layer tint the lower layer with their complementary color.


    # 3.2.7.11 Darken Only


    This mode will only affect the lower layer when the pixels in the upper layer
    are darker. This means that white pixels are normally transparent (very few images
    have perfectly white pixels), and black pixels are fully opaque. This effect is
    achieved by comparing the values in each RGB channel, and using the smaller values
    for the pixel.'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# 3.2.7.12 Lighten Only


    Lighten Only is the opposite of Darken Only. This affects pixels on the lower
    layer that are lighter than those of the upper layer. This means that white pixels
    are opaque and black pixels are transparent. Darker colors won''t affect the image
    unless it is very dark. Lighter colors will be opaque. This effect is achieved
    by comparing the values in each RGB channel, and using the larger values for the
    pixel.


    # 3.2.7.13 Hue


    Hue uses the upper layer''s hue value to paint on the lower layer. This does not
    affect the saturation or value of the layer. This mode is perfect for tinting
    pictures.


    # 3.2.7.14 Saturation


    This mode affects only the saturation values of pixels. It generally affects the
    "purity" of the colors. Painting with higher saturation values enhances the base
    color of the layer. For instance, if you have an image with pastel colors and
    use a Saturation layer with high saturation values, this will make the colors
    more pure, or brighter. If you use low saturation values, it will remove the colors
    from the image, making it look more like a grayscale image.


    # 3.2.7.15 Color


    This mode affects both the hue and saturation of the lower layer. It is used to
    tint areas without affecting their brightness values.


    # 3.2.7.16 Value


    This mode affects only the value of pixels. It does not affect the color values
    at all. This mode is good for adjusting under-exposed or over-exposed areas in
    photographs.


    # 3.2.8 Transparency and Alpha Channels


    There are a few caveats when working with transparency and Alpha channels in layers.
    Consider the following:


    +   - The Opacity slider bar. This controls the opacity for the entire layer.
    If there is semi-transparent paint on the layer, it becomes more transparent.
    Opacity can range from 0 (fully transparent) to 100 (fully opaque).

    - Transparent. This toggles the transparent area between drawable and not drawable.
    If this option is turned on, you will not be able to draw transparent areas. It
    is still possible to draw on semi-transparent areas with this option. Semi-transparent
    areas will retain their Alpha values; only the color will be changed. Any area
    may be erased as usual. This option is perfect for changing the color of a text
    layer, or using the Blend tool on a shape.'
  merge: -1
  pgno: 69
- img_proc: true
  md: "# Layers and Channels: Layer Masks\n\n■ **The background layer.** This layer\
    \ is special because it cannot use transparency or layer masks until it has had\
    \ an Alpha channel added to it. However, the overall transparency can be changed\
    \ using the slider bar. Also, the background layer becomes the bottom layer until\
    \ the Alpha channel is added. If there is no Alpha channel, it cannot be raised\
    \ or lowered.\n\n# 3.2.9 Layer Masks\n\nLayer masks provide greater control over\
    \ opacity in an image. They control the opacity in a layer by representing it\
    \ as a grayscale drawable. Black areas are fully transparent and white areas are\
    \ fully opaque. Gray shades are semi-transparent. The advantage to using layer\
    \ masks is that you can use tools, filters, and scripts to control the opacity\
    \ rather than just using the eraser.\n\nTo create a layer mask, follow these steps:\n\
    \n+   1. Right-click on the layer name or thumbnail.\n2. Click on Add Layer Mask.\n\
    3. Choose one of the following options to initialize the mask:\n   a. White (Full\
    \ Opacity)\n   b. Black (Full Transparency)\n   c. Layer's Alpha Channel\n\nUsing\
    \ the layer's Alpha channel is best so that there is no confusion between the\
    \ transparency in the image layer and the transparency created by the mask.\n\n\
    Working with layer masks is straightforward. They are simple 8-bit channels that\
    \ represent the Alpha channel in the image. By default, your image will still\
    \ be shown when with the layer mask. The part that is active for drawing is represented\
    \ by a white border around its thumbnail. This way, you can easily alternate between\
    \ editing the mask or the layer. To view the layer mask and not the layer, hold\
    \ down the Alt key when clicking on the layer thumbnail. The layer mask will now\
    \ become visible, and a green border will appear around its thumbnail. If you\
    \ wish to hide the layer mask temporarily, hold down the Ctrl key when clicking\
    \ on the layer mask thumbnail. A red border will appear around it. Note that these\
    \ two modes can be on at the same time, but viewing the layer mask has higher\
    \ priority, so that is the effect that is shown.\n\nAnything can be done to a\
    \ grayscale image can be done to a layer mask. This includes applying filters\
    \ and Script-Fu. Layer masks are well suited for editing scanned photographs where\
    \ certain elements need to be cut and pasted. Make heavy use of the Airbrush and\
    \ Convolver tools here. The Blur filters can also work well here."
  merge: -1
