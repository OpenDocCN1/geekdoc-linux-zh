    # 14.5.2 Film


    The Film filter (see Figure 14.38) combines several images onto what looks like
    a piece of film. This is a quick filter, but the results can look good. The following
    options are available with this filter:


    +   - Size of the film (1). The size can be made to fit the image sizes, or the
    images can be resized to fit a specific height.

    - Color of the film (2). Dark brown is a good choice. If you want this to look
    like a negative, use a light blue and invert the image later.

    - Number the slides (3). Start from a specific number.

    - Color of numbers (4).'
  merge: -1
  pgno: 229
- img_proc: true
  md: 'Font of the numbers (5). If you do not want numbering of the images, simply
    set the number color to be the same as the film color.


    Numbers can be placed at the top of the film, at the bottom, and both (6).


    Images to be used (7). Choose the images by using the Add and Remove buttons (8)
    found under the list of images. Note that the images to be used must currently
    be open to be used.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_230_0.png)


    Figure 14.38 The options for the Film filter.


    Figure 14.39 An example image turned into film.


    # 14.6 Distortion Filters


    The filters found in the Distort bend, warp, ripple, pinch, or otherwise distort
    images. They are most useful when creating logos, or other computer-generated
    images.


    # 14.6.1 Blinds


    The first filter in the Distort menu is Blinds (see Figure 14.40). The Blinds
    filter make an image look like as if it has been pasted on Venetian blinds. This
    can be accomplished horizontally or vertically, with various sizes, and simulates
    the opening and closing of blinds. The options behind the Blinds filter are fairly
    simple:


    +   - Orientation (1). Blinds can be placed horizontally or vertically over an
    image.


    +   - Background (2). If you have layers or an Alpha channel in your image, you
    can choose to have a transparent background for the blinds—otherwise the current
    background color is used. Note that the preview will show a checkered background
    color rather than the actual layers below the background layer.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '+   ■ Displacement (3). This is the angle at which the blinds are turned. A
    displacement of 1 means that the blinds are nearly perpendicular to the viewer.
    A displacement of 90 means that they are parallel to the viewer—almost impossible
    to see.


    +   ■ Num Segments (4). The number of blinds can be changed from 1 to 10 via the
    slider bar.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_231_0.png)


    Figure 14.40 The options menu for the Blinds filter.


    # 14.6.2 Emboss


    The Emboss filter (see Figure 14.41) actually allows you to do two things: emboss
    or bumpmap an image. This creates a three-dimensional-looking image, as though
    it has been embossed in metal or another material. When you emboss an image, it
    loses the color information, but remains an RGB image. If you use bumpmap, it
    stays as a color image that looks textured. The options for Emboss are similar
    to those of the Bumpmap filter found in the Map menu (see page 228):


    +   ■ Emboss (1). This effect gives you a grayscale image.


    +   ■ Bumpmap (2). This effect gives you an RGB image.


    +   ■ Azimuth (3). This determines the angle of the “light source,” which will
    give you the its 3D effect.


    +   ■ Elevation (4). The elevation of the light source, given in degrees. This
    is analogous to the light source''s height above the horizon.


    +   ■ Depth (5). This option controls the amount of texture created. A higher
    depth creates greater contrast between the light and dark areas.'
  merge: -1
  pgno: 231
- img_proc: true
  md: '![](img/f2e1dc39d482e76a84057f638c7a2d3f_232_0.png)


    Figure 14.41 The options menu for the Emboss filter.


    # ## 14.6.3 Engrave


    The Engrave filter creates images that simulate the look of old grayscale illustrations
    (see Figures 14.42 and 14.43). The Engrave filter has only two options: Height
    and Limit Line Width. The Height slider determines the height of the lines created
    by this filter. You will get better results with low height values. The Limit
    Line Width toggle button allows you to control the line width, but engravings
    will generally look more realistic if you leave this unselected.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_232_1.png)


    Figure 14.42 An example image of a Porsche.'
  merge: -1
  pgno: 232
- img_proc: true
  md: "# 14.6.4 IWarp\n\n![](img/f2e1dc39d482e76a84057f638c7a2d3f_233_0.png)\n\nThe\
    \ IWarp filter (see Figures 14.44 through 14.47) is a program unto itself.  It\
    \ is very similar to Kai's Power Goo. This filter allows you to stretch, shrink,\
    \ grow, and swirl images. It even allows you to animate these changes. This filter\
    \ is similar to the Smudge tool (see page 169) and can produce some very pleasing\
    \ results on scanned images, especially faces. Be careful, however: It can cause\
    \ you to lose many hours playing around with it.\n\nThe IWarp filter is very complex.\
    \ The first menu, Settings (1), controls the actual image warping:\n\n+   - The\
    \ image preview is shown on the left side of the IWarp filter; this is you click\
    \ and drag with the mouse to distort the image.\n- Deform Radius (2). This slider\
    \ determines the size of the warping effect.\n- Deform Amount (3). This slider\
    \ controls the magnitude of the warping. A larger deform amount results in greater\
    \ warping.\n- The type of warping (4) is selected from a group of option buttons:\n\
    \  a. Move. This allows you to drag parts of the image around.\n  b. Remove. This\
    \ option undoes the effects of warping. While this may not seem useful, it does\
    \ help after warping large areas because you can set it to just reverse small\
    \ areas.\n  c. Grow. This enlarges areas of the image when you click on the image.\n\
    \  d. Shrink. This option shrinks an area of the image."
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Filters: lWarp 211


    +   e. Swirl CCW. This option swirls the image in a counter-clockwise direction.


    +   f. Swirl CW. This swirls the image in a clockwise direction.


    +   Reset (5). Click this button if you warp too much and want to start over again.


    +   Bilinear (6). This greatly increases the quality of the warping, but is CPU
    intensive. If you have a slower computer, consider turning this option.


    +   Adaptive Supersample (7). This option makes the warping look much better,
    but as with Bilinear, is much slower. If you have a cutting-edge computer with
    a lot of memory, definitely use this. If time is an issue, you have a slower computer,
    leave this turned off.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_234_0.png)


    Figure 14.44 The lWarp Setting menu.


    The second part of the lWarp filter is the Animation section (1). In this menu
    (see Figure 14.45), you can create animations from your warped images:


    +   Animate (2)./Animation is toggled on and off here (2).


    +   Number of frames (3). This slider bar controls the number of frames created.
    A greater number of frames results in better quality, but takes longer.


    +   Normally, the animation starts at the original image, and gradually changes
    to the distorted image. You can also choose from the following options (4):


    +   Reverse. This option starts the animation at the distorted image and gradually
    changes to the original image.


    +   Ping-Pong. This option causes the animation to bounce back and forth between
    the original and distorted images. The Ping-Pong option should be used for animations
    that repeat, such as GIFs.


    If you use Ping-Pong or Reverse for your animation, remove the original layer,
    or the animation will have a frame that is out of place.'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# 212 Filters: Page Curl


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_235_0.png)


