  md: '304 Function Reference for Scripts: gimp_floating_sel_remove


    # D.1.6 gimp_floating_sel_remove


    **Description** This procedure removes the floating selection completely, without
    any side effects. The associated drawable is then set to active.


    Table D.6 gimp_floating_sel_remove Variable

    | Variable Name | Type | Description |

    | --- | --- | --- |

    | floating_sel | PDB_LAYER | The floating selection |


    # D.1.7 gimp_brightness_contrast


    **Description** This procedure allows the brightness and contrast of the specified
    drawable to be modified. Both brightness and contrast parameters are defined between
    -127 and 127.


    Table D.7 gimp_brightness_contrast Variables

    | Variable Name | Type | Description |

    | --- | --- | --- |

    | brightness | PDB_INT32 | Brightness adjustment: (-127 <= brightness <= 127)
    |

    | contrast | PDB_INT32 | Contrast adjustment: (-127 <= contrast <= 127) |

    | drawable | PDB_DRAWABLE | The drawable |

    | image | PDB_IMAGE | The image |


    # D.1.8 gimp_text


    **Description** This tool adds text at the specified location as a floating or
    new layer. It requires font information in the form of seven parameters: size,
    foundry, family, weight, slant, set_width, spacing. The font size can be specified
    in units of pixels or points, and the appropriate metric is specified using the
    x and y parameters together control the placement of the new text by specifying
    the upper-left corner of the text bounding box. If the antialias parameter is
    non-zero, the generated text will blend smoothly with underlying layers. This
    option requires more time and memory to compute than non-aliased text; the resulting
    floating selection or layer, however, will require the same amount of memory with
    or without antialiasing. If the specified drawable parameter is valid, the text
    will be created as a floating selection attached to the drawable.'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# Function Reference for Scripts: gimp_image_get_layers 305


