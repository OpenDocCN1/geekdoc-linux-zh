  md: '# 330 Function Reference for Scripts: gimp_image_get_component_active


    # D.1.78 gimp_image_get_component_active


    Description This procedure returns information about whether the specified image
    component (such as the Red, Green, or Blue intensity channel in an RGB image)
    is active or inactive—that is, whether or not it can be modified. If the specified
    component is not valid for the image type, an error is returned.


    # D.78 gimp_image_get_component_active Variables


    | Variable Name | Type | Description |

