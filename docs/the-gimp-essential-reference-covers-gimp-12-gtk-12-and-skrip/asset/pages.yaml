- img_proc: true
  md: "# 14.6.10 Waves\n\nThe Waves filter (see Figure 14.55) makes an image look\
    \ as if it is being reflected in a pool of water after a pebble has been dropped\
    \ in it. The waves radiate from the center of the image. The size of the waves\
    \ can be precisely controlled. Moderate values are recommended for this filter;\
    \ extremely large values will distort the image beyond recognition. The Waves\
    \ filter's parameters are similar to those of the Ripple plug-in:\n\n+   - Amplitude\
    \ (1). This determines the height of the waves.\n- Phase (2). This angle is measured\
    \ in degrees, and determines where the wave is starting. For example, a phase\
    \ angle of 0 means the center wave is at full height. Increasing this angle varies\
    \ sinusoidally.\n- Wavelength (3). This slider bar adjusts the distance between\
    \ the tops of the waves. A higher wavelength means that the waves are further\
    \ apart. Higher wavelengths are recommended to keep your image recognizable.\n\
    - Wave Mode (4). The Wave modes are as follows:\n  - a. Smear. Smears between\
    \ blank spots.\n  b. Fill. F the areas with black.\n- Reflective (5). This option\
    \ makes the waves interfere with each other.\n\n![](img/f2e1dc39d482e76a84057f638c7a2d3f_241_0.png)\n\
    \nFigure 14.55 The options menu for the Waves filter.\n\n# 14.6.11 Whirl and Pinch\n\
    \nThe Whirl and Pinch filter acts similarly to the IWarp filter, but with more\
    \ precise control of the swirling. It can make an image look like it is getting\
    \ sucked into a whirlpool, or provide other interesting effects. The Whirl and\
    \ Pinch effect is controlled by three slider bars (see Figures 14.56 and 14.57):\n\
    \n+   - Whirl Angle (1). This can range from –360 degrees to 360 degrees. The\
    \ whirl angle determines how the image is “swirled”.\n- Pinch Amount (2). This\
    \ option determines how much the image is “pinched” or sucked into the center.\
    \ This can range from -1 (exploding out of the screen) to 1 (sucked into the screen).\n\
    - Radius (3). This option controls the amount of image affected. This ranges from\
    \ 0 (none of the image) to 2 (all of the image)."
  merge: -1
