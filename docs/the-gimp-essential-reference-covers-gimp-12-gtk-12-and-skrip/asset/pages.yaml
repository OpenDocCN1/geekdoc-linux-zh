- img_proc: true
  md: '# Gfig


    # 14.14.5 Gfig


    Gfig filter is used to draw various shapes with different brushes, tools, and
    colors. It is a very versatile program, and could easily stand alone as a simple
    drawing program. This is the filter to use when you need to draw objects with
    shapes like lines, circles, Bezier curves, and so on. Note that this filter does
    not work with selections—this is because Gfig uses selections to draw on the image.
    The following options are available with this:


    +   * Operations menu. This menu has a toolbar with all of the tools used for
    drawing (See Figure 14.91).


    +   a. Line. This tool draws simple straight lines. Click and drag with the mouse
    to draw them. To draw connected lines, hold down the Shift key while clicking.


    +   b. Circle. This tool draws simple circles. Click where the center of the circle
    is to be placed, and drag to set the radius.


    +   c. Ellipse. This tool works similarly to Circle.


    +   d. Curve. This tool draws partial curves, not Bezier curves. The first mouse
    click sets the first point. The next mouse click determines the highest point
    of the curve. The last mouse click sets the last point, and the curve is drawn.


    +   e. Poly. This tool creates regular polygons. The number of sides is chosen
    by double-clicking on tool''s icon. The slider allows you to roughly choose a
    value, but it is best to enter values manually here. Polygons are created like
    circles: Click for the center, and drag to define the radius.


    +   f. Star. This tool creates stars. The number of points is controlled by double-clicking
    on the Star''s icon. The size of the spikes is controlled by dragging the square
    between the center and the points.


    +   g. Spiral. This tool creates round spirals. The number of turns and the direction
    of the spiral is determined in the Spiral''s options.


    +   h. Bezier. This tool creates primitive Bezier curves. Curves are created by
    clicking on control points. When you are finished, hold down the Shift key and
    for the last control point. There are two options for this tool. The first is
    whether to create a closed or open curve. The second is to show the square frame
    when creating Bezier curves. This option is not always useful because it can clutter
    the screen with useless lines.


    +   i. With all tools, right-click and use the Snap to Grid option to constrain
    the control points to points on the grid.


    +   j. Move. Use this tool to move objects around by clicking on their control
    points. If you hold this Shift key while dragging, any objects connected to the
    one being moved will be moved as well.'
  merge: -1
