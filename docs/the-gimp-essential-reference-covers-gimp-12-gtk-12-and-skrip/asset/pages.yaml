  md: '# Window Managers and the GIMP: WindowMaker


    # ### B.2.5 IceWM


    IceWM is another lightweight window manager.The GIMP is located in the Start menu
    in Applications/Graphics/Gimp.The configuration file for the GIMP is located in
    ~/.icewm/menu. The IceWM home page is found at http://www.kiss.uni-lj.si/~k4fr@0235/icewm/


    # ### B.2.6 KDE


    KDE is another desktop environment that uses its own window manager, KWM.The GIMP
    is found in the KDE Gears menu under non-KDE Apps/Graphics/Gimp.The configuration
    file for the GIMP is found in ~/.kde/share/applk/apps/Graphic/gimp.kdelnk.The
    KDE home page is located at http://www.kde.org/


    # ### B.2.7 WindowMaker


    WindowMaker is a window manager similar to AfterStep.The GIMP is in the Root menu
    under Applications/Graphics/Gimp.The configuration file for the GIMP is found
    in ~/GNUSStep/Library/WindowMaker/menu. The Window-Maker home page is located
    at http://www.windowmaker.org.'
  merge: -1
