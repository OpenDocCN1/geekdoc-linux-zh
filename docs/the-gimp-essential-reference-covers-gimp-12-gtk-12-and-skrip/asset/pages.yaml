  md: '# 326 Function Reference for Scripts: gimp_image_enable_undo


    # D.1.67 gimp_image_enable_undo


    **Description** This procedure enables the image''s undo stack, allowing subsequent
    operations to store their undo steps. This is generally called in conjunction
    with gimp_image_disable_undo to temporarily disable an image stack.


    Table D.67 gimp_image_enable_undo Variables

    | Variable Name | Type | Description |

    | --- | --- | --- |

    | enabled | PDB_INT32 | True if the image undo has been enabled |

    | image | PDB_IMAGE | The image |


    # D.1.68 gimp_image_merge_visible_layers


    **Description** This procedure combines the visible layers into a single layer
    using the specified merge type. A merge type of EXPAND-NECARY expands the final
    layer to encompass the areas of the visible layers. A merge type of CLIP-TO-IMAGE
    clips the final layer to the extents of the image. A merge type of CLIP-TO-BOTTOM-LAYER
    clips the final layer to the size of the bottommost layer.


    Table D.68 gimp_image_merge_visible_layers Variables

    | Variable Name | Type | Description |

    | --- | --- | --- |

    | image | PDB_IMAGE | The image |

    | layer | PDB_LAYER | The resulting layer |

    | merge_type | PDB_INT32 | The merge of: EXPAND-NECARY (0), CLIP-TO-IMAGE (1),
    CLIP-TO-BOTTOM-LAYER (2) |


    # D.1.69 gimp_image_scale


    **Description** This procedure scales the image so that its new width and height
    are equal to the supplied parameters. Offsets are also provided that describe
    the position of the previous image content. No bounds checking is currently provided,
    so don''t supply parameters that are out of bounds. All channels within the image
    are scaled according to the specified parameters; includes the image selection
    mask. All layers within the image are repositioned according to the specified
    offsets.'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# Function Reference for Scripts: gimp_image_new


    | Table D.69 gimp_image_scale Variables |

    | Variable Name | Type | Description |

    | image | PDB_IMAGE | The image |

    | new_width | PDB_INT32 | New image width: (new_width > 0) |

    | new_height | PDB_INT32 | New image height: (new_height > 0) |


    # D.1.70 gimp_selection_border


    Description This procedure borders the selection. Bordering creates a selection
    that is defined along the boundary of the previous selection at every point within
    the specified radius.


    | Table D.70 gimp_selection_border Variables |

    | Variable Name | Type | Description |

    | image | PDB_IMAGE | The image |

    | radius | PDB_INT32 | The radius of border (pixels) |


    # D.1.71 gimp_image_active_drawable


    Description This procedure returns the ID of the image''s active drawable. This
    can be a layer, channel, or layer mask. The active image channel specifies the
    active drawable. If that is -1, then it is the active image layer. If the active
    image has a layer mask and the layer mask is in edit mode, then the layer mask
    is the active drawable.


    | Table D.71 gimp_image_active_drawable Variables |

    | Variable Name | Type | Description |

    | drawable | PDB_DRAWABLE | The active drawable |

    | image | PDB_IMAGE | The image |


    # D.1.72 gimp_image_new


    Description Creates a new image, undisplayed with the specified extents and type.
    A layer should be created and added before this image is displayed, or subsequent
    calls to gimp_display_new with this image as an argument will fail. Layers can
    be created using the gimp_layer_new commands. They can be added to an image using
    the gimp_image_add_layer command.'
  merge: -1
  pgno: 350
