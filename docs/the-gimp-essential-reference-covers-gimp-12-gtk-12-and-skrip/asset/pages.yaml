    # D.1.74 gimp_image_add_layer


    Description This procedure adds the specified layer to the gimage at the given
    position. If the position is specified as -1, then the layer is inserted at the
    top of the layer stack. If the layer to be added has no Alpha channel, it must
    be added at position 0. The layer type must be compatible with the image base
    type.


    # Table D.74 gimp_image_add_layer Variables


    | Variable Name | Type | Description |

    | --- | --- | --- |

    | image | PDB_IMAGE | The image |

    | layer | PDB_LAYER | The layer |

    | position | PDB_INT32 | The layer position |'
