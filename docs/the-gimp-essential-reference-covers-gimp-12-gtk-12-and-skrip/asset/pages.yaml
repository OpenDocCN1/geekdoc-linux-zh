    # 6.3.4 Using Script-Fu on an Image or Drawable


    In the previous section, creating a new image was described. In this next example,
    we will learn about making a simple script that works on an existing layer. It
    will create a new image and turn it into an animation. This animation will gradually
    fade an image from a pixel width of 1 to a maximum pixel width defined in the
    script. It is similar to the effect used in some of the Super Mario fadeouts.


    > *This script is loosely based on Sven Neumann''s waves-anim.scm script. However,
    his wacky numbering method was changed.'
