    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_271_0.png)


    After you have created an object, and you are ready to transfer it to your image,
    click on the Paint button. This will “paint” with the settings (that is, create
    selections and new layers if needed). If you are done with your “painting” and
    have saved any changed objects, click on the Done button. If you do not want to
    save your changes to the object, click the Cancel button. The Save button saves
    the current changed object. If you want to start over, click the Clear button.
    Note that this does not clear your image—only the object.'
