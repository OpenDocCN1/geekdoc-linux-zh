- img_proc: true
  md: '# Brushes, Patterns, Palettes, and Gradients: Choosing a Brush to Use


    The information in this chapter will be familiar to the experienced graphic artist.
    People new to graphics programs need to read this chapter to be able to use the
    GIMP to its full potential.


    # 13.1 Brushes


    The first part of this chapter is the most important: Brushes. You will be using
    brushes on every image in the GIMP


    Brushes are used for the following tools:


    +   - Pencil

    - Paintbrush

    - Airbrush

    - Eraser

    - Clone

    - Convolver

    - Stroke

    - Dodge/Burn


    # 13.1.1 Choosing a Brush to Use


    Menu Location <Image>/Dialogs/Brushes...


    Choosing the right brush for the job is an important skill to learn quickly. There
    are several ways to access the Brush Selection menu:


    +   - Clicking on <Image>/Dialogs/Brushes...

    - Clicking on <Toolbox>/File/Dialogs/Brushes...

    - Clicking on the displayed brush in the Toolbox

    - Using the hotkey [Shift+Ctrl+B]


    In the Brush Selection menu, there is a dialog box showing all the brushes available
    in the GIMP. See Table 13.1 for descriptions and possible uses of these brushes.
    If the brush is too big to show, click and hold with the left mouse button, and
    a larger picture will be shown. You can select brushes by clicking on them with
    the mouse. The size of the brush is shown in the top-right corner of the Brush
    menu (see Figure 13.1).


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_195_0.png)


    Figure 13.1 The Brush Selection Window.'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# Brushes, Patterns, Palettes, and Gradients: Choosing a Brush to Use


    # Table 13.1 Brushes and Their Common Uses


    | Brush Name | Description and Effect | Common Uses |

    | --- | --- | --- |

    | Calligraphic | Pen nib, hard edge | Use with Ink tool to simulate calligraphic
    pen. |

    | Regular Circle | Hard edge, rough lines | Use for detailed touch-ups. |

    | Fuzzy Circle | Soft edge, smooth lines | Use for drawing lines. Works well with
    the Eraser, Pencil, or Clone tool. |


    There are also novelty brushes provided with the GIMP, shown in Figure 13.2:


    +   - Confetti (1)

    - Diagonal Star (2)

    - GIMP logo (3)

    - Galaxy (4)

    - Property of XCF (5)

    - Sand Dunes (6)

    - Square (7)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_196_0.png)


    Figure 13.2 Examples of the various novelty brushes.'
  merge: -1
  pgno: 196
- img_proc: true
  md: "# 174 Brushes, Patterns, Palettes, and Gradients: Brush Options\n\n# 13.1.2\
    \ Brush Options\n\nThere are three options available for brushes in the GIMP (refer\
    \ to Figure 13.1):\n\n* **Opacity**. This can range from 0 (fully transparent)\
    \ to 100 (fully opaque).\n  Opacity is used to change the amount of paint on the\
    \ brush.\n* **Mode** (page 44). This allows you to select how the paint affects\
    \ the image.\n* **Spacing**. This is the distance, in percentage of the brush\
    \ size, that is moved before the brush is drawn again. When using tools like the\
    \ Pencil to draw lines, a small spacing is best. When painting with the novelty\
    \ brushes, a large spacing is best—otherwise you will just have a big mess of\
    \ paint.\n\n# 13.1.3 Creating and Editing Brushes\n\nThe GIMP allows you to create\
    \ your own brushes or edit the existing ones. Creating your own brush can be useful\
    \ if you need a \"stamp\" similar to the \"Property of XCF\" brush that you are\
    \ going to use many times. It is also useful for making custom textures to paint\
    \ or blur with.\n\nIt is fairly simple to create a brush. Just follow these steps:\n\
    \n+   1. Create a new grayscale image with a white background ([Ctrl+N]). The\
    \ size of the brush depends on the application, but generally brushes are small\
    \ (about 20x20 pixels).\n2. Set the foreground color to black.\n3. Choose a drawing\
    \ tool. Using the pencil will give you a brush with hard edges, whereas the paintbrush\
    \ or airbrush will give you soft edges.\n4. Choose a brush ([Shift+Ctrl+B]). When\
    \ working with small images it will like this, use a smaller brush.\n5. Create\
    \ your custom brush. Draw some example strokes on the image.\n6. Invert the image.\
    \ (<Image>/Image/Colors/Invert)\n7. Save ([Ctrl+S]) the image with the .gbr extension\
    \ in ~/.gimp/brushes directory.\n\nEnter the spacing and the brush name in the\
    \ dialog box. The spacing here is the default spacing that will be used when painting\
    \ with the brush. The second option is the name of the brush that shows up in\
    \ the Brush Selection menu when your brush is chosen. The brush size shown automatically—it\
    \ is the dimensions of your image.\n8. Click the Refresh button in the Brush Selection\
    \ menu to make your brush appear.\n\n> *There is also a script called Selection\
    \ to Brush that will allow you to skip the following steps."
  merge: -1
  pgno: 197
- img_proc: true
  md: '# Brushes, Patterns, Palettes, and Gradients: Creating and Editing Brushes


    There are a few things to remember when creating brushes:


    # 13.2 Patterns [Shift+Ctrl+P]


    Menu Location <Image>/Dialogs/Patterns


    Patterns are used to cover large areas with a texture. The tools that use patterns
    are the Bucket Fill and Clone tools. Some scripts in the Script-Fu menu use patterns
    as well. There are several ways to access the Pattern Selection menu:


    +   - Clicking on <Image>/Dialogs/Patterns...

    - Clicking on <Toolbox>/File/Dialogs/Patterns...

    - Clicking on the displayed pattern in the Toolbox

    - Using the hotkey [Shift+Ctrl+P]


    You can choose patterns by clicking on them in the Pattern Selection menu (see
    Figure 13.3). If a pattern is too big to display in the window, click and hold
    the mouse button and the full image will be shown. The name and size of the pattern
    will be shown in the top-right corner.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_198_0.png)


    Figure 13.3 The Pattern Selection window.'
  merge: -1
  pgno: 198
- img_proc: true
  md: "# 176 Brushes, Patterns, Palettes, and Gradients: Creating and Editing Patterns\n\
    \n# 13.2.1 Creating and Editing Patterns\n\nPatterns are just RGB or grayscale\
    \ images saved in the GIMP's pattern format. Creating your own pattern can be\
    \ very useful, especially when creating logos and other images for Web pages.\
    \ Remember to make these images tileable so that there aren't obvious seams in\
    \ the pattern.\n\nTo create your own image, follow these steps:\n\n+   1. Create\
    \ a new RGB or Grayscale image ([Ctrl+N]).\n2. Draw your new pattern.\n3. Use\
    \ the Make Seamless filter to remove any obvious seams in the image.\n4. Save\
    \ the image with the .pat format in ~/.gimp/patterns.\nThe dialog box that pops\
    \ up here has only one option. This is the name of the pattern that appears in\
    \ the Pattern Selection menu.\n5. Click the Refresh button in the Pattern Selection\
    \ menu to make your new pattern appear.\n\n# 13.3 Palettes [Ctrl+P]\n\nMenu Location\
    \ <Image>/Dialogs/Palettes\n\nPalettes are used when you want to paint in a certain\
    \ color scheme, such as pastel. It is also useful when creating an image that\
    \ is restricted in the colors it can use (page 80). There are several ways to\
    \ access the Palette menu:\n\n+   - Clicking on <Image>/Dialogs/Palettes...\n\
    - Clicking on <Toolbar>/File/Dialogs/Palettes...\n- Using the hotkey [Ctrl+P]\n\
    \nA palette in the GIMP is simply a menu with many different colors to choose\
    \ from. Palettes can be found in ~/.gimp/palettes.\n\nThe Palette Selection menu\
    \ has several options, accessed via the Edit button (shown in Figure 13:4):\n\n\
    +   - Edit. Click this button to see a menu for performing operations on the palettes\
    \ available.\n  a. New creates a palette to use.\n  b. Delete removes the current\
    \ palette from the ~/.gimp/palettes directory.\n  c. Right-clicking on a specific\
    \ color allows you to edit, delete, or add a new color.\n\n> * Note if you delete\
    \ a palette in your ~/.gimp/palettes directory, you must copy it from <Gimp Directory>/Palettes\
    \ to get it back."
  merge: -1
  pgno: 199
- img_proc: true
  md: '# Brushes, Patterns, Palettes, and Gradients: Creating and Editing Palettes


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_200_0.png)


    To use a color in the palette, simply click on it in the Palette menu, and it
    will be

    set to the currently selected color (foreground or background).


    The following palettes are available on a stock GIMP install:


