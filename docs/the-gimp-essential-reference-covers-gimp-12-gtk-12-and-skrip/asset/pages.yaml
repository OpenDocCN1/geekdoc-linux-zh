  md: "# 104 Writing Your Own Script-Fu: Using Script-Fu on an Image or Drawable\n\
    \nWe will do this in several steps:\n\n+   1. Copy the image to a new one.\n2.\
    \ While the number of frames left is greater than one, loop:\n   a. Copy the base\
    \ layer.\n   b. Rename it to the number of frames left.\n   c. Pixelize a certain\
    \ amount.\n   d. Decrease the number of frames and the pixelization amount.\n\
    3. Rename the base layer as Frame 1.\n4. Clean up.\n\nIt will take only two variables:\n\
    \n+   * Maximum Pixelization\n* Number of Frames\n\n# 6.3.4.1 Defining the Function\n\
    \nThe first step in writing the script is to create the define function and the\
    \ script-fu-register function:\n\n```\n(define script-fu-pixel-anim img drawable\
    \ maxPixel totalFrames)\n\n(script-fu-register \"script-fu-pixel-anim\"\n  \"\
    <Image>/Script-Fu/Animators/Pixelate\"\n  \"Pixelize an image Super Mario Style\"\
    \n  \"Alex Harford (alexh@edowco.com)\"\n  \"Copyright 1999 Alex Harford\"\n \
    \ \"July 21, 1999\"\n  \"RGB RGBA GRAY GRAYA\" @\n  SF-IMAGE \"Image\" @\n  SF-DRAWABLE\
    \ \"Drawable\" \"Max Pixelization\" (10 1 100 1 10 0 0)\n  SF-ADJUSTMENT \"Number\
    \ of Frames\" (10 1 100 1 10 0 1))\n```\n\nNote that there are two extra variables\
    \ here: img and drawable. These are automatically passed to the script by the\
    \ GIMP because they are applied to a specific drawable on a specific image. This\
    \ is always used when writing a script that affects an existing image. Also note\
    \ the location of this filter: <Image>/Script-Fu/Animators/Pixelate. Generally,\
    \ scripts that work on existing images are placed in the <Image>/Script-Fu section.\n\
    \n# 6.3.4.2 Assigning Variables\n\nNow that there is a skeleton in place for the\
    \ script, we can begin creating the script. It begins with a let* function:\n\n\
    ```\n(let*\n  ; Declare variables and assign values\n```"
