- img_proc: true
  md: '# Choosing the Right File Format: Loading and Saving Files


    # 5.1 The GIMP’s Native File Formats


    The GIMP has its own file formats for saving images, brushes, and so on. A knowledge
    of these formats is very helpful. As you begin to use the GIMP, get in the habit
    of saving often in the XCF format—it supports all of the options in the GIMP.


    # 5.1.1 Loading and Saving Files


    Loading and saving files are simple operations. The interface is standard with
    all GTK+ applications, so this menu will probably be familiar to you.


    # 5.1.1.1 Loading Files


    There are three ways of loading files:


    +   - Click on <Image>/File/Open.

    - Click on <Toolbox>/File/Open.

    - Press the hotkey [Ctrl+O].


    This will bring up the GIMP Image window, as shown in Figure 5.1. At the top of
    this window are two buttons:


    +   - Create Dir (1). This creates a directory inside your current one.

    - Delete File (2). This button deletes the currently selected file.

    - Rename File (3). This brings up a dialog box to rename the currently selected
    file.


    Next, there are controls for the file to be loaded:


    +   - Location bar (4). This displays the current location of the file browser.
    It is a drop-down menu to access the parent directories.

    - Directories (5). This shows the directory structure. This works similarly to
    other programs in which double-clicking accesses the directory.

    - Files (6). In this section, the files in the directory are displayed. The currently
    selected file is highlighted in blue. If you double-click on a file here it will
    be loaded.

    - Determine File Type (7). This drop-down menu allows you to select the file format.
    If you use Automatic, it determines the file type for you.

    - Selection (8). The filename is entered here. Tab line completion similar to
    the shell bash can be used to filter files and directories.

    - Preview window (9). This new addition to the GIMP loads a thumbnail of the image
    when it is clicked.


    After you have selected a file, click the OK button at the bottom and the file
    will be loaded.'
  merge: -1
  pgno: 92
- img_proc: true
  md: '# Choosing the Right File Format: Loading and Saving Files


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_93_0.png)


    # 5.1.1.2 Saving Files


    There are two ways to save a file: Save and Save As. If you are saving an untitled
    image, you will automatically be prompted with the Save As menu. If the image
    already has a filename, you have a choice between Save and Save As.


    There are two steps in using Save:


    +   1. Click on <Image>/File/Save ([Ctrl+S]).

    2. Enter any relevant options for the file format. If there are no options for
    this file format, it will simply overwrite the old file.


    There are three steps in using Save As (Figure 5.2):


    +   1. Click on <Image>/File/Save As.

    2. Enter the filename in the dialog box (1).This menu works the same as the Load
    Image menu. Click OK once you have chosen a location and filename.

    3. Enter any relevant options in the window that pops up, then click OK.'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# Choosing the Right File Format: XCF: The GIMP''s Native Format 71


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_94_0.png)


    Figure 5.2 The Save As menu.


    # 5.1.2 XCF: The GIMP''s Native Format


    XCF is the GIMP''s main file format. If you are working on an image, and would
    like to see it to work on later, this is what you use. This is because the XCF
    format supports everything the GIMP does. Layers, selections, Alpha channels,
    and so on, are all saved in the image when you use XCF.


    There are disadvantages to XCF however. The first, and most apparent, is the lack
    of support for this format in other programs. No other programs can read or write
    this format. If you are sending an image to another GIMP user, this is what you
    use. Don''t send an XCF to the printer, however; they will have no idea what to
    do with it. The second disadvantage is the size of the image. Because every minute
    piece of information is saved in this image, the file size can grow quite quickly.
    You may want to use gzip or bzip2 compression on these files (see “gzip and bzip2,”
    page 79).


    > It is often rumored that XCF stands for Xtra Cool Format, but it more likely
    comes from the eExperimental Computing Facility where the GIMP was first developed.'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# 72 Choosing the Right File Format: XCF: The GIMP''s Native Format


    The XCF format supports the following options:


    +   - RGB

    - Grayscale

    - Indexed

    - Layers

    - Channels

    - Layer masks

    - 8-bit Alpha

    - Selections

    - Guides

    - Paths


    # 5.1.3 PAT: The GIMP''s Pattern Format


    Patterns are useful in the GIMP, and this format is used for reading and writing
    them. You will find patterns installed in <Gimp Directory>/share/gimp/patterns.
    If you have created your own patterns, or have downloaded them off the Internet,
    put them in your own GIMP directory: -/.gimp/patterns. Patterns can be saved in
    any format, although Indexed images will not always produce correct results. RGB
    is the best to use. You can find a more thorough discussion of patterns on page
    175.


    # 5.1.4 GBR: The GIMP''s Brush Format


    The GIMP''s brush format is an important one if you need custom brush shapes to
    get your image looking just right. Brushes are found in <GIMP Directory>/share/gimp/brushes.
    If you created your own brushes, they are found in your own GIMP directory: -/.gimp/brushes.
    Brushes are saved in grayscale format. To learn about creating your own brushes,
    see page 174.


    # 5.2 Other Image Formats


    In this section, image formats that you will encounter on a day-to-day basis is
    discussed. Obscure formats are not covered.


    One fundamental mistake that many people make when saving images is not flattening
    and removing Alpha channels. Most image formats do not support transparency, and
    files do not turn out properly if they have transparency in them when saved. See
    “Flattening Images” on page 43 for more information.'
  merge: -1
  pgno: 95
- img_proc: true
  md: '# Choosing the Right File Format: Image Compression


    # 5.2.1 Image Compression


    Image compression is very important for the Web, and even for pre-press work when
    you don''t want to take up huge amounts of disk space. To learn what type of compression
    to use in a given situation, it is useful to know the basic theory behind the
    different types of compression.


    # 5.2.1.1 Lossy Compression


    Lossy compression means that information in the image will be lost during the
    compression. This form of compression is achieved by throwing away unnecessary
    details that the eye will not see. This works by tricking the human brain into
    thinking that the detail is still there, even though it is not; the brain conveniently
    fills in the missing portions of the picture. Lossy compression will be apparent
    when the image is enlarged, however, even by a small amount. Because of the way
    this compression loses size important information, it should only be used for
    Web graphics where size is essential. Also, never use it for saving an intermediate
    file. Only use formats with lossy compression as the final format.


    # 5.2.1.2 Lossless Compression


    Lossless compression will compress the image, but will not lose any information
    in the image. File formats with lossless compression do this by looking for rows
    of solid color. In computer language, this would be represented by a line of 0''s
    or 1''s. For example, it would take a line like 11111111111 00000 and store it
    as 10 1''s and 5 0''s. More advanced types of lossless compression can find complicated
    patterns and compress them, giving them an even smaller size. See Figures 5.3
    and 5.4 for a demonstration. The advantage of lossless compression is that you
    will not lose any information in the image.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_96_0.png)


    Figure 5.3 Using lossless compression, an image like this compresses quite well.
    Saved as a GIF, its file size is 2.5KB.


    Figure 5.4 The same image rotated 90 degrees does not compress as well due to
    the GIF''s method of using lossless compression. Saved as a GIF, its file size
    is a whopping 7.3KB, even though it is the same image as Figure 5.3!'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# 74 Choosing the Right File Format: Image Compression


    # 5.2.1.3 Interl


    Another option available that provides the “illusion” of smaller size is the progressive
    JPEG, or the interlaced GIF. This is extremely useful for Web graphics. As the
    file is downloaded, a very poor resolution is shown first, and it gradually improves
    as more of the file is downloaded. When using this option, the files are saved
    differently, but they still look the same when fully loaded.


    Normally, the files are saved in one horizontal line at a time, in numerical order.
    Line 1 is first, line 2 is second, and so on. This makes sense when you are loading
    images off a hard drive. When an interlaced file is saved, every other line is
    saved first, then the rest of the lines are saved at the end of the file. When
    a user views an image on the Web, line 1 is downloaded first, then line 3 until
    it reaches the bottom of the image. This gives rough detail of the image. As the
    file continues to download, it goes back to the top and fills in line 2, then
    line 4, and so on. When the interlaced file is fully downloaded it looks exactly
    the same, but it may be more entertaining to the user viewing the image because
    there is something to view while the image is downloading.


    # 5.2.1.4 Dithering


    Yet another part of image formats to be aware of is dithering. Dithering occurs
    when there are not enough colors available to the computer''s video card or the
    file format itself. When there are not enough colors available, the computer will
    try to approximate the color by creating many dots of different colors that are
    available. Dithering does not look good for images with large areas of solid color
    that become dithered (such as GIFs), but it is hardly noticeable on photographs
    (such as JPEGs). This is why the Web palette is so important (see “The Web Palette,”
    page 80). An example of dithering is shown in Figures 5.5 and 5.6.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_97_0.png)


    Figure 5.5 A 24-bit (mostly) solid color image with no dithering.'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# Choosing the Right File Format: PostScript 75


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_98_0.png)


    Figure 5.6 The same image made with six colors. Note the dithering around the
    area near the bottom.


    # 5.2.2 TIFF


    TIFF, or Tagged Image File Format, is an industry standard. It was developed by
    Aldus, which was purchased by Adobe. This is the format to use when dealing with
    people who aren''t using the GIMP. Viewers and editors on every platform support
    this format. It does not compress as well as the JPEG format, but it will retain
    image quality because of its lossless compression.


    TIFF images support the following options:


    +   - RGB

    - Grayscale

    - 8-bit Alpha

    - Lossless compression


    TIFF images also support CMYK, which the GIMP does not. If you are having problems
    reading TIFF files, make sure the file is in RGB, and the PC version.


    # 5.2.3 PostScript


    PostScript is another widely recognized file format, although it is not common
    in the DOS world. If you have a PostScript-compatible printer, it would be advantageous
    to use this format. PostScript images are made to be printed, so you are prompted
    for the dimensions of the image when you save. Another option is to use Encapsulated
    PostScript and to include a preview with the image. Unless space is an issue,
    use previews. It helps when you are going to load the image in other programs.
    Layers are treated as separate pages in PostScript format. This plug-in supports
    reading, but not writing, Adobe PDF files.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# Choosing the Right Format: PostScript


    PostScript images support the following options:


    +   - RGB

    - Grayscale

    - Indexed

    - Layers


    # 5.2.4 JPEG


    The JPEG format is perfectly suited for the Web. All graphical browsers support
    it. It achieves the best compression for scanned photos rather than computer-generated
    ones. Never save an image in JPEG format until you have the final copy. Too much
    information is lost in its lossy compression.


    There are a few options when saving JPEG images. The first is compression. The
    more the image is compressed, the more you lose in quality. The second is smoothing.
    This will help in the compression, but it will make the image seem blurry. The
    last option is to optimize the image. This is only useful for larger images like
    photographs. Small images that under 10KB may actually increase in size.


    JPEG images support the following options:


    +   - RGB

    - Grayscale

    - Lossy compression

    - Huffman optimization


    # 5.2.5 PNG


    PNG, or the Portable Network Graphic format, is gaining popularity, partially
    from the backlash against GIFs. They are more sophisticated than GIFs, but do
    not have the market share that GIFs do. This format is perfect for the Internet;
    it can contain color management support for different monitors. The latest versions
    of graphical browsers support PNGs; however, not many people use PNGs yet. The
    compression in PNGs is lossless. Higher levels of compression will just take longer
    to load than uncompressed images. PNGs are best suited for computer-generated
    images. Scanned photos do not compress very well with PNG compression.


    PNG images support the following options:


    +   - RGB

    - Grayscale

    - Indexed

    - 8-bit Alpha'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# Choosing the Right File Format: XPM


    +   - Interlacing (see “Image Compression,” page 73)

    - Lossless compression

    - Support for gamma correction


    # 5.2.6 GIF


    GIF, the Graphics Interchange Format, is owned by UniSys. They were created for
    use in CompuServe, but now so spread because they are so useful for computer graphics.
    They are perfect for creating small icons and images, and are now the industry
    standard for Internet images. They can also handle animations.

    Animations are created with each different layer as a frame. The timing between
    each frame is set in the name of the layer. The time for the layer to display
    is just written in the name of the layer, or 100 millisecond display time is written
    as (100ms). Another option is how the frames are displayed. A frame can either
    combine with the frame before it or replace it. This is done by adding (combine)
    or (replace) in the layer name. Note that some programs do not support replacing—they
    will always combine—while others do not support combining.


    GIF images support the following options:


    +   - Indexed

    - Grayscale

    - 1-bit Alpha

    - Lossless compression

    - Interlacing

    - Animations


    # 5.2.7 XPM


    XPM, or the X PixMap format, is used for creating small pictures, especially icons
    for Unix/Linux systems. It is 1-bit Alpha support, and when saving, it will ask
    for an Alpha Threshold. It is better to do this before saving so that you can
    see what the image looks like (see “Threshold Alpha,” page 62).

    XPM images support the following options:


    +   - RGB

    - Grayscale

    - 1-bit Alpha


    > * Problems arose when UniSys demanded that developers pay them royalties to
    use GIF support in their programs. This shocked the programming community, but
    UniSys has not done much to enforce the royalties. Some Linux distributions—Debian,
    for example—do include GIF support because of this.'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# 5.2.8 XWD


    XWD, or XWindow Dump, is the file format for screenshots taken in the Windowing
    System. It should be used only for a temporary file format. TIFF is much better.


    XWD images support the following options:


    +   - RGB

    - Grayscale


    # 5.2.9 PSD


    PSD images are Adobe Photoshop''s native file format. This plug-in allows you
    to read, but not write, these images. In theory, PSDs should support the same
    number of options that XCF files do. In practice, they do not because the Photoshop
    help file format is proprietary. If you have a PSD that loads correctly—great!
    If it doesn''t work, you should submit a bug report with an example image that
    doesn''t work.


    PSD images are *supposed* to support the following options:


    +   - RGB

    - Grayscale

    - 8-bit Alpha

    - Layers

    - Selections

    - Channels


    The PSD format also supports CMYK, but the GIMP does not. Make sure PSD files
    are in RGB format.


    # 5.2.10 BMP


    The BMP format is quite common because it is used as the native image format for
    Microsoft Windows. Most graphics programs will support this format. The disadvantage
    is that it does not support Alpha or layers.


    BMP images support the following options:


    +   - RGB

    - Grayscale

    - Lossless compression (RLE)'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# Choosing the Right File Format: Choosing File Formats 79


    # 5.2.11 HTML


    This plug-in lets you save an image as an HTML table, with each pixel being a
    cell. This could be used to design tables quickly, or create huge tables with
    a low-resolution graphic. There aren''t many applications for this, but it is
    worth mentioning.


    The HTML plug-in supports the following options:


    +   - RGB

    - Grayscale

    - Indexed


    # 5.2.12 gzip and bzip2


    Many image formats have image compression built in, but some do not. The most
    obvious one is the XCF format. A useful plug-in that is built in to the GIMP is
    the ability to read and write images compressed with gzip or bzip2. All you need
    to add .gz or .bz2 to the filename (while still including the proper format extension).
    It will automatically compress and decompress. Images that have built-in compression,
    such as JPEGs, will not benefit from this—the file sizes may actually increase
    in some cases.


    # 5.3 Graphics for the Web


    The GIMP is the program for creating graphics for the Web There are many different
    plug-ins related to Web graphics for the GIMP, including ImageMaps, GIF animations,
    and image optimization. There is no need for external programs to optimize or
    animate your graphics—it can all be done within the GIMP.


    There are two important concepts to be aware of when designing Web graphics. The
    first is that people from all over the world are going to be viewing them with
    all kinds of computers, from high-end workstations, to Palm Pilots. Colors display
    differently on these different platforms, so be aware. The second thing to remember
    is that some people are still using 14.4Kbps modems to connect to the Internet,
    so graphics should be as small as possible. Choose a format that will give you
    the best compression.


    # 5.3.1 Choosing File Formats


    There are basically two image formats used on the Web: GIF and JPEG. PNG has achieved
    some popularity, but it is far from mainstream. Certain version 4 browsers still
    don''t support PNG, so this chapter discusses only GIF and JPEG.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '80 Choosing the Right File Format: Choosing File Formats


    One of the biggest dilemmas facing Web designers is the choice of file format
    for their images. The quick and dirty solution is simple:


    +   - If it is a scanned picture, use a JPEG.

    - If it is a computer-generated image with areas of solid color, use GIFs.


    JPEGs are best suited for scanned photos. JPEG compression is controlled by a
    slider bar when saving. Generally, you will start to lose quality when compressing
    more than 85%. The image will become unrecognizable at 30% quality. JPEGs will
    dither areas of solid color in cartoonish images, causing them to look spotty
    and of low quality.


    GIFs are well suited to display images with areas of solid color. This is because
    their method of compression works differently than JPEGs. With GIFs, you have
    several options when saving. When creating images for the Web, always try to use
    the fewest number of colors possible without changing the image.


    The best bet, if you have an image with many colors, is to use the Web Palette
    (see the section "The Web Palette"). If you have an image with colors blending,
    use Floyd-Steinberg dithering to make it appear much smoother. This will increase
    the file size slightly but reduces "banding" in gradients. If you have an image
    with areas of solid color, do not use dithering or you will have a spotted image.
    Also, Web browsers will dither if there are not enough colors available, and it
    will look even worse.


    Another option to be aware of interlacing. This saves every second line in the
    GIF first, and then saves the remaining lines. This has the effect of displaying
    a rough, pixelated image that gradually comes into focus. This does not affect
    the file size, but it makes the images seem like they are downloading faster.
    Your choice becomes very simple when you need animation or transparency: JPEGs
    don''t support them. Use GIFs.


    # 5.3.2 The Web Palette


    The Web Palette has come to become because PCs and Macintoshes display the colors
    differently. Only the first 216 colors are the same—the last 40 are different.
    This can have the effect of making an image entirely different when viewed on
    different platforms. When creating GIF images, always try to use this palette
    first. If the image is not affected by this, try using fewer than 216 colors to
    save some space. If it distorts the image, you are stuck with the colors it gives
    you. Using any more colors will it to display improperly on different platforms.
    Lynda Weinman, author of several Web design books, has a palette with these colors.
    It can be found at http://www.lynda.com/hex.html. Note that paying attention to
    this is only necessary with GIFs, because JPEGs will dither the colors in photographs
    quite well.


    *'
  merge: -1
