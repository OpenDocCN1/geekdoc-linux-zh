  md: '# 14.14.12 Solid Noise


    This filter generates solid noise, grayscale textures on an image. These can be
    tileable, and are excellent for random bumpmaps.


    The following options are available with this filter:


    +   - Seed. This provides a random number for generating the image. A number can
    be entered here, or the current time can be used.


    +   - Detail. Determines the detail level of the noise. Larger numbers create
    more detail in the image, but the image then takes longer to render.


    +   - Turbulent. This gives the image greater variation between the light and
    dark areas.


    +   - Tileable. This toggle makes the image tileable, perfect for Web page backgrounds
    or patterns.


    +   - X Size. This scales the image in the X direction.


    +   - Y Size. This scales the image in the Y direction.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_278_0.png)'
