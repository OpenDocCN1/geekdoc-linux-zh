    of what you might find on the Internet. The GIMP''s Web site hosts many developers''
    Web pages, and provides pointers to other home pages. Tiger''s home page (http://tigert.gimp.org/)
    is a good example of a developer''s site. For other sites, try typing the developer''s
    email address to find the page, such as username.gimp.org. Other people can be
    found at www.gimp.org/~username.


