  md: '# # Writing Your Own Script: Adding Functionality to the GIMP


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_116_0.png)


    # ## 6.3.2 Adding Functionality to the GIMP


    Now it is time to make the script actually do something. For now, we will just
    have a simple script that creates a layered image that fits around some example
    text. It will follow these steps:


    +   1. Declare all variables.

    2. Create the image.

    3. Create the new layers.

    4. Clear the background layer so that it has the correct background color.

    5. Add alpha to the layer.

    6. Clear the layer.

    7. Set the foreground color.

    8. Place the text on this new layer.

    9. Resize the image so that it fits precisely around the text layer.

    All of this will be inside the define function.


    # ### 6.3.2.1 Declaring Variables


    First, we must use a `let` function to declare all the variables we need:


    +   - **imgWidth**: The width of the image. Used to determine size of layers.

    -* **imgHeight**: The height of the image. Used to determine size of layers.

    -* **img**: The actual image.

    -* **bgLayer**: The layer called Background.

    -* **baseLayer**: The layer called Text Layer.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# 94 Writing Your Own Script-Fu: Adding Functionality to the GIMP


    It will look something like this:


    ```

    (let*

    (

    ; Declare Width and Height variables and assign a dummy value


    (imgWidth 1)

    (imgHeight 1)


    ; Declare and create the new image


    (img

    (car gimp-image-new imgWidth imgHeight RGB)

    )


    ; Declare and create the layers in the image:


    (bgLayer)

    (car

    (gimp-layer-new img imgWidth imgHeight RGB_IMAGE "Background" 100 NORMAL)

    )


    (baseLayer)

    (car

    (gimp-layer-new img imgWidth imgHeight RGB_IMAGE "Text Layer" 100 NORMAL)

    )


    ; Rest of script goes here.

    )

    ```


    # 6.3.2.2 Create the New Image


    Inside the variable declaration, we have created the new image with the gimp-image-new
    function. As shown in the DB Browser, it takes three parameters:


    +   - Width

    - Height

    - Type


    The output of this function is a list, so we need to use the car function to get
    the proper image name.


    # 6.3.2.3 Adding the New Layers


    We also need to create two new layers—bgLayer and baseLayer—with the gimp-layer-new
    function. According to the DB Browser, it takes seven parameters to achieve this:


    +   - Image. The name of the layer.

    - Width.

    - Type. The layer type, not the image type.

    - Name. The name of the layer in quotation marks.'
