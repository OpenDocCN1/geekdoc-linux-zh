  md: "# 14.14.8 Maze\n\nThis filter creates a random maze on an image. It uses the\
    \ foreground color for the walls and the background color for the passages. There\
    \ are two sections in this filter:\n\n+   - Options menu. The following options\
    \ are available:\n  - Tileable. If this toggle is turned on, it creates a tileable\
    \ maze.\n  - Width (Pixels). This option determines the width of the walls and\
    \ passages of the maze.\n  - Pieces. Pieces determines the number of vertical\
    \ pieces in the maze.\n  - Height (Pixels). This option determines the height\
    \ of the walls and passages in the maze.\n  - Pieces. Here, Pieces determines\
    \ the number of horizontal pieces in the maze.\n\n+   - Advanced Menu. The following\
    \ options are available:\n  - Multiple. This should be left at 57 in order to\
    \ create proper mazes.\n  - Offset. This option should also be left at its default\
    \ value. The author of the plug-in borrowed the code to generate the maze, and\
    \ he doesn't know what it does.\n- Seed. This option determines the randomness\
    \ of the maze. Using the current time is good for generating a random one. To\
    \ be able to repeat the creation of a maze, enter a value in this section and\
    \ turn off the Time option.\n  - Algorithm. There are two options in this menu:\n\
    \    - Depth's First. This algorithm creates a maze by computing one branch at\
    \ a time.\n    - Prim's Algorithm. This algorithm creates a maze by computing\
    \ a whole tree with multiple branches at once.\n\n# 14.14.9 Plasma\n\nThe Plasma\
    \ filter creates a colorful, random pattern that simulates a plasma cloud. The\
    \ following options are available for this filter:\n\n+   - Seed. This option\
    \ determines the randomness of the plasma cloud. Using the current time is a good\
    \ value. To be able to repeat the creation of a plasma cloud, enter a value in\
    \ this section and turn off the Time option.\n- Turbulence. This slider determines\
    \ the turbulence, or randomness, of the cloud."
  merge: -1
  pgno: 275
- img_proc: true
  md: "# 14.14.10 Qbist\n\nThis filter generates very interesting random patterns.\
    \ The filter generates nine sample images. The center image is the one that is\
    \ actually created. To select an image that is not in the center, simply click\
    \ on it. This will move it to the center, and generate new random patterns based\
    \ on the center image. Clicking on the center image will generate the nine new\
    \ images. Images can be saved and loaded for later use. When there is a satisfactory\
    \ image in the center, click on the OK button.\n\n# 14.14.11 Sinus\n\nThe sinus\
    \ filter generates random textures based on sinusoidal functions. There are three\
    \ menus for this filter:\n\n+   * Settings menu. (See Figure 14.101.)\n  a. X\
    \ scale (1). This slider scales the function to cycle more often in the X axis.\n\
    \  b. Y scale (2). This slider scales the function to cycle more often in the\
    \ Y axis.\n  c. Complexity (3). This option makes the image more complicated by\
    \ increasing the number of waves in the image.\n  d. Random Seed (4). This option\
    \ provides a random number used to generate the texture. By default the number\
    \ is 42, an obvious choice.\n  e. Force Tiling (5). This option makes the image\
    \ tileable, which will distort the image.\n  f. Ideal (6). When force tiling is\
    \ turned on, this algorithm creates a perfectly symmetrical image.\n  g. Distorted\
    \ (7). This algorithm slightly distorts the image, making it seem much more random.\n\
    \n![](img/f2e1dc39d482e76a84057f638c7a2d3f_276_0.png)\n\n*"
  merge: -1
