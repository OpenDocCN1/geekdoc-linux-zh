    # 2.5.4 Tab Completion


    The GIMP’s Save and Open windows allows you to use tab completion similar to that
    found in the bash shell. If you type in partial filenames, as seen in Figure 2.19,
    and then press Tab, it will try to complete the filename. If there is more than
    one file that matches, it will only display the files that match. This is very
    useful if you are dealing with many different files in a directory.


    Note that the window does not show hidden files. To view them, enter a period,
    then press Tab, and the hidden files will appear.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_58_1.png)


