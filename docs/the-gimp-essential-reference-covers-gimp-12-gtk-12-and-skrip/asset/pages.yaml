- img_proc: true
  md: "# Filters: NL Filter\n\nalgorithms to reduce noise, smooth images, and also\
    \ do edge enhancements.\n filter is different from the other enhance filters because\
    \ it uses a seven-pixel hexagon to calculate mean values rather than a 3x3 square\
    \ of pixels. The NL filter has several different modes in which to work (see Figure\
    \ 14.62):\n\n+   - Alpha Trimmed Mean. This mode will give similar results to\
    \ the other enhance filters. Low or O Alpha values are best for this mode. For\
    \ better noise reduction, try an Alpha value of 0.4 and a radius of 0.6.\n- Optimal\
    \ Estimation. This mode works on small noise variations. This filter assumes that\
    \ large variations are meant to be in the image, and it removes only the smaller\
    \ variations in color. This is well suited for removing dithering in GIFs.\n-\
    \ Edge Enhancement. This mode does the opposite of preceding two modes. It emphasizes\
    \ the differences in images to improve their quality. Use an Alpha value of 0.3\
    \ and a radius of 0.8 for the best results.\n\nFor all of these modes, the seven-pixel\
    \ hexagonal shape is used. Because of this shape, the radius ranges from 0.33\
    \ (only one pixel large) to 1.0 (the size of a 3x3 pixel square). Use intermediate\
    \ values for this, or use a different filter if needed.\nThis filter can be used\
    \ several times in succession in different modes. This is useful in recovering\
    \ GIF images that have become dithered:\n\n+   - Use the Optimal Estimation mode\
    \ with an Alpha of 1.0 and radius 1.0.\n- Use the Alpha Trimmed Mean mode with\
    \ an Alpha of 0.5 and radius 0.55.\n- If needed, use the Edge Enhancement mode\
    \ with an Alpha value of 0.3 and a radius of 0.8. This should give you a better\
    \ image with which to work.\n\n![](img/f2e1dc39d482e76a84057f638c7a2d3f_246_0.png)\n\
    \nFigure 14.62 The options menu for the NL filter."
  merge: -1
  pgno: 246
- img_proc: true
  md: '# 14.8.5 Sharpen


    The Sharpen filter is probably the most useful filter for quickly improving images
    (see Figures 14.63 through 14.66). Sharpen improves the quality of images by emphasizing
    color changes in an image. When it detects a color change, it will lighten the
    pixels on the lighter edge and darken the pixels on the darker edge. To the human
    eye, this makes the image much more clear.


    Sharpening does have the effect of creating or enhancing noise. Try using a small
    amount of sharpening on the entire image, and then select certain areas that require
    additional sharpening. Remember to feather the selection to give it a more natural
    look. Make sure that you do not create "halos" around objects using this filter
    because over-sharpening can make the image unnatural.


    The Sharpen filter is easy to use. The amount of sharpening that occurs is controlled
    by the slider bar along the bottom of the menu. The preview image is very useful
    in determining how much sharpening is needed.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_247_0.png)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_247_1.png)


    Figure 14.63 This is a close up of the original image.


    Figure 14.64 This is a close up of the sharpened image. Note the greater contrast
    between the dark and light areas of the "A".'
  merge: -1
  pgno: 247
- img_proc: true
  md: '![](img/f2e1dc39d482e76a84057f638c7a2d3f_248_0.png)


    Figure 14.65 The original, unsharpened image.


    Figure 14.66 The resulting image after it has been sharpened. This has been over-sharpened
    to exaggerate the effects of the filter.


    # 14.9 Glass Effect Filters


    These two filters create effects related to “glass,” or other semi-opaque images.
    They create some very fascinating distortions.


    # 14.9.1 Apply Lens


    This filter makes an image look as if it is being viewed from behind a lens made
    of different materials. This filter always occurs at the center of the image or
    current selection.


    The options for this filter are simple. You can either keep the surroundings,
    or replace them with the background color. The amount of refraction is entered
    manually and can range from 1.0 to as large as you want to go. Some sample indices
    of refraction are shown in Table 14.3.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Table 14.3 Sample Indices of Refraction


    | Substance | Index |

    | --- | --- |

    | Ice | 1.31 |

    | Water | 1.33 |

    | Turpentine | 1.47 |

    | Glass | 1.52 |

    | Salt | 1.54 |

    | Quartz | 1.54 |

    | Dense glass | 1.66 |

    | Zircon | 1.92 |

    | Diamond | 2.42 |


    # 14.9.2 Glass Tile


    This filter makes an image look like it is being viewed from behind glass tile.
    It divides the image up into rectangular “glass blocks”. The height and width
    (in pixels) of these blocks are controlled by slider bars.


    # 14.10 Light Effect Filters


    The filters found in the Light Effects menu create effects that in real life are
    caused by light. There are many uses for these filters, especially for creating
    realistic-looking, computer-generated images.


    # 14.10.1 FlareFX


    The first light effect filter is FlareFX. It creates a flare lens at a certain
    point in an image. Currently, the only option to work with here is where the flare
    occurs. The coordinates can be entered manually, or you can point and click with
    the mouse. Hopefully, we will see more options added to this filter in the future.


    # 14.10.2 Sparkle


    The Sparkle filter (see Figure 14.67) adds a sparkling effect to an image. Sparkles
    will occur at the points with the highest value of an image. This filter is very
    unpredictable, so you may want to use selections or layers to give you greater
    control. The Sparkle filter is controlled by several slider bars:


    +   - Luminosity Threshold (1). Controls the number of pixels affected. Higher
    luminosity values result in a greater range of affected pixels.

    - Flare Intensity (2). Controls how “bright” these flares are.

    - Spike Length (3). Determines how long the average spike is.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '■ Spike Points (4). Controls how many spikes are found in each flare.


    ■ Spike Angle (5). Determines where the first spike occurs. This option does not
    affect the results if there are several spike points.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_250_0.png)


    Figure 14.67 The Sparkle filter''s Options menu.


    # 14.10.3 Supernova


    The Supernova filter creates a supernova burst in your image. This filter offers
    greater control over the result than the FlareFX filter. The only disadvantage
    to this filter is that there is no preview for the color of the flare. It is best
    to use the Color Selection menu (see page 12) to pick a color, and manually enter
    the numbers in the filter''s dialog box. This filter has an interface similar
    to that of the FlareFX plug-in:


    +   ■ The position of the supernova is entered manually, or using the mouse.

    ■ The color of the supernova is controlled by the slider bars.

    ■ The radius of the burst is controlled by a slider bar. This radius value only
    controls the center ball of the supernova—the spokes will spread over the entire
    image.

    ■ The last slider bar, Spokes, controls the number of spokes radiating from the
    burst. Low values for the spokes will create very irregular burst shapes.


    # 14.11 Map Filters


    These filters deal with “mapping” one image to another, or to an object. This
    has the effect of creating images that look textured, or have a 3D feel to them.
    These filters can create very impressive effects if you know how to use them properly.'
  merge: -1
  pgno: 250
- img_proc: true
  md: "# 14.11.1 Bumpmap\n\nThe Bumpmap filter is probably the most frequently used\
    \ filter in the Map menu. It creates 3D or textured images by combining two images,\
    \ as the source image and the other as the map (see Figures 14.68 through 14.70).\
    \ Map images are usually grayscale images to make them easier to work with. This\
    \ filter allows you to be very creative. Use this filter for adding textures to\
    \ logos and other text. The Ripple and Whirl and Pinch filters can create some\
    \ very interesting images to be used as maps. The controls for this filter are\
    \ somewhat complicated, however (see figure 14.71):\n\n+   - Compensate for Darkening\
    \ (1). This should usually be turned on, otherwise the resulting image will become\
    \ too dark.\n\n+   - Invert Bumpmap (2). This will cause the map's effects to\
    \ be reversed.\n\n+   - There are three map types (3):\n  - Linear Map. Works\
    \ directly on the image.\n  - Spherical Map. Makes the bumps rounder.\n  - Sinusoidal\
    \ Map. Makes some parts of the map steeper in areas.\n\n+   - Bumpmap (4). The\
    \ map image to use as the bumpmap is controlled by a drop-down menu. You can use\
    \ any image for this, but it is best to use a grayscale image.\n\n+   - Azimuth\
    \ (5). This slider bar simulates the direction of the light (in degrees). This\
    \ can be thought of as the position of the sun.\n\n+   - Elevation (6). This slider\
    \ bar controls the height of the light source above the horizon (in degrees).\
    \ An elevation of 0 means that the light is shining directly horizontally, and\
    \ large shadows are created. An elevation of 90 means that the light is directly\
    \ above the image, and only very small shadows are created. Note that when the\
    \ elevation is 90 degrees, changing the azimuth does not affect the bumpmap.\n\
    \n+   - Depth (7). This slider bar controls the amount of bumpmapping that occurs.\
    \ Higher depth values create a greater contrast between light and dark, making\
    \ the bumpmap seem \"deeper.\"\n\n+   - X Offset and Y Offset (8). The X and Y\
    \ offsets allow you to precisely place the map over the image. This is useful\
    \ if you need to align a map with the original image. You can also use the right\
    \ mouse button to drag around the preview window to control the offset.\n\n+ \
    \  - Waterlevel (9). This slider bar determines how pixels with Alpha values in\
    \ the map image are used. Usually, pixels with Alpha value in them will not affect\
    \ the image. If, however, you increase the waterlevel, the actual Alpha parts\
    \ of the map image will affect the original image.\n\n+   - Ambient (10). This\
    \ slider bar controls how much ambient light there is in the new image. Low amounts\
    \ of ambient light create more contrast between"
