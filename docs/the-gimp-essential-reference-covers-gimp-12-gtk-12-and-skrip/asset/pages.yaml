- img_proc: true
  md: '# Script-Fu: Lava 261


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_284_0.png)


    Figure 15.2 An example fuzzy border.


    See Also “Drop Shadow” (page 272) and “Spread” (page 237)


    # 15.1.5 Lava


    This script creates a layer of “lava.” It creates a random image, and maps a gradient
    to it. With the German_flag_smooth gradient, this simulates lava. The Lava script
    uses with the following options:


    +   - Seed. This is used for a random seed number for the Solid Noise filter.

    - Size. Determines the tile size used in the Cubism filter.

    - Roughness. Determines the roughness used for the Oililify filter.

    - Gradient. Allows you to pick in the name of the gradient. It is often easier
    to use the current gradient, described later in this list.

    - Keep Selection. When this is turned on, the selection is not deleted after the
    script is finished running.

    - Separate Layer. Creates a separate layer rather than drawing on the active layer.

    - Use Current Gradient. This option uses the current gradient, and overrides the
    name of the gradient entered in this menu.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_284_1.png)


    Figure 15.3 A logo with a Lava background.


    See Also “Solid Noise” (page 255), “Cubiam” (page 189), “Oilify” (page 192), “Edge
    Detect” (page 219), and “Gradient Map” (page 201)'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# Script-Fu: Old Photo


    # 15.1.6 Old Photo


    This script turns an image into an old photo, complete with stains and defects.
    For best results, use scanned photos. The Old Photo script uses the following
    options:


    +   - Defocus. Blurs the image slightly to simulate being out of focus.

    - Sepia. Adds a sepia tone to the image.

    - Border. Adds a fuzzy border to the image, making the image look as if it is
    fading at the edges.

    - Mottle. Introduces random defects into the image.


    See Also "Fuzzy Border" (page 260) and "Gaussian Blur" (page 194)


    # 15.1.7 Predator


    This script changes a layer''s colors so that they form what looks like a thermal
    image, similar to what the Predator sees in the movie of the same name. The following
    options are available for the Predator script:


    +   - Edge Detect. Determines the amount of edge detection. This ranges from 0
    to 24.

    - Pixelize. This toggle turns pixelization on. This ranges from 1 to 16.

    - Pixel Amount. Determines the pixel width. This option is not used unless Pixelize
    is turned on.

    - Keep Selection. When this is turned on, the selection is not deleted after the
    script has finished running.

    - Separate Layer. Creates a separate layer rather than drawing on the active layer.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_285_0.png)


    Figure 15.4 A Porsche seen from the Predator''s eyes.


    See Also "Pixelize" (page 196), "Max R.GB" (page 201), and "Edge" (page 219)'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# 15.1.8 Round Corners


    This script rounds the corners of an image by removing circular selections. It
    can also add a drop shadow effect to the image. The following options are available
    with this script:


    +   - Radius of Edges. Determines the radius (in pixels) of the rounded corners.
    This can be any number, although it should be less than half the size of the layer.


    +   - Add Drop Shadow. Turns on the Drop Shadow script.


    +   - Shadow X. Offset of the shadow in the x direction. This can be any reasonable
    value.


    +   - Shadow Y. Offset of the shadow in the y direction. This also can be any
    reasonable value.


    +   - Blur Radius. The amount of blurring that occurs on the shadow. This can
    be a value greater than 1.


    +   - Add Background. Adds a background layer to the image.


    +   - Work on Copy. When turned on, the script creates a new image, instead of
    working on the original.


    > > See Also "Drop Shadow" (page 272)


    # 15.1.9 Slide


    This script turns your image into a slide. It uses the Filter achieve to achieve
    this effect. The image is first cropped into an aspect ratio of 1:1.5. It is then
    turned into a slide. The Slide script uses the following options:


    +   - Text. Determines the title of the slide.


    +   - Number. Determines the number of the slide.


    +   - Font. Determines the font used to write on the slide.


    +   - Font Color.


    +   - Work on Copy. When turned on, the script creates a new image rather than
    working on the original.


    > > See Also "Film" (page 206)


    # 15.1.10 Xach Effect


    This script creates a very light 3D effect on a selection. It creates a slight
    shadow on the image, and is often better than the Drop Shadow itself when only
    a subtle shadow is needed. This script works best with an active selection, but
    it will run without one. To achieve a smoother change, try using the Add Bevel
    script after this script is run. The following options are available for this
    script:'
  merge: -1
  pgno: 286
- img_proc: true
  md: '+   - Highlight X Offset. Determines the x direction shift in the highlight
    layer.

    This ranges from 100 to -100.


    +   - Highlight Y Offset. Determines the y direction shift in the highlight layer.

    This ranges from 100 to -100.


    +   - Highlight Color. Determines what color to use as the highlight layer background.


    +   - Opacity. Determines the color to use for the opacity in the highlight layer.

    This ranges from 1 to 255.


    +   - Drop Shadow Color. Determines the color to use for the shadow.


    +   - Drop Shadow Opacity. Determines the opacity of the drop shadow.


    +   - Drop Shadow Blur Radius. Determines the amount of blurring of the shadow.


    +   - Drop Shadow X Offset. Determines the x direction shift of the shadow.


    +   - Drop Shadow Y Offset. Determines the y direction shift of the shadow.


    +   - Keep Selection. When this is turned on, the selection is not deleted after

    The script is finished running.


    > ▶ See Also "Offset" (page 60) and "Drop Shadow" (page 272)


    # 15.2 Modify


    Currently, there is only one script found in the Modify section: Add Border.


    # 15.2.1 Add Border


    The Add Border script creates a 3D-looking border around a layer. This script

    supports the following options:


    +   - Border X Size. Determines the border size on the sides.


    +   - Border Y Size. Determines the thickness of the border on the top and

    bottom.


    +   - Border Color. Determines the color of the border.


    +   - Delta Value on Color. Determines the amount of color change on the

    border. A value of 0 means no color change. A value of 255 makes the

    white at the top, black at the bottom, lighter on the left, and darker on the

    right. Lower values are best for this script.


    # 15.3 Utils


    The scripts in this section of scripts do not actually create effects to be used
    on an

    image. They are more useful in describing your image.'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# Script-Fu: Show Image Structure


    # 15.3.1 ASCII 2 Image Layer


    This script does not fit very well into this section. It creates a text layer
    from the input of an ASCII 2 file. It does allow you to do some simple batch text
    processing in the GIMP. The input file is read, and each line is created as a
    layer. This script is not smart enough to realize when it is drawing outside of
    the image, so some experimentation may be necessary. The following options are
    available with this script:


    +   - File Name. The name of the input file.

    - Font. The name of the font to be used.

    - Font Size. The size of the text (in pixels).

    - Text Color. The color of the text created.

    - Flatten Image. If this option is selected, it flattens the image rather than
    each line as a separate layer.


    # 15.3.2 Draw HSV Graph


    This script draws a graph of the image in HSV space. The red line represents Hue,
    the green line represents Saturation, and the blue line represents Value. This
    script uses the following options:


    +   - Graph Scale. Determines the amount of scaling to be done.

    - BG Opacity. Determines the opacity (in percent) of the background for the new
    image.

    - Use Selection Bounds Instead of Below. This toggle uses only the active selection
    of the dimensions described below. If there is no active selection, this toggle
    selects the entire image.

    - From Top-Left to Bottom-Right. Analyzes the graph diagonally rather than straight
    across.

    - Start X. Determines the starting x coordinate.

    - Start Y. Determines the starting y coordinate.

    - End X. Determines the ending x coordinate.

    - End Y. Determines the ending y coordinate.


    # 15.3.3 Show Image Structure


    This script is quite interesting. It breaks a layered image up into all of its
    parts and displays them. It simulates viewing them at an angle, whereas normally
    they are viewed directly from above. This script uses the Shear tool, so it may
    take a while for your computer to complete the effect. The following options are
    available:


    +   - Make New Image. Either create a new image or use the existing one.

    - Space Between Layers. Determines the space between layers (in pixels).'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# 266 Script-Fu: Show Image Structure


    +   - Shear Length. Changes the angle which the layers are viewed. This value
    must be greater than 0.

    - Outer Border. Determines the space around the sheared layers.

    - Apply Layer Mask. Determines how layer masks are treated (either or discarded).

    - Layer Name. Toggles whether to insert layer names.

    - Padding for Transparent Regions. Toggles whether to pad areas with transparency.

    - Pad Color. The color to use as padding.

    - Pad Opacity. The opacity (in percent) of the padding.

    - Background Color. The color of the background in the new image.


    # 15.4 Animators


    These scripts create excellent animations. They work very well for creating animated
    GIFs on Web pages. Remember to use the Animation Optimize filter on the new images.
    Note that using the default values will not create an animation.


    # 15.4.1 Blend


    This script takes a minimum of two layers (plus a background layer) and blends
    them together using transparency and blurring. It uses the following options:


    +   - Intermediate Frames. Determines the number of frames creating between the
    originals.

    - Max Blur Radius. Determines the maximum amount of blurring that occurs.

    - Looped. Loops the animation.


    # 15.4.2 Color Cycling


    This script cycles the colors in an image. Color Cycling is based on the AlienMap
    filter (see page 197). It is best to use the AlienMap filter first to find optimal
    values for the starting and ending points, and then run the script. The Color
    Cycling script uses the following options:


    +   - Number of Frames. Determines the number of frames in the animation. The
    greater number of frames, the smoother the color transition.

    - Start Intensity Factor. (Red, Green, and Blue channels.) The starting intensity
    value for each channel. This can range from 0 to 128.

    - End Intensity Factor. (Red, Green, and Blue channels.) The ending intensity
    value for each channel. This can range from 0 to 128.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Script-Fu: Spinning Globe


    **Color Mode.** (Red, Green, and Blue channels.) The type of function to use for
    mapping:


    +   a. Sine

    bb. Cosine

    c. None


    +   **Inversion Before Transformation.** (Red, Green, and Blue channels.) A toggle
    that inverts the channel before transformation occurs.


    +   **Start: Phase Displacement.** (Red, Green, and Blue channels.) Determines
    the displacement of the channels in the starting frame. Measured in radians.


    +   **End: Phase Displacement.** (Red, Green, and Blue channels.) Determines the
    displacement of the channels in the ending frame. Measured in radians.


    +   **Start: Frequency.** (Red, Green and Blue channels.) Determines the frequency
    of the channels in the starting frame.


    +   **End: Frequency.** (Red, Green and Blue channels.) Determines the frequency
    of the channels in the ending frame.


    +   **Inversion Before Transformation.** (Red, Green, and Blue channels.) A toggle
    that inverts the channel before transformation occurs.


    # 15.4.3 Rippling


    This script creates a rippling effect on an image, similar to that of a flag waving
    in the wind. It works very well, especially when a larger number of frames are
    used. It is based on the Ripple filter (see page 215). The following options are
    available with this script:


    +   **Rippling Strength.** Determines the amount of rippling.


    +   **Number of Frames.


    # 15.4.4 Spinning Globe


    This script maps an image to a spinning globe, like those found on Web pages.
    This script works best with a square image. The following options are available:


    +   **Frames.** The number of frames to create the animation.


    +   **Turn from Left to Right.** Determines the direction of spinning.


    +   **Transparent Background.** Either uses the current background color or creates
    a transparent background.


    +   **Index of n Colors.** Converts the image to Indexed with $n$ number of colors.
    Enter $0$ to maintain an RGB image.


    +   **Work on Copy.** When turned on, the script will create a new image rather
    than working on the original.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# 15.4.5 Waves


    This script creates an animation with the Waves filter (see page 218).

    The following options are available with this script:


    +   * Amplitude. Determines the height of the waves.

    * Wavelength. Determines the distance between peaks of waves.

    * Number of Frames.

    * Invert Direction. Causes the waves to travel inward to a point instead of spreading
    outward.


    # 15.5 Stencil Ops


    These scripts use single-layer grayscale images for stencils to draw with.


    # 15.5.1 Carve-It


    The Carve-It script is an extension to the Emboss filter (see page 208). It carries
    a grayscale image into an RGB or Grayscale image. It uses the grayscale image
    as a layer mask. Note that a single-layer grayscale image is required for carving.
    If the script still isn''t available, make sure you have flattened the image first.
    This script supports the following options:


    +   * Carve to Image. Select the image to be carved. This image can be either
    RGB or grayscale. It can have layers and alpha as well.

    * White Areas. This toggle determines what part carves the image. Either black
    or white areas carve more deeply. This option simply inverts the grayscale image.


    # 15.5.2 Chrome-It


    This script "chromes" an image using an environment map and specific colors for
    highlights. It operates only on grayscale images. This script is the basis for
    the SOTA Chrome script. This script creates four layers:


    +   * Chrome. This layer has the basic picture of the environment map with grayscale
    image used as a layer mask.

    * Highlight. Highlight has the environment map on it with a slightly distorted
    grayscale image used as a layer mask.

    * Drop Shadow. The Drop Shadow layer is a black-to-transparent blend.

    * Background. This layer has the Marble #1 pattern on it.


    This script has the following options:


    +   * Chrome Saturation. Determines the saturation amount for the Chrome layer.
    This value ranges between 100 and -100.'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# Script-Fu: Erase Every Other Row


    +   - Chrome Lightness. The average lightness of the Chrome layer. This value
    ranges between 100 and -100.


    +   - Chrome Factor. Determines how "chromed" the image becomes. The higher the
    number, the greater detail in the environment map.


    +   - Environment Map. The image that is mapped to the grayscale image. By default,
    this is a JPEG of a cat.


    +   - Highlight Balance. The color used for the Highlight layer in the image.
    This is the color that "reflects" off of the bright parts of the chrome.


    +   - Chrome Balance. The base color used for the Chrome layer.


    +   - Chrome White Areas. Determines which part of the image is used for the chrome
    effects. If this is selected, it uses white areas for the chrome effect, and black
    areas become transparent. When it is not selected, it has the opposite effect.


    # 15.6 Alchemy


    These scripts all perform a transformation on the image. The most useful script
    found here is Unsharp Mask, which is used for improving the quality of scanned
    photographs. It is similar to PhotoShop''s Unsharp Mask filter.


    # 15.6.1 Clothify


    This script gives a layer a cloth-like texture by adding noise to the image and
    bumpmapping it. It is mostly based on the Bumpmap filter. This script has the
    following options:


    +   - X Blur. The amount of blurring in the x direction.


    +   - Y Blur. The amount of blurring in the y direction.


    +   - Azimuth. The direction of the light source (see the Bumpmap filter, page
    228).


    +   - Elevation. The height of the light source (see the Bumpmap filter, page
    228).


    +   - Depth. The amount of bumpmapping (see the Bumpmap filter, page 228).


    # 15.6.2 Erase Every Other Row


    This script simply erases every other row or column. Or if the image contains
    an alpha channel, it is erased to background color, or transparency. This script
    supports the following options:


    +   - Rows/Cols. Specify which to erase. It must be written in the form ''rows''
    or ''cols''.


    +   - Even/Odd. Specify which to erase. It must be written in the form ''even''
    or ''odd''.'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# 15.6.3 Unsharp Mask


    This script is for sharpening scanned photographs. It creates two layer masks
    that sharpen the image. It works very well. To get the best results, adjust the
    transparency of the two layer masks after the script has finished running. This
    script only has one option: Mask Size. The larger the mask size, the more the
    script tries to sharpen. The only disadvantage to sharpening too much is that
    it can emphasize scanner noise or photographic defects. This script often works
    better than the Sharpen filter (see page 224) when a quick fix is needed.


    # 15.6.4 Weave


    The weave script makes an image look as though it has been created by weaving
    threads together, as shown in Figure 15.5. The Weave script uses the following
    options:


    +   - **Ribbon Width.** The average width (in pixels) of the ribbons.

    - **Ribbon Spacing.** The average space between ribbons.

    - **Shadow Darkness.** The darkness value of the shadow between the ribbons. A
    larger value make the ribbons seem to move further.

    - **Shadow Depth.** The depth of the shadows. A larger value means the ribbons
    bend more around each other.

    - **Thread Length.** The average length of the threads in the ribbons. Different
    values make the ribbons seem to be made of different material.

    - **Thread Density.** Determines how closely packed the ribbons.

    - **Thread Intensity.** Determines the brightness of the ribbons. A lower value
    makes the ribbons brighter.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_293_0.png)


    Figure 15.5 An image of a flower after the weave script has been applied.'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# 15.7 Selection


    The scripts in this section deal with selections. They modify or perform operations
    on selections.


    # 15.7.1 Distress Selection


    Distress script randomly distorts a selection and is the basis for the Coffee
    script. This script has the following options:


    +   - Threshold. Controls the size change of the selection. 1 will enlarge the
    selection; 255 will shrink the selection.


    +   - Spread. Determines how much the selection spreads out. A higher value will
    give more random spreading.


    +   - Granularity. Determines the roughness of the selection. 1 will make the
    selection the roughest.


    +   - Smooth. Determines the amount of smoothing that occurs. This is done by
    the Gaussian Blur filter (see page 194).


    +   - Smooth Horizontally.


    +   - Smooth Vertically.


    # 15.7.2 Fade Outline


    This script fades anything outside a selection to transparency. This is useful
    for creating quick logos and icons. The following options are available with this
    script:


    +   - Border Size. Determines the amount of fading that occurs. The higher the
    number, the longer it takes to fade.


    +   - Apply Generated Layermask. Toggles whether to apply the layer mask or leave
    it unapplied.


    +   - Clear Unselected Mask Area. Clears anything outside the selected area.


    # 15.7.3 To Brush


    This script converts a selection into a GIMP brush. It uses the following options:


    +   - Description. The name that will appear in the Brush selection dialog.


    +   - Filename. The actual filename that will appear in your ~/.gimp directory.


    +   - Spacing. The default spacing of the brush.'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# 15.7.4 To Image


    This script creates a new image from a selection. The new image will be a single-layer
    image of the same type (for example, an RGB image with layers will become a single-layer
    RGB image). All other layers in the image are ignored. Any alpha will be replaced
    with the current background color. If the selection is not perfectly rectangular,
    anything outside the selection will be set to the background color in order to
    make the image rectangular. If you have multiple selections, To Image will fit
    all of them into a rectangular image, and set any outside areas to the background
    color.


    # 15.7.5 Round


    This script rounds the corners of a selection. The relative radius of the circle
    is entered here. The relative radius describes the radius of the corner circles
    relative to the height and width of the selection.


    # 15.8 Shadow


    The scripts found here create shadows of layers. These are extremely useful for
    logos and icons for Web pages.


    # 15.8.1 Drop Shadow


    This script simulates the layer floating above the background with its shadow
    appearing below. The following options are available with this script:


    +   - X Offset. Determines the distance the shadow is shifted in the x direction.

    - Y Offset. Determines the distance the shadow is shifted in the y direction.

    - Blur Radius. Determines the amount of blurring that occurs. Having a blur of
    0 means that the shadow is not blurred at all. This makes the object to have thickness.

    - Color. Determines the color of the shadow.

    - Opacity. Determines the opacity of the shadow layer.

    - Allow resizing. Allows resizing of the image. This option is rarely desirable.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_295_0.png)


    **Figure 15.6** A logo using a white drop shadow behind the text, and black drop
    shadow behind the base.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# 15.8.2 Perspective


    This script creates a shadow that simulates light shining from a distance, giving
    it a 3D look. The following options are available with this script:


    +   - Angle. Determines the angle at which the shadow is placed.

    - Relative Horizon Distance. Determines how far the object is away from the horizon.
    A larger value will make the shadow slightly wider because it is closer to the
    light source.

    - Relative Shadow Length. Determines how large the shadow is compared to the actual
    object.

    - Blur Radius. Determines the amount of blurring that occurs. Lower blur radii
    are better for this script compared to the Drop Shadow script.

    - Color. Determines the color of the shadow.

    - Opacity. Determines the opacity of the shadow layer.

    - Interpolate. Reduces jagged lines in the shadow.

    - Allow Resizing. Toggles resizing of the image on and off.


    # 15.9 Render


    These scripts draw onto an image. They can create some interesting effects used
    creatively.


    # 15.9.1 Make Grid System


    This script renders grid lines onto an image. The outcome of the script is determined
    in the. For both the x and y directions, the grid is described. They must be entered
    in the form ''<data>''. For example, an entry of ''(1 2) for the x direction and
    ''(1 3) for the Y direction creates the grid shown in Figure 15.7. The rows in
    the image are 1 unit wide, 2 units wide. The columns in the image are 1 unit wide,
    3 units wide. Another option to use is g, the Golden Ratio It is approximately
    equal to 1.618. You can also use the fraction 1/g, which is approximately equal
    to 0.618. The color and size of the grid lines depend on the current foreground
    color, and the currently selected brush.'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# 274 Script-Fu: Line Nova


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_297_0.png)


    Figure 15.7 A grid created with the parameters X: ''(1 2) and Y: ''(1 2).


    # 15.9.2 Line Nova


    This script creates supernova effects by drawing lines on an image. The following
    options are available with this script:


    +   * Number of Lines.

    * Sharpness. Determines how wide the lines are in degrees.

    * Offset Radius.

    * Randomness. Determines the randomness of the length of the lines.


    # 15.10 Xtns


    The following scripts are found in the <Toolbox>/Xtns/Script-Fu menu. They are
    standalone scripts, which means that they do not work on existing images—rather,
    they create their own. The scripts found here can create excellent logos and icons
    for Web pages.


    # 15.10.1 Logos


    There are many logos included with the GIMP. These are perfect for quickly creating
    logos for Web pages. Experiment with different fonts and options here to get in
    idea of what they can do. These scripts are also good to look at for help in creating
    your own script. The following logos are available with the GIMP:


    +   * 3D Outline. Creates a 3D outline of a text string.

    * Alien Glow. Creates a logo with a strange glow behind it.

    * Basic I. A basic blend logo with a drop shadow.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# Script-Fu: Patterns 275


    +   - Basic II. Another basic blend logo.

    - Blended. Creates a texture logo with a blend background.

    - Bovination. A text logo that looks as if it has been made from cowhide.

    - Carved. Creates a text logo that looks as if it has been carved in marble.

    - Chalk. Creates a logo that looks as if it has been drawn in chalk.

    - Chip Away. Creates a logo of raised text where the background has been chipped
    away.

    - Chrome. A basic chrome logo.

    - Comic Book. Creates a text that looks like writing from a comic book.

    - Cool Metal. Creates an excellent logo that looks as if it is being reflected
    off shiny metal.

    - Crystal. A logo that looks as if it has been made from crystal.

    - Frosty. Creates a sparkling logo.

    - Glossy. Creates a complicated script that creates excellent glossy text.

    - Glowing Hot. Creates a text logo that looks as if it is glowing hot.

    - Gradient Level. An interesting blended, beveled logo.

    - Imigre-26. Creates a text logo that looks as if it has been done roughly by
    hand.

    - Neon. Creates a glowing text logo.

    - SOTA Chrome. Another interesting text logo.

    - Starburst. A logo with a starburst inside it.

    - Starscape. Creates a logo with a starburst behind it, making it glow.

    - Particle Trace. Creates a logo that looks like a cutout of a particle tracing.

    - Text Circle. Creates a circle of text. This is one of the most useful logos
    here.

    - Textured. An interesting text logo with a textured background.

    - Web Title Header. A basic text logo for a Web page.


    # 15.10.2 Patterns


    The scripts in this section create tileable patterns for use as Web page backgrounds,
    or patterns for the GIMP. The following patterns are available:


    +   - 3D Truchet. Creates an interesting pattern made of curved tubes.

    - Camouflage. Renders a camouflage pattern.

    - Flatland. Creates a random pattern, more similar to lava than flatland.

    - Land. Creates a random pattern that looks like landmasses.

    - Render Map. Renders an image that looks like a map, with oceans and islands.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# 276 Script-Fu: Patterns


    +   - Swirl-Tile. Creates a tileable image that looks like swirling sand.

    - Swirly (Tileable). Creates a simple tileable image of several swirls.

    - Trochoid. Draws a colorful trochoid pattern, like something drawn by a sprograph.

    - Truchet. Creates a simpler truchet pattern than that of the 3D version.


    # 15.10.3 Web Page Themes


    These scripts create images with a common theme for a Web page.


    # 15.10.3.1 Alien Glow


    This theme is the same as the Alien Glow logo. It creates images that are backlit
    with a glowing color. There are four objects that can be created here:


    +   - Arrow. Creates an arrow for a navigation bar. It can go in four directions:
    ''right'', ''left'', ''up'', and ''down''.

    - Hrule. Creates a glowing horizontal bar, like the hrule in HTML.

    - Bullet. Creates a glowing bullet.

    - Button. Creates a button with text.


    # 15.10.3.2 Beveled Pattern


    This theme creates beveled objects.Various patterns can be used for the base—by
    default it is wood. Marble is another good pattern to use. Five different objects
    can be created with this theme:


    +   - Arrow. Creates an arrow for a navigation bar. It can go in four directions:
    ''right'', ''left'', ''up'', and ''down''.

    - Bullet. Creates a beveled bullet.

    - Button. Creates a simple beveled button with text.

    - Heading. Creates a larger text logo for a heading.

    - Hrule. Creates a beveled horizontal bar, like the hrule in HTML.


    # 15.10.3.3 GIMP.Org


    This theme creates the same images used on the GIMP''s Web site, http://www.gimp.org.There
    are a variety of scripts here. If you are serious about creating Web sites with
    an overall theme, use these scripts as a model to create your Script-Fu. There
    are six different objects that can be created here:


    +   - Big Header. Creates a large text header.

    - Small Header. Creates a smaller text header.

    - Tube Button Label. Creates a button label.'
