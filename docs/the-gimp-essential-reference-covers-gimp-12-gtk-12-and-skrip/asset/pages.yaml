  md: "# Using Peripherals: Configuring XFree86 for XInput\n\n# 9.2 Pen Tablets'\n\
    \nPen tablets are great pieces of hardware that can replace the mouse as the pointing\
    \ device. They are perfect when using the GIMP for drawing and doing touch-ups.\
    \ If you already have a pen tablet for your computer, chances are it is supported\
    \ in the GIMP. Not all functions may be available, but the basics, like pressure\
    \ and tilt, should be. This is a basic overview of how to use pen tablets with\
    \ the GIMP. For more detailed information, see Owen Taylor's page at http://www.gtk.org/~otaylor/xinput/howto/.\n\
    \n# 9.2.1 Supported Hardware\n\nThe first step is to make sure your pen tablet\
    \ is supported. The following devices are supported:\n\n+   - AceCad ADVANCEDDigitizer\
    \ tablets\n- Elographics touchscreens\n- Joysticks\n- MicroTouch TouchPen touchscreens\n\
    - SGI dial boxes\n- Summagraphics tablets\n- Wacom tablets:\n  a. ArtZ II series\n\
    \  b. ArtPad II\n  c. Pen Partner\n  d. PL300\n  e. Intuos series*\n\n# 9.2.2\
    \ Configuring XFree86 for XInput\n\nXFree86 must now be configured to recognize\
    \ the pen tablet. Make sure that the version of XFree86 installed on your system\
    \ is at least 3.3.4. If you have an older version, please upgrade. It is easiest\
    \ to do this through your distribution's package manager.\n\n> * Much of the information\
    \ here is paraphrased from the XInput HOWTO by Owen Taylor. http://www.gtk.org/~otaylor/xinput/howto/.\
    \ Copyright (c) 1997–1999 Owen Taylor.\n\n> *This is called the UltraPad series\
    \ in Europe.\n\n> *XFree86 3.3.1 includes an early version of an Intuos driver\
    \ with a number of bugs. For updated beta versions see http://www.lavien.com/free/linux_intuos.html."
  merge: -1
  pgno: 158
- img_proc: true
  md: "# 136 Using Peripherals: Configuring XFree86 for XInput\n\nIt is necessary\
    \ to edit your /etc/XF86Config file. This must be done as root. To be safe, a\
    \ backup of the file before you start to edit.\n\nThe following changes must be\
    \ made to the file:\n\n+   1. In the Section \"Module\", add the line Load \"\
    module.so\". It should look like this:\n```bash\n#Section \"Module\"\n#\n# This\
    \ loads the module for the Joystick driver\n#\nLoad \"xfb86Wacom.so\"\n#\n#EndSection\n\
    ```\n\nThe following modules are available:\n\n+   * xf86Dial.so-SGI Dial boxes\
    \ driver\n* xf86Jst.so-Joystick driver\n* xf86Summa.so-Summagraphics tablet driver\n\
    * xf86AceCad.so-Ace ADVANCEDDigitizer tablets driver\n* xf86Elo.so-Elographics\
    \ touchscreens driver\n* xf86Touch.so-MicroTouch Pen touchscreen driver\n* xf86Wacom.so-Wacom\
    \ pen tablet driver\n\n+   2. Now you must add the XInput entry to the file. Find\
    \ and add a new subsection for your hardware. It should look similar to this entry\
    \ for a Wacom Stylus:\n```text\nSection \"XInput\"\nSubsection \"WacomStylus\"\
    \n    Port `/dev/ttyS1\"\n    DeviceName \"Wacom\"\n    Mode Absolute\n    Suppress\
    \ 6\nEndSubsection\nSubsection \"WacomEraser\"\n    Port `/dev/ttyS1\"\n    Mode\
    \ Absolute\n    Suppress 6\nEndSubsection\nSection\n```\n\nRead the manage XF86Config\
    \ (type man XF86Config) for information about your specific hardware.\n\n# 9.2.3\
    \ Configuring GTK+ for XInput\n\nNow that XFree86 recognizes the hardware, GTK+\
    \ must be configured to recognize XInput. This is done by recompiling GTK+. (See\
    \ Appendix A for more information on compiling GTK+) Note that you do not need\
    \ to recompile."
  merge: -1
  pgno: 159
- img_proc: true
  md: '# Using Peripherals: Configuring GTK+ for XInput 137


    To recompile GTK+:


    +   1. Run the ./configure command, add the statement --with-xinput=xfree to any
    other options you need to compile GTK+.

    2. Type make.

    3. If the previous command completed without any errors, type make install &&
    ldconfig.


    You should now be able to restart the GIMP and try out your device. Follow these
    steps:


    +   1. Re-start the GIMP.

    2. Create a new image.

    3. Choose <Image>/Dialogs/Input Devices.

    4. Change the device mode from Disabled to Screen.

    5. Test the tablet by drawing some example lines.

    6. To check the settings of the available tools, click on <Image>/Dialogs/Device
    Status.'
