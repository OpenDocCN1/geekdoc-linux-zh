  md: '# Extending the GIMP: Themes


    Within each of these, there are five different states in which these attributes
    can exist:


    +   - NORMAL. The normal color of the attribute.

    - PRELIGHT. The color of the attribute when the cursor is placed over it.

    - ACTIVE. The color of the attribute when the mouse button is clicked.

    - INSENSITIVE. The color of the attribute when it cannot be clicked on.

    - SELECTED. The color of the attribute when it is selected.


    The style must then be applied to a set of widgets. Wildcards can be used to specify
    multiple widgets. Use the style "default" on all widgets, it would look similar
    to this:


    ```

    widget_class ** style "default"

    ```


    Learning everything within the gtkrc file is beyond the scope of this book. The
    best thing to do would be to experiment with there''s gtkrc file and see what
    you can do. For more information on the gtkrc file, look in your GTK directory
    in docs/. An HTML version of the tutorial can be found in docs/html/gtk_tut-21.html.


    # 7.3.2 Themes


    Themes can now be downloaded off the Internet. The best place to look is at http://gtk-themes.org/


    There are three different types of themes available:


    +   - gtkrc files, these simply replace the gtkrc file in your .gimp directory.
    They just change the colors of the various attributes.

    - Pixmap themes. Themes of this type use pixmaps to create a theme. In general,
    these are the best-looking themes. They use pixmaps installed in your home directory,
    and referred to in the .gtkrc file.

    - Theme engines. These are the most difficult to install. They require the GTK
    theme engine program, which is still being developed. As a result, these themes
    are not very stable.


    # 7.4 Hotkeys


    Hotkeys are very useful, and can save you a lot of time. It is very simple to
    assign hotkeys to specific tasks, and changes are effective immediately. All you
    need to do is place the cursor over the operation you want to assign a hotkey
    to, hold down the keystroke you want to use, and the hotkey will appear. It is
    saved when you exit the GIMP in the .gimp/menrc file. An example menrc file looks
    like the following:'
