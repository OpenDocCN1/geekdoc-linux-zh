    Figure 13.4 The Palette Selection window.


    # 13.3.1 Creating and Editing Palettes


    Palettes can be created two ways: manually, and from an indexed image

    (see “Saving Palettes,” page 65).'
  merge: -1
  pgno: 200
- img_proc: true
  md: '178 Brushes, Patterns, Palettes, and Gradients: Creating and Editing Palettes


    To create a palette manually, follow these steps:


    +   1. Open the Palette Selection menu.

    2. Click on Edit.

    3. Click on New Palette.


    You will be asked for a name for the new palette and this new palette will be
    created.


    +   4. To add colors to this palette, right-click on an empty position and choose
    New. This will add the currently selected color (either foreground or background)
    to the palette.


    To delete this color, right-click and choose Delete.


    Colors can also be edited in existing palettes:


    +   1. The color must be selected in the Edit menu by clicking on it.

    2. Right-click the color and choose Edit to bring up the Color Selection menu.

    3. Choose a new color and click OK. The old color will become the new color.


    These colors can be named in this menu as well. By default, they are called Untitled,
    but you can highlight and change them. If you have the Named_Colors palette installed,
    have a look at it for name suggestions.


    # 13.4 Gradients [Ctrl+G]


    Menu Location <image>/Dialogs/Gradient...


    Gradients are most often used with the Blend tool (see "Blend Tool," page 145),
    but they are occasionally used with Script-Fu. They can also be used with the
    Paintbrush tool. They give much more control over the colors in blends because
    you can control specific points for color and transparency changes.


    There are several ways to access the Gradient menu:


    +   ■ Clicking on <Image>/Dialogs/Gradient...

    ■ Clicking on <Toolbox>/File/Dialogs/Gradient...

    ■ Clicking on the displayed gradient in the Toolbox

    ■ Using the hotkey [Shift+Ctrl+B]


    To use a gradient that you have created, set the Blend to Custom (from Editor)
    in the Blend tool options.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# Brushes, Patterns, Palettes, and Gradients: Endpoints and Midpoints


    # 13.4.1 The Gradient Editor


    The Gradient Editor (see Figure 13.5) is very powerful and has many options:


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_202_0.png)


    Figure 13.5 The Gradient Editor menu.


    +   - Available gradients are listed on the left side (1) and displayed below.

    - Buttons for editing them are to the right (3).

    - Clicking on New Gradient (4) will make a new one. When you create a new gradient
    or copy an existing one, you will be prompted for a name.

    - The Refresh button (5) will re-read the gradients available on your system.

    - Zoom buttons (6) are located in the middle to zoom in or out.

    - Zoom All (7) will return the display to a 1:1 ratio.

    - Save Gradient (8) will save the gradient to disk.

    - Rename Gradient (9) will rename the gradient.

    - Save as POV-Ray (10) will save the gradient in POV-Ray format.

    - The Gradient menu is brought up by right-clicking in the gradient.


    Gradients are found in the <Gimp Directory>/share/gimp/gradients or in your personal
    gimp directory, "~/.gimp/gradients. The Gradient Editor can also be used as a
    simple palette, since clicking on a gradient will set it as the current color.


    # 13.4.2 Endpoints and Midpoints


    Gradients are changed by moving endpoints and midpoints. At the bottom of every
    gradient are black and white triangles. Black triangles represent endpoints and
    white triangles represent midpoints. When creating it it is important to note
    what part of it you are editing. This is shown by the dark gray band along the
    bottom.


    To add new endpoints, there are two options in the Gradient menu:


    +   - Split Segment at Midpoint. This will create two segments, with their endpoint
    where the old midpoint was, and two new midpoints.'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Brushes, Patterns, Palettes, and Gradients: Endpoints and Midpoints


    +   - Split Segment Uniformly. This will bring up a dialog box asking for the
    number of segments to split it into. You can create as many new segments as you
    choose.


    Adding new segments allows you to add more color changes in that area.


    You can move endpoints and midpoints by clicking and dragging with the mouse.
    The only points that cannot be moved are the endpoints on the extreme left and
    right. Holding down the Shift key while dragging causes any midpoints or endpoints
    inside the selection to compress or expand to keep the color blend constant. As
    note how the color blending shifts. Midpoints can also be centered through the
    menu by choosing Re-center Midpoints in Selection. Note that this does not adjust
    endpoints; this must be done with the Re-center Handles in Selection command.


    The current segment is shown with the gray band around the bottom. You can extend
    the segment by holding down the Shift key and clicking on the area you wish to
    extend it. Segments can be deleted by clicking on Delete Segment inside the menu.
    Segments can be flipped or duplicated in the Selection Operations portion of the
    menu.


    # 13.4.3 Colors in Gradients


    In this section, the various options for controlling colors are discussed. All
    of the options are accessed by right-clicking on the current gradient.


    # 13.4.3.1 Selecting Colors


    Several options are available for picking colors:


    +   - Choose a color from the selector by clicking on Left''s or Right''s Endpoint
    Color.


    +   - Load from the endpoint''s nearest neighbor (In the case of the extreme left
    endpoint, this is the extreme right endpoint, and vice versa).


    +   - Load from its own opposite endpoint. This is rather boring; it will make
    a constant color.


    +   - Load from the current foreground color.


    +   - Load from it a set of "bookmarks." There are 10 bookmarks available. By
    default they are somewhat boring colors, but you can replace them through the
    Save To option in the Gradient menu.


    # 13.4.3.2 Blending Type


    You can also change the blending type of the colors (by default, the type is Linear):


    +   - Curved. Emphasizes whichever endpoint color has greater length.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# Brushes, Patterns, Palettes, and Gradients: POV-Ray 181


    +   - Sinusoidal. The opposite of Curved; it emphasizes the endpoint color which
    has the least length.


    +   - Spherical (Increasing) and Spherical (Decreasing). The former emphasizes
    the color on the right, whereas the latter emphasizes the color on the left. These
    simulate the color being mapped to a 3D sphere.


    In the Selection Operations portion of the menu, there is an option to blend the
    endpoints'' color and opacity. This operation is performed over an extended selection
    with another endpoint inside it. You will lose the color of any endpoint inside
    the selection. Flip Segment reverses the colors inside the selection. Replicate
    allows you to clone the segment a specified number of times.


    # 13.4.3.3 Coloring Type


    The coloring type allows you to choose which color model the gradient uses to
    fade:


    +   - Plain RGB. Works in RGB space, and creates a gradient that you would expect.


    +   - HSV. Works in the HSV scheme, and creates a rainbow effect. You can choose
    either a clockwise or counter-clockwise direction.


    # 13.4.4 POV-Ray


    POV-Ray is an Open Source 3D ray-tracing program available on the Internet. The
    Gradient Editor allows you to save the gradient you created in a form that POV-Ray
    can understand. This is very useful because creating the gradients by hand is
    time consuming. Trying POV-Ray is highly recommended—it creates excellent images.


    To save a POV-Ray gradient, simply click on the Save As POV-Ray button in the
    Gradient Editor menu. This will save the gradient in ASCII format, which is compatible
    with POV-Ray.'
  merge: -1
