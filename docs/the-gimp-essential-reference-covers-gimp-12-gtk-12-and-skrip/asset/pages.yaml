  md: '# Using Peripherals: Using Sane


    # 9.1.1 Installation of XSane


    To install Sane and XSane, follow these steps:


    +   1. Download the latest version of Sane from their Web site (http://www.mostang.com/sane).

    2. Unpack the package into your /usr/local/src directory.

    3. Enter the Sane directory and type ./configure.

    4. Type make.

    5. If the previous step ran without any problems, change to root and type make
    install. This will install the files into /usr/local/bin and /usr/local/lib directories.
    Configuration files are installed into /usr/local/etc/sane.

    6. Edit your /etc/ld.so.conf to include the line /usr/local/lib/sane. Then type
    ldconfig.

    7. Create a symbolic link for your scanner device to the scanner device: cd /dev
    && ln -s sg scanner

    8. Download the XSane package from http://www.wolfsburg.de/-/sane/sane-xsane.html.

    9. As a non-root user, unpack the package into your /usr/local/src directory.

    10. Type ./configure && make.

    11. If the previous step was successful, change to root and type make install.

    12. Copy the XSane binary to ~/gimp/plug-ins directory.

    13. Restart the GIMP.


    # 9.1.2 Using Sane,


    The best way to use Sane is through the XSane front-end. It is found in the <Toolbox>/Xns/XSane.
    A listing of the devices will be displayed here. When the device is clicked on,
    the screen similar to figure 9.1 appears. Depending on the device you are using,
    not all options will be available to you.


    > * This program is fairly straightforward. It can be built on almost any Unix
    system. If the configure script does not detect GTK+, you will need to fix this,
    since the xsummage package is required. This is usually caused by GTK+ installed
    in a non-standard location. You may need to add -gtk-prefix=<Path to GTK+>.

    * In this description, it is assumed that you have the appropriate device connected
    to your system, and support for it is compiled in the kernel. If not, recompile
    the kernel or load the appropriate module. Replace /dev/sg0 with the correct device
    file for your scanner.

    * Like the Sane package, this program can be built on almost any Unix system.
    If the configure script does not detect GTK+, you will need to fix this. This
    is usually caused by GTK+ installed in a non-standard location. You may need to
    add --gtk-prefix=<Path to GTK+>. If the program still refuses to compile and you
    are sure that GTK+ is installed correctly, add --disable-gtktest to force compilation.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# 134 Using Peripherals: Using Sane


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_157_0.png)


    When using XSane within the GIMP, usage is fairly simple:


    +   1. Choose the color mode (1).

    2. Choose the scanner type (2).

    3. Choose the resolution (3). See “Resolution,” page 6.

    4. Choose the gamma correction (4).

    5. Choose the amount of brightness adjustment (5). See “Brightness and Contrast,”
    page 59.

    6. Choose the amount of contrast adjustment (6). See “Brightness and Contrast,”
    page 55.

    7. Click on the preview window (7) to select the area you wish to scan.

    8. When you are ready to scan, click the Start button (8). The image will be automatically
    transferred to the GIMP.


    XSane is a new program that is still under development, so options may change
    between different versions. There is additional documentation found in your /usr/local/share/sane
    directory describing use of XSane without the GIMP.'
