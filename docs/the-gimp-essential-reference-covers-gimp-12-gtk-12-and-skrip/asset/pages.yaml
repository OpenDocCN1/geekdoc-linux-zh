  md: '# Performance: DEC Alpha Options


    +   - 1586

    - 1686

    - pentium

    - pentiumpro

    - k6


    If you use the -mcpu option, it will produce code that is optimized for the specific
    processor, but it will still run on other processors. If you use -march=cpu type,
    it generates cpu-specific code, and will not run on other processors. The options
    are the same for the -march option as the -mcpu option.


    Using -align-double will produce code that runs somewhat faster on a Pentium at
    the expense of more memory.


    # 8.1.5 DEC Alpha Options


    The following options are available when compiling on a DEC Alpha machine. Use
    -mcpu=cpu_type to produce code that is optimized for the cpu_type. Supported values
    for cpu_type are:


    +   - ev4

    - 21064

    - ev5

    - 21164

    - ev56

    - 21164a

    - pca56

    - 21164pc

    - 21164PC

    - ev6

    - 21264


    # 8.2 Memory and Swap Space


    The GIMP is a memory-intensive program. Working with high-resolution images can
    take up a lot of memory, especially when there are multiple layers. Having swap
    space on your system allows you to use the hard drive as virtual memory, which
    is cheaper than standard memory, although slower.'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'There are several conventions dealing with memory for the GIMP:


    +   * Use at least 64MB of RAM. Anything less will lead to constant swapping while
    using the GIMP.

    * Older kernels could only handle up to 127MB of swap space. Kernels 2.2 or newer
    can handle higher amounts, so take advantage of this.

    * Swap space should be at least as big as the physical RAM in your system. Problems
    will arise when working with large images if there is too little swap space.

    * The GIMP also uses ~/.gimp directory for swap files. If you find that you are
    running out of memory, make sure you are not running out of space on that partition.

    * The GIMP''s Tile Cache Size can be increased to keep it from using memory for
    other applications. This is found in the Performance menu.


    # 8.3 X Optimizations


    The Windowing System is probably the most resource-intensive program that will
    run on a system. There are many different ways of improving the performance of
    X. The following suggestions should help X performance:


    +   * Run the appropriate X server. There are many X servers available, so make
    sure you are running the correct one.

    * Run at the minimum bit-depth needed. Most people will not notice a difference
    between 24 and 32 bits per pixel (bpp). For even faster performance, run at 16bpp.

    * Use a lighter-weight window manager. Blackbox and icewm are two good window
    managers that are very fast. Fvw and twm are also small, but are somewhat older.
    If you are having performance problems, KDE, Gnome, or Enlightenment with complicated
    themes—they are resource hogs.

    * Disable background images. Or use small tileable ones with a small amount of
    colors.


    > ^Additional information can be found in the monthly FAQs posted in the comp.windows.x
    newsgroup.'
