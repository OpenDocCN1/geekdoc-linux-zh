  md: '# GIMP

    ESSENTIAL REFERENCE


    For web designers and developers, graphics designers, and other Linux/UNIX users
    who want to work with digital imagery, the GNU Image Manipulation Program (GIMP)
    is the open source alternative to proprietary software. However, information on
    using the GIMP has been scarce—until now. GIMP Essential Reference provides everything
    you need to know to become proficient in the use of this popular open source graphics
    software.


    From detailed installation and navigation instructions to descriptions of toolbox
    features and explanations of layers and channels, this book focuses on helping
    professionals learn how to efficiently and effectively use the GIMP. Because the
    GIMP runs on many UNIX systems, this book provides you with information on downloading,
    installing, using, troubleshooting, and enhancing GIMP on Linux.


    Alex Harford is an electrical and computer engineering student at the University
    of British Columbia. An Internet veteran and experienced Linux user, he has been
    using the GIMP for all of his web development work since being introduced to UNIX
    and Linux while working at Dowco.Com Internet. He is a member of the Vancouver
    Users Group.


    GNU / Linux / GIMP


    you use the GIMP to create digital pages, GIMP Essential Reference explains how
    to:


    Install and navigate GIMP on a UNIX or Linux system


    Get concise, practical knowledge of the GIMP’s toolbox features


    Manipulate your images more effectively with the pragmatic descriptions of selection
    tools and the section on advanced selection techniques


    Maximize the power of the GIMP with layers and channels


    Get customized with Script-Fu by learning the basics or utilizing the scripting
    appendix for quick reference


    View before and after images for every major filter so you know what to expect
    before you click


    Understand what file formats GIMP offers and which one is for the job


