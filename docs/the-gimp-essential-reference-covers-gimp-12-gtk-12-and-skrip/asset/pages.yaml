    ```

    (maxPixel (max 1 maxPixel))

    (totalFrames (max 1 totalFrames))

    (delta (/ maxPixel totalFrames))

    (framesleft totalFrames)

    (image (car (gimp-channel-ops img)))

    (base-layer (car (gimp-get-active-layer image))))

    )

    ```


    This function accomplishes several things:


    +   - Makes maxPixel and totalFrames are greater than 1.


    +   - Declares the variable delta and initializes it to maxPixel divided by totalFrames.


    +   - Declares the variable framesLeft and initializes it to totalFrames.


    +   - Declares a new variable image and sets it to be a duplicate of the active
    image passed to the script by the GIMP.


    +   - Declares the variable base-layer and initializes it to be the active layer
    in image.


    # 6.3.4.3 Pixelization


    Now we must decide how we will deal with the actual pixelization. This is done
    with a while loop and a let* function:


    ```

    (while ( > framesLeft 1))

    (let*

    (

    (pixel-layer (car (gimp-layer-copy base-layer TRUE)))

    (layer-name (string-append "Frame " (number->string framesLeft)))

    )


    (gimp-image-add-layer image pixel-layer (- totalFrames framesLeft))

    (gimp-layer-set-name pixel-layer layer-name)


    (plug-in-pixelize

    TRUE

    image

    pixel-layer

    maxPixel

    )

    (set! framesLeft (- framesLeft 1))

    (set! maxPixel (- maxPixel delta))

    )

    ```


    The while loop runs if the number of frames is greater than 1. If it is, it goes
    into the let* function. This function declares two new variables:


    +   - pixel-layer. This is a copy of the base layer.


    +   - layer-name. This simply sets the variable to its corresponding frame number.


    The function adds the new layer to the image and puts it in the correct position
    by subtracting the total number of frames by the left. It renames the layer to
    layer-name.'
