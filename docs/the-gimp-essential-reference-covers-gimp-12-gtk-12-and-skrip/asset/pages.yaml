  md: '# # 3

    Layers and Channels


    | Page | Contents |

    |---|---|

    | 38 | **The Layers Window and Channels Window** |

    | 38 | Layout of the Layers Window—A description of the Layers window, which controls
    the different layers in an image. |

    | 39 | Layout of the Channels Window—A description of the Channels window, which
    controls the Red, Green, and Blue parts of an image, and also controls selection
    masks. |

    | 40 | **Layer Operations** |

    | 40 | Viewing Individual Layers—How to view specific layers of an image for precise
    image manipulation. |

    | 41 | *Adding and Deleting Layers*—How to add and remove layers in an image.
    |

    | 42 | *Moving Layers and Scaling Layers*—How to resize and scale layers. |

    | 42 | *Merging Layers*—How to combine two or more layers into one. |

    | 43 | *Flattening Images*—Information about flattening images into one final
    layer. |

    | 44 | *Modes*—A description of the various modes of combining layers to create
    different effects. |

    | 46 | *Transparency and Alpha Channels*—Information about using transparency
    (also called Alpha) in an image. |

    | 47 | *Layer Masks*—Using layer masks to precisely control transparency in an
    image. |

    | 48 | **The Channels Window** |

    | 48 | *Working in Specific Channels*—How to affect only certain combinations
    of the Red, Green, and Blue channels. |

    | 48 | *Channel Operations*—The various operations that can be performed on channels.
    |

    | 49 | *Selection Masks*—Using selection masks to create very detailed selections.
    |'
