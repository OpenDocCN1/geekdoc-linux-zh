  md: '# 280 Installing GIMP: Installing RedHat Packages


    Installation of the GIMP can be a difficult and frustrating task for someone who
    is new to Linux or Unix many libraries are required before you can begin to install
    the GIMP. Most Linux distributions come with the GIMP pre-installed. If you wish
    to run a "bleeding-edge" version of the GIMP or its libraries, the information
    in this appendix is essential. Although binaries, RPMs, or DEBs of the GIMP are
    available, you will also learn how to install from the source code to fully customize
    the GIMP.


    All of these programs must be installed by the root user to be available to everyone.
    If you do not have root access to your computer, ask your system administrator
    to install the programs. If you cannot do, it is possible to install the GIMP
    for your own use, but it becomes complicated. Binary installations are not covered
    here because not all of the required libraries are available for every Linux distribution.
    Source code can be compiled on almost every Linux system in existence today.The
    major Linux distributions will be able to install these programs. If you are using
    a distribution other than one of the "standard" Linux distributions—Slackware,
    RedHat (its derivatives), Debian, SuSE, and Caldera—you may need to do some additional


    Warning—due to many distributions and versions available, this appendix cannot
    cover every system variation. Read the README and INSTALL files very carefully
    before installing any software. Be careful when using a package manager to install
    packages automatically.


    # A.1 Installing RedHat Packages


    The RedHat Package Manager (RPM) is a program that allows you easily install software
    packages. Most RedHat distributions come with all of the required libraries so
    you must install only the GTK, glib, and GIMP packages. The glib and GTK packages
    are found here:


    ```

    ftp://ftp.gimp.org/pub/gtk/binary/RPM/

    ```


    Enter the correct directory for your system (for example, "i386" for Intel systems).
    Download the two latest package files. Next, go to the GIMP package, found here:


    ```

    ftp://ftp.gimp.org/pub/gimp/binary/RPM/

    ```


    Download the latest version of the GIMP that is in this directory. Installing
    these packages is fairly simple:


    +   1. Type rpm -ivh glib.<version info>.rpm to install glib.


    +   2. Type rpm -ivh gtk.<version info>.rpm to install GTK.


    +   3. Type rpm -ivh gimp.<version info>.rpm to install the GIMP.


    If you already have older versions installed, use rpm -Uvh instead of rpm -ivh.'
  merge: -1
  pgno: 303
- img_proc: true
  md: '```

