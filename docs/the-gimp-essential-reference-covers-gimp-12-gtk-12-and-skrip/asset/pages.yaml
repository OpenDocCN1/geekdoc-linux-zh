- img_proc: true
  md: '+   Edges (3). The edges can be treated with the following effects:


    +   a. Wrap. This uses the peaks of the ripples to fill in the valleys.


    +   b. Smear. This just fills in the empty areas by using the colors of the surrounding
    areas.


    +   c. Black. This simply uses black to fill in the valleys.


    +   Orientation (4). The waves can be horizontal or vertical.


    +   Wave Type (5).


    +   a. Sawtooth. This wave has sharp peaks and valleys.


    +   b. Sine. The sine curve wave is smooth.


    +   Period (6). This determines the distance between two peaks of a wave.


    +   Amplitude (7). This changes the height of the waves.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_239_0.png)


    # 14.6.8 Shift


    The Shift filter randomly displaces rows or columns of pixels in an image. This
    can create an interesting noise effect, especially if you apply it both horizontally
    and vertically.


    The options for the Shift filter are fairly simple. The displacement can be done
    either horizontally or vertically. The shift amount provides the filter with an
    average density to move. The exact shift is never known, but it will be close
    to the average density.


    # 14.6.9 Value Propagate


    Value Propagate is a versatile filter that adjusts the values for an image. This
    could include increasing the levels of white or black, changing the amount of
    midtones, or adjusting the amount of transparency. The number of pixels modified
    can be'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'changed as well. For the best results, run this filter several times with the
    same settings. This will give you some engaging artistic effects.Value Propagate
    has many different options, as follows:


    +   - Distortion Type\¹


    +   a. More White. Increases the whiteness of an image by increasing the value
    for pixels with higher values. This makes brighter pixels whiter.


    +   b. More Black. Does the opposite of More White by darkening the already darker
    pixels. These first two options work well with photographs, but not with computer-generated
    images.


    +   c. Middle value to Peaks. Causes contrasting areas to become fuzzy averaging
    the color.


    +   d. Foreground to Peaks. Locates the pixels and replaces them with the foreground
    color. This has the effect of drawing borders around images.


    +   e. Only Foreground. Alters the values for pixels that match the current foreground
    color.


    +   f. Only Background. Does the same thing as Only Foreground, but uses the background
    color.


    +   g. More Opaque. Works similarly to More White, but deals with Alpha. The Alpha
    values of pixels with already high Alpha are increased.


    +   h. More Transparent. Does the opposite of More Opaque. Pixels with already
    low Alpha values are lowered further.


    +   - Available pixels to be altered. The available pixels can be constrained
    by entering new values into the Low and High thresholds. If a pixel is outside
    this threshold, it will not be affected. The amount of propagation can be adjusted
    with the Propagating Rate slider bar.


    +   - Direction of propagation. When this filter is used, the pixels are shifted
    slightly. Normally, this does not have effect because by default they are shifted
    in all four directions. When fewer than four directions are selected, the filter
    has a lesser effect, and it shifts the image slightly in a certain direction.
    Any combination of these directions can be selected to achieve the desired effect.


    The following directions are available:


    +   a. Left


    +   b. Right


    +   c. Top


    +   d. Bottom


    ²Options through h work better with computer-generated images because they all
    work by finding larger contrast, similar to the Edge Detection filters.'
  merge: -1
