    # 14.6.7 Ripple


    Ripple (see Figure 14.54) is a straightforward filter that distorts an image to
    look like a reflection in rippling water. Rippling can be done horizontally or
    vertically, and has many other options, as follows:


    +   - Antialiasing (1). This option greatly improves the quality of an image,
    but takes more time to use.


    +   - Retain Tileability (2). This option is useful if you are working with an
    image that is going to be a background for a Web page, desktop, and so on.'
  merge: -1
