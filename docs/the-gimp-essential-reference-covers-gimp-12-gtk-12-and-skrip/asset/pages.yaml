  md: '# Installing the GIMP: Building and Installing the Development Version of the
    GIMP


    # Using Multiple Versions of the GIMP


    Sometimes you will want to have two versions of the GIMP installed on your system—one
    version for all the new, cool features, and the other for daily work.


    # A.5.3 Building and Installing the Development Version of the GIMP


    the development version of the GIMP comes with many improvements over the older,
    stable version. It sacrifices stability to do this, so don''t be surprised if
    it crashes or doesn''t even compile. It can be downloaded from here:


    ```

    ftp://ftp.gimp.org/pub/gimp/unstable

    ```


    There will be two directories at this location. The latest version of the GIMP
    will be in the numbered directory—for example, 1.1.8/. The directory old contains
    all of the previous development versions. Only use packages from this if you are
    having problems with the latest version. Download and unpack the latest package
    into /usr/local/src. Change into the new directory and type the following:


    ```

    ./configure --enable-debug=no --prefix=/usr/local/gimp-1.1.6

    ```


    When the configure script has finished setting up the GIMP for your system, type
    the following:


    ```

    make && make install

    ```


    If you encounter problems during the compilation, you may need to install the
    gettext package, or use the one provided by the GIMP. This can be done by appending
    --with-included-gettext to the configure script that was previously run. Installing
    the gettext package from the GNU site may be the better choice. The latest version
    can be found here:


    ```

    ftp://ftp.gimp.org/pub/gimp/gettext/

    ```


    Alternatively, if you do not need native language support, append --disable-nls
    to the configure script. After the configure script has completed, type the following:


    ```

    make && make install

    ```


    When the GIMP has completed building, you must make the system aware of the new
    library files. There are two methods you can use:


    +   Edit the /etc/ld.so.conf file. This is the easiest method if you have superuser
    access. Simply add the /usr/local/gimp-1.1.6/lib directory to the /etc/ld.so.conf
    file. Save the file and then type the following:

    ldconfig -v more'
