- img_proc: true
  md: '64 Histograms—Using histograms to learn about the color information in an image.


    65 Saving Palettes—Saving palettes for future use.


    65 Image Transforms—Various image transformation operations such as resizing and
    cropping.


    +   65 Resizing Images

    66 Scaling Images

    66 Autocrop

    66 Zealous Crop

    66 Image and Layer Rotations


    If you have a scanned image, or you have drawn an image that needs tweaking, the
    Image menu has many useful operations. These operations are performed on the active
    layer or selection. Some operations like RGB or Indexed are performed on the entire
    image.


    # 4.1 Colors


    The Colors menu involves operations that adjust the color balance in an image.
    These are very useful for improving the quality of scanned images. Operations
    in this menu are often the first used on photographs.


    # 4.1.1 Equalize


    Equalize fixes the color in an image if it is too bright or too dark. It will
    find the lightest color in an image and make it white, and it will find the darkest
    color and make it black. Equalize should not be used on images that are of good
    quality, but rather one has a lot of light or dark areas. This operation may end
    up decreasing the quality of the picture, and additional adjustments are usually
    required. Figures 4.1 and 4.2 provide a (somewhat insufficient) grayscale example
    of Equalize.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_75_0.png)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_75_1.png)'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# 4.1.2 Invert


    The Invert operation is very simple. It inverts the colors in the active layer
    or selection. The black pixels are changed to white and white pixels are changed
    to black. Colors become their opposite on the palette. Figures 4.3 and 4.4 give
    an example of the Invert operation.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_76_0.png)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_76_1.png)


    # 4.1.3 Posterize


    Posterize changes the image to look like an indexed image, without changing the
    image type (see "Image Types," page 62). The number of levels entered in the dialog
    box determines the number of colors for each channel. Posterize affects grayscale
    and RGB images in several different ways:


    +   - For grayscale images, the number of levels determines the number of shades
    of gray.

    - For RGB images, the number of levels determines the number of shades in each
    channel(see "Channels," page 38). This means that for a level of 2x2x2=8 colors
    in images.


    This operation is not normally used to improve a scanned image because it does
    not produce accurate colors. It is usually used to add an interesting effect to
    an image. Figures 4.5 and 4.6 give an example of Posterize.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_76_2.png)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_76_3.png)'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# 4.1.4 Threshold


    Threshold displays a histogram representing the brightness in an image, as shown
    in Figure 4.7. The greater number of pixels with a certain intensity, the higher
    the bar at that position. Brightness is selected by dragging the mouse over the
    histogram (1), or entered with the keyboard. It is best to fine-tune the selection
    by entering values in the dialog boxes (2) above the graph. This creates a true/false
    image, in which each selected brightness is white, and each unselected one is
    black.(This operation can produce interesting images, but it is usually more useful
    to create a copy of the image layer and use Threshold on that.)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_77_0.png)


    **Figure 4.7** An example of a threshold and the histogram.


    # 4.1.5 Color Balance


    Color Balance is used for fine-tuning the color levels in your image. There are
    three sliders for each of the three brightness levels in the Color Balance menu:


    +   * Cyan/Red

    * Magenta/Green

    * Yellow/Blue


    You can adjust the fine-tuning by entering values in the dialog boxes above the
    sliders. Moving all three sliders towards the CMY (Cyan, Magenta, Yellow) colors
    will darken the image, whereas moving the sliders towards the RGB colors will
    lighten the image.


    The option buttons at the bottom of the menu let you choose which pixels to adjust
    by their brightness:


    +   * Shadows. Adjusts only the darkest pixels.

    * Midtones. Adjusts the middle pixels.

    * Highlights. Adjusts only the lightest pixels.


    Preserve Luminosity keeps the intensity, or brightness, for each pixel fixed,
    can produce some strange images when adjusting the color balance by large amounts.'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# 4.1.6 Brightness and Contrast


    Adjusting the brightness and contrast in a scanned image is very useful, The Brightness
    and Contrast sliders are centered at zero, and can be adjusted either way. Either
    can be fine-tuned by entering values with the keyboard. This operation is very
    straightforward. Figures 4.8 through 4.11 offer visual examples.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_78_0.png)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_78_1.png)


    Figure 4.8 The original picture.


    Figure 4.9 The image after brightness and contrast have both been increased by
    90.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_78_2.png)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_78_3.png)


    Figure 4.10 The image after brightness is set to 90, and/contrast to -90.


    Figure 4.11 The image after brightness is set to -90, and contrast to 90.


    # 4.1.7 Hue and Saturation


    Hue and Saturation operation works in the HSV model (see “Color Models,” page
    5). It adjusts the Hue, Saturation, and Lightweight (Value) of an image. By default,
    the Master option button is checked, which means the operation is performed on
    all colors. Single colors can be adjusted by clicking on their option buttons.
    Note that adjustments to the Master option button and specific colors can be done
    at the same time.


    The following options are available with this operation:


    +   * Hue. A slider that rotates the color. It can be rotated from -180 to 180
    degrees. 0 degrees is the default setting.'
  merge: -1
  pgno: 78
- img_proc: true
  md: Figure 4.12 The Curves menu with a good S-shaped curve.
  merge: -1
