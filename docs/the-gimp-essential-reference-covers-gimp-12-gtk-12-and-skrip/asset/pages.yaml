  md: '# Extending the GIMP: TrueType Fonts


    This will set the fonts for the current X session only. To make these fonts available
    to all users, you must edit the /etc/XF86Config file. Look for the line that contains
    the word FontPath. There will be a listing of directories pointing to the location
    of various fonts. They are all separated by commas. Add the directory /usr/X11/lib/fonts/freefont
    to this list. Remember to separate the new entry with a comma. Once these changes
    have been made, you will need to restart your X server to read the changes.


    Now this program will be run whenever you start your X System, and the fonts will
    be available. This process should work for any set of fonts for Unix that you
    download off the Internet. Just replace the Freefont name with the name of the
    font package you downloaded. One exception is TrueType fonts, which need a lot
    of additional setup.


    # 7.1.2 TrueType Fonts


    TrueType font support can be added to your X server, which allows the GIMP to
    use them. TrueType fonts provide better detail in the various sizes, and are widely
    used in the computing environment, not just the Unix community. There are two
    ways of adding TrueType support:


    +   * Patch server. The patches for TrueType fonts are found at http://www.ds.ed.ac.uk/home/jec/programs/xfsft/.
    These patches use a rendering program at http://www.physiol.med.muenchen.de/robert/freetype.html.
    This is a very large undertaking even for someone who is experienced in Linux,
    as it requires rebuilding your X server, a process that is beyond the scope of
    this book.


    +   * Use the Xifft server. This is an external font server that can be run separately
    from your X server. This server can be found in the ftp://ftp.metalab.unc.edu/pub/Linux/X11/fonts/
    directory. It will have the name xifft-<version number>.tar.gz. This program is
    as complicated to install, and is beyond the scope of this book.


    # 7.2 Plug-Ins


    Plug-ins are essential to the GIMP. Almost every function performed in the GIMP
    is done through a plugin. Plug-ins are programs that are run by the GIMP to perform
    some sort of operation. This makes it very easy to add new features. There is
    a registry for plug-ins on the GIMP''s Web site, located at http://registry.gimp.org/.
    You can find the latest version for every plug-in ever used in the GIMP. You may
    find plug-ins that will be useful for you, or new plug-ins that are under development.
    Subsequently, they are not included in the stock GIMP distribution. The two plug-ins
    to download if you are using the stable version of the GIMP are the GIMP Animation
    Plug-In (GAP), and'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# Extending GIMP: Adding Plug-Ins


    ImageMap. ImageMap is an extremely useful and well-designed plug-in that will
    make your life much easier if you need to do complicated HTML ImageMaps (refer
    to the ImageMap Plug-In, page 113). GAP has a better interface for creating complicated
    animations.


    # 7.2.1 Adding Plug-Ins


    Now that you''ve checked out the plug-in registry and have a pile of new plug-ins
    to try, you need to install them. This is done with a small program called gimptool.
    Gimptool is located in the same directory as the GIMP binary. After you have downloaded
    a plug-in from the registry, you will probably need to uncompress it. If it is
    a single file, it is very straightforward to build and install. If it consists
    of a number of files, it most likely includes a मायने, which will try to make
    your life easier.


    If you encounter difficulties with installation, it may be that you have downloaded
    a plug-in for the wrong version of the GIMP. Always read the README and INSTALL
    files that are (hopefully) included with a plug-in before installing it. Check
    the homepage of the plug-in for any additional instructions.


    # 7.2.1.1 Building a Single File


    When building a single file, type the following:


    ```

    gimptool --install <plugin-in.c>

    ```


    This will compile and install the plug-in into your .gimp/plug-ins directory.
    If you are concerned about keeping the binary as small as possible, type the following:


    ```

    gimptool --install-strip <plugin-in.c>

    ```


    This will strip the debugging information from the binary and make it run slightly
    faster.


    When gimptool is used this way, the plug-in is installed into your personal directory
    only. If you want other users to be able to use it, use --install-admin instead
    of --install.


    # 7.2.1.2 Installing with a Makefile


    If you have a plug-in that comes with a makefile, you should be able to type the
    following to install the new plug-in:


    ```

    make aa install

    ```


    # 7.2.1.3 Installing Scripts


    If you downloaded a script, gimptool is again used to install it. Just type the
    following:


    ```

    gimptool --install-script <script.scm>

    ```'
