    +   ■ SF-IMAGE. Used in the form of SF-IMAGE "Image Name" 0.

    ■ SF-DRAWABLE. Used in the form of SF-DRAWABLE "Drawable" 0.

    ■ SF-VALUE. An older, generic way of assigning variables. GIMP 1.1 introducednbetter
    methods to do this. Avoid using SF-VALUE.

    ■ SF-COLOR. Used in the form of SF-COLOR "Color Name" (R G B),

    R, G, and B values from 0 to 255.

