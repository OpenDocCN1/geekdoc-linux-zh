- img_proc: true
  md: '# Image Transformation Tools: The Magnify Tool


    Image transformation tools perform operations on images, but do not actually draw
    on images. These tools are used after the basic image has been created, or on
    scanned images after the color has been corrected. Generally speaking, the most
    useful of the Clone tool (page 165). Some new tools added in GIMP 1.2 are also
    useful: Dodge and Burn, Smudge and Burn lets you work with brightness values in
    pixels; it can be applied with a brush. Smudge turns an image into finger paint,
    and allows you to drag the paint with a brush.


    As always, the Options menu for each tool is accessed by double-clicking on the
    tool''s icon in the Toolbox.


    # 12.1 The Magnify Tool


    | Description | The Magnify tool enlarges or shrinks the image for viewing more
    or less precise areas, respectively.


    | Allow Window Resizing | This option automatically resizes the window to the
    image size upon zooming. This option is useful for working on images that fit
    on the monitor, but should be turned off when working on very large images.


    | Zoom Out | Hold down the Shift key while clicking to zoom out.


    | Zoom Box | Click and drag the mouse to zoom in to a specific area.


    | Usage | Clicking on the image zooms in. Note that Undo and Redo do not affect
    zooming. To zoom in on a specific area, click and drag a box over the area. Note
    that Undo and Redo do not affect zooming—all zooming (or un-zooming) must always
    be done with the Zoom tool.


    > See Also "Preferences" (page 16), "Window Operations" (page 20), and "Undo/Redo"
    (page 16)


    # 12.2 The Transform Tool


    | Description | The Transform tool performs several different operations on an
    image: rotation, scaling, shearing, and perspective.


    | Rotation | Rotates the layer inside the canvas. Holding down the Ctrl key constrains
    it to 15-degree intervals. Specific information about using this tool is found
    in the following "Usage" section.'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# Image Transformation Tools: The Transform Tool


    163


    # Scaling


    Scales the image inside the canvas. This is similar to Scale in the Image menu,
    except it only acts on the active layer. Holding down the Shift key while dragging
    keeps the height constant, whereas holding down the Ctrl key keeps the width constant.
    Holding down both keys at the same time keeps the height/width ratio constant.
    Specific information about using this tool is found in the following "Usage" section.


    # Shearing


    Distorts the image in the X or Y axis. This transform is analogous to folding
    a cardboard box flat, only the length of the sides can change. This can only be
    done to one axis at a time. The chosen axis is determined by the direction in
    which the mouse is first moved. Specific information about using this tool is
    found in the following "Usage" section.


    # Perspective


    Adjusts the perspective of the current layer. Each corner can be adjusted independently,
    for very interesting and potentially unrealistic perspectives to be created. Specific
    information about using this tool is found in the following "Usage" section.


    # Tool Paradigm


    +   This determines how the movement of the border affects the image. There are
    two options here:

    * **Traditional** This option is straightforward. It transforms the image to fit
    the border to which it has been dragged. Rotation and Shearing Scaling and Perspective
    usually use this option as well.

    * **Corrective** This option is used to correct an image that needs fixing. It
    does the reverse of Traditional mode by transforming the new border to fit the
    old border. For example, if there is a scanned photograph that is crooked, it
    can be fixed in this mode. Simply drag the border in Perspective mode to the correct
    shape. When the Transform button is clicked, it will stretch this new border into
    the old one, making the photo perfectly straight. This mode is usually only in
    Perspective mode, but it can be used in other modes.


    # Smoothing


    This option works like anti-aliasing: It makes jagged edges smoother. It works
    on all types of transformations.


    # Show Path


    This option shows the last path created during the transformation.


    # Show Grid


    This option turns on the grid inside the transform border.'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# Grid Density


    This option defines the grid density if the grid is turned on. For larger images,
    use a lower grid density. This value ranges from 0 to 5.


    # Clip Result


    This option, when selected, will keep the layer same size, and lose any information
    outside the layer. If it is not selected, the layer will be as large as needed.


    # Usage


    Each part of the Transform tool has similar usage. When the tool is chosen, the
    layer must first be clicked on. Small boxes will appear in the corners of the
    active layer. Clicking and dragging the corners will adjust the image. All four
    corners can be used for these transformations.


    GIMP 1.2 comes with an improved interface for this tool. For each mode, there
    is an Information window that pops up. This gives the necessary information for
    the tool.


    Keyboard and mouse input can be used to make it much more precise. When the information
    has been input, clicking on the Rotate, Scale, Shear, or Transform button will
    start the transformation. To discard the changes, click on the Reset button.


    > See Also "Resizing and Scaling" (page 42)


    # 12.3 The Flip Tool [Shift+F]


    # Description


    The Flip tool mirrors the active layer either horizontally or vertically.


    # Options Horizontal


    Flips images horizontally. The arrow will turn into a double-headed arrow aligned
    horizontally.


    # Vertical


    Flips images vertically. The arrow will turn into a double-headed arrow aligned
    vertically.


    # 12.4 The Eraser [Shift+E]


    # Description


    The Eraser tool removes paint from the image.


    # Options Straight Line


    Hold down the Shift key while clicking to draw a straight line from the last Eraser
    position to the current one.


    # Hard Edge


    When selected from the Options menu, the brush for the eraser will not have any
    transparency (it will look very rough around the edges).'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Incremental


    This option makes eraser strokes cumulative, so it will erase more paint when
    the mouse is moved over a specific area several times. This is only useful when
    the brush transparency is less than 100 percent.


    # Usage


    The Eraser tool is very similar to the Pencil tool. It uses the brush selected
    in the Brushes menu. Using a solid brush with the eraser will give you a fuzzy
    line, making it smoother. To get a completely solid shape, select the Hard Edge
    option. Using a fuzzy brush will give you a very fuzzy line. The color that the
    eraser will reveal is the background color, unless there is an Alpha channel in
    the image, it will erase to transparency.


    +   See Also "Adding Alpha Channels" (page 61) and "Brushes" (page 172)


    # 12.5 The Clone Tool


    # Description


    The Clone tool copies a selected image or pattern, and paints with it like a brush.
    It is perfect for photo editing.


    # Options


    # Source


    Lets you choose the source for the paint in the Clone tool. Image uses a selected
    image layer to paint with. Pattern uses the current pattern.


    # Aligned


    This option keeps the source aligned with the mouse click. When it is not selected,
    the brush will always start to paint from the starting point.


    # Straight Line


    Hold down the Shift key while clicking to draw a straight line from the last Paintbrush
    position to the current one.


    # Select Source


    Hold down the Ctrl key while clicking to select the source point for the Clone
    tool when using the image for the source.


    # Usage


    The Clone tool is excellent for touching areas of skin, grass, or other complicated
    textures found in scanned images. The best brush to use is one with fuzzy edges.
    Holding down the Ctrl key while clicking chooses the point to use as the source
    for painting. This is a good tool for removing blemishes, but because it is very
    hard to draw skin, it is easy to copy other similar areas of skin¹.


    > Another more comical use is to switch peoples'' heads in a scanned photograph.'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# ## 12.6 The Convolve Tool [V]


    | Description | The Convolve tool manually blurs or sharpens areas of an image.
    |


    | Options | Determines the amount of blurring or sharpening that will occur. This
    is similar to the Pressure option for the Airbrush tool. |


    | Blur | Causes the area to become blurred. |


    | Sharpen | Sharpens the area. |


    | Straight Line | Hold down the Shift key when clicking to blur or sharpen from
    the last point drawn to the new position. |


    | Usage | The Convolve tool is used to manually blur or sharpen specific areas
    of the image. Sharpening does not always work properly; it can produce spotty
    images with poor colors. It is often better to use the Sharpen filter in the Enhance
    menu. |


    > > See Also "Sharpen" (page 224) and "Blur Filters" (page 193)


    # ## 12.7 The Color Picker [0]


    | Description | The Color Picker selects selected colors from the image for the
    foreground or background color. |


    | Options |


    | Sample Merge | This takes the averaged color from all layers instead of just
    the active one. |


    | Usage | The Color Picker replaces the foreground or background color with one
    from the image. Selecting the foreground or background color is done by clicking
    on the desired color. A window appears when a color is chosen, which displays
    the RGB values, the Alpha value, and the Hex triplet of the color. The Hex triplet
    is used for colors in Web pages. |


    > > See Also "Color Selection" (page 12)'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# 12.8 Dodge and Burn


    Description This tool adjusts the intensity values using a brush.


    Options This is a percentage amount that controls the amount of intensity change.


    Dodge This toggle increases the intensity of the affected pixels, making them
    seem brighter.


    Burn This toggle decreases the intensity of the affected pixels, making them seem
    darker.


    Highlights This toggle selects pixels with high intensity values only.


    Midtones This toggle selects pixels with medium intensity values.


    Shadows This toggle selects pixels with low intensity values.


    Straight Line Hold down the Shift key while clicking to dodge or burn a straight
    line from the last drawn position.


    Invert Tool Uses the other method for drawing. For example, if Dodge is selected
    in the Options menu, Burn will be used when the Shift key is held down.


    Usage The Dodge and Burn tool is used for touching up images in certain areas
    where the intensity needs to be changed. The area affected is determined by the
    active brush. The best brushes to use are ones with soft edges. This tool is very
    useful for emphasizing or hiding elements in scanned photographs, like faces,
    or chrome on cars. Note that these tools are not incremental, so an area can be
    drawn over multiple times, but it will only be affected once.


    The Burn tool is perfect for removing the “red-eye” effect in scanned photographs.
    To remove red-eye from a picture, follow these steps:'
  merge: -1
  pgno: 190
- img_proc: true
  md: '168 Image Transformation Tools: Dodge and Burn


    +   1. Open the picture in the GIMP. An example is shown in Figure 12.1.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_191_0.png)


    +   2. Open the Layers and Channels menu.

    3. Click on the Channels tab.

    4. Click on the Blue and Green channels to deselect them. Only the Red channel
    should be highlighted.

    5. Choose the Dodge and Burn tool ([Shift+D]).

    6. Double-click on the Dodge and Burn tool to open the Options menu.

    7. Choose Burn as the type.

    8. Lower the exposure to 20.0.

    9. Depending on the brightness of the red eye, choose the appropriate mode. Shadows
    is usually the best to use.

    10. Zoom in on the area to be edited. Figure 12.2 shows the zoomed area.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# Image Transformation Tools: Smudge 169


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_192_0.png)


    Figure 12.2 The zoomed-in area around the eye.


    +   1. Select a brush that is small enough to work on the eye. Use a feathered
    brush that is small enough to edit the red perimeter, without affecting the light
    center.

    2. Using small strokes, use the Burn tool to darken the red area. The fixed area
    is shown in Figure 12.3.


    Figure 12.3 The fixed area after the red-eye has been removed. Note that in the
    grayscale version, it just looks darker. In a color print, all of the red has
    been removed.


    +   13. Zoom back out to view the changes.


    > ►See Also "Curves" (page 56)


    | 12.9 Smudge [Shift+S] |

    | --- | --- |

    | Description | The Smudge tool smudges the paint in a layer with the current
    brush. The effect is similar to smearing oil paint / on a canvas. This effect
    resembles the IWarp filter (page 210). |

    | Options | This percentage value determines the amount of smudging that occurs.
    The higher the percentage, the further the paint travels, which gives it a greater
    smudging effect. Using a pressure of 100 percent will cause the initial area to
    be smudged forever. |

    | Straight line | Hold the Shift key while clicking to smudge in a straight line
    from the last drawn position. |

    | Usage | The Smudge tool is useful for creating artistic effects in an image.
    It is useful to smear background areas in order to bring them out of focus as
    an alternative to blurring. This tool is generally not used to enhance photographs,
    but to add an artistic flair. |


    > ►See Also "IWarp" (page 210)'
  merge: -1
