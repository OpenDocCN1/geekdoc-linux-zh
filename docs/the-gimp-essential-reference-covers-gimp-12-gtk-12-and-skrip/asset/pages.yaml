    # 14.2 Artistic Filters


    Artistic filters take an image and turn it into a work of art. These filters are
    all based on common artistic techniques—for instance, turning an image into a
    mosaic, or making it like it has been painted on canvas.


    # 14.2.1 Apply Canvas


    Apply Canvas adds a subtle texture map to an image (compare Figures 14.3 and 14.4).
    It makes the image appear as if it has been painted on a canvas. This filter works
    on scanned photographs, especially after other filters or scripts have been applied.
    For example, the Custom filter works very well with Canvas.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Filters: Cubism 189


    There are two different options for Apply Canvas:


    +   - Direction of the Light. This determines where the shadow of the “canvas”
    appears. The choices are limited to coming from one of the four corners of the
    image.


    +   - Depth of the Canvas. A small depth value will make the image look as if
    it has been painted on a paper texture. A high depth value will make the image
    appear to have been painted on a very rough canvas. The depth can range from 1
    to 49.


    When working with large images, note that patterns of horizontal and vertical
    lines will appear according to the size of the texture map used.


    *See Also Bumpmap (page 228) and Cubism (page 189)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_212_0.png)


    Figure 14.3 A picture of an orchid before any filters have been applied.


    Figure 14.4 A picture of an orchid, after Apply Canvas with a depth of 10 has
    been applied. The direction was Top-right.


    # 14.2.2 Cubism


    Cubism filter turns an image into something that resembles a Cubist painting (see
    Figures 14.5 and 14.6). In other words, it gives the image a very “abstract” feel.
    The original image will usually be barely recognizable in the filtered image.
    This is a CPU-intensive filter, and may take a few minutes to complete depending
    on the size of the image. There are three different options for this filter:


    +   - Toggle the Use of the Background Color On and Off. When this option is turned
    on, the background color will appear throughout the image where there are no tiles.
    By default, the color will be black.


    +   - Tile Size. This option determines the size of the tiles used to create the
    image. Tile size can range from 1.0 to 100.0.


    +   - Tile Saturation. High saturation will pack the squares very closely together,
    with a great deal of overlap. This will make the tiles seem random. A small saturation
    value will separate the tiles more, causing them to overlap less. Tile saturation
    can range from 0.0 to 10.0'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# 190 Filters: Mosaic


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_213_0.png)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_213_1.png)


    Figure 14.5 Photograph of a waterfall before any filters have been applied.


    Figure 14.6 A photograph of a waterfall after the Cubism filter has been applied.


    # 14.2.3 Mosaic


    The Mosaic filter transforms your image into a mosaic—a picture made of different
    colored tiles. It has many options (see Figures 14.7) to give you control in creating
    pleasing effects (see Figures 14.8 and 14.9). Like Cubism, this filter is very
    abstract, and the best results are achieved with images that have areas of solid
    color. You can create interesting effects when using Mosaic in conjunction with
    the other artistic filters, especially Cubism.


    +   - Antialiasing (1). This option is common throughout the GIMP. It uses Alpha
    values to smooth jagged edges. In this case, it smoothes the tile edges.


    +   - Color Averaging (2). This option determines whether you are creating a true
    mosaic. When Color Averaging is turned on, it averages the colors in each tile
    area. Each tile is a single color, like a real mosaic. If this is turned off,
    the colors in the image are retained. This has the effect of making the image
    look as if it were painted on a tile floor.'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'Pitted Surfaces (3). This makes the tiles look "weathered," more like an ancient
    mosaic.


    FG/BG Lighting (4). This determines what colors appear in the "grout" of the tiles.
    When this is turned on it uses the foreground and background colors. Turned off,
    it uses black and white for the grout.


    Tiling Primitives (5). These options are the basic shapes of tiles to be. Squares
    use square tiles, Hexagons uses hexagonal tiles, and Octagons use squares both
    of these shapes.


    Tile Size (6). Tile Size determines the average diameter for the tiles in pixels.
    Size can range from 5.0 to 100.0.


    Tile Height (7). This option determines the apparent height of the tiles in pixels.
    Height can range from 1.0 to 50.0.


    Tile Spacing (8). Tile Spacing determines the average space between tiles. Spacing
    can range from 1.0 to 50.0.


    Tile Neatness (9). This option determines the amount of deviation from a perfect
    tile. A neatness value of 1.0 creates shaped tiles. Neatness ranges from 0.00
    to 1.00.


    Tile Direction (10). Measured in degrees, this option determines the angle of
    the light source. From 0.0 to 360.0. A value of 0.0 means the light is coming
    from the right; 90.0 means the light is coming from the top of the image.


    Color Variation (11). This option allows you to have random coloring. A higher
    color variation value increases the randomness of the coloring. Variation can
    range from 0.00 to 1.00.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_214_0.png)


    Figure 14.7 The Mosaic options menu with its many different options.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# 14.2.4 Oilify


    The Oilify filter converts an image into something that resembles an oil painting.
    This is less abstract than the previous filters, but it can still render an image
    unrecognizable. The options for this filter are simple:


    +   - Toggle the Intensity Algorithm On and Off. If this option is turned on,
    the image created is based on the average intensity of the colors in the mask
    size. When this option is turned off, it uses the average RGB values in the mask
    for each pixel. It is best to use the intensity algorithm, especially when working
    with images that have distinct color changes.


    +   - Mask Size. This option determines the area used to calculate averages for
    the intensity or RGB algorithm. A larger mask size gives you less detail in an
    image.


    # 14.2.5 Van Gogh (LIC)


    The Van Gogh filter takes an image and turns it into a Van Gogh-esque painting.
    It also creates some unique textures. This effect is created by using a map image
    (usually grayscale) and a blurring effect. An example of the use of this filter
    is shown in Figures 14.11 to 14.13.


    +   - Effect Image (1). This option determines the blurring effect that occurs
    (see Figure 14.10). The direction is determined by the change of the pixels. Areas
    of solid color do not affect the image. The Blend tool (see page 145) works well
    for creating these maps.


    +   - Filter Length (2). This option controls the amount of distortion that occurs.
    The longer the filter length, the more distorted it becomes. Length can range
    from 0.0 to 64.0.


    +   - Noise Magnitude (3). This option controls the amount of random noise that
    is introduced into the picture. Larger values create a grainier image. Noise Magnitude
    can range from 1.0 to 5.0.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_215_0.png)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_215_1.png)'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'Integration Steps (4). This option controls how much the effect image affects
    the source image. A larger number of Integration steps means a greater influence
    on the image.


    Maximum Value and Minimum Value (5). These sliders control the amount of contrast
    in the new image. When the values are closer together, there is more contrast
    in the image. Minimum value ranges from -100.0 to 0.0. Maximum value ranges from
    0.0 to 100.0


