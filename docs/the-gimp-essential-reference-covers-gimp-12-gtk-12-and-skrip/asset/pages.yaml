    After you have set the image to your satisfaction, click Apply, and the new image
    will be created.


    # 14.11.7 Paper Tile


    The Paper Tile filter makes an image look as if it has been cut up into squares
    and placed on a black or white background. These tiles have all moved slightly
    before they were glued back onto the background.


    This filter is easy to use. The width and height of the tiles are entered, as
    well as the average distance to slide the tiles. The background color is selected
    here. The only choices are black or white.


    # 14.11.8 Small Tiles


    The Small Tiles filter is a very versatile tool for creating tiled images. It
    allows you to flip certain tiles horizontally, vertically, or around both axes.
    This gives you precise control to create some very interesting effects. This filter
    has the following options (see Figure 14.80):'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'Segment Setting (1). This controls the number of tiles to create. The number
    displayed here shows the number of tiles in one side of the square (for example,
    2 gives you a 2x2 square, or 4 tiles, 3 gives you a 3x3 square, or 9 tiles). This
    setting ranges from 2 to 6.


    Flipping.


    +   a. Tiles can be flipped horizontally and/or vertically (2).


    +   b. You can select the tiles to flip (3).


    +   - All tiles. Starts with the tile in the top-left corner.


    +   - Alternate tiles. These can be specified by entering their coordinates and
    clicking with the mouse.


    +   c. Opacity (4). If the image has an Alpha channel, its opacity can be controlled
    via a slider bar.


    +   d. Reset (5). If you have made changes too complicated to fix, simply click
    on the Reset button to go back to the original settings.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_258_0.png)


    Figure 14.80 The Options menu for the Small Tiles filter.


    # 14.11.9 Tile


    This filter tiles an image into a new image or layer of arbitrary size. This effect
    only works if the new image is larger than the previous one. This filter does
    not provide very precise control, and the Small Tiles filter is better for creating
    tiled images. This filter is useful, however, for creating tiled images via Script-Fu.


    The controls for this filter are simple. The size of the new image is entered
    in the width and height boxes. The Constrain Ratio toggle button allows you to
    keep the image''s width:height ratio. The New Image toggle button creates a new
    image; otherwise the current image is simply replaced.'
  merge: -1
  pgno: 258
- img_proc: true
  md: "# 14.12 Miscellaneous Filters\n\nFor now, the only filter in this section is\
    \ the Video filter. This may change with future versions of the GIMP.\n\n# 14.12.1\
    \ Video\n\nThis filter makes an image look as if it is being displayed on a low-dot-pitch\
    \ RGB video monitor (see Figure 14.81). It displays many of the different effects\
    \ that occur with these low quality monitors. All of these effects are caused\
    \ by the separation of the R, G, and B channels on a monitor. The interface for\
    \ this filter is easy to use with the following options are:\n\n+   **Additive.**\
    \ This option toggles the Additive layer on and off. If this is turned off, the\
    \ image will usually look too dark.\n* **Rotated.** This toggle button rotates\
    \ the pattern placed on the image by 90 degrees.\n* **RGB Pattern Type.** Creates\
    \ a set of staggered rectangles across the image.\n    * **Staggered.** Creates\
    \ the same effect as Staggered, but uses larger rectangles.\n    * **Large Staggered.**\
    \ Creates the same effect as Staggered, but uses larger rectangles.\n    * **Striped.**\
    \ Places horizontal rows alternating between red, green, and blue tones across\
    \ the image.\n    * **Wide-Striped.** Similar to Striped, but the rows are wider.\n\
    \    * **Long-Staggered.** Creates the same effect as Staggered, but uses taller\
    \ rectangles.\n    * **3x3.** Adds red, green, and blue squares on the image.\n\
    \    * **Large 3x3.** Uses larger squares than 3x3.\n    * **Hex.** Adds hexagonal\
    \ shaped objects on the image.\n    * **Dots.** Places small dots of red, green,\
    \ and blue on the image.\n\n![](img/f2e1dc39d482e76a84057f638c7a2d3f_259_0.png)\n\
    \n**Figure 14.81** The Options window for the Video filter."
  merge: -1
  pgno: 259
- img_proc: true
  md: '# 14.13 Noise Filters


    These three filters are used to add noise to an image. Usually, noise is unwanted,
    and a lot of effort goes into removing it. In some situations where noise is desired,
    however, these filters can be used.


    # 14.13.1 Noisy


    The Noisy filter is used to introduce random noise into an image. The amount of
    noise for individual channels can be specified. If you are trying to soften a
    sharp image, add slightly more noise to the Red and Green channels than to the
    Blue; the Blue channel is often noisy already.


    This filter is fairly straightforward. The amount of noise in each channel is
    to be controlled by a slider bar. The Independent button allows the channels to
    be adjusted independently. Whether to adjust them independently or not depends
    on the picture being noisified.


    # 14.13.2 Spread


    This filter creates noise in images by moving pixels a random amount in the horizontal
    and vertical directions. This filter is similar to the Randomize filter in Slur
    mode, but differs in that it allows you to specify the amount to move in both
    directions. The amount of spread in an image is constrained by the horizontal
    and vertical slider bars. These slider bars determine the maximum amount of spread
    that occurs.


    # 14.14 Random Filters


    The Random filters (see Figure 14.82) were previously one filter, but they have
    been split up. They add random noise to an image. The results of these filters
    depend on the mode of randomization. The Blur filter (see page 194) was previously
    part of these filters, so if you are familiar with Blur, these will be easy to
    learn. The following options are available with these filters:


    +   - Randomization Seed (1). Current Time is a good number to use to ensure randomness.
    If you need to repeat the effects of this filter later, enter your own value in
    the Other Value text box.


    +   - Randomization % (2). This slider bar controls the number of pixels that
    will be affected by the filter.


    +   - Repeat (3). This slider bar controls how many times this filter is run;
    only applying it once doesn''t usually have much effect on an image.'
  merge: -1
  pgno: 260
- img_proc: true
  md: 'The following randomization types are available:


    +   - Hurl. Goes through each pixel in the image and randomizes its color if it
    is in the randomization range. Hurl usually affects images a lot, so do not repeat
    it many times.

    - Pick. Similar to Hurl, but instead of randomizing a color, it chooses a random,
    nearby pixel''s color. This affects the image much less than Hurl.

    - Slur. Takes an image and randomizes downward. If a pixel is within its randomization
    percentage, Slur will shift it. There is an 80% chance that Slur will take the
    pixel from the line above to move downward; otherwise it uses a pixel to the left
    or right of the original (10% chance for each). It has the effect of ''melting''
    an image slightly.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_261_0.png)


    Figure 14.82 An example Options menu for the Random filters. Note the similarities
    to the Blur filter.


    # 14.14 Render Filters


    The filters found in this menu are applied to existing images, but rather than
    affecting the existing images, they create completely new images. These filters
    are very powerful, and it is well worth your time to become familiar with them.


    # 14.14.1 CML Explorer


    CML stands for Coupled Map Lattice, which is a model of complex systems. All you
    need to know as a GIMP user is that it creates interesting textures based on mathematical
    formulas. This filter is too complex to explain in detail, so here are some hints
    about the use of this filter:


    +   - Make small changes to the Power factor and k parameter slider bars.

    - Options in the Composition section create the most distinct patterns.

    - Use the ''Plot Graph'' button often to see the result of your changes.

    - The Advanced menu creates some interesting patterns. Try adjusting the mutation
    rates.'
  merge: -1
  pgno: 261
- img_proc: true
  md: "# 14.14.2 Checkerboard\n\nThis filter is a lot easier to use than CML Explorer.\
    \ It simply creates checkerboard patterns on an image. The colors used are taken\
    \ from the foreground and background colors set in the Toolbox. The Checkerboard\
    \ filter is controlled by the Check Size slider bar. This bar determines the dimensions\
    \ of the checks. If you choose the Psychobilly option, it creates a checkerboard\
    \ that looks like it is bulging outwards (see Figures 14.83 and 14.84). For the\
    \ Psychobilly option, the only check that is size specified by the slider bar\
    \ is the center one. All other tiles scale smaller proportionally to their distance\
    \ from the center check. Checks to the left or right shrink in width; checks above\
    \ or below the center shrink in height.\n\n![](img/f2e1dc39d482e76a84057f638c7a2d3f_262_0.png)\n\
    \nFigure 14.83 A regular checkerboard with a check size of 20.\n\nFigure 14.84\
    \ A psychobilly checkerboard with a check size of 20.\n\n# 14.14.3 Diffraction\
    \ Patterns\n\nThe Diffraction Patterns filter renders unique patterns from a variety\
    \ of settings. It is useful for creating symmetric patterns for backgrounds or\
    \ layers. This filter takes a long time to render images, so the preview is not\
    \ updated automatically. You must click on the Preview button each time you make\
    \ a change. The following options are available with this filter:\n\n+   - Frequencies\
    \ (see Figure 14.85)\n  a. This menu controls the frequency for each channel.\n\
    \  b. Low frequencies create large \"waves\" with gradual color changes.\n  c.\
    \ Higher frequencies create very small \"waves\" with sharp color changes.\n \
    \ d. The frequency affects the amount of color created by each channel. When the\
    \ frequencies are all similar, the image is made up of equal parts of all colors.\
    \ When one channel is different from the other two, it emphasizes the subodes\
    \ that in the image."
  merge: -1
  pgno: 262
- img_proc: true
  md: "# 240 Filters: Diffraction Patterns\n\n| Frequencies | Contour | Sharp edges\
