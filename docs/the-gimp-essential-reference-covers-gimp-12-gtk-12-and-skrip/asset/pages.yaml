  md: '196 Filters: Pixelize


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_219_0.png)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_219_1.png)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_219_2.png)


    # 14.3.4 Pixelize


    The Pixelize filter does the opposite of the other blur filters. Rather than smoothing
    a rough image out, it takes a smooth image and makes it look chunky and pixelated.
    This makes images look very computer-generated and creates a “low resolution”
    feel.


    The Pixelize filter only needs one option: the pixel width. This is the new size
    of pixels to be used. A value of 1 is useless, since the pixels are already 1
    pixel wide. Larger values equate to more pixelization, and less detail.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_219_3.png)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_219_4.png)'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'Filters: Alien Map


    # 14.3.5 Tileable Blur


    The Tileable blur filter applies a Gaussian blur (IIR or RLE) that works on tileable
    images so that they retain their symmetry. Tileable blur is actually a script,
    but it is located in the Filters menu, so it is called a filter. This will take
    more time than the Gaussian blur filter because it uses a composite of nine images
    to create the blur.


    The options for Tileable blur are the same as the Gaussian blur (see page 194),
    because it uses the Gaussian blur filters. The only different option is the choice
    between IIR or RLE blurring.


    # 14.4 Color Filters


    The next set of filters is the Color filters. These are filters that perform operations
    on the colors in an image. Because these work with colors, they do not work with
    grayscale images (except for Gradient Map). These filters tend to be mathematical
    and somewhat complicated, and it helps to know about the color models used in
    the GIMP. See the section on Color Models on page 5 for more information.


    # 14.4.1 Adjust Foreground and Background


    The Adjust Foreground and Background filter is fairly straightforward. It is the
    same filter as Color Mapping (see page 200), but slightly simpler. This filter
    takes any pixel that is the same color as the current foreground color and maps
    it to black. Any pixel that is the same color as the background color is mapped
    to white. Other colors are mapped by interpolation.


    This filter is not very accurate especially when you are working with scanned
    photographs, because it is difficult to tell which pixels will be changed. It
    is best used with computer-generated images with areas of solid color.


    # 14.4.2 Alien Map


    Alien Map is the first filter found in the Color filters menu, and is one of the
    most complicated filters. It shifts the color intensity (see page 5) of the Red,
    Green, and Blue channels based on the trigonometric functions sine and cosine.
    It is easiest to see the effects of this filter when working in individual channels
    (see page 48) because Alien Map adjusts the intensity for each specific channel.


    When mapping to the sine curve, the following occurs:


    +   - Low intensity (0 in the channel) is mapped to medium.


    +   - High intensity (255 in the channel) is mapped to medium as well.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# Filters: Alien Map


    +   ■ Medium intensity (127 in the channel) is mapped to full intensity

    255 in the channel).

    ■ Intensities of 64 and 191 are mapped to 0 intensity. Intermediate intensities

    are mapped similarly.


    With the cosine curve, the following occurs:


    +   ■ High intensity is mapped to low intensity.

    ■ Low intensity is unchanged.

    ■ Medium intensity is mapped to high intensity.


    See Table 14.2 for a listing of the mapping that occurs.


    Table 14.2 Mathematical Result of Alien Map Filter

    | Original Intensity | Mapped to Sine Curve | Mapped to Cosine Curve |

    |---|---||

    | 0 | 127 | 0 |

    | 64 | 0 | 64 |

    | 127 | 255 | 255 |

    | 191 | 0 | 64 |

    | 255 | 127 | 0 |


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_221_0.png)


    **Figure 14.22** An inverted cosine curve. Note the low negative values at the
    beginning and end of the curve, and the high value in the middle.


    **Figure 14.23** An inverted sine curve. The Alien Map filter does not follow
    the sine curve exactly because negative intensities are not allowed.


    Figures 14.24 and 14.25 show a Red channel that has been mapped to the cosine
    curve. With the Alien Map filter, the intensity change can be controlled. The
    figures shown here are for the maximum change, but they can be lowered.Values
    of 0 still remain at 0.Table 14.2 summarizes the intensity shifts. The explanation
    of what happens is very mathematical, and may not be entirely necessary. It is
    more important to know what will happen to your image when the Alien Map plug-in
    is used, and experimentation is the best way to learn this.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Filters: Color Exchange 199


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_222_0.png)


    Figure 14.24 An example Red channel before the Alien Map filter is applied.


    Figure 14.25 The Red channel after the Alien Map filter has been applied.


    The options for this complicated plug-in are very simple. For each channel (Red,
    Green, or Blue), there are two choices:


    +   * Which function to apply to the specific channel. You can choose between
    Sine, Cosine, or None.


    +   * The amount of intensity change. A high value will give the channel a higher
    overall intensity; a low value will give it a lower overall intensity.


    # 14.4.3 Border Average


    This filter calculates the most common color in a specific range and sets it as
    the border color. It is useful for finding a good color to use as a border of
    an image. Using this filter is straightforward. Its options include the following:


    +   * Thickness. Thickness determines the size of the border (in pixels) used
    to calculate the average.


    +   * Bucket Size. This option determines the bits used for the bucket size. It
    defaults to 4 (16-bit color), but if you are running higher bits per pixel, the
    bucket size can be set higher. Numbers smaller than 4 do not produce very accurate
    colors.


    # 14.4.4 Color Exchange


    The Color Exchange filter (see Figure 14.26) allows you to take an input color
    and change it to an arbitrary output color. With it, you can make precise adjustments
    of the colors in an image. This filter is useful only on images with large areas
    of solid color. It does not work well with scanned photographs or dithered computer-generated
    images (it can leave them looking flat). This filter'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# 200 Filters: Color Exchange


    is still under development, and with later versions of the GIMP we should have
    some additional options that make this plug-in much more useful. The Color Exchange
    filter''s only options are the from and to colors:


    +   - From Color. Input Color is always set to the current foreground color, so
    the Color Picker (see page 176) is very useful with this filter. It can be adjusted
    manually if needed. You can also set a threshold (see page 3) to allow for subtle
    changes in color.

    - To Color. This option must be set manually each time you choose it.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_223_0.png)


    # 14.4.5 Color Mapping


    This filter is the more advanced version of the Adjust Foreground and Background
    filter (see page 197). It takes two source colors and replaces them with two output
    colors. Intermediate colors are calculated automatically by the filter.


    The interface to this filter is only slightly more complicated than the Adjust
    Foreground and Background filter. There are two From colors, corresponding to
    the To colors. The From colors are the foreground and background colors by default.
    Simply click on the colors to change them.


    # 14.4.6 Colorify


    The Colorify filter makes your image appear as if it is being viewed through colored
    glass. This is achieved by replacing each pixel with a specified color with the
    same intensity. To fully understand what happens with the Colorify filter, use
    it on an image with red as the selected color. If you look at the channels for
    the image (see page 48), Red is the only channel with any detail. The Green and
    Blue'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'channels do not contain any information at all. This effect differs from placing
    a transparent red layer over the image because it completely destroys the information
    in the other channels. The image is still a 24-bit image, but one channel contains
    information.


    Colorify is very easy to use. You are required to choose a color, either from
    the standard colors or your own custom color. The filter will then colorify the
    image.


    # 14.4.7 Gradient Map


    The Gradient Map filter does exactly what its name implies. It maps the active
    gradient (see page 179) to the image on the basis of luminosity:


    +   - Pixels with the highest value (usually the white pixels) become the rightmost
    pixel of the gradient.

    - Pixels with the least value (usually black pixels) become the leftmost pixel
    of the gradient.

    - The intermediate pixels are mapped accordingly.


    Gradient Map has no options. It uses the active gradient selected in the Gradient
    editor to map.


    # 14.4.8 Hot


    - Create a New Layer. This is recommended so that you do not destroy your original
    image.

    - Display Type. This is either NTSC or PAL.

    - Action. You must choose the method to deal with the offending pixels.You can
    choose any one of the following:

    a. Reduce luminosity (value).

    b. Reduce saturation.

    c. Make them black to flag them for editing.


    # 14.4.8 Max RGB


    The Max RGB filter compares your image''s RGB values for each channel. It then
    replaces each pixel with the maximum RGB value for the highest channel.'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# 202  Filters: Max RGB


    For example, if you have a pixel with the values R:191 G:89 B:234, those values
    would become R:0 G:0 B:255. Black or white pixels are left unchanged, since they
    have equal amounts of all colors. Max RGB cannot decide to choose one color over
    another, so if two values are equal, they are left unchanged.


    The only option for Max RGB is whether to use the maximum or minimum values in
    calculating which channel to use. If minimum is chosen, the channel to use with
    the lowest value for each pixel is used instead.


    # 14.4.9 Scatter HSV


    The Scatter HSV filter (see Figure 14.27) works with the Hue, Saturation, and
    Value color model. It is a very versatile tool for creating random noise in an
    image. This filter introduces random color variations in the image. Scatter HSV
    is easy to control, and the following options are available:


    +   **Holdness.** This determines how close the pixels remain to their true color.

    A low holdness value allows them more freedom to change.


    +   **Hue.** This slider bar has the greatest effect on the image. The higher
    the Hue value, the more scattering occurs.


    +   **Saturation.** Increasing the Saturation gives the scattered pixels higher
    saturation values, making them look pure.


    +   **Value.** With a higher Value setting, pixels will have a higher difference
    between values, making the image spottier.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_225_0.png)


    **Figure 14.27** The options menu for the Scatter HSV filter.


    # 14.4.10 Semiflatten


    Semiflat is the Holy Grail for creating GIFs with transparency. As most Web designers
    know, GIFs have support for transparency, but only a 1-bit channel (see page 77).
    This makes images with gradually fading drop shadows or transparent'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Filters: Smooth Palette


    text look horrible. Semifatten allows you to retain your perfect transparencies.
    The advantage of doing this over simply flattening the image is that Semifatten
    saves some space when the image is saved as a GIF file. The only limitation is
    that you must display the image on a solid background color. There is still no
    way to use patterned backgrounds properly with GIF transparency.


    When the Semifatten filter is run, it takes the current background color and uses
    this for the image''s background color. It still uses transparency in the image,
    but it flattens the parts of the image with Alpha values from 1 to 254. Any part
    of the image with an Alpha value of 0 is left alone. The effects of this are best
    shown in Figures 14.28, 14.29, and 14.30.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_226_0.png)


    Figure 14.28 An RGB image with transparency created in the GIMP.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_226_1.png)


    Figure 14.29 The image, now converted to Indexed, does not look good at all. This
    is how it would look on on a Web page.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_226_2.png)


    Figure 14.30 The same image after Semifatten has been run and then converted to
    Indexed.


    # 14.4.11 Smooth Palette


    The Smooth Palette filter derives a palette from the colors in your image. This
    is not the most useful utility by itself, but it can be useful when used in conjunction
    with other filters and scripts.'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'When creating a palette with this filter, several options must be specified.
    The width and height of this new palette need to be chosen. Having a width of
    256 means that it creates an image the size of an indexed palette. The height
    you choose for the image is not as important as the width, although it makes the
    palette easier to work with. Increasing the search time should give you a wider
    range of colors, although it may take too long to be effective.


    # 14.4.2 Value Invert


    The Value Invert filter inverts the values of pixels in an RGB image (see page
    5), meaning that black pixels turn white and vice versa. This filter provides
    an interesting effect because combines the color of a pixel does not change. If
    it is a dark red pixel, it will become bright red. As always, to fully understand
    the effect of this filter, look at what happens to individual channels (see page
    48 for more information on channels). See Figures 14.31 and 14.32 for an example
    of this filter at work.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_227_0.png)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_227_1.png)


    Figure 14.31 The Red channel of a Porsche.


    Figure 14.32 The Red channel of the Porsche after running Value Invert.


    # 14.5 Combine Filters


    These filters create new images by combining two or more existing images to achieve
    interesting effects. The two Combine filters found in the stable GIMP distribution
    are Depth Merge and Film.


    # 14.5.1 Depth Merge


    The Depth Merge filter (see Figure 14.33) combines two images using depth maps.
    This filter takes two layers (1) in an image, or even two different images of
    the same size, and combines them. It decides between the two images'' pixels to
    use based on values found in depth maps (2). To make things much easier to understand,
    we will use grayscale depth maps. Black is the “deepest” and white is'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'the "shallowest" in a map. The deepest part between the two depth maps determines
    the pixel to be shown. The following four figures illustrate the concept:


    +   - Figure 14.34 shows the first image to be merged.


    +   - Figure 14.35 shows the second image to be merged.


    +   - Figure 14.36 shows the depth map used for this image. It is a simple grayscale
    gradient.


    +   - Figure 14.37 is its depth map.


    The results of merging the two can be seen in Figure 14.33. Note that the left
    side of the first image is fully opaque, where its depth map is completely black.
    The right side of the second image is also fully opaque, where its depth map is
    darkest.


    The Depth Merge filter comes with several options for greater control over the
    merging:


    +   - Overlap (3). This slider bar allows you to gradually fade the two images
    together, or create a sharp transition between them. Higher values of overlap
    result in a smoother transition.


    +   - Offset (4). This slider changes the darkness values of the depth maps being
    used. Sliding it to the left, into negative values, makes the first depth map
    darker. Sliding it to the right makes the second depth map become darker.


    +   - The Scale (5). These slider bars at the bottom also control the darkness
    of the depth maps, but with more precise control. Scale 1 controls the first depth
    map; Scale 2 controls the second.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_228_0.png)


    Figure 14.33 The Depth Merge menu showing a preview of the merged image.'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# 206 Filters: Film


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_229_0.png)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_229_1.png)


    Figure 14.34 The first image to be merged.


    Figure 14.35 The second image to be merged.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_229_2.png)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_229_3.png)


    Figure 14.36 The first gradient used for merging. Note the black on the left side,
