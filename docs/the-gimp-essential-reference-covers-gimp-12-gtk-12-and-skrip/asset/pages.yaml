    These steps are discussed in the following sections.


    # 6.3.3.1 Duplicating the baseLayer


    Duplicating the baseLayer is done with the gimp-layer-copy function. First of
    all, we must declare the variables in the let statement.Then we copy the layers,
    as follows:


    ```

    (set! blackLayer (car gimp-layer-copy baseLayer TRUE))

    (set! whiteLayer (car gimp-layer-copy baseLayer TRUE))

    ```


    These layers must be added to the image:


    ```

    (gimp-image-add-layer img blackLayer 2)

    (gimp-image-add-layer img whiteLayer 1)

    ```


    # 6.3.3.2 Adjusting the Color


    We will now use the Bucket tool to adjust the color. There are several steps to
    follow:


    +   1. Set the preserve transparency bit to TRUE:

    (gimp-layer-set-preserve-trans blackLayer TRUE)

    (gimp-layer-set-preserve-trans whiteLayer TRUE)

    2. Select the entire image:

    (gimp-selection-all img)

    3. Set the foreground color to black:

    (gimp-palette-set-foreground ''(@ @))

    4. Fill the blackLayer:

    (gimp-bucket-fill blackLayer @ 100 15 FALSE @ @)

    5. Set the foreground color to white:

    (gimp-palette-set-foreground ''(255 255 255))

    6. Fill the whiteLayer:

    (gimp-bucket-fill whiteLayer @ 100 15 FALSE @ @)

    7. Deselect the entire image:

    (gimp-selection-none img)


    # 6.3.3.3 Offsetting the Layers


    Next each is offset slightly.This is done with the gimp-layer-set-offsets function:


    ```

    (gimp-layer-set-offsets blackLayer 1 1)

    (gimp-layer-set-offsets whiteLayer -1 -1)

    ```


    # 6.3.3.4 Further Improvement of the Script


    The script now runs, but a better drop shadow effect is required.Two more layers
    are created that are duplicates of blackLayer and whiteLayer:


    ```

    (set! blackLayer (car gimp-layer-copy baseLayer TRUE))

    (set! whiteLayer (car gimp-layer-copy baseLayer TRUE)))

    ```'
