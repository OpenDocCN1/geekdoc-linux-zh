- img_proc: true
  md: '# About the Author


    Alex Harford is an electrical and computer engineering student at the University
    of British Columbia. An Internet veteran and experienced Linux user, he has been
    using the GIMP for all of his web development work since being introduced to Unix
    and Linux while working at Dowco.Com Internet. He is a member of the Vancouver
    Linux Users Group.


    # About the Technical Reviewers


    Zach Beane has been working with GIMP since its earliest release in 1996. He is
    active in providing help for GIMP users in newsgroups, web pages, and IRC. In
    1997, he started the GIMP News web page at http://www.xach.com/gimp/news/, and
    now maintains the News section of http://www.gimp.org.


    Guillermo S. Romero is currently studying Telecommunications Engineering with
    a speciality in Data Transmission at the EUITT branch of Universidad Polité de
    Madrid.


    He has worked for PC Actual (a BPE''s magazine), and is presently employed by
    Linux Actual and Solo Linux and Mas PC (Prensa Técnica''s magazines). The articles
    and courses within these magazines are mainly about graphics (2D/3D) and Linux,
    focusing on the GIMP, POV-Ray, and Blender programs.'
