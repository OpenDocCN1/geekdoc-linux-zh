  md: "# Writing Your Own Script-Fu: Writing a Basic Script\n\n# 6.3.1 Writing a Basic\
    \ Script\n\nThe first part of any Script-Fu is to define the function. Our example\
    \ script is defined as:\n\n```\n(define (script-fu-alexh-logo textStuff fontType\
    \ fontSize bgColor))\n```\n\nThis means there a function called script-fu-alexh-logo.\
    \ It does not actually do anything, but it is a good start. It takes the following\
    \ variables as input:\n\n+   - textStuff. This is the actual text that is created.\n\
    - fontType. This determines the type of font. By default it will be Agate.\n-\
    \ fontSize. This is the size of the font.\n- bgColor. This variable allows you\
    \ to set the background color manually.\n\n# 6.3.1.1 Registering the Script\n\n\
    The second part of the script registers itself with the GIMP, and defines what\
    \ parameters are passed to it. This is done through the function script-fu-register.\
    \ These parameters can be passed manually, or through another script that calls\
    \ it.\n\nHere is the example of a script-fu-register function:\n\n```\n(script-fu-register\
    \ \"script-fu-alexh-logo\"\n  \"<Toolbox/Xtns/Script-Fu/Web page themes/AlexH/Basic\
    \ Logo\"\n  \"Makes a basic logo in the theme used in Alex Herford's Webpage\"\
    \n  \"Alex Herford\"\n  \"Copyright 1999 Alex Herford\"\n  \"July 21, 1999\"\n\
    \  \"\\\n```\n\nNote that the script-fu-register function takes seven parameters\
    \ plus the number of parameters passed to it. In this case, it is a total of 12.The\
    \ first seven parameters are used in registering the script with the GIMP:\n\n\
    +   - Name. Determines the script's function name for calling it within the GIMP,\
    \ and also how it appears in the DB Browser.\n- Location. Determines where this\
    \ script appears. It will always begin with <Toolbox> or <Image>, depending on\
    \ where you want to put it. The GIMP will automatically create menus and submenus.\
    \ Spaces are allowed in the location as well.\n- Description. A simple description\
    \ of the script.\n- Author name.\n- Copyright.\n- Date. Usually the date of last\
    \ revision."
