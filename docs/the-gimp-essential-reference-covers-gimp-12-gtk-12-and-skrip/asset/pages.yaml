  md: '# 334 Function Reference for Scripts: gimp_edit_copy


    # D.1.89 gimp_edit_copy


    Description If there is a selection in the image, then the area specified is copied
    from the specified drawable and placed in an internal GIMP edit buffer. It can
    subsequently be retrieved using the gimp-edit-paste command. If there is no selection,
    then the specified drawable''s contents will be stored in the internal GIMP edit
    buffer. The drawable must belong to the specified image or an error is returned.


    | Table D.89 gimp_edit_copy Variables |

    | Variable Name | Type | Description |

    | --- | --- | --- |

    | drawable | PDB_DRAWABLE | The drawable to copy from |

    | image | PDB_IMAGE | The image |


    # D.1.90 gimp_image_remove_layer


    Description This procedure removes the specified layer from the image. If the
    layer does not exist, an error is returned. If there are no layers left in the
    image, this call will fail. If this is the last layer remaining, the image will
    become empty and have no active layer.


    | Table D.90 gimp_image_remove_layer Variables |

    | Variable Name | Type | Description |

    | --- | --- | --- |

    | image | PDB_IMAGE | The image |

    | layer | PDB_LAYER | The layer |


    # D.1.91 gimp_image_disable_undo


    Description This procedure disables the image''s undo stack, allowing subsequent
    operations to ignore their undo steps. This is generally called in conjunction
    with gimp_image_enable_undo to temporarily disable an undo stack. This is advantageous
    because saving undo steps can be time and memory intensive.


    | Table D.91 gimp_image_disable_undo Variables |

    | Variable Name | Type | Description |

    | --- | --- | --- |

    | disabled | PDB_INT32 | True if the undo has been disabled |

    | image | PDB_IMAGE | The image |'
  merge: -1
  pgno: 357
