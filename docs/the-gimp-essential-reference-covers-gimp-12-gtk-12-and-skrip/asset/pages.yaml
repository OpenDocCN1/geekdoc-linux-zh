- img_proc: true
  md: '# Choosing the Right File Format: ImageMap Plug-In 81


    # 5.3.3 GIF Animations


    GIFs are very useful because they allow you to create simple animations for the
    Web. The GIMP has a very simple and intuitive way of working with animations.
    You do not need any third-party software to create cool GIF animations—the GIMP
    does it by treating each layer as a frame of the animation. In the layer name,
    the timing and mode of displaying the primitive is described. One must remember
    that GIF animations are very primitive—the computer equivalent of a flip book.
    This means that timing is not exact, faster computers will play them more quickly,
    and different programs will play them at different speeds. One way to save space
    in animations is to use a main background. All the other layers combine with it
    using transparency. See page 77 for more information on GIF animations.


    # 5.3.4 ImageMap Plug-In


    Menu <Image>/Filters/Misc/ImageMap


    There is new plug-in called ImageMap, which is still in active development as
    of this writing, but has been proven to be very useful. It creates and saves ImageMaps
    through a very simple point and click interface. As a stand-alone program, it
    would be very useful. It is not in the current distribution of the GIMP, so you
    must download it off the Internet. It can be found at http://registry.gimp.org/.
    A link to the plug-in''s homepage is provided at the GIMP Plug-In Registry. To
    use this program, you will need GTK+ 1.2.0 and GIMP 1.0.4 or 1.x.


    ImageMap''s interface is very easy to learn. In the center, the current layer
    is displayed, with the list of HTML links to the right. Along the top of the window
    are the controls for the plug-in, as saving, loading existing maps, and so on.
    On the left edge are the buttons for creating clickable areas on the image.


    This description assumes you have basic knowledge of ImageMaps. For more information
    on creating ImageMaps and using them in Web pages, http://home-2.consubnet.net/nl-cb07736/imagemap.html.


    To create a clickable area, follow these steps:


    +   1. Choose the shape of the area first. Shapes available are circles, rectangles,
    or polygons.


    +   2. Click and release the mouse button on the area you wish to create.


    +   3. Drag the mouse to the endpoint of the area and click the mouse button again.'
