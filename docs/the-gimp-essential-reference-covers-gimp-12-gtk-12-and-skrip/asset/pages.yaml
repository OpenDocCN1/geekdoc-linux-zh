- img_proc: true
  md: '# 2 GIMP Essentials: Introduction to the GIMP


    # 1.1 Introduction to the GIMP


    The GIMP is one of the "killer apps" that was born from the Open Source software
    movement. It is an image manipulation program for Unix-like operating systems
    that rivals, and in some cases outdoes, Adobe Photoshop. This program was created
    by Spencer Kimball and Peter Mattis (S&P) at the Experimental Computing Facility
    at the University of California at Berkeley. Their project has grown and split
    into two distinct entities: the GIMP, which is an acronym for the GNU Image Manipulation
    Program, and GTK+, the GIMP ToolKit.


    This first program, the GIMP, was released to the world under the GNU General
    Public License. The source code was distributed, and many people were impressed
    with the quality of the code. People began submitting patches and improvements
    to the GIMP, and the program has grown very quickly.


    The version numbering scheme is the same as the Linux kernel. The major number
    remains the same except for very major releases. Currently, the GIMP is in version
    1. The second "digit," or minor number, represents whether the version is stable
    or in development. Even numbers represent stable versions, odd numbers means that
    it is a development release. For instance, the minor number for the stable version
    is 2, so that version number is 1.2. The development version minor number is 3,
    so that version number is 1.3. Each version also has a patch level. In stable
    releases, this represents a bug-fix. For the development version, this is a point
    at which the developers feel to release a newer version. An example stable version
    number would be 1.2.2; a development version number would be 1.3.6.


    When the developers want to release a stable version, a code freeze is in place,
    at which no point new features can be added. The only changes that can be made
    are to bugs in the code that would make the program crash. After all the bugs
    are found, the program becomes a stable release, and a new development version
    is started. The code is usually retained from version to version, except in very
    unusual cases.


    The second part of S&P''s project is called the GIMP Toolkit, GTK+. Originally
    the GIMP and the Toolkit were rolled into one program, but because the toolkit
    was very useful as an individual program, it was split into a separate library.
    The GIMP Toolkit enables people to do complicated programming with a standard
    library that is fast—and of all—free. Many programs now use GTK+ for their X library,
    including XMMS (an open source MP3 player), GNOME, a desktop environment for X.
    The GIMP Toolkit also uses the version system of the Linux kernel. Development
    versions of the GIMP Toolkit will usually end up "breaking" stable versions of
    the GIMP.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_25_0.png)'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# GIMP Essentials: Menu, Name, and Book Conventions 3


    # 1.2 System Requirements


    The GIMP is fairly processor and memory intensive. The minimal requirements to
    run the GIMP are as follows:


    +   - A Unix-like operating system with X11.Windows and BeOS versions being developed
    currently.

    - An 8-bit display.

    - 20MB of free hard drive space.

    - A mouse or other pointing device.

    - GTK+.

    - 8MB of RAM.


    The following setup is recommended for using the GIMP:


    +   - A modern, Unix-like operating system. Any version released in the last four
    years should work.

    - 16 bit or higher display, running X.

    - 200MB of free hard drive space.

    - At least 16MB of RAM.

    - GTK+ and other graphics libraries.

    - A good floating-point processor. K7 processors seem to be the best choice for
    the home user. Alpha and other RISC processors will provide even better performance.


    With hardware prices dropping rapidly, this setup would be easily available. To
    edit large photographs, you should use a Pentium machine with at least 64MB of
    RAM—128MB would be better. A video card with at least 4MB of RAM is recommended
    for good color and resolution. A machine with multiple processors would definitely
    help.


    # 1.3 Menu, Name, and Book Conventions


    Throughout this book, several specific terms and assumptions have been used, and
    it is useful to become familiar with them.


    The first is dealing with pointing devices. It is assumed that you are using a
    mouse with three buttons. If not, some actions may have to be done differently.
    Whenever you are instructed to click with the mouse, the left mouse button is
    assumed. Right mouse clicks will be explicitly instructed.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# GIMP Essentials: Frequently Used Terminology


    When describing items found in menus, several conventions conventions are used:


    +   The GIMP’s Toolbox is referred to as the <Toolbox>. For example, to duplicate
    a file through the Toolbox, click <Toolbox>/File/Open.


    +   Right-clicking on an image is referred to as <Image>. So, to duplicate an
    image, click on <Image>/Image/Channels Ops/Duplicate. The <Image> menu can also
    be accessed by clicking the arrow in the top-left corner.


    +   Menus inside these are separated by slash marks (for example, <Toolbox>/Xntns/Screen
    Shot).


    # 1.3.1 Frequently Used Terminology


    Here are some terms with which you should become familiar:


    +   Alpha. A term that is common when discussing graphics. It represents the transparency
    in an image. An image can have a range of Alpha values, going from fully transparent
    to fully opaque.


    +   Anti-aliasing. Used to describe smoothing in an image. Many different operations
    use anti-aliasing, but they refer to the technique used to make images smoother
    and less pixelated. It is most noticeable when dealing with text.


    +   Bit depth. A mathematical term used in describing the number of colors available
    in an image. An 8-bit display may show 2⁸ or 256, different colors. A 24-bit display
    can show 2⁴, or 16.8 million, colors. Refer to Table 1.1 to see the various bit
    depths and their available colors.


    | Bit Depth | Available Colors |

    | --- | --- |

    | 1 | 2 |

    | 2 | 4 |

    | 4 | 16 |

    | 8 | 256 |

    | 16 | 65,536 |

    | 24 | 16,777,216 |

    | 32 | 16,777,216 |


    Table 1.1 Bit Depths and Available Colors


    +   Feathering. Similar to anti-aliasing. Feathering is used to smooth out transitions
    over a large distance. The radius of the feathering can be changed, whereas in
    anti-aliasing it cannot.


    +   Threshold. Describes the extent of an effect. Something is either inside the
    threshold, or it is not—there is no in-between.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# 1.3.2 Book Conventions


    The following conventions have been used to help you read this book quickly and
    easily:


    +   - **Mono-faced words.** Any word(s) appearing in this typeface indicates code
    to be typed, text displayed onscreen, or URLs.


    +   - **Cross-references.** These can take two forms: *in-text* or *the end of
    a section*. The in-text references will simply refer you to a specific page where
    related information can be obtained. The section-ending references look like this:


    +   - **Hotkeys.** Hotkeys are frequently used in the GIMP to perform operations
    more quickly. They appear in square brackets (for instance, [Ctrl+Z]).


    # 1.4 Color Models


    Another concept to be familiar with the color models in the GIMP. There are four
    different color models you should be familiar with to understand the concepts
    behind this book'':


    +   - RGB. This is the most common color model. It combines Red, Green, and Blue
    to create any possible color.


    +   - HSV. The HSV model uses Hue, Saturation, and Value to describe colors.


    +   - Grayscale. This model is for black and white images.


    +   - Indexed. This color model is quite different from the others. It creates
    a table of colors that are contained in the image.


    # 1.4.1 RGB


    RGB is the most common color model in the GIMP. It is an additive model, where
    each channel adds up to form any color. Because the GIMP is made to be used mostly
    for computer graphics rather than pre-press work, RGB is the default color model.


    Every pixel in an RGB image has three specific properties that determine its color.
    Every pixel has a specific amount of red, green, and blue. The color black has
    0 for each channel, for example, and has a value of 255 for each channel. A true
    red color would have a value of 255 for the red channel, and 0 for green and blue.
    Yellow would have values of 255 in the red and green channels, and 0 in the blue
    channel.


    > * Sharp readers will notice that the GIMP does not have CMYK support. This is
    because it was written for computer graphics, rather than for pre-press work.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# 1.4.2 HSV


    The HSV color model is similar to RGB, but each of its channels represents Hue,
    Saturation, or Value. This is a more intuitive approach to describing color.


    +   - Hue. This channel determines the actual color of the image. It uses a 360-degree
    color wheel to determine the color. Red is at 0 degrees, and cyan is at 180 degrees.

    - Saturation. Saturation determines the purity of a color. It is represented as
    a percentage. A color with full saturation is a pure color. A pixel that has no
    saturation has no color; it is grayscale.

    - Value. This channel represents the brightness in an image. It is also a percentage
    value. A pixel with full value will be bright; a pixel with 0 brightness will
    be black.


    # 1.4.3 Grayscale


    The grayscale color model is a method of displaying black and white color models.
    It has only one channel—value. This allows it to display 255 shades of gray, with
    0 being black, and 255 being white.


    # 1.4.4 Indexed


    The indexed color model is not intuitive at all. It creates an index of all the
    colors in an image and puts them into a Look Up Table (LUT). It allows for only
    256 different colors, but these colors can be taken from the 16.8 million available
    in an RGB image. Indexed images seem useless with only 256 colors, compared to
    RGB images with 16.8 million. The advantage to this is that these files are often
    smaller than if they are saved in RGB format. If you design graphics for Web pages,
    you probably know that machines display indexed images differently. This can be
    a problem. For more information about the Web palette, see xxx.


    # 1.5 Resolution


    Resolution is the final topic that needs to be discussed before we start using
    the GIMP. This is an especially important topic if you are going to be printing
    images you create. The most important distinction is the difference between the
    resolution of your monitor and the resolution of the printed image. Monitor resolution
    is described in pixels per inch (ppi). Most monitors use a resolution of 72ppi.
    This means that if you have an image that is 72 by 36 pixels, onscreen it is 1x0.5
    inches (25.4x12.7mm). Note that this is not always true. Some people may be running
    at different resolutions. For instance, it is quite common for people with smaller
    monitors to be running at a higher resolution to give them more space on their
    screen.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'Printer resolution is described in dpi (dots per inch) and lpi (lines per inch).
    The dpi is the more important resolution to be aware of. If you are going to be
    printing high-quality images, talk to your printing shop about optimal resolutions.
    Printers have much higher resolution than monitors, so you will be dealing with
    very large images to get good quality. Most printers found in homes will have
    resolutions of around 300dpi, whereas commercial printers may go as high as 2400dpi.
    If printing a 2x2-inch image at 300dpi, you will be working with an image that
    appears to be approximately 8.3x8.3 inches on your monitor.



    . Working with high-quality images will always slow down your computer, and the
    images will take up a lot of room on your hard drive. Working with images that
    are small and fast, on the other hand, will give you low-quality printed images.
    Experimentation is best for finding optimal resolutions, but if you are doing
    pre-press work, consult your printing shop.'
  merge: -1
