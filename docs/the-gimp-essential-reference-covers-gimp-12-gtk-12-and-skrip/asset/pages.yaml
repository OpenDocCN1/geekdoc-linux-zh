    # D.1.76 gimp_plug_in_gauss_rle


    Description Applies a Gaussian blur to the drawable, with specified radius of
    affect. The standard deviation of the normal distribution used to modify pixel
    values is calculated based on the supplied radius. Horizontal and vertical blurring
    can be independently invoked by specifying only one to run. The RLE Gaussian blurring
    performs most efficiently on computer-generated images or images with large areas
    of constant intensity. Values for radii less than 1.0 are invalid because they
    will generate spurious results.


    Table D.76 gimp_plug_in_gauss_rle Variables

    | Variable Name | Type | Description |

    |---|---|---|

    | drawable | PDB_DRAWABLE | Input drawable |

    | horizontal | PDB_INT32 | Blurs in horizontal direction |

    | image | PDB_IMAGE | Input image (unused) |

    | radius | PDB_FLOAT | Radius of Gaussian blur (in pixels > 1.0) |

    | run_mode | PDB_INT32 | Interactive, non-interactive |

    | vertical | PDB_INT32 | Blurs in vertical direction |


    # D.1.77 gimp_palette_get_foreground


    Description This procedure retrieves the current GIMP foreground color. The foreground
    color is used in a variety of tools such as paint tools, blending, and bucket
    fill.


    Table D.77 gimp_palette_get_foreground Variable

    | Variable Name | Type | Description |

    |---|---|---|

    | foreground | PDB_COLOR | The foreground color |'
