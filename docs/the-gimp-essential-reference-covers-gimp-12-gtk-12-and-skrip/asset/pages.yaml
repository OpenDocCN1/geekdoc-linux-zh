    | --- | --- |

    | 1 Create new image | Unlimited-3/Background |

    | 2 Effect manager | 19.0 |

    | 3 Brightness | Noise magnitude 2.5 |

    | 4 Effect operator | Integration steps 25.0 |

    | 5 Gradient | Minimum value -25.0 |

    | Contrast | Minimum value 35 |


    Figure 14.10 The options menu for the Van Gogh filter.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_216_0.png)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_216_1.png)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_216_2.png)


    # 14.3 Blur Filters


    The Blur filters are very simple. They all distort images by applying some sort
    of blur. There are many different methods of achieving this, and there are several
    different filters to create these effects.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# 14.3.1 Blur


    The first filter is the basic Blur (see Figure 14.14). It blurs a layer or selection
    and makes it appear out of focus. This is done by random number generation. For
    each pixel, a random number is generated, and if it falls within a percentage
    range, it is blurred by taking the average value of the surrounding pixels. Blur
    has a very small effect on the image. This filter does not work well on images
    that have transparency because it distorts colors. The Blur filter has several
    options, and the reasons for having them are not entirely obvious:


    +   - Randomization Seed (1). The seed helps whether a pixel will be blurred or
    not. Using the current time is a good seed to use. If you need to repeat a blur
    exactly, enter a number in the OtherValue section.


    +   - Randomization % (2). This option determines how many pixels actually get
    blurred. This can range from 0 to 100%.


    +   - Repeat (3). Repeat allows you to run the filter several times. This is very
    useful, because the Blur filter usually has only a small effect on the image.
    Repeat ranges from 1 to 100.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_217_0.png)


    # 14.3.2 Gaussian Blur (IIR and RLE)


    There are two types of Gaussian blur, but they are very similar to each other.
    They both apply a blur operation with a specific radius. The larger the radius,
    the greater the blurring effect. IIR blurring works best with a large radius for
    blurring, and for images that are not computer generated, such as scanned photographs.
    RLE blurring works best on computer-generated images, or images with large areas
    of constant value.


    Gaussian blur can be applied as follows:


    +   - Horizontally


    +   - Vertically


    +   - In both directions'
  merge: -1
  pgno: 217
- img_proc: true
  md: "# Filters: Motion Blur 195\n\nThe blur radius needs to be specified to blur\
    \ the image. Radii less than 1 are invalid because that would mean a fraction\
    \ of a pixel would be blurred.\n\n# 14.3.3 Motion Blur\n\nMotion blur (see Figure\
    \ 14.15) applies different types of blurring operations to produce the illusion\
    \ of a photograph taken of a moving object (with a relatively slow shutter speed),\
    \ like the waterfall in Figure 14.16. The motion can be linear, radial, or zooming.\
    \ Linear motion (see Figure 14.17) blurring makes the image look as if it is blowing\
    \ away. When radial blurring (see Figure 14.18) is applied, it appears as though\
    \ the image is spinning. Zooming (see Figure 14.19) makes the image look as if\
    \ it is zooming back into the screen. For the three different types of blurring,\
    \ the options have different effects:\n\n+   - Linear\n  - the length (1) defines\
    \ the \"distance\" image travels. A greater length creates a more pronounced blurring\
    \ effect.\n  - the angle (2) determines the direction the image travels.\n\n+\
    \   - Radial\n  - Only the angle (2) is used, length is not. The angle determines\
    \ the amount that the image is rotated. For complicated images, 45 degrees blur\
    \ the image quite well. Values higher than this will take a long time. For simple\
    \ images, rotating 360 degrees is necessary. The image is \"spun\" about its center,\
    \ and currently there is no way of changing this.\n\n+   - Zoom\n  - This creates\
    \ the illusion of the image moving away from a camera, the USS Enterprise accelerating\
    \ to warp speed. Angle does not affect zooming-only length (1). This blurring\
    \ effect also uses the center of the image to zoom to, and as of this writing\
    \ there is no way of changing this.\n\n![](img/f2e1dc39d482e76a84057f638c7a2d3f_218_0.png)\n\
    \n![](img/f2e1dc39d482e76a84057f638c7a2d3f_218_1.png)\n\nFigure 14.15 The options\
    \ menu for the Motion Blur filter.\n\nFigure 14.16 A photograph of a waterfall."
  merge: -1
