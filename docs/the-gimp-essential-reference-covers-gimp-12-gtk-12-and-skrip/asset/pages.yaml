- img_proc: true
  md: '# Function Reference for Scripts: gimp_layer_add_alpha


    # D.1.2 gimp_layer_add_alpha


    Description This procedure adds an additional component to the specified layer
    if it does not already possess an Alpha channel. An Alpha channel makes it possible
    to move a layer from the bottom of the layer stack and clear and erase to transparency
    rather than the background color. This transforms images of type RGB to RGBA,
    Gray to GrayA, and Indexed to IndexedA.


    Table D.2 gimp_layer_add_alpha Variable

    | Variable Name | Type | Description |

    |---|---|--|

    | layer | PDB_LAYER | The layer |


    # D.1.3 gimp_layer_set_mode


    Description This tool sets the combination mode of the specified layer.


    Table D.3 gimp_layer_set_mode Layers

    | Variable Name | Type | Description |

    |---|---|--|

    | layer | PDB_LAYER | The layer |

    | mode | PDB_INT32 | The new layer combination mode |


    # D.1.4 gimp_bucket_fill


    Description This tool requires information about the paint application mode, and
    the fill mode, which can either be in the foreground color, or in the currently
    active pattern. If there is no selection, a seed fill is executed at the specified
    coordinates and extends outward in keeping with the threshold parameter. If there
    is a selection in the target image, the threshold, sample merged, x, and y arguments
    are unused. If the sample_merged parameter is non-zero, the data of the composite
    image will be used instead of that for the specified drawable. This is equivalent
    to sampling for colors after merging all visible layers. In the case of merged
    sampling, the x, y coordinates are relative to the image''s origin; otherwise,
    they are relative to the drawable''s origin.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Function Reference for Scripts: gimp_invert


    Table D.4 gimp_bucket_fill Variables

    | Variable Name | Type | Description |

    | :--- | :--- | :--- |

    | drawable | PDB_DRAWABLE | The affected drawable. |

    | fill_mode | PDB_INT32 | The types of fill: FG-BUCKET-FILL (0), BG-BUCKET-FILL
    (1), PATTERN-BUCKET-FILL (2). |

    | image | PDB_IMAGE | The image. |

    | opacity | PDB_FLOAT | The opacity of the final bucket fill (0 <= opacity <=
    100). |

    | paint_mode | PDB_INT32 | The paint application modes: NORMAL (0), DISSOLVE (1),
    BEHIND (2), MULTIPLY (3), SCREEN (4), OVERLAY (5), DIFFERENCE (6), ADDITION (7),
    SUBTRACT (8), DARKEN-ONLY (9), LIGHTEN-ONLY (10), NUE, SATURATION (12), COLOR
    (13), VALUE (14). |

    | sample_merged | PDB_INT32 | Uses the composite image, not the drawable. |

    | threshold | PDB_FLOAT | The threshold determines how extensive the seed will
    be. Its value is specified in terms of intensity levels (0 <= threshold <= 255).
    This parameter is valid only when there is no selection in the specified image.
    |

    | x | PDB_FLOAT | The x coordinate of this bucket fill''s application. This is
    valid only when there is no selection in the specified image. |

    | y | PDB_FLOAT | The y coordinate of this bucket fill''s application. This parameter
    is valid only when there is no selection in the specified image. |


    # D.1.5 gimp_invert


    Description This procedure inverts the contents of the specified drawable.

    Each intensity channel is inverted independently. The inverted intensity is given
    as intent = (255 x int). Indexed color drawables are not valid for this operation.


    Table D.5 gimp_invert Variables

    | Variable Name | Type | Description |

    | :--- | :--- | :--- |

    | drawable | PDB_DRAWABLE | The drawable |

    | image | PDB_IMAGE | The image |'
  merge: -1
