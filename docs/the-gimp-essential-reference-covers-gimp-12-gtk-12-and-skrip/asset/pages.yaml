  md: '# Extending the GIMP: Basics of the gtkrc File


    The Information menu is where the map''s general information is entered. The author''s
    name, the title of the map, and, most importantly, the default URL can be entered
    here.


    When the map is finished and saved, it can be inserted into an HTML file.


    # 7.3 Customizing the GIMP


    The GIMP uses the G Toolkit as its widget set. A widget set simply controls the
    look of an application, including scrollbars, buttons, etc. The advantage to using
    the GIMP Toolkit that it is highly customizable. There are two ways of changing
    the look of your GTK+ applications: by editing the gtkrc file manually, or by
    downloading themes over the Internet.


    # 7.3.1 Basics of the gtkrc File


    The gtkrc file contains all the information telling a GTK application what to
    look like. You can find a default gtkrc in ~/.gimp directory. It looks similar
    to the following:


    ```

    1 # style <name> = <name>

    2 # {

    3 #   <option>

    4 #}

    5 #

    6 # widget <widget_set> style <style_name>

    7 # widget_class <widget_class> style <style_name>

    8

    9 style="ruler"

    10 {

    11   font = "adobe-helvetica-medium-r-normal-*-80-*:*:*:*:*:*"

    12 }

    13

    14 style="default"

    15 {

    16   font = "adobe-helvetica-medium-r-normal-*-100-*:*:*:*:*:*"

    17 }

    18

    19 widget_class="Ruler" style="ruler"

    20 widget_class="class" style="default"

    ```


    Another gtkrc file² is included in the GIMP source directory. The filename is
    called gtkrc.forest2. It looks similar to the following:


    ```

    1 # style <name> = <name>

    2 # {

    3 #   <option>

    4 #}

    5 #

    6 # widget <widget_set> style <style_name>

    7 # widget_class <widget_class> style <style_name>

    8

    9 pixmap_path="/home/tiger/.gnome/textures

    10

    ```


    continues


    > ² gtkrc.forest2 was created by the famous Gimp''er, tiger.'
