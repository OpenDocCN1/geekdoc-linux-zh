  md: "# Filters: Illusion\n\n![](img/f2e1dc39d482e76a84057f638c7a2d3f_254_0.png)\n\
    \n![](img/f2e1dc39d482e76a84057f638c7a2d3f_254_1.png)\n\nFigure 14.74 The resulting\
    \ image after the map was applied to it.\n\nFigure 14.75 The options menu for\
    \ the Displace filter.\n\n# 14.11.3 Fractal Trace\n\nThe Fractal Trace filter\
    \ maps your image to a Mandelbrot fractal. This creates very interesting effects\
    \ on scanned photographs. Be cautious with this filter: It is very CPU intensive\
    \ and has a tendency to crash.\n\nThe Fractal Trace filter has several options\
    \ for controlling the look of the image:\n\n+   - X1. Controls the scaling for\
    \ the left side of the image.\n- X2. Controls the right side of the image.\n-\
    \ Y1. Controls the scaling for the top of the image.\n- Y2. Controls the bottom\
    \ of the image.\n- Depth. Controls the amount of iterations used to calculate\
    \ this fractal. The higher number of iterations, the more detail, although this\
    \ is not always practical.\n- Edges. Determines how the edges are dealt with.\
    \ Experiment with your options to get the best results:\n    - Smear. Fills in\
    \ empty spaces by smudging them together.\n    - Black. Fills in empty spaces\
    \ with black.\n    - Wrap. Creates the most attention-getting images.\n\n# 14.11.4\
    \ Illusion\n\nThe Illusion filter acts somewhat like a kaleidoscope. It divides\
    \ an image into several pieces and displays them over the original image. Using\
    \ this filter is very simple:You simply enter the number of pieces into which\
    \ to split the image."
  merge: -1
  pgno: 254
- img_proc: true
  md: "# 14.11.5 Make Seamless\n\nThe Make Seamless filter acts similarly to the Illusion\
    \ filter. It divides the image and puts puts the new tileable layer on top.This\
    \ makes it perfect for use as a back-ground in a Web page, or anywhere it needs\
    \ to be tiled. There are no options for this filter.\n\n# 14.11.6 Map Object\n\
    \nThe Map Object filter maps an image to an object—either a sphere or a plane.\
    \ This filter is great for creating annoying animations for Web pages. It can\
    \ also be used for creating useful images as well.\n\nThis filter is very CPU\
    \ intensive. When working with this filter, be patient. Updates can take a long\
    \ time, especially when using anti-aliasing. The following options are available\
    \ with this filter:\n\n+   The Options Menu (see Figure 14.76):\n    a. Map To.\
    \ The only available shapes for the map object are a box, cylinder, plane, and\
    \ sphere, although newer objects are being added as the plug-in develops. Note\
    \ that when using the box or cylinder, additional options are available for the\
    \ images to be used.\n    b. Transparent Background. You can choose to have a\
    \ transparent background or use the current background color.\n    c. Tile Source\
    \ Image. This option toggles the tiling of the source image on and off. This only\
    \ works when dealing with planes, and makes the transparent background option\
    \ unnecessary, since there is no background with this option.\n    d. Create New\
    \ Image. Either create a new image, or just replace the current one.\n    e. Enable\
    \ Tooltips. They appear when you leave your cursor over an option for a short\
    \ time. They take a few of your CPU cycles, so if you really need the performance,\
    \ disable them.\n    f. Enable Antialiasing. This should always be used when dealing\
    \ with this filter because without it, the quality of the new image is poor.\n\
    The Light Menu (see Figure 14.77)\n    a. Lightsource Type.:\n        * Point\
    \ light\n        * Directional light\n        * None"
  merge: -1
  pgno: 255
- img_proc: true
  md: 'b. Lightsource Color. By default, this is white.


    c. Position. If you chose point light as the lightsource, the position of the
    source needs to be entered. This must be done by manually entering coordinates.
    If you zoom out slightly, there is a blue dot that allows you to place the lightsource.


    d. If you selected directional light, you must enter a direction vector for the
    light to travel in.


    The Material Menu (see Figure 14.78)


    a. Intensity Levels. There are two options in this section:


    +   - Ambient. Controls how much of the original color to show when no light hits
    it. This should be less than 1 to be realistic.


    +   - Diffuse. Determines the intensity of the original color when light does
    hit it.


    b. Reflectivity. There are three options here:


    +   - Diffuse. Controls how much light is reflected from this object.


    +   - Specular. Controls how intense the highlights will be.


    +   - Highlight. Controls how focused these highlights will be.


    The Orientation Menu (see Figure 14.79). This controls the shape and size of the
    object.


    a. Show Preview Wireframe. It is much easier to view the preview wireframe while
    working with the object. Turn the Show preview wireframe option on.


    b. Position and Orientation. This set of options controls the position of the
    object. A value of 0.5 is in the center.


    +   - X Pos. This controls the X position of the image in three-dimensional space.


    +   - Y Pos. This controls the Y position of the image in three-dimensional space.


    +   - Z Pos. This controls the Z position of the image in three-dimensional space.


    +   - XRot. This slider controls the XY rotation around the Z axis.


    +   - YRot. This slider controls the YZ rotation around the X axis.


    +   - ZRot. This slider controls the X rotation around the Y axis.'
  merge: -1
