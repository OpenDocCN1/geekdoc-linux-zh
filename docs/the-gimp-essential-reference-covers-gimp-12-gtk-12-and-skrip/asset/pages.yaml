    # 14.6.5 PageCurl


    The PageCurl filter (see Figure 14.48) simulates the corner of a layer lifting
    to show the layer or transparency underneath, like a piece of paper curling up.
    This filter has several different options to suit your image. Unfortunately, the
    size of the curl cannot be changed, so if you need a small curl, you will need
    to use selections. The PageCurl filter has the following options:


    +   - Curl Location (1). The curl can be placed in any of the four corners of
    the layer or selection.'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'Filters: Polar Coords


    +   - Curl Orientation (2). The orientation of the curl can be horizontal or vertical.


    +   - Shade Under Curl (3). Toggle the shading underneath the curl as well.


    +   - Use Current Gradient (4). The Coloring for the curl normally is the current
    foreground and background colors, but you can also toggle the use of the current
    gradient instead.


    +   - Curl Opacity (5). This option lets you simulate a transparent material like
    cellophane that is peeled off.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_236_0.png)


    Figure 14.48 The options menu for the PageCurl filter.


    # 14.6.6 Polar Coords


    Polar Coords remaps an image using polar coordinates and rectangular coordinates.
    You can remap from either polar to rectangular, or rectangular to polar. Polar
    Coords essentially maps a rectangle to a circle, or vice versa. This filter can
    make some very interrogating effects, especially when remapping from rectangular
    to polar. This filter also can be used for making primitive text curves (see Figure
    14.49) and circles.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_236_1.png)


    Figure 14.49 A simple text circle created with the Polar Coords filter.'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'There are several options used in the Polar Coords filter (see Figure 14.50):


    +   ■ Circle depth in percent.

    na. When mapping from polar to rectangular, this option adjusts the shape of the
    circle. At 100%, it is a perfect circle. As the depth gets smaller, the circle
    becomes less round, and at 0% it becomes a square.

    b. For rectangular to polar mapping, the effect is less obvious. At 100%, this
    option correctly maps a circle. At 0%, it correctly maps a square. Figures 14.51
    through 14.53 demonstrate this quite well.


    +   ■ Offset angle.

    a. For polar to rectangular mapping, this has the effect of moving the beginning
    (and end) counter clockwise in a circle.

    b. For rectangular to polar mapping, this moves the starting point along horizontally.


    +   ■ Map Backwards. If this option is selected, the image is mapped beginning
    from the right side instead of the left. For both types of mapping, this has the
    effect of flipping the image along the vertical axis.


    +   ■ Map from Top.

    a. For polar to rectangular mapping, this reverses the part of the image in the
    middle, and that which is around the outside.

    b. For rectangular to polar mapping, this determines which part ends up on top
    and ends up on the bottom. It essentially flips the image along its horizontal
    axis.


    +   ■ Polar to Rectangular. This last option switches back and forth between polar
    to rectangular and rectangular to polar.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_237_0.png)


    **Figure 14.50** The options menu for the Polar Coords filter.


    Some example images with the Polar Coords filter are shown here (14.51 through
    14.53)'
  merge: -1
