  md: '# 106 Writing Own Script-Fu: Using Script-Fu on an Image or Drawable


    The next step is the actual pixelation. plug-in-pixelize is called to pixelize

    the layer with an amount of maxPixel. The number of frames left is then

    demented by 1, and maxPixel is decremented by delta. This finishes the

    let* and while statements.


    Finally, the base layer is renamed to Frame 1, and the new image is displayed:

    (gimp-layer-set-name base-layer "Frame 1")

    (gimp-display-new-image)


    # 6.3.4.4 Cleanup


    We will also add additional cleanup by disabling undo recording. Our final

    script looks looks like this:


    ```

    (define (script-fu-pixel-anim img maxPixel totalFrames)

    let*

    (

    ; Declare variables and assign values

    (maxPixel (max 1 maxPixel)

    (totalFrames (max / 1 totalFrames))

    (delta ( / maxPixel totalFrames))

    (framesLeft totalFrames)

    (image (car (gimp-channel-ops-duplicate img)))

    (base-layer (car (gimp-image-get-active-layer image)))


    ; Disable undo recording

    (gimp-image-disable-undo img)


    ; Set loop condition

    (while (> framesLeft 1)

    let*

    (

    ; Copy layer

    (pixel-layer (car (gimp-layer-copy base-layer TRUE))

    (layer-name (string-append "Frame "

    (number-string framesLeft))))


    (gimp-image-add-layer image pixel-layer)

    (- totalFrames framesLeft))

    (gimp-layer-set-name pixel-layer layer-name))


    ; Pixelize it by the maximum - % frames elapsed

    (plug-in-pixelize

    TRUE

    image

    pixel-layer

    maxPixel)

    )


    ; Decrement framesLeft and maxPixel

    (set framesLeft (- framesLeft 1)))

    ```'
