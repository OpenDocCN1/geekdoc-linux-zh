  md: '# 14.14.6 Grid


    The Grid filter creates a grid system on an image. It draws lines that are one
    pixel wide, dividing the image up into rectangles. This filter uses the following
    options:


    +   - Size (X/Y). This determines the width and height of the rectangles.

    - Offset (X/Y). This determines the offset of the first square downward to the
    right. Negative values are allowed.


    # 14.14.7 IFSCompose


    This filter creates an Iterated Function System fractal (see Figure 14.98). It
    can create shapes similar to ones found in nature. It is especially useful for
    creating leaves and spirals. It is very versatile, and has created some of the
    most interesting GIMP art found on the Internet. This filter''s menu is split
    into several areas:


    +   - The design area exhibits a wireframe display of the fractals (1). By default,
    they are triangular, and numbered 0 to 2.

    - Fractals can be added or deleted by using the buttons at the bottom. The center
    of the fractals is represented by a small cross-hair.

    - Fractals are selected by clicking on them. If you wish to select multiple fractals,
    hold the Shift key while clicking.

    - You can modify these fractals by clicking and dragging with the mouse. Use small
    mouse movements; otherwise, you can ruin your image. The operation is selected
    by clicking on the buttons, or by right-clicking in the design area.


    The following operations can be performed on the fractals:


    +   - Move (2). Hotkey [M]

    - Rotate/Scale (3), Hotkey [R]

    - Stretch (4). Hotkey [S]

    - Select All. Accessed by right-clicking.

    - Recompute Center. Accessed by right-clicking. Hotkey [Ctrl+A]

    - Undo/Redo. Accessed by right-clicking. Hotkey [Alt+R]'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# 250 Filters: IFSCompose


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_273_0.png)


    Figure 14.98 The Wireframe window showing three fractals.


    The Spatial Transformation page displays the information about the currently selected
    fractal. The values can be edited. The following parameters are available for
    each fractal (shown in Figure 14.99):


    +   - X. The X coordinate.

    - Y. The Y coordinate.

    - Scale. Increases or decreases the size of the fractal. The larger, the greater
    impact it has on the image.

    - Angle. Determines the direction in which the fractal is pointing.

    - Asymmetry. Shrinks or widens the base of the fractal.

    - Shear. Moves the tip of the fractal from side to side.

    - Flip. Flips the fractal around its center.

    - Relative Probability. Controls the amount of impact a specific fractal has on
    the image.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_273_1.png)


    Figure 14.99 The Spatial Transformation page.'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'In the Color Transformation page (see Figure 14.100), the color of the currently
    selected fractal can be adjusted. By default, the fractal''s color is set to the
    current foreground color, but it can be changed. There are two ways of achieving
    this:


    +   **Simple (1).** This method automatically calculates the color shift for you.
    The original color is displayed in the first box. The new color is displayed in
    the second box. Click on the second box to change its color. By changing the Hue
    and Value, you change the way the color shift is calculated.


    +   **Full (2).** This method manually adjusts different color ranges. Each box
    affects a different color range. The colors are shifted here by changing the colors
    in the boxes. For example, if you have a fractal that is mainly red, and change
    the red box to yellow, the fractal will become mainly yellow. The following boxes
    are available:


    +   a. Red


    +   b. Green


    +   c. Blue


    +   d. Black


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_274_0.png)


    > **Figure 14.100** The Color Transformation page.


    The second part of this filter is the preview area. This controls the preview
    of the image, and also the rendering options. Automatic previewing can be turned
    on and off here.


    The following rendering options are available by clicking on the Render Options
    button:


    +   **Max Memory.** Determines the maximum amount of memory used by this filter.
    Increasing this value will make it render more quickly. Enter values in multiples
    of 4096.


    +   **Iterations.** Determines how many times the fractal repeats itself.


    +   **Subdivide.** Controls the level of detail in the image.


    +   **Spot Radius.** Determines the thickness of the brush-strokes to paint the
    image. A larger spot radius results in a longer rendering time.


    If you have changed the settings in this filter beyond recognition, use the Defaults
    button to reset the filter. Once you have an image to your liking, click OK. If
    you want to cancel these operations, click on the Cancel button.'
  merge: -1
  pgno: 274
