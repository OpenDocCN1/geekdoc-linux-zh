- img_proc: true
  md: '# Window Managers and the GIMP


    A window manager is a strange concept to new users. It is a part of the Graphical
    User Interface used by Linux. It controls how windows are displayed, moved, resized,
    closed, and so on. The server is the other part of the GUI that controls the more
    basic interface, drawing on the monitor, and so on.


    There are many different window managers available to use on a Unix system. All
    of them will run with the GIMP. However, with the window managers becoming more
    complicated, there may be some idiosyncrasies.


    # B.1 Command-Line Options for the GIMP


    The GIMP is usually run by issuing the gimp command. Sometimes additional parameters
    need to be passed to a program. The GIMP recognizes the parameters:


    | Table B.1 Parameters Effect |

    | Parameter | Effect |

    | -h --help | Display a text help message. |

    | -v --version | Display the GIMP''s version. |

    | -b --batch commands | Run the GIMP in batch mode. |

    | -n --no-interface | Run without a user interface. This is used in conjunction
    with batch mode. |

    | --no-data | Do not load patterns, gradients, palettes, or brushes. |

    | --verbose | Show startup messages. |

    | --no-splash | Do not show the startup window. |

    | --no-splash-image | Do not add an image to the startup window. |

    | --no-shm | Do not use shared memory between GIMP and its plug-ins. |

    | --no-xshm | Disable use of the X Shared Memory extension. This option shouldn''t
    be used unless you are using an X server over a network. |


    continues'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# 292 Window Managers and the GIMP: AfterStep


    | Table B.1 Continued |

    | Parameter | Effect |

    |---|---|n| --console-messages | Display all warnings to the console instead of
    a dialog box from the GIMP. This is useful if you want to log any error messages.
    |

    | --debug-handlers | Enable debugging signal handlers. |

    | --display display | Use the designated X display. |


    # B.2 Common Window Managers


    The descriptions of these window managers are very general. Different distributions
    install them in different places, so the filenames here may not be correct. Most
    of the configuration files are located in a share directory. This could be /usr/share,/usr/X11r/share,/usr/local/
    or something similar.


    # B.2.1 AfterStep


    AfterStep runs the GIMP out of the box. It is located in the Root menu in Applications/Multimedia/The
    Gimp. The configuration file for the GIMP is in \~/GNupstep/Library/AfterStep/start/Applications/Multimedia/4_gimp.
    AfterStep''s home page is located at http://www.afterstep.org.


    # B.2.2 Blackbox


    Blackbox is a lightweight window manager. The GIMP is located in the Root menu
    in Graphics/The Gimp. The configuration file for the GIMP is found in the \~/.blackbox/Menu
    file. Blackbox''s home page is located at http://blackbox.alug.org.


    # B.2.3 Enlightenment


    Enlightenment is a highly configurable window manager that uses a great deal of
    your system''s resources. The GIMP is located in the Root menu in Applications/Gimp.
    The configuration file can be found in share/enlightenment/config/menus.cfg.


    # B.2.4 GNOME


    GNOME is a desktop environment. It works together with a window manager. The GIMP
    is located inside the Gnome Menu foot in Graphics/The Gimp. The configuration
    file for the GIMP is found in share/gnome/apps/Graphics/GIMP.desktop. If you want
    to add your own entry, it would be found in \~/gnome/apps. After an entry is added
    using the Gnome Menu Editor tool, it appears here. Trying to add it by hand would
    be difficult.'
