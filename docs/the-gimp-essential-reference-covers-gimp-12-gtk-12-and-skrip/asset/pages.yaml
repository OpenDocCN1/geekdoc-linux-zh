    # 14.11.2 Displacé


    The Displacement filter is an all-purpose filter used to distort images (see Figures
    14.72 through 14.74 for an example).It is especially good for bending text and
    lines around images, or creating very precise warping and smearing effects. It
    is in the Map menu because it uses an image (usually grayscale) to get the information
    for the distortion.


    The Displacement filter, like most of the Map filters, can be complicated at times.
    The first concept to learn is how the image used for the map affects the image.
    For this filter, always use a grayscale image for the map that is the same size
    as the image you want to distort. The effect of the map has on the original image
    is based


    +   - Any pixel that is black (value 0) will displace the full amount, either
    downwards or to the right, or both.

    - Any pixel that is white (value 100) will displace the image upwards, to the
    left, or both.'
  merge: -1
  pgno: 252
- img_proc: true
  md: "# 230 Filters: Displace\n\n+   - Any pixels that are perfectly gray (value\
    \ 50) will have no effect on the image.\n- Pixels that lie between these values\
    \ will displace the image proportionally to their value, so if a pixel is halfway\
    \ between black and gray (value 25), it will displace half the amount.\n\nAlso,\
    \ note that transparent pixels will not affect the image. Using transparency is\
    \ often more useful than using gray to avoid affecting all areas. Partially transparent\
    \ pixels will affect the image in proportion to their transparency and color.\n\
    \nNow that you know how the maps work, here are the options for this filter (refer\
    \ to Figure 14.75):\n\n+   - The displacement can be done independently for each\
    \ axis (1). If you want to displace along one axis only, they can be toggled on\
    \ and off.\n- The amount of displacement (2) for each axis is entered here.\n\
    - Each map is selected (3).\n- The mode for dealing with empty edges is chosen\
    \ (4):\n\n+     a. Wrap. This will wrap the edge from the other side.\n  b. Smear.\
    \ This is usually the best option for this filter. It fills in empty areas by\
    \ smudging the edges.\n\n+     c. Black. Sets empty areas to black.\n\n![](img/f2e1dc39d482e76a84057f638c7a2d3f_253_0.png)\n\
    \nFigure 14.72 The original image before the map was applied.\n\n![](img/f2e1dc39d482e76a84057f638c7a2d3f_253_1.png)\n\
    \nFigure 14.73 A sample image used as a map."
  merge: -1
