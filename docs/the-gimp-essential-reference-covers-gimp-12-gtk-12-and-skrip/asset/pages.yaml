- img_proc: true
  md: '# Image Operations: Levels


    The idea behind the Curves menu is straightforward. Darker pixels are adjusted
    on the left side of the graph, and lighter pixels are adjusted on the right side.
    For reference, two grayscale gradients are placed at the bottom of the graph.
    The top gradient (6) is a representation of the actual image colors that are being
    changed. The lower gradient (7) is a reference gradient to show what a normal
    curve looks like. If you make a mistake in adjusting the curves, there is a reset
    button (8) at the bottom to return the graph to the original line.


    For the best results in adjusting the curves of an image, gentle S-shaped curves
    are recommended, as seen in Figure 4.12. Changes to the curves should be minimal.
    To adjust the brightness in an image, drag the curve at the midpoint of the line.
    This adjusts the gamma of the image. Another useful operation is to drag a straight
    line along the top or bottom corners. This adjusts the contrast of the image.
    To understand the way the Curves menu works, it is helpful to view a histogram
    of before and after adjustments of curves (see Figures 4.13 and 4.14).


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_80_0.png)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_80_1.png)


    Figure 4.13 The original picture.


    Figure 4.14 The image after a gentle S-curve has been applied.


    # 4.1.9 Levels


    Levels is another excellent graphical tool for adjusting color in an image. This
    menu has the same effect as the Curves menu, but its interface is different. In
    the Levels menu, a histogram of the image is shown, as seen in Figure 4.15. There
    are two slider bars at the bottom:


    +   - The top slider (1) represents the range of colors available.

    - The bottom slider (2) represents the overall brightness of the image.


    Levels can be used with all channels and value at once, or each channel separately.
    This tool also works on grayscale images, where only the black and white levels
    can be adjusted. Levels are adjusted by sliding the arrows or entering values
    with the keyboard (3). When modifying input levels for Value, you are adjusting
    the brightness of the image. Any pixels to the left of the black arrow (4) will
    be changed to black, and anything to the right of the white arrow (5) is changed
    to'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# Image Operations: Levels


    white. The gray arrow (6) represents the midrange of the colors. This gamma setting
    for the image can be altered in the same way as adjusting the midpoint of the
    curve in the Curves menu. Sliding it to the left makes the image lighter, and
    sliding to the right makes it darker.


    When modifying input levels for specific Color channels, the slider works somewhat
    differently. The levels now work on the amount of color in the image. An area
    that is completely white has full amounts of all the colors, and will not be affected
    by adjusting levels. An area that is completely black has no color, and will not
    be affected by adjusting levels. The only areas that are affected are the ranges
    between black and white. Any pixel that is to the left of the black arrow (4),
    for example, will have its channel removed. Dragging arrow to the right has the
    effect of changing a gray image to the channel''s complimentary color.


    For example, when working on a gray image in the Red channel, dragging the black
    arrow (4) to the right will make it cyan. Any pixel that is to the right of the
    white arrow (5) will be given the full value of its channel. If you are working
    in the Green channel, this will give the image a green hue. The gray arrow represents
    the midrange of the color. Dragging to the left adds more of the channel''s color
    to the pixels, and dragging to the right removes the channel''s color from the
    pixels. The bottom slider represents the overall level of the channel. Dragging
    the black arrow to the right makes the image brighter, when using Value for the
    channel, or increases the amount of the color in the image for a specific color.
    Moving the white arrow to the left increases the amount of complimentary color
    in the image when working in a Color channel. When working in the Value channel,
    it makes the image darker. Unlike the bottom slider does affect solid black


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_81_0.png)


    Figure 4.15 The Levels menu with adjustments made to lighten the image.'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# 4.1.10 Desaturate


    Desaturate removes all color values from the pixels in an image, turning it into
    a gray image. Note that this does not make it a grayscale image—it is still RGB.


    # 4.1.11 Auto Stretch Contrast and HSV


    The Auto Stretch Contrast and HSV tools automatically adjust the levels in an
    image. They stretch the color range in the image over the full range of colors.
    Whereas Contrast does this in RGB mode, HSV does it in HSV mode. These These operations
    are both very useful for improving the quality of faded, overexposed, or poorly
    scanned pictures (see Figures 4.16 and 4.17).


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_82_0.png)


    Figure 4.16 The original picture.


    Figure 4.17 The image after being "auto stretched" with contrast.


    # 4.1.12 Normalize


    Normalize works in much the same way as Auto Stretch Contrast. It is an excellent
    tool for improving the quality of scanned photos. The difference between Normalize
    and Auto Stretch Contrast is that Normalize adjusts the levels of each channel
    as a whole, whereas Contrast adjusts them independently (see Figures 4.18 and
    4.19).


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_82_1.png)


    Figure 4.18 The original picture.


    Figure 4.19 The image after being normalized.'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# 4.2 Channel Operations


    Channel operations don''t fit into one specific category, but each one can be
    useful. Don''t forget about these operations: They come in handy when working
    on scanned photos.


    # 4.2.1 Duplicate [Ctrl+D]


    Duplicate creates a copy of the current image in another window. It keeps all
    properties like selections, layers, etc. This is very useful to do if you are
    going to change the image beyond the levels of undo.


    # 4.2.2 Offset [Shift+Ctrl+O]


    Offset shifts the image in the x- and y-axis by a specified amount. By default,
    it will wrap the image. This can be turned off, and the empty space will be filled
    with the background color. By itself, this operation is not very useful, but it
    is used in other filters and scripts to create interesting effects.


    There is a button that automatically sets the offset to the half height and width.
    This is useful for creatingable images.


    # 4.2.3 Compose and Decompose


    Compose and Decompose are very useful for cleaning up scanned photos. These operations
    can also be used to create different artistic effects such as color swapping.


    Decompose breaks an image down into its separate channels. Each channel is represented
    by a grayscale scale.


    There are several types of breakdowns in the Decompose menu:


    +   - RGB. Separates the image into Red, Green, and Blue channels.

    - HSV. Separates the image into Hue, Saturation, and Value channels.

    - CMY. Separates the image into Cyan, Magenta, and Yellow channels.

    - CMYK. Separates the image into Cyan, Magenta, Yellow, and Black channels.

    - Alpha. Gives you a single window that represents the Alpha value of the image.
    Alpha works with RGBA only when composing, so always use RGB for decomposition
    if you have an Alpha channel. To use CMY or CMYK with Alpha, there are a few steps
    you must follow:


    +   1. Extract the Alpha channel.

    2. Decompose into CMY or CMYK.

    3. Edit the image as needed.

    4. Compose it into CMY or CMYK.'
  merge: -1
  pgno: 83
- img_proc: true
  md: '5. Decompose into RGB.


    6. Compose (with the Alpha channel) into an RGBA.


    Compose does the opposite of Decompose: It creates a color image from different
    grayscale images, as shown in Figure 4.20.


    The options in this menu are:


    +   - RGB creates a color image from three grayscale images that represent the
    Red, Green, and Blue channels.


    +   - RGBA is similar; however, it allows you to add an Alpha for transparency.


    +   - HSV compose an image based on Hue, Saturation, and Value.


    +   - CMY and CMYK compose an image based on the complimentary colors of RGB:
    cyan, magenta, and yellow. CMYK adds a Black channel to CMY, which is essential
    if you are separating the image for printing.


    Compose and Decompose can help you adjust the Curves or Levels for a specific
    color. This is an advantage when manipulating scanned photos, as color problems
    are sometimes hard to fix when working in all colors at once. An excellent filter
    is Despeckle (see page 221). You will find that the blue channel looks "noisy"
    on scanned photographs; running Despeckle improves it greatly.


    Also, strange color effects can be created by composing an image. For example,
    the Green channel of an image can be used as the Red channel when composing.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_84_0.png)


    Figure 4.20 The Compose menu creating an RGB image from three grayscale images.


    # 4.3 Alpha


    This section of the Image menu deals with Alpha, or the transparency of an image.


    # 4.3.1 Add Alpha Channel


    Add Alpha Channel is the most commonly used operation. This creates an Alpha channel
    in the image to allow transparency in your background layer. Single-layer images
    cannot use transparency until this is done.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# 4.3.2 Threshold Alpha


    Threshold Alpha is very similar to the Threshold operation. It is used to change
    an image with 255 "shades" of Alpha to a 1-bit Alpha layer. A 1-bit Alpha layer
    means that a pixel is either fully opaque, or fully transparent. This operation
    is used to change an RGB image with various levels of transparency to something
    suitable for the Web, such as GIF format. There is no histogram displayed, so
    you must guess the Alpha values for the image. Any pixel with an Alpha value that
    is less than the selected value will become fully transparent. Any pixel that
    has a higher Alpha value will become fully opaque.


    # 4.4 Image Types


    Image type is important in the Gimp. The Gimp determines how the Gimp deals with
    the color information in your image. What type you use depends on the application
    and the file format of the image. RGB is the preferred type to work in because
    it supports the greatest number of operations and filters. Chapter 5, "Choosing
    the Right File Format," discusses the different file formats and provides more
    information about which image type to use.


    There are three different image types available'': RGB, Indexed, and Grayscale:


    +   ** RGB.** Most common.

    ** Indexed.** Popular because of the file formats that are indexed, the best known
    being GIF.

    ** Grayscale.** Used the least because it doesn''t support colors. If the image
    you are creating will be in black and white, however, it is much better to work
    in grayscale.


    Changing the image type should be the first and/or last operation done on an image.
    Switching between different image types can cause you to lose information. RGB
    should be used whenever possible. Most plug-ins do not work with indexed images.
    If you load an indexed image, immediately change it to RGB.


    > People who do preprocess work should note that the Gimp does not yet support
    CMYK. Anyone who adds CMYK support to the Gimp will earn their few minutes of
    fame.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# 4.4.1 RGB


    The method of representing colors in RGB is fairly straightforward. Each pixel
    can contain different amounts of red, green, and blue. The values can range from
    0 (no color) to 255 (full color) for each channel. A white pixel has full amounts
    of all colors (R: 255, G: 255, B: 255). A black pixel has no color values at all
    (R: 0, G: 0, B: 0). This allows for many different color combinations. The Gimp
    allows Alpha values that range from 0 (fully transparent) to 255 (fully opaque).


    The Color Selection menu is based on this color model. Most image formats such
    as JPEG, BMP, and PNG are use the RGB color model.


    # 4.4.2 Indexed


    Indexed images work differently from RGB. Indexed images can use a maximum of
    256 colors, which are chosen from a possible 16.7 million colors. The color table
    for each indexed image is stored in the image itself. This table might tell the
    program displaying the image to use color number 42 for pixel 25, for example.


    The problem with this method is that not all programs have the same color for
    the value described in the image. This creates problems when viewing images in
    programs that don''t have all of the colors available. Are huge problems when
    viewing indexed images on different platforms. Another disadvantage of indexed
    images is that they have only 1-bit Alpha support, so transparency doesn''t work
    well very.


    If are so many problems associated with indexed images, why use them? There are
    a few advantages to using indexed images. If you are intend to display your images
    with the same program, on the same platform, indexed images can be very useful.
    Second, only the necessary colors are used, so the file sizes of indexed images
    are significantly smaller than those of other format. Indexed images also allow
    more colors to be used in other, more important, images and programs. Finally,
    indexed images are perfect for icons and other small images. The most common indexed
    file formats are GIFs and BMPs.


    There are several options presented when converting an image to indexed form,
    as shown in Figure 4.21.


    +   - Number of colors. Lowering the number of colors available will obviously
    degrade the image quality, but it will make the image size much smaller.


    +   - Custom palette. This option lets you choose from one of the palettes included
    with the Gimp, or one you created yourself (see "Saving Palettes," page 65).


    +   - Use a 1-bit palette. This option isn''t very useful—you will rarely use
    it.'
  merge: -1
  pgno: 86
- img_proc: true
  md: 'At the bottom of this menu is the option Floyd-Steinberg Dithering. This option
    will d your image to appear to have a wider range of colors than you have. Dithering
    uses dots of color to create the illusion of different colors.


    | Palette Options | |

    | --- | --- |

    | Grayscale palette | # colors: 256 |

    | Use dithered palette | |

    | Use custom palette | Dark_palette |

    | Use black-white (1-bit) palette | |

    | Dither Options |

    | Enable Floyd-Steinberg dithering |

    | OK | Cancel |


    Figure 4.21 The options available when converting to an indexed image.


    # 4.4.3 Grayscale


    Grayscale images are similar to RGB images, but they only have one channel of
    color. This "color" is actually shades of gray. Pixels in a grayscale image have
    a maximum of two values: Intensity and an optional Alpha. Intensity refers to
    how much white is in the pixel and can range from 0 (black) to 255 (white). Alpha
    can range from 0 (transparent) to 255 (opaque).


    Grayscale images can be saved in many formats. It can easily be converted to Indexed,
    since indexed images support 256 colors. They don''t care if these colors are
    just black and white.


    # 4.5 Histograms


    Histograms are very useful when working with scanned images and adjusting their
    curves and levels. A histogram displays a bar graph of the various levels of intensity
    in an image. Clicking and dragging on the bar graph shows specific information
    for that range.


    The histogram for a scanned image can reveal some important information. If the
    right side of the histogram seems to be cut off, the picture was probably too
    dark, and the brightness on the scanner should have been adjusted. If the left
    side seems clipped, the picture was too light, and the scanner''s brightness should
    be turned down. If there are many random spikes spread along the entire graph,
    the image is probably "noisy," and it could use some Despeckling (page 221). To
    get a good idea of what the Auto Stretch Contrast and HSV operations do, look
    at a histogram before and after it is applied, as in Figures 4.22 and 4.23.'
  merge: -1
  pgno: 87
- img_proc: true
  md: '# Image Operations: Resizing Images 65


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_88_0.png)


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_88_1.png)


    Figure 4.22 A histogram of a scanned image after any adjustments are made.


    Figure 4.23 A histogram of a scanned image after Normalize has been applied.


    # 4.6 Saving Palettes


    Saving a palette is only possible when working on an Indexed image. This function
    is useful if you have created an image with the perfect color scheme, and want
    to use the same color scheme on other images. The GIMP will save your palette
    in your GIMP directory with all of the other palettes. To use it, you must refresh
    the Palette menu (see “Palettes,” page 176).


    # 4.7 Image Transforms


    You will use these image transformations quite often when working on any image,
    so it is useful to become familiar with them. They all deal with layers as a whole
    rather than adjusting individual pixels. The most common transform is resizing
    images.


    # 4.7.1 Resizing Images


    Resizing Images can be deceiving. This operation resizes the canvas of the image,
    not the layers in the image. With this operation, you can choose specific values
    to change, or adjust it by ratio. Units to measure by be chosen in this menu.
    The menu is shown in Figure 4.24. By default, the ratios are constrained, but
    can be deselected and adjusted independently (1). The offset can also be chosen
    here (2). At the bottom of the Resize menu is a preview (3) of what the image
    will look like. It can be dragged to change the offset. The black box represents
    the current canvas size, and the movable gray box is. Again, note that this does
    not adjust the size of any layers—just the canvas. Layer sizes must be adjusted
    in the Layers menu (see “Resizing Layers,” page 42).'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# 4.7.2 Scaling Images


    This operation adjusts the image itself, not just the canvas size. Adjustments
    can be made to the actual size, or by ratio. Units used to scale can be chosen
    here. The height/width ratio can be constrained, or by clicking the “link,” you
    can adjust them independently. In the second half of this menu, the image can
    be scaled based on real size and resolution.


    # 4.7.3 Autocrop


    Autocrop will automatically crop away large parts of single colors or transparency
    to leave the image in the center. Autocrop takes into account only the active
    layer, so you might lose parts of the image in other layers if you do this.


    # 4.7.4 Zealous Crop


    Zealous Crop is similar to Autocrop, but it will actually make changes to the
    active layer. It will attempt to move any objects in the image as close together
    as possible, and will crop away the outside edges. This effect is apparent only
    on simple images. On complex images it won''t have much effect.


    # 4.7.5 Image and Layer Rotations


    These operations provide rotations without having to use the slow tool. They can
    be applied to the active layer, or to the whole image. When applied to the active
    layer, they will not adjust the size of the layer. If needed, that must be done
    later. When they are applied to the entire image, there is no need to adjust the
    layer sizes. These rotations can only be done in 90-degree increments. They can
    only go clockwise, so if you want to rotate 90 degrees counterclockwise, choose
    270 degrees.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_89_0.png)'
  merge: -1
