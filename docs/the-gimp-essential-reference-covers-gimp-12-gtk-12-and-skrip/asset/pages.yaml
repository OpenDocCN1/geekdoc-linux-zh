  md: '# Extending the GIMP: The Freefont Package


    If you were able to listen to the developers of the GIMP describe its advantages,
    you would hear that it is modular and as independent as possible. For you and
    me, this means that it is very easy to customize and streamline the GIMP as much
    as we please. Almost every aspect of the GIMP can be changed if you know how.
    For instance, the look of the GIMP is easily changed through GTK+, plug-ins can
    be downloaded off the Internet and installed easily, and scripts can be downloaded
    and used instantly. This chapter will look at these extensions, and more like
    them, so you can get the most out of the GIMP.


    # 7.1 Fonts


    The first thing you will want to do if you are going to be using the GIMP seriously
    is to ensure that you have all the necessary fonts installed. Fonts are controlled
    by your X server, this procedure may require you to dig through your documentation.
    In this book, configuration specific to the XFree86 system is used. This is because
    it is the most common and portable. If you are not using XFree86, consult your
    vendor for assistance adding fonts.


    # 7.1.1 The Freefont Package


    The Freefont package is very useful for using the Script-Fu. The fonts used by
    default on most Script-Fu scripts are ones from the Freefont package. If you can
    use fonts like Blippo or Roostavy, then you have the Freefont package. Linux distributions
    these days will usually come with the Freefont package installed. If you have
    another distribution of Linux, you may have to install Freefont. It can be downloaded
    from http://metalab.unc.edu/pub/Linux/X11/fonts/freefonts-0.10.tar.gz. RedHat
    and Debian users may be able to download the appropriate package files. Check
    their respective Web sites for more information.


    To manually install the fonts, follow these steps:


    +   1. Log in as root, or use the su - command to be root.


    +   2. Change into the /usr/X11/lib/fonts directory.


    +   3. Type tar xvzf <path to file>.


    +   4. Start your X server if it is not already running.


    +   5. Type xset fp+/usr/X11/lib/fonts/freefont && xset fp refresh to make your
    X server aware of these new fonts.


    +   6. Check whether the fonts have been installed properly by using the xfonts
    program. If you see fonts like Roostheavy and Dragonwick, the installation worked.'
  merge: -1
