- img_proc: true
  md: 'This will create a new directory with the unpacked files in it. The general
    process for building libraries will be to change to the directory, and type each
    of the following in order:


    +   1. /configure


    +   2. make


    +   3. make install


    +   4. ldconfig


    This is the standard GNU way of installing a program from the source code, some
    libraries do not follow this method. It is essential to read the README and/or
    INSTALL files included in the packages to avoid compilation problems. If you run
    into problems installing, and want to start fresh, type the following:


    make clean


    This will clean the directories out, and you can start over.


    # A.3.2 Jpeglib


    The first library to install is jpeglib. It can be found here:


    ```

    ftp://ftp.uu.net/graphics/jpeg/

    ```


    Unpack the downloaded file into /usr/local/src. Change into the newly created
    directory and type the following:


    ```

    ./configure

    ```


    By default, this will install you into /usr/local/lib directory. This will configure
    the program to compile on your computer. When it is finished running, type the
    following:


    ```

    make && make test

    ```


    If there are no errors, type the following:


    ```

    make install

    ```


    At this point, edit the file called /etc/ld.so.conf. If you do not see /usr/local/lib
    in this file, add it to the last line. Next, type the following:


    ```

    /sbin/ldconfig -v | more

    ```


    You should see several files starting with libjpeg* in the output.


    # Zlib


    Zlib is a compression library required to use the PNG file format. It can be downloaded
    from this location:


    ```

    ftp://ftp.cdrom.com/pub/infozip/zlib/

    ```'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# Installing the GIMP: Libtiff 283


    Unpack this package and change into the new directory. Zlib uses a different

    configure script for installation, but the command line options are similar. Type

    the following to set it up to be compiled:


    ```

    ./configure

    ```


    Use the --prefix option to set a different install location:


    ```

    make test

    ```


    This should run without any errors. If you do encounter errors using make

    test, check the README file for additional instructions. Assuming that it runs

    without any errors, type the following:


    ```

    make install && ldconfig

    ```


    # A.3.3 PNG


    The PNG library is required to read and write PNG files. It can be obtained

    here:


    ```

    ftp://ftp.uu.net/graphics/png/src/

    ```


    Zlib must be installed and working before PNG can be installed. PNG''s

    installation process is not a standard method, so it is important that you read

    the INSTALL file carefully. To begin, when you are in the libpng directory,

    type the following:


    ```

    cp scripts/makefile.lnx Makefile

    ```


    Next, edit pngconf.h to make any necessary configuration changes. Standard

    Linux systems should not need any changes.


    Note that if you are running a PowerPC processor, uncomment the line that

    refers to PNG_BIG_ENDIAN_SUPPORTED.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_306_0.png)


    Next, type the following:


    ```

    make test

    ```


    This will run a small test program that reads a sample PNG file and saves it in

    an alternate file. If these two PNG files are identical, the PNG library is ready

    to compile. If you have problems at this point, go back and make sure zlib is

    installed correctly. If you ran make test in the zlib directory, and it worked,

    zlib is installed correctly. Next, type the following:


    ```

    make install && ldconfig

    ```


    PNG is now installed on your system.


    # A.3.4 Libtiff


    Libtiff is very easy to install. It can be found here:


    ```

    ftp://ftp.sgi.com/graphics/tiff

    ```


    Unpack this file and change to the tiff-<version number> directory.'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'Documentation for this is in the html directory. If you wish, read the index.html

    file and its instructions. If you have a standard Linux system, type the following:

    ./configure && make


    If there are no errors, type the following:

    make install && ldconfig


    The libraries described previously are all that are necessary to run a functional

    GIMP. Other libraries can be installed, but they have very specific purposes,
    and

    most users will not need them. The next library, GTK+, is necessary to run the

    GIMP.


    # A.4 Installing GTK+


    GTK+, or the GIMP ToolKit, is an extremely flexible library for creating

    graphical user interfaces for the X Window System. Many applications Linux

    use this library, and you will find it very useful to have installed on your system.

    Because of its popularity, GTK+ may already be installed on your system.

    may cause difficulties if it is out of date, unless you have the latest version
    of

    GTK+, remove the old library and install the newer version.


    # A.4.1 Building and Installing Glib and GTK+


    If you decided to upgrade or install GTK+, it is necessary to download it. The

    GTK+ homepage is http://www.gtk.org, and the files are located here:

    ftp://ftp.gtk.org/pub/gtk


    The first step is to install glib was previously included in GTK+, but has

    grown to warrant its own distribution. It will be located in the same

    directory as GTK+. Unpack the glib archive first, and change into that directory.

    Type the following to configure the archive for your system:

    ./configure -disable-debug


    When that has completed, type the following:

    make


    The most common error with this library has to do with threads. If an error

    occurs occurring regarding threads, reconfigure glib with the --enable-threads=no
    option.


    If glib finished installing with no errors, type the following:

    make install && ldconfig


    glib will be configured for your system. After this has completed, change back

    into the /usr/local/src directory and unpack the GTK+ archive. To configure

    this package, type the following:

    ./configure - disable-debug'
  merge: -1
