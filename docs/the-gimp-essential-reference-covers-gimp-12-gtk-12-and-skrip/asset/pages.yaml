  md: '# 10

    Drawing Tools


    | Page | Contents |

    |---|---|

    | 140 | **Pencil**—The most basic drawing tool; draws simple lines. |

    | 141 | **Paintbrush**—Works like a paintbrush in real life, drawing solid, smooth
    lines. |

    | 143 | **Airbrush**—Draws light, smooth lines; useful for touching images. |

    | 144 | **Bucket Fill**—Fills areas of similar color with a solid color or pattern.
    |

    | 145 | **Blend**—Creates a blend between two points of two colors or a custom
    gradient. |

    | 148 | **Text**—Places simple text on a layer. |

    | 150 | **Ink**—Simulates drawing with a real calligraphic pen. |'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'Depending on what you are doing, you may find that you never use the drawing
    tools at all. If you are touching up photographs, you may only use the airbrush
    tool with a very soft brush. If you are creating interesting logos and computer
    graphics, you may need to use the Text tool many times. It is useful, however,
    to know how to use each tool to its full potential to get the most out of the
    GIMP.


    # 10.1 The Pencil [Shift+P]


    Description The Pencil tool draws sharp lines that are the exact size of the current
    brush. It is useful for creating images with defined edges, or where it will be
    smoothed later. It ignores opacity information in brushes, making it either fully
    transparent, or fully opaque.


    Options Hold down the Shift key while clicking to draw a straight line from the
    last Pencil position to the current one.


    Color Picker Holding down the Ctrl key while clicking changes the tool to the
    Color Picker (page 166).


    Usage The Pencil tool works very much like a pencil would in real life. It has
    a hard edge, exactly the size of the brush. This is very useful for touching up
    images when using the 1x1 size brush. It ignores transparency information provided
    by the brush, and will make it opaque or transparent. This tool is most useful
    with computer-generated images. An example of lines drawn by the Pencil tool is
    shown in Figure 10.1. Figure 10.2 is an enlarged area of the same picture to demonstrate
    the jaggedness.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_163_0.png)


    Figure 10.1 Some example lines drawn with the pencil. Notice how they seem very
    rough around the edges.


    Figure 10.2 A portion of the image, enlarged so the jagged edges are apparent.


    See Also Brushes (172)'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# 10.2 The Paintbrush


    Description


    The Paintbrush tool creates lines with smooth edges, and acts very similarly to
    a paintbrush in real life.


    Options


    Incremental When this option is set, the brush strokes will add to one another.
    This option works only when the brush is set to an opacity less than 100.


    Fade Out


    This option makes the brush act as if there is a finite amount paint on it. When
    the mouse is used without releasing the button, the line will gradually become
    more transparent. This setting also depends on the size of the brush. The distance
    it travels before it begins to fade is the product of the brush size and the fade-out
    distance. When the brush begins to fade, it will always act as incremental, up
    to its maximum opacity. A setting of 0 turns the fade-effect off.


    Gradient


    This option uses the active gradient as the paint color. The distance the gradient
    travels is the length multiplied by the current brush''s radius. There are four
    types of gradient methods:


    +   - Once Forward. Draws the gradient only once, starting at the first color.

    - Once Backward. Draws the gradient once, starting with the last color and working
    backward.

    - Loop Sawtooth. Repeats the gradient, starting with the first color, going to
    the last, starting over with color.

    - Loop Triangle. Repeats the gradient, starting with the first color, going to
    the last, then drawing the gradient backward. This makes a much smoother transition
    for most gradients.


    Straight Line


    Hold down the Shift key while clicking to draw a straight line from the last Paintbrush
    position to the current one.


    Usage


    The Paintbrush works very much like a paintbrush would in real life. It creates
    lines with smooth edges through antialiasing, like paint spreading out on the
    paper. The Fade Out option is especially useful. It makes the brush seem as if
    it has paint on it, and it fades as you make brush strokes. Every time you release
    the mouse button, it is as if you are adding'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# 142 Drawing Tools: The Paintbrush


    more paint to the brush. The most effective brushes to use are the larger solid
    brushes. Feathered brushes will seem much smaller than solid ones of the same
    size. Some example lines drawn with the brush are shown in Figure 10.3. Note the
    much smoother lines, as shown in the enlarged portion in Figure 10.4.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_165_0.png)


    Figure 10.3 Lines drawn with the Paintbrush tool. Note that the edges seem much
    smoother (than the pencil tool, for instance) and the paint fades out to transparency
    on some of the strokes.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_165_1.png)


    Figure 10.4 A zoomed area from Figure 10.3, showing the smooth edges.


    ▶See Also Brushes (172)'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# 10.3 The Airbrush


    Description


    The Airbrush tool works like an airbrush or spray paint in real life. It creates
    very smooth lines.


    Options


    Rate


    This option is related to the movement of the cursor. A low setting will create
    a uniform line, and is not affected by movement as much. A higher rate setting
    means that the "paint" in the airbrush leaves faster, and will leave darker patches
    when the cursor slows down.


    Pressure


    This setting controls how much "paint" is sprayed out of the airbrush. Higher
    pressure settings make darker, more uniform lines. Low pressure settings are very
    uneven.


    Straight Line


    Hold down the Shift key while clicking to draw a straight line from the last Airbrush
    position to the current one.


    Usage


    The Airbrush works like a can of spray paint. You can vary the rate of "paint"
    coming out of the nozzle, and the pressure of the paint. For dark, uniform lines
    with soft edges, use a high pressure, but a low rate. To create a line that looks
    like it was created with a spray can, use a higher rate, but a lower pressure.
    This will make the line darker where the cursor is moved more slowly. The best
    brushes to use with this tool are the feathered ones. Feathered brushes appear
    much smoother and realistic than the solid ones. Some example lines drawn with
    the Airbrush tool are shown in Figure 10.5.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '![](img/f2e1dc39d482e76a84057f638c7a2d3f_167_0.png)


    Figure 10.5 Lines drawn with the Airbrush tool. Notice how some lines are uneven,
    and others are more uniform.


    See Also Brushes (172)


    # 10.4 The Bucket Fill Tool


    Description The Bucket Fill tool fills areas of similar color with the foreground
    color.


    Options Fill Threshold (1) (see Figure 10.6 for all options). This setting determines
    how much the Bucket Fill will "spill over." This is detected by changes in color
    or transparency. A higher setting will spread further over different colors.


    Fill Type (2) The fill type is chosen here with an option button. BG Color Fill
    will fill with the active foreground color. BG Color Fill will fill with the active
    background color. Pattern Fill will fill with the current pattern.


    Sample Merged (3) This option takes into account all of the layers for the threshold,
    but paints only on the active layer.


    Background Color Hold down the Shift key while clicking to use the background
    color to fill.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# Drawing Tools: The Blend Tool


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_168_0.png)


    Figure 10.6 Options menu for the Bucket fill tool.


    # Usage


    The Bucket Fill fills large areas of similar color or a selection with a solid
    color or pattern. This tool is most used to fill in backgrounds or flat areas
    in computer-generated images. The Bucket Fill tool does not work well with photographs
    because of subtle variations in color. The tool determines how much area it fills
    by detecting color changes. To stop after only a slight change in color, use a
    small threshold. To fill large areas, even after a significant color change, use
    a high threshold. A value of 255 for the threshold fills everything. If you have
    an active selection, using the Bucket Fill tool will fill the entire selected
    area, regardless of color.


    > *See Also Modes (44)


    # 10.5 The Blend Tool


    Description - The Blend tool creates a gradient between where the mouse button
    is clicked and where it is released.


    Options Offset (1) - Offset determines where the foreground color begins to fade
    into the background color (see Figure 10.7 for all options). A higher offset value
    makes the foreground color more prominent. This is not used for linear, shapeburst,
    or spiral gradients.


    Blend (2) - Blend determines how the colors in the gradient change.


    +   * RGB is the standard color blend.

    * HSV travels the full spectrum of colors for the blend.

    * FG to Transparent gradually fades the foreground to transparency.

    * Custom from Editor allows users to use a gradient from the gradient editor,
    or to make their own.'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# 146 Drawing Tools: The Blend Tool


    Gradient (3) Determines the shape of the gradient.


    +   * Linear spreads from the foreground color to the background, following the
    mouse click.

    * Bi-Linear fades from the background color, to the foreground, and to the background
    again. This is useful in creating 3D pipes and other objects.

    * Radial creates a circular gradient, with the mouse click as the center, and
    the release as the edge.

    * Square creates a square gradient, with the mouse click as the center, and the
    release as the edge.

    * Conical creates a gradient that is similar to looking at a 3D cone from above.
    Symmetric continues completely around the cone, and Asymmetric creates a distinct
    border between the foreground and background.

    * Shapeburst is used to create a gradient inside a selection. It gives the selection
    a 3D feel. Angular emphasizes the foreground color, Spherical creates a rounder
    gradient, and Dimpled creates a sharper gradient.

    * Spiral (Clockwise/Anticlockwise) creates a spiral pattern using the foreground
    and background colors.


    Repeat (4) Repeat determines whether the gradient should repeat. Sawtooth repeats
    the pattern, without blending the two. Triangular repeats, blending continuously
    between the foreground and background. Sawtooth and Triangular do not work with
    the Shapeburst gradient. Repeat is ineffective with the Conical gradient.


    Adaptive Super-sampling (5) This option uses more intermediate colors for the
    gradient. It creates a smoother blend, but takes longer to render. Increasing
    the maximum depth and threshold improves the quality of the blend, but also increases
    rendering time.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_169_0.png)


    Figure 10.7 The Options menu for the Blend tool.'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# Drawing Tools: The Blend Tool


    # Usage


    The Blend creates gradients on layers or selected areas. There are no brush options—everything
    is controlled in the Blend tool''s Options window (refer to Figure 10.7). Blend
    will be most useful when creating logos, cartoons, or other computer-generated
    images.


    As an example, let''s create a simple text logo with a gradient in it.


    +   1. Create a new RGB image, approximately 350x100.

    2. Select the Text tool (page 148).

    3. Click on the image to place the text. The Text tool window will come up. Choose
    a good, thick font like Bli and set the size to 72.

    4. Type a simple phrase, like “The Gimp” into the preview area, as shown in Figure
    10.8, and click OK.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_170_0.png)


    Figure 10.8 The Text entry window.


    +   5. The text will now be a floating selection, shown in Figure 10.9, and the
    current tool is automatically the Move tool. Use it to position the text precisely.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_170_1.png)


    Figure 10.9 The new text placed on the image.


    +   6. Open the Layers and Channels menu, shown in Figure 10.10 (<Image>/Layers/Layers
    and Channels). You will see the text in the floating selection (1). Click on the
    New Layer button (2) to create a new layer.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# Drawing Tools: The Blend Tool


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_171_0.png)


    Figure 10.10 The Layers and Channels menu.


    +   7. Make sure the Keep Transparent toggle (3) is turned on.


    +   8. Switch to the Blend tool (II).


    +   9. Set the foreground and background colors. The colors in the figures will
    just appear black and white here.


    +   10. Click and drag with the Blend tool to apply a simple blend to the text
    layer. This step can be repeated as many times as necessary.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_171_1.png)


    Figure 10.11 The finished image.


    > > See Also Gradient Editor (179), Color Selection (12), Modes (44)


    | Description | |

    |---||

    | Options | The text tool draws text on the active layer. |

    | Anti-Aliasing | Toggles anti-aliasing on and off. It makes fonts look smoother
    by using transparency to round edges. |

    | Border | Specifies how much border is placed around the text if a new layer
    is created. |

    | Use Dynamic Text | This toggle uses the Dynamic Text plug-in to place the text.
    |


    # 10.6 The Text Tool


    You will see three different tabs when you click on the area to place text (see
    Figure 10.12).'
  merge: -1
