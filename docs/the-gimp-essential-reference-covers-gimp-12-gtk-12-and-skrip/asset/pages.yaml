    for creating and loading images that should not initially be considered dirty,
    even though layers must be created, filled, and installed in the image.


    Table D.93 gimp_image_clean_all Variable

    | Variable Name | Type | Description |

    |---|---|---|

    | image | PDB_IMAGE | the image |


    # D.1.94 gimp_image_raise_layer


