  md: '# Function Reference for Scripts: gimp_layer_translate


    # D.1.17 gimp_layer_translate


    Description This procedure translates the layer specified in the x and y arguments.
    These can be negative, and are considered offsets from the current position. This
    command works only if the layer has been added to an image. All additional layers
    contained in the image which have the linked flag set to TRUE will also be translated
    by the specified offsets.


