- img_proc: true
  md: '# 154 Selection Tools: Rectangular Select


    Now that you have drawn on your image, it is useful to move these drawings around
    the canvas to get them to look just right. The selection tools provide many different
    ways of doing this. They allow you to work in very specific areas to draw and
    apply filters. After you have mastered these selection tools, you will be able
    to work very efficiently in the GIMP. The controls for these tools can be very
    complicated, and it is recommended that you read the "Advanced Selections" section
    (page 24) very carefully.


    | Description | |

    |---|---|n| Options | This tool makes rectangular selections on the active layer.
    |

    | Feather | This option makes the border of the selection fuzzy. It will make
    the part of the image near the edge of the selection gradually fade to transparency.
    |

    | Fixed Size/ Aspect Ratio | This toggle allows you to constrain the size of the
    selection to a certain size or ratio. The most useful units to use are pixels,
    which give an absolute value. Percentage is also useful; it creates a selection
    that is a certain percentage of the image size |

    | Union | Hold the Shift key, then click to add the selection to an existing one.
    |

    | Force Square | Hold the Shift key while drawing to force the selection into
    a square. |

    | Difference | Hold the Ctrl key, then click to subtract the selection from an
    existing one. |

    | Center Selection | Hold the Ctrl key while drawing to center the selection from
    where the mouse was clicked. |

    | Intersection | Hold the Ctrl and Shift keys, then click. This selects only where
    the original selection and the new selection overlap. |


    > ▷ See Also Advanced Selections (24)


    | Description | |

    |---|---|n| Options | This tool makes elliptical selections on the active layer.
    |

    | Anti-Aliasing | This makes curves look smoother by using transparency. |

    | Feather | This option makes the border of the selection fuzzy. It will make
    the part of the image near the edge of the selection gradually fade out to transparency.
    |'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Selection Tools: Freehand Select


    # Fixed Size/ Aspect Ratio


    This toggle allows you to constrain the size of the selection to a certain size
    or ratio. The most useful units to use are pixels, which give an absolute value.
    Percentage is also useful;n it creates a selection that is a certain percentage
    of the image size.


    Hold the Shift key, then click to add the selection to an existing one.


    # Union


    Hold the Shift key while dragging to force the selection into a circle.


    # Force Circle


    Hold the Ctrl key, then click to subtract the selection from an existing one.


    # Difference


    Hold the Ctrl key while dragging to center the selection from where the mouse
    was clicked.


    # Center Selection


    Hold the Ctrl and Shift keys, then click. This selects only where the original
    selection and the new section overlap.


    # Intersection


    > See Also Advanced Selections (24)


    # 11.3 Freehand Select [F]


    # Description


    The Freehand Select tool allows you to create freely drawn selections. It is very
    useful for touching up selections for photo editing.


    # Options


    This makes curves look smoother by using transparency.


    # Anti-Aliasing


    This option makes the border of the selection fuzzy. It will make the part of
    the image near the edge of the selection gradually fade to full transparency.


    # Feather


    Hold the Shift key, then click to add the selection to an existing one.


    # Union


    Hold the Ctrl key, then click to subtract the selection from an existing one.


    # Difference


    Hold the Ctrl and Shift keys, then click. This selects only where the original
    selection and the new section overlap.


    # Intersection'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# 11.4 Fuzzy Select [Z]


    The Fuzzy Select tool allows you to take selections based on color. It will select
    anything near the mouse click and spread until the color becomes too different.
    Dragging the cursor as you click changes the selection threshold. Dragging to
    the left will decrease the threshold; dragging to the right will increase the
    threshold.


    Description


    Options


    This option determines the threshold from the image formed by all the layers,
    not just the active one. It creates the selection only on the active layer.


    Sample Merged


    Anti-Aliasing


    This option makes curves smoother by using transparency.


    Feather


    This option makes the border of the selection fuzzy. It will make the part of
    the image near the edge of the selection gradually fade out to transparency.


    Threshold


    This slider controls the base threshold used when clicking, but can be increased
    or decreased by clicking and dragging the mouse to the right or left.


    Union


    Hold the Shift key, then click to add the selection to an existing one.


    Difference


    Hold the Ctrl key, then click to subtract the selection from an existing one.


    Intersection


    Hold the Ctrl and Shift keys, then click. This selects only where the original
    selection and the new section overlap.


    # 11.5 Bezier Select [B]


    Description


    This tool is excellent for cutting out complicated shapes from photographs. It
    is a complicated tool, so its Options menu is shown in Figure 11.1.


    Options


    Anti-Aliasing


    This makes curves smoother by using transparency.


    Feather


    This option makes the border of the selection fuzzy. It will make the part of
    the image near the edge of the selection gradually fade out to transparency.


    Union


    Hold the Shift key, then click to add the selection to an existing one.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Selection Tools: Intelligent Scissors


    157


    # Move Handle


    Hold the Shift key and click while in Editor mode to move a single handle on an
    anchor point.


    # Difference


    Hold the Ctrl key, then click to subtract the selection from an existing one.


    # Move Anchor


    Hold the Ctrl key and click while in Editor mode to move the anchor point.


    # Intersection


    Hold the Ctrl and Shift keys, then click. This selects only where where the original
    selection and the new section overlap.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_180_0.png)


    Figure 11.1 Options menu for the Bezier Select tool.


    # Usage


    The Bezier Select tool is the most complicated and powerful selection tool. To
    make a selection, outline the object needed by clicking the mouse button wherever
    there is a curve or sharp corner. This will create a series of anchor points around
    the object. When the object is completely encircled, click on the original anchor
    point. This will bring you into editing mode. To create curves, click and drag
    an anchor point. This will turn the anchor point into a curve. Hold down the Shift
    key while clicking and dragging to moving a single handle. To move an anchor point,
    hold down the Ctrl key while clicking and dragging. After you have a satisfactory
    curve, click inside the selection. If you are doing a union, difference, or intersection,
    hold down the appropriate key while clicking. This will give you the selection.
    Once the selection is made, the Bezier curve is converted to a "path".


    > See Also Intelligent Scissors (157)


    # 11.6 Intelligent Scissors


    []


    # Description


    The Intelligent Scissors tool is an excellent tool for quickly making selections
    from complicated images. It has some fairly complicated options, so the menu is
    shown in Figure 11.2. Note that this tool does not always work properly, so it
    may be removed from future versions until it is fixed.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# Options


    **AntiAliasing** (1) This makes curves smoother by using transparency.


    **Feather** (2) This option makes the border of the selection fuzzy. It will make
    the part of the image near the edge of the selection gradually fade out to transparency.


    **Curve Resolution** (3) This determines how detailed the curves in the Intelligent
    Scissors are. A lower resolution value makes the curves more jagged.


    **Edge Detect Threshold** (4) This option determines how sensitive the tool is
    to a change in color. This can range from 1 to 255. A threshold of 15 is generally
    a good value to use.


    **Elasticity** (5) Elasticity determines how much the tool will bend away from
    the curve to snap to the image. This can range 0 to 1.0. Higher values in this
    setting do not always produce correct results.


    **Convert to Bezier Curve** (6) A very useful option, Convert to Bezier Curve
    changes the curve by scissors into Bezier curve for further tweaking.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_181_0.png)


    Figure 11.2 The Options menu for the Intelligent Scissors.


    > >See Also Bezier Selection (156)


    +   - **11.7 Move** [M]


    **Description** With the Move tool, you can move a selection or layer by clicking
    and dragging it.


    **Cursor Keys** This option moves the selection in very small increments. Hold
    down Shift while using the cursor keys to move the selection with slightly larger
    increments.


    **Move Layer** Hold the Shift key, and click and drag to move the entire active
    layer.


    **Move Border** Hold the Alt key, and click and drag to move the selection border,
    but not the selection contents.'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Usage


    Care must be taken when moving layers with transparency. To move a layer with
    transparency, you must click on a part of the image that has paint on it; otherwise,
    the Move tool will move the layer below it. This can lead to confusion when dealing
    with many layers. If, however, you are using the Shift key to drag the layer,
    it will always move the active layer.


    # 11.8 Crop


    +   Description


    The Crop tool resizes an image.


    +   Options


    +   Current Layer Only


    This toggles between cropping the current layer or the entire image.


    +   Allow Enlarging


    This option allows you to toggle the ability to enlarge the image. This is not
    always useful, so it is best left turned off.


    +   Crop/Resize


    This allows you to select which type of cropping occurs. If you choose crop, the
    information outside of the border is thrown away. When resize is used, the information
    is not lost, and can be resized again.


    # Usage


    After choosing the crop area, a dialog box will appear. Click the Crop button
    to crop the image to the chosen area. Clicking inside the chosen area will shrink
    the crop area to an area you have selected. Clicking on the selection button will
    crop the area to an area you have selected.


    To resize the area, click and drag the upper-left or lower-right corner of the
    crop. To move the area, click and drag the lower-left or upper-right corner. Precision
    adjustments can be made with the cursor keys. In the dialog box, the coordinates
    can also be entered with the keyboard.'
  merge: -1
  pgno: 182
- img_proc: true
