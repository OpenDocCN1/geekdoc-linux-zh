- img_proc: true
  md: "# 14.14.4 Flame\n\nThe Flame filter creates random shapes based on a colormap\
    \ and mathematical functions. This colormap can be a gradient from the Gradient\
    \ Editor, one of several included colormaps, or based on the colors in an image.\
    \ The Smooth palette works well for creating colormaps. The options for this filter\
    \ can be somewhat complicated—the following options are available (see Figure\
    \ 14.89):\n\n+   * Rendering. This section controls the look of the image, regardless\
    \ of the shape.\n  * a. Brightness. This controls the brightness of the shape.\n\
    \  * b. Contrast. This adjusts the contrast in the image. This may not be apparent\
    \ in the preview, but it is noticeable in the final output.\n  * c. Gamma. This\
    \ slider bar controls the gamma correction for the image. It determines how the\
    \ gradient is actually mapped to the flame. It is best to keep the default value\
    \ of 2.00.\n  * d. Sample Density. This is the most important option in the Rendering\
    \ menu. It controls the level of detail in the final image. The preview windows\
    \ always display the low-quality versions of the image; changing the quality will\
    \ not affect the previews.\n  * e. Spatial Oversample. This changes the detail\
    \ level.\n  * f. Spatial Filter Radius. This option also controls the detail level.\
    \ The default values are recommended for this filter. Raising these values will\
    \ increase detail level and quality, but they increase the rendering time as well.\n\
    * g. Colormap. This changes the colormap that is to used in the image. There are\
    \ several choices for colormaps:\n  * Custom gradient. This is selected in the\
    \ Gradient Editor (see page 179).\n  * Included colormaps.\n  * Existing image.\
    \ The Smooth Palette filter (see page 203) is perfectly suited for this.\n\n+\
    \   * Camera. This section defines the look of the shape to be rendered.\n\n+\
    \   * a. Zoom.\n  * b. X and Y offsets.\n\n+   * Shape Edit. (See Figure 14.90.)\
    \ This option allows you to control the look of the flame. It is accessed by clicking\
    \ on the Shape Edit button. There are nine preview windows showing images. The\
    \ center image is the currently selected one. They can be randomized by clicking\
    \ on the center image, or by clicking on the Randomize button. You can replace\
    \ the center image with any of the eight surrounding images by clicking. The Speed\
    \ slider bar"
  merge: -1
  pgno: 264
- img_proc: true
  md: 'along the bottom varies the speed of rendering the images. Higher values give
    more detail in the shapes. The variation of the shapes can be controlled as well:


    +   - **Same.** Uses the default shapes.


    +   - **Randomize.** Uses random shapes.


    +   - **Linear.** Gives you shapes with bunches of straight lines.


    +   - **Sinusoidal.** Uses the trigonometric function to generate shapes.


    +   - **Spherical.** Gives very round shapes.


    +   - **Swirl.** Generates swirling shapes as well, but they often bend back on
    themselves.


    +   - **Polar.** Uses polar coordinates to generate shapes. They are very irregular
    shapes.


    +   - **Bent.** Similar to Linear, but the lines will often have “kinks” in them,
    or seem to slowly curve.


    **Load.** This button loads previously created shapes.


    **Store.** This option allows you to store these shapes for later use.


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_265_0.png)


    Figure 14.89 The Options window for the Flame filter.


    Figure 14.90 The Edit Flame window for the Flame filter.'
