- img_proc: true
  md: 'The GIMP comes with an extremely powerful scripting system called Script-Fu.
    Script-Fu is based on SIOD—Scheme In One Defun. By way of comparison, it is worth
    noting that this is more advanced than anything Adobe Photoshop has. (The only
    thing that is similar to Script-Fu in Photoshop is macro recording.) Learning
    to use Script-Fu is a good idea because it will save you a lot of time doing menial,
    repetitive tasks. For a Web designer, Script-Fu can be very useful because it
    allows you to create a theme to design all of your icons and headers quickly.


    # 6.1 Introduction to Scheme


    Scheme is a programming language based on Lisp, an advanced scripting language.
    As a GIMP user, you don''t really need to know the background to this, but if
    you have any experience with Lisp you will be familiar with the syntax. Additionally,
    if you are the proud owner of a Hewlett Packard 48-series calculator, or any other
    that uses Reverse Polish Notation, the syntax should also be familiar to you.


    # 6.1.1 Basic Scheme Operations


    Some basic operations with Scheme are described here. A full listing of the operations
    in Scheme can be found at http://people.delphi.com/gjc/siod.html.


    The first thing to learn about Scheme is that it is a language based on parentheses.
    The basic syntax to Scheme functions is as follows:


    ```

    (function parameters)

    ```


    In each set of parentheses, the first item is the function. The rest of the items
    are the parameters passed to the function. Comments are created with semicolons.
    They are similar to C++ style comments—preceded by two forward slashes.


    For example, consider the following:

    ; Declare Width and Height variables and assign a dummy value


    ```

    (imgWidth 1)

    (imgHeight 1)

    ```


    The GIMP includes an interactive Scheme interpreter that allows you to enter Scheme
    commands (see Figure 6.1). The results of any commands you run shown here (1).
    The commands are entered in the Current Command section (2). To view the DB Browser,
    click the Browse button (3).


    > The home page for SIOD is located at http://people.delphi.com/gjc/siod.html.'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# Writing Your Own Script-Fu: Basic Scheme Operations


    ![](img/f2e1dc39d482e76a84057f638c7a2d3f_108_0.png)


    Figure 6.1 SIOD Output window.


    It is a good idea to keep this window open as you experiment with the various
    functions described in Table 6.1. The following simple example of a mathematical
    function would return 13:


    (+ 5 8)


    Other operations are just as easy to use. Table 6.1 outlines some other common
    mathematical functions.


    | Function | Description |

    | --- | --- |

    | (+ x1 x2 ...) | Returns the sum of its arguments. |

    | (- x1 x2 ...) | With one argument, it returns the negation. With multiple arguments,
    it returns the difference of the first argument and the rest of the rest. |

    | (/ x1 x2 ...) | With one argument, this returns the inverse; otherwise, it returns
    the quotient of the first argument and the product of the rest. |

    | (< x y) | Returns true if x is less than y. |

    | (<= x y) | Returns true if x is less than equal to y. |

    | (= x y) | Returns true if x is equal to y. |

    | (> x y) | Returns true if x is greater than y. |

    | (>= x y) | Returns true if x is greater than equal to y. |


    Expanding on our simple example, more than two parameters can be passed to functions.
    The following example would return 17:


    (+ 4 6 7)'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'Writing Your Own Script-Fu: Basic Scheme Operations


    Functions can also be nested. This is where Scheme can get somewhat confusing.

    Consider the equation (3×5)+12=?. You would type the following, which would

    return 27:


    ```

    (+ 12 ( 3 5 ))

    ```


    Because there can be so many nested brackets, for try using a text editor that
    utilizes syntax highlighting.


    # 6.1.2 Variables


    After you know the basics of Scheme, you will want to move on to declaring variables.
    This is used when passing parameters to your script from a dialog box, or another
    script. The most common method of declaring local variables is through the let
    or let* statement. It uses the following form:


    ```

    (let (variable1 variable2 ...) expression1 expression2 ...)

    ```


    Any number of variables and expressions can be created within a let statement.
    Here''s an example:


    ```

    (let ((a 2) (b 4) (c 6)) (+ a c))

    ```


    This statement initializes three variables (a, b, and c) and returns their sum,
    which is 12. If you now try the following statement, however, an error is returned:


    ```

    (+ b)

    ```


    This is because there were only local variables inside the parentheses. To create
    variables that work outside their statement, use the set statement. Its syntax
    is as follows:


    ```

    (set variable value)

    ```


    For example, executing these two statements would return 14:


    ```

    (set Xpos 10)

    (+ Xpos 4)

    ```


    # 6.1.3 Lists


    Lists are slightly more complicated and powerful than variables. They allow you
    to define a group of variables that can be processed by Scheme. These are very
    important for defining colors, since they are defined as a list with Red, Green,
    and Blue values. It is very easy to declare a list. The syntax is as follows:


    ```

    ''(variable1 variable2 ...)

    ```


    For example, to declare the variable lightGray would look like this and would
    return (200 200 200):


    ```

    (let (lightGray (200 200 200)) lightGray)

    ```


    Lists can contain strings, other lists, and variables. Strings are defined using
    quotation marks. For example, a list could be defined as:


    ```

    ''(''The GIMP" "Essential" "Reference'' (1 2 4))

    ```'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# Writing Your Own Script-Fu: List Processing Functions


    # 6.1.3.1 List Creation Functions


    List processing is very powerful. There are several functions for dealing with
    lists.

    The first function to learn is cons. It concatenates variables into a list. The
    syntax

    is as follows:


    ```

    (cons variable1 variable2)

    ```


    The problem is that only two variables can be passed to the cons function at a

    time. If you want to create a new list with four parameters, you must nest the

    function like this:


    ```

    (cons 1 (cons 2 (cons 3 (cons 4))))

    ```


    cons does work with existing lists, however. You can take an existing list

    with two parameters and append a new parameter to it. For example, the following

    function would return (1 2 3):


    ```

    (let (smalllist) (cons 1 (''2 3))) smalllist)

    ```


    append is another function for dealing with lists. It appends one or more lists

    to another. Its syntax is as follows:


    ```

    (append list1 list2 ...)

    ```


    # 6.1.4 List Processing Functions


    Now that you have created a list, you should take a look at several functions
    for

    dealing with getting parameters out of lists. The first function to use is car.
    This

    returns the first parameter, or head, of the list. It does not affect the list
    at all.

    For example, if you have a list called textField that is set to (''The GIMP

    "Script-Fu" "Scheme\''), the following function would return The GIMP:


    ```

    (car textField)

    ```


    Another function is cdr. It returns the tail of the list. The following example

    would return ("Script-Fu" "Scheme"):


    ```

    (cdr textField)

    ```


    Note that car returns a single parameter, whereas cdr returns a list. If there
    is

    only one parameter in a list, cdr will return ()—an empty list.


    # 6.1.4.1 Advanced List Processing


    Now that you know the basics of car and cdr, it gets more complicated.

    Different combinations of car and cdr can be used to return specific parts

    lists. For example, (cdddr x) is equivalent to (cdr (cdr (cdr x))).


    Any combination of a''s and d''s can be used, to a maximum of three letters. These

    functions can be nested as well. Here''s an extreme example: (cdddr x)

    is equivalent to (car (cdr (cdr (cdr (cdr x))))).'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# 6.1.5 Functions


    The next step in learning Scheme is to define functions. This is the most flexible
    part of working with Scheme. The syntax for defining functions is simple:


    ```

    (define function variable! variable2...) (operations)

    ```


    For example, the following would create a function that calculates the area of
    a circle with a certain radius:


    ```

    (define circleArea radius) (* pi radius radius))

    ```


    It could be called later with a radius value of 2:


    ```

    (circleArea 2)

    ```


    The circleArea function would return 12.5664.


    Like lists, functions can be nested inside one another.


    # 6.2 Scheme Function Reference


    The following table is a list of the Scheme functions available to the GIMP.


    | Function | Description |

    | --- | --- |

    | abs x | Returns the absolute value of x. |

    | acos x | Returns the inverse cosine of x. |

    | append 11 12 13 14 ...) | Returns a list that is the result of appending all
    its arguments. Example: (append ''(a b) ''(c d)) => (a b c d) |

    | asin x | Returns the inverse sine of x. |

    | atan x | Returns the inverse tangent of x. |

    | atan2 x y | Returns the inverse tangent of x/y. |

    | bustlast x | Returns a new list that has all the elements of the argument x
    except for the last element. |

    | cons x y | Allocates a list object with x as the car and y as the cdr. Example:
    (cons 1 (cons 2 (cons 3)))) becomes (1 2 3). |

    | cos x | Returns the cosine where x is in units of radians. |

    | eq? x y | Returns true if x and y are the same object. |

    | equal? x y | Returns true if x and y are equal objects. |

    | eqv? x y | Returns true if x and y are the same object or numerically equal.
    |

    | exp x | Computes the exponential function of x. |

    | list item1 item2 ...) | Uses the cons function to merge arguments into a list.
    |

    | log x | Computes the natural logarithm of x. |'
