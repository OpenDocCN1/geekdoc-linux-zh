    +   Optional updates may include non-essential hardware drivers, language files,
    and more.


    It''s worth taking some time to consider what you''ll choose to install during
    update. You don''t have to install everything at once. You can update just a few
    services, check the result on your system, and update again. You''ve already done
    the hard work of downloading the updates to your local SUSE Linux Enterprise Server.
    They''ll still be there when you''ve done.


    +   7. After you''ve selected the systems that you want to update, click Accept.


    +   8. If there are patches which affect the functionality of currently running
    services, you''re warned to stop that service.'
  merge: -1
  img_proc: true
