- pgno: 169
  md: 'repositories. Therefore, if you want to download apt-mirror, you''ll need to
    download-it from its Source Forge home page or use the associated apt repository.

    To install apt-mirror using the apt interface, you''ll need to take the following
    steps:


    +   1. Add the apt-mirror repository to your /etc/apt/sources.list file. To do
    so, add the following line:


    ```

    deb http://apt-mirror.sourceforge.net/ apt-mirror/

    ```


    +   2. Update your database:


    ```

    apt-get update

    ```


    +   3. Install apt-mirror:


    ```

    apt-get install apt-mirror

    ```


    Now you can configure how apt-mirror works. The configuration file, mirror.list,
    by default, is installed in the /etc/apt/ directory. Let''s examine what you should
    do with this configuration file.


    By default, the base directory is /var/spool/apt-mirror. The mirror files are
    downloaded to the mirror subdirectory. Indexes are downloaded to the skel subdirectory.
    Logs, MD5 checksums, and URLs are stored in the var directory. If you want to
    change these defaults, activate and modify the commands appropriately in mirror.list:


    ```

    # set base_path /var/spool/apt-mirror

    # set mirror_path $base_path/mirror

    # set skel_path $base_path/skel

    # set var_path $base_path/var

    ```


    The default version of this file points to Woody and Sid mirrors in Finland. Unless
    you''re located in that country, and have Debian Sid workstations on your network,
    you should change at least some of the defaults. Remember, the current standard
    is Debian Sarge.


    > Note

    The apt-mirror package requires the use of the HTTP protocol. While Debian mirrors
    are configured for FTP, many work using identical URLs with HTTP. For example,
    the Debian mirror list points to http://debian.oregonstate.edu/debian. Type the
    URL in your browser to make sure it works on the mirror of your choice.'
