- pgno: 50
  md: '# 1.2 Distribution-Specific Repositories


    You may also have to confirm installation of other patches for packages, such
    as databases.


    +   7. When the process is complete, you''ll see a message listing the number
    of patches which have been installed. Click Finish to continue.


    +   8. To complete the process, YaST Online Update updates the system configuration
    and runs the scripts in the /sbin/conf.d directory to integrate patches into your
    system.


    When complete, you can find a repository of download patches in the following
    directory:


    ```

    /var/lib/YaST2/you/mnt/i386/update/9.3

    ```


    The directory with your patches will vary slightly, depending on your CPU and
    version of SUSE Linux. This repository includes four different categories of patches,
    as associated with their subdirectories:


    +   1. Deltas include relatively small changes in the RPM package for installed
    systems.


    +   2. Patches include text descriptions of the changes associated with each patch.


    +   3. RPMs include new RPM packages; they''re generally installed as an upgrade
    to your current system.


    +   4. Scripts include small text programs that generally apply new drivers to
    your system.


    If you''re running SUSE Linux Enterprise Server 9, downloads are divided into
    SUSE-SLES and SUSE-CORE packages. The SLES packages are associated with the first
    installation CD; the CORE packages include downloaded updates associated with
    the remaining CDs. In other words, you can find updates in the following directories:


    ```

    /var/lib/YaST2/you/mnt/i386/update/SUSE-SLES/9

    /var/lib/YaST2/you/mnt/i386/update/SUSE-CORE/9

    ```


    Downloaded RPMs, patches and scripts can be found in the same directories.


