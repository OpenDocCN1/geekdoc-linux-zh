- pgno: 208
  md: 'Before running the Red Hat Update Agent, you should make sure that the key
    components are themselves up to date. You can do so with two simple commands:


    ```

    up2date up2date

    u2date yum

    ```


    Updates don''t happen often to either of these two packages. However, if you configure
    a script to automate updates, you should make these commands part of that script.


    When properly configured, you can proceed in two ways. If you want to update all
    but kernel packages from the command line interface, run the following command,
    which downloads and installs all available updates by default.


    ```

    up2date -u

    ```


    Gosh, isn''t that simple? But be warned, the first time you run this command with
    Fedora Linux, it could take some time. In my case, this command downloaded around
    2,000 headers to /var/spool/up2date; the process took nearly a full hour.


    But you may not want to update all packages. For example, as of this writing,
    updates to the Firefox Web browser can break any plugins that you''ve installed.
    In that case, you may want to keep Firefox off the update list. You can find the
    list of available updates with the following command:


    ```

    up2date -l

    ```


    If the list is long, you may want to pipe the output. For example, if you want
    to see if there''s an upgrade to Firefox in the update list, you could run the
    following command:


    ```

    up2date -l | grep firefox

    ```


    If Firefox is on the list, you can make the Update Agent exclude it. Sure, if
    you configure it with up2date --configure, but this is only a temporary measure.
    I''m assuming that you eventually want the security updates associated with new
    versions of the Firefox browser.


    With Fedora Linux, the Update Agent is configured to use yum by default. This
    means you can take advantage of the switches and options associated with the yum
    command. You can use yum switches, such as --exclude. In this case, you can exclude
    Firefox from the update list with the following command:'
  merge: -1
  img_proc: true
