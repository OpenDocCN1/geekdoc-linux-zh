    Administration and Tools. You may also note that the group name is sensitive.


    Naturally, you can install individual packages from this group, with the following
    command, as defined in Figure 6-8. As with the apt commands discussed in Chapter
    5, if you install a group, you''ll install just the default and mandatory packages
    associated with that group.


    ```

    yum groupinstall "Administration Tools"

    ```'
