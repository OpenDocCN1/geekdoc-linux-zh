    # 6.6 SUMMARY


    In this chapter, you learned all about yum as a patch management tool. The original
    version of this tool was developed for the Yellow Dog Linux distribution, to manage
    patches on RPM-based distribution. It was enhanced into yum by developers at Duke
    University and eventually adapted by the Fedora and several RHEL rebuild distributions.


    In Chapter 5, you read about apt as a viable alternative for RPM-based distributions.
    One advantage of yum is that it is built using Python, which is a critical building
    block for RPM-based distributions.'
