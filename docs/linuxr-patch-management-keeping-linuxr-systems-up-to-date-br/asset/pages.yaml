- pgno: 196
  md: '# 5.4 The apt Commands in Detail


    apt-cache searches through the downloaded cache of available packages

    dependencies, conflicts, and basic package information. Try it with the package-

    age of your choice.


    # apt-cache depends /rdepends


    If you want more information on dependencies, the depends option is for you.

    When you run the apt-cache depends packageName command, the package does

    hot have to be installed. All you need is to specify the name of the package

    and apt-cache searches through the downloaded cache of available packages

    for dependencies. Try it with the package of your choice.


    The rdepends option is relatively straightforward—it provides a list of

    reverse dependencies, those packages that depend on the package which

    you have specified.


    # apt-cache pkgnames


    The apt-cache pkgnames command by itself is not useful. It scrolls a very long

    list of every package available from your repositories. But as a database, it
    can

    be powerful. For example, if you want a list of every package with gimp in its

    name, you run the following command:


    ```

    apt-cache pkgnames | grep gimp

    ```


    # 5.4.2 Analyzing apt-get in Detail


    It''s worth some trouble to examine what you can do with the apt-get command.
    with the apt-get -h | less command. This list is not complete; you learned about
    the mirror-select,

    showgroup, and groupinstall options earlier in this chapter, as well as update,

    install, remove, dselect-upgrade, clean, and autoclean options in Chapter 4.

    Several options that are rarely used are not covered in this book.


    Default apt-get options are available either in /etc/apt/apt.conf or the

    /etc/apt/apt.conf directory. Naturally, you can override any defaults in

    these files with the correct switches.


    # apt-get switches


    Before we discuss options, there are a number of switches available for

    apt-get, as shown in Table 5-3. You can use it with the options associated for

    -get, as described in this section and elsewhere in this book.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Table 5-3 apt-get switches


    | Switch | Description |

    | :--- | :--- |

    | -d | Performs downloads without installing any packages |

    | -f | Attempts to repair broken dependencies |

    | -m | Ignores and does not download any packages or those which download with
    [errors](https://www.debian.org/manpages/apt-get) |

    | -Q | Silences any messages during the download and installation process |

    | -s | Simulates the download and installation |

    | -y | Answers all prompts with a "yes" |

    | -u | Lists all upgraded packages |

    | -V | Displays full version numbers (current and future) for upgrades |

    | --no-upgrade | Does not perform upgrades |

    | --purge | Purges packages to be deleted, including applicable configuration
    files |

    | --reinstall | Reinstalls packages which are already at the latest version; replaces
    all but missing configuration files |

    | --no-remove | If packages are removed, the process aborts automatically |

    | --config-file | If you''ve set up an alternative to apt.conf, specify it with
    this switch |


    # apt-get upgrade


    I don''t generally recommend the use of the apt-get upgrade command, because it
    leads to upgrades to newer versions of most currently installed packages. However,
    this option does not remove any installed packages; upgrades require which removals
    are run.


    # apt-get dist-upgrade


    If you''re prepared to upgrade your system, the apt-get dist-upgrade command may
    be for you. It provides the "smart upgrade" option available through the Synaptic
    Package Manager. Detailed options involve the use of the apt-preferences command
    available only for Debian-type distributions. Because upgrades often involve hundreds
    of packages, some conflicts may be inevitable. With the smart upgrade features,
    upgrades of more important packages take priority.


    In some cases, the -f switch can help by repairing broken dependencies. Other
    switches described in Table 5-3 may also help.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# apt-get check


    If you''re having problems with dependencies, run the apt-get check command. It
    updates the current cache of packages and lists any unmet dependencies.


    # 5.4.3 Debian-only apt Commands


    There are several apt-related commands generally available for Debian-type distributions.
    While Conectiva has ported most of these commands to its RPM-based distribution,
    they are generally not available for other RPM-based distributions. They include
    several commands described in Chapter 4, including


    +   - apt-build downloads source and build packages associated with a specific
    download, optimized for a specific architecture.

    - apt-ftarchive generates index files for apt-based archives. The corresponding
    RPM-based command, as described earlier, is genbasidir, which is part of the apt-server
    RPM.

    - apt-howto includes the latest version of the APT HOWTO; it is also available
    from www.debian.org/doc/manuals/apt-howto.

    - apt-listbugs is normally not run by itself; when installed, it is automatically
    invoked by other apt commands to download build reports.


    # 5.4.4 RPM-only apt Commands


    There are three apt scripts available only for RPM-based distributions. As of
    this writing, they have not been ported to Debian-based distributions. Depending
    on the distribution, they may be available as part of the apt or the apt-server
    RPM packages. These scripts are as follows:


    +   - genbasidir was described earlier in this chapter; it allows you to create
    a database suitable for an apt repository.

    - genpkg is run via genbasidir to create package list archives.

    - gensclist is also run via genbasidir to create source package archives.


    # 5.5 SUMMARY


    In this chapter, you learned to extend your knowledge of apt to RPM-based distributions.
    It is an alternative to the “dependency hell” often associated with installing
    RPM packages. The work of the Brazilian developers of the for Conectiva Linux
    has made this possible. You can now use apt to keep distributions, such as SUSE,
    Fedora, and even some Red Hat Enterprise Linux rebuilds, up to date.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'The developers behind several distributions have configured their own apt repositories
    and have made them available online. Independent developers have configured additional
    apt repositories you can use and mirror locally on your network.


    If an apt repository is not available for your distribution, you can create your
    own. You can still create a mirror of a standard repository on your network. With
    the `genbasedir` command and a little work organizing packages into local directories,
    you can create the databases which can make your local mirror useful as an apt
    repository.


    In the next two chapters, we''ll explore the major alternative to apt, known as
    yum.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Configuring a yum Client


    Many experienced Linux users, historically, have not been satisfied with the patch
    management tools of the two RPM market leaders, Red Hat and SUSE. Their problems
    are, in part, related to their reliance on distribution-specific patch management
    tools. As we''ve seen in Chapters 1-3, SUSE''s Online Update and the Red Hat Update
    Agent are both excellent tools. Unfortunately, these tools are not easily used
    with other distributions, and they create bureaucratic filters on the contributions
    of the Linux community. In addition, they do not have the broad level of community
    support available for the apt or even the Smart Program Manager.


    This lack of satisfaction began to change with the first release of Fedora Linux
    in the fall of 2003. Red Hat moved toward a subscription support model for its
    Enterprise Linux distribution, Red Hat simultaneously moved toward the community
    with the Fedora Linux project. To enhance community support for Fedora, Red Hat
    incorporated the work of the Yellow Dog distribution on patch management. Their
    tool is known as yum, short for Yellowdog Updater, Modified. With the Fedora apt
    repositories described in Chapter 5, "Configuring apt for Distributions," along
    with the Red Hat Update Agent described in Chapter 2, "Consolidating Patches on
    a Red Hat/Fedora Network," now incorporates a variety of tools for patch management.


    The changes continued with the acquisition of SUSE by Novel in 2004. As we''ve
    seen in Chapter 3, "SUSE''s Updates and rsync Mirrors," SUSE has already incorporated
    its Online Update server in YaST. Novel has already incorporated Linux in its
    Jenkins system for patch management (formerly known as Red Carpet). As of this
    writing, it is too early to assess the response of the Linux community to the
    Jenkins Patch management tool.


    In other words, if you want to manage patches on RPM-based distributions with
    tools familiar to the Linux community, you can use either yum or apt. Some developers
    prefer yum because it is customized for RPM-based distributions, especially those
    released by Red Hat. Others prefer apt because of the associated levels of community
    support. The yum commands are also supported by Fedora, AspLinux of Russia, and
    Yellow Dog Linux.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'In this chapter, we will extend our discussion of yum for various Linux clients
    to show how you can help you manage patches on a variety of RPM-based distributions.
    But first, we explore the history and workings of yum as an RPM-based system.


    # 6.1 THE BASIC YUM PROCESS


    Structurally, yum is built for RPM-based distributions. As noted in the yum HOWTO,
    available online from www.phy.duke.edu/rgb/General/yum_HOWTO.php, yum uses the
    "same tools and python bindings" associated with Red Hat and other RPM distributions
    to install packages and automatically resolve dependencies.


    Both yum and apt rely on package headers. The header for each package includes
    forward and reverse dependency information. With this information in a complete
    database, yum (as well as apt) can help you install the packages of your choice
    along any packages to satisfy dependencies. As suggested by the acronym, yum is
    a modified version of the original update command developed for Yellow Dog Linux.


    Modifications are continuing as the Fedora Linux community focuses on yum to meet
    its updates needs. New packages and commands have been developed to keep yum systems
    and repositories up to date.


    # 6.1.1 Yellow Dog and yum


    The original version of yum is known as yup, the Yellowdog Updater. While Yellow
    Dog Linux was developed for various versions of the Apple Macintosh (www.yellowdoglinux.com),
    it is based on the same code that you can find in Linux for all architectures.
    Yellow Dog Linux also organizes its packages in RPMs.


    # 6.1.2 yup and yum


    The yum command has weaknesses. It''s slow because it downloads complete RPMs
    before it can read header information for dependencies. In its original form,
    it could not be configured to download packages from more than one repository.
    It is now essentially obsolete. Today, even Yellow Dog Linux uses yum for its
    own updates.


    Developers at Duke University wanted to create an open source update manager that
    worked well with Red Hat. Many at Duke were already familiar with this, as they''re
    practically neighbors with the Red Hat developers in the Raleigh-Durham area of
    North Carolina. According to the yum home page at linux.duke.edu/projects/yum/,
    they wanted a tool that did not require require custom servers for their networks.
    Out of this came the first tools and repositories associated with yum.'
  merge: -1
