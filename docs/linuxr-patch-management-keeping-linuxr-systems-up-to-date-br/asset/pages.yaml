  md: '# 1.2.4 Other hundreds of Linux Distributions


    There are hundreds of Linux distributions. Many have their own update repositories.
    I''ll mention a few of the more important Linux distributions here:


    +   - **Mandriva Linux.** As of this writing, this company is merging the former
    Mandrake and Conectiva distributions. Mandrake was developed from Red Hat Linux
    and uses RPMs; they have a wide variety of graphical tools. Conectiva is the developer
    of apt for RPMs; before their work, the apt tools were most closely associated
    with Debian-based distributions. For more information, see www.mandriva.com.

    - **Yellowdog Linux.** While this distribution was developed for PowerPC computers,
    their update tool, Yellowdog Updater, Modified (yum) is widely used on RPM-based
    distributions, including Red Hat''s Fedora Linux. For more information, see www.yellowdoglinux.com.

    - **Linsp.** Formerly known as Windows, this distribution is known for its user
    friendliness and support, which has made it one of the distributions of choice
    at Walmart. For more information, see www.linux.com.

    - **Knopix.** This Debian-based distribution has quickly gained fame as the “handyman”
    that can fix numerous problems with Linux (and even Microsoft Windows) computers.
    For more information, see www.knopix.org.


    It''s not fair I don''t really have the space to mention other Linux distributions.
    There are many other excellent distributions available, with repositories that
    you can use and even replicate upon your networks. Many of these distributions
    use the yum and apt tools that you can learn about in the last half of this book.


    # 1.3 Community-Based Sources


    Besides Debian Linux, there are a number of distributions and “rebuilds” backed
    by a community of developers and users. This list includes Fedora Linux, the community-based
    offering of Red Hat, along with other distributions, such as Slack Linux.


    The most common current examples of rebuilds are the groups that have taken the
    source code from Red Hat Enterprise Linux and built their own binary packages
    and even downloadable CDs/DVDs.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# 1.3 Community-Based Sources


    # Note


    When I refer to a "rebuild," I''m referring to a distribution that is built from
    the source code of another distribution. This is in contrast to a "clone" which
    is an operating system that emulates the functionality of another while using
    different source code. For example, while Linux is a clone of Unix, CentOS-4 is
    a rebuild of Red Hat Enterprise Linux4.


    # 1.3.1 Fedora Linux


    When Red Hat moved to a subscription model for its flagship RHEL distribution,
    it wanted to retain the support of the Linux community. For this reason, it started
    the Fedora project. Red Hat has stated that Fedora distributions will be released
    every 4 to 8 months, and it will be the testbed for future RHEL releases. As of
    this writing, the current version is Fedora Core 4, and we''ll be using that version
    in our examples.


    As a community project, Fedora Linux does not have access to the Red Hat Network,
    as a RHEL testbed, it uses the same basic Update Agent as described earlier in
    this chapter.


    Therefore, Fedora needs a community-based repository and update tool. The basic
    repositories are listed at fed.redhat.com/download/mirrors. The basic update tool
    is the tool associated with Yellowdog Linux, yum. Before you can start the update
    process, you''ll need to import the Fedora GPG key into your update system. As
    it''s already available in the /usr/share/rhn/dir directory, all you need to do
    is:


    ```

    rpm --import /usr/share/rhn/RPM-GPG-KEY-fedora

    ```


    If you''re using Fedora Linux, you should update the files in the /etc/yum.repos.d
    directory. The default version of this directory includes six:


    +   - fedora.repo includes the basic Fedora Core repository.

    - fedora-updates.repo contains the updates associated with Fedora Core.

    - fedora-updates-testing.repo has updates that may not be ready for production
    for Fedora Core.

    - fedora-extras.repo contains additional packages which are tested for Fedora
    Core, but not part of the official distribution.

    - fedora-extras-devel.repo has packages that may not be ready for production for
    the Extras repository of Fedora Core. These updates are incorporated in the Extras
    repository when they''re ready for production.

    - fedora-devel.repo includes the repository with the regular rebuilds of packages;
    formerly known as Rawhide.


    These files include two variables, $release and $basearch. They refer to the release
    version of Fedora Core and the CPU version, respectively.'
  merge: -1
  img_proc: true
