- pgno: 240
  md: '# Setting Up a yum Repository


    As discussed in Chapter 6, "Configuring a yum Client," yum is built on the Python
    programming language, which is a building block for the Red Hat/Fedora distributions.
    While current support is limited to the Red Hat/Fedora/Yellow Dog/Mandriva/Asp
    distributions, per the latest available Netcraft survey (\`http://news.netcraft.com/archives/2005/03/index.html`),
    that''s over half the Linux market. If you want to dearnarn patch management for
    Linux, you need to know how to use yum and configure, or "yummify," associated
    repositories.


    The simplest way to configure a yum repository that already exists. Most Fedora
    repositories already support yum. But you do not have to mirror the entire repository,
    because much of it is built from installation CDs. In addition, as packages change,
    or if you combine packages from different mirrors, you may create yum headers
    on your own system rather than download them into them from a remote repository.


    We''ve divided this chapter into several major sections. You can take most of
    the packages for a repository from the installation CDs. You''ll need to manage
    headers for those repositories. You''ll need to configure sharing of that repository
    with other computers on your network. You''ll need to download other repositories
    associated with updates, developmental packages, and those created by third parties.
    Finally, you''ll need to keep these repositories up to date.


    When configured, you''ll be able to update your computers from local repositories,
    minimizing the loads on your Internet connections, giving you more control over
    what is installed on your systems. You can focus on making sure that critical
    packages, including those related to security, are up to date. That is the essence
    of good patch management.


    At the end of this chapter, we''ll show you how you can create a yum repository
    for Red Hat Enterprise Linux (RHEL) 4 clients with an authorized subscription
    to the Red Hat Network. If you have valid subscriptions, this is a viable alternative
    to the Red Hat Network Proxy Server described in Chapter 2, "Consolidating Patches
    on Red Hat/Fedora Network."'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# 7.1 GETTING THE PACKAGES


    You already have many of the packages that you''ll want in a yum repository: the
    same RPMs that are already included with the installation CDs/DVDs for your distribution.
    With those RPMs, you can use yum to populate the base repository and add the headers
    needed for easy access from the other computers over your network.


    In this part of the chapter, we''ll show you how to start your repository, install
    yum, create an appropriate yum directory tree, add headers to the appropriate
    directory, and test the base repository on your local system. We''ll start with
    the Fedora Core 4 Updates repository. You can use the same techniques to create
    other repositories on your system.


    While you could use the rsync command described in earlier chapters each version
    of Fedora requires over 100GB of space. You do not need to mirror the directory
    with the 6GB+ of ISO files. As described earlier in this book, there are ways
    to cut down with appropriate --exclude switches to the rsync command. But if the
    loads on your Internet connection are not a problem, you might not need a local
    patch management repository in the first place.


    > Note SUSE supports two different patch management tools described in Chapter
    3, "SUSE Update Updates and rsync Mirrors": YaST Online Update and Zenworks Linux
    Management. As noted in Chapters 5 and 6, they now support apt, and plan to support
    your yum in the future.


    # 7.1.1 Strategy


    Before you create your repository, decide what you want to store locally. Viable
    options vary. If you have only two or three workstations, a local repository might
    not be so important. However, it can become profitable to configure a local repository
    if you have a substantial number of workstations. What you configure largely depends
    on your patch management strategy. Consider the following:


    +   To keep a substantial number of computers up to date, it can help to configure
    a local repository for updates. Alternatively, if your Internet bandwidth is unlimited,
    and the people behind your remote mirror do not object to the load, you may prefer
    to use remote mirrors, as they may be more to date.


    +   If you frequently change the base software on your systems, you should load
    the installation RPMs on your repository.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# 7.1 Getting the Packages


    If you need packages outside the standards available on the installation, look
    for other directories of RPMs on your favorite mirror. Fedora includes the Extras
    repository with many useful packages.


    If you need packages simply unavailable from mirrors associated with your distribution,
    there are also third-party repositories described throughout this book.


    If your users test updates before they''re moved to the stable update repository,
    consider mirroring such repositories. You may even have reason to mirror a development
    repository. However, be warned that these packages are generally not stable or
    suitable for a production environment.


    # Note


    The Fedora development repositories, formerly known as “Rawhide,” are collections
    of RPMs that may change on a day-to-day basis. They are, by definition, stable.
    They are not suitable for production use. However, they may be of interest to
    developers and others looking for the latest available solutions.


    After you decide what you''re going to mirror, you can set up a yum directory
    for your local repository. In the following sections, we''ll focus on creating
    an Updates repository. If you have the installation CD available, you can use
    the same steps to create an Installation repository.


    In my case, I created a Fedora Core 4 repository on a system running RHEL 4, as
    it is a stable distribution. You''ll want to leave room for future releases it
    might even make sense to add a new drive for purpose so that the packages won''t
    overwhelm other files on your system. In any case, it''s an excellent idea to
    at least configure a partition for your repository.


    # 7.1.2 Creating a yum Directory Tree


    We are assuming you''re ready to create your own yum repository directory for
    your own network and that the tree does not be identical to the one on your favorite
    mirror. For example, assume that you''ve created the /var/ftp/pub/yum directory
    in a separate partition. Assume that for now, you need to provide for standard
    32-bit systems. If you wanted to create a yum directory tree for Fedora Core 4,
    you might end up with the following directories:


    ```

    /var/ftp/pub/yum/4/i386/os

    /var/ftp/pub/yum/4/i386/updates

    /var/ftp/pub/yum/i386/extras

    /var/ftp/pub/yum/4/i386/dag

    ```'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'The /var/ftp/pub directory is the default directory associated with the vsFTP
    server. It happens to be the default FTP server for Fedora and Red Hat distributions.
    With the right settings, you can link to this directory from an Apache web server.
    You can also share this directory on the local network using NFS. In fact, NFS
    is generally preferred over a network of Linux computers because shared NFS directories
    can be treated as if they were on the local computer.


    # Note


    To promote security, the vsFTP server does not allow symbolic links (also known
    as symlinks). Therefore, you can''t use the vsFTP server for packages downloaded
    directories, such as /var/spool/update2.


    As the noted directories are several levels below /var/ftp/pub, you might feel
    like you have to run the mkdir command a thousand times. There is one minor trick
    that can speed the process. The following command creates all needed subdirectories
    in one shot:


    ```

    mkdir -p /var/ftp/pub/yum/4/i386/0

    ```


    Note that the structure of these directories does not correspond to those you
    see in Fedora Core mirrors. The directory structure of different Fedora Core mirrors
    varies. Unless you''re creating a mirror for public use, there is no need to create
    a directory structure similar to any existing Fedora Core mirror.


    # 1.7.3 Start with a Distribution


    For the purpose of this chapter, I have downloaded the Fedora Core 4 installation
    DVD, to create repositories for Fedora Core 4 systems. As noted earlier, it''ll
    be on RHEL 4 computer so I can add repositories for future releases of Fedora
    Core. As RHEL 4 was developed in large part from Fedora Core 3, I''ll be using
    Fedora-based yum packages. Naturally, the following instructions will work for
    a repository configured on Fedora Core 3.


    # Note


    For Fedora Core 3, this section works in the same way. Just substitute appropriate
    file names. I could not test these settings on Fedora Core 5, as Red Hat was just
    starting its test (beta) releases for this distribution as was going to print.


    For example, if you download the Fedora Core DVD, you can mount the ISO file almost
    as if it were a DVD/CD with the following command:


    ```

    mount -o loop FC4-i386-DVD.iso /media/cdrecorder

    ```'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# 7.1 Getting the Packages


    Of course, you can “burn” the DVD .iso file (or associated CD .iso files) to appropriate
    media. It may be handy to have a DVD available. But, in my opinion, because you
    can mount the ISO directly, you don''t need a physical DVD.


    # Note


    If you can''t work with DVD-sized files, for example, if you''ve downloaded the
    four Fedora Core 4 binary CDs, all you need to do is mount the CDs one at a time,
    and copy their contents (including the .discinfo file from the first CD) to the
    directory of your choice. For example, you can run the following commands:


    ```

    mount -o loop FC4-i386-disc1.iso /media/cdrecorder

    cp -ar /media/cdrecorder/*

    /var/ftp/pub/yum/4/i386/

    ```


    If it''s the first CD, don''t forget to copy the .discinfo file to the noted directory.
    Change CDs:


    ```

    mount -o loop FC4-i386-disc2.iso /media/cdrecorder

    cp -ar /media/cdrecorder/*

    /var/ftp/pub/yum/4/i386/

    ```


    Repeat the process until you''ve reached the fourth CD.


    A quick look at other mirrors confirms that the contents of the Fedora Core DVD
    are part of the os repository directory. You can make part of your own local repository,
    by copying the contents of the DVD to the corresponding directory described earlier:


    ```

    cp -ar /media/cdrecorder/* /var/ftp/pub/yum/4/i386/os/

    ```


    # 7.1.4 Installing yum


    For Fedora Core 3 and above, you''ll need at least the yum and createrepo RPMs,
    along with the packages associated with the way you plan to share your repository
    on your network (FTP, Apache, or NFS server). Earlier versions of Fedora Core
    did not include a createrepo RPM; if you want to create a repository from Fedora
    Core 1 or 2, use the yum-arch command, which is part of the yum RPM and is functionally
    similar to createrepo.


    When the appropriate CD or DVD is mounted, you can then install the Fedora Core
    3 yum and createrepo RPMs with the following commands:


    ```

    rpm -Uvh /media/cdrecorder/Fedora/RPMS*

    rpm -Uvh /media/cdrecorder/Fedora/RPMS/createrepo*

    ```'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Note


    Because RHEL 4 is built on Fedora Core 3, it generally works when you use Fedora
    Core 3 RPMs on RHEL 4. However, Fedora Core 4 RPMs sometimes require more advanced
    dependent packages. If you install those dependencies, that might cause problems
    for other RHEL 4 applications.


    If you''re working with a RHEL 4 rebuild distribution, as CentOS-4, the appropriate
    yum packages may already be installed on your system. The actual directory with
    these packages may vary; for example, the CentOS-4 version of the createrepo RPM
    is part of the CentOS-4 addons/ repository directory.


    # Note


    If you are also using this for installations, copy the .iso files with the DVD
    or CDs to the /var/ftp/pub directory. The Red Hat installation program, Anaconda,
    can automatically mount and read appropriate .iso files. When shared, you can
    use this directory as a network installation source, which can help you complete
    the installation of additional PCs.


    If you''re working with RHEL 4, you can install the yum and createrepo RPMs from
    Fedora Core 3. If you don''t have the associated installation media, you can download
    the RPMs directly from your favorite mirror from among those listed at http://fedora.redhat.com/download/mirrors.html.


    # 7.1.5 Synchronizing Updates


    More than the installation RPMs are the updates. While you can use tools, such
    as system-config-packages, to install and remove packages from the installation
    files, you need access to the updates to manage patches on your system. Based
    on the directories described earlier, we''re planning to store RPMs from the Fedora
    Core 4 Updates repository on the following-directory:


    ```

    /var/ftp/pub/yum/i386/updates

    ```


    Based on the rsync commands described in Chapter 2, you should find an Updates
    repository in the rsync mirror of your choice. Fedora rsync mirrors are listed
    at http://fedora.redhat.com/download/mirrors.html. One rsync mirror I use is rsync://mirrors.kernel.org/fedora.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# 7.1 Getting the Packages


    You can list the directories and files on a remote rsync server. Just make sure
    to include the last forward slash in your command. For example, the following
    command lists the directories available in the Kernel.org Fedora Core repository:


    ```

    rsync rsync://mirrors.kernel.org/fedora/core/

    ```


    You''ll see updates/ in the directory tree. As you continue this process, you''ll
    find the actual updates/ RPMs in the updates/4/i386/ subdirectory. Search through
    the subdirectory. You''ll find debug/ and repodata/directories. While you may
    be able to use the data in the repodata/ subdirectory in your own yum repository,
    you won''t need to download the hundreds of megabytes of files in the debug/ subdirectory.
    To avoid downloading files from that directory, you''ll need to apply the --exclude
    switch. For example, the following rsync command synchronizes the packages from
    the remote updates/repository, without debug/ packages:


    # Note


    > Through Fedora Core 3, the noted repository included a headers/ subdirectory,
    as created with the yum-arch command.


    ```

    rsync -av --exclude debug \

    rsync://mirrors.kernel.org/fedora/core/updates/4/i386/* \\

    /var/ftp/pub/yum/4/i386/updates/

    ```


    As noted in Chapter 3, this synchronizes the noted remote and local directories
    in (-a) archive mode, with (-v) verbose output. Contents from the debug directory
    are (--exclude) excluded.


    # Note


    > Note the backslashes (\) at the end of the first two parts of the command line.
    It''s an escape character, which cancels out the carriage return; in other words,
    all three lines are run as a single command.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# 7.2 MANAGING HEADERS


    One key skill in maintaining a repository is header management. Headers, stripped
    from RPM packages, allow yum to determine dependent packages. Unless the packages
    you download are identical to those on your mirror, you will not be able to use
    the headers created on the mirror. You will have to learn to create your own headers.
    There are two major header creation commands, which we will review in this section
    and then use on a Fedora Core 4 repository.


    # 7.2.1 Header Creation Commands


    As noted earlier, there are two different commands associated with creating headers
    for a yum repository. Before Fedora Core 3, the key command was yumarch. It may
    still be the primary command for the distribution for which you''re managing patches.
    The alternative, starting with Fedora Core 3, is createrepo.


    # yum-arch


    The yum-arch command comes with the yum RPM and is the first method to strip headers
    from associated RPM packages and organize them in a subdirectories. When the headers
    are available, various yum commands described in Chapter 6 can use them to identify
    packages and package groups, along with any dependencies for the purposes of installation,
    upgrades, and removals.


    There are several different options associated with the yum-arch command. While
    none are absolutely necessary, they can help you in various special cases. For
    more information on the options associated with the yum-arch command, see Table
    7-1.


    # Table 7-1 The yum-arch command options


    | Option | Description |

    | --- | --- |

    | -d | Checks for dependencies and conflicts from listed RPM packages |

    | -n | Creates the database without headers; may be appropriate if you''ve already
    downloaded headers |

    | -s | Creates headers from source packages |

    | -c | Checks package integrity against available checksums |

    | -l | Follows any noted symlinks |

    | -z | Compresses headers |'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# 7.2 Managing Headers


    createrepo

    The createrepo command now creates metadata from the headers in XML format. If
    you''re familiar with the Red Hat comps.xml file (available from the first installation
    CD RedHat/base or Fedora/base subdirectory), you understand how these distributions
    use XML to organize packages and their associated package groups for installation.
    As Fedora (and perhaps other Linux distributions) evolves, they might move toward
    XML as a Linux standard to organize packages and their associated package groups.


    There are several different options associated with the createrepo command. While
    none are absolutely necessary, they can help you in various special cases. For
    more information on createrepo options, see Table 7-2.


    Table 7-2 The createrepo command options

    | Option | Description |

    |---|---|n| -g | Supports commands associated with Red Hat/Fedora groups from
    the comps.xml file |

    | -p | Supports output in XML format |

    | -s | Selects the type of checksum to use, such as md5 |

    | -c | Checks package integrity against available checksums |

    | -u | Creates headers from a list of files at a specified URL |

    | -x | Excludes specified files; wildcards are allowed


    If you want to see how the createrepo command works, you can analyze its code
    in /usr/bin/createrepo script. As with yum, this command is written in Python.


    # 7.2.2 Adding the Headers


    As suggested earlier, there are two commands you can use to create the headers
    needed for a yum repository: yum-arch and createrepo. If you use yum-arch in Fedora
    Core 3 or above, you''ll see the following message:


    ```

    THIS PROGRAM IS DEPRECATED!

    You should be generating xml metadata instead.

    Please see http://linux.duke.edu/metadata

    ```


    If you''re running RHEL 4 or the associated rebuild distributions, you should
    use the createrepo command, because these distributions are based on Fedora Core
    3. However, several other distributions still use yum-arch. If you don''t see
    the "deprecated" message, use the yum-arch command, which is a part of the yum
    RPM.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# yum-arch


    The yum-arch command is fairly straightforward. All you have to navigate to the
    directory to the RPMs and you can create the headers in the local directory with
    the following command (don''t forget the dot, which specifies the files in the
    current directory):


    ```

    yum-arch .

    ```


    As you see in Figure 7-1, headers are generated and “digested.” You’ll find the
    headers in the local headers/subdirectory.


    ![](img/e178bfcea0b6629d1234b59342d4d686_249_0.png)


    Figure 7-1 The yum-arch command digests RPMs and exhales headers


    If you’re successful, the numbers associated with Total and Used in the output
    should match. In other words, Figure 7-1 tells me that there are 639 RPMs in this
    repository, and all were used to create headers.


    If there are problems, there may be older RPMs in the repository. Updates to an
    update repository where older RPMs conflict with others could be the cause. If
    you use the rsync command to synchronize your repository, you should take care
    to delete older RPMs. Alternatively, you can wipe the repository directories before
    downloading updates.


    This repository is now ready. You’ll still need to share the directory with an
    FTP, Apache, or an NFS server.


    # createrepo


    The yum-arch command was developed for RPMs, Red Hat’s move to organize packages
    in XML files is fairly recent. The createrepo command consolidates headers in
    XML files. It creates the headers that the yum command needs to specify dependencies.'
  merge: -1
  img_proc: true
