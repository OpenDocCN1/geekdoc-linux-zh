    # Creative Options


    You can create your own repository of available updates. If you enable the KeepInstall
    option, updates that you download are stored in /var/pool/up2date. You can then
    share these updates with other computers on your network. Assuming these configurations
    are identical, you can upgrade with these same packages. Some administrators have
    been known to configure downloaded packages in a yum repository, as demonstrated
    in Chapters 6, "Configuring a yum Client," and 7, "Setting up a yum Repository"


    Alternatively, you can point the Upgrade Agent to repositories created by one
    of the Red Hat Beliefs that you''ll learn in Chapter 2.


    # 1.2.2 Novell/SUSE


    The SUSE distributions, now owned by Novell, have a very different look and feel
    from the RHEL distributions. Administrative tools are integrated into the SUSE
    all-in-one tool, known as YaST (Yet another Setup Tool?). While YaST is not geared
    to the command line interface, it supports a low-level graphical screen from remote
    consoles, and it has a similar look and feel YaST in the GUI.


    In this section, you''ll examine detailed workings of the YaST Online Update tool
    and get a feel for what you can do with repositories on SUSE Linux Enterprise
    Server (SLES). Unlike Red Hat, SUSE does not have a dedicated interface for subscriptions
    similar to the Red Hat Network.


    # YaST Online Update


    In this section, you examine YaST Online Update on SUSE Linux Professional 9.3.
    Unlike RHEL, registration is not required at this operating system level. YaST
    Online Update, also known as YOU, provides a complete system for updating the
    RPM packages installed on your SUSE Linux Professional computers. It allows you
    to monitor appropriate SUSE repositories for updates. In Chapter 2, you''ll learn
    how to configure a SUSE repository locally on your computer.


    You can review a standard SUSE Professional GUI in Figure 1-9. You will see a
    circle next to the date in the lower-right part of the GUI. A red exclamation
    point indicates that updates are available.'
  merge: -1
  img_proc: true
