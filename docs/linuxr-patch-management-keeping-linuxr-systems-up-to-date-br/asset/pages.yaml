    +   ATRPM includes four levels of repositories. The stable repository is straightforward.
    The good repository includes stable packages along with a few that have not undergone
    testing to be considered. The testing repository includes good packages along
    with a few that are equivalent to betas on many systems. The bleeding repository
    includes all ATR packages, including many which are currently in development.
    For more information, see http://atrpms.net.


    +   The Dag Wiers repositories are excellent sources for packages such as the
