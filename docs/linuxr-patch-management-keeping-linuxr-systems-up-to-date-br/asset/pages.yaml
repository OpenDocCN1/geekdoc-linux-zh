- pgno: 188
  md: 'There are four different directories available from this repository: at-at-stable,
    at-testing, and at-bleeding. They are sequentially inclusive; in other words,
    packages in the at-stable directory are included in the at-good directory; all
    packages in the at-good directory are included in the at-testing directory; all
    packages in the at-testing directory are included in the at-bleeding directory.
    Therefore, you do not need to specify more than one directory when you specify
    an aptrmps repository. For example, if you do not want to include any unstable
    packages for a Fedora Core 4 repository, you could substitute the following line
    in the aptrmps list:


    ```

