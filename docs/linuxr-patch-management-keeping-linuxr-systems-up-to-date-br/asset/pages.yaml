- pgno: 216
  md: '# 6.2 Sample yum Clients


    Updates don''t happen often to either of these two packages. However, if you configure
    a script to automate updates, you should make these commands part of that script.
    You never know when a package will be updated.


    If you''ve already revised associated configuration files, such as /etc/sysconfig/sources
    and /etc/yum.repos/CentOS-Base.repo, they are not changed when new versions of
    the update and centos-yum RPMs are installed. The proposed updated files are stored
    in the same directories, with .rpmnew extensions.


    After updating the Update Agent, it''s appropriate to run update -1 again. In
    my case, I wanted to keep the current versions of ipsec-tools and firefox RPMs
    and install all other non-kernel updates. I performed this with the following
    command:


    ```

    update2 -u --exclude=firefox --exclude=ipsec-tools

    ```


    Of course, you can run the Update from the GUI. Run the update2 command in a GUI
    console. As you can see in Figure 6-3, the Update Agent shows available channels
    as you configured in /etc/sysconfig/rhn/sources.


    ![](img/e178bfcea0b6629d1234b59342d4d686_216_0.png)


    Figure 6-3 CentOS-4 updates with a random mirror


    As with other yum enabled Red-style systems, headers are downloaded and stored
    in /var/spool/update2 during this process. In Chapter 7, you''ll learn to use
    this directory of headers to help create a general repository for your network.'
  merge: -1
