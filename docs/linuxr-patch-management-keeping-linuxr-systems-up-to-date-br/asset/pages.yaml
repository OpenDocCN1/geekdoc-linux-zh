- pgno: 71
  md: '# Configuring Fedora for a New Repository Computer


    If you haven''t already done so, you should run the Update Agent on your computer.
    Before you use it as a repository for other computers on your network, you should
    make sure this computer itself is up to date!


    The steps are quite similar to those you''ve seen for RHEL in Chapter 1; one major
    difference is that you do not have to register your Fedora Linux computer on the
    Red Hat Network.


    # 2.1.2 Creating a Repository


    Now that you have a dedicated partition, you can create the repository that you
    need for the computers on your network. While we detail the process in later chapters,
    we describe the basic steps here:


    +   1. Select a Web or FTP server. As discussed in Chapter 1, Fedora clients look
    for updates on Web and FTP servers.

    2. Plan the directory tree for the repository. You''ll need separate directories
    for at least the installation and updates.

    3. Download the files for the repository.

    4. Synchronize the repository. You may want to create and automate scripts to
    keep that repository up to date.


    > Note

    If you''re creating a repository for Fedora Core 3 or later, the tools have been
    changed. The standard command is yum-arch; those who create yum repositories are
    moving toward the createrepo command. We''ll discuss the use of both tools in
    Chapter 6, “Configuring a yum client,” and Chapter 7, “Setting up a yum Repository.”


    # Select a Service


    As described in Chapter 1, Fedora clients pull updates from FTP and HTTP (Web)
    servers. You learned how to point a Fedora client to a repository on an FTP, NFS,
    or HTTP server, which is what Fedora users are familiar with. While I prefer FTP
    because the protocol is inherently faster, some prefer the security associated
    with an HTTP (or even an HTTPS) server.


    After you a service, you should set up a dedicated partition, as described earlier
    in this chapter. Then you can install and configure the service of your choice.
    We''ll show you how to configure a yum repository on a vsFTP server in Chapter
    7.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Planning the Tree


    Next, you''ll need to plan the directory structure. The simplest plan is to mirror
    an existing repository from a server connected to the Internet. But as many repositories
    may be configured for multiple architectures, mirroring may download much more
    than what you need.


    There is a substantial number of directories associated with Fedora Core repositories.
    If you don''t need development, testing, or source packages, you do not need all
    the standard repository directories on your system. If you may want to discourage
    users from downloading and installing developmental packages, because they may
    have unpredictable effects on your system.


    For the latest releases of Fedora Core, you may need to justify your use of different
    repository directories. Some of the options include


    +   Core and Extras—Core includes the basic packages associated with Fedora. Extras
    include additional tools that can be added by individual developers and have often
    gone through testing.


    +   Different Fedora Core Releases—If you are configuring a repository for clients
    where Fedora 2, 3, 4, and 5 are installed, you''ll need different repository trees
    for each. Each release includes subdirectories for RPMs and released architectures.


    +   Development and test releases—As described in Chapter 1, development releases
    include new features as they''re developed, even on a nightly basis. Test releases
    are the “beta” versions of Fedora. Generally, you can avoid these repository trees
    completely.


    +   Updates—These are key. They include the patches and updates that you want
    your users to have and install on their systems (after you test and approve them,
    of course). There are testing and released updates.


    Unless you''re a Fedora developer, you don''t or need most of the directory trees
    in your repository.


    # Downloading and Synchronization


    Now that you know what you want to download, you can proceed with the process.
    With the right command, as rsync or wget, you can download the repository trees
    of your choice. We''ll describe this process in more detail in Chapter 7. There
    are a number of developers who have automated the process.


    > Note

    You can use the basic directions in Chapter 3, “SUSE’s Update Systems and rsync
    Mirrors,” to create a local mirror of any repository with the rsync command. While
    Chapter 3 applies to SUSE, the basic commands apply to any repository on an rsync
    server.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# CONFIGURING A RED HAT NETWORK PROXY


    When you''re managing patches for a group of RHEL computers, you may not want
    all them when downloading hundreds of megabytes of patches through the Internet
    simultaneously. As discussed in Chapter 1, you can configure one or more Proxy
    or Satellite Servers for patch management.


    In this section, you''ll learn to configure a Red Hat Network Proxy Server and
    client. You can attach other RHEL clients on your network, download the same updates
    more quickly, and keep the load on your Internet connection to a minimum.


    > Note

    If you''re connecting a Red Hat Network Proxy Server to a local Red Hat Network
    Satellite Server, that serves as the Red Hat Network for the purpose of this chapter.
    Substitute accordingly. We have chosen not to cover the Red Hat Network Satellite
    Server, as that would bias this book too far toward Red Hat and related distributions.


    # 2.2.1 Configuring the Proxy Server


    The installation requirements for a Red Hat Network Proxy Server described in
    Chapter 1 mean that you''ll need a dedicated computer. Red Hat suggests that you
    keep what you install on the Proxy Server computer to an absolute minimum.


    In other words, don''t install other services on a Red Hat Proxy Server computer.
    This includes a GUI. As a competent Linux administrator, you do not need a GUI
    to configure or update the Proxy Server.


    In this section, you''ll configure a Red Hat Network Proxy Server from the command
    line interface and your administrative account on the Red Hat Network. In the
    following sections, we will describe specific installation requirements, and we
    will outline everything that you need to configure your Proxy Server, which includes
    following:


    +   1. RHEL in a minimal configuration; even the standard Red Hat minimal configuration
    supports networking.

    2. Configure your firewall to allow communication with the Red Hat Network.

    3. Set up a connection to external NTP (Network Time Protocol) servers.

    4. Configure the RHEL computer as a router.

    5. Register this computer on the Red Hat Network.

    6. Get to the Red Hat Network channel with the proxy packages.

    7. Install the Proxy Server packages.

    8. Provision this computer with a Proxy Subscription.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# 2.2 Configuring a Red Hat Network Proxy


    +   9. Configure the Proxy Server.

    10. Create the certification keys which allow clients to communicate with this
    Proxy Server.


    When this process is complete, you can configure the clients on your network to
    pull updates from this computer (and not directly from the Red Hat Network).


    # Note


    At any time during the Proxy Server configuration process, you may need to refresh
    your server and client configuration settings on the Red Hat Network. To do so,
    navigate to the target computer and run the `rhn_check` command.


    # Specialized Installation Requirements


    Red Hat suggests that what you install on a Proxy Server computer should be kept
    to a minimum. For RHEL versions 3 and 4, this corresponds to the Base and Core
    package groups. This includes all packages required to network and configure this
    computer through the Update Agent. The network connection allows you to configure
    this computer remotely through your Red Hat account.


    # Note


    Red Hat and related distributions document package groups in an XML file, `comps.xml`.
    It''s available on the first installation CD, in the `/RedHat/base/` subid.


    Red Hat also suggests that you should disable the `iptables` and `ipchains` firewall
    commands on a Proxy Server. While you can configure a Proxy Server between RHEL
    clients and the Internet, you should not configure this computer as a firewall.


    The Proxy Server packages that you''ll install through the Red Hat Network will
    allow you to configure minimal Web, Proxy, and routing services on this computer.
    However, it''s best if you do not configure this computer with any other functionality.
    For example, standard Apache or Squid services could interfere with the Red Hat
    Proxy Server.


    After you''ve configured a minimal installation of RHEL, you''ll need to complete
    the configuration yourself.


    # Note


    This book uses Red Hat Network Proxy Server 3.6 on RHEL 3. You can also use Proxy
    Server 3.7 or 4.0. If you want to dedicate a RHEL 4 computer for this purpose,
    you can use Red Hat Network Proxy Server 3.7 or 4.0. In either case, a Proxy Server
    on a RHEL 3 or 4 server works well for both RHEL 3 and RHEL 4 clients.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'A minimal installation does not load the Red Hat Setup Agent, also known as
    the First Boot service. Therefore, you may not have a regular user account. You
    aren''t even connected (yet) to the Red Hat Network.


    Before you can run this as a Red Hat Network Proxy Server, there are a few more
    things that you need to do. As you configure RHEL computer, you''ll be working
    from the command line interface. You remember how to do this, don''t you?


    First, this computer needs to recognize its own Fully Qualified Domain Name (FQDN).
    While this can be accomplished through a DNS (Domain Name Service) server, you''ll
    need to update your /etc/hosts file with your FQDN. I''ve added the following
    line to my version of this file:


    ```

    192.168.1.1       enterprise3d.example.com

    ```


    # Note


    Please note that configuration details associated with the Red Hat Network have
    changed from time to time, so you may need to modify the steps listed in this
    section for your Red Hat Network account.


    # Configuration Suggestions


    To keep your system secure, it''s best to disable any services which you don''t
    need. For, while the CUPS (Common Unix Print System) is enabled by default on
    a minimal installation of RHEL, you''re probably not going to use this computer
    as a proxy server. You can therefore disable this software with the following
    command:


    ```

    chkconfig cups stop

    ```


    It would be even better if you could uninstall all unneeded services, that isn''t
    always possible. In fact, with a RHEL minimal installation, most services that
    are installed are due to dependencies. Some of the services you might be tempted
    to uninstall are necessary for a Red Hat Network Proxy Server. While some of the
    installed services are not required, detailing those services is beyond the scope
    of this book.


    # Firewall Provisions


    Because Red Hat does not support the use of a firewall on a Red Hat Network Proxy
    Server, you should disable any firewall tools such as iptables or ipchains and
    4. The iptables service is installed by default on RHEL 3 and 4. You can disable
    this service with the following commands:


    ```

    service iptables stop

    chkconfig iptables stop

    ```'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Configuring a Red Hat Network Proxy


    Because you won''t have firewall tools on this computer, it will likely sit behind
    a firewall. It needs to communicate with the Red Hat Network. To do so, it requires
    open ports for outbound connections to regular and secure Web services, on TCP/IP
    ports 80 and 443. It''s normal to have these connections open for most computers
    on an Internet connected network, so your system is probably already set. You
    may need to reconfigure your firewall to open these ports.


    However, if your Proxy Server connects to a Red Hat Network Satellite Server on
    an external network, you''ll also need to configure your firewall to allow inbound
    connections on TCP/IP port 5222. For details on firewalls and using the iptables
    command, see Real World Linux Security, 2nd Edition by Bob Texen (Upper Saddle
    River, N.J.): Prentice, 2003).


    # Synchronizing Time


    It''s important to make the clocks on the computers on your network relatively
    much synchronized. The standard method is with the NTP daemon (ntpd), which relies
    on the Network Time Protocol (NTP).


    To configure the NTP service, add at least three time servers to the associated
    /etc/ntpd.conf configuration file and make sure the NTP daemon runs when you start
    RHEL. A list of public NTP servers is available online from ntp.org/bin/view/Servers/.
    Many networks depend on these servers. If overloaded, their responses may be delayed,
    and that''s not good for a time server. As described on the noted Web site, the
    administrators of these servers may require you to notify them, and you often
    need to get authorization to link to them.


    Some servers, especially those known as "Stratum 2" servers, are levels away from
    official clocks and aren''t heavily loaded. While they are less accurate, the
    variance is some small fraction of a second, which causes problems for most network
    applications, including the Red Hat Network Proxy Server. Stratum 2 servers generally
    do not get as much traffic. If noted on the Public NTP server site, you may connect
    to them without notifying their administrator.


    To sure the NTP server is running (and the next time you boot RHEL), run the following
    commands:


    ```

    service ntpd start

    chkconfig ntpd on

    ```


    # Configuring the Proxy as a Router


    In many scenarios, you''ll want to configure your Red Hat Network Proxy Server
    between your LAN and a gateway to the Internet. As the associated software includes
    the router associated with the jabber project (jabber.jabberstudio.org), the process
    is simpler than it would be for a regular router.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Routing on a RHEL computer allows network communication between networks over
    that computer. All you need to do is configure forwarding of IP packets. You can
    do so during the current RHEL session with the following command:


    ```

    echo ''1'' > /proc/sys/net/ipv4/ip_forward

    ```


    To make sure RHEL enables routing the next time you boot, you''ll need to set
    the following line in your Linux kernel system control configuration file, /etc/sysctl.conf:


    ```

    net.ipv4.ip_forward = 1

    ```


    # Registration Required


    Before you can download the Red Hat Network Proxy Server software, you need to
    register that computer on the Red Hat Network. The most straightforward method
    is with one of the following commands:


    +   - rhn_register

    up2date --register


    Alternatively, if you have not yet registered this computer, the first time you
    run the up2date command, the Update Agent runs the registration process automatically.


    Even if you''ve installed RHEL in a minimal configuration, Red Hat supports a
    low-intensity blue graphical screen for the Update Agent, similar to what you
    see if you install RHEL in text mode. Before you register, you''re taken through


    +   - Some of the latest features associated with the Red Hat Network.

    - The Red Hat Privacy agreement.

    - A login page; you should already have a registered account on the Red Hat Network,
    as described in Chapter 1. For more information, see rhn.redhat.com.

    - Registering a system profile, which includes basic information about your hardware.

    - Sending a profile with a list of installed packages to the Red Hat Network.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# 2.2 Configuring a Red Hat Network Proxy


    This is an excellent time to make sure this RHEL computer is up to date with the
    latest packages. You''ve read about using the Update Agent on RHEL in Chapter
    1. Remember, you don''t have the benefit (or curse, perhaps) of the GUI for this
    process. Now that you''ve registered this computer, you may be able to complete
    this process with a command that completely updates the system with all relevant
    packages:


    ```

