- pgno: 186
  md: '# Note


    YaST Online Update runs the SUSEconfig command automatically after down-loading
    and installing new packages.


    Alternatively, you can use the specialty apt commands associated with Fedora Linux
    to manage packages by groups. You may have read about the following commands in
    the previous section:


    ```

    apt-cache groupnames

    apt-cache showgroup groupname

    apt-get groupinstall groupname

    apt-get remove groupname

    ```


    Be careful when you run these commands. Don''t just blindly accept the defaults!
    The effects of the apt-get groupremove command, for instance, may be unpredictable.
    For example, I tried to run the following command on my system:


    ```

    apt-get groupremove Games-9.2-62.noarch

    ```


    This command proposed that I accept the removal of key packages, as evolution,
    gnome-desktop, and kdebase3. If I accepted the defaults, I probably would have
    had to restore the files associated with these packages from backup in order to
    run the KDE Desktop Environment.


    # 5.2.6 Configuring apt for a Red Hat Rebuild


    There is at least one rebuild of Red Hat Enterprise Linux 4 that relies primarily
    on apt for updates. Lineox is somewhat unique for a distribution of Red Hat Enterprise
    Linux. It is backed and supported by a separate company in Finland and provides
    free and paid updates using apt-based tools. Naturally, apt packages are already
    installed by default on this rebuild distribution. (Lineox includes yum repositories
    for its 64-bit distribution versions.)


    # Note


    There are other Red Hat rebuilds that have apt repositories available, such as
    CentOS 4. For more information, see www.caosity.org.'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'Lineox supports a variety of mirrors worldwide. While the list is not extensive,
    it makes it possible to use apt to keep this rebuild up to date. The default version
    of Lineox''s /etc/apt/source.list includes the following URLs:


    ```

    rpm http://www.raimokoski.com/pub/lineox/4.0/updates/i386 updates

    rpm http://www.raimokoski.com/pub/lineox/4.0/i386/os Lineox os

    ```


    The mirrors available for Lineox are complete; in other words, you can substitute
    the base URL of the mirror closest to you and use them to manage patches on your
    system. For example, the Lineox mirror in the U.S. is located at the Georgia Institute
    of Technology, at ftp://tp.github.com/gatech. If you''re located in the U.S.,
    you should be able to substitute URL for http://www.raimokoski/.


    The Lineox apt configuration files include suggestions for other repositories.
    We describe them here in detail, as they may be useful for any Red Hat Fedora
    distribution. These suggestions are located in files in the /etc/apt/sources.list
    directory and are listed in the following sections. All the suggested repositories
    in this directory are "commented out". You''ll need to remove the comment character
    (#) if the repository noted is suitable for your network.


    While you should be able to connect to mirrors customized for your distribution,
    don''t just change version numbers from the configuration files. Check the mirrors
    for yourself. Make sure that they contain the repositories that you need.


    | Note |

    The repositories described in the following sections may be superseded by those
    associated with the RPMForge project. Check the Abstract Web sites for the latest
    |


    atrpms.list

    You may already be familiar with the repositories available from atrpms.list.
    The atrpms.list includes the mirror of these repositories, based in Germany. For
    example, this file for Lineox 4.0 includes the following link to a Fedora Core
    2 repository:


    ```

    #rpm http://apt.physik.fu-berlin.de fedora/2/en/i386 at-testing

    ```


    The mirrors listed at atrpms.net/mirrors/ are all on the European continent. You
    should be able to substitute their base URL for http://apt.physik.fu-berlin.de,
    as shown previously. While the examples in the version of Lineox 4.0 available
    as of this listing only Fedora Core 1 and 2; Fedora Core 3 and 4 and Red Hat Enterprise
    Linux 3 and 4 repositories are also available. If later versions of these distributions
    have been released, check the mirror of your choice. You may be pleasantly surprised.'
