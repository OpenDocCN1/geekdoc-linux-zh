    # Testing Patches


    Many services are patched frequently. Service patches may incorporate improvements,
    additional features, bug fixes, or more. When you see a service patch, don''t
    just blindly upgrade. Consider the following:


    +   Read the release notes. Evaluate the reason for the patch. Does it add any
    features you need? Does it address any bugs that annoy you about the application?
    Does it improve your security in a way that applies to your computers or your
    network?


    +   If configuration files are associated with the service, back them up, to at
    least one directory.


    +   If you decide you need the service patch, test it carefully. Download and
    install it on your test system. Make a list of downloaded packages, especially
    if there are dependencies.


    +   Test the patch on your system. First, based on the release notes, make sure
    the patch works as intended.


    +   Identify any differences from the previous configuration files, and assess
    the impact on your users. Make notes.


    +   If the service is shared on a network, test the upgrade from another computer.
    Measure the current network demands on this service. If practical, find way to
    simulate these demands on the upgraded service.


    +   If there are problems with the patch, re-evaluate the changes. Make sure you
    actually need the patch.


    +   When you''re ready to install the service patch in production, make sure your
    users know what to expect.


    If you identify a problem with an application patch and absolutely need it, see
    the troubleshooting steps identified at the end of this section.


    # Patch Troubleshooting


    If you have a problem with a patch, the problem may be or not be with the patch.
    It could be a symptom of a different problem. Because troubleshooting depends
    on what you''re patching, I can provide only general guidelines here. But with
    any troubleshooting, it''s best to apply the scientific method:


    +   Observe the problem. Identify its symptoms, using log files where applicable.'
  merge: -1
