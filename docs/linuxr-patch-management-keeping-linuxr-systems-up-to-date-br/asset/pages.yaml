    # 3.1.8 A Local YaST Online Update


    After the download is complete, you can update SUSE Linux Enterprise

    Servers on your local network from this location. All you need to point

    your computer to the appropriate directory. Share the appropriate directory

    and point your Online Update to this location.


    Updating the Local Server

    If you''ve downloaded the cache to a local SUSE Linux Enterprise Server, you

    may want to update that server. It''s a straightforward process. Just follow

    thentese steps:


    +   1. Start YaST and select Online Update. This opens the Welcome To YaST

    Online window.

    2. Select New Server. This opens the Select Type of URL window.

    3. Select Directory and then OK.

