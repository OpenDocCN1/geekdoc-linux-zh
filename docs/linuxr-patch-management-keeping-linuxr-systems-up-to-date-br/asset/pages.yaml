    Run a search. You might be pleasantly surprised. My educated guess is that Red
    Hat will add yum to one of these channels sometime in the future.


    You can get yum from a Fedora or Red Hat mirror or from one of the rebuilds of
    RHEL that uses yum repositories. If you''re running RHEL 3, you can get a compatible
    version of yum from a RHEL 3 rebuild or Red Hat Linux 9. If you''re running RHEL
