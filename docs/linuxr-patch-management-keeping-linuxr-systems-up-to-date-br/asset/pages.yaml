- pgno: 202
  md: '# 6.2 Sample yum Clients


    # 6.1.3 Repositories and Headers


    One advantage of yum is that you can use it to configure repositories on standard
    FTP or HTTP servers. To maximize compatibility with Red Hat, the yum developers
    to write their packages in the Python language, which Red Hat has to use for its
    Anaconda as well as its update systems.


    The other advantage is how the yum command relies on RPM headers. You''ll learn
    the commands required to copy just the headers from a directory of RPMs in Chapter
    7, "Setting Up a yum Repository." To make sure your repository supports, you use
    the headers/ or repodata/ subdirectories.


    # 6.1.4 Required yum Packages


    The yum system is compact. The binary RPM package is less than 200KB. It includes
    everything you need to manage patches and create a repository on your system:
    the yum and yum-arch commands. As you''ll see in Chapter 7, Fedora Core 3/4 and
    later distributions substitute the createrepo instead of yum-arch command to help
    you configure a repository on your own network.


    If you''re running Red Hat or Fedora Linux and want to continue using up2date
    as an update tool, you can modify the associated configuration files to acquire
    updates from yum repositories. Alternatively, if you''re learning to learn the
    yum commands, you''ll never have to use up2date ever again.


    > Note

    It''s unclear as of this writing, SUSE may move toward yum-based repositories,
    well, possibly as soon as SUSE 10.1. Whether they use apt or yum repositories,
    they will likely use the Smart package manager (http://smartpm.org).


    # 6.2 SAMPLE YUM CLIENTS


    This book is focused on Red Hat/Fedora, SUSE, and Debian. The only distribution
    from this list supports yum is Fedora Linux. However, a variety of yum repositories
    is also available for Red Hat Enterprise Linux. And several of the Red Hat Enterprise
    Linux rebuilds use yum as their primary means for patch management.


    > Note

    Before adding a yum repository to your configuration files, make sure the cited
    URL exists. As you''ll see in Chapter 7, yum repository URLs should include either
    a headers/ or repodata/ subdirectory, which includes the headers from all of the
    enclosed RPM packages.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# 6.2. Fedora


    We examined how you can configure Fedora as a yum client briefly in Chapter 1,
    "Patch Management Systems." In this section, we''ll examine the configuration
    process in more detail. There are two parts to this process. You''ve already configured
    your Fedora computer as a yum client. In this section, you''ll direct Fedora''s
    version of the Red Hat Update Agent to the same yum repositories.


    > Note

    Starting with Fedora Core 5, Red Hat has replaced the Update Agent with the Package
    Updater, also known as Pup. If you prefer the Update Agent, you can still install
    the update2 and up2date packages from the Fedora Core 5 repositories. Unfortunately,
    I could not include Fedora Core 5 in this chapter, as the first test (beta) release
    was made available as this book was sent to the printer.


    # Fedora''s Red Hat Update Agent and yum


    By default, Fedora''s version of the Red Hat Update Agent is configured to use
    yum. The key configuration file associated with the Update Agent is the sources
    file in the /etc/sysconfig/rhn directory. For Fedora Core 3, default repositories
    are directly cited in this file. Starting with Fedora Core 4, the following command
    searches through repositories as specified in the /etc/yum.repos.d directory:


    ```

    repdom fedora http://fedora.redhat.com/

    ```


    In this section, I will examine configuration files from Fedora Core 3 and 4.
    While this may be confusing at first, I believe you can learn a lot about configuring
    yum for updates, based on the contrasts. In addition, if you use Red Hat Enterprise
    Linux 4 (or one of the related "rebuild" distributions), you''ll see later in
    the chapter why it helps how to configure yum on Fedora Core 3.


    As suggested in Chapter 1, there are four repositories associated with Fedora
    releases (and two more of interest):


    +   - os is associated with the base release and includes those packages that
    you would find on the Fedora installation CDs.

    - updates includes stable packages that are updated or otherwise revised to address
    security problems or introduce new features.

    - updates-testing adds candidate files for updates that are not considered production-ready
    (but what you might consider if you''re desperate for an update).

    - development includes unstable packages that may be revised often as every day.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# 6.2 Sample yum Clients


    extras is a fifth super-category; there are actually several additional developmental
    and testing repositories available in the extras category. If you''re interested
    in this level of detail, search the extras subdirectory of your favorite Fedora
    mirror.


    extras-development is a sixth category, similar to the regular development repository.


    The default configuration for Fedora Core 3 includes the following command lines,
    which configure connections to the yum installation (os) and updates repositories:


    ```

    yum fedora-core-3

    http://download.fedora.redhat.com/pub/fedora/linux/core/3/$ARCH/

    yum updates-released-fc3

    http://download.fedora.redhat.com/pub/fedora/linux/core/updates/3/$ARCH/

    yum-mirror fedora-core-3 http://fedora.redhat.com/download/up2date-mirrors/fedora-core-3

    yum updates-released-fc3

    http://fedora.redhat.com/download/up2date-mirrors/released-fc3

    ```


    In default, the configuration for Fedora Core 4 points to default repositories
    in the files (/etc/yum.reposd) directory. The files associated with the installation
    (os) and updates repositories are fedora.repo and fedora-updates.repo. The key
    commands from these files include the following:


    ```

    mirrorlist-http://fedora.redhat.com/download/mirrors/fedora-core-$releasever

    mirrorlist-http://fedora.redhat.com/download/mirrors/updates-released-$releasever

    ```


    These files (and any others in the /etc/yum.reposd directory) are active if you
    see the following directive in the configuration file:


    ```

    enabled=0

    ```


    For both Fedora Core 3 and Fedora Core 4, these commands connect your computer
    to the os and updates repositories de on two different servers: download.fedora.redhat.com
    and a random mirror as specified in the fedora-core-3 and updates-released-fc3
    files (as well as fedora-core-4 and updates-released-fc4 files) at http://fedora.redhat.com/download/up2date-mirrors/


    It''s best to change these command line to point to a different mirror. A list
    of mirrors is available from http://fedora.redhat.com/download/mirrors.html. Before
    making any change to the URL, check the associated directory. You may need to
    change that as well.'
