    **What''s in a Group?**

    You can find the packages associated with each group. You can use the group names
    defined in the output from the yum grouplist command. Because many of these groups
    have multi-word names, you may need to use quotes to define the group name. For
    example, if you want to find the packages in the Administration Tools list, you''d
    run the following command:


