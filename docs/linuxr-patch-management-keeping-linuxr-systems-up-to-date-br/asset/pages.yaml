    ```


    This is an important command. The -u switch forces apt-get to tell you what is
    planned for the upgrade. The dselect-upgrade option includes'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'recommended options for packages that are downloaded and installed. This switch
    is not available for aptitude; the aptitude upgrade mode works as well.


    When you download packages with apt, they download as .deb packages to the /var/cache/apt/archives
    directory. As you install and patch your system, the space used by this directory
    can build into gigabytes. You should keep this directory clean on a periodic basis.
    If you just want to purge packages that are now obsolete, you could run the following
    command:


    ```

    apt-get autoclean

    ```


    If you have obsolete packages in your archives, you''ll see a series of messages
    listing the files that are deleted, such as


    ```

    acremove 5.10-0.2 [971kB]

    ```


    If you''re really pressed for space, and do not want a patch management repository
    on your computer, you could run the following command:


    ```

    apt-get clean

