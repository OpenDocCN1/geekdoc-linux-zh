    - yumcentos4-contrib http://mirror.centos.org/centos/4/contrib/$ARCH/

    - yumcentos4-addons http://mirror.centos.org/centos/4/addons/$ARCH/


    As discussed in this book, CentOS-4 is built by volunteers. If you connect to
    a mirror, as opposed to directly their servers, you can keep their costs down.
    To do so, revise these URLs to point to a CentOS mirror closer to your location.
    For a full list, navigate to www.centos.org/minify/index.php?id=13. For example,
    if you''re located in California, you might use the mirror located at the University
    of California, Riverside. The base URL cites a different base directory:


    ```

    http://centos.cs.ucr.edu/centos/4.0/

    ```


    You would substitute this URL for http://mirror.centos.org/centos/4/ in the command
    lines shown previously. To make sure things worked, you can check available channels
    with the following command:


    ```

    up2date --show-channels

    ```


    But this command does not check the URLs. You should see the list of available
    updates. If there''s a problem with one of your URLs, you should see a connection
    error. For example, when I made a mistake typing in an HTTP URL, I got a 404 (file
    not found) error. Problems should be saved in the Update Agent log file, /var/log/up2date.


    The first time I ran up2date -1, I found two critical packages in the list: centrum-yumconf
    and up2date. Thecentos-yumconf package provides the rebuild yum configuration
    file, /etc/yum.repos.d/CentOS-Base.repo. If you are using a different rebuild,
    it will have a different, equally important package. Naturally, these packages
    affect how other packages are updated. I wanted to download and install these
    packages first before downloading others. I could do so with the following command:


    ```

    up2date up2date dieron-yumconf

    ```'
