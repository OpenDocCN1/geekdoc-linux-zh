- pgno: 142
  md: '# 4.1 Fundamentals of apt


    excellent place to start is the APT HOWTO, available online from www.debian.org/doc/manuals/apt-howto/index.en.html.


    One key is aptitude. While I described apt-get in Chapter 1, aptitude is in many
    ways an enhanced version of this command. If you''re familiar with apt-get, you
    can use most of the same options with aptitude. What you use or prefer depends
    on you.


    # apt-get and aptitude

    Not all Debian-style distributions include aptitude. But for all commands in this
    section, you can substitute aptitude for apt-get. In fact, you may want to try
    both versions to see which you prefer.


    As described in Chapter 1, the basic command that you can use to install the package
    of your choice is


    ```

    apt-get install packagen

    ```


    But what you might not be up to date. To keep your databases up to date, download
    the Packages.gz file, which includes the latest information from each repository.
    You don''t have to download the file directly. You can update your databases with
    the help of this file by using the following command:


    ```

    apt-get update

    ```


    > Note

    Sometimes you may see an error in the output from apt-get update. Don''t panic.
    Run the command again. Sometimes the updates that you download the first fix problems
    that allow you to complete the update second time you run that command.


    As a systems administrator, you might want to remove some packages on occasion.
    For example, if you don''t want users recompiling their kernels, you could run
    the following command:


    ```

    apt-get remove kernel-source

    ```


    If you want to keep your system up to date, you''ll want to become familiar with
    the following command (the -u switch doesn''t work with aptitude):


    ```

