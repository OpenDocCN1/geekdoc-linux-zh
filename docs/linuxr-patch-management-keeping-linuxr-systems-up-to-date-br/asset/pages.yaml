    # Troubleshooting


    With thousands of packages, the first rule when running the Red Hat Update Agent
    is patience. You may be downloading hundreds of MB of headers. Only after the
    headers are installed can yum check your requested updates for dependencies. Only
    does the Update Agent download the actual packages. After the packages are installed.
    By default, they are deleted from the /var/spool/up2date directory. Each of these
    steps takes time. My first'
