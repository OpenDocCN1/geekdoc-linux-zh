    Red Hat/Fedora, Novell/SUSE, and Debian.


    > Note

    The and FTP sites associated with a distribution are often very busy. Connections
    are limited to a certain number of users; even with such limits, downloads may
    be slow. Most distributions have “mirrors,” or second-level repositories, which
    maintain an exact copy of the original.


