- pgno: 117
  md: 'To share the directory that you created earlier, follow these steps:


    +   1. Add the following line to the local /etc/exports file:


    ```

    /var/lib/YaST2/you/mnt/    192.168.0.0/24(ro,sync)

    ```


    This line assumes that the directory where you synchronized patches is as shown,
    and your LAN is configured on the private 192.168.0.0 IPv4 network. These computers
    are allowed read-only (ro) access, and changes must be synchronized (sync) regularly.


    +   2. If the local NFS Server is not already running, you''ll need to start it
    with a command such as


    ```

    /etc/init.d/nfsserver start

    ```


    If your NFS server is already running, you may need to substitute restart for
    start.


    +   3. Make sure you export the share with the exportfs -a command.


    +   4. Confirm your exports with the showmount -e command.


    # Updating Neighboring Servers


    Now you can proceed to updates of remote SUSE Linux Enterprise Servers for your
    network. To do so, follow these steps:


    +   1. Confirm your access to the shared directory. If the SUSE Linux Enterprise
    Server with the repository is suse2.example.com (you can substitute the IP address),
    you can confirm access with the following command:


    ```

    showmount -e suse2.example.com

    ```


    +   2. On the remote SUSE Linux Enterprise Server, start YaST. Select Online Update
    from the Software menu. Select New Server. In the Select Type of URL window, select
    NFS, and click OK.


    +   3. Enter the name or IP address of the NFS server, as well as the shared directory,
    and click OK. You''ll see the shared directory in the Location text box in a similar
    to


    ```

    nfs://suse2.example.com//var/lib/YaST2/you/mnt/

    ```'
