- pgno: 251
  md: 'As with other network services, yum servers may be sensitive to any firewalls
    that you configure. If you have a firewall between the yum computer and associated
    clients, you''ll need to make sure traffic can travel through appropriate TCP/IP
    ports; for example, Apache servers require access through TCP/IP port 80. There
    are ways to "tunnel" data through other services, such as SSH, but that should
    not be necessary for updates limited to your internal network. In any case, level
    of detail is beyond the scope of this book.


    # 7.3.1 Configuring an ftp Server


    On current Red/Fedora distributions, the default FTP server is vsFTP. According
    to his image page at http://vsftpd.beasts.org/, it''s the FTP server used to share
    a number of Linux distributions, including Red Hat and Debian. It''s even used
    to share kernels through ftp.kernel.


    The default version of vsFTP is configured in the vsftpd RPM. The vsFTP configuration
    file is stored in /etc/vsftpd/vsftpd.conf for Red Hat/Fedora distributions (/etc/vsftpd.conf
    for SUSE and Debian distributions). In this case, we''re working from RHEL 4 version
    of vsFTP.


    By default, vsFTP files are stored in the /var/ftp directory. By convention, files
    that you copy for downloads are stored in the pub/ subdirectory. Therefore, the
    repository that you create should be in the /var/ftp/pub directory. update RPMs
    are stored in the following directory:


    ```

    /var/ftp/pub/yum/4/1386/updates

    ```


    If you''ve used the commands earlier for Fedora Core 4, you''ll find the update
    header database in the repodata/ subdirectory.


    There is a substantial number of options for vsFTP, which of you can configure
    in the vsftpd.conf configuration file. The following is a review of active options
    in RHEL 4 version of this file. If you want to check the current defaults for
    these and other options, read the vsftpd.conf man page associated with vsFTP RPM.


    ```

    anonymous_enable=yes

    ```


    You absolutely want to enable anonymous access for an FTP-based yum server. Anonymous
    access is normally enabled by default on a vsFTP server.


    ```

    local_enable=yes

    ```'
  merge: -1
  img_proc: true
- pgno: 252
  md: 'It’s normally best to disable access by regular users to a FTP-based server.
    As it is disabled by default, all you need to do is comment out this option.


    ```

    write_enable=yes

    ```


    Naturally, because you do not want anyone (unless authorized) to overwrite (or
    even add) to a yum-repository, you should disable write access.


    ```

    local_umask=022

    ```


    If you authorize write access (I believe you should not do so on an FTP-based
    yum server), this option sets the umask for any files created by users who are
    logged into your FTP server.


    ```

    dismissage_enable=yes

    ```


    If active, this option looks for and reads any .message file that exists in the
    local directory. This can be useful if you want to send messages to other administrators.


    ```

    xferlog_enable=yes

    ```


    If active, this option logs downloads (and uploads) on the vsFTP server in the
    /var/log/xferlog file. For example, when I downloaded an updated version of yum,
    the vsFTP server placed the following entry in file:


    ```

    Mon Sep 2 17:18:25 2005 1 192.168.0.20 390363

    /pub/yum/4/1386/updates/yum-2.4.0-0.fc4.narch.rpm b _ o a anonymous@

    ftp 0 * c

    ```


    As you can see, this lists the date and time of the transfer, the client address,
    as well as the size and location of the file. This is a standard format shared
    with the WU-FTP server and can be mined as a database for more information on
    client computers that connect to your server.


    ```

    connect_from_port_20=yes

    ```


    Some FTP clients require this option, which uses TCP/IP port for 20 for data transfers.


    ```

    xferlog_std_format=yes

    ```'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'If you''ve activated the xferlog_enable option noted earlier, this option supports
    a standard format shared with the WU-FTP server.


    ```

    pam_service_name=vsftpd

    ```


    The pam_service_name option defers to Pluggable Authentication Modules to help
    secure the vsFTP service. This particular option sets rules in /etc/pam.d/vsftpd.
    One of the key options in this file prohibits users listed in /etc/vsftpd.ftusers
    from logging into this vsFTP server.


    ```

    userlist_enable=YES

    ```


    As configured, this is redundant with the previous command. When enabled, the
    vsFTP server read the /etc/vsftpd.user_list file and deny access to all attempt
    to connect as one of the users listed in this file. By default, this file contains
    the same list of users as shown in /etc/vsftpd.users.


    ```

    listen=YES

    ```


    By default, Red Hat / Fedora configures the vsFTP server as a standalone service,
    with a vsftpd activation script in the /etc/rc.d/init.d directory. In contrast,
    SUSE does not configure vsFTP as a stand-alone service and config listen=NO by
    default.


    ```

    tcp_wrappers=YES

    ```


    As configured, Red Hat / Fedora configures the vsFTP server for one more level
    of security, through TCP Wrappers support, which allows you to configure more
    security related commands in the /etc/hosts.allow and /etc/hosts.deny files. When
    you''re satisfied with the configuration, you should activate the vsFTP server
    with the following command (which is not required if you''ve set listen=NO):


    ```

    /etc/init.d/vsftpd start

    ```


    Finally, you can make sure that vsFTP is active the next time you reboot Linux
    with the following command:


    ```

    chkconfig vsftpd on

    ```


    This command activates the vsFTP server whenever you''re in run levels 2, 3, 4,
    or 5. (If you configure vsFTP in xinetd, it activates it in the /etc/xinetd.d'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'directory.) For the purpose of this chapter, assume the name of this server
    is yum.example.com.


    # 7.3.2 Configuring a Yum Client for an FTP-Based Yum Repository


    After you have configured your FTP yum server, configuring the associated yum
    client is a straightforward process. As you''ve seen in Chapter 6, yum configuration
    files point to yum servers are normally configured in the /etc/yum.repos directory.
    For Fedora Core 4, we will examine the client file that points to your yum update
    server: fedora-updates.repo.


    For the yum FTP server as configured, all you need to include in the fedora-updates.repo
    file is the following:


    ```

    [updates-released]

    name=Fedora $releasever - $basearch - Released Updates

    baseurl=ftp://yum.example.com/pub/yum/4/i386/updates

    enabled=1

    gpgcheck=1

    ```


    As described earlier, for a vsFTP server, this means that update RPMs as well
    as the associated subatadirectory are stored on the yum.example.com computer in
    the /var/ftp/pub/yum/4/i386/updates directory.


    # 7.3.3 Configuring an NFS yum Server


    On current Red/Hatora distributions, an NFS server is installed by default, courtesy
    of the RPM works well in most cases. You can specify shared NFS directories in
    the /etc/exports configuration file. In this case, we are working from the RHEL
    4 version of NFS.


    You can share directories as configured on an NFS server. For the example described
    earlier, update RPMs are stored in the following directory:


    ```

    /var/ftp/pub/yum/4/i386/updates

    ```


    Therefore, you can share this directory at any level, as long as the mount point
    on the NFS client is consistent. For example, I''ve added the following line to
    my /etc/exports configuration file:


    ```

    /var/ftp/pub      192.168.1.0/24 (ro,sync)

    ```


    This particular configuration command shares the /var/ftp pub directory. It limits
    access to clients in the noted IP address range. Clients are allowed read-only
    (ro) access. Changes are committed to disk before any new requests are made (sync).'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# Note


    The notation shown in /etc/exports is associated with Classless Inter-Domain Routing
    (CIDR). The 192.168.1.0/24 address corresponds to a range of client IP addresses
    from 192.168.1.1 and 192.168.1.254 (the range excludes network and broadcast addresses).


    For more information, see the man page Linux Administration Handbook by Eve Nemeth,
    Garth Snyder, and Trent Hein (Upper Saddle River, NJ: Prentice Hall, 2002). After
    you''re satisfied with the configuration in /etc/exports, deactivate the NFS server
    with the following command:


    ```

    /etc/init.d/nfs stop

    ```


    # Note


    Remember, this chapter is focused on Fedora/Red Hat. The NFS server script goes
    by different names on other Linux distributions.


    By default, this should stop any NFS services, quotas, the NFS daemon, as well
    as the mount daemon. Next, export the changes to /etc/exports with the following
    command:


    ```

    exportfs -a

    ```


    Now restart the NFS services with the following command:


    ```

    /etc/init.d/nfs start

    ```


    Confirm the exports in the local list with the following command:


    ```

    showmount -e

    ```


    If you''re on another system, you can find the shared NFS directories. For example,
    you can list those on a server named yum.example.com with the following command:


    ```

    showmount -e yum.example.com

    ```


    Finally, you can make sure that NFS is active the next time you reboot Linux with
    the following command:


    ```

    chkconfig nfs

    ```'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# 7.3 Configuring a Local yum Server


    This command activates the NFS server whenever you''re in run levels 2, 3, 4,
    or 5.


    # 7.3.4 Configuring an NFS yum Client


    You''ll need to mount the NFS share on an appropriate local directory, and then
    configure the associated file in /etc/yum.repos.d to point to that share. Because
    we''re configuring a share for Fedora updates, we''ll modify the fedora-updates.repo
    file.


    First, on the NFS client, you should confirm your ability to connect to a shared
    NFS directory. The following command connects to the yum.example.com NFS server
    to find what shares are available on that server:


    ```

    mount -e yum.example.com

    ```


    You''ll see the shared directories that you configured earlier, including /var/ftp/pub.
    I mounted it on the local /var/yum directory with the following command:


    ```

    mount yum.example.com:/var/ftp/pub /var/yum

    ```


    If the /var/yum directory does not exist, you''ll get an error message. Now you
    can configure your fedora-updates.repo file in /etc/yum.repos.d directory. For
    the yum server as configured, all you need in fedora-updates.repo is:


    ```

    [updates-released]

    name=Fedora Core $release - $basearch - Released Updates

    baseurl=file:///var/yum/yum/4/i386/updates

    enabled=1

    gpgcheck=1

    ```


    As described earlier, for a vsFTP server, this means that RPMs as well as the
    associated repodata/ subdirectory are stored in the yum/i386/updates subdirectory,
    mounted on the /var/yum directory.


    Note the syntax using the baseurl command. The file: command works in place of
    ftp: or http:. The triple forward slash (///) is the standard syntax required
    for mounted directories.


    If you''ve configured a Fedora repository on a Fedora Core server, this command
    may be slightly different. Based on the directory specified earlier, you would
    substitute the following baseurl command:


    ```

    baseurl=file:///var/ftp/pub/yum/4/i386/updates

    ```'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'Naturally, you may want to configure this shared directory as part of the boot
    process for each NFS client. It''s possible to configure it in the default /etc/fstab
    configuration file, as well as through the Autounter daemon. I recommend the latter,
    which avoids hangs when there are network problems. The Autounter daemon is easy
    to configure; it requires the autofs RPM. After that RPM is installed, here''s
    how you can configure an NFS client for Fedora updates in this configured:


    +   1. Install the autofs RPM; if you''ve configured yum, the simplest way is
    with the following command. Even if you''re not sure if autofs is installed, the
    command makes sure that you have the latest version of the Autounter:


    ```

    yum install autofs

    ```

    n2. Configure the Autounter master file to read from /etc/auto.misc. Open the
    /etc/auto.master configuration file. You''ll see sample commands; activate the
    following to read from the noted file. The timeout prevents your system from hanging
    if there''s a problem with your network or the NFS server.


    ```

    /misc /etc/auto.misc --timeout=60

    ```

    Autounter shares configured in /etc/auto.misc are configured as subdirectories
    of /misc.

    3. Configure the /etc/auto.misc file to read the shared NFS directory. Based on
    the shared directory and NFS server name described earlier, add the following
    line to that:


    ```

    yum -ro,soft,intr yum.example.com:/var/ftp/pub

    ```

    4. Start the Autounter service with the following command:


    ```

    /etc/init.d/autofs start

    ```


    Note

    Yes, it is possible to use the /etc/auto.ner script to find and connect to shared
    NFS directories. It might not be compatible with SE Linux. For more information,
    see bug 174156 on bugzilla.redhat.com.


    +   5. Test the result. If your network is connected and the NFS server is running,
    you should be able to see the shared NFS directory with the following command:


    ```

    ls /misc/yum

    ```

    Occasionally, you may need to run this command more than once to establish the
    connection.

    6. Configure the /etc/yum.repos.d/fedora-updates.repo file to point to this directory
    as shared. Based on the previously shared NFS directory, the baseurl command would
    be


    ```

    baseurl=file:///var/ftp/pub/yum/4/i386/updates

    ```'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# 7. Test the result with the yum update command. You should see messages similar
    to a regular yum update from other local or remote servers.


    # 7.4 ADD OTHER REPOSITORIES


    You might want to maintain other repositories on a local server. Based on the
    chapter so far, you should have the tools you need to create the server and configure
    your clients to read from that server.


    As suggested earlier, there are several different repositories available for Fedora,
    as Extras, Development, and Testing repositories. In many cases, you might want
    to add repositories from allied distributions. For example, Fedora Core 3 repositories
    may be suitable for RHEL 4 and reliable rebuilt distributions. There are also
    third-party repositories available; many of the same third-party apt repositories
    described in Chapter 5, "Configuring apt for Fedora Distributions," include "yumummied"
    RPM repositories of possible interest.


    # 7.4.1 Using Distribution Installation Files


    If you followed the steps described earlier, you copied the files from the Fedora
    Core 4 installation CDs to a directory in your yum repository. You should have
    a copy of the installation DVD (or CDs) in the following directory:


    ```

    /var/ftp/pub/yum/4/i386/os/

    ```


    You can now yumify this repository with one of the following commands. Naturally,
    if you''re using Fedora Core 3 or later, you should install the creoepo and then
    yumify the repository with the second command:


    ```

    yum-arch /var/ftp/pub/yum/4/i386/os/*

    creepo /var/ftp/pub/yum/4/i386/os/*

    ```


    If you''re running Fedora Core 4 on your clients, you can now point the fedora.repo
    configuration file in the /etc/yum.repos.d directory to the installation. If you
    configured the FTP server described earlier, you should use the following baseurl
    command in that file:


    ```

    baseurl=ftp://yum.example.com/pub/yum/4/i386/os/

    ```


    # 7.4.2 Keeping Extras with yum


    One useful Fedora repository is known as Extras. It includes a number of packages
    not integral to the smooth running of the distribution. However, the Fedora Core
    4 Extras repository includes a number of packages of interest,'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'including Tripwire, the WindowMaker GUI, the BitTorrent download manager, and
    even the apt tools described in Chapter 5.


    Depending on how frequently you or users need Extras packages, you might want
    a local copy of that repository. It might not be easy to find this repository
    in the rsync mirrors. For example, the mirror listed for the University of Southern
    California (USC) is rsync://mirrors.usc.edu/fedora/. Sometimes, you''ll find duplicate
    copies of the same repository in different directories. For example, the following
    two commands return the list of packages from the Fedora Core 3 Extras repository:


    ```

    rsync://mirrors.usc.edu/fedora/fedora/3/i386/RPMS.extras/

    rsync://mirrors.usc.edu/fedora-core/extras/3/i386/

    ```


    In this case, the packages from the first repository are newer than I found in
    the second. Naturally, I want the newest version of all packages, so I synchronize
    with that repository.


    You can copy this repository to your own system. Based on the directories and
    rsync commands described earlier, the following command would synchronize your
    system with the rsync repository from USC:


    ```

    rsync -av --exclude debug \

    rsync://mirrors.usc.edu/fedora/fedora/3/i386/RPMS.extras* \

    /var/ftp/yum/3/i386/extras/

    ```


    You can review the output in Figure 7-3. As you can see, the information includes
    the amount of data transmitted across the network. In this case, I downloaded
    over a gigabyte of data. You do not want to repeat this process often.


    ![](img/e178bfcea0b6629d1234b59342d4d686_259_0.png)


    # Figure 7-3 A list of data downloaded is the first time you synchronize'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# 7.4.3 Adding Development Repositories


    Do not mirror a Development repository unless it is absolutely necessary. Development
    RPMs are, by definition, not stable. They are not suitable for production systems.
    Because the RPMs in this repository are updated frequently, sometimes daily, updates
    take up a lot of bandwidth.


    You or your users might want access to development repositories for different
    reasons. For example, your users might be interested in helping with Linux development.
    You might need to test the latest version of a package that is adding new features
    that you may need. You might want to test Fedora Linux on an architecture other
    than standard PC 32- or 64-bit CPUs.


    Development repositories are available through most of the mirrors associated
    with Fedora Linux. Unless your users need access to such packages frequently,
    it is best to leave such repositories on remote mirrors.


    Using the techniques described above, find the development/repository associated
    with your favorite mirror. For example, as shown in Figure 7-4, the following
    command returns a substantial list of architectures available through this repository:


    ```

    rsync --sync://mirrors.kernel.org/fedora/development/

    ```


    ![](img/e178bfcea0b6629d1234b59342d4d686_260_0.png)


    Figure 7-4 Many architectures associated with the Fedora Development repository'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Note


    Use the Development repository at your own risk. As defined by the README file
    associated with the repository, “DO NOT USE THESE RELEASES FOR ANY WORK WHERE
    YOU CARE ABOUT YOUR APPLICATION RUNNING, THE ACCURACY OF YOUR DATA, THE INTEGRITY
    OF YOUR NETWORK, OR ANY OTHER PURPOSE FOR WHICH A RESPONSIBLE HUMAN WOULD USE
    A COMPUTER.


    The available architectures are defined in Table 7-3.


    | Label | Description |

    | --- | --- |

    | i386 | Standard 32-bit PCs |

    | ia64 | Itanium 64-bit PCs |

    | ppc | 32-bit Power PC-based computers |

    | pc64 | 64-bit Power PC-based computers |

    | s390 | System 390 IBM computers; now known as zSeries |

    | s390x | System 390 IBM computers; now known as zSeries |

    | x86_64 | AMD 64-bit PCs |


    # 7.4.4 Other Distribution Repositories


    In some cases, you might want access to repositories available for other distributions.
    For example, if you''re running RHEL 4, you might want access to Fedora Core 3
    repositories for additional packages. As RHEL 4 is based on Fedora Core 3, many
    packages from this version of Fedora work without modifications.


    While you can mirror the repositories from other distributions, you should not
    do unless you use packages from those repositories frequently. Otherwise, you
    would be using a lot of space with packages that might not work with your system.
    In fact, any Fedora Core 3 packages that you install on RHEL 4 are not supported
    by Red Hat.


    If you''ve installed the yum and creo RPMs from Fedora Core 3 on RHEL 4, you can
    include the files of your choice in the /etc/yum.repos.d directory. However, you
    should not install the RPM that installs Core 3 repository files in this directory
    because it may change the version associated with your system and affect the way
    RHEL 4 system communicates with the Red Hat Network.


    If you do not have access to Fedora Core 3, you can get more information about
    the files in the /etc/yum.repos.d directory at http://fedaranews.org/tchung/yum-mirrorlist/.
    For details on how these files work (as well as those for Fedora Core 4), see
    Chapter 6.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# 7.4.5 Third-Party Repositories


    In some cases, you might want access to repositories available from third parties.
    We''ve covered several of the third-party repositories in Chapter 6. As you''ve
    read, they''re available for several distributions, especially those related to
    Red Hat Enterprise Linux and Fedora.


    Evaluation of RHEL copies are available as of this writing www.redhat.com/software/rhel/.
    The subscription is valid for 30 days, and it includes access and administration
    privileges on the Red Hat Network. You can read about some of the associated features
    in Chapter 2. After the subscription, you might be able to update your RHEL system
    using the repositories available from one of the RHEL rebuild distributions. Any
    packages you download and install from a third-party are not supported by Red
    Hat and are done at your own risk.


    Unfortunately, many third-party repositories discussed in this book do not have
    rsync servers available. You''ll have to use more conventional methods, such as
    FTP, to download the files associated with these repositories. Many of these mirrors
    are administered by small groups or even individuals. They might not be able to
    support enterprise-level package downloads. Therefore, if you use a third-party
    repository frequently, consider creating your own mirror of that.


    # 7.5 Maintaining THE REPOSITORY


    Patch management means that you have to maintain updates for all the computers
    on your network. For the repositories that you''ve created, that means you need
    to keep them up to date. Generally, that means configuring updates as a cron job,
    not only for clients, but between your local repository and the mirror of your
    choice. You''ve seen samples of the cron jobs you can use for clients in Chapter
    6. In this section, we''ll see how you can maintain a local repository.


    As repositories are kept up to date, sometimes headers can be corrupted. In that
    case, you delete the headers, whether from the `headers/` directory or from the
    compressed files in the `repos/` directory.


    # 7.5.1 Updating Packages


    Generally, you''ll want to update repositories on a daily (or nightly) basis.
    After a repository is created, the required downloads go down significantly. In
    most cases, you''ll be able to create your script in the `/etc/cron.daily` directory,
    which is automatically run on a daily basis, as determined by the schedule as
    in `/etc/crontab`.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'As you saw earlier, the following command can synchronize files on the noted
    local directory with a remote server at mirrors.kernel.org:


    ```

    rsync -av --exclude debug \\

    rsync://mirrors.kernel.org/fedora/core/updates/3/i386/* \

    /var/ftp/pub/yum/3/i386/updates/

    ```


    I''ve created the repo in my /etc/cron.daily directory and added the following
    commands:


    ```

    #!/bin/sh


    rsync -av --exclude debug \\

    rsync://mirrors.kernel.org/fedora/core/updates/3/i386/* \

    /var/ftp/pub/yum/3/i386/updates/

    ```


    # 7.5.2 Cleaning Header Information


    If there are problems with updates, check the applicable log file. It''s available
    in the yum.log file in the /var/log directory. In many cases, it can help to regenerate
    headers. In other words, you would take the following steps:


    +   1. Delete the headers/ or repodata/ subdirectory in your repository.

    2. Navigate to the directory with the repository.

    3. Regenerate the headers with the command that applies to your distribution:
    yum-arch or createrepo.


    # 7.6 CREATING AN ENTERPRISE REPOSITORY


    In Chapter 2, you learned about patch management on RHEL computers. The Red Hat
    Network Proxy Server is an effective way to cache RPMs for multiple RHEL systems.
    However, some administrators prefer standard tools, such as apt and yum.


    In this section, we''ll show how you can configure a yum-based repository from
    packages downloaded using the Red Hat Update Agent. If you want to update other
    RHEL clients from this repository, you may be required to have valid subscription
    for each of these clients, even if the packages are covered by an open source
    license.


    > Note

    Do not use this book to update RHEL systems unless they have a current, valid
    subscription.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# 7.6 Creating an Enterprise Repository


    A working RHEL repository requires a combination of the existing installation
    packages, as well as the updates available over the Red Hat Network. When combined,
    you''ll have a set of packages that includes all the dependencies you might need.


    The repository creation process on an RHEL system requires four basic steps:


    +   1. Download the packages required to update your system; make sure they aren''t
    deleted after they''re installed. Add the packages associated with the RHEL installation
    CDs.


    +   2. Use the yum-arch or createrepo commands to "yummify" the repository.


    +   3. Share the repository directory with an appropriate service, such as Apache,
    FTP, or NFS.


    +   4. Configure your clients to update from the new repository.


    Depending on the channels you want to mirror, this process may require 2GB or
    more of downloads. If you have only one or two RHEL systems, you may find this
    not to be worth the trouble. If you have several dozen RHEL systems, this might
    save you time and bandwidth.


    If you have a substantial number of RHEL systems, you should consider the Red
    Hat Network Proxy Server described in Chapter 2. However, if you prefer standard
    tools, such as yum, and have the authorized Red Hat subscriptions for the RHEL
    clients on your network, the approach taken in the following-sections is a viable
    alternative.


    > **Note**nIf you''re working with a RHEL rebuild distribution, it''s best if
    you use the patch management tool (yum or apt) configured for that distribution.
    Then you can get it up to date by synchronizing your repository with that available
    from the mirror


    # 7.6.1 Creating a RHEL Update Repository


    In Chapter 2, you learned to use the Red Hat Update Agent to update RHEL systems.
    With the right configuration, you can save the updated RPMs as in RHEL update
    repository. There are several basic steps in this process:


    +   1. First, log into the Red Hat Network and assign desired channels to the
    RHEL Update Repository system.


    +   2. Next, configure the Update Agent to keep downloaded packages.


    +   3. Configure the system where you''ll store packages as needed.


    +   4. Download desired RPMs into your repository.


    +   5. Add RPMs from the installation CDs.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# Assign Desired Channels from the Red Hat Network


    First, log into the Red Hat Network. Make sure your system is subscribed to the
    channels from which you want create your repository.


    As shown in Figure 7-5, you can configure your system with available channels,
    assuming that you have allowed subscriptions to that channel. Find your allowed
    subscriptions on the top bar, then click Channel Entitlements on the left pane.
    Assign the channels of your choice, and then click Channel Subscriptions. If you
    see the following error message, you may need additional subscriptions:


    The assignment would exceed your subscriptions in one or more channels


    ![](img/e178bfcea0b6629d1234b59342d4d686_265_0.png)


    # Figure 7-5 Assigning RHEL Channel Subscriptions


    To confirm your channel assignments, log into the computer that you intend to
    use as the repository. The following command should return the channels that you''ve
    assigned:


    ```

    up2date --showchannel

    ```


    Based on Figure 7-5, the channels that you should see are as follows:


    +   - rhel-i3886-as-4

    - rhel-i3886-as-4-extras

    - rhel-i3886-as-4-hwcert

    - rhel-i3886-as-4-sdk

    - rhn-tools-rhel-4-as-i3886'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# 7.6 Creating an Enterprise Repository


    # Configure the Agent Update to Keep Download RPMs


    Log into the computer that you intend to use as a repository. Updated RPMs are
    stored by default in the /var/spool/update2 directory. Make sure that updated
    RPMs are not deleted. To do so, run the up2date-config command. You''ll see the
    screen shown in Figure 7-6.


    # Note


    If you''re in the GUI, you might need to run the up2date-config --nox command
    to access the options in Figure 7-6.


    ```

    root@enterprise-la:~~

    keepAfterInstall      Yes

    useGPG               No

    headerCacheSize       40

    forcecache           No

    systemd              No/etc/sysconfig/rhn/system

    returnAfterSource     Yes

    enablePolls           No

    gpgcheck              No/etc/sysconfig/rhn/up2date-keying.gpg

    url                   #localhost

    addaddresses         Yes

    serverURL             https://xmlrpc.rhn.redhat.com/XMLRPC

    filesAsList           No

    versionOrder         No

    selCACert             No

    nohelpConfig         Yes

    desallowChange       ''#Reboot'',''useSSLCert'',''ForPackages'',''useSSLSe

    headerCount          10

    prekeyvar             ''*kernel''

    removeupdatelist      No

    up2date               No

    ```


    Enter number of item to edit <return to exit, q to quit without saving>:


    Figure 7-6 Configuring the Agent Update to keep RPMs


    Enter 17 (the option number may vary). This is associated with the keepAfterInstall
    variable. If set to yes, packages are downloaded remain available in /var/spool/update2
    after they''re installed. The next time you download packages from the Red Hat
    Network, packages will be stored in that directory, and won''t be deleted.


    # Note


    You may also use the option before keepAfterInstall to disable automatic updates
    to the up2date RPM, which is usually the default settings in /etc/sysconfig/rhn/up2date.
    If the up2date RPM is upgraded, you can restore your custom settings from the
    up2date.rpmnew file in the same directory, and if you disable updates of update,
    updates will be disabled the next time there''s a new version of update available.


    # Configure the Repository with Appropriate Partitions


    As you will see throughout this book, repositories require gigabytes of space.
    It often makes sense to configure repositories in separate partitions. For the
    purpose of this repository, I''ve configured /var/spool/update2 on a new partition
    or logical volume.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'For details on how you can configure a new partition, to refer any basic book
    on Linux administration, including Linux Administration Handbook by Evi Nemeth,
    Garth Snyder, and Trent Hein (Upper Saddle River, NJ: Prentice Hall, 2002) or
    Mastering Red Hat Enterprise Linux 3 by Michael Jang (Alameda, CA: Sytex, 2004).
    If you want more information about these commands, refer to that book. If you
    have free space on your partition, you can assign it to /var/spool/up2date. One
    method would use the following steps, which assume you''ve added a new hard drive.
    The steps may vary depending on the hard drive and whether there are existing
    partitions on your drive.


    +   1. Open the hard drive of your choice for editing. For example, assume you''ve
    added a new hard drive. If this drive is the first SCSI or SATA hard drive on
    your system, run the fdisk /dev/sda command.

    2. Assign a new partition with the n command to assign a new primary partition.
    Assign partition number 1, start with the first cylinder, and assign the room
    you need. You can do so with a +10GB entry when prompted for the last cylinder.
    Press w to write the new partition table to the hard drive.

    3. Format the drive. To format it with the default ext3 file system, run the following:


    ```

    mkfs -t ext3 /dev/sda

    ```


    +   4. Mount the /var/spool/up2date directory on that drive.


    ```

    mount /dev/sda /var/spool/up2date

    ```


    +   5. Make sure the drive is mounted the next time you reboot your computer.
    Add the following line to your /etc/fstab configuration file:


    ```

    /dev/sda /var/spool/up2date ext3 defaults 1 2

    ```


    # Desired RPMs from the Repository


    Now you can download the desired RPMs from the Red Hat Network. You can download
    the updates, but because of dependencies, these might not be enough. Therefore,
    download all available RPMs from the Red Hat Network channels to which you subscribe.
    This is a multi-step process. With the following command (which specifies a RHEL
    4 Workstation channel), you can download the RPMs from your desired channel not
    currently installed on your system. Shortly, you''ll add RPMs from your installation
    CDs.


    ```

    update2 -d --installall --channel=rhel-i386-ws-4

    ```'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# 7.6 Creating an Enterprise Repository


    There is no separate updates repository on the Red Hat Network. New packages are
    incorporated into existing channels. Therefore, this command downloads all packages
    you do not have installed, including any updated RPMs.


    Naturally, because there are around 2GB of data on RHEL installation RPMs, the
    download may be extensive. Depending on the speed of your connection, you may
    need to wait several hours for downloads. One example is shown in Figure 7-7.


