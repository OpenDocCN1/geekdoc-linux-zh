  md: 'One more command; to make the files in the /var/www/html/pub directory accessible
    to Web clients, you''ll need to change ownership of these files to the apache
    server. It''s easy to do with the following command:


    ```

    chown apache.apache /var/www/html/pub/*

    ```


    In the next section, we''ll install this file on a client.


    > Note

    Alternatively, you can copy and then install the RPM that you created earlier
    with the rhn-ssl-tool --genca <lots of stuff> command. In this case, it''s the
    rhn-org-trusted-ssl-cert-1.0-1.noarch.rpm package; if you install this RPM on
    any client, it will automatically install RHN-ORG-TRUSTED-SSL-CERT in the correct
    directory.


    # 2.2.2 Configuring the Proxy Client


    Now you can use RHEL 2.1, 3, and 4 clients for your Red Hat Network Proxy Server
    computer. The process is straightforward. You''ll need to configure the update
    agent to take updates from the Proxy Server (instead of the Red Hat Network).
    Then, you''ll need the cert keys created during the Proxy Server installation
    process.


    If you have a substantial number of RHEL clients, you can automate this process
    with scripts. Finally, you can make sure RHEL clients are updated on a regular
    basis, either through the Red Hat Network or with a regular cron job.


    # Copying the Certificate Key


    Before start configuring the Update Agent, you''ll need to copy the right client
    cert key. It''s embedded in the RHN-ORG-TRUSTED-SSL-CERT file described earlier.


    If you''ve followed the instructions described earlier, this file is already available
    through the Web server on the Proxy Server computer. You need to download the
    RHN-ORG-TRUSTED-SSL-CERT file. You can do so with a graphical browser. Navigate
    to this computer with the name or even the IP address of that computer, and you''ll
    see a simple home page, as shown in Figure 2-11.'
