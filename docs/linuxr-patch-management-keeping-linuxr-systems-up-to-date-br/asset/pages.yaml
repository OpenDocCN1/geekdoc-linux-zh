- pgno: 222
  md: 'Naturally, you should consider adding this command to any automated update
    script that you configure for your computer.


    If you want to download and install upgrades for every package listed by yum check-update
    or the yum list updates commands, the following command is for you:


    ```

    yum update

    ```


    It''s possible that this might upgrade packages before you''re ready. As suggested
    earlier, an upgrade to the Firefox Web browser may cause problems with plugins.
    If you configured third-party repositories, it''s possible that the list of packages
    that you don''t want upgraded may increase. You can specify the packages you want
    to update. For example, if you''re ready to upgrade the Firefox Web browser, you
    could run the following command:


    ```

    yum install firefox

    ```


    Alternatively, you could just use the install option. If the Firefox browser is
    already installed, the yum command looks for a later version and, if available,
    the package is downloaded and used to upgrade your system:


    ```

    yum install firefox

    ```


    Alternatively, if you want to upgrade every package in your yum-updates list except
    Firefox, the --exclude switch can help.


    However, if you haven''t yet installed the Firefox browser, the yum switch will
    not work. You''ll have to install Firefox.


    # 6.3.8 Deletions by yum


    If you want to remove a package, the yum command can also take care of dependencies.
    For example, if you remove the OpenOffice.org suite, yum can help you remove associated
    dependent libraries. The following command causes the yum system to check dependencies
    and remove other associated packages, as shown in Figure 6-6:


    ```

    yum remove

    ```'
