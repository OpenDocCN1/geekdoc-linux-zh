- pgno: 70
  md: '# Note


    > Don''t run a format command as mkfs or fdformat on an active partition. It can
    destroy data on that partition and possibly more. While distributions, such as
    the latest versions of Fedora Core, include safety settings that may warn you
    against formatting a partition, the risk is still there.


    +   3. When the format is complete, make sure journaling is enabled. Because the
    default Fedora ext3 file system is a journaling file system, you may want to make
    journaling is configured on the new partition:


    ```

    tune2fs -j /dev/hdb1

    ```


    +   4. Now you can mount the new partition on the directory of your choice. For
    now, you''ll want to mount it on a temporary directory; I often create /mnt/test
    for this purpose. To mount the newly formatted /dev/hdb1 partition, run the following
    command:


    ```

    mount /dev/hdb1 /mnt/test

    ```


    +   5. Now you can copy the files from the directory that you want to mount on
    the newly formatted partition. For example, if you want to create a repository
    on a local FTP server, copy the files from the local FTP source directory, /var/ftp
    to /mnt/test. The cp -ar command copies any subdirectories recursively.


    ```

    cp -ar /var/ftp/* /mnt/test

    ```


    +   6. Document the desired mount in your partition table configuration file,
    /etc/fstab. Open it in the text editor of your choice. Based on the information
    here, you would add the following line:


    ```

    /dev/hdb1 /var/ftp ext3 defaults 1 2

    ```


    +   7. Save your changes and reboot.

    8. The next time Linux boots, it should mount the /var/ftp directory on /dev/hdb1.
    You can verify this with the mount command. You can now create a Fedora repository
    on this partition, with confidence that you save here won''t be crowded by other
    services or files that users might save to this computer.'
