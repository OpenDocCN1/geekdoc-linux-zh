  md: 'The first three letters of the description can tell you a lot. As shown in
    Figure 4-2, the letters associated with the discover package is idA. The first
    letter is the current state. The second letter, if present, specifies the action
    that Aptitude will take. The third letter, A, is shown when the package was automatically
    installed, as to satisfy a dependency. The options for the first letter are shown
    in Table 4-3.


    # Table 4-3 Aptitude package state labels


    | Label | Description |

    |---|---|

    | I | The package is installed; all dependencies are satisfied |

    | B | The package is installed with broken dependencies |

    | c | The package was removed; configuration files are still installed |

    | C | Package installation was interrupted during configuration; reinstallation
    may be required |

    | H | Package is partially installed |

    | p | The package and configuration files are not present |

    | v | This is a virtual package |


    The options for the second letter, the action flag, are shown in Table 4-4.


    # Table 4-4 Aptitude package action labels


    | Label | Description |

    |---|---|

    | i | The package will be installed |

    | B | The package is broken; dependencies cannot be satisfied |

    | d | The package was deleted; configuration files will remain |

    | F | No upgrades of this package will be allowed |

    | h | The package will not be upgraded until this hold is canceled |

    | p | The package and configuration files will be deleted |

    | u | The package will be upgraded |


    If you have problems getting back to the original design, press q. If you want
    to study the options available through the menu bar, press F10 and your cursor.
    As you can see, there are a number of shortcut keys. Some are shown in Figure
    4-1; they include F10, q, u, and g. When you press ?, you can go through a number
    of shortcut commands that can help you navigate or specify how to manage the packages
    of your choice.


    # **Note**


    You could use your cursor and mouse if you have Aptitude open in the GUI. However,
    you may need to manage systems remotely and may not have access to a GUI, so you
    need to know how to use the Aptitude switches and command options.'
