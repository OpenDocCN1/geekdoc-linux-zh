- pgno: 22
  md: '# # Patch Management Systems


    It''s important to keep Linux systems up to date. Updates can help you keep your
    systems secure, help you fix problems, and help you incorporate the newest features.
    Updates in the world of computers are also known as patches.


    In this chapter, we will examine the basics of patch management, how you can apply
    patches to your computer, and where you should get patches for several Linux distributions.
    Patch management methods vary by distribution. If you''re paying for support from
    Red Hat or SUSE, you''re paying in part for support through their patch management
    systems. If you''re using another Linux distribution, there are solid freely available
    alternatives.


    When you administer a network, you''re responsible for a number of computers.
    You could configure each of these computers to get their updates automatically,
    but that might overload your network and connection to the Internet. In later
    chapters, we will show you how to configure a patch management repository for
    your network.


    # ## 1.1 BASIC PATCH CONCEPTS


    In the world of Linux, patches are more than just something you might apply to
    the source code of a kernel. They include the updates that can help you keep your
    systems secure, error-free, and updated with the latest features.


    Before we continue, it''s important to define the concept of a patch and note
    the variety of sources from where you can download patches for your computer systems.


    # ### 1.1.1 What Is a Patch?


    A patch is an update. It incorporates changes in source code. Patches are normally
    applied to specific software components, such as the kernel, or a service, such
    as vsFTP. Patches may fix bugs, address security issues, or incorporate'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'new features. As an administrator, you''re responsible for testing the new
    software, making sure that it addresses any problems before your users see them
    on their systems.


    In general, when you patch a program, service, or system, you''ll be upgrading
    a package. Some Linux distributions can be configured to warn you when patches
    for installed software are available. We''ll show you how to configure- this in
    later chapters.


    # Security Fixes


    The most important patches address security problems. This is where the Linux
    development model shines. Developers start working on a patch almost immediately
    after a security issue is revealed. The process is public, which reassures those
    concerned about the quality of the patch. As a result, security patches are often
    available in hours.


    If you''re administering a Linux computer, you need to keep up to date on the
    latest security issues. If you''ve paid for a subscription to a Red Hat or SUSE,
    you can get email warnings about security problems with your installed services.
    Other distributions make alerts available by email or through their mailing lists.
    Problems are often announced on major Linux news sites, such as www.linuxoday.com.


    # Service Upgrades


    Users will demand upgrades. Linux developers will respond. I suspect that after
    someone finds a way to use Linux to toast bread, another developer will start
    working on how to upgrade Linux into a bread maker.


    More practically, if someone developed a way to make Samba on Linux emulate Microsoft
    Active Directory domain controller (which is in for Samba 4.0, per http://www.samba.org/samba/dev/roadmap-4.0.html),
    there would be a lot of demand for that service. You would likely find yourself
    downloading that package on a substantial number of computers.


    In general, programs that are released with new features get a lot of demand.
    Unfortunately, bugs are most likely to be found when a program is released with
    new features.


    Just remember, the developers of a service are usually different from the developers
    of a distribution. If you have a problem with a service, the fault may not be
    with the developers at Red Hat, SUSE, Debian, and so on.


    # Bug Fixes


    If software were perfect, there would not be so much work to do computing, especially
    at Microsoft. Fortunately, the same infrastructure leads to quick security fixes
    also leads to quick bug fixes for open source Linux programs.


    When users report problems, they''re likely to demand quick solutions. The previous
    performance of Linux developers in finding quick solutions leads to increased
    expectations for quick bug fixes. As an administrator, you''ll be expected to
    roll out patches quickly, reliably, and securely.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 1.1 Basic Patch Concepts


    # Kernel Patches


    Patches to the Linux kernel are of a special kind. They include the changes in
    source code between consecutive versions of a kernel. For example, if you want
    to upgrade from kernel version 2.6.15 to 2.6.16, you should apply patch-2.6.16
    to your current kernel.


    There are special requirements associated with kernel patches. Generally, they
    work only with the kernel as released through kernel.org. The people behind some
    distributions build their kernels with different features. Linux kernel patches
    may lead to conflicts, lost features, or even kernel panic.


    Linux kernel patches require that you adjust dozens of settings and then compile
    that kernel in binary format. This process can take hours, and is therefore something
    that you may not want to repeat. Many Linux distributions include preconfigured
    kernels in their repositories that you can use to upgrade your systems without
    having to compile them.


    > Note

    Debian-based Linux distributions make it easy for you to set up a binary kernel
    from recompiled code, which you can then use to upgrade other Debian-based systems
    on your network.


    # Kernel Upgrades


    Because the kernel is so important to the operating system, you should not take
    chances. It''s best to upgrade Linux kernels by installing them side-by-side with
    the current working Linux kernel. If there is a problem, you can still boot that
    system with the old kernel.


    If your users add hardware, modify drivers, or otherwise experiment with the guts
    of Linux, there''s a chance a new kernel that works on your test equipment may
    not work on the computers of your network.


    In recognition, most upgrade services treat kernel-* packages differently. Services
    such as Red Hat''s update and SUSE''s YaST Online Update do not install upgraded
    kernels, unless you authorize the installation.


    # Risks


    Whenever you install a patch, there are risks. For example, many kernel patches
    may lead to situations where you''re unable to boot Linux.


    If you run into a situation where a patch leads to a crash, you may be able to
    restore your system from a backup. If you are unable to boot your system for this
    purpose, you may need to use a "rescue mode" for your distribution. Rescue modes
    are available using the first installation CD associated with Red Hat/Fedora and
    SUSE.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Alternatively, you may be able to use a CD/DVD-based distribution, such as
    Knopix. When you boot from a Knoppix CD, you can start a full-featured Linux distribution.
    You can then connect to backup media and even to restore your pre-patch configuration.
    For more information, see www.knoppix.org.


    # 1.1.2 Patch Sources


    There are several sources for patches and upgrades. The best source is generally
    the upgrade repository preconfigured for your distribution. However, there is
    often a delay when distribution developers process updates from other sources,
    such as the kernel, or services, such as the Apache Web server.


    If you''re in a hurry, you can download packages from the Web site directly with
    your service. While not built for your distribution, it can help you get new features
    into service as quickly as possible.


    Sometimes the developers of a distribution don''t bother with every service or
    upgrade. In some cases, third parties, such as developers of related distributions
    or even independent developers, configure packages that you can use.


    # The Native Linux Distribution


    When you''re upgrading a service, it''s usually best to upgrade the package built
    by the developers of your distribution. That is the most reliable way to be sure
    that the package you install copies files into expected locations. It also ensures
    that the package you install becomes part of that computer''s package database.


    For example, if you want new features associated with a new version of vsFTP on
    Red Hat Enterprise Linux 3, you''ll want to use the associated vsFTP RPM package
    built by Red Hat. There are several advantages:


    +   Files with the package are installed in locations expected by other programs
    built for that distribution.


    +   Dependencies for a service may vary between distributions.


    +   Upgrades built for a distribution are included in the package database for
    that system.


    +   Upgrades can be installed with the native update systems for that distribution.


    However, there may be a delay before the employees or volunteers associated with
    a distribution are able to build and customize a new or updated service.


    # Service Developers


    If absolutely need the latest update as soon as possible, you can install the
    package as released by the developer of that service. This may be appropriate'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 1.1 Basic Patch Concepts


    if you''re testing new features before distributing the package to other users
    on your network or if you absolutely need the latest security patch.


    If you use a package released by a service developer, you may be able to use the
    Red Hat Package Manager (RPM) or the Debian Packaging System (DEB) package as
    built by those developers for your distribution. Sometimes the developers of a
    service are well-scoled in how to build a package for a distribution, such as
    Red Hat or Debian. Otherwise, you''ll have to download the package in a format
    such as a tarball and install it.


    Unless the developers of a service have specifically built an RPM or DEB package
    for your distribution, the disadvantages to installing such service include


    +   - Additional work is required to process and install the service.


    +   - Files may be installed in directories not consistent with your distribution.


    +   - The service is not included in your distribution''s database of packages.


    To overcome any resulting problems, you can install the service as package for
    your distribution as soon as it is available.


    # Note


    > A "tarball" is an archive, usually compressed, typically in tar.gz or tar.bz2
    format. For more information on how to decompress a tarball, see the man page
    for the tar command. When decompressed, installation instructions are normally
    available in an included text file, such as README or INSTALL.


    # Third Parties


    There are two kinds of third-party packages available. One is packaged for a different
    distribution that uses the same package manager. Another is configured by an independent
    developer or group who may or not have customized a package for your distribution.


    Linux programs are generally processed into one of two major package formats:
    the RPM and DEB. These formats are used by almost the major Linux distributions.
    Some examples include


    +   - RPM: Red Hat, Fedora, SUSE, Mandriva, Turbolin, Yellow Dot


    +   - DEB: Debian, Knoppix, Ubuntu, Xandros


    For example, if a package has been created in RPM format only for Mandrake, you
    can use the rpm command to install package on other RPM-based distributions, such
    as Red Hat and SUSE. However, the risks are similar to installing an uncustomized
    package released from a service developer.'
  merge: -1
  img_proc: true
