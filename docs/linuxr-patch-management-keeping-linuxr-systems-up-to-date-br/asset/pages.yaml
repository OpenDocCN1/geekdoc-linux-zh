    # 1.1.3 Patch Testing


    Critical to the concept of patch management is testing. When applied unfortunately,
    patches can override working drivers, break existing software, and change the
    links to key files. They may introduce new features that override services on
    which you rely.


    Best practices suggest that you test every patch before installing it on production
    computers. Ideally, you''ll have one or more extra computers available for this
    purpose.


    # Definitions and Assumptions


    In this book, I define production and test computers as follows:


    +   - A production computer is a desktop or server system, configured with the
    services and applications that are actually used to run your business.


    +   - A test computer is a desktop or server system that should be used exclusively
    for testing new software. Ideally, test computers are also configured with the
    same services and applications that you have on production server and desktop
    computers. They should be segregated from production computers with a firewall.


    Test computers may be a luxury unavailable to administrators of smaller networks.
    If you''re in that position, you should at least test each patch on your own administrative
    system. Every problem you see on your own system is less problem than you hear
    about each of your users.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# 1.1 Basic Patch Concepts


    There is no single method for patch testing. Testing methods are as diverse as
    available applications and services. I divided the testing process into three
    categories: installation, applications, and services. In any case, always follow
    this maxim: Do not install a patch on a production computer before testing.


    # Testing Patch Instalations


    The first step in testing a patch is installation. When you use the techniques
    described in this book, there should be no unmet dependencies. dependencies often
    require you to install more patches. Therefore, when you test a patch installation,
    you need to know what you are installing to know the scope of the patch.


    So, in summary, when checking the installation of a patch on a test computer,
    check for the following:


    +   - checking a patch, make sure all package dependencies are satisfied. List
    the packages required to satisfy those dependencies.


    +   - If there are unexpected packages, include those in your testing.


    There are general guidelines that vary with what you''re installing. For example,
    if you''re installing a new kernel, test everything on a production-level system.
    If you''re upgrading a stand-alone application, make sure that your upgrade won''t
    break features on which your users depend. If you''re upgrading a service, make
    sure that your configuration file works as intended. If you''re upgrading dependent
    libraries, make sure they don''t affect the application or services which depend
    on them.


    If you have problems with a patch, check the troubleshooting steps described at
    the end of this section.


    # Testing a New Kernel


    The kernel is the most important patch to test. As the core of the Linux operating
    system, an an upgraded kernel can affect everything. There are several principles
    that you should follow when testing a new kernel:


    +   - Make sure you have a reason to change kernels. Check the release notes for
    that kernel. You may not need the patch. For example, if a new kernel incorporates
    a driver for network cards that you don''t use, there is no reason for you to
    go through all this trouble.


    +   - Never upgrade to a new kernel—in a way, that overwrites your existing kernel.
    Do not delete the existing kernel until you have finished testing the new kernel.


    Most distributions support side-by-side installations of new and existing kernels.
    In fact, when you install (and don''t upgrade) an existing kernel using a customized
    binary package, Red Hat/Fedora, SUSE, and Debian all "dual-boot" the new and existing
    kernels.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Test how the new kernel manages your boot process. Watch as it detects your
    hardware and starts your services. If there are problems or even unusual delays,
    the new kernel may have a problem with the associated hardware or service.


    Check the log files associated with the boot process. Pay particular attention
    to services that don''t start or hardware that isn''t detected.


    Test the new kernel on your system, based on the release notes. Make sure the
    new kernel works as intended for your computers.


    Test your services and applications under the new kernel. Pay attention to any
    changes in behavior. Document these changes.


    When you''re ready to upgrade the kernel on production computers, tell your users
    what they can expect.


    If you identify a problem with the kernel and absolutely need the upgrade, you
    may need to recompile the kernel yourself. For more information, see the Kernel
    Rebuild Guide, available from www.tld.org. After you rebuild, you can install
    and start the testing process.


    # Testing Application Patches


    Many applications are patched frequently. Application patches incorporate rate
    security improvements, additional features, bug fixes, or more. When you see an
    application patch, don''t just blindly upgrade. Consider the following:


    +   Read the release notes. Evaluate the reason for the patch. Does it add any
    features that you need? Does it address any bugs that annoy you about your application?
    Does it improve your security in a way that applies to your computers or your
    network?


    +   If there are configuration files associated with an application, back them
    up. For example, if a user customizes the look and feel of GIMP, a patch might
    overwrite some of the settings in user''s .gimp-config configuration directory.


    +   You may want to use configuration files from users who use the application
    frequently. Tell them that you''re considering an upgrade. They can help identify
    key features that you want to preserve.


    +   If you decide that you need the application patch, test it carefully. Download
    and install it on your test system. Make a list of downloaded packages, especially
    if there are dependencies.


    +   Test the patch on your system. First, based on the release notes, make sure
    the patch works as intended.


    +   Identify any changes made to applicable configuration files, and assess their
    impact on your users. Make notes.'
  merge: -1
  img_proc: true
