- pgno: 85
  md: '5. After the rhn-check command is complete, return to the Red Hat Network.
    Refresh your browser from Figure 2-10. The previous steps that were queued should
    now be listed as Completed.


    6. Restart your Proxy Server with the following command:


    ```

    service rhn-proxy restart

    ```


    7. Verify that your Red Hat Network Proxy Server is working; you should see output
    similar to the following:


    ```

    rhn-proxy status

    squid (pid 5515 5513)

    httpd (pid 5551 5550 5549 5548 5547 5546 5545 5532) is running...

    jabber router (pid 5580) is running...

    ```


    Your Red Hat Proxy Server system is now ready for clients. If you''ve configured
    an SSL Proxy Server, you''ll need to create cert keys for the Proxy Server and
    Web clients.


    # Creating the Certificate Keys


    To secure your Update Agent system, create certificates for your Proxy Server
    and associated clients. This requires you to return to the Proxy Server and use
    the rhn-ssl-tool command, with several different options. Don''t run any of these
    commands until you understand the whole process as I describe in this section.


    The rhn-ssl-tool command is part of the rhn-certs-tools package that you installed
    earlier in this process. There are two major commands. The first allows you to
    create a Certificate Authority (CA) for your network:


    ```

    rhn-ssl-tool --gen-ca [followed by many options]

    ```


    The second option creates Web server CA key sets, which is required for your Proxy
    Server:


    ```

    rhn-ssl-tool --gen-server [followed by many options]

    ```


    Let''s examine these options one at a time. To generate a proper CA for your network,
    you need to specify appropriate directories for the certificates, using secure
    passwords that reflect basic parameters for your organization. You can review
    some of the switches (which come after --gen-ca) in Table 2-2. You don''t need
    to use all the switches shown; however, the more unique the CA you create.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# 2.2 Configuring a Red Hat Network Proxy


    Table 2-2 rhn-ssl-tool--gen-ca configuration options


    | Option | Description |

    | --- | --- |

    | --gen-ca | Generates a Certificate Authority key pair and more for your network,
    also based on options which follow |

    | -f | Forces the creation of a new CA key pair |

    | -d=DIR | Specifies the directory where CA files are built |

    | --ca-key=FILE | Specifies the filename for the private CA key; not required--by
    default, the command creates a RHN-ORG-PRIVATE-SSL key file |

    | --ca-cert=FILE | Specifies the filename for the public CA key; not required--by
    default, the command creates a RHN-ORG-TRUSTED-SSL key file |

    | --set-country=CODE | Sets a country |

    | --set-state=CODE | Sets a code for your state or province |

    | --set-city=CODE | Sets a code for your city or town |

    | --set-org=ORG | Defines the name of your organization—your choice |

    | --set-org-unit=UNIT | Defines a group within your organization—your choice |


    For a complete list of switches associated with the --gen-ca option, run the rhn-ssl-tool
    --gen-ca --help command. I don''t include switches such as --password=PASSWORD,
    because there is no reason to help "shoulder surfer" by typing your CA password
    in clear text. The rhn-ssl-tool command prompts you for the password if you do
    not use the --password switch.

    On Proxy Server, run the following command:


    ```

    rhn-ssl-tool --gen-ca --dir=/root/ssl-build --set-state=Somewhere Else --set-city=Nice
    One --set-org=Mommabears --set-org-unit="home office"

    ```


    This command first prompts for a password. Remember this. You''ll have to use
    the same password shortly. It then generates a private and public CA key in the
    /root/ssl-build directory, with messages related to your location and organization.
    My use of this command leads to the following output:


    ```

    With distinguishing variables:

    --set-country = "us"

    --set-state = "Somewhere Else"

    --set-city = "Nice One"

    --set-org = "Mommabears"

    --set-org-unit = "home office"

    --set-common-name = ""

    --set-email = """

    ```'
