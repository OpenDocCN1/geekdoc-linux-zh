    If the right distribution or architecture is not available on your preferred mirror,
    you''ll need to select and configure a different mirror.


    # A Basic rsync Sync | Debian makes a basic rsync script available at www.debian.org/mirror/ftpmirror.
    The script helps you create a mirror for the distribution and architecture of
    your choice. Debian recommends that you use the rsync command with at least the
    following switches:


    +   - --recursive--Downloads and synchronizes all files from subdirectories.

    - --times--Preserves the date and time associated with each file.

    - --links--Recreates any existing symlinks from the mirror.

    - --hard-links--Preserves any hard links from the mirror.

    - --delete--Removes any files on your computer that do not exist on the target
    mirror. (If you have sufficient space for multiple versions of a package, use
    --delete-after.)


    If you don''t have all with the Debian architectures on your network, you might
    not want to download every distribution from your preferred Debian mirror. The
    following --exclude switches makes it possible to limit your download. --exclude
    exclude noted directories and packages with noted extensions. Be careful. While
    a Debian mirror is supposed to use directories, such as binary-i386, your selected
    mirror may not use the same directories. If in doubt, search around the rsync
    commands described in Chapter 3.


    ```

    --exclude binary-alpha/ --exclude *alpha.deb

    --exclude binary-arm/ --exclude *arm.deb

    --exclude binary-hppa/ --exclude *hppa.deb

    --exclude binary-i386/ --exclude *i386.deb

    --exclude binary-ia64/ --exclude *ia64.deb

    --exclude binary-m68k/ --exclude *m68k.deb

    --exclude binary-mips/ --exclude *mips.deb

    ```'
