    This package contains the Multiband Atheros Driver for WiFi, A linux

    device driver for 802.11a/b/g universal NIC cards - either Cardus,

    PCI or MiniPCI - that uses Atheros chip (ar5210, ar5211, ar5212).

    ```


    # 6.3.5 Listing Available Packages


    If you want to create a package database, the yum list command can help. You

    limit the scope of any of the commands in this section by adding a package

    name to the end of the command. In any case, the following command creates

    a list of all installed and available packages:


    ```

    yum list

    ```'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'This is equivalent to yum list all. If you want to limit the search to those
    packages that correspond to a certain name, you can specify it. For example, the
    following command lists the installed version of yum, plus an alternative from
    the at-stable repository:


    ```

    yum list

    ```


    The command yields output similar to this:


    | Installed Packages | installed |

    |---|---||

    | yum.noarch | 2.2.0-1.centos4.2 | |

    | Available Packages | |

    | yum.i1386 | 2.2.1-55.el3.999.at | at-stable |


    There are several additional options associated with the yum list command. You
    can limit to installed packages with the following command:


    ```

    yum list installed

    ```


    Alternatively, you can limit the search to those packages that you can install
    from configured repositories with the following command:


    ```

    yum list available

    ```


    As suggested earlier, the following command, equivalent to yum check-updates,
    lists those packages that may serve as upgrades to those you have installed.


    ```

    yum list updates

    ```


    If you''ve installed packages from other than your configured yum repositories,
    your RPM database could be affected. You might need to configure a different repository.
    You can find a list of installed packages from other sources with the following
    command:


    ```

    yum list extras

    ```


    If you have a package that might be made obsolete by one you can install from
    a configured repository, you can identify them with the following command:


    ```

    yum list obsolete

    ```'
