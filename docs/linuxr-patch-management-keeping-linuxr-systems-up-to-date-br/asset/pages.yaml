  md: '# 4.1 Fundamentals of apt


    +   * Remove obsolete package files after downloading new package lists

    Disabled by default. When new package lists are installed, they are compared to
    existing packages. If there are some which are now obsolete, they are deleted.


    +   * URL to download changelogs

    By default, changogs are downloaded from the mirror sites specified in your `sources.list`
    file.


    +   * Display a preview of what will be done before doing it

    Youll see displays of what aptitude will remove, upgrade, and install, before
    anything is done.


    +   * Forget which packages are “new” whenever the package lists are updated

    Disabled by default. New packages will include those currently on your list, and
    those revealed by your next update.


    +   * Forget which packages are “new” whenever the package lists are installed
    or removed

    Disabled by default. New packages will include those currently on your list, and
    those revealed by your next package list installation or removal.


    +   * When attempting to perform a privileged action as a non-root user

    Except for those actions solely get information, most actions related to the apt
    and aptitude commands require root access.


    +   * File to log actions into

    By default, the aptitude log file is `/var/log/aptitude`.


    # Patch Management with Aptitude


    Now that you''ve learned about Aptitude, you can use it to keep your system up
    to date. Before you start, you''ll want an up-to-date database. To do so, run
    the Actions -> Update menu or press u. You''re prompted for the root password
    messages as your system connects to the repositories listed in your `/etc/apt/sources.list`.
    If there are errors or problems with a connection, you may need to repeat the
    process. With a little luck, you won''t have the errors second time.


    Before you let aptitude do thing, you should review what it will do. Make sure
    that the Miscellaneous options enable Aptitude to “Display a preview of what will
    be done doing it.” As described in the previous section, this should be supported
    by the default configuration. Then, when you press g to run the `Download/Install/Remove
    Pkgs` command, it will open a list similar to that shown in Figure 4-4. You can
    now review aptitude will do to your system, in a variety of categories:'
