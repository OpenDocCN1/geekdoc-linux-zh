    and make parallel changes to the other channels listed in this file.


    # 2.3.2 Lineox


    Of all the available RHEL rebuild distributions, I''ve tried Lineox as a contrast
    to CentOS. I do not claim that Lineox or CentOS are better in any quality or compared
    to other RHEL rebuilds. However, Lineox provides a nice contrast. They are based
    in Europe, offer paid levels of support, and configure their updates using apt.


    One unique feature of Lineox is their paid support for updates and local patch
    management mirrors. Their patch management system is configured to synchronize
    your repositories on a daily basis. Lineox actually acts the Red Hat Update Agent
    from its Lineox 4 rebuild distribution.


    We''ll describe the apt patch management process in Chapters 4 and 5. However,
    you can configure your /etc/apt/sources.list file using basic methods described
    in Chapter 1 for Debian Linux. But remember, distributions related to Red Hat
    use a different package format, the RPM. So the default commands in the /etc/apt/sources.list
    file include the rpm command, including


    ```

    rpm http://www.raimokoski.com/ pub/lineox/4.0/updates/i386 updates

    rpm-src http://www.raimokoski.com/ pub/lineox/4.0/updates/i386 updates

    ```


    You might not want to use the default URL unless you''re located near the home
    of Lineox, which is Finland. Lineox makes other options available in various files
    in the /etc/apt/sources.list.d directory.


    # 2.3.3 Other Rebuilds


    As suggested in Chapter 1, there is a wide variety of rebuild distributions created
    from RHEL source code. There are almost as many variations on patch management
    as there are rebuilds. But almost invariably rely in some way either on the yum
    or apt commands. And you can learn more about these commands and associated repositories
    in the second half of this book.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# 2.4 SUMMARY


    Patch management is an important tool for keeping Red Hat and related clients
    up to date. There are a variety of related tools associated with Red Hat patch
    management updates.


    In this chapter, you learned basic patch management techniques on clients that
    are running Red Hat and related distributions. You can create your own Fedora
    repositories; however, their frequent updates and new releases make patch management
    of Fedora clients more problematic. RHEL client subscriptions support patch management
    through a Red Hat Network account. You can even create your own local Proxy Server
    repository of patches, which minimizes the load on your network''s Internet connection
    and speeds updates to most RHEL clients on your LAN. Finally, you learned a bit
    how patch management varies on rebuild distributions that use RHEL source code.


    In the next chapter, you''ll learn about SUSE''s patch management systems and
    how they can be adapted for SUSE and RHEL clients.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# SUSE’s Update Systems and rsync Mirrors


    Just as Red Hat supports patch management systems suitable for one and many computers
    on a network, SUSE supports similar systems. We briefly explored how you can keep
    individual SUSE Linux Professional and Linux Enterprise Server systems up to date
    using YaST in Chapter 1, “Patch Management Systems." In this chapter, we''ll explore
    the process in more detail.


    > Tip

    If you want to know rsync, read this chapter, particularly section 3.2.2. The
    lessons here apply to copying a mirror from any rsync-capable update server.


    As each version of SUSE Linux Professional becomes publicly available, you can
    update this distribution using public mirrors. While SUSE Linux Enterprise Server
    is not publicly available (except for limited evaluation copies), you can download
    updates with an authorized subscription. After you''ve synchronized your updates,
    you can configure local updates from other SUSE systems on your LAN.


    Novell has incorporated Linux update capabilities into its Zenworks Linux Management
    (ZLM) service. It’s more flexible than one think. You can install ZLM on SUSE
    Linux Enterprise Server or Red Hat Enterprise Linux. Unfortunately, a full description
    of how to use ZLM is well beyond the scope of this book.


    > Note

    SUSE Linux Enterprise Server is Novell’s subscription enterprise level distribution.
    SUSE Linux Professional Workstation is SUSE’s workstation offering through version
    9.3. Newer versions of SUSE for the workstation are known simply as SUSE Linux.'
  merge: -1
  img_proc: true
