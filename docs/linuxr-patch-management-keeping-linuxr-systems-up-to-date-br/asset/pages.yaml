- pgno: 155
  md: '# Keeping Synaptic Updated


    As with aptitude, it''s important to keep the apt configuration database up to
    date. It''s quite simple with Synaptic; the Reload button (or Edit -> Reload Package
    Information) downloads the latest package lists from your selected repositories.


    # Configuring Synaptic


    Synaptic allows you to customize how you mark your upgrades. With the dist-upgrade
    switch associated with the apt-get command, Synaptic supports smart upgrades,
    which attempt to resolve conflicts and fulfill all dependencies. Press the Mark
    All Upgrades button. If you haven''t already done so, you can choose between Default
    and Smart Upgrade. Alternatively, you configure upgrade mode; click Settings ->
    Preferences, and select your preferred option from the System Upgrade drop-down
    box.


    The Synaptic Preference dialog box is shown in Figure 4-8. As you can see, this
    includes six tabs. Columns and Fonts as well as Colors do not affect the functionality
    of Synaptic, and are therefore not covered in this book.


    ![](img/e178bfcea0b6629d1234b59342d4d686_155_0.png)


    **Figure 4-8** Synaptic Preferences


    Synaptic Preferences, as shown in Figure 4-8, are significant. They include


    +   - Show package properties in the main window

    I normally activate this option because it provides more information on each package.
    However, it could slow performance, especially if you''re running Synaptic remotely.'
