- pgno: 127
  md: '# 3.3.1 Supported Clients and Servers


    If you want to install ZLM 6.6.1 server, you''ll need a computer with SUSE Linux
    Enterprise Server 9 for Intel 32- or 64-bit computers. Alternatively, you can
    install ZLM on Red Hat Enterprise Linux 3 AS or ES for Intel 32-bit computers.
    As of this writing, ZLM 7 was still under development, and we expect that it will
    be installable as a server on Red Hat Enterprise Linux 4 and work for updates
    on SUSE Linux Workstation 9.3 and SUSE Linux 10.0 (along with the other clients
    listed below). If you do not want to install either distribution on your network,
    you''ll have to use the techniques previously described in this chapter to keep
    your SUSE computers up to date.


    You can use ZLM to manage updates for a number of different clients. ZLM 6.6.1
    clients are available for the following distributions:


    +   * SUSE Linux Enterprise Server version 8 for 32-bit systems

    * SUSE Linux Enterprise Server version 9 for 32-bit, many 64-bit PowerPC, and
    S/390 systems

    * SUSE Linux Professional Workstation version 9.1 and 9.2 for 32-bit and many
    64-bit systems

    * Red Hat Enterprise Linux 2.1 Workstation for 32-bit systems

    * Red Hat Enterprise Linux 3 Workstation for 32-bit and many 64-bit systems

    * Red Hat Enterprise Linux ES (Entry-level Server) 2.1 for 32-bit systems

    * Red Hat Enterprise Linux ES 3 for 32-bit and many 64-bit systems

    * Red Hat Enterprise Linux AS (Advanced Server) 2.1 for 32-bit systems

    * Red Hat Enterprise Linux AS 3 for 32-bit and many 64-bit systems


    # 3.3.2 Installing the ZLM Server


    You''ll need a license to operate ZLM. You can download a CD from download.novell.com;
    use the search terms: zenworks linux. You can download the latest available version
    in ISO format, which you can write to a CD.


    When you have a ZLM CD available, you can install the ZLM server on one of the
    supported distributions. It includes an installation script, rce-install, which
    you can use to install ZLM server. To install ZENworks, insert and mount the ZLM
    CD, and then run the rce-install script. If the CD is mounted on the /media/cdrecorder
    directory, you can run the script with the following command:


    ```

    /media/cdrecorder/rce-install

    ```'
