    # 6.3.9 Cleaning yum Caches


    As described earlier, the yum system downloads in the /var/cache/yum directory
    by default. With yum, unlike the Red Hat Update Agent, downloaded RPMs are not
    deleted by default. If your disk or partition space has limits, you may want to
    clean these caches on occasion.


    If you want to clean the RPMs from each of the /var/cache/yum subdirectories,
    you can run the following command:


    ```

    yum clean packages

    ```


    If you want to clean the headers from the /var/cache/yum subdirectories, you can
    run the following command:


    ```

    yum clean headers

    ```


    If you use compressed XML files in each repository subdirectory, that is the metadata
    associated with the yum cache, which can be used to configure the cache as a yum
    repository. Metadata can become corrupt or perhaps just too large for available
    disk space. You can remove the metadata with the following command:


    ```

    yum clean metadata

    ```'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'One thing keeps yum startup times to a minimum known as the "pickle cache,"
    which you can find in various /var/cache/yum subdirectories as compressed XML
    files with the .pickle extension. If these files become corrupt, the benefit is
    lost until you can clean up this cache with the following command:


    ```

    yum clean cache

    ```


    Naturally, if you just want to start your cache from scratch, run the following
    command:


    ```

    yum clean all

    ```


    You can restore the caches. Assuming your configured repositories are up to date,
    all you need to do is run the following command, as described earlier:


    ```

    yum makecache

    ```


    In fact, this is an excellent idea because it can reduce the wait time associated
    with yum-based updates.


    # 6.3.10 Group Management by yum


    Many RPM-based distributions organize their packages in groups, such as Graphics,
    GNOME, Kernel Development, and so on. As you may have seen in Chapter 5, you can
    use the apt commands to manage these groups. You can also use yum to manage RPM
    package groups.


    # Finding Available Groups


    Before you can manage the groups you have available, you need to know their names.
    You can list them with the following command:


    ```

    yum grouplist | more

    ```


    I pipe the output to the more command because the list for most RPM-based distributions
    is fairly long. The following excerpt from the CentOS-4 distribution lists installed
    groups, along with those available for installation. We illustrate one example
    in Figure 6-7.'
