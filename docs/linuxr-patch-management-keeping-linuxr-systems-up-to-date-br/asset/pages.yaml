- pgno: 157
  md: 'Under the Network tab, you can configure a connection through any Proxy Server
    which might govern your network''s connection to the Internet. The Distribution
    tab is important. It governs package upgrade behavior. The three options are:


    +   - Always prefer the highest version

    We recommend that you do not activate this option unless you''re willing to test
    the latest versions of many packages. The "highest version" may not be stable
    or production-ready.

    - Always prefer the installed version

    This can help maintain many services in a working configuration.

    - Prefer versions from [possibly several options]

    - If your /etc/apt/sources.list file includes several optional types of repositories
    (such as stable - Sarge / testing - Etch / unstable - Sid), you can choose between
    those options.


    After you''ve made your preferred changes, click OK to return to the Synaptic
    screen.


    # Selecting Packages


    In the main Synaptic screen, click the Status button. In the left pane, you''ll
    see packages divided into six different categories. When you configure certain
    packages, you may see a seventh:


    +   - All—Lists all packages, installed and available. With the mirrors I''ve
    selected, there are nearly 15,000 packages available.

    - Installed—Lists all installed packages, including those in the two categories
    that follow.

    - Installed (local or obsolete)—Lists all installed packages that were either
    built on the local computer or are not on configured mirrors.

    If you see a package in this list, an upgrade may still be available. Perhaps
    no developer has created a Debian version of the package, or the name of the package
    may have changed.

    - Installed (upgradable)—Lists packages for which newer versions are available
    on configured mirrors. You may want to avoid upgrades, especially for important
    services, until you know that your configuration files will work with the upgrade.

    - Not installed—Lists all packages from configured sources that have not been
    installed on this computer.

    - Not installed (residual config)—Lists packages that are not installed, but where
    associated configuration files exist on the local computer. This is typically
    associated with a package which has been uninstalled. In many cases, you can reinstall
    the noted package with the existing configuration file.'
  merge: -1
  img_proc: true
