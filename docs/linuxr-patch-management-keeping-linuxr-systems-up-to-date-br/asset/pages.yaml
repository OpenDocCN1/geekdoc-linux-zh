  md: '# 1.2 Distribution-Specific Repositories


    There are two apt commands which I use more than others. The first command is
    the following:


    ```

    apt-cache searchterm

    ```


    I can check the repositories configured in my /etc/apt/sources.list for the package
    of my choice. All I need is a search term; for I want to search for packages related
    to Linux office suites, I substitute office for searchterm. My repositories return
    a wide variety of packages, including the OpenOffice.org, KOffice, and Abiword
    applications, as well as related programs that might fit in an Office suite, such
    as xfonts and the HP Office Jet driver (hpoj).


    The other apt command I use frequently is


    ```

    apt-get install packagename

    ```


    For example, if I want to install the standard Linux DNS server, I substitute
    for packagename. The appropriate version of bind is installed; if there are dependencies,
    they are also installed. If additional configuration is required, Debian prompts
    for appropriate selections. Alternatively, if I wanted to remove a package with
    dependencies, I could run the following command:


    ```

    apt-get remove packagename

    ```


    Synaptic offers a GUI front-end to the apt system. As you can see in Figure 1-15,
    Synaptic allows you to graphically view, install, and remove the packages you
    choose.


    ![](img/e178bfcea0b6629d1234b59342d4d686_54_0.png)


    Figure 1-15 Synaptic Package Manager'
