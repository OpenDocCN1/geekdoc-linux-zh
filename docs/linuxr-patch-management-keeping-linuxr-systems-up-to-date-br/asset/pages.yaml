- pgno: 148
  md: '# Aptitude Menu Organization


    As you can see from Figure 4-1, Aptitude organizes packages into seven different
    categories. (It''s a bit different from the figure. The Virtual Packages includes
    no real packages, and if there are security updates pending, there will be another
    category by this name.) Under each category, you can select the packages of your
    choice to upgrade, install, or remove:


    +   - Security Update

    Packages for which security-related updates are available.

    - Upgradeable Packages

    Those packages for which upgrades are available.

    - New Packages

    Lists software that has been made available for your distribution installation
    or the last time you run the Forget New Packages command. There is little or no
    overlap between this category and “Not Installed Packages."

    - Installed Packages

    Those packages that are currently installed on your computer.

    - Not Installed Packages

    Specify packages which are not new and currently installed on your computer.

    - Obsolete and Locally Created Packages

    Includes installed packages not available from a repository specified in your
    /etc/apt/sources.list. Some may be obsolete; others may be created by your users.


    +   - Virtual Packages

    These are usually amalgamations of others that simplify dependencies. For more
    information, see the apt-cache man page and the debian-policy package.


    +   - Tasks

    Tasks correspond to package groups, which can help you select the packages that
    you need. For example, you may find a Localization Korean desktop package group
    which can help you configure a desktop environment in language.


    Under the first four categories, packages are organized into several different
    groups. Debian specifies 36 different groups at packages.debian.org/unstable/


    One critical skill with Aptitude is the search for a specific package. The forward
    slash key (/) opens the “Search for” text box. You can search for the package
    of your choice.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Configuring Aptitude Patch Management


    There are two basic menus where you can configure how Aptitude manages updates.
    To see how aptitude manages dependencies, navigate to the Options menu and select
    Dependency Handling. You''ll see five configuration options:


    +   - Automatically resolve dependencies of a package when it is selected

    Any dependencies of a selected package are automatically included in any list
    of packages to be upgraded or installed.

    - Automatically fix broken packages before installing or removing

    Any unsatisfied dependencies are addressed.

    - Install Recommended packages automatically

    Any packages that are recommended are installed as if they were

    - Remove unused packages automatically

    Normally includes obsolete packages that are no longer included in mirrors.

    - Automatically remove unused packages matching this filter


    This list may not match what you see. As Aptitude has evolved, the ways you implement
    patch management have changed. Also important are the miscellaneous options. Review
    them, navigate to the Options menu and select Miscellaneous, which opens the menu
    in Figure 4-3. The options are in the following list:


    ![](img/e178bfcea0b6629d1234b59342d4d686_149_0.png)


    Figure 4-3 You can specify how Aptitude updates your system


    +   - Automatically upgrade installed packages

    Disabled by default. Don''t want your services upgraded unless you''re sure they
    won''t break what you''ve built'
  merge: -1
  img_proc: true
