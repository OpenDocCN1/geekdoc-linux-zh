- pgno: 172
  md: '# Configuring apt for RPM Distributions


    There are many Linux users who believe that apt is the best available tool for
    keeping Linux distributions up to date. The developers behind the Conecta (now
    Mandriva) Linux distribution have brought apt to RPM-based distributions. The
    number of apt-enabled repositories is growing, it''s quite possible that you''ll
    have to create your own if you want to use apt on your Linux computers.


    In this chapter, you''ll learn a bit about the history and status of apt for RPM
    distributions, how to configure apt for RPM distributions, as for Fedora Linux
    and SUSE Linux Professional, and how to create your own apt repositories from
    an update database. When configured, you can use most of what you learned in Chapter
    4, “Making apt Work for You,” to manage patches on your network.


    > NotenBy the time you read this, it is quite possible that the Smart package
    manager will supersede apt for several RPM-based distributions. The lead developer
    for Smart, Gustavo Niemeyer, also maintained the RPM port of apt during his time
    with Conecta. For more information, see www.smartpm.org.


    Some of the problems associated with the apt for RPM distributions are problems
    associated with 32-bit and 64-bit packages. The apt system works well for RPMs
    only if repository architectures aren''t mixed. As of this writing, a number of
    applications on 64-bit RPM-based distributions require 32-bit libraries. Therefore,
    apt for RPM is not viable for most 64-bit Linux systems.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# A HISTORY OF AFT FOR RPM


    # 5.1


    One of the problems associated with RPMs is sometimes known as "dependency hell."
    This phenomenon is associated with failed attempts to install an RPM. You''ve
    probably seen messages specifying dependencies. You try to install that "dependency,"
    but that fails because another package is not installed. Frustration can reign
    when these messages continue for several levels. The developers behind what Conectiva
    Linux "ported" apt to their RPM-based distribution because they wanted to make
    it easier to manage patches.


    # 5.1.1 Reduced Dependency Trouble


    In this book, we''ve explored some of the methods you can use to manage patches
    and upgrades on your Linux computers. Much of the work involves different techniques
    that can help you ensure that all package dependencies are satisfied.


    It seems as though every distribution has a different method of patch management.
    Red Hat Enterprise Linux uses update on the Red Hat Network. Fedora uses update
    with yum, and is moving toward using with yum. SUSE uses the YaST Online Update
    tool, it is moving to accommodate those who want to use the Smart package manager.
    Debian users apt. The tool that is best for you depends on your distribution and
    experience. This book is designed to help you judge what is best for you and your
    network.


    Unfortunately, some of these patch management tools have limited use. Until recently,
    YaST was limited by license to SUSE distributions. While it''s available for other
    distributions, the update tool is closely associated with Red Hat. You can use
    the Red Hat Network to manage your patches only with a paid subscription to Red
    Hat Enterprise Linux.


    # 5.1.2 The Conectiva Approach


    When the developers of what was Conectiva (based in Brazil) wanted a Linux distribution,
    they wanted one with a recipe for commercial success. Red Hat and its RPM system
    was already more commercially successful than the Debian-based distributions.


    One perceived weakness of the RPM system is its installation and upgrade commands
    don''t come easy for, install or upgrade, any dependent packages. Options such
    as update did not exist. While the developers behind the former Conectiva Linux
    decided to base their distribution on an older version of Red Hat Linux, they
    had concerns about how to automate upgrades.


    Several of the maintainers of apt live in Brazil. It was natural for Conectiva
    to look to them to help develop their update systems. To manage patches on Conectiva
    Linux, they developed a port of apt repositories for'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# 5.1 A history of RPM


    RPM-based distributions, known as apt4rpm. Conectiva has shared its work under
    the GPL, and work continues through the SourceForge project. For more information,
    see http://apt4rpm.sourceforge.net.


    # Note


    Apt for RPM is the client; apt4rpm is the associated repository creation tool.
    For more information on the philosophy, see freshmeat.net/articles/view/182. Claudio
    Matsuoka''s article on the subject, while dated, is instructive.


    Unfortunately, the apt4rpm software does not include all the features associated
    with Debian-based distributions. RPMs are built somewhat differently. In most
    cases, they do not include the pre- and post-installation scripts that help you
    configure a DEB package and get it running on your system. While RPM-based distributions
    have existing configuration files, that functionality is less common than with
    a DEB package.


    As of this writing, Conectiva is straightforward. As suggested by Conectiva''s
    version of /etc/apt/sources.list, two basic repositories have been configured:
    all updates. As you can see, Conectiva has a similar format to those you see in
    the Debian version of /etc/apt/sources.list, as discussed in Chapter 4.


    ```

    rpm [cnbrj] ftp://ftp.conectiva.com/pub/conectiva 9/i386 all

    rpm-src [cnbrj] ftp://ftp.conectiva.com/pub/conectiva 9/i386 all

    rpm [cnbrj] ftp://atualizacoeses.conectiva.com.br 9/i386 updates

    rpm-src [cnbrj] ftp://atualizacoes.conectiva.com.br 9/i386 updates

    ```


    The differences are straightforward. Instead of deb and deb-src, which are associated
    with binary and source packages, Conectiva repository commands start with rpm
    and rpm-src. Conectiva repositories are digitally signed; the [cnbr] tells apt
    to look for the signature. As of this writing, it is supported through a mailing
    list available from http://distro.conectiva.com.br/mailman/info/apt-rpm. With
    the merger, and the emergence of the Smart Package Manager, this list may be ending.
    But will the use of SSE 10.0 to apt-rpm give it new life?


    # Note


    Mandriva already has an excellent package management tool, known as uprmi. I do
    not cover it in this book, because it is used only for Mandriva Linux. For more
    information on uprmi, see the related HOWTO at http://developer.skolelinux.org/~zerodogg/rpm-HOWTO.html.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# 5.1.3 An Overview of apt for RPM-Based Distributions


    There are several RPM-based distributions that use apt. In many cases, apt is
    not the primary patch management system for the distribution. In some cases, developers
    have processed apt repositories for certain distributions and have made them available
    for public use. These distributions include the:


    +   - Fedora supports the use of apt (at least as Fedora Core 4). In support,
    several third-party groups have configured apt packages and repositories for this
    distribution. You can read more about this later in the chapter.

    - The Polish Linux Distribution, PLD, supports the use of apt along with its primary
    patch management system, known as poldek. For more information, see www.pld.org.

    - Vine Linux, based in Japan, supports apt. For more information, see www.vinelinux.org.
    Originally from Red Hat Linux, upgrades are also supported with apt. An English
    language version of this site is available at www.vinelinux.org/index-en.html.

    - Alt Linux is a Russian language distribution that uses RPM packages and supports
    apt updates. For more information, see www.altinux.ru. it is based on Mandarin
    and uses apt as its primary update system.

    - Yellowdog is the distribution designed for the Power CPU closely associated
    with the Apple Macintosh. While they developed the yum commands that you''ll learn
    about in Chapter 6, "Configuring a yum Client," and Chapter 7, "Setting up a yum
    Repository," they also support the use of apt for updates.

    - Mandriva allows the use of apt as an option to itsrmi update system.


    +   - SUSE supports the use of apt. While YaST Online is the primary tool for
    managing patches on that distribution, SUSE has included apt for the first time
    in SUSE Linux Woodstock 10.0. Several apt repositories are listed at http://linux1.gwd.de/apt4rpm/home.html.
    You can read more about this later in this chapter.


    There are several groups that support the use of apt. The developers behind freshrpmms
    have configured apt repositories for Fedora, Yellowdog, and older versions of
    Red Hat Linux. For more information, see apt.freshrpmms.org. Dag Weiers has created
    a number of apt and yum capable repositories. For more information, see http://dag.weiers/home-made/apt/


    Note

    With recent improvements to yum, it''s likely that the Fedora project will no
    longer support apt repositories starting with Fedora Core 5. Support may be available
    from third parties, however.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'A slightly out-of-date list of repositories for several RPM-based distributions
    is available as of this writing at http://apt4rpm.sourceforge.net/repos.html.
    In many cases, you may find up-to-date repositories at the servers indicated for
    the noted distributions. Searching some-common directory substitutions (e.g.,
    SUSE version 10.1 for 10.0) as well as trial and error may be required. Interestingly
    enough, although Fedora appears to be moving away from apt, SUSE seems to be increasing
    support for the apt system. As of this writing, it appears they also include support
    for yum repositories—starting with SUSE 10.1.


    # 5.2 CONFIGURING APT FOR RPM


    Generally, if you want to configure apt for RPM, you''ll need to download and
    install it, with any dependencies. You may also want to install one of the front-end
    apt package management systems described in Chapter 4, such as aptitude or the
    Synaptic Package Manager.


    If there''s one or more apt repositories available for your distribution, you''ll
    need to configure your computer to take updates from that system. Naturally, because
    there are fewer repositories for RPM-based distributions, chances are good that
    updates take longer. It is then more important to configure a local apt repository.


    If remote apt repositories are available, you can create a local mirror using
    the techniques described in Chapter 3, “SUSE''s Update Systems and rsync Mirrors,”
    and Chapter 4. Otherwise, you may need to create your own apt repositories based
    on regular package repositories available for your pre-ferred distribution.


    # 5.2.1 Package Options


    If you''re planning to use apt to manage patches on your system, you may have
    had trouble in the process with RPM dependency hell, as noted earlier. When you
    install apt, you may have to deal with the RPM dependency problem one time.


    The packages required for apt vary by RPM-based distribution. Some trial and error
    may be required. If you''re working with Fedora Linux 3 or later, apt RPMs may
    be downloaded from your favorite repository mirror, in the Extras directory. Related
    packages are listed in Table 5-1.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Table 5-1 Fedora.apt-related packages


    | Package | Description |

    |---|---|

    | apt | Installs the basic Advanced Package Tool system; includes the apt-cache,
    apt-cdrom, apt-config, and apt-get commands |

    | apt-devel | Adds developmental tools if you want to extend the apt commands
    |

    | apt-groupinstall | Supports searches and retrievals with apt-cache and apt-get,
    using the groups defined in comps.xml in /usr/share/comps/i386 directory |

    | apt-python synaptic | Supports a python interface to apt; useful for some scripts
    Provides a GUI package manager interface |


    Naturally, each of these RPMs includes dependencies. Until you''ve installed and
    configured at least the basic RPM package and encounter dependencies, you will
    have to resolve the old-fashioned way: with patience and hard work.


    If you''re using an older (pre-10.0) version of SUSE Linux, navigate to ftp://apt.wdg.de/pub/linux/suse/apt/SUSE/9.3-i386/RPMS.suser-rbos/
    for apt packages. The packages listed on this server may require other RPMs already
    available on the SU installation CDS/DVD.


    # 5.2.2 Configuring apt


    Next, you can modify the apt configuration files to meet your needs. As with Debian
    Linux, these files are stored in the /etc/apt directory. While apt relies mainly
    on the sources.list file to find repositories, the locations and details of other
    apt configuration files vary.


    Ideally, you''ll have access to local or nearby network repository and can point
    your sources.list file to the appropriate URL. You can mirror the apt repository
    for other computers on your network, and patch management will be a breeze! Well,
    almost. I hope you''re all so fortunate.


    # 5.2.3 Selecting Sources


    You might be surprised by the number of apt repositories available for RPM-based
    distributions. Unless your distribution uses apt as its primary means of updates,
    there are usually fewer apt repositories available, and they are likely to be
    further away from your network.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# 5.2 Configuring apt for RPM


    When selecting a source for an apt repository, check the documentation associated
    with your distribution. You may be pleasantly surprised. For example, one of the
    rebuilds of Red Hat Enterprise Linux 4, Lineox, uses apt by default for their
    updates (www.lineox.com).


    # Note


    Lineox also maintains your yum for 64-bit distribution, which avoids the previously
    described mixed-architecture problem associated with apt. Because there are a
    number of third parties who create apt repositories for the popular RPM distributions,
    you may end up associating your sources.list with different repositories.


    # 5.2.4 Configuring apt for Fedora Linux


    Red Hat has stated that Fedora Linux is the development platform for its enterprise
    distribution. As such, Fedora evolves quickly. New versions are released every
    four to eight months, and the patch management tools may change as frequently.
    As of this writing, there is no single collection of apt repositories and mirrors
    for Fedora Linux. After all, this distribution uses yum by default for patch management,
    Fedora developers do not maintain apt repositories. One complete list of apt repositories
    is available at www.fedora.us/mirrorlists.


    If you''re using Fedora 4 or later, you''ll need to point your apt sources to
    a third-party repository, such as apt.freesprms.net. This website includes links
    with apt (and yum) downloads for the released versions of Fedora Core, Yellowdog
    Linux, as well as several Red Hat Linux versions. More importantly, it includes
    a list of mirrors you can use in your /etc/apt/sources.list configuration file.


    Alternatively, you may find apt repositories for the latest Fedora Core and Red
    Hat Enterprise Linux (including rebuild) distributions at http://rpmforge.net.
    While detailed information was not available as of this writing, the RPM Forge
    team includes luminaries who created third-party repositories, including Dag Wieers,
    Mathias Saoiu, and Dries Veracht.


    If available third-party repositories are not to your satisfaction, continue reading.
    Later in this chapter, you''ll learn how you can create a dedicated repository
    for your distribution.


    After you''ve configured repositories, you can run all the commands you''ve read
    about in Chapter 4. But there is more. If you''re familiar with Red Hat or Fedora,
    you know that packages are organized in groups. You can find a list of groups
    on your chosen repositories with the following command:


    ```

    apt-cache groupnames

    ```'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'If you ever want to install the packages in a specific group, make a note of
    the group name. If you want a list of packages associated with a group, you can
    find it in the comps.xml file described earlier. For standard 32-bit systems,
    you can find this file in the /usr/share/comps/i386 directory.


    For example, the ftp-server package group includes one package, vsftpd, which
    is the default FTP server for Fedora. But the comps.xml file may be confusing.
    You can cut through the clutter by listing the members of this group with the
    following command:


    ```

    apt-cache showgroup ftp-server

    ```


    You can install all packages in this group with the following command:


    ```

    apt-get install ftp-server

    ```


    The packages, with all dependencies, are installed just as they are when you run
    the apt-get command on a Debian system. Packages that are marked as optional in
    comps.xml are not included. You can also remove package groups along with dependencies.
    For example, if you want to remove the office package group, run the following
    command:


    ```

    apt-get groupremove office

    ```


    As you can see in Figure 5-1, this command specifies the packages to be removed,
    upgraded, and installed, as well as the results on disk space on your system.


    > Note

    The aforementioned apt-cache and apt-get commands do not work with Debian Linux.
    They don''t work with the Linux rebuild of Red Hat Enterprise Linux 4. However,
    all the apt-get mirror-select command works with USE Linux Professional. Just
    remember, USE organizes package groups differently from Fedora or Red Hat.


    ```

    michael@fedora:~/michael

    [root@fedora ~]# apt-get groupremove office

    Finding packages by group(office)...

    Reading Lists: Done

    Building Dependency Tree: Done

    The following packages will be REMOVED:

    spef (2.8.0-5)

    gndf (2.8.0-5)

    openfile.org (1.1.2-10)

    openfile.org-libs (1.1.2-10)

    openfile.org-lib (1.1.2-10)

    planar (0.12.1)

    ugraded, 0 newly installed, 6 removed and 0 upgraded.

    To get GB of archives.

    After performing RPM disk space will be free.

    Do you want to continue? [Y/n]

    ```


    Figure 5-1 Removing a package group'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# 5.2 Configuring apt for RPM


    However, dependencies that may have been installed with the original installation
    are not removed. Unlike the result with Debian Linux, the dependencies remain
    on the computer. That is one flaw with apt on RPM-based distributions that exists
    today.


    # Synaptic with Fedora

    You can install the Synaptic Package Manager described in Chapter 4. To do so,

    run the apt-get install synaptic command. If you do it, it should be accessible

    ible in the GUI if you click Main Menu -> System Settings -> More System

    Settings -> Synaptic Package Manager. Alternatively, just run synaptic from a

    GUI command line interface. As you can see in Figure 5-2, the result is a bit
    different

    from what you saw in Chapter 4. By default, the left pane includes the

    different Fedora package groups.


    ![](img/e178bfcea0b6629d1234b59342d4d686_180_0.png)


    **Figure 5-2** Removing a package group


    There is one difference. In the Fedora version of the Synaptic

    Package Manager, you can select Edit -> Mark Packages by Task (or Ctrl+G),

    which opens the window shown in Figure 5-3. If you run the apt-cache

    groupnames described earlier, you''ll recognize this window as a list of

    package groups that you can install with the apt-get groupinstall groupname

    command. You can mark the group of your choice; Synaptic configures installation

    of that group, along with any dependencies.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Configuring apt for RPM Distributions Chapter 5


    ![](img/e178bfcea0b6629d1234b59342d4d686_181_0.png)


    Figure-5-3 Marking groups for installation


    Then you can Apply Marked Changes with Ctrl+P or the Edit -> Apply Marked Changes
    command. This action opens a window similar to Figure 5-4, where you can see and
    check those packages that may be installed, upgraded, or removed, to make sure
    your needs are addressed. You should also make sure that any packages which are
