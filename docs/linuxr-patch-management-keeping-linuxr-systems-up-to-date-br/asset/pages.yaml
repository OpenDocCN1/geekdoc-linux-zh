    network. As you saw earlier, YaST Online Update allows you to configure updates
    from local and network sources.


    While this is not a networking book, the most straightforward way to share directories
    with other Linux computers is with a Network File System server. For more information
    on the NFS, see *Mastering Red Hat Enterprise Linux 3* by Michael Jang (Alameda,
    CA: Sybex, 2004).The server and client tools are normally available, even in a
