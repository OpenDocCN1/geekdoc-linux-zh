- pgno: 138
  md: '# 4.1 Fundamentals of apt


    > Note

    The list shown in Table 4-1 is far from complete. It omits packages that are installed
    as dependencies to those listed here. It also leaves out other packages with tools
    that you may prefer. This list and chapter encompass just one formula for patch
    management.


    # 4.1.2 Installing apt on an RPM-Based Distribution


    There are number of RPM-based distributions that can or do use apt as the primary
    patch management tool. We will discuss this in more detail in Chapter 5, "Configuring
    apt for RPM Distributions."


    # 4.1.3 Configuring apt on Your Computer


    As discussed in Chapter 1, the key to use apt as a patch management tool is the
    repositories that you select and include in your apt configuration file, /etc/apt/sources.list.
    In that, you used the Debian mirror list at www.debian.org/mirror/list to add
    appropriate sites for your computer and physical location.


    Before you configure /etc/apt/sources.list, you should know the different repository
    categories for your distribution. Debian and other related distributions (e.g.
    Knoppix, Ubuntu) use different names. You can use the netselect tool to help find
    the repository mirror best suited to your location.


    # Basic Repository Categories


    There are repositories associated with the three current Debian distributions.
    All three are in use, so you may need to create repositories for each. The three
    current Debian distributions are listed here:


    +   - Sarge (Debian 3.1)—The current "stable" release. The associated software
    was released as "stable" in mid-2005. The previous stable distribution was known
    as Debian Woody (3.0).

    - Et (Debian 3.2)—The current beta release. As of this writing, because it was
    just taken from the unstable release tree, its components may or not be stable.
    Et packages are stored in the Debian testing repository.

    - Sid—The developmental release of Debian, with many packages that may not be
    ready for production use. Sid packages are stored in the Debian unstable repository.
    Sid was the code name for the developmental release of Debian even before Sarge
    was released.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Note


    While the previous stable version of Debian, known as Woody, is still commonly
    used, the version before that, known as Potato, is pretty much obsolete. Many
    mirrors no longer include Potato packages in their repositories.


    As of this writing, I use Debian Sarge on my primary laptop computer. I used it
    while it was "stable" and never had a major problem with associated packages.
    There are three subcategories associated with each repository, as described in
    Table 4-2.


    # Table 4-2 Debian repository subcategories


    | sources.list subcategory | Description |

    | --- | --- |

    | main | Packages released under open source licenses, such as the GPL, are collected
    in this category |

    | contrib | Packages that are released under open source licenses and depend on
    non-free software are stored here |

    | non-free | Any package that is not released under a qualifying open source license
    is collected |

    | non-US | There are few packages developed in the USA which have limited distribution
    due to US export restrictions; if you have a repository outside the USA, you should
    connect to a non-US repository |

    | main/debian-installer | Includes packages associated with installing Debian
    over a network |


    Some sources.list options are distribution-specific. For example, Ubuntu Linux
    (which.ubuntu.com) includes universe and multiverse repositories that correspond
    loosely to the Debian unstable and contrib / non-free repositories. The actual
    contents of these repositories vary, are far from exact mirrors.


    While Linux users prefer to use free software packages, this may not always be
    possible on your network. A lot of important Linux compatible software is released
    under fairly restrictive licenses, such as some versions of Java and RealPlayer.


    # Repository Selection Tools


    There are two basic reasons to select a repository. One is for updates, the other
    is for mirroring onto your network. If you''re looking for more updates than your
    /etc/apt/sources.list file, it''s in your interest to select more than one repository.
    If one goes down, you can still get the updates you need. On the'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 4.1 Fundamentals of apt


    other hand, if you''re looking for a mirror, you may want to find one that supports
    rsync access. Some searching and trial and error may be required.


    Depending on your situation, you can use the netselect or netselect-apt commands
    to find the repository or repositories best suited to your needs. If you know
    there are any small number of suitable repositories, netselect. For example, if
    you''re in the middle of the U.S. Silicon Valley, you might have noticed that
    the Debian repositories at the University of California at Berkeley (linux.csua.berkeley.edu)
    and the University of California at Santa Cruz (slugluc.ucsc.edu) are fairly close.
    Assuming the bandwidth and demand on both servers are roughly the same (it is
    up to you check), you can find the best suited for your system with the following
    command:


    ```

    netselect -vv linux.csua.berkeley.edu slugluc.ucsc.edu

    ```


    With the vv switch, you can get measurable results that can help make a judgment.
    One possible result is shown here:


    | linux.csua.berkeley.edu | 34 ms 13 hops 100% ok (10/10) [ 87] |

    | slugluc.ucsc.edu | 38 ms 14 hops 100% ok (10/10) [ 82] |


    This output lists results in the following order: URL, transmission time, number
    of hops, percentage and number of successfully transmitted packets, and an overall
    score based on the transmission time and number of hops. In this case, the scores
    are close; the results may vary slightly if you repeat this command.


    Unfortunately, you can''t rely on these tools alone. While distance from a mirror
    is important, capacity is also an issue. For example, it might be better to connect
    to a more distant mirror if it has a higher-capacity Internet connection. It may
    be better to connect to a mirror associated with wealthier sponsors—multigabit
    downloads from many thousands of users can be rather expensive. For reason, Debian
    strongly discourages downloads from the repositories that it owns.


    # sources.list Results


    Based on the information so far in this section, you can customize your /etc/apt/sources.list
    file with the mirrors best suited for your Debian system. In Chapter 1, you will
