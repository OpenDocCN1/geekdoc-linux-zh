    # Update Agent Line Options


    There are a number of useful actions that you can take with the Update Agent.
    They’re associated with different switches for the up2date command. While a complete
    list is available in the associated page, I''ve listed the more important alternatives
    here:


    ```

    up2date --configure

    ```


    As described earlier, this command allows you to configure Update Agent options.
    If you''re in the GUI, this opens the Update Agent configuration window if you
    want the full functionality associated with the command line interface, use the
    up2date-nox --configure command.


    ```

    up2date --register

    ```


    This command allows you to register (or revise your registration) with the Red
    Hat Network.


    ```

    up2date -d packagename

    ```


    This command downloads specified packages, without installing them. If you already
    have the most up-to-date version of the packagename, you’ll see a message to that
    effect.


    ```

    up2date --src packagename

    ```


    This command downloads the source package along with the associated binary RPM.
    If you already have the most up-to-date version of the packagename, you’ll see
    a message to that effect.


    ```

    up2date --show-channels

    ```'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'This command lists the channels available for updates to your computer.

    For more information on Red Hat Network channels, see Chapter 2.


    ```

    up2date --hardware

    ```


    The --hardware switch updates the hardware profile for your computer,

    documented on the Red Hat Network.


    ```

    up2date --list-rollbacks

    ```


    This switch lists packages that you can restore to their former versions.


    ```

    up2date -u

    ```


    This command automatically updates your system with all upgradeable

    packages.


    ```

    up2date --installall --channel=rhel-i386-as-4

    ```


    This downloads and installs all packages from the given channel, as

    defined in the output from the up2date --show-channels command. Naturally,

    you''ll want to enable the KeepAfterInstall configuration option described

    the previous section. Otherwise, the Update Agent deletes packages

    after downloading and installing them on your system.


    # Aggregating Red Hat Enterprise Linux Updates


    If you administer just a few RHEL computers on a network, you may choose to

    configure them to download their updates directly from the Red Hat Network

    (after you''ve tested each update, of course). But if you have a substantial num-ber
    of RHEL computers, their simultaneous updates may overload your con-nection to
    the Internet.


    There are several methods you can use to manage and maintain control

    of how you keep your systems up to date.


    # QUARTERLY Updates


    Red Hat provides CD-based updates of its RHEL distributions on a quarterly

    basis. These updates include all upgraded packages otherwise available

    through the Update Agent. You can store these packages in a local installation

    repository and upgrade your system with said packages.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# PROXY SERVERS


    Another way to update a group of RHEL systems is with a proxy server. A Red Hat
    Network Proxy Server stores content locally and passes authentication requests
    to the Red Hat Network. It requires a relatively high-powered system; minimum
    requirements are shown in the release notes include


    +   - Dell PowerEdge 1750 server or equivalent

    - Two or more CPUs

    - 512MB of RAM

    - 3GB of storage for RHEL AS

    - 1.5GB for storage and update packages


    These are relatively minimal requirements. If you''re storing updates for more
    than one version of RHEL, practical hardware requirements increase accordingly.


    The default Red Hat Network Proxy Server is available with 10 desktop subscription
    entitlements. Other packages may be available; contact Red Hat sales or www.redhat.com
    for more information.

    You can learn how to install and configure the Red Hat Network Proxy Server in
    Chapter 2, as well as how to configure RHEL clients to connect to those servers.


    # SATELLITE SERVERS


    Nominally, the hardware requirements for a Satellite Server are not significantly
    greater than for a Proxy Server. But if you have the number of RHEL systems that
    justify a Satellite server, you''ll want to follow Red Hat recommendations,


    +   - Dell PowerEdge 2650 server or equivalent

    - Two or more 2.4GHz CPUs

    - 2GB-4GB of RAM

    - 3GB of storage for RHEL AS

    - 5GB for storage and update packages—per channel (such as for different hardware-based
    versions of RHEL)

    - 2GB of storage for database RPMs

    - 36GB of storage in the database repository'
  merge: -1
  img_proc: true
