    # ### 7.6.4 Configuring Updates to the RHEL Repository


    After you''ve added the packages you need to /var/local/up2date, it is up to you
    to maintain a RHEL repository. While the Red Hat Network does not include a rsync
    server, the effect from updates is essentially the same. You can repeat the same
    commands described earlier, and only new packages are downloaded. obsolete packages
    are not removed from the local mirror.


    However, if you''ve copied all of the installation files to the /var/local/up2date
    directory, this is not necessary. You just need the updated RPMs, which are available
    with the following command:


    ```

    up2date -u

    ```


    If you want to keep using /var/local/up2date, make sure that you never restore
    the defaults associated with the Red Hat Update Agent. Otherwise, the updated
    RPMs would be deleted after the next update. (You may also want to disable upgrades
    to the up2date RPM, as described in an earlier note.)'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# 7.6.5 Configuring Clients to Use the RHEL Repository


    Naturally, if you''ve created a repository on a RHEL computer, you may want to
    use it for that computer. You''ve already downloaded and installed the yum RPM
    package. You can now create a configuration file in the /etc/yum.repos.d directory
    similar to those you''ve created in Chapter 6. In this case, the repository is
    local; therefore, you can specify the file:/// (that''s three forward slashes)
    label described earlier to the point directory.


    For example, I''ve entered the following in the /var/spool/up2date local.repo
    file in the /yum.repos.d directory:


    ```

    [local]

    name=Mike''s local RHEL 4 repo

    baseurl=file:///var/spool/up2date

    gpgcheck=1

    enabled=1

    ```


    Now I use the yum commands described in Chapter 6 to update the system with the
    repository. Naturally, you can configure other RHEL 4 clients to use the same
    repository. Based on the Apache server configured earlier, I modified the aforementioned
    local.repo file accordingly:


    ```

    [local]

    name=Mike''s local RHEL 4 repo

    baseurl=http://yum.example.com/up2date

    gpgcheck=1

    enabled=1

    ```


    # 7.7 Summary


    There are many Linux users who prefer other tools for doing their patch management,
    yum is designed for RPM-based distributions. Its popularity has grown as Fedora
    has adopted yum as its primary patch management tool. Because the Red Hat Network
    is not available unless you''re a subscriber, many RHEL rebuild distributions
    have also adopted yum for updates and more.


    The repository creation process can be time-consuming. If you use packages from
    installation CDs, you can save some time. With the rsync command, you can download
    the remaining packages that you need. The advantage of rsync is that you can keep
    your repositories up to date with the same commands you''ve used to download the
    packages you need.'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'When created, you''ll need to share your repositories. There are three major
    sharing services: NFS, Apache, and FTP. When shared, you can configure your clients
    to point to the repositories on your local network, minimizing the loads on your
    Internet connection, allowing you to focus on those packages critical to security
    and functionality on your network.


    While you can use the Red Hat Network Proxy Server described in Chapter 2 to manage
    patches and updates on RHEL computers, you can also configure a yum repository
    based on an amalgamation of RHEL installation packages and updates.


    We''ve covered a broad array of patch management tools that you can use on almost
    any Linux distribution. There are other excellent tools exclusive to specific
    distributions, such as uprmi for Mandriva and emerge for Gentoo. Our lack of coverage
    of these tools is not intended to denigrate these excellent tools but simply reflects
    the scope of this book.'
  merge: -1
  img_proc: true
