- pgno: 217
  md: '# SPECIAL YUM COMMANDS


    The yum command is rich and diverse. Run yum from the command line interface,
    by itself, and you''ll get a hint of what it can do for you. Naturally, more information
    is available from the associated man page. As shown in Figure 6-4, there is a
    wide variety of switches and options, many of which we will be exploring in the
    following sections.


    ```

    $ root@centos4~$ yum

    Usage [options] -update | install | info | remove | list |

    clean | provides | search | -update | groupinstall |

    groupupdate | grouplist | groupremove | generate-rs |

    packages | localonly


    Options:

    -[config] specify the config file to use

    -[error] set the error logging level

    -[debug] set the debugging level

    -y answer to all questions

    -t [time in minutes] set the max of time to randomly run in

    --cache-update only update the caches

    --install-root[path] set the install root (default ''//'')

    --version output the version of yum

    -rs [filename] set the filename to generate rs to

    --exclude-repository to exclude

    --disable-repository id to disable (overrides config file)

    --enable-repository id to enable (overrides config file)

    -h, --help this screen

    $root@centos4 log#

    ```


    Figure 6-4 A variety of yum commands


    As you go through the yum command and options measure its effects on your system,
    you''ll note that as with apt for RPM-based systems, dependent packages that were
    installed are not always removed. In addition, the first time you use yum, updates
    to the local header database in /var/spool/up2date take some time. Subsequent
    updates are faster because the headers stored locally identify any dependencies
    that need to be installed.


    # Caching Available Packages by yum


    If you insist on a remote repository, one way to keep your patch management time
    to a minimum is to use the following command:


    ```

    yum makecache

    ```


    Functionally similar to apt-get update, this command downloads all xml-based file
    and package data from your repositories, keeping search time to a minimum.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# 6.3 Special yum Commands


    On a patch management server, it may be appropriate to keep a local cache of updates
    from an online mirror. If you choose to run the yum-cache command to cache updates,
    you should make sure this command is run on a daily (or perhaps nightly) basis
    to ensure your local cache matches those associated with the remote repositories
    to which you connect.


    By default, packages and headers downloaded from yum repositories are stored in
    the /var/cache/yum directory. You can change these settings in the /etc/yum.conf
    file. If you want to see what''s downloaded on your system, look around in that
    directory. You''ll see subdirectories associated with each repository specified
    in /etc/yum.repos d directory. For example, downloads from the standard CentOS-4
    repository are stored in the base/subdirectory.


    In each repository subdirectory, there are packages and headers subdirectories.
    Naturally, you can reinstall from those directories. As you''ll see shortly, all
    you need is the -c option. However, caches aren''t always up to date. It may be
    appropriate to run one of the yum clean commands described later in this chapter
    on a periodic basis.


    # 6.3.2 Checking Available Updates by yum


    After you''ve configured repositories in files in the /etc/yum.repos d, you might
    want to know which of the available packages are upgrades to what is installed
    on your system. You can identify those packages with later revision numbers with
    the following command:


    ```

    yum check-update

    ```


    If you''ve configured some of the third-party repositories described earlier,
    the resulting list may be misleading. By definition, third parties build packages
    using their own tools and often use different build numbers and conventions. This
    is equivalent to the following command:


    ```

    yum list updates

    ```


    As described later, these are the packages that would be installed (along with
    any dependencies) if you run the yum update command.


    # 6.3.3 Finding a Needed File


    Sometimes, you just need a particular file. Perhaps you want to install that special
    wireless card. You may have noticed online that wireless cards with'
  merge: -1
  img_proc: true
