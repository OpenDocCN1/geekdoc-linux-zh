- pgno: 163
  md: '# Note


    If you want to configure a complete Debian mirror to share on the Internet, the
    people behind Debian ask that you register your mirror at `www.debian.org/mirror/`.


    # Debian Directories


    The major Debian directories correspond to available distributions and architectures.
    Before you create a mirror, it may be helpful to review what''s available in each
    category on the mirror of your choice. Where there are several names for the same
    distribution, you may find more than one directory, pointing to the set of packages.
    The current major Debian distributions include Woody, Debian Sarge, Debian Etch,
    and Debian Sid.


    +   -Debian Woody is now the obsolete distribution. As of this writing, the current
    version of this distribution is 3.06. There may be directories on a Debian mirror
    known as woody, oldstable, or Debian3.06. (Debian Potato came before Debian Woody).


    +   - Debian Sarge, as of this writing, is now the most recent stable version
    of Debian Linux. As of this writing, the current version of this distribution
    is 3.1r0. There may be directories on a Debian mirror known as sarge, stable,
    or Debian3.1r0.


    +   - Debian Etch, as of this writing, is now the beta, or testing version of
    Debian Linux. There may be directories on a Debian mirror known as etch or testing.


    +   - Debian Sid is the developmental version of Debian Linux. There may be directories
    on a Debian mirror known as sid, or unstable.


    Under each distribution directory, Debian maintainers and developers build and
    incorporate binary source packages for a number of different architectures, as
    noted in Table 4-5.


    Table 4-5 Debian architectures


    | Architecture | Description |

    |---|---|

    | alpha | For computers with the HP (formerly Compaq/Digital) CPU. |

    | arm | Associated with computers with Advanced (formerly Acorn) RISC (Reduced
    Instruction Set Computing) Machine processors; commonly available on handheld
    computers. |

    | hppa | Short for Hewlett-Packard Precision Architecture; associated with HP''s
    line of RISC CPUs. |

    | i386 | The standard architecture associated with 32-bit Intel and compatible
    CPUs. |

    | ia64 | Associated with Itanium and Itanium-2 64-bit CPUs developed by Intel.
    |'
