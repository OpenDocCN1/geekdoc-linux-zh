    # 4.3 SUMMARY


    In this chapter, you explored the ins and outs of the apt commands. When you

    configure an appropriate mirror, you can use apt, aptitude, or the Synaptic

    Package Manager to keep your system up to date. But if you use aptitude or

    the Synaptic Package Manager, be careful. The defaults could easily delete

    packages that you consider essential.


