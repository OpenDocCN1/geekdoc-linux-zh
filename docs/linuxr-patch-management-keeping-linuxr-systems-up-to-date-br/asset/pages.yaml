    | kernel-smp-dev | 2.6.9 | 5.0.5.ELPK name/pattern |


    Figure 7-7 Downloading updates


    # Add RPMs from the Installation CDs


    Now you should add the RPMs from the RHEL installation CDs. This is elementary.
    If you have the physical CDs (as I do), the mount command requires a small trick.
    For example, if you stored the ISOs on /mnt/test partition, I can mount the first
    RHEL ISO with the following command:


    ```

    mount -o loop /mnt/test/RHEL4-i386-AS-discl.iso /media/cdcorreder

    ```


    You can then copy the RPMs to the /var/spool/update directory with the following
    command:


    ```

    cp -ar /media/cdcorreder/RedHat/RPMs* /var/spool/update/

    ```


    Naturally, repeat the process with the first CD, you''ll want to unmount and repeat
    the other RHEL CDs until you''ve copied all available RPMs to the /var/spool/update
    directory.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# 7.6.2 Yummifying the RHEL Update Repository


    After you''ve configured the files you need in RHEL repository, you can set it
    up as a yum repository. As described earlier in this chapter, this requires the
    `yum-arch` or `createrepo` commands, depending on your distribution. The `createpo`
    package was adapted for Fedora Core 3. Because RHEL 4 was built from Fedora Core
    3, we''ll use this package to "yummify" this repository.


    If you haven''t already done so, install the yum and `createrepo` RPMs. As discussed
    earlier in this chapter, they are not currently available from RHEL 4 channels.
    However, compatible versions are available from Fedora Core 3 repositories. Download
    guidelines are described earlier in this chapter.


    Now you can yummify your repository with one of the following commands, whichever
    is appropriate to your distribution:


    ```

    yum-arch /var/spool/update

    createrepo /var/spool/update

    ```


    If successful, you''ll find headers/ or repodata/ subdirectories in the `/var/spool/up2date`
    directory. I''ve used the second command on my RHEL 4 system, with downloaded
    updates and installation RPMs that I''ve just described.


    # 7.6.3 Sharing the RHEL Repository


    Now you can share the RHEL 4 repository that you''ve just created. You can configure
    the Apache or NFS servers described earlier. Unfortunately, as described earlier,
    the vsFTP service does not follow symlinks, for security reasons described earlier.
    In this case, we''ll configure the server that we did not configure before, the
    Apache Web Server. We won''t go into detail on how to configure Apache on your
    system; we''ll just create a basic configuration that you can use for a RHEL repository.


    If you want more information on how you can configure Apache on RHEL, there are
    many excellent books available, including *Administrator''s Handbook* by Rich
    Bowen (Indianapolis, IN: Sams Publishing, 2002).


    In this case, I''ve installed the `httpd` RPM package on RHEL 4. To make sure
    it works, start the daemon with the following command:


    ```

    apachectl start

    ```'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'If you see a message related to “Could not determine the server’s fully domain
    name”, do not be concerned. There is no URL specified in the default version of
    the Apache configuration file, httpd.conf, in the /etc/httpd/conf directory.


    Test the result. If you''re on the computer, open a browser and navigate to 127.0.0.1.
    If the service is working, you will see the Red Hat Enterprise Linux Test Page.
    Test the result on a remote computer. I''ve configured the repository computer
    with a URL of example.com, and therefore can navigate to that URL to see the same
    test page.


    By default, Apache files this distribution are stored in the /var/www/html directory.
    You already have a repository in the /var/pool/up2date. To allow apache to work
    with the repository, you need to link directories. One method is with the following
    command:


    ```

    ln -s /var/pool/up2date /var/www/html/up2date

    ```


    If everything goes right, you should be able to navigate to the up2date/directory
    on the Apache server. In my case, I''ve navigated to http://yum.example.com/up2date/.
    However, that does not work at first. I have started with the RHEL 4 Apache configuration
    file. For more information, see the error_log in the /var/log/httpd directory.
    The key error message from this file is


    Directory index forbidden by rule: /var/www/html/


    To address this issue, I modified the messages associated with the Apache root
    directory. The default configuration file includes the following stanza at 25
    percent of the way into the file:


    ```

    <Directory>

    Options FollowSymLinks

    AllowOverride None

    </Directory>

    ```


    The Options directory you need is Indexes, which leads me to substitute the following
    command line:


    ```

    Options Indexes FollowSymLinks

    ```


    Now, you can try the desired URL again. You should see a similar result to Figure
    7-8, with a list of files linked from the /var/pool/up2date repository.'
  merge: -1
  img_proc: true
