- pgno: 194
  md: '# 5.4 The apt Commands in Detail


    Whenever you update the RPMs, you''ll need to update the associated database.
    You don''t need to update all databases in your repository. For example, if you
    want to update the contents of the /mnt/test/i386/RPM.updates directory, you could
    update the associated database with the following command:


    ```

    genbasedir --progress --flat --bz2only --bloat /mnt/test/i386 updates

    ```


    Naturally, if you synchronize your RPM directories with a mirror on a regular
    basis, you''ll want to make this command a regular part of that job.


    # 5.4 THE APT COMMANDS IN DETAIL


    The apt commands are important. You can do more from the command line interface.
    If you want to take full advantage of the apt system, you''ll learn how to use
    the basic apt commands. While we do not cover all available apt commands in this
    book, two are critical to anyone interested in patch-management for RPM- and DEB-based
    distributions: apt-cache and apt-get.


    There are certainly more apt commands of interest, some of which were covered
    in Chapter 4. Some are largely limited to Debian-style distributions.


    # 5.4.1 Analyzing apt-cache in Detail


    It''s worth some trouble to examine what you can do with the apt-cache command.
    You can review most available options with the apt-cache -h | less command. This
    list is not complete; you learned about the showgroup and groupnames earlier in
    this chapter, as well as search in Chapter 4. Several options are rarely used
    because other commands may be more useful. For example, the apt-cache add package
    command adds a package to the cache, it''s best to keep your entire database up
    to date with the apt-get update command. Therefore, several apt-cache options
    are not covered in this book.


    # apt-cache showpkg


    When you run the apt-cache showpkg packageName, apt-cache searches through available
    package databases, as download from servers locations specified in /etc/apt/sources.list.
    One sample with the synaptic package is shown in Figure 5-9.'
