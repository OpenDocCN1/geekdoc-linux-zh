    These packages are not required in order to make your system function properly,
    but they may provide enhanced functionality for some programs that you are currently
    installing.


    If you select a package, an explanation of its current state will appear in this
    space.


    Figure 4-4 What Apt will do


    +   * Packages being removed because they are no longer used

    Sometimes packages are installed to satisfy dependencies. If they''re no longer
    required, for instance, because the original package has been removed, it is added
    to this list. For example, if I''ve removed the abivord-common package on my system.


    +   * Packages being automatically installed to satisfy dependencies

    Just as you wish, this lists packages that are being installed to satisfy dependencies.


    +   * Packages being deleted due to unsatisfied dependencies

    Sometimes, packages that satisfy dependencies become obsolete and are removed
    from available mirrors. Sometimes, there are updates that conflict with such packages.


    +   * Packages being held back

    Many packages receive regular updates. You may not want to update those packages,
    because upgrades can break your configuration. If you did not activate the "Automatically
    upgrade installed packages" setting described earlier, there will be a long list
    in this section.


    +   * Packages to be removed

    Sometimes, new versions of a package mean that others no longer work. If these
    packages are dependencies, they are candidates for removal.'
