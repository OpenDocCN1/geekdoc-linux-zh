    # 4.2.3 Creating a Debian Mirror


    You may not want to use rsync or the associated script just described. You can
    use the packages with commands as apt-get -u deselect-upgrade. If you''ve followed
    the instructions associated with the dpkg-scanpackages described earlier in this
    chapter, you can create a local repository with these packages.


    In this section, we''ll also use alternative tools. One is debmirror, which allows
    you to download and synchronize part of a mirror to your own repository with a
    minimum of configuration. The other is apt-mirror, which uses configuration files
    similar to the standard /etc/apt/sources.list configuration file.


    > Note

    Before you change the /etc/apt/sources.list to point to the local mirror on your
    network, you should test your configuration on at least one client. Back up that
    client before updating your system.


    # Using Local Packages


    If you''ve upgraded your system with download packages, you may still have them
    stored in the default download directory, /var/cache/apt/archives/. With these
    packages and the dpkg-scanpackages command, you can create your own local repository.


    Assuming you''ve installed the Debian apache2 Web server (and associated packages),
    you could configure a repository on Debian Linux (Sarge) with the following commands:


    ```

    cd /var/cache/apt/archives

    dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz

    mkdir /var/www/apache2-default

    cp -ar /var/cache/apt/archives/* /var/www/apache2-default/

    ```


    Don''t forget the dot (.) after dpkg-scanpackages; it applies all files in the
    current directory.'
