- pgno: 228
  md: '# 6.4 CONFIGURING AUTOMATIC UPDATES


    If you''re comfortable with your repositories, you may want to automate your updates
    by using what you know about the yum command. In this section, I''ll show you
    the variety of available update commands available for yum and how automated updates
    are configured for various distributions, such as CentOS-4 and Fedora Core 4.


    # 6.4.1 Finding the Right Update Command


    As described earlier, the following command looks for packages that can be updated
    in all configured repositories. You can do so with the following command:


    ```

    yum update

    ```


    Unfortunately, this command requires confirmation, which is not something you
    want to leave to ordinary users. If you''re comfortable with the way updates are
    maintained, you can run the command to automatically confirm downloads:


    ```

    yum -y update

    ```


    However, many administrators will want to avoid updates of several types of packages.
    Most common on this list is related to the Linux kernel; for example, updates
    of the Linux kernel require updates of other software that you may have compiled.
    To avoid kernel updates (until you''re ready), you can add the --exclude switch
    described earlier. Such an update might look like this:


    ```

    yum --exclude=kernel* -y update

    ```


    Naturally, this might not be enough. As suggested earlier, updates of the Firefox
    Web browser can be troublesome. Therefore, if you want to avoid updating Firefox
    packages, you can expand this a bit further:


    ```

    yum --exclude=*firefox* --exclude=kernel* -y update

    ```


    If you''ve connected to a specialty repository, you may not want to take updates
    from that server. You can avoid updates from a repository with the --disablerepo
    switch. For example, if you''ve configured the Dag Wieries repositories described
    earlier in the /etc/yum.repos.d you can avoid any updates from that repository
    with the following command:


    ```

    yum --disablerepo=dag --exclude=*firefox* --exclude=kernel* -y update

    ```'
  merge: -1
  img_proc: true
- pgno: 229
  md: "# 6.4.2 Automating the Process\n\nThere are two ways to automate the update\
    \ process. If you have confidence in your distribution keeps packages up to date,\
    \ you could configure the previous command in a cron job. For example, you could\
    \ set up a nightly cron job with an appropriate file in the /etc/cron.daily directory.\
    \ You might even include a cron job in the /etc/cron.weekly directory.\n\nIn fact,\
    \ the yum RPM often includes a cron job in these directories. The script is straightforward.\
    \ It starts with the standard #!/bin/sh, which invokes the bash shell. The default\
    \ versions of this script vary by distribution and release.\n\n# The Original\
    \ yum cron job\n\nThe following is what you see for the /etc/cron.daily/yum.cron\
    \ update script if you're running Fedora Core 3 or the Hat Enterprise Linux 4\
    \ rebuilds that use for updates, such as CentOS-4.\n\n```\n#!/bin/sh\nif [ -f\
    \ /var/lock/subsys/yum ]; then\n  /usr/bin/yum -R 10 -e 0 -d -y update\n  /usr/bin/yum\
    \ -R 12 -e 0 -d -y update\n```\n\nThis job is active if there's a /var/lock/subsys/yum\
    \ file, which is created if the yum daemon is active in runlevel. If this file\
    \ exists, this cron runs two commands, 10 and 120 minutes after the scheduled\
    \ start of this job. The first yum command makes sure that your system has the\
    \ most up to date version of yum, and then the second command runs the yum command\
    \ to update all the RPMs to the latest versions\n\n# The Newer yum cron Jobs\n\
    \nRed Hat has revised the cron jobs for Fedora Core 4. There are now two: a daily\
    \ job for updates and a weekly job to clean packages that accumulate in the caches.\
    \ As you can see, the following is the new default /etc/cron.daily/yum.cron script:\n\
    \n```\n#!/bin/sh\nif [ -f /var/lock/subsys/yum ]; then\n  /usr/bin/yum -R 120\
    \ -e 0 -d -y yum update\n  /usr/bin/yum -R 10 -e 0 -d -y shell /etc/yum/yum-daily.yum\n\
    ```\n\nThe first yum command makes sure that your system has the most-to-date\
    \ version of yum, and then the second command drops into the yum shell, which\
    \ has its own commands. The yum shell works only in Fedora Core 4 or later. It\
    \ calls the /etc/yum/yum-daily.yum file, which contributes three commands to the\
    \ script:"
