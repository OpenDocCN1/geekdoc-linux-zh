    # Configuring the Update Agent Settings


    Naturally, Red Hat''s Update Agent is more flexible when started from the command
    line interface. As an administrator, you may administer a number of your systems
    remotely; in this case, the command line interface is more efficient.


    The Update Agent configuration command is up2date-nox --configure. As it opens
    several-dozen configuration options, it''s best to pipe the output to a pager
    with a command such as


    ```

    up2date-nox --configure | less

    ```'
  merge: -1
