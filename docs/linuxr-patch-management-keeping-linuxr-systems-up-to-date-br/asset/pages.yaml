    # 6.3.4 Identifying a Needed Package


    If you want to identify a package associated with a specific search term, the
    yum search command can help. For example, if I wanted to identify those pack-ages
    associated with the Atheros chipset, I would run the following command:


    ```

    yum search atheros

    ```


    This command is roughly equivalent to the apt-cache search atheros command described
    earlier in this book. However, as you can see from the out-put, this particular
    command may be usefull:


    ```

