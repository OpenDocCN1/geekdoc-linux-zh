  md: '# Downloading SUSE Linux


    Two of the flagship distributions in the SUSE Linux line are SUSE Linux Professional
    and SUSE Linux Enterprise server.


    While each version of SUSE Linux Professional is available only for sale during
    the first few months of release, it''s available for download after that. For
    more information, see www.novell.com/products/linuxprofessional/. It''s best if
    you use a mirror; links are available from the noted Web site. As of this writing,
    downloads of SUSE Linux Professional 9.3 are available as a DVD ISO or a standard
    installation tree. Starting with version 10.0, Novell has made a bootable CD or
    open source version of SUSE Linux Professional available at www.openuse.org.


    SUSE Linux Enterprise Server is available with a 30-day evaluation license. More
    information is available from www.novell.com/products/linuxenterpriseserver. You''ll
    need a Novell account before you can download this system. SUSE Linux Enterprise
    Server 9 requires that you download CDs from the SUSE servers in Ireland or Utah
    (USA).


    As of this writing, with instructions available on the download page, you can
    extend the evaluation to six months. The license is only required for updates;
    the servers remain functional thereafter.


    # 1.2.3 Debian


    For me, Debian offers what I think of as the Heatkit version of Linux. It offers
    a wide degree of flexibility. Debian repositories offer a wider variety of packages
    than any other distribution I know.


    Debian heark back to the origins of Linux, where it was solely a cooperative arrangement
    between developers. As you can see at www.debian.org, this distribution is the
    province of its volunteers. However, there is commercial support available for
    Debian. Ian Murdock, one of the founders of Debian, started Progeny as a company
    which provides commercial support for Debian (and several versions of Linux).
    For more information, see www.progeny.com.


    The current version of Debian is known as Sarge. There is also a "testing" distribution,
    similar to a beta, known as Etch. The developmental distribution, which includes
    packages more likely to have problems, is known as Sid. You might recognize these
    names from the Disney movie Toy Story.


    # Installing Debian


    Debian is different. You could download the 14 CDs or 2 DVDs associated with Sarge
    and install Debian from there. You could store the associated packages in a network
    repository. I have a fairly speedy modem connection, and I still find the thought
    of downloading this amount of data rather intimidating.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'If you don''t have a high-speed connection, you can purchase CDs or

    DVDs from vendors, such as www.cheapbytes.com or with www.thelinuxshop.co.uk.

    ''ve installed Debian Sarge over a network connection, installing the

    packages I need. For this purpose, a high-speed connection is still the only

    practical method. I have started with the first installation CD. I was able to

    install enough of the operating system, including links to Debian repositories

    in /etc/apt/sources.list. For more information on this method, see

    www.debian.org/CD/netinst/


    # Note


    Most of the current development work on Debian is on a different release, known

    as Debian Sid. It is known as an unstable release; in my opinion, it is akin to
    the

    Developmental (Rawhide) releases of Fedora Linux. For more information on

    Debian Sid, see www.debian.org/releases/unstable/.


    # Most Regional Mirrors


    After you''ve installed the basic Debian distribution, you''ll want to configure
    your

    /etc/apt/sources.list file with one or more appropriate repositories. One list
    is

    av in the Debian Web page of mirrors at www.debian.org/mirror/list.

    I count mirrors available over 50 countries.


    To use a mirror, you''ll want to specify the URL, the distribution,

    and whether you want to be download source code. In my case, I''ve added

    t following mirrors to my sources.list file:


    ```

    deb ftp://debian.oregonstate.edu/debian/ stable main

    deb-src ftp://debian.oregonstate.edu/debian/ stable main

    ```


    This points my Debian computer to a mirror at Oregon State University.

    This is direct from the Debian Web page of mirrors noted previously. As I''ve

    installed Debian Sarge on my system, I''ve listed the stable repository. I''ve

    also noted the main set of packages. If I wanted additional packages-

    tributed by other developers, I''d add contrib to these lines. If I want to

    access repositories of proprietary packages, I''d add non-free to these lines.


    # The apt System


    The Debian patch management system is very integrated with the apt

    series of commands. You''ll learn about the apt commands in detail in Chapter

    4. The strength of apt is how it searches for and includes any dependent pack-

    ages as it installs (or removes) the packages you desire.


    The apt commands are also in common use on Debian-based distribu-

    t, such as Knoppix, as well as some RPM-based distributions, such as

    Connectica.'
  merge: -1
  img_proc: true
