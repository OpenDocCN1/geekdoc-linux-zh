- pgno: 211
  md: 'update for Fedora Core 3 took over two hours on a high-speed cable modem connection.
    Naturally, this should focus your mind on how much you need patch management,
    along with a local repository.


    There can be problems even after yum resolves dependencies. If you run into a
    problem, you could rerun the Update Agent in verbose mode with the -v switch:


    ```

    up2date -v -u

    ```


    Alternatively, you could watch the messages as they appear with the following
    command:


    ```

    tail -f /var/log/update2date

    ```


    There are occasional errors, such as IOError: Not a zipped file. In that case,
    try a different mirror. Updates may not be as consistent as the mirror you''ve
    selected.


    One other error I encountered relates to an unresolvable dependency. You might
    think this is not possible with yum, because it automatically resolves dependencies.
    By default, the Update Agent does not download or install a newer version of the
    Linux kernel. The related error I encountered is


    ```

    Unresolvable chain of dependencies:

    hal-0.4.7-1.FC3 requires kernel >= 2.6.10

    ```


    While we discuss yum in detail later in this chapter, we already know that the
    --exclude switch is useful; for example, the following command excludes the RPM
    from that list:


    ```

    up2date -u --exclude=hal

    ```


    I can also exclude the Firefox browser (and similarly named packages, courtesy
    of the wildcard) from the update list:


    ```

    up2date -u --exclude=hal --exclude=firefox*

    ```


