  md: 'Figure 3-7. Otherwise, FTP and HTTP servers support anonymous authentication.
    Naturally, unless you actually want others to access your installation source
    online, you should protect your FTP or HTTP server through your network firewall
    and other settings detailed in good Linux networking texts, such as Linux Administration
    Handbook by E Nemeth, Gary Snyder, and Trent Hein (Upper Saddle River, NJ: Prentice
    Hall, 2002).


    On the other hand, Samba generally requires a username and password, based on
    how you configure a Microsoft Windows-style network.


    # NFS Server


    The Network File System (NFS) is native to Unix/Linux computers and is often considered
    more efficient if your networks are limited to those operating systems. If you
    configure an NFS share with your Linux computers, you can configure your installation
    source as a shared NFS directory. All you need the following:


    +   - NFS Server name or IP address

    - The name of the directory from the NFS server


    # Local Media


    If you''ve installed SUSE over a network, your software source points to that
    installation source. However, you might want a different software source, as the
    SUSE installation DVD, for computers such as laptops.


    Insert the CD or DVD. Click Add -> DVD (or CD). YaST mounts the CD/DVD, and then
    adds the CD/DVD to your Software Source list.


    # Local Directory


    If you''re experimenting with SUSE at home, you may choose to configure an installation
    source on a dedicated directory on your local computer. All you need is the name
    of the directory.


    # 3.1.3 Installation Into Directory


    Return to the YaST Software Menu. Select the Installation Into Directory option.
    You can configure and install another copy of SUSE Linux into a subdirectory.
    By default, the subdirectory is /var/tmp/dirinstall. You could use this option
    to create a sample SUSE installation, which you could then copy to other computers
    on your network. If you do, keep in mind that standard cron jobs purge files in
    /var/tmp directories on a regular basis. Because this is not really related to
    patch management, we will not explore it further.'
