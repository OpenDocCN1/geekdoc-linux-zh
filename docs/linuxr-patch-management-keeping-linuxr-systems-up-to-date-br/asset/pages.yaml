    # 6.3.11 The yum Command Options


    There is more that you can do with yum. As described earlier, you''re free to
    modify the repositories listed in the /etc/yum.repo.d directory. You can test
    a set of defaults other than what is configured in /etc/yum.conf. For example,
    if you want to test a yum.conf file in your home directory, you could run the
    yum command of your choice with the -c switch:


    ```

    yum -c /yum.conf <yum actions>

    ```


    Typically, yum requests confirmation before installing or removing specific packages.
    If you''re comfortable with what you''re doing, you can automate the process with
    the -y switch, the yum command automatically answers prompts with y to confirm
    changes:


    ```

    yum -y <yum actions>

    ```


    If you have problems, you may want to do some debugging. By default in /etc/yum.conf
    is set to 2. If you need more information about what happens during a specific
    command, you can increase this variable with the -d switch. For example, the following
    command sets a much higher level for installing the packages associated with the
    Administration Tools group:


    ```

    yum -d 5 groupinstall "Administration Tools"

    ```'
