  md: '# Backup


    Naturally, when you update applications, it is in your interest to back up associated
    configuration files. In fact, it is always best to keep a backup of those files,
    at least in the /etc directory.


    However, YaST will back up configuration files associated with updated packages.
    You can change what YaST does. Select Backup, and you can make YaST


    +   - Create backups of all modified files

    - Create a complete backup of all files in the /etc/sysconfig directory

    - Delete any older backups of modified files


    # Language


    You can configure YaST to use the language of your choice during this process.
    SUSE supports over 20 different languages.


    # 3.1.6 UML Installation


    User Mode Linux (UML) allows you to configure virtual Linux machines within SUSE
    Linux. While it may be useful for you to test specific SUSE features, it is not
    related to patch management and is therefore not covered in this book. UML has
    been superseded by Xen in the latest SUSE distribution.


    # 3.1.7 YOU Server Configuration


    SUSE Linux Enterprise Server supports one method of caching updates to a LAN,
    known as YaST Online Update (YOU). When configured, updates are saved to the following
    directory:


    ```

    /var/lib/YaST2/you

    ```


    By default, it''s configured to use your authorized SUSE Enterprise account to
    cache updates locally, in two channels:


    +   - SUSE-CORE, the base packages associated with this distribution

    - SUSE-SLES, the packages closely associated with SUSE Enterprise Server functionality'
  merge: -1
