- pgno: 141
  md: 'this distribution. If you want all Sarge-associated repositories, access the
    contrib and non-free repositories, as follows:


    I''ve selected additional repositories for my Debian computer, just in case the
    Oregon State repository goes down. But if you''re in the Silicon Valley, you probably
