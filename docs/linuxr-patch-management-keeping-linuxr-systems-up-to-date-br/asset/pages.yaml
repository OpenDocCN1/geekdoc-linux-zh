- pgno: 136
  md: '# Making apt Work for You


    One of the popular Linux patch management systems is based on the Advanced Package
    Tool, known as apt. While it was developed for Debian Linux, it is the standard
    patch management tool for a number of Debian and Red Hat-based distributions,
    including Knoppix, Xandros, and even the Lineox rebuild of Red Hat Enterprise
    Linux. But if you prefer apt, the associated tools can be installed on most Linux
    distributions.


    In this chapter, you''ll learn the fundamentals of apt, including some of its
    more useful commands. Then you will see how you can use apt to maintain a Debian
    client, beyond the fundamental tools that you learned about in Chapter 1, "Patch
    Management Systems." Finally, you''ll see how you can create and maintain a local
    apt-based repository for your network.


    # 4.1 FUNDAMENTALS OF APT


    There are many different commands associated with apt. You reviewed a couple of
    commands in Chapter 1. While you can do a lot with apt-cache and apt-get, there
    are more commands and capabilities.


    You should know how to find the best mirrors for your distribution, as well as
    how to include them in your apt configuration. When you learn how to use various
    apt commands, you''ll learn to appreciate the capabilities of related "all-in-one"
    tools, including aptitude and the Synaptic Package Manager. If you find apt to
    your liking, you may need to install it on your distribution. The same apt tools
    are available for both Debian- and RPM-based distributions.


    # 4.1.1 Installing apt on a Debian-Based Distribution


    There are several packages associated with apt. Not all are installed by default.
    If you want to take full advantage of the apt system, you''ll want to'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'install as many apt-related packages as is practical. To find available apt
    packages on my Debian system, I ran the following command:


    ```

    apt-cache search apt

    ```


    When I ran this command, I got a list of 384 packages. That''s too much! As you
    search through this list, you might realize that it includes unrelated packages,
    such as raptor-utils, because the ''apt'' string is in its name or description.
    So you should use a more discriminating search. Without getting too fancy, I find
    available apt-related packages with the following two commands, where I added
    a space before and after the search term (in quotes):


    ```

    apt-cache search "apt"

    apt-cache search "apt"

    ```


    Because apt-cache is part of the apt package, this course assumes that you have
    previously installed apt on your Linux system. These search reveal a substantial
    number of packages related to apt. (When you install these packages, the apt system
    also installs dependencies). Some of these packages may be redundant, because
    they provide different ways of doing the same thing. You do not need to install
    every apt-related package. I''ve described some of the apt packages I consider
    important in Table 4-1.


    # Table 4-1 Some important apt-related packages


    | Package | Description |

    |---|---|

    | apt | Installs the basic Advanced Package Tool system |

    | apt-build | Adds a front-end to build and install packages |

    | apt-cache | Creates a caching system for Debian packages |

    | apt-file | Supports searches within uninstalled packages |

    | apt-howto | Includes a guide to the apt system |

    | apt-lists | Incorporates a tool to list critical bugs |

    | apt-src | Configures a source package management tool |

    | apt-utils | Adds important apt commands |

    | apt-watch | Includes an update monitor to the Red Hat Network/SUSE watcher applets
    |

    | apt-zip | Configures apt updates for non-networked computers |

    | aptconf | Provides a front-end for configuring sources.list |

    | aptitude | Adds a terminal-based front-end for apt |

    | cron-apt | Automates apt updates |

    | mini-distget | Includes a daemon for updating local repositories |

    | netselect-apt | Helps select the fastest available mirror |

    | synaptic | Provides a GUI package manager interface |'
