    # 7.3 CONFIGURING A LOCAL YUM SERVER


    The skills you need to configure a local yum server are not related to yum. They

    require knowledge of the FTP, Apache, NFS services. While this section is

    des to provide a complete guide to any of these services, it provides a

    description of how you can configure a yum repository based on the set-

    ings described earlier for Fedora Core 4 updates.


    Because I personally prefer the efficiency of the FTP and NFS services

    for sharing files, I''ve covered the configuration steps required only for those

    . For completeness, I''ve described how you can configure an Apache

    server to share files on RHEL 4 yum repository near the end of this chapter.

    If you are configuring a yum server, what will you vary based on the follow-

    ing factors:


    +   Distribution and version

    Preferred version of a server (configuration steps vary for different FTP

    hand HTTP servers, and to some extent, the way different distributions

    implement servers)

    Availability of yum for the distribution (i.e., if it isn''t available, be pre-

    pared to compile yum from a source RPM)'
