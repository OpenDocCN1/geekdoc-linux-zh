    # 1.4 Configuring LAN


    When you configure a LAN with Linux, you need to consider the demands of patch
    management along with any other requirements of users. While you can certainly
    schedule patch management upgrades during off-hours, there are a number of other
    demands which are often scheduled for off-hours, including backups, CPU intensive
    database programs, and more. This includes scripts run in the middle of the night
    on Linux computers, as those in the /etc/cron.daily.


    As an example, there have been around 2GB in updates to Fedora Core 3 over a four-month
    period. Averaged over this period, that''s approximately 20MB of downloads per
    day. That''s a problem only if you connect to the USA via telephone modem (nearly
    half of all Internet connections still use a telephone modem). Therefore, one
    practical requirement for Linux patch management is a high-speed connection.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'An update of 20MB per day might not be a big problem if you have one or two
    Linux computers and a typical residential DSL (Digital Subscriber Line) or Cable
    Internet connection. However, if you''re running a network of Linux computers,
    you need to think about your requirements. If you choose to consolidate patches
    on a local computer, youll need a computer that can handle the patch management
    demands from all the other computers on your network.


    The hardware requirements increase depending on whether you need to download source
    packages—and whether you''re planning Linux patch management for more than one
    architecture on your network.


    # 1.4.1 Linux Patch Management in a Network


    If you have a substantial number of Linux computers, it might be cost effective
    to configure, and dedicate one or more computers to the patch management. For
    example, assume that you have a network of 100 computers, and patch management
    requires that each of these computers downloads 20MB per day. Downloading an additional
    2GB per day, every day, can be expensive on business-level Internet connections.


    > Common high-speed connections for business start with dedicated “T1” lines at
    1.44 Mbps. T3 connections support 45Mbps. Multiple and fractional connections
    are available with even higher speeds. While a certain quality of service is guaranteed
    on these connections, prices often start in the hundreds of dollars (U.S.) per
    month.


    If you can configure a proxy server, you could download Linux patch data once
    from the Internet, and then the 100 computers on your network download the patches
    locally. You would then save the additional costs for your Internet connection.


    > The costs associated with business-level connections to the Internet vary widely.
    If you''re in a country that encourages the market to provide inexpensive high-speed
    connections, such as the Republic of Korea, you may be able to let your network
    grow larger before considering a proxy server. On the other hand, if you''re in
    an area where Internet connections are more expensive or less reliable, you may
    need to consider patch management if your network includes only two or three Linux
    computers.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# 1.4 Configuring Your LAN


    Depending on the number of computers that require updates, you may want to configure
    more than one patch management proxy server for your network. While details are
    beyond the scope of this book, you should consider several factors before making
    this decision:


    +   Marginal costs; what is the additional cost required if all your systems accessed
    a remote repository over the Internet?


    +   Network capacity; for example, whether your network conforms to Ethernet or
    faster standards. The Red Hat hardware requirements for proxy servers specifies
    computers with Gigabit adapters.


    +   Control; if you have subscriptions to a Linux support service, you may prefer
    to store these subscriptions on a local server. Some subscription services make
    this possible.


    +   Frequency of updates; how often do you need to update or synchronize each
    of your proxy servers with each other and a central repository through the Internet.


    You can examine some of these factors in the following sections.


    # 1.4.2 Rigorous Hardware Requirements


    Any computer that you configure as a local repository for Linux patch management
    meets the definitions of a proxy server. It caches content from the Internet for
    multiple computers on your network.


    As suggested earlier in this chapter, Red Hat includes some fairly rigorous requirements
    for Red Hat Network Proxy Servers. It''s unlikely that you''ll be able to recycle
    an old workstation for this purpose.


    # Storage/CPU/Network Specifications


    If you''re configuring a new computer as a Linux patch management repository,
    you should first consider any recommendations from your distribution suppliers.
    Among others, Red Hat and Novell/SUSE have experience with caching content from
    the Internet.


    In general, CPU speed is less important on a proxy server. If you''ve dedicated
    a computer as a proxy server, you''re not expecting it to run many independent
    programs. However, if your network includes a substantial number of computers
    which need access to your local repository, multiple CPUs can be useful. The important
    hardware requirements of a proxy server repository include the following:


    +   Network connections. If you have a limited budget for network hardware, it''s
    worth focusing the latest hardware on your repositories. In other words, make
    sure that computer has the fastest network cards, along with faster hubs, switches
    and routers nearby, when possible.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'Hard drives. Naturally, Linux patch management repositories require larger
    hard drives for the many GB of data associated with each distribution. Access
    speed, controllers, and caching size are more important on a proxy server.


    Hardware reliability may be less important on a Linux patch repository. After
    all, this computer is essentially just a mirror of data that is already available.
    If that computer fails, you can reload the data through the Internet. However,
    if Linux patches are important and time-sensitive in your organization, your view
    of this may differ.


    # Amount of Data


    Hard drives don''t always have to be large. If you''re only storing updates on
    a Linux patch management repository, all you need on a proxy server is for the
    operating system and the package updates. With today''s Linux distributions, that
    amounts to less than 10GB of data (even for SUSE Linux).


    But this may grow quickly depending on your needs. As suggested, if you have more
    than one type of system architecture, such as Intel 32, 64-bit, PowerPC, and so
    on, data requirements can grow exponentially.


    In addition, if you have more than one version of Linux that requires updates,
    you''ll need to keep separate repositories for each. In other words, not only
    do you need separate repositories for RHEL, SUSE, and Debian computers, you will
    need separate repositories for RHEL 3, RHEL 4, SUSE 9.0, SUSE 9.1, SUSE 9.2, SUSE
    9.3, SUSE 10.0, Fedora Core 1 through 5, and more.


    # 1.4.3 Source Packages


    The size of your repositories could easily double if your users need access to
    the source code.


    Source code is readily available because of the requirements of the GPL. This
    allows any developer to take the source code and modify it for their own needs.
    Developers can modify and redistribute GPL source code, as long as it is still
    released under the GPL.


    But unless you are administering a network with Linux developers, you might think
    that you don''t have to worry about Linux source packages.


    You don''t have to be a developer to need Linux source code. Anyone who wants
    to customize the Linux kernel needs the source code. While some distributions
    make the source code available in a binary package, Red Hat releases its build
    of the kernel source code as a RPM.


    Linux drivers for many hardware components are still under development. Experimental
    drivers often work well. But to install many of these drivers, you need the kernel
    source code.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# 1.4 Configuring Your LAN


    The need for source code is not limited to the kernel. Regular users can modify
    the source code of many GPL-licensed programs. All they need the source code,
    and they can revise, compile, and rebuild the program of choice.


    # 1.4.4 More Than One Repository


    Even if all Linux computers on your network run the same version of the distribution
    using the same CPU, you might need more than one repository. As noted earlier,
    Fedora 4 includes configuration files for several different repositories. While
    most users don''t need to access the Red Hat repositories, you never know when
    one user might be so desperate for the latest features that he is willing to try
    a development version of his favorite program.


    You might need separate repositories on a Linux management server for the following
    reasons:


    +   - Distribution bands; each distribution builds its packages differently and
    maintains separate repositories.

    - Distribution versions; for example, if you have a reliable server on RHEL 2.1,
    you might not want to upgrade to RHEL 4, even though a subscription makes this
    possible. Red Hat has committed to support each of its enterprise distributions
    for at least five years, which means you might need to maintain local repositories
    for RHEL 2.1 through 2007.

    - Number of architectures; for each architecture where you have Linux installed
    on your network, you''ll need a separate repository.

    - Source requirements; if some of your users are Linux developers, you might need
    to download source packages into a separate repository.

    - Development packages; if you are monitoring the progress of a program, you''ll
    want access to the development packages so you can monitor improvements as they''re
    made.

    - Testing packages; some groups make development packages available in a separate
    repository before declaring them stable and ready for a production environment.

    - Independent repositories; some developers keep independent repositories on their
    Web and FTP servers. Many are available for public use.


    # 1.4.5 Keeping Your Repository Updated


    There are two basic methods you might use to keep a local repository up to date.
    Some distributions allow you to download packages and their headers on a local
    computer. You can share the directory with those download packages and point the
    other computers on your network to that local repository. Red Hat and SUSE make
    that possible in some cases with their Subscription systems.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Patch Management Systems Chapter 1


    Alternatively, you can synchronize your repositories with those available online.
    This is where the rsync command can help. I detail how you can do this in later
    chapters, especially Chapter 3, “SUSE Update Systems and rsync Mirrors.” While
    that chapter is focused on SUSE Linux, the use of the rsync command described
    in that chapter applies to repositories for all distributions.


    Some administrators prefer to wait until updates are available in a more convenient
    format. For example, RHEL makes quarterly updates of its distributions available,
    which administrators can configure to use a local repository using the techniques
    described in the last half of this book.


    After you''ve determined how to keep your repositories up to date, automate the
    process so it happens during off-peak hours. Remember, you might be downloading
    hundreds of megabytes of packages, make sure that the download does not interfere
    with any other scheduled work, such as:


    +   **Computing-intensive programs.** For example, intensive database programs
    require so much in computer and network resources that they’re often run while
    most users are not at work.


    +   **Administrative programs.** Backups, log rotations, and in Linux are often
    configured in scripts in the /etc/cron.daily directory.


    +   **Other downloads.** Many Linux users download distributions. It’s best if
    you can limit large downloads by regular users at least to specific time periods.


    +   **Power outages.** Some networks may limit available power due to costs, availability,
    or local conditions.


    # 1.5 SUMMARY


    When you apply patch management techniques to your Linux computers, you can keep
    them secure, to date with the latest services, and nearly bug-free.


    In this chapter, you learned to configure repositories and apply patches and updates
    on RHEL, SUSE, and some other Linux distributions. Subscriptions are required
    in some cases, which entitle you to keep your systems up to date with the latest
    patches from specific vendor repositories. Patches can easily run into hundreds
    of megabytes, it can be helpful to configure a patch management repository on
    one or more computers on your LAN so you do not have to pay for an Internet connection
    where all your computers download individually from remote locations.


    In the following chapters, you’ll learn how to configure and manage local patch
    repositories on your network.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Consolidating Patches on a Red Hat/Fedora Network


    Patching Linux on one computer is a straightforward process. As you read in Chapter
    1, “Patch Management Systems,” many distributions include patch management utilities
    that can keep a single system up to date. Regular patch downloads for one or two
    computers over a typical high-speed connection are not a problem. Regular patch
    downloads from dozens of computers over a LAN over a shared Internet connection
    can be troublesome.


    Therefore, you need to know how to configure a central patch repository for a
    network. In this chapter, I outline how you can plan a repository using Fedora
    Core Linux. “Setting Up a Yum Repository,” I provide the detailed instructions
    for setting up a repository for Fedora Core. Alternatively, if you''re administering
    patch management for Red Hat Enterprise (RHEL) systems, you can set up a Red Hat
    Proxy Server. I''ll take you through the configuration process for a Red Hat Network
    proxy and client, step by step.


    Finally, I will describe the basic patch management process for some of the rebuilds
    of RHEL, specifically CentOS and Lineux. Because they use the yum and apt tools,
    you can keep them up to date using the repository tools you''ll learn about in
    this book.


    > Note

    In this chapter, we will be referring to proxy servers (lowercase) which cache
    and sometimes regulate your LAN''s communication with outside networks, as the
    Internet. We will also be referring to a Red Hat Network Proxy Server (uppercase),
    which can be configured as your LAN''s repository for RHEL updates.


    # 2.1 CREATING YOUR OWN FEDORA REPOSITORY


    In this section, you will learn the basic process for creating a Fedora repository.
    It relies on the yum commands, so you''ll learn the details in Chapter 7. For
    the most part, this section is a high-level overview; it can help you contrast
    the'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Consolidating Patches on a Red Hat/Fedora Network Chapter 2


    requirements for patch management for networks based on Fedora, RHEL, and RHEL
    rebuild distributions.


    If you are configuring a repository, it''s normally best if you create a dedicated
    partition for that repository. This section assumes that you''ve installed a new
    hard drive for this purpose and details the steps that you would take to create
    a dedicated partition.


    # 2.1.1 Installation Requirements


    Unlike the Red Hat Network Proxy Server, there are no specific hardware requirements
    for a Fedora repository. Software requirements are fairly minimal. But the demands
    on a Fedora-based repository are the same. Other Fedora computers on your network
    will pull updates from your local repository on a regular basis. Therefore, on
    a Fedora-based patch repository, you should consider the following:


    # Hardware


    An ideal repository computer should meet the requirements associated with a Red
    Hat Network Proxy Server, as described in Chapter 1. To review, while CPU speed
    is less important, you should have a computer with the following:


    +   - Fast hard drive access; because any local cache of patches fills gigabytes
    of space, you''ll want a computer that can pull updates quickly.


    +   - Fastest possible network connections; if dozens of computers download updates
    from your repository simultaneously, they need to share bandwidth across your
    LAN.


    +   - Extra RAM cache updates, which can help minimize the requirements on the
    hard drive(s).


    # Hard Drive Partitions


    When you configure Fedora as a patch management computer, in this way, other programs
    that you install and other services with ever-growing log files won''t crowd out
    your repositories (or vice versa).


    Normally, patches are downloaded to the /var directory. Red Hat, Fedora, Debian,
    and SUSE all follow this convention. Red Hat and Fedora patch RPMs are normally
    downloaded to /var/cache/update and then deleted after the RPMs are used to update
    your system. As you learned in Chapter 1, Fedora clients are configured through
    files such as /etc/yum.conf or in the /etc/yum.repos directory to pull updates
    from FTP or HTTP servers.


    Therefore, most administrators create Fedora repositories on a local FTP or HTTP
    server. The default directories for associated files are /var/ftp/pub and /var/www/html.
    If you want protect the space assigned to your repositories, you''ll want to dedicate
    a partition for this purpose.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# 2.1 Creating Your Own Fedora Repository


    > Note

    You can also use an NFS server as a repository. I focus on HTTP and FTP because
    the details are more intricate.


    Space Requirements

    Compared with the space available on the latest inexpensive hard drives, the space
    required for a Fedora repository is not terribly significant. All you need room
    for the operating system and the repository. However, if you manage multiple repositories
    for multiple versions of Fedora on more than one architecture, you can still run
    out of room quickly. It''s best if you plan ahead. If you plan to reinstall Fedora
    on your computers every time a new version is released, the requirements are straightforward;
    one possible scenario with an installation and update repository for x86 systems
    is shown in Table 2-1. This is just a hypothetical breakdown; I''ve tried to be
    generous with space requirements.


    Table 2-1 Possible Fedora repository space requirements: one release, one architecture


    | Requirement | Space | Description |

    | --- | --- | --- |

    | Fedora Core | 3GB | Typical installation with GUI, without all services |

    | Installation Repository | 2.5GB | Fedora Core files typically require four CDs
    |

    | Update Repository | 5GB | Some packages are patched multiple times during the
    life of a distribution. It can be helpful to keep older updates in case of trouble
    |


    That doesn''t seem bad. With these requirements, it seems like you can install
    a Fedora repository on an older computer with a 10GB hard drive. As long as you
    make sure that your network can handle the load, this seems to be sufficient.
    But you need to consider additional factors:


    +   - As noted on fedora.redhat.com, releases are planned every four to eight
    months. Updates are made available for about a full year afterwards. If you don''t
    install any new version of Fedora, the update repository requirements may double
    or more.

    - If you want to maintain a Fedora update repository for more than a year, you''ll
    have to reconfigure your repository for Fedora Legacy updates. The space requirements
    increase accordingly. You may also need to reconfigure the associated configuration
    files. For more information, see www.fedoralegacy.org.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'As you bring new computers online, you may want to install later releases of
    Fedora. Each release requires its own installation and update repository, which
    could double associated space requirements yet again.


    Fedora is also available for 64-bit x86-64 systems. If you want to install and
    maintain Fedora on these computers (and continue to maintain 32-bit systems),
    the requirements on your installation and update repositories might double yet
    again.


    Personally, I enjoy installing Linux on my computers. However, preserving the
    configuration and personal files associated with older versions can be a tedious
    process. After Linux is installed, you may not want to install another version
    until there are significant changes, such as a major kernel. It is normally two
    or three years between major kernel releases (such as between versions 2.4 and
    2.6). By then, you could be maintaining client computers with multiple architectures.
    It''s easy to see how a repository could grow hundreds of gigabytes.


    # Creating a Dedicated Partition During Installation


    It is easiest to configure partitions for Fedora during the installation process.
    The Disk Drill screen shown in Figure 2-1 allows you to dedicate partitions or
    volumes to your choice.


    ![](img/e178bfcea0b6629d1234b59342d4d686_67_0.png)


    Figure 2-1 You can configure partitions with Fedora Disk Drill


    In Disk Drill, just click Add, and then you can assign a directory such as /var/ftp
    to a partition such as /dev/hda5. Alternatively, if there''s room on a Logical
