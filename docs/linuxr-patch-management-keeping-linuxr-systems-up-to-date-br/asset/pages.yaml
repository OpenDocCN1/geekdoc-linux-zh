- pgno: 92
  md: "# 2.2 Configuring a Red Hat Network Proxy\n\n# Reconfiguring the Update Agent\n\
    \nAfter all this talk about the Proxy Server, there's one possible surprise: it\
    \ is not a proxy server for your clients. (For details, see the note at the beginning\
    \ of this chapter.) You won't configure your clients' Update Agent for a proxy\
    \ server (unless you configured one on a different computer, between your client\
    \ and your Red Hat Network Proxy).\n\nYou could potentially reconfigure the Update\
    \ Agent in the GUI with it to modify any of the settings you need. Alternatively,\
    \ you could reconfigure the Update Agent from the command line interface using\
    \ the up2date-node --config command. But as you can see yourself, the interface\
    \ is relatively inconvenient.\n\nThe best way to fully reconfigure the Update\
    \ Agent is to open its configuration file, /etc/sysconfig/rhn/update. In that\
    \ file, you'll want to change three settings. The defaults are as follows, which\
    \ pull updates through the Internet from Red's servers:\n\n```\nnSSLServerURL=http://xmlrpc.rhn.redhat.com/XMLRPC\n\
    serverURL=https://xmlrpc.rhn.redhat.com/XMLRPC\nsslCACert=/usr/share/rhn/RHNS-CA-CERT\n\
    ```\n\nYou'll need to change these parameters. For example, my proxy server has\
    \ a FQDN of enterprise3d.example.com, so I've changed the following parameters\
    \ in my version of /etc/sysconfig/rhn/up2date: \n\n```\nnSSLServerURL=http://enterprise3d.example.com/XMLRPC\n\
    serverURL=https://enterprise3d.example.com/XMLRPC\nsslCACert=/usr/share/rhn/RHNS-ORG-TRUSTED-SSL-CERT\n\
    ```\n\n# Automating Updates (Local and Remote)\n\nYou can configure updates remotely\
    \ through the Red Hat Network. Details are beyond the scope of this book. However,\
    \ the general procedure is straightforward:\n\n+   1. Log into your Red Hat Network\
    \ account.\n2. Configure the systems that you want to administer in one group.\n\
    3. Click Systems, followed by System Groups.\n4. Select the group you've configured\
    \ for this purpose.\n5. Select Work With Group.\n6. Click Provisioning, followed\
    \ by Remote Command, which takes you to the screen shown in Figure 2-12."
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Consolidating Patches for a Red Hat/Fedora Network Chapter 2


    ![](img/e178bfcea0b6629d1234b59342d4d686_93_0.png)


    **Figure 2-12** Configuring commands for a Red Hat Network group


    7. Enter the commands of your choice. As you can see in the figure, I''ve entered
    the `update2date -u` command; as soon as each system in your group checks in,
    it''ll automatically update the system per the latest requirements.


    # Potential Problems


    If there are problems after you''ve followed the instructions described in this
    chapter, there are a number of things you can do.


    +   - Run the `update2date -u` command from the client line interface. Check for
    error messages in the output.

    - Inspect the log files in the `/var/log/rhn` directory. The `rhn_proxy_broker.log`
    file notes attempted connections, with possible errors. The `rhn_redirect.log`
    file notes requests that are actually redirected to the Red Hat Network.

    - If you don''t see expected entries in the `rhn_proxy_broker.log` file, there
    may be a problem on your LAN, least between your Proxy Server and client.

    - Make sure the services associated with the Proxy Server are running with the
    `service rhn-proxy status` command. You should see services associated with the
    Web server (`httpd`), the Proxy Server (`squid`), and the Jabber router (`jabberd`).

    - Try accing the Proxy Server Web site. Open a browser from a client, and navigate
    to the Proxy Server FQDN or IP address. You should see a page similar to Figure
    2-11.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# 2.3 Configuring Red Hat Rebuilds


    +   Try a rhn_check command from your Proxy Server computer. If successfully-connect
    upstream to a Satellite or the Red Hat Network, it''ll run any pending commands
    that you may have configured through your Red Hat account.


    +   Rerun the configuration commands described in this chapter. You might find
    that you''ve installed the SSL certificate on the wrong computer.


    While this is far from a comprehensive list, I personally ran into a few problems
    during this process:


    +   Connection problems noted on a client should have a corresponding message
    in `/var/log/rhn/rhn_proxy_broker.log` file. A refused message identify problems
    with the SSL keys that you installed on the Proxy Server''s `/etc/httpd` directory
    or the SSL key on the client''s `/usr/share/rhn` directory.


    +   If there''s a problem in `rhn_proxy_broker.log`, it should be associated with
    an ERROR message in this file. The Web server needs access to `/etc/sysconfig/rhn_systemid`;
    you might need to change ownership or permissions to this file. If there''s a
    problem accessing the upstream Red Hat Network (or Satellite) server, you''ll
    see it, and you might have a network problem on the Proxy Server computer.


    +   A successful connection to the Proxy Server should be shown in the `/var/log/rhn/rhn_proxy_redirect.log`
    file.


    # 2.3 CONFIGURING RED HAT REBUILDS


    As discussed in Chapter 1, there are a number of groups that have built their
    own distributions (without the Red Hat trademarks) from RHEL source code. As you''ve
    built from source code published by Red Hat, your distributions are known as rebuilds.
    When Red Hat releases an update, it releases updated source code. In many cases,
    you can build your packages from Red Hat source code and update your rebuild distribution.


    However, this isn''t always true. The rebuild does not have access to the tools
    as the developers at Red Hat. There are often differences in the resulting distributions,
    which go beyond the trademarks.


    For example, when I loaded the source code associated with a rebuild kernel, there
    were dependencies. I had two choices. I could have searched for the packages built
    for the rebuild which would satisfy those dependencies. Instead, I had the packages
    built by Red Hat handy and used those instead. That did not work. The source code
    for the rebuild distribution would not install until I included dependent packages
    customized for that distribution.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'In other words, if you administer patch management on a network with rebuild
    distributions, it''s important to configure your updates for repositories with
    packages built for the rebuild distribution.


    Just to give you a feel for this process, I describe how you can configure updates
    from the RHEL builds to the right repositories. Naturally, because the rebuild
    do not offer subscriptions to the Red Hat Network, one other major difference
    is their techniques for patch management. The process is similar to what you learned
    about in Chapter 1 for Fedora Linux.


    # Note


    Don''t use the rhn_register command for the rebuild distributions. It tries to
    register your computer on the Red Hat Network, which requires a subscription.
    And if you have a subscription, you probably don''t want to be running a rebuild
    distribution in the first place.


    Unlike the other sections in this chapter, I do not describe how you can create
    a local patch repository for your LAN. You can learn about this process with the
    apt and yum tools in the last half of this book.


    In the following sections, I''ll show you how to keep two of the "rebuild" distributions
    up to date; one uses yum, the other user apt. You can use the techniques described
    in Chapters 4 through 7 to create apt or yum repositories needed for these rebuild
    distributions.


    # 2.3.1 CentOS


    My personal favorite rebuild version of RHEL is CentOS-4. This popular rebuild
    goes by a number of names. The proper name of the group is the CAos Foundation.
    CentOS 2, 3, and 4 are rebuilds of RHEL 2.1, 3, and 4 (with Red Hat trademarks
    removed).


    The basic steps are as follows:


    +   1. Identify your Update Agent configuration files; they are associated with
    files in the /etc/sysconfig/rhn directory.



    +   2. In addition, if you want to configure yum updates you can do so in the
    files in the /etc/yum.repos.d directory.


    +   3. Find one or more preferred mirror sites for downloads.


    +   4. Identify the repositories that you want to keep up to date.


    +   5. Revise your yum configuration files to point to those repositories.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# 2.3 Configuring Red Hat Rebuilds


    If you want to use update, as with Fedora or RHEL, you can cite or add repositories
    to the /etc/sysconfig/rhn/sources file.


    Alternatively, the cAOs are configured to use your yum repositories. As of this
    writing, the default version of CentOS-4''s yum.conf configuration files cite
    the repositories in /etc/yum.repos.d/CentOS-base.repo file. Some older versions
    of CentOS linked yum.conf to centos-yum.conf for repository lists.


    # Note


    Alternatively, apt is available with CentOS, and you can use the techniques described
    in Chapter 4 to update from apt repositories.


    As with Fedora Linux, it is in your best interest to revise your yum configuration
    files to point to mirrors closer to your location. First, because cAO is a volunteer
    organization, they''ve had to ask for contributions to pay for all the downloads
    from their servers. Second, for the reason described in Chapter 1, downloads from
    servers physically closer to your network are faster. You will have to wait for
    Chapters 5 and 7 for instructions on how to create apt or yum repositories on
    your networks.


    Before you revise your yum configuration files, find one or more preferred mirrors.
    The cAO list of mirrors is available from www.caosity.org/download/mirrors. Their
    "Tier 1" mirrors connect to the Internet to OC3, which corresponds to about 155Mbps.
    Naturally, this bandwidth is shared with others who may be downloading simultaneously.


    # Note


    If you''re downloading a distribution for the first time, you may be interested
    in Bittrent, which supports large file downloads from multiple sources. Download
    CentOS-4 ISO file with their distribution (2GB+) in just over an hour on my home
    connection. However, not all Linux distributions support Bittrent. For more information,
    see www.bitt.com.


    As an example, inspect the mirror in Figure 2-13. The URL is the start of what
    you enter as a baseurl in /etc/yum.repos.d/CentOS-base.repo file. The $release
    is 4.0. The subdirectories are as shown, and you can (and should) double-check
    that what you corresponds to an available directory on your selected mirror.


    If you want to use the update commands, you''ll also want to modify the yum commands
    in /etc/sysconfig/rhn/sources to configure updates from the mirror of your choice.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Consolidating Patches on a Red Hat/Fedora Network Chapter 2


    ![](img/e178bfcea0b6629d1234b59342d4d686_97_0.png)


    **Figure 2-13** Aaos Mirror Site


    After you select a mirror, select the repositories that you want to keep up to
    date. The standard settings in /etc/yum.conf refer to .repo files in /etc/yum.reposd
    directory. For example, the Georgia Updates repository, you can navigate to


    ```

    ftp://ftp.gtlib.gatech.edu/pub/cAos/centos/4.0/updates/i386/

    ```


    You should find RPMS, headers, and repodata subdirectories in each repository.
    The $releasever comes from the centos-release RPM package, which is 4.0. The $basearch
    comes from the uname -i command. Thus, you could edit the [update] stanza in your
    CentOS-Base file to read


    ```

    baseurl=http://ftp.gtlib.gatech.edu/pub/cAos/centos/$releasever/updates/$basearch/

    ```


    You can add URLs from additional [update] mirrors below this line, such as


    ```

    http://caos.oregonstate.edu/$releasever/updates/$basearch/

    ```


    When you complete, you can use the yum to keep your system updated. Alternatively,
