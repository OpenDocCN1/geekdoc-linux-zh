  md: '# 6.3.6 Getting Information


    You can get more information on any available or installed package from your repositories.
    By itself, the yum info command is useless, except possibly as a database of package
    information. However, if you want information on an uninstalled package, you can
    get more with the yum packageName command. For example, if you want more information
    on the madwifi package, and it''s available from a configured repository, try
    the following command:


