- pgno: 182
  md: '# 5.2 Configuring apt for RPM


    ![](img/e178bfcea0b6629d1234b59342d4d686_182_0.png)


    Figure 5-5 Synaptic progress


    # 5.2.5 Configuring apt for SUSE Linux


    The SUSE Linux implementation of apt is similar to that for Fedora. While the
    packages you install, the results are similar in terms of the commands that you
    can run, as well as the way Synaptic interacts with your system. Namely, you''ll
    need apt-enabled mirrors configured for your version of SUSE Linux.


    As with Fedora Linux, you''ll have to configure the mirrors yourself. You could
    use the directives in the /etc/apt/sources.list file:


    ```

    rpm fpt://mirrors.matematik.uni-bielefeld.de/pub/linux/suse/apt/

    SUSE/10.0-i386 base update security rpmkeys

    rpm fpt://ftp.gwdg.de/pub/linux/suse/apt/SUSE/10.0-i386 base update security rpmkeys

    ```


    This would connect your computer to the base repository, as well as updates and
    security-related changes for your distribution.

    If you''re into experiments, you could use the sample /etc/apt/sources.list file
    available from ftp.gwdg.de. For SUSE Linux Professional 10.0, you can find this
    file in the following subdirectories: pub/linux/suse/apt/SUSE/10.0-i386/examples/.
    This file includes the following very long command:


    ```

    rpm ftp://ftp/pub/linux/suse/apt SUSE/10.0-i386 suser-guru

    packman packman-i686 kernel-of-the-day suser-projects rpmkeys java

    update-drpm update-prpm update kde gnome mozilla openoffice

    samba3 suser-agrarideret suser-rberos suser-crauch suser-jengelh suser-gbv

    usr-local-bin suser-tcoucin suser-scorot suser-scrute suser-jogleyr

    kraxel wise sue-people kde3-unde-stable security-prpm

    security

    ```


    # Note


    Now that SUSE has committed to support apt, at least in SUSE 10.0 the number of
    alternative repositories will soon hopefully increase. One alternative repository
    available as of this writing is fpt://opensuse.linux.co.nz.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# As you''ve probably observed, the commands in /etc/apt/sources.list follows
    a specific format:


    Package type / URL / Subdirectory / Repository section / Repository section ...


    In this case, the package type is rpm; the URL is the FTP site shown; the repositories
    are stored in the SUSE subdirectory. If you want to create your own repository,
    you''ll need to learn more. Navigate to the subdirectory on the noted URL, in
    this case, ftp://apt.gwde.pub/apt/SUSE/10.0/i386/ You''ll find subdirectories
    for each of the noted repositories.


    You normally won''t configure apt to acquire updates from all sections. In fact,
    several sections may have no files. Many of these repositories include test packages
    from specific developers; some of them are SUSE employees. Therefore you might
    want to limit the repository sections in your /etc/apt/sources.list to those suggested
    in Table 5-2. (These sections are subject to change; you might not see every section
    shown in the Table in the repository list for SUSE 10.0.) You might want to review
    all sections; SUSE might include important packages in other sections.


    # Table 5-2 Sample samples from SUSE''s apt repository


