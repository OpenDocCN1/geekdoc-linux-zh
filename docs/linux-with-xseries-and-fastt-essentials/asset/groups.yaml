    72 Linux with xSeries and FastT - Essentials


    ## Storage Partitioning Wizard - Introduction


    A storage partition is a logical entity consisting of one or more logical drives
    that are shared by a group of hosts or exclusively accessed by a single host.
    This wizard ensures you have already created your logical drives and defined your
    host groups and/or hosts using the appropriate Mappings>Define menu items (refer
    to online help). This wizard will guide you through the steps to specify what
    hosts, logical drives (and their associated unit numbers) should be included in
    this partition.


    ![](img/69bfe4e2d59e61df50eecde9154775d5_88_0.png)


    Figure 5-25 Storage Partitioning Wizard


    Select a Host Group or select Host for this partition. Click Next (Figure 5-26).


    ## Storage Partitioning Wizard - Select Group or Host


    Select the host group or host you want included in this partition. If you select
    a host group, the hosts will share access to the logical drives you indicate in
    the next screen.


    ![](img/69bfe4e2d59e61df50eecde9154775d5_88_1.png)


    Figure 5-26 Select Host Group or Host


    Select the logical drives to include in the partition and assign LUN IDs. These
    IDs must start at zero and continue sequentially without skipping a number. If
    you later remove a LUN you must re-assign the LUN IDs (Figure 5-27).


    ![](img/69bfe4e2d59e61df50eecde9154775d5_89_0.png)


    Figure 5-27 Select Logical Drives/LUNs screen


    Highlight the logical drives to be included and click **Add** (Figure 5-28). Once
    you have added all the required logical drives, click **Finish**.


    ![](img/69bfe4e2d59e61df50eecde9154775d5_89_1.png)


    Figure 5-28 Logical drives added


    The Access LUN (31) will probably be listed under **Defined** in your new Host
    Group. This LUN is used by other operating systems. Delete this LUN as it may
    cause problems with multipathing under Linux. Highlight **LUN31**, press Delete,
    click **Yes** to confirm.


    As final step you have to reboot your system. If you want an automatic mount of
    your volumes you have to enter the appropriate parameters in /etc/stab.


    > **Important:** Remember to make a copy of the system profile. For more Storage
    Area Networks, please consult any of several IBM Redbooks.


    ## Management Suite Java


    This appendix contains a description of FAST Management Suite Java Diagnostic
    and Configuration Utility, MSJ software is used to manage paths available from
    fibre-attached hosts to storage.


    ## B.1 MSJ


    If your installation uses an IBM Host Bus Adapter, then you will use the IBM HBA
    driver. If you have multiple paths to your storage, this driver can provide fail-over
    capability, but the paths must be configured. This is the function of IBM Management
    Suite Java (MSJ) Diagnostic and Configuration Utility. This allows you to view
    the current HBA configuration, attached nodes, LUNs, allows you to configure paths
    and perform some diagnostics.


    MSJ has a GUI component. It also has an agent that runs on the host containing
    the HBAs. The agent, q-remote, is quite small but the GUI is rather large, so
    allow sufficient space (50 MB) for unpacking and installing the product.


    ### B.1.1 Installing MSJ


    Obtain the latest version of the IBM MSJ from the Web.


    The MSJ version is closely tied with the HBA version. Ensure that you have the
    correct version. Extract the gzipped file:


    ```

    tar zxv *.tgz

    ```


    This will extract the required files to ./FASIT_MSJ/Linux


    As root, install MSJ using the following command:


    ```

    sh ./FASITMSJ_install.bin

    ```


    You should see a screen similar to Figure 5-29.


    ![](img/69bfe4e2d59e61df50eecde9154775d5_91_0.png)


    Figure 5-29 Installation Splash screen


    You should then see the Introduction screen and click Next and continue through
    the License screen and the Readme screen.


    ![](img/69bfe4e2d59e61df50eecde9154775d5_92_0.png)


    Figure 5-30 FASIT_MSJ Introduction screen


    The next screen (Figure 5-31) allows you to choose features of the product you
    wish to install. You have four choices:


    - GUI and Union Agent - this installs both on one system

    - GUI - console for remote administration

    - Linux Agent - systems to be managed remotely

    - Custom - to customize the components to be installed


    The default selection installs the GUI and Linux Agent. **Next**.


    ![](img/69bfe4e2d59e61df50eecde9154775d5_92_1.png)


    Figure 5-31 Product Features screen


    Next, you are prompted for a location in which to install the software. The default
    folder is /opt/IBM_FASIT_MSJ. Click Next to accept the default, or choose a different
    location according to your preference. Software installation will take a few moments.


    Once installation is complete, click **Done.**


