    ## ## 4.4 Premium Features


    Premium Features are advanced features of the IBM TotalStorage FASIT Storage Server
    and must be purchased separately. These extra features include:


    - Storage partitioning

    - FlashCopy®

    - Remote Volume Mirroring

    - VolumeCopy


    > Note: Premium Features are a function of the IBM TotalStorage FASIT Storage
    Server firmware, and are usable from Linux attached hosts in the same manner as
    they would be from a host that is running any of the supported host operating
    systems.


    ### ### 4.4.1 Introduction to storage partitioning


    Storage partitioning adds a high level of flexibility to the FASIT Storage Server.
    It allows you to connect a much higher number of host systems, either in standalone,
    or clustered mode.


    Intel-based host systems connected to the FASIT Storage Server usually run an
    operating system with limited storage handling capabilities. Most of these operating
    systems can only treat the storage as if it was locally attached to the host system.
    Two or more individual host systems or clusters cannot access the same storage
    space, at least without disastrous results, unless third-party file sharing software
    is used. This is in conflict with the idea of SAN, where the storage is supposed
    to be globally accessible to many host systems.


    Without storage partitioning, the logical drives configured on a FASIT Storage
    Server can only be accessed by a single host system or a single cluster. This
    can surely lead to inefficient use of storage hardware.


    Storage partitioning, on the other hand, allows you to create sets containing
    the hosts with their Host Bus Adapters and the logical drives. We call these sets
    storage partitions. Now the hosts can only access their assigned logical drives,
    just as if these logical drives were locally attached to them. You can connect
    multiple hosts or clusters using the popular Intel-platform operating systems
    to the same FASIT Storage Server. Storage partitioning adapts the SAN idea of
    globally-accessible storage to the local-minded operating systems.


    A storage partition contains several elements:


    - Logical drive mappings

    - Hosts or groups

    - Host ports


    A host group is a collection of hosts that are allowed to access the same logical
    drives, for an example of two systems.


    A host is a single system that can be contained in a host group.


    A host port is the FC port of the Host Bus Adapter in the host system. The host
    port is identified by its world-wide name (WWN). A single host can contain more
    than one port. If you attach the servers in a redundant way (highly recommended),
    each server needs two Host Bus Adapters. That is, it needs two ports within the
    same host system.


    The FASIT Storage Server only communicates through the use of the WWN. The storage
    subsystem is not aware of which Host Adapters are in the same server or in servers
    that have a certain relationship, such as a cluster. The host groups, the hosts,
    and their host ports actually reflect a logical view of the physical connections
    of your SAN as well as the logical connection between servers, such as clusters.


    With the local setup defined previously, mappings are specific assignments of
    logical drives to particular host groups or hosts.


    The storage partition is the combination of all these components. It ensures proper
    access to the logical drives even if there are several hosts or clusters connected.


    With FASIT Storage Manager you have the ability of FASIT Storage Servers to support
    up to 64 storage partitions. For number of maximum storage partitions for specific
    FASIT model see Figure 4-2.


    Table 4-2 Currently supported maximum storage partitions


    | FASIT Model | Number of supported partitions |

    |---|---|

    | FASIT 200 | 16 |

    | FASIT 600 | 1, 4 or 8 - 64 on Turbo |

    | FASIT 700 | 64 |

    | FASIT 900 | 64 |


    > Note: That on some FASIT models, the number of partitions also depends on the
    (feature) licences that have been purchased.


    ## ## 4.4.2 Introduction to FlashCopy


    A FlashCopy logical drive is a point-in-time image of a logical drive. It is the
    logical equivalent of a complete physical copy, but you create it much quickly
    than a physical copy and requires less disk space. In this release of the storage
    management software, the logical drive from which you are basing the FlashCopy,
    called the base logical drive, must be a standard logical drive in your storage
    subsystem. Typically, you create a FlashCopy so that an application, for example,
    a backup application, can access the FlashCopy and read the data while the base
    logical drive remains online and user-accessible. When the backup completes, the
    FlashCopy logical drive is no longer needed.


    You can also create several FlashCopy of a base logical drive and write data to
    the FlashCopy logical drives in order to perform testing and analysis. Before
    upgrading your database management system, for example, you can use FlashCopy
    logical drives to test different configurations. Then you can use the performance
    data provided by the storage management software to help you decide to configure
    your database system.


    When you take a FlashCopy, the controller suspends I/O to the base logical drive
    for a few seconds while it creates a physical drive called the FlashCopy repository
    logical drive to store FlashCopy metadata and copy-on-write data. When the controller
    is finished creating the FlashCopy repository logical drive, I/O write to the
    base logical drive continues. However, before a data block on the base logical
    drive is modified, a copy-on-write occurs, copying the contents into the FlashCopy
    repository for safekeeping. Since the FlashCopy repository logical drive stores
    copies of the original data in that drive without another copy-on-write. And,
    since the only data blocks that are physically stored in the FlashCopy repository
    logical drive are those that have changed since the time of the FlashCopy, the
    FlashCopy technology uses less disk space than a full copy.


    When you create a FlashCopy logical drive, you specify where to create the FlashCopy
    repository logical drive, its capacity, and other parameters. You can disable
    the FlashCopy when you are finished with it, for example after a backup completes.
    Then, you can re-create the FlashCopy the next time you do a backup and reuse
    the same FlashCopy repository logical drive. Using the Disable FlashCopy and Re-create
    FlashCopy pull-down menu options provides a shortcut to creating a new FlashCopy
    logical drive because you do not need to create a new FlashCopy repository logical
    drive.


    # Base Logical Volume Repository Volume Data


    ![](img/69bfe4e2d59e61df50eecde9154775d5_62_0.png)


    Figure 4-8 FlashCopy read and write schema


    You can also delete a FlashCopy logical drive, which also deletes the associated
    FlashCopy repository logical drive. The storage management software provides a
    warning message when your FlashCopy repository logical drive near a user-specified
    threshold (percentage of its full capacity, the default is 50%). When this condition
    occurs, you can use the storage management software to expand the capacity of
    your FlashCopy repository logical drive from free capacity. If you are out of
    free capacity on the array, you can add unconfigured capacity to the array in
    order to expand the FlashCopy repository logical drive.


    > Note: FlashCopy is a premium feature. Contact your IBM reseller or IBM marketing
    representative for more information.


    ## 4.4.3 Introduction to Remote Mirroring


    The Remote Mirror option is a premium feature that comes with the IBM FASIT Storage
    Manager 8.2, or newer, software, and is enabled by purchasing a premium feature
    key. The Remote Mirror option is used for online, real-time replication of data
    storage subsystems over a remote distance. In the event of a disaster or unrecoverable
    error at one storage subsystem, the Remote Mirror option enables you to promote
    a second storage subsystem to take over responsibility for normal input/output
    (I/O) operations (Figure 4-9).

