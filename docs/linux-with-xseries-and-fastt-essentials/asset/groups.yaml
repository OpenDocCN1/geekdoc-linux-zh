    # High-performance cluster management


    IBM offers Cluster Systems Management (CSM) for Linux, advanced cluster management
    software that allows a cluster to be managed from a single point-of-control. This
    simplifies the management of the cluster, enabling it to scale up easily, and
    helping to improve the efficiency of the system administrator. The CSM infrastructure
    monitors hardware and software events, triggering automated recovery action when
    appropriate. By providing a single point-of-control for a cluster, CSM can dramatically
    simplify total systems management, enabling a cost-effective approach to server
    consolidation solutions.


    # Advanced server technology


    Cluster 1350 is based on X-Architecture™ technology from IBM, which incorporates
    some of the availability features of the IBM zSeries™ 900 server, and as, these
    industry standard processor-based servers are designed to provide enterprise-inspired
    power, scalability, control, and service at very attractive prices.


    Cluster 1350 significantly reduce the number of nodes in each system, to speed
    upgrades while lowering costs. In addition, an integrated systems management processor
    enables CSM to remotely manage the system nodes for enhanced server productivity.
    System administrators specify which nodes to monitor and what actions to take
    in the event of memory, processor, hard drive, fan, or power issues.


    Standard configurations of the Cluster 1350 include a management node, up to 512
    cluster nodes, and up to 32 optional storage nodes that provide shared file storage.
    Large non-standard configurations are available by special bid. Each Cluster 1350
    includes a management Ethernet VLAN for secure interne communication, a cluster
    Ethernet VLAN for application interne communication, and a terminal server network.
    The cluster stands with one 10/100 Mbps Ethernet switch for the management VLAN,
    and a choice of the 10/100 Mbps Ethernet switch, Gigabit Ethernet switch, or Myrinet-200
    switch for the cluster VLAN.


    # 3.5 Consolidation


    There are four types of workload consolidation (also referred to as server consolidation).
    Each type offers significant benefits in the following areas:


    +   - Reduced administrative costs because of central management

    - Better management of system proliferation and more consistent architecture

    - Management of purchasing to achieve volume purchasing discounts

    - Consistent process for security, operating system levels, and updates


    The four types of consolidation are:


    +   - Consolidating multiple systems previously spread around the enterprise into
    fewer, centralized locations

    - Consolidating many systems into a reduced number of larger servers

    - Consolidating data

    - Consolidating applications


    # 3.5.1 Consolidating multiple systems previously spread around the enterprise


    For this type of consolidation, xSeries and Linux together provide the following
    benefits:


    +   - Reduced floor space: The xSeries features rack-dense solutions and cable-chaining
    technology.'
