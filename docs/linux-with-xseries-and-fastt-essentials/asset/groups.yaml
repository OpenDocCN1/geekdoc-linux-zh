    \ features offered by the X-Architecture, and for which IBM has developed drivers\
    \ supporting a Linux environment.\n\nTable 3-1 IBM supports native Linux\n\n|\
    \ Functions | Supported by Linux |\n| --- | --- |\n| Active PCI (hot-add and hot-swap)\
    \ | IBM-supplied drivers for Linux |\n| Redundant NIC | IBM-supplied drivers for\
    \ Linux |\n| Advanced Systems Management processors | IBM-supplied drivers for\
    \ Linux |\n| IBM Director 4.1 | IBM supports native Linux |\n| Storage area network\
    \ (SAN) | IBM-supplied drivers for Linux |\n\n### 3.2.1 Enterprise X-Architecture\
    \ with Linux\n\nWith support for both Microsoft and Linux operating systems, the\
    \ application flexibility of xseries is extended. The hardware is optimized for\
    \ the latest industry platforms. This enables customers to choose from a broad\
    \ portfolio of applications to best suit their business needs. To further enhance\
    \ flexibility, its physical partitioning, and a common design platform help to\
    \ ease the transition from 32-bit to 64-bit high-computing.\n\nNew tools make\
    \ systems management easier than ever before. With self-diagnosis and self-healing\
    \ technologies, as Active PCI-X and third-generation Chipkill memory, systems\
    \ are designed to stay up and running continuously. The xSeries server provides\
    \ high availability and exceptional performance for systems that need to be scaled\
    \ quickly, easily, and inexpensively. Table 3-2 shows the Linux support that is\
    \ available for Enterprise X-Architecture.\n\nTable 3-2 Linux support with Enterprise\
    \ X-Architecture\n\n| Functions | Correspondence by Linux |\n| --- | --- |\n|\
    \ XpOnDemand Scalability | Red Hat AS2.1, SuSE8.0 |\n| Remote I/O | Kernel-2.4.9-31\
    \ or later |\n\nTable 5-3 Linux X-Architecture technology enables the following\
    \ capabilities:\n\n- * XpOnDemand™\n- System partitioning\n- PCI-X I/O subsystem:\
    \ Active PCI-X\n- Remote I/O\n- Active Memory™\n  - 256 GB memory capacity\n \
    \ - High-speed (DDR) memory\n  - Memory: ProteXion™\n  - Chipkill™ memory\n  -\
    \ Memory mirroring\n  - Hot-add/hot-swap memory\n- 533 MHz front side bus (FSB)\n\
    - XceL4 Server Accelerator Cache\n- Real time diagnostics\n\nIn the following\
    \ section is a brief description of the X-Architecture capabilities mentioned\
    \ above. Please refer to Appendix A, \"Storage Manager and Linux\" on page 57.\n\
    \n## 3.3 xSeries blade servers: BladeCenter\n\nBlade servers are a relatively\
    \ new technology that has captured industry focus because of its modular design,\
    \ which can reduce cost with a more efficient use of valuable space, and its simplified\
    \ management, which can help to speed up such tasks as deploying, repositioning,\
    \ updating, and troubleshooting hundreds of blade servers. This can be done remotely\
    \ with one generic console using IBM Director systems management tools. In addition,\
    \ blade servers provide improved performance by doubling current rank density.\
    \ By integrating resources and sharing key components, not only costs will be\
    \ reduced, but availability will be increased as well. The BladeCenter is ideally\
    \ placed for High Performance Computing clusters and Wide farms. For more details\
    \ see the following Redpaper: The Cutting Edge: The IBM eServer BladeCenter, REDP5381,\
    \ and the redbook: IBM @server BladeCenter, Linux, and Open Source, SG24-7034-00.\n\
    \n![](img/69bfe4e2d59e61df50eecde9154775d5_41_0.png)\n\nFigure 3-2 IBM BladeCenter\
    \ Linux and SuSE Linux Enterprise Server provide enterprise class\n\nBoth Red\
    \ Hat Enterprise and SuSE Linux Enterprise Server provide enterprise class features\
    \ that enable Linux-based solutions to be deployed across the widest range of\
    \ enterprise IT environments.\n\nOn the xSeries pages, you will find the latest\
    \ drivers and firmware releases, as well as documentation about installation for\
    \ specific models.\n\nRemember to check also compatibility of your disk systems\
    \ by visiting:\n\n```\nhttp://www.storage.ibm.com/proven/index.html\n```\n\nCharacteristics\
    \ of the BladeCenter marketplace include:\n\n- **Server consolidation**: BladeCenter\
    \ is a great solution for a centralization-type server consolidation.\n\n- **HPC/grid\
    \ computing**: BladeCenter is extremely good for HPC environments with the highly\
    \ efficient Intel Xeon processors running the following workloads:\n  - Linux\
    \ cluster\n  - Genome\n  - Engineering Design Automation (EDA)\n  - Grid\n\n-\
    \ **Application server:** Since BladeCenter has the same performance and function\
    \ as a general-purpose server (for example, a SAN environment), the BladeCenter\
    \ becomes the optimum application server and can provide considerable space savings\
    \ in the following environments:\n  - File server\n  - Notes server\n  - WebSphere\
    \ Application Server\n\n## 3.4 Linux and xServers clustering\n\nIn its simplest\
    \ form, a cluster consists of two or more computers that work together to provide\
    \ a solution. It should not be confused with a more common client-server model\
    \ of computing where an application may be logically divided that one or more\
    \ clients request services of one or more servers. The idea behind clusters is\
    \ joining the powers of the nodes involved to provide higher scalability, more\
    \ computing power, or to build in redundancy to provide higher availability. So,\
    \ rather than a simple client making requests of one or more servers, clusters\
    \ utilize multiple machines to provide a more powerful computing environment through\
    \ shared images.\n\nClusters of computers must be somewhat self-aware, that is,\
    \ the work done on a specific node must coordinate with the work done on other\
    \ nodes. This can result in complex connectivity configurations and sophisticated\
    \ inter-process communications between the nodes of a cluster. In addition, the\
    \ sharing of data between the nodes of a cluster through a common file system\
    \ is almost always a requirement. There are many other complexities introduced\
    \ by clusters, such as the operational considerations of dealing with a large\
    \ number of clusters as a single resource.\n\nFor additional information, refer\
    \ to the following Web site:\n\nhttp://www.pc.ibm.com/weserver/xseries/clustering/info.html\n\
    \n### 3.4.1 Different types of clusters\n\nAs described, clusters may exist in\
    \ many different forms. The most common cluster types are:\n\n- High availability\
    \ (HA)\n- High performance computing (HPC)\n- Horizontal scaling (HS)\n\nIt should\
    \ be noted that the boundaries between these cluster types are somewhat indistinct,\
    \ and an actual cluster may have properties or provide the function of more than\
    \ one of these cluster types.\n\n## High availability\n\nHigh-availability clusters\
    \ are typically built with the intention of providing a fail-safe environment\
    \ through redundancy, that is, providing a computing environment where the failure\
    \ of one or more components (hardware, software, or networking) does not significantly\
    \ affect the availability of the application or applications being used. In the\
    \ simplest case, two computers configured identically with shared storage. During\
    \ normal operation, the application executes on one system, while the other simply\
    \ stands by ready to take over in the case of a failure. When failure occur, the\
    \ second system takes over the appropriate resources (storage, networking address,\
    \ and so on). This process is typically called failover. The second system then\
    \ completely replaces the failed system, and the end users have no need to know\
    \ that their applications are running on a different physical machine.\n\n![](img/69bfe4e2d59e61df50eecde9154775d5_43_0.png)\n\
    \n- Load Balancers: There must be a minimum of two for redundancy. Additional\
    \ units can be added for scalability. Example: Linux Virtual Server (LVS)\n- Web\
    \ Servers: There must be a minimum of two for redundancy. Additional units can\
    \ be added for scalability. Example: Apache\n- Application Servers: There must\
    \ be a minimum of two for redundancy. Additional units can be added for scalability.\
    \ Example: IBM WebSphere\n- Database Backend Servers: There should be a few for\
    \ redundancy. Additional units cannot be added easily so there should be faulty\
    \ robust. Example: IBM DB2\n\nNote: The Application Server condition can be included\
    \ in the DB/Backend Servers instead as separate units. A minimum configuration\
    \ be 6 units.\n\nFigure 3-3 A generic HA cluster\n\n## High performance computing\n\
    \nHigh performance computing clusters are designed to use parallel computing processing\
    \ to the solution of a problem.There are many examples of scientific computing\
    \ using multiple low-cost processors in parallel to perform large numbers of operations.\
    \ This is referred as parallel computing or parallelism. In How to Build a Beowulf:\
    \ A Guide to the Implementation and Application of PC Clusters (Scientific and\
    \ Engineering Computation), by Sterling, et al¹, parallelism is defined as the\
    \ \"ability of many independent threads of control many process simultaneously\
    \ towards the completion of a task.\"\n\n¹T.L. Sterling, J. Salmon, and D.J. Becker.\
    \ How to build a Beowulf: A Guide to the Implementation and Application of PC\
    \ Clusters. MIT Press, Inc., Cambridge, MA, 1999.\n"
