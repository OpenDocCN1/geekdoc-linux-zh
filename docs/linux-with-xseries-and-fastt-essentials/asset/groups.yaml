    高性能集群通常由大量计算机组成。高性能集群的设计是一项极具挑战性的过程，需要对各项项目进行仔细检查，例如大量计算机的安装、维护和管理；对同一文件系统的并行、并发和高性能访问的需求；以及节点之间为了协调必须并行执行的工作进程间通信（inter-process
    communication）。


    其目标是通过对大量离散的计算机进行管理、操作和协调，提供单机系统的映像。


    ![](img/69bfe4e2d59e61df50eecde9154775d5_44_0.png)


    图 3-4 通用高性能集群


    # 水平扩展


    水平扩展集群被用于为一组资源提供单一接口，这些资源的大小可以随时间推移任意增长（或收缩）。这种模式最常见的例子是 Web 服务器群。在此示例中，提供了一个单一接口（URL），但通过该接口进入的请求可以分配到大量的服务器上，从而提供更高的容量，并通负载均衡等功能管理终端用户体验。


    当然，这种集群提供了显著的冗余。如果大型服务器群中的某一台服务器发生故障，对用户来说可能是透明的。因此，这种模型也具有高可用性集群的许多属性。同样，由于工作在许多节点之间共享，它也是高性能计算的一种形式。


    ## 3.4.2 Linux 集群


    Linux 集群（在 Intel 处理器上）在学术界已非常流行。它们为计算机科学问题（如并行编程、并行工具开发和分布式系统管理）提供了一个廉价的平台。同时，基于
    Intel 处理器的 Linux 集群开始在政府和工业研究机构中出现，最初作为概念验证系统，现在已作为科学应用的生产环境机器。


    Linux 集群代表了更好的性效益机会，它利用了熟悉的架构和编程模型。使用经济高效的软件（如 Linux）以及在基于 Intel 的硬件上运行基于 Linux
    的程序（这些硬件（如 IBM xSeries 的机架式服务器），使得实现集群的总体成本远低于过去。因此，许多企业开始在以前认为成本不合理的环境中使用此类集群。


    ## 3.4.3 集成 Linux 集群：IBM eServer cluster 1350


    Cluster 1350 是一项集成化产品。它的设计旨在使其易于配置，并帮助企业快速部署应用程序。通过减少重组、集成、测试和调优 Linux 集群所需的时间和资源，Cluster
    1350 可以帮助组织缩短生产时间。


    ![](img/69bfe4e2d59e61df50eecde9154775d5_45_0.png)


    IBM 为 Cluster 1350 提供安装支持。如果需要更高水平的支持，可选的 Linux 集群支持线路（Support Line for Linux
    Clusters）由理解整个集群而非单个组件的专家组成。IBM 可以提供项目管理支持，以协调交付和安装的所有方面，包括硬件和软件设置服务。


    # 高性能集群管理


    IBM 为 Linux 提供了集群系统管理软件（CSM），这是一种高级的集群管理软件，允许从单一控制点管理集群。这简化了集群的管理，使其能够轻松扩展，并帮助系统管理员提高效率。CSM
    基础设施监控硬件和软件事件，在适当的情况下触发自动恢复操作。通过为集群提供单一控制点，CSM 可以极大地简化整个系统管理，为高效益的服务器整合解决方案提供可行方法。


    # 高级服务器技术


    Cluster 1350 基于 IBM 的 X-Architecture™ 技术，该技术整合了 IBM zSeries™ 900 服务器的一些可用性功能。而且，这些行业标准的基于处理器的服务器旨在以非常有吸引力的价格提供企业级的动力、可扩展性、控制能力和服务。


    Cluster 1350 显著减少了每个系统中的节点数量，在降低成本的同时加速升级。此外，集成系统管理处理器使 CSM 能够远程管理系统节点，以增强服务器生产力。系统管理员可以指定监控哪些节点，以及在发生内存、处理器、硬盘、风扇或电源问题时采取什么操作。


    Cluster 1350 的标准配置包括一个管理节点、多达 512 个集群节点以及最多 32 个提供共享文件存储的可选存储节点。大型非标准配置可通过特殊投标获得。每个
    Cluster 1350 包含一个用于安全内部通信的管理以太网 VLAN、一个用于应用程序内部通信的集群以太网 VLAN，以及一个终端服务器网络。集群配备一台
    10/100 Mbps 以太网交换机用于管理 VLAN，并在集群 VLAN 上可选 10/100 Mbps 以太网交换机、千兆以太网交换机或 Myrinet-200
    交换机。


    # 3.5 整合


    工作负载整合有四种（也称为服务器整合）。每种类型在以下领域提供显著收益：


    - 由于集中管理降低了管理成本

    - 这种架构和编程模型提供了更好的管理

    - 可扩展性

    - 安全


    整合的四种类型包括：


    - 将分散企业各处的系统整合到集中的位置

    - 将许多系统整合到较少的服务器

    - 数据整合

    - 应用程序整合


    ## 3.5.1 将分散企业各处的系统整合到集中的位置


    对于这种类型的整合，xSeries 和 Linux 结合提供了以下优势（针对单一环境）：


    - 减少地面空间：xSeries 提供了链式技术。

    - IBM Director：它包含一个名为 Updatepress 的功能，允许进行系统镜像和更新。

    - 工作负载管理解决方案：它们将高负载的系统重新调度到轻负载的系统。

    - 通过系统内部的冗余实现可用性：在整合环境中，我们可以为电源等配置冗余。现在，在整合环境中，我们可以处理来自可能需要离线的系统的工作。


