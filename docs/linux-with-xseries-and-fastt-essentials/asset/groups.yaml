    requirements changes.


    +   Virtual or physical partitioning: The xSeries server allows you to create
    virtual partitions, with its own ownership and I/O. In addition, VMware offers
    virtual partitions. With both partitioning configurations, failover between virtual
    or physical partitions is possible.


    +   This environment requires fewer administrators.


    +   This environment offers resource allocation, billing, and server-level agreements.


    +   VMware and virtual partitions: VMware offers several key benefits as you implement
    server consolidation. These benefits include:


    +   The ability to run Windows and Linux applications in one partition and Linux
