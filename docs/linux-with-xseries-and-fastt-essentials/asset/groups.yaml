    primarily in the Asia Pacific, Connectiva markets primarily in Latin America.
    Turbinux and Connectiva will provide bug fixes to their customers within 30 days
    of release by SuSE. SuSE is the leadLinux developer.


    Key elements of this distribution include POSIX asynchronous I/O (AIO), raw I/O
    enhancements that provide high-bandwidth, low-overhead SCSI I/O, and direct I/O
    that moves data directly from the user space buffer, and the device performing
    the I/O, avoiding expensive copy operations, and bypassing the operating system''s
    page cache.'
  - '[PAGE 22]


    Other functionality to focus includes Hyper-Threading to enable multi-threaded
    server software applications to execute threads in parallel within each individual
    server processor; large memory support to take advantage of the Intel Physical
    Address Extension to support up to 64 GB of physical RAM and the full 4 GB of
    virtual addressing space per process: Internet Protocol Version 6 (IPv6), the
    next generation protocol designed by the IETF to replace the current version Internet
    Protocol; and LDAPv3, the latest available Directory Services protocol for better
    user base management, and application integration for mail servers and authentication
    servers.'
