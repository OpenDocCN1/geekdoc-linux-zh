    # IBM and Linux


    This chapter discusses IBM''s commitment to the Linux and open-source community,
    and reviews available IBM services that help Linux customers gain the greatest
    advantage of a Linux-powered IBM @@@ solution. It offers a scope of the tremendous
    acceptance and commitment Linux has today.


    The resources portrayed here provide a good, consolidated starting point to more
    detailed information. We recommend that you read and learn about these resources
    to help you stay current with Linux''s commitments and new services, which continue
    to grow rapidly.


    The information in this chapter was correct at the time this book was written.
    However, some of the information may change due to normal variations in the life
    cycle of each product. This is true for products other than Linux as well. This
    means that IBM may not support a specific product even though it may appear to
    be supported in this chapter. Therefore, we encourage you to investigate topics
    such as end-of-service dates, product withdrawals, and other support restrictions
    while gathering information from this chapter.


    > **Important:** The services portrayed here are for IBM customers only, and may
    not be available in some specific countries or regions. Contact your local IBM
    Global Services (IGS) representative for details.'
  - '[PAGE 25]


    # 2.1 IBM''s commitment to Linux


    The history of IBM''s involvement with Linux is so large as to be outside the
    scope of this work. IBM is not a distributor of Linux. IBM is a contributor to
    Linux, a supplier of servers that run Linux, and a provider of support for customers
    who choose to use Linux. IBM''s commitment to Linux may be best illustrated with
    some of the many notable highlights over the last years:


    +   - As early as March 1999, IBM had announced key alliances, products, and global
    support for Linux, including among others like SuSE Holding AG (all of which founded
    United Linux along with distributor Connectiva S.A22), and Red Hat Software Inc.
    By Red Hat.


    +   - Linux made its debut on S3908 servers in May 2000, with commercial deployment
    by a major ISP for server consolidation shortly thereafter. In June, SuSE announced
    Linux for the R6500.


    +   - In 2001, IBM won honors at LinuxWorld for zSeries and iSystems running,
    completing the availability of Linux across the entire eServer product line. Complementing
    this was the announcement of a broad range of storage options for Linux servers,
    including the Enterprise Server (ESS) and Fibre Array Storage System (FASTIT)
    IBM''s Linux supercomputer systems were deployed in research and also in gas and
    oil exploration, and packaged clusters for ebusiness made their debut.


    +   - In 2002, continued emphasis on robust computing for small and medium businesses,
    server consolidation, network infrastructure, advertising, television, and life
    sciences strengthened IBM''s position as the most committed Linux player across
    all market segments. By December 2002 IBM had the eServer p60, the first pSeries
    dedicated to Linux support. Internally, IBM began migrating its own business-critical
    services to Linux, demonstrating both an indisputable commitment to, and demonstrated
    scalability of, Linux business solutions.


    +   - In 2003 IBM regularly announced new Linux hardware, ports of additional
    existing software to Linux, and new Linux and support options.


    # IBM industry leadership supporting Linux


    IBM has over $1 billion investment in the Linux community. IBM has the Linux Technology
    Center, IBM Research and Open Source Development Labs, and IBM Global Consulting
    and Support, which all contribute to the Linux and open source community.


    Linux support is growing the entire product line with support for TotalStorage
    disk and tape. IBM also supports middleware solutions for DB2®, Websphere, Lotus
    Domino®, MQSeries®, Tivoli® Storage Manager and more, and continues to work closely
    with leading Linux distributors.


    # Worldwide IBM commitment


    The $200 million Linux initiative in each of the Europe and Asia Pacific markets
    including the creation of Linux Porting Centers. These centers are located all
    around the world including Paris and Montpellier in France; Greenrock and Nursery
    in the UK; Boeblingen in Germany; Warsaw in Poland; Budapest in Hungary; Tokyo,
    Shanghai, Beijing, Taipei, Seoul, and Bangalore in the Asia Pacific; and U.S.
    centers in San Mateo, CA, Chicago, and Waltham, MA.


    IBM centers allow you key ISVs to transition their applications to Linux. IBM
    supports application development on all IBM servers.'
  - '[PAGE 26]


    # 2.1.1 The IBM Linux Technology Centers


    The IBM Linux Technology Center (LTC), whose mission is to work directly with
    the Linux development community with a shared vision of making Linux succeed,
    has one of the industry''s most comprehensive Linux development teams. They are
    a proven, accepted part of the open source Linux community, successfully bringing
    features into Linux. By doing so they provide Linux technical expertise to the
    community.


    The LTC has a team of 250-plus, with a small part of the community located in
    many centers around the world. These centers are located in Adelaide, Austin,
    Bangalore, Beaverton, Beijing, Bethesda, Boelingston, Boulder, Cambridge, Canberra,
    Chicago, Edincott, Haworth, Hurley, Mt. Laurel, New York City, Portland, Poughkeepsie,
    Raleigh, Rochester, San Francisco, Somers, Urbana-Champaign, Yamato, and Yorktown.


    The Linux Technology Center can be located on the Web:

    http://www.ibm.com/linux/ltc


    # IBM JFS to Linux Storage


    IBM''s journaled file system (JFS), currently used in IBM enterprise servers is
    designed for high-throughput server environments, key to running intranet and
    other high-performance enterprise file systems. IBM is contributing this technology
    to the Linux open community with the hope that some or all of it will be useful
    in bringing the best of journaling capabilities to the Linux operating system.


    JFS is a log-based, type-level file system, which was developed for transaction-oriented,
    high performance, high-throughput server environments, and is key to running intranet
    and other high-performance enterprise file systems. JFS is a scalable and robust
    file system and provides fast file restarts in the event of a crash system.


    More information about JFS for Linux can be found at:

    http://www-124.ibm.com/jfs/


    # EVMS


    The LTC is working on volume management technology in the form of the Enterprise
    Volume Management System (EVMS), where the result of the effort is aimed at providing
    more volume management capability and interoperability in the kernel.


    For information on EVMS, refer to:

    http://evms.sourceforge.net/


    # 2.2 Linux services and application solutions


    Although the general opinion is that Linux has a limited number of enterprise-level
    applications available, the Linux applications featured in the IBM Global Solutions
    Directory has grown to more than 2,900. IBM has ten portant centers around the
    world and is continually enhancing its portfolio.


    For more depth information regarding Linux application solutions refer to Linux
    Handbook - A Guide to IBM Linux Solutions and Resources, SG24-7000-00.'
