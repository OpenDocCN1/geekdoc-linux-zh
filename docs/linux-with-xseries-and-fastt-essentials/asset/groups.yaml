    # 5.1.4 FASIT Service Alert, a support option for FASIT Storage Servers


    FASIT Service Alert is available to all current and new FASIT Storage Server customers.
    FASIT Service Alert (hereafter called Service Alert) enables the IBM TotalFASIT
    Storage Manager to monitor system health and automatically to notify the IBM Support
    Center when problems occur. Service Alert sends an e-mail to an IBM call management
    center that identifies your system and location details such as your phone number.
    The IBM support center analyzes the contents of the e-mail alert and contacts
    you to begin problem determination. The service is available worldwide.


    For more information on the FASIT Service Alert visit:

    http://w3-1.ibm.com/sales/systems/ibmsm.msf/documents/fastservalert'
