    From here, navigate to Disk Storage Systems², then FASIT Storage Server and then
    select your FASIT model; use the pull-down menu to select Downloads, then select
    FASIT Storage Managers as appropriate for your version.


    Read and accept the terms and conditions, and you now see a selection of both
    software and documentation. Please obtain and read the documentation entitled
    “IBM TotalFASIT Storage Manager Version X.Y installation and Support Guide for
    Linux” (where X corresponds to your version number); use your browser’s “back”
    button and select LINUX operating system; this action takes you to the download
    page for the code and the README file. Please look at the README file before installing,
    as it contains the latest information for the code.


    The package is rather large (over 30 MB) and requires another 70 MB to install,
    including the Java Environment, storing the rim files, and the installed code.
    Also, note that the Storage Manager GUI requires the X window system running on
    the management workstation.


    When you have to root to install the client. Site administrators may make their
    decisions regarding access control to the Storage Manager. The FASIT itself can
    be protected by password from changes to the Storage configuration inaccessible
    of access to the Storage Manager client.


    First, uninstall any previous version of Storage Manager before installing the
    new version. To check for installations, query the packages that are installed
    and select only those containing the letters "SM” with the following command:


    ```

    rpm --query --all grep SM

    ```


    Use the output to remove any previous version of the Storage Manager software
    by name. For example:


    ```

    rpm --uninstall Runtime-XX.YY.ZZ-1

    ```


    When you have obtained the latest version of Storage Manager, extract the contents
    of the zipped file:


    ```

    tar xzv *.tgz

    ```


    The required rpm files for installation are extracted into ./Linux/SMXclientcode
    where X-Storage Manager version.


    ```

    rpm --install --verify SMClient-<version>.rpm

    rpm --install --verify SMClient-LINUX-<version>.rpm

    rpm --install --verify SMUtil-<version>.rpm

    ```


    The Storage Manager components should be installed in /opt/IBM/FASIT, with the
    client and command install, SMClient, in /opt/IBM/FASIT/client directory.


