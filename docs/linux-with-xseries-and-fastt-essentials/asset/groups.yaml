    ## Linux with xSeries and FASST: Essentials


    ![](img/69bfe4e2d59e61df50eecde9154775d5_115_0.png)


    **Enterprise-class solutions with Linux and IBM TotalStorage**


    IBM TotalStorage products are known for their high quality and reliability and
    work well with Linux. As part of a well designed e-business infrastructure, they
    can help you cut costs, consolidate infrastructure, and position you for the new
    on-demand world.


    **Focus on xSeries and FASST**


    **FASST Management Software overview**


    This Redbook presents high-level information on Linux in conjunction with IBM
    Server and TotalStorage, giving proof points that these products can be deployed
    all together to provide enterprise-class solutions. In this particular book looks
    at Linux with the xSeries servers and IBM TotalStorage FASST disk products.


    This redbook is intended as a starting point and reference for IBM representatives,
    Business Partners, or clients who are planning Linux based solutions with IBM
    xServers and FASST storage products.


    Most of the information contained in this book is compilation of the material
    from the Linux Handbook, SG24-7000-00, and Implementing Linux with IBM Disk Storage,
    SG24-6262-01. We encourage the reader to refer to these Redbooks for more complete
    information or implementation details.


    INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    BUILDING INFORMATION BASED ON PRACTICAL EXPERIENCE

    IBM Redbooks are developed by the IBM International Technical Support Organization.
    Experts from IBM, Customers and Partners from around the world create technical
    information based on realistic scenarios. Specific recommendations are provided
    to help you implement IT solutions more effectively in your environment.


    For more information: ibm.com/redbooks


    SG24-7026-00  ISBN 0738499188'
