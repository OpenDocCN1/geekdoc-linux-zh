    \nOnce complete type sysreboot to restart the controller blade. Wait for the reboot\
    \ to complete and repeat this whole process again for Controller B by connecting\
    \ the modem cable to Port B, and reconnecting the terminal software.\n\n### A.1.2\
    \ Is there a Storage manager agent for Linux?\n\nThe FASIT Storage Manager software\
