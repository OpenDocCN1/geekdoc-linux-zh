    # xSeries 与 Linux


    本章提供了 xSeries 可用的 Linux 实现、解决方案和资源概述。


    本章涵盖以下主题：


    - X-Architecture 简介

    - Linux 与集群

    - 作为服务器解决方案的 xSeries


    ## 3.1 xSeries 与 X-Architecture


    xSeries 服务器基于 X-Architecture，该架构结合了多年企业服务器开发的先进技术以及以 Intel CPU 为代表的行业标准技术（图 3-1）。


    | xSeries | iSeries | zSeries |

    | :--- | :--- | :--- |

    | ![xSeries](https://example.com/xseries.png) | ![iSeries](https://example.com/iseries.png)
    | ![zSeries](https://example.com/zseries.png) |

    | 性能 | 可扩展 | 可管理 |


    图 3-1 xSeries 的概念：从所有 IBM 产品中学习


    虽然 xSeries 服务器以低价格为客户提供先进技术，但也可以使用许多标准的应用程序和服务。2001 年秋，IBM 宣布了企业级 X-Architecture。这项新技术通过服务器资源的动态配置，提高了扩展性、灵活性、可用性和性能。IBM
    通过 IBM 开发并通过 IBM X-ia32 和 IA-64 处理器实现 X-Architecture。


    xSeries 的操作系统支持频繁变化。可以在 Web 上的 IBM ServerProver 站点获取这些信息：


    http://www.pc.ibm.com/us/compat/nos/matrix.html


    可以在 Web 上找到 xSeries 的驱动程序文档：http://www.pc.ibm.com/pc/support/site.wss


    IBM Server 技术是将先进技术扩展到基于处理器的服务器的蓝图。这些优势位于可用性、扩展性、系统管理、服务和服务。IBM 自 1998 年以来一直履行
    X-Architecture 模型的承诺。它包括 Active™、C27 交叉连接线、Chipkill™ 内存、预测性故障分析®、Light Path Diagnostics™
    以及 IBM 软件刷新等创新技术。今天，IBM 继续通过企业技术构建 X-Architecture 蓝图。这些技术在 xSeries 服务器的输入输出 (I/O)、内存和性能方面取得了革命性的进展。

