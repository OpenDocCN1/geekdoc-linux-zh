    to propagate system images and updates to all consolidated systems.


    Workload management solutions: They reschedule work from heavily loaded systems
    to more lightly loaded systems.


    Availability through redundancy within systems and across systems: With a consolidated
    environment, you can configure your solutions for maximum availability. The xSeries
    server alone redundancy for features such as power supplies. Now, in a consolidated
    environment, you can set up another system to handle work from a failing system
    or from a system you may want to take offline.


    # 3.5.2 Consolidating systems into a reduced number of servers


    +   The xSeries Model 440 offers a strong value proposition with its Pay as You
