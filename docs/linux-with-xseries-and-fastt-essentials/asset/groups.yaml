    -   Red Hat Linux ES：提供特别适用于中规模部门应用的内核操作系统和网络基础设施。

    -   Red Hat Linux WS：Enterprise Linux ES 或 AS 的桌面/客户端对应版本。


    Red Hat 为企业级发行版提供支持和维护服务。


    有关 Red Hat 的更多信息，请访问：

    http://www.redhat.com


    ## 1.6.2 SuSE Linux Enterprise Edition（SuSE Linux 企业版）


    SuSE 成立于 1992 年，总部位于德国纽伦堡，是欧洲使用最广泛的发行版。最新版本拥有新的图形化安装工具以简化安装过程。高级功能包括针对 3D 图形芯片的硬件加速和日志文件系统。SuSE
    还为新型高端显卡开发并支持一系列 X Server。安装程序提供德语、英语、意大利语和法语版本。SuSE Linux 与大量工具和应用程序连接。


    SuSE 适用于商业领域。这些包括 SuSE Linux Enterprise Server (SLES)适用于 zSeries、xSeries、pSeries
    和 iSeries 的服务器；以及支持 Alpha、PowerPC 和 Intel 平台的版本。


    SLES 是一个 Linux 软件包发行版（版本为 1.6.3，“UnifiedLinux”），旨在服务器应用程序。


    有关 SuSE Linux 的更多信息，请访问：

    http://www.suse.com


    ## 1.6.3 UnitedLinux


    UnitedLinux 是于 2002 年 5 月成立的联盟，旨在整合多个发行版的开发工作。


    其愿景非常简单：合作伙伴将来自领先发行版的最优操作系统技术整合到一个健壮的单一代码库系统中。2003 年 1 月，IBM 以技术合作伙伴身份加入了 UnitedLinux。


    以下 UnitedLinux 联盟成员拥有相同的 UnitedLinux 发行版：


    -   SuSE Enterprise Server 8 (SLES 8)

    -   Turbinux Enterprise Server 8 (TLES 8)

    -   Connectiva Linux Enterprise Edition Powered by Linux


    所有公司都为 Intel (xSeries)、iSeries、pSeries 和 zSeries 提供发行版。Turbinux 和 Connectiva 回收了
    SuSE 发行版。Turbinux 主要在亚洲地区销售，Connectiva 主要在拉丁美洲市场销售。Turbinux 和 Connectiva 将在 SuSE
    发布后 30 天内为其客户提供错误修复。SuSE 是 Linux 领先开发者。


    该发行版的关键元素包括 POSIX 异步 I/O (AIO)、提供高带宽、低开销 SCSI I/O 的原始 I/O 增强，以及直接从用户空间缓冲区和执行 I/O
    的设备移动数据的直接 I/O，从而避免贵的拷贝操作并跳过操作系统的页面缓存。


    其他关注的功能包括：超线程（Hyper-Threading），使多线程服务器应用程序能够在每个服务器处理器内并行执行线程；大内存支持，以利用 Intel 物理地址扩展支持高达
    64 GB 的物理内存以及每个进程完整的 4 GB 虚拟寻址空间；互联网协议第6 版 (IPv6)，由 IETF 设计用于取代当前版本互联网协议的下一代协议；以及
    LDAPv3，最新的目录服务协议，用于更好的用户库管理，以及邮件服务器和验证服务器的应用集成。


    ## IBM 与 Linux


    本章讨论了 IBM 对 Linux 和开源社区的承诺，并回顾了可用的 IBM 服务，帮助 Linux 客户从基于 Linux 的 IBM 解决方案中获得最大优势。它展示了
    Linux 如今所获得的巨大认可和承诺。


    此处描述的资源为获取更详细的信息提供了一个良好的、整合的起点。我们建议您阅读并学习这些资源，以帮助您跟上 Linux 的承诺和新服务，这些服务仍在快速增长。


    本章中的信息在本书编写时是正确的。然而，由于每个产品生命周期的正常变化，某些信息可能会发生。对于 Linux 以外的产品也是如此。这意味着即使某个产品在本章中看起来受到支持，IBM
    也可能不支持它。因此，我们鼓励您在从本章收集信息时，调查服务终止日期、产品下架和其他支持限制等主题。


    > **重要：** 此处描述的服务仅针对 IBM 客户，在某些特定国家或地区可能不可。请联系当地的 IBM 全球服务 (IGS) 代表获取详细信息。


    ## 2.1 IBM 对 Linux 的承诺


    IBM 参与 Linux 的历史如此久远，超出了本书的涵盖范围。IBM 并不是 Linux 的发行商。IBM 是 Linux 的贡献者、运行 Linux 的服务器供应商，以及选择使用
    Linux 的客户的支持提供者。IBM 对 Linux 的承诺通过过去几年中的许多亮点可以得到最好的说明：


    -   早在在 1999 年 3 月，IBM 就宣布了对 Linux 的关键联盟、产品和全球支持，包括 SuSE Holding AG（他们与发行商 Connectiva
    S.A. 一起创立了 United Linux）和 Red Hat Software Inc.。

    -   Linux 于 2000 年 5 月在 S3908 服务器上首次亮相，不久后由一家大型 ISP 为服务器整合进行了商业化部署。6 月份，SuSE 宣布了用于
    R6500 的 Linux。

    -   2001 年，IBM 在 LinuxWorld 上因运行 zSeries 和 iSystems 获得荣誉，完成了 Linux 跨整个 eServer
    产品线的可用性。作为补充，还宣布了适用于 Linux 服务器的广泛存储选项，包括企业级服务器 (ESS) 和光纤阵存储系统 (FAS)。

    -   2002 年，IBM 通过各种倡议和服务器新功能加强了对 Linux 的承诺。

    -   2003 年，IBM 继续扩大其 Linux 产品组合，为开源社区带来新功能，并增强了整个产品线的可扩展性。


    ### 2.1.1 Linux 技术中心


    Linux 技术中心 (LTC) 的使命是直接与社区合作，它拥有行业最全面的 Linux 开发团队之一。全球范围内拥有 250 多人的团队，这些中心位于阿德莱德、奥斯汀、比弗弗顿、北京、贝塞达、博林根、博尔德、剑桥、堪培拉、芝加哥、埃德伍德霍沃斯、赫利、山洛里、纽约、波特兰、普肯基州、拉利、罗彻斯特、旧金山、索默斯、厄巴纳坎槟、大和和约克镇。


    可以在网上找到 Linux 技术中心：

    http://www.ibm.com/linux/ltc


    ## IBM JFS 到 Linux


    IBM 的日志文件系统 (JFS) 目前用于 IBM 企业级服务器，专为事务型、高性能、高吞吐量的服务器环境设计，是运行内部网和其他高性能文件系统的关键。IBM
    正将这项技术贡献给 Linux 社区，希望其部分或全部能为 Linux 操作系统带来最佳的日志功能。


    JFS 是一种为 IBM 服务器开发的基于日志的类型级文件系统。它是一个可扩展且健壮的文件系统，并在系统崩溃时提供快速的文件重启。


    关于 Linux 版 JFS 的更多信息可以查阅：

    http://www-124.ibm.com/jfs


    ## EVMS


    LTC 正在以企业级卷管理系统 (EVMS) 的形式研究卷管理技术，其努力成果旨在为内核提供更多的卷管理能力和互操作性。


    有关 EVMS 的信息，请参考：

    http://evms.sourceforge.net/


    ## 2.2 Linux 服务和应用解决方案


    尽管普遍认为 Linux 可用的企业级应用程序有限，但 IBM 全球解决方案目录中的特色 Linux 应用已增长到 2900 多个。IBM 在全球设有十个支持中心，并不断增强其产品组合。


    有关 Linux 应用解决方案的深度信息，请参考《Linux 手册 - IBM Linux 解决方案和资源指南》，SG24-7000-00。


