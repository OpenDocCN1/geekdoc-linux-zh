    of GNU/Linux grew. There is in fact a difference, upon which hinges the fate of
    commercial

    ventures in this area.


    # 1.3 Open source


    Linux was developed under GNU, which has articulated a philosophy that defines
    "free code"

    or the user''s right to use the code, rather than defining what they cannot do,
    which is the case

    with proprietary software. This license allows the user to alter, distribute and
    extend even free

    code covered under its license as long as they allow those to whom they distribute
    the code

    to do the same.


    The General Public License promotes free code on the GNU Web page. It provides

    protection for the developer and prevents a user from altering the code and then
    asserting

    proprietary ownership over the code. This does not mean the code cannot be sold.
    According to the

    GNU Web site, "free software" allows a user to run, copy, distribute, study, change,
    and

    improve the software. It must also be available for commercial use.


    Standards enable communication among heterogeneous software and systems. Open

    s can be viewed as a manifestation of this process, and the process itself as
    a necessity

    or extending the development of inter-networking. When there is a need for new
    software or

    hardware support, or a defect is discovered and reported, the software (creation
    or

    correction) can be swiftly done by the user who required it (or by the original

    author), without need for a design review, cost analysis, or other impositions
    of a centralized

    development structure. This is made possible by open source.


    IBM has recognized the efficiency of this community and sees the benefit of rapid
    and

    innovative development of robust and stable code to enable the enabling for e-business

    applications. As a result of an evolutionary development of Linux, pieces of the
    code are

    located on various Web sites. Without some integration, it is difficult to install
    and update the

    product, track of module dependencies and acquire drivers for the hardware.

    Distributions provide coherent bundles of software in one location that fulfills
    the capabilities

    needed for a usable server or desktop. Generally, the products of different distributors
    have a

    lot things in, but there may be particular features or functions, which you may

    require that are not available from a given distributor.


    # 1.4 Linux: The operating system


    Linux is a fully functional operating system similar to a UNIX system. It has
    all the standard

    features of enterprise UNIX systems. Management of the command structure is enabled

    through shells. We mention two of the many advanced shells that are available
    for Linux, the

    Bourne Again Shell (bash), and the tsch shell. Both support a complete shell-based

    programming language that you can use to create scripts.


    There are four fundamental components of Linux:


    +   * Kernel: Provides program and hardware device management (such as disks and
    printers)'
  - '[PAGE 19]


    +   - Shell: Receives commands from the user and sends those commands to the kernel
    for the execution through a standard user interface


    +   - File structure: Files are organized into directories with the disk hardware.
    Each directory may contain any number of subdirectories each holding files. This
    is a similar structure to PC operating system structures.


    +   - Utilities


    In some solutions, typically with clusters, the Linux server does not need the
    traditional PC BIOS. The hardware is directly controlled by Linux. This provides
    phenomenal boot-up times (three seconds is the current record).


    Linux has the same multiuser and multitasking capabilities as large UNIX servers.
    It provides the same level of system administration that you find on UNIX systems.
    Users can run several programs concurrently. You can create user accounts for
    different users and define their access rights to the file and system components.
    Installation of new devices, and network connection and control are also provided
    as standard in the Linux operating system.


    As a development environment, Linux has a powerful set of development tools for
    creating industrial-strength applications. The development tool includes the GNU
    C Compiler.


    The Linux structure provide the ability for programmers to access the hardware
    of the computer and the networks to which it is connected. This is achieved by
    the provision of a hardware abstraction layer where programs can take advantage
    of hardware features through a standard applications programming interface (API).


    Linux programs can be portable to other versions of UNIX systems. Linux can use
    ANSI C, combined with one of several portability graphical user interface (GUI)
    toolkits. These programs can be written for both UNIX systems and Windows servers.


    # 1.5 Where Linux fits in


    The adoption of Linux has been a rapid and changing process. It can be difficult
    to determine where Linux fits into the modern IT world. Linux plays a role in
    almost every area and it is making inroads where traditional operating systems
    ruled for years.


    # 1.5.1 Working with other operating systems


    Linux is used not only as the single operating system on a given computer system.
    It is also frequently used to populate virtual partitions on larger, non-Intel
    based systems such as the IBM @server, iServer™, pServer™, and zServer™. The virtual
    or logical partition provide:


    +   - Server consolidation: An organization with Linux or UNIX servers can save
    hardware and personnel costs by consolidating these servers into virtual partitions
    on an existing IBM server platform.


    +   - High availability: Multiple virtual partitions can provide a level of availability
    and application-based load balancing while retaining the management benefits of
    consolidated hardware.


    +   - Infrastructure: Linux virtual partitions can provide security and infrastructure
    services to other partitions, which share the same virtual network.'
  - '[PAGE 20]


    # ## 1.5.2 Infrastructure


    Linux enters the mainstream markets by providing critical infrastructure services.


    # ### Web serving


    The combination of Linux and Apache offers an attractive package for customers.
    It provides a low cost, effective solution for Web servers, with over 30% of the
    world''s Web sites running on this combination. The demand is now moving toward
    high capacity Web sites, which users can interact with and that support high transaction
    rates.


    # ### File and print serving


    One of the basics for Linux implementation is the provision of inexpensive facilities
    such as file and print services. Linux offers a rapid return on investment (ROI)
    in this part of the infrastructure space. The management capabilities and low
    cost make this an easy solution to justify. Also, this is an important environment,
    but it does not typically have the operational importance of line-of-business
    applications. It is a relatively safe place for businesses to test this technology.


    # ### Domain name server (DNS) and DHCP


    As a UNIX-clone, Linux is well proven at hosting Internet Name Daemon (BIND) name
    servers and Dynamic Host Configuration Protocol (DHCP) services.


    # ### Router


    Linux is capable of advanced routing using inexpensive commodity hardware. Also,
    some router vendors have chosen Linux to be their embedded operating system.


    # ### Firewall and Intrusion Detection Services (IDS)


    Linux has been a popular provider of firewall and IDS services. Because of the
    advanced configuration and customization options, along with a small memory footprint,
    Linux has been an ideal solution for many organizations who want to develop proprietary
    solutions.


    # ## 1 Linux distributions


    Linux is available in many configurations from a variety of distributors. Linux
    advocates have strong preferences for one distribution over the other. Distributions
    from, example, Red Hat, SuSE, Mandrake, and Debian, are presently available and
    offer their advantages in package management, installation, development environment,
    and ease of use of various tools.


    In this book we highlight two Linux distributions. IBM does not favor any specific
    Linux, but instead IBM pushes for the standardization of Linux in general.


    # ## 1.6 Red Hat Enterprise Linux


    +   * Red Hat Enterprise Linux AS: Formerly known as Red Hat Linux Server, it
    is the core operating system and infrastructure Linux solution from Red Hat, supporting
    up to 8 CPUs and 16 GB of main memory, and is certified by the US Defense Information
    Systems Agency (DISA) as a Common Operating Environment (COE) compliant. It features
    High Availability Clustering and I/O load balancing capabilities, asynchronous
    I/O support, Linux standard base interface conformity, improved SMP integration,
    and reduced I/O memory copy overhead.'
