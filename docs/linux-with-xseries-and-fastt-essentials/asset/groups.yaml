    \ subsystem. The agent process communicates with the storage controllers over\
    \ the Fibre Channel by means of a special interface in the controller known as\
    \ an ACCESS LUX. This method is also known as indirect control because the intermediary\
    \ agent process. No connection is required to the network ports on the FASIT controllers.\n\
