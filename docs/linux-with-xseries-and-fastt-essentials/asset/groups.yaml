    \ as direct control since no additional agent process is required, and no control\
    \ communication takes place over the Fibre Channel. The default settings are 192.168.128.101\
    \ and 192.168.128.102. Linux communicates with the FASIT out-of-band, so if these\
    \ IPs do not fit in your network then these will need to be changed.\n\n### A.1.1\
    \ Setting the IP and mask on a FASIT Controller\n\nConnect a serial modem cable\
