    # High performance computing


    High performance computing clusters are designed to use parallel computing processing
    to the solution of a problem. There are many examples of scientific computing
    using multiple low-cost processors in parallel to perform large numbers of operations.
    This is referred as parallel computing or parallelism. In How to Build a Beowulf:
    A Guide to the Implementation and Application of PC Clusters (Scientific and Engineering
    Computation), by Sterling, et al¹, parallelism is defined as the "ability of many
    independent threads of control many process simultaneously towards the completion
    of a task."


    ¹T.L. Sterling, J. Salmon, and D.J. Becker. How to build a Beowulf: A Guide to
    the Implementation and Application of PC Clusters. MIT Press, Inc., Cambridge,
    MA, 1999.


