    # 4.1 IBM TotalStorage


    Linux-enabled storage is a requirement for all servers running Linux, regardless
    of the hardware infrastructure they rely on. We can observe that Linux moves from
    supporting infrastructure workloads such as Web serving, networking, file and
    print operations into the critical applications at the core of the data center,
    more stringent requirements are placed on the storage infrastructure to deliver
    superior reliability, scalability, and performance. These are not new requirements
    for IBM''s portfolio, which has comprehensive Linux support today with a commitment
    to make it even stronger with our new products and solutions.


    IBM continues to support Linux across all its server platforms and leads the industry
    in storage networking based on open, standards for heterogeneous platforms.


    IBM is the leader in delivering world-class disk and tape systems, storage management
    software, services, and integrated solutions, and incorporates the following:


    +   - Highly scalable storage - Enables administrators to manage and quickly respond
    to business needs, with ease of deployment and configuration


    +   - High availability and fault-tolerant storage - Provides continuous and reliable
    access to data using technologies like RAID and clustering


    +   - Improved data management - Helps administrators better control the security
    and growth of their data


    +   - Increased storage utilization - Allocates storage through a centrally managed
    pool of storage


    +   - Reduced administrative costs - Manage additional storage without having
    to add staff, with IBM storage management tools, the ability to perform quicker
    problem resolution


    +   - Platform independence - Enables sharing of data and possibility of simplification
    of backup procedures


    +   - Centrally managed - Enables administrators to quickly respond to changing
    business needs, with ease of deployment and configuration


    +   - Reduced administrative costs - Manage additional storage without having
    to add staff, with IBM storage management tools, the ability to perform quicker
    problem resolution


    # 4.1. Value proposition


    IBM provides a comprehensive Linux strategy that includes elements, hardware,
    software, and management tools to provide complete infrastructure for the IT workloads.


    IBM storage on Linux provides pre-tested combinations of disk (high-end and mid-range),
    tape and network storage and the major Linux distributions, and a clear strategy
    of deploying Linux.


    IBM storage on Linux also provides alignment with IBM @server and software to
    offer the most appropriate combinations to serve a wide variety of customer needs,
    exploiting the benefits of open source and heterogeneous environments made possible
    by Linux.'
