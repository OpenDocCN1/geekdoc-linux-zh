    ## Linux 简介


    Linux 是一种类 UNIX 操作系统。它是来自芬兰赫尔辛基的托瓦瓦兹（Lin Torvalds）在 1991 年最初的作品。他编写了第一个内核，这是运行计算机硬件的底层程序。由于
    Linux 源代码免费可用，许多公司开发了不同的 Linux 发行版。发行版是一个完整的系统。关键组件是 Linux 内核。根据预期用途，还可以包含其他实用程序、和服务各种应用程序。目前没有标准的发行版。IBM
    早期就发现了 Linux 的价值：


    - 投资 Linux 相关的产品开发

    - 与关键分销商建立联盟

    - 为开源社区做出贡献

    - 积极支持该平台


    本章提供了 Linux 的简要介绍，以及关于其起源与开源关系的历史视角。本章继续对 Linux 操作系统及其组件进行高级描述、Linux 在 IT 世界中的地位以及
    Linux 发行版。IBM 认为这项投资将使其客户继续为 IT 基础设施和电子业务利用 Linux 时受益。


    ## Linux 的基础


    我们知道 Linux 是一个类 UNIX 操作系统，让我们从 Linux 操作系统的开发的简概述开始，了解其演变的背景。


    ## 通用许可证


    1969 年，AT&T 的员工开始开发一种名为 UNIX 的操作系统（OS）。这种开发的重大新奇之处在于该 OS 是可移植的。在当时，对 UNIX 感兴趣的学术变体变成了伯克利发行版（BSD）。虚拟内存和网络被加入其中。这些进展允许全球贡献者进行大型协作。随后，AT&T
    与加州大学就源代码的访问和分发发生了诉讼。知识产权的限制促使麻省理工学院人工智能实验室的一名研究人员编写了一种可移植的操作系统，以防止其最终被知识产权索索。


    新的操作系统是为了 GNU，一种用于“GNU 的 Unix”的递归算法。这项工作根据通用许可证（GPL）受左 保护，该许可证规定所有运行或源自 GNU 的程序必须免费发布源代码，放弃控制权但保留所有权。这是自由（意义上的自由）软件，与公共领域的软件形成对比。到此时，太阳、惠尔公司和
    IBM 等供应商提供了许多源自 AT&T UNIX 的商业产品，这些产品在企业客户中日益受欢迎。GNU 项目使得编辑器、编译器和文件实用程序等列表变得可以在任何平台上进行编译和执行，标准化并改进了供应商提供的产品。1990
    年左右，程序员已经拥有了几乎完整的 GNU 环境，除了内核。GNU 内核将基于微内核架构以提高可移植性。


    与此同时，一个小型类 UNIX 操作骨架被发布作为教学工具。在这里，托瓦瓦兹决定创建一个功能优于 Minix 的类 UNIX 操作系统，运行在可用的个人计算机上。他的同事
    Lars Wirzenius 根据 GPL 将他们的源代码发布到互联网公开，Linux 诞生了。


    Linux 是没有实用工具的内核，GNU 是缺少完成内核的操作环境，而不受限制的非内核 BSD 部分可以完善这一图景。总之，这些组件是使用安装和维护工具构建的，并包含：


