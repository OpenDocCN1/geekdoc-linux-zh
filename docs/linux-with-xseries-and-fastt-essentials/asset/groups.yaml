    # A.1 Storage Manager concepts


    Management of the FASIT storage subsystem requires an instance of the FASIT Storage
    Manager client on a management station. Because the FASIT Storage Manager is a
    Java-based application, any suitable management station¹ may be used it can communicate
    with the FASIT storage subsystem in one of two ways:


    # In-band


    The Storage Manager communicates with an agent process over either a physical
    or loopback network connection. The agent process runs on one or more of the systems
    connected through Fibre Channel to the FASIT storage subsystem. The agent process
    communicates with the storage controllers over the Fibre Channel by means of a
    special interface in the controller known as an ACCESS LUX. This method is also
    known as indirect control because the intermediary agent process. No connection
    is required to the network ports on the FASIT controllers.


    # Off-of-band


    The Storage Manager communicates over physical network connections to the FASIT
    controllers. The ACCESS LUX is not used. This method is also known as direct control
    since no additional agent process is required, and no control communication takes
    place over the Fibre Channel. The default settings are 192.168.128.101 and 192.168.128.102.
    Linux communicates with the FASIT out-of-band, so if these IPs do not fit in your
    network then these will need to be changed.


    # A.1.1 Setting the IP and mask on a FASTt Controller


    Connect a serial modem cable between a serial port on the server (otherwise, use
    a client system) and Port A on the FASIT. This allows the configuration of Controller
    A.


    Use a terminal program such as minicom under Linux or HyperTerminal for Microsoft
    Windows.


    Use the following settings:


    +   * Serial device (dev/ttyS1)

    * Speed (9600)

    * Data/parity/stop bits (8N1)

    * Hardware Flow Control (No)

    * Software Flow Control (No)


    If using minicom, press Ctrl-A - F to send a break. If using HyperTerminal, press
    Ctrl-Break every 5 seconds until the ASCII characters become human readable.


    Press Escape to enter the FASTt shell.


    The shell prompts you for a password (Figure 5-3). The default is infi'
