    ## SuSE notes


    Before you build the new ramdisk, you have to make the following change to the
    file /etc/sysconfig/kernel: add qla2200 to the string behind INITRD_MODULES, depending
    on your HBA designation:


    ```

    INITRD_MODULES="aic7xx reiserfs qla2300*"

    ```


    The script /sbin/mk_initrd uses this string. By running mk_initrd a new version
    of initial ramdisk is built in the /boot directory. Even though this is convenient
    you might built a new ramdisk instead of replacing the existing one. Have a look
    at the mk_initrd script, it offers you quite some useful (and sometimes colorful)
    options.


    ## Red Hat notes


    Before restart, you should add the kernel parameter max_scsi_luns=128 to the modules.conf
    file. This is necessary because the kernel does not probe the full range of LUNs
    by default. However, this is only critical if you are using a large amount of
    SAN volumes.


    > Note: Every change in the configuration of your SAN causes the need to reconfigure
    your paths and rebuild the initial ramdisk!


    For more about Storage Area Networks, please consult any of several IBM Redbooks
    on the topic.


    As final step you have to reboot your system. If you want an automatic mount of
    your volumes you have to enter the appropriate parameters in /etc/fstab.


    > Important: Keep in mind, failure of a volume prior or during reboot may cause
    a change in the SCSI device numbering sequence.


