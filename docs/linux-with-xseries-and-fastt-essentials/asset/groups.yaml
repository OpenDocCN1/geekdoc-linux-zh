    # IBM Operational Support Services: Support Line for Linux Clusters


    This fee service provides remote cluster technical assistance to answer usage,
    installation, and technical questions, to address product compatibility and interoperability
    concerns, and to isolate and diagnose Linux cluster problems. It provides specialized
    Linux cluster support with open source and OEM. It offers remote problem identification
    and technical support for your Linuxered environments. This service complements
    your in-house skills by providing comprehensive knowledge of Linux environments.


    # IBM Operational Support Services: Advanced Support


    IBM'' Advanced Support provides the highest level of remote support available
    through IBM. The customer receives 24x7 coverage, 365 days-a-year. This service
    is tailored to meet your unique needs for continuous, business-critical Linux
    system operation.


    # IBM Operational Support Services: Custom Linux Support


    IBM offers remote Linux supporting for creating modified versions of Linux. This
    service provides full remote support you implement this cluster distribution throughout
    your enterprise or cluster. By leveraging IBM''s knowledge of Linux, IBM helps
    you to solve serious pitfalls that can occur when you create your own distribution.
    We help you understand the necessary interdependent packages and required modules.


    IBM has the capital to deliver support teams in multiple worldwide locations.
    It has some of its talent in multiple locations to create the Change team. IBM
    can draw on the skills of over 200 members of the Linux Technology Center found
    in more than 20 locations worldwide.


    You can learn more about the support line at:


    http://www.ibm.com/services/its/us/supportline.html


    # 2.2.4 Linux consultancy


    Linux acceptance by the marketplace is rapidly moving forward. It has gained credibility
    and is being deployed widely for Web serving and scientific and computing clusters
    in a relatively short time. It is now being ported to mission-critical areas such
    as workload consolidation, retail points-of-sale, and financial automation.


    IBM is committed to providing the same level of normal support associated with
    enterprise computing environments as Linux continues to move in those key business
    and industry areas. IBM''s Linux service offerings are designed to help Linux
    customers achieve better flexibility and cost-to-benefit rates.


    IBM Global Services offers one of the industry''s most comprehensive portfolios
    of Linux consulting and support offerings, from planning and design, to implementation
    and technical support. IGS also offers a full portfolio of Linux Services and
    has been doing so since February 2001. Over 300 IBM consultants skilled in Linux
    are available worldwide to help customers design, build, and enhance their Linux
    solutions.


    For information about IBM''s services and support for Linux, refer to the following
    Linux Services and support Web sites at:


    http://www.ibm.com/services/its/us'
  - '[PAGE 29]


    # 2.3 IBM services and software


    IBM is rolling out services to help customers rapidly deploy and optimize Linux-based
    e-business environments. IBM services for Linux covers Software Group products
    such asSphere®, Data Management (DB), Lotus, and Tivoli. IBM is also delivering
    services to help customers port applications to a wide variety of IBM and non-IBM
    platforms running Linux.


    # 2.3.1 WebSphere


    Many customers need WebSphere as a front end to their legacy applications. Customers
    need to access legacy applications (for example, CICS) through a browser interface
    to provide users (internal or external) with Web-enabled access to existing applications.
    They also want solutions that do not require a long development cycle and that
    support open-standards integrated infrastructure. Customers want to leverage transactional
    applications, database assets, and existing investment in hardware platforms that
    have a superior characteristic to run their new application.


    Every customer with an IBM mainframe capable of having Integrated Feature for
    Linux (IFL) presents a good fit for WebSphere on Linux. IFL-capable systems are
    the 962 G Series (G5 and G6), Multipower® 3000, z200 Series, and z900 Series.


    IBM provides a variety of services for WebSphere that go from migration to specific
    training in all WebSphere products. For WebSphere Software Services, see:


