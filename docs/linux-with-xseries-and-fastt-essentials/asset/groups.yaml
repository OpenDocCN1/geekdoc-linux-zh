    # Functions of the X-Architecture


    This appendix provides a brief description of the X-Architecture capabilities
    that were introduced in 3.2, "Linux and functions of X-Architecture" on page 25.


    **XpandOnDemand**

    XpandOnDemand is part of the X-Architecture. The power of a 16-way server is now
    available with the xSeries 440 to take charge of advanced enterprise applications
    and drive a higher level of performance on this flagship server. Powered by Enterprise
    X-Architecture™ technology, these 4U rack-optimized, industry-standard servers
    support up to 16-way processing by interconnecting two xSeries 440 as a single
    8U configuration. This makes it one of the most rack-dense servers in the world.


    XpandOnDemand revolutionizes data centers by doubling the throughput with a modular,
    pay-as-you-grow block design. This design allows entry price points and upgradability
    to powerful 16-way SMP and remote I/O. XpandOnDemand allows you to purchase only
    the performance and capacity you need, when you need it, without having to buy
    costly infrastructure.


    **System partitioning**


    System partitioning is another of the many mainframe capabilities that Enterprise
    X-Architecture technology brings to Intel architecture servers. Among the benefits
    of system partitioning are hardware consolidation; software migration and coexistence;
    version control; development, testing and maintenance; workload isolation and
    independent backup; recovery on a partition basis.


    **PCI-X**


    PCI-X provides a new generation of capabilities for the PCI bus, including more
    efficient data transfers, more adapters per bus segment, and faster speeds for
    server systems. PCI-X enhances the PCI standard by doubling the throughput while
    maintaining compatibility with PCI adapters. PCI-X allows all 66MHz PCI adapters
    (either 32-bit or 64-bit) to operate normally on the PCI bus. PCI adapters take
    advantage of the new 100MHz and 133MHz bus speeds, which allow a single 64-bit
    adapter to move as much as 1 GB of data per second. (The next PCI-X specification
    (2.0) will support speeds up to 266MHz.) Additionally, PCI-X supports twice as
    many 66MHz/64-bit adapters in a single bus as PCI.'
  - '[PAGE 103]


    # Active PCI-X


    Building upon the success of IBM PCI, Enterprise X-Architecture design introduces
    Active PCI-X with support for both PCI and PCI-X adapters in selected xSeries
    servers. Active PCI-X provides another IBM solution to increase total server availability.
    Active PCI-X features can be categorized as follows:


    +   Hot-swap - Allows you to replace without having to shut down and restart the
    server

    - Hot-add - Provides easy upgradability, allowing you to add new adapters to the
    server while it''s running. IBM was the first in the industry to offer this capability.

    - Failover - Allows a second backup adapter to pick up the workload on the fly
    if the primary adapter fails


    # Remote I/O


    Using IBM X-Architecture remote I/O (RIO) enclosure support, it is possible to
    add dozens of PCI/PCI-X adapter slots through external I/O expansion boxes providing
    incredible I/O scalability. This is yet another example of what we mean by "as
    you grow" buy only what you need, when you need it. It allows IBM to continue
    to shrink server cabinets while increasing I/O scalability through expansion units.


    # Active Memory


    IBM is delivering a new memory technology through Active Memory that increase
    capacity, performance, and reliability:


    +   - Large memory capacity - There are many reason to buy additional servers.
    You may have run out of room to add processors, or you may need more adapter slots
    (something that is solved through X-Architecture remote I/O), or you may need
    more memory than your server can hold. While some servers are constrained by the
    number of memory sockets they can hold, others are limited by the maximum amount
    of memory that can be addressed by the chipset server is using. Most servers are
    limited to 16 GB of RAM or less for these cases.

    - The Enterprise X-Architecture design ensures barrier by enabling the use of
    as 256 GB of RAM in a 64-bit based server (64 GB Xeon processor). This is enough
    to hold most databases in memory, with potentially huge gains in performance over
    databases that are accessed primarily from the disc. Concern preventing most users
    from considering running their databases in memory is the fear of a memory failure
    causing a system crash, with an attentant loss of data. The possibility of a failure
    is the reason for the major enhancements in memory reliability and availability
    provided by the X-Architecture solution.

    - High-speed memory - The fastest Intel processor-side bus (FSB) speed of 133
    MHz (many servers still use a 100 MHz FSB) determines how fast the access main
    memory and external cache memory. By contrast, Enterprise X-Architecture enables
    servers to implement the 400 MHz FSB of the Intel Xeon and second-generation Itanium
    (McKinley) processors. This means reads and writes of memory will be at today''s
    best, due to higher bandwidth and lower latency (waiting for the memory to be
    ready for the next read/write). In addition, Enterprise X-Architecture design
    also supports the use of double data rate (DDR) main memory, for even higher performance.


    +   - Memory ProteX - Memory ProteX helps you from unplanned outages due to memory
    errors far more effectively than standard ECC technology, even using standard
    DIMMs. It works like hot-spot disk in the Windows NTFS file system, if the operating
    system detects bad sectors on disk, it will write the data to share processors
    set aside for that purpose. Purpose of Memory ProteX as providing hot-spot bits.
    The error correction is handled by the memory controller, so there'
- md: '

    is no system overhead or support requirements; it is transparent to the OS. Because
    it operates on standard ECC DIMMs, you do not have to pay for this protection
    layer.


    - > IBM Chipkill ECC memory (now in its third generation in industry-standard
    computers) comes into play if a server encounters so many errors in a short span
    of time that MemoryXion cannot handle them. This should be a rare occurrence,
    but if it does happen you are still protected. Like MemoryXion, Chipkill memory
    goes well beyond the error-correction of standard ECC memory, providing correction
    for 4-bits per DIMM (eight bits per controller), whether on a single chip or multiple.
    Also, like MemoryXion, Chipkill is supported by the memory controller, so it is
    implemented using standard ECC DIMMs and is transparent to the OS.


    - > The third line of defense against server downtime due to failure is mirroring.
    Should a server somehow encounter so many errors that Memory ProXion and Chipkill
    together cannot correct them all, mirroring will keep your system running. Memory
    mirroring conceptually works much like RAID-1 disk mirroring, (Each card is configured
    independently).


    - > Hot-add/Hot-swap memory allows parts to be replaced while the server is running.
    Likewise, hot-add support allows new DIMMs to be added to a running server as
    memory demands increase. IBM xSeries servers allow permit personnel to add new
    drives, adapters, power supplies, and fans as needed. Now we have added memory
    to the list.


    ## Xce4 Server Accelerator Cache


    Another advanced performance-enhancing feature is for a huge L4 (Level 4) cache,
    with 64 MB of data rate (DDR) high-speed ECC memory per four-way central electronics
    complex (CEC) in Itanium-based servers or 32MB in Xeon systems. Years ago when
    microprocessor vendors were looking for ways to improve performance, ruled out
    using FASTL, found that using a small amount of high-speed memory in a processor
    cache (which held a copy of the most frequently accessed data from main memory)
    provided the same performance boost, but at a much lower cost. From that point
    on processors included built-in cache.


    ## Active Diagnostics


    Expandability, performance and economy are all important features in a server,
    but it is important your ability to prevent or minimize server downtime. A technology
    new to industry-standard servers that helps in regard is IBM Active Diagnostics.
    Although not directly enabled by the XA-3-64 chips, Active Diagnostics is another
    X-Architecture feature that will be incorporated in memory of the servers that
    uses them.


    If you are looking for any of these abilities in an industry-standard server today,
    they are available from IBM. These servers deliver application flexibility, innovative
    technology, and new tools for managing e-business. They bring to industry-standard
    servers the kind of capabilities that were formerly only to users of mainframes
    and other high-end systems. Combined with existing X-Architecture technologies,
    these innovations result in unprecedented economy of scale and new level of server
    availability and performance for processor-based servers. In-Intel Architecture
    (IA) servers, Linux has evolved quickly. When compared with other operating systems,
    new drivers and functions were incorporated one after another from the great development
    environment surrounding open source. Since distributions with kernel-2.4 appeared,
    Linux for Intel-Architecture servers has been accepted as an operating system.
    While the function and stability that can fully be used as an enterprise operating
    system market share of other platforms has increased little, the Intel-Architecture
    server market with Linux has increased dramatically.


