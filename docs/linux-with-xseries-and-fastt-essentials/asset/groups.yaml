    # 5.1 Management software


    This section describes some of the software that is needed to manage the IBM FASIT
    Storage Server in the Linux environment.


    # 5.1.1 IBM FASIT Storage Manager


    You would use FASIT Storage Manager to configure, manage, and troubleshoot FASIT
    Servers. Storage Manager is a Java-based GUI utility that is available for various
    operating systems and is primarily used to:


    +   - Configure arrays and logical drives

    - Assign your logical drives into storage partitions

    - Replace and rebuild failed disk drives

    - Logical drive maintenance

    - Configure advanced features (FlashCopy, Remote Volume Mirroring, and VolumeCopy)


    Storage Manager allows you to troubleshoot server components and management tasks:


    +   - Checking the status of the server components

    - Check error logs and perform recovery operations

    - Updating firmware


