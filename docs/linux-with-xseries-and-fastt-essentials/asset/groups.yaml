    # 2.4 Platform services


    The xSeries, zSeries, iSeries, and pSeries platforms work with Linux as an operating
    system today, among the other operating systems that exist in the marketplace.
    Just as software-based services for Linux are needed, so is a well-founded, platform-based
    service and support structure which is still growing.


    The IBM Support Line provides operational support services and a remote technical
    support service. For more information, see:


    http://www-1.ibm.com/services/it/us/supportline.html


    IBM provides technical support for the major distributions of the Linux operating
    system running in the xSeries, zSeries, iSeries, and pSeries platforms, well as
    some non-IBM applications that operate in a Linux environment. IBM helps answer
    how-questions, performs problem source detection, and provides mechanisms for
    a solution. By leveraging partnerships with the key distributors of the Linux
    operating system, IBM provides defect-level support for the Linux operating system.
    Remote assistance is available through toll-free or electronic access depending
    on the country or region.


    IBM provides services for all currently supported xSeries (including BladeCenter™),
    zSeries, iSeries, and pSeries platforms in a degree of variety and complexity
    through its Linux Portal. For more information see:


    http://www.ibm.com/linux/


    As Linux continues to grow, so will IBM''s commitment to enhance current services
    and provide new ones.'
