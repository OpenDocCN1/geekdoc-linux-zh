    ## Introduction to Linux


    Linux is a UNIX-like operating system. It was the original creation of Lin Torvalds
    from Helsinki, Finland in 1991. He wrote the first kernel, which is the underlying
    program running the computer hardware. Since the Linux source code is freely available,
    several companies have developed different distributions of Linux. A distribution
    is a complete system. The key component is the Linux kernel. Other utilities,
    services, and various applications can be included as well, depending on the intended
    use. There is no standard distribution. IBM early to recognize the value of Linux:


    - Investing in Linux-related product development

    - Forming alliances with key distributors

    - Contributing to the open-source community

    - Aggressively supporting the platform


    This chapter provides a brief introduction to Linux, and an historical perspective
    to its origins and relationship to open source. The chapter continues with a high-level
    description of the Linux operating systems and its components, where Linux fits
    in the IT world, and Linux distributions. IBM believes this investment will benefit
    its customers as they continue to exploit Linux for their IT infrastructures and
    e-business.


    ## The foundation for Linux


    We know Linux refers to a UNIX-like operating system, so let us begin with a brief
    overview of the development of portable operating systems and open source to see
    the context in which Linux evolved.


    ## General Public License


    In 1969, several AT&T Bell employees began work on an operating system (OS) that
    would be called UNIX. A significant novelty of their development was that the
    OS was portable hardware platforms. At the time, AT&T, for various reasons was
    permitting free access to the source code while charging over $20,000 for commercial
    or government access. AT&T then halted publication of the source code in university
    texts as this revealed proprietary Bell Labs.


    In the US, the academic variant of interest to UNIX became the Berkeley Distribution
    (BSD). Virtual memory and networking were added. These advancements permitted
    large collaborative projects with contributors throughout the world. Lawsuits
    eventually ensued among AT&T, the Regents of the University of California, and
    other parties over access to and distribution of the OS source code. Such constraints
    on intellectual property provided strong motivation for one researcher from the
    Artificial Intelligence Laboratories at the Massachusetts Institute of Technology
    to write an operating system that was both portable, and also would be licensed
    in a manner that would prevent its eventual constraint by intellectual property
    claims.


    The new OS was to make GNU, a recursive algorithm for “GNU’s Unix.” This work
    was copyleft under the General Public License (GPL), which stipulates that all
    programs run or derived from GNU must have their source published freely, relinquishing
    rights of control while retaining rights of ownership. This was free (as in freedom)
    software, in contrast to software in the public domain. By this time, vendors
    such as Sun, Hewlett-Packard, and IBM had many commercial offers derived from
    AT&T UNIX, which were gaining popularity with corporate customers. The GNU project
    effort made listing tasks such as editors, compilers, and file utilities available
    in such that could be compiled and executed on any platform, standardizing and
    improving those offered by commercial vendors. Around 1990, programmers had a
    nearly complete environment to GNU, with the exception of a kernel. The GNU kernel
    was to be based on a micro kernel architecture for improved portability.


    In the meantime, a small UNIX-like skeleton of the operating system was published
    in a test to be used as a teaching tool. Here Lin Torvalds decided to create a
    UNIX-like OS with improved functionality over that of Minix to run on available
    personal computers. And his colleague Lars Wirzenius published their source code
    under the GPL for the Internet for public, and Linux was born.


    Linux was a kernel without utilities, GNU was an operating environment lacking
    a finished kernel, and unencumbered non-kernel BSD pieces were available to complete
    the picture. In short the components were built with installation and maintenance
    tools and:


    ¹ Ken Thompson, Dennis Ritchie, and J.F. Ossanna

