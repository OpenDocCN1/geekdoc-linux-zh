    High performance clusters are typically made up of a large number of computers.
    The design of High Performance Clusters is a challenging process that needs careful
    examination of items, such as the installation, maintenance, and management of
    a large number of computers, the requirements for parallel, concurrent, and high
    performance access to the same file system(s), and the inter-process communication
    between the nodes in order to coordinate the work that must be done in parallel.


    The goal is to provide the image of a single system by managing, operating, and
    coordinating a large number of discrete computers.


    ![](img/69bfe4e2d59e61df50eecde9154775d5_44_0.png)


    Figure 3-4 A generic High Performance Cluster


    # Horizontal scaling


    Horizontal scaling clusters are used to provide a single interface to a set of
    resources that can arbitrarily grow (or shrink) in size over time. The most common
    example of this is a Web server farm. In this example, a single interface (URL)
    is provided, but requests coming in'
  - '[PAGE 45]


    through that interface can be allocated across a large set of servers providing
    higher capacity and the ability to manage the end-user experience through functions
    such as load balancing.


    Of course, this kind of cluster provides significant redundancy. If one server
    out of a large farm fails, it will likely be transparent to the users. Therefore,
    this model also has many of the attributes of a high-availability cluster. Likewise,
    because of the work being shared among many nodes, it is also a form of high-performance
    computing.


    # ## 3.4.2 Linux clusters


    Linux clusters (on Intel processors) have become very popular in academia. They
    represent an inexpensive platform for computer science issues like parallel programming,
    development of parallel tools, and management of distributed systems. At the same
    time, Intel processor-based Linux clusters have begun to appear in government
    and industrial research installations, initially as proof of concept systems,
    and now as production machines for scientific applications.


    Linux clusters represent a better price/performance opportunity that takes advantage
    of a familiar architecture and programming model. Using economic software as Linux
    and Linux-based programs on Intel-based hardware as IBM xSeries rack-mounted servers
    make the overall cost of implementing a cluster much lower than it has been in
    the past. Therefore, many enterprises are starting to make use of such clusters
    in environments where they have previously not been justified


    # ## 3.4.3 Integrated Linux cluster: IBM eServer cluster 1350


    The Cluster 1350 is an integrated offering. It is designed to be easy to configure
    and helps businesses deploy applications rapidly. By reducing the time and resources
    needed for reassembling, integrating, testing, and tuning a Linux cluster, the
    Cluster 1350 can help an organization speed time-to-production.


    ![](img/69bfe4e2d59e61df50eecde9154775d5_45_0.png)


    IBM provides installation support for the Cluster 1350. If an even higher level
    of support is desired, the optional Support Line for Linux Clusters is staffed
    by experts who understand the entire cluster, not just individual components.
    And IBM can provide project management support to coordinate all aspects of delivery
    and installation, including hardware and software setup services.'
