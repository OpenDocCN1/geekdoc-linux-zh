    ## SuSE notes


    Before you build the new ramdisk, you have to make the following change to the
    file /etc/sysconfig/kernel: add qla2200 to the string behind INITRD_MODULES, depending
    on your HBA designation:


    ```

    INITRD_MODULES="aic7xx reiserfs qla2300*"

    ```


    The script /sbin/mk_initrd uses this string. By running mk_initrd a new version
    of initial ramdisk is built in the /boot directory. Even though this is convenient
    you might built a new ramdisk instead of replacing the existing one. Have a look
    at the mk_initrd script, it offers you quite some useful (and sometimes colorful)
    options.


    ## Red Hat notes


    Before restart, you should add the kernel parameter max_scsi_luns=128 to the modules.conf
    file. This is necessary because the kernel does not probe the full range of LUNs
    by default. However, this is only critical if you are using a large amount of
    SAN volumes.


    > Note: Every change in the configuration of your SAN causes the need to reconfigure
    your paths and rebuild the initial ramdisk!


    For more about Storage Area Networks, please consult any of several IBM Redbooks
    on the topic.


    As final step you have to reboot your system. If you want an automatic mount of
    your volumes you have to enter the appropriate parameters in /etc/fstab.


    > Important: Keep in mind, failure of a volume prior or during reboot may cause
    a change in the SCSI device numbering sequence.


    - 1 Introduction to Storage Area Networks, SG24-5470-01 and Designing and Optimizing
    an IBM Storage Area Network, SG24-6419-00 are just two examples.


    ## Workarounds with IBM TotalStorage Storage Servers and Linux


    As with all operating systems, Linux has some limitations. This appendix provides
    a description of some of the limitations of using Linux with the IBM FASIT TotalStorage
    adapters and provides some workarounds.


    ## Supported logical drives


    The supported logical drive limits are as follows:


    - When using Linux Storage Management Services (SMS), you can configure up to
    128 LUNs or the maximum for the host adapter model.

    - Host adapters support a specific number of logical drives. See the host adapter
    documentation for specific information.


    ## Linux Limitations and workarounds


    The following table lists the limitations that when you use IBM TotalStorage FASIT
    Storage Manager Version 8.3 with Linux (Table 5-3).


    Table 5-3 List of limitations that apply with IBM TotalStorage Manager


    | Limitations | Workaround |

    | --- | --- |

    | Vixel Rapport 2000 Fibre Channel hubs using controllers with firmware version
    04.01.02 cause problems, including damage to data, system instability, and disrupted
    loop activity. | Do not use Vixel Rapport 2000 Fibre Channel hubs when your system
    is operating in a controller or an I/O path fault-tolerant environment. |

    | Limitations | Workaround |

    | The maximum number of physical drives allowed in a single RAID 5 logical drive
    is 29. The maximum number of physical drives allowed in a single RAID 1 logical
    drive is 28. | None |

    | After removing drives from a storage subsystem, you are prompted for a password
    at software startup, or when you perform protected operations, all passwords you
    enter. | Add one of the drives to the storage subsystem and attempt the operation
    again. |

    | Removing a set of drives that are configured with logical drives from one storage
    subsystem for insertion into another storage subsystem is not supported because
    it might cause loss of configuration. | Contact an IBM technical support representative
    for assistance. |

    | A standard non-network configuration is not supported when the Linux host does
    not have the TCP/IP software. | Install the TCP/IP software on the Linux host
    customer and assist the host static IP address |

    | Multipath failover will only work if the storage controllers are in active/active
    mode. | When you configure the storage subsystem, change both controllers to active
    status. |

    | The controller firmware does not recognize or communicate with a single controller
    slot A is populated. This restriction does not apply to storage subsystems that
    were originally configured with two controllers. | When you configure a new subsystem
    with a single controller, place the controller in slot A. |

    | Your windows and online help display a brownish fallish pattern when you run
    in 256 color mode. | Run the Storage Manager 8.3 application in a higher display
    mode. |

    | When performing a redundancy check (parity scan) from the storage-management
    application, machine type 3542 can take several minutes longer than machine type
    1742 and 3552 controller platforms. | None |

    | You might not see the maximum number of drives during Automatic Configuration
    if you are using of different capacities. | Use Manual Configuration to select
    individual drives and select the maximum number of drives allowed. |

    | When you connect an IBM TotalStorage FASIT EXP707 Storage Expansion Unit to
    a FASTT200, the drive speed must be set to 1 Gb per second. | None |


