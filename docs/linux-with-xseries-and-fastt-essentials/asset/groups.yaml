    ## ## 4.4 高级功能


    高级功能是 IBM TotalStorage FASIT 存储服务器的高功能，必须单独购买。这些额外功能包括：


    - 存储分区

    - FlashCopy®

    - 远程卷镜像 (Remote Volume Mirroring)

    - 卷拷贝 (VolumeCopy)


    > 注意：高级功能是 IBM TotalStorage FASIT 存储服务器固件的功能，可以在连接的 Linux 主机上使用，方式与运行任何支持的主机操作系统的主机相同。


    ### ### 4.4.1 存储分区简介


    存储分区为 FASIT 存储服务器增加了高度的灵活性。它允许您连接数量多的的主机系统，无论是独立模式还是集群模式。


    连接到 FASIT 存储服务器的基于 Intel 的主机系统通常运行存储处理能力有限的操作系统。这些操作系统大多数只能将存储视为本地连接到主机系统。除非使用第三方文件共享软件，否则两个或多个独立主机系统或集群无法访问同一个存储空间，否则会导致灾难性的结果。这与存储区域网络（SAN）的理念相冲突，在
    SAN 中存储应该是许多主机系统全局可用的。


    如果没有存储分区，配置在 FASIT 存储服务器上的逻辑驱动器只能被单个主机系统或单个集群访问。这无疑会导致存储硬件的低效利用。


    另一方面，存储分区允许您创建包含主机及其主机总线适配器（HBA）以及逻辑驱动器的集合。我们称这些集合存储分区。现在主机只能访问其分配的逻辑驱动器，就像这些逻辑驱动器本地连接到它们一样。您可以使用流行的
    Intel 平台操作系统将多个主机或集群连接到同一个 FASIT 存储服务器。存储分区将 SAN 的全局可用存储理念应用于具有本地思维的操作系统。


    一个存储分区包含几个元素：


    - 逻辑驱动器映射

    - 主机或组

    - 主机端口


    主机组是允许访问同一个逻辑驱动器的主机集合，例如两个系统。


    主机是可包含在主机组中的单个系统。


    主机端口是主机系统中主机总线适配器的 FC 端口。主机端口通过其全球标识符（WWN）识别。单个主机可以包含多个端口。如果您以冗余方式连接服务器（强烈建议），每个服务器需要两个主机总线适配器。也就是说，在同一个主机系统内需要两个端口。


    FASIT 存储服务器仅通过 WWN 进行通信。存储子系统不知道哪些主机适配器在同一服务器中或在具有特定关系（如集群）的服务器中。主机组、主机及其主机端口实际上反映了您的
    SAN 物理连接的逻辑视图以及服务器之间的逻辑连接（例如集群）。


    在之前定义的本地设置中，映射是将逻辑驱动器分配给特定主机组或主机的特定赋值。


    存储分区是所有这些组件的组合。它确保即使连接了多个主机或集群，也能正确访问逻辑驱动器。


    通过 FASIT 存储管理器，您拥有 FASIT 存储服务器支持多达 64 个存储分区的能力。特定 FASIT 型号的最大存储分区数量请参见图 4-2。


    表 4-2 当前支持的最大存储分区


    | FASIT 型号 | 支持的分区数量 |

    |---|---|

    | FASIT 200 | 16 |

    | FASIT 600 | 1, 4 或 8 - Turbo 版本为 64 |

    | FASIT 700 | 64 |

    | FASIT 900 | 64 |


    > 注意：在某些 FASIT 型号上，分区数量还取决于购买的（功能）许可证。


    ## ## 4.4.2 FlashCopy 简介


    FlashCopy 逻辑驱动器是逻辑驱动器的点映像。它是完整物理拷贝的逻辑等效物，但您创建它的比物理拷贝快得多，所需的磁盘空间也更少。在此版本的存储管理软件中，作为
    FlashCopy 的逻辑驱动器（称为基础逻辑驱动器）必须是存储子系统中的标准逻辑驱动器。通常，您创建 FlashCopy是为了让应用程序（例如备份应用程序）访问
    FlashCopy 并读取数据，而基础逻辑驱动器保持在线且用户可用。当备份完成后，FlashCopy 逻辑驱动器就不再需要。


    您还可以为基础逻辑驱动器创建多个 FlashCopy 并向这些 FlashCopy 逻辑驱动器写入数据以进行测试和分析。例如，在升级数据库管理系统之前，可以使用
    FlashCopy 逻辑驱动器测试不同的配置。然后可以使用存储管理软件提供的性能数据帮助决定如何配置数据库系统。


    当您执行 FlashCopy 时，控制器会挂起对基础逻辑驱动器的 I/O 几秒钟，同时创建一个名为 FlashCopy 库逻辑驱动器的物理驱动器，用于存储
    FlashCopy 元数据写时拷贝（copy-on-write）数据。当控制器完成 FlashCopy 库逻辑驱动器的创建后，基础逻辑驱动器的 I/O写入继续。然而，在修改基础逻辑驱动器上的数据块之前，会发生写时拷贝，将内容复制到
    FlashCopy 库中保存。由于 FlashCopy 库逻辑驱动器在该驱动器中存储原始数据的副本而无需再次进行写时拷贝，而且由于物理存储在 FlashCopy
    库逻辑驱动器中的唯一数据块是自 FlashCopy 时间以来更改的内容，因此 FlashCopy 技术使用的磁盘空间比完整拷贝少。


    当您执行 FlashCopy 时，会指定创建 FlashCopy 库逻辑驱动器的位置、容量和其他参数。当您不再需要 FlashCopy 时可以禁用它，例如备份完成后。然后下次执行备份时可以重建
    FlashCopy 并重用同一个 FlashCopy 库逻辑驱动器。使用禁用 FlashCopy 和重建 FlashCopy 下拉菜单提供了创建新 FlashCopy
    逻辑驱动器的快捷方式，因为不需要创建新的 FlashCopy 库逻辑驱动器。


    # 基础卷 库卷数据


    ![](img/69bfe4e2d59e61df50eecde9154775d5_62_0.png)


    图 4-8 FlashCopy 写架构


    您还可以删除 FlashCopy 逻辑驱动器，这将同时删除关联的 FlashCopy 库逻辑驱动器。当您的 FlashCopy 库容量接近用户指定的阈值（完整容量的百分比，默认为
    50%）时，存储管理软件会提供警告消息。当此情况发生时，可以使用存储管理软件从空容量扩展您的 FlashCopy 库逻辑驱动器。如果阵列容量不足，可以向阵列添加未配置容量以扩展
    FlashCopy 库逻辑驱动器。


    > 注意：FlashCopy 是高级功能。请联系您的 IBM 经销商或 IBM 营销代表获取更多信息。


    ## 4.4.3 远程镜像简介


    远程镜像选项是随 IBM FASIT Storage Manager 8.2 或更高版本软件提供的高级功能，通过购买高级功能密钥启用。远程镜像用于跨距离存储子系统的在线实时复制。当一个存储子系统发生灾难或不可恢复的错误时，远程镜像选项允许您提升第二个存储子系统以接管正常的输入输出（I/O）操作（图
    4-9）。


