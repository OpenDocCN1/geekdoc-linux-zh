    # A.1.2 Is there a Storage manager agent for Linux?


    The FASIT Storage Manager software does not include an agent process for all operating
    systems. For example, there is no agent that runs under Linux. A Linux system
    can run the Storage manager client and manage a FASIT system using in-band control
    if there is a host that has a Fibre Channel connection to the FASIT and runs the
    Storage Manager agent. In this case the Storage Manager client on the Linux system
    would communicate with the agent on the non-Linux system. However, if the only
    hosts attached to the FASIT subsystem are Linux hosts, or if there are no attached
    hosts for agent software is available that can be considered as management agent
    candidates, then out-of-band control must be used.


    For this discussion we assume that the environment is purely Linux, and that out-of-band
    control will be used to manage the FASIT.


    # A.1.3 Is there a RDAC driver for Linux?


    At the time of this writing the Redundant Disk Array Controller (RDAC) is not
    available for Linux. This means that Linux hosts using storage on FASIT have volume
    transfers within the FASIT managed by itself. Multipathing is done using the appropriate
    driver for the Host Bus Adapter (HBA) and additional software called FASIT MSI,
    which is used to manage the paths with the Host Adapters. FASIT MSI is described
    in Appendix B., "FASIT Management Suite Java" on page 75.


    # A.2 FASIT Storage Manager client: getting started


    # A.2.1 Linux Install of the FASIT Storage Manager client


    Linux distributions of interest to us in this redbook equipped with the rpm package
    manager. This tool maintains a dependency list that if one package requires another,
    the user will be notified. When installing the Storage Manager client under Linux,
    you should install the Java runtime environment before the client software.


    In our implementation, the FASIT Storage Manager client resides on a Linux management
    station that can communicate with the FASIT controllers through the network. Such
    a storage management may also be a host that is attached to the FASIT storage
    through Fibre Channel, but in the Linux environment, there is no Storage Manager
    agent available. So if the Storage Manager client is installed on a host that
    is attached through Fibre Channel the management still requires network connectivity
    to the FASIT controllers. Both the client and the runtime environment are provided
    on the FASIT CD but the latest versions (as well as the latest firmware for the
    FASIT controllers and expansion modules, please see Appendix A.3,"Updating FASIT
    firmware" on page 63 for detailed instructions on updating firmware) can be obtained
    from the following URL:


    ```

    http://www.storage.ibm.com

    ```'
