    没有系统开销或支持要求；它对操作系统是透明的。因为它在标准的 ECC DIMM 上运行，因此您无需为此保护层付费。


    - > IBM Chipkill ECC 内存（在工业标准计算机中已进入第三代）当服务器在短时间内遇到大量错误，导致 MemoryXion 无法处理时，Chipkill
    将派上用场。这应该是一个罕见的情况，但如果确实发生了，您仍然受到保护。与 MemoryXion 一样，Chipkill 内存的功能远超标准 ECC 内存的纠错能力，可以为每个
    DIMM 纠错 4 位（每个控制器 8 位），无论是在单个芯片还是多个芯片上。此外，与 MemoryXion 一样，Chipkill 内存控制器的支持，因此它使用标准的
    ECC DIMM 实现，并对操作系统是透明的。


    - > 防止故障导致服务器宕机的第三道防线是镜像。如果服务器由于某种方式遇到了大量的错误，以至于 Memory ProXion 和 Chipkill 无法全部纠正，镜像将保持您的系统运行。内存镜像在概念上的工作原理类似于
    RAID-1 磁盘镜像（每张卡均独立配置）。


    - > 热插拔/热拔拔内存允许在服务器运行时更换部件。同样，热插拔支持允许随着内存需求的增加，向运行中的服务器添加新的 DIMM。IBM xSeries 服务器允许许可的人员根据需要添加新的驱动器、适配器、电源和风扇。现在我们将内存也加入了了该列表。


    ## Xce4 服务器加速缓存


    另一个先进的性能增强功能是巨大的 L4（四级）缓存，在基于安腾（Itanium）的服务器中，每四路中央电子组件（CEC）配备 64 MB 数据传输率（DDR）高速
    ECC 内存，在 Xeon 系统中为 32MB。多年前，当微处理器供应商正在寻找提高性能的方法时，排除了使用 FASTL，发现在处理器缓存中使用少量高速内存（存储主内存中最频繁访问数据的副本）可以提供相同的性能提升，但成本低得多。从那时起，处理器就包含了内置缓存。


    ## 激活诊断


    可扩展性、性能和经济性都是服务器的重要特征，但预防或最大限度地减少服务器宕机的能力至关重要。IBM Active Diagnostics 是工业标准服务器的一项新技术，可以在这方面提供帮助。虽然
    XA-3-64 芯片没有直接启用，但 Active Diagnostics 是另一项 X 架构特性，将整合到使用这些芯片的服务器内存中。


    如果您今天在工业标准服务器中寻找这些功能的任何一个，都可以从 IBM 获取。这些服务器为应用提供了灵活性、创新技术以及管理电子商务的新工具。它们为工业标准服务器带来了以前仅供大型机和其他高端系统用户才具备的能力。与现有的
    X 架构技术相结合，这些创新实现了基于处理器的服务器前所未有的规模经济，并提升了基于处理器的服务器可用性和性能的新水平。在英特尔架构（IA）服务器中，Linux
    的进化迅速。与其他操作系统相比，来自开源社区的庞大开发环境不断整合了新的驱动程序和功能。自从带有内核 2.4 的发行版出现以来，用于英特尔架构服务器的 Linux
    已被接受为操作系统。虽然完全作为企业操作系统的功能和稳定性在其他平台的市场份额增长很小，但使用 Linux 的英特尔架构服务器市场大幅增加。


