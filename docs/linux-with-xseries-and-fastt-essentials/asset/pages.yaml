  md: '# 5.1.3 SANnavigator Diagnostic and Management Software


    SANnavigator management software provides easy, centralized management and diagnosis
    of SAN, and quick access to all device configuration applications. SANnavigator
    is provided as a trial version and runs for 30 days. If you require to use it
    you can purchase the product by sending an e-mail to IBMcustomer@navigator.com


    It provides an intuitive interface and point click functionality. Through its
    graphical display of the complete SAN, administrators of all levels can manage
    their networks with ease.


    With SANnavigator you can monitor the health of your SAN and identify potential
    problems that may impact the performance and the availability of your SAN.


    Along with the available Problem Determination Maps (PDMs), SANnavigator greatly
    facilitates problem isolation and repair of your SAN.


    Some of the features includes:


    +   - Intuitive GUI with topology display

    - Out-of-band and in-band management (requires API library)

    - Quick identification of port connections for each of your devices

    - Launch capability of applications and tools such as the IBM FASIT Storage Manager
    and IBM FASIT MSJ diagnostic

    - Event logging

    - Ability to easily export SAN files so that they can be imported into a remote
    SANnavigator system, displayed and analyzed


    # 5.1.4 FASIT Service Alert, a support option for FASIT Storage Servers


    FASIT Service Alert is available to all current and new FASIT Storage Server customers.
    FASIT Service Alert (hereafter called Service Alert) enables the IBM TotalFASIT
    Storage Manager to monitor system health and automatically to notify the IBM Support
    Center when problems occur. Service Alert sends an e-mail to an IBM call management
    center that identifies your system and location details such as your phone number.
    The IBM support center analyzes the contents of the e-mail alert and contacts
    you to begin problem determination. The service is available worldwide.


    For more information on the FASIT Service Alert visit:

    http://w3-1.ibm.com/sales/systems/ibmsm.msf/documents/fastservalert'
