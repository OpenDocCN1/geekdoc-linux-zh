    Linux, a supplier of servers that run Linux, and a provider of support for customers
    who choose to use Linux. IBM''s commitment to Linux may be best illustrated with
    some of the many notable highlights over the last years:


    +   - As early as March 1999, IBM had announced key alliances, products, and global
    support for Linux, including among others like SuSE Holding AG (all of which founded
    United Linux along with distributor Connectiva S.A22), and Red Hat Software Inc.
    By Red Hat.


