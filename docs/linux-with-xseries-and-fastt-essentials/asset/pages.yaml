    # 3.4 Linux and xServers clustering


    In its simplest form, a cluster consists of two or more computers that work together
    to provide a solution. It should not be confused with a more common client-server
    model of computing where an application may be logically divided that one or more
    clients request services of one or more servers. The idea behind clusters is joining
    the powers of the nodes involved to provide higher scalability, more computing
    power, or to build in redundancy to provide higher availability. So, rather than
    a simple client making requests of one or more servers, clusters utilize multiple
    machines to provide a more powerful computing environment through shared images.


    Clusters of computers must be somewhat self-aware, that is, the work done on a
    specific node must coordinate with the work done on other nodes. This can result
    in complex connectivity configurations and sophisticated inter-process communications
    between the nodes of a cluster. In addition, the sharing of data between the nodes
    of a cluster through a common file system is almost always a requirement. There
    are many other complexities introduced by clusters, such as the operational considerations
    of dealing with a large number of clusters as a single resource.


    For additional information, refer to the following Web site:


    http://www.pc.ibm.com/weserver/xseries/clustering/info.html


    # 3.4.1 Different types of clusters


    As described, clusters may exist in many different forms. The most common cluster
    types are:


    +   - High availability (HA)


    +   - High performance computing (HPC)


    +   - Horizontal scaling (HS)


    It should be noted that the boundaries between these cluster types are somewhat
    indistinct, and an actual cluster may have properties or provide the function
    of more than one of these cluster types.


    # High availability


    High-availability clusters are typically built with the intention of providing
    a fail-safe environment through redundancy, that is, providing a computing environment
    where the failure of one or more components (hardware, software, or networking)
    does not significantly affect the availability of the application or applications
    being used. In the simplest case, two computers configured identically with shared
    storage. During normal operation, the application executes on one system, while
    the other simply stands by ready to take over the application in the case of a
    failure. When'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'failure occur, the second system takes over the appropriate resources (storage,
    networking address, and so on). This process is typically called failover. The
    second system then completely replaces the failed system, and the end users have
    no need to know that their applications are running on a different physical machine.


    ![](img/69bfe4e2d59e61df50eecde9154775d5_43_0.png)


    Load Balancers

    There must be a minimum of two for redundancy. Additional units can be added for
    scalability. Example: Linux Virtual Server (LVS)


    Web Servers

    There must be a minimum of two for redundancy. Additional units can be added for
    scalability. Example: Apache


    Application Servers

    There must be a minimum of two for redundancy. Additional units can be added for
    scalability. Example: IBM WebSphere


    Database Backend Servers

    There should be a few for redundancy. Additional units cannot be added easily
    so there should be faulty robust. Example: IBM DB2


    > Note: The Application Server condition can be included in the DB/Backend Servers
    instead as separate units. A minimum configuration be 6 units.


    Figure 3-3 A generic HA cluster


    # High performance computing


    High performance computing clusters are designed to use parallel computing processing
    to the solution of a problem. There are many examples of scientific computing
    using multiple low-cost processors in parallel to perform large numbers of operations.
    This is referred as parallel computing or parallelism. In How to Build a Beowulf:
    A Guide to the Implementation and Application of PC Clusters (Scientific and Engineering
    Computation), by Sterling, et al¹, parallelism is defined as the "ability of many
    independent threads of control many process simultaneously towards the completion
    of a task."


