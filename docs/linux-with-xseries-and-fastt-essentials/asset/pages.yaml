  md: '# 2.1.1 The IBM Linux Technology Centers


    The IBM Linux Technology Center (LTC), whose mission is to work directly with
    the Linux development community with a shared vision of making Linux succeed,
    has one of the industry''s most comprehensive Linux development teams. They are
    a proven, accepted part of the open source Linux community, successfully bringing
    features into Linux. By doing so they provide Linux technical expertise to the
