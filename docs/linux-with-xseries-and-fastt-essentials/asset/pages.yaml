    \n# The GNU General Public License\n\nIn 1969, several AT&T Bell employees¹ began\
    \ work on an operating system (OS) that would be called UNIX. A significant novelty\
    \ of their development was that the OS was portable hardware platforms.\n\nAt\
    \ the time, AT&T, for various reasons was permitting free access to the source\
    \ code to UNIX while charging over $20,000 (in 1976 dollars!) for commercial or\
    \ government access. AT&T then halted publication of the source code in university\
    \ texts as this revealed proprietary Bell Labs code. \n\nIn the US, the academic\
    \ variant of interest to UNIX became the Berkeley System Distribution (BSD)²²\
    \ virtual memory and networking were added. These advancements permitted large\
    \ collaborative projects with contributors scattered throughout the world. Lawsuits\
    \ eventually ensued among AT&T, the Regents of the University of California, and\
    \ other parties over access to and distribution of the OS source code. Such constraints\
    \ on intellectual property provided strong motivation for one researcher from\
    \ the Artificial Intelligence Laboratories at the Massachusetts Institute of Technology\
    \ to write an operating system that was both portable, and also would be licensed\
    \ in a manner that would prevent its eventual constraint by intellectual property\
    \ claims.\n\nThe new OS was to make GNU, a recursive algorithm for “Gnu’s Unix”³\
    \ This work was “copylefted” infringed under the GNU General Public License (GPL),\
    \ which stipulates that all programs run or derived from GNU must have their source\
    \ published freely, relinquishing rights of control while retaining rights of\
    \ ownership. This was by free (as in freedom) software, in contrast to software\
    \ in the public domain. By this time, vendors such as Sun, Hewlett-Packard, and\
    \ IBM had many commercial offers derived from AT&T UNIX, which were gaining popularity\
    \ with corporate customers. The GNU project effort made listing tasks such as\
    \ editors, compilers, and file utilities available in such that could be compiled\
    \ and executed on any platform, standardizing and improving those offered by commercial\
    \ vendors. Around 1990, programmers had a nearly complete environment to GNU,\
    \ with the exception of a kernel. The GNU kernel was to be based on a micro kernel\
    \ architecture for improved portability.\n\nIn the meantime, a small UNIX-like\
    \ skeleton of the operating system was published in a test to be used as a teaching\
    \ tool. Here he Lin Torvalds decided to create a UNIX-like OS with improved functionality\
    \ over that of Minix to run on available personal computers. And his colleague\
    \ Lars Wirzenius published their source code under the GPL for the Internet for\
    \ public, and Linux was born.\n\nLinux was a kernel without utilities, GNU was\
