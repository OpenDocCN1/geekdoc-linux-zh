  md: '# 3.1 Introduction to xSeries and X-Architecture


    The xSeries server is based on X-Architecture, where IBM linked advanced technology
    from years of enterprise server development, and the industry-standard technology
    represented by the Intel CPU (Figure 3-1).


    | xSeries | iSeries | zSeries |

    | :--- | :--- | :--- |

    | ![xSeries](https://example.com/xseries.png) | ![iSeries](https://example.com/iseries.png)
    | ![zSeries](https://example.com/zseries.png) |

    | Performance | Scalable | Manageable |


    Figure 3-1 The concept of xSeries: Learning the best from all IBMServer product
    lines


    While the xSeries server delivers advanced technology to customers at a low price,
    many applications and services with industry standards are also usable. In the
    autumn 2001, IBM announced the Enterprise X-Architecture. This new technology
    raises the bar on scalability, flexibility, availability, and performance by a
    dynamic arrangement of server resources. IBM offers X-Architecture through core
    logic developed by IBM and realized through the IBM X-ia32 and IA-64 processors.


    Operating system support for xSeries changes frequently. This information is available
    at the IBM ServerProver® site on the Web:


    http://www.pc.ibm.com/us/compat/nos/matrix.html


    You can find the drivers and documents for xSeries on the Web at:


    http://www.pc.ibm.com/pc/support/site.wss


    IBM Server technology is a blueprint for extending the benefits of advanced technologies
    to Intel processor-based servers. These benefits are in the areas of availability,
    scalability, systems management, service, and support. IBM has been delivering
    on the promise of the X-Architecture model since 1998. It has included innovative
    technologies like Active™, C27 Interconnect cabling, Chipkill™ memory, Predictive
    Failure Analysis®, Light Path Diagnostics™, and IBM Director Software Rejuvenation.


    Today, IBM continues to build on the X-Architecture blueprint with Enterprise
    technologies. These technologies yield revolutionary advances in the input/output
    (I/O), memory, and performance of xSeries servers. This peerless new server design
    creates a flexible “pay as you grow” approach to buying high-end 32-bit and 64-bit
    xSeries servers. The results are systems that can be scaled quickly, easily, and
    inexpensive.'
