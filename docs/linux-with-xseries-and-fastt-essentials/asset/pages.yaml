    A minimum of two arrays is required. One storage system can have primary volumes
    mirrored to other arrays, and hold secondary volumes from multiple arrays.


    The maximum number of storage subsystems that can participate in a remote mirror
    configuration is two. The two storage subsystems are called primary and secondary
    storage subsystems or as local and remote mirror subsystems. These names are used
    interchangeably to describe remote mirror setups or configs. The names do not
    refer to the location of storage subsystems or the role storage subsystems have
    in a remote mirror relationship.


