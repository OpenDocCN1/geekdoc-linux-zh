    # 5.1.2 IBM FAST Management Suite Java


    If your Linux installation uses the IBM FAST Host Bus Adapter, then you will use
    the IBM FAST HBA driver. If you have multiple paths to your storage, this driver
    can provide a fail-over capability, but the paths must be configured.


    When using two adapters, it is necessary to hide one path to the LUN away from
    Linux. This is necessary because, like most operating systems, Linux does not
    supporting multip by itself. At boot time, the adapters negotiate the preferred
    path, which will be the only visible one. However, with the management tool, it
    is possible to make an adequate configuration instead of getting FC protocol negotiations
    and driver design. Additionally, it is possible to choose the LUNs visible for
    the OS. Also included is static load balancing that distributes access to the
    individual LUNs through several paths.


    This is the function of IBM FAST Management Suite Java (MSJ) Diagnostic and Configuration
    Utility. The IBM FAST Management Suite Java (FASJ) is an application designed
    for the monitor and configuration of a SAN environment. This application is specifically
    designed for IBM Fibre Channel in such an environment.


    With HBA components, storage devices, and host systems, this application helps
    complete a Storage Area Network.


    FASJ MSJ is a network-capable (client/server) application that can connect to
    and configure a remote Windows NT, Linux, or Novell Networks systems. The networking
    capability of the application allows for centralized management and configuration
    of the system:


    With the application, you can use the four types of operations to configure devices
    in the


    +   * Disable (un-configure) a device on a Host Bus Adapter


    +   * When a device is set as un-configured by the utility, it is not recognized
    by the HBA and is inaccessible to HBA on that system.


    +   * Enable a device

    * To add a device and make it accessible to the HBA on the system


    +   * Designate a path as preferred or alternate

    * When a LUN is accessible from more than one adapter in the same system, one
    path can be assigned as the preferred path and the other one as the alternate
    path. For some reason the preferred path fails, the system switches to the alternate
    path to assure that the transfer of data is not interrupted.


    +   * Replace a device that has been removed with a device that has been inserted

    * In a hot-plug environment, the IBM driver does not automatically purge a device
    that was physically removed. Similarly, it does not delete a device that is no
    longer accessible because of errors or failure. Internally, the driver keeps the
    device in its database and marks it as invisible.'
