    # 1.6.3 UnitedLinux


    UnitedLinux is a consortium formed in May 2002, established to combine the development
    of several distributors.


    The vision is simple: partners combine the very best operating system technology
    from leading distributors into a robust, single code base system. In January 2003
    IBM joined UnitedLinux as a technology partner.


    The following UnitedLinux consortium members have identical UnitedLinux distributions:


    +   SuSE Enterprise Server 8 (SLES 8)


    +   Turbinux Enterprise Server 8 (TLES 8)


    +   Connectiva Linux Enterprise Edition Powered by Linux


    All companies provide distributions for Intel (xSeries), iSeries, pSeries, and
    zSeries. Turbinux and Connectiva recall the SuSE distribution. Turbinux markets
    primarily in the Asia Pacific, Connectiva markets primarily in Latin America.
    Turbinux and Connectiva will provide bug fixes to their customers within 30 days
    of release by SuSE. SuSE is the leadLinux developer.


    Key elements of this distribution include POSIX asynchronous I/O (AIO), raw I/O
