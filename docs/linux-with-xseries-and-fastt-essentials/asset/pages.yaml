  md: "# B.1 FASIT MSJ\n\nIf your installation uses the IBM FASIT Host Bus Adapter,\
    \ then you will use the IBM FASIT HBA driver. If you have multiple paths to your\
    \ storage, this driver can provide a fail-over capability, but the paths must\
    \ be configured. This is the function of IBM FASIT Management Suite Java (MSJ)\
    \ Diagnostic and Configuration Utility. This allows you to view the current HBA\
    \ configuration, attached nodes, LUNs, It allows you to configure paths and perform\
    \ some diagnostics.\n\nFASIT MSJ has a GUI component. It also has an agent that\
    \ runs on the host containing the HBAs. The agent, qm-remote, is quite small but\
    \ the GUI is rather large, so allow sufficient space (50 MB) for unpacking and\
    \ installing the product.\n\n# B.1.1 Installing FASIT MSJ\n\n Obtain the latest\
    \ version of the IBM FASIT MSJ from the Web.\n\nThe FASIT MSJ version is closely\
    \ tied with the HBA version. Ensure that you have the correct version. Extract\
    \ the gzipped file:\n\n```\ntar zxv *.tgz\n```\n\nThis will extract the required\
    \ files to ./FASIT_MSJ/Linux\n\nAs root, install FASIT_MSJ using the following\
    \ command:\n\n```\nsh ./FASITMSJ_install.bin\n```\n\nYou should see a screen similar\
