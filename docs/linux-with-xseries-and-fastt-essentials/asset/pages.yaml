  md: '# Preface


    IBM® has been committed to Linux long before it became trendy. This early adoption
    of the Linux potential explains why today IBM offers the widest range of platforms
    and products for deploying solutions on Linux, along with support and services.


    IBM TotalStorage® products are known for their high quality and reliability and
    work well with Linux. As part of a well designed Linux based e-business infrastructure,
    they can help you cut costs, consolidate infrastructure, and position you for
    the new on demand world.


    This IBM Redbook presents high-level information on Linux in conjunction with
    IBM @and TotalStorage products, proving point that these solutions can be deployed
    together to provide enterprise-class solutions. In particular, this book looks
    at Linux with the xSeries® servers and IBM TotalStorage/FASTIT disk products.


    This redbook is introduced as a starting point for Business, Partners, and clients
    who are planning Linux based solutions with IBM xServers and FaSTIT products.


    Most of the information contained in this book is a compilation of the material
    from the Linux Handbook, SG24-7000, and Implementing Linux with IBM Disk Storage,
    SG24-6262-01. We encourage the reader to refer to these redbooks for more complete
    information or implementation details.


    # The team that wrote this redbook


    This redbook was produced by a team of specialists from around the world working
    at the International Technical Support Organization, San Jose Center.


    Bertrand Duranse is a Certified Consulting I/T Specialist and Project Leader for
    Disk Systems at the International Technical Support Organization, San Jose Center.
    He has worked at IBM for 21 years in IT markets. Before joining the ITSO he worked
    for IBM Global Services in the US as an IT Architect. He holds a degree in Electrical
    Engineering.


    Jonathan Wright is a technical specialist in New Zealand. He has 10 years of experience
    in the Intel server and storage field. His areas of expertise include xSeries
    hardware, Linux, clustering and FaSTIT Storage.


    Thanks to the following people for their contributions to this project:


    Cristina Zabeu

    IBM Linux Solutions Market Leader


    Mary T. Morris

    IBM WW Linux Sales Leader


    Nick Harris, Ralph Cooley, Cameron Hunt, Randy Kusecke, Dan Lance, Tomomi Takada,
    Bob Waite, Dirk Webbereler, Alexander Zaretsky, original authors of the Linux
    Handbook, SG24-7000.


    Ronald Annus, James Goodman, Paul McWatt, Arwed Tschoeke, original authors of
    the the Implementing Linux with IBM Disk Storage, SG24-6261-01.'
