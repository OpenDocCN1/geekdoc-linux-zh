    # Backing up data


    The VolumeCopy premium feature allows you to create a backup of a logical drive
    by copying data from one logical drive to another logical drive in the same storage
    subsystem. The target logical drive can be used as a backup for the logical drive,
    for system testing, or to back up to another device, such as a tape drive.


    # Restoring FlashCopy logical drive to the base logical drive


    If you need to restore the base logical drive from its associated FlashCopy logical
    drive, the VolumeCopy premium feature can be used to copy the data from the FlashCopy
    logical drive to the base logical drive. You can create a logical drive of the
    data on the FlashCopy logical drive, then copy the data to the base logical drive.


