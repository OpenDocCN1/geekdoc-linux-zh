  md: '# B.1.2 Configuring the lun attachment


    This introduces you to the best practices for administering Fibre Channel environment.
    By describing how the settings are made, let us take a moment to understand how
    the fibre-attached devices (or any devices, in general) become effective. Device
    interfaces to the kernel are done using software called device drivers. Linux
    has two different ways of integrating device drivers:


    +   * Directly to the kernel

    * Loadable modules


    To have the drivers at boot time, they may be compiled into the kernel, or the
    boot loader (GRUB) can load an initial ramdisk which contains all necessary drivers
    (see Figure 5-32).


    ![](img/69bfe4e2d59e61df50eecde9154775d5_93_0.png)


    Figure 5-32 Building a ramdisk image


    When you can mkinitrd scripts .conf for the network, including all options for
    the particular modules, the drivers for the network, the Fibre Channel, and other
    modules are included. In addition, a long list (generated by FASIT MSJ, we see
    how to do this in B.1.3, "Use FASIT MSJ to configure Fibre Channel paths") to
    set up the FASIT multipath driver during boot. This leads to the following:


    +   * Every time a change to your configuration occurs, you have to generate a
    new initial ramdisk and reboot (or reload the Fibre driver).

    * It is quite useful to keep an initial ramdisk with no options for the FASIT
    HBA in reserve. After rebooting this, the driver detects attached devices and
    sets preferred paths, but these are not overlapped by the options. With, MSJ,
    you can generate a new, free option string.


    > Note: Any change in the configuration of your SAN causes to reconfigure your
    paths and create a new initial ramdisk.


    78 Linux with xSeries and FASIT - Essentials'
