    # 4.4.3 Introduction to Remote Mirroring


    The Remote Mirror option is a premium feature that comes with the IBM FASIT Storage
    Manager 8.2, or newer, software, and is enabled by purchasing a premium feature
    key. The Remote Mirror option is used for online, real-time replication of data
    storage subsystems over a remote distance. In the event of a disaster or unrecoverable
    error at one storage subsystem, the Remote Mirror option enables you to promote
    a second storage subsystem to take over responsibility for normal input/output
    (I/O) operations (Figure 4-9).'
