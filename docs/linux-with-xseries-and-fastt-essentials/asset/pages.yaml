    The LTC has a team of 250-plus, with a small part of the community located in
    many centers around the world. These centers are located in Adelaide, Austin,
    Bangalore, Beaverton, Beijing, Bethesda, Boelingston, Boulder, Cambridge, Canberra,
    Chicago, Edincott, Haworth, Hurley, Mt. Laurel, New York City, Portland, Poughkeepsie,
    Raleigh, Rochester, San Francisco, Somers, Urbana-Champaign, Yamato, and Yorktown.


    The Linux Technology Center can be located on the Web:

    http://www.ibm.com/linux/ltc


    # IBM JFS to Linux Storage


    IBM''s journaled file system (JFS), currently used in IBM enterprise servers is
    designed for high-throughput server environments, key to running intranet and
    other high-performance enterprise file systems. IBM is contributing this technology
    to the Linux open community with the hope that some or all of it will be useful
    in bringing the best of journaling capabilities to the Linux operating system.


    JFS is a log-based, type-level file system, which was developed for transaction-oriented,
    high performance, high-throughput server environments, and is key to running intranet
    and other high-performance enterprise file systems. JFS is a scalable and robust
    file system and provides fast file restarts in the event of a crash system.


    More information about JFS for Linux can be found at:

    http://www-124.ibm.com/jfs/


    # EVMS


    The LTC is working on volume management technology in the form of the Enterprise
    Volume Management System (EVMS), where the result of the effort is aimed at providing
    more volume management capability and interoperability in the kernel.


    For information on EVMS, refer to:

    http://evms.sourceforge.net/


