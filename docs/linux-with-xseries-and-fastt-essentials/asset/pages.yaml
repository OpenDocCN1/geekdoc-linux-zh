    1-scsi-qla-di-t-node=0x2000a8c0f9-scsi-qla-di-t-target=0x0

    #####################################################

    root@node01 ~#|

    ```


    Figure 5-42 Example of modules.conf


    As changes have been made to modules.conf, we need to rebuild the ramdisk. First

    depmod -a to update the .dep file.


    Build the ramdisk as follows:


    ```

    mkinitrd f /boot/<newname>.img <kernel-version>

    ```


    The -f option allows to build a ramdisk to a name which already exists, ie overwrite
    it. In

    our case, we used the following command with Red Hat Server (your machine

    convention may vary from this example):


    ```

    mkinitrd -f /boot/initrd-storage-2.4.9-e12summit.img 2.4.9-e12summit

    ```


    If you used a name for the ramdisk, update /etc/boot and reboot the system.


    # B.1.4 Using FAST as storage: A summary


    As described before, you must set up your storage before building the initial
    ramdisk.

    Otherwise, the module will be loaded without a path configuration and no manual
    load

    bancing will be required.


    First, you install the required management software. Install (at least) qlremote
    from the FASIT

    MSJ package on the host. If you have configured your storage, the qlremote agent

    access it with the MSJ (either locally or from a management server). After you
    have set

    y paths, MSJ installs qlremote to write an option to the modules.conf, which is

    to configure the driver module during system boot.


    > Note: Run qlremote only during the usage of FASIT MSJ. The output string is
    to the modules.conf, stop qlremote immediately!


    You can verify your setup by loading the module with rmod qla2x00 and reload with

    modprobe qla2x00. During this load the module will use the output string carrying
    the path'
