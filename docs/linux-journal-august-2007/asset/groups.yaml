    \n# Django Views\nand Templates\n\nREUVEN M. LNER\n\nGetting started with Django\
    \ views and templates.\nwith an eye to the Django way of working.\n\nLast month,\
    \ we began looking at Django, a popular framework for creating Web Applications\
    \ in Python. Django has the reputation of being the 'Rails of the Python world',\
    \ and there is some justification for that description. Even though Django was\
    \ developed in parallel with Rails and has many features that distinguish it from\
    \ its counterpart, it is difficult to avoid comparisons.\n\nDjango is smart enough\
    \ to stop us from creating an application twice, if we try to do so:\n\n```\n\
    $ python manage.py startup blog\n```\n\nIn the introduction to Django last month,\
    \ we saw many reason of subtle, differences between the two systems. Django handles\
    \ a 'project' at a time, where each project may contain one or more applications.\
    \ This contrasts with the Rails approach, in which nothing belongs to Django projects;\
    \ everything is an application.\n\nError: [Errno 1] File exists: '/opt/mysite/blog/'\n\
    Now, let's create a 'Hello, world' view just so we can demonstrate that things\
    \ are working. We open blogviews, which starts empty except for some content indicating\
    \ that this is the file we are defined for.\n\nThe simple 'Hello, world' view\
    \ will be called by either blogviews.py or the index.html file on a Web site—providing\
    \ the default content when no method is invoked for application. We also have\
    \ to include the Python module in Django's HTTP response capabilities are defined.\
    \ When we're done, the entire view looks like this:\n\nWe also saw that Django\
    \ has a built-in Admin system. It takes a bit of filling with a configuration\
    \ to avoid avoid anything, but it provides a great range of benefits to developers.\n\
    \n```\nfrom django.http HttpRequestResponse\ndef index(request):\n    return HttpResponse('Hello,\
    \ world.')\n```\n\nDespite their differences, both Django and Rails use an approach\
    \ that is known as MVC (model, view, controller) in the Small community since\
    \ many languages and frameworks supported them. These terms were used whereas\
    \ in the Rails world, are called models, templates and views in the Django world,\
    \ and they form the bulk of a Django-app.\n\nIf we aren't server running, then\
    \ we can start with:\n\nThis month, we work with templates and views, ignoring\
    \ the database and API next until month. But don't Django's applications are quite\
