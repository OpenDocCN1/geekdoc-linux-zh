    ssix 包由三个文件组成。其中两个是模板板类型的包元数据文件（.vpn 和 .vpn.pkg）。


    处理完这些模板文件后，.vpn 文件大部分是不必要的（如列表 1 所示），.vpn.pkg 文件如列表 2 所示。两者在任何更改的情况下均可工作。注意，列表
    2 中的路径是指手机本身，不应更改。


    最后一个字段中的密码：KEY。这是空格后密钥的字符串长度。


    如果 USE_AUTH 为 true，在建立 VPN 连接时，e61 会提示你输入用户名和密码进行连接。这提供了额外的安全级别。如果密码被盗取，小偷将必须知道你的用户名和密码才能访问你的
    VPN。


    列表 2。包清单和关于应用程序类型的描述。你可以将 0x0100597E 之前的 "VPN Policy" 字符串改为其他内容。


