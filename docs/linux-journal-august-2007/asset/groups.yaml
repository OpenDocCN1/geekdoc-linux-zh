    # # Distribution


    Most Firefox extensions are distributed at Mozilla''s Add-ons site or Cross-Platform
    Install (.x). This site provides users with a central trusted source for extensions.
    Because the site is pre-trusted by the browser, it makes installation easier for
    users. Add-ons site also allows you to provide automatic updates. When you upload
    a new version, users will be automatically prompted to upgrade.


    The extension wizard created a shell script (build.sh) to automate the process
    of creating the XPI. Once it''s created, you can send it to friends, post it on
    your blog, upload it to addons.mozilla.org or distribute it any way you see fit.


    # # Conclusion


    I hope this article has given you an idea of how easy it is to write Firefox extensions
    and how powerful they can be. Don''t forget that you can use the Chrome List extension
    to explore the inner workings of both the browser and other extensions. Also,
    the Mozilla Developer Center has a wealth of how-to and reference resources waiting
    to be tapped. Happy coding!


    Justin Huff is a Software Engineer with an embedded systems background, working
    for a little Web 2 x company called Bitnik. He resides in Seattle, Washington.


