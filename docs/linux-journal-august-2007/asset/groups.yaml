  mdcn: '


    ## 当地最佳游戏特性


    我们更倾向于使用全球零售店中常见的相同 PlayStation 3 单元。这项新工作始于 1 月份，120 个节点中的前 20 个在两个多周前送达。现在，前
    20 个节点已安装在机架上。两周前，我们创建了一个仅为 680MB 的精简镜像，这只是一个功能性且灵活节点所需的要素。我们现在正在更新我们的 YH 集群构建，来自集群的人员提供了
    Torque 资源管理器和 Moab 集群。


    > 我认为我们正在经历一场有趣的范式转移，从三十年来个人电脑与专用盒的竞争，转变为行业首个提供真正个人电脑功能的游戏盒。


    - LI: 到目前为止你对集群的体验如何？

    - KS: 唯一的挑战是在集群中工作（kleboot）以及与网络引导相关的内存。在两周中的一个下午时间，在我们找到设置的魔诀之前，我们一直在搞坏东西，然后
    PS3 就能作为非集群节点运行起来了。


    - LI: 你能列出九核处理器与其他 CPU 相比，你实现的性能改进吗？

    - KS: 在我们的黑客松期间，我们对 Cell 处理器有一些有趣的发现。特别是，Mesa 显示出性能比 Intel Workstation 提升了 80
    倍。来自 IBM 的一些一直在研究 Blast，实现了 10-20 倍的性能提升。


    - LI: 你是否必须修改内核以匹配 Cell 处理器的架构和支持？

    - KS: 我们必须修改了几个内核功能来访问 Cell PS3，这些功能已包含在 Linux 内核中，因为从从添加 Cell 支持开始就可以运行。我们还包含了内核，允许我们在
    Cell PS3 上运行和调试应用程序。这个问题由 Dog Linux 的首席开发者 Owen Stafield 回答了。


    与大学和国家实验室（如劳伦斯·伯克利、阿尔阿马马斯和橡树岭实验室）合作合作。你们在这方面取得了什么进展？

    - KS: 我们校内 3000 多个核心服务器中的所有设备都免费提供给 HPC 集群（www.hpc-cluster.net）的成员。这包括用于 Cell
    开发、优化和 PS3 集群环境的 IBM Cell 刀片。


    我们为了制作其他 32 位桌面电脑和 64 位工作站所做的工作。这仍然非常有限，而且当然，没有 2.4GHz 桌面电脑那样敏捷，但你可以运行几乎所有的免费软件应用，如
    OpenOffice，或者在线运行。MyView 令人印象深刻，拥有非常大的图像库并且非常受欢迎。


    在为 Cell SP 优化代码代码时，特别是针对 PS3 或 IBM 的实现，重写算法以处理数据流和通过较小的缓存至关重要。流水线的停顿会导致性能的损失。


    这可能需要一周或两周的工作，取决于代码的复杂程度。但成功后的结果将是惊人的，利用每个 PS3 上的 AltIVE 单元和八路内存路由器实现了三十倍的提升。


    我们是否预计在不远的未来会有额外的 Cell 处理器？

    所有其 Cell 开发建议被采纳或已在所有内部系统上的联盟技术成员。Cell 是一个旨在实现公平竞争的实验，它将来自所有编程语言和硬件的开发者汇聚在同一个实例——而不是在封闭的环境中工作，员工之间作为持续开发进行协作。


    - LI: 是否还有其他应用受益于你们所的目标？

    - KS: 绝对有。在黑客松期间，我们想要优化集群，为愿望清单构建 Cell 开发工具、优化 Mesa（新多媒体引擎）、可视化库等。有更多项目将应用带到 Cell、Cell
    库和文件系统。这仅限于与 Cell 合作的个人和团队，以及受资源限制的联盟。


    - LI: 看到你们正在……共同开发并分享一系列生命科学应用，这很有趣。


    - LI: 感谢分享关于这个创新项目的信息，Kai。很高兴认识你！

    - KS: 谢谢你！


    James G 是 Linux 产品编辑，密歇根州州立大学环境科学与管理专业的研究生。他自 1983 年起一直使用 Linux，目前住在密歇根州，与妻子和孩子们在一起。


