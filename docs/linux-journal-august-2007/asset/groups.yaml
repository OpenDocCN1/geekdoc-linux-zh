    # 1994-2006\n\n# 存档\n\nLinux 日志第 1–152 期\n\nwww.LinuxJournal.com/ArchiveCD\n\n\
    1994–2006 存档 CD、过刊期刊及更多内容！\n\n若要修改应用程序的其他部分，你需要在 `chrome.manifest` 中添加更多行。\n\n\
    让我们来看看我们如何向右键菜单添加新项目。首先，在 Chrome 浏览器中打开 `chrome://browser/content/browser.url`，并搜索\
    \ `contentAreaContextMenu`。第二个匹配项应该像这样：\n\n```\n<popup id=\"contentAreaContextMenu\"\
    >\n  ...\n\n  <menuitem id=\"context-stop\">\n    label=\"&stopCd.label\";\n \
    \   accesskey=\"&stopCd.accesskey\";\n    command=\"Browser Stop\"\n  </menuitem>\n\
    \n  <separator id=\"context-sep-stop\"/>\n</popup>\n```\n\n现在，从扩展程序中打开 `firefoxOverlay`。你会看到一个这样的代码块：\n\
    \n```\n<popup id=\"contentAreaContextMenu\">\n  <menuitem id=\"context-linuxurl\"\
    >\n    label=\"&linuxjournalContext.label\";\n    accesskey=\"&linuxjournalContext.accesskey\"\
    ;\n    <inserter id=\"context-stop\"\n      oncommand=\"linuxurl.onMenuItemCommand(event)\"\
    \n    </inserter>\n  </menuitem>\n</popup>\n```\n\n当叠加层加载时，浏览器会在其 Chrome 中搜索 id\
    \ 为 `contentAreaContextMenu` 的元素，并合并来自叠加层的 XML。最终结果将类似于：\n\n```\n<popup id=\"\
    contentAreaContextMenu\">\n  <menuitem id=\"context-linuxurl\">\n    label=\"\
    &linuxjournalContext.label\";\n    accesskey=\"&linuxjournalContext.accesskey\"\
    ;\n    <inserter id=\"context-stop\"\n      oncommand=\"linuxurl.onMenuItemCommand(event)\"\
    \n    </inserter>\n  </menuitem>\n\n  <separator id=\"context-sep-stop\"/>\n</popup>\n\
    ```\n\n当这被渲染时，我们的菜单项将出现在普通的右键菜单项之间。此外，我们指定了 `inserter`，以告诉浏览器我们希望我们的新项目出现在 `context-stop`\
    \ 菜单项之后。\n\n## 本地化\n\nChrome 系统基于现有技术构建以支持本地化\n\n列表 1. picnik.xml\n\n```xml\n\
