    # # Building Firefox Extensions


    # How to create your own extension. JUSTIN HUFF


    Like many Linux readers, Firefox is my browser of choice. One of its strengths
    is the myriad of available extensions. Extensions are focused around changing
    the look of the browser; in the past few years, extensions have been used to provide
    a better experience while blurring the line between desktop and web applications.


    In this article, I explain how easy it is to extend Firefox by building an extension
    that integrates with a photo editing API by Picsnick.


    # ## Setting Up the Environment


    The first thing a new developer should do is set up a development profile. Although
    using your normal profile it is often easier to create a new profile dedicated
    to development. Try Firefox''s profile manager:


    ```

    $ firefox -ProfileManager

    ```


    Next, click the Create button. Once the window is locked, click Next to start.
    At this point, you will see a window similar to the one in Figure 1. Enter a name
    for your new profile (dev) Make sure you choose the path to where your new profile
    will be stored before clicking Finish. You''ll use that path later.


    ![](img/1234e63edf27cb1f15e6071bce50485a_75_0.png)


    Now that you have a dedicated profile, you should install some extensions that
    make development easier. I personally use several other extensions - I recommend
    you install all of them:


    # ## Your First Extension


    At this point, you''re ready to start your first extension. All extensions start
    with the same basic boilerplate code, so the same person who made the extension
    could put together the Firefox extension to automate this process for your project.
    You can find the URL in the resources below:


    Most of the required fields should make sense. One is used to identify the extension
    ID for updates and other parameters. In the past, standard practice was to


    ![](img/1234e63edf27cb1f15e6071bce50485a_75_1.png)


    use a GUID (Globally Unique Identifier). Most developers have switched to a format
    that binds registration to an email address. For this example, I used extension@linuxjournal.com.
    Figure 2 shows how to create the option (right-click menu) to fill in the fields
    of the extension.


    Once satisfied with your choices, click the Create Extension. After this, your
    browser should prompt you to download a zip file. Go ahead and extract it:


    ```

    $ unzip linuxjournal.zip

    Archive: linuxjournal.zip

    inflating: linuxjournal/install.rdf

    inflating: linuxjournal/chrome.manifest

    inflating: linuxjournal/readme.txt

    inflating: linuxjournal/content/firefoxoverlay.js

    ```'
