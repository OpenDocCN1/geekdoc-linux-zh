    安装过程非常简单，因为 LMMS 包含在许多发行版的软件仓库中。在基于 Debian 的发行版下，对于大多数系统，我只需要执行以下操作即可：


    ```bash

    # apt-get install lmms

    ```


    然而，对于那些无法为自己的系统找到二进制文件的用户，只需简单的：


    ```

    $ ./configure

    $ make

    # (以 root 权限使用 sudo)

    $ make install

    ```


    使用源码即可完成。LMMS 的依赖项并不多，因此在大多数系统上应该可以直接完成编译。


    一旦你进入了 LMMS 的世界，就会发现学习曲线也随之而来。虽然包含了一些教程和演示视频，但它们会让大多数用户在很多问题上感到困惑（但当你发现许多 GUI
    元素时，你会发现它们不算什么）。演示视频足以展示 Minor 的强大能力，当在每个设置期间实时播放按键时，这种效果令人印象深刻，还有其他酷酷且更具氛围的类型。


    首次使用 LMMS，请点击左侧名为“My samples”（我的样本）的黄色星号。从这里，你可以尝试一些已经线程化的仪器以及各种 GUI 按钮和设置，直到你做出听起来有趣的东西且界面变得更加熟悉。黄色星号上方标题为“My
    samples”的绿色音符包含了初始的仪器。它提供了多种选择（包括但不限于）令人印象深刻的拉丁打击鼓，以及一些用于氛围效果的惊奇合成器。


    尽管有这些功能和演示，但仍然值得访问 LMMS Wiki。该项目的文档虽然在持续完善中，但希望这能在此过程中对你有所帮助，特别是在作曲和音符编辑方面。撇开文档问题不谈，该程序相当稳定，可以作为初者的良好参考。如果你能搞定作曲，就会知道如何让所有轨道听起来完美。


    其他一些令人印象深刻的功能是支持 JACK 和 ALSA，但在其所有可用功能中，在乐器中使用它听起来就是正确的。当我询问 Tobias Dubois 关于这个元素时，他提到它在
    64 位系统上相当不稳定，但在修复之后，它将处于非常稳定的状态。他还想使用一个可以混合所有轨道的混音器，并改进 JACK 插槽。目前这是一款相当后期的软件，看起来很有前景；只是缺少文档——绝对适用于你的家庭音乐。关于
    LMMS 的信息，请参阅：


    下载页面：lmms.sourceforge.net/download.php


