    # NEW PRODUCTS


    ## Motorola RAZR V8


    Motorola tinkering with Linux on mobile phones as an experiment in China, which
    was supported, interestingly, by the Chinese government. Because the company was
    impressed with Linux, our beloved OS is becoming ever common on mobile devices.
    One of the latest Linux-powered options is the RAZR V8, a next-generation of this
    popular handset. The RAZR V8 features up to 500 minutes of talk time, quad-band
    connectivity, up to 2GB of memory, a two-megapixel camera, Opera Web browser,
    independent speech recognition and music based on Windows Media Player 11. Motorola
    is the latest, diverging only that it has pierced audio codecs, DRM and transfer
    protocols from Microsoft and integrated them into its Linux-Java platform. Still,
    it calms the Linux-questing soul to know that one can intentionally go out and
    get a butt-kicking Linux-based phone! www.hellomoto.com


    ![](img/1234e63edf27cb1f15e6071bce50485a_37_0.png)


    ## Drew Technologies'' DashDAQ


    As the Detroit automakers obsessively perfect the cupholder, Drew Technologies
    seeks to sneak a Linux-based device, the DashDAQ, on board your new ride. The
    DashTech, is "a cross between an automotive gauge, dashboard, navigation system
    and data acquisition system, diagnostic tool and a handheld computer." The device
    was designed for use in an automotive display, includes OBD protocols and runs
    on Linux software that is included with DashDAQ allows users to create their own
    themes and automotive gauges. Features include dual-ARM architecture, 4" (QWVGA)
    24-bit TFT color display, a touchscreen and 64MB of RAM. The product is available
    through various distributors, and directly from DrewTech. www.dashdaq.com


    ![](img/1234e63edf27cb1f15e6071bce50485a_37_1.png)


    ## Axigen Mail Server


    Axigen continues to add the feature set of its Mail Server messaging solution,
    with version 4.0 now shipping. The new feature in version 4.0 is a Persona module
    offering features such as calendar, tasks, notes and collaborative support. The
    feature is available via Axigen''s Web interface and Outlook Clients. In addition,
    the product now contains the Outlook connector, which implements most Exchange-like
    features, such as server-side folders. Axigen Mail Server comes in three additions:
    ISP/HSP, Business and a Business office. www.axigen.com


    ![](img/1234e63edf27cb1f15e6071bce50485a_37_2.png)


    ## Kyle Wheeler''s Qmail Quickstarter (Pakt Publishing)


    If Qmail''s home page is too unwise for you, pick up Kyle Wheeler''s Qmail Quickstarter,
    a new book for folks familiar with Linux/Unix and DNS servers who desire to set
    up a mail server. Starting with the basics, Qmail moves on getting e-mails in
    and out of the queue, with storing, retrieving and authenticating them. The book
    also covers visualisation of data and user management, filtering spam, SSL encryption
    and mailing lists. Pact says that the book''s style focuses on practical examples
    that system administrators can use right away, but it also explains the rationale
    behind every example. www.pktpub.com


    ![](img/1234e63edf27cb1f15e6071bce50485a_38_0.png)


    ## FORBIDDEN LEGO

    Ulrik Pilegaard and Mike Dooley''s Forbidden LEGO (No Starch Press)


    ![](img/1234e63edf27cb1f15e6071bce50485a_38_1.png)


    Book publishers seem to release their books in waves, and presently find ourselves
    in the midst of a geek-book tsunami. The ever-eclectic No Starch Press continues
    to pick its LEGO sorts with full titles, the Forbidden LEGO by Ulrik Pilegaard
    and Mike Dooley, subtly childish as "Build the Models Your Parents Warned You
    Against." rebellion obsessed with "free-style building" and shows how to make
    many models, as a toy gun shows LEGO fights, a candy post, a high-voltage LEGO
    vehicle, a continuous-fire ping-ball launcher and all useless but incredibly fun
    inventions." A to the word: stick on LEGOS in advance! www.nostarch.com


    ## Data Structures and Algorithms for Game Developers by Allen Sherlock (Charles
    River Media)


    Grand Theft Auto''s Pong, which is what you need this book—Data Structures and
    Algorithms for Game Developers by Allen Sherlock—for what you need today. Published
    by Charles River Media, this title covers teaching game developers the fundamentals
    of data structures and algorithms using C++ and its alternative options, The book
    also covers many topics today''s games and game programmers must know to be successful,
    including geometry techniques, KD-Trees, binary space partitioning trees, sphere
    trees and so on. Furthermore, the code that is included is not platform- or OS-dependent,
    which is as Linux us like! www.charlesriver.com


    | DATA STRUCTURES AND ALGORITHMS FOR GAME DEVELOPERS |

    | :--- |

    | Allen Sherlock |

    | Charles River Media |

    | ISBN 978-... |


    ## ActiveState''s Tcl Dev Kit


    The latest news from ActiveState is the release of Tcl Dev Kit (TDK) 4.0, a multipoint
    toolkit for creating deploying applications. In addition providing essential tools
    for building self-installed, file executable TDK includes a graphical debugger,
    profiling and analysis tools for code optimization, a precompiler and services
    manager. New features in TDK 4.0 include checks for finding errors in Tcl scripts,
    enhanced package management, compiler support for Tcl 8.5, GUI facets and support
    for Mac and Solaris. Other supported platforms include Linux, Windows, AIX and
    HP-UX. www.activestate.com


    ![](img/1234e63edf27cb1f15e6071bce50485a_38_2.png)


