    \ expect the system to do the right thing by default; you should have to say something\n\
    \nIf this executes successfully, Django won't print any messages. Rather, then\
    \ we get a list of the current current directory, which should now include a blog:\n\
    \n```\n$ is blog\n$ __init__.models.py views py\n```\n\n20 | August 2007 www.linuxjournal.com"
- md: "\nonly when it deviates from that. In Django, it assumes that you want to make\
    \ everything explicit.\n\nAmong the things that you need to make explicit is the\
    \ way in which URLs are translated into methods. The Django system for doing this\
    \ is URLConf, and it is a set of regular expressions for the entire project. (It\
    \ functions like routes in Rails.) If you are familiar with regular expressions,\
    \ it should be pretty easy to add or modify URLs.\n\nFor example, let's say we\
    \ want /blog/ to point to our blog application. We would use the URLConf, while\
    \ the view might be in myurls.py. (We already added administrative capabilities\
    \ to Django site.) We then add a line that looks like this\n\n```python\nr'^blog/$',\
    \ mysite.blog.views.index'\n```\n\nIn other systems, if we see a URL with blog\
    \ and ends with /, it should invoke the method views within our application. For\
    \ example, as soon as we use Django to link, we can reload our browser, and see\
    \ \"Hello, World! Our Django application is starting to come together.\n\n## More\
    \ Complex URLs\n\nThings are not that difficult if we have a single method and\
    \ it always does the same thing. For a blog application, we'd probably be wanting\
    \ to handle a particular posting, or on a particular day. And then we need to\
    \ get into the model for our blog application and realize what this means we need\
    \ to be able to query blog by an individual ID or by date.\n\nOur current design\
    \ does not handle such situations. Django requires that we explicitly define each\
    \ URL that a user might request and how that URL should be handled. Although we\
    \ have taken care of blog/, we need to handle URLs such as:\n\n```python\nr'^blog/(?P<id>\\\
    d+)/$', mysite.blog.views.one_posting'\n```\n\nHere we see a bit different thing,\
    \ namely the use of capturing parameters, with ?P and names inside angle brackets.\
    \ We tell the URLConf that we receive a URL that looks like /blog/NUMBER, with\
    \ digits which will invoke one_posting. Because we have captured the digits (<id>,\
    \ in regular) with the name post_id, one_posting is invoked with an additional\
    \ parameter of post_id.\n\nIn other words, once we've modified urls.py to include\
    \ the above map, we can go back to views.py and say the following:\n\n```python\n\
    def view_one_posting(request, post_id):\n    return HttpResponse(\"You asked for\
    \ '%s'\" % post_id)\n```\n\nThen, we can get to http://127.0.0.1:8000/blog/5,\
    \ and in our browser, we get the following:\n\nYou asked for post '5'\n\nNotice\
    \ in the view, one_posting method we use to render post_id, rather than %s (the\
    \ integers). Django passes parameters from URL as strings, rather than other data\
    \ types. We could, of course, get around by converting the string to an integer,\
    \ but for our purposes this is enough.\n\nPerhaps we hit this application, but\
    \ each in our method just happens to be to the user's view. We can use any of\
    \ Python libraries that we want, and access databases, files and remote controllers.\
    \ As long as the output is a legitimate HTTP response, the application that we\
    \ are building in these examples will represent the type of being completed.\n\
    \nIf we want to create a Web site using nothing more than the tools we've already\
    \ seen, however, it would become difficult and tedious to do, so parsing all of\
    \ our output strings to HTTP response. The real solution is to use HTML files,\
    \ allowing for variables as necessary.\n\nThere are a lot of different templates\
    \ out there, and the most common is to use ASE, PHP, JSP or OR—the last of which\
    \ is partly of ruby on Rails. This type of template can be easily used by programmers\
    \ to work with, but it can cause trouble when non-programming designers are involved,\
    \ or if you want to have a separation between code and design.\n\nSuch templates\
    \ can be used by Django, but they are not the default. Django uses templates that\
    \ are similar in ways to the Simple system for PHP, which avoids the use of actual\
    \ code in the template by introducing a limited language. So we can pass values\
    \ to a template, there's no real need for a full-blown programming language inside\
    \ a template. It's probably enough to have them with some basics.\n\n## Despite\
    \ their differences, both Django and Rails use an approach that is best known\
    \ as MVC (model, view, controller) developed in the Smalltalk framework by many\
    \ other languages and frameworks then.\n\nwww.linuxjournal.com august 2017 | 2\n\
    \n## COLUMNS\n### THE FORGE\n\nYou can use any number of Python libraries that\
    \ you want, and even access databases, filesystems and remote computers.\n\nThis\
    \ is what Django's default template system provides. In order to use templates,\
    \ we modify the settings.py file that sits in the project's main directory. We\
    \ want to set the TEMPLATE_DIRS variable, giving it a list of one or more directories\
    \ in which our templates might be found. For example, we could set it to:\n\n\
    ```python\nTEMPLATE_DIRS = [\n    \"/opt/at/mysite/templates\"\n]\n```\n\nWith\
    \ this, we can now create appropriate directories:\n\n```bash\nmkdir /opt/at/mysite/blog\n\
    ```\n\nAnd then, in it directory, we create a new HTML file, which we call view_one_posting.html:\n\
    \n```html\n<html>\n<head>\n    <title>One post</title>\n</head>\n<body>\n    <p>This\
    \ is the \"view_one_posting\" template.</p>\n</body>\n</html>\n```\n\nThe answer\
    \ is quite simple. In the view method, we can pass any variable to the template.\n\
    \n```python\ndef view_one_posting(request, post_id):\n    context = {'post_id':\
    \ post_id}\n    return render_to_response(request, 'view_one_posting.html', context)\n\
    ```\n\nNotice in the view, one_posting method we use to render post_id, rather\
    \ than %s (the integers). Django passes parameters from URL as strings, rather\
    \ than other data types. We could, of course, get around by converting the string\
    \ to an integer, but for our purposes this is enough.\n\nPerhaps we hit this application,\
    \ but each in our method just happens to be to the user's view. We can use any\
    \ of Python libraries that we want, and access databases, files and remote controllers.\
    \ As long as the output is a legitimate HTTP response, the application that we\
    \ are building in these examples will represent the type of being completed.\n"
  mdcn: "\n只有在偏离这一点时才会如此。在 Django 中，它假设你希望一切都是显式的。\n\n在需要显式化的内容中，包含了 URL 如何翻译为方法。Django\
    \ 用于实现此点的系统是 URLConf，它是整个项目的一组正则表达式集合。（它的功能类似于 Rails 中的路由 routes。）如果你熟悉正则表达式，那么添加或修改\
    \ URL 应该非常简单。\n\n例如，假设我们想让 `/blog/` 指向我们的博客应用程序。我们将使用 URLConf，而视图（view）可能位于 `urls.py`\
    \ 中。（我们已经为 Django 站点添加了管理功能。）然后我们添加类似这样的一行：\n\n```python\nr'^blog/$', mysite.blog.views.index'\n\
    ```\n\n在其他系统中，如果看到看到一个包含 `blog` 且以 `/` 结尾的 URL，它应该调用我们应用中的视图方法。例如，只要我们使用 Django\
    \ 进行链接，我们就可以刷新浏览器，并看到“Hello, World! 我们的 Django 应用程序开始成型了。”\n\n## 更复杂的 URL\n\n\
    如果我们只有一个方法且它总是执行相同的操作，那么事情并没那么。对于一个博客应用程序，我们可能想要处理某个特定的帖子，或者在某个特定的日期。然后我们需要进入博客应用程序的模型，并意识到这意味着我们需要能够通过单个\
    \ ID 或日期来查询博客。\n\n我们目前的设计没有处理此类情况。Django 要求我们显式定义用户可能请求的每个 URL 以及该 URL 如何被处理。虽然我们处理了\
    \ `blog/`，但我们需要处理如下 URL：\n\n```python\nr'^blog/(?P<id>\\d+)/$', mysite.blog.views.one_posting'\n\
    ```\n\n在这里我们看到了一些不同的东西，即使用捕获参数，带有 `?P` 和角括号内的名称。我们告诉 URLConf 我们收到了一个看起来像 `/blog/NUMBER`\
    \ 的 URL，其中的数字将调用 `one_posting`。由于我们已经捕获了这些数字（正则表达式中的 `<id>`）并将其命名为 `post_id`，因此调用\
    \ `one_posting` 时会带有一个额外的参数 `post_id`。\n\n换句话说，一旦我们修改了 `urls.py` 以包含上述映射，我们就可以回到\
    \ `views.py` 并编写如下内容：\n\n```python\ndef view_one_posting(request, post_id):\n\
    \    return HttpResponse(\"You asked for '%s'\" % post_id)\n```\n\n然后，我们可以访问 `http://127.0.0.1:8000/blog/5`，在浏览器中，我们得到：\n\
    \nYou asked for post '5'\n\n注意，在视图 `one_posting` 方法中，我们使用 `post_id` 来渲染，而不是 `%s`（整数）。Django\
    \ 将参数从 URL 以字符串形式传递的，而不是其他数据类型。当然，我们可以通过将字符串转换为整数来解决这个问题，但对于我们的目的来说，这足够了。\n\n\
    也许我们访问了这个应用程序，但我们方法中的每个项恰好都是面向用户的视图。我们可以使用任何需要的 Python 库，并访问数据库、文件和远程控制器。只要输出是合法的\
    \ HTTP 响应，我们在这些示例中构建的应用程序将代表已完成的类型。\n\n然而，如果我们想仅用已经看到的工具来创建一个网站，那么这样做将变得困难且枯燥，因为需要将我们所有的输出字符串解析为\
    \ HTTP 响应。真正的解决方案是使用 HTML 文件，并在需要时允许变量。\n\n那里有很多不同的模板，最常用的是使用 ASE、PHP、JSP 或 OR——后者部分属于\
    \ ruby on Rails。这种模板可以被程序员轻松使用，但当非编程设计人员参与时，或者你想在代码和设计之间实现分离时，可能会产生麻烦。\n\nDjango\
    \ 可以使用模板，但它们不是默认的。Django 使用的模板在某些方面类似于 PHP 系统，通过引入限制性的语言避免了在模板中使用实际代码。这样我们可以向模板传递值，对于某些基础来说这足够了。\n\
    \n尽管存在这些差异，Django 和 Rails 都使用被称为 MVC（模型、视图、控制器）的方法，这种方法由 Smalltalk 框架并在许多其他语言和框架中开发。\n\
    \nlinuxjournal.com 2017 | 2\n\n## 列\n### \n\n你可以使用任何需要的 Python 库，并访问数据库、文件系统和远程计算机。\n\
    \n这就是 Django 默认模板系统提供的。为了使用模板，我们需要修改项目主目录下的 `settings.py` 文件。我们需要设置 `TEMPLATE_DIRS`\
    \ 变量，为其提供一个包含可能存放模板的目录列表。例如，我们可以设置为：\n\n```python\nTEMPLATE_DIRS = [\n    \"/opt/at/mysite/templates\"\
    \n]\n```\n\n通过此，我们现在可以创建相应的目录：\n\n```bash\nmkdir /opt/at/mysite/blog\n```\n\n\
    然后，在该目录中创建一个新的 HTML 文件，将其命名为 `view_one_posting.html`：\n\n```html\n<html>\n<head>\n\
    \    <title>One post</title>\n</head>\n<body>\n    <p>This is the \"view_one_posting\"\
    \ template.</p>\n</body>\n</html>\n```\n\n答案非常简单。在视图方法中，我们可以向模板传递任何变量：\n\n```python\n\
    def view_one_posting(request, post_id):\n    context = {'post_id': post_id}\n\
    \    return render_to_response(request, 'view_one_posting.html', context)\n```\n"
