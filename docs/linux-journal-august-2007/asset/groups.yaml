  mdcn: '

    AlphaMail 运行在一个独立的系统上，该系统仅提供 Web 邮件服务，不对用户提供 shell 访问权限。


    配置允许用户配置大文件共享系统。这允许用户将文件上传到 AlphaMail 系统，以便其他人可以下载。大文件共享比作为电子邮件附件或在邮件中推荐的文件要好得多。文件共享具有许多优点，包括大小限制、密码保护、加密、下载限制和基于时间的过期设置。将文件共享的大小限制设为零将禁用该功能。


    最后一步是编辑 Apache 配置。当加载带有指令的 mod_perl 和 libapache2 时，这些：


    ```

    LoadModule apache_module modules/mod_perl2.so

    ```


    以及，包含生成的 Apache 配置文件。


    ```

    Include /local/etc/alphamail/alphamail.conf

    ```


    # 运行 AlphaMail


    AlphaMail 的运行需要 Alpha 和 apache 。启动不需要示例重置。缓存的初始化脚本将包含并安装在 /usr/local/alphamail/alphamail.init。


    必须通过 cron 定期运行清理脚本。AlphaMail 使用邮件系统的分钟（即解码后的 MIME 消息和附件）。Web 服务器不会重新处理这些文件，因为无法保证用户的行为。该脚本名为
    garbage_sweeper，由管理员安装。


    AlphaMail 已在俄勒冈大学使用。其性能和易用性结果非常鼓舞，后者可以在 AlphaMail 主页上找到。


    然而，系统仍然缓慢，且在搜索时存在一些延迟。邮件界面是一个相当复杂的软件，有许多可选问题。我建议使用一个名为 hang_handler 的包含文件（位于 /usr/local/alphamail/default.by）。在使用该脚本之前你必须编辑它，并且它需要一个有效的
    LDAP 命令支持。它能够重启 Web 服务器缓存（通过包含的初始化脚本）。它还可以向管理员发送邮件。


    # 常见问题


    在新的安装时，你可能会在多个地方遇到问题。AlphaMail 随附的《管理员指南》提供了许多解决这些问题的方法。


    最令人困惑的问题之一是通过错误的域名访问服务。包含会话的 cookie 固定在你在配置期间指定的服务器上，并存储在 AlphaMail apache 配置中的参数中：


    ```

    PerSet alphamaildomain server.example.com

    ```


    如果用户使用未限定的主机（例如 server）访问登录页面，cookie 将无法正常交换并在无任何错误的情况下失败。登录成功了，但由于 URL 不匹配，接收端没有回传。


    此外，用户通过加密类型或不安全的 HTTP URL 连接。前者从不是问题，而重定向对后者可以处理得很好。


    ```

    <VirtualHost_default_80>

    Redirect /alphamail/?$server.example.com/

    Alphamail/index.html

    Redirect /alphamail/?$server.example.com/

    Alphamail/index.html

    </VirtualHost>

    ```


    其他问题通常涉及依赖、配置错误或缺少辅助细节。这些问题的最佳指示位于 varlog 中的 alphamail_ui.log。


    SELinux 也可能是问题的来源。如果你配合 SELinux 使用 AlphaMail 并正在编写自己的安全配置文件，你可能需要关闭或禁用它。


    # AlphaMail 的未来


    AlphaMail 非常关注性能和核心功能，我不认为这两个问题在未来会变得不重要，因为产品是在拥有大型且多样化用户群的环境开发的。


    它功能丰富，但并非无所不。限制功能是一项要求，因为核心关注点是方便地访问基本功能，而不是对邮件功能进行全局覆盖。


    尽管如此，仍有改进和调整的空间，作为一个国际化界面，一些 Ajax 组件可能会改善客户端交互和视图。


    # 资源


    - AlphaMail 安装指南：sourceforge.net/docman/doc_php.php?id=3804&group=alphamail

    - AlphaMail 主页：sourceforge.net/projects/alphamail

    - C++ 库：boost.org

    - IMP 基准测试：whizzo.uoregon.edu/public/src/mailperl/results.html

    - US CERT：www.us-cert.gov


    www.linuxjournal.com | 2007年8月 | 95


    # /var/opinion


    # 仁慈的勒索者


    我们对微软没有为了救我们而产生的问题提供了一个公正且平衡的描述。


    除非有人不想起诉，否则没人会因为我们使用 Linux 而起诉我们；我们对为了支付保护费来解决这个问题感到愤怒，但我们要付钱给谁呢？我们已经付过 Red Hat
    的钱，但 Red Hat 并没有威胁起诉我们，那么意义何在？这就是 Linux 的问题所在。它没有受到任何拥有授权权力的人的监督，而那些通过威胁起诉来向付费客户提供知识产权的人也不是。


    任何人如何能质疑微软对开源模型的承诺呢？


    这不是微软第一次想要帮助我们进行知识产权保护。几年前，微软对我们的 Windows 和 Office 许可进行了审计，这让我们注意到了差异。我们认为，微软产品通过卖给我们所需的替换品来解决我们的问题是一种恩惠。对某些人来说，为同一件东西付两次钱是不合理的，或者认为付钱不是为了获得免费，而是为了安心，而这正是知识产权保护的意义。


    Linux 支持者和开发者应该感谢微软达到了这一步。

    '
