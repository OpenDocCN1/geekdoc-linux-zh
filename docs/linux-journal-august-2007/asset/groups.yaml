    # letters


    ![](img/1234e63edf27cb1f15e6071bce50485a_9_0.png)


    One can only hope that Jon "maddog" Hall learned his programming languages better
    than he learned his Latin. In the June 2007, he says that his name Agape is the
    Latin word meaning "the form of love." However agape is not Latin, as Hall suggests,
    being one of Classical Greek for different types of love, it is generally understood
    to mean "brotherly love" or charity. Maybe maddog needs to debug his Latin.


    I often spend telling people of the merits of Linux and that we are winning—much
    like Doc Sears'' "Picking News Fighters" in the June 2007 issue. We never fail
    to turn into the answer: About hardware or software that doesn''t work on Linux?
    With Windows, it just


    I have to explain that, it''s not, "just work." The manufacturers simply write
    drivers under, and if they would get us to write for Linux, "just work" there
    as well. One of the answers to the question that one should be testing for compatibility.
    They would, in fact, free Linux programmers to write other useful stuff.


    # Max E. Klinger


    The origin of the word agape, but Latin assimilated. As Jon''s teacher taught
