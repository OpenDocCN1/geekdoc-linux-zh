    # 直言不讳的人

    自 1999 年起


    # ABERDEEN（阿伯迪丁）


    # BLADE KILLER

    1U 空间内 2 台服务器


    ![](img/1234e63edf27cb1f15e6071bce50485a_34_0.png)


    虚拟服务器的理想选择


    + 特性与优势：

    - **比刀片机更高的密度（是的，真的）** —— 单 1U 空间内内置两台双四核服务器。42u 机柜中可容纳 84 个节点 / 672 个处理器核心。

    - **低功耗** —— 卓越的电源利用率。提高能源效率。

    - **冗余** —— 高冗余集群。采用独立服务器，而非刀片解决方案中常见的单点故障。

    - **标准化** —— 行业标准架构。不使用专有的刀片背背板/架构。

    - **冷却** —— 独立冷却的 1U 机箱，对比大型机箱。

    - **完全定制** —— 每个节点的定制程度远高于刀片机。

    - **热插拔** —— 在不中断网络流或数据访问的情况下，更换整台双路服务器。

    - **低成本** —— 显著低于类似的刀片解决方案。


    | 包含 14 个刀片的 IBM BLADECENTER 9U 刀片解决方案 | 包含 14 个节点的 ABERDEEN STIRLING 122 7U 服务器解决方案
    |

    | --- | --- |

    |  | 9U BladeCenter H，包含 14 台 IBM BladeCenter，配备 8 GB RAM 和 106GB FSB | 7U Aberdeen
    Stirling 122，每台配备两台双路服务器 |

    | 每个刀片/节点的处理器 | 两个四核 6000 rpm 处理器 E5310 1.60 GHz | 双四核 Intel Xeon E5310 1.60 GHz
    |

    | 每个刀片/节点的内存 | 2 GB  ECC DDR2 667 MHz 内存（最大 3 GB / 4 条 DIMM） | 8 GB ECC DDR2 667
    MHz 内存（最大 32 GB / 8 条 DIMM） |

    | 每个刀片/节点的硬盘 | 两个 6 TB 10000 rpm 2.5 SAS 硬盘（最大 4 x 9 TB 硬盘（带可选 SSD）） | 两个 3.7
    GB 10000 rpm 热插拔 SATA 硬盘（最大 5 x 1.5 TB） |

    | 每个 42u 机柜的最高处理器数量 | 56 个刀片 / 112 个处理器（4 台 9U 机箱中包含 448 个核心） | 84 个节点 / 168 个处理器（4
    台 1U 机箱单元中包含 672 个核心） |

    | 保修 | 部件和做工提供 1 年现场有限保修 | 部件和做工提供 5 年有限保修 |

    | 14 台刀片解决方案总价 | $5,012 | $2,607 |

    | 每个刀片/节点价格 | | |


    Intel、Intel Inside、Intel Logo、Pentium、Core 和 Xeon 均为 Intel 公司或其在美国及其他国家的注册商标。其他商标归其所有所有。2007
    年 1 月 30 日后订单的产品价格和规格。更多详情请参阅 www.aberdeen.com/appory/terms._018


    # 专栏

    适用于各种的 LINUX


    “交互设计”的实现。计算已在字面和比喻上都达成了一致性。


    这并非适用于个人和群体独立且匿名开发的兴起，而是适用于所有愿意并能够发表意见的参与，包括用户，McCarthy 将用户置于事情的起点而非终点；


    > 从“用户”的角度来思考并为他们创建“知识点音机”变得越来越没有意义。渴望“创造者”并获得更多学术上等同于“积木玩具（Tinker Toys）”的东西变得更有意义。但是，我们必须警惕不要用一只手拿走我们给予我们的东西。用克利福德几何（Clifford
    Geometric）的术语来说，我们需要跨越泰勒主义（Taylorian）概念的“知识杂草”，让我们保持平衡；知识“发现”的概念、学术上的“学习成果”以及所有其他永恒的陈词在如今都已淹没。我们这个时代的整个计算领域——我的论点是——与这种观念隐含的、过时的
    19 世纪宇宙观直接背道而驰。


    McCarthy 的个人内容是学术，特别是研究生和项目，这些专业领域被限制在良好且受保护的空间内。关于这一点，他说道：


    “特别是自从 Web 出现以来，我们的注意和能量投入了数字化的指数级增长。对于学者来说，这里的好处是可搜索和可质疑的材料变得可用，我们不再有更多证据证明这种或那种业务是常态。我们有更大的知识多样性需要考虑，因此有更丰富的方式来重构现实和工作，同时也相互协作，并需要更好的推理。在这里是为了推导。这并不是一个打破学科的问题——我们是重构或拆解的主人。相反，拆解需要这些支持。要点在于学科的配置。计算的进展最终，让领土的封建式隐喻和正式学习园林中的中世纪知识树变得毫无意义。我们需要其他的视角。这就是原因。”


    # 资源


    - 虚拟洛杉矶：digitalations.ucla.edu/2007/ccc/projectpson.htm

    - 数字创新日展会：www.ucla.edu/spotlight/07/digital-innovation.html

    - 罗马论坛：www.digitalinnovations.ucla.edu/2007/projects/roman.htm

    - 800 年：www.digitalinnovations.ucla.edu/2007/projects/800years.htm

    - www.digitalinnovations.ucla.edu/2007/projects/800years

    - www.digitalinnovations.ucla.edu/2007/projects/santiago

    - www.digitalinnovations.ucla.edu/2007/projects/humanities

    - www.digitalinnovations.ucla.edu/2007/projects/humanities


