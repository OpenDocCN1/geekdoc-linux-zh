    where packets are moving around before the firewall drop them. The script shown
    in Listing 12 was done using Linux to disable remote access again.


    You might want to consider using a Single Packet Authorization (SPA) client on
    the e61 and setting up the server to connect via the firewall GARP/SPA. Michael
    Ryan''s “Single Packet Authorization” article is in the April 2007 issue of Linux
