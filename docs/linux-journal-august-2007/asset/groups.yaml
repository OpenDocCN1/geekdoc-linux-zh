  mdcn: "\n\n# 利用 64 位 Linux\n\n曼德尔布罗集合如何阐明使用 64 位 Linux 的优势。作者 Steve MUNROE\n\n64\
    \ 位系统的广泛可用为简化编程提供了可能。通过利用大容量的虚拟地址和内存映射文件，我们将编程和持久化结合为了单一活动。这在没有共享数据结构的情况下简化了编程。它还提高了访问和共享的效率，因为多个程序可以通过单个物理页直接（在位）共享数据。这消除了通过多层缓冲区拷贝数据的需要。当所有程序共享相同的内核内存映射时，很容易在应用程序之间进行别名（alias）处理和内存管理单元（MMU）资源，并且对\
    \ IO 子系统的顶层有极大改进。为了在编程工作上获得微小的声誉，我们牺牲了运行效率。\n\n另一种，单级存储器（Single-Level Stores）多年来一直是一个研究课题，尽管该技术是有效的（简化了编程和数据管理），但仅适用于资源有限的特殊硬件或操作系统环境。\n\
    \n随着 64 位微处理器的普及和标准 POSIX 内存管理 API 的出现，这种情况再次发生了变化。一个小型运行时库的加入允许富有冒险精神的程序员使用隐式访问语义。这种高度“单级存储器”的方法用于增量式探索和采用新的编程范式。\n\
    \n作为证明，我编写了一个小型库，我称之为 SPIDE（共享持久化堆/环境）。它将应用程序地址空间的一部分映射到持久化块上。该库为存储和分配提供了一些原语和“实用程序对象”。\n\
    \n作为一个演示，我写了一个曼德尔布罗（GUI）程序。该程序计算曼德尔布罗集合中的某些点，并以共享线程的形式显示图像。这种表示可以由程序的多个实例共享和显示。程序实例协作填充下一层级的细节。\n\
    \n# 资源与设计\n\n系统编程和设计编程（隐式地）受管理资源需求的驱动。在编程早期，地址空间和物理内存是稀缺的。IO 子系统必须处理内存空间的管理，例如磁带和页卡。随机访问和虚拟内存的引入并没有改变改变。今天的资源如此丰富，以至于我们有了选择自由。将持久化与数据分离是一个主要问题。它在编程和运行时执行中导致了低效。\n\
    \n# 机会\n\n随着 64 位处理器的出现，原始的（地址/内存）稀缺性消失了。我们可以利用虚拟内存直接“在位”通过“隐式”语义共享海量数据结构。这简化了编程，因为数据结构被所有进程共享。它提高了运行效率，因为它允许更少的内存管理层级，并且操作系统有更多机会共享特殊文件。通过解决别名问题和探索硬件特性（如大页），提高性能效率的机会数不胜完。\n\
    \n# 高级设计\n\n内存映射文件是不够的。我们需要一个用于地址空间和备份文件的设计来管理内存。设计应该在虚拟内存（地址空间）和物理内存（数据）之间平衡简单性与效率。\n\
