    # Cool Change


    Here are some ideas for cool projects; send us some of yours.


    Nick Petley, our fearless Editor in Chief, had joined me at my favorite restaurant
    and watering hole, Aldea dos Piratas for an evening. As the music played and the
    young folks danced the night away, Nick and I talked about the Linux community
    and concentrating on all the interesting things that have happened lately.


    Nick had declared this month as Cool Projects for the magazine. Traditionally,
    the focus had been Home Projects, but the Home Projects were too limited. Robotics
    and wearable computers are, for example, cool, but not necessarily home.


    Even before this month would be Cool Projects, I had started thinking about what
    makes a software "cool".


    My "cool" thought processes started with an article by Kathy Sierra called "Professional
    vs Passion" at site headsquare.type.com/creating_passionate_users/2006/11_two_simple_worlds


    Although this particular article focuses on how sometimes people discard the raw
    passion they feel when changes come when they trade in salaries and T-shirts for
    the suits and ties of the Professional, the article also touched on the concept
    of what is cool. One example was given: "kid-at-shower-seeing-an-ice-cream-afterburners-by-so-cold-it-makes-your"


    Some of you have been a "kid" at the airshow and had that feeling of the plane
    made the ground shake. Now, with some thought about computer conferences and tradeshow
    and why people do or not go to them. Certainly, some people go to conferences
    and tradeshow to find existing solutions to problems. Other people because they
    are curious about what is going to be a solution in the one or two years. Others
    go to find out new things (cool stuff)—things that may never turn into a product
    or service or things that may be suitable for such a small group of people that
    no one sees a commercial opportunity for themselves, they are cool.


    Likely of the conferences I attended seemed to be concentrating on the existing
    solutions, and for the forward direction and cool stuff.


    Of course, cool is in the eye of the beholder, and it seems to change over time.
    New days of programming, new solutions and having the program half the time to
    get the same F-16, but it is cool.


    So, I want out of your group and ask, "what is cool?" general responses before
    the list moved away from the original question to a discussion of something something
    went cool. Some of the ideas are:


    - NCID: a system for displaying, and presenting speaker call-ID.

    - MySynth, Pluto and Linux for various systems: recording, storing and playing
    back videos, music, pictures and home automation.

    - Automation of testing procedures to production testing time by a factor of four
    and cut down human error.


    Each of these projects might be considered by your people. Although attempting
    a procedure might not sound like F-16 flying at 200 feet above you, it might be
    a project that would get some people excited and try to implement that solution
    right away. Other people may not have any interest at all in these projects.


    Just as I was about to turn away from the responses to query, someone mentioned
    the site of C Data Solutions, Ltd. (www.cdatas.com/index.1.html), where a computer
    was being built out of Compact Modules. Now I admit to being wary, particularly
    when it comes to very small systems, but when I saw, an F-16 flew right over my
    head.


    A few months ago, I mentioned the Gumix folks (www.gumix.com) in an article. Both
    Gumix and the C Data Solutions share some of the same characteristics—they’re
    really thin and low power, yet programmable through our operating system. I mean,
    and I got excited over what they could do.


    At that time, I was a very nice novice where high-school and college students
    trying to get their teachers to manage a maze and do some tasks. The students
    were all in teams of three or four, who had their own colors, flags and work areas.
    The teams were changing their programs and even doing changes to their robots
    right at the event. This event was not about selling some product or solving something
    problem. I was watching students work together in teams and solve problems as
    teams. It was an exciting time, and it was cool, both the students and the spectators.


    Realizing that you, my readers, and I may never agree on what is cool or why we
    think it is cool, I will, make a request. Write to me at cool@linuxjournal.com,
    and tell me about any existing FOSS projects that you think are really cool. If
    you have some ideas for a cool conference or activity, send them. I will roll
    them up and post on the Linux Journal Web.


    But, as you formulate your idea, please make sure not to miss your head. ■


    “Mandi Hall” is the Executive Director of Linux International (www.linuxinternational.org,
    a nonprofit association of end users who wish to support and promote the Linux
    operating system. Mr Hall has had a career in commercial software, which started
    in 1989, as a product manager and educator. He has worked for companies such as
    Western Electric Corporation, Adobe Labs and SGI. He is now an independent consultant
    in Free and Open Source Software (FOSS) Business and Technical issues.


