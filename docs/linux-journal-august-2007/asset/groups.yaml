- md: '

    Installation in a breeze, as LMMS lends in many distributions'' repositories.
    Under Debian-based distributions, all I had to do was for most systems.


    ```bash

    # apt-get install lmms

    ```


    For those who can''t find a binary for their system however, as a simple:


    ```

    $ ./configure

    $ make

    # (as root sudo)

    $ make install

    ```


    with the source is all that you require. LMMS doesn''t have too many dependencies,
    so it should compile right off the bat on most.


    Once you dive into the world of LMMS, a learning curve presents itself. Some tutorials
    and demos are included, but they will leave most users in wonder on many issues
    (but they are nothing as you discover the many GUI items). The demos are worth
    to show off the capabilities of a Minor, which is impressive when the keys played
    in real time during each setting, and other cool more atmospheric type.


    How to use LMMS for the first time is to click the yellow star on the left that
    is titled My samples. From here, you can play with some already-threaded instruments
