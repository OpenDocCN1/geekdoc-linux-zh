    ## 瘦终端 (Thin Clients)


    当你向一群不熟悉这一概念的人介绍 Linux 时，就像给一个五岁的孩子送沙发一样。普通用户往往会忽视 Linux 能为他们做的事情，而关注那些粗糙的边缘。正如
    Linux 所言，“人们”经常感到困惑，是因为它没有脚，而软件却生成了量子计算中简单的部分。


    2003 年，密歇根州的教育经费开始呈现下降趋势，在那个时候，旧硬盘无法用于瘦终端，因此我们必须购买新硬盘。


    - 服务器配备 512MB 内存，每个客户端配备 100MB。

    - 对于服务器来说，50 个客户端已经了很多。如果超过 50 个，请考虑使用多台服务器。


    然而，我的报价还包含了以下新增内容：


    - 两台服务器以支持额外的瘦终端和/或负载均衡。

    - 交换网络上的千兆以太网并非必须的。双千兆是必不可的。

    - 连接到后端的完整网络架构（交换机和一个操作系统）。

    - 网络的文件服务最好在 NFS 服务器上完成，该服务器拥有你负担得起的最快硬盘。


    2003 年，密歇根州的教育经费开始下降，一直持续到 2007 年。我们州的每所学校都感受到了，每所学校都在竞争留住学生。在不确定的市场中，2003 年我们需要将学生管理从旧的昂贵的基于
    Macintosh 的系统转换为基于 Windows 的解决方案。我建议实现这一目标的方法是——简单的瘦终端。


    - Microsoft Office 以允许过渡到开源软件 (OSS)

    - 使用 17 英显示器代替 15 英显示器。


    遵循这些指南，我订为了支持我所需的 75 个客户端，我应该有三台 LTSP 服务器、一台文件服务器和一台（用于需要的 Windows 应用）。


    我为董事会写了一份提案。董事会选择切换到基于微软的基础设施。这包括服务器、员工培训和额外的硬件。整个方案需要购买一半的服务器并使用计算机将其瘦化。我们本应基于
    Linux 瘦终端项目。


    董事会批准了这一转变。我们下单了并首先投入了一个令人兴奋的夏天。LTSP 是一个可以在任何 Linux 发行版上运行的系统。它比使用 Debian 要好得多，但对于此，我想使用具有更多支持的东西。参与此工作的成员的支持帮助我们创建了一个集成器，整合了
    LTSP 并进行了让瘦终端真正放光的微调。这种支持超出了我的需求。


    在安装期间，我最大的担心是动力不足以运行所有客户端。第一个客户端在 8 月到来，花费 50,000 美元购买第一台服务器，随后的客户端为 150,000 美元。与
    Windows 相比，“Linux”太便宜了。我们部门确实需要新的交换机，我不想在开学第一天尝试这个想法。我决定在 LTSP 服务器和在网络传输的客户端之间进行路由，这实际上是有效的。


    重要的是，我可以为第一台服务器报价 50,000 美元而仍然拥有一个功能健全的网络。作为早期采用者，我们面临的最大错误之一是，我们在节省软件费用时没有在硬件上花钱。我担心性能问题，不想让
    LTSP 在第一天表现得糟糕。为了节省硬件和处理器使用量，我决定这样做。


