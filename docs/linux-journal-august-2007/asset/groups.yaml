    这是下一个 RG 的挑战——使用低端硬件实现高吞吐量。一种解决方案是将整个数据路径卸载到 RG 硬件，另一种方法是使用一些可以处理 NAT、路由和 QoS
    的低端芯片，例如 RT5085/RT508B，但这种实现在 CPU 上捕获数据包是可能的。然而，这是一个问题，最严重的问题是 CPU 栈的连接。这可能是困难的，如果可能，其他接口，如
    802.11、DOCs 和 QoS，尽管这种方法在特定情况下有效，但在细节上很好。优化方法基于对 RG（通常是网络应用程序）受内存限制的观察，因此改进内存访问将非常有益。节省数据和代码以将其保持在缓存中，存在关键路径——即，通过
    TCP/IP 栈的一个驱动程序的接收功能。这并非可能，但如果你有 22KB 缓存，可以放入 SRAM。


    另一个优化方法是两个用户分析的混合，用于大多数 CPU 密集型任务并将此功能卸载到硬件。这样，你有一个定义良好的硬件架构，硬件卸载是非常有利的，如果已经在硬件中检查，然后
    CPU 将把整个数据包带入缓存，或者用于内存访问。另一方面，作为 RG，IPS（VPN）流量通过连接。通常情况下，尽可能保持软件是一个好主意，因为这是开发和调试。


    另一个优化方法绝对不会推荐，但被制造商采用的一种是通过创建各种类型的“路径”来“优化”Linux。例如，如果 L2 桥接不理想，是传递网络驱动，或者消除某些交换机和代码，或者消除至少一个性能增益。尽管它对
    RG 通常有效，包括所有驱动程序和内核本身！这种方法最大的问题是它实际上会导致 Linux 内核崩溃，限制功能并引入 Bug。如果添加到内核邮件列表，即使被添加了，也不会被接受。但随后你会进入在开发中发现难以消除的开源错误，这也可能是开源社区对嵌入系统不感兴趣，因为它们比
    PC 更难处理。我相信第一个问题最终会消失，因为半导体公司理解他们如何从开源中受益，我尝试分享我对它的解释。至于第二个问题，本文的信息之一是编写嵌入系统很容易且有趣，而且你已经有了硬件。使用上述步骤将以较少的精力构建基于
