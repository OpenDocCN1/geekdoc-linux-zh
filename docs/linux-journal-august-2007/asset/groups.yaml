    # Exploiting 64-Bit Linux


    How a Mandelbrot can illustrate the advantage of using 64-bit Linux. Steve MUNROE


    Wide availability of 64-bit systems offers an opportunity to simplify programming.
    By leveraging large virtual addresses and memory mapped files, we combine programming
    and persistence into a single activity. This simplifies programming without shared
    data structures. It also improves the efficiency of access and sharing, as multiple
    programs can share data directly (in place) through a single real page. This eliminates
    the need to copy data through multiple layers of buffering. When all programs
    share the same kernel memory map it is easy to alias and MMU resources across
    applications.


    and does copious to the top of the IO Subsystem. Operational efficiency is lost
    to obtain a modest renown in programming effort.


    Alternatively, Single-Level Stores have been a research topic for years, although
    the technology works (simplified programming and data management) but only for
    specialized hardware or OS environments with limited resources.


    This picture changes again with widely available 64-bit microprocessors and standardized
    POSIX memory management APIs. The addition of a small runtime library allows adventurous
    programmers to use implicit access semantics. This highly Single-Level Store approach
    for incremental exploration and adoption of a new programming paradigm.


    As a proof, I have a small library I call SPIDE (Shared Persistent Heap/Environment).
    It maps a portion of the application address space to blocks of persistence. This
    library provides some primitives and "utility objects" for storage and allocation.


    As a demonstration, I wrote a Mandelbrot (GUI) program. This program computes
    some point in the Mandelbrot set and shows the image as a SHARED thread. This
    representation can be shared and displayed by multiple instances of the program.
    Program instances cooperate to fill in the next level of detail.


    # Resources and Design


    System and design programming are (implicitly) driven by the need to manage resources.
    In the early days of programming, address space and physical memory were scarce.
    IO Subsystems had to handle the management of memory space, such as tape and page
    cards. The introduction of random access and virtual memory did not change this
    much. The resources are so abundant today that we have the freedom to choose.
    The separation of persistence from data is a prime issue. It creates inefficiencies
    in both programming and runtime execution.


    # Opportunities


    With the availability of 64-bit processors, the original (address/memory) scarcity
    is gone. We can leverage virtual memory to share massive data structures directly
    "in place" and "implicit" semantics. This simplifies programming, as the data
    structure is shared by all processes. It improves operational efficiency, because
    it allows fewer layers of memory management and the OS has more opportunities
    to share a special file. There are countless opportunities for improving performance
    efficiency by addressing aliasing and exploring hardware features, such as large
    pages.


    # A High-Level Design


    Memory-mapped files are not enough. We need a design for the address space and
    backing files to manage memory. The design should balance simplicity and efficiency
    in the virtual memory (address space) and physical memory (data).


    The features we believe are important to include in the design. The runtime should
    be simple and compatible with UNIX programming and POSIX APIs. It should use resources
    (address space) for a large shared persistent heap (SPH). Access to the data in
    the SPH should be made. The design evolved to concepts of


    The region is the range of virtual addresses that the runtime wants to manage
    on. The heap should be a region that does not interfere with the normal memory
    layout. We want to ensure that the region does not interfere with the normal usage
    of (local) thread and dynamic libraries. LI, means the area under TASK_UNAPPED_base
    and the main stack. Leaving a gap from below and above the TASK, still allows
    for the use of it up to the program''s address space for SPH.


    Next, we need to choose a segment size. The segment is used for aligning backing
    files and mapping files into this region. This should be large enough so we don''t
    run out of segments but small enough so that we do not waste space.


    A store is a directory that contains one or more files to back SPH segments. A
    segment can have multiple SPH segments by allocating the backing files in different
    directories. For now (all to keep simple), a program can bind to only one region
    store at a time.


