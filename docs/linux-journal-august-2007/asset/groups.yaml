    \ SPH 中的数据进行访问。设计演变为以下概念：\n\n区域（Region）是运行时想要管理的虚拟地址范围。堆应该是一个不干扰正常内存布局的区域。我们希望确保该区域不会干扰（本地）线程和动态库的正常使用。LI，是指\
