    # Cool Change


    Here are some ideas for cool projects; send us of yours.


    Nick Petley, our fearless Editor in Chief, had joined me at my favorite restaurant
    and watering hole, Aldea dos Piratas for an evening. As the music played and the
    young folks danced the night away, Nick and I talked about the Linux community
    and concentrating on all the interesting things that have happened lately.


    Nick had declared this month as Cool Projects for the magazine. Traditionally,
    the focus had been Home Projects, but the Home Projects were too limited. Robotics
    and wearable computers, are for example, cool, but not necessarily home.


    Even before this month would be Cool Projects, I had started thinking about what
    makes a software "cool".


    My "cool" thought processes started with an article by Kathy Sierra called "Professional
    vs Passion" at site headsquare.type.com/creating_passionate_users/2006/11_two_simple_worlds


    Although this particular article focuses on how sometimes discard the raw passion
    people feel when how changes come when they trade in salaries and T-shirts for
    the suits and ties of the Professional, the article also touched on the concept
    of what is cool. One example was given: "kid-at-shower-seeing-an-ice-cream-afterburners-by-so-cold-it-makes-your"


    Some of you have been a "kid" at the shower and had that feeling of the plane
    made the ground shake. Now, with some thought about computer conferences and tradshows
    and why people do or not go to them. Certainly, some people go to conferences
    and tradshows to find existing solutions to problems. Other people because they
    are curious about what is going to be a solution to the one or two years. Others
    go to find out and new things (cool stuff)—


    things that may never turn into a product or service or things that may be suitable
    for such a small group of people that no one sees a commercial opportunity for
    themselves, they are cool.


    Likely of the conferences I attended seemed to be concentrating on the existing
    solutions, and for the forward direction and cool stuff.


    Of course, cool is in the eye of the beholder, and it seems to change over time.
    New days of programming, new solutions and having the program half the time to
    get the same F-16, but it is cool.


    So, I want out your group and ask, "what is cool?" general responses before the
    list moved away from the original question to a discussion of one topic something
    went cool. Some of the ideas are:


    +   NCID: a system for displaying, and presenting speaker call-ID.


    +   MySynth, Pluto and Linux for various systems: recording, storing and playing
    back videos, music, pictures and home automation.


    +   Automation of testing procedures to production testing time by a factor of
    four and cut down human error.


    Each of these projects might be considered by your people. Although attempting
    a procedure might not sound like F-16 flying at 200 feet above you, it might be
    a project that would get some people excited and try to implement that solution
