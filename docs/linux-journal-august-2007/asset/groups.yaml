    # THE BEST GAME IN TOWN


    Kai Staats discusses the power and challenges of the PlayStation 3 supercomputing
    cluster


    In October 2006, Terra Soft announced plan to build the world''s first cluster
    using PlayStation 3 (PS3), which utilizes the IBM Cell Broadband Engine and the
    Linux operating system when Sony Entertainment knocked on Terra Soft''s door,
    interested in showing that PS3 is not merely a game box. After building a 3,000-sq-ft
    facility for Soft hardware, and adding a heavy dose of old-fashioned turnkey,
    the cluster is well underway. Terra Soft CEO Kai Staats called the building of
    cluster ''industry''. We caught up with him for an insider''s view on PS3.


    LJ: Thank you for agreeing to talk to us, Kai. Why did you come to Terra Soft
    to build this cluster?


    KS: Terra Soft has, for eight years, dedicated to the Power architecture, providing
    a Linux OS for systems built upon IBM Cell Broadband Engine and PowerPC product
    line. This experience and expertise gave us confidence that Terra Soft would provide
    a high-quality experience with professional support.


    LJ: The PS3 cluster you created together with Sony is an interesting application
    of what is marketed primarily a home-entertainment machine, isn''t it?


    KS: Yes, it is. But I believe we are experiencing an interesting paradigm shift
    from three decades of personal computers to the new era, where gaming is becoming
    truly personal computer functionality. Sony recognizes that the Processor is not
    just another processing engine, but a fully-featured capable of high and lightweight
    development. We faced a different market demand.


    LJ: We''re curious to know more about the significance of the Cell Processor.


    KS: The PS3 is built upon the Cell Broadband Engine, a nine-core CPU designed
    by Sony, Toshiba and IBM (the STI consortium). We obtained an exceptional side-by-side
    comparison.


    LJ: Does the Cell multicore processing behavior have like true eight-core processor,
    or is there a significant difference?


    KS: The first core is the PPU, an IBM 970-capable unit. This means any Linux application
    designed for the Cell GS will operate synchronously on the Cell. The additional
    SPEs (Synergistic Processing engines) provide additional cores that can be expressed
    as DSPs, enabling seamless single-processing computing. We are keeping the core
    on the front side as connected to the north side performance is maximized.


    LJ: A critical part of realizing the PS3 cluster appears to be Y-HPC, your cluster-construction
    site. What are Terra Soft''s innovations there?


    KS: Simply stated, the Y-HPC cluster-construction service drive nodes to compute
    nodes. But, around this core function is the means to manage unique nodes personally
    that modify any given node to perform various designed tasks. Nodes may be deployed
    as an NFS server, storage server or compute node (for example), based upon the
    user needs.


    Y-HPC integrates a full command-line syntax and as a general user interface. And,
    Y-HPC can be deployed, both server and nodes, on x86, x86-64 and PowerPC (Cell).
    Furthermore, Y-HPC is the first and only cluster-construction suite for IBM, Mercury
    and Sony.


    Although Y-HPC does incorporate basic cluster monitoring tools, it is not designed
    to replace Cluster Resources Moab. It is designed to integrate with Torque and
    Moab for a build-run solution.


    Currently in a beta v2.0 release, Y-HPC is being kept to clusters in addition
    to its deployment on our internal PS3 cluster.


    L.J.: How does Yellow Dog play into other Cell-based systems?


    KS: In the fall of 2005, Mercury Computer engaged Terra Soft to develop and maintain
    a commercial Linux distribution for its cluster-based systems. This work started
    at SC2005 (www.terrasoft.com/news/2005-11-15.html).


    Mercury began shipping IBM form-factor Cell blades in January 2006 with Yellow
    Dog preinstalled. Terra Soft continues to maintain Yellow Dog for Mercury''s products,
    with forthcoming support for the PCI form-factor CAB and 1U-rack form-factor "pizza"
    box (node.com/products/cells).


    L.J.: Why will you use this for bioinformatics. Can you explain to our readers
    what bioinformatics is?


    KS: Wikipedia says, "Terms bioinformatics and computational biology are used interchangeably.
    Bioinformatics- field of development and advancement of algorithms, statistical
    techniques, and theory to solve practical and formal problems by or inspired from
    the management and analysis of biological data. At a more basic level, bioinformatics
    includes the comparison of gene sequences between two or more organisms, virus
    mutations, bacteria. The comparison of its genes differs from the previous strand.
    Once the process by which the genes are identified, bioinformatics offers a means
    by which post-generation gene sequences can be compared and better understood."


    L.J.: Originally, contracted with to build two clusters on the PS3 platform: a
    test cluster deployed by E.coli and a production cluster called Amba. Is this
    what fully transformed? KS: The original test and production cluster for "beta"
    PS3, the 2 units which Sony provided to the game developers prior to shipping
    hardware."

