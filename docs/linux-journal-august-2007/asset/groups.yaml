    # 案例研究：SACE 集团


    ![](img/1234e63edf27cb1f15e6071bce50485a_98_0.png)


    ## CRM 轻松轻松联系

    使用 SugarCRM™ 企业版：触手可及的客户


    # SACE 集团


    **公司简介**

    SACE 在创业活动的所有阶段提供咨询和援助服务，以指导企业发展。

    SACE 为在国际市场上运营的企业提供信用保险、投资管理和合同担保。

    SACE 活跃于全球 150 多个国家，其中包含 12 个新兴经济体。

    自 2004 年成立股份公司以来，SACE 由经济和财政部 100% 持股。

    2005 年，SACE 集团在全球范围内承保了约 160 亿欧元的业务。


    客户管理是公司商业战略开发的核心，在 2005-2006 年间，公司识别了其“资产类”企业信息。

    随着 SACE Spa 业务的增长，在准确的客户管理与用户联系人关系之间共享信息的需求日益凸显。

    同时，充分利用公司投入的资源至关重要，因此必须采用最佳质量标准来提高客户对“正确”体验的满意度并增加其忠诚度。

    因此，有必要实施客户关系管理（CRM）系统作为模型，以统一管理与客户（及潜在客户）的关系，以及分散在不同内部部门的关于企业和交易对手的所有可用信息。


    因此，采取了必要的行动，最终选定了 SugarCRM 平台来构建 SACE 的 CRM 系统（Mediamand 项目）。


    ## 轻松联系


    ### 目标


    - 建立一个涵盖所有客户联系渠道的唯一共享数据库；

    - 支持客户服务部门管理入站和出站联系；

    - 管理客户在获取、管理、协助、回收和关系结束阶段的生命周期；

    - 增加已获取客户的忠诚度并减少客户流失；

    - 提高业务流程的渗透率并获取新客户；

    - 整理并监控流程效率以提高客户满意度。


    > “当服务客户并不并不‘轻松’时，共同努力满足他们”


    “CRM EasyConnect 允许对我们的客户信息进行统一和共享的管理。通过这种方式，我们能够简化内部工作，为客户提供更好的服务。”


    ![](img/1234e63edf27cb1f15e6071bce50485a_98_1.png)


    ![](img/1234e63edf27cb1f15e6071bce50485a_98_2.png)


    ## 案例研究：SACE 集团


    ### 能力


    实施 SACE 客户管理逻辑模型：CRM 自动管理从购买或售后（线索和潜在客户）到组合分配的客户生命周期阶段。


    **信息组织与联系人管理：**通过 CRM Contact，你可以利用活动来结构化、查找和监控信息：


    - 记录联系人

    - 分析并筛选客户

    - 回收和组织有关公司、协会、市场、管理平台的信息

    - 协调活动目标（时事通讯发送、邀请、活动）、年度报告等……


    **业务机会管理：** CRM 通过主题标记管理所有在 SACE 或其他交易对手处的销售向上销售（up-sell）或交叉销售（cross-sell）机会。


    **漏斗管理：**系统允许通过查看进度（百分比和状态）来管理商务谈判（漏斗）。谈判信息组织在不同区域：CRM 运营区域；仅限特定团队可见的“笔记本”。


    **运营获取与工业数据管理：** CRM 与工业系统集成，以便获取每个客户的 SACE 关系摘要数据、申请、担保发行和操作文件。


    **活动管理：** 激活了支持商业活动的功能，并关联现有或潜在客户的参考信息。


    **报表：** 准备了处理摘要或详细报告的功能，用于 SACE 客户组合的营销分析，并监控执行情况、活动、操作和漏斗。


    ## 结果


    2006 年对于 SACE 集团来说是增长的一年，并取得了积极的成果：仅在上半年，净利润就达到了 5.427 亿欧元，比 2005 年增长了 15%。


    增长的决定因素还包括合并保费的增加（1.233 亿欧元，比 2005 年 6 月 30 日增长 85%）以及 SACE 在财务管理方面的成果（7110 万欧元）。


    2006 年，SACE 集团在全球范围内承保了约 160 亿欧元的业务。


    ## SugarCRM


    客户管理是公司商业战略开发的核心，在 2005-2006 年间，公司识别了其“资产类”企业信息。

    随着 SACE Spa 业务的增长，在准确的客户管理与用户联系人关系之间共享信息的需求日益凸显。

    同时，充分利用公司投入的资源至关重要，因此必须采用最佳质量标准来提高客户对“正确”体验的满意度并增加其忠诚度。

    因此，有必要实施客户关系管理（CRM）系统作为模型，以统一管理与客户（及潜在客户）的关系，以及分散在不同内部部门的关于企业和交易对手的所有可用信息。


    因此，采取了必要的行动，最终选定了 SugarCRM 平台来构建 SACE 的 CRM 系统（Mediamand 项目）。


    ## Mediamind


    SACE 在创业活动的所有阶段提供咨询和援助服务，以指导企业发展。

    SACE 为在国际市场上运营的企业提供信用保险、投资管理和合同担保。

    SACE 活跃于全球 150 多个国家，其中包含 12 个新兴经济体。

