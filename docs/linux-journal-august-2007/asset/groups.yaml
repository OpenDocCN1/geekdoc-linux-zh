    ## 特性 构建你的街机游戏玩家


    《街头霸斗2》布局。你会在中间需要一个额外的摇杆，这并不是《街头霸斗2》布局的一部分。这是一个原始的《小姐小姐》（Ms.Man）摇杆，是我妻子作为一份非常平衡的高中毕业礼物送给我的！（我们是一个非常稳固！）我们将其直接连接到玩家摇杆上，所以如果你没有座位也不用担心，这并不理想，只是一个备选方案。


    摇杆和按钮会有空间，但标准按钮使用 1 英寸的孔。你可以根据自己的喜好随意进行布局。如果你想确保按钮放置得完美，除了硬币口外，没有其他规则！别忘记在机器正面留一个投币槽，如果在真实的街机厅里，你会向那里投入四角硬币。


    现在你有了一个空外壳，带有一个显示器架、电脑和一块布满孔的木板。如果你在家里做这项工作并且必须管理它，请花这段时间打打灰。如果你是个手巧的人并想给控制面板和街机上漆，尽管去吧。我没做到，这个混乱的日子现在有一个原木色的控制面板。


    ![](img/1234e63edf27cb1f15e6071bce50485a_41_0.png)


    图 4。这张照片已经说明了一切。这是一个关于如何不组织的很好的反例。


    ## 选项


    软件：AdvanceCD，自定义 Linux 安装。


    - 优点：创建一个自定义的 CD 或可启动的 USB 闪存，可以直接启动到 AdvanceMENU 前端。

    - 缺点：如果你不使用标准布局，配置会非常困难。如果你的硬件没有被正确检测，也很难。此外，如果从 USB 1.1 启动也是如此。


    软件：Linux，基于 Gentoo。


    - 优点：使用 Arcade 前端，它的可配置性更高，并且在安装后有添加和修改游戏的选项。

    - 缺点：如果你不使用标准的 MAME 按钮，配置仍然非常困难。


    软件：KnoppixMame，基于 Knoppix。


    - 优点：出色的硬件检测。

    - 缺点：并非真正为街机柜设计，而是更适合拥有键盘和鼠标的人。


    ![](img/1234e63edf27cb1f15e6071bce50485a_41_1.png)


    图 5. 我为了避免焊接的指南。插头看起来很棒，但它们连接得并不好——另一个不该做的范例。


    ## 再见，你好，士兵


    这是发生混乱的地方。如果你像我一样，你已经在电脑上尝试过 MAME 并用键盘玩过游戏。这很有趣，但与原版并不完全。在这一步中，我们将真实的控制设备连接到电脑。首先，你不需要在机柜上有任何硬件和按钮，你需要去买。有几个地方可以买街机柜，但最受欢迎的之一
    Happ Controls (www.happcontrols.com)。如果你查看之前提到的街机网站，你会发现有许多你可能需要的物品的供应商。


    一旦你有了按钮和摇杆，你就需要将它们连接到编码器，或者自己破解键盘。前者选项更简单、更可靠，但后者可以省点小钱。后者是关于如何确定按钮布局的详细说明，但请查看“隐藏键盘”侧边栏获取快速描述，如果你打算这样做的话。


    软件：标准 Ubuntu 和 Wac 前端。


    - 优点：非常容易配置。Ubuntu 安装处理所有的硬件检测。这是我选择的。

    - 缺点：没有专门为街机柜进行配置。


    ## 获取合法的 ROM


    MAME ROM 在互联网上很容易找到并下载，但使用那些 ROM 的合法性尚存疑。有几种方法可以确保你拥有使用 ROM 的合法权利。


    1. 从原始游戏购买实际的主板。这听起来可能很遥远，但从当地的硬币机供应商或在 ebay 上购买故障的街机板并不困难。因为你只是寻找使用下载的 ROM 的合法权利，主板是否坏了并不重要。

    2. 你可以购买 X- Arcade 键盘，它带有一些经典 ROM。

    3. 查看 arcadecontrols.com。那里有一些免费的、非商业的游戏可以下载，还有一些关于获取合法 ROM 的更多想法。即使你愿意花钱，要找到从谁那里购买权利通常也会变得困难。


    ## 模拟 2.5MHZ 需要多少 GhZ？


    现在，如果你有一个机柜、安装好的控制设备、一套带键盘接口的游戏组和一个等待电脑的空 MAME 架子。最后一步是放入电脑，你将安装软件。然而，你需要的实际上取决于你想玩什么游戏。如果你计划玩经典游戏，像《吃鼠蛇》这样的足够了。但是，如果你想玩《街头霸斗2》或任何其他游戏，你应该买一个
    Pentium III 或 4。如果你有一个中端的 Pentium 4。如果你需要建议，我想听听你有什么。如果你觉得以后有需要，可以再投资。


    ## 企鹅时间到了！


    要在街机柜中运行 MAME，你必须配置两个独立的程序：MAME 本身和一个前端。因为 MAME 是一个命令行程序，你需要一个前端来通过摇杆和按钮启动游戏。这最后一步是你最喜欢的部分。如果你觉得我


