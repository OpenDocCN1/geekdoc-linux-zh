    SACE offre assicurazione del credito, gestione degli investimenti e garanzie contrattuali
    per imprese che operano sui mercati internazionali.

    SACE è attiva in oltre 150 paesi, di cui 12 economie emergenti.

    Dal 2004 Società per Azioni, SACE è partecipata al 100% dal Ministero dell''Economia
    e delle Finanze.

    Nel 2005 Gruppo SACE ha assicurato operazioni per circa 16 miliardi di euro in
    tutto il mondo.


