- md: '

    AlphaMail runs on a standalone system that serves Web mail and nothing else, with
    no shell access for users.


    The configuration also allows users to configure the large file-sharing system.
    This allows users to upload files to the AlphaMail system, so that others can
    download them. Large file sharing is much better than a file that is attached
    or recommended as part of an e-message. File sharing has several advantages, including
    size limits, password protection, encryption, download limits and time-based expirations.
    Choosing a zero size limit for file sharing disables the feature.


    The final step is to edit the Apache Configuration. When using mod_perl and libapache2
    are loaded with directives, these


    ```

    LoadModule apache_module modules/mod_perl2.so

    ```


    And, include the generated Apache configuration file.


    ```

    Include /local/etc/alphamail/alphamail.conf

    ```


    # Running AlphaMail


    Alpha and apache must be running for AlphaMail to work. Startup does not require
    a sample reset. The init script for the cache will be included and installed in
    /usr/local/alphamail/alphamail.init


    A cleanup script must be run periodically from cron. AlphaMail uses minutes the
    mail systems, or which are decoded MIME messages and attachments. These files
    are not replayed by the web server, as there are no guarantees about user behavior.
    The script is called garbage_sweeper and is installed by the administrator.


    AlphaMail is in use at the University of Oregon. The performance and usability
    results have been very encouraging, and the former are available at the AlphaMail
    home page.


    However, the system is still slow, and there are some latencies when searching.
    The mail interface is a rather complex piece of software that has many optional
    problems. I recommend using an include called hang_handler (in /usr/local/alphamail/default.by).
    You must edit this script before using it, and it requires a valid LDAP command
    in order. It is capable of restarting the web server cache (via the included init
    script). It is also capable of sending mail to deforma administrators.


    # Common Problems


    There are several places where you can run into issues on a new installation.
    The Administrator''s Guide included with AlphaMail has many ways to solve these
    issues.


    One of the most puzzling problems is produced by accessing the service via an
    incorrect domain. The cookie that contains the session is fixed to the server
    that you specify during configuration and is stored in a parameter in AlphaMail
    apache configuration:


    ```

    PerSet alphamaildomain server.example.com

    ```


    If the user is to access the login page with an unqualified hostname (such as
    server), the cookie will not be exchanged properly and will fail without any error.
    The login is succeeding, but the receiver is not sending back because of the mismatched
    URL.


    Furthermore, users connect through a type or insecure HTTP URL. The former is
    never a problem, and a redirect does a nice job of the latter.


    ```

    <VirtualHost_default_80>

    Redirect /alphamail/?$server.example.com/

    Alphamail/index.html

    Redirect /alphamail/?$server.example.com/

    Alphamail/index.html

    </VirtualHost>

    ```


    Other problems usually involve dependencies, configuration errors, or missing
    auxiliary details. The best indication of these are in alphamail_ui.log, which
    is located in varlog.


    SELinux can also be the source of problems. If you use AlphaMail with SELinux
    and you are writing to create your own security profile, you might need to turn
    off or disable it.


    # The Future of AlphaMail


    AlphaMail has been much concerned with performance and core functionality, and
    I don''t expect these two issues to be less important in the future, as the product
    is developed in environments that have large and diverse user community.


    It is feature-rich, but certainly not all-inclusive. Limiting features is a requirement,
    because the critical concern is easy and easy access to essential functionality,
    without global coverage of mail features.


    Still, there are space for improvements and adjustments, as an international interface,
    quite Ajax components might better client interaction and views.


    # Resources


    - AlphaMail Installation Guide: sourceforge.net/docman/doc_php.php?id=3804&group=alphamail

    - AlphaMail Home Page: sourceforge.net/projects/alphamail

    - C++ Libraries: boost.org

    - IMP Benchmarks: whizzo.uoregon.edu/public/src/mailperl/results.html

    - US CERT: www.us-cert.gov


    www.linuxjournal.com | august 2007 | 95


    # /var/opinion


    # The Benevolent Racketeer


    We present a fair and balanced picture of the issue that Microsoft cost not to
    save us.


    That someone would not sue us for using Linux unless someone wanted not to sue;
    We were angered to pay protection money to solve this problem, but to whom would
    we pay? We had given paid Red Hat, but then Red did not threaten to sue us, so
    what would be the point? That is the problem with Linux. It is not overseen by
    anyone with the power to license protection, and those who are threatening to
    sue in order to make intellectual property available to paying customers.


    How can anyone question Microsoft''s commitment to the open-source model?


    This is not the first Microsoft wanted to assist us with intellectual property
    protection. Some years ago, Microsoft conducted an audit of our Windows and Office
    licenses, which had brought to our attention the fact that we differ. We thought
    of it as a favor that Microsoft products solved our problem by selling us the
    replacements we needed. It seemed unreasonable to some people to pay for the same
    thing twice, or to think of it as paying not for free, but for peace of mind,
    which is what intellectual property protection is about.


    Linux advocates and developers should be grateful that Microsoft reached this
    point.

