    # FEATURE Build Your Arcade Game Player


    Street Fighter II layout.

    You''ll need an extra joystick in the middle, which is not part of the Street
    Fighter layout. It''s an original Ms.Man joystick that my wife got as a balanced
    high-school graduation gift! (We''re a solid family!) We wired it directly to
    the player-joystick, so don''t worry if you don''t have a seat, it''s not really
    ideal, just an alternate.


    The joystick and buttons will have space, but standard buttons use 1" holes. Feel
    free to lay out however you like. If you want to make sure the buttons were perfectly
    placed, there aren''t any rules for except coins! Don''t forget a slot for coins
    sticking out of the front of the machine, where you''ve put in a quarter if there
    was an actual arcade.


    Now you have a empty case with a monitor shelf, computer and a wooden panel full
    of holes. If you are doing this work at home, and you have to manage it, take
    this time to vacuum it. If you are the crafty type and want to paint the control
    panel and arcade, go ahead and do so. I couldn''t, and this day mayhem has a raw-wood
    control panel.


    ![](img/1234e63edf27cb1f15e6071bce50485a_41_0.png)


    Figure 4. This photo quite much speaks for itself. It''s a great example of how
    not to organize.


    # OPTIONS


    SOFTWARE: AdvanceCD, custom Linux install.


    +   - PRO: creates a custom CD or bootable USB key that boots directly into the
    AdvanceMENU front end.


    +   - CONS: really tough to configure if you don''t use the standard layouts.
    If your hardware isn''t detected properly, it''s also hard to fix. Also, if booting
    from USB 1.1.


    SOFTWARE: Linux, based on Gentoo.


    +   - PRO: uses the Arcade front end, and it''s a little more configurable, with
    the option to add and modify games after the install.


    +   - CONS: still very difficult to configure if you don''t use the standard MAME
    button.


    SOFTWARE: KnoppixMame, based on Knoppix.


    +   - PRO: great hardware detection


    +   - CONS: not really designed for an arcade cabinet, but better for someone
    with a keyboard and mouse.


    ![](img/1234e63edf27cb1f15e6071bce50485a_41_1.png)


    Figure 5. My guide quite to avoid soldering. The plugs look great, but they don''t
    make a very good connection--another example of what not to do.


    # Goodbye, Hello Soldier


    This is where the mayhem happens. If you''re like me, you''ve already tried MAME
    on your computer and played the games with your keyboard. It''s fun, but it''s
    not exactly the same as the original. In this step, we connect the real controls
    to the computer. First, you don''t need any hardware and buttons on the cabinet,
    you need to buy some. There are a few places to buy arcade cabinets, but one of
    the most popular is Happ Controls (www.happcontrols.com). If you check out the
    Arcade site mentioned previously, you''ll find a plethora of vendors for things
    you might need.


    Once you have the buttons and joysticks, you will need to wire them to an encoder
    or hack a keyboard yourself. The former option is easier and more reliable, but
    the latter offers a cheap penny. The latter are in-depth instructions on how to
    figure out button layouts, but see the Keyboard Hiding sidebar for a quick description,
    which you of you you do


    SOFTWARE: standard Ubuntu and Wac front.


    +   - PRO: very easy to configure. The Ubuntu install handles all the hardware
    detection. This is the option i.


    +   - CONS: not specifically configured for an arcade cabinet.


