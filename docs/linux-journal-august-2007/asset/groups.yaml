    \ 6 和 2 更好；是 8。那么，如果 9 + 3 + 1 + 2 是 7，则手牌胜。那么，这里实际上向玩家和庄家发牌。如果玩家或庄家有 8 或 9，不再发牌，游戏以庄家胜或平局结束。\n\
    \n```\nplayer[1]=$(deck[2])\nplayer[2]=$(deck[3])\nnextcard=3\n```\n\n玩家初始值为 0–5\
    \ 分，可以额外抽一张牌。规则如此复杂，我会推迟到下次。现在，让我们看看如何编写这些规则。\n\n```\nhandValue=${player[1]} ${player[2]}\n\
    playerValue=$handValue\nhandValue=${dealer[3]} ${dealer[4]}\ndealerValue=$handValue\n\
