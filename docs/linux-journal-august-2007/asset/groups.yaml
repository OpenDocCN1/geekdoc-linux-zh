    # 新产品


    ## 摩托罗拉 RAZR V8


    摩托罗拉正在中国尝试在手机上运行 Linux 作为实验，有趣的是，这一尝试得到了中国政府的支持。由于该公司对 Linux 留下了深刻印象，我们喜爱的操作系统在移动设备上变得越来越常见。最新的由
    Linux 驱动的选项之一是 RAZR V8，这款热门手机的下一代。RAZR V8 具有长达 500 分钟的通话时间、四频连接、高达 2GB 的内存、200
    万像素摄像头、Opera 浏览器、以及基于 Windows Media Player 11 的独立语音识别和音乐。摩托罗拉的最新产品不同之处在于它穿透了微软的音频解码器、DRM
    和传输协议，并将其整合到自己的 Linux-Java 平台中。尽管如此，知道可以特意出去买一台强悍的 Linux 手机，依然让追求 Linux 的灵魂感到宽慰。www.hellomoto.com


    ![](img/1234e63edf27cb1f15e6071bce50485a_37_0.png)


    ## Drew Technologies 的 DashDAQ


    当底特律的汽车制造商痴迷于完善杯架时，Drew Technologies 正在试图将一种基于 Linux 的设备 DashDAQ 悄悄带入你的新车中。DashTech
    是“汽车仪表盘、控制面板、导航系统、数据采集系统、诊断工具和手持电脑的交叉体”。该设备设计用于汽车显示屏，包含 OBD 协议，并运行在 DashDAQ 附带的
    Linux 软件，允许用户创建自己的主题和汽车仪表盘。功能包括双 ARM 架构、4 英寸（QWVGA）24 位 TFT 彩色屏、触摸屏和 64MB RAM。该产品可通过各种分销商直接从
    DrewTech 购买。www.dashdaq.com


    ![](img/1234e63edf27cb1f15e6071bce50485a_37_1.png)


    ## Axigen 邮件服务器


    Axigen 持续增加其 Mail Server 消息解决方案的功能集，目前 4.0 版本已发货。4.0 版本的新功能是 Persona 模块，提供日历、任务、笔记和协作支持等功能。该功能可通过
    Axigen 的 Web 界面和 Outlook 客户端使用。此外，该产品现在包含 Outlook 连接器，它实现了大多数类似 Exchange 的功能，例如服务器端文件夹。Axigen
    Mail Server 提供三个版本：ISP/HSP、Business 和 Business office。www.axigen.com


    ![](img/1234e63edf27cb1f15e6071bce50485a_37_2.png)


    ## Kyle Wheeler 著《Qmail 快速入门》(Pakt 出版)


    如果你觉得 Qmail 的主页太难懂，可以购买 Kyle Wheeler 的《Qmail 快速入门》，这是一本为熟悉 Linux/Unix 和 DNS 服务器并希望建立邮件服务器的人编写的新书。从基础开始，Qmail
    介绍了如何让电子邮件进出队列，包括存储、检索和验证。书中还涵盖了数据可视化和用户管理、垃圾邮件过滤、SSL 加密和邮件列表。Pakt 表示，该书的风格侧重于系统管理员可以直接使用的实用示例，但也解释了每个示例背后的原理。www.pktpub.com


    ![](img/1234e63edf27cb1f15e6071bce50485a_38_0.png)


    ## 禁止类乐木

    Ulrik Pilegaard 和 Mike Dooley 著《禁止类乐木》(No Starch 出版)


    ![](img/1234e63edf27cb1f15e6071bce50485a_38_1.png)


    图书出版商似乎是分次发布书籍的，目前我们正处于“极客书籍潮啸”之中。风格包罗百格的 No Starch Press 继续挑选各种类型的乐木书籍，如这本由 Ulrik
    Pilegaard 和 Mike Dooley 编写的《禁止类乐木》，书名“建造你父母警告你不要做的模型”带有微妙的幼稚叛逆，对“自由风格构建”痴之如狂，并展示了如何制作许多模型，如用玩具枪展示乐木大作战、一个糖果立柱、一辆高电压乐木车辆、一个连续射乒乓球发射器以及所有无用但极其有趣的发明。”简而言之：提前贴好乐木积木！www.nostarch.com


    ## Allen Sherlock 著《游戏开发者的数据结构与算法》(Charles River Media)


    《侠客盗猎车》中的弹球游戏，正是你今天需要这本书——由 Allen Sherlock 编写的《游戏开发者的数据结构与算法》的原因。该书由 Charles River
    Media 出版，涵盖了如何使用 C++ 及其替代方案教授游戏开发者数据结构和算法的基础知识。书中还涵盖了当今游戏和游戏程序员为了成功所需的许多主题，包括几何技术、KD
    树、二分空间划分树、球体树等。此外，书中的代码不依赖于平台或操作系统，这正是我们 Linux 用户所喜欢的！www.charlesriver.com


    | 游戏开发者的数据结构与算法 |

    | :--- |

    | Allen Sherlock |

    | Charles River Media |

    | ISBN 978-... |


    ## ActiveState 的 Tcl 开发包


    ActiveState 的最新消息是发布了 Tcl 开发包 (TDK) 4.0，这是一个用于创建和部署应用程序的多点工具包。此外，为构建自安装、文件可执行程序提供了基本工具，TDK
    包括图形化调试器、用于代码优化的性能分析和分析工具、预编译器和服务管理器。TDK 的新功能包括 Tcl 的包管理器，以及对各种 服务的支持。www.activstate.com


    ![](img/1234e63edf27cb1f15e6071bce50485a_38_2.png)


