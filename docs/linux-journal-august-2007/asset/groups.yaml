    time I turned my back around to look at the monitor, configure, or make install
    was already done!


    Once you have the Karmen desktop run, moving windows around is nice and familiar
    in a KDE/GNOME/Windows way, with clicking to focus and window resizing in the
    intuitive way users have come to expect. Rather than the all-to-common annoyance
    of having to click on a window''s titlebar to change focus plages


    lightweight window managers, Karmen lets switch focus by clicking within a window''s
    body. Maximizing is a different affair though, whereas window minus and closes
    to the top of a window; maximizing requires that you double-click the titlebar—not
    immediately obvious. For a list of windows (whether active or minimized), right-click
    on the window, and a new menu appears, allowing you to focus on any window or
    de-minimize currently running.


    Another role of Karmen seems to be quite a keyboard driven window manager. For
    instance, to tell a window on top of others, click the window with the Shift key
    held down. Shift-clicking again disables the stay-on-top property of the window.
    A welcome addition to minimalist window managers, pressing the familiar Alt-Tab
    between windows. In fact, most GUI functions can be performed via keyboard shortcuts
    like Alt and another.


