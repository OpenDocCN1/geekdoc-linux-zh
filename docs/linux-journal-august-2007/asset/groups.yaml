    Before going into the purpose of all those files, you should install it to see
    what the auto-generated extension actually looks like. Firefox uses extensions
    installed in two ways. The normal installation method involves using the .xpi
    file in Firefox. This is the most common way to extend and install. Using a pointer
    file tells Firefox where your extension''s files are. With this method, you don''t
    have to re-install the extension every time you want to change it, all you have
    to create the pointer file:


    ```

    $ cd linuxjournal -jhuff/mozilla.firefox/ln8n5.dev/extensions/

    #extension@linuxjournal.com

    ```


    Of course, you might want to replace -jhuff/mozilla.firefox/ln8n5.dev/ with your
    Firefox development profile directory.

    Now, go ahead and start using your development profile:


    ```

    $ firefox -P dev

    ```


    First, check to the extension is installed. Select Tools-Add-ons, and verify that
    Linuxjournal 1.0 is installed. You should see a window like the one shown in Figure
    3. While you have the menu open, you will notice the new added (red) item (Figure
    4). Go ahead and right-click in the browser window. You should see a menu similar
    to the one shown in Figure 5. If everything goes well your extension is properly
    installed.


    # Inwards


    By modifying the code, you should understand all the pieces in place. The main
    file for the extension is linuxjournal.rdf. This file contains the extension''s
    ID, name, and version. The manifest file also contains a list of all compatible
    applications and versions. In this example, we use a simple example with an ID
    of (0ec330b7-c20a-464f-9d2e-733aa93f78d6) and version 1.0.0.


    The second file is chrome.manifest, which tells Firefox what to expect from this
    extension. The manifest also contains a list of overlays. We explain overlays
    later in this article.


    Most extensions are organized into several directories. The chrome.manifest controls
    the content of your extension and UI logic. The chrome itself is written in JS
    and any graphics are live. Finally, locale is for local-specific files, such as
    translations.


    # Chrome


    The user interface for Firefox (as well as other Mozilla projects) is implemented
    in a file format known as XML User Language (XML) combined with JavaScript. It
    is known as Chrome. If you check the Chrome list, you


