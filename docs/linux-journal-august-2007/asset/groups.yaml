    # LMMS—Linux MultiMedia Studio


    Initial screenshots of LMMS will give you a hint of FruitLoops and the scratch.
    With it, but in reality, LMMS takes a completely different task. LMMS takes on
    a micro-managed approach, and it will probably appear to control feels those who
    want to generate their own songs or instruments from scratch. With the ability
    to layer instruments and tracks, you can create whole songs from the ground up.


    Unlike traditional editors under Linux, LMMS takes an alternative approach to
    midi for many circumstances, synthesizing through wave instead. This sidesteeps
    the annoying process of


    making midi under Linux, although midi still can be used and is very much a part
    of LMMS. By tweaking all the knobs and options, you can generate entirely original
    sounds and use them in any way you see fit.


    I managed to generate some brilliant effects and samples for my music projects.
    This likely appeal most to dance-music Djs and also to fans of Nine Inch Nails
    or the most recent Attack-style music for those who want unique samples, or it
    will appear to fix of retro ''80s synthesized sound for those who want to make
    whole orchestrations.


