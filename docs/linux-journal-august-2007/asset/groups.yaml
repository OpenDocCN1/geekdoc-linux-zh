  - '[PAGE 68]


    # # GENSTOR


    A simple cache of allocated SimpleHeaps and SimpleHeaps where nodes were recently
    freed to keep the quadtree dense within the SPHoundHeap managed storage. All this
    logic is also contained in 100 lines of code.


    Finally, we need to ensure that multiple instances of the program can share and
    update the quadtree. This requires adding SPHook cells as there are only four
    locations in the current memory. The utility objects (Simpleheap, Comp-sort and
    on) use appropriate locks to ensure consistent behavior in a shared environment.


    # Conclusion


    The result is that a program can store and render larger images. Generating a
    gigapixel (32768x32768) Mandelbrot takes about five minutes (Apple G5 dual-2.3GHz
    Processor). Once the quadtree is generated, existing and retiring is nearly instantly
    (22 milliseconds to a 512x512 image) and zooming around the center is also fast
    (12-20 milliseconds). Zooming to a depth where the pre-computed set slows down
    (200-500 milliseconds) due to the heavy computation required. When an image is
    computed and stored, subsequent displays are fast (12-20 milliseconds).


    We have tested Mandelbrot programs on both 32-bit and 64-bit Linux, using PowerPC
    and x86_64 platforms. 32-bit systems can support a 1-GB range, which is large
    enough. Gigapixel requires tiles to render the large regions without aliasing.
    With recent improvements, PowerPC64 can support up to 8TB. The x86_64 platform
    supports an 8TB address space and 6TB range. This is more than enough for our
    current projects.


    > Steve Moore is an active contributor to tooling (GCC, GLIBC, dbx and performance
    collection) in IBM''s Linux Technology Center. Steve is an active contributor
    to open-source software, using the GNU C Library (GLIBC) as his de-facto standard.
    He is also an active contributor to quadtree architecture, and has authored numerous
    papers on persistence and business applications. He coauthored with (Steven Halter)
    the Enterprise Java Project. He was also a project manager for IBM''s San Francisco
    Project and a workload from which he joined SPEC Standard Performance Evaluation
    Committee SPEC—an industry-standard benchmark for server performance.


