    # Caso di studio: GRUPO SACE


    ![](img/1234e63edf27cb1f15e6071bce50485a_98_0.png)


    ## CRM Easy Contact

    con SugarCRM™ Enterprise: Il cliente a portata di click


    # GRUPO SACE


    **Company Profile**

    SACE fornisce servizi di consulenza e assistenza durante tutte le fasi dell''attività
    imprenditoriale per guidare le imprese.

    SACE offre assicurazione del credito, gestione degli investimenti e garanzie contrattuali
    per imprese che operano sui mercati internazionali.

    SACE è attiva in oltre 150 paesi, di cui 12 economie emergenti.

    Dal 2004 Società per Azioni, SACE è partecipata al 100% dal Ministero dell''Economia
    e delle Finanze.

    Nel 2005 Gruppo SACE ha assicurato operazioni per circa 16 miliardi di euro in
    tutto il mondo.


    La gestione del Cliente è il pieno intorno al quale è stata sviluppata la strategia
    commerciale dell''azienda, nel 2005-2006 ha individuato le informazioni aziendali
    ''patrimoniali''.

    Con la crescita dell''attività di SACE Spa sono emerse necessità di condividere
    le informazioni tra una gestione accurata del cliente e dei rapporti con le persone
    di riferimento degli utenti.

    Al tempo stesso era essenziale disporre del pieno delle risorse impiegate nella
    Società e quindi adottare i migliori standard di qualità per migliorare la soddisfazione
    del cliente di ''giusta'' esperienza e aumentarne la fedeltà.

    Si rendeva dunque, necessaria l''implementazione di un sistema di Customer Relationship
    Management (CRM) come modello per gestire in modo univoco le relazioni con i Client
    (e potenziali) e tutte le informazioni disponibili sulle Aziende e Contparti,
    fino ad disperse in diverse aziende interne.


    Sono state, quindi, intraprese le azioni necessarie che hanno condotto la selezione
    della piattaforma SugarCRM per realizzare il CRM di SACE (Mediamand).


    ## Easy Contact


    ### Gli Obiettivi


    - di di una base unica e condivisa di tutti i canali di contatto con i Client,

    - supportare il Servizio Clienti nella gestione dei contatti inbound e outbound,

    - gestire il ciclo di vita dei Clienti nella fase di acquisizione, gestione, assistenza,
    recupero e chiusura della relazione;

    - mantenere incrementare la fedeltà dei Clienti acquisiti e ridurre le perdite
    di clienti;

    - aumentare il livello di penetrazione dei processi commerciali e acquisire nuovi
    Client;

    - ordinare e monitorare l''efficienza dei processi di aumentare il livello di
    soddisfazione del Cliente.


    > “Lavorare insieme per soddisfare il Cliente quando non è così ''Easy''


    “CRM EasyConnect consente la gestione univoca e condivisa delle informazioni sui
    nostri Client. In questo modo siamo in grado di offrire un servizio migliore ai
    nostri Client, con la semplificazione del lavoro interno.


    ![](img/1234e63edf27cb1f15e6071bce50485a_98_1.png)


    ![](img/1234e63edf27cb1f15e6071bce50485a_98_2.png)


    ## Case study: GRUPPO SACE


    ### capabilities


    Implementazione del modello logico SACE la gestione del cliente: Il CRM gestisce
    la gestione automatica delle fasi del ciclo di vita del cliente all''acquisto
    o post (lead and prospect) e all''allocazione del portafoglio.


    **Organizzazione delle informazioni e gestione dei contatti:** attraverso CRM
    Contact tu puoi strutturare, reperire e monitorare informazioni all''utilizzo
    delle attività:


    - registrare i contatti

    - analizzare e selezionare la cliente

    - recuperare e organizzare informazioni relative alle aziende, associazioni, mercatati,
    testate gestionali

    - coordinare gli obiettivi di attività (invii, inviti, eventi) di newsletters,
    annual reports...


    **Gestione di Business Opportunity:** Il CRM gestisce in segnalazione di argomento
    tutti gli acquisti di opportunità di vendita up-sell o cross-sell su SACE o altri
    controparti.


    **Gestione delle Pipeline:** il sistema permette di gestire le trattative commerciali
    (Pipeline) consultando l''avanzamento (percentuale e stato). Le informazioni relative
    alle trattative sono organizzate in aree: operative del CRM; ''note book'' disponibili
    su solo un team referente.


    **Acquisizione Operativa e gestione dati Industriale:** il CRM è integrato con
    il sistema industriale al fine di acquisire per cliente i dati di sintesi delle
    relazioni SACE, domande, emissioni di garanzia, documenti dell''operato.


    **Campaign Management:** Sono state attivate funzionalità a supporto di Campagne
    commerciali con i riferimenti dei clienti o potenziali.


    **Reporting:** sono state predisposte funzionalità per elaborare report di sintesi
    o dettagliati da utilizzare nelle analisi di marketing del portafoglio clienti
    di SACE e a monitorare gli esecutivi, eventi, operazioni, pipeline.


    ## risultati


    Il 2006 è stato per Gruppo SACE un anno di crescita, coronato da risultati positivi:
    solo nel primo semestre, l''utile netto ha registrato 542,7 milioni di Euro, generando
    un incremento del 15% rispetto al 2005.


    Fattori determinanti della crescita sono stati anche i premi dei premi consolidati
    (123,3 milioni di Euro, +85% rispetto al 30 giugno 2005), il risultato di SACE
    nella gestione finanziaria (71,1 milioni di Euro).


    Nel 2006 Gruppo SACE ha assicurato operazioni per circa 16 miliardi di euro in
    tutto il mondo.


    ## SugarCRM


    La gestione del Cliente è il pieno intorno al quale è stata sviluppata la strategia
    commerciale dell''azienda, nel 2005-2006 ha individuato le informazioni aziendali
    ''patrimoniali''.

    Con la crescita dell''attività di SACE Spa sono emerse necessità di condividere
    le informazioni tra una gestione accurata del cliente e i rapporti con le persone
    di riferimento degli utenti.

    Al tempo stesso era essenziale disporre del pieno delle risorse impiegate nella
    Società e quindi adottare i migliori standard di qualità per migliorare la soddisfazione
    del cliente di ''giusta'' esperienza e aumentarne la fedeltà.

    Si rendeva dunque, necessaria l''implementazione di un sistema di Customer Relationship
    Management (CRM) come modello per gestire in modo univoco le relazioni con i Client
    (e potenziali) e tutte le informazioni disponibili sulle Aziende e Contparti,
    fino ad disperse in diverse aziende interne.


    Sono state, quindi, intraprese le azioni necessarie che hanno condotto la selezione
    della piattaforma SugarCRM per realizzare il CRM di SACE (Mediamand).


