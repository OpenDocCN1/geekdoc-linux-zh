    # Magnatune

    一个自由的选择；

    iTunes 一个昂贵的选择


    ## 终于，有一家理解互联网媒体分发的公司。JAMES LEES


    2007年4月2日，苹果公司的史蒂夫·乔布斯与 EMI 首席执行官埃里克·尼科共同宣布，以 12.99 美元的新价格提供无 DRM 下载——比目前的 DRM
    格式音乐贵了 30 美元。音乐难道不应该是无 DRM 的，而不是以 DRM 的代价出现吗？这并不是 iTunes 所说或展示的，不是吗？它仍然继续以 5.99
    美元出售 DRM 版本，并为所有人提供无 DRM 的音乐。为什么不忍受这些并非来自 iTunes 在线商店的高价歌曲呢？销售高价音乐的音乐，而且像 iTunes
    一样，带有束缚的音乐。


    iTunes 上新的无 DRM 歌曲将采用 MP3 和 WMA 格式。然而，提到超高音质仅仅是为了涵盖额外价格，并让 iTunes 免受英国公平贸易侵权的法的指控。你为什么要与一家让你为自由付钱的公司打交道？自由不是应该付钱的东西。既然你可以选择一个提供选项的在线商店，为什么要为自由付费呢？


    话虽如此，如果给你选择权，包括接收专辑的方式，是通过下载的无 DRM 格式（MP3, WAV, OGG, FLAC 或 AAC）还是邮寄给你的 CD，且都无需所谓的“免费音质”。该网站还让你选择你认为某个特定专辑的价值，并且如果你在故障硬盘上丢失了它或找错了文件，它提供了重新下载的选项。该网站还提供了在另一个设备上备份音乐的选项，且对存储音乐的设备数量没有限制——iTunes
    是不允许的，这也是我希望在购买音乐时能够做到的。而且，最棒的一点是能够分享专辑并将音乐送给朋友。如果你喜欢，可以轻松地与朋友分享（基于信誉系统）。


    我可以告诉你们的是关于 Magnatune 的一切，这家声称“我们并不邪恶”的公司，它只是不邪恶。Magnatune 提供上述所有内容以及更多。它不仅是一个独立的唱片公司，还是一家想要改变音乐分发方式，并为知名乐队和艺术家开启可能的公司。Magnatune
    上的艺术家和乐队的专辑或歌曲并没有进入前 100 强，但他们仍然可以免费流媒体和下载。Magnatune 只有一个顶级艺术家转而成为一家主流唱片公司。Magnatune
    正在付出巨大努力来签约声音出色的艺术家，每 300 名艺术家中就有一人被签约。


    ## Magnatune 的理念


    这些直接源自 Magnatune：


    - 所有的音乐必须是可共享的。就像软件一样，你希望在购买过程中预览、评估和传递良好的音乐。

    - 找到一种能够支持音乐人的音乐触达观众的方法。否则，在当前只有超级热门歌曲才能赚钱的行体系下，音乐的多样性将继续遭受痛苦。

    - 音乐人需要控制权，并享受音乐发布的过程。艺术家的生活离革命已经非常近了（有些甚至已经处于革命中）。

    - 需要鼓励创意；“所有权利保留”的版权系统太严格了。支持知识共享的“保留权利”，它允许衍生品的创作、共享和非商业用途。


    ## 开源社区中的 Magnatune 及其为音乐和媒体构建的自由


    Magnatune 参与了 Linux 社区，允许你在不购买 Aktor 1.4.4 的情况下搜索并收听音乐目录。这种“免费购买”的哲学给了你机会不仅收听专辑中的一首歌，而是整张专辑。现在你为它付钱了——或者完全不付钱。Magnatune
    的搜索和购买功能让你将专辑放入播放器，而不是留在网站上，这太棒了，它让你轻松搜索 Magnatune 超过 500 种专辑。如果你喜欢你听到的，可以以 5
    美元（下载价格）下载，或者购买一张真正的 CD，或者授权我们的音乐用于商业用途。你将获得保护（来自 magnature.com），针对特定类型，如古典、电子、爵士和蓝调、金属金属和朋克。一旦购买完成，歌曲或专辑可以放入任何类型的播放器，例如
    iPod，Magnatune 让你支付其价值，起价为 5 美元，最高 18 美元（专辑的价格）。每首歌都可以以 5 美元购买，并可以多种格式下载。最棒的部分是，每张专辑销售的
    50% 直接给艺术家。


    Magnatune 的另一个很棒的地方是它的每日免费，与 iTunes 的每周免费相比。有些人听到“免费”这个词并认为可能存在问题或音质不好，但知道的人知道并非如此。Magnatune
    的每日免费优惠很棒，而且歌曲也可以收听且音质良好。但是，Magnatune 每天都在变化。我计划每天访问该网站，允许搜索其他类型：Magnatune 还加入了开源社区，该平台允许你在
    Second Life 中分享并收听音乐并结识。如果你是 Second Life 的成员，Magnatune 让你在游戏中听音乐支持艺术家而不是把钱放进唱片公司的口袋，或者你是每日免费的粉丝，如果你是艺术家并可能会购买一些曲目，Magnatune
    是一个值得去的地方；特别是如果你想进入音乐行业。Magnatune 还帮助艺术家获得利润（注意专辑至少有 40 分钟的音乐）；然后，你可以在亚马逊的开源媒体播放器上收听它们，同时根据
    Magnatune 的说法，如果你的专辑被接受就可以制作。所以，让我们忘记 iTunes，转向一个基于社区的具有良好商业模式的项目：


    ## 背后的商业模式


    除了 Second Life 社区和启动开源项目，Magnatune 拥有超过 1300 名粉丝的 MySpace。Magnatune 使用的另一种广告方法是
    YouTube。Magnatune 有一个 YouTube 页面，在写作时，包含了关于 Magnatune 信息的视频。你可以免费地在 Magnatune
    上反复观看。这些免费视频用于公司的市场营销，“关于 Magnatune 的消息令人兴奋。这正是将拯救当前音乐危机的创新。”——Lawrence Lessig，知识共享组织创始人兼主席，销售额的
    50% 归艺术家。


    ## 运行在开源之上


    Magnatune 不支持它，它运行在其之上。它的服务器运行 Linux、广泛使用的 HTTP 服务器 Apache 2，并使用 PHP 和 OpenSSL。Magnatune
    使用 MySQL 数据库来存储和记录信息，也用于主站搜索，例如搜索艺术家。当硬盘故障时，脚本会创建曲目列表和播放列表，节省他们通常为名字和标签需要花费的费用，同时你可以通过制作卡片或打印
    Magnatune 小海报并带回家来成为 Magnatune 营销团队的一部分。


    ## Magnatune 网站


    Magnatune 创始人 John Buckman 的想法是允许任何在做其他工作时听背景音乐的人（此时我正在听 Magnatune 的《Rocket City,
    Last Of The Seekers》），或者是发行量较少、在电影电视中使用以及在互联网演示中使用的音乐，而且许可合同是免版税的，如果项目成功，你就不需要付费。许可和使用音乐的成本取决于项目。我们使用网站上的每一项内容，并且比其他比行业标准低
    30% 的商业许可好得多。


    ## 结论


    目标受众从长远来看维持了 Magnatune 的业务。Magnatune 在业务上做得最好的方式之一是它为销售本身提供的商业许可。它让音乐存在。音乐不是 Magnatune
    赚钱的唯一方式。它还销售商品，如海报、服装和我们使用的物品。


    如果你是一个开源用户，想要在收听非主流音乐的同时支持艺术家而不是把钱进唱片公司的口袋，或者你是每日免费的粉丝，如果你是艺术家并可能会购买一些曲目，Magnatune
    是一个值得查看的地方；特别是如果你想尝试音乐行业。Magnatune 还帮助艺术家获得利润（注意专辑至少有 40 分钟的音乐）；然后，你可以在亚马逊的开源媒体播放器上收听它们，同时根据
    Magnatune 的说法，如果你的专辑被接受就可以制作。所以，让我们忘记 iTunes，转向一个具有良好商业模式的基于社区的项目：


