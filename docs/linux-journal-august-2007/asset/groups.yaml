  - "[PAGE 29]\n\n# COLUMNS\nWORK THE SHELL\n\n# 007's Favorite Game:\nBaccarat?\n\
    \nCreate a shell script to get a taste of Bond. James.\n\nDAVE TAYLOR\n\nI was\
    \ recently watching Casino Royale and thinking about the James Bond series, particularly\
    \ how Sean Connery was much more sophisticated than Daniel Craig. Connery was\
    \ more debonair, and one of the ways he demonstrated it by playing a mysterious\
    \ high-stakes game called Baccarat while surrounded by gorgeous women in Monte.\n\
    \n# Capturing the Basics of Baccarat\nThe first piece of the puzzle is pretty\
    \ straightforward—a shell function that returns a Baccarat value for a given sequence\
    \ of cards (integer 1–52).\n\nWell, I can't create a casino as a shell script,\
    \ and I certainly can't either a secret agent or a gorgeous female sidekick.\n\
    \n```\nfunction handleValue {\n  integer handleValue=0 # initialize\n  for cardvalue\n\
    \    if ($ cardvalue -ge 0 ) then\n      rankvalue=$($cardvalue % 13)\n      case\
    \ rankvalue\n        [0-1][12]) rankvalue=0;\n        11) rankvalue=11;\n    \
    \  esac\n```\n\nWell, I can't create a casino as a shell script, and I certainly\
    \ can't create a secret agent or create a Baccarat game as a shell script. It's\
    \ probably the first time I've ever attempted it.\n\n```\nhandleValue=$($ handleValue\
    \ + $cardvalue)\ndone\nnhandle=$($ handleValue % 10)\n```\n\nIf you were a faithful\
    \ reader of this column since the beginning, you'll know that two years ago we\
    \ started by writing a Baccarat game as a shell script. It was a long-awaited\
    \ affair (it didn't just say, did it?) as part of the project, we could manage\
    \ to simulate a deck of cards, \"shuffle\" (the cards that are, in quasi-random\
    \ order) and even convert a numeric 1–52 value into a suit and rank.\n\nThis function\
    \ makes it easy to calculate the value of a Baccarat game—whether it will two\
    \ or three cards. Here's a typical invocation:\n\nWe'll use the starting point\
    \ for creating our Baccarat game, so we solve the complicated rules.\n\n```\n\
    handleValue($($player[2]))\n```\n\n# The Basics of Baccarat\naccarat has been\
    \ around since the mid-1400s, and the version you'll be seeing today differs.\
    \ Baccarat is completely ruled with no skill involved. Two cards are dealt to\
    \ the player and bank, and depending on those cards, a third might be dealt or\
    \ not.\n\nThe result is the global handlevalue, which is calculated by summing\
    \ the individual rankvalue of each card.\nDealing the cards starts by initializing:\n\
    \nFaces are zero, and numeric cards are worth their value. If the value of a hand\
    \ exceeds 9, subtract 10. The higher point value wins, and if it's identical,\
    \ it's a tie.\n\n```\ninitialize\nshuffledeck\n```\n\nFor example, if the hand\
    \ is a 7 + 3 and a six, then that's zero (7 + 3 + 10 = 0). If 65 and 2 is better;\
    \ then it's 8. And, if 9 + 3 + 1 + 2 is 7, the best hand wins, or it ties.\n\n\
    Then, here're actually dealing out the cards from\ndeck out to the player and\
    \ bank\n\nIf either the player or bank have 8 or 9 points, no further cards are\
    \ dealt to either, and the game ends with the dealer or bank winning or in a tie.\n\
    \n```\nplayer[1]=$(deck[2])\nplayer[2]=$(deck[3])\nnextcard=3\n```\n\nThe player\
    \ has an initial value of 0–5 points, the player can draw one additional card\n\
    The bank's play is so complicated that I'll defer explaining it until next time.\
    \ For now, let's look at how to code these rules of Baccarat.\nReady, Mr Taylor?\n\
    \n```\ndealer[1]=$(deck[2])\n```\n\n28 | august 2007 | www.linuxjournal.com"
