- md: "\nalready it and this is my only public address. This computer has two network\
    \ interfaces. The first one is connected to my modem and has a public address.\
    \ The other interface is connected to my LAN and has the IP address 192.168.1.1.\
    \ Another way to accomplish this is to use a consumer-grade/DSL router and forward\
    \ port 8000 to the streaming computer's IP address.\n\nOnce the configuration\
    \ file is all ready, you can start icecast by running the init script, /etc/init/icecast.\
    \ If there are any errors during setup, look in the log files to debug them.\n\
    \nFigure 2 shows a diagram of my network, including the server, encoder, streamer\
    \ and mobile devices.\n\n# Icecast Configuration\n\nMy streaming computer is running\
    \ Mandriva. Icecast is available from Mandriva repositories. Once that is ready,\
    \ installing icecast is as easy as typing `icecast` from the prompt. If you install\
    \ from source, download the latest release from the Ice Web site (Sources). Simply\
    \ click the download link, extract the archive, and run the familiar commands:\
    \ `./configure; make install`\n\nMy encoding computer is also running Mandriva.\
    \ Because this machine is at 233MHz with 64MB of RAM, I decided to do a minimal\
    \ install and leave off window manager. Icecast is also available from the contrib\
    \ repository. So again, typing icecast is still easy to install. However, you\
    \ can download the latest releases from the Ice Web site (Sources) Make sure you\
    \ use the 2.0 series if you want to use it. Once installed, you have to extract\
    \ the archive and run `./configure; make install` to get everything installed.\n\
    \nThe limits allow you to set the maximum number of stream sources (encoders)\
    \ and the maximum number of clients allowed to stream at once. On data rate I\
    \ need to limit the maximum number of clients to ensure that I don't use all of\
    \ your bandwidth.\n\nThe configuration files are all located in /etc/icecast.\
    \ It is strictly required to edit them before icecast is installed. The details\
    \ of the configuration file have some settings that require an initial setup,\
    \ so that icecast runs in the foreground and saves messages to the console. These\
    \ messages can be very helpful in debugging problems during setup. Everything\
    \ is set up and running, make sure Icecast runs in the background logs.\n\n```\n\
    <limits>\n  <clients>30</clients>\n  <sources>2</sources>\n</limits>\n```\n\n\
    ```\n<authentication>\n  <source-password>hacker</source-password>\n  <relay-password>hacker</relay-password>\n\
    \  <admin-password>admin</admin-password>\n  <admin-password>hacker</admin-password>\n\
    </authentication>\n```\n\nThe authentication section is where you specify the\
    \ user names and passwords. The source-password is used by the encoding when it\
    \ connects. The relay-password is used by relays, which I am not using in configuration.\
    \ The admin-user password allows access to the Web interface. It is important\
    \ to change all passwords from the default security:\n\nThe hostname is what Icecast\
    \ knows to append to the beginning of the links on the Web page:\n\n```\n<hostname>example.com</hostname>\n\
    ```\n\nThe listen-socket allows you to set the port which Icecast listens; 8000\
    \ is the default:\n\n```\n<listen-socket>\n  <port>8000</port>\n</listen-socket>\n\
    ```\n\n# Mini-ITX Solutions & for Embedded Applications, Industrial & Mobile Computing.\n\
    \nMini-ITX Mainboards\n\nwith VIA, Intel, or AMD processors.\n\n- x86 processor\n\
    - small factor design\n- Linux and Windows XP compatible\n- fully customizable\
    \ systems\n\nFanless Mini-ITX Systems\n\nUtilizing heat technology, fanless Mini-ITX\
    \ PCs offer durability, silence, and power-efficiency for a range of embedded\
    \ applications in remote environments.\n\n![](img/1234e63edf27cb1f15e6071bce50485a_86_0.png)\n\
    \nLOGICSUPPLY.COM\ninfo@logicsupply.com\n222 844 8302\n\nwww.linuxjournal.com\
    \ august 2007 | 85\n\n# DEPTH\n\n# Icecast is a media streaming platform that\
    \ supports Ogg Vorbis or MP3 streams.\n\nBecause I want to encode audio, I used\
    \ the oss module. Don't be alarmed if you use the LASA sound system instead of\
    \ OSS. LASA has OSS compatibility, this module works with both LASA and OSS. Use\
    \ the device parameter to specify the sound device to get data. In most systems\
    \ it will be /dev/dsp. The rate parameter specifies the sample rate of the data\
    \ in herz. Most systems use 44100. Use the channels parameter to specify the number\
    \ of channels available for capture. For most systems it will be 2 (stereo)\n\n\
    messages to a file:\n\n```\n<background>\n<log path=/var/log/ices</path>\n<logfile>ices.log</logfile>\n\
    <level>info</level>\n<console>debug</console>\n</background>\n```\n\nThe rest\
    \ of the file is under this section. If you configure settings specific to this\
    \ particular area stream, the metadata section is where you provide specific information\
    \ about the stream. This information will be displayed on the Icecast page:\n\n\
    ```\n<metadata>\n<name>IceWrz 146.89 MHz</name>\n<genre>live</genre>\n<description>live\
    \ feed of the</description>\n<description>repeater=</description>\n</metadata>\n\
    ```\n\nThe instance allows you to specify the number of instances. You might have\
    \ more than one instance if you want to send the stream to more than one server,\
    \ or if you want to have different versions of the stream at different bitrates.\
    \ For example, if you want only one instance: the instance section is where you\
    \ specify the streaming information. The hostname tells where to send the data.\
    \ The port and password must match the values you specify in the icecast file.\
    \ The mount option specifies what the name of the stream will be. The input section\
    \ is the place where the audio actually comes from. There are many possibilities,\
    \ including the encoder section specifies how the audio will be encoded. The easy\
    \ way is to set the sample rate and channels to make messages to a file. I incrementally\
    \ decreased the sample rate until I found the lowest acceptable quality audio:\
    \ 44100Hz.\n\n![](img/1234e63edf27cb1f15e6071bce50485a_87_0.png) Icecast Settings\
    \ and Bitrates\n\n| QUALITY | SAMPLE RATE | CHANNELS | BITRATE |\n|---|---|---|---|\n\
    | Low-Quality Talk Radio | 0 | 44100 | 1 | 20Kbps |\n| Medium-Quality Talk Radio\
    \ | 2 | 44100 | 1 | 30Kbps |\n| Low-Quality Music | 0 | 44100 | 2 | 56Kbps |\n\
    | Medium-Quality Music | 2 | 44100 | 2 | 84Kbps |\n| High-Quality Music | 4 |\
    \ 44100 | 2 | 132Kbps |\n\naugust 2007 www.linuxjournal.org section above. But\
    \ I didn't need that quality for my stream. So, I used the downmix and resample\
    \ sections to tell resample to 44100Hz and downmix to 1 channel (mono). There\
    \ are two options you can use to adjust the final bitrate of the stream: quality\
    \ and nominal-rate. Notice that I commented out-bitrate and quality to 2:\n\n\
    ```\n<instance>\n<hostname>192.168.1.1</hostname>\n<port>8000</port>\n<password>hacker</password>\n\
    <mount>/stream.ogg</mount>\n</instance>\n\n<encode>\n<quality>2</quality>\n<bitrate>32000</bitrate>\n\
    <sample>44100</sample>\n<channels>1</channels>\n</encode>\n\n<downmix>1</downmix>\n\
    <resample>\n<in-rate>44100</in-rate>\n<out-rate>44100</out-rate>\n</resample>\n\
    ```\n\n![](img/1234e63edf27cb1f15e6071bce50485a_88_0.png) Figure 4. Alsamixer\n\
    \nNow that the audio was loud enough, I still had another problem. The audio sounded\
    \ choppy. After looking for a while, I realized that processor usage was at 100%.\
    \ I tried to reduce the bitrate by changing the quality of the nominal-rate. With\
    \ the bitrate set sufficiently low, the audio sounded good. I used 32kbps encoder.\
    \ When the audio sounded good, my goal was to lower the bitrate as much as possible\
    \ while keeping an acceptable level of audio. In my case, an \"acceptable level\"\
    \ is low traffic. The sample rate is the only one, because it is illegal to transmit\
    \ in mode. Three aspects of the encoded audio affect its quality and bitrate:\
    \ number of channels, the sample rate, and the quality. Instead of setting the\
    \ bitrate with the nominal-rate, I used the quality. The quality setting directly\
    \ affects the final bitrate. With a few tries, quality level of 2. With final\
    \ settings, the bitrate stays around 30Kbps, and the processor around 40%.\n\n\
    Once the configuration was ready, make sure it has permission to access the audio\
    \ device through /dev/audio. Icecast creates an audio group, which owns the /dev/audio.\
    \ It creates a user and group when it is installed. I added myself as a member\
    \ of the audio group in /etc/groups file by editing the audio group:\n\n```\n\
    audio:x\n```\n\nFinally, you can start the service by running: /etc/init.d start.\
    \ If there are any error during startup, check the log files to debug them. This\
    \ will be helpful to check the log files on your streaming computer to debug problems.\n\
    \nEverything is up and running, you can check the audio status by checking the\
    \ report you see in the configuration file. Figure 3 shows an example of the loaded\
    \ status page. Click on List to launch your audio player.\n\n# Conclusion\n\n\
    There are many other applications where this type of system would be useful. Keep\
    \ in mind, for streaming music, if you are interested in this type of system,\
    \ thanks from the authors and readers mentioned.\n\nThis combination of source\
    \ projects worked well. Setting up everything was simple. I spent most of my time\
    \ tweaking the quality and sample rate. The traffic on my network was low, so\
    \ I had only one or two connections. But let to be honest, it is a little of my\
    \ way of participating in the audio community.\n\n# Fine-Tuning\n\nOnce I had\
    \ set up and running, I spent a amount of time fine-tuning the audio. The first\
    \ thing I found was that the audio quality was quite low. When I wanted to turn\
    \ up the audio level I used mixer. But I installed a window mixer on my computer.\
    \ I used ALSA for the sound, and I found that using alsa-based mixer was better.\
    \ Alsamixer allows you to use the arrow keys to change settings. Figure 4 shows\
    \ the settings I chose for my kind. My final preference was to have the Master\
    \ and PCM both at 100%. I also chose to mute everything else, because I knew they\
    \ would not be in use.\n\n> Brian Mackey is a Software Engineer at Secure Electronics\
    \ in Sioux Falls, Dakota. He is an adjunct professor at Colorado University Technical.\n\
    \n# Resources\n\nIcecast Web: www.icecast.org\n\nIces Web: www.icecast.org/ices.php\n\
    \nLivebox Web: www.web.ac.uk/~software/livelive/html\n"
  mdcn: "\n已经设置好了，这是我唯一的公地址。这台电脑有两个网络接口。第一个连接到我的调制解调器并有一个公地址。另一个接口连接到我的局域网（LAN），IP\
    \ 地址为 192.168.1.1。实现此点的另一种方法是使用消费级/DSL 路由器并将端口 8000 转发到流媒体电脑的 IP 地址。\n\n一旦配置文件准备就绪，你就可以运行初始化脚本\
    \ `/etc/init/icecast` 来启动 icecast。如果在设置过程中出现任何错误，请查看日志文件进行调试。\n\n图 2 显示了我的网络拓图，包括服务器、编码器、流媒体设备和移动设备。\n\
    \n# Icecast 配置\n\n我的流媒体电脑运行的是 Mandriva。Icecast 可以从 Mandriva 仓库获取。一旦准备就，只需在提示符中输入\
    \ `icecast` 即可轻松完成安装。如果你从源码安装，请从 Ice 网站（Sources）下载最新版本。只需点击下载链接，解压归包，并运行熟悉的命令：`./configure;\
    \ make install`\n\n我的编码电脑也运行 Mandriva。由于这台机器的频率为 233MHz 且拥有 64MB RAM，我决定进行最小化安装并省略窗口管理器。Icecast\
    \ 也可以从 contrib 仓库获取。因此，再次输入 `icecast` 仍然很容易安装。不过，你可以从 Ice 网站（Sources）下载最新发布版本。如果你想使用它，请确保使用\
    \ 2.0 系列。安装后，你必须解压归包并运行 `./configure; make install` 来完成所有安装。\n\n`limits` 允许你设置最大流源（编码器）数量以及允许同时流的客户端最大数量。在数据速率方面，我需要限制最大客户端数量以确保我不会占用你所有的带宽。\n\
    \n配置文件都位于 `/etc/icecast`。在安装 icecast 之前，必须严格编辑它们。配置文件的详细信息包含一些需要初始设置的选项，以便 icecast\
    \ 在前台运行并将消息保存到控制台。这些消息对于设置期间的调试问题非常有帮助。当一切设置好并运行后，请确保 Icecast 在后台日志中运行。\n\n```\n\
    <limits>\n  <clients>30</clients>\n  <sources>2</sources>\n</limits>\n```\n\n\
    ```\n<authentication>\n  <source-password>hacker</source-password>\n  <relay-password>hacker</relay-password>\n\
    \  <admin-password>admin</admin-password>\n  <admin-password>hacker</admin-password>\n\
    </authentication>\n```\n\n`authentication` 部分是你指定用户名和密码的地方。`source-password` 用于编码器在连接时使用。`relay-password`\
    \ 用于中继器，我在配置中没有使用它。`admin-user` 密码允许访问 Web 界面。更改所有默认安全密码非常重要：\n\n`hostname` 是\
    \ Icecast 已知要添加到网页链接开头的主机名：\n\n```\n<hostname>example.com</hostname>\n```\n\n\
    `listen-socket` 允许你设置 Icecast 监听的端口；8000 是默认值：\n\n```\n<listen-socket>\n  <port>8000</port>\n\
    </listen-socket>\n```\n\n# Mini-ITX 解决方案及嵌入、工业及移动计算应用\n\nMini-ITX 主板\n\n配备 VIA、Intel\
    \ 或 AMD 处理器。\n\n- x86 处理器\n- 小尺寸设计\n- 兼容 Linux 和 Windows XP\n- 全可定制系统\n\n无风扇 Mini-ITX\
    \ 系统\n\n利用散热技术，无风扇 Mini-ITX PC 为远程环境中的各种嵌入式应用提供了耐用性、静和高效。\n\n![](img/1234e63edf27cb1f15e6071bce50485a_86_0.png)\n\
    \nLOGICSUPPLY.COM\ninfo@logicsupply.com\n222 844 8302\n\nwww.linuxjournal.com\
    \ 2007年8月 | 85\n\n# 深度\n\n# Icecast 是支持 Ogg Vorbis 或 MP3 流的媒体流平台。\n\n由于我想编码音频，我使用了\
    \ oss 模块。如果你使用的是 LASA 声音系统而不是 OSS，请不要惊讶。LASA 具有 OSS 兼容性，此模块同时兼容 LASA 和 OSS。使用\
    \ `device` 参数来指定获取数据的音频设备。在大多数系统中，它将是 `/dev/dsp`。`rate` 参数以赫兹（Hz）指定数据的采样率。大多数系统使用\
    \ 44100。使用 `channels` 参数来指定可采集的通道数。对于大多数系统，它将是 2（立体声）。\n\n消息到文件：\n\n```\n<background>\n\
    <log path=/var/log/ices</path>\n<logfile>ices.log</logfile>\n<level>info</level>\n\
    <console>debug</console>\n</background>\n```\n\n文件的其余部分在此节下。如果你为该特定区域流配置了特定设置，`metadata`\
    \ 部分是你提供流流特定信息的地方。这些信息将显示在 Icecast 页面上：\n\n```\n<metadata>\n<name>IceWrz 146.89\
    \ MHz</name>\n<genre>live</genre>\n<description>live feed of the</description>\n\
    <description>repeater=</description>\n</metadata>\n```\n\n`instance` 允许你指定实例数量。如果你想将流发送到多个服务器，或者想以不同的比特率拥有不同版本的流，你可能有多个实例。例如，如果你只需要一个实例：`instance`\
    \ 部分是你指定流信息的地方。`hostname` 告诉向哪里发送数据。`port` 和 `password` 必须与 icecast 文件中的值匹配。`mount`\
    \ 选项指定流的名称。`input` 部分是音频来源。有许多可能性，`encoder` 部分指定音频将如何编码。简单的方法是设置 `rate` 和 `channels`\
    \ 将消息保存到文件。我逐渐减少采样率，直到找到可接受的音频质量：44100Hz。\n\n![](img/1234e63edf27cb1f15e6071bce50485a_87_0.png)\
    \ Icecast 设置与比特率\n\n| 质量 (QUALITY) | 采样率 (SAMPLE RATE) | 通道 (CHANNELS) | 比特率 (BITRATE)\
    \ |\n|---|---|---|---|\n| 低质量广播 | 0 | 44100 | 1 | 20Kbps |\n| 中质量广播 | 2 | 44100\
    \ | 1 | 30Kbps |\n| 低质量音乐 | 0 | 44100 | 2 | 56Kbps |\n| 中质量音乐 | 2 | 44100 | 2\
    \ | 84Kbps |\n| 高质量音乐 | 4 | 44100 | 2 | 132Kbps |\n\n2007年8月 www.linuxjournal.org\
    \ 上方的部分。但对于我的流，我不需要那个质量。所以我使用了 `downmix` 和 `resample` 部分并将 `resample` 设置为 44100Hz，downmix`\
    \ 为单通道（单声道）。有两个选项可以调整流的最终比特率：`quality` 和 `nominal-rate`。注意我注释掉了 `bitrate`并将 `quality`\
    \ 设置为 2：\n\n```\n<instance>\n<hostname>192.168.1.1</hostname>\n<port>8000</port>\n\
    <password>hacker</password>\n<mount>/stream.ogg</mount>\n</instance>\n\n<encode>\n\
    <quality>2</quality>\n<bitrate>32000</bitrate>\n<sample>44100</sample>\n<channels>1</channels>\n\
    </encode>\n\n<downmix>1</downmix>\n<resample>\n<in-rate>44100</in-rate>\n<out-rate>44100</out-rate>\n\
    </resample>\n```\n\n![](img/1234e63edf27cb1f15e6071bce50485a_88_0.png) 图 4. Alsamixer\n\
    \n现在声音足够大了，但我还有另一个问题。音频听起来断断续续。观察了一段时间后，我发现 CPU 使用率为 100%。我尝试通过更改 `nominal-rate`\
    \ 来降低比特率。当比特率设置得足够低时，音频听起来很好。我使用了 32kbps 编码器。当音频良好时，我的目标是在保持可接受音频水平的同时尽可能降低比特率。在我情况下，“可接受水平”是低流量。采样率是唯一的，因为在单声道模式下传输。影响编码音频质量和比特率有三个方面：通道数、采样率和质量。我没有通过\
    \ `nominal-rate` 设置比特率，而是使用了 `quality`。质量设置直接影响最终比特率。经过几次尝试，质量级别为 2。使用最终设置，比特率保持在\
    \ 30Kbps 左右，处理器占用约为 40%。\n\n一旦配置就绪，确保有权限通过 `/dev/audio` 访问音频设备。Icecast 创建了一个音频组，它拥有\
    \ `/dev/audio`。安装时它会创建一个用户和组。我通过编辑 `/etc/groups` 文件将自己添加音频组成员：\n\n```\naudio:x\n\
    ```\n\n最后，你可以运行 `/etc/init.d start` 来启动服务。启动期间出现任何错误，请检查日志进行调试。这对于检查流媒体电脑上的日志以调试问题非常有帮助。\n\
    \n一切都已运行，你可以通过检查配置文件中的报告来检查音频状态。图 3 显示了加载状态页示例。点击“列表”启动你的音频播放器。\n\n# 结论\n\n在许多其他地方这种系统都会有用。请记住，对于音乐流媒体，如果你对这种系统感兴趣，感谢提到的作者和读者。\n\
    \n这些源项目的组合效果良好。设置一切非常简单。我花费了大部分时间在调整质量和采样率上。我的网络流量很低，所以我只有一个或两个连接。但说实话，这是我参与音频社区的方式之一。\n\
    \n# 微调\n\n一旦设置好并运行，我花费了一些时间微调音频。我发现的第一点是音频质量很低。当我想提高音量时，我使用了 `mixer`。但我的电脑上安装了一个窗口混合器。我使用\
    \ ALSA 处理声音，发现使用基于 alsa 的混合器更好。Alsamixer 允许你使用方向键更改设置。图 4 显示了我为我的类型选择的设置。我的最终偏好是让\
    \ Master 和 PCM 都处于 100%。我也选择了静音其他所有，因为我知道它们不会被使用。\n\n> Brian Mackey 是南达科他州苏福斯\
    \ Secure Electronics 的软件工程师。他是科罗拉多技术大学的兼职教授。\n\n# 资源\n\nIcecast Web: www.icecast.org\n\
    \nIces Web: www.icecast.org/ices.php\n\nLivebox Web: www.web.ac.uk/~software/livelive/html\n\
    \n"
