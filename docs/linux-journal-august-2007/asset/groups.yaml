    done\nand=$($ handleValue % 10)\n```\n\n如果你是专栏的忠实读者，你会知道几年前我们开始编写百家乐游戏脚本了。这是一个期待已久的事情（难道不是吗？）。作为项目的一部分，我们可以管理一副牌，“洗牌”（牌是准随机顺序的）并将\
    \ 1–52 的数值转换为点数。\n\n这个函数可以轻松计算百家乐的值——无论是两张还是三张牌。这是一个典型的调用：\n\n```\nhandleValue($player[2]))\n\
    ```\n\n### 百家乐的基础\n百家乐自 1400 年代中期以来一直存在，今天的版本与之有所不同。百家乐完全由规则决定，不涉及技巧。给玩家分发两张牌，根据这些牌，可能会分发第三张。\n\
    \n结果是全局 handlevalue，它通过累加每张牌的点数计算得出。发牌开始时初始化：\n\n点数等于数值。如果手牌点值超过 9，则减去 10。点值高的胜，如果相等，则平局。\n\
