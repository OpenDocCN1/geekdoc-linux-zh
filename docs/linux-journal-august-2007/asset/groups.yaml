    # diff -u


    Linus Torvalds 最近表示，Macmeusch 和 Nigel Cunningham 之间软件争论的可能性已经结束。新的竞争者已经出现并取而代之。


    没有他们，研究进入内核的可能性将大大减少。许多相对较大的问题被包含在内，关键开发者对这些问题进行了审查以理解这些问题。


    # 内核开发新动态


    被“误误了”的 Linus 表示，任何一个项目都可以取得成功。他表示，不需要同一个人介入并将整个概念带入新的实体中。每个人都可能尝试通过接受补丁来启动某些审查流程，这比提交给
    Linus 的频率是其三倍。这可能会产生一批新的武装开发者，并促使他们更仔细地查看代码。但对于 Andrew Taeke 来说，这也是一个困难的措施。


    此外，Linus 本人也关注新的开发问题，而不是用户空间的问题。如果他找到了解决方案，将将其并入内核。


    可能需要维护者对某些问题进行某种审查，以防止冲突数量的增加。作为维护者之一，Edward Shishan 表示，他在离职前需要志愿者的帮助。


    Linus 本人也关注开发问题，许多人告诉他事情是疯狂的。当这种情况发生时，人们会侮辱 Linus 周甚至几个月，而他一直在解释。每当他达到一个点时，会有更多的人急于撤销内核。


    通常当问题公开时，讨论将围绕它展开，许多人对此感兴趣。新旧开发者似乎很有趣，但也许这组审查者将提供便利。


