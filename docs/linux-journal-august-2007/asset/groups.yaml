    # 仿佛似曾相识，但分辨率更高


    最酷的 Linux 和开源应用程序可能就是你已经拥有的那些。


    MARCEL GAGNÉ


    ## 我使用的照片管理程序之一，也是最优秀的程序之一：digikam。


    朋友们，我们该如何确保磁盘空间够用呢？上周，我们留下的磁盘空间足够用到下一个十年。发生了什么？不，我的朋友，我没太听懂你的意思。我只是好奇你是否有什么主意。我只是回来了一小会儿——让我说一句，天呐（Mon
    Dieu）！朋友们，我曾尝试过成千上万个源码包，但现在你们不需要下载 SourceForge 上的每一个应用程序了。我也在这里；我想看到底哪一个最酷！不过，我们以后会再谈论这个。现在，我们的客人们呢？他们现在应该到齐了。


    digikam 是一个完整的数字照片管理系统。使用 digikam，你可以创建集合并按日期、类型等将你的照片*组织*到可搜索的相册中（图 1）。从相机中选择并下载图像是一件很有趣的事。你可以添加标签、修复光线、消除红眼并移动它们。Digikam
    拥有你照片管理系统所需的所有功能，还有一些额外功能让它在酷炫程度上更胜。


    朋友们看！Linux 和开源软件拥有一直以来最优秀的工具，服务着最伟大的群体。你们的侍者正在等候，请自便，你们忠实的侍者会去上酒。来吧，我的朋友。我想 2002
    年的《Video de las Vie Triumph》将让我们所有的客人满意。桌子已经准备好了，多年来非常不寻。饮吧，享受吧！


    如你从图 1 所示，digikam 会按日期自动组织照片，但还有其他视图。例如按命名标签。比如，如果你有几百地方，你可以为所有照片分配一个“旅行”标签，然后找到那些关于罗马的照片。下次你想看它们时，只需点击该标签即可。如果其中一张图像看起来是你想要和朋友分享的，选择图像，点击菜单栏上的“图像”、“通过电子邮件发送图像”，就会弹出一个对话框，允许你向邮件中添加更多图像。


    在我们等待时，让我们看看酷应用程序的哪个一点。你不需要在互联网上花费几个小时寻找最酷的软件，只需花点时间探索你已经拥有的应用程序，你就会发现本并不存在的奇迹，就在你面前。说起我忠实的侍者，他在这里了，朋友们会为我们的客人上酒。你会享受第一口水的，我的朋友们，请让我提醒你一个程序你——


    拥有大量图像会有问题，但如果你像我一样，必须多次拷贝你的照片，那么 digikam 具有一个很酷的功能可以让你复制图像。只需点击菜单栏上的“工具”，然后选择“查找
    Digikam 图像”。


    说到制作幻灯片，你想创建一个 MPEG 幻灯片——你的照片电影吗？是的，digikam 也能这样做。选择一组图像，点击菜单栏，选择“幻灯片”。幻灯片（图 2）向你展示如何选择幻灯片的图像时间、淡入时间（如果你需要的话）、视频输出格式等。你还可以组织图片出现的顺序，甚至编辑列表。


    你可以用 digikam 做很多事情，这将让你根据自己的意愿进行探索（起初），但在继续之前，我想再分享一张酷酷的照片！在圣诞节，与全家人分享照片并不稀奇。使用
    digikam，你只需一步即可实现。如何从你的选择中挑选出精美的颜色创建一个一年的日历？


