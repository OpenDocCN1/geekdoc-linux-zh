    \n![](img/1234e63edf27cb1f15e6071bce50485a_44_0.png)\n\n# CREATE A LINUX VPN for\
    \ a Nokia E61 with Openswan\n\n## Create a virtual private network between your\
    \ Nokia E61/phone and a Linux gateway. Ben Martin\n\nA VIRTUAL PRIVATE NETWORK\
    \ (VPN) allows you to send traffic across an untrusted network without exposing\
    \ the content of traffic. Conceptually, this is by creating a pipe between two\
    \ hosts where all traffic is encrypted. This example shows connecting a Nokia\
    \ E61 device to a home network through a VPN over the Internet. The Nokia E61\
    \ uses IP security (IPSec), a smartphone that has Wi-Fi support as well as a VPN.\
    \ Similar procedure might work for other models using the same VPN client software,\
    \ though the hardware was not tested for this.\n\nThe VPN support on the Nokia\
    \ E61 uses IP security (IPSec). Openswan is the IPS server that is configured\
    \ on the Linux machine to provide the other end of the virtual network.\n\nA simple\
    \ setup up front: I've been unable to configure the VPN client on the Nokia to\
    \ connect to a server that does not have a static IP address.\n\nTo keep notation\
    \ simple, refer to the e61 and the running server as VPN IP address. The IP address\
    \ of the e61 is irrelevant to the article, as you will likely be moving around\
    \ to different Wi-Fi hotspots with the phone. When a VPN is set up, the e61 gets\
    \ another IP address, which the e61 refers as the virtual IP address. The address\
    \ of the VPN is up, which is what you use to access the internet. In this article,\
    \ I used 192.168.x.x IP address for the VPN address. The non-VPN IP address of\
    \ the e61 is most relevant, unless I explicitly mention here, the e61 IP address\
    \ will be the non-routable IP address.\n\nUnlike the other settings on the phone,\
    \ you cannot configure it using the e61 itself. You have to create a package containing\
    \ all the information about the VPN and install that package on the phone. The\
    \ packages are SIS files. A VPN SIS file must also be digitally signed before\
    \ the e61 allows you to install it. Signed files have no extension. The most difficult\
    \ part of setting up the e61 to talk to Openswan is in creating the SIS file to.\n\
    \nThe SIS file must be digitally signed, even if you have the configuration parameter\
    \ Software to install in All App Mgr/Options/Settings.\n\n![](img/1234e63edf27cb1f15e6071bce50485a_45_0.png)\n\
    \n# The Contents of the ssix Package\n\nThe ssix package is composed of three\
    \ files. Two of those are boilerplate-type package metadata files (.vpn and .vpn.pkg).\n\
    \nGetting the boilerplate files out of the way, the .vpn file is mostly unnecessary\
    \ and shown in List 1, and the .vpn.pkg file is shown in List 2. Both work without\
    \ any changes. Note that the paths in List 2 are to refer to the phone itself\
    \ and should not be changed.\n\npassword in the last field: the KEY. This is the\
    \ string length of the key after a space.\n\nIF USE_AUTH is true, when establishing\
    \ the VPN connection the e61 prompts you for a user name and password to connect.\
    \ This provides an additional level of security. If the password is stolen, the\
