    After an SPH region is initialized, we have an empty region with one segment (backing
    file in the store directory) and one (the anchor block) allocated from that. The
    various lists have initialized to describe this state. For example, the region
    free used list contains entries for the unallocated (backing file) and allocated
    portions of the anchor block is used. The "uncommitted" list contains entries
    for the currently used portions of the first, and the free list is empty. We are
    ready to allocate more blocks.


    # The Lock Manager


    We use a hash-table manager using the virtual address ID. Addresses of data within
    SPH are unique, and active locks can be found in a hash table.

    Storage for the lock blocks has to be shared but persistent, so the memory is
    allocated for the lock table with a header and anchor, which is used to allocate
    the lock table hash list and allocated and thread blocks waiting on contended
    locks.


    # Utility Objects


    So far we have blocks of shared persistent region and an address-backed lock manager.
    Blocks are suitable for using large arrays but awkward to keep track of complex
    structures, such as lists and trees. The SPH regions utilize utility objects that
    allocate and manage allocations and deallocations.

    Utility objects use a block and header for internal allocation (using the anchor
    block). The signatures are used, but each object has a unique type. The values
    define a simple type system for runtime checks. The signatures are stored in the
    header of the object to prevent the interpretation of a block as address. This
    is to support the new-value scheme.

    The simplest utility object is SPHSimple. The SimpleHeap is a block and header.
    A CompoundSimple is a heap manager for SPHaps. Each CompoundSimple can expand
    another CompoundSimple, this "new-mechanism" is useful for maintaining location
    of reference for complex structures.

