    # 使用 Openswan 为 Nokia E61 创建 Linux VPN


    ## 在你的 Nokia E61/手机与 Linux 网关之间建立虚拟专用网络。Ben Martin


    虚拟专用网络（VPN）允许你在不可信的网络上发送流量，而不暴露流量内容。从概念上讲，这是通过在两个主机之间创建一个所有流量都加密的管道来实现的。此示例展示了如何通过互联网
    VPN 将 Nokia E61 设备连接到家庭网络。Nokia E61 使用 IP 安全（IPSec），这是一款支持 Wi-Fi 和 VPN 的智能手机。类似的程序对使用相同
    VPN 客户端软件的其他型号可能有效，尽管未对这些硬件进行测试。


    Nokia E61 上的 VPN 支持使用 IP 安全（IPSec）。Openswan 是配置在 Linux 机器上的 IPS 服务器，用于提供虚拟网络的另一端。


    先说明一个简单的设置：我无法在 Nokia 上配置 VPN 客户端以连接到没有静态 IP 地址的服务器。


    为了保持符号简单，请将 e61 和运行的服务器称为 VPN IP 地址。e61 的 IP 地址与本文无关，因为你可能会带着手机移动到不同的 Wi-Fi 热点。当设置好
    VPN 后，e61 会获得另一个 IP 地址，e61 将其称为虚拟 IP 地址。VPN 的地址已上线，这就是你访问互联网的地址。在本文，我使用 192.168.x.x
    IP 地址作为 VPN 地址。e61 的非 VPN 地址最相关，除非我在此明确提到，否则 e61 IP 地址将是不可路由的 IP 地址。


    与手机上的其他设置不同，你无法通过 e61 本身来配置它。你必须创建一个包含所有 VPN 信息的包并将该包安装在手机上。这些包是 SIS 文件。VPN SIS
    文件在 e61 允许你安装之前还必须经过数字签名。签名后的文件没有扩展名。设置 e61 与 Openswan 通信最困难的部分在于创建 SIS 文件。


    即使你在 All App Mgr/Options/Settings 中有要安装的 Software 配置参数，SIS 文件也必须经过数字签名。


    ![](img/1234e63edf27cb1f15e6071bce50485a_45_0.png)


