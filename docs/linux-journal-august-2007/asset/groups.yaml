    \n  <popup id=\"contentAreaContextMenu\">\n    <menuitem id=\"context-iconic\"\
    \n      id=\"picnic-ct-ext\"\n      inserter=\"context-image\"\n      label=\"\
    &picnik.edit_picture.\"\n      oncommand=\"picnik.edit(this)\"\n      image=\"\
    chrome://picnik/picnik_i16.png\" />\n    </menuitem>\n  </popup>\n```\n\n我们是。其中一个主要部分是在\
    \ DTD（文档类型定义）文件中将 UI 字符串化的能力。在 Chrome 中，`firefox.xmlOverlay` 使用代码行中的字符串。\n\n本地化\
    \ URL 是特殊的，因为浏览器会自动将它们映射到扩展程序中的正确位置。Firefox 会自动为美国英语用户扩展 `chrome://linuxjournal/locale/linuxjournal.dtd/locale/linuxjournal-US.linuxjournal.dtd`。\n\
    \nDTD 用于定义新的 XML 实体，这些实体可以被视为。我们的 DTD 如下：\n\n```xml\n<ENTITY linuxjournal.label\
