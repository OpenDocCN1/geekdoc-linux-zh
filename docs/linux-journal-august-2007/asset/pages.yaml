  md: "only when it deviates from that. In Django assumes that you want to make everything\
    \ explicit.\n\nAmong the things that you need to make explicit is the way in which\
    \ URLs are translated into method. The Django system for doing this is URLConf,\
    \ and it is a set of regular expressions for the entire project. (It functions\
    \ like routes in Rails.) If you are familiar with regular expressions, it should\
    \ be pretty easy to add or modify URLs.\n\nFor example, let's say we want /blog/\
    \ to to our blog application. We would use the URLConf, while the view might be\
    \ in myurls.py. (We already added administrative capabilities to Django site.)\
    \ We then add a line that looks like this\n\n```\nr`blog/$. mysite.blog.views.index\n\
    ```\n\nIn other systems, if we see a URL with blog and ends with /, it should\
    \ invoke the method views within our application. For example, as soon as we use\
    \ Django to link, we can reload our browser, and see \"Hello, World! Our Django\
    \ application is starting to come together.\n\n# More Complex URLs\n\nThings are\
    \ not that difficult if we have a single method and it always does the same thing.\
    \ For a blog application, we'd probably be wanting to handle a particular posting,\
    \ or on a particular day. And then we need to get into the model for our blog\
    \ application and realize what this means we need to be able to query blog by\
    \ an individual ID or by date.\n\nOur current design does not handle such situations.\
    \ Django requires that we explicitly define each URL that a user might request\
    \ and how that URL should be handled. Although we have taken care of blog/, we\
    \ need to handle URLs such as:\n\n```\nr`blog/(?P<id>\\d+)/`. mysite.blog.views.one_posting\"\
    \n```\n\nHere we see a bit different thing, namely the use of capturing parameters,\
    \ with ?P and names inside angle brackets. We tell the URLConf that we receive\
    \ a URL that looks like /blog/NUMBER, with one more digits, which will invoke\
    \ one_posting. Because we have captured the digits (<id>, in regular) with\n\n\
    the name post_id, one_posting is invoked with an additional parameter of post_id.\n\
    \nIn other words, once we've modified urls.py to include the above map, we can\
    \ go back to views.py and say the following:\n\n```\ndef view_one_posting(request,\
    \ post_id):\n    return HttpResponse(\"You asked for '%s\" %% post_id)\n```\n\n\
    Then, we can get to http://69.55.23.8800/blog/5, and in our browser, we get the\
    \ following:\n\nYou asked for post '$id'\n\nNotice in the view, one_posting, method\
    \ we use to render post_id, rather than %s (the integers). Django passes parameters\
    \ from URL as strings, rather than other data types. We could, of course, get\
    \ around by converting the string to an integer, but for our purposes this is\
    \ enough.\n\nPerhaps we hits this application, but each in our method just happens\
    \ to be to the user's view. We can use any of Python libraries that we want, and\
    \ access databases, files and remote controllers. As long as the output is a legitimate\
    \ HTTP response, the application that we are building in these examples will represent\
    \ the type of being-completed.\n\nIf we want to create a Web site using nothing\
    \ more than the tools we've already seen, however it would become difficult, and\
    \ tedious to do, so parsing all of our output strings to HTTP response. The real\
    \ solution is to use HTML files, allowing for variables as necessary.\n\nThere\
    \ are a lot of different templates out there, and the most common is to use ASE,\
    \ PHP, JSP or OR—the last of which is partly of ruby on Rails. This type of template\
    \ can be easily used by programmers to work with, but it can cause trouble when\
    \ nonprogramming designers are involved, or if you want to have a separation between\
    \ code and design.\n\nSuch templates can be used by Django, but they are not the\
    \ default. Django uses templates that are similar in ways to the Simple system\
    \ for PHP, which avoids the use of actual code in the template by introducing\
    \ a limited language. So we can pass values to a template, there's no real need\
    \ for a full-blown programming language inside a template. It's probably enough\
    \ to have if them with some basics.\n\n# Despite their differences, both Django\
    \ and Rails use an approach that is best known as MVC (model, view, controller)\
    \ developed in the Smalltalk framework by many other languages and frameworks\
    \ then.\n\nwww.linuxjournal.com august 2017 | 2"
