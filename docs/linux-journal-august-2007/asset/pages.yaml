  md: "# COLUMNS\nWORK THE SHELL\n\n# 007's Favorite Game:\nBaccarat?\n\nCreate a\
    \ shell script to get a taste of Bond. James.\n\nDAVE TAYLOR\n\nI was recently\
    \ watching Casino Royale and thinking about the James Bond series, particularly\
    \ how Sean Connery was much more sophisticated than Daniel Craig. Connery was\
    \ more debonair, and one of the ways he demonstrated it by playing a mysterious\
    \ high-stakes game called Baccarat while surrounded by gorgeous women in Monte.\n\
    \n# Capturing the Basics of Baccarat\nThe first piece of the puzzle is pretty\
    \ straightforward—a shell function that returns a Baccarat value for a given sequence\
    \ of cards (integer 1–52).\n\nWell, I can't create a casino as a shell script,\
    \ and I certainly can't either a secret agent or a gorgeous female sidekick.\n\
    \n```\nfunction handleValue {\n  integer handleValue=0 # initialize\n  for cardvalue\n\
    \    if ($ cardvalue -ge 0 ) then\n      rankvalue=$($cardvalue % 13)\n      case\
    \ rankvalue\n        [0-1][12]) rankvalue=0;\n        11) rankvalue=11;\n    \
    \  esac\n```\n\nWell, I can't create a casino as a shell script, and I certainly\
    \ can't create a secret agent or create a Baccarat game as a shell script. It's\
    \ probably the first time I've ever attempted it.\n\n```\nhandleValue=$($ handleValue\
    \ + $cardvalue)\ndone\nnhandle=$($ handleValue % 10)\n```\n\nIf you were a faithful\
    \ reader of this column since the beginning, you'll know that two years ago we\
    \ started by writing a Baccarat game as a shell script. It was a long-awaited\
