    # The Lock Manager


    We use a hash-table manager using the virtual address ID. Addresses of data within
    SPH are unique, and active locks can be found in a hash table.

    Storage for the lock blocks has to be shared but persistent, so the memory is
    allocated for the lock table with a header and anchor, which is used to allocate
    the lock table hash list and allocated and thread blocks waiting on contended
    locks.


    # Utility Objects


    So far we have blocks of shared persistent region and an address-backed lock manager.
    Blocks are suitable for using large arrays but awkward to keep track of complex
    structures, such as lists and trees. The SPH regions utilize utility objects that
    allocate and manage allocations and deallocations.

    Utility objects use a block and header for internal allocation (using the same
    heap manager as the anchor block). The signatures are used, but each object has
    a unique type. The values define a simple type system for runtime checks. The
    signatures are stored in the header of the object to prevent the interpretation
    of a block as any address within the list. This is to support the new-value allocation
    scheme described.

    The simplest utility object is SPHSimple. The SimpleHeap is a block and internal
    header. A CompoundSimple is a heap manager for SPHHeaps. Each CompoundSimple can
    expand another CompoundSimple, this "new-mechanism" is useful for maintaining
    location of reference for complex list and tree structures.

    We use a framework (thin subclass) for the SPHTree, BinaryTree and SPHContext
    utility objects. The SimpleHeap is for the B8tree nodes in SPHTree and SPHTree
    maps a (name) to an address. An SPHTree maps an index by address a binary tree
    mapping to entries. Each entry defines one or more strings and their addresses.
    All these are useful for creating name structures and content-aware memories.


    create(file) in the store directory for multiples and segments.

    For our simplicity, we use two types of buddy system to keep track of all SPH
    storage. The buddy system reduces fragmentation by recombining smaller blocks
    into larger blocks when they are free.

    We use low-level utility objects to help manage the buddy lists. The lists need
    to be ordered and sorted for searching.

    Algorithms for the heap manager and binary tree can be found in Donald K. The
    Art of Programming (Resources).

    Finally, we need a place to store and maintain this information. The anchor is
