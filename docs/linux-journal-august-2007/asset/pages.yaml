    There was a constant digital dance between analysis and synthesis in the midst
    of it all, the increasingly obvious need for tools that are open and free.


    We were flying from the Coliseum north above Figueroa into downtown Angeles, after
    five stories about the road surface. After crossing the Harbor, we passed the
    Bob Hope Patillo Highway on our right, then cleared ten lanes of elevated to the
    Santa Monica Freeway. After zooming past the Convention Center and the Staples
    Center, we headed toward hitting a large building south across Olympic Center
    which featured monstrous portraits of Ike Ryder. We saw the street become like
    a row of buildings on both sides. When it was up to six, we had to head a couple
    blocks before taking another right on Hill. To off our right Pershing Square.
    Suddenly, we went down to the platform and then into the subway. We caught a train
    to go, though we punched through the roof and into the air above, where we took
    Hill North to right at twenty-five across Broadway and through the arched doorway
    into the theater with exposed mechanical elevators, best known for the series
