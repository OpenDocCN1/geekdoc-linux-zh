    # What''s Next


    Being able to use DNS in the e61 VPN policy would be beneficial for folks who
    have cheap access to IP addresses. I''m still figuring how to connect VPN using
    cryptography of the shared key as shown in this article. For a connecting e61
    to the network, using a large enough password should still be quite useful.


    The information in the article comes with no guarantee of being correct or suitable
    for anything use it at your own risk and discretion.


    Ben Martin has been working for firesystems for more than ten years. He is currently
    working on a PIB combining Semantic Firewalls with Formal Analysis to improve
    human-firewall interaction.


    # Connecting!


    One more complication exists for some of the publicly available Wi-Fi hotspots.
    Depending on whether many of these hotspots follow the pattern that when you try
    to open a VPN they redirect to a login page, authenticate them, and then connect
    you to the Internet. If you use a VPN access point on the e61 that is set to the
    EasyLAN as access point points, it will start without any connection and immediately
    try to send data to a VPN connection. You may have to authenticate with the Wi-Fi
    hotspot before it, if it will leak traffic, then things will get tricky.


    A way to get around this is to use the Web browser and directly connect just EasyLAN
    without any VPN whatsoever. If you have authenticated to the hotspot, leave


    the browser and use the menu key to get back to the main menu, and then use the
    e-mail. For that access point time, you have EasyLAN set as your Internet access
    point. Extending the Wi-Fi connection is renewed, and the VPN is up to top. To
    get secure web browsing, you then leave the e-mail by holding the menu key, restart
    the browser, and the start-running email program holds the VPN open. Start the
    browser again, and select the VPN as your access point.


