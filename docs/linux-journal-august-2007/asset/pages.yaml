    task. Real-time operating systems (RTOSs) used on these kinds of devices, such
    as VxWorks or pOS, were relatively expensive and lacked many features needed for
    an RG, which has to be performed separately. VxWorks 5.5, for example, with a
    TCP/IP stack that performances and do not implement a Linux kernel, to run a Linux
    situation created a business opportunity for a number of companies, such as Ashley
    Lane and Jungo, who well RG software stacks for hardware. The use of embedded
    Linux distributions over Unix made the process of building an RG to choosing the
    right hardware, writing the drivers for peripherals and also adding some kind
    of Web-based configuration utility. Embedded Linux reduced the difficulty of building
    RGs not only by providing many features that were either missing or expensive
    in RTOSs, but also easing the integration and debugging of applications, such
    as the Linux driver model and kernel/user space mode.


