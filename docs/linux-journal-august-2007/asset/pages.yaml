    The result is that a program can store and render larger images. Generating a
    gigapixel (32768x32768) Mandelbrot takes about five minutes (Apple G5 dual-2.3GHz
    Processor). Once the quadtree is generated, existing and retiring is nearly instantly
    (22 milliseconds to a 512x512 image) and zooming around the center is also fast
    (12-20 milliseconds). Zooming to a depth where the pre-computed set slows down
    (200-500 milliseconds) due to the heavy computation required. When an image is
    computed and stored, subsequent displays are fast (12-20 milliseconds).


    We have tested Mandelbrot programs on both 32-bit and 64-bit Linux, using PowerPC
    and x86_64 platforms. 32-bit systems can support a 1-GB range, which is large
    enough. Gigapixel requires tiles to render the large regions without aliasing.
    With recent improvements, PowerPC64 can support up to 8TB. The x86_64 platform
    supports an 8TB address space and 6TB range. This is more than enough for our
    current projects.


