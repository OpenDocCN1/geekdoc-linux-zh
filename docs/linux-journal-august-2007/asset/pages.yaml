  md: '# # BUILD YOUR OWN ARCADE GAME PLAYER AND RELIVE THE ''80S!


    Save your quarters; you won''t need them when you build your vintage arcade player.


    Shawn Powers


    grow weary of hearing how bad Linux is for gaming. In this article, I buck that
    stereotype and show how to use penguin power to relive the ''80s. In this cool
    project, I describe a fully functional arcade cabinet. When complete, you''ll
    be able to play all the old coin-op games from your childhood in the coin-free
    luxury of your living room (or garage—depending on the tolerance of individuals
    involved).

    The system uses software based on MAME (Multi Arcade Machine Emulation Project)
    to play the original classics in Linux. MAME uses software to emulate the original
    arcade hardware. This article explains how to connect the original joysticks and
    buttons, and even gives some pointers regarding purchasing rights to the original
    games.


    ![](img/1234e63edf27cb1f15e6071bce50485a_39_0.png)'
  merge: -1
