  md: 'chances the board manufacturer will provide a board support package (BSP)—that
    is, uLinux (or some Linux version) to that hardware. If this is not the case,
    you have to write the BSP yourself, which is beyond the scope of this article.


    The major components of uLinux distribution are: the kernel itself, the uclibc
    library and BusyBox. The uclibc kernel has support for MMU-less CPUs, which is
    of importance nowadays. Because the cost of adding the MMU is so small, I expect
    that most, if not all embedded CPUs run on an RG will have it. Nevertheless, uLinux
    is a great distribution even if you don''t exploit the MMU. Originally it was
    created to support MMU-less systems, which for instance, cannot have a fork(2)
    system call. But even if you don''t need this functionality, it is a great alternative
    for linux on embedded systems, as glibc has much RAM requirements. BusyBox is
    a collection of standard UNIX utilities, optimized for embedded systems with low
    RAM. It comes with uLinux, and with uclibc, you usually will prefer it over full-featured
    standard utilities, unless you have a system with enough RAM (typically above
    16MB).


    You need two important pieces of software that are not part ofLinux. The first
    is a bootloader, which is software that usually resides in ROM (or RAM partially)
    and is responsible for loading the Linux image from Flash to RAM and performing
    hardware initializations. Unfortunately, there is no standards for bootloaders
    in the embedded world, and you cannot use PC bootloaders, as GRUB or LILO. Your
    hardware manufacturer will almost certainly provide a bootloader, and I strongly
    suggest using it. If it doesn''t support Linux, it is easier to adapt it to your
    hardware. If you still choose to port the bootloader, Das U-Boot is a good choice,
