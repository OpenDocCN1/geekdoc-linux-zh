    and then on East Chavez to la la flats for turning the course of the Los Angeles
    River into a green park. Suddenly, the park itself appeared, the river turned
    to blue.


    Our planet and simulation code was Zachary Newman, a graduate student at UCLA.
    We have a demonstration of Virtual LA, a simulacrum of downtown LA for past, present
    or at times in the future. Virtual LA is designed to facilitate urban planning,
    emergency response, architectural development, and many other uses and combinations
    together. It contains 3D geometric modeling elements and street-level photography.
    Of the visuals that are detailed, you can read graffiti and small signs in shop
    windows. The virtual system was built on GIS, which was made to Linux several
    years ago. All are open-source projects, and Linux is the subject it explores.
    Our work will continue to on as long as the project is useful.


    Virtual LA was one of many visualizations at the Digital Innovation Show at UCLA
    in May 2007. Others included the Run Forum Project, 800 Years of Berlin and the
    Roman Vision Project. We were invited to take a tour of Santiago Compostela, a
    13th-century cathedral in Spain, where four projectors created blended images
    on a curved 180-degree screen seating seating for 40. In each case, the experts
    talked us about the


    work of virtual construction (or reconstruction) resulted in better insights and
    understandings of settings both long gone and not just built. There was a constant
    digital dance between years and analysis—in the midst of it all, the increasingly
    obvious need for tools that are open and free.


    All this work originated out of a relatively new discipline called digital humanities.
    I had first heard of the field from Joseph Vaughn, Assistant Director of the UCLA
    Humanities and met him at a Linux for Suits for the first Desktop Linux Summit,
    back in 2003. In e-mail, he and open-source software reported progress in more
