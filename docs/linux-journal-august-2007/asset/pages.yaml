  md: '# # Case study: GRUPPO SACE


    # ## capabilities


    Implementazione del modello logico SACE la gestione del cliente: Il CRM gestisce
    la gestione automatica delle fasi del ciclo di vita del cliente all''acquisto
    o post (lead and prospect) e all''allocazione del portafoglio.


    **Organizzazione delle informazioni e gestione dei contatti:** attraverso CRM
    Contact tu puoi strutturare, reperire e monitorare informazioni all''utilizzo
    delle attività:


    +   - registrare i contatti

    - analizzare e selezionare la cliente

    - recuperare e organizzare informazioni relative alle aziende, associazioni, mercatati,
    testate gestionali

    - coordinare gli obiettivi di attività (invii, inviti, eventi) di newsletters,
    annual reports...


    **Gestione di Business Opportunity:** Il CRM gestisce in segnalazione di argomento
    tutti gli acquisti di opportunità di vendita up-sell o cross-sell su SACE o altri
    controparti


    **Gestione delle Pipeline:** il sistema permette di gestire le trattative commerciali
    (Pipeline) consultando l''avanzamento (percentuale e stato). Le informazioni relative
    alle trattative sono organizzate in aree: operative del CRM; ''note book'' disponibili
    su solo un team referente.


    **Acquisizione Operativa e gestione dati Industriale:** il CRM è integrato con
    il sistema industriale al fine di acquisire per cliente i dati di sintesi delle
    relazioni SACE, domande, emissioni di garanzia, documenti dell''operato.


    **Campaign Management:** Sono state attivate funzionalità a supporto di Campagne
    commerciali con i riferimenti dei clienti o potenziali.


    Reporting: sono state predisposte funzionalità per elaborare report di sintesi
    o dettagliati da utilizzare nelle analisi di marketing del portafoglio clienti
    di SACE e a monitorare gli esecutivi, eventi, operazioni, pipeline


    # ## risultati


    Il 2006 è stato per Gruppo SACE un anno di crescita, coronato da risultati positivi:
    solo nel primo semestre, l''utile netto ha registrato 542,7 milioni di Euro, generando
    un incremento del 15% rispetto al 2005.


    Fattori determinanti della crescita sono stati anche i premi dei premi consolidati
    (123,3 milioni di Euro, +85% rispetto al 30 giugno 2005), il risultato di SACE
