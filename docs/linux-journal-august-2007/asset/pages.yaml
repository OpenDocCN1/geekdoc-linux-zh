  md: '# # The Biggest Case Mod You''ll Ever See


    First off, the arcade case that makes this project truly awesome. If you don''t
    have an actual arcade cabinet, with original controls, it might as well go back
    to playing on your Z-RS80 for years of nostalgia. The cabinet might be just as
    cool. It''s up to you to decide whether to make a cabinet or buy one used. The
    design is simple to understand.


    The downside is that this requires some working skills. I have no skills. In fact,
    to me, "save" is waveform on an oscilloscope or to polish an old arcade machine
    and get it out. If you''re a woodworker, then this is the way I''d suggest doing
    it.


    To find used cabinets, look up "cop on" or "arcade" in the phone book. It was
    my particular fortune to find a man who gave me two used cabinets for $30. I had
    to listen to a litany on the downfall of it


    the arcade generation and how these kids days don''t appreciate the classic games.
    I think he threw in the second case for when I mentioned that I was rebuilding
    it, because I wanted to relieve my youth. He liked that idea almost as much as
    I did. Keep in mind that if you happen to get an arcade monitor, it is possible
    to use it, but it requires more work. For the purpose of this article, I''m using
    a standard computer monitor


    After I brought flowers and took her out, I was allowed into the house and start
    the fun. My particular case was from an old Neo Geo game, and I chose to leave
    the somewhat damaged on the side (Figure 1).


    If you are not, a woodworker, you might want to purchase the particle board and
    make a custom cabinet. There are some specifications for some arcade machines
    on www.arcade.com. In fact, that has tons of information on constructing a MAME
    machine on the ground up, and an invaluable Web site. Even if you were able to
    start from scratch, I actually used the used cabinet.


    something special about knowing it''s the real deal, even if the insides are all
