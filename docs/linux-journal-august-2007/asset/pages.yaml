  md: "# COLUMNS\nTHE FORGE\n\nYou can use any number of Python libraries that you\
    \ want, and even access databases, filesystems and remote computers.\n\nThis is\
    \ what Django's default template system provides. In order to use templates, we\
    \ modify the settings.py file that sits in the project's main directory. We want\
    \ to set the TEMPLATE_DIRS variable, giving it a list of or more directories in\
    \ which our templates might be found. For example, we could set it to:\n\n```\n\
    TEMPLATE_DIRS = {\n    \"/opt/atf/mysite/templates\"\n}\n```\n\nWith this, we\
    \ can now create appropriate directories:\n\n```\n$ mkdir /opt/atf/mysite/blog\n\
    ```\n\nAnd then, in it directory, we create a new HTML file, which we call view_one_posting.html:\n\
    \n```\n<html>\n<head>\n    <title>One post</title>\n</head>\n<body>\n    <p>This\
    \ is the \"view_one_posting\" template.</p>\n</body>\n</html>\n```\n\nThe answer\
    \ is quite simple. In the view method, we can pass any variable to the template\
    \ using the context dictionary, where the keys are the passed variable names,\
    \ and the values are the passed variable values. So, we can use:\n\n```\ndef view_one_posting(request,\
    \ post_id):\n    t = loader.get_template('blog/view_one_posting.html')\n    c\
    \ = Context({'post_id': post_id})\n    return HttpResponse(t.render(c))\n```\n\
    \n> If we want to see this value in our template, we can use it in double braces:\n\
    \n```\n<html>\n<head>\n    <title>One post</title>\n</head>\n<body>\n    <p>This\
    \ is the \"view_one_posting\" template.</p>\n    <p>The post_id is {{ post_id\
    \ }}</p>\n</body>\n</html>\n```\n\nAnd sure, when we render this template, we\
    \ get:\nThis is the \"view_one_posting\" template.\n\nThe post_id is $.\n\n```\n\
    from django.template import Context, loader\n```\n\nThen, we modify view_one_posting\
    \ to:\n\n```\ndef view_one_posting(request, post_id):\n    t = loader.get_template('blog/view_one_posting.html')\n\
    \    c = Context({'post_id': post_id})\n    return HttpResponse(t.render(c))\n\
    ```\n\nOur template is loaded to include the context, and that-is, we pass the\
    \ variable values to the context. We then tell the template to render using any\
    \ variables in the context. For example, we pass post_id variables in the dictionary.\n\
    \nAnd if we rebuild blog/urls.py of our site, we should see the following in the\
    \ browser window:\n\nThis is the \"view_one_posting\" template.\n\nThat's better\
    \ than what we had before, in that the contents of the template are easier to\
    \ handle (by programmers and designers alike us) instead of a string of inside\
    \ a method. But how do we pass variables to be interpolated?\n\n# Conclusion\n\
    \nDjango, like many other web frameworks, uses MVC to divide the work between\
    \ models, views and templates. In this, we saw how to create a URL to a view,\
    \ how to pass one or more URL parameters to a view and how to implement a template\
    \ from a view.\n\nNext, we will see how to integrate databases and how to use\
    \ them in Django views.\n\nHaver Lerner, a longtime Wikipedia contributor is a\
    \ candidate in Learning Sciences at University of Illinois. Illinois. He currently\
    \ lives with his wife and two children in Schaumburg, Illinois. You can read his\
    \ biography at although.lerner.com.\n\n# Resources\n\nThe main Django site is\
    \ www.djangoproject.com. The site contains a great deal of documentation, including\
    \ tutorials and pointers to making lists.\n\nA prerelease of the forthcoming Django\
    \ book (to be published) at www.djangobook.com/en/beta, and the book is still\
    \ unfinished in many places, it is written and includes many examples.\n\n22 |\
    \ august 2007 www.linuxjournal.com"
