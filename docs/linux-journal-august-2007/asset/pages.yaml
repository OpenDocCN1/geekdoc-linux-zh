  md: '# CREATE A LINUX VPN

    for a Nokia E61 with Openswan


    # Create a virtual private network between your Nokia E61\phone and a Linux gateway.
    Ben Martin


    A VIRTUAL PRIVATE NETWORK (VPN) allows you to send traffic across an untrusted
    network without exposing the content of traffic. Conceptually, this is by creating
    a pipe between two hosts where all traffic is encrypted. This example shows connecting
    a Nokia E61 device to a home network through a VPN over the Internet. The Nokia
    E61 uses IP security (IPSec), a smartphone that has Wi-Fi support as well as a
    VPN. Similar procedure might work for other models using the same VPN client software,
    though the hardware was not tested for this.


    The VPN support on the Nokia E61 uses IP security (IPSec). Openswan is the IPS
    server that is configured on the Linux machine to provide the other end of the
    virtual network.


    A simple setup up front: I''ve been unable to configure the VPN client on the
    Nokia to connect to a server that does not have a static IP address.


    To keep notation simple, refer to the e61 and the running server as VPN IP address.
    The IP address of the e61 is irrelevant to


    the article, as you will likely be moving around to different Wi-Fi hotspots with
    the phone. When a VPN is set up, the e61 gets another IP address, which the e61
    refers as the virtual IP address. The address of the VPN i up, which is what you
    use to access the internet. In this article, I used 192.168.x.x IP address for
    the VPN address. The non-VPN IP address of the e61 is most relevant, unless I
    explicitly mention here, the e61 IP address will be the non-routable IP address.


    Unlike the other settings on the phone, you cannot configure it using the e61
    itself. You have to create a package containing all the information about the
    VPN and install that package on the phone. The packages are SIS files. A VPN SIS
    file must also be digitally signed before the e61 allows you to install it. Signed
    files have no extension. The most difficult part of setting up the e61 to talk
    to Openswan is in creating the SIS file to


    The SIS file must be digitally signed, even if you have the configuration parameter
    Software to install in All App Mgr/Options/Settings.


    ![](img/1234e63edf27cb1f15e6071bce50485a_45_0.png)'
