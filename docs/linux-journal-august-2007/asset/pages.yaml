  md: '# NEW PRODUCTS


    # Motorola RAZR V8


    Motorola tinkering with Linux on mobile phones as an experiment in China, which
    was supported, interestingly, by the Chinese government. Because the company was
    impressed with Linux, our beloved OS is becoming ever common on mobile devices.
    One of the latest Linux-powered options is the RAZR V8, a next-generation of this
    popular handset. The RAZR V8 features up to 500 minutes of talk time, quad-band
    connectivity, up to 2GB of memory, a two-megapixel camera, Opera Web browser,
    independent speech recognition and music based on Windows Media Player 11. Motorola
    is the latest, diverging only that it has pierced audio codecs, DRM and transfer
    protocols from Microsoft and integrated them into its Linux-Java platform. Still,
    it calms the Linux-questing soul to know that one can intentionally go out and
    get a butt-kicking Linux-based phone! www.hellomoto.com


    ![](img/1234e63edf27cb1f15e6071bce50485a_37_0.png)


    # Drew Technologies''

    DashDAQ


    As the Detroit automakers obsessively perfect the cupholder, Drew Technologies
    seeks to sneak a Linux-based device, the DashDAQ, on board your new ride. The
    DashTech, is "a cross between an automotive gauge, dashboard, navigation system
    and data acquisition system, diagnostic tool and a handheld computer." The device
    was designed for use in an automotive display, includes OBD protocols and runs
    on Linux software that is included with DashDAQ allows users to create their own
    themes and automotive gauges. Features include dual-ARM architecture, 4" (QWVGA)
    24-bit TFT color display, a touchscreen and 64MB of RAM. The product is available
    through various distributors, and directly from DrewTech. www.dashdaq.com


    ![](img/1234e63edf27cb1f15e6071bce50485a_37_1.png)


    # Axigen Mail Server


    Axigen continues to add the feature set of its Mail Server messaging solution,
    with version 4.0 no shipping. The new feature in version 4.0 is a Persona module
    offering features such as calendar, tasks, notes and collaborative support. The
    feature is available via Axigen''s Web interface and Outlook Clients. In addition,
    the product now contains the Outlook connector, which implements most Exchange-like
    features, such as server-side folders. Axigen Mail Server comes in three additions:
    ISP/HSP, Business and a Business office. www.axigen.com


    ![](img/1234e63edf27cb1f15e6071bce50485a_37_2.png)


