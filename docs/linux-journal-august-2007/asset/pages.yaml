  md: '# Streaming Audio with Ices and Icecast


    Retransmit from a radio scanner to the Internet via Ices and Icecast. BRIAN MATHERLY


    The Sioux Empire Amateur Radio Club operates a repeater on 146.895MHz with call
    W2ZY. On Tuesday evenings, it provides a time for club announcements. I like to
    listen when I can, but sometimes I am at work when the announcements start and
    I can''t get to my radio. I found a way to solve this problem by using a VHF scanner,
    Linux and Icecast audio to a sound card. By broadcasting the transmission over
    the Internet, I can listen to the club repeater anytime.


    Vorbis or MP3 streams, it receives encoded media from one or more sources and
    makes it available for streaming to multiple clients. I chose an Ogg Vorbis audio
    encoder that works well with Icecast. Ogg because it is a patent-and royalty-free
    format. Players can decode Ogg, MMS in Linux and Unix on Windows are most common.
    If you are interested in using MP3 encoding, check out Lveice for details. I did
    all my encoding tasks on the same machine, but I chose to do them on separate
    machines. This makes it easier to add more sources. It also removes of the processing
    burden from the streaming machine.


    # Tuning In


    The first step was to use a VHF tuner that could tune to 146.895MHz and output
    audio to a sound card. The least expensive way was to go by a consumer-gradeUHF
    scanner. The scanner needs to have either a line-level output or a headphone jack.
    I found that line-level outputs are rare, but there are a number of scanners with
    headphone jacks. I used a digital tuner so that it would not drift off frequency
    over time. I found a Radio Shack PRO-2700 which cost $75 and met all of my requirements.


    Using an F-Bnc adapter, I connected the scanner''s antenna to the off-air TV antenna
    on the roof of my house. This worked well because 146.895MHz lies right off-air
    of TV channels 6 and 7. I spent some time tuning the squash as I could, so there
    would be stable when I was not transmitting. Figure 1 shows my setup with a cable
    plugged into the headphone jack.


    # Getting Connected


    To put the audio on the Internet, it must be encoded. Then, that encoded information
    can be made for streaming to clients on the Internet. For tasks, Icecast and Ices
    makes a great team. Icecast is a media streaming program that supports Ogg


    ![](img/1234e63edf27cb1f15e6071bce50485a_85_0.png)


    Figure 1. Radio Shack Scanner with Audio Cable Attached


    ![](img/1234e63edf27cb1f15e6071bce50485a_85_1.png)


    Figure 2. Network Diagram'
