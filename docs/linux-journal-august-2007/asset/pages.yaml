    ## Screenshots




    While While browsing on the Mozilla Developer Web Site, I encountered that there
    was a missing function for Picnic''s extension—the ability to create snapshots
    of web pages. The first part of the puzzle is the new Canvas HTML element that
    provides a 2-D drawing canvas for JavaScript. Canvas was originally introduced
    by Apple to support dynamic graphics on the web.


    Two additional functions will make process easier: the first is the drawWindow
    function. drawWindow, as its name implies, renders an HTML window to the canvas.
    The second important function is toDataURL, which we use to render the web page.
    It returns the image as a data URL.


    Typically, URL returns an object from a remote server or in the local files. DataURL
    stores the actual object as part of the URL. This can be very useful for embedding
    small graphics in CSS or HTML. This technique allows the browser to avoid another
    request to the server when drawing the page of canvas.


    As you can see in listing 3, our picnic will have a pop-up menu to connect the
