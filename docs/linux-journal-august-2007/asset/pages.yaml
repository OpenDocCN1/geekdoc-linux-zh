    \n```\nfrom django.http HttpRequestResponse\ndef index(request):\n    return HttpResponse('Hello,\
    \ world.')\n```\n\nDespite their differences, both Django and Rails use an approach\
    \ that is known as MVC (model, view, controller) in the Small community since\
    \ many languages and frameworks supported them. These terms were used whereas\
    \ in the Rails world, are called models, templates and views in the Django world,\
    \ and they form the bulk of a Django-app.\n\nIf we aren't server running, then\
    \ we can start with:\n\nThis month, we work with templates and views, ignoring\
    \ the database and API next until month. But don't Django's applications are quite\
    \ powerful, and they provide an interesting restraint.\n\nOr, if we want to run\
    \ on a publicly accessible IP, rather than 127.0.0.1 ('localhost'), we can do\
    \ something like this:\n\n```\npython manage.py runserver 69.55.23.8200\n```\n\
    \n# Creating an Application\n\nOur first steps creating a new application within\
    \ our project. For a number of reasons, including the simplicity with which we\
    \ can create a page, our application is a very simple blog. We create our blog\
    \ by switching into our project directory, and then by using our management, manage.\n\
    \n# URLConf\n\nTo see the output from, let's point our browser to the following\
    \ URL, expecting to see 'Hello, world'. http://69.55.23.82:0000/ Instead, we get\
    \ an error indicating that Django has no idea what we are talking about. The good\
    \ news is that this error message, which is turned on only when we are developing\
    \ an application, tells us what we did wrong—namely, that our URLConf failed to\
    \ find the view we defined.\n\n```\n$ cd /optaf/mysite\n$ python manage.py startup\
    \ blog\n```\n\nThis is a fundamental difference between Django and Rails, and\
    \ it reflects the different philosophies of the two communities. In Rails, we\
    \ expect the system to do the right thing by default; you should have to say something\n\
    \nIf this executes successfully, Django won't print any messages. Rather, then\
    \ we get a list of the current current directory, which should now include a blog:\n\
    \n```\n$ is blog\n$ __init__.models.py views py\n```\n\n20 | August 2007 www.linuxjournal.com"
