    nsl.quantuminux.com., and so on. (Be sure to leave the ending dot on those names).

    - Change ns2.MyFriendWhoHasDNS to the name of the host computer that has agreed
    to be a secondary DNS server for your domain. (If you don''t have a DNS server
    and it''s not required, please delete this).

    - Change all instances of 123.45.67.1 to the real IP address of your server.


    +   6. Save the change and close the /var/named/db.example.com file (actually,
    the name you changed that to):


    +   7. If you are ready to start your DNS server, type the following lines as
    root user from a Terminal window:


    ```

    # service named on

    # chconfig named start

    ```


    Your DNS server now be up and running. Here are a few things you should know about
    the server you created:


    +   - Each time you make a change to the DNS server, you need to edit the name.conf
    file to increase the serial number and restart the named service. Often, administrators
    use the current date and increment a two-digit number at the end. For example,
    May 7, 2003, would appear as 2003050701. If you change DNS again on that day,
    you could change it to 2003050702. (To restart DNS, as root user type chconfig
    named)

    - Anyone on the Internet will be able to reach your server using a variety of
    names. For example, for the quantuminux.com domain, people could reach the server
    by names nsl.quantuminux.com, mail.quantuminux.com, www.quantuminux.com, and ftp.quantuminux.com.

    - The MX record identifies the location of the mail server for the domain. For
    example, for the quantuminux.com domain, nsl.quantuminux.com would be the server
    to receive mail for chris@quantuminux.com.


    # Step 6: Configure the Web server


    Use the descriptions in Chapter 14 to configure your Web server. In addition to,
    to allow users to configure their personal Web pages, the UserDir disable line
    to read:


    ```

    userDir public_html

    ```


    This will allow each user to place personal Web pages in the public_html directory
    in home directory. Next, restart the web server:


    ```

    # service httpd restart

    ```'
