  md: '# Checking Out the Projects


    Linux Toys range from simple music and video players, to useful home and small-business
    tools, to some longer projects that are just flat-out fun. The 13 Linux Toys projects
    include


    +   Music jukebox — Automatically rip and compress music CDs to your hard disk;
    then play them continuously at random or from a playlist you create. Music is
    stored by artist name, CD title, and track names.


    +   Home video archive — Make backup copies of your precious home videos, compress
    them, and burn them to CD or DVD.


    +   TV recorder/player — Set your Linux PC to automatically record and play back
    your favorite television by selecting shows from a Web-based interface.


    +   Arcade game player — Use the x game emulator to play old console games.


    +   Home network — Set up a network to share an Internet connection, file and
    printer sharing, and act as a routing firewall (to protect from intruders on the
    Internet).


    +   Home broadcast center — Send streaming video to other computers on your network
    or Internet. Use the project to watch home-surveillance cameras, a mini video
    conference, or share broadcast television around your home.


    +   Temperature monitor — Gather, store, and charts; add the output to a Web page,
    e-mail signature, or graph.


    +   Telephone answering center — Set up multiple voice-mail boxes in Linux so
    that audio messages can be e-mailed to anyone you choose.


    +   Internet Service Provider — Become a small ISP for friends and family by using
    a Linux server to connect dial-in lines and provide support for multiple users
    for Web, FTP, and DNS service.


    +   Hosting service — Set up a virtual hosting DNS server, the server can provide
    Web content per domain names and allow clients to add their own content


    +   Linux on a Floppy disk Games — Play with some Linux commands and classic text-based
    games from a bootable floppy disk.


    +   Remote control car — Control a remote control car from your Linux system.


    +   Digital picture frame — Have your digital pictures display randomly from laptop
    components installed in a picture frame.


    Along with these projects are general information sections that will help support
    other projects. These include:


    +   Using Linux — Get the basics you need to know about the Linux operating system,
    in particular Red Hat Linux. (See Appendix B).


    +   Installing Linux — Learn to install Red Hat Linux and get started using it.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Chapter 1 — Exploring Linux Toys


    Some of these projects are designed to run as single-use devices. Some of the
    reasons for using only one project per machine are


    +   - Some projects take over your computer. For example, the music jukebox assumes
    that every CD you put in it is meant to be copied to the hard disk and takes over
    your sound card by playing music continuously.


    +   - Minimal hardware requirements. To keep down the use of resources, we tried
    specifically to note the minimal software and hardware you need for each project.
    Different projects have different minimums.


    Just because some projects can work as single-use devices on less powerful PCs,
    don''t let limit you. Many of the projects will co-exist nicely on the same PC.
    Others can be turned off and on so as not to conflict with each other. Also, if
    you have a new, spuffed PC you can certainly use that to build these projects.
    It''s just tough for us to make a case, cost-wise, to use a new PC to operate
    a toy car.


    This brings us to the question of costs.


    # Costs of building Linux Toys


    Will it cost a lot to build these projects? The short answer is "No, it doesn''t
    have to." The longer answer is, "Have you heard the old story about stone soup?


    In one incarnation of the story, after an old woman refuses to give a hungry tramp
    food, the tramp insists that he can make them some wonderful soup from nothing
    but stone and water. In the process, he gets the woman to add a bit of flour,
    carrots, a few potatoes, and so on until the cupboards are empty and the soup
    is well, state of the art. And the woman, of course, is thrilled to have a fine
    soup from nothing but a stone and water.


    We believe that these Linux projects will each bear something greater than the
    stone and water you put into them. However, if you decide to empty your cupboards
    to add an expensive stereo on the end of your jukebox or buy a 120GB hard disk
    to store your home videos, that is entirely up to you. Go for it.


    Our goal is to make each project worth the price of the book in what it adds to
    your old PC. If it turned out that a project only seemed worth about $19.95, we
    tried to add about $9.05 worth of enhancement suggestions and to related projects
    that might interest you.


    # Finding hardware


    Most of the projects can start with an inexpensive PC at their base. However,
    not just any PC will be appropriate for every project. Some might require larger
    hard disks, more RAM, or a better processor than the PC you stumble upon. We''ll
    give you some guidelines for finding the hardware that will work for these projects.


    For some of the trickier pieces of hardware, such as modems or TV capture cards,
    we recommend exact models that worked well for us. Other hardware might be able
    to find in a used computer store or even in your basement (see Figure 1-2).'
  merge: -1
