    own Internet address on.


    Even though we''re calling this a toy, the tools we describe here are exactly
    the same ones used every day by real Web-hosting services. So you could run a
    business-oriented Web site that sells products, processes credit cards, and tracks
    inventory and the like by using Red Hat Linux as the platform.


    But, for goodness sake, you did after all Linux Tsys. So we''re going to assume
    that you don''t have the level of commitment for a massive


    in this chapter

    - Preparing your Web server

    - Serving multiple domains on a Web server

    - Adding users and FTP, mail, and other services

