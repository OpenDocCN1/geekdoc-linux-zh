  md: '# Acknowledgments


    **Chris:** I would like to acknowledge Linus Torvalds and the Linux kernel developers
    (kernel.org), Richard Stallman and the GNU Project (gnu.org), and Red Hat, Inc.
    (redhat.com), as major contributors to the Red Hat Linux distribution used as
    the foundation for projects in this book. Our book also relies heavily on contributions
    from the Internet Software Consortium (www.isc.org), the Apache Software Foundation
    (www.apache.org), the XFree86 Project (www.xfree86.org), and the GNOME Project
    (www.gnome.org).


    These and other projects attest to what can be achieved through the open source
    development process.


    I''d like to thank Debra Cauley at Wiley for her strong leadership in keeping
    us on track to meet our publication dates and Sara Shla and Eric Newman for steering
    it through the development and production processes. Thanks to Margot Maley Hutchison
    for contracting the book with Wiley.


    Special thanks to Chuck for countless hours researching, debugging, and scripting
    the projects in this book. Without his partnership on this book, I''m sure it
    would have been another few years in the making (if it ever got done).


    Another special thanks to our technical editor, Kevin Pedigo, who has gone well
    beyond his job description, scrutinizing the projects and giving us insightful
    new directions in which to take them. Kevin''s skill in building RPM packages
    and scripting some neat tricks for dealing with some audio and video problems
    was invaluable to us. (Chuck and


    to Patrick Scanlan for all the awesome penguins in the book. I am responsible
    for the less-awesome shows in the book.) In real life, I couldn''t have afforded
    to hire him. So I was fortunate to be able to work out a buddy rate on the project.


    On the personal side, thanks to my wife, Sheree, for being my sunshine on the
    rainy days in the Pacific Northwest. Thanks to Caleb and Seth for sticking it
    out and completing high school and preschool, respectively.


    **Chuck:** I would like to thank the Linux kernel developers and the GNU Foundation
    for providing a platform that is fueled by technical merit and openness rather
    than market deadlines and profit. Special thanks goes to Linus Torvalds and Richard
    M. Stallman for their unwavering dedication to their principles.


    I''d also like to thank all of the Linux application developers. Without applications,
    Linux goes nowhere. Your hard work and dedication are a large part of why this
    book was possible. Many thanks go to SourceForge for providing the infrastructure
    on which a large portion of the application developers rely.'
  merge: -1
