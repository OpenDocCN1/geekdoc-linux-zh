    with the end user. While you are selecting your hardware, keep this fact in mind.
    If you are handy with a Dremel tool and metal snaps, you might consider removing
    the guts from an old stereo system and mounting all of your computer parts inside.
    The result would fit nicely into most stereo rack systems.'
