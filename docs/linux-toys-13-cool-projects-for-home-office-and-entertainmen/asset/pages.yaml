  md: '# Chapter 4 — Building a Digital Home Video Archive 77


    6. As root user, create an /etc/nvrec.conf file using any text editor. This file
    holds settings for when you do the actual recording. The contents of the nvrec.conf
    file are simply options, with each option on its own line, that are passed to
    ffmpeg (or other nvrec commands). Here is an example of default settings you can
    start with (and change later as you refine your recording):


    ```

    ffmpeg

    -F 1500

    -d /dev/dsp

    -v /dev/video0

    -w 512

    -h 384

    -ff avi

    -ac mp3

    -vc m2peg

    -vg q 0

    ```


    Here''s a breakdown of the options we set in the nvrec.conf file:


    +   - F frames This option sets the total number of frames that will be grabbed
    by ffmpeg. By setting this value (which is infinite by default), you effectively
    tell how long to record. By default, we are recording 24.99 frames per second.
    The formula for figuring how many total frames to grab is:

    - minutes of video x 60 (seconds) x 24.99 (fps)

    - to record 2 hours of video, which will be 120 x 60 x 24.99, or about 180,000
    frames. The value in our example (1500) would record about one minute of video.
    Instead of setting -F, you can just let the recorder play indefinitely. Then type
    Ctrl+C to stop recording.

    - dev/dsp This option sets the audio device to use. The first audio device used
    by OS (/dev/dsp) is in our example.

    - v device This option sets the video device to use. The first video device is
    used in our example (/dev/video0).

    - w pixels This option sets the width of the video being captured. In our example,
    we used a width of 512 pixels. And the -h option has a major impact on quality
    (higher values result in lower quality) and file size (higher values will result
    in output files).

    - h pixels This option sets the height of the video being captured. In our example,
    we used a height of 384 pixels. Like the -w, -h can impact quality and file size.

    - ff fileformat This option sets the file format. We use the avi file format,
    which can be used with a variety of different compression tools (codecs).

    - ac coder This option sets the codec used to compress the audio. Our choice was
    mp2. Other options are ac3 and pcm_s166.

    - vc coder This option sets the video codec being used to compress the video.
    Our choice was mpeg. Using mpeg4 smaller files of lower quality video.

    - vq num This option sets the queue scale to 0. This effectively turns it off.'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# 78 Part II — Entertainment Projects


    Change any of the preing options to suit your recording. In particular, we want
    to set your own -F value so that you can configure how long to record.


    7. Change to the directory you created for storing your video. For example:


    ```

    $ cd /usr/local/share/homevideo

    ```


    8. Simultaneously, press the Play button on your VCR to play the video you want
    to record, and run the ffmpeg command line. Here is an example of the ffmpeg command
    line you might use:


    ```

    $ ffmpeg -C /etc/nvrec.conf -o party-06152003.avi

    ```


    This command reads the options you sent in the /etc/nvrec.conf file, starts grabbing
    and compressing video based on those options, outputs (-o) the recorded video
    to the file name specified in this case, party-06152003.avi.


    After ffmpeg has run for its specified recording time, it will continue to run
    for as it finishes compressing the video. When the recording is done, you can
    view the record using the mplayer video window.


    Although we made the choice to use avi as the file format and mpeg as the coder,
    ffmpeg lets you record using all the file formats and codecs ffmpeg supports.
    A complete list of supported file formats, video codecs, and audio codecs, refer
    to ffmpeg documentation (https://ffmpeg.org/ffmpeg-doc.html).


    It''s useful to run x4 every time you record video in order to make tweaks that
    account for variances in lighting and quality. After a time it will probably work
    up for all cases. You can use the v4lctl command to set these on the command line
    or place them in your /etc/rc.local file to be set at boot time. For example,
    to ensure that the volume is always high enough, use /usr/bin/v4lctl volume 85.
    The remaining settings can be found in the v4lctl man page.


    ![](img/93c80330322e65d5105a6014afe2d85d_105_0.png)


    # Playing Your Videos


    To play video in Linux, the two best choices are Mplayer and xine. We found Mplayer
    to be more stable, so we are recommending it for playing back your video.


    When you installed mplayer, as instructed in this chapter, it has created a menu
    entry for launching the player. You can start the GUI version of Mplayer by typing
    gmplayer from the command line or from the Red Hat menu by clicking Sound -> More
    Sound and Video Applications -> Movie Player. The Mplayer window should appear
    as shown in Figure 4-4.


    With the Mplayer window open, you can try playing back some of your recorded videos.
    Select a video file for playback, right click the control panel; then click Open
    -> Play file. In our example, when you are prompted for a file to play, select
    /usr/local/share/homevideo/party-06152003.avi (or whatever filename used). You
    can use the control panel to play, pause, and go back. The controls are very similar
    to ones you would find on a music player.


    * Timoi'
