    that are free with Red Hat Linux that a lot of Web-hosting services are charging
    bucks for.


    Stepping through the next set of questions will help you plan how to set up your
    Web server. It will help you write your own version of "Chuck and Chris''s Web
    Hosting" brochure (to hand out to your family and friends).'
