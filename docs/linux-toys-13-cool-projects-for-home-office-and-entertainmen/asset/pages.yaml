  md: '![](img/93c80330322e65d5105a6014afe2d85d_133_0.png)


    # About MAME Console Gaming


    The MAME project began as a way to preserve the workings of some of the old console
    game players of the 1970s, 80s, and 90s. Being able to play the console games
    was not the primary objective. As they say at the official MAME site (www.mame.net):


    ... the main purpose of the project is to document the hardware (and software)
    of the arcade games. There are already many dead arcade boards, whose function
    has been brought to life in MAME. Being able to play the games is just a nice
    side-effect.


    Our Linux Toys Arcade Game Player is based on that side-effect. Nicola Salmoria
    began the project in 1996, more than 100 MAME developers have gotten more than
    300 classic console games running in MAME. These games were created originally
    between 1975 and 2000, with the bulk of the games arising between the mid-1980s
    and early 1990s.


    Games are divided into categories, such as ball and paddle, breakout, climbing,
    driving, fighter, maze, multi-play, pinball, puzzle, quiz, shooter, sports, table
    top, and wrestling. Games you might remember include:


    +   * Donkey Kong

    * Pac-Man

    * Asteroids

    * Air Wolf

    * Space Invaders

    * Qbert'
