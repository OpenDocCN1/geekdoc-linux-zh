  md: '# 306 Appendix C — Basics of Red Hat Linux Installation


    # Red Hat Linux CDs


    Red Hat Linux comes on three installation CDs and three source-code CDs. All you
    need are the installation CDs (which we assume you have before you begin the Red
    Hat Linux installation described here). If you don''t have them yet, you can get
    them from:


    +   - Red Hat Linux Bible — Red Hat Linux comes packaged with several different
    books. I recommend this one because, I wrote it. It also has the least 3-CD installation
    set, instead of just the Publisher''s Edition (on only one or two CDs). Besides
    including the CDs, Red Hat Linux Bible will fill in a lot of the details on installation
    and setup that we don''t have the room for in this book. Software from Red Hat
    Linux 9 will be used to build and test Linux Toys.


    +   - Downloads from the Internet — Go to www.redhat.com/mirrors for a list of
    sites where you can download Red Hat Linux ISO images. If you have at least a
    DSL or cable modem Internet connection, you can download these images in a matter
    of hours. Then you will need a CD burner to burn each ISO to CD. There are other
    ways of installing these images (over the network or from a spare hard disk),
    but downloading and burning is the most common method.


    We based these procedures on Red Hat Linux 9 and the following release. Although
    the projects will work on other versions of Red Hat Linux, we haven''t tested
    all of them, so you''re on your own.


    # A PC


    The personal computer you use for these projects must meet certain minimal requirements.
    Even then, there are some hardware components that won''t work (because because
    of incompatibility imposed by the manufacturer). Here are the minimum requirements
    for a PC to run Red Hat Linux:


    +   - Processor — The CPU must be at least a Pentium-class PC (386 and 486 processors
    are not supported by Red Hat Linux installation). The CPU must be at least a 200
    MHz processor for text mode or a 400 MHz processor for GUI mode. (Those numbers
    relate to the speed at which the processor communicates with other hardware on
    the computer-bus.)


    Besides actual Pentium CPUs, Red Hat supports compatible processors, such as the
    AMD K5, K6, K-2, K-3, and Athlon processors.


    +   - Hard-disk size — Different types of installs require different amounts of
    hard-disk space. Here are the minimum amounts of disk space you need for each
    of the types installs:


    +   - Personal Desktop—1.7GB

    - Workstation—2.1GB

    - Server—475MB (if you select minimum), 5GB (if you select Everything), or somewhere
    in between'
