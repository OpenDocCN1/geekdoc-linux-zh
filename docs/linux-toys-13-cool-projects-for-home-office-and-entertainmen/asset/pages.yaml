    # Server and spool files


    The /var directories are intended to contain data that you share with the public
    and log files contain data about activities on your system. Here are a few subdirectories
    of /var that may interest you.


    +   - log — Logs files of system activity. These include messages (general system
    security messages), boot (messages as system services start), dmesg (messages
    as the kernel starts), lastlog (messages about login attempts), maillog (messages
    about the mail service), secure (security-related messages), xferlog (messages
