  md: '# Creating a Digital Picture Frame


    Once you buy a digital camera and some memory, taking tons of pictures is easy:
    What you need now is a way to display tons of pictures and still leave room on
    your coffee table for, well, coffee.


    The cost of old laptop computers has come down to the point where you can pick
    up a useful machine for about $50. We think that $50 (plus a few dollars for a
    frame), is a pretty fair price for creating a functional computer as well as stylish
    Linux Toys Digital Picture Frame.


    The approach to this project is to:


    +   * Install Red Linux and Toys software on an old laptop computer.

    * Add images to the laptop.

    * Adapt the laptop computer to fit in a picture frame.

    * Display the images in the frame at intervals.


    Because this is primarily a hardware project (the software is pretty simple),
    we''ve included a lot of pictures that Chuck took during the process of building
    the project. The trick is to get all the hardware out of the laptop case and into
    the picture frame so that all you see is the picture frame (and maybe a little
    wire or two running off behind it).


    When you are building the Linux Toys Digital Picture Frame, you will have a way
    of displaying your family photos that fits into your decor as any other fine accessory.
    And if you hate the way you looked at your senior prom, don''t worry. The digital
    picture frame will be on one another in a minute.


    Figure 15-1 shows what your completed digital picture frame might look like.


    | Caution | We need to talk with some serious concerns here. First of all, if
    your laptop has a warranty, you''re going to void it. If you''re a kid, don''t
    do this without an adult (and especially don''t do it to your dad''s laptop without
    asking). You''re dealing with electricity here, so unplug the laptop and remove
    the battery before you start screwdrivers into. If you can''t afford $50 for the
    laptop, don''t do this project. If you have important data on this machine, for
    ''goodness'' save copy it off there because it''s quite possible you will lose
    it. And by the way, don''t run with scissors.


    # chapter 15


    # in this chapter


    +   * Choosing hardware

    * Installing Red Linux and Toys software

    * Adding digital images

    * Dismantling the laptop

    * Installing components into the picture frame'
