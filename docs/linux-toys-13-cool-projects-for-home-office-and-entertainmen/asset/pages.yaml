    # # What''s in the Home Broadcast Center?


    The hardware and software you use for this project are very similar to those used
    in the Home Video Archive project in Chapter 4. The biggest differences are that,
    in Chapter 4, you copy video input to hard disk and burn it to CD or DVD, while
    in this project you take video input and stream it out to another computer over
    a network.


    The ffmpeg contains tools for both compressing the streaming video and acting
    as a server to handle client requests for the streaming video/audio. You can use
    xavrt to adjust the video, depending on the type of computer you are playing the
    streaming video on, you can use one of different players to play back the video
    stream.


    You want a PC with a fast processor, a network interface card, and a video card
    and TV card that are up for the job. Then, you need to decide if you are streaming
    television input from your antenna, cable TV, or dish to another computer in the
    house or connecting a video camera of some sort to capture the video you want
    to stream.


    # ## Step 1: Gather the hardware


    For this project, you need to consider the hardware and software you need for
    both the server (which is streaming the video) and the client (which is playing
    the video).'
