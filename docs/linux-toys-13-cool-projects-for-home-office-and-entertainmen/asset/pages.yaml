  md: '# # Chapter 11 — Be a Mini ISP 207


    That completes the basic configuration of your Mini ISP server. The next section
    describes how to support your users and maintain your Mini ISP.


    > If people cannot access services from your server, try flushing the firewall
    rules temporarily by typing iptables -F. If the service is then available, restart
    iptables and step through the process of finding which port needs to be open (Flushing
    your firewall presents a security risk so, if possible, try to test the firewall
    in a safe environment.)


    # # Supporting Users and Maintaining the Mini ISP


    While my friend Pat was with taking me the fine penguin images you see in this
    book, his brother called him. He had given his brother an email account on his
    server, and his brother was having trouble getting through to the server. After
    about 10 frustrated minutes of the server''s fine, tell me what you did," Pat
    hung up and went back to the penguins. If you set up a Mini ISP, expect such issues.


    Whether or not you provide the 24/7 support, if you give a friend user account,
    they''re going to expect support. To make that job easier, there are a few things
    you might want to do on occasion to keep your Mini ISP working well. This section
    describes some support and maintenance issues.


    # # Prepare user account information


    You should prepare a sheet of information for each client that can be used to
    connect to your service. Here''s the information you need to provide to each client,
    with examples of that information:


    | Information | Example |

    |---|---|

    | Phone number | 201-555-1212 |

    | User name | mcwatson |

    | Password | MkMeyeDay |

    | Mail server | mail.example.com |

    | FTP server | ftp.example.com |

    | Personal Web pages | www.example.com/~mcwatson |


    Be sure to use good passwords. Also, of course, you will use your own domain and
    host names for the mail and FTP servers.'
