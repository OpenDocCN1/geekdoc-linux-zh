  md: '# 118 Part II — Entertainment Projects


    # Running Xmame as Arcade Games


    With Xmame running happily on your computer, you may want to make that machine
    into a dedicated arcade game player. There are a lot of ways you could turn your
    PC into a dedicated Xmame Arcade Player. The following procedure will result in
    a computer that lets you:


    +   * Boot up the PC to an Xmame login screen

    * Log in under a game name (such as robby or pacman)

    * Have the game start immediately in full screen mode

    * Exit back to the login screen when you are done


    Here''s the procedure:


    Before you begin the procedure, create an xmame command line for each game you
    want to run from your arcade console. One way to do this is to rustibus from a
    Terminal and tune the game. Once it''s tuned, run the game from rustibus and either
    cut-and-paste or copy the xmame command line that appears in the Terminal window
    for the game to use later in this procedure.


    ![](img/93c80330322e65d5105a6014afe2d85d_145_0.png)


    +   1. As root from a Terminal window, add the following lines to your /etc/inittab
    file:

    * Run Xmame login inlevel 4

    mm:4:respawn:/usr/X11R6/bin/xdm -nodemon

    2. Copy the Xmame logo to the xdm directory:

    * /cd /etc/X11/xdm/pixmaps

    * cp /usr/share/pixmaps/rustibus/defaults.snap .png

    * convert defaults.snap defaults.xpm

    3. Edit the /etc/X11/xdm/Resources file so that the logoFileName is set to use
    the defaults.snap file. Here is an example of the line:

    login*logoFileName: /etc/X11/xdm/pixmaps/defaultsnap.xpm

    4. Create a user that represents the game. For example, I''ll create for Bobby
    Roto called robby. As root from a Terminal window, type:

    * useradd robby

    * password robby

    New password: *****

    Retype new password: *****

    You can use the name of the game as the password or any password you like.

    5. Log out and log in as the new user name.'
  merge: -1
