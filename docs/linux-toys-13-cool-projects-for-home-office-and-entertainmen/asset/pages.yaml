    # # Operating the Car Manually


    To check if your car is working from Linux, log in to Linux and open a Terminal
    window. From the Terminal window, you can run the ltrc-manual.pl script as follows:


    ```

    $ /usr/local/bin/ltrc-manual.pl

    ```


    With the script running, use the keyboard to go forward (K), back (J), left (H),
    right (L), and stop (N). The Lynx-PORT board should make click-clack noises with
    each key press. Lights for each relay should go on and off. If your car moves
    around as it should, type Ctrl+C to exit from the script. Next, try running some
    preset patterns.'
