  md: '# Perform administrative tasks


    Having a public server is like owning a store in a major city. You have to expect
    that someone is going to be testing whether he or she can sneak in the back door
    or even in the front door and try toloft something.


    Even though you may not have critical data on your server, it would still be annoying
    if some-one were to break in and crash your computer. Or, possibly worse, they
    might just take over your machine and use it to forward SPAM or launch attacks
    on others. Here are a few tasks you can keep your server safe and up running:


    +   - Backups — Make a schedule for backing up your server''s data. With the way
    we have described this process, you want to back up at least the /home and /etc
    directory struct-ures. The frequency of your backups depends on how critical your
    data resources are and how much they change. Think of it as: Could you recover
    from a total loss of data from today, the past week, or the past month? Should
    you backup whatever you cannot afford to lose.


    +   - Log files — Linux system files are contained in the /var/log directory.
    Logs of particular interest include messages, secure, mailog, and vsftpd. Also,
    for your Web site, in the /var/log/httpd directory, you might be interested in
    the access_log and error_log files.


    In the old days, you''d run a full backup once a week and then take incremental
    backups on a daily basis, all done on magnetic tape. It is still important to
    take regular backups, but for most situations, there''s little reason anyone to
    do that on magnetic tape. Hard drives are far cheaper than tape drives and can
    be written over many times than a magnetic tape could. Consider an investment
    in "hot swappable" hard-drive bays to run your backups to. Do a full backup each
    night to the removable drive and bring it to a secured location during the day.
    The primary benefit is recovering data from a hard drive is much faster than from
    a tape drive. Another scenario we use often at Quantum Linux Laboratories is rsyncd
    LVM snapshots. An elaborate script creates a LVM snapshot volume for each of our
    customers and the latest data is rsync to the master volume. This enables us to
    do a full backup of a company''s data in minutes and keep all revisions of that
    data in a minimal amount of space.


    ![](img/93c80330322e65d5105a6014afe2d85d_235_0.png)


    # Using Your Mini ISP


    Armed with the information in the paper you just gave them, your clients should
    be able to set up their dual dial-up configuration to reach your server. Once
    they''re on, there are lots of ways they can use it. Here''s a rundown:


    +   - Configuring dial-up networking — On many Windows systems, that consists
    of opening the Dial-Up Networking window (from My Computer) and adding a new connection.
    That procedure prompts for the phone number, user name, and password provided
    on the paper you filled out.'
  merge: -1
