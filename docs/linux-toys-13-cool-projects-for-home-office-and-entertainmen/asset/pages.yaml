    # Checking for broken hardware


    After you tried to turn on the PC, there are a few components you can check that
    might not be working on a used computer:


    +   - Fans — Check that all the fans are running. There is a fan on the CPU heatsink
    and one or more on the chassis. A fan that isn''t working might have caused damage
    to other parts because of overheating.(The heatsink is a small piece consisting
    of little metal partitions that allow heat to dissipate from the CPU).

    - Power supplies — If the PC won''t turn on at all, it may have a burned out power
    supply. That PC might be a bargain (who knows, it isn''t running). If you buy
    a computer with a burned out power supply, it will cost about $20 to get a new
    250W ATX power supply to find out what you have. That''s fairly cheap if you end
    up with a nice motherboard, but again, you won''t know until it boots.

    - Hard disks — A computer that begins the boot process but doesn''t start an operating
    system might have a hard disk drive. Disk prices have dropped dramatically in
    recent years, so used ones can be for just a few dollars. Because you can pay
    about $60 (or) for a new 250GB hard disk, you can imagine what a 5GB hard disk
    might cost if you just want to build a toy. If the data is critical on the computer,
    however, I recommend you buy a new hard disk or frequent backups.

    - Monitors — With new 15" CRT (cathode ray tube) monitors beginning at $100, monitors
    that don''t cost too much to repair. Used 14"–15" monitors that work can be had
    starting at $10.While is not as much of a problem as it was in the old days, CRT
    screens can dim over time. Also, power supplies can burn out.


