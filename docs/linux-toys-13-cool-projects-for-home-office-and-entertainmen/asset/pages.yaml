    # Burning Videos to CD or DVD


    Red Hat Linux contains tools for making disk images of your videos or other files
    and burning them to CDs or DVDs. When you store them in standard ISO9660 format,
    these disks can be read by any Linux, Windows, or Mac computer. Here is a procedure
    for taking one or more video files and burning the resulting disk image to CD
    or DVD.


    +   1. Make the video files into an ISO image using the mkiso command. For example,
    change to the directory containing the video file or files. Then create the disk
    image as follows:


    ```

    # cd /usr/local/share/homevideo

    # mkisos -r -o party-06152003.cd party-06152003.avi

    48.69% done, estimate finish Wed 4 02:58:55 2003

    97.44% done, estimate finish Wed 4 02:58:56 2003

    ```'
