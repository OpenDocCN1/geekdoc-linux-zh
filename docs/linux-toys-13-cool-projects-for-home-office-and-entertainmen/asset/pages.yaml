  md: '# Chapter 4 — Building a Digital Home Video Archive 67


    # Step 1: Gather the hardware


    Video is demanding on a computer. The most important considerations when it comes
    to choosing the computer hardware for the project is getting a fast enough processor,
    a good-quality video card, and a supported TV capture card.


    Besides the PC, you need a way to feed the videotapes into your computer. That
    can be done using several different pieces of hardware, including a VCR or a camcorder.


    # The personal computer


    Although the project may work on slower processors, we are recommending the minimum
    processor to be a Pentium II. We also recommend using 192MBB of RAM for reasonable
    performance.


    # CPU and RAM


    Video really beats on the computer''s processor and memory. The faster the processor
    and the better the RAM can keep up, the fewer frames will be dropped. If too many
    frames are dropped, the output begins to look choppy and audio begins to drift.


    Table 4-1 shows values (in the right column) for the basic components of your
    PC for this project. It also shows the components I used on an extra PC I had
    lying around the house that has less than the specs we recommend.


    | Table 4-1 PC Components for Digital Video Archive |

    | Component | My cheap PC | Recommended (for good results) |

    | CPU | Pentium 3, 650 MHz | Pentium 4, 1 GHz |

    | RAM | 384MB | 1GB DDR |

    | Hard Disk | 40GB | 120GB |

    | Size to get reasonably smooth video playback | 352 × 240 MPEG-1 | 1024 × 768
    MPEG-1 |


    Red Hat installs at least 192MB for any graphical install and recommends at least
    192MB for good performance. Don''t expect any reasonable performance below these
    numbers.


    Besides getting a supported TV capture card (described later), I did add a larger
    hard disk to my cheap PC. Beyond the requirements to install Red Hat Linux, you
    need a lot of disk space for storing the compressed video. Otherwise, you will
    find yourself cleaning up your hard disk so not to run out of space. Space requirements
    can vary depending on the type of compression, frames per second, frame size,
    and, of course, how much you want to store on the hard disk.'
