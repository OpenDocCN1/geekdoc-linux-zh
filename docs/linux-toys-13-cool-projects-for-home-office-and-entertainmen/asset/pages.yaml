    or any other CD ripper for that, to copy CDs that you don''t own or distribute
    copies of CDs to others. The Jukebox should be used only to privately store and
    play music that you own.


    # Configuring the Linux Toys Jukebox


    The general steps for configuring and using your Linux Toys Music Jukebox are
    as follows:


