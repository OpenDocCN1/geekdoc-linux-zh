    # Using command history


    The shell saves a history of the commands you typed (in fact, it saves the 1,000
    most recent commands you typed). If you type long path names or complicated command
    options, there''s no reason to retype them. Just recall a command you ran previously,
    run it again as it is, or edit the command line to do something different.


    To see a list of the commands in your history, type:


    ```

    $ history | less

    ```


    Press the space bar to page through your history; then type q to quit. To just
    see the past 10 (or other number) command lines you ran, type the following:


