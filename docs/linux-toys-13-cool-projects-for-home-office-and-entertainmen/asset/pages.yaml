    We increased it to 30. You can reduce it if you like it. However, a setting below
    15 FPS causes the picture to appear jerky.

    VideoSize- VideoSize — Sets the size of each captured image. We set ours to 512
    (pixels) by 384 (pixels high). Smaller images will perform better, but will be
    harder to see or won''t scale. (The default is 16 × 128).


