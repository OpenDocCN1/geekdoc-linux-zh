- img_proc: true
  md: '# 132 Part III — Projects for the Home


    # A Lesson in ... Dial-out Internet Connections


    Yes, you can use a dial-up modem as your Internet connection for the Linux Toys
    Home Network server. There are just a few drawbacks:


    +   - Slow as molasses — You know how slow dial-up is from one computer. When
    a few people are using the connection at once, it will drag.

    - On-demand dialing — Dial-up connections aren''t made to be up all the time.
    So you need to configure your Red Hat Linux Home Network server to dial out when
    one of your tries to reach the Internet and to turn off after it has been idle
    for a while.


    To adapt this project to use a dial-up Internet connection, skip the second Ethernet
    Card. Then use the Network Configuration window to configure outgoing modem connections
    (click System Settings → Network from the Red Hat; choose Add.) Later, when I
    describe how to set up routing, you will route to the ppp0 interface you created
    (instead of eth1).


    To configure demand-dialing to dial up your ISP each time your LAN tries to get
    on the Internet, modify the /etc/sysconfig/network-scripts/ifcfg-ppp0 file so
    that these lines appear at the beginning:


    ```

    DEMAND=yes

    IDLETIMEOUT=900

    RETRYTIMEOUT=30

    ```


    This causes your modem to connect only on demand. After 15 minutes (900 seconds)
    of inactivity, the modem disconnects. If the modem disconnects when you want it
    connected, another dial-out attempt is made after 30 seconds.


    Both Ethernet cards should appear on the Network Configuration screen. In our
    example, I''m using the first Ethernet interface (eth0) to connect to the LAN
    and the second (eth1) to go to the Internet. Here''s how:


    +   - Click eth0; then select Edit.

    - Click to remove the check next to Configure Using DHCP.

    - Type the Ethernet address as 10.0.0.1 and netmask as 255.255.255.0.

    - Click OK.'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# Chapter 7 — Creating a Home Network


    5. If your ISP is using DHCP to give you an IP address for your Internet interface
    (eth1), you don''t have to do anything (it should already be set to use DHCP).
    Here are the other possibilities:


    +   - Permanent IP address—If the ISP gives you a permanent IP address (net-mask),
