  md: '# Chris and Chuck welcome

    to the Linux toyshop


    if the idea of remodeling an old laptop into a digital picture frame has your
    palms tingling, take this book home. That''s one of thirteen cool projects these
    two experts will teach you how to build using a PC, a few spare parts, and a little
    Linux. You can build single-use projects on an old PC, or simply add “Toys” to
    your high-end


    Christopher Negus is the author of all editions of the bestselling Red Linux Bible
    as well as several other computer books. A Linux aficionado, Chris recently wrote
    his house with Chuck and Gat writing so he could build more toys


    Chuck Wilber is an experienced Linux system administrator, programmer, and founder
    of Quantum Linux Laboratories. He''s president of the Tacoma Linux User Group
    and a devout hardware tinker.


    Red Hat Linux® box. Just be sure someone knows where you are — in case there''s
    an emergency before you''re finished.


    ![](img/93c80330322e65d5105a6014afe2d85d_363_0.png)


    # The Toys


    Each with a complete materials list and detailed, illustrated instructions


    +   1. Music jukebox

    2. Home video archive

    3. Television recorder/player

    4. Arcade game player

    5. Home network server


    +   6. Home broadcast center

    7. Temperature monitor

    8. Telephone answering center

    9. Mini ISP

    10. Web-hosting service


    +   11.DogHouse Linux with BSD games

    12. Toy car controller

    13. Digital picture frame


    # CD-ROM INCLUDES


    System requirements:


    ISBN 0-7645-2508-5


    ![](img/93c80330322e65d5105a6014afe2d85d_363_1.png)'
