    +   Video camera (optional) — Again, to have Internet races


    # A controller board


    Anyway, the LynX-PORT multipurpose I/O board from Marrick, Inc. (www.marrickltd.com
    is made to manage a variety of low-voltage devices from your computer. The board
    works with X.10 security systems and X.10 motion sensors. It can be used to manage
    a variety of devices, including audio components, garage doors, sprinkler systems,
