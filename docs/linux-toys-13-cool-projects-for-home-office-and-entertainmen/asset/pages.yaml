  md: '# 138 Part III — Projects for the Home


    > > After you edit the iptables manually, don''t edit it again using any of the
    Firewall Configuration screens. If you do, it will erase the NAT firewall rules
    we have build (along with everything else). Just use the GUI to you a nice set
    of rules to start with.


    # Configure the firewall initially


    Using the Firewall Configuration screen (either during installation or by starting
    the Security Level Configuration window with Red Hat Linux running), here are
    the settings I recommend you start with:


    +   - Customize — Select Customize so you can set some custom firewall rules.

    - Trusted devices — Assuming that eth0 the interface to your LAN, click eth0 in
    the Trusted devices box. This way, any requests coming from your LAN won''t be
    blocked by the firewall. Besides allowing the computers on the LAN to browse the
    Web and get e-mail, it will allow them to use other services that you offer from
    the server (such as Samba file and printing sharing).

    - Allow incoming — By default, you won''t communications outside of the LAN to
    be accepted. One exception is DHCP. If your server gets the IP address for its
    interface to the Internet from an ISP''s server, you click the check box next
    to DHCP.


    # Add NAT to the firewall


    You can''t communicate directly to the Internet with private IP addresses, such
    as the 10.0.0.X addresses we recommend. For reason, we have to set up our firewall
    to what is called Network Address Translation (NAT). NAT translates the private
    addresses so that they appear to come from the one public address representing
    our connection to the Internet.


    To do this, we have to add a few lines to the /etc/sysconfig/iptables file that
    contains your firewall rules.


    If you are using a dial-out modem as your connection to the Internet, instead
    of NAT you could use a feature called IP masquerading. The common belief is that
    IP masquer works better on interfaces where the address is set dynamically, as
    dial-out interfaces or set by DHCP.


    Here is an example of a line to add to the iptables file to make NAT work for
    your LAN. Assuming that your interface is on eth0, and you are connected to a
    device (such as a DSL modem) that has address 192.168.0.1 (and your address is
    192.168.0.2), add this to the end of the file:


    ```

    - POSTING -o eth0 -j SNAT --to-source 192.168.0.2

    ```


    If your ISP gave a permanent IP address for your Internet interface, you could
    use instead of 192.168.0.2. For a dial-up interface to the Internet, you could
    use an IP masquerading line instead. Here is an example:


    ```

    - POSTING -o ppp0 -j MASQUERADE

    ```


    The line just indicates that the IP address assigned to your dial-out interface
    (ppp0) is used to translate your LAN''s network addresses. You can also use the
    MASQUERADE line if'
