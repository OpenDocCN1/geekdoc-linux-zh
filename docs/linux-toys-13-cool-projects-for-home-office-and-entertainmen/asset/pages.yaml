    # Tips for Using Your Home Broadcast Center


    There are opportunities to improve your streaming video and audio from both the
    server and client side. Here are a few tips:


    # Improving the streaming video server (ffserver/ffmpeg)


    We figured out that, in general, if you add the audio and video bitrates and double
    them, you''ll know approximately how much bandwidth you are going to consume from
    your server. For example, with video set to 128 kbps and audio set to 32 kbps
    (which together is 160 kbps), we found that one stream pretty much filled up the
    256 kbps upload speed Chuck has on his cable modem service.


    If you are broadcasting on your LAN, even though your LAN could easily handle,
    say, 800 kbps of data your TV card can put out, you may not want to raise the
    bitrates to high. Having ffmpeg send at, for example, about 640 kbps will help
    prevent bottlenecks that can occur from slow processors. *'
