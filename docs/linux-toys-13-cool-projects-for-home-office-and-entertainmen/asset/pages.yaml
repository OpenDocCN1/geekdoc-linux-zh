  md: '# Sound card


    Most supported sound cards that contain a joystick port will work for this project.
    Chuck and I both used inexpensive soundblaster cards that work well. See Chapter
    3 for information on configuring a sound card in Red Hat Linux.


    # Joystick


    Most any joystick that can connect to the joystick port on your sound card will
    work for this project. I''ve been using a Logitech Wingman joystick that my wife,
    Sheree, picked up at Goodwill for $1.99 (can girl shop, or?) Most games work with
    a stick that has four directions and two buttons (shooting, jumping, or whatever
    the game does).


    ![](img/93c80330322e65d5105a6014afe2d85d_135_0.png)


    You might be tempted to use a keyboard instead of a joystick. This will work just
    fine for a single-player game. When you get to multiplayer games, the keyboard
    has some limitations. A keyboard is a "polled" device. This means that the computer
    asks the keyboard many times per second if a key has been pressed. If two users
    hit a key at the same time, only one of the keystrokes will make it through the
    computer. An example of that situation happens in certain games that all you hold
    a button for extended periods of time, perhaps to shoot a gun. If your opponent
    hits a button while you are holding down the fire button, your ship will stop
    firing, and control will revert to the other player until you lift your finger
    and repress the button. This can be very disruptive and might allow one player
    to have an unfair advantage.


    # Step 2: Install Linux and arcade software


    As we said, a Personal Desktop type of Red Hat Linux should work for this project.
    If you want to put together the Linux installation yourself, make sure that you
    have at least the following Red Hat Linux software installed:


    +   - The X Window System

    - GNOME desktop environment (actually, only the GNOME libraries are required)

    - Joystick (for configuring the joystick)


    The Linux Toys Arcade Console software is contained on the Linux Toys CD. To install
    the software, use a Terminal as root user and type the following commands:


    ```

    # mount /mnt/cdrom

    # /mnt/cdrom/ch06-Arcade/install.me

    ```


    You see indications that the software packages are being installed.


