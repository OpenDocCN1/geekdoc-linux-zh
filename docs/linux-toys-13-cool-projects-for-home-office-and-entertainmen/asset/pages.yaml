    # More Stuff on Linux


    This appendix is intended to be an introduction to Linux in a limited number of
    pages. All the topics covered here, as well as a few more, are described in greater
    detail in Red Hat Bible. Aside from that, the Internet is your best friend when
    it comes to getting information about Linux. Here are a few resources you can
    draw on to help you with Linux:


    +   - Google (www.google.com) — The Google search engine seems the search tool
    for Linux users. If you are having trouble getting your hardware to work, try
    searching for information about your hardware and Linux. For example, to get information
    about an old laptop, try search for "Compac 1620 laptop linux." Here''s a good
    chance that someone else has run into the same problem and has found a solution.


    +   - Linux Documentation Project (www.tld.org) — This is a tremendous repository
    for HOWTOs, FAQs, and many pages related to Linux.

    - Red Hat Web (www.redhat.com) — Red Hat Inc has excellent support and documentation
    resources for its products available from its own website. If you find yourself
    making more of your Linux systems than just toys, you may even registering your
    Red Hat Linux system to get technical support from Red Hat.


