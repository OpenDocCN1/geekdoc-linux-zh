  md: '# Appendix B — ABCs of Using Linux 299


    The first process you see is init, which basically started most of the other ones.
    After the basic operating system processes, the system services are typically
    listed. In the preceding example, the syslog daemon is running to log system messages.
    sshd daemon is running to listen for ssh logins from the network. Also, the sendmail
    daemon is waiting to receive e-mail for your user. Lists of other processes will
    be running for you as well.


    In the left column of ps output is the process ID for each process. The TIME column
    shows how much CPU time the process has consumed. The COMMAND column shows each
    entire line (including options) that was run.


    If you are running a GUI, you will notice that X consumes a lot of processing
    power (the TIME column). Watching the TIME column is a way to look out for run-away
    processes. The PID is another column of interest. If you decide you need to kill
