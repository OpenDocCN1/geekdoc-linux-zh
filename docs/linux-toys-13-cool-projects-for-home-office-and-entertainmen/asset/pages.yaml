    +   - Security cameras — Any security camera that can plug into a coax or RCA
    cable can be integrated into this project. To pick up inexpensive security cameras
    (under $100), you can try web sites as smart.com. Some cameras use BNC connectors
    to connect to RCA output. If you are using it for a security camera, you can often
    go distances up to 300 feet with these.


    ![](img/93c80330322e65d5105a6014afe2d85d_177_1.png)


    Modern video cameras use a CCD (Charged Coupled Device) to translate images to
    electrical impulses. This is the same device the Hubble Space Telescope uses to
    record video. In essence, a CCD is a plate of silicon that reacts to photons of
    light that hit it. The electrical signals are then translated to video by a signal
    processor on board the camera. Consumer-level video cameras as well as Webcams
    are CCDs. In order to keep Webcams affordable, their signal processor is of much
    lower quality when compared with a modern camcorder.


    # Speakers


    Any PC speakers will do for this project. You can plug speakers directly into
    the TV capture card (when you are watching TV input) or to your computer''s sound
    card (when you are playing back). If you have patched your TV card into your sound
    card, you can just leave the speakers plugged into your sound card.


    # Ethernet card


    The Ethernet card is needed to connect to the network. No dial-up modem will be
    fast enough to handle the streaming video/audio. You can broadcast television
    to other computers on your LAN if you don''t have a DSL, cable modem, or better
    connection to the Internet.


    # Client computer


    Because the streaming video is actually played on a computer besides the server,
    the client that plays the video must have a player that supports the file format,
    audio, and video codes that ffmpeg is streaming. In Linux, you can use mplayer
    to play the streaming video. On a Windows computer, you can use Windows Media
    Player.'
