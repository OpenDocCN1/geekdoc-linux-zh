    Along with an indication of each type of device, you can see the Linux driver
    that is being used for the device. From this window you can find out the type
    of CD-ROM drive it has, the hard disk space, network card (Ethernet), sound card,
    and video card.


    If you prefer to use the command line, you can run the `lspci` command to get
    similar information.


