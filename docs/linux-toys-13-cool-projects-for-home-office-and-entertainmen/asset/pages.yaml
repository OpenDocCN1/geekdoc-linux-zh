  md: '# VCR


    We wanted to do this project with items that you might already have around the
    house. We figured that most of you would have a VCR you can use to play the videotapes
    that you are recording. If you have VHS-C tapes and no adapter, you can play the
    tapes through a video camera. If you don''t have cables needed to plug your camera
    into the TV card''s Video In, you could probably plug it in through your VCR.


    # Speakers


    Any PC speakers will do for this project. You can plug speakers directly into
    the TV capture card (when you are watching TV input) or to your computer''s sound
    card (when you are playing back video). If you do your TV Line out to your sound
    card Line In, you can leave your speakers attached to your sound card.


    # Step 2: Install Red Hat Linux


    Because you need a GUI for this project, you can begin with a Personal Desktop
    install of Red Hat Linux. Of course, you can just do an Everything install instead,
    which will eat up some disk space, but save you from having to pick the dependencies.


    Appendix C for information on installing Red Hat Linux.


    You can use either GNOME or KDE desktop for this project. If you installed both
    environments (only GNOME is installed by default with a Personal Desktop), a user
    can select which to use from the graphical login screen. GNOME is used by default.


    # Step 3: Install Linux Toys software


    There are a bunch of packages required to encode, play, and produce video and
    audio for this project. The primary packages are the following (look in Appendix
    A or on the Linux Toys CD for a complete list):


    +   - ffmpeg — Tools to convert and capture video and audio input

    - nrec — Tools to keep audio and video synchronized during recording

    - mplayer — A front-end for playing video and audio in a variety of formats

    - vedimag — Tools to create VCD video images that can be burned to regular CDs
    to make Vs


    We created an install script to install the entire set of packages needed for
    this project. To run that script, insert the Linux Toys CD into your CD drive
    and type the following as root user from a Terminal:


    ```

    # mount /mnt/cdrom

    # cd /mnt/cdrom/ch04-VideoArchive

    # ./install.me

    ```


    You are ready to start configuring your Home Video Archive.'
