  md: '# Preface


    With free software and a few odds and ends, you can transform a cheap PC into
    a music or video archive box, a classic game machine, a home network server, or
    a handful of other projects. The only ingredients missing are the instructions
    to do it.


    Enter Linux Toys.


    Despite writing 1000+ pages in Red Hat Linux Bible, I still get questions like,
    “How do I make a home network server?” or “How can I use Red Hat as a dial-in-server?”
    My answer is often something like, “Take a pinch of IP masquerading here, add
    DHCP there, then patch your firewall so and roll it into a bun.


    Linux Toys is our attempt to bring together pieces of software and hardware to
    make some whole (and really cool) working projects. Because we are building them
    in Linux, the sky is the limit on where you can go with them. Add your own network
    connections, graphical interfaces, or back-end databases to project, and you could
    grow our “Toys” into powerful home or office tools.


    # Where Did the Toys Come From?


    Linux Toys come from all over the place. Well, all over the Internet, anyway.


    When Chuck and I sat down to plan Linux Toys, we came up with a list of projects
    we could do with Linux and add-on software. We wanted each Linux project to be
    entertaining or useful or fun (preferably) all of the above.


    Armed with our list, Chuck set out to find the free software that would suit our
    projects, and then integrated those pieces. A few worked quite easily, while others
    he glued together with Perl scripts or configuration settings. In one case, the
    string of patches Chuck sent into a project resulted in him taking over the project''s
    maintainer.


    Every now and so, I sat on the floor of Chuck''s office with his dog, Heidi, as
    Chuck showed me the latest Toys project. I took it home, to re-create it on my
    computer, and then write it in the chapters of this book. After, our editor, Kevin
    Pedro, would take the projects and see if he could get them working as I described.


    Some of the projects are built purely from software that comes with Red Hat Linux.
    (Red Hat Linux is the basis for all our projects, except for DogHouse Linux in
    Chapter 13). Other projects are built almost completely from outside, stand-alone
    projects (such as VOCP in Chapter 10). Some require additional hardware, such
    as a TV card, a relay board, or a camera. Some will run on minimal hardware (DogHouse
    Linux) and won''t (anything video).


    ![](img/93c80330322e65d5105a6014afe2d85d_10_0.png)'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Preface


    As we progressed, we found some of the projects to be really useful (we both have
    Linux Toys music players and digital picture frames running in our homes). Some
    projects were challenging to get running — in particular, video and voice modems
    are difficult. Other projects were just fun in a really dumb way (Look, my toy
    car can do figure!); We hope that we have removed, or at least reduced, some of
    the more harrowing issues. When you are done, (we hope) end up with only working
    projects but also a heightened imagination as to what you can do with Linux.


    And remember: You can build more than just toys with this book. You can begin
    building a connection to a community of thousands of developers and millions of
    users around the world. To learn more, you can join a mailing list, read HOW-TOs,
    and even visit our own LinuxToys.net site to draw in more resources to help you
    on your journey with Linux.


    # How This Book Is Organized


    There are six parts to this book. The numbered parts, Part I contains introductory
    material. Part II, III, IV, and V contain the actual projects. The final section,
    consisting of the appendices, contains information on getting and installing software,
    as well as a few basics on using Red Linux. Here are expanded descriptions of
    the sections.


    # Part I: The Basics


    Chapter 1 lays out the approach to the Linux toys projects. Chapter 2 goes into
    detail about finding hardware and software.


    # Part II: Entertainment Projects


    Chapters in this part contain sound, video, and game projects. Chapter 3 describes
    how to make a music CD ripper and player. Chapter 4 tells how to turn your home
    videos into digital files that you can store and play on your computer. Chapter
    5 describes how to install and set up a television recorder and player. Chapter
    6 tells how to use MAME software to create a classic arcade game player.


    # Part III: Projects for the Home


    These chapters contain useful home projects. Chapter 7 describes how to set up
    Red Linux as a home network, allowing other client computers to share an Internet
    connection, files, and printers. Chapter 8 describes how to broadcast streaming
    video, so you can watch from your computer at work or broadcast to a couple of
    friends. Chapter 9 describes how to put together a temperature monitor and use
    it to monitor weather from your Linux system. Chapter 10 tells how to set up a
    voice modem in Linux that can be used to take telephone messages and mail those
    recorded messages to an e-mail you choose.


    # Part IV: Small Business Opportunities


    While intended as exercises than as real business opportunities, the projects
    in this section describe the technology that Internet Service Providers and Web-hosting
    services use'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Preface


    their servers. Chapter 11 tells how to set up Red Hat Linux as a dial-in server
    for a shared Internet connection, a DNS server, and an FTP server. Chapter 12
    describes how to set up multiple servers on a single computer, so friends and
    associates can have their own Web sites (complete with individual domain names).


    # Part V: Just for Fun


    This part contains projects that are mostly for fun. Chapter 13 describes how
    to make a DogHouse Linux distribution on floppy disk and play a couple of classic,
    character-only games from the 1970s. Chapter 14 tells how to operate a remote
    toy car using a relay board controlled from Linux. Chapter 15 tells how to convert
    an old laptop into a digital picture frame that displays your projects on a rotating
    basis.


    +   All of the projects require a Pentium-class computer or better, except for
    the DogHouse Linux project. Once that project is copied to a floppy disk, it can
    run on most PCs with a floppy drive (including 486 machines).


    ![](img/93c80330322e65d5105a6014afe2d85d_12_0.png)


    # Appendices


    The appendices contain supporting information for the rest of the book. Appendix
    A describes the Linux Toys software that is included with the book. Appendix B
    describes some of the basic Linux skills you need to use this book. Appendix C
    walks you through installing Red Hat Linux.


    # What You Need for the Projects


    For all the projects, you need a PC, the three Red Hat Linux installation CDs,
    and this book. The book includes the Linux Toys CD, which has the software you
    need to add. The Red Hat Linux software can be obtained from Red Hat Linux Bible,
    directly from Red Hat, Inc., or other sources. Many of the projects also require
    some additional hardware and may place special demands on the PC itself.


    Check Chapter 2 for an overview of the hardware and software requirements for
    Linux Toys. Then refer to each project to determine the special requirements for
    each particular project.


    # The Linux Toys CD


    The CD that comes with this book contains the software you need to complete the
    Linux Toys projects. Each chapter describes which packages from the CD you need
    for the project describes. Most of the Linux Toys software is in RPM format (the
    format used to install software in Red Hat Linux).


    Although Linux Toys software was built and tested for Red Hat Linux, we include
    the source code on Linux CD as well. If you are predisposed to do so, it should
    be possible to rebuild most projects for use with other Linux distributions.'
  merge: -1
