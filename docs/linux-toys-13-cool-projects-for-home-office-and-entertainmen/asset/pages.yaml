  md: 'There are some standard controls that will work with most MAME games. To see
    how controls are set for a particular game, press the Tab key. After you press
    Tab, a menu appears that lets you see and change settings for the game. Press
    the arrow keys to select input. Then you can see which keys perform each function
    (and change them, if you like).

    Table 6-2 shows keys that are typically used with many games. Table 6-3 shows
    keys that are used to resize the Xwindow game.


    # Table 6-2 Starting, stopping, and displaying controls


    | Keys | Result | Keys | Result |

    |---|---|---|--|

    | 1 | Select one player | 2 | Select two players |

    | 5 | Insert a quarter | 6 | Insert two (or more) quarters |

    | P | Pause | Tab | See and change specific game settings (press Tab again to
    return to the game) |

    | Esc | Return to the game (when viewing menus) or quit (during game) | F3 | Reset
    the game |

    | F8 / F9 | Reduce or increase frame skip | F10 | Speed throttling (toggle on
    and off) |

    | F11 | Show speed display (toggle on and off) | Shift+F10 | Idle sleeping (toggle
    on and off) |

    | Shift+F11 | Profiler display (toggle on and off) | | |


    # Table 6-3 Resizing the game


    | Keys | Result | Keys | Result |

    |---|---|---|--|

    | Left-Shift+Insert | Increase width | left-Shift+Delete | Decrease width |

    | Left-Shift+Home | Increase heightscale | left-Shift+End | Decrease heightscale
    |

    | Left-Shift+PageUp | Increase scale | left-Shift+PageDown | Decrease scale |

    | Left-Alt+Insert | Normal window | left-Alt+Home | Fullscreen mode (DGA) |


    Actions such as moving, shooting, and jumping can be handled by your joystick.
    You can also use keyboard keys to control the game. For example, you can use the
    four arrow keys to move up, down, right, and left. You can use the Ctrl and Alt
    keys to shoot or jump.'
