  md: '# 124 Part III — Projects for the Home


    The home network that you need can be as simple you end up with can help make
    your whole family a little more digital and a little bit cooler. (See Figure 7-1.)


    ![](img/93c80330322e65d5105a6014afe2d85d_151_0.png)


    There are many other types of services you can set up on your Red Hat Linux Home
    Network server. Our approach is to minimize the risk of connecting your home computers
    to the Internet, while maximizing the sharing of basic resources (files and printers
    in particular) between your home computers. Chapters 11 and 12 describe how to
    add dial-in connections and more public services to a Red Hat Linux server.


    # Putting Together the Hardware


    The hardware you need for a home network can be as simple as an inexpensive switch
    or hub and some cables. The computers themselves each need only one Ethernet card
    (except for the server, which needs two). You can get the stuff you need at any
    store that sells computer supplies.


    # Step 1: Gather the hardware


    You need one computer to build this project. That computer will be your Linux
    Toys Home Network server. The following sections describe the components of that
    computer, as well as the other materials you need to set up your network.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Chapter 7 — Creating a Home Network 125


    # The Home Network server PC


    Most any computer that will run Red Hat Linux and has enough slots for two Ethernet
    cards (or has one or both Ethernet ports built-in) can be used as the Linux Toys
    Home Network server. Particular components of the PC are described as follows.


    # Hard disk


    Here is the approximate disk space you will need:


    +   **Red Hat Linux**— We recommend a Server install, with either the GNOME or
    KDE desktop packages added. This requires at least 1GB of disk space. You might
    ask to see a detailed package list during installation for this project, so you
    can pick and choose tools and services you want on your Home Network server.


    +   **File server**— Because this is the only computer expected to be turned on
    in the house all the time, we expect it could be used as the repository for the
    family shared files. While regular text files do not take up much room, family
    photos, and especially videos can take up a lot of disk space. The amount of disk
    space you need varies from a few megabytes to multiple gigabytes of space.


    # CD drive or floppy disk drive


    CDs are the preferred medium for installing Red Hat Linux and the Linux software.
    However, if you are using an old, floppy-only computer, you can install Red Hat
    Linux over the network.


    # Network cards


    Two interface cards are needed in the Linux Toys Home Network server. You probably
    need only one Ethernet card on each client computer in your LAN. If you are using
    a dial-connection to the Internet (not connected), you need only one Ethernet
    card and one modem on the server.


    # Cable modem or DSL


    Get a high-speed (DSL or cable modem) service to your house if possible. The ISP
    will give you the information you need to configure it. Ultimately, you will connect
    the hardware that your ISP recommends into the second Ethernet card (eth1) on
    your Linux Toys Home Network computer.


    # Hubs and switches


    In the most basic case, you can get an inexpensive 100/100 Mbps hub or switch.
    A hub will allow you to connect your client computers and the server at speeds
    of up to 100 Mbps (depending on the speed the Ethernet supports). Unless paid
    bucks bucks your Internet connection, even 10Mbps on your LAN would be good enough
    to send out much data as your Internet connection can handle (and more).


    A new five-port 10/100 Mbps hub can be found for under $30. Low-end switches,
    which have more intelligence and enable to segment your LAN to improve performance,
    are available now for only a few dollars.'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# 126 Part III — Projects for the Home


    A hub broadcasts all data to all nodes connected to it. As the number of nodes
    on a network grows, broadcasting all data to all nodes begins to saturate the
    network, and no useful work can be done. With a switch, all Ethernet nodes contain
    a (supposedly) universally unique identifier called a Media Access Control (MAC)
    address. When an Ethernet frame enters a switch, the switch can make a reasonable
    determination to which port to send that frame based on the MAC address provided
    by the frame. As a result of falling network-equipment prices, it is almost always
    better to purchase a switch rather than a hub, even for a small home network.


    ![](img/93c80330322e65d5105a6014afe2d85d_153_0.png)


    # Wiring


    For the cables connecting your computers to your hub or switch, you want twisted-pair
    wiring that meets or exceeds Category 5 wiring specifications. The cable contains
    four pairs of twisted copper wiring. The connectors on the ends are RJ-45 connectors.


    You can purchase premade cables at any computer store or on the Internet. If you''re
    long running throughout your house, you will want to run the cables and add the
    connectors yourself. As an alternative, you can offer your buddy who works at
    the phone company a case of beer for an afternoon to get started.


    There are a few things to know about computer-network wiring:


    +   - Length — Individual runs of Cat5 cable should not be longer than 100 meters.


    +   - Drop wires to one location — If your computers are not all in one room,
    you should try to have your network all dropped to one location, if possible.
    A good technique is to set up the hub or switch in the basement or a large closet
    and connect your wires all in one place.


    If you put your Linux Toys Home Network server in the same spot, you won''t have
    to listen to the server running all time in your family room when the other computers
    aren''t in. If you are building a new home, you may also want to drop coax (RG-6)
    for cable TV and security cameras, wires for whole-house audio, and Category 5e
    cable for network and phone.


    Figure 7-2 shows a little basement corner for a person whose house is ready for
    his Linux Toys Home network.


    +   - Use switches instead — Because switches and hubs are so close in price these
    days, there''s hardly any reason to have hubs anymore. There are some cases where
    you want to use a switch instead of a hub for sure. A switch segments the communications
    on your LAN, so when computers on the same segment talk together, computers on
    segments of the LAN don''t even see the communication. With a hub, all network
    traffic on the hub can slow down traffic on the hub. So you might want to put
    a switch in high-use computers that are in proximity to each other.


    You can purchase Category 5e cabling in spools of 500 to 1000 feet. You can purchase
    boxes of RJ-45 connectors as well, from computer stores, electrical-supply stores,
    or home centers.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Chapter 7 — Creating a Home Network 127


    Whole-house audio wires


    Coax cable TV and surveillance camera wires


    Category 5e telephone and computer network wires


    ![](img/93c80330322e65d5105a6014afe2d85d_154_0.png)


    Figure 7-2: Drop cables to one spot for a Linux Toys Home Network server.


    # Wiring Tools


    If you buy your cables, you can just plug them into each computer on one end,
    the hub or switch on the other, and go. However, if you are going to make your
    own cables, you need the following tools and components:


    +   - RJ-45 crimping tool — This is used to connect the RJ-45 connectors to the
    Category 5e cable. Both the hub and the Ethernet cards are female connectors,
    so you can add male RJ-45 connectors to each end (unless you are adding a wall
    receptacle or a patch board).


    +   - Network Cable Tester — Get a network cable tester that can test UTP cables.


    +   - Wire strippers — You need a tool to strip the outside covering off of the
    cable.


    Premade cables are appropriate for connecting only a few computers in the same
    room. Once you begin longer runs around your house or office, you will want to
    make your custom-length cables.


    # Step 2: Connect it all


    If your computers are all in one place, simply connect a cable to an Ethernet
    card on each computer; plug the other end into the hub or switch (depending on
    which you are using).

    Figure 7-3 illustrates what your Linux Toys Home Network might look like.'
