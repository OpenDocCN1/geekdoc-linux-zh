  md: '# 282 Appendix B — ABCs of Using Linux


    # The GUI


    GUI stands for graphical user interface. If you selected to have a graphical login
    when you installed Red Hat Linux, Linux will automatically start up your computer
    session in GUI mode after you log in. This means you will be able to operate your
    computer just as you do with a Mac or Windows computer, using:


    +   - A mouse

    - A keyboard

    - A graphical screen (with windows, icons, panels, and menus)


    For Linux, there is one major facility providing the foundation for all graphical
    interfaces (the X Window System), two major desktop environments to use with X
    (GNOME or KDE), dozens of window managers to the look and feel of the desktop
    (metacity, windowmaker, twin, and so on) and thousands of ways you can customize
    your own desktop. Now, forget I said that all.


    To simplify using Red Hat, Red Hat gives you two basic choices of GUI: GNOME or
    KDE. Red Hat made the two environments look pretty much the same. So, whether
    you are using GNOME or KDE in Red Hat Linux, you will start out with the same:


    +   - Background

    - Panel buttons

    - Desktop icons

    - Main menu (pretty much)


    I''ve chosen to describe the GNOME desktop because that''s what Red Hat uses as
    its default. Figure B-1 shows an example of the GNOME desktop.


    # Touring the GUI


    I opened two windows in the previous figure. The one at the top is a Terminal
    window, which opens a shell for typing commands. The lower window contains icons
    for changing preferences of how your desktop works and appears. The panel runs
    along the screen and a few icons appear on the desktop. Instead of describing
    all that stuff in detail, I want to start by taking you a little tour.


    +   1. Log in as a regular user.


    +   2. Start the GUI: If the GUI appears (as shown in Figure B-1), proceed to
    the next step. Otherwise, try typing:


    ```

    startx

    ```


    This should start your desktop. If startx fails saying startx: command not found
    the desktop software may not be installed (see Appendix C for how to install additional
    Red Hat software, GNOME in case). If the command is found but still fails, run
    the redhat-config-xfree86 to configure your video card. There are a few tips on
    setting up a video card in Chapter 4. If you have problems, check out www.xfree86.org
    to find out why your GUI is not working.'
