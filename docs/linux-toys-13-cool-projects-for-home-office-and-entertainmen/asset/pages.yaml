  md: '# Chapter 3 — Making a Music Jukebox 49


    # A Lesson in ... Linux Start-up Scripts


    Most services that are meant to run continuously in Linux are launched from what
    are called start-up scripts or run-level scripts. To understand how these work,
    you need a few definitions:


    +   - Run Level—Because Linux was made for big, multitasker computers, there was
    a need to have Linux be able to run at different levels of activity. By changing
    to different run levels, a Linux administrator can run the computer in single-user
    mode (1), one of several text-based multitasker modes (2 through 4), or with graphical
    interface mode(5). There is also a run that stops Linux (0) and reboots Linux
    (6).


    +   - Daemon—A daemon is a process that runs continuously, in the background,
    waiting for something to happen. "something" is typically a request from a user
    or a program to use a service: "Can I print a document, open a Web page, or send
    a mail message?" The daemon can respond to each request in many ways. It can accept
    the request, reject it, and hand it to another program, or simply log the request
    that happened.


    +   - Start-up script—A start-up script is a human-readable program intended to
    start a service (typically when your computer starts) and (typically when your
    computer shuts down).


    In Red Hat Linux, start-up scripts are stored in the /etc/init.d directory. You
    can type the service command with the option to set the service to start when
    your system boots. That default run level is typically 3 (if you are running in
    text mode) or 5 (in GUI mode). The service command runs on the service for levels
    2 through 5, to make sure it starts in all operational levels.)


    In the case of the Linux Toys Jukebox start-up script (ljukebox), if you set it
    to on, it runs commands that continuously monitor your CD drive (so it can rip
    any CDs you want), listen for requests to the CD database, and play items.


