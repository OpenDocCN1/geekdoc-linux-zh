  md: '# # Building a Television Recorder/Player chapter 5


    The computer is a natural tool for capturing video. It''s true that you need a
    bit (all right, a lot) more muscle in your computer hardware than you do for other
    projects. If you have a PC that''s up to the job, you don''t need much more than
    a TV capture card (and the free software we describe) to record and play shows
    from cable TV or an antenna.


    The state of free personal video recording (PVR) software that runs in Linux has
    taken a large leap forward. While several projects (such as MythTV) are on the
    cusp of becoming excellent full-featured PVRs, we decided to piece together our
    own video recorder/player project that lets you:


    +   * Watch TV on your computer.

    "* Display television listings in your Web browser.

    "* Select shows you want to record; then record them now or later (automatically)
    when the show comes on.

    "* Store and organize recorded shows on your hard disk.

    "* Play back the shows when you are ready.


    This chapter describes the hardware and software you need to create your own Linux
    Toys Television Recorder/Player. The technology for grabbing and encoding your
    television programs is the nrec and ffmpeg packages. Television listings are provided
    by the MythTV project. As the front-end of this project, we chose the WebCRPlus
    interface.


    WebCRPlus and the other components in the Linux Television Recorder/Player are
    meant to be used only for private viewing of television in your home. You should
    respect the rights of those who view the programs you view with this project.
    In general, you should look at this project as an educational tool and not use
    it in a commercial way.


    # in this chapter


    +   * Inside the Linux Toys TV Recorder/Player

    "* Setting up television viewing with xatwv

    "* Getting TV show listings with xMitTV

    "* Viewing listings and recording with WebCRPlus

    "* Recording programs with ffmpeg

    "* Troubleshooting video problems"


    ![](img/93c80330322e65d5105a6014afe2d85d_112_0.png)'
  merge: -1
