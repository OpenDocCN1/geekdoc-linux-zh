  md: '# Chapter 5 — Building a Television Recorder/Player 89


    # Sound card


    You probably need a sound card with this project so that you can patch the Audio
    Jack on your TV card to the Audio Out your sound card. That will let you record
    the audio portion of your TV shows. See Chapter 3 for information on supported
    sound cards. (You can configure your sound card the first time you boot Red Hat
    Linux. Otherwise, use the redhat-config-soundwindow and the sndconfig command
    to configure it.)


    # Cable TV or antenna


    Each TV card has a coaxial connector for input from your TV antenna or cable television.
    You need to have cable connected to your TV card when you view or record television.


    # Step 2: Install Red Hat Linux and Linux software


    All software needed for this project is included in either Red Hat Linux or in
    RPM packages in the ch05-WebVR directory on the Linux Toys CD.


    # Installing Red Hat Linux


    For this project, I recommend an Everything install of Red Hat Linux. As an alternative,
    you can either begin with a Server installation then add the GNOME or KDE desktops
    and xawt or a Personal Desktop install. With a Personal Desktop install, you will
    need server packages, including Web server (httpd package) and MySQL (all mysql
    packages) database used by WebVRplus. You might also have to sort through some
    perl dependencies (we have included the ones you think need on the Linux Toys
    CD).


    > See Appendix C for information on how to install Red Hat Linux.


    During Red Hat Linux installation, you can configure the Ethernet card (if you
    have one) and your video card (refer to Chapter 4 on what to do with an NVIDIA
    card). The first time you reboot Red Hat Linux, you can configure your sound card.
    Your TV card will be automatically detected or you will have to configure it.
    To see if your Hauppauge TV card was detected (other cards use other modules),
    log in as root user and type the following:


    ```

    # lsmod bttv

    bttv 74179 0 (autoclean)

    ```


    If there is no listing for bttv, try loading yourself by typing:


    ```

    # modprobe bttv

    ```


    Later, when you try to run xawt, you can test that the card is working.


