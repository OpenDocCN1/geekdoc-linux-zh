    2. Install and set up Red Hat Linux.

    3. Install the Linux Toys software.

    4. Start the Jukebox.

    5. Load the music.

    6. Play, play, play!


    If you are ready, you can start by gathering the stuff you need to make the Linux
    Toys Jukebox.


