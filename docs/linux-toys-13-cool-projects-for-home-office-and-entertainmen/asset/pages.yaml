  md: '# Chapter 9 — Building a Temperature Monitor 163


    Each DTLT-BASIC kit comes with two sensors: one on the DT1A board and one on the
    SOAW. You can use this1-wire bus as a long line of sensors, placed along the length.
    You could, however, purchase multiple sensors SOAW and use an RJ-11 splitter (the
    thing you would use to split one phone jack to multiple telephones).


    ![](img/93c80330322e65d5105a6014afe2d85d_190_0.png)


    Using a splitter on large networks could result in reflection problems if you
    are reading sensors over different cable lengths.


    As the sensor-on-a-wire temperature sensor is delivered, it is not particularly
    waterproof. If you use it outside, you should make provisions to protect it from
    getting wet.

    Here are some (and some not-so-practical) places to put your DigiTemp sensors:


    +   - **Office or home** — Most people will just put the sensor inside or outside
    of their homes and businesses.

    - **Computer room** — Placing a sensor in your computer room can let you know
    if the room is overheating.

    - **Wine cellar** — Make sure that your fine wines are properly chilled.

    - **Meat freezer** — Check that your side of beef is properly frozen.

    - **Bat house** — Someone actually did this (www.batbox.org) after finding out
    that the temperature inside a bat house affects whether or not a bat will live
    there.

    - **Wherever** — Any other place where you would want to know if the temperature
    is too cold, hot, or just right.


    ![](img/93c80330322e65d5105a6014afe2d85d_190_1.png)


    Temperature fluctuations can result in huge financial losses whenever they occur.
    The implementation of a device of this nature is a cost-effective method of ensuring
    such losses do not occur. If you are serious about such a device, consider building
    it in a small form-factor pack-age as mini-itx (http://www.mini-itx.com) or the
    embedded PC104 platform (http://www.pci04.org).


    # Step 5: Try the DigiTemp software


    To check that your DigiTemp sensors are working, you need to run the digitememp
    command. With your DigiTemp sensor connected, run the following steps (as root
    user from a terminal):


    +   1. As you are connected to the COM1 (ttyS0) port on your computer, run the
    following commands to create a digitemprc in the /usr/local/bin directory:


    ```

    # cd /usr/local/bin

    # ./digitemp -s/dev/tty0 -i

    DigiTemp v3.2.0 Copyright 1996-2003 by Brian C. Lane

    GNU Public License v2.0 - http://www.brianlane.com/

    Turning off all DS2409 Couplers

    ```'
