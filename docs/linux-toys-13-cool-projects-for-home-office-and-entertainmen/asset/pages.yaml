  md: '# 26 Part I — The Basics


    Of Red Hat Linux, you need room for Linux Toys software. Some projects require
    little or no additional software. Others (the jukebox, for example) require a
    lot of space for adding software and possibly much more for your content (such
    as music CDs or video content). Check each project''s requirements just to make
    sure.


    You can use multiple hard disks, if you like. The trick is, that each hard disk
    must be on its own mount point. Use this to make sure that you don''t run out
    of disk space where you need it. For example, having two 4GB hard disks doesn''t
    ensure that you can do an Everything install if you installed one as the root
    (/) partition and the other as /var partition.


    Also, hard drives are not created equally. Hard drives that do not support direct
    access (DMA) or are unable to operate in programmed input/output (PIO) mode 4
    will not be able to effectively record or play video. Refer to Chapters 4 and
    5 for some insights into hardware demands for video recording and playback.


    ![](img/93c80330322e65d5105a6014afe2d85d_53_0.png)


    Logical Volume Manager (LVM) can be used to make disk management more flexible.
    LVM allows you to turn individual disks into what are called physical volumes.
    These physical volumes can be combined to create logical volumes. Logical volumes
    are the same as partitions and are formatted and mounted to the main file system
    as needed. You should exercise caution when using LVM; however, a volume made
    of multiple disks is irreparable if one of the disks that make up the logical
    volume crashes.


    # RAM?


    Random Access Memory (RAM) is another area where the requirements are much higher
    if you are running the Red Hat Linux GUI. RAM requirements for Red Hat Linux are:


    +   - Minimum (text mode) — 64MB of RAM

    - Minimum (GUI mode) — 128MB of RAM

    - Recommended (GUI mode) — 192MB of RAM or more


    The computer can run less than the minimum amounts of RAM? It probably will, but
    you won''t be happy. When the computer runs out of RAM, it tries to store some
    of its critical data in swap space (on your hard disk). If your computer swaps
    every time you open or move a window, your performance suffers drastically.


    RAM has come down so much in price over the past few years that you should consider
    adding RAM (the more the better) to your computer. Here are a few suggestions
    about how you can go about finding the RAM chips to your computer:


    +   - The manual — If you still have, your computer''s manual should describe
    the type of RAM needed by your computer.

    - The Web — There are a bunch of Web sites that help you determine and (in many)
    purchase the RAM that is appropriate for your computer. Here are a few locations
    that have good tools for finding the RAM you need:'
  merge: -1
