  md: '# The Linux Toys Web Sites


    There are two Web sites associated with Linux Toys:


    +   - Linux Toys at Wiley (www.wiley.com/compbooks/negus) — Wiley Publishing,
    the publisher of Linux Toys, maintains a Web page that pertains to issues surrounding
    the purchase and features of the book.

    - Linux Toys Community (www.linuxtoys.net) — Come to the LinuxToys.net site to
    participate in the mailing list and generally share information about the Linux
    Toys projects.


    # Conventions Used in This Book


    On occasion, I will want to highlight code or commands during a procedure. Here
    are some examples of text that is marked differently along the way.

    Sometimes in a procedure, I want to make a distinction between what you type and
    what is returned. In those cases, the entire input and output is set in this monospaced
    font, and the part that you type is bold. For example:


    ```

    # ssh toy

    root@toy''s password: ********

    Last login: Thu May 22 12:58:49 2003 from music.linxtoys.net

    #

    ```


    In this example, someone used ssh toy, then typed a password (indicated by the
    asterisks in bold). The rest are the responses from the computer. This example
    shows a command typed to the shell. If you are new to Linux, you typically open
    a Terminal window to get to the shell. A prompt ending in a pound sign (#) means
    you are the root user when you run the command; when you see a dollar sign ($),
    you can use any.


    Special icons for Notes, Chuck''s Tech Tips, Cautions, and Cross-References will
    appear from time to time. Those paragraphs contain an extra bit of information,
    a special way of showing something, to watch out for, or to pointer to another
    chapter, respectively. Here''s an example:


    ![](img/93c80330322e65d5105a6014afe2d85d_13_0.png)


    A Note contains an extra bit of information.


    On occasion, I stop to expand on a feature that we happened to run into in the
    course of a procedure. In those cases, where I want to say more than a few words
    to expand on an opinion, I will tell the information in a sidebar, where the title
    begins with "A Lesson in . ." Here''s what it looks like:'
  merge: -1
