  md: '# Summary


    You can leave your Linux Toys Home Network server up and running all the time
    (or turn off when you don''t expect anyone to use the network for an extended
    period). While it''s running, it will act as a firewall, router, and boot server
    (DHCP), so the client computers on your LAN can immediately connect to the Internet.


    Your Linux Toys Home Network server can be the focal point for the rest of your
    home network. It can become a Windows file/print server (using Samba). It can
    also be a place where you can log in and access any Linux Toys on your network
    (such as the music jukebox or digital picture frame) and change songs, playlists,
    or images on those computers.'
