  md: '# chapter


    # # Be a Mini ISP


    id know that all the basic software you need to be an Internet Service Provider
    (ISP) is right in Red Hat Linux (and most other distributions of Linux for that)?
    You can set up Linux to allow dial-in modems and routing to the Internet, as well
    as offer Web publishing, e-mail, and file transfer (FTP or other services).


    The challenges of being a real ISP come from issues of service, support, maintenance,
    billing, and reliability. But, if you''re willing to stuff all that and just build
    a low-cost, dial-in-ISP service to share with a couple of friends, family members,
    or co-workers, we get a nice project for you. When you are done creating your
    Mini ISP, here is what you will have:


    A dial-in server (with 33.6 Kbps modems) that lets your clients:


    +   * Connect to the Internet.

    * Publish personal web pages.

    * Upload files to be stored or published.

    * Get their personal e-mail.


    A public Internet server that lets you:


    +   * Have your own domain name.

    * Create a public e-mail server.

    * Create a public Web server (described in detail in Chapter 14).


    While the server may not help you launch the business opportunity of a lifetime,
    it will let you learn some of the basic tools used by ISPs. You will end up with
    a useful server that you:


    +   * Dial into while you are on the road.

    * Use to allow your out-of-work brother-in-law to have an e-mail account (and
    a way to get to it).

    * Give a nonprofit organization a cheap way to get online.


    Who knows? Your dial-in modem and PC could help get your friends who are otherwise
    disconnected get connected to the Internet. (See Figure 11-1.)


    # in this chapter


    +   * Learning what''s in the Mini ISP


    +   * Setting up network interfaces and modems


    +   * Configuring DNS, routing, and firewalls


    +   * Adding mail, Web, and FTP services


    +   * Using the Mini ISP'
  merge: -1
