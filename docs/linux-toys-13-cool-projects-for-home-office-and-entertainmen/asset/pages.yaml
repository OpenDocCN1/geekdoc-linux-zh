    # Getting Game ROMs


    The stickiest part of MAME is legally obtaining the game to play with. The games
    that you play in MAME are referred to as ROMs. ROMs (which stands for read-only
    memory) represent the games that were extracted from game cartridges and put in
    a form that can be played on a computer by MAME.


    Even though the games that run in MAME are no longer being sold by the companies
    that created them, those still maintain copyrights to those games. That''s why:


    +   - Nintendo distributes commercial game ROMs with MAME.

    - You should not pass around copies of game ROMs.


    There are three games in the public domain that you can use with MAME. Those three
