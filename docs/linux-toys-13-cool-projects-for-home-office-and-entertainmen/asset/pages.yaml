  md: 'At this point, you have a working digital picture frame. You should be able
    to switch it on and have the pictures begin displaying after a minute or two.
    Next, let''s hope, you''ll be able to have it working after you take it apart
    to put it in a picture frame.


    # Step 6: Tune your laptop


    You want your digital picture frame to run continuously and not shut down. To
    make sure that your screen doesn''t blank out after a while, you should go into
    the computer''s BIOS and disable power management. Power-management features take
    the form of turning off the screen, shutting down the hard drive, suspending,
    and processing. Disable all that if you can.


    # Step 7: Adapt the laptop to the picture frame


    With the laptop set up to play the pictures, you can start adapting it to fit
    in a picture frame. Besides the laptop, you need a picture frame and some tools
    (described in Step 1). In the process of adapting the laptop we used, we removed
    the following components:


    +   - CD-ROM drive

    - Floppy drive

    - Keyboard

    - Battery

    - Modem

    - Lots of plastic


    Chuck also wanted to remove the mouse pad, but it was used for connecting the
    hard drive and the BIOS battery, so he couldn''t. You might be able to remove
    yours, however.


    After removing components, you''ll need to have the keyboard handy (or have an
    extra keyboard to plug into the PS/2 port on the back), so you can turn off the
    components in the BIOS that you remove. Basically, what will you have left are:


    +   - Motherboard

    - Screen

    - Fan

    - Optional network card (in PCMCIA slot)


    With the approach we took, you will be able to connect to the digital picture
    frame through your Ethernet card without opening the frame. To use the keyboard
    or other components, you''ll have to open the frame and reconnect them.


    For what I did, you didn''t need to do any soldering. If you want to get fancy
    and have all of the ports hanging out the back, you''ll have to remove the ports
    from the motherboard. You can do that with a soldering iron and some wire (probably
    just some 24-gauge wire that comes in a Category 5E cable; as long as it''s less
    than six or so inches) to extend the port.


    ![](img/93c80330322e65d5105a6014afe2d85d_293_0.png)'
