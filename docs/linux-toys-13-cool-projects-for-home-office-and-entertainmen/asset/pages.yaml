  md: '# 262 Part V — Just for Fun


    # Step 2: Install and configure Red Hat Linux


    Run a Personal Desktop or an Everything install of Red Hat Linux (see Appendix
    C). If you want to try to a smaller installation, you need to make sure that you
    have at least the following packages:


    +   - XFree86— Contains the X Window System server that provides the graphical
    interface needed for the digital picture frame

    - ImageMagick— Contains the convert command, used by the digital picture frame
    to convert images to the proper size

    - xloadimage— Contains the xview command, used by the digital picture frame to
    display the images


    During configuration of Red Hat Linux, you are asked if you want to configure
    your network. If you have an Ethernet card on your laptop, I recommend that you
    configure it to work on your local network. Refer to Chapter 7 for information
    on configuring a local area network (LAN) and adding a digital picture frame to.


    # Step 3: Install Itpicframe


    The Itpicframe package comes on the Linux Toys CD. It contains a simple script
    that takes a directory of images, converts them to appear properly on your screen,
    and rotates the display of these pictures. To install the Itpicframe RPM, do the
    following:


    +   1. Log in as root to Red Hat Linux and open a Terminal window (or other shell).

    2. Insert the Linux Toys CD and type the following:

    3. Install the Itpicframe package by typing the following:

    - rpm -Uhv --force /mnt/cdrom/ch15-PictureFrame/ltpicframe-**


    ```

    mount /mnt/cdrom

    ```


    ```

    rpm -Uhv --force /mnt/cdrom/ch15-PictureFrame/ltpicframe-*

    ```


    # Step 4: Get the images


    To use the Linux Digital Picture Frame, you need to add images to a directory.
    You tell the picture frame script the name of that directory, and it will display
    images from there at set intervals. So right now you want to load up the directory.


    By default, we use the /usr/local/images directory. You should choose a regular
    user to own the images directory. That way, you don''t have to log in as root
    to add the images. You should have created at least one regular user account when
    you first installed Red Hat Linux. For example, if your user account is named
    chuckw, you should type the following to have that own the images:


    ```

    chown chuckw /usr/local/images

    ```'
