  md: '# Chapter 13 — Linux on a Floppy and BSD Games 233


    # Configuring DogHouse Linux


    To be able to fit on a floppy disk, DogHouse Linux was created as a 1.4MB file
    referred to as a disk image. To use DogHouse Linux, you need to copy that 1.4MB
    image to the floppy disk. Then just stick it into a computer and boot it up. Here''s
    what you


    # Step 1: Gather the hardware


    The computer on which use DogHouse Linux doesn''t have to have a CD drive. However,
    you need to have access to a computer with a CD-ROM drive to be able to create
    the DogHouse Linux floppy disk. So to get started you:


    +   - A computer (Windows or Linux) with a CD drive and a floppy drive to create
    the DogHouse Linux floppy disk

    - A blank 1.4MB floppy disk

    - A PC (doesn''t matter what is on it) with an available floppy disk drive to
    use the DogHouse Linux floppy


    # Step 2: Create the DogHouse Linux floppy


    Follow this procedure to create your DogHouse Linux floppy:


    +   - Insert the Linux CD into the Windows or Linux computer.

    - Insert the blank, writable 1.4MB floppy disk into the floppy drive.

    - Copy the DogHouse Linux disk image to floppy disk. How do you that depends on
    whether you are using a MS-DOS system:

    - Windows — Open an MS-DOS window. Then determine the drive number of your CD
    drive (possibly D or E), and copy the DogHouse Linux disk image to floppy disk.
    For example, if your CD drive is D, use this from the MS-DOS window:

    > cd d:\ch13-DogHouse

    > rewrite -f doghouse.img

    - Linux — Open a Terminal. If the CD didn''t mount automatically, you need to
    mount it as root user (as shown in the first command that follows). Then you can
    copy the DogHouse Linux image to floppy disk as follows:

    # mount /mnt/cdrom

    # cd /mnt/cdrom/ch13-DogHouse

    # dd if=doghouse.img of=/dev/fd0


    +   - Pop out the floppy disk and mark it DogHouse Linux.


    You should now have a bootable copy of DogHouse Linux. Now you can try it.'
