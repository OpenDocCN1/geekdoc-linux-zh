    t domain-name-servers IP addresses shown (123.45.67.1 and 123.45.67.2) to reflect

    t DNS server addresses from your ISP.


    After that, here are a few other things to consider:


    +   - Lease Time — A lease in DHCP is the amount of time that a client gets to
    use

    an IP address before renewing it. The default lease time is 21600 seconds (six

    hours), but the client can request a lease time of up to 42000 seconds (12 hours).
    The DHCP server

    reclaim it. If the client doesnt renew the lease time expires. On a large network,
    you might make these values larger (so the

    server doesn''t get hit too much). If you like, you could use 295200 and get 30-

    days. In Red Hat''s preconfigured dhcpd, the value is 86400 (one day).

    - DNS updates — If you set up a DHCP server that manages the computers on your

    LAN, as addresses are assigned to the client computers on your network using

    DHCP, you can pass information to your DNS server. This is a very cool, very

    powerful feature. It lets you address the computers on your LAN by name, even

    thor their addresses may keep changing.


    Because we are not setting up a DNS server for this project, we turn off this
    feature\(dns-update-style none). If you decide to go it alone, however, and set

    down DNS for LAN, set the dns-update-style to interim to turn on

    this feature. Type dhcpd.conf and find the section titled "The Interim

    DNS Update Scheme" for further information.


    +   - IP address range — Using 255.255.255.0 network with a 10.0.0.0 IP number,

    as assign 10.0.0.0 as the network number. Excluding 0, 1 (our server), and 255,
    it

    t us with an address range of 2 through 254. We are going to use addresses

    10.0.0.200 to assign to any computer on the LAN that asks for

    address. Until you add your toaster and electric toothbrush to your network—(which
