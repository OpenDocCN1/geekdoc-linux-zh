  md: '# Chapter 3 — Making a Music Jukebox


    # # Rebuilding the CDDB database


    You can rebuild the CDDB database after any updates to your local CDDB database
    to make searches of the database more efficient. Updates can come in the form
    of:


    +   - Automatic updates (if you get official feeds from the master CDDB).

    - Installs of mostly official CDDB updates. To download these updates, go to the
    downloads-section of freedb.org and look for the latest file labeled freedb-update
    (each update file includes the date of the update in name). Copy the file to /usr/local/share/cdcddb.
    Use bzip2 and tar commands to compress and untar to the proper location.

    - Manual updates you do yourself (like the one shown x sed).


    Rebuilding the database takes a long time I usually rebuild it when I don''t need
    the computer for a couple of hours. Here is what you do to rebuild your local
    CDDB database:


    +   1. Open a Terminal as root user.

    2. Turn off the jukebox software by typing:


    ```

    # service ltukebox off

    ```


    +   3. Run the cddb command with the f (create the fuzzy matching hash file, so
    the database can get inexact matches), d (run in debug mode), and v (verbose)
    options, as follows:

    # /usr/local/bin/cddb -fdv


    You can restart the jukebox now, and the new CDDB information should be available.


    # # Changing ripping options


    The cdparanoia command rips the songs from your CDs with the music jukebox. The
    oggenc encodes the songs. The result is compressed music in OGG file format that
    doesn''t have a discernible loss of quality.


    If you are an audiophile and have a different idea of what "discernible loss of
    quality" is, you might want to spend additional disk space for a better quality
    music. You are also free to use different encoding and playback tools. Here are
    some suggestions on ways you can modify your jukebox rips and compresses:


    +   - Encoding quality — To change the quality level the oggenc encodes your music,
    you need to edit the following line in the /usr/local/bin/ltourip script:

    my @encoder_opts = qw -m 4 -q 6 /;


    The number 6 defines the quality level being used. You can change this to a number
    between 0 and 10 (for example, -q?). You aren''t limited to integers (a quality
    of 5.5 is to use). You may want to try out a few different levels. Higher numbers
    result in bigger files and better quality.'
  merge: -1
