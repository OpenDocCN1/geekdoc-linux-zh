- img_proc: true
  md: '# 206 Part IV — Small Business Opportunities


    # Step 9: Add user accounts


    You need to create a user account for every person you want to be able to log
    in and use your server. That same login will be used for remote login (via SSH),
    Internet access, mail server access, and other services you may care to add.


    Here are the steps you can go through create user accounts (as root user from
    a Terminal window):


    +   1. Add a public_html directory to /etc/skel so that directory will be created
    in each user''s home directory when you create each user. Also change the permissions
    so the Web server can read from it. Type:


    ```

    # mkdir /etc/skel

    # chmod 755 /etc/skel/public_html

    ```


    +   2. Add each user account. For example, to add a user named mcwatson, you could
    type the following:


    ```

    # useradd -m mcwatson

    ```


    +   3. Add an initial password for the user. For example, as root, type:


    ```

    # passwd mcwatson

    ```


    +   4. Change the permission of the new home directory so that execute permission
    is open (otherwise, the Web server will not be able to read the Web content):


    ```

    # chmod 711 /home/mcwatson

    ```


    Users can change the password later by logging in and running the passwd command
    again.


    # Step 10: Open the firewall


    Ways to configure firewalls are described in Chapter 7. Once the firewall is up
    and running, you need to open up holes in it to allow network services to be used
    by people using the server from the Internet. Here is a list of ports that need
    to be opened to allow the services in this chapter:


    +   * Web server (http) — Port 80

    * FTP server (ftp) — Ports 20 and 21

    * DNS server (domain) — Port 53

    * Remote login (ssh) — Port 22

    * Mail service (smtp) — Port 25

    * Mail retrieval (pop3) — Port 110


    After you have updated your firewall rules, restart the iptables firewall as follows:


    ```

    # service iptables restart

    ```'
  merge: -1
