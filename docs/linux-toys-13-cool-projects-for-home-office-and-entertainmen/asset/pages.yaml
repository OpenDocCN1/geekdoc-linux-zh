  md: '# Part II — Entertainment Projects


    # Removing music you hate


    When you weren''t looking, your brother slipped a CD of the Greatest Hits of John
    Philip Sousa into your CD jukebox. And while you do love marching-band music,
    it just doesn''t go with the contemporary mix you were establishing for your jukebox.
    (Or you might just be running out of disk.)


    To remove a song or an entire CD from your jukebox, you can use the same rm command
    used earlier. To remove a whole directory of stuff, you can use the -r (recursive)
    and -f (force) options. The directory will disappear, without asking any questions.
    For example:


    ```

    # rm -rf /usr/local/source/music/John_Philip_Sausa-Greatest_Hits/

    ```


    Be really with the -rf options to rm! A misplaced asterisk or improper space between
    music/ and could cause your jukebox to be erased! However, it is convenient to
    remove an entire directory, as well as all files and subdirectories under that
    point.


    ![](img/93c80330322e65d5105a6014afe2d85d_87_0.png)


    # Checking the CDDB log


    Anything the cddbd daemon is logged in the /usr/local/share/cddbd/log file. By
    checking the contents of this file, you can see:


    +   - All requests made for CDDB information by your jukebox. Each time you rip
    a CD, you can see each ID that is queried and the information that the daemon
    returns. This is useful if you want to see what ID is being requested when a CD
    is rejected (usually it is not in the database).

    - Requests from over the network for your CDDB database. If you have a network
    connection (and opened your firewall to allow connections to port 8880), others
    can request information from your CDDB database. All those requests are logged
    in this file.

    - Database updates. If you have set up your CDDB to accept automatic updates (with
    the post option), you can see these updates in the log.

    - Other error conditions. If there are problems with entries in your CDDB or problems
    starting the server, they are logged in this file.


    The size of the log file is determined by the log_hiwat and log_lowat-parameters
    in the /usr/local/share/cddbd/access file. Information is rotated once the log
    file size has reached its limit. You can increase these values to store more log
    information.


