- img_proc: true
  md: '![](img/93c80330322e65d5105a6014afe2d85d_222_0.png)


    If you want to have more modems than you can plug into your two COM ports, you
    should consider purchasing a serial port board. We didn''t test any for this project;
    however, in the past I used PC/X boards from Digi International (formerly called
    Digiboard). Red Hat Linux contains drivers for these boards. If you install the
    kernel-source package in Red Hat Linux, you can read about how to configure Digi
    ports boards in /usr/src/linux-2.4/Documentation/digiboard.txt.


    # Network hardware


    Your real ISP will tell you what kind of hardware you need to create your high-speed
    Internet connection. Typically, you will need an Ethernet card on your server
    to connect to the DSL modem, cable modem, or other equipment.


    # Step 2: Install Red Hat Linux


    Install Red Hat Linux as described in Appendix C. You need to do an Everything
    installation or a Server installation (adding all server packages). In addition,
    you may want to add either the GNOME or KDE desktops if you are not comfortable
    working from the command line.'
