  md: '# Chapter 5 — Building a Television Recorder/Player


    3. Click Video Recorder Configuration. The Video Recorder Configuration page appears.
    Change options related to video recording and click Save. The key to configuring
    this page is the last field: Recording Program. With the default Recording Program
    Presets set to ffmpeg, here is how the Recording Program appears (the backslashes
    indicate that all lines are active on one):


    ```

    /usr/bin/ffmpeg -d /dev/dsp -n -v /dev/video0 -w 512 -h 384 \\

    -v vc mpeg2 -input $SOURCE# -norm #NORM# -v $QUALITY# \

    -ac mp -F $TIME#30 -o $OUTPUT#.avi

    ```


    The recording command is /usr/bin/ffmpeg. In most cases, this command will work
    without modifications. The options to command the audio device (-d) to /dev/dsp,
    the stereo (-s), video device (-v) to /dev/video, the width of the stream (-w)
    to 512 pixels and the height (-h) to 384 pixels. The other values on the command
    line are options that are taken from settings in WebVCRplus window. Here is how
    the command is composed:


    +   -vc $CODEC# — The -v option takes the value of the Code field and translates
    it into the code used in the command line. For example, with avi/mpeg set, when
    CODEC is replaced, the option looks like -vc mpeg

    -input $SOURCE# — The -input option is set to Television by default, with the
    contents of the Recorder Source field. You will leave this for for TV recording.

    -norm #NORM# — The -norm value sets the type of video being received to NTSC from
    the Norm field. Outside the U.S., you might be using PAL as the type of video.

    -vq $QUALITY# — The -vq option sets the video quality from the value in the Recording
    Quality field. The default is 0 to set the recorder to use variable bit rate for
    recording.

    -ac mp2 — The -ac option sets the audio output to mp2.

    -F $TIME#30 — The -F option sets the number of frames that the recorder will record.
    The $TIME# value is replaced by WebVCRplus with the number of seconds that the
    recorder will go. The value is multiplied by 30 (for 30 frames-per-second). The
    intent is to have WebVCRplus automatically feed the length of the recorder that
    will run.

    -o $OUTPUT#.avi — The -o option sets the output file, based on the television
    being recorded. The .avi on the end of the file indicates that the recording is
    an AVI file.


    The other field you can change on this stream is the Channel Changing Program.
    We assign the xawtv command (described earlier) to WebVCRplus to change the channel
    before starting to record. It reads channel information from the /root/.xawtv
    file.


