    the sample rate on your outgoing messages, run the vgetty-test.pl script as follows:


    +   1. Log in as root user.

    2. From a Terminal window, type the vgetty.pl command as follows:


    ```

    # /usr/local/bin/vgetty-test.pl

    Enter full path to getty voice.conf file

    [/usr/local/etc/mgtty-sendfax/voice.conf];

    ```


    +   3. Press Enter to accept the location of the voice file being used. You are
    prompted for the modem to use:


    ```

    Enter modem device (ttyS0 /dev/ttyS0)

    [modem]:

    ```


    +   4. Press Enter to accept the modem (which represents /dev/modem) as the device
    to which your voice modem is connected. You are prompted to select where the sound
    will be played when you try to play files to test your modem:


    ```

    Select output for vm command. Possible values are:

    ter selection [2]: 6

    ```


    +   5. We selected 6 for internal speaker (even though it played on our external
    modem speakers). If you don''t hear anything during the test that follows, you
    can run the command and try a different output location. Next, the script begins
    testing for each type of modem (actually chipset and compression level) it knows
    about:


    ```

    Running vm play for Digi 4 - hit ^C (Ctrl-C) once to abort

    Could you hear the sound test file? [n]

    ```


    +   6. If you do not hear the sound, type a n and it will continue to test other
    modem types. If you heard the sound clearly (Kevin''s hearing the proper pronunciation
    of Linux Types), there was a MT_56400 modem we use, or a MT_5634 selection that
    worked, for each Rockwell 2 or Rockwell 4 (We chose Rockwell 4).


    +   7. When you finally find a working modem setting (and press y), VOCP changes
    the configuration file to use your settings. It also converts all message files
    (/var/spool/voice/messages and its subdirectories) to use the proper compression.
    The settings used to convert the messages to the proper modem type and compression
    rate are displayed when the script exits. Here''s an example:


    ```

    ltdconfig Rockwell 4 7200:

    ```


    When we create our voice messages later, we can convert them to the proper format
