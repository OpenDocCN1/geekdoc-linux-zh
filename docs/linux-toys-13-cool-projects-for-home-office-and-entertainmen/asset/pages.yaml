    # Step 6: Set up disk quotas


    To limit the amount of disk space that each user (or in our case, Web site) can
    consume, you can use a feature called disk quotas. To use this feature, we are
    assuming that you created a separate /home partition when you installed Red Hat
    Linux. If that is true, proceed with the following steps (as root user from a
    terminal window):


    Note

    ![image](image_0.png)

    Before you start, you must have created /home as a separate partition, as described
    earlier. Otherwise, you can add quotas to the /home partition, which is less efficient
    in our case. If you don''t care how much disk space each user consumes, you can
    skip this step.


    +   1. Open the /etc/fstab file in any text editor as root user. Find the partition
    attached to the /home directory and add quota to the comma-separated list of options.
    Don''t change anything on that line, unless you know what you are doing. For example,
    if /home is on /dev/hda3, here is how that line might appear after you edit it
    (the text in bold is what I added):


    ```

    /dev/hda3 /home /ext3  defaults,usquota 1 2

    ```


    +   2. Make sure that no processes have anything in /home open (including any
    shells). Then unmount and remount /home as follows:


    ```

    # umount /home

    # mount /home

    ```


    +   3. To create a quota.file for the /home partition, type the following:


    ```

    # quotacheck -c /home

    ```


    +   4. To create quotas for a particular user, use the edquota command. (You will
    need to use vi to edit this command.) For example, here''s how to do it for a
    user named chuckwick:


    ```

    # edquota -u chuck

    Disk quotas for user chuck (uid 502)

    Filesystem blocks soft hard inodes soft hard

    /dev/hda3 5201 0 33 0 0

    ```


    This shows that the user chuck has created 33 files / directories on the partition
    and is currently using 5201 blocks of space (about 5.1MB). You can set soft and
    hard limits on both blocks and inodes. For our purposes, we are going to limit
    blocks to 300MB soft and 500MB hard. To do that, I changed the last line to appear
    as follows:


    ```

    /dev/hda3 5201 307200 512000 33 0 0

    ```


    If the user goes over the soft limit, he has seven days to go back under that
    limit or be blocked from writing anything further to the partition. If the user
    tries to exceed the hard limit, he gets an immediate write failure.'
