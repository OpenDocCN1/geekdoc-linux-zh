  md: '# 234 Part V — Just for Fun


    # A Lesson in . . . Disk Images


    A disk image is a file that has been copied, bit-for-bit, from an entire floppy
    disk, CD, or even a hard disk partition or other medium. The advantage of this
    kind of file is that it can be used to easily reproduce the whole contents of
    the original medium.


    These days, floppy disk images are often used when you need to install software
    on an old computer that doesn''t have a CD drive. For example, if you have Red
    Hat Linux on CD, the images directory on the first CD contains floppy disk images
    you can use to install Red Hat Linux from a network.


    If you have a high-speed (like DSL) connection to the Internet, you can download
    CD images in a few hours. CDs are often stored as ISO images, which refers to
    the ISO-9660 standard that defines their structure. CDs in this format can be
    used on Linux, Windows, and most operating systems.


    With a copy of a disk image on your computer, you can mount that disk image (provided
    it''s in a file system known to Linux) to view its contents. For example, here''s
    how you could copy and mount a boot disk image from the first Red Hat Linux installation
    so that you could view its contents from Linux. Insert CD and do the following
    as root user from a Terminal window in Red Hat Linux:


    ```

    # mount /mnt/cdrom

    # cp /mnt/cdrom/images/bootdisk.img /tmp

    # mkdir /mnt/bd

    # mount -o loop /tmp/bootdisk.img /mnt/bd

    # ls /mnt/bd

    ```


    The ls command will show you the contents of the bootdisk.img file, as they would
    appear on the floppy disk. You can do this by loop mount using any kind of disk
    image that Linux identify. When you are done, leave the directory and type umount
    /mnt/bd.


