    # ## User files and directories


    Users generally keep all the files and directories they create in their home directories,
    located as subdirectories of /home. It is intended that, if there are multiple
    people using a Linux system, each person can set his or her own environment and
    save private files using these separate /home directories.


    Unless you set up directories for shared projects or to allow users a place to
    add to their own Web or FTP users are not expected to change files outside of
    their /home directory or /tmp directory. Even Web and FTP content is often shared
    from subdirectories of users'' own directories. (See Chapters 11 and 12 for examples
    of using a user''s home directory to add content for Web pages.)


    # ## Device files


    Files are used to represent everything in Linux. Hardware devices are no exception.
    Access to your sound card, display, modem, floppy drive, CD drive, hard disk,
    and other types of hardware are gained through files in the /dev directory.


    As a user, you can mostly ignore the /dev directory. However, there are cases
    where you need to know the names of your hardware devices. For example, you may
    need to mount a CD (/dev/cdrom) or floppy disk (/mnt/fd). Or you may need to identify
    the location of a modem (/dev/modem), video source (/dev/video0), or a particular
    Terminal window (/dev/pts/*).


    # ## Permanent commands and source code


    User commands are stored in /bin and /usr/bin. Administrative commands are in
    /sbin and /usr/sbin.


    In the old UNIX days, almost everything was stored under the /usr directory (commands
    and data). Later, when data was expected to be changed to the /var directory structure,
    /usr was intended to be a more stable directory structure that could be safely
    shared among multiple machines in Linux


    We use subdirectories to /usr (in particular /usr/local) to install many of our
    Linux projects. Another subdirectory of /usr that may interest you is /usr/src.
    The /usr/src directory is where the source for the Linux kernel and other software
    packages is installed.'
