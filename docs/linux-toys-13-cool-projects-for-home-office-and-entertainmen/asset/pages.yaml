    file.


    # Summary


    Although the Linux Toys Jukebox is intended to rip and play your CD music collection
    without much help from you, there are plenty of ways to play with it and expand
    it if you like. You can play music manually (using the ogg123 command) or from
    playlists you create. Because the player jukebox contains a full CDDB database,
    you can even turn your jukebox into a CDDB server that shares artist, album, and
    song information from CDs with others.'
