  md: '# 244 Part — Just for Fun


    ![](img/93c80330322e65d5105a6014afe2d85d_271_0.png)


    The larger purpose of this project is to provide a proof of concept and see where
    it takes us. Problems such as positional feedback and obstacle avoidance make
    the project interesting-one to tackle. Consider enhancements such as video and
    audio feedback in order to create a roving security sentinel for your house. Perhaps
    you''re away from your house and you get a call from your alarm company informing
    you of a security concern at your house. You could use an Internet connection
    to direct your sentinel to view and record the source of the alarm.


    # About Controlling Toy Cars


    There are hundreds of different kinds of radio control (RC) toys available today—besides
    cars, there are toy boats, airplanes, blimps, motorcycles, and even turbine-powered
    jets. We thought it would be fun to connect some RC cars to a computer and illustrate
    how you can use Linux to control the cars.


    The concept is to open up the RC car''s controller and then connect it into a
    computer running Linux to operate the controller. We used a LynX-PORT board to
    connect our toy car controller in such a way that it could be plugged into a serial
    port on our Linux machine.


    With a PC, the port board, a few parts, and a bit of soldering, we were able to
    get the toy car running from Linux in not much time.


    # Configuring the Toy Car Controller


    The general steps for configuring the toy car controller are as follows:


    +   1. Gather hardware.

    2. Install Linux and Toy Car software.

    3. Wire up the controllers

    4. Test your car.


    # Step 1: Gather hardware


    The main hardware items you need for the project are a PC, a controller board,
    and a toy car. You need a few tools and other items (listed following) to connect
    it all together as well.'
