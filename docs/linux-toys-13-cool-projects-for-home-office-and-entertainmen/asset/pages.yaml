  md: '# chapter 3


    # Making a Music Jukebox


    Even back in the days when playing music on my computer meant playing in a CD
    and listening on some dinky little speakers, I thought it was fun to do. Now,
    with the audio tools in Linux (and a few others added) you can do a whole lot
    more, such as:


    +   - Copy your music CD to hard disk (called ripping)


    +   - Store the music efficiently, using open source compression techniques


    +   - Gather title, artist, and other information about each CD and song


    +   - Play back your songs individually, from a playlist or at random


    +   - Hook up your computer to your stereo equipment to get higher-quality sound


    This chapter describes how to build a music jukebox in Linux on your PC. The basic
    project is a stand-alone CD ripper/player that continuously pumps out the music
    you add to it. With the enhancements described later, you can use the same jukebox
    to be a Compact Disc Database (CDDB) ripper and play songs in different ways.


    # in this chapter


    +   - Setting up the music jukebox


    +   - Ripping and playing music


    +   - Using a CD database


    +   - Playing songs remotely


    +   - Creating playlists


    +   - Checking for problems


    # About the Linux Toys Jukebox


    The Linux Toys (jukebox) project is a simple CD ripper and player, built on some
    cool technology. At its core is the Red Linux operating system, with music compression/playing
    tools (we chose Vorbis compression and the Ogg file format) and the CDDB database
    (in our case, CDDB.org) built from.


    The basic PC for this project requires a sound card, a CD drive, and a large hard
    disk (I''ll expand on this a bit later). A keyboard and monitor are optional once
    the jukebox is set up. However, you might want to add a network (or keep your
    keyboard/monitor connected) to make changes to your collection or CDDB database
    going forward.'
  merge: -1
