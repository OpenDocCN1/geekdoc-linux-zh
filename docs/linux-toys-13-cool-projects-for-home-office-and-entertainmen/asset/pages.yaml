  md: '# Making a Home Broadcast Center


    # chapter 8


    There''s no reason why any video that comes into your Red Hat Linux computer has
    to stay. Using tools such as ffserver and ffmpeg, other computers can connect
    to your Red Hat Linux server and view video that you stream out on the network.
    That network be:


    +   * Your local LAN (where you can pump out video to the LAN almost fast as you
    can process it)


    +   * The Internet (where you can reduce the quality a bit, but still get decent
    performance across a DSL, cable modern, or better connection)


    Think of the possibilities! You could:


    +   * Set up surveillance camera at home and keep an eye on your house from your
    computer at.


    +   * Let Grandma in Florida watch little Timmy''s birthday party live from Washington.


    +   * Broadcast a television program from your Red Hat server to your laptop as
    you sit in the garden.


    +   * Start your own 24-hour-a-day, all-Chris, all-the-time Internet broadcast
    outout from your basement.


    Well, that one will work if you dont have more than one or two people watching
    at a time. And they don''t mind that the video locks up once in a while. And if
    your name is Chris. Remember, video in Linux is still in its early stages. But
    hey, you can get in on the ground floor!


    This chapter steps through setting up streaming audio and video on a Red Hat Linux
    server using tools from the ffmpeg package. It covers how you get video input
    (television, video cameras, and Webeams). Then it describes how clients on your
    LAN or the Internet can play the video that you are streaming out on the network
    on their computers.


