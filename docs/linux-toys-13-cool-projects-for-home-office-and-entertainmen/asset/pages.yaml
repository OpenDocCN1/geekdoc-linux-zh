  md: '# 22 Part I — The Basics


    +   - boot.log—Shows start-up and shutdown of different system services were successful.

    - dmesg—Contains messages from the kernel ring buffer, to see messages that occurred
    during the boot process. You can see names and addresses of the hardware devices
    it finds and modules that are loaded.

    - messages—Contains more detailed messages of processing that occurs during system
    startup. This file also continues to gather information about processing that
    goes while the system is running.

    - XFree86.0.log—Includes details about the processing of your XFree86 video driver.


    Armed with the information I just described, I have most of what I need to evaluate
    whether or not my computer will work for Linux Toys. I can also use this information
    if I have problems and need to ask for help from a Linux mailing list or support
    organization.


    Of course, if you do not have Linux installed, you may have to boot Windows to
    find hardware information about your computer.


    # Evaluating hardware in Windows


    If you currently have a Windows operating system on your computer, you can view
    information about your computer hardware from a Device Manger (or similar) window.
    For example, here''s how you can see hardware information in Windows XP:


    +   1. From the start menu, you could select Control Panel.

    2. Open the System icon. The System Properties window appears.

    3. Click the Hardware tab.

    4. Click the Device Manager button. The Device Manager window appears, as shown
    in Figure 2-2.

    5. Click any of the items listed (display adapters, network adapters, processors,
    and so on) to find information about that item.


    With information about your computer, you can query the Red Hat Linux Compatibility
    List (http://hardware.redhat.com/hc1) to see if your hardware is supported. You
    can also use a search engine (such as google.com) to check whether your hardware
    is supported (try searching for the name of your hardware followed by the word
    Linux).


    If you feel the computer you have work fine with Linux, you can skip the rest
    of the hardware descriptions in this chapter and continue to the section on finding
    open source or go right to the project you want to start. The next several sections,
    however, will help you if you want to:


    +   - Go out and buy a PC for the projects

    - Upgrade selected pieces of your computer to make it run better for the projects'
