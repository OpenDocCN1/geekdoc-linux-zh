  md: 'To figure out possible problems, you should attach a keyboard and monitor (or
    log in over the

    network) and try a few things:


    +   - Trying the CD to make sure that it contains music and is playable. (Even
    if it is

    playable, however, it could still be too scratched to rip).

    - If you simply have to find a way to add the CD information to your CDDB database,

    refer to the "Adding CD information to the CDDB" section earlier in this chapter.

    - To find out your hard disk is full, type df -h.


    # Temp files left behind


    If you eject a CD or stop the jukebox while a CD is ripping, it will probably
    leave some files

    behind in /tmp. This is not a big deal, but over time they could add up. After
    the CD is no

    l longer, you may run the /tmp files as follows:


    ```

    # rm /tmp/*.wav

    ```


    As root user, the rm command runs interactively, you are asked if you want to
    delete each

    file that is there (type y to delete them). The asterisk causes all files in the
    /tmp directory that

    begin with * and ends with .wav to be deleted. Be careful how you use asterisks
    and other

    wild-card characters! An asterisk by itself will match every file and directory
    in the chosen

    directory:


    ![](img/93c80330322e65d5105a6014afe2d85d_86_0.png)


    In reality, having too many tmp files isn''t a big problem. A feature called tmpwatch
    runs auto-

    matically to delete any files in the /tmp directory that have been there for more
    than 10 days.


    # Errant processes


    If a CD is in the middle of ripping when you turn off the jukebox, cdparanoia
    (the

    ripping application) may keep going. After you turn off the jukebox, you can check
    if any

    cdparanoia processes running. Here is one way to do it:


    ```

    # ps ax | grep cdp

    1570 /1 D 00:1 /usr/bin/cdparanoia -qw 1 /tmp/tmp.15531.wav

    ```


    You can just list your current run and then delete the tmp file it creates. Or
    you can

    kill the process using the kill command with the process ID of the process as
    an argument.

    For example, to kill the preceding process, type the following:


    ```

    # kill -9 1570

    ```


    The -9 will cause all the most seriously non mode programs to be killed. You can

    repeat this step by listing and killing generic processes as well.'
