  md: '# Chapter 8 — Making a Home Broadcast Center 149


    The server has a camera, antenna, or cable TV connection to your TV capture card.
    The server has to be able to grab and stream the audio/video, but not necessarily
    view it. The client computer has to have a connection to the same network (whether
    it is the local LAN or the Internet) and at least a player that can stream media
    in the format being used.


    Review the issues described in Chapters 4 and 5 related to choosing a PC that
    you can use for the project with video in Linux. Here are just a couple of additional
    notes relating to the computer resources you need for this project.


    # The personal computer


    The main difference between the computing resources that you need for this project
    and those required for the video projects described in Chapters 4 and 5 is to
    disk space. While you are processing a lot of video in this project, you are not
    storing it permanently to hard disk. Therefore, you do not have to allow the approximately
    2GB of disk space for each hour of video you record.


    For good results, we recommend a Pentium 4, 1GHz processor and at least 1GB of
    DDR RAM. The project worked pretty well on my Pentium 3, 650 MHz processor with
    384MB of RAM. Shrinking the frame size and rate, we even got it to work on an
    AMD 400MHz, with 64MB RAM (which is about the minimum needed to support Red Linux).


    # Video card


    You could use the same video card you used for projects in Chapter 4 or 5.


    # TV capture card


    As with the projects in Chapters 4 and 5, you can use any television capture cards
    that are supported by video–linux drivers. You don''t need a TV capture card if
    you are using a USB Webcam to get to stream.


    # Sound card


    The ffmpeg command expects there be a sound card on the system that are streaming
    video from—even if you don''t listen to the video on the server. So we recommend
    that you install and configure a supported sound card (see Chapter 3 for information
    on sound cards).


    You can get around not having a sound card using the NoAudio feature when you
    configure the server.conf file (described later). Running ffmpeg --an (to turn
    off audio) doesn''t seem to work if you have no sound card. Also, you probably
    need to patch the Audio Out from the TV card to the Line In on the sound card
    using a short patch cable.


    # Video cameras


    There are different types of cameras you can use to produce the video you stream
    in this project. Some of your choices depend on the type of input jacks on your
    TV capture card. Here are some of the cameras you might consider using:


    +   - Camcorder Most video cameras for the home market have an A/V jack that you
    can use to connect a cable between the camera and the TV card. If you don''t have
    a cable that lets you plug the camera into your TV card, you can always plug it
    into a VCR and play video through using a regular coax cable.'
