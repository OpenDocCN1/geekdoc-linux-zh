  md: '# Chapter 9 — Building a Temperature Monitor 165


    The next example samples the header (-q) and gathers data twice (-n 2) at intervals
    of three seconds (-d 3). You can increase the intervals and number of times to
    gather data to test temperatures over a longer period.


    ```

    # digitemp -q -a -d 3 -n 2

    Jun 11 00:26:34 Sensor 0 C: 24.00 F: 75.20

    Jun 11 00:26:35 Sensor 1 C: 25.12 F: 77.22

    Jun 11 00:26:37 Sensor 0 C: 24.06 F: 75.31

    Jun 11 00:26:38 Sensor 1 C: 25.19 F: 77.34

    ```


    Now that you can read the temperature information from your Linux system, you
    can try out a few interesting ways of using that information.


    # Logging Temperatures Continuously


    If you want to keep track of temperature changes over time, you can use the Linux
    cron facility to run Digi Temp on an ongoing basis at set intervals to a log file.
    You can grab data from that log file to read into a Web page, e-mail message,
    or graph. Here''s a procedure for doing that.


    +   1. As root user from a Terminal window, type the following:


    ```

    # crontab -e

    ```


    This opens the root user''s crontab file in the vi editor.


    +   2. Assuming you have already created a .digitempc file in the /usr/local/bin
    directory (as described earlier), add the following line to the crontab file you
    are creating:


    ```

    */30 * * * * /usr/local/bin;digitemp -a 1-/var/log/temperature

    ```


    If you do not know how to use the vi editor, type the i to open a line; type the
    line shown exactly (you can use backspace), and press the Esc key. Type ZZ to
    save the changes and close the file. If you get stuck, just type :q to exit the
    file without saving any changes.


    Make sure you got the contents of asterisks, the dot, and the semicolon entered
    as shown. This will log the temperature from all sensors to the /var/log/temperature
    every 30 minutes. You could change the 30 shown to any number of minutes to change
    how often temperature is checked.


    I set the value to 1 minute to make sure it is running properly. Then I change
    it back to 30 later.


    +   3. Type the following to view the contents of the temperature file:


    ```

    # cat /var/log/temperature

    ```


    If you use the preceding crontab example, temperature listings should show up
    within a half hour. If the temperature listings show up, you are done. If not,
    continue.


    ![](img/93c80330322e65d5105a6014afe2d85d_192_0.png)'
