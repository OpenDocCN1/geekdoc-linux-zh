  md: '# Chapter 3 — Making a Music Jukebox


    **Permanent start-up** — If you are running the Linux Toys Jukebox as a dedicated
    music ripper/player (as it''s intended), you can have the jukebox start up automatically
    every time you turn on the PC. The following command lists whether the jukebox
    is set to be on or off at different levels:


    ```

    # /sbin/chkonconfig --list ltjukebox

    ltjukebox 0:off 1:off 2:off 3:off 4:off 5:off 6:off

    ```


    Here, the jukebox is set to be off at all run levels. Next, type the following
    commands to set the jukebox to start automatically when you start Linux:


    ```

    # /sbin/chkhonfig ltjukebox on

    # /sbin/chkhonfig --list ltjukebox

    ltjukebox 0:off 1:off 2:on 3:on 4:on 5:on 6:off

    ```


    The first command turns on the jukebox and the second shows that the service is
    on all multixer run levels (2, 3, 4, and 5). The next time you restart the PC,
    the jukebox software starts running (or you can start it manually, as you restart
    whenever, you''re not ready to reboot).


    To turn off the jukebox, use chkonfig with the off option:


    ```

    # /sbin/chkonfig ltjukebox off

    # /sbin/chkonfig --list ltjukebox

    ltjukebox 0:off 1:off 2:off 3:off 4:off 5:off 6:off

    ```


    Now the jukebox service is off for all run levels (so it will no longer start
    automatically).


