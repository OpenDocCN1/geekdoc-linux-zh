  md: '# Chapter 2 — Finding Hardware and Software 25


    ... a CPU?


    The processor needs to be at least a Pentium 200Mhz processor for text mode and
    400Mhz for GUI mode. Old 386 and 486 processors will not work with the latest
    Red Hat Linux. Pentium chips have been around since about 1993, so that still
    gives you about 10 years'' worth of old computers.


    One exception is the "Linux on a floppy" project described in Chapter 13. That
    project will run a mini version of Linux on most computers that have a floppy
    disk (including older 486 computers).


    ![](img/93c80330322e65d5105a6014afe2d85d_52_0.png)


    Pentium III processors came out in 1999 at 450MHz and 500MHz speeds. If you can
    spring for the extra money, a Pentium III will give you better audio and video
    performance than earlier Pentiums. Pentium IV processors are available today at
    speeds of over 3 GHz. (No wonder there are so many computers around for us to
    make toys out!)


    CPU chips from Advanced Micro Devices (AMD) are also acceptable. When Intel doubled
    the 386, 486, and so on naming convention (which couldn''t copyright) and went
    over to the Pentium name, AMD followed by naming their processors K5 (for Pentium),
    K6 (for Pentium II) and so. Supported AMD CPUs include K5, K6, K6-2, Athlon, XP,
    and Duron.


    All of your video projects (Chapters 4, 5, and 8) require faster processors than
    are needed for other projects. We recommend at least a 450 MHz processor for those
    projects.


    # ... a hard disk?


    The hard-disk size you need for Linux Toys varies from project to project. Disk-space
    requirements for some projects are based on how much audio, video, or other content
    you add to it.


    Hard-disk space requirements are listed with each project. Here are some general
    guidelines you should figuring out how big a hard disk you need for Linux Toys.


    +   * Projects that require a GUI will be 1.7GB (for a Personal Desktop) or 2.1GB
    (for a Workstation) Red Hat Linux installation. You can reduce this by removing
    unnecessary packages, but might run into dependency problems (i.e., another package
    might need the one you removed to make it work).


    +   * A project that doesn''t require a GUI can begin with a Red Hat Linux Server
    (850GB) or minimum (475MB) installation. In many cases, however, you need to add
    some packages that are needed by the projects.


    +   * If you are someone who has to have everything, an Everything installation
    of Red Hat Linux requires about 5.2GB of disk space.'
