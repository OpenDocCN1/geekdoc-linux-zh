  md: '# Appendix C — Basics of Red Hat Linux Installation


    # Login


    You know that your computer is up and running when you see a login screen (if
    you boot to level 5) or a simple text-based prompt. Type the user name and password
    to log in. The first time you log in, you will have only a root user account and
    password. Use that name and password to log in, you can add other user accounts
    later if you need them.


    If you log in to a text-based prompt, you will see a shell prompt (either $ or
    #). If logged in to a GUI login screen, a GUI desktop appears.


    The first time you boot Red Hat Linux, instead of a login prompt, you may see
    the Red Hat Update Screen (also referred to as the first screen).


    # Right after installation ... reboot


    The Red Hat Update runs only the first time after installing or upgrading Red
    Hat Linux. It lets you do some basic configuration.


    +   - User account — Add a regular user account for yourself to use for nonadministrative
    purposes.

    - Date & time — Set the system date and time. If you have a connection to the
    Internet, you can get your time synchronized automatically from a network server.

    - Sound card — Configure your sound card.

    - Red Hat Network — Configure your computer to get automatic updates of Red Hat
    Linux software.

    - Additional CDs — Install software from additional CDs.


    At this point, Red Hat Linux should be up and running and ready to start building
    your Linux Toys. If, during the course of building the Linux Toys, you will find
    that you need to install additional software packages, you can use either the
    Red Hat Add and Remove Software window or the rpm command. You can find out about
    these tools in the next sections.


    # I Need to Install More Packages!


    If you try one of the Linux Toys projects and get a message like "command not
    found," it may be because the software package that contains that command isn''t
    installed. If you have the X Window System and either GNOME or KDE installed,
    you can run the Red Hat Add and Remove Software window to install packages. If
    you have only a shell command line available, you can use the rpm command.'
  merge: -1
