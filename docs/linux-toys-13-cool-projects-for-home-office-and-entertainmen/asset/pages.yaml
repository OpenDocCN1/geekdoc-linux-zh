    (www.kplug.org).


    Red Hat, Inc., maintains a list of LUGS and information on how to create your
    own LUG at www.redhat.com/apps/community. As I mention in Chapter 1, Linux Online
    also has a list of user groups (www.linux.org/groups/index.html). Or just search
    for “Linux User Group” and the name of your town or city at www.google.com and
    see what you get.


    # Where open source projects live


    You can find open source projects at FreshMeat (www.freshmeat.net) and SourceForge
    (www.sourceforge.net). Both sites allow you to do keyword searches to find projects
    that interest you. For open source projects specifically related to Linux Toys,
    you can go to the Linux Toys Web site (www.LinuxToys.net).


    # Summary


    Linux Toys will run on many PCs in the past 10 years. Although you can install
    Red Hat Linux and the Linux Toys described in this chapter on the latest PC, I’ve
    tried to give you some advice in this chapter on how to search out a cheaper computer
    that will work for many of your projects.


    After you have hunted down your hardware, this chapter describes where you can
    find additional software to add to your Toys. It also describes where to find
    mailing lists and Linux User Groups (LUGs) to get more information on projects
    that interest you.'
