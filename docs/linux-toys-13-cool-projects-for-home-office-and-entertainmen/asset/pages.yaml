    # Summary


    While a real ISP requires hardened servers and constantly diligent support, many
    of the features that a professional ISP are built into Red Hat Linux, as well
    as other Linux distributions. This Linux Toys project is meant to describe how
    to set up the basic services needed to build a Mini ISP. The result is a single
    computer that lets clients dial-in, browse the Internet, access personal e-mail
    accounts, publish personal Web pages, and upload files using FTP. For more serious
    server development, you can refer to Red Hat Linux Bible or one of many specialized
    books on each of the subjects covered here.'
