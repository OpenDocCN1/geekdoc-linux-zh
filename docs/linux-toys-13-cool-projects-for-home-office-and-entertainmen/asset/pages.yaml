    # Step 4: Create network interfaces (clients)


    When an Ethernet card is installed on a Windows, Mac, or Linux computer, the computer

    typically assumes that you are using DHCP to address the information you need
    to start up

    automatically on the network. Since you just created a DHCP server, your clients
    should just

    able to start automatically and grab this information:


    +   - An IP address (taken from the range defined)

    - DNS addresses (that you got from your ISP)

    - Gateway (the address of your server)

    - WINS server address (again, the address of your server)


    Otherwise, I suggest that you be sure to set a hostname for each computer on your
    LAN.

    Those will be the names you use to identify the shared printers and folders.


    # Step 5: Set up the firewall


    The firewall you configure on your Linux Toys Home Network server is used to set
    a boundary

    bween your private computers and potential intruders from the Internet. Using
    rules you set

    out the firewall can decide what to do with packets coming in, going out, and
    being forwarded

    through your server.


    There are a lot of features built into the iptables facility, which is the default
    firewall software

    for Red Hat Linux. You are primarily concerned with the following features:


    +   - Allow outgoing connections — You want the firewall on your Linux Toys Home

    server/firewall/router to trust and allow communications from the computers

    for your LAN.

    - Restrict incoming connections — You want to restrict communications that are
    initi-

    ated by computers outside of your LAN (that is, from the Internet), to the fewest

    services you need.

    - Do network address translation — Because you are using IP addresses on your

    LAN, for computers using those addresses to communicate on the Internet, their
    com-

    unications must appear to be coming from a real IP address. Because your server
    has a

    real outgoing address on its interface to the Internet, you can use Network Address

    Translation (NAT) in the firewall to make all packets from the LAN to the Internet
    look

    like they are coming from the server.


