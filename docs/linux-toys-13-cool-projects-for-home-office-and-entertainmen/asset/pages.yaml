  md: '# 128 Part III — Projects for the Home


    ![](img/93c80330322e65d5105a6014afe2d85d_155_0.png)


    This example shows multiple computers (Windows 98, Windows XP, Mac OS X, and Linux)
    all connected together into a hub or switch. The Linux Toys Home Network server
    computer has a connection to both the hub/switch and the equipment that provides
    the connection to the Internet. It also has a printer connected to it that can
    be shared by users on the LAN.


    In the following sections, I describe how to configure your server as a firewall,
    router, and file and print server for your LAN. Then I describe how to add your
    Linux Toys computers to this network.


    # Configuring the Home Network Server


    Your Linux Toys Home Network server can be the center of your home computer network.
    In our example, all data that travels between your home network and the Internet
    is routed and filtered through this server.


    Because we''re cheap, we don''t have to buy another computer (or leave more than
    one computer on all the time). So, besides routing/firewall functions, our server
    will manage file and printer sharing among our computers.


    The Linux Toys Home Network server that we have configured is not a public server.
    What I mean is that you will not be serving Pages, e-mail accounts, or FTP directories
    to people trying to access your server from the Internet. It is meant for you
    and your family to visit the Internet safely but to keep the people from the Internet
    from visiting.'
