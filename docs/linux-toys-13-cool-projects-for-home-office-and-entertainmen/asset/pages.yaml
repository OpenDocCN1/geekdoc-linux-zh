  md: '# Acknowledgments


    Everyone''s hard work would be for naught if it weren''t for the distribution
    integrators who "glue" the components together and make Linux easy to install.
    Thanks go to Red Hat, Inc., for providing the platform we use in this book. The
    simplicity of your design is why we use it.


    We definitely couldn''t have done this project without the help of our technical
    editor, Kevin Pedigo. At every turn he went above and beyond the call of duty
    to ensure that every detail was correct as we could possibly make it.


    Chris did nearly all of the writing for this book, which left me to do all of
    the fun stuff. Thanks for slaving away all those countless hours, and thanks for
    your patience when things didn''t work quite right the first time (or the second
    or third or ..).


    The music files on the CD are from my good friend and business partner Bill Broomall.
    I often wonder, is there no limit to this man''s talent?


    On a personal note, I owe a debt of gratitude to my father. You can go many places
    in life, but nothing affects you like the experiences you have when you are young.
    I thank him for all the time he spent explaining complex subjects to me as well
    as for the many hours we spent on projects together. He is a great example to
    me. I hope I can be such an example to my son.


    I''ve come to realize that one of the most difficult burdens of writing a book
    falls on family members of the author. Many thanks go to my partner, Karey Sayers,
    for her patience and encouragement while pulling way more than her fair share
    so I could work on these projects.


    And above all, glory be to God!'
