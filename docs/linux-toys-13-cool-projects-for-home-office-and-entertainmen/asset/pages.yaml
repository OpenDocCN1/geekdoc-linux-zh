  md: '# Chapter 7 — Creating a Home Network 129


    The features we describe in this section come with Red Hat Linux. Those features
    include:


    +   - Firewall (iptables) — Out of the box, Red Hat Linux uses iptables as its
    firewall software. Besides deciding which packets to drop and not get through,
    iptables lets you use features such as Network Address Translation (NAT) or IP
    Masquerading, which allow computers on your private network to communicate with
    the Internet.


    +   - Dynamic addresses (dhcp) — We want computers on our Linux Toys Home Network
    to connect to the Internet without much fuss. By setting up our server to be a
    DHCP server, the computers on your LAN (Windows, MAC, or other Linux systems)
    can just fire up and be on the Internet with minimal configuration.


    +   - File and Print Sharing (Samba) — While there are several different software
    package for sharing printers and files on a network, the most popular is Windows
    file and print sharing, using the Server Message Block (SMB) protocol. The software
    that implements SMB in Red Hat Linux is called Samba.


    Although in Chapters 11 and 12 we you edit plain-text configuration files to get
    the servers going, we won''t make you do much of that. Both iptables and Samba
    have nice graphical interfaces for configuring firewalls and file/print sharing.
    The Security Level Configuration window offers a simple means of restricting access
    from the Internet, while trusting computers on your LAN. The Samba Server Configuration
    window lets you share directories and indicate the type of security to use.


    Figure 7-4 shows what our Linux Toys Home Network server can do.


    ![](img/93c80330322e65d5105a6014afe2d85d_156_0.png)


    FIGURE 7-4: The server''s firewall blocks intruders while happily sharing files
    and printers for your family.


    > If you have a Mac OS X or earlier Mac computer on your network, refer to Red
    Hat Linux Bible for setting up a Mac to access Linux servers in a variety of ways.
    (I added a chapter on this topic to Red Hat Linux 9 and later editions that includes
    how to set up Linux as an AppleTalk server using netatalk.)'
  merge: -1
