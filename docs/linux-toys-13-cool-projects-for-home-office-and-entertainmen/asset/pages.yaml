  md: '# Getting the Software


    ll of the software used for the Linux Toys project comes from one of two places:
    Red Hat Linux or the Linux Toys CD. The first you have to get yourself; the second
    comes with this book.


    # Red Hat Linux


    The complete Red Hat Linux installation comes on three CDs. For our projects,
    we are using the i386 (in other words, the PC) version of Red Hat Linux. Here
    are a couple of ways to get Red Hat Linux:


    +   > The full set of Red Hat Linux installation CDs, along with instructions
    on how to use and administer Red Hat Linux, you can purchase Red Hat Bible (written
    by Christopher Negus and published by Wiley). The content of these CDs is the
    same as the content available for download from Red Hat''s Web site.


    +   > You can download images of the installation CDs from many different Red
    Hat Linux mirror sites. You can then burn those onto CDs or install the software
    from images from hard disk or over a network.


    Linux Toys projects were tested on Red Hat Linux 9, but presumably they should
    work on later versions of Red Hat Linux. Check the LinuxToys.net site for information
    on any incompatibilities that may arise from later versions of Red Hat Linux.


