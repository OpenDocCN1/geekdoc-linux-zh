  md: '# Chapter 4 — Building a Digital Home Video Archive 69


    # TV capture card


    For this project, you connect your video input through a TV capture card and use
    the xatwv player to set properties for the video coming through that card. Any
    TV capture card you use for this project must include a chipset that is supported
    by the video4linux drivers (in particular, lar use cards using the btv driver).


    There are not a huge number of TV cards supported by video4linux btv drivers.
    Capture cards supported by those drivers include the bt48 and bt878 chip sets.
    Two TV cards that we purged and chose got good results from:


    +   - HauaugeWinTV Go (purchased for about $48 from buy.com). This is a good basic
    card for playing and recording other video input.


    +   - HauaugeWinTV Theater (purchased for about $138 from buy.com). This card
    is geared towards connecting your audio and video output into a high-quality entertainment
    system.


    Although Hauepage is not a household name in the United States, it''s easy to
    find their TV cards in many computer-electronics stores. We recommend these simply
    because we didn''t have good luck with some of the other TV cards we tried.


    Both of Hauepage cards worked well, for this project and the other video projects
    (Chapters 5 and 8). Both cards have connectors for TV (cable or antenna), audio
    output, audio input, and S-video input (where you can connect an external camera).
    The WinTV Theater has a few extra features, such as a remote control, more audio
    output, and FM radio antenna command (try the radio command that comes in the
    xatwv package to play FM radio).


    To find other TV capture cards you can use with this project, you need to install
    the kernelsource package included with Red Linux (You can get Red Linux in Red
    Hat Bible as well as other ways). Cards that can be used by the btv driver are
    listed in the /usr/src/linux-2.4/Documentation/video4linux/btv/Cards. Be careful
    to match the model number shown, because cards from the same manufacturers are
    not always supported. If you want to get the best btv drivers for TV capture cards,
    check out http://bytesex.org/btv/.


    With a supported TV capture card installed, the next time you boot Red Hat Linux,
    the should automatically detect


    # Sound card


    You need a supported, configured sound card for this project. See Chapter 3 for
    information on choosing and configuring the sound card.


    Also, you may not be able to record directly from your TV capture card. For that
    reason, you may need a special patch cable (which comes with some TV capture cards)
    to connect the Line Out on the TV capture card to the Line In on the sound card.


    ![](img/93c80330322e65d5105a6014afe2d85d_96_0.png)'
