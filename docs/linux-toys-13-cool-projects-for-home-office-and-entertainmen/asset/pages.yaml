    Although most modern PCs will work for this project, a large hard disk and sound
    card are required for the basic Linux Toys Jukebox. Another consideration is whether
    or not you want a finished case for the player to fit nicely on an entertainment
    center. Here''s a rundown of what you need:


    # The personal computer


    Most PCs that are compatible with Red Hat Linux should work for this project.
    You should check minimums relating to CPU and RAM in Chapter 2 and Appendix C.
    As I mentioned earlier, you might want a form factor that fits on a stereo shelf.
    Figure 3-2 shows an example of a small factor computer that will fit in an entertainment
    center.'
