  md: '# Chapter 13 — Linux on a Floppy and BSD Games 239


    # # Running BSD-Games


    If you used a UNIX computer in the early 1970s, there were no windows, menus,
    icons to smooth your trip. You typed to a computer on a scrolling roll of paper,
    or if you were lucky enough to get access to it, a text-only green screen. That
    was the environment in which the first computer games were created.


    Games such as adventure, quiz, and fish challenged your mind without assaulting
    your senses. These same games are out of the mainstream but are still around today—available
    most commonly in a software package called bsd-games.


    As described previously, we took a few games from the bsd-games package and placed
    them on the DogHouse Linux Floppy Image. If these few bsd-games weren''t enough
    for you, we have the full package of bsd-games on the Linux CD that you can try
    out. The bsd-games package includes the five games we have on DogHouse Linux but
    has about 30 more games. To play them, you can bypass DogHouse Linux and simply
    install the bsd-games package on the same Red Linux system you use for all the
    other projects in this book.


    Here''s how to install the full set of bsd-games on a Red Hat Linux system:


    +   1. Insert the Linux CD into the CD drive of a running Red Hat Linux system.

    2. If it doesn''t mount automatically, type the following as root user from a
    Terminal window:

    3. Type the following to install the bsd-games packages:


    ```

    # mount /mnt/cdrom

    ```


    ```

    # rpm -Uhv /mnt/cdrom/ch13-DogHouse/bsd-games*

    ```


    If you installed the bsd-games package in Red Hat Linux, you should add /usr/games
    to your PATH by adding the following line to your $HOME/.bashrc file (using any
    text editor):


    ```

    export PATH=$PATH:/usr/games

    ```


    Then you can play the game that you want to play. Table 13-1 shows the games that
    come with the complete bsd-games package included on the Linux Toys CD.


    | Table 13-1 Character-based BSD Games |

    | Game | Description |

    |---|---|

    | adventure | Explore the Colossal caves and find treasures |

    | arithmetic | Answer simple, timed arithmetic questions |

    | atc | Air traffic controller game (direct jets and propeller planes through
    flight area (and airports)) |

    | backgammon | Backgammon board game |


    Continued'
