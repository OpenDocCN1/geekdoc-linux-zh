  md: '# Data transfer


    Many inexpensive hosting services offer about 10-30GB of file transfer per month
    before they begin to charge extra to their customers. You can monitor the amount
    of traffic that is coming to each client by the number of hits, the amount of
    data transferred, or the number of pages viewed.


    Tools such as Webalizer, which come with Red Hat Linux, can be set up to track
    the activity on your Web sites.


    If you plan to offer services in addition to Web hosting, such as mail and FTP,
    you''ll have to take into account the data transfer taken up by those when calculating
    a customer''s total data transfer. The best way to do that is to watch the log
    files for each service and add that to the total given to you by your Web statistics
    package (such as Webalizer). It is much too labor intensive to parse through logs
    manually. For example, you should find or write a script to do the work for you.


    ![](img/93c80330322e65d5105a6014afe2d85d_241_0.png)


    # What types will you allow?


    An inexpensive PC can serve plain HTML pages without chewing up much of your computer''s
    resources. Allowing your clients to provide other types of content, however, can
    be a big drain on resources.


    Of course, different types of content can also make a Web site more dynamic and
    interesting. Here are some types of content you might consider allowing clients
    to include on your Web server:


    This is a sampling of content you can include on a Web page. Any type of content
    that can be held in a file can be downloaded from a Web site or FTP site. Likewise,
    many different programming languages can be used to write code that is incorporated
    into Web content.


    +   - CGI scripting—Allowing CGI programs provides a way for your clients to include
    more interactive content on their Web pages. CGI scripts are often used to implement
    forms on a Web page and access databases. The script itself can incorporate different
    programming and scripting languages, such as Perl, Python, and TCL.

    - PHP—A scripting language that you can embed in HTML code. Clients can use this
    instead of CGI to add dynamic content. You can enable PHP on your Apache server
    to allow clients to include PHP code in their HTML pages.

    - Perl—A popular scripting language used to create CGI scripts for Web pages.
    There are many different Perl libraries available with Red Hat Linux for different
    types of jobs.

    - Database—Red Hat Linux contains both MySQL and PostgreSQL database client and
    server software. If you allow it, your Web-hosting clients can both create and
    access databases from their Web sites.


    +   - Secure access—By adding secure server access (SSL), you can improve the
    security of the communications between your Web server and the clients who browse
    the'
