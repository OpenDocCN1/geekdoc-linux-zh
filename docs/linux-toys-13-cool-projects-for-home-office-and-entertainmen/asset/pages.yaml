  md: '# Burning Videos to VCD


    The problem with the video you have created so far is that it doesn''t play back
    on the commercial DVD player you have in your entertainment center. Although this
    technology in Linux isn''t quite ready for prime time, the avi2vcd script (which
    was written by our tech editor, Kevin; thank you very much) lets you burn synchronized
    audio and video-to-video CD: (VCDs).


    When you use the avi2vcd command to create the .bin and cue files needed to create
    the video CDs, use the hints that we learned in the original file to synchronize
    audio and video. The more frame skips you had during recording, the further your
    audio and video will drift apart upon your VCD. The better the hardware you use
    to make the recording, the better the resulting VCD will be.


    Starting with our example, you created a video called party-06152003.avi, use
    the following procedure to convert that file into VCD format and burn it to a
    CD.


    +   1. Change to the directory containing the avi file to make into a VCD and
    run the avi2vcd command on it. Here is an example:


    ```bash

    # cd /usr/local/share/homevideo

    # avi2vcd party-06152003.avi

    ```


    The results of the avi2vcd command should be a party-06152003.bin and party-06152003.cue
    file.

    2. Insert a blank CD into the CD burner on your computer.

    3. Determine the location of your CD-ROM device as you did before (type the cdrecord-scanbus
    command).

    4. To burn the video to the CD-ROM, you use the cddarmo command. Here is an example
    of the cddarmo command (the device and driver for your CD drive may be different):


    ```bash

    # cddao write --device 0,0,0 --driver generic-mmc --eject party-06152003.cue

    ```


    Try the VCD in a commercial DVD player (it should work in most of them). Chances
    are, the video will not fill the screen, playback will be choppy, and audio will
    be out of sync. Next, make the VCD "Low quality video" and send it to Aunt Millie
    to play in her DVD player.


    # Summary


    Although video in Linux is still in its infancy, there are some good up-and-coming
    tools for video available today. We used the ffmpeg tool (which puts a nvrec wrapper
    around the ffmpeg command) to do our video recording and storing.'
