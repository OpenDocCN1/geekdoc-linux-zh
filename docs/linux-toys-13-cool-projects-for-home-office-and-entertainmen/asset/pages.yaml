    to move to the part of the command line you want to change. Just type to add to
    the line, use the Backspace key to delete previous characters, or use the Delete
    key to delete the current character. Press Enter to run the modified command.


    > Note You can use a text editor to search and modify commands from your history
    list. Because I use the vi editor, I always set my command editor by adding this
    line to my $HOME/.bashrc:


    ```

    set -o vi

    ```


    With that set, I can use vi features to find and edit commands from my history.
    For example, press Esc, type /cat, and press Enter. The shell finds the previous
    command I ran that includes cat in it. This is very useful if you remember part
    of a long command name or path that you want use in a new command.


    # Using command completion


    Command completion in the shell can save you a lot of keystrokes and mistyped
    commands. Type part of a command or path; then press the Tab key. If the command
    or path is unique (as far you have typed), the shell will complete the rest of
    the command or path. For example, type:


    ```

    $ abi <Tab>

    ```


    That''s letters abi, followed by pressing the Tab key. Because I have only one
    command in my path that starts with the abi, the shell fills in the rest (in this
    case, it appears). Next, you can do the same thing with a filename to get the
    command. Let''s say there is a file in your current directory named myfile.abw.
    If no other file begins with my, you can:


    ```

    $ abi myfile<Tab>

    ```


    The shell fills in the filename myfile.abw. If there are more files beginning
    with my in the directory, press the Tab key a second time. A list of files beginning
    with my appears. You can then fill in a few more letters to make your match unique,
    and then press Tab again to have it complete.'
