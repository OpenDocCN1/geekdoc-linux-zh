  md: '# Step 4: Install Linux Toys packages


    The Linux Toys Digital Receptionist consists mainly of the vgetty daemon (listens
    on a serial port for incoming calls to the modem) and a set of perl scripts that
    configure and implement the project. Follow this procedure to install software:


    To use MP3 encoding, VOCP expects you to have the lame package installed. If you
    install lame (it is included in our packages for Chapters 4 and 5) in addition
    to the packages named here, you can use the recorder to create messages in MP3
    format.


    By default, we use the command (which comes with Red Hat Linux) to encode to Ogg
    Vorbis audio format. Because Ogg Vorbis is less common than MP3, if you don''t
    switch to MP3, you may have to add an Ogg Vorbis player to the computer on which
    you receive your e-mail. We describe where to get those clients later in this
    chapter.


