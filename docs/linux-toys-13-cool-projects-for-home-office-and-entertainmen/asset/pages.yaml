  md: '# 172 Part III — Projects for the Home


    ![](img/93c80330322e65d5105a6014afe2d85d_199_0.png)


    # Creating the Digital Receptionist


    The main components of VOCP, the open source project on which the Linux Toys Digital
    Receptionist is based, are:


    +   - Vgetty — A modified version of the vgetty daemon process is used to listen
    for incoming calls and hand them off to be handled by VOCP.


    +   - Perl scripts — Most of the VOCP project consists of perl scripts that are
    used to create and modify the recordings and configuration files you need to set
    up your VOCP answering machine.


    Our project uses only some of the features of VOCP. I encourage you to look for
    more information and help from other people using this software at www.vocpsystem.com.
    Besides converting phone messages to e-mail, VOCP can be used to:


    +   - View and send faxes

    - Translate e-mail to speech (TTS). (This feature relies on the festival project,
    you can learn about at www.cstr.ac.uk/projects/festival.)

    - Use caller ID recognition and filtering'
