    other things you might want to do:


    +   - Configure your CDDB server for CGI access — This lets people look up CDDB
    information through your web server. This is useful for them in cases where there
    is a firewall that can use HTTP (port 80) but won''t allow CDDB requests (port
    8880).


    You need to identify a directory to the CGI script needed to make this work (typically
    you would use /var/www/cgi-bin). Then you have to get the cddb.cgi script to put
    it there. The script must be accessible and executable by everyone.


    +   - Automatic updates — To keep your server up to date automatically, you need
    to make a request to freeddb.org to transmit CDDB to your server. Otherwise, you
    will have to download updates periodically.


    If you offer to be an official freeddb-mirror site, you can get automatic updates
    to your database. Otherwise, we would not recommend getting automatic updates
    from a public server on the Internet. Once you sign up to get automatic updates,
    you must edit the /usr/local/share/cddb/access file to include a permissions line
    that appears like the following:


    ```

    host_perms che freeddb.org connect post update get

