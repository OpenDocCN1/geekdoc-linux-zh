    # Booting for the First Time


    When a PC boots up, it starts in the same way (no matter what operating system
    you are using) from the computer''s BIOS, then it takes its own direction depending
    on the type of bootloader and operating system you are using. For Linux Toys,
    the boot process is important because for some projects, we want to have the PC
    boot to a single-device (which is done mostly at the end of the process).


    After you have installed Red Hat Linux, here are the basic steps your computer
    goes when it starts up:


    ```

    BIOS→GRUB→Red Hat Linux kernel→Run level 5→Firstboot→login

    ```


    If selected all the defaults when you installed Red Hat Linux, your computer goes
    through the steps just shown when it starts up. Here are some quick descriptions
    of each those steps:'
