    up, the modem should be detected. If prompted, go ahead and configure the modem.

    2. Log in as root user.

    3. Remove any RPMs that are installed on your computer. To make sure that you
    do, type the following:


    ```

    # rpm -e mgetty-voice mgetty-viewfax mgetty-sendfax mgetty

    4. Insert the Linux Toys CD, mount, and install the packages needed for your project
    as follows:

    # mount /mnt/cdrom

    # cd /mnt/cdrom/ch10-DigitalReceptionist

    # ./install.me

    ```


    The VOCP software is now installed and ready to be configured.


    # Step 5: Configure vgetty to listen for calls


    The vgetty daemon is used to listen for incoming calls on your phone line. The
    following description details how to configure the special patched vgetty included
    with this project:


    +   1. Log in as the root user.

    2. Open /usr/local/etc/mgetty-sendfax/voice.conf (with any text editor), and check
    the values in that file. We expect that the defaults in this file will work in
    most cases. Here are a few particular values you might want to look at:


    ```

    voice_devices modem

    rings 3

    call_program /usr/local/vocp/bin/vocp.pl

    ```'
