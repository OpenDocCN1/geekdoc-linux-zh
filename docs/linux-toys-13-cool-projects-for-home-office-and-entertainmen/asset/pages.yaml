  md: '# 72 Part II — Entertainment Projects


    # Getting Nvidia Drivers


    The driver for NVIDIA cards that comes with Red Hat Linux (the nv driver) doesn''t
    include many of the advanced features needed to support streaming video. NVIDIA,
    however, does offer proprietary X drivers for its cards that you can download
    and install in Linux. Although these steps may change if NVIDIA changes its procedure,
    here is what I did to get and install a driver for my NVIDIA card:


    +   1. Go to the NVIDIA Web site (www.nvidia.com) and select Download Drivers.


    +   2. Select Linux & FreeBSD Drivers.


    +   3. Select IA32 (for drivers for the PC).


    +   4. Follow the instructions for downloading and installing the drivers. When
    I ran it, it had me click the link to NVIDIA-Linux-x86-1.0-4363.run. I downloaded
    it to a directory, changed to that directory, and (at root) typed:


    ```

    # sh NVIDIA-Linux-x86-1.0-4363.run

    ```


    +   5. After the install was complete, I ran redhat-config-free86 again. But it
    was not able to detect my property with the new driver. To creating a working
    configuration file that I could edit further if I needed, I typed the (skip the
    first cp for a fresh Red Hat install in which no video was set up):


    ```

    # XFFree86 -configure

    # cp /etc/X11/XF86Config /etc/X11/XF86Config.original

    # cp /root/XF86Config.new /etc/X11/XF86Config

    ```


    +   6. Now you can test that X is working by typing:


    ```

    # startx

    ```


    +   7. If the GUI is working at this point, the nvidia driver should be installed.
    You can run redhat-config-free86 again to adjust the resolution and number of
    colors. You may have to run redhat-config-mouse to configure your mouse.


    8. You can adjust the following settings from the Display Settings window:


    +   * Resolution Higher resolutions look better (and let you fit more on a screen),
    while lower resolutions can perform better.


    +   * Color Depth — Likewise, higher color depths allow more colors, but can slow
    performance (which can be an important issue when viewing video).


    +   * Monitor Type — The window tries to probe your monitor. If it can''t detect
    the monitor type, you should go to the Advanced tab and configure it yourself.
    You need to refer to your monitor''s documentation for the vertical and horizontal
    sync rates you need to use.'
