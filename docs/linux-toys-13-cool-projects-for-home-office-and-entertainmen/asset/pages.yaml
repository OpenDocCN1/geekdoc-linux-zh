  md: '# Exploring Linux Toys


    # chapter


    With a spare PC, the Linux operating system, a few added hardware pieces, and
    this book, anyone from a handy do-it-yourself to a Linux guru can end up with
    some fun and useful home or office projects. Linux Toys takes you from start to
    finish the process of building cool devices for entertainment, home automation,
    busy business, or just plain fun.


    Although Linux Toys focuses on building projects, it''s really more than that.
    At its heart, Linux Toys means to reflect the spirit of the Linux community. Build
    a project and find new ways to expand, extend it, and configure it. Share your
    ideas with others and before you know it, "free" software could become something
    more powerful than you can buy from any single vendor.


    To get started, you don''t need the most recent and hottest hardware. Some of
    the projects will run on eight-year-old PC sitting in your closet (such as the
    Linux Home Network server in Chapter 7 or Web Hosting Service in Chapter 12).
    Other projects will do better by adding a larger hard disk, some RAM, or a video
    card.


    If you already have Red Hat running on your hot new computer, you can pop in the
    software from the Linux Toys CD to get the best performance for the various video
    and audio projects (Chapters 3, 4, 5, and 8). You''ll rely on a combination of
    software that comes with Red Hat Linux and some neat projects we dug up from the
    open source community.


    While the spirit of this book is also one of fun and community, the technology
    we is quite starting and becoming more powerful each day. The same software we
    describe is running the server computers for companies around the world. We just
    choose not to be stuffy in how we go about it.


    # Taking the First Step . . .


    If the possibilities mentioned previously sound cool to you, we welcome you to
    Linux Toys. Your guides to the world of Linux Toys are Chris Negus (who wrote
    most of the words you see here) and Chuck Wolber (who built most of the projects).


    # in this chapter


    +   - The spirit of Linux Toys


    +   - The Linux Toys projects


    +   - What is Linux and open source software?


    +   - The Linux Toys CD-ROM


    +   - LinuxToys.net Web site'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Part I — The Basics


    Like it itself, the book was created in a spirit of fun and freedom, while still
    resulting in some serious, useful projects. Linux Toys acts as a “cook book” to
    step you through the process of building a number of projects. For each project,
    we list the hardware and software required. Then we go through installing, setting
    up, and running it. Finally, we give tips for enhancing the project or taking
    it in an all-new direction.


    # Has your computer got what it takes?


    For each, we lay out the requirements for the computer you need and tell you if
    you need extra parts (such as a TV capture card or a modem). In Chapter 2, we
    step through ways of evaluating how suitable a PC is for the projects.


    In most cases, the minimum Pentium-class PC needed to install Red Hat Linux will
    work for our projects. When bigger iron is needed, we''ll let you know. Unlike
    with some of the latest commercial operating systems, you won''t need the hottest
    new PC to get into Linux Toys.


    A lot of the fun of these projects can be to breathe new life into an old, ignored
    PC. For example, with the digital picture frame project (Chapter 15), we encourage
    you to hunt down a $25 laptop from a local surplus store and mount it in a real
    picture frame to display your images.


    We''ll do our best to guide you through the process. Think of us as Norm and Tom,
    walking around a project in This Old House, or Rachel Ashwell, shopping for flea-market
    bargains in Shabby Chic shows. Our own “This Old Computer” and “Shabby Geek” approach
    will help you sort through and put together the parts you need to get your projects
    up and running.


    After you''ve done a project, we want you to come with:


    +   - Something useful (or at least fun)

    - Something you can expand on your own as your spirit you

    - Knowledge of what Linux is and ways to use it

    - New friends at Linuxtoys.net to share ideas and enhancements with (more on this
    later)


    If everything works out the way we hope, your new project will fit seamlessly
    into the lifestyle to which you have become accustomed (see Figure 1-1).


    # Have you got what it takes?


    When you hear that someone has set up his or her stereo, home security system,
    and toaster so that it can be operated by a remote control, do you “Oooh and ahhh”
    out loud? When'
  merge: -1
