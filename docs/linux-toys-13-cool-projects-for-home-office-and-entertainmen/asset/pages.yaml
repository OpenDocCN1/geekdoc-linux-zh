  md: '# Chapter 2 — Finding Hardware and Software 31


    loses its value. They also will have the expertise to check that a computer is
    working, and will meet your needs, before you buy it.


    # Auctions


    We went to an auction where they were liquidating the contents of a computer supply
    store. Here are a few tips for buying at auction:


    +   **Know the value** — It''s easy to get caught up in the excitement of an auction.
    Before you starting bidding, know what a computer is worth and set a limit on
    what you will pay.


    +   **Bring your LUG** — There were about a dozen members of our Linux Users Group
    at the auction Chuck and I attended. By standing between a couple of guys who
    buy a lot of computers, I could get a good sense of what comparable new computers
    would cost.


    +   **Look in the pile** — Instead of trying to sell a bunch of old computers
    separately, there may be a pile of computers that the auctioneer sells as one.
    If you like to tinker, there might be a jewel in this bunch or some parts you
    can use to fill what you are missing. The group of computers shown in Figure 2-4
    went for $15 at the auction.


    ![](img/93c80330322e65d5105a6014afe2d85d_58_0.png)


    FIGURE 2-4: Is there a working computer in this bunch?


    If you don''t like to put together computers or fix them yourself, there are often
    new computers for sale at these auctions as well. If you pay near retail prices,
    however, find out if a manufacturer''s warranty applies and if you can get a DOA
    guarantee from the auctioneer (this auctioneer gave bidders a day to get it home
    and check if it worked).'
