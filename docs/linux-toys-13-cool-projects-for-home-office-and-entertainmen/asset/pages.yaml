  md: '# # Creating an Arcade Game Player


    # chapter 6


    Would you love to revisit the days of yore when video games were kinder and gentler?
    Maybe you still have all the old game cartridges you used to play back in a box
    in the 1980s at your parents'' house. Perhaps the console player is broken or
    missing? Wouldn''t you like to play like some of those old games again?


    Well, you can. The Linux Toys Arcade Game lets you play classic console games
    from the 1970s–1990s. But instead of running them on an old console, you can play
    them from your Linux based PC. The Arcade Game project is based on some simple
    yet powerful components, including:


    +   - MAME—which stands for Multiple Arcade Machine Emulator) contains a set of
    console game emulators for playing those old games.


    +   - Xname—The Xname project consists of a version of MAME that runs in the X
    Window System (the most popular graphical interface for Linux and other UNIX systems).


    +   - gRustibus—is a front-end to Xname that lets you configure, manage, and launch
    MAME console games.


    There are literally thousands of classic console games that work with MAME. Although
    some games have a few quirks with sound and graphics, many of the runs as they
    originally did on your home console or at the arcade.


    Although you can simply play MAME games on your Linux PC, a lot of people have
    had adapting a MAME player to work in an arcade cabinet. We also started our project
    to adapt an existing game cabinet to work with MAME. However, if you all have
    at the moment a working Red Hat Linux system, you can play games in MAME just
    fine from your PC (see Figure 6-1).


    Use this chapter to get Xname and the gRustibus front end to Xname running under
    Red Hat Linux. If you are adventurous, and want to adapt Xname to your own arcade
    console, I''ll give you some pointers on how to do that.


    # in this chapter


    +   - Installing Arcade Game Player software


    +   - Configuring Xname, sound card, and joystick


    +   - Configuring gRustibus to play MAME games


    +   - Getting ROMs (legally) to play in Xname


    +   - Adapting the PC to an arcade cabinet


    ![](img/93c80330322e65d5105a6014afe2d85d_132_0.png)'
