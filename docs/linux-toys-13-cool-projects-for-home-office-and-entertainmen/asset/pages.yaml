  md: '# 180 Part III — Projects for the Home


    Raw Modem Data Format (rmd) — It''s important to get these settings right. The
    rmdformat and rmdcompression options were changed automatically during the modem
    declaration earlier to Rockwell and 4, respectively, for the MultiTech MT5600ZDXV
    modem used. Using pvformat -L to see other format and compressions, if you have
    a different modem. The rmdample was set to 7200.


    Defaults should be for the next few options. Make sure the VOCP commands are in
    /usr/local/bin (as indicated by pvftooldir). The pause option sets the number
    of seconds (3) to wait for user input. The max_errors values set how many invalid
    a user can change in a mailbox before being disconnected (2 by default).


    | rmdformat | 4 |

    | rmdcompression | |

    | rmdample | 7200 |

    | pvftooldir | /usr/local/bin |

    | pause | 3 |

    | max_errors | 2 |


    +   - E-mail notification — Here you set whether or not to have the audio phone
    message sent with the e-mail notification. You also set how you would like message
    compressed (Ogg or MP3).


    Setting email_attach_message to 1 causes the actual audio message to be attached
    to the e-mail notification that you a phone message arrived. Set it to 0 if you
    want to just get a notice; then play the message later from Linux. I changed it
    from 1 to 1 to have the audio message attached.


    By default, messages are compressed (and later played back) Ogg compression (message_in_email_format.ogg).
    You can set it to mp3 instead.


    When VOCP encodes recorded phone messages, it uses scripts in /usr/local/bin directory.
    For Ogg it runs pvftoolg; for MP3 it runs pvftomp3. Those scripts do encoding
    the ogg and m3 commands, respectively.


    The other options that follow sendmail the program to send you an email. email_subject
    sets the subject for pager boxes and e-mail boxes to "VOCP VoiceMail" and email_from_address
    sets the From: field on the messages sent to vocp@localhost.local. You probably
    want to at least change the email_from_address. You could change email_subject
    to something like "Jones Family Voice" instead.


    | email_attach_message | 1 |

    | message_in_email_format | ogg |

    | programs | email /usr/sbin/sendmail |

    | email_subject | "VOCP VoiceMail" |

    | email_from_address | vocp@localhost.local |


