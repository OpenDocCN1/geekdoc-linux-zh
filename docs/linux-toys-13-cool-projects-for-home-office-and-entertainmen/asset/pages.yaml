  md: '# About the Authors


    Christopher Negus landed a job in 1984 at AT&T Bell Laboratories in Summit, New
    Jersey, in the group that developed the UNIX operating system. Because he had
    used UNIX before (and had even written programs in BASIC;), he was considered
    "technical" and started out writing about computer network protocols.


    Over the next eight years, Chris helped write (rewrite) the thousands of pages
    of documentation that went with UNIX. He stayed with the same organization, even
    after AT&T spun it off into UNIX System Laboratories, until Univel before the
    organization (with the UNIX source code) to Novel in 1992. (Yes, this is the infamous
    SCO source code!)


    Over the next decade, Chuck wrote or contributed to a dozen UNIX books. In 1999,
    he made a transition to Linux with a vengeance when he wrote Red Hat Linux. Since
    that time, the book has been a computer bestseller and, in its various editions,
    has sold over 175,000 copies worldwide.


    As a follow-up to Red Hat Linux Bible, Chuck wanted a project where he could take
    a more spirited approach to Linux and get more involved with the community aspects
    of open source software. Chris asked Chuck to put together some projects; they
    asked their friend Kevin Pedigo to review them, and they shared their experiences
    with members of the Linux Users Group. Linux Toys is the result of that process.


    Chuck Wilber''s first brushes came when he was 5 years old and went to bang away
    at a punch crash with his machine in the Purdue computer lab. It was there that
    he learned that computers can be pesky creatures and that it takes a careful hand
    to get them to do what you want. Since then he has worked on everything from the
    Commodore 16 and Apple II to the big HP9000 machines that run much of the manufacturing
    at Boeing.


    Since 1995, when he installed his first version of Slackware Linux, Chuck has
    been dedicated to the philosophy of open source software. With a 1.44k modem on
    his father''s computer, Chuck downloaded every Linux distribution at a time. When
    it installed flawlessly (the first time) and he saw his first ls command return
    the same result he was used to seeing on the big university computers, he was
    hooked.


    Chuck is the founder and Chief Scientist of Quantum Linux Laboratories (www.quantumlinux.com),
    a consulting firm that offers a full range of open source support for businesses.
    Through his company, Chuck provides remote and onsite systems administration,
    on-call support, remote backups, systems monitoring, security analysis, and intrusion
    detection.


    Chuck lives in the Puget Sound area of Washington state with his partner, Karey;
    their fort-building/dragon-slaying son, Bailey; their dog, Heidi; Max the cat;
    and a fish that needs to be renamed once per week.'
  merge: -1
