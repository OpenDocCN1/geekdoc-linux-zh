    application from the shell. "What is a shell?" you ask.


    # The shell


    The shell is a command line interpreter. To use the shell, you type a command,
    followed by zero or more options or arguments. An option typically tells the command
    mode to operate while an argument tells the command what to act on (such as a
    file or directory). Before you use a shell, however, you have to get to it.


    # Getting to a shell


    There are several ways you can get to a shell to start entering commands:


    +   **The shell is all you have.** If you set up Linux to text mode, when you
    log in, the first prompt you see is a shell prompt (no GUI is running). The shell
    is running and ready for you to start typing commands.

    **A Terminal window.** If you are using a GUI, you can open a Terminal window.
    That presents you with the same type of prompt and is ready to take your commands.
    To open a Terminal from the GNOME desktop, click the right mouse button anywhere
    on the desktop and select New Terminal. Figure B-3 shows an example of a Terminal
    window.

    **A virtual terminal.** Type Ctrl+Alt+F1 (or press F2, F3, F4, F5, or F6) to open
    a virtual terminal. You can log in and use the shell from this virtual terminal.
    Type exit to log out when you are done. Then type Ctrl+Alt+F7 to return to the
    GNOME desktop.'
