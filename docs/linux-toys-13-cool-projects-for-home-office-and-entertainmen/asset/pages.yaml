  md: '# Using Open Source Software


    In recent years, the term "free software" has generally been replaced by the term
    "open source software" in hopes to clarify what the movement is all about. Just
    as "freedom" in society doesn''t mean you can do anything you want (such as restrict
    other people''s freedom), freedom with open source software comes with some responsibility.
    The responsibilities are mean to encourage continued development of free software,
    when you use the code in certain ways. (See the "Open Source Definition sidebar.\).


    When a programmer creates open source software, he or she typically attaches one
    of many available open source licenses to it for used, defining how it can be
    used. The intention of most open source licenses is to encourage people to make
    changes to the software and share those changes with others.


    # Open Source Software Definition


    The Open Source Definition, written by Bruce Perez, sets down nine points defining
    open source software (see www.opensource.org/docs/definition_plain.html for the
    complete definition). Here are the points, with my interpretations of what they
    mean to you as someone creating or using open source software:


    +   - **Free Redistribution**— The software creator can''t keep you from selling
    or giving away the software as part of your software project and they can''t make
    you pay a fee for it.


    +   - **Source Code**— The software creator must give you source code or make
    it available.


    +   - **Derived Works**— The software creator must let you redistribute the software,
    with your changes, under the same license.


    +   - **Integrity of the Author''s Source Code**— If you modify the software,
    the software creator can ask you to change the name or version, to protect the
    original code''s integrity.


    +   - **No Discrimination against Persons or Groups**— The software creator can''t
    say, "XYZ people can''t use my software because I don''t like them."


    +   - **Distribution of License**— Everyone who uses the software can use it under
    the same license, without needing to add a license.


    +   - **License Must Not Be Specific to a Product**— The software creator can''t
    restrict use of the code to a particular operating system or other software.


    +   - **The License Must Not Restrict Other Software**— The software creator can''t
    restrict you from distributing other software with the open source software. (The
    example given is that the license can''t say that the software can be distributed
    only with other open source software.)'
  merge: -1
