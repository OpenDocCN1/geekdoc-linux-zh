- img_proc: true
  md: '# Chapter 11 — Be a Mini ISP 193


    restricting users'' access to their own home directories, opening firewalls to
    allow network services, and doing simple routing and network-address translation
    are concepts that you will be able to use as you move further along your journey
    with Linux.


    # Configuring the Mini ISP


    The general steps for configuring your Mini ISP are as follows:


    +   - Gather computer hardware.

    - Install Red Hat Linux.

    - Install Linux Toys software.

    - Configure the network.

    - Configure the domain.

    - Configure the Web server.

    - Configure the FTP server.

    - Configure the mail server.

    - Add user accounts.

    - Open the firewall.


    # Step 1: Gather computer hardware


    For the Mini ISP, you need a computer that has enough disk space and processing
    power to support the people you have using. Additional hardware items you need
    are modems, communications hardware to connect to your ISP and the ability to
    back up data.


    # The personal computer


    Requirements for performing a Red Hat Linux Server installation sets the bottom
    limit on what will work for this project. Besides, that you need to take into
    account the resources you need to provide for each user.


    # Hard disk


    Here are some guidelines for choosing the hard-disk size you need for this project.


    +   - Red Hat Linux — If you are comfortable working from the command line, you
    can get by with a Red Hat Linux server installation, requiring around 850MB of
    disk space. By adding a graphical interface (GNOME or KDE), you should expect
    to use another 1GB of disk space. I usually assume that I will need at least 3GB
    of disk space for Red Hat Linux, without worrying running out.

    - Per client space — You need decide how much disk space is allowed to each client
    who will be using your Mini ISP. This is basically to allow the users to add the
    files needed for their personal Web pages. If, for example, you allow each user
    to have 500MB of disk space, for five users you would have to add 2.5GB of disk
    space.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# 194 Part IV — Small Business Opportunities


    Here are recommendations regarding the amount of disk space you should have available
    for this project:


    +   **Recommended Mini ISP** — An 8GB hard drive (or more). With this, you can
    install all of Red Hat Linux, plus allow space for four to five users who can
    have 500MB of hard-disk space each.

    **Minimum Mini ISP** — At least a 2GB hard drive. You can do a Red Hat Linux server
    installation, then have about 500MB of total disk space left over that your clients
    can fight for. This might work fine for a Mini ISP that is used for dial-access
    but you will still allow each user enough space for a bunch of plain HTML pages.
    (You''ll run out of space fast if you begin sharing things like video or software
    packages.)


    # CD, DVD, or other backup media


    You need some way to install the software and backup the data on your Mini ISP
    server. Because you will probably use a CD drive to install Red Hat Linux the
    Linux Toys packages, you might need to use a writable CD drive for all your installation
    or backup needs. Here are recommendations for backup media you might consider:


    +   **CD or DVD** — If you already have writable CD or DVD burners on your computer,
    you can simply use these devices for backing up your clients data. CD writers
    and disks are cheaper, but only up to 700MB of data each. DVD writers and disks
    are more expensive, but can hold up to 4.7GB of data.

    **Removable hard drive** — Some of our friends who support large ISP installations
    use removable hard drives for backing customer data. Of course, it is more expensive
    than copying to a CD, but all you have to do is pop the drive, copy your data
    over, and remove the drive for safe storage.


    +   **Network** — If you have another computer accessible to your Mini ISP server
    over the network, the network itself is a great medium to use to backups. If the
    backup host has a large hard disk, you can simply copy the files to the host,
    using a variety of backup tools in Red Hat Linux (such as amanda or pax) or by
    simply copying files across the network (using tools such as scp, cpio, or nftp.)


    # Modems


    You need to decide how many dial-in lines you are going to support and have one
    modem line. In your test system, we attach and configure two external modems.


    If you are going to buy a modem, clear of what are referred to as winmodems. These
    are not really modems. They are built to be on Windows systems, and necessary
    functionality is built into Windows inside of them themselves. While some of these
    modems will work with Linux, you need special drivers. (Refer to winmodems.org
    for further information about winmodems that can be made to plug into Linux)


    Most external modems (in other words, that have a separate power supply and plug
    into a serial port on your computer) that are described as supporting UART speed
    will work with Linux. You just want to make sure the modem supports the highest
    speed that will work on your phone lines (33.6 Kbps is the best you''ll get on
    standard phone lines). Figure 11-2 shows a 56K external modem that was tested
    and for this project.'
  merge: -1
