  md: '# Appendix C — Basics of Red Hat Linux Installation


    # BIOS


    The Basic Input/Output System (BIOS) is stored in the computer''s memory. BIOS
    is the first thing that the CPU looks for when you power up or reboot the computer.
    The BIOS program does the most basic checks and tests of the computer hardware
    to make sure it is ready to go to the next step.


    Once the BIOS identifies the basic hardware, it looks for an operating system
    to boot. A common order in which it will check for an operating system is:


    +   - Floppy disk

    - CD

    - Hard disk


    The search order for a bootable operating system may be different on your computer.
    The first two media (floppy and CD) are typically there so that you can override
    what would normally boot from the hard disk.


    ![](img/93c80330322e65d5105a6014afe2d85d_342_0.png)


    You can usually change the boot order from the system setup screen. When BIOS
    starts up, it will usually tell you what to press to enter setup mode. You might
    want to check that CD comes before the hard disk in the boot order if you are
    not able to boot from CD. If your computer won''t boot from CD, you may need to
    create an installation boot floppy.


    If no CDs or floppy disks are in your computer, the BIOS looks for your hard disk
    (typically the master IDE device on the IDE bus). Then the BIOS runs the program
    that it finds in the Master Boot Record (MBR), which is on the first sector of
    that device.


    In the case of the computer where you have installed Red Hat Linux, by default
    the GRUB bootloader will be what the BIOS runs from the MBR.


    # GRUB


    GRUB is the default bootloader for Red Hat Linux. When GRUB starts, it displays
    the bootable operating systems that were defined when you installed Red Hat Linux.
    If Red Hat Linux is the only operating system on the computer, you will probably
    see only one entry on the GRUB screen. If it is a dual boot system with Windows,
    you will probably see one line for booting Windows and one for booting Red Hat.


    At this point you can:


    +   - Wait 10 seconds and the default operating system boots.

    - Press Enter to boot the operating system indicated by the cursor.

    - Move the arrow keys up and down to select the operating system you want; then
    press Enter.


    ![](img/93c80330322e65d5105a6014afe2d85d_342_1.png)'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# 316 Appendix C — Basics of Red Hat Linux Installation


    GRUB has some editing capabilities (select the boot entry that you are interested
    in and press e). If there is some option you want to pass to the Linux kernel,
    you can do it by editing the command line. Normally, you shouldn''t have to change
    the boot entries at all. You might want to add to these boot lines if you need
    to identify some hardware that the kernel isn''t detecting or if you want to start
    at a boot level other than the default.


    To permanently change boot entries, or to add new boot entries for additional
    operating systems or special kernels, you can edit the /boot/grub/grub.conf file.
    For more information on GRUB, see the GRUB main page (type man grub from a shell).


    Assuming that you are booting Red Hat Linux, the system loads what is called the
    initial RAM disk (initrd). The initrd makes sure that drivers needed during the
    boot process are available to the Linux kernel


    # Kernel


    The kernel contains the most critical parts of the Linux operating system. When
    it starts, the kernel initializes hardware and allocates resources.


    With the basic Linux kernel up and running, the kernel starts the init process,
    which starts everything else.


    # Init


    The init process (/sbin/init) is responsible for starting up all the basic system
    services on your Linux system. It programs the system needs based on information
    in the /etc/inittab file. The actions that init takes:


    +   Determining the run level. The system will usually start in run level 3 (multi-user
    mode with a text-based login) or level 5 (multiuser mode with GUI-based login).


    +   Running the system initialization script (/etc/rc.d/rcysinit). This script
    does a bunch of stuff, such as setting the computer''s host name, setting the
    system clock, checking and mounting file systems, and loading modules.


    +   Starting and stopping run-level scripts. The init process checks the directory
    assigned to the run level and starts all processes beginning with "S" in that
    directory and stops all processes beginning with "K".


    The run-level scripts are used primarily to start services that run all the time
    on your system. This includes features for print servers, file servers, web firewalls,
    and other types of services.


    When we use a run-level script with Linux Toys, that run-level script will usually
    be set up to run automatically from the default run-level directory. That''s if
    you want the service to be on all the time. A lesson in run-level scripts is contained
    in Chapter 3.'
