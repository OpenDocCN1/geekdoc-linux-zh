    # ... a video card?


    Support for different video cards in Linux has grown dramatically over the past
    few years. However, you can still get a cluster that won''t or will work poorly.


    If you cant get your video card to work in Red Hat Linux, you should consider
    buying a cheap card that will work for you (as opposed to hunting for a workaround
    or a driver). You can find older supported video cards from any used computer
    store.


    Drivers for video cards in Red Hat Linux are maintained by the Xfree86 (www.xfree86.org).
    From that site, click the link to Support, Documentation and Resources. From there,
    you can search their database for information on your video card or click links
    to find supported hardware.


    ![](img/93c80330322e65d5105a6014afe2d85d_54_0.png)


    If you are looking for a video card that will work in Linux every time, I recommend
    using the NVIDIA chip. NVIDIA allows you to download the source-code drivers directly
    from its site so you can compile them for whatever system variation you are working
    on. While I always give preference to open source developed software, drivers
    are among those that written by best engineers who have an intimate knowledge
    of the hardware itself. NVIDIA is the only video-card manufacturer I am aware
    of that provides Linux drivers written by its own owners. (NVIDIA did not pay
    for this; I am simply a happy NVIDIA video chip user).


    Once you have installed Red Hat Linux, you can configure your video card using
    the redhat-config-xfree86 command (while you are logged in as the root user).'
