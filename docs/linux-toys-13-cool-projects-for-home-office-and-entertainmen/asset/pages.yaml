  md: 'When you are streaming video, the less you have happening on the server, the
    better performance you will get. Running ffserver and ffmpeg does not require
    a GUI. After you run raw xawtv to select and adjust your video input, you could
    change to init it 3 (type as root); then log out. You will see a simple text login
    prompt. Log in as root and try the following to start the server and begin streaming:


    ```

    # ffserver &

    # ffmpeg -ac 1 -vd /dev/video0 http://localhost:8090/feed1.ffm

    ```


    # Improving the streaming video client (mplayer)


    If you are getting poor response from mplayer, try adding a -hardframedrop to
    the command line. By dropping more frames, video can actually start to look smoother.


    To have some fun with mplayer, try the ASCII art driver (aa) by starting mplayer
    as:


    ```

    # mplayer -aa http://localhost:8090/test1.avi

    ```


    Step back from the screen. The aa driver represents the video in text characters.
    You can actually run mplayer from a shell with no GUI running on your computer.


    You can try to use mplayer with other video drivers as well. Type -vo help to
    see what other drivers may be available.


    I determined that data was being received from the TV video source at about 800
    kbps. I also know that the human brain perceives motion at around 30 frames per
    second. Using those two pieces of information, I had an upper bound on the video
    settings I could use. I found that using a video bitrate as low as 640 kbps resulted
    in near perfect recreation of the original video on the client machine. At around
    512 kbps and lower, the video artifacts started becoming very apparent when the
    television action got busy.


    # Summary


    Using ffmpeg and ffserver, you can stream video from your Red Hat Linux computer
    to your LAN or to friends on the Internet. Although the tools I describe in this
    chapter for streaming video on a network are still emerging technologies in Linux,
    they can work pretty well. You can use this streaming video to monitor video cameras,
    broadcast a meeting to a few friends or co-workers, or monitor a child''s room
    from another part of the house or from work. The mplayer video/audio player can
    play your streaming audio and video using the address (URL) of your streaming
    server and content.


