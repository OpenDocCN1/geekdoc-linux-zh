  md: '# Basics of Red Hat Linux Installation


    # appendix


    The hardest part about about installing Red Hat Linux is making sure that you
    have computer hardware that is compatible with Red Hat Linux. However, if you
    meet the minimum hardware requirements (CPU, disk space, and RAM in particular),
    a tremendous amount of (even older) PC hardware will work just fine for installing
    Red Hat Linux.


    Take a few minutes to look through this appendix to install Red Hat Linux and
    the procedure you can use to do the actual installation. After installation, check
    out the review of the Red Hat boot process to learn about how Red Hat Linux gets
    up and running.


    If after installing Red Hat Linux you find that you need to go back and add some
    software packages, you have a few choices. You can use the Red Hat Add and Remove
    Software window or the `rpm` command. Both of those tools are described at the
    end of this appendix.


    # Wait, You Need Some Stuff


    Every Linux project starts with Red Hat Linux on a PC (Pentium class or better).
    Our Toy requirements begin with Red Hat Linux requirements. Here is what you need
    before installing Red Hat Linux as the foundation for your Linux Toys.


    > Note The requirements shown here are for Red Hat installation. Before you install
    Red Hat Linux, you need to check on hardware and disk-space requirements for the
    individual projects you are building as well. Some projects, particularly those
    that involve putting music or video on your computer, can demand substantially
    more hard-disk space and may work poorly on slower processors.


    ![](img/93c80330322e65d5105a6014afe2d85d_332_0.png)


    # in this appendix


    +   - Getting a compatible PC

    - Starting Red Hat installation

    - Learning about disk partitioning

    - Booting Red Hat Linux

    - Adding software packages later'
