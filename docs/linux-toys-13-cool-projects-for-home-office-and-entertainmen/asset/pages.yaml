  md: '# Chapter 12 — Be a Web-Hosting Service 215


    # What should you provide?


    If you are just serving your Aunt Millie''s recipe for strawberry jelly (or for
    your Aunt Pearl''s jam), you may not feel the need to put a huge amount of time
    and money into your service and support. If the data you are serving is critical,
    you should consider how much money, time, and effort you want to put into your
    Web server.


    +   * Data backups — If the Webs you are serving any type of commerce, you need
    to back up the data on your Web server on a basis that is anything we can cover.


    See Chapter 11 for a discussion of backup methods that may interest you.


    +   * Log monitoring — The activities of your Web server and FTP server are logged
    in files in the /var/log directory. You can monitor these files manually or use
    various tools (such as logwatch) to scan log files and forward messages that could
    potentially dangerous activities to your mailbox.


    +   * Firewalls — Every computer connected to the Internet, but especially servers,
    should have a firewall between itself and the Internet. For a server, the most
    important feature of the firewall is to define which types of services someone
    can request from the server. (All requests should be denied.)


    Typically, the firewall is separate from the server. For our low-cost Web-hosting
    service, we''re going to have the firewall configured on the Web server itself.


    +   * Spam killers — There are lots of orders today to deal with spam (unsolicited,
    mass-distributed e-mail). Red Hat Linux comes with spassassin, which uses a set
    of rules to guess whether a particular message is spam or not.


    +   * Web statistics — So that clients can see how many visits they get, you can
    gather and provide statistics on each Web site''s activities. There are tools
    in Red Hat that let you produce graphical representations of traffic to the site,
    as well as raw data that a client can use with a variety of tools.


    # What do you need from a service provider?


    The same considerations for being a Mini ISP (see Chapter 11) apply to choosing
    an ISP for your Web-hosting service. You need bandwidth to the Internet, a public
    IP address, and an ISP that allows you to run a Web server (some ISPs provide
    a premium service).


    One additional consideration: In a ''Web-Hosting'' situation, you might consider
    co-locating your computer at the site of the service provider. It could cost a
    few dollars more per month, but you will probably get better bandwidth and possibly
    more reliable service. They usually have someone on site that can recover if necessary
    and some of universal power supply (UPS) to keep running in case the power goes
    out.


    # What do you need to tell your clients?


    Just because it is easy to do illegal activities on the Web doesn''t mean you
    won''t get yourself thrown in jail for it. If you own the computer and are hosting
    the service, law enforcement might not care that your Uncle Sidney was just up
    to his old tricks again.


    ![](img/93c80330322e65d5105a6014afe2d85d_242_0.png)'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# 216 Part IV — Small Business Opportunities


    You should consider putting together your own "Terms of Use" document that describes
    what someone can and can''t do with your hosting service. Here are some DON''Ts
    you might include:


    +   - Don''t store or transmit any data or files that violate local or federal
    laws. This includes any copyrighted data or software.

    - Don''t participate in any abusive behavior. This includes hacking, mail bombs,
    flames, or spam.

    - Don''t sell pornography.

    - Don''t do anything to harm the security of this server.


    Then be sure to tell your Web-hosting clients that they are responsible for their
    own actions. To protect yourself, it doesn''t hurt to keep an eye on the content
    you are hosting. Watch for big spikes in activity or a red flag that might show
    up.


    ![](img/93c80330322e65d5105a6014afe2d85d_243_0.png)


    As a general rule, service providers are not responsible for the content their
    customers make available. However, flawed legislation like the DMCA (Digital Millennium
    Copyright Act) has reverted some of that burden to the service providers. This
    is loosely akin to forcing the post office to open every layer and package that
    it handles to ensure that it is in compliance with federal, state, and local laws.
    Under the DMCA, service providers are given safe harbor wherein they have a limited
    amount of time to act when informed of a possible legal violation. Inaction will
    result in criminal and civil penalties. This is usually enough to scare small-time
    providers with limited budgets into compliance. Whether the original claim is
    justified or not is irrelevant.


    # Configuring Web Hosting


    Once you install Red Hat Linux, connect it to the Internet, and configure the
    Apache Web server, your Web server is essentially up and running. The rest of
    the configuration you choose to do depends on:


    +   - How you want to let your clients load their Web content

    - What additional services you want your clients to have

    - How much security you want to give your clients


    The setup you use with this project is similar to the Mini ISP (Chapter 11). So,
    you can start with the first few steps in that procedure, with some slight modifications,
    before continuing with the steps in this project.


