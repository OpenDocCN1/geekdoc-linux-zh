  md: '# ABCs of Using Linux


    # appendix


    You don''t need to know a lot of Linux to build these projects... but you do have
    to know a few things. If you are sparking, brand new to Linux, I strongly recommend
    that you go through this appendix.


    +   - Get logged in.

    - Get around.

    - Get permission.

    - Get working.


    The last bit of help this appendix will get you information about where to get
    more help. In particular, Red Hat Linux Bible (also by Christopher Negros) can
    give you the background you need to expand your use of Linux in general. (It also
    contains the Red Hat Linux CDs that you need with this book.)


    ![](img/93c80330322e65d5105a6014afe2d85d_308_0.png)


    # The Shell and the GUI


    There are two basic ways to use Linux:


    +   - The shell — In the beginning, there were no colors, icons, or windows. If
    you wanted the computer to do something, you had to type a command using was referred
    to as the shell command interpreter (or simply the shell).

    - The GUI — To make computers more intuitive to use, the graphical user interface
    (GUI) was developed. Instead of making you type commands to make the computer
    do things, the GUI allowed you to use a mouse (or other type of pointing device)
    to start programs, open files, and generally work with your computer.


    Linux offers both shell and GUI methods for operating your computer. Linux Toys,
    there are times when I''ll ask you specifically to use either the GUI or the shell
    (usually because the particular tool I want you to use is either a GUI window
    or shell command). Therefore, quick primers in GUIs and shells are in order.


    # in this appendix


    +   - Using the shell or graphical interfaces

    - Linux files and directories

    - The root user account and file permissions

    - How running processes

    - Editing text files

    - How to find more information'
  merge: -1
