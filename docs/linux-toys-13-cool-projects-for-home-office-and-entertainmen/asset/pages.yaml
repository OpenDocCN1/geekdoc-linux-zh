  md: '# Starting Up Your Temperature Monitor


    To start up your temperature monitor, you will need to connect the temperature
    sensors to your computer and install Red Linux and the Itweather software. Next,
    you configure DigiTemp to read temperature information and run scripts to output
    information in different ways.


    # Step 1: Gather the hardware


    The only hardware you need for this project is a temperature sensor and a PC.
    To run the basic DigiTemp software, the PC doesn''t require much power. So this
    is a good project to do on a bare-minimum PC. What do you do with the temperature
    information you gather may require you more disk space.


    The details of the hardware used for this project are the following.


    # The PC


    You can use the minimum PC that will work with Red Hat Linux for this project.
    That means you can get by with a Pentium class (200 MHz minimum) PC with less
    than a 500MB disk space. See Appendix C for the amount of disk space if you want
    to do a Red Hat server install (to add temperature data on a Web server) or a
    Personal Desktop install (to use any GUI tools with your temperature data).


    The other hardware requirements for the PC itself are:


    +   - CD-ROM—You need this to install Red Hat Linux as well as the Linux Toys
    software.

    - Serial port—The DigiTemp temperature sensor is made to connect to a serial port
    on your PC.


    Any other hardware you would need on the PC depends entirely on what you want
    to do with the temperature data you gather. If you are using the data as a temperature
    sensor, you probably want to add an Ethernet card.


    # Temperature sensors


    The temperature sensors used for this project are from the DigiTemp Web site (www.digitemp.com).
    Brian Lane, the maintainer of the project, puts together the sensors in his spare
    time. If you prefer, you can buy the parts and put them together yourself, if
    you are handy with a soldering iron.


    The DigiTemp 1-wire temperature sensor provides an interface to any of several
    different temperature sensors from Dallas Semiconductor (www.maxim-ic.com). These
    include the DS18S20 (DS18S20-PAR), DS1822 (DS1822-PAR), and DS18B20 (DS18B20-PAR)
    digital temperature sensors.'
