  md: "# Chapter 10 — Setting Up a Digital Receptionist 181\n\nOgg Vorbis uses a variable\
    \ bitrate encoding scheme for optimal sound quality while minimizing disk utilization.\
    \ When considering a sound encoding scheme, consider technical features as well\
    \ as the fact that Ogg Vorbis is unencumbered by licensing restrictions. The group\
    \ that owns the rights to the MP3 encoding format recently enforcing restrictions\
    \ that have resulted in a scarcity of MP3 players delivered with Red Hat Linux.\
    \ For more information on MP3 licensing, see http://www.mp3slicensing.com.\n\n\
    **Other options — In most cases, you don't need to change most of the other options\
    \ available in the vocp.conf file. Here's how other options that may interest\
    \ you are set in this file:\n\n```\ncall_logfile /var/log/vocp-calls.log\nlog_incoming\
    \ 0\ndefault_branch_to \nrepeat_message_on_error 1\n```\n\nIf you need to debug\
    \ your VOCP setup, by call_logfile, log messages are sent to the /var/log/vocp-calls\
    \ log file. Having log_incoming set to 1, causes all incoming calls to be logged.\
    \ With default_branch_to set to 0, if the user does not enter any input, VOCP\
    \ will not branch to another branch. (Change this to a branch number to have it\
    \ branch to a particular box.)\n\nIf a user enters an invalid entry, with repeat_message_on_error\
    \ set to 1, the original message is repeated (if 0, the message isn't repeated).\n\
    \n![](img/93c80330322e65d5105a6014afe2d85d_208_0.png)\n\nIf your phone service\
