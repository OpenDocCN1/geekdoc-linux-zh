  md: '# Understanding User Logins and Permissions


    One of the reasons Linux (and its predecessor UNIX) is considered to be so secure
    is that it was designed from the start to be a multiuser system. By assigning
    each user name and password, a Linux administrator can easily set up boundaries
    that define what each person can and cannot do to the computer system.


    Every Linux system must have at least one user account, the root user: You assign
    a password for root when you install Red Hat Linux. Keep that password safe, because
    if you won''t be able to administer your system (and anyone with your root password
    will be able to do anything they like to your system).


    Besides the root account, you should also have at least one regular user account.
    The name of that account can be anything you like (although typically you would
    use some version of your real name as user name). The first time you boot Linux
    after installation, you will be asked to add a regular user account as part of
    the firstboot program. (See Appendix C for a description of the firstboot program.)


    With separate user accounts, the administrator of your Linux system can define
    permissions related to what each user can and cannot do:


    +   Read — Permissions to read a file allow the user to view its contents.


    +   Write — Permissions to write a file let the user change or delete the file.


    +   Execute — Permissions to execute a file (typically an application) let the
    user run the file as a program.


    The next few sections describe what you should know about the root user and how
    permissions work in Linux.


    # Being root . . . the super user


    The root account is referred to as the super user (su), because when you are logged
    in as root you can change any application, file or directory on the system. Because
    the root user can be used to cause a lot of damage to your Linux system if you
    are not careful, I want to give you a few tips about using the root account:


    +   Mostly log in as a regular user — If you are using Linux to browse the Web
    or play a game, don''t log in as the root user. Have a regular user account for
    doing everything except system administration. This will help protect you from
    carelessly damaging your system.


    +   Start GUI tasks as a regular user — If you try to open a window, for example
    to add a user or configure networking, you can do so as a regular user. The system
    simply prompts you for the root password before it will let you do the task.'
  merge: -1
  pgno: 323
