  md: '# # Shopping for a Used PC


    Buying a used computer can be like buying a used car. You can end up broken down
    on the edge of the information highway, without a tow truck in site. For a $20
    investment, you might take a risk on a computer that (if it doesn''t work) will
    end up in the dumpster. If you start getting into the hundreds (approaching the
    costs of a low-end new computer), you better have recourse if it doesn''t work.


    So, with so many computers out there, how should you approach this task? Whether
    you are looking at a garage sale, auction, computer store, or Web site, you want
    to balance the risk with the amount you are paying.


    # # Questions to consider


    You don''t have to blindly assume all the risk yourself when you shop for a used
    computer. Here are a few basic questions you should ask about a PC before you
    buy it:


    +   - Can I try before I buy it? If you can''t try it and you can''t return it,
    don''t pay much for it. There are too many used computers around to risk more
    than few dollars on a computer-you''ll have to throw away if it doesn''t work.


    If you can it, go through the evaluation process described earlier to at least
    know if it boots and what its basic components are. It''s worth a few more dollars
    if you at least know it starts up and meets the minimum you need to run Linux.


    +   - Can I return if it doesn''t work? Return policies on used computers vary
    wildly. If you can see the PC before you buy it, at the very least, you would
    like a Dead On Arrival (DOA) agreement that lets you return it if it doesn''t
    work once you get it.


    +   - Can I have a warranty? I''ve seen new computers for only a few hundred dollars
    that have three-year parts and labor warranties. There are rebate and recertified
    retailers available for under $300 that offer a three-month parts and labor warranty.
    If you are paying more than for a used PC, you should have some kind of warranty
    if it doesn''t work.


    If you are going to take the plunge and buy a used computer that you know you
    can''t return, you might at least check whether the components in the computer
    might be salvageable. A whiz-bang video card, decent 56K modem, or an extra Webcam
    thrown in can can soften the blow if the computer has a bad disk or blow power
    supply.


    # # Where to buy?


    There are used computers everywhere. If the one in your closet won''t work, here
    are a few places to look.


    # # Computer stores


    Stores that sell new computers sometimes sell used computers. A big advantage
    to these stores is that, like a car dealer, they may want to move out their used
    inventory before it'
  merge: -1
  pgno: 57
