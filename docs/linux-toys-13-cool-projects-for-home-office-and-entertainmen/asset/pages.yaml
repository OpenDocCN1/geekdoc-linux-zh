    # # Trying Other Bootable Linuxes


    DogHouse Linux is just one of many Linux-bootable-media distributions available
    today—and not one of the most interesting to advanced users. If you find the fascinating
    operating systems on a floppy or CD-ROM, there are ways you can look into other
    special-use bootable Linux


    One great place to look for bootable Linux distros is Distrowatch.com. The Distrowatch
    .com site contains tons of distributions that you can download and try out. Some
    of these are made to simply boot from a floppy disk or CD-ROM and run. Others
    are fully-blown, installable Linux distributions.


    As for individual bootable Linux distributions, here are some that might interest
    you:


    +   **GeeXBox (http://geebox.free.fr/)** You can play digital media from your
    hard disk by booting a GeoXBox CD-ROM. You can watch movies from DVD (if you have
    a player) or VCD or play audio CDs in a variety of formats. The advantage of GeoXBox
    is that you do not have the overhead of a full-blown Linux distribution just to
    play video or music.


    +   ** Bootable Card (www.linux-bbc.org)** For a bootable Linux system that fits
    in your wallet, there is the Bootable Linux Card. This Linux distribution fits
    on a mini-CD that is in the shape of a business card. It can be used as a rescue
    CD, to boot a computer and to your hard disk if software repairs are needed. It
    includes X, so you have a GUI to work with.


    +   ** Coyote Linux (www.coyotelinux.com)** If you want to share an Internet connection
    through a single computer, Coyote Linux is a simple way to make a computer into
    a router/firewall. Coyote Linux supports dial-up or Ethernet connections. It can
    run on hardware as old as a 486 with 12MB of RAM.


    As mentioned earlier, Herbix is also a good bootable Linux. A big advantage of
    Herbix is that you can use it to turn a computer that is loaded with your Web
    server content into a Linux server.'
