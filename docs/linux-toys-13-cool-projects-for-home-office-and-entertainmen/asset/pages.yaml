  md: '# Appendix B — ABCs of Using Linux 293


    # Digging deeper into the shell


    Have I told everything there is to know about the shell yet? Not by a long shot.
    But I''m running out of room and this is a book about toys, after all. If you
    find yourself way into Linux from this book, I recommend that you get a more complete
    understanding of the shell in the following areas:


    +   - Shell programming — You can put together groups of commands and run them
    as shell programs. Most Linux administrators commonly create shell scripts to
    everyday system tasks. The start-up scripts that launch some of the projects in
    this book are shell scripts.


    +   - Administrative commands — Although there are graphical interfaces for doing
    most system administration tasks, many their equivalent text-based commands will
    be more powerful and flexible. Also, to administer computers over a network, to
    run commands (or necessary) instead of GUI tools. Common administrative commands
    for checking file systems (fsck), adding users (useradd), and administering printers
    (lpadmin) are often found in the /sbin or /usr/sbin directories.


    +   - Shell environment variables and expansions — I''ve touched on a couple of
    environment variables ($HOME and $PATH), but there are dozens more that hold bits
    of information about your shell environment. There are also ways of expanding
    arithmetic expressions, filenames, and the output of commands to include in the
    shell commands you run. Using these items can make it more efficient for you to
    use the shell.


    See the "More on Linux" section for some pointers to more information on the shell,
    and with all other aspects of Linux you may want to learn about.


    # Understanding How Linux Is Organized


    Knowing Linux keeps things on your computer will help you know where to look when
    something goes wrong. Here is a quick rundown of how files and directories are
    organized in Linux:


    # Administrative files


    Most administrative files are contained in the /etc directory and its subdirectories.
    Most administrative files in /etc are plain text files, while a few others are
    data files created from the output of the text files. GUI windows are preferred
    for working with these files (they will lead you through and do some error checking),
    there are times when there''s no other way to fix something to edit a file in
    /etc directly.


    Important files in /etc include passwd (listing all users on the system), hosts
    (listing names and IP addresses), printcap (containing information about your
    printers), and services'
