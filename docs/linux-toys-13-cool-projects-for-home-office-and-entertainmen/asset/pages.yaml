  md: '# What''s in the Home Video Archive?


    ![](img/93c80330322e65d5105a6014afe2d85d_93_0.png)


    Video recording and playback are not quite ready for prime time when it comes
    to open source software. There are several projects that are about to do some
    really great things with video. However, they are fragile enough that if you don''t
    get everything exactly right, they will break. This brings us to what we did for
    the Home Video Archive project.


    We put together the Home Video Archive using pieces from several different different
    open source projects. In particular, the video is captured using a combination
    of tools from the ffmpeg (ffmpeg.sourceforge.net) and nvrec projects (nvrec.sourceforge.net).
    To view and adjust your video input, we use the xawtv television player. To play
    back the video, we use the mplayer video.


    > This and other video projects are among the most difficult ones to get working
    well. Video projects will not run on minimal hardware! Go carefully through the
    sections that describe the hardware you need for this project. By getting recommended
    hardware and installing software as instructed, you''ll have the best chance of
    having success with this project. After that, keeping audio and video in sync
    and balancing frame rate/size with performance will be your biggest challenges.'
