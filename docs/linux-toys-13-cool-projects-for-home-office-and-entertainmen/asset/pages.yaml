  md: '# # 174 Part III — Projects for the Home


    +   - External Zoom/Faxmodem V.92

    - Zoom 56K PCI


    Attach the external modem to a serial port (COM) on your computer. When Red Hat
    Linux is installed and booted, your modem should be automatically detected and
    linked to the /dev/modem device.


    By far the hardest part of this project was in finding a modem that actually works.
    In the fax world, research has shown that no modem firmware does FAX 2.0. The
    conventional wisdom with projects like Hylafax is to use your modem in fax mode
    1.0 and software to do the proper mode 2.0 (translation). While I believe winmodems
    are a blessing in disguise, A winmodem offloads most of the processing work to
    the machine through a software driver. This would enable a driver that implements
    voice capabilities properly. As of the time of writing, no such driver exists.


    ![](img/93c80330322e65d5105a6014afe2d85d_201_0.png)


    # Speakers


    It''s handy to have two sets of PC speakers when you set up this project. Attach
    one set to the sound card so you can check and play back messages. Attach the
    other set to the speaker jack on the modem so you can test data messages playing
    on your modem.


    # Sound card


    You need a sound card to plug in your microphone and speakers to record and play
    back messages, respectively. Choosing and configuring sound cards is discussed
    in Chapter 3.


    # Microphone


    You need a microphone to record the messages that are played when people call
    your message machine. Many PCs come with microphones that either plug into the
    sound card or are built into the PC.


    # A telephone line (and an extra telephone for testing)


    You need a mobile phone, a second phone in your house, or neighbor''s phone to
    be able to call your voice modem and test it out. You won''t need an extra phone
    once you''ve done setting up the project.


    # Step 2: Install and configure Red Hat Linux


    When you install Red Hat Linux, you can do a Personal Desktop install. You really
    need only the GUI, however, if you want to use the graphical window VOCP provides
    for setting up voice boxes.


    See Appendix C for information on installing Red Hat Linux.


