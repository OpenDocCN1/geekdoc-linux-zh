- img_proc: true
  md: '# 88 Part II — Entertainment Projects


    through the dependencies. (I discuss the issue further you go to install Red Hat
    Linux.) On of that, you want to figure out 240MB of hard-disk space for every
    hour of com- pressed video you want to store.


    ![](img/93c80330322e65d5105a6014afe2d85d_115_0.png)


    With RAM is always better, however, that it is not the only thing one should consider
    when it comes to memory. Most of the working of video data is managing the pipeline
    between the CPU and the hard drive. Data is first from the hard drive to the memory
    and then steps through the various levels of cache to be processed by the microprocessor
    (assuming you don''t have a hardware video decoder). The best way to improve performance
    is to either expand the width or speed of pipeline (or both). Recently advancements
    in memory come with the use of DDR (Double Data Rate), which increases the speed
    and width of the memory pipeline. DDR memory is rated in form PCXXXX, the four
    Xs represent how many megabits per second can run through the memory bus (generally
    the North Bridge). Maybe your motherboard supports you to find a list of DDR you
    want to use out and purchase it!


    # Video card


    If you have an AGP slot on your computer, you can use any AGP video card for this
    pro ject is supported by the X Window System in Red Hat Linux. If you have a PCI
    card, I found PCI cards support Direct Rendering Infrastructure (DRI) work better.
    (See the DRI site at http://dri.sourceforge.net to find a list of supported cards.)


    We tried several video cards for this project. Many Nvidia cards will work (go
    to the www.nvidia.com Web to download the latest). Matrox G400 or G400-MAX cards
    will also work well. My cheap PC had an Intel 8180 motherboard with an 82810e
    DC-13 chipset graphics controller (I had to make sure DRI was).


    If you have a supported card, but it is working poorly, there are some ways that
    you can improve its performance. Refer to the "Troubleshooting Video" section
    of this chapter for information on improving video performance.


    # TV capture card


    Any TV capture card supported by Video4 drivers should work for this project.
    See Chapter 4 for descriptions of cards that we recommend. We have had good luck
    with Hauppauge cards. A supported TV capture card should be detected the first
    time you boot your system after Red Hat Linux is installed. (If not, you might
    be able to get it working by typing the following as root from a Terminal: modprobe
    bttv.)


    # Network card or modem


    You need a connection to the Internet (using a modem or network card) to be able
    to download the TV listings to your computer. An always-up Internet connection
    or one that dials out upon request is preferable, the TV-show lists are gathered
    automatically once a week. You can configure an Ethernet network card using Red
    Hat Linux installation. To configure a modem, refer to Chapter 7, "Creating a
    Home Network.",'
