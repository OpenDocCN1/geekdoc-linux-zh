  md: '# Appendix B — ABCs of Using Linux


    You can change the permission on any file you using the chmod command, with either
    numbers or letters (rwx) as arguments. Read permission is assigned to the number
    4, write permission to 2, and execute permission to 1.


    ```

    $ chmod 664 $HOME/.bashrc

    $ ls -l $HOME/.bashrc

    --rw-r--r-- 1 joe tech 124 Mar 13 03:03 /home/.bashrc

    ```


    In the preceding example, the first 6 sets the owner''s permission to read/write,
    the second 6 sets the group permission to read/write, and the final 4 everyone
    else''s permission to just read. To run a command or a directory, these items
    must have execute permissions. For example, type the following:


    ```

    $ chmod 700 $HOME

    dwxr-xr-x 1 joe tech 124 Mar 13 03:03 /home/joe

    ```


    Here you can see that the listing is for a directory (indicated by the d at the
    beginning of the permissions). The owner (joe) has full permissions to his home
    directory (rwx). Group and all other permission are created so that nobody can
    see or access the contents of his home directory (which is the correct thing to
    do, unless you need to access to your directories, for example, a Web server like
    the one described in Chapters 11 and 12). If you want to open the contents of
    your home directory completely (which shouldn''t do), you can type the following:


    ```

    $ chmod 700 $HOME

    drwx------ 1 joe tech 124 Mar 13 03:03 /home/joe

    ```


    If you went ahead and opened up your directory (even though I thought you not
    to), change it back by typing chmod 700 $HOME. If the directory is used to hold
    Web content, use 711 instead, so the Web server can access that content.)


    # Checking System Processes


    If your Linux system is on, there are probably a whole bunch of separate processes
    running. With files and directories, each user can control his or her processes,
    while the root user can control all processes. To see what processes are running,
    use the ps command as follows:


    ```

    $ ps ax | less

    PID TTY STAT TIME COMMAND

    1 ? S 0:04 init

    ```


    ```

    1517 ? S 0:00 syslog -m 0

    1538 ? S 0:00 /usr/sbin/sshd

    1710 ? S 0:00 sendmail: accepting connections

    2399 ? S 7:09 /usr/bin/ogg123

    ```'
