  md: '# 120 Part II — Entertainment Projects


    Here are a few other tips to help you if you decide to create your own cabinet:


    +   - Some games have a virtual dip-switch on them that lets the game be flopped
    vertically between players one and two. You can use this feature for a cocktail
    table-style game cabinet.

    - Multiplayer games needing more than one joystick can be hard to configure. Many
    games, however, need only four cardinal directions and one or two buttons to fire.
    For this situation, you can buy or build a keyboard adapter. For more information,
    and a place to buy buttons and digital joysticks, check out the Build Your Own
    Arcade Controls site (www.arcadecontrols.com).


    # Summary


    Those console games you thought would never see again have gotten new life thanks
    to the MAME project. More than 3,000 games run in the MAME console game emulator.
    Using the Xame version of MAME, you can run those old games on a PC with Red Hat
    Linux or other Linux and UNIX systems. To launch games with the Linux Toys Arcade
    Game player, we rely on MAME, Xame, and a front-end called gRustibus for launching
    the games.'
