    dozen popular CDs, I averaged about 60MB per CD (varying between 40MB and 100MB)
    of compressed music. At that rate, I could store about 17 CDs per GB.


    So here are our recommendations for the amount of disk space you should have available
    for this project:


    +   - **Jukebox**— At least 6GB. With this, you can install the whole CDDB, Red
    Hat Desktop install, and add 25 CDs. Each GB will get you space for about 17 CDs.


    +   - **Minimum Jukebox**— At least 2GB. With this you can do a minimal Red Hat
    Linux installation (with a few packages added) and not install the CDDB. You will
    need a network connection to get CDDB information from another computer, and you
    will only have 1GB of space (about 17 CDs) for music.


    CD drive The CD drive for loading your music CDs. CDs are also the preferred media
    for installing Red Hat Linux and the Linux Toys software.


    Sound card You need a card that is supported by Red Hat Linux. If your PC comes
    with a sound card, go ahead and try it. The firstboot program (described in Appendix
    C) lets you configure your sound card. Step 2 includes instructions on how to
    useconfig to detect and configure your sound card if firstboot can''t do.


    Network card (optional) Because the basic jukebox is designed to be self-contained,
    you don''t need a network card. However, if you have a LAN at home or in your
    office, a network card gives you the option of using extended features, such as
    getting automatic CDDB updates or using the CDDB from another computer. It also
    saves about 3GB of disk space.


    The stereo (optional) If your stereo can accept audio input, you can plug that
    stereo directly into your PC''s sound card. Use the cable shown in Figure 3-3
    to connect your sound to my stereo.


    ![](img/93c80330322e65d5105a6014afe2d85d_68_0.png)


