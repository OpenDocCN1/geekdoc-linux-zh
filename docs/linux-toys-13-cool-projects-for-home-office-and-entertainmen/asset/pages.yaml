  md: '# 290 Appendix B — ABCs of Using Linux


    Type these three commands to show a short list of the contents of your home directory,
    a long list, and a list that also includes hidden files (that begin with a dot):


    ```

    $ ls $HOME

    $ ls -l $HOME

    $ ls -a $HOME

    ```


    There are lots of options you can use with ls. For example, -t sorts files by
    the time they were modified, -c lists files in columns, and -s lists files by
    size. Often, you will use options together (for example, -ls -1S sorts files by
    size and show the actual size, along with other information, about each file as
    well).


    +   5. Try some commands for working with files and directories. Type:


    ```

    $ mkdir $HOME/info

    ```


    This creates a directory named in your home directory. To remove that same directory,
    type:


    ```

    $ rmdir $HOME/info

    ```


    To create an empty file (in this case, in your home directory named hat), use
    the touch command as follows:


    ```

    $ touch $HOME/hat

    ```


    To rename a file or directory (or actually, move it to a different name), use
    the mv command as follows:


    ```

    $ mv $HOME/hat $HOME/hatbox

    ```


    To make a copy of a file, use the cp command as follows:


    ```

    $ cp $HOME/hatbox $HOME/hatbox2

    ```


    To remove a file, use the rm command as follows:


    ```

    $ rm $HOME/hatbox

    ```


    # Using special characters


    Some characters have special meanings to the shell. These special characters can
    save you typing or tell the shell to take information from or send it to. I''m
    going to show you a few special characters here.


    Use an asterisk (*) to match any combination of characters. For example, type
    the following:


    ```

    $ ls /usr/bin/redhat-config*

    ```


    The previous command results in a list of all commands in /usr/bin that begin
    with redhat-config (these are GUI administration tools that I described earlier).
    The asterisk can also go at the beginning or in the middle, to match filenames
