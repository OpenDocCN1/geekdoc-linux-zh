- img_proc: true
  md: 'Once you have the basic Linux Toys Jukebox up and running, you can expect it
    to do the following:


    +   - Rip all songs from any CD you insert into the player (provided the CD is
    among those listed in the CDDB) without any interaction

    - Compress each song

    - Create a directory (named for the CD) and store each song in that directory

    - Automatically play, in random order, all songs from all CDs you ripped


    We designed the player to be up and running quickly and to play automatically.
    Think "commercial free radio." It simply plays and plays with no interaction required
    by the end user. Think about this: After you''ve set up the jukebox, you''ll have
    a database full of CD information and a hard disk full of identifiable music.
    From that point, there are an unlimited number of ways you can enhance it.


    Figure 3-1 shows what a completed Linux Toys Jukebox can look like after you have
    hooked it into your stereo system. No flashing lights, but the basics are there.


    ![](img/93c80330322e65d5105a6014afe2d85d_65_0.png)


    Figure 3-1: Store and play your music with a Linux Toys Jukebox. (Shuttle XPC
    image used with the permission of Shuttle Inc.)'
