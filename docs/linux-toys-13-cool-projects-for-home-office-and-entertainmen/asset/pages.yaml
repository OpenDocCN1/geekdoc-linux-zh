    If you have your own ideas, we''d be happy to hear from you.


    # Understanding the Jukebox


    This last section just provides a reference to the location of files and directories
    that are important to the Linux Toys Jukebox. Most of the commands and files for
    the Linux Toys Jukebox are contained in the /usr/share directory structure. Commands
    that are particular to this project are contained in the /usr/local/bin directory.


    ![](img/93c80330322e65d5105a6014afe2d85d_88_0.png)


    # Jukebox files and directories


    Figure 3-6 illustrates most of the files and directories that make up the jukebox.
    This view is from the /usr/local/share directory.

    Here is a breakdown of the contents of your music jukebox:


    +   - The Database Daemon (/usr/local/share/cddb) — Files in this directory set
    how the CD Database daemon process (cddb) behaves. However, you don''t have to
    change any of the settings in these files for the default jukebox. However, if
    you want to share your CDDB with others, you can use files in this directory to
    set information such as who is allowed to access your CDDB server. The server
    directory contains the log file (which logs all activities of the cddb daemon)
    and fuzzy_index (which contains the fuzzy matching file of all the songs).

    - The CD Database (/usr/local/share/cddb) — This directory and its subdirectories
    contain hundreds of thousands of CD listings. Each CD is contained in a separate
    file and is categorized by type of music (blues, classical, country, folk, jazz,
    and so on). You typically use this set to make changes and updates to the CD database.

    - Music (/usr/local/share/music) — Each ripped CD is represented by a directory
    under the music directory. Typically, the directory is named for the artist and
    CD title, separated by underscores. Each song is in a separate file, beginning
    with its order number on the CD and ending with the compression type used (ogg
    for Ogg Vorbis).'
