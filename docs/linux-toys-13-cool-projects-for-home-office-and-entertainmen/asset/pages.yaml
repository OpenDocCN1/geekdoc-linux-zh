  md: '# Chapter 15 — Creating a Digital Picture Frame 267


    Every laptop is different. The step-by-step example that we include here may not
    even apply to your laptop. There are a few tips, however, that you should keep
    in mind no matter what laptop you are using:


    +   - After you have unscrewed a component, and gently remove it! When you move
    too quickly, it is easy to break off a call or drop scissors or other pieces into
    the laptop.

    - LCD screens are very fragile. Pressing too hard on the screen or dropping it
    will likely damage it to the point where you can''t use.

    - Keep all the parts as you dismantle the laptop. You may need some of them later
    as you mount it in the picture frame. Or you may decide to make it back into a
    laptop later. Static shields should be reused to prevent short circuits.

    - Use a lot of electrical tape to make sure you don''t get a short and destroy
    the hardware. Don''t use electrical tape for any structural or on the matter,
    since it contains oil that can bleed into the matrix. Chuck waxed paper to keep
    LCD wiring tape sticking to anything.

    - Boot your laptop a few times along the way. No use in mounting a digital picture
    frame that is broken.


    Here are the steps for dismantling a laptop for this project, based on what Chuck
    went through to modify his MAG Innovation laptop into a Linux Toys Digital Picture
    Frame:


    +   1. Check that the digital picture frame software is installed and running
    properly on the laptop before beginning. Then power down and unplug the computer.

    2. Remove the battery.


    Be sure there is no power to the laptop before you proceed.


    +   3. Remove the screws holding the LCD screen to the case (or, if the case is
    held together by tabs, gently pry apart the tabs). Screws may be secured by tape
    or rubber plugs on the front of the screen frame.


    4. Gently separate the LCD screen, as shown in Figure 15-5. Be careful:


    +   - Don''t break the small latches that attach the frame around the screen.

    - Don''t break the cables connecting to the LCD.

    - Don''t press on the screen or hit it with any sharp.


    +   5. Gently fold the screen and identify the high-voltage wires and the data
    port ribbon cable.


    +   6. Disconnect the high-voltage wires and data-port ribbon cable; then remove
    the screen from the laptop. (Store the screen in an anti-static bag. The screen
    may be the most expensive part to replace, so treat it kindly:)


    ![](img/93c80330322e65d5105a6014afe2d85d_294_0.png)'
  merge: -1
