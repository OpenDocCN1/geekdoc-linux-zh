  md: '# 68 Part II — Entertainment Projects


    Chuck, Kevin (our tech editor), and I spent a four-day weekend doing the final
    builds in this book. Kevin brought an AMD 400 with 64MB of RAM. The IDE controller
    was only capable of 16-bit I/O. We popped a TV capture card and attached some
    rabbit ears as an antenna. The computer could transmit and play video just fine.
    Capture had to be done in lower resolution than the default and skipped occasionally.
    So we could use it to record from a Webcam or TV, but there were too many skips
    to use it to record VCDs.


    ![](img/93c80330322e65d5105a6014afe2d85d_95_0.png)


    Note


    Hard disk

    Here is the approximate disk space you will need:


    +   - Red Hat Linux (Personal Desktop install) —At least 1.7GB of disk space

    - Linux Toys home video packages —About 100MB of disk space

    - Recorded video —About 2GB per hour of video record

    - Making DVDs —Each DVD can hold up to 4.7GB of data. You are going to need at
    least twice that amount of disk space to build a disk image to burn to DVD.


    I wouldn''t suggest starting the project with less than 4GB of disk space. Even
    with that, you''ll have to copy or burn the video off to another medium every
    time you want to record another video. With at least 20GB of disk space devoted
    to video, you won''t have to scramble for space all the time.


    CD-RW or DVD-RW drive

    You need a medium for installing Red Hat Linux and Linux Toys software. You also
    need a way to burn your video onto some removable medium. A CD-RW or DVD-RW drive
    can serve both purposes.


    Given the compression tools and settings we recommend for this project, you should
    be able to store about one hour of video in about 1.4GB of space. Therefore, on
    each of these recording media, you should be able to store the following amount
    of video:


    +   - A 700MB CD-R or CD-RW should hold about 30 minutes of video.

    - A 4.7GB DVD-disk should hold more than three hours of video.


    If you don''t have a DVD recorder, you might want to look into buying one. Prices
    have gone down drastically from what they were a year ago. Linux supports burning
    to DVD. Using DVDs can save you the trouble of splitting up your videos.


    Video card

    Many low-end PCI cards won''t work for this project. Most NVIDIA video cards will
    work well, provided you download NVIDIA''s proprietary video drivers for Linux.


    We took the approach of just trying the video card or on-board video that comes
    with the PC. If it didn''t perform well, we used an NVIDIA card and usually solved
    the problems. Later in this section, I step you through installing and configuring
    an NVIDIA card.'
