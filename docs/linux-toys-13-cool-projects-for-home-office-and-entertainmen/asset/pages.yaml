  md: '# Appendix B — ABCs of Using Linux 297


    **Use su to run commands** — If you need to run a few quick commands as the root
    user, open a Terminal window from your regular GUI session and type the command:


    ```

    $ su -

    Password: ********

    ```


    After you enter the root password, you have full privileges to run administrative
    commands. Adding the hyphen (-) after su ensures that the root user''s environment
    is correct (so that /sbin and /usr/sbin are added to your variables and root login
    scripts are). After you are using the root account, type Ctrl+D to exit the shell
    and return to regular user permission.


    **Be careful** — As root user you can easily crash your Linux system if you are
    not careful. Make backup copies of configuration files before you change them.
    Use asterisks (*) and other special matching characters carefully (rm -rf * will
    remove everything below your current point in the file).


    ![](img/93c80330322e65d5105a6014afe2d85d_324_0.png)


    In particular, when you are working from the shell, anything you change or remove
    from the files and commands in Linux will be permanently changed. Again, keep
    backup copies of configuration files and use commands as rm very carefully!


    If you are using Linux to build some of the standalone tools in this book, protecting
    the root password may not be critical. Add your Linux computer to the network,
    however, and a poorly secured system can be attacked and used to attack other
    systems on your LAN or on the Internet. The first step is having a good (and private)
    root password. Other security measures are described in Chapter 11, "Be a Mini
    ISP"


    # Setting file and directory permissions


    Each file, directory, application, and device in Linux has the long list associated
    with it. You can see what permission is using with the ls -l command. Here is
    an example of the ls -l command output:


    ```

    $ ls -l $HOME/.bashrc

    -rw-r--r-- 1 joe tech 124 Mar 13 03:01 /home/joe/.bashrc

    ```


    Permissions for files and directories are set in three sets of settings: Read,
    Write, and Execute. If all permissions are turned on, they appear as:


    ```

    rwxrwxrwx

    ```


    The first three permission bits define (r), write (w), and execute (x) permissions
    for the owner of the file. The next three apply to the group which holds the files,
    and the third applies to every other user on the system can do.


    In the preceding example, the permissions on the .bashrc file (which holds settings
    for the shell) is -rw-r--r--, which indicates that the file''s owner (who is joe)
    has permission to read and write this file. Other users in the group tech can
    only read the file. Likewise, all other users can only read the file.'
