  md: '# 116 Part II — Entertainment Projects


    At this point, you should be ready to start playing games.


    One of the really cool aspects of MAME is that it allows you to turn on and off
    game cheats. I was able to talk to Tom Griffith, a lifelong gaming expert who
    filled me in the history of console cheats. Over the course of time, console debuggers
    were developed that enabled gamers to peek into the actual contents of the game''s
    running memory and make changes. Certain memory values, when changed, would do
    things like invincibility or advanced weaponry. These memory values were shared
    among the gaming community, thus enabling people with a little bit of technical
    expertise and a debugging tool to enjoy aspects of the game that were previously
    unavailable to them. The MAME group put the values of these “cheats” into a database
    that is released with the MAME package itself.


    # Playing the Games


    To launch a game, either double-click it or select it and click Start Game. If
    the game doesn''t start, look in the Terminal window where you started gRustibus
    to see if there are any error messages that might be useful for debugging the
    problem.


    Figure 6-5 shows the Robby Roto game. This is one of very few games available
    to use MAME that can be distributed for noncommercial use. To find out more about
    getting game ROMs and issues about MAME, visit Mame World (www.mameworld.net/).


    ![](img/93c80330322e65d5105a6014afe2d85d_143_0.png)


