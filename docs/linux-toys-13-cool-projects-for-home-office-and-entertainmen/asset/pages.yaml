    ![](img/93c80330322e65d5105a6014afe2d85d_213_1.png)


    FIGURE 10-6: A pager message results in the incoming phone number''s being sent.


    If your e-mail reader is on a Windows system, you need to get an audio player
    that can play files in OGG format. Here are two suggestions:


    +   - Quintential Player (www.gwinware.com/news.html)

    - Winamp3 (www.winamp.com)


    # Troubleshooting VOCP


    The biggest problem we encountered with this project was finding a modem that
    was fully supported. Messages from the answering machine were nearly inaudible
    at first with the modem we used. By increasing the volume of our messages, we
    were able to work around the problem.

    If you run into some trouble with this project, here are a few things you can
    try:


    +   - Increase debug levels — Open the /usr/local/etc/vgetty+sendfax/voice config
    and increase the debug level (for example, voice_log_level 6). Try calling into
    the modem and watching the messages to log files in the /var/log directory.

    In /var/log/vocp.log file, you can watch all the instructions in each script being
    executed. The voicelog file shows the interactions going on between VOCP and the
    caller. The vgetty.modem file will show you which configuration files are being
    read and whether or not the modem is initialized properly. In the vm.log file,
    you can see message files are being played. The vocp-calls.log shows calls being
    logged.'
