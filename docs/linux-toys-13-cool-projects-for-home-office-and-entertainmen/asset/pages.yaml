    # Step 9: Record your new voicemail messages


    Now that you know what messages you want to use in your voicemail system, go ahead
    and create those messages and convert them to rmd format. Here''s how:


    +   1. Plug a microphone into the interface jack on your sound card.

    2. From a Terminal window, type aumix to open the sound mixer. With the aumix
    screen displayed, do the following:

    - Turn the microphone volume all the way up by clicking the slider next to Mic,
    so that the "o" appears all to the right.

    - Click the green P in the microphone column so that it turns into a red R. This
    indicates that you will record from the microphone device.

    - Press S (to save the settings) and Q (to quit aumix).

    3. Change to the messages directory as follows:

    - # cd /var/spool/voice/messages

    4. When you are ready to record (that is, the microphone is right in your face),
    type the following command and immediately begin recording your messages. The
    message could say something like: "You have reached the Jones residence. To leave
    a message, press 1, followed by the pound sign.\n- # rec mymbox.wav

    Press Ctrl+C when you are finished recording.

    5. Convert the wav file to pvf format as follows:

    - # wavopf mymbox.wav mymbox.pvf'
