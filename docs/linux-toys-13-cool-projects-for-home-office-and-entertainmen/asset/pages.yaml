  md: '# chapter 12

    Be a Web-Hosting Service


    If you have a PC, Red Hat Linux, and an always-up connection to the Internet,
    you have all the tools you need to publish content on the Web. Get yourself a
    public IP address (so the Internet always knows where your server is), and have
    your friends and family each their own domain names, and you could be a Web-hosting
    service!


    Like the Mini ISP project in Chapter 11, this chapter steps through the hardware
    and software issues related to setting up an Internet server. The tools described
    here are the same ones used by many professional Web-hosting providers. In fact,
    the Apache server software we describe here is used worldwide on nearly every
    popular platform (including Linux, of course).


    Step through the procedures here you will end up with a simple configuration that
    offers all the best features you would expect from professional Web-hosting service.
    Backing up your server is also a full complement of tools for monitoring and maintaining
    the server. (It is running in Linux, after all)


    Here are some of the things you could do with this Web-hosting service:


    +   - Create a Web site for a local charity event.

    - Put your resume online to help in your job search.

    - Publish pictures to share with others around the world.

    - Display the rates for your son''s lawn-mowing business.


