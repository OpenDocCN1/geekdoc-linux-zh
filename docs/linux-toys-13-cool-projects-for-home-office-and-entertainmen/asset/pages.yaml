    # Step 7: Create the firewall


    Use the descriptions in Chapter 7 to configure your firewall. Port 80 is the critical
    port for allowing access to your Web server content. That is the location that
    Web browsers try by default when simply giving a URL for Web content.


    Besides port 80, you might consider opening ports 20 and 21 (FTP), 53 (DNS), 22
    (remote login with ssh), 25 (e-mail retrieval), and port 110 (e-mail retrieval
    with post3).


    At this point, you should have a working Web server. Next, you can refer to the
    "Monitoring Your Server" section for information on maintaining your server and
    keeping it safe. Then, refer to the "Adding Web Server Content" section for information
    on how your Web-hosting clients can put their content on your Web server.


    # Monitoring Your Server


    Techniques for securing and monitoring your server are mostly the as described
    for the Mini ISP project in Chapter 11. For Web hosting specifically, however,
    you want to be able to:


    +   * Monitor any patterns of abuse to the Web site.

    * Produce statistics to see how much activity each virtual Web site is getting.


    # Watching log files


    Our first suggestion is to watch your basic log files. If you like to do things
    graphically, Red Hat Linux has a GUI tool for checking the system log files called
    System Logs window. You can open the System Logs window from the desktop, click
    System Tools -> System Logs (or type redhat-logvi). Figure 12-2 shows an example
    of this window.


    Of interest to you from the System Logs is the Boot Log (to see if services started
    properly), Mail Log (to view e-mail activity), and Security Log (to see who is
    trying to log in your system). You should check these files on occasion to make
    sure that no business is going with the server.


    The Access Log and Apache Error Log are most useful for a single domain Web host.
    You may remember that you created separate access and error log files for each
    virtual host on your Web server. You can check the old fashioned way: Open them
    in a text editor.


    If you have the logwatch package installed, there is an easier way to scan through
    potentially dangerous log messages. Once per day (the default is 4:00 a.m.), logwatch
    scans through your log files and sends an e-mail to the root user. E-mail message
    details any potentially dangerous occurrences (failed login attempts, port scans,
    and so on).'
