  md: '# Chapter 10 — Setting Up a Digital Receptionist 173


    In our project, we are using the Ogg Vorbis audio format to compress the answering
    machine messages we send. Check out email-attachments.txt file in /usr/local/vocp/doc
    for information on using ogg possibly replacing it with MP3 voicemail attachments.
    (There is also useful information in that directory.)


    # Step 1: Gather the hardware


    As I noted earlier, the primary hardware you need for this project is a PC and
    a supported voice modem. A few extra pieces will be helpful as well, such as speakers,
    a microphone, and a network card (since you need to send the e-mail). And, of
    course, you need a telephone line to answer.


    # The personal computer


    The speed of the PC''s bus is not as critical as audio projects, such this one,
    as it is for video projects. Most PCs that can run Red Hat Linux will work with
    this project.


    # Hard disk


    Your computer need at least 1GB of disk space to do a Red Hat Linux Personal Desktop
    install. You need less than 10MB for the Linux toys you need for this project.
    Other than that, each voicemail message will take only a few kilobytes of disk
    space.


    # CD drive or floppy disk drive


    You need some media for installing Red Hat Linux and Linux''Toys software. CD
    is the preferred medium, but a floppy disk and an Ethernet network card will work
    as well.


    # Network card (recommended)


    Unless you are just storing messages locally or e-mailing them to users on the
    local computer, you need a network card (or at least a modem), so that the e-mail
    messages can be sent to users off of the voice receiver machine.


    # Modem


    This project requires a modem that supports voice. Don''t pull any old modem out
    of the bin at the local computer store and expect it to work. We used the following
    modem with this project and found it to work quite well:


    Chunk tried a few other modems as well, but the with some low volume levels when
    messages were played to callers through the modem, but we were able to overcome
    that. The VOCP project also lists the following modems as being reported to:


    +   - Zyxel 1496 and 2864

    - MultiTech MultiModem MT2834 ZDX V

    - ELSA MicroLink TQ series

    - US Robotics/3Com 56K Voice FaxModem Model 5610

    - Diamond 56e Pro voice'
