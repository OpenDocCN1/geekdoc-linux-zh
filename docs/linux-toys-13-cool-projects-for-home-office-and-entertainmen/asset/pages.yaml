  md: '# A Lesson in ...


    “Lessons” like these give you some guidance on a topic or skill you need for the
    project.


    Throughout the book, we have interspersed technical tips from Chuck. We refer
    to these Chuck''s Tech Tips. Here''s what a Chuck''s Tech Tip looks like:


    ![](img/93c80330322e65d5105a6014afe2d85d_14_0.png)


    Chuck''s Tech Tips provide technical explanations of some aspect of the topic
    at hand.


    # On with the Show


    We hope that you are as excited to try out these projects as we are to bring them
    to you. If you are a Linux expert, feel free to jump right into the project of
    your choice. If you are new to Linux, be sure to go through the introductory materials
    and step through the appendixes to get a feel for how to use Linux.'
  merge: -1
