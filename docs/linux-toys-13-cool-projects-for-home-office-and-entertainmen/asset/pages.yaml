  md: '# Chapter 1 — Exploring Linux Toys


    and you your friends start talking about your latest home projects, do your spouses
    discretely move to the other side of the room? If so, then you are our people!


    As for your expertise, I expect you to be computer literate, but not necessarily
    an expert in Linux. For example, if I were to point to a PC''s mouse, keyboard,
    video card, serial port, parallel port, and monitor, you should be able to pipe
    up with what each of those things are. If I ask you if you know what text editors,
    application programs, and Web browsers are, you should nod at me knowingly. Beyond
    that level of information, you should be able to follow along (with the help of
    some Linux basics at the back of this book).


    If you are a genius and our toys have set off a maelstrom in your brain of ways
    to improve on or take a new direction with any of our projects, we welcome you
    with open arms. Our projects are built on open source software and put back into
    the community as open source software. Read the GNU General Public License (described
    later); then extend, expand, and enhance your heart''s content. We have made the
    LinuxToys.net site as a gathering place for you and others who want to go beyond
    the boundaries of this book.


    ![](img/93c80330322e65d5105a6014afe2d85d_32_0.png)


    FIGURE 1-1: Take that old PC and transform it into a Linux toy that fits your
    lifestyle.'
