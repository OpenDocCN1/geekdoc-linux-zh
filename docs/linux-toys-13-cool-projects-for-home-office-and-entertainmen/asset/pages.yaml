  md: '# Chapter 3 — Making a Music Jukebox 63


    # The ripper (ltautorip)


    The script that starts the CD ripping (/usr/local/bin/ltautorip) does a few things
    than just copy the songs from your CD. The ltautorip script is based on the autorip
    script by Jonathan Mayer (autorip.sourceforge.net). Once Itjukebox launches the
    ltautorip script, cd lists continuously for a CD to be inserted into your drive.

    Then it does the following:


    +   - Checks your database to see if the CD is a known music CD. (If it is not,
    the CD is immediately ejected.)


    +   - Uses the cdparanoia command to copy songs (.wav files) to your /tmp directory


    +   - Creates a directory (named for the CD title) and file for each compressed
    song into OGG format (named for the order it comes on the CD and song title) in
    the /tmp directory


    +   - Copies the entire CD directory (containing the compressed songs) to /usr/local/share/music


    +   - Ejects the CD (ready for you to insert your next CD to rip)


    The ltautorip script was designed to simple bulk ripping of CDs. When you ripped
    a bunch of CDs, the list of the /usr/local/share/music directory as follows is
    what you see (press the space bar to page through the list, q to quit):


    ```

    $ cd /usr/local/share/music

    $ ls -CF | less

    Alan_Jones-More_Music:

    01-Helpless.ogg 06-You_Re_So_Bold.ogg

    02-Helpless.ogg 07-Go_Get_em.ogg

    03-Can_T_Help_It.ogg 08-All_Around.ogg

    04-Guess_I_Useless.ogg 09-My_Day.ogg

    05-It_Is_Hot.ogg 10-Rain_Will_Grow.ogg

    ```


    Bridget_Plumber-We_Here_We:

    01-Big_Dance.ogg

    02-There_We_Go.ogg

    03-Here_It_Is.ogg

    04-Ain_It_Not.ogg

    :


    With your songs in place, there are a lot of different ways you can play them
    back. There are also ways you can change the ltautorip script itself. The "Playing
    with Your Jukebox" and "Modifying Your Jukebox" sections for some ideas of things
    to do.


    # The database server daemon (cddbd)


    The CD database server daemon (/usr/local/bin/cddbd) basically runs in the background,
    waiting for requests for information from the CDDB database. It is set up in the
    jukebox to listen to port number 8880. The cddbd command can also be used to rebuild
    your CDDB (described earlier).


    ![](img/93c80330322e65d5105a6014afe2d85d_90_0.png)'
