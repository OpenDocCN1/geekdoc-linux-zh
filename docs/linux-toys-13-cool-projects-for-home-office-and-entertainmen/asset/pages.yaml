  md: '# 142 Part III — Projects for the Home


    # Making Your Network Toy-Ready


    So far, you have created a network where you can safely (and pretty easily) get
    to the Internet and share files and printers among the computers on your home
    network. Any computer that you connect to your LAN is set to use DHCP (most are)
    will automatically gain instant access to the Internet. To be able to have your
    server and Toys talk to each other, however, you have to do a bit more work.


    As stands, when a computer starts up on your LAN, it is assigned an arbitrary
    IP address, with no TCP/IP name attached to that address. To be able to reach
    your Linux computers (some of which may be running without a keyboard and monitor),
    we need to know the IP address or, even better, know a name that we can use to
    reach that address. There are a few ways to do this out. Here is what we are going
    to do:


    +   - Fixed IP addresses — When DHCP assigns an IP address to a computer on your
    LAN (actually, to your Ethernet card on LAN) you can tell it to assign a particular
    IP address. You do this by associating a MAC address (which uniquely identifies
    the Ethernet card) to an IP address.


    +   - Names in /etc/hosts — Assuming that you will use Linux Toys Home Network
    server to communicate with the other Linux computers in your house, you can add
    the name and IP address to your server''s /etc/hosts file for each of those computers.
    Then you can distribute that to the Linux Toys computers so they can all reach
    each other.


    Now, to all networking gurus beginning hopping up and throwing this book against
    the wall at the mere mention of using the /etc/hosts file, let me explain why
    I did this way. We''re talking about a home network here, where I''m assuming
    that the configuration will look like the one we see in Figure 7-8.


    In this example, most of the computers on the LAN are just looking to surf the
    Web and share files and printers. They only need to reach other computers for
    file and printer sharing (which they can do fine fine as described in the Samba
    File and Print Sharing step). The computers that need to be contacted using TCP/IP,
    in this model, are all Linux computers. To save everyone the trouble of setting
    up DNS for a home LAN on your project, you can do this instead:


    +   - DHCP — Assign particular IP addresses to the Linux Toys and Linux Home Network
    servers on the network.


    +   - /etc/hosts — Create an /etc/hosts file and add the names and IP addresses
    for all Linux computers on the LAN.


    Note You can certainly set up dynamic DHCP and DNS on your LAN to do what we are
    doing more elegantly. It will scale up better when you have hundreds of Linux
    Toys on your LAN. (Go for it!) I devote more than a dozen pages to a similar DNS
    configuration in Red Hat Linux Bible, but I think it''s overkill for what we are
    doing here.


    ![](img/93c80330322e65d5105a6014afe2d85d_169_0.png)'
