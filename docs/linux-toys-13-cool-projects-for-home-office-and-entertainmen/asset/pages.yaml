  md: '# 274 Part V — Just for Fun


    # Using Your Digital Picture Frame


    The Linux Toys Digital Picture Frame was designed to run by itself. At this point,
    you don''t have to do anything but turn it on and off. However, by reattaching
    a keyboard or using the network card, you can add and delete images for the digital
    picture frame.


    We didn''t make serial, USB, and ports other than the Ethernet card accessible
    from the digital picture frame. If you made those ports available, however, you
    could attach a digital camera or other device to the digital picture frame, then
    access the laptop via the Ethernet card (as described in the "Loading Images"
    section earlier in this chapter).


    To turn off the digital picture frame, you can usually unplug it. Not too many
    files are open, so you should be okay. A cleaner way to shut down would be to
    log in as root user (using the ssh command over your Ethernet connection). Then
    type shutdown to turn off the digital picture frame before unplugging it.


    # Summary


    An old laptop can serve well as an attractive digital picture frame. If you can
    carefully remove the laptop components from the case, then reassemble the pieces
    you need in a picture frame, you can end up with a nice accessory to display your
    digital images. With an optional network card added, you can access your digital
    picture frame from your LAN to periodically update your catalog of images.'
  merge: -1
  pgno: 301
