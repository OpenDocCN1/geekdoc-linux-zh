  md: '# Chapter 15 — Creating a Digital Picture Frame 263


    # Supported Images


    People often save images to JPEG format. However, using the xview command, the
    digital picture frame can display images in other formats as well. You can type
    the following command to see the graphics types supported by xview (a bunch of
    image types not supported are also displayed but are not listed):


    ```

    # xview -support

    Type Name Can Dump Description

    ```


    | niff | Yes | Native File Format (NIPP) |

    |---|---|---|

    | jpeg | Yes | JPEG-style JPEG Image |

    | tiff | Yes | TIFF image |

    | pbm | Yes | Portable Bit Map (PBM, PGM, PPM) |


    # Loading images


    There are lots of different ways to get images onto your picture frame. The issue
    gets a bit trickier when you remove the keyboard and install the laptop into the
    picture frame. Here are a few suggestions:


    # Getting images from a CD


    If you are running Red Hat Linux from a GNOME or KDE desktop, the contents of
    any CD you insert are automatically displayed on the desktop. You can open the
    /usr/local/images directory in a file manager window and drag-and-drop the files
    from the CD directory to that.


    # Getting images from a digital camera


    Red Hat Linux uses the gtkm window for downloading images from your digital camera.
    Here''s a quick procedure for downloading images from your digital camera in Linux:


    +   - Connect your digital camera to the USB or serial port on your laptop (assuming
    it has one). Make sure that the camera is on and set to download.

    - From the Red Hat menu, click Graphics -> Digital Camera Tool. The gtkm window
    should appear.

    - From the gtkm window, select Camera -> Add Camera. A pop-up window appears.

    - Click Detect. Gtk will try to determine what camera you are using. If the camera
    is properly detected and the right port is selected, the name of the camera and
    port it is connected appear in the window.

    - Click Apply and OK.

    - In the left column, select your digital camera, and then select the directory
    containing the images. Thumbnails should be downloaded on the right side of the
    window, as shown in Figure 15-4.'
