    # Summary


    The VOCP project offers a lot of flexibility in setting up voicemail boxes for
    your Linux Toys Digital Reception. Using definitions for different boxes, callers
    can navigate your voicemail system and record messages or key in return phone
    numbers. Those audio messages can be attached and sent with e-mail messages, so
    the recipient of the messages can play them back on a PC.


    The trick to this project is getting a supported modem and then creating your
    own custom messages and configuring the voicemail boxes in a way that callers
    can navigate your system. If you get stuck, check your log files and connect with
    the VOCP mailing list.'
