- img_proc: true
  md: '# What''s in the TV Recorder/Player


    The primary software packages used in this project include the following:


    +   - TV player (xawtv) — Includes the xawtv command, which opens a window for
    viewing television programs. (This package comes with Red Hat Linux.)


    +   - TV listings (XmTV) — Contains commands used to grab the television-listing
    information displayed by WebVCRplus from the Internet


    +   - TV recording setup (WebVCRplus) — Provides the Web-based interface for selecting
    the TV shows to record and choosing recording options


    +   - Video recording (Nvrec) — Includes the commands (such as ffmpeg) to record
    the TV shows and store them on hard disk


    +   - Video encoding (Avifile) — Contains the basic commands and codecs we chose
    to do the recording.


    5-1 shows how the Linux Toys TV Recorder/Player looks like with WebVCRplus displaying
    television listings and xawtv displaying television.


