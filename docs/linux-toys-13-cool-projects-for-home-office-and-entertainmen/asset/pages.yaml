  md: '# Recording Your Videos


    You can now play videos to your Linux computer through your TV capture card. With
    that working, you are ready to begin recording your videos to hard disk. Unfortunately,
    we don''t have a pretty GUI for this project. However, we do have some neat open
    source tools that are coming nicely in development.


    To record video in Linux, you will have to play a little. While we tried to pick
    the best open source video tools available for reading, recording, and compressing,
    some of the projects are still considered to be in their early stages of development.


    We recommend using the nvec tools for recording the audio and video from your
    source device. The nvec project effectively wraps wrappers around several well-known
    video recorders to ensure that audio and video are properly synchronized. We chose
    the ffmpeg command, due to its incredible versatility and range of codecs and
    file formats to choose from.


    One of the problems that plagued this project was keeping audio and video synchronized.
    After recording more a few minutes of video, the result resembled one of those
    Japanese overdubbed Godzilla movies. A little research has shown that has been
    a universal problem since the early days of video. A few tweaks mitigated the
    problem but didn''t solve it. We were able to permanently solve the problem with
    Justin Schoeman''s nvec package. Justin''s code accurately timestamps the audio
    and video streams as they come into the machine. The audio is dynamically warped
    to the exact video frame that it came in.


    Here''s a little procedure for recording synchronized audio and video in Linux.


    Remember, you are about to start recording video using the channel and settings
    from the xawtv you just closed. If you forget to select the channel for your VCR
    (probably 3 or 4) or didn''t set brightness, colors, and other values the you
    like, you aren''t just going to get the results you want. If your video input
    is coming from the composite or other part, you can select that input as from
    xawtv. Bottom line — what you see (when you leave xawtv) is what you get.


    After you have checked that the video output is being displayed, rewind the tape
    to exactly where you want to start recording.


    +   1.

    2. Double-check the brightness, hue, color and contrast look good to you. (Click
    the xawtv window and move the sliders on the window that appears to adjust the
    picture).

    3. Close xawtv. (You can''t record xawtv having the video device.)

    4. From a terminal, type mixer to open the sound-mixer. You need to select the
    device that you will be recording from. In my case, I patched the Audio Out from
    my TV capture card to the Audio In in my sound card. So, on the aum mixer, I clicked
    the green P in the left column of the Line slider so that it turned into a red
    R. (This set the audio input of my sound card as the recording device.) Type S
    and Q to save the changes and quit.

    5. Make a directory to hold your captured video. For example:


    ```

    $ mkdir /usr/local/share/homevideo

    ```


