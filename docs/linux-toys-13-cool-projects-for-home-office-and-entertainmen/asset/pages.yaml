  md: '# Controlling Races Over the Internet


    By now you should have the basic concept of the project. Our next job is to set
    the cars so they can be used to race or run obstacle over the Internet (or another
    network). In this case, we want to:


    +   - Use two cars instead of one (so they can compete or bash into each other
    or whatever). Make sure that they use different frequencies!

    - Use cars with longer battery life (ZipZaps aren''t made to run very long).

    - Set up user accounts so someone can log in to a network to run the cars.

    - Set up a camera on the racecourse so the drivers can see their cars.


    As mentioned earlier, I used a car called a Mini Transbot that I got from Radio
    Shack. The car has only two buttons, so I needed only use the first two sets of
    relays. For the second car, I used the second set of relays (5 through 8). The
    scripts we provide allow you to use two- or four-button controllers. Here is what
    you do:


    +   - Follow the Configuring Toy Controller Procedure to add your first car to
    the LynXPORT (probably replacing the ZipZaps with a car that has longer battery
    life). If the car has only two buttons, connect two sets of wires (relays 1A and
    1B).

    - Add a car to the second set of relays (relays 5 through 8), using the relays
    shown in the accompanying table.


    | Forward | Back | Left | Right |

    |---|---|---|--|

    | WIRE | or/wh wh/or | bl/wh wh/bl | br/wh wh/br | gr/wh wh/gr |

    | RELAYS | 5-C 5-NO | 6-C 6-NA | 7-C 7-NO | 8-C 8-NO |


    +   4. Create a user account that uses the ltrc-manual-car-1.pl script as its
    login shell. Here is an example, as root user from a Terminal window, creating
    a user account called car1:


    ```

    # useradd -m car1 -s /usr/local/bin/ltrc-manual-car-1.pl

    ```


    +   5. Repeat the previous step, but this create a new user named car2 and then
    repeat the step for car2 (adding passwords as prompted):


    ```

    # useradd -m car2 -s /usr/local/bin/ltrc-manual-car-2.pl

    ```


    ```

    # passwd car1

    Changing password for user car1.

    New password: *****

    Retype password: *****

    ```'
