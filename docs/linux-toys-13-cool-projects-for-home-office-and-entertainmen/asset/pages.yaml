    to take your output back to the dorm and work on our maps of the Colossal Cave.


    In adventure (adventure command), you type one or two-word commands to move around
    the caves, pick things up, put things down, and look around. You tell your guide
    what to do. Your guide tells you where you are and what items are there.


    You start outside, a small brick building. Your goal is to explore underground
    caves and bring back as much treasure as you can, without being killed.


