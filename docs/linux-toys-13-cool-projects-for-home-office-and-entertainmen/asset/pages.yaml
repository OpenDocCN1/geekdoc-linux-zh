  md: '# 192 Part IV — Small Business Opportunities


    ![](img/93c80330322e65d5105a6014afe2d85d_219_0.png)


    > On a serious note, this project illustrates how to do a set of features on a
    single computer that for security and performance reasons, are typically done
    on multiple computers. Also, while these procedures are legitimate for setting
    up the individual services we cover, you should take more care in building Internet
    servers that protect critical data.


    In Red Hat Linux Bible, I go into much more detail related to the configuration
    and security of Linux servers. There are also many other books and Web sites that
    can help you set up secure Linux servers when you are protecting more than just
    a few personal Web pages.


    If service and reliability are an issue, you can consider hiring someone to maintain
    your server. For example, a company like Chuck''s Quantum Linux Laboratories (www.quantumlinux.com)
    can give support for your Red Hat Linux server; a company like RackSpace (www.rackspace.com)
    can manage a computer for you at its data center.


    # About the Mini ISP


    The Linux Toys Mini ISP project spans a range of features built into Red Hat Linux
    that we are going to join into one computer. It consists of a set of canned configuration
    files and the instructions that come with this book. Besides that, you do not
    need much more than a PC, a couple of modems (and related phone lines), and whatever
    equipment you need for a high-speed Internet connection.


    While this project is basically an exercise in setting up a range of network services,
    it can also be useful in situations where low-volume, dial-up Internet access
    is needed. The concepts of'
  merge: -1
