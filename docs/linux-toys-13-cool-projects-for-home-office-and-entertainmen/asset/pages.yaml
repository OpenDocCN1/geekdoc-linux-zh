  md: '# 164 Part III — Projects for the Home


    Searching the 1-Wire LAN

    1025042E000800AA : DS1820 Temperature Sensor

    107FC04800800EF : DS1820 Temperature Sensor

    ROM #0 : 1025042E000800AA

    ROM #1 : 107FC04800800EF

    Wrote .digitemp-prc


    The ROM numbers are unique to each of your sensors, they are listed in the order
    they are found on the wire. When the digitemp command is done, it writes the .digitemp-file
    in the current directory ([/usr/local/bin/).


    Regardless of where the digitemp command is, it will look for a .digitemp-file
    in the current directory when the command is run. If you run digitemp in a Web
    page like /var/www/html/index.php, a .digitemp-file will be created-at /var/www/html/


    +   2. Run the digitemp command to read temperatures from all (-a) the sensors:

    # digitemp -a

    Digitemp v3.2.0 Copyright 1996-2003 by Brian Lane

    GNU Public License v2.0 - http://www.brianlane.com

    Jun 10 23:50:26 Sensor 0 C: 24.00 F: 75.20

    Jun 10 23:50:28 Sensor 1 C: 25.19 F: 77.34


    This example shows two sensors: one on the little board (DT1A) and the other on
    the end of the wire (the SOA).


    If you get an error when the digitemp command you run, there are a few things
    to try:


    +   * Check that there is a .digitemp-file in the current directory. (You will
    prob-get a read/write error if a file is not there.)

    * Check that your COM port (COM1, COM2, COM3, and matches the device name (ttyS0,
    ttyS1, ttyS2), when you initialized the device.

    * Check that permissions are open on the port (ls -l /dev/ttyS0). To permit-wide
    access, use root user: chmod 666 /ttyS0


    +   3. If everything seems to be working, you can try a few digitemp command lines.

    The first example, with the -w option, "walks" through all the devices on the
    wire, so you can check what sensors are on the:


    ```

    # digitemp -w

    Devices on the Main LAN

    1025042E000800AA : DS1820 Temperature Sensor

    107FC04800800EF : DS1820 Temperature Sensor

    ```


    Here''s an example of how to output a line with time and temperature informa-tion
