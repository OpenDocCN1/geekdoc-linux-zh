  md: '# Chapter 14 — Controlling Toy Cars 253


    Note: If the script fails to open the COM1 port, open a Terminal window and type
    su - and the root user password (when prompted), and type chmod 666 /dev/ttyS0
    to open permission to your COM1 port.


    # Operating Your Car in Patterns


    You can use the ltrc-auto.pl script to operate the car in preset patterns. Three
    simple patterns come with the ltrc package:


    +   - Circle (circle.lpx)

    - Figure Eight (figure8.lpx)

    - Square (square.lpx)


    You can run any of those patterns using the ltrc-auto.pl script. For example,
    to run the square pattern, you can type the following from the Terminal window:


    ```

    $ /usr/local/bin/ltrc-auto.pl square.lpx

    ```


    Create your pattern files if you like and put them in the /usr/local/bin directory.
    replace .lpx with the name of your pattern file. Pretty dumb, but kind of cool
    too.


    The patterns consist of a list of commands. Each command tells the car way to
    go and how long to go that way. The commands are F (forward), B (back), L (left),
    R (right), FL (forward-left), FR (forward-right), BL (back-left), and BR (back-right).
    The number that pattern goes represents the delay that relay stays on (in milliseconds).
    The figure8.lpx pattern goes-left 2.2 seconds, forward-right 2.2 seconds.


    ```

    F 220000

    FR 220000

    ```


    The square.lpx script goes forward and forward-left in increments between .3 second
    and .6 second.


    ```

    F 600000

    FL 600000

    F 400000

    FL 400000

    FL 600000

    F 300000

    F 350000

    ```


    The circle.lpx script simply goes front-left for 2.2 seconds.


    ```

    FL 220000

    ```


    You can create patterns that do any pattern you like. Just create a .lpx file,
    include the directions you want, and copy it to the /usr/local/bin directory.
    Try making one that drives around your car where it is sleeping and comes back
    to you. Or to make it drive around the edge of your table without falling off.


    ![](img/93c80330322e65d5105a6014afe2d85d_280_0.png)'
