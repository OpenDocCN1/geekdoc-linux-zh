  md: '# 130 Part III — Projects for the Home


    # Step 1: Install and configure Red Hat Linux


    Start with a Server install type of Red Hat Linux and add GNOME or KDE desktop
    packages (see Appendix C) so that you have a GUI If you want to go a minimal installation,
    you can create the configuration files by hand (no GUI). That can save you about
    1GB of disk space. Important packages that you will need to include the following:


    +   - redhat-config-samba — Contains the Samba configuration window

    - samba-config — Contains the configuration files and commands needed to use Samba
    file and printer sharing

    - samba — Contains extra commands and documentation used with Samba

    - gnome-lokkit — Includes the Lokkit (Configure Firewalling) window

    - dhcp — Includes features to configure Red Hat Linux as a DHCP server


    Before you start Red Hat Linux, you should install two Ethernet cards on the computer.
    This lets you begin to configure the following features during Red Hat Linux installation:


    +   - Network configuration — Defines how Red Hat Linux gets the names and addresses
    it for your Ethernet cards to communicate with the Internet and your LAN

    - Firewall — Sets the basic firewall rules that allow or prevent different kinds
    of services to pass between the Internet and your LAN through the Linux Toys Home
    Network server


    Refer to the Create Network Interfaces (server and client) and Set Up the Firewall
    steps for information on how to set up those features (during installation or
    after Red Hat Linux is installed).


    # Step 2: Create network interfaces (servers)


    We recommend two Ethernet cards on your Linux Toys Home Network server. One connects
    the server to the Internet and the other connects to your home local area network
    (LAN). Red Hat makes it easy to set up those interfaces.


    On the LAN side, I can suggest exact ways to set up the network information that
    your server and the client computers on your need. On the Internet side, there
    is some variation, depending on how you are connecting to your Internet Service
    Provider (ISP). The information you need to get started:


    +   - LAN interface — We are going to have every computer on your LAN assigned
    its IP address, using private IP addresses. The interface to your LAN from the
    server will be assigned the address 10.0.0.1 with a mask of 255.255.255.0. This
    allows you to use IP addresses 10.0.0.2 through 10.0.0.254 for the other computers
    on your LAN.


    ![](img/93c80330322e65d5105a6014afe2d85d_157_0.png)


    If you already have a home LAN in place, you may need to use IP addresses that
    work with the pool of addresses that are in place. If you are starting your LAN
    from scratch, the addresses recommended here will work well.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Chapter 7 — Creating a Home Network 131


    Internet interface — We are assuming that you are connecting the Linux Toys Home
    Network server to some high-speed DSL or cable modem connection to get to the
    Internet. If that is the case, you need to connect and configure equipment using
    the directions from your ISP. (Otherwise, see the "A Lesson in ... Dial-out Internet
    Connections".)


    What you need know from the ISP is: When you connect the Ethernet card on your
    server to the DSL or cable modem, what equipment will have DHCP running to an
    address to your Network interface? If it does, you can simply configure your network
    interface to use DHCP (If you are not sure, you can simply configure the interface
    using DHCP and if it picks up an address automatically.)


    If the ISP''s equipment does not provide you with an address using DHCP, you need
    to assign a permanent IP address to your Network interface. The ISP might give
    you a permanent IP address to use. Or, more likely, the DSL modem or other equipment
    might come with an interface with an address assigned, over 192.168.0.1. If that
    is the case, you can assign an IP address of 192.168.0.2 to your interface.


    # During Red Hat installation


    During Red Hat Linux installation, if you have your Ethernet cards installed,
    you can configure them to work with your LAN from the Network Configuration screen
    that appears. Figure 7-5 shows an example of that window.


    ![](img/93c80330322e65d5105a6014afe2d85d_158_0.png)


    FIGURE 7-5: Configure your LAN and Internet connections during installation.'
  merge: -1
