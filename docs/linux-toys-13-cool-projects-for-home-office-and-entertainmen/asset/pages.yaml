    community who are struggling to get video working right (and sometimes, just all
    in) Linux. To dig into some of the details of how the video projects described
    in this chapter start with /usr/doc/avifile*/README (once Chapter 5 software is
    installed). Then joins a mailing list for video4linux, avifiles, nvrec, XmTV,
    WebVCRplus, or any other project described in this chapter that interests you.'
