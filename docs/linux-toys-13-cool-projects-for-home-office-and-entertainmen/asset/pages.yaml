- img_proc: true
  md: '# Chapter 11 — Be a Mini ISP 197


    Get Internet service, IP address, and phone numbers


    You may need to contact several different places to get what you need to set up
    your network. The reason for the Ethernet addresses, domain name, and phone numbers
    you need:


    +   - **Internet service** — You need to choose an Internet Service Provider (ISP)
    to which you will connect your Mini IP. It''s up to you to weigh connection speed
    against cost when you choose the type of service to get. However, you will surely
    want an always-up connection that you can get with DSL or similar service.


    One thing to look out for when choosing an ISP is to read the ISP''s terms of
    use. Some ISPs explicitly restrict you from sharing your Internet connection.


    +   - **IP addresses** — You probably want to get a permanent IP address that
    you can assign to your network interface. Your ISP will tell you an IP address,
    usually for a few dollars a month. For a permanent IP address is so you can configure
    the domain name system (DNS) to find your server when someone tries to contact
    your server by its host/domain name.


    There is a service called Dynamic DNS, which lets you a domain name assigned to
    your server without having a permanent IP address. The issue is that each time
    you reconnect your service to the Internet, you may be assigned a different IP
    address.


    With Dynamic DNS, any change of your server''s IP address is forwarded to the
    DNS service. That then updates the DNS records to reflect your new. While I''m
    not recommending any of these services (I don''t know how well they work, I don''t
    use them), you can read about these services at www.zoneedit.com and www.org/support.php.


    +   - **Domain name** — You don''t need your domain name to be a dial-up server.


    However, for this project we want to offer Web services to our Mini IP clients.
    Having our own domain name makes things cooler. In the old days, everyone went
    to Network Solutions (www.netsol.com) to get domain names. Now there are more
    than 100 registrars. To find a list of accredited registrars, visit the ICANN-Accredited
    Registars site http://www.icann.org/registrars/accredited-list.html.


    As of the registration process for your domain, you will need to tell the registrar
    IP of the primary and secondary DNS servers that identify your domain. For our
    example, we are using the same computer to be the DNS, Web, FTP, and mail server
    for the domain. So use the one IP address you assigned by your ISP as the location
    of the primary server. If you have a friend who has a DNS server, you can ask
    that to serve as your domain''s secondary server.


    +   - **Telephone numbers** — Contact your local telephone company to have one
    or more phone lines installed to receive incoming calls to your modems. This is
    where some of the expense of the project will come in. In example, we have two
    modems, so we had two phone lines installed. You can ask your phone company if
    they can let you use the same number in multiple physical lines. That way, your
    clients don''t need to know multiple phone numbers to dial.


    ![](img/93c80330322e65d5105a6014afe2d85d_224_0.png)'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# 198 Part IV — Small Business Opportunities


    # Configure the Internet connection


    Because the exact way you configure your connection to the Internet depends on
    the type of equipment your ISP requires to use, you have to do a bit of guessing
    here. Here is a procedure for your connection to the Internet from an Ethernet
    interface:


    +   1. Start up Red Hat Linux on your computer and log in.

    2. From the Red Hat menu on the desktop, click System Settings → Network. You''ll
    see the Network Configuration window and an eth0 interface that represents your
    computer''s Ethernet card.

    3. Click the eth0 interface (assuming that the first Ethernet card will be used
    to connect to your ISP), and click Edit. Figure 11-4 shows an example of the Ethernet
    Device window.


    ![](img/93c80330322e65d5105a6014afe2d85d_225_0.png)


    FIGURE 11-4: Define the Ethernet connection to your ISP.


    +   4. There are a few different ways you may need to enter your IP addresses,
    depending on whether your DSL modem or other device is routing or bridging:


    +   Routing — It may be that the DSL modem or other device is set to your permanent
    IP address and then to your server with a private IP address. In other words,
    the outside world may see your DSL modem as address 123.45.67.1, while from your
    server you see the device as 192.168.0.1 (and assign it as the default gateway).
    The example in Figure 11-4 shows just such an address arrangement. Your server''s
    IP address is 192.168.0.2 and the DSL modem must be configured to do port forwarding
    (so requests for Web, FTP, and SSH services can get through).'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Chapter 11 — Be a Mini ISP 199


    Bridging — If the DSL modem or other device does bridging, the address you enter
    manually is the permanent IP address assigned to your server. It would be as though
    your server and the ISP were located on the same LAN. Requests for your IP address
    from the Internet would simply pass through the DSL modem.


    Click OK to accept your changes and continue.


    +   5. Click the DNS tab and add the following information:


    +   Hostname — Type the fully qualified host name of this server. For example,
    in the domain linuxxtoys.net, you might need a host lightbox. So you would enter
    your name as lightbox.linuxxtoys.net.


    +   Primary DNS — Use this server''s IP address as the Primary DNS server. That''s
    because you are configuring this server later as a DNS server.


    +   DNS Path — Type your domain name here (for example, linuxxtoys.net). This
    tells your computer that if someone indicates a host (with no domain name at the
    end), it should look in the current domain to find that host name.


    Click OK to accept your changes and continue.


    +   6. From the main Network Configuration window, click Deactivate; then click
    Activate to have the changes you made effect.


    At this point, you should be able to communicate with your ISP. Using an IP address
    you know belongs to a computer or on the Internet, type the following from a Terminal
    window (replacing 123.45.67.1 with the real IP address):


    ```

    $ ping 123.45.67.1

    ```


    # Configure the dial-in connections


    In Linux, dial-in connections are done by attaching a modem to a serial (COM)
    port on your computer (or using an internal modem), plugging the modem into a
    phone line, and configuring Linux to listen for calls on them. As noted in the
    "Gather Connection Hardware", the first section is to get a real modem.


    For this example, you are going to attach one external modem to each of your COM1
    and COM2 ports to your server computer. In Linux, the connections to these ports
    are represented by special files in the file system: /dev/tty0 and /dev/tty1.


    To begin, connect your first modem to your COM1 port. Use a standard phone cable
    (RJ-11) to connect your modem to the phone line that you dedicate to dial-in service.
    Then run the following procedure (as root user from a Terminal window):


    +   1. Edit the /etc/inittab file and add the following lines:


    ```

    S0:2345:respawn:/sbin/mgetty tty0

    S1:2345:respawn:/sbin/mgetty tty1

    ```'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# 200 Part IV — Small Business Opportunities


    These lines start getty processes (when your system boots) that listen for connection
    requests on COM1 (ttyS) and COM2 (tty1) ports. If you have modems on COM3 or COM4
    ports, you should create additional lines (tty2 and tty3). If you have a multi-ports
    board, refer to the documentation for that board to determine which devices listen
    on.


    +   2. Add the following line to the /etc/mtty-sendfax/login.config file (you
    can start by uncommenting the AutoPPP line that is already in the login.config):


    ```

    /AutoPPP/ -a _ppp /usr/sbin/pppd auth \

    chap -pap login debug modem \

    cropts pay lock ms-dn localhost

    ```


    The previous information should be all on one line that each subsequent line should
    be joined together. This line calls the pppd daemon to launch in response to connections
    on the getty daemon that receives an incoming phone call. That daemon sets a Point-to-Point
    Protocol (PPP) connection between the computer dialer and the server. Here is
    what the options:


    +   - auth -chap — Causes PAP type of authentication to be used, but not CHAP
    CHAP is the authentication type that Windows clients will expect and Linux clients
    can do as well. Login information that the client entries will be authenticated
    using PAP.

    - debug — Logs the content of control packets. That information will be copied
    to the /var log messages file. If the dial-in doesn''t work, look in that line
    to find the problem.

    - modem — Tells the pppd daemon to wait for Carrier Detect (CD) before opening
    the device connects to the modem. This is the right way to act with modems, since
    you don''t prompt for a login until a call comes.

    - crcts — Indicates that the modem should use hardware flow control

    - proxyarg — Allows PPP to forward packets from the server to the Internet

    - lock — Causes the PPP daemon to lock the device, so no other processes connect
    to the modem while it is in use

    - ms-dn — For Microsoft Windows clients, this option can pass the name of the
    DNS server so the client doesn''t have to enter it manually. In this case, since
    our DNS server is the same dial-host, we have localhost with the location of the
    DNS server. (You could use an IP address instead of localhost.)


    +   3. Add a line to the /etc/ppp/pap-secrets file for each user that you want
    to dial in. Here are a couple of examples:


    | jsmith | myp9d3wd | 10.0.1.10 |

    | mcjones | 4yerp2xwrd | 10.0.1.11 |


    In these examples, the users logins jsmith and mcjones can connect from any other
    (*) and log using myp9d3wd and 4yerp2xwrd as passwords, respectively. The IP addresses
    assigned to the PPP sessions by those accounts are 10.0.1.10 and 10.0.1.11, respectively.'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Chapter 11 — Be a Mini ISP 201


    4. You need to start the mgetty processes you configured in the first step. Type
    the follow-command to reinit the initab file and start mgetty processes:


    ```

    # telinit q

    ```


    The mgetty processes should start running and the users you configured should
    be able to log in to your server at this point. However, for the users to be able
    to use the Internet through that connection, you need to configure the server
    to allow packet forwarding and masquerading (or NAT) to get through the firewall.


    # Allow packet forwarding and masquerading


    There are essentially two steps for allowing packet forwarding and routing between
    your dial-ups and the Internet. These steps are described as follows:


    Whole books are devoted to firewalls and routing. I tried to provide a couple
    of steps that will do what we need to let dial-up users route through our server
    to the Internet. If you vary much from our demonstration, you will need to find
    other details on how firewalls and routing work in Linux. Red Hat Linux Firewalls
    by Bill McCarthy (Red Hat Press/Wiley, 2003) expands on my firewall coverage in
    this book and in Red Hat Linux Bible.


    +   1. To allow packet forwarding in the Linux kernel, add the following line
    to /etc/sysctl.conf file:


    ```

    net.ipv4.ip_forward = 1

    ```


    +   2. Assuming that you configured an iptables when you installed Red Hat Linux
    (which you do by default), you will need to tell the firewall to masquerade the
    addresses that come in through the dial-up PPP connection.


    If you use the private IP addresses described earlier in the pac-sets (10.0.1.10
    and 10.0.1.11), this procedure should work fine.


    ```

    # iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

    # iptables -A FORWARD -s 10.0.1.0/24 -j ACCEPT

    # iptables -A FORWARD -d 10.0.1.0/24 -j ACCEPT

    # iptables -A FORWARD -s ! 10.0.1.0/24 -j DROP

    # iptables-save > /etc/sysconfig/iptables

    ```


    Essentially, run commands that tell the kernel that it is okay to masquerade addresses
    to the eth0 interface (presumably, the Ethernet card that gets you to the Internet).
    Any packets received by the firewall where the source (-s) or the destination
    (-d) are not network 10.0.1.0 should be accepted and forwarded. Packets not on
    that network should not be forwarded. Assuming that the current running firewall
    has a sane set of rules, you save those rules permanently (so they are re-read
    each time the firewall is restarted) by running the iptables-save-command.


    # Step 5: Configure the domain


    You should have a connection to the Internet with a permanent IP address assigned
    to your server. You should also have a registered domain name that points to this
    IP address. Next, you need to configure DNS.'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# 202 Part IV — Small Business Opportunities


    The main job of a Domain Name System (DNS) server is to take requests for host
    names of the domain it serves and translate them into IP addresses. For example,
    if your domain were example.com, someone browsing the Web trying to visit www.example.com
    will be directed to the IP address provided by your DNS server. The DNS server
    can do the opposite as well (return a host name when a client owns an IP address).


    Our example of a DNS server (we''ll call it example.com) provides service for:


    +   - A single domain

    - A single host (DNS, Web, and FTP service are all on the same computer)

    - An additional secondary server (can find a friend to be your DNS secondary)


    You need to configure an /etc/named.conf file and create a zone file in the /var/named
    directory. Figure 11-5 shows two files: /etc/named.conf (on the left) and /var/named/db.example.com
    (on the right).


