  md: '# Building a Temperature Monitor


    # chapter 9


    You can take one piece of information long way in Linux. A simple number representing
    the current temperature can be read into an e-mail, posted on a Web page, or used
    in dozens of other ways. Gather some temperature readings over time, and you can
    chart or graph patterns.


    The Linux Toys Monitor comes from Brian and the DigiTemp project (www.digitemp.com).
    The temperature monitor gathers you temperature data from a simple 1-Wire Sensor.
    You can purchase fully constructed sensors from the Web site.


    Of course, the real fun is what you do after you have gathered temperature data.
    After describing how to get and set up your temperature monitors, this chapter
    contains several ways of using DigiTemp. These include:


    +   - Current temperature — Read the sensors and display the current temperature.


    +   - Log temperatures (set time) — Run DigiTemp to get the temperature for a
    set of number at intervals.


    +   - Log temperatures (cron) — Use the cron facility to have the system automatically
    run DigiTemp at selected times and store the output in a log file.


    +   - Web page — We include a template to publish your Web page that reads your
    temperature data.


    +   - E-mail — We describe how to use DigiTemp to automatically add the current
    time and temperature to the signature of each e-mail message sent.


    +   - Graph temperatures — Output your temperature data to a graph.


    To gather temperature data, this project incorporates inexpensive temperature
    sensors that connect together with standard telephone wire and plug into a serial
    port. We tell you where you can buy the sensors in a kit or put them together
    from pieces yourself.


    # in this chapter


    +   ☑ Installing temperature software


    +   ☑ Installing DigiTemp temperature sensors


    +   ☑ Checking temperature with the digitem command


    +   ☑ Adding temperature to a Web page


    +   ☑ Adding temperature to an e-mail message'
