  md: '# # Setting Up a Digital Receptionist


    # chapter 10


    if you''re addicted to e-mail (I can read it when I want), but you find the telephone
    annoying (it''s always trying to interrupt me), we might be able to help you.
    The Linux Toys Digital Receptionist project will:


    +   - **Take messages** — You can set up your Linux computer to pick up the telephone
    after a number of rings and give callers the choice to leave messages on voice
    box they choose.


    +   - **Send recorded messages** — Take recorded messages and mail them to any
    e-mail account you choose.


    +   - **Play back messages** — From any e-mail reader, you can open the e-message
    and launch a sound/music player to play back the recorded message on your speakers.


    The Linux Toys Digital Receptionist is a repackaging of the VOCP project. VOCP
    is a very cool voice-messaging system that runs in Linux and other UNIX-like systems.
    You can learn more about VOCP at www.vocp.com.


    Besides PC, the primary piece of hardware you need for this project is a modem
    that can handle (we recommend one and list a others). Add a phone line, a couple
    of speakers, a microphone, and you''re there.


    On the software end, you need to install the VOCP software, configure the message
    recorder, and create a voice box tree to configure how messages are gathered and
    distributed. You have a lot of flexibility in setting up how your messages are
    handled.


    If you play your cards right, you could replace your receptionist (who didn''t
    really like to answer the phone anyway).


    # in this chapter


    +   - Choosing hardware


    +   - Installing Red Hat Linux and Toys software


    +   - Setting up the modem


    +   - Listening for calls on the modem


    +   - Configuring voice recordings


    +   - Creating basic voicemail settings


    +   - Planning your voicemail


    +   - Recording incoming voice messages


    +   - Checking your e-mail for voice messages'
