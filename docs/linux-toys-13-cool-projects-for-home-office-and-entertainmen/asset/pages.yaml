  md: '# Appendix C — Basics of Red Hat Linux Installation


    # A lesson in ... Disk Partitioning


    Partitioning is a method of splitting up a hard disk into separate, self-contained
    parts. There are several reasons for dividing a hard disk into separate partitions.


    +   - Lots of operating systems — If you have more than one operating system,
    each must have at least its own bootable partition.


    +   - Lots of file types — To have a Windows NTFS partition and a Linux ext3 file
    system on the same hard disk, they must be on separate partitions. There are many
    different file system types, with its own attributes and uses.


    +   - Many hard disks — Each disk on your computer must have at least one partition.


    +   - Setting boundaries — By separating file systems on the same operating system,
    you can protect yourself from running out of disk space on the whole disk at once.
    For example, if a user fills up the entire partition devoted to his home directory
    (/home), applications that are writing to temporary files (/tmp) and spool files
    (/var) can keep running.


    Linux requires that you have at least one swap partition and one Linux partition
    (usually an ext3 or ext2 file system). If you let Linux partition, or a /boot
    partition grow, as well. A small boot partition makes it easier to check, mount,
    and load the kernel than if it were stored on a much larger file system.


    For Linux Toys, there are several reasons why you might want to go beyond the
    three partitions (/, /boot, and swap) that Red Hat handles automatically. Here
    are a few ideas:


    +   - Linux Jukebox — Installing your CD collection on hard disk is a big investment
    in time. By having a large partition or hard disk assigned to /user or /usr/local/
    you can keep your music and CD database separate from the operating system. Later,
    if you want to install Linux, you can erase everything your music and not risk
    damaging it.


    +   - A Mini ISP or Web Hosting Service — If you are sharing a computer with multiple
    users, you may want to restrict how much disk space each person can use. Using
    features like disk quotas, you should consider separate partitions for /home (space
    for user accounts) and /var (space for Web and FTP server content).


    With hard disks coming down in price as much as they have, many administrators
    get around the disk-space issue by simply having a hard disk that is so large;
    there is never an immediate danger of running out of disk space. Since we are
    mostly building toys here, for most of the projects you can get by without fiddling
    with partitions.'
  merge: -1
