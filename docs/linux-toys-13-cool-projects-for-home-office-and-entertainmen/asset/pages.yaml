  md: '# Chapter 12 — Be a Web-Hosting Service 221


    Here are some examples of lines that are set for you (in many cases you likely
    don''t need to touch).


    +   - ServerTokens OS — Prevents visitors from finding out what modules you are
    running. (You can comment it to let others see what you are running.)

    - ServerRoot /etc/httpd/— Identifies where your configuration files are

    - Listen 80— Causes the Web server to listen on port 80 for requests to view content

    - User apache — The Web server (httpd daemon) runs as the user apache.

    - Group apache— The Web server (httpd daemon) runs as the group apache.

    - UseCanonicalName Off— Causes Apache to display the host name and port requested
    by the client displaying the page. This is what you want with a server virtual
    hosting. The alternative is to always display a fixed server name (set the ServerName
    directory) for every page requested.

    - DocumentRoot /var/www/html— Sets the location of your Web site''s content. Of
    course, we override this in each example for virtual hosting by /home/user/public_html
    as the location of site.

    - UserDir— This prevents the /home/user/public_html directory from being shared
    at http://servername/user. In Chapter 11, we change this UserDir_public_html since
    we have one domain name and it''s a good way to let your ISP hosting clients publish
    web pages.

    - IndexDirectory index.html.html.var— If someone requests a directory, Apache
    will look for an index.html file, then (if it doesn''t exist) an index.htm.var
    file to display the contents.

    - AccessFile.htaccess— This directive lets all .htaccess files in any directory.
    Inside that file, you can add directives that determine how the content of directory
    (and all subdirectories) are displayed. While this gives some control to your
    Web-hosting customers to take control of how content is displayed (without letting
    them edit the httpd.conf files), it can cause slower response than you would get
    by adding directives directly to the httpd.conf file.

    - HostHostname Off— Causes Apache to log information about visitors to the Web
    site as IP addresses. Change it to On to have Apache look up and display host
    names.

    - ErrorLog logs—Causes errors to be written to the /var/log/httpd/error_log.file.
    We override this for each virtual Web server and create individual error log files.

    - CustomLog access log combined— Causes activity to be written to the /var/log/httpd/access_log
    file. Again, we override this for each virtual Web server and create individual
    access log files.

    - ServerSignature On— With ServerSignature set to On (which is by default), when
    the server generates a page (such as when there is an error condition), information
    about the server is written on the page. Information includes the version of the
    Apache server, the host address, and the port number.


