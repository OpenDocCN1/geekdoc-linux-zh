  md: '# Creating a Home Network


    # chapter 7


    standalone Linux Toy is cool. A networked Linux Toy is bliss. If you are like
    me, you have a few computers around your house that are begging to be networked
    together. And once you start building Linux Toys, it''s only going to get worse
    (or do I mean,?).


    A Linux system can make a great focal point for your home network, letting you:


    +   - Share an Internet connection

    - Share printers

    - Share files


    A home network can be a great asset for your Linux Toys projects as well. For
    projects such the Music Jukebox and Digital Picture Frame, which can run without
