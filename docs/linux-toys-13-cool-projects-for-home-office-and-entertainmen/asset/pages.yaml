    # Recording Your Shows


    WebVCRplus offers a lot of different ways to record your TV shows. The best way
    to start is by displaying the TV listings you downloaded earlier. Then you can
    either:


    +   - **Force Record**—Select the Force Record button to record a TV show that
    is currently showing. The show starts being recorded immediately.

    - **Record**—Select the Record button on a TV show. The show will be queued to
    start recording when the show is about to come on.


    # Starting to record


    You can begin by displaying your TV listings. From there, you can select which
    shows to record. Here''s how:


    +   1. From a Web browser, type the following in the Location box:


    http://localhost/webvcr

    2. Click Now on TV in the left column. Programs currently running for the first
    20 channels are displayed. See 5-4 for an example of this window.

    3. Here''s what you can do the program listings are displayed:

    - **Program description (blue button)**—Click the program name to see a description
    of it. (If you click a movie, the description of the movie appears from the Internet
    Movie Database, imdb.com.)

    - **Force Record (blue button)**—Click the blue button in a TV show to begin recording
    the new show. The entry turns red to show that it is being recorded. Recording
    will stop when the show is over.

    - **Record (red button)**—Click the red button in a TV show to set recording of
    the show to begin when the show is ready to come on. (Use Force Record, instead
    of this button, if the show is already in progress.)

    - **Favorites (star button)**—Click the star button to have the TV show added
    to a list of favorites. After that, you can click Favorites in the left column
    to choose to record a favorite show regularly on certain days, times, or channels.'
