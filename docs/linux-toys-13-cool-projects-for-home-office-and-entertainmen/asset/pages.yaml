  md: '# Chapter 1 — Exploring Linux Toys 13


    # Understanding GPL and other licences


    The most popular of the open source licences (and the one that covers most software
    in Red Hat Linux) is the GNU General Public License (GPL) from the Free Software
    Foundation (www.gnu.org). You can get that license here: www.gnu.org/licenses/gpl.html.
    It''s also printed in the back of this book and is on the CD. As the GPL states,
    when software authors commit to making their software GPL, the license allows
    you to:


    +   - Distribute copies of free software (and even charge for this service if
    you wish)

    - Receive source code or can get it easily if you want it

    - Change the software or pieces of it in new free programs

    - Know you can do these things


    There are lots of other licences that can be used to cover open source-ish kinds
    of software. The Free Software Foundation maintains a list of these licences (with
    their own comments about them) at their Web site (www.gnu.org/licenses/license-list.html).


    # Building projects with open source


    As using Linux and other open source software for building useful and expandable
    projects, there are several reasons why we think open source software is the best
    way to do:


    +   - No licensing fee for each toy: You can build 1, 1000 toys from your Red
    Hat Linux distribution, and other than the time you spend, it won''t cost you
    more than the nothing you paid in the first place (or just the one copy of Red
    Hat Linux you bought).

    - No hiding code: You can see and change all the code in your Linux Toys. If you
    don''t like what it does, rewrite it yourself.

    - Get enhancements going forward: The open source projects that make Red Hat Linux
    and Linux Toys will continue to go forward and offer enhancements to their projects.
    We also hope people will make direct contributions to the Linux Toys projects.
    To you, it means that automatic improvements to the Linux Toys projects will be
    available to you. (Did I mention, at no cost?)

    - You can learn: Every Linux Toys project can benefit from the fact that you are
    building on a full-system operating system. Linux features for configuring a network
    connection, a cron job (to launch the project at set times), a TV capture card,
    or a Web interface, and you have multiplied the power of your Linux Toys. At the
    same time, you''ll be learning a powerful, professional-quality operating system.


    Remember that open sources licences are built on commitments to freedom and community.
    There are those who would equate people who create or use open source with thieves
    and scoundrels. In my experience from Linux mailing lists and my local Linux User
    Group (LUG), I have found open source devotees as a group to be:'
