  md: '# 8 Part I — The Basics


    ![](img/93c80330322e65d5105a6014afe2d85d_35_0.png)


    # Getting Started with Linux Toys


    The basic recipe for our projects is:


    +   PC + Linux + Linux Toys CD + (bits of hardware) = Cool Projects!


    I have an old circa-1994 computer that would need some enhancements to work effectively
    for some of the projects. For example, my 1GB hard drive (which was large at the
    time) won''t hold the full music jukebox as we describe it. It will, however,
    hold a minimal Red Hat Linux installation and run a temperature monitor quite
    nicely.


    Each project lists the hardware and software you need, so you can be sure to have
