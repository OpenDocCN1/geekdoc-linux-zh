  md: '# Chapter 12 — Be a Web-Hosting Service 227


    # Adding Web Server Content


    We''ve set up this project so that there is a separate user account set up for
    loading the content of each Virtual Web site. Presumably, that user is the one
    who is creating the Web content for the site. The following procedure describes
    how the user can go about uploading content so it is properly installed on the
    server:


    +   1. Create content — Your customers can create any content they want for their
    Web sites. If they have never created Web content before, you can recommend that
    they make an index.html file, using any HTML composer.


    +   2. Get an FTP client program — Some features for publishing Web pages are
    built into an HTML composer. If those features are not available for the person
    creating the Web content, or she needs to get an FTP client program to publish
    their pages to her Web server.


    If you are composing on a Red Linux system, you can use command-line programs
    as sftp or ncpftp to transfer files in FTP. Or use gftp to launch a GUI window
    for transferring files. (To use sftp or ssh, you need to have the ssh service
    enabled, which is by default, and port 22 open on your firewall).


    On a Windows machine, there are shareware or free programs, as WS_FTP, available
    to transfer content to your Web server. If you don''t have an FTP client, you
    can try downloading.com.


    +   3. Copy files to the Web server — Provide your customers with the username
    and password they can use to access the public_html directory you set up for their
    Web sites. Have them copy the content to the public_html directory in their home
    directory after logging in using the FTP client.


    +   4. Check the content — If the server is running, you can immediately check
    that the content is available. For example, if the Web site is www.example.com,
    you could type the following into the location box of your Web browser:


    ```

    http://www.example.com

    ```


    You should see the content from the index.html file that was placed in the public_html
    directory for the user associated with virtual Web server.


    ![](img/93c80330322e65d5105a6014afe2d85d_254_0.png)


