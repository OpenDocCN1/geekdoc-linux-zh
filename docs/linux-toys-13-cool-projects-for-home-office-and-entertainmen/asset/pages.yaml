  md: '# Controlling Toy Cars


    # chapter 14


    His project is more “Toy” than “Linux”. The idea is to be able to take inexpensive
    remote control (RC) cars and operate them from Linux. Although it''s sort of a
    dumb thing to do (if you''re standing there, it''s a lot easier to press the buttons
    on the remote control), wiring an RC transmitter to your Linux box lets us illustrate
    a few cool things:


    +   Run courses — Using signals that turn relays on and off, Chuck created some
    simple scripts (written in the Perl scripting language) that cause the car to
    run in patterns around a room.


    +   Really remote control — Once with an Internet connection you can control the
    car from anywhere in the world. Add a video camera (using the same procedure for
    setting up streaming video in Chapter 8), and you can have multiple remote control
    races as you operate one of the cars.


    +   Start unattended — Using the Linux cron facility, you can set your unattended
    car to start running automatically at any time you want. This is a great feature
    if you want to, for example, freak-out your dog in the middle of the night. (See
    Chapter 9 for a description of how to use cron.)


    There are also hardware and software features that you can explore along the way:


    +   in this chapter

    - Controlling toy cars

    - Use relays — With the LynX-PORT controller, you can refine how to turn relays
    on and off from Linux. In this case, the relays control how the car turns, goes
    forward, and backs up.


    +   Play with serial ports — Because the LynX-PORT controller connects to a serial
    port (also referred to as a COM port on a PC), you can learn something about how
    serial ports work by sending signals through them.


    The electronics part is pretty simple (challenging only if you''re not used to
    soldering); Solder wires to the remote control and connect them to the LynX-PORT
    controller. Once you know what relay does, you can play with the scripts we provide
    or send signals to the cars (as we describe later) to get the cars moving around
    the way you like.


    ![](img/93c80330322e65d5105a6014afe2d85d_270_0.png)'
