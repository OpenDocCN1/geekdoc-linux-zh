  md: '# Chapter 14 — Controlling Toy Cars 247


    Using the board''s four analog inputs, you can monitor current light, moisture,
    and temperature conditions. Eight digital inputs can monitor motion sensors, magnetic
    contacts, and various user inputs. There are lots of possibilities with this board.


    For this project, we use the board''s programmable DPDT relays to control the
    toy cars. Essentially, we are turning the relays off and on to make the cars left,
    right, forward, and back.


    We found the board for $239 at Smarthome. As we said, overkill for a toy car project.
    But once you begin playing with the controls for turning off and on relays from
    Linux, you can use the board for turning off and on all kinds of devices (a model
    train is the next project we have in mind).


    ![](img/93c80330322e65d5105a6014afe2d85d_274_0.png)


    If you use the board from Linux for any home-control applications, contact us
    at LinuxToys.net. We want to help you and others get the most out of the $239
    investment.


    # The toy cars


    We used several different types of cars with this project. Many toy stores and
    electronics stores carry RC cars. Your local Radio Shack carries micro RC cars
    (under the ZipZaps brand), as well as a variety of larger cars and trucks.


    We tried the project with ZipZaps. From there we explored to other RC vehicles,
    which all worked pretty much the same. Here are some issues related to choosing
    RC cars (or other toys) for this project:


    +   Frequencies — Each remote control operates at a particular frequency. This
    is important, if you want to run two or more cars at once, you need to use different
    frequencies. Common frequencies are 27 MHz and 49 MHz. However, you can also find
    cars that operate at 35 MHz, 45 MHz, 57 MHz, or other frequencies.


    +   Number of controls — The number of controls determines the number of relays
    you need to use from your board. The ZipZaps cars have four controls (forward,
    back, and left). Mini Transbots have two (forward and stand/spin around). Because
    the Lynx-PORT board has eight analog ports, you can connect eight controls. That
    would let you connect two ZipZaps or four Mini Transbots.


    +   Batteries — Both cars and the transmitters require batteries. ZipZaps are
    recharged by the transmitter itself but run for a few minutes. Longer battery
    life is crucial to having effective races with the cars.


    We went to our local Radio Shack and picked up a few different RC cars. The ZipZaps
    (the smaller car) we thought was really cool, so we used it for examples of running
    scripted patterns. Because the Mini Transbot has only two controls (forward and
    stand/turn) and longer battery life, it is a better choice for multicar races
    or obstacle courses. Any RC car, however, will work fine for this project. Figure
    14-2 shows two cars we bought at a local grocery store.'
