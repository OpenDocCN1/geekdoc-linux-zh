  md: '# Chapter 5 — Building a Television Recorder/Player 87


    # Setting Up the TV Recorder/Player


    The general steps for configuring and using your Linux Toys TV Recorder/Player
    are as follows:


    +   - Gather hardware.

    - Install Red Hat Linux and Linux Toys software.

    - Configure TV viewing.

    - Configure TV listings.

    - Add channel listings.

    - Configure TV recording.


    # Step 1: Gather hardware


    This is one project where the real, we shall say, classic hardware won''t give
    you very good results. Slower processors and limited system resources will result
    in missed frame captures and jerky playback. You can overcome some of that by
    tuning your video capture, in general, when it comes to video hardware, more is
    better.


    Luckily, hard-disk space has cheap en. A 1GHz processor isn''t a supercomputer
    anymore. You can catch a nice TV video card to your PC for only a few dollars
    to do almost everything described in this chapter.


    Once you have gathered the hardware described here, you need to:


    +   - Install the hardware (TV card, sound card, video card, and so on).

    - Install Red Hat Linux (described next).

    - Boot Red Hat Linux. Some hardware will be detected and some will have to be
    configured to work (described later).


    # The basic PC


    There are a few ways to go when it comes to a PC for this project:


    +   - In the spirit of Linux Toys, get a cheap, use PC and just try to squeeze
    the best quality you can out of it.

    - Spend a few more dollars (or the nifty PC you already have) so you can grab
    video that makes it a pleasure to watch last night''s football game (or, as they
    say in Europe, football match).


    Requirements for the computer you use for this project are essentially the same
    as what you need for the video archive project described in Chapter 4. One difference
    is you might want a bigger hard disk.


    Because the project relies on both server and Personal Desktop packages, it can
    be easier to do an Everything inside of Red Hat Linux (requiring about 5GB of
    space itself) to sort'
  merge: -1
