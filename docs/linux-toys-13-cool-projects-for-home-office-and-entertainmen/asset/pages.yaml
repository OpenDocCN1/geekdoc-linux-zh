    # The player (musicd)


    The jukebox start-up script starts the musicd script (from /usr/local/bin/musicd).
    It runs the ogg123 to play your songs. The ogg123 player gets your list of songs
    in one of two ways:


    +   * All songs — The music script runs the ogg123 command to play all Ogg files
    (ending in .ogg) from the /usr/local/share/music directory. (This is the default
    behavior.)


    +   * Playlist — If the file /usr/local/share/music/playlist exists, the ogg123
    player plays the song files that are listed in playlist file. (You have to create
    the playlist yourself if you want to select your list of songs from the database
    you created.)


    Note: In the “Make your own playlists” section, I describe how to create a playlist
    to use with the jukebox (instead of just having all of your music play randomly).


    The ogg123 command (as it is configured in /usr/local/bin/musicd script) runs
    with the -q option (to play without outputting any messages to your screen) and
    -z option (to randomize the songs you feed it).'
