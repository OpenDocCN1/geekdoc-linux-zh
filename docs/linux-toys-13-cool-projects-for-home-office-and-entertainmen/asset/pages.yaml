  md: '# Step 3: Wire up the controllers


    You need to take apart your toy car controllers and do a bit of soldering here.
    The idea is to have two wires connected to each set of relays (eight wires for
    a ZipZaps and four wires for a Mini Transbot, total). This procedure steps you
    through the process of wiring a ZipZap controller and connecting it to the LynX-PORT
    board.


    > > Caution This procedure could result in irreparable damage to your controller
    and will certainly void your warranty. Please don''t use a car that is a child''s
    favorite, a family heirloom, or worth thousands of dollars. In other words, get
    a cheap car and expect that you might break it!


    +   1. Prepare wire — Get eight strands of wire (for a ZipZap car) about eight
    inches in length. Use a length of Category 5 wires and untwisted the four pairs
    of wires. Strip 1/2" off each end of each wire.


    +   2. Open controller — Unscrew the back of the toy car controller. (Watch for
    springs that might pop out.)


    +   3. Identify leads — On the car''s remote control board, identify the location
    of the buttons used to control the car. Look for the two leads going to each button.
    Figure 14-3 shows a toy car controller with one button removed to show its leads.


    ![](img/93c80330322e65d5105a6014afe2d85d_276_0.png)


    FIGURE 14-3: Identify the leads going to each button.'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# 250 Part V — Just for Fun


    4. Drill holes — Using a Dremel tool (or other drill with a small drill bit),
    do the following:


    +   - Drill one hole for each button, two wires can be pulled through each. Figure
    14-5 shows where we chose to solder each hole.


    +   - Drill eight neat across the back of the controller case, so that you will
    be able to pull the wires through.


    5. Solder wires — Pull a set of two wires through a hole you drilled, and solder
    them on the two leads that complete the connection for the selected button. Repeat
    for each button. If you don''t know how to solder, we''re not going to teach you.
    However, check Chuck''s Tech Tip on soldering, just ahead, for a few tips.


    On the Zip-Zaps, you have to do some pretty fine soldering. If you use four sets
    of twisted pair for a Category 5e cable, you can solder the wires as shown in
    the following table:


    | Forward | Back | Left | Right |

    | --- | --- | --- | --- |

    | WIRE | or/wh wh/or | bl/wh wh/bl | br/wh wh/br | gr/wh wh/gr |

    | RELAYS | 5-C 5-NO | 6-C 6-NO | 7-C 7-NO | 8-C 8-NO |


    ![](img/93c80330322e65d5105a6014afe2d85d_277_0.png)


    If you are using a different RC car, try to determine which buttons on the car
    controller make it go forward, back, left, and right. Then connect the wires to
    the same relays described for the ZipZaps.


    6. Test continuity — Use a continuity tester to check that each pair of wires
    can create the connection for each button.


    7. Pull wires through — Gently pull the wires through the back of the controller
    case. Figure 14-4 shows a controller with wires coming through the back.


    8. Connect wires — Connect each wire to the Lynx-PORT board. If you soldered the
    wires as on two steps earlier, connect the wires to the board as shown in Figure
    14-5.


    9. Connect RS-232 cable and power supply — Connect the RS-232 cable (standard
    serial cable) from the Lynx-PORT board and a COM port on the back of the computer.
    Also, plug in the power supply to the board.


    The scripts used in this project expect you to connect the cable to the COM1 port
    (represented by the /dev/ttyS0 device in Linux). If you use a different port,
    you must edit the scripts described later and change /dev/ttyS0 to /dev/ttyS1
    (for COM2) or /dev/ttyS2 (for COM 3).


    At this point, you should have everything ready to start your Linux Toys car controller.'
