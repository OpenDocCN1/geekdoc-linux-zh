  md: '# 196 Part IV — Small Business Opportunities


    There are a few special things you can do during installation:


    +   - **Partitioning** — Create a separate /home partition that contains enough
    space for all of your users. For example, by adding a 1GB /home partition, you
    can add 10 users that are allowed 100MB of disk space.


    Using a feature called disk quotas, you can define how much space each user can
    consume on a selected partition. To set up disk quotas, you need to install the
    quota package. Chapter 12 describes how to set up disk quotas.


    +   - **Networking** — If you are using an Ethernet card to connect to your ISP,
    you can configure that Ethernet card during Red Hat Linux installation. Refer
    to the "Configure Internet Connection" section later in this chapter for information
    on how to configure networking.


    # Step 3: Install Linux Toys software


    There are no Linux Toys packages for this project. Everything is built into Red
    Hat Linux. (I added this step here so you didnt think you were missing anything.)


    # Step 4: Configure the network


    There are essentially two types of network connections that you have to configure
    in this project: an Ethernet interface to your ISP and dial-in modems to be used
    by your clients. Figure 11-3 illustrates these network connections.


    ![](img/93c80330322e65d5105a6014afe2d85d_223_0.png)'
