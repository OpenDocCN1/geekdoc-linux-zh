    (%8.2F), and Centigrade (%2.2C). The two command lines should be shown on the
    screen.


    ```

    # digitemp -t 0 -c "-On %%b %d %% %H:%M:%S in NYC \

    tperature is %.2F (F), %%2.2C (C)"

