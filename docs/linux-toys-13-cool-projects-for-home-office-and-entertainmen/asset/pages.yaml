    +   9. In the Options window, click Channel Editor. The Config window appears,
    ready to add information about the current channel.


    +   10. In the Config window, type the station ID for the channel and (optionally)
    a hot key that will allow you to jump right to that channel. Click Update and
    Save to update information for each channel. (Click the xawtw window and press
    the up or down arrow and repeat the procedure for each channel.)


    Right now, you might only want to configure a few channels (in particular, channel
    3 or 4, depending on which is used for input from your VCR). When you get to Chapter
    5, you may want to set up more channels to TV recording.


    At this point, you should be able to change channels by:


    # Step 7: Prepare to record


    When you close the xawtw it leaves the video driver in a certain state. All the
    settings that were active when xawtw extended (the channel, color, brightness,
    and so on) are still in effect when you start recording. Therefore, I recommend
    you do the following:


    +   1. Open an xawtw window again (type xawtw a Terminal)

    2. Play a tape from your VCR and make sure you can see it in the xawtw window.
    You may have to use the up and down arrows on your keyboard to go to channel 3
    or 4 (depending on how your video is set)

    3. With the tape playing, you should make some adjustments. Again, using the instructions
    in "Step 6: Configure the TV player with xawtw," adjust the color, brightness,
    and other values to suit your own eye.

    4. When the video appears as you would like it, save the changes on the xawtw
    Channel Editor (leaving the channel where you were when you watched the video).


    Your setup should now be complete. You should now be ready to start recording
    your videotapesapes. If anything isn''t working, refer to the "Troubleshooting
    Video" section in Chapter 5.'
