    To launch the Red Hat Add and Remove Software window (while you are logged in
    to a GUI), click the Red Hat icon on the desktop. From the menu that appears,
    click System Settings -> Add/Remove Applications. Figure C-4 shows the Red Hat
    Add and Remove Software window.


    ![](img/93c80330322e65d5105a6014afe2d85d_345_0.png)


    FIGURE C-4: If a Linux Toy needs Red Hat software, use the Add and Remove Software
    window to install it.


    This window is used to install (or uninstall) software that is part of the Red
    Hat Linux distribution. If you need to install an RPM package that is not part
    of Red Hat, you have to use the rpm command.). To use the Add and Remove Software
    window, here''s what you do:


    +   1. Click the Install Software icon in the left column.


    +   2. Scroll through the groups of packages using the scroll bar.


    +   3. Click the Add link next to the group that you interest to see a list of
    all packages in the group. The numbers next to the link show how many packages
    are ready to be installed from that group, followed by the total number of packages
    in the group.'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# Appendix C — Basics of Red Hat Linux Installation


    +   4. Click the package name you want to install (so the checkmark comes on).


    +   5. Click Close to close the details window.


    +   6. Repeat the selection of packages until the list of packages appears as
    you would like.


    +   7. Click Actions → Install Package. You will be prompted to insert the necessary
    Red Hat CDs.


    +   8. Close the window after all packages are done installing.


    You can go ahead now and use the software you just installed. Believe it or not,
    you don''t have to reboot. For a new service to take effect, however, you may
    need to restart that service.


    # Installing packages with rpm


    The command line of installing RPM packages is the rpm command. This command is
    loaded with features. You can use it to add, delete, or update any RPM software
    package. You can also use it to get information about RPM packages (such as to
    check whether a package is installed, view descriptions of a package, or find
    out what package a particular file is).


    You can install an RPM package with the -i option (install). However, it is more
    common to use the -U option (upgrade), that command line will tell you whether
    the package is currently installed or not. You can begin with the RPM in a directory
    on your system or by mounting a Red Hat CD and installing from there. Here''s
    an example of how to do the latter.


    +   1. Insert into your drive the CD containing the package you want to install.


    +   2. Log in as the root user and open a Terminal window (right-click on the
    desktop and click New Terminal).


    +   3. If the CD doesn''t mount automatically, it might be by typing the following:


    ```

    # mount /mnt/cdrom

    ```


    +   4. Go to the RPMS directory on the CD:


    ```

    # cd /mnt/cdrom/RedHat/RPMS

    ```


    ![](img/93c80330322e65d5105a6014afe2d85d_346_0.png)


    Most software on the Linux Toys CD is in RPM format. With the Linux CD mounted,
    go to the /mnt/cdrom/ directory and look for a chapter to install Toys software
    for a particular project.


    The following rpm command (with options), followed by the name of the package
    to install, for example the cdlabelgen package, you could type the following:


    ```

    # rpm -Uhv cdlabelgen*rpm

    ```


    In the preceding example, typing the asterisk (*) just saves me from having to
    type all the letters and numbers associated with the version of the package. You
    could also type the first part of the package name and press the tab key to have
    the shell to fill in the package name.'
  merge: -1
  pgno: 346
- img_proc: true
  md: 'To check that the RPM has been installed, you can use the -q option. For example,
    to see whether the cdlabel package is installed, type the following:


    ```

    # rpm -q cdlabel

    cdlabel-2.6.0-1

    ```


    To remove a package that has been installed, you can use the -e (erase) option.
    For example, to remove the cdlabel package, you could type:


    ```

    # rpm -e cdlabelgen

    ```


    To remove a package, there is no need to use the entire version number. You have
    to type only the base name of the package.


    If you need more information on the rpm command, type man rpm from a Terminal
    window.


    # Summary


    Because Red Hat Linux forms the foundation for the Linux Toys projects in this
    book, this appendix was created to help you through the process of installing
    Red Hat Linux. It not only steps you through the installation process; it describes
    the process of booting your Red Hat Linux system for the first time. If you want
    to add or remove software packages after Red Hat Linux is installed, you can use
    the Add and Remove Software window or the rpm command.'
