  md: '# Appendix B — ABCs of Using Linux


    ![](img/93c80330322e65d5105a6014afe2d85d_315_0.png)


    # Running shell commands


    There are hundreds of commands you can run with Linux. But how do you know what
    commands are available and how they work when you all see after a shell starts
    is something like this:


    `joe@toys memos$`

    To start off, you can tell a few things about your shell session just from the
    default prompt. In the case just shown, the user name is joe, the local computer
    name is toys and the current directory is memos (although the full path to the
    directory is likely something like /home/joe/memos). The dollar sign ($) indicates
    that joe is just a regular user, as opposed to a pound sign (#), which would indicate
    that you are logged in as the root user.


    Here is a quick procedure you can follow to familiarize yourself with the shell
    and your environment:


    +   1. Type:


    ```

    $ echo PATH

    /bin:/usr/local/bin:/usr/bin/X11:

    /usr/X11R6/bin:/home/joe/bin

    ```


    When you type a command, the PATH tells the which directories to look in to find
    the command you want. Most user commands are in /bin and /usr/bin. There are also
    some very basic commands (such as cd, history, and logout) built into the shell.


    Commands that you add might be put in /usr/local/bin (to be available to all users
    on your computer) or /home/joe/bin (to be just available to joe, or whatever user
    name you substitute for joe). We put many of the Linux Toys in /usr/local/bin.
    Commands in /usr/bin/X11 and /usr/X11R6/bin are those that are related to your
    desktop and often launch GUI windows.'
