    Assuming your sound card is already working (if it''s not, refer to the sound
    card configuration section in Chapter 3), you should configure your joystick to
    work. Here''s how you do that:


    +   1. Plug the joystick into the joystick port in the back of your sound card.

    2. Make sure that the sound and joystick modules are loaded. As root user from
    a Terminal window, type the following:'
