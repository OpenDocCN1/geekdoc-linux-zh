    FIGURE-B-1: The GNOME desktop offers simple controls and menus.


    3. Run the File Manager: With the GNOME desktop appearing on the screen, double-click
    the GNOME desktop icon (it''s named something like chris''s Home depending on
    your user name). This will open a file manager window, which for GNOME is the
    Nautilus window. Figure B-2 shows an example of Nautilus.


    Here are a few things to check out the Nautilus file manager window:


    **Home Directory:** Your home directory is, by default, your user name in /home.
    So, for the user name chris, the home directory would be /home/chris. Your home
    directory is where you store your personal data and applications. Create as many
    folders and subfolders in there you want.


    **Getting Around:** Double-click a folder to move down the directory structure.
    Click the Up button to move up. Or you can type a directory into the Location
    bar and press Enter to enter a particular directory or file.


    **Files & Applications:** Double-click a file or application to launch it. Right-click
    a file, and select Open With to choose an application that can be used to open
    the file. Some file types (such as image files) can be opened with different applications
    (such as image viewers, Web browsers, or manipulation tools).


    Close the Nautilus file window by clicking File → Close Window.'
