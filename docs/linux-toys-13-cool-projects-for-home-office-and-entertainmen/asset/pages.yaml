    underneath the laptop).


    +   8. Remove the hinges and plastic at the back of the laptop. At this point,
    the laptop should look similar to the one shown in Figure 15-6.


    +   9. Remove the keyboard and carefully unplug it.


    +   10. In example, the laptop had a metal case surrounding most of the components.
    If your laptop has such a case, remove it.


    +   11. Now it''s time to start unscrewing stuff and removing components. The
