  md: '# Step 7: Configure the FTP server


    Use the descriptions in Chapter 12 to configure your vsFTpd FTP server. In addition
    to that, add the following lines to the /etc/vsftpd/vsftpd.conf file:


    +   - anonymous_enable=No # Only real users get in

    - chroot_list_enable=YES # Users stay in home dir.

    - chroot_list_file=/etc/vsftpd.chroot_list # List of exceptions


    These lines make it that for all users, when they connect to the server using
    FTP, cannot access (or even see) anything outside of their own home directory.
    If you want a user to be able to traverse the whole computer on an FTP connection,
    add the user''s name to the /etc/vsftpd.chroot_list file. No anonymous users can
    log in from FTP.


    After you change the vsftpd.conf file, restart the FTP server as follows:


    ```

    # service vsftpd restart

    ```


    # Step 8: Configure the mail server


    We choose postfix as the mail transfer agent because it is easier to configure
    and more secure than sendmail (the other mail server software that comes with
    Red Hat Linux).


    # Start postfix


    To create a simple configuration for your postfix mail server, edit the /etc/postfix/main.cf
    file (as root user from a Terminal window). Then find the hostname and mydomain
    lines and change them to include the name of your mail server and domain, respectively.
    For example, following the preceding example where we created a domain quantumlinux.com,
    the entries would read as:


    ```

    hostname = mail.quantumlinux.com

    mydomain = quantumlinux.com

    ```


    To start postfix, type the following as root user from a Terminal window:


    ```

    # service postfix on

    # chkconfig postfix start

    ```


    # Start ipop3


    The ipop3d daemon can be listen for requests from mail clients to get their mail
    from the server. To configure the ipop3d mail client, type the following (as root
    user from a Terminal window):


    ```

    # chkconfig ipop3 on

    # service xinetd restart

    ```


    At this point, anyone who connects to your server requesting Post Office Protocol
    service to get their e-mail will be able to get to their mailbox (as long as they
    provide a valid name and password).'
  merge: -1
