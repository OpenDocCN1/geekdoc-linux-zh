    cause a problem. You can just start re-ripping the CD you started when the jukebox
    stopped and the CD will be ripped, compressed, and copied to the right place.


    If you are interested in how start-up scripts work in Linux, check out the sidebar
    "A Lesson in ... Linux Start-up Scripts." Otherwise, go ahead to the descriptions
    of the jukebox components.


