    # The operating system: Red Hat Linux


    Linux is a free operating system based on operating system UNIX and includes software
    created by thousands of programmers around the world. There are different distributions
    of Linux, from which we have chosen to use Red Hat Linux.


    In particular, we built Linux Toys to run on Red Hat Linux 9 and the following
    release. However, we also tested many of the Linux Toys packages on Red Hat versions
    7.3 and 8 and found that they worked well.


    If you are not familiar with Linux (or not exactly what an operating system is),
    here are a few questions and answers to help you.


    +   **What is an operating system?** An operating system is software that lets
    your computer talk to your computer hardware. It can:


    +   * Manage access to the computer''s processor by the programs you run.


    +   * Provide a structure to the files and directories that contain your programs
    and data.


    +   * Include drivers for different hardware devices, so your programs can talk
    to your CD drive, sound card, Webcam, or other computer hardware (without having
    to be burdened with the details of each hardware device).


    Advanced operating systems such as Linux were also designed to manage multiple
    users, running programs (called processes), and multiple processors (CPUs) at
    the same time.


    +   **What are other examples of operating systems?** Microsoft Windows (95, 98,
    2000, NT, ME, and XP) are other operating systems.


    +   **Do I need a commercial operating system, as Microsoft Windows, on my PC?**
    You don''t. No commercial software is needed with our projects; you can erase
    your hard disk and use only free software. In fact, Red Hat goes to deat lengths
    to not bundle in any software (even some software compiling to be free) that may
    infringe on legal patents or limit the distribution of the operating system. We
    try to do the same.


    +   **What is Linux?** Linux is an open source operating system. Ways in which
    you can copy, distribute, and modify Linux are covered under terms in the GNU
    General Public License (GPL). At the heart of the GPL is the intention that if
    you use code covered by GPL, you cannot restrict others from using that code.
    In other words, add to it and pass it on.'
