  md: '# 20 Part I — The Basics


    # Evaluating hardware in Linux


    There are both command-line and GUI tools for determining the hardware on your
    PC in Linux. From the GUI, try the Hardware Browser window; from the command line,
    start with the `lspci` command.


    Running the Hardware Browser

    If you are using a GUI, you can display basic hardware information about your
    computer using the Hardware Browser window. To open that, click the Hat Menu ->
    System Tools -> Hardware Browser. Figure 2-1 shows an example of that.


