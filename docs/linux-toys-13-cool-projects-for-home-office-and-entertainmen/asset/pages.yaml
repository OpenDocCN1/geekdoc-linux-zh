  md: '# 58 Part II — Entertainment Projects


    Change music location — Say you are running out of disk space on /usr/local/share/music
    and you want to start ripping and playing music to a different directory. You
    can do this by changing the line in the /usr/local/bin/lutorip script to some
    other directory name:


    ```

    $ my oggdir = "/usr/local/share/music"

    ```


    After that, you need to change the /usr/local/bin/musied script, replacing /usr/local/share/music
    with the new directory containing your music:


    ```

    /usr/bin/ogg123 -q /usr/local/share/music

    ```


    Use a different encoder — Instead of ogg123, you can use any program for encoding
    music that you prefer. You can change the following three lines to replace the
    path to the encoding command (/usr/bin/oggenc), any options to the encoding command
    (qw/-m 4 -q 6 /), and the file extension placed at the end of the encoded files
    (ogg):


    ```

    $ my encoder = "/usr/bin/oggenc"

    $ encoder_opts = qw/-m 4 -q 6 /

    $ my encoder_ext = "ogg";

    ```


    Next, you need to change the musied script to replace the ogg123 command that
    actually plays the music. (The music line you have to change is the ogg123 line
    in the previous buffer).


    ```

    /usr/bin/ogg123 -q -z /usr/local/share/music

    ```


    When writing CDs, it is important to note that the file format and the encoding
    format are completely different things. We have chosen to encode the musical data
    using the Vorbis reference encoder and save it in the Ogg file format. As new
    versions of the Vorbis encoder are developed, a given encoding quality level will
    result in better-sounding music that takes up the same amount of space. A corollary
    to this is that you''ll be to record at a lower-quality level and achieve the
    same result, while taking up less disk space.


    ![](img/93c80330322e65d5105a6014afe2d85d_85_0.png)


    # Troubleshooting Your Jukebox


    The Linux Toys Jukebox was intended to run pretty much without any intervention.
    On occasion, you might want to do some clean-up or deal with a problem CD. The
    next sections describe some problems you might have and ways to fix them.


    # The jukebox spits out your CD


    You put in a CD to rip and it immediately ejects. There are few reasons why this
    might happen:


    +   * The CD is badly damaged.

    * The CD is not a commercial music CD.

    * This is a music CD, but it isn''t in the database.

    * The hard disk is full.'
