  md: '# Chapter 6 — Creating an Arcade Game Player 107


    And there are a few thousand other games available as well. Some of the more popular
    games are also available in multiple MAME versions.


    You can control MAME games using the keyboard or mouse or by adding a joystick
    or Town Pad. You can adjust the size of the game window, frame rates, and scale.


    The biggest issue related to playing MAME games is the question of obtaining the
    ROMs legally. That issue is discussed in the “Getting Game ROMs” section.


    # Configuring an Arcade Game Player


    We''ve divided this project into several major parts. The first part (*Configuring
    an Arcade Game Player*) describes how to get the MAME games running on a regular
    PC along with Red Hat Linux. The other parts tell how to configure and play the
    games. The general steps for configuring the software you need for your arcade
    game are as follows:


    +   1. Gather hardware

    2. Install Linux and Arcade software

    3. Set up the joystick


    # Step 1: Gather hardware


    The PC you need for the Linux Arcade Game Player is about the same as the one
    you would need to run a desktop Red Hat Linux system. On top of RAM, CPU, and
    disk-space requirements (see Appendix B for details), we recommend having a sound
    card and joystick.


    The personal computer


    Because you need a GUI for this project, we recommend using a Personal Desktop
    of Red Hat Linux. Also, the GNOME desktop (which is the default anyway) is recommended
    because the front-end we are using for this project (gRustibus) requires that
    the GNOME libraries be installed. Here are some estimates to help you understand
    disk-space requirements:


    +   * Red Hat—A Personal Desktop install requires 1GB of disk space.

    "* Linux Toys Arcade software—Xname and gRustibus require about 6MB of disk space.

    "* Game ROMs—There are games with ROMs as small as 32K. Larger games can be more
    than 8MB each. If you leave 100MB of disk space, you should have no trouble fitting
    many ROMs as you own on your computer.


    You can get by with the minimum amount of RAM (128MB) allowed for a Red Hat desktop
    system. The recommended amount of RAM for a graphical install, however, is 192MB.
    A 400Mhz Pentium-class processor is the minimum recommended CPU.


    # Video card


    Most any video card that can run X11 should work with Xname. Since X is the base
    interface for the Red Hat Linux GUI, if the GUI is able to run Xname.'
