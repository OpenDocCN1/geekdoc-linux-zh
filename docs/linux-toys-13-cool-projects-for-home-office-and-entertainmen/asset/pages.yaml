    # # Step 5: Configure the picture frame software


    You''re going to set up the digital picture frame software to run automatically
    when you start up

    t laptop. The advantage of this is that you have only to turn on the computer
    and it will

    begin displaying your pictures. Here is what you do:


    > Caution Before you edit the /etc/initab file, make a backup copy of it and have
    a boot disk avail-

    (just case). A Mistake in the initab file can result in an operating system that
    will not

    boot.


    +   1. From a Terminal window (or other shell), open the /etc/initab file as root
    user

    using any text editor.

    2. Find the initabdefault line and change it to run level 4. It should appear
    like this:

    id:4:initdefault

    3. Add the following lines to the bottom of the file:

    pfin:4:respawn:/usr/local/bin/ltPPF_X

    The digital picture frame will start up. Here''s what it does:

    4. Restart the computer.

    - The xv command displays an image from the /usr/local/images

    directory.

    - After five seconds, the next picture is displayed.

    If you want to change either of those values, use the /usr/local/bin/ltPPF-X

    sh in any text editor. In that file, change either the value of IMAGE_PATH or

    SLIDE_DELAY to change the location of the images directory or the number of

    seconds to display each picture before changing it, respectively.'
