  md: '# 260 Part V — Just for Fun


    # Hard disk


    Here is the approximate disk space you will need:


    +   - Red Hat Linux — We recommend a Personal Desktop install, which requires
    about 1.7GB of disk space. A minimum install type will work if you can add the
    necessary packages (described later) needed to display the images.

    - Itpiece RPM — This requires less than 1MB of disk space.

    - Images — Depending on the size and quality of your images, disk space required
    to store them will vary. The best idea is to check the size of the digital pictures
    you are taking. Also, because some older laptops can''t do better than a 640 ×
    480 display, we automatically reduce your images to that size before starting
    the slide show. So you also have to allow disk space for a 640 × 480 copy of each
    image. In all, I''d recommend at least 100MB of disk space for your pictures.


    # CD drive or floppy drive


    CDs are the preferred medium for installing Red Hat Linux and the Linux Toys software.
    However, if you are using an old, floppy-only laptop, you can install Red Hat
    Linux over the network. For that you need a network card (described next).


    # Network card (optional)


    Most laptops built in the past few years have PCMCIA slots built in. Those slots
    allow credit card size devices to be inserted into the laptop. By adding an Ethernet
    card to an old laptop you can:


    +   - Install Red Hat Linux and Linux Toys without having a CD drive on your laptop.
    (You can start the process from a floppy disk).

    - Use the network connection to load more pictures on the laptop (so you don''t
    need to keep the keyboard attached).


    New PCMCIA Ethernet cards go for about $30. Older laptops tended not have built-in
    Ethernet; never does one. If you don''t want to pay for a network card, you''re
    going to need to attach a keyboard and CD drive when you want to add images.


    # Picture frame


