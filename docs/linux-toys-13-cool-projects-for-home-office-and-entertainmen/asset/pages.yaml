  md: '# Building a Digital Home Video Archive


    if you have kids (or if your parents have kids), there are probably piles of videotapes
    lying around of first steps, important games, and school plays. If these tapes
    are destroyed or stolen, you''ll lose priceless images that just can''t be replaced.
    The Linux Toys Digital Home Video Archive project lets you take these precious
    home videos and:


    +   - Encode them to your computer.

    - Play them on your computer.

    - Burn them to CD (about 17 minutes) or DVD (up to about two hours) to play back
    on a computer.

    - Burn them to VCD to play on your most home DVD players.

    - Pass them around however you like. (For example, you could add video files to
    your FTP site, as described in Chapter 11, so family and friends can download
    and view your videos.)


    Okay, you won''t end up with broadcast-quality television from this project. And
    it can be a bit tricky getting it all working). However, with the right hardware
    and a bit of tweaking, you can make some reasonable backup copies of irreplaceable
    family moments. The important thing is that you can store the originals in a safe
