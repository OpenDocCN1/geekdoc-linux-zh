  md: '# Chapter 14 — Controlling Toy Cars 251


    ![](img/93c80330322e65d5105a6014afe2d85d_278_0.png)


    If you''re an old hand at soldering, you can probably ignore this tip. If you
    haven''t soldered before, here are some things to take into account.


    Soldering pens are hot. They have a bad habit of letting smoke out of important
    components. Use some sort of clamp-on heat-sink tool to bleed away excess heat.
    You can find just about any soldering tool you need at your local Radio Shack.
    As actual soldering technique, avoid touching the solder with the tip of the soldering
    pen. You get the best solder seal by heating the metal contacts that you are trying
    to solder and letting the solder flow into the area that has been heated.


    It is also helpful to use light sandpaper periodically to rid your soldering tip
    of soot and grime. If you''ve cleaned, coat the tip with some solder to keep it
    clean. Above all, if you''ve never soldered before, practice first. Get some loose
    wire and solder it to some old circuit board until you''re comfortable with the
    process.


    # Step 4: Test your car


    Turn on your toy car and charge up your car. When the light turns green, you are
    ready to go. Try the buttons on the controller manually (they should still be
    working) to make sure that the controller can communicate with the car. You are
    now ready to test the car out from Linux.'
