- img_proc: true
  md: 'If you''re new to the command line or just need a refresher, make sure to read
    the appendices before you start this chapter.


    # # The IPO Pattern


    Most programs that are designed to be used in the shell or a Linux-like system
    use a pattern known as input-process-output (IPO), which means "take input, process
    it in some way, and then produce output" (see Figure 2-1). In fact, many programs
    outside of the shell and Linux can be said to use this pattern.


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_45_0.png)


    Figure 2-1: The IPO pattern


    In the shell, when we use the output of one program as the input of another, we
    are using a pattern known as a pipeline. Figure 2-2 shows a more concrete example
    of a pipeline using the sort ("sort lines alphabetically") command, which sorts
    the input in alphabetical order. You can see this in action by running sort in
    a shell.


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_45_1.png)


    Figure 2-2: The sort program takes the input, sorts it, and outputs the result


    Start the sort program, enter some text, and then press CTRL-D (which appears
    in the shell as ^D) like so:


    ```

    $ sort

    dogs

    chase

    cats

    and

    cats

    chase

    mice

    ^D

    ```


    The ^D command signifies the end of transmission (EOT), telling the program that
    you''ve finished entering your input. The shell then sorts that input and returns
    the alphabetically ordered:


    +   and

    cats

    cats

    chase'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'chase

    dogs

    mice


    Behind the scenes, sort is using two special channels of data called stdin\and
    stdout. These channels, known as streams, are critical to how programs\and the
    shell work.


    # Streams


    A stream is nothing more than a flow of data. A YouTube video is a stream.

    Your browser doesn''t download the entire video and start playing from

    beginning to end; instead, it streams the data, downloading only what it

    needs to play the current frame and the few seconds before. If you skip to

    later of a video, you don''t download all the frames in between—you

    just start the video from the later location.


    Streams in Linux and the shell work the same way. Say I write a pro-

    gram that reads text from a large file and searches for a certain word. In

    general, it won''t read the entire file and search through it for the

    word; rather, I will stream the file into the program, reading a line or two

    at a time and searching in these lines before moving on to the next

    couple lines. This is far more efficient, as reading the entire file into

    t program’s memory would take unnecessary time and resources. For

    example, you could read a file that is larger than the computer’s total avail-

    memory and still search through it, even though the entire file is never

    loaded at once, just a chunk of it at a time.


    Streams allow you to easily process input and output. You can read

    files, network locations, special devices, or keyboards as input streams,\sand
    you can write to files, screens, network locations, or a printer as output

    streams. These are just examples; you can use many different types of

    inputs and outputs.


    Streams are an incredibly powerful abstraction that means programs

    don''t need to know anything about the internet, the printer, the network,

    or even how files are stored—they just need to know how to read from

    to write a stream. The operating system’s device and drivers will handle

    turn the stream into files, print output, or whatever is needed.


    # stdin, stdout, and stderr


    Every program has access to the three special streams—stdin, stdout,\and\derr—shown
    in Figure 2-3.


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_46_0.png)


    Figure 2-3: Programs have access

    to three special streams: stdin, stdout,

    and stderr.'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'The stdin (standard input) stream is where programs read their input from;
    by default, in most cases this will be the input from the keyboard.

    The stdout (standard output) stream is where programs write their output; the
    default most cases will be the screen. The stderr (standard error) stream is where
    programs write error messages to, which is typically the screen (just like stdin).
    You might sometimes see these referred to as files, which is fairly accurate.
    The system can treat them just like files—opening them, writing to them, and so
    on.


    > > NOTEnMany programs don''t require you to make any configuration to use these
    three special streams, as they''re used by default. You''re free to choose how
    a program will read and write output, and some programs might not follow these
    conventions.

    Chapter 21 will cover how to use tools that follow these conventions and how to
    customize the storage of input and output.


    When you run programs in a shell, the shell attaches your keyboard to the program''s
    stdin and attaches the terminal''s stdout to stderr, as shown in Figure 2-4. Thus,
    by default, your key presses are taken as input, and any output or errors are
    delivered to the screen.


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_47_0.png)


    Figure 2-4: A shell generally attaches its keyboard to stdin and sends stdout
    and stderr to the screen.


    Here you can see the beauty of streams. Your program doesn''t need to know it''s
    getting its input from the keyboard; it receives information via stdin. You use
    the keyboard to type text, which is streamed into the program''s input. The program
    writes its output to the stdout and stderr streams, and the shell streams this
    output as text on the screen. You could just easily pass other types of input
    to the program, such as files, and it will work; you''ll see how to do this in
    the next section.


    Each stream has a special number, shown in gray in Figures 2-3 and 2-4, known
    as the file descriptor. Whenever you open a file, the operating system allocates
    a new file descriptor to keep track of any files in use. The descriptors 0, 1,
    and 2 are reserved for stdin, stdout, and stderr. To check this, run the following
    command:


    ```

    $ ls -al /dev/*

    rwxr-xr-x 1 root root 15 Apr 2 19:01 /dev/stderr -> /proc/self/fd/2

    rwxr-xr-x 1 root root 15 Apr 2 19:01 /dev/stdin -> /proc/self/fd/0

    rwxr-xr-x 1 root root 15 Apr 2 19:01 /dev/stdout -> /proc/self/fd/1

    ```


    Here list the list of the /dev directory and the output to just files that start
    with std by using wildcard asterisk (*). Each stream''s special descriptor appears
    at the end of its line.'
