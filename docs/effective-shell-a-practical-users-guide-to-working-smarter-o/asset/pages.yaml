  md: '# # 16


    # # CUSTOMIZING YOUR COMMAND PROMPT


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_252_0.png)


    The previous chapter covered numerous options for configuring certain shell features,
    and this chapter extends that topic with a specific focus on the *command prompt*,
    the text shown to the left of your cursor indicating that the shell is waiting
    for you to type a command. You''ll learn how to customize your command prompt
    to show only the information you want to see, and you''ll explore a script that
    allows you to set a command prompt theme from a list you can extend over time.
    This script will even handle the differences between bash-like shells and the
    Z shell, ensuring a consistent command prompt across shells.'
