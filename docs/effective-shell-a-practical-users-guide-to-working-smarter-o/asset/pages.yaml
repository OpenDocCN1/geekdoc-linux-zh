  md: '# HELP—I DON''T KNOW PYTHON!


    Don''t worry if you don''t know Python; you''ll learn the basics as you go

    the chapter. All of the chapters in this part of the book will likely stretch
    you and

    require some additional learning and experimentation. I''ll explain as much as

    can I go through the chapter, but you should be able to take away the key

    lessons without being familiar with the Python language.


    All of the files you''ll see in this section are in the ~effective-shell/programs/

    lookup folder. To install the sample files to your ~effective-shell folder, run
    this

    command:


    ```

    $ effective.sh | sh

    ```


    Before proceeding, you''ll need to make sure you have Python installed.

    There are two commonly used versions of Python. Python 3 is the latest ver-

    sion the time of writing and what you''ll use for this script. Python 2 was

    unsunset (support and improvements were discontinued) in January 2020.

    Many people still use it, and a lot of code is written in it, but where possible,

    you update Python 2 code to Python 3.


    Check that Python 3 is installed by running the following:


    ```

    $ python3 --version

    ```


    In general I recommend making it clear that you''re using Python 3 by running
    the

    python3 command, as in this example. On many systems, the python command points

