  md: 'To install this chapter''s samples to the ~/effective-shell folder, run this
    command:


    ```

    $ effective.sh | sh

    ```


    Let''s start with head. Imagine you''ve been sent a large data file and you don''t
    know exactly what''s in it. Take a quick look at the first part of its contents,
    run the head command as follows:


    ```

    $ head ~/effective-shell/data/top100.csv

    "Rank", "Rating", "Title", "Reviews"

    "1","97", "Black Panther (2018)", "515"

    "2","94", "Avengers (2019)", "531"

    "3","93", "Us (2019)", "536"

    "4","97", "Toy Story 4 (2019)", "445"

    "5","99", "Lady Bird (2017)", "393"

    "6","100", "Citizen Kane (1941)", "94"

    "7","97", "Mission: Impossible - Fallout (2018)", "430"

    "8","98", "The Wizard of Oz (1939)", "520"

    "9","96", "The Irishman (2019)", "441"

    ```


    The head command shows only the first 10 lines of a file. In this case, the first
    few lines tell you that this is a comma-separated values (CSV) file that contains
    a list of movies. This list consists of the 100 films on Rotten Tomatoes at the
    time of writing, with the score, tomato meter, and number of votes. You''ll use
    this sample file in this chapter to learn about text manipulation.


    To specify the number of lines you want to use, use the -n ("number") flag with
    the number of your choice:


    ```

    $ head -n 3 ~/effective-shell/data/top100.csv

    "Rank", "Rating", "Title", "Reviews"

    "1","97", "Black Panther (2018)", "515"

    "2","94", "Avengers (2019)", "531"

    ```


    This returns only the first three lines.


    The tail command works in the same way but shows the end of a file. This tail
    command is more useful when you''re looking at content that changes over time,
    like logfiles where you probably want to see only the most recent entries.


    To view the 10 most recent commands you''ve entered in your shell, use tail with
    HISTFILE so:


    ```

    $ tail ~HISTFILE

    ls

    in -n 3 ~/effective-shell

    cat ~/effective-shell/data/top100.csv

    head -n 3 ~/effective-shell/data/top100.csv

    head ~/effective-shell/data/top100.csv

    gcd

    git stash

    gcd

    git stash pop

    tail ~HISTFILE

    ```'
