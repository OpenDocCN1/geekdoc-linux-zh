  md: '# ESCAPING CHARACTERS


    If you want to use a character like the circumflex or square bracket, just escape
    it. Simply put a backslash (\) before the relevant character, and it will be interpreted
    literally, as in these examples:


    +   - \[\\]]+ Matches a left or right square bracket, [ or ]

    - \^ Matches the circumflex, followed by the plus sign, ^


    # Anchors


    You might have noticed that the expression [^\s]+@[^\s]+ returns matches that
    include text before and after the email address:


    to: dave@effective-shell.com

    dave@effective-shell.com <Dave Kerr>


    To match only in lines that don''t include any extra characters before or after
    the email address, you can use anchors: regex syntax characters that represent
    particular parts of a string, such as the start or end of a line.

    To match lines that contain only a complete email address, use the circumflex
    (^) start-of-line anchor and the dollar sign ($) end-of-line anchor. Remember
    that in a character set (anything between square brackets), the circumflex negates
