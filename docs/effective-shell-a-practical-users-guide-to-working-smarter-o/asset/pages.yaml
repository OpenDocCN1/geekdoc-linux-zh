  md: '# Creating Your Dot Files


    Keeping your shell customizations in your dot file not not only helps you distinguish
    between your personal configuration settings and those provided by the system,
    but it also makes it easier to share the file across different machines. All you
    need to do is copy the file to each machine you want and source it from the ~/.bash
    file.


    Another great benefit is that you can source your dot file in different if you
    want to, or you can check in the dot file for the shell type and then load a configuration
    specifically for that.


    # Creating the Dot Files Folder


    It''s entirely possible (and quite likely) that over time you''ll build up collection
    of many dot files—some might be used for the shell, such as a file to set your
    favorite aliases or functions, and some might be for other tools—so you''ll need
    a way to keep things organized. I''ll show you how to manage your dot files that
    I''ve found useful. As I walk through the process, feel free to customize or adapt
    it to suit your preferences.


    First, create a folder called ~/dotfiles for your personal configuration files:


    ```

    mkdir ~/dotfiles

    ```


    Keeping your dot files in a single folder will make it easier for you to package
    them up and share them, track changes to them, and update them later.


    # Creating shell.sh


    Now you''re ready to create your own shell configuration file in the dotfiles
    folder:


    ```

    touch ~/dotfiles/shell.sh

    ```


    You can call this file whatever you like; it really comes down to personal preference.
    But here are a few points about the name I have suggested, shell.sh:


    +   - I haven''t put a dot in front of the name. This is because I don''t actually
    want this file to be hidden within the ~/dotfiles folder; I want to see this file
    when I look in the folder.

    - I haven''t used the name of a shell program in this file. I want to make this
    work with any shell that I regularly use. Whether I''m using zsh, bash, or sh,
    this file should still be able to load.

    - I''ve put .sh at the end of the filename. This isn''t really needed or even
    common in the world of Linux or Unix, but it makes immediately clear to the reader
    (or any program that opens the file) that this is a shell script.'
