  md: '# Table 16-1: PS1 Escape Sequences (continued)


    | Sequence | Meaning |

    |--- | --- |

    | \V | The release of bash with the patch level (for example, 5.0.17) |

    | \w | The current working directory, with HOME abbreviated as a tilde (~) |

    | \W | The current working directory name (rather than the entire path, as in
    \w) |

    | ! | The history number of this command |

    | # | The command number of this command |

    | $ | The prompt itself (this is a dollar sign unless you''re a superuser, in
    which case the hash mark is used) |

    | \nn | The character representing the octal number nnn, used to show special
    characters |

    | \| | Literal backslash (\) |

    | \[ | The "start of non-printing characters" sequence |

    | \] | The "end of non-printing characters" sequence |


    Some of these sequences are reasonably self-explanatory, but some are a little
    more complex. We will use some of them to experiment with customizing the prompt.


    > The Z shell uses different sequences. I suggest that you follow this chapter
    to understand bash-like shells, and then you can apply the same techniques using
    the Z shell. Later in this chapter, I will introduce a function that automatically
    converts the prompt into the Z shell format if needed; see "Writing a Script to
    Customize the Command Prompt" on page 231.


    To change the prompt, simply set the PS1 variable with any escape sequences you
    choose:


    ```

    dwkmerr@effective-shell-ubuntu-24:~$ PS1=''\d \@ \

    Sun Jun 06 12:43 PM $

    ```


    This example specifies the \d (current date), \@ (current time in AM/PM), and
    \$(prompt) escape sequences, followed by a space. Note that you have to use single
    quotes to specify the value of the PS1 variable; otherwise, the shell would see
    the dollar sign and assume you''re trying to use a variable. For a reminder on
    how quoting works, see Chapter 10.


    And if you want to show the number of jobs, the command number, and then say:


    ```

    Sun Jun 06 04:43 AM $ PS1=''[%j] (\#) \

    [0] (4) sleep 10 & \

    [1] 27588

    [1] ($5) sleep 10 & \

    [2] 27600

    [2] ($6) sleep 10 & \

    [3] 27601

    [3] (7) $

    ```'
