  md: 'You''ve cut out the film names from the data file, sorted them, and then piped
    the results into less so that you can page through the data to ensure it is correct.


    The less prompt (:) at the bottom of the screen indicates that you can use the
    keyboard to enter commands. You can press the spacebar to move to the next page.
    You can type u to move up or d to move down; or you can use the up and down arrow
    keys. To exit the pager, you type q. You can find all of these commands (and others)
    by running man less.


    # Summary


    This chapter explored several tools and techniques for working with text. You
    saw how to extract only the first or final parts of a text file; translate characters;
    cut, sort, and reverse text; remove duplicate adjacent lines of output; and page
    through the results of a large file. You''ll return to these basics again and
    again as you work with data in the shell.


    In the next chapter, you''ll learn how to perform more advanced text manipulation
    with the sed command.'
