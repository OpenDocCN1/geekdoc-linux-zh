  md: '# AFTERWORD


    # GENERATIVE AI AND THE SHELL


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_408_0.png)


    Excitement and development around generative AI have increased enormously over
    the past few years. Many of us are finding that tools like ChatGPT can help us
    with tasks such as writing code, looking up how to execute certain operations,
    and tracking down the root causes of errors. Unfortunately, when you''re working
    in the shell, accessing AI tools typically requires you to switch to a web browser,
    disrupting your flow. I found this annoying enough that I wrote a tool call Terminal
    AI that allows you to query ChatGPT directly from your shell and get results tailored
    to your environment.


    In this afterword, I''ll walk you through a few ways of using Terminal AI to maintain
    your workflow and effectiveness as a shell user. Given the pace at which generative
    AI is evolving, there will likely be many more options available to you by the
    time you''re reading this.'
  merge: -1
  pgno: 408
- img_proc: true
  md: '# Installing and Running the Terminal AI


    Before you can install Terminal AI, you''ll need to install the npm ("Node Package
    Manager") program, which is part of the toolkit for the Node.js programming language.
    Follow the installation instructions for your operating system and hardware at
    https://nodejs.org/en/download. Once you''ve installed npm, install Terminal AI
    like so:


    ```

    npm install -g @dwmkerr/terminal-ai

    ```


    The -g ("global") flag tells npm to install Terminal AI globally so that you can
    call it from any location. Terminal AI installs a tool named ai, which you run
    as follows:


    ```

    $ ai

    ```


    Welcome to Terminal AI!


    An API key must be configured that Terminal AI can talk to ChatGPT. Enter your
    key, or for instructions check: https://github.com/dwmkerr/terminal-ai#api-key


    ? API Key:


    You''ll be prompted for an API key to talk to ChatGPT. For instructions on creating
    this, search online for "ChatGPT API Key" or visit the Terminal AI project home
    page at https://github.com/dwmkerr/terminal-ai. Once you enter your key, you''ll
    be able to use the tool.


    # Chatting with ChatGPT


    Now you can run the ai command and start chatting with the tool. Here are some
    example queries:


    ```

    $ ai

    chat: What''s my current shell and OS?

    chatgpt: Your current shell is /bin/bash and your operating system is linux.

    ```


    ```

    chat: Show largest files in pwd recursively.

    chatgpt: To display the l largest files in the current directory recursively,
    you can use the following command:

    ```


    ```

    find . -type f -exec du -h {} | sort -rh | head -n 5

    ```


    ```

    chat: Is it possible to print a colored message in a shell script?

    chatgpt: Yes, you can print colored text in a shell script using ANSI escape codes.

    ```


    ```

    chat: Can you show me how to print "Hello" in red?

    chatgpt: Here is an example of how you can print "Hello" in red

    ```'
