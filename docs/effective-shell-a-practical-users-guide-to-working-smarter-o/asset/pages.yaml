    Cygwin provides a large set of programs that are designed to work on Windows and
    are generally available on Linux systems,

    Go to https://www.cygwin.com to download the Cygwin installer. Start the installation.
    When prompted to choose a download source, make sure **Install from Internet**
    (the default) is selected, as seen in Figure A-1, and then click **Next.**


