    # Arithmetic Expansion


    The final form of shell expansion that starts with a dollar sign is arithmetic
    expansion, which can be used to perform simple arithmetic operations:


    ```

    $ echo "The result of 23*4 is: $((23*4))"

    The result of 23*4 is: 92

    ```


    Arithmetic expansion is covered in detail in Chapter 10.


    # Word Splitting


    Word splitting is the process by which the shell attempts to split the result
    of parameter expansion, command substitution, and expansion into separate items,
    or words. The shell applies word splitting to any expansion that starts with a
    dollar sign and does not appear in double quotes. This rule can cause confusion,
    so let''s take a look at word splitting in detail and see when it''s useful and
    when it can be problematic.


    To show word splitting in action, this script prints a set of days:


    ```

    days="Monday Tuesday Wednesday Thursday Saturday Sunday"

    for day in ${days}

    dn  echo "${day}"

    done

    ```


    Note that there are different numbers of space characters between each day in
    the days variable.'
