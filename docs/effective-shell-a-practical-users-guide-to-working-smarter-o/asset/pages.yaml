  md: "# The case Statement\n\nIf you find yourself writing overly complex if statements,\
    \ a case statement might simplify your code. A case statement works by matching\
    \ an expression against different patterns. Here's the general structure:\n\n\
    ```\ncase expression in\n    pattern1)\n        pattern1-commands\n    ;\n   \
    \ *)\n        default-commands\n    ;\nnesac\n```\n\nThe expression is the value\
    \ you want to test against pattern1. If pattern1 matches, its associated commands\
    \ run. The (*) pattern uses the asterisk (*) wildcard to match anything not matched\
    \ by previous patterns, causing the default commands to run. The double semicolon\
    \ (;;) tells the shell when the commands for a specific case end. The indentation\
    \ is optional but considered best practice as it makes easier to quickly see the\
    \ patterns and their associated commands. As with if and fi, to close the case\
    \ statement use\n\nOf course, this is a basic example that you could probably\
    \ handle with if statement, let's look at a more likely scenario. Here's how you'd\
    \ structure a case statement that checks an expression against multiple patterns:\n\
    \n```\ncase expression in\n    pattern1-commands\n    ;\n    pattern2 | pattern3)\n\
    \        pattern2and3-commands\n    ;\n    *)\n        default-commands\n    ;\n\
    esac\n```\n\nThe pipe (|) tells you more than one pattern at a time: if expression\
    \ matches either pattern2 or pattern3, the corresponding commands will run. Typically,\
    \ you'll provide the case statement with a variable to check a number of values.\
    \ For example, you could use case to check whether a variable contains a yes or\
    \ no response:\n\n```\nread -p \"Yes or no: \" response\ncase \"${response}\"\
    \ in\n    y | Y | yes ok)\n        echo \"You said yes \"\n    ;\n```"
  merge: -1
  pgno: 179
- img_proc: true
  md: "```\nn | N | no)\necho \"You said no \"\n;;\n*)\necho \"${response}' is not\
    \ a valid response\"\n;;\n```\n\nNote that this also handles case *), where the\
    \ user types something other than the acceptable input, and runs the default command\
    \ to tell them they entered an invalid response.\nThe preceding example uses very\
    \ simple text patterns, but you can make them more sophisticated:\n\n```\nread\
    \ -p \"Yes or no: \" response\ncase \"${response}\" in\n[yY]*)\n  echo \"You have\
    \ (probably!) confirmed\"\n  ;\n[nN]*)\n  echo \"You have (probably!) denied\"\
    \n  ;\n*)\n  echo \"${response}' is not a valid response\"\n  ;\n```\n\nThe [yY]*\
    \ pattern means either the y or the Y character followed by zero or more characters,\
    \ so this statement will match replies like yes, YES, and yay. There is a similar\
    \ pattern for the negative response. These patterns bit like regular expressions,\
    \ but they are actually globs (patterns that include wildcards, as I'll discuss\
    \ in Chapter 12).\nEven if they take more lines to write than the equivalent statements,\
    \ case statements can make your code more readable, so they're often worth the\
    \ added complexity.\n\n# Conditional Expressions\n\nConditional expressions are\
    \ a feature of bash and bash-like shells that offer a more sophisticated way of\
    \ performing conditional checks. Conditional expressions use two square brackets\
    \ rather than one, as in this example earlier in the chapter:\n\n```\nif [[ $year\
    \ -ge 1980 && $year -lt 1990 ]]; then\n  echo \"$year is in the 1980s\"\n```\n\
    \nThe conditional expression in this statement allows you to test multiple conditions\
    \ simultaneously in a more concise format than plain test"
