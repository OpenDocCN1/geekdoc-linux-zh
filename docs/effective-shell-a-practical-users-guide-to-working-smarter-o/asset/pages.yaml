  md: "```\nfor i in {1..10}; do\n  # Update the counter.\n  count=$((count + 1))\n\
    echo \"Count is: ${count}\"\ndone\n```\n\nThis code defines a run_loop function\
    \ that creates a locally scoped count variable. The counter starts at 0 and increments\
    \ by 1 at each iteration of for loop. After 10 iterations, the loop ends and the\
    \ value of count is printed.\nHere's what happens when you run this function:\n\
    \n```\n$ run_loop\nCount is: 10\n$ echo \"Count: ${count}\"\nCount:\n```\n\nBecause\
    \ you declared the count variable with the local keyword, it's available to the\
    \ run_loop function and any functions run_loop calls. If you try to access count\
    \ outside of these contexts, however, it is undefined.\nIn general you should\
    \ use local variables inside functions, which can help you avoid problems where\
    \ calling a function can have unintended side effects. Consider this example,\
    \ where you set a count variable and then call the previous run_loop function:\n\
    \n```\n# Set a count variable somewhere in the script.\ncount=3\n```\n\n```\n\
    # Call the \"run_loop\" function.\nrun_loop\n```\n\nThe output of this script\
    \ is:\n\n```\nCount is: 10\nThe 'count' variable is: 3\n```\n\nEven though you've\
    \ defined a variable named count in the run_loop function, it doesn't overwrite\
    \ the count value you set outside of the function (3 in this case) since it is\
    \ locally scoped. If you had defined the count variable without the local keyword\
    \ when you created the run_loop function, however, running this script would give\
    \ you the following output:\n\n```\nCount is: 10\nThe 'count' variable is: 10\n\
    ```\n\nWithout the local keyword, calling run_loop overwrites the count variable\
    \ outside of the function. Others reading your script might not expect this behavior\
    \ and will be pleasantly surprised when calling your function overwrites the variables\
    \ they're using."
