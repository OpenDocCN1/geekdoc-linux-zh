  md: "# QUICKLY CHECKING PARAMETERS\n\nIf you just need to check what parameters\
    \ are available for a command, you can skip the man page. Simply enter the name\
    \ of the command followed by a hyphen (-) and then press TAB. Try it out by entering\
    \ mkdir - and then pressing TAB. You should see the following output:\n\n```\n\
    -m -- set permission mode\n-p -- make parent directories as needed\n-v -- print\
    \ message for each created directory\n```\n\nThis convenient shortcut gives you\
    \ only the information you need and this can be much easier to navigate than a\
    \ man page.\n\n# The Pager\n\nThe shell uses a tool called pager that allows you\
    \ to use the arrow keys to scroll through content that doesn't easily fit on screen,\
    \ such as man pages. In other words, the pager provides the keyboard interface\
    \ to look through the file.\n\nOn most systems, this pager is the less program.\
    \ These are the most common commands for navigating through pages with:\n\n+ \
    \  d Scroll down half a page.\nu Scroll up half a page.\nj/k Scroll down or up\
    \ a line. You can also use the arrow keys for.\nq Quit.\n/searchterm Search for\
    \ the text specified after the forward slash.\nN When searching, find the next\
    \ occurrence.\nN When searching, find the previous occurrence. \n\nAlternative\
    \ pagers are available (on many Unix-like systems, you'll have less, more, and\
    \ most), but in general, less will provide what you need.\n\n# Builtins\n\nSometimes\
    \ you will look up a command in the manual and the “built-ins” page:\n\n```\n\
    $ man cd BSD General Commands Manual  BUILTIN(1)\n```\n\n```\nNAME\nbuiltin, !,\
    \ %, ., ;, @, {, }, alias, bg, bind, bindkey, break,\nbreaksw, builtins, case,\
    \ cd, chdir, command, complete, continue,\n```"
  merge: -1
  pgno: 447
- img_proc: true
  md: 'This happens when the command you are looking up—cd, in this case—is a built-in
    shell command rather than a program with a man page. Most shells offer a way to
    get help with such commands. For example, bash has the help command:


    ```

    $ help cd

    cd: cd [-L][[-P [-e]] [[@]]

    Change the shell working directory.

    ```


    Change the current directory to DIR. The default DIR is the value of the HOME
    shell variable.

    ...


    > The Z shell doesn''t have an equivalent of the help command for builtins. Instead,
    it has a set of man pages. To get help on builtins, man zshbuilds. Type man zsh
    and press TAB to see a list of suggested topics.


    This is all I''ll say about help for now, but you''ll see it used where appropriate
    throughout the book.


    # Manual Sections


    In man pages, you''ll often see tools listed with numbers after them. Take a look
    at man less as an example:


    ```

    $ man less

    LESS(1)                               LESS(1)

    ```


    ```

    NAME

    less opposite of more

    ...

    ```


    The number after less is the manual''s section, which is used to categorize help
    topics. On most Unix-like systems, you can find the section definitions in the
    manual documentation by running man. Here''s a snippet of what you might see:


    | **Section 1 - Executable programs or shell commands |

    | **Section 2 - System calls (provided by the kernel)|

    | **Section 3 - Library calls (functions within program libraries)|

    | **Section 4 - Special files (usually found in `/dev`) |

    | **Section 5 - File formats and conventions (e.g. `/etc/passwd`) |

    | Section 6 - Games |

    | Section 7 - Miscellaneous (including macro packages and conventions), e.g. `man(7)`,
    `groff(7)` |

    | Section 8 - System administration commands (usually only for root) |

    | Section 9 - Kernel routines (Non standard)'
  merge: -1
  pgno: 448
- img_proc: true
  md: 'You can specify which section of the manual to search (for example, if there''s
    an entry in multiple sections) by running the following:


    ```

    $ man sectionnumber searchterm

    ```


    To get more information about a section itself, open its intro page like so:


    # $ man 1 intro


    INTRO(1)        BSD General Commands Manual        INTRO(1)


    # NAME


    intro -- introduction to general commands (tools and utilities)


    # DESCRIPTION


    Section one of the manual contains most of the commands which comprise...


    In general, you won''t need to worry about the section specifics unless you''re
    looking for a tool that has an entry in more than one section or you need to look
    up the section number that appeared in online or documentation of the tool.


    # Man Page Titles and Summaries


    You can search man titles and summaries like so:


    ```

    $ man -k cpu                        - Measure CPUs a process runs on. Uses DTrace

    cpuwalk.d(1m)                             - dispatcher queue length by CPU. Uses
    DTrace

    displen.d(1m)

    gasm(n), grammar:::cpu::gasm(n) - ME assembler

    ```


    You can also use the apropos or whatis commands to search through the manuals.
    However, for simplicity''s sake, just remember -k!


    # Summarizing Output with tldr


    Say you want to compress files. You know you can do this with the zip command,
    but you''ve forgotten the syntax, so you run zip as follows:


    # $ man zip


    ZIP(1L)


    # NAME


    zip - package and compress (archive) files


    # SYNOPSIS


    ```

    zip [-aBcdDeEffFghjkllqrRStuvVwXyz!@] [--longoption ...] [-b path] [-n suffixes]

    [-t date] [-tt date] [zipfile ...] [-xi list]

    ```


    ZIP(1L)


    418  Appendix B'
  merge: -1
  pgno: 449
- img_proc: true
  md: "zipcloak (see separate man page)\n\nzipnote (see separate man page)\n\nzipsplit\
    \ (see separate man page)\n\nNote: Command line processing in zip has been changed\
    \ to support long options and handle all options and arguments more consistently.\
    \ Some old command lines that depend on line inconsistencies may no longer work.\n\
    \n# DESCRIPTION\n\nzip is a compression and file packaging utility for Unix, VMS,\
    \ MSDOS, OS/2, Windows 9x/NT/XP, Minix, Atari, Macintosh, Amiga, andn RISC OS.\
    \ It is analogous to a combination of zip tar(1) and compress(1) and is compatible\
    \ with PKZIP (Phil Katz's ZIP for MSDOS systems).\n\nA companion program (unzip(1))\
    \ unpacks zip archives. The zip and unzip(1) programs can work with archives produced\
    \ by PKZIP (supporting PKZIP features up to PKZIP version 4.6), and PKZIP and\
    \ PKUNZIP can work with archives produced by zip (with exceptions, notably streamed\
    \ archives, but recent changes in the zip file standard may facilitate compatibility).\
    \ zip version 3.0 is compatible with PKZIP 2.04\n\n> Wow, that's a lot of detail—and\
    \ this is just the first page of about 30! Now compare that to output from the\
    \ tldr (short for \"too long, didn't read\") tool:\n\n# $ tldr zip\n\nzip\n\n\
    Package and compress (archive) files into a Zip archive.\nSee also: 'unzip'.\n\
    More information: <https://manned.org/zip>.\n\n+   - Add files/directories to\
    \ a specific archive ([recursively]):\n  zip -r path/to/compressed.zip path/to/file_directory1\
    \ path/to/file_directory2 ...\n- Remove files/directories from a specific archive\
    \ ([delete]):\n  zip -d path/to/compressed.zip path/to/file_directory1 path/to/file_directory2\
    \ ...\n\nThe first example is what you're looking for. More information is shown\
    \ later on, and for some more complex details, you might have to go to the manual,\
    \ but this is great for the basics.\nThe tldr tool is available on most package\
    \ managers, including Homebrew and Apt. It's open source and community maintained.\
    \ You can find instructions for installing it at https://tldr.sh."
