- img_proc: true
  md: '# Checking Whether You''re in a Login Shell


    Not all systems provide you with a login shell by default. The o determine whether
    your shell is a login shell by examining the o variable, which holds the parameters
    that were used to start the shell. By convention, if the parameter starts with
    a dash (-), you can assume you''re in a login shell. Try it out like so:


    ```

    $ echo "$0"

    -bash

    ```


    In this case, the parameter used to start the shell was -bash, indicating that
    you''re in a login shell. If you see something like bash or zsh instead, you''re
    likely in a standard interactive shell that is a child of the login shell. Run
    a new bash instance from your login shell to see the difference:


    ```

    $ echo "$0"

    -bash

    $ bash

    $ echo "$0"

    bash

    $ exit

    ```


    The shell you started in was a login shell. The shell you created with the command
    bash was a child interactive shell, not a login shell.

    Login shells are normally interactive shells (although it''s quite rare). The
    distinction between login shells and interactive shells generally is for historical
    reasons around performance optimization. In the early days of Unix, when executing
    any commands could be time-consuming, the login shell would perform the most essential
    configuration only once, when a user logged in. Since all subsequent shells would
    inherit the login configuration, they could start more quickly and then load the
    user-specific configuration.


    # Loading the Shell Startup Files


    When a shell starts, the shell loads and executes commands from the /etc/profile
    file, the profile file containing essential, system-wide configuration. This file
    is often used to configure settings like the PATH environment variable, which
    can have different values depending on your operating system.


    The shell will attempt to read each of the following user-specific profile files
    in order:


    +   1. ~/.bash_profile

    2. ~/.bash_login

    3. ~/.profile


    If the shell finds a file that is readable, it executes that file''s commands
    and doesn''t attempt to read the others.'
  merge: -1
