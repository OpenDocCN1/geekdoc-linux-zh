  md: '# Table 19-1: Core Git Commands


    | Command | Description |

    | --- | --- |

    | git init | Creates a local repository |

    | git clone | Downloads a remote repository or creates a new copy of a local repository
    |

    | git add | Stages a change from the working tree to the index |

    | git reset | Unstages a change from the index |

    | git commit | Creates a new commit |

    | git checkout -b | Creates a new branch |

    | git merge | Merges a branch into the current branch |

    | git checkout | Moves the current HEAD to a new branch or commit |

    | git push | Pushes changes to an upstream branch |

    | git fetch | Retrieves information about changes to a remote |

    | git pull | Downloads and merges changes from a remote |


    For everything else, see the manual at https://git-scm.com/docs.


