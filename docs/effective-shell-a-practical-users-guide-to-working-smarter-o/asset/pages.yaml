  md: "As long the test commands return 0, indicating success, the loop will run the\
    \ conditional commands. After the conditional commands have run, the loop returns\
    \ to the beginning and evaluates the test commands again.\nThe following example\
    \ uses a while loop to generate a list of random numbers:\n\n```\n# Create an\
    \ empty array of random numbers.\nrandom_numbers=()\n# As long as the length of\
    \ the array is less than 5, continue to loop.\nwhile [ ${random_numbers[@]} -lt\
    \ 5 ]\ndo\n  # Get a random number; ask the user if they want to add it to the\
    \ array.\n  read -p \"Add random number to the list?\" (y/n): \" choice\n  # If\
    \ the user uses \"y\", add the random number to the array.\n  if [ \"$choice\"\
    \ = \"y\" ]; then random_numbers+=($random_number); fi\ndone\n# Show the contents\
    \ of the array.\necho \"Random Numbers: ${random_numbers[@]}\" \n```\n\nThis script\
    \ begins by initializing an empty array called random numbers. Inside the loop,\
    \ the script generates a random number using the shell's built-in RANDOM variable,\
    \ which produces a pseudorandom integer between 0 and 32767. The user is prompted\
    \ to decide whether to add this random number to the array by entering a y or\
    \ n response. If they enter y, the += operator adds the number to the array.\n\
    The loop continues until the array contains exactly five elements. At that point,\
    \ the loop terminates, and the echo command prints the values in the array:\n\n\
    Add 14718 to the list? (y/n): y\nAdd 2646 to the list? (y/n): n\nAdd 11988 to\
    \ the list? (y/n): y\nAdd 31506 to the list? (y/n): y\nAdd 32436 to the list?\
    \ (y/n): y\nAdd 6803 to the list? (y/n): n\nAdd 25811 to the list? (y/n): y\n\
    Random Numbers: 14718 11988 31506 32436 25811\n\nYou typically use a while loop\
    \ when you don't know how many iterations will be needed (as in this case, where\
    \ you don't know how many times the user will enter y), and you need to reevaluate\
    \ at each iteration whether you should continue to.\n\n# Looping Through the Lines\
    \ in a File\n\nYou can use a while loop to iterate through each line in a file,\
    \ without having to load the entire file into memory:"
