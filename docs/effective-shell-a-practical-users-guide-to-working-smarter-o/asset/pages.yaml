  md: '# 23


    # THE POWER OF

    TERMINAL EDITORS


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_374_0.png)


    A terminal editor is a text editor that runs in the shell, optimized for a keyboard
    rather than a mouse. It is sometimes the only option for working on remote machines
    or systems without a desktop environment. But even when you have a desktop-based
    editor available, running a terminal editor from the shell can be more efficient
    for many text manipulation tasks.


    Some of the most popular terminal editors are Vim, Emacs, and GNU nano. This chapter
    will focus on Vim, showing you a few features that will hopefully pique your interest
    in diving deeper into its capabilities.


    Many users find terminal editors initially hard to use, and some editors—including
    Vim—have a reputation for being highly complex. So let''s start by discussing
    why you''d want to use one at all.'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# Why Use a Terminal?


    Many technologists are familiar with desktop environment text editors, such as
    Visual Studio Code, Notepad++, and Sublime. Software engineers will likely be
    familiar with integrated development environments (IDEs) like Visual Studio and
    the JetBrains family of IDEs, which include dedicated environments for many languages,
    as as C# or Java.


    With a selection of powerful and user-friendly text-editing options available,
    why would you choose a terminal editor?


    There are many reasons, but perhaps the most compelling is that you won''t have
    a desktop environment available. If you''re working on a remote server with ssh
    as described in Chapter 22, there may not be a desktop environment running that
    can open a graphical tool. The easiest option for you to edit text, code, or scripts
    in such environment could be a terminal editor because the terminal is your main
    interface to the server. You also not have easy access to a desktop environment
    if you''re editing a file in a lightweight Linux environment such as a Docker
    container.


    Here are some other good reasons to become familiar with terminal editors:


    +   **Minimal flow disruptions** If you''re working in a shell already and need
    to edit text, being able to quickly do so without leaving the shell—and ideally
    without even having to touch the mouse—allows you to maintain your flow while
    you work.


    +   **Editing efficiency** Once you get over the initial learning curve, you can
    be incredibly efficient at editing text using editors such as Vim and Emacs. In
    particular it is designed to keep your fingers on the home row of the keyboard
    as much as possible so you can manipulate text very quickly.


    +   **Customization options** You can customize terminal editors to suit your
    working style and manage those customizations through dot files that you share
    across environments, as described in Chapter 17.


    +   **Extendability to graphical editors and other tools** If you learn to use
    Vim or Emacs and become adept at their idioms, you can install plug-ins in your
    graphical editors or IDEs that enable you to edit text with the same commands.
    There are even browser plug-ins that you navigate web pages with Vim-style movement
    commands. This lets you bring your efficiency with keyboard interfaces to modern
    desktop editors.


    In all, it''s extremely useful to get grips with at least the basics of terminal
    editors. You''ll be more efficient when working with remote machines and editing
    text from the shell, and you might even find that an editor like Vim replaces
    your other tools for many tasks.'
  merge: -1
  pgno: 375
- img_proc: true
  md: '# Getting Started with Vim


    Vim is an extremely popular editor that comes installed on most Linux distributions
    of the box. But its style of editing, called modal editing, can be a bit confusing
    at first. I''ve chosen Vim because of its reputation as the most complex terminal
    text editor. However, you''ll find that, with an hour or two of practice, it''s
    quite straightforward to use Vim for simple tasks. Just a little knowledge can
    make you more effective, and the more time you invest in learning, the more efficient
    you''ll become.


    KEYBOARD SHORTCUTS AND CASE SENSITIVITY IN VIM


    Vim relies heavily on case-sensitive keyboard shortcuts. To avoid confusion, this
    book uses the following shortcuts:


    Vim commands are also case sensitive. For example, the sequence 2w has a different
    meaning than the sequence 2W. Be sure to use the correct case when following the
    examples in this chapter.


    To open Vim, run the vi command:


    $ vi


    > VIM - ViIMproved

    version 8.2.4314

    by Bram Moolenaar et al.

    Modified by <bugzilla@redhat.com>

    Vim is open source and freely distributable


    Help poor children in Uganda!

    type for information

    type :help itcc<Enter>


    type :q<Enter> to exit

    type :help<Enter> or <F1> for on-line help

    type :help version8<Enter> for version info'
