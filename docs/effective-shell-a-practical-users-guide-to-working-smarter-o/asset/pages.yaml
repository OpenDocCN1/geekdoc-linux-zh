    # Making Shell Scripts Executable


    To make shell script executable, you must change its permissions with the chmod
    "change permissions" command:


    ```

    $ chmod +x "~/scripts/common.v1.sh

    ```


    The +x option tells chmod to add the executable permission to the script (under
    the hood, this changes the file mode, hence the name chmod).\Now you can simply
    enter its path into the shell and run it like any other command:


