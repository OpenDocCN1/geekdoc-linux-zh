  md: "To check if tmux is already installed on your machine, run this command:\n\n\
    ```\n$ tmux -V\ntmux 3.2a\n```\n\nIf it's not installed or you don't version 3\
    \ or higher, you'll need to install the latest version of tmux with the package\
    \ manager for your system. The package name on most distributions is just tmux.\
    \ For example, on a Debian-based distribution, you would install tmux with the\
    \ following command:\n\n```\n$ apt install -y tmux\n```\n\nOn a Mac you would\
    \ use:\n\n```\n$ brew install tmux\n```\n\nOnce you've installed tmux, run it\
    \ by entering the tmux command.\n\n# TMUX KEYBOARD SHORTCUTS\n\nLike Vim, tmux\
    \ relies heavily on case-sensitive keyboard shortcuts. For example, pressing CTRL\
    \ and b (lowercase) is different from pressing CTRL-SHIFT-B (uppercase).\n\nThis\
    \ uses the standard tmux documentation format for shortcuts, where the caret (^)\
    \ and prefix C are both equivalent to the CTRL key:\n\n+   * ^b or C-b CTRL with\
    \ lowercase b\n* ^B or C-B CTRL with uppercase B\n\nIn tmux, most commands start\
    \ with a sequence called the prefix (or leader) so that tmux's keyboard shortcuts\
    \ will not clash with the shortcuts of any programs it is running. By default,\
    \ the tmux prefix is ^b (CTRL-b).\n example, to send the command Z (an uppercase\
    \ Z), you would use the sequence ^b Z or C-b Z (making sure to press SHIFT when\
    \ entering the Z).\n\nIn this chapter, I'll consistently use the slightly more\
    \ concise format ^ to describe keyboard shortcuts and sequences. Remember, always\
    \ match the case shown in the examples.\n\nNow let's explore some of the things\
    \ you can do with the tmux program."
