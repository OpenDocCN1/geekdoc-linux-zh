  md: '# Specify Offset and Length


    The ${parameter:offset} expression tells the shell to expand only a subset of
    a parameter''s value. In this case, the shell will expand the value of a parameter
    but skip offset number characters from the beginning:


    ```

    $ echo My home folder name is: ${HOME:6}

    My home folder name is: dwmkerr

    ```


    Only my home folder name (dwmkerr) is displayed now, rather than the full path
    (/home/dwmkerr). You can also specify how many characters should be used by providing
    a length value in the expression ${parameter:offset:length} like so:


    ```

    $ error_message=file not found: did you enter the right path?

    $ echo "${error_message:0:14}"

    file found

    ```


    Now, the first 14 characters of the parameter error_message will be shown:

    The offset and length values can be used with arrays:

    "Sunday"


    ```

    $ days+=("Monday" "Tuesday" "Wednesday" "Thursday" "Friday" "Saturday" "Sunday")n$
    echo "${days[@]:2:3}"

    Wednesday Thursday

    ```


    However, using this technique with arrays, you must specify the array name followed
    by [@] to indicate that you want to work with all of the members of the array.
    Otherwise, the expression would use only the first element of the array.


