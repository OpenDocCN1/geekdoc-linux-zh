  md: '# Window Management with tmux


    We''ll begin looking at several techniques for working with windows in

    the multiplexer.


    # Creating and Moving Between Panes


    A split separates your current window into panes that can each their

    own program. You can create a vertical split by pressing ^b followed by the

    percent sign (%) or a horizontal split by pressing ^b followed by a double

    quote (\''"). Finally, to move between panes, press ^b followed by the appropri-

    tate row.


    # Zooming Panes


    You can zoom in on a pane so that it takes up the entire window by pressing

    ^b z. To zoom out of a pane, move ever to another pane (even if it''s hid-\den)
    or press ^b z again.


    # Creating and Moving Between Windows


    To run a program in an entirely new window, use the ^b c command to cre-

    ate a window. To switch windows, press ^b w to choose from the list of avail-

    able windows and sessions. This command is extremely useful if you have a

    lot windows to move between.


    Table 24-1 lists some other useful window management commands.


    | Command | Description |

    | --- | --- |

    | ^b n | Move to the next window. |

    | ^b p | Move to the previous window. |

    | ^b 0 | Select the window numbered 0 (the window numbers are shown on the bottom
    left next to the window name). |

    | ^b h | Close the current window. |

    | ^b , | Rename the current window. |

    | ^b w | Show the window navigator |


    > Remember that tmux is sensitive, check your caps lock key when entering these

    commands.


    The ^b , ("rename window") command is very useful if you have a lot of

    windows and want to give each one a descriptive name. As you''ll see in the

    next section, tmux will remember these settings even if you detach (that is,

    dconnect) from a session and later reattach to it.'
  merge: -1
  pgno: 398
