  md: '# Creating Template Files


    Another technique I''ve found useful again and again is to use sed''s text replacement
    capabilities to create a basic templating system. For this example, you''ll use
    the /effective-shell/templates/credentials.sh file, which contains a username
    and password:


    ```

    $ cd /effective-shell/templates

    $ cat credentials.sh

    USERNAME=admin

    PASSWORD=ThisIsVerySensitive!

    ```


    Say you don''t want to store the password in the file itself since it might be
    sensitive. You could define an easy-to-find pattern as a placeholder in the file,
    then replace it with sed.


    In the templates folder, you''ll also find a template version of the file, which
    includes a placeholder for the password text:


    ```

    $ cat credentials.template.sh

    USERNAME=%PASSWORD%

    PASSWORD=%PASSWORD%

    ```


    Apply the substitution as follows:


    ```

    $ sed -i ''s/%PASSWORD%/secret/'' credentials.template.sh

    USERNAME=admin

    PASSWORD=secret

    ```


    This command has searched for the pattern and replaced it with the provided value.
    Note that if you find yourself creating template files like this, you might find
    the envsubst ("substitute environment variables") command to explore.


    # Editing in Place


    The sed command includes an “in place” feature that allows you to directly change
    the file you pass it:


    ```

    $ sed -i ''.bak'' ''s/staging/production/'' test.txt

    ```


    This command performs the substitutions and puts them in a new file with a .bak
    extension. To overwrite the existing file, instead, do the following:


    ```

    $ sed -i ''s/staging/production/'' test.txt

    ```


    In this case, you''re not appending anything to the name of the written file;
    instead, you''re replacing the original file.'
  merge: -1
