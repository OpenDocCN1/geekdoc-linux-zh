  md: "# Error Handling\n\nIf a command in your function or elsewhere in your script\
    \ fails, the script will still continue to run, which can easily lead to issues.\
    \ Let's look at an example and then see how to avoid this kind of problem.\nAC\
    \ script called today.sh makes a new temporary folder for the current date and\
    \ puts a symlink to that folder in your home directory:\n\n```\n#!/usr/bin/env\
    \ sh\n# Get today's date in the format YYYY-MM-DD.\ntoday=$(date + \"%Y-%m-%d\"\
    )\n\n# Create a path to today's temp folder and then make the folder exists.\n\
    temp_path=\"/tmp/${today}\nmmkdir -p \"${temp_path}\"\n\n# Now make a symlink\
    \ to the folder in your homedir.\nln -sf \"${temp_path}\" \"${HOME}/today\"\n\n\
    # Write out the path you created.\necho \"${temp_path}\" \n```\n\nNow make the\
    \ script executable and then run it as follows:\n\n```\n$ chmod +x .today.sh\n\
    $ ./today.sh\n/tmp/2025-05-28\n```\n\nYou've successfully created a new folder\
    \ in /tmp with the current date as its name, created a symlink called today in\
    \ your home directory to point to that folder, and then printed out the folder's\
    \ path.\nLet's see what happens if one of the commands in the script fails. delete\
    \ both the symlink and the folder you created:\n\n```\n$ rm -rf ~/today\n$ /tmp/$(date\
    \ + \"%Y-%m-%d\")\n```\n\nNow use the touch command to create a file in the same\
    \ location where the today command will try to create this today folder:\n\n```\n\
    $ touch /tmp/$(date + \"%Y-%m-%d\")\n```\n\nIf you run the script now, you'll\
    \ see a problem:\n\n```\n$ ./today.sh\nmkdir :/tmp/2025-05-28: Not a directory\n\
    $ cd ~/today\nbash: cd: /home/dwkmerr/today: Not a directory\n```"
