  md: '# 7


    # ADVANCED TEXT

    MANIPULATION WITH SED


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_114_0.png)


    Chapter 6 introduced some simple commands for working with text. Now we''ll look
    at a more sophisticated and powerful command: sed. You can use sed to quickly
    solve problems and perform advanced manipulation of text, such as removing or
    replacing specific lines in a file. You''ll see several common ways to use it,
    work through some practical examples, and learn when you might want to consider
    tools like awk or a programming language instead.


    The sed ("stream editor") command, as briefly defined in Chapter 2, takes input
    from a text stream (which in many cases is simply a file or the output of another
    command), performs operations on the text, and then writes the output to stdout.
    It''s an extremely effective tool for making complex transformations. That said,
    operations with sed can look little intimidating at first, so we''ll start with
    the basics. You''ll soon see how valuable this tool can be.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Transformations with sed


    Rather than dissecting every nuance of sed, I''m going to show some realworld
    examples of how you can use the program. This approach not only allows you to
    use its functionality in easier-to-digest chunks but also keeps the exercises
    practical and relevant.


    # Replacing Text


    First, install this chapter''s samples to the ~/effective-shell folder:


    ```

    $ curl effective.sh | sh

    ```


    The effective-shell/scripts folder includes an example script called backup-config.sh
    that copies a set of many using configuration files for various cloud providers
    to a backup folder. To view it, run the following:


    ```

    $ cd ~/effective-shell/scripts

    $ cat backup-config.sh

    !/usr/bin/env bash

    ```


    ```

    # Make sure you have a backup directory.

    mkdir ~/backup

    ```


    ```

    # Copy over aliyun, aws, gcp, and ssh config and credentials.

    cp ~/aliyun/config.json ~/backup/settings/aliyun/

    cp ~/aws/config ~/backup/settings/aws/

    cp ~/credentials ~/backup/settings/aws/

    cp ~/azure/config ~/backup/settings/azure/

    cp ~/gcp/gcloud/credentials.db ~/backup/settings/gcloud/

    cp ~/ssh/config ~/backup/settings/ssh/

    cp ~/ssh/id_rsa ~/backup/settings/ssh/

    cp ~/ssh/id_rsa.pub ~/backup/settings/ssh/

    ```


    To change the backup folder (which is ~/backup), you could open the configuration
    file and edit each line, but that would be time-consuming and error-prone. Instead,
    you can use sed to change the name of the backup folder across the file. Note
    that in this example you''re not actually changing the file, just outputting to
    the console what the changes would look like.


    To change the path of the backup folder from settings to configuration, run the
    following command:


    ```

    $ sed ''s/settings/configuration/'' ~/backup-config.sh

    !/usr/bin/env bash

    ```


    ```

    # Copy over aliyun, aws, gcp, and ssh config and credentials.

    cp ~/aliyun/config.json ~/backup/configuration/aliyun/

    cp ~/aws/config ~/backup/configuration/aws/

    cp ~/credentials ~/backup/configuration/aws/

    cp ~/azure/config ~/backup/configuration/azure/

    ```'
  merge: -1
  pgno: 115
- img_proc: true
  md: 'cp "/.config/gcloud/credentials.db" /backup/configuration/gcloud/

    cp "/.ssh/config" /backup/configuration/ssh/

    cp "/.ssh/id_rsa" /backup/configuration/ssh/

    cp "/.ssh/id_rsa.pub" ~/backup/configuration/ssh/


    This example shows the basics of how sed works. You give sed an expression, which
    describes a set of operations you to perform, and it applies that expression to
    the file you specify. With most commands we''ve covered, we can apply the expression
    to input from sdin or from a specific file.

    Let''s look at the expression s/settings/configuration/ in detail:


    +   - Indicates that you want to run the substitute function, which replaces text

    - Denotes the start of the term or pattern you are searching for

    - settings Represents the pattern itself, in which this case is just the literal
    text settings

    - Denotes the start of the text to replace with the pattern configuration Indicates
    the text to replace the search pattern with

    - Denotes the end of the replacement (note that you can also add flags after this
    slash; we''ll look at some flags shortly)


    You can provide a regular expression (described in detail in Chapter 4) as the
    search pattern. By default, sed uses basic regular expressions. To use extended
    regex, add the -E ("use extended regular expressions") flag as follows:


    ```

    sed -E ''s/settings/configuration/'' backup-config config.sh

    ```


    For an overview of the differences between basic and extended regexes, run man
    re_pattern to access the man pages describing them.


    # Applying Multiple Expressions


    You can use the -e ("expression") parameter to supply multiple expressions to
    sed. For example, to delete your backup folders, you could run two substitutions
    as:


    +   - Replace the cp command with the rdir command.

    - Remove the first parameter, the source file for cp, since rdir doesn''t need
    it. With this expression, you''re removing everything up to the second tilde (~).


    > If you use rm -r instead of rdir, which is very common, you run the risk of
    making a big mistake: passing the source file for the cp as the first parameter
    to remove. In other words, rm -r would delete both the source files for the backup
    and the backup folder itself! This is one place where using rdir over rm makes
    more sense; it won''t delete the source files if you make a mistake.'
