  md: "36 - hello\n37 - hello\n\nHere's what you get when you write the rainbow output\
    \ to a file:\n\n$ rainbow hello >> text.txt\n$ cat -v text.txt\n\n+   31 - ^[0;32mhello\"\
    [Om\n32 - ^[0;32mhello\"[Om\n33 - ^[0;33mhello\"[Om\n34 - ^[0;34mhello\"[Om\n\
    35 - ^[0;35mhello\"[Om\n36 - ^[0;36mhello\"[Om\n37 - ^[0;37mhello\"[Om\n\nThe\
    \ -v parameter tells cat to make escape characters visible. If you open the file\
    \ in a text editor, you will see the escape characters there.\nThe problem with\
    \ the rainbow function is that it adds the color escape sequences when you're\
    \ writing the results to a file. In most cases, this is not going to be what you\
    \ want. Commands like ls do not include color codes when writing their output\
    \ to a file.\n\nThere is no foolproof way to avoid this issue, but the most common\
    \ approach is to check the output is going to a terminal device with the -t expression\
    \ of the test | command (as Chapter 11 explained, expression ) and test expression\
    \ are equivalent:\n\n```\nif [ -t 1 ]; then\n    echo \"We are writing to a terminal\"\
    \nelse\n    echo \"We are not writing to a terminal\"\n```\n\nThe -t test returns\
    \ success if the provided file descriptor is associated with a terminal. The 1\
    \ in this example is the file descriptor for the stdout stream (if this is unfamiliar,\
    \ refer to Chapter 2).\nYou could use this in the rainbow function as follows:\n\
    \n```\nrainbow () {\n    local message=\"$1\"\n    local reset='[e0m'\n    for\
    \ ((color=31; color<=37; color++))\n    do\n        color_code=\"\\[e0;${color}m\"\
    \n        if [ -t 1 ]; then\n            printf \"${color} - ${color_code}${message}${reset}\\\
    n\"\n        else\n            printf \"${color} - ${message}\\n\"\n        fi\n\
    \    done\n}\n```"
