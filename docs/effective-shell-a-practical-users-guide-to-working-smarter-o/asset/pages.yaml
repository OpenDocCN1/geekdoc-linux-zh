- img_proc: true
  md: 'Let''s break down these steps to see what each one does in detail.


    # Replacing Text on Specific Lines


    You''ll start with the first expression, changing cp to rmdir:


    ```

    $ sed -e ''s/cp/rmdir/'' backup-config.sh

    !/usr/bin/env bash

    ```


    # Make sure you have a backup directory.

    mkdir ~/backup


    # Copy over alicloud, aws, azure, grmdir, and ssh config and credentials.

    rmdir "~/aliyun/config.json" ~/backup/settings/aliyun/

    rmdir "~/aws/config" ~/backup/settings/aws/

    rmdir "~/azure/credentials" ~/backup/settings/aws/

    rmdir "~/azure/config" ~/backup/settings/azure/

    rmdir "~/config/gcloud/credentials.db" ~/backup/settings/gcloud/

    rmdir "~/ssh/config" ~/backup/settings/ssh/

    rmdir "~/ssh/id_rsa" ~/backup/settings/ssh/

    rmdir "~/ssh/id_rsa.pub" ~/backup/settings/ssh/


    Here you''ve provided a expression with the -e parameter. In this case, the -e
    parameter is superfluous because you have only one expression, but you''ll be
    adding the second expression shortly.


    This code has changed all the cp commands to rmdir. But did you notice the bug?
    It also has changed the letters cp in the comment from this


    # Copy over alicloud, aws, azure, gcp, and ssh config and credentials.


    to this (bold for emphasis)


    # Copy over alicloud, aws, azure, grmdir, and ssh config


    It isn''t the worst bug in the world, but you can avoid it by changing the expression
    to run only on lines that start with the letters cp like so:


    ```

    $ sed -e ''s/cp/rmdir/'' backup-config.sh

    !/usr/bin/env bash

    ```


    # Make sure you have a backup directory.

    mkdir ~/backup


    # Copy over alicloud, aws, azure, gcp, and ssh config and credentials.

    rmdir "~/aliyun/config.json" ~/backup/settings/aliyun/

    rmdir "~/aws/config" ~/backup/settings/aws/

    rmdir "~/azure/credentials" ~/backup/settings/aws/

    rmdir "~/azure/config" ~/backup/settings/azure/

    rmdir "~/config/gcloud/credentials.db" ~/backup/settings/gcloud/

    rmdir "~/ssh/config" ~/backup/settings/ssh/

    rmdir "~/ssh/id_rsa" ~/backup/settings/ssh/

    rmdir "~/ssh/id_rsa.pub" ~/backup/settings/ssh/'
