    Notice that select runs just like an infinite loop: after the shell executes the
    statements in the shell body, it prompts for a selection again. The user can tell
    they''re done sending input by pressing CTRL-D, which is the ASCII EOT ("end of
    transmission") character, or CTRL-C to quit.

    You normally see select used with a case statement to process the selection.


    # Running Commands in Subshells


    You can run commands in subshells to avoid inadvertently changing the state of
    your current script. One application for this nice little trick is to change the
    current directory for a specific command without affecting the current directory
    for the shell:


    ```

    mkdir -p ~/new-project; cd ~/new-project; touch README.md

    ```


    The parentheses indicate that these commands are run in a subshell. As a result,
    the directory is changed only in the subshell, not in the current shell, which
    means you don''t need to change back to the previous directory after the commands
    have completed.

    This sequence of commands creates a new folder (mkdir -p ensures the command won''t
    fail if the folder exists), changes to that folder, and creates a new file called
    README.md. The current folder for the shell remains unchanged.


    # Anti-patterns


    Anti-patterns are common practices that should be avoided. This section describes
    a few you might encounter in the wild and why they''re problematic.'
