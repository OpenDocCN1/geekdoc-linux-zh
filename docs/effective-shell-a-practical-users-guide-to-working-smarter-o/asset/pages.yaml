- img_proc: true
  md: 'The permissions are -rw-r--, which translates to the following:


    -rw Read and write for the owner, which is the dwmkererr


    -r- Read to the group owner belongs to, which is the dwmkererr


    --- Read to all users


    This is not ideal: other users on the system would be allowed to open the file,
    and members of the same group would be allowed to read the file as well. There
    is a quick fix for this, fortunately. Set the permissions to read and write for
    your owner only:


    ```

    $ chmod 400 my-key.pem

    $ ls -al

    ------- 1 dwmkererr dwmkererr 1103 Apr 19 12:02 my-key.pem

    ```


    This chmod ("change file permissions") command sets the permissions to 400, which
    means read and write for the current user. Once you make this change, you''ll
    be able to use ssh to connect to the server without complaining about the permissions
    on your key.


    # Configuring SSH Hosts


    It can be difficult to remember details about your virtual machines, such as the
    hostname, key location, and username. To make it easier and quicker to connect,
    you can create an entry in your SSH config file to store this information. This
    is a dot file, a user-specific configuration file just like the ones discussed
    in Chapter 17, and is typically located at ~/.ssh/config.


    To create an entry for your virtual machine, I would add the following to my ~/.ssh/config
    file:


    ```

    Host effective-shell-aws-linux

    HostName ec2-13-213-71.ap-southeast-1.compute.amazonaws.com

    User ec2-user

    IdentityFile "~/.ssh/effective-shell.pem"

    ```


    The first part of this configuration is the host alias—that is, you''ll refer
    to the host when you want to connect to. Use a short but descriptive name for
    maximum convenience (effective-shell-aws-linux, in case). After the alias is a
    group of settings, each indented by a tab or two spaces (the indentation is not
    required but can help make the file more readable):


    ```

    Host The full address of the host

    User The name of the user to connect as

    IdentityFile The path to the private key file to connect

    ```


    Now if I want to connect to the virtual machine, I can simply run the following
    command:


    ```

    ssh effective-shell-aws-linux

    ```'
