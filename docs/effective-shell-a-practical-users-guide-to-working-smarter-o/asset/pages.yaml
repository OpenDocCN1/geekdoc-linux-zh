- img_proc: true
  md: '# When to Avoid Shell Scripting


    Shell scripts often can''t be beat as a quick way to solve a simple problem. When
    you add in the handy tools that you''ve seen across this book, such as for advanced
    text manipulation, they can be even more powerful. There are some scenarios where
    you might want to avoid using a shell script:


    +   - If the problem you''re solving requires complex logic that would be handled
    by a full programming language

    - If a program needs to be used or maintained by others who may not be familiar
    with shell scripting

    - If you need portability across different systems, since complex scripts may
    rely on tools that aren''t available anywhere


    Shell scripts are occasionally the only sensible tool to use. For example, if
    you wanted to show the shell''s scripts and let the user toggle them on and off,
    a shell script would be ideal. In that scenario, a script written in Python or
    another programming language would be needlessly complex since it wouldn''t have
    direct access to the shell environment.

    But in general, as soon as a shell script gets longer than a page of code, you''re
    at a good point to consider using an alternative tool.


    # Choosing a Programming Language


    There are hundreds of programming languages that can help you solve technical
    problems. But, as mentioned, not all of them are ideal natives to a shell script.
    Before proceeding with a programming language, ask yourself the following questions:


    +   - Is the language designed for handling the kind of problem I want to solve?
    Does it support console-based input and output? Is it easy to use shell-style
    tools in this language?

    - Is the language simple and popular? Can others understand or adapt the script
    without too much intervention?

    - Is the programming language going to be available on almost any machine? Simple
    shell scripts run almost anywhere without the need for other tools. Will the language
    offer this functionality?


    Based on the answers, some candidates jump to mind as alternatives for shell scripts:


    **Python** The Python language is installed by default on almost every Linux system,
    highly popular, and simple to use and read. It works well for input-process-output
    programs.


    **Node.js** While Node.js is a runtime environment and not a language itself,
    it can use the popular JavaScript language and is event-driven, meaning it can
    be very fast. But the version installed across systems varies considerably, and
    this can cause headaches for script sharing.'
  merge: -1
  pgno: 345
- img_proc: true
  md: 'Ruby Also installed on many systems by default, Ruby is a simple language that
    is highly popular but perhaps less well known than Python.


    Go is a widely used language with simple syntax and concurrency. Its self-contained
    binaries run uniformly across platforms, making it a robust alternative for command
    line tools unless its toolchain is installed.


    The C language is great for working with low-level system libraries, and most
    platforms have a C installed. But it requires compilation, may behave quite differently
    on different systems, and is fairly complex for others to use.


    Perl installed almost universally on any system, Perl is a very powerful language.
    It is not as popular as it used to be, however, so it''s less likely to be understood
    by other users.


    Now


    But since in this chapter we''re looking at alternatives for writing simple tools
    that work well in the shell


    # Characteristics of Shell-Friendly Tools


    When you''re writing a tool for the shell, following the conventions set by other
    tools will make your tool more intuitive for others to use. It will also allow
    users to combine your tool with other tools (for example, with piping) to build
    more complex workflows.


    The following capabilities make for a shell-friendly tool:


    +   Reading from standard input this allows you to pipe inputs from other tools
    into your programs (Chapter 2 for more pipelines). You also want to be able to
    read and process line by line in case the input is very large.


    +   Writing to standard output this sounds obvious, but it means sure that your
    output can be read by a human operator and (ideally) processed by other tools,
    such as cut, sed, and rev. It also means thinking about how color or will not
    be used in output and avoiding superfluous output (such as titles and version
    numbers) that makes processing more difficult.'
  merge: -1
  pgno: 346
- img_proc: true
  md: 'Specifying options using sensibly defined flags There are many conventions
    for flags and parameters, and adhering to them (rather than inventing your own)
    will make your tool easier to use. For example, the -h flag is commonly used to
    show. For a detailed description of how options should be specified for GNU tools,
    see http://www.gnu.org/prep/standards/html_node/Option-Table.html#Option-Table.


    Running on different systems Shell users are being able to use tools like grep
    and sed in a similar way across platforms. A well-written tool should provide
    the same kind of cross-platform portability.


    Handling errors by using idioms Shell-friendly tools use as a status code to indicate
    success and define error codes in their documentation that users know how to handle
    exceptional circumstances; your tool should do the same.


    Other conventions and practices may apply, but these are some of the fundamentals.


    # Writing a Dictionary Lookup Tool in Python


    To practice a shell-friendly tool, you''re going to create a simple program that
    reads a word and shows its definition, using the Free Dictionary API (https://dictionaryapi.dev).


    This is a good example of a tool that would be overly to write with a shell script.
    You need to handle input, parse and process it HTTP requests to download pages
    from the internet, parse and process these requests, format the output, and provide
    some options for the user to control how the output looks. A highly experienced
    shell programmer could likely create this tool with a script without breaking
    a sweat, but it would be much harder for a less experienced scripter. In contrast,
    Python is easy to write and read, has a wealth of online learning resources, and
    is available on almost any platform.


    The requirements for the tool are as follows:


    +   1. Allow the user to provide a set of words from a text file or standard input.

    2. Look up the definitions of those words.

    3. Write the words and their definitions to standard output, giving the user option
    to format how this output looks.

    4. Offer help to the user on how to use the tool.


    You''ll stick to "raw" Python, using only the standard library so that users won''t
    have to install any packages to make this tool work.'
  merge: -1
