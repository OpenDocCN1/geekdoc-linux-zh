    # Show All Shortcuts


    The bindkey command returns a list of all keyboard shortcuts:


    +   "^@" set-mark-command

    "^A" beginning-of-line

    "^B" backward-char

    "^D" delete-char-or-list

    "^E" end-of-line

    "^F" forward-char

    "^G" send-break

    "^H" backward-delete-char

    "^I" expand-or-complete

    "^J" accept-line

    "^K" kill-line

    "^L" clear-screen


    This is an extremely useful command if you forget a specific keyboard shortcut
    or if you just want to see the shortcuts available to you. If bindkey does not
    work for you, try using the alternative bind -p.


    # Transpose Text


    Transposing text means swapping it with some other text. Using the ALT-T shortcut
    transposes the two words before the cursor:


    ```

    $ cp destination source

    $ cp source destination

    ```


    Using the CTRL-T shortcut will transpose the two letters before the cursor.'
