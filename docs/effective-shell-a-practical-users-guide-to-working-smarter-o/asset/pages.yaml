  md: '# Replacing Text


    Next is up the tr ("translate characters") command, which you saw in Chapter 2.
    This program is very simple, and I use it most often to perform a simple substitution
    of characters.


    To see how tr works, you can create a list of each of the column names in the
    Rotten Tomatoes CSV file like so:


    ```

    $ head -n 1 ~/effective-shell/data/top100.csv | tr '' ,\'' ''\n''\n"Rank"

    "Rating"

    "Title"

    "Reviews"

    ```


    The head -n 1 command extracts the first line of the file: the column names. The
    results are then piped to the tr command, which replaces the first specified character,
    a comma (,), with the second, a newline (\n). In the output, the column titles
    are never separated by line breaks instead of


    Now say you want to remove the quotes from the column names:


    ```

    $ head -n 1 ~/effective-shell/data/top100.csv | tr '' '' ''\n'' | tr -d ''"

    Rank

    Rating

    Title

    Reviews

    ```


    Here the tr command, along with the -d ("delete") flag, removes the specified
    character (quotation marks, in this example) from each column name. Again, you
    are piping commands together. (For more pipelines, Chapter 2.) You will see this
    technique—chaining together lots of simple commands in a pipeline to perform more
    complex operations—and again throughout the book.


    Remember that the tr command works on characters. For example, the following command
    might not work as you expect:


    ```

    $ echo "Welcome to the shell" | tr ''shell'' ''machine''

    Wicomc to tac macii

    ```


    The reason for this output is that you are specifying character replacements,
    so shell interprets this command as follows:


    ```

    $ -> m

    h -> a

    e -> c

    l -> h

    l -> i

    ```


    In other words, it thinks you want to replace the first letter of shell with the
    first letter in machine, the second letter of shell with the second letter of
    machine, and so on.'
