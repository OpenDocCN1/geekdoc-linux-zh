  md: 'Here’s the output of this script:


    The expression for day in "$days" uses shell parameter expansion to expand the
    days parameter. Because $days appears in quotes, the shell pre-serves the spaces
    between the days instead of applying word splitting. When it loops through the
    days parameter, it sees only one value: the original line of text, including the
    spaces.


    This version of the script *not* surround $days in quotes:


    ```

    days="Monday Tuesday Wednesday Thursday Friday Sunday"

    for day in $days

    doe echo "${day}"

    done

    ```


    Its output is as follows:


    Monday

    Tuesday

    Wednesday

    Thursday

    Friday

    Saturday

    Sunday


    In this case, word splitting has occurred. The shell is performing the following
    operations:


    +   1. It searches through each character in the input.

    2. Every time it encounters the separator character set in the IFS ("inter-tional
    field separator") special variable, it splits the word.

    3. If there are multiple instances of a separator character, it uses the first
    and skips all of the additional characters.


    Word splitting and the IFS variable are discussed in Chapter 12, but let’s see
    them in action by breaking down exactly what the shell is doing in this example.


    By default, the IFS variable is set to <space><newline>, meaning those are the
    characters the shell will use to split an expression into words. When there are
    multiple instances of these characters in a row (such as the five spaces after
    the Wednesday value), the shell treats them as a single delimiter and applies
    the splitting accordingly.'
