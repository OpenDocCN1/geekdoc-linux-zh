  md: 'Running git remote with the -v ("verbose") parameter will show each remote,
    along with the address used when you push changes and when you fetch changes (we''ll
    look at next).


    Earlier, you used this command to push your changes:


    # $ git push -u origin main


    -u ("set upstream") option tells Git that you want to associate your local main
    branch with the remote main branch. This way, you don''t need to specify the remote
    name for each subsequent git push command: Git knows to push changes to the upstream
    branch called main in the origin remote.


    # Fetching Changes


    The git fetch ("get remote changes") command downloads all of the changes that
    have been made to the remote. It does not, however, change your local branch or
    working copy. It means that Git is aware of the most recent changes to the remote.
    To see what I, run the command:


    # $ git fetch


    There won''t be any output, because the remote hasn''t changed. Now you''ll make
    a change to the remote to see how git fetch works. Open the repository in the
    GitHub website. You should see a message suggesting that you add a README file,
    as in Figure 19-5.


