    \ -C \"${tmp_dir}\"\n\nThis script sets a trap to clean up a temporary folder\
    \ when a script exits or is interrupted. It begins by defining a function called\
    \ cleanup and then uses the trap command to ensure cleanup will be called if the\
    \ INT or TERM signal is sent, or the script exits.\n\nUsing trap can be very useful\
    \ in scripts that take a while to execute. For example, this script downloads\
    \ the effective-shell samples from the internet, if the user is having connectivity\
    \ issues, they may end canceling the script because the download is taking too\
