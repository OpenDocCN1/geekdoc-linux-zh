- img_proc: true
  md: '# Removing Parts of a Line


    The next step is to remove the first parameter (the source file) that you used
    for the original cp command because you don''t want rdir to delete the source
    file, only the destination folder (the second parameter). Essentially, you want
    to change the structure of the line from cp <file to backup up <backup folder>
    <backup folder>. To do so, apply a new expression:


    ```

    $ sed -e ''^cp/s/rmdir/s/[^ ]'' -e ''~/rmdir/s/[^ ] +'' backup-config.sh

    !/usr/bin/env bash

    ```


    # Make sure you have a backup directory.

    mdir ~/backup


    # Copy over alicl, aws, azure, gcp, and ssh config and credentials.

    rmdir ~/backup/settings/aliyun/

    rmdir ~/backup/settings/aws/

    rmdir ~/backup/settings/aws/

    rmdir ~/backup/settings/azure/

    rmdir ~/backup/settings/gcloud/

    rmdir ~/backup/settings/ssh/

    rmdir ~/backup/settings/ssh/

    rmdir ~/backup/settings/ssh/


    Here''s the breakdown of the /^rmdir/s/[^ ] + // expression:


    +   /^rmdir Use an address that matches lines starting with rmd.

    /s Use the substitution function to replace text.

    -/[^ ] Search for the tilde and any sequence of one or more non-space characters
    up until the first space character.

    -/ Replace with no content.

    -/ End endpoint.


    In this example, you don''t include a replacement. The replacement part of the
    expression is empty, as indicated by the two forward slashes with nothing between
    the end of the expression. This command means you search for a tilde, match everything
    until the next space, and replace it with nothing—in other words, remove it!


    Note the -E flag to tell sed to use extended regexes. This way, you can use the
    plus (+) without escaping it with a backslash (\) first. In general, I recommend
    always using extended expressions; they are more commonly used and will be more
    familiar than basic regex, especially if you work with programming languages as
    well as the shell (most programming languages support regex use extended regex).


    Let''s look at a few other ways to use sed for some common tasks.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# Stripping Comments


    The script you''ve used so far includes comments (the text that follows the hash
    mark). To remove comments, as well as any whitespace that precedes it, use sed
    as follows:


    ```

    $ sed -E ''s/##.**/'' backup-config.sh

    mkdir /backup

    cp ~/aliyun/config-json /backup/settings/aliyun/

    cp ~/.aws/config /backup/settings/aws/

    cp ~/.aws/credentials /backup/settings/aws/

    cp ~/.azure/config /backup/settings/azure/

    cp ~/.config/credentials.db /backup/settings/gcloud/

    cp ~/.gcloud/credentials.db /backup/settings/gcloud/

    cp ~/.ssh/config /backup/settings/ssh/

    cp ~/.ssh/id_rsa /backup/settings/ssh/

    cp ~/.ssh/id_rsa.pub /backup/settings/ssh/

    ```


    This command removes the comments at the beginning of the file, as well as the
    comment after the cp ~/.ssh/id_rsa line. The regex matches any hash mark and strips
    everything following it as well as the whitespace before it.


    To delete lines that contain comments and are now empty, use the d function


    ```

    $ sed -e ''s/#\.*//'' -e ''/^\s*$/'' backup-config.sh

    mkdir /backup

    cp ~/aliyun/config-json /backup/settings/aliyun/

    cp ~/.aws/config /backup/settings/aws/

    cp ~/.aws/credentials /backup/settings/aws/

    cp ~/.azure/config /backup/settings/azure/

    cp ~/.config/credentials.db /backup/settings/gcloud/

    cp ~/.ssh/config /backup/settings/ssh/

    cp ~/.ssh/id_rsa /backup/settings/ssh/

    cp ~/.ssh/id_rsa.pub /backup/settings/ssh/

    ```


    This function is applied to all lines matching the line pattern, which in this
    case is a regular expression (^ *$) that matches any line made up of space characters,
    including zero space characters (that is, empty lines).


    # Appending Text


    In a regular expression, the dollar sign ($) represents the end of a line. If
    you want to add content to the end of lines, simply search for $ and replace it
    with whatever you want to end the line with. For example, simply enter sed s/$/;.
    To do that on certain lines, use a line pattern to limit where to apply the expression.


    You could use this technique to make sure the script doesn''t fail if one of the
    cp commands fails by adding || true at the end of the command (you''ll understand
    why this works after running the example).'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'The following command strips comments, deletes empty lines, and adds the text
    | to the end of each line:


    ```

    $ sed -E -e ''s/#.*$//'' -e ''^*/$d'' -e ''^cp/s$/'' || true/'' backup-config.sh

    #/usr/bin/env bash

    ```


    ### Make sure you have a backup directory.

    mdir ~/backup


    If a cp command fails, the shell sees || true, which tells it to "pass this step
    whether or not the command fails." This little trick ensures that the entire script
    won''t fail if one of the cp commands fails.(You''ll see more of it in Chapter
    11)


    # Prepending Text


    In a regular expression, the caret (^) represents the start of a line. You can
    apply the same trick with the dollar sign ($) to add two more marks to the start
    of any comment line (that is, any line beginning with a hash mark):


    ```

    $ sed -E -e ''s/^$/## /'' backup-config.sh

    ###!/usr/bin/env bash

    ```


    ### Make sure you have a backup directory.

    mdir ~/backup


    ### Copy over aliyun, aws, azure, gcp, and ssh config and credentials.

    cp ~/aliyun/config-json ~/backup/settings/aliyun/

    cp ~/aws/config ~/backup/settings/aws/

    cp ~/credentials ~/backup/settings/aws/

    cp ~/azure/config ~/backup/settings/azure/

    cp ~/config/gcloud/credentials.db ~/backup/settings/gcloud/

    cp ~/ssh/config ~/backup/settings/ssh/

    cp ~/ssh/id_rsa ~/backup/settings/ssh/

    cp ~/ssh/id_rsa.pub ~/backup/settings/ssh/


    Now you''ll use echo to write the cp command to the screen. Replace the start
    of any line with an echo and the end of the line with a quote,

    like so:


    ```

    $ sed -E -e ''s/^$/"echo ""'' -e ''s/$/"echo"'' backup-config.sh

    #!/usr/bin/env bash

    ```'
