    \ - version 1.2\n\nAs this script shows, functions can work with variables in\
    \ multiple ways: they can define new variables, use the variables available in\
    \ the shell, and overwrite values.\n\n# Variable Scoping\n\nIn the preceding script,\
    \ the shell was able to read the value of the title_message variable even though\
