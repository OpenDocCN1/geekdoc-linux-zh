    Figure 18-12: A detached HEAD in the current Git log


    The warning that you''re in a "detached HEAD state" sounds more sinister than
    it! It''s telling you that your current position in the history is not the "tip"
    of a branch, so you won''t be able to make a new commit without starting a new
    branch first.


    To move back to the top of the branch, use git checkout branch:


    $ git checkout main


    Now you''re back at the tip of your main branch.

    Git has a very convenient syntax you can use to move backward. Specify a branch
    name, SHA, or HEAD, and then use a tilde (~), followed by the number of commits
    you want to move backward:


    $ git checkout HEAD~1


    This command moves the HEAD backward one commit. This is useful if you realize
    you''ve made a mistake in a recent commit and need to go backward to fix it.

    Remember, running git checkout branch moves the HEAD to the tip of the branch
    by default.


