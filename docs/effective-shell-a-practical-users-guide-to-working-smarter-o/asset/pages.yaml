    In this example, the shell used to execute script will depend on your system configuration.
    For example, bash will run the script in a new bash instance, whereas the Z shell
    typically runs scripts in sh (which may be linked to another shell on your system).

    Fortunately, there''s a way to avoid this type of ambiguity and explicitly state
    what program should run your script.'
