- img_proc: true
  md: 'You can write a shell function that reads the git push command, reads its output,
    and, if it finds a web address, opens it in a browser. In fact, the dotfiles repository
    at https://github.com/effective-shell/dots does exactly this—just run the command
    grpr to open a pull request!


    The grpr function is actually quite straightforward, as you can see in the following
    code (note that some of the comments and syntax formatting have been removed for
    legibility):


    ```

    grpr() {

    # Get the current branch name, or use HEAD if you cannot get it.

    branch=$(git symbolic-ref -q HEAD)

    branch=${branch#refs/heads/}

    branch=${branch#-HEAD}


    # Pushing takes a while, so let the user know you''re working.

    printf "Opening pull request for ${branch}...""


    # Push to origin, grabbing the output but then echoing it back.

    push_output=$(git push origin -u ${branch} 2>&1

    printf "\n${push_output}"


    # If there''s anything that starts with http, it''s a good guess it''ll be a

    # link to GitHub/GitLab/Whatever. So open the first link.

    link=$(echo "$push_output" | grep -o ''http.*'' | head -n1 | sed -e ''s/[[:space:]]*//'')

    if [ -n $link ]; then

    printf "\nOpening:${GREEN}${link}(RESET)..."

    python3 -m webbrowser $link

    fi

    ```


    This snippet gets the name of the current branch, or HEAD if you can''t work the
    name out. (Technically, it gets the reference for HEAD or exits with a nonzero
    status and no output if HEAD refers to a detached state); the two commands that
    follow in the script clean up this output.) It runs the git push origin command
    and records the output of the command into a variable push_output.


    Once the push command has completed, this function writes its output to the screen,
    use grep and search for the first hyperlink, and then opens the link in a browser
    with Python.


    > NOTE Another option worth exploring if you use GitHub regularly is GitHub CLI,
    called gh, which allows you to open a pull request directly in GitHub. The program
    offers many other ways to work with GitHub from the command line. You can find
    GitHub CLI at https://cli.github.com.


    I use the grpr function many times every day, and it has a real time-saver.'
