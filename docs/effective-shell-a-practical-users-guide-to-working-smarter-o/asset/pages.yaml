  md: '# INTRODUCTION


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_24_0.png)


    I''ve been lucky enough to spend many years working as a software engineer, and
    I''ve worked with data scientists, data engineers, site reliability engineers,
    and technologists of all sorts. One trait that stands out in great technologists
    is their ability to make their tools work for them by stitching the tools together
    in creative ways to suit their unique styles and needs. This book will help you
    do just that by using the shell.


    This isn''t a book on shell scripting or Linux administration. Each chapter presents
    a set of techniques to help you work more efficiently, understand your system
    in more depth, and craft your environment to suit your individual workflow. This
    book doesn''t ask you to totally change the way you work or drop your current
    tooling. Instead, it brings together a set of skills that you can add to your
    toolkit and incorporate as you like. But before you can do that, understand what
    exactly the shell is and why you might want to use it.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# # What Is the Shell?


    The shell is the simple, text-based interface used to control a computer or a
    program. In Windows, it looks like this:


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_25_0.png)


    Here''s what it looks like on a Mac:


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_25_1.png)


    And here''s what it looks like on Fedora, a popular Linux distribution (this book
    focuses on the Linux shell):


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_25_2.png)


    There are several reasons why you might want to use the shell instead of a graphical
    user interface (GUI), the visual point-and-click interface you''re probably using
    now:


    +   - Using the shell can help you learn more about your computer''s interfaces.
    This can be really helpful if you are a technology professional or if you simply
    want to better understand how your computer works.


    +   - There are some scenarios where you *have* to use a shell. Not every program
    or system can be operated with a GUI.


    +   - Often, it''s more efficient to use the shell. Some operations that are time-consuming
    or repetitive to perform using the GUI are much faster to perform in a shell.
    You can also write *shell scripts* to automate operations.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '+   The simplicity of the shell''s text-based interface makes it a distraction-free
    environment to work in.


    Investing a few hours in learning to use the shell for your computer can have
    an enormous impact on your productivity. It can also make your work more fun,
    allowing you to maintain a state of creative flow and work more effectively.


    # Who Should Read This Book


    This book''s primary audience will be readers who have some basic knowledge and
    familiarity with the command line on a Windows, macOS, or Linux system. If you''re
    totally new to the shell environment, be sure to start with the book''s appendices
    before you dive into Chapter 1. There, you''ll learn fundamentals such as setting
    up the shell on your system and navigating the files and folders for your machine.
    Afterward, you should be better equipped to follow along with the book and get
    the most out of its examples.


    Developers, data scientists, and engineers should find almost every chapter of
    this book immediately applicable in their day-to-day work. Whether you use Python,
    Golang, JavaScript .NET, Java, or another language, an integrated development
    environment (IDE) or the skills that you''ll learn here will improve your ability
    to quickly solve problems by using a simple, adaptive, and general-purpose toolkit.


    Site reliability engineers, system administrators, and DevSecOps professionals
    will also find essential tips and tricks. If you regularly administer remote machines,
    connect to containers, or manage clusters or cloud environments, you''ll find
    many techniques to help you work more efficiently.


    # What''s in This Book?


    Each chapter presents a stand-alone set of techniques that you should be able
    to apply immediately. I have focused on keeping the information to the essentials
    that enable you to use the skill rather than giving an exhaustive description
    of every possible feature. This would allow you to pick up the book, read a chapter
    over coffee, and try out the shells straightway. Depending on your familiarity
    with comfort in the shell, you can generally skip to chapters that you''re interested
    in rather than reading the book in order. The exception is Part III of the book,
    where you''ll progressively build and enhance a shell script as you pick up new
    techniques in each chapter. Numerous cross-references throughout the book will
    point you in the right direction if you get stuck or need a refresher on a topic.


    **Part I, Core Skills**, introduces essential concepts and techniques that you''ll
    use again and again in your everyday work.


    **Chapter 1: Flying on the Command Line** This chapter introduces keyboard shortcuts
    and commands for entering and manipulating text on'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'the command line quickly and easily. You''ll learn navigation techniques moving
    forward and backward through a line or word, as well as how to search your shell
    history and access your text editor from the shell.


    **Chapter 2: Thinking in Pipelines** This chapter explores the pipeline, the pattern
    that all command line programs follow input and output. It also introduces basic
    redirection, a process that allows you to send a program''s output to a file or
    use a file''s contents as program input. These concepts will be essential in more
    advanced chapters.


    **Chapter 3: Finding Files and Folders** Using the shell to search for files and
    folders makes quick work of a task that can be tedious in a GUI environment. In
    this chapter, you''ll meet the built-in find command and learn all how this versatile
    tool can make your search operations more efficient.


    **Part II, Manipulating Text and Streams**, demonstrates techniques for working
    with text, whether it''s code, data, or configuration files.


    **Chapter 4: Regular Expression Essentials** Regular expressions, or regexes,
    have a reputation for being complex but can simplify many tasks, such as finding
    and altering text patterns across a file. In this chapter, you''ll learn about
    regex fundamentals such as characters and groups, and see several practical examples
    that will make regexes more approachable. This foundation will prepare you to
    use regexes with the shell tools introduced in the following chapters.


    **Chapter 5: Getting to Grips with grep** The grep tool is a real workhorse for
    users. Once you''ve learned how to use it, you''ll find yourself turning to it
    again and again. This chapter explains how to use grep to filter text in files,
    as well as how to combine grep with regexes and pipelines for more complex search
    operations.


    **Chapter 6: Slicing and Dicing Text** Searching and filtering aren''t the only
    operations you can perform in the shell. This chapter walks you through several
    techniques for manipulating text, introducing commands such as head, tail, sort,
    and uniq to extract, sort, and deduplicate (remove duplicates) from text.


    **Chapter 7: Advanced Text Manipulation with sed** The powerful stream editor
    allows you to manipulate text in more sophisticated ways by using expressions,
    or sets of operations you want to perform. You''ll learn how to combine expressions
    to remove or replace parts of a file in a configuration file, among other examples.
    You''ll also see advanced applications, such as editing a file in place and combining
    sed with grep and regex to restructure text.


    **Chapter 8: Building Commands on the Fly** This chapter introduces the xargs
    command, which you''ll combine with techniques from earlier chapters to dynamically
    build complex commands by converting input into command arguments. With xargs,
    you can pass data to other commands you''ve worked with, and you can even preview
    the commands'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'you construct before executing them. This chapter will lay the ground-work
    for the next part of the book, where you''ll turn your commands into shell scripts.


    # Part III, Shell Scripting. a crash course in the art of automating sequences
    with shell scripts. You''ll apply the techniques from previous chapters and add
    several more skills to build tools and scripts that perform complex operations
    efficiently.


    **Chapter 9: Shell Script Fundamentals** In this chapter, you will write a basic
    script to build a command that will output the shell commands you use most often.
    You''ll learn how to add, format, and chain commands; how how to make shell scripts
    executable; and how to install your scripts. In the following chapters, you''ll
    extend the common with additional features to make it more powerful and user-friendly.


    **Chapter 10: Using Variables to Store, Read, and Manipulate Data** Variables
    in shell scripts allow you to store and reuse values instead of repeating them,
    which makes your scripts easier to maintain and reduces the risk of errors. In
    this chapter, you''ll learn how to create and format variables to read input,
    perform arithmetic operations, and more. You''ll update your common command script
    with variables to configure how much of the shell history it reads and how many
    commands retains.


    **Chapter 11: Mastering Conditional Logic** By this point, you''ll be a pretty
    solid shell scripter! In this chapter, you''ll learn how adding logic to your
    scripts, using tools like if and case statements, allows you to control how they
    behave in different scenarios. You''ll also work with advanced constructs like
    conditional expressions with regex. To see how conditional logic works in practice,
    you''ll update the common so that it can determine whether you''re using bash
    or the Z shell, and based on that condition, return the appropriate file.


    **Chapter 12: Using Loops with Files and Folders** This chapter demonstrates one
    of the most practical applications of scripts: running loops over sets of files
    and folders to efficiently execute repetitive tasks. Loops run a sequence of commands
    based on whether certain conditions are met, and as are a form of conditional
    logic. You''ll learn how to use for loops, while loops, and until loops to iterate
    over different parts of the filesystem, and then add loops to your common script
    to return user-friendly output.


    **Chapter 13: Functions, Parameters, and Error Handling** Functions are another
    invaluable tool for reducing repetition in your scripts, and in this chapter you''ll
    learn how to create them, pass parameters to them, and work with the values they
    return. The chapter also covers some ways to handle errors in the event that a
    command or function'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'in your script fails. Then you''ll restructure the common script with error
    handling logic and functions to make the code more readable and maintainable.


    **Chapter 14: Useful Patterns for Shell Scripts** this chapter looks at some conventions
    you may find useful when working with your own or other people''s scripts, including
    debugging with the trace option, adding syntax highlighting, and checking for
    the presence of a specific operating system, program, or command. You''ll also
    see examples of anti-patterns—shell practices that are common but not advised.


    **Part IV, Building Your Toolkit**, delves into techniques for customizing your
    environment to your specific needs and preferences. You''ll build and extend a
    personal library of customizations and configurations that you can share across
    machines or with others.


    **Chapter 15: Configuring Your Shell** In this chapter, you''ll learn about the
    three types of shells and their startup behaviors, how your different shell configuration
    files work, and how to change the default shell settings in ~/.bashrc.


    **Chapter 16: Customizing Your Command Prompt** This chapter shows how you to
    change the command prompt to display only the information you want. You''ll learn
    how to use the PS1 variable, escape sequences, and ANSI formatting to control
    both the content and look of your command prompt. Finally, you''ll create a script
    that allows you to set your command prompt theme from a list that you can extend
    over time.


    **Chapter 17: Managing Your Dot Files** As you customize aspects of your shell
    and environment, you''ll need a place to store to create and organize these configuration
    files, known as dot files, so that you can easily track changes over time and
    keep them separated from system settings. You''ll also learn how to use your dot
    files across different shells.


    **Chapter 18: Controlling Changes with Git** In this chapter, you''ll use Git,
    a powerful version control, to manage your personal configuration settings. You''ll
    create a virtual storage space known as a repository and learn Git syntax to track
    and make changes, resolving conflict changes, and remove or rename files from
    the command line.


    **Chapter 19: Managing Remote Git Repositories and Sharing Dot Files** You''ll
    use the web-based platform GitHub in this chapter to publish your local repository
    to a remote repository so that you can share your configuration across machines
