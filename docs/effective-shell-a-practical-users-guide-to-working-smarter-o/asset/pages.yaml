    >>>>>> glog_alias

    ```


    The <<<<<<< line is shown before changes in the current branch, the ======= line
    is a separator, and the >>>>>>> glog_alias line indicates that everything-after
    the =======-line reflects the changes in the glog_alias branch. Many modern editors
    will immediately recognize the sequence of symbols that Git uses to indicate conflicts
    and highlight them.


    You can see why Git hasn''t been able to merge these changes: each branch has
    a new line, and Git doesn''t know which one is correct. Rather than assuming that
    the most recent change should take priority, Git asks you to choose.'
