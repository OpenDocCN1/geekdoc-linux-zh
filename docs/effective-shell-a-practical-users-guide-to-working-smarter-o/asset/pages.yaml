  md: '# CONVENTIONS FOR COMMIT MESSAGES


    You can use any text you like for a commit message. However, there are a couple
    of best practices to bear in mind:


    +   - Try to keep the first line—known as the subject line—to 50 characters or
    fewer. Keeping it short will make it easier to look through the log of changes
    and see what each commit means.


    +   - If you want to add more detail, leave a blank line after the subject line
    and then include as much text as you like. Common convention is to wrap the text
    at 80 characters so that it will fit in a typical window.


    There are many articles available with further guidance on your commit messages.
    You can explore these articles as you get familiar with Git. My primary recommendation
    is to make sure that your commit makes sense; it should describe what the change
    is (ideally) the reason for it. Over time, it''s easy to forget why you made changes,
    writing clear commit messages will save you a lot of time in the long run and
    make it easier for others to work with your repository.


    # Working with Branches


    Branches provide a convenient way to work on a set of changes and record these
    changes with commits, without affecting the primary (main or master) and other
    branches. Your branch can then be merged to the primary branch.


    When others work in your repository, they also typically in a branch and submit
    a request to merge it into the primary branch. This section will take a closer
    look at branches and how these processes work.


    # Creating Branches


    The commits you''ve made so far have been on the main branch. You can create new
    branches and make commits on them in order to save a series of changes that are
    isolated from the main branch.


    You can create branches with the git branch ("list, create, or delete branches")
    or the git checkout ("switch branches or restore working") command:


    ```

    $ git checkout -b aliases

    Switched to a new branch ''aliases''

    $ status

    On branch aliases

    nothing to commit, working tree clean

    ```'
