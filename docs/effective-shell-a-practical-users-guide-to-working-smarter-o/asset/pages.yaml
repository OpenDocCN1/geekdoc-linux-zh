- img_proc: true
  md: 'the directory already existed. Say you don''t care about that error, because
    it just means your task is already done.

    The special file /dev/null is used for just this purpose. When you write to this
    file, the operating system discards the input. To see this in action, run the
    mkdir command and redirect the stderr with file descriptor 2 to the null file:


    ```

    $ mkdir ~/effective-shell/new-folder >/dev/null

    ```


    This redirects all errors to a black hole /dev/null so that you won''t see them
    on the screen or anywhere else. You can also use the null file to discard the
    stdout from programs.

    Keep in mind that you should use this trick with caution. Make sure you really
    do want that output to disappear, because once it''s gone, it''s gone forever.


    # Appending to a File


    You can also use standard error redirection to append to files:



    ```

    $ mkdir ~/effective-shell/new-folder 2>>all-errors.log

    ```


    This can be useful if you''re maintaining a file of all errors that have occurred
    when running a program or even a sequence of operations. As you saw earlier, you
    use >> to append rather than overwrite. This operation creates the file if it
    doesn''t exist and writes the content to the end of the file if it exists.


    # Redirection with Both stdout and stderr


    There is an important subtlety you should be aware of when redirecting stdout
    and stderr together. For example, if you want to write stdout and stderr to a
    file, you might try this:


    ```

    $ ls /usr/bin /nothing 2>&1 all-output.txt

    cannot access ''/nothing''

    ```


    This command writes stdout to all-output.txt, but stderr is still written to the
    screen. The reason is that bash (and most bash-like shells) redirections from
    left to right, and when you redirect, you duplicate processes. The source is complex,
    let''s break it down:


    +   - The sequence 2>&1 ensures that the file descriptor 2 (stderr) is also written
    to 1 (stdout), which is currently the terminal.

    - The sequence > all-output.txt duplicates the file with descriptor 1 (stdout)
    and writes it to a file called all-output.txt. The > character is a convenient
    shorthand for 1> (that is, redirecting the standard output).'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'As you can see, at the time of the first redirection, you''re redirecting to
    the screen, not to a file. The redirection to a file is the subsequent state since
    the redirection is processed from left to right.

    To write everything to the file, try this:


    ```

    $ ls /usr/bin /nothing > all-output.txt 2>&1

    ```


    This command will work in a way that is more sensible in most cases.

    Notice the difference?


    +   * The operator redirects stdout to the file all-output.txt.

    * The 2>&1 sequence redirects stderr to stdout, which has already redirected to
    a file.


    This behavior can be tough to remember, so it''s worth experimenting with it.
    Brian Stori''s blog post "Understanding Shell Script''s idiom: 2>&1" at https://www.brianstori.com/understanding-shell-script-idiom-redirect/
    gives a very detailed description of this behavior. There are many variations
    you can play with, and you''ll see more as you go through the book.


    # T-Pipe


    I can''t talk about pipelines without briefly mentioning the T-pipe, which splits
    the stream in two so it can easily be sent to two different directions. For example,
    you can stream content to the display as well as a file like:


    ```

    $ cat ~/effective-shell/text/simpsons-characters.txt | sort | sorted.txt

    ```


    This command alphabetically sorts the simpsons-character.txt file and saves it
    to sorted.txt but also shows onscreen. This way, you can quickly confirm the results
    without opening the file.

    The T-pipe can be used for more complicated work. To try this:


    ```

    $ cat ~/effective-shell/text/simpsons-characters.txt | sort | sorted.txt | uniq
    | grep ''^A''

    ```


    Here you create a command to sort the list of Simpsons characters, remove duplicates
    with the uniq command, and then use grep to filter the results to names with A
    (The grep tool allows you to search and match patterns in text; Chapter 5 covers
    it in detail). The tee command in the middle creates a T-pipe, which pipes the
    results of the sort command to the sorted.txt file before they go to the rest
    of the pipeline. In other words, sorted.txt contains the content after the sorting
    operation but before the deduplicate and filter operations; the rest of the output
    will continue through the pipeline as normal, as Figure 2-11 illustrates.'
  merge: -1
  pgno: 58
- img_proc: true
  md: '![](img/1b4376e88e3e983d901a0c536b9dd3c9_59_0.png)


    Figure 2-11: How the tee command splits a stream


    You can see that tee splits off the output at a certain point and saves in a separate
    file.

    If you can visualize a T-pipe, it''s easy to remember this useful command.

    You can use it in any number of more complex pipelines or scenarios to write content
    to a file that would otherwise go straight to another program or to the display.


    # # Pipelines and the Unix Philosophy


    Getting comfortable with pipelines opens a whole world of possibilities. As you''ve
    seen, pipelines let you manipulate the flow of data in streams, chain-programs
    together to handle complex operations.

    The day before I wrote this chapter, I was working with a data file called data.dat
    that included empty lines and comments. I needed to find out how many unique data
    points the file contained; it took less than a minute to put together this command:


    ```

    $ cat data.dat | sort | uniq | grep -v ''^#'' | wc -1

    ```


    I didn''t have to install any special program to do exactly what I needed; I just
    incrementally built a pipeline, adding each section by one and writing to the
    screen each time, until I got the results I was looking for.


    > > NOTE With the correct options, sed could likely do this in a single operation,
    I''d probably spend a lot googling the right options for it!


    My thought process went as follows:


    +   1. First, I use cat.dat to write the content of the file to stdout. In many
    cases, this isn''t necessary—you could simply pass the data.dat file as a parameter
    to the first command—but I find it easier to break up each step into the smallest
    possible chunks.

    2. I use sort to put all the blank and duplicate lines together.

    3. I pipe to uniq to remove duplicate lines.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '4. I grep -v ''^#'' to get rid of all the comments by finding lines that start
    with a hash mark (#). I''m counting unique data points, not comments. The -v ("invert")
    flag inverts the results of the expression—so in this case, it will show lines
    that don''t start with a hash mark (that is, lines that aren''t comments).


    5. wc -l counts the number of remaining lines, all of which should be unique.


    There may be better ways to handle this task, as this''s one not perfect: if there
    are blank lines in the file, this method will remove all but one rather than all
    of them. However, piping me gives a quick-and-dirty solution in less than a minute.


    Of course, as your needs grow, you might want to build scripts (see Chapter 9)
    or use a programming language, but this approach illustrates a core tenet of the
    Unix philosophy: chaining together programs that do each one well in order to
    accomplish more complex tasks.


    While the Unix philosophy might seem intuitive or obvious today, it was groundbreaking
    when introduced in 1978. It vastly simplified how programmers wrote code, making
    programs far more flexible to work with and yielding powerful results from existing
    tools. The fact that it is still relevant, with very few differences from how
    it was conceived in the 1970s, is a testament to what a remarkable design philosophy
    it is. See https://en.wikipedia.org/wiki/Unix_philosophy for more details.


    # Summary


    This chapter introduced standard streams, redirection, pipelines, and other concepts
    that are fundamental not only to using the shell effectively but also to really
    understanding how computer programs work.


    Don''t worry if this feels like a lot to take in: you''ll see more examples throughout
    the book that will reinforce these concepts. You can also revisit this chapter
    to review various topics as you progress. Many of the programs you''ve seen here,
    such as sed, tr, and grep, are workhorses you''ll encounter again and again, particularly
    in Part II.


    In the next chapter, you''ll learn how to use the shell to efficiently locate
    folders and files within your system and work with those search results.'
  merge: -1
