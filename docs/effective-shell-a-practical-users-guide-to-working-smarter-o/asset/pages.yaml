  md: 'The following query, writes a shell script to find the largest file in a folder,
    demonstrates this process:


    $ ai -- "code: shell script for largest file in working directory, showing size"

    chatgpt:


    ```

    #!/bin/bash

    ```


    # List files in current directory with sizes.

    ls -lh | awk ''{print $9, $5}'' | grep ^total | sort -k 2 -n | tail -n 1


    +   - Verify your script - AI can make mistakes!

    - Are you sure to execute this code? Yes

    answer.txt 642b


    ? chat:


    The code part of the command is a hint Terminal AI uses to tell ChatGPT to write
    only code, with no explanation. Pressing ENTER again at the chat prompt will show
    you the next set of available actions.


    # Redirecting Responses to a File


    Like any command line tool, it allows you to redirect input and output from other
    programs. For example, you can repeat the previous query but send its results
    to a file like:


    $ ai -- "code: shell script for largest file in working directory, showing size"
    > find.sh


    This command redirects the results to a new file called find.sh, which you could
    review and execute later.


    # The Shell of the Future


    The possibilities are endless for ChatGPT and other large language models (LLMs)
    in your day-to-day work. Given that LLMs are trained on public data (the full
    set of public repositories on GitHub and other locations), their answers to programming-related
    questions tend to be very reliable. That said, remember to check any AI-generated
    code before running to avoid unexpected effects.


    I wrote the Terminal AI tool to show how easily you can integrate ChatGPT into
    a shell-oriented workflow, and I''m adding new features to it regularly. A host
    of other tools, code editors like Cursor (cursor.com), and various platforms are
    currently building on AI technology as well. I encourage you to explore as many
    as you can to become an even effective shell user.'
