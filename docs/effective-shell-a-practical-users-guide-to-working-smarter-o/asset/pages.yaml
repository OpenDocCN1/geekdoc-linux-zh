  md: '# COPY AND MOVE TIPS


    You''ll see the copy and move commands a lot throughout the book, so let''s go
    over a few tips to make working with them easier.

    First, remember that the cp and mv commands both have the basic structure source
    destination. When you''re copying or moving (renaming) a file inside the working
    directory, you don''t need to provide a destination folder path:


    ```

    cp file1 file2

    mv file1 filnew

    ```


    The first command makes a copy of file1 in the working directory and names it
    file2. The second command renames file1 to the working directory filnew.

    If you''re copying or moving a file to a different folder, you don''t need to
    provide the new filename unless you want to rename the file; you can just provide
    the destination folder path:


    ```

    cp filnew ~/backups

    mv file ~/backups

    ```


    The first command copies filnew from the working directory to the backups folder
    in your home directory. The second command moves file3 from the working directory
    to the backups folder in your home directory. In both cases, the filename doesn''t
    change because you haven''t specified a new one.


    When copying a folder, you must add the -r flag to copy the folder and all of
    its contents; otherwise, only the folder itself would be copied. Here''s an example:


    ```

    cp -r ~/backups ~/backups.old

    ```


    This makes a copy of the backups folder, including all of its contents, in your
    home directory and names it backups.old.

    The mv command doesn''t require the -r flag:


    ```

    mv somefolder newfolder

    ```


    This command renames the somefolder to newfolder in the working directory; none
    of the folder''s contents are lost.

    Finally, remember that you can mix and match relative and absolute paths:


    ```

    cp -r /home/dwmkerr/backups ./backups

    mv scripts/test-script.sh /tmp

    ```'
