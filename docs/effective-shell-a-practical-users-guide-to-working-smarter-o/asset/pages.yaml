    \ iteration of the loop. The list name words comes from the for loop documentation.\
    \ There's a technical (and complex) reason for this name, as I'll explain shortly.\
    \ The do keyword begins the block of commands to execute for each item. Finally,\
    \ the done keyword closes the for loop. It is inconsistent with the shell syntax\
    \ for if statement, which is closed with backward (fi), and the case statement,\
