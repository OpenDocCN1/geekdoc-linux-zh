    # ## MASTERING THE MULTIPLEXER


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_394_0.png)


    A terminal multiplexer is a tool that lets you run multiple programs and shell
    sessions independently. You can switch between tasks, keep processes running in
    the background, and disconnect and reconnect without losing any settings or work
    in progress. These features are invaluable for multitasking and remote work. In
    this chapter, you''ll learn how to use the popular terminal multiplexer tmux to
    handle everyday tasks and customize it to your needs.


    Multiplexer sessions are containers that can hold multiple shell sessions and
    other programs, which persist independently of the terminal connection. You connect
    to your multiplexer sessions with your terminal using a shell, and when you exit
    the shell, the sessions continue running in the background. Users can switch between
    sessions, save them, resume them, and even invite others to join one to allow
    collaboration. Multiplexers also'
