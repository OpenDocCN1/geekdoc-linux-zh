  md: '# A


    # SETUP


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_412_0.png)


    If you’re new to the shell, this appendix will walk you through how to access
    the shell on your machine, configure your system, and install some software to
    set up a simple and standardized shell environment.


    You can skip this appendix if you are already comfortable running a shell in a
    terminal program and have a recent version of bash or a bash-like shell installed.


    # Accessing the Shell


    The name of the shell program you’ll use and the way you access it will differ
    depending on your operating system.


    # Microsoft Windows


    A number of shell programs are available for Windows. You’ll be using Command
    Prompt, the basic shell program that comes preinstalled in Windows.'
