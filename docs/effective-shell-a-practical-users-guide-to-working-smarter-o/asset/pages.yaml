  md: 'To wrap up this chapter, I''ll touch on how to check and change your default
    shell. While changing your shell isn''t something I encourage for novices, you
    should know how to do it in case you need to access another shell''s features
    or overcome script compatibility issues in your current shell.


    # Changing Your Shell


    To see what current default shell is, check the /etc/passwd file so:


    ```

    $ grep ''dwmkerr'' /etc/passwd

    dwmkerr:x:1001:1001:Dave Kerr,,://home/dwmkerr:/bin/bash

    ```


    The /etc/passwd file keeps track of the local user accounts on the system. The
    final item on the line is the user''s shell.


    When you log in, your shell is set in the SHELL environment variable. You can
    print this value out the echo command:


    ```

    $ echo My shell is: $SHELL

    My shell is: /bin/bash

    ```


    You have a few ways to change your shell. However, before you do so, make sure
    that the shell you want to use is in the list of available shells at /etc/shells:


    ```

    $ cat /etc/shells

    # /etc/shells: valid login shells

    /bin/sh

    /bin/bash

    /usr/bin/bash

    /bin/rbash

    /usr/bin/rbash

    /bin/dash

    /bin/dash

    /usr/bin/tmux

    ```


    If the shell you want to use is not listed in /etc/shells, you''ll need to add
    it; search online for installation instructions for your specific shell. Once
    the shell you want to use is in /etc/shells, you can run the chsh ("change shell")
    command to change the shell:


    ```

    $ chsh -s /bin/bash dwmkerr

    ```


    The -s ("shell") parameter specifies the shell path, followed by the user-name
    you''re changing the shell for.


    > On many systems, users can change their own shell as long as it''s in the /etc/shells
    list. To change the shell for another user or to use a shell that is not in the
    /etc/shells list, you''ll need to run the chsh command using sudo.'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'You can also change the shell for a user by editing the /etc/passwd file (you
    must be using sudo to do this) or starting the shell from your login shell (for
    example, by running sh from your bash session).


    Here''s an end-to-end example showing how you would install zsh and set it for
    the current user on a Debian-based system:


    ```

    # Elevate privileges to superuser.

    sudo su


    # Update the apt databases and install "zsh"

    apt update -y

    apt install zsh


    # Add "zsh" to the list of shells.

    echo "/bin/zsh" >> /etc/shells

    ```


    ```

    # Return to normal user mode.

    exit

    ```


    ```

    # Change the current user''s shell to "zsh".

    chsh -s "/bin/zsh" $USER

    ```


    Changing your shell is an advanced topic, and not without risk. If you don''t
    properly configure the shell you''re changing to, you could lock out of your account.
    Always test that the new shell works before you set it!


    # Summary


    In this chapter, you learned how to customize your shell configuration with the
    ~/.bashrc. You saw how interactive, non-interactive, and login shells differ,
    as well as how they load startup files. You can find all the details on how the
    shell starts up and loads configuration files by entering man bash INVOCATION.


    In the next chapter, we''ll take a deeper dive into the command prompt and explore
    how to customize it to suit your preferences.'
  merge: -1
