  md: '# 22


    # THE SECURE SHELL


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_358_0.png)


    So far you''ve been using the shell to operate on your local machine. But you
    can also use the Secure Shell (SSH) protocol to open a secure network connection
    to a remote machine and use the shell to work on that machine.


    In this chapter, you''ll learn how to set up the credentials and keys for secure
    remote connections, how to create a virtual machine in the cloud, and how to connect
    to that machine from your local computer using the ssh program. I''ll also show
    you how to configure SSH to make it easier to work with.


    # What Is SSH?


    SSH is a protocol that has been used for decades to establish a secure connection
    to a remote machine, either on your network or across the internet. The ssh program
    is the “secure shell” that helps you establish SSH connections, manage credentials,
    and open a shell on a remote machine.'
