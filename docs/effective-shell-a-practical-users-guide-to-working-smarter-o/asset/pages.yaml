  md: 'In command mode, the keystrokes you enter are used to manipulate text or move
    around. To perform an administrative task, such as saving a file or calling another
    program, you need to change to ex mode (ex is short for “execute”) with the ex
    command, which is a colon (:); like so:


    ```

    :

    ::

    ```


    Ex mode is a bit like insert mode but for writing commands. Let’s use the q! (“quit
    without saving”) command to close Vim. Enter the command now:


    ```

    q!

    :q!

    ```


    Any keystrokes you enter in ex mode will display on the status line, showing the
    text for the command you’re building. At this point, your terminal should look
    like this:


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_378_0.png)


    The status line is showing you that q! is your current command. Press ENTER to
    execute the command, and Vim will close.


    You’ve now seen the basics of modal editing with Vim’s command, insert, and ex
    modes. You’ve learned how to close Vim, which is famously a task that Vim novices
    struggle with! Now you’ll start building your own cheatsheet to explore more of
    what it can do.


    # Building Cheatsheet


    Building a Vim cheatsheet is a great way to showcase what Vim can do while documenting
    your learning as you go. You’ll extend your cheatsheet over time with the commands
    that you find most useful.


    Start by creating a folder to store the cheatsheet and initializing an empty Git
    repository to track changes to it:


    ```

    $ mkdir ~/vim-cheatsheet

    $ cd ~/vim-cheatsheet

    $ git init -b main

    Initialized empty Git repository in /home/dwkmerr/vim-cheatsheet/.

    ```


    You’ve created a vim-cheatsheet folder, moved into it, and initialized an empty
    Git repository with a primary branch named main.

    For more information on how Git works, see Chapter 18.'
