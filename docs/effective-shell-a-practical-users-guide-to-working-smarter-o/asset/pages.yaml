    invalid, as it has two symbols. The reason that it matches the current regex is
    because you are using the .metacharacter before and after the sign. metacharacter
    means “any character except a newline,” which includes the @ sign.


    You have few ways to make your regex more explicit with character sets or metacharacters.
    Let''s go over the options.


    # Specifying Ranges


    One option is to create a character set by specifying the acceptable ranges of
    characters the can match. You start and end a character set with square brackets,
    then use letters or numbers separated by hyphens to denote a range of characters,
    like so:


    +   [A-Z]


    This character set includes the full uppercase alphabet, A to Z.

    A character set can contain multiple ranges, in which case any character within
    any of the ranges are valid:


    +   [A-Za-z-9]


    This character set matches any uppercase letter A to Z, lowercase letter a to
    z, and the digits 0 to 9. Notice that you don''t put spaces between the ranges.
    Replace the dot metacharacters in your current regex with this range like so:


    +   [A-Za-z0-9]+@[A-Za-z0-9]+


    Plug this in, and you should get the following results:


