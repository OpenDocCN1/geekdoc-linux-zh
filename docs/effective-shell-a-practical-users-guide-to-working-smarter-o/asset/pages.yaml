  md: 'Phew! That''s a lot of just to change the color of the prompt. Fortunately,
    in this chapter we''ll walk through a script that will make it easier to work
    with colors and text formatting.


    # Adding Data to the Command Prompt


    When you set the PS1 variable, you''re simply setting it to a string. This string
    could be anything:


    ```

    dwkmerr@effective-shell-ubuntu-24:~$ PS1=''Ready??'' -->

    Ready??-->

    ```


    You don''t have to limit yourself to the special sequences you''ve seen so in
    this chapter; you can run any commands you''d like to build a command prompt.
    For example, you could use the ls ("list directories") and wc ("word count") commands
    to count the number of files and folders in the current directory and show that
    in the prompt:


    ```

    dwkmerr@effective-shell-ubuntu-24:~$ $(ls -al | wc -1 | tr -d ''[:space:]'') \$

    32

    ```


    This prompt shows that 32 files and folders are in the current directory. The
    ($) notation runs a subshell that lists the contents of the current directory
    and then pipes them to wc -1, which counts the number of lines. The result is
    piped into tr -d ''[:space:]'' to remove the whitespace around the line count.


    To use the () notation or any shell variable, you have to double quotes in the
    string; otherwise, the shell will write out those characters literally. And because
    you''re using double quotes, you need an extra backslash before the last \ to
    escape it so that the shell doesn''t try to treat it as a variable.


    However, this PS1 configuration has a subtle bug. Try changing directories as
    I do here:


    ```

    32 $ cd effective-shell/

    32 $ touch newfile{..10}

    32

    ```


    Although I changed to the effective-shell directory, the count still stood as
    32. This was suspicious, so I tried creating 10 new files . . . but the count
    shows as 32.


    The reason for this is that 32 was the number of files and folders in the current
    directory at time I set the PS1 variable. I changed the variable once, but what
    I really need is for the shell to count the files *each time* the prompt is shown.


    Fortunately, there''s a special syntax for this. Add a \ in front of the $ for
    the shell below:


    ```

    32 $ PS1=\$(ls -al | wc -1 | tr -d ''[:space:]'') \$"

    ```'
