    # Paging Through Text


    The pager is a shell program that lets you interactively read a file by moving
    backward and forward one page at a time. (A page in this is a section of the output
    that fits on the screen rather than overflowing it.) If you want to see a little
    bit of a large file, or if you''re trying to build a pipeline and want to see
    intermediate results (perhaps before you use head or tail), you can use the pager
    to see and move through output without filling your screen and terminal with too
    much text.


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_111_0.png)


    For more information about the pager, see “Getting Help” on page 415.


    One common pager program is less (“open a file for interactive reading\). When
    viewing the sorted list of files, for example, you might run the following:


    ```

    $ cut -d'' '' -f 3 ~/effective-shell/data/top100.csv | sort | less

    ```


    Here''s a sample of output:


    +   * "Jaws (1975)

    * "King Kong (1933)

    * "La Grande Illusion (Grand Illusion) (1938)

    * "La La Land (2016)

    * "Lady Bird (2017)

    * "Laura (1944)"'
