    Here''ve grebed the third field in the CSV file (Title), sorted its contents alphabetically,
    and displayed the first 10.

    You can reverse the direction of sort with the -r ("reverse") flag:


    ```

    $ cut -d'','' -f 3 /effective-shell/data/top100.csv | sort - r

    "Zootopia (2016)"

    "Wonder Woman (2017)"

