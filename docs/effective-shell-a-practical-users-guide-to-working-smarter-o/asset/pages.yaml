- img_proc: true
  md: '# What Is Git?


    Any files or folders you work with regularly, such as your personal configuration
    (dot files), will change over time—things get added, deleted, updated, moved around,
    and so on. Git is a version control system that allows you to track your changes,
    maintaining a history of the changes that have been made: when, by, and why. You
    can also maintain multiple branches of your files and folders—that is, working
    environments where you can make changes without affecting the ''main'' set of
    files.


    Git was written by Linux kernel Linus Torvalds in 2005 and has since been enhanced
    by many others. "Git" is slang for an annoying person; Torvalds joked that he
    names projects after himself, first Linux and then Git. There were many version
    control systems around Git, such as CVS (Concurrent Versions System) and SVN (Subversion,
    a system similar to CVS but with some improvements). There were also a number
    of proprietary and commercial solutions.


    In recent years, Git has become the most widely used version control system globally,
    and highly popular software collaboration systems—such as GitHub, GitLab, and
    Bitbucket—use Git as their underlying version control system and add other features
    on top.


    # Creating a Git Repository


    All of the information about a set of files or folders for which you''re tracking
    changes is stored in a Git repository. In this section, you''ll create a Git repository
    to track changes to your dotfiles folder (discussed in Chapter 17), which stores
    simple shell configurations. You can read about how to create this folder in Chapter
    17, or you can download the book''s sample files to get a copy of it.


    To install the samples to the ~/effective-shell, run the following command:


    ```

    $ curl effective.sh | sh

    ```


    Then you can copy the ~/effective-shell/dotfiles folder to your home directory,
    where you''ll create your Git repository and start using the Git commands, running
    the following command:


    ```

    $ cp -r ~/effective-shell/dotfiles ~/dotfiles

    ```


    Whether you installed the ~/dotfiles folder from the book''s samples or have your
    own version from the previous chapter, move it into your home directory like so:


    ```

    $ cd ~/dotfiles

    ```'
