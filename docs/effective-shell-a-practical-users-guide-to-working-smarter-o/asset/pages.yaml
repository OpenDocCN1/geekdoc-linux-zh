    # PS3


    PS3 allows you to specify the prompt used by the select command:


    ```

    $ PS3="Your choice? : "

    $ select fruit in Apples Pears; do echo "$fruit"

    1) Apples

    2) Pears

    Your choice? :

    ```


    The PS3 variable isn''t set by default. If you don''t set it, the state statement
