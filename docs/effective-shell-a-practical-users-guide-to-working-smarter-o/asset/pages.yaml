- img_proc: true
  md: '# Adding and Formatting Commands


    Next, you''ll add some commands to the common.vi.sh file. If you''ve installed
    the book''s examples, copy and paste the commands from the ~/effective-shell/scripts/common.vi.sh
    (be sure to add the backslashes and line breaks, which I''ll discuss in a moment)
    or just directly edit your file so that it looks like:


    ```

    # Inform the user of the output you can expect.

    echo "common commands:"

    ```


    ```

    # Show the most commonly used commands.

    tail \.bash_history -n 100 \

    sort | \

    uniq -c \

    sed ''s/*/\//'' \

    sort -n -r \

    head -n 10

    ```


    This script takes the last 1,000 lines of the ~/.bash_history file and performs
    various operations joined into a pipeline to show the most commonly commands.


    Rather than having one long line for the pipeline, using the backslash (\) as
    a continuation character, tells the shell that the command continues across more
    than one line.


    You can break commands up into as many lines as you like. However, the continuation
    character must be the last character on the line. If you add something after it
    (such as a comment), the command will fail.


    Next, we''ll take a closer look at each component of the script so far. Before
    proceeding, make sure to read the book about how to follow along.


    # FOLLOWING ALONG WITH THIS CHAPTER''S EXAMPLES


    For the shell script you are writing in this chapter, you can either use your
    own history file, in which your output will differ from what''s shown here, or
    you can use the simplified history file at ~/effective-shell/data/history.txt,
    which will make it little easier to understand what''s happening at each step.
    Here''s how to do it:


    ```

    $ cp ~/.bash_history ~/..bash_history.backup

    $ cp ~/effective-shell/data/history.txt ~/.bash_history

    $ history -c

    $ history -r

    ```


    First, you make a copy of your history file (so that you can restore it later)
    and then replace it with the book''s sample history file. Using the history command
    with the -c ("clear")) and -r ("reload")) parameters tells the shell to reload
    the history file so that your bash history will match the one shown here.'
