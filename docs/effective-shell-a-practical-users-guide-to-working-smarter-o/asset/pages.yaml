    SHELL SCRIPT FUNDAMENTALS


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_140_0.png)


    In this chapter, you''ll learn how to build shell scripts, text files made up
    of commands that run in sequence, allowing you to automate tasks and perform complex
    workflows.


    In addition, you''ll explore different ways to run scripts, how to structure shell
    script files, and how to install scripts locally.


    Even if you''re already familiar with shell scripts, I suggest you skim this chapter
    to make sure you understand the core concepts, particularly the section “Specifying
    What Program Should Run a Script” on page 116, which describes how to make your
