  md: 'As you saw at the beginning of this section, you can override the shell''s
    default editor by setting the EDITOR environment variable (see Chapter 10 for
    more on variables). On my personal machine, I use Vim as my command line editor.
    To check which editor you''re using, enter the following:


    ```

    $ echo EDITOR

    vim

    ```


    Now, I wouldn''t recommend changing your editor to a graphical one like Visual
    Studio Code for a couple of reasons. First, some interfaces, like a virtual machine
    or Raspberry Pi, won''t have a desktop system to run a graphical editor, so you''ll
    need to be familiar with a shell-based editor. Second, an external graphical editor
    runs in a separate window, meaning you''ve moved out of the shell and away from
    where you''re working. Effective shell users want as few interruptions as possible
    between coming up with an idea, entering the text, and running a command.


    We''ll look at some more advanced editors in Chapter 23.


    # Other Useful Shortcuts


    There are a few other shortcuts, while they don''t fit into the categories we''ve
    looked at so far, are just as handy.


    # Clear the Screen


    The shortcut CTRL-L clears the screen but doesn''t affect anything executed in
    your current line. This is very helpful if you have a lot of "noisy" output on
    the screen and want to clean it up.


    # View Your Command History


    Running the history command prints the recent history of commands you''ve entered:


    ```

    $ history

    1 pwd

    2 ls

    3 git status

    4 clear

    5 curl effective.sh | sh

    ...

    ```


    You''ll get a numbered list of your command history, with the latest at the bottom.
    By default, the shell saves about 10,000 lines of history.


    > NOTE This command works even if you''ve used CTRL-L to clear the screen.'
