    You may see INT written as SIGINT in some cases. The SIG at the beginning of a\
    \ signal name is optional but not supported in all shells, and a signal number\
    \ can be used instead. Thus, SIGINT, INT, and 2 are all equivalent options for\
    \ the trap command. INT is the most portable and easy to read, so that's what\
    \ I recommend. Run man signal to look up all signals and their signal numbers.\n\
    \nYou can also use traps to discourage a user from interrupting your script, in\
    \ this example:\n\n```\ninterrupt_count=0\nif [ $interrupt_count -lt 1 ]; then\n\
