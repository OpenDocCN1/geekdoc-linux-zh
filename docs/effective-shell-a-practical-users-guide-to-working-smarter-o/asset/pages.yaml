    # Additional Shell Prompt Variables


    PS1 isn''t the only shell prompt variable you can use to configure your prompt.
    Table 16-3 lists others available to you.


    Table 16-3: Other Shell Prompt Variables


    | Name | Purpose |

    | --- | --- |

    | PS2 | Indicates a continuation and is set to > by default |

    | PS3 | Specifies the prompt used by the select command and is normally not set,
    so the default ? is |

    | PS4 | Specifies the prompt used when tracing with set -x and is normally set
    to + |

    | PROMPT_DIRTRIM | Limits the number of directories shown when using \w or \W
    in your prompt |

    | PROMPT_COMMAND | Specifies the set of commands you want to run before the prompt
    is shown |


    Let''s take a look at each in more detail.


    # PS2


    If you have a long line of text in the shell, you can start a continuation by
    entering a backslash:


    ```

    $ echo "This is a really really \

    > long \\

    > long line of text"

    This is a really long long long line of text

    ```


    When you press ENTER after entering a backslash, you''ll see the right angle bracket
    (> which reminds you that you''re not entering a new command but instead continuing
    the current command on a new line. To change the > prompt, set the PS2 option:


    ```

    $ PS2="..."

    $ echo "This is a really really \

    > long \"

    ```'
