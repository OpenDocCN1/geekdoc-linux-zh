  md: '# About the Author


    Dave Kerr is a technology consultant and software engineer who helps teams design
    and launch new products, scale high-performance systems, and modernize complex
    platforms. Passionate about automation, site reliability engineering, and developer
    experience, he loves coding, mentoring, publishing, contributing to open source,
    and writing. When he''s not in the shell, he''s in the mountains or rock climbing.


    # About the Technical Reviewer


    Mitch Frazier is a programmer who works for Emerson Electric doing mostly embedded
    systems programming in C. He also occasionally writes code in Golang, Python,
    Tcl, JavaScript, and bash. He previously worked for Linux Journal, both as a technical
    editor and as a system administrator.'
