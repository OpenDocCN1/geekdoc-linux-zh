  md: '# Improving the Lookup Tool


    One of the fun aspects of coding is thinking about all of the exciting features
    you can add! The final version of the script, which is in the ~/effective-shell/programs/lookup/lookup.py
    file, includes the following features:


    More robust error handling Adds exception handlers in the key places where the
    program might fail


    Graceful handling of CTRL-C Ensures the program closes cleanly on CTRL-C without
    a noisy error message (see KeyboardInterrupt in the code


    More detailed help Includes examples in the help text (see argparse in the code)


    Ability to look up multiple words Allows you to provide multiple words as parameters
    to the lookup command and get a definition for each one


    There are a few other features I considered including that you could add as a
    coding and learning exercise:


    +   **A browse flag** Opens the user''s browser to the full definition online


    +   **Man pages** Installs a man page for the tool, meaning a user could run man
    lookup


    +   **Clearer interactive mode** Shows a prompt and instructions when stdin is
    a terminal, meaning the user is interactive


    +   **A --verbose flag** Shows detailed error messages


    If you find yourself writing more complex command line tools in Python, check
    out Click (https://click.palletprojects.com/en/8.0.x/), a popular package by Python
    developers that''s used by several large and well-established projects. The Typer
    package (https://typer.tiangolo.com/) is also worth exploring.


    # Summary


