- img_proc: true
  md: 'The mkdir command fails because there''s a file already in the location where
    you''re trying to create the today folder. But the script keeps running and creates
    a symlink to a file rather than the today folder as expected. Then, when you try
    to move to the today folder, you get another error because it''s a link to a file,
    not a folder.


    In general, if a command fails in your shell script, you probably want the entire
    script to stop executing. Otherwise, you can get this cascading effect as commands
    continue to return after the failure, which can cause sorts of unexpected behavior.


    To tell the shell to exit when a command fails, use the set "set option" command,
    which turns shell options on and off, with the -e ("exit if any command exits
    with a nonzero status") option:


    ```

    #!/usr/bin/env sh

    ```


    # Exit if any command fails.


    set -e


    # ...


    Now clean up your pipeline again:


    ```

    $ rm -rf ~/today

    ```


    And finally, create the same file that caused the failure and rerun the script:


    ```

    $ touch /tmp/$(date +"%Y-%m-%d")

    $ ./today.sh

    mmkdir: /tmp/2025-05-28: Not a directory

    ```


    In this case, the script stops running as soon as the mkdir command fails, so
    the symlink is never created.


    When you call set to a shell option, the special - ("shell options") parameter
    is updated to include the option you''ve added. Calling -e will prepend the e
    to the value of $-. You can run echo $- to see which options have been set.


    The -e option affects only the final command of a pipeline. This means if you
    have a pipeline like this one


    ```

    grep ''[:alnum:]]*#'' "/effective-shell/scripts/common.sh | tr ''a-z'' ''A-Z''

    ```


    the script will still run if the grep command fails. To ensure that the shell
    terminates if a command in a pipeline fails, you must set the pipefail option:


    ```

    set -o pipefail

    ```


    Chapter 14 covers -e and set -o pipefail in detail.'
