  md: '# Storing Complex Data with Associative Arrays


    More recent versions of bash support associative arrays, in which you associate
    a string (known as a key) with each element, rather than a numeric index. This
    creates a key-value structure similar to the dictionaries you might have seen
    in other languages.


    To create an associative array, use the declare ("set variable") command with
    the -A ("associative array") flag followed by the array name you want to use:


    ```

    $ declare -A book

    ```


    Now you can use the "set array element" syntax to specify some details about the
    book array:


    ```

    $ book[title]="Effective Shell"

    $book[author]="Dave Kerr"

    ```


    Here you''re setting title and author as keys and assigning them the string Effective
    Shell and Dave Kerr, respectively. Now you can refer to these elements of the
    array by name, rather than number, which can be far more convenient:


    ```

    $ echo "Book details: ${book[title]} - ${book[author]}"

    Book details: Effective Shell - Dave Kerr

    ```


    If you find yourself using associative arrays, however, there''s a good chance
    you''re trying to do something more complex than is suitable for a shell script.
    See Chapter 21 for some alternative options.


