  md: '# Basic Navigation Techniques


    In this section, we''ll look at a number of shortcuts you can use to maneuver
    the cursor. To begin, use the following command to write the quote to a text file:


    ```

    echo "When you light a candle, you also cast a shadow." - Ursula Le Guin >> note.txt

    ```


    Once you have executed this command with pressing, the quote will be written to
    a file called note.txt.

    The shortcuts introduced in this chapter allow you to move around and manipulate
    the command line more quickly and efficiently if you were using only the arrow
    keys or delete key.

    To work through the examples in this section, press the arrow key, which will
    bring the command back up in your shell with the cursor at the end of the line.


    # Go to the Beginning or End of a Line


    You can quickly jump to the beginning of the text, no matter where your cursor
    is currently positioned, CTRL-A:


    ```

    echo "When you light a candle, you also cast a shadow." - Ursula Le Guin >> note.txt

    echo "When you light a candle, you also cast a shadow." - Ursula Le Guin >> note.txt

    ```


    The shortcut CTRL-E takes you to the end of the line:


    ```

    echo "When you light a candle, you also cast a shadow." - Ursula Le Guin >> note.txt

    echo "When you light a candle, you also cast a shadow." - Ursula Le Guin >> note.txt

    ```


    These are two of the most useful shortcuts, and I highly recommend you incorporate
    them into your regular usage:


    # Move Back or Forward One Word


    You can quickly jump backward or forward one word at a time. ALT-B to move back
    one word:


    ```

    echo "When you light a candle, you also cast a shadow." - Ursula Le Guin >> note.txt

    echo "When you light a candle, you also cast a shadow." - Ursula Le Guin >> note.txt

    echo "When you light a candle, you also cast a shadow." - Ursula Le Guin >> note.txt

    ```


    In this example, using ALT-B once takes you back word to the start of text. Using
    it two times takes you to the start of note. The shell treats the dot (.) character
    as a word separator; note and text are treated as two separate words (they could
    also be separated by a space or some other non-alphanumeric symbol).


    To go back to the beginning of the line (if you are not already), CTRL-A:


    ```

    echo "When you light a candle, you also cast a shadow." - Ursula Le Guin >> note.txt

    ```'
  merge: -1
