  md: '# # 11

    MASTERING CONDITIONAL LOGIC


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_172_0.png)


    A shell script normally executes commands in sequence, but what if you wanted
    it to act differently under certain circumstances? *conditional logic*, which
    lets you control your scripts behave based on specific conditions, such as how
    a user responds to a query or whether certain files exist. In this chapter, you''ll
    learn how to use tools like `if` statements and case statements to have your scripts
    check conditions and run different commands based on the results. We''ll also
    cover more advanced constructs such as using conditional expressions with regular
    expressions and chaining commands to make your scripts more flexible and responsive.'
  merge: -1
  pgno: 172
- img_proc: true
  md: "# The if Statement\n\nYou can use an if statement to perform operations in\
    \ shell scripts only when certain conditions are met. The if statement has the\
    \ following structure:\n\n```\nif test-commands\nthen\n    conditional-command\
    \ 1\n    conditional-command 2\n    conditional-command n\nfi\n```\n\nThe statement\
    \ begins with the if command and then specifies one or many conditions to test.\
    \ Following that is the then keyword and the commands to be run if the conditions\
    \ are met. If the results of the test-commands are all 0 (indicating success),\
    \ each conditional-command in the block will be run. The fi keyword (if written\
    \ backward) closes the if statement.\n get a better idea of how the if statement\
    \ is used, let's look at a simple example:\n\n```\nmkdir \"backups\"\nthen\necho\
    \ \"Successfully created the 'backups' folder\"\nfi\n```\n\nFirst, the mkdir command\
    \ tries to create a folder. As long as you already have a folder called backups\
    \ in your home directory, mkdir will return 0 and the conditional echo command\
    \ will execute, returning the following output:\n\n```\nSuccessfully created the\
    \ 'backups' folder\n```\n\nIf you run the script again, though, the mkdir command\
    \ will fail because the directory already exists. In that case, it returns 1 (indicating\
    \ failure) and the echo command will not be executed. You'll also see an error\
    \ message from the mkdir command:\n\n```\nmkdir:/home/dwkerr/backups: File exists\n\
    ```\n\nYou might be surprised that the result of the test commands has to be 0\
    \ for the conditional commands to run. This is the opposite of most programming\
    \ languages works, where 0 normally would be considered false (meaning the test\
    \ failed and the conditional commands would not run). In computer programs that\
    \ run in the shell, however, 0 generally means success, and any nonzero value\
    \ indicates an error code. The error code indicates the type of error; for example,\
    \ code 1 means \"general error,\" but code 127 means \"command not found.\" Different\
    \ programs can also specify their own error codes."
  merge: -1
  pgno: 173
- img_proc: true
  md: '# The test Command


    The test ("evaluate expression") command checks whether a certain condition is
    true before the attempts to run the commands in the then block. As long the condition
    is true, test returns 0 to indicate success and conditional commands.


    You could improve the preceding statement with test to create the backups folder
    only if it doesn''t already exist. Whereas in the previous example mkdir failed
    with an error if the backups folder was already present, test will simply skip
    the mkdir command altogether if the condition returns false. Here''s how the statement
    looks with the test command:


    ```

    ! test -d /backups

    then

    echo "Creating backups folder"

    mkdir /backups

    fi

    ```


    The test command evaluates the expression ~ /backups, where -d ("file exists is
    a directory") checks whether the provided path is a directory. Since you want
    to create the directory only if it does not exist, you use the not operator (!)
    to "invert" the result of test.


    Instead of entering test explicitly, you can surround an expression with square
    brackets:


    ```

    if [ -d /backups ]

    then

    echo "Creating backups folder"

    mkdir /backups

    fi

    ```


    The shell will evaluate this expression exactly the same way as the previous one.
    This square bracket syntax is frequently used as a shorthand for test and can
    make your scripts more compact. Be sure to include a space before the opening
    and closing square brackets.


    # Using test Operators with Expressions and Files


    You can use many operators in a test expression. Table 11-1 lists some of the
    most ones.


    | Table 11-1: Common Operators for test Expressions |

    | Expression part | Meaning |

    |---|---|

    | -n | True if the length of a string is nonzero |

    | -z | True if the length of a string is 0 |

    | "$var" | True if the variable var is set and is not empty |

    | s1 = s2 | True if the strings s1 and s2 are identical |

    | s1 != s2 | True if the strings s1 and s2 are not identical |

    | [continued] |'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# Table 11-1: Common Operators for test Expressions (continued)


    | Expression part | Meaning |

    |---|---|

    | n1 -eq n2 | True if the numbers n1 and n2 are equal |

    | n1 -ne n2 | True if the numbers n1 and n2 are not equal |

    | n1 -lt n2 | True if the number n1 is less than n2 |

    | n1 -le n2 | True if the number n1 is less than equal to n2 |

    | n1 -gt n2 | True if the number n1 is greater than n2 |

    | n1 -ge n2 | True if the number n1 is greater or equal to n2 |


    The test command also provides a number of operators that specify with the filesystem,
    which are very handy when building shell scripts. You''ve already seen the -d
    operator. Table 11-2 lists some other options.


    # Table 11-2: Common Operators for Files


    | Expression part | Meaning |

    |---|---|

    | -d | True if the file exists and is a folder |

    | -e | True if the file exists, regardless of the file type |

    | -f | True if the file exists and is a regular file |

    | -L | True if the file exists and is a symlink |

    | -R | True if the file exists and is readable |

    | -S | True if the file exists and has a size greater than zero |

    | -w | True if the file exists and is writable |

    | -X | True if the file exists and is executable; if it is a directory, check
    if it can be searched |

    | file1 -nt file2 | True if file1 exists and is newer than file2 |

    | file1 -ot file2 | True if file1 exists and is older than file2 |

    | file1 -ef file2 | True if file1 and file2 exist and are the same file |


    Earlier you saw the ! operator in action to invert the test result. You can place
    the operator either before or after the test command, so


    ```

    if test -d ~/backups

    ```


    is equivalent to:


    ```

    if test ! -d ~/backups

    ```


    To see all of the many operators available for the test command, run test.'
  merge: -1
  pgno: 175
- img_proc: true
  md: "# # Checking Multiple test Conditions Simultaneously\n\nYou'll often want to\
    \ check more than one test condition at a time. To do so, you can use the and\
    \ (&&) or (||) operators:\n\n```\nif [ $year -ge 1980 ] && [ $year -lt 1990 ];\
    \ then\n    echo \"year is in the 1980s\"\nfi\n```\n\nThis script checks to see\
    \ whether the value of the variable year is greater than or equal to (-ge) 1980\
    \ and less than (-lt) 1990, effectively searching within a range of years.\n\n\
    Alternatively, you could use the -a (\"and\") and -o (\"or\") operators. Here's\
    \ how the previous script looks using the -a operator:\n\n```\nif [ $year -ge\
    \ 1980 -a $year -lt 1990 ]; then\n    echo \"year is in the 1980s\"\nfi\n```\n\
    \nThis form of the and and or operators can lead to some subtle problems, so I\
    \ don't recommend using them. However, it's important to recognize them, since\
    \ you might see them in someone's script.\nYou will also likely see the following\
    \ syntax, which uses double square brackets to indicate a conditional expression:\n\
    \n```\nif [ $year -ge 1980 && $year -lt 1990 ]; then\n    echo \"year is in the\
    \ 1980s\"\nfi\n```\n\nYou'll learn all about this format in \"Conditional Expressions\"\
    \ on page 149.\n\n# # Combining Statements on a Single Line\n\nYou might have\
    \ noticed the use of the semicolon in the previous examples where you checked\
    \ multiple test conditions. By default, the shell assumes that each individual\
    \ line is a single statement, so if you want to put more one statement on a line,\
    \ you need to let it know where one statement ends and starts. That's where the\
    \ shell interprets the semicolon as a \"command separator\" symbol.\nYou'll see\
    \ if and then statements on the same line like this:\n\n```\nif [ ! -d ~/backups\
    \ ]; then\n    mkdir ~/backups\nfi\n```\n\nIn this example, then doesn't require\
    \ a semicolon because it is a keyword rather than a command."
  merge: -1
  pgno: 176
