    ```


    When you set the message variable, the shell doesn''t treat the single quotes
    around $deal as special characters, because the whole value has been enclosed
    in double quotes. Instead of using $deal literally, the shell performs parameter
    expansion, replacing the deal variable with its value in the output. The backslash
    before the last dollar sign is an escape character: it tells the shell to use
    a literal dollar sign at the end of the message. In the output, the backslash
    is omitted.


    Although expansion is the shell''s default behavior, the double quotes are required
    to ensure the shell expands only what you intend and ignores the rest.


