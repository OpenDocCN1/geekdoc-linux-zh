    # Quantifiers


    The regex you use is very simple. The complexity of regexes tends to come in when
    you need to accommodate edge cases: inputs that are unusual but thus need to be
    accounted for. You have to be explicit about what you can and cannot allow. You
    saw this with the email address example: it''s not enough to look for something
    before and after at an sign—you need to check for dots and invalid characters
    as well.


    Next, you''ll refine this expression to eliminate some of the invalid addresses.
    You''ll start with the text @yahoo.com, which isn''t a valid address since it
    doesn''t have anything before the @. The current regex matches this invalid text
    because it allows any characters before and after the at any number of times—which
    includes zero times!


    You need to change the number of characters allowed before and after the at to
    be at least one. To do this, you''ll use a different quantifier, the regex element
    that specifies how many characters are allowed for that part of the pattern. Table
    4-1 offers a quick reference guide for regex quantifiers.


    # Table 4-1: Regex Quantifiers


    | Quantifier | Meaning |

    |---|--|

    | * | Any number of characters |

    | + | At least one |

    | ? | Between zero and one character |

    | {n} | Exactly n occurrences of the character |

    | {n,} | n or more occurrences of the character |

    | {n,m} | Between n and m occurrences of the character |


    Currently, you''re using the * quantifier to allow any number of characters. Replacing
    the asterisk with the plus sign (+) specifies that at least one character is required
    before and after the at sign:


    .+.*


    Enter this new regex in Regular Expressions 101. You should get the following
    matches:


    ```

    dave@effective-shell.com

    dave@effective-shell

    to: dave@effective-shell.com <Dave Kerr>

    dave@effective-shell.com

    test123.effective-shell.com

    ```'
