- img_proc: true
  md: "# Looping Forever\n\nSometimes you want a while loop to loop forever, which\
    \ is known as an infinite loop. For instance, you could be writing a script that\
    \ reads an option from the user, processes it, and then starts again.\nThis example\
    \ demonstrates an infinite loop for a simple text-based game menu. The loop uses\
    \ the true command, which always returns a successful status, ensuring the loop\
    \ continues indefinitely:\n\n```\nwhile true\n  echo \"1\" Move forward\n  echo\
    \ \"2\" Move backward\n  echo \"3\" Turn left\n  echo \"4\" Turn right\n  echo\
    \ \"5\" Explore\n  echo \"0\" Quit\n\n  read -p \"What will you do: \" choice\n\
    \  if [ \"$choice\" -eq 0 ]; then\n    exit\n  fi\n  # The rest of the game logic\
    \ would go here.\n  ...\nndone\n```\n\nInside the loop, the script displays a\
    \ menu of options for the user. If the user selects 0 to quit, the exit command\
    \ terminates the entire script. Otherwise, the loop repeats, allowing the user\
    \ to continue interacting with the menu.\nThis example shows a common pattern\
    \ for an infinite loop: offering a menu of options that the user can call repeatedly\
    \ until they decide to quit.\n\n# The until Loop\n\nThe until loop operates similarly\
    \ to the while loop, except that it runs until the test commands return success.\
    \ The structure of the until loop is just like the while loop:\n\n```\nuntil test-commands\n\
    \  conditional-command 1\n  conditional-command 2\n  conditional-command n\ndone\n\
    ```\n\nAs long as the test commands do not return success, the loop will run the\
    \ conditional commands. After the conditional commands have been run, the loop\
    \ returns to the beginning and evaluates the test commands again."
  merge: -1
  pgno: 199
- img_proc: true
  md: "Here’s an example of an until loop that builds a random number at least 15\
    \ characters long:\n\n```\n# Create an empty number string; you'll build it up\
    \ in the loop.\nrandom_number=\"\"\n# Keep looping until the random number is\
    \ at least 15 characters long.\nuntil [ \"\\${random_number}\" -ge 15 ]\ndo\n\
    \  random_number+=RANDOM\ndone\necho \"Random Number: ${random_number}\"\n```\n\
    \nThe script initializes the variable random_number as an empty string. Then,\
    \ in each loop iteration, (${random_number}) (the parameter syntax you saw in\
    \ Chapter 11) checks the string length, and random_number+=RANDOM appends a random\
    \ number to the string. When the string's length is greater than or equal to 15\
    \ characters, the loop stops.\nWhen run this script, you should see something\
    \ like this:\n\nRandom Number: 36427237146222729\n\nIn general, I recommend using\
    \ while loops rather until loops. Programming languages commonly feature while\
    \ loops, so anyone reading the code will likely be familiar with them, whereas\
    \ until loops are a bit rarer.\nYou can easily turn any until loop into a while\
    \ loop by inverting your test commands. For example, you could rewrite the previous\
    \ until loop like:\n\n```\nrandom_number=\"\"\nwhile [ \"\\${random_number}\"\
    \ -lt 15 ]\ndo\n  random_number+=RANDOM\ndone\necho \"Random Number: ${random_number}\"\
    \n```\n\nThis changes the condition from -ge 15 (greater than or equal to 15)\
    \ to -lt 15 (less than 15). The while loop version of the script will probably\
    \ be a little easier for most readers to parse.\n\n# The continue and break Statements\n\
    \nAs mentioned earlier in the chapter, the continue statement can be used to skip\
    \ an iteration in a loop. The break (\"exit loop\") statement can be used to stop\
    \ running the loop altogether.\n\nWhen you use the continue statement, you're\
    \ telling the shell that you want to stop the current iteration of the loop and\
    \ move on to the next iteration. You can use as many continue statements as you\
    \ like in a loop."
  merge: -1
  pgno: 200
