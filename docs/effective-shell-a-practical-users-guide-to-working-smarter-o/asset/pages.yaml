- img_proc: true
  md: '[0-9]+\ At least one number in the range 0 to 9

    man Two spaces and the letters man


    **NOTE** Chapter 4 covers the basics of regex that you''ll need to understand
    for the rest of the chapter.


    You might wonder why there''s a slash before the plus sign (+). By default, grep
    uses regular expressions, which have a slightly different syntax for the extended
    regular expressions that are explained and used in Chapter 4. In addition to the
    plus, the ?, |, (, and ) characters must be escaped with a backslash in basic
    regex.


    If you prefer to work with extended regexes, you can use the -E ("extended") flag
    as follows:


    ```

    $ history | grep -E "[0-9]* man"

    ```


    Or you can use the eg tool, which uses extended regexes by default:


    ```

    $ history | egrep "[0-9]* man"

    ```


    I recommend always using extended regexes (egrep or grep -E) because they are
    widely supported and the most commonly used syntax in regex resources examples
    online. To learn more about the difference between the slightly old-fashioned
    regex and the more modern extended regexes, run man_format to check out the regex
    page.


    You may notice people using the -P ("Perl") option to enable compatible regex.
    Perl regex offers advanced features and are often considered the most versatile
    and powerful flavor of regex, widely adopted in modern programming tools and libraries.
    However, not all versions of grep and egrep offer this option. In general, the
    expressions shown here are also Perl-compatible.


