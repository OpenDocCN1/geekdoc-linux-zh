  md: '# 12


    # # USING LOOPS WITH FILES AND FOLDERS


    A loop is a fundamental programming construct that performs a sequence of operations
    based on whether certain conditions are met. You can run loops over multiple items,
    such as files, folders, variables, or the results of a command, and then perform
    actions on these items. Loops allow you to efficiently execute repetitive tasks,
    saving time and reducing the risk of errors in your scripts.


    In this chapter, you''ll learn all about for, while, and until loops how to use
    them to work with files and folders. You''ll then revisit the common command you
    created in Chapter 9 by adding some loops to make your script more efficient.'
