    The text you''re editing in Vim is called a buffer, which you can think of as
    a view on a file. When you open a file, you''re loading the content into a buffer,
    which is what Vim shows. When you want to create a new file, you enter text in
    a new buffer and save it when you''re ready.


    Vim shows you in the status line that you have a buffer cheatsheet.md and it is
    new—that is, you haven''t saved it.

    The extension md is for Markdown, a plaintext format that is great for documentation.
    You write text normally, but you can also use special characters to format that
    text, such as the hash mark (#) for headers and the hyphen (-) for bullets. Markdown
    is rendered in a very readerfriendly way when viewed in environments like GitHub.


    Enter insert mode:


