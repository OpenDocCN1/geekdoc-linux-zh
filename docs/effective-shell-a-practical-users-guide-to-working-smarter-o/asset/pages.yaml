  md: '# Understanding Variable Scope: Environment vs. Shell Variables


    Variables can be broadly categorized by their *scope*, or where they can be accessed.
    An *environment variable* is shared across your shell session and any commands
    you run. By convention, environment variables appear in all uppercase letters,
    and they often contain useful values that describe your system and how it is configured,
    like those listed in Table 10-1.


    Table 10-1: Commonly Used Environment Variables

    | Variable | Description |

    |---|---|n| SHELL | The current shell, such as bash |

    | USER | The current user (on my machine, this is dwmkrerr) |

    | HOME | The current user''s home directory (on my machine, this is /home/dwmkrerr)
    |


    To use the value of a variable in the shell, you start with the dollar sign ($)
    to specify the variable name:


    ```

    $ echo "Your pager is: $PAGER"

    Your pager is: less

    ```


    The PAGER variable specifies what pager program the shell should use—in this case,
    the list program.

    A list of the environment variables currently set in your system, use the env
    ("set or print environment and execute command") command:


    ```

    $ env

    SHELL=/bin/zsh

    LSCOLS=ExFx8DxCxegedababacad

    COLORTERM=truecolor

    PYENV_SHELL=bash

    ```


    This will vary depending on the operating system you are using and its configuration,
    but it will be quite long.

    Unlike environment variables, *shell variables* are not shared across groups but
    only within your current shell session. These variables let store temporary values
    for use in scripts or at the command line. To create or set a shell variable,
    enter the name you want to use followed by an equal sign (=) and the value to
    assign within double quotes:


    ```

    $ name="Dave"

    $ location="Singapore"

    $ echo "Hello $name in $location"

    Dave in Singapore

    ```


    This creates two variables: one called name with the value Dave, and one called
    location with the value Singapore. As with environment'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'variables, when you want to use the value of a shell variable in a command,

    you put a dollar sign before it.


    It''s best practice to use lowercase for shell variables to distinguish them

    from environment variables. This convention also helps reduce the risk of

    overwriting the value of an environment variable, which can have unex-\pected
    results.


    For example, in this snippet I accidentally overwrite the USER variable:


    ```

    USER="Dave Kerr"

    ```


    Now, if I try to go to my home directory with cd /home/$USER, this com-mand will
    fail because my system expects USER to be my username, dunkerr,

    i I''ve set it to something else. Instead of /home/dwkerr, my system is look-ing
    for a directory named /Dave Kerr, which doesn''t exist.


    Fortunately, if you overwrite an environment variable like this,

    impact is limited to the script you''re running or your current shell session;

    other running programs won''t be affected.


    # Exporting Shell Variables as Environment Variables


    By default, shell variables are isolated to the current process. That means

    y you run any process after your shell, as another shell script or

    program, by design your shell variables won''t be inherited by child-process.
    But what if you want them to be?


    In that case, you can use the export (''set export attribute'') built-in

    keyword to tell the shell to export the variable as an environment variable.

    Environment variables are always inherited by child processes, so if you

    need to pass certain values or settings to a child process, you''ll likely

    want to export your shell variable.


    As an example, you may want to have programs run in a

    "debug mode" where they display more diagnostic information to the user.

    You could set the following variable to activate this option:


    ```

    $ export DEBUG_MODE=1

    ```


    The export keyword promotes the DEBUG_MODE shell variable to an envi-nment so
    that it''s accessible to any child processes. (Notice the\all-caps convention
    here you''re using an environment variable.) Now,

    any new program you create can just check the value of DEBUG_MODE to deter-mine
    whether to output the extra information. You can test it out

    by running a new shell with the sh command:


    ```

    $ sh -c ''echo Debug Mode is: ${DEBUG_MODE}''

    ```


    The -c ("command") parameter tells the shell program you''re providing a

    liter that will run in its own process (often called a subshell). Don''t worry
