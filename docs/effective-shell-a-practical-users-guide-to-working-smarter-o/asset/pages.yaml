  md: 'The HISTFILE variable locates your history file, and tail returns the last
    10 commands from that file.

    Just like head, you can limit the number of lines tail returns by specifying a
    number with the -n flag:


    ```

    $ tail -n 3 $HISTFILE

    cd

    git stash pop

    tail $HISTFILE

    ```


    Now you see only the last three commands from the history file.

    You can also use the tail command to show the changes to a file in real time.
    The -f ("follow") flag to follow the contents of the history file and see when
    a new line is added to the file:


    # $ tail -f $HISTFILE


    Then, in another terminal, start entering commands. You''ll see the tail command
    in the first window writes the updates to the terminal as you enter them. (Note
    that on Linux the history file is updated only when the shell updates). Press
    CTRL-C to close the tail program.

    Though it''s unlikely you''ll tail to follow your history file in practice, as
    an example. A more common case is to run tail on a logfile that is being written
    while some kind of process is running. This lets you see the log entries as they
    are added to the file in real time.

    Another trick is Use a lot with tail is to strip the first line, header, or from
    a file with the -n +2 parameter. The plus sign (+) indicates that you want to
    return everything from the line specified (2, in this case) onward. Here''s how
    you might use it:


    ```

    $ head ~/effective-shell/data/top100.csv | tail -n +2

    "1","93","Black Panther (2018)","515"

    "2","94","Avengers: Endgame (2019)","531"

    "3","93","Us Us (2019)","536"

    "4","97","Toy Story 4 (2013)","445"

    "5","99","Lady Bird (2017)","393"

    "6","100","Citizen Kane (1941)","94"

    "7","97","Mission: Impossible - Fallout (2018)","430"

    "8","98","The Wizard of Oz (1939)","120"

    "9","96","The Irishman (2019)","441"

    ```


    This command pipes the results of the head command into tail -n +2 to grab everything
    from the second line, removing the heading line so you see only the films, the
    column names Rank, Rating, Title, and Reviews.

    You''ll use head and tail a lot working with text. Two crucial tools can really
    help you be efficient, especially when you combine them with other commands or
    run them in pipelines (which are described in detail in Chapter 2).'
