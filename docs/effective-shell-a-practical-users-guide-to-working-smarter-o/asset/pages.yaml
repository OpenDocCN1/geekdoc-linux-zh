    - To reset a trap, run trap SIGNAL, which will remove any trap handler.\n- Test\
    \ your traps by sending a signal explicitly to your script with kill -s SIGNAL.\n\
    \n# Processing Complex Script Parameters\n\nThe getopts (\"parse option arguments\"\
    ) command makes it much easier to handle the options that users set when calling\
    \ your scripts. It takes two parameters. The first is an option string, which\
    \ defines what options are allowed. This string starts with a colon followed by\
    \ one or more letters, where any letter followed by a colon expects you to provide\
    \ a value. The second parameter is the name of the variable that will store each\
    \ option as getopts processes it.\nYou use getopts in a while loop with a case\
    \ statement to iterate through each option and determine what it should do.\n\
    Say you want to update the common command from the previous to support the -h\
    \ (\"help\") and -e (\"execute\") parameters. The processing could look like this:\n\
    \n```\n# Helper function to show how the command should be invoked\nhelp() {\n\
    \  echo \"usage:\"\n  echo common [-h] [-e <command_number>] count\n}\n```"
