    \ of commands for every item in a list and has the following structure: Finally,\n\
    \n```\nfor name in words\ndo\n    conditional-command 1\n    conditional-command\
    \ 2\n    conditional-command n\ndone\n```\n\nThe for loop defines a variable called\
