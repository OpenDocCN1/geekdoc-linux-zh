    \ can use the local keyword to define a locally scoped variable, meaning one that\
    \ is available to the current function (and, thanks to dynamic scoping, to any\
    \ functions it calls directly or indirectly):\n\n```\nrun_loop() {\n  local count=0\n\
    ```"
