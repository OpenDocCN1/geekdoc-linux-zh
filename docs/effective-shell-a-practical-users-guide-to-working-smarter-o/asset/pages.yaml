- img_proc: true
  md: 'Operating systems handle profile loading differently, for example, macOS starts
    a login shell when you run Terminal, while Linux desktop environments typically
    load /etc/profile through their display manager. There''s a very good discussion
    on this topic on StackExchange at https://unix.stackexchange.com/questions/119627/why-are-interactive-shells-on-osx-login-shells-by-default.


    When a login shell closes, it will run any commands in the `~/.bash_logout` file.
    Users might forcibly terminate the process, which means that you cannot be sure
    this file will always be sourced as the shell exits.


    The configuration performed by these startup files varies from distribution to
    distribution, but in general they will do at least the following:


    +   Set the PATH variable to include the appropriate folders for tools for your
    distribution.

    Set the shell prompt, the characters to the left of the cursor prompting you (such
    as "$'' when you''re in the home folder, or "#'' if you''re in the home folder
    as a superuser—that is, a user with permissions to modify the shell with the sudo
    command).

    Set up autocompletion (the feature that allows you to press TAB at suggestions
    when entering commands).

    Load the `/etc/bash.bashrc` and `~/.bashrc` files.


    There are very few circumstances in which you should change any of these files.
    Think of them as an operating system-specific configuration that makes a login
    shell functional.


    # A SHELL CONFIGURATION CHE SHEET


    The various configuration files can be confusing for many people. But now that
    you understand the different types of shells, these files are actually quite straightforward.


    +   When an interactive shell starts, it attempts to load the "run commands" (rc
    files at `/etc/bash.bashrc` and `~/.bashrc` (if they exist), which contain the
    shell configuration for all users and for a specific user, respectively.

    When a non-interactive shell starts, it doesn''t load any configuration files,
    unless one has been specified in the BASH_ENV variable.

    In most cases, when you log in to a machine or change user, a login shell starts,
    and the following steps take place:

    The shell attempts to load the profile file, which is generally used to implement
    essential system-wide configuration.

    The profile file typically loads the rc files, which apply user-level customizations.'
