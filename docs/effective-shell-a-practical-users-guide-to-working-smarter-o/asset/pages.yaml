  md: '# Installing the Lookup Tool


    The great thing about a Python script like the one you just built is that it is
    stand-alone. Anyone can install it on their system with very little effort.

    All you need to do is first tell the shell that it can execute the script using
    the python3 program. To do this, put a shebang at the top of the file so:


    ```

    #!/usr/bin/env python3


    # ...rest of the code goes here has been omitted for brevity.

    ```


    This shebang uses the env program to locate the lookup.py. This is important,
    python3 might be installed in different locations on systems. You can read more
    about how to use env shebangs in Shell Chapter 9.

    Now that you have a shebang, you can make the file executable using a symbolic
    link to your local bin folder:


    ```

    $ chmod x ~/effective-shell/programs/lookup.py

    sudo ln -s ~/effective-shell/programs/lookup.py /usr/local/bin/lookup

    ```


    To review how to use the chmod and ln tools to install scripts, see Chapter 9.

    You''re putting the symlink to the folder /usr/local/bin which is commonly used
    to store user-installed programs (rather than /usr/bin, which where programs installed
    by package managers go).


    > Administrator privileges are required to install programs to the /usr/local/bin
    folder. Some users prefer to create a folder in their home directory, such as
    ~, and then keep their personal programs there. The ~/bin folder is then added
    to the PATH variable in the shell configuration file. See "Creating a Local bin
    Directory for Custom Commands" on page 210 for more details.


    With the tool now installed, you can run it like:


    ```

    $ lookup -c -- effective

    effective: A soldier fit for duty

    shell: A hard external covering of an animal.

    ```


    The final version of the script, lookup.py, includes additional features, one
    of which is the -- "end of options" marker, the Linux convention to indicate that
    the list of flags is complete and what follows is the list of positional parameters.
    If you don''t include this marker the tool would think you''re providing effective
    as the value of the -c flag. Many Linux tools support this separator; enter man
    bash to find out more.'
