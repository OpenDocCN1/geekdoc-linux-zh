  md: 'in printed text, so be sure to try it out in your shell. When the shell reaches
    the end of the search and can''t find any more file entries, the prompt will change
    to something like:


    ```

    (failed reverse-i-search)

    ```


    Press ENTER to get back to the regular prompt. Searching forward with CTRL-S works
    in the same way.


    If code lines are long, these two shortcuts are often the fastest ways to move
    to the desired location in the current line. You can also use them to quickly
    search through your entire command history. For example, to find your last `mkdir`
    command, and then press CTRL-R to search backward through all `mkdir` commands
    stored in your history.


    A quick way to test this is to search for echo. If you''ve been using the echo
    command to enter the quote in the earlier examples, it should be the first result
    that the reverse search finds.


    When you find the command, just press ENTER to execute it. If you want to edit
    the first command, use the left or right keys to go back into normal editing mode.
    This would be useful if, you want to rerun a `commandname` command but on a different
    file. You can search for `commandname` and then change the filename.


    If you want to cancel the search completely, press CTRL-G. The search prompt will
    disappear, and whatever you have in the command prompt before you started will
    be returned.


    # Editing in Place


    When working with a long or complex command, you might find it easier to use a
    text editor instead of the shell. You could copy the command, paste it into your
    favorite editor, edit it, and then paste it back into the shell. However, in most
    cases you can open your text editor right inside the shell.


    The default editor for the shell is often to Vim, which you''ll see in detail
    Chapter 23. Before going any further, set your editor to nano, which is more user-friendly,
    so:


    ```

    $ export EDITOR=nano

    ```


    If this command doesn''t make sense at the moment, don''t worry—it will soon.
    You''ll also learn about customizing shell features such as the default editor
    in Chapter 15.


    Now that you''ve set the default editor to nano, you need to enter two shortcut
    combinations to open it: first, press CTRL-X to signal to the shell you''re about
    to enter a command, and then press CTRL-E to edit in place. If you don''t have
    any executed code on your command line, the text editor will be empty when it
    opens; otherwise, it will show your current command.'
