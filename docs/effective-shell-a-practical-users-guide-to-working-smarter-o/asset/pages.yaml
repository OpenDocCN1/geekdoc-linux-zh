  md: 'What if you use a different shell or forget where the history file lives? In
    that case, you can use the history (“show history”) command, which prints each
    line of the history file, along with the line number. This approach might be a
    little more intuitive than trying to remember where the history file is stored
    or the name of the HISTFILE variable.


    The history command writes to stdout. If you do not give grep a source file, it
    will search stdin. This means you can use a pipeline and grep the output of the
    history command. (For more on pipelines, stdin, and stdout, see Chapter 2.) Here’s
    how you could search the history for the man:


    # $ history | grep man


    ```

    ...

    9125 man socket

    9188 k describe services eventstoreddb-http-management

    9211 man cal

    9341 gbc refactor/performance/standardize-eventstore

    9344 v1 src/tests/handlers/command_handlers.py

    9347 gco src/handlers/command_handlers.py

    9352 gbc feat/performance/use-eventstore-writer

    9355 nvim performance.md

    10002 man grep

    ```


    This demonstrates an important feature of grep: you can search through any text
    you pipe to it.


    The number before each command is the line number of the command in the history
    file. These numbers are useful because you can rerun any command from the history
    file by entering an exclamation point followed by the line number. For example,
    entering


    ```

    $ 19355

    ```


    reruns line 9355 of the history. In my case, this is the nvim performance.md command,
    which opens a Markdown file I was working on in my text editor.


    # ## Using grep with Regular Expressions


    The preceding output shows that searching through my history didn’t find times
    I executed the man command; it also found any line containing man.


    What if you want to find only the lines that start with man? To search for a pattern
    like this, you can use a regular expression:


    # $ history | grep \[0-9]*\ man"


    ```

    ...

    9125 man socket

    9211 man cal

    10002 man grep

    ```


    This regex is made up of the following components:'
  merge: -1
