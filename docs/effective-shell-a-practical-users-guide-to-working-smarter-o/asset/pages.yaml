    # Expand on Array


    Array expansion is partly covered in Chapter 10. The expression ${!array[@]} expands
    to the indices (or keys, in the case of an associative array) for each item in
    an array:


    ```

    days=("Monday" "Tuesday" "Wednesday" "Thursday" "Friday" "Saturday"

    "Sunday"

    echo ${!days[@]}

    ```


    Now, you can loop over or perform other operations on the indices of the array.


    # Find the Length of a Parameter or an Array


    The ${#parameter} expression expands to the length of the value in the parameter
    named parameter:


    ```

    word="Supercalifragilisticexpialidocious"

    echo "Length of word: ${#word}"

    Length of word: 34 characters

    ```


    You can also use this expression to find the length of an array; simply append
    [@] like so:


    ```

    days=("Monday" "Tuesday" "Wednesday" "Thursday" "Friday" "Saturday"

    "Sunday"

    echo ${#days[@]} days in the array

    There are 7 days in the array

    ```


    You may have noticed a pattern by this point: you can perform many parameter expansions
    on an array simply by appending [@] to the parameter name. The [@] translates
    to "all of the array members," so without it, the shell uses only the first element
    of the array.'
