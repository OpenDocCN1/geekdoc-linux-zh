  md: '“captures” or remembers the matched text so you can reference it later (see

    Chapter 4 for more on capture groups and regexes in general).

    Let’s look at an example. You can get the name of the current shell

    binary as follows:


    ```

    shell_regex="*\/(.+)$"

    if [[ $SHELL =~ $shell_regex ]]; then

