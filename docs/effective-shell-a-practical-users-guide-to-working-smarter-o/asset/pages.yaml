  md: '# The Clipboard


    Different shell environments and operating systems manage the clipboard in different
    ways. Being able to quickly copy and paste to and from the shell is essential
    to using it effectively. This section will explain how the clipboard works on
    different systems and how to create your own clipboard commands that work across
    systems.


    # Mastering Clipboard Essentials


    You''re probably familiar with the common keyboard shortcuts to copy and paste
    content to from the clipboard: CTRL-C and CTRL-V on Linux and Windows, Command-C
    and Command-V on macOS. However, these commands don''t work the same way in every
    shell. For example, I have tried to use CTRL-V a few times to paste into a terminal
    on Ubuntu:


    ```

    $ ^v~

    ```


    Instead of pasting the contents of the clipboard into the shell, this key combination
    has written the characters ^ to the terminal. Why is this?

    One reason is historical (the shell has been around for a long time, so you''ll
    see this as a lot). Using CTRL in a shell sends a signal—a special command the
    shell uses to control programs. Specifically, by using CTRL you''re signaling
    your intention to perform an action rather than enter with your next keystroke.
    Most modern operating systems have adopted this convention. For example, CTRL-S
    is used almost universally as a shortcut for the save command.

    Modern shells tend to follow the conventions established by earlier shells to
    ensure a consistent experience for users. Both CTRL-C and CTRL-V have long had
    specific meanings in the shell that negate the current copy and paste shortcuts.
    Using CTRL-C cancels a running program by telling the shell to send an interrupt
    signal to the program, which terminates it. You''ll see signals again and again
    through the book.


    What about CTRL-V? This is the fancy-sounding verbatim insert command. It tells
    the shell to write out the keystroke directly to the screen rather than interpreting
    it as a CTRL command. By using CTRL-V, you can write special characters like the
    escape key, left or right keys, and even the CTRL-V combination itself as in the
    previous example.

    If you type CTRL-V twice, the shell writes out the text ^ or caret symbol (*)
    represents CTRL. The first CTRL-V tells the shell to write out the following command,
    so the second CTRL-V is written out verbatim, meaning the text representation
    of the command is displayed.


    You can try out some different sequences. You''ll see various odd-looking symbols
    for special keys like the ALT key.

    Because the shell is already using the keyboard combinations you''d normally use
    for clipboard commands, you''ll need alternatives for those functions. The instructions
    I provided next for your particular platform.'
  merge: -1
  pgno: 443
- img_proc: true
  md: '# Windows


    If you''re using Command Prompt, then the usual shortcuts will work fine.

    However, if you are using Windows Subsystem for Linux (WSL) and bash,

    you will need to tweak the configuration.


    To set up an alternative, go to Properties Options, select Use Ctrl+Shift+C/V
    for Copy/Paste, and click OK. You can now use CTRL-SHIFT-C for copy and CTRL-SHIFT-V
    for paste. To select text, hold down the right mouse button and drag it over it.


    # Linux


    On most Linux systems, you''ll be using GNOME Terminal or KDE''s Console, which
    means that you can use CTRL-SHIFT-C for copy and CTRL-SHIFT-V for paste. To select
    text, hold down the right mouse button and drag over it, or right-click the text.


    # macOS


    Mac users can just use ⌘-C for copy and ⌘-V for paste. The shell doesn''t recognize
    the special Mac character ⌘, so these shortcuts don''t clash with any existing
    ones. To select text, hold down the left mouse button and drag over it.


    # Creating Custom Clipboard Commands


    Copying and pasting text to from the clipboard is useful, but you can do a lot.
    With a couple of basic commands, you can hugely expand your capabilities and make
    everyday tasks easier to accomplish. However, there''s one small hurdle to clear
    first: the clipboard is accessed in different ways on Windows, Linux, and macOS.
    In other words, there''s no standard tool you can use across all three platforms
    to manage the clipboard.


    To address this problem, I will walk Windows and Linux users through creating
    two clipboard commands that will work across platforms: pbcopy and pbpaste. If
    you''re a Mac user, you don''t need to do anything; pbcopy and pbpaste are built
    in macOS.


    # Windows


    Assuming you''re using WSL, you''ll need to run the following two commands:


    ```

    $ alias pbcopy="clip.exe"

    $ alias pbpaste="powershell.exe -command Get-Clipboard | tr -d ''\r'' | head -n
    "1"

    ```


    Don''t worry about now how these commands work; by the time you''ve gone through
    the book, they should make perfect sense.'
  merge: -1
  pgno: 444
- img_proc: true
  md: '# Linux


    On Linux, first you install the xclip program and then set up the pbcopy

    and pbpaste commands to use it:


    ```

    $ sudo apt install -y xclip

    $ alias pbcopy="xclip -selection c"

    $ alias pbpaste="xclip -selection c -o"

    ```


    If you''re already confident with how xclip works and want to use it

    directly, there''s no need to run these commands.


    For both Windows and Linux, you''ve used the alias command to create

    pcopy and pbpaste. In bash (and most shells), an alias is a shortcut for a lon-\ger
    command.


    You''ll need to repeat these instructions every time you close and reopen your
    terminal.

    Chapter 15 explains how to make permanent customizations to your shell so that
    you

    don''t have to repeat this setup.


    # Copying and Pasting with pbcopy and pbpaste


    Now you can use the pbcopy and pbpaste commands to access the clipboard

    from the shell.


    The ~/effective-shell folder contains a text file with the names of some

    characters from the TV The Simpsons. Open simpsons-characters.txt in

    your text editor and copy the following text from it:


    Kirk Van Houten

    Timothy Lovejoy

    Artie Ziff


    Then paste it into the shell as follows:


    $ pbcopy

    Kirk Van Houten

    Timothy Lovejoy

    Artie Ziff


    Rather than copying the text by opening your text editor (which breaks

    out of your shell flow), you could use the cat command to write the

    entire contents of the simpsons-characters.txt file to the screen and then manu-

    alect the text and copy it. However, this approach is fiddly and wouldn''t

    be convenient if the file was large and you had to scroll to find it.


    Instead, you''ll use a pipeline to pass the output of the cat command into

    pcopy:


    ```

    $ cat ~/effective-shell/text/simpsons-characters.txt | pbcopy

    ```


    Now try pasting—you should see the contents of the file.'
  merge: -1
  pgno: 445
- img_proc: true
  md: 'The | symbol is the pipe operator, which is used to "chain" commands together
    in a pipeline. Here, the pipe tells the shell to take the output from the command
    on the left and send it straight to the input of the program on the right. Pipelines
    are covered in detail in Chapter 2, and you''ll see them in use throughout the
    book.


    # # Getting Help


    Being able to access help quickly, without jumping to a browser and disrupting
    your flow, is one of the most crucial things you can do to become an effective
    shell user. A wealth of information is available directly in the shell, only a
    few keystrokes away.


    This section will introduce you to the man ("manual") command, the standard help
    system available on all Unix-like systems. You''ll also learn about a useful tool
    you can install tldr which might be more helpful for day-to-day use. Finally,
    we''ll take a look at the cht.sh site for circumstances when you need to access
    a browser for help.


    # # Using the Manual


    The man command can help you with tools, commands, and concepts. Most tools you
    encounter in the shell have manual pages (man pages for short) available.


    The basic way to get help with a command is by entering the name as the first
    parameter of man:


    ```

    $ cp

    ```


    CP(1) BSD General Commands Manual CP(1)

    NAME

    cp -- copy files

    SYNOPSIS

    cp [-R -H] [-L | -P]] [-fi] [-n] [-avx] source_file target_file

    cp [-R -H] [-L | -P] [-fi] [-n] [-avx] source file ...

    target_directory


    DESCRIPTION

    In the synopsis form, the cp utility copies the contents of the source file to
    the target_file. In the second synopsis form, the contents of each named source
    file is copied to the destination_directory. The names of the files themselves
    are not changed. cp detects an attempt to copy a file to itself, the cp will fail.


    ...


    This opens the man page for the cp command, detailing all of its command line
    options and specifies on how to use it. This information can be rather lengthy,
    but fortunately the shell includes a feature to help you navigate it.'
