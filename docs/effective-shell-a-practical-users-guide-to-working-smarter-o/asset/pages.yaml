  md: 'Well, this kind of worked. The first three matches are correct. The command
    found the keys, but it also found any line that includes a colon.

    The pattern `[^:]+` means "find at least one character that is not : character
    but is followed by the : character." This simple expression finds everything the
    first colon, including any text in the rest of the file that contains a colon.
    The text beginning on the fourth line is just a sentence from the chapter.


    To improve on it, you could tell the shell not to include lines that have space
    characters before the colon and be explicit that the pattern you''re searching
    for at the start of the line:


    ```

    $ grep -E ''[^:]+:'' chapter7.md | head

    title:"Advanced Text Manipulation"

    slug: advanced-text-manipulation

    weight: 14

    "2", "94", Avengers Endgame (2019), "531"

    ```


    The pattern now starts with the caret (^), which means "start of line," found
    by `[^ ]` to search for "anything that is not a colon or space." But notice this
    command also found a film title from the text, because just like the YAML, this
    line doesn''t have any space characters before the colon.


    To improve the pattern further, you could eliminate lines that have quotation
    marks before the colon, as quotes are not valid in YAML keys. The pattern looks
    like this:


    ```

    $ grep -E ''[^:]+:'' chapter7.md | head

    title:"Advanced Text Manipulation"

    slug: advanced-text-manipulation

    weight: 14

    ```


    By refining the regex, you''ve ensured that grep will find only the YAML keys.
    Using grep is a quick way to iteratively build your regex until it does what you
    want it to. Now you can take this regex and use it in sed.


    # BUILDING REGULAR EXPRESSIONS


