  md: 'If you''re using the Z shell, this key combination will delete the entire line
    regardless of where your cursor is. If you''re not sure what shell you''re using,
    look at the prompt next to your cursor. If it starts with a hash mark (#) or dollar
    sign ($), it''s probably bash. If it starts with a percent symbol (%), it''s probably
    the Z shell. On most Linux machines, your shell will be bash by default. On macOS
    systems from 2019, it will be the Z shell. To see exactly what you have, run echo
    $SHELL.


    To delete everything from the cursor to the end of the line, CTRL-K:


    ```

    echo "When you light a candle, you also cast a shadow." - Ursula Le Guin >> note.txt

    echo "When you light a candle, you also cast a shadow."

    ```


    This work will change the same way in bash and the Z shell.


    # Undo Change


    Bash also has an undo shortcut: CTRL-_ (underscore) will undo the most recent
    change.


    If you find yourself repeatedly using the arrow or delete keys, refer back to
    this section to remind yourself of the shortcuts. They''ll save you a lot of time
    in the long run!


    # Search Commands


    Once you have the basic navigation commands, the next essential shortcuts are
    search commands. Starting with the current line, you can search backward or forward
    in your command history with CTRL-R and CTRL-S, respectively.


    Let''s look at an example. Run these commands on three separate lines to create
    empty files:


    ```

    $ touch file1 file2

    $ touch file4 file5 file6

    $ touch file7 file8 file9

    ```


    Now press CTRL-R to start searching, and you''ll see a search prompt in your shell.
    Because you''re searching backward, the prompt tells you that you''re doing a
    reverse search. At the prompt, enter file and press CTRL-R repeatedly:


    ```

    (reverse-i-search) ''file'': touch file7 file8 file9

    (reverse-i-search) ''file'': touch file7 file8 file9

    (reverse-i-search) ''file'': touch file7 file8 file9

    (reverse-i-search) ''file'': touch file4 file5 file6

    ```


    The shell will search the previous commands for the term file, jumping back each
    time you press CTRL-R. This is quite hard to visualize'
