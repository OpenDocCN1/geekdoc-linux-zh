- img_proc: true
  md: 'This might look extremely complicated, but don''t worry: by the time you''ve
    finished this chapter, you''ll understand what this mess of special characters
    means.


    # The Prompt String


    You can use the PS1 variable to set your prompt string like so:


    ```

    ```dwkmerr@effective-shell-ubuntu-24:~/effective-shell$ PS1="--"

    --> echo "Look at my new prompt"

    --> Look at my new prompt!```

    ```


    The shell will use the contents of the PS1 variable to display the prompt. In
    this example, I''ve changed the prompt string from $ to --. As you can see in
    the echo command, once you set PS1 in the shell, the prompt immediately changes.


    # Escape Sequences


    Simple text works for a basic command prompt, but you can also escape sequences
    in the PS1 variable to further customize how the prompt looks. These are listed
    in Table 16-1.


    # Table 16-1: PS1 Escape Sequences


    | Sequence | Meaning |

    |---|---|

    | \a | The special "beep" character that tells the shell to play a beep sound
    through the speakers |

    | \d | The date in "Weekday Month Date" format (for example, Tue May 26) in a
    format specified by the format value (for a description, enter man strptime 3)
    |

    | \e | An ASCII escape character (03) used to print special characters |

    | \H | The hostname up to the first dot (.) |

    | \j | The number of jobs currently managed by the shell |

    | \l | The name of the shell''s terminal device |

    | \n | A newline character |

    | \r | A carriage return character |

    | \s | The name of the shell (for example, -bash) |

    | \t | The current time in 24-hour HH:MM:SS format |

    | \T | The current time in 12-hour HH:MM:SS format |

    | \@ | The current time in 12-hour AM/PM format |

    | \A | The current time in 24-hour HH:MM format |

    | \u | The username of the current user |

    | \v | The version of bash (for example, 5.0) |'
  merge: -1
