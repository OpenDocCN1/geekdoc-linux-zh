- img_proc: true
  md: '# Next Steps with tmux


    As you start to use tmux tmore, you''ll realize you can do some truly incredible
    things with a multiplexer. Selecting text from the shell without touching the
    mouse, seamlessly integrating tmux splits and Vim splits, sending commands to
    multiple machines at once, using plug-in managers to add advanced features—the
    list goes on.


    The tmux program also lets you rapidly resize, swap, or reorder panes; break a
    pane into its own window or session; and more. These commands are probably the
    next ones to learn. If you''ve enabled mode you, you can also resize panes with
    the mouse if desired. In a similar way to how a modern integrated development
    environment allows you to customize your windows and layout to suit the work you''re
    doing, tmux lets you customize, lay out, and manage almost any set of programs
    you might need.


    I highly recommend using tmux as part of your standard workflow. Get familiar
    with the basic features shown in this chapter and then, as you start to encounter
    limitations and want to do more, particular, Brian Hogan''s excellent tmux 3:
    Productive Mouse-Free Development (Pragmatic Bookshelf, 2025) is suitable for
    anyone, from beginner to expert, and will help you take your tmux skills to the
    next level.


    You can also see how I manage my own tmux configuration at https://github.com/dkberry/dotfiles.


    # Summary


    This chapter introduced you to the tmux terminal multiplexer. You learned how
    to manage windows, panes, and sessions; how to configure tmux to suit your personal
    working style; and how to use tmux to manage sessions on remote machines and collaborate
    in real time with other users.


    At this point, you''ve learned the basics of the shell, optimized your setup for
    working with it, customized your shell configuration, and created several scripts
    and programs. You''ve also explored some really sophisticated topics like SSH,
    Vim, and terminal editors. You''re truly become effective user! As you use these
    techniques more and more, they''ll become more natural, and you should find that
    you''re able to work in the shell quickly, efficiently, and without disruptions
    to your flow.


    There are many other topics to explore as you spend more time in the shell. The
    final part of this book looks at the future of the shell and generative AI. Check
    out https://effective-shell.com for even more topics and tutorials. Good luck
    with your journey!'
