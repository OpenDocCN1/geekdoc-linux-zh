    # Quoting Variables and Values


    One topic often causes a lot of confusion for new shell users: When should you
    surround a variable with quotes? While it might sound like a purely stylistic,
    quotes (or the lack thereof) can dramatically change how your script works.


    # Single Quotes


    There are two main scenarios in which you use single quotes. The first is when
    you want to use special characters in a variable declaration without the shell
    trying to interpret them:


    ```

    $ message=''~ Save $$$ on with ** "this deal" ** ! ~$

    $ echo "$Message" ** "this deal" ** | ~

    ~ Save $$$ on with ** "this deal" | ~

    ```


    When special characters or variables appear within single quotes, the shell treats
    them literally. In this example, the shell hasn''t tried to interpret the tilde
    (~) as /home/dumberr or the asterisks (*) as a wildcard pattern, and it hasn''t
    tried to use the dollar sign to reference a variable.


    Let''s revisit the example from the previous section:


    ```

    $ sh -c "echo Debug Mode is: ${DEBUG_MODE"

    ```


    The single quotes around ''echo Debug Mode is: ${DEBUG_MODE)'' prevent the current
    shell from expanding the DEBUG_MODE variable (that, replacing it with its value,
    1) so that it will pass the variable to the child process literally. When the
    child process inherits the current shell''s environment, it effectively executes
    this command:


    ```

    echo "Debug Mode is: ${DEBUG_MODE}"

    ```


    Because the child process''s input is not surrounded with single quotes, the child
    process expands and uses the DEBUG_MODE value to run in debug mode.

    The secondary way to use single quotes is for ANSI quoting, which allows you to
    include special characters that are used in the C'
