    This returns the third field, Title. Onward, to output just the second and third
    fields, specify them like so:


    ```

    $ tail -n 3 "/effective-shell/data/top100.csv | cut -d'','' -f 2,3

    \"100", "Pinocchio (1940)"

    \"99", "Chinatown (1974)"

    \"94", "The Dark Knight (2008)"

    ```


    You can do a surprising amount with the cut tool. As I introduce more complex
    tools later on, like sed and awk, you''ll see other ways to accomplish the same
    goals. But I often find that by filtering down the content with grep, I can cut
    my way to what I need without using the more complex tools.


    # Reversing Text


    The rev ("reverse") command simply reverses the given input:


    ```

    $ echo echo"A nut for a jar of tuna" | rev

    anut faj a rof tun A

    ```


    At first glance this doesn''t seem very useful, but now try this:


    ```

    $ pwd | rev | cut -d/ -f 1 | rev

    effective-shell

    ```


    This reverses the working directory, cuts the folder, and then reverses it again.
    Here is what''s happening at each stage:


    ```

    pwd

    /Users/dwkmerr/effective-shell

    rev

    llehs-evittefe/rrekmwd/sresU/

    cut -d''/'' -f 1

    llehs-evittefe

    rev

    effective-shell

    ```


    This neat extracts all of the text from the first character to the forward slash
    (/). This action would be much harder to do without reversing the text, because
    you don''t know how many levels are in the directory. This way, you can simply
    extract the last folder without knowing how many precede it.


    You won''t use this technique very often in real-world scenarios, but it''s a
    good reminder that you can do more than you think by piping together simple commands.'
