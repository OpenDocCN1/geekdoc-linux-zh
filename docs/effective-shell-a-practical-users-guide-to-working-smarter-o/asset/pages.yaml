    Now, let''s put grep to work and search through your shell command history.


    # Searching Through Text


    Most shells keep a history of the commands you enter in a special file. When you
    use the up and down arrow keys (or the CTRL-R shortcut, in the shell to look through
    commands you entered earlier, your shell is looking through this history file
    under the hood.

    The file storing this history can vary from shell to shell. For example, on my
    system, my bash history is in the ~/.bash_history file. Most bash-like shells
    provide a built-in environment variable called HISTFILE that you can use to find
    your history file so:


    ```

    $ echo HISTFILE

    home/dwkmerr/.bash_history

    ```


    The location of your history file will vary from distribution to distribution.
    As mentioned, this file contains a list of the commands you''ve executed in your
    shell. You can check it like:


    ```

    $ cat HISTFILE

    ...

    cat ~/.ssh/config

    ssh bastion.cloudops

    help echo

    help cd

    exit

    ```


    The history file is typically many lines long, and it shows some of the commands
    I ran recently, but I''ve shortened it here for the sake of brevity.

    Now try using grep to search through this file for lines containing the text as
    follows:


    ```

    $ grep man HISTFILE

