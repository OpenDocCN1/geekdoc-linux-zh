  md: 'In fact, the ssh program supports shell completion, so I can just type ssh
    and a few letters of the hostname, followed by the TAB key, and the shell will
    suggest the hosts from my config:


    ```

    ssh <etab> When I press Tab, the shell expands to this:

    ssh effective-shell-aws-linux

    ```


    Many other options are available for the SSH config file; you can run ssh_config
    to see them all. You''ll also see some other options in Chapter 24.


    # Running SSH Commands


    You don''t need to actually run a shell on a remote machine over SSH to execute
    commands. You can simply provide the commands that you want to run to the ssh
    program, and it will execute them on the server. Here''s an example:


    ```

    $ ssh effective-shell-aws-linux ''curl effective.sh | ES_EXISTING_FOLDER_ACTION=o
    sh''

    ```


    effective-shell: installed samples version 0.25.1 to ''/home/ec2-user/effective-shell''

    effective-shell: read ''effective shell'' online at: effective-shell.com


    You''re downloading and running the effective-shell samples installer on the server.
    Normally, when you install the samples, the installer will ask you whether to
    overwrite, delete, or keep the existing samples. This means that it will be requesting
    input from the terminal. But because the ssh program isn''t actually attaching
    to the remote machine, you use the ES_EXISTING_FOLDER_ACTION=o option instead
    to tell the installer to overwrite the samples.


    If you want to be able to interact with the server by using your terminal to provide
    input, use the -t ("request TTY") parameter as follows:


    ```

    $ ssh -t effective-shell-aws-linux ''curl effective.sh | sh''

    effective-shell: downloaded samples, version 0.25.1

    effective-shell: preparing to install the ''effective-shell.com'' samples...

    effective-shell: the ''/home/ec2-user/effective-shell'' folder already exists,
    would you like to:

    effective-shell: [d]lete remove the effective folder

    effective-shell: [o]verwrite extract over the existing folder

    effective-shell: [q]uit

    Your choice (d/o/q):

    ```


    In this example, my terminal is attached to the remote server via SSH, so I can
    use the keyboard to provide input to the installer script.'
