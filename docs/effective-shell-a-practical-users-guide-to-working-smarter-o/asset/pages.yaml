  md: 'You''ll see how to capture groups directly in the shell in Chapter 7, so I
    won''t go into further detail now.


    # Lazy and Greedy Expressions


    Regexes can be lazy (the regex stops as soon as it finds a match) or greedy (the
    regex continues until it finds no matches).


    Regexes are greedy by default; if you are matching a pattern, the regex will capture
    as much as it possibly can, all the way to the last match. As an example, let''s
    look at how you might capture the contents of an HTML tag:


    This text is <strong>bold</strong>.


    The regex .+ matches against a left bracket, then at least one character, and
    a right bracket. Because regexes are greedy by default, the expression continues
    beyond the first bracket (the opening <strong> tag) and matches the text all the
    way until the last bracket on the line (in the closing <strong> tag).


    To create a lazy expression, you can use the question mark (?) after +. This means
    the expression will capture as few characters as possible until it finds the end
    of the pattern:


    This text is <strong>bold</strong>.


    In this example, the regex has actually captured two results: the contents of
    the two sets of opening and closing brackets. Because the expression .+ is lazy,
    it matches until the first bracket it finds, yielding different results than the
    greedy version.


    Lazy quantifiers are a shortcut. To get the same results without using the lazy
    quantifier, you''d use an expression like this:


    This text is <strong>bold</strong>.


    In this case, you''re using the ^ for negation to specify “any character that
    is not a brace."


    # Advanced Regex Concepts


    Understanding the basics of quantifiers, character sets, metacharacters, and capture
    groups is sufficient for you to follow the regex-related examples in this book.
    However, you might encounter more advanced topics or terms in the wild. I''ll
    give a brief overview of some of those here, but if you''ve had your fill of regex
    now, you can quickly skip to the next chapter.'
