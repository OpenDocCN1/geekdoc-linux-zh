  md: 'To start using regex in sed, first print all lines that match the npat:


    ```

    $ sed -E n ''/^[^[::]]+;/p'' chapter7.md

    title: "Advanced Text Manipulation"

    slug: advanced-text-manipulation

    weight: 14

    ```


    You''ve made two critical additions to sed here. The first is the -n ("no automatic
    printing") flag, which means sed won''t show output unless you tell it to. The
    second is the p ("print") function, which will print any lines that match the
    pattern.


    Without these additions, sed will output the file to the screen like grep; it
    will show only the lines that match, which is useful when you''re building the
    command and just want to see the lines you''re going to change.


    Now, to put the result in quotes, you need to find lines where the value is not
    already quoted:


    ```

    $ sed -E n ''/^[^[::]]+$/p'' chapter7.md

    slug: advanced-text-manipulation

    weight: 14

    ```


    Let''s break down the /^[^[::]]+[^[::]]*$/p expression:


    /^[^[::]]+: Match the start of a line and any characters that are not a space,
    a colon, or a quote but are followed by a colon and a space.


    +[^[::]]*$: Match at least one space and any set of characters that do not contain
    a quote, all up to the end of the line.


    The pattern is working: it found the two unquoted keys. Now you''ll have to print
    the substitution.


    First, you''ll surround the key and value parts in parentheses to make them capture
    groups, or chunks of text you can use in the substitution. Here''s an example
    that shows how to output the capture group:


    ```

    $ sed -E n ''s/(([^[::]]+):)([^[::]]*)/Key = "\2"/p'' chapter7.md

    Key is "slug:"

    Key is "weight:"

    ```


    Remember, you''re not just searching for a pattern; you''re using the s function
    to substitute all the matched text with key "\1". The \1 means "the first match,"
    or what you found in the first capture group.


    You could easily see the second capture group, or the value, like so:


    ```

    $ sed -E n ''s/(([^[::]]+):)([^[::]]*)/Value = "\2"/p'' chapter7.md

    Value is "advanced-text-manipulation"

    Value is "14"

    ```'
