- img_proc: true
  md: '# Filtering Input


    You can use a pipeline to filter input. For example, say you''re a data scientist
    and you have a huge data file called 100GBFile.csv in your current directory.
    You can use pipes to show the first part of that file:


    ```

    $ head -n 100 100GBFile.csv > 100linefile.csv

    ```


    The head displays the number of lines you specify with the -n parameter. In this
    case, it grabs the first 100 lines of your file and puts them into a smaller,
    more manageable file whose name you designate at the right angle (>), which is
    another stream redirection symbol.

    Are lots of other ways to filter input, as you will see in Part II.


    # Standard Output Applications


    Figure 2-7 shows some of the ways you can work with standard output.


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_52_0.png)


    Figure 2-7: Common uses for standard output in pipelines


    You''ve seen some of these outputs before, but here I''ll go into a bit more detail.


    # Displaying Onscreen


    Displaying output simply means the results are shown on the screen, like much
    of what you''ve seen so far. When you''re working with the shell interactivity,
    keying in commands, it''s helpful to see the program''s output onscreen. For say,
    scheduled tasks run overnight, writing to the screen is less useful. It''s unlikely
    that you would be watching the screen, then, so it would be better to write the
    output to a file you can read later, as described shortly.


    Sometimes you''ll get a lot of output that''s inconvenient to scroll through the
    terminal. In these cases, you can use the pager program less as follows:


    ```

    $ ls /usr/bin /usr/local/bin /usr/sbin | less

    ```'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'This command lists the contents of two commonly used folders that store commands
    and then pipes the results to the less pager. The result list of commands is long,
    so it would be hard to search through the list if it were printed directly to
    the terminal. By passing it to the pager tool, you''ll see only enough of the
    output that can fit on the screen. You can press the D and U keys to move the
    output “page” at a time, and the / and ? keys to search forward and backward through
    the output, respectively.


    Piping into your pager is a useful trick. Read more about pagers in “Getting Help”
    on page 415.


    # Redirecting to a File


    When you want to store some output, perhaps to review it later or because it''s
    too big for the pager, you''ll likely want to pipe it to a file. As noted earlier,
    this is also a good method when you have jobs running in the background or on
    a miner, such as backup jobs that run nightly, you probably won''t have a terminal
    attached to the program to see the output when the overnight job is running.


    To pipe the standard output of a program and write it to a file, as follows:


    ```

    $ echo "Here''s some data" > some_file.txt

    ```


    It''s that easy! This command will create the file some_file.txt if it doesn''t
    exist but will overwrite the file if it does. Now you open some_file.txt, it will
    contain the text here''s some data.


    # Appending to a File


    If you want to add new content to a file instead of overwriting it, you use double
    angle brackets (>>), known as the append redirection operator, like so:


    ```

    $ echo "Tuesday was good" >> diary.txt

    $ echo "Wednesday was better!" >> diary.txt

    $ echo "Thursday suucks" >> diary.txt

    $ cat diary

    ```


    Tuesday was good

    Wednesday was better!

    Thursday suucks


    In the first line, you use echo to write some text to the file diary.txt. The
    append redirection operator will append to the file if it exists and create it
    otherwise. Then, in the two subsequent echo commands, you can add more text to
    that file.


    Appending to a file is extremely useful in many scenarios—for example, when you
    want to build or update a log of events over time.'
