  md: '# Omitting Shebangs


    Some scripts do not have a shebang (#! character sequence) at the top. The shebang
    allows you to be very explicit about which shell is required to run your script,
    so you should always include it.


    For example, if you see a shebang like this


    ```

    #!/usr/bin/env sh

    ```


    you would assume that this script can run on any POSIX-compliant shell; that is,
    it is as compatible as possible. However, if you see this


    ```

    #!/usr/bin/env bash

    ```


    you would assume that this script is bash-specific and uses “bash-isms”, such
    as the if [[ conditional ]] construct.

    Finally, if you see a shebang like this


    ```

    #!/usr/bin/env zsh

    ```


    you would expect that this script has been explicitly written for use with the
    Z shell.

    If you omit a shebang in your script, the intended behavior is ambiguous. For
    example, at the time of writing, if you run a script without a shebang from shebang,
    the script will run in a new instance of shebang; if you run a script without
    a shebang from the Z shell, the Z shell will use sh from your path, which could
    be a symlink to dash, bash, or another shell, depending on your system.


    If you want to experiment, create a script such as ~/effective-shell/scripts/nobang.sh
    script, which looks like this:


    ```

    # nobang: This script shows an anti-pattern of not using a shebang in a shell

    # script. It shows the process tree for the shell that runs your script:

    pstree $$

    ```


    After running this script from macOS, you would see something like the following
    output:


    ```

    = 00001 root /sbin/launchd

    += 07995 dmkerr tmux

    += 31195 dmkerr /bin/zsh

    += 49833 dmkerr sh ./samples/script/nobang.sh

    += 49833 dmkerr pstree -p 49833

    |--- 49835 root ps -axwo user,ppid,pgid,command

    ```


    Although I ran this script from a Z session, it executed with sh, which is the
    Bourne shell (version 3 on my system).

    The only time you should omit the shebang is when you expect the script to be
    sourced (a topic introduced in Chapter 9 and discussed further in Part IV).'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Configuring Options in Shebangs


    Sometimes you''ll see shell scripts with shebangs that contain options like:


    ```

    #!/usr/bin/bash -ex

    ```


    # # Script contents below...


    In this case, the -ex flags are passed to the bash program, enabling the "exit
    on error" and "trace" options.


    But because you can specify program arguments in a script''s bash doesn''t mean
    you should. Doing so is risky for two reasons.


    First, this pattern requires you to know the path to the shell. If you read Chapter
    9, know that you should use #/usr/bin/env to search PATH for the shell rather
    than assume you know where the user has it installed.


    Second, not all parameters are handled consistently across operating systems.
    For example, on some Unix systems, the following shebang will run with the -e
    parameter:


    ```

    #!/usr/bin/env bash -e

    ```


    However, on many distributions, only one parameter is passed, in which case the
    -e parameter would be silently ignored. That would be confusing for anyone reading
    your code. A workaround to handle these issues is to use the -s ("split") parameter
    for env, but again, this may be confusing for the reader.


    # Using Complex Logic in Shell Scripts


    Although it''s been around for decades, the shell has changed remarkably little.
    It is a testament to the genius of the Unix systems and the shell in general.


    However, the shell is often not the best choice for complex logic or work. Shell
    scripts are great for simple tasks and creating utilities to help you streamline
    your work, but they come with many challenges. The syntax can be confusing, making
    scripts across multiple systems can be challenging, and not many features are
    available to help you write robust code.


    Perhaps the biggest anti-pattern in shell scripts is letting them get too large
    and trying to do much with them. At a certain point, you''ll almost be able to
    create a more portable, effective, and maintain solution to your problem by using
    a dedicated programming language like Python (which is available on all systems)
    or one of the other languages at your disposal.


    This is a topic I will discuss in detail in Chapter 21, but for now I suggest
    applying this rule of thumb: as soon as your script starts to get longer than
    a page or takes more than a few minutes to think through, you''re probably reaching
    the point where a programming language would be a better option.'
  merge: -1
  pgno: 234
