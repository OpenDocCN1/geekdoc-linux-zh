  md: "Notice the shell is smart enough to expand the wildcard expression in the for\
    \ loop (the asterisk in \"/effective-shell/\"). Just as you can use wildcards\
    \ in commands such as ls, cp, or mv, you can use them in for loops—in fact, you\
    \ can use them in any statement.\n\nAlso notice how the loop implicitly creates\
    \ the item variable from the name provided (remember, you omit the dollar sign\
    \ when you're setting a variable). There's no need to explicitly assign a value\
    \ since the variable declaration is built into the for syntax.\n\n# Looping Through\
    \ Arrays\n\nYou can easily loop the items in an array with a for loop as well:\n\
    \n```\ndays=(\"Monday\" \"Tuesday\" \"Wednesday\" \"Thursday\" \"Friday\" \"Saturday\"\
    \ \"Sunday\")nfor day in ${days[@]}\n  do\n    echo -n \"day,\"\\  done\necho\
    \ \"happy days!\"\n```\n\nTo loop through every item in the array, use the ${days[@]}\
    \ syntax to specify \"all elements.\\ The -n (\"don't output a trailing newline\"\
    ) flag tells the echo command not to write each day on its own line.\n\nIf you\
    \ run these commands, you'll get the following output:\n\nMonday, Tuesday, Wednesday,\
    \ Thursday, Friday, Saturday, Sunday, happy days!\n\nSee Chapter 10 to review\
    \ the syntax for the most common array operations.\n\n# Splitting Loop Input into\
    \ Words\n\nType the following in your shell to see for the loop documentation:\n\
    \n```\n$ help for\nfor for NAME [in WORDS ... ]; do COMMANDS; done\nExecute commands\
    \ for each member in a list.\n```\n\nThe sentence WORDS refers to the list of\
    \ items that the loop processes one by one. The shell automatically splits the\
    \ input into separate items (words) based on whitespace or other delimiters, and\
    \ the loop iterates over each one.\n\nsentence=\"What can the harvest hope for,\
    \ if not for the care of the Reaper Man?\"\\\"\n\n```\nfor word in $sentence\n\
    do\n  echo \"$word\"\\done\n```\n\nThe sentence variable is set explicitly since\
    \ it's outside the for loop. Then, in the for loop, the shell splits the value\
    \ of sentence into separate words based on the spaces between them, storing each\
    \ in the word variable."
