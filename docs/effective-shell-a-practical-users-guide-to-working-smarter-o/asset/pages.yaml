  md: 'You can see why the shell splits up words in a sentence: it assumes that you
    want to loop over each word and splitting the output into sensible "chunks."


    > NOTE If you''re using the Z shell, the sentence will not be split into words.
    To see the same results in zsh, you''d define the set of words as an array.


    When you operate in a shell for day-to-day work, you don''t have to use the more
    specific syntax that you''d use in a programming language. The main advantage
    of the shell is that it lets you write short statements and work with files quickly.
    It''s not designed as a general-purpose programming tool, which is why it makes
    assumptions like this.


    # WORD SPLITTING AND EXPANSION BEHAVIOR


    As you''ve seen, the shell will split the words in a loop by default, as shown
    here:


    ```

    $ sentence="Here are some words"

    $ for word in "$sentence"; do echo "$word"; done

    Here

    are some

    words

    ```


    However, wrapping the sentence variable in quotes will prevent the word splitting:


    ```

    $ sentence="Here are some words"

    $ for word in "$sentence"; do echo "$word"; done

    Here are some words

    ```


    In the first example, because the sentence variable is not quoted, it follows
    the standard rules for shell expansion. In the second example, the sentence is
    quoted, which typically means it is treated literally—but parameter expansion
    is an exception. In this case, quoting the sentence variable allows expansion
    to take place without splitting.


    Let''s look at another example demonstrating expansion behavior you might not
    expect. This far loop uses a wildcard to list files:


    ```

    $ touch file\ with spaces.test

    $ for file in "*.test"; do echo "Found: \$file"; done

    Found: file with spaces.test

    ```


    In this case, *.test is not quoted, so why doesn''t word splitting happen?

    The reason is that the shell applies expansions in a certain order:


    +   1. Brace expansion

    2. Tilde expansion


    (continued)'
