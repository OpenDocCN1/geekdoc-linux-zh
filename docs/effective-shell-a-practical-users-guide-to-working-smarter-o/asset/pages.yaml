- img_proc: true
  md: '# Handling Disconnections


    If you are regularly using ssh to connect to remote machines, you’ll soon encounter
    the pain of disconnections, or losing network connectivity. You might not notice
    that you''ve been disconnected; more commonly, the ssh session simply freezes
    and stops responding to any input at all. Annoyingly, the shell is so unresponsive
    that you can''t even unfreeze it with CTRL-D or CTRL-C. In these cases, you can
    use the escape sequence ENTER to end the broken session.


    In Chapter 24 we''ll look at some ways to improve upon this technique, but for
    now, if you forget the “tilde tilde” escape sequence, it''s easiest to just close
    your terminal program.


    When you disconnect from your SSH session, the commands you''re running will also
    be terminated because shell sends the “hang up” signal. Again, this can be frustrating
    if you want to keep a program running on the server. You''ll learn how to work
    around this behavior as well in Chapter 24.


    # Transferring Files with scp


    You can use the scp (“OpenSSH secure file copy”) program as follows to copy files
    from any remote machine you have access to:


    scp parameters source destination


    Many of the parameters you provide to scp are the same as those for the ssh command,
    such as -i for the identity file. The source and destination are normally a pair
    of designations: one local, one remote. However, you can also copy between two
    remote machines.


    Here''s an example of how an scp command might look:


    ```

    scp -i ~/.ssh/my-project.pem ~/project/output.zip dwmkerr@myserver.com:

    ```


    +   - -i flags the path to a key.

    - The source is a file called output.zip on the local machine.

    - The destination is a server with the hostname myserver.com, connecting with
    a user named dwmkerr, and putting the file in the user''s home folder.


    The following scp example copies the downloads/backup.zip folder to the local
    ~/backups folder:


    ```

    scp -P 8022 effective-shell.com:~/downloads/backup.zip ~/backups

    ```'
