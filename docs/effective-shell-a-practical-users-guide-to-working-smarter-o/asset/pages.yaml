  md: '# Benefits of Using a Multiplexer


    While it''s not essential to know how to use a multiplexer, it can certainly help
    you become a more effective shell user. Here are some of the key benefits:


    **Window management** As noted previously, multiplexers support multiple windows,
    tabs, and panes, allowing you to arrange your workspace exactly how you want.
    You can also save your window configuration and use it. You can even organize
    different sessions, which means you can switch between different running projects
    at once, with a layout configured to your needs.


    **Session persistence** A multiplexer runs your programs independently of your
    terminal, so if your terminal crashes or freezes, you can run a multiplexer on
    a remote machine to manage your programs, and even if your connection to the machine
    is reset, the programs won''t running. You can simply reconnect to the session
    later and pick up where you left off incredibly useful—if you use the shell a,
    you''ll wonder how you lived without it!


    **Configuration options** Multiplexers offer many configuration options allow
    you to customize how you run and interface with your programs, allowing you to
    set up the ideal environment for maximum effectiveness.


    **Collaboration capabilities** A multiplexer is a client/server program. This
    means that as a user you are a client and connect to a server that runs the multiplexer.
    Other users can connect as well, so you can easily collaborate with them to share
    your own work, connect to theirs, or work together on a shared remote machine.


    We''ll look at a few of the most immediately useful features of multiplexers in
    this chapter. Though it won''t be a comprehensive discussion, it should be enough
    to help decide whether to investigate further on your own and add a multiplexer
    to your toolkit.


    # Installing tmux


    The most popular multiplexers are probably GNU Screen and tmux. GNU Screen was
    created in the late 1980s and has been used widely ever since. it is preinstalled
    on many Linux systems.


    A modern multiplexer created in 2007, tmux has most of the features of GNU Screen,
    is also open source, and adds some very useful features to make it a little more
    user-friendly. However, tmux will not work with msys2 or Cygwin.


    For the rest of this chapter, we''ll look at tmux in detail. I have chosen tmux
    rather than GNU Screen because I think its user-friendliness makes it a better
    option for multiplexer newcomers. Once you''re comfortable with tmux, you might
    decide to switch to GNU Screen; if you do, it will be very familiar.'
  merge: -1
