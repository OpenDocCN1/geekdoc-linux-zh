- img_proc: true
  md: 'Each operating system and Linux distribution comes with its own configuration
    for the command prompt, but the default often looks something like this:


    ```

    dwmkerr@effective-shell-ubuntu-24:~$

    ```


    This is the prompt on an Ubuntu virtual machine I have set up. If you want to
    set up a free virtual machine yourself, follow the guide in Appendix A. This prompt
    consists of the following components:


    +   - dwmkerr The name of the current user

    - A separator between the username field and the field effective-shell-ubuntu
    The hostname of the machine

    - A colon that separates the hostname from the next field

    - The working directory

    - $ The prompt itself (a dollar sign indicates a normal user rather than root
    user)


    When I change, the prompt is updated:


    ```

    dwmkerr@effective-shell-ubuntu-24:~$ cd effective-shell

    dwmkerr@effective-shell-ubuntu-24:~/effective-shell$

    ```


    If I change to the root user (or superuser), the username changes to root and
    the dollar sign ($) changes to a hash (#):


    ```

    dwmkerr@effective-shell-ubuntu-24:~/effective-shell$ sudo su

    root@effective-shell-ubuntu-24:/home/dwmkerr/effective-shell#

    ```


    The hash mark is a useful reminder that you''re running commands as the root user.
    You always want to be careful when doing so, as you could easily break features
    or functions by changing system files.

    As useful as these out-of-the-box fields are, however, you might want to customize
    the prompt to include information that''s even more relevant to you. Let''s get
    started!


    # The Command Prompt Structure


    The structure of the command prompt is specified in the PS1 ("Prompt String")
    shell variable. This shell uses this to write out the command prompt.

    To see the contents of this variable, use echo or printf to write it to the


    ```

    dwmkerr@effective-shell-ubuntu-24:~/effective-shell echo PS1

    \\[e\]0;u\h: \a\[(debianchroot:${debianchroot})\]\\[033[01;32m\]\u@\h\[033[00m\]:\n\[033[01;34m\]]\j\[033[00m\]\$

    ```'
  merge: -1
