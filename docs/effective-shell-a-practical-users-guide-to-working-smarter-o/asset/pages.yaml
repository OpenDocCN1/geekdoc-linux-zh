- img_proc: true
  md: 'Let''s see both ways in action. First, use the git rm ("remove files from the
    working tree and index") command:


    ```

    $ git rm install.sh

    rm ''install.sh''

    ```


    This removes the file from your working tree and stages it for deletion at the
    same time, which you can confirm with git status:


    ```

    $ git status

    On branch main

    Changes to be committed:

    (use "git restore --staged <file>..." to unstage)

    deleted: install.sh

    ```


    The deletion is only in the index at this point, so you need to run git commit
    to commit it.

    Sometimes you''ll have already deleted files outside of Git (using rm or another
    tool):


    ```

    $ git rm install.sh

    $ git status

    On branch main

    Changes not staged for commit:

    (use "git add/ <file>..." to update what will be committed)

    (use "git restore <file>..." to discard changes in working directory)

    deleted: install.sh

    ```


    At this point, Git knows the file is missing, but the deletion isn''t staged,
    because you''ve explicitly told Git that you want to remove the file as part of
    your commit. To confirm that you want to remove the file, you''ll still need to
    run the git rm command:


    ```

    $ git rm install.sh

    ```


    You could also run git install.sh, which is like saying, "Stage my change to install.sh";
    that is, you''re adding a change to the index. (I often run just git add , to
    add all of my changes, deletions to the index.)

    Now you can make any other changes you like, stage them, and then commit.


    # Restoring and Renaming Files


    To restore a file that''s been modified or deleted but not committed, you can
    use git checkout HEAD filepath like so:


    ```

    $ git checkout HEAD install.sh

    ```


    HEAD tells Git you to check out the file from the current commit (in this case,
    the most recent commit on main).'
