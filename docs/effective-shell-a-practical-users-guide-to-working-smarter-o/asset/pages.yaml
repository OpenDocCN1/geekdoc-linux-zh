- img_proc: true
  md: 'To open Command Prompt, click the Windows icon to open the Start menu and type
    command prompt in the search box.


    When Command Prompt opens, whoami and press ENTER. You should use the username
    of the logged-in user, as shown on the second line here:


    ```

    C:\Users\dave>whoami

    davekerr9d36>ave

    ```


    That''s all there is to it! You''ve still got some configuration to do make Command
    Prompt behave more like a Linux shell, which this book uses as the standard, you''ll
    learn about that in the next section.


    # macOS


    If you''re using a Mac, you''ll use the Terminal program to open your shell. Press
    Command+spacebar and then type terminal.


    When Terminal opens, type whoami and then press RETURN. You should see the username
    of the logged-in user, as shown on the second line here:


    ```

    % whoami

    dwmkerr

    ```


    That''s it! In the next section, you''ll make some minor configuration changes
    to keep things consistent with the examples in the book.


    # Linux


    If you''re using a Unix system, I''ll assume that you''re familiar enough with
    it to open a shell. Your specific shell (known as a terminal in Linux, not to
    be confused with the Terminal program in macOS) should not affect how you use
    this book, but note that of the book''s examples use bash version 5.


    # Configuring the Shell


    Shells can vary enormously between different systems. In general, Linux systems
    tend to use bash and require little configuration. macOS is based on BSD Unix
    and differs under the hood from most Linux systems. Windows is completely unrelated
    to either Linux or Unix and operates in a fundamentally different way from both
    of them.


    In this book, I assume that you are using a "Linux-like" system—that is, one that
    operates like a modern Linux distribution. This is a deliberate choice. Once you''re
    comfortable using a Linux-like shell, you can generally apply the techniques shown
    here to macOS with no difficulties. For Windows, the techniques are not necessarily
    transferable immediately,'
  merge: -1
