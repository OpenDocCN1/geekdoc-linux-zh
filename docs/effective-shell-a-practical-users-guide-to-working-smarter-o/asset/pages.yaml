    The key concepts introduced in this chapter including the following:

    **Working tree** The folder you''re working in and tracking changes to

    **Index** The staging area for building commits

    **Repository** The full set of all commits, branches, and metadata

    **Fork** A copy of an entire repository, including its history and all branches

    **Pull request** A request to merge one branch into another, or a branch in a
