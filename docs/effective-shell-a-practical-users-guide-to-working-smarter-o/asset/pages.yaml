  md: '# Specifying What Program Should Run a Script


    A shebang is a special construct that tells the system what program it should
    use to run a script. The shebang is composed of the hash mark (#) and the exclamation
    mark (!) and is placed at the beginning of the file.


    Here''s how the common.vSh file would look with the shebang (although not required,
    it''s common practice to add a blank line following the shebang-line):


    ```

    #!/usr/bin/sh

    ```


    # Inform the user of the output they can expect.


    ```

    echo "common commands:

    ```


    Immediately after the shebang, you write the full path to the program that should
    be used to open the file—in this case, that''s the sh program. To write a script
    that should run in Python, you could use the shebang


    ```

    #!/usr/bin/python3

    ```


    ```

    print(''Hello from Python'')

    ```


    Or to explicitly bash to run a script, you might write:


    ```

    #!/usr/bin/bash

    ```


    ```

    echo "Hello from bash"

    ```


    There''s one catch. This technique works only if the user running the script has
    the program installed in the location specified by the shebang. If they don''t,
    the script will fail to run.

    If you know where a program is installed, you can use the env ("set or print environment
    and execute command"). While env is used to display environment variables, you
    can also use it to find and run programs when you don''t know their exact location
    on your system. It searches the directories listed in your PATH variable to find
    the path of the command to execute.

    For example, here''s how you can use env to run the Python program:


    ```

    $ env python3

    Python 3.13.0 (main, Oct 7 2024, 05:02:14)

    ```


    ```

    [GCC 9.3.0] on linux

    Type "help", "copyright", "credits" or "license" for more information.

    >>>

    ```


    In this case, env works out the path for the python3 command on your system.'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'To use env in a shebang, specify the full path to env (which should be the
    same on all Unix-like systems) and then provide the program name like so:


    ```

    #!/usr/bin/env bash

    ```


    echo "Hello from bash"


    Here''s another example:


    ```

    #!/usr/bin/env ruby

    ```


    puts ''Hello from Ruby''


    Combining a shebang with the env command like this is generally the safest and
    most portable way to specify how a shell script should run.


    # Sourcing Shell Scripts


    Souring a script—that is, loading its contents into your current session and running
    commands there—is quite different from executing it. Executing a shell script
    creates a new shell as a child process of the current session. This means that
    if you change something in the environment, as a variable, it won''t affect the
    original shell environment (the one that runs the script). If your script crashes
    or exits the shell, it will only crash or exit the shell it is running in; your
    original shell remain active.


    When you source a script, you can change the current shell directly—and if you
    are not careful—even end the shell process.


    Let''s look at an example. Create a script set_editor.sh that sets the EDITOR
    environment variable to the nano editor as follows (this script is also at ~/effective-shell/scripts/set_editor.sh):


    ```

    EDITOR=nano

    echo "Editor changed to: $EDITOR"

    ```


    Check what your current editor is and then use the source ("execute commands from
    a file") to load the set_editor.sh file:


    ```

    $ echo $EDITOR

    vim

    source ~/effective-shell/scripts/set_editor.sh

    Editor changed to: nano

    $ echo $EDITOR

    nano

    ```


    Running echo $EDITOR a second time confirms that your editor has been changed
    from Vim to nano in the current shell rather than in a new one.


    You can use a slightly concise syntax to source a script: dot notation. When the
    shell sees a dot (.) character, it will source the file that follows the dot just
    as you''ve spelled out the word source. In other words, .~/effective-shell/scripts/show-info.sh
    is equivalent to source .~/effective-shell/scripts/show-info.sh.


    NOTE'
