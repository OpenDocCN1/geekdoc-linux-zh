  md: "# Passing Parameters to Functions\n\nParameters are input values that can make\
    \ your shell functions more flexible. Instead of having separate functions for\
    \ each value you need, you can reuse the function with different parameters. You\
    \ can pass any number of parameters to a shell function. This simple sum function\
    \ takes two parameters and adds them together:\n\n```\nsum() {\n  local value1=$1\n\
    \  local value2=$2\n  local result=$((value1 + value2))\n  echo \"The sum of ${value1}\
    \ and ${value2} is ${result}\"\n}\n```\n\nYou can pass parameters to the sum function\
    \ as:\n\n+   $ 3 6\nThe sum of 3 and 6 is 9\n$ 10 33\nThe sum of 10 and 33 is\
    \ 43\n\nWhen you pass parameters into a shell function, they are automatically\
    \ stored in shell built-in variables as *parameter variables*. In this script,\
    \ the parameter variables 1 and 2 contain the first and second parameters, respectively.\
    \ At the beginning of the function, putting 1 and 2 into local variables with\
    \ slightly more descriptive names (names as value1 and value2) makes the script\
    \ more readable. The function could also have been written so:\n\n```\n# Create\
    \ a function that calculates the sum of two numbers.\nsum() {\n  echo \"The sum\
    \ of $1 and $2 is $(($1 + $2))\"\n}\n```\n\nFor short and simple function, you\
    \ might just use the parameter variables directly like this. However, for anything\
    \ more complex than a one-line script, I recommend creating a local variable with\
    \ a more descriptive name for the sake of readability.\nThe shell provides several\
    \ other parameter variables in addition to 1 and 2. Table 13-1 lists some of the\
    \ most common ones.\n\nTable 13-1: Common Parameter Variables\n\n| Parameter variable\
    \ | Description |\n| :--- | :--- |\n| 0 | The name of the shell script, which\
    \ the shell provides automatically. |\n| - | The options that have been set in\
    \ the shell. |\n| 1 | The first parameter. |\n| 2 | The second parameter. (continued)\
    \ |"
  merge: -1
