  md: "You might think the logical result is that nothing is printed. There's no bad-shell\
    \ folder, so the pattern shouldn't find any files. But instead, it returns the\
    \ following output:\n\nFound script: ~/bad-shell/scripts/*.sh\n\nBy default, if\
    \ a glob (a pattern that includes a wildcard) doesn't match any files, the shell\
    \ simply leaves the pattern as is. That's why, instead of finding no files, the\
    \ loop actually runs once, storing the literal string ~/bad-shell/scripts/*.sh\
    \ in the script variable and then printing that to the screen.\n\nThere are two\
    \ ways to deal with this problem. The first is to enable nullglob (\"return null\
    \ for unmatched globs\") command:\n\n```\nsopt -s nullglob\nfor script in \"~/bad-shell/scripts/*\"\
    ;\ndo\n    echo \"Found script: $script\"\ndone\n```\n\nThe shop (\"set and unset\
    \ option\") command allows you to configure shell options like nullglob, which\
    \ changes the shell behavior so that if a wildcard pattern doesn't match any results,\
    \ it is set to a null string.\n\n> NOTE\nThere's a good reason that the shell\
    \ doesn't return null by default for an unmatched glob. As an example, *,nothing-here\
    \ shows a warning that *,nothing-here doesn't exist. If the glob automatically\
    \ expanded to an empty string, it would be equivalent to running ls with no arguments,\
    \ so ls would list the current directory (its default behavior when no path is\
    \ specified). See the StackExchange discussion at https://unix.stackoverflow.com/questions/204803/why-is-nullglob-not-default\
    \ for more on this topic.\n\nThe second way to deal with glob problem is to use\
    \ a test command, which is more readable than the sheopt option. Here's how it\
    \ would look using the square bracket notation for the test command:\n\n```\n\
    for script in \"~/bad-shell/scripts/*\";\ndo\n    # If the file or folder doesn't\
    \ exist, skip it.\n    if [ ! -e \"$script\" ]; then continue; fi\n    echo \"\
    Found script: $script\"\ndone\n```\n\nThe -e (\"exists\") operator in a test command\
    \ checks whether the file exists. If it does not exist, the \"resume loop\") statement\
    \ executes, skipping the current iteration in the loop and moving to the next\
