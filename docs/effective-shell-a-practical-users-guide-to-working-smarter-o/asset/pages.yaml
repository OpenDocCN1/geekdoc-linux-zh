- img_proc: true
  md: '# Remove a Pattern from the Beginning


    You can use the ${parameter#pattern} expression to expand the value of parameter,
    removing pattern from the front of its value:


    ```

    $ address=https://effective-shell.com

    $ echo "Address: ${address#https://}"

    Address: effective-shell.com

    ```


    To tell the shell to remove as many sequential matches of pattern as possible,
    use the ${parameter#pattern} expression. This strips out all characters up to
    a center point in a parameter:


    ```

    $ folder=/home/dwmkerr/backups/2025-4-19

    $ echo "Today''s backup folder is: ${folder##}"

    Today''s backup folder is: 2025-4-19

    ```


    Notice this example uses asterisk (*) in the pattern, telling the shell to strip
    as many possible characters from the beginning of the parameter until it finds
    the final forward slash (/).


    # Remove a Pattern from the End


    The ${parameter%pattern} expression works exactly like the preceding expression
    but removes from the end of a parameter instead:


    ```

    $ echo "My working directory is: ${PWD}"

    My directory is: /home/dwmkerr/repos/github/dwmkerr/effective-shell

    $ echo "My parent folder is: ${PWD/*}"

    My parent folder is: /home/dwmkerr/repos/github/dwmkerr

    ```


    Again, the wildcard in the pattern tells the shell to remove all of the text from
    the end of the parameter, up to and including the first forward slash (/

    To remove as many matches as possible, use the expression ${parameter%%pattern}
    like so:


    ```

    $ archive=effective-shell.tar.gz

    $ echo "Name of archive: ${archive%%.*}"

    Name of archive is: effective-shell

    ```


    Notice that the character removal doesn''t stop at the first period (.); the shell
    removes as many characters as possible until it finds the last period.


    One way to remember that the hash (#) removes pattern from the beginning and the
    percent sign (%) pattern removes from the end is to look at the keyboard: the
    # is on the left and the % is on the right.'
  merge: -1
