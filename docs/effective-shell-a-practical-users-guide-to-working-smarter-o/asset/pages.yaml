    out the commands to the screen. The sed command also denotes the importance of
    the order of the expressions: the second expression is applied after the first.
    If you''re using multiple expressions, make sure that an earlier expression doesn''t
    alter the line that it breaks the expression.


    # Extracting Information


    What if you want to extract some information from lines in a file? Move into the
    data folder, which contains a file about movies called top100.csv that you may
    have seen in the previous chapter:


    ```

    $ cd ~/effective-shell/data

    $ head -n 3 top100.csv

    "Rank", "Rating", "Title", "Reviews"

    "1", "97", "Black Panther (2018)", "515"

    "2", "94", "Avengers: Endgame (2019)", "531"

    ```


    To create a regular expression that finds the year for each movie, match all numeric
    values between parentheses like:


    ```

    $ head -n 3 top100.csv | sed -E ''s/\.*\([0-9]+\).*/\1/''n"Rank", "Rating", "Title",
    "Reviews"

    2018

    2019

    ```


    This command matches any text, captures any digits enclosed in parentheses (which
    in case is the year the movie came out), and prints them to the screen with the
    \1 construct, which means "the first match."

    (See Chapter 4 for more about capture groups.)nYou can also exclude the first
    line (the column heading) as follows:


    ```

    $ sed -E -e ''id'' -e ''s/\.*\([0-9]+\).*/\1/'' data/top100.csv

    2018

    2019

    ```


    The 1d expression will delete the first line.'
