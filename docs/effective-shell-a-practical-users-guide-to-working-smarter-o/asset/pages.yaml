    \ rather than include it in the expression; otherwise, you'd have to escape special\
    \ characters like the dollar sign.\n\nThe = operator is then used to compare the\
    \ value in SHELL against the value in the zsh_regex variable. If the result is\
    \ true (the user's shell ends with zsh), the shell prints the following confirmation\
    \ message:\n\nIt looks your shell '/bin/zsh' is Z shell\n\nAny time you use the\
    \ = operator, matches are automatically stored in the BASH_REMATCH array. The\
