    \  echo \"Canceling long operation\"\n  exit 130\nfi\n```\n\n```\ntrap on_interrupt\
    \ INT\ntotal_time=0\nwhile; do\n  echo \"Long operation: ${total_time} seconds\
    \ elapsed\"\n  sleep 3\n  total_time=$((total_time + 3))\ndone\n```"
