    "Up (2009)"

    "Toy Story 4 (2019)"

    "Toy Story 3 (2010)"

    "Toy Story 2 (1999)"

    ```


    There are a few other options for sort; to see them, run man sort.

    The uniq command removes duplicate lines from a stream of text—but only when they
    are next to each other, so you''ll have to sort first.\ You can use uniq to find
    all unique error messages in a log file like:


    ```

    $ cut -c 27- /effective-shell/logs/web-server-logs.txt | grep error | sort | uniq

