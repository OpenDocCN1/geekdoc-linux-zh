- img_proc: true
  md: 'but they''re valuable to know. Windows is increasingly making its own shell
    environment more Linux-like with the Windows Subsystem for Linux (WSL). However,
    WSL does require some setup, which I''ll describe.

    This section will ensure that you''re running a Linux-like setup, preferably with
    the latest version of the popular bash program. If you are familiar with bash
    but prefer to use another shell, that''s fine—most of the book will work with
    any modern shell. However, if you have no preference, I recommend following the
    guidelines given here.


    # Microsoft Windows


    Because Windows isn''t anything Linux under the hood, it takes a few steps to
    get a shell working. You have three options.


    # ### Option 1: Install Linux Tools


    Installing Linux tools is probably the easiest option and the one I would recommend
    for most users. You''ll be able to run a Linux-like shell when you choose to,
    and it won''t interfere with your day-to-day usage.

