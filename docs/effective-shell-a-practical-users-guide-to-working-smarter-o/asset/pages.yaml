  md: "# Adding Syntax Highlighting\n\nYou can use escape sequences (character combinations\
    \ that tell the shell to format output) to color the text displayed in the shell.\
    \ This technique is sometimes called syntax highlighting.\n\n```\ngreen='\\e[0;32m'\n\
    reset='\\e[0m'\necho -e \"Do you like ${green}apples${reset}\"\n```\n\nOn terminals,\
    \ you'll see the following output with the word apples rendered in green:\n\n\
    Do you like apples?\n\nThe sequence \\e[0;32m means \"set the text color to green.\"\
    \ The sequence \\e[0m means \"reset the text color\". These codes are ANSI escape\
    \ sequences that have been defined to control how content in a terminal is formatted.\
    \ There are a number of formatting options, such as foreground and background-colors,\
    \ bold, and underline. Search online for \"ANSI color codes\" to find all of the\
    \ possible codes.\n\nIt's important to provide the -e flag to the echo command\
    \ so that it correctly processes the color code escape sequences. In fact, a better\
    \ option is to use the printf \"format and print arguments\" command, as it behaves\
    \ more consistently across different versions of Unix and Linux:\n\n```\nprintf\
    \ \"Do you like ${green}apples${reset}\"\n```\n\nSyntax highlighting can be helpful\
    \ for a user in an interactive shell, but there are certain circumstances where\
    \ you wouldn't want to use color codes. Let's walk through an example that shows\
    \ why.\n\nThis rainbow function writes out a message in several colors:\n\n```\n\
    rainbow() {\n  local message=\"$1\"\n  local reset='\\e[0m'\n  for ((color=31;\
    \ color<=37; color++))\n  do\n    color_code=\"\\e[0;${color}m\"\n    printf \"\
    ${color_code}${message}${reset}\\n\"\n  done\n}\n\n\n```\n\nIn terminals, running\
    \ this function displays the color code followed by the word hello in the corresponding\
    \ color:\n\n+   31 - hello\n32 - hello\n33 - hello\n34 - hello\n35 - hello"
  merge: -1
