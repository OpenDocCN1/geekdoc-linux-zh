- img_proc: true
  md: '# Replace a Pattern


    You can replace a pattern in a parameter with the expression ${parameter

    pattern/string} as follows:


    ```

    $ message="Hello Dave"

    $ echo "${message/Hello/Goodbye}"

    Goodbye Dave

    ```


    There are parameter replacement options that can control things like the

    number of replacements performed and how arrays are treated. I wouldn''t

    recommend making overly complex replacements using these types of

    expressions, however, as they can be quite challenging for readers to parse

    and can also vary from shell to shell. Instead, use a command like tr or sed

    to make what''s going very clear.


    # Convert to Lowercase or Uppercase


    You can use the ${parameter^^} expression to convert the value of parameter to

    uppercase or ${parameter,,} to convert it to lowercase:


    ```

    $ message="Hello Reader"

    $ echo "${message^^}"

    HELLO READER

    $ echo "${message,,}"

    hello reader

    ```


    You can find alternative ways to manipulate text in Chapters 6 and 7.


    # Use Parameter Indirection


    To get the value of a parameter that has an arbitrary name, you can use the

    ${!parameter_name} expression:


    ```

    $ parameter_name="HOME"

    $ echo "${!parameter_name}"

    /home/dwunkerr

    ```


    This example returns the value of the parameter whose name is stored

    in parameter_name. This expression can be very useful if you are writing

    scripts that will work with arbitrary or variable parameter names.


    For more examples of using parameter expansion with the parameters

    of functions or scripts, see Chapter 10.


    # Command Substitution


    Command substitution, the second form of expansion that starts with a dol-

    slar sign, instructs the shell to run a specific command. The syntax is

    $(command).'
