    \        L--pstree -a -s 1675\n```\n\nThis output is the process tree for the\
    \ shell process in which the script is running—that is, the current process, its\
    \ parent, its parent's parent, and so on, all the way to the main process, which\
    \ runs the entire operating system. The process tree will look different depending\
    \ on what system you are using. We'll focus on the final three processes highlighted\
