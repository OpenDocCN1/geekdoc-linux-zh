  md: '# Using Braces to Reference Variables Explicitly


    When you append text directly to a variable name, the shell can''t tell you the
    variable name ends and the additional text begins. For example:


    ```

    $ echo ''Creating backup folder at: ''$USER_backup''

    $ mkdir $USER_backup

    Creating backup folder at: ''''

    usage: mkdir [-pv] [-m mode] directory ...

    ```


    Rather than creating a folder called dwkmerr_backup (which is your USER variable
    followed by _backup), this script fails because it''s for a variable named USER_backup
    which does not exist.

    To avoid such errors, you can surround the variable name with braces to refer
    to a variable more explicitly:


    ```

    $ echo ''Creating backup folder at: ${USER}_backup''

    $ mkdir ''${USER}_backup''

    Creating backup folder at: dwkmerr_backup''

    ```


    Now the script correctly interprets the command and creates the dwkmerr_backup
    folder.

    If there''s any potential ambiguity with a variable name, enclose it with braces
    on the safe side. This is why DEBUG_MODE was enclosed in braces when you launched
    the shell to run a child process in debug mode. Some people always use braces
    to be explicit about the variable name and reduce the risk of mistakes if someone
    comes along later to edit or change the code.

    To improve this script, you could create a new variable that holds the backup
    directory:


    ```

    $ backupdir=''${USER}_backup''

    $ echo ''Creating backup folder at: ${backupdir}''

    $ mkdir ''${backupdir}''

    ```


    Creating the backup variable saves you from having to repeat the ${USER}_backup
    text each time you want to use it.


