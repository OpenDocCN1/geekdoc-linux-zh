    # Capture Groups


    You can break up your expression into smaller parts with capture groups. Then
    you will have the option of performing operations on either the entire match or
    only the part specified in a capture group. This can be useful if you want to
    not just match text but also extract certain parts of it.


    Consider this example:


    ```

    (.+)@.

    ```


    Each capture group is surrounded by parentheses, so this example shows one full
    expression holding two capture groups. If you run this against just one line of
    the sample text, dave@effective-shell.com, it returns the following match:


    ```

    dave@effective-shell.com

    ```


    The full expression matches the whole line, but there are actually complete matches:


    dave@effective-shell.com The first match in an expression is always the complete
    match.


    dave The first capture group (.) matches everything before the at sign. effective-shell.com
    The second capture group (.) matches everything after the at sign.'
