    # Dot Files Defined


    Any file or folder on your system that starts with a dot (.) is a dot file. On
    many systems, dot files are hidden by default. This means that they won''t show
    up when you run commands like unless you provide flags, such as -a ("show all
    files and folders"). In desktop environments like GNOME, KDE, and macOS, dot files
    are hidden by default.


    Dot files are often "behind the scenes" as configuration or system files. This
    is why they''re hidden by default: everyday users shouldn''t have to worry about
    their dot files or contents.


    You''ll see dot files in your home directory, where the dot marks them to distinguish
    from your personal files and folders. When there are configuration files outside
    your home directory, the dot isn''t normally used, because it''s clear from the
    folder in which the file resides that it''s a configuration file.


    As an example, a user''s bash configuration is stored in ~/.bashrc, but the global
    bash configuration applied to all users is stored in /etc/bash. The second configuration
    file doesn''t need the dot, because the /etc folder is where configuration is
