- img_proc: true
  md: 'This example sets the \j (current job) sequence and surrounds it with square
    brackets. Then it specifies the # (command number), surrounded by parentheses,
    followed by the $ (prompt). It also starts some background jobs that run the sleep
    (wait for number of seconds) command so that you can see that the number of jobs
    is changing. The square brackets and the parentheses are simply characters to
    distinguish between the job number and command number, making the prompt more
    readable. Again, because you''ve used single quotes to set the value of the PS1
    variable, the shell knows to treat these and the dollar sign as literals.


    If you''re following and trying this out in your own shell, you might have noticed
    there aren''t any colors for the new prompts being set; everything is displayed
    in white. It will change that.


    # Adding Color and Text Formatting to Your Prompt


    Earlier in the chapter, you saw that the default prompt on systems like Ubuntu
    contains lots of special characters. Here is it again:


    ```

    dwkmerr@effective-shell-ubuntu-24:~/effective-shell$ echo PS1

    \[e03;0m\\h\a\$(debianchroot:$(debianchroot))\[\e33[01;32m\u@\h\[\e33[00m\]:\\[\e33[01;34m\$w\[\e33[00m\\$

    ```


    You might recognize some of these characters, such as \u for the username and
    \h for host. The character start with \03 or \e are ANSI escape sequences. ANSI
    stands for American National Standards Institute, an organization established
    to set common standards for computing platforms.


    In the early days of Unix, each vendor developed their own special characters
    to control how output was formatted. These characters varied from platform to
    platform, it was challenging to create scripts or functionality that worked across
    multiple platforms. To deal with this, ANSI defined a common set of codes that
    could be printed to a terminal to control your visual style.


    You can use ANSI escape sequences to format your output. First, use \033 or \e,
    both of which represent the ESC key. The \033 sequence is the ESC code written
    in octal (base-8) format, and the \e sequence is simply an alternative way of
    writing the ESC key. The two options have the same result. When a terminal sees
    them, it knows that the following sequence of characters defines the formatting.
    Table 16-2 shows some of the formats you can use.'
