- img_proc: true
  md: '^bd

    detach


    Because tmux is stateful (has session persistence), if you close your terminal
    at this point, the tmux server saves your session information. Then when you reopen
    a terminal, you can reattach with the same command as before:


    ```

    tmux attach

    ```


    If you use tmux, you might find yourself up with lots of sessions. To delete a
    session, enter ^b to show the session list, scroll to the session you want to
    delete, and press x. The tmux server will ask for confirmation before it closes
    the session.


    Sessions are extremely powerful for organizing your work. Table 24-2 lists some
    other useful commands for working with them.


    # Table 24-2: Handy Commands for Working with Sessions


    | Command | Description |

    |---|---|

    | tmux attach | Attach to the last used session. |

    | tmux new -s name | Start a new tmux session named *name*. |

    | ^b: new -s another-name | Enter command mode and start a session named *another-name*.
    |

    | ^b $ | Rename the current session. |

    | ^b s | Show the session list. Close the selected session with x. |

    | ^b ) | Move to the next session. |

    | ^b ( | Move to the previous session. |

    | ^b w | Show all windows and sessions. |


    Now that you know how to manage multiple sessions and you understand the essential
    commands, you might want to fine-tune tmux to suit your preferences.


    # Configuring tmux


    Out-of-the-box configuration for tmux is normally fine for everyday use. However,
    if you find yourself using tmux a lot, adding some customizations can make it
    work better for you.


    The program''s configuration pattern follows the very standard, Unix-style dot
    file structure. (If you''re not familiar with dot files, see Chapter 17.) To begin
    configuring tmux, create a file named .tmux.conf in your home directory:


    ```

    $ touch ~/.tmux.conf

    ```'
  merge: -1
  pgno: 400
- img_proc: true
  md: 'Now open this file in your preferred editor so you can start adding some customizations.
    I''ll walk you through the ones I find most useful.


    # Setting the Default Shell


    First, you''ll tell tmux to use your current shell program (for example, if you''re
    using the Z shell, tmux will know to open windows with the Z shell):


    ```

    # Set the default shell, and set the command to use our shell (this

    # means sourcing them properly, showing the correct PS1, and so on)

    set -g default-shell $SHELL

    set -g default-command $SHELL

    ```


    With these settings, tmux will also source your shell dot files that each window
    it opens has the same command prompt (set in the PS1 variable) and configuration
    as your standard shell.


    # Specifying the Working Directory


    When you create a new window with "b c, tmux will open it in the home directory
    by default. In general, I prefer to have the window open in my current working
    directory. Make this change as follows:


    ```

    # Open new panes and splits in the same working directory.

    bind c new-window -c "pane_current_path"

    ```


    This simple command saves you step every time you open a new window.


    # Naming and Numbering Windows


    By default, tmux tries to be smart and changes the name of window to the program
    that window is currently running. If it distracting to have window names change
    as I use them, I disable this automatic renaming behavior. In general, I rename
    a window as I''ve opened and give it a descriptive name instead.


    I also set tmux to number windows from 1 rather than 0, and to renumber them when
    I create or delete windows so that the numbering remains sequential, without gaps.
    If you don''t, youll rapidly get into double-digit numbers, which are harder to
    select (you can only use ^window-number to select windows 0 through 9).


    Configure these settings like so:


    ```

    # Set the name of the window initially, but then don''t tmux change it.

    # The name can still be set at any time with: ^b ,

    set-option -g allow-rename-off

    ```


    ```

    # Start windows and panes at 1.

    set -g base-index 1

    ```'
  merge: -1
  pgno: 401
- img_proc: true
  md: '# Splitting Windows More Intuitively


    I''ve always found ^b % and ^b ` odd commands for splitting, and still to this
    day I regularly mix them up. Instead, use ^b - to make a vertical split and ^b
    ` to make a horizontal split. The direction of the hyphen or pipe is a much easier
    way to remember what kind of split I''ll be making. Here''s how to change this:


    ```

    # Split panes using and -

    # bind split-window -h -c "#pane_current_path"

    # bind split-window -v -c "#pane_current_path"

    ```


    # Sending Commands to Nested Sessions


    I''m almost never in a tmux session. This means that if I open a nested session—for
    example, using ssh to connect to a virtual machine and running tmux there—I have
    trouble sending commands to the nested tmux. Using ^b c opens the new window on
    my machine, not in the nested session. Using binding-key b-prefix, I can use ^b
    b to send a command to the nested session:


    +   # Use ^b b to send the command to a nested session. This means if you are

    # using tmux and then can use ssh to connect to another machine that is also

    # running tmux, you can run commands in this nested session using ^b b command.

    bind-key b send-prefix


    > This might sound fiddly, but you''ll get a sense of how useful it can be in

    "Collaboration with tmux" on page 372.


    # Enabling Mouse Support


    If you have a mouse (which will normally be the case if you''re working with your
    local machine), you can enable it for tmux to drag panes to resize them, select
    panes and windows, and more.


    If you want to get really into the mouseeless flow, however, disable this option
    like so:


    ```

    # Enable mouse mode (tmux 2.1 and above)

    set -g mouse on

    ```


    This configuration will force you to learn the commands!'
  merge: -1
  pgno: 402
- img_proc: true
  md: '# Interfacing with Vim


    I set a number of configuration options to help tmux interface more seamlessly
    with Vim, and I use Vim directions rather than arrow keys to move around. This
    means I use ^b j to go to the pane below and ^b 1 to go to the pane right.


    I''ve also configured a number of key bindings making resizing panes more intuitive
    to Vim users, as well as Vim-style text selection.

    These more advanced options are of only interest to Vim users, however, if you
    want to learn more, see my dot files project at https://github.com/dwkmerr/dotfiles.


    # Setting Advanced Configuration


    We''re only touched on the most basic configuration options here, as you can customize
    tmux in any way imaginable. For example you can change the visual style of the
    status bar, the colors, the information shown, and there are plug-in managers
    for tmux to make it easier to install plug-ins for more customizability.


    These are more advanced configuration settings, however, I recommend exploring
    them only after you''re familiar with “vanilla” tmux. To see the available options,
    run man tmux or search for any of the excellent online guides on how to configure
    the program.


    # Collaboration with tmux


    Far so, you''ve run all of these sessions on your local machine. This is great
    for organizing your local work. But you can also run tmux on another machine or
    server, then connect to it from your machine like so:


    ```

    ssh -t effective-shell-aws-linux tmux attach

    ```


    The ssh program allows you to run a command on the server—in this case, the tmux
    attach command. If you ask ssh to run a command, by default it won''t connect
    the input of your terminal to the server. The idea is sometimes you''re just using
    ssh to run one-off commands and don''t need to stay connected. But for this command,
    you actually want to stay attached to the server, you use the -t (“request TTY”)
    flag to attach your terminal input to the SSH session.


    You can set up your ssh config file to automatically attach to the tmux session.
    This is how I set up ~/.ssh/config file entry for the virtual machine in Chapter
    22:


    ```

    Host effective-shell-aws-linux

    HostName ec2-13-213-71-135.ap-southeast-1.compute.amazonaws.com

    User ec2-user

    IdentityFile "/.ssh/effective-shell"

    RequestTTY yes # Ensure that you attach your terminal input.

    RemoteCommand tmux attach # Attach to the tmux session.

    ```'
  merge: -1
  pgno: 403
- img_proc: true
  md: 'With aws-linux configuration, when you use ssh to connect to the effective-shell-aws-linux
    box, you''ll run the tmux attach command and attach your terminal. To connect
    to tmux on the server now, you only need to run the following:


    ```

    ssh effective-shell-aws-linux

    ```


    At this point, you''re connected to the server and running tmux. You can run commands
    and background jobs, create windows, work with nested tmux sessions, and so on.
    Because all of these operations are running a tmux session, you can disconnect
    and resume without losing any work.


    # tmux Quick Guide


    To quickly see all of the tmux commands, run the ^b ? . The output of this command
    will look like this (remember that tmux also uses C for CTRL):


    +   - C-b C-b Send the prefix key

    - C-b C-o Rotate through the panes

    - C-b C-z Suspend the current layout

    - C-b Space Select next layout

    - C-b ! Break pane to a new window

    - C-b ^ Split window vertically

    - C-b # List all paste buffers

    - C-b $ Rename current session

    - C-b % Split window horizontally

    - C-b & Kill current window

    - C-b '' Prompt for window index to select

    - C-b ( Switch to previous client

    - C-b ) Switch to next client

    - C-b , Rename current window

    - C-b / Move the current window

    - C-b \ Describe key binding

    - C-b 0 Select window 0

    - C-b 1 Select window 1


    Table 24-3 offers a handy reference of common commands.


    # Table 24-3: Tmux Command Quick Reference


    | Command | Description |

    | --- | --- |

    | Essentials | List sessions. | |

    | tmux new [-s name] | Start a new tmux session (optionally named name). |

    | tmux attach [- name] | Attach to the last used session or the target session
    name. (continued) |'
