  md: 'If you hadn''t included a semicolon after the if command, the shell would have
    assumed the entire line was a single statement, giving the following error:


    ```

    bash: syntax error near unexpected token `fi`

    ```


    You can put as many statements on a single line as you like. You could even write
    the script like:


    ```

    if test -d /backups; then mkdir ~/backups; fi

    ```


    However, I suggest you start writing statements with if and then on separate lines.
    Once you''re more familiar with the syntax, you can combine the lines if you prefer,
    but generally speaking, keeping commands on separate lines makes your scripts
    more readable for other users.


    # The else Clause


    The else clause defines a series of statements that would be executed if the condition
    in the statement is not true. For example, the following script tells the user
    whether they''ve installed the common command:


    ```

    [ -e /usr/local/bin/common ]

    echo "The ''common'' command has been installed in the local bin folder.\nelse

    echo "The ''common'' command has not been installed in the local bin folder.\nfi

    ```


    The -e ("file or folder exists") operator checks whether a file or folder exists
    in the location /usr/local/bin/common (see Chapter 9 for a full discussion of
    the common command).


    If you run the script and you haven''t installed the common command, you''ll see
    the following output:


    ```

    '' ''common'' command has not been installed in the local bin folder.

    ```


    Note that you still need to use the fi keyword to close an if statement with a
    nested else statement.


    # The elif Clause


    The elif (short for "else if") clause creates additional checks and defines statements
    that should run if other conditions are true.


    This example updates the preceding script to check whether the common command
    is executable, using the -x ("is executable") operator:'
  merge: -1
