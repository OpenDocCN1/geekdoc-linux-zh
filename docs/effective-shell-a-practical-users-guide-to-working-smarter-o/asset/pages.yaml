  md: '![](img/1b4376e88e3e983d901a0c536b9dd3c9_424_0.png)


    # # SHELL BASICS


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_424_1.png)


    Performing basic operations in the shell—such as navigating your filesystem, managing
    files and folders, copying and pasting text, and getting help—can be a bit daunting
    at first. This appendix is a quick-start guide to build your confidence with these
    tasks.


    You can skip this appendix if you''re comfortable running a shell, if you know
    what bash is, and if you can run basic commands like ls and cd.


    # ## Navigating Your Filesystem


    Switching from a graphical user interface (GUI) to the shell can take some getting
    used to. We''ll start by taking a look at how to navigate your filesystem and
    get information on files and folders using the shell.


    This section will introduce the pwd, ls, pushd, popd, and cd commands, as well
    as the related concepts of directories, stacks, and paths. To follow'
  merge: -1
  pgno: 424
- img_proc: true
  md: 'along, make sure you''ve downloaded and installed the Effective Shell samples
    and tools by running this command:


    ```

    $ curl effective.sh | sh

    ```


    Note that the output you will see will differ slightly from mine to reflect your
    user and system information.


    # Identifying the Working Directory


    When you open a folder in a GUI, you can see its contents and interact with them
    for, by copying or moving files). In the shell, the same principle apply: you''re
    always working in a specific folder or directory. This is the working directory,
    and any command you type will run here unless you specify otherwise.


    To find out your current working directory, use the pwd ("print working directory")
    command:


    ```

    $ pwd

    /home/dwmkerr

    ```


    Your output may be formatted slightly differently depending on your operating
    system.


    # Listing the Contents of the Working Directory


    In a GUI environment like the folder system on Windows and macOS, files and folders
    in the current directory are normally represented as icons. In the shell, you
    don''t have this graphical view, so instead you use the ls ("list directory contents")
    command to see the files and folders in your working directory:


    ```

    $ ls

    Desktop Downloads fontconfig Pictures Templates

    Documents effective-shell Music Public Videos

    ```


    Again, you''ll see different files and folders specific to your system. Commands
    like ls and pwd can be combined with options that modify how they work. For example,
    using the -l ("long") option with ls lists the directory''s contents with some
    extra detail:'
  merge: -1
  pgno: 425
- img_proc: true
  md: '```

    $ ls -l

    total 40

    drwxr-xr-x 2 dwmkerr 4096 Apr 2 19:18 Desktop

    drwxr-xr-x 2 dwmkerr 4096 Apr 2 19:18 Documents

    drwxr-xr-x 2 dwmkerr 4096 Apr 2 19:18 Downloads

    drwxr-xr-x 13 dwmkerr 4096 Apr 3 18:02 effective-shell

    drwxr-xr-x 2 dwmkerr 4096 Apr 3 14:07 fontconfig

    ...

    ```


    Adding the -1 option indicates that you want more information than the filenames
    and folder names, such as who owns the file or folder when it was last modified.
    Many GUIs have a similar option.


    # Changing the Directory


    To move to a new directory in the shell, you run the cd ("change directory") command.
    Here I move to my pictures folder within the effective-shell folder:


    ```

    $ cd effective-shell/pictures

    ```


    My working directory is now /home/dwmkerr/effective-shell/pictures, which I confirm
    by running pwd again:


    ```

    $pwd

    /home/dwmkerr/effective-shell/pictures

    ```


    Another common option is to show all of the files in a directory, including any
    hidden files. In Linux systems, any file that starts with a dot is considered
    a hidden file and normally is not shown when you list the contents of a folder
    or view the folder in a GUI.


    To list all of the files in a folder, including hidden files, use the ls command
    with the -l option and the -a ("all") option. Here I list all of the files in
    my pictures folder:


    ```

    $ ls -al

    total 2364

    drwxr-xr-x 2 dwmkerr 4096 Apr 3 16:63 .

    drwxr-xr-x 12 dwmkerr 4096 Apr 3 18:42 ..

    -rw-r--r-- 1 dwmkerr 189965 Apr 3 16:63 laos-gch.himal.JPG

    -rw-r--r-- 1 dwmkerr 504568 Apr 3 16:63 nepal-mardi.jpeg

    -rw-r--r-- 1 dwmkerr 61 Apr 3 16:63 .notes

    ```'
  merge: -1
  pgno: 426
- img_proc: true
  md: 'The -a option tells the ls command not to hide files that start with a dot.
    As you can see, my pictures folder contains a hidden .notes file, as well as two
    special folders that I''ll describe in "Navigating with the Dot and Double-Dot
    Folders" on page 397.


    You might notice a pattern: shell commands are typically very short, making them
    easier to enter quickly, and they''re often made up of the first letters of the
    description of their purpose.


    | OPTIONS, PARAMETERS, FLAGS, AND ARGUMENTS |

    | You''ve seen two options so far: the -1 and -a options for the ls command. Options
    are sometimes referred to as flags, parameters, or arguments. In most cases—and
    in this book—the terms are used interchangeably, although flag generally means
    a simple option you can switch on or off. Don''t worry too much which word is
    used; they all just refer to ways you can modify a command''s default behavior.
    |


    # Returning to the Home Directory


    The home directory is a special folder where a user can keep their personal files,
    apart from the system files or shared by all users.

    In systems, every user has their own home directory, and the contents of their
    directory is accessible only to that user. Generally, you can''t see the contents
    of another user''s home directory (unless you''re an administrator who updates
    the security settings to allow this, which would be very unlikely in practice).
    When you open a shell, it starts in the home directory by default. In most of
    the examples you''ve seen so far, my working directory has been my home directory,
    /home/dweller.

    You''ll likely use your home directory a lot since most of your personal files
    will be. You can always move back to your home directory, no matter where you
    are, by running the cd command without any parameters. There''s also a shorthand
    you can use for it: the tilde (~). For example, I could shorten the command


    ```

    cd /home/dwmkerr/effective-shell

    ```


    to this:


    ```

    cd ~/effective-shell

    ```


    As you can imagine, the tilde shortcut can save you a lot of strokes over time.

    Now that you can move around to different folders, let''s talk a bit about how
    paths work.'
  merge: -1
  pgno: 427
- img_proc: true
  md: '# Using Absolute and Relative Paths


    A *path* is the location of a file or folder within the filesystem structure.

    There are two types of paths: absolute and relative.


    An *absolute path* gives the exact location of a file—for example, /home/dwmkerr/effective-shell.
    Absolute paths always start with a slash. The first slash represents the root
    of the filesystem, or the single folder that every folder lives in. If you come
    from Windows background, you might be used to drives, such as c:/ or d:/, instead
    of roots. On Linux, all files and folders live within one single root folder.


    A *relative path* is expressed in relation to your working directory, rather than
    the root, and does not start with a slash. For example, the relative path of a
    file in the /home/dwmkerr/effective-shell/pictures folder would be effective-shell/pictures/ls-gch.py


    If I wanted to move into my pictures folder from a working directory other than
    my home directory, I would use an absolute path:


    ```

    $ cd /home/dwmkerr/effective-shell-1/

    ```


    If I were already in my home directory (/home/dwmkerr), I could use a relative
    path instead:


    ```

    $ cd effective-shell/pictures

    ```


    A rule of thumb, use relative paths to save yourself typing when you want to move
    to a location within the current working directory. Use absolute paths when you
    need to move to somewhere completely outside your current working directory.


    # Moving Around Efficiently


    You can use a few tricks to speed up your navigation and quickly move to particular
    directories.


    # Navigating with the Dot and Double-Dot Folders


    When you combine the ls command with the -a and -l flags to list all the contents
    of a folder in detail, you will see two extra entries in the output: (a single
    dot) and .. (two dots). These are two special folders that are added by the system
    but are typically hidden. Let''s see how they work.


    First, I will list all the files in effective-shell folder in detail:


    ```

    $ ls ~/effective-shell

    total 52

    drwxr-xr-x 12 user dwmkerr 4096 Apr 3 19:54 .

    drwxr-xr-x 18 user dwmkerr 4096 Apr 3 19:54 ..

    drwxr-xr-x 2 user dwmkerr 4096 Apr 3 19:00 data

    drwxr-xr-x 3 user dwmkerr 4096 Apr 3 19:00 docs

    drwxr-xr-x 3 user dwmkerr 4096 Apr 3 19:00 logs

    ...

    ```'
  merge: -1
  pgno: 428
- img_proc: true
  md: 'Displaying the output in a detailed list reveals the dot and double-dot folders.
    The dot folder represents the current folder, so in this case it''s essentially
    an alias for the effective-shell folder. The dot folder can be useful because
    you''ll want a quick way to say, "Right here—the I''m in right now!" in a command.
    For example, to copy the effective-shell folder to the backups folder, I can do
    the following:


    ```

    $ cp -r . /backups

    ```


    The cp command is the copy command. The -r ("recursive") option tells the shell
    to copy recursively, meaning it will copy the given folder and all of its contents.
    I''ll discuss the cp command in more detail in "Copying a File" on "Copy and Move
    Tips" on page 404 and the box for now is that copying requires you to specify
    both the source folder and the destination folder. In this case, instead of typing
    out the full path of the source folder, I''ve used to "say" the current folder
    to ~/backups."


    The double-dot folder is a shortcut to the folder just above the current folder
    in the file hierarchy, known as the parent folder. You will use this shortcut
    frequently. For example, to quickly jump to the parent of the current working
    directory, you can type the following:


    ```

    $ cd ..

    ```


    This command tells the cd command to move "up" to the parent folder.

    The double-dot folder can also be helpful to specify paths outside of your current
    working directory. Say I''m currently in the /home/dave/Downloads folder. I can
    use this shortened command to move to the /home/dave/effective-shell folder:


    ```

    $ cd ../effective-shell

    ```


    This is like, "Go up one level to the /home/dave folder, then move into the effective-shell
    folder."

    Because every folder has a dot and a double-dot folder, you can chain these commands
    together. For example, if I were in the /home/dwm/effective-shell/pictures folder,
    I could move to /home/dwm like so:


    ```

    $ cd ../..

    ```


    This tells the shell to move up three folders from the current working directory.


    # Going Back to the Previous Directory


    The cd command has a special option that lets you quickly go back to the previous
    working directory:


    ```

    $ cd -

    ```'
  merge: -1
  pgno: 429
- img_proc: true
  md: 'Running this command again would return you to the working directory where
    you started.


    NOTE You can also move to the last directory, second-to-last directory, and third-last
    directory with the commands cd -1, cd -2, and cd -3 (and so on), respectively.


    The cd -command only works really to toggle the directory you were in and the
    one you''re now. If you need to go back and forth multiple times between folders
    or through a history of directories, using pushd and popd is a better option.


    # Pushing and Popping the Working Directory


    You can quickly move from one location to another and back again with the pushd
    and popd commands. The pushd ("push directory") command moves you to a new folder
    and keeps a record of your current working directory. This way, you can easily
    move backward, using the popd ("pop directory") command.


    Say I''m in my pictures folder and I want to quickly check my Downloads folder:


    +   $ pushd

    /home/dwmkerr/effective-shell/pictures

    $ pushd ~/Downloads

    $ pushd

    /home/dwmkerr/Downloads

    $ ls

    New-Wallpaper.jpg

    effective-shell.zip

    $ popd

    /home/dwmkerr/effective-shell/pictures


    Let''s break this down. First, I show my current working directory with the pwd
    command ❶. Then I "push" the Downloads folder ❷ working directory to verify that
    I''m now working in Downloads. I use ls to check which files are in this folder
    ❸ Finally, I "pop" back to where I started, and use the pwd command again to confirm
    the move ❹.


    You might be familiar with the concepts of pushing and popping if you''ve ever
    studied computing or programming, but if not, you''re probably wondering where
    these terms come from. They have to do with the directory stack, the shell uses
    to keep track of your current working directory. You can picture the directory
    stack as a stack of plates in a cafeteria. You can easily put plates on that stack
    but not in the middle or at the bottom. When you remove plates, you start by removing
    the top plate, then the next, and so on.


    Take a look at Figure B-1, which illustrates the directory stack for the previous
    example.'
  merge: -1
  pgno: 430
- img_proc: true
  md: '![](img/1b4376e88e3e983d901a0c536b9dd3c9_431_0.png)


    Figure B-1: The pushd command and popd directory stack


    When I used the pushd command, the shell recorded my working directory (/home/dwm/effective-shell/pictures)
    and then "pushed" the new location (the Downloads folder) to the top of the stack.
    Then, when I used the popd command, the shell "popped" Downloads off the top and
    moved to the location beneath it in the stack, the pictures folder. The item at
    the top of the stack is always your current working directory.


    You can run pushd without providing any parameters to swap the top two items on
    the stack. This is a handy trick to quickly switch between two directories you''re
    working regularly.


    Now that you''ve seen some ways to move around your system efficiently, let''s
    take a look at how you can manage your files and folders.


    # Managing Your Files and Folders


    In this section, you''ll learn how to manipulate files and folders in the shell
    as you would in a GUI. Once you can organize your files, you''ll be on your way
    to use the shell more effectively for day-to-day tasks. You''ll learn to download,
    unzip, copy, move, rename, and delete files.


    # Downloading a File


    First, you will download a playground area you can work in to avoid messing with
    your own personal files as you practice. I''ve created an Effective Shell ground
    folder and made it available as a ZIP file at https://effective-shell.com/downloads/effective-shell.zip.
    You could open a browser, download the file, unzip it, and start from there, but
    since this appendix is all how to handle everyday tasks in your shell, you''ll
    do it from the command line like:


