  md: 'If you want to rerun any of the commands in your history, enter an exclamation
    mark (!) and the command''s number like so:


    ```

    $!

    effective-shell: preparing to install the ''effective-shell.com'' samples...

    ```


    The 5 corresponds to the command curl effective.sh | sh, which installs the effective-shell
    samples. Most shells maintain your history in a history file, and number is just
    the line number from that file. You can find the history file''s location by running:


