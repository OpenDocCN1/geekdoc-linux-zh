- img_proc: true
  md: '# Using Output from Shell Code as Input


    Anything that is written as output from one command can be used as input to another
    program. Try this example:


    ```

    $ echo "Hello everyone!" | sed ''s/Hello/Goodbye/''ngoodbye!

    ```


    Here you use echo program to write a message to stdout. This is piped to the sed
    ("stream editor") command. The parameters for sed are s/Hello/Goodbye/, which
    instruct it to substitute the s text Hello with the text Goodbye. Chapter 7 discusses
    the sed command in detail.


    # Using Files as Input


    As you''ve seen, you can use files as input to a pipeline. Earlier you used cat
    to write the simpsons-characters.txt to stdout. In many cases, however, you don''t
    need to use cat; lots of programs accept the filepath as a parameter, so you can
    just tell the program to open the file directly. Let''s look at an example.


    +   First, use cat as usual to read the file, and pipe the output to the wc ("word
    count") command to count the number of lines:


    ```

    $ cat ~/effective-shell/text/simpsons-characters.txt | wc -l1

    ```


    Even though the wc program for "word count", it can count words, characters, and
    bytes. Passing it the -l option indicates you want to count lines. Note that,
    unlike most shell programs, the wc program indents its output.


    Now try the simpler version. Pass the filepath directly to the wc program like:


    ```

    $ wc -l ~/effective-shell/text/simpsons-characters.txt14 /Users/dhmker/playground/text/simpsons-characters.txt

    ```


    Passing a file as argument to wc eliminates the need to use cat or piping to provide
    input. Keep in mind that not all programs use the same conventions or parameter
    names for file input.


    You might have noticed that the output in the two examples is different. The second
    command returns both the line count and the path of the provided file input. In
    the first command, since you provided a stream of text to stdin, the wc program
    doesn''t know where it came from; input might have been a file, the keyboard,
    or a web address, for all knows.


    As a shorter form of the first command, you can also provide files as stdin with
    the left bracket (<):


    ```

    $ wc -l ~/effective-shell/text/simpsons-characters.txt14

    ```'
  merge: -1
