  md: 'Here’s an example of a script that lets users show the contents of a directory:


    echo "For each folder, choose y/n to show contents, or c to cancel."

    for entry in ~/*


    ```

    # If the file is not a directory, or it cannot be searched, skip it.

    if ! [ -d "$entry" ] || [ -x "$entry" ]; then continue; fi

    # Ask the user if they want to see the contents

    read -p "$entry? [y/n/c]: " choice

    # If the user uses "c" for cancel, break.

    if [ "$choice" = "c" ]; then break; fi

    # If the user uses "y" to show contents, list them.

    if [ "$choice" = "y" ]; then ls "$entry"; fi

    ```


    done


    If the directory is empty, the continue statement skips to the next directory.
    If it is not empty, the user is able to choose whether to show its contents, not
    show its contents, or cancel the operation. If the user cancels the operation,
    the break statement stops the loop from iterating.

    Using break and continue statements can simplify your loops; without them, it
    would be much harder to write loops like this one.


