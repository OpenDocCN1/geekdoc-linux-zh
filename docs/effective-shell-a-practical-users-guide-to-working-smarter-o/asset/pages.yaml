    # Chaining Commands


    One final conditional logic technique is chaining commands together in the

    shell (that is, running a command based on the result of a previous one).

    ’s how it works:


    ```

    mkdir -p ~/backups && cd ~/backups

    ```


    In this case, two commands are being chained together with the &&

    operator. The shell runs the cd command only if the mkdir command

    succeeds; that is, it evaluates result of mkdir, and if mkdir is successful,

    shell runs the cd command. Both commands must succeed for the overall

    result to be true. In pseudocode, it looks like this:


    ```

    if command1; then

    command2

    fi

    ```


    if command1 fails, the shell doesn’t need to evaluate command2.

    result must be false because the first command has already failed.'
