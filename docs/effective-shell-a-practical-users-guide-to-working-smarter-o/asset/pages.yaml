    "Citizen Kane (1941)"

    "Mission: Impossible - Fallout (2018)"

    "The Wizard of Oz (1939)"

    "The Irishman (2019)"

    ```


    With the -d ("delimiter") flag, you can choose a delimiter to cut the text, with
    the -f ("field") to choose which field you want to see. In this case, you''re
