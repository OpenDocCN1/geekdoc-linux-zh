  md: '# 15


    # CONFIGURING YOUR SHELL


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_238_0.png)


    Once you have the fundamentals of the shell down, you''re ready to start customizing
    it to suit your specific needs and preferences. This chapter introduces the various
    shell configuration files, explains how they work, and covers the many ways you
    can configure your shell with the options that work best for you.


    # Interactive Shells


    An interactive shell is any shell that has its input, output, and error standard
    streams (stdin, stdout, and stderr, respectively) connected to a terminal, which
    really just means that an interactive shell is one you interact with through a
    keyboard and monitor. When you enter commands using the shell or a terminal emulator
    like GNOME Terminal or KDE''s Konsole, you''re running an interactive shell.'
  merge: -1
  pgno: 238
- img_proc: true
  md: "# The Default Shell Startup File\n\nWhen an interactive shell starts, one of\
    \ the operations it performs is to run all of the commands in the file ~/.bashrc.\
    \ This startup file is what you'll use most often to configure your shell.\n\n\
    The rc in the filename stands for \"run commands\" (some people also refer to\
    \ it as \"run configuration\"). This is a convention from the early days of Unix,\
    \ and you will find that many Unix and Linux have startup files that end in rc.\
    \ For example, the Vim text editor loads the ~/.vimrc file when it starts (Chapter\
    \ 23 discusses Vim in detail).\n\n~/.bashrc is in your home directory, so it's\
    \ your personal bash configuration file. You can use another file, /etc/bash.bashrc,\
    \ to configure bash for all users. Having one configuration file that is used\
    \ globally and another for local, per-user customizations is another common feature\
    \ of Unix and Linux systems.\n\nThe shell uses ~/.zshrc for per-user configuration\
    \ and /etc/zshrc for global configuration. The paths are different, but the concepts\
    \ are the same. Other shells use different paths, which you should be able to\
    \ find in the shell's man pages.\n\nWe'll explore some other shell startup files\
    \ later in the chapter, but for now we'll focus on ~/.bashrc. Here are some of\
    \ the commands in the ~/.bashrc file on a clean Ubuntu installation (to learn\
    \ how to set up a free Ubuntu virtual machine, see Appendix A):\n\n```\n# If not\
    \ running interactively, don't do anything.\ncase $- in\n  *)\n    return;\nnesac\n\
    ```\n\n```\n# Don't put duplicate lines or lines starting with space in the history.\n\
    # See bash(1) for more options.\nHISTCONTROL=ignorebirth\n```\n\n```\n# Append\
    \ to the history file; don't overwrite it.\nshopt -s histappend\n```\n\n```\n\
    # For setting history length, see HISTSIZE and HISTFILESIZE\nHISTSIZE=1000\nHISTFILESIZE=2000\n\
    ...\n```\n\n```\n# some more ls aliases\nalias ll='ls -ALF'\nalias la='ls -A'\n\
    alias l='ls -CF'\n...\n```"
  merge: -1
  pgno: 239
- img_proc: true
  md: 'I''ve omitted parts of the file in this snippet to focus on the most interesting
    areas. The first part of the file checks to see if the shell is running interactively.
    Only interactive shells should be customized, so if the shell is not running interactively,
    return ("exit function or sourced script") called to stop processing the configuration
    file. Since this file is sourced by the shell—that is, executed by the current
    shell''s environment—you must return to stop processing it. If you use exit the
    shell will close as soon as it reads this file on startup, which is definitely
    not what you want. (For more sourcing, see Chapter 9).


    Next, the file sets up some of the configuration for the shell''s features, defining
    variables as HISTSIZE (the number of commands to store in the history) and setting
    some options with the shop ("set and unset option" command).


    The following part of the file defines aliases, convenient shorthands for shell
    commands. For example, la is alias for ls -A ("list all directories"), saving
    you few keystrokes. This is exactly the sort of configuration that makes sense
    to keep in ~/.bashrc file, since users can modify aliases to suit their preferences.
    But there are many other customizations you can add as well.


    # Common Startup File Customizations


    You can add any commands you like to the ~/.bashrc file, and they''ll run when
    the shell starts up. Let''s look at some of the most common configurations.


    # Saving Time with Aliases


    You just saw a few built-in aliases, but you can also create your own if you find
    yourself typing the same series of keystrokes over and again:


    ```

    # Start a web server

    alias serve=''python3 -m SimpleHTTPServer 3000''

    ```


    ```

    # Open vim without loading the vimrc.

    alias vimilla=''-vi -u NONE''

    ```


    ```

    # Run the kubectl command with one character.

    alias k=''kubectl''

    ```


    ```

    # Quickly go to GitHub repositories.

    alias code=''cd ~/repos/github/dwmkerr''

    ```


    This example creates four aliases: one to run a web server, one to open a text
    editor without loading extensions, one to shorten a command name, and one to move
    to a folder.


    You might use aliases to change the behavior of existing commands. For example,
    you can change the rm command to automatically ask for confirmation before a file
    is deleted:


    ```

    # Always run "rm" in interactive mode.

    alias rm=''rm -i''

    ```'
