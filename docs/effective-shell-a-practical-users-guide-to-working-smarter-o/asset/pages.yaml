    # Resolving Conflicts


    One of the most important features of any version control system is the ability
    to manage conflicts, or changes that contradict each other for some reason. When
    conflicts occur between a set of changes, Git cannot merge them until you manually
    intervene to tell it which of the changes takes precedence.


    Here are a few common scenarios that might lead to merge conflicts:


    +   - In one branch a file is deleted, and in another branch the file is changed.
    When Git merges the changes, should it delete the file or keep the version with
    changes?

    - In one branch a file is edited, and in another branch the same part of the file
    is edited but in a different way. Which edit Git keep? Or should it keep both?

    - In one branch you''ve added content to the end of a file, and in another branch
    you''ve added different content at the end of the same file. Which of these changes
    should come first?


    A lot of the time, you can avoid conflicts by making sure that you don''t keep
    branches for too long. If other people are merging changes into the main branch
    while you''re working on another branch, you are "dr" from the main branch. You
    should regularly update your branch with the changes in main or merge your changes
    into main.

    Version control systems have many different ways to manage conflict.

    See how Git does it, you''ll intentionally cause a conflict.

    First, create a branch that adds a new alias to the git_aliases.sh file:


    ```

    # Create a "log_alias" branch and commit a file.

    $ git checkout -b log_aliases

    $ echo ''alias log="git log --graph --oneline"'' >> ~/.shell.d/git_aliases

    $ git commit -a -m "add the ''log'' alias"

    ```


    Now go back to main and add an alias with the same name:


    ```

    # Go back to "main" and commit a change to the same file as the last one.

    $ git checkout main

    $ echo ''alias log="git log"'' >> ~/.shell.d/git_aliases

    $ git commit -a -m "add the ''log'' alias"

    ```


    You''ve merged the shell.d/git_aliases.sh file in two branches, so if you merge
    them, you''ll get a conflict message:


