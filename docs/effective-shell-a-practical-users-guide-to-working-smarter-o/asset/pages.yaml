- img_proc: true
  md: '# Introducing xargs


    The xargs (“build and execute commands”) command takes input


    ```

    $ mkdir -p /effective-shell/tmp

    $ cd /effective-shell/tmp

    $ touch file{1..100}.txt

    ```


    If you specify something doesn’t exist, touch it; otherwise, touch updates the
    file’s last modified or last accessed time. This code uses a nice trick brace
    expansion, which the shell expands file{1..100}.txt to file1.txt, file2.txt, and
    so on, all the way to file100.txt. Brace expansion is just one feature of a rich
    set of capabilities called expansion, which Chapter 20 describes in detail.


    Now you can clear empty files with the find (“find files and folders”) command
    like (see Chapter 3 for more on the find command):


    ```

    $ find .empty

    file1.txt

    file2.txt

    file3.txt

    file4.txt

    file5.txt

    ```


    To delete each empty file that find returned, pipe the list of files to the rm
    (“remove file”) command):


    ```

    $ find .empty | rm

    rm: missing operand

    Try ‘rm --help’ for more information.

    ```


    Uh-oh, what’s going on here? The issue is that rm doesn’t actually read the list
    of files from stdin, so you have to pass it as a parameter. This is where xargs
    can help. See what happens when you pass the list to xargs:


    ```

    $ find .empty | xargs

    /file40.txt /file8.txt /file35.txt /file81.txt ...

    ```'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'By default, xargs takes the input, separates each line with a space, and passes
    the list of files to the echo command. The echo command then writes the list out
    to the screen.


    You can change the command that xargs passes the arguments to as:


    ```

    $ find . -empty | xargs echo rm

    rm /file40.txt /file8.txt /file35.txt /file81.txt ...

    ```


    This tells xargs to pass the output to the echo command with rm as its first argument,
    which writes out rm followed by the list of files. Putting echo before whatever
    command you want to run is a useful way to check the command before committing
    to running it.


    Enter the following to finish the job and delete each file:


    ```

    $ find -empty | xargs rm

    ```


    Actually, run -ls to confirm that the files have been deleted.

    As you''ve seen, xargs constructs and executes a command with arguments from standard
    input. This is a great way to build complex commands dynamically. Let''s see how
    you can take it further.


    # Handling Whitespace, Special Characters, and Tracing


    One common challenge with xargs is how to deal with whitespace. What I mean, create
    three files with spaces in their names like so:


    ```

    $ touch "chapter {1,2,3}".md

    $ find . -type f

    ./chapter 1.md

    ./chapter 2.md

    ./chapter 3.md

    ```


    Then try deleting these files with rm:


    ```

    $ find -type f | xargs rm

    rm: cannot remove ''./chapter'': No such file or directory

    rm: cannot remove ''./1.md'': No such file or directory

    ```


    What went wrong here? Use the -t ("trace") option to show the command that xargs
    actually tried to run:


    ```

    $ find -type f | xargs -t md

    rm ./chapter 1.md ./chapter 2.md ./chapter 3.md

    ```


    Hopefully you can spot the error: the filenames include a space, and since you
    haven''t enclosed them in quotes, rm thinks you''re providing six files rather
    than three.'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'Fortunately, find works well with xargs since they''re part of the same package
    of tools (called findutils), and there''s a special pair of options that can deal
    with this problem. For find, you''ll use the -printinto action, and for xargs,
    you''ll use the -o option:


    ```

    $ find -type f -printinto | xargs -o -t rm

    rm ''./chapter.1.md'' ''./chapter.2.md'' ''./chapter.3.md''

    ```


    After telling find to end each result with a special null character, use the -o
    ("use NUL as separators") option to tell xargs that this character is what separates
    each line of input.


    > NOTE The null is the ASCII character 0 and is often used in programming to represent
    null or "nothing at all", as opposed to the digit zero used when printing to the
    screen, which is represented by decimal number 30 (or hexadecimal 48). To see
    the ASCII table, run man ascii.


    Don''t worry if you don''t really understand these internals. they might make
    sense since this is how strings in programming languages like C work, but otherwise
    all you need to know is they prevent the xargs program from getting confused when
    it sees spaces, tabs, quotes, newlines, and the like in a filename.


    I recommend pairing up the -print action with the -o option so you won''t get
    caught out by odd filenames. And remember that you can always use the -t option
    to trace what xargs is doing!


    # Customizing How xargs Processes Input Lines


    In the examples you''ve seen so far, every input to xargs has come on its line
    or separated by NULs. For instance, after creating five files, the command to
    find writes five lines of output, for each file found:


    ```

    $ touch "file"{1..5}

    $ find . -type f

    ./file1

    ./file2

    ./file3

    ./file4

    ./file5

    ```'
  merge: -1
  pgno: 133
- img_proc: true
  md: 'However, when this output is piped to xargs as input, xargs combines all five
    lines and passes them as a set of arguments to a single command execution:


    ```

    $ find -type f | xargs ./file1 ./file2 ./file3 ./file4 ./file5

    ```


    You don''t need to provide echo to xargs since that''s the default behavior, but
    I''ve added it for clarity. What''s important to note that echo is called once
    with five files as arguments.


    You can modify this behavior by using the -L ("max lines") parameter to specify
    how many input lines xargs processes per command execution. The following command,
    for example, ensures that the command executes for each line of input rather than
    all lines:


    ```

    $ find -type f | xargs -L 1 echo

    ./file1 ./file2 ./file3 ./file4 ./file5

    ```


    Now echo is called five times rather than just once.

    Processing all arguments in a single command execution is typically faster, but
    there are limits to how many arguments a command can handle at once. The -L flag
    helps you work around this limitation by breaking the input into smaller chunks.


    Let''s look at another example. This command processes three lines at time:


    ```

    $ find -type f | xargs -L 3 echo

    ./file1 ./file2 ./file3

    ./file4 ./file5

    ```


    Specifying L -3 means echo will run twice, processing the first three files and
    remaining the two files the second time. If there were seven input files, it would
    run three times: twice with three files and once with one.

    You might not use the -L parameter very often, but it''s important to understand
    what it does because many of the other options you''ll use -L 1. You''ll see these
    options in the next set of examples.


    # Organizing the Parameters for Commands


    You''ve probably noticed that now xargs puts the arguments it is given at the
    end of the command you write. For example, if the command you provide is rm, the
    parameters follow the rm command that is written.'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'But if you need the arguments to go somewhere other than the end of the command?
    For example, what if you wanted to copy every text file in folder to another location?
    In that case, you would need the *first* parameter to be the source file and the
    *last* parameter to be the destination folder.


    Here''s how you might start building this command:


    ```

    $ -name "*.txt" -printo | xargs -0 -t cp ~/backups

    cp /home/dwmkerr/file2.txt /file3.txt /file1.txt

    cp target ''./file1.txt'' is not a directory

    ```


    Obviously, this went wrong. The problem is that for the files be the *last* parameter,
    but xargs has made the *first* parameter and put the list of files at the end
    of the command.


    To fix this, you can tell xargs where to put the list of arguments with the -I
    {} (''replace string'') parameter:


    ```

    $ -name "*.txt" -printo | xargs -0 -I {} cp {} ~/backups

    cp /file2.txt /home/dwmkerr/backups

    cp /file3.txt /home/dwmkerr/backups

    cp /file1.txt /home/dwmkerr/backups

    ```


    This code sets the replacement string to a pair of braces ({}), which xargs tells
    you to see {} in the command string, replace it with your output. The {} is the
    first parameter for cp, which xargs expands to the list of files, ensuring that
    the cp command is constructed properly.


    Using the -I parameter automatically implies -l, which means the resulting command
    runs once for each individual input line. This is helpful because xargs can perform
    the replacement multiple times. To see why this makes sense with -l 1, look at
    this command:


    ```

    $ -name "*.txt" -printo | xargs -0 -t -I {} cp {} {}.backup

    cp /file2.txt /file2.txt.backup

    cp /file3.txt /file3.txt.backup

    cp /file1.txt /file1.txt.backup

    ```


    This uses the replacement string {} twice: once for the source file and once to
    create a new destination file with the same name ending with .backup. Note that
    {} includes the full path, so in subdirectories it would be expanded like this:


    ```

    bash

    cp /tmp/file1.txt /tmp/file1.txt.backup

    ```


    This may not what you want if you''re trying to put all backups in the current
    directory.


    Processing all files at once with a single cp command wouldn''t work because cp
    can have only one destination. By automatically using -l 1, xargs ensures that
    each input file gets its own separate cp command.'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# WHY BRACES?


    Braces are commonly used as placeholders in xargs examples and man pages because
    they match the convention used by the find command''s -exec option:


    The {} placeholder is built in to the -exec syntax; that is, it''s the default
    behavior for theexec option. With xargs, you must explicitly set both the -I flag
    and the replacement string to get similar behavior.


    While {} is the default replacement string, you can specify another characters
    if you use:


    ```

    $ xargs -I {} echo "You have env var: % set!"

    You have env var: SHELL=/bin/bash set

    You have env var: COLORTERM=truecolor set!

    You have env var: EDITOR=vi set

    ```


    Here, % is used as the replacement string instead, which can come in handy when
    you run a command that you''re building already contains braces.


    As you can see, the -I flag''s ability to insert arguments anywhere in a command
    makes xargs much more versatile, enabling file operations and custom command structures
    that wouldn''t be possible with the default argument placement.


    # Running Commands Interactively


    The -p ("prompt") option tells xargs to ask you to confirm each command before
    running. To test this, enter the following command to create a new pictures folder
    in your home directory:


    ```

    $ mkdir -p /pics

    ```


    Now move to the pictures folder and interactively copy its contents to the new
    pictures folder. For each picture, you''ll be asked to enter y ("yes") to confirm
    and run the n ("no") to skip the command:


    ```

    $ cd ~/effective-shell/pictures

    $ ls | xargs -t -I {} -cp {} /pics/{}

    cp .notes /home/wmkerr/pics.notes?...n

    cp laos-gch.JPG /home/wmkerr/pics/laos-gch.JPG?...y

    cp nepal-mardi-himal.jpeg /home/wmkerr/pics/nepal-mardi-himal.jpeg?...y

    ```'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'This example shows how easily you can sort through a collection of photos or
    other files and interactively decide to copy each one. As a bonus, xargs tells
    you exactly what command it''s planning to run, making it much easier to sort
    mistakes in commands before they''re executed.


    # Running a Command for Each Input


    If you want to run a command for each value in a string that is separated by a
    specific character, you can use the -d (''delimiter'') parameter to specify how
    xargs should break up the input. For example, say you want to run a command for
    each path in the PATH variable (the set of folders the shell will use to search
    for commands). Here''s how this variable is structured:


    ```

    $ echo PATH

    /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin...

    ```


    A single line of text shows each path separated by a colon (:). To pass each path
    to xargs, you''d have to split this string into multiple lines. Instead, you can
    use the -d parameter to tell xargs each input is separated by a colon:


    ```

    $ echo $PATH | xargs -d '':'' -p -l 1 ls

    /usr/local/sbin bin?...n

    /usr/local/sbin/bin ?...n

    ```


    The -l 1 and -p parameters ensure one command will be run for each input folder
    and display both a preview of the command and a prompt for confirmation before
    showing each xargs''s contents.


