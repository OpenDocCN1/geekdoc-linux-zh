  md: '# Be careful to break things


    Don''t run so many commands that you might cause errors or failures on startup.
    Excessive startup commands can make your shell slow and difficult to use, and
    it can also be hard to debug complex startup logic.


    # Clean up after yourself


    Remember, any variables you set will be set for all shells that read the startup
    file. If there are variables that you only need while the file is processing,
    using the unset command (covered in Chapter 14) to unset them after startup.


    # Expect your startup commands to be run multiple times


    Write your startup files with the assumption that they will be run multiple times.
    If you start a new shell from your current shell, startup files will be loaded
    again, make sure they won''t cause errors when run multiple times.


    In most cases, you''ll only need to work with the ~/.bashrc to configure your
    shell actually uses a number of different configuration files or startup files,
    such as /etc/profile, ~/.bash_profile, and ~/.bash_logout. Which files are used
    depends on whether you''re starting an interactive shell, a non-interactive shell,
    or a login shell. You''re familiar with interactive shells by so, let''s look
    at the other two types.


    # Non-interactive Shells


    Any shell that does not have stdin, stdout, and attached to a terminal is generally
    called a non-interactive shell. The most common example of non-interactive shell
    you''ve seen so far is that they run shell scripts. Let''s take a closer look.


    # Understanding Shell Script Behavior


    The book''s sample files include a script called showpstree.sh that shows some
    information about the current process.

    to run it, enter its name and press ENTER:


    ```

    $ /effective-shell/scripts/showpstree.sh

    ```


    > NOTE This script requires a tool called pstree. If pstree is not installed on
    your system, when you run this script you''ll see an error along instructions
    on how to install it. For example, if you''re running macOS and pstree is not
    installed, you''ll see this output:


    ```

    error: pstree not installed, try:

    brew install pstree

    ```


    Follow the instructions to install the tool, and then run the script again.'
