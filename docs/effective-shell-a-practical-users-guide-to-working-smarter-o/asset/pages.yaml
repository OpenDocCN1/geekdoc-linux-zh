- img_proc: true
  md: 'Before the s indicating your substitution, you’ve now included an address that
    tells which lines should apply the expression to. The address here is /cp, a regular
    expression meaning "any line starting with cp."

    Let’s break down the /cp/s/cp/rmdir/ expression:


    +   /cp An address to find lines starting with cp

    /s The substitution function for replacing text

    /cp The pattern—in this case, the literal text cp

    /rmdir The text that replace each occurrence of cp at the beginning of a line

    / The end of the replacement


    To summarize, this expression operates on lines with the text cp and replaces
    it with the text rmdir. The forward slash (/) tells where the address—that is,
    what the search and replace expression will on–starts and some people use a hash
    (#) or pipe (|) rather than a forward slash to delimit expressions, typically
    because they want to use the forward slash as part of a pattern.

    Because sed uses regular expressions by default, you could also write the preceding
    command as:


    ```

    $ sed -E ''s/^cp/rmdir/'' backup-config.sh

    ```


    # USING SED ADDRESSES


    | Addresses can be used in many sed functions and are quite sophisticated. Here
    are a few examples:

    | /test Any line matching the pattern test |

    | /test! Any line not matching test |

    | /6 Line six |

    | /$ The last line |

    | /1,10 Lines 1 to 10 |

    | /1,10! Lines except 1 to 10 |


    Run man sed to learn more about addresses.'
  merge: -1
