    - The .gitconfig file, Git''s own dot file, which you can use to fine-tune Git
    configuration

    - Tags, which you can add to commits to track releases for projects or other metadata

    - The git diff command, which lets you see changes between branches, commits,
    the index and the working tree, and more

    - The git stash command, which lets you temporarily save and reset any changes
    to the working tree without having to create a branch or commit; stashes are useful
    if you need to quickly go back to a "clean" working tree (perhaps on another branch)
    and then bring the changes later

    - The git clean command, which helps you remove unneeded files from your working
    tree

    - Interactive staging for files, parts of files (called hunks), or individual
    lines directly from the shell, which can be invaluable for making sure that exactly
    the right changes are going into the index

    - Patch staging or checkout with the git add -p command, which allows you to review
    and edit changes interactively as you stage them

    - Merge strategies such as squashing (combining multiple commits into one), which
    can be very useful when you''re working with branches

    - Rebasing, a merge workflow that can also help in other scenarios, such as having
    multiple people working on a repository and integrating complex changes

    - Commit and tag signing, a great solution for security-sensitive users that allows
    you to use special keys to sign your commits and improve your repository security

    - GitHub flow, a common workflow used with GitHub projects (see https://docs.github.com/en/get-started/using-github/github-flow)


    Many articles and online books on Git are available. I also recommend the excellent
    book Pro Git by Scott Chacon and Ben Straub (Apress, 2014).'
