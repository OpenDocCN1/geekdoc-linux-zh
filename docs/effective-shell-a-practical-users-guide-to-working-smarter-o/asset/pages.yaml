  md: "# Session Management with tmux\n\nSessions in tmux are a collection of independently\
    \ managed windows. They are great creating lots of projects; each session can\
    \ be a project with the appropriate windows and configuration for the work you're\
    \ doing.\n\n# Starting a Session\n\nClose your existing tmux session so that you\
    \ can start fresh:\n\n```\n$ exit\n```\n\nNow restart tmux, and name the session\
    \ effective-shell using the s (\"session\") parameter as follows: \n\n```\n$ tmux\
    \ new -s effective-shell\n```\n\nNow you'll create a new window and then create\
    \ a new session:\n\n```\n# Create a new window.\n^b c\n```\n\n```\n# Enter tmux\
    \ command mode.\n^b b :\n```\n\n```\n# Create a second session.\nnew -s my-project\n\
    ```\n\n```\n# Select from the list of sessions.\n^b s\n```\n\nThe ^b b : opens\
    \ the tmux command pane, which is shown at the bottom of the screen and allows\
    \ you to run a tmux command. When you open this pane, no longer need to put tmux\
    \ at the beginning of the command to create a new session, as you can see with\
    \ the my-project session. The ^b s opens the list of sessions. As you scan through\
    \ the list using the arrow keys, tmux gives you a preview of each session.\n\n\
    # Attaching and Detaching from Sessions\n\nAs noted, one of the great things about\
    \ sessions is that you can set them up, then detach from them to do other work.\
    \ The sessions will keep running, and you can reattach to them later. This means\
    \ you can close your terminal and reopen it and programs will still run.\n\nIf\
    \ you're in the shell and want to open tmux and attach to the last session, run\
    \ the following:\n\n```\n$ tmux attach\n```\n\nWhen you're in a tmux session,\
    \ you can detach from it like so:"
