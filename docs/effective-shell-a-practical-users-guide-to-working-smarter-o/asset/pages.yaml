    Another way to start a non-interactive shell in action is to simply invoke the
    shell program with a specified command like:


    ```

    $ sh -c ''echo $((5 + 5))''

    ```


    This example starts the sh program and provides a command via the -c ("command")
    flag, which launches a non-interactive shell.


    # Loading a Startup File with BASH_ENV


    Why don''t non-interactive shells load the ~/.bash configuration file by default?
    First, it doesn''t make sense for scripts to rely on user-customizations. If one
    uses an alias and refers to it in a script, the script won''t run for another
    unless they have the same alias. The second reason is performance: the shell can
    start much more quickly if it doesn''t need to load configurations or customizations
    before running a script.


    If you need to load a startup file for a non-interactive shell, set the BASH_ENV
    variable to your startup file''s path:


    ```

    $ BASH_ENV="~/my_custom_startup_file.sh" bash

    ```


    In general, however, you should avoid this approach, as shell commands and scripts
    should be written so that they can operate without requiring startup file configuration.


    # Login Shells


    When you log in to a computer with a shell, entering credentials such as a username
    and password, you''re using a login shell. Login shells normally run some initial
    setup of your environment, as setting the PATH variable, to provide the bare minimum
    configuration required to work with the system.


    For systems that don''t have a graphical user interface, any shell you create
    will be a child of the login shell and thus inherit the login shell configuration.
    For systems with graphical user interfaces, such as KDE and GNOME, when you log
    in, the desktop manager normally uses the same configuration as for a login shell,
    setting variables like PATH just as if you had logged in at the command line.'
