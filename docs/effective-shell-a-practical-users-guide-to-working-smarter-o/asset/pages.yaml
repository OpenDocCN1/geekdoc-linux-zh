  md: "commands. Conditional expressions have a number of other advantages over test\
    \ commands:\n\n+   - You can use the && and || operators without the potential\
    \ problems that using them with test can.\n- If you use || expression and the\
    \ left-hand side of the expression is true, the right-hand side won't be evaluated.\
    \ This isn't always the case with older versions of test when you use the -o operator,\
    \ which is a subtle difference but that can help avoid incorrect behavior.\n-\
    \ If you use && and the left-hand side of the expression is false, the right-hand\
    \ side won't be evaluated. As with the || operator, this is useful to know in\
    \ you're expecting the right-hand side to be evaluated.\n- Numbers are rarely\
    \ compared if they're in different formats (for example, you can compare hexadecimal\
    \ and octal numbers, which does not work in the standard test expression).\n-\
    \ You can use the incredibly useful = operator to include a regular expression\
    \ (regex) in your condition. We'll look at this shortly.\n\nSome people prefer\
    \ to use single brackets so that their script is more portable, as the double\
    \ brackets are specific to bash and bash-shells. Others prefer the double-bracket\
    \ syntax so that they can take advantage of the additional features it provides.\n\
    \nThe following example determines whether the user's shell is the Z shell by\
    \ checking whether the shell ends with zsh:\n\n```\nzsh_regex=\"~zsh\"\n[[ $SHELL\
    \ =~ ~$zsh_regex ]]; then\n  echo \"It looks like your shell '$SHELL' is Z shell\"\
