- img_proc: true
  md: '# Backtracking


    Backtracking refers to how a regex engine tries to identify a greedy match. In
    the simplest terms, if a regex finds a potential match only to subsequently realize
    it''s not a full match, it will back up and re-evaluate the text from the beginning.
    It''s possible to inadvertently retry a regex that it requires exponential processing
    to evaluate the input string. In the worst-case scenario, known as catastrophic
    backtracking, the processing power involved in trying to match a deceptively complex
    pattern can cause system failures or even lead to.


    There''s a fascinating write-up by John Graham-Cumming about how catastrophic
    backtracking led to a severe Cloudflare outage in 2019; search for "details of
    the Cloudflare outage on July 2, 2019" at https://blog.cloudflare.com.


    Broad and greedy expressions such as .+ (match at least once) can be susceptible
    to catastrophic backtracking. For example, the expression <+ is greedy and would
    need to backtrack at the end of the test string <a>ab</a> and start again, whereas
    the expression <+?> is lazy and wouldn''t need. With complex and long strings,
    this can have a high performance impact.


    Be sure to test your expressions with short and long strings to see if there''s
    a noticeable performance difference. Regular Expressions 101 and other tools can
    show you if your expression is consuming too many resources. To avoid unnecessary
    consumption, match more explicit characters and make expressions lazy when you
    can.


    # Lookarounds


    arounds are special constructs that make a pattern only if it comes before (a
    lookahead) or after (a lookbehind) another specified pattern. There are also negative
    lookheads and lookbehinds, which essentially say, "Find me a pattern that''s not
    preceded or followed by another pattern."


    As example, the expression d(?=) matches one or more digits as long as they precede
    a euro symbol: \d metacharacter indicates digits, the + quantifier specifies at
    least one, and the (?= is a positive lookahead that returns a match only if the
    pattern comes before the euro symbol.


    I have to find a situation where I''ve really needed a lookaround. For example,
    I would write the expression d(?=) more simply as:


    ```

    \d(?=)

    ```


    This regex uses a capture group to match one or more digits that precede a euro
    symbol.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# Atomic Groups


    Atomic groups are an advanced construct used to avoid backtracking. Lookarounds
    are atomic groups. Essentially, when an atomic group stops trying to match and
    all backtracking ceases. This provides a "get out" clause to avoid catastrophic
    backtracking.


    Atomic groups are a somewhat polarizing topic, but with lookarounds, I''ve yet
    to find a situation in my years of engineering that is genuinely simplified by
    the use of atomic groups. My advice is this: if you need to use a highly complex
    expression, break up the input first and process it in multiple steps. That will
    make your code easier for others to read and understand.


    # USING REGEXES IN DIFFERENT LANGUAGES


    Most of the features you''ve seen in this chapter will work regardless of whether
    you re using bash, JavaScript, Perl, Python, Golang, or another language, but
    as you move into more sophisticated features, you may find that some tools use
    slightly different syntaxes. These differences generally affect only advanced
    features named as capture groups (a special syntax that allows you to give groups
    a descriptive name). Wherever you might encounter these differences in this book,
    I''ve tried to call it out. You can also quickly check how a regex works with
    different tools using a website like Regular Expressions 101.


    I recommend keeping your expressions as simple as possible. If they''re too complex,
    break up your input or break up the processing into smaller chunks. This will
    help ensure they work as you expect, no matter what tool you''re using.


    Remember, too, that a regex isn''t the only way to validate input. For example,
    you might use a regex to quickly confirm that an email address on a web form has
    at least the correct structure but then use a more sophisticated check later (such
    as sending the user an activation email) to confirm that the address is legitimate.


    # Summary


    This chapter has given you a basic grounding in regular expressions. Knowing only
    a few concepts—like character sets, quantifiers, and capture groups—is plenty
    for most people. The Regular Expressions 101 website is a superb way to learn
    and check your regexes to get comfortable with the basics.


    Now that you''ve learned the theory, you''re ready to put it into practice. In
    the upcoming chapters, you''ll see how you can work with text in the wild using
    both regexes and a variety of other tools.'
