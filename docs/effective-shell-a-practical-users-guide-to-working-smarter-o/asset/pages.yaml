  md: '# Showing Git Information in the Command Prompt


    Chapter 16 covered how to customize the command prompt by setting the PS1 variable.
    As you start using Git more, you might find it convenient to show some information
    about the repository in your prompt.


    For example, as I am writing this chapter, my command prompt looks like this (but
    with syntax highlighting applied):


    ```

    $ github/dwkmerr/effective-shell feat/managing-git-remotes $ 1 in stash

    ```


    I prefer prompt over two lines, with the only character on the second line to
    keep our cursor from becoming too indented. Here is the breakdown of each component:


    +   github/dwkmerr/effective-shell Indicates my current folder and up to two parents
    in blue

    feat/managing-git-remotes Indicates my current Git branch (if I am in a Git repository)
    in green

    ! appears in red if you have uncommitted changes

    1 in stash appears in yellow if you have anything in my Git stash


    A Git stash is a temporary storage space that saves your uncommitted changes so
    you can switch to a different task and come back to them later. Stashes are more
    advanced feature and will be discussed briefly in the chapter.


    You can try this style of command prompt by calling the set_ps1 function:


    ```

    $ source ~/dotfiles/shell.d/set_ps1.sh

    $ set_ps1 dwkmerr

    ```


    The style name is dwkmerr since it''s my personal configuration, but free to create
    your own. To change back to your previous prompt, just run set_ps1 again without
    any parameters.


    If you''re interested in showing Git information in your command prompt, take
    a look at the set_ps1.sh file to see the full details. The following snippet shows
    how to get this Git information:


    ```

    _git_info() {

    # Don''t write anything if you''re not in a folder tracked by Git.

    if [ [ "$(git rev-parse --is-inside-work-tree 2>/dev/null)" == "true" ]; then

    return

    fi

    # Get the branch name, changes, and number of stashes.

    local git_branch="$(git branch --show-current)"

    local git_any_local_changes="$(git status --porcelain v2 2>/dev/null)"

    local git_stash_count="$(git ref-list --walk-reflogs --count)",

    ```'
