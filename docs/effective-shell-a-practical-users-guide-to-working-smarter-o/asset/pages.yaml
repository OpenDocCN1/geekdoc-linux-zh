    # Editing Commands


    As another example of how you can use Vim in your day-to-day work, you''ll enter
    a shell command that includes a mistake and use Vim to fix it. First, make sure
    your shell''s editor is set to Vim:


    ```

    $ EDITOR=vi

    ```


    Chapter 15 describes how you can set your preferred editor in your shell configuration
    file so you don''t have to type this command each time you open a new shell.


    Enter the following line of text in the shell (but don''t press ENTER to execute
    it!):


    ```

    $ git commit -m ''added more detail on motions''

    ```


    This command will commit file changes—but you haven''t added any changes yet.
    Rather than fixing the command by backspacing, adding the missing part, and then
    re-entering this text (which is time consuming), you''ll open the current shell
    command line in Vim and fix it there.


    Press CTRL-X, CTRL-E to tell the shell to open the current line in your configured
    editor:


    ```

    git commit -m ''added more detail on motions''

    ~~

    ~ "/tmp/bash-fc-5094983766" 1L, 45B

    ```


    Now fix up the command with your new Vim skills. First, enter insert mode:


    ```

    i

    git commit -m ''added more detail on motions''

    ```'
