- img_proc: true
  md: 'The < redirects the standard input of a program to come from the given file.
    This is a stream redirection operator, and we''ll see some others in this chapter.


    For readability, I tend to use cat when building pipelines so that it''s immediately
    clear where the data comes from, as the pipeline reads from left to right. This
    is just a personal preference, so free to use whichever option you suit.


    Now here''s a cool trick to get word count information of whatever text enter
    after the wc command:


    ```

    $ wc /dev/stdin

    one two three

    -D 1 3 14 /dev/stdin

    ```


    First, you run wc and tell it the file to read from the special /dev/stdin file
    (that is, the stdin stream). Next, you enter some (one two) and press CTRL-D to
    let the program know you''re done (remember, CTRL-D means "end of transmission”).
    Since you didn''t specify an option as -l to tell wc what you''d like to count,
    the program returns everything it can—the number of lines, words, and bytes it
    reads from its input—followed by where it read the input.


    If a program offers the option to specify a filepath but not to read from standard
    input, you can also trick it into doing the latter by providing the filepath of
    stdin.


    # Using Clipboard Content as Input


    You can use clipboard content in pipelines too. In your text editor, type this
    is not a palindrome and copy that to your clipboard. Then run the following:


    ```

    $ xclip -o | rev | xclip

    ```


    This pipeline uses the xclip ("clipboard") command with the -o ("output") flag
    to paste the contents of the clipboard to stdout, pipes to rev ("reverse text"),
    and then pipes the output to xclip, which runs without the -o flag, copies the
    reversed text to the clipboard. When you run xclip -o again, you should see this
    output:


    emordnilap a ton si sit


    > NOTE

    xclip command should be installed on most Linux distributions that use a windowing
    system. For instructions on how to access the clipboard on a macOS or Windows
    machine, see Appendix B.


    Processing the text on your in the shell can be very useful for building more
    complex commands or formatting data you have copied.'
