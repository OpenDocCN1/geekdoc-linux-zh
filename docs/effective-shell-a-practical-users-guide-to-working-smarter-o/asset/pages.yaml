  md: 'the number of times the command occurred in the input (that is, the count of
    each command):


    ```

    $ tail /.bash_history -n 1000 \

    > sort history.txt \\

    > uniq -c\n1 git checkout main\n3 git status\n2 open\n1 restart-shell\n2 vi README.md

    ```


    The sed command removes the whitespace just added by the uniq -c command (for
    more on sed, see Chapter 7):


    ```

    $ tail /.bash_history -n 1000 \

    > sort history.txt \\

    > uniq -c\n> sed ''s/^//''\n1 git checkout main\n3 git status\n2 open\n1 restart-shell\n2
    vi README.md

    ```


    Now you have a list of the commands from the history along with a count of how
    many times they''ve been used. Using the sort command with the -n ("numerical
    sort") flag and the -r ("reverse") flag sorts the list in descending order to
    make it readable:


    ```

    $ tail /.bash_history -n 1000 \

    > sort history.txt \\

    > uniq -c\n> sed ''s/^//''\n> sort -n -r\n3 git status\n2 vi README.md\n2 open\n1
    restart-shell\n1 git checkout main

    ```


    The list of commands is now displayed with the most commonly used first, then,
    and so on.


    > The -n flag tells sort to treat numbers as numerical values instead of text,
    which ensures that larger numbers (such as 100) are correctly ordered before smaller
    ones (like 10), which wouldn''t happen in the default text-based sort.'
