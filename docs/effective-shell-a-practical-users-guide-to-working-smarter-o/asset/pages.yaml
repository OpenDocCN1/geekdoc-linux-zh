- img_proc: true
  md: 'The plus signs (+) differentiate the trace lines from the script’s normal output.
    The final line of output in this example doesn’t begin with a plus sign, because
    it’s actual output from the echo command, rather than a trace line.


    The number of plus signs on each line indicates the level of indirection, which
    is how many subshells are running. Each subshell is traced on its own line. This
    makes tracing complex commands that execute subshells easier:


    ```

    $ set -x

    $ echo "Name of home folder is $(basename$(echo ~)"

    +++ echo /home/dwmkerr

    ++ basename /home/dwmkerr

    + echo ‘Name of home folder is dwmkerr’

    ```


    Tracing each command in the order in it runs, with each plus sign indicating another
    nesting level. This example has three levels of indirection: the main shell (+)
    runs the echo command, the first subshell ++) runs the basename command, and the
    second subshell (+++) runs the innermost echo command.


    I often start my shell scripts with a snippet like this:


    ```

    # Fail on errors in commands or pipelines.

    set -e

    set -o pipefail

    ```


    ```

    # Uncomment the next line to enable tracing to debug the script.

    set -x

    ```


    This combines the first two patterns you’ve seen: failing on errors and tracing
    a script.


    # Checking for Existing Variables or Functions


    You can optionally use the declare (“set variable values and attributes”) command
    to explicitly declare that you’re creating a variable. Sometimes the command is
    required—for example, when you want to create an associative array (as discussed
    in Chapter 10).


    The declare command has a number of options, but a particularly useful one is
    -p (“display attributes and value”), shows all variables of a certain type. For
    example, you can show all of the associative arrays that have been created so:


    ```

    $ declare -p -A

    declare -A BASH_ALIASES=()

    declare -A BASH_CMDS=()

    ...

    ```'
