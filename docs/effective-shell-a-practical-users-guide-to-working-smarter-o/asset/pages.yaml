  md: 'To use SSH, you''ll need a private key and a public key, known as a key pair,
    to manage authentication. A detailed description of key pairs, cryptography, and
    the mechanics of SSH is beyond the scope of this book, but if you''re interested
    in learning more, I highly recommend Applied Cryptography: Protocols, Algorithms,
    and Source Code in C by Bruce Schneider (Wiley, 2015). All you need to know for
    the purposes of this chapter is to create a key pair and use it to authenticate
    to remote


    # Creating a Key Pair


    You''ll use the OpenSSH authentication utility ssh-keygen to create a key pair
    to communicate with a server on Amazon Web Services (AWS). AWS is a cloud services
    provider you use to create a virtual machine to connect to. AWS requires you to
    use a particular format known as Privacy Enhanced Mail (PEM). To specify the PEM
    format, move to the ~/.ssh folder, which is where users often store their SSH
    keys:


    ```

    $ cd ~/ssh

    ```


    Then run the command ssh-keygen with the -m ("key format") parameter to set PEM
    as the format like so:


    ```

    $ ssh-keygen -m PEM

    ```


    When you run this, you''ll be asked where you''d like to save the file. Keep the
    default location (~/.ssh folder) or make the key pair effective-shell:


    Generating public/private rsa key.

    Enter file in which to save the key (/home/dwmkerr/.ssh/id_rsa): effective-shell

    Enter passphrase (empty for no passphrase):


    When prompted to provide an optional passphrase, simply press ENTER to skip it.
    Since you''re not using the server or the key for any彼此 sensitive data in these
    exercises, you don''t need a passphrase. In the future, be sure to add a passphrase
    if you''re creating keys to encrypt sensitive data. You''ll be required to enter
    that passphrase each time you load the key; this added security measure ensures
    that if someone were to steal your key, they would need your passphrase to open
    it.

    Once you''ve pressed twice, you''ll see the final output:


    Your identification has been saved in effective-shell

    Your public key has been saved in effective-shell.pub

    The key fingerprint is:

    SHA256:HqIl13ZhRz29jvhY0364FEYT3maAo0c6P4mnh4aKUY8 dwmkerr@gmail.com

