- img_proc: true
  md: '# Ensuring Exit on Failure


    Chapter 13 explained that, by default, shell scripts will continue to execute
    if a command fails. This behavior makes sense for an interactive shell, where
    you wouldn''t want the shell to close if a command fails. For a shell script,
    continuing to run after an error has occurred will most likely cause unexpected
    behavior.


    Two options override this default behavior:


    +   - set -e Ensures that the shell will exit if a command fails

    - set -o pipefail Ensures that the shell will exit if any command in a pipeline
    fails


    In a pipeline, the set -e option causes the script to exit only if the final command
    in the pipeline fails. Thus, for most pipelines, you''ll want to use the pipefail
    option to ensure that the script exits if any command fails.


    Here''s an example showing why these options are useful:


    ```

    # Create the effective-shell folder.

    mkdir -p ~/effective-shell

    ```


    ```

    # Download and unt the effective-shell samples.

    samples_uri=''https://effective-shell.com/downloads/effective-shell-samples.tar.gz''

    wget -c "${samples_uri}" -O - | tar -xz ~/effective-shell

    ```


    Without the set -e option, if the mkdir -p command fails, the script will continue
    to run. Specifically, it will attempt to download and untar a file into a nonexistent
    folder. Why mkdir -p fail? Although mkdir -p succeeds even if the folder exists,
    it still fails if there''s a file in the location specified, if you don''t have
    the right permissions to create the folder, you must be careful with commands
    you assume will run successfully, and so on.


    The second part of this snippet uses the wget "web get" command to download the
    samples and pipe the results to tar to extract them. In this case, if you''ve
    only set -e and wget fails (for example, if the address is wrong or you''re off),
    the shell will continue running the script''s subsequent commands and call tar,
    which won''t work as expected.


    If you have a command that you suspect fail, but you want to continue execution
    if it does fail, use the OR operator (||):


    ```

    # Remove the shell configuration.

    rm "$HOME/.shell.sh" || true

    ```


    As described in Chapter 11, the OR conditional operator ensures that even if the
    command fails for some reason, the statement''s overall result will be true and
    the script won''t exit.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Debugging Shell Scripts with the Trace Option


    Tracing is an incredibly useful debugging technique in which the shell writes
    each statement to stdout before evaluating it, letting you see the commands that
    will be run. To enable tracing, use the set (''set option'') command with the
    -x (''trace'') option.


    The following example shows the technique applied in the today.sh script, which
    creates a temporary folder for the current date:


    ```

    # today.sh creates a "today" symlink in the home directory folder to a fresh

    # temporary folder each day

    ```


    ```

    # Enable tracing in the script.


    # Get today''s date in the format YYYY-MM-DD.

    today=$(date +%Y-%m-%d)


    # Create a path to today''s temp folder and make sure the folder exists.

    temp_path="/tmp${today}"

    mkdir -p "${temp_path}"


    # Now make a symlink to the folder in your homedir.

    ln -sf "${temp_path}" "${HOME}/today"


    # Disable tracing that you are done with the work.

    set +x


    # Write out the path you created.

    echo "${temp_path}"

    ```


    The set -x command enables tracing early on the script, and set +x disables it
    toward the end. You generally don''t want to leave tracing once you''ve finished
    debugging as it can slow down execution, clutter your script, and potentially
    expose sensitive information.

    Running this script should return the following:


    ```

    $ /effective-shell/scripts/today.sh

    + date +%Y-%m-%d

    + today=2025-05-29

    + temp_path=/tmp/2025-05-29

    + mkdir -p /tmp/2025-05-29

    + ln -sf /tmp/2025-05-29 /home/dwmkerr/today

    + set +x

    /tmp/2025-05-29

    ```


    The shell writes each command to stdout before executing it. The parameters are
    expanded, making it far easier to see what''s going on and to troubleshoot issues.'
  merge: -1
