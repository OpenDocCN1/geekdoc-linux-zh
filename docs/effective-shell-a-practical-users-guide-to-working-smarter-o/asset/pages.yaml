    # Using Array Operators in Parameter Variables


    If you''ve read Chapter 10, you might notice parameter variables are similar to
    the array operators used to get the members or the length of an array. This function
    combines the "subset of elements" array operator (known as array slice) and the
    @ parameter variable:


    ```

    # Show the top "n" values of a set.

    show_top() {

    local n=\$

    local values=${@:n}

    echo "Top ${n} values: ${values}"

    }

    ```


    With the sum function, you can call show_top with any number of parameters:


    ```

    $ show_top 3 10 20 30 40 50

    Top 3 values: 10 20 30

    ```


    Using the array slice on the @variable returns a subset of the full array of parameters.
    This script is a little odd to read in when you set the values variable, you need
    to "skip" past the first positional parameter because parameter indicates the
    number of values to show (3, in this case), so the sub-sets starts at the second
    parameter (@2).


    # Shifting Parameters


    You can use the shift ("shift positional parameters") command to remove some parameters
    from the beginning of the positional parameters array and move the remaining parameters
    to take their place.'
