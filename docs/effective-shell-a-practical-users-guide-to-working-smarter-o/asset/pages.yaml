    # Combining grep with other Commands


    The grep command, just like most of the tools in this section, works on stdin
    by default, which means you can easily grep anything gets written to the screen.
    This section demonstrates a few simple examples to show how easy it is to use
    grep pipelines to perform more complex tasks by combining it with other commands.
    I don''t explain each command in detail. Instead, I highlight some parameters
    you haven''t seen yet to reinforce the idea that you become more familiar with
    grep, you''ll use it more often to handle all kinds of tasks.


    +   - All processes, then filter the list to only vim processes:


    ```

    ps -a | grep vim

    ```


    +   - Search through all of the yaml files in the k8s folder for the text password;
    show three lines of context, the filename, and the line number; and print the
    output in the pager so that you can search through:


    ```

    grep -H C 3 -R password . /k8s/**/*.yaml | less

    ```


    +   - Search through all of the installed programs for programs with zip the name:


    ```

    ls -al /usr/bin /bin /usr/local/bin | grep zip

    ```


    +   - Show the last 10 grep commands entered in the shell:


    ```

    history | grep tail -n 10

    ```


    You''ll see a lot more examples of grep in action throughout the book.


    # Alternatives to grep


    The grep command has been around for a long time, and over the years a number
    of alternatives have been developed. Most of these alternatives are designed either
    to be faster so that you can search files more quickly or to be easier so that
    you don''t have to remember many flags.


    In general, I''d avoid alternatives unless you encounter a situation where using
    grep genuinely limits what you can do or hampers performance. Alternatives can
    have a steep learning curve, may not be present or consistent across platforms,
    and are less likely to be available if you''re writing scripts or instructions
    for others.'
