- img_proc: true
  md: '# ### Table 18-1: Common Git Commands


    | Command | Description |

    |---|||

    | git init | Initialize a new Git repository. |

    | git status | Show the status of the working tree and index. |

    | git add files | Stage *files*. You can use patterns and wildcards. |

    | git reset files | Unstage *files*. You can use patterns and wildcards. |

    | git rm --cached files | Unstage *files*. You can use patterns and wildcards.
    |

    | git commit | Create a commit from the current index. The shell will open for
    the commit message. |

    | git commit -m ''message'' | Create a commit with the given message. |

    | git commit -a | Stage and commit all changes in the working tree. |

    | git checkout branch | Check out a branch. |

    | git checkout -b branch | Create and check out a new branch named *branch*. |

    | git branch name | Create a branch *name*, but do not change the current branch.
    |

    | git branch -m new_name | Change the current branch name to *new_name*. |

    | git merge branch | Merge the merge *branch* into the current branch. |

    | git log | Show the commit log. |

    | git log --oneline --branch | Show the log of commits, one line per commit, with
    the branch graph. |

    | git rm files | Stage the removal of *files*. You can use patterns and wildcards.
    |

    | git mv source destination | Stage the movement of *source* to *destination*.
    |

    | git checkout 8432bec | Check out the commit that has a SHA sharing with 8432bec.
    |

    | git checkout HEAD~1 | Move the current HEAD back one commit. |

    | git checkout HEAD~3 | Check out *branch*, then move back three commits from
    the tip of the *branch*. |


    You will encounter some of these again in Chapter 19, where you''ll employ your
    Git skills with GitHub, an online Git collaboration platform.


