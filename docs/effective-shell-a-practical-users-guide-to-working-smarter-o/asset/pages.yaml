  md: "expression, which checks whether the loop is complete; and the iterate expression,\
    \ which is evaluated after the loop commands are completed.\nThe following C-style\
    \ for loop iterates through five numbers:\n\n```\nfor (( i = 1; i <= 5; i++ ))\n\
    \    echo \"Loop ${i}\"\n\n```\n\nFirst, this code sets a counter, an iterator\
    \ variable named i, to 1 (the initialization expression). On each iteration through\
    \ the loop, it checks whether i is less than or equal to 5 (the conditional expression),\
    \ and if so, prints the iterate loop number. Finally, at the end of the iteration,\
    \ it adds 1 to i (the iterate expression).\n\nLet's break down step-by-step:\n\
    \n# First iteration\n\n+   1. Set i to 1.\n2. Check if 1 <= 5. Yes, so enter the\
    \ loop.\n3. Execute \"Loop 1\" to print Loop 1.\n4. Increment i to 2.\n\n# Second\
    \ iteration\n\n+   1. Check if 2 <= 5. Yes, so continue.\n2. Execute \"Loop 2\"\
    \ to print Loop 2.\n3. Increment i to 3.\n\nAnd so on until:\n\n# Sixth iteration\n\
    \n+   1. Check if 6 <= 5. No, so exit the loop.\n\nThe output of this script is\
    \ as follows:\n\n```\nLoop 1\nLoop 2\nLoop 3\nLoop 4\nLoop 5\n```\n\nC-style loops\
    \ can be a convenient way to run more complex loops than that iterate over a simple\
    \ set of words.\n\n# Looping over Sequences\n\nIt's also common to use a for loop\
