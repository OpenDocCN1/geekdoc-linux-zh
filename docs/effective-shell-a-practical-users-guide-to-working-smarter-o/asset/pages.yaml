  md: 'To test this out, you''ll add a command from the book''s sample files to bin.
    First, install the sample files to your effective-shell folder as follows:


    ```

    $ curl effective.sh | sh

    ```


    The sample scripts include a script called common, which shows commonly used commands.
    Add it to your bin directory like so:


    ```

    $ ln -s $HOME/effective-shell/scripts/common.sh $HOME/bin/common

    ```


    You can now run this command like so:


    ```

    $ common

    ```


    This convention ensures that your executable scripts or programs are separate
    from the system-provided bin folders, such as /usr/local/bin (which on some systems
    would require you to have administrative privileges to modify).


    # Setting Shell Options


    The ~/.bashrc file is the ideal place to configure your shell using shell options,
    settings that control how your shell works. These settings can add new shortcuts
    to navigate folders with the cd command, tweak the shell history file is managed,
    and more.


    This example uses the she command with the -s ("set") parameter to set the autocd
    ("execute directory names as commands") in your ~/.bashrc:


    ```

    $ shopopt -s autocd

    ```


    You can also set this option directly in your shell if you are running interactively:


    ```

    $ shopopt -s autocd

    ```


    You can now quickly go to a directory by entering its name and pressing ENTER:


    ```

    $ ~/effective-shell

    cd ~/Users/dwmkerr/effective-shell

    ```


    You can unset an option by using the -u ("unset option") parameter:


    ```

    $ shopopt -u autocd

    ```


    To list all available options, run shopopt with the -p ("print options status")
    parameter. Table 15-1 lists some of the most useful options.'
