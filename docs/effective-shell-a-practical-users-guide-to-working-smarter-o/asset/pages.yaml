    file. Say you''re storing a set of commonly used functions in a file called shell-functions.sh.
    You could source this file as part of your shell configuration like so:


    ```

    # Load my common shell functions

    source ~/-functions.sh

    ```


    In fact, a lot of the shell startup files do exactly this. For example, the default
    ~/.bashrc on Ubuntu has these lines:'
