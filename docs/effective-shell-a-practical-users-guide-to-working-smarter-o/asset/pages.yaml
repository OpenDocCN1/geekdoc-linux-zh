    $ history -r


    Let''s begin with the tail command and then look in turn at each command in the
    pipeline acting on its output.


    # Pipelining Commands


    First, the tail command reads up to 1,000 of the most recent commands in your
    history file:


    ```

    $ tail -n 1000 ~/.bash_history

    vi README.md

    git status

    git checkout main

    git status

    restart-shell

    git status

    open

    vi README.md

    open

    ```


    Next, the sort command puts duplicate lines next to each other so that you can
    easily count them later:


    ```

    $ tail ~/.bash_history -n 1000 \\

    > | sort

    git checkout main

    git status

    git status

    git status

    open

    open

    restart-shell

    vi README.md

    vi README.md

    ```


    Notice that when you enter the backslash continuation character and press ENTER,
    the shell starts a new line with the right bracket (>). Anything you add after
    this symbol is "joined" to the previous line, as with the sort command here.


    Next, uniq removes duplicate adjacent lines. Combining it with the -c ("show count")
    flag precedes each remaining line with some whitespace and'
  merge: -1
