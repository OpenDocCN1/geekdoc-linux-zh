  md: '# # 3 FINDING FILES AND FOLDERS


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_62_0.png)


    Searching through a system to find files or folders can be a complex and time-consuming
    process, even with a graphical user interface. In this chapter, we''ll make such
    searches a snap by using the shell instead. You''ll also learn how to perform
    actions on the search results, such as deleting them or running commands on them.


    # ## Searching with the find Command


    The find ("find files and folders") command is used both to search for files and
    folders and to perform operations on the search results. Let''s see it in action
    through the ~/effective-shell samples folder. First, if you haven''t done so already,
    run the following command to install the samples:


    ```

    $ curl effective.sh | sh

    ```'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'To use find, your commands should have the following structure:


    ```

    find options starting-point expression

    ```


    The options are parameters you can set to change how find works. The starting-point
    is the folder or set of folders find should search in, and the expression allows
    you to build more complex search patterns (you''ll see these patterns in detail
    shortly).

    The starting-point is the only part of the find command that''s required, which
    means the simplest use of find looks like this:


    # $ find ~/effective-shell


    +   - /text

    - /text/simpsons-characters.txt

    - /scripts

    - /scripts/show-info.sh

    - /websites

    - /websites/simple

    - /websites/simple/index.html

    - /websites/simple/styles.css

    - /websites/simple/code.js


    The find command lists the full hierarchy of files and folders contained in the
    given directory—in this case, ~/effective-shell.

    You can specify multiple directories with find, and it will display all the folders,
    subfolders, and files for all of those directories. Here''s how you could use
    find to show some of the tools installed on a system:


    ```

    $ find /usr/bin /usr/sbin

    /usr/bin

    /usr/bin/fwupdtool

    /usr/bin/gnome-keyring

    ```


    +   - /usr/sbin

    - /usr/sbin/cupsd

    - /usr/sbin/pppdump


    This command returns all of the files and folders in both the /usr/bin and /usr/sbin
    directories.

    Now that you''ve seen the most basic use of find, let''s look at what else it
    can do.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# Refining a Search with find


    You can use a search expression with the find command to narrow down the results
    it. For example, you can search for only files or folders, or for files with a
    certain name. In this section, you''ll continue working with the ~/effective-shell
    folder to explore some common ways to refine your searches, so move now:


    ```

    $ cd ~/effective-shell

    ```


    From this on, you can find the dot (.) folder as the directory to search through.
    If the dot folder is unfamiliar to you, see, “Navigating with the Dot and Double-Dot
    Folders” in Appendix B for more information.


    # Searching for Only Files or Folders


    You can add -type to your find command to filter your search only to files, like
    so:


    ```

    $ find . -type f

    /text/simpsons-characters.txt

    /scripts/show-info.sh

    /websites/simple/index.html

    /websites/simple/styles.css

    /websites/simple/code.js

    ```


    When you specify -type, you''re providing a search expression. The -type parameter
    is called a test and is used to filter the search results to those that match
    a specific format.

    To return only folders, use the following command (d is for directory):


    ```

    $ find . -type d

    ./text

    ./scripts

    ./websites

    ./websites/simple

    ```


    By default, the find command displays folders that are normally hidden, such as
    the dot folder.'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# Searching by File or Folder Name


    Use the -name tag as follows to search for files or folders by name:


    ```

    $ find . -name "simpsons-characters.txt"

    ./text/simpsons-characters.txt

    ```


    You can also use wildcards to search for any file or folder name containing a
    particular series of characters:


    ```

    $ find . -name "*log*"

    ./logs

    ./logs/web-server-logs.txt

    ./logs/apm-logs

    ./logs/apm-logs/apm05.logs

    ./logs/apm-logs/apm02.logs

    ./logs/apm-logs/apm03.logs

    ./logs/apm-logs/apm00.logs

    ./logs/apm-logs/apm01.logs

    ./logs/apm-logs/apm04.logs

    ```


    Including the asterisk (*) wildcard before and after log finds files and folders
    with log anywhere in their name. Using wildcards like this is known as supplying
    a pattern. You can read this pattern as "find any characters (including none)
    followed by the characters, followed by any other characters (including none)."

    Try running the command with the wildcards:


    ```

    $ find . -name "log"

    ```


    This time, find doesn''t return any of the .log files and folders, because none
    of them match the exact pattern log.

    The -name test is very specific; it will match only files or folders with the
    name provided. Try finding the apm00.logs file like so:


    ```

    $ find -name "apm00.logs"

    ./logs/apm-logs/apm00.logs

    ```


    Now try searching for apm-logs instead:


    ```

    $ find -name "apm-logs"

    ./logs/apm-logs

    ```


    The command displays the folder named apm-logs, but not the files in that folder.

    Even if you use a wildcard pattern, you get the same results:


    ```

    $ find -name "*apm-logs*"

    ./logs/apm-logs

    ```'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'Since none of the files in the apm-logs folder have apm-logs in their name,
    find doesn''t show them even though apm-logs appears in their path.


    Not only is it important to be precise with the name you provide, but you also
    be sure to use quotes when building your patterns. For example, this command


    ```

    $ find -name "*log*"

    ```


    will give different output from this command:


    ```

    $ find -name *log*

    ```


    In the first case, the quotation marks explicitly tell the shell to pass the *log*
    to the find command, and then interprets the wildcards.

    In the second case without the quotes, the shell interprets the wildcards and
    passes those results to find, which is quite different. This is how the shell
    expands the wildcard:


    ```

    $ parameter=(*log*)

    echo $parameter

    logs

    ```


    Without quotes, the shell changes *log* to the only file or folder in the current
    folder (effective-shell) that matches the name, which is logs. Wrapping the parameter
    in quotes tells the shell not to interfere with the text. Chapter 20 describes
    expansion behavior in more detail. The takeaway for now is simply not forget the
    quotes.


    # Searching by Path


    By using the -path with wildcards, you can search for patterns in a file-path
    and display all the files with any matching:


    ```

    $ find . -path "apm-logs*"

    ./logs/apm-logs

    ./logs/apm-logs/apm05.logs

    ./logs/apm-logs/apm02.logs

    ./logs/apm-logs/apm03.logs

    ./logs/apm-logs/apm00.logs

    ./logs/apm-logs/apm01.logs

    ./logs/apm-logs/apm04.logs

    ```


    Again, you must be very specific: without the wildcards, find wouldn''t return
    anything, because none of the results have the exact path apm-logs.


    # Specifying More Than One Search Option


    You can define multiple search options by using AND or OR expressions to combine
    parameters.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# AND Expressions


    Combining the -type and -name parameters allows you to run a more specific search,
    where find must match the given -type test and the given -name test. For example,
    you can search for only files that end in .logs as follows:


    ```

    $ find -type f -name "*.logs"

    ./logs/apm-logs/apm0.logs

    ./logs/apm-logs/apm02.logs

    ./logs/apm-logs/apm03.logs

    ./logs/apm-logs/apm00.logs

    ./logs/apm-logs/apm01.logs

    ./logs/apm-logs/apm04.logs

    ```


    This AND-style search returns only the items that match both criteria. You can
    explicitly create an AND expression by using the -and operator between the tests,
    but it is not necessarily as tests as AND expressions by default.


    # OR Expressions


    To perform an OR search, returning items that match either pattern you specify,
    use the -or operator like so:


    ```

    $ find -name "*.js" -or -name "*.html"

    ./websites/simple/index.html

    ./websites/simple/code.js

    ./programs/web-server/web-server.js

    ```


    In this case, find displays results that match the name expression, returning
    all files that end in either a .html or a .js extension.


    # Running Case-Insensitive Searches


    The searches you run so far have been case sensitive, which can unintentionally
    restrict your results. To run a case-insensitive search instead, use the -iname
    test:


    ```

    $ find -name "*.js" -or -name "*.Js" -or -name "*.jS" -or name "*.JS"

    $ find -iname "*.js"

    ```


    These two are identical, but I know which one I''d rather type.

    in addition to using -iname for case-insensitive name searches, you can use the
    -ipath test to run case-insensitive path searches.


    # Grouping Parts of an Expression


    You can group parts of an expression using parentheses to run a more complex search:


    ```

    $ find \(-name "*.js" -or -name "*.html" \) -path "programs*"

    ./programs/web-server/web-server.js

    ```'
  merge: -1
  pgno: 67
- img_proc: true
  md: 'The backslashes (\) before the parentheses are needed because parentheses have
    a special meaning in the Shell. The backslash escapes the parentheses; that is,
    it tells the shell to treat these characters literally and pass them directly
    to the find command.


    # ESCAPING SPECIAL CHARACTERS


    In the shell, some characters, like *, and (, have special meanings. Escaping
    tells the shell to ignore those meanings and instead treat the characters as plaintext.
    To escape, use a backslash before the special character, as in \$, \*, and \(.
    Escape special characters whenever you want the shell to treat them literally
    rather than interpreting them itself. For example


    ```

    echo "$HOME",

    ```


    prints the literal text $HOME, not the value of the variable HOME, whereas


    ```

    echo "$$HOME"

    ```


    prints the value of the variable HOME, which in my case would be /home/dwkmerrr.


    In the previous example, the parentheses group the first two expressions, which
    means find interprets the command as "find files with names that match *.js or
    *.html." The rest of the expression reads as "and their path must include the
    test programs."


    Leaving out the parentheses changes the meaning:


    ```

    $ find -name "*.js" -or -name "*.html" -and -path "programs*" /programs/web-server/web-server.js
    /websites/simple/code.js

    ```


    This expression now reads as "find files with names that match *.js, or find files
    with names that match *.html and are in a directory programs in the name." Think
    of the order of operations in mathematics, where within parentheses are evaluated
    before the rest of the expression, which means moving the parentheses will affect
    the result. If you''re unsure what will be evaluated, add the parentheses to set
    the order to be on the safe side.


    The distinction in these two cases is subtle. Grouping expressions with parentheses
    not only ensures an operation runs as expected but also makes your intent clearer
    for anyone reading your code.'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# # Excluding Search Results with the NOT Operator


    You can use the -not operator to build expressions that exclude certain results:


    ```

    $ find -name "*.js" -and -not -path "programs*"

    ./websites/simple/code.js

    ```


    This expression finds files that match the pattern *.js but excludes results that
    have programs in the path.


    > WHY DOES FIND HAVE WEIRD PARAMETERS?


    The find command frustrated me for years because its parameters don''t follow
    the standard patterns that shell users have come to. Why does it use -name instead
    of -n or -name? This convention for parameters is based on the Portable Operating
    System Interface (POSIX) syntax standards, which you can read more at https://www.gnu.org/software/libc/html_node/Argument-Syntax.html.

    The reason is that the -name, -and, -or, -ipath, and similar constructs aren''t
    parameters, per se, but parts of a mini search language that''s used to build
    a search expression. An expression can contain options, tests, and actions that
    are far more complex than what you''d normally put into a function''s parameters—which
    is why a search expression operates more like a distinct language. As mentioned,
    the parameters in the examples in this chapter are far actually tests that let
    you specify how to find files and folders, but as you''ll see shortly, you can
    also use actions in expressions to operate on your search results. For further
    details, run man find to access the man page for this.


    # # Acting on Search Results


    Expressions using the find command can also specify an action—that is, they tell
    find what it should do with the results. You might use find not only to search
    for a file or folder but also to do something with it, such as delete, copy, edit,
    or move it.


    I won''t go into much detail on these actions as I did for search expressions
    (in Chapter 8, you''ll learn about the xargs command, which has much flexible
    capabilities for performing actions on files), but we''ll look at the basics.
    You''ll likely encounter these operations elsewhere, so you''ll be familiar with
    them.'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# Printing Paths


    If you don''t specify an action when running find, it displays or prints the results
    onscreen. If the command is part of a pipeline, it outputs to the next stage.
    You can explicitly specify the -print action as follows:


    ```

    $ find ~ -name "*.tmp" -print

    /home/dwkerr/commands1.tmp

    /home/dwkerr/commands2.tmp

    /home/dwkerr/commands3.tmp

    ```


    This is equivalent to running find ~ -name "*.tmp" (in other words, leaving off
    -print, since that is the default behavior), so it''s unlikely that you''d need
    to use this expression in practice.


    # Deleting Files


    You can use the -delete action to delete the files and folders returned from find:


    ```

    $ find -name "*.tmp" -delete

    ```


    While this can be a convenient way to delete files, use this action with extreme
    caution. This command does not ask for confirmation or show what has been deleted,
    it''s easy to delete something accidentally.

    The -delete action also deletes the children of a folder before deleting itself,
    which can cause unexpected behavior. Chapter 17 will provide a safer and more
    convenient solution.


    # Executing Commands


    The -exec action allows you to execute a command on each search result, such as
    counting the number of words in the files returned from a find operation:


    ```

    $ find /effective-shell -name "*.txt" -exec wc -w {} \;

    29 /home/dwkerr/effective-shell/text/simpsons-characters.txt

    20 /home/dwkerr/effective-shell/quotes/iain-banks.txt

    16 /home/dwkerr/effective-shell/quotes/ursula-le-guin.txt

    1037 /home/dwkerr/effective-shell/logs/web-server-logs.txt

    ```


    First, finds for files with the *.txt pattern in their names in the effective-shell
    folder. Then the -exec action tells find to execute a command on each result.
    The wc -w {} calls the wc ("word count") command using the -w ("show word count")
    flag. The find command replaces the braces {} with the paths of the file(s) or
    folder(s) it finds. The semicolon signifies the end of the -exec command. Because
    the semicolon has a special meaning in the shell, it''s escaped with a backslash.'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'The wc command works only on files, not folders. To avoid getting an error
    in the unlikely event there is a folder that has .txt in its name, add -type f
    to the pattern to return only files. The final expression looks like:


    ```

    $ find /effective-shell -type f -name "*.txt" -exec wc -w {} \;

    ```


    This command displays the number of words in the .txt files it finds and skips
    any folders it encounters.


    # Confirming Commands Before Execution


    The ok action works like rm but asks for confirmation before executing each command.
    To find and then confirm you want to delete .txt files, run the following:


    ```

    $ find /effective-shell -name "*.txt" -ok rm {} \\

    rm /home/dummyker/effective-shell/text/simpsons-characters.txt ? n

    rm /home/dummyker/effective-shell/quotes/jain-banks.txt ? n

    rm /home/dummyker/effective-shell/quotes/ursula-le-guin.txt ? n

    rm /home/dummyker/effective-shell/logs/web-server-logs.txt ? n

    ```


    This command prints each search to the screen alongside a request asking whether
    you want to proceed. Entering n means that the rm (remove file) command will not
    be executed for the given file; entering y runs the command on file.


    The ok parameter is flexible with its input: pressing ENTER without typing anything
    is equivalent to saying "ok"; you can also enter n, no, or even o (for no) and
    1 (for yes).


    If there''s only one file you found learn, -ok should be it. Being able to search
    for files, run an action, and confirm that you''re okay with the action providing
    can save you from making careless mistakes.


    # Handling Symbolic Links


    Symbolic links, or symlinks, are like shortcuts to files or folders. They''re
    worth mentioning here how find handles them.


    Compare the output of these two commands:


    ```

    $ find /usr/bin

    /usr/bin

    /usr/bin/uux

    /usr/bin/cpan

    /usr/bin/BuildStrings

    /usr/bin/loads.d

    /usr/bin/write

    ```


    ```

    $ find /bin

    /bin

    ```


    It appears that /usr/bin contains files that /bin does not. However, if you run
    1 /bin, you''ll see that it indeed contain the same files as /usr/bin.'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'If you''re using macOS, run find /tmp rather than find /bin to see the same
    behavior.


    The reason for this result is that /bin is a symlink (a link to another folder)
    and /usr/bin is not. To prove this, run the following command:


    ```

    $ ls -l /usr grep bin

    lrwxr-xr-x 1 root 7 Aug 18:06 -> usr/bin

    lrwxr-xr-x 1 root 8 Aug 17:06 -> usr/sbin

    drwxr-xr-x 2 root 40960 25 Jan 17:17 bin

    drwxr-xr-x 2 root 20480 25 Jan 16:42 sbin

    ```


    The output on the far right shows that the root bin and sbin folders are just
    symlinks to /usr/bin and /usr/sbin, respectively. (The -> symbols indicate that
    folders are linked to another location)


    By default, the find command won''t return the location of the symlink points;
    it displays only the symlink itself as. If you want to return what the symlinks
    are linked to, use the -l (“follow links”) option:


    ```

    $ find -L /bin

    /bin/fwupdtool

    /bin/gnome-keyring

    /bin/dpkg-gencontrol

    /bin/priltools

    ```


    It''s important to understand these alternative ways of treating symlinks. For
    example, you might want to find all the symlinks in a folder and delete them,
    in which case you''d find to return the symlinks themselves (otherwise, you''d
    delete what they point to). Or you might want to check the size of a set of files,
    including any files that are linked to. In that case, you''d want to find return
    the files symlinks point to.


    To read more about the actions you can perform with the find command, open its
    man page with man find.


    # Going Further with find


    The find command is incredibly powerful. Going into detail on all of the options
    or potential ways they could fill another book, but there are a few handy commands
    that show versatile find can be:


    # Find large files


    Use the -size test to search by file size:


    ```

    $ find -size +1G -500G

    ```


    The + and - options allow you to set minimum and maximum sizes.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# Find recently modified files


    Use the -mtime test with a number of days to find recently modified files:


    ```

    $ find . -not -path "/*.*" -mtime -2

    ```


    This example returns only files that have been modified in the last two days.
    The -notpath test skips files and folders that are normally hidden.


    # Find files that have had permissions changed


    Use the -ctime test to find files with recently changed attributes, such as permissions:


    ```

    $ find "/.ssh -ctime -30

    ```


    This example returns files whose permissions have been changed in the past 30
    days.


    # Find executable scripts and make them non-executable


    You can also search by permissions. Here''s how to find and modify executable
    files:


    ```

    $ find ~ -perm /a/x chmod -x {} +

    ```


    The -perm test with the /a/x pattern searches for files where all users (individual
    users, file, and group owners) have executable permissions—that is, users for
    whom the x ("executable") bit is set. Combining this with chmod -x removes the
    bit, making the files non-executable. (The chmod command means "change permissions.")


    Ending the command with + than ; means find will find all the files to chmod at
    the same time and execute it only once on the entire set, rather than once for
    each file. This approach is slightly faster and highlights that there are options
    for running the specific command by the -exec-action.


    Sometimes, running a command with all of the parameters is not just fast but essential.
    For example, suppose you wanted to create a single ZIP file containing three files
    found by. If you used +, the find command would build the following zip command:
    zip archive.zip file1 archive.zip file2. If you instead used ;, the find command
    would build the following zip commands: zip archive.zip file1, archive.zip file2,
    and archive.zip file3.'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# Find empty folders and remove after confirmation


    The -empty test finds empty folders like so:


    ```

    $ find ~ -maxdepth 3 -type d -empty -ok rmdir {};

    ```


    The -maxdepth parameter allows you to limit the search to only three folders deep.
    By adding -ok, you''ll be able to confirm whether rmdir should delete the folders.


    # Summary


    The examples in this chapter have just scratched the surface of what find can
    do, but they''ve equipped you with the essentials. When you''re comfortable with
    the techniques covered here, you can continue to build on your knowledge of find
    and discover just how powerful and versatile it can be.


    The next chapter marks the start of Part II, where you''ll learn how to manipulate
    text and streams from the command line. We''ll begin by expanding on this chapter''s
    discussion of using patterns to match text: it''s time to meet regular expressions.'
  merge: -1
