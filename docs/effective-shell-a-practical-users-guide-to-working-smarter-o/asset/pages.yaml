    # PS4


    When you tracing with the -x option, each traced line starts with a sign (+) by
    default:


    ```

    $ set -x

    $ echo "The date is $(date)"

    ++ date

    + echo ''The date is Sun 08 Jun 2025 08:49:07 AM UTC''

    The date is Sun 08 Jun 2025 08:49:07 AM UTC

    ```


    To change the prompt, set the PS4 option:


