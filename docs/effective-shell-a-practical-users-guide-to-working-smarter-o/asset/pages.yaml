  md: "ANSI escape codes in a Bash script:\n\n```\n#!/bin/bash\n\nRED='\\033[0;31m'\n\
    NC='\\033[0m'\n\necho -e \"${RED}Hello${NC}\"\n```\n\nSave the script in a file,\
    \ make it executable, and run it in your terminal to see the colored output.\n\
    \nWhen you've finished your conversation, press CTRL-C to quit.\n\n# Copying or\
    \ Saving Results\n\nYou'll likely use Terminal AI to create code you wish to execute.\
    \ The ai tool allows you to quickly copy the most recent answer to your clipboard\
    \ or save it to a file. To do this action, run a simple query to create a snippet:\n\
    \n```\n$ ai - \"code output only - python to create a folder if it doesn't exist\"\
    \nimport os\n\nfolder_name = \"example_folder\"\nif not os.path.exists(folder_name):\n\
    \    os.makedirs(folder_name)\n```\n\n(Reply or press Enter for more options...)\n\
    chat:<Enter>\n\nAt the prompt, press ENTER instead of typing a reply. You'll see\
    \ a menu that gives you the option to copy the code to the clipboard, save it\
    \ to a file, execute it, or continue the chat:\n\n+   ? What next?:\n> Reply\n\
    Copy Response\nSave Response\nExecute Response\nQuit\n\nUse the up and down arrows\
    \ (or j and k if you remember your Vim shortcuts!) to select an option.\n\n# Executing\
    \ AI-Generated Scripts\n\nIf you choose the Execute Response option from the ai\
    \ menu, it opens the response in your default editor so that you can review or\
    \ change the generated code. Once you close your editor, you'll be asked to confirm\
    \ whether you want to execute the script. Before doing so, check the script carefully\
    \ to make sure it will do what you expect."
