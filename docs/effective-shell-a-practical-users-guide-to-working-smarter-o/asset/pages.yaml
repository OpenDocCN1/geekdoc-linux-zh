  md: '# Why Shell Scripts?


    As soon as you find yourself repeating the same sequence of commands in a shell,
    it''s time to consider saving those commands to a file and running the file instead.


    Saving commands as a shell script has a number of benefits. It saves time since
    you don''t have to type the commands whenever you want to run them. You can use
    your favorite editor to build the shell script, and you can add comments to describe
    what you''re trying to achieve (which will make it far easier for you or others
    to update the script over time). You can also share these shell scripts, meaning
    you can copy them to other machines and run them in different locations or share
    them with people who might find them useful.


    # Creating a Basic Shell Script


    To learn how to build and structure a shell script, you''ll create a script that
    shows your "common" commands—that is, those you run most often in your shell.
    You''ll enhance this basic script throughout the following chapters as you learn
    new techniques.


    If you''ve been reading this book sequentially, many of the commands and techniques
    you''ll use will already be familiar to you. You''re justにつき them together in
    one place, which is the essence of the script-building process.


    The script will do:


    +   1. Read the commands from the shell history.

    2. Sort the commands and count the number of duplicates to get an rate of how
    many times each command was run.

    3. Sort this list to show the most commonly run commands.

    4. Print the results to the screen.


    If you haven''t already done so, install this chapter''s samples to the ~/effective-shell-folder:


    ```

    $ curl effective.sh | sh

    ```


    First, you''ll create a place to hold your scripts and a file for the script itself.
    Enter the following commands to create a folder called scripts in your home directory,
    and add a new empty file to it common.v1.sh:


    ```

    $ mkdir -p ~/scripts

    $ touch ~/scripts/common.v1.sh

    ```


    The mkdir command creates a directory. The -p ("create parent directories") flag
    stops the command from returning an error if the'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'directory already exists. The touch command creates an empty file with the
    given name.


    # # Adding Code Comments


    Now that you''ve created your script file, you''ll add some helpful comments to
    explain what the code does. Comments are notes you add to a script or program
    to help the reader (or your future self) understand what is going on. Any text
    that follows a hash mark (#) is comments whether you type them in a script or
    directly on the command line.

    Here are a few examples of how comments can be used:


    +   - This is a comment - use this to describe what you''re trying to do.


    echo "Hello Shell" # Comments can also go at the end of a line.


    # You can also "comment out" a line of code so the shell ignores it:

    # echo "Goodbye Shell"


    The first comment takes up a whole line, the second comment is a brie explanation
    at the end of a line, and the third comment demonstrates "commenting out" code—that
    is, putting a hash mark in front of a command so it will not be executed.

    Your .sh file. Shell scripts are plaintext only, so you''ll need to use a basic
    text editor like Ged on Linux, Notepad on Windows, TextEdit on macOS, or code
    editor like Visual Studio Code, Sublime Text, or Notepad++ to work with them.
    You can also edit files directly in the shell using a terminal editor or Vim (see
    Chapter 23).

    Add the following text to the beginning of the file:


    ```

    # Inform the user of the output they can expect.

    echo "common commands:"

    ```


    The first line is a comment explaining your intention (namely, informing of the
    output they should expect from this script). Then echo the text common commands
    to the screen. Once the script is finished, the commonly used commands will follow
    this title.

    Comments are most useful when they describe why you''re doing something rather
    than what you''re doing. After all, the "what" should be clear from the commands
    themselves, but your intent might not always be obvious. That''s why Inform the
    user of the output they can expect is a stronger comment than say, Print "common
    commands:

    If you don''t come from a programming background, many of these comments might
    seem a little obvious. But as you write more and more code, you''ll realize that
    something seemed obvious to you when you wrote it can look surprisingly baffling
    even just a few days later.

    From this point on, I''ll use comments to explain what you''re trying to accomplish
    with each section of your script.'
