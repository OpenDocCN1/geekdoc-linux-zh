    Fast-forward

    README.md | 13 +++++++++++++++++++

    1 file changed, 13 insertions(+)

    create mode 100644 README.md

    ```


    The git pull command tells you what commit you''ve moved from and gives a summary
    of the files that have changed. You can see that a file named README.md has been
    created, which you can confirm by checking your local files as follows:'
