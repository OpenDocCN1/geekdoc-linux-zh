    As you can see, a pipeline is just a set of programs connected with pipes—easy!
    You can pipe as many programs together as you like. Pipelines create complex sequences
    of operations that work quickly, on very large files, because programs can read
    and process one chunk at a time. This kind of efficiency was particularly critical
    in the early days of Unix, when memory and resources were limited, and it is essential
    when you''re working with large files or streams that might be slow to read, as
    such as files you are downloading from the internet.

    Next, we''ll look at each stream in a little more detail by exploring of their
