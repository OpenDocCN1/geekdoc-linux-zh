    # Performing Fast-Forward Merges


    Sometimes you''ll want to take the changes from one branch and bring them into
    another. To do this, you use the git merge (“join two or more branches”) command.


    To merge the changes from the aliases into the main branch of the repository,
    first you check out the branch you want to merge into, and then you run git merge:


    ```

    $ git checkout main

    $ git merge aliases

    Updating d7ibb9..b9ae0ad

    Fast-forward

    shell.de/git_aliases.sh | 2 ++

    1 file changed, 2 insertions(+)

    create merge 100644 shell.de/git_aliases

    ```


    When you run the git merge command, Git tells you what type of merge it has performed.
    In this case, it''s a fast-forward merge, which is the simplest type. When Git
    tries to merge the two branches, it sees that each of the commits on the aliases
    branch can be applied sequentially to the main branch, as shown in Figure 18-7.
    In other words, the aliases follows directly after the main branch, with no diverging
    changes.


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_291_0.png)


    Figure 18-7: How Git prepares for a fast-forward merge


    Once the merge is complete, your branches should look like Figure 18-8.


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_291_1.png)


    Figure 18-8: The result of the fast-forward merge


    The main and aliases branches now contain the same set of commits. With the simplest
    merge case behind us, we''ll now look at a more complicated merge scenario: merging
    branches that have diverged.'
