    # Character Sets and Metacharacters


    To make your regex more accurate, you need to be more specific in what you match—for
    example, you shouldn''t accept a dot before the sign. To refine your match, you
    can use a character set, a group of allowed characters that you build, or a metacharacter,
    a predefined character set that represents a particular range of characters.


