    in this case. With just a few simple commands, you have many ways to accomplish
    the goal.

    Another way to use cut is by slicing a number of characters from each line. Take
    a look at this sample logfile:


    ```

    $ tail ~/effective-shell/logs/web-server-logs.txt

    2025-01T12:50:52.7210: info - Request: GET /en.search.min.f8b3b22e24a227c0576327cb92e4...

    2025-01T12:50:52.722i: info - Serving file ''../../../website/public/en.search.min.f8b3b2...

    2025-01T12:50:52.7632: info - Request: GET /svg/menu.svg

    2025-01T12:50:52.7632: info - Serving file ''../../../website/public/svg/menu.svg...

    2025-01T12:50:52.7632: info - Request: GET /svg/calendar.svg

    2025-01T12:50:52.7632: info - Serving file ''../../../website/public/svg/calendar.svg...

    2025-01T12:50:52.7652: info - Request: GET /svg/edit.svg

    2025-01T12:50:52.7662: info - Serving file ''../../../website/public/svg/edit.svg...

    2025-01T12:50:52.7682: info - Request: GET /fonts/roboto-v19-latin-300italic.woff2

    2025-01T12:50:52.7682: info - Serving file ''../../../public/fonts/roboto-v19-latin-300italic.woff2

    ```


    With the -c ("characters") flag, you can specify the characters in the line you
    want to see. It can also show the first 12 characters, which is the time part
    of each line, run with the following command:


    ```

    $ tail -n 3 ~/effective-shell/logs/web-server-logs.txt | cut -c 12-19

    12:50:52

    12:50:52

    12:50:52

    ```


    You can also use -n 3 to extract everything from a specific point onward:


    ```

    $ tail -n 3 ~/effective-shell/logs/web-server-logs.txt | cut -c 27-

    info - Serving file ''../../../website/public/svg/edit.svg...

    info - Request: GET /fonts/roboto-v19-latin-300italic.woff2

    info - Serving file ''../../../public/fonts/roboto-v19-latin-300italic.woff2...

    ```


    Cutting from the 27th character onward (-c 27-) removes the timestamp and leaves
    just the log message.'
