  md: '![](img/1b4376e88e3e983d901a0c536b9dd3c9_415_0.png)


    # A-2: Choosing where and for whom to install Cygwin


    In the next dialog, Cygwin will ask you where to install downloaded packages,
    when a proxy is needed, and what download sites to use. Leave these options at
    their default settings unless you know you''re doing and why you''d need to change
    them.


    Once Cygwin has downloaded the list of available packages, it will ask which packages
