    # Summary


    In this chapter, we discussed the SSH protocol and how keys are used to connect
    to remote servers. You learned how to set up an AWS account, create a virtual
    machine with a public key, connect to it with the ssh program, and configure SSH
    with an alias to make connections faster. You also saw some of the challenges
    of network connectivity (Chapter 24 will show you some techniques to handle these)
    and learned how to copy files to and from remote machines.


    Now that you can connect to remote servers, you need to know how to work within
    them. The next chapter will cover terminal editors, which allow you to rapidly
    work with text without leaving the shell, making the perfect solution for remote
    machines or systems without a desktop environment.'
