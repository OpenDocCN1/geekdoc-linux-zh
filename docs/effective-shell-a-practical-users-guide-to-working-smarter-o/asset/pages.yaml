    fetching first with the git pull command, which we''ll look next.


    # Pulling Changes


    The git pull ("download from remote") integrates the changes from a remote to
    the current branch. Because you''ve already told Git what the upstream branch
    for the main branch is, running git pull without any parameters will move to the
    latest commit:


    ```

    $ git pull

