  md: "Keep in mind, however, that the more you customize existing commands, the greater\
    \ the risk that tutorials and samples you follow may not work as expected, they'll\
    \ expect the command's default behavior.\n\n# Adding Functions to Streamline Operations\n\
    \nIf you regularly run specific sets of commands or more complex operations, you\
    \ can use functions to add them to your ~/.bashrc file, like:\n\n```\n# Restart\
    \ the shell.\nstart-shell() {\n  exec -l $SHELL\n}\n```\n\n```\n# Make a directory\
    \ (don't fail if it exists) and move into it in one line.\nfunction mkdir {\n\
    \  mkdir -p \"$1\" && cd - \"$1\"\n}\n```\n\n```\n# Cut, but in reverse, for example:\n\
    # echo \"One;Two;Three;Four;Five\" | rev cut d';' -f2\n# -> Four\nfunction rev\
    \ {\n  rev cut \"$@\" | rev\n}\n```\n\nThis creates one function that restarts\
    \ the shell, and one that immediately moves to it, and one that works like the\
    \ cut command in reverse.\n\nYou can find out more about functions in Chapter\
    \ 13.\n\n# Creating a Local bin Directory for Custom Commands\n\nMany users find\
    \ it useful to create a bin directory in their home folder to store their own\
    \ commands and scripts. You can create a local bin directory with this command:\n\
    \n```\n$ mkdir -p ~/bin\n```\n\nYou can update your ~/.bashrc file to add this\
    \ directory to the PATH variable (the variable shell uses to search for executable\
    \ files), which allows you to run the shell scripts or commands bin contains if\
    \ they were system-wide executables:\n\n```\n# Add the local bin directory to\
    \ the PATH if it exists.\nif [ -d \"$HOME/bin\" ]; then\n  export PATH=\"$HOME/bin:$PATH\"\
    \n}\n```"
