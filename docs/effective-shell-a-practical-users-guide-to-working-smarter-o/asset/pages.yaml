  md: 'The -i ("in place") flag works differently on some systems (such as macOS),
    so I generally prefer to output the result of sed to a new file and then replace
    the old one. However, it''s useful to know what this flag is and how it is used,
    you''ll see it often in scripts and online examples.


    # # Alternatives to sed


    The stream editor is very powerful, but it''s not the right solution for every
    scenario. Here are a couple of common alternatives:


    +   - awk


    If you''re researching how to perform more complex text-based operations, you''ll
    often see awk in the mix as a potential solution.


    The awk tool is very sophisticated and has its own language to support complex
    text manipulation. My advice is to first master sed and then turn to awk if you
    regularly find that you need more than sed can offer.


    # # Programming languages


    If I have tasks that are too complex for me to solve with my fairly basic knowledge
    of sed, I will generally write a small program in Python, Node.js, or another
    high-level and expressive language to do the work, and call that instead. This
    code will be easier to maintain and but you''ll have to decide on a case-by-case
    basis when to move from a shell command to a programming language. (See Chapter
    21 for an example of a complex operation that uses a Python script rather than
    the shell).


    # # Summary


    In this chapter, you learned all about sed, the stream editor tool, and how to
    write expressions for it to transform or otherwise manipulate text. You got a
    closer look at regular expressions, how to apply line patterns to control which
    lines of text sed operates on, and explored using patterns and capture groups
    to extract information.


    In the next chapter, you''ll meet xargs, a tool that enables you to manipulate
    text and then execute it as a shell command.'
