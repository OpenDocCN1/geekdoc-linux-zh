- img_proc: true
  md: '# Standard Error Applications


    It''s good practice for programs to write error messages to the stderr stream
    rather than the stdout stream. This allows you to differentiate between normal
    messages and messages indicating problems.


    Let''s see the stderr stream in action. Enter these two commands, which will cause
    an error:


    ```

    $ mkdir "/effective-shell/new-folder"

    $ mkdir "/effective-shell/new-folder"

    mdir: /home/dwnker/effective-shell/new-folder: File exists

    ```


    In the first case to mkdir, the folder is created successfully. The second however,
    returns an error because the folder already exists. There''s no real difference
    in how stdout and stderr behave in this case; stderr is a particular channel for
    error messages. However, when working with two streams, it''s important to know
    that, by default, the pipe operator acts on stdout, not stderr. If you want to
    use stderr in pipelines, you have tell the shell explicitly.


    Let''s look at an example of the default behavior in action. Say you want to make
    your error message more obvious by making all text uppercase with the tr ("translate
    characters") program. First, here''s an example of how tr works on some regular
    stdout content:


    ```

    $ echo ''Be quiet, this is a library!'' | tr ''[:lower:]'' ''[:upper:]''

    BE QUIET, IS A LIBRARY!

    ```


    This command successfully translates all the lowercase characters to uppercase.


    You''ll see how tr works in a lot more detail in Part II.


    Now try using tr to set the mkdir error message in all caps:


    ```

    $ mkdir "/playground/new-folder" | tr ''[:lower:]'' ''[:upper:]''

    mdir: /Users/dwnker/playground/new-folder: File exists

    ```


    You can see that this doesn''t work. That''s because the shell''s pipe operator
    pipes to stdout, not stderr. That means your error output isn''t being piped through
    the tr program; the mkdir command is writing the error message to stderr, and
    the shell writes the content of stderr to the screen, bypassing tr (see Figure
    2-8).


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_54_0.png)


    Figure 2-8: How the shell manages the mkdir command''s stderr output'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'To get different output behavior from stderr, you must explicitly redirect
    its content. Figure 2-9 shows some common options for where you send stderr.


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_55_0.png)


    Figure 2-9: Common options for dealing with stderr


    If you''ve done some shell scripting before, this might be an "aha" moment. Some
    of the obscure sequences shown in Figure 2-9, like 2>&1, might look familiar to
    you. We''re about to go over exactly what they mean if you haven''t guessed yet.


    # Redirecting to Standard Output


    To pipe the output to another command, you first redirect stderr to stdout, and
    then you can use a pipeline as usual, because the other command will be reading
    its stdin from the first program''s stdout, not stderr. This redirection requires
    some complicated-looking syntax: the 2>&1 Let''s break it down:


    +   - The 2 is the stderr file descriptor.

    - The redirect symbol (>) tells the shell that you want to redirect the file with
    descriptor 2, which is stderr.

    - The ampersand (&) tells the shell that the character that is a file descriptor.

    - The 1 is the stdout file descriptor.


    In summary, this command says, "Take the standard error stream and pipe it to
    standard output." You don''t need the ampersand before the first descriptor, because
    the shell supports output redirection only for file descriptors, so an additional
    ampersand would be superfluous (and would cause side effects).


    To make the error message through the tr command, redirect stderr to stdout like:


    ```

    $ mkdir ~/-effective-shell/new-folder 2>&1 | tr ''[:lower:]'' ''[:upper:]'' ''

    MKDIR: /USERS/DWMKERR/PLAYGROUND/NEW-FOLDER: FILE EXISTS

    ```'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'The error message will go to stdout and then be piped to tr, as shown in Figure
    2-10.


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_56_0.png)


    Figure 2-10: Redirecting stderr to stdout


    To make sure you remember the slightly obscure & that references a descriptor,
    see what happens when you don''t include:


    ```

    $ cat some-file-that-might-not-exist 2>1

    ```


    The shell writes stderr to a new file 1 rather than the file that has the 1 descriptor.


    # Redirecting to a File


    You can also redirect the standard error stream to a file with the > operator:


    ```

    $ mkdir ~/effective-shell/new-folder 2>.errors.txt

    ```


    This command redirects all content from stderr to a file called /errors.txt. You''ll
    often use this approach when running programs and logging any error output to
    a logfile for later review.


    > You might notice I often put the dot folder and a slash before filenames. has
    become a habit after years of working with the shell; the dot-slash makes it clear
    and unambiguous to anyone reading your code that they are seeing a filepath rather
    than a command or some other resource. You can omit the dot and slash in all other
    commands, and they will still work.


    # Writing to a File


    If you want to keep error messages but not see them on the screen straightforward,
    you can redirect the error output to a file with the > operator:


    ```

    $ mkdir ~/effective-shell/new-folder 2>.errors.log

    ```


    This is the same approach you for stdout, except that you''re explicitly saying
    you want to redirect file descriptor 2 (stderr) to a file. Like that operation,
    this one will create the file if it doesn''t exist and overwrite it if it does.


    # Redirecting to null


    Sometimes you don''t want to see the errors at all. For example, earlier you created
    a new-folder directory with mkdir and the command failed'
  merge: -1
