    +   - Add the "executable" flag to the "common" command.

    chmod +x $HOME/effective-shell/scripts/common.vi.sh


    +   - Remove the link to the "common" command from the local binaries folder.

    sudo rm /usr/local/bin/common


    The elif statement looks very similar to the if statement. The statement takes
    a set of commands, which could be normal shell commands or test commands.\It''s
    very important to consider the order in which the if and elif statements are executed.
    If the previous script were written like this, it wouldn''t have worked:


    ```

    if [ -e /usr/local/bin/common ]; then

    echo "The ''common'' command has been installed and is executable.\

    elif [ -x /usr/local/bin/common ]; then

    echo "The ''common'' command has been installed and is not executable.\

    else

    echo "The ''common'' command has not been installed.\

    fi

    ```


    This script first checks whether the file exists. If it does, the -e operator
    returns true and the check in the elif statement does not run. This means you''ll
    never successfully evaluate the statements in the elif block, because for the
    file to be executable, it must exist, so the first condition in the if statement
