  md: "# Looping Through find Command Results\n\nIf the files you'rere trying to loop\
    \ through are too complex to match with a shell pattern, you can use the find\
    \ command to narrow them down, then loop through the results. (See Chapter 3 for\
    \ more on the find command.)\n\nThe following example uses the find command to\
    \ loop and print every symlink in the user's home directory. Before running the\
    \ loop, it creates a symlink with a space, which causes some interesting output:\n\
    \n```\n# Create a symlink (with a space) to \"effective-shell\".\nln -s ~/effective-shell\
    \ ~/effective\\ shell\n# Find all symlinks and print each one.\nlinks=$(find -type\
    \ 1 -maxdepth 1)\nfor link in $links\n  echo \"Found Link: $link\"\ndone\n```\n\
    \nIf you run this script, the specific links you see will depend on how your system\
    \ is set up, but you'll also see results like these:\n\nFound Link: /home/dwmkerr/effective\n\
    Found Link: shell\n\nThe problem is that the shell has performed word splitting\
    \ at the space in the path /home/dwmkerr/effective shell. As a result, it looks\
    \ like two links have found: /home/dwmkerr/effective and shell. This is a persistent\
    \ headache-for anyone who needs to build shell scripts.\n\nYou can solve the problem\
    \ in many ways, by temporarily change the delimiter the shell uses to split text\
    \ into words, using a special variable IFS (\"internal field separator\\).\nThe\
    \ IFS variable tells the shell what characters to use as delimiters splitting\
    \ text into words. By default, IFS uses whitespace, which includes spaces, tabs,\
    \ and newlines. It is to split *only* on newlines solves the issue of files with\
    \ their paths:\n\n```\n# Save the current value of IFS, if you can restore it\
    \ later. Split on newlines.\nold_ifs=$IFS\nIFS=$'\n'\n# Find all symlinks and\
    \ print each one.\nlinks=$(find -type 1 -maxdepth 1)\nfor link in $links\n  echo\
    \ \"Found Link: $link\"\ndone\n# Restore the original value of IFS.\nIFS=$old_ifs\n\
    ```"
