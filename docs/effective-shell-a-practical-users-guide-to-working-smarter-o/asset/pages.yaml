  md: '# 18


    # CONTROLLING CHANGES WITH GIT


    Git is a popular version control tool you can use to manage changes to text, code,
    or any other type of file you might be working with. Many developers and teams
    use Git as a tool to allow users to contribute, collaborate, and publish their
    projects. In this chapter, we''ll look at Git operations that allow you to quickly
    and easily work with Git repositories, which are virtual storage spaces for your
    projects. You''ll use the dotfiles folder (introduced in the previous chapter)
    to track and manage changes with Git from the command line.


    Before diving into the specifics of working with Git, let''s go a little deeper
    into what exactly it is and how it came to be.'
