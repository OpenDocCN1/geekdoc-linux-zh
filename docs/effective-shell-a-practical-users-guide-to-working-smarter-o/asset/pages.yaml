  md: '# 21

    ALTERNATIVES TO

    SHELL SCRIPTING


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_344_0.png)


    Sometimes being an effective shell user means recognizing when a shell script
    is not the right tool for the job and you need a more powerful programming language
    instead. In this chapter, we''ll look at scenarios where shell scripting may not
    be ideal, explore the pros and cons of alternative approaches, and identify what
    constitutes a shell-friendly tool. Then you''ll create a real-world tool to look
    up a word''s definition using an online dictionary. This type of tool would be
    complex to produce with a shell script but is a snap with the Python programming
    language.'
  merge: -1
