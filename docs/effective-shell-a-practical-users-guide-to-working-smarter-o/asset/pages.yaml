  md: '# 4


    REGULAR EXPRESSION ESSENTIALS


    Many of the tools I’ll introduce in this part of the book support *regular expressions*,
    or *regexes*: special patterns for identifying and matching text, such as phone
    numbers or parameters from a command. But before you can start using regexes in
    the shell, it’s important to understand the basics of how they work. Regexes have
    a reputation for complexity that can be intimidating, but this chapter will offer
    tips and techniques to make them manageable. You’ll learn all about regex syntax,
    including quantifiers, metacharacters, and capture groups, and see examples of
    regexes in action. With this foundation, you’ll be well equipped to put regexes
    into practice in the chapters that follow.


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_78_0.png)'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# Regexes in a nutshell


    Regexes allow you to specifically define the structure of the text. Use regexes
    to find all text that matches a particular format, such as an email address, a
    credit card number, or a ZIP code. This means that you become familiar with them,
    you can define specific patterns for text and search for, replace, or alter this
    text.


    Regexes are notorious for being complex, and it''s true that their syntax can
    be initially overwhelming. For many years I avoided them for that reason, but
    over time I discovered that, used carefully, they can be incredibly powerful and
    useful.


    To see why they have a reputation for complexity, let''s look at a particularly
    complex regex. Say you want to see whether an arbitrary string matches the structure
    of a valid email address. A quick search on the internet returns this:


    ```

    (?:[a-z0-9!#\$%''*+/=?^_`{|}~\]|\.[a-z0-9!#\$%''*+/=?^_`{|}~-])*)@(?:[a-z0-9!#\$%''*+/=?^_`{|}~-]*\[a-z0-9!#\$%''*+/=?^_`{|}~-])*(?:\.[a-z0-9!#\$%''*+/=?^_`{|}~-]*)*@(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)*

    ```


    This is horrendously complex—and I already split the expression into multiple
    lines so that it fits on the page! This regex is so long that it''s almost impossible
    for even an experienced user to parse, and attempting to change or modify it would
    risk breaking the expression.


    Many people see examples like this and decide they simply can''t or won''t learn.
    However, and you''ll see in this chapter, how you have ways to use and manage
    regexes without getting overwhelmed.


    # Building Regexes


    Regexes do not have to be—and, in most cases, shouldn''t be—as complex as the
    previous example. My general advice for regexes is start simple and add complexity
    only if you need it.


    You can build regexes using an iterative process, starting with basic expressions,
    then adding more features as needed. For example, here is how you might build
    up a regex to validate an email address with some test data:


    +   1. Create a short list of valid email addresses.


    +   2. Add some items to the list that look at a glance but aren''t right—for
    example, @effective-shell.com (which is missing content before the sign).'
  merge: -1
  pgno: 79
- img_proc: true
  md: '3. Build a regex that matches a correct email address.

    4. Refine the expression to eliminate the invalid addresses.

    5. Repeat the previous step until most invalid addresses are eliminated.


    In many cases, this will be sufficient. Let''s try it out, starting with the test
    data in Listing 4-1.


    ```

    $$ cat //effective-shell/data/email-addresses.txt

