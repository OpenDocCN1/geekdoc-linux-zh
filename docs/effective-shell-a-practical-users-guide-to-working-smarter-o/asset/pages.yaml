  md: '# Contrast this to the || operator:


    ```

    [ -d ~/backups ] || mkdir ~/backups

    ```


    In this case, mkdir is evaluated only if the first command fails. Here''s the
    pseudocode:


    ```

    if ! command1; then

    command2

    fi

    ```


    If command1 succeeds, the shell doesn''t need to evaluate command2 because the
    result is already true. However, if command1 fails, the shell must evaluate command2
    to see it succeeds.

    In summary, here''s how command chaining works:


    ```

    # command1; if it succeeds, run command2.

    command1 && command2

    ```


    ```

    # command1; if it fails, run command2.

    command1 || command2

    ```


    This syntax is common in shell scripts because it''s very succinct. It''s also
    very useful when you''re using the shell interactively. For example, this command
    is almost second nature to me:

    make build && deploy


    Here I''m using make ("build programs") command. If the build step for a project
    succeeds, I want to run the deploy step. But obviously I don''t want to run the
    deploy step if the build step fails!

    Compare this example to the following command:

    make build; make deploy


    In this case, the two commands are separated by a semicolon; the second command
    will always run, regardless of whether the first succeeds.


