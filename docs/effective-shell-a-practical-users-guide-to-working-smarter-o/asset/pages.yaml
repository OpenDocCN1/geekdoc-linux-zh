  md: '# Accessing Online Cheat Sheets


    One final resource worth sharing is cheat.sh (https://www.cheat.sh), a fantastic
    online collection of "cheatsheets" covering tools, programming languages, and
    more. But its real beauty lies in how it integrates into the shell. To see it,
    run the following command:


    ```

    $ curl cht.sh

    ```


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_451_0.png)


    | curl cheat.sh/ls | $ cht.sh btrfs | $ cht.sh lua/:learn |

    | curl cht.sh/btrfs | $ cht.sh tar-list | learn any programming |

    | curl cht.sh/tar-list | | language not leaving |

    | curl https://cht.sh | | your shell |

    | | | *) any of 60


    | queries with curl | own optional client | learn, learn, learn! |


    | $ cht.sh go/fctab<tab> | $ cht.sh -shell | $ cht.sh go zip lists |

    | go/for gofunc | $ cht.sh help | Ask any question using |

    | $ cht.sh go/for | | cht.sh or curl cht.sh: |

    | | | /go/zip-lists |

    | | | (use /,+ when curling)


    | TAB-completion | interactive shell | programming questions+|


    | $ curl cht.sh/:help | $ vim prg.py | $ time curl cht.sh/ |

    | see :/help and :/intro | zip lists _ | real Om0.075s |

    | for usage information | <leader>K | ... |

    | and README.mid on GitHub | *awesome* |

    | for the details | | |

    | *start here* |


    | self-documented | queries from editor! | instant answers |


    The command, you''ll see again and again, and this is true for downloading content
    from the web. If you load cheat.sh (or its shortened version, cht.sh) from the
    shell, you get a text version of the website. You can then look at all sorts of
    content by following the guide shown.


    The cheat.sh website aggregates many data sources—including tldr. This means you
    can get information on tools without ever having to install them.


    Now that can be a real time saver!'
