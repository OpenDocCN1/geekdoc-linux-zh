  md: '# SHUT DOWN YOUR VIRTUAL MACHINE


    WHEN YOU''RE DONE!


    When you''ve finished experimenting with your virtual machine, power it down by
    selecting it in the AWS Console and choosing Instance State > Stop Instance. When
    you''re completely finished with the instance, choose Instance State > Terminate.
    You shouldn''t be billed for this instance, as it''s in the free tier, but safer
    than sorry!


    # Using SSH to Connect to a Virtual Machine


    In the SSH Client tab of the Connect to Instance page shown in Figure 22-9, you
    should see the address of the machine you''ve created. AWS gives you some hints
    about how to connect, even showing the specific command you''ll run ssh.


    Using the details for my new virtual machine, I would run this command:


    ```

    ssh -i ~/.ssh/effective-shell ec2-user@ec2-13-213-71-135.ap-southeast-1.compute.amazonaws.com

    ```


    This includes three pieces of information:


    +   * The credentials for the user I''m connecting with, indicated by the -i (identity
    file) flag, which provides my private key

    * The username for that user, which is the ec2-user part of the command before
    the @

    * The hostname, or address of the machine, which follows the @


    Now run the ssh program from your shell open to open a connection to your virtual
    machine. When I run this command, I get the following:


    The authenticity of host ''ec2-13-213-71-135.ap-southeast-1.compute.amazonaws.com
    (13.213.71.135)'' can''t be established.

    ED25519 fingerprint is SHA256:Bw6Xu4XaEk/BO3odiae+BWUFTTKunzvz4XidfYpl6F8

    This key is not known by any other names


    Are you SSH client tells me that I haven''t connected to this machine before and
    asks me to confirm that I want to proceed. Once, my SSH client will record the
    machine''s IP address and hostname so that when I connect in the future, it will
    recognize the machine. If my SSH client will warn me—a useful security feature
    to protect against someone swapping the machine you''re connecting to for another
    one!'
