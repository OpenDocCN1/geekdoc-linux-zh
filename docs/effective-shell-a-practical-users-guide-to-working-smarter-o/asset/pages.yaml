    # Configuring Environment Variables


    You can set the values of environment variables used by the shell and other tools
    in your ~/.bashrc file. for example, you could change your default folder and
    add a new folder named ~/commands to your PATH like so:


    ```

    export EDITOR="nano"

    export PATH=$PATH:$HOME/commands

    ```


    A number of environment variables can change how the shell works, such as the
    EDITOR variable shown here and the PAGER variable, which sets your default pager.
    To learn which environment variables you can set to configure a specific tool
    or command, see the tool''s man page.


