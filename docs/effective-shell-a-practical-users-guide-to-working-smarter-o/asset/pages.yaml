  md: '# # 2


    # ## THINKING IN PIPELINES


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_44_0.png)


    Understanding pipelines and how input and output work for command line programs
    is critical to using the shell effectively. In this chapter, we''ll look at how
    programs handle input and output, and then you''ll learn how to chain multiple
    commands together with pipelines. I''ll also share some tips and tricks for using
    pipelines that I hope will make your life easier. Finally, I''ll briefly touch
    on the “Unix philosophy,” an approach to building programs that enables you to
    efficiently perform highly complex tasks. Learning these concepts will open up
    a new world in terms of what you can do with the shell.'
  merge: -1
