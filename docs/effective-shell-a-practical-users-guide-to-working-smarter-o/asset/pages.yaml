  md: "# Creating a Function\n\nA function is a set of commands that you define once\
    \ and then call at any time within your script. A function definition has the\
    \ following structure:\n\n```\nfunction-name() {\n  function-command 1\n  function-command\
    \ 2\n  function-command n\n}\n```\n\nFirst, you specify the name of the function\
    \ followed by empty parentheses, and then, between a pair of braces ({}), you\
    \ list the commands to execute when you call the function.\nHere's a very simple\
    \ function in action:\n\n```\ntitle() {\n  echo \"My Script version 1.0\"\n}\n\
    ```\n\nThis script defines a function called title that prints out a message.\n\
    You call this function the same way you call any command in the shell, by entering\
    \ its name and pressing ENTER:\n\n```\n$ title\nMy Script version 1.0\n```\n\n\
    In some scripts, you might see functions defined with the function keyword:\n\n\
    ```\nfunction title() {\n  echo \"My Script version 1.0\"\n}\n```\n\nThis is somewhat\
    \ less standard, however, so I don't recommend it. If you use the function keyword,\
    \ adding parentheses after the function name is optional.\n\n# Variables in Functions\n\
    \nA function can read and write to any variables in the current shell session:\n\
    \n```\n# Set some variables.\ntitle=\"My Cool Script\"\nversion=\"1.2\"\nsucceeded=0\n\
    ```\n\n```\n# Create a function that writes a message and changes a variable.\n\
    write_title() {\n  # You can create and read variables within a function...\n\
    \  title_message=\"$(title) - version $(version)\"\n  echo \"$(title_message)\"\
    \n}\n```"
  merge: -1
