  md: '# 20


    # SHELL EXPANSION


    ![](img/1b4376e88e3e983d901a0c536b9dd3c9_328_0.png)


    When the shell receives a command from the user or from a shell script, it splits
    the command into words and performs several operations that determine how the
    command is interpreted. Collectively, these operations are known as shell expansion.
    Although you''ve probably already encountered many of these operations in action
    throughout the book, seeing all of them together in one place will help you better
    understand what exactly the shell does with the commands you give it.'
  merge: -1
  pgno: 328
- img_proc: true
  md: 'Using shell expansion techniques can make your workflow more efficient. For
    example, you can use brace expansion to create multiple files with fewer keystrokes,
    or use pathname expansion to delete all files that start with the same letters.
    I''ll introduce the full set of shell expansion operations in this chapter along
    with practical examples on how to use them.


    # Shell Expansion Operations


    The shell performs its seven expansion operations in the order:


    +   **Brace expansion** Expands values between braces, such as {file1..3} into
    file1 file2 file3


    +   **Tilde expansion** Expands the tilde (~) into the full path for the directory,
    such as ~/effective-shell into /home/dumkert/effective-shell


    +   **Parameter expansion** Expands terms that start with a dollar sign ($) into
    parameter values, such as $HOME into the value of the variable HOME


    +   **Command substitution** Evaluates the contents of $(command) sequences, which
    are used to run commands in a subshell


    +   **Arithmetic expansion** Evaluates the contents of $((expression)) sequences,
    which are used to perform basic mathematical operations


    +   **Word splitting** Splits up text and input into “words,” or sequences of
    text that you can run operations as over loop


    +   **Pathname expansion** Expands wildcards and special characters in pathnames,
    such as file*.txt into filename.txt


    This order of operations is important to keep in mind, as it affects how the command
    is executed. I''ll talk more about this in “Pathname Expansion” on page 309.


    For more information on these operations in the man pages, run bash and search
    for the text EXPANSION.


    # Brace Expansion


    Brace expansion, the first shell expansion operation performed, expands a simple
    expression representing a sequence or range of characters.


    The following example expands a set of words or characters:


    ```

    mkdir /tmp/{one,two,three}


    # The line above is expanded to:

    mkdir /tmp/one /tmp/two /tmp/three

    ```


    Brace expansion provides an efficient way to perform operations on multiple files
    or folders at once. You can also create sequences of numbers or characters:'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'touch {1..5}.txt


    # The line above is expanded to:

    touch1.txt file2.txt file3.txt file4.txt file5.txt


    As well as specifying the start and end of a sequence, you can specify an increment.
    You might see this type of expansion used in for loops:


    ```

    for x in {0..10..2}; do print $x; done

    ```


    # The line above is expanded to:

    for x in 0 2 4 6 8 10; do print $x; done


    With its ability to create sequences, handle multiple paths, and generate patterns,
    brace expansion can save you some keystrokes and prevent errors in your shell
    scripts.


    # Tilde Expansion


    If a word starts with a tilde, the shell performs tilde expansion to expand into
    the value of the HOME variable:


    ```

    cd ~/effective-shell

    ```


    # The line above is expanded to:

    cd $HOME/effective-shell


    # This is subsequently expanded to the user''s home directory, for example:

    cd /home/dwmkerr/effective-shell


    You can change the HOME variable to another location if you prefer, and the tilde
    will expand to that value. If you unset the HOME variable, the tilde will always
    expand to the current user''s home directory configured by the system (typically
    in the /etc/passwd file, discussed in Chapter 15):


    ```

    unset HOME

    cd ~/effective-shell

    ```


    # The line above is expanded to the system-defined home directory:

    cd /home/dwmkerr/effective-shell


    Whether the default HOME path or a custom value, tilde expansion gives you a useful
    shorthand for referencing home directories in your shell commands and scripts.


    # Parameter Expansion


    The dollar sign indicates that the shell is going to perform parameter expansion,
    which expands variables or the parameters of a script. (With slight alterations,
    the dollar sign can also be used to indicate command substitution or arithmetic
    expansion, as you''ll see shortly.)'
  merge: -1
  pgno: 330
- img_proc: true
  md: 'In its simplest form, parameter expansion replaces the name of a variable or
    parameter with its value:


    ```

    fruit=apples

    echo "I like fruit"

    ```


    # The line above is expanded to:

    echo "I like apples"


    When using parameter expansion, it''s a good idea to surround the parameter name
    with braces to be unambiguous as possible:


    ```

    echo "My backup folder: ${HOME}_backup"

    ```


    # The line above is expanded to:

    echo "My backup folder: /home/dwmkerr_backup"


    Here''s the same operation without the braces:


    ```

    echo "My backup folder: $HOME_backup"

    ```


    # The line above is expanded to:

    echo "My backup folder is: "


    The expansion doesn''t work as expected in this case, because rather than trying
    to expand a parameter with the name HOME rather than parameter named HOME and
    then adding the text _backup to its value, the braces used in the first example
    remove any ambiguity, making it clear to the shell that the parameter name is
    HOME.


    A number of additional features are available to make parameter expansion even
    more convenient.


    # Set Default Values


    The expression ${parameter:-default} will expand to the value of parameter, but
    if that value isn''t set, the default value is used instead. This is handy when
    you want to provide a "default" value for the shell to use if a parameter is not
    set.


    ```

    $ backup_location=${BACKUP_DIR:-~/backup}

    echo "Backing up to: ${backup_location}

    Backing up to /home/dwmkerr/backup

    ```


    In this example, if BACKUP_DIR isn''t set, then backup_location will be set to
    the default value, which is ~/backup. Notice that the first line of this example
    uses tilde expansion to specify the user''s home directory.


    # Assign Default Values


    The expression ${parameter:-default} will expand to the value of parameter, but
    if that value isn''t set, the default value is used instead. In this case,'
  merge: -1
  pgno: 331
- img_proc: true
  md: 'parameter is also set to default, so the expression works just like the previous
    one but sets the parameter at the same time.


    ```

    $ ${BACKUP_DIR:=~/backup}

    echo "Backing up to: ${BACKUP_DIR}"

    Backing up to: /home/dwkerrick

    ```


    In this example, the first line starts with a colon (:), which is a shell expression
    for "no operation", and it means "Don''t try to execute the result of the following
    command do expand it." If the variable BACKUP_DIR isn''t set, it will be set to
    the default value provided, which is ~/backup.


    # Display an Error If a Value Is Null or Unset


    The expression ${parameter:message} tells the shell to expand the value of parameter,
    but if that is null or unset, to write message to stderr and exit (unless the
    shell is interactive, then the shell isn''t closed).


    You can use this operation to put a guard in place to ensure that a script exits
    if a value isn''t set. To try it, you''ll need to unset the BACKUP_DIR parameter
    if you set it in the previous example:


    ```

    $ unset BACKUP_DIR

    ```


    Now run the following:


    ```

    $ backup_location=${BACKUP_DIR?:Please set BACKUP_DIR to use this script}

    bash: BACKUP_DIR: Please set BACKUP_DIR to use this script

    ```


    This script copies the ~/effective-shell folder to the folder in the BACKUP_DIR
    parameter. However, because BACKUP_DIR is no longer set, the script will exit,
    set the error status, and show an error message telling you to set the variable.


    # Use an Alternate Value


    The expression ${parameter:-alternate} expands to an empty string if parameter
    is null or unset. If parameter has a value, the value of alternate is used instead.
    You will often see this kind of expression used to conditionally add parameters
    to commands:


    ```

    $ SHOW HIDDEN=1

    $ ls ~${SHOW_HIDDEN:-a} ~

    .. .bash_rc

    ```


    In this case, if the SHOW_HIDDEN parameter has been set, its value is replaced
    with the string -a in the ls ~ command to list all files in the user''s folder,
    including hidden files. The alternate value expression is a convenient way to
    translate a variable into a parameter or flag.'
