- img_proc: true
  md: '# The Official Damn Small Linux Book


    Some older machines may have ZIP drives (internal or external). DSL offers procedures
    for booting and installing Damn Small Linux from a Zip drive. A Zip drive is easier
    to use than a stack of floppies, because the Zip media is (100MB) an early standard
    standard size; however, later, 250MB and 750MB Zip drives became more popular.


    After DSL is installed on one of these older machines, however, you may find that
    it lacks other hardware needed to make it a useful machine. For example, an old
    laptop with no CD drive probably also has a small hard disk, no LAN interface,
    and little RAM.


    +   Hard disk—Speaking of hard disks, you don''t need all to run DSL. However,
    if you want to install DSL to a hard disk, you will need at least 64MB of disk
    space for DSL and at least that space in a swap partition. You also need to consider
    whether you want to keep the content you play with the digital media frame on
    the hard disk (or get it over the network or from some other removable medium,
    if available).


    +   RAM—There is no special RAM requirements, beyond what you already need to
    run DSL. Of course, having more than the minimum 32MB (CD boot) or 16MB (hard
    drive boot) doesn''t hurt. Honestly, I found that about 32MB was as low as I wanted
    to go, even with a slideshow media frame.


    +   Network interface—Having a wired or wireless Ethernet interface makes everything
    easier with a digital media frame. From another computer on your LAN, you can
    use a variety of network services to get the images you want to display to your
    digital frame. You can also log in remotely to any other maintenance on the machine.
    Remote login is a real plus because you won''t have a keyboard attached to the
    computer.


    Most recent laptops have wired and/or wireless networking built-in, many older
    laptops include built-in modems (usually cheap WinModems). To add a LAN interface,
    you typically add a PCMCIA card (provided a slot is available). USB Ethernet adapters
    are another option, if you have a USB port (but again, some older machines don''t).


    A final option for networking your no-Ethernet, no-PCMCIA, no-USB laptop is to
    use the parallel port (which many older laptops have) to create a connection using
    Parallel Line Interface Protocol (PLIP). DSL includes the PLIP driver (plip.o).
    So, with the right cable (www.tdp.org/HOWTO/NET-3-HOWTO-9.html#ss9.2) and PLIP
    HOWTO (www.linux.com/howtos/PLIP.shtml), you should theoretically be able to get
    this to work. Personally, I haven''t tried PLIP for several years, and when I
    did, I had some trouble getting the right cable.'
