    Kit (FLTK), SQLite bindings, and networking capabilities.


    This build of Lua was developed by John Murga and is aptly named murgaLua after
    the author. We take advantage of the GUI bindings to develop many tools, desktop
    utilities, and front ends for command-line applications, such as the DSL Control
    Panel and the DSL Manager.


    Figure 3-11 shows a sample of tools that rely on murgaLua. Information murgaLua
