  md: '# CHAPTER 8 Installing DSL in Alternate Ways


    > NOTE

    tomsrtbt is a single floppy Linux distribution. For more information, see http://www.toms.net/rb/.
    The tomsrtbt distribution offers among the best PCMCIA network support of all
