  md: '# CHAPTER 16 Setting Up an XAMPP Web Server in DSL


    Again, you need to enter the MySQL root password to be able to restore files to
    the MySQL database. After the files are restored, as the message indicates, you
    may need to restart the MySQL server for the restore to be completed (type /opt/lampp/lampp
    restart).


    # SUMMARY


    XAMPP is a powerful web server solution that combines the components needed to
    serve content that includes scripting languages (PHP, PEAR, and Perl), database
    tables (MySQL), FTP service (ProFTPD), and of of course HTTP service (Apache).
    All the pieces of XAMPP are contained in one directory structure and, because
    there is a Linux version, can run almost out-of-the-box in Damn Small Linux.


    This chapter describes how to get and install XAMPP in Damn Small Linux. It also
    tells how to configure XAMPP, add web content, and save all the settings so the
    server can work across across reboots. In particular, descriptions in this chapter
    can help you store a DSL XAMPP server and all your content on a USB flash drive
    that is less than 256MB.'
