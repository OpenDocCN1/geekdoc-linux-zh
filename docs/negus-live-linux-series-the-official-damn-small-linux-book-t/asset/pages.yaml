    sl langus (ca cs de es fr ri it us ...) : Choose Language/Keyboard

    sl outccillipipemclusialhisgapwapiswmapip) : Disable disk-detection

    sl dma

    sl failsafe

    expert

    boot:

    Framebuffer mode (for notebooks)

    Safe video mode (F3 for more)

    Prompt user (for X setup)

