  md: '# The Official Small Linux Book


    With the default configurations in DSL-Embedded bat files (1st-boot.bat, dsl-base.bat,
    dsl-vhd.bat, and pendrive.bat), we have Qemu run without KQemu enabled. You have
    to modify the .bat file of your choice configuration to enable KQemu acceleration.


