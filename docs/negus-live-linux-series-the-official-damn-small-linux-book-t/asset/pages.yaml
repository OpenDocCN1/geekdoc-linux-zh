    - 128MB HD

    - 800x600 screen


    +   - Linksys PCMCIA network card model PCMLM56 (also works with Xir RealPort2
    Model R2E-100)


    # Starting the Network Install


    I have written a tiny ash shell called frugal_lite.sh. It provides the traditional
    Poorman''s install and boot floppy creation via the Net:


    +   1. Download and create the tomsrtbt disk. (Go to http://www.toms.net/rb/.)


    +   2. With your PCMCIA card inserted, try booting tomsrtbt and see if the network
    card is seen.

    After booting tomsrtbt, be sure to remove the diskette.


    +   3. Run the /sbin/ifconfig command. If you see your IP address, you can skip
    the next step.


    +   4. If you use 1.1.1.1 when you type ifconfig, you must manually input your
    IP address, as in the following two lines:


    ```

    # ifconfig eth0 192.168.0.14 netmask 255.255.255.0

