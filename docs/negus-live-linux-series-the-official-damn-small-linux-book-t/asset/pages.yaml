    # Configuring a Modem


    DSL supports dial modems that are hardware based. Most all external modems

    hare hardware based. There is a class of modems that are not fully functional
    hard-

    ware devices. This class of modem is called WinModems. WinModems have their

    firmware created specifically to run on Microsoft Windows. So, to Linux

    devices don''t behave like standard modems.


    As you might expect, most Linux distributions have limited support for

    WinModems. In fact, some WinModems are proprietary. DSL supports the most

    popular of the WinModems, the Lucent Technologies Lodem.


    From the DSL Control Panel icon, click Dialup, or from the main menu, click

    System, Net Setup, and finally Dial-up PPP. A PPP dial pop-up window appears,

    as shown in Figure 4-12.


