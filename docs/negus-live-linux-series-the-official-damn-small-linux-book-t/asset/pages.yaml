  md: '# Running a Digital Media Frame with DSL


    Ever since people began retiring used laptop computers, converting some of those
    old machines into digital picture frames has been a popular do-it-yourself project.
    Because it would be frivolous to spend even a few hundred dollars on a project,
    laptops used to make digital picture frames are usually cheap (under $100), have
    little memory, and feature weak processors. With its low RAM and CPU requirements,
    Damn Small Linux (DSL) is an excellent operating system platform for such a project.


    Of course, with lots of multimedia tools available in free and open source software,
    there''s no reason to limit a digital picture frame to images alone. Why not use
    a frame to play music, movies, or other content as well? For that reason, this
    project is called a digital media frame and includes features for substituting
    music and video players for the slideshow software. (Although with the least powerful
    computers that run Damn Small Linux, you might not be able to do more than a slideshow.)


    From a standpoint, the hard part of building a digital media frame is to get all
    the parts you need out of the laptop and into a thick, shadowbox-type frame. Along
    the way, you try to separate the parts you don''t need (like the case and the
    keyboard) and try not to break the parts you need. Besides the requisite frame,
    other hardware items you might want to add wired or wireless LAN cards.


    On the software side, you want the digital picture frame to play the content you
    choose as automatically and without intervention as possible. However, you also
    want to at least provide mechanisms for adding and removing content. After all,
    how often can you watch nothing but your cousin Harvey''s wedding pictures before
    you want to change to a new slideshow?'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# The Official Damn Small Linux Book


    Making a digital media frame can be a fun project. But before diving into it,
    I strongly recommend you read the following warnings regarding both the hardware
    and software aspects of this project:


    +   **Hardware Warning!**—In making a digital media frame, you will need to take
    a laptop computer in such a way that it probably not go back together again. So,
    if you want the laptop to be a laptop again, don''t use it for this project. Also,
    it is possible that you might do irreparable damage to the laptop in the process
    of adapting it into a digital media frame. So, please don''t use a laptop that
    you can''t afford to be without. Finally, the resulting media frame will not be
    UL approved (www.ul.com), so you run some risk of burning your house down.


    +   **Software Warning!**—This is not a click-and-go project on the software side
    either. In this project, repartition disks, modify bootloaders, and work with
