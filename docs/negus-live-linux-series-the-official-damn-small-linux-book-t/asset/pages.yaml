  md: '# The Official Damn Small Linux Book


    Before we get started, it is important to note that this chapter focuses on the
    applications within DSL, not applications available via the MyDSL extension system.
    (See Chapter 5, “Extending Applications with MyDSL,” for descriptions of MyDSL
    extensions.).


    # THE FLUXBOX WINDOW MANAGER


    Initially, Fluxbox seems very minimal: there is no Start button, and people are
    often found scratching their heads wondering where the menu is. However, you will
    soon discover what can appear to be confusing at first is actually a blessing.


    Before screaming, “This Damn Small linux is too confusing—I am going to go back
    to “Windows,” grab your mouse and press your right-click button. You see that
    Bam! Is your menu? Notice how fast it loaded? Without any hesitation, it pops
    up in a flash. This is the Fluxbox menu.


    To navigate the Fluxbox menu, scroll the mouse it vertically. As the mouse moves,
    you will see submenus pop up, and as you navigate your mouse over the submenus,
    sometimes additional menus open as. The application that is selected becomes highlighted
    as the menu scrolls over it. To select a menu, press the left mouse button once
    and the single click opens the application. That is how the menu operates.


    You will soon appreciate the Fluxbox menu''s speed and efficiency. Unlike traditional
    taskbar navigation, you do not have to move your mouse pointer all the way down
    to your screen''s lower-left corner and click the little button to get the menu
    to display. The mouse is always just click away from displaying your menu.


    Fluxbox offers a lot more than just the ease of menu navigation. With a little
    investigation, you will discover that the seemingly simple environment actually
    it possible to work on your computer faster.


    # Navigating Virtual Desktops


    Another great aspect of Fluxbox is that it supports virtual work environments—in
    there are four virtual desktops by default. There are a few ways to navigate between
    virtual workspaces. If you have a wheel-equipped mouse, the easiest way to move
    from one workspace to another is to spin the wheel up or down.


    At first, you may not notice that your virtual workspace is changing. If there
    are no applications currently running, the only change is the Workspace number
    located on the narrow taskbar at the bottom of your screen. In addition, the squares
    on the Pager (that little rectangular thing in the lower-left corner) also shift
    to indicate a change.'
