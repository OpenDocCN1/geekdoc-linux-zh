  md: '# CHAPTER 3 Using DSL Applications


    # Calendar


    This program, built on murgaLua and PScal, can keep you organized. Calendar does
    a very nice job of formatting schedules, which get displayed in an easy-to-read
    calendar format.


    # dMix


    dMix is a GUI front for the sound volume umix. dMix is very simple to use and
    allows one to control the left and right side volume controls independently or
    sync them up for quick volume control.


    # Mount.lua


    This is a click to mount and unmount storage devices (floppy, CD-ROM, and disk
    partitions) in this GUI tool.


    # Docked


    The docked tool is used with Fluxbox, which incorporates much of the utility of
    dMix and Mount.lua.


    # Daemon Applications


    A daemon is a program that runs in the background waiting to be used upon request.
    Often daemons perform specific functions like remote connections, or printing.


    Damn Small Linux is equipped with four daemons to help interact with the outside-world.
    They are Open Secure Shell, NFS, BetaFTP, and the Monkey Web Server. Please note
    that all these daemon services are off by default and you need to enable them.
    Services may be controlled via the DSL control panel or the Fluxbox menu in the
    System, Daemons submenu. Also note that you have to set up a user password to
    remotely log in to a Damn Small Linux computer by either Secure Shell or FTP protocol.


    # Open Secure Shell


    Although it is standard on most distributions, many are surprised to learn that
    Damn Small Linux is equipped with an OpenSSH secure shell daemon. This makes it
    possible to securely access a remote computer running Damn Small Linux by logging
    in as user or root. Using scp (a command-line utility to remotely transfer files
    between computers), it is also possible to securely transfer files into or out
    of Damn Small Linux remotely. Damn Small Linux has both the server and the client'
  merge: -1
  pgno: 87
- img_proc: true
  md: '# The Official Damn Small Linux Book


    tools to remote shelling and SCPing files around. Also, Damn Small Linux is equipped
    with a very handy utility, which allows one to remotely mount a file system via
    SSHD; the utility is called SSHFS, and we are big fans of it!


    For information on OpenSSH, visit the manual page at www.openssh.com/manual.html.


    For more information on the SSH Filesystem, visit http://fuse.sourceforge.org/net/sshfs.html.


    # BetaFTPD


    BetaFTPD is an incredibly small (27K) single-threaded FTP server. Its small size
    made it a natural for Damn Small Linux, and its author, Steiner H. Gunderson,
    believes that being threaded makes it more secure while also being easy on RAM.
    Yet, mainly include BetaFTPD easy cross-platform file sharing when one does not
    have access to a SCP client.


    For more information on BetaFTPD, go to http://betaftpd.sourceforge.net/.


    # Network File System


    As the name implies, network file system (NFS) is a system that allows one to
    share files across a network by mounting disk partitions. It is similar in concept
    to the Windows file sharing system. Damn Small Linux has NFS-Common, which provides
    a tool set that allows you to use the NFS protocol.


    Developer''s note: In many ways, using SSHFS with Secure Shell can be used as
    an alternative to NFS. Many find it easier to use and more secure.


    You can find an NFS howto page at http://nfs.sourceforge.net/nfs-howto/ar01s02.html.


    # Monkey Web Server


    Monkey Web Server is a simple and small web server, it is easy to configure and
    supports server side scripting. We include a started page for Monkey as the default
    home page for localhost. To see it, just access the control panel and click the
    Monkey Web button, then point your web browser to http://localhost. The server
    files are located at /opt/monkey/ if you want to customize your setup.


    The Monkey Web Server website can be found at http://monkey.sourceforge.net/.'
