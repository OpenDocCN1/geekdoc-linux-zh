  md: '# CHAPTER 14 Using Skype VoIP Service in DSL 279


    # AGREEING TO USE SKYPE


    Before you can have a Skype user account, you must agree to the Skype End License
    Agreement (EULA). Besides helping you understand the terms of use set by Skype
    Software Inc. for using the Skype software, this agreement also helps you see
    some of the limitations of the software itself.


    I urge you to read the entire agreement yourself. Here are a few of the highlights:


    +   **Covers your use**—By agreeing to the version of Skype you install, you agree
    to the terms of the agreement, whether you use Skype from this install or any
    other installation of the software.


    +   **Use of processor/bandwidth**—Skype helps keep the cost of providing services
    by utilizing resources from Skype clients. To that end, the license requires you
    to agree to let Skype use your processor and network bandwidth to facilitate communications
    among Skype users.


    +   **No emergency calls**—As mentioned earlier, Skype doesn''t recommend that
    you use Skype software to provide your only phone service. One reason is that
    Skype software doesn''t support or carry emergency calls.


    +   **Personal and noncommercial**—You can''t grant your rights to use the software
    to anyone else. So, you can''t legally make a Skype system to resell to others.


    As with most freely distributed software, Skype software is provided without warranty.
    The EULA also reminds you that using Skype software doesn''t grant you ownership
    of Skype''s intellectual property contained in that software.


    # 4. Add account information—If you want other Skype users to be able to find
    you, you may want to add information about yourself to your user account. An Edit
    Profile window may open automatically the first time you log in. If it doesn''t,
    from the Skype window, select File→ Your Personal Profile. Figure 14-2 shows an
    example of the My Profile screen that appears.


    As you can see from Figure 14-2, you can add name, city, state, phone number,
    and other personal information about yourself. This information makes it easier
    for people to search for you through the Skype search feature.


    Now you are ready to start using Skype to communicate with others.'
