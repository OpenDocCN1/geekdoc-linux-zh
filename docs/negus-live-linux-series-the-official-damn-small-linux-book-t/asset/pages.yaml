  md: '# MyDSL Extensions


    To extend beyond the applications available in the base Damn Small Linux system,
    the Damn Small Linux project offers hundreds of downloadable and installable software
    packages referred to as MyDSL extensions. This appendix contains a listing of
    available MyDSL extensions that you can download and install from online software
    repositories by opening the MyDSL icon on the DSL desktop.


    Most of the descriptions in this appendix come directly from info files included
    with each package extension. In many cases, you can find longer descriptions of
    each extension when you select to download and install it. Because extensions
    come from the Damn Small Linux community, you may find that the quality of both
    the descriptions and the extensions themselves can vary quite a bit.


    You may notice that there are multiple versions of some extensions. That is because
    there are times when you want an extension that copies directly to your file system
    (for example, with .dsl extensions), whereas other times it''s more useful to
    have the extensions mounted (as done with .uci extensions). See Chapter 5, “Extending
    Applications with MyDSL,” for further information on different MyDSL extension
    types.


    Besides providing the name and descriptions of each MyDSL extension, the table
    lists the version name, website containing more information, and size of the extension.
    You can also get more information on each extension by selecting that extension
    from the MyDSL Extension Tool (which displays the extension''s info file). Extension
    headings in the table align with buttons on the MyDSL Extension Tool window (Apps,
    Games, UNC, Multimedia, and so on).


    345'
