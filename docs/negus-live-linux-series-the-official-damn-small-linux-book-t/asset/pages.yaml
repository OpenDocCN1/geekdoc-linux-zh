- img_proc: true
  md: '# CHAPTER 11 Setting Up a Full Remastering Environment


    All the requirements of your project can be seen in Figure 11-10. Joe''s Window
    Manager, Gnumeric, AbiWord, GnuCash, and daemons are all there.


    # FULL REMASTERING


    There are many KNOPPIX remastering HOWTos available on the Internet and in various
    publications. Because DSL is a derivative of KNOPPIX, all of these methods should
    work with DSL. However, in this chapter, the remastering techniques actually used
    in the production of DSL are documented: from the initial setup by a DSL CD-ROM
    to the ISO creation of DSL Insolinux version, Syslinux Qemu, and VMware version.
    The process is automated via scripts that are discussed here.


    # Setting Up from Published DSL CD-ROM


    Boot from the DSL CD-ROM with a Linux partition available. That partition is used
    to hold the source, *master*, and *iso* directories during the remastering process.
    I call my method the *working directory* method. All the scripts are run from
    the relative directory that you initially set up.


    > NOTE

    If you don''t have an available Linux partition on your computer''s hard disk,
    you can create one using the cfdisk procedure shown in Chapter 8. If you don''t
    want to change the partitions on your hard disk, you could create a Linux partition
    on some other writeable medium (such as a 1GB USB flash drive).


    To begin, boot DSL with these boot options:


    ```

    boot: `dsl1 2 base norestore legacy`

    ```


    I use 2 to signal runlevel 2 (shell interface with no desktop) to maximize available
    resources. I include base and norestore to start from a known pristine state.
    I use legacy to not have any unionfs influence while creating the image. After
    DSL boots up, do the following:


    +   1. Mount a Linux partition and change the directory to it.

    # mount /mnt/hda4

    # cd /mnt/hda4'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# The Official Damn Small Linux Book


    2. Create a working directory to contain all of your files and directories and
    change to it:


    ```

    # mkdir remaster

    # cd remaster

    ```


    3. Copy the scripts from the /chapter11 directory on the enclosed CD-ROM.


    ```

    # cp -a /cdrom/chapter11/remaster/*

    # cp /cdrom/chapter11/remaster/.bash_profile

    ```


    4. Create directories:


    ```

    # mkdir source master iso

    # mkdir source/KNOOPPIX/

    ```


    5. Copy the contents from the CD-ROM to the proper directories:


    ```

    # cp -Rp /KNOOPPIX/* source/KNOOPPIX

    # cp -Rp /cdrom/index.html master/

    # cp -Rp /cdrom/boot/master/

    ```


    6. Perform a final cleanup by removing the existing KNOOPPIX image, and then sync
    all files:


    ```

    # rm master/KNOOPPIX/

    # sync

    ```


    As a result of the preceding steps, you now have your remastering working environment
    properly set up. After the setup scripts are copied to the working directory,
    you can automate the setup of the image remastering process by running the setupFromCD
    script contained in the working directory.


    The setupFromCD script is shown here:


    ```

    #!/bin/sh

    rm -rf source master iso

    mkdir source master iso

    mkdir source/KNOOPPIX/

    cp -Rp /KNOOPPIX/* source/KNOOPPIX/

    cp -Rp /cdrom//* master/

    rm master/KNOOPPIX/

    sync

    ```


    At this point, all files have been copied from the DSL CD-ROM to the source and
    master directories. I also use one text file called release.txt. This is where
    I place the version number for the image I am working on, for example:


    ds1-3.3


    As you can see, release.txt is a simple, one-line text file. However, this makes
    it easy to change release numbers without having to remember where inside the
    main image file to update.'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# CHAPTER 11 Setting Up a Full Remastering Environment


    At this point, your working directory should contain the following files and directories:


    ```

    .bash_profile

    bootfloppy.img

    dsl1.vmx.txt

    gru/

    iso/

    makecd

    makeimage

    makeqemu

    makesys

    makevmx

    master/

