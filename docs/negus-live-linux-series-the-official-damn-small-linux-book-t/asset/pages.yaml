  md: '# CHAPTER 15 Running a Digital Media Frame with DSL


    find a picture frame that is more than two-inches deep and large enough to display
    the laptop’s screen. After that, a few extra pieces for mounting the laptop in
    that frame are needed. But the big chore is finding the right laptop at the right
    price.


    # CHOOSING A LAPTOP


    When you go to search for a laptop to use for your media frame, you need to decide
    if time or money is more important. The cheaper the laptop, the more probable
    that it will require extra work to do the things you want to do. Also, be aware
    that replacement parts can sometimes cost more than the value of the laptop itself
    (especially if you may need to add RAM or replace a broken screen). So, in general,
    the cheapest laptop may not be the best choice.


    # Asking About a Used Laptop


    Old laptops are available everywhere from garage sales to online sites. If you
    are heading to a computer store or online auction to get a used laptop, here are
    some things you should check for:


    +   **Working?**—Many older laptops are being sold for parts only. If you are
    chasing a laptop online, be sure to get a guarantee that if it is not working,
    you can return it. If you have access to the laptop before you buy, take your
    Danny Small Linux CD and a boot floppy to see if the laptop can boot DSL. While
    the laptop is booted, use DSL to check what’s available—disk space, RAM, etc.—as
    described in the “Evaluating a Used Laptop” section in this chapter.


    Keep in mind that our definition of working is not the same as other people’s
    definition of working. For example, a missing hard drive and a few broken keyboard
    keys might get you a good price, but still work fine for your digital frame. Without
    a hard drive, you can run the project from CD and images over your LAN or a flash
    drive.


    +   **Boot media**—Some older laptops don’t have CD drives. That poses problems
    only for booting, but also for accessing the 50MB image you need to run Danny
    Small Linux.


    A 3.5-inch floppy disk was the standard removable boot medium before CD drives
    became popular, but it can hold up to about 1.7MB of data at a time (although
    it is referred to as a 1,44MB floppy). Using floppy disk installation procedures
    and a stack of 35 floppies (see Chapter 8, “Installing DSL in Alternate Ways”),
    you can get DSL on a hard drive and boot from there.'
