    the workspace. Fluxter intelligently monitors which theme Fluxbox is using and
    alters its to match the theme.


    # How to Use Fluxter


    Fluxter is very simple to use. Figure out how it works, open up a few applications.
    As they materialize on the desktop, notice that they have corresponding shapes
