    # gunzip minirt24.gz


    +   4. Make a mount point and mount the initial ramdisk:

    # mkdir mroot

    # mount minirt24 mroot/ -t ext2 -o loop


    +   5. As before with the Isolinux version, change directory into mroot and perform
    necessary edits as previously described for boot modules or changes to the boot
