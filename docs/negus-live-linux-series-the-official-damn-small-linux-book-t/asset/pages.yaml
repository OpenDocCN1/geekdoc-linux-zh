  md: '# CHAPTER 13 Making Edna Music Server in DSL


    Here is the syntax to use:


    ```

    # sshfs user@remote_address:/path/to/music/ /mnt/test/

    ```


    Next, press Enter and type in your password just like using SSH or SCP. After
    this is done, your remote music (MP3s, Ogg files, etc.) is accessible at /mnt/test/path/to/music/.
    All you need to do is add this path to your Edna config file and (re)start Edna.
    Bam! Done. Now, you have access to your tunes despite the man trying to keep you
    down :). Perhaps the greatest benefit of using SSHFS and Edna is that you can
    share your music with others on your network as well.


    Here is the entry, keeping consistent with the previous example entries:


    ```

    dir4 = /mnt/test/path/to/music/ = Remote Tunes

    ```


    If Edna is already running, you need to restart it for it to pick up the remote
    file. Let''s send a HUP signal to the process to accomplish the restart:


    ```

    sudo killall -HUP python

    ```


    Now, you should be able to access your remote files on the computer running DSL
    via localhost access at http://127.0.0.1:8080/Remote%20Tunes/. Other people on
    your local network should also be able to access your tunes via your local IP.
    If you don''t know what it is, you can look at the Torsmo display at the upper
    right of your desktop or open a Terminal window and type /sbin/ifconfig and look
    for the four part number that comes after inet addr: on the device that is not
    the “local loopback” or “lo” listing.


    For example, if your address turns out to be 192.168.1.200, people in your local
    area network could access your remote tunes by pointing their browser to http://192.168.1.200:8080/Remote%20Tunes.


    # SUMMARY


    This should be enough to get you going with a basic Edna setup. You can see, there
