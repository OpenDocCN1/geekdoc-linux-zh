- img_proc: true
  md: '# CHAPTER 5 Extending Applications with MyDSL


    do with DSL we keep in mind the older, smaller machines. We want everyone to enjoy
    DSL.


    If you have multiple extension repositories, you can only indicate one at boot
    time (indicating more than one will cause only the last one entered at the boot
    prompt to loaded). After DSL boots, you can add extensions from other directories
    using the Local option from the MyDSL tool.


    Another design goal was to make an optional menu of rarely used extensions. You
    can create a directory called optional in a subdirectory of the mysdl1 directory.
    Extensions that are stored under this directory are not automatically loaded,
    but instead listed in a separate menu section in the MyDSL desktop menu under
    the category Install Optional Extensions. This gives you access to installing
    these extensions at any time during your session.


    # OPTIONAL COMMAND-LINE EXTENSION ACCESS


    Besides offering nice and simple GUI tools or the usual web access, I also was
    sure to allow the use of command-line tools. These tools can be used in your own
    custom scripts to further automate access to the MyDSL repositories. These tools
    could also be used to set up and install in a command-line-only environment. You
    may choose to run DSL without the Windows system. Of course, you must be careful
    to read the extension''s info file to see that it can run without X.


    These tools also allow the user who is comfortable with the CLI to quickly access
    the repositories. Let''s begin by exploring the command-line tools that make up
    MyDSL system.


    # Remote Access via the mysdl1-wget command


    The first tool such the mysdl1-wget command. This is a tool that uses the wget
    command to download a specific MyDSL extension from your favorite DSL mirror.


    Usage: mysdl1-wget full-extension-name repository


    Full-extension-name is the filename of the MyDSL extension and its extension type—for
    example, xmahjong.uci. The repository corresponds to the repositories that I have
    been listing. Listings of these repositories are displayed in Figure 5-2 from
    the Extension tool and in the links as shown in Figure 5-14. If you want to save
    the file to a specific and writeable local directory, you should specify the directory
    as part of filename, as in the following example:


    ```

    $ mysdl1-wget /mnt/hda2/mysdl1/xmahjong.uci uci

    ```'
