  md: '# CHAPTER 16 Setting Up an XAMPP Web Server in DSL


    of security described in this chapter may be enough for a server behind a firewall
    or used in temporary situations. However, to use this server in more permanent
    and public situations, you should do more study.


    Documentation is available for securing each of the services included with your
    XAMPP server software. I recommend that, along with the suggestions in this chapter,
    you refer to one of the following security pages for further suggestions on securing
    your XAMPP server:


    +   - Apache Security (http://apache.org/docs/2.0/misc/security_tips.html)—Contains
    warnings related to maintaining an Apache server, as well as the risks of enabling
    various services.


    +   - PHP Security (http://www.php.net/manual/en/security.php)—Both coding and
    configuration information for securing the PHP content of your XAMPP server are
    contained in the Security section of the PHP manual.


    +   - MySQL Security (http://dev.mysql.com/doc/refman/4.1/en/security.html)—Ways
    of securing your MySQL databases are described in the Security section of the
    MySQL manual.


    There are also organizations that provide information for helping you secure your
    web server. The World Wide Web consortium FAQ (http://www.w3.org/Security/FAQ/)
    contains facts about web security and different types of attacks. The Linux Security
    HOWTO (http://tldp.org/HOWTO/Security-HOWTO/) contains general information on
    securing Linux and information specific to networks.


    # Checking Basic XAMPP Security


    Some nice tips for checking and correcting potential security weaknesses in XAMPP
    are included with the XAMPP software. Again, by starting your browser to the XAMPP
    server, select Security (http://localhost/xampp/security.php). The XAMPP security
    page appears, as shown in Figure 16-3.


    The first issues related to your XAMPP server''s security are the services available
    to the network. As Figure 16-3 shows, the demo XAMPP web pages can be viewed from
    the network and the MySQL server itself can be accessed from the network. Also,
    the phpMyAdmin user (pma) and the MySQL user (root) have no passwords assigned,
    so anyone can access those services. Likewise, the FTP user nobody has a well-known
    password assigned (lampp).'
