  md: '# APPENDIX A


    # # On the CD


    The CD that comes with this book represents a consolidation of different versions
    of Damn Small Linux that are produced by the Damn Small Linux project. It contains
    some extra tools you can use for remastering Damn Small Linux, as well as some
    MyDSL extensions that are particularly useful for building the projects described
    in the book.


    The CD is part bootable Damn Small Linux and part Damn Small Linux software repository.
    It is made to not only boot directly, as you would a regular Damn Small Linux
    image, but also boot up to display enhanced versions of Damn Small Linux used
    to create the different projects that come with the book.


    > > NOTE\If you are unable to boot Damn Small Linux from the CD included with
    this book, try to disable hardware items that appear to be stopping the boot process.
    By adding boot options shown on the boot help screen (press F2) or other options
    such as acpi=off or nodma. If that fails, try searching www.damnsmall11linux.org
    for the model of your computer to see if others have trouble using DSL on that
    type of computer.


    The CD also includes software that you can use to run DSL in a virtual environment
    from a Windows desktop (just insert the CD and select the correct .bat file to
    run). There are also tools that can help you with remastering DSL.


    341'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# The Official Damn Small Linux Book


    The following list describes the software contained on the CD:


    +   - **Official Damn Small Linux (dsl-3.3.iso)**—Simply press Enter or type dsl
    at the boot prompt, and the standard Damn Small Linux starts up. This is the Isolinux
    version of Damn Small Linux, meaning that it should boot most PCs with a BIOS
    that was created in the past few years.

    Press the F2 or F3 function keys to see options you can add to the dsl1 boot command
    to run Damn Small Linux in different ways. Unless otherwise noted, this is the
    version of Damn Small Linux you should use with the examples in this book.


    +   - **Official Damn Small Linux, syslinux (dsl-3.3-syslinux.iso)**—The Syslinux
    version of DSL is included in the CD. Because you can''t boot Syslinux and Isolinux
    from the same CD, we included the ISO image of the DSL Syslinux version that you
    can burn to a CD yourself. That image is located in the /images directory of the
    CD and is named dsl-3.3-syslinux.iso.


    +   - **DSL Boot Images**—Also contained in the /images directory are several
    different boot images you can use with DSL. These boot images allow you to create
    media on floppy disks, PCMCIA floppies, or USB drives. It also contains the frugal_lite.sh
    script.


    +   - **Virtual DSL with QEMU (dsl-3.3-embedded.zip)**—In the /dsl directory on
    the CD, there are components needed to run Damn Small Linux from a Windows desktop
    using open source QEMU emulation software called Qemu. The dsl-base.bat command
    in directory starts a basic DSL when run from Windows. The dsl-vhd.bat command
    can be run to take advantage of a virtual hard drive. (The contents of the /dsl1-qemu
    directory are the result of unzipping the dsl-3.3-embedded.zip file. You can get
    the zipped file itself from the /images directory of the CD.)


    +   - **Virtual DSL with VMware (dsl-3.3-vmx.zip)**—The the /dsl1-vm directory
    on the CD contains components needed to run DSL virtually from a Windows desktop
    using VMware. These components include a VMware configuration file and the DSL
    image needed to run in Windows. You need to download a copy of VMware Player to
    use with these files (as described in Chapter 7, “Running DSL Embedded in Windows”).
    The contents of the /dsl1-vm directory are the result of unzipping the dsl-3.3-vmx.zip
    file. (You can get the zipped file itself from the /images directory of the CD.)


    +   - **DSL Projects**—Projects described in Part IV, “Making Damn Small Linux
    Projects,” all require that software to be added to the basic DSL system. The
    /extras directory contains subdirectories software for'
