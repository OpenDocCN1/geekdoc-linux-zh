  md: '# CHAPTER 7


    # # Running DSL Embedded

    in Windows


    Damn Small Linux is fast and light. This has not only made DSL a popular choice
    for older hardware, but has managed to make it a favorite for running in a virtual
    environment.


    Running an operating system in a virtual environment has significant overhead.
    This is because the user has to run the native (or top-level operating system)
    as well as the emulation layer before engaging the embedded system; thus, we have
    multiple layers of resource allocation in running an operating system in a virtual
    environment.


    Logically, the lighter and smaller the operating system that when running in a
    virtual environment, the less of a resource hog it will be. This is why Damn Small
    Linux lends itself so well to this environment.


    In this chapter, we are going to examine the ins and outs of running Damn Small
    Linux in Qemu and VMPlayer. There are other emulation programs available, but
    these two are currently popular because of their low cost ($0), ease of use, and
    performance.


    # ## RUNNING DSL IN QEMU


    Qemu is a very capable machine emulator. It is capable of emulating different
    computer architectures. For instance, you can run an operating system designed
    for an ARM processor on a common PC. Compared to other emulation software, Qemu
    achieves good performance to do what its developers call *dynamic translation*.


    The technical details of dynamic translation are beyond the scope of this overview.
    However, it is essentially a technique that allows guest code to be executed in
    the native operating system even if the host operating system runs on a different
    CPU architecture.'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'The way we will be using Qemu is relatively trivial in comparison to running
    an operating system on an exotic processor. We will be running an operating system
    (Damn Small Linux) designed for an x86 processor in a host operating system (Microsoft
    Windows) also designed for an x86 processor. Yet, in this setting, the possibilities
    are great. Using Qemu, one has the full power of DSL available on any PC, including
    network tools and all the command-line goodness on which they literally depend.
    Figure 7-1 shows an example of DSL running on a Windows XP host.


    ![](img/f6eecb623fe812080d8ad148db9eda3a_160_0.png)


    FIGURE 7-1 Damn Small Linux can run in Qemu on a Windows XP host system.


    Another popular use for DSL+Qemu is to work in relative privacy on a computer
    that may not be the most secure. Although not secure as running DSL on the BIOS
    level (i.e., from a LiveCD or booting from a pen drive), this setup adds that
    extra layer of obfuscation that at least keeps the technically challenged out
    of your business.


    I often find myself using DSL+Qemu when I am stuck on a Microsoft Windows computer
    for a day and I start to miss my GNU/Linux tools, instead of going through the
    hassle of downloading Cygwin (a collection of free tools to simulate a Unix'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'environment), I just download the dsl-embedded.zip file, and everything I need
    is ready to use—it is quick and self-contained. After use, I can just delete my
    extracted files and move without any cleanup fuss or the legacy of unwanted files
    being left behind on the host computer.


    The first step is to download dsl-embedded.zip from one of the DSL download sites.
    After this is saved, you can uncompress the zip file to your hard drive or USB
    pen drive, or put the files on a CD, depending on your needs. DSL-Embedded may
    be run from anywhere your native OS has access.


    # Using DSL-Embedded


    Qemu is open source. This is very good for us because it enables enables us to
    bundle Qemu with Damn Small Linux in a package that is ready to roll—something
    that is very fortunate for the new user who may find the configuration and the
    command-line arguments a bit tricky. We put together bat scripts that do all that
    for you.


    We provide several options for running DSL Embedded. Depending on your needs,
    system capabilities, your user rights on the Windows system, and the permanence
    of your setup, your choices vary. We will outline the various options available
    and what they provide to the end user.


    # Setting Up a Generic Virtual DSL with dsl-base.bat


    If you want to boot DSL Embedded without worrying about access to the native hard
    drive or creating a virtual hard drive, just run the following from Windows to
    get started:


    ```

    dsl-base.bat

    ```


    This is a generic setup without any hardware-specific parameters.


    If you are on someone else''s computer using your own portable drive (such as
    a pen drive), this is probably the file you want to run; it does not create and
    activate a virtual drive or probe for any backup files or MyDSL extensions.


    You should have access to the Windows network access—so reaching out to the world
    via the Internet should be straightforward. You should have sound, but realize
    that your audio performance may not be ideal with the added overhead of running
    DSL in a virtual environment. Note: to ungrab the Qemu window, press Ctrl-Alt
    to free your mouse from the DSL-Embedded desktop.


    # Setting Up and Using a Virtual Hard Drive


    If you can have access to the computer, or if you are setting up a pen drive with
    DSL-Embedded, you probably want to create a virtual hard drive for DSL to'
