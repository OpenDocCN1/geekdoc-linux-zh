    | 12. Reboot | |

    | 13. Shutdown | |

    | 0. quit | |


    To launch the hard drive installation script, type the number 3 as follows:


    Command: 3


    The dsl-hinstall script starts, as shown in Figure 9-4.


    # FIGURE 9-4 Opening dialog of the hard drive install script


