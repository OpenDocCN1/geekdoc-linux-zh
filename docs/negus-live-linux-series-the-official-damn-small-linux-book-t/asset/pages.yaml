    # SAVING YOUR XAMPP SERVER


    Now that you have gone to all the trouble to configure a web server and build
    in all your content, you certainly don''t want to lose it all on your reboot.
    To save all the good software and settings you just created, we''re going to use
    some of the information you''ve already learned about MyDSL and backups to save
    the bootable server permanently.


    Because I think it is cool to carry around a whole web server in my pocket, I''m
    going to put together this whole system on a USB drive (also called a pen drive
    or thumb drive). Most of the components in this DSL web server should fit in less
    than 256MB. I''m using a 1GB drive to leave room for future expansion.


    The following procedure steps you through the process of creating the DSL system
    on the USB flash drive, saving your XAMPP server, web content, extra software
    packages, and desktop settings. With the final result, you should be able to insert
    your USB drive into a port on your PC, reboot, and begin serving web content.


    Just I am a cautious person, I backed up all the key components of my DSL XAMPP
    server before starting the procedure. I did this by opening a partition on my
    hard disk, creating a directory called xampsstuff on it, and copying my rc.firewall
    script, /opt/lampp directory, and MyDSL packages (rcfirewall and gn-utils) to
    that directory.


    > NOTE Because the USB flash drives are not the best medium for applications that
    require a lot of writing to the drive, it''s probably more effective to place
    some or all of your XAMPP server on a hard drive. See the sidebar, "Other Ways
    of Storing Your Web Server," after this procedure, for some other ways of storing
    your XAMPP server by putting it all on a USB drive.


    +   1. Add startup scripts—So far, we''ve run both the XAMPP server and the firewall
    script manually. To have those features run when you saved DSL system boots, you
    can add your start-up scripts to the /opt/bootlocal.sh file. Open the bootlocal.sh
    file using any text editor, and then add the last two lines so the file appears
    as follows:'
