  md: '# CHAPTER 1 Overview of Damn Linux


    expect, a MyDSL package called gnu-utils is available to bring those important
    utilities into DSL.)


    Although the kernel, a command interpreter (called the shell), and a few utilities
    are really all you need to have an operating system, most Linux systems include
    other components as well. For example, the X Window system provides the graphical
    framework for using most Linux systems, including DSL. A window manager (such
    as Fluxbox in DSL) implements menus, icons, and other graphical desktop elements.


    # Understanding Live CDs


    Most computer operating systems are installed permanently on a hard disk. A live
    CD, on the other hand, is typically created so that you can safely ignore any
    software installed on a computer''s hard disk and you can run entirely from the
    operating system contained on the CD. This has some advantages and disadvantages.


    Live CDs have the advantage of letting you put a known set of software and be
    sure that you can run to that software the next time you reboot. This makes a
    live CD a great medium for demonstrations, portable desktops, or rescue media.
    You can take a whole computer system with you in your pocket that you can run
    from most PCs (provided you are allowed to reboot the PC).


    The downsides of live CDs include some of the features that are their attributes.
    For example, with any system that you use over time, you to save some data and
    applications. By default, live CDs run from the read-only CDROM medium. So, you
    can''t just save the same way you would if you were running your system from hard
    disk.


    Damn Linux has overcome many of the challenges of using a desktop system that
    was designed to run from a live CD. Some features that were already mentioned
    (and will be described later in the book) let you save files and applications
    so they are available the next time you boot DSL. There are also ways in which
    you can install DSL to hard disk, so it will behave like most installed operating
    systems.


    > NOTE the term live CD is commonly used to describe a computer system image that
    is typically booted and run from a read-only medium, the same type of image can
    run from other media as well. As you will see from descriptions in this book,
    a live CD can also run from a DVD, USB flash drive, or ZIP drive. Likewise, a
    live CD can be booted from a floppy disk, and then continued from CD, hard disk,
    or other medium.'
