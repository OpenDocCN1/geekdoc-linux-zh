  md: '# The Official Damn Small Linux Book


    # Based on Debian and KKNOPPIX


    Because a Linux kernel doesn''t let you do that much with a computer, most Linux
    distributions draw on the vast landscape of free and open source software. Linux
    GNU/Linux is one of the most popular free operating systems available today. KKNOPPIX
    is a live CD distribution that was created from Debian soft-ware. Technology from
    both projects is incorporated into DSL.


    The Debian distribution (http://debian.org) has literally thousands of soft-ware
    packages that have been compiled to run on Debian. Debian packages are stored
    in .deb format and can be downloaded and installed from the Internet using tools
    as apt-get and dpkg. Many Debian applications can be downloaded and installed
    to DSL using apt-get (available from the dsl-dpkg MyDSL package).


    KNOPPIX (www.knoper.net/knopix/index-en.html) was the first popular desktop-oriented
    live CD. It included a highly regarded facility for detecting and configuring
    hardware (a most for live CDs). Using compression techniques, it was able to fit
    the equivalent of about 1.5G of software within 700MB CD image. Many specialized
    utilities were included in KNOPPIX to configure some of the trickier hardware
    components, such as wireless cards, printers, and modems.


    Damn Small Linux creator John Andrews began with some of the technology just described,
    until he was whittling down and tuning it up.


    # ANSWERS FROM THE DSL DEVELOPERS


    In case you didn''t notice from the cover, this book combines the experiences
    of three writers. John Andrews created Damn Small Linux. Robert Shingledecker
    has developed many of the critical innovations of DSL. Christopher Negus has authored
    many Linux books, as the Red Hat Linux Bible, Linux Toys, and Live Linux CDs.


    So in this section, you get to find out first-hand how why DSL came about. Chris
    asked John and Robert some-hitting questions about why they have developed DSL,
    what are its greatest attributes, and where it is going.


    # John, what encouraged you to create DSL?


    John: It was a reaction to the trend of ever increasing size of applications and
    the typical Linux desktop environment. I wanted to see if it was possible to build
    a functional desktop environment that could be compressed into 50MBs.


    One of my original draws to Linux was the fast and light applications that were
    available in the late 90s. By the time I was working on DSL, many of the applications
    I loved seemed to slow down to a crawl on my computer.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# CHAPTER 1 Overview of Damn Linux


    In essence, the typical Linux desktop was pushing me to a hardware upgrade the
    same way Microsoft and Mac operating systems tend to do. I hoped (and still do
    hope) that there would be a resurgence of efficiency in the Linux community where
    people treat code bloat like the cancer it is.


    DSL is also a testament to function over form. We avoid indulging in eye candy.
    Some core applications are in DSL have better functionality than their later incarnations
    that are larger in size. The developers of DSL, it is not about the latest or
    the best looking; it is about functionality and stability.


    I was searching for a light portable environment that I could take with me on
    a business card CD. At the time, the sub 50MB distribution was Linux-NBC, but
    its orientation was much more toward being a rescue disk. I thought it would be
    possible to work within the same limited space but instead build a distribution
    focused on having a functional desktop. Being an efficiency fan, I modeled DSL
    after my desktop and used most of the lightweight applications.


    # Robert, what encouraged you to join DSL development?


    Robert: I have been involved with Linux CD-ROMs since the early 1990s. I installed-type
    CDs to automate the specialized setup of servers and desktops while I was working
    at the City of Garden Grove, California. Later, I worked for a Linux startup and
    created live CD server appliances. We created firewalls, mail servers, VPN, LAMP-style
    systems, several database servers, MySQL, Postgres, and some prototype commercial
    ones like Raining Data''s D3.


    These live CDs were automated to provide whatever the customer desired. During
    this development, I had created my own live desktop. Occasionally, I would check
    Distrowatch to see if anyone else was doing the desktop approach. I always felt
    that there are far more desktops than servers. Demo Linux and later KNOPPIX were
    far too slow to be practical for everyday use at that time. When I found John''s
    Damn Small Linux, I liked what I saw and began to explore ways to expand its capabilities.


    # What were the first goals of Damn Small Linux and how have they changed?


    John: The first goal of DSL was to have a functional and efficient Linux distribution
    that was under 50MB, small enough to fit on a business card-size CD. Over the
    years, business card CDs became a lot less relevant as affordable pen drives have
    starting into the market. Yet, we have maintained the 50MB upper limit, which
    has forced us to think in unconventional ways and innovate instead of just adding
    applications.


    The goal of maximum functionality in a tiny package has been a constant. What
    has changed are the applications and the growth of the extension technology.'
