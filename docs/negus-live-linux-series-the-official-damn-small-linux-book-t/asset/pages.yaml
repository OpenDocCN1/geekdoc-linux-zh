    # Configuring the Player


    To get an idea of how to boot directly to a media player, the first example shows
    how to start up the GQView image viewer. The general approach is to set up the
    default values for GQView, then configure GQView to start up automatically with
    the boot prompt. With GQView installed, as described earlier, do the:


    +   1. Select the GQView icon from the desktop. The GQView image player starts.


    +   2. From the GQView window, select Edit and then Options. The GQView Configuration
    window appears, as shown in Figure 15-2.


    +   3. Set defaults for GQView to play images continuously. In particular, I selected
    Round and Repeat in the Slide Show box. I also unselected the box next to Cache
    Thumbnails, so I wouldn''t fill the disk with thumbnails. The default is to change
    images every 15 seconds, but you may want to change that to suit your taste. Select
    other tabs to change different settings. For example, selecting Fit Image to Window
    (on the Image tab) is a good idea. Choosing Preload Image may help the images
    faster.


