  md: '# Boot: Install


    There are two ways to run the scripts outlined in this chapter: one is via a terminal
    window from within the DSL desktop and the other is via a shell script written
    specifically to be run as a boot option for installation purposes. The examples
    in this chapter were completed in a term window from the desktop so that I may
    show you screens; however, running the boot install option has some advantages.


    The following are the benefits:


    +   * It is faster. By not booting to a full desktop, the startup time is diminished.

    * It uses less RAM—again, no desktop overhead.

    * If you need to make a boot floppy, there is no need to manually download anything—the
    script takes care of that.


    To access the installation script, type install at the boot prompt.


    After the boot process, the screen promptly displays the installation application.
    The display may look like what you see in Figure 6-1.


    FIGURE 6-1 The install script employs USB installations.


    ![](img/f6eecb623fe812080d8ad148db9eda3a_144_0.png)


    # USB-HDD


    Before you get started on the USB-HDD install, make sure your pen drive is ready
    to go by creating a single FAT16 partition using cfdisk as outlined in the preceding
    section. After that is established, select the USB-HDD script by navigating to
    Apps -> Tools -> Install to USB Pen Drive and clicking For USB-HDD Pen Drive;
    or if you are running the boot install script, type 7 and then press Enter/Return.
    You will be greeted by the USB-HDD install script with a quick synopsis of what
    is needed to complete a USB-HDD install.'
