  md: '# Using Skype VoIP Service in DSL


    By adding Skype software to Damn Small Linux (DSL), you can make calls from your
    computer to a person at another computer (DSL) for free) or to any telephone in
    the world (for a bit of money). You can also use text chat to communicate with
    other Skype users.


    Besides being for Linux, Skype software is available for Windows, Mac OS X, and
    Pocket PCs. So, if you can get a group of friends, or associates to sign up for
    Skype accounts, you can make calls, send files, and participate in chats among
    those people, even if they are not using the same type of computer.


    Because Skype software has been packaged for Damn Small Linux, you can easily
    install Skype using the MyDSL feature. You can then apply all the advantages of
    using DSL to your Skype application, so you can have your own calling tools that
    run on a low-end PC or from a custom, portable USB stick or CD.


    This chapter describes how to use the Skype software package that is available
    for DSL to place calls to people over the Internet. It also describes how to extend
    your use of Skype to include free and inexpensive services. Although this chapter
    describes how to set up Skype from any recent version of DSL you might have, refer
    to Appendix A for information on the DSL software included in this book.


    > NOTE


    Although this chapter describes some of the free services available using software
    created for Linux, it also touches on some of the for-pay services available from
    Skype. The authors of this book have no affiliation with Skype and our coverage
    of their products doesn''t represent an endorsement of Skype. If you are interested
    in those services, you should research their suitability for yourself.'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# INTRODUCTION TO SKYPE AND VoIP


    To encourage people to purchase its voice over Internet protocol (VoIP) Internet
    telephone products, Skype Limited (www.skype.com) offers a variety of free Internet
    communications services to people who sign up for a free user account. By downloading
    and installing Skype software, setting up a user account, and doing some simple
    configuration, you can be making calls to others over the Internet within a few
    minutes.


    Skype describes its Internet-based telephony service as a decentralized peer-to-peer
    network. The concept of peer-to-peer (P2P) networked applications was popularized
    by file-sharing applications, such as KaZAA (www.kazaa.com), where clients can
    offer and share files (containing documents, music, video, or other content) directly
    to clients. In its P2P VoIP offering, Skype emphasizes the decentralized aspect
    of how it implements its communications services.


    By decentralizing the processing and networking power needed to run the Skype
    service, the Skype network can grow without adding more centralized servers. In
    other, each client using Skype shares its processing power and network bandwidth
    to increase the general pool of resources available to all Skype users. So, in
    theory, adding more Skype users shouldn''t require more servers, bandwidth, and
    other computing resources to maintain the same performance level for all users.


    Traditionally, standard telephone service has been far superior to VoIP in quality
    and reliability. The following is a list of common shortcomings of VoIP services
    and how Skype is designed to deal with:


    +   - **Poor call communication—Firewalls (which often block most incoming service
    requests) and network address translation (which can hide private IP addresses
    behind a single public IP address) prevented many calls from getting through.**
    To more effectively route calls, Skype uses Skype clients with public IP addresses
    to act as proxies to route clients that are behind firewalls.


    +   - **Poor call quality—Inefficient routing of calls often results in poor quality
    of transmission on VoIP networks.** Skype uses multiple connection paths so that
    the best possible route for data can be chosen as it is needed.


    +   - **Difficult configuration—Instead of just contacting a phone company and
    plugging in a phone, many VoIP services require complex firewall configuration
    and manual identification of servers.** A simplified user interface that requires
    no special firewall configuration makes Skype easy to set up for most users. (See
    Skype and Firewalls: www.skype.com/help/guides/firewall.html.)'
  merge: -1
  pgno: 292
- img_proc: true
  md: '+   Expensive centralized servers—Many VoIP services rely on central directory
    servers to maintain information about users, as their identities, IP addresses,
    and whether they are currently connected. As more people joined the service, the
    VoIP provider either had to add more servers or allow the overall service to degrade.
    Skype uses a decentralized, global user directory. This Global Index technology
    consists of a hierarchy of nodes that allow every node in the network to identify
    all users and resources in the network with little latency.


    +   Insecure transmissions—Because the Internet is a public network, it''s possible
    for calls to be intercepted. To keep intruders from listening in Skype calls,
    Skype encrypts all file transfers, instant messages, and calls at both ends of
    the transmission.


    There are some aspects of VoIP that are inherently different from standard plain
    old telephone system (POTS) phones. You should keep these in mind before considering
    your current phone system with Skype or other VoIP service:


    +   No emergency service—Unlike line phones that are wired into a particular location,
    your VoIP service is tied to an IP address that can easily change. Skype documentation
    makes it clear that its service should not be used to replace your current telephony
    system because it cannot support emergency 911 (or other emergency service) dialing.


    +   Restrictive firewalls—Although Skype doesn''t require special firewall configuration
    to allow incoming calls, some restrictive corporate firewalls may prevent some
    outgoing services as well. From a computer that is behind a firewall, Skype may
    work poorly or not at all.


    +   Single phone—The VoIP protocol doesn''t handle multiple telephones on the
    same line view. With Skype, you are restricted to answer the phone from a single
    location (your computer or handheld device).


    +   Other telephones services—You should do a service-by-service comparison of
    your current phone service before switching to Skype, to be sure you''re not going
    to lose something you rely on. For example, outgoing caller ID is not yet supported
    by Skype (although it is being considered) as a lot of people who do not answer
    anonymous calls may pick up when you call.


    +   Unreliable Internet connection—Poor call quality can also result from having
    a slow or unreliable Internet connection.


    Although the number of people use Skype to replace their standard telephone service
    is growing (despite Skype''s warnings against it), most Skype users still'
  merge: -1
  pgno: 293
- img_proc: true
  md: 'maintain their old service along with Skype. For more talk on the pros and
    cons of using Skype as your only phone service, as well as general discussions
    using Skype, refer to the Skype forums (http://forum.skype.com). Refer to the
    Skype for Linux forum (http://forum.skype.com/index.php?showforum=18) for more
    specific information on using Skype in Linux.


    # Setting Up VoIP Broadband


    The entry point of the hardware you need for using VoIP service in Damn Small
    Linux is quite low. Almost any computer that runs Damn Small Linux and has working
    hardware (input and output) can be used for Skype. For example, most PCs with
    Pentium processors and at least 64MB of RAM should work fine.


    Using your computer that is running Damn Small Linux, here is the list of minimum
    hardware requirements you need to get:


    +   **Network hardware**—You need to have hardware to connect to the Internet.
    A relatively fast Internet connection is needed to get the best performance.


    +   **Microphone**—Any microphone you can plug into the microphone jack (usually
    pink or red) on your sound card should work.


    +   **Headphones**—Although you could use your PC speakers, headphones are recommended
    to prevent the feedback that can occur from picking up your microphone.


    There are a variety of headsets you can purchase for hands-free operation. Some
    of the headsets offered directly from Skype contain call minutes for SkypeOut
    calling. You can look into headsets and other Skype gear at the Skype shot (http://accessories.skype.com).


    Before setting up Skype software, you should plug in your headphones (Line Out,
    green port) and microphone (Microphone, pink or red port). Then, with DSL booted
    and running, check that your sound system is working.


    > NOTE

    Although other versions of Skype support video calls, the Linux version (as of
    this writing) does not. Video support is one of the most requested features on
    the Linux Skype forums, so you can expect later versions of Skype for Linux to
    include video support.'
