  md: '# CHAPTER 4


    # # Configuring and Saving DSL Settings


    One of the biggest challenges in creating Damn Small Linux (DSL) was to make an
    integrated desktop. The usual integrated desktop environments like KDE or GNOME
    are just too large. Xfce and others were not the smallest available. John Andrews
    originally chose the window manager of Fluxbox and an icon program called XtDesk.
    Later, I created GUI configuration programs to give a feel for some integration.
    Whether you like a Windows-style double-click or single-click icons, it is now
    easy to set up.


    DSLs small size is also the result of John''s carefully selected applications.
    But many of these applications have many different user interfaces. John and I
    continue to improve the GUI interface programs. The purpose is to provide a common,
    consistent user interface.


    DSL also continues to support CLI or command-line interface programs. There, an
    extra challenge in creating new GUI programs was to continue support the DSL versions.
    Not every conceivable configuration will be covered here. Many programs’ setups
    can be found at their respective home sites. Of course, all the custom applications
    and GUI interfaces created by John and me will be thoroughly covered.


    This chapter will cover most of the basic aspects of configuring DSL. Topics covered
    will be the backup and restore, desktop, connecting to the Net, and web backup.
    Let''s begin with the backup and restore procedure. No use in configuring anything
    if it cannot be contained in the backup and restored upon the next system boot.'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# BACKING UP AND RESTORING YOUR CONFIGURATION


    DSL being primarily a live CD, or emulation thereof, means that the base system
    is read only. So how do you save your settings? Mastering DSLs backup and restore
    method is essential to enjoying DSL without using a traditional hard drive install.


    The following section describes how to back up your DSL settings, files, and applications
    to a single archive file on a local medium (such as a floppy disk, pen drive,
    or hard disk). If you would like to back up (and later restore) your archive to
    an FTP server on the network, refer to the “Saving Settings on the Web” section
    in this chapter.


    # Backup and Restore—The Basics


    Looking at the desktop, notice the DSLpanel icon. It is the most used icon to
    configure DSL. By clicking this icon, you are presented with the control panel
    shown in Figure 4-1.


    FIGURE 4-1 Figure backups and other DSL features from the DSL control panel.


    ![](img/f6eecb623fe812080d8ad148db9eda3a_92_0.png)


    Click the Backup/Restore button. Using the Fluxbox menu, choose System, then Backup/Restore.
    The Filetool pop-up window, shown in Figure 4-2, prompts you for the name of the
    device (representing a hard disk, USB flash drive, or other writable medium) where
    you want the backup to be stored.


    FIGURE 4-2 Choose the device that will hold the backup configuration.


    ![](img/f6eecb623fe812080d8ad148db9eda3a_92_1.png)


    When this dialog is first displayed, the Device input area is blank. Therefore,
    there is no location to place your backup data and you would lose all of your'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'settings. You must enter a valid device. In DSL terms or Linux terms, this
    usually

    means, in order of popularity, the following options:


    +   - A pen drive (or other USB flash drive) is usually sda or sda2, where the

    number corresponds to the partition number.

    - For the floppy drive, enter floppy or fd0.

    - For an IDE drive, the first drive would be hda1, hda2, and so on.

    - For the second hard drive, use hdb1, hdb2, and so on.


    > NOTE

    Pen drives appear as SCSI drives in Linux. If you have a SCSI or serial ATA

    hard drive installed on your computer, it may appear as sda1 and your pen

    drive may appear as sdb1. If you see multiple partitions beginning with sd in

    the mounting tool on the desktop, try opening each drive to make sure you

    have the correct one before proceeding.


    The home directory is automatically included in the backup, as well as some

    areas of /opt. The full details of this will be discussed later. For now, click
    the

    Backup button and you start the automatic backup/restore procedure of DSL.


    I suggest you become familiar with the basics of backup and restore. Start

    by making a small change to your system and then reboot it. This will help ensure

    at you understand how the backup process works, before you losing hours of

    configuration.


    Upon reboot, as long as the device is physically present—that is, the pen drive

    is plugged in—DSL automatically scans for your backup file. If the backup file
    is

    found, the contents of backup file are restored without the need to further spec-

    ify any device.


    # Selecting Files and Directories to Back Up with .filetool.ist


    After setting up your new system, you want to save all of your settings. There
    is a

    file called filetool1.ist. It is a simple text file of files and directories listed
    one

    line using a full path that the user wants to save/restore. Type ls -1 /home/dsl

    to see the .filetool1.ist file, because simply typing 1 will not show files that

    begin with a dot (.).


    Use any of the DSL editors to change/update the .filetool1.ist file. For exam-

    ple, select Beaver, and then type in .filetool1.ist to open that file for editing.'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'The default contents of the .filetool.1st file cause the entire home/dsl directory
    to be backed up. However, you can choose to selectively back up only certain files.


    > NOTE

    It is very important to note that the entry /home/dsl/.filetool.1st must not be
    removed from the .filetool.1st as this provides for persistence the .filetool.1st.


    The default .filetool.1st file in DSL 3.3 looks like this:


    ```

    opt/ppp

    opt/bootlocal.sh

    opt/powerdown.sh

    opt/dslrc

    opt/.mydsl_dir

    home/dsl/

    ```


    # Excluding Files and Directories from the Backup


    Exclude files from the backup with the file /home/dsl/.xfiletool.1st. Adding entries
    to this file excludes them from the backup. Cache and other files are in the default
    .xfiletool.1st:


    /home/dsl/.xfiletool.1st


    This file lists exceptions to files in .filetool.1st, which means if you have
    a directory listed in .filetool.1st, you can use .xfiletool.1st to prevent certain
    files or subdirectories within that directory from being added to your backup.


    This file works by using pattern matching rather than full file paths. In this
    way, you can exclude multiple files with the same name that may be found in separate
    directories. If you want to exclude a specific file, you can still use the full
    path to the file. The default file in DSL 3.3 looks like this:


    ```

    Cache

    XUL_.mfas1

    home/dsl/.mnt

    home/dsl/.jwmrc

    home/dsl/.opera/cache4

    home/dsl/.opera/images

    home/dsl/.fluxbox/mydsl.menu

    ```


    Note that Cache is listed without a path, which means all files named Cache within
    directories listed in .filetool.1st are excluded from the backup. You can'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# CHAPTER 4 Configuring and Saving DSL Settings


    also use wildcards to extend the exclusion. For example, if it lists Cache*, all
    files whose names begin with Cache are excluded.


    # Restoring Your Setting


    Your backup of selected files and directories is automatically searched for and
    restored during the boot process. No user interaction is required. DSL searches
    your storage media for your backup archive based on the order of detected drives
    that are added to the /etc/fstab file. It checks each disk partition until it
    finds a backup.tar.gz file in the root directory of one of those devices.


    You can override this feature by specifying the device that holds your backup
    file:


    ```

    boot: ds1 restore-hda2

    ```


    Specifying the device actually speeds up the boot process as attached and available
    physical devices do not have to be searched. However, not specifying the restore
    boot option means a hands-free automatic boot.


    > NOTE If you decide at some point that you don''t want to use your backed-up
    settings, add the norestore option to the DSL boot command. If you want to permanently
    remove the settings, delete the backup.tar.gz file from the root directory of
    the device on which it is stored.


    The restore option, together with a .xinitrc file, provides the user with much
    more control of his preferred environment. See the "Configuring the Desktop" section
    for further information on using the .xinitrc file and other features to choose
    which settings and applications start up when the desktop is launched.


    Now that we have covered backup and restore, let''s continue with the desktop
    configuration options.


    # CONFIGURING THE DESKTOP


    With your backup procedure in place, configuring your desktop to your preferences
    is a good next step. Start by choosing a desktop interface, then set up icons,
    backgrounds, and wallpaper in a way that pleases you.'
  merge: -1
  pgno: 95
- img_proc: true
  md: '# Selecting Your Desktop


    Fluxbox is the default window manager used by Damn Small Linux. DSL also lets
    you switch to the Joe''s Window Manager (JVM), if you prefer. JVM offers a desktop
    interface that is somewhat like the Microsoft Windows desktop interface. The version
    of JVM in DSL is a heavily modified and stripped-down version of the original
    JVM.


    You can change window managers by displaying the desktop menu (right-clicking
    the desktop) and selecting WindowManager, Switch to JVM. You can switch back to
    Fluxbox from the desktop menu by Selecting Exit, Switch to Fluxbox. (Before switching
    window managers, keep in mind that this action will restart the X Window system
    and close any applications you have open).


    You can add applications to open when your desktop launches by editing configuration
    files in the home directory (/home/dsl). For example, by editing the .xinitrc,
    you can start up your favorite Programs. You can start non-X programs by editing
    the .bash_profile and adding it to .filetool.1st.


    If you need to load additional modules and system-specific required files, you
    can do so by editing the /opt/bootlocal.sh file and adding it to your .filetool.1st.


    # Managing Icons


    Most distributions have the luxury of using prebuilt integrated desktop systems,
    or even icon management systems, as such Rox (http://rox.sourceforge.net). In
    keeping with DSL''s “smaller is better” theme, XtDesk icon program was used. The
    challenge was, although XtDesk icons were very functional, there were no GUI configuration
    tools. I created a small Lua/Fltk GUI together with making a few modifications
    to the XtDesk code to create DSLs own unique icon management tool.


    First, let''s discuss the standard XtDesk editing capabilities. When you rightclick
    an icon, a small pop-up appears. Sometimes, the pop-up contains or related programs
    to start and the bottom section of the pop-up is labeled Properties. Clicking
    Properties brings up a screen similar to the one shown in Figure 4-3.


    You can move the box cursor and edit any icon properties. The MenuCommand1 option
    is the alternate right-click way to launch the program. The Status option is custom
    to DSL and should be used for base application. The additional applications called
    MyDSL extensions do not use the Status field. Usually, this screen is used to
    manually change X and Y coordinates, change the caption, and so on.'
  merge: -1
  pgno: 96
- img_proc: true
