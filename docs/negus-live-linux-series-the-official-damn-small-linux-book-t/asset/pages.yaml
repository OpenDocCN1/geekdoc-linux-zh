- img_proc: true
  md: '# HARDWARE REQUIREMENTS


    With the power of the average PC growing exponentially in the past few years,
    you might be able to grab an older PC from your closet or from a used computer
    store for just a few dollars. Because DSL was created to run fast on older processors
    and in low RAM environments, DSL will run on many PCs that won''t run Windows
    Vista or even some Enterprise-level Linux systems.


    Let''s start by reviewing the hardware that is required to successfully boot DSL.
    The recommended hardware is as follows:


    +   * 486DX (recommended Pentium I) 32MB RAM

    * IDE boot CD drive or 3.5" floppy drive plus nonbootable CD drive

    * SVGA compatible graphics card

    * Monitor capable of 800x600 pixel resolution

    * Serial mouse, PS/2 mouse, or USB mouse


    Although the hardware just mentioned is the minimal requirement to boot DSL from
    a CD, if you only have a floppy drive, the actual minimum requirement is the following:


    +   * 486DX 16MB RAM

    * 500MB hard drive

    * 3.5" floppy drive

    * SVGA VESA compatible graphics card

    * Serial mouse


    Because the minimum hardware (486DX) typically has a floppy drive and not a CD
    drive, hard disk space is needed to contain DSL. This minimum hardware configuration
    and its installation of DSL are discussed in Chapter 8, "Installing DSL in Alternate
    Ways." The focus of this chapter is booting from or with a CD and with at least
    the recommended hardware configuration.


    > NOTE


    The latest Damn Small Linux will boot on newer Intel-based Mac computers. However,
    not all hardware (such as network cards) are supported. It is theoretically possible
    that you could install DSL to hard disk on one of these machines using Apple Bootcamp
    (www.apple.com/macos/bootcamp). But that configuration is not officially supported
    by DSL.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# SOFTWARE REQUIREMENTS–DSL VERSIONS


    Damn Small Linux is available in several different versions. The version you use
    depends on the environment in which you are running DSL. The four versions DSL
    include:


    +   - A SYSLINUX version—Used for older PCs that require the boot medium to be
    no larger than a floppy image (even if that image is on a CD). For more information
    on the SYSLINUX boot loader, refer to the SYSLINUX FAQ (http://syslinux.zytor.com/faq.php).

    - A ISOLINUX version—Used for booting live CDs, because needs no special floppy
    emulation disk. For more information on the ISOLINUX FAQ (http://linux.zytor.com/iso.php).

    - A Qenu Virtual Machine version—Sets up Qemu to run DSL virtually within a Linux
    system.

    - A VMware Virtual Machine version—Sets up VMware to run DSL virtually within
    a Windows system.


    The first two versions concerning booting from the CD, which is the topic of this
    chapter. The other two versions are discussed in Chapter 7, “Running DSL Embedded
    in Windows.” Why are there two versions for DC? Because DSL targets older and
    smaller hardware, many such systems could only boot from CD if there existed an
    actual emulated floppy. This booted floppy was restricted to the size of a real
    floppy. Later machines were made without such a restriction.


    So, the first rule is: If your machine cannot begin the boot process, or if your
    machine is an older variety, use the SYSLINUX version.


    The SYSLINUX version of DSL emulates a single floppy at boot time. There are fewer
    drivers in the SYSLINUX version because they must all fit within a single floppy-sized
    file. The reason Knoppix and the other went with ISOLINUX is that there is no
    single floppy size limitation. The ISOLINUX version has many more drivers to support
    booting newer computers.


    # GETTING DAMN SMALL LINUX


    There are several versions of Damn Small Linux included on the CD that comes with
    this book. You can read about what those versions are and how to use them by referring
    to Appendix A, “On the CD.” However, if you don’t have the CD handy or a later
    version of DSL is available, you might consider downloading a copy of DSL to make
    your own bootable CD.'
  merge: -1
