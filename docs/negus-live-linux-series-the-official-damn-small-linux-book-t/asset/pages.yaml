    ![](img/f6eecb623fe812080d8ad148db9eda3a_125_0.png)


    Clicking one of these packages displays its info file providing information about
    the extension. This includes the name and web address of the program''s creator,
    a brief description of the program, and any additional info that might be needed
    to'
