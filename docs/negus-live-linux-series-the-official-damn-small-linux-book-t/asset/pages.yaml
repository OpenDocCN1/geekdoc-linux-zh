    Interactive startup/setup

    ```


    FIGURE 2-3 Press F2 to view boot options for language, video, restoration settings,
    and other features.


    Figure 2-4 shows the screen that appears by pressing F3 at the boot prompt.


    As you can see from the boot options screen, there are a lot of options that you
    can try. However, most of these options are there to overcome rare problems or
    offered enhanced ways of using DSL (such as running totally from RAM). The fact
    is that for most users, DSL will just boot up without additional options, so they
    can stop reading after the opening paragraph of this chapter.


    There are some machines that require additional boot options. Usually, difficult
    machines have problems related to VGA capabilities, power management, and PNP
    BIOS special boot options can help overcome. Other boot options can be used to
    turn on special features (such as adding passwords or starting services). Some
    of these options are discussed in other chapters and frequently discussed in the
    “Advanced Boot Options” section later in this chapter.'
