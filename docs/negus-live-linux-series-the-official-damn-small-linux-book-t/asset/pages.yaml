  md: '# CHAPTER 8 Installing DSL in Alternate Ways 153


    Installation methods described in this chapter assume you have Windows, just DOS,
    or even no operating system installed at all. The installation methods discussed
    here also apply to standard white box computers. But typically, computers have
    CD-ROM drives or one can be easily added.


    Also, be aware that all the boot time options that were discussed in Chapter 2
    apply here. This chapter''s focus is the alternate installation types and how
    to set up the necessary DSL files even without a CD-ROM so that you can start
    the boot and therefore installation process of DSL.


    After a successful alternate method is working, it is easy to move to the more
    advanced methods. After the Poorman''s method is working, it is easy to set up
    a frugal DSL install, or frugal hybrid, or the traditional hard installation.


    # STARTING A DSL INSTALLATION


    The first method for installing DSL to your hard drive assumes that your computer
    can boot from the DSL CD. If that''s the case, boot the DSL CD and type the following
    boot option:


    ```

    boot: install

    ```


    This option brings up an installation menu as shown in Figure 8-1.


    ![](img/f6eecb623fe812080d8ad148db9eda3a_173_0.png)


    > FIGURE 8-1 The DSL installation menu appears when using the install boot option.


    This allows quick and easy access to the various installation methods. Pen drive
    installation is discussed in Chapter 6, “Running a Native Pen Drive Install,”
    and traditional hard drive installation can be found in Chapter 9, “Performing
    a Traditional Hard Drive Install.” Note that Poorman''s is missing from this menu.
    This is because it is not needed if you can boot from CD.'
