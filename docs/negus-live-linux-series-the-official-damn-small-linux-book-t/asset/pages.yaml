    to floppy diskette. For Windows, this usually means rawwrite. The rawwrite program
    for Windows can be found here:

    http://www.chrysocome.net/rawwrite


    After you have written the diskette image to a floppy disk, remove the disk so
    you can use it to install DSL on the target machine. (Later, when instructed to
    boot from either of these two floppies, be sure that you have changed your system''s
