  md: '# Making Free Calls


    After you have gotten your Skype session all set up, making calls is the easy
    part. Here are some of the ways you can go about making free calls to other Skype
    users on a computer:


    +   - Contact List—Select a user from your contacts list, then click the green
    phone icon on the bottom of the screen to make the call. Or, you could right-click
    the contact name and select Call This Contact from the menu that appears.


    +   - Search List—Search for the contact you are looking for, as described in
    “Finding People to Connect To” section. Select the contact from the list and click
    the green call icon from the lower-left corner of the screen to call that person.


    After the call is placed, a pop-up window appears on the recipient''s desktop.
    Figure 14-6 shows an example of such a pop-up appearing on the Mac OS desktop
    of a Skype user.


    ![](img/f6eecb623fe812080d8ad148db9eda3a_305_0.png)


    > FIGURE 14-6 A Skype client is alerted that a Skype call is coming in.


    The recipient can simply select the Answer button before begin conversing. Either
    party can end the call by selecting the red hang up button.


    # Participating in Chats


    Although there are a lot of applications that let you carry on typed chats with
    one or more people, Skype lets you leverage the same Skype database to carry on
    typed chats with the people you are set up to call. You can start a typed chat
    in the way you begin in an audio call:


    +   - Contact list—Right-click a user from your contacts list, and then Send an
    Instant Message from the menu that appears.


    +   - Search list—Search for the contact you are looking for, as described in
    “Finding People to Connect To” section. Right-click the contact from the list,
    and then select an Instant Message.


    The chat window opens, ready for you to type a message to the chosen recipient.
    Type a message and press Enter. A chat window opens on the recipient''s desktop.'
  merge: -1
