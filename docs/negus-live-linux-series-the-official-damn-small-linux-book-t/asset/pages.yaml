  md: '# 282 The Official Damn Small Linux Book


    When Skype is running (/opt/skype/skype in DSL), your computer is accessible to
    the Skype service, even if you are just signed in but not currently making a call.
    Those contacts you have allowed will be able to see that you are online. The Skype
    services itself will have access to your computer''s processor and bandwidth.


    The following sections describe how to use Skype to find and communicate with
    Skype users in various ways. Later, you can find information on how to use the
    Skype-for-pay services, such as making calls to traditional telephones.


    If you find that you need more information about using Skype, you can refer to
    the online guides available from the Skype website (www.skype.com/help/guides).
    In particular, you can find out how to get software and instructions for setting
    up Skype on other computer systems (such as Windows and Mac OS X).


    # Trying a Test Call


    Before proceeding, you should check that your microphone and speakers/headset
    are working with Skype by trying a test call. In the text box near the bottom
    of the Skype screen, type your account name:


    echo123


    and click the green icon. Skype makes a call to the Skype Test Call account. A
    voice tells you to record a message at the tone. After you speak for a few seconds
    into the microphone, if you hear it, your Skype service is working well enough
    to proceed to using Skype. (If not, refer to the "Troubleshooting Skype" section
    later.)


    # Finding People to Connect To


    Skype keeps a public record of every Skype user account, which can optionally
