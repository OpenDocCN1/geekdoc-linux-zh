  md: '# CHAPTER 9 Performing a Traditional Hard Drive Install


    FIGURE 9-3 The mkswap command sets up a Linux swap area.


    # THE HARD DRIVE INSTALL SCRIPT


    There are quite a few options when doing a conventional hard drive install of
    Damn Small Linux. You can install DSL without a boot loader, or you can choose
    to install Grub or Lilo. Unless you are installing DSL on a computer from which
    you want to boot multiple operating systems, you probably want to have the script
    set up the boot loader for you.


    You can install DSL in single user mode, which brings you to a desktop at boot.
    Or, you could opt for a multiuser setup, which requires you to log in before you
    access the desktop or command line. You also have the option of installing DSL
    with ext3, a journal file system, or the older ext2 file system.


    For our demonstration, we are going to select Lilo because it is simple (gives
    less booting options) and this is an old computer that will only be booting DSL.
    In addition, we are going to install DSL to be set up for multiple users because
    it is slightly more secure with the additional requirement of logging in before
    the user is granted access to the system.


    If you are not sure what choices to make, try a few different configurations to
    see what fits your needs and feels the most comfortable. For this example, I also
    chose to go with ext2, the nonjournaled file system, because it has a faster write
    access and uses less disk space. Others may find that the increase in reliability
    is worth the performance hit of the ext3 file system.


    If your system is underpowered (or if you are in a hurry), you may want to do
    an installation from the DSL CD in “installation mode.” Type install at the boot
    prompt:


    ```

    boot: install

    ```


    This boots you into the following DSL Install Options:==


    | DSL Install Options | Net Access Req''d |

    | 1. Make Standard Boot Floppy | yes |

    | 2. Make USB Boot Floppy | yes |

    | 3. Install to Hard Drive | no |

    | 4. Frugal Grub Hard Drive Install | no |

    | 5. Frugal Lilo Compact Flash Install | no |

    | 6. USB Pendrive ZIP boot Install | no |

    | 7. USB Pendrive HDD boot Install | no |

    | 8. Split KNOPPIX into floppy sized chunks | no |'
