    DSL also uses a modified cloop module. DSL supports 64 cloops. So we need to modify
    the source for cloop and build this module.


    1. Change to main source directory.

    # cd /usr/src


    2. Extract the cloop source files and change to its directory:

    # tar -zxvf /cdrom/chapter11/kernel/cloop-2.01.tar.gz

    # ln -s /usr/bin/gcc-2.95 cc

    # ln -s linux-2.4.31 linux

    # cd cloop-2.01/-


    3. Modify a source file to up the cloop count to 64:

    # vi compressed_cloop.c

    Change #define CLOOP_MAX 64


    4. Modify the Makefile for DSL:

    # vi Makefile

    Comment out the following line (line 9)

    # include $(KERNEL_DIR)/conf.vars

    Edit the following line (line 12)

    CKERNOPTS+= -O2 -D__KERNEL _ _


    5. Finally, make the modified module:

    # make all


    6. Manually install this modified module and update the module dependencies:

    # cp cloop -a /lib/modules/2.4.31/kernel/drivers/block/.

    # depmod -a


    If you need to make additional cloop devices, the procedure is:


    ```

    # cd /dev

    # mknod /dev/cloop4 240 4

    # mknod /dev/cloop5 240 5

    ...

    # mknod /dev/cloopN 240 N

    ```'
