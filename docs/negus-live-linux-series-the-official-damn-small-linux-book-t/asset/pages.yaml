- img_proc: true
  md: '# CHAPTER 11 Setting Up a Full Remastering Environment


    Other sizes or resolutions will not work. You can use the Gimp MyDSL extension
    to edit and/ create a boot image file.


    +   - f2 and f3: These are the help files displayed when the F2 and F3 function
    keys are pressed at the initial boot prompt. These are text files and can be edited
    with any text editor.


    +   - minirt24.gz: This is the initial ramdisk used to bootstrap DSL.


    > NOTE

    The Syslinux version has these files packed into a floppy-sized image. This is
    called boot.img. The unpacking and packing of this image file will be discussed
    later, in the "Creating the Syslinux ISO Image" section.


    # Default Boot Options


    The default boot times are stored in either isolinux.cfg or syslinux.cfg depending
    on the CD-ROM remaster type you are choosing. For your Inolinux-based remaster,
    the file to edit is located at master/boot/isolinux/isolinux.cfg. This is a simple
    text file and can be easily edited. It is the APPEND line where the boot options
    are specified.


    # The Boot Splash


    The boot splash screen contains an image that is shown at boot time. This is the
    image above the boot: prompt. This image is quite difficult to create as it is
    in the LSS16 format. I have provided utilities in the chapter11/remaster/gnu directory
    on the CD-ROM.


    The usual procedure is to copy the image file logo.16 to a working directory on
    a machine running the X Windows System. To convert the LSS16 to a format that
    Gimp can display, use the following:


    ```

    # lss16toppm < logo.16 > logo.ppm

    # gimp logo.ppm

    ```


    After editing or creating a new image file, use the utilities provided in the
    chapter11/remaster/gnu directory: giftoppm, pngtoppm, or bmptoppm. Then, convert
    back to LSS16 format. For example, if in Gimp you saved the image as .bmp, use


    ```

    # bmptoppm < logo.bmp > logo.ppm

    # ppmtoss16 < logo.ppm > logo.16

    ```'
