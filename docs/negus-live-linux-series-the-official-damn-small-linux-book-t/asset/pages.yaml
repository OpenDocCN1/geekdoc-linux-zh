  md: '# CHAPTER 3


    # Using DSL Applications


    Damn Small Linux is designed to be a fully functional desktop in a very small
    package. The native applications in DSL are chosen for their blend of compact
    size, speed of use, and functionality.


    The DSL developers and user community has spent more than three years refining
    our choice of applications in DSL, and we believe in the quality of our overall
    package. There have been several changes over the last few years as we worked
    out the best combination of features to fit into our small package.


    # THE LOGIC BEHIND OUR CHOICES


    The three dominant issues in choosing applications for DSL have been reliability,
    library dependency, and usability. In this process, we changed media players,
    spreadsheet application, browsers, word processors, calculators, text editors,
    and the widget language on which we base our desktop GUIs.


    GTK+ is a toolkit for creating graphical user interfaces. GTK+ was originally
    developed for the Gimp image editing program. An experienced Linux user may notice
    that there are no GTK2 applications in DSL and may wonder why. Many of our applications
    are actually based on the older GTK1.2 toolkit. The two reasons are that GTK1.2
    applications tend to be:


    +   - Smaller. They take up less space and have fewer dependencies.


    +   - Faster. Speed is very important in the DSL computing philosophy.'
