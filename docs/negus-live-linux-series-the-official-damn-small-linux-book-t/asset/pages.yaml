    # From Thin Client to Work Station


    I am not fond of computer noise. I dislike the clicky-click-click of processors,
    the whirling sound of CPU fans, the spinning up and down of optical drives, the
    constant buzz of a desktop power supply, and even the quiet hum of a hard drive.
    This complaint might sound extreme, but I spend a great deal of time in front
    of a computer and after so many years, I have become really particular about my
    work environment.'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# CHAPTER 12 Running DSL on Alternative Hardware 255


    If you have never tried working on a silent computer, you really do not know what
    a joy it can be. The only noise you hear is what you want to hear (e.g., some
    music or a radio stream). I have heard many computer users say that after they
    go silent, they could never ever use a noisy computer.


    There are silent computers on the market, and some high-end units cost several
    thousand dollars. There are also Mini-ITX-based small form PCs specially built
    to be silent, but these tend to be very expensive (frequently on the plus side
    of $300 for a basic unit). These computers are priced heavily because they are
    produced in limited quantity as a special order. To have an affordable silent
    PC, the units need to be made in mass amounts, but this is too much of a niche
    market to occur.


    # The Thin Client as a Silent PC


    Thin clients are plentiful and many affordable. Often, they are silent with no
    moving parts, and instead, relying on passive cooling to lower the temperature
    of the CPU.


    Computers designed to be thin clients can also be very small and attractive. Many
    of the more modern thin clients have some provisions for on-board storage, such
    as an IDE flash, a built-in compact flash reader, or provisions for a laptop-size
    hard drive. Many of the newer thin clients also boot via USB.


    Thin clients are often priced under $300. Used ones can be bought for not at sites
    like eBay, although they are usually the older models that need to be underpowered.


    Two of the most popular models we sell in the DSL store are the eBox III, a.k.a.
    the Damn Small Machine (DSM), and a Mini-ITX-based thin client from Taiwan, which
    we call the Bargain BareBones. Both are intended for the thin client market, so
    they are affordable, but they are also well suited to running DSL. Figure 12-4
    shows an example of the eBox III.


    The DSM has embedded RAM, which means that it is fixed to 256MB. This amount is
    really not enough to run one of name-brand operating systems well, but it is plenty
    to run DSL. As it comes, the DSM can boot right off of a USB drive, so there is
    no need to use an IDE all if you choose.


    You have a few options for IDE booting if you prefer this option. You could opt
    for an IDE DOM (disk on module) specifically made for the DSM. In addition, the
    DSM has provisions for a laptop-size hard drive. Thus, you can use a conventional
    hard drive, but you can also opt for a conventional CF card mounted to a IDE CF
    adapter. The motherboard is powered by a Via 700MHz Nano processor, again, plenty
    of power for DSL. Figure 12-5 shows our BareBones machine next to a more typically
    sized Mini-ITX case.'
  merge: -1
  pgno: 275
- img_proc: true
