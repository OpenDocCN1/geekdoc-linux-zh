    end there. If DSL does not exactly do what you want it to (and where you want
    to), the project helps you improve on what you can do with DSL in the following
    ways:


    +   **It’s expandable**—Using the MyDSL feature and a connection to the Internet,
    tons of extra applications can be downloaded and installed on your running DSL
    system with just a couple of mouse clicks. Because DSL has roots in other popular
    Linux distributions (in particular, Debian and KNOPIX), software created for those
    distributions can also just be dropped in and run in DSL. See Appendix B, “MyDSL
    Extensions.”


    +   **Portable**—Although the standard DSL is made to run on a medium as small
    as a 50MB bootable business card, it can be easily made to run from your hard
    disk, standard CD or DVD, USB pen drive, or other fixed and removable media. It
    can even run embedded from installed Linux or Microsoft Windows systems.


    Many people have DSL on a USB pen drive, along with other applications and data
    (documents, music, images, and presentations). Instead of carrying a laptop with
    you, you can carry everything you need on a USB flashdrive or pen drive that’s
    the size of a stick of gum.


    Keeping the basic DSL system small, fast, and efficient makes it both a tool in
    itself and a great foundation to build on. Here is a list of the best reasons
    for DSL:


