- img_proc: true
  md: '# Adding Applications and Creating Shareable Extensions


    Damn Small Linux can be easily extended to run many more applications than provided
    by the base 50MB system using the MyDSL extension system, as we saw in Chapter
    5, “Extending Applications with MyDSL.” In this chapter, we will discuss several
    ways to make your own MyDSL extensions.


    There are many ways to approach the creation of an extension—whether it starts
    by modifying an existing package, be it a tarball, a Debian package, or compiling
    from sources. We will learn how to make all four types of MyDSL extensions: from
    the .tar.gz to .dsl, .uci, and .unc.


    # OVERVIEW


    All UNIX-based systems add applications to the file system as a collection of
    files and directories. Typically, the method used is TAR (tape archive) or CPIO
    (copy input output). Later package management systems would combine installation
    scripts specific to their distributions. Some would add a database of installed
    applications and dependencies required.


    Different package management systems typically have different software age formats,
    use different commands for managing their packages, and change the package name
    extensions to something unique for their distribution. For example, .deb was used
    for Debian packages and .rpm was used for Red Hat Linux packages. Tools as dpkg
    and apt-get are commonly used to install and manage Debian packages, while rpm
    and yum commands are most often used with packaging derived from Red Hat Linux
    (such as Fedora, Red Hat Enterprise Linux, and others).'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# The Official Damn Small Linux Book


    DSL extensions are not much different than the very simplified description that
    I have given. But why have them? Why not stay with the Debian package management
    system? Debian is already available for DSL.


    As discussed in Chapter 5, the MyDSL extensions offered much of the same benefits
    of the traditional hard drive installation to a person using the CD-ROM or the
    compressed DSL file system image installed to hard disk. Besides, running directly
    from the DSL live CD-ROM means that very little of the file system is write-enabled.
    The live CD-ROM and compressed type installs are running (reading) from a compressed
    read-only file system.


    Despite the fact that a .dsl type extension would cause much of the file system
    to become write-enabled, this file system is still on the RAM disk. If we were
    to rely on Debian, or other package management systems, laying down all of the
    files, directories, and a database for package management would quickly exceed
    the capacity of the ramdisk.


    Additionally, trying to maintain a database of installed applications with their
    dependencies in RAM disk does not make any sense. Neither does it make any sense
    to use a persistent storage device to maintain this database of applications that
    are loaded into the RAM disk.


    # Creating MyDSL Extensions


    I created the MyDSL extensions as a way of adding applications that makes sense
    for the way Damn Small Linux works. I called them extensions, and not packages,
    because the MyDSL facility does not offer any application removal. Because the
    extensions are loaded or mounted on ramdisk, simply reboot. The application extension
    is gone.


    But wait; does that mean you must download the extension every time you want to
    use it? No. DSL, like the other distributions, offer an extension loader, based
    on the extension name''s extension. The extension loader can properly load and
    install copies of extensions stored on various persistent media.


    Therefore, a MyDSL extension is a collection of related files, executables, and
    libraries that need to be added to DSL in order to provide the application. Just
    as almost every package in UNIX-like systems are variations of the tar archive,
    so too are MyDSL .tar.gz and .dsl extensions. The .uci and .unc extensions, on
    the other hand, are compressed images of a collection of related directories and
    files needed to provide the application.


    Because the primary focus of DSL is to be a live CD-ROM or to run as a compressed
    installed image means that the only write-enabled area is on the'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# CHAPTER 10 Adding Applications and Creating Shareable Extensions 191


    ramdisk. That being the case, every bit of space saved means more room for other
    applications. Therefore, no matter what source the packaged application starts,
    certain areas are immediately targets to be cut. Also, realize that .uci and .unc
    style extensions are far more efficient when it comes to using RAM.


    # NOTE


    Because MyDSL extensions are designed for the live CD-ROM and compressed installations,
    and no package database is maintained, users of traditional hard installations
    should not use MyDSL extensions. They should use the Debian package management
    system. Using MyDSL extensions on a traditional hard installation is like force
    loading a foreign package, in that it is not readily available for removal.


    # NOTE


    The reverse is not true. You can use Debian packaging tools to load an application
    onto the ramdisk of DSL. Descriptions of how to add Debian packaging tools to
    DSL are contained in the “UNC Extension Type” later in this chapter.


    # Understanding MyDSL Extensions


    Let''s begin by defining the four extension types of MyDSL:

    t.gz: A tar archive collection of files that loads entirely into the base write-enabled
    areas defined on the ramdisk—that primarily being /opt, /tmp and /home/ds1. With
    limited write-enabled areas, most .tar.gz extensions are self-contained.


    uci: A compressed image of a self-contained application that mounts /opt. Usually
    contains a user.tar.gz, a subextension that defines a menu, and an icon for the
    application. Most .tar.gz extensions can be converted into this RAM-efficient
    method.


    ds1: A tar archive collection of files and directories anchored in ramdisk anchored
    from /. The first invocation of this extension type causes most of the file system
    to become write-enabled.


    unc: A compressed image of files that anchors under /opt and adds each base directory
    to the system via unionfs systems. Base directories by default are already write-enabled
    are not added to the union space. This extension type usually contains a user.tar.gz,
    a subextension that defines a menu, and an icon for this application.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# The Official Damn Small Linux Book


    Notice that the .tar.gz and the .uci extension-types are both installed /opt.
    In fact, it is usually easy to convert from .tar.gz to .uci. Similarly, both .ds1
    and .unc extensions are installed under /. It is also easy to convert from .ds1
    to .unc. Later, I will discuss the DSL tools to help in building and converting
    extensions.


    In the rest of this chapter, I will demonstrate how to create the four MyDSL extension
    types. I will use the common application of Zile, zile as an Emacs-like command-line
    editor.


    # COMMON ELEMENTS TO ALL MyDSL Extensions


    Let''s begin by discussing the common elements to all DSL extensions: the menu
    and icon. Being a live CD-ROM, and therefore not inherently a multiuser system,
    means the extensions are built for the default user ds1. Because you use a minimal
    manager (as provided with Fluxbox) and a customized icon manager (called xtdesk),
    you need to provide your own menu and icon for each extension you create. Menus
    and icons are optional, but most users expect at least a menu item to be included.


    > NOTE


    If the application is console based and commonly requires command-line options,
    a menu item is not very useful. The menu item is not required.


    > NOTE


    Loading a Debian application using the standard Debian procedures do not provide
    a menu item or icon. Much of the Debian menu and icon supporting infrastructure
    was cut to reduce the size of DSL.


    All other aspects of an extension—the actual files, directories, libraries, and
    paths—are common to any Linux distribution given the existing kernel, modules,
    and libraries.


    # The Menu Element


    The menu for a MyDSL extension is actually a fragment of the Fluxbox standard.
    This menu fragment is a simple text file and is created under the directory /tmp/mydsl.menu.
    It must be the same name as the base extension name and must'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# CHAPTER 10 Adding Applications and Creating Shareable Extensions 193


    be unique. For example, for the zile.dsl extension, the menu item would be /tmp/mydsl.menu/zile.
    To ensure uniqueness, use version numbers as part of the name for the extension
    name and the matching menu item name. No special characters or spaces are allowed
    in either. Typically, you would use DSLs to create this file:


    ```

    $ beaver /tmp/mydsl.menu/zile

    ```


    Using the standard structure of the Fluxbox menu files, here are the contents
    of the Zile extension menu item:


    ```

    [exec] (Zile) {aterm -e /usr/bin/zile}

    ```


    > NOTE

    Because Zile is a console application, it needs a hosting terminal window. DSL
    uses Aterm for such terminal windows. Therefore, notice that the preceding command
    path includes aterm -e as a prefix to the normal command path. If Zile was an
    X-based application, such prefix would not be necessary.


    # The Icon Element


    The icon element consists of two files. The first file must be in an image format
    readable by Zile''s icon manager, a modified version of xtdesk. Image formats
    png, gif, jpg, and xpm are supported. The icon''s image file is located in the
    /home/ds1/.xtdesktop directory.


    > NOTE

    DSL offers several generic icons available for your extensions. These include
    binary.png, gear.png, and shellscript.png. To use one of these generics, just
    copy them using DSL''s name as the basename. See Chapter 4, "Configuring and Saving
    DSL Settings," for details.


    The second required file is the lnk and it is also located in /home/ds1/.xtdesktop
    directory. Typically, you would use your favorite text editor, such as DSLs beaver,
    to create this file:


    ```

    $ beaver /home/ds1/.xtdesktop/zile.lnk

    ```'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# The Official Damn Small Linux Book


    The .lnk file is a simple text file with the .lnk extension, as zile.lnk. The
    format of the file is as follows:


    ```

    table Icon

    Type: Program

    Caption: zile

    Command: aterm -e /usr/bin/zile

    Icon: /home/dsl/.desktop/zile.jpg

    X: 420

    Y: 384

    end

    ```


    The caption entry is what the icon manager will display under the icon image.
    By convention, all MyDSL extensions should use lowercase letters for this Caption
    field. DSL base application use uppercase letters. With this convention, base
    applications will consistently display any add-on MyDSL extensions when icon auto-layout
    is used. Auto-layout is the default for DSL.


    Also note that because Zile is a console-based application, the Command entry
    also has the prefix -e.

    X and Y coordinates can be any number within the minimal screen resolution that
    DSL supports (640x480). Usually, these coordinates are ignored, as icon auto-layout
    is the default with DSL. The Icon tool and icon layout were discussed in Chapter
    4.


    > NOTE DSL base icons use an additional Status: anchor field. MyDSL extensions
    should never use anchor status.


    # CREATING DSL AND UNC EXTENSIONS


    Because DSL is based on Debian Woody, it is not very difficult to create extensions
    from the Woody repository. The Debian Woody repository is huge, let''s say by
    taking a close look at creating a zile.dsl extension from the Debian Woody repository.


    # The DSL Extension Type


    DSL extensions are loaded on the root file system on ramdisk. This extension type,
    although easy to create, consumes a lot of RAM. It is also capable of overwriting
    core system files and libraries, as well as possibly changing permissions.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# CHAPTER 10 Adding Applications and Creating Shareable Extensions


    Because members of the DSL community create MyDSL extensions, care must be exercised
    in their use. System performance may be impacted. Often, ramdisk memory will be
    overrun and the system will hang. As a user, you must exercise care when loading
    everything into the ramdisk. Of course, a reboot is all that is needed to “delete”
    the offending extension. Or, if persistent storage is used, simply delete the
    offending extension from the storage device.


    For the same reasons, we do not recommend using Debian package manager for live
    CD-ROM or other frugal installs, as it would overwhelm available RAM. Yet, we
    can still deploy the Debian package management system to aid in the creation of
    well-tested and known working packages.


    It is not too difficult to create a DSL extension from an existing Debian package.
    It used to be manual work, using tar commands and removing and trimming files
    to conserve space. We now have tools to aid in their creation.


    # Step 1: Setup DSL for Extension Building


    Whenever you are building a DSL type extension, you should eliminate all possible
    accidental dependencies. That is, your extension should work on any base install
    of DSL. Therefore, to ensure this common pristine environment, you should always
    boot DSL as follows:


    ```

    boot: dsl baseline norestore legacy

    ```


    The options are base and norestore starts DSL with a pristine environment. The
    legacy boot option is for compatibility with the lowest common use of DSL. Other
    boot options that are required by your hardware will need to be added. See Chapter
    2, “Booting DSL,” for details.


    # Step 2: Restore Debian Package Management System


    From the main menu, select Apps -> Tools -> Enable Apt. A root shell window opens
    and an attempt is made to connect to the DSL repositories to restore all the files,
    and binaries needed to use dpkg and apt for our Debian Woody based system. Alternatively,
    you can manually open a root shell and enter the command dpkg-restore. A progress
    bar is displayed as the necessary environment is downloaded and installed. This
    is actually a MyDSL extension called dsl-dpkg that resides in the MyDSL system
    repository.


    > NOTE

    If you use the manual command dpkg-restore, you must as root also perform an apt-get
    update.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# NOTE


    You will want to save the ds1-dpkg.ds1 extension so you can create more extensions
    the next time you reboot DSL. Use the standard methods as described in Chapter
    4. Later, when you need this system extension, you can use the MyDSL desktop extension
    icon Load Local and not have to keep down-loading this extension.


    # Step 3: Install and Test Desired Package


    Now, open a regular shell (ds1 user) to enter the following commands:


    ```

    $ sudo apt-get install zile

    ```


    Because DSL does not normally use Debian packages, there are no updates to the
    system menu. So, you must know the command to start the newly installed package.
    So, for this example, type zile from the shell prompt.


    # NOTE


    In case you are not familiar with Zile/Emacs, you may find yourself stuck and
    unable to exit this program. If that is the case, you can simply press Ctrl-x
    Ctrl-c to exit.


    The where command is very useful in determining the full path to the zile command.
    You will need this full path later in your configuration.


    Thoroughly test the application. You will then be ready to repack the application
    and all of its dependencies into a ds1 type extension.


    # Step 4: Create the Extension


    ```

    $ deb2ds1

    ```


    Enter the full name for your DSL extension.

    Example: rox.ds1 zile.ds1


    Enter the MyDSL menu name for your program.

    Example: Rox Filer Zile Emacs

    Is this an application: (y/..) n


    Enter the full path to the executable.

    Example: /usr/bin/rox /usr/bin/zile'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# CHAPTER 10 Adding Applications and Creating Shareable Extensions


    # Step 5: Save Your Extension


    Because you have already installed Zile via the Debian apt-get command, before
    you can really test your newly built extension, you must reboot. Recall that you
    booted with base and norestore options. So, use care to mount a persistent store
    and copy your zile.ds1.


    # Step 6: Test Your New zile.dsl


    After copying your new extension, reboot DSL with the base and norestore options.
    By the MyDSL tool, Load Local option, navigate to your saved extension and load
    it. Because you have not yet made an icon, use the System menu, MyDSL, Zile Emacs
    to launch the application.


    # Step 7: Add an Icon (Optional)


    Although adding an icon is optional, it gives me the chance to discuss how to
    open an existing ds1 extension. You will want to do this if you need to add, change,
    or edit any file(s) in your extension.


    First, let''s create the icon file. Using the text editor beaver, create the icon
    as described earlier in "The Icon Element" section. The icon for Zile in /home/ds1/.desktop/zile.lnk
    is identified as follows:


    table Icon

    Type: Program

    Caption: Zile

    Command: aterm -e /usr/bin/zile

    Icon: /home/ds1/.desktop/program.zile

    X: 420

    Y: 384


    Next, copy zile.ds1 to /home/ds1 and then open it with the following commands:


    ```

