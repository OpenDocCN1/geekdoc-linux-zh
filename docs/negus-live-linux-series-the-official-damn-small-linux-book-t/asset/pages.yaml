    you don''t have a way to copy files from your media to your hard disk. It might
    also be hard to access removable drives after everything is tucked inside the
    frame.

    In the meantime, however, you could copy a bunch of images onto a USB flash drive
    and plug that drive into your laptop, the partition (probably /dev/sda1), and
    copy files to the /var/mediaframe/pics directory. You could also configure DSL
    to automatically mount the USB flash drive at boot time and have gawiew use a
    directory for images drive. That way, you wouldn''t need a network connection
    at all to change content. You could just change images on the drive, plug it in,
    and reboot.


    +   - Network interface—Having a network connection to your media frame is important
    for being able to add images easily and make any ongoing changes to DSL and your
    media content. As I noted earlier, I connected a USB Ethernet adapter to my laptop
    and plugged a standard RJ-45 Ethernet cable into that and my network switch.


    Configure your network interface with a static IP address. For a wired Ethernet
    interface, run the netcardconfig command (or select System, followed by Net Setup'
