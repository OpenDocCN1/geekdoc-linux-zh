  md: '# The Official Damn Small Linux Book


    Great! At this point you may think “I am done and on to the next chapter.” But
    DSL fails to boot right off or if there’s something you want out of the boot process,
    don’t worry. There are plenty of ways you can improve your experience with DSL
    that start right from the boot prompt. Understanding how DSL boots is a good way
    to begin.


    # UNDERSTANDING HOW DSL BOOTS


    DSLe booting capabilities are inherited from KNOPPIX’s hardware autodetection.
    KNOPPIX has set the standard in being able to autoconfigure a wide variety of
    hardware and set the bar for free CD-based systems.


    Because it is derived from KNOPPIX, DSL has many boot time options to allow support
    for many other systems configurations. So, whether you want to fix a broken boot
    process or simply boot DSL in different ways, using the boot options described
    in this chapter, you can do the following:


    +   * Change video settings.

    * Disable selected hardware devices.

    * Change the desktop window manager or other desktop settings.

    * Choose to run DSL entirely from RAM.

    * Set passwords for root and dsl users.

    * Choose the supported language (from the default English).

    * Start system services to allow such things as remote login, Web, printing, file
    sharing, system logging, and other services.

    * Include (or not include) backed up files or MyDSL applications from different
    storage devices.


    These items describe how the way DSL boots up on your computer. The next section
    describes the computer hardware you need for DSL to work.'
  merge: -1
