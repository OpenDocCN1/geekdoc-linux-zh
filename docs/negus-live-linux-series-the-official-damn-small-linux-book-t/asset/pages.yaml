    # Creating the Syslinux ISO Image


    Many older computers cannot boot Isolinux-based CD-ROMS. These older computers
    are limited to an initial boot image that is the actual size of a floppy disk.
    The older Syslinux boot loader uses just such a mechanism.


    # The makesys Script


    The makesys script can be found on the enclosed CD-ROM in the chapter11-remaster
    directory. The script is to run from within your working directory to create a
    Syslinux bootable ISO image. The following shows the contents of that script:


    ```

    1. #!/bin/sh

    2. RELEASE=`cat release.txt`

    3. #

    4. if [ -d master/boot ]; then

    5. tar -czvf boot.isolinux.tgz master/boot/

    6. rm -f master/boot

    7. fi

    8. cp boot.img KNOOPPIX/

    n9. mkisofs -pad -1 -r -j KNOOPPIX/boot.img -c KNOOPPIX/boot.cat -hiderr-moved
    -o iso="$RELEASE"-syslinux.iso master

    10. sync

    11. sync

    12. if [ "$1" = "1" ]; then

    13. if [ "$2" = "cd" ]; then

    14. cdirect -v speed=4 dev=0,0,0 -iso="$RELEASE"-syslinux.iso

    15. fi

    16. fi

    17. cd iso

    18. md5sum="$RELEASE"-syslinux.iso > "$RELEASE"-syslinux.iso.md5.txt

    19. sync

    20. md5sum -c "$RELEASE"-syslinux.iso.md5.txt

    21. cd ..

    ```'
