  md: '# The Official Damn Small Linux Book


    +   **Add software.** If you only need a couple more applications, a few clicks
    download, install, and save the applications you need.


    +   **Build projects.** To make a computer into a music server, tiny web server,
    or digital media frame, DSL doesn''t fill up your hard disk or RAM with software
    you don''t need so you have more room for the music, web content, or digital images
    you want (see Part IV, “Making Small Linux Projects,” for these and other projects).


    +   **Run securely.** By running DSL from a CD (or other read-only medium), you
    are assured that a secure operating system is only a reboot. If you think that
    someone has compromised or intruded on your system, simply check that any data
    you save is not infected, reboot your DSL live CD, and you are running securely
    from a clean copy.


    As the project grew, DSL also grew by adding an important developer. When Robert
    Shinglede joined the Damn Small Linux development team, he implemented some of
    the key features of DSL previously mentioned. Robert''s innovations brought about
    early procedures for installing DSL to a USB flash drive and adding MyDSL extensions
    to a running DSL system.


    Today, Damn Small Linux (www.dammsmall11linux.org) has a thriving community of
    supporters, active forums and mailing lists, and tens of interesting ways to use
    and customize it. This book provides you with an entry to all the possibilities
    of what Damn Small Linux can be for you.


