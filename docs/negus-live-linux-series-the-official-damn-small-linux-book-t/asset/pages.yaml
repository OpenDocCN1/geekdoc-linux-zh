    # DSL Installed on Windows 9x or DOS Partition


    Let’s say you have a Windows 9x or DOS system with modem or Internet access and
    you want to try DSL. You do not want to disturb your Windows installation. especially
    do not want to have to repartition your hard drive. To install DSL without affecting
    your current system, follow these steps:


    > NOTE

    Internet access is required for this section. Methods for system without Internet
    access will be discussed in the next section of this chapter.


    +   1. Boot the machine on which you want to install DSL into Windows or DOS.


