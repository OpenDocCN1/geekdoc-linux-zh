    # Partitioning the Disk


    Because I have enough room on the hard disk (and so I can disconnect the CD drive),
    I decided to install Damn Small Linux directly to the hard disk on the laptop.
    Before I could do that, however, I decided to partition the hard.


    In Chapter 9, "Performing a Traditional Hard Drive Install," there is a procedure
    for partitioning your hard disk to prepare it for a Damn Small Linux installation
    (type **install** from the boot prompt to start it, then type **12**). You can
    partition during the installation instead, but doing partitioning separately gives
    you a bit more flexibility.


    In my case, I created a 200MB swap partition (hda2) and assigned the rest (just
    2GB) to a Linux partition (hda1). Although the swap size is more than the general
    rule of double of RAM, because the laptop has a small amount of RAM (under 128MB),
    it''s good to add extra swap space.


    # Choosing an Install Type


    The installation type you choose depends somewhat on the amount of disk space
    and RAM you have. With a smaller amount of disk space, you can choose a Frugal
    install (which saves space by copying the compressed image to hard drive). I chose
    to do a regular hard drive install because my computer had a low amount of RAM.


    The traditional hard drive installation procedure (described in Chapter 9) uncompresses
    the files and copies them from the CD to the Linux hard disk partition. Then,
    the procedure lets you choose to install a bootloader (I chose Grub) to actually
    boot the installed DSL from hard.


    Another advantage of the hard drive installation procedure is that it steps through
    additional configuration for your installed DSL system. Type **no** when you are
    asked if you want to add multiple user accounts (saying **yes** would force you
    to enter a password, which you don''t want to do). You can also select to use
    an ext3 file'
