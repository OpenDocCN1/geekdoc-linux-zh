    # The Fluxbox Pager


    As mentioned earlier, the application in the lower-left corner is a Pager; more
    specifically, it is called Fluxter, a lightweight pager just to work with Fluxbox.
    Fluxter is configurable by editing the /home/dsl/fluxbox/fluxter.bb file to your
