    probably find this project difficult to do.


    The bottom line is that this project is for more advanced Linux do-it-yourself
    who have an old laptop to share. If that''s not, you might want to limit yourself
    to playing with some of the multimedia software described in this chapter.


    # SETTING PROJECT GOALS


    In its most basic form, a digital picture frame simply plays a bunch of digital
    images it is given, without needing any intervention, after it is booted up. The
    images are usually played as a slideshow, with the images changing automatically
    every few seconds.


    To make this project from basic digital picture frames, I want to expand the features
    in the following ways to make it more as a digital media frame:


    +   **Play different media types**—Allow it to play music, presentations, or videos,
    with digital image slideshows. So, for example, the frame could be set up to loop
    a video at a trade show or a real estate open house.


    +   **Make it easy to add content**—Set up ways to add any of the supported content
    types easily, using different types of network connections (wired or wireless),
    as well as removable media (such as a USB pen drive).


    Shopping for the software for the project is easy (it''s all on the CD that comes
    with this book). For me, getting the frame meant sending my wife Shree on a trip
    to'
