- img_proc: true
  md: '# The Official Damn Small Linux Book


    Sound difficult? Well, it is not. After you become familiar with the basics of
    DSL, from the boot options to the use of MyDSL extensions and some understanding
    of creating MyDSL extensions, creating a bootable CD-ROM is simple. The features
    just mentioned are discussed in Chapter 2, "Booting DSL," Chapter 5, and Chapter
    10, "Adding Applications and Creating Shareable Extensions."


    Here’s how....


    # Booting from the DSL CD-ROM


    For a remastered DSL CD, you can work from a booted DSL CD-ROM itself. Boot a
    Damn Small Linux CD, using any boot options that you would need to boot DSL. This
    process requires no specific boot options, so you would only add those required
    by your specific hardware. During theing process, you work from the booted CD
    and use components on that to create your remastered CD.


    One boot option you might want to add is the toram option. If you have enough
    RAM to run DSL entirely from RAM, entering toram here will let you eject the CD
    and insert a blank CD in the process, so you can immediately burn your newly remastered
    CD.


    # Mounting a Working Directory


    You most likely need to mount a Linux partition (probably from your hard disk)
    to hold system files, extensions, and the new image. Within that partition, you
    should make a directory to keep things organized. I suggest you make a directory
    called iso. The partition should be a Linux partition because you need to maintain
    Linux ownership, file, and directory permissions as you create the remastered
    CD.


    You should only use the ramdisk (for example, /home/ds1/iso) to store your extensions,
    data if you are making small additions and have plenty of RAM available. That’s
    because any remastering process will consume a lot of space. As stated earlier,
    some users use DVD-sized images. So, assuming you have space available on a hard
    disk partition, use the mount tool (lower right of the screen) to mount a disk
    partition (such as hda4) to hold your remastered software.


    You do not need to mount the drive containing your extensions. However, you can
    use the same drive that stores your extensions. But, again, I suggest that you
    make a separate directory. So, for example, to create an iso directory on the
    hda4 partition, first mount that partition, then type the following from a terminal
    window


    ```

    # mkdir /mnt/hda4/iso

    ```'
  merge: -1
