    - Line 8 copies the DSL standard boot floppy to replace the isolinux/directory
    of boot files.

    - Line 9 is the actual ISO creation. This combines the file in the master/directory
    and the boot.img into an ISO image file in the iso/ directory.

    - Line 12 through 16 check if the script was started with cd as an option. The
    script defaults to the CD-ROM burner device location 0,0,0. Using this option
    writes the new ISO image to a CD-R.

    - Line 18 creates an md5 checksum file for network transport and verification.

    - Line 20 verifies the consistency of the checksum.


    # Syslinux Initial Ramdisk


    To change the Syslinux version of the initial ramdisk, use the following procedure:


