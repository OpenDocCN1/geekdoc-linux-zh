    one into the drive.


    You can use the arrow key to repeat the copy command copy b:\chunk*, then press
    the Enter key to proceed with the copy.


    Repeat this process for all diskettes, which should be between 34 and 35 floppies.


    # NOTE


    While the copy process is running, you might see a message that says: “Error reading
    from drive B:...” If that happens, press a for abort. Write down this chunk number.


    Return to the source machine and do the following:


