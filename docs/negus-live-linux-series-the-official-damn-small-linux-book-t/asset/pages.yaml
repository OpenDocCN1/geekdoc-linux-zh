  md: '# 212 The Official Damn Small Linux Book


    After you see this mkdsl process, you may not need to read further. Because DSL
    is so small, using an additive method is quite appealing. However, there are times
    when you want to actually remove core DSL applications or change system internals.
    When this occurs, you need to do a full KNOPPIX-style remastering. Many books
    and documents can be found on the subject of remastering KNOPPIX. It is not the
    intent of this single chapter to duplicate such efforts. The intent of this chapter
    is to discuss areas that are specific to DSL.


    # MAKING YOUR FUGAL MyDSL INSTALLATION INTO A BOOTABLE CD-ROM


    The mkdsl procedure is done locally from a live, running, CD-ROM-booted DSL system.
    It is based on the MyDSL extension concept. This provides a quick simple way to
    make a custom DSL extension including all the additional applications and configurations
    that are known to work with the standard DSL system. This has several advantages
    over the full remastering process, as follows:


    +   - **Try before you**—You can download extensions and try them out before committing
    to the whole time-consuming cycle of making an ISO, burning, and testing it.

    - **Construction set**—By downloading in parts, you truly have a construction
    set method. This makes it easier for slow modems to be able to download and test
    in parts and over time.

    - **Privacy**—This is where the myconf.tar.gz comes into play. This is your “personal”
    and “private” configuration including passwords (if desired), or closed source
    drivers, and so on.

    - **Proven system**—You already have the base ISO and proved that it works on
    your system. You already have your local “proven” collection of extensions. Creating
    a mysdsl.iso is trivial when compared to full remastering.

    - **The sky’s limit**—Some users use the mkmyd script to create DVD-sized images.
    You are only limited by your creativity and hardware constraints.


    > NOTE

    The myconf.tar.gz is for your configurations that you will not be changing. Thus,
    filelist remains for backup. A typical myconf.tar.gz could have Firefox''s Flash
    plug-in, Sylphed email settings, network printer settings, and even several PPP
    settings and providers.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# CHAPTER 11 Setting Up a Full Remastering Environment


    By answering only two simple questions, you can have your mys1.iso created and
    ready to burn. If you have a burner, you can continue the script to burn to a
    CD-R.


    # Getting Started


    Let''s say that you have downloaded a nice, proven collection of extensions on
    your hard drive (say hda4). You know that your extension collection is stored
    in a level 1 mysd1 environment; these extensions all load upon boot. You have
    verified this by putting it all together on your target hardware platform.


    Figure 11-1 shows an example of MyDSL extensions being held in the mysd1 directory
    on a hard partition (/mnt/hda).


    ![](img/f6eecb623fe812080d8ad148db9eda3a_233_0.png)


    Now, you want to create a bootable CD-ROM with your collection of extensions.
    The CD should boot with no additional boot options and should contain the following
    applications:


    +   * AbiWord—Word processor

    * ALSA—Advanced Linux Sound System

    * Gimp—Image—processing application

    * GNU-Utils—The Busybox replacements for basic shell utilities

    * GNU Cash—Cash management program

    * Gnumeric—Spreadsheet

    * GTK2—The GTK2 library needed by GTK2 applications for proprietary Firefox plug-ins

    * Myplugins—A personal write for proprietary Firefox


    Upon boot, you want to have the Secure Shell Daemon (ssh), as well as the Filesystem
    in User Space (fuse) service. Your desktop should be Joe’s Window Manager (jwm)
    and the system clock set to the US Pacific time zone. Finally, you want the Flash
    plug-in for Firefox to be included. You want everything to work seamlessly and
    provide a hands-free boot.'
