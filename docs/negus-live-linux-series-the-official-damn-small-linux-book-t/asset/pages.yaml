  md: '# CHAPTER 3 Using DSL Applications


    # Terminal-Based Applications


    Damn Small Linux also has many terminal-based programs. Many new Linux users are
    intimidated by text-based applications, but find that some things are just easier
    to do in a terminal window. If you are new to Linux, do yourself a favor and give
    these applications a try. You may just realize that their simplicity is enjoyable.


    # ftp—A Basic Terminal-Based FTP Program


    The ftp utility is really easy to use. Many of the navigation and observation
    commands are the same as regular term functions. For instance, type **ls** to
    get a list of files available in a directory or **pwd** to get your working environment.
    If you get stuck, just type **help** for a list of commands. And if you need to
    find out what a command is, just type **help** (replacing **command** with the
    command name you are interested in).


    # index—Personal Database Management System


    Index is a minimal database management system. The author intended Index to be
    used by those who want to maintain databases of their own personal information.
    Index is easy to set up and use. Start it by typing the index command.


    By default, index begins with four empty databases available. There is a business
    phone database (bphone), a database for saving your CD collection (cdllist), a
    database of CDs that you want (cdwantlist), and a personal phone database (pphone).


    Type the name of the database you want to use. You can then use Index to add entries
    (a), find entries in the database (f), and read the database one entry at a time
    (r). When you are done, type **s** to save modifications, **q** to save and exit,
    or **x** to exit.


    # CDW CD Burning Application


    CDW is a friendly way to use cdrecord and mkiso with its ncurses-based GUI. Although
    it is easy to use if you are familiar with the commands, a user of CDW would reference
    the README to learn all the key functions. To start CDW, type the cdw command.


    Figure 3-9 shows an example of the CDW screen. We have the main README page available
    at http://dammsall11inux.org/cdw_README.txt.


    # Microcom Serial Terminal Emulator


    Microcom is a Minicom-like serial emulator with scripting support. Microcom is
    really tiny (14k) because it was written to fit into floppy-based Linux distributions.
    You can start Microcom by typing the microcom command. Find more information about
    Microcom from its home page:


    ```

    http://microcom.port5.com

    ```'
