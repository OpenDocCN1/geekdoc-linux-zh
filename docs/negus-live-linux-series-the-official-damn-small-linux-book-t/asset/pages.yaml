  md: '# CHAPTER 16


    # Setting Up an XAMPP

    Web Server in DSL


    Serving up content for most common web servers doesn''t require a very powerful
    computer. With Damn Small Linux’s (DSLs) small size and some prepackaged web server
    software, it''s possible to configure a powerful web server on a machine with
    as little as 64MB of RAM and about 120MB of disk space.


    XAMPP is a neat little that combines a powerful selection of open source software
    that can be used to create a professional-quality web service on most popular
    operating systems. The popular combination of Web server software often referred
    to as LAMPP (Linux, Apache, MySQL, PHP, and Perl) has the “L” replaced by an “X”
    to indicate that instead of just Linux, the project can run on OS X, Solaris,
    and all 32-bit Windows systems.


    XAMPP for Linux (www.apachefriends.org/en/xamp-linux.html) can be dropped into
    most Linux systems, including Damn Small Linux, and quickly figured to serve your
    web content. XAMPP includes the following software:


    +   * Apache—Serve the web content

    * MySQL—Database for organizing and storing data

    * PHP and PEAR—Scripting language support

    * Perl—Scripting language support

    * ProFTPD—FTP service for uploading content to the server

    * OpenSSL—To support encrypted communications with the server

    * Webal—Software for reporting activity (hits, pages viewed, and so on) of the
    server


    XAMPP also includes many smaller components, such as fonts, server modules, and
    libraries. All-in-all, there is a lot of software packed into a 50MB tarball.'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# 314 The Official Damn Small Linux Book


    The project described in this chapter starts with a basic DSL installation, then
    adds XAMPP and firewall software to create an easy-to-use web server, because
    of its size and efficient resource uses, can work on PCs with even very limited
    resources. Because XAMPP is delivered in a state that''s basically ready to run,
    and (and permanently saved) in less than an hour, using the instructions in this
    chapter.


    After you gathered all the pieces for your web server, you can save them permanently
    in many different ways (to hard disk, a remastered CD, and so on). This procedure
    should work well on almost any old PC you have lying around. When the procedure
    is finished, you will have saved a working web server, web content, and DSL operating
    system so that it is ready to run from any hard disk or a USB pen you can carry
    with you.


    # INSTALLING XAMPP


    Although there is no special My package for XAMPP, here is a case where you can
    download the software directly from the open source project and drop it into Damn
    Small Linux. XAMPP works particularly well for DSL in this way because it can
    be unpacked and used entirely the /opt directory. Here''s how to get and install
    XAMPP:


    +   1. Visit XAMPP for Linux—From the XAMPP for Linux page, you can download the
    entire XAMPP software tar. The page is located here:

    http://www.apachefriends.org/en/xampp-linux.html


    +   2. Select to download XAMPP—In most cases, select the first package listed
    for download: XAMPP Linux. For this example, the version is 1.6. If you already
    have XAMPP installed, you can select the Upgrade package. There is also a development
    package, in you want to compile the software yourself. Next, you are asked what
    to do with the following package:

    xampp-linux-1.6.tar.gz


    > NOTE


    Depending on the type of storage medium you want to use (hard disk USB pendrive,
    etc.), available RAM, and other factors, you may want to choose different ways
    of storing and restoring your XAMPP software. The “Saving Your XAMPP Server” section
    later in this chapter describes different ways you can save and restore your XAMPP
    server with DSL.'
