  md: '# Downloading Damn Small Linux


    If you are new to the concept of live CDs, it is possible a bootable CDROM. The
    first step is to find a local DSL download mirror. You can always check the latest
    list of available download sites by checking the Damn Small Linux website download
    section:


    http://www.damnsmallinux.org/download.html


    Using the Ibiblio as an example, navigate to the site''s current directory:

    ftp://ibiblio.pub/Linux/distributions/damnsmallinux/current


    Based on the previous discussion, select which version you want to download.

    The ISOLINUX version of DSL, which is what you want in most cases, is named dsl-??,
    where the ?? is replaced by the DSL version number.


    There are many ways to create a bootable CD and many operating systems to perform
    this task. You want to use a CD writing program with a burn image or write disk
    option.


    Many Linux systems have the k3b utility and cdrecord command to burn CDs. For
    Windows users, Nero and Roxio are popular commercial programs. Also available
    for Windows is freeware CD Burn XP Pro (http://cdburnerxp.se) and Infra Recorder
    (http://infarecorder.sourceforge.net) applications.


    # Getting to the Boot Prompt


    By trying to boot the DSL live CD. Neither the SYLINUS nor ISOLINUX versions get
    you to the boot screen, here are a few things you can try:


    +   - Make sure your CD burn didn''t fail. If you downloaded and burned your own
    CD, it is best to burn at a very low rate. I suggest slowing down the burn process
    to a speed of 4. Yes, even if you have a new 52X burner.


    +   - Some computers have difficulty booting from a CD-RW. It is best to use a
    CD-R.


    +   - If you have a live CD (such as KNOPPIX), try booting from that CD to see
    if your problem is specific to DSL.


    +   - Your computer''s BIOS may not be set to boot from CD. Immediately after
    the boot process starts, go to your computer''s BIOS settings (press F2, Del,
    or some other key, as instructed, to enter your BIOS). Check that the boot order
    includes booting from CD and make sure that the CD will boot before the hard disk
    in your boot order.'
