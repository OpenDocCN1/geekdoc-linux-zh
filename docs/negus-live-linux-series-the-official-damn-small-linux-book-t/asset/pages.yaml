    ```


    Windows recognizes your pen drive to be h:. If it is a different letter, use that
    one.


    The version of Syslinux used in DSL does not work with very large pen drives.
    It does function with drives that are 1Gig and smaller. If you have an extra large
    drive, you may download a later version of Syslinux, which is compatible with
