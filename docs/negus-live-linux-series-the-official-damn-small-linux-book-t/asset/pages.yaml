  md: '# CHAPTER 4 Configuring and Saving DSL Settings


    Once you have your .webdata.1st file set up as you would like, use the following
    procedure to perform the Webdata backup:


    +   1. From the main menu, select System, Webdata Backup/Restore. The window shown
    in Figure 4-29 appears.


    ![](img/f6eecb623fe812080d8ad148db9eda3a_117_0.png)


    FIGURE 4-29 Choose a location on the web for backing up your data.


    +   2. In the Webdata Backup/Restore window, enter the following information:

    * FTP—Enter the host address (hostname or IP address) of your ISP’s FTP server.

    * Login—Enter your ftp login name needed to read/write access to this FTP server.

    * Password—Enter your ftp password for the user login.

    * Datakey—Enter a password to be used to access the encrypted data.

    Type any password you like, but be sure to remember it. You will need it later
    to restore your backup.


    +   3. Select Backup. The program displays the ftp connection messages. If everything
    works properly, a.data file will be copied to the home directory for the user
    account you used to access the FTP server. If something fails, it should indicate
    if you typed the wrong host name, user name, or address, or if the server is otherwise
    not available.


    +   4. To restore the data, simply run this GUI program again and select Restore.
    You should be able to access your data the next time you boot DSL from any machine
    that has an Internet connection.

    Be sure that you know your encrypted password; otherwise, no one is going to be
    able to help you. Of course, the upside to that is that no intruder who gains
    access to the FTP server will be able to access your backed-up data without knowing
    that password.


    The .netrc file is automatically created in /home/ds1 when running the webdata
    script and then is destroyed upon completion. This is for security reasons and'
  merge: -1
  pgno: 117
- img_proc: true
  md: 'also not to interfere with the use of the ftp GUI program that you may need
    for other servers or uses.


    I don''t think it would make sense to back up the entire home/dsl as the purpose
    is to allow you to move from machine to machine and have access to the data that
    would be machine independent. The main point is to have your data available from
    anywhere that you can connect to the web.


    But as always, you have the flexibility to do whatever you want or need to do.


    # SUMMARY


    Having the tools to set up your Damn Small Linux desktop the way you want it is
    important to making DSL a fun system to work with. Being able to save the files
    and settings you accumulate as you use Damn Small Linux is critical to making
    DSL more valuable from one reboot to the next.


    DSL offers tremendous flexibility in choosing which files and directories to backup,
    as well as where you want those backups to go.


    Once you know how to do a basic backup, this chapter describes ways in which you
    might want to configure and customize your desktop. Configurations include different
    ways of setting up network connections, using dial-up, wireless or wired LANs.
    It also includes procedures for configuring a printer. Customizations include
    ways of setting your background, arranging icons, and choosing screen resolutions.


    To make your Damn Small Linux system more mobile, this chapter describes how to
    backup your data to an FTP server on the web. Later, you can restore your data
    (such as web bookmarks, mail folders, and editor settings) from any computer from
    which you can boot DSL and gain access to the web.'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# Extending Applications

    with MyDSL


    This chapter covers the what, why, and when of the process of adding applications
    to Damn Small Linux (DSL) live CDs. We call this process the MyDSL system. The
    additional applications are called extensions.


    These extensions can be added to automate your system in many ways. I''ll describe
    how to use the MyDSL system from the simplest GUI, which steps you through the
    process, to the usual downloading via a web browser, and finally how to download
    and install from the command line.


    After you have extension, you most likely want to save it for future use. I will
    discuss how these extensions should be saved and the use of a persistent store.
    Discussions include how to automate a hands-free boot with your favorite application
    extensions loaded and ready to use, as well as the tradeoff of hands-free and
    boot time speed. The last section of this chapter contains a discussion of some
    common setup and usage errors.


    # INTRODUCING MyDSL


    To expand beyond the software that comes on the standard 50MB DSL live CD, we
    created the MyDSL system. MyDSL has become one of the most successful features
    of DSL. You can use the MyDSL system to add software extensions to your running
    DSL system, save extensions for later use, and create your own extensions.


    # Overcoming Shortcomings of Hard Drive Installations


    If you have participated in Damn Small Linux forums in the past (http://damnsmallinux.org/cgi-bin/forums/ikinboard.cgi),
    you may remember the'
  merge: -1
  pgno: 119
- img_proc: true
  md: 'advantage posts from the forums. These posts discussed how live CD users were
    always at a disadvantage when it comes to selection of applications. The typical
    live CD contains the selection of applications that the distribution maintainers,
    such as John and I, I have selected. Their choices may not be your choices.


    At the time, it was not possible to add applications to live CD systems. There,
    most live CD offerings were huge with many applications that could be packed into
    a CD. Users wanting to install additional software hard drive installs were the
    way to go. Besides, that was the way it always done: Get a CD and install it to
    your hard drive. After a system is installed, the Debian Apt system is an excellent
    tool for adding applications.


    Is it possible for a 50MB distribution to compete? During these early days, DSL
    had many who copied DSL and remastered it, only to offer a few more applications
    and add a few more MB. Some of the remasters would wholesale copy every new feature
    that was created for DSL. My thoughts turned to wanting to offer something different.
    I wanted something that compete with the slightly larger remasters.


    I did not want to be bigger. I did not want to abandon us on smaller hardware,
    but I also wanted to offer the advantage to live CD users that it seemed only
    hard drive installed users had. My solution was to be able to easily add software
    without the complex remastering process. To allow users to create any sized ISO
    they wanted. This would allow DSL to compete with the slightly larger distributions.
    DSL would become variable sized.


    # The Birth of MyDSL


    With the accumulated experience of the previous milestones, I set out to create
    the MyDSL system. I had to keep in mind the less capable hardware that DSL had
    built its reputation on. I began by leveraging John''s breakthrough techniques
    of down-scripts, along with my writable /opt for shared processes. As proof of
    concept, I adapted and packaged the OpenOffice.org office suite as the first MyDSL
    application under the name openoffice.


    I created openoffice as a simple zipped tarball and dropped it into /opt. I then
    created boot time options to load the software from that package back into /opt.
    That way, the package didn''t have to be included in the base DSL system. It also
    meant the package wouldn''t have to be included in the backup/restore process,
    which would have been a huge burden to bear every time DSL shut down. I added
    a separate software package (oo-user.tar.gz) to hold the icon and menu items specifically
    for DSL as a live CD and for the default ds1. This was going to work!'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# CHAPTER 5 Extending Applications with MySDL


    I tried adapting other applications to include in the MySDL system. Some apps
    would need a smaller script to force the library and bin paths to be /opt. Still
    more features were needed to make other apps work. I had seen a DSL user''s script
    that made more of the file system writable to make the Opera browser work in DSL.
    I emailed him and asked for permission to use some of his script. Opera was never
    included in DSL because it is sponsored. I broke off the parts that I wanted and
    modified them to what I had in my mind.


    Using the features I described, I could offer a tiered approach to boot time modules.
    At about the same time, I became fascinated with mountable applications. I formatted
    these applications as compressed images (adding a .ci to those files). I quickly
    changed openoffice to openness.ci. This would really help in reducing systems
    resources as the application was mounted, so it could be used from mount point,
    instead of being copied into memory. Later, I combined the ci file and its associated
    user file into a single file (with a .uci suffix).


    Finally, I put together six example modules. They are called extensions. I also
    made a simple script to quickly and easily create a custom myds1.iso and burn
    it to CD. That script and other remastering are covered in Chapter 11, "Setting
    Up a Full Remastering Environment."


    Being able to combine a DSL live CD with multiple extensions overcomes deficiencies
    that live CD users face that might otherwise push them toward hard drives. DSL
    emerges as a very flexible, any-sized distribution with MySDL.


    # Loading Extensions Dynamically


    After the release of sample MySDL extensions and the mkyds1 custom CD maker, the
    most requested feature was to load the extensions without requiring the user to
    make a CD.


    John and I were a little hesitant at first. We were concerned about bandwidth.
    If users became lazy, they would just download the extensions every time. So,
    I made a boot option to specify a persistent store for the extensions. This was
    to be specified by myds1=sdx, where hdx would be replaced by the name of the hard
    disk partition on which the extensions would be stored (such as hda1 for the first
    partition of the first IDE disk).


    I added the code for dynamic loading. A GUI front to the MySDL system was created.
    Today, DSL even offers more extension thanks to unionifs, others is a special
    file system type that allows users to add or change files anywhere in the file
    system, instead of just the /opt/home/ds1 directories. With unionifs, the DSL
    file system are stored in a special directory (usually in RAM) named /ramdisk
    that is overlaid on the entire file system.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# Exploring the MyDSL Software Bazaar


    The MyDSL system has become a huge success. MyDSL offers four extension types.
    Two of them are mountable. Because the MyDSL extensions are mounted, instead of
    being loaded into RAM, even users with low-memory systems can enjoy the advantage
    of using these extensions.


    The process of creating MyDSL extensions was made public so that the community
    of DSL users could join in the fun and feeling of ownership by sharing the packages
    they create. In fact, this was also a design goal. John and I would stay focused
    on the core DSL, only creating and providing infrastructure that the community
    would need.


    Many members of the DSL user community have contributed many software titles as
    MyDSL extensions. These applications are usually repackaged from Debian packages,
    but can also be compiled from sources. Details of this building process are covered
    in Chapter 10, "Adding Applications and Creating Shareable Extensions."


    For the user of the MyDSL system, it is an easy graphical click-and-load method
    of installation. In fact, find it easier to add software using MyDSL than many
    other package management systems.


    Although hard drive installed systems may use the features of MyDSL, there is
    no uninstall feature. Having no uninstall feature is a problem when you run DSL
    from a live CD because you can remove the extension from the pen drive or hard
    disk where the extension is stored. The next time you reboot, the extension will
    be gone. For a hard drive install, there is no easy way to remove extensions after
    they''re installed.


    > NOTE Hard-drive-installed systems should continue to use the full Debian package
    management system for adding and deleting software. MyDSL is designed for live
    CD and emulations thereof.


    From this point, all of my discussion is from the point of view of running a live
    CD or emulation to work with the MyDSL system. I will start with the most automatic
    and therefore recommended way. Because the MyDSL extensions are hosted on various
    mirrors on the Internet, you must have a working Internet connection.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Using Desktop Icon for Easy Point-and-Click Access


    On the standard DSL desktop, you will see the MyDSL icon. That icon is your entry
    point to adding software that is packaged for the MyDSL system.


    # Using the Desktop Icon


    Click the MyDSL desktop icon to access the graphical user interface of the MyDSL
    system. Figure 5-1 shows an example of that icon.


    ![](img/f6eecb623fe812080d8ad148db9eda3a_123_0.png)


    Occasionally, you may see the Extension tool with a blank screen, rather than
    displaying available extensions. The cause of this could be that you are not connected
    to the Internet. If you have a working Internet connection, it is most likely
    the configured MyDSL download mirror cannot be accessed. If this is the case,
    you can access the DSL panel to select a different server to use. The “Changing
    Download Repository Mirrors” discussed in this chapter.


    # Displaying the Extension Tool


    If DSL can connect to a working repository, the MyDSL Extension tool displays
    all the software categories available from the online repository. Categories include
    the testing area, as well as a browser for loading extensions stored on a local
    disk. Figure 5-2 shows an example of the MyDSL Extension tool.


    FIGURE 5-2 Display available software categories from the Extension tool window.

    | Apps | Multimedia | Themes |

    | --- | --- | --- (no, wait, let me re-read) |

    | Apps | Multimedia | Themes |

    | --- | --- | --- |

    | Games | Net | UCI |

    | UNC | Gtk2 | System |

    | WM_Apps | Testing | Load Local |


    The following is a list of categories that appear in the MyDSL Extension tool
    window:


    +   - **Apps**—General category of applications.

    - **Multimedia**—Applications for audio and video playback and editing.

    - **Themes**—Packages to customize the look and feel of your desktop.

    - **Games**—Yes, you can play games on Linux...

    - **Net**—Anything related to networking and the web.'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# The Official Damn Small Linux Book


    +   - UCI—General category of self-contained mountable applications.


    +   - UNC—General category of Unionfs mountable applications.


    +   - Gtk2—Applications that require the Gtk2 runtime.


    +   - System—Tools and utilities for managing, tweaking, and monitoring the system.


    +   - WM_Apps—Alternative window managers and tools specific to window managers.


    +   - Testing—General category of newly created extensions (use caution).


    +   - Load Local—Opens a typical file browser to extensions saved on your drives.


    > NOTE


    The testing area includes newly submitted packages from the DSL community. These
    packages should be considered experimental and need testing and feedback before
    they are moved into the regular area. Use with extreme caution.


    In addition to these 12 categories for extension classification, there are four
    extension types:


    +   - tar.gz is the simplest type. It must install to the only native writeable
    area for DSL. This means it must unpack to /opt and therefore must be self-contained.


    +   - .ds1 is also based on the use of the tar command. However, this extension
    causes much of the file system to become writeable.


    > NOTE


    In earlier DSL versions (legacy boot), only /home, /opt, and /tmp directories
    were writable. Most of the remaining file system was mounted read-only. Because
    the .ds1 extension types are simply extracted to the root of the file system,
    much more of the file system potentially has to be writeable for those installs
    to work. Therefore, installing a .ds1 extension causes a check that the system
    script mkwriteable has been run to make the whole file system writeable.'
  merge: -1
  pgno: 124
- img_proc: true
  md: '■ .uci type extensions are compressed loop images that are self-contained and
    mount under the /opt directory. All tar.gz extensions can easily be made into
    a uci type.


    ■ .unc represents our latest extension type. Extensions of this type can only
    be used on later versions of DSL that support the unionfs system. These extensions
    are compressed cloops that mounts into the base file system.


    Don''t worry about fully understanding these extension types. Only know that both
    UCI and UNC are the preferred types. Both of these are mounted and therefore use
    considerably less resources than the other two. Because these extension types
    are mounted, you can return your system to a pristine state by simply unmounting
    the extensions or rebooting. This is true no matter what type of the many installations
    DSL offers is being used. You can save even more /ramdisk space by storing your
    UCI and UNC extensions on your hard or pen drive.


    The tar.gz and .ds1 should only used if no other version of the extension is currently
    available and your system has the resources to support them. Because the tar.gz
    and .ds1 copy all files from the extension file to separate locations in the file
    system, a low memory system can quickly run out of space in /ramdisk, as well
    as out of inodes (one is consumed for each file and directory).


    Now, let us continue with the normal procedure to use and enjoy the MyDSL system.


    # Choosing and Getting Extensions


    When you click one of the extension categories, an extension browser opens and
    displays a list of all available MyDSL packages in that category. For example,
    click the UCI category to see the list of UCI extensions shown in Figure 5-3.


