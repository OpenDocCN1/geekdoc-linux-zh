  md: '# CHAPTER 9 Performing a Traditional Hard Drive Install


    There is a lot of useful information in the top section of the image:


    +   - Disk Drive: The disk drive you are viewing/editing, shown here as /dev/hda.


    +   - Size: The size of the drive, which is about 3200MB in this case.


    +   - Heads/Sectors per Track/Cylinders: The geometry of the drive shows the number
    of heads, sectors per track, and cylinders on the hard drive.


    You will want to reference the size of the drive as you set up your partitions.
    You will be splitting the drive into a Linux partition, which will house DSL and
    a smaller Linux swap partition, which uses Linux similar to the way that Windows
    uses a swap file.


    You are going to put the boot partition first in this example. However, you need
    to reserve a space for the swap partition, so you are subtract out the size of
    the drive. The demonstration computer has 256MB of RAM, and you want to give this
    computer a swap partition, which is double that size.


    You need to do some math:


    3200MB Total Drive Space

    - 512MB The desired swap partition size


    2,688MB The size of the boot partition


    Now you have your number: 2688MB for your boot partition. Before you make it,
    you need to delete the existing partition.


    Cfdisk is pretty simple to use; move the focus around, you simply use the arrow
    keys on your keyboard. The first step is to navigate to the Delete tab and press
    Enter. This removes the existing partition. If you have more than one preexisting
    partition, remove them all.


    After you have nothing remaining but free space, navigate to the New button and
    press Enter. Next, it asks if this should be a Primary or Logical partition; select
    Primary and press Enter.


    The next dialog asks for size. At this point, enter the amount you figured out
    for the boot partition (in our earlier example, it was 2688), then press Enter.
    Cfdisk asks if you want the partition to be at the beginning or end of the drive.
    For simplicity, choose the beginning. Now, you want to flag the Boot, so navigate
    to the Bootable button and press Enter. You also need to be sure that the partition
    is assigned the right file system type. To do that, navigate to the Type button,
    Enter, and then select #83. That designates this partition as a Linux partition.'
