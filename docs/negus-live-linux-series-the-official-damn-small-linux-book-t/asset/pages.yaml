- img_proc: true
  md: '# The Official Damn Small Linux Book


    To use your backup/restore files from your pen drive, type the following:


    ```

    dsl restore=sdal

    ```


    To access the image on your pen drive, type the following:


    ```

    dsl frhmd=/dev/sdal

    ```


    If your CD and pen drive both have the same version of DSL on them, there is no
    real need to issue the command frhmd=/dev/sda; however, you might want to do this
    if the version of DSL on your CD is older than your pen drive. By using the frhmd
    command, you do not have to burn a new CD every time there is a new release of
    DSL.


    You also combine all commands to access the pen drive in virtually the same way
    as a new boot from the pen drive by using all three commands at the boot prompt:


    ```

    dsl frhmd=sdal mydsl=sdal restore=sdal

    ```


    There are lots of hybrid possibilities when you are traveling with DSL. It is
    possible to mix and match; for instance, you can choose to use your backup/restore
    from your pen drive and access MyDSL extensions from your hard drive, or even
    pull down an encrypted restore file from an FTP server. To read further on these
    powerful and useful options, consult Chapter 5, "Extending Applications with MyDSL,
    and Chapter 4, "Configuring and Saving DSL Settings,"" for backup and restore
    options.


    # After Install: Setting Default Backup/Restore and MyDSL Partitions


    Before V3.3 of DSL, the backup/restore partition and MyDSL location in the syslinux.cfg
    were coded and referenced by the install scripts while booting. Over time, it
    has become clear that systems register a USB storage device differently. There
    are even occasions when a system "sees" the device in one location during the
    installation process, and later sees it as a different device while in the booting
    process. So, steps have been taken to make both types of pen drive installations
    device independent. The boot process probes available devices for the backup file
    and mydsl directory. The backup/restore process is now transparent to the end
    user; however, you need to select your device for initial mydsl extensions once
    before automatic boot process detection auto saving works.'
