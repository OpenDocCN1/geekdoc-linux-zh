  md: '# The Official Damn Small Linux Book


    ![](img/f6eecb623fe812080d8ad148db9eda3a_72_0.png)


    What is a very versatile 50MB mini desktop-oriented Linux distribution?

    Damn Small is small enough and smart enough to do the following:

    * From a business card CD as a live linux distribution (LiveCD)

    * From an old CD

    * From within a host operating system (that''s right, it can run "inside")

    * Run nearly from an IDE Compact Flash drive via a method we call "fragual install"

    * Transform into a Debian OS with a traditional hard drive

    * Run fully in RAM with as little as 128MB (you will be amazed at how fast your
    computer)

    * Modularly grow - highly without the need to customize

    DSL was originally developed as an experiment to see how many unstable desktop
    environments could be run on DSL. But over time Damn Small Linux grew into a community
    project with hundreds of contributors. It is now a very stable and versatile Linux
    backup and restore local installation system which can be booted from any writable
    media including a hard drive, a floppy drive, or a USB device.

    DSL has a nearly complete desktop, and every command line tool, all applications
    are shown with the best of functionality, size and speed, Damn Small also has
    you


    **FIGURE 3-3** Fluxbox uses tabs to keep multiple windows within a single window
    frame.


    To use tabs, you need a three-button mouse, or a two-button mouse with three-button
    emulation. You will notice that all windowed applications have a small tab at
    the lower left of the windows trim.


    For your first attempt at using tabs, let''s launch two applications. For this
    demonstration, we will use applications that have a light contrast: Atom and Dillo.
    Click the Atom icon (upper-left icon) and the Dillo icon (upper-right icon) to
    open each. Now, take your mouse arrow and hover it over the Atom tab (it says
    Bash). Click and hold your middle mouse button.


    Now, while holding the middle mouse button down, move your mouse so that it is
    in the second window. You should see a small rectangle move with the mouse. Drag
    that rectangle to the middle of Dillo and unlock the middle mouse button. Now
    you see Atom taking the shape and location of Dillo. Dillo and Atom are sharing
    the same space and winding.


    Do you notice that in the lower left of the windowing decor, there are now two
    tabs? You can change which application is displayed by left-clicking its corresponding
    tab. If you are using a wheel mouse, you can bring the mouse to the top window
    dressing and spin the wheel up and down to rotate through the applications. The
    active application will show in bold font.'
