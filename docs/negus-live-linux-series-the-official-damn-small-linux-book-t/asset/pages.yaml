  md: '# The Official Damn Small Linux Book


    It is worth noting that sometimes it is desirable to manually enter the Ndiswrapper
    commands and test the results of each step. To do so, you must open a Superuser
    terminal window. From the Atern icon, right-click to select Aterm Super User to
    open this terminal window. Following are the manual steps:


    ```

    # ndiswrapper -i NET880.INF

    # ndiswrapper -l

    # modprobe ndiswrapper

    # iwconfig

    ```


    Those are the minimal manual commands to see if the Ndiswrapper and two Windows
    drivers can access your card. If the result of the iwconfig command displays a
    wlan0, you know that you may proceed to configure the card with the GUI.


