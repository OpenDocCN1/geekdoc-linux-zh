  md: '# Setting Up a Full Remastering Environment


    With many live CD-ROM-based systems, adding extra software packages typically
    requires a remaster. In Chapter 5, “Extending Applications with MyDSL,” you saw
    how easy it is to add dozens of extra applications called MyDSL extensions. Just
    copy them to boot media or place them on persistent storage (a hard drive partition,
    a pen drive, or compact flash); without requiring any extra boot options, the
    whole system boots and appears much larger and customized to your particular needs.


    However, there will always be the desire to make a single bootable CD-ROM work
    just like your Damn Small Linux (DSL) system does. You can''t always take your
    persistent media with you, DSL offers two ways to accomplish this.


    By just the normal procedure of booting from the live DSL CD-ROM and having all
    your MyDSL extensions loaded at boot, DSL can make an extra combined image myds1.iso;
    this process is called MakeMyDSL(mydsl1). This process is additive. It is the
    combining of all your chosen MyDSL selections and other nonchanging data into
    a new self-contained, bootable CD-ROM image.


    This is an extremely easy procedure. In fact, it is additive. You can customize
    DSL with extra MyDSL applications, change the default desktop and wallpaper, and
    then help spread the Linux Revolution to your friends and relatives. You can create
    custom appliances. Normally, I advise to include include and nonlocal environment-specific
    items. After all, you still want myds1.iso to enjoy the same namadic boot capabilities
    as the original DSL.


    Yet, there are times when you want to include machine or network environment features.
    For example, a classroom might share a common printer, or possibly other common
    hardware device. If you can configure it within DSL and/or MyDSL, you can easily
    create a custom myds1.iso bootable CD-ROM.'
