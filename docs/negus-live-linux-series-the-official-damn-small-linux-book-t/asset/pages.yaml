  md: '# The Official Damn Small Linux Book


    Linux embedded, this may be a great way to achieve your goal. A large download
    VMPlayer is easy to install and use.


    # Running VMPlayer with Damn Small Linux


    Your first step is to download the latest version of VMPlayer. At the time of
    writing, VMware had posted 1.0.3 as the latest version.


    The following is the URL for downloading VMPlayer:


    ```

    http://www.vmware.com/download/player/

    ```


    VMware says that VMPlayer needs a processor of at least 400MHz, a minimum of 128MB
    of RAM, and 150MB of free space for installation.


    The installation process is straightforward: download and run the auto-installer.
    There are a few “extras” that you may or may not want installed, but they are
    easy to disable. After you download and install VMPlayer, you are ready to run
    any virtual appliance listed at the VMware site, including several operating systems.


    There is an extensive list of virtual appliances at


    ```

    http://www.vmware.com/vmtn/appliances/directory/

    ```


    We provide DSL prepackaged to run with VMPlayer. You can download it from http://distro.ibiblio.org/pub/linux/distributions/damnsmall/current/


    Note that for running DSL with VMPlayer, you want to choose the download that
    ends with .vmx.zip. The file will look like ds1-[version number]-vmx.zip. After
    downloading the zip file, all you need to unzip the file and save the contents
    locally (You may want to make a vmplayer folder and save the content for your
    desktop for access.).


    The contents of our bundled file are just two: the DSL image and a configuration
    file. If you have already installed VMPlayer, your system will already recognize
    ds1.vmx as a VMPlayer configuration file. All you should need to do at this point
    is double-click the ds1.vmx icon.


    After VMPlayer is running, you should notice some service buttons at the top of
    the VMPlayer screen. These buttons allow you to toggle on and off services available
    on the host computer, such as Ethernet access, audio, CD drive access, and access
    to USB devices.'
