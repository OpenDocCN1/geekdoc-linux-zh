  md: '# CHAPTER 2 Booting DSL


    # # Help at the Boot screen


    When the DSL boot screen is displayed, you should be familiar with the boot prompt
    in the lower-left corner. This is where you can press Enter, wait a few seconds,
    or press F2 or F3 for the help screens.


    The help screen is a summary of the boot prompt options. Press F2 or any other
    key cancels the timer so DSL does not automatically boot; this way, you have plenty
    of time to peruse all of the displayed options.


    Figure 2-3 shows the screen that appears by pressing F2 at the boot prompt.


