  md: '# FRUGAL—The MOST POPULAR WAY TO INSTALL DSL


    The DSL boot option of install provides easy access to Frugal installation for
    those who can boot from CD. The Frugal installation available from this menu is
    for Linux file systems. You must have a prepared Linux partition to use the Frugal
    installation options from this menu.


    Notice that DSL offers two versions of Frugal installations. Menu option 4 uses
    the popular GRUB boot loader (www.gnu.org/software/grub) in the master boot record.
    Menu option 5 uses LILO boot loader (http://freshmeat.net/projects/lilo) installed
    into a partition on the computer''s hard disk. A boot loader is a program that
    is installed on the boot medium (hard disk, CD, or other bootable medium) and
    used to identify the operating system to boot and provide an opportunity to add
    boot options. Early Linux systems used the LILO boot loader, while most recent
    Linux systems most use GRUB.


    Let''s begin by stepping through the Frugal installation process and finish up
    by discussing how to change boot options after an installation.


    ![](img/f6eecb623fe812080d8ad148db9eda3a_174_0.png)


    > You must have prepared your Linux and Linux swap partitions before you begin
    either Frugal installation scripts. DSL provides two tools to perform this task.
    Both fdisk and cfdisk are available. The procedure in the section that follows
    describes how to partition your disk with cfdisk.


    # Partitioning with Cfdisk


    If your disk is already set up with Linux and Linux swap, you may skip this step.
    I am going to briefly discuss a very setup using cfdisk to partition the entire
    disk for use. To begin, select option 12 from the DSL Install Options (see Figure
    3-1). You are prompted to enter the target drive. The default is hda. Recall that
    in Linux the first hard drive device is a, the second drive is b, and so on.


    To navigate this program, use the up and down arrows to select a partition or
    free space. Use the Tab key to choose an action displayed at the bottom of the
    screen.'
  merge: -1
