    At the time of this writing, version Qemu-1.3.0pre11-install.exe was available.
    After downloading and installing KQEMU, you need to run the following:


    net start kqemu


    Either type it into the run prompt or open a command prompt and type the command
    there. Figure 7-2 shows an example of KQemu being enabled from the Run utility.


    # FIGURE 7-2 Enter net start kqemu into the Run utility.


