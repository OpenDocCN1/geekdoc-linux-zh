  md: '# CHAPTER 16 Setting Up an XAMPP Server in DSL


    boot: dsl nodchcp opt=hda2 myds1=hda2/myds1


    Using the persistent /opt directory in this way saves the time used to back up
    your XAMPP files.


    Refer to Chapters 6 through 9 for information on other ways of installing and
    configuring DSL that may best suit your XAMPP configuration and the type of equipment
    you are using.


    # RESTARTING YOUR XAMPP SERVER


    Depending on where you put your XAMPP software, you need to enter different options
    to the boot prompt to have DSL find, restore, and boot up the proper software.
    The following sections describe how to restart your XAMPP server, depending on
    whether you stored the software on a USB flash drive or hard disk, as described
    earlier.


    # Restarting from a USB Flash Drive


    To restart the XAMPP server you just installed on your USB flash drive, simply
    insert the USB flash drive into a USB port on your PC and reboot. If your PC skips
    the USB drive and tries to boot from hard disk or another device, you may need
    to change the BIOS settings to boot USB devices.


    When you see the boot prompt, identify the location of your backup archive and
    MyDSL packages as follows:


    ```

    boot: dsl myds1=sda1/myds1 restore=sda secure

    ```


    The first option to dsl (myd1) restores your saved MyDSL applications, whereas
    the second option (restore) restores your backed up to the DSL file system. The
    next time you reboot DSL, remember that any subsequent changes you make to the
    backed up files (such as those in /home/dsl1 and /opt/xampp) will be backed up
    again.


    I threw in the secure option, so that you can be prompted for passwords to your
    server from breakins. If you are using a static IP address, you can tell DSL not
    to start a network connection using DHCP by adding nodchcp to the boot prompt.


    # Restarting from the Hard Drive


    If you installed your backup archive and MyDSL packages to hard disk (as described
    in the “Other Ways of Storing Your Web Server” sidebar), with a static IP address,
    you could simply boot a DSL live CD and type this at the boot prompt:'
  merge: -1
  pgno: 355
- img_proc: true
  md: '# 336 The Official Damn Small Linux Book


    boot: dsl nodhcp myds1-hdal=myd1 restore-hdal secure


    Another way of rebooting DSL to include software stored on your hard disk (also
    from descriptions in the sidebar) is if you create a persistent /opt directory
    on a hard partition. For example, if your persistent /opt directory is on the
    second partition of your first IDE hard drive, you could boot DSL as follows:


    boot: dsl nodhcp myds1-hdal=myd1 opt=hda2 secure


    If you have a large amount of RAM on your computer, you might also consider adding
    the toram option to the boot prompt. This helps make your slick XAMPP server blazing
    fast.


    # BACK UP YOUR XAMPP SERVER


    The XAMPP service offers a feature that lets you securely back up XAMPP databases,
    configuration files, log, and content (htdocs) files. To do this, you run the
    lammpp command with the backup option as follows:


    ```

    # /opt/lampp/lampp backup mysecretpwd

    Backing up databases...

    Backing up configuration, log, and htdocs files...

    Calculating checksums...

    Building final backup file...

    Backup finished.

    ```


    Take care of /opt/lampp/xampp-backup-12-02-07.sh is copied to the /opt/lampp/backup
    directory, from which you can copy it to a backup medium. The password (shown
    here as mysecretpwd) is the root password for your MySQL server.


    If at any point your data becomes corrupted or destroyed, you can restore the
    backup archive by running it as a shell script. For example, with the preceding
    example, you could type the following:


    ```

    # sh /opt/lampp/xampp-backup-22-01-04.sh mysecretpwd

    Checking integrity of files...

    Restoring configuration, log and htdocs files...

    Checking versions...

    Installed: XAMPP 1.6

    Backup from: XAMPP 1.6

    Restoring MySQL databases...

    Restoring MySQL user databases...

    Backup complete. Have fun!

    ```


    You may need to restart XAMPP to complete the restore.'
  merge: -1
