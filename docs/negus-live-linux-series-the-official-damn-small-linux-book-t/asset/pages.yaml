  md: '# The Official Damn Small Linux Book


    **Robert:** I certainly have not had a roadmap. Things progressed in an evolutionary
    way: from adding a flexible backup/restore system to needing a write-enabled /opt
    directory to add more programs. Later, we created self-contained compressed applications,
    originally called .ci extensions, later named UCI. My goal was to honor John''s
    original goal of keeping the distribution at under 50MB.


    Many would restart DSL only to add or change an application. So, my thoughts were
    focused on how to allow easy yet flexible additional applications to be added
    to DSL. These additional applications I called MyDSL extensions. Originally, they
    were tarballs and UCI They would either load into the RAM disk under /opt or mount
    over /opt. Some of the user community really wanted to use Debian on the DSL CD.
    This led to a script to make of the filesystem write-enabled, which led to the
    .dsl extension. This is basically a tarball, but the unique extension would trigger
    the script to set up all the symlinks needed.


    Recently, I added the capability to use mountable compressed overlay images. These
    new overlays do not need to be self-contained, yet they have the same advantage
    in low system use as the UCI I try to keep DSL updated with newer technology,
    while at the same time, keeping the distribution under 50MB and also acknowledging
    and fully supporting the smaller, order, less capable hardware.


    We are constantly looking for the best of breed, small is beautiful applications
    and utilities—for example, Lua. We heavily use Lua and Luatk and create many of
    our own GUIs. We are not only a small distro; we run well on small resources.


    # **What draws people to DSL?**


    **John:** DSL bucks the trend of ever-increasing bloat and the ever-increasing
    demands on hardware. People who use DSL are not eye candy for candy''s sake. They
    want their computer to work and be reliable. The fact that DSL runs from an ISO
    image and is inherently durable also makes it appealing, DSL is very hard to break
    and easy to fix. Of course, there is the modularity and portability aspects,


    If you want an application, you can grab it. If you want to take your desktop
    on the road, it is very easy to do via USB pen drive, or live CD and remote backups.
    DSL small but functional base also makes a great platform to build on custom applications.
    DSL is a Linux desktop without the 500 pounds of Styrofoam padding.


    **Robert:** DSL is a small distribution and one that runs very well on very small
    resources. It is extremely flexible in offering many choices of configuration
    and expandability. After you read the chapters that follow, you will begin to
    realize the potential.'
