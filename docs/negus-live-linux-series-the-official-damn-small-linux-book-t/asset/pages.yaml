  md: '# SAVING YOUR SETTINGS ON THE WEB


    DSL has always had the goal of being a nomadic desktop operating system. You have
    seen the configuration and restore procedure of many custom tools. Sometimes,
    these tools and their settings are specific-specific hardware. Some of your saved
    configurations apply everywhere. Perhaps you would like to save these generic
    machine settings to the web, so you can restore them from anywhere where you have
    access.


    We refer to the procedure for saving DSL settings so you can restore them later
    over the web as a Webdata backup. To use the Webdata backup feature, you must
    have a prefetching and fully functional FTP account.


    Begin setting up your own Webdata backup by looking at the .webdata.1st file (/home/ds1/.webdata.1st).
    The .webdata.1st file is very similar to .filetool.1st, just you use your choice
    of text editor to add or remove lines from file to back up to the ftp site. All
    items specified in this file are included in the web backup. It is up to you.
    Just to be aware of not including machine-specific data.


    The following shows the contents of the default .webdata.1st file:


    ```

    home/ds1/.webdata.1st

    home/ds1/Mail

    home/ds1/.sylphed

    home/ds1/.mozilla

    home/ds1/.vimrc

    ```


    After backing up the file .webdata.1st itself, the file notes other items from
    /home/ds1 to back up. The Mail folder is the default location where your mail
    client (Sylphed) will save your mail and the .sylphed directory is where it saves
    its settings. In the .mozilla directory, your bookmarks, history and other web
    browsing-settings are stored. The .vimrc file is the configuration file that holds
    settings related to the vi editor. You will want to add files and directories
    to the .webdata.1st list that contains the settings and for the applications you
    use on a regular basis.


    As already noted, files that are less interested in saving are those that are
    related to a specific machine, this type of backup is meant to be shared by different
    machines as you travel to different locations. So, for example, the home/ds1/.xserverrc
    file is specific to your particular display and video card, so it might not work
    on a different machine. Better to have that sort of information detected and set
    at boot time.'
