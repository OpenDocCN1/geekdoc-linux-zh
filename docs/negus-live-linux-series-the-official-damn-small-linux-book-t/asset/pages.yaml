  md: '# CHANGING DOWNLOAD REPOSITORY MIRROR


    Damn Small Linux is hosted at many sites on the Internet. The main one is Ibiblio
    (http://distro.ibib.org). Ibiblio is the default, Ibiblio is also mirrored (which
    is transparent to you). Still, at times, accessing Ibiblio can become slow.


    Other sites have agreed to also host the DSL repositories. Many of the mirrors
    may be closer to you. In fact, some may just be faster for you to access. For
    these reasons, we make it possible to change the default download site. To change
    the default download site, select the DSL icon from the desktop and click Mirror.
    A small dialog appears, as shown in Figure 5-11.


    ![](img/f6eecb623fe812080d8ad148db9eda3a_129_0.png)


    FIGURE 5-11 The Mirror select dialog shows the mirror being used to get DSL extensions.


    Here, you can default the Ibiblio site and default protocol. At this point, you
    can click the Select button to see a current list of mirror sites, as shown in
    Figure 5-12.


    ![](img/f6eecb623fe812080d8ad148db9eda3a_129_1.png)


    FIGURE 5-12 Mirror selection.


    You can scroll through this and select any mirror. Both mirror name and protocol
    are shown via their full URL. When you have selected one, it populates the Mirror
    Select dialog and you can click OK to proceed. Doing so saves your new choice.
    It is remembered by normal backup and restore procedures.


    The Mirror Select dialog is not limited to just the current mirror sites. In fact,
    you can type in any site and protocol that you want. The purpose of this is that
    you may want to host your own repository on a local server. Perhaps this is a
    private collection for a home network. This may also be a company intranet, school,
    or training center.'
  merge: -1
