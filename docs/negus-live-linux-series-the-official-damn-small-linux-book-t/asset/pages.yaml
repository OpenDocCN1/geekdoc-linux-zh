  md: '# CHAPTER 1 Overview of Damn Small Linux


    The DSL project welcomes the user community. The MyDSL extensions only represent
    the framework. The actual extensions are requested, discussed, and created by
    the community of DSL users. This active community shares in the owner-ship of
    these seamless extensions.


    # What is the most interesting hardware known to running DSL?


    **Robert:** What comes to mind is the original ThinkNic Internet Appliance, which
    is a CD-based machine with a 4MB ramdisk (to save configuration), a Winmod, and
    an Ethernet port. We fully support this “first of breed” Linux appliance.


    **John:** For me, the most interesting hardware run DSL has not been applied yet—there
    are so many possibilities. I personally work on a homemade laptop based on an
    eBox III client and a cheap 8-inch LCD monitor. I''d like to be able to hook it
    up to a small solar panel. It will have to run an IDE flash Disk Module (dom);
    it will be passively cooled and 100% silent.


    # Why is DSL so for hobbyists?


    **John:** On, there is so much you could do with DSL. It is small, it requires
    very little RAM, it can run on ancient hardware, and it can run without a hard
    drive. DSL can run in RAM with as little as 128MB. It could run with as little
    as 16MB of RAM with a conventional hard drive install. With DSL, you can take
    junk and make it workable hardware.


    DSL is also easy to modify, and upgrade. We have an extension system that allows
    DSL to morph in any direction a developer could want without the need to do a
    custom remastering. We make heavy use of scripting languages. So if you want to
    get into the meat of what makes DSL DSL, all you have to do is dig around.


    **Robert:** The fun of tinkering with that old hardware you found in the closet.
    Now you have a neat web server, a picture frame, or a MP3 player. Your creativity
    is free to explore and share with a community of DSL users. You can create and
    share MyDSL extensions or learn to code with Bash, Perl, C, Lua, Lua/Ftk. It''s
    all in there.


    DSL includes lots of hardware support. So, you can build a web surfing appliance
    for Grandma. Or perhaps buy old “throw-away” laptops. We support many of them.
    Or even buy an embedded device and use DSL as the embedded OS. We are like Tinkertools
    for Linux: a Linux construction kit. It''s all about having fun!


    # What are the challenges to someone comes to DSL from MS Windows?


    **John:** In the modern MS desktop, you are looking from under the hood. In DSL,
    there is no hood at all—you are free to dig as deep as you want to.'
