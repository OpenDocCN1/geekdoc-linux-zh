  pgno: 342
- img_proc: true
  md: '# CHAPTER 16 Setting Up an XAMPP Web Server in DSL


    There are many ways you can change your firewall configuration in the rc.firewall
    file. For our purposes, we are only going to open a few ports to allow outside
    access to the web server (port 80) and the FTP server (port 21).


    With the rc.firewall script, you can open access to the web server and FTP server
    ports by adding those port numbers to the PERMIT=" line. So, for the easiest case,
    edit the permit line so it appears as follows:


    ```

    PERMIT="80"

    ```


    The preceding PERMIT line opens access to the standard web server (port 80) and
    FTP service port (21). With this line, all network interfaces allow anyone accessing
    those interfaces to request Web and FTP service. Of course, if you protected those
    services with passwords, you also need that username/password information to ultimately
    view the content associated with those services.


    Here are a few ways that you can configure your PERMIT line to access to your
    Web and FTP services:


    ```

    PERMIT="80/tcp 21/tcp"

    PERMIT="192.168.0.0/24:80 192.168.0.0/24:21"

    PERMIT="192.168.0.0/24 10.0.0.150"

    ```


    You can use the examples in any of the PERMIT lines to allow access to your server.
    In the first example, tcp is added to each port, to indicate that only TCP protocols
    can access those services (by default, both TCP and UDP are allowed). The example
    only allows access to ports 80 and 21 from computers on the 192.168.0 network
    (a good approach if you want to limit access to computers on your LAN). The final
    example allows access to any available port on the 192.168.0 network, as well
    specifically permits access from the host at IP address 10.0.0.50.


    There are many, other ways to configure firewall services in your rc.firewall
    script. For example, if your server is also being used as a router between your
    LAN and the Internet (not a terribly secure arrangement, but one that many people
    do), the script lets you set up your firewall for that. Assuming you want to allow
    routing to the Internet (eth0 interface) from computers on your LAN (eth1 interface),
    the following line would permit your firewall to allow that:


    ```

    INTERNAL_INTERFACES="eth0"

    ```


    A more secure approach to having your servers and the workstations on your LAN
    exist behind the same Internet connection is to configure what is called a Demilitarized
    Zone (DMZ). With a DMZ configuration, servers are behind firewall, whereas your
    private LAN (generally your user workstations) is behind'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# The Official Damn Linux Book


    another, separate firewall. For more on using rc.firewall to configure a DMZ or
    other complex arrangements, refer to the Linux Firewall Configuration page for
    this project (http://lfw.sourceforge.net/config.html).


    # Start Up Your Firewall


    With your rc.firewall file edited, you can try out your new firewall configuration
    by running the rc.firewall script manually as follows:


    ```

    # /opt/rc.firewall

    -> Projectfiles.com Linux Firewall version 2.0rc9 running.

    -> Performing sanity checks.... [ PASSED ]

    -> Building firewall.... [ DONE ]

    -> Successfully secured the following addresses: 10.0.0.100

    ```


    There is no indication of errors in the example just shown. Make sure that your
    information is formatted correctly in the rc.firewall file. To view the rules
    that are set on your firewall, use the iptables command as follows:


    ```

    # /sbin/iptables -L

    Chain INPUT (POLICY DROP) target prot source destination

    ACCEPT all anywhere anywhere state RELATED,ESTABLISHED

    ACCEPT tcp anywhere anywhere state NEW tcp dpt:www

    ACCEPT udp anywhere anywhere state NEW udp dpt:www

    ACCEPT tcp anywhere anywhere state NEW tcp dpt:ftp

    ACCEPT udp anywhere anywhere state NEW udp dpt:fsp

    ```


    The partial output of iptables shows what happens for your firewall''s INPUT chain.
    The policy is to drop any incoming connection requests, except in those cases
    where the connection is related to an established connection (presumably started
    by a client before the firewall). The last four entries, however, show that new
    incoming connections will be established for requests coming from any for tcp
    and udp (port 80) connections, as well as tcp and udp ftp and fsp (port 21) connections.
    (The FSP protocol is similar to anonymous FTP and accepts connections on port
    21.)


    At this point, you may make sure you can connect to your XAMPP server by logging
    into a different computer (on your LAN or on the Internet) and trying to connect
    to the server. To check the web service, point your web browser at the server''s
    IP address (such as http://10.0.0.100, as described). Or, you can connect to the
    FTP service (for example, ftp://nobody@10.0.0.100 and enter the password you created
    earlier). Presumably, you will use FTP to add content to your web server or offer
    download service to users.'
