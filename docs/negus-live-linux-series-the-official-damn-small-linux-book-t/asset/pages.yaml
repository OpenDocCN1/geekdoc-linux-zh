- img_proc: true
  md: '# Adding MyDSL Extensions


    Once you know which MyDSL extensions you want, you need to add those extensions
    to the remastering mysdsl directory. For example, if the remaster directory is
    /mnt/hda4/iso, type the following command from a terminal window to create the
    mysdsl directory.


    ```

    # mkdir -p /mnt/hda4/iso/mydsl

    ```


    Now you can download and save the MyDSL extensions you want using the MyDSL Extension
    Tool, indicating /mnt/hda4/iso/mydsl (for example) as the directory to hold the
    saved extensions.


    > You will be able to run your live CD from RAM (using the toram feature) so you
    can eject the CD, do not use .unc or .uci MyDSL extensions. While both of those
    types save space in RAM, they will prevent the CD from being ejected, since they
    will be mounted directly from the CD.


    So, for example, if you wanted to use an application such as mplayer, where you
    need to eject the CD to play CD music or DVD movies from that drive, only use
    extensions of .dsl or .tar.gz types.


    # Starting the MkMyDSL Script


    Before running the MyDSL script, be sure that the remaster directory (for example,
    /mnt/hda4/iso) doesn''t contain anything that you don''t want to go on your remastered
    CD. In particular, if you have run the script before, be sure to remove the mysdl.iso
    file left behind by the previous MkMyDSL run.


    To start the script from the menu, select Apps, Tools, Make MyDSL Remaster. Figure
    11-2 shows the Make MyDSL CD window that appears.


    ![](img/f6eecb623fe812080d8ad148db9eda3a_235_0.png)


    FIGURE 11-2 Displays the first of two prompts needed to make a custom, bootable
    CD-ROM.'
  merge: -1
