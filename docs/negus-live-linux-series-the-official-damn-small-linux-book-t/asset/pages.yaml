  md: '# The Official Damn Small Linux Book


    and netcardconfig from the DSL menu. Say No to using DHCP broadcast, and enter
    a static IP address for your DSL system. You can use that address to log in your
    digital media frame from other computers on your LAN.


    # Using the ssh Service to Get Content


    After you get your network interface running, I suggest you have DSL start up
    the ssh interface automatically. That service lets you remote login and remote
    copy from other computers on your LAN. For example, you could add the following
    line to /etc/rc5.d/s99bootlocal init:


    ```

    /etc/init.d/ssh start

    ```


    With your network interface and secure shell running in DSL, there are several
    ways you could access your digital media frame from another computer on your LAN.
    First, I suggest you add a password for the root user in DSL. (Don''t add a password
    for dsl or you won''t be able to boot DSL without being prompted for a password).


    Assuming your IP address is 10.0.10.1, there are some ways you could access the
    media frame from another computer on your LAN from another Linux system:


    ```

    # ssh root@10.0.10.1

    # scp *.jpg root@10.0.10.1:/var/mediaframe/pics/

    ```


    For the command line, you are prompted for the root password. The ssh command
    shown lets you log in as root to a shell interface. The scp command copies all
    files ending in .jpg from the current directory on the local system to the /var/mediaframe/pics
    directory on the media frame.


    If you have a OSX system, you already have a Terminal to use the command. For
    Windows systems, there is a set of open source tools called PuTTY that you could
    look into for accessing, ssh, and other secure services from Windows systems.
    See www.chiark.greenend.org/uk/~sgatham/putty. There is also SSHDOS to use those
    tools from DOS (http://sshdos.sourceforge.net). Of course, you could also just
    boot DSL by PC on your LAN as well.


    # Using Samba to Get Content


    DSL also supports Samba, which can be used to share files and folders with Windows
    systems. With Samba installed using MyDSL (as described earlier), here is an example
    of how you could create a shared directory from DSL so that people from Windows
    clients could add and remove images from /var/mediaframe/pics directory:'
