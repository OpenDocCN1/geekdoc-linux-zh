  md: '# The Official Damn Linux Book


    # AxY FTP a GUI FTP Client for X


    Authored by Alexander Yukhtim, the version of AxY FTP we are running in DSL is
    a GTK1.2 port. AxY FTP should have a very familiar interface for many, because
    it relies on the classic two-panel design made in the 1990''s, ws_ftp (a Microsoft
    Windows program). AxY FTP has a convenient session manager that can save your
    accounts and passwords. It also supports recursive downloads, recursive uploads,
    and passive and nonpassive data transfers.


    # Beaver—Our GUI Text Editor


    Beaver was originally developed by Damien Terrier. Its name is actually an acronym
    for Beaver is an Early Advanced EditorR, which plays on the UNIX joke of having
    a self-recursive name. In DSL, it is simply the most feature-rich editor available
    in its size range. It packs features that browsers more than double its size lack.


    Beaver is very easy; it has multiple tabs and the ability to search and recover
    over multiple buffers. Coders find the optimal color highlighting easy on the
    eyes. Casual desktop users are familiar with the typical key bindings for cut
    and paste.


    Another critical feature that Beaver is the capability to undo and redo operations.
    For coders, Beaver''s capability to turn on and off word-wrap is a must. Some
    of the lesser-known features of Beaver include its capability to convert text
    in and out of DOS format. This is handy if you are sharing a file between platforms.
    Beaver is also capable of converting text case to uppercase, lowercase, or proper
    case (the first letter of every word is capitalized). The version of Beaver in
    DSL is 0.2.7 and has been updated with bug fixes.


    For information on Beaver, you can visit the project''s website at the following
    address: http://www.nongnu.org/beaver.


    # Calco—An RPN and Algebraic Calculator


    This GTK1.2-based calculator is full-featured, yet only 108Bytes. Get more information
    on Calco from its project site at http://calco.sourceforge.net.


    # Dillo—A Light Weight Web Browser


    Dillo is an alternative lightweight browser designed by Jorge A. Arellano Cid
    for embedded or otherwise constraint systems. Such a browser is a natural for
    DSL.


    The development of Dillo has been very methodical over the years and the project''s
    authors are very careful to write clean and concise code. This means that Dillo
    has a very solid base, but it lacks features of a fully functional, modern browser.'
  merge: -1
