    # Initial Ramdisk


    Also in the master/boot/isolinux directory is the initial ramdisk: minirt24.gz.
    Here''s how you can modify the initial ramdisk:


    +   1. To unpack the minirt24.gz, do the following:


    ```

    # cd master/boot/isolinux

    # mkdir moot

    # gunzip minirt24.gz

    ```


    +   2. Mount the compressed ext2 ramdisk by the following:


    ```

    # mount minirt24 moot -t ext2 -o loop=/dev/loop1

    ```


    +   3. At this point, by changing directory to moot/, you have access to the initial
    boot script and modules. (Both of these are discussed shortly.)


    +   4. If any changes to the modules or the initial boot script, you need to repack
    the initial ramdisk. Use the following steps:


    ```

    # cd ..

    # umount moot/

    # gzip -9 minirt24

    # rmdir moot/

    ```


    # Initial Boot Modules


    After the initial ramdisk is unpacked, change directory to moot/. Any boot modules
    need to be available in the modules/ directory. Currently, you can see that the
    cloop.o and scsi/ directory of modules exists.


    # Initial Boot Script


    While in the moot/ mounted initial ramdisk, you can see the linux script. This
    script is where the boot process begins. You can change the ascii DSL logo. You
    can change the order of searching for the KNOPPIX image. You can effectively change
    how much of how DSL boots. If you add modules, it is here that you must reference
    them.


    # Creating the Isolinux Standard ISO Image


    The standard image used in DSL is the Isolinux version. This step is comprised
    of two stages. The first stage is creating the KNOPPIX image in the master directory.
    The second step is combining the boot files, the Linux kernel, and initial ramdisk
    to create the actual ISO.'
