    # Booting DSL


    With a PC and copy of Damn Small Linux (the one on this book’s CD), most people
    can reboot and be if some other piece of hardware is working, pressing F2 shows
    you boot options that can overcome most simple problems.


    When you boot DSL, there are other boot-options you can pass to DSL that help
    direct the boot process. Some of options can make DSL better for your particular
    hardware (such as video cards that can be properly detected). Others let you run
    DSL in special ways (such as running DSL completely from RAM). Still let you identify
    where bundles of data are located that you can pull into your DSL system (such
    as your backed-up-desktop settings or saved applications).


    Boot options you might need to get DSL running initially are included in Chapter
    2, “Booting DSL.” Some options for identifying your personal settings are backed
    up to and restored from are covered in Chapter 4, “Configuring and Saving DSL
    Settings.” Options for running DSL in different hardware environments are covered
    in Chapter 8, “Installing DSL in Alternate Ways.”


    # Customizing the Desktop


    Fluxbox is the window manager that is used by default with Damn Small Linux. Despite
    its compact size, there are many ways to tune Fluxbox to look and behave the way
    you like. A window manager defines how menus, mouse movements, keyboard navigation,
    backgrounds, and other features related to the look and feel of your graphical
    interface operate.


    From Fluxbox desktop, most DSL activities be directed from a single desktop menu
    (right-click the desktop to see the DSL menu). Select Desktop, Fluxbox Configuration
    to see a listing of available desktop settings that you can change. Figure 1-2
    shows examples of these menus.


    Besides changing the look and feel of your desktop, you can use various desktop
    utilities to manage your workspaces, mount and unmount file systems, and tasks.
    Using various desktop tools and applications is described in Chapter 3.'
