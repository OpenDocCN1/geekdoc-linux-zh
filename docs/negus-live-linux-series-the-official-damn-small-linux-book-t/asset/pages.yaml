- img_proc: true
  md: '# # Running DSL on Alternative Hardware


    Most of the alternative hardware people are using to run Linux has some type of
    performance or physical limitation. Often, such hardware has limited space or
    significantly reduced performance when compared to a conventional PC. For the
    sake of discourse in this chapter, I will divide such appliances into two groups:
    alternative media devices and alternative devices with CPUs.


    The alternative media devices group consists of mountable devices such as cameras,
    mp3 players, wrist watches, portable video players, and PDAs. The alternative
    devices group includes thin clients, Internet appliances, embedded computers,
    diskless PCs, industrial computers, PC100 motherboard computers, homemade mini-ITX
    systems, AMD Geode computers, and other people''s trash (more on this later).


    # ## AN ARGUMENT FOR USING DSL IN EMBEDDED SYSTEMS


    Why Damn Small Linux (DSL) instead of another distribution for your alternative
    hardware system? DSL is small (only 50MB), it requires little RAM and CPU processing
    power, and it may run via USB, CD, or disk on image mode (known as the Frugal
    install method).


    The Frugal and USB boot methods make use of a ramdisk that keeps the docwrites
    as log files and caches in memory. This is critical for keeping CompactFlash drives
    alive. The unique combination makes DSL the best choice for the job. Although
    there are other light desktop-oriented operating systems available, they require
    much more disk space and/or RAM and do not use a ramdisk to'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# The Official Damn Small Linux Book


    protect drives with limited use. Most manufacturers claim that CompactFlash is
    good for tens of thousands of docrites, which may sound like a lot, but in normal
    Linux kernel function, those docrites will add upvery quickly.


    Additionally, we invested a significant amount of research and selected the best
    combination of functionality, small footprint, and RAM efficiency when we chose
    programs to include in DSL. There are years of investigation and community feedback
    that helped us derive our current native program list.


    Finally, we have our extension system that can greatly increase the functionality
    of DSL while not requiring a conventional installation. Because our UNC and UCI
    extensions are highly efficient in their RAM use, they are particularly suited
    for alternative hardware.


    # MOUNTABLE APPLIANCES


    Many devices that are mountable can boot DSL, but some have operational problems
    if you write over their Master Boot Record, MBR. Hence, you should be careful
    if you decide to experiment with making the device bootable (as though it were
    a pen drive with Syslinux appeal). A much safer choice is to limit usage of such
    a device to run DSL embedded, which does not need any modifications to the MBR
    to run.


    Other than the novelty of doing so, there is not much value in making your device
    as a bootable USB storage device. In comparison to the cost of a conventional
    drive, the actual cost of the device (such as a PDA, digital camera, or media
    player) is significantly higher. I suggest waiting until the device is absolutely
    disposable before attempting to complete such an experiment.


    At this point, if you are still deterred by my warnings and are going to proceed
    with modifying the MBR of the appliance, you want to at least back up the original
    MBR just in case you need to restore it.


    To save the copy use the dd command in a Terminal window as root type:


    ```

    # dd if=/dev/sda=mbr.backup bs=512 count=1

    ```


    This command assumes that your USB device is at address /dev/sda. Please verify
    for yourself and refer to Chapter 6, “Running a Native Pen Drive Install,” for
    details. Make sure you save your backup to another drive for safe keeping.


    If you need to restore the MBR layer, you can use this command:


    ```

    # dd if=mbr.backup=/dev/sda bs=512 count=1

    ```'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# CHAPTER 12 Running DSL on Alternative Hardware 247


    The rest of the process is similar to either creating a bootable drive or an embedded
    system on any other portable media. It is unusual and novel to have a fully functional
    USB bootable media device contained in your appliance. However, what you essentially
    have at the end of the process is something that has dual function: its original
    intended purpose and the capacity to do as a $15 pen device (which would actually
    fit into your pocket easier than most cameras, PDAs, or media players). For most
    users, this is really not the most practical thing to do.


    With the possibility of damaging the device and the impracticality of using it
    as a portable bootable device, why would anybody do this? Most people try just
    to see if it can be done or for the "geek" pride in accomplishing such a project.
    Or, perhaps it is finding a new purpose for an otherwise obsolete product?


    # ALTERNATIVE CPU-BASED HARD


    Alternative hardware usually means limited resources. Typically, the hardware
    has one or more of the following restrictions:


    +   - Limited RAM

    - Limited processor speed

    - Unusual storage device

    - Boots from a flash drive

    - Limited storage space

    - No swap partition


    Each limitation in the preceding list has its own challenge. I will outline the
    difficulty of each and review some practical steps to alleviate these limitations
    when operating DSL in such environments.


    # Embedded Systems and Thin Clients


    There are a whole host of computer systems that were never intended to run a complete
    desktop operating system. These include SBCs (single board computers), industrial
    computers, systems designed to be thin clients, and systems intended to be net
    appliances (such as the classic two hundred dollar ThinkNic from the beginning
    of the twenty-first century).


    The proliferation of Via chip and AMD GeForce-based embedded systems has lowered
    the price of SBC-based systems rapidly in the past few years. Currently, there
    are modestly powered systems selling for just over $100; for price, you can expect
    to get something with a very modest CPU (say 200MHz) and limited RAM (one example
    is 128MB).'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# The Official Damn Small Linux Book


    Slightly higher in the price scale, there are units with plenty of power to run
    DSL. For instance, there is the eBox III, which we sell at the DSL store as the
    *Damn Small Machine*; this model has a 700MHz Via processor and 256MB of embedded
    RAM. Such a system can run DSL with little consideration.


    The range in capabilities for computers that fall into this category is vast,
    but computers frequently have a few limitations in common:


    +   - Most have limited storage space.

    - Most CPUs that are less powerful than what you would expect in a typical normal-use
    computer.

    - Most are not designed to run a native operating system.

    - Many have a flash module in place of a hard drive.

    - Many have embedded RAM, which means the size is fixed.


    On the other hand, many of these computers also have some very positive features:


    +   - They are very small.

    - They are silent.

    - They are exceptionally efficient.

    - They have no moving parts (meaning their failure rate is fairly low).


    # Mini-ITX Systems


    Mini-ITX systems are based on the Mini-ITX motherboard form factor of 17cm square.
    There are several manufacturers of this form factor, but the company most associated
    with Mini-ITX motherboards is Via.


    Even with the standard motherboard size, there are many variations in configurations.
    Some motherboards are designed with special cool running processors that do not
    require a CPU fan; in contrast, some motherboards are set up to accept a Pentium
    4 processor. Other units have built in PCMCIA slots and compact flash readers.
    In addition, other motherboards are designed to be modular and accept various
    *daughterboards* that can be configured to have multiple LAN lines, SUB plugs,
    serial ports, or a Compact-Flex cardbus and PCMCIA reader.


    Mini-ITX systems can vary greatly in performance and configuration. Some Mini-ITX
    systems have common PC functions including normal size hard drive, a CD/DVD drive,
    plenty of RAM, and conventional CPU cooling. These Mini-ITX systems (particularly
    those with the newer and more powerful CPUs) are capable of running any operating
    system that a typical PC can run.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# CHAPTER 12 Running DSL on Alternative Hardware


    However, one restriction is that many of the Via Mini-ITX boards are limited to
    a gigabyte of RAM. Although this is not exactly a small amount, for those who
    are avidly into gaming, video processing, or other memory intensive uses, this
    might be something to keep in mind. If you buy or build such a system, there is
    no real special consideration needed while installing or running Damn Small Linux.


    In contrast, a Mini-ITX computer can be set up without a hard drive, CD/DVD drive,
    or any type of media storage device. Every Mini-IT board has been capable of booting
    via a USB drive (the early Via boards require a USB Zip configuration; see Chapter
    6). At the most minimal configuration, a Mini-ITX system can even be diskless,
    without any form of a drive and boot network using a PXE server.


    An especially nice trait about Mini-ITX systems is that you can build a unit according
    to your preferences. If you have the desire to build a compact high performing
    machine, you can select the top-of-the-line motherboard, and a pre-manufactured
    case that includes the necessary power and bracketing to install a hard drive
    and an optical drive. Or, if you want to build your own case, you could buy components
    (such as the power supply) separately.


    Every Mini-ITX motherboard I tested was powerful enough to run Damn Linux and
    had normal functionality, including sound and Ethernet, with no difficulty. If
    you obtain an old board, odds are that it will run DSL just fine.


    # John’s Cheap Little Mini (an Example of Minimalist Computing)


    I wanted to build a system that was 100% silent, looked cool, and had no moving
    parts. I used parts that were affordable: the Epia 5000 motherboard, the PW-60
    power supply, and an IDE Compact Flash adapter. The system was built inexpensively.


    Although the project is a few years old now, even at the time of its creation,
    the Epia 5000 was not the top-of-the-line motherboard from Via. However, the Epia
    5000''s CPU was much cooler than the later fanless models from Via. This was good
    because I used plexiglas and wanted to keep the operating temperature low enough
    that I did not have to worry about melting the plexiglass. The mesh on the side
    was a gutter guard available at any hardware or home improvement store. Figure
    12-1 shows a picture of this machine.


    The Epia 5000 is only 533MHz; in comparison, today there are fanless Mini-ITX
    motherboards that are 1.5GHz. The power supplies have also become much smaller
    since this project, but I think this set is still a viable option.'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# The Official Damn Small Linux Book


    FIGURE 12-1 A snap-shot of the Mini.


    ![](img/f6eecb623fe812080d8ad148db9eda3a_270_0.png)


    Although overpowered next to the latest Mini-ITX boards, the Epia 5000 is a high-quality
    board, and this particular set up will last for years without any problem. I built
    this machine with only 256MB of RAM and this suited my needs more adequately.
    I used the Mini as my daily computer for about a year without any problem. If
    I built it again, I would use a more powerful motherboard and at least 512MB of
    RAM so I could forget about RAM usage and just enjoy my silent computer.


    When the DSL store started the Damn Small Machines, I finally retired the Mini
    in favor of the smaller yet more powerful client. I miss the look of the homemade
    case though, and I may build something similar again in the future.


    If you want to read more about my Mini project or see more pictures, go to: http://www.dammsmalllinux.org/mini.html


    # Special Considerations for Running Alternative Hardware


    In this section, we will examine a few alternative hardware limitations, and look
    at some real-world examples.


    # Limited Processing Power


    Damn Small Linux is usable on some fairly outdated hardware. I have been able
    to accomplish a day''s work on a 233Mhz Pentium. It would appear that more than
    thin clients should have powerful enough CPUs to run DSL without any difficulty.
    However, not all processors perform equally.


    For example, currently there is a very affordable single board computer that is
    based on the SiS550 200MHz processor. These units look great and can be bought
    for just over $100. However, you will find them painfully slow to use with DSL
    in'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# CHAPTER 12 Running DSL on Alternative Hardware


    graphical mode. If you are working on one of these units, you may consider using
    it only in text mode.


    We provide a lot of text applications that can turn this machine into a useful
    application (Chapter 3, “Using DSL Applications”). If you venture into the GUI
    desktop, you will want to avoid any program that requires a lot of CPU cycles.
    Firefox should be avoided on such a thin client, as well as any of the GTK2 extensions.
    In addition, do not try to use OpenOffice.org for office applications.


    In graphic mode, try to use our lighter-weight program options. For Ogg123 or
    Mpg321 to listen to your music. Use Dillo, Netrik, or Links for browsing the web.
    Additionally, use Naim instead of the Gaim extension for instant messaging. You
    may want to download the glinks.uci extension and use that as your default browser.
    It is substantially lighter than Firefox, but it does good table rendering and
    also manages resources well.


    # Limited RAM and No Hard Drive


    Limited RAM can pose a challenge. Many thin client type systems do not have a
    real hard drive, so there is no capability to swap a partition. In this case,
    the question is, “How much RAM do you have to work with?”


    You can have fairly normal PC operation using DSL without a swap file in a system
    with 256MB. I use the Damn Small Machine daily at this amount of RAM. If you are
    careful, you can have normal functionality with 128MB of RAM and no swap drive,
    but you should monitor your RAM use closely, particularly when surfing the web.
    Figure 12-2 is a picture of the Damn Small Linux machine.


    ![](img/f6eecb623fe812080d8ad148db9eda3a_271_0.png)


    > FIGURE 12-2 The Damn Small Machine has 256MB of RAM.


    In this scenario, you want to limit RAM usage by not having too many memory-draining
    applications open simultaneously. You will be surprised by how much you'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# The Official Damn Small Linux Book


    can run on 128MB of RAM. All the native applications in DSL launch and run fine,
    from the XMMS media player to Ted, the word processor.


    Dillo, the web browser, also runs adequately, but you need to be careful with
    Dillo because it caches every page and image displayed until it closes down the
    program. If you are using Dillo, restrict its page views.


    We have already limited the cache size in Firefox, so it does a reasonable memory
    management on its use. However, it does not clear the cache for pages that are
    currently open, if you like to surf with a lot of tabs open or if you view a page
    with a lot of images, you can use all of your RAM.


    As an alternative to using Dillo, consider using the gllinks extension and manually
    lowering the cache. GLinks does a good job of handling memory and is substantially
    lighter than Firefox.


    If you want a driverless and RAM machine with OpenOffice.org, get the openoffice.uci
    extension. It operates fine with 128MB of RAM without a swap as long as it is
    not sharing memory space with another large application such as Firefox.


    Please keep in mind that if you use all of your RAM and you do not have a swap
    file, your computer will lock up and any document that you have unsaved be lost.


    # ## Other People’s Garbage (Resurrecting Old Laptops)


    To most people, a five-year-old laptop is hardly anything. These laptops seem
    to be gathering dust in the corners of many offices. If you cruise eBay or Craigslist,
    you see many old notebooks for under $100. Add a broken optical drive or hard
    drive and you are likely to set the unit in the recycle bin or given away. However,
    with a little work, many of these computers are still usable.


    Recently, I was given a Sony VAIO laptop (model PCG-Z505SX). Figure 12-3 shows
    a picture of the laptop.


    This laptop is a sexy, lightweight notebook. It has a very thin profile and good
    resolution. The person who owned it was trying to give it away, and the first
    three people he offered it to declined it. After talking to two people across
    the room, the owner walked over to my work area and started asking questions about
    the VAIO again.


    The conversation went something like this:


    +   **Owner:** How much do you think my laptop is worth?


    +   **Person One:** How much RAM does it have?'
  merge: -1
  pgno: 272
