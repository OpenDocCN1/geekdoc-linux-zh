  md: '# CHAPTER 3 Using DSL Applications


    # Nano—A Simple Terminal-Based Text Editor


    Nano is a GNU clone of the well-known Pico editor, though with some improvements
    that make it more friendly for coding. Improvements include regular expression
    search-and-replace and auto-indent. Like Pico, Nano is exceptionally easy to use.

    Nano''s home page is located at www.nano-editor.org.


    # Netrik—A Minimal Text Browser


    According to the authors, “ANTRIK Internet Viewer/Browser/Explorer/Navigator/whatever.”
    Netrik is critical for our net-man and web-dictionary applications. We needed
    something that could render HTML, be small enough to not push out other applications.
    Netrik proved to be perfect for the job. What amazes us at DSL is that Netrik
    is only 79.3Kbytes in size.


    Visit the Netrik home page at http://netrik.sourceforge.org.


    # smclient—A Command-Line Client to Windows File Sharing


    smclient allows you to connect to a Microsoft Windows share network with FTP-like
    interactions.


    For information on smclient, refer to its man page at:

    http://samba.org/samba/docs/man/manpages-3/smclient.html


    # SQLite—A Small, Self-Contained SQL Relational Database Management System


    SQLite is small, stable, embeddable, and fast. SQLite comes with a standalone
    command-line program that can be incorporated into Bash or Perl scripts in DSL.
    We also have Lua bindings for SQLite via murglua.


    We have a personal information manager written in Perl, which relies on SQLite
    for the back-end database management.


    Refer to the SQLite home page for more information: www.sqlite.org.


    # Vi(m)—An Advanced Terminal-Based Text Editor


    Many claim that using Vim is the most efficient way of editing documents. True,
    the advanced features of Vim take time to master, but after you commit them to
    memory, so much editing is at your fingertips, you do not take your fingers off
    the keyboard.


    The basic commands for Vim are really not that complicated. To see a good list
    of the basic commands, reference this URL: http://www.selectorweb.com/vi.html.'
