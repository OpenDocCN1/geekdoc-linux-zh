  md: '# What to Do When Your Computer’s BIOS Does Not Support USB Booting


    What if you want to use your pen on a computer that does not support USB booting?
    You have two options:


    +   - Boot from a floppy with our specially created bootfloppy-usb.img.

    - Boot from a CD with a special boot parameter that tells Syslinux to access the
    system image at the device location where the pen resides.


    # Creating a Boot Floppy for the USB Pen Drive


    The first thing you need to do is download the usb boot floppy image. You can
    find the image at any of the download sites. One place to find it is at:


    ftp://ibiblio.org/pub/Linux/distributions/damnsmall/current/bootfloppy-usb.img


    After using wget to download the usb boot floppy image, you can format the floppy
    disk by issuing this command into the term window:


    d if=bootFloppy-usb.img of=/dev/fd0


    Armed with your newly booted floppy drive, you can boot your USB pen drive even
    if the computer you are using has a BIOS that does not support booting.


    Using a LiveCD to Boot a Pen Drive

    The 50MB hockey ring CDs are smaller and travel better than floppy disks. It may
    be easier for many people to use a bootable pen drive and then use a mini CD as
    alternative boot media in place of a floppy drive.


    You can mimic the behavior of USB booting with a boot CD and a pen drive when
    you are using a computer without the capability to boot from a device naturally.
    We will review a few options you can use at the boot prompt to take advantage
    of your pen drive.


    To use your MyDSL extensions from your pen drive, type the following:


    ds1 mysds1=sda1'
  merge: -1
