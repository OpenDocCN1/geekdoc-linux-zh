  md: '# CHAPTER 14 Using Skype VoIP Service in DSL 287


    # Purchasing Calling Time


    Because these programs change often, you need to check the Skype website for the
    latest programs and pricing. However, at the time of this writing, there are some
    of the available telephone calling programs:


    +   - SkypeOut—This program lets you make calls from your computer to phones and
    mobile devices on the traditional phone system. There are yearly rates for unlimited
    calls within the United States and Canada ($29.99 per year). For international
    calls, there are per minute rates offered (regularly starting at $.021 cents per
    minute).

    - Calls to a group of countries where Skype is most popular are available at a
    single SkypeOut Global Rate. Calls to countries covered under that rate include
    countries in North America, Europe, Australia, some countries in the Far East,
    and a few in South and Central America. Check the Skype website for exactly which
    countries are covered (www.skype.com/products/skypeout/rates).

    - SkypeIn—To allow other people to call your Skype account on your computer, you
    can sign up for SkypeIn. That service assigns a phone number to your Skype service
    so it can be reached from a traditional telephone.


    One advantage to this service is that you can have a phone number assigned from
    an area that is in a particular area from which you expect a lot of calls. In
    that way, people that call you from that same area can pay local charges, instead
    of long-distance charges. You, on the other hand, can be logged in from anywhere
    in the world that you fire up your Skype account.


    Some traditional telephone services are also available from Skype. For example,
    you can get Skype Voicemail (to answer your calls when you aren''t around) or
    Call Forwarding (to have your calls forwarded to your traditional landline phone
    or mobile phone).


    # Purchasing Accessories


    Skype sells accessories that you can use with your Skype free and for-pay call
    services. The Skype Accessories Shop has the latest available products (http://accessories.skype.com).
    For the following are some Skype products that might be useful to use with DSL.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# The Official Damn Small Linux Book


    +   - Headsets—Although you can purchase similar headsets to the ones that Skype
    offers at most stores sells some modestly priced headsets that include free SkypeOut
    minutes. Skype also sells a speaker/headset switch, to make it easier to change
    back to speakers when you are not making phone calls.


    +   - Starter kit—If you are setting up several people at once to use Skype, a
    starter kit including a headset and software (usually Windows and/or Mac OS X)
    can help get everyone started. Some of the kits include SkypeOut calling minutes.


    If you get hooked using Skype, but you prefer to use a hand to make and receive
    calls, Skype offers several different models of VoIP. Some of these phones connect
    to the computer via USB cables, whereas others connect wirelessly via a broadband
    connection.


    # RESTARTING DSL TO USE SKYPE


    If you followed the procedure for installing Skype and the ALSA sound system,
    the reboot the extensions you need already be set up to be loaded the next time
    you reboot DSL. If you boot DSL, you indicate that you want to use the ALSA sound
    system, you don''t even need to run any setup commands to start ALSA. It should
    just work.


    Here''s an example of what you should enter at the boot prompt when you restart
    DSL to start the ALSA sound system (so you can use Skype):


    ```

    boot: dsl alsa

    ```


    If ALSA doesn''t start for some reason, try running the alsa_snddevices and alsa_init
    commands, as described in the "Setting Up ALSA Sound in DSL" section earlier in
    this chapter. You might also need to use other boot options, for example, if you
    saved your MyDSL extension to some directory other than a toplevel directory on
    a local hard disk or pen drive.


    # TROLESHOOTING SKYPE


    Skype requires an active Internet connection, working sound card, microphone,
    and speakers/headphones to be able to make audio calls. If any of those items
    isn''t working properly, you won''t be able to make audio calls with Skype.'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# CHAPTER 14 Using Skype VoIP Service by DSL 289


    Because Skype supports Linux, there are some Skype resources you can turn to if
    something goes wrong. You can begin at the Skype Help site (http://support.skype.com).
    Next, try the Skype for Linux forums (http://skype.com/bb/viewforum.php?f=18).
    Here are a few tips for overcoming potential problems with Skype:


    +   Calls not going through—Check that you have an active Internet connection.
    In cases, wired Ethernet connections start automatically if a DHCP server is present.
    If you cannot browse the web or a remote connection (sudo ping example.com), you
    may have to configure your network manually. For a wired Ethernet connection,
    right-click the desktop and select System→ Net Setup→ Netcardconfig and find in
    the appropriate information for your Ethernet connection.


    +   Unable to log in—You cannot log in multiple times under the same user. There
    are times when the Skype process doesn''t get killed if the Skype window isn''t
    shut down properly, which might prevent you from logging again. If you think this
    might be the case, close the Skype window, open a Terminal, and type k11la11 sky
    at the prompt. Restart Skype and try logging again.


    +   Microphone not working—If your microphone is not working at all, the dMix
    audio mixer to check that you have selected the correct input device and that
    the sliders are up (indicating the volume level at which you are recording).


    If you think that Damn Linux doesn''t include support for your sound card, try
    installing the ALSA Drivers package from MyDSL. Determine the type of sound card
    you have (type dmesg | less or l1spci -vv | less). Determine the name of the driver
    needs by searching the web for the name of the audio device and the word Linux.
    Then, use the modprobe command (as root user from a Terminal window) to load the
    driver.


    Some additional configuration of Skype can be done from the Options window. Select
    Tools→ Options from the Skype window to see the Skype Options. Beside being able
    to set options from this window that establish the behavior of Skype (such as
    what to do when your Skype session is inactive and which browser to use), you
    can also set more advanced options.


    For example, the Head/Headset settings lets you to choose the device name (/dev/dsp1,
    by default) representing the sound card to make calls on. The Advanced tab lets
    you choose a port to use for incoming connections and lets you to display technical
    call information.'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# SUMMARY


    The Skype VoIP service provides a way of making free calls over the Internet from
    Linux, Windows, Mac OS X, or handheld PC devices. A Linux port of Skype software
    is available for Damn Small Linux, which you can easily install using the MyDSL
    feature.


    Besides being able to make free Internet calls using Skype, Skype offers a database
    of Skype users that you can search to find people to call. Another free service
    that Skype offers is the ability to send instant messages to other Skype users
    to carry on Internet chats.


    If you want to expand your use of Skype, you can sign up to be able to call people
    on regular telephone lines from your computer using the for-pay SkypeOut service.
    If you want others to be able to call you from your Skype session on your computer,
    you can sign up for the SkypeIn service (which is also a for-pay service).


    Although Skype is not recommended to be used as your only telephone service (partly
    because it doesn''t offer emergency service), it can be a low-cost and convenient
    way to make telephone calls to others around the world.'
  merge: -1
  pgno: 310
