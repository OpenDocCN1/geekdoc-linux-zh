    # CREATING TAR.GZ AND UCI EXTENSIONS


    As previously defined, the tar.gz extension type in DSL is not the Linux typical
    tar.gz. Universal UNIX systems install programs by running an install script or
    package manager, such as apt, as root. This process scatters files and directories
    over the file system. In DSL, this extension must be installed into /opt and typically
    must be self-contained or depend on the base libraries within DSL.


    In the past, many applications for Linux were distribution independent and distributed
    this way. For example, OpenOffice and Firefox were originally offered as simple
    tar.gz files. Lately, it has become difficult to apply applications that are truly
    distribution independent. The goal of such is very worthy.'
