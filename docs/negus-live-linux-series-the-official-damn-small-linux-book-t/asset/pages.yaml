    +   **Start search**—Select the Find icon (a magnifying glass) from the Skype
    toolbar. The Search for Skype users appears.


    +   **Choose search terms**—Type a word to search for into the Look For box and
    select Find. The Skype Name field in the Skype user account database is searched
    for that word. By selecting Advanced, you can instead search for a'
