  md: '# CHAPTER 5 Extending Applications with MySDL 107


    ![](img/f6eecb623fe812080d8ad148db9eda3a_127_0.png)


    > FIGURE 5-6 Watch the application download status as the download progresses.


    Downloading with the Extension tool means the program will be automatically installed.
    This is the preferred way to install extensions, as you are not merely downloading
    them for later use. When the extension is successfully downloaded, the Extension
    tool installs and sets the chosen application, and usually a desktop icon. The
    Extension tool also checksums the downloaded extension to ensure a good download.
    If the download is corrupt, a pop-up message informs you so you may try again.


