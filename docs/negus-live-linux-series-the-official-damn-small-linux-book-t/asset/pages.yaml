  md: '# Other Ways Of Storing Your Web Server


    Although having a complete DSL server on a USB flash drive is fun, a more practical,
    permanent solution is to put some, or all, of the project on hard disk. Using
    the procedure just shown as your guide, here are ideas for changing that procedure
    to store your server in different ways:


    +   * Save MyDSL packages to hard disk—Instead of downloading the MyDSL packages
    to /tmp, copying them to storage, you can directly download the packages to the
    permanent storage. For example, use the desktop mount tool to mount a hard disk
    partition (such as hda1 for your first hard disk partition). Then, create a mysds1
    directory on the device with `mkdir /mnt/hda1/mysds1`. When asked where to download
    the package, type `/mnt/hda1/mysds1`.


    Later, when you reboot, DSL should automatically find and restore the packages
    in the /mnt/hda1/mysds1 directory. To specifically identify that directory from
    the boot prompt (in case you have MyDSL packages in multiple places), use the
    mys1=/mnt/hda1/mysds1 option at the boot prompt.


    +   * Save your backup archive to hard disk—Instead of using sda or sda2 (presuming
    you represent your USB flash drive), when you choose where to back up your files,
    select a hard disk partition (such as hda1, hda2, etc.). The backup.tar.gz archive
    is placed in the root of that partition, so it can be restored later.


    +   * Create a persistent /opt—By dedicating a disk partition to your /opt directory,
    you can save yourself the trouble of restoring the files when you reboot. Instead,
    you just tell DSL to mount the dedicated partition to /opt and it''s ready to
    go.


    To set up your persistent /opt partition to work with your XAMPP server, you need
    to modify several steps from the setup procedure. First, create an empty hard
    disk partition (for example, /dev/hda2) and boot DSL as:


    ```

    boot: dsl opt=hda2

    ```


    Next, install the XAMPP software to the /opt directory and copy your MyDSL packages
    to a /opt/mysds1 directory. Edit the .filetool.1st file and remove references
    to backing up files from the /opt directory. When you go to reboot system later,
    start DSL and the XAMPP server with the following boot options:'
