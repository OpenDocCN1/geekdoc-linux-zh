  md: '# CHAPTER 8 Installing DSL in Alternate Ways 155


    # FIGURE 8-2 The cfdisk partitioning screen appears when option 12 is selected.


    ![](img/f6eecb623fe812080d8ad148db9eda3a_175_0.png)


    To set the entire disk for DSL, if you have existing partitions to delete, each
    one and choose Delete. To create the minimum partitions needed for DSL, perform
    the following steps. First, you create a 100MB Linux swap partition.


    +   1. Highlight the area marked Free Space.

    2. Highlight New and press Enter.

    3. Choose Primary and press Enter.

    4. Type 100 (to have a 100MB swap area) and press Enter.

    5. Choose Beginning to create the partition at the beginning of the free space,
    and press Enter.

    6. With the new partition highlighted above, highlight Type below and press Enter.

    7. To assign the file system type of Linux swap to file the file system, type
    82 and press Enter. The 100MB Linux swap partition should appear in the top part
    of the screen.


    Next, you create a Linux partition using the remaining disk space, as described
    in the following procedure:


    +   1. Highlight the area marked Free Space.

    2. Highlight New and press Enter.

    3. Choose Primary and press Enter. You should see the Size line appear, displaying
    the amount of disk space remaining.

    4. Press Enter to use all of the remaining disk space in the new partition, or
    type a number (and press Enter) to use a smaller amount of disk space. The partition
    will be automatically assigned to a Linux file system type (83).'
