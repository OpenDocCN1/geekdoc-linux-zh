  md: '# 54 The Official Damn Small Linux Book


    Figure 3-4 shows an example of the Docked.lua tool.


    FIGURE 3-4 Change audio settings and mount and unmount drives for the Docked.lua
    tool.


    ![](img/f6eecb623fe812080d8ad148db9eda3a_74_0.png)


    Drive names in DSL have a logical order; you just have to learn how the label-works:


    +   - hda is the first IDE drive (primary master).

    - hdb is the second IDE drive (primary slave).

    - sda is the first SCSI or USB drive.

    - sdb is the second SCSI or USB drive.


    For the partitions, convention is to add a number to the end of the drive. Here
    are few examples:


    +   - hda1 is the first partition on the first IDE drive.

    - hdb5 is the fifth partition on the second IDE drive.

    - sda2 is the second partition on the first SCSI or USB device.


    Often, hda1 corresponds to the C drive in Microsoft Windows. hdb1 could be your
    D drive in Microsoft Windows, but the labeling convention in Microsoft Windows
    is a bit of a mystery.


    # USING THE JVM WINDOW MANAGER


    Damn Small Linux also comes equipped with another window manager, called JVM—actually,
    the version of JVM in Damn Small Linux is cut down a bit and has some of the features
    stripped out. JVM looks more familiar to people who are coming from a Microsoft
    Windows environment. JVM has a task bar and a Start button. If you find the wide-open
    world of Fluxbox too overwhelming, try JVM. It is also worth noting that JVM is
    very resource efficient, so if you have a very low power computer, you may want
    to give JVM a try. To try JVM, click on “Switch to JVM” on “WindowManager” sub-menu
    on the Fluxbox menu.'
