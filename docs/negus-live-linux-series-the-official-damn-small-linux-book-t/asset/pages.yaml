    # # WHAT IS DAMN SMALL LINUX?


    Before heading on any further, we need to define exactly what Damn Small Linux
    is. Damn Small Linux is an operating system, designed to run from live media (such
    as a bootable card-size CD) that, at its heart, is controlled by a Linux kernel.
    It is based on another Linux live CD called KNOPPIX, which, in turn, was created
    from a Linux distribution called Debian.


    Now, we need to sort all that out.


    # # Understanding Operating Systems


    An operating system is computer software that manages the interactions between
    the computer hardware and the applications you run to use hardware. The proprietary
    personal computing world, you are probably most familiar with Microsoft Windows
    and Mac OS/X operating systems. In the free and open source software (FOSS) world,
    most operating systems trace their roots back to UNIX.


    Damn Small is one of many FOSS operating systems that carries the Linux name because
    it includes the Linux software that is referred to as the kernel. The Linux kernel
    is the most critical part of the operating system because it provides the most
    basic system services: process management, device driver framework, file system
    support, and other critical system features. As new hardware, file types, and
    other components are connected to a Linux system, they can be added to the kernel
    in what are called *loadable kernel modules*.


    Linus Torvalds created the Linux kernel and continues to lead Linux kernel development
    today. This software is available from the Linux Kernel Archives (http://kernel.org).
    Most Linux distributions add a set of basic system utilities from the Free Software
    Foundation GNU project, which include many clones of commands that were originally
    available on UNIX systems.


    Although the latest kernel is the 2.6 kernel, DSL has chosen to stay with the
    2.4 kernel tree. This is primarily because the 2.6 is considerably larger. As
    security holes are found, however, backports of fixes from the 2.6 kernel are
    included with the 2.4 kernel used by DSL. Backports for improvements can be added
    in the same way.


    Likewise, instead of including the GNU utilities in the basic DSL, many Linux
    utilities are implemented through a single, compact utility called BusyBox. (Because
    BusyBox is not completely compliant with the GNU utilities some people'
  merge: -1
