    setupFromCD

    source/

    vmware/

    ```


    # Making Modifications, Additions, and Removals


    Two methods are available to access the DSL system for modifications, additions,
    or removals. The first method is direct; the second is *chrooting*.


    # Changing Content with the Direct Method


    Use a full path to identify the location of your KNOPPIX source or change to that
    directory as your working directory. For example, if your remaster were on the
    /mnt/hda4 partition, you could type:


    ```

    # cd /mnt/hda4/remaster/source/KNOPPIX

    ```


    Typically, to change the working directory on your mounted disk partition (for
    example, cd /mnt/hda4/remaster), then I prefix the commands to access the new
    source image files with source/KNOPPIX. From this point, my discussion will always
    be using the path relative to the working directory—that is, the directory containing
    the scripts, master, source, and iso directories.


    I mainly use the direct method. DSL is not pure Debian. Many packages, binaries,
    and scripts are not from the Debian repositories. Because of this and also the
    fact that times using Debian implies the implication of many other unwanted packages,
    the direct method is usually used.


    Most of the time, new applications, scripts, and modifications are first applied
    to a live DSL CD-ROM or frugal system. Often, these additions can be made into
    MyDSL extensions, and when fully tested, they simply be extracted directly with
    the use of the tar -C source/KNOPPIX option. Another option that I frequently'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# The Official Damn Small Linux Book


    use is to copy the new tar file to source/KNOPPIX and then later chroot in and
    do a tar extract as normal. Just be sure not to forget to delete the tar file
    sitting at the root (/) of the chrooted environment.


    Using this style keeps very tight control of what is added, changed, or deleted
    from the 50MB core DSL system.


    # Changing Content with the chroot Method


    You are now ready to use the chroot command. The chroot method changes the root
    (/) directory to the directory containing the source files:


    ```

    # chroot source/KNOPPIX

    ```


    At this point, the new root is now pointing at the “root” of the DSL image. All
    file operations to copy, move, or remove files are relative to this directory.
    Be sure to exit from this chrooted environment before you continue the remastering
    process!


    Most often, when KNOPPIX remastering is discussed, it is usually the chroot method.
    Using this method gives you access to the source directory as though it is the
    root filesystem. This means you will use /mnt/hda4/remaster/source/KNOPPIX as
    though it were /. You have full shell access to what will become the root directory
    of the new image.


    To install packages, you will need to mount the proc filesystem:


    ```

    # mount -t proc /proc

    ```


    Most likely, you will need to install software from the Debian Woody repositories.
    For this, you will need Internet access. Test your Internet connection by pinging
    a well-known server:


    ```

    # ping www.yahoo.com

    ```


    If you do not get a response, you need to set up your nameserver. This is accomplished
    by editing the /etc/resolv.conf file. For each nameserver, as provided by your
    ISP, add a line:


    ```

    nameserver 0.0.0.0

    ```


    where nameserver is the literal string and 0.0.0.0 is the actual IP number of
    a nameserver. After this is accomplished, test by pinging a well-known Internet
    site.


    To get Debian apt-get, you need to grab the standard utilities that are required:


    ```

    # mysql-load gnu-utils.dsl system

    # mysql-load dsl-dpkg.dsl system

    # apt-get update

    ```'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# CHAPTER 11 Setting Up a Full Remastering Environment


    Now, you are ready to install Woody packages. If you know you want packages from
    other Debian repositories, edit the file at /etc/apt/sources.list. Here''s an
    example of the contents of the sources.list file:


    ```

    deb http://archive.debian.org/debian-archive/ woody main contrib non-free

    # http://mirror.aernet.de/au/debian oldstable main contrib non-free

    # http://mirror.linux.org/au/debian oldstable main contrib non-free

    # http://mirrors.usc.edu/pub/linux/distributions/debian oldstable

    main contrib non-free

    ```


    The package Zile was used as an example in Chapter 10, of how to install a package
    in Damn Small Linux using MyDSL facility. MyDSL is the normal approach for installing
    software in DSL. Another way to install Zile software is by using the following
    command:


    ```

    # apt-get install zile

    ```


    The preceding procedure is most common with KNOPPIX-style live CD-ROM systems.
    It is not normally used with DSL. The reasons are the same as given in Chapters
    5 and 10. Using a package manager can quickly overrun “the small is beautiful”
    mantra of DSL.


    As shown in Chapter 10, many Debian packages are first pared down to MyDSL extensions
    and then loaded into the DSL core image via the direct method.


    > NOTE\If you have mounted the proc filesystem, be certain to unmount it before
    you exit the chroot environment.


    # Adding Common Elements: Menu and Icon


    Because DSL does not normally use Debian packages, the menu item and icon have
    to be manually created. This area was discussed at length in Chapter 10. This
    time, instead of being based of /tmp and /home/dsl/.xddesktop, you must edit the
    following files:


    ```

    /etc/skel/.fluxbox/menu

    /etc/skel/.jwmrc

    /etc/skel/.xddesktop/

    ```'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# The Official Small Linux Book


    Here are suggestions for creating a menu item and adding a desktop icon:


    +   To create the menu item, edit /etc/zile/.fluxbox/menu and /etc/zile/.jwmrc.
    Because Zile is a console-based program and its path is /usr/bin/zile, our menu
    item to be added looks like this:


    ```exec

    (Zile) (aterm -e /usr/bin/zile)

    ```


    The icon for Zile in /etc/zile/.desktop/zile.lnk looks like this:


    | Icon |

    | Type: Program |

    | Caption: Zile |

    | Command: aterm -e /usr/bin/zile |

    | Icon: /home/ds1/.xdktop/program.png |

    | X: 420 |

    | Y: 384 |


    > NOTE

    Iam using one of the generic icons available in DSL. Other generic icons are binary.png,
    gear.png, and shellscript.png. You may change the icon later by right-clicking
    the displayed icon. See Chapter 4, “Configuring and Saving DSL Settings,” for
    details.


    # Removing Applications


    Because DSL is extremely small in size and is not pure Debian, core applications
    are usually removed by force. This usually implies the `find` command to locate
    all related files. Often, the command `ldd` is used to display all the dependent
    libraries used by an application.


    Still, the process of removing an application can be quite daunting. DSLs'' compactness
    and density are the result of hacking code. For example, one of the common applications
    that many want to remove is Firefox. Using the standard approach, `find / -name
    firefox does not reveal all that was used for Firefox in DSL. There are Firefox
    references in configuration files. The system configuration for unionfs contains
    references to Firefox. The file at /etc/init.d/mkunion needs to be cleaned of
    the Firefox references. From this example, you can see that to unravel DSL, dense
    and compact size can be a challenge.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# Other Customizations


    Other features you may want to include passwords, themes and backgrounds, default
    time zones, DSL-specific features, and the default desktop.


    # Setting Passwords


    You should always use the chroot method if you want to change passwords. Then,
    issue the standard command to perform this action.


    # password


    Changing password for user root

    ter the new password (minimum of 5, maximum of 8 characters)

    Please use a combination of upper and lower case letters and numbers.

    ter new password: (Password entered will not be displayed)

    Re-enter new password: (Password entered will not be displayed)

    Password changed.


    # Themes and Backgrounds


    The standard theme for DSLs Fluxbox desktop is /usr/share/fluxbox/styles/default.
    This is actually a link to the current default theme, envane. The background image
    is actually specified in the theme. In DSL, you typically use the Fluxbox rootRootCommand
    to specify the image. The default images available for Fluxbox are located at
    /usr/share/fluxbox/backgrounds.


    > NOTE

    When using the direct method, always prefix the actual paths with source/KNOPPIX.


    # Language


    The default language, currently us, can be supplied as a boot option (lang=it)
    or by editing line 95 of the standard KNOPPIX script at /etc/init.d/knoppix-autoconfig.


    ```

    95 [ -n "$LANGUAGE ] || LANGUAGE=us

    ```


    # Default Timezone


    The default timezone is related to the language selection inside the knoppix-autoconfig
    script. Between lines 97 and 340, you can find one very large case statement.
    This case statement assigns basic time and language settings, based on the language
    that is currently set. Depending'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# The Official Damn Small Linux Book


    can also change the default timezone. For example, language specifies a time-zone
    of US/Eastern. This is where you can change it, for example, to US/Pacific.


    # DSL Specific


    Just as KNOPPIX uses a bash script from the boot time configurations, so does
    DSL. The script is located at /etc/init.d/dsl1-config. Many boot options can be
    found here. This is where the processing of boot time MyDSL extensions occurs.
    It is where many of the daemon requests are processed. Most options unique to
    DSL are in the master boot configuration file.


    # Default Desktop


    The default desktop can be supplied as a boot option (for example, desktop=jwm)
    or by editing the script at /etc/init.d/dsl1-config line 240. This line, as it
    is set by default, sets the default desktop to fluxbox, if jwm is not specifically
    identified (prob-from a boot option):


    ```

    240 case "$DESKTOP in fluxbox|jwm); ;; *) DESKTOP="fluxbox"; ;; esac

    ```


    # Advanced Customizations


    More advanced customizations can be used to directly modify the DSL boot process
    itself. This can include changing Isolinux boot loader files (as boot screens
    and options), as well as modifying the initial ramdisk used when DSL first boots.


    # Boot Screen and Initial Boot Options


    Using the preceding remastering setup, initial boot files for image, message,
    and default boot options are located at master/isolinux relative to your mount
    point and working remaster directory. The following three files are of interest:


    +   - isolux.cfg: This is the configuration file for the Isolinux boot loader.
    It specifies the image to be displayed, the boot message, and all of the default
    boot options, as well as several boot images to load. This is a simple text file
    and may be edited with any text editor.

    - boot.msg: This is the initial displayed text that appears before the boot prompt.
    Again, it is a simple text file and any text editor can alter its contents.

    - logo.16: This is the image shown on the initial boot screen. This image must
    be of the LSS16 image format. It is a 16-color, 640×480 image.'
