  md: '# CONFIGURING Your XAMPP Server


    Tools for managing your XAMPP server are also included with the XAMPP package.
    As with many Linux, most services in the XAMPP package can be configured using
    plain text files. However, there are also several graphical tools for managing
    XAMPP from a browser. Another part of setting up a server is to give it a static
    IP address, so those who are looking for your web server can find it.


    # Setting Up Your Network Interface


    For a desktop system, getting an arbitrary IP address assigned to you at boot
    time (usually by a DHCP service) generally works fine. However, with a web server
    that you want people to find, you typically want to assign a permanent IP address
    that doesn''t potentially change with each reboot.


    If you are creating a web server to use in temporary situations (such as in a
    classroom setting), you can simply have a DHCP server assign your server''s IP
    address. Then, you can tell your customers (or students) what that IP address
    is to let them connect to your server. However, for a permanent web server, you
    need to assign a static IP address.


    To run a permanent web server out of your home or small business, you might want
    to contact your Internet service provider and request a static IP address and
    purchase a domain name for your server. The ISP (or other domain registrar) will
    charge you yearly fee for securing the Internet domain name and probably charge
    a fee for the static IP address.


    Whether you get a static IP address and DNS name from your ISP or simply want
    a static IP address behind your home or firewall (which costs nothing), you can
    use the DSL Netconfig to try out your static IP address.


    From the DSL desktop, select System→Net Setup→ netcardconfig (assuming you are
    configuring your server for a wired Ethernet connection). Then do the following
    to configure your static IP address:


    +   1. When asked to use DHCP broadcast, select No. You are asked to enter an
    IP address for your Ethernet interface (preferably eth0).


    +   2. Enter the IP address assigned by your ISP or a private IP address and select
    OK. (If you are using your web server only on your LAN, choose a private IP address
    from the pool of IP addresses that is not already in use and not being handed
    out by a local DHCP server. For example, the addresses 192.168.0.1 through 192.168.0.254
    are often used for private LANs.)'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# The Official Damn Small Linux Book


    +   3. Enter the network Mask for your IP address and select OK. Again, you should
    get this number from your ISP. For private IP addresses, a netmask of 255.255.255.0
    leaves you with 254 potential IP addresses on your LAN.


    +   4. Enter the broadcast address for your Ethernet interface and select OK.
    For the example just shown, your broadcast address will be assigned to 192.168.0.255
    by default.


    +   5. Enter the default gateway IP address and press Enter. This is the IP address
    of the router attached to your computer or to your LAN that you get to the Internet.


    +   6. Enter the IP addresses of the DNS servers your system will use to resolve
    DNS host names into IP address. You can also get this information from your ISP.


    +   7. To check that your addresses were properly, type /sbin/ifconfig from a
    Terminal window. You should see the IP address, broadcast, and netmask that you
    configured for your Ethernet interface (eth0).


    The procedure shown here sets your IP address information for the current session,
    so you know it is working. To set your IP address permanently, refer to the “Saving
    Your XAMPP Server” section later in this chapter.


    # Editing XAMPP Configuration Files


    XAMPP keeps everything contained within one directory structure, you can find
    configuration files there as well. The following sections describe files in the
    /opt/lampp/etc directory for configuring XAMPP services.


    # Editing httpd.conf (Apache Web Services)


    Configure your Apache web server settings in this file. If you plan to make this
    public web server, you can change the ServerName entry from localhost to a full
    DNS name (such as example.com) or to an IP address.


    If want to host web content for multiple domain names from the same physical server,
    you can do that by setting virtual hosts. First, have your domain name registrar
    (or other DNS server provider) configure your domain names to point to the IP
    address of your server. Then, you need to add a NameVirtualHost line to httpd.conf,
    as well as a VirtualHost container for each host you want to be handled by the
    server. Here is an example:


    ```

    NameVirtualHost *

    <VirtualHost *>

    ServerName www.example.com

    ```'
  merge: -1
  pgno: 346
- img_proc: true
  md: '```

    DocumentRoot /opt/lampp/htdocs/example-com

    </VirtualHost>

    ```


    ```

    <VirtualHost *>

    ServerName www.example.net

    DocumentRoot /opt/lampp/htdocs/example-net

    </VirtualHost>

    ```


    In the virtual hosts you just showed, all network interfaces on the computer listening
    for HTTP requests for servers named www.example.com and www.example.net. You would
    place Web content for example.com in the /opt/lampp/htdocs/example-com directory,
    with content for example-net going in the /opt/lampp/htdocs/example-net directory.


    Check through the httpd.conf file if you want to change other features. For example,
    you should check that all the modules you need are loaded. Notice that the httpd
    daemon runs as the nobody user and group. See which files are presented when a
    directory name is requested (index.html, index.html.var, index.php, and so on).


    As set in httpd.conf, log files are stored in the /opt/lampp/logs directory. The
    log level and format of those logs are defined in httpd.conf as well. The last
    line in the httpd.conf file sources from the httpd-xamp.conf file, which you can
    check for special settings that are added by the XAMPP project.


    For more information on configuring httpd.conf and other features in Apache 2.2,
    refer to the Apache online documentation: http://httpd.apache.org/docs/2.2.


    # Editing php.ini (PHP Configuration)


    Depending on the type of PHP content you are hosting, you may need to change some
    of the settings in the php.ini file. For example, ASP-style tags (< %>) are off
    by default as is Year 2000 compliance.


    You may not need to change any of the settings in this file. However, you might
    want to just step through this file to make sure that the settings do not conflict
    with the type of PHP code included on your website.


    # Editing httpd.conf (FTP Server Configuration)


    The httpd.conf file is configured to be added and removed from your FTP site.
    By default, the nobody username is configured so it can be used to log in through
    the FTP service (using laamp_ as the password) and upload files to populate the
    content of your web server. You were instructed to change the nobody user''s password
    earlier in this chapter.'
