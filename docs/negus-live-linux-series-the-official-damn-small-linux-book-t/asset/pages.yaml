  md: '# The Official Damn Small Linux Book


    Note the following about the makesys script:


    +   - Line 2 provides the name of your ISO image file and checksum file.

    - Line 4 through 7 allow for handling both Isolinux and Syslinux versions of DSL.
    Syslinux uses a boot.img for the boot file, whereas Isolinux uses a directory.
    These lines provide a mechanism to back up/restore your Isolinux directory. The
    Syslinux boot.img is the standard DSL floppy image and therefore not to be included
