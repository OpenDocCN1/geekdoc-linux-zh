  md: '# Installing DSL

    Alternate Ways


    Running Damn Small Linux (DSL) from a live CD works in many cases. But there are
    also good reasons for running DSL from hard disk. Some older PCs can''t boot from
    a CD drive or may have no CD drive at all. There can also be speed and convenience
    reasons for running DSL from your hard drive. Some procedures described in this
    chapter let you install DSL on your hard drive without erasing the Windows or
    Linux systems that may be already installed.


    Chapter 2, “Booting DSL,” describes how to run DSL from a bootable CD or a DSL
    CD and DSL boot floppy. This chapter discusses:


    +   - Popular alternate DSL installation methods

    - How to get DSL to boot without a CD-ROM drive

    - Methods to prevent and install DSL without repartition your current Windows-based
    computer or changing the master boot record


    # OVERVIEW


    The fact that DSL supports many older laptops, while many of those laptops have
    no CD drive, can be a challenge. The challenge is that you need a way to boot
    Damn Small Linux when booting from CD is not an option. Many older computers have
    only a floppy drive and hard drive. Some PCs may have a PCMCIA port. Some computers
    have a Zip drive attached. Some computers may have USB ports, but only those that
    support an old USB 1.1 specification.


    Some systems have a CD drive, but that may be too slow. If the machine has a slow
    CD drive, you just may want to have the speed advantage of running DSL'
  merge: -1
  pgno: 171
- img_proc: true
  md: 'from the hard drive. In this chapter, I will discuss how to install on these
    limited systems using the devices just described.


    DSL has been designed to provide many options for additional applications and
    customizations that were once only available to a traditional hard drive installation.
    As a result, you can also enjoy DSL “installed” on a hard drive without the traditional
    installation method. Basically, this involves:


    +   - Setup of the DSL files from the CD-ROM onto a hard drive

    - Running from the compressed KNOPPIX image


    The huge advantage of this alternate methodology, running from the pressed image,
    is always starting with a pristine base system. It becomes an unbreakable system.
    If you do something to mess up the software, simply reboot to return to a clean
    system.


    This chapter also covers the more challenging installations for DSL.

    Let’s start by defining these alternate installation methods:


    +   - **Poorman’s—The Easiest Way to Run DSL**

    This is where the compressed image of DSL is stored on persistent media. This
    is by far the easiest setup, as only one file, KNOPPIX, is needed. This includes
    partition types of Linux, DOS, Win9X, WinME, and in a more limited fashion Windows
    XP/NTFS. By definition, this installation type requires a boot floppy. The boot
    floppy is the DSL standard boot floppy. If additional boot options are required,
    they are typed at the boot prompt.


    +   - **Frugal—The Most Popular Way to Run DSL**nArugal installation is a Poorman’s
    sans floppy diskette and without the need to boot options. (Sans floppy you need
    additional DSL files on the target partition.) This is typically set up on traditional
    Linux and Linux type partitions. But it too, Poorman’s, can be set up on DOS or
    Win9X. This is possible by using several boot loaders—for example, Lilo, Grub,
    Lindl, and LoadLin.


    > NOTE


    Windows versions later than ME no longer allow MSD mode operations. Therefore,
    you always need a boot floppy for either Poorman’s or Frugal. However, newer versions
    of Windows have the capability to run DSL virtually with either Qemu or VMWare
    (see Chapter 7, “Running DSL Embedded in Windows'
  merge: -1
