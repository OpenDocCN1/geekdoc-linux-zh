    # EDNA AND ACCESSING REMOTE MUSIC


    Okay, let''s pretend that you have a job at a repressive company that does not
    allow you to bring in your music, and also deploys a restrictive firewall that
    forbids access to a remote music server where you can access your music. What
    to do? Many work environments monitor and restrict access via HTTP, but nothing
    does Secure SSH (SSH) access to remote hosts. How does that help you if the music
    is on your private server but you can''t bring it into work? You may remember
    in Chapter 3, "Using DSL Applications," when I went about the FUSE filesystem
    (SSHFS) and how cool it is because it allows mounting drives via SSH. Well, you
    could use that in combination with the Edna server to access your remote music
    as if it were locally hosted! Yes, I know it''s geeky, but it is also pretty damn
    cool!


    Here is what you do: The first step is to mount your remote file system via SSHFS.
    You need to have root privileges, so open a root terminal. Before you use SSHFS,
    you need to load the fuse module. To this type, modprobe fuse. Now, you can use
    SSHFS to access your remote drive. You have to decide on a place for your mount
    point; we conveniently have /mnt/test/ available in DSL, so you may just want
    to use it. The syntax for the sshfs command is similar to the ssh and scp commands—it
    works with an IP address or domain name.'
