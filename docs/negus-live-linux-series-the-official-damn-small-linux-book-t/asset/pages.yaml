    the button causes the application to have normal virtual desktop function again.


    The buttons on the right side are much more familiar. The one with the underscore
    bar icons, which means it pulls the application from the desktop space and into
    the taskbar. You can click it in the taskbar to restore the application. The middle
    one on the right with the box-shaped icon maximizes and contracts an application.
    Finally, the big X closes the application.


    Double-clicking with the left mouse button on the top window dressing causes an
    application to pull up into the titlebar. Fluxbox calls this function *shade*.


    Resizing applications is really simple; just bring the mouse arrow to either of
    the bottom corners of an application, then press and hold the left mouse button
    down. You should notice that the mouse arrow replaced by a right angle graphic.
    While holding the mouse button down, move your mouse and you can see that the
    application is changing shape. Click the mouse and the application holds the new
    shape.


