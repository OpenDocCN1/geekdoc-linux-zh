    which virtual workspace you would like to send the applications group by clicking
    the top border area of the windowing. After the menu drops down, mouse over Send
    Group To. At this point, you can select which virtual workspace you want by clicking
    one of the selections.


    # Mounting Drives and Controlling Volume


    Look for the application in the lower-right corner, a volume and drive mounting
    application that we decisively call Docked.lua. You will see that the application
    basically splits into two sections:


    +   **Volume Control**—The top section is a volume control. Its function is simple:
    you move the dial with your mouse to adjust the volume. The button with the big
    M is mute—press it and the sound stops. Press it again or adjust the volume and
    the sound comes back. There is also a button labeled dMix. Click it and a more
    advanced sound mixer launches.


    +   **Drive Control**—On the lower half of the application, you will see a gray
    bar with lettering like hda1, sda1, cdrom, or some other variation. These are
    drives that have to be mountable by DSL.


    The lower button gives the status of the drive. It reads mounted, unmounted, or
    irregular, with the corresponding colors of green, red, and blue. To cycle through
    the drives, click the top button. When you see the drive that you would like to
    mount or unmount, click the lower button. Then, the application either does as
    you wish or shows an error explaining why the mounted status could not be changed.'
