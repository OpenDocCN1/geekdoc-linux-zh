    # POORMAN’S—An Easy Way to Try DSL


    If the PC on which you want to run DSL has a floppy drive, a Poorman''s install
    is a good way to configure DSL. By creating a boot floppy and installing DSL to
    an existing disk partition (Linux or Windows partitions), you can boot DSL from
    many older machines without erasing any software already installed on the machine
    and without changing the master boot record.


    Recall the DSL Install Options shown in Figure 8-1. With a Poorman''s install,
    many times, you may need to use a more capable machine to boot the DSL CD-ROM
    and prepare boot floppies or even a floppy only installation set. The following
    procedures describe how to get the floppy images you need and to do a Poorman''s
    install to existing Linux or Windows partitions.


    # Prepare Boot Floppies


    As previously defined, a Poorman''s install is needed if your target computer
    either cannot boot from its CD drive or has only a floppy drive. In either case,
    you need to create a DSL boot floppy. I have also prepared a DSL FreeDOS utilities
    diskette, containing a collection of DOS programs to assist in the installation
    and setup process.


    Using a more capable DSL booted machine that has a CD drive and floppy drive,
    creating these floppies is easy and automatic from the DSL Install Options menu.
    However, you can manually download and create the floppies as needed.


    To download these floppies, you should check for a local download mirror. DSL''s
    mirror collection is available at http://www.dammsallinux.org/download.html.


    +   1. Locate the files to download using a web browser or ftp client. For example:


    ```

    ftp://ibiblio.org/pub/Linux/distributions/dammsallinux/current/bootfloppy.img

    ```


    and


    ```

    ftp://ibiblio.org/pub/Linux/distributions/dammsallinux/current/bootfloppy-utils.img

    ```'
