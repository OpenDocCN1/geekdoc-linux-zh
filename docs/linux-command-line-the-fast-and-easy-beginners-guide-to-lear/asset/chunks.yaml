    ## net-tools


    ### Echo

    此命令将帮助你将一些数据（通常是文本形式）移动到文件中。例如，如果你想向已经创建的文件添加内容，或者完全创建一个新的文本文件，你只需输入：


    ![Description: 00023.gif](img/rsrc1UV.jpg)

    在这里，你不需要使用反斜杠来分隔空格，因为当你完成需要编写的内容时，你会添加两个三角形括号。


    ### Cat

    此命令用于显示文件内容。当你想要方便查看程序时，你会发现它非常重要。


    ![Description: 00024.jpeg](img/rsrc1UW.jpg)


    ### Nano, jed, vi

    首先，`nano` 命令是一个很棒的文本编辑器，它能够识别大多数语言，并能标亮彩色关键字。另一方面，`vi` 比 `nano` 更简单。你可以创建一个新文件，或使用编辑器修改文件。让我们举个例：你想创建一个名为
    `check.txt` 的文件。你可以使用 `nano check.txt` 命令创建它。编辑后，你可以按照 `ctrl+x` 的顺序保存文件，然后按 `y`（是）或
    `n`（否）。


    ![Description: 00025.jpeg](img/rsrc1UX.jpg)


    ### Sudo

    `sudo` 的意思是“super user do”（超级用户执行）。这意味着如果你想以 root 或管理员权限执行任何命令，都可以调用 `sudo` 命令。例如：你想编辑文件
    `viz. Alsa-base.conf` 或任何需要 root 权限的文件。


    ![Description: 00026.gif](img/rsrc1UY.jpg)

    你可以使用 `sudo bash` 命令进入 root 模式，然后输入你的密码。另一个你可以执行此操作的命令是 `su`，但在那之前你必须设置 root 密码。要这样做，你可以输入
    `sudo passwd` 命令然后输入新密码。


    ![Description: 00027.jpeg](img/rsrc1UZ.jpg)


    ### Df

    如果你想查看系统每个分区还剩多少磁盘空间，可以使用 `df` 命令。你只需要在命令行中输入它，就能看到每个挂载分区以及使用了多少或可用多少字节的空间。如果你想以兆字节为单位查看，可以使用
    `df -m` 命令。


    ![Description: 00028.jpeg](img/rsrc1V0.jpg)


    ### Tar

    当你需要在命令行中处理 tar 包（归档或在归档中压缩的文件）时，这个命令非常有用。你可以用它来压缩或解压缩各种类型的归档，如 `.tar.gz`、`.tar`
    和 `.tar.bz2`。它根据你提供的参数运行。例如，`tar -cvf` 会创建一个 `.tar` 归档，`-xvf` 解压 tar 归档，`-tvf`
    列出归档内容。你可以查看[这些](http://www.tecm.com/tar-command-examples-in-linux/)tar 命令以了解更多。


    ### Zip and unzip

    你会使用 `zip` 将文件压缩为 zip 归档，使用 `unzip` 从 zip 归档中提取它们。


    ### uname

    `uname` 是“UNIX name”的缩写。该命令显示系统信息，例如 Linux 内核的准确名称和版本以及你计算机的主机。下面的图片显示了带有参数 `-a`（`--all`
    的缩写）的 `uname` 命令。输出包含操作系统名称（Linux）、主机名（debian95）、内核版本及其编译日期（`4.9.8-7-amd64 #1
    SMP Debian 4.9.110-1 (2018-07-05)`）以及系统架构（x86_64）。


