  trans: '


    ## LibreOffice 办公件


    如果你习惯使用 Microsoft Office 来处理所有的办公应用需求，你会发现这套套件提供了几乎相同的功能。LibreOffice 包含了 `Calc`
    表格应用程序、功能类似于 `Powerpoint` 的 `Impress` 应用，以及功能类似于 `Microsoft Word` 的 `Writer` 应用。


    ## Kontact


    此应用配备了 `KDE`，它与 `KOrganizer` 和 `KMail` 等其他应用程序集成在一起。该应用程序可以显示你进入桌面时可能想要调出的所有内容，例如日程安排、新邮件等。所有这些信息都汇总在一个图形化格式的个人信息管理器中。你只需通过点击桌面面板上的图标或从主菜单启动，即可调出
    `Kontact`。你也可以通过点击位于 `Kontact` 窗口左侧格的图标，探索所有集成到 `Kontact` 中的应用。


    ## 计算器


    无论你使用的是 `GNOME` 还是 `KDE`，你都可以获得一个默认的计算器。这两款计算器都能执行科学计算，例如三角函数方程以及计算平方根和倒数。要查找计算器，请从主菜单中调出“附件”（Accessories）或“工具”（Utilities）。


    ## 多媒体应用


    几乎所有的 Linux 发行版都带有多媒体应用，大部分是音频播放器和 CD 播放器。还包含一些应用允许你使用数码相机或刻录 DVD 和 CD。如果你想播放视频或音乐文件，可能需要下载并安装额外的软件。


    ## 在 Linux 上使用数码相机


    大多数可用发行版都有一个默认应用程序，可以使用它从数码相机导入图像文件。例如，`Xandros` 和 `SUSE` 带有 `digiKam` 应用，它允许你通过
    `USB` 端口连接数码相机，然后从那里导入图像文件。`digiKam` 的功能类似于典型的媒体文件管理器。要使用它，请遵循以下指令：


    1. 将相机连接到 `USB` 端口或串口，然后开启相机。

    2. 加载 `digiKam`。你可以在“图像”（Images）或“图形”（Graphics）子菜单找到该应用。如果是第一次加载该应用，`digiKam`
    将询问你存储图像文件的默认位置以及你可能想要配置的其他偏好。

    3. 调出 `digiKam` 菜单，然后进入 `Settings->Configure digiKam`。

    4. 选择 `Cameras` 选项卡，然后选择 `Auto Detect`。如果相机被检测到并支持且应用正常，你就可以继续使用 `digiKam` 从设备中下载照片。你将看到一个显示所有照片的新窗口。

    5. 选择你想保存到计算机上的图像。完成后后，你可以将文件保存到目标文件夹中，甚至可以使用你选择的照片相编辑器编辑你的照片。


    如果 `digiKam` 找不到你的数码相机，只要相机带有 `USB` 接口，你仍然可以通过相机存储访问你的文件。你只需要遵循以下步骤：


    1. 通过 `USB` 端口连接相机。一旦设备连接并检测到，你就可以使用文件管理器窗口打开包含图像文件的文件夹。

    2. 通过拖放文件选择你想保存到文件夹中的照片。

    3. 关闭文件管理器并弹出设备。


