    system is different however below are some places to begin looking.Opening a TerminalIf
    you are using Linux, then you will get it in the Application - > System or Application-
    > Utilities. Also, you can ‘right-click’ on the computer and there will be an
    option ‘Open in Terminal.''If you are on Windows and wish to log remotely into
    another machine, you will require an SSH client. A rather perfect one is Putty.The
    Shell, BashWithin a command line, we have a shell. Which is a part of the operating
    system which defines how the terminal will look and behave after executing or
    running commands for you? There are different shells available however the most
    common one is referred to as bash which means Bourne again shell. I will assume
    that you are utilizing bash as your shell.If you wish to know the type shell that
    you are utilizing, you can use a command called echo to show a system variable
    showing your current shell. Echo is a type of a command utilized to display messages.echo
    $SHELL/bin/bashProvided that it prints something on the screen that ends in bash
    then everything is good.ShortcutsThe command line can appear daunting, however,
    don’t fret. Linux has a lot of shortcuts to make your life simple. Take note of
    each of them as they not only make your life simple but also, they will always
    save you from making mistakes like typos.The first shortcut is, when you type
    commands, they are stored in a history. You are able to traverse this history
    utilizing the up and down arrow keys on your keyboard. Semantics are the set of
    rules that determine the meaning of instructions written in a programming language.
    While syntax is checked by the interpreter at the time of execution of the program,
    mistakes in the semantics of the program are usually harder to detect. To avoid
    semantic mistakes, it is advised to spend time on planning and analysis of the
    problem before starting to code it. If planned properly, the program will have
    fewer logical and semantical mistakes and thus the implementation will take much
    less time.An example of mistake in the semantics of the language is when we calculate
    the mean of different numbers. Instead of dividing the sum of numbers with the
    (total number) if we divide it with (total number)-1 the result would be wrong
    but the interpreter would not show any errors because it does not understand the
    semantics of the programs, the programmer has to take care of it.Now let us take
    a look at various parts of a Python program. Unlike compiler-based languages,
    an interpreter-based language does not need a complete program before it can parse
    it. It can take a single line of code and interpret it for the computer.So, it
    is not a must that you have to type the whole command again, you can simply hit
    the up arrow a bit. Also, you are able to edit those commands utilizing the left
    and right arrow keys to move the cursor to the desired part.In this part, we will
    look the basic of moving around the system. Some tasks rely on being in a position
    to find them. As such, this stuff actually forms the basis of being able to work
    efficiently in Linux. Ensure that you understand it better.So, where are we?The
    initial command we are going to look at is pwd which means Print Working Directory.
    Some commands in Linux will be abbreviated; this makes it easier to memorize them.
    This command does that. It informs you what your present directory is. Try it
    now.Pwd/home/mikeSome commands on the terminal will depend on you being in the
    correct location. As you are moving around, it can be simple to lose track of
    your location. Utilize this command always so as to know where you are.What is
    your location?It is good to know where you are. Next you will wish to know what
    is there. The command for this work is Is. It’s short form for list. Let’s try
    it.lsbin Docs public-htmlpwd is run by itself without arguments. Is is more powerful.
    We have run it without any arguments in this case it will show a list of that
    location.ls [set of options] [file system location]In the example above, the square
    brackets imply that those items are options; we can rum the command with or without
    them.Let’s break it down:Line 1 – is the basis form. It shows the content of our
    present directory.Line 4 – is an individual command line option which shows that
    we are going to do a long listing which has the following:First character shows
    whether the file or directory is normal.Next nine characters are permissions for
    the directory or file.The next is the number of blocks.The next field shows the
    owner of the file.The next is the group where the file belongs.Next is the file
    size.Following up is the file modification time.Finally, is the file name.Line
    10 – is the command line argument. This tells us about the files contents.Line
    13 – is both an argument and a command line option. It did a long listing of the
    file.Lines 12 and 18 - shows that we have just cut some of the commands usual
    output for brevities sake.PathsPaths are important in being proficient with Linux.
    When we refer to a directory or file on the command line, we are referring to
    a path. A path is a way of finding a directory or file on the system.Absolute
    and Relative PathsAbsolute paths specify the location of a directory or file about
    the main directory. You can easily identify them as the begin with a/Relative
    paths specify the location of a directory or file about where we are presently
    in the system.Below is an example to illustrate:Pwd/home/mikels DocsMyfile1.txt
    myfile2.txt myfile3.txt…ls/home/mike/Docsmyfile1.txt myfile2.txt myfile3.txt…Line
    1 – we run pwd to show where we are present.Line 4 – we ran ls offering it with
    a relative path.Line 7 – we ran ls offering it with an absolute path.More on pathsBelow
    are more building blocks you can utilize to build your paths:- (tilde) – it is
    a shortcut for your home directory.. (dot) – it refers to your present directory...
    (dot dot) – it refers to the main directory.Below are some examples:pwd/home/mikels
    -/Docsmyfile1.txt myfile2.txt myfile3.txt…ls./Docsmyfile1.txt myfile2.txt myfile3.txt…ls../../bin
    boot dev etc. home lib var…ls/bin boot dev etc. home lib var…After trying around
    these on the terminal yourself, they will begin to make more sense. Ensure you
    understand how all these elements of constructing a path work.Let’s move around
    a bitWe utilize a command called cd (change directory) when we want to move around
    in the system. It works as follows.cd [file system location]When you run the command
    cd with no arguments, it will usually take you back to the home directory. The
    cd can run without a location as we show early in the shortcuts above however
    it will always run with an individual terminal argument which is the location
    we wish to shift to. Below are some examples:pwd/home/mikecd Docslsmyfile1.txt
    myfile2.txt myfile3.txt…cd /pwd/lsbin boot dev etc home lib var…cd-/Docspwd/home/mike/Docscd../../pwd/homeCdPwd/home/mikeTab
    CompletionWriting out these paths can be challenging. Tab Completion is a mechanism
    that the command line poses that will assist you in this situation.It is hard
    to demonstrate here so it is better if you try it out yourself. If you begin typing
    cd/hTab/Tab you will probably get a feel how it works.Summary:pwdPrint Working
    Directory.lsList the content of a file.cdChange Directories.Relative PathA directory
    or file location compared to where you are presently on the system.Absolute PathA
    directory or file in relation to the root of the file system.Chapter 1\. Getting
    startedAs for the preparation of disk space, this is the most crucial moment in
    the whole process of installing Linux. The fact is that if you install the system
    on a computer whose hard disk already has any data, then it is here that you should
    be careful not to accidentally lose it. If you install a Linux system on a “clean”
    computer or at least on a new hard disk, where there is no data, then everything
    is much simpler.Why can’t you install Linux in the same partition where you already
    have, for example, Windows, even with enough free space?The fact is that Windows
    uses the FAT32 file system (in old versions – FAT16) or NTFS (in Windows NT /
    2000), and in Linux, a completely different system called Extended File System
    2 (ext2fs, in the newest versions – journaling extSfs). These file systems can
    be located only on different partitions of the hard disk.Note that in Linux, physical
    hard disks are referred to as the first is hda, the second is hdb, the third is
    hdc, and so on (hdd, hde, hdf...).Sometimes in the installation program of the
    system you can see the full names of the disks - / dev / hda instead of hda, /
    dev / hdb instead of hdb, and so on – this is the same thing for us now. The logical
    partitions of each disk are numbered. So, on a hda physical disk, there are hda1,
    hda2, and so on, hdb can be hdb1, hdb2, and so on. Do not be confused by the fact
    that these figures sometimes go in a row. It does not matter to us.How to start
    installing Linux from diskTo begin installing Linux, insert the system CD into
    the drive and restart the computer by selecting the boot from CD. If you plan
    to install Linux over Windows, then the installation program can be run directly
    from it.Moreover, if you are running Windows 95/98, the installation will start
    immediately, and if the installation program was launched from under a more powerful
    system, for example, Windows 2000, XP, Vista, Seven will still have to restart
    the computer from the CD disk.Your computer may already be configured to boot
    from a CD. If the boot from the CD does not occur, when you restart your computer,
    enter the BIOS settings. On most systems, to do this, immediately after turning
    on the computer or restarting, press the Delete key or F11.After that, find the
    Advanced BIOS Settings section. Sometimes the section name may be different, but
    in any case, it is very similar to that in this book. Enter it by first moving
    the pointer to it using the cursor keys and then pressing the Enter key. Now find
    in the parameters either the item Boot Sequence (boot order), or, if not, the
    item 1st boot device (first boot device). Use the cursor keys to select the desired
    item and, by changing its value using the Page Up and Page Down keys, make the
    first bootable CD-ROM device. Press the Esc key to exit the section, and then
    F10 to exit the BIOS with the saved settings. Most likely, the computer will ask
    you to confirm this intention. Usually, to confirm, you must press the Y key,
    which means yes.All modern computers can boot from a CD. If for some reason your
    computer does not have this capability, you will have to create a boot diskette
    to install Linux. There are always special tools for this on the Linux distribution
    CD.Usually, they are located in a folder called dos tools (or in a folder with
    a similar name). There are images of boot floppies and a DOS program for creating
    them. Read the README files on the distribution CD for more detailed instructions.The
    installation of the Linux operating system can be divided into several stages:disk
    space preparation;selection of the programs (packages) you need;device configuration
    and graphical interface;install bootloader.The installation program takes control
    of the entire process. You should only answer questions if the installation does
    not occur in fully automatic mode.How to install Linux from a flash drive?It often
    happens that if you want to install the OS, a person is faced with the fact that
    his drive is broken or missing. Especially often this problem happens with laptop
    owners. But do not be upset, because there is an alternative: installing from
    a Linux flash drive. To do this, you do not need a great deal of knowledge in
    programming, because there are special programs that “burn” the Linux image onto
    your USB flash drive just like on a disk. You will only need to start the installation
    process.So, before you install Linux from a flash drive, you will need a flash
    drive with an image written onto it.First, you should prepare the BIOS for installation.As
    an example, consider installing a Linux Mint distribution. For the installation
    of Linux Mint from a flash drive to begin, you need to configure the startup parameters.We
    insert the USB flash drive into the computer, turn it on at the very beginning,
    when there is a black screen on the screen and a lot of text, press the F2 button.
    Depending on the version of the BIOS and the computer, it may be another button
    – F10, Delete or Esc.We get into the settings menu and now we need to find the
    “Boot” item. Again, in different versions of the BIOS it may be called differently
    but be guided by this word. After we have found the autorun menu, a list of priorities
    appears before our eyes. It contains: a hard disk, a disk drive, a removable hard
    disk, USB inputs, and so on. Our task is to find a flash drive in this list and
    put it in priority for 1 place.It is done this way: we point the arrows at the
    name (for example: “USB 40GB DEVICE”) and move it by pressing the F5 and F6 buttons
    until the USB flash drive is in 1st place.Now the system will start the flash
    drive first. Press F10 and confirm the output by entering the Y (Yes) key and
    pressing the Enter button.Reboot the computer.After that you should start the
    installation process.After the computer restarts, you will see the startup menu.
    Often it is decorated with various images, so you will understand exactly what
    it is. Press Enter.If nothing has changed or something went wrong, restart your
    computer and read the menu list for details. It is possible that not only the
    Linux installation, but also various programs are present on the recorded image.Then
    you should Install it from a Linux flash drive.All the torment behind! Already
    at the beginning of the installation, you will be greeted by a friendly Russian-language
    interface. Start by choosing a language. Select your preferred language.Next,
    you need to make sure that the computer has enough free hard disk space, is connected
    to a power source, and is connected to the Internet. You can immediately agree
    that the latest updates are automatically downloaded during installation.Click
    "Next." We get into the hard disk selection menu. In it, you can format and split
    partitions, if desired. Specify the partition (disk) in which you want to install
    the operating system and click the "Install Now" button.We fall into the section
    change menu. Here you can increase the amount of memory, change the file system
    type, format the partition and specify the mount point. Use the “Ext4” file system
    and set the mount point “/”. If there is no valuable information on the hard disk,
    it is advisable to format the partition. Click "Install Now".Now we select the
    country and city of residence so that the system automatically sets the time and
    other indicators for your personal needs. Also, specify the keyboard layout. It
    remains to enter the desired name for your computer, a name for the user and a
    password (optional). Click "Next" and start the installation process.After the
    installation is complete, restart the computer, remove the USB flash drive and
    wait for the Linux operating system to start.'
