    example, using the keyboard, you can:Ctrl-Ago to the beginning of the line. The
    same can be done by pressing the Home key;Ctrl-udelete current line;Ctrl-CAbort
    the execution of the current command.You can use the symbol; in order to enter
    several commands in one line. bash records the history of all commands executed,
    so it’s easy to repeat or edit one of the previous commands. To do this, simply
    select the desired command from the history: the up key displays the previous
    command, the down one and the next one. In order to find a specific command among
    those already executed, without flipping through the whole story, type Ctrl-R
    and enter some keyword used in the command you are looking for.Commands that appear
    in history are numbered. To run a specific command, type:! command numberIf you
    enter !!, the last command typed starts.Sometimes on Linux, the names of programs
    and commands are too long. Fortunately, bash itself can complete the names. By
    pressing the Tab key, you can complete the name of a command, program, or directory.
    For example, suppose you want to use the bunzip2 decompression program. To do
    this, type:buThen press Tab. If nothing happens, then there are several possible
    options for completing the command. Pressing the Tab key again will give you a
    list of names starting with bu. For example, the system has buildhash, builtin,
    bunzip2 programs:$ bubuildhash builtin bunzip2$ buType n> (bunzip is the only
    name whose third letter is n), and then press Tab. The shell will complete the
    name and it remains only to press Enter to run the command!Note that the program
    invoked from the command line is searched by bash in directories defined in the
    PATH system variable. By default, this directory listing does not include the
    current directory, indicated by ./ (dot slash). Therefore, to run the prog program
    from the current directory, you must issue the command ./prog.Basic commandsThe
    first tasks that have to be solved in any system are: working with data (usually
    stored in files) and managing programs (processes) running on the system. Below
    are the commands that allow you to perform the most important operations on working
    with files and processes. Only the first of these, cd, is part of the actual shell,
    the rest are distributed separately, but are always available on any Linux system.
    All the commands below can be run both in the text console and in graphical mode
    (xterm, KDE console). For more information on each command, use the man command,
    for example:man lscdAllows you to change the current directory (navigate through
    the file system). It works with both absolute and relative paths. Suppose you
    are in your home directory and want to go to its tmp / subdirectory. To do this,
    enter the relative path:cd tmp /To change to the / usr / bin directory, type (absolute
    path):cd / usr / bin /Some options for using the command are:cd ..Allows you to
    make the current parent directory (note the space between cd and ..).cd -Allows
    you to return to the previous directory. The cd command with no parameters returns
    the shell to the home directory.lsls (list) lists the files in the current directory.
    Two main options: -a - view all files, including hidden, -l - display more detailed
    information.rmThis command is used to delete files. Warning: deleting the file,
    you cannot restore it! Syntax: rm filename.This program has several parameters.
    The most frequently used ones are: -i - file deletion request, -r - recursive
    deletion (i.e. deletion, including subdirectories and hidden files). Example:rm
    -i ~ / html / *. htmlRemoves all .html files in your html directory.mkdir, rmdirThe
    mkdir command allows you to create a directory, while rmdir deletes a directory,
    provided it is empty. Syntax:mkdir dir_namermdir dir_nameThe rmdir command is
    often replaced by the rm -rf command, which allows you to delete directories,
    even if they are not empty [26].lessless allows you to page by page. Syntax:less
    filenameIt is useful to review a file before editing it; The main use of this
    command is the final link in a chain of programs that outputs a significant amount
    of text that does not fit on one screen and otherwise flashes too quickly [27].
    To exit less, press q (quit).grepThis command allows you to find a string of characters
    in the file. Please note that grep searches by a regular expression, that is,
    it provides the ability to specify a template for searching a whole class of words
    at once. In the language of regular expressions, it is possible to make patterns
    describing, for example, the following classes of strings: “four digits in a row,
    surrounded by spaces”. Obviously, such an expression can be used to search in
    the text of all the years written in numbers. The search capabilities for regular
    expressions are very wide. For more information, you can refer to the on-screen
    documentation on grep (man grep). Syntax:grep search_filepsDisplays a list of
    current processes. The command column indicates the process name, the PID (process
    identifier) ​​ is the process number (used for operations with the process — for
    example, sending signals with the kill command). Syntax:ps argumentsArgument u
    gives you more information, ax allows you to view those processes that do not
    belong to you.killIf the program stops responding or hangs, use this command to
    complete it. Syntax:kill PID_numberThe PID_number here is the process identification
    number, You can find out the process number for each executable program using
    the ps command. Normally, the kill command sends a normal completion signal to
    the process, but sometimes it does not work, and you will need to use kill -9
    PID_number. In this case, the command will be immediately terminated by the system
    without the possibility of saving data (abnormal). The list of signals that the
    kill command can send to a process can be obtained by issuing the command kill
    -l.Chapter 6\. How to use Linux desktopNow that you have Linux running on your
    computer, you will want to learn the basics. If you are coming from Windows or
    Mac OS, things will look different, but don’t become discouraged. You have already
    learned how to install new software, so make sure that you find everything you
    need. Once you are happy with your selection of software, let’s start to explore
    the rest of Linux.When you have logged in, you will be shown the desktop, much
    like with Windows and Mac OS. This is your primary working area. In Ubuntu 10.10,
    there will be a panel across the top, as well as one on the bottom of the screen.
    Just like with other graphical operating systems, you will move the cursor around
    with your mouse, and click on icons to activate them. See, it’s not that different,
    is it?Desktop PanelsThe bars on the top and bottom of the screen are panels, but
    you can customize your panels in a huge number of ways. By doing this, you can
    essentially create the Linux experience that perfectly suits your needs. For many,
    this is not needed, so don’t feel obliged to experiment with your panels. If you
    like the default experience, that is all you need to use.Your panels provide a
    place for you to start, when interacting with the desktop environment. They also
    give you various pieces of information about your computer. Notifications will
    appear on your panels as well. If you like, you can place your panels on the sides
    of the screen, by accessing the properties of your system.Accessibility OptionsIf
    you need special accessibility options, like larger icons, or an on-screen keyboard,
    there will be an icon to access these. It is different for various systems; it
    looks like an illustration of a person inside a circle for some. Clicking on this
    icon will take you to a list of options, such as turning on a screen reader, magnifying
    glass, changing the colors in contrast, sticky keys, ignoring duplicate key presses,
    and pressing and holding keys.NavigationIn order to move around inside your system,
    and access various files and software, you will need to learn how to navigate
    Linux. This sounds more difficult than it actually is. While different versions
    of Linux vary in how they deal with navigation, the process is pretty easy to
    pick up. If you click on your system settings, you will be taken to a list of
    options. Clicking on an option will take you to more options, etc., until you
    arrive where you want to go. The main menus are like tables of contents, and they
    will show you the more detailed sections of each part of your computer system.If
    you are used to using Windows or Mac OS, it should not take you long to figure
    out how to navigate through your computer. If you cannot find something, simply
    perform a search, and type in what you want to find. Ubuntu is especially powerful
    in this respect, as you can access a system, and online, search by using the Windows
    key on your keyboard.Command line is based on text, unlike the GUIs (graphical
    user interfaces) that people generally use these days. However, it can often be
    must simpler to use command line, especially when you want to get something done
    quickly. Do you remember the old days when Microsoft DOS was popular? You might
    recall seeing people working on computers, using nothing but text commands to
    get things done. That is what Linux command line does. There are different pieces
    of software for command line, and distributions will have their own versions.
    You can also install your own choice of command line application.The very thought
    of using command line scares a lot of people, and they have no desire to do so.
    However, since you are reading this section, let’s assume that you want to learn
    about command line, and begin with some basic commands. One great thing about
    working with command line is that you can work with a range of different Linux
    distributions, and always be able to do things the same way, with command line.
    Another reason that people like using command line is the pure power it gives
    them, although it is a little more complex to learn than graphical user interfaces.Open
    up your command line software, which is also knows as your system’s shell. This
    is called Terminal in Ubuntu, and you can find your shell with a quick system
    search. The keyboard shortcut to access Terminal is Ctrl + Alt + T, and this shortcut
    is the same for many versions of Linux.SudoWhile learning to install software,
    you learned about the sudo command. You will need to enter this at the start of
    some commands, where admin privilege is required, but you should not use sudo
    for ordinary commands.File and Directory CommandsIn order to access different
    parts of your system, you will need to look at directories, and the files they
    contain. Directories are the folders of your system, containing files, and more
    folders with files, etc.Here is a list of commands that will help you to navigate
    your files and directories:●       “~” indicates your home directory, such as
    /home or /home/user (with your username in the place of user).●       “ls” This
    will display a list of the files in the directory that you are currently looking
    at.●       “pwd” means “print working directory” and will tell you which directory
    you are currently in.●       “cd” will let you “change directory”, so that you
    can move around to different parts of your system.●       If you type “cd /” you
    will be taken to your root, or base-level directory, so that’s a good starting
    point if you become lost.●       “cd” and “cd ~” are two commands that will take
    you to your home directory.●        “cd ..” Will go back up one directory.●      
    “cd -” will simply go back to the previous directory that you were in.●      
    You don’t have to go through one directory at a time, if you know where you want
    to navigate. Let’s say that you want to go to your “Documents” directory, which
    is located in a directory called “My Stuff”. This might involve the command, “cd
    /my stuff/documents”.●       If you want to copy a file, use “cp” by entering
    “cp file mine /directory” where “mine” is the name of the file that you wish to
    copy, and “directory” is where you want to copy the file to. You can copy a directory
    in the same way, with the command “cp -r directory mine” where “mine” is a directory
    instead of a file.●       If you want to move a file (as with cut & paste), use
    the “mv” command instead of “cp”.●       To delete a file, use “rm” with the name
    of the file, where “rm” stands for remove.●        To delete an empty directory,
    use “rmdir”.●       To delete a directory, as well as anything that is inside,
    including directories and files, use “rm -r”●        Create a new directory with
    the command “mkdir”.●       “man” will show you a manual of commands. If you want
    a manual of the types of manuals, you can enter “man man”.Those are the basics
    of navigating files and directories with command line, as well as moving them
    around. In a graphical interface, these are similar to dragging, dropping, cutting,
    and pasting files and folders, as well as simply clicking into different folders.Running
    FilesNow that you have an idea of how to move around in your system, using the
    command line, it’s time to run some files. It’s pretty simple, and you can do
    it with this command:“./nameoffile.extension”In this example, “nameoffile” is
    the name of the file that you want to run, while “.extension” is the extension
    of the file. If you wanted to run text document called “story”, you would type
    “./story.txt”, as “.txt” is the correct extension for text files. Remember that
    you can “ls” (list) the files in a directory, to make sure that it contains the
    one that you want to run.If this is becoming too complex for you to understand,
    don’t worry. You can always go back to using the graphical interface when you
    become stuck and keep practicing with the command line in your own time.System
    CommandsIf you want to find out some information about your system, you can do
    that using command line as well. Here is a list of system information commands:●      
    To find out how much space has been used on your disks, use “df -h”. There are
    other ways to do this, but the “h” here stands for “human readable”, and it will
    display the information in megabytes.●       Use the command “du” to find out
    how much space a particular directory is using. This will show you information
    for all files, and directories, inside a directory. If you would rather an overview
    of the space used, the command “du -sh” will do this (with “s” meaning “summary”
    and “h” once again meaning “human readable”).●       To look at the total amounts
    of both used and free memory on your computer system, use the “free” command.
    To see this in megabytes, use the command “free -m”.●       To see an overview
    of the processes that are running on your system, use the “top” command (which
    stands for “table of processes”). After you have finished looking at your table
    of processes, you will need to press “q” to exit.●        To get an overview of
    all system information, use the command “uname -a”.●       If you want information
    about the Linux distribution that you are currently running, use the command “lsb_release
    -a”.●        To see information about your networks, use the command “ip addr”.Adding
    New UsersYou have already set up your own login details, but you can also add
    new users to your system. This is helpful if there will be more than one person
    using your computer.To create a new user on your computer, use the following command:●      
    “adduser newuser”, where “newuser” will be the user name of the person that you
    are adding. You can make this whatever you like.●        “passwd newuser” will
    let you give your new user a password.Using OptionsYou can add options to your
    commands, and some of the commands listed have shown you how to do this. If you
    were to use the command “ls -s”, that would use the “ls” command for listing the
    contents of a directory, with the “-s” option for adding file sizes as well. Another
    common option is the “-h” command, that you have already looked at, which makes
    the sizes “human readable”.If you were to type “ls -sh”, you would be asking for
    a listing of the contents of a directory, and adding the options to show the sizes
    of everything, as well as displaying those sizes in megabytes, instead of blocks.Keyboard
    ShortcutsIf you want to do something in Linux, and you use your graphical interface
    to look online for help, you will often find command line text that you can use.
    You don’t need to understand anything about using these commands, and you can
    still benefit from them. You will need to copy the text, by highlighting it with
    your mouse in a normal fashion. However, if you try to use the common keyboard
    shortcut “Ctrl + V” to paste into the command line shell, it will not work. To
    paste text with command line, press “Ctrl + Shift + V” instead.Using command line
    might seem like an awful lot of typing, but there are more keyboard shortcuts
    that you can use to save time:●        Down arrow (or Ctrl + N): go back to your
    previous command.●        Up arrow (or Ctrl + P): go through your previous commands.●      
    Enter: enter the command, once you have found what you are looking for, or you
    have typed what you want.●       Tab: will automatically complete file names and
    commands. If there is more than one option, it will give you a list to choose
    from.●       Ctrl + R: will let you search through the commands that you have
    already entered. This is extremely useful for when you have entered some long
    commands. Simply use this keyboard shortcut, and then type part of the command
    that you want. It will then display commands that start with the text you have
    entered. Press Enter when you have found what you are looking for.●       “History”:
    entering this command will display a history of every command that you have used,
    next to a number. If there are too many commands to display, use the command “history
    | less” to give you a list that you can scroll through.Use an Integrated Development
    EnvironmentWe already explored the process of using the command line terminal
    to write and execute code for Linux in Python. There is another option for doing
    this, and that is to use an Integrated Development Environment, or IDLE (you might
    could say that IDLE is a play on the fact that programmers tend to be lazy and
    are constantly looking for shortcuts). Ubuntu can be downloaded with a graphics
    IDLE, or you can download one separately. IDLE is written in Python, which makes
    it much easier to implement the code that you write.IDLE is a great program for
    beginner coders to use for several reasons. One is that it automatically colors
    different syntax features in different colors, making finding mistakes much easier.
    For example, key words, text, and comments will all appear in different colors.
    Just like highlighting in your college textbooks made finding what you need to
    study much easier, color-coding these different features makes finding your mistakes
    much easier.Another reason is because it uses a graphical user interface (GUI)
    instead of a command line interface. This makes it much more user friendly and
    easy to navigate. When using IDLE, you don’t necessarily need a text editor. You
    can write your code directly into IDLE, then execute it. If you are new to coding,
    you may want to consider using IDLE before moving on to the command line terminal.IDLE
    does have a number of problems associated with it, so many programmers prefer
    to move on from it to the command line terminal as soon as possible. Write PatchesKeep
    in mind that there are many different methods to writing a patch. This is just
    one of them.Diff is a command line program utilized by the Linux core development
    team. It compares the original source code with the changes that someone has proposed
    and shows exactly what needs to be done to implement those changes. You need to
    keep the original source code for the particular area that you want to improve,
    and also write out the source code for your patch. You don’t need to download
    a particular program; it is usually pre-packed with Linux operating systems. If
    you find that there is a problem in the execution of your code, you can compare
    your patch to the original source code using Diff to try to figure out where the
    problem is.There are a few challenges that present themselves when you want to
    get started with writing a patch. The first is that the source code for the Linux
    kernel is 15 million lines long. You would have to be incredibly dedicated and
    disciplined in order to sit down and read through all of it! The thought of that
    much code may be so overwhelming that you don’t even know where to start. The
    good news is that there are multiple points of entry for you to more easily find
    a specific location. You just have to find the right one and consider that your
    starting place. Additionally, another good place to get started with finding your
    way through the 15 million lines of source code is to look for the overall data
    structures. If you are trying to map your way through a forest, you don’t start
    by looking at the minute characteristics of individual trees. Instead, you start
    by trying to imagine a bird’s eye view of the entire forest. In other words, you
    try to understand the overall structure (the data structure), and then you can
    figure out a path through the structure (the bits and pieces of the source code). Another
    problem associated with getting started with the source code so that you can write
    a patch is the language. The kernel is written in C, but it is much more complicated
    than a standard C program. Reading the source code requires an advanced understanding
    of the C programming language. If you are not familiar with it, you may want to
    partner with somebody who is. Nevertheless, you can write a patch using Python.
    Obviously, the first thing you will need to do is isolate the segment of code
    that you want to modify. Maybe there are multiple changes that you want to make.
    Once you have isolated the code, you will need to write out your changes. Again,
    your changes may be written in Python, while the source code is in C. We’ll solve
    that problem in the next step. Cython is a compiler that translates between Python
    and C, as well as some other programming languages. You can use it to translate
    your patch code so that it can be applied to the source code. Cython is also a
    programming language that allows for C-based extensions to Python; make sure that
    you download the compiler. Using the compiler to translate Python into C is probably
    the fastest and easiest way of getting the job done. Once you have written in
    your patch, you want to test it out on your own computer. Run it in the command
    line terminal to see if it runs the way that you want it to run. The easiest way
    for your code to get rejected by the Linux core development team is for it to
    not work! Keep modifying it until it works exactly how you want it to work. Implement
    it on your own computer. That’s right. You can run the patched code on your own
    computer, even if it isn’t part of the Linux kernel. If it makes your computer
    run more optimally, then it may be time to take some steps to share it with the
    world as an indie programmer.Share it with friends. Do you know people who use
    Linux and might be interested in the patch that you made? Maybe you have some
    friends, programming cronies, or family members who are Linux enthusiasts (even
    if they are just getting started with Linux) and would be thrilled to have your
    patch applied to their computers. Share it on forums. GitHub and Stack Overflow
    are just two forums that are frequented by members of the Linux community. There
    are so many Linux users who use forums that, if you share your patch through them,
    you will likely find plenty of people who want to implement it on their own computers.
    You will need to upload it as a .tar file so that others can download it and execute
    it. And who knows? Your patch may become so ubiquitous that it ends up being accepted
    by the core development team as a part of the kernel after all!Chapter 7\. Working
    with the Command LineA command line is also referred to as a terminal. This is
    a text-based user interface to the system. With command line, the user can enter
    commands by simply typing them on the keyboard. When you run the command by pressing
    Enter on the keyboard, you get feedback as a text.To break this content down:Line
    1 : this presents the prompt to us as user bash. Once we have the prompt, we are
    supposed to enter a command, in this case, ls. This means that typically, a command
    is the first thing that we have to type. After which, we are supposed to key in
    an argument in the command line (-l/home/Gary). In this case, the first thing
    that you have to bear in mind is that these are separated by spaces. That is,
    after typing the command, then you put in space before you can type in the argument.
    The first argument that we have used in this case –l is also referred to as an
    option. Options play a significant role in modifying the behavior of a command.
    They are often listed before other arguments, and they begin with a dash (-)Line
    2-5 : These represent the outputs that we get once we run the commands, we keyed
    in. Most of the commands that we key into the terminal will yield outputs that
