    # 如何为 Linux 制作启动型 USB 闪盘


    如今，操作系统正变得越来越流行。你可能已经从朋友或熟人那里听过关于安装此类系统有多么简单的故事。显然，创建一个 Linux 启动型 USB 闪盘是在硬盘损坏或缺失驱动器的电脑、笔记本电脑或上网电脑上重新安装操作系统的极佳方法。让我们更好地了解一下这种安装方法吧！


    首先，你需要找到并下载 Linux 操作系统镜像。在互联网上寻找不同版本的 Linux 镜像非常简单，因为它们是“免费软件”且完全免费分发。从我们的网站、官方网站或种子站点下载所需的镜像。


    制作一个可启动的 Linux U 闪盘需要一个普通的 U 盘。其容量应为 `1GB` 或更高。


    接下来，你需要下载 `Unetbootin` 程序。这个程序将帮助我们制作启动型 Linux U 闪盘。你可以从 `unetbootin.sourceforge.net`
    页面下载。在网站顶部有针对三个发行版的按钮——Windows、Linux 和 Mac OS。例如，如果你现在使用的是 Windows，那么就点击 Windows
    按钮。


    下载完成后，程序会立即打开，你不需要安装它。如果启动时遇到问题（Windows 7），请“以管理员身份运行”。最初，程序勾选的是“发行版（Distribution）”，但我们需要将其切换到“磁盘镜像（Disk
    Image）”。我们还要指定 ISO 镜像。接下来，点击 `...` 按钮并选择我们之前从网上下载的镜像。


    如果你的 U 闪盘容量足够，建议在文件存储空间中分配空间。`100 MB` 就足够了。


    在程序窗口的最底部，选择你想要刻制的 U 闪盘。例如——类型：USB 驱动器；介质：E: \ \ 如果电脑只插入了一个 U 闪盘，程序将自动识别，无需任何选择。


    剩下的只需点击“OK”按钮并等待程序完成镜像刻录。这需要 `5-10 分钟`。这就是关于如何将 Linux 刻录到 U 闪盘所需的所有知识。刻录完成后，你必须重启电脑，或将
    U 闪盘插入你想安装 Linux 操作系统的电脑上。


    ## 如何选择要安装的程序


    现在，最关键的时刻——硬盘分区——已经过去。现在安装程序进入下一个阶段，它将提议你选择必要的程序（在 Linux 中，软件包传统上被称为程序，顺便说，从术语角度来看如此）。


    你可以简单地选择一种安装包选项（适用于家用电脑、办公室、连接局域网的工作站等）。或者，通过手动打开“软件包选择”开关，进入软件包选择窗口。Linux 发行版包含的所有程序在该窗口中被分为几个部分：系统、图形、文本、出版、声音、游戏、文档等。在每个部分中，你都可以选择（或相反，取消勾选）任何软件包。如果无法从程序名称判断其用途，请点击名称，特殊窗口中将出现该程序用途的简要描述。遗憾的是，在俄语版发行版中，通常并不是所有的描述都翻译成了俄语，因此某些描述可能是英语。


    选择好需要安装的包后，务必在屏幕上找到并勾选“检查依赖关系”框。事实上，某些程序可能依赖于其他程序，也就是说它们在工作中可能会使用其他程序的模块。


    某些程序可能需要任何其他软件包才能正常运行。在这种情况下，它们被称为一个程序依赖于另一个。例如，`kreatecd` CD 刻录程序仅包含图形用户界面，并调用
    `cdrecord` 控制台程序进行实际刻录，尽管用户在工作时看不到它。这意味着 `kreatecd` 程序依赖于 `cdrecord`。安装 Linux
    时，所有的软件依赖关系都会自动检查；你只需要开启相应的开关允许安装程序执行即可。


    检查依赖关系的复选框用于安装程序自动检查某些选定的程序是否使用了未被选择安装的包。在完成此类检查后，安装程序将为你提供这些包的列表，并建议也安装它们。我们应该同意，否则某些程序将无法运行。


    ## 配置设备和图形界面


    在你同意安装必要的包后，将必要文件复制到硬盘的过程将开始。这个过程非常长，所以你可以利用这段时间去喝咖啡，至少需要五到十分钟。然而，如果你的发行版记录在两张或更多光盘上，安装程序会偶尔要求你将必要的光盘插入驱动器。


    然后将开始配置额外设备和图形界面。这里有一个小细节。事实上，由于某些原因，大多数安装程序错误处理鼠标信息。因此，在这个阶段关于你拥有什么种鼠标的问题只需回答“简单的双键”或“简单的三键”。不要查看制造商、型号等列表。安装系统后，如果鼠标的额外功能（例如滚轮的操作）本身不起工作，可以单独启用。


    ## 安装引导加载程序


    完成上述操作后，新安装的系统已准备就绪。然而，安装程序将要求你回答最后一个问题：是否应该安装引导加载程序，如果有必要，安装哪一个？


    如果 Linux 是你电脑上唯一的操作系统，那么你不需要引导加载程序。在这种情况下，只需重启电脑并移除启动 CD。如果你特意更改了 BIOS 设置以允许电脑从
    CD 或软盘启动，那么现在安装完系统后，你可以重新配置电脑为仅从硬盘启动。要做到这一点，返回 BIOS 设置并更改启动顺序。然而，如果你指定了“通用”启动顺序——软盘、CD-ROM、IDEOS——你就无法再更改它，只需确保在开启和重启电脑时，没有插入启动软盘或
    CD，除非有必要从这些设备启动。


    ## 选择合适的 Linux 发行版


    发行版的流行程度。你的发行版越流行，在网上就越容易找到它的教程。大型社区意味着如果你在开发过程中遇到任何困难，你可以在该发行版的专用论坛中轻松获得帮助。最后，发行版越常见，为它创建的应用程序和软件包就越多。与其在某些奇特的发行版中忍受从源码编译，不如选择具有现成包基础的流行解决方案。


    开发命令处理这些。自然地，最好关注受 Canonical Ltd.、Red Hat 或 SUSE 等大公司支持的发行版，记住，即使是最好的 Linux 发行版也有不于它们的替代品。


    ### Linux Mint

    从 Windows 迁移的用户绝对需要安装 Linux Mint。它是最流行的 Linux 发行版。这是一个基于 Ubuntu 的非常稳定且易用的系统。Linux
    Mint 配备了直观界面和方便的应用程序管理器，因此你在寻找和安装程序时不会遇到问题。它有两个桌面：适用于现代电脑的 `Cinnamon` 和适用于旧电脑的
    `MATE`。这是一个非常简单的软件，适用于普通用户。不需要任何特定知识。当然，预装软件可能非常有用。


    ### Manjaro

    这是最新的 Linux 发行版之一。基于 Arch。Arch 是一个极其强大的功能发行版，但其 KISS（保持简单）哲学与其名称相反，对于初学者来说过于复杂。Arch
    仅通过命令行安装。与 Arch 不同，它有一个简单的图形安装程序，同时结合了 Arch 的强大功能，如 `AUR`（Arch 用户仓库）和滚动发布。这是 Linux
    包最丰富的来源。如果 Linux 中有某些应用程序可能已经存在于 `AUR` 中。在这个发行版中，你将一直享受各种桌面环境：功能强大的 `KDE`、平板的
    `GNOME`、`Xfce` 以及 `LXDE` 等。通过安装此发行版，你可以确保获得最新的更新。它带有自己的桌面环境。然而，没有什么能阻止你替换它。


    ### Debian

    该发行版将很好地运行服务器。这是一个稳定且保守的发行版，是 Ubuntu 和许多其他 Linux 系统的基础。它只使用最可靠的包，是服务器的良好选择。它具有稳定性和大量的应用程序。但在安装后，你可能需要手动配置。


    ### Kodi

    这是一种适用于媒体中心的 Linux 发行版。如果你想构建媒体服务器，严格来说，它不是发行版包，而是一个功能全的播放器。你可以在任何 Linux 上安装它，但最好选择
    Ubuntu。该发行版支持所有类型的视频和音频文件。它知道如何播放电影、音乐和组织照片。益于扩展，可以通过种子下载媒体文件，显示 YouTube 视频和其他流媒体服务。简而言之，Kodi
    可以完成一切。此外，Kodi 是非常美观的并针对遥控器或设备进行了优化。标准界面可能并不吸引所有人，但很容易替换。还有一些有趣的版本：适用于桌面的 `Kubuntu`；适用于旧电脑的
    `Lubuntu`；适用于平板的 `Ubuntu`；适用于笔记本电脑的 Linux 版本。


    ## 第二章：Linux 安装


    在继续安装之前，最好先检查 PC 的硬件。访问硬件供应商网站检查兼容性列表。


    - **DVD 驱动器**：要安装 Linux，必须有一个 DVD 驱动器，且电脑必须能够从其启动。

    - **硬盘**：如果使用 Live CD 且电脑仍从硬盘启动，则不需要。要安装 Linux，理想情况下至少有 `4GB` 的磁盘空间。Linux 支持 IDE
    和 SCSI 控制器。

    - **键盘**：所有键盘都适用于 Linux。

    - **显示器**：大多数安装程序都可以检测现代显示器。如果显示效果不好，选择显示器类型和特定分辨率（`1024x768`）。

    - **鼠标**：`PS/2` 或 `USB` 鼠标适用于 Linux。

    - **网卡**：安装程序可以检测大多数网卡。如果你在这一方面遇到问题，请在线查找额外信息。

    - **处理器**：要求的速度为 `700 MHz`。在速度方面，越高越好。

    - **内存**：越大越好。最小要求为 `512MB`。检查对应发行版的内存——其他可能需要更大的内存分配。

    - **声卡、显卡、打印机**：确保与 Linux 兼容。参考硬件供应商网站的信息。


    接下来，为 Linux 留空间。如果你选择在不移除当前操作系统的情况下安装 Linux，注意现有操作系统使用整个硬盘。这意味着 Linux 和当前操作系统需要共享硬盘以便两者共存。为了防止数据丢失，为了便于分区，你可以在
    Windows 上运行名为 `GParted` 的 GUI 工具。某些发行版（如 `openSUSE` 或 `Android Desktop`）可以自动为
    Linux 创建分区。如果你的发行版提供此功能，你不再需要分区工具。


    ## 安装步骤


    前往 Linux 发行版下载文件。下载的文件带有安装步骤。在本节中，我们将讨论任何发行版的通用安装步骤。


    步骤 1：准备 CD/DVD 安装程序或 Live CD。下载计划安装的发行版副本并将其刻录到 CD/DVD 上。


    步骤 2：确保 PC 可以从 CD/DVD 启动。如果驱动器中有 CD/DVD 时电脑仍从硬盘启动，请首先更改启动设备。进入 BIOS 并更改启动顺序——选择
    CD/DVD 驱动器作为启动启动。你可以通过重启 PC 并按键（大多数电脑上为 `F2` 或 `Del`）进入设置菜单。分配 CD/DVD 为第一启动项后，放入放入驱动器并重启电脑。


    步骤 3：如果你使用 Live CD，电脑将从 Live CD 加载操作系统。安装完成后重启电脑。


    ## 安装后 X 不工作


    如果你在安装期间看到 GUI，但在首次重启后遇到灰色屏幕或中间带有 X 的黑屏，这里有一些可以故障排除的步骤：重启 PC。按下 `Ctrl+Alt+Delete`。PC
    启动时，如果发行版使用 GRUB（统一引导加载程序），按下 `A` 。对于 `LILO`，跳过此步。GRUB 引导加载程序将显示 Linux 内核的命令行并询问你想做什么。对于
    GRUB，输入空格然后输入 `single`。如果使用 `LILO`，输入 `single` 然后按回车。Linux 内核将以单用户模式启动并显示以下提示符：`sh-`。一旦看到此提示符，你现在可以配置
    X。根据你使用的发行版，X 使用配置文件来设置你的显示卡、显示器和分辨率。有时由于 Linux 安装程序的配置不正确会出现这个问题。通过创建一个有效的配置文件来解决这个问题：输入以下命令：


    ```


    当你输入此命令后，X 服务器将创建一个配置文件。你会看到屏幕变白然后显示几条消息。使用文本编辑器 `vi` 编辑 `/etc/xorg.conf.new`
    文件。在 "Files" 部分之后插入以下行：

    ```

    ```

    输入以下命令启动 X 服务器：

    ```

    ```


    一旦你看到带有 X 光标的空白屏幕，说明配置文件工作正常。使用 `Ctrl+Alt+Backspace` 停止 X 服务器。输入以下命令将配置文件复制到 `/etc/X11`
    目录：


    输入单词 `reboot` 或按下 `Ctrl+Alt+Delete`。


