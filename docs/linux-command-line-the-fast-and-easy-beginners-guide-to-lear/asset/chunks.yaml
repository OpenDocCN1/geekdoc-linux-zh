    as follows:user@bash: ssh Gary@hpc.ucdavis.edu.ukUnauthorized access is prohibited.ssh
    Gary@hpc.ucdavis.edu.uk’s Password:Last login: Fri Feb 17 14:34:27 2017 from 40.290.160.11Once
    you enter the account username, the system will prompt you to key in a password
