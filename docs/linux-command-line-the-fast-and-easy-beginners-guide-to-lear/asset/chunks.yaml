- fmt: '

    ## LibreOffice Suite


    If you are used to using Microsoft Office for all your office application needs,
    you will find that this suite offers almost the same features. LibreOffice comes
    with `Calc` spreadsheet application, the `Impress` app which functions like `Powerpoint`,
    and the `Writer` app, which functions like `Microsoft Word`.


    ## Kontact


    This app comes with the `KDE`, which is integrated with other applications such
    as the `KOrganizer`, and the `KMail`. This application displays everything that
    you may want to pull up when you enter your desktop, such as your schedule, new
    emails, and more. All these information are summed up in a personal information
    manager that is available in a graphical format. You can pull up `Kontact` by
    simply clicking on your desktop’s panel icons or by launching it from the main
    menu. You can also explore all the apps that are integrated to `Kontact` by clicking
    on the icons located on the `Kontact` window’s left pane.


    ## Calculators


    You get a default calculator available to be used whether you are using `GNOME`
    or `KDE`. Both calculators are able to do scientific functions, such as trigonometry
    equations and getting square roots and inverses. To look for the calculator, pull
    up `Accessories` or `Utilities` from the main menu.


    ## Multimedia Apps


    Almost all Linux distros come with multimedia apps, which are mostly audio players
    and CD players. There are also some apps that are included that will allow you
    to use digital cameras or burn DVDs and CDs. If you want to play a video or a
    music file, you may need to download and install additional software.


    ## Using Digital Cameras with Linux


    Most of the distros available have a default application that you can use to import
    image files from digital cameras. `Xandros` and `SUSE`, for example, arrive with
    the `digiKam` app, which allows you to simply connect your digicam through the
    `USB` port and then import your image files from there. `digiKam` functions like
    a typical file manager for media devices. To use it, follow these instructions:


    1. Attach your camera to the `USB` port or serial port, and then turn the camera
    on.

    2. Load `digiKam`. You can find the app under the `Images` or `Graphics` submenu.
    If you are loading the app for the first time, `digiKam` will ask you for the
    default location where it will store image files, plus other preferences that
    you may want to configure.

    3. Pull up the `digiKam` menu, and then go to `Settings->Configure digiKam`.

    4. Select the `Cameras` tab, and then choose `Auto Detect`. If your camera is
    detected and supported but the app, then you can proceed using `digiKam` to download
    your photos from your device. You will see a new window that will display all
    your photos.

    5. Select the images that you want to save on your computer. After doing so, you
    can save the files in your target folder and even edit your photos with your chosen
    photo editor.


    If `digiKam` cannot find your digital camera, you can still access your files
    using the camera storage, as long as it comes with a `USB` interface. All you
    need to do is follow the following steps:


    1. Connect the camera through the `USB` port. Once the device is connected and
    detected, you can open the folder that contains your image files using the file
    manager window.

    2. Select the photos that you want to save to your folder by dragging and dropping
    the files.

    3. Close the file manager and eject the device.

    '
