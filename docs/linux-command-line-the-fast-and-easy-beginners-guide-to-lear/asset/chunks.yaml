    - [Conclusion](#part0013.xhtml)\n\n# Introduction\n\nCongratulations on downloading\
    \ command Line and thank you for doing so. When you take a look at the Linux,\
    \ it is imperative to try and look back at its evolution. Despite being one of\
    \ the most powerful operating systems today, Linux had humble beginnings, and\
    \ below is the history of how it came to be.\n\n## Humble Beginnings\n\nIn 1969,\
    \ Unix came to life thanks to Ken Thompson and Dennis Ritchie. From that, several\
    \ projects came up based on Unix, trying to take it a step further. Projects as\
    \ BSD and MINIX all came up during this time. All this was water under the bridge\
    \ until a bright student by the name of Linus Torvalds combined the knowledge\
    \ he had about the previous system and came up with a Kernel that would later\
    \ take the world by storm.\n\n1991 is the true birth of Linux. Linus created a\
    \ free terminal based on MINIX, and he named his version Linux. Although he did\
    \ not want it called Linux since it would have seemed egoistic, a friend renamed\
    \ the version that had been uploaded for future development and thus the name\
    \ was born.\n\n## The Desktop\n\nThe period between 1992 and 1994 saw the growth\
    \ of the desktop. Slackware, Debian and Red Hat Linux were released during this\
    \ period with kernel version 0.95 as well as TCP/IP stack. However, the release\
    \ of Linux 1.0 in March 1994 was the game changer. This version boasted of 17,250\
    \ lines of code, something that was extraordinary at this time.\n\n## The Launch\
    \ of Gnome and KDE\n\nThe next chapter on the history of Linux took place between\
    \ 1995 and 1999. Linux came out during this time, and it is believed to be the\
    \ first Linux distribution to support boot and NFS. It was possible to copy an\
    \ installed version onto a similar machine. It is this distro that set the platform\
    \ for SUSE Linux that we know today. The Red Hat branch was not left behind. Within\
    \ these five years, it had spearheaded the evolution of the Linux kernel from\
    \ version 1.2.0 to 2.2. This pre-millennium era also saw a huge improvement in\
    \ memory management and support for PowerPC architecture come to life. This was\
    \ also when Linux started gaining popularity as the server OS of choice amongst\
    \ IT professionals. Other notable developments within this period were the establishment\
    \ of the KDE and Gnome environments. KDE was founded by Matthias Ettrich, then\
    \ a student at the University of Tübingen. On the other hand, Red Hat had evolved\
    \ into the Gnome environment. While all these changes were happening, Sun and\
    \ Oracle announced official support for the different versions of Linux.\n\n##\
    \ Live Distributions\n\nThe next five years after the millennium hype saw the\
    \ rise of some amazing things in the Linux family. Many Linux powered computers\
    \ came to light, and the kernel also underwent a lot of changes. Heaps of new\
    \ applications were developed and above all, the first live distro came to life.\
    \ Knix was popular between 2000 and 2005 because it could boot directly from CD.\
    \ This set the bar high enough for other Linux distros. It is also imperative\
    \ to note that Linux has also started losing its originality and looking more\
    \ and more like Microsoft operating systems. This prompted the formation of the\
    \ Linux Foundation to ensure that it regained its freedom and independence. Another\
    \ notable milestone during this period was the release of Linux kernel version\
    \ 2.4 which had support for USB, PC cards, EXT3 file system, RAID, Bluetooth and\
    \ PnP capabilities.\n\nSemantics are the set of rules that determine the meaning\
    \ of instructions written in a programming language. While syntax is checked by\
    \ the interpreter at the time of execution of the program, mistakes in the semantics\
    \ of the program are usually harder to detect. To avoid semantic mistakes, it\
    \ is advised to spend time on planning and analysis of the problem before starting\
    \ to code it. If planned properly, the program will have fewer logical and semantical\
    \ mistakes and thus the implementation will take much less time. An example of\
    \ mistake in the semantics of the language is when we calculate the mean of different\
    \ numbers. Instead of dividing the sum of numbers with the `total number` if we\
    \ divide it with `total number-1` the result would be wrong but the interpreter\
    \ would not show any errors because it does not understand the semantics of the\
    \ programs, the programmer has to take care of it.\n\nNow let us take a look at\
    \ various parts of a Python program. Unlike compiler-based languages, an interpreter-based\
    \ language does not need a complete program before it can parse it. It can take\
    \ a single line of code and interpret it for the computer. This kernel was so\
    \ powerful that it became the longest supported one, ending with the release of\
    \ `2.4.37.11` in 2011. Further updates to `2.6` saw the support for more CPUs,\
    \ filesystem sizes and EXT4.\n\n## The Ubuntu Era\n\nAfter 2005, things had started\
    \ to stabilize, and this led to what came to known as the Ubuntu era of 2006 to\
    \ 2012. Linux Mint has remained one of the most popular distributions. Although\
    \ the beginnings have been small, the future still holds a lot for Linux and only\
    \ time will tell.\n\n## Command line basics\n\nThe command line is simple. I can\
    \ tell you how it is done because each system is different however below are some\
    \ places to begin.\n\n### Opening a Terminal\n\nIf you are using Linux, then you\
    \ will get it in Application. Also you are able to right-click on the computer.\
    \ If you are on Windows and wish to log into another machine, you will require\
    \ `SSH` client. A perfect one is `Putty`.\n\n### The Shell, Bash\n\nWithin a command\
    \ line, we have a shell. Which is part of the system which defines how the terminal\
    \ will look and behave after executing or `bash`. If you wish to know what type\
    \ is your shell, you can use a command called `echo` to show your current shell.\n\
    \n```bash\necho $SHELL/bin/bash\n```\n\n### Absolute and Relative Paths\n\nPaths\
    \ are important in being proficient with Linux. When we refer to a directory or\
    \ file on the command line, a path is a way of finding it.\n\n- **Absolute paths**\
    \ specify the location of a directory or file about the main directory. You can\
    \ easily identify them as `/home/mike`.\n- **Relative paths** specify the location\
    \ of a directory or file about where we are presently in the system. Below is\
    \ an example: `/home/mike`.\n\n### What is your location?\n\nIt is good to know\
    \ where you are. Next you will wish to know what is there. The command for this\
    \ work is `ls`. It’s short form for list. Let’s try it.\n\n```bash\nls\nbin Docs\
    \ public-html\n```\n\n`pwd` is run by itself without arguments. `ls` is more powerful.\
    \ We have run it without any arguments in this case it will show a list of that\
    \ location.\n\n### ls [set of options] [file system location]\n\n```bash\nls [set\
    \ of options] [file system location]\n```\n\nIn the example above, the square\
    \ brackets imply that those items are options; we can run the command with or\
    \ without them. Let’s break it down:\n\n- Line 1 – is the basis form. It shows\
    \ the content of our present directory.\n- Line 4 – is an individual command line\
    \ option which shows that we are going to do a long listing which has the following:\n\
    \    - First character shows whether the file or directory is normal.\n    - Next\
    \ nine characters are permissions for the directory or file.\n    - The next is\
    \ the number of blocks.\n    - The field shows the owner of the file.\n    - The\
    \ next is the group where the file belongs.\n    - Next is the file size.\n  \
    \  - Following up is the file modification time.\n    - Finally, is the file name.\n\
    - Line 10 – is the command line argument. This tells us about the files contents.\n\
    - Line 13 – is both an argument and a command line option. It did a long listing\
    \ of the file.\n- Lines 12 and 18 - shows that we have just some of commands.\n\
    \n### Tab Completion\n\nWriting out these paths can be challenging. Tab Completion\
    \ is a mechanism that the command line poses that will assist you in this situation.\
    \ It is hard to demonstrate here so better if you try it yourself. If you begin\
    \ typing `cd/home/` you will probably get a feel how it works.\n\n## Summary:\n\
    \n- `pwd`: Print Working Directory.\n- `ls`: List the content of a file.\n- `cd`:\
    \ Change Directories.\n- **Relative Path**: A directory or file location compared\
    \ to where we are presently on the system.\n- **Absolute Path**: A directory or\
    \ file in relation to the root of the file system.\n\n## Moving around a bit\n\
    \nWe use a command called `cd` (change directory) when we want to move around\
    \ in the system. It works as follows:\n\n```bash\ncd [file system location]\n\
    ```\n\nWhen you run the command `cd` with no arguments, it usually takes you back\
    \ to the home directory. Below are some examples:\n\n```bash\ncd\n```\n\n\n```bash\n\
    cd /home/mike\n```\n\n```bash\ncd ../\n```\n\n```bash\ncd /\n```\n\n***\n\n##\
    \ How to start installing Linux from disk\n\nTo begin installing Linux, insert\
    \ the system CD into the drive and restart the computer by selecting the boot\
    \ from CD.\n\nYour computer may already be configured to boot from a CD. If the\
    \ boot from the CD does not occur, when you restart your computer, enter the BIOS\
    \ settings. On most systems, to do this, immediately after turning on the computer\
    \ or restarting, press the `Delete` key or `F11`.\n\nAfter that, find the Advanced\
    \ BIOS Settings section. Sometimes the section name may be different, but in any\
    \ case it is very similar to that in this book. Enter it by first moving the pointer\
    \ to it using the cursor keys and then pressing the `Enter` key. Now find in the\
    \ parameters either the item `Boot Sequence` (boot order), or if not, the item\
    \ `1st boot device` (first boot device). Use the cursor keys to select the desired\
    \ item and, by changing its value using the `Page Up` and `Page Down` keys, make\
    \ the first bootable CD-ROM device. Press the `Esc` key to exit the section.\n\
    \n## Why can’t you install Linux in the same partition where you already have,\
    \ even with free space?\n\nThe fact is that Windows uses the `FAT32` file system\
    \ (in old versions – `FAT16`) or `NTFS` (in Windows NT /2000), and in Linux, a\
    \ completely different system called `Extended File System 2` (`ext2fs`, in the\
    \ newest versions – journaling `ext4`). These file systems can be located only\
    \ on different partitions of the hard disk. Note that in Linux, hard disks are\
    \ referred to as the first is `hda`, the second is `hdb`, the third `hdc`, and\
    \ so on (`hdd`, `hde`, `hdf...). Sometimes in the installation program of the\
    \ system you can see the full names of the disks - `/dev/hda` instead of `hda`,\
    \ `/dev/hdb` instead of `hdb`, and so on – this is the same thing for us now.\
    \ The logical partitions of each disk are numbered. So, on a `hda` physical disk,\
    \ there are `hda1`, `hda2` and so on, `hdb` physical disk, there are `hdb1`, `hdb2`\
    \ and so on. Do not be confused by the fact that these figures sometimes go in\
    \ a row. It does not matter to us.\n"
