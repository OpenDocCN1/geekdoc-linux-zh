    a long document, as well as magnify or zoom out on document sections. You can
    find this application by going to Graphics->Post Script Viewer in Fedora.Chapter
    4\. Becoming a Linux power userIn Linux, this command prompt offers a very powerful
    way for managing users. You can use the command line to create and delete users.
    These users can also be assigned certain privileges as to what they can or cannot
    do with the system and its files. This shows how the terminal is a powerful tool.
    These users can also be grouped together into a single group. Addition and deletion
    of these users from a group is also possible. This is what we are going to explore
    in this chapter.‘Group’ CommandsIn Linux, groups are defined in the file ‘/etc/group
    file’. This file contains the name of the group, its id and the list of users
    belonging to each particular group. To check the available groups in your system,
    run the following command:$ groups              ![Description: 00039.jpeg](rsrc1TZ.jpg)From
    the figure above, it is very clear that my system has 8 groups. If you need to
    create a new group and give it the name ‘group1’, run the following command:groupadd
    group1It is worth noting that most Linux distros create a group for the user and
    give it the name they have used as the account name. Once you have created your
    group using the above command, it is important to verify that it has really been
    created. This can be done by viewing the contents of the file ‘/etc/group’. If
    you can’t find the name of the group, you have created then something must have
    gone wrong with its addition. The contents of this file can be viewed either in
    the command window or can be opened in the vim editor as follows:cat /etc/group              -or-              vi
    /etc/groupHowever, if you use the second method, that is, viewing it on the vim
    editor, make sure that you don’t alter its contents as this might result into
    errors. To add the group id to your group, use the ‘–g’ option as shown below:Groupadd
    –g 1300 group1idTo create a system group, use the –r option as shown below:Groupadd
    –r systemgroupWe can now use the ‘useradd’ command which can be used for either
    a new user to the system or for updating the information of any available user.
    Let us create a new user named ‘user1’:useradd -c "User" -d "/home/user1" -s "/bin/bash"
    –user1In the above command, we have used many parameters. Let us define their
    purpose:


    1.  ‘-c’ - this will be used to designate the name of the user. It is the name
    to be displayed on the login window. In our case, this is “User”.


    2.  ‘-d’ - the path signifying the user’s home directory. If you don’t specify
    this, it will be created by default. In our command above ‘/home/user1’ will be
    our user’s home directory.


    3.  ‘-s’ - this will establish the default login shell for the user we have created.
    In our case the default shell for ‘user1’ will be the ‘bash’ shell.


    Other options that can be used together with the ‘useradd’ command include the
    following:


    4.  ‘-b’ - specifies the base directory of the system. This is the ‘/home’ for
    most Linux distros and is used for the purpose of the home directory. If we don’t
    specify the ‘–d’ option above while creating a new user, this is made the default
    home directory for the new user.


    5.  ‘-g’ - this specifies the primary group name or ID. If you don’t specify this
    option while creating a new user, a new group with a name similar to the login
    name is created and a group id is assigned.


    Example:useradd –g 200 user1'
