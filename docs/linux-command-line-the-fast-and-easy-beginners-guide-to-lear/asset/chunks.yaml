    \ on your disks, use `df -h`. There are other ways to do this, but the `h` here\
    \ stands for \"human readable\", and it will display the information in megabytes.\n\
    - Use the command `du` to find out how much space a particular directory is using.\
    \ This will show you information for all files, and directories, inside a directory.\
    \ If you would rather an overview of the space used, the command `du -sh` will\
    \ do this (with `s` meaning \"summary\" and `h` once again meaning \"human readable\"\
    ).\n- To look at the total amounts of both used and free memory on your computer,\
    \ use the `free` command. To see this in megabytes, use the command `free -m`.\n\
    - To see an overview of the processes that are running on your system, use `top`\
    \ command (which stands for \"table of processes\"). After you have finished looking\
    \ at processes, you will need to press `q` to exit.\n- To get an overview of all\
    \ system information, use the command `uname -a`.\n- If you want information about\
    \ Linux distribution that you currently running, use the command `lsb_release\
    \ -a`.\n- To see information about your networks, use the command `ip addr`.Adding\
    \ New UsersYou have already set up your login details, but you can also add new\
    \ users to your system. This is helpful if there will be more one person using\
    \ your computer. To create a new user on your computer, use the following command:\
    \ `adduser username`, where `username` is the name of the person that you are\
    \ adding. `passwd username` will let you give your user a password.Using OptionsYou\
    \ can add options to commands, and some of the commands have shown you how to\
