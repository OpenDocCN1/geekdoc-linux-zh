    ### rmdir

    ```bash

    mkdir training

    ```

    `rmdir` 命令用于删除空目录（移除目录）。以下示例删除了当前目录中名为“training”的空目录。


    ```bash

    rmdir training

    ```


    ### rm

    `rm` 命令是“remove”（删除）的缩写，用于删除文件和目录。要删除当前目录下所有以 `.txt` 结尾的文件，请执行以下命令：


    ```bash

    rm *.txt

    ```

    为了在删除文件和目录时安全起见，请结合使用选项 `-i`（或 `--interactive`）和 `-v`（用于 `--verbose` 详细）。在删除文件之前，`rm`
    将请求您的显式确认，并打印状态消息：


    ```bash

    rm -iv invoice156.txt

    rm: remove regular file "invoice156.txt"? y

    "invoice156.txt" was deleted

    ```


    ### cp

    `cp` 命令复制文件。为了正常运行，它需要两个名称：原始文件的名称和副本名称。接下来的示例创建一个名为“calendar-2018”的日历文件副本。


    ```bash

    cp calendar calendar-2018

    ```

    原始文件不会被触且保持完整。副本与原始文件内容相同，但时间戳为。使用选项 `-i`（或 `--interactive`）可以防止覆盖现有文件。


    ### mv

    `mv` 命令是“move”（移动）的缩写，用于移动和重命名文件及目录。它需要两个名称：原始文件的名称及其新名称。以下示例将“calendar”文件重命名为“calendar-2018”。


    ```bash

    mv calendar calendar-2018

    ```

    原始文件将被删除，新条目接收当前时间戳。使用选项 `-i`（或 `--interactive`）可以防止覆盖现有文件。


    ### cd

    `cd`（change directory，切换目录）命令允许你在系统中移动。要进入子目录“work”，请使用此命令：


    ```bash

    cd work

    ```


    ### file

    此命令还可以检测 PDF 文件以及各种图像格式。![Description: 00062.jpeg](img/rsrc1U2.jpg)


    ### du and df

    这两个非常相似的命令可以告诉你更多关于已用空间的信息，`du` 是“disk usage”（磁盘使用量）的缩写，`df` 意味着“disk free”（磁盘空闲）。`du`
    计算目录占用的磁盘空间。常规输出列出每个条目的值，可能会让人困惑。为了获取目录的摘要，可以在命令行调用中添加三个参数 `-s`、`-c` 和 `-h`。`-s`
    代表“summary”（摘要），`-c` 意味着“total”（总计），`-h` 以人类可读的格式输出值。下面的图片显示了你主目录的磁盘使用情况。![Description:
    00063.jpeg](img/rsrc1U3.jpg)


    相比之下，`df` 命令显示设备上剩余空间。下面的图片显示了系统的可用磁盘空间。从左到右，列分别涵盖文件系统、磁盘大小、已空间、可用空间以及挂载到该目录的设备。![Description:
    00064.jpeg](img/rsrc1U4.jpg)


    ### 7.2 输出与文本处理

    `echo` 是内置的 shell 命令，用于输出文本：


    ```bash

    echo helphelp

    ```

    如前所示，shell 会评估命令并打印变量的值。接下来的示例打印 shell 变量 `$HOME` 的值，它代表你的主目录。


    ```bash

    echo $HOME/home/user

    ```


    ### cat and tac

    这两个命令按行打印文件。`cat` 从第一行开始到最后一行，而 `tac` 从最后一行开始到第一行。接下来的示例使用一个名为“places”的简单文本文件，每行包含一个城市名称。对于
    `cat`，Amsterdam 首先出现；而对于 `tac`，则是 Cape Town 。


    ```bash

    cat places

    AmsterdamBerlinBernCape Town

    tac places

    CapeTownBernAmsterdam

    ```


    ### grep

    根据上面用于 `cat` 和 `tac` 的示例，接下来的命令行调用仅输出文件中包含字符串“Ber”的行。请记住 `grep` 过滤器是区分大小写的，即它寻找的是以大写字母“B”开头，后跟两个小写字母“e”和“r”的字符串。模式位于文本的开头、中间还是结尾都没有影响。


    ```bash

    grep Ber places

    BerlinBern

    ```

    在模式方面，`grep` 支持字符串和正则表达式（RegEx）。要找到所有以字母“n”结尾的字符串，请使用选项 `-E`（或 `--extended-regexp`），后接如下所示的模式
    `n$`：


    ```bash

    grep -E "n$" places

    BerlinBernCape Town

    ```


    ### head and tail

    `head` 输出文件的前几行。在不带进一步参数的情况下调用，它输出前十行。相比之下，`tail` 执行相同的操作，但从文件末尾开始。要输出前两行，如下所示添加选项
    `-n 2`：


    ```bash

    head -n 2 places

    AmsterdamBerlin

    ```

    要输出最后两行，如下所示使用 `tail` 执行相同操作。与 `tac`（见本章之前）不同，`tail` 不会改变输出顺序。


    ```bash

    tail -n 2 places

    BernCape Town

    ```


    ### nl

    `nl` 类似于 `cat`（见本章之前），但会在输出的每行开头添加行号。


    ```bash

    nl place

    s1 Amsterdam2 Berlin3 Bern4 Cape Town

    ```


    ### wc

    `wc` 命令是短语“word count”（单词计数）的缩写，用于统计输入行、单词和单个字符。除非另有说明，否则会打印所有三个值：


    ```bash

    wc places

    4 5 32 places

    ```

    此外 `wc` 还提供了以下选项来限制输出：

    - `-l`: 输出行数，后接文件名

    - `-w`: 输出单词数，后接文件名

    - `-c`: 输出字符数，后接文件名

    此示例显示了如何仅统计文件的行：


    ```bash

    wc -l places

    4 places

    ```


    ### 7.3 用户与组

    这些命令处理各种操作，用于管理你 Linux 系统的用户和组。除非明确说明，否则这些命令可以作为普通用户运行。


    ### whoami

    `whoami` 命令按如下方式返回你的当前用户 ID：


    ```bash

    whoami

    user

    ```

