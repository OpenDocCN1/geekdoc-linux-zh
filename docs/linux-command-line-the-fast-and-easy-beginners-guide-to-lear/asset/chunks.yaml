    \ Some `cd ..` allows to make the current parent directory (note the space between\
    \ `cd` and `..`). `cd -` allows to return to the previous directory.\n\n`ls` (list)\
    \ lists the files in the current directory. This will display the files in the\
    \ directory you are looking at. Main options: `-a` - view all files, including\
    \ hidden, `-l` - display more detailed information.\n\n`pwd` means \"print working\
    \ directory\" and will tell you which directory you are currently in. `~` indicates\
    \ your home directory, such as `/home` or `/home/user` (with your username in\
    \ the place of user). `cd` will let you \"change directory\", so that you can\
    \ move around to different parts of system. `cd ..` will go up one directory.\
