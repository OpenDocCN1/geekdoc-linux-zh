    to edit the commands that you have used before, you can use the left and right
    arrow keys to move the cursor to where you need to perform edits. essential Linux
    commandsIn this chapter we explain basic Linux commands that will help you to
    deal with files and directories, text processing commands, users and groups, process
    management, networks, and the help system.7.1 Files and DirectoriestouchThe touch
    command is used to update the access date or modification date of a file and works
    in two ways: if the file already exists, the timestamp for access and modification
