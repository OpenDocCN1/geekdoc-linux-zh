    # How to make a bootable USB flash drive for Linux


    Today, the operating system is becoming increasingly popular. Surely you have
    already heard from your friends or acquaintances stories about how easy it is
    to carry out such an installation. Obviously, creating a bootable USB flash drive
    for Linux is a great way to reinstall the operating system on a computer with
    a damaged or missing drive, laptop, or netbook. Let''s get acquainted with this
    installation method better!


    First, you need to find and download a Linux operating system image. Finding images
    of different versions of Linux on the Internet is very simple because it is “freeware”
    and is distributed absolutely free. Download the desired image on our website,
    official website or torrents.


    A bootable Linux flash drive requires a regular flash drive. Its volume should
    be `1GB` and higher.


    Next you need to download the program `Unetbootin`. This program will help us
    with how to make a bootable Linux flash drive. You can download it from the page
    `unetbootin.sourceforge.net`. At the top of the site there are buttons for 3 distributions
    – Windows, Linux and Mac OS. If you, for example, now have Windows, then press
    the Windows button.


    After downloading, the program opens instantly, and you do not need to install
    it. If you have problems with the launch (Windows 7), run "on behalf of the administrator."
    Initially, the program is ticked on the “Distribution”, but we need to put it
    on the “Disk Image”. We also indicate that this is an ISO image. Next, click on
    the button `...` and select the image that we previously downloaded from the Internet.


    If your flash drive is capacious enough, then it is advisable to allocate space
    in the file storage space. `100 MB` will be enough.


    And at the very bottom of the program window, select which flash drive you want
    to burn. Example – “Type: USB drive; Media: E: \ \ If only one flash drive is
    inserted into the computer, the program will determine it on its own and there
    is no need to choose anything.


    It remains only to press the "OK" button and wait until the program completes
    the burning of the image. It takes `5-10 minutes`. That is all you need to know
    about how to burn Linux to a USB flash drive. After burning, you must restart
    the computer or insert the USB flash drive into the computer where you want to
    install the Linux Operating System.


    ## How to choose programs to install


    So, the most crucial moment – the layout of the hard drive – is behind. Now the
    installation program proceeds to the next stage, in which it will offer to select
    the necessary programs (packages are traditionally called programs in Linux, which,
    by the way, is truer in terms of terminology).


    You can simply choose one of the options for installing packages (for home computer,
    office, workstation with a connection to a local network, etc.). Alternatively,
    by turning on the Package selection switch manually, go to the software package
    selection window. All programs included in the distribution of Linux are divided
    in this window into several sections: system, graphic, text, publishing, sound,
    games, documentation, and so on. In each section, you can select (or, conversely,
    deselect) any software package. If it is not clear from the name of the program
    what it is for, click on the name, and a brief description of the purpose of this
    program will appear in a special window. Unfortunately, in Russian-language distributions,
    often not all descriptions are translated into Russian, so some descriptions may
    be in English.


    Having chosen the necessary packages for installation, be sure to locate on the
    screen and check the box to check dependencies. The fact is that some programs
    may depend on others, that is, they may use modules of other programs in their
    work.


    Some programs may require the presence of any other software packages for normal
    operation. In this case, they say that one program depends on another. For example,
    the `kreatecd` CD burning program contains only a graphical user interface and
    calls the `cdrecord` console program for the actual recording, although the user
    doesn’t see it when working. This means that the `kreatecd` program depends on
    `cdrecord`. When installing Linux, all software dependencies are checked automatically;
    you just need to allow the installation program to do this by turning on the appropriate
    switch.


    The checkbox for checking dependencies is needed for the installer to automatically
    check if some of the selected programs are using those packages that are not selected
    for installation. Having made such a check, the installation program will provide
    you with a list of these packages and will offer to install them as well. We should
    agree with this, otherwise, some programs will not work.


    ## Configure devices and graphical interface


    After you agree to install the necessary packages, the process of copying the
    necessary files to the hard disk will begin. This process is quite long, so you
    can go and drink coffee at this time, for at least five to ten minutes. However,
    if your distribution is recorded on two or more compact discs, the installer will
    from time to time ask you to insert the necessary compact disc into the drive.


    Then the configuration of additional devices and the graphical interface will
    begin. There is one subtlety. The fact is that most installation programs for
    some reason incorrectly process information about the mouse. Therefore, the question
    of what kind of mouse you have at this stage is to answer a simple two-button
    or a simple three-button. Do not look in the list of the manufacturer, model,
    and so on. After installing the system, it will be possible to separately enable
    additional functions of the mouse (for example, the operation of the scroll wheel)
    if they do not work themselves.


    ## Install the bootloader


    After all the above operations, the freshly installed system is ready for operation.
    However, the installer will ask you to answer one more question: should the boot
    loader be installed and, in most cases, if necessary, which one?


    If Linux is the only operating system on your computer, then you will not need
    a bootloader. In this case, simply restart the computer, removing the bootable
    CD from it. If you specifically changed the BIOS settings in order to allow the
    computer to boot from a CD or from a floppy disk, then now, after installing the
    system, you can reconfigure the computer to boot only from the hard disk. To do
    this, go back to the BIOS settings and change the boot order. However, if you
    specified the “universal” boot order – Floppy, CDROM, IDEO – you can no longer
    change it, just make sure that when you turn on and restart your computer, no
    boot diskettes or a CD are inserted in it, unless necessary boot from these devices.


    ## Choosing the Right Linux Distributor


    The popularity of the distribution. The more popular your distribution is, the
    easier it will be to find tutorials on it on the web. A large community means
    that you can easily get help in the forums dedicated to the distribution if you
    have any difficulties with its development. Finally, the more common the distribution,
    the more applications and packages are created for it. It is better to choose
    popular solutions with a ready base of packages than to suffer from the build
    from source in some exotic distribution.


    The development command that deals with them. Naturally, it is better to pay attention
    to distributions supported by large companies like Canonical Ltd., Red Hat or
    SUSE, or to distributions with large communities. Keep in mind that even the best
    Linux distributions have analogs that are not inferior to them.


    ### Linux Mint

    New users migrating from Windows definitely need to install Linux Mint. Today
    it is the most popular Linux distribution. This is a very stable and easy to use
    the system based on Ubuntu. Linux Mint is equipped with a light and intuitive
    interface and a convenient application manager, so you will not have problems
    finding and installing programs. There are two shells: `Cinnamon` for modern computers
    and `MATE` for old computers. This is a very simple software that is suitable
    for ordinary users. You do not need any specific knowledge to install and use
    Mint. There are of course disadvantages of this software. This is a large number
    of pre-installed programs that may never come in handy.


    ### Manjaro

    This is one of the newest Linux Distributors. It is a popular Linux Distributor
    based on Arch. Arch is an incredibly powerful and functional distribution, but
    its KISS (Keep It Simple, Stupid) philosophy, as opposed to its name, makes it
    too complicated for beginners. Arch is installed only via the command line. It,
    unlike Arch, has a simple graphical installer and at the same time combines the
    powerful features of Arch, such as `AUR` (Arch User Repository) and a sliding
    release. `AUR` is the richest source of Linux packages. If some application is
    in Linux, it probably already exists in `AUR`. So, in this distributor, you will
    always enjoy the freshest packages. It comes with a variety of desktop shells
    to choose from: functional `KDE`, `GNOME` for tablet screens, `Xfce`, `LXDE`,
    and others. By installing this distributor, you can be sure that you get the latest
    updates first. This version has its own advantages of `AUR`, thanks to which you
    can install any application without unnecessary movements. Always fresh software.
    But, in truth, it has a peculiar design of the desktop shells. However, nothing
    prevents you from replacing it.


    ### Debian

    This distributor will take root well on your home server. It is a stable and conservative
    distribution that has become the basis for Ubuntu and many other Linux systems.
    It uses only the most trusted packages, making it a good choice for the server.
    It has stability and a large set of applications. But you will have to manually
    configure the distribution after installation.


    ### Kodi

    This is a Linux distribution, which is suitable for a media center. If you want
    to build your media server, Strictly speaking, it is not a distribution kit, but
    a full-featured media player. You can install it in any Linux, but is best to
    choose a bunch of Ubuntu. This distributor supports all types of video and audio
    files. It knows how to play movies, music, organize your photos. Thanks to extensions,
    it can download media files through torrents, track the appearance of new seasons,
    show videos from YouTube and other streaming services. In short, Kodi can do everything.
    In addition, Kodi is very beautiful and optimized for control from a remote control
    or device on Android. The standard interface of this may not appeal to everyone,
    but is easy to replace. There are also interesting versions: Linux distribution
    for desktop, this is `Kubuntu`; A Linux distribution for old computer, this is
    `Lubuntu`; The Linux version for tablet or transformer is `Ubuntu`; The Linux
    version for laptop is elementary OS and others.


    ## Chapter 2: Linux installation


    Before proceeding with the installation, it is a good idea to check your PC’s
    hardware first. You may check the hardware vendor’s site to check compatibility
    list.


    - **DVD Drive**: To install Linux, you must have a DVD drive, and your computer
    must be able to boot from it.

    - **Hard Drives**: This is not necessary if you will be using Live CD. If you
    will be installing Linux, it is ideal to have at least `4GB` of disk space. Linux
    supports IDE and SCSI hard controllers.

    - **Keyboard**: All keyboards work with Linux.

    - **Monitor**: Most installers can detect modern monitors. If you find it does
    not display well, choose monitor type and specific resolution (`1024x768`).

    - **Mouse**: `PS/2` or `USB` mouse works with Linux.

    - **Network Card**: Installer can detect most network cards. If you find you are
    having problems with one, find additional information online.

    - **Processor**: Minimum speed required is `700 MHz`. New processor speeds are
    more than this value. In terms of speed, the higher the number, better.

    - **RAM**: The bigger, the better. The minimum required is `512MB`. Check the
    corresponding RAM for specific distro – others might require bigger RAM allocation.

    - **Sound Card, Video Card, Printer**: Make sure that these are compatible with
    Linux. Refer to the hardware vendor’s site for information.


    Next, make space for Linux. If you opt to install Linux without removing your
    current OS, note that existing operating system uses the whole drive. This means
    that Linux and your current OS needs to share the drive so that two operating
    systems can co-exist. If you choose to take this route, make sure to take backup
    of system because of risk wiping out data. To facilitate partitioning, you can
    get hard drive products that run on Windows, or use a GUI called `GParted` that
    comes with most distributions. Some distributions (like `openSUSE` or `andros
    Desktop`) can reduce partition and automatically create partitions for Linux.
    In case your distribution offers this feature, you will no longer need partitioning
    tool.


    ## Installation Steps


    Go to the Linux distribution and download the distro file. The file you downloaded
    will come with installation steps. In this section, let’s talk about general installation
    steps for any distribution.


    Step 1: Prepare CD/DVD installer or Live CD. Download a copy of the distribution
    you plan to install and burn it onto CD/DVD.


    Step 2: Ensure that PC can boot from CD/DVD drive. If PC still boots from hard
    drive when you have a CD/DVD in the drive, change Boot Devices first. Go into
    BIOS and change the order of boot devices – choose CD/DVD drive as first boot
    option. You can do this by rebooting PC and pressing key (`F2` or `Del` on most
    computers) to go into Setup menu. Verify key for brand and model. Once you assign
    CD/DVD drive as first boot option, put disk in drive and reboot computer.


    Step 3: If you are using Live CD, computer will then boot up and load the OS from
    Live CD. Once installation is done, reboot computer.


    ## X is not working after installation


    If you happen to see the GUI during the installation but after the first reboot
    you are confronted with a grey screen or black screen with X in the middle, here
    are some steps you can use to troubleshoot: Reboot PC. Press `Ctrl+Alt+Delete`.
    Once PC is booting up, press `A` key if distribution uses GRUB (and Unified Bootloader).
    For `LILO`, skip this step. The GRUB boot loader will then display command line
    for Linux kernel and will ask you what you want. For GRUB, type space and then
    `single`. Press Enter. If using `LILO`, type `single` then press Enter. The Linux
    kernel will boot in single-user mode with following prompt: `sh-`. Once you see
    this prompt, you can now start to configure X. Depending on the distribution you
    are using, X uses configuration file to setup your display card, monitor, and
    resolution. The problem sometimes happens when configuration from Linux installer
    is not right. Solve this problem by creating working configuration file: Type
    the following command:


    ```

    Once you enter this command, the X server will create a configuration file. You’ll
    see the screen go blank and then display several messages. Use `vi`, a text editor
    and edit the file `/etc/xorg.conf.new`. Insert the line below after section "Files":

    ```

    line

    ```

    Start the X server by typing the command below:

    ```

    line

    ```

    Once you see the blank screen with X cursor, the configuration file is working
    fine. Use `Ctrl+Alt+Backspace` to stop the X server. Type the command below to
    copy the config file to the `/etc/X11` directory:


    Type the word `reboot` or press `Ctrl+Alt+Delete` to reboot the computer. The
    login screen should come up if the config file change went well. Most, if not
    all, Linux distributions have a solid community online. If you encounter problems
    during the installation, search for the problem, describe it in detail, or use
    the actual error message as your search keyword. You will find the information
    you need and if not, you can always post in the forums and the community will
    be ready to help. Visit the following forums for more information:

    - Ubuntu: `http://ubuntuforums.org/`

    - Linux Mint: `http://linuxmint.com/forum/`

    - SUSE: `https://forums.suse.com/forum.php`

    - Debian: `http://www.debianhelp.org/`


    ## Post-Installation Activities


    ### Managing Hardware and Peripherals


    CPU

    The operating system keeps programs and hardware working together smoothly. The
    capabilities of Linux are affected by the limitations of your system’s hardware
    (for example, disk space and memory) so it is important to know more details about
    your computer’s. Let’s start with the CPU. The CPU performs all the computing
    and its speed (in MHz) signifies how fast your computer can handle transactions.
    Your CPU specs will also tell you about the CPU family (most common are x86 and
    x86-64) and the number of cores that it has. To know more about your CPU, use
    the Linux commands below:


    Hard Disk

    Next, let’s discuss your computer’s hard disk. In the installation chapter, I
    spoke about the importance of making sure that your computer has enough disk space
    for Linux and the possible need for partitioning your hard disk if you want to
    run two operating systems at the same time. If plan on adding a new disk in the
    future, learning how to partition will come in handy. Linux supports the following
    partitioning tools:

    Fdisk Tools – This is composed of the text-based tools: `fdisk`, `cfdisk`, and
    `sfdisk`. These tools are great for use in partitioning. However, it could be
    a bit overwhelming for beginners who are not yet familiar with partitioning.

    libparted Tools – The `libparted` library presents both GUI and text-based partitioning
    tools. One particular example is `GParted` as shown in the screenshot below. The
    interface makes it easier to use.

