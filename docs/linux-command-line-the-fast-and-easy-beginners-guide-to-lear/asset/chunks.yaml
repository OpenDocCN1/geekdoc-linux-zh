- fmt: "\n# How to Play Audio from a CD\n\nAll Linux distros come with default CD\
    \ player apps. If you want to play music from a CD, all you need to have is a\
    \ Linux-configured sound card. In some distros, a dialog box will pop up to ask\
    \ you whether you want to play the CD that you inserted in the drive or not. If\
    \ you do not see this dialog box, you can find your CD player by selecting `Applications->Sound\
    \ and Video`. \n\nIf you are using the `KDE` CD player, you will see the name\
    \ of the CD and the current track being played. This player retrieves the album\
    \ information from `freedb.org`, which is an Internet-based open source database\
    \ for CDs. To download the album information, you will need to be connected to\
    \ the internet. However, once you are able to download this information, your\
    \ computer caches the data which can be used for future sessions.\n\n# How to\
    \ Play Sound Files\n\nIf you want to play any sound file, such as `.mp3s`, you\
    \ can use either the `XMMS` or the `Rhythmbox`. `Rhythmbox` is one of the preferred\
    \ players by users that has large `.mp3` collections because it can be useful\
    \ when it comes to organizing their files. You can pull up `Rhythmbox` by locating\
    \ it from the main menu.\n\nWhen you use `Rhythmbox` for the first time, an app\
    \ assistant will prompt you to identify where your music files are stored. Doing\
    \ so will allow the application to manage your music library. Afterwards, `Rhythmbox`\
    \ will display your songs in an orderly manner.\n\n`XMMS` is another option that\
    \ you may have, especially if you have a music library that contains several file\
    \ types, such as `FLAC`, `.wav`, or `Ogg Vorbis`. To run this application, simply\
    \ select the app icon from the main menu. When you start `XMMS`, you can select\
    \ a file by choosing `Window-> Play File`, or by hitting the `L` key. On the dialog\
    \ box `Load File`, select one or multiple files that you want to load. Upon clicking\
    \ the `Play` button, the application will play the selected file/s.\n\n# How to\
    \ Burn a Disc In Linux\n\nMost of the Linux file managers available now are capable\
    \ of burning a DVD or a CD Disc. For example, the `Nautilus` and the `Xandros`\
    \ file managers have built-in capability for burning discs. At the same time,\
    \ different Linux distros also offer applications that will allow you to conveniently\
    \ burn files into a DVD or CD. For example, the app `K3b` allows you to burn discs\
    \ in distros such as `SUSE` and `Knoppix`.\n\nApplications such as `K3b` are easy\
    \ to use – all you need to do is to gather all the files that you want to burn\
    \ into a disc and then start the burning process with the app. However, take note\
    \ that these applications may need command line programs, such as `cdrdao` and\
    \ `cdrecord` in order to burn CDs. `K3b` also requires the `growisofs` program\
    \ to be able to burn DVDs.\n\n# Graphics and Imaging Apps\n\nLinux offers different\
    \ imaging and graphics manipulation applications. Two of the most popular apps\
    \ are the following:\n\n## The GIMP\n\n`The GIMP` is a program that is released\
    \ under the `GNU GPL` (General Public License). Most of the Linux distros come\
    \ with this application, but you may also have to select a package in order to\
    \ install this program. `The GIMP` is often compared to the most popular image-manipulation\
    \ applications out there, such as `Adobe Photoshop` and `PhotoPaint`.\n\nTo launch\
    \ `The GIMP`, pull up the main menu and then select the application in the Graphics\
    \ category. Once you start the program, you will see a window that will show you\
    \ the license and the copyright information. Proceed with the installation by\
    \ clicking on the `Continue` button.\n\n**Tip**: If you can’t locate `The GIMP`,\
    \ add the program by going to the `Add/Remove Software` (found in `System Settings`)\
    \ and install the application from there.\n\nInstalling `The GIMP` will create\
    \ a subdirectory in your home directory, which will hold all the data that you\
    \ need in order to store preferences that you make to the application. Click the\
    \ `Continue` button in order for the app to proceed creating these directories,\
    \ and then follow the instructions detailed by the wizard to finish the installation.\
    \ After the installation, `The GIMP` will then load plugins, or modules that are\
    \ designed to enhance the app’s functionality. Once all plugins are loaded, you\
    \ can browse on tips that will be displayed on the `Tip` window.\n\n## GNOME Ghostview\n\
    \nThis application is best for viewing PDF (`.pdf`) and PostScript (`.ps`) documents\
    \ or printing these document files. `Ghostview` allows you to view and print selected\
    \ pages found on a long document, as well as magnify or zoom out on document sections.\
    \ You can find this application by going to `Graphics->Post Script Viewer` in\
    \ Fedora.\n\n# Chapter 4. Becoming a Linux power user\n\nIn Linux, this command\
    \ prompt offers a very powerful way for managing users. You can use the command\
    \ line to create and delete users. These users can also be assigned certain privileges\
    \ as to what they can or cannot do with the system and its files. This shows how\
    \ the terminal is a powerful tool. These users can also be grouped together into\
    \ a single group. Addition and deletion of these users from a group is also possible.\
    \ This is what we are going to explore in this chapter.\n\n## 'Group' Commands\n\
    \nIn Linux, groups are defined in the file `/etc/group` file. This file contains\
    \ the name of the group, its id and the list of users belonging to each particular\
    \ group. To check the available groups in your system, run the following command:\n\
    \n```bash\ngroups\n```\n\nFrom the figure above, it is very clear that my system\
    \ has 8 groups. If you need to create a new group and give it the name `group1`,\
    \ run the following command:\n\n```bash\ngroupadd group1\n```\n\nIt is worth noting\
    \ that most Linux distros create a group for the user and give it the name they\
    \ have used as the account name. Once you have created your group using the above\
    \ command, it is important to verify that it has really been created. This can\
    \ be done by viewing the contents of the file `/etc/group`. If you can’t find\
    \ the name of the group, you have created then something must have gone wrong\
    \ with its addition. The contents of this file can be viewed either in the command\
    \ window or can be opened in the `vim` editor as follows:\n\n```bash\ncat /etc/group\n\
    # or\nvi /etc/group\n```\n\nHowever, if you use the second method, that is, viewing\
    \ it on the `vim` editor, make sure that you don’t alter its contents as this\
    \ might result into errors. To add the group id to your group, use the `-g` option\
    \ as shown below:\n\n```bash\ngroupadd -g 1300 group1id\n```\n\nTo create a system\
    \ group, use the `-r` option as shown below:\n\n```bash\ngroupadd -r systemgroup\n\
    ```\n\nWe can now use the `useradd` command which can be used for either a new\
    \ user to the system or for updating the information of any available user. Let\
    \ us create a new user named `user1`:\n\n```bash\nuseradd -c \"User\" -d \"/home/user1\"\
    \ -s \"/bin/bash\" -user1\n```\n\nIn the above command, we have used many parameters.\
    \ Let us define their purpose:\n\n1. `-c` - this will be used to designate the\
    \ name of the user. It is the name to be displayed on the login window. In our\
    \ case, this is “User”.\n2. `-d` - the path signifying the user’s home directory.\
    \ If you don’t specify this, it will be created by default. In our command above\
    \ `/home/user1` will be our user’s home directory.\n3. `-s` - this will establish\
    \ the default login shell for the user we have created. In our case, the default\
    \ shell for `user1` will be the `bash` shell.\n\nOther options that can be used\
    \ together with the `useradd` command include the following:\n\n4. `-b` - specifies\
    \ the base directory of the system. This is the `/home` for most Linux distros\
    \ and is used for the purpose of the home directory. If we don’t specify the `-d`\
    \ option above while creating a new user, this is made the default home directory\
    \ for the new user.\n5. `-g` - this specifies the primary group name or ID. If\
    \ you don’t specify this option while creating a new user, a new group with a\
    \ name similar to the login name is created and a group id is assigned.\n\nExample:\n\
    ```bash\nuseradd -g 200 user1\n```\n"
