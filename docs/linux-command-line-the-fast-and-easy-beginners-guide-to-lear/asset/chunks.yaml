    # iotop, iftop, hot

    理解程序的执行对于成为一个优秀的系统管理员至关重要。在本章中，我们将更详细地查看进程，以及如何处理和操作进程。程序正在运行的实例被称为进程。它由程序指令、从文件中读取的数据以及其他程序或系统输入组成。每个进程都被分配一个进程
    ID (PID)，以便系统跟踪所有进程。系统启动进程具有 PID 0，然后初始进程具有 PID 1，以此类推顺序进行。初始进程 PID 1 指的是旧版 Linux
    系统上的 `/sbin/initd` 或现代 Linux 系统上的 `/sbin/systemd`。


    ## 处理进程


    ### ps 和 pstree

    为了列出所有运行的进程，请使用 `ps` 命令或 `pstree` 命令。


    ![Description: 00103.jpeg](img/rsrc1V7.jpg)

    `ps` 的输出如上所示包含四列，其含义如下：


    '
- fmt: '

    * `PID` - the process ID.

    * `TTY` - the terminal from which the command was invoked.

    * `TIME` - the time the process has been active.

    * `CMD` - the command that was invoked.


    The following switches can be used to retrieve additional information regarding
    the processes:


    * `-e` and `ax`: show all processes.

    * `-p`: shows information for the given process id only.


    ```

    $ ps -p 26426

    PID TTY STAT TIME COMMAND

    26426 pts/9 Ss 0:00 bash

    ```


    * `-C`: shows processes that refer to the given command name.

    * `-u`: shows processes that belong to the given username.


    The `pstree` command is similar to the `ps` command but displays the processes
    as a hierarchical tree. A useful switch is `-p` which adds the process ID to the
    process name. ![Description: 00104.jpeg](rsrc1V8.jpg)


    ### pidof

    The `pidof` command simply displays the ID of the specified process. The image
    below returns the PID of the processes that run “bash”. ![Description: 00105.jpeg](rsrc1V9.jpg)


    ### pgrep

    This command searches the list of processes for the specified process name. The
    image below displays the processes that match the string “xfce”. ![Description:
    00106.jpeg](rsrc1VA.jpg)


    ### top

    The `top` command displays the processes according to their activity. The most
    active process is on top, followed by the less active ones. The list is updated
    every second. The single columns contain the process ID (titled `PID`), the user
    name of the owner of the process (titled `USER`), the process priority (titled
    `PR`), the nice level (titled `NI`), the virtual memory usage (titled `VIRT`),
    the reserved memory (titled `RES`), the shared memory (titled `SHR`), both the
    percentile CPU and memory usage (titled `%CPU` and `%MEM`), the running time of
    the process (titled `TIME+`) as well as the command that was used to invoke the
    process (titled `COMMAND`). ![Description: 00107.jpeg](rsrc1VB.jpg)


    ### htop

    “htop” is an additional software package and contains a more interactive version
    of `top`. The arrangement of the columns is similar to `top`. ![Description: 00108.jpeg](rsrc1VC.jpg)


    ### Foreground and Background Processes

    There are two types of processes: foreground and background processes. Foreground
    processes are initialized and controlled through a terminal session. In other
    words, there has to be a user connected to the system to start these processes
    and the process occupies the terminal while it is executing. In contrast, background
    processes are not connected to the terminal and do not explicitly require any
    user input. They hence do not occupy the terminal while waiting to be completed
    and allow you to run multiple processes. Processes can be initialized in the background
    with the use of the `&` symbol.


    ```

    $ process1 &...

    ```


    To send a running process to the background, use the command `bg` followed by
    the job ID, while `fg` will send the process to the foreground. You can use the
    `jobs` command to show the jobs that are currently running and their associated
    job IDs:


    ```

    $ process1 &$ process2 &$ jobs

    [1]+ Running process1

    [2]- Running process2

    ```


    ### Stopping and Terminating Processes

    In the event that a running program becomes unresponsive and causes load, what
    can we do to stop it and get rid of it? Luckily, we have a few options that allow
    us to send a specific signal to the program in order to stop it. The command used
    in this instance is the `kill` command with a corresponding switch.


    In order to terminate and kill a program named “hangingProgram” you will have
    to identify the program first. You do this by using `pgrep` to find the associated
    process as follows:


    ```

    $ pgrep hangingProgram

    3167

    ```


    Next, send the identified process the `SIGTERM` signal:


    ```

    $ kill -SIGTERM 3167

    ```


    As an alternative, you may invoke `kill` as follows:


    ```

    $ kill -15 3167

    ```


    Or you may stop the hanging process by pressing `CTRL+Z`, and then deleting the
    process using this command:


    ```

    $ kill -SIGKILL 3167

    ```


    As demonstrated above, this command does the same:


    ```

    $ kill -9 3167

    ```


    ### Adjusting the Execution Priority of a Process

    You can display the nice level of a process using `ps` as follows:


    ```

    $ ps -o pid,comm,nice -p 1808

    PID COMMAND NI

    1808 bash 0

    ```


    The first column contains the Process ID (`PID`), the second column contains the
    command, and the third contains the nice level (`NI`). As demonstrated in the
    example above, the “bash” process with the PID `1808` has a nice level of `0`.
    An existing process'' nice level can be adjusted using the `renice` command. In
    order to reduce the nice level of the process above to 10, issue the command below.
    Keep in mind that only root can apply negative nice values to a process.


    ```

    $ renice 10 -p 1808

    ```

