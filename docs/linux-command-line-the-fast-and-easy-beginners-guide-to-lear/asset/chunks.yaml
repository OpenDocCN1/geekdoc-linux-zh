    and by the time you are done, you will never leave Linux! The most important thing
    is for you to take note of them as we go along as they do not just make your life
    easy but will save you from making those silly mistakes such as typos.One of the
    most important shortcuts is using the up and down arrow key on your keyboard.
    When you are typing commands on Linux, they are kept in a history. The simplest
