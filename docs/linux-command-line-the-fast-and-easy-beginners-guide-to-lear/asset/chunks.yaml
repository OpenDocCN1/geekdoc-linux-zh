    \ the contents of a directory. Another common option is `-h`, which makes sizes\
    \ \"human readable\". If you were to type `ls -sh`, you would be asking for listing\
    \ contents as well as displaying sizes in megabytes.Keyboard ShortcutsIf you want\
    \ to do something in Linux, and you use the graphical interface to look for help,\
    \ you can still benefit from shortcuts. Using command line might seem like awful\
    \ lot of typing, but there are more shortcuts you can use to save time:\n- Down\
    \ arrow (or `Ctrl-N`): go back to previous command.\n- Up arrow (or `Ctrl-P`):\
    \ go through previous commands.\n- Enter: enter the command, once you have found\
