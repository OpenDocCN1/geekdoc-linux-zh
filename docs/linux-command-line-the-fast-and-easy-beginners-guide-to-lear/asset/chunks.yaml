  trans: "\n\n### 6. -G\n`-G` 用于指定用户所属的其它辅助组。使用逗号来分隔组名。\n\n示例：\n```bash\nuseradd –g\
    \ 200 –G sudo, adm user1\n```\n注意，在上面的命令中，我们只指定了两个组。也可以添加其他组，并同样使用逗号进行分隔。\n\n\
    ### 用户密码管理\n现在我们已经创建了一个新用户并为他们分配了组，为他们分配密码是至关重要的。这将确保安全性，并防止其他用户登录系统并冒充其身份。要为我们创建的用户（即\
    \ `user1`）分配密码，请运行以下命令：\n```bash\npasswd user1\n```\n运行此命令后，系统会提示你输入密码并要求再次输入相同的密码。用户\
    \ `user1` 将将使用该密码登录系统。`passwd` 命令还关联了其他选项，包括：\n\n1. `-d` 删除与指定用户关联的密码，这意味着该用户将无法再次登录系统。\n\
    \   示例：\n   ```bash\n   passwd –d user1\n   ```\n2. `-S` 显示 `/etc/shadow` 文件中的所有信息，以便显示用户的状态。\n\
    \   示例：\n   ```bash\n   passwd –S user1\n   ```\n3. `-l` 锁定特定用户账户的密码。该用户将无需验证即可登录系统。此时将使用其他身份验证方式（如\
    \ SSH 安全外壳）进行身份验证。\n4. `-a` 用于显示系统中所有用户的状态。它只能与 `-S` 选项结合使用。\n   示例：\n   ```bash\n\
    \   passwd –S –a\n   ```\n\n### 用户修改\n有时，你可能需要修改某些用户的设置。如文所示，通过命令行可以很容易实现。\n```bash\n\
    useradd -c \"User\" -d \"/home/user1\" -s \"/bin/bash\" –user1\n```\n要更改上述用户的登录名、名称以及\
    \ ID，或者将其添加到 admin 组，请使用以下命令：\n```bash\nusermod -l user -c \"The User\" -u 4000\
    \ -G adm -a user1\n```\n`-l` 选项的作用是为用户创建一个新的登录名。\n\n### 删除组\n要删除一个组，请使用如下所示的 `groupdel`\
    \ 命令：\n```bash\ngroupdel group1\n```\n该组将被删除，但只有当该组是用户的辅助组时才会发生。如果它是主组，则我们需要先删除用户，然后再删除该组。\n\
    \n### 删除用户\n要删除特定用户，只需运行以下命令：\n```bash\nuserdel user1\n```\n上述命令将从系统中删除用户 `user1`。然而，如果该用户正登录系统，在删除之前会收到警告。该用户的文件和主目录不会被删除。`userdel`\
    \ 命令还关联了以下选项：\n\n1. `-r` 用户主目录中的所有目录和文件将被移除。\n   示例：\n   ```bash\n   userdel –r\
    \ user1\n   ```\n2. `-f` 此选项无论用户是否已登录系统，都会强制删除其账户。无论其他用户是否正在使用该目录，该用户的主目录也将将被删除。\n\
    \n"
- fmt: "\nExample: `userdel -f user1`\n\nFor a user to be able to execute this command,\
    \ they must be added to the `sudo` group which is a system group. To add a user\
    \ to this group, simply run the following command:\n\n```bash\nusermod -G sudo\
    \ -a user1\n```\n\nIn the above command, we have added the user `user1` to the\
    \ system group `sudo`. This user will then be able to use the `sudo` command.\
    \ For the user to be in full administrative control of their account, they must\
    \ be added to the `adm` group. This can be done as follows:\n\n```bash\nusermod\
    \ -G sudo,adm -a user1\n```\n\nIf the user wants to login to the system via the\
    \ shell, the following command should be used:\n\n```bash\nlogin user1\n```\n\n\
    They will then be prompted to enter the password and if correct, they will be\
    \ able to access the system. To check the groups of a certain user, execute the\
    \ following command:\n\n```bash\ngroups 'username'\n```\n\nExample: `groups user1`\n\
    \nThe above command will show all the groups to which the user `user1` belongs.\n\
    \n# Chapter 5. Using the Shell\n\nEffective Linux professional is unthinkable\
    \ without using the command line. The command line is a shell prompt that indicates\
    \ the system is ready to accept a user command. This can be called a user dialogue\
    \ with the system. For each command entered, the user receives a response from\
    \ the system:\n\n1. another invitation, indicating that the command is executed,\
    \ and you can enter the next.\n2. error message, which is a statement of the system\
    \ about events in it, addressed to the user.\n\nUsers who are accustomed to working\
    \ in systems with a graphical interface, working with the command line may seem\
    \ inconvenient. However, in Linux, this type of interface has always been basic,\
    \ and therefore well developed. In the command shells used in Linux, there are\
    \ plenty of ways to save effort, that is, keystrokes when performing the most\
    \ common actions:\n- automatic addition of long command names or file names\n\
    - searching and re-executing a command that was once performed before\n- substitution\
    \ of file name lists by some pattern, and much more\n\nThe advantages of the command\
    \ line are especially obvious when you need to perform similar operations on a\
    \ variety of objects. In a system with a graphical interface, you need as many\
    \ mice dragging as there are objects, one command will be enough on the command\
    \ line.\n\nThis section will describe the main tools that allow you to solve any\
    \ user tasks using the command line: from trivial operations with files and directories,\
    \ for example, copying, renaming, searching, to complex tasks requiring massive\
    \ similar operations that occur as in the user's application work, when working\
    \ with large data arrays or text, and in system administration.\n\n## Shells\n\
    \nA command shell or command interpreter is a program whose task is to transfer\
    \ your commands to the operating system and application programs, and their answers\
    \ to you. According to its tasks, it corresponds to `command.com` in MS-DOS or\
    \ `cmd.exe` in Windows, but functionally the shell in Linux is incomparably richer.\
    \ In the command shell language, you can write small programs to perform a series\
    \ of sequential operations with files and the data they contain — scripts.\n\n\
    Having registered in the system by entering a username and password, you will\
    \ see a command line prompt – a line ending in `$`. Later this symbol will be\
    \ used to denote the command line. If during the installation a graphical user\
    \ interface was configured to start at system boot, then you can get to the command\
    \ line on any virtual text console. You need to press `Ctrl-Alt-F1 - Ctrl-Alt-F6`\
    \ or using any terminal emulation program, for example, `xterm`.\n\nThe following\
    \ shells are available. They may differ depending on the distributor:\n\n- `bash`:\
    \ The most common shell for Linux. It can complement the names of commands and\
    \ files, keeps a history of commands and provides the ability to edit them.\n\
    - `pdksh`: The korn shell clone, well known on UNIX shell systems.\n- `sash`:\
    \ The peculiarity of this shell is that it does not depend on any shared libraries\
    \ and includes simplified implementations of some of the most important utilities,\
    \ such as `al`, `dd`, and `gzip`. Therefore, the `sash` is especially useful when\
    \ recovering from system crashes or when upgrading the version of the most important\
    \ shared libraries.\n- `tcsh`: Improved version of C shell.\n- `zsh`: The newest\
    \ of the shells listed here. It implements advanced features for autocompletion\
    \ of command arguments and many other functions that make working with the shell\
    \ even more convenient and efficient. However, note that all `zsh` extensions\
    \ are disabled by default, so before you start using this command shell, you need\
    \ to read its documentation and enable the features that you need.\n\nThe default\
    \ shell is `bash` Bourne Again Shell. To check which shell you're using, type\
    \ the command: `echo $SHELL`. Shells differ from each other, not only in capabilities\
    \ but also in command syntax. If you are a novice user, we recommend that you\
    \ use `bash`, further examples describe the work in this particular area.\n\n\
    ## Bash shell\n\nThe command line in `bash` is composed of the name of the command,\
    \ followed by keys (options), instructions that modify the behavior of the command.\
    \ Keys begin with the character `-` or `--`, and often consist of a single letter.\
    \ In addition to keys, after the command, arguments (parameters) can follow –\
    \ the names of the objects on which the command must be executed (often the names\
    \ of files and directories).\n\nEntering a command is completed by pressing the\
    \ `Enter` key, after which the command is transferred to the shell for execution.\
    \ As a result of the command execution on the user’s terminal, there may appear\
    \ messages about the command execution or errors, and the appearance of the next\
    \ command line prompt (ending with the `$` character) indicates that the command\
    \ has completed, and you can enter the next one.\n\nThere are several techniques\
    \ in `bash` that make it easier to type and edit the command line. For example,\
    \ using the keyboard, you can:\n- `Ctrl-A`: go to the beginning of the line. The\
    \ same can be done by pressing the `Home` key;\n- `Ctrl-U`: delete current line;\
    \ \n- `Ctrl-C`: Abort the execution of the current command.\n\nYou can use the\
    \ symbol `;` in order to enter several commands in one line. `bash` records the\
    \ history of all commands executed, so it’s easy to repeat or edit one of the\
    \ previous commands. To do this, simply select the desired command from the history:\
    \ the `up` key displays the previous command, the `down` one and the next one.\
    \ In order to find a specific command among those already executed, without flipping\
    \ through the whole story, type `Ctrl-R` and enter some keyword used in the command\
    \ you are looking for.\n\nCommands that appear in history are numbered. To run\
    \ a specific command, type: `!command number`\nIf you enter `!!`, the last command\
    \ typed starts.\n\nSometimes on Linux, the names of programs and commands are\
    \ too long. Fortunately, `bash` itself can complete the names. By pressing the\
    \ `Tab` key, you can complete the name of a command, program, or directory. For\
    \ example, suppose you want to use the `bunzip2` decompression program. To do\
    \ this, type: `bu`\nThen press `Tab`. If nothing happens, then there are several\
    \ possible options for completing the command. Pressing the `Tab` key again will\
    \ give you a list of names starting with `bu`. For example, the system has `buildhash`,\
    \ `builtin`, `bunzip2` programs:\n```bash\n$ buildhash\n$ builtin\n$ bunzip2\n\
    $ bu\n```\nType n (bunzip2 is the only name whose third letter is n), and then\
    \ press `Tab`. The shell will complete the name and remains only to press `Enter`\
    \ to run the command. Note that the program invoked from the command line is searched\
    \ by `PATH` variable. By default, this directory listing does not include the\
    \ current directory, indicated by `./`. Therefore, to run `prog` from current\
    \ directory, you must issue `./prog`.\n\n## Basic commands\n\nThe first tasks\
    \ that have to be solved in any system are: working with data (usually stored\
    \ in files) and managing programs (processes) running on the system. Below are\
    \ the commands that allow you to perform operations on working with files and\
    \ processes. Only the first of these, `cd`, is part of the actual shell, the rest\
    \ are distributed separately, but are always available on Linux system. For more\
    \ information on each command, use `man`.\n\n`cd` allows to change the current\
    \ directory (navigate through the file system). Works with both absolute and relative\
    \ paths. Suppose you are in your home directory and want to go to its subdirectory.\
    \ To do this, enter the relative path: `cd tmp`. To change to `/usr/bin` directory,\
    \ type (absolute path): `cd /usr/bin/`. Some `cd ..` allows to make the current\
    \ parent directory (note the space between `cd` and `..`). `cd -` allows to return\
    \ to the previous directory.\n\n`ls` (list) lists the files in the current directory.\
    \ Two main options: `-a` - view all files, including hidden, `-l` - display more\
    \ detailed information.\n\n`rm` command is used to delete files. Warning: deleting\
    \ the file, you cannot restore it! Syntax: `rm filename`. This program has several\
    \ parameters. Most frequently used ones are: `-i` - deletion request, `-r` - recursive\
    \ deletion (i.e. deletion including subdirectories and hidden files). Example:\
    \ `rm -i ~/*.html` removes all `.html` files in your directory.\n\n`mkdir` allows\
    \ to create a directory, while `rmdir` deletes a directory, provided it is empty.\
    \ Syntax: `mkdir dir_name`. `rmdir` is often replaced by `rm -rf`, which allows\
    \ to delete directories, even if they are not empty.\n\n`less` allows to view\
    \ a file by page. It is useful to review a file before editing it; the main use\
    \ of this command is it outputs a significant amount of text that does not fit\
    \ on screen and otherwise flashes too quickly. To exit less, press `q` (quit).\n\
    \n`grep` allows you to find a string of characters in the file. Please note that\
    \ `grep` searches by regular expression, that is, it provides the ability to specify\
    \ a template for searching whole words at once. In the language of regular expressions,\
    \ it is possible to make patterns describing. For more information, you can refer\
    \ to the on-screen documentation on `grep`. Syntax: `grep search_file`.\n\n`ps`\
    \ displays a list of current processes. The column indicates the process name,\
    \ `PID` (process identifier) is the process number (used for operations with process\
    \ — for example, sending signals with `kill`). Syntax: `ps`. Argument `u` gives\
    \ you more information, `ax` allows to view those processes that do not belong\
    \ to you.\n\n`kill` if the program stops responding or hangs, use this command\
    \ to complete it. Syntax: `kill PID`. The PID is the process identification number,\
    \ you can find out the process number for each executable program using `ps`.\
    \ Normally, `kill` sends a normal signal to the process, but sometimes it does\
    \ not work, and you will need to use `kill -9 PID`. In this case, the command\
    \ is immediately terminated by the system without the possibility of saving data\
    \ (normal). The list of signals that `kill` can send to a process can be obtained\
    \ by issuing `kill -l`.\n\n# Chapter 6. How to use Linux desktop\n\nNow that you\
    \ have Linux running on your computer, you will want to learn the basics. If you\
    \ are coming from Windows or Mac OS, things will look different, but don’t become\
    \ discouraged. You have already learned how to install new software, so make sure\
    \ that you find everything you need. Once you are happy with your selection, let’s\
    \ start to explore the rest of Linux. When you have logged in, you will be shown\
    \ the desktop, much like with Windows Mac OS. In Ubuntu, there will be a panel\
    \ across the top, as well as one on the bottom of the screen. Just like other\
    \ graphical operating systems, you will move the cursor around with your mouse,\
    \ and click on icons to activate them. See, it’s not different, is it?\n\nDesktop\
    \ PanelsThe bars on the top and bottom of the screen are panels, but you can customize\
    \ your panels in a huge number of ways. By doing this you can essentially create\
    \ the Linux experience that suits your needs. For many, this is not needed, so\
    \ don’t feel obliged to experiment with your panels. If you like the default experience,\
    \ that is all you need to use. Your panels provide a place for you to start, when\
    \ interacting with the desktop environment. They also give you various pieces\
    \ of information about your computer. Notifications will appear on your panels\
    \ as well. If you like, you can place your panels on the sides of the screen,\
    \ by accessing the properties of your system.\n\nAccessibility OptionsIf you need\
    \ special accessibility options, like larger icons, or an on-screen keyboard,\
    \ there will be an icon to access these. It is different for various systems;\
    \ it looks like an illustration of a person inside a circle for some. Clicking\
    \ on this icon will take you to a list of options, such as turning on a screen\
    \ reader, magnifying glass, changing the colors in contrast, sticky keys, ignoring\
    \ duplicate key presses, and pressing and holding keys.\n\nNavigation order to\
    \ move around inside your system, and access various files and software, you will\
    \ need to learn how to navigate Linux. This sounds more difficult than it actually\
    \ is. While different versions of Linux vary in how they deal with navigation,\
    \ the process is pretty easy to pick up. If you click on your system settings,\
    \ you will be taken to a list of options. Clicking on an option will take you\
    \ to more options, etc., until you arrive where you want to go. The main menus\
    \ are like tables of contents, and they will show you the more detailed sections\
    \ of each part of your computer system. If you are used to using Windows or Mac\
    \ OS, it should not take you long to figure out how to navigate through your computer.\
    \ If you cannot find something, simply perform a search, and type in what you\
    \ want to find. Ubuntu is especially powerful in this respect, as you can access\
    \ a system, and online, search by using the Windows key on your keyboard. Command\
    \ line is based on text, unlike GUIs (graphical interfaces) that people generally\
    \ use days. However, it can often be simpler to use command line, especially when\
    \ you want to get something quickly. Do you remember the old days when Microsoft\
    \ DOS was popular? You might recall seeing people working on computers, using\
    \ nothing but text commands to get things done. That is what Linux command line\
    \ does. There are different pieces of software for command line, and will have\
    \ their own versions. You can also install your own choice of command line. The\
    \ very thought of using command line scares a lot of people, and they have no\
    \ desire to so. However, since you are reading this section, let’s assume that\
    \ you want to learn about command line, and begin with some basic commands.\n\n\
    `cd` allows you to change the current directory (navigate through the file system).\
    \ Works with both absolute and relative paths. Suppose you are in your home directory\
