- fmt: '

    # Changing process priority

    `nice [-reduction factor] command [argument]`

    The `nice` command executes the specified command with a lower priority, the reduction
    factor is specified in the range `1..19` (by default it is equal to `10`). The
    superuser can increase the priority of the command. For this you need to specify
    a negative factor, for example `-10`. If you specify a coefficient greater than
    `19`, then it will be considered as `19`.


    ## nohup

    `nohup - ignore interrupt signals`

    `nohup command [argument]`

    `nohup` runs a command in the ignore mode. Only the `SIGHUP` and `SIGQUIT` signals
    are not ignored.


    ## kill

    `kill - forced completion of the process`

    `kill [signal number] PID`

    where `PID` is the process identifier that can be found using the `ps` command.


    ## Commands for running processes in the background - jobs, `fg`, `bg`

    The `jobs` command lists the processes that run in the background, `fg` - puts
    the process in normal mode ("to the foreground" - foreground), and `bg` - in the
    background. You can run the program in the background using the `<command> &`.


    # Chapter 8. Tips and Tricks

    Am sure that you are eager and keen to get stuck into more commands and begin
    doing some actual playing around with the system. We need to cover some theories
    first before we get into that. When you begin to play around with the system you
    are able to understand why it is behaving in such a way and you can also be able
    to learn the commands further.


    ## Creating a Directory

    Linux file systems are organized hierarchically. Because data builds up over time
    with increasing storage capacity, it’s necessary to have an efficient and manageable
    directory structure in order to organize the data. Many people make the mistake
    of putting all data at the base of the home directory and waste significant amounts
    of time searching for what they want in the middle of hundreds, if not thousands
    of files. Set yourself up for a better future by developing the habit of organizing
    your files into an elegant and efficient file structure now.


    Creating a directory is simple. The command to do so is `mkdir`, short for Make
    Directory.

    `mkdir [set of options]`

    At its simplest, running `mkdir` and only inputting a directory will create that
    directory.


    ```

    pwd

    /home/mike

    Isbin Docs public_html

    mkdir linuxbookwork

    Isbin Docs linuxbookwork public_html

    ```

    Let’s examine the commands step by step:

    - Line 1 - First, we ensure that we are in the correct location (my home directory).

    - Line 2 - List what’s already in the directory.

    - Line 7 - We run the `mkdir` command and create the directory `linuxbookwork`
    (which would be a good place to keep all work related to this book, and keep it
    separate from all the other files).


    It’s important to remember that when we supply a directory in this command, we
    actually are supplying it with a path. Relative or Absolute Path? The following
    are a few more ways that we can supply a directory to be created.

    ```bash

    mkdir /home/mike/anything

    mkdir ./something

    mkdir ../dir1

    mkdir ~/linuxbookwork/dir2

    ```

    Doesn’t make sense? Review chapter 2, Navigation.


    There are several options available to `mkdir` that can be very useful. How can
    we find out the command line options for a particular command?

    First, `-p` tells `mkdir` to create parent directories as needed (explained below).
    The second, `-v`, has `mkdir` tell us exactly what it is doing as it does it (as
    seen above, it usually does not).


    ```bash

    mkdir -p linuxbookwork/anything/sample

    cd linuxbookwork/anything/sample

    pwd/home/mike/linuxbookwork/anything/sample

    ```

    Now, the same command with the `-v` option added.

    ```bash

    mkdir -pv linuxbookwork/anything/sample

    mkdir: created directory ‘linuxbookwork/anything’

    mkdir: created directory ‘linuxbookwork/anything/sample’

    cd linuxbookwork/anything/sample

    pwd/home/mike/linuxbookwork/anything/sample

    ```


    ## Removing a Directory

    It’s important though to remember that there is no undo function on the Linux
    command line (while Linux GUI desktop environment will often include an undo feature,
    the command line doesn’t). Be careful. To remove a directory, the command is `rmdir`,
    which is short of remove directory.

    `rmdir [set of options]`

    `rmdir`, like `mkdir`, supports both the `-v` and `-p` options. Additionally,
    in order to be removed a directory must be empty (there is a way around it, but
    we will cover that later).

    ```bash

    rmdir linuxbookwork/anything/sample

    Is linuxbookwork/anything

    ```


    ## Blank Files

    Many commands that manipulate data within files will actually create files on
    their own if they are referred to and do not already exist. This characteristic
    can be used to create blank files, using the command `touch`.

    `touch [set of options]`

    ```

    pwd/home/mike/linuxbookwork

    Isfoot

    touch sample1

    Issample foo

    ```

    The `touch` command is used to change the access and modification times on a file
    (generally unnecessary, bus useful when working with a system that relies on file
    access or modification times). Students will occasional try to use this command
    to make it appear as though their files were not modified after the due date,
    though they’re rarely successful thanks to ways to detect it. The benefit here
    is that if we use the command on a file that doesn’t exist, it will be automatically
    created for us.


    Using commands and their behavior in creative ways, along with being familiar
    with different aspects of the system, comprise the main ways that a lot of things
    are done in Linux. In the introduction, we mention that the command line provides
    you with a set of building blocks. Those building blocks can be applied in any
    way you choose but are most effective when you understand fully how and why each
    function. The file we created is blank at the moment. In the future, we will examine
    methods of inserting and extracting data in and out of files.


    ## Copying a File/Directory

    Duplicates of files and directories are useful for a variety of reasons. One of
    the most common is in order to create a backup version before attempting to make
    some sort of modification to the original. That way information and progress aren’t
    lost in the event of a mistake. The command to create a duplicate is `cp`, meaning
    copy.

    `cp [set of options]`

    `cp` has a wide variety of options available. We’ll look at one of them below,
    but first it’s a good idea to look at the main page for `cp` to see what is available
    to us.

    ```

    Issample1 foo

    cp example 1 barry

    Isbarry sample1 foo

    ```

    In this example, both the source and destination are paths, and therefore we can
    refer to them using both the absolute and relative paths. For example:

    ```bash

    cp /home/mike/linuxbookwork/example2 example3

    cp example2 ../../mybackups

    cp example2 ../../mybackups/example4

    cp /home/mike/linuxbookwork/example2 /otherdir/anything/example5

    ```

    With `cp`, the destination can be either a file or a directory. In the case of
    a file (examples 1, 3, and 4) it will name the copy of the source by the filename
    specified in the destination. In the case of a directory as the destination, it
    will copy a file of the same name into the directory. By default, `cp` will only
    copy an individual file (you can copy multiple files at once, but will be covered
    in chapter 6, Wildcards). The `-r` option, standing for recursive, can be used
    to copy directories. When you use recursive, you want to look at a directory and
    all of the files and directories it contains, and subdirectories, and do the same
    thing repetitively.

    ```

    Isbarry example 1 foo

    cp -r foo something

    cp: omitting directory ‘foo’

    Isbarry sample1 foo something

    ```


    ## Moving a File or Directory

    The `mv` command is used to move files. `mv` works a lot like `cp`, with the slight
    advantage that it can apply to entire directories without the `-r` option.

    `mv [set of options]`

    ```

    Isbarry sample1 foo

    mkdir mybackups

    mv something mybackups/anything

    mv barry backsup/Ismybackups sample1 foo

    ```

    Now, to elaborate:

    - Line 3 - The creation of a new directory, `mybackups`.

    - Line 4 - Moving the directory into `mybackups` and rename it.

    - Line 7 - The file is moved into `mybackups`, since no destination was provided,
    it kept its name. Keep in mind that the source and destination are paths and can
    be referred as either absolute or relative.


    ## Renaming Files and Directories

    Similar to the command `touch`, the command `mv` can be used creatively to achieve
    a different outcome. As shown above on line 4, you can rename a file being moved
    by providing a new name for the file or directory. If we specify that the destination
    is the same directory as the source, then `mv` effectively rename a file or directory.

    ```

    Ismybackups sample1 foo

    mv foo something

    Ismybackups sample1 something

    cd Linux book/test

    mv linuxwork/test /home/mike/fred

    Ismybackups sample1 something

    ```

    - Line 3 - The file is renamed something (both paths are relative).

    - Line 6 - Moved into our parent directory. We only do so that next we can run
    commands on files and directories we aren’t currently in.

    - Line 8 - The directory is renamed to fred (the source path was absolute).


    ## Removing a File (and Non-Empty Directories)

    Like most commands, `rm` has a selection of options to alter how it behaves. You
    can explore most of them on your own, but particularly useful one is `-r`. Just
    like `cp`, `-r` means recursive. When you use recursive with the `rm` command,
    you can remove directories and all of the files and directories they hold within
    them.

    ```

    Ismybackups something

    rmdir mybackups

    rm: failed to remove ‘mybackups’.

    rm mybackups

    rm: Directory not empty

    rm mybackups

    rm -r mybackups Issomething fred

    ```

    As a safeguard, it’s often good to use `-i` in combination with `-r`. `-i` means
    interactive, when used it will cause a prompt before removing each file and directory
    as well as allowing you to cancel the command if need be.


    # A Command Line Editor

    One command line text editor for Linux is known as Vi. As you know, working with
    command line is very different from working with GUI - the command line is just
    a window with text input and output. Vi works within those limitations and because
    of that is an incredibly powerful tool. Though intended as a text editor, not
    a word processing suite, it packs a lot more power than both Notepad and Textedit.
    Vi is operated entirely by keyboard, the mouse plays no role whatsoever.


    The program has two potential modes: insert (input) and edit mode. While in insert
    mode, you can create content within the file, while in edit mode you can move
    around the file as well as actions such as search and replace, copying, deleting,
    saving, and so on. Generally, people will often mess up by entering commands or
    trying to input while in the wrong mode. It’s fairly easy to recover from either
    of mistakes though. While running `vi`, it’s usually issued with a command line
    argument: the file you want to edit.

    `vi`

    In the event that you forget to specify a file, it’s best to simply quit `vi`
    and restart it. Files specified can have either an absolute or relative path.
    Let’s have a go at it. It’s difficult to demonstrate a lot of the details, so
    I’ll be beginning by listing what you should type, and you can watch what happens.
    First, we’ll move to the directory that we created back in the file chapter. We
    need to create a few new files and don’t want them to be mixed up in all of the
    rest of your files. Here’s how we’ll edit our first file:

    ```

    vi myfirstfile

    ```

    This command will open the file, and if it doesn’t exist it will create it for
    you and then open it (you don’t have to do anything with a file before editing
    it). In vi, the file will look something like this (though slightly different
    depending on what kind of system you’re on).


    ### “myfirstfile” [New File]

    Vi will always start in edit mode, so now we must switch our mode to insert by
    the shortcut `i`. The bottom left corner of the window will indicate which mode
    you are in.


    ### --INSERT--

    Now you are able to type your lines of text. Pressing `esc` will return you to
    edit mode.


    ## Saving and Exiting

    In order to save and exit, you’ve got a few different options that are essentially
    equivalent. Take your pick. For all, ensure that you begin in edit mode. Again,
    if you’re unsure which mode you are in, the bottom left corner of the window will
    indicate it for you. As long as it doesn’t read INSERT, you are in edit mode.
    If you’re still not sure, pressing `esc` will automatically put you into edit
    mode. Pressing `esc` while in edit mode already will do nothing.

    - `ZZ` (capitalized) - Save and exit

    - `:q!` - Discard all recent changes, save, and exit.

    - `:w` - Save the file but keep vi running.

    - `:wq` - Save and exit, just like the first option.


    Within `vi`, commands are generally executed as soon as you finish with the sequence
    of keypresses. If a command begins with a colon (`:`) you must type a space before
    it will complete. Go ahead, save and exit your currently open files.


    ## Conclusion

    Linux is an operating system for computers. It exists in various distributions
    such as Ubuntu, Red Hat, Fedora and Linux mint which are called Linux distros.
    Each of these distros comes in two versions, that is, the server and the desktop
    versions. The sever versions of these distros have no graphics and supports only
    commands via the command line. This is to ensure a degree of security. This explains
    why most server computers run Linux as their OS. It also calls for the need to
    learn and understand the Linux commands. The command line is a very powerful tool
    in Linux and one can achieve everything that the Graphics users can achieve.

