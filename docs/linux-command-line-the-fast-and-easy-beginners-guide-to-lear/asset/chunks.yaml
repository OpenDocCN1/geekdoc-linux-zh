    \ entering this command will display a history of every command you have used,\
    \ next to number. If there are too many commands to display, use `history | less`\
    \ to give you a list that can scroll through.Use an Integrated Development EnvironmentWe\
    \ already explored the process of using the command line to write and execute\
    \ code for Linux in Python. There is another option for doing this, and is to\
    \ use an Integrated Development Environment, or IDLE (you might say that IDLE\
    \ is a play on the fact that programmers tend to be lazy and are constantly looking\
    \ for shortcuts). Ubuntu can be downloaded with graphics IDLE, or you can download\
    \ one separately. IDLE is written in Python, which makes it much easier to implement\
    \ the code you write.IDLE is a great program for beginner coders to use for several\
    \ reasons. One is that it automatically colors different features in different\
    \ colors, making finding mistakes easier. For example, key words, text, and comments\
    \ will all appear in different colors. Just like highlighting in your textbooks\
    \ made finding what you need easier, color-coding these different features makes\
    \ finding mistakes easier.Another reason is because it uses a graphical interface\
    \ (GUI) instead of a command line. This makes it much more user friendly and easy\
