    \n书中包含的信息及其内容并非取代或替代任何形式的医疗或专业建议；也不意味着不需要可能需要的独立医疗、财务、法律或其他专业建议或服务。书中的内容和信息仅供教育和娱乐目的之用。\n\
    \n书中的内容和信息汇自被认为可靠的来源，根据作者的知识、信息和信仰，这些是准确的。然而，作者无法保证其准确性和有效性，并不对任何错误和/或遗漏承担责任。此外，根据需要，会对本书进行定期更改。在适当和/必要的情况下，在使用本书中的任何建议的治疗方法、技术或信息之前，您必须咨询专业人士（包括但不限于您的医生、律师、财务顾问或其他此类专业顾问）。\n\
    \n在使用本书中包含的内容和信息时，您同意使作者免受任何损害、成本和费用，包括因应用本书提供的任何信息而可能导致的任何法律费用。此免责声明适用于直接或间接使用和应用所呈现的任何建议或信息而导致的任何损失、损害或伤害，无论是违约、侵权、过忽、个人伤害、刑事故意还是任何其他诉讼原因。您同意接受使用书中呈现信息的所有风险。您同意通过继续阅读本书，在适当和/必要的情况下，在使用本书中的任何建议的治疗方法、技术或信息之前将咨询专业人士（包括但不限于您的医生、律师或财务顾问或所需的其他顾问）。\n\
    \n# 目录\n\n- 引言\n- 命令行基础\n- 打开终端\n- 你在哪里？\n- 绝对路径与相对路径\n- 制表符补全\n- 第 1 章 快速入门\n\
    \    - 选择合适的 Linux 发行版\n- 第 2 章 Linux 安装\n    - 安装后的活动\n- 第 3 章 Linux 应用\n   \
    \ - 在哪哪里获取应用？\n    - 办公工具与应用程序\n    - 使用多媒体应用\n    - 在 Linux 下使用数字相机\n    - 如何从\
    \ CD 播放音频\n    - 如何播放音频文件\n    - 如何在 Linux 中刻刻盘\n    - 图形与成像应用\n    - GIMP\n \
    \   - GNOME Ghostview\n- 第 4 章 成为 Linux 高级用户\n    - 组命令\n- 第 5 章 使用 Shell\n  \
    \  - [环境变量]\n- 第 6 章 如何使用 Linux 桌面\n    - 桌面面板\n    - 使用集成开发环境\n    - 编写补丁\n-\
    \ 第 7 章 命令行操作\n    - 基础 Linux 命令\n    - net-tools\n    - Echo\n    - Cat\n   \
    \ - Nano, jed, vi\n    - Df\n    - Tar\n    - Zip and unzip\n    - Uname\n   \
    \ - Apt-get\n    - Chmod\n    - Hostname\n    - Ping\n    - iotop , iftop, hotp\n\
    \    - 理解进程\n- 第 8 章 技巧与窍\n    - 创建目录\n    - 删除目录\n    - 移动文件或目录\n    - 重命名文件和目录\n\
    \    - 删除文件（及空目录）\n    - 命令行编辑器\n    - 保存并退出\n- 结论\n\n# 引言\n\n恭喜下载《命令行》，感谢你的支持。当你查看\
    \ Linux 时，回顾它的演变过程是非常关重要的。尽管 Linux 是当今最强大的操作系统之一，但它的起点非常卑微，以下是它产生的历史。\n\n## 卑微的起点\n\
    \n1969 年，在肯·汤普（Ken Thompson）和丹尼斯·里奇（Dennis Ritchie）的帮助下，Unix 诞生了。随后出现了几个基于 Unix\
    \ 的项目，试图进一步。BSD 和 MINIX 等项目都在这段时期出现。这一切都已成为过去，直到一位名叫林纳斯·托瓦尔斯（Linus Torvalds）的天明学生将他对之前系统的知识相结合，创造了一个后来风靡世界的内核。\n\
    \n1991 年是 Linux 真正的诞生年。Linus 基于 MINIX 创建了一个免费的终端，并将他的版本命名为 Linux。尽管他并不希望它被称为 Linux，因为这看起来会很自大，但一个朋友重新命名了上传用于未来开发的版本，于是这个名字诞生了。\n\
    \n## 桌面\n\n1992 年至 1994 年间经历了桌面的增长。Slackware、Debian 和 Red Hat Linux 在此发布，内核版本为\
    \ 0.95 以及 TCP/IP 栈。然而，1994 年 3 月 Linux 1.0 的发布是游戏规则的改变者。该版本拥有 17,250 行代码，这在当时是极其惊人的。\n\
    \n## Gnome 和 KDE 的发布\n\nLinux 历史的下一章发生在 1995 年至 1999 年间。Linux 在此期间推出，被认为是第一个支持启动和\
    \ NFS 的 Linux 发行版。可以将已安装的版本复制到类似的机器上。正是这个发行版为我们今天所知的 SUSE Linux 奠定了基础。Red Hat\
    \ 分支被留在了。在这几年里，根据需要，Linux 内核从 1.2.0 版本演进到 2.2。前千年时代还看到了内存管理和 PowerPC 架构支持的巨大改进。Linux\
    \ 开始作为 IT 专业人士的选择而流行起来。这一时期的其他重大进展是 KDE 和 Gnome 环境的建立。KDE 由马蒂亚斯·埃特希（Matthias Ettrich）在图宾根大学创立。另一方面，Red\
    \ Hat 演变成了 Gnome 环境。当这些变化发生时，Sun 和 Oracle 宣布了对不同版本的支持。\n\n## Live 发行版\n\n千禧后的五年见证了一些惊人事物的兴起。许多\
    \ Linux 驱动计算机出现，内核也经历了许多变化。许多新应用被开发，所有第一个现场发行版诞生了。Knix 在 2000 年至 2005 年间流行，因为它可以从\
    \ CD 直接启动。这对于其他 Linux 发行版来说已经足够高了。Linux 也开始失去它的原创性并变得越来越像微软操作系统。这一时期的另一个重要里程碑是\
    \ Linux 内核 2.4 版本的发布，它支持 USB、EXT3 文件系统、RAID 和蓝牙。\n\n语义是决定语言含义的规则，而语法是在解释器执行程序时检查的。为了避免语义错误，建议在编码之前花时间规划和分析。如果计划得当，程序将花费更少的时间。语义的一个例子是计算数字和。当我们使用\
    \ `total number` 来除数字时，结果可能是错误的，但解释器不会显示任何错误，因为它不理解语义。现在让我们看看程序的各个部分与与编译的语言不同，基于解释器的语言不需要完整的程序就可以解析它。它可以处理单行代码并解释给计算机。这个内核是如此强大，以\
    \ `2.4.37.11` 的发布结束。2011 年的 `2.6` 支持 CPU、文件大小和 EXT4。\n\n## Ubuntu 时代\n\n2005 年之后，事情开始稳定，导致了\
    \ 2006 年至 2012 年的 Ubuntu 时代。Linux Mint 是最流行的发行版之一。尽管开头很小，时间会证明。\n\n## 命令行基础\n\n\
    命令行很简单。它可以告诉你如何操作，因为每个系统都是不同的，以下是一些地方。\n\n### 打开终端\n\n如果你使用 Linux，你将在那里得到。你也可以在计算机上右键。如果你在\
    \ Windows 上并想登录另一台机器，将需要 `SSH` 客户端。完美的应该是 `Putty`。\n\n### Shell\n\n在命令行中，我们有一个\
    \ shell。它定义了终端在执行 `bash` 后的行为。如果你想知道 shell 的类型，可以使用 `echo` 命令显示你的当前 shell。\n\n\
    ```bash\necho $SHELL/bin/bash\n```\n\n### 绝对路径与相对路径\n\n在精通 Linux 时很重要。当我们在命令行中引用目录或文件时，路径是一种寻找它的方法。\n\
    \n- **绝对路径**指定主目录或文件的位置。你可以轻松识别它们为 `/home/mike`。\n- **相对路径**相对于我们当前系统的目录或文件位置。一个例子是\
    \ `/home/mike`。\n\n### 你在哪里？\n\n知道在哪里很好。接下来你想知道那里有什么。工作的命令是 `ls` 的简短形式。试试看。\n\n\
    ```bash\nls public-html\n```\n\n`pwd` 是不带参数运行的。`ls` 更强大。当我们不带任何参数运行时，它会显示位置列表。\n\
    \n### ls [options] [file system location]\n\n```bash\nls [options] [file system\
    \ location]\n```\n\n在上面的示例中，方括号表示这些是选项；我们可以带或不带它们运行命令。分解如下：\n\n- 第一行是基础形式，显示当前目录的内容。\n\
    - 第 4 行是单个命令行选项，显示：\n    - 第一个字符显示文件或目录是否正常。\n    - 下九个字符是目录或文件的权限。\n    - 下一个是块数。\n\
    \    - 下一个字段显示文件的所有者。\n    - 下一个是文件所属的组。\n    - 下一个是文件大小。\n    - 后面是修改时间。\n  \
    \  - 最后是文件名。\n    - 第 10 行是命令行参数，告诉我们文件。\n    - 第 13 行是参数和命令行选项，显示文件的详细列表。\n \
    \   - 第 12 和 18 行显示我们的一些命令。\n\n### 制表符补全\n\n写这些路径是挑战性的。制表符补全是命令行提供的机制，在这种情况下会帮助。如果你尝试输入\
    \ `cd/home/` 可能会得到工作方式。\n\n## 总结：\n\n- `pwd`:打印工作目录。\n- `ls`:列出文件内容。\n- `cd`:切换目录。\n\
    - **相对路径**:相对于我们当前系统的目录或文件位置。\n- **绝对路径**:相对于文件系统的根的目录或文件。\n\n## 移动\n\n我们使用名为\
    \ `cd`（切换目录）的命令在系统中移动。工作如下：\n\n```bash\ncd [file system location]\n```\n\n当你运行不带参数的\
    \ `cd` 命令时，它通常带你回到主目录。以下是一些示例：\n\n```bash\ncd\n```\n\n```bash\ncd /home/mike\n\
    ```\n\n```bash\ncd ../\n```\n\n```bash\ncd /\n```\n\n***\n\n## 如何从磁盘开始安装 Linux\n\
    \n开始安装 Linux，将系统 CD 插入驱动器并选择从 CD 启动重启。\n\n电脑可能已经配置为从 CD 启动。如果没有发生 CD 启动，重启时进入\
    \ BIOS 设置。在大多数系统中，在启动电脑或重启后立即按下 `Delete` 键或 `F11`。\n\n之后，找到 Advanced BIOS Settings\
    \ 部分。有时区域可能不同，但在任何情况下与书中非常相似。通过方向键将指针指向它，然后按 Enter 键进入。现在在参数中找到 `Boot Sequence`（启动顺序），或者如果没有，找到\
    \ `1st boot device`（第一个启动设备）。使用方向键选择所需项目，并通过使用 `Page Up` 和 `Page Down` 键更改其值，使其成为第一个启动\
    \ CD-ROM 设备。按 `Esc` 键退出该区域。\n\n## 为什么你不能在已有分区上安装 Linux，即使有可用空间？\n\n事实是 Windows\
    \ 使用 `FAT32` 文件系统（旧版本 `FAT16`）或 `NTFS`（在 Windows NT/2000 中），而在 Linux 中是一个完全不同的系统，称为扩展文件系统\
    \ 2（`ext2fs`，最新版本为日志型 `ext4`）。这些文件系统只能位于硬盘的不同分区上。注意在 Linux 中，硬盘被称为第一个 `hda`，第二个\
    \ `hdb`，第三个 `hdc`，以此此类推（`hdd`、`hde`、`hdf`...）。有时在系统的安装程序可以看到磁盘的全名——`/dev/hda`\
    \ 代替 `hda`，`/dev/hdb` 代替 `hdb`，等等——这对我们现在来说是一样的。每个磁盘的逻辑分区都是编号的。因此，在 `hda` 物理磁盘上，有\
    \ `hda1`、`hda2` 等；`hdb` 物理磁盘上，有 `hdb1`、`hdb2` 等。\n\n"
