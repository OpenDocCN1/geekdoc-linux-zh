    # 第 5 章 使用 Shell


    对于一名高效的 Linux 专业人士来说，不使用命令行是不可想象的。命令行是一个 shell 提示符，表示系统已准备好接受用户命令。这可以认为是用户与系统的对话。对于输入的每个命令，用户都会收到系统的响应：


    1. 另一个提示，表示命令已执行，你可以输入下一个命令。

    2. 错误信息，系统对用户说明内部发生事件的陈述。


    习惯于在图形界面系统中工作的用户可能会觉得命令行操作非常不便。然而，在 Linux 中，这种类型的界面一直是基础性的，因此也得到了完善。在 Linux 使用的命令行
    shell 中，有很多方法可以省力，即在执行最常用操作时减少击键：

    - 自动添加长命令名或文件名

    - 搜索并重新执行以前执行过的命令

    - 使用某些模式替换文件名列表等


    当您需要对多种对象执行相似的操作时，命令行的优势尤为明显。在图形界面系统中，你需要进行与对象数量一样多的鼠标拖拽，而在命令行中，一个命令就足够。


    本节将介绍允许你使用命令行解决任何用户任务的主要工具：从文件和目录的简单操作（例如复制、重命名、搜索），到需要大量相似操作的复杂任务（这些任务出现在应用程序工作、处理大型数据数组或文本以及系统管理中）。


    ## Shells


    命令行 shell 或命令解释器是一个程序，其任务是将你的命令传递给操作系统和应用程序，并将它们的答案返回给你。根据其任务，它对应 MS-DOS 中的 `command.com`
    或 Windows 中的 `cmd.exe`，但从功能上来说，Linux shell 要丰富得多。在命令行 shell 语言中，你可以编写小型程序来对文件及其包含的数据执行一系列顺序操作——脚本。


    通过输入用户名和密码登录系统后，你将看到命令行提示符——以 `$` 结尾的行。以后该符号将用于命令行。如果在安装过程中配置了系统启动时启动图形界面，你可以通过
    `Ctrl-Alt-F1 - Ctrl-Alt-F6` 或使用任何终端仿真程序（例如 `xterm`）进入任何虚拟文本控制台的命令行。


    以下是可选的 shell，它们可能根据发行版的不同而异：


    - `bash`: Linux 最常用的 shell。它可以补全命令和文件名称，保留命令历史并提供编辑它们的能力。

    - `pdksh`: Korn shell 的克隆版本，在 UNIX shell 系统广为人知。

    - `sash`: 该 shell 的特殊之处在于它不依赖任何共享库，并包含了某些最重要工具的简化实现，例如 `al`、`dd` 和 `gzip`。因此，在从系统崩溃恢复或升级最重要共享库版本时，`sash`
    特别有用。

    - `tcsh`: C shell 的改进版本。

    - `zsh`: 此列出的 shell 中最新的。它实现了命令参数自动补全的高功能以及许多其他功能，使得使用 shell 变得更加方便高效。但请注意，所有
    `zsh` 扩展默认禁用禁用，因此在开始使用此命令行 shell 之前，你需要阅读其文档并启用所需的功能。


    默认 shell 是 `bash` (Bourne Again Shell)。要检查你正在使用哪种 shell，请输入命令：`echo $SHELL`。shell
    之间的不同不仅体现在能力上，还体现在命令语法上。如果你是新手，我们建议你使用 `bash`，后续示例将进一步描述该特定领域的工作。


    ## Bash shell


    `bash` 中的命令行由命令名、其后的键（选项）以及修改命令行为的指令组成。键以字符 `-` 或 `-- 开始 开头，通常由单个字母组成。除了键之外，命令后还可以跟参数（参数）——即必须执行命令的对象名称（通常是文件和目录的名称）。


    按下 `Enter` 键完成命令输入，随后命令将传递给 shell 执行。作为在用户终端上执行命令的结果，可能会出现关于命令执行或错误的消息，而下一个命令行提示符（以字符
    `$` 结尾）的出现则表示命令已完成，你可以输入下一个。


    `bash` 中有几种技术可以让你更容易输入和编辑命令行。例如，使用键盘，你可以：

    - `Ctrl-A`: 跳到行首。按下 `Home` 键也可以实现相同操作；

    - `Ctrl-U`: 删除当前行；

    - `Ctrl-C`: 终止当前命令的执行。


    你可以使用符号 `;` 在同一行内输入多个命令。`bash` 会记录历史记录。


    （注：由于原文从此处开始出现大量重复和无意义字符，译文已在逻辑完整处截止。）

