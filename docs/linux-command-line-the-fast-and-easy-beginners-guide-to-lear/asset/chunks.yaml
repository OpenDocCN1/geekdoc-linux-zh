  trans: '


    # 理解进程


    Linux 中的进程（与 UNIX 相同）是一个在独立的虚拟地址空间中运行的程序。当用户登录系统时，会自动创建一个进程，并在其中执行 shell，例如 `/bin/bash`。


    Linux 支持经典的多程序设计方案。Linux 支持并行（如果只有一个处理器，则为准并行）用户进程。每个进程都运行在自己的虚拟地址空间内，也就是说，进程进程之间是相互保护的，一个进程的崩溃不会影响其他正在运行的进程以及整个系统。在没有获得另一个进程“权限”的情况下，一个进程无法从另一个进程的内存中读取任何内容（或向其写入）。系统允许进程之间进行授权的交互。


    内核提供了系统调用，用于创建新进程和管理已生成的进程。只有当另一个进程启动它或发生某些中断（例如，外部设备中断）时，任何程序才能开始执行。


    随着 SMP（对称多处理器架构）的发展，Linux 内核中引入了线程或控制线程的机制。线程是运行在虚拟内存中的进程，它与具有独立虚拟内存的进程的其他线程一起使用。


    当 shell 遇到与可执行文件对应的命令时，解释器会从入口点开始执行它。对于 C 程序，入口点是 `main` 函数。运行中的程序也可以创建一个进程，即运行某个程序，其执行也将从
    `main` 函数开始。


    使用两个系统调用来创建进程：`fork()` 和 `exec`。`fork()` 创建一个与主进程地址空间完全相同的新地址空间。执行此系统调用后，我们得到了两个相同的进程：主进程和生成的进程。`fork()`
    函数在子进程中返回 `0`，而在主进程中基本上返回 `PID`（进程 ID，是派生进程的标识）。`PID` 是一个整数。


    现在我们已经创建了进程，可以通过调用 `exec` 来启动程序。`exec` 函数的参数是可执行文件的文件名，如果有必要，还有传递给该程序的参数。新程序将被加载到
    `fork()` 进程的地址空间中，并从入口点（`main` 函数的地址）开始运行。


    例如，考虑程序的这段片段：

    ```c

    if (fork () == 0) wait (0);

    else execl ("ls", "ls", 0); / * 生进程 * /

    ```


    现在让我们仔细观察执行 `fork()` 调用时发生了什么：

    1. 在进程表中为新进程句柄分配内存。

    2. 分配进程 ID `PID`。

    3. 创建一个执行 `fork()` 的进程逻辑拷贝——完全复制父进程的虚拟内存内容，复制祖先进程内核静态和动态上下文的组件。

    4. 增加文件打开计数器（子进程继承父进程的所有打开文件）。

    5. 在父进程中向系统调用的返回点返回 `PID`，在后代进程中返回 `0`。


    ## 通用进程控制方案


    每个进程可以使用 `fork()` 创建一个完全相同的进程。父进程可以使用 `wait` 系统调用等待直到其所有子进程都完成执行。


    在任何时候，进程都可以使用 `exec` 用的类型之一更改其内存镜像的内容。每个进程都会对信号做出响应，而且当然，可以为操作系统产生的信号设置自己的响应。可以使用
    `nice` 系统调用更改进程的优先级。


    信号是通知内核进程事件发生的一种方式。如果由于发了多个同类型的事件，则只会向进程发送一个信号。信号意味着事件已经发生，但内核不会报告发生了多少次此类事件。


    信号示例：

    1. 子进程终止（例如，由于 `exit` 系统调用（见下文））

    2. 异常情况的发生

    3. 当你按下某些键时来自用户的信号！


    你可以通过 `signal` 系统调用设置对信号的响应。

    `func = signal (snum, function);`

    `snum` 是信号号，`function` 是指定信号到达时要执行的函数地址。返回值将响应信号的函数地址。你可以指定 0 或 1 来代替 `function`。如果指定了
    0，那么当 `snum` 信号到达时，进程将像 `exit` 调用一样被中断。如果你指定了 1，则该信号将被忽略，但它可能用于进程调用的正常完成。

    `exit (status);`

    其中 `status` 是祖先进程返回的整数，用于告知其后代进程终止的原因。`exit` 调用可以在程序的任何点设置，但也可以是隐式的，例如，在退出 `main`
    函数时（使用 C 语言编程时），操作符 `return 0` 将被解释为系统调用 `exit (0)`。


    ## 输入输出重定向


    几乎所有的操作系统都有输入输出重定向机制。Linux 也不例外。通常，程序从控制台（终端）输入数据并输出数据到控制台。终端意味着键盘。文件操作通过文件描述符进行。Unix
    使用三个文件进行输入输出：`stdin` (1)、`stdout` (2) 和 `stderr` (3)。


    `>` 符号用于将标准输出重定向到文件。

    示例：`$ cat > newfile.txt`

    `cat` 命令的标准输入将被重定向到文件 `newfile.txt`，该将在命令执行后创建。如果存在同名文件，将被覆盖。按下 Ctrl + D 将停止重定向。


    `<` 符号用于重新分配标准命令输入。例如，如果你运行 `cat <file.txt` 命令，将使用 `file.txt` 文件作为标准输入，而不是键盘。


    `>>` 符号用于将标准输出追加到文件结尾。例如，与符号 `>` 情况不同，执行命令 `cat >> newfile.txt` 如果文件存在则不会覆盖，而是将数据添加到末尾。


    符号 `|` 用于将一个程序的标准输出重定向到另一个程序的标准输入。例如，`ps -ax | grep httpd`。


    ## 进程管理命令


    ### ps 命令

    旨在显示运行进程的信息。该命令有许多参数，你可以在手册中查看（`man ps`）。这里我只描述常用的命令：

    - `a` 显示所有与终端相关的进程（所有用户进程）

    - `e` 显示所有进程

    - `t` 终端列表，显示与终端相关的进程

    - `u` 用户标识，显示与这些标识相关的进程

    - `g` 组 ID，显示与这些组 ID 相关的进程

    - `x` 显示所有非终端进程


    ### top 程序

    旨在实时显示进程信息。进程按最大 CPU 时间排序，但你可以更改排序顺序（参见 `man top`）。


    你可以使用 `free` 命令查看 RAM 信息，使用 `df` 查看磁盘内存信息。关于系统中注册用户的信息可以通过 `w` 命令获取。


