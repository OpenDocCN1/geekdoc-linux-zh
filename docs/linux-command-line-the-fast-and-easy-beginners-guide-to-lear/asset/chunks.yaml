    # users, who 和 w


    `users`、`who` 和 `w` 命令显示当前登录到你的 Linux 系统的用户。`w` 命令扩展了 `who` 的输出，增加了运行时间（uptime）信息以及一个包含最后执行命令的列。相比之下，`users`
    仅以空格分隔的列表的形式在单行中输出用户名（见下图）。


    ![Description: 00065.jpeg](img/rsrc1U5.jpg)


    `who` 的单列从用户的登录名开始。输出后续是终端名称，其中“console”代表登录终端，而“pts/1”是第一个伪终端会话的缩写。最后两列包含登录时间和用户所在的主机，位于括号内（见下图）。


    ![Description: 00066.jpeg](img/rsrc1U6.jpg)


    `w` 的单列包含用户的登录名（标题为 `LOGIN`）、终端名称（标题为 `TTY`）、用户所在的主机名称（标题为 `FROM`）、登录时间（标题为 `LOGIN@`）、活动情况（空闲时间和
    CPU 使用率，标题为 `IDLE`、`JCPU` 和 `PCPU`）以及用户执行的最后命令（标题为 `WHAT`）（见下图）。


    ![Description: 00067.jpeg](img/rsrc1U7.jpg)


    # id 和 groups


    `id` 命令输出当前的用户和组信息（见下图）。从左到右，列分别显示用户 ID (`uid=1000(user)`)、组 ID (`gid=1000(group)`)
    以及用户所属的组名。


    ![Description: 00068.jpeg](img/rsrc1U8.jpg)


    为了列出用户所属的所有组名，你也可以调用 `groups` 命令（见下图）。输出是空格分隔的组名列表。


    ![Description: 00069.jpeg](img/rsrc1U9.jpg)


    # passwd


    如第 4 章所述，Linux 系统至少有两个用户：一个管理员 root 用户和一个我们简称为 `user` 的普通用户。每个账户也都受密码保护。


    要更改你的密码，请使用 Debian “passwd” 软件包中的 `passwd` 命令（参阅第 4 章关于如何安装额外软件的内容）。如下所示，首先输入当前密码，按回车键，输入新密码，按回车键确认，再次输入新密码并按回车键确认。


    ![Description: 00070.jpeg](img/rsrc1UA.jpg)


    作为普通用户，仅允许更改自己的密码。密码以哈希值的形式存储在配置文件 `/etc/shadow` 中。该文件的内容对管理员用户可见。下面的示例显示了如何借助
    `grep` 命令（见本章前面的内容）提取用户“user”的信息。


    ![Description: 00071.jpeg](img/rsrc1UB.jpg)


    # chfn


    此命令同样来自 Debian “passwd” 软件包，用于更改存储在系统文件 `/etc/passwd` 中的用户信息。在安装你的 Debian 系统期间，基础设置已经完成。要修改这些信息，你可以在交互模式下直接运行不带任何参数的
    `chfn`，或者使用以下某一个或多个选项来调整某个特定值：


    - `-f` 或 `--full-name`：更改用户的全名

    - `-h` 或 `--home-phone`：更改用户的家庭电话

    - `-r` 或 `--room`：更改用户的房间号

    - `-w` 或 `--work-phone`：更改用户的办公电话


    以下示例将家庭电话号码更改为 135：


    ```

    $ chfn -h 135Password:$ |

    ```


    # chsh


    此命令（同样来自 Debian “passwd” 软件包）更改你用于登录 Linux 系统的 shell 条目。同样，这些信息存储在文件 `/etc/passwd`
    中。允许使用的 shell 受限于配置文件 `/etc/shells` 中的条目。`chsh` 的工作与 `chfn` 命令类似。在不带额外选项调用时，将使用交互方法（见下图）。


    ![Description: 00072.jpeg](img/rsrc1UC.jpg)


    `chsh` 接受选项 `-s`（`shell` 的缩写）以便在非交互模式下设置 shell。以下示例显示了相应的命令行调用：


    ```

    $ chsh -s /bin/bash$

    ```


    要修改其他其他用户的 shell，请使用用户名作为参数调用 `chsh` 命令。注意，只有管理员才能为其他用户执行此操作。下一个示例显示了如何为用户“felix”操作。


    ```

    # chsh felixChanging the login shell for felixEnter the new value, or press ENTER
    for the new valueLogin shell [/bin/bash]:# |

    ```


    # su 和 sudo


    为了将角色从一个用户切换到另一个用户，你使用 `su` 命令。`su` 是“switch user”的缩写。在不带额外选项调用时，如下所示切换到 root
    用户：


    ```

    $ suPassword:# |

    ```


    作为管理员 root 用户工作意味着巨大的责任，并假设你确切知道自己在做什么。要以 root 以外的用户身份工作，如下所示使用所需的用户名调用 `su` 命令：


    ```

    $ su felixPassword:$ |

    ```


    `su` 命令会永久更改当前角色。要以管理员身份运行单条命令，请使用 `sudo` 命令。这需要安装 Debian “sudo” 软件包（参阅第 4 章关于安装额外软件的内容），并使用
    `visudo` 命令将额外用户添加到配置文件 `/etc/sudoers` 中。这一步稍后解释。


    # adduser


    `adduser` 命令创建新的用户账户。下图显示了所需的信息。这包括 `/etc/passwd` 中的新条目，以及新组和主目录的创建。此外，来自 `/etc/skel`
    的准备数据会被复制到之前创建的主目录中。之后，使用 `chsh` 命令修改账户（见本章前面的内容）。


    ![Description: 00073.jpeg](img/rsrc1UD.jpg)


    设置新用户后，`/etc/passwd` 中的条目如下：


    ![Description: 00074.jpeg](img/rsrc1UE.jpg)


    删除用户账户和修改用户账户通过 `deluser` 和 `usermod` 命令完成。这些命令的用法将在以后解释。


    # 7.4 进程管理


    ### ps

    此命令列出 Linux 系统的运行进程。下图显示了当前会话的进程，其中 `ps ax` 调用（见随后）列出了 Linux 系统中的所有进程。`ps` 命令有一系列选项，将在以后详细解释。


    ![Description: 00075.jpeg](img/rsrc1UF.jpg)

    ![Description: 00076.jpeg](img/rsrc1UG.jpg)


    ### pgrep


    `pgrep` 是进程的 `grep` 命令（见本章前面的内容）。该命令遍历当前运行的进程，并输出匹配给定模式的进程 ID。下图显示了两次调用。第一次调用请求
    `pgrep` 搜索名称包含字符串模式“xterm”的进程，并仅输出进程 ID。第二次调用使用选项 `-l`（`--list-name` 的缩写）和 `-a`（`--list-full`
    的缩写）来显示进程 ID 和对应的进程名。


    ![Description: 00077.jpeg](img/rsrc1UH.jpg)


    ### kill

    此命令向进程发送特定信号。要终止此进程，使用 SIGTERM 信号。下一个示例显示如何结束进程 ID 为 12345 的进程。`kill` 命令需要进程 ID
    才能正常工作。先使用 `ps` 或 `pgrep` 获取相应的进程 ID（见本章前面的内容）。


    ```

    $ kill 12345$

    ```


    ### killall

    此命令属于基础 Debian 软件包“psmisc”（参阅第 4 章安装额外软件包）。`killall` 向所有匹配指定命令的进程发送信号。例如，命令


    ```

    killall firefox

    ```


    '
- fmt: '

    sends the signal `SIGTERM` to all the processes that have the name “firefox” in
    order to terminate the process. Amongst other options, `killall` allows these
    parameters:


    - `-e` (short for `--exact`): require an exact match

    - `-I` (short for `--ignore-case`): treat the process name case-insensitive

    - `-i` (short for `--interactive`): interactively ask for confirmation before
    terminating the process

    - `-v` (short for `--verbose`): send a confirmation message if the process terminated


    The following example shows how to combine the two commands `pgrep` and `killall`.
    First, obtain the process ID using `pgrep` as well as the exact name of the process.
    Second, invoke `killall` with the two options `-i` and `-v` to terminate all the
    processes that have that name. Prior to killing the processes `killall` asks you
    for confirmation, and afterward outputs a confirmation message.


    ![Description: 00078.jpeg](rsrc1UJ.jpg)


    ## pkill


    The two commands `pkill` and `pgrep` (see earlier in this chapter) belong to the
    same software package. Whilst `pgrep` scans the process list and outputs the process
    ID, the `pkill` command will send the termination signal to the processes that
    match the given pattern. In order to terminate all the “xterm” processes, invoke
    the following command:


    ```

    $ pkill xterm$

    ```

