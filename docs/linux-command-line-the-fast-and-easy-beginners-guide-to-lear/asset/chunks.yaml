    # users, who and w


    The `users`, `who` and the `w` commands show the users that are currently logged
    into your Linux system. `w` extends the output of `who` by the uptime information
    and another column that contains the last command that was executed. In contrast,
    `users` simply outputs the name of the users as a space-separated list in a single
    line (see image below).


    ![Description: 00065.jpeg](rsrc1U5.jpg)


    The single columns for `who` start with the login name of the user. The output
    is followed by the name of the terminal, where “console” represents a login terminal,
    and “pts/1” abbreviates the first pseudo terminal session. The last two columns
    contain the login time and the host the user comes from, in brackets (see image
    below).


    ![Description: 00066.jpeg](rsrc1U6.jpg)


    The single columns for `w` contain the login name of the user (titled `LOGIN`),
    the name of the terminal (titled `TTY`), the name of the host the user comes from
    (titled `FROM`), the login time (titled `LOGIN@`), the activity (idle time and
    CPU usage titled `IDLE`, `JCPU`, and `PCPU`) as well as the last command the user
    executed (titled `WHAT`) (see image below).


    ![Description: 00067.jpeg](rsrc1U7.jpg)


    # id and groups


    The `id` command outputs the user and group information of the current user (see
    image below). From left to right the columns show the user ID (`uid=1000(user)`),
    the group id (`gid=1000(group)`) and the name of the groups the user is a member
    of.


    ![Description: 00068.jpeg](rsrc1U8.jpg)


    In order to list the names of all the groups the user belongs to, you can also
    invoke the `groups` command (see image below). The output is a space-separated
    list of the group names.


    ![Description: 00069.jpeg](rsrc1U9.jpg)


    # passwd


    As described in Chapter 4, the Linux system has at least two users: an administrative
    root user and a regular user that we simply called `user`. Every account is also
    secured with a password.


    In order to change your password, use the `passwd` command from the Debian “passwd”
    package (refer to Chapter 4 on how to install additional software). As shown below,
    type in the current password first, press Enter, type in the new password, press
    Enter to confirm, retype the new password and press Enter to confirm, again.


    ![Description: 00070.jpeg](rsrc1UA.jpg)


    As a regular user, you are allowed to change your own password only. The password
    is stored as a hashed value in the configuration file `/etc/shadow`. The content
    of this file is only visible to the administrative user. The example below shows
    how to extract the information for the user “user` with the help of the `grep`
    command (see earlier in this chapter).


    ![Description: 00071.jpeg](rsrc1UB.jpg)


    # chfn


    This command is also from the Debian “passwd” package and changes the user information
    that is stored on your system in the file `/etc/passwd`. During the installation
    of your Debian system the basic setup was already done. In order to modify this
    information, you can run `chfn` without further parameters in interactive mode,
    or with one or more of the following options to adapt only a specific value:


    - `-f` or `--full-name`: change the full name of the user

    - `-h` or `--home-phone`: change the home phone of the user

    - `-r` or `--room`: change the room number of the user

    - `-w` or `--work-phone`: change the work phone of the user


    The following example changes the entry for the home phone number to 135:


    ```

    $ chfn -h 135Password:$ |

    ```


    # chsh


    This command (also from the Debian “passwd” package) changes the entry for the
    shell that you use to log into your Linux system. Again, this information is stored
    in the file `/etc/passwd`. Which shells are allowed to be used are limited by
    the entries in the configuration file `/etc/shells`. `chsh` works similar to the
    `chfn` command. Invoked without further options an interactive method is used
    (see image below).


    ![Description: 00072.jpeg](rsrc1UC.jpg)


    `chsh` accepts the option `-s` (short for `--shell`) in order to set the shell
    in non-interactive mode. The following example shows the according command line
    call:


    ```

    $ chsh -s /bin/bash$

    ```


    In order to modify the shell for a different user other than yourself, invoke
    the `chsh` command with the username as a parameter. Note that only the administrative
    user can do this for a different user. The next example shows how to do that for
    the user “felix`.


    ```

    # chsh felixChanging the login shell for felixEnter the new value, or press ENTER
    for the new valueLogin shell [/bin/bash]:# |

    ```


    # su and sudo


    In order to change your role from one user to another, you utilize the `su` command.
    `su` abbreviates “switch user”. Invoked without further options you change to
    the root user as follows:


    ```

    $ suPassword:# |

    ```


    Working as the administrative root user comes with great responsibility and presumes
    that you know exactly what you are doing. To work as a different user than root,
    invoke the `su` command with the desired username as follows:


    ```

    $ su felixPassword:$ |

    ```


    The `su` command changes the current role permanently. In order to run only a
    single command as an administrative user, use the `sudo` command. This requires
    the Debian “sudo” package to be installed (refer to Chapter 4 on installing additional
    software) and the additional user to be added to the configuration file `/etc/sudoers`
    using the `visudo` command. This step will be explained later.


    # adduser


    The `adduser` command creates new user accounts. The image below shows the information
    that is required. This includes a new entry in `/etc/passwd` as well as the creation
    of new group, plus home directory. Furthermore, prepared data from `/etc/skel`
    is copied into the previously created home directory. Afterward, the account is
    modified using the `chsh` command (see earlier in this chapter).


    ![Description: 00073.jpeg](rsrc1UD.jpg)


    Having set up the new user, the entry in `/etc/passwd` looks as follows:


    ![Description: 00074.jpeg](rsrc1UE.jpg)


    Deleting user accounts and modifying user accounts is done with the help of the
    two commands `deluser` and `usermod`. The usage of these commands will be explained
    later on.


    # 7.4 Process Management


    ### ps

    This command lists the running processes of your Linux system. The image below
    shows the processes in your current session, where the call `ps ax` (see the image
    thereafter) lists all the processes in your Linux system. The `ps` command has
    a long list of options that will be explained later in more detail.


    ![Description: 00075.jpeg](rsrc1UF.jpg)

    ![Description: 00076.jpeg](rsrc1UG.jpg)


    ### pgrep


    pgrep` is the `grep` command (see earlier in this chapter) for processes. This
    command looks through the currently running processes and outputs the process
    ID’s that match the given pattern. The image below shows two calls. The first
    call asks `pgrep` to search for the processes that have the string pattern “xterm”
    in its name, and to output the resulting process ID only. The second call uses
    the two options `-l` (short for `--list-name`) and `-a` (short for `--list-full`)
    in order to show the process ID and the resulting process name.


    ![Description: 00077.jpeg](rsrc1UH.jpg)


    ### kill

    This command sends a specific signal to a process. In order to terminate this
    process use the `SIGTERM` signal. The next example shows how to end the process
    that has the process ID 12345. The `kill` command requires a process ID to work
    properly. Use `ps` or `pgrep` to obtain the according process ID first (see earlier
    in this chapter).


    ```

    $ kill 12345$

    ```


    ### killall

    This command is part of the essential Debian package “psmisc” (refer to Chapter
    4 on installing additional packages). `killall` sends a signal to all the processes
    that match the specified command. As an example, the command


    ```

    killall firefox

    ```

