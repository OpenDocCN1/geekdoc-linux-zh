    # top

    The `top` command displays the processes according to their activity. The most
    active process is on top, followed by the less active ones. The list is updated
    every second. The single columns contain the process ID (titled `PID`), the username
    of the owner of the process (titled `USER`), the process priority (titled `PR`),
    the nice level (titled `NI`), the virtual memory usage (titled `VIRT`), the reserved
    memory (titled `RES`), the shared memory (titled `SHR`), both the percentile CPU
    and memory usage (titled `%CPU` and `%MEM`), the running time of the process (titled
    `TIME+`) as well as the command that was used to invoke the process (titled `COMMAND`).
    In order to quit `top` press the `q` key.


    ![Description: 00079.jpeg](rsrc1UK.jpg)


    # htop

    `htop` is an additional software package (refer to Chapter 4 on installing additional
    packages) and contains a more interactive version of `top` (which we mentioned
    above). The arrangement of the columns is similar to `top`. Use the navigation
    and function keys in order to select the processes, sort them, or delete them.
    The function keys are:

    - `F1`: show help

    - `F2`: configure `htop`

    - `F3`: search within the process list

    - `F4`: filter the terminal output

    - `F5`: display the processes as a process tree

    - `F6`: change the sort order of the processes

    - `F7`: decrease the nice level of the selected process

    - `F8`: increase the nice level of the selected process

    - `F9`: terminate the selected process

    - `F10`: quit the program


    ![Description: 00080.jpeg](rsrc1UM.jpg)


    # 7.5 Network and System Information


    ## uname

    `uname` abbreviates the term “UNIX name”. The command displays system information
    such as the exact name and version of the Linux kernel and the hostname of your
    computer. The image below shows the call of the `uname` command with the parameter
    `-a` (short for `--all`). The output contains the name of the operating system
    (Linux), the hostname (debian95), the kernel version and its build date (`4.9.8-7-amd64
    #1 SMP Debian 4.9.110-1 (2018-07-05)`) as well as the architecture of the system
    (x86_64).


    ![Description: 00081.jpeg](rsrc1UN.jpg)


    ## uptime

    This command shows how long the system is running. It displays the current time
    (07:36:47) followed by the uptime in hours (21:56), the number of logged in users
    (1 user) and the average load (`load average: 0.47, 0.43, 0.29`) for the last
    1, 5 and 15 minutes.


    ![Description: 00082.jpeg](rsrc1UP.jpg)


    In order to see the uptime in a nicer way, use the option `-p` (short for `--pretty`).
    The image below displays a more human-readable version of the information. The
    system is up 22 hours and 3 minutes.


    ![Description: 00083.jpeg](rsrc1UR.jpg)


    ## ip

    The `ip` command (along with the two keywords `address show`) displays the current
    network configuration. The image below shows the loopback interface (`lo`) and
    the ethernet interface (`enp0s3`). The ethernet interface is configured with the
    IP address `10.0.2.15`. The network interfaces are abbreviated as follows:

    - `lo`: the loopback interface. It is used to access local services such as a
    proxy or web server `http://127.0.0.1/`

    - `eth0`: the first Ethernet interface connected to a network switch or router

    - `wlan0`: the first wireless interface


    ![Description: 00084.jpeg](rsrc1US.jpg)


    ## ping

    `ping` sends ICMP network packets to the given IP address or hostname and displays
    the turnaround time. The image below demonstrates this for the host `http://www.google.com`.


    ![Description: 00085.jpeg](rsrc1UT.jpg)

    ![Description: 00086.jpeg](rsrc1UU.jpg)


    ## net-tools


    ### Echo

    This command will help you move some data, usually in text form into a file. For
    instance, if you want to add to another that is already made or make a new text
    file altogether, all you have to do is simply enter:


    ![Description: 00023.gif](rsrc1UV.jpg)

    Here, you don’t need to use the backward slash to separate the spaces because
    you’ll add two triangle brackets when you complete what you need to write.


    ### Cat

    This command is used to display file contents. You’ll find it important when you
    want to view programs easily.


    ![Description: 00024.jpeg](rsrc1UW.jpg)


    ### Nano, jed, vi

    First of all, the command `nano` is a great text editor that denotes the colored
    keywords, besides being able to recognize most languages. `vi` on the other hand
    is simpler than `nano`. You can make a new file or use the editor to modify a
    file. Let’s take an example. You want to make a file with the name `check.txt`.
    You can use the `nano check.txt` command to make it. After editing, you can save
    the files with the sequence `ctrl+x`, and then `y` (yes) or `n` (no).


    ![Description: 00025.jpeg](rsrc1UX.jpg)


    ### Sudo

    `sudo` means ‘super user do’. That means that if you want to have any command
    implemented with root or administrative privileges, you can invoke the `sudo`
    command. Let’s take an example: You want to edit the file `viz. Alsa-base.conf`
    or any other file that requires root permission.


    ![Description: 00026.gif](rsrc1UY.jpg)

    You can use the `sudo bash` command to enter the root command, and then enter
    your password. Another command you can use to do this is `su`, but you’ll have
    to set a root password before that. To do that, you can enter the `sudo passwd`
    command and then enter the new password.


    ![Description: 00027.jpeg](rsrc1UZ.jpg)


    ### Df

    If you want to see how much disk space you have left in each of system’s partitions,
    you can use the `df` command. All you have to do is type it in your command line
    and you’ll be able to see each mounted partition and how much space is used or
    available in kilobytes. You can use the command `df -m` if you want to see it
    in megabytes.


    ![Description: 00028.jpeg](rsrc1V0.jpg)


    ### Tar

    This command is useful when you want to work with tarballs (archives or files
    compressed in archives) in the command line. You can use it to do so; you can
    use it to compress or un-compress various kinds of archives such as `.tar.gz`,
    `.tar` and `.tar.bz2`. It works on the arguments you give it. For instance, `tar
    -cvf` will create a `.tar` archive, `-xvf` will untar a tar archive and `-tvf`
    will list the archive’s contents. You can take a look at [these](http://www.tecm.com/tar-command-examples-in-linux/)
    of tar commands to learn more.


    ### Zip and unzip

    You’ll use `zip` to compress files into a zip archive and `unzip` to extract them
    from a zip archive.


    ### Uname

    This command helps you see information about the system your distro is running
    at the moment. To print out the information about the system, you can use the
    `uname -a` command. You’ll see the kernel release, processor type, version and
    so on.


    ![Description: 00029.jpeg](rsrc1V1.jpg)


    ### Apt-get

    `apt-get` comes in when you want to work with packages in Linux. It installs packages.
    You’ll require root privileges here so you’ll have to use the `sudo` command along
    with it. For instance, let’ say you wish to install the `jed` text editor.


    ![Description: 00030.gif](rsrc1V2.jpg)

    This is how you’ll install other packages as well. You’ll also want to update
    the repository whenever you install a brand new packagewhich is as simple as typing
    `sudo apt-get update`. Replace the word `update` with `upgrade` to upgrade the
    distro. Moreover, the `apt-cache search` command searches for a package.


    ![Description: 00031.jpeg](rsrc1V3.jpg)


    ### Chmod

    When you want to make your file more executable and change the permissions is
    granted by Linux, `chmod` is your command. You can imagine having a python code
    called `numbers.py` on your computer. You’ll have to run `python numbers.py` each
    time you have to run it. Instead of doing that, you can simply run the file by
    running `numbers.py` in the terminal. The command `chmod +x numbers.py` will help
    you make the file executable in this case. You can give it root permissions with
    `chmod 755 numbers.py` or, for root executable, `sudo chmod +x numbers.py`.


    ![Description: 00032.jpeg](rsrc1V4.jpg)


    ### Hostname

    If you want to know the name in your network or host, simply use `hostname`. It
    essentially displays your IP address and hostname. If you want to get your network
    IP address, simply type in `hostname -i`.


    ![Description: 00033.jpeg](rsrc1V5.jpg)


    ### Ping

    This command is great when it comes to checking your connection to a server. For
    those who are more technically inclined, it is a software utility in computer
    network administration that you use to test host reachability on an IP network.
    Let’s take a simple example: when you enter something like `ping google.com`,
    it checks whether it can connect to the server and come back. This round-trip
    time is measured and you get the full details about it. People like us however
    use this command for simple stuff like checking the internet connection. In our
    case, if it pings the server (Google), it means your internet connection is active.


    ![Description: 00034.jpeg](rsrc1V6.jpg)


    # iotop, iftop, hot

    Understanding the execution of a program is essential for being a good system
    administrator. In this chapter, we will be looking at processes in greater detail,
    as well as how to work with and manipulate processes. A running instance of a
    program is known as a process. It is made up of the program instruction, data
    read from files, as well as other programs or inputs from a system user. Every
    process is assigned a Process ID (PID) which allows the system to keep track of
    all processes. The system boot process has a PID 0, then the initial process has
    a PID 1, and so on in a sequential manner. The initial process PID 1 refers to
    `/sbin/initd` on older Linux systems or `/sbin/systemd` on contemporary Linux
    systems.


    ## Working with Processes


    ### ps and pstree

    In order to list all the running processes, use either the `ps` command or the
    `pstree` command.


    ![Description: 00103.jpeg](rsrc1V7.jpg)

    The output of `ps` as shown above consists of four columns that have the following
    meanings:

