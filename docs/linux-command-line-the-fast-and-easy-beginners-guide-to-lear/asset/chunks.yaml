- fmt: "\n# Understanding processes\n\nA process in Linux (as in UNIX) is a program\
    \ that runs in a separate virtual address space. When a user logs into the system,\
    \ a process is automatically created in which the shell is executed, for example,\
    \ `/bin/bash`.\n\nLinux supports the classic multiprogramming scheme. Linux supports\
    \ parallel (or quasi-parallel if there is only one processor) user processes.\
    \ Each process runs in its own virtual address space, i.e. processes are protected\
    \ from each other and the collapse of one process will not affect the other running\
    \ processes and the system as a whole. One process cannot read anything from the\
    \ memory (or write to it) of another process without the \"permission\" of another\
    \ process. Authorized interactions between processes are allowed by the system.\n\
    \nThe kernel provides system calls for creating new processes and for managing\
    \ generated processes. Any program can start executing only if another process\
    \ starts it or some interruption occurs (for example, an external device interrupt).\
    \ \n\nIn connection with the development of SMP (Symmetric Multiprocessor Architectures),\
    \ a mechanism of threads or control threads was introduced into the Linux kernel.\
    \ A thread is a process that runs in virtual memory, used together with other\
    \ threads of a process that has separate virtual memory.\n\nIf the shell encounters\
    \ a command corresponding to the executable file, the interpreter executes it,\
    \ starting from the entry point. For C programs, the entry point is a function\
    \ of `main`. A running program can also create a process, i.e. run some program\
    \ and its execution will also begin with the function `main`.\n\nTwo system calls\
    \ are used to create processes: `fork()` and `exec`. `fork()` creates a new address\
    \ space that is completely identical to the address space of the main process.\
    \ After executing this system call, we get two identical processes: the main and\
    \ the generated ones. The `fork()` function returns `0` in the spawned process,\
    \ and the `PID` (Process ID is the spawn of the spawned process) basically. `PID`\
    \ is an integer.\n\nNow that we have already created the process, we can start\
    \ the program by calling `exec`. The `exec` function parameters are the name of\
    \ the executable file and, if necessary, the parameters that will be passed to\
    \ this program. A new program will be loaded into the address space of the `fork()`\
    \ process and will start from the entry point (the address of the `main` function).\n\
    \nAs an example, consider this fragment of the program:\n```c\nif (fork () ==\
    \ 0) wait (0);\nelse execl (\"ls\", \"ls\", 0); / * spawned process * /\n```\n\
    \nNow let's take a closer look at what happens when you execute a `fork()` call:\n\
    1. Memory is allocated for the new process handle in the process table.\n2. Assign\
    \ process ID `PID`.\n3. A logical copy of the process is created that performs\
    \ `fork()` – full copying of the virtual memory contents of the parent process,\
    \ copying the components of the nuclear static and dynamic contexts of the ancestor\
    \ process.\n4. Increase the file opening counters (the child process inherits\
    \ all open files of the parent process).\n5. Returns the `PID` to the return point\
    \ from the system call in the parent process and 0 in the descendant process.\n\
    \n## General process control scheme\n\nEach process can spawn a completely identical\
    \ process using `fork()`. The parent process can wait until all its descendant\
    \ processes have completed executing using the `wait` system call.\n\nAt any time,\
    \ a process can change the contents of its memory image using one of the `exec`\
    \ calls types. Each process responds to signals and, of course, can set its own\
    \ response to signals produced by the operating system. The priority of the process\
    \ can be changed using the `nice` system call.\n\nA signal is a way of informing\
    \ the core process of the occurrence of an event. If several events of the same\
    \ type occur, only one signal will be sent to the process. A signal means that\
    \ an event has occurred, but the kernel does not report how many such events have\
    \ occurred.\n\nExamples of signals:\n1. termination of the child process (for\
    \ example, due to the `exit` system call (see below))\n2. the occurrence of an\
    \ exceptional situation\n3. signals from the user when you press certain keys!\n\
    \nYou can set the response to a signal by using the `signal` system call.\n`func\
    \ = signal (snum, function);`\n`snum` is the signal number, and `function` is\
    \ the address of the function to be executed when the specified signal arrives.\
    \ The return value is the address of the function that will respond to a signal.\
    \ Instead of `function`, you can specify zero or one. If a zero was specified,\
    \ then when the `snum` signal arrives, the process will be interrupted similarly\
    \ to the `exit` call. If you specify a unit, this signal will be ignored, but\
    \ it is possible for normal completion of the process call is used.\n`exit (status);`\n\
    where `status` is an integer returned by the ancestor process to inform it about\
    \ the reasons for the termination of the descendant process. The `exit` call can\
    \ be set at any point in the program, but it can also be implicit, for example,\
    \ when exiting the `main` function (when programming in C), the operator `return\
    \ 0` will be interpreted as the system call `exit (0)`.\n\n## input / output Redirection\n\
    \nVirtually all operating systems have an input/output redirection mechanism.\
    \ Linux is no exception to this rule. Usually, programs enter text data from the\
    \ console (terminal) and output data to the console. When you enter the console\
    \ means the keyboard, and then output, the terminal display. The keyboard and\
    \ display are standard input and output (`stdin` and `stdout`), respectively.\
    \ Any input/output can be interpreted as input from a file and output to a file.\
    \ Work with files is done through their descriptors. UNIX uses three files for\
    \ input/output: `stdin` (handle 1), `stdout` (2), and `stderr` (3).\n\nThe `>`\
    \ symbol is used to redirect standard output to a file.\nExample: `$ cat > newfile.txt`\n\
    The standard input of the `cat` command will be redirected to the file `newfile.txt`,\
    \ which will be created after the execution of this command. If a file with this\
    \ name already exists, it will be overwritten. Pressing Ctrl + D will stop the\
    \ redirect and abort the execution of the `cat` command.\n\nThe `<` symbol is\
    \ used to reassign standard command input. For example, if you run the `cat <file.txt`\
    \ command, the `file.txt` file will be used as standard input, not the keyboard.\n\
    \nThe `>>` symbol is used to append data to the end of the file (append) of the\
    \ standard command output. For example, unlike the case with the symbol `>`, the\
    \ execution of the command `cat >> newfile.txt` will not overwrite the file if\
    \ it exists but will add data to its end.\n\nSymbol `|` is used to redirect the\
    \ standard output of one program to the standard input of another. For example,\
    \ `ps -ax | grep httpd`.\n\n## Process Management Commands\n\n### ps command\n\
    Designed to display information about running processes. This command has many\
    \ parameters that you can read about in the manual (`man ps`). Here I will describe\
    \ only the most frequently used commands:\n- `a` display all processes associated\
    \ with the terminal (all user processes are displayed)\n- `e` show all processes\n\
    - `t` terminal list, display terminal-related processes\n- `u` user identifiers,\
    \ display the processes associated with these identifiers\n- `g` group IDs, display\
    \ the processes associated with these group IDs.\n- `x` display all non-terminal\
    \ processes\n\n### Program “top”\nDesigned to display information about processes\
    \ in real time. Processes are sorted by maximum CPU time, but you can change the\
    \ sort order (see `man top`).\n\nYou can view information about RAM with the help\
    \ of the `free` command, and about the disk memory - `df`. Information about users\
    \ registered in the system is available using the `w` command.\n"
