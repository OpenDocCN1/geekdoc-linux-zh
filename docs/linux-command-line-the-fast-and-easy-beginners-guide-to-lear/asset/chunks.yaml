    center. If you want to build your media server, choose this distributor. Strictly
    speaking, it is not a distribution kit, but a full-featured media player. You
    can install it in any Linux, but it is best to choose a bunch of Ubuntu + Kodi.This
    distributor supports all types of video and audio files. It knows how to play
    movies, music, organize your photos. It will turn any connected TV into a universal
    entertainment device.Thanks to the extensions, it can download media files through
    torrents, track the appearance of new seasons of your favorite TV shows, show
    videos from YouTube and other streaming services. In short, Kodi can do everything.In
    addition, Kodi is very beautiful and optimized for control from a remote control
    or device on Android. You can easily customize the Kodi interface using a variety
    of visual skins. It is very convenient to manage and has many functions.But the
    standard interface of this may not appeal to everyone, but it is easy to replace.There
    are also interesting versions: Linux distribution for desktop PC, this is Kubuntu;A
    Linux distribution for an old personal computer, this is Lubuntu; The Linux version
    for the tablet or transformer is Ubuntu; The Linux version for the laptop is elementary
    OS and others.Chapter 2\. Linux installation Before proceeding with the installation,
    it will be a good idea to check your PC’s hardware first. You may check the hardware
    vendor’s site to check the compatibility list.DVD Drive: To install Linux, you
    must have a DVD drive, and your computer must be able to boot from the drive.
    If your hard drive controller is IDE/ATA or USB DVD, this will work in Linux.Hard
    Drives: This is not necessary if you will be using the Live CD. If you will be
    installing Linux, it is ideal to have at least 4GB of disk space. Linux supports
    IDE and SCSI hard drive controllers.Keyboard: All keyboards work with Linux.Monitor:
    Most distribution installers can detect modern monitors. If you find that it does
    not display well, choose a monitor type and a specific resolution (1024x768).Mouse:
    PS/2 or USB mouse works with Linux.Network Card: Installers can detect most network
    cards. If you find that you are having problems with one, find additional information
    online.Processor: Minimum processor speed required is 700 MHz New processor speeds
    nowadays are way more than this value.              In terms of speed, the higher
    the number, the better.RAM: The bigger RAM, the better. The minimum required is
    512MB. Check the corresponding RAM for your specific distro – others might require
    a bigger RAM allocation.Sound Card, Video Card, Printer: Make sure that these
    are compatible with Linux. Refer to the hardware vendor’s site for more information.Next,
    make space for Linux.If you opt to install Linux without removing your current
    OS, note that your existing operating system uses the whole hard drive. This means
    that Linux and your current OS needs to share the hard drive so that the two operating
    systems can co-exist. You will need to partition and divide the hard drive. If
    you choose to take this route, make sure to take a backup of your system because
    there is a risk of wiping out the data on the drive. To facilitate partitioning,
    you can get hard drive partitioning products that run on Windows, or you can use
    a GUI called QTParted that comes with most Linux distributions. Some distributions
    (like openSUSE or Xandros Desktop) can reduce Windows partition and automatically
    create partitions for Linux. In case your distribution of choice offers this feature,
    you will no longer need a partitioning tool.Installation StepsGo to the Linux
    distribution site and download the distro file. The file that you downloaded will
    come with the installation steps. In this section, let’s talk about the general
    installation steps for any Linux distribution.Step 1: Prepare your CD/DVD installer
    or Live CD. Download a copy of the distribution you plan to install and burn it
    onto a CD/DVD.Step 2: Ensure that your PC can boot from CD/DVD drive. If your
    PC still boots from the hard drive when you have a CD/DVD in the drive, change
    your Boot Devices first. Go into BIOS and change the order of boot devices – choose
    CD/DVD drive as the first boot option. You can do this by rebooting your PC and
    pressing a key (F2 or Del on most computers) to go into the Setup menu. Verify
    the key for your computer brand and model. Once you assign CD/DVD drive as the
    first boot option, put the disk in the drive and reboot your computer. Step 3:
    If you are using a Live CD, reboot your computer. The computer will then boot
    up and load the OS from your Live CD.Once the installation is done, reboot your
    computer.   X is not working after installationIf you happen to see the GUI during
    the installation, but after the first reboot you are confronted with a grey screen
    or a black screen with an X in the middle, here are some steps that you can use
    to troubleshoot.       Reboot the PC. Press Ctrl+Alt+Delete. Once the PC is booting
    up, press the A key if the distribution uses GRUB (GR and Unified Bootloader).
    For LILO, skip this step. The GRUB boot loader will then display a command line
    for the Linux kernel and will ask you to add what you want.For GRUB, type a space
    and then word single. Press Enter. If using LILO, type Linux single then press
    Enter. The Linux kernel will boot in a single-user mode with the following prompt:sh-3.00#Once
    you see this prompt, you can now start to configure X. Depending on the distribution
    you are using, X uses a configuration file to setup your display card, monitor,
    and resolution. The problem sometimes happens when the X configuration from the
    Linux installer is not right. Solve this problem by creating a working configuration
    file:Type the following command: ![Description: 00006.jpeg](rsrc1TN.jpg)Once you
    enter this command, the X server will create a configuration file. You’ll see
    the screen go blank and then display several messages .Use vi, a text editor and
    edit the file///etc./xorg.conf.new. Insert the linebelow afterSection "Files":line![Description:
    00007.jpeg](rsrc1TP.jpg)Start the X font server by typing the command below:![Description:
    00008.jpeg](rsrc1TR.jpg)Type the line below to start the new configuration file.![Description:
    00009.jpeg](rsrc1TS.jpg)Once you see the blank screen with an X cursor, the configuration
    file is working fine.Use Ctrl+Alt+Backspace to stop the X serverType the command
    below to copy the config file to the /etc/X11 directory:![Description: 00010.jpeg](rsrc1TT.jpg)Type
    the wordreboot or press Ctrl+Alt+Delete to reboot the computer.  The login screen
    should come up if the config file change went well.Most, if not all, Linux distributions
    have a solid community online. If you encounter problems during the installation,
    search for the problem, describe it in detail, or use the actual error message
    as your search keyword. You will find the information that you need and if not,
    you can always post in the forums and the community will be ready to help.Visit
    the following forums for more information:Ubuntu: [http://ubuntuforums.org/](http://ubuntuforums.org/)Linux
    Mint: [http://linuxmint.com/forum/](http://linuxmint.com/forum/)SUSE: [https://forums.suse.com/forum.php](https://forums.suse.com/forum.php)Debian:
    [http://www.debianhelp.org/](http://www.debianhelp.org/)Post-Installation Activities 
     Managing Hardware and PeripheralsCPUThe operating system keeps programs and hardware
    working together smoothly. The capabilities of Linux are affected by the limitations
    of your system’s hardware (for example, disk space and memory) so it is important
    to know more details about your computer’s hardware. Let’s start with the CPU.
    The CPU performs all the computing and its speed (in MHz) signifies how fast your
    computer can handle transactions. Your CPU specs will also tell you about the
    CPU family (most common are x86 and x86-64) and the number of cores that it has.
    To know more about your CPU, use the Linux commands below:Hard DiskNext, let’s
    discuss your computer’s hard disk. In the installation chapter, I spoke about
    the importance of making sure that your computer has enough disk space for Linux
    and the possible need for partitioning your hard disk if you want to run two operating
    systems at the same time.If you plan on adding a new disk in the future, learning
    how to partition will come in handy. Linux supports the following partitioning
    tools:Fdisk Tools – This is composed of the text-based tools: fdisk , cfdisk,
    and sfdisk . These tools are great for use in partitioning. However, it could
    be a bit overwhelming for beginners who are not yet familiar with partitioning.
     libparted Tools – The libparted library presents both GUI and text-based partitioning
    tools. One particular example is GParted as shown in the screenshot below. The
    interface makes it easier to use for beginners.GPT fdisk Tools – These are tools
    created for GPT (Globally Unique Identifier Partition Table) disks using the fdisk
    tools.Here are some commands that you can use to check the existing disk space
    on your computer:Removable StorageUsing storage such as USB flash drives and external
    hard disks in Linux works similarly when using Windows or Mac OS. Plug the device
    in and Linux will detect the device. Aside from accessing the drive via the desktop
    GUI, you can also navigate to the /media directory and find the mounted subdirectory. After
    you use the removable media, unmount the disk before removing it to avoid any
    disk issues. You can generally right-click on the Device Name and click on any
    of the options such as Unmount , Eject Volume , or Safely Remove .USB DevicesYou
    can connect other devices such as human-interface devices (keyboard, mouse), cameras,
    mobile phones, scanners and printers to your Linux computer and expect that these
    work in a plug-and-play manner. For printers, you will also need to set up the
    printer configuration after Linux detects the device. Follow the steps below to
    set-up a new printer. Note that the screenshots are taken from an Ubuntu distribution,
    but this is similar to the majority of the distros.Click on System Settings, then
    Printers in the desktop. Provide the root password.Click on the Add button. If
    the system detects your printer, the device will show in the list. Otherwise,
    you will need to continue with the configuration and provide the printer drivers.
    Click Forward .Choose the correct driver. A list of available drivers will be
    shown – choose the one that is applicable for your printer make. If you do not
    find the driver on the list, you can also provide the printer driver or download
    the file online.Fill-up the printer name and description.Lastly, print a test
    page to make sure it’s working.Installing Additional SoftwareLinux-compatible
    softwares come in .rpm for RPM (Fedore, SUSE) or .deb for Debian (Debian, Ubuntu,
    Xandros) packages. Even if the type of packages varies, both RPM and Debian packages
    can be installed in any type of Linux distribution. Popularly used distributions
    provide a GUI for installing additional applications. In this section, I will
    discuss the ways of installing software in Ubuntu and Fedora.Installing Applications
    in UbuntuDebian-based distros use APT or the Advanced Packaging Tool. You can
    use the command below to install packages to your computer.![Description: 00035.jpeg](rsrc1TU.jpg)This
    command will download the specific package name that you want to install. In case
    you do not know the package name, you can search for a keyword.![Description:
    00036.jpeg](rsrc1TV.jpg)For example, I am looking for an application that I can
    use to take screenshots on (in ) my GNOME desktop. I can further refine my search
    functionality with the following command:![Description: 00037.jpeg](rsrc1TW.jpg)The
    command will display the applicable lines that fit the search string:![Description:
    00038.jpeg](rsrc1TX.jpg)Shutter is the package name. Use the package name and
    run theapt-get install command again.Aside from installing packages via the command
    line, you can also use the Software & Updates Tool. The GUI provides a simple
    and easy way to update your Ubuntu software and download packages.Similar to Windows
    and Mac OS application stores, Ubuntu also has its Software Center where you can
    get new software and download the latest updates.Installing Applications in FedoraFedora
    uses RPM packages. If you are using a GNOME desktop, you can simply use the Add
    or Remove Software tool (similar to Windows) to install new software.Click on
    System➪ Administration then on Add/Remove Software to access the menu. The utility
    will then display the Package Manager box showing the list of all packages. Select
    the corresponding check box and click on Apply or Update (if you are updating
    the packages). Clicking on the Apply button will install (or uninstall) the specific
    packages.Chapter 3\. Linux applicationAll Linux distros come with a robust selection
    of applications that you can use for almost all of your daily computing needs.
    Almost all of these applications are easily accessible using your distro’s GUI
    desktop.In this chapter, you will get to know some of the most common Linux applications
    and learn how to access them whenever you want to. You will also get to know some
    of the file managers used by different GUIs, which will allow you to make changes
    or browse files in your computer.Where to Get Apps?Almost all applications used
    by Linux have dedicated websites in which you can find detailed information about
    them, including details on where and how to download them. At the same time, all
    distros come with different sets of utilities and apps that you can choose to
    install as you setup your chosen distro.If you have a missing app in a Debian
    or Debian-based distro, such as Ubuntu, you can easily get that application as
    long as you have a high-speed internet connection. For example, if you want to
    find out if there is a K3b CD/DVD burner available for a Debian OS, simply key
    in the command apt-cache search k3b. Doing so will return a result that looks
    like this:![Description: 00064.jpeg](rsrc1TY.jpg)If yu want to get this app, all
    you need to do is to key in apt-get install k3b. Office Tools and ApplicationsAverage
    user or not, you will definitely need a calculator, presentation applications,
    word processor, calendars, and other staple office applications. There is an abundance
    of these apps available for each distro, which means that you can try them out
    to see which ones will suit your needs better. While these Linux apps may seem
    to be a little different than the apps that you are used to, you will find that
    you will get used to their interfaces after some sessions.Here are some of the
    most commonly used office applications that are available to Linux users:'
