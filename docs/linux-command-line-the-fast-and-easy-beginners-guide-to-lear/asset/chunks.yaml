    # 如何从 CD 播放音频


    所有 Linux 发行版都带有默认的 CD 播放器应用程序。如果你想从 CD 播放音乐，你只需要一个配置了 Linux 的声卡即可。在某些发行版中，会弹出一个对话框，询问你是否要播放插入驱动器的
    CD。如果你没有看到这个对话框，可以通过选择 `Applications->Sound and Video`（应用程序->音频视频）找到你的 CD 播放器。


    如果你正在使用 `KDE` CD 播放器，你将看到 CD 的名称和正在播放的曲目。该播放器从 `freedb.org` 获取专辑信息，这是一个基于互联网的
    CD 开源数据库。要下载专辑信息，你需要连接到。然而，一旦你能够下载这些信息，你的计算机就会缓存这些数据，供以后会话使用。


    # 如何播放音频文件


    如果你想播放任何音频文件（例如 `.mp3s`），你可以使用 `XMMS` 或 `Rhythmbox`。`Rhythmbox` 是拥有大量 `.mp3` 收藏的用户首选播放器之一，因为它在组织文件时非常有用。你可以从主菜单中找到并调出
    `Rhythmbox`。


    当你第一次使用 `Rhythmbox` 时，应用程序助手会提示你识别音乐文件存储在何处。这样做允许应用程序管理你的音乐库。之后，`Rhythmbox` 将以有序的方式显示你的歌曲。


    `XMMS` 是你可能有的另一个选项，特别是当你拥有包含多种文件类型的音乐库时，例如 `FLAC`、`.wav` 或 `Ogg Vorbis`。要运行此程序，只需从主菜单选择应用程序图标即可。启动
    `XMMS` 后，你可以通过 `Window-> Play File`（窗口->播放文件）或按下 `L` 来选择文件。在 `Load File`（加载文件）对话框中，选择你想加载的一个或多个文件。点击
    `Play`（播放）按钮后，应用程序将播放所选的文件。


    # 如何在 Linux 中刻录光盘


    大多数大多数 Linux 文件管理器都能够刻录 DVD 或 CD 光盘。例如，`Nautilus` 和 `Xandros` 文件管理器内置了刻录功能。同时，不同的
    Linux 发行版还提供了让你方便地将文件刻录到 DVD 或 CD 的应用程序。例如，`K3b` 允许你在 `SUSE` 和 `Knoppix` 等发行版中刻录光盘。


    像 `K3b` 这样的应用程序非常易使用——你只需要收集所有想要刻录光盘的文件，然后使用该程序开始刻录过程。但请注意，这些应用程序可能需要命令行程序（如 `cdrdao`
    和 `cdrecord`）来刻录 CD。`K3b` 还需要 `growisofs` 程序才能刻录 DVD。


    # 图形和成像应用


    Linux 提供了不同的成像和图形处理应用程序。以下是两个最流行的应用程序：


    ## GIMP


    `The GIMP` 是一个根据 `GNU GPL`（通用公共许可）发布的程序。大多数 Linux 发行版都带有此程序，但你可能也需要选择一个包来安装此程序。`The
    GIMP` 经常与最流行的图像处理应用程序相比，例如 `Adobe Photoshop` 和 `PhotoPaint`。


    要启动 `The GIMP`，调出主菜单然后选择 Graphics（图形）类别下的应用程序。一旦启动程序，你将看到一个显示许可和版权信息的窗口。点击 `Continue`（继续）按钮继续安装。


    **提示**：如果你找不到 `The GIMP`，可以通过进入 `Add/Remove Software`（添加/删除软件，位于 `System Settings`
    系统设置）添加程序，并在那里安装应用程序。


    安装 `The GIMP` 将会在家目录下创建一个子目录，其中将存储你对应用程序设置所需的数据。点击 `Continue` 按钮让程序继续创建这些目录，然后按照向导提供的详细说明完成安装。安装后，`The
    GIMP` 将加载旨在增强应用程序功能的插件或模块。一旦加载所有插件，你就可以浏览 `Tip` 窗口显示的提示。


    ## GNOME Ghostview


    此应用程序最适合查看 PDF (`.pdf`) 和 PostScript (`.ps`) 文档或打印这些文档文件。`Ghostview` 允许你查看和打印长文档中的选定页面，还可以放大或缩小文档区域。你可以通过进入
    Fedora 中的 `Graphics->Post Script Viewer`（图形->Post 脚本查看器）找到此应用程序。


    # 第 4 章 成为 Linux 高级用户


    在 Linux 中，命令行提示符提供了一种非常强大的用户管理方法。你可以使用命令行创建和删除用户。这些用户还可以分配某些权限，规定他们对系统及其文件可以做什么或不能做什么。这显示了终端是一个强大的工具。这些用户还可以被分到一个组中。从组中添加和删除这些用户也是可能的。这就是我们在本章将探索的内容。


    ## ''Group'' 命令


    在 Linux 中，组定义在 `/etc/group` 文件中。该文件包含组名、其 ID 以及属于每个特定组的用户列表。要检查系统中的可用组，请运行以下命令：


    ```bash

    groups

    ```


    从上面的图中可以清楚地看到，我的系统有 8 个组。如果你需要创建一个新组并命名为 `group1`，请运行以下命令：


    ```bash

    groupadd group1

    ```


    值得注意的是，大多数 Linux 发行版会为用户创建一个组，并将其命名为他们使用的账户名称。一旦你使用上述命令创建了组，验证它是否确实被创建是非常重要的。这可以通过查看
    `/etc/group` 文件的内容来实现。如果你找不到你创建的组名，那么在添加过程中可能出了出了问题。你可以在命令行窗口中查看该文件的内容，也可以如下所示使用
    `vim` 编辑器打开它：


    ```bash

    cat /etc/group

    # 或

    vi /etc/group

    ```


    但是，如果你使用第二种方法（即在 `vim` 编辑器中查看），请确保不要更改其内容，因为这可能会导致错误。要为你的组添加组 ID，请如下所示使用 `-g`
    选项：


    ```bash

    groupadd -g 1300 group1id

    ```


    要创建一个系统组，请如下所示使用 `-r` 选项：


    ```bash

    groupadd -r systemgroup

    ```


    我们现在可以使用 `useradd` 命令，它可以用于为系统添加新用户，也可用于更新任何可用用户的信息。让我们创建一个名为 `user1` 的新用户：


    ```bash

    useradd -c "User" -d "/home/user1" -s "/bin/bash" -user1

    ```


    在上面的命令中，我们使用了许多参数。让我们定义它们的用途：


    1. `-c` - 这将用于指定用户名称。它是显示在登录窗口上的名称。在我们的案例中是“User”。

    2. `-d` - 表示用户家目录的路径。如果你不指定此项，它将默认创建。在我们上面的命令中，`/home/user1` 将是我们用户的家目录。

    3. `-s` - 这将为我们创建的用户建立默认登录 shell。在我们的案例中，`user1` 的默认 shell 将是 `bash` shell。


    其他与 `useradd` 命令一起使用的选项包括：


    4. `-b` - 指定系统的基本目录。这对于大多数 Linux 发行版是 `/home`，用于家目录目的。如果我们在创建新用户时没有指定上面的 `-d`
    选项，则它将成为新用户的默认家目录。

    5. `-g` - 这指定主组的名称或 ID。如果你在创建新用户时不指定此选项，则会创建一个与登录名相似的新组，并分配一个组 ID。


    示例：

    ```bash

    useradd -g 200 user1

    ```


    '
- fmt: "\n### 6. -G\n`-G` this specifies other supplementary groups which the user\
    \ is also a member of. A comma is used to separate the group names.\n\nExample:\n\
    ```bash\nuseradd –g 200 –G sudo, adm user1\n```\nNote that in the above command,\
    \ we have specified only two groups. Others can also be added and a comma is used\
    \ to separate them as well.\n\n### User Password Management\nNow that we have\
    \ created a new user and assigned them a group, it is important to assign them\
    \ a password. This will ensure security and that no other user will login to the\
    \ system and act as them. To assign a password for the user we have created above,\
    \ that is, `user1`, run the following command:\n```bash\npasswd user1\n```\nOnce\
    \ you run this command, you will be prompted the password and also to retype the\
    \ same password. The user `user1` will then use that password to login to the\
    \ system. The `passwd` command is also associated with other options which include\
    \ the following:\n\n1. `-d` this deletes the password associated with the specified\
    \ user, meaning that this user will not be able to login to the system anymore.\n\
    \   Example:\n   ```bash\n   passwd –d user1\n   ```\n2. `-S` this shows all the\
    \ information in the `/etc/shadow` file so as to show the user’s status.\n   Example:\n\
    \   ```bash\n   passwd –S user1\n   ```\n3. `-l` this locks the password for a\
    \ particular user’s account. The user will then be able to login to the system\
    \ without authentication. Other means of authentication such as SSH (secure shell)\
    \ will then be used for authentication purposes.\n4. `-a` used to show the status\
    \ of all the users of the system. It can only be combined with the `-S` option.\n\
    \   Example:\n   ```bash\n   passwd –S –a\n   ```\n\n### User Modification\nSometimes,\
    \ you might need to modify some of the settings for a certain user. This is easy\
    \ to do via the command line as explained below.\n```bash\nuseradd -c \"User\"\
    \ -d \"/home/user1\" -s \"/bin/bash\" –user1\n```\nTo change both the login and\
    \ the name of the above user as well as the ID, or to add him to the group admin\
    \ use the following command:\n```bash\nusermod -l user -c \"The User\" -u 4000\
    \ -G adm -a user1\n```\nThe `-l` option has the purpose of creating a new login\
    \ name for the user.\n\n### Group Deletion\nTo delete a group, use the `groupdel`\
    \ command as shown below:\n```bash\ngroupdel group1\n```\nThe group will be deleted,\
    \ however, this will only happen if the group is a supplementary group for the\
    \ users. If it is the primary group, then we need to start by first deleting the\
    \ users before deleting the group.\n\n### User Deletion\nTo delete a certain user,\
    \ just run the following command:\n```bash\nuserdel user1\n```\nThe above command\
    \ will delete the user `user1` from the system. However, if he is logged into\
    \ the system at this time, you will be warned before deleting. The files and the\
    \ home directory for this user will not be deleted. The `userdel` command is also\
    \ associated with the following options:\n\n1. `-r` all the directories and files\
    \ in the home directory of the user will also be removed.\n   Example:\n   ```bash\n\
    \   userdel –r user1\n   ```\n2. `-f` this option will force the account of the\
    \ user to be deleted regardless of whether or not they are logged into the system.\
    \ The home directory of this user will also be removed regardless of whether other\
    \ users are using this directory or not.\n"
