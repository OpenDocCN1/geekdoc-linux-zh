  ![Description: 00085.jpeg](img/rsrc1UT.jpg)\n![Description: 00086.jpeg](img/rsrc1UU.jpg)\n\
  \n### iotop, iftop, hot\n理解程序的执行对于成为一个优秀的系统管理员至关重要。在本章中，我们将更详细地查看进程，以及如何处理和操作进程。程序正在运行的实例被称为进程。它由程序指令、从文件中读取的数据以及其他程序或系统输入组成。每个进程都被分配一个进程\
  \ ID (PID)，以便系统跟踪所有进程。系统启动进程具有 PID 0，然后初始进程具有 PID 1，以此类推顺序进行。初始进程 PID 1 指的是旧版 Linux\
  \ 系统上的 `/sbin/initd` 或现代 Linux 系统上的 `/sbin/systemd`。\n\n### 处理进程\n\n### ps 和 pstree\n\
  为了列出所有运行的进程，请使用 `ps` 命令或 `pstree` 命令。\n\n![Description: 00103.jpeg](img/rsrc1V7.jpg)\n\
  `ps` 的输出如上所示包含四列，其含义如下：\n\n\n\n\n\n* `PID` - 进程 ID。\n* `TTY` - 调用命令的终端。\n* `TIME`\
  \ - 进程运行的时间。\n* `CMD` - 被调用的命令。\n\n可以使用以下开关获取有关进程的额外信息：\n\n* `-e` 和 `ax`: 显示所有进程。\n\
  * `-p`: 仅显示指定进程 ID 的信息。\n\n```\n$ ps -p 26426\nPID TTY STAT TIME COMMAND\n26426\
  \ pts/9 Ss 0:00 bash\n```\n\n* `-C`: 显示引用指定命令名的进程。\n* `-u`: 显示属于指定用户名的进程。\n\n`pstree`\
  \ 命令与 `ps` 命令类似，但它以层级树的形式显示进程。一个实用的开关是 `-p`，它可以将进程 ID 添加进程名称中![Description: 00104.jpeg](img/rsrc1V8.jpg)\n\
  \n### pidof\n`pidof` 命令用于显示指定进程的 ID。下面的图片返回了运行“bash”的进程的 PID![Description: 00105.jpeg](img/rsrc1V9.jpg)\n\
  \n### pgrep\n此命令在进程列表中搜索指定的进程名。下面的图片显示了匹配字符串“xfce”的进程![Description: 00106.jpeg](img/rsrc1VA.jpg)\n\
  \n### top\n`top` 命令根据活动情况显示进程。最活跃的进程位于最上方，随后是活跃程度较低的进程。列表每秒更新一次。单列包含进程 ID（标题为 `PID`）、进程所有者的用户名（标题为\
  \ `USER`）、进程优先级（标题为 `PR`）、nice 值（标题为 `NI`）、虚拟内存占用（标题为 `VIRT`）、保留内存（标题为 `RES`）、共享内存（标题为\
  \ `SHR`）、CPU 和内存百分比（标题为 `%CPU` 和 `%MEM`）、进程运行时间（标题为 `TIME+`）以及用于调用进程的命令（标题为 `COMMAND`）。![Description:\
  \ 00107.jpeg](img/rsrc1VB.jpg)\n\n### htop\n“htop”是一个额外的软件包，包含更具交互性的 `top` 版本。列的布局与\
  \ `top` 类似![Description: 00108.jpeg](img/rsrc1VC.jpg)\n\n### 前台和后台进程\n进程有两种类型：前台进程和后台进程。前台进程通过终端会话初始化并控制。换句话说，必须用户连接到系统才能启动这些进程，且进程在执行期间会占用终端。相比之下，后台进程未连接终端，不需要显式地任何用户输入。因此，它们在等待完成时不占用终端，允许你运行多个进程。可以使用\
  \ `&` 符号在后台初始化进程。\n\n```\n$ process1 &...\n```\n\n要将正在运行的进程发送到后台，请使用命令 `bg` 后接作业\
  \ ID，而 `fg` 将进程发送到前台。你可以使用 `jobs` 命令显示当前正在运行的作业及其相关的作业 ID：\n\n```\n$ process1 &$\
  \ process2 &$ jobs\n[1]+ Running process1\n[2]- Running process2\n```\n\n### 停止和终止进程\n\
  如果运行中的程序变得无响应并导致负载过高，我们可以做什么来停止并移除它？幸运的是，我们有几个选项可以向程序发送特定信号来停止它。在此情况下使用的命令是 `kill`\
  \ 命令以及相应的开关。\n\n为了终止并杀死名为“hangingProgram”的程序，你必须先识别该程序。你可以通过使用 `pgrep` 找到关联进程，如下：\n\
  \n```\n$ pgrep hangingProgram\n3167\n```\n\n接下来，向识别出的进程发送 `SIGTERM` 信号：\n\n```\n\
  $ kill -SIGTERM 3167\n```\n\n作为替代方案，你可以如下调用 `kill`：\n\n```\n$ kill -15 3167\n```\n\
  \n或者你可以通过按下 `CTRL+Z` 停止挂起的进程，然后使用此命令删除进程：\n\n```\n$ kill -SIGKILL 3167\n```\n\n\
  如所示，该命令的效果相同：\n\n```\n$ kill -9 3167\n```\n\n### 调整进程的执行优先级\n你可以使用 `ps` 如下显示进程的\
  \ nice 值：\n\n```\n$ ps -o pid,comm,nice -p 1808\nPID COMMAND NI\n1808 bash 0\n```\n\
  \n第一列包含进程 ID (`PID`)，第二列包含命令，第三列包含 nice 值 (`NI`)。如上面的示例所示，PID 为 `1808` 的“bash”进程的\
  \ nice 值为 `0`。可以使用 `renice` 命令调整现有进程的 nice 值。要将上述进程的 nice 值降低到 10，请执行以下命令。请记住，只有\
  \ root 用户可以对进程应用负的 nice 值。\n\n```\n$ renice 10 -p 1808\n```\n\n\n\n\n\n## 理解进程\n\
  \nLinux 中的进程（与 UNIX 相同）是一个在独立的虚拟地址空间中运行的程序。当用户登录系统时，会自动创建一个进程，并在其中执行 shell，例如 `/bin/bash`。\n\
  \nLinux 支持经典的多程序设计方案。Linux 支持并行（如果只有一个处理器，则为准并行）用户进程。每个进程都运行在自己的虚拟地址空间内，也就是说，进程进程之间是相互保护的，一个进程的崩溃不会影响其他正在运行的进程以及整个系统。在没有获得另一个进程“权限”的情况下，一个进程无法从另一个进程的内存中读取任何内容（或向其写入）。系统允许进程之间进行授权的交互。\n\
  \n内核提供了系统调用，用于创建新进程和管理已生成的进程。只有当另一个进程启动它或发生某些中断（例如，外部设备中断）时，任何程序才能开始执行。\n\n随着 SMP（对称多处理器架构）的发展，Linux\
  \ 内核中引入了线程或控制线程的机制。线程是运行在虚拟内存中的进程，它与具有独立虚拟内存的进程的其他线程一起使用。\n\n当 shell 遇到与可执行文件对应的命令时，解释器会从入口点开始执行它。对于\
  \ C 程序，入口点是 `main` 函数。运行中的程序也可以创建一个进程，即运行某个程序，其执行也将从 `main` 函数开始。\n\n使用两个系统调用来创建进程：`fork()`\
  \ 和 `exec`。`fork()` 创建一个与主进程地址空间完全相同的新地址空间。执行此系统调用后，我们得到了两个相同的进程：主进程和生成的进程。`fork()`\
  \ 函数在子进程中返回 `0`，而在主进程中基本上返回 `PID`（进程 ID，是派生进程的标识）。`PID` 是一个整数。\n\n现在我们已经创建了进程，可以通过调用\
  \ `exec` 来启动程序。`exec` 函数的参数是可执行文件的文件名，如果有必要，还有传递给该程序的参数。新程序将被加载到 `fork()` 进程的地址空间中，并从入口点（`main`\
  \ 函数的地址）开始运行。\n\n例如，考虑程序的这段片段：\n```c\nif (fork () == 0) wait (0);\nelse execl (\"\
  ls\", \"ls\", 0); / * 生进程 * /\n```\n\n现在让我们仔细观察执行 `fork()` 调用时发生了什么：\n1. 在进程表中为新进程句柄分配内存。\n\
  2. 分配进程 ID `PID`。\n3. 创建一个执行 `fork()` 的进程逻辑拷贝——完全复制父进程的虚拟内存内容，复制祖先进程内核静态和动态上下文的组件。\n\
  4. 增加文件打开计数器（子进程继承父进程的所有打开文件）。\n5. 在父进程中向系统调用的返回点返回 `PID`，在后代进程中返回 `0`。\n\n### 通用进程控制方案\n\
  \n每个进程可以使用 `fork()` 创建一个完全相同的进程。父进程可以使用 `wait` 系统调用等待直到其所有子进程都完成执行。\n\n在任何时候，进程都可以使用\
  \ `exec` 用的类型之一更改其内存镜像的内容。每个进程都会对信号做出响应，而且当然，可以为操作系统产生的信号设置自己的响应。可以使用 `nice` 系统调用更改进程的优先级。\n\
  \n信号是通知内核进程事件发生的一种方式。如果由于发了多个同类型的事件，则只会向进程发送一个信号。信号意味着事件已经发生，但内核不会报告发生了多少次此类事件。\n\
  \n信号示例：\n1. 子进程终止（例如，由于 `exit` 系统调用（见下文））\n2. 异常情况的发生\n3. 当你按下某些键时来自用户的信号！\n\n你可以通过\
  \ `signal` 系统调用设置对信号的响应。\n`func = signal (snum, function);`\n`snum` 是信号号，`function`\
  \ 是指定信号到达时要执行的函数地址。返回值将响应信号的函数地址。你可以指定 0 或 1 来代替 `function`。如果指定了 0，那么当 `snum` 信号到达时，进程将像\
  \ `exit` 调用一样被中断。如果你指定了 1，则该信号将被忽略，但它可能用于进程调用的正常完成。\n`exit (status);`\n其中 `status`\
  \ 是祖先进程返回的整数，用于告知其后代进程终止的原因。`exit` 调用可以在程序的任何点设置，但也可以是隐式的，例如，在退出 `main` 函数时（使用 C\
  \ 语言编程时），操作符 `return 0` 将被解释为系统调用 `exit (0)`。\n\n### 输入输出重定向\n\n几乎所有的操作系统都有输入输出重定向机制。Linux\
  \ 也不例外。通常，程序从控制台（终端）输入数据并输出数据到控制台。终端意味着键盘。文件操作通过文件描述符进行。Unix 使用三个文件进行输入输出：`stdin`\
  \ (1)、`stdout` (2) 和 `stderr` (3)。\n\n`>` 符号用于将标准输出重定向到文件。\n示例：`$ cat > newfile.txt`\n\
  `cat` 命令的标准输入将被重定向到文件 `newfile.txt`，该将在命令执行后创建。如果存在同名文件，将被覆盖。按下 Ctrl + D 将停止重定向。\n\
  \n`<` 符号用于重新分配标准命令输入。例如，如果你运行 `cat <file.txt` 命令，将使用 `file.txt` 文件作为标准输入，而不是键盘。\n\
  \n`>>` 符号用于将标准输出追加到文件结尾。例如，与符号 `>` 情况不同，执行命令 `cat >> newfile.txt` 如果文件存在则不会覆盖，而是将数据添加到末尾。\n\
  \n符号 `|` 用于将一个程序的标准输出重定向到另一个程序的标准输入。例如，`ps -ax | grep httpd`。\n\n### 进程管理命令\n\n\
  ### ps 命令\n旨在显示运行进程的信息。该命令有许多参数，你可以在手册中查看（`man ps`）。这里我只描述常用的命令：\n- `a` 显示所有与终端相关的进程（所有用户进程）\n\
  - `e` 显示所有进程\n- `t` 终端列表，显示与终端相关的进程\n- `u` 用户标识，显示与这些标识相关的进程\n- `g` 组 ID，显示与这些组\
  \ ID 相关的进程\n- `x` 显示所有非终端进程\n\n### top 程序\n旨在实时显示进程信息。进程按最大 CPU 时间排序，但你可以更改排序顺序（参见\
  \ `man top`）。\n\n你可以使用 `free` 命令查看 RAM 信息，使用 `df` 查看磁盘内存信息。关于系统中注册用户的信息可以通过 `w`\
  \ 命令获取。\n\n\n\n\n\n## 更改进程优先级\n`nice [-reduction factor] command [argument]`\n`nice`\
  \ 命令以较低的优先级执行指定的命令，减少因子的范围在 `1..19` 之间（默认等同于 `10`）。超级用户可以增加命令的优先级。为此，你需要指定一个负数因子，例如\
  \ `-10`。如果你指定的系数大于 `19`，它将会被视为 `19`。\n\n### nohup\n`nohup - ignore interrupt signals`（忽略中断信号）\n\
  `nohup command [argument]`\n`nohup` 在忽略模式下运行命令。只有 `SIGHUP` 和 `SIGQUIT` 信号不会被忽略。\n\
  \n### kill\n`kill - forced completion of the process`\n`kill [signal number] PID`\n\
  其中 `PID` 是进程标识符，可以通过 `ps` 命令找到。\n\n### 在后台运行进程的命令 - jobs, `fg`, `bg`\n`jobs` 命令列出在后台运行的进程，`fg`\
  \ -将进程置于普通模式（“移动到前台”），`bg` - 移动到后台。你可以使用 `<command> &` 在后台运行程序。\n\n## 第 8 章 技巧与窍门\n\
  我确信你已经渴望学习更多命令，并开始对系统进行一些实际操作。在开始之前，我们需要先涵盖一些理论。当你开始玩转系统时，你将能够理解它为什么那样运行，并且能够进一步学习这些命令。\n\
  \n### 创建目录\nLinux 文件系统是分级结构的。因为数据随着时间的存储容量的增加而不断积累，因此需要一个高效且易于管理的目录结构来组织数据。许多人犯了一个错误，将所有数据都放在主目录的根部，从而在成百甚至上千个文件中浪费大量时间寻找他们想要的内容。现在就开始养成将文件组织成优雅且高效的文件结构的习惯，为你的更好的未来做好准备。\n\
  \n创建目录非常简单。相应的命令是 `mkdir`，它是 Make Directory（创建目录）的缩写。\n`mkdir [set of options]`\n\
  在简单的情况下，运行 `mkdir` 并仅输入一个目录将创建该目录。\n\n```\npwd\n/home/mike\nIsbin Docs public_html\n\
  mkdir linuxbookwork\nIsbin Docs linuxbookwork public_html\n```\n让我们逐步检查这些命令：\n-\
  \ 第 1 行 - 首先，我们确保处于正确的路径（我的主目录）。\n- 第 2 行 - 列出目录中已存在的内容。\n- 第 7 行 - 我们运行 `mkdir`\
  \ 命令创建目录 `linuxbookwork`（这是一个存放所有与此书相关的工作的好地方，并将其与其他所有文件分开）。\n\n请记住，当我们在此命令中提供目录时，我们实际上提供的是一个路径。相对路径还是绝对路径？以下是我们可以提供要创建目录的几种其他方法。\n\
  ```bash\nmkdir /home/mike/anything\nmkdir ./something\nmkdir ../dir1\nmkdir ~/linuxbookwork/dir2\n\
  ```\n没意义？请复习第 2 章“导航”。\n\n`mkdir` 有几个可用的选项，这些选项非常有用。我们如何找到特定命令的命令行选项呢？\n首先，`-p`\
  \ 告诉 `mkdir` 根据需要创建父目录（下文将解释）。第二个选项 `-v` 让 `mkdir` 在执行操作时确切地告诉我们它正在做什么（如上所示，它通常不会这样做）。\n\
  \n```bash\nmkdir -p linuxbookwork/anything/sample\ncd linuxbookwork/anything/sample\n\
  pwd/home/mike/linuxbookwork/anything/sample\n```\n现在，加上 `-v` 选项执行相同的命令。\n```bash\n\
  mkdir -pv linuxbookwork/anything/sample\nmkdir: created directory linuxbookwork\n\
  mkdir: created directory linuxbookwork/anything\nmkdir: created directory linuxbookwork/anything/sample\n\
  ```\n\n### 删除目录\n重要的是，记住当我们在这个命令中提供目录时，我们实际上提供的是一个路径。但重要的是记住，Linux 命令行没有撤销功能（而 桌面环境通常有）。要小心。删除目录的命令是\
  \ `rmdir`，它是 remove directory 的缩写。\n`rmdir [set of options]`\n`rmdir` 和 `mkdir`\
  \ 一样支持 `-v` 和 `-p` 选项。此外，为了删除目录，目录必须是空的（有一种方法，稍后会介绍）。\n```bash\nrmdir linuxbookwork/anything\n\
  linuxbookwork/anything\n```\n\n### 空文件\n许多操作文件数据的命令在被引用且不存在时，实际上会创建文件。这种特性可以使用 `touch`\
  \ 命令来创建空文件。\n`touch [set of options]`\n```\npwd/home/mike\nlinuxbookwork\ntouch\
  \ sample1\nsample1\n```\n`touch` 命令用于更改文件的访问和修改时间（通常是不必要的，但在处理系统时很有用）。学生经常尝试使用此命令让文件看起来被修改过，尽管由于检测。这里的好处是，如果我们对不存在的文件使用该命令，它会自动创建。\n\
  \n使用命令及其行为，并熟悉系统的不同方面，构成了 Linux 中完成的许多事情。在引言中，我们提到命令行为你提供了一些构建块。这些构建块可以在完全理解每个功能的情况下应用于任何方式。我们创建的文件是空的。在未来，我们将检查在文件中插入和提取数据的方法。\n\
  \n### 复制文件/目录\n复制文件和目录有很多原因。最常见的原因之一是在对原始文件进行某些修改之前创建一个备份版本。在发生错误时，信息和进度不会丢失。创建副本的命令是\
  \ `cp`，意味着 copy（复制）。\n`cp [set of options]`\n`cp` 有许多可用选项。我们将在下面查看其中，但最好先查看 `cp`\
  \ 的主页看看哪些是可用的。\n```\nsample1 foo\ncp example1 bar\nsample1 foo\n```\n在这个例子中，源和目标都是路径，因此我们可以使用绝对和相对路径来引用它们。例如：\n\
  ```bash\ncp /home/mike/linuxbookwork/example2 example3\ncp example2 ../../mybackups\n\
  cp example2 ../../mybackups/example4\ncp /home/mike/linuxbookwork/example2 /otherdir/anything/example5\n\
  ```\n使用 `cp` 时目标可以是文件或目录。如果是文件（示例 1、3 和 4），它将通过目标指定的文件名命名源的副本。如果是目录，它会将同名文件复制到目录中。默认情况下，`cp`\
  \ 只复制单个文件（你可以一次复制多个文件，将在第 6 章“通配符”中介绍）。`-r` 选项代表 recursive（递归），可用于复制目录。当你使用递归时，你想查看一个目录及其包含的所有文件、目录以及子目录，并重复执行相同的操作。\n\
  ```\nexample1 foo\ncp -r foo something\ncp: omitted directory 'foo'\nsample1 foo\
  \ something\n```\n\n### 移动文件或目录\n`mv` 命令用于移动文件。`mv` 的工作原理与 `cp` 相似，小优势是它可以应用于整个目录而无需\
  \ `-r` 选项。\n`mv [set of options]`\n```\nsample1 foo\nmkdir mybackups\nmv something\
  \ mybackups/anything\nmv barry backup/mybackups sample1 foo\n```\n现在，详细说明：\n- 第\
  \ 3 行 - 创建新目录 `mybackups`。\n- 第 4 行 - 将目录移动到 `mybackups` 并重命名。\n- 第 7 行 - 将文件移动到\
  \ `mybackups`，由于没有提供目标，它保留了名称。记住源和目标都是路径，可以作为绝对或相对引用。\n\n### 重命名文件和目录\n与 `touch`\
  \ 命令类似，`mv` 命令可以创造性地来实现不同的结果。如上面第 4 行所示，你可以通过为文件或目录提供新名称来重命名正在移动的文件。如果我们指定目标与源相同的目录，那么\
  \ `mv` 就能有效地重命名文件或目录。\n```\nmybackups sample1 foo\nmv foo something\nmybackups sample1\
  \ something\ncd linuxbook/test\nmv linuxwork/test /home/mike/fred\nmybackups sample1\
  \ something\n```\n- 第 3 行 - 文件被重命名为 something（两个路径都是相对路径）。\n- 第 6 行 - 移动到我们的父目录。我们这样做这样做是为了接下来可以对文件和目录运行命令。\n\
  \n"
