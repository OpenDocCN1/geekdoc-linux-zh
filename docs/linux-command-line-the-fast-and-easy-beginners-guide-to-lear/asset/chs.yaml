  \ 00027.jpeg](img/rsrc1UZ.jpg)\n\n### Df\n如果你想查看系统每个分区还剩多少磁盘空间，可以使用 `df` 命令。你只需要在命令行中输入它，就能看到每个挂载分区以及使用了多少或可用多少字节的空间。如果你想以兆字节为单位查看，可以使用\
  \ `df -m` 命令。\n\n![Description: 00028.jpeg](img/rsrc1V0.jpg)\n\n### Tar\n当你需要在命令行中处理\
