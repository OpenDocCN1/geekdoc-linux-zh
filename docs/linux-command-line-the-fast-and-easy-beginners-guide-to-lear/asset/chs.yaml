  \n### Nano, jed, vi\n首先，`nano` 命令是一个很棒的文本编辑器，它能够识别大多数语言，并能标亮彩色关键字。另一方面，`vi` 比 `nano`\
  \ 更简单。你可以创建一个新文件，或使用编辑器修改文件。让我们举个例：你想创建一个名为 `check.txt` 的文件。你可以使用 `nano check.txt`\
