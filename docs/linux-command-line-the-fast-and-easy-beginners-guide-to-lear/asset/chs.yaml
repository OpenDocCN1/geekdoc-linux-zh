- "# Linux 命令行：通过 7 个简单步骤快速学习 Linux 基础的学者指南（编程书籍 2）\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  # 引言\n\n恭喜下载《命令行》，感谢你的支持。当你查看 Linux 时，回顾它的演变过程是非常关重要的。尽管 Linux 是当今最强大的操作系统之一，但它的起点非常卑微，以下是它产生的历史。\n\
  \n### 卑微的起点\n\n1969 年，在肯·汤普（Ken Thompson）和丹尼斯·里奇（Dennis Ritchie）的帮助下，Unix 诞生了。随后出现了几个基于\
  \ Unix 的项目，试图进一步。BSD 和 MINIX 等项目都在这段时期出现。这一切都已成为过去，直到一位名叫林纳斯·托瓦尔斯（Linus Torvalds）的天明学生将他对之前系统的知识相结合，创造了一个后来风靡世界的内核。\n\
  \n1991 年是 Linux 真正的诞生年。Linus 基于 MINIX 创建了一个免费的终端，并将他的版本命名为 Linux。尽管他并不希望它被称为 Linux，因为这看起来会很自大，但一个朋友重新命名了上传用于未来开发的版本，于是这个名字诞生了。\n\
  \n### 桌面\n\n1992 年至 1994 年间经历了桌面的增长。Slackware、Debian 和 Red Hat Linux 在此发布，内核版本为\
  \ 0.95 以及 TCP/IP 栈。然而，1994 年 3 月 Linux 1.0 的发布是游戏规则的改变者。该版本拥有 17,250 行代码，这在当时是极其惊人的。\n\
  \n### Gnome 和 KDE 的发布\n\nLinux 历史的下一章发生在 1995 年至 1999 年间。Linux 在此期间推出，被认为是第一个支持启动和\
  \ NFS 的 Linux 发行版。可以将已安装的版本复制到类似的机器上。正是这个发行版为我们今天所知的 SUSE Linux 奠定了基础。Red Hat 分支被留在了。在这几年里，根据需要，Linux\
  \ 内核从 1.2.0 版本演进到 2.2。前千年时代还看到了内存管理和 PowerPC 架构支持的巨大改进。Linux 开始作为 IT 专业人士的选择而流行起来。这一时期的其他重大进展是\
  \ KDE 和 Gnome 环境的建立。KDE 由马蒂亚斯·埃特希（Matthias Ettrich）在图宾根大学创立。另一方面，Red Hat 演变成了 Gnome\
  \ 环境。当这些变化发生时，Sun 和 Oracle 宣布了对不同版本的支持。\n\n### Live 发行版\n\n千禧后的五年见证了一些惊人事物的兴起。许多\
  \ Linux 驱动计算机出现，内核也经历了许多变化。许多新应用被开发，所有第一个现场发行版诞生了。Knix 在 2000 年至 2005 年间流行，因为它可以从\
  \ CD 直接启动。这对于其他 Linux 发行版来说已经足够高了。Linux 也开始失去它的原创性并变得越来越像微软操作系统。这一时期的另一个重要里程碑是 Linux\
  \ 内核 2.4 版本的发布，它支持 USB、EXT3 文件系统、RAID 和蓝牙。\n\n语义是决定语言含义的规则，而语法是在解释器执行程序时检查的。为了避免语义错误，建议在编码之前花时间规划和分析。如果计划得当，程序将花费更少的时间。语义的一个例子是计算数字和。当我们使用\
  \ `total number` 来除数字时，结果可能是错误的，但解释器不会显示任何错误，因为它不理解语义。现在让我们看看程序的各个部分与与编译的语言不同，基于解释器的语言不需要完整的程序就可以解析它。它可以处理单行代码并解释给计算机。这个内核是如此强大，以\
  \ `2.4.37.11` 的发布结束。2011 年的 `2.6` 支持 CPU、文件大小和 EXT4。\n\n### Ubuntu 时代\n\n2005 年之后，事情开始稳定，导致了\
  \ 2006 年至 2012 年的 Ubuntu 时代。Linux Mint 是最流行的发行版之一。尽管开头很小，时间会证明。\n\n### 命令行基础\n\n\
  命令行很简单。它可以告诉你如何操作，因为每个系统都是不同的，以下是一些地方。\n\n### 打开终端\n\n如果你使用 Linux，你将在那里得到。你也可以在计算机上右键。如果你在\
  \ Windows 上并想登录另一台机器，将需要 `SSH` 客户端。完美的应该是 `Putty`。\n\n### Shell\n\n在命令行中，我们有一个 shell。它定义了终端在执行\
  \ `bash` 后的行为。如果你想知道 shell 的类型，可以使用 `echo` 命令显示你的当前 shell。\n\n```bash\necho $SHELL/bin/bash\n\
  ```\n\n### 绝对路径与相对路径\n\n在精通 Linux 时很重要。当我们在命令行中引用目录或文件时，路径是一种寻找它的方法。\n\n- **绝对路径**指定主目录或文件的位置。你可以轻松识别它们为\
  \ `/home/mike`。\n- **相对路径**相对于我们当前系统的目录或文件位置。一个例子是 `/home/mike`。\n\n### 你在哪里？\n\n\
  知道在哪里很好。接下来你想知道那里有什么。工作的命令是 `ls` 的简短形式。试试看。\n\n```bash\nls public-html\n```\n\n\
  `pwd` 是不带参数运行的。`ls` 更强大。当我们不带任何参数运行时，它会显示位置列表。\n\n### ls [options] [file system\
  \ location]\n\n```bash\nls [options] [file system location]\n```\n\n在上面的示例中，方括号表示这些是选项；我们可以带或不带它们运行命令。分解如下：\n\
  \n- 第一行是基础形式，显示当前目录的内容。\n- 第 4 行是单个命令行选项，显示：\n    - 第一个字符显示文件或目录是否正常。\n    - 下九个字符是目录或文件的权限。\n\
  \    - 下一个是块数。\n    - 下一个字段显示文件的所有者。\n    - 下一个是文件所属的组。\n    - 下一个是文件大小。\n    -\
  \ 后面是修改时间。\n    - 最后是文件名。\n    - 第 10 行是命令行参数，告诉我们文件。\n    - 第 13 行是参数和命令行选项，显示文件的详细列表。\n\
  \    - 第 12 和 18 行显示我们的一些命令。\n\n### 制表符补全\n\n写这些路径是挑战性的。制表符补全是命令行提供的机制，在这种情况下会帮助。如果你尝试输入\
  \ `cd/home/` 可能会得到工作方式。\n\n### 总结：\n\n- `pwd`:打印工作目录。\n- `ls`:列出文件内容。\n- `cd`:切换目录。\n\
  - **相对路径**:相对于我们当前系统的目录或文件位置。\n- **绝对路径**:相对于文件系统的根的目录或文件。\n\n### 移动\n\n我们使用名为 `cd`（切换目录）的命令在系统中移动。工作如下：\n\
  \n```bash\ncd [file system location]\n```\n\n当你运行不带参数的 `cd` 命令时，它通常带你回到主目录。以下是一些示例：\n\
  \n```bash\ncd\n```\n\n```bash\ncd /home/mike\n```\n\n```bash\ncd ../\n```\n\n```bash\n\
  cd /\n```\n\n***\n\n### 如何从磁盘开始安装 Linux\n\n开始安装 Linux，将系统 CD 插入驱动器并选择从 CD 启动重启。\n\
  \n电脑可能已经配置为从 CD 启动。如果没有发生 CD 启动，重启时进入 BIOS 设置。在大多数系统中，在启动电脑或重启后立即按下 `Delete` 键或\
  \ `F11`。\n\n之后，找到 Advanced BIOS Settings 部分。有时区域可能不同，但在任何情况下与书中非常相似。通过方向键将指针指向它，然后按\
  \ Enter 键进入。现在在参数中找到 `Boot Sequence`（启动顺序），或者如果没有，找到 `1st boot device`（第一个启动设备）。使用方向键选择所需项目，并通过使用\
  \ `Page Up` 和 `Page Down` 键更改其值，使其成为第一个启动 CD-ROM 设备。按 `Esc` 键退出该区域。\n\n### 为什么你不能在已有分区上安装\
  \ Linux，即使有可用空间？\n\n事实是 Windows 使用 `FAT32` 文件系统（旧版本 `FAT16`）或 `NTFS`（在 Windows NT/2000\
  \ 中），而在 Linux 中是一个完全不同的系统，称为扩展文件系统 2（`ext2fs`，最新版本为日志型 `ext4`）。这些文件系统只能位于硬盘的不同分区上。注意在\
  \ Linux 中，硬盘被称为第一个 `hda`，第二个 `hdb`，第三个 `hdc`，以此此类推（`hdd`、`hde`、`hdf`...）。有时在系统的安装程序可以看到磁盘的全名——`/dev/hda`\
  \ 代替 `hda`，`/dev/hdb` 代替 `hdb`，等等——这对我们现在来说是一样的。每个磁盘的逻辑分区都是编号的。因此，在 `hda` 物理磁盘上，有\
  \ `hda1`、`hda2` 等；`hdb` 物理磁盘上，有 `hdb1`、`hdb2` 等。\n\n\n\n\n\n# 如何为 Linux 制作启动型 USB\
  \ 闪盘\n\n如今，操作系统正变得越来越流行。你可能已经从朋友或熟人那里听过关于安装此类系统有多么简单的故事。显然，创建一个 Linux 启动型 USB 闪盘是在硬盘损坏或缺失驱动器的电脑、笔记本电脑或上网电脑上重新安装操作系统的极佳方法。让我们更好地了解一下这种安装方法吧！\n\
  \n首先，你需要找到并下载 Linux 操作系统镜像。在互联网上寻找不同版本的 Linux 镜像非常简单，因为它们是“免费软件”且完全免费分发。从我们的网站、官方网站或种子站点下载所需的镜像。\n\
  \n制作一个可启动的 Linux U 闪盘需要一个普通的 U 盘。其容量应为 `1GB` 或更高。\n\n接下来，你需要下载 `Unetbootin` 程序。这个程序将帮助我们制作启动型\
  \ Linux U 闪盘。你可以从 `unetbootin.sourceforge.net` 页面下载。在网站顶部有针对三个发行版的按钮——Windows、Linux\
  \ 和 Mac OS。例如，如果你现在使用的是 Windows，那么就点击 Windows 按钮。\n\n下载完成后，程序会立即打开，你不需要安装它。如果启动时遇到问题（Windows\
  \ 7），请“以管理员身份运行”。最初，程序勾选的是“发行版（Distribution）”，但我们需要将其切换到“磁盘镜像（Disk Image）”。我们还要指定\
  \ ISO 镜像。接下来，点击 `...` 按钮并选择我们之前从网上下载的镜像。\n\n如果你的 U 闪盘容量足够，建议在文件存储空间中分配空间。`100 MB`\
  \ 就足够了。\n\n在程序窗口的最底部，选择你想要刻制的 U 闪盘。例如——类型：USB 驱动器；介质：E: \\ \\ 如果电脑只插入了一个 U 闪盘，程序将自动识别，无需任何选择。\n\
  \n剩下的只需点击“OK”按钮并等待程序完成镜像刻录。这需要 `5-10 分钟`。这就是关于如何将 Linux 刻录到 U 闪盘所需的所有知识。刻录完成后，你必须重启电脑，或将\
  \ U 闪盘插入你想安装 Linux 操作系统的电脑上。\n\n### 如何选择要安装的程序\n\n现在，最关键的时刻——硬盘分区——已经过去。现在安装程序进入下一个阶段，它将提议你选择必要的程序（在\
  \ Linux 中，软件包传统上被称为程序，顺便说，从术语角度来看如此）。\n\n你可以简单地选择一种安装包选项（适用于家用电脑、办公室、连接局域网的工作站等）。或者，通过手动打开“软件包选择”开关，进入软件包选择窗口。Linux\
  \ 发行版包含的所有程序在该窗口中被分为几个部分：系统、图形、文本、出版、声音、游戏、文档等。在每个部分中，你都可以选择（或相反，取消勾选）任何软件包。如果无法从程序名称判断其用途，请点击名称，特殊窗口中将出现该程序用途的简要描述。遗憾的是，在俄语版发行版中，通常并不是所有的描述都翻译成了俄语，因此某些描述可能是英语。\n\
  \n选择好需要安装的包后，务必在屏幕上找到并勾选“检查依赖关系”框。事实上，某些程序可能依赖于其他程序，也就是说它们在工作中可能会使用其他程序的模块。\n\n\
  某些程序可能需要任何其他软件包才能正常运行。在这种情况下，它们被称为一个程序依赖于另一个。例如，`kreatecd` CD 刻录程序仅包含图形用户界面，并调用\
  \ `cdrecord` 控制台程序进行实际刻录，尽管用户在工作时看不到它。这意味着 `kreatecd` 程序依赖于 `cdrecord`。安装 Linux\
  \ 时，所有的软件依赖关系都会自动检查；你只需要开启相应的开关允许安装程序执行即可。\n\n检查依赖关系的复选框用于安装程序自动检查某些选定的程序是否使用了未被选择安装的包。在完成此类检查后，安装程序将为你提供这些包的列表，并建议也安装它们。我们应该同意，否则某些程序将无法运行。\n\
  \n### 配置设备和图形界面\n\n在你同意安装必要的包后，将必要文件复制到硬盘的过程将开始。这个过程非常长，所以你可以利用这段时间去喝咖啡，至少需要五到十分钟。然而，如果你的发行版记录在两张或更多光盘上，安装程序会偶尔要求你将必要的光盘插入驱动器。\n\
  \n然后将开始配置额外设备和图形界面。这里有一个小细节。事实上，由于某些原因，大多数安装程序错误处理鼠标信息。因此，在这个阶段关于你拥有什么种鼠标的问题只需回答“简单的双键”或“简单的三键”。不要查看制造商、型号等列表。安装系统后，如果鼠标的额外功能（例如滚轮的操作）本身不起工作，可以单独启用。\n\
  \n### 安装引导加载程序\n\n完成上述操作后，新安装的系统已准备就绪。然而，安装程序将要求你回答最后一个问题：是否应该安装引导加载程序，如果有必要，安装哪一个？\n\
  \n如果 Linux 是你电脑上唯一的操作系统，那么你不需要引导加载程序。在这种情况下，只需重启电脑并移除启动 CD。如果你特意更改了 BIOS 设置以允许电脑从\
  \ CD 或软盘启动，那么现在安装完系统后，你可以重新配置电脑为仅从硬盘启动。要做到这一点，返回 BIOS 设置并更改启动顺序。然而，如果你指定了“通用”启动顺序——软盘、CD-ROM、IDEOS——你就无法再更改它，只需确保在开启和重启电脑时，没有插入启动软盘或\
  \ CD，除非有必要从这些设备启动。\n\n### 选择合适的 Linux 发行版\n\n发行版的流行程度。你的发行版越流行，在网上就越容易找到它的教程。大型社区意味着如果你在开发过程中遇到任何困难，你可以在该发行版的专用论坛中轻松获得帮助。最后，发行版越常见，为它创建的应用程序和软件包就越多。与其在某些奇特的发行版中忍受从源码编译，不如选择具有现成包基础的流行解决方案。\n\
  \n开发命令处理这些。自然地，最好关注受 Canonical Ltd.、Red Hat 或 SUSE 等大公司支持的发行版，记住，即使是最好的 Linux 发行版也有不于它们的替代品。\n\
  \n### Linux Mint\n从 Windows 迁移的用户绝对需要安装 Linux Mint。它是最流行的 Linux 发行版。这是一个基于 Ubuntu\
  \ 的非常稳定且易用的系统。Linux Mint 配备了直观界面和方便的应用程序管理器，因此你在寻找和安装程序时不会遇到问题。它有两个桌面：适用于现代电脑的 `Cinnamon`\
  \ 和适用于旧电脑的 `MATE`。这是一个非常简单的软件，适用于普通用户。不需要任何特定知识。当然，预装软件可能非常有用。\n\n### Manjaro\n\
  这是最新的 Linux 发行版之一。基于 Arch。Arch 是一个极其强大的功能发行版，但其 KISS（保持简单）哲学与其名称相反，对于初学者来说过于复杂。Arch\
  \ 仅通过命令行安装。与 Arch 不同，它有一个简单的图形安装程序，同时结合了 Arch 的强大功能，如 `AUR`（Arch 用户仓库）和滚动发布。这是 Linux\
  \ 包最丰富的来源。如果 Linux 中有某些应用程序可能已经存在于 `AUR` 中。在这个发行版中，你将一直享受各种桌面环境：功能强大的 `KDE`、平板的\
  \ `GNOME`、`Xfce` 以及 `LXDE` 等。通过安装此发行版，你可以确保获得最新的更新。它带有自己的桌面环境。然而，没有什么能阻止你替换它。\n\n\
  ### Debian\n该发行版将很好地运行服务器。这是一个稳定且保守的发行版，是 Ubuntu 和许多其他 Linux 系统的基础。它只使用最可靠的包，是服务器的良好选择。它具有稳定性和大量的应用程序。但在安装后，你可能需要手动配置。\n\
  \n### Kodi\n这是一种适用于媒体中心的 Linux 发行版。如果你想构建媒体服务器，严格来说，它不是发行版包，而是一个功能全的播放器。你可以在任何 Linux\
  \ 上安装它，但最好选择 Ubuntu。该发行版支持所有类型的视频和音频文件。它知道如何播放电影、音乐和组织照片。益于扩展，可以通过种子下载媒体文件，显示 YouTube\
  \ 视频和其他流媒体服务。简而言之，Kodi 可以完成一切。此外，Kodi 是非常美观的并针对遥控器或设备进行了优化。标准界面可能并不吸引所有人，但很容易替换。还有一些有趣的版本：适用于桌面的\
  \ `Kubuntu`；适用于旧电脑的 `Lubuntu`；适用于平板的 `Ubuntu`；适用于笔记本电脑的 Linux 版本。\n\n## 第二章：Linux\
  \ 安装\n\n在继续安装之前，最好先检查 PC 的硬件。访问硬件供应商网站检查兼容性列表。\n\n- **DVD 驱动器**：要安装 Linux，必须有一个\
  \ DVD 驱动器，且电脑必须能够从其启动。\n- **硬盘**：如果使用 Live CD 且电脑仍从硬盘启动，则不需要。要安装 Linux，理想情况下至少有\
  \ `4GB` 的磁盘空间。Linux 支持 IDE 和 SCSI 控制器。\n- **键盘**：所有键盘都适用于 Linux。\n- **显示器**：大多数安装程序都可以检测现代显示器。如果显示效果不好，选择显示器类型和特定分辨率（`1024x768`）。\n\
  - **鼠标**：`PS/2` 或 `USB` 鼠标适用于 Linux。\n- **网卡**：安装程序可以检测大多数网卡。如果你在这一方面遇到问题，请在线查找额外信息。\n\
  - **处理器**：要求的速度为 `700 MHz`。在速度方面，越高越好。\n- **内存**：越大越好。最小要求为 `512MB`。检查对应发行版的内存——其他可能需要更大的内存分配。\n\
  - **声卡、显卡、打印机**：确保与 Linux 兼容。参考硬件供应商网站的信息。\n\n接下来，为 Linux 留空间。如果你选择在不移除当前操作系统的情况下安装\
  \ Linux，注意现有操作系统使用整个硬盘。这意味着 Linux 和当前操作系统需要共享硬盘以便两者共存。为了防止数据丢失，为了便于分区，你可以在 Windows\
  \ 上运行名为 `GParted` 的 GUI 工具。某些发行版（如 `openSUSE` 或 `Android Desktop`）可以自动为 Linux 创建分区。如果你的发行版提供此功能，你不再需要分区工具。\n\
  \n### 安装步骤\n\n前往 Linux 发行版下载文件。下载的文件带有安装步骤。在本节中，我们将讨论任何发行版的通用安装步骤。\n\n步骤 1：准备 CD/DVD\
  \ 安装程序或 Live CD。下载计划安装的发行版副本并将其刻录到 CD/DVD 上。\n\n步骤 2：确保 PC 可以从 CD/DVD 启动。如果驱动器中有\
  \ CD/DVD 时电脑仍从硬盘启动，请首先更改启动设备。进入 BIOS 并更改启动顺序——选择 CD/DVD 驱动器作为启动启动。你可以通过重启 PC 并按键（大多数电脑上为\
  \ `F2` 或 `Del`）进入设置菜单。分配 CD/DVD 为第一启动项后，放入放入驱动器并重启电脑。\n\n步骤 3：如果你使用 Live CD，电脑将从\
  \ Live CD 加载操作系统。安装完成后重启电脑。\n\n### 安装后 X 不工作\n\n如果你在安装期间看到 GUI，但在首次重启后遇到灰色屏幕或中间带有\
  \ X 的黑屏，这里有一些可以故障排除的步骤：重启 PC。按下 `Ctrl+Alt+Delete`。PC 启动时，如果发行版使用 GRUB（统一引导加载程序），按下\
  \ `A` 。对于 `LILO`，跳过此步。GRUB 引导加载程序将显示 Linux 内核的命令行并询问你想做什么。对于 GRUB，输入空格然后输入 `single`。如果使用\
  \ `LILO`，输入 `single` 然后按回车。Linux 内核将以单用户模式启动并显示以下提示符：`sh-`。一旦看到此提示符，你现在可以配置 X。根据你使用的发行版，X\
  \ 使用配置文件来设置你的显示卡、显示器和分辨率。有时由于 Linux 安装程序的配置不正确会出现这个问题。通过创建一个有效的配置文件来解决这个问题：输入以下命令：\n\
  \n```\n\n当你输入此命令后，X 服务器将创建一个配置文件。你会看到屏幕变白然后显示几条消息。使用文本编辑器 `vi` 编辑 `/etc/xorg.conf.new`\
  \ 文件。在 \"Files\" 部分之后插入以下行：\n```\n```\n输入以下命令启动 X 服务器：\n```\n```\n\n一旦你看到带有 X 光标的空白屏幕，说明配置文件工作正常。使用\
  \ `Ctrl+Alt+Backspace` 停止 X 服务器。输入以下命令将配置文件复制到 `/etc/X11` 目录：\n\n输入单词 `reboot` 或按下\
  \ `Ctrl+Alt+Delete`。\n\n\n\n\n\n### LibreOffice 办公件\n\n如果你习惯使用 Microsoft Office\
  \ 来处理所有的办公应用需求，你会发现这套套件提供了几乎相同的功能。LibreOffice 包含了 `Calc` 表格应用程序、功能类似于 `Powerpoint`\
  \ 的 `Impress` 应用，以及功能类似于 `Microsoft Word` 的 `Writer` 应用。\n\n### Kontact\n\n此应用配备了\
  \ `KDE`，它与 `KOrganizer` 和 `KMail` 等其他应用程序集成在一起。该应用程序可以显示你进入桌面时可能想要调出的所有内容，例如日程安排、新邮件等。所有这些信息都汇总在一个图形化格式的个人信息管理器中。你只需通过点击桌面面板上的图标或从主菜单启动，即可调出\
  \ `Kontact`。你也可以通过点击位于 `Kontact` 窗口左侧格的图标，探索所有集成到 `Kontact` 中的应用。\n\n### 计算器\n\n\
  无论你使用的是 `GNOME` 还是 `KDE`，你都可以获得一个默认的计算器。这两款计算器都能执行科学计算，例如三角函数方程以及计算平方根和倒数。要查找计算器，请从主菜单中调出“附件”（Accessories）或“工具”（Utilities）。\n\
  \n### 多媒体应用\n\n几乎所有的 Linux 发行版都带有多媒体应用，大部分是音频播放器和 CD 播放器。还包含一些应用允许你使用数码相机或刻录 DVD\
  \ 和 CD。如果你想播放视频或音乐文件，可能需要下载并安装额外的软件。\n\n### 在 Linux 上使用数码相机\n\n大多数可用发行版都有一个默认应用程序，可以使用它从数码相机导入图像文件。例如，`Xandros`\
  \ 和 `SUSE` 带有 `digiKam` 应用，它允许你通过 `USB` 端口连接数码相机，然后从那里导入图像文件。`digiKam` 的功能类似于典型的媒体文件管理器。要使用它，请遵循以下指令：\n\
  \n1. 将相机连接到 `USB` 端口或串口，然后开启相机。\n2. 加载 `digiKam`。你可以在“图像”（Images）或“图形”（Graphics）子菜单找到该应用。如果是第一次加载该应用，`digiKam`\
  \ 将询问你存储图像文件的默认位置以及你可能想要配置的其他偏好。\n3. 调出 `digiKam` 菜单，然后进入 `Settings->Configure digiKam`。\n\
  4. 选择 `Cameras` 选项卡，然后选择 `Auto Detect`。如果相机被检测到并支持且应用正常，你就可以继续使用 `digiKam` 从设备中下载照片。你将看到一个显示所有照片的新窗口。\n\
  5. 选择你想保存到计算机上的图像。完成后后，你可以将文件保存到目标文件夹中，甚至可以使用你选择的照片相编辑器编辑你的照片。\n\n如果 `digiKam` 找不到你的数码相机，只要相机带有\
  \ `USB` 接口，你仍然可以通过相机存储访问你的文件。你只需要遵循以下步骤：\n\n1. 通过 `USB` 端口连接相机。一旦设备连接并检测到，你就可以使用文件管理器窗口打开包含图像文件的文件夹。\n\
  2. 通过拖放文件选择你想保存到文件夹中的照片。\n3. 关闭文件管理器并弹出设备。\n\n\n\n\n\n## 如何从 CD 播放音频\n\n所有 Linux\
  \ 发行版都带有默认的 CD 播放器应用程序。如果你想从 CD 播放音乐，你只需要一个配置了 Linux 的声卡即可。在某些发行版中，会弹出一个对话框，询问你是否要播放插入驱动器的\
  \ CD。如果你没有看到这个对话框，可以通过选择 `Applications->Sound and Video`（应用程序->音频视频）找到你的 CD 播放器。\n\
  \n如果你正在使用 `KDE` CD 播放器，你将看到 CD 的名称和正在播放的曲目。该播放器从 `freedb.org` 获取专辑信息，这是一个基于互联网的\
  \ CD 开源数据库。要下载专辑信息，你需要连接到。然而，一旦你能够下载这些信息，你的计算机就会缓存这些数据，供以后会话使用。\n\n## 如何播放音频文件\n\
  \n如果你想播放任何音频文件（例如 `.mp3s`），你可以使用 `XMMS` 或 `Rhythmbox`。`Rhythmbox` 是拥有大量 `.mp3` 收藏的用户首选播放器之一，因为它在组织文件时非常有用。你可以从主菜单中找到并调出\
  \ `Rhythmbox`。\n\n当你第一次使用 `Rhythmbox` 时，应用程序助手会提示你识别音乐文件存储在何处。这样做允许应用程序管理你的音乐库。之后，`Rhythmbox`\
  \ 将以有序的方式显示你的歌曲。\n\n`XMMS` 是你可能有的另一个选项，特别是当你拥有包含多种文件类型的音乐库时，例如 `FLAC`、`.wav` 或 `Ogg\
  \ Vorbis`。要运行此程序，只需从主菜单选择应用程序图标即可。启动 `XMMS` 后，你可以通过 `Window-> Play File`（窗口->播放文件）或按下\
  \ `L` 来选择文件。在 `Load File`（加载文件）对话框中，选择你想加载的一个或多个文件。点击 `Play`（播放）按钮后，应用程序将播放所选的文件。\n\
  \n## 如何在 Linux 中刻录光盘\n\n大多数大多数 Linux 文件管理器都能够刻录 DVD 或 CD 光盘。例如，`Nautilus` 和 `Xandros`\
  \ 文件管理器内置了刻录功能。同时，不同的 Linux 发行版还提供了让你方便地将文件刻录到 DVD 或 CD 的应用程序。例如，`K3b` 允许你在 `SUSE`\
  \ 和 `Knoppix` 等发行版中刻录光盘。\n\n像 `K3b` 这样的应用程序非常易使用——你只需要收集所有想要刻录光盘的文件，然后使用该程序开始刻录过程。但请注意，这些应用程序可能需要命令行程序（如\
  \ `cdrdao` 和 `cdrecord`）来刻录 CD。`K3b` 还需要 `growisofs` 程序才能刻录 DVD。\n\n## 图形和成像应用\n\
  \nLinux 提供了不同的成像和图形处理应用程序。以下是两个最流行的应用程序：\n\n### GIMP\n\n`The GIMP` 是一个根据 `GNU GPL`（通用公共许可）发布的程序。大多数\
  \ Linux 发行版都带有此程序，但你可能也需要选择一个包来安装此程序。`The GIMP` 经常与最流行的图像处理应用程序相比，例如 `Adobe Photoshop`\
  \ 和 `PhotoPaint`。\n\n要启动 `The GIMP`，调出主菜单然后选择 Graphics（图形）类别下的应用程序。一旦启动程序，你将看到一个显示许可和版权信息的窗口。点击\
  \ `Continue`（继续）按钮继续安装。\n\n**提示**：如果你找不到 `The GIMP`，可以通过进入 `Add/Remove Software`（添加/删除软件，位于\
  \ `System Settings` 系统设置）添加程序，并在那里安装应用程序。\n\n安装 `The GIMP` 将会在家目录下创建一个子目录，其中将存储你对应用程序设置所需的数据。点击\
  \ `Continue` 按钮让程序继续创建这些目录，然后按照向导提供的详细说明完成安装。安装后，`The GIMP` 将加载旨在增强应用程序功能的插件或模块。一旦加载所有插件，你就可以浏览\
  \ `Tip` 窗口显示的提示。\n\n### GNOME Ghostview\n\n此应用程序最适合查看 PDF (`.pdf`) 和 PostScript\
  \ (`.ps`) 文档或打印这些文档文件。`Ghostview` 允许你查看和打印长文档中的选定页面，还可以放大或缩小文档区域。你可以通过进入 Fedora\
  \ 中的 `Graphics->Post Script Viewer`（图形->Post 脚本查看器）找到此应用程序。\n\n## 第 4 章 成为 Linux\
  \ 高级用户\n\n在 Linux 中，命令行提示符提供了一种非常强大的用户管理方法。你可以使用命令行创建和删除用户。这些用户还可以分配某些权限，规定他们对系统及其文件可以做什么或不能做什么。这显示了终端是一个强大的工具。这些用户还可以被分到一个组中。从组中添加和删除这些用户也是可能的。这就是我们在本章将探索的内容。\n\
  \n### 'Group' 命令\n\n在 Linux 中，组定义在 `/etc/group` 文件中。该文件包含组名、其 ID 以及属于每个特定组的用户列表。要检查系统中的可用组，请运行以下命令：\n\
  \n```bash\ngroups\n```\n\n从上面的图中可以清楚地看到，我的系统有 8 个组。如果你需要创建一个新组并命名为 `group1`，请运行以下命令：\n\
  \n```bash\ngroupadd group1\n```\n\n值得注意的是，大多数 Linux 发行版会为用户创建一个组，并将其命名为他们使用的账户名称。一旦你使用上述命令创建了组，验证它是否确实被创建是非常重要的。这可以通过查看\
  \ `/etc/group` 文件的内容来实现。如果你找不到你创建的组名，那么在添加过程中可能出了出了问题。你可以在命令行窗口中查看该文件的内容，也可以如下所示使用\
  \ `vim` 编辑器打开它：\n\n```bash\ncat /etc/group\n# 或\nvi /etc/group\n```\n\n但是，如果你使用第二种方法（即在\
  \ `vim` 编辑器中查看），请确保不要更改其内容，因为这可能会导致错误。要为你的组添加组 ID，请如下所示使用 `-g` 选项：\n\n```bash\n\
  groupadd -g 1300 group1id\n```\n\n要创建一个系统组，请如下所示使用 `-r` 选项：\n\n```bash\ngroupadd\
  \ -r systemgroup\n```\n\n我们现在可以使用 `useradd` 命令，它可以用于为系统添加新用户，也可用于更新任何可用用户的信息。让我们创建一个名为\
  \ `user1` 的新用户：\n\n```bash\nuseradd -c \"User\" -d \"/home/user1\" -s \"/bin/bash\"\
  \ -user1\n```\n\n在上面的命令中，我们使用了许多参数。让我们定义它们的用途：\n\n1. `-c` - 这将用于指定用户名称。它是显示在登录窗口上的名称。在我们的案例中是“User”。\n\
  2. `-d` - 表示用户家目录的路径。如果你不指定此项，它将默认创建。在我们上面的命令中，`/home/user1` 将是我们用户的家目录。\n3. `-s`\
  \ - 这将为我们创建的用户建立默认登录 shell。在我们的案例中，`user1` 的默认 shell 将是 `bash` shell。\n\n其他与 `useradd`\
  \ 命令一起使用的选项包括：\n\n4. `-b` - 指定系统的基本目录。这对于大多数 Linux 发行版是 `/home`，用于家目录目的。如果我们在创建新用户时没有指定上面的\
  \ `-d` 选项，则它将成为新用户的默认家目录。\n5. `-g` - 这指定主组的名称或 ID。如果你在创建新用户时不指定此选项，则会创建一个与登录名相似的新组，并分配一个组\
  \ ID。\n\n示例：\n```bash\nuseradd -g 200 user1\n```\n\n\n\n\n\n### 6. -G\n`-G` 用于指定用户所属的其它辅助组。使用逗号来分隔组名。\n\
  \n示例：\n```bash\nuseradd –g 200 –G sudo, adm user1\n```\n注意，在上面的命令中，我们只指定了两个组。也可以添加其他组，并同样使用逗号进行分隔。\n\
  \n### 用户密码管理\n现在我们已经创建了一个新用户并为他们分配了组，为他们分配密码是至关重要的。这将确保安全性，并防止其他用户登录系统并冒充其身份。要为我们创建的用户（即\
  \ `user1`）分配密码，请运行以下命令：\n```bash\npasswd user1\n```\n运行此命令后，系统会提示你输入密码并要求再次输入相同的密码。用户\
  \ `user1` 将将使用该密码登录系统。`passwd` 命令还关联了其他选项，包括：\n\n1. `-d` 删除与指定用户关联的密码，这意味着该用户将无法再次登录系统。\n\
  \   示例：\n   ```bash\n   passwd –d user1\n   ```\n2. `-S` 显示 `/etc/shadow` 文件中的所有信息，以便显示用户的状态。\n\
  \   示例：\n   ```bash\n   passwd –S user1\n   ```\n3. `-l` 锁定特定用户账户的密码。该用户将无需验证即可登录系统。此时将使用其他身份验证方式（如\
  \ SSH 安全外壳）进行身份验证。\n4. `-a` 用于显示系统中所有用户的状态。它只能与 `-S` 选项结合使用。\n   示例：\n   ```bash\n\
  \   passwd –S –a\n   ```\n\n### 用户修改\n有时，你可能需要修改某些用户的设置。如文所示，通过命令行可以很容易实现。\n```bash\n\
  useradd -c \"User\" -d \"/home/user1\" -s \"/bin/bash\" –user1\n```\n要更改上述用户的登录名、名称以及\
  \ ID，或者将其添加到 admin 组，请使用以下命令：\n```bash\nusermod -l user -c \"The User\" -u 4000\
  \ -G adm -a user1\n```\n`-l` 选项的作用是为用户创建一个新的登录名。\n\n### 删除组\n要删除一个组，请使用如下所示的 `groupdel`\
  \ 命令：\n```bash\ngroupdel group1\n```\n该组将被删除，但只有当该组是用户的辅助组时才会发生。如果它是主组，则我们需要先删除用户，然后再删除该组。\n\
  \n### 删除用户\n要删除特定用户，只需运行以下命令：\n```bash\nuserdel user1\n```\n上述命令将从系统中删除用户 `user1`。然而，如果该用户正登录系统，在删除之前会收到警告。该用户的文件和主目录不会被删除。`userdel`\
  \ 命令还关联了以下选项：\n\n1. `-r` 用户主目录中的所有目录和文件将被移除。\n   示例：\n   ```bash\n   userdel –r\
  \ user1\n   ```\n2. `-f` 此选项无论用户是否已登录系统，都会强制删除其账户。无论其他用户是否正在使用该目录，该用户的主目录也将将被删除。\n\
  \n\n\n\n示例：`userdel -f user1`\n\n用户若要执行此命令，必须被添加到 `sudo` 组（这是一个系统组）。要将用户添加到此组，只需运行以下命令：\n\
  \n```bash\nus-rmod -G sudo -a user1\n```\n\n在上述命令中，我们将用户 `user1` 添加到了系统组 `sudo`。该用户随后将能够使用\
  \ `sudo` 命令。为了让用户对其账户拥有完全的控制权，必须将其添加到 `adm` 组。可以通过以下方式实现：\n\n```bash\nusermod -G\
  \ sudo,adm -a user1\n```\n\n如果用户想通过 shell 登录系统，应使用以下命令：\n\n```bash\nlogin user1\n\
  ```\n\n系统将提示其输入密码，如果密码正确，他们即可访问系统。要检查特定用户的所属组，请执行以下命令：\n\n```bash\ngroups 'username'\n\
  ```\n\n示例：`groups user1`\n\n上述命令将显示用户 `user1` 所属的所有组。\n\n## 第 5 章 使用 Shell\n\n对于一名高效的\
  \ Linux 专业人士来说，不使用命令行是不可想象的。命令行是一个 shell 提示符，表示系统已准备好接受用户命令。这可以认为是用户与系统的对话。对于输入的每个命令，用户都会收到系统的响应：\n\
  \n1. 另一个提示，表示命令已执行，你可以输入下一个命令。\n2. 错误信息，系统对用户说明内部发生事件的陈述。\n\n习惯于在图形界面系统中工作的用户可能会觉得命令行操作非常不便。然而，在\
  \ Linux 中，这种类型的界面一直是基础性的，因此也得到了完善。在 Linux 使用的命令行 shell 中，有很多方法可以省力，即在执行最常用操作时减少击键：\n\
  - 自动添加长命令名或文件名\n- 搜索并重新执行以前执行过的命令\n- 使用某些模式替换文件名列表等\n\n当您需要对多种对象执行相似的操作时，命令行的优势尤为明显。在图形界面系统中，你需要进行与对象数量一样多的鼠标拖拽，而在命令行中，一个命令就足够。\n\
  \n本节将介绍允许你使用命令行解决任何用户任务的主要工具：从文件和目录的简单操作（例如复制、重命名、搜索），到需要大量相似操作的复杂任务（这些任务出现在应用程序工作、处理大型数据数组或文本以及系统管理中）。\n\
  \n### Shells\n\n命令行 shell 或命令解释器是一个程序，其任务是将你的命令传递给操作系统和应用程序，并将它们的答案返回给你。根据其任务，它对应\
  \ MS-DOS 中的 `command.com` 或 Windows 中的 `cmd.exe`，但从功能上来说，Linux shell 要丰富得多。在命令行\
  \ shell 语言中，你可以编写小型程序来对文件及其包含的数据执行一系列顺序操作——脚本。\n\n通过输入用户名和密码登录系统后，你将看到命令行提示符——以\
  \ `$` 结尾的行。以后该符号将用于命令行。如果在安装过程中配置了系统启动时启动图形界面，你可以通过 `Ctrl-Alt-F1 - Ctrl-Alt-F6`\
  \ 或使用任何终端仿真程序（例如 `xterm`）进入任何虚拟文本控制台的命令行。\n\n以下是可选的 shell，它们可能根据发行版的不同而异：\n\n- `bash`:\
  \ Linux 最常用的 shell。它可以补全命令和文件名称，保留命令历史并提供编辑它们的能力。\n- `pdksh`: Korn shell 的克隆版本，在\
  \ UNIX shell 系统广为人知。\n- `sash`: 该 shell 的特殊之处在于它不依赖任何共享库，并包含了某些最重要工具的简化实现，例如 `al`、`dd`\
  \ 和 `gzip`。因此，在从系统崩溃恢复或升级最重要共享库版本时，`sash` 特别有用。\n- `tcsh`: C shell 的改进版本。\n- `zsh`:\
  \ 此列出的 shell 中最新的。它实现了命令参数自动补全的高功能以及许多其他功能，使得使用 shell 变得更加方便高效。但请注意，所有 `zsh` 扩展默认禁用禁用，因此在开始使用此命令行\
  \ shell 之前，你需要阅读其文档并启用所需的功能。\n\n默认 shell 是 `bash` (Bourne Again Shell)。要检查你正在使用哪种\
  \ shell，请输入命令：`echo $SHELL`。shell 之间的不同不仅体现在能力上，还体现在命令语法上。如果你是新手，我们建议你使用 `bash`，后续示例将进一步描述该特定领域的工作。\n\
  \n### Bash shell\n\n`bash` 中的命令行由命令名、其后的键（选项）以及修改命令行为的指令组成。键以字符 `-` 或 `-- 开始 开头，通常由单个字母组成。除了键之外，命令后还可以跟参数（参数）——即必须执行命令的对象名称（通常是文件和目录的名称）。\n\
  \n按下 `Enter` 键完成命令输入，随后命令将传递给 shell 执行。作为在用户终端上执行命令的结果，可能会出现关于命令执行或错误的消息，而下一个命令行提示符（以字符\
  \ `$` 结尾）的出现则表示命令已完成，你可以输入下一个。\n\n`bash` 中有几种技术可以让你更容易输入和编辑命令行。例如，使用键盘，你可以：\n- `Ctrl-A`:\
  \ 跳到行首。按下 `Home` 键也可以实现相同操作；\n- `Ctrl-U`: 删除当前行；\n- `Ctrl-C`: 终止当前命令的执行。\n\n你可以使用符号\
  \ `;` 在同一行内输入多个命令。`bash` 会记录历史记录。\n\n（注：由于原文从此处开始出现大量重复和无意义字符，译文已在逻辑完整处截止。）\n\n\n\
  \n\n### rmdir\n```bash\nmkdir training\n```\n`rmdir` 命令用于删除空目录（移除目录）。以下示例删除了当前目录中名为“training”的空目录。\n\
  \n```bash\nrmdir training\n```\n\n### rm\n`rm` 命令是“remove”（删除）的缩写，用于删除文件和目录。要删除当前目录下所有以\
  \ `.txt` 结尾的文件，请执行以下命令：\n\n```bash\nrm *.txt\n```\n为了在删除文件和目录时安全起见，请结合使用选项 `-i`（或\
  \ `--interactive`）和 `-v`（用于 `--verbose` 详细）。在删除文件之前，`rm` 将请求您的显式确认，并打印状态消息：\n\n\
  ```bash\nrm -iv invoice156.txt\nrm: remove regular file \"invoice156.txt\"? y\n\"\
  invoice156.txt\" was deleted\n```\n\n### cp\n`cp` 命令复制文件。为了正常运行，它需要两个名称：原始文件的名称和副本名称。接下来的示例创建一个名为“calendar-2018”的日历文件副本。\n\
  \n```bash\ncp calendar calendar-2018\n```\n原始文件不会被触且保持完整。副本与原始文件内容相同，但时间戳为。使用选项\
  \ `-i`（或 `--interactive`）可以防止覆盖现有文件。\n\n### mv\n`mv` 命令是“move”（移动）的缩写，用于移动和重命名文件及目录。它需要两个名称：原始文件的名称及其新名称。以下示例将“calendar”文件重命名为“calendar-2018”。\n\
  \n```bash\nmv calendar calendar-2018\n```\n原始文件将被删除，新条目接收当前时间戳。使用选项 `-i`（或 `--interactive`）可以防止覆盖现有文件。\n\
  \n### cd\n`cd`（change directory，切换目录）命令允许你在系统中移动。要进入子目录“work”，请使用此命令：\n\n```bash\n\
  cd work\n```\n\n### file\n此命令还可以检测 PDF 文件以及各种图像格式。![Description: 00062.jpeg](img/rsrc1U2.jpg)\n\
  \n### du and df\n这两个非常相似的命令可以告诉你更多关于已用空间的信息，`du` 是“disk usage”（磁盘使用量）的缩写，`df` 意味着“disk\
  \ free”（磁盘空闲）。`du` 计算目录占用的磁盘空间。常规输出列出每个条目的值，可能会让人困惑。为了获取目录的摘要，可以在命令行调用中添加三个参数 `-s`、`-c`\
  \ 和 `-h`。`-s` 代表“summary”（摘要），`-c` 意味着“total”（总计），`-h` 以人类可读的格式输出值。下面的图片显示了你主目录的磁盘使用情况。![Description:\
  \ 00063.jpeg](img/rsrc1U3.jpg)\n\n相比之下，`df` 命令显示设备上剩余空间。下面的图片显示了系统的可用磁盘空间。从左到右，列分别涵盖文件系统、磁盘大小、已空间、可用空间以及挂载到该目录的设备。![Description:\
  \ 00064.jpeg](img/rsrc1U4.jpg)\n\n### 7.2 输出与文本处理\n`echo` 是内置的 shell 命令，用于输出文本：\n\
  \n```bash\necho helphelp\n```\n如前所示，shell 会评估命令并打印变量的值。接下来的示例打印 shell 变量 `$HOME`\
  \ 的值，它代表你的主目录。\n\n```bash\necho $HOME/home/user\n```\n\n### cat and tac\n这两个命令按行打印文件。`cat`\
  \ 从第一行开始到最后一行，而 `tac` 从最后一行开始到第一行。接下来的示例使用一个名为“places”的简单文本文件，每行包含一个城市名称。对于 `cat`，Amsterdam\
  \ 首先出现；而对于 `tac`，则是 Cape Town 。\n\n```bash\ncat places\nAmsterdamBerlinBernCape\
  \ Town\ntac places\nCapeTownBernAmsterdam\n```\n\n### grep\n根据上面用于 `cat` 和 `tac`\
  \ 的示例，接下来的命令行调用仅输出文件中包含字符串“Ber”的行。请记住 `grep` 过滤器是区分大小写的，即它寻找的是以大写字母“B”开头，后跟两个小写字母“e”和“r”的字符串。模式位于文本的开头、中间还是结尾都没有影响。\n\
  \n```bash\ngrep Ber places\nBerlinBern\n```\n在模式方面，`grep` 支持字符串和正则表达式（RegEx）。要找到所有以字母“n”结尾的字符串，请使用选项\
  \ `-E`（或 `--extended-regexp`），后接如下所示的模式 `n$`：\n\n```bash\ngrep -E \"n$\" places\n\
  BerlinBernCape Town\n```\n\n### head and tail\n`head` 输出文件的前几行。在不带进一步参数的情况下调用，它输出前十行。相比之下，`tail`\
  \ 执行相同的操作，但从文件末尾开始。要输出前两行，如下所示添加选项 `-n 2`：\n\n```bash\nhead -n 2 places\nAmsterdamBerlin\n\
  ```\n要输出最后两行，如下所示使用 `tail` 执行相同操作。与 `tac`（见本章之前）不同，`tail` 不会改变输出顺序。\n\n```bash\n\
  tail -n 2 places\nBernCape Town\n```\n\n### nl\n`nl` 类似于 `cat`（见本章之前），但会在输出的每行开头添加行号。\n\
  \n```bash\nnl place\ns1 Amsterdam2 Berlin3 Bern4 Cape Town\n```\n\n### wc\n`wc`\
  \ 命令是短语“word count”（单词计数）的缩写，用于统计输入行、单词和单个字符。除非另有说明，否则会打印所有三个值：\n\n```bash\nwc places\n\
  4 5 32 places\n```\n此外 `wc` 还提供了以下选项来限制输出：\n- `-l`: 输出行数，后接文件名\n- `-w`: 输出单词数，后接文件名\n\
  - `-c`: 输出字符数，后接文件名\n此示例显示了如何仅统计文件的行：\n\n```bash\nwc -l places\n4 places\n```\n\n\
  ### 7.3 用户与组\n这些命令处理各种操作，用于管理你 Linux 系统的用户和组。除非明确说明，否则这些命令可以作为普通用户运行。\n\n### whoami\n\
  `whoami` 命令按如下方式返回你的当前用户 ID：\n\n```bash\nwhoami\nuser\n```\n\n\n\n\n### users, who\
  \ 和 w\n\n`users`、`who` 和 `w` 命令显示当前登录到你的 Linux 系统的用户。`w` 命令扩展了 `who` 的输出，增加了运行时间（uptime）信息以及一个包含最后执行命令的列。相比之下，`users`\
  \ 仅以空格分隔的列表的形式在单行中输出用户名（见下图）。\n\n![Description: 00065.jpeg](img/rsrc1U5.jpg)\n\n\
  `who` 的单列从用户的登录名开始。输出后续是终端名称，其中“console”代表登录终端，而“pts/1”是第一个伪终端会话的缩写。最后两列包含登录时间和用户所在的主机，位于括号内（见下图）。\n\
  \n![Description: 00066.jpeg](img/rsrc1U6.jpg)\n\n`w` 的单列包含用户的登录名（标题为 `LOGIN`）、终端名称（标题为\
  \ `TTY`）、用户所在的主机名称（标题为 `FROM`）、登录时间（标题为 `LOGIN@`）、活动情况（空闲时间和 CPU 使用率，标题为 `IDLE`、`JCPU`\
  \ 和 `PCPU`）以及用户执行的最后命令（标题为 `WHAT`）（见下图）。\n\n![Description: 00067.jpeg](img/rsrc1U7.jpg)\n\
  \n### id 和 groups\n\n`id` 命令输出当前的用户和组信息（见下图）。从左到右，列分别显示用户 ID (`uid=1000(user)`)、组\
  \ ID (`gid=1000(group)`) 以及用户所属的组名。\n\n![Description: 00068.jpeg](img/rsrc1U8.jpg)\n\
  \n为了列出用户所属的所有组名，你也可以调用 `groups` 命令（见下图）。输出是空格分隔的组名列表。\n\n![Description: 00069.jpeg](img/rsrc1U9.jpg)\n\
  \n### passwd\n\n如第 4 章所述，Linux 系统至少有两个用户：一个管理员 root 用户和一个我们简称为 `user` 的普通用户。每个账户也都受密码保护。\n\
  \n要更改你的密码，请使用 Debian “passwd” 软件包中的 `passwd` 命令（参阅第 4 章关于如何安装额外软件的内容）。如下所示，首先输入当前密码，按回车键，输入新密码，按回车键确认，再次输入新密码并按回车键确认。\n\
  \n![Description: 00070.jpeg](img/rsrc1UA.jpg)\n\n作为普通用户，仅允许更改自己的密码。密码以哈希值的形式存储在配置文件\
  \ `/etc/shadow` 中。该文件的内容对管理员用户可见。下面的示例显示了如何借助 `grep` 命令（见本章前面的内容）提取用户“user”的信息。\n\
  \n![Description: 00071.jpeg](img/rsrc1UB.jpg)\n\n### chfn\n\n此命令同样来自 Debian “passwd”\
  \ 软件包，用于更改存储在系统文件 `/etc/passwd` 中的用户信息。在安装你的 Debian 系统期间，基础设置已经完成。要修改这些信息，你可以在交互模式下直接运行不带任何参数的\
  \ `chfn`，或者使用以下某一个或多个选项来调整某个特定值：\n\n- `-f` 或 `--full-name`：更改用户的全名\n- `-h` 或 `--home-phone`：更改用户的家庭电话\n\
  - `-r` 或 `--room`：更改用户的房间号\n- `-w` 或 `--work-phone`：更改用户的办公电话\n\n以下示例将家庭电话号码更改为\
  \ 135：\n\n```\n$ chfn -h 135Password:$ |\n```\n\n### chsh\n\n此命令（同样来自 Debian “passwd”\
  \ 软件包）更改你用于登录 Linux 系统的 shell 条目。同样，这些信息存储在文件 `/etc/passwd` 中。允许使用的 shell 受限于配置文件\
  \ `/etc/shells` 中的条目。`chsh` 的工作与 `chfn` 命令类似。在不带额外选项调用时，将使用交互方法（见下图）。\n\n![Description:\
  \ 00072.jpeg](img/rsrc1UC.jpg)\n\n`chsh` 接受选项 `-s`（`shell` 的缩写）以便在非交互模式下设置 shell。以下示例显示了相应的命令行调用：\n\
  \n```\n$ chsh -s /bin/bash$\n```\n\n要修改其他其他用户的 shell，请使用用户名作为参数调用 `chsh` 命令。注意，只有管理员才能为其他用户执行此操作。下一个示例显示了如何为用户“felix”操作。\n\
  \n```\n# chsh felixChanging the login shell for felixEnter the new value, or press\
  \ ENTER for the new valueLogin shell [/bin/bash]:# |\n```\n\n### su 和 sudo\n\n为了将角色从一个用户切换到另一个用户，你使用\
  \ `su` 命令。`su` 是“switch user”的缩写。在不带额外选项调用时，如下所示切换到 root 用户：\n\n```\n$ suPassword:#\
  \ |\n```\n\n作为管理员 root 用户工作意味着巨大的责任，并假设你确切知道自己在做什么。要以 root 以外的用户身份工作，如下所示使用所需的用户名调用\
  \ `su` 命令：\n\n```\n$ su felixPassword:$ |\n```\n\n`su` 命令会永久更改当前角色。要以管理员身份运行单条命令，请使用\
  \ `sudo` 命令。这需要安装 Debian “sudo” 软件包（参阅第 4 章关于安装额外软件的内容），并使用 `visudo` 命令将额外用户添加到配置文件\
  \ `/etc/sudoers` 中。这一步稍后解释。\n\n### adduser\n\n`adduser` 命令创建新的用户账户。下图显示了所需的信息。这包括\
  \ `/etc/passwd` 中的新条目，以及新组和主目录的创建。此外，来自 `/etc/skel` 的准备数据会被复制到之前创建的主目录中。之后，使用 `chsh`\
  \ 命令修改账户（见本章前面的内容）。\n\n![Description: 00073.jpeg](img/rsrc1UD.jpg)\n\n设置新用户后，`/etc/passwd`\
  \ 中的条目如下：\n\n![Description: 00074.jpeg](img/rsrc1UE.jpg)\n\n删除用户账户和修改用户账户通过 `deluser`\
  \ 和 `usermod` 命令完成。这些命令的用法将在以后解释。\n\n# 7.4 进程管理\n\n### ps\n此命令列出 Linux 系统的运行进程。下图显示了当前会话的进程，其中\
  \ `ps ax` 调用（见随后）列出了 Linux 系统中的所有进程。`ps` 命令有一系列选项，将在以后详细解释。\n\n![Description: 00075.jpeg](img/rsrc1UF.jpg)\n\
  ![Description: 00076.jpeg](img/rsrc1UG.jpg)\n\n### pgrep\n\n`pgrep` 是进程的 `grep`\
  \ 命令（见本章前面的内容）。该命令遍历当前运行的进程，并输出匹配给定模式的进程 ID。下图显示了两次调用。第一次调用请求 `pgrep` 搜索名称包含字符串模式“xterm”的进程，并仅输出进程\
  \ ID。第二次调用使用选项 `-l`（`--list-name` 的缩写）和 `-a`（`--list-full` 的缩写）来显示进程 ID 和对应的进程名。\n\
  \n![Description: 00077.jpeg](img/rsrc1UH.jpg)\n\n### kill\n此命令向进程发送特定信号。要终止此进程，使用\
  \ SIGTERM 信号。下一个示例显示如何结束进程 ID 为 12345 的进程。`kill` 命令需要进程 ID 才能正常工作。先使用 `ps` 或 `pgrep`\
  \ 获取相应的进程 ID（见本章前面的内容）。\n\n```\n$ kill 12345$\n```\n\n### killall\n此命令属于基础 Debian\
  \ 软件包“psmisc”（参阅第 4 章安装额外软件包）。`killall` 向所有匹配指定命令的进程发送信号。例如，命令\n\n```\nkillall firefox\n\
  ```\n\n\n\n\n向所有名为“firefox”的进程发送 `SIGTERM` 信号以终止进程。除其他选项外，`killall` 还允许以下参数：\n\n\
  - `-e`（`--exact` 的缩写）：要求精确匹配\n- `-I`（`--ignore-case` 的缩写）：进程名称不区分大小写\n- `-i`（`--interactive`\
  \ 的缩写）：在终止进程前交互式地确认\n- `-v`（`--verbose` 的缩写）：如果进程终止，则发送确认消息\n\n示例展示了如何结合 `pgrep`\
  \ 和 `killall` 两个命令。首先，使用 `pgrep` 获取进程 ID 以及进程的准确名称。其次，带有 `-i` 和 `-v` 两个选项调用 `killall`\
  \ 来终止所有该名称的进程。在杀死进程之前，`killall` 会要求你确认，之后会输出一条确认消息。\n\n![Description: 00078.jpeg](img/rsrc1UJ.jpg)\n\
  \n### pkill\n\n命令 `pkill` 和 `pgrep`（参见本章前面的内容）属于同一个软件包。虽然 `pgrep` 扫描进程列表并输出进程 ID，但\
  \ `pkill` 命令将向匹配给定模式的进程发送终止信号。为了终止所有“xterm”进程，请调用以下命令：\n\n```\n$ pkill xterm$\n\
  ```\n\n\n\n\n### top\n`top` 命令根据其活跃程度显示进程。最活跃的进程位于最上方，随后是活跃程度较低的进程。列表每秒更新一次。单列包含进程\
  \ ID（标题为 `PID`）、进程所有者的用户名（标题为 `USER`）、进程优先级（标题为 `PR`）、nice  own（标题为 `NI`）、虚拟内存使用量（标题为\
  \ `VIRT`）、预留内存（标题为 `RES`）、共享内存（标题为 `SHR`）、CPU 和内存使用百分比（标题为 `%CPU` 和 `%MEM`）、进程的运行时间（标题为\
  \ `TIME+`）以及用于调用进程的命令（标题为 `COMMAND`）。要退出 `top`，请按 `q` 键。\n\n![Description: 00079.jpeg](img/rsrc1UK.jpg)\n\
  \n### htop\n`htop` 是一个额外的软件包（请参考第 4 节安装额外软件包），它包含 `top` 更具交互性的版本（我们在上面提到过）。列的排列与\
  \ `top` 类似。使用导航键和功能键来选择、排序或删除进程。\n\n功能键如下：\n- `F1`: 显示帮助\n- `F2`: 配置 `htop`\n- `F3`:\
  \ 在进程列表中搜索\n- `F4`: 过滤终端输出\n- `F5`: 以进程树的形式显示进程\n- `F6`: 更改进程的排序\n- `F7`: 降低选中进程的\
  \ nice 级别\n- `F8`: 增加选中进程的 nice 级别\n- `F9`: 终止选中进程\n- `F10`: 退出程序\n\n![Description:\
  \ 00080.jpeg](img/rsrc1UM.jpg)\n\n# 7.5 网络与系统信息\n\n### uname\n`uname` 是“UNIX name”的缩写。该命令显示系统信息，例如\
