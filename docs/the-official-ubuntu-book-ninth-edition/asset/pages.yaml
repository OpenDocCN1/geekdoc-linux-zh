  md: 'Point-and-Click Xen

    One Xen-related project to point out is MIT’s open source XVM (not to be confused
    with Sun Microsystems’ xVM), which is a set of tools built on top of Debian that
    allows users to create and bring in Xen guests through a Web browser, complete
    with serial console redirection, sss access, and a variety of other goodies. MIT
    uses the system to offer point-and-click virtual machines to any MIT affiliate;
    the project home page is http://xvm.mit.edu.


    # Disk Replication


    We’ve discussed the role of RAID in protecting data integrity in the case of disk
    failures, but we didn’t answer the follow-up question: what happens when a machine
    fails? The answer depends entirely on your case, and giving a general prescription
    doesn’t make sense. If you’re Google, for instance, you have automated cluster
    management tools that notice a machine going down and don’t distribute work to
    it until a technician has dispatched to fix the machine. That’s Google’s infrastructure
    makes (except in pathological cases) no machine holds data that isn’t replicated
    elsewhere, so the failure of any one machine is ultimately irrelevant.


    If you don’t have Google’s untold thousands of servers on a deeply redundant infrastructure,
    you may consider a simpler approach: Replicate an entire hard drive to another
    computer, propagating changes in real time, just like RAID1 but over the network.


    This functionality is called Distributed Replicated Block Device (DRBD), and it
    isn’t limited to hard drives; it can replicate any block device you like. Ubuntu
    9.04 and newer ships with DRBD, and the user space utilities you need are in the
    drbd-utils package. For the full documentation, see the DRBD Web site at www.drbd.org.


    # Cloud Computing


    Cloud computing builds on the most interesting aspect of virtualization: you can
    easily create, pause, and tear down multiple virtual computers, all running on
    one real bare-metal machine. To the user, those virtual computers behave just
    like real computers.'
