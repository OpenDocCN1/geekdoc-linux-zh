  md: '# No-Cost Software


    The software available from the GNOME Software Center is free, in terms of the
    cost and the code that is available for people to view, modify, and edit. You
    pay nothing for this software, and it is completely legal for you to copy it,
    use it, share it, and so on.


    # Learning Terminology and Foundations


    Learning the meaning of a few terms will help you better understand how software
    gets installed on your machine as well as how the system works.


    +   - APT: Advanced Package Tool (APT) describes the entire system of online repositories
    and the parts that download and install them. The APT is not highly visible when
    using graphic interface—based systems like the GNOME Software Center, but it is
    very obvious when you are using command-line tools like apt-get (described in
    greater depth in Chapter 8). Whether you use a graphical interface or the command
    line to deal with Ubuntu software packages, APT is at work.


    +   - Repositories or software channels: In the Ubuntu world, these giant online
    warehouses of software are divided between official Ubuntu repositories and unofficial
    ones.


    +   - Packages: Applications are stored in packages that do not describe the program
    you want to install, but also tell your package manager what the program needs
    to run and how to safely install and uninstall it. This makes the process of dealing
    with software dependencies smooth and easy for end users.


    +   - Dependencies: Dependencies comprise the software that is needed as a foundation
    for other software to run. For example, APT is needed for the GNOME Software Center
    to run, because the APT takes care of many of the details behind the scenes.


    # Using Synaptic


    Synaptic is a powerful graphical tool for managing packages. It is not installed
    by default. While the GNOME Software Center deals with packages that contain applications,
    Synaptic deals with all packages, including ap-'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# Using Synaptic 107


    plications, system libraries, and other pieces of software. Changing the system
    on this level is more complicated but also allows you to exert more detailed control.
    For instance, you can choose to install a specific library if you need it for
    a program that is not available in a package format.


    What''s a Library?

    in this context, a library is a collection of software functions that may be useful
    to more than one program. This collection is put into a separate package that
    saves space by not forcing multiple programs to include the same code but instead
    refer to the library when a certain function is needed. It also makes updates
    easier, such as when security issue is fixed, because the programming code may
    be changed in one place while benefiting all programs that use the function. Libraries
    streamline support to be more efficient. But be careful: Installing unwanted libraries
    may cause some software failures.


    Synaptic may be installed from the GNOME Software Center and found by searching
    in the Dash for Synaptic Package Manager. Launch it and you will see the main
    window, as shown in Figure 4-5.


    What''s in a Name?

    Why not Synaptic? *Synaptic* is a play on words based on your brain''s synapses
    and the word APT.


    ![](img/81489f896cf4aa863894a21fbe4968b0_145_0.png)


    Figure 4-5 Synaptic main window'
