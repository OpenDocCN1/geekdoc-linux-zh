  md: 'The Community Council''s day-to-day work involves five major areas in Ubuntu.
    The first, and the most straightforward, is the maintenance of the Ubuntu Code
    of Conduct. The Community Council is the only body that can approve revisions
    to the code. Because the Community Council does not ask each member to "reagree"
    to the code when it is changed, each of these revisions must be fully within the
    spirit of the previous drafts.


    The second charge of the Community Council is the arbitration of disputes that
    cannot be handled within a particular team or that arise between teams. These
    are generally disputes about the Code of Conduct that may require clarification
    of a part of the Code or a description of whether any of the code was, in fact,
    violated by a particular action or behavior. However, the Community Council''s
    purport is not limited to handle disputes in any nontechnical situation. In most
    situations, the Community Council does not take action against individuals, but
    rather helps group members to agreement or consensus among themselves. If this
    fails, the Community Council can ask a maintainer or other member of the community
    to apologize and refrain from particular behavior or to leave the community. The
    Council promises that no one will be asked to leave without a substantial review
    and an opportunity to defend himself or herself.


    A third area of Council work is assisting teams with any blockers they may encounter
    in the running of them. This may include, but is not limited to, assisting with
    getting access to resources lost to a contributor stepping away, moving away blockers
    that the team may have in the community, and assisting with appointment of new
    leadership should the need arise. To this end, the Community Council works to
    meeting with key teams in the community each cycle during their regular meetings
    to see if they can assist the teams in any way.


    Fourth, the Community Council is ultimately responsible for approving and welcoming
    new members to the project, described in more depth in the upcoming subsection
    on membership.


    Finally, the Community Council is responsible for all community-related structures
    and processes. New types of teams, requirements for member-'
