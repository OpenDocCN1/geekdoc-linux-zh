  md: '# Introduction


    WELCOME TO The Official Ubuntu Book, Ninth Edition!


    In recent years, the Ubuntu operating system has taken the open source and IT
    world by storm. From out of nowhere, the Little Operating System That has blossomed
    into a full-featured desktop and server offering that has won over the hearts
    of users everywhere. Aside from the strong technical platform and impressive commitment
    to quality, Ubuntu also enjoys success because of its sprawling community of enthusiastic
    users who have helped to support, document, and test every millimeter of the Ubuntu
    landscape.


    In your hands you are holding the official, authorized guide to this impressive
    operating system. Each of the authors selected to work on this book has demonstrated
    a high level of technical competence, an unbridled commitment to Ubuntu, and the
    ability to share this knowledge in a simple and clear manner. These authors gathered
    together to create a book that offers a solid grounding to Ubuntu and explains
    how the many facets and features of Ubuntu work.


    # About This Book


    At the start of every book, on every bookshelf, in every shop, is a paragraph
    that sums up the intentions and aims for the book. We have one very simple, down-to-earth
    aim: to make the Ubuntu experience more pleasant for users. The Ubuntu developers
    and community have gone to great lengths to produce an easy-to-use, functional,
    and flexible operating system for doing, browsing, and creating all kinds of interesting
    things. This book augments that effort. With such an integrated and flexible operating
    system, this guide acts as a tour de force for the many things you can do with
    Ubuntu.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# The Scope of the Book


    With so much to cover, we had our work cut out to to write a book that could cover
    the system in sufficient detail. However, if we were to write in depth about every
    possible feature in Ubuntu, you would need to buy a new bookcase to store the
    sheer amount of content.


    Part of the challenge in creating The Official Ubuntu Book was selecting the topics
    and content that can be covered within a reasonably sized book. We have identified
    the most essential content and written only about it. These chosen topics not
    only cover installation, use of the desktop, applications, multimedia, system
    administration, and software management, but also include a discussion of the
    community, online resources, and the philosophy behind Ubuntu and open source
    software, and expanded our discussion of projects related to Ubuntu that will
    be of interest to you. We believe this book provides an ideal one-stop shop for
    getting started with Ubuntu.


    # The Menu


    Here is a short introduction to each chapter and what it covers.


    +   - Chapter 1: The Ubuntu Story. This spirited introduction describes the Ubuntu
    project, its distribution, its development processes, and some of the history
    that made it all possible.


    +   - Chapter 2: Installing Ubuntu. We walk through the installation process one
    step at a time to clearly describe how anyone may begin using Ubuntu on their
    own computer.


    +   - Chapter 3: Getting Started with Ubuntu. This is an informative and enjoyable
    introductory tour of Ubuntu, and the reader''s first introduction to the more
    practical content of the book.


    +   - Chapter 4: Finding and Installing Ubuntu Applications. Here you will learn
    about the vast contents of the Ubuntu software repositories and discover how to
    take advantage of them. Several examples of useful software that is not installed
    by default are highlighted.'
