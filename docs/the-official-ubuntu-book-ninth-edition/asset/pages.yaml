    Most of the time it is possible to add or configure a printer easily and quickly.
    Even better, printers are sometimes configured automatically when plugged into
    the system. The one caveat is not all printer manufacturers provide Linux drivers
    for their devices. While the Linux community works very hard to write drivers,
    the newest printers do not have adequate software to interact with Linux. Most
    printer models that are older than 6 or 9 months work well, though.


    You can check before buying a printer to see what other people have experienced
