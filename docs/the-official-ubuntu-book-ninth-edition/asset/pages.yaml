  md: 'documentation for a particular problem already exists. When it does, users
    would be wise to choose to improve or augment existing documentation rather than
    write a new document. Similarly, users can make meaningful contributions by reading
    through existing documentation and fixing factual, technical, stylistic, spelling,
    and grammar errors. Users who spend a large amount of time working on documentation
    may, with time, also want to join the Ubuntu Documentation Team, which can help
    organize and co-ordinate this work in terms of Ubuntu documentation goals.


    # Translation and Localization


    The discussion of LoCos should have already made clear that translation is a great
    way that anyone with a firm understanding of English and another language can
    contribute to the Ubuntu community. Translation tools (described in Chapter 9)
    allow users to translate as little as a single string or as much as an entire
    application. Through its easy interface and Web-based nature, translation provides
    a low-barrier to contribution. Serious translators should join a local community
    team and the ubuntu-translators mailing list so that they can stay in touch with
    other Ubuntu translators.


    # Quality Assurance and Bugs


    Quality assurance (QA) is something for which many companies hire engineers. In
    Ubuntu, the Development Team relies on the Canonical QA team and the community
    to test software before it is released to let developers know about problems so
    that the bugs can be squashed by the vast majority of users ever see. Users can
    contribute to testing software in a variety of ways, from testing the latest builds
    of ISOs for an upcoming-release, to testing packages individually before updates
    are released to the wider community.


    Trackers for ISOs and packages are available through the Ubuntu Quality team.
    When users helping out with QA finds bugs, they should report them in the Ubuntu
    bug-tracking system. They can also help by “triaging” bugs, closing or merging
    duplicates, or verifying bugs and adding information to a bug’s description. If
    you intend to be involved in QA, you should subscribe to the ubuntu-devel-announce
    mailing list'
  merge: -1
  pgno: 341
- img_proc: true
  md: 'and the ubuntu-quality mailing list, consider monitoring ubuntu-devel,

    and join the #ubuntu-quality IRC channel on irc.freeden.net.


    # Programming and Packaging


    The final way users can contribute to the Ubuntu community

    through the production of code. Because Ubuntu is free and open source

    software, users can get access to every piece of software that Ubuntu sup-

    ports. This allows users to package additional software for inclusion in

    Ubuntu, to fix bugs, and to add features. Developers, people testing

    software, should subscribe to the ubuntu-devel-announce mailing list and

    consider monitoring ubuntu-devel, too. The best way to begin

    making contributions is then through the MOTU team as a MOTU hope-

    ful, as described earlier. Users can also look through a list of specifications

    to find a project they find personally interesting.


    With the rise of cloud-based software, infrastructure packaging is also

    available in the form of Juju Charms (https://jujucharms.com/). Juju

    Charms use the Juju service to specify and orchestrate dependencies and

    relationships among specific services that run on a server. For instance,

    piece of blogging software may require a Web server and a database;

    be defined in Juju and launched on separate servers or with additional

    features, thereby making them highly available.


    # Summary


    Ubuntu is a vibrant and diverse community that is active around the world

    and in many languages. Its activities happen primarily online in a variety of

    virtual venues, including mailing lists, IRC, Web forums, wikis, social me-

    stream updates, developer and cloud portals, as well as two special

    Web-based community portals known as The Fridge and Planet Ubuntu.

    Ubuntu complements this virtual activity with real-life meetings and con-

    ferences. The Ubuntu community is broken down into a variety of teams

    and processes. At the top of this government structure is the Ubuntu Com-

    unity Council, the Technical Board, and SABDFL Mark Shuttleworth.

    Through a variety of ways, this community is designed to facilitate contri-

    butions. Ultimately, these contributions are recognized through a

    process culminating in official project membership and enfranchisement.'
