  md: 'Getting Involved 301


    The process to become a Member is relatively straightforward and documented at
    https://wiki.ubuntu.com/Membership. Most important, it requires that users document
    their contributions on a wiki page that includes links to code, mailing list messages,
    specific forms of documentation that clearly demonstrate their involvement, and/or
    relevant material. Membership applications also need to include testimonials on
    work and involvement in Ubuntu.


    # Getting Involved


    Users can participate in the Ubuntu community on a variety of levels and in a
    multitude of ways. The following subsections, adapted largely from a page with
    links to relevant resources on the Ubuntu Web site (http://community.ubuntu.com/contribute),
    provides a good list of ways in which people can get a running start in the Ubuntu
    community.


    # Ubuntu Online Events


    A series of video-based events are regularly organized by the Ubuntu On Air!,
    which often include interviews and question-and-answer sessions with key members
    of the community. Details about current and upcoming Ubuntu on Air! events can
    be found at http://ubuntuonair.com.


    # Advocacy


    The easiest way for someone to contribute to the Ubuntu community is by simply
    telling others about Ubuntu. Advocacy frequently occurs in a variety of ways.
    One good method involves joining a LoCo team. LoCos, described earlier in this
    chapter, provide a method through which you can get involved in Ubuntu activities.
    If users do not have a LoCo and do not have the critical mass of users to start
    one, they might help build support by giving a talk about Ubuntu to a local Linux
    Group or other technical group. Through these and other means, advocacy provide
    a great way to spread the word about Ubuntu and offers a low-barrier opportunity
    to make contributions to the community. Many community members share resources
    such as flyers, posters, CD covers, and banners on the Spread Ubuntu Web site
    (http://spreadubuntu.org). Spread Ubuntu is an official Ubuntu resource that is
    community driven'
