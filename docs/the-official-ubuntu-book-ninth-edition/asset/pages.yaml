    # Creating Graphics with GIMP and Inkscape


    GIMP

    Package name: gimp

    Windows equivalent: Adobe Photoshop or GIMP


    The GNU Image Manipulation Program, affectionately known as GIMP to its friends,
    is a powerful graphics package. GIMP provides a comprehensive range of functionality
    for creating different types of graphics. It includes tools for selecting, drawing,
    paths, masks, filters, and more. It also includes range of templates for different
    types of media such as Web banners, different paper sizes, video frames, CD covers,
    floppy disk labels, and even toilet paper.


    > In early versions of Ubuntu, GIMP was installed by default, but it has not been
    installed in this way for several years, mainly because it is a large package
    with a specific audience and room was desired for more general-use packages.


    GIMP has a separate set of toolbars that appear above the application''s workspace
    when the application is opened. This can be a little confusing for first users—especially
    those used to Photoshop. If you want the toolbars to be docked in the workspace,
    you can go to Windows > Single Window Mode. This mode can help you become more
    familiar with the GIMP tools. To get started, let''s run through a simple session
    in GIMP.


