    We''ve come a long way—and we''re still only getting started.


    # Free Software, Open Source, and GNU/Linux


    While thousands of individuals have contributed in some form to Ubuntu, the project
    has succeeded only through the efforts of many thousands more who have indirectly
    laid the technical, social, and economic groundwork for Ubuntu’s success. While
    introductions to free software, open source, and GNU/Linux can be found in many
    other places, no introduction to Ubuntu is complete without a brief discussion
    of these concepts and the people and history behind them. It is around these concepts
    and within these communities that Ubuntu was motivated and born. Ultimately, it
    is through these ideas that it is sustained.'
