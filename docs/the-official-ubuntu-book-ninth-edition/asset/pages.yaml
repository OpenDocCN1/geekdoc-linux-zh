  md: '# How the Vision Became Ubuntu


    Ubuntu is a concept and a term from several South African languages, including
    Zulu and Xhosa. It refers to a South African ideology or ethic that, while difficult
    to express in English, might roughly be translated as “humanity toward others”
    or “I am what I am because of who we are all.” Others have described Ubuntu as
    “the belief in a universal bond of sharing that connects all humanity.” The famous
    South African human rights champion Desmond Tutu explained Ubuntu in this way:


    A person with Ubuntu is open and available to others, affirming of others, does
    not feel threatened that others are good and, for he she has a proper self-assurance
    that comes from knowing that he she belongs in a greater whole and is diminished
    when others are humiliated or diminished, when others are tortured or oppressed.


    Ubuntu played an important role as a founding principle in post-apartheid South
    Africa and remains a concept familiar to most South Africans today.


    Shuttleworth liked Ubuntu as a name for the new project for several reasons. First,
    it is a South African concept. While many of the people who work on Ubuntu are
    not from South Africa, the roots of the project are, and Shuttleworth wanted to
    choose a name that represented this origin. Second, the project emphasizes relationships
    with others and provides a framework for a profound sense of community and sharing—exactly
    the attitudes of sharing, community, and collaboration that are at the core of
    free software. The term represented the free of software that the team wanted
    to share with the world. Third, the idea of personal relationships built on mutual
    respect and connections describes the fundamental ground rules for the highly
    functional community that the Ubuntu team wanted to build. Ubuntu was a term that
    encapsulated the project it came from, where the project was going, and how the
    project planned to get there. The name was perfect. It stuck.


    # Beyond the Vision


    To pay developers to work on Ubuntu full time, Shuttleworth needed a company to
    employ them. He wanted to pick some of the best people for the jobs from within
    the global free and open source communities. These communities, inconveniently
    for Shuttleworth, know no national and'
