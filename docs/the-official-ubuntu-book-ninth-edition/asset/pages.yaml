    # The Vision


    In April 2004, Mark Shuttleworth brought together a dozen developers from the
    Debian, GNOME, and GNU Arch projects to brainstorm. Shuttleworth asked the developers
    if a better type of operating system (OS) was possible. Their answer was “Yes.”
    He then asked them what this OS would look like. Finally, he asked them to describe
    the community that would build an OS. That group worked with Shuttleworth to come
    up with answers to these questions, and then they decided to try to make the answers
    a reality. The group named itself the Warthogs and gave itself a six-month deadline
    to build a proof-of-concept OS. The developers nicknamed their first release the
    Warty Ubuntu, making the reasonable assumption that their first product would
    have warts. They then got to business.


    It’s fulfilling, particularly for those of us who were privileged to be among
    those early Warthogs, to see the progress made by this project over the years.
    We had a strong beginning, far from being warty, the Warty warped surpassed our
    most optimistic expectations and *everyone’s* predictions. Within six months,
    Ubuntu was in the number 1 spot on several popularity rankings of GNU/Linux distributions.
    Ubuntu has demonstrated the most explosive growth of any GNU/Linux distribution
    in memory and had one of the most impressive first years and continued growth
    of any free or open source software project in history.


    It is staggering to think that after few years, *millions* of individuals are
    using Ubuntu. As many thousands of these users give back to the Ubuntu community
    by developing documentation, translation, and code, Ubuntu improves every day.
    As many thousands of these users contribute to a thriving advocacy and support
    community—both online and in their local communities—Ubuntu’s growth remains unchecked.
    Ubuntu sub-'
