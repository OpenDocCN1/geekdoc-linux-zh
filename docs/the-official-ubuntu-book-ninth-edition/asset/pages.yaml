- img_proc: true
  md: 'Chapter 1 ■ The Ubuntu Story


    # Free Software and GNU


    In a series of events that have almost become legend through constant repetition,
    Richard M. Stallman created the concept of free software in 1983. Stallman grew
    up with computers in the 1960s and 1970s, when computer users purchased very large
    and extremely mainframe computers, which were then shared among large numbers
    of programmers. Software was, for the most part, seen as an add-on to the hardware,
    and every user had the ability and the right to modify or rewrite the software
    on his or her computer. As computers became cheaper and more numerous in the late
    1970s, producers of software began to see value in the software itself. Producers
    of software argued that their software could be copyrighted and was a form of
    intellectual property much like a music recording, a film, or a book''s text.
    They began to distribute their software under licenses and that restricted its
    users'' abilities to use, redistribute, or modify the code. By the early 1980s,
    restrictive software licenses had become the norm.


    Stallman, a programmer at MIT''s Artificial Intelligence Laboratory, became increasingly
    concerned with what he saw as a dangerous loss of the freedoms that software users
    and developers had previously enjoyed. He was concerned with computer users''
    ability to be good neighbors and members of what he thought was an ethical and
    efficient computer-user community. To fight against this negative tide, Stallman
    articulated in his words, "free software." He defined free software as software
    that had the following four characteristics—labeled as freedoms 0 through 3 instead
    of 4 as a nod to computer programming tradition and a bit of inside joke:


    +   - The freedom to run the program for any purpose (freedom 0)

    - The freedom to study how the program works and adapt it to your needs (freedom
    1)

    - The freedom to redistribute copies so you can help your neighbor (freedom 2)

    - The freedom to improve the program and release your improvements to the public
    so that the whole community benefits (freedom 3)'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'Free Software, Open Source, and GNU/Linux 5


    Access to source-code—the human-readable and modifiable blueprints of any piece
    of software, which can be distinguished from the computer-readable version of
    the code that most software is distributed as—is a prerequisite to freedoms 1
    and 3. In addition to releasing this definition of free software, Stallman created
    a project with the goal of creating a completely free OS to replace the then-popular
    UNIX. In 1984, Stallman announced this project and called it GNU—also in the form
    of common programmer humor, a recursive acronym that stands for “GNU’s Not UNIX.


    # Linux


    By the 1990s, Stallman and a collection of other programmers had developed a near-complete
    OS that could be freely shared. They were, however, missing a final essential
    piece in the form of a kernel—a complex system command processor that lies at
    the center of any OS. In 1991, Linus Torvalds wrote an early version of just such
    a kernel, released under a free license, and called it Linux. Torvalds’s kernel
    was paired with the GNU project’s development tools and OS and with the graphical
    windowing system called X. With this coupling, a completely free OS was born—free
    both in terms of price and Stallman’s terms of freedom.


    All systems referred to Linux today are, in fact, built on the work of this collaboration.
    Technically, the term Linux refers only to the kernel. Many programmers and contributors
    to GNU, including Stallman, argue emphatically that the full OS should be referred
    to as GNU/Linux to give credit not only to Linux but also to the GNU project,
    and to highlight GNU’s goals of spreading freedom—goals not necessarily shared
    by Linus Torvalds. Many others find this cumbersome and prefer calling the system
    simply Linux. Yet others, such as those working on the Ubuntu project, attempt
    to avoid the controversy altogether referring to GNU/Linux only by using their
    own project’s name.


    # Open Source


    Disagreements over labeling did not end with discussions about the naming of the
    combination of GNU and Linux. In fact, as the list of contributors to GNU and
    Linux grew, a vibrant world of new free software projects sprouted'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'up, facilitated in part by growing access to the Internet. As this community
    grew and diversified, a number of people began to notice an unintentional side
    effect of Stallman''s free software. Because free software was built in an open
    way, anyone could contribute to software by looking through the code, finding
    bugs, and fixing them. Because software ended up being examined by larger numbers
    of programmers, free software was higher in quality, performed better, and offered
    more features than similar software developed through proprietary development
    mechanisms. It turned out that in many situations, the development model behind
    free software was inherently better than proprietary alternatives.


    As the computer and information technology industry began to move into the dot-com
    boom, one group of free software developers and leaders, spearheaded by two free
    software developers and advocates—Eric S. Raymond and Bruce Perens—saw the important
    business proposition offered by a model that could harness volunteer labor or
    interbusiness collaboration and create intrinsically better software. However,
    they worried that the term free software was problematic for at least two reasons.
    First, it was highly ambiguous—the English word free means no gratis, or at no
    cost (e.g., free as in beer), and liberated in the sense of freedom (e.g., as
    in free speech). Second, there was a feeling, articulated most by Raymond, that
    all this talk of freedom was scaring off the very business executives and decision
    makers who the free software needed to impress if it was to succeed.


    To tackle both of these problems, this group coined a new phrase—open source—and
    created a new organization called the Open Source Initiative. The group set at
    its core a definition of open source software that overlapped completely and exclusively
    with both Stallman''s four-part definition of free software and with other community
    definitions that were also based on Stallman''s.


    One useful way to understand the split between the free software and open source
    movements is to think of it as the opposite of a schism. In religious schisms,
    churches separate and do not work or worship together because of relatively small
    differences in belief, interpretation, or motivation. For example, most contemporary
    forms of Protestant Christianity'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'agree on almost everything but have separated over some small but irreconcilable
    differences. However, in the case of the free software and open source movements,
    the two groups have fundamental disagreements about their motivation and beliefs.
    while the other is focused on pragmatics. Free software is most accurately described
    as a social movement, whereas open source is a development methodology. However,
    the two groups have no trouble working on projects in hand.


    In terms of the motivations and goals, open source and free software diverge.
    Yet in terms of the software, the projects, and the licenses they use, they are
    completely anonymous. While people identify with either group see the two movements
    as being at odds, the Ubuntu project see no conflict between the two ideologies.
    People in the Ubuntu project identify with either group and often with both. In
    this book, we may switch back and forth between the terms as different projects,
    and many people in the Ubuntu community identify more strongly with one term or
    the other. For the purposes of this book, though, each term should be read as
    implying the other unless it is stated otherwise.


    # How the Vision Became Ubuntu


    There was a time when writing a history of Ubuntu might have seemed premature;
    however, that is no longer the case, as the last several years have been busy
    for Ubuntu. With its explosive growth, it is difficult for those involved most
    closely with the project to track and record some of the high points. Importantly,
    there are some key figures whose history must be given to fully understand Ubuntu.
    This brief summary provides of the high points of Ubuntu’s history to date and
    the necessary background knowledge to understand where Ubuntu comes from.


    # Mark Shuttleworth


    No history of Ubuntu can call itself complete without a history of Mark Shuttleworth.
    Shuttleworth is, undeniably, the most visible and important person in the Ubuntu
    world. More important from the point of view of history, Shuttleworth is also
    the originator and initiator of the project; he'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# Chapter 1 ■ The Ubuntu Story


    made the snowball that would eventually roll on and grow to become the Ubuntu
    project.


    Shuttleworth was born in 1973 in Welkom, Free State, in South Africa. He attended
    Diocesan College and obtained a business science degree in finance and information
    systems at the University of Cape Town. During this period, he was an avid computer
    hobbyist and became involved with the free and open source software community.
    He was at least marginally involved in both the Apache project and the Debian
    project, and the first person to upload the Apache Web server, perhaps the single
    most important piece of server software on GNU/Linux platforms, in the Debian
    project''s archives.


    Seeing an opportunity in the early days of the Web, Shuttleworth founded a certificate
    authority and Internet security company Thawte in his garage. Over the course
    of several years, he built Thawte to the second certificate authority on the Internet,
    trailing only the security behem VerSign. Throughout this period, Thawte''s products
    and services were built and almost entirely from free and open source software.
    In 1999, Shuttleworth sold Thawte to VerSign for an undisclosed amount that reached
    into the hundreds of millions in U.S. dollars.


    With his fortune made at a young age, Shuttleworth might have enjoyed a life of
    leisure—and he probably considered it. Instead, he decided to pursue his lifelong
    dream of space travel. After paying approximately US20 million to the Russian
    space program and devoting nearly a year to preparation, including learning Russian
    and spending seven months training in Star City, Russia, Shuttleworth realized
    his dream as a civilian cosmonaut aboard the Soyuz TM-34 mission. On this mission,
    Shuttleworth spent two days on the Soyuz rocket and eight days on the International
    Space Station, where he participated in experiments related to AIDS and genome
    research. In early May 2002, Shuttleworth returned to Earth.


    In addition to engaging in space exploration and an only slightly less impressive
    journey to Antarctica, Shuttleworth has played an active role as both a philanthropist
    and a venture capitalist. In 2001, Shuttleworth founded The Shuttleworth Foundation
    (TSF), a nonprofit organization based in South Africa. The foundation was chartered
    to fund, develop, and drive'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# How the Vision Became Ubuntu


    social innovation in the field of education. Of course, the means by which TSF
    attempts to achieve these goals frequently involve free software. Through these
    projects, the organization has been one of the most visible proponents of free
    and open source software in South Africa and the world. In the venture capital
    area, Shuttleworth worked to foster research, development, and entrepreneurship
    in South Africa with strategic injections of cash into start-ups through a new
    venture capital firm HBD, an acronym for “Here Be Dragons.” During this period,
    Shuttleworth was busy brainstorming his next big project—the project that would
    become Ubuntu.


    # The Warthogs


    There has been no lack of projects attempting to wrap GNU, Linux, and other pieces
    of free and open source software into a neat, workable, user-friendly package.
    Mark Shuttleworth, like many other people, believed the philosophical and pragmatic
    benefits offered by free software put it on a course destined for success. While
    each had its strengths, the none of the offerings was particularly impressive
    as a whole. Something was missing from each version. Shuttleworth saw this as
    an opportunity. If someone could build the great free software distribution that
    helped push GNU/Linux into the mainstream, he would occupy a position of strategic
    importance.


    Shuttleworth, like many other technically inclined people, was a huge fan of the
    Debian project (discussed in depth later in this chapter). However, many things
    about Debian did not fit with Shuttleworth''s vision of an ideal OS. For a period
    of time, Shuttleworth considered the possibility of running for Debian project
    leader as a means of reforming the Debian project from within. With time, though,
    it became clear that the best way to bring GNU/Linux into the mainstream would
    not be from within the Debian project, which in many situations had very good
    reasons for being the way it was. Instead, Shuttleworth would create a new project
    that worked in symbiosis with Debian to build a new, better GNU/Linux system.


    To kick off this project, Shuttleworth invited a dozen so free and open source
    software developers he knew and respected to his flat in London in April 2004.
    It was in this meeting (alluded to the first paragraphs of this'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'introduction) that the groundwork for the Ubuntu project was laid. By that
    point, many of those individuals involved were excited about the possibility of
    the project. During the London meeting, the members of the team—which would time
    grow into the core Ubuntu team—brainstormed a large list of the things that they
    would want to see in their ideal OS. That list is now a familiar list of features
    to most Ubuntu users. Many of these traits are covered in more depth later in
    this chapter. The group wanted


    +   - Predictable and frequent release cycles


    +   - A strong focus on localization and accessibility


    +   - A strong focus on ease of use and user-friendliness on the desktop


    +   - A strong focus on Python as the single programming language through which
    the entire system could be built and expanded


    +   - A community-driven approach that worked with existing software projects
    and a method by which the groups could give back as they went, not just at the
    time of release


    +   - A new set of tools designed around the process of building distribution
    that allowed developers to work within an ecosystem of different projects and
    that allowed users to give back in whatever way they could


    There was consensus among the group that actions speak louder than words, so there
    were no public announcements or press releases. Instead, the group set a deadline
    for itself—six months in the future. Shuttle agreed to finance the work and pay
    the developers full-time salaries to work on the project. After six months, they
    would both announce their project and reveal the first product of their work.
    They made a list of goals they wanted to achieve by the deadline, and the individuals
    present took on tasks. Collectively, they called themselves the Warthogs.


    # What Does Ubuntu Mean?


    At this point, the Warthogs had a great team, a set of goals, and a decent idea
