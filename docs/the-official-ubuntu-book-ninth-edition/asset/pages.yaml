  md: '# Encrypted Swap and Remote Login


    If you use a swap partition, protecting your home directory isn''t enough; sensitive
    data get swapped out to disk in the clear. The solution is to use encrypted swap,
    which you manually enable with the ecryptfs-setup command, but this will presently
    take away your computer''s ability to enter the hibernate power-saving mode. Swap
    mode is unaffected.


    Note that encrypting your home directory makes all the data in it, including special
    directories such as ssh, unavailable until you log in. If you''re logging into
    a machine where your home directory is encrypted and hasn''t been unlocked, and
    the machine only owns ssh public key authentication, there is no way for the system
    to control authorized keys file, and you''re locked out. You can fix this by physically
    logging in, mounting your encrypted home directory with ecryptfs-umount-private,
    creating a directory in your "underlying" home directory left by ecryptfs. Stick
    your public keys into an authorized_keys file under ~/.ssh directory as normal,
    and you will be able to log remotely, at which point you can use ecryptfs-mount-private
    to enter your password and unlock your actual home directory.


