  md: '# What Is a Distribution?


    It’s clear to most people that Ubuntu is an OS. The full story is a little more
    complex. Ubuntu is what is called a distribution of GNU/Linux—a distro for short.
    Understanding exactly what means requires, once again, a little bit of history.
    In the early days of GNU and Linux, users needed a great deal of technical knowledge;
    only geeks needed to apply. There were no Linux operating systems in the sense
    that we usually use the term; there was no single CD or set of disks that one
    could use to install Ubuntu. Instead, the software composed of dozens even hundreds
    of individual programs, each built differently by a different individual, and
    each distributed separately. Installing each of the necessary applications would
    be incredibly time consuming at best. In many cases, incompatibilities and the
    technical tricky necessary to install software made a GNU/Linux system on a hard
    disk prohibitively difficult. A great deal of knowledge of configuration and programming
    was necessary to get a system up and running. As a result, very few people who
    were not programmers the early GNU/Linux systems.


    Early distributions projects that collected all of the necessary pieces of software
    from all of the different places and put them together in an easier-to-install
    form with the most basic configuration already done. These distributions aimed
    to making GNU/Linux more convenient and to bring it to larger groups of users.
    Today, almost no one uses GNU/Linux without using a distribution. As a result,
    distribution names are well known. Ubuntu is one such project; other distros include
    Red Hat and Fedora, SUSE, Gentoo, and, of course, Debian.


    Most distributions contain a similar collection of software. For example, they
    all contain most the core pieces of GNU and a Linux kernel. Almost all contain
    the X Window System and a set of applications on top of it that may include a
    Web browser, a desktop environment, and an office suite. While distributions started
    distributing out only the core pieces of the OS, they have grown to include an
    increasingly wide array of applications as well. A modern distribution includes
    all of the software that “comes with an OS”—that is, several CDs or DVDs containing
    anything that most users want and that the distribution is legally allowed to
    distribute.'
