  md: '# The Mythical Parity Drive


    TIP


    If you lose 50GB drives in a RAID 5 array, the array''s total usable size will
    be 800GB, or that of four drives. This makes it easy to mistakenly believe that
    a RAID 5 array "sacrifices" one of the drives for maintaining redundancy and parity,
    but this is not the case. Through some neat mathematics of polynomial coefficients
    over Galois fields, the actual parity information is striped across all drives
    drives, allowing any single drive to fail without compromising the data. Don''t
    worry, though. We won''t quiz you on the math.


