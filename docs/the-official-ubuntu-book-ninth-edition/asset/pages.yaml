  md: '# Ubuntu Community Web Site


    The Ubuntu Community Web site (http://community.ubuntu.com) is the main portal
    for learning about the Ubuntu community. This site provides links that explain
    how you can contribute to various parts of the project. Areas for collaboration
    include current programs in the community is participating, such as the Google
    Summer of Code. The Web site shares details about specific areas in which you
