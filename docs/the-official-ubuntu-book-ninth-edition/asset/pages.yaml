    # The Story of RAID


    If you''ve got only one hard drive in your server, free to skip ahead. Otherwise,
    let''s talk about putting those extra drives to use. The acronym RAID stands for
    redundant array of inexpensive disks, although if you''re a businessperson, you
    can substitute the word “independent” for “ineexpensive”. We forgive you. And
    if you''re in France, RAID is short for “recherche assistance intervention dissuasion,”
    which is an elite command unit of the National Police—but if that''s the RAID
    you need, you''re reading the wrong book. We think RAID is just a really awesome
    idea for data: when dealing with your information, it provides extra speed, fault
    tolerance, or both.


    At its core, RAID is just a way to replicate the same information across multiple
    physical drives. The process can be set up in a number of ways,'
