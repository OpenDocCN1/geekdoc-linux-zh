    # Virtualization


    If there''s been one buzzword filling the server space for the past couple

    years, it''s virtualization. In August 2007, a virtualization company called

    VMWare raised about $1 billion in its initial public offering, and the term

    "virtualization" finally went supernova, spilling from the technology realm

    to the financial mainstream, and soon to CIOs and technology manag-

    ersers everywhere.'
