  md: '![](img/81489f896cf4aa863894a21fbe4968b0_309_0.png)


    As these types of Ubuntu-based devices continue to reach the market and developers
    considering using Snappy Ubuntu Core for a base, it bears noting that one of the
    major advantages of devices using Snappy Ubuntu Core is the use of the same operating
    system image across all devices. Every time Canonical puts out a new version of
    the operating system, any of those devices could be updated to use it. Given headlines
    about security vulnerabilities and the number of out-of-date and insecure IoT
    devices proliferating in the wild, this consistency is a valuable asset to anyone
    seeking to develop and run a device securely.


    # The Cloud


    Snappy Ubuntu Core is also available for servers running in the cloud. With a
    focus on containers, its slim initial image and transactional updates allow for
    a complementary solution for these non-local resources. Cloud servers tend to
    be ephemeral, easily replaced by identical servers, and readily scaled up and
    down as demand dictates. The small size of Snappy Ubuntu Core lends itself well
    to this environment and has the potential to make automation based on these cloud
    images even easier. The diff-style approach, which relies on incremental updates
    of packages rather than full downloads of packages, also helps with the speed
    of updates to deployments.'
