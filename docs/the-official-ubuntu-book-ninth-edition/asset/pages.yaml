  md: '# aptitude


    Around the highest levels of the package management stack hangs aptitude, a neat,
    colorful textual front end that can be used interchangeably with apt-get. We won''t
    go into detail about aptitude use here; plenty of information is available from
    the system manual pages and the online aptitude help system (if you launch it
    as aptitude from the shell). It''s worth mentioning, though, one of the chief
    reasons some system administrators prefer aptitude over apt-get is its better
    handling of so-called orphan packages. Orphan packages are packages that were
    installed as a dependency of another package that have since been removed, leaving
    the orphan installed for no good reason. apt-get provides automatic way to deal
    with orphans, instead relegating the task to the deorphan tool, which you can
    install from the archive. By contrast, aptitude will remove orphan packages automatically.


    # Tips and Tricks


    Congratulations. If you''ve gotten this far, you''re familiar with most aspects
    of effectively dealing with packages on your Ubuntu server. Before we move on
    to other topics, though, we want to present a few odds and ends that will probably
    come in handy to you at one point or another.


    Listing Files Owned by a Package Sometimes it''s really useful to see which files
    on your system belong to a specific package—say, cron. dpkg to the rescue:


    ```

    $ dpkg -L cron

    ```


    Be careful, though, as dpkg -L output might contain directories that aren''t exclusively
    owned by this package but are shared with others.


    Finding Which Package Owns a File The reverse of the previous operation is just
    as simple:


    ```

    $ dpkg -S /etc/crontab

    cron: /etc/crontab

    ```


    The one-line output tells us the name of the owner package on the left.'
