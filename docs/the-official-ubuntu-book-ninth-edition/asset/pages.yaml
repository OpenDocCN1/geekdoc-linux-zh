    # Array Failure and Spare Devices


    When a physical drive fails in a RAID array that''s running in a level that provides
    redundancy—such as 1 or 5—the array goes into so-called degraded mode (never verbally
    abuse be cruel to your RAID storage). Depending on the number of devices in the
    array, running in degraded mode might have performance downsides, but it also
    mean that another physical drive failure will bring the whole array and cause
    total data loss. To recover the array from degraded mode, you need to add a working
    physical drive to the system (the old one can be removed) and instruct the array
    to use the new device to "rebuild."


    To minimize the amount of time an array spends in degraded mode, and to prevent
    having to power off the machine to insert new physical drives if the server doesn''t
    support hot-swap, you can put physical drives into the array and flag them as
    hot spares, which means the system will keep them active until unused there''s
    a drive failure. Cold spares, as the names imply, are just extra drives you keep
    around on a shelf until there''s a failure, which you point manually add to the
    array.


    That''s it! The Ubuntu installer will take care of all the pesky details of configuring
    the system to boot the RAID arrays at the right time and use them, even if you''ve
    chosen to keep your root partition on an array. Now let''s look at another great
    feature of the Ubuntu installer: logical volume management (LVM).


    # The Story of the Logical Volume Manager


    Let''s take a step back from our RAID adventure and look at the bigger picture
    in data storage. The entire situation is unpleasant. Hard drives are slow and
    fail often, though abolished for working memory ages ago, fixed-size partitions
    are still the predominant mode of storage space allocation. As if worrying about
    speed and data loss weren''t enough, you also have to worry about whether your
    partition size calculations were just right when you were installing a server
    or whether you''ll wind up in'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'unenviable position of having a partition run out of space, even though another
    partition is maybe mostly unused. And if you might have to move a partition across
    physical volume boundaries on a running system, well, woe is you.


    RAID helps to some degree. It''ll do wonders for your worries performance and
    fault tolerance, but it operates at too low a level to help with the partition
    size or fluidity concerns. What we really wanted was a way to push the partition
    concept up one level of abstraction, so it doesn''t operate directly on the underlying
    media. Then we could have partitions that are trivially resizable or can span
    multiple drives, we could easily take some space from one partition and track
    it on another, and we could juggle partitions around physical drives on a live
    server. Sounds cool, right?


    Very cool, and very doable via LVM, a system that shifts the fundamental unit
    of storage from physical drives to virtual or logical ones (although we harbor
    our suspicions that the term logical is a jab at the status quo, is anything but).
    LVM has traditionally been a feature of expensive, enterprise UNIX operating systems
    or available for purchase from third-party vendors. Through the magic of free
    software, a guy by the name of Heinz Maelshagen wrote an implementation of a logical
    volume manager for Linux in 1998. LVM has undergone tremendous improvements since
    then and is widely used in production today, and as you expect, the Ubuntu installer
    makes easy for you to configure it on your server during installation.


    **LVM Theory and Jargon** Wrapping your head around LVM is a bit more difficult
    with RAID because LVM rethink the whole way of dealing with storage, which unexpectedly
    introduces a bit of jargon that you need to learn. Under LVM, physical volumes
    (PVs) are seen just as providers of disk space without any inherent organization
    (such as partitions mapping to a mount point in the OS). We group PVs into volume
    groups (VGs), which are virtual storage pools that look like good old cookie-cutter
    hard drives. We carve those up into logical volumes (LVs) that act like normal
    partitions we''re used to dealing with. We create filesystems on these LVs and
    mount them into our directory tree. And behind the scenes, LVM'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'splits up physical volumes into small slabs of bytes (4MB by default), each
    of which is called a physical extent (PE).


    So, that was a mouthful of acronyms, but as long as you understand the progression,
    you''re in good shape. You take a physical hard drive and set up one or more partitions
    on it that will be used for LVM. These partitions are now physical volumes, which
    are split into physical extents and grouped in volume groups, on top of which
    you finally create logical volumes. The LVs—these virtual partitions, and not
    the ones on the physical hard drive—that carry a filesystem and are mapped and
    mounted in the OS. And if you''re really confused about what possible benefit
    we get from adding all this complexity to wind up with the same fixed-size partitions
    in the end, hang there. It''ll make sense in a second.


    The reason LVM splits volumes into small, equally sized physical extents is that
    the definition of a volume group (the space that will be carved into logical volumes)
    then becomes “a collection of physical extents” rather than “a physical area on
    a physical drive,” with old-school partitions. Notice that a “collection of extents”
    says nothing about where the extents are coming from and doesn''t impose a fixed
    limit on the size of a volume group. We can take PEs from a bunch of drives and
    toss them into one volume group, which addresses our desire to abstract partitions
    away from physical drives. We can take a VG and make it bigger simply by adding
    a few extents to it, maybe by taking them from another VG, or maybe by tossing
    in a new physical volume and using extents from there. And we can take a VG and
    move it to different physical storage simply by telling it to relocate to a different
    collection of extents. Best of all, we can do all this on the fly, without any
    server downtime.


    Do you smell that? That''s the fresh smell of the storage revolution.


