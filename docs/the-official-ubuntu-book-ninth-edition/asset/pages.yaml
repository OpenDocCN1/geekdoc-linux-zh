  md: 'ONE OF THE MOST APPEALING ARGUMENTS for the adoption and use of Linux is the
    fact it can be customized according to users'' personal preferences. In this chapter,
    we look at the ways the Unity desktop can be adapted to different users. Unity
    is a relatively new desktop, so we start by reviewing the terminology for the
    desktop. We then look at the default settings, including various ways to tweak
    them. Lenses were introduced in the Ubuntu 11.04 release; in the 16.04 LTS, a
    wide variety of Lenses are available. We examine some popular Lenses and how to
    use them. Different use their computers in different ways, and for reason we want
    to help you discover how to tweak your Unity desktop to best suit your needs.


    While tweaking your desktop is a fun way to personalize your experience, we also
    want to caution you making changes without understanding what changes will do.
    If you are unsure about making those changes, take some time to research them.
    At the end of this chapter, we identify some more resources to further your understanding
    of the Unity desktop.


    In this chapter, we show you just a few of the Lenses that are available and explain
    how you can install them. At the end, we point out the resources that will get
    you started writing Lenses as you go from novice to superuser. Let''s get ready
    to supercharge your Unity desktop!


    # Unity Terminology


    When the Unity Launcher was introduced in the Ubuntu 11.04 release, a number of
    design goals were established. Specifically, the icons needed to be easy to find,
    running applications needed to be always visible, the focused application needed
    to be easily accessible, and the interface needed to be touch friendly. The Unity
    desktop certainly met with a mixed range of highly charged emotions from early
    adopters, and due to their passion and feedback, the desktop and its functionality
    have improved. Providing user feedback is one of the most important things an
    Ubuntu user can do for the project. At the end of this chapter, you will be given
    a list of resources to get you started providing the developers with feedback.'
  merge: -1
  pgno: 174
