  md: '# Preface


    WE HOPE YOU ENJOY The Official Ubuntu Book. There are many changes we made for
    this edition, which we believe takes an already good book to a new level.


    Because Ubuntu has increased in popularity and is better known, we have expanded
    the intended audience from pure beginners to include those who know a bit about
    Ubuntu but want to improve their skills and become power users. These individuals
    are not necessarily focused on becoming programmers or systems administrators,
    but regular people who want to make their day-to-day use of Ubuntu more efficient
    or who want to better harness Ubuntu''s potential.


    A large part of this book has been rewritten—not because the earlier editions
    were bad, but because so much has happened since the previous edition was published.
    This book chronicles the major changes that affect typical users and will help
    anyone learn the foundations, the history, and how to harness the potential of
    the free software in Ubuntu.


    As we write this, it has been several years since we penned the first edition
    of The Official Ubuntu Book. Over that time, we have seen Ubuntu continue its
    explosive growth. Updating this book drives this fact home in striking ways. For
    example, the numbers of users and posts in the Ubuntu Forums and the Ask Ubuntu
    Web sites continue to rise.


    Once again, we feel blessed that The Official Ubuntu Book has been able to benefit
    from, and perhaps in a small way even contribute to, that success. Ultimately,
    that success paved the way for several subsequent editions, and now the ninth
    edition, of the book that you''re reading now.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# xxviii Preface


    In the process, this book, like Ubuntu, continues to mature. Our job as authors,
    like that of the Ubuntu developers, now involves more updating and polishing than
    it used to. Distributed under a free license, a once-risky book on a once-risky
    operating system is, just a few short years later, as close to a sure thing as
    an author, publisher, and if we have done our job well, a reader could hope for.


    And with success comes responsibility to our readers and to our users with high
    expectations. Ubuntu''s success is built in part of maturity and excellence, and
    it cannot sacrifice these qualities if it will succeed. We cannot not either.
    Our job as writers is complicated because we need to accurately reflect and represent
    both qualities while catering to an increasing and increasingly diverse group
    of users.


    As we''ve noted in the prefaces to previous editions of this book, being Official
    has carried with it a set of rights and responsibilities. Our book''s title means
    that we must attempt to reflect and represent the whole Ubuntu community. While
    we, as authors, are expected to put ourselves into the book, it is understood
    that it can never be the detriment of the values, principles, technologies, or
    structures of the Ubuntu community.


    Doing this has been complicated as Ubuntu has grown. In each edition, we have
