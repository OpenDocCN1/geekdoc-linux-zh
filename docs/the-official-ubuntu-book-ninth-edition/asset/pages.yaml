- img_proc: true
  md: '# Installing Ubuntu Server


    and specific kinds of drive configurations are referred to as RAID levels. These
    days, even low- to mid-range servers ship with integrated hardware RAID controllers,
    which operate without any support from the OS. If your new server doesn''t come
    with a RAID controller, you can use the software RAID functionality in the Ubuntu
    kernel to achieve the goal.


    Setting up software RAID while installing your Linux system was difficult and
    unwieldy only a short while ago, but it is a breeze these days. The Ubwly installer
    provides a nice, convenient interface for it and then handles all the rectify
    backstage magic. You can choose from three RAID levels: 0, 1, and 5.


    **RAID 0** A so-called striped set, RAID 0 allows you to pool the storage space
    of a number of separate drives into one large, virtual drive. The portant to keep
    in mind is that RAID 0 does not actually concatenate the physical drives—instead,
    it spreads the data across them evenly, which means that no more space will be
    used on each physical drive than the smallest one. In practical terms, if you
    had 250GB drives and a 200GB, the total amount of space on your virtual drive
    would equal 600GB; 50GB on each of the larger drives would go unused. Spreading
    data in this fashion provides amazing performance but also significantly decreases
    reliability. If any of the drives in your RAID 0 array fails, the array will come
    crashing down, taking your data with it.


    **RAID 1** This level provides very straightforward data replication. It will
    take the contents of one physical drive and multiplex it to many other drives
    as you''d like. A RAID 1 array does not grow in size with the addition of extra
    drives; instead, it grows in reliability and read performance. The size of the
    entire array is limited by the size of its smallest constituent drive.


    **RAID 5** When the chief goal of your storage is fault tolerance, and you want
    to use more space than is provided by the single physical drive in RAID 1, this
    is the level you want to use. RAID 5 lets you use identically sized drives (if
    different-sized drives are present, no more space than the size of the smallest
    one will be used on each drive) to construct an array whose total available space
    is that of $n - 1$ drives, and the array tolerates the failure of any one—but
    no more than one—drive without data loss.'
