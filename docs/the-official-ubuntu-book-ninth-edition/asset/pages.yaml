  md: 'You can switch between multiple applications in Ubuntu just like in Windows
    by pressing Alt-Tab. When you press this key combination, a small window appears
    that can be used to switch between active applications on the current workspace.
    You can also use Alt+Tilde (~) to switch between different windows of the current
    application.


    # Using Applications


    When applications are loaded, the window border has three buttons on the top on
    the left-hand side:


    +   - Orange button with a black X: This button closes the application.

    - Gray button with a black –: This button minimizes the application, taking it
    off of your screen, and puts it in the Launcher for easy access when you need
    it again.

    - Gray button with a black square: This button is used to maximize the window
    so that it takes the full desktop area. Not all applications use this button,
    so don''t be surprised if you don''t see it for an application that has a small
    window.


    Every application that is currently in use has an entry in the Launcher on the
    left of the desktop. You can click these entries to minimize or restore the application,
    and you can right-click to see some other options, such as one to keep the program
    icon listed in the Launcher at all times. It is available so that you simply need
    to click the icon to start the program rather than search for it in the Dash,
    which makes it convenient for frequently used programs.


    Any menus with options that exist for a program currently in use in the foreground
    will appear in the top panel of the desktop. When you switch programs, the contents
    of the top panel will change accordingly. Hover over the name of the program at
    the top of a screen and wait for a list of menus to appear. Click any one to see
    a drop-down list of options.


    You can change the settings of the menus, so menus of nonmaximized applications
    appear on the top border of their respective windows. To modify these settings,
    search for Appearance on the Dash. On the Behavior tab, change the selected option
    from "In bar" to "In window title bars.'
