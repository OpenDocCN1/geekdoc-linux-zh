    # Teams, Processes, and Community Governance


    Ubuntu operates under the famous hacker mantra of “rough consensus

    running code.” The project attempts to forge consensus, to make good

    technical decisions, and to move forward. It attempts to minimize politici-

    ization wherever possible and to distribute power to those who are best

    getting good work done. Mark Shuttleworth explains, “This is not a de-

    ocracy, it’s a meritocracy. We try to operate more on consensus than on

    votes, seeking agreement from the people who will have to do the work.


    The project attempts to keep disagreements from spiraling out of control

    en enforcing mutual respect at all times with its Code of Conduct, de-

    scribed in Chapter 1. Disagreements, of course, are inevitable and can be

    technical or nontechnical in nature. The community needs to be able to

    deal with these and, toward that end, has created a lightweight governance

    system to ensure that disagreements are resolved carefully and

    that the project always has a strong, fair, and responsive direction.


    The Ubuntu Web site describes the goals of its community governance

    system as threefold.


    +   1. Ensure that a process is defined that allows people to contribute to

    decisions regarding the Ubuntu community and distribution.


    +   2. Ensure that decisions regarding the Ubuntu distribution and

    community are made in a fair and transparent fashion.


    +   3. Ensure that necessary decisions are actually made, even when there are

    no clear consensus among the community.


    With these goals in mind, Ubuntu’s system is based on the delegation of

    dision-making power to small and medium-sized teams. When dis-

    agreements arise, they are handled within a relevant team. In the cases of

    s larger teams, team councils handle a variety of dispute resolutions

    in a very structured fashion. When teams cannot resolve their own-

    agreements or when there are disagreements between teams, issues are'
