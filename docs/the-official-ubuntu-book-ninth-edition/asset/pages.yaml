  md: '# Managing Files and Folders


    When using your computer, you often need to open and save files and folders, move
    them around, and perform other tasks. Click the Home Folder icon from the Launcher
    to open the file manager. Here are some of the main folders you will find contained
    in your home folder by default (Figure 3-5):


    +   - **Desktop**: This folder contains files that visually appear on your desktop
    as icons. If you drag a file onto your desktop, it appears in the Desktop folder.
    Similarly, moving a file out of this folder or deleting it removes from your desktop.

    - **Documents**: This folder is intended to contain word processing files and
    other documents you create.

    - **Downloads**: This folder is intended to contain items you download from the
    Internet.

    - **Music**: This folder is intended to contain music files.

    - **Pictures**: This folder is intended to contain image files.


    ![](img/81489f896cf4aa863894a21fbe4968b0_104_0.png)


    **Figure 3-5** The main file manager window, open to the home folder'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# Getting Acquainted with Unity 67


    +   - Public: This folder holds files that you want other users on your system
    or network to be able to access. The permissions on this folder are set differently,
    as by default all the other folders and their contents may be accessed and opened
    only by you.


    +   - Templates: This folder is intended to contain templates for applications
    like your word processor.


    +   - Videos: This folder is intended to contain visual media.


    To the left of the file manager is a menu with several options. Most are repeats
    of commonly used folders listed previously. These deserve further mention:


    +   - Computer: Allows you to browse the other files and folders on your system
    that are not contained in your home folder and that you have permission to view.


    +   - Trash: Where files you throw away, until you empty the Trash to remove them
    permanently.


    +   - Connect to Server: Runs a wizard to create a connection to a network server;
    you will need to know the name of the server you want to connect to, and some
    details about it like the port being used. Use this feature to add an icon to
    the desktop, that when clicked, provides a list of remote files in the desktop
    file manager. You can treat this window like any other file manager and drag files
    back and forth. This is really useful for copying files and from other computers.


    # Usability and the Ubuntu Desktop


    Throughout the development of the Ubuntu desktop, great care and attention have
    gone into ensuring usability. As an example, the corners of the screen are established
    as areas that are simple to access—you don''t need to carefully mouse over the
    area, but instead can just throw your mouse to the appropriate corner; This why
    approach makes accessing each feature a little easier.


    Ubuntu is filled with tiny utility improvements such as that help make using it
    as intuitive and powerful as possible. Canonical has created a collective project
    called Ayatina to spearhead this development. More on Ayatina can be found at
    https://wiki.ubuntu.com/Ayatina.'
