    # Ubuntu and Multimedia


    In recent years, multimedia capabilities have become an essential part of computing.
    Watching DVDs and Web videos and listening to music have become an integral part
    of modern computer use. These multimedia capabilities have been further bolstered
    by the huge popularity of legal music downloading. With a range of online stores
    for a variety of music, it is not uncommon to listen to most of your music without
    ever seeing a little silver disk.


    # Installing Codecs


    Multimedia files and disks come in a variety of different types, and each type
    uses a special codec, or coder/decoder software, to compress the content to a
    smaller size while retaining a particular level of quality. To play such media,
    you need to ensure that you have the relevant codecs installed. Ubuntu now makes
    this easier by suggesting packages that provide a suitable codec when you open
    a file that isn''t supported by the codecs that are currently installed. Simply
    double-click the file you want to open, and you should be provided with a list
    of packages that you can install to enable support for the file you have tried
    to open. Select the packages that seem appropriate, and click install.'
