    # Compiling Software from Source


    Some software cannot be found in any repository. The traditional way of

    installing software on Linux works just well as on Ubuntu. Download your

    software and put it in an otherwise empty directory. Sometimes, it will-

    clusion installation instructions. If so, follow them. Instructions must be

    the same as those listed here.


    Before you can install a source code package, it must be compiled into a

    binary that your computer can run. For that, you need to install some

    packages that are not included by default. All you should be included

    as a dependency of one package. Install it, and you should be all set.


    ```

    $ sudo apt-get install build-essential

    ```


    Next, browse to the directory where you placed the downloaded

    code. It is most likely provided as a compressed archive, with a filename

    extension like tar.gz or tar.bz2. Decompress the archive with the appropri-

    tate command, depending on the filename extension:


    ```

    $ tar -xvf file.tar.gz

    $ tar -xvjf file.tar.bz2

    ```


    Next, build the package. This step checks whether you have the required

    dependencies installed and will tell you if you don''t—if if not, you need to'
