    # Using Windows Files on Another Partition


    For those of you who spend a considerable amount of your life on Windows partitions,
    you may want to be able to access these partitions from Ubuntu. This is no problem,
    although you will need to edit a special configuration file to do this. Luckily,
    you need to edit this file only once, and then everything will be set up.


    Ubuntu should automatically recognize any Windows partitions you have on your
    computer and set them up for you in the file manager; however,'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# Understanding How Linux Stores and Organizes Files


    you may need to modify them or add your own. Search for Disks in the Dash and
    write down the partition numbers and files for Windows partitions. The partition
    number will look something like /dev/hdb1 or /dev/sdb1, and the filesystem will
    be either FAT, VFAT, or NTFS.


    The next step is to create some mount points. When Windows partitions are enabled,
    they are accessed via a particular folder in Ubuntu. This is called a mount point.
    As an example, if you have a mount point at /media/win1 and on your Windows partition
    you want to access your Work folder, you would access it from Ubuntu as /media/win1/work.


    Mount points usually live in the /media folder. You can create a different mount
    point for each Windows partition. As an example, if you have three Windows partitions,
    run the following commands:


    ```

    foobar~$ sudo mkdir /media/win1

    foobar~$ sudo mkdir /media/win2

    foobar~$ sudo mkdir /media/win3

    ```


    Now open up the following configuration file:


    ```

    foobar~$ sudo edit /etc/fstab

    ```


    The /etc/fstab file maps partition numbers to mount points. At the bottom of the
    file, add a line like this for each mount point:


    ```

    /dev/hdb1 media/win1 vfat users,rw,owner,umask=000 0 0

    ```


    You will need to change the partition number (the first column), mount point (second
    column), and filesystem (third column) for your relevant partitions.


    Now reload /etc/fstab to enable the partitions:


    ```

    foobar~$ sudo mount -a

    ```


    Some hard disk icons for the new partitions now appear.


    > You can find more about fstab at https://help.ubuntu.com/community/Fstab.'
