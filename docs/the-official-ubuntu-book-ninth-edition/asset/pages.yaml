  md: 'install them separately, by using Synaptic or via the command line with apt.
    This step will also build the package from source code into something-installable.


    ```

    $ make

    ```


    Next, install the package. The traditional way is to use this command:


    ```

    $ sudo make install

    ```


    Although this technique works, there is a better method. Using install will install
    the package, but it will not use your package manager to do so. If you ever want
    to remove the package from your system, it can be quite a chore to figure out
    how. Instead, install the software with the following command:


    ```

    $ sudo apt-get install check

    ```


    Like any software installed from an official repository, it can be removed using
    your package manager:


    ```

    $ sudo checkinstall

    ```


