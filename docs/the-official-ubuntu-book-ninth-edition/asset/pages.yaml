- img_proc: true
  md: 'With cloud computing, computing power becomes a commodity. You don''t need
    to plan, budget for, and install new computing power months in advance. Instead,
    ask the cloud for a machine and it''s there within seconds. When you''re done,
    throw it away.


    It''s like the difference between digging a well and turning on a tap. If you
    have running water from a tap, water remains a precious resource, but it''s no
    longer something you need to invest time to obtain. If you have cloud computing,
    computing power may remain limited, but it''s much easier to get hold of, share,
    and repurpose.


    If you want cloud computing power, there are a couple of ways to get it: build
    your own private cloud or buy computing power as and when you need it from one
    of the big cloud providers, such as Amazon or RackSpace. Actually, with Ubuntu
    you can mix and match between your own private cloud and buying additional resources
    when you need them.


    Ubuntu is at the heart of the cloud computing revolution. It serves both as the
    OS running cloud clusters—the machines that provide the computing power to the
    cloud—and the OS that people choose to run in the virtual machines they run in
    the cloud.


    Because it''s so new, cloud computing is fast moving, but two dominant approaches
    to running a cloud have already emerged: Amazon''s EC2 and the open source project
    OpenStack. Ubuntu is at the heart of both. That''s great news if you want to experiment,
    because Ubuntu gives you a range of tools to set up and manage your cloud.


    The main tools you''ll come across are MAAS (otherwise known as Metal as a Service)
    and Juju. MAAS helps you set up and manage a cluster of servers, and Juju makes
    it easy to get services running directly or bare-metal servers or in the cloud.


    Using MAAS, you can treat a group of bare-metal servers like a cloud: instead
    of a bunch of individual servers, you have a computing resource to which you can
    deploy different services. Using MAAS''s Web UI, you can quickly get an overview
    of how your computing cluster is being used'
