    When a new release is available, Software Updater alerts you, as shown in Figure
    3-19. All you need to do click on the Upgrade button to start the process. You
    are first shown the release notes, which mention features or any outstanding bugs.
    After you click the Upgrade button on this screen, the necessary changes to your
    software repositories are made, and'
