    # The Technical Board


    The Ubuntu Technical Board is responsible for the Ubuntu project''s technical
    direction. By handling all technical matters, the Technical Board complements
    the Community Council as Ubuntu''s highest run of project governance. In particular,
    the Technical Board is responsible for three major areas of Ubuntu policy: package
    policy, release feature goals, and package selection. Also, the Technical Board
    is available to arbitrate any technical disagreements or issues within between
    teams in a manner similar to the one described earlier in relation to the Community
    Council.


    The Technical Board''s first responsibility is Ubuntu''s package policy. The Technical
    Board maintains the policy document, which describes the processes and standards
    to which all Ubuntu packages are held. Since the policy is constantly evolving,
    each Ubuntu release is associated with a specific version of the Ubuntu package
    policy as determined by the Technical Board. Any suggestions or proposals about
    policy are suggested to and considered by the Technical Board.'
  merge: -1
  pgno: 335
- img_proc: true
  md: 'Also, the Technical Board is responsible for maintaining Ubuntu''s feature
    goals for each release. During each release, there is a date defined as Feature
    Freeze, after which no new features are added. The Technical Board sets these
    dates and decides when and if the rules can be bent for a particular feature or
    piece of software.


    Finally, the Technical Board is responsible for maintaining the list of pieces
    of software (i.e., packages) in Ubuntu. In this capacity, the Technical Board
    determines which software is installed in the default desktop installation and
    which packages qualify for full support as part of the main component of Ubuntu.
    Users and developers can propose a particular piece of software for inclusion
    in the main, the base install, or a desktop install. In all cases, the ultimate
    decision will be made by the Technical Board.


    Like the Community Council, the Technical Board meets at least twice a month on
    IRC. Also like the Community Council, any user can submit an item or proposal
    for discussion by the Technical Board prior to the scheduled meeting. Meetings
    are open to all interested parties, although decision-making and voting are restricted
    to Technical Board members. Full transcripts and rules about noise, as they pertain
    to the Community Council, also apply to the Technical Board. You can always find
    the current list of the Technical Board members at https://launchpad.net/~board.
    Appointments are made by Shuttleworth but are subject to confirmation by a vote
    among the maintainers instead of all members. Appointments are made for a period
    of two years.


    # Other Councils and Boards


