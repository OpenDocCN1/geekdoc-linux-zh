  md: '# Upgrading to the Next Ubuntu Release


    One of the original goals for Ubuntu was to have frequent releases. With only
    one notable exception (the 6.06 LTS release, which was delayed by two months),
    six months has separated each release since 4.10.


    This book has been revised to match the latest version—16.04—but another release
    will be along soon. Release 16.04, like the earlier 14.04, 12.04, 10.04, 8.04,
    and 6.06, is an LTS version of Ubuntu; it will be supported for five years on
    both the desktop and the server.


    All versions, such as 15.10, are supported for nine months, yet also superseded
    by a new version every six months. Essentially, if you are running the LTS version,
    you might not be too interested in moving to the latest and greatest release until
    the next LTS version comes out. In contrast, if you are running a regular release
    version, you might be the sort of person who is more interested in the latest
    and greatest software updates. In either case, this is how you perform the upgrade.


    > TIP Ubuntu releases are intended to be stable. The LTS releases are intended
    to be extra stable, as they represent the culmination of two years of planning
    and feature changes. The intermediate releases include incremental changes that
    are stable but may not be feature-complete. For example, the Unity desktop was
    first released in 10.10, the first release after 10.04 LTS, but its features became
    more complete and development more mature for 12.04 LTS.


