  md: '# Chapter 3 Getting Started with Ubuntu


    Other Lenses are available beyond those installed by default. Later in this chapter,
    you will learn how to use the Ubuntu Software Center. You can find additional
    Lenses there by searching with the terms unity lenses.


    # Other Icons in the Launcher


    In addition to the Ubuntu logo icon described earlier, the Launcher includes several
    useful entries by default. Most are obvious in their intent and use. Even so,
    they deserve a quick mention. They are listed here in the order they appear in
    the Launcher from top to bottom, alike some more obvious entries.


    +   * Home Folder: This icon opens your home folder using the file manager, which
    is described next. Your home folder is where all of your personal files and folders
    should be placed.


    +   * GNOME Software Center: This icon opens your primary software management
    system for Ubuntu, which is described later in the chapter.


    +   * Workplace Switcher: Once enabled, this tool allows you to have four different
    screens on your desktop, with different programs active in each, and switch between
    them. This is very helpful if you tend to have many things open at once and run
    out of space on your screen. Click it to show all of each of your desktop workspaces
    (it also shows what is open in each, which is convenient). As an example, you
    may be using your Web browser and e-mail client while talking to your friends
    in a chat client on the first desktop and working on a document on the second
    desktop. You can click each virtual desktop to switch to it access your different
    applications. Click the desktop you want to use. Essentially, this expands the
    real estate you have available and creates an easy way to keep many programs open
    without blocking one another. To enable workspaces on your system, go to the Dash
    and search for Appearance. On the behavior tab, click the checkbox for Enable
    Workspaces.


    +   * Trash: This is where files you throw away until you empty the Trash to remove
    them permanently. Files dragged onto this icon or right-clicked and moved to trash
    are destined to be deleted. To fully delete these files, right-click the Trash
    and select Empty Trash.'
