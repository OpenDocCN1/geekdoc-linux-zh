    in April and the Ubuntu Below Zero in Montreal, Canada, in November

    - Ubuntu Developer Summit View at Google Headquarters in Mountain View, California,
    in November 2006

    - Ubuntu Developer Summit-R in Copenhagen, Denmark, in October 2012


    As the community has grown, it has become increasingly difficult for Ubuntu Developer
    Summit (UDS) events to accommodate everyone who wants to attend in person. In
    2013, the Ubuntu Developer Summits moved to being online-only events that are
    held over video chat. These new events are called Ubuntu Online Summits (UOS).


    With the support of Canonical, Ubuntu tries to organize the Ubuntu Line Summ so
    that they occur twice per release. Usually the first occurs toward the very beginning
    of a release cycle, so that the specifications and goals for the forthcoming release
    can be discussed, thrashed out, and decided upon. A second UOS then takes place
    mid-cycle so that tasks can be formally reviewed and plans adjusted for release
    as needed. While the format changes slightly each time, these meetings have been
    between three days and two weeks in length.


    At UOS, attendees describes features that would like to see in the new Ubuntu
    release. At an arranged time or in a series of meetings, a small set of interested
    community contributors and developers work to draft a written specification. This
    process of drafting involves brainstorming and ends up with a formal, approved
    spec that describes a problem or need and provides a detailed description of how
    it will be fixed or implemented. While'
