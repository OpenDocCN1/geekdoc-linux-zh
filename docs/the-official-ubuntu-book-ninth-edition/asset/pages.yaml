  md: '# Chapter 8 The Ubuntu Server


    Here are some log files of note:


    +   - /var/log/syslog: general system log

    - /var/log/auth.log: system authentication logs

    - /var/log/mail.log: system mail logs

    - /var/log/messages: general log messages

    - /var/log/dmesg: kernel ring buffer messages, usually since system bootup


    Your Log Toolbox When it comes to reviewing logs, you should become familiar with
    a few tools of choice. The tail utility prints, by default, the last 10 lines
    of a file, which makes it a neat tool to get an idea of what''s happening last
    in a given log file:


    ```

    $ tail /var/log/syslog

    ```


    With the -f parameter, tail launches into follow mode, which means it will open
    the file and keeping your changes on the screen as they''re happening. If you
    want to impress your friends with your new system administrator prowess, you can
    now easily recreate the Hollywood hacker movie staple: test furiously blazing
    across the screen.


    Also invaluable grep, zcat, and zless, which operate their analogues that do not
    begin with a z, but on gzip-compressed files. For instance, to get a list of lines
    in all your compressed logs that contain the word "warthog" regardless of case,
    you would issue the following command:


    ```

    $ grep -i warthog /var/log/.gz

    ```


    Your toolbox for dealing with logs will grow with experience and based on your
    preferences, but to get an idea of what''s already out there, do an apt-cache
    search for "log files."


