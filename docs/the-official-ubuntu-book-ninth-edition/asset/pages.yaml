  md: 'WITH UBUNTU INSTALLED and ready to go, it''s time to get started using your
    new operating system. Unlike other operating systems, such as Microsoft Windows
    or Mac OS X, Ubuntu includes everything you need to get started: an office suite,
    media tools, a Web browser, an e-mail client, and more. Now that the installation
    is complete, you are up and running without having to install any additional software.


    Different people use their computers in different ways, and every user has his
    or own personal preference for look and feel. Recognizing this de-Linux has the
    capability to use any of a number of different graphical interfaces. This flexibility,
    combined with the ballooning popularity of Linux and open source software, has
    resulted in literally hundreds of different graphical environments springing up,
    each covering these different types of users and ways of working.


    Even though there is a huge range of environments available, there are two clear
    leaders: KDE and GNOME. Both of these environments provide a good-looking, comprehensive,
    and easy-to-use desktop, but they differ in how desktop is used as well as in
    how further personalization-can take place.


    The KDE system aims for complete control and configurability of the desktop. Any
    desktop configuration options that exist are available to the user, who has easy
    access and can change the behavior and look of almost everything.


    The competing GNOME desktop takes its inspiration from both Windows and Mac OS
    X and sets a priority on simplicity and ease of use. GNOME is also easy to customize,
    but the less common options are either eliminated or well hidden to prevent user
    overload.


    Ubuntu users are blessed with the choice of either desktop, along with several
    other options. Many of these environments are mentioned in Chapter 9.


    +   The Ubuntu Desktop Is Unity

    When reading about Ubuntu, you may see terms like Unity and Ubuntu desktop used
    interchangeably. The Ubuntu community, with sponsorship from Canonical, has created
    the'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'Unity desktop as the next stage in graphical interface evolution. Time will
    tell if other Linux distributions follow suit or if they choose to use one of
    the other existing options.


    The Ubuntu desktop is called Unity. The intention behind Unity was to create a
    user interface that would be similar in design terms between different devices:
    desktop, phone, tablet, and TV. This will help with the ultimate purpose of Ubuntu—that
    is, achieving convergence between all of these devices.


    In this chapter, we help you get started with Unity, the default desktop for Ubuntu,
    and show how you can use it to do the normal things you face every day with your
    computer and a few not-so-normal things. This includes opening and running applications,
    managing your files, adjusting the look and feel, using applications, managing
    your media, and more.


    # Getting Acquainted with Unity


    When you start your Ubuntu system, you are presented with a list of users. Once
    you select your name from the list, you are asked for a password to log in. In
    the last chapter, you specified a user account when installing the system, so
    use that account to log in. First select your name, and then type your password
    and press Enter. Your password will appear as a series of asterisks (*). This
    is a security feature.


    After a few seconds you will see the Ubuntu desktop appear. Your desktop will
    look like Figure 3-1.


    You may have noticed that, unlike other operating systems, there are no icons
    on the Unity desktop. The reason for this is that desktop icons are typically
    presented by applications, and, as such, you can get them.


    # Finding and Running Applications with the Launcher


    To find or run an application, you use the Launcher. The Launcher sits on the
    left of the screen. This icon bar shows icon links for applications and indicates
    with a small arrow which applications are currently open. The Launcher also has
    a few handy features.'
  merge: -1
