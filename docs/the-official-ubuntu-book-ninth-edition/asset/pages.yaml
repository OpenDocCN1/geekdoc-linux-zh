  md: '# Chapter 3 Getting Started with Ubuntu


    TIP If you double-click a file but no packages are suggested, you may need to
    change the package filter in the upper-right corner to All Available Applications.


    Codecs remain a problem for open source software because of the legal restrictions
    placed upon them. Certain codecs (including MP3, Windows Media Format, QuickTime,
    and RealMedia) are proprietary and, as such, have restrictions placed on their
    use, distribution, and licensing.


    Although developers in the open source community have created free implementations
    of some of these codecs, the licensing issues that surround them conflict with
    the legal and philosophical position that Ubuntu has taken. These codecs are excluded
    not only because they are legally dubious, but also because they disagree with
    Ubuntu''s ethic of creating a distribution that consists entirely of free software
    in the most sense of the word.


    TIP If you want to find out more about installing these codecs, see https://help.ubuntu.com/community/RestrictedFormats.


    To work toward resolving these problems, a number of developers are working on
    free codecs, such as Ogg Vorbis and Ogg Theoretical, that provide high-quality
    results and open licensing. The Ogg Vorbis codec is used for audio files and can
    provide better results than MP3 at a smaller size. The Ogg Theoretical codec is
    used for video files and competes with the MPEG-4 codec. Ubuntu includes the Ogg
    Vorbis and Ogg Theoretical codecs by default, and you can encode and play back
    any media that those use codecs out of the box.


    Although the world would be a better place if all codecs were free, the reality
    is different, and many Ubuntu users still want to play media compressed with proprietary
    codecs. Table 3-1 shows the most typical codecs used to encode and play back media
    and lists their support in Ubuntu.


