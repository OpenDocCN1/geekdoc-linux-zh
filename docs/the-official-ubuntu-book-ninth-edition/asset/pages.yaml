    # Building Packages from Source


    The Ubuntu archive, unlike Debian’s, doesn’t permit binary uploads. When Ubuntu
    developers want to add a piece of software to the archive, they prepare their
    source code in a certain way and put it in a build queue. From there it’s compiled,
    built automatically, and—if those steps succeed—pushed into the archive.


    Why go through all the trouble? Why not just have the developers build the software
    on their machines? They could upload binaries to the archive, bypassing the build
    queue, which can take hours to build software. The catch: Ubuntu officially supports
    three hardware platforms (Intel x86, AMD64, and ARMF). Without the build queue,
    developers would have to build separate binaries of software for each platform,
    which entails owning a computer running on each platform (expensive!) or creating
    complicated cross-compilation toolchains. And even then, sitting through three
    software builds is an enormous waste of precious developer time.


    The build queue approach solves this problem because the automatic build system
    takes a single package and builds it for all the necessary platforms. It turns
    out that the approach provides you, the system administrator, with a really nifty
    benefit: It you leverage the dependency-solving power and ease of use of apt-get
    and apply it to building packages from source!


