  md: '# What Is Ubuntu? 15


    With time, the landscape of GNU/Linux distribution has changed. However, the important
    role of derivation that made Slack possible remained fully intact and is still
    shaping this landscape. Today, the hundreds of GNU/Linux distributions serve a
    multitude of users for a myriad of purposes: There are distributions specially
    designed for children, dentists, and for speakers of many of the world’s languages.
    There are distributions for science, for business, for servers, for musicians
    and personal digital assistants (PDAs), for nonprofit organizations, for musicians,
    and for countless others.


    Despite this diversity, the vast majority of derivatives can be traced back to
    one of two distributions: Red Hat or Debian. It is not necessary to understand
    the details of how these projects differ, it’s useful to know that Red Hat and
    Debian offer two compelling, but frequent platforms. Each project has strengths
    and weaknesses. For almost every group making a Linux-based OS, one of these projects
    acts as square one (with a few notable exceptions, such as the Gentoo project).


    However, while the process of deriving distributions has allowed for a proliferation
    of OS platforms serving a vast multiplicity of needs, the derivative process has,
    historically, been largely one-way process. New distributions based on Red Hat—CentOS
    and SUSE, for example—begin with Red Hat or a subset of Red Hat technology and
    then customize and diverge from it. Very few of these changes ever make it back
    into Red Hat and, with time, distributions tend to diverge to the point of irreconcilable
    incompatibility. While the software that each system remains largely consistent
    across all distributions, the way that it is packaged, presented, installed, and
    configured becomes increasingly differentiated. As a result of this process, interdistribution
    sharing and collaboration become increasingly difficult.


    This growing divergence indicates a more general problem faced by distribution
    teams in getting changes upstream. Frequently, the users of GNU/Linux distributions
    find and report problems in their software. Frequently, distribution teams fix
    the bugs in question. While sometimes these bugs arise from changes introduced
    by the distribution, they often exist in the upstream version of the software
    and the fix applies to every distribution. What is not uncommon, but is unfortunately
    much less frequent, is for these bug fixes to be pushed upstream so that all distributions
