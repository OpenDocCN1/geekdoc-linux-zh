  md: '# Adding Additional Users


    Many computers these days are used by more than one person. Rather than forcing
    everyone to use the same desktop settings or making the computer less secure by
    allowing everyone who uses it to have access to administrative functions, it is
    easy and recommended to create an account for every person who uses the computer.
    This allows each user to customize how the computer works and looks without interfering
    with anyone else''s preferences, and it allows you to grant administrator privileges
    to certain users to prevent others from accessing functions that may affect everyone
    or damage the installation if used incorrectly.


    Open the Dash and search for User Accounts. The dialog box that appears contains
    a list of current users. Click Unlock at the upper-right corner of the window
    to make changes. Next, click the “+\ at the bottom of the user list or Add to
    create a new account, as in Figure 3-6.


    > A password is required to make changes to users and groups, and only those users
    with administrative access are able to do so. Click the Lock/Unlock button to
    enter your password and make changes.


    You must now provide a full name for the new user and a short username that will
    be used by that user to log in. Click OK, and in the next dialog


    ![](img/81489f896cf4aa863894a21fbe4968b0_106_0.png)


    Figure 3-6 The User Settings dialog'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'box, enter a password for that user, confirm the password by entering it a
    second time, and click OK again.


    Once your user account is created, you may customize your login options and click
    the Password field to set a password, allow the user to log in without a password,
    or enable the account without setting a password. Allowing a user to log in without
    a password or automatically is not generally a good idea but can be useful. For
    example, if the users are small children who are not expected to perform administrative
    tasks, the children could have an account that automatically logs in at boot time,
    and the administrator would have an additional account, accessed by a password,
    to perform changes and updates when necessary.


    Finally, now that the account is created, you can customize its Settings. To do
    so, highlight the account name in the list, and click the field at the right next
    to Account Type.


    If you prefer to do this from the terminal, use the adduser command logged in
    to an account with administrative privileges:


    ```

    matt@laptop:~~$ sudo adduser corey

    ```


    After you enter your password, this command will add a new user named corey. You
    will be asked several questions in this process. Answer them, and at the end,
    the account will be created.


    To delete a user from the command line, use the deluser command in place of adduser
    in the preceding example. You will learn more about dealing with users from the
    command line in Chapter 7.


