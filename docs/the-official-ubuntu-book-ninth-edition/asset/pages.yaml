    # # Unity Lenses and Scopes


    The Dash is one of Unity''s main features. It allows users to search for information
    both locally and remotely using Lenses. Each Lens is responsible for one category
    of search results for the Dash.


    By itself, the Lens is not very useful, because it doesn''t perform the search.
    Instead, the Lens relies on one or more *Scopes*, which are the actual search
    engines, to return the search results.


    In the terminology section of Chapter 3, we looked at the music Lens. The Lens
    has two Scopes, which means that four processes are involved in searching the
    music category for content: the Dash, the Lens daemon, first Scope daemon, and
    second Scope daemon.'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'As a user, you won''t even notice the complex process the Lens performs to

    keep everything in sync. You can just enjoy the benefits of being able to

    quickly search various categories of information.


    > **NOTE** For information on how Lenses work and are created, see the Lens Guidelines
    wiki

    at https://wiki.ubuntu.com/Unity/Lenses/Guidelines.


    It seems that everyone has a favorite Unity Lens. By default, Unity comes

    with the following Lenses: Applications, Files, Music, and Video.


    # Additional Resources


    In this chapter, we looked at three tools you can use to tweak your Unity

    desktop: Appearance, Unity Tweak Tool, and Compiz Config Settings

    Manager. Other tools and resources are available to help you personalize

    your desktop environment. A wealth of help and documentation is also

    available online. If you ever find yourself stuck, take a look at the Ubuntu

    Web site at www.ubuntu.com or the Ubuntu documentation at https://

    help.ubuntu.com, and make use of Ask Ubuntu, the forums, wiki, mailing

    lists, and IRC channels.


    # Summary


    In this chapter we outlined several ways to customize your Ubuntu expri-

    ence. Changing the Unity desktop from its default settings is not some-

    thing everyone will want or need to do, but knowing how to do so is both

    useful and sometimes necessary.'
