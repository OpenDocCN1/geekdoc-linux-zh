    # Venues and Events


    As described in Chapter 1, transparent and public communication was an early goal
    of the Ubuntu project. Technical and community decisions are made publicly and
    are accessible to all interested parties. When this is impossible (e.g., when
    there is a face-to-face meeting and it''s simply not possible for everyone to
    attend), the community attempts to publish summaries and minutes and to provide
    avenues for feedback. The Ubuntu community contains no “member only,” “developer
    only,” or “decision-maker only” back-channels to preserve individual privacy or
    security—the Ubuntu community refuses to create them. All work in Ubuntu occurs
    in places where everyone can view the work, and anyone who agrees to engage constructively
