    # Bazaar


    Bazaar (Figure 9-16) is a distributed revision control system. What does that
    really mean? First, a revision control system is a program that tracks how the
    source code of a program changes. Each change was, such as the addition of a new
    piece of code, as well as who made the change. It also allows a developer to roll
    back to a previous version or create a branch, or a separate and parallel code
    version, to try a new idea without forcing the change on the main code.


    The second key piece about Bazaar is that it is distributed, much like the popular
    revision control software Git. Traditional revision control systems we'
  merge: -1
