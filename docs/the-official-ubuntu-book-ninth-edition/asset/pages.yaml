    For more than 20 years, the Wine project team members have been creating a free
    way to run Windows applications on Linux. While not every application works perfectly,
    and some don''t work at all, the number of programs that do work in Wine has dramatically
    increased and continued to do so. However, it is recommended that you thoroughly
