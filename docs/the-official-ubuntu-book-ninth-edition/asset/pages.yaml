    You can find the download link for the latest Minimal CD by visiting .ubuntu.com/community/Installation/MinimalCD.


    This method involves booting the Minimal CD, running through the installer, selecting
    what you wish to install (i.e., Ubuntu desktop), and then starting the system.
    This kind of installer is ideal for installation of the Ubuntu OS on older hardware.


    To get started, put the CD in the drive and restart your computer.


    Select the Install with the arrow keys, and press Enter. After a few moments,
    the installation process begins by asking you to choose a language. Select from
    the different languages using the up and down arrow keys, and then use the Tab
    key to jump to the red buttons to continue through the setup.


