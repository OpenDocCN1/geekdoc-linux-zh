    By combining MAAS and Juju, you can relatively easily set up your own private
    cloud. MAAS helps you manage the real machines, and Juju helps you set up the
    services you need to run that cloud.


    Let''s say you want to deploy a specific service to the cloud using Juju. We use
    Zookeeper in our example. Deploying a service normally begins like this:


    ```

    $ juju bootstrap

    $ juju deploy zookeeper

    $ juju expose zookeeper

    ```


    At this point, Juju creates a virtual machine instance, installs Zookeeper, and
    configures it. Use the following command to determine the status of the instance:


    ```

    $ juju status

    ```


    When you get the notification that your instance is up and running, you will learn
    its IP address and start using it. This process is amazingly quick and easy!


    One useful tool that was brand new for version 12.04 is the Juju charm store.
    When Juju started, it was much more difficult to find and deploy services using
    charms, but with the charm store as a central repository, the process has become
    much more elegant. Just as APT and related software have made finding and installing
    software easy, so the Juju charm store is designed to make launching and configuring
    servers in the cloud easy. There is an interesting difference between APT and
    Juju work.'
