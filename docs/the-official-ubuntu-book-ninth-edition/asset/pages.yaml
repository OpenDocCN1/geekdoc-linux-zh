  md: '# 130 Chapter 4 Finding and Installing Ubuntu Applications


    and Roman traditions (Figure 4-28) but also those of other “sky cultures,” as
    Stellarium describes them, such as the various Chinese, Ancient Egyptian, and
    Polynesian traditions.


    Stellarium is even capable of driving a dome projector, like you would see at
    a large-scale, purpose-built planetarium, as well as controlling a wide variety
    of telescopes directly.


    # Marble


    Marble, the desktop globe, is a virtual globe and world atlas, which can be utilized
    to learn more about the Earth. With the ability to pan and zoom, click on a label
    to open a corresponding Wikipedia article, and view the globe and maps with various
    projections, Marble is a welcome addition to Edubuntu’s educational packages.


