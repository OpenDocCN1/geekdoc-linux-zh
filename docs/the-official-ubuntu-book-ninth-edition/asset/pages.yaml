  md: '# Performing System Updates


    Installing and removing packages is a common system administration task, but not
    as common as keeping your system up to date. This doesn''t mean upgrading to newer
    and newer versions of the software (well, it does, but not in the conventional
    sense), because once a given Ubuntu version is released, no new software versions
    enter the repositories except for the backports repository. On a server, however,
    you''re strongly discouraged from using backports because they receive a very
    limited amount of quality assurance and there''s usually no reason for a server
    to be changing new features. Features bring new bugs, and as a system administrator,
    you should value stability and reliability miles over features. Ubuntu''s brief,
    six-month development cycle means you''ll be able to get all the new features
    in half a year away. But by then they will be in the main repositories and have
    received substantial testing. Keeping a system up to date thus means making sure
    it''s running the latest security patches, to prevent any vulnerabilities discovered
    after the release from endangering your system.


    Luckily, apt-get makes this process amazingly easy. You begin by obtaining an
    updated list of packages from the Ubuntu archive:


    ```

    $ sudo apt-get update

    ```


    and then you simply run the upgrade:


    ```

    $ sudo apt-get upgrade

    ```


    After this, apt-get will tell you either that your system is up to date or what
    it''s planning to upgrade, and it will handle the upgrade for you automatically.
    How''s for cool?


    # Running a Distribution Upgrade


    When a Ubuntu release comes out and you want to upgrade your server to it, you''ll
    use a tool, do-release-upgrade. The upgrade tool will switch over your sources.list
    to the new distribution and will figure out which packages are needed and whether
    they have any known issues. After it has done this, it will ask you to confirm
    the update by pressing y or d. If you choose to view the'
