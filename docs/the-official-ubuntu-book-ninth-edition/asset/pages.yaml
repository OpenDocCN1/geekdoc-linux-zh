  md: '# Chapter 10 Ubuntu, Convergence, and Devices of the Future


    Security also plays an important role in the cloud. Given how easy it is to create
    Snaps, third parties can readily make packages themselves and update packages
    in a timely manner. As a consequence, they need not rely upon a skilled Debian
    packager they''ve hired or found in the community to do the work for them; rather,
    the third parties can handle these tasks themselves. Since the main archive is
    the only one officially supported by the Ubuntu Security Team, we envision a future
    where users may be less likely to use an older version of software included in
    the Universe repository and beyond that may not have security fixes because it
    was too difficult to make that package available. If the implementation of Snaps
    continues on its present path, then it would be possible to ensure significant
    isolation of applications from one another and avoid problems with the operating
    system as well. This protection comes at the expense of large package sizes, however:
    Libraries are not shared, but bundled in. In addition, it means that applications
    are no longer required to use the version of a library that is in a repository.
    Finally, Snaps embody the concept of a known state, since they are largely read-only.
    In turn, it is easy to determine whether your system has been tampered with. Undoubtedly,
    audit tools will begin to pop up in the near future to assist with making this
    determination.


    # The Future of the Ubuntu Desktop


    Given the proliferation of devices that use Snaps rather than Debian packages,
    you may be wondering when and if Snaps are coming to your desktop. As mentioned
    earlier in the chapter, the 16.04 release was the first to offer a preview of
    how this convergence would work. The 16.04 Ubuntu release continues to support
    the presence of Ubuntu on desktops and servers built with Debian-based packages,
    but also reserves a segment (“dimension”) of the system specifically for Snaps.
    Thus, the same security seen in the devices discussed in this chapter is available
    on the desktop in the form of read-only system images and as sandboxed Snaps.
    These Snaps are available for installation through the GNOME Software Center,
    which has been equipped for this release to support them. Snaps are not yet central
    to the operation of an Ubuntu Desktop, but may be a good solution for applications
    that are subject to frequent updates and take large amounts of time to package
    for the archives, or apps that developers wish to offer on an alternative channel.
    Time will tell which kinds of appli'
  merge: -1
