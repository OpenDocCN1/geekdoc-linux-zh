    # TIP


    LVM Doesn''t Provide Redundancy

    The point of LVM is fluidity, not fault tolerance. In our example, the logical
    volume containing the /var filesystem is sitting on a volume group that spans
    two hard drives. Unfortunately, this means that failure of either drive will corrupt
    the entire filesystem, and LVM intentionally doesn''t contain functionality to
    prevent this problem.


    Instead, when you need fault tolerance, build your volume groups from physical
    volumes that are sitting on RAID! In our example, we could have made a partition
    spanning the size of 10GB hard drive and allocated it to physical space for a
    RAID volume. Then, we could have made two 10GB partitions on the 20GB hard drive
    and made the first one also a physical space. Entering the RAID configurator,
    we would create a RAID 1 array from the 10GB RAID partitions on both, but instead
    of placing a regular filesystem on the RAID array before, we''d actually decide
    the RAID array to be used as a physical space for LVM. When we get LVM configuration,
    the RAID array would show up as any other physical volume, but we''d know that
    the physical volume is redundant. If a physical drive fails beneath it, LVM won''t
    ever know, and no data loss will occur. Of course, standard RAID array caveats
    apply, if enough drives fail and shut down the array, LVM will still come kicking
    and screaming.


    # Encrypted Home and Software Selection


    After you have partitioned the disk, the installer will install the base system
    and ask you for user information, much like with the desktop install. You''ll
    then be asked a question you might not have seen before: do you wish to encrypt
    your home directory?


    If you answer in the affirmative, your account password will take a second purpose.
    Rather than just allowing you to log in, it will also be used to transparently
    encrypt every file in your home directory, turning it into gibberish for anyone
    without the password. This means that if your computer gets stolen, your data
    remains safe from prying eyes as long as your password isn''t too easy to guess.
    If this sounds familiar, it''s because the same functionality exists as FileVault
    on Apple''s Mac OS X and is also a subset of the Bitocker system that debuted
    in Windows Vista. (The directory encryption system used in Ubuntu is called cryptfs,
    which is decidedly less punchy name. We''re working on it.)'
