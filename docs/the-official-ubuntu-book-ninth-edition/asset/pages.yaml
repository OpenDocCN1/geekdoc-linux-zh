  md: '# Online Summits and Sprints


    Since Ubuntu was first released, there have been several public developer summits
    and sprints organized and funded by Canonical. Highlights include:


    +   - The Mataró Sessions in Mataró, Catalonia, Spain, in December 2004—the first
