  md: '# Parley


    Parley, the digital flash card, allows you to easily remember things utilizing
    the spaced repetition learning method, otherwise known as flash cards. Features
    include different testing types, fast and easy setup, multiple languages, the
    ability to share and download flash cards, and much more.


    # Step


    Step is an interactive physics simulator that allows you not only to learn but
    also to feel how physics works. By placing bodies on the scene and adding some
    forces such as gravity or springs, you can simulate the law of physics, and Step
    will show you how your scene evolves.


    # Blinken


    Blinken (Figure 4-29) takes you back, back to the 1970s, as a digital version
    of the famous Simon Says game. Watch the lights, listen to the sounds, and then
    try to complete the sequence in order. Blinken provides hours of fun with the
    added benefit of learning.


    ![](img/81489f896cf4aa863894a21fbe4968b0_169_0.png)


    Figure 4-29 Blinken'
