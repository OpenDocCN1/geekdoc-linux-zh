  md: '# Chapter 10 Ubuntu, Convergence, and Devices of the Future


    The near future will certainly bring more innovations centered on phones, tablets,
    and their move toward convergence. To find the latest news and learn about the
    current devices, visit www.ubuntu.com/phone and www.ubuntu.com/tablet.


    # The Internet of Things and Beyond


    The technologies that are now a pervasive presence in our lives have evolved quickly.
    Our lives are enriched by smartwatches that track our steps and heartbeats and
    share with our friends, light bulbs that turn on and off or dim with control from
    a smartphone, and intelligent thermostats that learn from residents'' typical
    behaviors, among many other innovations. We are constantly surrounded by technology,
    and there is a growing desire for this technology to be connected to how we live.
    We expect our light bulbs to turn on as we enter the house, and to save energy
    when no one is home. We envision a world in which applications share information
    to learn how their users interact with them.


    The first step toward achieving this vision with Ubuntu is the development of
    a very lightweight version, despite its small size, still offering the same power
    as a regular image. Ubuntu Core, a minimal version that installed only those components
    required for the system to work, was the first foray into this space. The technology
    that allows for this slim image is driven by Snaps. Snaps can be seen as the next
    evolution of the Click packages running on phones and tablets today.


    Snaps behave differently than the traditional Debian packages that have been used
    to build Ubuntu since the beginning of the era. Instead of being a packed set
    of files that is unpacked to install, the Snap package is essentially mounted
    onto the file system. Snaps then have a writable space for user data, which is
    confined by applying security profiles. Snaps ship everything they need to run,
    instead of calling out to external libraries to obtain resource. Individual Snaps
    for apps do not manipulate the Snappy Ubuntu operating system—which, it should
    be mentioned, is also a Snap itself! Between this isolation and the combination
    of logical separation, AppArmor profiles, seccomp, and kernel namespaces, this
    arrangement creates a secure barrier between the operating system and apps. Nevertheless,
    Snaps are not completely isolated; a series of interfaces allow'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'them to communicate, share specifically defined resources, and access particular
    hardware. In the resulting ecosystem, making packages for Snappy Ubuntu Core is
    considerably easier than creating traditional Debian packages. In fact, using
    the tool called Snapcraft, a package can be made from existing software in a matter
    of minutes. In turn, it is now considerably easier to create appliances and devices
    with Ubuntu at the core.


