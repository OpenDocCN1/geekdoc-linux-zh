- img_proc: true
  md: '# Bazaar 259


    ![](img/81489f896cf4aa863894a21fbe4968b0_297_0.png)


    **Figure 9-16** Bazaar Explorer (can be installed from the GNOME Software Center)


    have a single place where the code is stored. Only certain people can access this
    place and change the code there. A distributed revision control system is different
    in that there is no single place for code storage. Each branch a developer is
    working on is considered equal, and they all take code from each other. This system
    is much like a number of equal merchants at a bazaar—hence the name.


    Bazaar started out as a fork of the Arch distributed revision control system.
    (A fork means that the developers disagree on where to take the program, and they
    break into different groups to work toward each group’s different goals.) However,
    Bazaar 2 was completely rewritten, as it found that the then-current code did
    not work in the long term.


