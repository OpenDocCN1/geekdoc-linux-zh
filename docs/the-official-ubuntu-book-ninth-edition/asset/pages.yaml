  md: '# Chapter 9 ■ Ubuntu-Related Projects and Derivatives


    Rosetta is a Web-based version of a "PO" file editor. In other words, it provides
    a simple mechanism by which translators can view a list of untranslated phrases
    or strings and then translate each of them into their language. At the moment,
    the system works only with translations from English. Rosetta’s non-Web based
    counsell include Kbabel and Gtranslate, of which can be downloaded and installed
    on Ubuntu. By putting this functionality on the Web and integrating it into the
    archive management scripts, Rosetta lowers the barrier of entry for translation
    and increases the chance that a translation will make it into the distribution.


    Rosetta includes each of the translatable strings contained in every application
    in Ubuntu. When new software is uploaded into Ubuntu, Rosetta will check to see
    if any strings have changed or been added. Changes to a string that has been previously
    translated will result in the translation marked as fuzzy until a translator can
    check the translation and the new string, make any necessary changes, and mark
    the translation as no longer fuzzy. By tracking new strings, Rosetta can easily
    prompt translators with new strings to translate as they appear as well provide
    statistics on the percentage of strings within a particular application or within
    all of Ubuntu that have been translated into a particular language.


    As users translate strings, they build positive “karma” within the system—an innovation
    that has now been deployed to many other parts of Launchpad. Users can also work
    together in localization teams (called l10n teams because the word localization
    has 10 letters between its first and last letters). Rosetta provides a great way
    for Ubuntu users to get involved in the distribution. Anybody who knows English
    and another language can begin contributing. Because the system is integrated
    into Launchpad, users do not need to submit their translations a second time to
    have them included in Ubuntu—the project already has them. After they are submitted
    in Rosetta and approved, new translations are automatically pushed out to users
    who use Ubuntu in those languages.


    +   **TIP**

    Translations can be found at https://translations.launchpad.net.'
  merge: -1
