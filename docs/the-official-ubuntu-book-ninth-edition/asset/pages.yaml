  md: Ubuntu Members are responsible for confirming, by voting, all nominations to
    the Ubuntu Community Council. They may also be asked by the Community Council
    to vote on resolutions put to the general membership. In exchange, Members gain
    the right to an @ubuntu.com e-mail address and the right to carry Ubuntu business
