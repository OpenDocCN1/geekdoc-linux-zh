    run only if the previous commands succeed (or not). If you want the commands to
    run one after the other regardless of whether preceding commands succeed, place
    a semicolon (;) between the commands. For example, if you want to get information
    about your hardware, you could run `1spci;1lsusb`, which would output information
    on your PCI buses and USB devices in sequence.


    However, if you need to conditionally run the commands based on whether the previous
    command has succeeded, insert `&&` between commands. An example of this is building
    a program from source, which is traditionally done with `./configure`, make, and
    sudo make install. The commands make sudo make install require that the previous
    commands have completed successfully, so you would use `./configure && make &&
    sudo make install.


