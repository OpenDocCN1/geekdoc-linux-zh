    # Inkscape


    Package name: inkscape

    Windows/OS equivalents: Adobe Illustrator, Adobe Freehand, Inkscape


    Inkscape is a drawing and graphic creation tool, much like GIMP, but one that
    has a slightly different focus. Unlike GIMP, which works with graphics, Inkscape
    is a vector drawing tool. This means that than using a grid of pixels, each assigned
    a color, drawings are mathematically described using angles and arbitrary units.


    To get started with Inkscape, launch it by searching for it in the Dash. Very
    shortly you will see the default window with the basic canvas of either Letter
    or A4, with the default depending on where in the world you live. At the top of
    the screen, below the menus, there are three sets of toolbars. The topmost contains
    common tools like save and zoom, the second presents a series of snapping options,
    and the third contents depending on the tool selected.


