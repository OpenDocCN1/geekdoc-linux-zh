  md: 'In most cases, you probably wanted to use the Guided—Use Entire Disk option.
    This will erase everything on the hard drive in your computer and set everything
    up for you. The second option, Guided—Use Disk and Set Up LVM, allows you to use
    the Logical Volume Manager. The third choice is identical to the second option
    but also employs disk encryption, which will keep your data safer and more secure
    in some circumstances. Finally, if you want to set up specific partitions, use
    the Manual option.


    Let''s look at each of these options in turn and how they are used.


    **Guided—Use Entire Disk** When you select this option, your entire disk is partitioned
    automatically. The installer tells you that a primary and logical partition will
    be created, and then it asks if you want to go ahead and create the partitions.
    Click Yes, and you are done.


    **Guided—Use Entire Disk and Set Up LVM** Configuring LVM is covered in Chapter
    8.


    **Guided—Use Entire Disk and Set Up Encrypted LVM** is identical to the previous
    option except that it uses a secure encryption layer to provide additional security
    and protection for your data. If you choose this option, during the process you
    will be asked to provide a passphrase. Be very careful to choose one that is impossible
    to guess but that you will remember. You will need to use this passphrase to access
    your data every time you boot the computer; if you lose or forget the passphrase,
    all your data will be permanently inaccessible. There is no way to recover a lost
    or forgotten encryption passphrase.


    Disk Encryption

    You may also decide to encrypt specific partitions manually. Simply choose "Physical
    Volume for Encryption" in the "Use As:" option. Note: You never to encrypt the
    boot partition.


    **Manual** Select this option if you want to create your own partitions manually.
    Here you can create a number of different types of partitions, set their sizes,
