  md: 'THIS CHAPTER BRINGS THE history of the Ubuntu Project to life, explores that
    history, and looks to its future. If you are looking to jump right in and get
    started with Ubuntu, you can skip this and proceed immediately to Chapter 2, Installing
    Ubuntu. If you are interested in first learning about where Ubuntu comes from
