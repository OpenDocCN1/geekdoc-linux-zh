  md: '# Other Applications Not on the Education Menu


    Some educational applications are not located in the Education menu in the GNOME
    Software Center. Here are brief descriptions of three of them.


    +   - Tux Paint: Tux Paint is a drawing package for younger children. Although
    geared toward a younger audience, Tux Paint still packs in some of the more advanced
    features of drawing packages and enables users to draw shapes, paint with different
    brushes, use a stamp, and add text to the image. The Magic feature offers many
    of the more advanced tools normally found in full-fledged photo editors, such
    as smudge, blur, negative, tint, and many more. There is also the facility to
    save as print.

    - GCompris: GCompris is a set of small educational activities aimed at children
    between 2 and 10 years old and is translated into more than 40 languages. Some
    of the activities are oriented and simultaneously educational. Among the activities,
    there are tasks to educate children in computer use, algebra, science, geography,
    reading, and more. More than 80 activities are available in the latest release.

    - Anagramaram: Anagramaramama is a game designed to improve children''s vocabulary.
    Players are presented with a set of letters, which they have to put in order to
    create several words. Players can shuffle the letters, as well as ask for a new
    puzzle. There is also a time limit involved, the challenge is even bigger. Apart
    from being a great pastime, Anagramaram can help users learn new words.


    # Summary


    In this chapter, you learned how to install and use just a few of the additional
    applications available for Ubuntu. Although this chapter merely scratched the
    surface of what each application can do, you should have enough of an understanding
    of each to get started with them, and the Further Resources sections should help
    you become an expert. Beyond the packages described in this chapter, a vast universe
    of programs is available.'
  merge: -1
