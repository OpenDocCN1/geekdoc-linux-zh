- img_proc: true
  md: 'Keeping data on separate partitions gives you, the administrator, an expensive
    choice of filesystems you use for particular purposes. For instance, you might
    choose to put /tmp on ReiserFS for its superior handling of many files in a directory
    and excellent performance on small files, but you might keep /home and /var ext3
