- img_proc: true
  md: 'Ubuntu, like other contemporary distros, offers a custom installer, a framework
    including software and servers to install new software once the system has been
    installed, a standard configuration method through which many programs can be
    configured, a standard method through which users can report bugs in their software,
    and much more. Frequently, distributions also contain large repositories of software
    on servers accessible through the Internet. To get a sense of scale, Ubuntu includes
    more than 40,000 pieces of software on its central servers; each piece of software
    is customized lightly and tested to work well with all of the other software on
    the system. The number of software fragments grows daily.


    What''s important to realize is the creators of distributions do not, for the
    most part, write or create the applications you use. The Ubuntu team did not write
    Linux, and it did not write GNU—although individuals on the team have contributed
    to both projects. Instead, the Ubuntu team takes GNU, Linux, and thousands of
    other applications and then tests and integrates them to be accessible under a
    single installer. Ubuntu is the glue that lets you take a single CD, install hundreds
    separate pieces of software, and have those fragments work together as a single,
    integrated desktop system. If you were to pick up a CD of another distribution
    such as Debian, Red Hat, or Novell, the software installed would be nearly identical
    to the software in Ubuntu. The difference would be in the way the software is
    installed, serviced, upgraded, and presented and the way integrates with other
    pieces of software on the system.


    # An Ecosystem of Distributions


    Many of GNU/Linux distributions are in active use today. A quick look at Distrowatch''s
    database (distrowatch.com) demonstrates the staggering number and growth of distributions.
    One of the first GNU/Linux distributions was called Softland Linux System (SLS).
    For a number of reasons, a programmer named Patrick Volkerking he could improve
    on SLS. Because SLS was free software, Volkering had the freedom to create a derivative
    version of SLS and distribute it. Volkering did this when he took SLS''s code
    and used it as the framework or model upon which to create his own variant Slack.
    Subsequently, Slack became the first widely successful GNU/Linux distribution
    and is maintained to this day.'
