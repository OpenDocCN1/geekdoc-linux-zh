  md: '# Praise for Previous Editions of The Official Ubuntu Book


    “The Official Ubuntu Book is a great way to get you started with Ubuntu, giving
    you enough information to be productive without overloading you”


    John Stevenson, DZone book reviewer


    “OUB is one of the best books I’ve seen for beginners.”


    —Bill Blinn, TechByWorldwide


    “This book is the perfect companion for users new to Linux and Ubuntu. It covers
    the basics in a concise and well-organized manner. General use is separated from
    troubleshooting and error-handling


    —Thomas Petrucha, Ubuntu User Group


    “I have recommended this book to several users who I regularly on the use of Ubuntu.
    All of them have been satisfied with their purchase and have even able to use
    it to help them in their journey along the way.”


    —Chris Crisafulli, Ubuntu LoCo Council, Florida Local Community Team


    “This text demystifies a very powerful Linux operating system... In just a few
    weeks of having it, I’ve used it as a quick reference half dozen times, saved
    me the time I would have spent scouring the Ubuntu forums online.”


    —Darren Frey, Houston Local User Group


    “This is a book that the new Ubuntu user would find in getting started and the
    more experienced computer user would find informative enough to keep as a reference
    manual. I also enjoyed the computing humor.”


    —Dr. Gregory Chapelle, General Atomics, Electromagnetics Division, San Diego,
    California


    “In short, this book is something that I can honestly recommend to anyone using
    Ubuntu. It works great as a reference and equally well as a how-to guide. I respect
    the work that’s been done, and I can’t overstate how knowledgeable the authors
    are, as well as the reviewers.”


    —Paul Tagiamonte, Ubuntu Member, and Debian Developer'
