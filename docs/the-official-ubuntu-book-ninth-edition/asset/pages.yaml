  md: '# Adding and Removing Programs and Packages


    No operating system or piece of software is perfect. In addition, new features
    may be added that users want or need. Because of this, developers periodically
    release security and other updates to software. These updates are placed into
    the Ubuntu repositories and are easy to install.


    Most of the updates to your machine will be security related. In other words,
    the developers have found a weakness in a particular program in Ubuntu and have
    released a fix for it. A small number of updates are also released to fix some
    critical bugs. For a home user, there is generally no reason not to install these
    updates right away, as not installing them may leave your computer open to security
    breaches.


    > Although Ubuntu is significantly more secure than the main concerns of some
    operating systems, such as fearing viruses and spyware, no computer is perfectly
    secure because no software is perfect.


    When problems are discovered that could lead to security issues, like buffer or
    remote exploits, they are fixed and as quickly as possible, even though the danger
    is usually remote. Ubuntu developers also have a very strict policy about not
    putting newly released versions of programs with significant and untested function
    changes or new features into stable versions of Ubuntu. This practice keeps your
    system stable by not introducing new problems.


    # Installing Updates


    Ubuntu checks the Ubuntu repositories once a day to see if there are any new versions
    of software you have installed, and it tells you when you need to update your
    machine. If security updates exist, a pop-up window will appear. If other updates
    are found, they will also be made available. You can check whether updates are
    available using the Software Updater application, which can be found on the Dash.
    The entry will either say “Software Up to Date” or inform you of available updates.


    Ubuntu 16.04 handles package updates by launching Software Updater. Users are
    notified of security updates on a daily basis and are also notified'
  merge: -1
