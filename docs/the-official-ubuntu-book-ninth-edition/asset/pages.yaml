    # # Understanding How Linux Stores and Organizes Files


    If you have not used Linux before, the way that Linux stores and organizes files
    is likely to be new to you, because the layout is quite different from Windows
    and Mac OS X.


    > > TIP Folders and Directories

    When reading about file management, don''t get confused by the terms *folders*
    and *directories*—both words describe the same thing.


    In the Windows world, each disk drive is labeled with an identifying letter such
    as C: for your hard disk and D: for the CD/DVD drive. In the Linux world, however,
    everything is part of the same filesystem organization. Such, if you have two
    or three hard disks, a CD drive, and a USB stick all plugged in, they will all
    be part of the same folder structure.


    The diagram in Figure 6-7 should give you an idea of how everything hangs together.


    Right at the top of the tree is the root folder, referred to as /. Inside this
    folder are a number of special system folders, each with a specific use. As'
