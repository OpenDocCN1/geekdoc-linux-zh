    # Mailing Lists


    The most important venue for communication in Ubuntu is the Ubuntu mailing lists.
    These lists provide the space where all announcements are made and development
    discussions take place. There are, at the time of this writing, more than 300
    active, public e-mail lists. This number is constantly growing. However, great
    care is taken by the Ubuntu Community Council to ensure that this list stays current
    as the community continues to enjoy its growth.


    An up-to-date, full page of mailing lists for Ubuntu can be found at https://lists.ubuntu.com,
    where users can see a list of available mailing lists, view archived discussions,
    and subscribe to lists through a Web interface.


    Lists are one of the oldest forms of communication by e-mail. A mailing list provides
    a single e-mail address that, when mailed to, will then relay the received message
    to a large number of people. In Ubuntu, lists are topical, and individuals can
    subscribe to a mailing list if they want to receive information on the list''s
    topic. All mailing lists at Ubuntu are hosted at http://lists.ubuntu.com.


    With a few exceptions (e.g., the e-mail list for the Community Council), anybody
