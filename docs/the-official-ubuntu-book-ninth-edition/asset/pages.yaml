  md: 'In an APT repository, the software is generally frozen—that is, it will not
    receive updates for a specific release cycle except perhaps security updates or
    minor bug fix updates, and even then the updates are stored in another repository
    (e.g., precise-main or precise-security). With Juju, charms can be written by
    anyone and can be updated within a release cycle for the charm store. The charm
    store isn''t frozen the way APT repositories are. This is important, especially
    for those users who (wisely) choose to run an LTS release of Ubuntu for their
    servers and who otherwise might need to wait several years before they can install
    a new version of desirable software until they upgrade their Ubuntu release version
    to the next LTS or find a PPA with the software in.


    So, let''s say you are working on a development version of Zookeeper and want
    to quickly create a cloud server instance with the development deployed to instead
    of the stable version. You could simply use the following series of commands instead
    of the previous set:


    ```

    $ juju bootstrap

    $ juju deploy zookeeper

    $ juju set zookeeper source=dev

    $ juju expose zookeeper

    ```


    By adding only one line, you are deploying the development version! The ability
    to easily specify the source from which to deploy is useful.


    Charm authors are given the ability to write these details into their charms.
    Specifics like versions, sources, and so on are all there. If you want to install
    nodejs, there is no need to search all for someone''s install script in a blog
    post or a pastebin code snippet; instead, you just use that person''s Juju charm.
    Simple. The charm includes information like which PPA to use and the install script
    necessary.


    Allowing anyone to give you a charm to install software could be dangerous, some
    safety and security mechanisms are built in. This is the second reason for the
    store (after convenience for end users). Charms included in the Juju store go
    through a community peer review process and an automated build process test for
    failures. Anyone can write charms for their'
