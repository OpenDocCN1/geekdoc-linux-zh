- img_proc: true
  md: '# Advanced Topics 225


    Fundamentally, virtualization is a way to turn one computer into many. (Erudite
    readers will note this is precisely the opposite of the Latin motto on the Seal
    of the United States, “E Pluribus Unum,” which means of many, one.” Some technologies
    match that description, too, like Single Image [SSI] grids. But if we talked about
    virtualization in Latin, our motto was “Ex Uno Plura.”) Why is it useful to turn
    one computer into many?


    Back in the 1960s, servers were huge and extremely expensive, and no one wanted
    to buy more of them than were absolutely necessary. It soon became clear that
    a single server, capable of running different operating systems at once, would
    allow the same hardware to be used by different people with different needs, which
    meant fewer hardware purchases, which meant happier customers with less devastated
    budgets. IBM was the first company to offer this as a selling point, introducing
    virtualization in its IBM 7044 and IBM 704 models, and later in the hardware of
    its Model 67 mainframe. Later, the industry largely moved away from mainframes
    and toward cheap racks, which the industry needed most. If you needed to run separate
    operating systems in parallel, you just bought two servers. But eventually Moore’s
    law caught up with us, and even small machines became so powerful that organizations
    found many of them underutilized, while more servers (though a relatively cheap
    strategy in itself) meant sizable auxiliary costs for cooling and electricity.
    This set the stage for virtualization to again become in vogue. Maybe you want
    to run Linux distributions on the same machine. Maybe you need a Linux server
    side with Windows. Virtualization delivers.


    There are four key types of virtualization. From the lowest to highest, they are
    hardware emulation, full virtualization, paravirtualization, and OS virtualization.
    Hardware emulation means running different operating systems by emulating, for,
    all of a computer’s hardware in software. This approach is very powerful and painfully
    slow. Full virtualization uses a privileged piece of software called a hypervisor
    as a broker between operating systems and the underlying hardware, and it offers
    good performance but requires special processor support on instruction sets like
    the ubiquitous x86. Paravirtualization also uses a hypervisor that supports only
    executing operating systems that have been modified in a'
  merge: -1
  pgno: 263
- img_proc: true
  md: 'special way, offering high performance in return. Finally, OS virtualization
    is more accurately termed “containerization” or “zoning” and refers to operating
    systems that support multiple user spaces utilizing a single running kernel. Containerization
    provides near-native performance but isn''t really comparable to the other virtualization
    approaches because its focus isn''t running multiple operating systems in parallel
    but carving one up isolated pieces.


    The most widely used hardware emulators on Linux are QEMU and Bochs, available
    in Ubuntu as the packages qemu and bochs. respectively. The big players in full
    virtualization on Linux are the commercial offerings from VMware, IBM''s z/VM,
    and most recently, a technology KVM''s become part of the Linux kernel. In paravirtualization,
    the key contender is Xen; the OS virtualization space is dominated by the OpenVZ
    and Linux-VServer projects, though many of the needed interfaces for OS virtualization
    have gradually made their way into the Linux proper.


    Now that we''ve laid the groundwork, let''s point you in the right direction depending
    on what you''re looking for. If you''re a desktop Ubuntu user and want a way to
    safely run one or more Linux distributions (including different versions of Ubuntu!)
    or operating systems (BSD, Windows, Solaris, and so forth) for testing or development,
    all packaged in a nice interface, the top recommendation is an open source project
    out of Sun Microsystems called VirtualBox. It''s available in Ubuntu as the package
    virtualbox-ose, and its home page is www.virtualbox.org.


    ```

    $ egrep ''vmx | svm'' /proc/cpuinfo

    ```


    If that line produces any output, you''re golden. Head over to https:////help.ubuntu.com/community/KVM
    for instructions on installing and configuring KVM and its guest operating systems.'
