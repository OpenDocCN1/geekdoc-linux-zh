  md: '# Allocate Drive Space


    To prepare your hard disk to store the Ubuntu system and your files, disks are
    divided into partitions. Each partition reserves a specific portion of the hard
    disk for use by a particular operating system. As an example, you may use the
    entire hard disk for your new Ubuntu system, or you may share the disk so that
    both Windows and Ubuntu are installed. This shared scenario is known as dual-booting.
    In a dual-booting situation, your hard disk typically contains Windows partitions
    as well as Linux partitions, and when it boots gives you a menu so you can select
    to boot Windows Linux.


    In this part of the installer, you create the partitions for your new system.
    This can be the trickiest part of the installation as well as the most dangerous.
    If you have existing partitions (such as a Windows installation) on the disk,
    it is highly recommended that you back up your important files.


    > Seriously, We Mean It

    Really, really, do back up any important files. If you make a mistake in this
    part of the installation, you could lose your files and stop your system from
    booting.


    # Deciding How You Would Like to Set Up Your Partitions Before You Create Them


    If you have a clear idea of how your hard disk should be partitioned, it is easier
    to get everything up and running quickly.


    There are two especially common methods of partitioning:


    +   - Only Ubuntu on the disk: If you are installing only Ubuntu on the disk and
    are happy to wipe the entire disk, your life is simple. Ubuntu can do all the
    work for you.\- Dual-booting: If you are installing to a computer that has multiple
    operating system options, you will partition your hard drive and install each
    operating system to its own partition.


    Regardless of whether you will install only Ubuntu on the disk or you will dual-boot,
    you need to either confirm that Ubuntu may use the entire disk or enter your desired
    partitioning scheme, beginning in Figure 2-3.'
  merge: -1
  pgno: 81
