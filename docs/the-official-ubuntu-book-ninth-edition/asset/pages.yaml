  md: 'UBUNTU IS NOT MERELY a complete operating system; it is also the center of
    a growing ecosystem of distributions. Some, referred to as the partner projects,
    work closely with and within Ubuntu. Others prefer to work on the edges of the
    Ubuntu project by developing official Flavors, which share the Ubuntu software
    sources but are created to highlight a specific selection of software or use case,
    such as the Ubuntu Studio project, which focuses on multimedia creation and editing.
    Others, the Lubuntu project, are created by a community of users with specific
    desires.


    Still others are created for reasons connected to the international nature of
    Linux and open source software. While most Ubuntu development happens in English,
    there are large developer and user communities in other languages and countries.
    Thus, a derived distribution might spring up to satisfy that need. There are derived
    distributions like Christians, children, people with slow computers, and people
    who prefer to have an Ubuntu system optimized for any of several alternative user
    interfaces or for use in several different schools and government bureaucracies
    around the world. Should you use any of these over Ubuntu? We cannot answer that
    for you. Some of these projects are fully within and, as a result, not mutually
    exclusive from Ubuntu; others are based on distinct projects. One may be more
    appropriate than another depending on your preferences or circumstances. You can
    mix, match, and sample these distributions until you find one that works for you.
    As we mentioned in Chapter 1, Ubuntu sees these derivatives as a sign of a healthy
