  md: '# Chapter 3 Getting Started with Ubuntu


    TIP


    Vendor Lock-In?

    In the proprietary software world, it is common for each application to have its
    own closed file format that only the vendor knows how to implement. When a person
    uses the software to create documents, the closed file format means that that
    specific tool can read and write the format. As long as you want to access your
    documents, you need that tool. This is known as vendor lock-in.


    To combat this problem, the LibreOffice suite (and the vast majority of other
    open source applications) uses an open file format that is publicly documented.
    In fact, the format is a published standard under ISO/IEC 26300:2006. As a consequence,
    other applications can implement the OpenDocument file format, and you can be
    safe in the knowledge that your documents will always be available and not locked
    in to any specific tool.


    Another useful feature wed into LibreOffice is the capability to save your documents
    in the Adobe PDF format. PDF files have become increasingly used in the last few
    years and are useful for sending people documents that should not change (such
    as invoices). PDFs provide a high-quality copy of the document and are well supported
    across all operating systems. This makes PDFs ideal for creating catalogs, leaflets,
    and flyers. To save a document as a PDF file, click the PDF button on the main
    toolbar (next to the printer icon). Click the button, enter a filename, and you
    are done. Simple.


