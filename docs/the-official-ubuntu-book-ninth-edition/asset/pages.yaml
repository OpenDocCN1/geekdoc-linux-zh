    # Stellarium


    With a default catalog of more than 600,000 stars, Stellarium is a powerful planetarium
    designed to show you exactly what you would see with the naked eye, binoculars,
    or telescope.


    In keeping with the multicultural nature of Ubuntu and the open source world,
    Stellarium can display not only the constellations from the Greek'
