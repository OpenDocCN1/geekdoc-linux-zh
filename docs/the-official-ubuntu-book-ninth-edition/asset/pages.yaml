  md: '# Other Distributions


    Some distributions generally work outside of the Ubuntu community and usually
    have their own package repositories. They may not be released at the same time
    as Ubuntu. In the past, several of these derived distributions have been built
    directly upon other distributions, such as Debian, which is also the base for
    Ubuntu. The changes Ubuntu developers make in the process of creating the distribution
    have been seen as positive and as a foundation for others with custom needs or
    desires. The list of derivative distributions has grown rapidly, and as distributions
    come and go, the list is constantly in flux. In the first edition of this book,
    our list was nearly comprehensive; since then, the size of the derivative community
    has grown so much that compiling a complete list for this ninth edition is no
    longer possible. Instead, we provide a bit of the flavor of the diversity of derived
    distributions with some examples of the oldest and most visible derived distributions
    to give you an idea of the scope of the community.


    # Guadalinex


    Guadalinex is the GNU/Linux distribution developed and promoted by the regional
    government of Andalusia, the most populated autonomous community in Spain with
    almost 8 million inhabitants. It is currently one of the largest free software
    implementations worldwide, with more than 200,000 desktops—and increasing. The
    project is a consequence of the unanimous support of the Andalusian Parliament
    on the Information Society and Innovation policies approved in 2002 and 2003,
    urging all the regional institutions to promote and use free software and open
    licenses. This makes the Guadalinex initiative unique in the world.


    Guadalinex was initially released in 2003, and the first two versions were based
    on Debian. In 2005, the Guadalinex project decided to develop the third version
    deriving from Ubuntu. Guadalinex version 3 was released in January 2006 based
    on Ubuntu 5.10, making it first major Ubuntu derivative. The project is part of
    a government plan to implement free software as the default option in the public
    schools. At the beginning of 2006, this project involved 500 schools and approximately
    200,000 desktops equipped with Guadalinex and free software only. These numbers
    increase every year'
