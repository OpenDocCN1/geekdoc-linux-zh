  md: 'what''s available. Even with just a handful of servers, MAAS is a great way
    to start treating real machines in a similar way to a cloud.


    You can think of Juju as apt-get but for services that run on servers. Juju uses
    scripts, called charms, that do all the setup necessary to get a particular service
    running. Let''s say you want to run a WordPress server. All you need to do is
    deploy the correct Juju charm to the server and everything-else should get set
