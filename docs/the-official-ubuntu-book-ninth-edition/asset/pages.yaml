  md: 'UBUNTU 4.10 WAS the first public version of Ubuntu. Its installation media
    provided no obvious way to install the bare-bones OS without a full desktop environment.
    The system administrator crowds, easily irritable and feisty by nature, were greatly
    annoyed: they proclaimed Ubuntu was just a desktop distribution and sauntered
    back to their caves in contempt.


    The next release of Ubuntu that came out, Ubuntu 5.04, rectified the problem and
    allowed for installation of a minimal Ubuntu version suitable for servers. Yet
    the myth of Ubuntu as a purely desktop-oriented distribution stuck.


    Luckily, the sentiment is just that—a myth. Ubuntu is a world-class server platform
    today, providing everything you''d expect from a server OS with the human flavor
    that makes Ubuntu different. The dedicated hackers on the Ubuntu Server Team tend
    the minutiae of hardware support and testing, mercilessly beat the latest version
    of server software to make sure it''s up to snuff for inclusion in the distribution,
    look for ways to push innovation into the server field, and are available to users
    like to field feedback, questions, and cries of anguish.


    That said, setting up a server is no small task. Server administrators constantly
    deal with complex issues such as system security, fault tolerance, and data safety,
    and while Ubuntu makes these issues more pleasant to deal with, they''re not to
    be taken lightly. The aim of this chapter is not to teach you how to be a system
    administrator—we could easily fill a dozen books attempting to do that—but rather
    to give you a quick crash course. We also highlight the specific details that
    set Ubuntu Server apart from other server platforms, offer tips on some of the
    most common server uses, and give you pointers on where to find other relevant
    information.


    # # What Is Ubuntu Server?


    By the far most common reaction from users first encountering Ubuntu Server is
    one of utter and hopeless confusion. People are foggy on whether Ubuntu Server
    is a whole new distribution, an Ubuntu flavor like Kub (only for servers), or
    perhaps something else entirely.'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'Let’s clear things up a bit. The primary software source for Ubuntu and its
    flavors is called the Ubuntu archive. The archive is merely a collection of software
    packages in Debian “deb” format, and it contains every single package that makes
    up flavors such as Ubuntu, Eduntu, Xuntu, Kubuntu, and Ubuntu Server. What makes
    Kubuntu separate from Ubuntu, then, is only the set of packages from the archive
    that installer installs by default and that its DVDs carry.


    Ubuntu Server is not different. It depends on the same archive as the standard
    Ubuntu distribution, but it installs a distinctive set of default packages. Notably,
    the set of packages that make up Ubuntu is small. The installer will not install
    things such as a graphical environment or many user programs by default. Because
    all the packages for Ubuntu Server come from the same official Ubuntu archive,
    you can install any package you like later. In theory, there’s nothing stopping
    you from forming an Ubuntu Server installation into a regular Ubuntu desktop installation,
    or vice versa (in practice, this is tricky, and we don’t recommend that you try
    it). You can even go from running Kubuntu to running Ubuntu Server. The archive
    paradigm gives you maximum flexibility.


    We’ve established that Ubuntu Server just provides a different set of packages
    than Ubuntu. But what’s important about that different set? What makes Ubuntu
    Server a server platform?


    The most significant difference is the custom server kernel. This kernel employs
    an internal timer frequency of 100Hz instead of the desktop fault of 250Hz, uses
    the deadline I/O scheduler instead of the desktop’s CFQ scheduler, and contains
    a batch of other minor tweaks for virtualization, memory support, and routing.
    We’ll spare you the OS theory: The idea is to offer some extra performance and
