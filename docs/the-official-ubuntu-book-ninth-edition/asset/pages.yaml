    # Filesystem Security


    The security model for files is standardized across most UNIX-like operating systems
    and is called the POSIX model. The model calls for three broad types of access
    permissions for every file and directory: owner, group, and other. It works exactly
    the same way on any Linux distribution, which is why we won''t focus on it. For
    a refresher, consult the man pages for chmod and chown, or browse around the Internet.


