  md: '# Installing a Package


    As with the GNOME Software Center, installing packages with Synaptic is fairly
    easy. You can browse through the package list and click on the package name to
    expand its description. You will be able to see it in the box located at the bottom
    of the Synaptic window. After you find the package you wish to install, click
    the checkbox to the right of the name of the package and select Mark for Installation.
    A dialog box may pop up (Figure 4-6) showing you which dependencies (if any) need
    to be installed, you can accept these dependencies by clicking the Mark button.
    After you have selected all the desired packages, click Apply on the Synaptic
    toolbar to begin installation.


    # Removing a Package


    To remove a package, click on the box next to the name of an installed package,
    and choose Mark for Removal. As with installing a package, you may be asked to
    mark additional packages for removal (Figure 4-7). These are generally packages
    that depend on the presence of the main package you are marking for. If you wish
    to remove all the configuration files as well, choose Mark for Complete Removal.
    Bear in mind that if you decide to reinstall the package at a later date, your
    settings will not be saved, as all the configuration files will be reset. After
    you have selected the package(s) you wish to remove, click Apply on the toolbar
    to start the removal of the package(s).


    ![](img/81489f896cf4aa863894a21fbe4968b0_146_0.png)


    Figure 4-6 Pop-up on Mark for Installation'
