    #### Pulling images by digest


    So far we’ve shown you how to pull images by tag, and this is by far the most
    common way. But it has a problem - tags are mutable! This means it’s possible
    to accidentally tag an image with an incorrect tag. Sometimes it’s even possible
    to tag an image with the same tag as an existing image. This is not good!


    As an example, imagine that you’ve got an image called `golftrack:1.5` and it
    has a known bug. You pull the image, apply a fix and push the updated image back
    to your repository with the *same tag*. Take a second to understand what just
    happened there. You have an image called `golftrack:1.5` that has a bug. That
    image is being used in your production environment. You pull the image and apply
    a fix. But then comes the mistake, you push the fixed image back to its repository
    with the **same tag as the vulnerable image!** How are you going to know which
    of your production systems are running the vulnerable image and which are running
    the patched image? They both have the same tag!


    This is where *image digests* come to the rescue.


    Docker 1.10 introduced a new content addressable storage model. As part of this
    new model all images now get cryptographic content hash. For the purposes of this
    discussion we’ll refer to this hash as the *digest*. Because the digest is a hash
    of the contents of the image, it is not possible to change the contents of the
    image without the digest also changing. Put another way - digests are immutable.
    Clearly this avoids the problem we just talked about.


    Every time you pull an image, the `docker pull` command will include the image’s
    digest as part of the return code. You can also view the digests of images in
    your Docker host’s local cache by adding the `--digests` flag to the `docker images`
    command. These are both shown in the following example.


    ```

    $ docker pull alpine

    Using default tag: latest

    latest: Pulling from library/alpine

    e110a4a17941: Pull complete

    Digest: sha256:3dcdb92d7432d56604d...6d99b889d0626de158f73a

    Status: Downloaded newer image for alpine:latest

    $

    $ docker images --digests alpine

    REPOSITORY  TAG     DIGEST              IMAGE ID      CREATED       SIZE

    alpine      latest  sha256:3dcd...f73a  4e38e38c8ce0  10 weeks ago  4.8 MB

    ```


    The output above shows the digest for the `alpine` image as `sha256:3dcdb92d7432...889d0626de158f73a`.


    Now that we know the digest of the image, we can use it when pulling the image
    again. This will ensure that we get **exactly the image we expect!**


    At the moment there is no native docker command or sub-command that will retrieve
    the digest of an image from a remote registry such as Docker Hub. This means the
    only way to determine the digest of an image is to pull it by tag and then make
    a note of it’s digest. This may change in the future.


    The example below deletes the alpine:latest image from your Docker host and then
    shows how to pull it again using its digest instead of its tag.


    ```

    $ docker rmi alpine:latest

    Untagged: alpine:latest

    Untagged: alpine@sha256:3dcdb92d7432...313626d99b889d0626de158f73a

    Deleted: sha256:4e38e38c8ce0b8d9...3b0bfe8cfa2321aec4bba

    Deleted: sha256:4fe15f8d0ae69e16...b265cd2e328e15c6a869f

    $

    $ docker pull alpine@sha256:3dcdb92...b313626d99b889d0626de158f73a

    sha256:3dcdb92d7432d...e158f73a: Pulling from library/alpine

    e110a4a17941: Pull complete

    Digest: sha256:3dcdb92d7432d56604...47b313626d99b889d0626de158f73a

    Status: Downloaded newer image for alpine@sha256:3dcd...b889d0626de158f73a

    ```


    #### Deleting Images


    When you no longer need an image you can delete it form your Docker host with
    the `docker rmi` command. `rmi` is short for remove image.


    Delete the Alpine image pulled in the previous step with the `docker rmi` command.
    The example below addresses the image by its ID, this might be different on your
    system.


    ```

    $ docker rmi 4e38e38c8ce0

    Untagged: alpine:latest

    Untagged: alpine@sha256:3dcdb92d7432d56..d99b889d0626de158f73a

    Deleted: sha256:4e38e38c8ce0b8d90...3b0bfe8cfa2321aec4bba

    Deleted: sha256:4fe15f8d0ae69e169...b265cd2e328e15c6a869f

    ```


    If the image you are trying to delete is in use by a running container you will
    not be able to delete it. Stop and delete any containers before trying the remove
    operation again.


    A handy shortcut for cleaning up a system and deleting all images on a Docker
    host is to run the `docker rmi` command and pass it a list of all image IDs on
    the system by calling `docker images` with the `-q` flag as shown below.


    ```

    $ docker rmi $(docker images -q) -f

    ```


    To understand how this works, download a couple of images and then run `docker
    images -q`.


    ```

    $ docker pull alpine

    Using default tag: latest

    latest: Pulling from library/alpine

    e110a4a17941: Pull complete

    Digest: sha256:3dcdb92d7432d5...3626d99b889d0626de158f73a

    Status: Downloaded newer image for alpine:latest

    $

    $ docker pull ubuntu

    Using default tag: latest

    latest: Pulling from library/ubuntu

    952132ac251a: Pull complete

    82659f8f1b76: Pull complete

    c19118ca682d: Pull complete

    8296858250fe: Pull complete

    24e0251a0e2c: Pull complete

    Digest: sha256:f4691c96e6bba...128ae95a60369c506dd6e6f6ab

    Status: Downloaded newer image for ubuntu:latest

    $

    $ docker images -q

    bd3d4369aebc

    4e38e38c8ce0

    ```


    See how `docker images -q` returns a list containing just the image IDs of all
    images pulled locally on the system. Returning this list to `docker rmi` will
    therefore delete all images on the system as shown below.'
