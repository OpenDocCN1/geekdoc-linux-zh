    在本示例中，我们只运行了一个单一容器，因此只删除了一个（`6efa1838cd51`）。然而，该命令的工作方式与我们在上一节中用于删除单个 Docker 主机上所有镜像的
    `docker rmi $(docker images -q)` 命令相同。我们已经知道 `docker rm` 命令用于删除容器。将 `$(docker
    ps -aq)` 作为参数传递给它，实际上是传递了系统上每个容器的 ID。`-f` 标志强制执行操作，使得正在运行的容器也会被销毁。结果是……所有容器（无论运行还是停止）都将从系统中销毁并移除。


    ### 容器 - 命令


    - `docker run` 是用于启动新容器的命令。在最简单的形式下，它接受一个镜像和一个命令作为参数。镜像用于创建容器，命令则是你希望容器运行的进程或应用程序。此示例将在以前台启动一个
    Ubuntu 容器并运行 Bash shell：`docker run -it ubuntu /bin/bash`。

    - `Ctrl-PQ` 将你的 shell 从容器的终端中分离，并让容器在后台运行（`(UP)`）。

    - `docker ps` 列出所有处于运行（`(UP)`）状态的容器。如果你添加 `-a` 标志，你还会看到处于停止（`(Exited)`）状态的容器。

    - `docker exec` 允许你在运行的容器内部运行新进程。它非常用于将 Docker 主机的 shell 附加到运行中容器内部的终端。此命令将在运行的容器内启动一个新的
    Bash shell 并连接到它：`docker exec -it <container-name or container-id> bash`。

    - `docker stop` 将停止运行的容器并将其置于 `(Exited (0))` 状态。它通过向容器内 `PID 1` 的进程发送 `SIGTERM`
    来实现。如果进程在 10 秒内未清理并停止，则将发送 `SIGKILL` 以强制停止容器。`docker stop` 接受容器 ID 和容器名称作为参数。

    - `docker start` 将重启已停止（`(Exited)`）的容器。你可以给 `docker start` 容器的名称或 ID。

    - `docker rm` 将删除停止的容器。你可以通过名称或 ID 指定容器。建议在用 `docker rm` 删除容器之前，先用 `docker stop`
    命令停止容器。

    - `docker inspect` 将为你显示有关容器的详细配置和运行信息。它接受容器名称和容器 ID 作为主要参数。你也可以对 Docker 镜像使用
    `docker inspect`。


    ### 本章总结


    在本章中，我们对比了容器模型和 VM 模型。我们研究了 VM 模型的 `OS tax`（操作系统开销）问题，并看到容器模型如何带来巨大的效率，就像 VM 模型相对于物理模型带来了巨大优势一样。


    我们看到了如何使用 `docker run` 命令启动几个简单的容器，并看到了前台交互式容器与后台运行容器之间的区别。


    我们知道杀死容器内 `PID 1` 的进程就会杀死容器。我们还学习了如何启动、停止和删除容器。


    我们使用 `docker inspect` 命令查看了详细的配置元数据，完成了本章的学习。


    到目前为止一切顺利！


    在下一章中，我们将看到如何利用 Docker 1.12 引入的一些改变游戏规则的技术，在多个 Docker 主机上编排容器化应用。


    ## 7: Swarm 模式


    现在我们已经了解了如何安装 Docker、拉取镜像以及与容器交互，下一步我们需要的是一种在大规模范围内处理所有这些工作的方法。这就是编排（orchestration）和
    `swarm mode`（集群模式）派上用场的地方。


    按照，我们将采用三阶段方法：顶部是高层概述，随后是包含所有细节和示例的较长章节，最后用我们学到的主要命令列表结束。


    ### Swarm 模式 - 简要说明 (TLDR)


    跟随书中的简单示例是一回事，但在几十个或数百个 Docker 主机上运行数千个容器完全是另一回事！这正是编排大显身手的地方！


    从高角度来看，编排的核心在于自动化和简化大规模容器化应用的管理。例如：在节点故障时自动重新调度容器、在需求增加时扩展规模，以及将更新和修复平滑地推送到实时生产环境中。


    长期以来，这种编排是很困难的。虽然有 `Docker Swarm` 和 `Kubernetes` 等工具，但它们非常复杂。随后 Docker 1.12 和新的原生
    `swarm mode` 问世——一夜之间一切改变了。`swarm mode` 让所有这些编排工作变得简单得多。


    这就是快速解释。现在让我们进入细节。


    ### Swarm 模式 - 深度解析


    首先，正如章节标题所示，我们将关注 `swarm mode` —— 这是首次作为 Docker Part 1.12 出发的原生集群和编排技术。虽然存在其他的编排解决方案，但我们在这里不涵盖它们。


    #### 概念和术语


    `swarm mode` 为我们大规模规模管理容器的方式带来了一系列变化和改进。这些变化的核心是深度集成到 Docker Engine 中的原生集群技术。我们谈论的不是像
    `Kubernetes` 那种独立工具（它需要高技能的专家在现有的 Docker 基础设施之上进行配置）。不！我们在这里讨论的集群是 Docker 技术栈中真正的“一等公民”。而且它简单！


    但 Docker, Inc. 的人们并不太喜欢使用 `cluster`（集群）这个词。他们将编排的 Docker 引擎集群称为 `swarm`，而参与 `swarm`
    的 Docker 引擎被认为运行在 `swarm mode` 下。我们将尝试在书剩余部分保持一致并使用这些术语。我们还将开始使用 `single-engine
    mode`（单引擎模式）来指代不在 swarm 模式下的 Docker 引擎。


    图 7.1 显示了一个拥有 4 个节点的 `swarm`，其中节点以 `swarm mode` 运行，还有两个不在 swarm 中以 `single-engine
    mode` 运行的节点。


    ![Figure 7.1](img/figure7-1.png)


    图 7.1


    #### 向后兼容性


    引入 `swarm mode` 对于 Docker, Inc. 具有极其重要的意义。维护向后兼容同样重要！这导致他们在 Docker 1.12 中将 swarm
    mode 设为可选。Docker Engine 的标准安装将默认运行在 `single engine mode`，以确保与之前的 Docker 版本保持 100%
    的向后兼容。


    如果你是第三方集群工具类工具的用户或开发者，这是一个极好的消息。只要你让 Docker 1.12 及更高版本运行在 `single engine mode`
    下，你所有的现有工具和应用都能正常工作！然而，一旦你决定投入并将 Docker Engine 切换到 `swarm mode`，你就会面临破坏那些第三方工具和应用的风险。


    简而言之，将 Docker Engine 置于 `swarm mode` 让你拥有所有最新的编排优势，但代价是牺牲向后兼容性。


    #### Swarm 模式入门


    让我们花一两分钟解释一下 `swarm` 中的主要组件和结构。


    一个 `swarm` 由一个或多个节点（nodes）组成。这些可以是物理服务器、虚拟机或云实例。唯一的要求是 `swarm` 中的所有节点都能通过可靠网络相互通信。


    节点随后被配置为 `managers`（管理者）或 `workers`（工作节点）。`managers` 负责集群的状态，并负责向 `workers` 分发任务。`workers`
    接受来自 `managers` 的任务并执行它们。

