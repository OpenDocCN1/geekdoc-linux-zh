  raw: 'When we started the container in the previous section we told it to run the
    Bash shell (`/bin/bash`). This makes the Bash shell the **one and only process
    running inside of the container**. You can see this by running `ps -elf` from
    inside the container.


    ```

    root@3027eb644874:/# ps -elf

    F S UID   PID  PPID   NI ADDR SZ WCHAN  STIME TTY     TIME      CMD

    4 S root    1     0    0 -  4558 wait   00:47 ?     00:00:00  /bin/bash

    0 R root   11     1    0 -  8604 -      00:52 ?     00:00:00  ps -elf

    ```


    Although it might look like there are two processes running in the output above,
    there re not. The first process in the list, with PID 1, is the Bash shell we
    told the container to run. The second process in the list is the `ps -elf` command
    we ran to produce the list. This is a short-lived process that has already exited
    by the time the output is displayed on the terminal. Long story short, this container
    is running a single process - `/bin/bash`.


    > **Note:** Windows containers are slightly different and tend to run quite a
    few processes.


    This means that if you type `exit` to exit the Bash shell, the container will
    terminate. The reason for this is that a container cannot exist without a running
    process - killing the Bash shell would kill the container’s only process, resulting
    in the container also being killed.


    Press `Ctrl-PQ` to exit the container without terminating it. Doing this will
    place you back in the shell of your Docker host and leave the container running
    in the background. You can use the `docker ps` command to view the list of running
    containers on your system.


    ```

    $ docker ps

    CNTNR ID  IMAGE          COMMAND    CREATED  STATUS    NAMES

    302...74  ubuntu:latest  /bin/bash  6 mins   Up 6mins  sick_montalcini

    ```


    It’s important to understand that this container is still running and you can
    re-attach your terminal to it with the `docker exec` command.


    ```

    $ docker exec -it 3027eb644874 bash

    root@3027eb644874:/#

    ```


    > **Note:** You can address a container by its name or ID


    As you can see, the shell prompt has changed back to the container. If you run
    the `ps -elf` command again you will now see **two** Bash processes. This is because
    the `docker exec` command created a new Bash process and attached to that. This
    means that typing `exit` from this Bash prompt will not terminate the container
    because the original Bash process with PID 1 will continue running.


    Type `exit` to leave the container and verify it’s still running with a `docker
    ps`.


    If you are following along with the examples on your own Docker host you should
    stop and delete the container with the following two commands (you will need to
    substitute the ID of your container).


    ```

    $ docker stop 3027eb64487

    3027eb64487


    $ docker rm 3027eb64487

    3027eb64487

    ```


    #### Container lifecycle


    It’s a common myth that containers can’t persist data. They can!


    A big part of the reason people think containers aren’t good for persistent workloads
    or persisting data is because they’re so freaking good at non-persistent stuff.
    But being good at one thing doesn’t mean you can’t do other things. A lot of VM
    admins out there will remember companies like Microsoft and Oracle telling you
    that you couldn’t run their applications inside of VMs - or at least they wouldn’t
    support you if you did. I personally wonder if there’s a little bit of something
    similar with the move to containerization - are there people out there trying
    to protect their empires of persistent data and workloads from what they perceive
    as the threat of containers?


    Anyway, in this section we’ll look at the lifecycle of a container - from birth,
    through work and vacations, to eventual death.


    We’ve already seen how to start containers with the `docker run` command. Let’s
    start another one so we can walk it through its entire lifecycle.


    ```

    $ docker run --name percy -it ubuntu:latest /bin/bash

    root@9cb2d2fd1d65:/#

    ```


    That’s our container created and we named it “percy” for persistent :-S


    Now let’s put it to work by writing some data to it.


    From within the shell of your new container follow the procedure below to write
    some data to a new file in the `tmp` directory and verify that the write operation
    succeeded.


    ```

    root@9cb2d2fd1d65:/# cd tmp

    root@9cb2d2fd1d65:/tmp#

    root@9cb2d2fd1d65:/tmp# ls -l

    total 0

    root@9cb2d2fd1d65:/tmp#

    root@9cb2d2fd1d65:/tmp# echo "sysadmins FTW" > newfile

    root@9cb2d2fd1d65:/tmp#

    root@9cb2d2fd1d65:/tmp# ls -l

    total 4

    -rw-r--r-- 1 root root 14 Sep 13 04:22 newfile

    root@9cb2d2fd1d65:/tmp#

    root@9cb2d2fd1d65:/tmp# cat newfile

    sysadmins FTW

    ```


    Press `Ctrl-PQ` to exit the container without killing it.


    Now use the `docker stop` command to stop the container and put in on vacation.


    ```

    $ docker stop percy

    percy

    ```


    You can use the container’s name or ID with the `docker stop` command. The format
    is `docker stop <container-id or container-name>`.


    Now run a `docker ps`.


    ```

    $ docker ps

    CONTAINER ID   IMAGE   COMMAND   CREATED  STATUS  PORTS   NAMES

    ```


    The container is not listed in the output above because it’s in the stopped state.
    Run the same command again, only this time add the `-a` flag to show all containers
    including those that are stopped.


    ```

    $ docker ps -a

    CNTNR ID  IMAGE          COMMAND    CREATED  STATUS      NAMES

    9cb...65  ubuntu:latest  /bin/bash  4 mins   Exited (0)  percy

    ```


    Now we can see the container showing as `Exited (0)`. Stopping a container is
    like stopping a virtual machine. Although it’s not currently running, its entire
    configuration and contents still exist on the filesystem of the Docker host and
    it can be restarted at any time.


    Let’s use the `docker start` command to bring it back from vacation.


    ```

    $ docker start percy

    percy

    $

    $ docker ps

    CONTAINER ID  IMAGE          COMMAND      CREATED  STATUS     NAMES

    9cb2d2fd1d65  ubuntu:latest  "/bin/bash"  4 mins   Up 3 secs  percy

    ```


    The stopped container is now restarted. Time to verify that the file we created
    earlier still exists. Connect to the restarted container with the `docker exec`
    command.


    ```

    $ docker exec -it percy bash

    root@9cb2d2fd1d65:/#

    ```


    Your shell prompt will change to show that you are now operating within the namespace
    of the container.


    Verify that the file you created earlier is still there and contains the data
    you wrote to it.


    ```

    root@9cb2d2fd1d65:/# cd tmp

    root@9cb2d2fd1d65:/# ls -l

    -rw-r--r-- 1 root root 14 Sep 13 04:22 newfile

    root@9cb2d2fd1d65:/#

    root@9cb2d2fd1d65:/# cat newfile

    sysadmins FTW

    ```


    As if by magic the file you created is still there and the data it contains is
    exactly how you left it! This proves that stopping a container does not destroy
    the container or the data inside of it.


    Now I should point out that there are better and more recommended ways to store
    data in containers. But at this stage of our journey I think this is an effective
    example of the persistent nature of containers.


    So far I think you’d be hard pressed to draw a major difference in the behavior
    of a container vs a VM.


    Now let’s kill the container and delete it from our system.


    It is possible to delete a *running* container with a single command by passing
    the `-f` flag to `docker rm`. However, it’s considered a best practice to take
    the two-step approach of stopping the container first and then deleting it. This
    gives the application/process that the container is running a fighting chance
    of stopping cleanly. More on this in a second.


    The example below will stop the `percy` container, delete it, and verify the operation.
    If your terminal is still attached to the percy container you will need to get
    back to your Docker host’s terminal by pressing `Ctrl-PQ`.


    ```

    $ docker stop percy

    percy

    $

    $ docker rm percy

    percy

    $

    $ docker ps

    CONTAINER ID    IMAGE      COMMAND    CREATED  STATUS     PORTS      NAMES

    ```'
