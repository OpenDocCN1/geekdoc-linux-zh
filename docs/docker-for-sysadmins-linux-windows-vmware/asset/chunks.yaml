    我们即将详细介绍每一个部分，但在那之前，这里是简要说明（TLDR）：Docker 是一种运行在 Linux 和 Windows 上的软件。它负责创建、管理和编排容器。该软件作为
    GitHub 上 Docker 开源项目的一部分进行开放开发。Docker, Inc. 是一家位于旧金山的公司，也是该开源项目的整体维护者。


    好了，这就是快速版本。现在，我们将更详细地探索每一个部分。我们还会简单谈一下容器生态系统，并提到开放容器标准（OCI）。


    ## Docker, Inc.


    Docker, Inc. 是一家由出生法国的美国开发者兼企业家 Solomon Hykes（Solomon Hykes）在旧金山创立的科技初创公司。


    ![图 2.1 Docker, Inc. 标志](img/figure2-1.png)


    图 2.1 Docker, Inc. 标志。


    有趣的是，Docker, Inc. 最初是以名为 `dotCloud` 的平台即服务（PaaS）供应商身份存在的。在背后，dotCloud 平台利用了 Linux
    容器。为了帮助创建和管理这些容器，他们构建了一个绰号为“Docker”的内部工具。Docker 就此诞生了！


    2013 年，dotCloud 的 PaaS 业务陷入困境，公司需要新的转机。为了解决这个问题，他们聘请 Ben Golub 为新首席执行官，将公司重命名为“Docker,
    Inc.”，放弃了 dotCloud PaaS 平台，并开启了带着将 Docker 和容器带给世界的使命的新旅程。


    今天，Docker, Inc. 被广泛认为是一家创新科技公司，市场估值据称在 10 亿美元左右。在写作时，它已通过来自硅谷一些顶级风险投资机构的 6 轮融资筹集了超过
    1.8 亿美元。几乎所有的资金都是公司转型为 `Docker, Inc.` 之后筹得的。


    自成为 Docker, Inc. 以来，他们进行了多次小规模的收购（金额未公开），以帮助其产品和服务和服务组合的增长。


    在写作此时，Docker, Inc. 大约拥有 200-300 名员工，并举办了名为 Dockercon 的年度会议。Dockercon 的目标是聚集不断壮大的容器生态系统，并推动
    Docker 和容器技术的采用。


    在整本书中，当我们提到 Docker 公司时，将使用“Docker, Inc.”这一术语。“Docker”一词的所有其他用法将指的是该技术或开源项目。


    > **注意：** “Docker”一词源于英国英语口语，意为码头工人——即负责装卸船舶的人。


    ## Docker 运行时和编排引擎


    当大多数技术人员谈论 Docker 时，他们指的是 `Docker Engine`。


    `Docker Engine` 是运行和编排容器的底层基础设施管道软件。如果你是 VMware 管理员，你可以可以将其类比为 ESXi。就如 ESXi 是运行虚拟机的核心虚拟化程序技术一样，Docker
    Engine 是运行容器的核心容器运行时。


    所有其他 Docker, Inc. 的产品和第三方产品都接入 `Docker Engine` 并围绕其构建。图 2.2 显示了 `Docker Engine`
    位于中心。图中的所有其他产品都构建在引擎之上，并利用其核心能力。


    ![图 2.2](img/figure2-2.png)


    图 2.2


    `Docker Engine` 可以从 Docker 网站下载，也可以从 GitHub 从源码构建。它适用于 Linux 和 Windows 系统，并提供开源版本和商业支持版本。在写作此时，`Docker
    Engine` 大约每三个月发布一个新的大版本（https://github.com/docker/docker/wiki）。


    ## Docker 开源项目


    “Docker”一词也可以指开源的 `Docker 项目`。


    Docker 项目托管在 GitHub 上，你可以在 `https://github.com/docker` 查看 Docker 仓库中包含的子项目和工具列表。核心的
    `Docker Engine` 项目位于 `https://github.com/docker/docker`。


    作为一个开源项目，源代码是公开的，你可以自由地下载、、贡献、对其进行调整并使用它，只要你遵守 [Apache License 2.0](https://github.com/docker/docker/blob/master/LICENSE)
    的条款。


    如果你花时间查看项目的提交历史，你将看到基础设施技术领域的大人物，包括：红帽（RedHat）、微软、IBM、思科和 HPE。你还会看到与大型公司没有关联的个人姓名。


    该项目及其工具大部分是用 `Go` 编写的——这是 Google 开发的一种相对新的系统级编程语言，也称为 `Golang`。如果你用 Go 语言编程，你将非常适合为该项目做出贡献！


    Docker 作为开源项目的一个很好的副作用是，它很大程度上是在开放范围内开发和设计的。这消除了许多代码为私有并锁在闭门之后的旧模式。它意味着发布周期是在开放范围内发布和处理的。不再有那种保密、然后在几个月前以荒谬的仪式感提前预告的不确定的发布周期。Docker
    项目不是那样运作的。大多数事情都是公开完成并供所有人查看和贡献的。


    Docker 项目非常庞大且正势如如。它有数千个 GitHub 拉取请求、数万个 Docker 化的项目，更不用说从 Docker Hub 下载的数十亿次镜像了。该项目正字面上席卷整个行业。


    不要被迷惑了，它正被广泛使用！


    ## 容器生态系统


    Docker, Inc. 的哲学之一通常被称为“自带电池但可拆卸”。


    这种说法意味着你可以换掉许多原生的 `stuff` 并替换为第三方的 `stuff`。一个很好的例子就是网络栈。核心产品自带网络栈，但网络栈是可插拔的，这意味着你可以移除原生网络栈并替换为第三方的。


    在早期，第三方插件比原生提供的要好。然而，这为 Docker, Inc. 带来了一些业务模式挑战。毕竟，Docker, Inc. 必须在某个时刻盈利才能成为一个可持续的企业。因此，自带的电池变得越来越好。这在更广泛的生态系统中产生了涟漪，他们本可能希望
    Docker, Inc. 生产平庸的产品，并打开大门让他们进入掠夺。


    如果这曾经如此，现在已经不是了。简而言之，原生的电池仍然可以拆卸，只是拆卸的理由越来越少。


    尽管如此，容器生态系统在健康的合作与竞争中蓬勃发展。谈论容器生态系统时，你经常听到人们使用“竞合”（合作与竞争的平衡）和“友敌”（朋友与敌人混合）等术语。这太好了！**健康的竞争是创新的母亲！**


    ## 开放容器标准


    在讨论 Docker 和容器生态系统时，不能提到 [开放容器标准 - OCI](https://www.opencontainers.org)。


    OCI 是一个相对新的治理委员会，负责标准化容器基础设施的最基础组件，例如`镜像格式` 和 `容器运行时`（如果这些术语对你来说很新，不用担心，我们会在书中介绍）。


    同样，任何关于 OCI 的讨论如果不提到历史是不完整的。而正如所有的历史描述一样，你得到版本取决于谁在说。所以，这就是 Nigel 眼中的 OCI 历史版本
    :-D


