  raw: 'The most common commands used to work with Docker images are `docker pull`
    to *pull* images onto your local Docker host, `docker images` to view a list of
    the images already pulled to your Docker host, and `docker rmi` to delete images
    when you no longer need them.


    Congrats! You’ve now got half a clue what a Docker image is :-D Now it’s time
    to dig a bit deeper.


    ### Docker images - The deep dive


    We’ve mentioned a couple of times already that container images are like stopped
    containers. In fact you can stop a container and create a new image from it. With
    this in mind, images are considered *build-time* constructs whereas containers
    are *run-time* constructs.


    ![Figure 5.1](images/figure5-1.png)


    Figure 5.1


    #### Images and containers


    Figure 5.1 shows high level view of the relationship between images and containers.
    We use the `docker run` command to start one or more containers from a single
    image. However, once you’ve started a container form an image, the two constructs
    become dependent on each other and you cannot delete the image until the last
