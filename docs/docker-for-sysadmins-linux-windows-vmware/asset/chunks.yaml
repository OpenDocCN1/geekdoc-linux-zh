    ```

    $ docker rmi <image-name>

    Error response from daemon: conflict: unable to remove repository reference \

    "<image-name>" (must force) - container <container-id> is using its referenc\

    ed image <image-id>

    ```


    The whole purpose of a container is to run an application or service. This means
    that the image a container is created from must contain any OS and application
    files required to run the container. However, containers are all about being fast
    and lightweight. This means that the images they’re built from are usually small
    and stripped of all non-essential parts.


    For example, Docker images tend not to ship with 6 different shells for you to
    choose from - they’ll usually ship with a single minimalist shell. They also don’t
    contain a kernel - all containers running on a Docker host share access to the
    Docker host’s kernel. For these reasons we sometimes say images contain *just
    enough operating system*.


    An extreme example of how small Docker images can be, might be the official Alpine
    Linux Docker image which is currently down at around 5MB. That’s not a typo! It
    really is about 5 megabytes! However, a more typical example might be something
    like the official Ubuntu Docker image which is currently about 120-130MB.


    #### Pulling images


    A cleanly installed Docker host has no images in its local cache (/var/lib/docker/<storage-driver>
    on Linux hosts). You can verify this with the `docker images` command.


    ```

    $ docker images

    REPOSITORY  TAG      IMAGE ID       CREATED         SIZE

    ```


    The act of getting images onto a Docker host is called *pulling*. So if you want
    the latest Ubuntu image on your Docker host, you’d have to *pull* it. Use the
    commands below to *pull* the Alpine and Ubuntu images and then check their sizes.


    > If you haven’t added your user account to the local `docker` Unix group, you
    may need to add `sudo` to the beginning of all of the following commands.


    ```

    $ docker pull alpine:latest

    latest: Pulling from library/alpine

    e110a4a17941: Pull complete

    Digest: sha256:3dcdb92d743...3626d99b889d0626de158f73a

    Status: Downloaded newer image for alpine:latest

    $

    $ docker pull ubuntu:latest

    latest: Pulling from library/ubuntu

    952132ac251a: Pull complete

    82659f8f1b76: Pull complete

    c19118ca682d: Pull complete

    8296858250fe: Pull complete

    24e0251a0e2c: Pull complete

    Digest: sha256:f4691c96e6b...28ae95a60369c506dd6e6f6ab

    Status: Downloaded newer image for ubuntu:latest

    $

    $ docker images

    REPOSITORY  TAG      IMAGE ID       CREATED         SIZE

    ubuntu      latest   bd3d4369aebc   12 days ago     126.6 MB

    alpine      latest   4e38e38c8ce0   10 weeks ago    4.799 MB

    ```


    As you can see, both images are now present on your Docker host.


    Let’s look a bit closer at what we’ve just done.


    We used the `docker pull` command to pull the images. As part of each command
    we had to specify which image to pull. So let’s take a minute to look at image
    naming. To do that we need a bit of background on how we store images.


    #### Image registries


    Docker images are stored in *image registries*. The most common image registry
    is Docker Hub. Other registries exist including 3rd party registries and secure
    on-premises registries, but Docker Hub is the default, and it’s the one we’ll
    use in this book.


    Image registries contain multiple *image repositories*. Image repositories contain
    images. That might be a bit confusing, so Figure 5.2 shows a picture of an image
    registry containing 3 repositories, and each repository contains a few images.


    ![Figure 5.2](images/figure5-2.png)


    Figure 5.2


    Docker Hub also has the concept of *official repositories* and *unofficial repositories*.


    As the name suggests, *official repositories* contain images that have been vetted
    by Docker, Inc. This means they should contain up-to-date high quality secure
    code that is well documented and follows best practices.


    *Unofficial repositories* are like the wild-west - they’re controlled by none
    of the things on the previous list. That’s not saying everything in *unofficial
    repositories* is bad! It’s not! There’s some **great** stuff in *unofficial repositories*.
    You just need to be very careful before trusting code from them. To be honest,
    you should always be careful when getting software from the internet - even images
    from *official repositories*.


    Most of the popular operating systems and applications have their own *official
    repositories* on Docker Hub. They’re easy to spot because they live at the top
    level of the Docker Hub namespace. The list below contains a few of the *official
    repositories* and shows their URLs that exist at the top level of the Docker Hub
    namespace:


    *   **nginx** - https://hub.docker.com/_/nginx/


    *   **busybox** - https://hub.docker.com/_/busybox/


    *   **redis** - https://hub.docker.com/_/redis/


    *   **mongo** - https://hub.docker.com/_/mongo/


    On the other hand, my own personal images live in the wild west of *unofficial
    repositories* and should **not** be trusted! Below are some examples of images
    in my repositories:


    *   nigelpoulton/tu-demo - https://hub.docker.com/r/nigelpoulton/tu-demo/


    *   nigelpoulton/pluralsight-docker-ci - https://hub.docker.com/r/nigelpoulton/pluralsight-docker-ci/


    Not only are images in my repositories **not** vetted, **not** kept up-to-date,
    **not** secure, and **not** well documented… you should also notice that they
    don’t live at the top level of the Docker Hub namespace. My repositories all live
    within a second level namespace called `nigelpoulton`.


    After all of that, we can finally look at how we address images on the Docker
    command line.


    #### Image naming and tagging


    Addressing images on the command line from *official repositories* is as simple
    as giving the repository name and tag separated by a colon “:”. The format for
    `docker pull` when working with an image from an official repository is:


    `docker pull <repository>:<tag>`


    In our example form earlier we pulled an Alpine and an Ubuntu image with the following
    two commands:


    `docker pull alpine:latest` and `docker pull ubuntu:latest`


    These two commands pull the images tagged as “latest” from the “alpine” and “ubuntu”
    repositories.


    The following examples show how to pull various different images from *official
    repositories*:


    ```

    $ docker pull mongo:3.3.11

    //This will pull the image tagged as `3.3.11` form the official `mongo` repo\

    sitory.


    $ docker pull redis:latest

    //This will pull the image tagged as `latest` from the official `redis` repo\

    sitory.


    $ docker pull alpine

    //This will pull the image tagged as `latest` from the official `alpine` rep\

    ository.

    ```'
