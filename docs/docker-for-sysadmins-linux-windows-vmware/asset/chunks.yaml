    But the point to note is that although `swarm mode` was new in Docker 1.12, it’s
    not like the project recklessly dropped in thousands of lines of brand new code
    that had never seen the light of day. The underlying code has been around for
    a while and was being actively deployed in production environments.


    That all said, you should still perform your normal testing before deciding to
    run your business critical apps on it!


    ## Clean-up


    Let’s clean-up our service.


    ```bash

    $ docker service rm uber-svc

    uber-svc

    ```


    Verify the `uber-svc` is no longer running with the `docker service ls` command.


    ```bash

    $ docker service ls

    ID  NAME  REPLICAS  IMAGE  COMMAND

    ```


    ## Swarm mode - The commands


    *   `docker swarm init` is the command to create a new swarm. The node that you
    run the command on becomes the first manager in the new swarm and is switched
    to run in `swarm mode`.

    *   `docker swarm join-token` reveals the commands and tokens required to join
    workers and managers to existing swarms. To expose the command to join a new manager
    use the `docker swarm join-token manager` command, and to get the command to join
    a worker use the `docker swarm join-token worker` command.

    *   `docker node ls` lists all nodes in the swarm and lists which are managers
    and which is the leader.

    *   `docker service create` is the command to declaratively create a new service.

    *   `docker service ls` lists running services in the swarm and gives basic info
    on the state of the service and any tasks it’s running.

    *   `docker service ps` gives more detailed information about individual tasks
    running in a service.

    *   `docker service inspect` gives very detailed information on a service. It
    accepts the `--pretty` flag to limit the information returned to the most important
    information.

    *   `docker service scale` lets you scale the number of tasks in a service up
    and down.

    *   `docker service update` lets you update many of the properties of a running
    service.

    *   `docker service rm` is the command to delete a service from the swarm. Use
    it with caution as it deletes all tasks in a service without asking for confirmation.


    ## Chapter summary


    In this chapter we learned about swarm mode and how to build a swarm.


    We used the `docker swarm init` command to create a new swarm and make the node
    we ran the command on the first manager of that swarm. We then joined managers
    and workers. We learned that managers operate in an HA formation and the recommended
    number of managers is either 3 or 5.


    We learned how to declare services and run them on a swarm. We saw how network
    ports are exposed across the entire swarm allowing us to hit any node in the swarm
    and reach the service endpoint - even if the node we hit wasn’t running a task
    for the service.


    We wrapped the chapter up by scaling a service up then down, and pushing an update
    to a live service using a rolling update.


    ## 8: What next


    Hopefully you’re now comfortable talking about Docker and working with it.


    Taking your journey to the next step is simple in today’s world. It’s insanely
    easy to spin up infrastructure and workloads in the cloud where you can build
    and test Docker until you’re a world authority!


    You can also head over to my video training courses at [Pluralsight](http://app.pluralsight.com/author/nigel-poulton).
    If you’re not a member of Pluralsight then become one! Yes it costs money, but
    its definitely a service where you get value for your money! And if you’re unsure…
    they always have a free trail period where you can get access to my courses for
    free for a limited period.


    I’d also recommend you hit events like [Dockercon](https://www.dockercon.com)
    and your local [Docker meetups](https://www.docker.com/community/meetup-groups).


    ## Feedback


    A massive thanks for reading my book. I really hope it was useful for you!


    On that point, I’d love your feedback - good and bad. If you think the book was
    amazing I’d love you to tell me and others! But I also want to know what you didn’t
    like about it and how I can make the next version better!!! Please leave comments
    on the book’s feedback pages and feel free to hit me on [Twitter](https://twitter.com/nigelpoulton)
    with your thoughts!


    ![](images/figure8-1.png)


    Thanks again for reading my book and good luck driving your career forward!!

    '
