    In this example we only had a single container running, so only one was deleted
    (`6efa1838cd51`). However, the command works the same way as the `docker rmi $(docker
    images -q)` command we used in the previous chapter to delete all images on a
    single Docker host. We already know the `docker rm` command deletes containers.
    Passing it `$(docker ps -aq)` as an argument effectively passes it the ID of every
    container on the system. The `-f` flag forces the operation so that running containers
    will also be deconstructed. Net result… all containers, running or stopped, will
    be destroyed and removed from the system.


    ### Containers - The commands


    - `docker run` is the command used to start new containers. In its simplest form
    it accepts an image and a command as arguments. The image is used to create the
    container and the command is the process or application you want the container
    to run. This example will start an Ubuntu container in the foreground and running
    the Bash shell: `docker run -it ubuntu /bin/bash`.

    - `Ctrl-PQ` will detach your shell from the terminal of a container and leave
    the container running `(UP)` in the background.

    - `docker ps` lists all containers in the running `(UP)` state. If you add the
    `-a` flag you will also see containers in the stopped `(Exited)` state.

    - `docker exec` lets you run a new process inside of a running container. It’s
    useful for attaching the shell of your Docker host to a terminal inside of a running
    container. This command will start a new Bash shell inside of a running container
    and connect to it: `docker exec -it <container-name or container-id> bash`.

    - `docker stop` will stop a running container and put it in the `(Exited (0))`
    state. It does this by issuing a `SIGTERM` to the process with `PID 1` inside
    of the container. If the process has not cleaned up and stopped within 10 seconds,
    a `SIGKILL` will be issued to forcibly stop the container. `docker stop` accepts
    container IDs and container names as arguments.

    - `docker start` will restart a stopped `(Exited)` container. You can give `docker
    start` the name or ID of a container.

    - `docker rm` will delete a stopped container. You can specify containers by name
    or ID. It is recommended that you stop a container with the `docker stop` command
    before deleting it with `docker rm`.

    - `docker inspect` will show you detailed configuration and runtime information
    about a container. It accepts container names and container IDs as its main argument.
    You can also use `docker inspect` with Docker images.


    ### Chapter summary


    In this chapter we compared and contrasted the container and VM models. We looked
    at the `OS tax` problem of the VM model and saw how the container model can bring
    huge efficiencies in much the same way as the VM model brought huge advantages
    over the physical model.


    We saw how to use the `docker run` command to start a couple of simple containers,
    and we saw the difference between interactive containers in the foreground versus
    containers running in the background.


    We know that killing the process with `PID 1` inside of a container will kill
    the container. And we’ve seen how to start, stop, and delete containers.


    We finished the chapter using the `docker inspect` command to view detailed configuration
    metadata.


    So far so good!


    In the next chapter we’ll see how to orchestrate containerized applications across
    multiple Docker hosts with some game changing technologies introduced in Docker
    1.12.


    ## 7: Swarm mode


    Now that we know how to install Docker, pull images, and work with containers,
    the next thing we need is a way to work with it all at scale. That’s where orchestration
    and `swarm mode` comes into the picture.


    As usual, we’ll take a three-stage approach with a high level explanation at the
    top, followed by a longer section with all the detail and some examples, and we’ll
    finish things up with a list of the main commands we learned.


    ### Swarm mode - The TLDR


    It’s one thing to follow along with the simple examples in this book, but it’s
    an entirely different thing running thousands of containers on tens or hundreds
    of Docker hosts! This is where orchestration comes to the rescue!


    At a high level, orchestration is all about automating and simplifying the management
    of containerized applications at scale. Things like automatically rescheduling
    containers when nodes break, scaling things up when demand increases, and smoothly
    pushing updates and fixes into live production environments.


    For the longest time orchestration like this was hard. Tools like `Docker Swarm`
    and `Kubernetes` were available, but they were complicated. Then along came Docker
    1.12 and the new native `swarm mode` - and overnight things changed. `swarm mode`
    made all this orchestration stuff a whole lot easier.


    That’s the quick explanation. Now let’s get into the detail.


    ### Swarm mode - The deep dive


    First up, as the title of the chapter suggests, we’re going to be focusing on
    `swarm mode` - the native clustering and orchestration technologies that first
    shipped as Docker Part 1.12\. Other orchestration solutions exist, but we’re not
    covering those here.


    #### Concepts and terminology


    `swarm mode` brought a load of changes and improvements to the way we manage containers
    at scale. At the heart of those changes is native clustering that’s deeply integrated
    into the Docker Engine. We’re not talking about something like `Kubernetes` that’s
    a separate tool requiring a highly skilled specialist to configure it on top of
    existing Docker infrastructures. No! The clustering we’re talking about here is
    a true first-class citizen in the Docker technology stack. And it’s simple!


    But the folks at Docker, Inc., don’t really like using the term `cluster`. They’re
    calling a cluster of orchestrated Docker engines a `swarm`, and the Docker engines
    participating in a `swarm` are said to operate in `swarm mode`. We’ll try to be
    consistent and use these terms throughout the remainder of the book. We’ll also
    start using the term `single-engine mode` to refer to Docker engines not in `swarm
    mode`.


    Figure 7.1 shows a 4-node `swarm` with nodes running in `swarm mode`, as well
    as two nodes not in the swarm operating in `single-engine mode`.


    ![Figure 7.1](images/figure7-1.png)


    Figure 7.1


    #### Backward compatibility


    Introducing `swarm mode` was massively important for Docker, Inc. But so is maintaining
    backward compatibility! This led them to make swarm mode optional in Docker 1.12\.
    A standard installation of the Docker Engine would default to running in `single
    engine mode`, ensuring 100% backward compatibility with previous versions of Docker.


    This is great news if you’re a user or developer of 3rd party clustering tools
    and the likes. As long as you keep Docker 1.12 and later in `single engine mode`,
    all of your existing tools and apps will work as normal! However, as soon as you
    take the plunge and put your Docker Engine into `swarm mode` you risk breaking
    those 3rd party tools and apps.


    In short, putting a Docker Engine into `swarm mode` gives you all of the latest
    orchestration goodness, it just comes at the price of backward compatibility.


    #### Swarm mode primer


    Let’s take a minute or two to explain the major components and constructs in a
    `swarm`.


    A `swarm` consists of one or more `nodes`. These can be physical servers, VMs,
    or cloud instances. The only requirement is that all nodes in a `swarm` can communicate
    with each other over reliable networks.


    Nodes are then configured as `managers` or `workers`. `managers` look after the
    state of the cluster and are in charge of dispatching tasks to `workers`. `workers`
    accept tasks from `managers` and execute them.

