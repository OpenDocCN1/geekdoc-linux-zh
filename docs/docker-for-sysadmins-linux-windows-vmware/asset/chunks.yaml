  trans: "\n让我们来看如何在 Linux 上安装 Docker。\n\n这是生产环境中最常见的安装方式，而且出乎意料简单简单。常见的困难是不同 Linux\
    \ 发行版之间（如 Ubuntu 与 CentOS）之间的细微差异。本节中使用的示例基于 Ubuntu Linux，但应该适用于上游和下游分支。它也应该适用于\
    \ CentOS 及其上游和下游分支。无论你的 Linux 机器是自己数据中心里的物理服务器、位于地球另一端公有云上的实例，还是笔记本电脑上的虚拟机，完全没有任何区别。唯一的要求是机器必须运行\
    \ Linux 并且能够访问 https://get.docker.com。\n\n在 Linux 上安装 Docker 之前，你首先需要决定想安装哪个通道的\
    \ Docker。Docker 目前有三个通道：\n\n* 稳定版 [Stable](https://get.docker.com/)\n* 实验版 [Experimental](https://experimental.docker.com/)\n\
    * 测试版 [Test](https://test.docker.com/)\n\n在下面的示例中，我们将使用 `wget` 命令调用安装稳定版通道的脚本。如果你想安装不同的通道，只需将\
    \ `https://get.docker.com` 替换为列表中相应的通道即可。\n\n1. 在你的 Linux 机器上打开一个新的 shell。\n2.\
    \ 使用 `wget` 从 `https://get.docker.com` 获取 Docker 安装脚本并将其传递给你的 shell。\n\n```\n\
    $ wget -qO- https://get.docker.com/ | sh\n\nmodprobe: FATAL: Module aufs not found\
    \ in directory /lib/modules/4.4.0-36-generic\n+ sh -c 'sleep 3; yum -y -q install\
    \ docker-engine'\n<Snip>\n```\n如果你想以非 root 用户身份使用 Docker，现在应该考虑使用类似命令将你的用户添加到\
    \ \"docker\" 组：\n\n`sudo usermod -aG docker your-user`\n\n记住，你必须注销并重新登录才能生效！\n\
    \n3. 在操作 Docker 引擎时，仅使用非 root 用户是一个良好的实践。要做到这一点，你需要将非 root 用户添加到 Linux 机器上的本地\
    \ `docker` Unix 组。下面的命令显示了如何将 `npoulton` 用户添加到 `docker` 组并验证操作是否成功。\n\n```\n$\
    \ sudo usermod -aG docker npoulton\n$\n$ cat /etc/group | grep docker\ndocker:x:999:npoulton\n\
    ```\n\n如果你已经以刚刚添加到 `docker` 组的用户身份登录，则需要注销并重新登录才能使组权限生效。\n\n恭喜！Docker 现在已安装在你的\
    \ Linux 机器上。运行以下命令验证你的安装情况。\n\n```\n$ docker --version\nDocker version 1.12.1,\
    \ build 23cf638\n$\n$ docker info\nContainers: 0\n Running: 0\n Paused: 0\n Stopped:\
    \ 0\nImages: 0\n<Snip>\nKernel Version: 4.4.0-36-generic\nOperating System: Ubuntu\
    \ 16.04.1 LTS\nOSType: linux\nArchitecture: x86_64\nCPUs: 1\nTotal Memory: 990.7\
    \ MiB\nName: ip-172-31-41-77\nID: QHFV:6HK7:VNLZ:RIKE:JWL6:BTIX:GC3V:RAVR:6AO5:RAMT:EJCI:PUA7\n\
    Docker Root Dir: /var/lib/docker\nDebug Mode (client): false\nDebug Mode (server):\
    \ false\nRegistry: https://index.docker.io/v1/\nWARNING: No swap limit support\n\
    Insecure Registries:\n 127.0.0.0/8\n```\n\n如果上述过程对你的 Linux 发行版不起，你可以去 Docker 文档网站并点击与你的发行版相关的链接。这将带你进入官方\
    \ Docker 安装说明，这些说明通常会保持最新更新。但请注意，Docker 网站上的说明倾向于使用包管理器，并且需要的步骤比我们上面使用的过程多得多。事实上，如果你用浏览器打开\
    \ https://get.docker.com，你会发现它是一个为你完成所有安装工作工作的 shell 脚本。\n\n警告：如果你从官方 Docker 仓库的其他源安装\
    \ Docker，你可能会得到一个 Docker 的分叉版本。这是因为某些供应商和发行版选择分叉 Docker 项目并开发他们自己的略微定制版本。如果你从自定义仓库安装，需要意识到这一点，因为你可能在不经意间运行着一个偏离了官方\
    \ Docker 项目的分支版本。只要这是你的意图，就不是问题。如果这不是你的意图，可能会导致你的供应商所做的修改和修复无法回传到官方 Docker 项目。在这些情况下，你无法从\
    \ Docker, Inc. 或其授权合作伙伴处获得安装的商业支持。\n\n### 章节总结\n\n在本章中，你学习了如何在 Windows 10、Mac\
    \ OS X 和 Linux 上安装 Docker。现在你已经知道如何安装 Docker，准备好开始处理镜像和容器了。\n\n## 4 概览\n\n在接下来的几章中，我们将进入镜像、容器和编排等细节。但在在此之前，我觉得先向你展示大局是个好主意。\n\
    \n在本章中，我们将下载镜像、启动新容器、登录容器、在容器内部运行命令，然后销毁它。这将让你对 Docker 是什么有一个良好的感觉。\n\n### 引擎检查\n\
    \n安装 Docker 时会有两个主要组件：\n\n* Docker 客户端\n* Docker 守护进程（有时称为服务器）\n\n守护进程实现了 Docker\
    \ API。在默认 Linux 安装中，客户端通过 `/var/run/docker.sock` 本地 Unix Socket 与守护进程通信。你可以通过\
    \ `docker version` 命令测试客户端和守护进程运行正常以及是否可以通信。\n\n```\n$ docker version\nClient:\n\
    \ Version:      1.12.1\n API version:  1.24\n Go version:   go1.6.3\n Git commit:\
    \   23cf638\n Built:        Thu Aug 18 05:33:38 2016\n OS/Arch:      linux/amd64\n\
    \nServer:\n Version:      1.12.1\n API version:  1.24\n Go version:   go1.6.3\n\
    \ Git commit:   23cf638\n Built:        Thu Aug 18 05:33:38 2016\n OS/Arch:  \
    \    linux/amd64\n```\n\n只要你从 `Client` 和 `Server` 组件 get 响应，就没问题。如果你从 Server 组件收到错误响应，请尝试在命令前加上\
    \ `sudo` 重试：`sudo docker version`。如果 `sudo` 有效，你需要在本章的剩余命令前加上 `sudo`。\n\n### 镜像\n\
    \n现在让我们来看镜像。\n\n目前，理解 Docker 镜像最好的方式是将其视为包含操作系统和应用程序的对象。它与虚拟机模板没有太大区别。虚拟机模板本质上是一个停止的虚拟机。在\
    \ Docker 世界中，镜像实际上是一个停止的容器。\n\n在你的 Docker 主机上运行 `docker images` 命令。\n\n```\n$\
    \ docker images\nREPOSITORY    TAG        IMAGE ID       CREATED       SIZE\n\
    ```\n\n如果你是从一个新安装的 Docker 主机开始工作，它将没有任何镜像，看起来就像上面的输出一样。\n"
