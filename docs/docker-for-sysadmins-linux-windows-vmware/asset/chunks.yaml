    Ports:\n Protocol = tcp\n TargetPort = 80\n PublishedPort = 80\n```\n\nYou should\
    \ also note a couple of things about the service’s network config. All nodes in\
    \ the swarm that are running a task for the service will have the `uber-net` overlay\
    \ network that we created earlier. We can verify this by running `docker network\
    \ ls` on any node running a task.\n\nYou should also note the `Networks` portion\
    \ of the `docker inspect` output above. This shows the `43wfp6pzea470et4d57udn9ws`\
    \ `uber-net` network as well as the swarm-wide `80:80` port mapping.\n\n#### The\
    \ future of services\n\nServices are still relatively new to Docker, but they’re\
    \ massively strategic! This means we should expect to see significant development\
    \ around them.\n\nA couple of those developments will more than likely be; the\
    \ ability to define a service in a manifest file, and to run more than just container\
    \ workloads as part of services.\n\nOn the topic of manifest files. In this chapter\
    \ we’ve shown you how to declare a service using the `docker service create` command\
    \ and passing it a lot of flags and options. In the future we should expect to\
    \ be able to pass the command a JSON or YAML file that holds the entire service\
    \ declaration. This will allow us to keep a repository of service definition files,\
    \ version control them, and easily pass them to Docker to instantiate new services.\
    \ Expect this very soon.\n\nIn the more distant future we may even see non-container\
    \ workloads running under the auspices of services. We said earlier in the chapter\
    \ that service *tasks* = containers. However, the executor component of the swarm\
    \ architecture, which currently executes container workloads, is pluggable. This\
    \ means you might be able to swap it out in the future for executors that can\
    \ run things like unikernel workloads. However, this is very forward thinking\
    \ and probably more of a long-term vision than a short-term goal.\n\n#### A quick\
    \ word on the maturity of *swarm mode*\n\n*Swarm mode* is based on the battle-hardened\
    \ and production-tested code from the Docker Swarm project. At a high level, all\
    \ of the good stuff from Docker Swarm was extracted and dumped into a re-usable\
    \ toolkit called *SwarmKit*. This was then implemented natively into the Docker\
    \ Engine, and *swarm mode* was born."
