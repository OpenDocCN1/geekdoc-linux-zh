- fmt: '

    We’re about to get into a bit of detail on each, but before we do that here’s
    the TLDR: Docker is software that runs on Linux and Windows. It creates, manages
    and orchestrates containers. The software is developed in the open as part of
    the Docker open-source project on GitHub. Docker, Inc. is a company based out
    of San Francisco and is the overall maintainer of the open-source project.


    Ok that’s the quick version. Now we’ll explore each in a bit more detail. We’ll
    also talk a bit about the container ecosystem, and we’ll mention the Open Container
    Initiative (OCI).


    ## Docker, Inc.


    Docker, Inc. is the San Francisco based technology startup founded by French-born
    American developer and entrepreneur Solomon Hykes.


    ![Figure 2.1 Docker, Inc. logo.](images/figure2-1.png)


    Figure 2.1 Docker, Inc. logo.


    Interestingly, Docker, Inc. started its life as a platform as a service (PaaS)
    provider called `dotCloud`. Behind the scenes, the dotCloud platform leveraged
    Linux containers. To help them create and manage these containers they built an
    internal tool that they nick-named “Docker”. And that’s how Docker was born!


    In 2013 the dotCloud PaaS business was struggling and the company was in need
    of a new lease of life. To help with this they hired Ben Golub as new CEO, rebranded
    the company as “Docker, Inc.”, got rid of the dotCloud PaaS platform, and started
    a new journey with a mission to bring to Docker and containers to the world.


    Today Docker, Inc. is widely recognized as an innovative technology company with
    a market valuation said to be in the region of $1BN. At the time of writing, it
    has raised over $180M via 6 rounds of funding from some of the biggest names in
    Silicon Valley venture capital. Almost all of this funding was raised after the
    company pivoted to become `Docker, Inc.`


    Since becoming Docker, Inc. they’ve made several small acquisitions, for undisclosed
    fees, to help grow their portfolio of products and services.


    At the time of writing, Docker, Inc. has somewhere in the region of 200-300 employees
    and holds an annual conference called Dockercon. The goal of Dockercon is to bring
    together the growing container ecosystem and drive the adoption of Docker and
    container technologies.


    Throughout this book we’ll use the term “Docker, Inc.” when referring to Docker
    the company. All other uses of the term “Docker” will refer to the technology
    or the open-source project.


    > **Note:** The word “Docker” comes from a British colloquialism meaning dock
    worker - somebody who loads and unloads ships.


    ## The Docker runtime and orchestration engine


    When most technologists talk about Docker, they’re referring to the `Docker Engine`.


    The `Docker Engine` is the infrastructure plumbing software that runs and orchestrates
    containers. If you’re a VMware admin, you can think of it as being similar to
    ESXi. In the same way that ESXi is the core hypervisor technology that runs virtual
    machines, the Docker Engine is the core container runtime that runs containers.


    All other Docker, Inc. and 3rd party products plug into the `Docker Engine` and
    build around it. Figure 2.2 shows the `Docker Engine` at the center. All of the
    other products in the diagram build on top of the Engine and leverage it’s core
    capabilities.


    ![Figure 2.2](images/figure2-2.png)


    Figure 2.2


    The `Docker Engine` can be downloaded from the Docker website or built from source
    from GitHub. It’s available on Linux and Windows, with open-source and commercially
    supported offerings. At the time of writing there’s a new major release of the
    `Docker Engine` approximately every three months (https://github.com/docker/docker/wiki).


    ## The Docker open-source project


    The term “Docker” can also refer to the open-source `Docker project`.


    The Docker project is hosted on GitHub and you can see a list of the sub-projects
    and tools included in the Docker repository at `https://github.com/docker`. The
    core `Docker Engine` project is located at `https://github.com/docker/docker`.


    As an open-source project, the source code is publically available and you are
    free to download it, contribute to it, tweak it, and use it, as long as you adhere
    to the terms of the [Apache License 2.0](https://github.com/docker/docker/blob/master/LICENSE).


    If you take the time to look at the project’s commit history you’ll see the who’s-who
    of infrastructure technology including; RedHat, Microsoft, IBM, Cisco, and HPE.
    You’ll also see the names of individuals not associated with large corporations.


    Most of the project and its tools are written in `Go` - the relatively new system-level
    programming language from Google also known as `Golang`. If you code in Go you’re
    in a great position to contribute to the project!


    A nice side effect of Docker being an open-source project is the fact that so
    much of it is developed and designed in the open. This does away with a lot of
    the old ways where code was proprietary and locked behind closed doors. It also
    means that release cycles are published and worked on in the open. No more uncertain
    release cycles that are kept a secret and then pre-announced months-in-advance
    to ridiculous pomp and ceremony. The Docker project doesn’t work like that. Most
    things are done in the open for all to see and all to contribute to.


    The Docker project is huge and gaining momentum. It has thousands of GitHub pull
    requests, tens of thousands of Dockerized projects, not to mention the billions
    of image pulls form Docker Hub. The project literally is taking the industry by
    storm.


    Be under illusions, Docker is being used!


    ## The container ecosystem


    One of the philosophies at Docker, Inc. is often referred to as `Batteries included
    but removable`.


    This is a way of saying you can swap out a lot of the native `stuff` and replace
    it with `stuff` from 3rd party. A good example of this is the networking stack.
    The core product ships with built-in networking. But the networking stack is pluggable
    meaning you can rip out the native networking stack and replace it with something
    else form 3rd party.


    In the early days it was common for 3rd party plugins to be better than the native
    offerings that shipped with Docker. However, this presented some business model
    challenges for Docker, Inc. After all, Docker, Inc. has to turn a profit at some
    point to be a viable long-term business. As a result, the batteries that are included
    are getting better and better. This is something that is causing ripples across
    the wider ecosystem, which it may have expected Docker, Inc. to produce mediocre
    products and leave the door wide open for them to swoop in and plunder the spoils.


    If that was once true, it’s not any more. To cut a long story short, the native
    Docker batteries are still removable, there’s just less and less reason to want
    to remove them.


    Despite this, the container ecosystem is flourishing with a healthy balance of
    co-operation and competition. You’ll often hear people use terms like `co-opetition`
    (a balance of co-operation and competition) and `frenemy` (a mix of a friend and
    an enemy) when talking about the container ecosystem. This is great! **Healthy
    competition is the mother of innovation!**


    ## The Open Container Initiative


    No discussion of Docker and the container ecosystem is complete without mentioning
    the [Open Container Initiative - OCI](https://www.opencontainers.org).


    The OCI is a relatively new governance council responsible for standardizing the
    most fundamental components of container infrastructure such as `image format`
    and `container runtime` (don’t worry if these terms are new to you, we’ll cover
    them in the book).


    It’s also true that no discussion of the OCI is complete without mentioning a
    bit of history. And as with all accounts of history, the version you get depends
    on who’s doing the talking. So this is the version of history according to Nigel
    :-D

