    \  uber-svc.11   nigelpoulton/...:v1  mgr1  Running   Running 1 min\ne2...k1j\
    \  uber-svc.12   nigelpoulton/...:v1  mgr1  Running   Running 1 min\n```\n\n通过向服务传递\
    \ `-p 80:80` 标志将确保创建一个整个集群范围的映射，将进入集群中任一节点 80 端口的流量映射到该服务中任何容器内部的 80 端口。\n\n打开网络浏览器并将其指向集群中任一节点\
    \ 80 端口的 IP 地址，即可查看在服务中运行的应用。\n\n![图 7.6](img/figure7-6.png)\n\n图 7.6\n\n你可以看到，该应用程序是一个简单的投票程序，将为“足球”或“足球”注册投票。可以将你的网络浏览器指向集群中的其他节点。你将从集群中的任一节点访问\
    \ Web 服务器，因为 `-p 80:80` 在每个主机上都创建了映射。即使在可能运行该服务任务的节点上也是如此的——**每个节点都获得了一个映射，因此可以将你的请求重定向到运行该服务的节点**。\n\
    \n现在，假设这次特定的投票已经结束，你的公司现在正在一项新调查。已为新调查创建了新的镜像并将其添加到相同的 Docker Hub 仓库中，但这次镜像的标签为\
    \ `v2` 而不是 `v1`。\n\n让我们假设你被指派分阶段将更新后的镜像推送到集群——每次 2 个容器，每批 2 个容器之间延迟 20 秒。我们可以使用以下\
    \ `docker service update` 命令来实现这一点。\n\n```\n$ docker service update \\\n   --image\
    \ nigelpoulton/tu-demo:v2 \\\n   --update-parallelism 2 \\\n   --update-delay\
    \ 20s uber-svc\n\nuber-svc\n```\n\n让我们查看该命令。`docker service update` 允许通过更新服务的期望状态来对运行的服务进行更新。这次我们给了它一个新镜像标签\
    \ `v2` 而不是 `v1`。我们使用了 `--update-parallelism` 和 `--update-delay` 标志，以确保新镜像每次推送到\
    \ 2 个任务，并且每对任务之间有 20 秒的冷却期。最后，我们告诉 Docker 对 `uber-svc` 服务执行这些更改。\n\n如果我们对该服务运行\
    \ `docker service ps`，将看到服务中的某些任务处于 `v2`，而另一些则处于 `v1`。如果我们给操作足够的时间来完成（4 分钟），所有任务最终都将达到使用\
    \ `v2` 镜像的新期望状态。\n\n```\n$ docker service ps uber-svc\nID        NAME        \
    \      IMAGE        NODE   DESIRED   CURRENT STATE\n7z...nys  uber-svc.1    nigel...v2\
    \   mgr2  Running   Running 13 secs\n0v...7e5  \\_uber-svc.1  nigel...v1   wrk3\
    \  Shutdown  Shutdown 13 secs\nbh...wa0  uber-svc.2    nigel...v1   wrk2  Running\
    \   Running 1 min\ne3...gr2  uber-svc.3    nigel...v2   wrk2  Running   Running\
    \ 13 secs\n23...u97  \\_uber-svc.3  nigel...v1   wrk2  Shutdown  Shutdown 13 secs\n\
    82...5y1  uber-svc.4    nigel...v1   mgr2  Running   Running 1 min\nc3...gny \
    \ uber-svc.5    nigel...v1   wrk3  Running   Running 1 min\n78...r7z  uber-svc.7\
    \    nigel...v1   wrk1  Running   Running 1 min\n2m...kdz  uber-svc.8    nigel...v1\
    \   mgr3  Running   Running 1 min\nb9...k7w  uber-svc.9    nigel...v1   mgr3 \
    \ Running   Running 1 min\nag...v16  uber-svc.10   nigel...v1   mgr2  Running\
    \   Running 1 min\ne6...dfk  uber-svc.11   nigel...v1   mgr1  Running   Running\
    \ 1 min\ne2...k1j  uber-svc.12   nigel...v1   mgr1  Running   Running 1 min\n\
    ```\n"
