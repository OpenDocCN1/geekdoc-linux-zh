    \ you don’t need to be a kernel engineer, and we’re not about to walk through\
    \ a complex hack for getting Docker onto your Mac. We’ll walk you through the\
    \ process of installing *Docker for Mac* on your Mac desktop or laptop, and it’s\
    \ ridiculously easy.\n\nSo what is *Docker for Mac?*\n\n*Docker for Mac* is packaged\
    \ product that allows you to easily get a small single-engine Docker environment\
    \ up and running locally on your Mac. If you’ve heard of **boot2docker** then\
    \ *Docker for Mac* is what you always wished *boot2docker* was - it’s smooth,\
    \ simple and stable. But *Docker for Mac* is only intended for test and dev work.\
    \ You shouldn’t think of it as a production platform to run your business from.\
    \ No! *Docker for Mac* is all about getting a small working installation of Docker\
    \ up and running on your Mac in the simplest way possible so that you can test\
    \ and develop containerized applications on your Mac.\n\nIt’s also worth noting\
    \ that *Docker for Mac* will not give you the Docker Engine running natively on\
    \ the Mac OS Darwin kernel. Behind the scenes it runs the Docker Engine inside\
    \ of a lightweight Linux VM. It then seamlessly exposes that Docker Engine and\
    \ API to your Mac environment. But it does it all in a way that the mystery and\
    \ magic that pulls it all together is hidden away behind the scenes. All you need\
    \ to know is that you can open a terminal on your Mac and use the regular Docker\
    \ commands to hit the Docker API.\n\nAlthough this seamlessly works on your Mac….\
    \ Its obviously Docker on Linux under the hood, so it’s only going work with Linux-based\
    \ Docker containers. This is good though, as this is where most of the container\
    \ action is.\n\nFigure 3.3 shows a high level representation of the *Docker for\
    \ Mac* architecture.\n\n![Figure 3.3](images/figure3-3.png)\n\nFigure 3.3\n\n\
    > **Note:** For the curious reader, *Docker for Mac* leverages [HyperKit](https://github.com/docker/hyperkit)\
    \ to implement a super lightweight hypervisor. HyperKit in turn is based off the\
    \ [xhive hypervisor](https://github.com/mist64/xhyve). *Docker for Mac* also leverages\
    \ features from [DataKit](https://github.com/docker/datakit) and runs a highly\
    \ tuned Linux distro called Moby that is based off of [Alpine Linux](https://alpinelinux.org/%20and%20https://github.com/alpinelinux).\n\
    \nLet’s get *Docker for Mac* installed.\n\n1.  Point your browser to www.docker.com\n\
    \n2.  Click the `Get Docker` link near the top of the Docker homepage.\n\n3. \
    \ Click the `Learn More` button under the **MAC** section and then click `Download\
    \ Docker for Mac`. This will download the **Docker.dmg** installation package\
    \ to your default downloads directory.\n\n4.  Launch the `Docker.dmg` file that\
    \ you downloaded in the previous step. You will be asked to drag and drop the\
    \ Moby Dock whale image into the **Applications** folder.\n\n5.  Open your **Applications**\
    \ folder (it may open automatically) and double-click the Docker application icon\
    \ to Start it. You may be asked to confirm the action because the application\
    \ was downloaded form the internet.\n\n6.  Enter your password so that the installer\
    \ can create components, such as networking, that require elevated privileges.\n\
    \n7.  The Docker daemon will now start.\n\n    An animated whale icon will appear\
    \ in the status bar at the top of your screen, and the animation will stop when\
    \ the daemon has successfully started. Once the daemon has started you can click\
    \ the whale icon and perform basic actions such as restarting the daemon, checking\
    \ for updates, and opening the UI.\n\nNow that *Docker for Mac* is installed you\
    \ can open a terminal window and run some regular Docker commands. Try the commands\
    \ listed below.\n\n```\n$ docker version\nClient:\n Version:      1.12.0-rc3\n\
    \ API version:  1.24\n Go version:   go1.6.2\n Git commit:   91e29e8\n Built:\
    \        Sat Jul 2 00:09:24 2016\n OS/Arch:      darwin/amd64\n Experimental:\
    \ true\n\nServer:\n Version:      1.12.0-rc3\n API version:  1.24\n Go version:\
    \   go1.6.2\n Git commit:   876f3a7\n Built:        Tue Jul 5 02:20:13 2016\n\
    \ OS/Arch:      linux/amd64\n Experimental: true\n```\n\nNotice in the output\
    \ above that the `OS/Arch:` for the **Server** component is showing as `linux/amd64`.\
    \ This is because the server portion of the Docker Engine (a.k.a. the “daemon”)\
    \ is running inside of the Linux VM we mentioned earlier. The **Client** component\
    \ is a native Mac application and runs directly on the Mac OS Darwin kernel (`OS/Arch:\
    \ darwin/amd64`).\n\nAlso note that the system is running the experimental version\
    \ (`Experimental: true`) of Docker. *Docker for Mac* has stable and experimental\
    \ channels. You can switch between channels, but you should check the Docker website\
    \ for restrictions and implications before doing so.\n\nRun some more Docker commands.\n\
    \n```\n$ docker info\nContainers: 0\n Running: 0\n Paused: 0\n Stopped: 0\nImages:\
    \ 0\nServer Version: 1.12.0-rc3\n<Snip>\nRegistry: https://index.docker.io/v1/\n\
    Experimental: true\nInsecure Registries:\n 127.0.0.0/8\n```\n\nDocker for Mac\
    \ installs the Docker Engine (client and daemon), Docker Compose, and Docker machine.\
    \ The following three commands show you how to verify that all of these components\
    \ installed successfully and find out which versions you have.\n\n```\n$  docker\
    \ --version\nDocker version 1.12.0-rc3, build 876f3a7, experimental\n```\n\n```\n\
    $  docker-compose --version\ndocker-compose version 1.8.0, build d988a55\n```\n\
    \n```\n$  docker-machine --version\ndocker-machine version 0.8.1, build 41b3b25\n\
    ```\n\n### Installing Docker on Linux"
