    让我们回顾一下用于 Docker 镜像的主要命令。


    ### 镜像 (Images) - 命令


    - `docker pull` 是下载镜像的命令。我们从远程注册表的内部仓库拉取镜像。默认情况下，镜像将从 Docker Hub 仓库拉取。该命令将从 Docker
    Hub 的 `alpine` 仓库拉取标记为 `latest` 的镜像：`docker pull alpine:latest`。

    - `docker images` 列出存储在 Docker 主机本地缓存中的所有镜像。要查看镜像的 SHA256 摘要，请添加 `--digests`get。

    - `docker rmi` 是删除镜像的命令。该命令展示了如何删除 `alpine:latest` 镜像 `docker rmi alpine:latest`。你不能删除与处于运行（UP）或停止（Exited）状态的容器相关的镜像。


    ### 章节总结


    在本章中，我们学习了 Docker 镜像。我们了解到镜像由一个或多个只读层组成，这些层堆叠在一起就成了整个镜像。我们使用了 `docker pull` 命令将它们拉到
    Docker 主机的本地缓存中，并涵盖了镜像命名规范。然后，我们学习了镜像层以及它们如何在多个镜像之间共享。最后，我们涵盖了用于操作镜像的最常用命令。


    在下一章中，我们将对容器进行类似的介绍——它是镜像的运行时同类。


    ## 6: 容器 (Containers)


    现在我们已经对镜像有所了解，接下来的逻辑步骤是进入容器。由于这是一本关于 Docker 的书，我们将专门讨论 Docker 容器。然而，Docker 项目最近一直致力于实现由开放容器倡议（OCI）在
    `https://www.opencontainers.org` 发布的镜像和容器规范。这意味着你在这里学习的部分内容将适用于其他符合 OCI 标准的容器运行时。


    让我们来学习容器吧！


    ### Docker 容器 - 极简要点 (TLDR)


    容器是镜像的运行时实例。就像我们可以从虚拟机模板启动虚拟机（VM）一样，我们从单个镜像启动一个或多个容器。虚拟机和容器之间的巨大区别在于容器更快、更轻量——容器并不像虚拟机那样运行完整的操作系统，它们不运行内核，只需要足够完成任务的操作系统。


    图 6.1 显示了使用单个 Docker 镜像启动了多个 Docker 容器。


    ![Figure 6.1](img/figure6-1.png)


    图 6.1


    启动容器的最基本方法是使用 `docker run` 命令。该命令可以接受很多参数，但在最基本的形式下，你告诉它要使用的镜像和运行的命令：`docker run
    <image> <command>`。下一个命令将启动一个运行 Bash Shell 的 Ubuntu Linux 容器：`docker run ubuntu
    /bin/bash`。


    容器会一直运行直到它们执行的命令退出。你可以使用 `docker stop` 命令手动停止容器，然后用 `docker start` 重启它。要永久删除容器，你必须使用
    `docker rm` 显式地删除它。


    这就是核心介绍！现在让我们进入细节……


    ### Docker 容器 - 深度解析


    我们在这里涵盖的首要是容器和虚拟机之间的基本区别。在这个阶段主要是理论性的，但非常重要。在此过程中，我们会指出容器模型具有潜力的地方。


    > 在此过程中，我们会指出容器模型具有潜力的地方。


    > **注意：** 在虚拟机模型中，物理服务器通电，管理程序启动（我们跳过了 BIOS 和引导加载程序代码）。一旦管理程序启动，它就会声领系统上的资源，如
    CPU、内存、存储和网卡（NICs）。然后，管理程序将这些硬件资源切割成虚拟版本，看起来和感觉完全像真实的一。它将其封装成一个名为虚拟机（VM）的软件结构。然后我们获取这些虚拟机并在每个虚拟机上安装操作系统。我们说我们有一台物理服务器并需要运行
    4 个应用程序，因此我们会创建 4 台虚拟机，安装 4 个操作系统，然后安装这 4 个应用程序。完成后，它看起来像图 6.2。


    ![Figure 6.2](img/figure6-2.png)


    图 6.2


    #### 容器 vs 虚拟机


    容器和虚拟机都需要宿主机来运行。这可以是你的笔记本电脑、数据中心的裸机服务器，一直到公云上的实例。


    在容器模型中，服务器通电，你选择的操作系统启动。在 Docker 世界中，这可以是 Linux，也可以任何在内核中支持容器原型的 Windows 版本。与虚拟机模型一样，操作系统占用所有硬件资源。在操作系统之上，我们安装了如
    Docker 的容器引擎。然后容器引擎获取操作系统资源，如*进程树*、*文件系统*和*网络栈*，并将它们切割成安全的隔离构造结构，被称为*容器*。每个容器看起来和感觉都像真实的操作系统。在每个*容器*内部，我们可以运行应用程序。和之前一样，我们假设有一台运行
    4 个应用程序的物理服务器。因此，我们会划分出 4 个容器，并在每个内部运行单个应用程序，如图 6.3 所示。


    ![Figure 6.3](img/figure6-3.png)


    图 6.3


    从高层次来说，管理程序执行硬件虚拟化——它们将物理硬件资源切割成虚拟版本。而容器执行操作系统虚拟化——它们将操作系统资源切割成虚拟版本。


    #### 虚拟机税 (The VM tax)


    让我们在刚刚涵盖的内容的基础上，深入研究管理程序模型的主要问题之一。


    我们从相同的物理服务器和运行 4 个业务应用程序的需求开始。在两种两种模型中，我们都安装了操作系统或管理程序（显然，管理程序是一种针对虚拟机高度调优的操作系统）。到目前为止，这些模型几乎是相同的。但相似性到此为止了。


