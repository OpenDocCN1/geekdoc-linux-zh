    We’ll get into the details of where the image is stored and what’s inside of it
    in the next chapter. For now it’s enough to understand that it contains enough
    of an operating system (OS), as well as all the code to run whatever application
    it’s designed for. The `ubuntu` image that we’ve pulled has a stripped down version
    of the Ubuntu Linux OS including a few of the common Ubuntu utilities.


    It’s worth noting as well that each image gets it’s own unique ID. When working
    with the image, as we will do in the next step, you can refer to it using either
    its `ID` or name.


    ### Containers


    Now that we have an image pulled locally on our Docker host, we can use the `docker
    run` command to launch a container from it.


    ```

    $ docker run -it ubuntu:latest /bin/bash

    root@6dc20d508db0:/#

    ```


    Look closely at the output form the command above. You should notice that your
    shell prompt has changed. This is because your shell is now attached to the shell
    of the new container - you are literally inside of the new container!


    Let’s examine that `docker run` command. `docker run` tells the Docker daemon
    to start a new container. The `-it` flags tell the daemon to make the container
    interactive and to attach our current shell to the shell of the container (we’ll
    get more specific about this in the chapter on containers). Next, the command
    tells Docker that we want the container to be based on the `ubuntu:latest` image,
    and we tell it to run the `/bin/bash` process inside the container.


    Run the following `ps` command from inside of the container to list all running
    processes.


    ```

    root@6dc20d508db0:/# ps -elf

    F S UID    PID  PPID   NI ADDR SZ WCHAN  STIME TTY  TIME CMD

    4 S root     1     0    0 -  4560 wait   13:38 ?    00:00:00 /bin/bash

    0 R root     9     1    0 -  8606 -      13:38 ?    00:00:00 ps -elf

    ```


    As you can see from the output of the `ps` command, there are only two processes
    running inside of the container:


    *   PID 1\. This is the `/bin/bash` process that we told the container to run
    with the `docker run` command.


    *   PID 9\. This is the `ps -elf` process that we ran to list the running processes.


    The presence of the `ps -elf` process in the output above could be a bit misleading
    as it is a short-lived process that dies as soon as the `ps` command exits. This
    means that the only long-running process inside of the container is the `/bin/bash`
    process.


    Press `Ctrl-PQ` to exit the container. This will land you back in the shell of
    your Docker host. You can verify this by looking at your shell prompt.


    Now that you are back at the shell prompt of you Docker host, run the `ps -elf`
    command again.


    ```

    $ ps -elf

    F S UID        PID  PPID    NI ADDR SZ WCHAN  TIME CMD

    4 S root         1     0     0 -  9407 -      00:00:03 /sbin/init

    1 S root         2     0     0 -     0 -      00:00:00 [kthreadd]

    1 S root         3     2     0 -     0 -      00:00:00 [ksoftirqd/0]

    1 S root         5     2   -20 -     0 -      00:00:00 [kworker/0:0H]

    1 S root         7     2     0 -     0 -      00:00:00 [rcu_sched]

    <Snip>

    0 R ubuntu   22783 22475     0 -  9021 -      00:00:00 ps -elf

    ```


    Notice how many more processes are running on your Docker host compared to the
    single long-running process inside of the container.


    In a previous step you pressed `Ctrl-PQ` to exit your shell from the container.
    Doing this from inside of a container will exit you form the container without
    killing it. You can see all of the running containers on your system using the
    `docker ps` command.


    ```

    $ docker ps

    CNTNR ID  IMAGE          COMMAND    CREATED     STATUS     NAMES

    0b3...41  ubuntu:latest  /bin/bash  7 mins ago  Up 7 mins  tiny_poincare

    ```


    The output above shows a single running container. This is the container that
    you created earlier. The presence of your container in this output proves that
    it’s still running. You can also see that it was created 7 minutes ago and has
    been running for 7 minutes.


    ### Attaching to running containers


    You can attach your shell to running containers with the `docker exec` command.
    As the container from the previous steps is still running let’s connect back to
    it.


    > **Note:** The example below references a container called “tiny_poincare”. The
    name of your container will be different, so remember to substitute “tiny_poincare”
    with the name or ID of the container running on your Docker host.


    ```

    $ docker exec -it tiny_poincare bash

    root@6dc20d508db0:/#

    ```


    Notice that your shell prompt has changed again. You are back inside the container.


    The format of the `docker exec` command is: `docker exec -options <container-name
    or container-id> <command>`. In our example we used the `-it` options to attach
    our shell to the container’s shell. We referenced the container by name and told
    it to run the bash shell.


    Exit the container again by pressing `Ctrl-PQ`.


    Your shell prompt should be back to your Docker host.


    Run the `docker ps` command again to verify that your container is still running.


    ```

    $ docker ps

    CNTNR ID  IMAGE          COMMAND    CREATED     STATUS     NAMES

    0b3...41  ubuntu:latest  /bin/bash  9 mins ago  Up 9 mins  tiny_poincare

    ```


    Stop the container and kill it using the `docker stop` and `docker rm` commands.


    ```

    $ docker stop tiny_poincare

    tiny_poincare

    $

    $ docker rm tiny_poincare

    tiny_poincare

    ```


    Verify that the container was successfully deleted by running another `docker
    ps` command.


    ```

    $ docker ps

    CONTAINER ID    IMAGE    COMMAND    CREATED    STATUS    PORTS    NAMES

    ```


    Congratulations! You’ve downloaded a Docker image, launched a container from that
    image, executed a command inside of the container (`ps -elf`) and then stopped
    and deleted the container. This *big picture* view should help you with the up-coming
    chapters where we will dig deeper into images and containers.


    # Part 2: The technical stuff


    ## 5: Images


    In this chapter we’ll dive a bit deeper into Docker images. The aim of the game
    here is to give you a solid working understanding of what Docker images are and
    how to work with them.


    As this is our first chapter in the Technical section of the book, we’re going
    to employ the three-tiered approach where we split the chapter into three sections:


    *   The TLDR: Two or three quick paragraphs that you can read while standing in
    line for a coffee)


    *   The deep dive: The really long bit where we get into the detail


    *   The commands: A quick list of the commands we learned


    ### Docker images - The TLDR


    Docker images are a lot like VM templates. A VM template is like a stopped VM,
    whereas a Docker image is like a stopped container.


    You start out by pulling images from an image registry such as [Docker Hub](https://hub.docker.com).
    The *pull* operation downloads the image to your local Docker host where you can
    use it to start one or more Docker containers.


    Images are made up of multiple layers that get stacked on top of each other and
    represented as a single object. Within the image is a cut-down operating system
    (OS) and all of the files required to run an application or service. Because containers
    are intended to be fast and lightweight, images tend to be quite small.'
