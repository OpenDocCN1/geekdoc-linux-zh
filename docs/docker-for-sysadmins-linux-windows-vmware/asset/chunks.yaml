    # 系统管理员的 Docker：Linux Windows VMware


    ### 从系统管理员和虚拟机管理员的角度开始学习 Docker


    #### Nigel Poulton


    本书可在 [`leanpub.com/dockerforsysadmins`](http://leanpub.com/dockerforsysadmins)
    购买。


    此版本发布于 2016-09-23。


    ![出版者标志](img/leanpub-logo.png)


    * * * * * * *


    这是一本来自 [Leanpub](http://leanpub.com) 的书。Leanpub 通过精益出版（Lean Publishing）流程为作者和出版社提供支持。[精益出版](http://leanpub.com/manifesto)是指使用轻量级工具和多次迭代来出版进行中的电子书，以获取读者反馈，不断调整直到获得正确的书籍，并在一旦成功后建立影响力。


    * * * * * * *


    © 2016 Nigel Poulton


    非常感谢我的妻子和孩子，忍受家里有一个极客客，他真心认为自己是一堆运行在中端生物硬件之上的容器内的软件。和我生活一定不好过！


    非常感谢所有观看我 Pluralsight 视频的人。我喜欢与你们联系，并非常感谢多年来获得的所有反馈。这是我决定写这本书的主要原因之一！我希望它成为一个很棒的工具，帮助你的职业更进一步。


    ## 目录


    ## 指南


    1. 开始阅读


    ## 0: 关于这本书


    这是一本关于 Docker 的书，**专为系统管理员身定制**。不需要任何先验知识！


    但是开发者和 DevOps 呢？


    如果你是一个对运维不感兴趣的开发者，那么这本书不适合你。如果你对 DevOps 感兴趣，我认为你将从书中获益良浅。


    简而言之……这本书**不是**关于教你如何用 Docker 开发微服务应用。这本书**是**关于 Docker 核心底层管道是如何工作的。你将学习到*如何做*以及*为什么这么做*——即*命令*和*深度解析*。我真的想让你在
    Docker 方面的水平达到像现在精通 Linux、Windows 或 VMware 那样精通。


    ### 我为什么应该读这本书或关注 Docker？


    ### Docker 正在到来，无法逃避。开发者们都在使用。在 IT 运维中，我们需要准备好在我们的业务关键生产环境中支持*Docker 化*的应用。


    ### Docker 难道仅仅是给开发者用的吗？


    绝对不是！！！


    开发者创建的所有那些*Docker 化*应用都需要一个稳固的 Docker 基础设施来运行。这就是 IT 运维介入的地方……IT 运维将被要求构建和运行高性能、高可的
    Docker 基础设施来支持业务应用。如果我们在 Docker 上没有精通，我们将陷入困境。


    ### 为什么是这本 Docker 书而不是其他书籍？


    在我决定写这本书的第一版时，市面上已经有*非常多* Docker 书太糟糕了！它们是*写得糟糕*、充斥*技术错误*或严重*过时*的令人震惊。。。它们三者兼具！坦率地说，我的本意并不是冒犯任何人，但去
    Amazon 上读读那些评论吧。市面上**有些** Docker 书简直是对树木和纸张的耻辱！


    所以我决定写一些*写得良好*、*技术准确*且*保持更新*的内容。我希望你喜欢这本书。


    如果你买了书并觉得它很烂，可以在 [Twitter](https://twitter.com/nigelpoulton) 上找我，给书写差评，做任何你认为必要的事。我会尝试修复它。但我相信你不需要做这些事情。


    ### 如果我已经看过了你的视频课程，我还需要买这本书吗？


    如果你喜欢我的[视频课程](https://app.pluralsight.com/library/search?q=nigel+poulton)，你可能喜欢这本书。如果你不喜欢我的视频课程，你可能就不会喜欢这本书。


    ### 本书的结构


    我将书分为两个部分：


    * 基础信息内容

    * 技术内容


    *基础信息内容*涵盖了诸如之类的内容——Docker, Inc. 是谁？Docker 项目是什么？什么是 OCI？我们为什么需要容器……这不是书中最酷炫的部分，但如果你想对
    Docker 和容器有一个全面的了解，那么这些内容是重要的。这只是一个很短的章节，你可能*应该*读一下。


    *技术内容*是这本书的核心！在这里你将找到开始使用 Docker 所需的一切内容。它深入了*镜像*、*容器*以及日益重要的*编排*主题。你将获得理论支持，让你了解它们是如何整合在一起的，你将获得命令和示例向你展示它们在实践中是如何工作的。


    *技术内容*部分的每一章都分为三部分：


    * TLDR（要点）

    * 深度解析

    * 命令


    *TLDR* 将给你两或三段你可以用来解释的文字。


    > **TLDR** 是一个现代缩写，意为“太长了，没读”。它通常用于指示某内容太长而未读。*深度解析*是我们将解释一切是如何运作的地方。


    *命令*列出了你所学的所有内容。


    ### 关于书的其他事项


    这里只有我想要让你知道的另外几点。


    #### 文本换行


    在制作过程中，我不得不裁剪了一些命令的输出内容，但我认为你没有遗掉任何重要内容。然而，尽管如此，如果你在足够小的设备上阅读，仍然会遇到一些换行 :-(


    > 为了获得最佳效果，你可能希望将阅读设备侧过来。


    ```

    $ docker service uber-service

    ID          NAME                 IMAGE                    NODE    REPLICA    DESIRED
    STATE   CURRENT STATE   ERROR

    7zi85ypj7t6k             uber-service.1       docker-docker-node:18.09-3-alpine
    node.1    1/1         Running (1s)     0

    a1dh...mzn817f             uber-service.2       docker-docker-node:18.09-3-alpine
    node.22    1/1         Running (1s)     0

    cc0j...ar099v5             uber-service.3       docker-docker-node:18.09-3-alpine
    node.32    1/1         Running (1s)     0

    ```


    …你*应该*得到这样的。


    ```

    $ docker service web-fe

    ID          NAME      IMAGE             NODE    REPLICA    DESIRED STATE   CURRENT
    STATE   ERROR

    817f...f6z             web-fe.1       docker-docker-node:18.09-3-alpine node.1    1/1         Running
    (1s)     0

    a1dh...mzn817f             web-fe.2       docker-docker-node:18.09-3-alpine node.22    1/1         Running
    (1s)     0

    cc0j...ar099v5             web-fe.3       docker-docker-node:18.09-3-alpine node.32    1/1         Running
    (1s)     0

    ```


    #### 但你没有包含我非常希望你包含的内容……


    我知道这本书没有涵盖关于 Docker 的*所有*内容。但它本就不该涵盖全部！我写这本书是为了让你尽可能快地进入状态，同时花时间学习它们是如何整合在一起的。如果这本书有
    1000 页打印版，它**并不会**帮助你快速进入状态！


    然而，如果我认为某些内容足够重要且基础，我会在书中添加章节。请使用书的反馈页并在 [Twitter](https://twitter.com/nigelpoulton)
    上与我联系，分享你认为在下一版本书中应该包含的想法。


    好了，废话够了。我们开始吧！


    # 第 1 部分：基础信息内容


    ## 1: 从万米高空看容器


    容器对很多人来说是一个*新*事物。


