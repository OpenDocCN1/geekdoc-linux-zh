  trans: "\n虚拟机（VM）模型将 `low-level hardware resources` 划分为虚拟机。每个虚拟机都是包含虚拟 CPU、虚拟内存、虚拟磁盘等的软件构结构。因此，每个虚拟机都需要自己的操作系统（OS）来声明、初始化和管理所有这些虚拟资源。遗憾的是，每个操作系统都带有它自己的包袱和开销。例如，每个操作系统都会消耗一部分\
    \ CPU、一部分内存、一部分存储空间等。大多数操作系统还需要自己的许可证，以及人员和基础设施来对其进行补丁和升级。每个操作系统还呈现出相当大的攻击面。我们通常将这一切统称为\
    \ `OS tax`（或 `VM tax`）——你安装的每一个操作系统都会消耗资源！\n\n容器模型在宿主机操作系统层级只有一个内核。在单个宿主机上可以运行几十或数百个容器，且每个容器都共享这同一个操作系统内核。这意味着只需要一个操作系统来消耗\
    \ CPU、内存和存储。一个需要许可的操作系统。一个需要升级和打补丁的操作系统。以及一个提供攻击面的单一操作系统内核。总而言之，只有一份 OS 费用账单！\n\
    \n在我们单台服务器需要运行 4 个业务应用程序的示例中，这可能看起来不多。但当我们谈论数百或数千个应用（虚拟机或容器）时，这可能会改变游戏规则。\n\n\
    另一个需要考虑的问题是，由于容器不是完整的操作系统，它的启动速度比虚拟机 `much faster`。记住，容器内部没有需要定位、解压和初始化的内核——更不用说与正常内核引导相关的所有硬件枚举和初始化了。启动容器时不需要这些！位于操作系统层级的单一共享内核已经启动了！结果是，容器可以在不到秒的时间内启动。影响容器启动时间的唯一因素是它运行的应用程序启动所需的时间。\n\
    \n这一切都意味着容器模型比虚拟机模型更轻量、更高效。我们可以在更少的资源上封装更多的应用程序，启动得更快，并支付更少的许可和管理成本，同时向“黑暗面”呈现更小的攻击面。所有这些对业务都有利！\n\
    \n解决这些理论问题后，让我们来玩玩容器。\n\n### 运行容器\n\n为了跟随这些示例，你需要一个运行良好的 Docker 宿主机。对于大多数命令来说，使用\
    \ Linux 还是 Windows 没有区别。然而，在写这本书时，所有的示例都使用了一个运行 Ubuntu 16.04 的 Docker 宿主机。\n\n\
    ### 检查 Docker 守护进程\n\n当我登录 Docker 宿主机时，做的第一件事总是检查 Docker 是否正在运行。\n\n```\n$ docker\
    \ version\nClient:\n Version:      1.12.1\n API version:  1.24\n Go version: \
    \  go1.6.3\n Git commit:   23cf638\n Built:        Thu Aug 18 05:33:38 2016\n\
    \ OS/Arch:      linux/amd64\n\nServer:\n Version:      1.12.1\n API version: \
    \ 1.24\n Go version:   go1.6.3\n Git commit:   23cf638\n Built:        Thu Aug\
    \ 18 05:33:38 2016\n OS/Arch:      linux/amd64\n```\n\n只要你在 `Client` 和 `Server`\
    \ 部分得到响应，你就可以正常工作了。如果你在 `Server` 部分收到错误代码，那么很有可能是 docker 守护进程（服务器端）没有运行，或者你的用户账户没有访问它的权限。\n\
    \n如果你的用户账户没有访问守护进程的权限，你需要确保它是本地 `docker` Unix 组的成员。如果不是，你可以通过 `usermod -aG docker\
    \ <user>` 添加它，然后你必须注销并重新登录 shell 使更改生效。\n\n如果你的用户账户已经是本地 `docker` 组的成员，那么问题可能是\
    \ Docker 守护进程没有运行。要检查 Docker 守护进程的状态，请根据你的 Docker 宿主机操作系统运行以下命令之一。\n\n```\n//\
    \ 在未使用 Systemd 的 Linux 系统上运行此命令\n$ service docker status\ndocker start/running,\
    \ process 29393\n\n// 在使用 Systemd 的 Linux 系统上运行此命令\n$ systemctl is-active docker\n\
    active\n\n// 在 PowerShell 窗口从 Windows Server 2016 系统运行此命令\n> Get-Service docker\n\
    \nStatus    Name      DisplayName\n------    ----      -----------\nRunning  \
    \ docker    Docker Engine\n```\n\n假设 Docker 守护进程正在运行，你就可以继续。\n\n### 启动一个简单的容器\n\
    \n启动容器简单的方法是使用 `docker run` 命令。\n\n下面的命令启动了一个简单的容器，该容器将运行一个容器化的 Ubuntu Linux。\n\
    \n```\n$ docker run -it ubuntu:latest /bin/bash\nUnable to find image 'ubuntu:latest'\
    \ locally\nlatest: Pulling from library/ubuntu\n952132ac251a: Pull complete\n\
    82659f8f1b76: Pull complete\nc19118ca682d: Pull complete\n8296858250fe: Pull complete\n\
    24e0251a0e2c: Pull complete\nDigest: sha256:f4691c96e6bbaa99d9...e95a60f0\n```\n"
- fmt: '

    When we started the container in the previous section we told it to run the Bash
    shell (`/bin/bash`). This makes the Bash shell the **one and only process running
    inside of the container**. You can see this by running `ps -elf` from inside the
    container.


    ```

    root@3027eb644874:/# ps -elf

    F S UID   PID  PPID   NI ADDR SZ WCHAN  STIME TTY     TIME      CMD

    4 S root    1     0    0 -  4558 wait   00:47 ?     00:00:00  /bin/bash

    0 R root   11     1    0 -  8604 -      00:52 ?     00:00:00  ps -elf

    ```


    Although it might look like there are two processes running in the output above,
    there re not. The first process in the list, with `PID` 1, is the Bash shell we
    told the container to run. The second process in the list is the `ps -elf` command
    we ran to produce the list. This is a short-lived process that has already exited
    by the time the output is displayed on the terminal. Long story short, this container
    is running a single process - `/bin/bash`.


    > **Note:** Windows containers are slightly different and tend to run quite a
    few processes.


    This means that if you type `exit` to exit the Bash shell, the container will
    terminate. The reason for this is that a container cannot exist without a running
    process - killing the Bash shell would kill the container’s only process, resulting
    in the container also being killed.


    Press `Ctrl-PQ` to exit the container without terminating it. Doing this will
    place you back in the shell of your Docker host and leave the container running
    in the background. You can use the `docker ps` command to view the list of running
    containers on your system.


    ```

    $ docker ps

    CNTNR ID  IMAGE          COMMAND    CREATED  STATUS    NAMES

    302...74  ubuntu:latest  /bin/bash  6 mins   Up 6mins  sick_montalcini

    ```


    It’s important to understand that this container is still running and you can
    re-attach your terminal to it with the `docker exec` command.


    ```

    $ docker exec -it 3027eb644874 bash

    root@3027eb644874:/#

    ```


    > **Note:** You can address a container by its name or ID


    As you can see, the shell prompt has changed back to the container. If you run
    the `ps -elf` command again you will now see **two** Bash processes. This is because
    the `docker exec` command created a new Bash process and attached to that. This
    means that typing `exit` from this Bash prompt will not terminate the container
