    \ votes for either “football” or “soccer”. Feel free to point you web browser\
    \ to other nodes in the swarm. You will be able to reach the web server from any\
    \ node in the swam because the `-p 80:80` creates a mapping on every host. This\
    \ is true even on nodes that might be running a task for the service - **every\
    \ node gets a mapping and can therefore redirect your request to a node that runs\
    \ the service**.\n\nNow let’s assume that this particular vote has come to an\
