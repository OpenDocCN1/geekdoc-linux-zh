    当我们在上一节中启动容器时，我们告诉它运行 Bash shell（`/bin/bash`）。这使得 Bash shell 成为**容器内运行的唯一一个进程**。你可以通过在容器内部运行
    `ps -elf` 来看到这一点。


    ```

    root@3027eb644874:/# ps -elf

    F S UID   PID  PPID   NI ADDR SZ WCHAN  STIME TTY     TIME      CMD

    4 S root    1     0    0 -  4558 wait   00:47 ?     00:00:00  /bin/bash

    0 R root   11     1    0 -  8604 -      00:52 ?     00:00:00  ps -elf

    ```


    尽管上面的输出看起来似乎有两个进程在运行，但实际上并非如此。列表中的第一个进程 `PID` 为 1 是我们告诉容器运行的 Bash shell。列表中的第二个进程是运行为了生成列表而运行的
    `ps -elf` 命令。这是一个短命进程，在输出显示在终端上时，它已经退出了。简而言之，这个容器正在运行单个进程 - `/bin/bash`。


    > **注意：** Windows 容器略有不同，往往倾向于运行许多进程。


    这意味着，如果你输入 `exit` 来退出 Bash shell，容器将会终止。这是因为容器在没有运行进程的情况下是不可能存在的——杀死 Bash shell
    就会杀死容器的唯一进程，导致容器也会被杀死。


    按下 `Ctrl-PQ` 退出容器而不终止它。这样做将你带回 Docker 宿主机的 shell 中，并让容器在后台运行。你可以使用 `docker ps`
    命令查看系统上正在运行的容器列表。


    ```

    $ docker ps

    CNTNR ID  IMAGE          COMMAND    CREATED  STATUS    NAMES

    302...74  ubuntu:latest  /bin/bash  6 mins   Up 6mins  sick_montalcini

    ```


    重要的是，要理解这个容器仍在运行，你可以使用 `docker exec` 命令将终端重新附加到它。


    ```

    $ docker exec -it 3027eb644874 bash

    root@3027eb644874:/#

    ```


    > **注意：** 你可以通过容器的名称或 ID 来指定容器。


    如你所见，shell 提示符已变回容器。如果你再次运行 `ps -elf` 命令，现在你会看到**两个** Bash 进程。这是因为 `docker exec`
    命令创建了一个新的 Bash 进程并附加到上面。这意味着在此 Bash 提示符下输入 `exit` 不终止容器，因为 `PID` 为 1 的原始 Bash
    进程将继续运行。


    输入 `exit` 离开容器并退出容器。


