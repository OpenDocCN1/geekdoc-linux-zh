    Status: Downloaded newer image for ubuntu:latest\n```\n\nEach line in the output\
    \ above that ends with “Pull complete” represents a layer in the image that was\
    \ pulled. As we can see, this image has 5 layers. Figure 5.4 below shows this\
    \ as a picture.\n\n![Figure 5.4](images/figure5-4.png)\n\nFigure 5.4\n\nAnother\
    \ way to see the layers that make up an image is to inspect the image with the\
    \ `docker inspect` command. The example below inspects the same `ubuntu:lates`\
    \ image.\n\n```\n$ docker inspect ubuntu:latest\n[\n    {\n        \"Id\": \"\
    sha256:bd3d4369aebc4945be269859df0e15b1d32fefa2645f5699037d7d\\\n8c6b415a10\"\
    ,\n        \"RepoTags\": [\n            \"ubuntu:latest\"\n\n        <Snip>\n\n\
    \        \"RootFS\": {\n            \"Type\": \"layers\",\n            \"Layers\"\
    : [\n                \"sha256:c8a75145fc...894129005e461a43875a094b93412\",\n\
    \                \"sha256:c6f2b330b6...7214ed6aac305dd03f70b95cdc610\",\n    \
    \            \"sha256:055757a193...3a9565d78962c7f368d5ac5984998\",\n        \
    \        \"sha256:4837348061...12695f548406ea77feb5074e195e3\",\n            \
    \    \"sha256:0cad5e07ba...4bae4cfc66b376265e16c32a0aae9\"\n            ]\n  \
    \      }\n    }\n]\n```\n\nThe trimmed output shows 5 layers again. Only this\
    \ time they’re shown using their SHA256 hashes. The point being, both commands\
    \ show that the image has 5 layers.\n\n> **Note:** The `docker history` command\
    \ shows the build history of an image and is **not** a list of layers in the image.\
    \ For example, some commands that appear in an image’s build history do not result\
    \ in image layers being created. Some of these commands (Dockerfile instructions)\
    \ include “MAINTAINER”, “ENV”, “EXPOSE” and “CMD”. Instead of these commands creating\
    \ new image layers, their values are stored as part of the image’s metadata.\n\
    \nEvery layer in a Docker image gets it’s own unique ID. This is a cryptographic\
    \ hash of the layer’s content. This means that the value of the crypto hash is\
    \ determined by the contents of the image - changing the contents of the image\
    \ changes its hash.\n\nUsing cryptographic content hashes improves security, avoids\
    \ ID collisions that could occur if they were randomly generated, and gives us\
    \ a way to guarantee data integrity after operations such as `docker pull`.\n\n\
    All Docker images start with a base layer, and as changes are made and new content\
    \ is added, new layers are added on top. As an over-simplified example, you might\
    \ create a brand new image based off of Ubuntu Linux 16.04\\. This would be your\
    \ image’s first layer. If you later add the Python package, this would be added\
    \ as a second layer at the top of your image. If you then added a security patch,\
    \ this would be added as a third layer at the top. Your image would now have three\
    \ layers as shown in Figure 5.5 below.\n\n![Figure 5.5](images/figure5-5.png)\n\
    \nFigure 5.5\n\nIt’s important to understand that as additional layers are added,\
    \ the image becomes the combination of all of the layers. Take a simple example\
    \ of two layers as shown in Figure 5.6\\. Each *layer* has 3 files, but the overall\
    \ *image* has 6 files as it is the combination of both layers.\n\n![Figure 5.6](images/figure5-6.png)\n\
    \nFigure 5.6\n\n> I’ve shown the image layers in Figure 5.6 in a slightly different\
    \ way to previous figures. This is just to make showing files easier.\n\nIn the\
    \ slightly more complex example of the three layered image in Figure 5.7, the\
    \ overall image only ends up with 6 files. This is because file 7 in the top layer\
    \ is an updated version of file 5 directly below. In this situation, the file\
    \ in the higher layer obscures the file directly below it. This allows updated\
    \ versions of files to be added as new layers to the image.\n\n![Figure 5.7](images/figure5-7.png)\n\
