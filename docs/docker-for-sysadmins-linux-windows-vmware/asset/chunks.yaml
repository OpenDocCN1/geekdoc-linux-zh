  trans: "\n容器现在被删除了——字面上从地球表面上消失了。如果它是一个乖容器，它会在另一个世中变成一个 VM；如果它是不听话的容器，它就会变成一个哑终端\
    \ :-D\n\n总结一下容器的生命周期。你可以随意次数地对容器进行 `stop`、`start`、`pause` 和 `restart`。这一切都会发生得非常快。但容器和它的数据始终是安全的。只有当你显式地\
    \ `kill` 一个容器时，你才有可能丢失它的数据。即便如此，如果你将数据存储在 `volume` 中，即使容器消失了，这些数据仍然会存在。\n\n让我们快速提一下为什么我们推荐在删除容器之前先停止容器的两个阶段方法。\n\
    \n### 优雅地停止容器\n\n大多数容器都会运行单个进程。在我们之前的示例中，该进程是 `/bin/bash`。当你使用 `docker rm <container>\
    \ -f` 杀死一个正在运行的容器时，容器会在没有任何警告的情况下被杀死。这个过程非常粗暴——就像从背后溜到容器并对着它的后脑开枪。你完全没有给容器及其运行的进程任何在被杀死之前处理好事务的机会。\n\
    \n然而，`docker stop` 命令要礼貌得多。它会通知容器内部的进程即将被停止，给它一个在终结到来之前整理好一切的机会。一旦 `docker stop`\
    \ 命令返回，你就可以用 `docker rm` 删除容器了。\n\n背后的魔法涉及到 `signals`（信号）。`docker stop` 向容器内部\
    \ `PID 1` 的进程发送一个 `SIGTERM` 信号。正如我们所说，这给了进程一个清理并优雅自关闭的机会。如果它在 10 秒内没有退出，将收到一个\
    \ `SIGKILL`。这实际上是致命一击。但嘿，它至少先获得了 10 秒来处理自己。\n\n`docker rm <container> -f` 则不会通过\
    \ `SIGTERM` 礼貌地询问，而是直接执行 `SIGKILL`。正如我们刚才说的，这就像是从背后溜过去直接一锤敲断脑袋。我可不是一个暴力的人！\n\n\
    ### Web 服务器示例\n\n到为止，我们已经看到了如何启动一个简单的容器并与其交互。我们也看到了了如何 `stop`、`restart` 和销毁容器。现在让我们来看一个\
    \ Web 服务器的示例。\n\n在这个示例中，我们将从一个镜像启动一个新容器，这个镜像是我在一些 [Pluralsight 视频课程](https://app.pluralsight.com/library/search?q=nigel+poulton)\
    \ 中使用的。该镜像在 8080 端口运行一个极其简单的 Web 服务器。\n\n使用 `docker stop` 和 `docker rm` 命令清理系统上现有的容器。然后运行以下\
    \ `docker run` 命令。\n\n```\n$ docker run -d --name webserver -p 80:8080 \\\n  nigelpoulton/pluralsight-docker-ci\n\
    \nUnable to find image 'nigelpoulton/pluralsight-docker-ci:latest' locally\nlatest:\
    \ Pulling from nigelpoulton/pluralsight-docker-ci\na3ed95caeb02: Pull complete\n\
    3b231ed5aa2f: Pull complete\n7e4f9cd54d46: Pull complete\n929432235e51: Pull complete\n\
    6899ef41c594: Pull complete\n0b38fccd0dab: Pull complete\nDigest: sha256:7a6b0125fe7893e70dc63b2...9b12a28e2c38bd8d3d\n\
    Status: Downloaded newer image for nigelpoulton/plur...docker-ci:latest\n6efa1838cd51b92a4817e0e7483d103bf72a7ba7ffb5855080128d85043fef21\n\
    ```\n\n注意，你的 shell 提示符没有变化。这是因为我们使用 `-d` 标志在后台启动了这个容器。在后台启动容器不会将其挂载到你的终端。\n\n\
    这个示例向 `docker run` 命令传递了几个更多的参数，所以让我们快速看一下它们。\n\n我们知道 `docker run` 会启动一个新容器。但这次我们给了它\
    \ `-d` 标志而不是 `-it`。`-d` 告诉容器在后台运行，而不是挂载到你的终端终端。“d”代表 daemon mode（守护进程模式），`-d`\
    \ 和 `-it` 是互斥的。这意味着你不能在同一个容器上同时使用两者——显而易见的原因是你不能同时在后台和前台启动一个容器。\n\n之后，我们为容器命名并给了它\
    \ `-p 80:8080`。`-p` 标志将 Docker 宿主机端口映射到容器内的端口。这次我们将 Docker 宿主机上的 80 端口映射到容器内部的\
    \ 8080 端口。这意味着访问 Docker 宿主机 80 端口的流量将被重定向到容器内部的 8080 端口。正好我们用于容器的镜像定义了一个监听 8080\
    \ 端口的 Web 服务。这意味着我们的容器将启动并运行一个监听在 8080 端口的 Web 服务器。\n\n最后，我们告诉它使用哪个镜像。\n\n###\
    \ 检查容器\n\n在之前的示例中，你可能注意到我们没有为容器指定命令。这是如何发生的？\n\n在构建 Docker 镜像时，可以嵌入想要容器运行的默认命令或进程。如果我们对使用的镜像运行\
    \ `docker inspect` 命令，我们就能看到启动命令。\n\n```\n$ docker inspect nigelpoulton/docker-ci\n\
    \n[\n    {\n        \"Id\": \"sha256:07e574331ce3768f30305519...ba1\",\n     \
    \   \"RepoTags\": [\n            \"nigelpoulton/docker-ci:latest\"\n        ],\n\
    \        \"Cmd\": [\n            \"/bin/sh\",\n            \"-c\",\n         \
    \   #(nop) CMD [\\\"bin/sh\\\" \\\"-c\\\" \\\"cd /src \\u0026\\u026 node \\./app.js\\\
    \"]\n        ]\n    }\n]\n```\n\n我们裁剪了输出以便更容易找到感兴趣的信息。\n\n`Cmd` 之后的项显示了容器运行的命令，除非你在\
    \ `docker run` 中使用不同的命令覆盖它。如果你移除上面示例中所有的 shell 转义字符，你会得到以下命令：`/bin/sh -c \"cd\
    \ /src \\u0026\\u026 node ./app.js\"`。\n\n在构建镜像时带有默认命令是很常见的，这让启动容器变得更容易，强制了默认行为，并且是镜像的一种自我文档。\n\
    \n### 清理工作\n\n本章的示例到此结束。让我们来看看快速清理系统的方法。\n\n在这里，我们将向你展示最简单快捷的方法来移除 Docker 宿主机上的所有运行中的容器。但请警告，该过程将强制销毁所有容器而不给它们清理的机会。**绝对不要在生产系统或运行重要容器的系统上执行此操作。**\n\
    \n在你的 Docker 宿主机 shell 中运行以下命令来删除所有容器。\n\n```bash\n$ docker rm $(docker ps -aq)\
    \ -f\n6efa1838cd51\n```\n"
