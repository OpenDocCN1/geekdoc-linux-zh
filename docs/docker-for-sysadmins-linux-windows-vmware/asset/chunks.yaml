    \ whereas the stuff from CoreOS was more like the *de jure* standard.\n\nGetting\
    \ back to the story though, this all threatened to fracture the ecosystem and\
    \ present users and customers with a dilemma. While competition is usually a good\
    \ thing, *competing standards* is not. They cause confusion and slowdown adoption.\
    \ Not good for anybody.\n\nWith this in mind, everybody did their best to act\
    \ like adults and came together to form the OCI - a lightweight agile council\
    \ to govern container standards.\n\nAt the time of writing, the OCI has published\
    \ two specifications (standards) -\n\n*   An [image spec](https://github.com/opencontainers/image-spec)\n\
    \n*   A [runtime spec](https://github.com/opencontainers/runtime-spec)\n\nAn analogy\
    \ that’s often used when referring to these two standards is rail tracks. These\
    \ two standards are like agreeing on standard sizes and properties of rail tracks.\
    \ Leaving everyone else free to build better trains, better carriages, better\
    \ signaling systems, better stations… all safe in the knowledge that they’ll work\
    \ on the standardized tracks. Nobody wants two competing standards for rail track\
    \ sizes!\n\nIt’s fair to say that the two OCI specifications have had a major\
    \ impact on the architecture and design of the core Docker Engine. As of Docker\
    \ 1.11, the Docker Engine architecture conforms to the OCI runtime spec.\n\nSo\
    \ far, the OCI has achieved good things and gone some way to bringing the ecosystem\
    \ together. However, standards always slow innovation! Especially with new technologies\
    \ that are developing at close to warp speed. This has resulted in some raging\
    \ arguments passionate discussions in the container community. In the opinion\
    \ of your author, this is a good thing! The container industry is changing the\
    \ world and it’s normal for the people at the vanguard to be passionate and opinionated.\
    \ Expect more *passionate discussions* about standards and innovation!\n\nThe\
    \ OCI is organized under the auspices of the Linux Foundation and both Docker,\
    \ Inc. and CoreOS, Inc. are major contributors.\n\n## 3: Installing Docker\n\n\
    There are loads of ways and places to install Docker. There’s Windows, there’s\
    \ Mac, and there’s obviously Linux. But there’s also in the cloud, on premises,\
    \ on your laptop. Not to mention manual installs, scripted installs, wizard-based\
    \ installs. There literally are loads of ways and places to install Docker!\n\n\
    But don’t let that scare you! They’re all pretty easy.\n\nIn this chapter we’ll\
    \ cover some of the most important installs:\n\n*   Desktop installs\n\n    *\
    \   Docker for Windows\n\n    *   Docker for Mac\n\n*   Server installs\n\n  \
    \  *   Linux\n\nWe’ll add a Windows Server 2016 installation method after Windows\
    \ Server 2016 has gone G.A. At the time of writing, the installation method for\
    \ Windows Server 2016 TP5 is in a state of flux and not stable enough to be included\
    \ here.\n\n### Docker for Windows\n\nThe first thing to note is that *Docker for\
    \ Windows* is a packaged product from Docker, Inc. It spins up a single-engine\
    \ Docker environment on a 64-bit Windows 10 desktop or laptop.\n\nThis means we’re\
    \ **not** about to show you how to manually hack an installation of Docker onto\
    \ a Windows desktop or laptop. No! In this section we’ll look at how to install\
    \ the product from Docker, Inc. called “Docker for Windows”. And it’s insanely\
    \ simple!\n\nBut a word of caution! *Docker for Windows* is only intended for\
    \ **test** and **dev** work. You don’t want to run your production estate on it!\
    \ Remember, it’s only going to install a single engine. That’s another way of\
    \ saying it’s only going to install one copy of Docker. You might also find that\
    \ some of the latest Docker features aren’t always available straight away in\
    \ *Docker for Windows*. This is because Docker, Inc. are taking a *stability first,\
    \ features second* approach with the product. All of this adds up to a quick and\
    \ easy setup, but one that is **not** for production workloads.\n\nEnough waffle.\
    \ Let’s see how to install *Docker for Windows*.\n\nFirst up, pre-requisites.\
    \ *Docker for Windows* requires:\n\n*   Windows 10 Pro | Enterprise | Education\n\
    \n*   Must be 64-bit\n\n*   The Hyper-V and Containers features must be enabled\
    \ in Windows\n\n*   Hardware virtualization support must be enabled in your system’s\
    \ BIOS\n\nEnabling hardware virtualization support in your BIOS varies between\
    \ machine types. Most modern machines have the settings enabled by default, so\
    \ we won’t go into detail here. But the process is usually something like this:\
    \ reboot your machine > hold down the special BIOS key (this is usually something\
    \ like `Del`, `F12`, or `Insert`) > locate the hardware virtualization support\
    \ settings in your BIOS (Intel VT-x or AMD-V) > enable the settings > Save & Exit.\n\
    \n> **WARNING:** Take great care when modifying settings in your BIOS. Making\
    \ the wrong change can prevent your machine from booting.\n\nThe first thing to\
    \ do in Windows 10 is make sure the **Hyper-V** and **Containers** features are\
    \ installed and enabled.\n\n1.  Right-click the Windows Start button and choose\
    \ `Programs and Features`.\n\n2.  Click `Turn Windows features on or off`.\n\n\
    3.  Check the `Hyper-V` and `Containers` checkboxes and click `OK`.\n\nThis will\
    \ install and enable the Hyper-V and Containers features. Your system may require\
    \ a restart.\n\n![Figure 3.1](images/Figure3-1.png)\n\nFigure 3.1\n\nThe *Containers*\
    \ feature is only available if you are running the summer 2016 Windows 10 Anniversary\
    \ Update (build 14393).\n\nOnce you’ve installed the Hyper-V and Containers features\
    \ and restarted you machine, it’s time to install *Docker for Windows*.\n\n1.\
    \  Head over to www.docker.com and click `Get Docker` from the top of the homepage.\n\
    \n2.  Click the `Learn More` button under the **WINDOWS** section.\n\n3.  Click\
    \ `Download Docker for Windows` to download the `InstallDocker.msi` package to\
    \ your default downloads directory.\n\n4.  Locate and launch the `InstallDocker.msi`\
    \ package that you just downloaded.\n\nStep through the installation wizard and\
    \ provide local administrator credentials to complete the installation. Docker\
    \ will automatically start as a system service and a Moby Dock whale icon will\
    \ appear in the Windows notifications tray.\n\nCongratulations! You have installed\
    \ *Docker for Windows*.\n\nNow that *Docker for Windows* is installed you can\
    \ open a command prompt or PowerShell window and run some Docker commands. Try\
    \ the following commands:\n\n```\n C:\\Users\\nigelpoulton> docker version\n \
    \  Client:\n    Version:      1.12.1\n    API version:  1.24\n    Go version:\
    \   go1.6.3\n    Git commit:   23cf638\n    Built:        Thu Aug 18 17:32:24\
    \ 2016\n    OS/Arch:      windows/amd64\n    Experimental: true\n\n   Server:\n\
    \    Version:      1.12.1\n    API version:  1.24\n    Go version:   go1.6.3\n\
    \    Git commit:   23cf638\n    Built:        Thu Aug 18 17:32:24 2016\n    OS/Arch:\
    \      linux/amd64\n    Experimental: true\n```\n\nNotice that the `OS/Arch:`\
    \ for the **Server** component is showing as `linux/amd64` in the output above.\
    \ This is because the default installation currently installs the Docker daemon\
    \ inside of a lightweight Linux Hyper-V VM. In this default scenario you will\
    \ only be able to run Linux containers on your *Docker for Windows* install."
