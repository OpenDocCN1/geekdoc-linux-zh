    \ components fit together.\n\nBut don’t worry if some of the stuff we do here\
    \ is totally new to you. We’re not trying to make you experts by the end of this\
    \ chapter. All we’re doing here is giving you a *feel* of things - setting you\
    \ up so that when we get into the details in later chapters, you have an idea\
    \ of how the pieces fit together.\n\nAll you need to follow along with the exercises\
    \ in this chapter is a single Docker host. This can be any of the options we just\
    \ installed in the previous chapter, though if you are using *Docker for Windows*\
    \ you should be running it in “Linux Container” mode. It doesn’t matter if this\
    \ Docker host is a VM on your laptop, an instance in the public cloud, or bare\
    \ metal server in your data center. All it needs, is to be running Docker with\
    \ a connection to the internet.\n\n### Engine check\n\nWhen you install Docker\
    \ you get two major components:\n\n*   the Docker client\n\n*   the Docker daemon\
    \ (sometimes called server)\n\nThe daemon implements the [Docker Remote API](https://docs.docker.com/engine/reference/api/docker_remote_api/).\
    \ In a default Linux installation the client talks to the daemon via a local IPC/Unix\
    \ socket at `/var/run/docker.sock`. You can test that the client and daemon are\
    \ operating and can talk to each other with the `docker version` command.\n\n\
    ```\n$ docker version\nClient:\n Version:      1.12.1\n API version:  1.24\n Go\
    \ version:   go1.6.3\n Git commit:   23cf638\n Built:        Thu Aug 18 05:33:38\
    \ 2016\n OS/Arch:      linux/amd64\n\nServer:\n Version:      1.12.1\n API version:\
    \  1.24\n Go version:   go1.6.3\n Git commit:   23cf638\n Built:        Thu Aug\
    \ 18 05:33:38 2016\n OS/Arch:      linux/amd64\n```\n\nAs long as you get a response\
    \ back from the `Client` and `Server` components you should be good to go. If\
    \ you get an error response form the Server component, try the command again with\
    \ `sudo` in front of it: `sudo docker version`. If it works with `sudo` you will\
    \ need to prefix the remainder of the commands in this chapter with `sudo`.\n\n\
    ### Images\n\nNow let’s look at *images*.\n\nRight now, the best way to think\
    \ of a Docker image is as an object that contains an operating system and an application.\
    \ It’s not massively different from a virtual machine template. A virtual machine\
    \ template is essentially a stopped virtual machine. In the Docker world, an image\
    \ is effectively a stopped container.\n\nRun the `docker images` command on your\
    \ Docker host.\n\n```\n$ docker images\nREPOSITORY    TAG        IMAGE ID    \
    \   CREATED       SIZE\n```\n\nIf you are working from a freshly installed Docker\
    \ host it will have no images and will look like the output above."
