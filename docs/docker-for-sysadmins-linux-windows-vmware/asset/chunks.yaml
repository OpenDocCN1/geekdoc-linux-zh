- fmt: "\nThe container is now deleted - literally wiped off the face of the planet.\
    \ If it was a good container, it becomes a VM in the afterlife. If it was a naughty\
    \ container it becomes a dumb terminal :-D\n\nTo summarize the lifecycle of a\
    \ container. You can `stop`, `start`, `pause`, and `restart` a container as many\
    \ times as you want. And it’ll all happen really fast. But the container and it’s\
    \ data will always be safe. It’s not until you explicitly `kill` a container that\
    \ you run any chance of losing its data. And even then, if you’re storing data\
    \ in a `volume`, that data’s going to persist even after the container has gone.\n\
    \nLet’s quickly mention why we recommended a two-stage approach of stopping the\
    \ container before deleting it.\n\n### Stopping containers gracefully\n\nMost\
    \ containers will run a single process. In our previous example that process was\
    \ `/bin/bash`. When you kill a running container with `docker rm <container> -f`\
    \ the container will be killed without warning. The procedure is quite violent\
    \ - a bit like sneaking up behind the container it and shooting it in the back\
    \ of the head. You’re literally giving the container and the process it’s running\
    \ no chance to straighten it’s affairs before being killed.\n\nHowever, the `docker\
    \ stop` command is far more polite. It gives the process inside of the container\
    \ a heads-up that it’s about to be stopped, giving it a chance to get things in\
    \ order before the end comes. Once the `docker stop` command returns, you can\
    \ then delete the container with `docker rm`.\n\nThe magic behind the scenes here\
    \ has to do with `signals`. `docker stop` sends a `SIGTERM` signal to process\
    \ with `PID 1` inside of the container. As we just said, this gives the process\
    \ a chance to clean things up and gracefully shut itself down. If it doesn’t exit\
    \ within 10 seconds it will receive a `SIGKILL`. This is effectively the bullet\
    \ to the head. But hey, it got 10 seconds to sort itself out first.\n\n`docker\
    \ rm <container> -f` doesn’t bother asking nicely with a `SIGTERM`, it just goes\
    \ straight to the `SIGKILL`. Like we said a second ago, this is like creeping\
    \ up from behind and smashing it over the head. I’m not a violent person by then\
    \ way!\n\n### Web server example\n\nSo far we’ve seen how to start a simple container\
    \ and interact with it. We’ve also seen how to `stop`, `restart` and destroy containers.\
    \ Now let’s take a look at a web server example.\n\nIn this example we’ll start\
    \ a new container from an image I use in a few of my [Pluralsight video courses](https://app.pluralsight.com/library/search?q=nigel+poulton).\
    \ The image runs an insanely simple web server on port 8080.\n\nUse the `docker\
    \ stop` and `docker rm` commands to clean up any existing containers on your system.\
    \ Then run the following `docker run` command.\n\n```\n$ docker run -d --name\
    \ webserver -p 80:8080 \\\n  nigelpoulton/pluralsight-docker-ci\n\nUnable to find\
    \ image 'nigelpoulton/pluralsight-docker-ci:latest' locally\nlatest: Pulling from\
    \ nigelpoulton/pluralsight-docker-ci\na3ed95caeb02: Pull complete\n3b231ed5aa2f:\
    \ Pull complete\n7e4f9cd54d46: Pull complete\n929432235e51: Pull complete\n6899ef41c594:\
    \ Pull complete\n0b38fccd0dab: Pull complete\nDigest: sha256:7a6b0125fe7893e70dc63b2...9b12a28e2c38bd8d3d\n\
    Status: Downloaded newer image for nigelpoulton/plur...docker-ci:latest\n6efa1838cd51b92a4817e0e7483d103bf72a7ba7ffb5855080128d85043fef21\n\
    ```\n\nNotice that your shell prompt hasn’t changed. This is because we started\
    \ this container in the background with the `-d` flag. Starting a container in\
    \ the background does not attach it to your terminal.\n\nThis example threw a\
    \ few more arguments at the `docker run` command, so let’s take a quick look at\
    \ them.\n\nWe know `docker run` starts a new container. But this time we give\
    \ it the `-d` flag instead of `-it`. `-d` tells the container to run in the background\
    \ rather than attaching to your terminal in the foreground. The “d” stands for\
    \ daemon mode, and `-d` and `-it` are mutually exclusive. This means you can’t\
    \ use both on the same container - for obvious reasons you cannot start a container\
    \ in the background and in the foreground at the same time.\n\nAfter that, we\
    \ name the container and then give it `-p 80:8080`. The `-p` flag maps ports on\
    \ the Docker host to ports in the container. This time we’re mapping port 80 on\
    \ the Docker host to port 8080 inside the container. This means that traffic hitting\
    \ the Docker host on port 80 will be directed to port 8080 inside of the container.\
    \ It just so happens that the image we’re using for this container defines a web\
    \ service that listens on port 8080\\. This means our container will come up running\
    \ a web server listening on port 8080.\n\nFinally we tell it which image use.\n\
    \n### Inspecting containers\n\nIn the previous example you might have noticed\
    \ that we didn’t specify a command for the container. How did this happen?\n\n\
    When building a Docker image it’s possible to embed a default command or process\
    \ you want containers to run. If we run a `docker inspect` command against the\
    \ image we used to run, we’ll be able to see the command starts.\n\n```\n$ docker\
    \ inspect nigelpoulton/docker-ci\n\n[\n    {\n        \"Id\": \"sha256:07e574331ce3768f30305519...ba1\"\
    ,\n        \"RepoTags\": [\n            \"nigelpoulton/docker-ci:latest\"\n  \
    \      ],\n        \"Cmd\": [\n            \"/bin/sh\",\n            \"-c\",\n\
    \            #(nop) CMD [\\\"/bin/sh\\\" \\\"-c\\\" \\\"cd /src \\u0026\\u0266\
    \ node \\./app.js\\\"]\n        ]\n    }\n]\n```\n\nWe’ve snipped out the output\
    \ to make is easier to find the information we’re interested in.\n\nThe entries\
    \ after `Cmd` show the command(s) that the container will run unless you override\
    \ the with a different command as part of `docker run`. If you remove all of the\
    \ shell escapes in the example above, you get the following command `/bin/sh -c\
    \ \"cd /src \\u0026\\u0266 node ./app.js\"`.\n\nIt’s common to build images with\
    \ default commands like this as it makes starting containers easier, forces a\
    \ default behavior, and is a form of self documentation for the image.\n\n###\
    \ Tidying up\n\nThat’s us done for the examples in this chapter. Let’s see a quick\
    \ way to tidy our system up.\n\nHere we’re going to show you the simplest and\
    \ quickest way to get rid if every running container on your Docker host. Be warned\
    \ though, the procedure will forcible destroy all containers without giving them\
    \ a chance to clean up. **This should never be performed on production systems\
    \ or systems running important containers.**\n\nRun the following command from\
    \ the shell of your Docker host to delete all containers.\n\n```bash\n$ docker\
    \ rm $(docker ps -aq) -f\n6efa1838cd51\n```\n"
