  trans: "\n\n从第一天起，Docker 的增长就非常惊人。越来越多的人在越来越多的场景下为了越来越多的事情使用它。因此，某些人感到沮丧是不可避免的。这是正常且健康的。\n\
    \n这段`根据 Nigel 说的历史` 的要点（TLDR）是：一家名为 [CoreOS](https://coreos.com) 的公司不喜欢 Docker\
    \ 处理某些事情的方式。于是他们采取了行动！他们创建了一个名为 `[appc](https://github.com/appc/spec/)` 的新开放标准，定义了镜像格式和容器运行时等内容。他们还创建了该标准的实现，称为\
    \ `rkt`（读作“rocket”）。\n\n这让容器生态系统处于了尴尬的境地，出现了两个竞争的标准。用更准确的说法来说，Docker 的东西是`事实上的`（de\
    \ facto）标准和运行时，而 CoreOS 的东西则更像是`法定的`（de jure）标准。\n\n回到故事，这一切都威胁到了生态系统的碎片化，并让用户和客户陷入两难境地。虽然竞争通常是好事，但`竞争性标准`并非如此。它们会导致混乱并减缓采用速度。对任何人都没有好处。\n\
    \n考虑到这一点，大家都尽力像成年人一样表现，并共同组成了 OCI —— 一个治理容器标准的轻量级敏捷委员会。\n\n在编写本文时，OCI 已发布了两个规范（标准）：\n\
    \n*   一个[镜像规范](https://github.com/opencontainers/image-spec)\n*   一个[运行时规范](https://github.com/opencontainers/runtime-spec)\n\
    \n在提到这两个标准时，经常使用的一个类比是轨道。这两个标准就像对铁轨的标准尺寸和属性达成共识，让其他人自由地建造更好的火车、更好的车厢、更好的信号系统、更好的车站……而且他们都放心地知道这些可以在标准轨道上运行。没有人希望铁轨尺寸上出现两个相互竞争的标准！\n\
    \n可以说，这两个 OCI 规范对核心 Docker 引擎的架构和设计产生了重大影响。从 Docker 1.11 开始，Docker Engine 架构符合\
    \ OCI 运行时规范。\n\n到目前为止，OCI 取得了良好的成效，并在整合生态系统方面做出了努力。然而，标准总是会拖慢创新速度！尤其是那些以接近光速发展的新技术。这导致了容器社区中出现了一些激烈的争论和热烈的讨论。在作者看来，这是一好事！容器行业正在改变世界，前沿人士充满激情并持有自己的见解是正常的。请期待会有更多关于标准和创新的`热烈讨论`！\n\
    \nOCI 在 Linux 基金赞助下组织，Docker, Inc. 和 CoreOS, Inc. 都是主要的贡献者。\n\n## 3: 安装 Docker\n\
    \n有很多方法和地方可以安装 Docker。有 Windows、有 Mac，显然还有 Linux。但也有云端、本地部署、以及你的笔记本电脑。更不用说手动安装、脚本安装、基于向导的安装了。安装\
    \ Docker 的方法和地方真的非常多！\n\n但不要被这些吓着了！它们都非常简单。\n\n在本章中，我们将涵盖一些最重要的安装方式：\n\n*   桌面安装\n\
    \    *   Docker for Windows\n    *   Docker for Mac\n*   服务器安装\n    *   Linux\n\
    \n我们将在 Windows Server 2016 正式发布（G.A.）后添加其安装方法。在编写本文时，Windows Server 2016 TP5 的安装方法处于变动中，尚未稳定到可以包含在此。\n\
    \n### Docker for Windows\n\n首先需要注意的是，`Docker for Windows` 是 Docker, Inc. 的一个封装产品。它在\
    \ 64 位 Windows 10 桌面或笔记本电脑上启动一个单引擎 Docker 环境。\n\n这意味着我们**并不是**要向你展示如何在 Windows\
    \ 桌面或笔记本电脑上手动破解安装 Docker。不！在本节中，我们将介绍如何安装 Docker, Inc. 的名为“Docker for Windows”的产品。而且非常简单！\n\
    \n但要提醒你一点！`Docker for Windows` 仅用于**测试**和**开发**（dev）工作。你可不想在上面运行你的生产环境！记住，它只会安装一个引擎。换句话说，它只会安装一个\
    \ Docker 副本。你可能还会发现，一些最新的 Docker 特性在 `Docker for Windows` 中并不总是可用。这是因为 Docker,\
    \ Inc. 对该产品采取了`稳定性优先，功能次后`的方法。这一切共同构成了一个快速简便的设置，但这种设置**不适用于**生产工作负载。\n\n废话够了。让我们看看如何安装\
    \ `Docker for Windows`。\n\n首先是先决条件。`Docker for Windows` 需要：\n\n*   Windows 10\
    \ 专业版 | 企业版 | 教育版\n*   必须是 64 位\n*   Windows 中必须启用 Hyper-V 和 Containers 功能\n*\
    \   系统 BIOS 必须启用硬件虚拟化支持\n\n在 BIOS 中启用硬件虚拟化支持因机器类型而异。大多数现代机器默认启用了这些设置，因此我们在这里不详述。但过程通常是这样的：重启电脑\
    \ > 按住特殊的 BIOS 键（通常是 `Del`、`F12` 或 `Insert`） > 在 BIOS 中找到硬件虚拟化支持设置（`Intel VT-x`\
    \ 或 `AMD-V`） > 启用设置 > 保存并退出。\n\n> **警告：** 修改 BIOS 设置时要非常小心。错误的更改会导致你的机器无法启动。\n\
    \n在 Windows 10 中要做的第一件事是确保安装了 **Hyper-V** 和 **Containers** 功能。\n\n1.  右键点击 Windows\
    \ 按钮并选择`程序和功能`\n2.  点击`启用或关闭 Windows 功能`\n3.  勾选`Hyper-V` 和 `Containers` 复选框并点击`确定`\n\
    \n![Figure3.1](img/Figure3-1.png)\n图 3.1\n\n*Containers* 功能仅在你运行 2016 年夏季 Windows\
    \ 10 周年更新（内部版本 14393）时可用。一旦安装完成……并重启电脑，就可以安装 `Docker for Windows` 了。\n\n1.  访问\
    \ `www.docker.com` 并点击首页顶部的 `Get Docker`。\n2.  点击 **WINDOWS** 部分下的 `Learn More`\
    \ 按钮。\n3.  点击 `Download Docker for Windows` 将 `InstallDocker.msi` 包下载到你的默认下载目录。\n\
    4.  找到并运行你刚刚下载的 `InstallDocker.msi` 包。\n\n按照安装向导操作，并提供本地管理员凭据完成安装。Docker 将自动作为系统服务启动，Windows\
    \ 通知区域中会出现一个 Moby Dock 图标。\n\n恭喜你！你已经安装了 `Docker for Windows`。\n\n现在已经安装了 `Docker\
    \ for Windows`，你可以打开命令提示符或 PowerShell 窗口并运行一些 Docker 命令。尝试以下命令：\n\n```\n C:\\\
    Users\\nigelpoulton> docker version\n   Client:\n    Version:      1.12.1\n  \
    \  API version:  1.24\n    Go version:   go1.6.3\n    Git commit:   23cf638\n\
    \    Built:        Thu Aug 18 17:32:24 2016\n    OS/Arch:      windows/amd64\n\
    \    Experimental: true\n\n   Server:\n    Version:      1.12.1\n    API version:\
    \  1.24\n    Go version:   go1.6.3\n    Git commit:   23cf638\n    Built:    \
    \    Thu Aug 18 17:32:24 2016\n    OS/Arch:      linux/amd64\n    Experimental:\
    \ true\n```\n\n注意在上面的输出中，**Server** 组件的 `OS/Arch:` 显示为 `linux/amd64`。这是因为目前的安装会将\
    \ Docker 守护进程安装在一个轻量级的 Linux Hyper-V 虚拟机内部。在这种默认情况下，你只能在 `Docker for Windows`\
    \ 安装上运行 Linux 容器。\n\n"
- fmt: "\nIf you want to run `native Windows containers` you can right click the Docker\
    \ whale icon in the Windows notifications tray and select the option to `Switch\
    \ to Windows containers...`. You may get the following alert if you have not enabled\
    \ the `Windows Containers` feature.\n\n![Figure 3.2](images/figure3-2.png)\n\n\
    Figure 3.2\n\nIf you already have the Windows Containers feature enabled it will\
    \ only take a few seconds to make the switch. Once the switch has been made the\
    \ output to the `docker version` command will look like this.\n\n```\nC:\\Users\\\
    nigelpoulton> docker version\nClient:\n Version:      1.12.1\n API version:  1.24\n\
    \ Go version:   go1.6.3\n Git commit:   23cf638\n Built:        Thu Aug 18 17:32:24\
    \ 2016\n OS/Arch:      windows/amd64\n Experimental: true\n\nServer:\n Version:\
    \      1.13.0-dev\n API version:  1.25\n Go version:   go1.7.1\n Git commit: \
    \  c2decbe\n Built:        Tue Sep 13 15:12:54 2016\n OS/Arch:      windows/amd64\n\
    ```\n\nNotice that the Server version is now also showing as `windows/amd64`.\
    \ This means the daemon is now running natively on the Windows kernel and will\
    \ therefore only run Windows containers.\n\nAlso note that the system above is\
    \ running the `experimental` version of Docker (`Experimental: true`). `Docker\
    \ for Windows` has stable and an experimental channel. You can switch between\
    \ the two, but you should check the Docker website for restrictions and implications\
    \ before doing so.\n\nAs shown below, other regular Docker commands work as normal.\n\
    \n```\n C:\\Users\\nigelpoulton>docker info\n   Containers: 0\n    Running: 0\n\
    \    Paused: 0\n    Stopped: 0\n   Images: 0\n   Images: 0\n   Server Version:\
    \ 1.13.0-dev\n   Storage Driver: windowsfilter\n    Windows:\n   Logging Driver:\
    \ json-file\n   Plugins:\n    Volume: local\n    Network: nat null overlay\n \
    \  <Snip>\n   Registry: https://index.docker.io/v1/\n   Experimental: true\n \
    \  Insecure Registries:\n    127.0.0.0/8\n```\n\nDocker for Windows includes the\
    \ Docker Engine (client and daemon), Docker Compose, and Docker Machine. Use the\
    \ following commands to verify that each was successfully installed and which\
    \ versions of each you have:\n\n```\nC:\\Users\\nigelpoulton> docker --version\n\
    Docker version 1.12.1, build 23cf638, experimental\n```\n\n```\nC:\\Users\\nigelpoulton>\
    \ docker-compose --version\ndocker-compose version 1.8.0, build d988a55\n```\n\
    \n```\nC:\\Users\\nigelpoulton> docker-machine --version\ndocker-machine version\
    \ 0.8.1, build 41b3b25\n```\n\n### Docker for Mac\n\nThe first thing to note about\
    \ `Docker for Mac` is that it’s a packaged product from Docker, Inc. So relax,\
    \ you don’t need to be a kernel engineer, and we’re not about to walk through\
    \ a complex hack for getting Docker onto your Mac. We’ll walk you through the\
    \ process of installing `Docker for Mac` on your Mac desktop or laptop, and it’s\
    \ ridiculously easy.\n\n#### What is `Docker for Mac`?\n\n`Docker for Mac` is\
    \ packaged product that allows you to easily get a small single-engine Docker\
    \ environment up and running locally on your Mac. If you’ve heard of `boot2docker`\
    \ then `Docker for Mac` is what you always wished `boot2docker` was - it’s smooth,\
    \ simple and stable. But `Docker for Mac` is only intended for test and dev work.\
    \ You shouldn’t think of it as a production platform to run your business from.\
    \ No! `Docker for Mac` is all about getting a small working installation of Docker\
    \ up and running on your Mac in the simplest way possible so that you can test\
    \ and develop containerized applications on your Mac.\n\nIt’s also worth noting\
    \ that `Docker for Mac` will not give you the Docker Engine running natively on\
    \ the Mac OS Darwin kernel. Behind the scenes it runs the Docker Engine inside\
    \ of a lightweight Linux VM. It then seamlessly exposes that Docker Engine and\
    \ API to your Mac environment. But it does it all in a way that the mystery and\
    \ magic that pulls it all together is hidden away behind the scenes. All you need\
    \ to know is that you can open a terminal on your Mac and use the regular Docker\
    \ commands to hit the Docker API.\n\nAlthough this seamlessly works on your Mac….\
    \ Its obviously Docker on Linux under the hood, so it’s only going work with Linux-based\
    \ Docker containers. This is good though, as this is where most of the container\
    \ action is.\n\nFigure 3.3 shows a high level representation of the `Docker for\
    \ Mac` architecture.\n\n![Figure 3.3](images/figure3-3.png)\n\nFigure 3.3\n\n\
    > **Note:** For the curious reader, `Docker for Mac` leverages [HyperKit](https://github.com/docker/hyperkit)\
    \ to implement a super lightweight hypervisor. HyperKit in turn is based off the\
    \ [xhive hypervisor](https://github.com/mist64/xhyve). `Docker for Mac` also leverages\
    \ features from [DataKit](https://github.com/docker/datakit) and runs a highly\
    \ tuned Linux distro called Moby that is based off of [Alpine Linux].\n"
