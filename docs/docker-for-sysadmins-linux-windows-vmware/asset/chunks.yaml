  trans: "\n如果你在之前的输出中查看 `MANAGER STATUS` 列，你会发现三个管理节点显示为“Reachable”（可达）或“Leader”（领导者）。我们很快就会学习更多关于领导者的知识。`MANAGER\
    \ STATUS` 列为空的节点是*workers*（工作节点）。另外，请注意显示 `mgr2` 的那一行 ID 后面有一个星号（`*`）。这告诉我们是在从哪个节点运行了\
    \ `docker node ls` 命令。在本例中，命令是从 `mgr2` 发出的。\n\n> **注意：** 每次将节点加入集群（swarm）时都要指定\
    \ `--advertise-addr` 和 `--listen-addr` 标志是一件头疼的事。然而，如果你搞错了集群的网络配置，那可能会更加头疼。手动将节点添加到集群中不太是一项日常任务，因此我认为投入额外的前期精力来使用这些标志是值得的。不过这取决于你的选择。在实验室环境或只有单个\
    \ IP 的节点上，你不需要使用这些标志。\n\n现在我们已经建立并运行了一个*swarm*（集群），让我们来看看管理节点的高可用性。\n\n## 集群管理器高可用性\
    \ (HA)\n\n到目前为止，我们已经向集群添加了三个管理节点。为什么要添加三个？它们又是如何工作的？在本节中，我们将回答所有这些问题以及更多内容。\n\n\
    集群*managers*（管理器）原生支持高可用性（HA）。这意味着其中一个或多个节点可以故障，幸存的节点将保持集群运行。\n\n从技术上讲，集群模式实现了一种主备式多管理器\
    \ HA 高可用性。这意味着尽管你可能——并且应该——有多个*managers*（管理器），但在任何时候只有一个管理器会被认为是*active*（活跃的）的。我们将这个活跃管理器称为*leader*（领导者）。领导者是唯一会对*swarm*（集群）发布实时命令的，例如更改集群配置或向工作节点（workers）发布任务。如果非活跃管理器接收到集群命令，它会将这些命令代理给领导者。\n\
    \n该过程如图图 7.3 所示，其中步骤 `1` 是来自远程 Docker 客户端发送到*manager*的命令。步骤 2 是非领导者管理器将命令代理给领导者。步骤\
    \ 3 是领导者将该命令推送到集群中的相关节点。\n\n![Figure 7.3](img/figure7-3.png)\n\n图 7.3\n\n集群使用\
    \ [Raft 共识算法](https://raft.github.io/) 的实现来驱动管理器 HA，并适用以下两个最佳实践：\n\n1. 部署奇数个管理器。\n\
    2. 不要部署过多的管理器。\n\n部署奇数个*managers*（管理器）可以增加达到法定人数（quorum）的机会，并避免脑裂（split-brain）。例如，如果你有\
    \ 4 个管理器且发生了网络分区，你可能会在分区的每一侧各剩下两个管理器。这被称为脑裂——每一侧都知道曾经有 4 个，但现在只能看到 2 个。任何一方都无法知道它们再也看不见的那\
    \ 2 个节点是否仍然存活，以及哪一侧持有多数份额（法定人数）。然而，如果你有 3 个或 5 个管理器并发生了同样的网络分区，则不可能在分裂的双方拥有相同数量的管理器。这意味着其中一方有更大的机会知道自己是比另一方多还是少，并实现法定人数通过。\n\
    \n![Figure 7.4](img/figure7-4.png)\n\n图 7.4\n\n与所有的共识算法一样——参与者越多，达成共识所需的时间越长。这就像决定在哪里吃饭——3\
    \ 个人做决定总是比 33 个人更快更更容易！考虑到这一点，为了高可用性，拥有 3 个或 5 个管理器是最佳实践。7 个可能可行，但通常公认为 3 个或 5\
    \ 个是最优的。你绝对不想要超过 7 个，因为达成共识所需的时间会更长。\n\n关于管理器 HA 的最后警告。虽然将你的管理器分布在网络内的可用区中显然是一项良好做法，但你需要确保连接它们的网络是可靠的！网络分区可能是一个极其痛苦的问题！这意味着，在编写时，跨越\
    \ AWS 和 Azure 等多个云提供商托管你的活跃生产应用和基础设施有点像是一场白日梦。请花时间确保你的管理器通过高速、可靠的网络连接起来！\n\n现在我们已经构建了*swarm*（集群）并理解了*leaders*和*manager\
    \ HA*的概念，让我们转向*services*（服务）。\n\n## Services（服务）\n\n正如我们在*Swarm primer（集群入门）中所说的……服务是\
    \ Docker 1.12 引入的一种新结构，仅存在于*swarm mode*（集群模式）中。\n\n它们允许我们为一组容器（任务）*declare*（声明）*desired\
    \ state*（期望状态）并将其传递给 Docker。例如，假设你有一个带有 Web 前的应用。你有一个 Web 服务器的镜像，并且测试显示你需要 5 个\
    \ Web 服务实例来处理正常的日常流量。你将此项需求转换为一个*service*（服务），声明容器应该使用的镜像，以及该服务应该始终有 5 个正在运行的任务。\n\
    \n稍后我们将看到其他可以作为服务一部分进行声明的内容，但在那之前，让我们看看如何创建我们刚刚描述的那个服务。\n\n我们使用 `docker service\
    \ create` 命令创建一个服务。\n\n```\n$ docker service create --name web-fe \\\n   -p 8080:8080\
    \ \\\n   --replicas 5 \\\n   nigelpoulton/web-fe\n```\n\n让我们回顾一下该命令和输出。\n\n我们使用\
    \ `docker service create` 告诉 Docker 我们要创建一个服务，并使用 `--name` 标志将服务命名为 `web-fe`。我们使用\
    \ `--replicas` 标志告诉 Docker 应该有 5 个任务。最后，我们告诉 Docker 使用哪个镜像：`nigelpoulton/web-fe`。\n\
    \n但此尚未结束。所有的*services*（服务）都由集群持续进行监控——集群运行一个协调循环，不断比较服务的*actual state*（实际状态）和*desired\
    \ state*（期望状态）。如果两个状态匹配，世界就太平了，不需要采取任何进一步行动。如果它们不匹配，集群会采取行动使其匹配。换句话说，集群在不断确保*actual\
    \ state* 匹配*desired state*。\n\n例如，如果托管其中 5 个 `web-fe` 容器任务的其中一个*workers*（工作节点）发生故障，则该\
    \ `web-fe` 服务的*actual state* 将从 5 个运行任务减少到 4 个。这不再符合 5 个的*desired state*，Docker\
    \ 将启动一个新的 `web-fe` 任务，以使*actual state* 恢复到与*desired state* 一致。这种行为非常强大，允许服务在节点故障时进行自愈。\n\
    \n## 查看和检查服务\n\n你可以使用 `docker service ls` 命令查看集群上运行的所有服务的列表。\n\n```\n$ docker\
    \ service ls\nID            NAME    REPLICAS  IMAGE                         COMMAND\n\
    2kffzpz721nr  web-fe  5/5       nigelpoulton/plur...cker-ci\n```\n\n上面的输出显示了单个运行的服务以及关于状态的一些基本信息。除其他之外，我们可以看到服务的名称，以及\
    \ 5 个期望任务/容器中有 5 个处于运行状态。如果你在部署服务后不久运行此命令，它可能不会显示所有任务/容器均为运行状态。这可能是因为在每个节点上拉取镜像所需的时间。\n\
    \n你可以使用 `docker service ps` 命令查看服务的任务列表及其状态。\n"
