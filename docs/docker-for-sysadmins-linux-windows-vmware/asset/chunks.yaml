  trans: "\n\n当我们在 `swarm` 的上下文中提到 `tasks` 时，我们指的是容器。所以，当我们说“管理器将 `tasks` 分发给工作节点”时，我们的意思是它们分发了容器工作负载。你可能还会听它们被称为\
    \ `replicas`（副本）。这可能会让你感到困惑，所以请记住 `tasks` 和 `replicas` 都是 `containers` 的意思。\n\n\
    接下来我们需要了解的是 `services`（服务）。`Services` 是我们在 `swarm` 上运行的主要构造体。服务本质上就是一种为一组任务（容器）设置\
    \ `desired state`（期望状态）的声明式方法。但它非常强大。能够为以下内容设置 `desired state` 的能力是改变游戏规则的：\n\n\
    *   设置组成服务的任务数量\n*   设置服务中容器将使用的镜像\n*   设置更新到更高版本镜像的程序\n\n`swarm` 的配置和状态存储位于 swarm\
    \ 中所有管理器节点上的分布式 `etcd` 数据库中。它保持极新的状态，并以内存形式托管在所有 `manager nodes` 上以确保速度。但它最棒的一点是它需要零配置——它会自动运行。\n\
    \n`swarm mode` 的另一个改变游戏规则的特点是它的安全方法。TLS 的集成如此紧密，以至于没有它就无法构建 swarm。在当今注重安全意识的世界里，这样的功能应该得到所有的赞誉！总之，`swarm\
    \ mode` 使用 TLS 来加密通信、验证节点身份并授权角色。自动密钥轮也是锦上添花！而且这一切发生得如此顺畅，以至于你甚至察不到它的存在！\n\n入门介绍就足够了。让我们通过示例来开始实际操作吧。\n\
    \n## 实验设置\n\n在本章的剩余部分中，我们将构建图 7.2 所示的实验环境，包含 6 个节点，配置为 3 个管理器和 3 个工作节点。每个节点都运行带有\
    \ Docker 1.12 或更高版本的 Linux。实验中的所有节点都可以通过网络通信。\n\n![Figure 7.2](img/figure7-2.png)\n\
    \n图 7.2\n\n名称和 IP 地址并不重要，在你的实验中可能会有所不同。如果你正在跟随示例操作，请记住将它们替换为你自己的地址。\n\n## 启用 swarm\
    \ 模式\n\n在以 `single-engine mode`（单引擎模式）运行的 Docker 主机上运行 `docker swarm init` 将该节点切换到\
    \ `swarm mode` 并创建一个新的 `swarm`。它还将使该节点成为 `manager`。\n\n然后可以使用 `docker swarm join`\
    \ 命令将其他节点作为工作节点和管理器加入 swarm。这使这些节点作为操作的一部分进入 `swarm mode`。\n\n以下步骤将把 `mgr1` 放入\
    \ `swarm mode` 并初始化一个新的 swarm。随后随后会将 `wrk1`、`wrk2` 和 `wrk3` 作为工作节点加入——自动将它们放入\
    \ `swarm mode`。最后，它会将 `mgr2` 和 `mgr3` 作为额外的管理器添加并将它们切换到 `swarm mode`。程序结束，所有 6\
    \ 个节点将成为同一个 swarm 的一部分，并且都在 `swarm mode` 下运行。\n\n1.  登录到 `mgr1` 并初始化一个新的 swarm。\n\
    \n    ```\n    $ docker swarm init \\\n      --advertise-addr 10.0.0.1:2377 \\\
    \n      --listen-addr 10.0.0.1:2377\n\n    Swarm initialized: current node (d21lyzn0v5qvgdyfzec79qzkx)\
    \ is now a manager.\n    ```\n\n    该命令可以分解如下：\n\n    *   `docker swarm init`\
    \ 通知 Docker 启动一个新集群并将此节点变为第一个管理器。它还启用了节点上的 swarm 模式。\n    *   `--advertise-addr`\
    \ 是其他节点连接此管理器应使用的 IP 和端口。该标志是可选的，但它允许你控制在具有多个 IP 的节点上使用哪个 IP。它还让你有机会指定节点上不存在的\
    \ IP 地址，例如负载均衡器的 IP 地址。\n    *   `--listen-addr` 允许你指定要在哪个 IP 和端口上监听 swarm 流量。这通常与\
    \ `--advertise-addr` 匹配，但在你希望在具有多个 IP 的系统中将 swarm 限制在特定 IP 时非常有用。在 `--advertise-addr`\
    \ 指向负载均衡器等远程 IP 地址的情况下，也是必须的。\n\n    我建议你始终使用这两个标志。\n\n    swarm 模式运行的默认端口是 `2377`。这是完全可以自定义的，但\
    \ Docker, Inc. 正在向 IANA 注册此端口为官方 Docker swarm 端口。\n\n2.  列出 swarm 中的节点\n\n   \
    \ ```\n    $ docker node ls\n    ID            HOSTNAME   STATUS  AVAILABILITY\
    \  MANAGER STATUS\n    d21...qzkx *  mgr1       Ready   Active        Leader\n\
    \    ```\n\n    注意，`mgr1` 目前是 swarm 中唯一的节点并被列为 `Leader`（领导者）。我们稍后会回到这一点。\n\n3.\
    \  从 `mgr1` 运行 `docker swarm join-token` 命令以提取向 swarm 添加新工作节点管理器所需的命令和令牌。\n\n\
    \    ```\n    $ docker swarm join-token worker\n    To add a manager to this swarm,\
    \ run the following command:\n       docker swarm join \\\n       --token SWMTKN-1-0uahebax...c87tu\n\
    \n    $ docker swarm join-token manager\n    To add a manager to this swarm, run\
    \ the following command:\n       docker swarm join \\\n       --token SWMTKN-1-0uahebax...c87tu\n\
    \    ```\n\n4.  登录到 `wrk1` 并使用加入工作节点的令牌通过 `docker swarm join` 命令将其加入 swarm。\n\n\
    \    ```\n    $ docker swarm join \\\n        --token SWMTKN-1-0uahebax...c87tu\
    \ \\\n        10.0.0.1:2377 \\\n        --advertise-addr 10.0.0.4:2377 \\\n  \
    \      --listen-addr 10.0.0.4:2377\n    ```\n\n    该节点已加入 swarm。\n\n    我手动添加了\
    \ `--advertise-addr` 和 `--listen-addr` 标志，因为我认为在涉及网络方面尽可能具体是最佳实践。\n\n5.  在 `wrk2`\
    \ 和 `wrk3` 上重复之前的步骤，将它们作为工作节点加入。确保对 `wrk2` 和 `wrk3` 自身的 IP 地址使用 `--advertise-addr`\
    \ 和 `--listen-addr` 标志。\n\n6.  登录到 `mgr2` 并使用加入管理器的令牌通过 `docker swarm join` 命令将其作为管理器加入\
    \ swarm。\n\n    ```\n    $ docker swarm join \\\n        --token SWMTKN-1-0uahebax...c87tu\
    \ \\\n        10.0.0.1:2377 \\\n        --advertise-addr 10.0.0.2:2377 \\\n  \
    \      --listen-addr 10.0.0.2:2377\n    ```\n\n    该节点已作为管理器加入 swarm。\n\n7.  在\
    \ `mgr3` 上重复之前的步骤，记得对 `advertise-addr` 和 `--listen-addr` 标志使用 `mgr3` 的 IP 地址。\n\
    \n8.  通过从 swarm 中的任何管理器节点运行 `docker node ls` 来列出 swarm 中的节点。\n\n    ```\n    $\
    \ docker node ls\n    ID               HOSTNAME     STATUS  AVAILABILITY  MANAGER\
    \ STATUS\n    0g4rl...babl8 *  mgr2         Ready   Active        Reachable\n\
    \    2xlti...l0nyp    mgr3         Ready   Active        Reachable\n    8yv0b...wm67\
    \    wrk1         Ready   Active\n    9mzwf...e4m4n    wrk3         Ready   Active\n\
    \    d21ly...9qzkx    mgr1         Ready   Active        Leader\n    e62gf...l5wt6\
    \    wrk2         Ready   Active\n    ```\n\n恭喜！你刚刚创建了一个包含 3 个管理器和 3 个工作节点的 6\
    \ 节点 swarm。在此过程中，你将每个节点上的 Docker 引擎放入了 `swarm mode`。作为额外奖励，`swarm` 自动通过 TLS 实现了安全保护。\n\
    \n"
- fmt: "\nIf you look in the `MANAGER STATUS` column in the previous output you’ll\
    \ see that the three manager nodes are showing as either “Reachable” or “Leader”.\
    \ We’ll learn more about leaders shortly. Nodes with nothing in the `MANAGER STATUS`\
    \ column are *workers*. Also note the asterisk (`*`) after the ID on the line\
    \ showing `mgr2`. This shows us which node we ran the `docker node ls` command\
    \ from. In this instance the command was issued from `mgr2`.\n\n> **Note:** It’s\
    \ a pain to specify the `--advertise-addr` and `--listen-addr` flags every time\
    \ you join a node to the swarm. However, it can be even more of a pain if you\
    \ get the network configuration of your swarm wrong. Manually adding nodes to\
    \ a swarm is unlikely to be a daily task so I think it’s worth the extra up-front\
    \ effort to use the flags. It’s your choice though. In lab environments or nodes\
    \ with only a single IP you do not need to use the flags.\n\nNow that we have\
    \ a *swarm* up and running, let’s take a look at manager high availability.\n\n\
    ## Swarm manager high availability (HA)\n\nSo far we’ve added three manager nodes\
    \ to a swarm. Why did we add three and how do they work together? We’ll answer\
    \ all of this, plus more in this section.\n\nSwarm *managers* have native support\
    \ for high availability (HA). This means that one or more can fail and the survivors\
    \ will keep the swarm running.\n\nTechnically speaking, swarm mode implements\
    \ a form of active-passive multi-manager HA. This means that although you might\
    \ - and should - have multiple *managers*, only one of them is ever considered\
    \ *active*. We call this active manager the *leader*. And the leader’s the only\
    \ one that will ever issue live commands against the *swarm* such as changing\
    \ the configuration of the swarm or issuing tasks to workers. If a non-active\
    \ manager receives commands for the swarm it’ll proxy them across to the leader.\n\
    \nThis process is shown in Figure 7.3 where step `1` is the command coming in\
    \ to a *manager* from a remote Docker client. Step 2 is the non-leader manager\
    \ proxying the command to the leader. Step 3 is the leader pushing that command\
    \ to the relevant node in the swarm.\n\n![Figure 7.3](images/figure7-3.png)\n\n\
    Figure 7.3\n\nSwarm uses an implementation of the [Raft consensus algorithm](https://raft.github.io/)\
    \ to power manager HA, and the following two best practices apply:\n\n1. Deploy\
    \ an odd number of managers.\n2. Don’t deploy too many managers\n\nHaving an odd\
    \ number of *managers* increases the chance of reaching quorum and avoiding a\
    \ split-brain. For example, if you had 4 managers and the network partitioned,\
    \ you could be left with two managers on each side of the partition. This is known\
    \ as a split brain - each side knows there used to be 4 but can now only see 2\\\
    . Neither side has a way of knowing if the two it can no longer see are still\
    \ alive and which side holds the majority share (quorum). However, if you had\
    \ 3 or 5 managers and the same network partition occurred, it would be impossible\
    \ to have the same number of managers on both sides of the split. This means that\
    \ one side would have a far better chance of knowing if it had more or less than\
    \ the other side and achieving quorum.\n\n![Figure 7.4](images/figure7-4.png)\n\
    \nFigure 7.4\n\nAs with all consensus algorithms - more participants means more\
    \ time required to achieve consensus. It’s like deciding where to eat - it’s always\
    \ quicker and easier for 3 people to decide than it is for 33! With this in mind,\
    \ it’s a best practice to have either 3 or 5 managers for HA. 7 might work, but\
    \ it’s generally accepted that 3 or 5 is optimal. You definitely don’t want more\
    \ than 7 as the time taken to achieve consensus will be longer.\n\nA final word\
    \ of caution regarding manager HA. While it’s obviously a good practice to spread\
    \ your managers across availability zones within your network, you need to make\
    \ sure that the networks connecting them are reliable! Network partitions can\
    \ be a royal pain in the backside! This means, at the time of writing, the nirvana\
    \ of hosting your active production applications and infrastructure across multiple\
    \ cloud providers such as AWS and Azure is a bit of a daydream. Take time to make\
    \ sure your managers are connected via high speed reliable networks!\n\nNow that\
    \ we’ve got our *swarm* built and understand the concepts of *leaders* and *manager\
    \ HA*, let’s move on to *services*.\n\n## Services\n\nLike we said in the *Swarm\
    \ primer*… services are a new construct introduced with Docker 1.12 that only\
    \ exist in *swarm mode*.\n\nThey let us *declare* the *desired state* for a group\
    \ of containers (tasks) and feed that to Docker. For example, assume you’ve got\
    \ an app that has a web front-end. You have an image for the web server, and testing\
    \ has shown that you will need 5 instances of the web service to handle normal\
    \ daily traffic. You would translate this requirement into a *service* declaring\
    \ the image the containers should use, and that that service should always have\
    \ 5 running tasks.\n\nWe’ll see some of the other things that can be declared\
    \ as part of a service in a minute, but before we do that, let’s see how to create\
    \ the one we just described.\n\nWe create a service with the `docker service create`\
    \ command.\n\n```\n$ docker service create --name web-fe \\\n   -p 8080:8080 \\\
    \n   --replicas 5 \\\n   nigelpoulton/web-fe\n```\n\nLet’s review that command\
    \ and output.\n\nWe used `docker service create` to tell Docker we are declaring\
    \ a new service, and we used the `--name` flag to name the service `web-fe`. We\
    \ used the `--replicas` flag to tell Docker there should always be 5 tasks/containers.\
    \ Finally we told Docker which image to use: `nigelpoulton/web-fe`.\n\nBut this\
    \ isn’t the end. All *services* are constantly monitored by the swarm - the *swarm*\
    \ runs a reconciliation loop that constantly compares the *actual state* of the\
    \ service to the *desired state*. If the two states match, the world is a happy\
    \ place and no further actions need taking. If they don’t match, the swarm takes\
    \ actions so that they. Put another way, the swarm is constantly making sure that\
    \ *actual state* matches *desired state*.\n\nAs an example, if one of the *workers*\
    \ hosting one of the 5 `web-fe` container tasks fails, the *actual state* for\
    \ the `web-fe` service will drop from 5 running tasks to 4\\. This will no longer\
    \ match the desired state* of 5, and Docker will start a new `web-fe` task to\
    \ bring *actual state* back in line with *desired state*. This behavior is very\
    \ powerful and allows the service to self-heal in the event of node failures.\n\
    \n## Viewing and inspecting services\n\nYou can use the `docker service ls` command\
    \ to see a list of all services running on a swarm.\n\n```\n$ docker service ls\n\
    ID            NAME    REPLICAS  IMAGE                         COMMAND\n2kffzpz721nr\
    \  web-fe  5/5       nigelpoulton/plur...cker-ci\n```\n\nThe output above shows\
    \ a single running service as well as some basic information about state. Among\
    \ other things, we can see the name of the service and that 5 out of the 5 desired\
    \ tasks/replicas are in the running state. If you run this command soon after\
    \ deploying the service it might not show all tasks/replicas as running. This\
    \ is probably because of the time it takes to pull the image on each node.\n\n\
    You can use the `docker service ps` command to see a list of tasks in a service\
    \ and their state.\n"
