    #### Images and layers\n\nAll Docker images are made up of one or more read-only\
    \ *layers* as shown below.\n\n![Figure 5.3](images/figure5-3.png)\n\nFigure 5.3\n\
    \nThere are a few ways to see and inspect the layers that make up an image, and\
    \ we’ve already seen one of them. Let’s take a second look at the output of the\
    \ `docker pull ubuntu:latest` command from earlier:\n\n```\n$ docker pull ubuntu:latest\n\
    latest: Pulling from library/ubuntu\n952132ac251a: Pull complete\n82659f8f1b76:\
    \ Pull complete\nc19118ca682d: Pull complete\n8296858250fe: Pull complete\n24e0251a0e2c:\
