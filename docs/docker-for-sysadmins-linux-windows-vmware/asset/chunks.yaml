- fmt: '

    In this chapter we’ll give some background and scratch the surface of topics like;
    why do we have containers, what do they do for us, and where can we use them.


    ### The bad old days


    Applications run businesses. If applications break, businesses suffer and sometimes
    die. These statements get truer every day!


    For the most part, applications run on servers. And in the past we could only
    run a single application per server. The open-systems world of Windows and Linux
    just didn’t have the technologies to safely and securely run multiple applications
    on the same server.


    So the story usually went something like this… Every time the business needed
    a new application, IT would go out and buy a new server. And most of the time
    nobody knew the performance requirements of the new application! This meant IT
    had to make guesses when choosing the model and size of servers to buy.


    As a result, IT did the only reasonable thing - it bought big fast servers with
    lots of resiliency. After all, the last thing anyone wanted - including the business
    - was under-powered servers. Under-powered servers might be unable to execute
    transactions, which might result in lost customers and lost revenue. So IT usually
    bought bigger servers than were actually needed. This resulted in huge numbers
    of servers operating as low as 5-10% of their potential capacity. A tragic waste
    of company capital and resources!


    ### Hello VMware!


    Amid all of this, VMware, Inc. gave the world the virtual machine (VM). And almost
    overnight the world changed into a much better place! Finally we had a technology
    that would let us run multiple business applications on a single server safely
    and securely.


    This was a game changer! IT no longer needed to procure a brand new oversized
    server every time the business asked for a new application. More often than not
    they could run new apps on existing servers that were sitting around with spare
    capacity.


    All of a sudden we could squeeze massive amounts of value out of existing corporate
    assets, such as servers, resulting in a lot more more bang for the company’s buck.


    ### VMwarts


    But… and there’s always a but! As great as VMs are, they’re not perfect!


    The fact that every VM requires its own dedicated OS is a major flaw. Every OS
    consumes CPU, RAM and storage that could otherwise be used to power more applications.
    Every OS needs patching and monitoring. And in some cases every OS requires a
    license. All of this is a waste of op-ex and cap-ex.


    The VM model has other challenges too. VMs are slow to boot and portability isn’t
    great - migrating and moving VM workloads between hypervisors and cloud platforms
    is harder than it could be.


    ### Hello Containers!


    For a long time, the big web-scale players like Google have been using container
    technologies to address these shortcomings of the VM model.


    In the container model the container is roughly analogous to the VM. The major
    difference through, is that every container does not require a full-blown OS.
    In fact all containers on a single system share a single OS. This frees up huge
    amounts of system resources such as CPU, RAM, and storage. It also reduces potential
    licensing costs and reduces the overhead of OS patching and other maintenance.
    This results in savings on the cap-ex and op-ex fronts.


    Containers are also fast to start and ultra portable. Moving container workloads
    from your laptop, to the cloud, and then to VMs or bare metal in your data center
    is a breeze.


    ### Linux containers


    Modern containers started in the Linux world and are the product of an immense
    amount of work from a wide variety of people over a long period of time. Just
    as one example, Google Inc. has contributed many container-related technologies
    to the Linux kernel. Without these, and other contributions, we wouldn’t have
    modern containers today.


    Some of the major technologies that enabled the massive growth of containers in
    recent years include `kernel namespaces`, `control groups`, and of course `Docker`.
    To re-emphasize what was said earlier - the modern container ecosystem is deeply
    indebted to the many individuals and organizations that laid the strong foundations
    that we now build on!


    Despite all of this, containers remained outside of the reach of most organizations.
    It wasn’t until Docker came along that containers were effectively democratized
    and accessible to the masses.


    > There are many operating system virtualization technologies similar to containers
    that pre-date Docker and modern containers. Some even date back to `System/360
    on the Mainframe. BSD Jails and Solaris Zones are some other well known examples
    of Unix-type container technologies. However, in this section we are restricting
    our conversation and comments to modern containers that have been made popular
    by Docker.


    ### Hello Docker!


    We’ll talk about Docker in a bit more detail in the next chapter. But for now
    it’s enough to say that Docker was the magic that made Linux containers usable
    for mere mortals. Put another way, Docker, Inc. gave the world a set of technologies
    and tools that made creating and working with containers simple!


    ### Windows containers


    Although containers came to the masses via Linux, Microsoft Corp. has worked extremely
    hard to bring Docker and container technologies to the Windows platform.


    At the time of writing, Windows containers are available on the Windows Server
    2016 platform. In achieving this, Microsoft has worked closely with `Docker, Inc.`


    The core Windows technologies required to implement containers are collectively
    referred to as `Windows Containers`. The user-space tooling to work with Windows
    Containers is Docker. This makes the Docker experience on Windows almost exactly
    the same as Docker on Linux. This way developers and sysadmins familiar with the
    Docker toolset form the Linux platform will feel right at home using Windows containers.


    ### Windows containers vs Linux containers


    It’s vital to understand from the start that Windows containers will only run
    on Windows servers, and Linux containers will only run on Linux servers.


    This is because all containers running on a system access the kernel of the OS
    running on that system. Therefore, containers running natively on a Windows system
    have to access the Windows kernel. Linux containers (which run Linux applications
    inside of them) obviously cannot use the Windows kernel, and vice versa.


    ### Chapter Summary


    We used to live in a world where every time the business wanted a new application
    we had to but a new server for it. Then VMware came along and enabled IT departments
    to drive more value out of new and existing company assets. But as good as VMware
    and the VM model is, it’s not perfect. Following the success of VMware and hypervisors
    came a newer more efficient and lightweight virtualization technology called containers.
    But containers were initially hard to implement and were only found in the data
    centers of web giants that had Linux kernel engineers on staff. Then along came
    Docker Inc. and suddenly container virtualization technologies were available
    to the masses.


    Speaking of Docker… let’s go find who, what, and why Docker is!


    ## 2: Docker


    No book or conversation about containers is complete without talking about Docker.
    But when somebody says “Docker” they can be referring to any of at least three
    things:


    1. `Docker, Inc.` the company


    2. `Docker` the container runtime and orchestration technology


    3. `Docker` the open source project


    If you’re going to make it in the container world, you’ll need to know a bit about
    all three.


    ### Docker - The TLDR

