    iterations to get reader feedback, pivot until you have the right book and build
    traction once you do.


    * * * * * * *


    © 2016 Nigel Poulton


    Huge thanks to my wife and kids for putting up with a geek in the house who genuinely
    thinks he’s a bunch of software running inside of a container on top of midrange
    biological hardware. It can’t be easy living with me!


    Massive thanks as well to everyone who watches my Pluralsight videos. I love connecting
    with you and really appreciate all the feedback I’ve gotten over the years. This
    was one of the major reasons I decided to write this book! I hope it’ll be an
    amazing tool to help you drive your careers even further forward.


    ## Table of Contents


    ## Guide


    1. [Begin Reading](#chap00.xhtml)


    ## 0: About the book


    This is a book about Docker, **hand-crafted for system administrators**. No prior
    knowledge required!


    But what about developers and DevOps?


    If you’re a developer with no interest in operations then this book is not for
    you. If you’re into DevOps then I think you’ll get a lot form the book.


    To keep things short… the book is **not** about showing you how to develop microservice
    apps with Docker. The book **is** about how the core Docker plumbing works. You’ll
    learn the *how* and the *why* - the *commands* and the *deep-dives*. I really
    want to set you on your way to being as good at Docker as you already are at Linux,
    Windows or VMware.


    ### Why should I read this book or care about Docker?


    Docker is coming and there’s no hiding from it. Developers are all over it. In
    IT Ops, we need to get ready to support *Dockerized* apps in our business critical
    production environments.


    ### Isn’t Docker just for developers?


    Hell no!!!


    All of those *Dockerized* apps that developers are creating need a solid Docker
    infrastructure to run on. And that’s where IT Ops comes into the picture… IT Ops
    will be asked to build and run high performance and highly available Docker infrastructures
    to support business applications. If we’re not skilled-up on Docker, we’re going
    to struggle.


    ### Why this Docker book and not another one?


    At the time I decided to write the first edition of this book, *so many* of the
    Docker books already out there were terrible! They were a shocking mix of *badly
    written*, full of *technical inaccuracies*, or massively *out of date*. And sometimes
    they were all three! It’s honestly not my intention to offend people, but go and
    read some of the reviews on Amazon. ***Some*** of the Docker books out there are
    a shameful waste of trees and paper!


    So I decided to write something that was *well written*, *technically accurate*,
    and *kept up to date*. I want you to love this book.


    If you buy the book and think it’s bad, call me out on [Twitter](https://twitter.com/nigelpoulton),
    give the book bad reviews, do whatever you feel necessary. And I’ll try and fix
    it. But I’m confident you won’t need to do any of that.


    ### Should I buy the book if I’ve already watched your video courses?


    If you like my [video courses](https://app.pluralsight.com/library/search?q=nigel+poulton)
    you’ll probably like the book. If you don’t like my video courses you probably
    won’t like the book.


    ### How the book is organized


    I’ve divided the book into two sections:


    * The general info stuff

    * The technical stuff


    *The general info stuff* covers things like - Who is Docker, Inc. What is the
    Docker project. What is the OCI. Why do we even have containers… Not the coolest
    part of the book, but the kind of stuff that’s important if you want a good rounded
    knowledge of Docker and containers. It’s only a short section and you probably
    *should* read it.


    *The technical stuff* is what the book is all about! This is where you’ll find
    everything you need to start working with Docker. It gets into the detail of *images*,
    *containers* and the increasingly important topic of *orchestration*. You’ll get
    the theory so that you know how it all fits together, and you’ll get commands
    and examples to show you how it all works in practice.


    Every chapter in the *technical stuff* section is divided into three parts:


    * The TLDR

    * The deep dive

    * The commands


    *The TLDR* will give you two or three paragraphs that you could use to explain.


    > **TLDR**, is a modern acronym meaning “too long; didn’t read”. It’s normally
    used to indicate something that was too long to read. *The deep dive* is where
    we’ll explain how everything works.


    *The Commands* lists out all of what you’ve learned.


    ### Other stuff about the book


    Here are just a few other things I want you to know.


    #### Text wrapping


    In doing this I’ve had to trim some of the output from some commands, but I don’t
    think you’re missing anything important. However, despite all of this, if you’re
    reading on a small enough device, you’re still going to get some wrapping :-(


    > For best results you might want to flip your reading device onto its side.


    ```

    $ docker service uber-service

    ID          NAME                 IMAGE                    NODE    REPLICA    DESIRED
    STATE   CURRENT STATE   ERROR

    7zi85ypj7t6k             uber-service.1       docker-docker-node:18.09-3-alpine
    node.1    1/1         Running (1s)     0

    a1dh...mzn817f             uber-service.2       docker-docker-node:18.09-3-alpine
    node.22    1/1         Running (1s)     0

    cc0j...ar099v5             uber-service.3       docker-docker-node:18.09-3-alpine
    node.32    1/1         Running (1s)     0

    ```


    … you *should* get this.


    ```

    $ docker service web-fe

    ID          NAME      IMAGE             NODE    REPLICA    DESIRED STATE   CURRENT
    STATE   ERROR

    817f...f6z             web-fe.1       docker-docker-node:18.09-3-alpine node.1    1/1         Running
    (1s)     0

    a1dh...mzn817f             web-fe.2       docker-docker-node:18.09-3-alpine node.22    1/1         Running
    (1s)     0

    cc0j...ar099v5             web-fe.3       docker-docker-node:18.09-3-alpine node.32    1/1         Running
    (1s)     0

    ```


    #### But you didn’t include something I really hoped you would…


    I know the book doesn’t cover *everything* about Docker. But it’s not supposed
    to! I’ve written the book to get you up to speed as quickly as possible while
    still spending the time to learn how it all fits together. If the book was 1,000
    printed pages it **would not** help you get up speed quickly!


    However, I will add sections to the book if I think they’re important and fundamental
    enough. Please use the book’s feedback pages and hit me up on [Twitter](https://twitter.com/nigelpoulton)
    with ideas of what you think should be included in the next version of the book.


    Right, that’s enough waffling. Let’s crack on!


    # Part 1: The general info stuff


    ## 1: Containers from 30,000 feet


    Containers are a new *thing* for a lot of people.

