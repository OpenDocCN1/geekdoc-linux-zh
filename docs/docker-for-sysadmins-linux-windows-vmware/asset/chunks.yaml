    在本章中，我们将提供一些背景知识，并浅浅介绍一些话题：为什么我们需要容器？它们为我们做了什么？以及我们可以在哪里使用它们。


    ### 糟糕的过去


    应用程序运行着业务。如果应用程序崩溃，业务就会遭受损失，有时甚至会死亡。这些说法每天都变得更加真实！


    在大多数情况下，应用程序运行在服务器上。在过去，我们每台服务器只能运行一个应用程序。Windows 和 Linux 的开放系统世界并没有能够在同一台服务器上安全、可靠地运行多个应用程序的技术。


    因此故事通常是这样的……每当业务需要新应用程序时，IT 部门就会去购买一台新服务器。大多数时候，没有人知道新应用程序的性能需求！这意味着 IT 部门在选择购买的服务器型号和尺寸时必须进行猜测。


    结果，IT 部门做了唯一合理的事情——购买大容量、高速且具有高可用性的服务器。毕竟，任何人（包括业务部门）最不希望看到的就是性能不足的服务器。性能不足的服务器可能无法执行交易，从而导致客户流失和收入损失。因此，IT
    部门购买的服务器通常比实际需要的更大。这导致大量服务器的运行效率仅为其潜力的 5-10%。这是对公司资本和资源的悲剧浪费！


    ### 你好，VMware！


    在这一切之中，VMware, Inc. 为世界带来了虚拟机（VM）。几乎在夜之间，世界变成了一个更好的地方！我们终于有了一项技术，让我们可以在单台服务器上安全、可靠地运行多个业务应用程序。


    这改变了游戏规则！IT 部门不再需要每当业务请求新应用程序时就采购一台全新的超大服务器了。大多数情况下，他们可以在带有空闲容量的现有服务器上运行新应用。


    突然之间，我们能够从现有的企业资产（如服务器）中榨出巨大的价值，从而为公司的投入换来更大的回报。


    ### VM 的缺陷 (VMwarts)


    但是……总有一个“但是”！尽管虚拟机很棒，但它们并不完美！


    每个虚拟机都需要一个专用的操作系统（OS），这是一个巨大的缺陷。每个操作系统都会消耗 CPU、内存和存储空间，而这些资源本可以用于运行更多的应用程序。每个操作系统都需要补丁和监控。在某些情况下，每个操作系统还需要许可。这一切都是对运营支出（op-ex）和资本支出（cap-ex）的浪费。


    虚拟机模型还有其他挑战。虚拟机启动速度慢，且移植性不好——在虚拟机管理程序和云平台之间迁移和移动虚拟机负载比想象的要困难。


    ### 你好，容器！


    长期以来，像 Google 这样的大型 Web 巨头一直使用容器技术来解决虚拟机模型的这些缺点。


    在容器模型中，容器大致相当于虚拟机。主要的区别在于，每个容器都不需要完整的操作系统。事实上，单个系统上的所有容器都共享同一个操作系统。这释放了大量的系统资源，如
    CPU、内存和存储。它还减少了潜在的许可成本，并降低了操作系统补丁和其他维护的开销。这在资本支出和运营支出方面都实现了节省。


    容器启动速度快且具有极高的移植性。将容器负载从笔记本电脑移动到云端，然后移动到数据中心的虚拟机或裸机是非常轻而易举的。


    ### Linux 容器


    容器容器于 Linux 世界，是很多人长期一段时间内大量工作的产物。举个例子，Google Inc. 为 Linux 内核贡献了许多容器相关的技术。没有这些以及其他贡献，我们今天就不会有现代容器。


    近年来实现容器爆炸式增长的一些主要技术包括`kernel namespaces`（内核命名空间）、`control groups`（控制组）以及当然还有 `Docker`。再次强调之前说过的话——现代容器生态系统深感激那些为我们现在构建的基础奠定坚实的个人和组织！


    尽管如此，容器仍然是大多数组织无法接触的。直到 Docker 的出现，容器才真正实现了民主化并让大众可以使用。


    > 存在许多与容器类似的操作系统虚拟化技术，它们早于 Docker 和现代容器。有些甚至可以追溯到大型机机上的 `System/360`。BSD Jails
    和 Solaris Zones 是其他一些著名的 Unix 类型容器技术示例。然而，在本节中，我们将讨论和评论限制在由 Docker 普及的现代容器。


    ### 你好，Docker！


    我们将在下一章更详细地讨论 Docker。但现在足够说明，Docker 是让 Linux 容器对凡人来说变得可用的魔术。换句话说，Docker, Inc.
    为世界提供了一套技术和工具，让创建和使用容器变得简单！


    ### Windows 容器


    虽然容器通过 Linux 进入大众，但微软公司（Microsoft Corp.）付出了巨大努力将 Docker 和容器技术引入 Windows 平台。


    在编写时，Windows 容器已在 Windows Server 2016 平台上可用。为了实现这一点，微软与 `Docker, Inc.` 紧密合作。


    实现容器所需的 Windows Windows 技术统称为 `Windows Containers`。用于处理 Windows 容器的用户空间工具是 Docker。这使得
    Windows 上 Docker 体验与 Linux 上的 Docker 几乎一样。这样，熟悉 Linux 平台 Docker 工具集的开发者和系统管理员在使用
    Windows 容器时会感到如归家。


    ### Windows 容器对比 Linux 容器


    从一开始理解至关重要：Windows 容器只会运行在 Windows 服务器上，而 Linux 容器只会运行在 Linux 服务器上。


    这是因为运行在系统上的所有容器都会访问运行该系统的操作系统内核。因此，原生运行在 Windows 系统上的容器必须访问 Windows 内核。Linux 容器（在其内部运行
    Linux 应用程序）显然无法使用 Windows 内核，反亦然。


    ### 本章总结


    我们曾生活在一个世界，每当业务想要新应用程序时，我们必须为它买一台新服务器。然后 VMware 出现了，让 IT 部门能够从公司的新旧现有资产中挖掘更多价值。但尽管
    VMware 和虚拟机模型很好，但它们并不完美。在 VMware 和虚拟机管理程序成功之后，出现了一种更先进、更高效、轻量级的虚拟化技术，称为容器。但容器最初很难实现，只出现在拥有
    Linux 内核工程师的互联网巨头的数据中心中。然后 Docker Inc. 出现了，容器虚拟化技术突然变得大众可用。


    说到 Docker……让我们去找 Docker 是谁、是什么以及为什么！


    ## 2: Docker


    任何关于容器的书籍或对话如果没有提到 Docker 都是完整的。但当有人说“Docker”时，他们可能指的是至少三者中的一种：


    1. `Docker, Inc.` 公司


    2. `Docker` 容器运行时和编排技术


    3. `Docker` 开源项目


    如果你想在容器世界大展身脚，你需要了解一下这三者。


    ### Docker - 简要版 (TLDR)

