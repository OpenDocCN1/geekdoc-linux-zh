    u0026 node ./app.js\"`.\n\nIt’s common to build images with default commands like\
    \ this as it makes starting containers easier, forces a default behavior, and\
    \ is a form of self documentation for the image.\n\nThat’s us done for the examples\
    \ in this chapter. Let’s see a quick way to tidy our system up.\n\n#### Tidying\
    \ up\n\nHere we’re going to show you the simplest and quickest way to get rid\
    \ if every running container on your Docker host. Be warned though, the procedure\
    \ will forcible destroy all containers without giving them a chance to clean up.\
    \ **This should never be performed on production systems or systems running important\
    \ containers.**\n\nRun the following command from the shell of your Docker host\
    \ to delete all containers.\n\n```\n$ docker rm $(docker ps -aq) -f\n6efa1838cd51\n\
    ```"
