- fmt: "\nWhen talking about `tasks` in the context of a `swarm`, we mean containers.\
    \ So when we say “managers dispatch `tasks` to workers”, we’re saying they dispatch\
    \ container workloads. You might also hear them referred to as `replicas`. This\
    \ might be confusing at this point, so try and remember that `tasks` and `replicas`\
    \ are words that mean `containers`.\n\nThe next thing we need to know about is\
    \ `services`. `Services` are the main construct we run on a `swarm`. And all a\
    \ service is, is a declarative way of setting a `desired state` for a set of tasks\
    \ (containers). But it’s hugely powerful. The ability to set a `desired state`\
    \ for things like the following is game changing:\n\n*   Set the number of tasks\
    \ that make up a service\n*   Set the image the containers in the service will\
    \ use\n*   Set the procedure for updating to newer versions of the image\n\nThe\
    \ configuration and state of the `swarm` is held in a distributed `etcd` database\
    \ located on all managers in the swarm. It’s kept extremely up-to-date and is\
    \ hosted in-memory on all `manager nodes` to make it fast. But the best thing\
    \ about it is the fact that it requires zero configuration - it just takes care\
    \ of itself.\n\nSomething else that’s game changing about `swarm mode` is its\
    \ approach to security. TLS is so tightly integrated that it’s not possible to\
    \ build a swarm without it. In today’s security conscious world, things like this\
    \ deserve all the props they get! Anyway, `swarm mode` uses TLS to encrypt communications,\
    \ authenticate nodes, and authorize roles. Automatic key rotation is also thrown\
    \ in as the icing on the cake! And it all happens so smoothly that you wouldn’t\
    \ even know it was there!\n\nThat’s enough of a primer. Let’s get our hands dirty\
    \ with some examples.\n\n## Lab setup\n\nFor the remainder of this chapter we’ll\
    \ build the lab shown in Figure 7.2 with 6-nodes configured as 3 managers and\
    \ 3 workers. Each node is running Linux with Docker 1.12 or higher. All nodes\
    \ in the lab can communicate over the network.\n\n![Figure 7.2](images/figure7-2.png)\n\
    \nFigure 7.2\n\nThe names and IP addresses are not important and can be different\
    \ in your lab. If you are following along with the examples, just remember to\
    \ substitute them with your own.\n\n## Enabling swarm mode\n\nRunning `docker\
    \ swarm init` on a Docker host operating in `single-engine mode` will switch that\
    \ node into `swarm mode` and create a new `swarm`. It will also make the node\
    \ a `manager`.\n\nAdditional nodes can then be joined to the swarm as workers\
    \ and managers using the `docker swarm join` command. This also puts those nodes\
    \ into `swarm mode` as part of the operation.\n\nThe following steps will put\
    \ `mgr1` into `swarm mode` and initialize a new swarm. It will then join `wrk1`,\
    \ `wrk2`, and `wrk3` as worker nodes - automatically putting them into `swarm\
    \ mode`. Finally, it will add `mgr2` and `mgr3` as additional managers and switch\
    \ them into `swarm mode`. At the end of the procedure all 6 nodes will be part\
    \ of the same swarm and will all be operating in `swarm mode`.\n\n1.  Log on to\
    \ `mgr1` and initialize a new swarm.\n\n    ```\n    $ docker swarm init \\\n\
    \      --advertise-addr 10.0.0.1:2377 \\\n      --listen-addr 10.0.0.1:2377\n\n\
    \    Swarm initialized: current node (d21lyzn0v5qvgdyfzec79qzkx) is now a manager.\n\
    \    ```\n\n    The command can be broken down as follows:\n\n    *   `docker\
    \ swarm init` tells Docker to start a new cluster and make this node the first\
    \ manager. It also enables swarm mode on the node.\n    *   `--advertise-addr`\
    \ is the IP and port that other nodes should use to connect to this manager. The\
    \ flag is optional, but it gives you control over which IP gets used on nodes\
    \ with multiple IPs. It also gives you the chance to specify an IP address that\
    \ does not exist on the node, such as a load balancer IP address.\n    *   `--listen-addr`\
    \ lets you specify which IP and port you want to listen on for swarm traffic.\
    \ This will usually match the `--advertise-addr`, but is useful in situations\
    \ where you want to restrict swarm to a particular IP on a system with multiple\
    \ IPs. It’s also required in situations where the `--advertise-addr` refers to\
    \ a remote IP address like a load balancer.\n\n    I recommend you always use\
    \ both flags.\n\n    The default port that swarm mode operates on is `2377`. This\
    \ is entirely customizable, but Docker, Inc. are looking to register this with\
    \ IANA as the official Docker swarm port.\n\n2.  List the nodes in the swarm\n\
    \n    ```\n    $ docker node ls\n    ID            HOSTNAME   STATUS  AVAILABILITY\
    \  MANAGER STATUS\n    d21...qzkx *  mgr1       Ready   Active        Leader\n\
    \    ```\n\n    Notice that `mgr1` is currently the only node in the swarm and\
    \ is listed as the `Leader`. We’ll come back to this in a second.\n\n3.  From\
    \ `magr1` run the `docker swarm join-token` command to extract the commands and\
    \ tokens required to add new workers and managers to the swarm.\n\n    ```\n \
    \   $ docker swarm join-token worker\n    To add a manager to this swarm, run\
    \ the following command:\n       docker swarm join \\\n       --token SWMTKN-1-0uahebax...c87tu\n\
    \n    $ docker swarm join-token manager\n    To add a manager to this swarm, run\
    \ the following command:\n       docker swarm join \\\n       --token SWMTKN-1-0uahebax...c87tu\n\
    \    ```\n\n4.  Log on to `wrk1` and join it to the swarm using the `docker swarm\
    \ join` command with the token joining workers.\n\n    ```\n    $ docker swarm\
    \ join \\\n        --token SWMTKN-1-0uahebax...c87tu \\\n        10.0.0.1:2377\
    \ \\\n        --advertise-addr 10.0.0.4:2377 \\\n        --listen-addr 10.0.0.4:2377\n\
    \    ```\n\n    This node joined a swarm.\n\n    I’ve manually added the `--advertise-addr`,\
    \ and `--listen-addr` flags as I consider it best practice to be as specific as\
    \ possible when it comes to network.\n\n5.  Repeat the previous step on `wrk2`\
    \ and `wrk3` to join them as workers. Make sure you use `wrk2` and `wrk3`’s own\
    \ IP addresses for the `--advertise-addr` and `--listen-addr` flags.\n\n6.  Log\
    \ on to `mgr2` and join it to the swarm as a manager using the `docker swarm join`\
    \ command with the token joining managers.\n\n    ```\n    $ docker swarm join\
    \ \\\n        --token SWMTKN-1-0uahebax...c87tu \\\n        10.0.0.1:2377 \\\n\
    \        --advertise-addr 10.0.0.2:2377 \\\n        --listen-addr 10.0.0.2:2377\n\
    \    ```\n\n    This node joined a swarm as a manager.\n\n7.  Repeat the previous\
    \ step on `mgr3` remembering to use `mgr3`’s IP address for the `advertise-addr`\
    \ and `--listen-addr` flags.\n\n8.  List the nodes in the swarm by running `docker\
    \ node ls` from any of the manager nodes in the swarm.\n\n    ```\n    $ docker\
    \ node ls\n    ID               HOSTNAME     STATUS  AVAILABILITY  MANAGER STATUS\n\
    \    0g4rl...babl8 *  mgr2         Ready   Active        Reachable\n    2xlti...l0nyp\
    \    mgr3         Ready   Active        Reachable\n    8yv0b...wmr67    wrk1 \
    \        Ready   Active\n    9mzwf...e4m4n    wrk3         Ready   Active\n  \
    \  d21ly...9qzkx    mgr1         Ready   Active        Leader\n    e62gf...l5wt6\
    \    wrk2         Ready   Active\n    ```\n\nCongratulations! You’ve just created\
    \ a 6-node swarm with 3 managers and 3 workers. As part of the process you put\
    \ the Docker Engine on each node into `swarm mode`. As an added bonus, the `swarm`\
    \ is automatically secured with TLS.\n"
