    \ tcp\n TargetPort = 8080\n PublishedPort = 8080\n```\n\nThe example above uses\
    \ the `--pretty` flag to limit the output to the most interesting items printed\
    \ in an easy-to-read format. Leaving off the `--pretty` flag will give a more\
    \ verbose output.\n\nWe’ll come back to some of these outputs later.\n\nLet’s\
    \ go and see how to scale a service.\n\n## Scaling a service\n\nAnother powerful\
    \ feature of services is the ability to easily scale them up and down.\n\nLet’s\
    \ assume business is booming and we’re seeing double the amount of anticipated\
    \ traffic hitting the web front-end. Fortunately scaling the `web-fe` service\
    \ is as simple as running the `docker service scale` command.\n\n```\n$ docker\
    \ service scale web-fe=10\nweb-fe scaled to 10\n```\n\nThe above command will\
    \ scale the number of tasks/replicas from 5 to 10. In the background it’s updating\
    \ the service’s desired state from 5 to 10. Run another `docker service ls` command\
    \ to verify the operation was successful.\n\n```\n$ docker service ls\n2kffzpz721nr\
    \  web-fe  10/10     nigelpoulton/pluralsight-docker-ci\n```\n\nRunning a `docker\
    \ service ps` command will show that the tasks in the service are balanced across\
    \ all nodes in the swarm as evenly as possible.\n\n```\n$ docker service ps web-fe\n\
    ID         NAME      IMAGE             NODE  DESIRED  CURRENT\n817...f6z  web-fe.1\
    \  nigelpoulton/...  mgr2  Running  Running 5 mins\na1d...mzn  web-fe.2  nigelpoulton/...\
    \  wrk1  Running  Running 5 mins\ncc0...ar0  web-fe.3  nigelpoulton/...  wrk2\
    \  Running  Running 5 mins\n6f0...azu  web-fe.4  nigelpoulton/...  mgr3  Running\
    \  Running 5 mins\ndyl...p3e  web-fe.5  nigelpoulton/...  mgr1  Running  Running\
    \ 5 mins\n912...vtb  web-fe.6  nigelpoulton/...  mgr1  Running  Running 1 min\n\
    3wu...o7y  web-fe.7  nigelpoulton/...  wrk3  Running  Running 1 min\naso...6hh\
    \  web-fe.8  nigelpoulton/...  wrk3  Running  Running 1 min\n97u...4bn  web-fe.9\
    \  nigelpoulton/...  wrk1  Running  Running 1 min\na1u...4jj  web-fe.10 nigelpoulton/...\
    \  mgr2  Running  Running 1 min\n```\n\nBehind the scenes, swarm-mode runs a scheduling\
    \ algorithm that defaults to trying to balance tasks as evenly as possible across\
    \ the nodes in the swarm. At the time of writing, this amounts to running an equal\
    \ number of tasks on each node without taking into consideration things like CPU\
    \ load etc.\n\nRun another `docker service scale` command to bring the number\
    \ back down from 10 to 5.\n\n```\n$ docker service scale web-fe=5\nweb-fe scaled\
    \ to 5\n```\n\nNow that we know how to scale a service, let’s see how we remove\
    \ one.\n\n## Removing a service\n\nRemoving a service is simple - may be too simple.\n\
    \nThe following `docker service rm` command will delete the service we deployed\
    \ earlier.\n\n```\n$ docker service rm web-fe\nweb-fe\n```\n\nConfirm the service\
    \ is gone with the `docker service ls` command.\n\n```\n$ docker service ls\n\
    ID  NAME  REPLICAS  IMAGE  COMMAND\n```\n\nBe careful using the `docker service\
    \ rm` command as it deletes all tasks in a service without asking for confirmation.\n\
    \nNow that the service is deleted from the system, let’s go and look at how to\
    \ push rolling updates to a service.\n\n## Rolling updates\n\nPushing updates\
    \ to deployed applications is a fact of life. And for the longest time it’s been\
    \ really painful. I’ve lost more than enough weekends to major application updates,\
    \ and I’ve no intention of going there again if I can help it.\n\nWell… thanks\
    \ to Docker services, pushing updates to deployed apps just got a lot easier!\n\
    \nTo see this, we’re going to deploy a new service. But before we do we’re going\
    \ to create an overlay network.\n\n```\n$ docker network create -d overlay uber-net\n\
    43wfp6pzea470et4d57ud9\n```\n\nThe `uber-net` network was successfully created\
    \ with the `swarm` scope and is currently only visible on manager nodes in the\
    \ swarm.\n\nAn overlay-network essentially creates a new layer 2 network on top\
    \ of multiple underlying networks. Figure 7.5 shows two underlay networks connected\
    \ by a layer 3 router. There is then a single overlay network across both of them.\
    \ Docker hosts are connected to the two underlay networks. (Wait, let me re-read\
