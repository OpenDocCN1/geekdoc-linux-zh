    \  web-fe.5  nigelpoulton/...  mgr1  Running  Running 2 mins\n```\n\nThe format\
    \ of the command is `docker service ps <service-name or service-id>`. The output\
    \ displays each task on its own line, shows which node in the swarm it’s executing\
    \ on, and shows desired state and actual state.\n\nFor detailed information about\
    \ a service, use the `docker service inspect` command.\n\n```\n$ docker service\
