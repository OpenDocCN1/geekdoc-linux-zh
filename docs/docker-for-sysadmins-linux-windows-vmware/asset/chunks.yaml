    \   4 months ago   211.6 MB\n```\n\n注意以 `Already exists` 结尾的行。这是因为 Docker 足够智能，能够识别出当它被要求拉取本地已有的副本的镜像层时。在这个示例中，Docker\
    \ 首先拉取了标记为 `latest` 的镜像。当它去拉取 `v1` 和 `v2` 镜像时，它发现自己已经拥有构成这些镜像的某些层。这是因为该仓库中的三个镜像除了顶层外，几乎是完全相同的。\n\
    \nLinux 上的 Docker 支持许多不同的文件系统和存储驱动。每种驱动都以自己的方式实现镜像分层、写复制（copy-on-write）行为和镜像层共享。然而，整体结果和用户体验本质上是相同的。\n\
    \n### 通过摘要拉取镜像\n\n到为止，我们向你展示了如何通过标签（tag）拉取镜像，这是目前最常见的方法。但它有一个问题——标签是可变的！这意味着可能会无意中给镜像标记上错误的标签。有时甚至可能给镜像标记上与现有镜像相同的标签。这可不妙！\n\
    \n例如，假设你有一个名为 `golftrack:1.5` 的镜像，它包含一个已知漏洞。你拉取了镜像，应用修复，并使用**相同的标签**将更新后的镜像推回你的仓库。花几秒钟理解一下刚才发生了什么。你有一个名为\
    \ `golftrack:1.5` 的带有漏洞的镜像，该镜像正在你的生产环境中运行。你拉取了镜像并应用了修复。但错误发生了，你将修复后的镜像以**与漏洞镜像相同的标签**推回了仓库。你该如何知道哪些生产系统运行的是带漏洞的镜像，哪些运行的是修补后的镜像？它们拥有相同的标签！\n\
    \n这就是镜像摘要（digest）大显身场的地方。\n\nDocker 1.10 引入了新的内容寻址存储模型。作为这种新模型的一部分，所有镜像现在都有了加密哈希值。为了讨论起见，我们将这个哈希称为\
    \ `digest`。因为摘要是镜像内容的哈希，所以可以在不改变摘要的情况下更改镜像内容。另一种说法，摘要是不可变的。这显然避免了我们刚才讨论的问题。\n\n\
    每次拉取镜像时，`docker pull` 命令都会包含镜像的摘要。你也可以通过向 `docker images` 命令添加 `--digests` 标志来查看\
    \ Docker 主机本地缓存中的镜像摘要。如下例所示：\n\n```\n$ docker pull alpine\nUsing default tag:\
    \ latest\nlatest: Pulling from library/alpine\ne110a4a17941: Pull complete\nDigest:\
    \ sha256:3dcdb92d7432d56604d...6d99b889d0626de15f73a\nStatus: Downloaded newer\
    \ image for alpine:latest\n$\n docker images --digests alpine\nREPOSITORY  TAG\
    \     DIGEST              IMAGE ID      CREATED       SIZE\nalpine      latest\
    \  sha256:3dcd...f73a  4e38e38c8ce0  10 weeks ago  4.8 MB\n```\n\n上述输出显示 `alpine`\
    \ 镜像的摘要为 `sha256:3dcdb92d7432d56604d...6d99b889d0626de15f73a`。\n\n上述输出显示 `alpine`\
    \ 镜像的摘要为 `sha256:3dcdb92d7432d56604d...6d99b889d0626de15f73a`。\n\n现在我们已经了镜像的摘要，就可以使用它了。上述输出显示\
    \ `alpine` 镜像的摘要为 `sha256:3dcdb92d7432d56604d...6d99b889d0626de15f73a`。\n\n上述输出显示\
    \ `alpine` 镜像的摘要为 `sha256:3dcdb92d7432d56604d...6d99b889d0626de15f73a`。\n\n"
