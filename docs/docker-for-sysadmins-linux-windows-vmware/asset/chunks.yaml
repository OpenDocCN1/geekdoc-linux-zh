- fmt: "\nThe VM model then carves `low-level hardware resources` into VMs. Each VM\
    \ is a software construct containing virtual CPU, virtual RAM, virtual disk etc.\
    \ As such, every VM needs it’s own OS to claim, initialize and manage all of those\
    \ virtual resources. And sadly, every OS comes with it’s own set of baggage and\
    \ overheads. For example, every OS consumes a slice of CPU, a slice of RAM, a\
    \ slice of storage etc. Most need their own licenses as well as people and infrastructure\
    \ to patch and upgrade them. Each OS also presents a sizable attack surface. We\
    \ often refer to all of this as the `OS tax`, or `VM tax` - every OS you install\
    \ consumes resources!\n\nThe container model only has a single kernel down at\
    \ the host OS layer. It’s possible to run tens or hundreds of containers on a\
    \ single host with every container sharing that single OS kernel. That means a\
    \ single OS that consumes CPU, RAM, and storage. A single OS that needs licensing.\
    \ A single OS that needs upgrading and patching. And a single OS kernel presenting\
    \ an attack surface. All in all, a single OS tax bill!\n\nThat might not seem\
    \ a lot in our example of a single server needing to run 4 business applications.\
    \ But when we’re talking about hundreds or thousands of apps (VM or containers)\
    \ this can be game changing.\n\nAnother thing to consider is that because a container\
    \ isn’t a full-blown OS, it starts `much faster` than a VM. Remember, there’s\
    \ no kernel inside of a container that needs locating, decompressing, and initializing\
    \ - not to mention all of the hardware enumerating and initializing associated\
    \ with a normal kernel bootstrap. None of that is needed when starting a container!\
    \ The single shared kernel down at the OS level is already started! Net result,\
    \ containers can start in less than a second. The only thing that has an impact\
    \ on container start time is the time it takes to start the application it’s running.\n\
    \nThis all amounts to the container model being leaner and more efficient than\
    \ the VM model. We can pack more applications onto less resources, start them\
    \ faster, and pay less in licensing and admin costs, as well as present less of\
    \ an attack surface to the dark side. All of which is better for the business!\n\
    \nWith that theory out of the way, let’s have a play around with some containers.\n\
    \n### Running containers\n\nTo follow along with these examples you’ll need a\
    \ working Docker host. For most of the commands it won’t make a difference if\
    \ it’s Linux or Windows. However, when writing the book I used a Docker host running\
    \ Ubuntu 16.04 for all examples.\n\n### Checking the Docker daemon\n\nThe first\
    \ thing I always do when I log on to a Docker host is check that Docker is running.\n\
    \n```\n$ docker version\nClient:\n Version:      1.12.1\n API version:  1.24\n\
    \ Go version:   go1.6.3\n Git commit:   23cf638\n Built:        Thu Aug 18 05:33:38\
    \ 2016\n OS/Arch:      linux/amd64\n\nServer:\n Version:      1.12.1\n API version:\
    \  1.24\n Go version:   go1.6.3\n Git commit:   23cf638\n Built:        Thu Aug\
    \ 18 05:33:38 2016\n OS/Arch:      linux/amd64\n```\n\nAs long as you get a response\
    \ back in the `Client` and `Server` sections you should be good to go. If you\
    \ get an error code in the `Server` section there’s a good chance that the docker\
    \ daemon (server) isn’t running, or that your user account doesn’t have permission\
    \ to access it.\n\nIf your user account doesn’t have permission to access the\
    \ daemon, you need to make sure it’s a member of the local `docker` Unix group.\
    \ If it isn’t, you can add it with `usermod -aG docker <user>` and then you’ll\
    \ have to logout and log back in to your shell for the changes to take effect.\n\
    \nIf your user account is already a member of the local `docker` group then the\
    \ problem might be that the Docker daemon isn’t running. To check the status of\
    \ the Docker daemon run one of the following commands depending on your Docker\
    \ host’s operating system.\n\n```\n//Run this command on Linux systems not using\
    \ Systemd\n$ service docker status\ndocker start/running, process 29393\n\n//Run\
    \ this command on Linux systems that are using Systemd\n$ systemctl is-active\
    \ docker\nactive\n\n//Run this command on Windows Server 2016 systems from a PowerShell\
    \ window\n> Get-Service docker\n\nStatus    Name      DisplayName\n------    ----\
    \      -----------\nRunning   docker    Docker Engine\n```\n\nAssuming the Docker\
    \ daemon is running you’re fine to continue.\n\n### Starting a simple container\n\
    \nThe simplest way to start a container is with the `docker run` command.\n\n\
    The command below starts a simple container that will run a containerized version\
    \ of Ubuntu Linux.\n\n```\n$ docker run -it ubuntu:latest /bin/bash\nUnable to\
    \ find image 'ubuntu:latest' locally\nlatest: Pulling from library/ubuntu\n952132ac251a:\
    \ Pull complete\n82659f8f1b76: Pull complete\nc19118ca682d: Pull complete\n8296858250fe:\
    \ Pull complete\n24e0251a0e2c: Pull complete\nDigest: sha256:f4691c96e6bbaa99d9...e95a60f0\n\
    ```\n"
  raw: "The VM model then carves **low-level hardware resources** into VMs. Each VM\
    \ is a software construct containing virtual CPU, virtual RAM, virtual disk etc.\
    \ As such, every VM needs it’s own OS to claim, initialize and manage all of those\
    \ virtual resources. And sadly, every OS comes with it’s own set of baggage and\
    \ overheads. For example, every OS consumes a slice of CPU, a slice of RAM, a\
    \ slice of storage etc. Most need their own licenses as well as people and infrastructure\
    \ to patch and upgrade them. Each OS also presents a sizable attack surface. We\
    \ often refer to all of this as the ***OS tax***, or ***VM tax*** - every OS you\
    \ install consumes resources!\n\nThe container model only has a single kernel\
    \ down at the host OS layer. It’s possible to run tens or hundreds of containers\
    \ on a single host with every container sharing that single OS kernel. That means\
    \ a single OS that consumes CPU, RAM, and storage. A single OS that needs licensing.\
    \ A single OS that needs upgrading and patching. And a single OS kernel presenting\
    \ an attack surface. All in all, a single OS tax bill!\n\nThat might not seem\
    \ a lot in our example of a single server needing to run 4 business applications.\
    \ But when we’re talking about hundreds or thousands of apps (VM or containers)\
    \ this can be game changing.\n\nAnother thing to consider is that because a container\
    \ isn’t a full-blown OS, it starts **much faster** than a VM. Remember, there’s\
    \ no kernel inside of a container that needs locating, decompressing, and initializing\
    \ - not to mention all of the hardware enumerating and initializing associated\
    \ with a normal kernel bootstrap. None of that is needed when starting a container!\
    \ The single shared kernel down at the OS level is already started! Net result,\
    \ containers can start in less than a second. The only thing that has an impact\
    \ on container start time is the time it takes to start the application it’s running.\n\
    \nThis all amounts to the container model being leaner and more efficient than\
    \ the VM model. We can pack more applications onto less resources, start them\
    \ faster, and pay less in licensing and admin costs, as well as present less of\
    \ an attack surface to the dark side. All of which is better for the business!\n\
    \nWith that theory out of the way, let’s have a play around with some containers.\n\
    \n#### Running containers\n\nTo follow along with these examples you’ll need a\
    \ working Docker host. For most of the commands it won’t make a difference if\
    \ it’s Linux or Windows. However, when writing the book I used a Docker host running\
    \ Ubuntu 16.04 for all examples.\n\n#### Checking the Docker daemon\n\nThe first\
    \ thing I always do when I log on to a Docker host is check that Docker is running.\n\
    \n```\n$ docker version\nClient:\n Version:      1.12.1\n API version:  1.24\n\
    \ Go version:   go1.6.3\n Git commit:   23cf638\n Built:        Thu Aug 18 05:33:38\
    \ 2016\n OS/Arch:      linux/amd64\n\nServer:\n Version:      1.12.1\n API version:\
    \  1.24\n Go version:   go1.6.3\n Git commit:   23cf638\n Built:        Thu Aug\
    \ 18 05:33:38 2016\n OS/Arch:      linux/amd64\n```\n\nAs long as you get a response\
    \ back in the `Client` and `Server` sections you should be good to go. If you\
    \ get an error code in the `Server` section there’s a good chance that the docker\
    \ daemon (server) isn’t running, or that your user account doesn’t have permission\
    \ to access it.\n\nIf your user account doesn’t have permission to access the\
    \ daemon, you need to make sure it’s a member of the local `docker` Unix group.\
    \ If it isn’t, you can add it with `usermod -aG docker <user>` and then you’ll\
    \ have to logout and log back in to your shell for the changes to take effect.\n\
    \nIf your user account is already a member of the local `docker` group then the\
    \ problem might be that the Docker daemon isn’t running. To check the status of\
    \ the Docker daemon run one of the following commands depending on your Docker\
    \ host’s operating system.\n\n```\n//Run this command on Linux systems not using\
    \ Systemd\n$ service docker status\ndocker start/running, process 29393\n\n//Run\
    \ this command on Linux systems that are using Systemd\n$ systemctl is-active\
    \ docker\nactive\n\n//Run this command on Windows Server 2016 systems from a PowerShell\
    \ window\n> Get-Service docker\n\nStatus    Name      DisplayName\n------    ----\
    \      -----------\nRunning   docker    Docker Engine\n```\n\nAssuming the Docker\
    \ daemon is running you’re fine to continue.\n\n#### Starting a simple container\n\
    \nThe simplest way to start a container is with the `docker run` command.\n\n\
    The command below starts a simple container that will run a containerized version\
    \ of Ubuntu Linux.\n\n```\n$ docker run -it ubuntu:latest /bin/bash\nUnable to\
    \ find image 'ubuntu:latest' locally\nlatest: Pulling from library/ubuntu\n952132ac251a:\
    \ Pull complete\n82659f8f1b76: Pull complete\nc19118ca682d: Pull complete\n8296858250fe:\
    \ Pull complete\n24e0251a0e2c: Pull complete\nDigest: sha256:f4691c96e6bbaa99d9...e95a60369c506dd6e6f6ab\n\
    Status: Downloaded newer image for ubuntu:latest\nroot@3027eb644874:/#\n```\n\n\
    The format of the command is essentially `docker run -<options> <image>:<tag>\
    \ <command>`.\n\nLet’s break the command down a bit.\n\nWe started with `docker\
    \ run`, this is the standard command to start a new container. We then used the\
    \ `-it` flags to make the container interactive and attach it to our terminal.\
    \ Next we told it to use the `ubuntu:latest` image. Finally we told it to run\
    \ the Bash shell as its application.\n\nWhen we hit <Return> the Docker client\
    \ made the appropriate API calls to the Docker daemon. The Docker daemon accepted\
    \ the command and searched the Docker host’s local cache to see if it already\
    \ had a copy of the image. In this example it didn’t, so it went to Docker Hub\
    \ to see if it could find it there. I could, so it pulled it locally and stored\
    \ it in its cache.\n\n> **Note:** In a standard out-of-the-box installation, the\
    \ Docker daemon implements the Docker Remote API on a local IPC/Unix socket at\
    \ `/var/run/docker.sock`.\n\nOnce the image was pulled, the daemon created the\
    \ container and executed the Bash shell inside of it.\n\nIf you look closely you’ll\
    \ see that your shell prompt has changed and you’re now inside of the container.\
    \ In the example above the shell prompt has changed to `root@3027eb644874:/#`.\
    \ The long number after the `@` is the first 12 characters of the containers unique\
    \ ID.\n\nTry executing some basic Linux commands from inside of the container.\
    \ You might notice that some commands do not work. This is because the `ubuntu:latest`\
    \ image, like almost all container images, is highly optimized for containers.\
    \ This means it doesn’t have all of the normal commands and packages installed.\
    \ The example below shows a couple of commands - one succeeds and the other one\
    \ fails.\n\n```\nroot@3027eb644874:/# ls -l\ntotal 64\ndrwxr-xr-x   2 root root\
    \ 4096 Aug 19 00:50 bin\ndrwxr-xr-x   2 root root 4096 Apr 12 20:14 boot\ndrwxr-xr-x\
    \   5 root root  380 Sep 13 00:47 dev\ndrwxr-xr-x  45 root root 4096 Sep 13 00:47\
    \ etc\ndrwxr-xr-x   2 root root 4096 Apr 12 20:14 home\ndrwxr-xr-x   8 root root\
    \ 4096 Sep 13  2015 lib\ndrwxr-xr-x   2 root root 4096 Aug 19 00:50 lib64\ndrwxr-xr-x\
    \   2 root root 4096 Aug 19 00:50 media\ndrwxr-xr-x   2 root root 4096 Aug 19\
    \ 00:50 mnt\ndrwxr-xr-x   2 root root 4096 Aug 19 00:50 opt\ndr-xr-xr-x 129 root\
    \ root    0 Sep 13 00:47 proc\ndrwx------   2 root root 4096 Aug 19 00:50 root\n\
    drwxr-xr-x   6 root root 4096 Aug 26 18:50 run\ndrwxr-xr-x   2 root root 4096\
    \ Aug 26 18:50 sbin\ndrwxr-xr-x   2 root root 4096 Aug 19 00:50 srv\ndr-xr-xr-x\
    \  13 root root    0 Sep 13 00:47 sys\ndrwxrwxrwt   2 root root 4096 Aug 19 00:50\
    \ tmp\ndrwxr-xr-x  11 root root 4096 Aug 26 18:50 usr\ndrwxr-xr-x  13 root root\
    \ 4096 Aug 26 18:50 var\nroot@3027eb644874:/#\nroot@3027eb644874:/#\nroot@3027eb644874:/#\
    \ ping www.docker.com\nbash: ping: command not found\nroot@3027eb644874:/#\n```\n\
    \n#### Container processes"
