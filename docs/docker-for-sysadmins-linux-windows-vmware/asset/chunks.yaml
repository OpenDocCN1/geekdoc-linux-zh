  trans: "\n\n如果你想运行 `native Windows containers`，可以右键点击 Windows 通知栏中的 Docker 鲸鱼图标，并选择\
    \ `Switch to Windows containers...`（切换到 Windows 容器）。如果你尚未启用 `Windows Containers`\
    \ 功能，可能会收到以下提示。\n\n![Figure 3.2](img/figure3-2.png)\n\n图 3.2\n\n如果你已经启用了 Windows\
    \ Containers 功能，仅需几秒钟即可完成切换。一旦切换完成，`docker version` 命令的输出将如下所示。\n\n```\nC:\\Users\\\
    nigelpoulton> docker version\nClient:\n Version:      1.12.1\n API version:  1.24\n\
    \ Go version:   go1.6.3\n Git commit:   23cf638\n Built:        Thu Aug 18 17:32:24\
    \ 2016\n OS/Arch:      windows/amd64\n Experimental: true\n\nServer:\n Version:\
    \      1.13.0-dev\n API version:  1.25\n Go version:   go1.7.1\n Git commit: \
    \  c2decbe\n Built:        Tue Sep 13 15:12:54 2016\n OS/Arch:      windows/amd64\n\
    ```\n\n注意，Server 版本现在也显示为 `windows/amd64`。这意味着守护进程现在原生运行在 Windows 内核上，因此只会运行 Windows\
    \ 容器。\n\n另外注意，上述系统运行的是 Docker 的 `experimental` 版本（Experimental: true）。`Docker\
    \ for Windows` 有稳定版和实验版两个通道。你可以在两者之间切换，但在在此之前，你应该检查 Docker 网站上的限制和影响。\n\n如下所示，其他常规\
    \ Docker 命令可以正常工作。\n\n```\n C:\\Users\\nigelpoulton>docker info\n   Containers:\
    \ 0\n    Running: 0\n    Paused: 0\n    Stopped: 0\n   Images: 0\n   Images: 0\n\
    \   Server Version: 1.13.0-dev\n   Storage Driver: windowsfilter\n    Windows:\n\
    \   Logging Driver: json-file\n   Plugins:\n    Volume: local\n    Network: nat\
    \ null overlay\n   <Snip>\n   Registry: https://index.docker.io/v1/\n   Experimental:\
    \ true\n   Insecure Registries:\n    127.0.0.0/8\n```\n\nDocker for Windows 包含了\
    \ Docker Engine（客户端和守护进程）、Docker Compose 和 Docker Machine。使用以下命令验证每个组件是否成功安装以及你拥有的各个版本：\n\
    \n```\nC:\\Users\\nigelpoulton> docker --version\nDocker version 1.12.1, build\
    \ 23cf638, experimental\n```\n\n```\nC:\\Users\\nigelpoulton> docker-compose --version\n\
    docker-compose version 1.8.0, build d988a55\n```\n\n```\nC:\\Users\\nigelpoulton>\
    \ docker-machine --version\ndocker-machine version 0.8.1, build 41b3b25\n```\n\
    \n### Docker for Mac\n\n关于 `Docker for Mac` 需要注意的第一点是，它是 Docker, Inc. 的一个封装产品。所以放松吧，你不需要成为内核工程师，我们也不会带你通过复杂的破解手段来将\
    \ Docker 安装到你的 Mac 上。我们将引导你完成 Mac 桌面电脑或笔记本电脑上安装 `Docker for Mac` 的过程，这极其简单。\n\n\
    #### 什么是 `Docker for Mac`？\n\n`Docker for Mac` 是一个封装产品，允许你轻松在 Mac 本地启动并运行一个微小的单引擎\
    \ Docker 环境。如果你听过 `boot2docker`，那么 `Docker for Mac` 就是你一直希望 `boot2docker` 拥有的样子——它是平滑、简单且稳定的。但\
    \ `Docker for Mac` 仅用于测试和开发工作。你不应该将其视为运行业务的生产环境平台。不！`Docker for Mac` 的核心是以最简单的方式在你的\
    \ Mac 上启动并运行一个小型的 Docker 安装，以便你在 Mac 上测试和开发容器化应用程序。\n\n同样注意的是，`Docker for Mac`\
    \ 并不会让你原生运行在 Mac OS Darwin 内核上的 Docker Engine。在后台，它在一个轻量级 Linux 虚拟机中运行 Docker\
    \ Engine。然后它无缝地将该 Docker Engine 和 API 暴露给你的 Mac 环境。但它实现这一切的方式让整合所有环节的奥秘和魔法都隐藏在了幕后。你只需要知道，你可以在\
    \ Mac 上打开终端并使用常规 Docker 命令调用 Docker API。\n\n尽管这在你的 Mac 上无缝运行……但其底层显然是 Linux 版\
    \ Docker，因此它只能与基于 Linux 的 Docker 容器配合。不过这是好事，因为大多数容器操作都在这里发生。\n\n图 3.3 显示了 `Docker\
    \ for Mac` 架构的高层表示。\n\n![Figure 3.3](img/figure3-3.png)\n\n图 3.3\n\n> **注意：**\
    \ 对于好奇的读者，`Docker for Mac` 利用 [HyperKit](https://github.com/docker/hyperkit) 实现了一个超轻量级的虚拟化程序。HyperKit\
    \ 而基于 [xhive 虚拟化程序](https://github.com/mist64/xhyve)。`Docker for Mac` 还利用了 [DataKit](https://github.com/docker/datakit)\
    \ 的功能，并运行了一个基于 [Alpine Linux](https://alpinelinux.org/) 的经过高度优化的 Linux 发行版，称为\
    \ Moby。\n\n"
- fmt: "\nLet’s look at how to install Docker on Linux.\n\nThis is the most common\
    \ installation in production environments and is surprisingly easy. The most common\
    \ difficulty is the slight variations between Linux distros such as Ubuntu vs\
    \ CentOS. The example we’ll use in this section is based on Ubuntu Linux, but\
    \ should work on upstream and downstream forks. It should also work on CentOS\
    \ and it’s upstream and downstream forks. It makes absolutely no difference if\
    \ your Linux machine is a physical server in your own data center, on the other\
    \ side of the planet in a public cloud, or a VM on your laptop. The only requirements\
    \ are that the machine be running Linux and has access to https://get.docker.com.\n\
    \nThe first thing you need to decide before you install Docker on Linux is which\
    \ channel you wish to install. Docker currently has three channels:\n\n* Stable\
    \ (https://get.docker.com/)\n* Experimental (https://experimental.docker.com/)\n\
    * Test (https://test.docker.com/)\n\nIn the examples below we’ll use the `wget`\
    \ command to call the script that installs the stable channel. If you want to\
    \ install a different channel just replace `https://get.docker.com` with the relevant\
    \ channel from the list above.\n\n1. Open a new shell on your Linux machine.\n\
    2. Use `wget` to retrieve the Docker install script from `https://get.docker.com`\
    \ and pipe it through your shell.\n\n```\n$ wget -qO- https://get.docker.com/\
    \ | sh\n\nmodprobe: FATAL: Module aufs not found in directory /lib/modules/4.4.0-36-generic\n\
    + sh -c 'sleep 3; yum -y -q install docker-engine'\n<Snip>\n```\nIf you would\
    \ like to use Docker as a non-root user, you should now consider adding your user\
    \ to the \"docker\" group with something like:\n\n`sudo usermod -aG docker your-user`\n\
    \nRemember that you will have to log out and back in for this to take effect!\n\
    \n3. It’s a good best practice to only use non-root users when working with the\
    \ Docker Engine. To do this you need to add your non-root users to the local `docker`\
    \ Unix group on your Linux machine. The commands below show how to add the `npoulton`\
    \ user to the `docker` group and verify that the operation succeeded.\n\n```\n\
    $ sudo usermod -aG docker npoulton\n$\n$ cat /etc/group | grep docker\ndocker:x:999:npoulton\n\
    ```\n\nIf you are already logged in as the user that you just added to the `docker`\
    \ group, you will need to log out and log back in for the group membership to\
    \ take effect.\n\nCongratulations! Docker is now installed on your Linux machine.\
    \ Run the following commands to verify your installation.\n\n```\n$ docker --version\n\
    Docker version 1.12.1, build 23cf638\n$\n$ docker info\nContainers: 0\n Running:\
    \ 0\n Paused: 0\n Stopped: 0\nImages: 0\n<Snip>\nKernel Version: 4.4.0-36-generic\n\
    Operating System: Ubuntu 16.04.1 LTS\nOSType: linux\nArchitecture: x86_64\nCPUs:\
    \ 1\nTotal Memory: 990.7 MiB\nName: ip-172-31-41-77\nID: QHFV:6HK7:VNLZ:RIKE:JWL6:BTIX:GC3V:RAVR:6AO5:RAMT:EJCI:PUA7\n\
    Docker Root Dir: /var/lib/docker\nDebug Mode (client): false\nDebug Mode (server):\
    \ false\nRegistry: https://index.docker.io/v1/\nWARNING: No swap limit support\n\
    Insecure Registries:\n 127.0.0.0/8\n```\n\nIf the process described above doesn’t\
    \ work for your Linux distro, you can go to the Docker Docs website and click\
    \ on the link relating to your distro. This will take you to the official Docker\
    \ installation instructions which are usually kept up to date. Be warned though,\
    \ the instructions on the Docker website tend use the package manager and require\
    \ a lot more steps than the procedure we used above. In fact, if you open a web\
    \ browser to https://get.docker.com you will see that it’s a shell script that\
    \ does all of the hard work of installation for you.\n\nWarning: If you install\
    \ Docker from a source other than the official Docker repositories, you may end\
    \ up with a forked version of Docker. This is because some vendors and distros\
    \ choose to fork the Docker project and develop their own slightly customized\
    \ versions. You need to be aware of things like this if you are installing from\
    \ custom repositories as you could unwittingly end up in a situation where you\
    \ are running a fork that has diverged from the official Docker project. This\
    \ isn’t a problem as long as this is what you intend to do. If it is not what\
    \ you intend, it can lead to situations where modifications and fixes your vendor\
    \ makes do not make it back upstream in to the official Docker project. In these\
    \ situations you will not be able to get commercial support for your installation\
    \ from Docker, Inc. or it’s authorized service partners.\n\n### Chapter Summary\n\
    \nIn this chapter you saw how to install docker on Windows 10, Mac OS X, and Linux.\
    \ Now that you know how to install Docker you are ready to start working with\
    \ images and containers.\n\n## 4 The big picture\n\nIn the next few chapters we’re\
    \ going to get into the details of things like images, containers, and orchestration.\
    \ But before we do that, I think it’s a good idea to show you the big picture\
    \ first.\n\nIn this chapter we’ll download an image, start a new container, log\
    \ in to the new container, run a command inside of it, and then destroy it. This\
    \ will give you a good idea of what Docker is all about and how some of the major\
    \ components fit together.\n\nBut don’t worry if some of the stuff we do here\
    \ is totally new to you. We’re not trying to make you experts by the end of this\
    \ chapter. All we’re doing here is giving you a feel of things - setting you up\
    \ so that when we get into the details in later chapters, you have an idea of\
    \ how the pieces fit together.\n\nAll you need to follow along with the exercises\
    \ in this chapter is a single Docker host. This can be any of the options we just\
    \ installed in the previous chapter, though if you are using Docker for Windows\
    \ you should be running it in “Linux Container” mode. It doesn’t matter if this\
    \ Docker host is a VM on your laptop, an instance in the public cloud, or bare\
    \ metal server in your data center. All it needs, is to be running Docker with\
    \ a connection to the internet.\n\n### Engine check\n\nWhen you install Docker\
    \ you get two major components:\n\n* the Docker client\n* the Docker daemon (sometimes\
    \ called server)\n\nThe daemon implements the Docker Remote API. In a default\
    \ Linux installation the client talks to the daemon via a local IPC/Unix socket\
    \ at `/var/run/docker.sock`. You can test that the client and daemon are operating\
    \ and can talk to each other with the `docker version` command.\n\n```\n$ docker\
    \ version\nClient:\n Version:      1.12.1\n API version:  1.24\n Go version: \
    \  go1.6.3\n Git commit:   23cf638\n Built:        Thu Aug 18 05:33:38 2016\n\
    \ OS/Arch:      linux/amd64\n\nServer:\n Version:      1.12.1\n API version: \
    \ 1.24\n Go version:   go1.6.3\n Git commit:   23cf638\n Built:        Thu Aug\
    \ 18 05:33:38 2016\n OS/Arch:      linux/amd64\n```\n\nAs long as you get a response\
    \ back from the `Client` and `Server` components you should be good to go. If\
    \ you get an error response form the Server component, try the command again with\
    \ `sudo` in front of it: `sudo docker version`. If it works with `sudo` you will\
    \ need to prefix the remainder of the commands in this chapter with `sudo`.\n\n\
    ### Images\n\nNow let’s look at images.\n\nRight now, the best way to think of\
    \ a Docker image is as an object that contains an operating system and an application.\
    \ It’s not massively different from a virtual machine template. A virtual machine\
    \ template is essentially a stopped virtual machine. In the Docker world, an image\
    \ is effectively a stopped container.\n\nRun the `docker images` command on your\
    \ Docker host.\n\n```\n$ docker images\nREPOSITORY    TAG        IMAGE ID    \
    \   CREATED       SIZE\n```\n\nIf you are working from a freshly installed Docker\
    \ host it will have no images and will look like the output above.\n"
