  trans: '


    用于处理 Docker 镜像的最常用命令是 `docker pull`（将镜像拉取到本地 Docker 主机）、`docker images`（查看已拉取到
    Docker 宿机的镜像列表）以及 `docker rmi`（在不再需要时删除镜像）。


    恭喜你！你现在对 Docker 镜像是什么已经有了初步的了解 :-D 现在是时候深入研究了。


    # Docker 镜像 - 深度解析


    我们已经提到过几次，容器镜像就像是停止的容器。事实上，你可以停止一个容器并从它创建一个新镜像。考虑到这一点，镜像被视为构建时构造物，而容器是运行时构造物。


    ![Figure 5.1](img/figure5-1.png)


    图 5.1


    ## 镜像与容器


    图 5.1 显示了镜像与容器关系的高级视图。我们使用 `docker run` 命令从单个镜像启动一个或多个容器。然而，一旦你从镜像启动了容器，这两个构造物就会相互依赖，在最后一个使用它的容器停止并销毁之前，你无法删除该镜像。尝试在不停止和销毁所有使用它的容器的情况下删除镜像将导致以下错误：


    ```

    $ docker rmi <image-name>

    Error response from daemon: conflict: unable to remove repository reference \

    "<image-name>" (must force) - container <container-id> is using its referenc\

    ed image <image-id>

    ```


    容器的全部目的是运行应用程序或服务。这意味着创建容器的镜像必须包含运行容器所需的任何操作系统文件和应用程序文件。然而，容器的核心在于快速和轻量化。这意味着构建容器的镜像通常很小，并且剥离了所有非本质部分。


    例如，Docker 镜像往往不会带 6 种不同的 shell 供你选择——它们通常只带一个极简的 shell。它们也不包含内核——所有运行在 Docker
    主机上的容器都共享对 Docker 主机内核的访问。由于这些原因，我们有时说镜像包含了足够的操作系统。


    Docker 镜像可以有多小的极端例子可能是官方 Alpine Linux Docker 镜像，它目前的大小大约在 5MB 左右。这不是笔错误！它真的只有
    5 兆字节！不过，一个更典型的例子可能是官方 Ubuntu Docker 镜像，它目前大约是 120-130MB。


    ## 拉取镜像


    一个干净安装的 Docker 主机在其本地缓存中没有任何镜像（Linux 主机上为 `/var/lib/docker/<storage-driver>`）。你可以通过
    `docker images` 命令验证这一点。


    ```

    $ docker images

    REPOSITORY  TAG      IMAGE ID       CREATED         SIZE

    ```


    将镜像获取到 Docker 主机的行为被称为“拉取”（pulling）。所以，如果你想在 Docker 主机上获取最新的 Ubuntu 镜像，你就拉取它。使用以下命令拉取
    Alpine 和 Ubuntu 镜像，然后检查它们的大小。


    > 如果你还没有将用户账户添加到本地的 `docker` Unix 组，可能需要在以下所有命令的开头添加 `sudo`。


    ```

    $ docker pull alpine:latest

    latest: Pulling from library/alpine

    e110a4a17941: Pull complete

    Digest: sha256:3dcdb92d743...3626d99b889d0626de158f73a

    Status: Downloaded newer image for alpine:latest

    $

    $ docker pull ubuntu:latest

    latest: Pulling from library/ubuntu

    952132ac251a: Pull complete

    82659f8f1b76: Pull complete

    c19118ca682d: Pull complete

    8296858250fe: Pull complete

    24e0251a0e2c: Pull complete

    Digest: sha256:f4691c96e6b...28ae95a60369c506dd6e6f6ab

    Status: Downloaded newer image for ubuntu:latest

    $

    $ docker images

    REPOSITORY  TAG      IMAGE ID       CREATED         SIZE

    ubuntu      latest   bd3d4369aebc   12 days ago     126.6 MB

    alpine      latest   4e38e38c8ce0   10 weeks ago    4.799 MB

    ```


    如你所见，这两个镜像现在都存在于你的 Docker 主机。


    让我们仔细观察一下我们刚才的操作。


    我们使用 `docker pull` 命令拉取镜像。在每个命令中，我们必须指定要拉取哪个镜像。所以，让我们花一点时间看看镜像的命名。为此，我们需要一些关于存储镜像的背景知识。


    ## 镜像仓库 (Image registries)


    Docker 镜像存储在镜像仓库中。最常见的镜像仓库是 Docker Hub。还存在其他仓库，包括第三方仓库和安全的本地部署仓库，但 Docker Hub
    是默认的，也是我们在本书中将使用的。


    镜像仓库包含多个镜像存储（image repositories）。镜像存储包含镜像。这可能有点困惑，所以图 5.2 显示了一个包含 3 个存储的镜像仓库图片，每个存储又包含几个镜像。


    ![Figure 5.2](img/figure5-2.png)


    图 5.2


    Docker Hub 也有镜像仓库和镜像存储的概念。（注：提供的文本在后续部分包含重复/混淆的句子，已进行审查并格式化以确保清晰）。


    ## 镜像命名与标记


    在命令行中从官方仓库引用镜像只需提供仓库名称和由冒号 `:` 分隔的标签。在处理官方仓库的镜像时，`docker pull` 的格式为：


    `docker pull <repository>:<tag>`


    在我们之前的示例形式中，我们通过以下两个命令拉取了 Alpine 和 Ubuntu 镜像：


    `docker pull alpine:latest` 和 `docker pull ubuntu:latest`


    这两个命令从 "alpine" 和 "ubuntu" 存储拉取了标记为 "latest" 的镜像。


    以下示例显示了如何从官方仓库拉取各种不同的镜像：


    ```

    $ docker pull mongo:3.3.11

    //这将从官方 `mongo` 仓库中拉取标记为 `3.3.11` 的镜像。


    $ docker pull redis:latest

    //这将从官方 `redis` 仓库中拉取标记为 `latest` 的镜像。


    $ docker pull alpine

    //这将从官方 `alpine` 仓库中拉取标记为 `latest` 的镜像。

    ```


    '
- fmt: "\nA couple of points to note about the commands above. Firstly, if you `do\
    \ not` specify an image tag after the repository name, Docker will assume you\
    \ are referring to the image tagged as `latest`. Secondly, the `latest` tag doesn’t\
    \ have any mystical powers! Just because an image is tagged as `latest` does not\
    \ mean it is the most recent image in a repository! Moral of the story - take\
    \ care when using the `latest` tag!\n\nPulling images from an `unofficial repository`\
    \ is essentially the same - you just need to prepend the repository name with\
    \ the Docker Hub username or organization name. The example below shows how to\
    \ pull the `v2` image from the `tu-demo` repository owned by a scary person whose\
    \ Docker Hub account name is `nigelpoulton`.\n\n```\n$ docker pull nigelpoulton/tu-demo:v2\n\
    //This will pull the image tagged as `v2` from the `tu-demo` repository with\\\
    \nin the namespace of my personal Docker Hub account.\n```\n\nIf you want to pull\
    \ images from 3rd party registries, you need to prepend the repository name with\
    \ the DNS name of the registry. For example, if the image in the example above\
    \ was in the Google Container Registry (GCR) you’d need to add `gcr.io` before\
    \ the repository name as follows - `docker pull gcr.io/nigelpoulton/tu-demo:v2`.\n\
    \nYou may need to have an account on 3rd party registries and be logged in before\
    \ you can pull images from them.\n\n### Images with multiple tags\n\nOne final\
    \ word about image tags… a single image can have as many tags as you want. This\
    \ is because tags are arbitrary alpha-numeric values that are stored as metadata\
    \ alongside the image. Let’s look at an example.\n\nPull all of the images in\
    \ the repository below using the `docker pull` command with the `-a` flag. Then\
    \ run `docker images` to look at the images pulled.\n\n```\n$ docker pull -a nigelpoulton/tu-demo\n\
    latest: Pulling from nigelpoulton/tu-demo\n237d5fcd25cf: Pull complete\na3ed95caeb02:\
