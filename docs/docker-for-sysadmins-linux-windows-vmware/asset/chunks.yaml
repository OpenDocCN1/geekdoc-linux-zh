    关于上述命令有几点需要注意。首先，如果你在仓库名称后没有`do not`指定镜像标签（tag），Docker 将假设你指的是标签为 `latest` 的镜像。其次，`latest`
    标签并没有任何神奇的力量！仅仅因为镜像被标记为 `latest`，并不意味着它是仓库中最新的镜像！这里的教训是——使用 `latest` 标签时要小心！


    从 `unofficial repository`（非官方仓库）拉取镜像本质上是一样的——你只需要在仓库名称前面加上 Docker Hub 用户名或组织名称。下面的示例展示了如何从
