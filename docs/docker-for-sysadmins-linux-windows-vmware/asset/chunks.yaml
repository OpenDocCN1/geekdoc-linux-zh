    \ that the network created properly and is visible on the Docker host.\n\n```\n\
    $ docker network ls\nNETWORK ID          NAME                DRIVER      SCOPE\n\
    490e2496e06b        bridge              bridge      local\na0559dd7bb08      \
    \  docker_gwbridge     bridge      local\na856a8ad9930        host           \
    \     host        local\nailuc6rgcnr        ingress             overlay     swarm\n\
    be581cd6de9b        none                null        local\n43wfp6pzea47      \
    \  uber-net            overlay     swarm\n```\n\nLet’s go and create a new service.\n\
    \n```\n$ docker service create --name uber-svc \\\n   --network uber-net \\\n\
    \   -p 80:80 --replicas 12 \\\n   nigelpoulton/tu-demo:v1\n\ndhbtgvqrg2q4sg07ttfuhg8nz\n\
    ```\n\nLet’s see what we just declared with that `docker service create` command.\n\
    \nThe first thing we did was name the service and then use the `--network` flag\
