    Resources:\nPorts:\n Protocol = tcp\n TargetPort = 8080\n PublishedPort = 8080\n\
    ```\n\n上面的示例使用 `--pretty` 标志将输出限制为以易读的格式打印的最感兴趣的项目。省略 `--pretty` 标志将获得更详细的输出。\n\
    \n我们稍后会回到这些输出中的某些。\n\n让我们来看看如何扩展服务。\n\n## 扩展服务\n\n服务的另一个强大功能是能够轻松地向上或向下扩展规模。\n\
    \n假设业务兴隆，我们看到访问 Web 前端的流量是预期的两倍。幸运的是，扩展 `web-fe` 服务只需运行 `docker service scale`\
    \ 命令一样简单。\n\n```\n$ docker service scale web-fe=10\nweb-fe scaled to 10\n```\n\
    \n上述命令将任务/副本的数量从 5 扩展到 10。在后台，它正在将服务的期望状态从 5 更新到 10。运行另一个 `docker service ls`\
    \ 命令来验证操作是否成功。\n\n```\n$ docker service ls\n2kffzpz721nr  web-fe  10/10     nigelpoulton/pluralsight-docker-ci\n\
    ```\n\n运行 `docker service ps` 命令将显示服务中的任务在集群的所有节点上尽可能均匀地分布。\n\n```\n$ docker service\
    \ ps web-fe\nID         NAME      IMAGE             NODE  DESIRED  CURRENT\n817...f6z\
    \  web-fe.1  nigelpoulton/...  mgr2  Running  Running 5 mins\na1d...mzn  web-fe.2\
    \  nigelpoulton/...  wrk1  Running  Running 5 mins\ncc0...ar0  web-fe.3  nigelpoulton/...\
    \  wrk2  Running  Running 5 mins\n6f0...azu  web-fe.4  nigelpoulton/...  mgr3\
    \  Running  Running 5 mins\ndyl...p3e  web-fe.5  nigelpoulton/...  mgr1  Running\
    \  Running 5 mins\n912...vtb  web-fe.6  nigelpoulton/...  mgr1  Running  Running\
    \ 1 min\n3wu...o7y  web-fe.7  nigelpoulton/...  wrk3  Running  Running 1 min\n\
    aso...6hh  web-fe.8  nigelpoulton/...  wrk3  Running  Running 1 min\n97u...4bn\
    \  web-fe.9  nigelpoulton/...  wrk1  Running  Running 1 min\na1u...4jj  web-fe.10\
    \ nigelpoulton/...  mgr2  Running  Running 1 min\n```\n\n在后台，swarm 模式运行着一种调度算法，该算法默认尝试在集群节点之间尽可能均匀地平衡任务。在写本文期间，这相当于在每个节点上运行等数量的任务，而不考虑\
    \ CPU 负载等因素。\n\n再次运行另一个 `docker service scale` 命令将数量从 10 调回 5。\n\n```\n$ docker\
    \ service scale web-fe=5\nweb-fe scaled to 5\n```\n\n现在我们已经知道了如何扩展服务，让我们来看看如何删除它。\n\
    \n## 删除服务\n\n删除服务非常简单——可能太简单了。\n\n以下 `docker service rm` 命令将删除我们之前部署的服务。\n\n```\n\
    $ docker service rm web-fe\nweb-fe\n```\n\n使用 `docker service ls` 命令确认服务已删除。\n\
    \n```\n$ docker service ls\nID  NAME  REPLICAS  IMAGE  COMMAND\n```\n\n使用 `docker\
    \ service rm` 命令时要小心，因为它会在不询问确认的情况下删除服务中的所有任务。\n\n现在服务已从系统中删除，让我们来看看如何向服务推送滚动更新。\n\
    \n## 滚动更新\n\n向已部署的应用程序推送更新是生活中的常态。在很长一段时间里，这一直都非常痛苦。我为了重大的应用程序更新损失了太多的周末，如果可以的话，我不想再次经历那样了。\n\
    \n嗯……多亏了 Docker 服务，向已部署的应用推送更新变得简单多了！\n\n为了看到这一点，我们将部署一个新的服务。但在此之前，我们将创建一个叠加网络（overlay\
    \ network）。\n\n```\n$ docker network create -d overlay uber-net\n43wfp6pzea470et4d57ud9\n\
    ```\n\n`uber-net` 网络已成功创建，具有 `swarm` 范围，并且目前仅在集群的管理器节点上可见。\n\n叠加网络本质上是在多个底层网络之上创建一个新的第\
    \ 2 网络。图 7.5 显示了由第 3 层路由器连接的两个底层网络。然后跨越这两个网络有一个单一的叠加网络。Docker 宿主机连接到这两个底层网络。\n\
    \n我们可以将容器放置在 `uber-net` 网络上。叠加网络上的所有容器相互通信，即使它们运行的 Docker 宿主机位于不同的网络。\n\n![图 7.5](img/figure7-5.png)\n\
    \n图 7.5\n\n运行 `docker network ls` 以验证网络创建正确并在宿主机上可见。\n\n```\n$ docker network\
    \ ls\nNETWORK ID          NAME                DRIVER      SCOPE\n490e2496e06b\
    \        bridge              bridge      local\na0559dd7bb08        docker_gwbridge\
    \     bridge      local\na856a8ad9930        host                host        local\n\
    ailuc6rgcnr        ingress             overlay     swarm\nbe581cd6de9b       \
    \ none                null        local\n43wfp6pzea47        uber-net        \
    \    overlay     swarm\n```\n\n让我们创建一个新服务。\n\n```\n$ docker service create --name\
    \ uber-svc \\\n   --network uber-net \\\n   -p 80:80 --replicas 12 \\\n   nigelpoulton/tu-demo:v1\n\
    \ndhbtgvqrg2q4sg07ttfuhg8nz\n```\n\n让我们看看刚才 `docker service create` 命令声明了什么。\n\
    \n我们做的第一件事是命名服务，然后使用 `--network` 标志告诉它将所有容器放在新的 `uber-net` 网络上。然后我们在整个集群中暴露 80\
    \ 端口，并将其映射到每个请求的 12 个副本或任务内部的 80 端口。最后，我们告诉它所有任务都基于 nigelpoulton/tu-demo:v1 镜像。\n\
    \n"
