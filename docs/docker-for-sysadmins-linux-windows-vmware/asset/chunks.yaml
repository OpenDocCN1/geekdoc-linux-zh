    Let’s remind ourselves of the major commands we use to work with Docker images.


    ### Images - The commands


    *   `docker pull` is the command to download images. We pull images from repositories
    inside of remote registries. By default images will be pulled from repositories
    on Docker Hub. This command will pull the image tagged as `latest` from the `alpine`
    repository on Docker Hub `docker pull alpine:latest`.


    *   `docker images` lists all of the images stored in your Docker host’s local
    cache. To see the SHA256 digests of images add the `--digests` flag.


    *   `docker rmi` is the command to delete images. This command shows how to delete
    the `apline:latest` image `docker rmi alpine:latest`. You cannot delete an image
    that is associated with a container in the running (UP) or stopped (Exited) states.


    ### Chapter summary


    In this chapter we learned about Docker images. We learned that images are made
    up one or more read-only layers that when stacked together make up the overall
    image. We used the `docker pull` command to pull them into our Docker host’s local
    cache and we covered image naming conventions. Then we learned about image layers
    and how they can be shared among multiple images. We then covered the most common
    commands used for working with images.


    In the next chapter we’ll take a similar tour of containers - the runtime cousin
    of images.


    ## 6: Containers


    Now that we know a bit about images, the next logical step is get into containers.
    As this is a book about Docker, we’ll be talking specifically about Docker containers.
    However, the Docker project has recently been hard at work implementing the image
    and container specs published by the Open Container Initiative (OCI) at https://www.opencontainers.org.
    This means some of what you learn here will apply to other container runtimes
    that are OCI compliant.


    Let’s go and learn about containers!


    ### Docker containers - The TLDR


    A container is the runtime instance of an image. In the same way that we can start
    a virtual machine (VM) from virtual machine template, we start one or more containers
    from a single image. The big difference between a VM and a container is that containers
    are faster and more lightweight - instead of running a full-blown OS like a VM,
    containers run no kernel and just enough OS to get the essentials done.


    Figure 6.1 shows a single Docker image being used to start multiple Docker containers.


    ![Figure 6.1](images/figure6-1.png)


    Figure 6.1


    The most basic way to start a container is with the `docker run` command. The
    command can take a lot of arguments, but in it’s most basic form you tell it an
    image to use and a command to run: `docker run <image> <command>`. This next command
    will start an Ubuntu Linux container running the Bash shell: `docker run ubuntu
    /bin/bash`.


    Containers run until the command they are executing exits. You can manually stop
    a container with the `docker stop` command, and then restart it with `docker start`.
    To get rid of a container forever you have to explicitly delete it using `docker
    rm`.


    That’s the elevator pitch! Now let’s get into the detail…


    ### Docker containers - The deep dive


    The first things we’ll cover here are the fundamental differences between a container
    and a VM. It’s mainly theory at this stage, but important stuff. Along the way
    We’ll point out where the container model has potential advantages over the VM
    model.


    > **Heads-up:** As the author I’m going to say this before we go any further.
    A lot of us get passionate about the things we do and the skills we have. I remember
    *big Unix* people resisting the rise of Linux. You might remember the same. You
    might also remember people attempting to resist VMware and the VM juggernaut.
    In both cases “resistance was futile”. In this section I’m going to highlight
    what I consider some of the advantages the container model has over the VM model.
    But I’m guessing a lot of you will be VM experts with a lot invested in the VM
    ecosystem. And I’m guessing that one or two of you might want to fight me over
    some of the things I say. So let me be clear… I’m a big guy and I’d beat you down
    in hand-to-hand combat :-D Just kidding. What I meant to say was that I’m not
    trying to destroy your empire or call your baby ugly! I’m trying to help. The
    whole reason for me writing this book is to help you get started with Docker and
    containers!


    Anyway, here we go.


    #### Containers vs VMs


    Containers and VMs both need a host to run on. This can be anything from your
    laptop, a bare metal server in your data center, all the way up to an instance
    the public cloud. In this example we’ll assume a single physical server that we
    need to run 4 business applications on.


    In the VM model, the physical server is powered on and the hypervisor boots (we’re
    skipping the BIOS and bootloader code etc.). Once the hypervisor boots it lays
    claim to all physical resources on the system such as CPU, RAM, storage, and NICs.
    The hypervisor then carves these hardware resources into virtual versions that
    look smell and feel exactly like the real thing. It then packages them into a
    software construct called a virtual machine (VM). We then take those VMs and install
    an operating system and application on each one. We said we had a single physical
    server and needed to run 4 applications, so we’d create 4 VMs, install 4 operating
    systems, and then install the 4 applications. When it’s all done it looks a bit
    like Figure 6.2.


    ![Figure 6.2](images/figure6-2.png)


    Figure 6.2


    Things are a bit different in the container model.


    When the server is powered on, your chosen OS boots. In the Docker world this
    can be Linux, or any version of Windows that has support for the container primitives
    in its kernel. As per the VM model, the OS claims all hardware resources. On top
    of the OS we install a container engine such as Docker. The container engine then
    takes **OS resources** such as the *process tree*, the *filesystem*, and the *network
    stack*, and carves them up into secure isolated constructs called *containers*.
    Each container looks smells and feels just like a real OS. Inside of each *container*
    we can run an application. Like before, we’re assuming a single physical server
    with 4 applications. Therefore we’d carve out 4 containers and run a single application
    inside of each as shown in Figure 6.3.


    ![Figure 6.3](images/figure6-3.png)


    Figure 6.3


    At a high level we can say that hypervisors perform **hardware virtualization**
    - they carve up physical hardware resources into virtual versions. Whereas containers
    perform **OS virtualization** - they carve up OS resources into virtual versions.


    #### The VM tax


    Let’s build on what we just covered and drill into one of the main problems with
    the hypervisor model.


    We started out with the same physical server and requirement to run 4 business
    applications. In both models we installed either an OS or a hypervisor (obviously
    a hypervisor is a type of OS that is highly tuned for VMs). So far the models
    are almost identical. But this is where the similarities stop.'
