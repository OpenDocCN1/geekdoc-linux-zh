    第二。仔细观察 `docker images` 命令输出中的 `IMAGE ID` 列。你会发现只有两个唯一的镜像 ID。这意味着尽管拉取了三个标签，但实际上只下载了两个镜像。这是因为其中两个标签指向同一个镜像。换句话说，其中一个镜像有两个标签。如果你仔细看，会发现
