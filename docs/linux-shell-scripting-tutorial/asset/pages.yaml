  md: '# Linux Shell Script Tutorial


    | Command | Meaning |

    |---|---|

    | $ vech=Bus | Create new local variable ''vech'' with Bus as value in first shell
    |

    | $ echo vech | Print the contents of vech |

    | $ export vech | Export first shells variable to second shell |

    | $ /bin/bash | Now load shell in memory (Old shell''s variable is accessed from
    second shell, if they are exported ) |

    | $ echo vech | Print the contents of vech |

    | $ exit | Exit from second shell return to first shell |

    | $ echo vech | Print the contents of vech |


    # Conditional execution i.e. && and ||


    The control operators are && (read as AND) and || (read as OR). An AND list has
    the Syntax: command1 && command2 Here command2 is executed if, and only, command1
    returns an exit status of zero. An OR list has the Syntax: command1 || command2
    Here command2 is executed if and only if command1 returns a non-zero exit status.
    You can use both as follows:


    command1 commandand2 if exit status is zero command1 command3 if exit status is
    non-zero Here if command1 executes successfully then shell will run command2 and
    if command1 is not successful then command3 is executed. E.g.


    ```

    $ rm myf jeff && echo File is removed successfully || echo File is not removed

    If (myf) is removed successful (exit status is zero) echo "File is removed successfully"
    statement is executed, otherwise "echo File is not removed" statement is executed
    (since exit status is non-zero)

    ```


    # I/O Redirection and file descriptors


    As you know I/O redirectors are used to send output to file or to read input from
    file. (See Input/Output redirection) Now consider following examples


    ```

    $ cat > myf

    ^D

    ```


    Above command send output of cat command to myf file


    ```

    $ cal

    command

    ```


    Above command prints calendar on screen, but if you wish to store this calendar
    to file then give


    ```

    $ cal > mycal

    $ sort

    ```


    The cal command send output to mycal file. This is called output redirection


    ```

    10

    -20

    11

    2

    ^D

    -20

    2

    10

    11

    ```


    Here sort command takes input from keyboard and then sorts the number. If we wish
    to take input from file give command as follows


    ```

    $ cat > nos

    10

    ```'
