    # getopts command


    This command is used to check valid command line argument passed to script. Usually
    while in loop

    Syntax: getopts [optstring] {variable1}


    getopts is used by shell parse command line argument. optstring contains the options
    to be recognized; if identifier is followed by a colon, the option is expected
    to have an argument, which should be separated by it white space. Each time it
    is invoked, getopts places the next option in the variable variable1. When an
    option requires an argument, getopts places that argument into the variable OPTARG.
    On errors getopts diagnostic messages are printed when illegal or missing option
    arguments are encountered. If an illegal option is present, getopts ? into variable1.
    For e.g. we have script called ani -a s -w -d

    Options: These are optional argument

    -n name of animal'
