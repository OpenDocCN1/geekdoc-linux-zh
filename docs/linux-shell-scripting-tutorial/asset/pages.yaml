  md: '# # Introduction


    This tutorial is designed for beginners only This tutorial explains the basics
    of shell programming by showing some examples of shell programs. Its not help
    or manual for the shell. While reading this tutorial you can find manual quite
    useful : type **man bash** @ prompt to see manual pages). Manual contains all
    necessary information you need, but it won''t have that examples, which makes
    idea more clear. For that reason, this tutorial contains examples than all the
    features of shell. I assumes you have at least working knowledge of Linux i.e.
    basic commands like how to create, remove files/directories or how to use editor
    like vi or mcedit and login to your system. Before Starting Linux Script Programming
    you must know


    +   * Kernel

    * Shell

    * Process

    * Redirectors, Pipes, Filters etc.


    # # What''s Kernel


    Kernel is hart of Linux O/S. It manages resource of Linux O/S. Resources means
    facilities available in Linux. For eg. Facility to store data, print data on printer,
    memory, file management . Kernel decides who will use this resource, for how long
    and when. It runs your programs (or set up to execute binary files) It''s Memory
    resident portion of Linux. Its performance following task :-


    +   * I/O management

    * Process management

    * Device management

    * File management

    * Memory management


    # # What''s Linux Shell


    Computer understand the language of 0''s and 1''s called binary language. In early
    days of computing, instruction are provided using binary language, which is difficult
    for all of us, to read and write. So in O/s there is special program called Shell.
    Shell accepts your instruction or commands in English and translate it into computers
    native binary language.


    This is what Shell Does for US


    ![](img/5f999ede08d312e9102fbb391afddbb7_2_0.png)'
