    |

    | $ cp first ~/bin | copy your script ''first'' to your binary |

    | $ first | Test whether script is running or not (It will run) |


    In shell script comment is used with # character. These comments are ignored by
    your shell. Comments are used to indicate use of script or person who created/maintained
    script, or for some programming explanation exper. Remember always set Execute
    permission for your script.


    # Commands Related with Shell Programming


    (1)echo [options] [string, variables...]

    Displays text or variables value on screen.

    Options


    +   -n Do not output the trailing new line.

    -e Enable interpretation of the backslash escaped characters in the strings:

    -a alert (bell)

    -b backspace

    -v suppress trailing new line

    -n new line

    -r carriage return

    -t horizontal tab

    -\ back

    \

    For eg. $ echo -e "An apple day keeps away \a\tdoctor\n"


    (2)More about Quotes

    There are three types of quotes


    +   " i.e. Double Quotes

    '' i.e. Single quotes

    ` i.e. Back quote

    1."Double Quotes" - Anything enclose in double quotes removed meaning of that
    characters (except and and).

    2. ''Single quotes'' - Enclosed in single quotes remains unchanged.

    3. `Back quote` - To execute command.


    For eg.


    ```

    $ echo "Today is date"

    Can''t print message with today''s date.

    $ echo "Today is date `date`"

    ```


    Now it will print today''s date as, Today is Tue Jan..., the `date` statement
    uses back quote, (See also ARITHMETIC Note).


