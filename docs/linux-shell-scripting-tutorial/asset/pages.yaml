  md: '# How to Run Shell Scripts


    Because of security of files, in Linux, the creator of Shell Script does not execution
    permission by default. If we wish to run shell script as command we have to do
    two things as follows


    +   (1) Use chmod to give execution permission to script


    Syntax: chmod +x shell-script-name

    OR Syntax: chmod +x 777 shell-script-name


    +   (2) Run your script as ./your-shell-program-name


    For example.

    $ ./first


    Here ''./''(dot) is command, and used in conjunction with shell script. The dot(.)
    indicates to current that the command to be executed in the same shell i ie. without
    the loading of another shell in memory. You can also try following syntax to Run
    Shell Script


    Syntax: bash &nbsh&nbsh;your-shell-program-name

    OR /bin/sh &nbsh&nbsh;your-shell-program-name


    $ bash first

    $ /bin/sh


    Note to run script, you need to have in same directory where you created your
    script, if you are in different directory your script will not run (because of
    path settings), Eg. Your home directory is ( use $ pwd to see current working
    directory) /home/vivek. When you created one script ''first'', after creation
    of this script you moved to other directory lets say /home/vivek/Letters/Personal,
    Now if you try to execute your script it will not run, since ''first'' is in /home/vivek/vivek
    directory, not directory, To Overcome this problem there are two ways First, you
    specify complete path of your script when you want to run it from other directories
    like giving following command


    ```

    $ /bin/sh /home/vivek/first

    ```


    ![](img/5f999ede08d312e9102fbb391afddbb7_13_0.png)


    Now every time you have to give all the detailed as you work in other directory,
    this take time and you have to remember complete path. There is another way, if
    you notice that all of our programs (in form of executable files) are marked as
    executable and can be directly executed from prompt from any directory (To executables
    of our normal program command $ -l /bin or -l /usr/bin) by typing command like


    ```

    $ cc myprg.c

    $ cal

    ```


    How this works? All our executable files are installed in directory /bin and /bin
    directory is set in PATH setting. When you type name of any command at $ prompt,
    what shell sh do if it first look that command in its internal part (as internal
    command, which is part of shell itself, and always available to execute, since
    do not need extra executable file), if found it will execute it. If not found
    it will look for current directory, if found then Shell will Look PATH setting,
    and to find our requested executable file in all of the directories mentioned
    in PATH settings, found it will execute, otherwise will give message "bash: xxxx
    :command not found". There is one question remain can I run my shell script as
    these executables. You can yes, for'
