    # ## Variables in Linux


    +   1) **System variables** - Created and maintained by Linux itself. This type
    of variable defined in CAPITAL LETTERS.


    +   2) **User defined variables (UDV)** - Created and maintained by user. This
    type of variable defined in lower LETTERS.


    # ## Some System variables


    You can see system variables by giving command like $ set. Some of the important
    System variables are


    | System Variable | Meaning |

    | --- | --- |

    | BASH=/bin/bash | Our shell name |

    | BASH_VERSION=1.14.7(1) | Our shell version name |

    | COLUMNS=80 | No. of columns for our screen |

    | HOME=/home/vivek | Our home directory |

    | LINES=25 | No. of columns for our screen |

    | LOGNAME=students | Our logging name |

    | OSTYPE=Linux | Our o/s type : - |

    | PATH=/usr/bin:/bin:/usr/bin | Our path settings |

    | PS1=|u@h\|W||$ | Our prompt settings |

    | PWD=/home/students/Common | Our current working directory |

    | SHELL=/bin/bash | Our shell name |

    | USERNAME=vivek | User who is currently login to this PC |


    NOTE that Some of the above can be different in your PC. You can print any of
    the above variables contains as follows

    `echo $USERNAME`

    `echo $HOME`


    *Caution:* Do not modify System variable this can some time create problems.


    # ## How to define User defined variables (UDV)


    To define UDV use following syntax

    **Syntax:** `variename=value`

    Note: Here ''value'' is assigned to ''variename'' and Value must be on right side
    = sign. For e-g.


    ```

    $ $no=10 # this is ok

    $ $10=no # Error, Not OK, Value must be on right side of = sign.

    ```


    To define variable ''ched'' having value Bus'
