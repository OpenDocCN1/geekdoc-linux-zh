  md: "# More Advanced Shell Script Commands\n\n# /dev/null - Use to send unsent output\
    \ of program\n\nThis is special Linux file which is used to send any unwanted\
    \ output from program/command.\n*Syntax: command > /dev/null*\nFor e.g. $ > /dev/null\
    \ , output of this command is not shown on screen this send to this special file.\n\
    The /dev directory contains other files. The files in this directory mostly represent\
    \ peripheral devices such as disks floppy disk, sound card, line printers etc.\n\
    \n# Local and Global Shell variable (export command)\n\nNormally all our variables\
    \ are local. Local variable can be used in same shell, if you load another copy\
    \ of shell (by the /bin/bash at the prompt $) then new shell ignored all old's\
    \ variable. For e.g. Consider following example\n\n```\n$ vech=Bus\necho $vech\n\
    Bus\n$ /bin/bash\n$ echo $vech\n\nNOTE:-Empty line printed\n$ vech=Car\necho $vech\n\
    Car\n$ exit\n$ echo $vech\nBus\n```\n\n| Command | Meaning |\n|---|---|\n| $ vech=Bus\
    \ | Create new local variable 'vech' with Bus as value in first shell |\n| echo\
    \ $vech | Print the contents of vech |\n| $/bin/bash | Now load second shell in\
    \ memory (Which ignores all old shell's variable) |\n| echo $vech | Print the\
    \ contents of vech |\n| $ vech=Car | Create new local variable 'vech' with Car\
    \ as value in second shell |\n| echo $vech | Print the contents of vech |\n| $\
    \ exit | Exit from second shell return to first shell |\n| echo $vech | Print\
    \ the contents of vech (Now you can see first shell variables and its value) |\n\
    \nWe can copy old shell's variable to new shell (i.e. first shells variable to\
    \ second shells), which variable is known as Global Shell variable. To do this\
    \ use export command\n*Syntax: export variable1,variable2,...,variableN*\nFor\
    \ e.g. \n\n```\n$ vech=Bus\necho $vech\nBus\n$ export vech\necho $vech\n$ /bin/bash\n\
    Bus\n$ exit\n$ echo $vech\n```"
