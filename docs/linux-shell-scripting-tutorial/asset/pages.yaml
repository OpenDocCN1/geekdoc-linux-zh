    # (13)Filename Shorthand or meta Characters (i.e. wild cards)


    +   * or ? or [...] one of such shorthand character.


    * Matches any string or group of characters.

    For e. g $ ls *, will show all files, $ ls a* - will show all files first starting
    with ''a'', $ ls *.c, will show all files having extension .c $ ls ut* , will
    show all files having extension .c but first two letters of file name are ''ut''.


    ? Matches any single character.

    For e. g $ ls ? , will show one single letter file name, $ ls fo? , will show
    all files whose name are 3 character length and file name begin with fo


    [...] Matches any of the enclosed characters.

    For e. g $ ls [abc]* - will show all files beginning with letters a,b,c

    [..] A pair of characters separated by a minus sign denotes a range:

    For e. g $ ls /bin/[a-c]*- - will show all files beginning with letter a,b or
    c


    ```

