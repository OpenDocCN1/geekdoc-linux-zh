  mdcn: "\n\n# Linux 脚本教程\n\n用户，这意味着必须将我们的错误信息打印到 stderr 而不是 stdout。为了解决这个问题，将将上面的\
    \ echo 语句替换如下：\n\n```bash\necho \"Error : Number are not supplied\" 1>&2\necho\
    \ \"Usage : $number1 number2\" 1>&2\n```\n\n现在，如果你这样运行：\n\n```bash\n$ ./demoscr\
    \ > er1\nError : Number are not supplied\nUsage : ./demoscr number1 number2\n\
    ```\n\n它将在 stderr 上打印错误信息而不是 stdout。echo 语句末尾的 `1>&2` 将标准输出 (stdout) 重定向到标准错误\
    \ (stderr) 设备。\n\n语法：`command 1>&destination`\n\n# 函数\n\n函数是一系列指令/命令。函数在 shell\
    \ 中执行特定的活动。定义函数使用以下格式：\n\n语法：\n\n```bash\nfunction-name ()\n{\n  command1\n  command2\n\
    \  ....\n  commandN\n  return\n}\n```\n\n其中 function-name 是你的函数名，用于执行这些命令。`return`\
    \ 语句将终止函数。例如，在提示符处输入 SayHello()：\n\n```bash\n$ SayHello()\necho \"Hello $LOGNAME,\
    \ Have nice computing\"\nreturn\n```\n\n现在只需输入其名称即可执行此 SayHello() 函数：\n\n```bash\n\
    $ SayHello\nHello Helix, Have nice computing\n```\n\n通过这种方式可以调用你的函数。注意，重启电脑后你将丢失此\
    \ SayHello() 函数，因为它是为该会话创建的。为了解决这个问题并将自己的函数添加到 /etc/bashrc 文件中，注意添加此文件时必须以 root\
    \ 身份登录。以下是带有 `today()` 函数的 /etc/bashrc 文件示例，它用于自动化你的某些日常任务，打印格式化的日期。首先以 root 登录，或者如果你已经以你的名字登录（登录不是\
    \ root）并想切换到 root 账户，可以输入以下命令，当提示输入 root（管理员）密码时：\n\n```bash\n$ su\npassword:\n\
    ```\n\n现在打开文件（注意：你的提示符已从 $ 变为 #，表示你现在是 root）：\n\n```bash\n# vi /etc/bashrc\n#\
    \ mcedit /etc/bashrc\n```\n\n```bash\n#\n# today() 用于打印格式化的日期\n#\n# 在 $ 提示符处输入运行此函数\n\
    # 由 Vivek 添加以便在 Linux 中显示函数\n#\n```\n\n# Linux Shell 脚本教程\n\n```bash\ntoday()\
    \ {\n  echo This is a `date +\"%A %d in %B of %Y (%r)\"`\n  return\n}\n```\n\n\
    保存文件并退出，在所有修改之后，你的文件可能如下：\n\n```bash\n# /etc/bashrc\n# 系统级函数和别名\n# 环境内容放在 /etc/profile\n\
    # 出某些未知原因，bash 拒绝在某些\n# 我无法弄定的情况下继承 PS1\n# 将 PS1 放在这里可以确保它每次都会被加载。\nPS1=\"[\\\
    u@\\h \\W]\\$ \"\n```\n\n```bash\n#\n# today() 用于打印完全格式化的日期\n#\n# 在 $ 提示符处输入运行此函数\n\
    # 由 Vivek 添加以便在 Linux 中显示函数\ntoday() {\n  echo This is a `date +\"%A %d in %B\
    \ of %Y (%r)\"`\n  return\n}\n```\n\n要完全运行该函数，请在 $ 提示符处注销退出（或按 CTRL + D）两次（注意，如果你使用\
    \ su 命令登录 root 账户），然后登录并输入 `$ today today`，通过这样 today() 就对系统中的所有用户可用。如果你想为特定用户添加特定函数，请如下所示打开家目录下的\
    \ .bashrc：\n\n```bash\n# vi .bashrc\nOR\n# mcedit .bashrc\n```\n\n```bash\n在文件末尾向\
    \ .bashrc 添加以下内容：\nSayBuy() {\n  echo \"Buy $LOGNAME! Life never be be the same,\
    \ until you log again!\"\n  echo \"Press a key to logout . .\"\n  read\n  return\n\
    }\n```\n\n保存文件并退出，在所有修改之后，你的文件可能如下：\n\n```bash\n# .bashrc\n#\n# 用户特定的别名和函数\n#\
    \ 加载全局定义\n\nif [ -f /etc/bashrc ]; then\n  . /etc/bashrc\nfi\n```\n\nSayBuy()\n\
    \n```bash\n$LOGNAME ! Life never be the same, until you log again\"\n{\n  echo\
    \ \"Press a key to logout. .\"\n  read\n  return\n}\n```\n\n要运行函数 SayBuy，通过这种方式\
    \ SayBuy() 仅对你的登录有效，而对所有用户无效。仅在目录文件 .bashrc 中添加用户特定的别名和函数。提示：如果你想在注销时显示某些消息或执行某些操作，打开家目录下的\
    \ .bash_login 文件并在此处添加内容。例如，当我注销时，我想显示消息 Buy! 然后使用 vi 等文本编辑器打开你的 .bash_login 文件并添加语句：\n\
    \n```bash\necho \"$LOGNAME, Press a key . .\"\nread\n```\n\n保存文件并退出。在 $ 提示符处按\
    \ CTRL + D（或退出）两次来测试此功能（按键将退出）。\n\n# 用户界面和对话框工具\n\n良好的程序/shell 脚本必须与用户交互。有两种方式在提示符处使用。例如：使用\
    \ echo 和 read 来读取输入到变量。\n\n```bash\n$ chmod +x userite\n$ userite\n```\n\n你的好名字：\n\
    Vivek\n你的好年龄：\n25\nHello Vivek，明年你将 26 岁。\n\n即使你可以创建菜单与用户交互，首先显示菜单选项，让用户选择菜单项，然后根据选择的菜单项采取相应的行动，这种技术在下面的脚本显示：\n\
    \n```bash\n$ cat > menui\n#\n# 创建菜单并根据所选菜单项采取行动的脚本\n#\n# 菜单项\n\nwhile :\ndo\n\
    \  clear\necho \"----------------------------------\"\necho \"               \
    \ 主菜单\"\necho \"----------------------------------\"\necho \"[1] 显示日期/时间\"\necho\
    \ \"[2] 显示当前目录下的文件\"\n```\n\n# Linux Shell 脚本教程\n\n```bash\necho \"[3] 显示日历\"\n\
    echo \"[4] 打开编辑器写字\"\necho \"[5] 退出/停止\"\necho \"==================================\"\
    \necho -n \"输入你的菜单选择 [1-5]: \"\nread\ncase $choice in\n  1) echo \"今天是 `date`，按任意键..\"\
    ; read ;;\n  2) echo pwd -ls -l; echo \"按任意键..\"; read ;;\n  3) cal; echo \"按任意键..\"\
    ; read ;;\n  4) echo \"打开编辑器...\"; read ;;\n  5) echo \"正在退出...\"; exit ;;\n \
    \ *) echo \"无效选择\"; read ;;\nesac\ndone\n```\n\n上述语句在下表中解释：\n\n| 语句 | 解释 |\n|\
    \ :--- | :--- |\n| while : do | 开始无限循环 |\n| clear | 清空终端屏幕 |\n| echo | 在屏幕上显示文本\
    \ |\n| read | 获取用户输入 |\n| case $choice in | 根据变量开始条件分支 |\n| 1) | 情况 1 |\n| ;;\
    \ | 分隔符 |\n| esac | 结束 case 块 |\n| done | 结束 while 循环 |\n\n创建了一个功能性菜单，用于与用户交互。用户可以选择选项，脚本将执行相应的操作。\n\
    \n"
