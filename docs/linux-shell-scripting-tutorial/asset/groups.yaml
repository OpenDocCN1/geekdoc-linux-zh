    # Filter


    If a Linux command accepts its input from the standard input and produces its
    output on standard output is know as a filter. A filter performs some kind of
    process on the input and gives output. For e.g., Suppose we have file called `hotel.txt`
    with 100 lines Data, And from `hotel.txt` we would like to print contains from
    line number 20 to line number 30 and store this result to file called `hlist`


    ```

    $ tail +20 < hotel.txt | head -n30 >hlist

    ```


    Here head is filter which takes its input from given file i.e. hotel.txt) and
    passes these lines to input to head, whose output is redirected to ''hlist''.
