- md: "\n# Linux Shell Scripting Tutorial\n\n![](img/5f999ede08d312e9102fbb391afddbb7_0_0.png)\n\
    \n# Linux Shell Scripting Tutorial Ver. 1.0\n\nWritten by Vivek G Gite\n\n# INDEX\n\
    \n* Introduction\n  * Kernel\n  * Shell\n  * How to use Shell\n  * Common Linux\
    \ Command Introduction\n\n* Process\n  * Why Process required\n  * Linux commands\
    \ related with process\n\n* Redirection of Standard output/input\n  * Redirectors\n\
    \  * Pipes\n  * Filters\n\n* Shell Programming\n  * Variables in Linux\n  * How\
    \ to define User defined variables\n  * Rules for Naming variable name\n  * How\
    \ to print or access value of UDV (User defined variables)\n  * How to write shell\
    \ script\n  * How to Run Shell Scripts\n  * Quotes in Shell Scripts\n\n# Shell\
    \ Scripting Tutorial\n\n- Shell Arithmetic\n- Command Line Processing (Command\
    \ Line Arguments)\n- Why Command Line arguments required\n- Exit Status\n- Filename\
    \ Shorthand or meta Characters (i.e. wild cards)\n\n- Programming Commands\n \
    \ - echo command\n  - Decision making in shell script (i.e. if command)\n  - test\
    \ command or [ expr ]\n  - Loop in shell scripts\n  - The case Statement\n  -\
    \ The read Statement\n\n- More Advanced Shell Script Commands\n  - /dev/null -\
    \ Use to send unwanted output of program\n  - Local and Global Shell variable\
    \ (export command)\n  - Conditional execution i.e. && and ||\n  - I/O Redirection\
    \ and file descriptors\n  - Functions\n  - User Interface and dialog utility\n\
    \  - trap command\n  - getopts command\n  - More examples of Shell Script (Exercise\
    \ for You :-)\n\n## Introduction\n\nThis tutorial is designed for beginners only.\
    \ This tutorial explains the basics of shell programming by showing some examples\
    \ of shell programs. It's not help or manual for the shell. While reading this\
    \ tutorial you can find manual quite useful : type **man bash** @ prompt to see\
    \ manual pages). Manual contains all necessary information you need, but it won't\
    \ have that examples, which makes idea more clear. For that reason, this tutorial\
    \ contains examples than all the features of shell. I assume you have at least\
    \ working knowledge of Linux i.e. basic commands like how to create, remove files/directories\
    \ or how to use editor like vi or mcedit and login to your system. Before Starting\
    \ Linux Script Programming you must know:\n\n* Kernel\n* Shell\n* Process\n* Redirectors,\
    \ Pipes, Filters etc.\n\n## What's Kernel\n\nKernel is hart of Linux O/S. It manages\
    \ resource of Linux O/S. Resources means facilities available in Linux. For eg.\
    \ Facility to store data, print data on printer, memory, file management. Kernel\
    \ decides who will use this resource, for how long and when. It runs your programs\
    \ (or set up to execute binary files) It's Memory resident portion of Linux. Its\
    \ performance following task :-\n\n* I/O management\n* Process management\n* Device\
    \ management\n* File management\n* Memory management\n\n## What's Linux Shell\n\
    \nComputer understand the language of 0's and 1's called binary language. In early\
    \ days of computing, instruction are provided using binary language, which is\
    \ difficult for all of us, to read and write. So in O/s there is special program\
    \ called Shell. Shell accepts your instruction or commands in English and translate\
    \ it into computers native binary language.\n\nThis is what Shell Does for US\n\
    \n![](img/5f999ede08d312e9102fbb391afddbb7_2_0.png)\n\n# Linux Shell Script Tutorial\n\
    \nYou type Your command and shell convert it as\n\n![](img/5f999ede08d312e9102fbb391afddbb7_3_0.png)\n\
    \nIt's environment provided for user interaction. Shell is a command language\
    \ interpreter that executes commands read from the standard input device (keyboard)\
    \ or from a file. Linux may use one of the most popular shells (In MS-DOS, Shell\
    \ name is COMMAND.COM is also used for same purpose, but it's not as powerful\
    \ as our Linux Shells are!)\n\n| Shell Name | Developed by | Where | Remark |\n\
    |---|---|---|---|\n| Bash (Bourne-Again Shell ) | Brian Fox and Chet Ramey | Free\
    \ Software Foundation | Most common shell in Linux. It's Freeware shell. |\n|\
    \ CSH (C Shell) | Bill Joy | The C shell's syntax and usage are very similar to\
    \ the C programming language. | |\n| KSH (Korn Shell) | David Korn | AT & T Bell\
    \ Labs | |\n\nAny of the above shell read command from user (via Keyboard or Mouse)\
    \ and tells Linux O/s what users want. If we are giving commands from keyboard\
    \ it is called command line interface ( Usually in-front of $ prompt. This prompt\
    \ is dependent upon your shell and Environment that you set or by your System\
    \ Administrator, therefore you may get different prompt )\nNOTE: To find your\
    \ shell type following command:\n$ echo $SHELL\n\n# How to use Shell\n\nTo use\
    \ shell (Start to use your shell as soon as you log into your system) you have\
    \ to simply type commands. Following is the list of common commands.\n\n# Linux\
    \ Common Commands\n\nNOTE that following commands are for New users or for Beginners\
    \ only. The purpose is if you use this command you will be more familiar with\
    \ your shell and secondly, If you want to get more information or help for this\
    \ command try following commands For e.g. To see help or options related with\
    \ date command try\n$ date --help\nor To see help or options related with ls command\
    \ (Here you will screen by screen help, because size of ls is quite big that can't\
    \ fit on single screen)\n\n$ ls --help command-name --help\nSyntax: man command-name\n\
    Syntax: info command-name\n\nSee what happened when you type following\n$ man\
    \ ls\n$ info bash\n\nNOTE: In MS-DOS, you can get help by using /? clue or by\
    \ typing help command as:\n\n```\nC:\\> dir /?\nC:\\> date /?\nC:\\> help time\n\
    C:\\> help date\nC:\\> help\n```\n\n# Linux Command\n\n| For this Purpose | Use\
    \ this Command Syntax | Example (In front of $ Prompt) |\n|---|---|---|\n| To\
    \ see date | date | $ date |\n| To see who's using system. | who | $ who |\n|\
    \ Print working directory | pwd | $ pwd |\n| List name of files in current directory\
    \ | ls or dirs | $ ls |\n| To create text file NOTE: Press and hold CTRL key and\
    \ press D | cat { file name } | $ cat myfile type done press CTRL+D |\n| To see\
    \ files | cat { file name } | $ cat myfile |\n| To display one screen at a time\
    \ | more { file name } | $ more myfile |\n| To move or rename file/directory |\
    \ mv {file1} {file2} | $ mv sales.99 |\n| To create file copies with various link.\
    \ After this oldfile newfile refers to same name | ln {oldfile} {newfile} | $\
    \ ln Page1 |\n| To remove file | rm file1 | $ rm myfile |\n\n# Linux Shell Script\n\
    \n| Remove all files in given directory/subdirectory. Use it very carefully. |\
    \ rm -rf {dirname} | $ rm -rf oldfiles |\n|---|---|---|\n| To change file permissions\
    \ u - User who owns the file g - Group file owner o - User classified as other\
    \ a - All other system user - + Set permission - Remove permission r - Read permission\
    \ w - Write permission x - Execute permission | chmod {u|g|o|a}{+-} {r|w|x} {filename}\
    \ | $ chmod u+x,g+wx,o+ myscript NOTE: This command set permission for file called\
    \ 'myscript' as User (Person who creates that file or directory) has permission\
    \ (u+x) Group of file owner can write to this file as well as execute this file\
    \ only execute by (g+wx) Others cannot modify it; Since we have not given w (write\
    \ permission) to them. (o+x). |\n| Read your mail. | mail | $ mail |\n| To See\
    \ more about currently login person (i.e. yourself) | who am i | $ who am i |\n\
    | To login out | logout (OR CTRL+D) | $ (Note: It may ask you password type your\
    \ login password, In this case this feature is disabled by System Administrator)\
    \ |\n| Send mail to other person | mail {user-name} | $ mail ashish |\n| To count\
    \ lines, words and characters of given file | wc {file-name} | $wc myfile |\n\
    | To searches for file line that matches a pattern. | grep {word-to-lookup} {filename}\
    \ | $ grep fox myfile |\n| To sort file in following order -r Reverse normal order\
    \ -n Sort in numeric order -nr Sort in reverse numeric order | sort -r -n -nr\
    \ {filename} | $sort myfile |\n\n| Description | Command | Syntax | Example |\n\
    | --- | --- | --- | --- |\n| To print last line of given file | tail -| + {number}\
    \ {filename} | $tail +5 myfile |\n| To Use to compare files | cmp {file1} {file2}\
    \ OR diff {file1} {file2} | $cmp myfile myfile.old |\n| To print file | pr {file-name}\
    \ | $pr myfile |\n\n© 1998-2000 FreeOS.com (l) Pvt. Ltd. All rights reserved.\n"
  mdcn: "\n\n# Linux Shell 脚本教程\n\n![](img/5f999ede08d312e9102fbb391afddbb7_0_0.png)\n\
    \n# Linux Shell 脚本教程 版本 1.0\n\n作者：Vivek G Gite\n\n# 目录\n\n* 序言 (Introduction)\n\
    \  * 内核 (Kernel)\n  * 解释壳 (Shell)\n  * 如何使用 Shell\n  * 常用 Linux 命令介绍\n\n* 进程 (Process)\n\
    \  * 为什么需要进程\n  * 与进程相关的 Linux 命令\n\n* 标准输出/输入重定向\n  * 重定向符 (Redirectors)\n  *\
    \ 管道 (Pipes)\n  * 过滤器 (Filters)\n\n* Shell 编程 (Shell Programming)\n  * Linux 中的变量\n\
    \  * 如何定义用户自定义变量 (UDV)\n  * 变量名命名规则\n  * 如何打印或访问用户自定义变量 (UDV) 的值\n  * 如何编写 Shell\
    \ 脚本\n  * 如何运行 Shell 脚本\n  * Shell 脚本中的引号\n\n# Shell 脚本教程\n\n- Shell 算术\n- 命令行处理（命令行参数）\n\
    - 为什么需要命令行参数\n- 退出状态\n- 文件名简写或元字符（即通配符）\n\n- 编程命令\n  - echo 命令\n  - Shell 脚本中的决策判断（即\
    \ if 命令）\n  - test 命令或 [ expr ]\n  - Shell 脚本中的循环\n  - case 语句\n  - read 语句\n\n\
    - 更多高级 Shell 脚本命令\n  - /dev/null - 用于发送程序的无效输出\n  - 本地和全局 Shell 变量 (export 命令)\n\
    \  - 条件执行，即 && 和 ||\n  - I/O 重定向和文件描述符\n  - 函数 (Functions)\n  - 用户界面和对话工具 (dialog\
    \ utility)\n  - trap 命令\n  - getopts 命令\n  - 更多 Shell 脚本示例（练习题:-)\n\n## 序言\n\n\
    本教程专为初学者设计。本教程通过展示一些 Shell 程序示例来解释 Shell 编程的基础知识。它不是 Shell 的帮助文档或手册。在阅读本教程时，你会发现手册非常用（在提示符处输入\
    \ **man bash** 查看帮助页）。手册包含了你所需的所有必要信息，但它没有提供让思路更清晰的示例。因此，本教程包含了关于 Shell 所有特性的示例。我假设你至少具备\
    \ Linux 的基本知识，例如基础命令如如何创建、删除文件/目录，如何使用 vi 或 mcedit 编辑器以及如何登录系统。在开始 Linux 脚本编程之前，你必须了解：\n\
    \n* 内核\n* Shell\n* 进程\n* 重定向符、管道、过滤器等\n\n## 什么是内核 (Kernel)\n\n内核是 Linux 操作系统的核心。它管理\
    \ Linux 操作系统的资源。资源是指 Linux 中可用的功能。例如：存储数据的功能、在打印机上打印数据、内存、文件管理。内核决定谁来使用这些资源、使用多久以及何时使用。它运行你的程序（或设置执行二进制文件）。它是\
    \ Linux 内存驻部分。它的性能任务包括：\n\n* I/O 管理\n* 进程管理\n* 设备管理\n* 文件管理\n* 内存管理\n\n## 什么是\
    \ Linux Shell\n\n计算机理解由 0 和 1 组成的语言，称为二进制。在计算早期，指令是使用二进制语言提供的，这对于我们所有人来说都难以阅读和编写。因此，操作系统中有一个特殊的程序叫做\
    \ Shell。Shell 接受你的英语指令或命令，并将其翻译成计算机原生的二进制语言。\n\n这就是 Shell 为我们所做的\n\n![](img/5f999ede08d312e9102fbb391afddbb7_2_0.png)\n\
    \n# Linux Shell 脚本教程\n\n你输入命令，shell 将其转换为\n\n![](img/5f999ede08d312e9102fbb391afddbb7_3_0.png)\n\
    \n它是为用户交互提供的环境。Shell 是一个命令行行语言解释器，用于执行从标准输入设备（键盘）或文件读取的命令。Linux 可能使用最流行的 Shell\
    \ 之一（在 MS-DOS 中，Shell 的名称 COMMAND.COM 也用于相同目的，但它没有我们的 Linux Shell 那么强大！）\n\n|\
    \ Shell 名称 | 开发者 | 来源 | 备注 |\n|---|---|---|---|\n| Bash (Bourne-Again Shell )\
    \ | Brian Fox and Chet Ramey | 自由软件基金会 | Linux 最常用的 Shell。它是免费软件。 |\n| CSH (C\
    \ Shell) | Bill Joy | C shell 的语法和用法与 C 语言语言非常相似。 | |\n| KSH (Korn Shell) | David\
    \ Korn | AT & T Bell 实验室 | |\n\n上述任何 Shell 都会从用户（通过键盘或鼠标）读取命令并告诉 Linux 操作系统用户想要什么。如果我们从键盘输入命令，它被称为命令行界面（通常在\
    \ $ 提示符前面）。此提示符取决于你设置或由系统管理员设置的 Shell 和环境，因此你可能会得到不同的提示符）\n注意：通过以下命令查找你的 Shell\
    \ 类型：\n$ echo $SHELL\n\n# 如何使用 Shell\n\n要使用 shell（登录系统后立即开始使用你的 shell），你只需简单地输入命令。以下是常用命令列表。\n\
    \n# Linux 常用命令\n\n注意，以下命令仅供新用户或初学者。其目的是如果你使用这些命令，你将更熟悉你的 shell；其次，如果你想获取有关该命令的更多信息或帮助，请尝试以下命令。例如，要查看与\
    \ date 命令相关的帮助或选项，请尝试\n$ date --help\n或者查看与 ls 命令相关的帮助或选项（在这里你将看到分屏帮助，因为 ls 的内容很大）\n\
    \n$ date --help\n该命令的语法：\nman bash\n该命令的语法：\n$ ls --help\n该命令的语法：\nman command-name\n\
    注意：输入以下命令查看发生了什么\n$ ls --help\nman command-name\n在 MS-DOS 中，你可以通过输入 /? 来获取帮助，如下：\n\
    \n```\nC:\\> dir /?\nC:\\> date /?\nC:\\> help\nC:\\> time\nC:\\> help\n```\n\n\
    # Linux 命令\n\n| 目的 | 命令 | 语法 | 示例（在 $ 提示符前） |\n|---|---|---|\n| 查看日期 | date |\
    \ $ date |\n| 查看谁正在使用系统 | who | $ who |\n| 打印工作目录 | pwd | $ pwd |\n| 查看当前目录的文件列表\
    \ | ls or dirs | $ ls |\n| 创建文本文件 注意：按住 CTRL 键 | cat { name } | $ cat myfile |\n\
    | 查看文件 | cat { name } | $ cat myfile |\n| 逐屏显示 | more { name } | $ more myfile\
    \ |\n| 移动或重命名文件/目录 | mv {file1} {file2} | $ mv sales.99 |\n| 创建各种链接的文件 | ln {oldfile}\
    \ {newfile} | $ ln Page1 |\n| 删除文件 | rm file1 | $ rm myfile |\n\n# Linux Shell\
    \ 脚本\n\n| 描述 | 命令 | 语法 | 示例 |\n|---|---|---|\n| 删除给定目录/子目录中的所有文件。谨慎使用。 | rm -rf\
    \ {dirname} | $ rm -rf oldfiles |\n| 修改文件权限 u - 所有者 g - 组 o - 其他用户 a - 所有用户 +\
    \ 设置权限 - 删除权限 r - 读取权限 w - 写权限 x - 执行权限 | chmod {u|g|o|a}{+-} {r|w|x} {filename}\
    \ | $ chmod u+x,g+wx,o+ 为名为 myscript 的文件设置权限：创建该文件或目录的用户（u）拥有权限（u+x）。文件组也可以写入和执行该文件（g+wx）。其他人无法修改它；因为我们没有给他们\
    \ w（写权限）（o+x）。 |\n| 读取你的邮件 | mail | $ mail |\n| 查看当前登录人员（即你自己） | who am i | $\
    \ who am i |\n| 登出 | logout (或 CTRL+D) | $（注意：它可能会要求你输入登录密码，在这种情况下此功能由系统管理员禁用）\
    \ |\n| 向其他人员发送邮件 | mail {user-name} | $ mail ashish |\n| 计算给定文件的行、单词和字符数 | wc\
    \ {file-name} | $wc myfile |\n| 搜索匹配模式的文件行 | grep {word-to-lookup} {filename}\
    \ | $ grep fox myfile |\n| 按照以下顺序排序文件 -r 反转正常顺序 -n 数字排序 -nr 逆向数字排序 | sort -r -n\
    \ -nr {filename} | $sort myfile |\n\n"
