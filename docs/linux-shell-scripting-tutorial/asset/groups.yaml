  mdcn: "\n\n# Shell 脚本教程\n\n- -a 动物年龄\n- -s 动物性别\n- -w 动物体重\n- -d 演示值（如果使用了上述任何选项，这些值不会被读取）\n\
    \n$ cat > ani\n#\n# 用法: ani -n -a -s -w -d\n#\n\n# help_ani() 用于打印帮助信息\n#\nhelp_ani()\n\
    \n```bash\n{\necho \"Usage: $0 -n -a -s -w -d\"\necho \"Options: 这些是可选参数\"\necho\
    \ \"-n 动物名称\"\necho \"-a 动物年龄\"\necho \"-s 动物性别\"\necho \"-w 动物体重\"\necho \"-d\
    \ 演示值（如果使用了上述任何选项\"\necho \"其值将不会被读取）\"\nexit 1\n}\n```\n\n#\n开始主程序\n#\n\n## 为变量设置默认值\n\
    #\nisdef=0\na=Moti\nage=\"2 Months\"\nsex=Male\nweight=3Kg\n\n#\n# 如果没有参数\n#\n\
    if [ $# -lt 1 ]; then\nhelp_ani\nfi\n\n```bash\nwhile getopts n:a:s:w:d opt\n\
    do\n\tcase \"$opt\" in\n\tn) na=\"$OPTARG\";\n\ta) age=\"$OPTARG\";\n\ts) sex=\"\
    $OPTARG\";\n\tw) weight=\"$OPTARG\";\n\td) isdef=1;\n\t\\) help_ani;\n\tesac\n\
    done\n```\n\n# Linux Shell 脚本教程\n\n```bash\nif [ $isdef -eq 0 ]\nthen\n    echo\
    \ \"Animal Name: $na, Age: $age, Sex: $sex, Weight: $weight (用户定义模式)\"\nelse\n\
    \    na=\"Pluto Dog\"\n    age=3\n    sex=Male\n    weight=20kg\n    echo \"Animal\
    \ Name: $na, Age: $age, Sex: $sex, Weight: $weight (演示模式)\"\nfi\n```\n\n保存并按照如下方式运行\n\
    \n+ $ chmod +x ani\n$ ani -n Lassie -a 4s Female -w 20Kg\n$ ani -a 4s Female -n\
    \ Lassie -w 20kg\n$ ani -n Lassie -s Female -w 20kg -a 4\n$ ani -w 20kg -s Female\
    \ -n Lassie -a 4\n$ ani -w 20kg -s Female\n$ ani -n Lassie -a 4\n$ ani -n Lassie\n\
    $ ani -a 2\n\n看由于使用了 getopts，我们可以以不同的风格传递命令行参数。以下是 ani 脚本的无效选项\n\n+ $ ani -nLassie-a4\
    \ -sFemale -w20kg\n此处选项和其值之间没有空格。\n$ ani -nLassie-a 4 -s Female -w 20kg -c Mammal\n\
    H -c 不是选项之一。\n\n# 更多 Shell 脚本示例（供你练习：--)\n\n首先尝试作为练习编写这个 shell 脚本，如果遇到任何问题或想查看此脚本的示例答案，请打开填充了此教程的\
    \ shell 脚本。\n\nQ.1. 如何编写一个 shell 脚本来相加两个作为命令行参数提供的数字，如果没有提供这两个数，则显示错误及其用法。\n\n\
    答案：参见 Q1 shell 脚本。\n\nQ.2. 编写脚本从三个数字中找到最大的数。数字作为命令行参数提供。如果提供的参数不足，则打印错误。\n\n答案：参见\
    \ Q2 shell 脚本。\n\nQ.3. 编写脚本使用 `while` 循环打印数字 5,4,3,2,1。\n\n答案：参见 Q3 shell 脚本。\n\
    \nQ.4. 编写脚本，使用 `case` 语句执行以下基础数学运算\n\n+ + 加法\n- 减法\n* 乘法\n/ 除法\n\n脚本名称必须为 'q4$，其工作方式如下\n\
    $ q4 20 / 3，同时检查命令行参数是否足够\n\n答案：参见 Q4 shell 脚本。\n\nQ.5. 编写脚本显示当前日期、时间、用户名和当前目录。\n\
    \n答案：参见 Q5 shell 脚本。\n\nQ.6. 编写脚本反序打印给定数字，例如。如果数字是 123，它将打印为 321。\n\n# Linux 教程\n\
    \n答案：Q6. 编写打印所有数字之和。例如，如果数字是 123，其所有数字之和将是 1+2+3=6。\n\n答案：Q7 Shell 脚本。\n\nQ.8.\
    \ 如何在 Linux 中执行实数（带小数点）计算\n\n答案：使用 Linux 的 `bc` 命令\n\nQ.9. 如何在 shell 中执行实数计算并将结果存储到\n\
    \n答案：使用命令如，`$ echo 5.12 + 2.5 | bc`，在这里我们将 `echo` 命令的输出作为 5.12 + 2.5。\n\nQ.10.\
    \ 编写在 shell 中执行实数计算并将结果存储到第三个变量中，假设 a=5.66, b=8, c=a+b\n\n答案：Q10 Shell 脚本。\n\n\
    Q.11. 编写脚本判断文件是否存在，文件名作为命令行参数提供。\n\n答案：Q11 Shell 脚本。\n\nQ.12. 编写脚本判断指定的命令行参数 ($1)\
    \ 是否包含 \"*\" 符号\n\n```bash\n$ /bin  # (注：原文 /1 应为 /bin)\n此处 $1 是 /bin，但检查是否存在\
    \ \"*\" 符号，它不应该打印出要求的\n/bin/*\n$ /bin\n```\n\n答案：Q12. 编写打印所有数字之和。例如，如果数字是 123，其所有数字之和将是\
    \ 1+2+3=6。（等待，检查文本流：原文中 Q6 和 Q7 合并得很奇怪，我将遵循提供的 OCR 顺序）。\n\n答案：Q7 Shell 脚本。（注：OCR\
    \ 此处似乎重复）。\n\nQ.13. 编写脚本反序打印数字，例如。如果数字是 123，它将打印为 321。\n\n答案：Q13. Shell 脚本。\n\n\
    Q.14. 编写脚本实现 get语句，你的脚本应该理解以下内容：\nQ14\n-c 清屏\n-d 显示当前目录下的文件列表\n-m 开始 ]\n-e 开始\
    \ [ ]\n\n答案：Q14\n\nQ.15. 编写一个名为 Hello 的脚本，将其放入名为 .bash_profile 的启动文件中，它应该在你登录时运行并根据系统时间打印以下消息之一：\n\
    Good Morning（早上好）\nAfternoon（下午好）\nGood Evening（晚上好）\n\n答案：Q15 Shell 脚本。\n\nQ.16.\
    \ 如何编写脚本，打印消息 \"Hello World \" 并**加粗**以及不同的颜色，使用 `echo` 命令。\n\n答案：Q16 Shell 脚本。\n\
    \nQ.17. 编写一个后台进程，在屏幕上角持续打印当前时间，用户可以在 $ 提示符处正常操作。\n\n# Q18. 使用 dialog 工具实现菜单。根据选择菜单项的操作如下\n\
    \n| 菜单项 | 目的 | 菜单项的操作 |\n|---|---|---|\n| 日期/时间 | 查看当前时间 | 日期时间必须在信息对话框中显示 |\n\
    | 日历 | 查看当前日历 | 日历必须在信息对话框中显示 |\n| 删除 | 删除文件 | 首先询问文件所在的目录，如果没有则假设当前目录，然后显示该目录的文件，让用户选择文件，然后确认是否要删除文件，如果回答是则删除文件，删除时报告错误\
    \ |\n| 退出 | 退出此脚本 | 退出菜单驱动程序即此脚本 |\n\n注：为所有操作创建函数，例如显示时间的 `show_datetime()`。答案：Q1\n\
    \nQ.19. 编写脚本显示各种系统配置，如\n\n- 1) 当前登录用户及其姓氏\n- 2) 当前的 shell\n- 3) 你的家目录\n- 4) 你的操作系统类型\n\
    - 5) 你的路径设置\n- 6) 你的工作目录\n- 7) 显示当前登录人数\n- 8) 关于你的操作系统和版本、发布号、内核版本\n- 9) 显示所有可用\
    \ shell\n- 10) 显示鼠标设置\n- 11) 显示 CPU 信息如处理器类型、速度等\n- 12) 显示内存信息\n- 13) 显示硬盘信息如大小、缓存、型号等\n\
    - 14) 文件系统（已挂载）\n\n答案：参见 Q19 Shell 脚本。\n\n全部！感谢阅读。本教程到此结束，但 Linux 编程环境非常大且富有成果（通过上面的\
    \ shell 脚本，你应该继续阅读更高级的主题和书籍。如果你对联系方式有任何建议、新想法或问题，请随时联系我）。\n\n我的邮箱是 gite-vivek@usa.net。\n\
    \n© 1998-2000 FreeOs.com (i) Pvt. Ltd. 版权所有。\n\n"
