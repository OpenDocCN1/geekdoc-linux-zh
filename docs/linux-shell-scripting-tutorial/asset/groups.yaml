    ## What is Processes


    Process is any kind of program or task carried out by your PC. For e.g. $ ls -IR
    , is a command or a request to list files in a directory and all subdirectory
    in your current directory. It is a process. A process is program (command given
    by user) to perform some Job. In Linux when you start process, it gives a number
    (called PID or process-id), PID starts from 0 to 65535.


    ## Why Process required


    Linux is multi-user, multitasking o/s. It means you can run more than two process
    simultly if you wish. For e.g.. To find many files do you have on your system
    you may give command like:


    ```

    $ ls / -R | wc -l

    ```


    This command will take of time to search all files on your system. So you can
    run such command in Background or simultaneously by giving command like $ ls /
    -R | wc -l &

    The ampersand & at the end of command tells shell start command (ls / -R | wc
    -l) and run it in background takes next command immediately. An instance of running
    process is called process and the number printed by shell is called process-id
    (PID), this PID can be used to refer specific running process.


    ## Linux Command Related with Process


    NOTE that you can only kill process which are created by yourself. An Administrator
    can almost kill 95-98% process. But some process can not be killed, such as VDU
    Process.


    ## Redirection of Standard output/input or Input - Output redirection


    Most all command gives output on screen or take input from keyboard, but in Linux
    it''s possible to send output to file or read input from file. For e.g. $ ls command
    gives output to screen; to send output to file of ls command, $ ls > filename.
    It means put output of ls command to filename. There are three redirection symbols
    >>, ><


    ### (1) > Redirector Symbol


    **Syntax: Linux-command > filename**


    To output Linux-commands result to file. Note that If file already exist, it will
    be overwritten new file is created. For e.g. To send output of ls command give
    $ ls myfiles if ''myfiles'' file exist in your current directory it will be overwritten
    without any type of warning. (What if I want to send output to file, which is
    already exist and want to keep information of file without loosing previous information/data?
    For this Read next redirector


    ### (2) >> Redirector Symbol, Linux-command >> filename


    To output Linux-commands result to END of file. Note that If file exist , it will
    be opened and new input information / data will be written to END of file, without
    losing previous information/data. And if file is not exist, then new file is created.
    For e.g. To send output of date command to already exist file give $ date >> myfiles


    ### (3) < Redirector Symbol, Linux-command < filename


    To take input to Linux-command from file instead of key-board. For e.g. To take
    input for for cat command give $ cat < myfiles


    ## Pips


    A pipe is way to connect the output of one program to the input of another program
    without any temporary file.


    ![](img/5f999ede08d312e9102fbb391afddbb7_8_0.png)


    ## Linux Shell Tutorial


    A pipe is nothing a temporary storage place where the output of one command is
    stored and then passed as the input for second command. Pipes are used to run
    more than two commands ( Multiple commands from same line.


    Syntax: `command1 | command2`


    | Command using Pipes | Meaning or Use of Pipes |

    |--- |--- |

    | $ ls | more | Here output of ls command is given as input to more command So
    that output is printed one screen full page at a time |

    | $ who | sort | Here output of who command is given as input to sort command
    So that it will print sorted list of users |

    | $ who | wc -l | Here output of who command is given as input to wc command So
    that it will print number of user who logon to system |

    | $ ls | wc -l | Here output of ls command is given as input to wc command So
    that it will print number of files in current directory. |

    | $ who | grep raju | Here output of who command is given as input to grep command
    So that it will print particular user name if he is logon or nothing is printed
    (To see for particular user logon) |


    ## Filter


    If a Linux command accepts its input from standard input and produces its output
    on standard output is known as a filter. A filter performs some kind of process
    on the input and gives output. For e.g., Suppose we have file `hotel.txt` with
    100 lines, from `hotel.txt` we would like to print from line number 20 to line
    number 30 and store this result to file called `hlist`


    ```

    $ tail +20 < hotel.txt | head -n30 > hlist

    ```


    ## Introduction to Shell Programming


    Shell program is series of Linux commands. Shell script is just batch file is
    MS-DOS but have more power than MS-DOS batch file. Shell script is to create our
    own commands that can save ours time and automate some task.


    ## Variables in Linux


    - **System variables**: Created and maintained by Linux itself. type of variable
    defined in CAPITAL LETTERS.

    - **User defined variables (UDV)**: Created and maintained by user. type of variable
    defined in lower LETTERS.


    ## Some System variables


    You can see system variables by giving command like set. Some of important System
    variables are:


    | System Variable | Meaning |

    | --- | --- |

    | BASH=/bin/bash | Our shell name |

    | BASH_VERSION=4.1.7 | Our shell version |

    | COLUMNS=80 | Our columns for screen |

    | HOME=/home/vivek | Our home directory |

    | LINES=25 | Our lines for screen |

    | LOGNAME=students | Our logging name |

    | OSTYPE=Linux | Our type |

    | PATH=/usr/bin:/bin | Our path |

    | PS1=\$u@\h:\$ | Our prompt |

    | PWD=/home/students | Our current working directory |

    | SHELL=/bin/bash | Our shell name |

    | USERNAME=vivek | User who is currently login to this |


    NOTE that Some of above can be different in your PC. You can print any of the
    above

    `echo $USERNAME`

    `echo $HOME`


    Caution: do not modify System variable this can some time create problems.


    ## How to define User variables (UDV


    To define UDV use following syntax

    **Syntax:** `variename=value`

    Note: Here ''value'' is assigned to ''variename'' and Value must be on right side
    of =. For eg.


    ```

    $ no=10 # this is ok

    $ 10=no # Error, Not OK, Value must be right side of =

    ```


    To define variable ''ched'' having value Bus


    ```

    $ vech=Bus

    ```


    To define variable called n having value 10


    ```

    $ n=10

    ```


    ## Rules for Variable name (Both UDV and System Variable)


    (1) Variable name must begin with Alphanumeric character or underscore (_), followed
    by one or more Alphanumeric character. For.g. Valid shell variable are as follows


    ```

    HOME

    SYSTEM_VERSION

    vech

    no

    ```


    (2) Don''t put spaces on either side of the equal sign when assigning value to
    variable. For.g.. In following variable declaration there will be no error


    ```

    $ no=10

    ```

    But there will be problem for following

    ```$ no =10

    $ no= 10

    $ no = 10

    ```


    (3) Variables are case-sensitive, just like filename in Linux. For.g.


    ```

    $ no=10

    $ No=11

    $ NO=20

    $ no=2

    ```

    Above all are different variable name, so to print value 20 we have to use $ echo
    $NO and Not any of the following


    ```

    $ echo $no  # will print 10 but not 20

    $ echo $No  # will print 11 but not 20

    $ echo $nO # will print 2 but not 20

    ```


    (4) You can define NULL variable (NULL variable is variable which has no value
    at the time of definition) For.g.


    ```

    $ vech=

    $ vech=""

    ```

    Try to print it''s value $ echo $vech , Here nothing will be shown because variable
    has no value i.e. NULL variable.


    (5) Do not use ?,.* etc, to name your variable names.


    ## How to print or access value of UDV (User defined variables)


    To print or access UDV use following syntax


    Syntax: $variablename


    For eg. To print contains of variable ''vech''


    ```

    $ echo $vech

    ```


    It will print ''Bus'' (if previously defined as vech=Bus). To print contains of
    variable ''n'' $ echo $n

    It will print ''10'' (if previously defined as n=10)


    Caution: Do not try $ echo vech will print its value ''Bus'' and echo $n, It will
    print n instead of ''10'', You must use $ echo by variable name.


    Q.1. How to Define x with value 10 and print it on screen


    ```

    $ x=10

    $ echo $x

    ```'
  mdcn: '


    ## 什么是进程 (Processes)


    进程是你的 PC 执行的任何程序或任务。例如，`ls -IR` 是一个列出当前目录及其所有子目录下文件的命令或请求。它就是一个进程。进程是执行某些任务的程序（用户给出的命令）。在
    Linux 中，当你启动进程时，它会给出一个数字（称为 PID 或进程 ID），PID 从 0 到 65535。


    ## 为什么需要进程


    Linux 是一个多用户、多任务的操作系统。这意味着如果你愿意，你可以可以同时运行两个以上的进程。例如，为了查找系统中有多少文件，你可以输入如下命令：


    ```

    $ ls / -R | wc -l

    ```


    此命令将花费时间搜索你系统上的所有文件。因此，你可以在后台运行此类命令，或者通过输入命令如 `$ ls / -R | wc -l &` 同时运行。命令末尾的符号
    `&` 告诉 shell 启动命令 (`ls / -R | wc -l`) 并在后台运行，然后立即执行下一个命令。运行中进程的实例称为进程，shell 输出的数字称为进程
    ID (PID)，此 PID 可用于引用特定的运行进程。


    ## 与进程相关的 Linux 命令


    **注意**：你只能杀死由你自己创建的进程。管理员几乎可以杀死 95-98% 的进程。但某些进程无法被杀死，例如 VDU 进程。


    ## 标准输出/输入重定向或输入-输出重定向


    大多数命令都在屏幕上给出输出或从键盘获取输入，但在 Linux 中，可以将输出发送到文件或从文件中读取输入。例如，`ls` 命令给出输出到屏幕；要将 `ls`
    命令的输出发送到文件，使用 `$ ls > filename`。这意味着将 `ls` 命令的输出放入文件名。有三个重定向符号 `>>`、`>`。


    ### (1) `>` 重定向符号


    **语法：Linux-command > filename**


    将 Linux 命令的结果输出到文件。注意，如果文件已存在，它将被覆盖，并创建一个新文件。例如，要发送 `ls` 命令的输出，输入 `$ ls myfiles`，如果
    ''myfiles'' 文件存在于当前目录中，它将被覆盖且不会有任何类型的警告。（如果我想把输出发送到一个已经存在的文件，并想保留文件信息而不丢失之前的信息/数据怎么办？请阅读下一个重定向符号）


    ### (2) `>>` 重定向符号，Linux-command >> filename


    将 Linux 命令的结果输出到文件的**末尾**。注意，如果文件已存在，它将被打开并将新的输入信息/数据写入文件末尾，而不会丢失之前的信息/数据。如果文件不存在，则会创建一个新文件。例如，要将
    `date` 命令的输出发送到已存在的文件，输入 `$ date >> myfiles`。


    ### (3) `<` 重定向符号，Linux-command < filename


    从文件而不是键盘为 Linux 命令获取输入。例如，要为 `cat` 命令获取输入，输入 `$ cat < myfiles`。


    ## 管道 (Pipes)


    管道是一种将一个程序的输出连接到另一个程序的输入的方法，而不需要任何临时文件。


    ![](img/5f999ede08d312e9102fbb391afddbb7_8_0.png)


    ## Linux Shell 教程


    管道本质上是一个临时存储位置，一个命令的输出存储其中，然后作为第二个命令的输入。管道用于运行多个命令（来自同一行的多个命令）。


    语法：`command1 | command2`


    | 使用管道的命令 | 管道的意义或用途 |

    |--- |--- |

    | $ ls | more | 在这里 `ls` 命令的输出作为 `more` 命令的输入，以便一次打印一整屏的内容。 |

    | $ who | sort | 在这里 `who` 命令的输出作为 `sort` 命令的输入，以便它打印排序后的用户列表。 |

    | $ who | wc -l | 在这里 `who` 命令的输出作为 `wc` 命令的输入，以便它可以打印登录系统的用户数量。 |

    | $ ls | wc -l | 在这里 `ls` 命令的输出作为 `wc` 命令的输入，以便它可以打印当前目录下的文件数量。 |

    | $ who | grep raju | 在这里 `who` 命令的输出作为 `grep` 命令的输入，如果该用户已登录，则会打印特定的用户名，否则不打印（用于查看特定用户是否登录）。
    |


    ## 过滤器 (Filter)


    如果一个 Linux 命令从标准输入接受输入并在标准输出上产生输出，则被称为过滤器。过滤器对输入进行某种处理并给出输出。例如，假设我们有一个 100 行的文件
    `hotel.txt`，我们想从 `hotel.txt` 的第 20 行打印到第 30 行并将结果存储到名为 `hlist` 的文件中。


    ```

    $ tail +20 < hotel.txt | head -n30 > hlist

    ```


    ## Shell 编程简介


    Shell 程序是一系列 Linux 命令。Shell 脚本就像 MS-DOS 中的批处理文件，但比 MS-DOS 批处理文件更强大。Shell 脚本用于创建自己的命令，以节省时间并自动化某些任务。


    ## Linux 中的变量


    - **系统变量**：由 Linux 自身创建并维护。变量类型使用大写字母定义。

    - **用户自定义变量 (UDV)**：由用户创建并维护。变量类型使用小写字母定义。


    ## 一些系统变量


    你可以通过输入如 `set` 等命令查看系统变量。一些重要的系统变量有：


    | 系统变量 | 意义 |

    | --- | --- |

    | BASH=/bin/bash | 我们的 shell 名称 |

    | BASH_VERSION=4.1.7 | 我们的 shell 版本 |

    | COLUMNS=80 | 屏幕的列数 |

    | HOME=/home/vivek | 我们的主目录 |

    | LINES=25 | 屏幕的行数 |

    | LOGNAME=students | 我们的登录名 |

    | OSTYPE=Linux | 我们的类型 |

    | PATH=/usr/bin:/bin | 我们的路径 |

    | PS1=\$u@\h:\$ | 我们的提示符 |

    | PWD=/home/students | 我们当前的工作目录 |

    | SHELL=/bin/bash | 我们的 shell 名称 |

    | USERNAME=vivek | 当前登录到此处的的用户 |


    **注意**：上述某些内容在你的 PC 上可能有所不同。你可以打印上述任何一个内容：

    `echo $USERNAME`

    `echo $HOME`


    警告：不要修改系统变量，这有时会导致问题。


    ## 如何定义用户自定义变量 (UDV)


    定义 UDV 使用以下语法

    **语法：**`variename=value`

    注意：这里 ''value'' 被赋值给 ''variename''，且 Value 必须在 `=` 的右侧。例如：


    ```

    $ no=10 # 这是正确的

    $ 10=no # 错误，Value 必须在 = 的右侧

    ```


    要定义值为 ''Bus'' 的变量 ''vech''


    ```

    $ vech=Bus

    ```


    要定义值为 10 的变量 ''n''


    ```

    $ n=10

    ```


    ## 变量命名规则（UDV 和系统变量）


    (1) 变量名必须以字母数字或下划线 (_) 开头，后跟一个或多个字母数字。例如。有效的 shell 变量如下：


    ```

    HOME

    SYSTEM_VERSION

    vech

    no

    ```


    (2) 给变量赋值时，不要在等号两侧留空格。例如。以下变量声明没有错误：


    ```

    $ no=10

    ```

    但以下情况会有问题：

    ```

    $ no =10

    $ no= 10

    $ no =10

    ```


    (3) 变量大小写敏感，就像 Linux 文件名一样。例如。


    ```

    $ no=10

    $ No=11

    $ NO=20

    $ no=2

    ```

    以上都是不同的变量名，因此为了打印 20，我们需要使用 `$ echo $NO`而不是以下任何一个：


    ```

    $ echo $no  # 将打印 10 而不是 20

    $ echo $No  # 将打印 11 而不是 20

    $ echo $nO # 将打印 2 而不是 20

    ```


    (4) 你可以定义空变量（空变量是在定义时没有值的变量）。例如。


    ```

    $ vech=

    $ vech=""

    ```

    尝试打印它的值 `$ echo $vech`，这里将不显示内容，因为变量没有值，即空变量。


    (5) 不要使用 `?`、`.*` 等符号来命名你的变量。


    ## 如何打印或访问 UDV（用户自定义变量）的值


    打印或访问 UDV 使用以下语法


    语法：`$varilename`


    例如。打印变量 ''vech'' 的内容


    ```

    $ echo $vech

    ```


    它将打印 ''Bus''（如果之前定义为 `vech=Bus`）。打印变量 ''n'' 的内容 `$ echo $n`

    它将打印 ''10''（如果之前定义为 `n=10`）。


    警告：不要尝试 `$ echo vech`（这会打印字符串 ''vech''）和 `echo $n`（这会打印 n 而不是 ''10''），你必须使用 `$
    echo` 加上变量名。


    问题 1：如何定义值为 10 的 x 并在屏幕上打印它


    ```

    $ x=10

    $ echo $x

    ```'
