    \n```bash\n$LOGNAME ! Life never be the same, until you log again\"\n{\n  echo\
    \ \"Press a key to logout. .\"\n  read\n  return\n}\n```\n\nTo run function SayBuy,\
    \ this way SayBuy() is available to only in your login and not to all user, Use\
    \ .bashrc in file directory to add User specific aliases and functions only. Tip:\
