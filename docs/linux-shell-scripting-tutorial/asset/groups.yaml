    \ $) then new shell ignored all old's variable. For e.g. Consider following example\n\
    \n```\n$ vech=Bus\necho $vech\nBus\n$ /bin/bash\n$ echo $vech\n\nNOTE:-Empty line\
    \ printed\n$ vech=Car\necho $vech\nCar\n$ exit\n$ echo $vech\nBus\n```\n\n| Command\
    \ | Meaning |\n|---|---|\n| $ vech=Bus | Create new local variable 'vech' with\
    \ Bus as value in first shell |\n| echo $vech | Print the contents of vech |\n\
    | $/bin/bash | Now load second shell in memory (Which ignores all old shell's\
    \ variable) |\n| echo $vech | Print the contents of vech |\n| $ vech=Car | Create\
    \ new local variable 'vech' with Car as value in second shell |\n| echo $vech\
    \ | Print the contents of vech |\n| $ exit | Exit from second shell return to\
    \ first shell |\n| echo $vech | Print the contents of vech (Now you can see first\
    \ shell variables and its value) |\n\nWe can copy old shell's variable to new\
    \ shell (i.e. first shells variable to second shells), which variable is known\
    \ as Global Shell variable. To do this use export command\n*Syntax: export variable1,variable2,...,variableN*\n\
    For e.g. \n\n```\n$ vech=Bus\necho $vech\nBus\n$ export vech\necho $vech\n$ /bin/bash\n\
    Bus\n$ exit\n$ echo $vech\n```"
