    First we have created the file nos, then we have taken input from this file and
    sort command prints numbers. This is called input redirection. In Linux (and in
    C programming Language) your keyboard, screen etc are treated as files. Following
    are name of such files


    | Standard File | File Descriptors number | Use | Example |

    | --- | --- | --- | --- |

    | stdin | 0 | as Standard input | Keyboard |

    | stdout | 1 | as Standard output | Screen |

    | stderr | 2 | as Standard error | Screen |


    By default in every program has three files associated with (it, when we start
    our program these files are automatically opened by shell). The use of first two
    (i.e. stdin and stdout), are already seen by you. The last stderr (numbered as
    2) is used by our program to print output on screen. You can redirect the output
    from a file descriptor directly to file with following


    Syntax: file-descriptor>filename


    For e.g.

    $ rm bad_file_name11: rm: cannot remove ''bad_file_name11'': No file or directory
    ,is the output (error) of the above program. If we try to redirect this error-output
    to file, it can not be sent to file

    $ rm bad_file_name11 > er


    Still it prints output on stderr as rm: cannot remove ''bad_file_name11'': No
    file or directory, And if you see it as $ er , this file is empty, out is send
    to error device and you cannot redirect it to copy this error-output to your file
    ''er''. To overcome we by using command

    $ rm bad_file_name11> er


    Note that no space are allowed between 2 and >, The 2>er the standard error output
    to file. 2 number is default of stderr. Consider another example, where we are
