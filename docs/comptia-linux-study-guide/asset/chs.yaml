- "# CompTIA Linux+ 学习指南\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 致谢\n\n首先，所有的荣耀和赞美归归上帝，祂通过他的儿子耶稣基督使一切成为可能，并赐予我们永生的生命。\n\
  \n感谢我之前几本书的合著者 Christine Bresnahan，感谢她无尽的 Linux 知识以及对编写一本好书的投入。本版本建立在她之前的辛苦工作的基础上。非常感谢\
  \ Sybex 优秀的团队成员，他们为本项目付出的卓越工作。感谢高级征购编辑 Kenyon Brown，他为我提供了编写这本书的机会。感谢执行编辑 Christine\
  \ O’Connor 和项目经理 Karen Weller，她们让项目按计划进行并使书籍更加美观。技术校对 Dan Wilson 非常认真地核实了书中的所有工作，并对改进内容提出了建议。还要感谢年轻且有才华的\
  \ Daniel Anez（`theanez.com`）提供的插图工作。我还要感谢 Waterside Productions, Inc. 的 Carole Jelen，她为我安排了这次机会，并在我的写作生涯中给予了帮助。\n\
  \n我特别感谢我的妻子 Barbara，感谢她在项目期间忍受我的脾气，并用烘焙点点我的士气。\n\n# 作者简介\n\n\n\n\n\nRichard Blum\
  \ 拥有 CompTIA Linux+ ce 和 CompTIA Security+ ce 认证，在 IT 行业工作了超过 35 年，曾担任系统和网络管理员，并出版了许多关于\
  \ Linux 和开源的书籍。Rich 是 Linux 和编程课程的在线讲师，这些课程被美国各地的学院和大学使用。在不是作为一个电脑极客时，Rich 喜欢与他的妻子\
  \ Barbara 以及两个女儿 Katie 和 Jessica 一起度过。\n\n# 关于技术编辑\n\nDaniel Wilson 担任 IT 专业人士已超过\
  \ 38 年。他的背景涵盖软件开发、`NIX Engineer` 和 `Oracle DBA`、咨询、安全领域，并担任过几本关于 Unix（Linux、Solaris\
  \ 和 HP-UX）以及 Oracle 数据库书籍的作者/合著者。他目前担任云信息系统安全官 (ISSO)。\n\n# 练习目录\n\n| 练习 5.1 | 使用救援模式\
  \ |\n| 练习 7.1 | 确定网络环境 |\n| 练习 8.1 | 检查你的显示服务器 |\n| 练习 9.1 | 实验时间 |\n| 练习 11.1 |\
  \ 实验文件系统 |\n| 练习 13.1 | 处理软件包 |\n| 练习 15.1 | 创建共享目录 |\n| 练习 17.1 | 创建日志或日志条目 |\n\
  | 练习 19.1 | 创建加密磁盘 |\n| 练习 21.1 | 管理运行进程 |\n| 练习 23.1 | 向 Linux 系统添加 USB 存储设备 |\n\
  | 练习 24.1 | 排除应用程序权限问题 |\n| 练习 25.1 | 编写 Bash 脚本查看系统用户密码信息 |\n| 练习 27.1 | 从命令行操作作业\
  \ |\n| 练习 29.1 | 处理容器 |\n\n# 引言\n\nLinux 已经成为服务器环境中增长最快的操作系统之一。大多数公司在他们的基础设施中使用某种类型的\
  \ Linux 系统，而且 Linux 是云计算和人工智能计算领域的主要参与者。所有主要的云供应商都使用某种类型的 Linux 发行版。构建和管理 Linux\
  \ 系统是许多公司现在正在寻找的技能。你对 Linux 了解越多，在当今的计算机行业就越有竞争力。这本书的目的是为你提供在 Linux 世界中成功所需的知识和技能。\n\
  \n## 什么是 Linux+？\n\nCompTIA Linux+ 考试已成为计算机行业展示 Linux 操作系统技能的基准。获得 CompTIA Linux+\
  \ 认证意味着你熟练在 Linux 环境中工作，并具备安装和维护 Linux 系统所需的技能。\n\n此前，CompTIA 曾与 Linux Professional\
  \ Institute (LPI) 合作推出 Linux+ 认证考试。然而，随着 2019 年考试 `XK0-004` 的发布，CompTIA 开始创建自己的考试，并随着更新的\
  \ `XK0-006` 考试继续了这一做法。更新后的 Linux+ 认证仍然是一次考试，涵盖了操作 Linux 系统的实操部分。更新后的 Linux+ 考试关注\
  \ Linux 的五个领域：\n\n*   系统管理\n*   服务和用户管理\n*   安全\n*   自动化、编排和脚本\n*   故障排除\n\n`XK0-006`\
  \ 考试使用基于性能的多单选择和多选题来识别能够胜任 Linux 系统管理员工作的员工。考试涵盖了与所有主要 Linux 发行版相关的任务，而不侧重于任何特定的发行版。考试由\
  \ 90 道题组成，你有 90 分钟完成。\n\n## 为什么要获得 Linux 认证？\n\n随着 Linux 的日益流行（以及 Linux 相关工作的增加），炒作也随之而来。围绕\
  \ Linux 的炒作让雇主很难区分胜任的 Linux 管理员和那些只知道术语的人。这就是 Linux+ 认证大显用场的地方。通过 Linux+ 认证，你将证明自己是一个熟悉\
  \ Linux 平台并能够安装、维护和排除任何类型 Linux 系统错误的 Linux 管理员。通过将考试改为更具性能性，CompTIA 已将新的 Linux+\
  \ 考试确认为让雇主有信的方式，即通过考试的员工具备完成工作所需的技能。\n\n## 如何获得认证\n\n任何通过 `XK0-006` 考试的人都可以获得 Linux+\
  \ 认证。参加考试没有先决条件，但 CompTIA 建议拥有 `A+` 和 `Network+` 认证或同等的经验，并至少有 12 个月的 Linux 管理员实操经验。\n\
  \n考试由 Pearson VUE 管理。可以在任何 Pearson VUE 测试中心参加考试。注册考试请拨打 Pearson VUE 电话 `877-619-2096`\
  \ 或访问 `http://home.pearsonvue.com/comptia` 在线。考试后，你将立即获得分数。如果你通过了，你将收到一份证书，上面显示你的\
  \ Linux 凭证以及雇主可以用来验证你凭证的验证码。\n\n## 谁应该买这本书\n\n虽然任何想要通过 Linux+ 认证考试的人都能从中受益，但这并不是购买它的唯一理由。这本书涵盖了\
  \ Linux 世界新手开始 Linux 之旅所需的所有材料。\n\n本书的编写假设你对基础计算机和网络原理已经熟悉。虽然不需要 Linux 经验即可从书中受益，但如果你熟悉\
  \ Windows 或 macOS 世界的电脑操作（例如如何使用键盘、使用光盘和处理 USB 闪存盘），那将非常有帮助。\n\n此外，如果有一个可用的 Linux\
  \ 系统进行跟练习将很有帮助。许多章节包含一个简单的练习，将引导你学习该章节介绍的基本概念。这提供了你所需的关键实操经验，既为了通过考试，也为了在 Linux\
  \ 世界中表现优异。\n\n# 本书的结构\n\n本书由 31 章节组成，围绕 Linux+ 考试的不同目标领域组织：\n\n*   第 1 章 “准备你的环境”，可以帮助你查找并安装一个\
  \ Linux 发行版，用于实验 Linux 并完成书中的练习。\n*   第 2 章 “服务介绍”，向你介绍 Linux 中常见的不同的服务器应用程序和用途。\n\
  *   第 3 章 “管理文件、目录和文本”，涵盖了从命令行处理文件和目录的基础 Linux 命令。\n*   第 4 章 “搜索和分析文本”，讨论了 Linux\
  \ 提供的处理文本文件的不同工具。\n\n\n\n\n\n* 第 5 章，“解释启动过程”将带你进入 Linux 操作系统启动的内部流程，向你展示如何自定义 Linux\
  \ 启动过程。\n* 第 6 章，“维护系统启动和服务”将通过讨论用于控制程序启动的两种不同方法，带你了解 Linux 系统如何在启动时启动应用程序。\n* 第\
  \ 7 章，“配置网络连接”将展示如何让你的 Linux 系统在局域网上工作，并介绍用于帮助排查 Linux 系统网络问题的各种工具。\n* 第 8 章，“比较\
  \ GUI”将讨论 Linux 中可用的不同图形桌面环境。\n* 第 9 章，“调整本地化选项”将展示如何更改 Linux 系统的字符集和日期/时间格式，以适应不同国家使用的格式。\n\
  * 第 10 章，“管理用户和组”将探索 Linux 如何处理用户账户，以及你如何将用户分配到组以管理对文件和目录的访问。\n* 第 11 章，“处理存储”将检查\
  \ Linux 系统中可用的不同存储方法和格式。\n* 第 12 章，“保护文件”将深入探讨数据备份、存档和恢复的世界。\n* 第 13 章，“软件管理”将解释\
  \ Linux 如何管理软件应用程序，以及如何在各种 Linux 发行版类型上安装软件包。\n* 第 14 章，“维护内核模块”将讨论 Linux 如何使用内核模块支持硬件，以及你如何管理\
  \ Linux 系统上的内核模块。\n* 第 15 章，“应用所有权和权限”将探索 Linux 系统上保护文件和目录的多种方法。它讨论了标准的 Linux 风格权限，以及用于为\
  \ Linux 系统提供更高级安全性的高级 `SELinux` 和 `AppArmor` 应用。\n* 第 16 章，“查看访问和身份验证方法”将探索 Linux\
  \ 在本地和网络环境中用于验证用户账户的各种方法。\n* 第 17 章，“实现日志服务”将展示 Linux 如何记录系统事件，以及你如何使用 Linux 系统日志来排查\
  \ Linux 系统中的问题。\n* 第 18 章，“监控 Linux 防火墙”将带你了解如何在网络环境中保护你的 Linux 系统。\n* 第 19 章，“采用最佳安全实践”将讨论你可以实施的使\
  \ Linux 环境更安全的各种常用方法。\n* 第 20 章，“分析系统属性和修复”将探索你拥有的排查不同类型 Linux 问题的方法。这包括网络问题、存储问题和操作系统问题。\n\
  * 第 21 章，“优化性能”将讨论 Linux 如何处理运行中的应用程序，以及你拥有的控制这些应用程序行为的工具。\n* 第 22 章，“调查用户问题”将探索如何排查和修复常见的用户相关问题，例如无法访问系统上的特定文件或目录。\n\
  * 第 23 章，“处理 Linux 设备”将带你了解 Linux 支持的不同类型的硬件设备，以及让它们在你的 Linux 系统上正常工作的最佳方法。\n* 第\
  \ 24 章，“排查应用程序和硬件问题”将侧重于解决 Linux 系统上可能存储、应用程序和网络问题的排查方法。\n* 第 25 章，“部署 Bash 脚本”将讨论如何使用\
  \ `Bash` 自动化任务。\n* 第 26 章，“Python 概念”将涉及适用于系统管理员的 `Python` 应用。\n* 第 27 章，“自动化作业”将跟进脚本部分，展示如何在一天中、某月或某一年的特定时间调度它们。\n\
  * 第 28 章，“使用 Git 控制版本”将探索版本控制的世界，并演示如何使用 `Git` 管理应用程序。\n* 第 29 章，“理解云和虚拟化”将带你了解云的基础知识以及如何使用\
  \ Linux 创建环境。\n* 第 30 章，“检查云和虚拟化服务”将演示如何在 Linux 中实现云计算计算。\n* 第 31 章，“编排环境”将讨论你如何使用容器和编排引擎来部署应用程序。\n\
  \n## 书中包含的内容\n\n我在书中包含了几种学习工具：\n\n*   **评估测试 (Assessment Test)**：在本介绍的末尾有一个评估测试，你可以通过它检查自己的\
  \ Linux 技能水平。在开始阅读本书之前进行测试；它将帮助你确定需要额外帮助的领域。问题的答案会出现在最后一个问题之后的独立页面上。\n*   **目标地图和章节目标列表**：目标地图向你展示了每个考试目标在书中覆盖的情况。此外，每个章节的开头都有一个注释，说明它涵盖了哪些目标。利用这些可以查看每个考试主题的具体覆盖位置。\n\
  *   **考试要点 (Exam Essentials)**：在每个章节的最后，总结之后列出了该章节涵盖的考试要点。这些是你准备考试时应该从章节中掌握的关键主题。\n\
  *   **章节复习题 (Chapter Review Questions)**：为了在阅读过程中测试你的知识，每个章节末尾都有复习题。在你完成每个章节后，回答复习题，然后与\
  \ 附录 A 中提供的答案进行比对。你可以回去重新阅读详细说明你错过的主题的任何章节。\n\n## 交互式在线学习环境和题库\n\n随书提供的交互式在线学习环境提供了一个带有学习工具的题库，帮助你准备认证考试并增加第一次通过的概率。该题库包括：\n\
  \n\n\n\n\n*   **样本测试：** 本书中提供了所有问题，包括您可以在本介绍末尾找到的评估测试，以及包含每章末尾复习题在内的章节测试。此外，还了一份模拟考试。使用这些问题来测试你对学习指南材料的掌握情况。在线题库可在多个设备上运行。\n\
  *   **闪卡：** 题目以数字闪卡格式提供（一个问题后跟一个单一正确答案）。你可以使用这些闪卡来强化学习，并在考试前进行最后的测试准备。\n*   **其他学习工具：**\
  \ 本书中关键术语的词表及其定义以可完全搜索的 PDF 格式提供。\n\n## 本书使用的规范\n\n本书使用了某些排版样式，帮助帮你快速识别重要信息，并避免对屏幕提示等词汇的含义产生混义。特别是，请注意以下样式：\n\
  \n*   *斜体文本*表示在章节中首次详细描述的关键术语。（斜体也用于强调。）\n\n*   `等宽字体`表示配置文件的内容、文本模式 Linux Shell\
  \ 提示符中显示的消息、文件名、文本模式命令名以及 Internet URL。\n\n*   `*斜体* ` `等宽` `*文本*` 表示变量，或不同系统或运行命令之间不同的信息，例如文件名或进程\
  \ ID 数字。\n\n*   **粗体等宽文本**是你需要输入到计算机的信息，通常在 Linux Shell 提示符下。此文本也可以用斜体表示，指示你应该为你的系统替换适当的值。（当命令单独成行出现时，命令前会有非粗体的等宽字体\
  \ `$` 或 `#` 命令提示符，分别表示普通用户或系统管理员用户。）\n\n除了这些可以应用于单个单词或整个段落的文本规范外，还有一些规范用于突出显示文本段落，如下例所示：\n\
  \n# 考试目标\n\n考试目标（Exam objectives）定义了你可以预期在 CompTIA Linux+ 考试中找到的主题。考试开发者确定这些主题对于成为胜任的\
  \ Linux 管理员所需的技能是相关的，并根据你展示这些主题方面知识的能力来设计考试题。官方的 CompTIA Linux+ XK0-006 考试主题列在此处，并列出了可以在书中找到对应内容的参考位置。\n\
  \n## 1.0 系统管理\n\n### 1.1 解释基础 Linux 概念。(第 1 章, 第 5 章, 第 8 章 以及 第 11 章)\n\n*   基础启动过程\n\
  *   文件系统层次结构标准 (FHS)\n*   服务器架构\n*   发行版\n*   图形用户界面 (GUI)\n*   软件许可\n\n### 1.2\
  \ 总结 Linux 设备管理概念和工具。(第 5 章, 第 14 章 和 第 23 章)\n\n*   内核模块\n*   设备管理\n*   initrd\
  \ 管理\n*   自定义硬件\n\n### 1.3 在给定场景下，管理 Linux 系统中的存储。(第 11 章 和 第 22 章)\n\n*   逻辑卷管理器\
  \ (LVM)\n*   卷组\n*   物理卷\n*   分区\n*   文件系统\n*   实用程序\n*   独立磁盘冗余阵 (RAID)\n*   已挂载存储\n\
  *   节点 (Inodes)\n\n### 1.4 在给定场景下，管理 Linux 服务器上的网络服务和配置。(第 7 章)\n\n*   网络配置\n* \
  \  NetworkManager\n*   Netplan\n*   常用网络工具\n\n### 1.5 在给定场景下，使用常用的 Shell 操作管理 Linux\
  \ 系统。(第 4 章)\n\n*   常用环境变量\n*   路径 (Paths)\n*   相对路径\n*   Shell 环境配置\n*   通道重定向\n\
  *   基础 Shell 实用程序\n*   文本编辑器\n\n### 1.6 在给定场景下，为 Linux 服务器执行备份和恢复操作。(第 12 章)\n\n\
  *   归档\n*   压缩工具\n*   其他工具\n\n### 1.7 总结 Linux 系统上的虚拟化。(第 29 章 和 第 30 章)\n\n*  \
  \ Linux 虚拟机管理程序\n*   虚拟机 (VMs)\n*   虚拟机操作\n*   裸机 vs 虚拟机\n*   网络类型\n*   虚拟机工具\n\n\
  ## 2.0 服务与用户管理\n\n### 2.1 在给定场景下，管理 Linux 系统上的文件和目录。(第 3 章 和 第 22 章)\n\n*   实用程序\n\
  *   链接\n*   `/dev` 中的设备类型\n\n### 2.2 在给定场景下，在 Linux 环境中进行本地账户管理。(第 10 章 和 第 22 章)\n\
  \n*   添加\n*   删除\n*   修改\n*   锁定\n*   过期\n*   列出\n*   用户配置文件模板\n*   账户文件\n*   属性\n\
  *   用户账户 vs 系统账户 vs 服务账户\n\n### 2.3 在给定场景下，在 Linux 环境中管理进程和作业。(第 21 章 和 第 27 章)\n\
  \n*   进程验证\n*   进程 ID (PID)\n*   进程状态\n*   优先级\n*   进程限制\n*   作业和进程管理\n*   调度\n\n\
  ### 2.4 在给定场景下，在 Linux 环境中配置和管理软件。(第 2 章, 第 9 章, 第 13 章, 第 24 章 以及 第 26 章)\n\n*\
  \   安装、更新和卸载\n*   软件库管理\n*   软件库排除\n*   更新选项 (Update alternatives)\n*   软件配置\n*\
