  \ A 和 C 是错误答案。KVM 是一个虚拟机管理程序，而不是云端虚拟化服务，所以选项 B 是错误答案。GitHub 是用于版本控制的云端远程仓库，因此选项\
  \ D 是错误选择。\n\n## 48\nC. 软件定义网络 (SDN) 是一种通过软件控制和管理网络通信的方法，由一个控制器程序以及两个 API 组成。因此，选项\
  \ C 是正确答案。厚配置和精简配置指的是虚拟存储配置，而不是网络方法，所以选项 A 和 B 是错误答案。网络地址转换 (NAT) 是一种虚拟网络适配器配置，其工作方式类似于网络中的\
  \ NAT 路由器。因此，选项 D 是错误答案。VLAN 是虚拟（逻辑）LAN 配置，因此选项 E 也是错误选择。\n\n## 49\nB, D. 只有 Kubernetes\
  \ 和 Swarm 是编排系统。因此，选项 B 和 D 是正确答案。Mesos 需要 Marathon 来实现编排引擎，所以选项 A 是错误答案。Splunk\
  \ 可以作为编排环境中的监控工具，但它不是编排系统，所以选项 D 也是错误选择。Amazon Web Services (AWS) 是云端虚拟化服务，你可以在上面使用编排工具，但它不是编排引擎。因此，选项\
  \ E 也是错误选择。\n\n\n\n\n\n50. `A`, `B`, `D`, `E`。选项 A、`B`、`D` 和 E 中列出的概念都用于容器编排。虽然\
  \ DevOps 受益容器编排并经常使用它，但它并不是用于容器编排内部。因此，选项 C 是错误的。\n\n51. `D`。软件即服务 (`SaaS`) 云服务类型提供完整的应用程序，允许任何人连接到你的应用程序，因此选项\
  \ D 是正确的。平台即服务 (`PaaS`) 云服务类型不包含应用程序；你必须自己提供，因此选项 A 是错误的。私有云、公有和混合云都是实现云服务的方法，而不是云服务类型，因此选项\
  \ B、C 和 E 都是错误的。\n\n52. `C`。`Oracle VirtualBox` 虚拟机程序安装在宿主机操作系统之上，使其成为 II 型虚拟机监控程序，因此选项\
  \ C 是正确的。`PaaS` 和 `SaaS` 是云服务的类型，而不是虚拟机监控程序，因此选项 A 和 B 是错误的。私有云服务是在内部网络中实现云服务的方法，而不是虚拟机监控程序的类型，因此选项\
  \ E 是错误的。\n\n53. `C`。`/etc/securetty` 文件提供了用户无法使用 root 用户账户登录的位置列表，因此选项 C 是正确的。`/etc/cron.deny`\
  \ 文件防止用户调度作业，而不是防止以 root 用户账户登录，因此选项 A 是错误的。`/etc/hosts.deny` 文件阻止来自远程网络主机的访问；它不会阻止来自本地终端或控制台的\
  \ root 访问，因此选项 B 是错误的。`/etc/login.warn` 和 `/etc/motd` 文件包含登录时显示的消息；它们不会阻止用户以 root\
  \ 用户账户登录，因此选项 D 和 E 是错误的。\n\n54. `C`。`auditd` 程序监控系统活动，包括用户文件和目录访问，并根据你创建的规则记录事件。因此，选项\
  \ C 是正确的。`chroot` 工具将应用程序限制在虚拟文件系统中的特定位置，但不记录用户文件和目录访问，因此选项 A 是错误的。`LUKS` 系统加密磁盘分区，但不记录用户文件和目录访问，因此选项\
  \ B 是错误的。`klist` 和 `kinit` 程序用于 Kerberos 用户身份验证，而不是记录用户文件和目录访问，因此选项 D 和 E 都是错误的。\n\
  \n55. `D`。`cd -` 命令将你的进程返回到虚拟目录系统中的上目录，因此选项 D 是正确答案。`cd` 和 `cd ~` 命令都将你的进程返回到主目录，而并不一定是上一个目录。因此，选项\
  \ A 和 C 是错误的答案。`exit` 命令导致你的进程退出当前 shell，而不是返回到上目录，因此选项 B 也是错误的答案。`return` 命令用于\
  \ Bash shell 脚本，用于从函数返回或从源脚本中返回。因此，选项 E 也是一个错误的选择。\n\n56. `B`。配合 `cp` 命令使用的 `-R`\
  \ 选项允许你复制目录的内容。你也可以使用 `-r` 或 `--recursive` 选项来实现相同的结果。因此，选项 B 是正确答案。`-i` 选项会在覆盖现有目录之前询问，但不会进行递归复制，因此选项\
  \ A 是错误的答案。`-v` 选项将为复制提供详细信息，这很有帮助，但不允许递归复制发生。因此，选项 C 也是错误的答案。`-u` 选项的方便之处在于，它只在被复制的文件较新时才允许\
  \ `cp` 命令覆盖同名的现有文件。然而，它不用于递归复制，因此选项 D 也是错误的答案。`-f` 选项强制执行复制并覆盖任何同名的现有文件，但不强制递归复制。因此，选项\
  \ E 是一个错误的选择。\n\n# 第一部分\n\n## 准备你的工具\n\n## 第 1 章\n\n## 准备你的环境\n\n![](img/chaptersquare.png)\n\
  \n在开始通过 CompTIA Linux+ 认证考试之旅之前，你需要一个学习空间。学习空间由 Linux 系统（虚拟或物理）组成，你可以在其中积极地尝试、练习和探索各种\
  \ Linux 命令和实用程序。除了阅读这本书，拥有一个可以自由工作的私人空间将有助于你的成功。\n\n你可能已经在企业环境中有了使用 Linux 的经验。但是，你很可能只使用一种\
  \ Linux 发行版。为了通过 Linux+ 认证考试，需要使用多个一个发行版进行训练。\n\n此外，你的雇主可能对其系统上的任何风险行为反感。你需要自由地尝试可能导致系统崩溃的\
  \ Linux 命令。你自己的学习空间，包含了各种 Linux 发行版及其各种工具，是成功通过 Linux+ 考试的关键因素。\n\n本章从查看有关学习空间环境设置的几个项目开始。首先是对组成\
  \ Linux 的部分的快速解释。接下来，本章讨论了如何在你的学习空间中运行 Linux。随后是对你学习空间中各种 Linux 发行版的深度探讨。在章节结束处，我将介绍一种访问\
  \ Linux 命令行的方法。\n\n## 探索 Linux\n\n在深入研究如何设置 Linux 学习环境之前，本节将探索构成 Linux 系统的究竟是什么。\n\
  \n## 什么是 Linux？\n\n如果你以前从未工作过 Linux，你可能会困惑为什么会有这么多不同的版本。在查看 Linux 软件包时，你可能听过 `kernel`（内核）、`distribution`（发行版）和\
  \ `GNU` 等术语，并可能感到困惑。\n\n尽管人们通常将 Linux 操作系统称为“Linux”，但实际上，四个部分组成了一个完整的 Linux 系统：\n\
  \n*   **Linux 内核**在计算机系统的软件和计算机硬件之间建立接口，管理 CPU 使用、内存和设备。\n*   **GNU 实用程序**提供了用于管理文件和程序的命令行程序，由“GNU\
  \ (GNU's Not Unix)”项目创建。\n*   **用户界面**提供了一种与操作系统通信的方法，通常是使用图形化桌面或命令行。\n*   **应用程序软件**为各种活动提供桌面和服务器程序，例如编辑文档和提供网页服务。\n\
  \n虽然每个部分本身并不非常有用，但组合在一起，它们共同创建了人们所说的“Linux”。Linux 发行版将这些每个部分打包在一起，以满足特定社区（如开发者、艺术家或爱好者）的具体需求。\n\
  \n### Linux 运行在什么上？\n\n由于 Linux 内核直接与 CPU 运行，因此每个内核版本必须针对特定的 CPU 环境进行编译。然而，现在有许多\
  \ Linux 可以运行的不同类型的计算机系统，从小型树莓派设备到大型 IBM 主机计算机。当你下载 Linux 发行版时，必须下载适用于你计算机系统所使用的\
  \ CPU 类型构建的版本。\n\nLinux 内核已编译运行在几个不同的平台上，但 Linux+ 考试中强调的有：\n\n*   **Intel/AMD x86\
  \ 和 x86_64：** 用于大多数桌面和笔记本电脑的 Intel 32 位和 64 位 CPU。\n*   **AMD64：** Advanced Micro\
  \ Devices (AMD) 64 位 CPU。\n*   **ARM (aarch64)：** 由 Arm Ltd. Corporation 开发的 Advanced\
  \ RISC Machines CPU。这些 CPU 用于如树莓派等小规模系统。\n*   **IBM Z (s390x)：** IBM 系列的主机和微机。\n\
  *   **RISC-V：** 简化指令集计算第 5 版本开放标准架构，任何 CPU 制造商可以使用。\n\n这是一个广泛的 CPU 范围，涵盖了许多不同类型的计算机平台。很可能有一个为你的学习环境创建的\
  \ Linux 发行版。\n\n\n\n\n\n# 关于许可协议\n\n对于大多数软件包，你必须同意一份最终用户许可协议 (EULA)，该协议规定了你可以如何使用该软件。大多数商业软件是在`proprietary\
  \ license`（专有许可）下发布的，这限制了你对软件可以做什么和不能做什么，通常禁止你对软件本身进行任何修改。\n\nLinux 是基于`open source`许可模型发布的。开源模型允许你获取创建软件时使用的实际程序源代码。然而，存在不同的开源许可模型，取决于你被允许如何使用源代码。主要有两种许可模型，每种都有不同的子模型：\n\
  \n*   **拷贝权许可（Copyleft Licenses）**：允许你下载和使用软件源代码，但对你如何使用或分发它有限制。你对代码的任何更改都将继承父软件的许可条款。最受欢迎的两种拷贝权模型是：\n\
  \n    *   **GNU 通用公共许可证 (GPL)**：允许你对源代码进行修改，但你必须在 `GPL` 许可下公开发布你的更改。\n    *   **GNU\
  \ 语言通用公共许可证 (LGPL)**：允许你将源代码（甚至只是部分代码）集成到你自己的项目中，而无需向公众发布。\n\n*   **宽松型许可（Permissive\
  \ Licenses）**：允许你下载和使用源代码，但对它的重新分发不设置任何限制。流行的宽松型许可模型包括：\n\n    *   **Apache 许可证**：允许你创建使用不同许可模型的衍生软件。\n\
  \    *   **MIT 许可证**：允许你对源代码进行任何你想做的事，只要在所有衍生作品中包含原始版权声明即可。\n\n虽然 Linux 内核本身是根据\
  \ `GPL` 版本 2 授权的，但并非所有的 Linux 发行版都使用这种许可，因为它们包含了根据其他许可模型授权的第三方软件。\n\n下一节将深入探讨设置一个可以实验\
  \ Linux 的环境所需的配置。\n\n# 搭建学习空间\n\n你的学习空间需要一个可以让你自由探索 Linux 及其各种发行版（简称为 `distros`）和实用工具的环境。虽然有些公司可能为你提供空闲的\
  \ Linux 服务器供你完全使用，但我们中的许多人并不那么幸运。即使你是一个学生，已经有一个设置好并供你使用的实验室环境，你可能想要一个自己的空间，可以在那里不受限制地进行探索。\n\
  \n虽然搭建个人学习空间有很多种方法，但我将只关注少数几种，例如在旧笔记本电脑上安装 Linux、实现虚拟化环境以及使用云端。希望这里的想法能激励你建立一个有帮助的探索和学习环境。\n\
  \n## 使用那台旧笔记本电脑\n\n如果你手有一台空闲或旧的笔记本电脑，将其重新利用作为你的 Linux 学习空间可能非常适合你。如果你喜欢移动你的学习环境，这特别有用，例如，当家里变得有点嘈杂混乱时，移动到家里另一个更安静的地方。旧的台式机也可以，但移动性会较差。\n\
  \n无论你选择哪种系统，你都需要确保它有足够的容量来处理学习空间的最低硬件要求。如果你计划在系统上安装多个 Linux 发行版并单独启动它们，而不使用虚拟化环境，那么表\
  \ 1.1 将作为你的需求指南。\n\n| 资源 | 最小 | 推荐 |\n| --- | --- | --- |\n| 内存 | 2 GB | >= 4 GB\
  \ |\n| 空闲磁盘空间 | 25 GB | >= 30 GB |\n| 处理器 | 2 GHz 双核 | > 2 GHz 双核 |\n\n表 1.1 每次使用单一发行版的硬件要求\n\
  \n虽然你可以使用这个学习空间，但这显然不是理想的。此外，你可以预计这种 Linux 学习环境的启动和运行速度缓慢。只有在你没有其他选择时，才使用这种环境。\n\
  \n## 创建虚拟化环境\n\n为你的 Linux 学习空间创建一个虚拟化环境是理想的。这种设置允许你同时启动多个 Linux 发行版，能够在它们之间快速切换，并提供对比的体验。此外，你可以在这种环境中更深入地探索网络工具。\n\
  \n有几种优秀且免费的虚拟化产品（称为 `hypervisors` 或虚拟机管理器）可以供你安装。它们包括：\n\n*   **Oracle VirtualBox**：这是一个活跃开发的开源软件，可以在\
  \ `www.virtualbox.org` 获取。它可以在 Linux、Windows、macOS 甚至 Solaris 上运行。只要你的硬件有足够的资源，你就可以使用\
  \ VirtualBox 同时运行多个 Linux 发行版。该网站充满了非常有用的文档，并设有社区论坛帮助你创建 Linux 学习空间。\n\n*   **Microsoft\
  \ Hyper-V Server 2019**：这种闭源虚拟化产品适用于许多当前的 Windows 64 位版本，例如 Windows 11 专业版和企业版。然而，Windows\
  \ 11 家庭版不支持它。只要你的硬件有足够的资源，你可以使用 Hyper-V 同时运行多个 Linux 发行版。\n\n*   **QEMU**：Quick\
  \ Emulator (`QEMU`) 包是一个开源模拟器，其不同之处在于它使用动态二进制翻译（将 CPU 指令从一种 CPU 类型翻译为另一种）来模拟计算机\
  \ CPU。这允许你运行为与主机系统完全不同的 CPU 类型编译的操作系统。你可以在 `www.qemu.org` 找到 QEMU。\n\n请不要被这个列表限制。它只包含了一些建议研究的虚拟机管理器。如果你发现了一个更适合你环境的虚拟化产品，请将其用于你的学习空间。\n\
  \n在选择和安装特定的虚拟机管理器之前，请先确定你的笔记本电脑或所选系统是否有足够的容量处理整个学习空间的最低硬件要求。如果你计划同时安装并运行多个发行版，请参考表\
  \ 1.2 作为所需资源的指南。不过，请注意虚拟化产品的网站可能会提供更详细的信息。\n\n| 资源 | 最小 | 推荐 |\n| --- | --- | ---\
  \ |\n| 内存 | 8 GB | >= 8 GB |\n| 空闲磁盘空间 | 70 GB | >= 100 GB |\n| 处理器 | x86_64 2 GHz\
  \ 双核 | x86_64> 2 GHz 双核 |\n\n表 1.2 使用虚拟化产品的硬件要求\n\n使用虚拟化学习空间非常灵活。图 1.1 显示了这种弹性学习空间环境的示例。\n\
  \n![Oracle VirtualBox Manager 界面截图显示了 Ubuntu 20.04 LTS Desktop 虚拟机的细节。](img/c01f001.png)\n\
  \n图 1.1 使用 Oracle VirtualBox 的学习空间\n\n注意图 1.1 所示的学习空间中，Ubuntu 和 Rocky Linux 发行版各有两个安装。这些发行版提供了安装面向服务器的环境或面向图形桌面的环境的能力。通过\
  \ VirtualBox，你可以轻松地安装这两个环境并对它们进行比较！\n\n希望你正开始构思关于如何配置你的私人学习空间的想法。在你在此之前，我还需要探索另一个平台类别。\n\
  \n## 跳转到云端\n\n\n\n\n\n如果你没有拥有足够的资源来提供多个 Linux 发行版学习空间的笔记本或桌面电脑，可以考虑云端。虽然云服务器在大环境中变得越来越流行，但它们也可以提供一种运行单一\
  \ Linux 系统的简单方法。\n\n有许多云服务提供商可以让你那里启动各种 Linux 发行版虚拟机，例如 `Amazon Web Services (AWS)`、`Microsoft\
  \ Azure` 和 `DigitalOcean`。云服务变化迅速，你可能找不到所需的 Linux 发行版版本。然而，花时间查看云服务提供商提供的各种产品是值得的。对于你的学习空间来说，云端可能比新电脑更便宜。\n\
  \n在确定学习空间的位置之前，请考虑各种推荐的 Linux 发行版及其版本。这些是你成功学习环境的额外组成部分。\n\n# 探索 Linux 发行版\n\n`CompTIA\
  \ Linux+`认证是厂商中立的。在实践中，这意味着考试并不侧重于特定的 Linux 发行版。如果你只有 `Red Hat Enterprise Linux\
  \ (RHEL)` 的经验，那么你需要学习更多关于 `Ubuntu` 和 `openSUSE` 发行版的工具和功能，反之亦然。\n\n人们很容易认为 Linux\
  \ 发行版都是大样的，它们之间的区别很少。遗憾的是，这是一个误区。我喜欢将 Linux 内核比作汽车的引擎，将发行版比作汽车的配置。如果你租过汽车，租来的汽车配置往往与你平时开的汽车大不同。当你进入租来的汽车时，你需要花几分钟时间调整座椅、查看各种汽车控制，并弄清楚如何使用它们，然后上路。学习新的发行版也是如此。好消息是，如果你有丰富的\
  \ Linux 既经验，学习新的发行版并没有那么困难。\n\n了解哪些 Linux 发行版将帮助你成功通过 `CompTIA Linux+` 考试是非常重要的。此外，你应该知道哪些特定的发行版版本是有用的。\n\
  \n## 查看 Red Hat Enterprise Linux\n\n最初的 `Red Hat Linux` 起于 1995 年，作为一个开源项目。它的流行程度日益增加，一度成为最流行的\
  \ Linux 发行版，用于教育环境、企业环境，甚至是业余 Linux 爱好者。\n\n然而，在 2003 年，`Red Hat` 停止了 `Red Hat Linux`\
  \ 项目，转而支持 `Red Hat Enterprise Linux (RHEL)` 项目。`RHEL` 项目主要关注商业 Linux 环境。`RHEL` 是一个商业软件包；因此在大多数情况下，你必须购买许可证才能使用。作为回报，`Red\
  \ Hat` 提供全面的客户支持，帮助设置和排除 Linux 系统的故障，这与其他大多数 Linux 发行版不同。\n\n对于 Linux 爱好者来说，幸运有一种运行\
  \ `RHEL` 的替代方法。由于 Linux 是一个开源软件包，`Red Hat` 被要求发布 `RHEL` 的源代码。其他几个 Linux 发行版使用 `RHEL`\
  \ 源代码涌了出来。最受欢迎的是 `Community Enterprise Operating System (CentOS)`。它几乎是 `RHEL` 的完全复制，是\
  \ `CompTIA Linux+` 认证考试的极佳免费学习资源。\n\n然而，正如快速发展的 Linux 世界中常见的那样，事情发生了变化。2014 年，`CentOS`\
  \ 加入了 `Red Hat` 的开源和标准团队，2020 年，`Red Hat` 将原始的 `CentOS` 项目替换为名为 `CentOS Stream`\
  \ 的新开发版本。虽然你仍然可以免费获取 `CentOS Stream`，但它不再是当前 `RHEL` 版本的完全复制，而是新概念的测试场，这使其作为学习资源的收益减少。\n\
  \n但不要害怕，`CentOS` 的原始开发者已经开始了另一个发行版，名为 `Rocky Linux`。`Rocky Linux` 回到了 `CentOS` 的起源——它是最新\
  \ `RHEL` 版本的完全复制。你可以从 Rocky 网站 `www.rockylinux.org` 获取 `Rocky Linux` 发行版 ISO。注意，该发行版与其他许多版本一样，有多个版本。我建议你获取\
  \ `Rocky` 版本 9.*默认镜像下载包。\n\n当你安装 `Rocky Linux` 时，系统会提示你想要安装的环境。对于学习 Linux，通常最好安装图形化桌面环境，因为这提供了访问你需要学习的所有\
  \ Linux 特性的最简单方法。\n\n在你安装了 `Rocky Linux` 版本 9.*默认镜像发行版后，你应该更新软件包。通过使用你在安装期间设置的密码登录\
  \ `root` 账户，并执行列表 1.1 所示的命令来实现。\n\n虽然 `RHEL`（及其衍生版本）是一个流行的发行版，但你还需要一个 Debian 营的发行版。接下来，我将探索\
  \ `Ubuntu` 发行版。\n\n## 查看 Ubuntu\n\n`Ubuntu` Linux 发行版由 `Canonical LTD` 管理，自 2004\
  \ 以来一直存在。这个免费且流行的 Linux 发行版基于 `Debian` 发行版，是你个人 Linux 学习空间必不可少的。\n\n你可以从 `www.ubuntu.com`\
  \ 获取 `Ubuntu` 发行版 ISO。`Ubuntu` 有几个版本，如果你想确保能够遵循书中的示例，我们建议你下载 `Ubuntu Desktop` 24.04\
  \ LTS 版本。\n\n如果你对 `Ubuntu` 不熟悉，你需要注意几个重要的事项。默认情况下，你无法登录 `root` 账户。相反，当你需要使用超级用户权限时，登录你在安装时设置的账户，并在命令行命令前加上\
  \ `sudo`。如列表 1.2 所示的示例所示。\n\n另一个重要事项涉及安装 `Ubuntu`。如果你连接了网络，你可以在安装发行版时自动更新该发行版的软件。你将在安装过程中看到\
  \ `Download updates during the installation`（在安装期间下载更新）这一选项，旁边旁边有一个复选框。如果你选择在安装期间不安装更新，稍后可以通过终端中使用超级用户权限手动执行列表\
  \ 1.3 所示的命令来更新软件。\n\n如果你只有空间运行两个发行版，`Rocky Linux` 和 `Ubuntu` 是很好的选择。如果你有资源，添加另一个发行版\
  \ `openSUSE` 是值得的。\n\n## 查看 openSUSE\n\n`openSUSE` 发行版于 1994 年首次发布，当时名为 `SUSE Linux`。许多公司参与了它的支持，总部位于德国的\
  \ `SUSE` 是原始公司。\n\n这个发行版拥有非常忠实且坚实的粉丝。`openSUSE` 发行版不仅受到社区开发者的强支持，`openSUSE` 用户也非常喜爱它。它独特且流行的工具之一是\
  \ `Yet another Setup Tool (YaST)`。`YaST` 可以被认为是一个控制中心工具，允许你从一个界面控制许多系统服务。\n\n你可以从\
  \ `https://software.opensuse.org` 获取 `openSUSE` 发行版 ISO。该发行版有两个主要版本：`Leap` 和 `Tumbleweed`。我们建议你选择\
  \ `openSUSE Leap` 版本 15.*。\n\n一旦成功安装了 `openSUSE`，在探索此发行版之前更新所有软件是一个好主意。要通过命令行更新软件，请在终端中使用超级用户权限手动执行列表\
  \ 1.4 所示的命令。\n\n你可能注意到，最后三个发行版使用不同的命令来更新软件。这是你需要在学习空间中拥有访问多个发行版的另一个原因。\n\n## 定位终端\n\
  \n\n\n\n\n为了探索 Linux 并准备参加 CompTIA Linux+ 认证考试，你需要在命令行上花费一些时间。终端是你进入命令行的网关。一旦你理解了如何定位和使用此终端，就可以开始学习本书的后续内容了。\n\
  \n面向服务器的发行版仅提供命令行访问，因此这并不是问题。然而，面向桌面的发行版默认不显示命令行。在这些发行版中，进入终端的最简单方法是在系统启动后按下组合键\
  \ `Ctrl+Alt` 加上功能键之一（通常为 `F2` 或 `F3`）。这将带你进入一个名为 `tty2` 的终端。在输入你在 Linux 发行版安装期间创建的用户名和密码后，将获得一个提示符。图\
  \ 1.2 显示了 openSUSE 发行版上的 `tty3` 终端。\n\n![计算机终端屏幕截图显示了 open SUSE Leap 15.2 的登录提示符。](img/c01f002.png)\n\
  \n图 1.2 openSUSE tty3 终端\n\n在终端提示符处，你可以开始输入命令。如果你新安装了该发行版，请按照本章早些时候指示更新其软件。要退出此终端，只需输入\
  \ `exit` 命令即可。\n\n## 总结\n\nLinux 发行版将多个软件组合在一起，创建一个完整的 Linux 系统。Linux 内核是系统的核心，但也需要\
  \ GNU 工具程序来允许你与文件和程序进行交互，以及某种类型的用户界面（图形界面或文本界面）。最后，你还需要一些在 Linux 系统上使用的应用程序。\n\n\
  学习空间是一个虚拟或物理的 Linux 系统，你可以在其中探索、练习和尝试各种 Linux 命令和实用程序。一个私有的学习空间对于成功通过 CompTIA Linux+\
  \ 认证考试是必须的。你可以在旧笔记本电脑上设置学习空间、在运行虚拟机管理程序的当前笔记本上设置，或者在云端设置。\n\n在你的学习空间中拥有多个 Linux\
  \ 发行版也至关重要。因为发行版之间存在差异，因此让这些发行版随时可用以探索这些差异非常重要。\n\n一旦你设置好了 Linux 学习空间，就可以开始深入研究\
  \ CompTIA Linux+ 认证目标。我将在下一章开始介绍这些目标。\n\n## 考试要点\n\n**描述 Linux 发行版使用的不同许可模型。** 开源软件主要有两种许可模型：拷贝左（Copyleft）和宽松性许可（Permissive）。拷贝左许可（如\
  \ `GPL` 和 `LGPL`）要求你使用相同的许可模型对衍生作品进行授权。宽松性许可（如 `Apache` 和 `MIT`）允许你使用不同的许可发布衍生作品，甚至可以不使用许可。\n\
  \n**解释为什么会有这么多不同的 Linux 发行版。** Linux 发行版将 Linux 系统的不同部分组合在一起，便于安装完整的 Linux 系统。主要部分包括\
  \ Linux 内核、GNU 软件实用程序、用户界面（图形桌面或命令行界面），以及最后根据你的需求所需的特定应用程序。\n\n**描述 Linux 可以运行的各种硬件平台。**\
  \ Linux 内核已编译为运行在几种不同的 CPU 架构上，包括 Intel 和 AMD 的 `x86` 和 `x86_64`、ARM 的 `aarch64`\
  \ 以及旧版 Apple 工作站使用的 PowerPC 架构。\n\n## 复习题\n\n你可以在附录 A 中找到复习题的答案。\n\n1. 哪种许可模型要求你使用相同的许可发布任何衍生软件？\n\
  \   1. `MIT`\n   2. `GPL`\n   3. `Apache`\n   4. `LGPL`\n   5. `Proprietary`（专有）\n\
  \n2. 哪种 CPU 架构是任何 CPU 制造商都可以使用的的标准？\n   1. `x86`\n   2. `x86_64`\n   3. `RISC-V`\n\
  \   4. `s390x`\n   5. `aarch64`\n\n3. 哪个发行版组使用基于 Debian 模型？\n   1. `dpkg`\n   2.\
  \ `aarch64`\n   3. `GPL`\n   4. `RPM`\n   5. `LGPL`\n\n## 第 2 章：服务简介\n\n![](img/chaptersquare.png)\n\
  \n虽然 Linux 在进入桌面市场方面并不顺利，但它在市场上蓬勃发展，因此了解 Linux 服务器是如何工作的以及目前哪些服务器软件包流行的是重要的。此外，XK0-006\
  \ 考试还要求你了解 Linux 可用的许多流行服务器软件包的基础知识。\n\nLinux 服务器的流行在很大程度上归于它们的多功能、性能和成本。本章将帮助你熟悉\
  \ Linux 服务器的操作原理，并涵盖你可以在 Linux 中安装和运行的最常见的服务器软件包，以为你的网络客户端提供服务。\n\n## 什么是 Linux\
  \ 服务器？\n\n在深入 Linux 服务器细节之前，我将首先解释我所说的 Linux 服务器，并展示 Linux 服务器与 Linux 桌面的区别。\n\n\
  Linux 桌面和 Linux 服务器使用相同的 Linux 内核，运行相同的 shell，甚至能够运行相同的程序。区别在于它们主要运行哪些程序以及这些程序如何在系统中运行。\n\
  \nLinux 桌面主要侧重于你从图形桌面界面运行的个人程序，例如浏览互联网或编辑文档。图形桌面为用户与操作系统以及所有文件和程序的交互提供了一个简单的界面。你通过从菜单系统中选择或点击桌面图标来启动程序。在桌面世界中，一切都是交互式的。\n\
  \nLinux 服务器主要在没有人工干预的情况下运行。没有人坐在桌面前启动应用程序（事实上，许多服务器甚至没有专用的显示器和键盘）。\n\n服务器运行为多个用户（客户端）提供共享资源（称为*服务*）的程序，通常在网络环境中运行。许多服务一直运行，即使没有客户端正在活动使用它们。\n\
  \n服务器程序很少依赖于图形界面。相反，它们几乎总是利用 Linux shell 的命令行界面（`CLI`）与服务器管理员交互，而且管理员经常从远程客户端连接到服务器，以对服务执行任何交互工作。\n\
  \n由于与人工操作员的交互很少，服务器必须学会自动启动为客户端提供服务的程序。服务器运行这些服务的方式可能随服务器和服务的不同而异。后续章节描述了 Linux\
  \ 服务器如何启动服务以及它们如何为客户端提供这些服务的访问。\n\n## 启动服务\n\nLinux 服务器运行服务程序有两种主要方式：\n\n* 作为后台进程始终运行并监听请求\n\
  * 作为由父程序派生的进程，由该父程序监听请求\n\n当一个 Linux 服务程序作为后台进程持续运行时，它被称为*守护进程**daemon*）。Linux 服务器通常利用脚本在服务器启动后立即启动服务守护进程（参见第\
  \ 6 章”）。\n\nLinux 守护进程程序通常以字母 `d` 结尾，表示它们是守护进程。列表 2.1 显示了 MySQL 数据库服务器守护进程在后台运行的示例。\n\
  \n`mysqld` 守护进程程序监听来自客户端的网络连接。当守护进程收到来自客户端的请求时，它处理该请求并通过同一个网络通道将数据返回给客户端。\n\n\n\n\
  \n\nLinux 服务器支持的服务越多，后台就必须运行越守护进程（daemon）来等待客户端请求。每个守护进程都需要服务器的内存资源，即使它只是在监听客户端。虽然现在的服务器拥有大量的可用内存，但在早期的\
  \ Linux 时代情况并非如此。因此，`超级服务器（super-servers）`的需求应运而生。\n\n超级服务器是为多个不同的应用程序监听网络连接的程序。当超级服务器接收到客户端的服务请求时，它会产生相应的服务程序。\n\
  \n最初为 Linux 创建的原始超级服务器程序是 `互联网守护进程 (inetd)` 应用程序。`inetd` 程序作为守护进程运行，监听客户端的特定请求，并在需要时启动相应的服务程序。`inetd`\
  \ 程序使用 `/etc/inetd.conf` 配置文件允许你定义由它处理请求的服务。\n\n`扩展的互联网守护进程 (xinetd)` 应用程序是 `inetd`\
  \ 的高级版本。它同样根据客户端的请求启动服务程序，但包含了额外的功能，例如访问控制列表（ACLs）、更高级的日志功能，以及设置计划在一天或一周内的不同时间开启和关闭服务的能力。\n\
  \n## 监听客户端\n\n标准的 Linux 服务器支持许多服务。通常，单个 Linux 服务器会同时支持多个服务。这意味着多个客户端将就多个服务向服务器发送请求。诀窍在于如何将客户端的请求引导到正确的服务器服务。\n\
  \n每个服务（无论是作为守护进程运行，还是从超级服务器运行）都使用单独的网络协议来与其客户端通信。常见的服务协议由互联网工程任务组（IETF）标准化，并以“征求意见”（RFC）文档的形式发布。每个服务器软件程序都使用其服务指定的协议与客户端通信，例如\
  \ Web 服务器使用 HTTP，或者电子邮件服务器使用 SMTP。\n\n服务的网络协议精确定义了网络客户端如何使用预先分配的网络`端口（ports）` 与服务进行通信。端口定义在\
  \ TCP 和 UDP 标准中，有助于区分发往同一 IP 地址的网络流量。IETF 为不同的服务分配了不同的端口进行通信。这类似于大型企业使用的电话分机。你拨打一个电话号码联系该企业，然后选择一个单独的分机号找到办公室内的特定个人。对于服务而言，客户端使用一个公共\
  \ IP 地址访问服务器，然后通过不同的端口访问各个服务。\n\nIETF 为互联网上常用的服务定义了一组标准端口。这些端口被称为`常用端口（well-known\
  \ ports）`。表 2.1 显示了了一些已分配的常见常用端口。\n\n| 端口号 | 协议 | 描述 |\n| --- | --- | --- |\n| 20\
  \ 和 21 | FTP | 文件传输协议用于在服务器与客户端之间发送文件。 |\n| 22 | SSH | 安全外壳协议用于向服务器发送加密数据。 |\n|\
  \ 23 | Telnet | Telnet 是一种用于为服务器 shell 提供交互式界面的不安全协议。 |\n| 25 | SMTP | 简单邮件传输协议（SMTP）用于在服务器之间发送电子邮件。\
  \ |\n| 53 | DNS | 域名系统（DNS）提供名称解析服务，用于匹配网络上的 IP 地址和计算机名称。 |\n| 67 | DHCP | 动态主机配置协议（DHCP）允许客户端计算机自动在网络上获取有效的\
  \ IP 地址。 |\n| 80 | HTTP | 超文本传输协议（HTTP）允许客户端从服务器请求网页。 |\n| 109 和 110 | POP | 邮局协议（POP）允许客户端与邮件服务器通信以读取信箱中的消息。\
  \ |\n| 137–139 | SMB | 微软服务器使用服务器消息块（SMB）协议与客户端进行文件和打印共享。 |\n| 143,220 | IMAP |\
  \ 互联网消息访问协议（IMAP）为客户端提供高级信箱服务。 |\n| 389 | LDAP | 轻量级目录访问协议（LDAP）提供用于用户、工作站和其他网络设备认证的目录服务访问。\
  \ |\n| 443 | HTTPS | HTTP 的安全版本提供了与 Web 服务器的加密通信。 |\n| 2049 | NFS | 网络文件系统（NFS）在\
  \ Unix 和 Linux 系统之间提供文件共享。 |\n\nTABLE 2.1 常见的互联网常用端口号\n\n许多 Linux 服务可为网络上的客户端提供应用程序。`/etc/services`\
  \ 文件包含了 Linux 服务器上定义的所有端口。\n\n接下来的章节将探索你在 Linux 服务器上发现的各种类型的服务，以及提供这些服务的常见 Linux\
  \ 应用程序。\n\n## 基础服务\n\nLinux 服务器擅长处理一些基础的互联网服务，并且这些服务已成为互联网上的标准。Linux 服务器提供的三种互联网服务如下：\n\
  \n*   Web 服务\n*   数据库服务\n*   电子邮件服务\n\n接下来的章节将讨论这些类型的 Linux 服务，并向你展示通常用于支持它们的开源软件包。\n\
  \n## Web 服务器\n\n到目前，Linux 服务器在互联网上最流行的用途是作为 Web 服务器。基于 Linux 的 Web 服务器托管了大多数网站，包括许多最受欢迎的网站。\n\
  \n与许多 Linux 应用一样，你有多个程序可以构建 Linux Web 服务器。这些是你会遇到并应该了解的最流行的程序。\n\n## Apache 服务器\n\
  \n多年来，`Apache` Web 服务器已成为互联网上最流行的 Web 服务器之一。它是由伊利诺伊大学国立超级超级计算中心（NCSC）创建的第一个 Web\
  \ 服务器包开发的。\n\n`Apache` Web 服务器之所以流行，归功于它的模块化。`Apache` 服务器的每个高级功能都是作为插件模块构建的。当功能作为模块整合时，服务器管理员可以灵活选择特定服务器为特定应用程序所需的模块。这有助于减少系统上运行\
  \ `Apache` 服务器守护进程所需的内存量。\n\n### nginX 服务器\n\n`nginX` Web 服务器（读音类似于“engine-X”）是领域内较新的成员。`nginX`\
  \ 于 2004 年发布，设计用于 `Apache` 服务器的高级替代品，改进了性能并提供了一些额外功能，例如作为 Web 代理、邮件代理、网页缓存，甚至是负载均衡服务器。核心\
  \ `nginX` 程序比庞大的 `Apache` 程序具有更小的内存占用，使其成为高吞吐量环境的理想选择。它能够处理超过 10,000 个并发网络客户端连接。\n\
  \n虽然 `nginX` Web 服务器仍然相对较新，但它的正正变得越来越受欢迎，特别是在高流量 Web 环境中。一种日益流行的配置是使用 `nginX` Web\
  \ 服务器作为负载均衡前端，连接后端的多个 `Apache` Web 服务器。这利用了 `nginX` 服务器处理大流量的能力，以及 `Apache` Web\
  \ 服务器处理动态 Web 应用的通用性。\n\n### lighthttpd 软件包\n\n在光谱的另一端，有时你需要一个轻量级的 Web 服务器来处理网络应用程序的入客户端请求。`lighthttpd`\
  \ 软件包提供了这样的环境。\n\n\n\n\nlighthttpd Web 服务器以低内存占用和低 CPU 占用而闻名，使其成为小型服务器应用（如嵌入式系统）的理想选择。它还集成了一个内置数据库，允许你在单个软件包中将基础\
  \ Web 服务和数据库服务相结合。\n\n## 数据库服务器\n\n存储和检索数据是大多数应用程序的一项重要功能。虽然对于简单的数据存储应用，使用标准文本文件通常足够，但有时需要更高级的数据存储技术。\n\
  \n关系型数据库的出现允许应用程序快速地存储和检索数据。关系型数据库服务器允许多个客户端从中心位置访问相同的数据。结构化查询语言（SQL）为客户端向数据库服务器发送请求并检索数据提供了一种通用方法。\n\
  \n虽然 Unix 和 Windows（甚至 Linux）上有许多流行的商业数据库服务器可用，但在 Linux 世界，有少数高质量的开源数据库脱颖而出。这些数据库服务器软件包提供了与昂贵的商业数据库软件包许多（如果不是全部）相同的功能，有时其性能甚至优于商业软件包。\n\
  \n接下来的章节将讨论你在 Linux 环境下会遇到的三个最流行的开源数据库服务器。\n\n## PostgreSQL 服务器\n\n`PostgreSQL`\
  \ 数据库服务器起于一个大学项目，并于 1996 年作为面向公众的开源软件包发布。PostgreSQL 开发人员的目标是实现一个完整的对象关系数据库管理系统，以与当时流行的商业数据库服务器相竞争。\n\
  \nPostgreSQL 以其先进的数据库功能而闻名。它遵循商业数据库使用的标准原子性、一致性、隔离性和持久性（ACID）指南，并支持许多你可能在商业关系型数据库服务器中发现的高级功能，例如事务、可更新视图、触发器、外键、函数和存储过程。\n\
  \n虽然 PostgreSQL 功能非常强大，但多功能也伴随着复杂性。在过去，PostgreSQL 数据库曾有速度较慢的名声，但它的性能已经取得了巨大的改进。遗憾的是，旧名声很难消除，PostgreSQL\
  \ 在赢得 Web 世界认可方面仍然面临困难。\n\n### MySQL 服务器\n\n与 PostgreSQL 软件包不同，`MySQL` 数据库服务器最初并没有试图与商业数据库竞争。相反，它最初是一个创建一个简单但快速的数据库系统的项目。它并没有尝试实现花哨的数据库功能；只是提供了运行快速的基本功能。\n\
  \n由于对速度的关注，MySQL 数据库服务器成为了许多互联网 Web 应用中事实上的数据库服务器。运行 Apache Web 服务器和 MySQL 数据库服务器并使用\
  \ PHP 编程语言的 Linux 服务器组合被称为 LAMP 平台，可以在全球 Linux 服务器中找到。\n\n自诞生以来，MySQL 数据库已经添加了可以与\
  \ PostgreSQL 和商业数据库相媲的功能。然而，忠于初衷，MySQL 仍然保留了利用其闻名的更快的存储引擎的选项。\n\n## MongoDB 服务器\n\
  \n随着面向对象编程和应用设计的日益流行，面向对象数据库的使用也在增加。目前最流行的面向对象的数据存储方法之一被称为 `NoSQL`。\n\n正如其名，NoSQL\
  \ 数据库系统存储数据的方式与使用 SQL 的传统关系数据库系统不同。NoSQL 数据库不创建表，而是将数据存储为单独的文档。与关系表不同，每个 NoSQL 文档可以包含不同的数据元素，每个数据元素独立于数据库其他数据元素。\n\
  \n一个日益流行的 NoSQL 数据库软件包是 `MongoDB`。MongoDB 于 2009 年作为一个完全符合 NoSQL 标准的数据库管理系统发布。它将数据记录存储为单独的\
  \ `JavaScript Object Notation (JSON)`元素，使得每个数据文档彼此独立。\n\nMongoDB 数据库服务器支持许多关系数据库功能，例如索引、查询、复制甚至负载均衡。它允许在查询中加入\
  \ JavaScript，使其成为查询数据的非常多功能的工具。\n\n## 邮件服务器\n\n曾经，电子邮件是互联网的骨干。几乎每个人都有一个电子邮件地址，连接邮件服务器对于与世界通信至关重要。虽然现在更新的技术正在接管（如短信、推文和消息传递），但对于大多数互联网用户来说，电子邮件仍然是一项重要的业务。几乎每个\
  \ Linux 安装都会使用某种类型的邮件服务器软件包。\n\nLinux 没有使用一个处理收发邮件所需的所有部分的单体程序，而是使用多个在处理邮件消息时协同工作的小程序。图\
  \ 2.1 向你展示了大多数开源邮件软件如何在 Linux 环境中将邮件功能模块化。\n\n![图示了一个 Linux 服务器，其邮件数据库、MUA、MDA 和\
  \ MTA 链接到工作站和远程 MTA。](img/c02f001.png)\n\n图 2.1 Linux 模块化邮件环境\n\n正如你从 图 2.1 中看到的，Linux\
  \ 邮件服务器通常被分为三个独立的功能：\n\n* 邮件传输代理 (MTA)\n* 邮件投递代理 (MDA)\n* 邮件用户代理 (MUA)\n\nMUA 是与终端用户交互的程序，允许他们查看和操作电子邮件。因此，MUA\
  \ 程序通常不运行在服务器端，而是运行在客户端。Evolution 和 K-Mail 等图形应用程序在 Linux 桌面环境中读取邮件非常流行。MTA 和 MDA\
  \ 功能位于 Linux 服务器上。接下来的章节将展示你在 Linux 中常见的常见的 MTA 和 MDA 应用。\n\n## 邮件传输代理\n\n`mail\
  \ transfer agent (MTA)` 负责处理服务器上的入站和出站邮件。对于每条出的消息，MTA 确定收件人地址的目标主机。如果目标主机是远程邮件服务器，MTA\
  \ 必须与远程主机上的另一个 MTA 程序建立通信链接以传输消息。\n\nLinux 环境中有许多 MTA 软件软件包，但 Linux+ 考试重点关注其中三个：\n\
  \n* `sendmail`：sendmail MTA 软件包因其极其多功能而流行。sendmail 的许多功能已成为电子邮件系统的同义词——虚拟域名、消息转发、用户别名、邮件列表和主机伪装。遗憾的是，正确配置\
  \ sendmail 非常复杂。其庞大的配置文件有时让初级邮件管理员感到无从。。\n* `Postfix`：Postfix MTA 作为一个模块化应用程序编写，使用几个不同的程序来实现\
  \ MTA 功能。Postfix 的最佳功能之一是它的简单性。Postfix 没有使用一个大型复杂的配置文件，而是只使用两个带有纯文参数和键值名称的小型配置文件来定义功能。\n\
  * `Exim`：Exim MTA 软件包坚持 sendmail 的模型，即使用一个大程序处理所有邮件功能。它尝试尽可能避免消息排队，而在大多数环境中依赖于即时投递。\n\
  \n### 邮件投递代理\n\n\n\n\n\n通常，Linux 实现依赖于独立的`邮件投递代理 (MDA)`程序来将消息传递给本地用户。由于这些 MDA 程序专门专注于将消息传递给本地用户，因此它们可以添加一些在包含\
  \ MDA 功能的 MTA 程序中不具备的额外功能。\n\nMDA 程序从 MTA 程序接收目标为本地用户的消息，然后决定如何投递这些消息。消息可以可以直接投递到本地用户账户，也可以投递到用户定义的替代位置（通常通过结合过滤器来实现）。\n\
  \nLinux 中有两种常用的 MDA 程序：\n\n*   `Binmail`：`binmail` 程序是 Linux 中最常用的 MDA 程序。它的名称源于它在系统中的常规位置\
  \ `/bin/mail`。它因其简单而广受欢迎。默认情况下，它可以读取存储在标准 `/var/spool/mail` 目录中的电子邮件消息，或者你也可以将其指向备用件箱。\n\
  *   `Procmail`：`procmail` 程序由 Stephen R. van den Berg 编写，已变得非常流行，许多 Linux 实现默认都安装了它。`procmail`\
  \ 的流行源于在创建用户配置配方方面的多功能性，配方允许用户指导服务器如何处理收到的邮件。用户可以在其 `$HOME` 目录中创建一个个人的 `.procmailrc`\
  \ 文件，根据正则表达式将消息引导到单独的邮箱文件、将消息转发到备用电子邮件地址，甚至将消息直接发送到 `/dev/null` 文件以自动丢不需要的邮件。\n\n\
  ## 邮件用户代理 (Mail User Agent)\n\nLinux 提供了许多软件包用于读取和发送电子邮件。大多数远程邮件客户端包利用第 4 版互联网消息访问协议\
  \ (IMAP4) 与电子邮件服务器通信以处理电子邮件消息。\n\n为了支持 IMAP4 客户端，Linux 服务器必须运行 IMAP4 服务器程序。Linux\
  \ 上一个非常流行的 IMAP4 服务器是 `Dovecot`。\n\n# 服务本地网络\n\n除了运行大型的 Internet Web 和数据库应用程序外，Linux\
  \ 服务器还常用于本地网络环境提供简单的网络服务。运行本地网络需要大量的幕后工作，而 Linux 服务器完全胜任这一任务。本节将带你了解在各种规模的本地网络中常见的各种服务。\n\
  \n## 文件服务器\n\n如今，文件共享已成为任何业务环境中的必需。允许多个员工在公共文件夹中创建和编辑文件，可以极地提高任何项目的协作效率。\n\n虽然在广域网环境中通过\
  \ Web 服务器共享文件很常见，但在本地网络内部有更简单的方法。在本地网络环境中共享文件有两种基本方法：\n\n*   点对点 (Peer-to-peer)\n\
  *   客户端-服务器 (Client-server)\n\n在点对点网络中，一个工作站允许另一个工作站访问存储在其硬盘上的文件。这种方法允许小型本地网络两个员工之间的协作，但如果需要在两个以上之间共享数据，就会变得有些困难。\n\
  \n客户端-服务器文件共享方法利用集中的`文件服务器`来共享多个客户端按需要访问和修改的文件。然而，使用集中式文件服务器，管理员必须控制谁可以访问哪些文件和文件夹，保护它们免受未经授权的访问。\n\
  \n在 Linux 世界，有两种常用的共享文件服务器软件包：`NFS` 和 `Samba`。\n\n## NFS\n\n`网络文件系统 (NFS)` 是一种用于在网络环境中共享文件夹的协议。通过\
  \ `NFS`，Linux 系统可以将其虚拟目录的一部分共享到网络上，允许客户端和其他服务器访问。\n\n在 Linux 中，用于实现此目的的软件包是 `nfs-utils`。`nfs-utils`\
  \ 包提供了支持 `NFS` 的驱动程序，以及底层客户端和服务器软件，用于在网络上共享本地文件夹并连接到本地网络其他 Linux 系统共享的远程文件夹。使用 `nfs-utils`，你的\
  \ Linux 系统挂载远程共享的 `NFS` 文件夹几乎就像它们在本地硬盘分区上一样。\n\n## Samba\n\nMicrosoft Windows 工作站和服务器已成为许多业务环境的常态。虽然\
  \ Windows 工作站和服务器可以使用 `NFS`，但 Windows 使用的默认文件共享方法是由微软创建的系统消息块 (SMB)协议。虽然微软服务器使用专用软件，但微软已发布\
  \ `SMB` 协议作为网络标准，因此可以创建使用 `SMB` 与 Windows 服务器和客户端交互的开源软件。\n\n`Samba` 软件包（注意其名称中巧妙地嵌入了\
  \ `SMB`）旨在旨在允许 Linux 系统与 Windows 客户端和服务器交互。通过 `Samba`，你的 Linux 系统可以作为客户端连接到 Windows\
  \ 服务器共享文件夹，也可以作为服务器允许 Windows 工作站连接到 Linux 系统上的共享文件夹。`Samba` 的确需要一些工作配置正确参数来管理对共享文件夹的访问。\n\
  \n## 打印服务器\n\n在业务环境中，为办公室的每一个人配备一台打印机在某种程度上是浪费支出。共享网络打印机的能力已成为大多数办公室的要求，许多许多环境中也变得流行。\n\
  \n标准的 Linux 打印共享软件包称为`通用 Unix 打印系统 (CUPS)`。`CUPS` 软件允许 Linux 系统通过在专用打印机驱动程序上的通用应用程序接口连接到任何打印机资源（本地或通过网络）。`CUPS`\
  \ 的关键在于打印机驱动程序。许多打印机制造商为其打印机创建 `CUPS` 驱动程序，以便 Linux 系统能够与之连接。对于连接网络打印机，`CUPS` 使用互联网打印协议\
  \ (IPP)。\n\n除了连接网络打印机，`CUPS` 系统还允许你与其他 Linux 系统共享本地连接的打印机。这允许你将打印机连接到 Linux 服务器并在本地网络中的多个用户之间共享。\n\
  \n### 网络资源服务器\n\n运行本地网络需要许多不同的资源来保持客户端和服务器同步。对于较大的网络尤为如此，网络管理员必须管理许多不同类型的客户端和服务器。\n\
  \n幸运的是，Linux 提供了几个不同的软件包，网络管理员可以使用它们来让工作变得轻松。以下章节将介绍你可能在 Linux 服务器上看到的一些基础面向网络的服务。\n\
  \n## IP 地址\n\n本地网络上的每个设备都必须有一个唯一的 IP 地址，以便与网络上的其他设备交互。对于小型家庭网络，这可能不难管理，但对于大型业务网络，这项任务可能会让人应付不堪。\n\
  \n为了帮助简化这一要求，开发者创建了`动态主机配置协议 (DHCP)`。客户端可以从 `DHCP` 服务器请求有效的 IP 地址。中央 `DHCP` 服务器跟踪已分配的\
  \ IP 地址，确保没有两个客户端接收相同的 IP 地址。\n\n最流行的 Linux DHCP 服务器包由互联网系统协会 (ISC) 维护，称为 `DHCP`。几乎所有的\
  \ Linux 服务器发行版在其软件仓库中都包含了此内容。\n\n\n\n\n一旦你已经在网络上运行了 `DHCPd` 服务器，你就需要告诉你的 Linux 客户端使用它来获取网络地址。这需要一个\
  \ DHCP 客户端软件包。对于 Linux DHCP 客户端，有三个常用的软件包供你：\n\n* `dhclient`\n* `dhcpcd`\n* `pump`\n\
  \n大多数基于 Debian 和 Red Hat 的发行版都使用 `dhclient` 软件包，甚至在安装过程中检测到网卡时默认安装它。`dhcpcd` 和 `pump`\
  \ 应用较为人知，但你仍然可能会遇到它们。\n\n## 日志 (Logging)\n\nLinux 维护着日志文件，记录了系统运行时的各种关键细节。日志文件通常存储在本地的\
  \ `/var/log` 目录，但在网络环境中，让 Linux 服务器将系统日志存储在远程日志服务器上会非常有用。\n\n远程日志服务器提供了原始日志文件的安全备份，并且在系统崩溃或遭受攻击者入侵时，提供了一个存储日志的安全存放地。\n\
  \nLinux 中使用了两个主要的日志软件包，系统使用哪一个取决于它所所使用的启动软件（请参阅第 6 节）：\n\n* `rsyslogd`: SysVinit\
  \ 和 Upstart 系统利用 `rsyslogd` 服务程序接收来自远程服务器的日志数据。\n* `journald`: Systemd 系统利用 `journald`\
  \ 服务对系统信息进行本地和远程日志。\n\n`rsyslogd` 和 `journald` 都利用配置文件，允许你定义数据的记录方式以及服务器接受来自哪些客户端的日志消息。\n\
  \n### 域名服务器 (Name Servers)\n\n使用 IP 地址引用网络上的服务器对计算机来说是没问题的，但人类通常需要某种文本来记住地址。这就是域名系统（`DNS`）。`DNS`\
  \ 将 IP 地址映射到网络上的主机命名方案。`DNS` 服务器充当目录查找器，用于查找本地网络上服务器的名称。\n\nLinux 服务器使用 `BIND` 软件包来提供\
  \ DNS 命名服务。`BIND` 软件包开发于互联网极早期（20 世纪 80 年代初的加利福尼亚大学伯克利分校，作为开源软件发布。\n\n`BIND` 中的主程序命名为\
  \ `named`，它是运行在 Linux 服务器上的服务器守护进程，为本地网络上的客户端将主机名解析为 IP 地址。`DNS` 的优之处在于，一个 `BIND`\
  \ 服务器可以与其他 `DNS` 服务器通信，以查找远程网络上的地址。这允许客户端指向一个 `DNS` 域名服务器，就能解析互联网上的任何 IP 地址！\n\n\
  对于使用 Systemd 启动方法的 Linux 发行版（参阅第 6 节），`systemd-resolved` 程序替换了旧的 `named` 程序。它提供了与\
  \ `named` 程序类似的功能，但包含在 Systemd 软件包中。\n\n## 网络管理 (Network Management)\n\n为一个组织负责多个主机和网络设备可能是一项极其巨大的任务。尝试跟踪哪些设备处于激活状态或哪些服务器满负荷运行是一个挑战。幸运的是，管理员们有一个解决方案。\n\
  \n简单网络管理协议（`SNMP`）为管理员提供查询远程网络设备和服务器的方法，以获取其配置、状态甚至性能的信息。`SNMP` 以简单的客户端-服务器模式运行。网络设备和服务器运行\
  \ `SNMP` 服务器服务，监听来自 `SNMP` 客户端软件包的请求。`SNMP` 客户端向 `SNMP` 服务器发送数据请求。\n\n`SNMP` 标准多年来发生了一些巨大的变化，主要是为了增加安全性和提高性能。原始的\
  \ `SNMP` 版本 1（称为 `SNMPv1`）仅为客户端提供简单的密码身份验证，并将所有数据作为单独的明文记录传递。`SNMP` 版本 2（称为 `SNMPv2`）实现了基础级的安全性，并提供了监控数据的批量传输，以减少监控设备所需的网络流量。当前版本（`SNMPv3`）同时利用了强身份验证和数据加密能力，并提供了更精简的管理系统。\n\
  \nLinux 中流行的 `SNMP` 软件包是开源的 `net-snmp` 软件包。该软件包具有 `SNMPv3` 属性，允许你安全地监控 Linux 服务器的所有方面。\n\
  \n## 时间 (Time)\n\n为了让许多网络应用程序正常工作，服务器和客户端的内部时钟都需要与同一时间同步。网络时间协议（`NTP`）实现了这一点。它允许服务器和客户端在多个网络上同步到同一个时间源，并根据需要加减几秒部分以保持同步。\n\
  \n对于 Linux 系统，`ntpd` 和 `chrony` 程序将 Linux 系统与互联网上的远程 `NTP` 服务器同步。通常的做法是让一个 Linux\
  \ 服务器使用 `ntpd` 或 `chronyd` 与远程时间标准服务器同步，然后让本地网络上的所有其他服务器和客户端同步到该本地 Linux 服务器。\n\n\
  ## 实现安全性 (Implementing Security)\n\n安全性是每位系统管理员担忧列表上的首位。由于有无尽的人试图入侵服务器，实施安全性是每位\
  \ Linux 管理员至关重要的职责。\n\n幸运的是，Linux 提供了多种安全层。以下章节介绍了你在实施 服务器安全性时可能会遇到的服务器软件包。\n\n\
  ### 身份验证服务器 (Authentication Server)\n\nLinux 服务器的核心安全性是分配给系统每个独立用户的标准 `userid` 和密码，它们存储在\
  \ `/etc/passwd`（非安全旧系统）或 `/etc/shadow` 文件中。每个 Linux 服务器维护自己的具有访问权限的有效用户账户列表。\n\n\
  在用户可能需要访问多个 Linux 服务器资源的大型网络环境中，记住多个用户名和密码是一个挑战。幸运的是，有几种方法可以在网络上的多个 Linux 服务器之间共享账户数据库。\n\
  \n## NIS\n\n网络信息系统（`NIS`）是一种目录服务，允许客户端和服务器共享一个公共命名目录。`NIS` 命名目录通常用作本地网络用户账户、主机名甚至电子邮件信息的公共存储库。`NIS+`\
  \ 协议通过增加安全功能扩展了 `NIS`。\n\n`nis-utils` 软件包是一个在 Linux 环境中实现 `NIS` 或 `NIS+` 目录的开源项目。它包含在大多数\
  \ Linux 发行版的仓库中。\n\n## Kerberos\n\n`Kerberos` 开发于 MIT，是一种安全的身份验证协议。它使用对称密钥加密法通过中心化的服务器数据库安全地验证用户。整个身份验证过程都是加密的，使其成为登录\
  \ Linux 服务器的安全方法。\n\n你可以将 `Kerberos` 身份验证系统用于简单的服务器登录之外。许多常见的 Linux 服务器应用程序提供插件模块与\
  \ `Kerberos` 数据库接口以验证应用程序用户。\n\n## LDAP\n\n网络身份验证系统在商业网络领域发展迅速。微软的 Active Directory\
  \ 系统是目前最流行的网络身份验证系统。然而，开源世界并没有落后，它创建了自己的网络目录系统。\n\n轻量级目录访问协议（`LDAP`）创建于歇根大学，为本地网络上的多个应用程序和设备提供简单的网络身份验证服务。Linux\
  \ 世界中最流行的 `LDAP` 实现是 `OpenLDAP` 软件包。\n\n\n\n\nOpenLDAP 允许你设计一个层次级数据库来存储网络中的对象。在层次级数据库中，对象以树状方式相互连接，如图\
  \ 2.2 所示。\n\n![树状图顶部是 d c com，分支到 d c sample，然后是 c n Matthew、c n Chris、c n Sasha\
  \ 和 c n Riley。](img/c02f002.png)\n\n图 2.2 示例 LDAP 目录树\n\n层次级数据库允许你根据类型（如用户和服务器）、位置或两者结合对对象进行分组。这为你的本地网络设计身份验证提供了一种非常灵活的方法。\n\
  \nOpenLDAP 软件包由客户端和服务器程序组成。客户端程序允许系统访问 OpenLDAP 服务器，以验证客户端或其他网络对象发起的请求。\n\n## 证书权威机构\n\
  \n为服务器上的每个用户分配 userid 和密码的时代即将结束（如果还没有结束的话）。使用 userid/密码方法登录服务器的方法充满了安全问题——共享用户账户、简单的密码，甚至是未分配密码的账户。\n\
  \n一种更好的用户验证方法是使用 `certificates`（证书）。证书是一种实现双因子认证方法的加密密钥。要登录服务器，用户必须拥有两样东西：\n\n*\
  \   他们拥有的，例如证书文件\n*   他们知道的，例如 PIN 码\n\n证书识别网络上的特定用户。应该只有一个用户拥有该证书并知道访问该证书所需的 PIN。然而，服务器信任该证书也很重要。为了这一点，你需要证书权威机构（certificate\
  \ authority）。\n\n`OpenSSL` 软件包为服务器和客户端提供了标准的证书功能。你可以设置你的 Linux 服务器为客户端创建证书，然后网络应用程序对它们进行身份验证。\n\
  \n## 访问服务器 (SSH)\n\n在当今环境中，远程访问服务器是有风险的。有许多人在网络周围窥探，寻找他们可以窃取的信息。使用 `Telnet` 或 `FTP`\
  \ 等明文协议从远程位置登录服务器不再是一个好主意了。\n\n相反，你应该使用一种在客户端和服务器之间包含加密的远程访问协议。`Secure Shell (SSH)`\
  \ 为跨网络传输的数据提供了一层加密。\n\n在 Linux 环境中，实现 SSH 最流行的软件包是 `OpenSSH` 软件包。`OpenSSH` 软件包提供了使用\
  \ `SSH` 的安全 `Telnet`、`FTP` 甚至远程复制功能。\n\n## 虚拟专用网络\n\n通过互联网远程连接本地网络上的服务器可能是危险的。你的网络流量在到达服务器之前会在许多中间网络之间多次跳转，这为窥探者监视你的数据提供了大量机会。\n\
  \n远程连接本地网络资源的解决方案是 `Virtual Private Network (VPN)` 协议。`VPN` 协议在远程客户端或服务器与本地网络上的\
  \ VPN 服务器之间创建了一个安全的点对点隧道。这为远程访问本地网络上的任何服务器提供了一种安全的方法。\n\n在 Linux 中，一种流行的 VPN 解决方案是\
  \ `OpenVPN` 软件包。`OpenVPN` 软件包作为服务器服务运行在本地网络的 Linux 服务器上。远程客户端可以使用 `OpenVPN` 连接到\
  \ `OpenVPN` 服务器以建立与服务器的连接，一旦进入服务器，就可以访问你本地网络的其余部分。\n\n## 代理服务器\n\n`web proxy server`\
  \ 允许你拦截来自本地网络客户端的 Web 请求。通过拦截 Web 请求，你可以控制客户端如何与远程 Web 服务器交互。Web 代理服务器可以阻止你不希望网络客户端看到的网站，服务器可以缓存常见网站，以便将来对相同页面的请求加载得更快。\n\
  \nLinux 中流行的 Web 代理服务器是 `Squid` 软件包。之前讨论的 `nginX` Web 服务器软件包也具有作为 Web 代理服务器的能力，并且近年来变得流行。\n\
  \n## 监控\n\n如果你在网络中有多个 Linux 服务器，尝试跟进它们所做的一切可能是一个挑战。系统管理员经常查看服务器的性能和日志文件一直是一个好主意，以便感知是否有坏情况即将发生或已经发生。\n\
  \nLinux 世界有多种监控工具。`Nagios` 软件包正迅速成为一种流行的工具，特别是在云 Linux 系统中。`Nagios` 使用 `SNMP` 监控\
  \ Linux 服务器的性能和日志，并在简单的图形环境中提供结果。\n\n## 提高性能\n\n大量 Linux 程序的开发者和管理员一直在寻找提高性能的方法。所有\
  \ Linux 管理员都应该注意的三种提高性能的方法。本节介绍了这些方法。\n\n## 集群\n\n计算机 `cluster`（集群）通过将应用程序功能分配到多个服务器上来提高应用程序性能。集群中的每个服务器节点配置相同，可以执行相同的功能，但集群管理软件决定如何将应用程序功能分配到服务器之间。由于集群中的每台服务器只处理应用程序的一部分，因此与必须在单个服务器上运行整个应用程序相比，你可以在集群中使用性能较弱的服务器。\n\
  \n集群管理软件是集群性能的关键。创建廉价 Linux 服务器集群的早期尝试之一是 Beowulf 集群。Beowulf 集群依赖并行处理库，例如 `Parallel\
  \ Virtual Machine (PVM)` 库，将应用程序的库调用分布在多个 Linux 服务器之间。较新版本的集群包括 `Apache Hadoop`\
  \ 项目和 `Linux Virtual Server (LVS)` 项目。\n\n尽管集群可以极大提高应用程序的性能和吞吐量，但需要指出并不是所有应用程序都能从集群中获益。例如，依赖数据库集群的应用程序实际上可能会遇到更慢的响应时间和吞吐量数字，因为数据库管理软件在在两个或多个数据库实例之间迁移数据块时，必须进行特殊调用并管理必要的锁定机制。这可能是由于应用程序在集群中的两个或多个服务器上执行并对数据库进行查询或更新导致的。\n\
  \n### 负载均衡\n\n`Load balancing`（负载均衡）是集群的一种特殊应用。负载均衡器将整个客户端请求重定向到集群中的一个服务器。当单个服务器处理整个请求时，客户端负载会自动分布在多个服务器之间。\n\
  \n常见的 Linux 负载均衡软件包包括 `HAProxy`、Linux Virtual Server (LVS) 甚至 `nginX` Web 服务器。\n\
  \n## 容器\n\n应用程序开发者面临的最大问题之一是创建一个与应用程序运行的实际服务器环境镜像的开发环境。经常，开发者会在工作站开发环境中让应用程序运行良好，结果在移植到服务器时却崩溃。\n\
  \nLinux `containers`（容器）通过创建一个自包含的环境来封装应用程序，帮助解决这个问题。容器将所有必要的应用程序文件、库文件和操作系统库打包成一个包，你可以轻松地在环境之间移动它。\n\
  \n\n\n\n\n若干 Linux 服务器软件包支持容器。目前，最流行的两个是 `Docker` 和 `Kubernetes`。你可以使用这些软件包轻松将将容器迁移到任何\
  \ Linux 服务器，无论是物理服务器、虚拟机还是云端服务器。\n\n## 总结\n\nLinux 服务器提供了同时支持客户端和网络设备的网络应用程序。服务器应用程序被称为服务（services），它们由\
  \ Linux 服务器在无需人工干预的情况下启动。当 Linux 服务器能够直接启动服务时，它们被称为守护进程（daemons）。守护进程在后台运行并监听客户端连接请求。超级服务器（super-server）在后台运行，并监听多个服务的客户端连接请求。当接受连接请求时，超级服务器会启动相应的服务。\n\
  \nLinux 支持所有类型应用程序的服务。`Apache` 和 `nginX` 服务为 Linux 提供了 Web 服务器应用程序。对于数据库应用程序，`PostgreSQL`、`MySQL`\
  \ 和 `MongoDB` 是最流行的。如果你想运行电子邮件服务器，`sendmail`、`Postfix` 或 `Exim` 应该可以胜任。Linux 作为局域网环境的服务器也运行良好。有用于文件、打印和网络服务器资源的开源软件包，以及用于安全认证和证书应用程序的软件包。\n\
  \n最后，你可以通过将一大组小型服务器聚类在一起创建一个大型服务器，来配置 Linux 服务器的容错能力。聚类软件可以拆分应用程序以便在多个服务器上同时运行，也可以将单个客户端分配给特定服务器以实现负载均衡。为了支持应用程序开发，Linux\
  \ 服务器还支持容器。容器允许开发者将用于开发应用程序的环境迁移到生产环境，确保应用程序在开发和生产环境中运行方式一致。\n\n## 考试要点\n\n### 描述在\
  \ Linux 中启动服务器程序的方法。\nLinux 中的服务器程序可以作为守护进程持续在后台运行，也可以在客户端请求时从超级服务器守护进程启动。\n\n###\
  \ 解释客户端如何知道联系服务器程序。\n服务器应用程序在已知端口上监听客户端连接。客户端必须向其想要交互的应用程序的已知端口向服务器发送连接请求。\n\n##\
  \ 解释 LAMP 栈中常用的组件。\nLAMP 栈使用 Linux 操作系统、`Apache` Web 服务器、`MySQL` 数据库服务器和 `PHP` 编程语言为\
  \ Web 应用程序提供平台。\n\n### 描述关系型数据库与 NoSQL 数据库之间的区别。\n关系型数据库在单独的数据表中存储数据记录。每个数据类型由一个或多个包含单个数据元素的数据字段组成。数据记录是表中每个数据字段的数据实例。NoSQL\
  \ 数据库则在文档中存储数据值。每个文档都独立于数据库中的所有其他文档。每个文档还可以包含不同的数据元素。\n\n### 理解 Linux 服务器在局域网中共享文件的方法。\n\
  Linux 服务器可以使用 `nfs-utils` 软件包与其他 Linux 服务器通信，使用 `NFS` 共享文件夹。本地 Linux 服务器可以从远程 Linux\
  \ 服务器挂载文件夹，就好像它们是本地磁盘一样。Linux 服务器还可以使用 `Samba` 软件包与 Windows 局域网上的 Windows 客户端和服务器共享文件，并映射位于\
  \ Windows 服务器上的文件夹。\n\n### 理解哪些服务器软件包常用于支持局域网的网络功能。\n`DHCPd` 软件包提供 DHCP 服务器服务，为客户端分配\
  \ IP 地址。`BIND` 软件包为局域网内的客户端和服务器提供 DNS 服务器服务用于主机名解析。`net-snmp` 软件包允许你使用 `SNMP` 实现远程设备管理，可以使用\
  \ `ntpd` 软件包为局域网创建 NTP 时间服务器。\n\n### 描述如何使用 Linux 创建网络目录服务器。\n`OpenLDAP` 软件包允许你在局域网上创建用户和设备的\
  \ LDAP 目录。客户端和其他服务器可以使用 LDAP 目录对网络上的用户和设备进行认证。\n\n### 解释如何提高网络应用程序的性能。\n对于高流量环境下的网络应用程序，你可以通过实现集群或负载均衡环境来提高性能。在集群中，你可以使用如\
  \ `Apache Hadoop` 的聚类软件包在多个服务器之间拆分应用程序功能。通过负载均衡，你可以使用 `HAProxy` 和 `Linux Virtual\
  \ Server` (`LVS`) 等软件包在多个服务器之间分配客户端连接。\n\n## 复习题\n\n你可以在 附录 A 中找到复习题答案。\n\n1. 流行的\
