  \    5. `mkinitramfs`\n\n# 第 6 章\n\n维护系统启动与服务\n\n## 查看 `init`\n\n在我开始检查各种服务管理方法之前，最好先看看\
  \ `init` 程序本身。从传统上，服务的启动是由 `init` 程序处理的。该程序可以位于 `/etc/`、`/bin/` 或 `/sbin/` 目录。此外，它通常具有进程\
  \ ID (PID) 为 1。\n\n`init` 程序或 systemd 是每个服务的父进程。如果你的系统安装了 `pstree` 程序，你可以通过输入 `pstree\
  \ 1` 来查看描述此情况的图表。这些信息将帮助你确定你的 Linux 发行版使用的是哪种初始化方法：systemd 还是 SysV init。首先使用 `which`\
  \ 命令找到 `init` 程序的位置。示例见列表 6.1。\n\n现在你已经知道了 `init` 程序的位置，使用超级用户权限，你可以使用 `readlink\
  \ -f` 命令查看该程序是否链接到另一个程序，如列表 6.2 所示。\n\n你可以在列表 6.2 中看到该系统实际上在使用 systemd。你可以通过查看 PID\
  \ 1 来验证这一点，如[列表 6.3]所示。\n\n在列表 6.3 中，使用了 `ps` 实用程序。该工具允许你查看进程。进程是正在运行的程序。`ps` 命令在\
  \ `CMD` 列中为你显示特定进程运行的是哪个程序。在这种情况下，systemd 程序正在运行。因此，此 Linux 系统正在使用 systemd。\n\n\
  ## 管理 systemd 系统\n\nsystemd 方法在 Linux 系统管理服务方面引入了重大的范式转变。服务现在可以在系统启动时、特定硬件组件连接到系统时、某些其他服务启动时等启动。某些服务可以根据定时器启动。\n\
  \n\n\n\n\n在接下来的章节中，我将重点介绍启动、停止和控制由 systemd 管理的服务。我将带你了解 systemd 技术的结构、命令和配置文件。\n\
  \n## 探索单元文件（Unit Files）\n\n探索 systemd 的简单方法是通过 `systemd units`（systemd 单元）。单元定义了一个、一组服务或一个操作。每个单元由名称、类型和配置文件组成。目前有\
  \ 12 种不同的 systemd 单元类型，如下：\n\n* `automount`\n* `device`\n* `mount`\n* `path`\n*\
  \ `scope`\n* `service`\n* `slice`\n* `snapshot`\n* `socket`\n* `swap`\n* `target`\n\
  * `timer`\n\n`systemctl` 工具是管理 systemd 和系统服务的的主要入口。它的基本语法如下：\n\n```\nsystemctl [OPTIONS...]\
  \ COMMAND [NAME...]\n```\n\n你可以使用 `systemctl` 工具来列出当前 Linux 系统中加载的各种单元。列表 6.4 显示了一个片段示例。\n\
  \n在 列表 6.4 中，你可以看到各种单元以及额外信息。单元通过 `name.type` 格式的名称和类型标识。系统服务（守护进程）具有 `.service`\
  \ 后扩展单元文件。因此，安全 shell（ssh）守护进程 `sshd` 的单元名为 `sshd.service`。\n\n服务组通过目标（target）单元文件启动。在系统启动时，`default.target`\
  \ 单元负责确保在系统初始化时启动所有必需所需的服务。它被设置为指向另一个目标单元文件的符号链接，如 Ubuntu 发行版中的 列表 6.5 所示。\n\n首先，在\
  \ 列表 6.5 中，通过 `find` 工具找到 `default.target` 单元的完整文件名。然后使用 `readlink` 命令找到实际的目标文件，该文件决定了系统启动时启动哪些服务。在这种情况下，目标单元文件是\
  \ `graphical.target`。\n\n同时注意在 列表 6.5 中，`systemctl` 命令比其他两个命令要易用得多。只需执行 `systemctl\
  \ get-default`，它就会显示实际的目标文件。\n\n由于 `default.target` 文件在不同的发行版中位于不同的目录，因此最好始终使用 `systemctl`\
  \ 工具。表 6.1 显示了更常用的系统启动目标单元文件。\n\n| 名称 |  |\n| --- | --- |\n| `graphical.target`\
  \ | 允许多个用户通过本地终端和/或网络访问系统。提供图形用户界面 (GUI) 访问。 |\n| `multi-user.target` | 允许多个用户通过本地终端和/或网络访问系统。不提供\
  \ GUI 访问。 |\n| `network-online.target` | 提供一个在系统建立网络连接后运行的目标。这对于启动需要网络存在的应用有用。 |\n\
  | `runleveln.target` | 提供对 SysV init 系统的后兼容，其中 `n` 设置为 1–5，以对应所需的 SysV 运行级别。 |\n\
  \n表 6.1 常用的系统启动目标单元文件\n\n在 表 6.1 中，你会注意到 systemd 为经典的 SysV init 系统提供了后兼容性。SysV 运行级别将在本章后面的部分介绍。\n\
  \n## 专注于服务单元文件\n\n服务单元文件包含信息，例如使用哪个环境文件、何时必须启动服务、哪些目标想要启动此服务等。这些配置文件位于不同的目录。\n\n\
  请记住，单元配置文件的目录位置至关重要，因为如果在两个不同的目录位置找到文件，其中一个将优先另一个。以下列表显示了按优先级排序的目录位置：\n\n1. `/etc/systemd/system/`\n\
  2. `/run/systemd/system/`\n3. `/usr/lib/systemd/system/`\n\n要查看可用的各种服务单元，你可以再次使用\
  \ `systemctl` 工具。然而，与查看单元时所需的命令略有不同，如 列表 6.6 所示。\n\n除了单元文件的基础外，你还可以在 列表 6.6 中看到单元的状态。它们的状态被称为启用状态（enablement\
  \ states），指的是服务启动的时间。至少有 12 种不同的启用状态，但你通常会看到这三种：\n\n* `enabled`: 服务在系统启动时启动。\n*\
  \ `disabled`: 服务在系统启动时不启动。\n* `static`: 如果有其他单元依赖它，则服务启动。也可以手动启动。\n\n要查看哪个目录或哪些目录存储了特定的\
  \ systemd 单元文件，请使用 `systemctl` 工具。Ubuntu 发行版的示例见 列表 6.7。\n\n注意在 列表 6.7 中，`systemctl`\
  \ 命令比其他两个命令要易用得多。它只需执行 `systemctl get-default`，它就会显示实际的目标文件。\n\n对于单元文件，有三个主要部分：\n\
  \n* `[Unit]`\n* `[Service]`\n* `[Install]`\n\n`[Unit]` 部分包含如 表 6.2 所示的指令。\n\n| 指令\
  \ |  |\n| --- | --- |\n| `After` | 设置此单元在指定的单元之后启动。 |\n| `Before` | 设置此单元在指定的单元之前启动。\
  \ |\n| `Description` | 描述该单元。 |\n| `Documentation` | 设置指向文档源的统一资源标识符 (URI) 列表。这些\
  \ URI 可以网络位置、特定的系统文件、info 页面和 man 页。 |\n| `Conflicts` | 设置此单元不与指定的单元一起启动。如果启动了任何指定的单元，则此单元将不启动。（`Requires`\
  \ 的相反。） |\n| `Requires` | 设置此单元与指定的单元一起启动。如果任何指定的单元未启动，则此单元将不启动。（`Conflicts` 的相反。）\
  \ |\n| `Wants` | 设置此单元与指定的单元一起启动。如果任何指定的单元未启动，此单元仍会启动。 |\n\n表 6.2 常用的服务单元 `[Unit]`\
  \ 部分指令\n\n单元文件中的 `[Service]` 指令设置了特定于该服务的配置项。更常用的 `[Service]` 指令在 表 6.3 中描述。\n\n\
  | 指令 | | |\n| --- | --- |\n| `ExecReload` | 指在单元重载时运行的脚本或命令（以及选项）。 |\n| `ExecStart`\
  \ | 指在单元启动时运行的脚本或命令（以及选项）。 |\n| `ExecStop` | 指在单元停止时运行的脚本或命令（以及选项）。 |\n| `Environment`\
  \ | 设置环境变量替换值，用空格分隔。 |\n| `Environment File` | 指向一个包含环境变量替换值的文件。 |\n| `RemainAfterExit`\
  \ | 设置为 `no`（默认）或 `yes`。如果设置为 `yes`，即使由 `ExecStart` 启动的进程终止，服务也保持激活状态。如果设置为 `no`，则当由\
  \ `ExecStart` 启动的进程终止时调用 `ExecStop`。 |\n| `Restart` | 当 `ExecStart` 启动的进程终止时重启服务。如果发布了\
  \ `systemctl restart` 或 `systemctl stop` 命令，则忽略此设置。设置为 `no`（默认）、`on-success`、`on-failure`、`on-abnormal`、`on-watchdog`、`on-abort`\
  \ 或 `always`。 |\n| `Type` | 设置启动类型。 |\n\n表 6.3 常用的服务单元 `[Service]` 部分指令\n\n\n\n\n\
  `[Service] Type` 指令需要比表 6.3 中提供的更多的解释。该指令可以设置为至少六种不同的规范，这里列出了最常见的几种：\n\n* `forking`:\
  \ `ExecStart` 启动一个父进程。父进程创建服务的主进程作为子进程并退出。\n* `simple`:（默认）`ExecStart` 启动服务的主进程。\n\
  * `oneshot`: `ExecStart` 启动服务的主进程，该进程通常是一个配置设置或快速命令，执行后退出。\n* `idle`: `ExecStart`\
  \ 启动服务的主进程，但它会等待所有其他启动作业完成。\n\n另一个需要额外解释的 `[Service]` 配置设置是 `Environment` 指令。Linux\
  \ 系统使用一种名为“环境变量”的特性来存储有关 shell 会话和工作环境的信息（因此得名环境变量）。如果你想确保为你的服务正确设置特定的环境变量，你将需要使用\
  \ `Environment` 指令。在 Rocky Linux 发行版上的示例代码见列表 6.8。\n\n在列表 6.8 中，你可以看到 `PATH` 环境变量的内容。该环境变量是一个冒号分隔的目录列表，进程会在其中查找命令。`anaconda.service`\
  \ 单元文件使用 `Environment` 指令将特定的环境变量设置为其所需的的环境参数。这些参数之间用空格分隔。你可以在列表 6.8 中看到由 `Environment`\
  \ 指令设置的参数之一是 `PATH`。\n\n单元文件中的 `[Install]` 指令决定了当特定服务被启用或禁用时会发生什么。`启用服务（enabled\
  \ service）`是指在系统启动时启动的服务。`禁用服务（disabled service）`是指*不会*在系统启动时启动的服务。更常用的 `[Install]`\
  \ 部分指令在表 6.4 中进行了描述。\n\n| 指令 | 描述 |\n| --- | --- |\n| `Alias` | 设置额外的名称，可在 `systemctl`\
  \ 命令中表示该服务。 |\n| `Also` | 设置必须为该服务启用或禁用的额外单元。通常额外单元是 socket 类型单元。 |\n| `RequiredBy`\
  \ | 指定需要此服务的其他单元。 |\n| `WantedBy` | 指定哪个目标单元管理此服务。 |\n\n表 6.4 常用的服务单元文件 `[Install]`\
  \ 部分指令\n\n### 关注目标单元文件\n\n对于 systemd，你需要理解服务单元文件，还需要目标单元文件。目标单元文件的主要目的是将各种服务组合在一起以便在系统启动时启动。默认目标单元文件\
  \ `default.target` 是系统启动时使用的目标单元文件的符号链接。在列表 6.9 中，使用 `systemctl` 命令定位并显示默认目标单元文件。\n\
  \n注意列表 6.9 中的 `graphical.target` 单元文件与服务单元文件有许多相同的指令。这些指令在表 6.2 中已经描述过。当然，这些指令适用于目标类型单元文件而不是服务类型单元文件。例如，`graphical.target`\
  \ 单元文件中的 `After` 指令设置该目标单元在指定的单元（如 `multi-user.target`）之后启动。目标单元类似于服务单元，也有各种目标依赖链以及冲突。\n\
  \n在列表 6.9 中，有一条我尚未涵盖的指令。`AllowIsolate` 指令如果设置为 `yes`，则允许此目标文件配合 `systemctl isolate`\
  \ 命令使用。该命令将在本章稍后的部分介绍。\n\n## 查看 `systemctl`\n\n你可能已经注意到，虽然有各种命令可以管理 systemd 和系统服务，但使用\
  \ `systemctl` 实用程序更加简单快速。\n\n有几个基础的 `systemctl` 命令可供你管理系统服务。其中常用的是 `status` 命令。它提供了丰富的信息。在\
  \ Ubuntu 发行版上的几个示例代码见列表 6.10。\n\n在列表 6.10 中，第一个 `systemctl` 命令显示了 `cron` 服务的状态。注意实用程序输出的第三行。它表明该服务处于\
  \ `disabled`（禁用）。第四行说明服务为 `inactive`（未激活）。本质上，这意味着 `cron` 服务没有运行（`inactive`），且没有配置在系统启动时启动（`disabled`）。`cron`\
  \ 服务状态中的另一个关注项是 `Loaded` 行。注意显示了单元文件的完整文件名和目录位置。\n\n`sshd` 服务的状态也被显示，显示 `sshd` 正在运行（`active`）并配置为系统启动时启动（`enabled`）。\n\
  \n你可以使用 `systemctl` 实用程序的几个简单命令来管理 systemd 服务并查看相关信息。更常用的命令列在表 6.5 中。这些 `systemctl`\
  \ 命令通常使用以下语法：\n\n```\nsystemctl COMMAND UNIT-NAME...\n```\n\n| 命令 | 描述 |\n| ---\
  \ | --- |\n| `daemon-reload` | 加载运行的指定单元的配置文件，以便在不停止服务的情况下更改单元文件配置。注意这与 `reload`\
  \ 命令不同。 |\n| `disable` | 标记指定的单元在系统启动时*不*自动启动。 |\n| `edit` | 编辑现有的单元文件并将保存的单元文件存储在\
  \ `/etc/systemd/system/servicename.service.d`。此文件在启动时会覆盖 `/lib/systemd/system` 中对应的文件。\
  \ |\n| `enable` | 标记指定的单元在系统启动时自动启动。 |\n| `mask` | 防止指定的单元启动。无法使用 `start` 命令或在系统启动时启动该服务。使用\
  \ `--now` 选项也可以立即停止任何实例。使用 `--running` 选项仅掩码服务直到下次重启或使用 `unmask`。 |\n| `restart`\
  \ | 停止并立即重启指定的单元。如果指定的单元尚未启动，则将启动它。 |\n| `start` | 启动指定的单元。 |\n| `status` | 显示指定单元的当前状态。\
  \ |\n| `stop` | 停止指定的单元。 |\n| `reload` | 加载运行的指定单元的服务配置文件，以便在不停止服务的情况下更改配置。注意这与\
  \ `daemon-reload` 命令不同。 |\n| `unmask` | 取消 `mask` 命令对指定单元的影响。 |\n\n表 6.5 常用的 `systemctl`\
  \ 服务管理命令\n\n注意表 6.5 中 `daemon-reload` 和 `reload` 命令之间的区别。这是一个重要的区别。如果你需要为运行的服务加载\
  \ systemd 单元文件的配置更改，请使用 `daemon-reload` 命令。使用 `reload` 命令加载修改后的服务配置文件。例如，如果你修改了\
  \ `ntpd` 服务的配置文件 `/etc/ntp.conf` 并希望让新配置立即生效，你可以在命令行执行 `systemctl reload ntpd` 命令。\n\
  \n除了表 6.5 中的命令外，还有其他实用的 `systemctl` 命令可以用于管理系统服务。Rocky Linux 发行版上的示例见列表 6.11。\n\n\
  \n\n\n\n在 Listing 6.11 中，使用 `systemctl` 及其 `stop` 命令停止了 OpenSSH 守护进程 (`sshd`)。这里没有使用\
  \ `status` 命令，而是使用 `is-active` 命令来快速显示服务已停止（`inactive`）。启动 OpenSSH 服务后，再次使用 `is-active`\
  \ 命令显示服务正在运行（`active`）。Table 6.6 显示了这些实的服务状态检查命令。\n\n| Command | Description |\n\
  | --- | --- |\n| `is-active` | 对运行中的服务显示 `active`，对任何处于失败状态的服务显示 `failed`。 |\n|\
  \ `is-enabled` | 对任何配置为系统启动时启动的服务显示 `enabled`，对任何未配置为系统启动时启动的服务显示 `disabled`。 |\n\
  | `is-failed` | 对任何处于失败状态的服务显示 `failed`，对运行中的服务显示 `active`。 |\n\nTABLE 6.6 方便 `systemctl`\
  \ 服务状态命令\n\n服务可能因为许多原因而失败：硬件问题、单元配置文件中缺失的依赖项、错误的权限设置等。你可以使用 `systemctl` 实用程序的 `is-failed`\
  \ 命令来查看特定服务是否失败。示例在 Listing 6.12 所示。\n\n在 Listing 6.12 中，你可以看到该特定服务已经失败了。实际上，这是由于在启动前断开网线导致的失败，因此你可以看到服务的\
  \ `failed` 状态。如果服务未处于失败状态，`is-failed` 命令将显示 `active` 状态。\n\n`systemctl` 程序是在排排除\
  \ systemd 问题（如单元名称解析问题和服务未按时启动）时一个非常实方便的工具。由于 systemd 启动方法可以控制你 Linux 系统的许多方面，因此了解\
  \ `systemctl` 具体能为你做什么是一个好主意。\n\n### 检查特殊的 systemd 命令\n\n`systemctl` 工具具有几个超出服务管理的命令。此外，systemd\
  \ 还有一些特殊命令。你可以管理系统启动时启动哪些目标（服务组），在不同的系统状态之间跳转，甚至分析你系统的启动时间性能。我将在本节中介绍这些不同的命令。\n\n\
  一个值得探索的特殊命令是 `systemctl is-system-running` 命令。示例在 Listing 6.13 所示。\n\n你可能认为这里返回的状态显而易见，但它意味着你的\
  \ Linux 系统目前一切正常。Table 6.7 显示了其他有用的状态。\n\n| Status | Description |\n| --- | ---\
  \ |\n| `running` | 系统完全运行正常。 |\n| `degraded` | 系统有一个或多个失败的单元。 |\n| `maintenance`\
  \ | 系统处于紧急或恢复模式。 |\n| `initializing` | 系统正在开始启动。 |\n| `starting` | 系统仍在启动中。 |\n\
  | `stopping` | 系统正在关闭。 |\n\nTABLE 6.7 `systemctl is-system-running` 运行状态\n\n`maintenance`\
  \ 运行状态将在本章稍后介绍。然而，如果你收到 `degraded` 状态，你应该检查你的单元以查看哪些失败了，并采取适当措施。使用 `systemctl --failed`\
  \ 命令找到失败的单元，如 Listing 6.14 片段所示。\n\n其他实用的 `systemctl` 实用程序命令涉及获取、设置和跳转系统目标。它们如下：\n\
  \n* `get-default`\n* `set-default`\n* `isolate`\n\n你已经已经在 Listing 6.5 中看到 `systemctl\
  \ get-default` 命令的作用了。该命令显示系统的默认目标。正如你可能猜的那样，你可以使用超级用户权限通过 `systemctl set-target`\
  \ 命令设置系统的默认目标。\n\n`isolate` 命令对于在系统目标之间跳转非常方便。当此命令与目标名称作为参数一起使用时，列出的目标未启用的服务和服务进程都将被停止。列出的目标已启用但未运行的服务和进程将启动。示例见\
  \ Listing 6.15。\n\n在 Listing 6.15 中，使用超级用户权限`systemctl isolate` 命令导致系统从默认系统目标跳转到多用户目标。遗憾的是，在这种情况下没有简单的命令可以显示你系统的当前目标。但是，`systemctl\
  \ status` 命令很有用。如果你使用该命令并给它上一个目标的名称（在此例中为 `graphical.target`），你应该看到它不再活动状态，因此不是当前系统目标。注意，状态显示中还显示了图形目标启动和停止的简短历史。\n\
  \n两个额外的特殊目标是 rescue 和 emergency。这些目标有时称为模式，在这里被描述：\n\n*   **救援目标（Rescue Target）**：当你将系统跳转到救援目标时，系统会挂载所有本地文件系统，仅允许\
  \ root 用户登录系统，网络服务被关闭，并且仅启动少数其他服务。`systemctl is-system-running` 命令将返回 `maintenance`\
  \ 状态。在此特定目标下，运行磁盘实用程序修复损坏的磁盘是一项实用的任务。\n*   **紧急目标（Emergency Target）**：当你的系统进入紧急模式时，系统仅挂载根文件系统并以只读方式挂载。与救援模式类似，它仅允许\
  \ root 用户登录系统，网络服务被关闭，仅启动少数其他服务。`systemctl is-system-running` 命令将返回 `maintenance`\
  \ 状态。如果你的系统自动进入紧急模式，说明存在严重问题。此目标用于即使无法进入救援模式的情况。\n\n请注意，如果你跳转到救援或紧急模式，你将只能登录 root\
  \ 账户。因此，你需要 root 账户密码。此外，你的屏幕可能会空白一分钟，所以不要慌。跳转到紧急模式的示例见 Listing 6.16。\n\n在 Listing\
  \ 6.16 中，使用 `systemctl` 命令跳转到紧急模式。注意，你不需要在紧急目标单元文件名上添加 `.target` 后缀。对于所有 systemd\
  \ 目标都是如此。一旦到达紧急模式，你必须在提示处输入 root 密码。一旦进入命令行，你可以输入欢迎显示中列出的命令，或尝试一些额外的 `systemctl`\
  \ 命令。\n\n注意在 Listing 6.16 中，当执行 `systemctl is-system-running` 命令时，响应是 `maintenance`\
  \ 而不是 `running`。此外，当使用 `list-units` 命令时，显示 `emergency.target` 是激活的。`systemctl default`\
  \ 命令将导致系统尝试跳转到默认目标。\n\n一个方便 systemd 组件是 `systemd-analyze` 实用程序。通过该工具，你可以调查系统的启动性能并检查潜在的系统初始化问题。Table\
  \ 6.8 包含了你可以与 `systemd-analyze` 实用程序一起常用的命令。\n\n| Command | Description |\n| ---\
  \ | --- |\n| `Blame` | 显示每个运行单元初始化所需的时间。按从慢到快的顺序列表。 |\n| `time` | 显示系统初始化在内核和初始内存文件系统中花费的时间，以及普通系统用户空间初始化所需的时间。（默认值）\
  \ |\n| `critical-chain` | 以树形格式显示时间关键单元。可以传递一个单元文件参数，将信息集中在该特定单元上。 |\n\n\n\n\n\n\
  | `Dump` | 显示有关所有单元的信息。显示格式可能会在不另通知的情况下更改，因此仅供人类查看。 |\n| `verify` | 扫描单元文件，如果发现任何错误则显示警告消息。可以接受单元文件名作为参数，但遵循目录位置的优先级。\
  \ |\n\n**常用的表 6.8 `systemd-analyze` 命令**\n\n请注意，某些较长的 `systemd-analyze` 输出会被通过到\
  \ `less` 分页器程序。你可以通过使用 `--no-pager` 选项关闭该功能。在列表 6.17 中，使用超级用户权限展示了其中一些 `systemd-analyze`\
  \ 命令的执行情况。\n\n在列表 6.17 中使用的第一个命令允许你检查系统中所有单元文件是否存在问题。第二个命令只检查 `sshd.service` 单元文件。如果你在执行这两个命令后只收到返回提示，则表示没有发现任何错误。\n\
  \n在列表 6.17 中的第三个命令提供了有关系统初始化时间的信息。请注意，你可以省略 `time` 关键字，`systemd-analyze` 工具仍然会显示系统初始化时间，因为这是工具的默认操作。\n\
  \n在列表 6.17 中的最后一个命令使用了 `blame` 命令。此显示从初始化耗时最长的单元开始。列表的底部是初始化最快的单元。它是排查初始化问题的方便指南。现在，如果能用\
  \ `systemd-analyze blame` 来分析你那些总是迟到的朋友就好了了。\n\nsystemd 的初始化方法对于运行 Linux 系统及其服务来说是灵活且可靠的。前面的部分概述了管理由\
  \ systemd 初始化系统的方法和命令。\n\n## 管理 SysV init 系统\n\n许多服务器管理员都经历过从 SysV init 系统迁移到 systemd\
  \ 系统的过程。记住，systemd 与 SysV init 向后兼容，因此理解 SysV init 是重要的。\n\n首先，如果你想在不受 systemd 或已废弃的\
  \ Upstart 干扰的情况下尝试原始的 SysV init 命令，请找到使用 SysV init 初始化方法的 Linux 发行版。找到它的方法是访问 DistroWatch\
  \ 网站并使用其搜索工具 `https://distrowatch.com/search.php`。滚动到“按发行版标准搜索”部分，在 Init 软件中选择 `SysV`。任何在使用\
  \ SysV init 的 Linux 发行版都将在搜索结果中显示。\n\n为了本书提供清晰的 SysV init 列表，我使用了过去的 Linux 发行版 Fedora\
  \ 7。要获取此旧发行版的 ISO 副本，请访问 `https://archives.fedoraproject.org/pub/archive/fedora/linux/releases`。\n\
  \n下一节将为你提供足够的 SysV init 知识，帮助你完成 Linux 服务器迁移到 systemd 的过程。\n\n### 理解运行级别 (Runlevels)\n\
  \n在系统启动时，SysV init 使用运行级别（runlevels）而不是目标（targets）来决定启动哪些服务组。这些运行级别定义在表 6.9 和表 6.10。注意不同的发行版使用不同的运行级别定义。\n\
  \n| 运行级别 | 描述 |\n| :--- | :--- |\n| 0 | 关闭系统。 |\n| 1, s 或 S | 用于系统维护的单用户模式。 |\n\
  | 2 | 未启用网络服务的多用户模式。 |\n| 3 | 启用了网络服务的多用户模式。| |\n| 4 | 自定义。 |\n| 5 | 可用 GUI 多用户模式。\
  \ |\n| 6 | 重启系统。 |\n\n**表 6.9 基于 Red Hat 的发行版 SysV init 运行级别**\n\n| 运行级别 | 描述 |\n\
  | :--- | :--- |\n| 0 | 关闭系统。 |\n| 1 | 用于系统维护的单用户模式。 |\n| 2 | 可用 GUI 多用户模式。 |\n|\
  \ 6 | 重启系统。 |\n\n**表 6.10 基于 Debian 的发行版 SysV init 运行级别**\n\n注意运行级别 0 和 6 从定义上并不是运行级别。相反，它们表示从当前系统状态到所需状态的转换。例如，一个当前运行在运行级别\
  \ 5 的运行系统可以通过运行级别 0 转换到关机状态。\n\n要确定系统当前和以前的运行级别，你使用 `runlevel` 命令。显示的第一个数字或字母表示之前的运行级别（`N`\
  \ 表示系统为新启动），第二个数字表示当前运行级别。列表 6.18 显示了一个新启动的基于 Red Hat 的 SysV init 系统的示例，它运行在运行级别\
  \ 5。\n\nSysV init 系统不使用像 systemd 那样的默认目标，而是使用一个配置文件 `/etc/inittab`。该文件曾用于启动许多不同的服务，但在后多年里，它只启动终端服务并定义系统的默认运行级别。定义默认运行级别的文件行如列表\
  \ 6.19 所示。\n\n在列表 6.19 中，注意 `/etc/inittab` 文件记录中 `id:` 和 `:initdefault:` 之间的数字 `5`。这表示系统的默认运行级别是\
  \ 5。`initdefault` 指定了系统启动后进入的运行级别。\n\n设置默认运行级别是配置某些服务在系统初始化时启动的第一步。接下来，每个服务必须有一个初始化脚本，通常位于\
  \ `/etc/init.d/` 目录。列表 6.20 显示了该目录下各种脚本的片段示例。注意在 `ls` 命令上使用了 `-1F` 选项，以单列显示脚本并附上文件指示代码。`*`\
  \ 文件指示代码表示这些文件是可执行程序（在此例中为 Bash shell 脚本）。\n\n这些初始化脚本负责各种系统服务的启动、停止、重启、重新加载和显示状态显示。调用这些初始化脚本的程序是\
  \ `rc` 脚本，它可以存在于 `/etc/init.d/` 或 `/etc/rc.d/` 目录中。`rc` 脚本运行特定目录下的脚本。所选的目录取决于所需的运行级别。每个运行级别在\
  \ `/etc/rc.d/` 目录下都有自己的子目录，如列表 6.21 所示。\n\n在列表 6.21 中注意，有七个名为 `rc*n*`.d` 的子目录，其中\
  \ `n` 是 0 到 6 的数字。`rc` 脚本运行所需运行级别的 `rc*n*`.d` 子目录下的脚本。例如，如果所需的运行级别是 3，则 `/etc/rc.d/rc3.d/`\
  \ 目录下的所有脚本都会运行。列表 6.22 显示了该目录下脚本的片段。\n\n在列表 6.22 中注意，脚本名称以 `K` 或 `S` 开头，后面跟着数字，然后是服务名称。`K`\
  \ 代表 kill（停止），`S` 代表 start（启动）。数字表示该服务在该运行级别应停止或启动的顺序。这与 systemd 服务类型单元文件中的 `After`\
  \ 和 `Before` 指令有些相似。\n\n`/etc/rc.d/rc*n*`.d/` 目录下的文件都是指向 `/etc/init.d/` 目录下脚本的符号链接。列表\
  \ 6.23 显示了此示例。\n\n`rc` 脚本首先遍历并运行所有的 `K` 脚本，向每个脚本传递一个 `stop` 参数。然后它运行所有的 `S` 脚本，向每个脚本传递一个\
  \ `start` 参数。这不仅确保了为特定运行级别启动适当的服务，还允许在系统初始化后在运行级别之间跳转，从而为新运行级别停止并启动某些服务。\n\n\n\n\
  \n\n脚本是 SysV init 过程的核心。要理解 SysV init 脚本，请务必先阅读第 25 章“部署 Bash 脚本](#c025.xhtml_c025)”。该章节将帮助你理解\
  \ Bash shell 脚本的基础知识，反过来也能帮助你理解 SysV init 脚本的内容。\n\n#### 调查 SysV init 命令\n\n各种 SysV\
  \ init 命令有助于启动和停止服务、管理在不同运行级别（runlevels）下部署的服务，以及在已运行的 Linux 系统在不同的运行级别之间跳转。在本节中我介绍了各种\
  \ SysV init 命令。\n\n在运行级别之间跳转与在 systemd 目标之间跳转略有不同。它使用 `init` 或 `telinit` 实用程序。这两个实用程序本质上是双胞胎，可以相互替换。在\
  \ SysV init 系统上跳转运行级别，基本语法如下：\n\n```\ninit Destination-Runlevel\ntelinit Destination-Runlevel\n\
  ```\n\n列表 6.24 展示了从当前运行级别 5 跳转到目标运行级别 3 的示例。注意，`runlevel` 命令用于显示之前的和当前的运行级别。\n\n\
  要查看 SysV init 管理的服务状态并控制其当前是否运行，请使用 `service` 实用程序。该实用程序具有以下基本语法：\n\n```\nservice\
  \ SCRIPT COMMAND [OPTIONS]\n```\n\n`service` 实用程序中的 `SCRIPT` 指 `/etc/init.d/` 目录下的特定服务脚本。`service`\
  \ 实用程序执行该脚本，并向传递指定的 `COMMAND`。服务脚本通常与服务的名称相同。此外，你只需要提供脚本的基本名称，而不需要提供目录位置。例如，对于 NTP\
  \ 服务脚本 `/etc/init.d/ntpd`，你只需要使用 `ntpd` 基本名称。\n\n表 6.11 描述了在 `service` 实用程序的 `COMMAND`\
  \ 部分可以使用的各种常用项目。请记住，如果 `COMMAND` 未被脚本处理，或者处理方式与通常不同，你将得到意想不到的结果。\n\n| 命令 | 描述 |\n\
  | --- | --- |\n| `restart` | 停止并立即重启指定的服务。注意，如果指定的服务尚未启动，在尝试停止时将生成 `FAILED` 状态，然后启动该服务。\
  \ |\n| `Start` | 启动指定的服务。 |\n| `status` | 显示指定服务的当前状态。 |\n| `Stop` | 停止指定的服务。注意，如果指定的服务已经停止，在尝试停止时将生成\
  \ `FAILED` 状态。 |\n| `reload` | 加载正在运行的指定服务的配置文件。这允许你在不停止服务的情况下更改服务配置。注意，如果对已停止的服务尝试\
  \ reload 命令，将生成 `FAILED` 状态。 |\n\n表 6.11 常用的 `service` 实用程序命令\n\n查看 `service` 实用程序的实际运行示例将有所帮助。列表\
  \ 6.25 提供了几个供你复阅。\n\n列表 6.25 中的最后一个 `service` 实用程序示例值得注意。该命令允许你查看系统上的所有服务及其当前状态。请记住，此列表滚动得很快，因此建议将其标准输出（STDOUT）重定向到\
  \ `less` 分页器实用程序，以便你可以更舒适地查看显示。\n\n要配置各种服务在不同的运行级别启动，有两种不同的命令可以使用。使用的命令取决于你使用的发行版。对于使用\
  \ SysV init 的 Red Hat 系发行，你需要使用 `chkconfig` 实用程序。对于使用 SysV init 的 Debian 系 Linux\
  \ 发行版，可以使用 `update-rc.d` 程序。\n\n`chkconfig` 实用程序有多种格式。它们允许你检查服务将在哪些运行级别启动或不启动。此外，你还可以针对特定的运行级别启用（系统启动时启动）或禁用（系统启动时不启动）特定服务。表\
  \ 6.12 显示并描述了这些各种常用的 `chkconfig` 实用程序格式。\n\n| 命令 | 描述 |\n| --- | --- |\n| `chkconfig`\
  \ `service` | 检查 `service` 在当前运行级别是否启用。如果是，命令返回真 (`0`)。如果否，命令返回假 (`1`)。 |\n| `chkconfig`\
  \ `service` `on` | 在当前运行级别启用 `service`。 |\n| `chkconfig` `service` `off` | 在当前运行级别禁用\
  \ `service`。 |\n| `chkconfig --add` `service` | 在运行级别 0–6 上启用此 `service`。 |\n| `chkconfig\
  \ --del` `service` | 在运行级别 0–6 上禁用此 `service`。 |\n| `chkconfig --levels [levels]`\
  \ `service` `on/off` | 在运行级别 0–6 上启用 (`on`) 或禁用 (`off`) 此 `service`。 |\n| `chkconfig\
  \ --levels` `service` | 显示运行级别以及 `service` 是否启用或禁用。 |\n\n表 6.12 常用的 `chkconfig`\
  \ 实用程序命令\n\n（注：原文中存在大量重复段落，已根据指令“不要重复输出原文”进行去重处理）\n\n\n\n\n\n使用 systemd 的发行版具有额外的选项来持久化挂载文件系统。可以在\
  \ `/etc/fstab` 文件或挂载单元（mount unit）文件中指定文件系统。挂载单元文件为 systemd 挂载和控制指定的文件系统提供配置信息。\n\
  \n每个挂载点都会创建一个挂载单元文件，文件名包含挂载点的绝对目录引用。然而，绝对目录引用会移除开前的正斜杠（`/`），将后续的正斜杠转换为连字符（-），并移除任何末尾的正斜杠。挂载单元文件名带有\
  \ `.mount` 扩展名。例如，挂载点 `/home/temp/` 对应的挂载单元文件名为 `home-temp.mount`。\n\n挂载单元文件的内容模仿其他\
  \ systemd 单元文件，但包含几个特殊的区域和选项。在列表 6.28 中，展示了一个使用 `/home/temp/` 挂载点的挂载单元文件示例。\n\n\
  注意，该文件具有单元典型的三个部分，其中中间部分 `[Mount]` 包含特定挂载类型单元文件的指令。`What` 指令可以使用设备文件名或通用唯一标识符（UUID），例如\
  \ `/dev/disk/by-uuid/`UUID。\n\n`SloppyOptions` 指令非常有用，因为如果设置为 `on`，它将忽略任何特定文件系统类型不支持的挂载选项。默认情况下设置为\
  \ `off`。另一个有用的指令是 `TimeOutSec`。如果 `mount` 命令没有在指定的秒数内完成，则挂载被视为操作失败。\n\n确保包含 `[Install]`\
  \ 区域，并将 `WantedBy` 或 `RequiredBy` 指令设置为所需的 target（target）。如果你不这样做，文件系统在服务器启动时不会挂载。\n\
  \n你可以使用标准的 `systemctl` 工具命令手动挂载和卸载该单元。列表 6.29 包含一个部署 `home-temp.mount` 单元文件的示例。\n\
  \n在列表 6.29 中，第一条命令加载新配置的挂载单元文件。第二条命令让 systemd 使用 `home-temp.mount` 单元文件挂载文件系统。第二条命令与启动服务的方式类似，因为它使用了\
  \ `start` 命令。虽然你不需要提供 `home-temp.mount` 参数且命令在没有它的情况下也能工作，但（a) 该参数为所讨论的情况增加了清晰度/教育意义，且\
  \ (b) 该参数防止了其他服务被重新加载，如果重启了其他服务，可能会导致问题。\n\n为了确保文件系统已正确挂载（像服务单元一样），你使用 `systemctl`\
  \ 工具获取已挂载文件系统的状态。列表 6.30 中显示了一个示例。\n\n还需要一个额外的步骤。为了确保 systemd 将持久化挂载文件系统，必须启用挂载单元文件在启动时运行，就像其他\
  \ systemd 单元一样。列表 6.31 中显示了一个示例。\n\n这些看起来应该非常熟悉！请记住，只有在你需要调整持久化文件系统配置时才应该使用挂载单元文件。如果你不需要，最好使用\
  \ `/etc/fstab` 记录来持久化挂载文件系统。\n\n### 探索自动挂载单元 (Automount Units)\n\n通过 systemd，你还可以使用自动挂载单元来配置“按需挂载”以及并行挂载。此外，你还可以设置文件系统在无活动时自动卸载。\n\
  \n自动挂载单元文件的工作与挂载单元文件类似。命名约定相同，只是文件扩展名为 `.automount`。\n\n在自动挂载单元文件中，对于 `[Automount]`\
  \ 区域，只有以下三个指令可用：\n\n* `Where`\n* `DirectoryMode`\n* `TimeOutIdleSec`\n\n`Where`\
  \ 指令是必需的。它的配置方式与挂载单元文件中的完全相同。通过该指令，你设置挂载点。\n\n`DirectoryMode` 指令不是可选选项。此设置决定了赋予任何自动创建的挂载点和父目录的权限。默认它设置为八进制代码\
  \ `0755`。\n\n`TimeOutIdleSec` 指令也不是必需的。此特定指令允许你设置挂载文件系统可以空闲的最大时间（秒）。一旦达到时间限制，文件系统将被卸载。默认情况下此指令被禁用。\n\
  \n### 聚焦定时器单元文件 (Timer Unit Files)\n\n定时器单元文件允许你定义在特定日期或时间发生的事件，类似于 `cron` 程序的工作方式（参见第\
  \ 26 章，“自动化作业”）。然而，定时器单元文件允许你精确调整程序启动的时间。\n\n定时器单元文件由 `.timer` 文件扩展名指定，并包含一个 `[Timer]`\
  \ 区域以定义确定何时启动事件所需的指令。表 6.13 描述了这些指令。\n\n| 指令 | 描述 |\n| --- | --- |\n| `AccuracySec`\
  \ | 指定定时器的精度。默认精度为一分钟。 |\n| `OnActiveSec` | 定义相对于定时器激活时刻的定时器。 |\n| `OnBootSec` |\
  \ 定义相对于系统启动时间的定时器。 |\n| `OnCalendar` | 将定时器定义为特定的日期/时间。 |\n| `OnStartupSec` | 定义相对于\
  \ systemd 程序启动时间的定时器。 |\n| `OnUnitActiveSec` | 定义相对于定时器单元上一次激活时间的定时器。 |\n| `OnUnitInactiveSec`\
  \ | 定义相对于定时器单元最后一次去激活时间的定时器。 |\n| `Persistent` | 设置后，定时器单元上一次触发的时间将存储在磁盘上。 |\n|\
  \ `RandomizedDelaySec` | 通过随机时间量延迟定时器的激活。 |\n| `RemainAfterElapse` | 设置后，过期的定时器单元保持加载状态，允许你使用\
  \ `systemctl` 查询其状态。 |\n| `Unit` | 定义在定时器结束时启动的单元文件。 |\n| `WakeSystem` | 设置后，定时器单元将导致系统从挂起状态恢复。\
  \ |\n\n表 6.13 常用的定时器单元文件 `[Timer]` 区域指令\n\n如你从表 6.13 所示，定时器单元为设置定时器提供了多种选项。这允许你精确选择程序在系统上何时启动。\n\
  \n## 总结\n\n管理服务器的最终系统初始化阶段是初始化守护进程的工作。该守护进程必须根据你在适当配置文件中提供的信息确定要启动哪些服务。此外，守护进程可以在系统运行时管理服务。\n\
  \n经典的系统初始化守护进程 SysV init 仍然存在，尽管通常只于旧版发行版中。流行的现代 systemd 在当前的 Linux 发行版中被广泛。它不仅允许更快的服务器启动速度，还提供了额外的服务，例如文件系统的自动挂载。管理员经常发现自己从\
  \ SysV init 系统迁移到 systemd 服务器，因此理解两种系统初始化方法都是重要的。\n\n## 考试要点\n\n**描述 `init` 程序。**\
  \ `init` 程序或 systemd 都是 Linux 系统上每个服务的父进程。它的 PID 通常为 1。该程序位于 `/etc/`、`/bin/` 或 `/sbin/`\
  \ 目录。在 systemd 服务器上，此程序是到 `/usr/lib/systemd/systemd` 的符号链接。\n\n**总结 systemd 单元概念。**\
  \ systemd 单元定义了一个服务、一组服务或一个操作，目前有 12 种不同的 systemd 单元类型。要查看加载的单元，使用 `systemctl list-units`\
  \ 命令。需要关注的 systemd 单元是 service、target、mount 和 automount。\n\n\n\n\n\n# 解释 systemd\
  \ 服务单元及其文件。\n服务单元（Service units）控制服务的启动、停止和管理。它们的单元文件通过三个主要单元文件部分之一：`[Unit]`、`[Service]`\
  \ 和 `[Install]` 中的指令来包含配置信息。诸如 `After` 和 `Before` 等指令配置了服务启动的时机。虽然 `[Unit]` 和 `[Install]`\
  \ 文件部分是所有单元文件共有的，但 `[Service]` 部分及其指令是服务特有的。单元文件可能存在于三个目录位置之一，其所在的位置非常重要，因为如果某个特定单元存在多个文件，将根据它们所处的位置产生优先级顺序。\n\
  \n# 解释 systemd 目标单元及其文件。\n目标单元（Target units）负责启动一组服务。在系统初始化时，`default.target` 单元确保所有必需和所需的服务已启动。它被设置为指向另一个目标单元文件的符号链接。用于系统初始化的主要目标单元有\
  \ `graphical.target`、`multi-user.target` 和 `runlevel-n.target`，其中 `n` = 1–5 表示所需的\
  \ SysV init 运行级别体验。还有额外的目标单元用于处理系统关机、停止、重启以及紧急和救援模式。目标类型单元文件与服务单元文件类似，但通常包含的指令较少。\n\
  \n## 演示如何通过命令管理 systemd 系统。\n`systemctl` 工具包含许多允许你管理和控制 systemd 单元的命令。你可以使用 `systemctl\
  \ isolate` 命令在不同目标之间切换。你可以通过 `systemctl enable` 命令设置特定服务在系统启动时启动，反之则通过 `systemctl\
  \ disable` 命令将其禁用。额外的命令允许你启动、停止、重启和重载单元，并通过 `systemctl daemon-reload` 命令重载它们的单元文件。诸如\
  \ `systemctl is-system-running` 和 `systemctl get-default` 等有用命令可以帮助你评估当前的 systemd\
  \ 系统。你可以使用 `systemd-analyze` 系列命令来评估服务器的初始化过程并寻找改进方法。\n\n## 总结 SysV init 概念。\n经典的\
  \ SysV init 方法由 `/etc/inittab` 文件组成，该文件通过 `initdefault` 记录设置默认运行级别（runlevel）。运行级别决定了哪些服务被启动，而默认运行级别决定了在系统初始化时启动哪些服务。`rc`\
  \ 脚本根据所选的运行级别启动和停止服务。它在相应的运行级别目录下执行脚本并传递相应的 `stop` 或 `start` 参数。位于各个运行级别目录下的脚本是\
  \ `/etc/init.d/` 目录下文件的符号链接。\n\n## 演示如何通过命令管理 SysV init 系统。\n你可以通过 `runlevel` 命令确定\
  \ SysV init 系统的上和当前运行级别。可以通过 `init` 或 `telinit` 命令跳转到运行级别。可以通过 `status` 命令检查服务的状态；重载其配置文件；或停止、启动或重启服务。你可以通过\
  \ `service --status-all` 命令查看 SysV init 系统上所有当前加载的服务。根据你的发行版，可以通过 `chkconfig` 或\
  \ `update-rc.d` 命令启用或禁用服务。\n\n## 描述 systemd 挂载（mount）和自动挂载（automount）单元文件。\n如果你的服务器采用\
  \ systemd，除了管理系统初始化外，它还可以持久地挂载文件系统。这些文件系统可以通过关联的单元文件进行挂载或自动挂载。挂载和自动挂载单元的文件基于文件系统的挂载点，但分别使用\
  \ `.mount` 或 `.automount` 扩展名。它们的单元文件包含三个部分，与服务单元文件类似，不同之处挂载单元文件的中间部分是 `[Mount]`，而自动挂载单元文件的中间部分是\
  \ `[Automount]`。每个单元文件都有自己的特殊指令，指定哪个分区应该挂载到挂载点，以及其他项目，例如对于自动挂载单元，文件系统在被卸载前必须空闲多久。\n\
  \n## 复习题\n\n你可以在 附录 A 中找到复习题的答案。\n\n1. init 程序可能位于以下哪些目录？（选择所有适用项）\n\n    1. `/etc/rc.d/`\n\
  \    2. `/etc/`\n    3. `/sbin/`\n    4. `/usr/lib/systemd/`\n    5. `/bin/`\n\n\
  2. 关于 systemd 服务单元，以下哪项是正确的？（选择所有适用项）\n\n    1. 服务可以在系统启动时启动。\n    2. 服务可以并行启动。\n\
  \    3. 服务可以根据定时器启动。\n    4. 服务可以在所有其他服务启动后启动。\n    5. 服务可以被防止在系统启动时启动。\n\n3. 以下哪个不是\
  \ systemd 目标单元？\n\n    1. `runlevel7.target`\n    2. `emergency.target`\n    3.\
  \ `graphical.target`\n    4. `multi-user.target`\n    5. `rescue.target`\n\n4. 你需要修改\
  \ systemd 服务单元配置。修改后的文件应该位于何处？\n\n    1. `/etc/system/systemd/`\n    2. `/usr/lib/system/systemd/`\n\
  \    3. `/etc/systemd/system/`\n    4. `/usr/lib/systemd/system/`\n    5. `/run/system/systemd/`\n\
  \n5. 在你的服务器上，你需要 Service-B 在 Service-A 之前立即启动。在 systemd Service-A 单元配置文件中，你应该检查并可能修改哪个指令？\n\
  \n    1. `Conflicts`\n    2. `Wants`\n    3. `Requires`\n    4. `Before`\n    5.\
  \ `After`\n\n6. 在单元配置文件中设置环境参数时，你可能应该采用哪些指令？（选择所有适用项）\n\n    1. `Type`\n    2. `Environment`\n\
  \    3. `EnvironmentParam`\n    4. `EnvironmentFile`\n    5. `PATH`\n\n7. 你尝试使用\
  \ `systemctl isolate` 命令跳转到 systemd 目标，但它不起作用。你决定查看目标单元文件。你可能会在那里看到什么导致了这个问题？\n\n\
  \    1. `static`\n    2. `AllowIsolate=yes`\n    3. `Type=oneshot`\n    4. `AllowIsolate=no`\n\
  \    5. `disabled`\n\n8. 你修改了 OpenSSH 服务的配置文件 `/etc/ssh/ssh_config`。该服务已经在运行。使用\
  \ `systemctl` 的哪个命令最好可以使修改后的文件立即生效？\n\n    1. `reload`\n    2. `daemon-reload`\n\
  \    3. `restart`\n    4. `mask`\n    5. `unmask`\n\n9. 你的系统使用 systemd，且当前有一个服务被设置为在系统启动时不启动。你想更改此行为让其启动。对于该服务你应该使用哪个\
  \ systemctl 命令？\n\n    1. `restart`\n    2. `start`\n    3. `isolate`\n    4. `disable`\n\
  \    5. `enable`\n\n10. 你需要更改默认目标。你应该使用哪个 systemctl 命令完成此任务？\n\n    1. `get-default`\n\
  \    2. `set-default`\n    3. `isolate`\n    4. `is-enabled`\n    5. `is-active`\n\
  \n11. 你的 systemd 系统启动时间很久，你需要缩短启动时间。哪个 systemd-analyze 命令最适合找出需要调查哪些单元？\n\n    1.\
  \ `time`\n    2. `dump`\n    3. `failure`\n    4. `blame`\n    5. `verify`\n\n12.\
  \ 你旧的基于 Debian 的 Linux 分系统使用 SysV init。它很快将升级到使用 systemd 的 Debian 发行版。为了开始分析，你输入了\
  \ runlevel 命令。你可能会看到哪些结果？（选择所有适用项）\n\n    1. `N 5`\n    2. `3 5`\n    3. `N 2`\n\
  \    4. `2 3`\n    5. `1 2`\n\n13. 你最近成为了一台旧 Linux 服务器的系统管理员，该服务器仍使用 SysV init。你确定其默认运行级别是\
  \ 3。你在哪个文件中找到此信息的？\n\n    1. `/etc/inittab`\n\n\n\n\n2. `/etc/rc.d`\n3. `/etc/init.d/rc`\n\
  4. `/etc/rc.d/rc`\n5. `/etc/rc.local`\n\n14. 在旧的 SysV init 系统中，哪个目录存储了服务启动脚本？\n\
  1. `/usr/lib/systemd/system/`\n2. `/etc/rc.d/rc.d/`\n3. `/etc/init.d/`\n4. `/etc/systemd/system/`\n\
  5. `/run/systemd/system/`\n\n15. 你正在管理一个 SysV init 系统，并且需要在运行级别（runlevel）1 上执行某些紧急维护。为了做到，你需要切换运行级别。你可以使用哪个命令？（选择所有适用项）\n\
  1. `telinit S`\n2. `telinit 1`\n3. `init one`\n4. `init s`\n5. `init 1`\n\n16. 客户投诉说你的\
  \ SysV init 系统上的某个服务无法工作。以下哪个命令是检查该服务的最佳命令？\n1. `service start`\n2. `service status`\n\
  3. `service --status-all`\n4. `service stop`\n5. `service reload`\n\n17. 你需要在基于\
  \ Red Hat 的 SysV init 系统在运行级别 3 和 5 上启用 DHCP 服务。你应该使用以下哪个命令？\n1. `service enable\
  \ dhcp 3,5`\n2. `chkconfig --levels 3,5 dhcp on`\n3. `chkconfig --levels 35 on dhcp`\n\
  4. `chkconfig --levels 35 dhcp on`\n5. `service enable dhcp 35`\n\n18. 你需要在基于 Debian\
  \ 的 SysV init 系统在默认运行级别上启用 DHCP 服务。你应该使用以下哪个命令？\n1. `update-rc.d dhcp default`\n\
