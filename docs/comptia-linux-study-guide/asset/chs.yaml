  \   5. `LC_ALL`\n\n6. ________ 是使 Linux 系统适应特定语言的能力。\n    1. Locale\n    2. Localization\
  \ \n    3. Character set\n    4. Unicode\n    5. ASCII\n\n7. 哪个 Systemd 工具允许你更改\
  \ Linux 系统的本地化设置？\n    1. `timedatectl`\n    2. `time`\n    3. `date`\n    4. `localectl`\n\
  \    5. `locale`\n\n8. 哪个 Linux 命令更改本地化环境变量的值？\n    1. `time`\n    2. `export`\n\
  \    3. `locale`\n    4. `date`\n    5. `hwclock`\n\n9. 哪个 `LC_` 环境变量决定 Linux 如何显示美元和分的数值？\n\
