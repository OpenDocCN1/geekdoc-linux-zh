  1. 一个 Web 代理\n2. DHCP 服务器\n3. 一个容器\n4. 一个集群\n\n## 第 3 章：管理文件、目录和文本\n\n![](img/chaptersquare.png)\n\
  \n在早期的 Linux 年代，为了完成任何工作，你必须与 `Gnu/Linux shell` 交互。shell 是一种特殊的交互式实用，允许用户运行程序、管理文件、处理进程等。shell\
  \ 提供了一个命令行界面，该界面提供了一个提示符，你可以在其中输入基于文本的命令。这些命令实际上是程序。命令行上实际上有很多可以输入的成千上万个命令。然而，在日常工作中，你通常只需要定期使用几百个命令。\n\
  \n虽然你很可能已经接触过本章中的许多命令，但你可能并不了解所有的它们。此外，可能你使用的某些 shell 命令方式并不高效。我们本章的目的是改进你的 Linux\
  \ 命令行工具箱。我将涵盖文件和目录管理、查看文本文件以及查找信息的知识。还将介绍简单且常用的 `ls` 命令以及有趣的 `diff` 实用。本章中的命令和概念将在后续章节中建立并使用。\n\
  \n## 处理文件和目录\n\nLinux 系统上的文件存储在单一目录结构中，称为`虚拟目录**（virtual directory）。虚拟目录包含计算机所有存储设备的文件，并将它们合并到一个单一目录结构中。该结构有一个单一基目录，称为`根目录`（root\
  \ directory），通常简称为 `root`。\n\n通常，在命令行学习的第一技能之一就是如何在虚拟目录结构中导航，以及如何创建和删除目录。理解如何查看文件、创建文件、复制和移动以及删除文件也是重要的技能。以下章节描述了如何使用命令行命令来完成这些各种任务。\n\
  \n### 查看和创建文件\n\n查看文件名及其各种`元数据`（metadata）的最基本命令是列出命令（list）。元数据是描述并提供数据额外细节的信息。\n\
  \n要执行列出命令，你使用 `ls` 以及任何需要的选项或参数。列出命令的基本语法结构如下：\n\n```\nls [OPTION]… [FILE]…\n```\n\
  \n在列出命令的语法结构中，`[OPTION]` 意味着有各种选项（也称为开关），你可以添加这些选项来显示不同的文件元数据。方括号表示开关是可选的。`[FILE]`\
  \ 参数显示你可以在命令末尾添加目录或文件名，以查看特定文件或其它虚拟目录结构位置内文件的元数据。它也是可选的，如括号所示。\n\n当你不带任何额外参数或选项执行\
  \ `ls` 命令时，它会显示`当前工作目录`**（present working directory）中的所有文件和子目录名称，如列表 3.1 所示。\n\n\
  你的当前工作目录是你的登录进程在虚拟目录结构中的当前位置。你可以通过执行 `pwd` 命令来确定此位置的目录名称，该命令也显示在列表 3.1 中。\n\n要显示比文件和目录名称更多的元数据，你需要向列出命令添加各种选项。表\
  \ 3.1 显示了几个较常用的选项。\n\n| 短格式 | 长格式 | 描述 |\n| --- | --- | --- |\n| `-a` | `--all`\
  \ | 显示所有文件和子目录名称，包括隐藏文件。 |\n| `-d` | `--directory` | 显示目录自身的元数据而不是其内容。 |\n| `-F`\
  \ | `--classify` | 使用指示代码（`*`,`/`,`=`,`>`,`@`或`&#124;`）对每个文件的类型进行分类。 |\n| `-i` |\
  \ `--inode` | 显示所有文件和子目录名称及其关联索引号。 |\n| `-l` | N/A | 显示文件和子目录元数据，包括文件类型、文件访问权限、硬链接数、文件所有者、文件组、修改日期时间和文件名。\
  \ |\n| `-R` | N/A | 显示目录的内容，对于原始目录树中的任何子目录，连续显示它们的内容（递归）。 |\n\n表 3.1 `ls` 命令的常用选项\n\
  \n表 3.1 包含了最好记忆的 `ls` 命令选项，因为你会经常使用它们。然而，尝试所有各种 `ls` 命令选项和选项组合是值得的。花时间查看 man 页中\
  \ `ls` 命令的选项。例如，你可以尝试 `-lh` 选项组合，如列表 3.2 所示，这使得文件大小更具人类可读性。当你尝试各种命令选项时，你不仅为 Linux+\
  \ 认证考试做好了更好的准备，还会发现适用于你特定需求的组合。\n\n请注意，某些发行版默认包含 `ls -l` 命令的`别名`**（alias）。它是 `ll`（两个小写的\
  \ `L`），并在列表 3.3 的 Rocky 发行版中演示。Linux 命令行上的别名只是代表另一个通常是复杂的命令的短命令。你可以通过在命令行输入 `alias`\
  \ 来查看进程拥有的的所有别名。\n\n如果你正在处理大量文件和目录，有时查看这些内容的图形概览会有帮助。如果你无法访问图形桌面，仍然可以使用 `tree` 命令以伪图形格式在命令行上查看内容，如图\
  \ 3.1 所示。\n\n![终端窗口截图显示了一个带有两个目录和四个文件的目录树结构。](img/c03f001.png)\n\n图 3.1 `tree` 命令的输出\n\
  \n`tree` 命令的输出创建一个分层结构，显示哪些文件与哪些目录相关，从而便于分类。\n\n`touch` 命令允许你现场创建空文件。该命令在寿命的主要目的是更新文件的时间戳——访问和修改时间。然而，对于学习目的，它是很有用的，因为你可以快速创建用于进行实验的文件，如列表\
  \ 3.4 所示。\n\n注意列表 3.4 中，通过 `touch` 命令，你可以一次创建一个单个文件或多个文件。要创建多个文件，只需在命令后列出用空格分隔的文件名即可。\n\
  \n目录有时被称为`文件夹`**（folders）。从用户的角度来看，目录包含文件，但实际上，目录是一个用于定位其他文件的特殊文件。该目录负责的文件其部分元数据存储在目录文件中。这些元数据包括文件名以及与文件关联的索引（inode）。因此，可以通过其管理目录来定位文件。\n\
  \n你可以快速创建目录，但不要使用 `touch`，而要使用 `mkdir` 命令。`ls` 命令的 `-F` 选项将帮助你完成任务。它会显示任何目录（包括新创建的目录），并在每个目录名称后跟一个\
  \ `/` 指示代码。列表 3.5 提供了一些示例。\n\n\n\n\n要在当前工作目录中创建子目录，只需输入 `mkdir` 命令并跟上子目录名称，如列表 3.5\
  \ 所示。如果您想在不同于当前工作目录的位置构建目录，可以使用绝对目录引用，就像在列表 3.5 中创建 `Saturn` 目录时那样。\n\n在构建目录时，请注意可能会出现一些问题。具体来说，当尝试创建目录树时可能会发生，例如列表\
  \ 3.6 所示的示例。\n\n注意当尝试使用 `mkdir` 命令构建 `Projects` 目录及其 `42` 子目录时会发生错误。在父目录（`Projects`）不存在的情况下，无法创建子目录（`42`）。`mkdir`\
  \ 命令的 `-p` 允许您覆盖这一行为，如列表 3.6 所示，并成功创建目录树。\n\n## 复制和移动文件\n\n复制、移动和重命名文件及目录是基本的技能。完成这些任务的命令之间存在一些需要了解的细微差别。\n\
  \n若要在本地复制文件或目录，请使用 `cp` 命令。要执行此命令，您可以使用 `cp` 配合任何所需的选项或参数。该命令的基本语法结构如下：\n\n```\n\
  cp [OPTION]… SOURCE DEST\n```\n\n命令选项（如结构所示）不是必须的。然而，源文件 `SOURCE` 和目标 `DEST` 是必须的，如列表\
  \ 3.7 中的基础 `cp` 命令示例所示。\n\n在列表 3.7 中，第一次使用 `cp` 命令时，同时指定了源文件及其目标。因此没有发生任何问题。然而，第二次使用\
  \ `cp` 命令时缺少了目标文件名。这导致源文件没有被复制并生成了错误消息。\n\n有很多实用的 `cp` 命令选项。许多选项可以帮助您防止犯严重错误，例如不小心覆盖文件或其权限。表\
  \ 3.2 显示了一些常用的选项。\n\n| Short | Long | Description |\n| --- | --- | --- |\n| `-a`\
  \ | `––archive` | 执行递归复制并保留所有文件的原始属性，如权限、所有者和时间戳。 |\n| `-f` | `––force` | 覆盖任何与\
  \ `DEST` 同名的预存目标文件。 |\n| `-i` | `––interactive` | 在覆盖任何与 `DEST` 同名的预存目标文件之前进行提问。\
  \ |\n| `-n` | `––no-clobber` | 不覆盖任何与 `DEST` 同名的预存目标文件。 |\n| `-R`, `-r` | `––recursive`\
  \ | 复制目录的内容，并且对于原始目录树中的任何子目录，也连续复制其内容（递归）。 |\n| `-u` | `––update` | 仅当源文件较新时，才覆盖与\
  \ `DEST` 同名的预存目标文件。 |\n| `-v` | `––verbose` | 在命令执行时提供详细的命令操作信息。 |\n\n表 3.2 `cp`\
  \ 命令的常用选项\n\n要复制目录，您需要在 `cp` 命令中添加 `-R`（或 `-r`）选项。该选项启用递归复制。递归复制不仅会创建一个新目录（`DEST`），还会复制源目录管理的任何文件、源目录子目录以及它们的文件。列表\
  \ 3.8 显示了如何进行递归复制以及如何错误地操作的示例。\n\n注意在列表 3.8 中第一次使用 `cp` 命令时，没有使用 `-R` 选项，因此源目录没有被复制。生成的错误消息\
  \ `cp: omitting directory` 可能会让人有些困惑，但本质上它告诉您复制不会发生。当使用 `cp -R` 命令复制列表 3.8 中的源目录时，操作是成功的。递归复制选项是少数几个可以使用大写\
  \ `-R` 或小写 `-r` 的命令选项之一。\n\n若要在本地移动或重命名文件或目录，您可以使用单一命令。即 `mv` 命令。该命令的基本语法与 `cp`\
  \ 命令几乎相同，如下：\n\n```\nmv [OPTION]… SOURCE DEST\n```\n\n通用的 `mv` 命令选项与 `cp` 命令选项相似。然而，您会在表\
  \ 3.3 中发现，典型的 `mv` 命令选项比常用的 `cp` 选项少。一如既往，务必使用 `man mv` 命令查看 `mv` 属性的帮助页，以便为了认证学习复习所有选项，并探索对您可能用的非常用选项。\n\
  \n| Short | Long | Description |\n| --- | --- | --- |\n| `-f` | `––force` | 覆盖任何与\
  \ `DEST` 同名的预存目标文件。 |\n| `-i` | `––interactive` | 在覆盖任何与 `DEST` 同名的预存目标文件之前进行提问。\
  \ |\n| `-n` | `––no-clobber` | 不覆盖任何与 `DEST` 同名的预存目标文件。 |\n| `-u` | `––update` |\
  \ 仅当源文件较新时，才覆盖与 `DEST` 同名的预存目标文件。 |\n| `-v` | `––verbose` | 在命令执行时提供详细的命令操作信息。 |\n\
  \n表 3.3 `mv` 命令的常用选项\n\n移动命令非常简单。在列表 3.9 中，使用了 `mv` 命令。在列表 3.10 中，没有额外的选项。在列表 3.11\
  \ 中，使用了 `mv` 命令。\n\n对于大文件的极速复制或复制大组文件，`rsync` 工具非常有用。若要在本地快速复制文件，`rsync` 命令的语法与\
  \ `mv` 命令相似：\n\n```\nrsync [OPTION]… SOURCE DEST\n```\n\n某些 `rsync` 选项将帮助您快速复制文件。某些开关对于在本地复制大文件或创建备份很有帮助，因此复一下表\
  \ 3.4 中列出的常用 `rsync` 选项是一个好主意。\n\n| Short | Long | Description |\n| --- | --- |\
  \ --- |\n| `-a` | `––archive` | 使用归档模式。 |\n| `-D` | N/A | 保留设备和特殊文件。 |\n| `-g` |\
  \ `––group` | 保留文件的组。 |\n| `-h` | `––human-readable` | 以人类可读格式显示任何数字输出。 |\n| `-l`\
  \ | `––links` | 将符号链接作为符号链接复制。 |\n| `-o` | `––owner` | 保留文件的所有者。 |\n| `-p` | `––perms`\
  \ | 保留文件的权限。 |\n| `-r` | `––recursive` | 复制目录的内容，并且对于原始目录树中的任何子目录，也连续复制其内容（递归）。\
  \ |\n| `-t` | `––times` | 保留文件的修改时间。 |\n| `-v` | `––verbose` | 在命令执行时提供详细的命令操作信息。\
  \ |\n\n\n\n\n\n表格 3.4 `rsync` 命令常用的本地复制选项\n\n归档模式（Archive mode）通过 `-a`（或 `––archive`）开关开启，这是一个有趣的功能。使用这一个开关等同于组合选项\
  \ `-rlptgoD`，这是一组用于创建目录树备份的常用 `rsync` 命令选项集。\n\n使用 `rsync` 工具拷贝大文件的示例可见列表 3.12 所示请注意，当拷贝完成后，该工具会输出有用信息，例如数据传输率。如果你需要额外的文件传输统计，请在命令中添加\
  \ `––stats` 选项。\n\n## 删除文件\n\n清理整个文件系统或仅仅是自己的目录空间，通常从删除不需要的文件和目录开始。了解这些命令及其开关对于避免在删除这些项目时出错至关重要。\n\
  \n最灵活且最使用的删除工具是 `rm` 工具。它通过 `rm` 命令调用，基本语法如下：\n\n```bash\nrm [OPTION]… FILE\n```\n\
  \n`rm` 工具有许多实用的选项，请务必查看其 man 页以了解所有选项。然而，最常用的选项列在表格 3.5 中。\n\n| 短格式 | 格式格式 | 描述\
  \ |\n| --- | --- | --- |\n| `-d` | `––dir` | 删除任何空目录。 |\n| `-f` | `––force` | 继续删除过程，即使命令指定的要删除某些文件不存在，并且在删除任何现有文件之前不询问。\
  \ |\n| `-i` | `––interactive` | 在删除任何现有文件之前询问。 |\n| `-I` | N/A | 在删除三个以上的文件之前，或在使用\
  \ `-r` 选项时询问。 |\n| `-R`, `-r` | `––recursive` | 删除目录的内容，并对于原始目录树中的任何子目录，连续删除其内容和子目录（递归）。\
  \ |\n| `-v` | `––verbose` | 在命令执行时提供详细的命令操作信息。 |\n\n表格 3.5 `rm` 命令常用的选项\n\n要简单删除单个文件，你可以使用\
  \ `rm` 命令指定要删除的文件名且不使用任何开关。然而，使用 `-i`（或 `––interactive`）选项始终是一个好主意，以确保你没有删错文件，如列表\
  \ 3.13 所示。\n\n同样注意在列表 3.13 中，当文件已被删除后，如果你重新发布 `rm -i` 命令，会生成一条错误消息；但如果你发布 `rm -f`\
  \ 命令，它对缺失的文件将保持沉默。`-f`（或 `–force`）开关在删除许多文件且不希望显示任何错误消息时非常有用。\n\n删除目录树或装满文件的目录可能是复杂的。如果你只发布\
  \ `rm -i` 命令，你将得到一个错误消息，如列表 3.14 所示。相反，你需要添加 `-R` 或 `-r` 选项，以便删除该目录及其管理的文件。\n\n\
  如果你有大量文件要删除，想要确保删除的是正确的文件，且不想为每个要删除的文件都回答 `y`，请使用 `-I` 选项代替 `-i` 开关。它会在删除三个以上的文件之前询问，以及当你删除一个装满文件的目录并使用其中一个递归开关时询问，如列表\
  \ 3.15 所示。\n\n删除空目录（不包含任何文件的目录）是简单的。只需使用删除空目录的工具，即 `rmdir` 命令即可。你会发现添加 `-v`（或 `––verbose`）开关也是有帮助，如列表\
  \ 3.16 所示。\n\n如果你想删除一个不包含文件但包含空子目录的目录树，你也可以使用 `rmdir` 工具。需要配合 `-p`（或 `––parents`）开关并提供整个目录树名称作为参数。示例可见列表\
  \ 3.17 所示。\n\n你可能会遇到一种需要仅从目录树中删除空目录的情况。在这种情况下，你需要使用 `rm` 命令并添加 `-d`（或 `––dir`）开关，如列表\
  \ 3.18 所示。\n\n理解用于创建和删除目录的命令，以及查看、创建、复制、移动、重命名和删除文件的各种命令是一项重要技能。此外，牢掌握常用的命令选项也是至关重要的。这种专业知识是你\
  \ Linux 命令行工具箱中宝贵的工具。\n\n## 链接文件和目录\n\n理解文件和目录链接是你 Linux 之旅程的重要组成部分。虽然许多初级 Linux\
  \ 管理员可以很快学会链接文件，但链接有两种类型。一种是符号链接（symbolic link），也称为软链接。另一种是硬链接（hard link）。\n\n##\
  \ 建立硬链接\n\n硬链接允许你拥有文件的伪副本，而不真正复制其数据。这通常用于文件备份，前提是有足够的空间来备份该文件。如果有人删除了文件的名称之一，你仍然有另一个链接到数据的文件名。\n\
  \n要创建硬链接，请使用 `ln` 命令。对于硬链接，在发布 `ln` 命令之前原始文件必须存在。链接的文件必须不存在。列表 3.19 展示了这一操作。\n\n\
  在列表 3.19 中，通过 `touch` 命令创建了一个新的空白空文件 `OriginalFile.txt`。然后通过 `ln` 命令将其硬链接到 `HardLinkFile.txt`。注意\
  \ `OriginalFile.txt`是在发布 `ln` 命令之前创建的，而 `HardLinkFile.txt` 是通过发布 `ln` 命令创建的。使用 `ls\
  \ -i` 命令检查这些文件的 inode 节点数，你可以看到它们是相同的。\n\n同样在列表 3.19 中，在创建硬链接并检查 inode 节点数后，创建了一个新空文件名为\
  \ `NewFile.txt`。这样做是为了比较链接数。使用 `ls -og` 命令显示文件的元数据，包括文件类型、权限、链接数、文件大小、创建日期和文件名。该命令与\
  \ `ls -l` 类似，但省略了文件所有者和组。你可以在命令输出中快速找到链接数。它们紧邻文件的大小，由于文件是空的，所有大小均为 `0`。注意 `OriginalFile.txt`\
  \ 和 `HardLinkFile.txt` 的链接数均为 `2`。这是因为它们都硬链接到了另一个文件。`NewFile.txt` 的链接数为 `1`，因为它没有硬链接到其他文件。\n\
  \n在创建和使用硬链接时，请记住这些重要事项：\n\n*   在发布 `ln` 命令之前，原始文件必须存在。\n\n\n\n\n\n*   在 `ln` 命令中列出的第二个文件名在执行命令之前*不能*存在。\n\
  *   原始文件及其硬链接共享相同的 inode（索引节点）号。\n*   原始文件及其硬链接共享相同的数据。\n*   原始文件及其任何一个硬链接可以存在于不同的目录。\n\
  *   原始文件及其硬链接必须存在于同一个文件系统中。\n\n### 构建软链接\n\n通常情况下，软链接（符号链接）文件提供指向可能位于另一个文件系统上的文件的指针。这两个文件不共享\
  \ inode 号，因为它们指向的数据并不相同。图 3.3 展示了软链接关系。\n\n![图表显示文件名 2 的 inode 哈希 5678，指向文件名 1 的\
  \ inode 哈 1234，然后指向磁盘上的数据。](img/c03f003.png)\n\n图 3.3 软链接文件关系\n\n要创建符号链接，使用 `ln`\
  \ 命令并配合 `-s`（或 `––symbolic`）选项。示例在列表 3.20 所示。\n\n与硬链接类似，在执行 `ln -s` 命令之前，原始文件必须存在。软链接文件不存在，它会在命令执行时被创建。在列表\
  \ 3.20 中，你可以通过 `ls -i` 命令看到，与硬链接不同，软链接不共享相同的 inode 号。此外，软链接不会增加链接计数。`ls -og` 命令显示了这一点，同时也显示了软链接指向原始文件的指针。\n\
  \n在创建和使用软链接时，请记住以下几点：\n\n*   执行 `ln -s` 命令之前，原始文件必须存在。\n*   `ln -s` 命令中列出的第二个文件名在执行命令之前不能存在。\n\
  *   原始文件及其软链接不共享相同的 inode 号。\n*   原始文件及其软链接不共享相同的数据。\n*   原始文件及其任何一个软链接可以存在于不同的目录。\n\
  *   原始文件及其软链接可以存在于不同的文件系统。\n\n文件和目录链接很容易创建。然而，理解这些链接的底层结构对于正确使用它们至关重要。\n\n## 读取文件\n\
  \nLinux 系统包含许多文本文件。它们包括配置文件、日志文件、数据文件等。了解如何查看这些文件是一项基础但重要的技能。在接下来的章节中，我将探索你可以用于读取文本文件的几种实用。\n\
  \n### 读取整个文本文件\n\n查看整个文本文件的基本工具是 `concatenate` 命令。尽管该工具的主要用途是将文本文件合并并显示，但它通常也仅用于显示单个小型文本文件。要查看小型文本文件，请使用以下基本语法的\
  \ `cat` 命令：\n\n```\ncat [OPTION]… [FILE]…\n```\n\n`cat` 命令使用非常简单。你只需要输入命令，后跟你想要读取的任何文本文件，如列表\
  \ 3.21 所示。\n\n`cat` 命令直接将整个文本文件输出到你的屏幕上。当你看到提示符时（在列表 3.21 中显示为 `$`），你就知道提示符上方的一行就是文件的最后一行。\n\
  \n一个非常有用的 `cat` 命令选项是 `-n`（或 `––number`）开关。使用此选项将显示行号以及文件文本，如列表 3.22 所示。\n\n另一个查看整个文本文件的有用命令是\
  \ `pr` 命令。它的原始用途是为打印格式化文本文件。但现在，每当你需要某些特殊格式时，它对于显示文件要有用得多。要查看小型文本文件，请使用以下基本语法的 `pr`\
  \ 命令：\n\n```\npr [OPTION]... [FILE]...\n```\n\n特殊的格式选项是该命令区别于简单使用 `cat` 命令的关键表表\
  \ 3.6](#c003.xhtml_c03-tbl-6) 显示了一些用于显示文件的有用 `pr` 实用选项。\n\n| 短写 | 全称 | 描述 |\n| ---\
  \ | --- | --- |\n| `-n` | `––columns=n` | 以列格式显示文件，使用 `n` 列。 |\n| `-l n` | `––length=n`\
  \ | 将默认的 66 行页长度更改为 `n` 行。 |\n| `-m` | `––merge` | 显示多个文件时，并行显示它们，每列一个文件，并截断文件的行。\
  \ |\n| `-s c` | `––separator=c` | 将默认的列分隔符从制表符更改为 `c`。 |\n| `-t` | `––omit-header`\
  \ | 不显示任何文件头或尾。 |\n| `-w n` | `––width=n` | 将默认的 72 字符宽度更改为 `n` 字符。 |\n\n表 3.6 显示了一些用于显示文件的有用\
  \ `pr` 实用选项。`-l`（或 `––length=n`）开关将默认的 66 行页长度更改为 `n` 行。`-m`（或 `––merge`）开关并行显示多个文件。`-s`（或\
  \ `––separator=c`）开关将列分隔符更改为 `c`。`-t`（或 `––omit-header`）隐藏页/页尾。`-w`（或 `––width=n`）开关将宽度设置为\
  \ `n`。\n\n（注：原文中存在重复段落，已按要求去重处理，保留核心逻辑翻译）\n\n\n\n\n\n你也可以通过使用 `-n`（或 `––lines=`）切换开关配合负参数来消除文件的末尾行。这在列表\
  \ 3.28 中有所演示。\n\n注意在列表 3.28 中，这次 `-n` 切换的参数是负数（`-40`）。这告诉 `head` 命令显示文件除最后 40 行以外的所有行。如果你尝试在不使用\
  \ `-n` 切换开关的情况下使用负参数（就像你可以使用正参数那样），你将得到一个错误信息，如列表 3.28 所示。\n\n如果你想显示文件的最后几行而不是开头几行，请使用\
  \ `tail` 工具。它的通用语法与 `head` 命令的语法相似，如下：\n\n```\n tail [OPTION]... [FILE]...\n```\n\
  \n默认情况下，`tail` 命令将显示文件的最后 10 行。然而，你可以通过使用带参数的 `-n`（或 `––lines=`）切换开关来覆盖该行为。该参数告诉\
  \ `tail` 从文件底部开始显示多少行。如果你在参数前加上加号（`+`），`tail` 工具将从指定的行号开始显示文件文本，直到文件末尾。以这些方式使用 `tail`\
  \ 的三个示例在列表 3.29 中显示。\n\n`tail` 工具最有用的功能之一是能够监控日志文件。日志文件通常会将新消息附加到文件末尾。在消息被添加时对其进行监控非常方便。在\
  \ `tail` 命令上使用 `-f`（或 `––follow`）切换开关，并提供要监控的日志文件名作为命令参数。你将立即看到几条最近的日志条目。随着你继续监控，额外的消息会在添加到日志文件时显示显示。\n\
  \n要结束使用 `tail` 的监控会，你必须使用 Ctrl+C 键组合。使用 `tail` 工具监控日志文件的示例在列表 3.30 的片段所示。\n\n###\
  \ 读取文本文件页\n\n阅读大文件文本的一种方法是使用分页器。分页器工具允许你一次查看一页文本，并按照自己的节奏移动文本。两个常用的分页器是 `more` 和\
  \ `less` 工具。\n\n尽管 `more` 工具相当简单，但它是一个很好用的微型分页器。你可以通过按空格键（向下翻页）或回车键（向下移动）来向前移动文本文件。然而，你不能向后移动文件。使用\
  \ `more` 命令的示例在图 3.4 中。\n\n![Name Service Switch 配置文件的终端视图以及有效条目的截图，其中 59% 的内容被高亮。](img/c03f004.png)\n\
  \n图 3.4 使用 `more` 分页器\n\n图 3.4 中显示的输出是通过在命令行执行 `more /etc/nsswitch.conf` 命令得到的。注意，`more`\
  \ 分页器会在屏幕底部显示你处于文件的进度。在任何你想要退出 `more` 分页器的时刻，都必须按 q 键。即使你已经到达文件的最后一行也是如此。\n\n更灵活的分页器是\
  \ `less` 工具。虽然它与 `more` 工具类似，可以一次一页（或一行）移动文件，但此分页器工具还允许你向后移动。然而，`less` 工具的功能远不止于此，这有了对该分页器的著名的描述，“`less`\
  \ is more。”\n\n图 3.5 显示了在 `/etc/nsswitch.conf` 文本文件上使用 `less` 工具。注意显示的内容与图 3.4 并不相似，但不要被它误导了。\n\
  \n![带有注释、有效条目和 e t c n s 切换配置的 Name Service Switch 配置。](img/c03f005.png)\n\n图 3.5\
  \ 使用 `less` 分页器\n\n`less` 分页工具允许更快的文件遍历，因为它在显示文件的第一页之前不会读取整个文件。你还可以使用向上和向下方向键来遍历文件，使用空格键向前翻页，并使用\
  \ Esc+V 键组合向后翻页。你可以通过按 ? 键在文件中搜索特定单词，输入你想查找的单词并按回车键进行反向搜索。将 ? 键替换为 / 键即可进行正向搜索。与\
  \ `more` 分页器一样，你确实需要使用 q 键退出。\n\n`less` 工具具有惊人的功能。它非常值得花时间。\n\n### 查找信息\n\n有很多查找信息的方法。以下章节将探索几种帮助你的工具。\n\
  \n#### 查看信息\n\n查看目录并看看里面有什么并不常见。以下章节将探索几种工具。`file` 命令可以提供关于文件类型的基本信息，如列表 3.31 所示。\n\
  \n如果你想查看文件何时创建、修改或最后访问的信息，请使用 `stat` 命令，如列表 3.32 所示。\n\n#### 探索差异\n\n探索文件差异的方便命令是\
  \ `diff` 命令。它允许你在两个文件之间进行比较。该命令的基本语法如下：\n\n```\n diff [OPTION]... [FILES]\n```\n\
  \n通过 `diff` 工具，你可以执行各种比较。此外，你还可以格式化输出以使结果更容易读。表 3.7 显示了一些较常用的选项。\n\n| 短格式 | 完整格式\
  \ | 描述 |\n| --- | --- | --- |\n| `-e` | `--ed` | 创建一个 `ed` 脚本，可用于使第一个文件与第二个文件相同。\
  \ |\n| `-q` | `--brief` | 如果文件不同，发布一条简单的消息表示此。 |\n| `-r` | `--recursive` | 比较原始目录树中的任何子目录，并连续地比较它们的内容以及子目录。\
  \ |\n| `-s` | `--report-identical-files` | 如果文件相同，发布一条简单的消息表示此。 |\n| `-W` `n` |\
  \ `--width` `n` | 显示输出的最大宽度为 `n` 个字符。 |\n| `-y` | `--side-by-side` | 以两列形式显示输出。\
  \ |\n\n若只需查看两个文本文件之间是否存在差异，你可以输入带有 `-q` 切换开关的 `diff` 命令，随后是文件名。示例见列表 3.33。为了帮助你查看具体的文件差异，首先使用\
  \ `pr` 命令以列格式并排显示两个文件。\n\n\n\n\n\n若需快速查看文件之间的差异，可以修改 `diff` 命令的输出，以列格式显示文件。使用 `-y`（或\
  \ `--side-by-side`）选项配合 `-W`（或 `--width`）开关可以使显示更容易阅读，如列表 3.34 所示。管道符号（`|`）表示第二个文件的行，它们与第一个文件的行不同。\n\
  \n`diff` 工具提供的不仅仅是差异。它还标出了为了使第一个文件与第二个文件相同而需要添加、修改或删除的内容。要查看文件之间的精确差异以及任何所需的修改，请移除\
  \ `-q` 开关。示例见列表 3.35。\n\n`diff` 命令的输出可能让人稍显困惑。在列表 3.35 中，第一行输出显示 `2,3c2,3`。该输出告诉您，为了让第一个文件\
  \ `numbers.txt` 与第二个文件 `random.txt` 一致，您需要更改 `numbers.txt` 文件的第 2 到 3 行以匹配 `random.txt`\
  \ 文件的第 2 到 3 行。输出接下来的六行显示了文件中不匹配的文本内容，并用虚线分隔。接下来，`5c5` 表示 `numbers.txt` 中的第 5 行需要更改以匹配\
  \ `random.txt` 文件中的第 5 行。\n\n`diff` 工具输出中的字母 `c` 表示需要更改。您还可能会看到表示任何需要添加的 `a`，或表示任何需要删除的\
  \ `d`。\n\n### 使用简单的精确定命令\n\n快速定位（精确定）文件的命令非常有用。它们允许您确定您的系统上是否安装了某个特定工具、定位所需的配置文件、查找帮助文档等。这里介绍的命令的妙之处在于它们简单易用。\n\
  \n`which` 命令向您显示作为参数传递的 shell 命令的完整路径名。列表 3.36 显示了使用该工具的示例。\n\n在列表 3.36 的第一个示例中，使用\
  \ `which` 命令查找 `diff` 命令的程序位置。命令显示了 `/usr/bin/diff` 的完整路径名。`shutdown` 工具位于 `sbin`\
  \ 目录。然而，此系统未安装 `line` 程序，`which` 工具显示了它为查找程序而搜索的所有目录。它使用 `PATH` 环境变量（其内容也显示在列表 3.36\
  \ 中）来确定搜索哪些目录。\n\n`which` 命令对于快速判断命令是否在使用别名也非常方便。列表 3.37 显示了此的一个示例。\n\n当对列表 3.37\
  \ 中的 `ls` 命令使用 `which` 工具时，它显示当前 `ls` 命令有一个别名。因此，当您输入 `ls` 时，就像您输入了 `ls --color=auto`\
  \ 命令一样。在对 `ls` 使用 `unalias` 命令后，`which` 工具仅显示 `ls` 程序的位置。\n\n另一个简单的精确定命令是 `whereis`\
  \ 工具。该工具允许您不仅定位任何命令的程序二进制文件，还能定位源代码以及任何帮助页（man pages）。使用 `whereis` 工具的示例见列表 3.38。\n\
  \n列表 3.38 中发出的第一个命令搜索了 `diff` 工具的程序二进制文件、源代码和帮助页。在这种情况下，`whereis` 命令找到了一个二进制文件以及两个帮助页文件。然而，当使用\
  \ `whereis` 定位虚拟工具 `line` 文件时，系统中没有找到任何内容。\n\n`locate` 程序是一个查找文件的方便且简单的工具。该工具通过搜索\
  \ `mlocate.db` 数据库来确定特定文件是否存在于本地系统。`locate` 命令的基本语法如下：\n\n```\nlocate [OPTION]...\
  \ PATTERN...\n```\n\n注意语法中，`locate` 工具使用模式列表来查找文件。因此，可以使用部分文件名和正则表达式，并结合命令选项忽略大小写。表\
  \ 3.8 显示了一些常用的 `locate` 命令选项。\n\n| 短 | 长 | 描述 |\n| --- | --- | --- |\n| `-A` | `--all`\
  \ | 显示匹配所有模式的文件名，而不是只显示模式列表中某一个模式的文件。 |\n| `-b` | `--basename` | 显示匹配模式的文件名，不包含任何匹配模式的目录名。\
  \ |\n| `-c` | `--count` | 仅显示名称匹配模式的文件数量，而不是显示文件名。 |\n| `-i` | `--ignore-case` |\
  \ 匹配文件名时忽略模式的大小写。 |\n| `-q` | `--quiet` | 处理时不显示任何错误信息（例如 `permission denied`）。\
  \ |\n| `-r` | `--regexp (R)` | 使用正则表达式 `R` 而不是模式列表来匹配文件名。 |\n| `-w` | `--wholename`\
  \ | 显示匹配模式并包含任何匹配模式的目录名的文件名。这是默认行为。 |\n\n表 3.8 `locate` 命令的常用选项\n\n要使用 `locate`\
  \ 命令查找文件，只需输入 `locate` 后跟文件名。如果文件存在于您的系统中且您有权限查看它，`locate` 工具将显示文件的目录路径和名称。此类示例见列表\
  \ 3.39。\n\n使用 `locate` 命令 `PATTERN` 可能会有点棘手，这是由于文件通配符（file globbing）的原因。当您使用通配符（如星号\
  \ `*`）时，会发生文件通配。例如，`pass*d` 可能会扩展为 `password` 或 `passrd`。\n\n\n\n\n\n`find` 命令非常灵活。它允许你根据数据来定位文件，例如文件的所有者、文件的最后修改时间、文件设置的权限等。其基本命令语法如下：\n\
  \n```\nfind [PATH...] [OPTION] [EXPRESSION]\n```\n\n`PATH` 参数是一个起始点目录，因为你可以在目录树中指定一个起始点，`find`\
  \ 将在该目录及其所有子目录（递归地）中搜索你寻找的单个或多个文件。你可以使用单个句号 `.` 将当前当前工作目录指定为起始点目录。\n\n`EXPRESSION`\
  \ 命令参数及其之前的 `OPTION` 控制了应用于搜索的各种元数据过滤器的类型，以及可能限制搜索的任何设置。表 3.9 显示了更常用的 `OPTION` 和\
  \ `EXPRESSION` 组合。\n\n| 选项 | 表达式 | 描述 |\n| --- | --- | --- |\n| `-cmin` | `n` |\
  \ 显示状态在 `n` 分钟前发生变化的文件名。 |\n| `-empty` | N/A | 显示空且为普通文本文件或目录的文件名。 |\n| `-gid` |\
  \ `n` | 显示组 ID 等于 `n` 的文件名。 |\n| `-group` | `name` | 显示组为 `name` 的文件名。 |\n| `-inum`\
  \ | `n` | 显示 inode 数等于 `n` 的文件名。 |\n| `-maxdepth` | `n` | 在搜索文件时，仅在起始目录树向下遍历 `n`\
  \ 层。 |\n| `-mmin` | `n` | 显示数据在 `n` 分钟前发生变化的文件名。 |\n| `-name` | `pattern` | 显示名称匹配\
  \ `pattern` 的文件名。在 `pattern` 中可以使用许多正则表达式参数，并需要包含引号内以避免产生不可预测的结果。将 `-name` 替换为 `-iname`\
  \ 可忽略大小写。 |\n| `-nogroup` | N/A | 显示文件组 ID 不存在组名的文件名。 |\n| `-nouser` | N/A | 显示文件用户\
  \ ID 不存在用户名的文件名。 |\n| `-perm` | `mode` | 显示权限匹配 `mode` 的文件名。可以使用八进制或符号模式。 |\n| `-size`\
  \ | `n` | 显示大小匹配 `n` 的文件名。可以使用后缀使大小更具可读性，例如 G 表示千字节。 |\n| `-user` | `name` | 显示所有者为\
  \ `name` 的文件名。 |\n\n表 3.9 `find` 命令常用的选项和表达式\n\n`find` 工具具有许多功能。示例有助于阐明此命令的用法。列表\
  \ 3.42 提供了几个示例。\n\n列表 3.42 中的第一个示例是在当前工作目录树中查找具有 `.txt` 扩展的文件。注意 `-name` 选项的 `pattern`\
  \ 使用引号是为了避免不可预测的结果。在第二个示例中，添加了 `-maxdepth` 选项，以便 `find` 工具仅搜索两个目录：当前目录和向下的一层子目录。\n\
  \n`find` 命令对于定期审计系统以及当你担心服务器被黑客入侵时非常有用。`-perm` 选项对于其中一种审计类型非常有用，示例在列表 3.43 中所示。\n\
  \n在列表 3.43 中，使用 `find` 工具及其 `-perm` 选项对 `/usr/bin` 目录进行潜在危险的 SUID 权限审计。使用的表达式是 `/4000`，这将要求\
  \ `find` 工具搜索 SUID 设置（八进制代码 4），由于数字前面的正斜杠 `/`，将忽略其他文件权限（八进制代码 000）。结果文件名都合法地使用了\
  \ SUID，因此这里没有可疑之处。\n\n在本章前面，我简要介绍了 `grep` 命令，用于读取文本文件的部分内容。你也可以使用这个巧妙的工具来搜索系统上的文件。\n\
  \n例如，假设你已经很久没有修改 `/etc/nsswitch.conf` 配置文件了。出现了一个问题，需要你修改文件中的 `hosts:` 设置，但你不记得它的确切名称。与其使用\
  \ `ls` 命令到处搜寻，不如直接像列表 3.44 所示那样使用 `grep` 命令快速找到文件名。\n\n在列表 3.44 中，使用 `grep` 命令在\
  \ `/etc/` 目录下的所有文件中搜索 `hosts:` 设置。\n\n## 总结\n\n能够在命令行中有效且快速地使用正确的命令，对你的日常工作非常重要。它允许你解决问题、管理文件、收集信息等。本章的目的是提高你的\
  \ Linux 命令行能力。这不仅有助于你的日常工作，还将帮助你通过 CompTIA+ 考试。\n\n## 要点\n\n### 解释处理文件目录的基本命令\n\
  典型的文件目录管理活动包括查看和创建文件、复制和移动文件以及删除文件。查看和创建文件及目录请使用 `ls`、`touch` 和 `mkdir` 命令。当需要复制、重命名或移动文件时，使用\
  \ `mv`、`cp` 或 `rsync` 命令之一。对于本地大文件复制，`rsync` 工具通常快。你可以使用 `rmdir` 工具快速删除空目录，但对于充满文件的目录，你需要使用\
  \ `rm -r` 命令。此外，如果你需要确保删除的是正确的文件，请务必在 `rm` 工具上使用 `-i` 选项。\n\n### 描述链接文件所需的结构和命令\n\
  使用 `ln` 命令链接文件非常简单。然而，描述底层链接结构对你来说很重要。硬链接文件共享相同的 inode 数，但软链接不共享。如果链接的文件被删除，软链接或符号链接可能会失效。理解\
  \ `readlink` 工具也有帮助，它可以帮你探索具有多个链接的文件。\n\n### 总结可用于读取文本文件的各种工具\n要读取整个文本文件，可以使用 `cat`、`bat`\
  \ 和 `pr` 工具。每个工具都有自己的特殊功能。如果你只需要读取文本文件的第一行或最后一行，请使用 `head` 或 `tail` 命令。对于文件中的单行文本，`grep`\
  \ 工具非常有用。如果需要逐页查看文件，可以使用 `less` 或 `more` 分页器工具。\n\n\n\n\n\n# 描述如何在 Linux 系统上查找信息。\n\
  \n要确定两个文本文件的差异，`diff` 实用非常有帮助。通过此工具，你还可以利用重定向并修改文件使它们完全相同。当你需要快速查找系统上的文件并想使用简单工具时，`which`、`whereis`\
  \ 和 `locate` 命令将很好地为你提供服务。请记住，`locate` 实用程序使用数据库，该数据库通常每天更新一次，因此你可能需要通过 `updatedb`\
  \ 命令手动更新它。当简单的文件位置工具不够用时，还有更复杂的搜索工具，例如 `find` 和 `grep`。`grep` 命令可以使用正则表达式来辅助你的搜索。\n\
  \n## 复习题\n\n你可以在可以在 附录 A 中找到复习题的答案。\n\n1. 你正在查看一个很久没有查看过的目录，需要确定哪些文件实际上是目录。使用哪个命令效果最好？\n\
  \n    1. `mkdir -v`\n    2. `ls`\n    3. `ls -F`\n    4. `ls -i`\n    5. `ll`\n\n\
  2. 你正在使用 `ls` 命令查看目录文件的元数据，但看到的却是其内部文件的元数据。哪个命令选项可以纠正这种情况？\n\n    1. `-a`\n    2.\
  \ `-d`\n    3. `-F`\n    4. `-l`\n    5. `-R`\n\n3. 你刚刚创建了一个名为 `MyDir` 的空目录。你最可能使用了哪个命令？\n\
  \n    1. `mkdir -v MyDir`\n    2. `touch MyDir`\n    3. `cp -R TheDir MyDir`\n \
  \   4. `mv -r TheDir MyDir`\n    5. `rmdir MyDir`\n\n4. 你有一个大小超过 10 GB 的文件，需要备份到本地连接的驱动器。在这种情况下，使用哪个实用程序最好？\n\
  \n    1. `readlink -f`\n    2. `mv`\n    3. `cp`\n    4. `scp`\n    5. `rsync`\n\
  \n5. 长期服务器管理员 Zoe 已经离开了公司，现在你负责她的系统。她的旧用户账户目录树 `/home/Zoe/` 已经备份。使用哪个命令可以快速删除她的文件，同时仍指示你正在删除正确的目录，而不需要强制你确认每个文件的删除？\n\
  \n    1. `cp -R /home/Zoe/ /dev/null/`\n    2. `mv -R /home/zoe/ /dev/null/`\n \
  \   3. `rm -Rf /home/Zoe/`\n    4. `rm -ri /home/Zoe/`\n    5. `rm -rI /home/Zoe`\n\
  \n6. 有一个大型目录结构需要重命名。你应该考虑使用哪些 `mv` 命令选项？（选择所有适用）\n\n    1. `-f`\n    2. `-i`\n \
  \   3. `-n`\n    4. `-r`\n    5. `-v`\n\n7. 你正在决定对数据文件使用硬链接还是符号链接。该文件大小为 5 GB，包含关键任务数据，并且另外三个人通过命令行访问。你应该怎么做？\n\
  \n    1. 创建硬链接，以便文件可以位于不同的文件系统上进行数据保护。\n    2. 创建三个硬链接并将链接提供给另外三个人以进行数据保护。\n   \
  \ 3. 创建三个符号链接并保护链接免受另外三人的影响以进行保护。\n    4. 创建符号链接，以便文件可以位于不同的文件系统。\n    5. 创建符号链接，以便链接可以共享一个\
  \ inode 号。\n\n8. 一个简短的文本控制文件与读取它的程序配合无法正常工作。你怀疑该文件由于你最近执行的控制代码更新意外损坏了，尽管文件的控制代码都是正确的。在你的问题调查中，你应该对该文件继续使用哪个命令？\n\
  \n    1. `cat -v`\n    2. `cat -z`\n    3. `cat -n`\n    4. `cat -s`\n    5. `cat\
  \ -E`\n\n9. 你有两个简短的文本文件，最大记录长度为 15 个字符。你想并排查看这些文件。以下命令中哪个最好用？\n\n    1. `pr -m`\n\
  \    2. `pr -tl 20`\n    3. `cat`\n    4. `pr -mtl 20`\n    5. `pr -ml 20`\n\n10.\
