  \n![](img/chaptersquare.png)\n\n管理 Linux 服务器涉及许多基于数据的重要步骤和决策。以敏捷高效的方式收集你所需的信息至关重要。许多\
  \ Linux 结构和工具可以帮助你快速发现你寻求的知识。\n\n在本章中，我将为你的 Linux 命令行工具箱添加更多工具。我将涵盖从文本过滤、格式化、重定向基础到文本编辑的内容。本章中的命令和概念将在后续章节中构建并使用。\n\
  \n## 处理文本文件\n\n一旦找到或创建了文本文件，你可能需要对其进行某种处理以提取所需信息。理解如何过滤和格式化文本将有助于你完成工作。在接下来的章节中，我将介绍协助处理文本文件的工具和方法。\n\
  \n## 过滤文本\n\n为了筛选大型文本文件中的数据，快速提取小数据段非常有帮助。`cut` 工具是执行此操作的方便工具。它允许你查看文件记录中的特定字段。该命令的基本语法如下：\n\
  \n```\ncut OPTION... [FILE]...\n```\n\n在我深入讲解该命令之前，有几点关于 `cut` 命令的基础知识是你理解的：\n\n\
  - **文本文件记录**：文本文件记录是以换行符结束的单文件行，该换行符是 ASCII 字符 LF。你可以通过 `cat -E` 命令查看文本文件是否使用了这种行结束符。它会将每个换行符显示为\
  \ `$`。如果你的文本文件记录以 ASCII 字符 NUL 结束，你也可以对它们使用 `cut`，但必须使用 `-z` 选项。\n- **文本文件记录分隔符**：为了正确使用某些\
  \ `cut` 参数，每个文本文件记录中必须存在字段。这些字段不是数据库风格的字段，而是由某些 `delimiter`（分隔符）分隔的数据。\n- `delimiter`\
  \ 是一个或多个字符，用于在记录中的不同数据项之间创建边界。单个空格可以作为分隔符。密码文件 `/etc/passwd` 使用冒号（`:`）来分隔记录中的数据项。\n\
  - **文本文件更改**：与其名称相反，`cut` 命令不会更改文本文件中的任何数据。它只是复制你想要查看的数据并将其显示给你。请放心，文件不会发生任何修改。\n\
  \n`cut` 工具有几个你经常会用选项。这些选项列在表 4.1 中。\n\n| 简写 | 完整写法 | 描述 |\n| --- | --- | --- |\n\
  | `-c` `nlist` | `--characters` `nlist` | 显示记录中 `nlist` 中的字符（例如，`1-5`）。 |\n| `-b`\
  \ `blist` | `--bytes` `blist` | 显示记录中 `blist` 中的字节（例如，`1-2`）。 |\n| `-d` `d` | `--delimiter`\
  \ `d` | 指定记录的字段分隔符为 `d`。这会覆盖默认的 Tab 分隔符。将 `d` 放在引号内以避免意外结果。 |\n| `-f` `flist` |\
  \ `--fields` `flist` | 显示由 `flist` 指定的记录字段（例如，`1,3`）。 |\n| `-s` | `--only-delimited`\
  \ | 仅显示包含指定分隔符的记录。 |\n| `-z` | `--zero-terminated` | 指定记录行结束符为 ASCII 字符 NUL。 |\n\
  \n表 4.1 `cut` 命令的常用选项\n\n几个 `cut` 命令的示例将有助于演示其功能。列表 4.1 显示了几个 `cut` 工具的示例。\n\n在列表\
  \ 4.1 中，使用 `head` 命令显示密码文件的两行。该文本文件使用冒号（`:`）来分隔每个记录中的字段。第一次使用 `cut` 命令通过 `-d` 选项指定冒号分隔符。注意冒号被包含在引号内以避免意外结果。`-f`\
  \ 选项用于指定仅显示字段 `1`（用户名）和 `7`（shell）。\n\n列表 4.1 中的第二个示例使用了 `-c` 选项。在这种情况下，`nlist`\
  \ 参数被设置为 `1-5`，因此每条记录的前五个字符都会被显示。\n\n过滤文本的另一个好用工具是我们的老朋友 `grep` 命令。`grep` 命令在正则表达式正则表达式方面非常强大，这会极大地帮助过滤文本文件。在我介绍这些内容之前，请参阅表\
  \ 4.2 获取常用的 `grep` 工具选项。\n\n| 简写 | 完整写法 | 描述 |\n| --- | --- | --- |\n| `-c` | `--count`\
  \ | 显示包含 `PATTERN` 匹配的文本文件记录计数。 |\n| `-d` `action` | `--directories=`action` | 当文件是目录时，如果\
  \ `action` 设置为 `read`，则将目录视为普通文本文件读取；如果 `action` 设置为 `skip`，则忽略该目录；如果 `action` 设置为\
  \ `recurse`，则相当于使用了 `-R`,`-r` 或 `--recursive` 选项。 |\n| `-E` | `--extended-regexp`\
  \ | 将 `PATTERN` 指定为扩展正则表达式。 |\n| `-i` | `--ignore-case` | 忽略 `PATTERN` 以及任何文本文件记录中的大小写。\
  \ |\n| `-R, -r` | `--recursive` | 搜索目录的内容，对于原始目录树内的任何子目录，也连续搜索其内容（递归）。 |\n| `-v`\
  \ | `--invert-match` | 仅显示不包含 `PATTERN` 匹配的文本文件记录。 |\n\n表 4.2 `grep` 命令的常用选项\n\n\
  许多命令都使用正则表达式。正则表达式是你为工具（如 `grep`）定义的模式模板，该工具使用该模式来过滤文本。基础正则表达式（BREs）包括字符，例如紧跟星号的点（`.*`），用于表示多个字符，以及单个点（`.`）用于表示一个字符。BREs\
  \ 也可以使用括号来表示多个字符，例如 `[a,e,i,o,u]` 或字符范围，如 `[A-z]`。要查找以特定字符开头的文本文件记录，可以在 BRE 前加上脱字符符号（^）。要查找特定字符位于记录末尾的文本文件记录，可以在\
  \ BRE 后面添加美元符号（$$）。\n\n使用 `grep` 工具使用 BRE 模式非常简单。列表 4.2 显示了一些示例。\n\n在列表 4.2 中的第一个片段\
  \ `grep` 示例中，`grep` 命令采用了使用 BRE `.*` 字符的模式。在这种情况下，`grep` 工具将在密码文件中搜索记录中的任何 `daemon`\
  \ 实例，如果该记录在 `daemon` 之后也包含 `nologin`，则显示该记录。\n\n列表 4.2 中的另外两个 `grep` 示例是在搜索密码文件中\
  \ `root` 的实例。注意第一个命令显示了文件中的两行。第二个命令使用了 BRE ^ 字符并将其置于 `root` 之前。该正则表达式模式导致 `grep`\
  \ 仅显示密码文件中以 `root` 开头的行。\n\n\n\n\n\n当使用 `grep` 工具审核配置文件时，`-v` 选项非常有用。它会生成一个不包含指定模式的文本文件记录列表。列表\
  \ 4.3 显示了查找密码文件中所有*不*以 `nologin` 结尾记录的示例。注意，BRE 模式将 `$` 放在单词末尾。如果你将 `$` 放在单词之前，它会被视为变量名而不是\
  \ BRE 模式。\n\n扩展正则表达式（EREs）允许更复杂的模式。例如，垂直竖线符号（`|`）允许你指定两个可能的单词或字符集进行匹配。你还可以使用括号来指定额外的子表达式。\n\
  \n使用 ERE 模式可能相当棘手。一些使用 `grep` 配合 ERE 的示例会很有帮助，例如列表 4.4 所示的示例。\n\n在第一个示例中，`grep`\
  \ 命令使用 `-E` 选项表示模式是扩展正则表达式。如果你不使用 `-E` 选项，就会出现不可预测的结果。ERE 模式周围的引号可以防止其被误解。该命令搜索任何以单词\
  \ `root` 或单词 `dbus` 开头的密码文件记录。因此，在每个单词之前放置了脱字符（`^`），并用竖线（`|`）分隔单词，表示记录可以是其中任何一个单词开头。\n\
  \n在列表 4.4 显示了此示例。\n\n如果文件包含数字，使用 `sort` 工具得到的结果可能不是你预期的顺序。要获得正确的数值顺序，请在命令中添加 `-n`\
  \ 选项，如列表 4.6 所示。\n\n在列表 4.6 中，注意文件中列出了不同的数字但顺序无序。第二个示例尝试使用不带任何选项的 `sort` 命令对文件进行数值排序。这将产生错误的结果。然而，第三个示例使用了\
  \ `sort -n` 命令，它正确地对文件进行数值排序。\n\n`sort` 命令有几个有用的选项。更常用的开关在表 4.3 中。\n\n| 短 | 长 |\
  \ 描述 |\n| --- | --- | --- |\n| `-c` | `--check` | 检查文件是否已排序。如果文件已排序，不产生输出。如果文件未排序，它将显示文件名、行号、关键字\
  \ `disorder` 以及第一行无序文本。 |\n| `-f` | `--ignore-case` | 排序时将小写字母视为大写字母。 |\n| `-k n1\
  \ [,n2]` | `--key=n1 [,n2]` | 使用 `n1` 字段中的数据对文件进行排序。可以在 `n1` 后加逗号并指定 `n2` 来指定第二个排序字段。字段分隔符默认为空格。\
  \ |\n| `-M` | `--month-sort` | 按月份顺序显示文本。月份必须以标准的三个字母缩写列出，例如 JAN、FEB、MAR 等。 |\n\
  | `-n` | `--numeric-sort` | 按数值顺序显示文本。 |\n| `-o file` | `--output=file` | 创建名为 `file`\
  \ 的新排序文件。 |\n| `-r` | `--reverse` | 反反排序顺序显示文本。 |\n\n表 4.3 `sort` 命令的常用选项\n\n`sort`\
  \ 工具对于格式化小型文本文件非常有用，可以帮助你理解其中包含的数据。通常，在对文件进行排序后，你会发现它包含重复行。`uniq` 命令是 `sort` 命令的一个常用插件。它可以删除重复行，或者相反，只显示重复的行。\n\
  \n例如，假设你收集了家里每个人的购物清单以创建一个列表，然后只需使用 `cat` 命令显示这些条目，如列表 4.7 所示。\n\n查看列表 4.7，你可以看出列表中有些重复项目，所以你想稍微整合一下。列表\
  \ 4.8 显示了在列表上同时使用 `sort` 和 `uniq` 命令的结果。\n\n在列表 4.8 中，`uniq` 命令的输出将原始列表中的重复行替换为每个重复项目的一个条目。\n\
  \n另一个格式化小型文本文件的有用命令是我们已经提到过的 `cat` 命令。\n\n`cat` 命令的初衷目的是连接文件以便显示。这也就是它名称的由来。然而，它通常用于显示单个文件。列表\
  \ 4.9 是连接两个文件并逐接显示其文本内容的示例。\n\n列表 4.9 中显示的两个文件第一行都是数字 `42`。这是你判断一个文件何时结束另一个文件何时开始的唯一方法，因为\
  \ `cat` 工具在输出中并不标记文件的开始或结束。\n\n遗憾的是，`cat` 工具实用的格式化选项经常无人探索。表 4.4 包含了一些常用的开关。\n\n\
  | 短 | 长 | 描述 |\n| --- | --- | --- |\n| `-A` | `--show-all` | 等同于使用选项 `-vET` 组合。\
  \ |\n| `-E` | `--show-ends` | 遇到换行符时显示 `$`。 |\n| `-n` | `--number` | 为文本文件的所有行编号，并在输出中显示该数字。\
  \ |\n| `-s` | `--squeeze-blank` | 不显示重复的空白空文本文件行。 |\n| `-T` | `--show-tabs` | 遇到制表符字符时显示\
  \ `^ I`。 |\n| `-v` | `--show-nonprinting` | 当使用 `^` 和/或 `M-` 表示法遇到时显示非打印字符。 |\n\n\
  表 4.4 `cat` 命令的常用选项\n\n能够 `cat` 命令显示非打印字符是非常实用的。如果你在处理文本文件时，它导致了某种奇怪的问题，你可以快速查看是否嵌入了任何不可打印字符。列表\
  \ 4.10 显示了这种方法的示例。\n\n在列表 4.10 中，第一个 `cat` 命令显示文件，它看起来似乎只包含空行。然而，通过使用 `-v` 选项，你可以发现文件中存在一个非打印字符。`^(∧)G`\
  \ 是脱字符表示法，表示非打印的 Unicode 铃字符 (BEL) 嵌入了文件中。该字符在显示文件时会发出蜂铃声。\n\n\n\n\n\n另一组用于文本格式化的实用工具是\
  \ `pr` 和 `printf` 命令。`pr` 实用已经在第 3 章“管理文件、目录和文本”中介绍过，因此让我们探索一下 `printf` 命令。它的存在唯一目的就是格式化并显示文本数据。它具有以下基本语法：\n\
  \n```\n printf FORMAT [ARGUMENT]...\n```\n\n基本思想是您通过 `FORMAT` 为 `ARGUMENT`提供文本格式化。一个简单的示例在列表\
  \ 4.11 中所示。\n\n在列表 4.11 中，`printf` 命令使用 `%s\\n` 作为格式描述。它被包含在引号内以防止出现意外的结果。`%s` 部分告诉\
  \ `printf` 打印 `ARGUMENT` 中列出的字符字符串，在本例中是 `Hello World`。`FORMAT` 中的 `\\n` 部分告诉 `printf`\
  \ 命令在打印字符串后打印一个换行符。这允许提示符显示在新行上，而不是在显示字符串的末尾。\n\n一旦复习了 `printf` 命令的格式化字符，它们并不困难。一些常用的字符列在表\
  \ 4.5 中。\n\n| FORMAT | 描述 |\n| --- | --- |\n| `%c` | 显示第一个 `ARGUMENT` 字符。 |\n| `%d`\
  \ | 将 `ARGUMENT` 显示为十进制整数。 |\n| `%f` | 将 `ARGUMENT` 显示为浮点数。 |\n| `%s` | 将 `ARGUMENT`\
  \ 显示为字符字符串。 |\n| `\\%` | 显示百分号。 |\n| `\\\"` | 显示双引号。 |\n| `\\` | 显示反斜杠。 |\n| `\\\
  f` | 包含分页符。 |\n| `\\n` | 包含换行符。 |\n| `\\r` | 包含回车符。 |\n| `\\t` | 包含水平制表符。 |\n\n\
  表 4.5 `printf` 命令常用的 FORMAT 设置\n\n在列表 4.12 中，使用 `printf` 命令打印一个带有三位小数的浮点数。我们只需要两位，因此使用了\
  \ `%.2f` 格式。\n\n格式化文本数据有助于发现信息。请务必尝试所有这些命令以获得价值的经验。\n\n### 确定字数\n\n除了格式化数据，在管理服务器时，收集各种文本文件的统计信息也很有帮助。确定文本文件中计数最简单、最常用的工具是\
  \ `wc` 工具。该命令的基本语法如下：\n\n```\n wc [OPTION]... [FILE]...\n```\n\n当您不带选项执行 `wc` 命令并传递文件名时，该工具将按顺序显示文件的行数、单词数和字节数。列表\
  \ 4.13 显示了一个示例。\n\n`wc` 命令有几个有用且常用的选项。这些选项在表 4.6 中显示。\n\n| 短选项 | 完整选项 | 描述 |\n|\
  \ --- | --- | --- |\n| `-c` | `--bytes` | 显示文件的字节数。 |\n| `-L` | `--max-line-length`\
  \ | 显示文件最长行的字节数。 |\n| `-l` | `--lines` | 显示文件的行数。 |\n| `-m` | `--chars` | 显示文件的字符数。\
  \ |\n| `-w` | `--words` | 显示文件的单词数。 |\n\n表 4.6 `wc` 命令常用的选项\n\n用于排除配置文件的一个有趣的 `wc`\
  \ 选项是 `-L` 开关。通常情况下，配置文件的行长度将在 150 字节以下，尽管也有例外。因此，如果您刚刚编辑了一个配置文件而该服务不再运行，请检查文件的最长行长度。比通常长的行长度表示您可能不小心合并了两个配置行。示例在列表\
  \ 4.14 中所示。\n\n在列表 4.14 中，文件的行长度显示了正常的最大行长度为 `72` 字节。如果您有其他无法处理超过某些行长度文本文件的工具，此\
  \ `wc` 命令开关也很有用。\n\n## 重定向输入和输出\n\n在处理文本和文本文件以帮助收集数据时，您可能想要保存这些数据。此外，您可能需要结合多个处理步骤来获取您需要的信息。\n\
  \n### 处理标准输出\n\n需要重要的是，Linux 将每个对象都视为文件。这包括输出过程，例如在屏幕上显示文本文件。每个文件对象都使用文件描述符来标识，这是一个用于分类进程打开文件的整数。标识命令或脚本文件输出的句描述符是\
  \ 1。它也通过缩写 `STDOUT` 标识，表示标准输出。\n\n默认情况下，`STDOUT` 将输出重定向到当前终端。您的进程当前终端由 `/dev/tty`\
  \ 文件表示。讨论标准输出时使用的简单命令是 `echo` 命令。执行 `echo` 命令并带上文本字符串，该字符串将显示在您的进程的 `STDOUT` 中（通常是终端屏幕）。示例在列表\
  \ 4.15 中所示。\n\n`STDOUT` 的奇之处在于，您可以通过命令行上的重定向操作对其进行重定向。重定向操作允许您更改输入和输出发送的默认位置。对于\
  \ `STDOUT`，您使用 `>` 重定向操作重定向输出，如列表 4.16 所示。\n\n在列表 4.16 中，正在通过 `grep` 命令对所有使用 `/sbin/nologin`\
  \ shell 的账户进行密码文件审核。`grep` 命令的输出很长，在列表中被截取了。如果将 `STDOUT` 重定向到文件将简单得多。这在列表 4.16 中通过执行相同的\
  \ `grep` 命令，但在命令末尾加上重定向操作 `>` 和文件名来实现。其效果是将命令的输出发送到文件 `NologinAccts.txt` 而不是屏幕。现在可以使用\
  \ `less` 工具查看该数据文件了。\n\n要向已存在的文件追加数据，您需要使用略有不同的重定向操作。`>>` 操作符会将数据追加到现有文件。如果文件不存在，则会创建它并将输出的数据添加到其中。列表\
  \ 4.17 显示了使用此重定向操作的示例。\n\n列表 4.17 中的第一个命令将日期戳放入 `AccountAudit.txt` 文件中。由于该日期戳需要被保留，下一个命令使用\
  \ `>>` 重定向操作将 `STDOUT` 追加到文件中。未来的命令可以继续使用 `>>` 操作对文件进行追加。\n\n### 重定向标准错误\n\n另一个实用的重定向项是标准错误。标识命令或脚本文件错误的文件描述符是\
  \ 2。它也通过缩写 `STDERR` 标识，表示标准错误。`STDERR` 与 `STDOUT` 一样，默认发送到您的终端（`/dev/tty`）。\n\n\
  将 `STDERR` 发送到文件的基本重定向操作是 `2>` 操作符。如果您需要追加文件，请使用 `2>>` 操作符。列表 4.18 显示了重定向标准错误的示例。\n\
  \n列表 4.18 中的第一个命令执行用于查找 `/etc/` 目录内任何包含 `hosts:` 指令的文件。遗憾的是，由于用户没有超级用户权限，生成了多个 `permission\
  \ denied` 错误信息。这弄乱了输出，使得难以看到哪些文件包含此指令。\n\n为了清理输出，列表 4.18 中的第二个命令使用 `2>` 重定向操作将 `STDERR`\
  \ 重定向到 `err.txt` 文件。这使得查看哪些文件包含该指令变得容易得多。\n\n\n\n\n\n如果你不在意保留错误信息的副本，可以随时将其丢弃。这通过将\
  \ `STDERR` 重定向到 `/dev/null` 文件来实现，如列表 4.19 中的代码所示。\n\n`/dev/null` 文件有时被称为“黑洞”。这个名字源于你放入其中的任何内容都无法被检索回。\n\
  \n### 调节标准输入\n\n默认情况下，标准输入通过键盘或其他输入设备进入你的 Linux 系统。标识命令或脚本文件输入的文件描述符是 `0`。它也通过缩写\
  \ `STDIN` 标识，表示标准输入。\n\n与 `STDOUT` 和 `STDERR` 一样，你也可以重定向 `STDIN`。基本的重定向运算符是 `<`\
  \ 符号。`tr` 命令是少数几个需要你重定向标准输入的工具之一。示例如列表 4.20 所示。\n\n在列表 4.20 中，文件`Grades.txt` 包含各种由空格分隔的整数。第二个命令利用\
  \ `tr` 工具将这些空格更改为逗号（`,`）。因为 `tr` 命令需要 `STDIN` 重定向符号，因此它也被用于第二个命令，并在后面紧跟文件名。请记住，此命令并没有修改\
  \ `Grades.txt` 文件。它只是向 `STDOUT` 显示了文件应用这些更改后的样子。\n\n能有一个关于重定向运算符的简洁总结是非常好的。因此，我在表\
  \ 4.7 中提供了一个表格。\n\n| 运算符 | 说明 |\n| --- | --- |\n| `>` | 将 `STDOUT` 重定向到指定文件。如果文件存在，则覆盖它。如果不存在，则创建它。\
  \ |\n| `>>` | 将 `STDOUT` 重定向到指定文件。如果文件存在，则在其末尾追加。如果不存在，则创建它。 |\n| `2>` | 将 `STDERR`\
  \ 重定向到指定文件。如果文件存在，则覆盖它。如果不存在，则创建它。 |\n| `2>>` | 将 `STDERR` 重定向到指定文件。如果文件存在，则在其末尾追加。如果不存在，则创建它。\
  \ |\n| `&>` | 将 `STDOUT` 和 `STDERR` 重定向到指定文件。如果文件存在，则覆盖它。如果不存在，则创建它。 |\n| `&>>`\
  \ | 将 `STDOUT` 和 `STDERR` 重定向到指定文件。如果文件存在，则在其末尾追加。如果不存在，则创建它。 |\n| `<` | 将 `STDIN`\
  \ 从指定文件重定向到命令。 |\n| `<>` | 将 `STDIN` 从指定文件重定向到命令，并将 `STDOUT` 重定向到指定文件。 |\n\n表 4.7\
  \ 常用重定向运算符\n\n重定向 `STDOUT` 和 `STDIN` 的实用示例涉及 `diff` 工具，该工具在第 3 章中介绍。`diff` 工具允许你发现两个文本文件之间的差异，并修改不同的文本文件使两个文件相同。这涉及几个步骤。前几个步骤如列表\
  \ 4.21 所示，并附有额外的解释命令。\n\n在列表 4.21 中，`pr` 工具并排显示两个文件 `numbers.txt` 和 `random.txt`。你可以看到这两个文件之间差异。创建了\
  \ `numbers.txt` 的一个新副本，这样如果发生任何问题，更改也只作用在新文件 `n.txt` 上。`diff` 命令使用 `-e` 选项创建一个 `ed`\
  \ 脚本。该脚本将使 `n.txt` 文件与 `random.txt` 文件相同。\n\n在执行创建的脚本之前，必须向其添加一些额外项目。在列表 4.22 中，使用了两次\
  \ `echo` 命令向脚本中追加字母。\n\n在列表 4.22 中，最后一个命令将 `ed` 脚本 `switch.sh` 显示到标准输出。该脚本将修改 `n.txt`\
  \ 文件，如列表 4.23 所示。\n\n在列表 4.23 中，`diff` 命令对两个文件进行简单的比较。注意它向 `STDOUT` 发送了一条消息文件不同的消息。然后使用了\
  \ `ed` 工具。为了执行列表 4.23 中 `diff` 命令创建的脚本，使用了 `STDIN` 重定向运算符。列表 4.23 中的最后一个命令显示这两个文件之间现在没有差异了。\n\
  \n## 管道命令\n\n如果你真的想在 Linux 命令行中实现强大且快速的结果，你需要探索管道。管道是一个由 ASCII 字符 124 (`|`) 表示的简单重定向运算符，它被称为竖线、垂直斜杠或垂直线。\n\
  \n通过管道，你可以在同一条命令行上的多个命令之间重定向 `STDOUT`、`STDIN` 和 `STDERR`。现在管道重定向的基本语法如下：\n\n```\n\
  command1 | command2\n```\n\n`pipe` 显示执行了第一个命令 `command1`。它的 `STDOUT` 被重定向为 `STDIN`\
  \ 输入到第二个命令 `command2`。列表 4.24 显示了管道的简单用法。\n\n在列表 4.24 中，管道中的第一个命令搜索密码文件中任何以 `/bin/bash`\
  \ 结尾的记录。该输出被传递到第二个命令。`wc -l` 命令将统计 `grep` 命令产生了多少行。结果显示该系统有三个使用 Bash shell 的账户。\n\
  \n你可以创造性地使用管道重定向。列表 4.25 显示了一个在流水线中使用四种不同工具的命令，用于审计使用 `/sbin/nologin` 默认 shell 的账户。\n\
  \n在列表 4.25 中，`grep` 命令的输出作为输入传递给 `cut` 命令。`cut` 工具删除每个密码记录的第一个字段，即用户名。`cut` 命令的输出被用作\
  \ `sort` 命令的输入，它按字母顺序对用户名进行排序。最后，`sort` 工具的输出作为输入传递给 `less` 命令。\n\n当你既想保留命令管道输出的副本又查看它时，`tee`\
  \ 命令将非常有帮助。类似于水管中的 T 型管道接头（水流向多个方向发送），`tee` 命令允许你同时将输出保存到文件并将其显示到 `STDOUT`。列表 4.26\
  \ 包含了此实用命令的示例。\n\n列表 4.26 中的第一个命令搜索密码文件中任何以 `/bin/bash` 结尾的用户账户记录。该输出被传递给 `tee`\
  \ 命令，它在显示输出的同时将其保存到 `BashUsers.txt` 文件中。\n\n### 创建在此文档 (Here Documents)\n\n另一种 `STDIN`\
  \ 重定向形式可以使用“在此文档”（here document）完成，它有时被称为 `here text` 或 `herdoc`。在此文档允许你将多个项目重定向到命令中。它还可以使用脚本修改文件、创建脚本、在脚本中保留数据等。\n\
  \n在此文档重定向运算符是 `<<` 后后跟一个关键字。该关键字可以是任何内容，它标志着数据的开始以及结束。列表 4.27 显示了使用 `sort` 命令配合在此文档的示例。\n\
  \n\n\n\n\n在列表 4.27 中，输入 `sort` 命令，随后输入 `<<` 重定向操作符关键字 `EOF`。按下回车键后，会出现次级提示符 `>`，表示可以输入更多数据。输入三个需要排序的单词。再次输入关键字\
  \ `EOF` 表示数据输入完成。当此操作发生时，`sort` 实用程序会将这些单词按字母顺序进行排序，并将结果显示到 STDOUT。\n\n### 创建命令行\n\
  \n创建命令行命令是一项实用的技能。你可以使用几种不同的方法。其中一种方法是使用 `xargs` 工具。这个工具最妙的一点是，当你发读它的名字时听起来很像个海盗，但它也有其他实用价值。\n\
  \n通过通过管道（pipe）将其他命令的 STDOUT 导入 `xargs` 工具，你可以动态构建命令行命令。列表 4.28 展示了这种操作的示例。\n\n在列表\
  \ 4.28 中，第一个命令找到 `tmp` 子目录中的任何空文件（`-size 0`）。第二个命令执行相同的操作，但这次将 `find` 命令的输出作为 STDIN\
  \ 传给 `xargs` 工具。`xargs` 命令使用 `ls` 命令来列出文件。注意，`xargs` 不仅需要 `ls` 命令的名字，还需要程序在虚拟目录树中的位置。\n\
  \n虽然列表 4.28 中的命令具有教育意义，但它们并不实用，因为你只用使用 `find` 实用程序就能获得相同的信息。列表 4.29 展示了使用 `xargs`\
  \ 工具的功能性用法。\n\n列表 4.29 中使用的 `xargs` 命令使用了 `-p` 选项。该选项会导致 `xargs` 工具在执行构建的命令行命令之前停止并请求许可。注意，创建的命令将通过一个\
  \ `rm` 命令删除所有三个空文件。在你输入 `y` 并按下回车键后，命令开始执行，三个文件被删除。这是一种查找和删除不需要的文件非常方便的方法。\n\n动态创建命令行命令的其他方法使用\
  \ shell 扩展（shell expansion）。第一方法是将要执行的命令放在括号内，并在前面加一个美元符号。这种方法的示例见列表 4.30。\n\n在列表\
  \ 4.30 中，再次使用 `find` 命令定位 `tmp` 子目录中的任何空文件。由于命令被 `$()` 符号包裹，它不会显示到 STDOUT。相反，文件名被传递给\
  \ `ls` 实用程序，由它将文件显示到 STDOUT。当然，如果能删除这些文件会更有用，但在接下来的几个示例中需要它们。\n\n下方法是将要执行的命令放在反引号（``\
  \ ` ``）中。注意，反引号不是单引号。你通常可以在与波浪号（~）符号相同的键盘键上找到反引号。这种方法的示例见列表 4.31。\n\n注意列表 4.31 中创建的命令行命令的行为与列表\
  \ 4.30 中构建的命令完全一致。反引号之间的命令执行，其输出作为输入传递给 `ls` 实用程序。\n\n创建命令的另一种方法是大括号扩展（brace expansion）。这种方便的方法允许你减少在命令行中的输入字量。列表\
  \ 4.32 提供了大括号扩展的一个有用示例。\n\n注意列表 4.32 中删除了两个文件。你不需要输入完整的文件名，而是可以使用大括号（`{}`）。这些大括号包含两个用逗号分隔的数字。这导致\
  \ `rm` 实用程序在大括号所在的位置将第一个文件名替换为 `1`，将第二个文件名替换为 `3`。从本质上说，大括号扩展方法允许你在命令参数中指定多个替换。因此，在动态构建命令时，你可以发挥创意。\n\
  \n### 编辑文本文件\n\n在管理 Linux 系统时，经常需要进行文本操作。你可能需要使用流编辑器（stream editor）或功能全交互式文本编辑器来完成任务。在接下来的章节中，我将介绍这两类型的编辑器。\n\
  \n### 欣赏文本编辑器\n\n无论你需要修改配置文件还是创建 shell 脚本，能够使用交互式文本编辑器都是一项重要技能。此外，了解不仅仅一种编辑器也是好主意。因此，我将介绍\
  \ `nano` 和 `vim` 文本编辑器。\n\n如果你从未处理过编辑器或只用过 GUI 编辑器，`nano` 是一个很好的起点。要开始使用 `nano`\
  \ 文本编辑器，输入 `nano` 后跟你想要编辑或创建的文件。图 4.1 显示了正在运行的 `nano` 文本编辑器界面。\n\n![GNU nano 文本编辑器的截图，带有三行测试文本，底部有编辑器命令。](img/c04f001.png)\n\
  \n图 4.1 使用 `nano` 文本编辑器\n\n在图 4.1 中，你可以看到 `nano` 文本编辑器的四个主要部分：\n\n*   **标题栏**：标题栏位于\
  \ `nano` 文本编辑器窗口的最顶行。它显示当前编辑器的版本以及你正在编辑的文件名。在图 4.1 中，正在编辑的文件是 `test1.txt`。如果你只输入\
  \ `nano` 而不包含文件名，将在标题栏中看到 `New Buffer`。\n*   **正文**：`nano` 文本编辑器的正文是你进行编辑的地方。如果文件已包含文本，它的前几行显示在此区域。如果你需要查看正文之外的文本，可以使用方向键、Page\
  \ Up 或 Down 键和/或页面移动快捷键组合在文本中移动。\n*   **状态栏**：状态栏并不总是包含信息。它只显示某些事件的状态信息。例如，在图 4.1\
  \ 中，文本文件刚刚在 `nano` 中打开，因此状态栏区域显示 `[Read 3 lines]`，表示已将三行文本读取到编辑器中。\n*   **快捷键列表**：快捷键列表是编辑器最实用的功能之一。通过扫一眼窗口底部的列表，你可以看到常用的命令及其相关的快捷键。列表中的脱字符符号（^）表示必须使用\
  \ Ctrl 键。例如，要剪切文本，按住 Ctrl 键然后按 K 键。要查看更多命令，按下 Ctrl+G 键组合以获取帮助。\n\n`nano` 文本编辑器非常适合简单的文本文件修改。然而，如果你需要一个更强大的文本编辑器来创建程序或\
  \ shell 脚本，`vim` 编辑器是一个流行的选择。\n\n在我开始谈论如何使用 `vim` 编辑器之前，我需要谈谈 `vim` 与 `vi` 的区别。`vi`\
  \ 编辑器是一种 Unix 文本编辑器，当它被重写为开源工具时，得到了改进。因此，`vim` 代表“vvi improved”（改进的 vi）。\n\n你通常会发现\
  \ `vi` 命令会启动 `vim` 编辑器。在其他发行中，只有 `vim` 命令会启动 `vim` 编辑器。有时两个命令都有效。列表 4.33 展示了如何使用\
  \ `which` 工具确定 Red Hat Linux 发行版正在什么命令。\n\n列表 4.33 显示该 Red Hat Linux 发行版将 `vi` 命令别名指向\
  \ `vim` 命令。因此，对于该发行版，`vi` 和 `vim` 命令都会启动 `vim` 编辑器。\n\n要开始使用 `vim` 文本编辑器，根据你的发行版输入\
  \ `vim` 或 `vi`，后跟你想要编辑或创建的文件名。图 4.2 显示了正在运行的 `vim` 文本编辑器界面。\n\n\n\n\n\n![文本编辑器窗口截图，显示了\
  \ 3 行文本和提到的字符数。](img/c04f002.png)\n\n## 图 4.2](#c004.xhtml_rc0-fig-2) 使用 `vim` 文本编辑器\n\
  \n在图 4.2 中，正在编辑的文件再次是 `test1.txt` 文件。`vim` 编辑器将文件数据加载到内存缓冲区中，该缓冲区显示在屏幕上。如果你在打开 `vim`\
  \ 时没有指定文件名，或者输入的文件名尚不存在，`vim` 将启动一个新的缓冲区区域进行编辑。\n\n`vim` 编辑器在底行附近有一个消息区域。如果你刚刚打开了一个已经创建的文件，它将显示文件名以及读取到缓冲区区的行数和字符。如果你正在创建一个新文件，你将在消息区域中看到\
  \ `[New File]`（新文件）。\n\n`vim` 编辑器有三种标准模式：\n\n*   **命令模式 (Command Mode)**：这是 `vim`\
  \ 初进入缓冲区区域时使用的模式；有时也称为普通模式。在这里，你通过输入按键来执行命令。例如，按下 `J` 键会将光标向下移动。这是在缓冲区区域内快速移动的最佳模式。\n\
  *   **插入模式 (Insert Mode)**：插入模式也称为编辑模式或输入模式。这是你可以进行简单编辑的模式。这里没有多少命令或特殊的模式按键。你通过按下\
  \ `I` 键从命令模式进入此模式。此时，消息区域将显示 `--Insert--`。你通过按下 `Esc` 键退出此模式。\n*   **Ex 模式 (Ex Mode)**：这种模式有时也称为冒号命令\
  \ (`colon commands`)，因为在这里输入的每个命令前面都有一个冒号 (`:`)。例如，要退出 `vim` 编辑器且不保存任何更改，你输入 `:q`\
  \ 并按下回车键。\n\n由于你进入 `vim` 编辑器的缓冲区区域时起始处于命令模式，因此了解一些在该模式下移动的常用命令是有益的。表 4.8 包含了几个供你参考的移动命令。\n\
  \n| 按键 | 描述 |\n| --- | --- |\n| `h` | 光标向左移动一个字符。 |\n| `l` | 光标向右移动一个字符。 |\n| `j`\
  \ | 光标向下移动一行（文本中的下一行）。 |\n| `k` | 光标向上移动一行（文本中的上一行）。 |\n| `w` | 光标向前移动一个单词，到下一个单词开头。\
  \ |\n| `e` | 光标移动到当前单词末尾。 |\n| `b` | 光标向后移动一个单词。 |\n| `^` | 光标移动到行首。 |\n| `$` |\
  \ 光标移动到行尾。 |\n| `gg` | 光标移动到文件的第一行。 |\n| `G` | 光标移动到文件的最后一行。 |\n| `*n`*G | 光标移动到文件的第\
  \ `n` 行。 |\n| `Ctrl+B` | 向上滚动几乎一个屏幕。 |\n| `Ctrl+F` | 向下滚动几乎一个屏幕。 |\n| `Ctrl+U` |\
  \ 向上滚动半个屏幕。 |\n| `Ctrl+D` | 向下滚动半个屏幕。 |\n| `Ctrl+Y` | 向上滚动一行。 |\n| `Ctrl+E` | 向下滚动一行。\
  \ |\n\n表 4.8 用的 `vim` 命令模式移动命令\n\n在 `vim` 编辑器缓冲区中快速移动是非常用的。然而，还有几个编辑命令可以加速你的修改过程。例如，通过将光标移动到单词的第一个字母并按下\
  \ `CW`，该单词会被删除，并且你会进入插入模式。然后你可以输入新单词并按下 `Esc` 退出插入模式。\n\n一旦你在 `vim` 缓冲区区域执行了任何必要的文本更改，就是时候保存你的工作了。你可以在命令模式下输入\
  \ `ZZ` 将缓冲区写入磁盘并退出 `vim` 编辑器进程。\n\n第三种 `vim` 模式——Ex 模式具有额外的实用命令。你必须在命令模式下进入 Ex 模式。你无法从插入模式直接跳转到\
  \ Ex 模式。因此，如果你当前处于插入模式，请先按下 `Esc` 键返回命令模式。\n\n表 4.9 显示了几个可以帮助你管理文本文件的 Ex 命令。注意，所有按键都包含了使用\
  \ Ex 命令所需的冒号 (`:`)。\n\n| 按键组合 | 描述 |\n| --- | --- |\n| `:x` | 将缓冲区写入文件并退出编辑器。 |\n\
  | `:wq` | 将缓冲区写入文件并退出编辑器。 |\n| `:wq!` | 将缓冲区写入文件并退出编辑器（覆盖保护）。 |\n| `:w` | 将缓冲区写入文件并留在编辑器中。\
  \ |\n| `:w!` | 将缓冲区写入文件并留在编辑器中（覆盖保护）。 |\n| `:q` | 退出编辑器且不写入缓冲区。 |\n| `:q!` | 退出编辑器且不写入缓冲区（覆盖保护）。\
  \ |\n| `:! command` | 执行 shell `command` 并显示结果，但不退出编辑器。 |\n| `:r! command` | 执行\
  \ shell `command` 并将结果包含在编辑器缓冲区区域。 |\n| `:r file` | 读取 `file` 内容并包含在编辑器缓冲区区域。 |\n\
  \n表 4.9 常 `vim` Ex 模式命令\n\n在读完各种模式命令后，你可能就明白为什么有些人鄙视 `vim` 编辑器了。有很多晦涩的命令需要记忆。然而，有些人非常喜欢\
  \ `vim` 编辑器是因为它非常强大。\n\n只学习一个文本编辑器而忽略其他的想法很有吸引力。当然，这并不能帮助你通过 CompTIA Linux+ 认证考试。但是，至少了解两个文本编辑器对你的日常\
  \ Linux 工作是有用的。对于简单的修改，`nano` 文本编辑器表现优异。对于更复杂的编辑，`vim` 编辑器是王者。这两者都值得你花时间精通。\n\n\
  ### 学习流编辑器\n\n有时，你想要编辑文本文件，而又不想调出一个全全的编辑器。在这种情况下，学习两种非常流行的流编辑器是值得的。流编辑器修改通过文件传递给它的文本。我将探索的流编辑器被称为流编辑器。调用它的命令是\
  \ `sed`。`sed` 工具根据你提供的命令来编辑文本流。\n\n`sed` 经历的过程如下：\n\n1. 从输入中读取一行文本\n2. 使用指定的编辑器匹配该文本\n\
  3. 按照指定修改文本\n4. 将修改后的文本输出到标准输出\n\n在查看一些 `sed` 示例之前，你应该理解命令的基本语法：\n\n```\nsed [OPTIONS]\
  \ [SCRIPT]... [FILENAME]\n```\n\n默认情况下，`sed` 将使用标准输入 (STDIN) 的文本进行修改。示例在列表 4.34\
  \ 中。\n\n注意列表 4.34，`echo` 命令的文本输出通过管道作为输入到流编辑器。`sed` 工具的 `s`（替换）命令指定如果发现了第一个文本字符串\
  \ `cake`，则在输出中将其更改为 `donuts`。注意 `sed` 之后的整个命令被视为 `SCRIPT`，并且它被封装在单引号中。同样注意文本单词通过正斜杠\
  \ (`/`) 与 `s` 命令、引号以及彼此之间隔开。\n\n\n\n\n\n你也可以修改存储在文件中的文本。Listing 4.36 显示了此示例。\n\n\
  在 Listing 4.36 中，文件包含含有单词 `cake` 的文本行。当将 `cake.txt` 文件作为参数传递给 `sed` 命令时，其数据将根据脚本被修改。请注意，文件中的数据并没有被修改。流编辑器仅将修改后的文本显示到\
  \ `STDOUT`。\n\n流编辑器有一些相当实用的命令选项。常用的选项显示在 Table 4.10 中。\n\n| 缩写 | 完整形式 | 说明 |\n\n\
  | --- | --- | --- |\n| `-e` `script` | `--expression=`script` | 将 `script` 中的命令添加到文本处理中。`script`\
  \ 作为 `sed` 命令的一部分编写的。 |\n| `-f` `script` | `--file=`script` | 将 `script` 中的命令添加到文本处理中。`script`\
  \ 是一个文件。 |\n| `-r` | `--regexp-extended` | 在脚本中使用扩展正则表达式。 |\n\nTABLE 4.10 `sed`\
  \ 命令常用的选项\n\n一个实用的选项是 `-e` 选项。它允许你在 `sed` 命令中使用多个脚本。示例在 Listing 4.37 中所示。\n\n请密切注意\
  \ Listing 4.37 中的语法变化。不仅使用了 `-e` 选项，脚本也略有不同。现在脚本在两个脚本命令之间包含一个分号（`;`）。这允许两个命令都在文本流上进行处理。\n\
  \n如果你有许多 `sed` 脚本命令，可以将它们存储在一个文件中。这样做非常方便，因为你可以重复使用该脚本文件。Listing 4.38 显示了使用一次 `sed`\
  \ 脚本的示例。\n\n在 Listing 4.38 中，注意 `sed` 脚本的每个文件行都有单独的 `sed` 命令。这里没有使用单引号。一旦将 `sed`\
  \ 命令配合 `-f` 选项和脚本文件参数使用，更改将应用于文件数据并显示在 `STDOUT` 中。\n\n`gawk` 工具也是一个流编辑器，但它通过其编程语言提供了更强大的编辑过程。通过\
  \ `gawk` 编程语言你可以你可以以下操作：\n\n* 定义变量存储数据。\n* 使用算术和字符串运算符处理数据。\n* 使用编程结构（如循环）为你的处理添加逻辑。\n\
  * 从数据创建格式化报告。\n\n`gawk` 编程语言因从大型数据集中创建格式化报告而广受欢迎。你可以创建 `gawk` 程序并将其存储在文件中反复使用。\n\
  \n`awk` 和 `gawk` 之间存在一些困惑，让我们在深入研究 `gawk` 工具之前先解决这个问题。`awk` 程序是为 Unix 操作系统创建，因此当\
  \ GNU 项目重写它时，将其命名为 GNU `awk`，简称为 `gawk`。然而，在许多发行版中，你可以使用这两个命令，但它们实际上都调用 `gawk` 程序。Listing\
  \ 4.39 显示了 Ubuntu 发行版上的示例。\n\n在 Listing 4.39 中，你可以看到该发行版存在 `awk` 命令。然而，当你沿着软链接找到实际使用的程序时，它指向\
  \ `gawk` 程序。`gawk` 命令同样存在。\n\n在查看一些 `gawk` 示例之前，理解命令的基本语法非常重要。如下：\n\n```\n Gawk\
  \  [OPTIONS] [PROGRAM]... [FILENAME]\n```\n\n与 `sed` 类似，你可以在 `gawk` 命令的同一命令行中提供程序。它也使用单引号来包裹脚本。然而，与\
  \ `sed` 不同，`gawk` 工具要求将编程语言命令放在两个大括号之间。示例在 Listing 4.40 中所示。\n\n`print` 命令将文本显示到\
  \ `STDOUT`，但注意显示了 `STDIN` 的不同部分，如 Listing 4.40 所示。这是通过 `gawk` 工具定义的数据字段变量实现的。它们的定义如下：\n\
  \n* `$0` 变量代表整个文本行。\n* `$1` 变量代表文本行的第一个数据字段。\n* `$2` 变量代表文本行的第二个数据字段。\n* `$n` 变量代表文本行的\
  \ `n` 个数据字段。\n\n`gawk` 工具也可以处理来自文件的文本数据。此类的示例在 Listing 4.41 所示。\n\n`gawk` 编程语言因从大型数据集中创建格式化报告而广受欢迎。你可以创建\
  \ `gawk` 程序... 在 Listing 4.42 中，注意 `sed` 脚本的每个文件行都有单独的 `sed` 命令。这里没有使用单引号。一旦将 `sed`\
  \ 命令配合 `-f` 选项和脚本文件参数使用，更改将应用于文件数据并显示在 `STDOUT` 中。\n\n`gawk` 工具也是一个流编辑器，但它通过其编程语言提供了更强大的编辑过程。通过\
  \ `gawk` 编程语言你可以你可以以下操作：\n\n* 定义变量存储数据。\n* 使用算术和字符串运算符处理数据。\n* 使用编程结构（如循环）为你的处理添加逻辑。\n\
  * 从数据创建格式化报告。\n\n\n\n\n\n# 描述用于编辑文本文件的各种方法。\n\n编辑文本文件是系统管理员工作内容的一部分。你可以使用全屏编辑器，例如相当复杂的\
  \ `vim` 文本编辑器，或者简单易用的 `nano` 编辑器。对于快速且强大的文本流编辑，请使用 `sed` 及其脚本，或者使用 `gawk` 编程语言。\n\
  \n## 复习题\n\n你可以在附录 A 中找到复习题的答案。\n\n1. 输入 `cat -E MyFile.txt` 命令后，显示的每行末尾都有一个 `$`。这表示什么？\n\
  \    1. 文本文件由于某种原因损坏了。\n    2. 文本记录以 ASCII 字符 `NUL` 结束。\n    3. 文本记录以 ASCII 字符 `LF`\
  \ 结束。\n    4. 文本记录以 ASCII 字符 `$` 结束。\n    5. 文本记录的末尾包含一个 `$`。\n\n2. `cut` 工具通常需要分隔符来处理文本记录。以下哪项是对分隔符的最佳描述？\n\
  \    1. 指定记录中行开始的一个或多个字符\n    2. 指定记录中行结束的一个或多个字符\n    3. 向命令行文本处理工具指定文本文件结束的一个或多个字符\n\
  \    4. 单个空格或冒号（`:`），用于在记录中不同数据项之间创建边界\n    5. 在记录中不同数据项之间创建边界的一个或多个字符\n\n3. 哪些工具可以更改文件中的文本？（选择所有适用项。）\n\
  \    1. `cut`\n    2. `sort`\n    3. `vim`\n    4. `nano`\n    5. `sed`\n\n4. 你有一个文本文件\
  \ `monitor.txt`，其中包含有关数据中心内用显示器的信息。每条记录都以 ASCII `LF` 字符结束，字段由逗号（`,`）分隔。一个文本记录包含显示器\
  \ ID、制造商、序列号和位置。要显示每个数据中心显示器的显示器 ID、序列号和位置，应该使用哪条 `cut` 命令？\n    1. `cut -d \",\"\
  \ -f 1,3,4 monitor.txt`\n    2. `cut -z -d \",\" -f 1,3,4 monitor.txt`\n    3. `cut\
  \ -f \",\" -d 1,3,4 monitor.txt`\n    4. `cut monitor.txt -d \",\" -f 1,3,4`\n \
  \   5. `cut monitor.txt -f \",\" -d 1,3,4`\n\n5. `grep` 工具可以在其 `PATTERN` 中使用正则表达式。以下哪项是对正则表达式的最佳描述？\n\
  \    1. 你为工具定义的一系列字符，该工具使用这些字符匹配文本文件中的相同字符\n    2. 工具用于过滤文本的 ASCII 字符（如 `LF` 和 `NUL`）\n\
  \    3. 工具用于过滤文本的通配符（如 `*` 和 `?`）\n    4. 你为工具定义的模式模板，该工具使用该模式来过滤文本\n    5. 用在字符周围的引号（单引号或双引号），用防止出现意外结果\n\
  \n6. 你是 Red Hat Linux 服务器上的系统管理员。你需要查看 `/var/log/messages` 文件中以 5 月 30 日开头并以 IPv4\
  \ 地址 192.168.10.42 结尾的记录。以下哪项是最佳的 `grep` 命令？\n    1. `grep \"May 30?192.168.10.42\"\
  \ /var/log/messages`\n    2. `grep \"May 30.*192.168.10.42\" /var/log/messages`\n\
  \    3. `grep -i \"May 30.*192.168.10.42\" /var/log/messages`\n    4. `grep -i \"\
  May 30?192.168.10.42\" /var/log/messages`\n    5. `grep -v \"May 30.*192.168.10.42\"\
  \ /var/log/messages`\n\n7. 以下哪些项是可以与 `grep` 命令配合 BRE 模式？（选择所有适用项。）\n    1. `Sp?ce`\n\
