  \    1. `dnsmasq`\n    2. `whois`\n    3. `nmap`\n    4. `nslookup`\n    5. `ipset\
  \ list`\n\n5. Linux 系统管理员 Mera 认为她系统上的一个新应用程序为特定分区产生了过多的 I/O，导致系统处理器看起来很缓慢。她应该使用哪种工具来测试她的问题原因理论？\n\
  \    1. `iostat`\n    2. `ioping`\n    3. `du`\n    4. `df`\n    5. `iotop`\n\n\
  6. 通过分析，Arthur 认为更改 I/O 调度器将提高 I/O 吞吐量。他的系统中有一个实时应用程序，它使用位于固态硬盘上的数据库。Arthur 应该选择哪种\
  \ I/O 调度器？\n    1. `scheduler`\n    2. `deadline`\n    3. `queue`\n    4. `cfq`\n\
  \    5. `noop`\n\n7. 使用 `uptime` 命令，你将以什么增量查看 CPU 负载平均值？（选择所有项）\n    1. 1 分钟\n \
  \   2. 5 分\n    3. 10 分\n    4. 15 分\n    5. 20 分\n\n8. Mary 想查看她的系统处理器随时间变化的性能。哪种工具最适合她使用？\n\
  \    1. `uptime`\n    2. `sysstat`\n    3. `sar`\n    4. `cat /proc/cpuinfo`\n \
  \   5. `sysctl`\n\n9. Gertie 需要确定交换空间（swap space）元素的类型、名称和优先级。她应该使用哪条命令？\n    1.\
  \ `vmstat`\n    2. `free`\n    3. `fstab`\n    4. `swapoff`\n    5. `swapon -s`\n\
  \n10. Elliot 正在管理一个具有多个交换区的 Linux 系统。其中一个位于逻辑卷，但需要更多空间来适应未来将安装的额外内存。Elliot 添加交换区的最佳方法是什么？\n\
  \    1. 添加分区并使用 `mkswap` 命令对其格式化。\n    2. 添加文件并使用 `mkswap` 命令对其格式化。\n    3. 通过 `swapon`\
  \ 工具添加分区。\n    4. 通过 `swapon` 工具添加文件。\n    5. 使用 LVM 工具增加逻辑卷的大小。\n\n# 第 21 章：优化性能\n\
  \n![](img/chaptersquare.png)\n\n本章讨论了 Linux 如何处理运行在系统上的应用程序。Linux 必须跟踪许多同时运行的不同程序。作为\
  \ Linux 管理员，你的目标是确保一切运行顺畅。本章展示了 Linux 如何跟踪所有活动程序，以及你如何查看这些信息。你还将看到如何使用命令行工具管理在 Linux\
  \ 系统上运行的程序。\n\n## 查看进程\n\n在任何时刻，Linux 系统上都有许多正在运行的程序。Linux 将每个运行的程序称为 `process`（进程）。一个进程可以在前台运行，在控制台显示器或图形桌面窗口上显示输出；也可以在后台运行，在背后处理数据。Linux\
  \ 系统为每个进程分配一个 `process id (PID)`，并根据该 PID 管理进程使用内存和 CPU 时间的方式。\n\n当 Linux 系统首次启动时，它会启动一个特殊的\
  \ `init process`（初始化进程）。`init` 进程是 Linux 系统的核心；它运行启动系统上所有其他进程的脚本，包括启动你登录时使用的文本控制台和图形窗口的进程（参见第\
  \ 6 章，“维护系统启动和服务维护](#c006.xhtml_c006)”）。\n\n你可以使用 `ps` 命令查看你的 Linux 系统当前正在运行哪些进程。`ps`\
  \ 命令的默认输出如下：\n\n```\n $ ps\nPID      TTY         TIME           CMD\n 2797 pts/0\
  \       00:00:00  bash\n 2884 pts/0       00:00:00  ps\n$\n```\n\n默认情况下，`ps` 命令只显示在当前用户\
  \ shell 中运行的进程。在这个示例中，我只运行了命令提示符 shell（Bash），当然还有 `ps` 命令本身。\n\n`ps` 命令的基本输出显示分配给每个进程的\
  \ PID、它们启动的终端（TTY）以及进程已使用的 CPU 时间。\n\n`ps` 命令棘手的特性（也是它如此复杂的原因）是，Linux 中曾经存在过两个版本。每个版本都有自己的一套控制其显示信息的命令行参数。这使得在不同系统之间切换变得有些复杂。\n\
  \n最近，GNU 开发者决定将这两个版本合并为一个单一的 `ps` 程序，他们他们还添加了一些自己的额外参数。Linux 中使用的当前 `ps` 程序支持三种不同风格的命令行参数：\n\
  \n*   Unix 风格参数，以连字符 `-` 开头\n*   BSD 风格参数，不以连字符开头\n*   GNU 长参数，以双连字符 `--` 开头\n\n\
  这使得 `ps` 命令有许多可能的参数和选项可以使用。你可以查阅 `ps` 手页查看所有可用的参数。大多数 Linux 管理员都有自己记住的常用参数组合，用于提取相关信息。例如，如果你需要查看系统上运行的每个进程，使用\
  \ Unix 风格的 `-ef` 参数组合，如下：\n\n```\n $ ps -ef\nUID      PID  PPID  C  STIME TTY  \
  \         TIME CMD\nroot       1     0      0  09:02  ?           00:00:02  /sbin/init\n\
  root       2     0      0  09:02  ?           00:00:00  [kthreadd]\nroot       3\
  \     2      0  09:02  ?           00:00:00  [softirqd]\nroot       4     0    \
  \  0  09:02  ?           00:00:00  [ksoftirqd]\nroot       5     0      0  09:02\
  \  ?           00:00:00  [kworker/0]\nroot       6     0      0  09:02  ?      \
  \     00:00:00  [kworker/0:H]\nroot       7     0      0  09:02  ?           00:00:00\
  \  [kworker/0:u]\nroot       8     0      0  09:02  ?           00:00:01  [rcu_sched]\n\
  root       9     0      0  09:02  ?           00:00:00  [rcuos/0]\nroot      10\
  \     0      0  09:02  ?           00:00:00  [rcu_bh]\n...\n$\n```\n\n这种格式提供了关于运行中进程的一些有用信息：\n\
  \n*   **UID:** 运行该进程的用户\n*   **PID:** 进程的进程 ID\n*   **PPID:** 父进程的进程 ID（如果该进程是由另一个进程启动的）\n\
  *   **C:** 进程在生命周期内的处理器利用率\n*   **STIME:** 进程启动时的系统时间\n*   **TTY:** 启动进程的终端设备\n\
  *   **TIME:** 运行该进程所需的累计 CPU 时间\n*   **CMD:** 在进程中启动的程序名称\n\n\n\n\n\n同样注意在 `-ef`\
  \ 输出中，某些进程命令名称显示在括号中。默认情况下，`ps` 命令将显示启动程序时使用的完整命令行，包括任何命令行参数。如果它无法确定命令行参数，`ps` 会会在主程序周围加上括号。\n\
  \n另一个需要注意的进程特征是`process state`（进程状态）。进程状态表示在你检查的那一刻，程序正在的操作。有几种进程状态：\n\n* `运行 (Running\
  \ (R)):` 程序当前正在使用 CPU 处理代码。\n* `可中断睡眠 (Interruptible Sleep (S)):` 程序正在等待外部资源（如网络或磁盘），但可以被操作系统中断。\n\
  * `不可中断睡眠 (Uninterruptible Sleep (D)):` 程序正在等待外部资源，但不能被操作系统中断。\n* `停止 (Stopped (T)):`\
  \ 程序已终止。\n* `僵尸 (Zombie (Z)):` 程序已终止，但等待父程序将其从进程表中清除。这通常与孤儿进程混淆，孤儿进程是指父进程死亡但子进程仍在运行。\n\
  \n## 实时监控进程\n\n`ps` 命令是获取系统上运行进程快照的一种极佳方式，但有时你需要看到更多信息来了解你的 Linux 系统中到底发生了什么。如果你试图寻找频繁在内存中换入换出的进程趋势，使用\
  \ `ps` 命令很难做到。\n\n相反，`top` 命令可以解决这个问题。`top` 命令显示与 `ps` 命令相似的进程信息，但它是以实时模式运行的。图 21.1\
  \ 显示了 `top` 命令运行的快照。\n\n![终端输出截图显示系统资源使用情况，带有活动进程统计。](img/c21f001.png)\n\n图 21.1\
  \ `top` 命令的输出\n\n`top` 输出的第一部分显示了通用系统信息。第一行显示当前时间、系统运行时间、登录用户数以及系统的平均负载。\n\n平均负载显示为三个数字：1\
  \ 分钟、5 分钟和 15 分钟的平均负载。数值越高，系统承受的负载越重。1 分钟负载值在短时间内活动中出现高值并不常见。如果 15 分钟负载值很高，你的系统可能出问题了。\n\
  \n第二行显示了通用进程信息（在 `top` 中称为任务）：有多少进程正处于运行、睡眠、停止或僵尸状态。\n\n接的一行显示了通用 CPU 信息。顶部的显示将\
  \ CPU 利用率细分为几类，取决于进程的所有者（用户进程与系统进程）以及进程的状态（运行、空闲或等待）。表 21.1| `ni` | CPU 运行低优先级进程的时间\
  \ |\n| 空闲 | `id` | CPU 不忙的时间 |\n| 等待 | `wa` | CPU 等待磁盘或网络操作完成的时间（也称为 `iowait`） |\n\
  | 硬件中断 | `hi` | CPU 处理硬件中断的时间 |\n| 软件中断 | `si` | CPU 处理软件中断的时间 |\n\n表 21.1 top CPU\
  \ 类别\n\n其后，有两行详细说明了系统内存状态。第一行显示系统物理内存的状态，包括总内存量、当前使用量和剩余量。第二行内存显示了系统中交换内存区域（swap\
  \ memory area）的状态（如果安装了的话），具有相同的信息。\n\n最后，下一部分显示了当前运行进程的详细列表，其中一些信息列看起来对 `ps` 命令的输出应该很熟悉：\n\
  \n* `PID:` 进程 ID\n* `USER:` 进程所有者的用户名\n* `PR:` 进程的优先级\n* `NI:` 分配给进程的系统优先级值（称为 nice\
  \ 值）\n* `VIRT:` 进程使用的虚拟内存总量\n* `RES:` 进程正在使用的物理内存量\n* `SHR:` 进程与其他进程共享的内存量\n* `S:`\
  \ 进程状态（D = 可中断睡眠，R = 运行，S = 睡眠，T = 跟踪或已停止，以及 Z = 僵尸）\n* `%CPU:` 进程占用的 CPU 时间份额\n\
  * `%MEM:` 进程占用的可用物理内存份额\n* `TIME+:` 进程自启动以来使用的总 CPU 时间\n* `COMMAND:` 进程的命令行名称（启动的程序）\n\
  \n默认情况下，当你启动 `top` 时，它根据 `%CPU` 值对进程进行排序。你可以使用几种交互式命令之一更改排序顺序。每个交互式命令都是 `top` 运行时可以按的单个字符，并改变程序的行为。这些命令如表\
  \ 21.2。\n\n| 命令 | 描述 |\n| --- | --- |\n| `1` | 切换单 CPU 和对称多处理器 (SMP) 状态 |\n| `b`\
  \ | 切换表格中重要数字的加粗显示 |\n| `I` | 切换 Irix/Solaris 模式 |\n| `z` | 配置表格颜色 |\n| `l` | 切换平均负载信息行的显示\
  \ |\n| `t` | 切换 CPU 信息行的显示 |\n| `m` | 切换 MEM 和 SWAP 信息行的显示 |\n| `f` | 添加或删除不同的信息列\
  \ |\n| `o` | 更改信息列的显示顺序 |\n| `F` 或 `O` | 选择用于排序的字段（默认按 %CPU） |\n| `<` 或 `>` | 将排序字段向左(<)或向右(>)移动一列\
  \ |\n| `r` | 切换正常或反向排序 |\n| `h` | 切换显示线程 |\n| `c` | 切换显示进程的名称或完整命令行（包括参数） |\n| `i`\
  \ | 切换显示空闲进程 |\n| `S` | 切换显示累积 CPU 时间或相对 CPU 时间 |\n| `x` | 切换排序字段的高亮显示 |\n| `y`\
  \ | 切换运行任务的高亮显示\n| `z` | 切换颜色和单色模式 |\n| `u` | 显示特定用户的进程 |\n| `n` 或 `#` | 设置要显示的进程数\
  \ |\n| `k` | 杀死特定进程（仅限进程所有者或 root 用户） |\n| `r` | 更改特定进程的优先级 (renice)（仅限进程所有者或 root\
  \ 用户） |\n| `d` 或 `s` | 更改更新间隔（默认 3 秒） |\n| `W` | 将当前设置写入配置文件 |\n| `q` | 退出 `top`\
  \ 命令 |\n\n表 21.2 top 交互式命令\n\n你对 `top` 命令的输出有大量的控制权。使用 `F` 或 `O` 命令切换排序依据的字段。你还可以使用\
  \ `r` 交互式命令反转当前排序。使用这个工具，你通常可以找到接管你系统的故障进程。作为一个较新的工具，`htop` 程序是 `top` 工具的改进版本，在大多数\
  \ Linux 发行版中作为额外的软件包提供供你安装。图 21.2 显示了 `htop` 输出的一个示例。\n\n\n\n\n\n表 21.3 列出了其他一些用于进程的常用工具。并非所有工具在某些\
  \ Linux 发行版中都是默认安装的，但可以使用发行版的软件管理工具轻松安装（参见第 13 章”）。\n\n| 工具 | 描述 |\n| --- | ---\
  \ |\n| `atop` | 以图形化实时表格显示整体系统统计数据以及单个进程统计数据 |\n| `htop` |  `top`，但使用颜色编码使输出更易读，并带有功能键以便于过滤和排序输出\
  \ |\n| `lsof` | 显示与每个运行进程相关的打开文件 |\n| `mpstat` | 实时显示整体 CPU 和系统统计数据 |\n| `pidstat`\
  \ | 根据进程 ID (PID) 显示特定进程的统计数据 |\n| `pstree` | 显示父子进程之间关系的图形化图 |\n| `pstrace` | 显示子进程调用的系统调用\
  \ |\n| `strace` | 显示进程向内核进行的系统调用 |\n\n表 21.3 额外的进程监控工具\n\n## 管理进程\n\nLinux 系统管理员的工作之一是监控可能导致\
  \ Linux 系统崩溃的失控进程（runaway processes）。你已经了解了如何使用 `ps` 和 `top` 命令来监控进程在系统中的运行情况；下一步是查看如何停止失控进程。\n\
  \n### 设置优先级\n\n默认情况下，Linux 系统上运行的所有进程都是平等的等的；也就是说，它们获取 CPU 时间和内存资源的优先级是相同的。然而，你可能会运行某些应用程序，这些程序可能不需要相同级别的优先级，或者可能需要更高级别的优先级。\n\
  \n`nice` 和 `renice` 命令允许你设置和更改分配给应用程序进程的优先级级别。`nice` 命令允许你以非默认优先级设置启动应用程序。其格式如下：\n\
  \n```\nnice -n value command\n```\n\n`value` 参数是一个从 −20 到 19 的数值。数字越小，进程获得的优先级越高。默认优先级为零。`command`\
  \ 参数表示要在指定优先级启动的程序：\n\n```\n$ nice -n 10 ./myscript.sh\n$\n```\n\n要更改已运行进程的优先级，请使用\
  \ `renice` 命令：\n\n```\nrenice priority [-p pids] [-u users] [-g groups]\n```\n\n\
  `renice` 命令允许你根据 PID 值列表、一个或多个用户启动的所有进程，或一个或多个组启动的所有进程来更改多个运行进程的优先级。\n\n```\n$ renice\
  \ 15 -p 3178\n$\n```\n\n### 停止进程\n\n有时，进程会卡住，只需要轻轻推一下就能重新运行或停止。在其他情况下，进程会无占 CPU\
  \ 并拒绝放弃。在这两种情况下，你都需要一个允许控制进程的命令。为了实现这一点，Linux 遵循 Unix 的进程间通信方法。\n\n在 Linux 中，进程使用进程信号进行相互通信。进程信号是预定义的消息，进程可以识别并可能选择忽略或处理。开发者通过编程来决定进程如何处理信号。大多数编写良好的应用程序都有接收并处理标准\
  \ Unix 进程信号的能力。这些信号显示在表 21.4 中。\n\n| 编号 | 名称 | 描述 |\n| --- | --- | --- |\n| 1 |\
  \ `SIGHUP` | 挂断 |\n| 2 | `SIGINT` | 中断 |\n| 3 | `SIGQUIT` | 停止运行 |\n| 9 | `SIGKILL`\
  \ | 无条件终止 |\n| 11 | `SIGSEGV` | 段违规 |\n| 15 | `SIGTERM` | 尽可能终止 |\n| 17 | `SIGSTOP`\
  \ | 无条件停止但不终止 |\n| 18 | `SIGTSTP` | 停止或暂停，但在后台继续运行 |\n| 19 | `SIGCONT` | 在 `STOP`\
  \ 或 `TSTP` 后恢复执行 |\n\n表 21.4 Linux 进程信号\n\n虽然进程可以向另一个进程发送信号，但 Linux 中有两个命令允许你向运行中的进程发送进程信号。\n\
  \n#### kill 命令\n\n`kill` 命令允许你根据进程 ID (PID) 向进程发送信号。默认情况下，`kill` 命令向命令行列出的所有 PID\
  \ 发送 `SIGTERM` 信号。遗憾的是，你只能使用进程 PID 而不是命令名称，这使得 `kill` 命令有时难以使用。\n\n要发送进程信号，你必须是进程的所有者或以\
  \ root 用户身份登录：\n\n```\n$ kill 3940\n-bash: kill: (3940) - Operation not permitted\n\
  $\n```\n\n`SIGTERM` 信号只是请求进程进程停止运行。遗憾的是，如果你有一个失控进程，它很可能会忽略该请求。当你需要强制执行时，`-s` 参数允许你指定其他信号（使用名称或信号编号）。\n\
  \n通常接受的程序是首先尝试 `TERM` 信号。如果进程忽略了它，尝试 `SIGINT` 或 `SIGHUP` 信号。如果程序识别这些信号，它将尝试在关闭之前优雅地停止正在执行的操作。最强制的信号是\
  \ `SIGKILL` 信号。当进程接收此信号时，它会立即停止运行。将其作为最后手段，因为可能会导致文件损坏。\n\n`kill` 命令可怕之处之一是它没有任何输出：\n\
  \n```\n$ sudo kill -s SIGHUP 3940\n$\n```\n\n要查看命令是否有效，你必须执行另一个 `ps` 或 `top` 命令来查看故障进程是否停止。\n\
  \n#### pkill 命令\n\n`pkill` 命令是一种通过使用名称而非 PID 数字停止进程的强大方法。`pkill` 命令还允许你使用通配符字符，当系统出现问题时，这是一个非常有用的工具：\n\
  \n```\n$ sudo pkill http*\n$\n```\n\n此示例将 `kill` 所有以 `http` 开头的进程，例如 Apache Web\
  \ 服务器的 `httpd` 服务。\n\n练习 21.1 将带你演示一个使用 `pgrep` 命令查找运行中的程序并使用 `kill` 命令停止它的简单示例。\n\
  \n## 总结\n\n管理 Linux 系统上运行的应用程序是管理员的一项关键工作。Linux 系统为每个进程分配 CPU 时间内存，了解每个进程如何消耗这些资源是有帮助。你可以使用\
  \ `ps` 命令查看运行的应用程序以及它们消耗的资源。使用 `ps` 命令查看进程信息有多种方法。\n\n对应用程序进行实时监控，请使用 `top` 命令。通过\
  \ `top` 命令，你可以查看应用程序、其系统状态以及它们消耗资源的实时显示。`top` 命令允许你根据许多不同的特性（如 CPU 使用率或内存使用率）对显示进行排序。\n\
  \n要管理系统中运行的应用程序，可以使用 `nice` 和 `renice` 命令。`nice` 命令允许你以与已运行应用程序不同的优先级级别启动应用程序。通过\
  \ `renice` 命令，你可以更改已运行应用程序的优先级。\n\n\n\n\n\n如果某个应用程序出现问题并需要停止，你可以使用标准的 Linux `kill`\
  \ 命令，但你需要知道系统分配给该应用程序的进程 ID（PID）。`pkill` 命令专门为了通过名称而非进程 ID 停止应用程序而设计。你也可以使用通配符来停止多个应用程序，但这可能是危险的。要测试哪些应用程序会被停止，可以使用\
  \ `pgrep` 命令使用通配符搜索查找正在运行的应用程序。\n\n## 考试要点\n\n**解释如何查看 Linux 系统上运行的应用程序状态。** `ps`\
  \ 和 `top` 命令用于显示系统上运行的应用程序状态。这两个命令都会显示每个应用程序的状态，无论它是在运行中、睡眠中还是等待资源。\n\n**解释你将如何找到系统上哪些应用程序占用资源最多。**\
  \ `top` 命令允许你实时监控 Linux 系统上运行的应用程序。它显示了每个应用程序消耗的 CPU 和内存量，并允许你对显示的任何数据字段进行排序。这让你能够轻松地监控在任何时刻哪些应用程序正在使用最多的\
  \ CPU 时间或最多的内存。\n\n**描述你如何停止 Linux 系统上引起问题的应用程序。** Linux 应用程序设计为响应 Linux 信号。`kill`\
  \ 命令允许你向运行的应用程序发送 Linux 信号。如果你向应用程序发送 `KILL` 信号，它将在系统上停止运行。或者，你可以发送 `INT` 信号来中断应用程序，如果应用程序有响应，你就可以优雅地关闭它。`pkill`\
  \ 应用程序允许你根据进程名称向应用程序发送 Linux 信号，并允许你使用通配符指定进程名称。如果你需要停止从单个父应用程序派生的多个应用程序，这种组合会非常有用。\n\
  \n## 复习题\n\n你可以在附录 A 中找到复习题的答案。\n\n1. `ps` 命令提供的三种选项样式分别是什么？\n    1. BSD 样式\n  \
  \  2. Linux 样式\n    3. Unix 样式\n    4. GNU 样式\n    5. 数字样式 (Numeric)\n\n2. 如何识别\
  \ `ps` 命令的旧版 Unix 风格选项？\n    1. 在选项前使用双横杠 `--。\n    2. 在选项前使用单横杠 -。\n    3. 不在选项前加横杠。\n\
  \    4. Unix 风格选项是数字型的。\n    5. Unix 风格选项使用十六进制数字。\n\n3. 默认情况下，如果不指定任何命令行选项，`ps`\
  \ 命令显示什么？\n    1. 终端上运行的所有进程\n    2. 所有活动进程\n    3. 所有睡眠进程\n    4. 由当前 shell 运行的所有进程\n\
  \    5. 由当前用户运行的所有进程\n\n4. Charles 他的 Linux 系统运行缓慢，需要找出是哪个应用程序导致了问题。他应该使用什么工具来显示其系统上运行的所有进程的当前\
  \ CPU 占用率？\n    1. `top`\n    2. `ps`\n    3. `lsof`\n    4. `pkill`\n    5. `kill`\n\
  \n5. 哪个 `top` 命令显示累积 CPU 时间而非相对 CPU 时间？\n    1. `l`\n    2. `F`\n    3. `r`\n  \
  \  4. `y`\n    5. `S`\n\n6. Shelly 认为她 Linux 系统上的某个应用程序占用了过多的物理内存，可能存在问题。她应该关注 `top`\
  \ 显示中的哪一列数据？\n    1. `VIRT`\n    2. `RES`\n    3. `SHR`\n    4. `S`\n    5. `%MEM`\n\
  \n7. Jessica 有一个处理大量数字并消耗大量系统资源的应用程序。她想以较低的优先级运行该应用程序，以免干扰系统上的其他应用程序。她应该使用什么工具来启动该程序？\n\
  \    1. `renice`\n    2. `pkill`\n    3. `nice`\n    4. `kill`\n    5. `pgrep`\n\
  \n8. Jimmy 注意到他的 Linux 系统运行缓慢。他运行 `top` 命令发现一个数据密集型应用程序消耗了大部分 CPU 时间。他不想杀死该应用程序，但想给它一个较低的优先级，以免它占用过多的\
  \ CPU 时间。他应该使用什么工具来更改运行应用程序的优先级？\n    1. `renice`\n    2. `pkill`\n    3. `nice`\n\
  \    4. `kill`\n    5. `pgrep`\n\n9. Hank 需要停止他 Linux 系统上运行的一个应用程序。他知道应用程序的文件名，但不知道分配给它的进程\
  \ ID。他可以使用什么工具来停止该应用程序？\n    1. `renice`\n    2. `pkill`\n    3. `nice`\n    4.\
  \ `kill`\n    5. `pgrep`\n\n10. Frankie 使用 `ps` 命令找到了他需要停止的应用程序的进程 ID。他应该使用什么命令行工具根据其进程\
  \ ID 停止应用程序？\n    1. `renice`\n    2. `pkill`\n    3. `nice`\n    4. `kill`\n  \
  \  5. `pgrep`\n\n# 第 22 章：调查用户问题\n\n![](img/chaptersquare.png)\n\n一种旧的故障排除技术是将问题对半处理：如果原因不在前半部分，它就在后半部分。将后半部分再次对半并继续分析。在本章中，我将用户问题分为系统访问和文件困难。在引导你走向解决方案的过程中，我会进一步划分这些问题类别，并带你考虑各种各种事项。\n\
  \n## 访问故障排除\n\n如果用户在访问所需的应用程序时遇到困难，可能是多种认证问题引起的。让我们来看看本地和远程访问以及认证场景。\n\n## 本地\n\n\
  本地访问指的是那些直接连接到服务器接口的用户。这些用户通常是服务器管理员，但也可能是应用程序用户。通过收集一些基本信息开始故障排除：\n\n* 这是一个新创建的用户帐户吗？\n\
  * 输入该账户的用户名是什么？\n* 用户曾经登录过该账户吗？\n* 用户是正尝试通过 GUI 还是文本（虚拟）终端（例如 tty2）登录？\n\n#### 检查新创建的用户帐户\n\
  \n如果该账户是新创建的账户，请确认它已正确构建。新的系统管理员通常使用 `useradd` 命令创建账户（参见第 10 章，“管理用户和组](#c010.xhtml_a01)”），但往往忘记使用\
  \ `passwd` 工具为其添加密码。使用 `grep` 或 `getent` 命令检查 `/etc/passwd` 和 `/etc/shadow` 文件。列表\
  \ 22.1 显示了 Ubuntu Desktop 发行版上新用户 `JKirk` 的示例。\n\n注意，在 `JKirk` 影子记录的密码字段中，有一个感叹号（`!`）。这表示该账户未创建密码。\n\
  \n#### 检查账户访问\n\n查看账户上次成功访问的时间。`lastlog` 工具搜索 `/var/log/lastlog` 文件以查找登录过系统的用户，但它只维护最近的登录。`last`\
  \ 命令搜索 `/var/log/wtmp` 以查找登录/注出的用户，并保留最近登录及之后的记录。该文件通常会与较早的版本进行轮转，并赋予数字扩展名。因此，`wtmp`\
  \ 的下一个旧版本是 `wtmp.1`。`last` 命令的 `-f` 选项将帮助你搜索各种文件，如列表 22.2 所示。\n\n注意 `last` 命令显示\
  \ `JPicard` 帐户于 1 月 4 日登录 tty3 终端，并通过 `lastlog` 命令进行了确认。\n\n你也可以使用 `lastb` 命令。该命令允许你搜索失败的登录尝试，如列表\
  \ 22.3 所示。\n\n\n\n\n\n## 检查权限提升问题\n\n大多数 Linux 发行版都允许使用 `sudo` 命令，允许用户以 root 用户账户身份执行管理任务，这种方法被称为*权限提升*（privilege\
  \ elevation）。如果有一个用户账户不允许使用 `sudo` 命令，那么有几点你需要检查。\n\n首先，查看 `/etc/sudoers` 文件，查看哪些用户和组被允许提升权限。如果用户账户没有直接指定在\
  \ `/etc/sudoers`文件中，可能指定了一些组。这些组的条目看起来：\n\n```\n # admin 组的成员可以获得 root 权限\n%admin\
  \ ALL=(ALL) ALL\n\n# 允许 sudo 组的成员执行任何命令\n%sudo ALL=(ALL:ALL) ALL\n```\n\n在来自 Ubuntu\
  \ 系统的配置中，`admin` 组的用户允许使用 `sudo` 命令进行 root 权限提升，而 `sudo` 组的成员可以获得以任何用户身份执行任何命令的权限。\n\
  \n下一步是查看用户账户属于哪些组。简单的方法是使用 `id` 命令：\n\n```\n $ id rich\nuid=1000(rich) gid=1000(rich)\
  \ groups=1000(rich), 4(adm),24(cdrom),27(sudo),30(dip),46(plugdev),\n120(lpadmin),131(lxd),132(sambashare)\n\
  $\n```\n\n`id` 命令的输出显示了用户账户所属的所有组。在本例中，`rich` 用户确实属于 `sudo` 组，因此它应该拥有像系统上任何用户账户一样使用\
  \ `sudo` 命令提升权限的权限。\n\n## 检查 GUI 问题\n\n如果你发现账户过去成功登录系统且没有最近的失败尝试，请查找用户的本地访问方法。如果正在使用\
  \ GUI，让用户尝试登录文本终端，例如 `tty2` 终端。如果用户无法成功登录终端，那么说明还有其他问题。接下来的几个章节将提供帮助。\n\n如果用户可以成功登录文本终端但无法登录\
  \ GUI，你已经缩小了问题范围。确定正在运行哪些服务。对于较旧的 SysVinit 系统，`runlevel` 命令将显示图形环境当前是否处于状态（参见第 6\
  \ 章，“维护系统启动和服务](#c006.xhtml_c006)”）。对于 systemd 系统，使用列表 22.4 中摘录示例所示命令。\n\n`graphical.target`\
  \ 处于激活状态，这表明 GUI 服务可用。因此，提供 GUI 服务不是问题所在。从显示管理器开始调查其他潜在的 GUI 问题（参见第 8 章，“比较 GUI](#c008.xhtml_c008)”）。\n\
  \n## 检查终端问题\n\n如果用户通常登录文本终端但现在无法登录，让他们尝试登录不同的终端，可以是不同的虚拟终端或图形桌面。如果登录成功，请查看原始终端的设备文件以确定其是否损坏，请使用\
  \ `ls -l` 命令。列表 22.5 中显示了一个示例。\n\n注意每个终端设备文件记录开头的 `c`。这表示该设备文件是一个字符文件。如果你看到的是横杠（`-`），则该文件已损坏。使用超级用户权限和\
  \ `mknod` 命令重建它。\n\n如果用户尝试登录不同的文本终端但无法登录，请检查 `getty` 服务是否正在运行。这些服务为文本终端提供登录提示。在\
  \ systemd 系统上检查 `getty` 服务的示例在列表 22.6 中所示。\n\n`getty.target` 处于激活状态，因此 `getty` 服务可用。如果用户仍然无法登录系统，你将需要探索额外的问题。\n\
  \n## 检查其他本地问题\n\n确定账户是否被锁定。你可以使用 `passwd -S` 或 `getent` 命令检查此此，如列表 22.7 所示。\n\n\
  用户 `KJaneway` 账户名后的 `L` 表示该账户已锁定。然而，该代码也显示未设置密码的账户。因此，使用了 `getent` 命令。账户密码字段前的感叹号（`!`）证实了该账户确实已锁定。如果需要解锁账户，请使用超级用户权限和\
  \ `usermod -U` 或 `passwd -u` 命令。\n\n账户可能已过期。账户过期日期通常为临时账户用户设置，例如承包商或实习生。你可以使用 `chage`\
  \ 命令查看此信息，如列表 22.8 所示。\n\n注意此账户的过期日期已过。因此 `JArcher` 账户现在已过期，用户无法登录。如果这是一个错误或你需要修改它，请使用超级用户权限和\
  \ `chage -E` 命令为账户设置新的过期日期。\n\n确认用户是否使用了正确的密码，并检查账户密码是否过期。同样使用 `chage -l` 命令来查看此内容。\n\
  \n## 远程\n\n对于远程访问问题，首先检查系统是否可以通过网络访问（网络故障排除在第 20 章中介绍过）。如果系统可以访问，确定用户是如何尝试访问系统的。\n\
  \n如果用户正在使用 OpenSSH，首先确认系统上正在运行 OpenSSH 服务端，并且防火墙已正确配置以允许访问（防火墙在第 18 章，“监控 Linux\
  \ 防火墙](#c018.xhtml_c018)”中介绍过）。接下来检查 `sshd_config` 配置文件。`AllowUsers` 和 `AllowGroups`\
  \ 指令限制了访问。确保这些设置正确。此外，验证文件底部没有针对该特定用户的特定覆盖设置。务必检查客户端的任何配置文件，如 `~/.ssh/config` 和\
  \ `/etc/ssh/ssh_config`（OpenSSH 在第 16 章，“查看访问和身份验证方法](#c016.xhtml_c016)”中介绍过）。\n\
  \n确定通过 OpenSSH 进行认证是通过用户名和密码还是令牌。如果是用户名/密码，检查 `sshd_config` 指令 `PasswordAuthentication`\
  \ 是否设置为 `yes`。如果配置文件正常，下一节中的故障排除主题可能会有所帮助。\n\n如果 OpenSSH 认证是基于令牌的，确保私钥已从远程系统正确复制到服务器。同时，确认公钥存储在客户端的\
  \ `~/.ssh/authorized_keys` 文件中。\n\n如果用户正在使用远程桌面应用程序（例如 VNC、Xrdp、NX 或 SPICE），请检查它们的配置。关于这些主题的更多信息可以在第\
  \ 8 章中找到。\n\n## 认证\n\n分层认证软件可能是问题的核心。要检查的一个地方是 PAM（在第 16 章中介绍过）。查看 PAM 配置，例如 `/etc/pam.d/sshd`，确保指令设置正确。还使用\
  \ `pam_tally2` 或 `faillock` 实用程序检查用户账户是否因失败登录尝试过多而被锁定。\n\n你的系统是否使用了其他认证产品，例如 LDAP（在第\
  \ 16 章中介绍过）或 Kerberos（在第 19 章，“采用最佳安全实践](#c019.xhtml_c019)”中介绍过）？你需要检查它们的配置文件。还要查看它们的日志文件，以确保没有策略违规锁定用户账户。\n\
  \n\n\n\n\n不要忘记检查您的 Linux 内核安全模块，例如 `SELinux` 或 `AppArmor`（这些内容请参见第 15 章中的“应用所有权和权限”）。虽然这些模块目的是保护系统免受攻击者的侵害，但有时策略违规会导致合法用户被锁定。对于\
  \ `AppArmor`，策略违反记录存储在 `audit.log`（由 `auditd` 生成）或 `messages.log` 中，取决于其配置。如果使用\
  \ `auditd` 服务，可以使用 `ausearch` 命令在 `audit.log` 文件中搜索 AppArmor 策略违反记录。\n\n对于 `SELinux`，使用\
  \ `sealert` 命令检查审计日志文件，如列表 22.9 所示。注意，没有记录任何 `SELinux` 策略违反情况。\n\n对于身份验证问题，也请查看以下这些日志文件：\n\
  \n* `/var/log/auth.log`（基于 Debian 的发行版）\n* `/var/log/secure`（基于 Red Hat 的发行版）\n\n\
  这些日志文件通常包含身份验证失败等信息，并为您提供大量信息。如果需要，可以使用 `grep` 搜索特定的用户名。\n\n## 检查文件障碍\n\n在管理文件时可能会出现各种问题。了解典型问题将有助于您进行文件故障排除。\n\
  \n### 文件权限\n\n您正在使用 `vim` 编辑器编辑配置文件，但当尝试保存文件时，收到了“Can’t open file for writing”（无法打开文件写入）的错误信息。这令人沮丧。此类问题与文件权限直接相关。\n\
  \n遇到这些问题时，首先使用 `ls -l` 命令查看文件的权限设置和所有权（这些内容请参见第 15 章）。注意文件的所有者和组。然后确定所有者、组以及其他人（世界或其他或其他）的权限。示例请参见列表\
  \ 22.10。\n\n在这种情况下，文件归 `root` 所有，`root` 具有读取、写入和执行文件的权限。文件的组是 `wheel`。这些成员可以读取和执行该文件。最后，所有不是文件所有者或不在文件组中的其他人只能读取该文件。\n\
  \n如果在访问此文件时发生问题，请使用 `id` 命令确定用户名和组。将他们的身份与文件权限进行匹配以找到问题。示例请参见列表 22.11。\n\nChristine\
  \ 无法执行此文件，因为她不是文件的所有者，也不在该组中（参见列表 22.10）。第三组权限适用于她，且仅允许她读取文件。要让她运行该文件，请将其加入 `wheel`\
  \ 组，将其设置为文件的所有者，或修改文件的世界权限。\n\n### 目录权限\n\n虽然目录权限设置与文件权限非常相似，但其效果不同。表 22.1 显示了权限对操作的影响（这些内容请参见第\
  \ 15 章），以及该权限适用于谁（所有者、组或其他）。\n\n| 权限 | 效果 |\n| --- | --- |\n| `r` | 允许用户显示目录的文件\
  \ |\n| `w` | 允许用户在目录中创建、移动（重命名）、修改属性和删除文件 |\n| `x` | 允许用户将当前工作目录更改到此目录（通过 `cd` 命令），前提是所有父目录也设置了此权限\
  \ |\n\n表 22.1 目录权限效果\n\n几个示例将帮助您理解这些权限。例如，由于目录对其他人（世界）具有读取权限，用户 Christine 可以列出 `/etc`\
  \ 目录的内容，如列表 22.12 所示。\n\n下一个示例显示父目录（`/home`）允许用户使用 `cd` 将工作目录更改到那里。然而，子目录（`Samantha`）通过不授予执行（`x`）权限阻止了这一操作（参见列表\
  \ 22.13）。\n\n如果您有一个多个用户共享的目录，并且他们能够删除彼此的文件，但这不是您所需要的，请在目录上使用粘滞位（sticky bit）。此权限（这些内容请参见第\
  \ 15 章）将解决该问题。\n\n### 使用高级权限\n\n除了标准的 Linux 文件和目录权限外，您可能会遇到使用更高级 Linux 权限特性的系统。\n\
  \n访问控制列表（ACLs）允许您除标准的所有者、组和其他人之外，为多个用户或组指定权限。如果您的 Linux 系统使用 ACL，请始终检查 `getfacl`\
  \ 实用以查看应用于文件或目录的额外 ACL 权限：\n\n```\n $ getfacl test.txt\n# file: test.txt\n# owner:\
  \ rich\n# group: rich\nuser::rw-\ngroup::r--\ngroup:sales:rw-\nmask::rw-\nother::---\n\
  $\n```\n\n在此示例中，所有者使用 ACL 为文件分配了 `sales` 组读取权限。要更改 ACL 设置，请使用 `setfacl` 实用。\n\n\
  除了 ACL 权限外，Linux 系统可能使用基于上下文的权限，通过使用 SELinux（在 Red Hat 的 Linux 发行版中最常见）或 AppArmor（在\
  \ Debian 的 Linux 发行版中最常见）。\n\n要确定您的 Linux 系统是否启用了 SELinux，请使用 `sestatus` 命令：\n\n\
  ```\n $ sudo sestatus\nSELinux status:                 enabled\nSELinuxfs mount:\
  \               /sys/fs/selinux\nSELinux root directory:         /etc/selinux\n\
  Loaded policy name:             targeted\nCurrent mode:                   enforcing\n\
  Mode from config file:         enforcing\nPolicy MLS status:             enabled\n\
  Policy deny_unknown status:    allowed\nMemory protection checking    actual (secure)\n\
  Max kernel policy version:      331\n$\n```\n\n如果启用了 SELinux，使用 `ls` 命令的 `-Z` 命令行选项查看文件和目录的额外上下文权限：\n\
  \n```\n $ ls -Z test1.txt\nunconfined_u:object_r:user_home_t:s0 test1.txt\n$\n```\n\
  \n可以使用 `chcon` 命令更改文件的安全上下文：\n\n```\n chcon -u newuser -r newrole -t newtype filename\n\
  ```\n\nSELinux 使用策略控制访问。`getsebool` 命令允许您列出策略并确定它们是激活还是禁用，`setsebool` 命令用于激活或禁用它们。\n\
  \n要确定 AppArmor 是否激活，请使用 `aa-status` 实用程序：\n\n```\n $ sudo aa-status\napparmor module\
  \ is loaded.\n...\n$\n```\n\nAppArmor 使用配置文件设置权限。虽然此输出已截断，但在实际的 `aa-status` 输出中，您将看到关于加载的强制、投诉和禁用模式配置的信息。使用\
  \ `aa-enforce`、`aa-complain` 或 `aa-disable` 命令更改配置以满足您的需求。\n\n## 创建文件\n\n用户尝试创建文件被拒绝。首先检查目录权限。如果正常，请考虑以下项：\n\
  \n*   **该分区是否强制执行配额？** 用户可能达到了配额限制。检查分区的 `/etc/fstab` 记录是否存在 `usrquota` 或 `grpquota`\
  \ 以查看该文件系统是否启用了配额（这些内容请参见第 10 章），或使用 `repquota` 实用程序。如果启用了配额，通过 `quota` 命令检查用户的（或组的）配额使用情况。如果用户超过了配额限制且宽期已过，通过\
  \ `quotaoff` 关闭配额、扩展用户的配额，或让用户删除不需要的文件。\n*   **磁盘空间用尽了吗？** `df` 命令（这些内容请参见第 20 章）可以帮助您快速确定用户尝试创建文件的分区是否已用尽空间。如果空间不足，请采取相应行动（同样参见第\
  \ 20 章）。\n\n\n\n\n\n### 分区的 inode 耗尽了吗？\n*Inode 耗尽*是一个不寻常的情况，但确实会发生。inode 号（在第 3\
  \ 章“管理文件、目录和文本”中介绍）是文件相关的索引号。如果文件系统的 inode 耗尽，则无法在其上创建额外的文件。使用 `df -i` 命令检查每个文件系统的\
  \ inode 使用情况，以确认是否是该问题。\n\n如果 inode 耗尽，你无法在创建文件系统后扩展它们。相反，请寻找包含大量小型必要文件的目录（例如临时目录），并删除可以删除的内容。一种良好的做法是将创建许多小文件的应用程序放在它们独立的大分区上，并格式化为提供更高数量的\
  \ inode 号。在创建文件系统时，使用如 `mke2fs -i` 等工具选项将 inode 计数增加到默认值以上。\n\n### 用户的 `umask` 设置是什么？\n\
  `umask` 设置（在第 15 章中介绍）会从默认的文件和目录权限设置中减去权限。因此，当用户创建文件和或目录时，设置的权限会受到此设置的影响。让用户在命令行输入\
  \ `umask`（或检查用户的环境文件）来确定其设置。如果设置得太高（例如删除了创建的子目录所需的写权限），你就找到了问题所在。\n\n与访问权限问题一样，在用户无法创建或删除文件的情况下，检查你的\
  \ Linux 内核安全模块（SELinux 或 AppArmor）。使用相应的工具查看相应的策略违规日志文件（`/var/log/messages` 或 `/var/log/audit/audit.log`）。\n\
  \n在找到有关问题文件或目录的策略违规后，确定该文件/目录是否标记错误、策略是否正确，或者使用了错误的安全上下文。采取适当措施补救局面。\n\n## 探索环境和\
  \ Shell 问题\n在处理用户问题时，一个潜在问题是用户账户的默认 shell。使用 `getent` 命令进行检查，如 Ubuntu 发行版中的列表 22.14\
  \ 所示。\n\n注意，默认 shell 使用不是 `/bin/bash` 而是 `/bin/sh`。在该系统中，`/bin/sh` 文件链接到 `/bin/dash`\
  \ shell。如果这不符合要求，可以通过 `usermod` 命令更改用户的默认 shell（见第 10 章）。\n\n错误或设置不当的环境变量会导致各种用户困难。检查用户的环境文件（在第\
  \ 10 章中介绍），例如 `~/.profile` 文件。同时，使用 `set`、`env` 或 `printenv` 命令检查系统的全局环境变量设置。\n\n\
  确保环境变量已导出（exported），以便它们在子 shell 中可用（当执行 shell 脚本时可能会出现子 shell）。该问题的一个示例在列表 22.15\
  \ 中所示。\n\n用户设置了环境变量 `EDITOR`，因此他们的默认文本编辑器现在是 `nano`。然而，当通过 `bash` 命令创建新的子 shell\
  \ 时，该设置丢失了。为了保持设置的持久性，它需要被导出并存储在用户的环境文件中。导出变量的示例在列表 22.16 所示。\n\n确保在正确的文件（全局或每个用户）中有环境变量也很重要。此外，你必须理解用户进行什么类型的登录，以便在正确的文件中设置这些变量（见第\
  \ 10 章）。\n\n## 总结\n用户问题故障排除是复杂的。访问、身份验证、文件管理以及用户的 shell 和环境都涉及许多组件。理解常见问题有助于解决问题。\n\
  \n## 考试要点\n**总结用户访问问题/解决方案。** 对于本地访问受阻，研究损坏的终端文件、配置不当的 GUI 组件以及过期的密码/账户。远程访问问题通常由配置不当的\
  \ OpenSSH 组件或远程桌面应用引起。其他问题可能涉及分层认证软件如 PAM 或系统的内核安全模块如 SELinux 或 AppArmor。\n\n**描述各种文件问题/解决方案。**\
  \ 文件访问和管理需要对基本文件和目录权限以及所有权和组组成有了解。需要检查的其他系统项目包括文件系统配额、磁盘空间、inode 使用情况和 `umask` 设置。还要检查内核安全模块日志文件中的策略违规。如果用户无法删除文件，检查文件上是否设置了不可变位（immutable\
  \ bit）。\n\n**解释用户环境和 shell 问题。** 配置不当的环境变量或未导出的环境变量会导致用户问题。检查全局和用户的各种环境文件以查找问题。\n\
  \n## 复习题\n你可以在附录 A 中找到复习题的答案。\n\n1. 承包商商 Lamar 声称他无法本地登录账户。他昨天还能登录。似乎没有其他人在访问系统时遇到问题。你应该首先检查什么？\n\
  \    1. 使用 `systemctl` 命令检查 GUI 服务是否正在运行。\n    2. 查看 OpenSSH 服务器配置文件。\n    3. 使用\
  \ `chage` 命令确定他的账户是否过期。\n    4. 使用 `faillock` 工具查看账户是否被锁定。\n    5. 检查 SELinux 日志文件中的策略违规。\n\
  \n2. Irene 通常使用 tty4 终端本地登录系统，但今天不行。她尝试在 tty3 终端处进行身份验证并成功登录。你应该首先检查什么？\n    1.\
  \ 使用 `systemctl` 命令确定 `getty` 服务是否正在运行。\n    2. 查看 `/etc/security/access.conf` 文件中的访问规则。\n\
  \    3. 使用 `passwd -S` 命令查看账户是否被锁定。\n    4. 使用 `last` 命令查看她上次登录的时间。\n    5. 使用 `ls\
  \ -l` 命令检查 tty4 设备文件是否损坏。\n\n3. Vincent 尝试使用 OpenSSH 远程登录系统未成功。他问你可以做什么来帮助排除此问题。你应该首先建议什么？\n\
  \    1. 检查 `/etc/ssh/sshd_config` 配置文件。\n    2. 为 Vincent 的 `ssh` 命令添加 `-vvv` 选项。\n\
  \    3. 为 Vincent 的 `ssh` 命令添加 `-X` 选项。\n    4. 确认 Vincent 的公钥存储在 `~/.ssh/authorized_keys`\
  \ 文件。\n    5. 检查 `~/.ssh/config` 配置文件。\n\n4. Anton 正在确定确定特定用户无法登录 Rocky Linux 系统，该系统禁用了\
  \ SELinux 且没有使用 `auditd`。以下哪些最佳的日志文件？（选择两项。）\n    1. `/var/log/audit/audit.log`\n\
  \    2. `/var/log/messages`\n    3. `/var/log/auth`\n    4. `/var/log/secure`\n\
  \    5. `/var/log/lastlog`\n\n5. Tarissa 需要运行一个 shell 脚本，该脚本权限为 `rwxr--r--`，属于 `root`\
  \ 并属于 `wheel` 组。Tarissa 的用户账户是 `T2T1000`，她是 `admin` 组的成员。可以做什么让她能够运行此脚本？（选择所有适用。）\n\
  \    1. 将 Tarissa 加入 `wheel` 组。\n    2. 为 Tarissa 创建一个名为 `wheel` 的新账户。\n    3. 为脚本文件的组权限添加\
  \ `w`。\n    4. 为脚本文件的组权限添加 `x`。\n    5. 什么都不用做。Tarissa 现在就可以运行脚本了。\n\n\n\n\n\n6.\
  \ Miles 需要将他的当前工作目录更改为 `/home/miles` 目录。他不拥有该目录，也不是该组的成员。在假设父目录权限已设置的情况下，需要进行什么操作才能成功？\n\
  \n1. 无需操作。`/home/miles` 目录是 Miles 的家目录，因此他默认可以访问它。\n2. 需要添加执行（`x`）权限。\n3. 需要添加写入（`w`）权限。\n\
  4. 需要添加读取（`r`）权限。\n5. 需要添加连字符（`-`）权限。\n\n7. 系统管理员 Sarah 尝试创建一个文件，但收到了一个错误消息，显示无法创建文件。以下哪些项可能是问题所在？（选择所有适用项。）\n\
  \n1. 她尝试创建文件的文件系统设置了配额（quota），且她已经超过了配额和宽限期。\n2. 她尝试创建文件的文件系统空间已耗尽。\n3. 她正尝试创建的文件设置了不可变位（immutable\
  \ bit），因此无法创建。\n4. 该操作触发了 SELinux 或 AppArmor 策略违反。\n5. 文件系统正经历 inode 节点耗尽，因此无法容纳任何新文件。\n\
  \n8. 一个用户无法删除她的一个文件，但能够删除其目录中的其他文件。系统管理员 John 正在尝试排除此问题。他应该首先对该文件使用哪种命令？\n\n1. `chown`\n\
  2. `chattr`\n3. `chmod`\n4. `umask`\n5. `lsattr`\n\n9. Melissa 想要将默认编辑器设置为 `vim`\
  \ 编辑器，并希望在进入子壳（subshell）时该设置依然有效。她应该做什么？\n\n1. 在 `/etc/profile` 文件中放入 `EDITOR=‘vim’`。\n\
  2. 在 `/etc/profile` 文件中放入 `export EDITOR=‘vim’`。\n3. 在她的 `~/.profile` 文件中放入 `EDITOR=‘vim’`。\n\
  4. 在她的 `~/.profile` 文件中放入 `export EDITOR=‘vim’`。\n5. 在她的 `~/. bash.bashrc` 文件中放入\
  \ `export EDITOR=‘vim’`。\n\n10. 系统管理员 Mark Watney 的账户 `MW2015` 被一个新的系统管理员实习生修改了。当\
  \ Mark 登录系统并尝试使用大括号对一组命令进行分组时，它不再起作用。其他人都没有遇到这个问题。他怀疑自己账户的默认 shell 已从 `/bin/bash`\
  \ 更改为 `/bin/tcsh`。以下哪些项有助于判断他的怀疑是否正确？（选择所有适用项。）\n\n1. `cat /etc/profile`\n2. `echo\
  \ $SHELL`\n3. `sudo grep tcsh$ /etc/passwd`\n4. `sudo getent shadow MW2015`\n5.\
  \ `sudo getent passwd MW2015`\n\n# 第 23 章：处理 Linux 设备\n\n![](img/chaptersquare.png)\n\
  \n典型的 Linux 系统连接了许多不同的硬件设备。列表可以包括硬盘、显示器、键盘、打印机、声卡和网卡。作为 Linux 管理员，你的工作职责之一就是确保所有这些设备都能正常且良好运行。本章将引导你安装和排除连接到你\
  \ Linux 系统的不同类型硬件设备的故障。首先，本章将讨论你在 Linux 系统上可能需要使用的不同类型的设备接口以及它们如何与操作系统通信。随后，本章将讨论可用于监控和排除系统设备工作故障的\
  \ Linux 实用程序。最后，本章将深入探讨热插拔设备，随着 USB 设备的普及，这一主题已变得极其重要。\n\n## 与 Linux 设备通信\n\n为了让任何设备在你的\
  \ Linux 系统上工作，Linux 内核必须识别它并知道如何与其通信。内核使用已安装的模块（参见第 14 章，“内核模块](#c014.xhtml_c014)”）来了解如何与系统上的每种硬件设备通信。如果特定硬件设备的模块未加载，内核将无法与该设备通信。\n\
  \n在安装内核模块后，内核必须知道如何与设备通信。Linux 支持多种类型的硬件接口和设备通信方法。\n\n### 设备接口\n\n你连接到 Linux 系统的每个设备都使用某种类型的标准协议与系统硬件通信。内核模块软件必须知道如何使用这些协议向硬件设备发送数据并从其接收数据。目前有三种用于连接设备的流行标准。\n\
  \n#### PCI 板\n\n*外围组件互连*（PCI）标准开发于 1993 年，作为将硬件板连接到 PC 主板的方法。该标准已经更新了多次，以适应更快的接口速度并增加主板上的数据总线尺寸。*PCI\
  \ Express (PCIe)* 标准目前用于大多数服务器和桌面工作站，为外部硬件卡提供通用接口。\n\n许多不同的客户端设备使用 PCI 板连接到服务器或桌面工作站：\n\
  \n*   **内部硬盘：** 使用*串行高级技术接口（SATA）*和*小型计算机系统接口（SCSI）*连接器的硬盘通常使用 PCI 板连接到工作站或服务器。Linux\
  \ 内核会自动识别连接到 PCI 板的 SATA 和 SCSI 硬盘。\n*   **外部硬盘：** 使用光纤（Fiber Channel）标准的网络硬盘为服务器环境提供了高速共享驱动器环境。为了在光纤网络上通信，服务器通常使用支持*主机总线适配器（HBA）*标准的\
  \ PCI 板。\n*   **网络接口卡：** 硬网卡允许你使用通用的 RJ-45 电缆标准将工作站或服务器连接到局域网。这类连接大多出现在需要高网络吞吐量的高速网络环境中。\n\
  *   **无线卡：** 有提供支持 IEEE 802.11 标准的局域网无线连接的 PCI 板。虽然这些在服务器环境中并不常见，但在工作站环境中非常流行。\n\
  *   **蓝牙设备：** 蓝牙技术允许在点对点的网络设置中与其他蓝牙设备进行短距离无线通信。这些设备在工作站环境中最为常见。\n*   **视频加速器：**\
  \ 需要高级图形的应用程序通常使用视频加速卡，它将视频处理需求从 CPU 卸载以提供更快的图形。虽然它们在游戏环境中很流行，你也会发现视频加速卡用于编辑和处理电影的视频应用，以及需要高级数学运算的应用（例如区块链生成）。\n\
  *   **声卡：** 同样，需要高质量音频的应用程序通常使用专用声卡来提供高级音频处理和播放，例如处理杜比环绕声以增强电影的音质。\n\n#### USB 接口\n\
  \n*通用串行总线（USB）*接口因其易用性和对高速数据通信日益的支持变得越来越流行。由于 USB 接口使用串行通信，它对主板的连接器更少，允许使用更小的接口插头。\n\
  \nUSB 标准多年一直在演变。原始版本 1.0 只支持高达 12 Mbps 的数据传输速度。2.0 标准将数据传输速度提高到 480 Mbps。目前的 USB\
  \ 标准 4.0 允许高达 40 Gbps 的数据传输速度，使其对于高速连接外部存储设备非常有用。\n\n\n\n\n\n有许多设备可以通过 USB 接口连接到系统。你可以找到硬盘、打印机、数码相机和摄像机、键盘、鼠标以及网卡，它们都有通过\
  \ USB 接口连接的版本。\n\n## GPIO 接口\n\n`通用输入/输出 (GPIO)` 接口在设计用于控制外部设备自动化项目的小型实用 Linux 系统中变得非常流行。这包括受欢迎的爱好者\
  \ Linux 系统，如树莓派（Raspberry Pi）和 BeagleBone 开发包。\n\nGPIO 接口提供了多个数字输入和输出线，你可以对它们进行单独控制，精细到单比特位。GPIO\
  \ 功能通常由特殊的集成电路（IC）芯片处理，该芯片映射到 Linux 系统的内存中。\n\nGPIO 接口非常适用于与继电器、灯光、传感器和电机等外部设备进行通信。应用程序可以读取单个\
  \ GPIO 行来确定开关状态、开启或关闭继电器，或者读取任何类型的模拟数字传感器（如温度或压力传感器）返回的数字值。\n\n通过 GPIO 接口，你利用 Linux\
  \ 控制物体和环境拥有了丰富的可能性。你可以编写程序来控制房间温度、感知门窗的开启或关闭、感知房间内的运动，甚至控制机器人的运行。\n\n## /dev 目录\n\
  \n在 Linux 内核能够与接口上的设备通信后，它必须能够与设备之间传输数据。对于许多设备，这是通过`设备文件`完成的。设备文件是 Linux 内核在特殊的\
  \ `/dev` 目录中创建的文件，用于与硬件设备建立接口。\n\n要从特定设备检索数据，程序只需要读取与该设备关联 Linux 设备文件。Linux 操作系统处理了与实际硬件交互的所有繁杂工作。同样，要向设备发送数据，程序只需要向\
  \ Linux 设备文件写入即可。\n\n当你向系统添加 USB 驱动器、网卡或硬盘等硬件设备时，Linux 会 `/dev` 目录中创建一个代表该硬件设备的文件。应用程序随后可以直接与该文件交互，在设备上存储和检索数据。这比要求每个应用程序都知道如何直接与设备交互要简单得多。\n\
  \nLinux 中有两种类型的设备文件，基于 Linux 向设备传输数据的方式：\n\n*   **字符设备文件：** 一次传输一个字符数据。这种方法通常用于终端设备和\
  \ USB 设备等串行设备。\n*   **块设备文件：** 传输大块数据。这种方法通常用于硬盘和网卡等高速数据传输设备。\n\n设备文件的类型由权限列表中的第一个字母表示，如列表\
  \ 23.1 所示。\n\n硬盘设备 `sda` 和 `sda1` 显示字母 `b`，表示它们是块设备文件。`tty` 终端文件显示字母 `c`，表示它们是字符设备文件。\n\
  \n还有几个特殊的字符设备文件，为 shell 提供了有用的功能。值得注意的是：\n\n*   `/dev/null`：** 当数据被重定向到此设备时，数据会被丢弃。这对于重定向你不想显示的程序消息非常有用。\n\
  *   `/dev/random` 和 `/dev/urandom`：** 这些设备文件提供了对内核随机数生成器的访问。`/dev/random` 设备会阻塞请求，直到生成了足够的随机数据以计算真随机数。`/dev/urandom`\
  \ 设备不会阻塞，而是使用当前可用的随机数据返回一个随机数。虽然准确性较低，但对于大多数随机数用途通常足够了。\n*   `/dev/zero`：** 当从此设备读取数据时，它会返回一个空字符（0×00）。这是创建空文件或擦除磁盘分区上之前存储数据的极佳资源。\n\
  \n除了设备文件，Linux 还提供了一个名为 `device mapper` 的系统。device mapper 功能由 Linux 内核执行。它将物理块设备映射到虚拟块设备。这些虚拟块设备允许系统拦截写入或从物理设备读取的数据，并对其进行某种类型的操作。映射的设备被逻辑卷管理器（LVM）用于创建逻辑驱动，并被\
  \ Linux 统一密钥设置（LUKS）用于加密硬盘数据。\n\n## /proc 目录\n\n`/proc` 目录是你在 Linux 系统上排查硬件问题时可以使用最重要的工具之一。它不是文件系统上的物理目录，而是一个由内核动态填充的虚拟目录，提供对系统硬件设置和状态信息的访问。\n\
  \nLinux 内核在监控系统硬件状态时会更改 `/proc` 目录中的文件和数据。要查看硬件设备和设置的状态，你只需要使用标准的 Linux 文本命令读取虚拟文件的内容。\n\
  \n不同的系统功能对应不同的 `/proc` 文件，包括硬件设备正在使用的 IRQ、I/O 端口和 DMA 通道。以下章节将讨论用于监控这些特的文件以及你如何访问它们。\n\
  \n### 中断请求\n\n中断请求（IRQs）允许硬件设备指示它们何时有数据发送给 CPU。PnP 系统必须为安装在系统上的每个硬件设备分配一个唯一的 IRQ\
  \ 地址。你可以通过使用 Linux `cat` 命令查看 `/proc/interrupts` 文件来查看 Linux 系统当前正在使用的 IRQ，如列表 23.2\
  \ 所示。\n\n在列表 23.2 中，第一列表示分配给设备的 IRQ。某些 IRQ 由系统为特定硬件设备预留，例如 0 用于系统定时器，1 用于系统键盘。其他\
  \ IRQ 由系统在启动时检测到设备时分配。\n\n### I/O 端口\n\n系统 I/O 端口是内存中的位置，CPU 可以从中向硬件设备发送数据并从那里接收数据。与\
  \ IRQ 类似，系统必须为每个设备分配唯一的 I/O 端口。这是另一个由 PnP 系统处理的功能。\n\n你可以通过查看 `/proc/ioports` 文件来监控分配给系统硬件设备的\
  \ I/O 端口，如列表 23.3 所示。\n\nLinux 系统在任何时候都有许多不同的 I/O 端口在使用，因此你的输出可能与此示例不同。有了 PnP，I/O\
  \ 端口冲突并不常见，但可能有两个设备被分配到相同的 I/O 端口。在这种情况下，你可以使用 `setpci` 命令手动覆盖自动分配的设置。\n\n### 直接内存访问\n\
  \n使用 I/O 端口向 CPU 发送数据可能较慢。为了提高速度，许多设备使用直接内存访问（DMA）通道。DMA 通道的作用正如其名：它们将数据从硬件设备直接发送到系统的内存，而无需等待\
  \ CPU。CPU 可以在数据准备绪读取这些内存位置来访问数据。\n\n与 I/O 端口一样，每个使用 DMA 的硬件设备必须分配一个唯一的通道号。要查看系统当前使用的\
  \ DMA 通道，只需显示 `/proc/dma` 文件即可：\n\n```\n$ cat /proc/dma\n4: cascade\n$\n```\n\n\
  此输出表示 Linux 系统仅使用了 DMA 通道 4。\n\n## /sys 目录\n\n另一个用于处理设备的工具是 `/sys` 目录。`/sys` 目录是另一个虚拟目录，类似于\
  \ `/proc` 目录。它提供了系统上任何用户都可以访问的关于硬件设备的附加信息。\n\n\n\n\n\n在 `/sys` 目录下有许多信息文件。它们根据系统中的设备和功能划分为子目录。你可以使用\
  \ `ls` 命令行工具查看你的系统中 `/sys` 目录下可用的子目录和文件，如列表 23.4 所示。\n\n注意可用的不同信息类别。你可以获取有关系统总线、设备、内核甚至已安装内核模块的信息。\n\
  \n## 与设备交互\n\nLinux 提供了丰富的命令行工具，用于使用连接到系统的设备，以及在出现问题时对设备进行监控和故障排除。本节将带你了解一些在处理 Linux\
  \ 设备时需要知道的常用工具。\n\n### 查找设备\n\n新任 Linux 管理员的首要任务之一是查找 Linux 系统上安装的各种设备。幸运的是，有几个命令行工具可以提供帮助。\n\
  \n### `lsdev` 命令\n\n`lsdev` 命令行工具显示 Linux 系统上安装的硬件设备信息。它从 `/proc/interrupts`、`/proc/ioports`\
  \ 和 `/proc/dma` 虚拟文件中检索信息，并将它们合并到一个输出中，如列表 23.5 所示。\n\n这为你提供了一个查看系统中运行的所有设备所有重要信息的地方，使其更容易识别出可能导致问题的冲突。\n\
  \n### `lsblk` 命令\n\n`lsblk` 命令行工具显示 Linux 系统上安装的块设备信息。默认情况下，`lsblk` 命令显示所有块设备，如列表\
  \ 23.6 所示。\n\n如果你注意到在列表 23.6 的末尾，`lsblk` 命令还会指示相关的块，例如设备映射的 LVM 卷和关联的物理硬盘。你可以通过添加命令行选项来修改\
  \ `lsblk` 输出，以查看有关块的额外信息。`-S` 选项仅显示系统中 SCSI 块设备的信息：\n\n```\n $ lsblk -S\nNAME  HCTL\
  \      TYPE  VENDOR     MODEL               REV  TRAN\nsda  2:0:0:0   disk  ATA\
  \      VBOX  HARDDISK     1.0  sata\nsr0  1:0:0:0   rom  VBOX     CD-ROM       \
  \        1.0  ata\n```\n\n这是查看系统中安装的不同 SCSI 驱动器的快速方法。\n\n### `dmesg` 命令\n\n内核环形缓冲区在事件发生时记录内核级事件。由于它是环形缓冲区，当缓冲区区域填满后，事件消息会被覆盖。你可以使用\
  \ `dmesg` 命令查看内核环形缓冲区中的当前消息。每当你安装新设备时，监控它很有帮助，如列表 23.7 所示。\n\n`dmesg` 命令的输出显示了内核识别插入系统的新\
  \ USB 设备时所采取的步骤。\n\n由于内核负责检测设备和安装正确的模块，因此当设备工作不正常时，`dmesg` 命令是一个极好的故障排除工具。它可以帮助你判断硬件设备模块是否加载正确。\n\
  \n### 与 PCI 设备交互\n\n`lspci` 命令允许你查看 Linux 系统上当前安装并识别的 PCI 和 PCIe 设备。你可以在 `lspci`\
  \ 命令中包含许多命令行选项，以显示有关系统中安装的 PCI 和 PCIe 卡的信息。表 23.1 显示了一些实用的选项。\n\n| 选项 | 说明 |\n|\
  \ --- | --- |\n| `-A` | 定义访问 PCI 信息的方法 |\n| `-b` | 从显卡角度显示连接信息 |\n| `-k` | 显示每个已安装\
  \ PCI 卡的内核驱动模块 |\n| `-m` | 以机器可读格式显示信息 |\n| `-n` | 以数字而非文本显示供应商和设备信息 |\n| `-q` |\
  \ 查询中央 PCI 数据库以获取已安装 PCI 卡的信息 |\n| `-t` | 显示显示卡与总线之间连接的树状图 |\n| `-v` | 显示有关显卡的额外信息（详细模式）\
  \ |\n| `-x` | 显示卡信息的十六进制输出转储 |\n\n表 23.1 `lspci` 命令行选项\n\n在不带任何选项的情况下`lspci` 命令的输出显示所有连接到系统的设备，如列表\
  \ 23.8 所示。\n\n你可以使用 `lspci` 命令的输出来排查 PCI 卡问题，例如显卡未被 Linux 系统识别。\n\n### 与 USB 设备交互\n\
  \n你可以使用 `lsusb` 命令查看连接到你的 Linux 系统的 USB 设备的基本信息。表 23.2 显示了该命令可用的选项。\n\n| 选项 | 说明\
  \ |\n| --- | --- |\n| `-d` | 仅显示来自供应商 ID 的设备 |\n| `-D` | 仅显示具有指定设备文件的信息 |\n| `-s`\
  \ | 仅显示使用指定总线的设备信息 |\n| `-t` | 以树格式显示信息，显示相关设备 |\n| `-v` | 显示有关设备的额外信息（详细模式） |\n\
  | `-V` | 显示 `lsusb` 程序的版本 |\n\n表 23.2 `lsusb` 命令选项\n\n基础的 `lsusb` 程序输出如列表 23.9 所示。\n\
  \n大多数系统都集成了一个标准的 USB 集线器，用于将多个设备连接到 USB 控制器。幸运的是，市场上只有少数 USB 集线器，因此所有 Linux 发行版都包含了与每个集线器通信所需的设备驱动。这确保了你的\
  \ Linux 系统至少能检测到 USB 设备的连接。\n\n### 支持显示器\n\n有两个控制你 Linux 系统视频环境的基础级元素：显卡和显示器。为了显示任何类型的文本或图形，你的\
  \ Linux 系统必须知道如何与它们进行交互。这就是 `X Window System` 软件的用场。\n\n`X Window System` 开发于马萨诸理工学院（MIT），旨在提供与显示器交互的标准协议。X\
  \ Window System 通常简称为 `X` 或 `X11`，因为最后一个定义版本是 11。\n\n`X11` 系统运行于你 Linux 系统图形桌面环境之下，如图\
  \ 23.1 所示。\n\n![流程图显示了顶部的图形应用程序，连接到图形桌面管理器和 X Window 系统，后者连接到 4 个硬件设备。](img/c23f001.png)\n\
  \n图 23.1 标准 Linux 图形环境\n\n`X11` 的工作是与系统视频环境的硬件层——显卡、显示器、键盘和鼠标进行交互，并提供任何桌面管理软件（如\
  \ KDE 或 GNOME）都可以使用的标准接口。正如此，`X11` 软件必须能够所有这些硬件设备交互。\n\nLinux 的原始 X11 软件是 `XFree86`\
  \ 软件包。它以难以配置以及难以与不同类型的视频硬件配合工作而闻名。因此，新的 X11 包出现了并变得更加常见：\n\n*   **X.org:** 一个适用于\
  \ Linux 的用户友好 X11 软件包，作为 `XFree86` 的直接替代品开发，但使用简单的基于文本的配置文件。它将配置文件存储在通用的 `/etc/X11`\
  \ 目录中。\n\n\n\n\n\n- **Wayland**: 一个更简单、更安全的图形软件软件包，由 Red Hat 开发并作为开源软件发布。Wayland\
  \ 在 Linux 发行版中变得越来越流行，迅速取代了 X.org。它在每个用户 `Home` 目录下的 `~/.config/weston.ini` 文件中为每个用户存储独立的配置文件。\n\
  \nX.org 和 Wayland 系统都会尝试在每次启动时自动检测系统中安装的显卡、显示器、键盘和鼠标，并相应地动态配置文件。如果你对显卡或显示器进行任何更改，它们会自动检测新设备并相应更改配置，使得更换新视频设备变得轻而易举。\n\
  \n## 使用打印机\n\n与 Linux 中的图形环境一样，在 Linux 中打印可能有些复杂。由于有多种打印机，尝试安装正确的打印机驱动程序以及使用正确的打印协议与它们通信可能是一场噩梦。\n\
  \n幸运的是，`Common Unix Printing System (CUPS)` 为我们解决了许多此类问题。CUPS 为与 Linux 系统上的任何类型的打印机工作提供了一个通用接口。它接受\
  \ PostScript 文档格式的打印作业，并使用 `print queue` 系统将它们发送到打印机。\n\n打印队列是发送待打印文件的存放区域。打印队列通常配置为不仅支持特定的打印机，还支持特定的打印格式，例如横向或纵向模式、单面或双面打印，甚至是彩色或黑白打印。单台打印机可以分配多个打印队列，或者多个打印机可以接受分配给单个打印队列的作业。\n\
  \nCUPS 软件使用 `Ghostscript` 程序将 PostScript 文档转换为不同打印机可以理解的格式。Ghostscript 程序需要针对不同打印机类型使用不同的驱动程序，以知道如何转换文档以便在特定类型的打印机上打印。这是通过配置文件和驱动程序实现的。幸运的是，CUPS\
  \ 为市场上常见的打印机安装了许多不同的驱动程序，并自动设置了使用这些程序的配置。配置文件存储在 `/etc/cups` 目录。\n\n要在你的 Linux 系统上定义新打印机，你可以使用\
  \ CUPS Web 界面。打开浏览器并导航到 URL `http://localhost:631`。图 23.2 显示了 Rocky 9.4 Linux 系统上\
  \ CUPS 使用的 Web 界面。\n\n![Screenshot of C U P S 2.3.3 o p 2 detailing user guides,\
  \ administration, and developer resources for the C U P S printing system.](img/c23f002.png)\n\
  \n图 23.2 CUPS 主网页\n\nCUPS Web 界面允许你定义新打印机、修改现有打印机并检查发送到每个打印机的打印作业状态。CUPS 不仅能识别直接连接的打印机，还可以使用几种标准网络打印协议配置网络打印机，例如互联网打印协议\
  \ (IPP) 或微软服务器消息块 (SMB) 协议。\n\n除了 CUPS Web 界面，你还可以使用命令行工具与打印队列交互：\n\n- `lpc`: 启动、停止或暂停打印队列。\n\
  - `lpq`: 显示打印队列状态以及队列中等待的打印作业。\n- `lpr`: 向打印队列提交新打印作业。\n- `lprm`: 从打印队列中删除特定的打印作业。\n\
  \n如果你在命令行下工作，可以检查任何打印队列的状态并提交打印作业。对于每个命令，使用 `-P` 命令行选项配合打印机名称来指定打印机，如 列表 23.10 所示。\n\
  \n列表 23.10 中的第一行使用 `lpq` 命令检查打印队列状态，显示打印机已准备好接受新作业且目前队列中没有作业。`lpr` 命令提交一个新的打印作业来打印文件。在提交新的打印作业后，`lpq`\
  \ 命令显示打印机正在打印并显示正在打印的作业。\n\n## 使用热插拔设备\n\n计算机硬件通常分为两类：\n\n- 冷拔设备\n- 热插拔设备\n\n冷插拔设备是指只有在系统完全关机时才能连接到系统的硬件。这些通常包括计算机机箱内部常见的物品，如内存、PCI\
  \ 卡和硬盘。在系统运行时，你无法移除这些任何物品。\n\n相反，你通常可以在任何时间添加和移除热插拔设备。这些通常是外部组件，如网络连接、显示器和 USB 设备。热插拔设备的关键在于，Linux\
  \ 内核需要知道设备何时连接，并自动加载正确的设备驱动模块来支持该设备。\n\nLinux 提供了一个整个与热插拔设备交互的子系统，使用户可以使用它们。本节将描述该子系统。\n\
  \n### 探测动态设备\n\n`udev device manager` 是一个在启动时由 `init` 进程（通常在运行级别 5，通过 `/etc/rc5.d/udev`\
  \ 脚本）或 Systemd 系统启动并在后台始终运行的程序。它监听内核关于硬件设备的通知。当新硬件设备插入运行中的系统，或现有硬件设备被移除时，内核会发送通知事件消息。\n\
  \n`udev` 程序监听这些通知消息，并将消息与一组文件中定义的规则进行比较，这些文件通常存储在 `/etc/udev/rules.d` 目录下。如果设备匹配定义的规则，`udev`\
  \ 将按照规则定义对事件通知执行操作。\n\n每个 Linux 发行版都定义了一套 `udev` 遵循的标准规则。规则定义了此类操作，例如在安装 USB 存盘时将其挂载到\
  \ `/media` 文件夹下，或在移除 USB 网卡时禁用网络访问。你可以修改定义的规则，但通常没有必要。\n\n### 与动态设备协作\n\n虽然 `udev`\
  \ 程序在你的 Linux 系统后台运行，你仍然可以使用 `udevadm` 命令行工具与其交互。`udevadm` 命令允许你向 `udev` 程序发送命令。`udevadm`\
  \ 命令的格式如下：\n\n```\nudevadm command [options]\n```\n\n表 23.3 显示了可以发送给 `udevadm` 程序的命令。\n\
  \n| 命令 |  |\n| --- | --- |\n| `control` | 修改 `udev` 的内部状态 |\n| `info` | 查询 `udev`\
  \ 数据库获取设备信息 |\n| `monitor` | 监听内核事件并显示它们 |\n| `settle` | 监控 `udev` 事件队列 |\n| `test`\
  \ | 模拟一个 `udev` 事件 |\n| `test-builtin` | 运行内置设备命令进行调试 |\n| `trigger` | 从内核请求设备事件\
  \ |\n\n表 23.3 `udevadm` 命令\n\n`control` 命令允许你更改当前运行的 `udev` 程序。例如，通过添加 `-R` 选项，你可以强制\
  \ `udev` 重新加载 `/etc/udev/rules.d` 目录中定义的规则。\n\n在练习 23.1 中，你将在连接 USB 存盘时练习查看内核消息并观察\
  \ Linux 系统日志。\n\n## 总结\n\n\n\n\n\n有很多方法可以将硬件设备连接到 Linux 系统。`PCI` 和 `USB` 接口都为设备连接到主板提供了标准方式，以便进行通信。较新的\
  \ `GPIO` 接口提供了一种与较小设备交互的方法，这些设备使用单线输入/输出来控制传感器、开关、继电器和电机。\n\n除了物理接口外，Linux 还使用文件与设备通信。当你将设备连接到系统时，Linux\
  \ 会在 `/dev` 目录中自动创建一个文件，供应用程序向设备发送数据或从设备接收数据。内核使用 `/proc` 目录创建虚拟文件，其中包含设备信息和系统状态。内核还使用\
  \ `/sys` 目录来创建用于排排除设备问题的文件。\n\nLinux 提供了了一些命令行工具，在尝试排排除设备问题时非常有用。`lsdev` 命令允许你查看系统中所有设备的状态和设置。`lsblk`\
  \ 命令提供有关已连接的块设备（如硬盘和网卡）的信息。`dmesg` 命令让你能够查看内核环形缓冲区，以查看内核在检测和处理设备时的内核事件消息。`lspci`\
  \ 和 `lsusb` 命令允许你查看连接到 Linux 系统的 PCI 和 USB 设备。\n\nLinux 还提供了帮助显示器和打印机的软件。由 `XFree86`\
  \ 和 `X.org` 软件包使用的 `X11` 协议检测并接口连接到系统的显卡、显示器、键盘和鼠标，为应用程序提供标准接口。`CUPS` 软件为应用程序向本地和网络打印机发送文档提供了标准方法。\n\
  \n最后，本讨论了 Linux 如何处理热插设备。`udev` 监控内核事件，获取有关 USB 端口检测到的新硬件的信息。如果检测到新设备，`udev` 将按照设定的规则处理该设备。`udevadm`\
  \ 允许你控制 `udev` 在系统上的工作方式。\n\n## 考试要点\n\n**描述 Linux 系统如何与设备通信。** Linux 系统在 `/dev`\
  \ 文件夹中创建文件，应用程序使用这些文件向设备发送数据并从设备检索数据。设备文件可以是字符文件（一次发送/接收一个字符），也可以是块文件（按块发送/接收数据）。\n\
  \n**解释你如何查找插入 Linux 系统的 PCI 板板的硬件设置。** `lspci` 命令显示当前连接到系统的 PCI 设备。你可以结合这些信息使用 `lsdev`\
  \ 命令，它显示了每个设备使用的中断、I/O 端口和 DMA 通道。你也可以在 `/proc/interrupts`、`/proc/ioports` 和 `/proc/dma`\
  \ 文件找到这些信息。\n\n**解释 Linux 如何检测热插拔设备。** `udev` 应用程序在后台运行，监控内核环形缓冲区是否有新设备。当添加新设备时，`udev`\
  \ 应用程序从内核环形缓冲区消息中检测它，并遵循 `/etc/udev/rules.d` 目录规则规则定义的指令。\n\n## 复习题\n\n你可以在 附录 A\
  \ 中找到复习题的答案。\n\n1. 哪种硬件接口使用中断、I/O 端口和 DMA 通道与 PC 主板通信？\n    1. `USB`\n    2. `GPIO`\n\
  \    3. `PCI`\n    4. `Monitors`\n    5. `Printers`\n\n2. Linux 系统使用什么文件系统来跟踪与 PCI\
  \ 板通信的端口？\n    1. `/proc/ioports`\n    2. `/proc/interrupts`\n    3. `/sys`\n  \
  \  4. `/dev`\n    5. `/proc/dma`\n\n3. Linux 在哪里创建文件以直接与设备发送和接收数据？\n    1. `/sys`\n\
  \    2. `/proc`\n    3. `/etc`\n    4. `/dev`\n    5. `/dev/mapper`\n\n4. Katie\
  \ Jane 在她的 Linux 系统上创建了一个新的 LVM 卷。应该应该虚拟目录的哪里查找与新卷相关的虚拟文件？\n    1. `/dev`\n    2.\
  \ `/dev/mapper`\n    3. `/proc`\n    4. `/sys`\n    5. `/etc`\n\n6. Joel 在他的 Linux\
  \ 系统中安装了一个新的 PCI 卡，但现在与系统的另一个设备发生了冲突。他可以使用什么命令显示所有现有设备使用的中断、I/O 端口和 DMA 通道？\n  \
  \  1. `lsdev`\n    2. `lsblk`\n    3. `lspci`\n    4. `lsusb`\n    5. `dmesg`\n\n\
  7. 哪一个 Linux 命令显示内核环形缓冲区的内容？\n    1. `lsdev`\n    2. `lsblk`\n    3. `lspci`\n \
  \   4. `lsusb`\n    5. `dmesg`\n\n8. 哪些软件包实现了 Linux 中的 X Windows 图形系统？（选择两个）\n \
  \   1. `X.org`\n    2. `CUPS`\n    3. `Wayland`\n    4. `X11`\n    5. `udev`\n\n\
  9. Sophia 需要将她的 Linux 系统连接到办公室网络上的新的网络打印机。她需要确保安装哪个软件软件包以便配置新的网络打印机？\n    1. `X.org`\n\
  \    2. `CUPS`\n    3. `Wayland`\n    4. `X11`\n    5. `udev`\n\n10. 哪个程序在后台运行监控内核环形缓冲区消息以检测新设备？\n\
  \    1. `X.org`\n    2. `CUPS`\n    3. `Wayland`\n    4. `X11`\n    5. `udev`\n\n\
  # 第 24 章\n\n排排除应用程序和硬件问题\n\n![](img/chaptersquare.png)\n\nLinux 系统的主要目的是提供服务。然而，如果它的某个应用程序或其使用的硬件运行不正常，系统就无法履行职责。了解应用程序和硬件的常见及某些异常问题将帮助你快速解决任何问题。\n\
  \n***\n\n## 处理存储问题\n\n排排除存储问题的范围从易于检查的项目到奇怪晦涩的问题不等。例如，如果你刚刚安装了驱动器，请测试连接情况以确保它们是紧密的。之前运行良好的磁盘可能会遭受存储下降。本节涵盖了这些问题以及更多问题。\n\
  \n### 探索常见问题\n\n如果你是 Linux 系统管理的新手，很可能不了解常见的存储问题。以下内容可以帮助你做好准备：\n\n* **存储下降/模式 (Degraded\
  \ Storage/Mode)**：存储下降是指存储介质由于时间增长或使用不当而逐渐衰减，导致数据退化或丢失。例如，SSD 由于其有限的写入/擦除 (PE) 周期，寿命是的。因此，在交换空间中使用\
  \ SSD 是不明智的。\n* **下降模式 (Degraded mode)** 指的是 RAID 阵列中的一个或多个磁盘发生故障的情况。在这种情况下，排排除工作需要你使用\
  \ `mdadm -D` 命令查看特定阵列的详细状态。如果状态包含 `degraded` 单词，请为阵列添加另一个分区以便其恢复。\n* **设备丢失 (Missing\
  \ Devices)**：存储设备在 Linux 上可能会“丢失”，但原因各异。如果是网络附属存储 (NAS)，请先检查你的网络（参见第 20 章，“分析系统属性和修复](#c020.xhtml_c020)”）。\n\
  * 如果是本地连接设备且 `lsblk` 等工具未显示它，请使用超级用户权限并尝试 `lspci -M` 命令。该命令将对所有 PCI 连接设备进行彻底扫描。\n\
  * 连接 Linux 设备的通道是设备文件，例如 `/dev/sdb`。确保特定分区的设备文件可用未损坏。如果需要，通过 `mknod` 命令重建它。\n\n\n\
  \n\n\n*   检查你（或实用程序配置）是否在使用正确的设备文件名。整个磁盘由不带数字的设备文件名表示，例如 `/dev/sdc`。磁盘分区由设备文件名及其数字指定，例如\
  \ `/dev/sdc2`。当使用 NvME SSD 时，设备文件名（如 `/dev/nvme0n1p1`）包含额外项，包括命名空间（namespace）。\n\
  \n*   卷丢失（Missing Volumes）：设备丢失的另一种形式是卷（volume）。如果你对组成逻辑卷的物理设备执行 `pvscan` 并得到“Couldn’t\
  \ find device”的消息，说明你丢失了一个卷。通常的原因是磁盘故障或意外移除。\n*   如果逻辑卷的某个磁盘发生故障，丢失磁盘的 UUID 将显示在\
  \ `pvscan` 信息中。你可以通过 LVM 工具替换该卷（`pvcreate`）、恢复组元数据（`vgcfgrestore`）、扫描组（`vgscan`），然后激活它（`vgchange`）。\n\
  *   挂载点缺失（Missing Mount Points）：“Mount point does not exist”错误意味着显而易见的问题——你尝试挂载的文件系统目录不存在。该目录要么被删除，要么根本就没创建。通过\
  \ `mkdir` 命令使用相应的权限创建它。\n*   然而，此错误也可能由不明显的问题引起。重点在于使用 `bind` 选项，通过命令行 `mount` 命令或在\
  \ `/etc/fstab` 文件中将文件系统从当前挂载点移动到新挂载点。如果它尚未挂载，你会得到“Mount point does not exist”错误。\n\
  *   存储完整性（Storage Integrity）：坏块（也称为坏道）是由于损坏或物理损坏导致无法响应 I/O 请求的磁盘小区域。随机坏块并不意味着驱动故障，但这些存储设备需要监控，因为坏道的增加表明需要更换。\n\
  *   除了在第 11 章中介绍的处理存储（Handling Storage) `fsck` 命令外，你可以使用 `badblocks` 工具来监控驱动。在检查坏道之前，明智的做法是备份并卸载分区。使用\
  \ `badblocks -n partition-device-file` 命令进行无破坏测试。该工具在运行时提供进度，并在测试完成后输出最终的坏块状态。\n\
  *   此外，磁盘制造商通常提供自己的自己的测试程序。这些程序可以让你知道是否需要更换驱动，但不会提供关于坏道的详细数据。\n*   性能问题（Performance\
  \ Issues）：存储性能不良会影响应用程序。除了使用 `iostat`、`ioping`、`iotop` 和 `sar`（第 20 章介绍）来监控存储性能问题外，还可以使用\
  \ `hdparm` 来确定驱动器的读取速度。该工具适用于具有 SCSI/ATA 转换的驱动。\n*   `dstat` 工具类似于 `iostat`，但为排除存储性能问题提供了额外的有用数据。例如，此工具显示与单个\
  \ LV 相关的吞吐量统计。\n*   另一个专门与逻辑卷工作的方便工具是 `dmstats`。该工具允许对设备映射器（device mapper）的统计进行设置和管理。你可以通过\
  \ `lsblk -p` 工具确定逻辑卷相关的设备文件名。\n*   衡量磁盘性能的 GUI 工具是 `gnome-disks`。然而，在执行基准测试之前，请备份磁盘的任何数据。\n\
  *   资源耗尽（Resource Exhaustion）：资源耗尽是指系统的有限资源被占用且其他不可用的情况。索引节点（inode）数量或磁盘空间不足（第 20\
  \ 章介绍）是两个例子。\n\n### 处理特殊问题（Dealing with Specialized Issues）\n\n对于出现问题的旧存储设备，你应该检查的内容之一是设备是否有新的驱动或固件可用。这通常可以解决棘手问题。另一个需要检查的项目是设备的\
  \ Linux 模块（驱动）。如果它没有加载或构建到 Linux 内核中，你的设备将无法工作。从 `dmesg` 工具开始获取一些线索。列表 24.1 显示了一个示例。\n\
  \n使用 `grep` 搜索 `dmesg` 工具的输出，查找有关 `sde` 磁盘（`/dev/sde`）的信息。这里的重要线索是该磁盘是 SCSI 磁盘。可用的\
  \ SCSI 驱动信息存储在 `/sys/` 目录下，如列表 24.2 所示。注意 `sd` 和 `sr` 驱动用于 SCSI 设备。`udevadm` 命令确认\
  \ `/dev/sde` 磁盘使用的是哪一个。\n\n确定驱动（模块）后，使用 `lsmod` 命令查看它是否已加载到内核中。列表 24.3 显示了一个示例。\n\
  \n如果模块没有加载，它可能被构建到了内核中。你可以通过查看 `modules.builtin` 文件来检查这一点，如列表 24.4 所示。\n\n如果模块既没有加载也没有构建到内核中，请使用超级用户权限和\
  \ `modprobe` 命令动态加载它（参见第 14 章）。\n\n### 查找 SATA（Seeking SATA）\n\n适配器是一个有一个或多个软件接口的硬件。不同的存储接口（如\
  \ SATA 驱动）可能会有独特的问题。在 Linux 上，SATA 驱动是自配置的。它们通常连接到 SCSI 总线，并由 `/dev/sd*` 设备文件表示。\n\
  \n在 Linux 上，某些 SATA 设备由于频繁的磁头加载和卸载可能会比其他设备更早失效。通常这是由于激进的电源管理。\n\n如果 SATA 驱动使用了自监控分析和报告技术（SMART），可以通过\
  \ `smartctl -a` 命令检查这种状况。查看 `Start_Stop_Count`，即加载和卸载的次数。对于特定磁盘，与其他驱动器相比较高的计数表明存在此问题。通过驱动器上的\
  \ `hdparm -B` 命令双重检查。如果命令返回较小的数字（如 1），则确认了激进的电源管理。你可以通过超级用户权限并输入 `hdparm -B 127\
  \ device-filename` 来修改此，这不仅会移除激进电源管理，通常还会提高性能并延长驱动器寿命。\n\n### 理解 SCSI（Comprehending\
  \ SCSI）\n\n在 Linux 上，SCSI 框架由三个部分组成：\n\n*   **上层**：设备驱动（例如磁盘驱动）层\n*   **中间层**：SCSI\
  \ 路由层\n*   **下层**：主机队列适配器（HBA）驱动层\n\n上层最应用程序或用户命令，而下层 SCSI 层紧邻实际硬件。HBA 是电路板或集成电路适配器，连接到磁盘驱动。与设备驱动一样，HBA\
  \ 驱动要么加载或构建到内核中。\n\n如果 HBA 或设备驱动未加载或构建到内核中，就会出现问题。之前，在第 11 章介绍的处理存储（Handling Storage)\
  \ 中，我们对 SCSI 上层驱动进行了检查。\n\n\n\n\n\n注意 HBA 驱动程序是高级主机控制器接口（AHCI）驱动程序，并被加载到内核中。此特定驱动允许你热插\
  \ SATA 驱动器，这些驱动器被视为 SCSI 设备。换句话说，SATA 驱动器被附加到 SCSI 框架。\n\n当你将 SATA 驱动器作为热插 SCSI\
  \ 设备挂载时，你需要对其进行启用。这可以通过重启系统或修改 `/sys/class/scsi_host/host#/scan` 文件来实现。`#` 是驱动器的\
  \ SCSI 主机号。确定适当的主机号并修改文件的示例请参见列表 24.6 中的代码片段。\n\n在此示例中，`lsblk -S` 命令仅显示已连接的 SCSI\
  \ 框架设备，而 SATA 驱动器为 `sde (/dev/sde)`。输出中的 HCTL 列显示设备的主机号（第一个冒号之前的数字）。在这种情况下，主机号为\
  \ 6。确定磁盘的主机号后，将字符 `‘- - -’` 回显到相应的文件（注意每个横线之间需要空格）。此操作将强制系统扫描附加在该主机号的 SCSI 框架设备，从而启用该驱动器。\n\
  \n## 管理 RAID\n\nLinux 系统可以使用软件 RAID 和硬件 RAID。软件 RAID 阵列通过多设备（md）驱动程序实现。通过查看 `/proc/mdstat`\
  \ 文件可以检查你的软件 RAID 阵列状态。\n\n如果它是基于 SATA 的且某个驱动器离线，软件 RAID 阵列可能会挂起。这发生在 HBA 不处理热插拔操作时。因此，检查你的底层\
  \ SCSI 框架驱动程序是否支持热插拔是明智的。如果你的 HBA 使用 `AHCI` 模块（驱动），则允许热插拔。\n\n硬件 RAID 阵列通过连接到 Linux\
  \ SCSI 框架的硬件设备管理。硬件 RAID 控制器的数据（如制造商和型号）可以通过使用超级用户权限并在命令行中输入 `lspci -knn | grep\
  \ “RAID bus controller”` 来获取。如果你继承了一个 Linux 系统并需要获取制造商实用程序来排故障和监控硬件 RAID 阵列，这将会非常有用。\n\
  \n## 发现应用权限问题\n\n用户通知你某个应用程序在尝试运行时发出了 I/O 错误。该问题可能是权限问题。在开始排故障之前，你需要收集一些信息：\n\n\
  1. 确定运行应用程序的帐户以及该账户的名称。\n2. 发现触发错误的特定程序操作。\n3. 为应用程序尝试执行读/写的任何文件或其尝试创建的任何文件获取完整的目录引用。\n\
  4. 如果适用，记录其尝试启动的任何其他应用程序。\n5. 如果适用，记录该应用程序尝试使用的任何本地或远程服务，例如 NTP 或文件服务器（第 2 章，“服务介绍”）。\n\
  \n当你拥有这些细节后，就可以继续你的排故障过程了。\n\n- **所有权**：使用 `ls -l` 命令查看涉及的各种应用程序文件。确定哪个用户名拥有这些文件以及授予这些所有者的权限。不要忘记查看目录权限。你需要知道整个目录树的所有者和权限。\n\
  - 如果应用程序不是在拥有文件或目录树的所有者用户名下运行，则你需要检查组关系以及可能的其他权限。如果需要复习，文件和目录权限的排故障已在第 22 章，“调查用户问题”中介绍。\n\
  - **组关系**：发现运行应用程序的终端用户所属的组。如果应用程序在不同的帐户下运行，请检查该帐户的组关系。\n- 当你获得这些信息后，可以检查涉及的应用程序文件。识别这些文件以及目录树的组权限，以发现任何潜在问题。\n\
  - **可执行文件**：如果特定账户无法运行应用程序，请检查执行权限。记住，如果应用程序启动了额外的程序，你还需要检查那些程序的权限。\n- 如果你使用的脚本更改了其当前工作目录且运行失败，请检查它正尝试访问的目录树。必须在树中的每个目录上授予执行权限，帐户才能将当前工作目录切换到该特定位置。详情请参考第\
  \ 15 章，“应用所有权和权限”，了解文件权限（特别是 SUID 和 SGID 等特殊权限）如何应用。\n- **继承**：如果应用程序正在特定目录中创建文件并无法再次访问这些文件，请检查是否通过\
  \ ACL 强制继承（在第 15 章中介绍）。如果目录有默认 ACL，则在该目录内创建的任何未专门设置 ACL 的文件将继承其目录的 ACL。你可以使用 `getfacl\
  \ -d` 或 `--default` 命令查看默认目录 ACL。\n- 如果你发现目录的默认 ACL 是问题所在，请考虑删除默认 ACL 并在目录上定义所需的\
  \ ACL。另一种方法是显式设置应用程序文件的 ACL，这将覆盖继承的目录默认 ACL。使用 `setfacl` 工具执行这些更改。\n- 应用权限是 Linux\
  \ 中一个棘手的特性，进行一些练习对它有帮助。练习 24.1 将引导你完成应用程序运行不正常时需要采取的排故障步骤。\n\n## 分析应用依赖关系\n\n在第\
  \ 13 章，“软件管理”中，我介绍了如何使用如 `apt-cache depends` 和 `yum deplist` 等包管理命令来显示由仓库管理的应用程序的依赖关系。在程序和它们的各种依赖关系方面，可能会遇到一些特殊问题。这里检查了与认证考试相关的常见问题。\n\
  \n### 版本控制\n\n通常，应用程序软件和操作系统不断更新。这些更新可能会提高性能或添加额外功能。为了跟踪各种应用程序更新，采用了一种名为版本控制的技术。版本控制是通过编号过程对多个应用程序软件更新的管理。应用程序的不同版本（发布）具有不同的数字，这些数字通常随着新的应用程序更新而增加。\n\
  \n例如，Linux 内核版本 6.12.9 于 2025 年 1 月发布。当前的内核版本可以在 `www.kernel.org` 找到，其数字比 6.12.9\
  \ 版本大。这些数字表示更新的版本。\n\n你可以使用版本控制来确定是否发布了应用程序更新或补丁。这在排除应用程序软件问题时很有帮助。\n\n### 更新问题\n\
  \n如果应用程序遇到问题，请检查是否有软件更新。如果应用程序可以通过仓库获取，请使用你发行版的特定包管理检查新版本（参见第 13 章）。\n\n考虑建立一个带有应用程序环境的测试系统，并在上面应用应用程序更新。在更新生产环境应用程序之前，可以进行彻底的计划测试。在应用任何生产应用程序更新之前，确保你有一个良好的备份。这两项应该应该保护你免受大多数糟糕情况的影响。\n\
  \n\n\n\n如果应用程序在最近更新后开始出现问题，请检查该发行版的包管理历史信息。例如，在运行 `RPM` 的系统上，可以使用超级用户权限执行命令 `rpm\
  \ -q `package-name` --last` 来查看 `package-name` 软件包的最新更新历史。在 Debian 系统上，检查 `/var/log/apt/history.log`\
  \ 文件。你需要使用适当的包管理工具卸载任何导致问题的已安装软件包或库（参见第 13 章）。\n\n当一个软件软件包依赖另一个软件包或库才能正常运行时时，它被称为`依赖`（dependency）。`损坏依赖`（broken\
  \ dependency，也称为未满足的依赖，unmet dependency）是一种不理想的情况，即软件软件包已安装，但其需要的一个或多个软件包或库尚未安装。有时软件包升级可能会破坏依赖关系，导致所谓的`损坏包`（broken\
  \ package）。\n\n在 Debian 包管理系统中，要检查是否存在损坏的依赖，请使用 `apt-get check` 命令。`YUM` 包管理器不会更新导致损坏依赖的程序，但如果你使用\
  \ `rpm` 工具安装了导致问题的程序，可以在任何 Red Hat 包管理系统上执行 `rpm -aV` 命令来查看损坏的软件包。\n\n### 补丁（Patching）\n\
  \n`补丁`（patch）指的是针对特定应用程序或系统服务的程序更改或配置文件更新。补丁可能会修复严重问题或修复安全漏洞，并且通常在正常的软件更新周期之外发布。`补丁`（Patching）是应用补丁的行为。它并不意味着要更新系统中所有的软件。关于补丁管理有许多冲突的理论，但其核心问题是确保你的应用程序和\
  \ Linux 系统为用户运行顺畅、安全且高效。\n\n内核补丁发布略有不同。它是一个特殊的源码包，仅包含应用于主内核源码发布版本的更改。你只需要下载补丁源码包，使用\
  \ Linux 的 `patch` 命令将补丁更新到系统中现有的内核源码文件中，然后重新编译内核。通常情况下，当你更新系统上的软件包（软件）时，你的包管理器会为你处理这些工作。\n\
  \n### 处理库（Dealing with Libraries）\n\n应用程序函数通常被拆分为单独库文件（共享库），这样使用相同函数的多个应用程序就可以共享这些库文件。库首次在第\
  \ 13 章中介绍。\n\n如果应用程序在软件升级后开始出现问题，可能与应用程序使用的最近升级的共享库有关。你可以通过在命令行输入 `ldd program-name`\
  \ 来检查程序使用了哪些库。将此命令的输出重定向到另一个文件中是有帮助的。使用 `grep` 命令搜索包管理日志文件，以确定应用程序的某个库是否最近更新过。示例见列表\
  \ 24.7 中的节取。\n\n此示例中使用的应用程序是 `OpenSSH` 命令。注意其中一个库最近被升级了。（`grep` 命令的 `-B` 和 `-A`\
  \ 选项允许你提取找到的内容下方和上方额外的行。）如果在该库升级后不久就开始出现问题，那么你可能找到了原因。检查该库是否有新的更新或补丁可用。如果没有，你可能需要卸载它并安装较早的版本。\n\
  \n### 探索环境变量问题（Exploring Environment Variable Issues）\n\n如果你新安装的应用程序无法执行，请检查 `PATH`\
  \ 环境变量。此特定变量决定了 `Bash` Shell 无法直接处理的程序需要在哪些目录进行搜索。显示变量内容的示例见列表 24.8。\n\n如果你需要为所有人修改此参数，请在\
  \ `/etc/profile.d/` 目录下创建一个 `Bash` 脚本文件（Bash 脚本在第 25 章“部署 Bash 脚本”中介绍）。务必确保使用 `.sh`\
  \ 文件扩展名。该文件必须由 `root` 所有并属于 `root` 组。将文件的其他（世界）权限设置为 `r`，以便所有用户都能读取该文件。当用户登录系统或启动新\
  \ Shell 时，取决于你的发行版，`/etc/profile` 或 `/etc/bashrc` 文件读取。\n\n如果只有某些用户需要此特定的 `PATH`\
  \ 修改，请在他们的 `~/.profile`、`~/.bash_profile` 或 `~/.bash_login` 文件中进行。环境变量文件在第 10 章“管理用户和组”中进行讨论过。\n\
  \n### 获取 GCC 兼容性（Gaining GCC Compatibility）\n\nLinux 中编译程序最常用的工具是 `GNU 编译器集`（`GCC`）。如果你在\
  \ Linux 上使用 `GCC` 编译应用程序遇到问题，可能有几种潜在原因。它们如下：\n\n*   `GCC` 使用系统 C 库，该库可能符合 ISO C\
  \ 标准。\n*   `GNU C` 与非 ISO 版本的 `C` 之间存在若干显著的不兼容之处。\n*   `GCC` 使用修正后的系统头文件，这可能会导致问题。\n\
  \n注意，除了这些问题外，你可能在使用旧版本的 `gcc` 并需要更新。例如，如果你的系统发行版是 `CentOS 7` 且你正在使用 `GCC v4.4.`，你需要升级\
  \ `GCC` 软件包。\n\n你可以在 GCC 编译器的网站上找到详细文档——`https://gcc.gnu.org`。该网站包含问题解答和其他有用信息。\n\
  \n### 检查仓库问题（Perusing Repository Problems）\n\n当你遇到关于无法找到、更新或安装的软件包的异常错误消息时，要检查的第一件事是网络连接。通常，未连接网络的系统会导致此问题。然而，各种软件包仓库（也称为\
  \ `repos`）可能会损坏。\n\n在运行 Debian 包管理器的系统（如 `Ubuntu`）上，如果你收到无法下载仓库信息或类似的消息，请使用 `apt-get\
  \ clean` 命令。该命令会清理数据库和任何临时下载文件。之后，尝试使用 `apt-get update` 更新本地仓库，它会尝试获取仓库中软件包的更新信息。\n\
  \n在运行 Red Hat 包管理器的系统（如 `Rocky Linux`）上，你可以根据发行版使用 `yum clean all` 或 `zypper clean\
  \ -a` 命令。接下来，使用 `yum check-update` 或 `zypper refresh` 命令更新本地仓库。\n\n如果你正尝试从非标准仓库安装或更新软件包，可能需要在系统中启用该仓库。在\
  \ Red Hat 包系统上，使用 `yum repolist` 或 `zypper repos` 命令查看系统上启用的仓库列表。对于 Debian 包系统，你需要执行\
  \ `grep -v “#” /etc/apt/sources.list` 命令来查看已启用的仓库。\n\n在添加任何额外的非标准仓库之前，请备份仓库文件，例如：\n\
  \n*   `/etc/apt/sources.list`\n*   `/etc/yum.repos.d/*.*`\n*   `/etc/zypp/repos.d/*.*`\n\
  \n你需要手动编辑 `sources.list` 文件来添加并启用新仓库。要使用 `YUM` 添加并启用新仓库，请使用 `yum-config-manager\
  \ --add-repo repository-url` 命令。`zypper` 命令类似，但还需要仓库名称别名——`zypper addrepo repository-url\
  \ alias`。\n\n请记住，我只提到了程序及其各种依赖关系中可能遇到的一些常见问题。务必利用你发行版的帮助页（man pages）来获取额外帮助。\n\n\
  ## 查看 SELinux 上下文违规（Looking at SELinux Context Violations）\n\n\n\n\n应用程序问题可能是由系统的\
  \ Linux 内核安全模块引起的，例如 SELinux（详见第 15 章）。错误的策略配置触发违规，可能会导致应用程序无法实现其功能。先使用 `sealert`\
  \ 命令检查审计日志文件。如果该工具可用，可以通过 `setroubleshoot` 软件包进行安装。\n\n文件标签错误可能会导致问题，例如应用程序拒绝访问。使用\
  \ `ls -Z` 命令查看文件的 SELinux 上文（context）。如果文件或其父目录需要更改其上下文，请使用 `chcon` 工具进行修改，使用 `semanage`\
  \ 命令进行持久化修改，并使用 `restorecon` 修复标签。不要忘记同时使用这三个命令，否则你将无法解决问题。\n\n受 SELinux 限制的应用程序需要设置正确的布尔值（Booleans）以允许适当的访问。`getsebool`\
  \ 命令允许你查看应用程序的布尔值。如果你需要更改它们，请使用超级用户权限和 `setsebool` 命令。\n\n## 探索防火墙拦截\n\n如果应用程序在网络上遇到问题，且没有网络本身的问题，你可能需要检查本地和远程系统的防火墙。任何应用程序更新或防火墙修改都可能触发此问题。防火墙内容在第\
  \ 18 章“管理 Linux 防火墙”中介绍过。\n\n### 解除 ACL\n\n防火墙 ACL 通过检查控制信息和其他网络数据来识别网络数据包。因此，在排查与防火墙相关的应用程序问题时，你需要为往返的应用程序数据包收集以下信息：\n\
  \n* 源地址或主机名\n* 目的地址或主机名\n* 使用的网络协议\n* 使用的入站端口\n* 使用的出站端口\n\n你还需要了解源和目的系统正在使用的防火墙应用程序。收集这些信息后，你可以检查双方的防火墙设置，以确定\
  \ ACL 是否过于严格。\n\n例如，如果你在应用程序的宿系统上使用 `firewalld`，可以快速检查当前的默认区域，如列表 24.9 所示。\n\n注意，该系统的\
  \ `firewalld` 默认区域设置为 `drop` 区域。这意味着所有入站网络数据包都被丢弃，仅允许出站网络连接。如果应用程序接收来自其他系统的数据或连接，则此防火墙\
  \ ACL 设置过于严格。\n\n### 解锁端口\n\n如果应用程序依赖于系统服务（守护进程），你需要检查与服务端口相关的规则。阻塞外部服务所需的端口将对应用程序产生不利影响。如果你的应用程序设计为使用不属于已知服务的端口，也请检查该端口。\n\
  \n例如，如果你在系统上提供公共 Web 服务，你需要允许与 HTTPS 协议端口 443 相关的入站和出站数据包。如果你的系统使用 `iptables` 防火墙软件，可以通过\
  \ `iptables -L` 命令查看当前的 ACL 规则。如果数据包过滤器通过特定规则或策略拦截了 443 端口，可以通过类似于列表 24.10 中的命令来修改链，从而开放\
  \ 443 端口。\n\n请记住，你还需要修改 `OUTPUT` 链规则以允许 Web 服务器建立连接。此外，如果你的应用程序允许 HTTP 流量，你还必须修改端口\
  \ 80 的规则。\n\n### 解锁协议\n\n除了端口，还要注意应用程序采用的各种协议，如 UDP、TCP 和 ICMP。如果它使用其他系统服务，你也必须知道它使用的协议。`/etc/services`\
  \ 文件可以提供帮助。\n\n例如，一个应用程序与本地网络上的 DNS 缓存服务器协作。DNS 协议使用 53 端口。检查 `/etc/services`（已知端口）文件以找到它使用的传输协议，如列表\
  \ 24.11 中的片段所示。\n\n在 DNS 服务器系统上解锁 TCP 和 UDP 的 53 端口，因为 DNS 使用这两个传输协议监听请求。同时，也要对入站和出站数据包解锁这些端口。\n\
  \n## 排查额外的硬件问题\n\nLinux 的运行需要硬件。当硬件停止正常工作时，Linux 也无法正常运行。因此，作为 Linux 系统管理员，理解如何排查所有硬件是一项基本技能。\n\
  \n### 查看有用的硬件命令\n\n在排查硬件问题时，有很多 Linux 命令行工具可以提供帮助。`lspci`、`lsusb` 和 `lsdev` 命令就是其中几个，它们在第\
  \ 23 章“处理 Linux 设备”中介绍过。我在这里介绍另外两个强大的工具：`dmidecode` 和 `lshw`。\n\n#### 理解 dmidecode\
  \ 工具\n\n在查看 `dmidecode` 命令之前，你需要了解分布式管理工作组（DMTF）及其标准。DMTF 是一个非营利组织，其目标是通过标准简化网络访问技术（如服务器）的管理。从本质上，它有助于使系统管理变得更容易。\n\
  \nDMTF 创建了桌面管理接口（DMI）和系统管理 BIOS（SMBIOS）标准。DMI 规范由四个部分组成，提供了关于计算机使用的硬件的信息以及一些额外的有用数据。SMBIOS\
  \ 标准由项目（如数据结构）组成，用于读取计算机 BIOS 生成的管理信息。这两个标准相互作用，并被硬件制造商广泛采用。\n\n要使用这些标准，你需要两样：一台符合\
  \ DMI/SMBIOS 标准的计算机以及指向其数据结构的软件接口。Linux 系统上的软件接口是 `dmidecode` 工具。\n\n`dmidecode`\
  \ 工具默认从 sysfs 文件系统获取信息，具体来说来自 `/sys/firmware/dmi/tables/` 目录下的表。你可以使用列表 24.12 中的命令检查系统中是否存在这些表。注意，该系统中存在这些表。\n\
  \n`dmidecode` 工具的帮助选项描述了你可以用于在硬件排查过程中发现信息的各种选项。虽然在提取表信息时必须使用超级用户权限运行命令，但在获取帮助时不需要。示例如列表\
  \ 24.13 所示。\n\n在各种选项中，对排查最有用的是 `-t` 或 `--type` 开关。它允许你通过提供参数（数字或关键字）从 DMI/SMBIOS\
  \ 表中提取特定信息。关键字可以是以下之一：\n\n* `baseboard`\n* `bios`\n* `cache`\n* `chassis`\n* `connector`\n\
  * `memory`\n* `processor`\n* `slot`\n* `system`\n\n如果表中不包含所需信息，你将只会收到一条关于该工具尝试提取数据位置的消息，以及可能支持的\
  \ DMI 和/或 SMBIOS 标准版本。两个示例如列表 24.14 所示。注意，表中没有内存信息，但显示了一些系统数据。\n\n#### 理解 lshw 工具\n\
  \n\n\n\n硬件信息存储在系统中的各种 `/proc/` 目录文件中。虽然你可以费力寻找并挖掘它们，但 `lshw` 工具可以为你完成这项工作。它提供了有关系统处理器、内存、网卡\
  \ (NIC)、USB 控制器、磁盘等的数据。它通常在大多数发行版中默认安装，或者可以在标准仓库中找到（参见第 13 章 中安装软件包的章节）。\n\n有两个实用的选项：`-short`，它可以生成一个格式良好的表格化硬件数据显示；以及\
  \ `-businfo`，它可以显示与 SCSI、USB、IDE 和 PCI 设备相关的信息。列表 24.15 中展示了使用 `-short` 选项的示例。\n\
  \n你还可以在 `lshw` 工具中使用 `-class` 选项。这提供了有关特定硬件组件的详细信息。可用的不同类别会在 `lshw -short` 命令的输出中显示。使用\
  \ `-class` 选项的示例可见列表 24.16。\n\n### 调查其他硬件问题\n\n偶尔你会遇到不常见的硬件问题。能够快速解决这些独特的问题将使你从同事中脱颖而出。\n\
  \n- **内存**：RAM 的物理问题很难诊断。此类问题的一些症状包括系统性能随时间推移而变慢、在运行内存密集型应用程序或启动时系统出现挂起、间歇性发生内核崩溃（kernel\
  \ panics）或段错误、文件偶发损坏，和/或程序安装失败。\n- 首先确保不是内存容量问题，容量问题通常表现出与硬件问题类似的症状。使用 `free` 和\
  \ `vmstat` 工具进行检查。\n- 你可以使用 `lshw` 工具快速确定有关 RAM 的硬件信息。只需执行 `lshw -class memory`\
  \ 命令即可。\n- 如果你最近添加了新内存，很可能是获得了一个故障组件。电压浪涌或断电也可能损坏 RAM。无论在任何情况下，你都应该对内存进行测试。通常你可以通过重启系统并访问服务器启动菜单中的\
  \ `memtest` 或 `memtest86+` 选项来进行此类测试。如果没有此选项，可以使用 `memtester` 工具。此命令行工具通常不是默认安装的，但可以在你发行版的仓库中找到或作为\
  \ RPM 或 dpkg 文件可用（参见第 13 章）。使用此工具时，你需要关闭任何生产环境应用并分段测试内存。\n- **打印机**：外部硬件设备对于 Linux\
  \ 通常是即插即用的，但确实会出现奇怪的问题。在处理打印机时，问题通常归于过时/错误的驱动程序 (PPD) 或连接不良。首先通过 `dmesg` 内核缓冲区并查看打印机错误日志文件，例如\
  \ `/var/log/cups/error_log`。\n- 如果最近安装了打印机，检查其配置。如果系统上有网络浏览器，可以在地址栏输入 `127.0.0.1:631`\
  \ 来完成。如果你的系统没有 GUI，可以查看 `/etc/cups/printers.conf` 文件来检查打印机配置。\n- 确定打印机如何连接到系统。它是网络打印机吗？是通过\
  \ USB 线连接的吗？打印机直接连接到并行端口吗？如果是网络打印机，首先检查网络是否正常。如果打印机通过 USB 线连接，从排查 USB 连接开始（本章稍后介绍）。如果它使用系统上的并行端口，可能是适配器故障。如果可能，考虑将其切换到不同的连接类型（如\
  \ USB），或获取具有更现代配置的新打印机。\n- 检查打印机的 PostScript Printer Definition (PPD) 文件或驱动程序是否需要更新。访问制造商或开源驱动网站确定是否有可用更新。你可以使用\
  \ `lpinfo -m` 命令查看系统上所有当前可打印机驱动程序。记住，问题可能涉及需要更新打印机固件，所以也要检查这些。\n- **视频**：视频硬件问题表现为显示缓慢、音频延迟、屏幕闪烁等。你甚至可能看到黑屏或收不到音频输出。某些问题甚至会导致系统崩溃或挂起。\n\
  - 与许多其他硬件问题一样，首先检查内核缓冲区 (`dmesg`) 和视频日志文件。如果你的系统仍使用 X11，检查日志文件或 `/var/log/Xorg.0.log`\
  \ 文件。如果你正在使用 Wayland，使用 `journalctl` 命令检查日志文件。\n- 要找出你的系统正在使用什么显卡驱动程序，只需在命令行输入 `lspci\
  \ -vnn` 并将标准输出 (STDOUT) 重定向到文件。检查文件中的 `VGA` 单词。这将显示你的显卡驱动数据。你也可以使用 `lshw -class\
  \ display`（或 `video`）并查找驱动信息。当你获得驱动名称后，通过 `modinfo driver-name` 命令获取更多细节。\n- 检查制造商或开源网站查看是否有可用的更新显卡驱动程序。如果没有，尝试在另一个系统上测试显卡，以查看是否需要更换。\n\
  - **通信端口**：通信端口是串口通信端口。虽然现在已很少见，但它经常用于连接收银台设备等硬件。表示这些串口端口的设备文件为 `/dev/ttyS#`。\n\
  - 当串口通信设备出现问题时，通过通过执行 `dmesg | grep ttyS` 开始排查，以找到正在使用的设备文件名。获得完整的设备文件名后，使用 `setserial`\
  \ 工具。这将提供有关串口设备的详细信息。使用超级用户权限，并在命令行输入 `setserial -a device-file-name`。在输出中寻找中断请求\
  \ (IRQ) 编号。\n- 当你知道串口设备的 IRQ 后，可以检查中断文件。如果你在 `/proc/interrupts` 文件中没有找到 IRQ ，说明没有加载对应串口设备的驱动程序。\n\
  - 如果驱动已加载，检查制造商网站是否有新更新的驱动。还要检查串口设备的建议配置，并使用 `setserial` 工具进行任何修改。\n- **USB**：如果你的系统直接连接了\
  \ USB 设备（如打印机）并发生问题，可以使用一些简单的排查技术。首先，使用超级用户权限并在命令行输入 `lsmod | grep usb` 确保 USB 模块（驱动）已加载到内核。如果你收到响应，说明已加载。如果只是返回了提示符，则使用\
  \ `modprobe` 命令加载模块（参见第 14 章）。\n- 如果驱动已加载，尝试从系统上断开设备的 USB 线。通过执行 `journalctl -f`\
  \ 命令监控日志文件。如果你使用的是旧版本的 Linux 系统，对适当的日志文件使用 `tail -f` 命令，例如 `/var/log/syslog` 或 `/var/log/rsyslog`。监控完成后，插回\
  \ USB 设备线查看生成了哪些日志消息。如果 USB 设备是打印机，还要检查 `/var/log/cups/error_log` 的任何相关信息。你可能会在这里发现一些重要细节。\n\
  - 完成上述操作后，使用 `lsusb -v` 命令查看设备是否出现在 USB 总线上。如果你看到了设备的制造商和产品信息，说明 Linux 可以看到该设备。如果系统上没有安装\
  \ `lsusb` 工具，请使用 `dmesg` 查看内核缓冲区。\n\n\n\n\n*   检查 USB 设备文件是否损坏。此主题已在章节早前的“探索常见问题”部分中的“缺失设备”列表中讨论过。\n\
  \n*   如果你的 USB 设备仍然无法工作，请尝试将其连接到不同的 USB 端口。但在在此之前，请在相应的日志或记录文件上进行观察。你可能还想更换 USB\
  \ 线，看看是否能解决问题。\n\n*   **键盘映射** 如果你按下键盘上的某个键，屏幕上出现了另一个字母，那么很可能是存在键盘映射问题。修复方法取决于你使用的特定发行版。\n\
  \n*   对于基于 Red Hat 的发行版，输入不带选项的 `localectl` 将显示你当前的键映射。要查看可用键映射列表，请输入 `localectl\
  \ list-keymaps`，并将显示所有可用的键映射。此列表可能很大，因此你可能希望将 STDOUT 重定向到 `less` 实用程序进行查看。当你找到合适的键映射名称时，可以在命令行中输入\
  \ `localectl set-keymap keymap-name` 来进行永久设置。\n\n*   对于基于 Debian 的发行版，使用超级用户权限并输入\
  \ `dpkg-reconfigure keyboard-configuration` 命令。这将让你进入一个基于文本的菜单系统，你可以在其中选择合适的键盘映射。\n\
  \n*   **硬件或软件兼容性问题** 在购买任何新硬件（或软件）之前，请确保它能与你的 Linux 发行版兼容。请记住，虽然 Linux 是超级计算机的第一大内核，也是服务器世界的强有力竞争者，但它并不总是获得硬件制造商应有的关注。因此，新设备通常没有可用驱动程序，或者你可能会得到制造商编写得糟糕的设备驱动程序。咨询\
  \ Linux 社区以寻找良好的驱动程序和硬件设备建议。这将为你节省大量的麻烦和头疼问题。\n\n## 总结\n\n从应用程序目录和文件权限到过度限制的防火墙\
  \ ACL 以及错误的 SELinux 上文，有许多问题可能导致应用程序无法正常运行。此外，硬件问题如坏扇区、内存模块损坏、不稳定的 USB 线以及需要更新的设备驱动程序，都需要具备知识的故障排除者来处理。牢牢掌握本章的概念将帮助你脱颖而出。\n\
  \n## 考试要点\n\n**总结应用程序权限问题。** 当应用程序抛出与 I/O 或尝试启动另一个可执行文件相关的错误时，可能是文件或目录权限不正确。确定应用程序在哪个用户账户下运行，以及它尝试访问的任何文件及其所在的目录。获取这些信息后，收集文件所有和组成员信息。通过查看与三种权限分类（所有者、组、其他）相关的各种权限，将开始揭示核心问题。在调查中，还将目录权限和默认\
  \ ACL 包含在内。\n\n**描述存储问题。** 常见的存储问题涉及存储降级、设备和/卷缺失、挂载点缺失以及性能问题。它们可能包括存储完整性问题和/或资源耗尽。`dmesg`\
  \ 实用程序对于发现 SATA 和 SCSI 驱动器以及 HBA 问题根源至关重要。发现并修复 RAID 问题还需要使用多设备（`md`）实用程序和 `/proc/mdstat`\
  \ 文件。\n\n**解释应用程序依赖。** 使用适当的实用程序并检查应用程序版本以及可用的软件包版本，将允许你发现性能不佳的应用程序是否有可用更新。然而，更新软件软件包并不是没有问题的。软件更新可能无法正确更新包的依赖项或库，导致应用程序损坏。如果新更新需要编译，`GCC`\
  \ 的问题可能会导致复杂性。系统软件包仓库可能存在未发现的问题，导致软件更新无法进行。\n\n**详细说明限制性防火墙 ACL。** 通过网络与数据、服务或终端用户通信的应用程序可能会遇到过度限制的防火墙设置问题。收集源地址（或主机）、目标地址、采用的网络协议以及客户端和服务器端使用的入站和出站端口。使用这些基本信息，检查防火墙的各种\
  \ ACL。如果防火墙设置阻止了这些所需的访问，请在实施之前检查潜在的必要更改。\n\n**总结不常见的硬件问题。** RAM、打印机、视频设备、串口、USB\
  \ 设备和键盘可以提供许多有趣的故障排除问题。使用 `dmidecode` 和 `lshw` 实用程序以及 `dmesg`、`lspci`、`lsusb` 和\
  \ `lsdev` 命令有助于发现问题的根源。缺失或过时的模块（驱动程序）、出现故障的电缆、损坏的设备文件和错误的键映射是一些问题源头。如果你在安装之前确保硬件和软件兼容，就可以节省一些时间并从源上避免问题。\n\
  \n## 复习题\n\n你可以在 附录 A 中找到复习题的答案。\n\n1. Peter 的系统中持续运行着一个内存密集型应用程序。为了提高性能，他将旧硬盘更换为固态硬盘，而不是增加\
  \ RAM。关于这种情况，下述哪种说法最可能是真实的？\n\n    1. 用于应用程序数据的 SSD 将进入降级模式。\n    2. 用于交换区的 SSD\
  \ 将变成降级存储。\n    3. SSD 在其设备文件名中需要一个命名空间。\n    4. SSD 最终会导致卷缺失。\n    5. SSD 将经历资源耗尽。\n\
  \n2. Mary 向目前只有 IDE 驱动器的 Linux 系统添加了第一个 SCSI 磁盘。系统没有识别出新磁盘。她应该使用哪些命令来排除故障？（选择所有适用项。）\n\
  \n    1. `ls /sys/bus/scsi/drivers`\n    2. `pvscan /dev/vg00/lvol0`\n    3. `lsmod\
  \ | grep module-name`\n    4. `hdparm -B 127 device-filename`\n    5. `smartctl\
  \ -a`\n\n3. 系统管理员 Norman 运行一个 Python 程序并收到 `IO Error: [Error 13] Permission denied`\
  \ 消息。他应该收集（或知道）哪些信息来开始排除此问题？（选择所有适用项。）\n\n    1. 磁盘类型、程序所在的位置\n    2. 他的用户账户名\n\
  \    3. 触发错误的程序操作\n    4. 程序 I/O 文件的文件名和目录位置\n    5. 程序的名称\n\n4. Harry 修改了一个应用程序，以便在目录中创建一个文件并向其中写入数据。程序创建文件没有问题，但无法向其写入数据并收到了权限错误。下述哪种最可能是问题所在？\n\
  \n    1. 目录所有权\n    2. 文件所有权\n    3. 文件组成员身份\n    4. 权限继承\n    5. 可执行权限\n\n6. Ben\
  \ 使用 `sudo apt-get upgrade` 命令更新了他的 Ubuntu 系统的软件包，现在 Apache Web 服务无法正常工作了。他应该运行哪条命令？\n\
  \n    1. `sudo apt-get clean`\n    2. `sudo zypper clean -a`\n    3. `sudo ldd /usr/sbin/apache2`\n\
  \    4. `sudo rpm -aV`\n    5. `sudo apt-get check`\n\n6. Peter 编写了一个新的 C++ 应用程序，用于管理他旧的\
  \ Linux 服务器。新程序没有编程或逻辑错误。但当他尝试编译它时，它无法工作。下述哪种最可能是问题所在？\n\n\n\n\n\n1. 错误的应用权限\n2.\
  \ 错误的文件权限\n3. 缺失或过时的 GCC\n4. 缺失或过时的设备\n5. 存储库问题\n\n7. Mary 通过 `sealert` 工具确认她的应用程序无法访问文件\
  \ `flash.txt`。她接下来应该使用哪条命令？\n1. `ls -l flash.txt`\n2. `ls -Z flash.txt`\n3. `ls\
  \ -l flash.txt-directory`\n4. `setroubleshoot`\n5. `restorecon`\n8. 一个打卡应用程序使用局域网上的\
  \ NTP 服务器，但报错关于无法到达服务器的错误。目前没有网络问题。以下哪些是该问题的故障排除步骤？（选择所有适用项。）\n1. 检查 NTP 服务器上的防火墙\
  \ ACL。\n2. 检查应用服务器上的防火墙 ACL。\n3. 使用 `firewall-cmd --get-default-zone` 命令。\n4. 检查\
  \ `/etc/services` 文件中的 NTP 端口和传输协议。\n5. 查看防火墙日志条目。\n\n9. 你的系统管理员成员 Norman 告诉你位于通信端口的设备无法工作。你应该发布哪条命令来启动故障排除过程？\n\
  1. `dmesg | grep -i COM`\n2. `dmesg | grep -i ttys`\n3. `sudo setserial -a /dev/COM1`\n\
  4. `sudo setserial -a /dev/ttyS0`\n5. `cat /proc/interrupts`\n10. Harry 新的 USB 打印机无法工作。系统采用了\
  \ CUPS。以下哪些步骤可能包含在故障排除过程中？（选择所有适用项。）\n1. 执行 `less /etc/printcap` 命令。\n2. 使用 `lpinfo\
  \ -m` 命令查看可用的 USB 端口。\n3. 监控相应的日志文件并插入 USB 线。\n4. 使用 `dmesg` 和 `grep` 工具查找打印机信息。\n\
  5. 使用 `lsusb -v` 命令查看设备是否在 USB 总线上。\n\n# 第 VI 部分：系统自动化\n\n# 第 25 节：部署 Bash 脚本\n\n\
  ![](img/chaptersquare.png)\n\nLinux 系统管理员经常需要重复执行相同的任务，例如检查系统上的可用磁盘空间或创建用户帐户。与其每次都输入多个命令，你都可以编写在\
  \ shell 中运行的脚本来自动为你完成这些任务。本章将探索 Bash shell 脚本的工作原理，并演示你如何编写自己的脚本来自动化 Linux 系统上的日常活动。\n\
  \n## Shell 脚本的基础\n\nShell 脚本允许你编写小型程序来自动化你 Linux 系统上的活动。Shell 脚本通过提供快速处理数据和生成报告的灵活性为你节省时间，而手动在命令行提示符输入多个命令是非常繁琐的。你可以使用\
  \ shell 脚本自动化你在命令行中执行的几乎任何操作。\n\n接下来的章节将带你了解 shell 脚本的基础知识以及如何开始编写它们。\n\n### 执行多条命令\n\
  \n到本书为止，我一直在命令行提示符输入单个命令并向你显示结果。Linux 命令行的一个令人兴奋的特性是，可以在同一行输入多条命令，Linux 将处理所有命令。只需在输入的每条命令之间放置一个分号（`;）即可：\n\
  \n```\n$ date ; who\nThu Feb 24 19:20:06 EST 2022\nrich      :0           2022-02-24\
  \ 19:15 (:0)\n$\n```\n\nLinux Bash shell 运行第一条命令（`date`）并显示输出；然后运行第二条命令（`who`），并紧随第一条命令的输出显示该命令的输出。虽然这看起来可能很平凡，但这是\
  \ shell 脚本工作的基础。\n\n## 重定向输出\n\nShell 脚本的另一个构建模块是存储命令输出的能力。通常当你运行一个命令时，你想保存输出以备后后。为了在这，Bash\
  \ shell 提供了输出重定向。\n\n输出重定向允许我们将命令的输出从显示器重定向到另一个设备（例如文件）。当你需要记录下班后运行的 shell 脚本的数据时，此功能非常有用，这样你就可以查看\
  \ shell 脚本运行时做了什么。\n\n要重定向命令的输出，你可以在命令后使用大于号（`>`），然后指定要用于捕获重定向输出的文件名。这在[列表 25.1]中所示。\n\
  \n[列表 25.1] 显示的示例将 `date` 命令的输出重定向到名为 `today.txt` 的文件。注意，当你重定向命令的输出时，显示器输出上不会显示任何内容。输出中的所有文本现在都在文件中，如使用\
  \ `cat` 命令显示文件内容所示。\n\n大于号输出重定向运算符会自动为输出创建一个新文件，即使该文件已经存在。如果你愿意，可以使用双大于号（`>>`）将输出追加到现有文件中，如[列表\
  \ 25.2]所示。\n\n`today.txt` 文件现在包含了在[列表 25.1]中原始 `date` 命令的输出，以及在[列表 25.2]中运行的 `who`\
  \ 命令的输出。\n\n输出重定向是 shell 脚本中的一个重要特性。通过它，我们可以从脚本生成日志文件，让我们在脚本于 Linux 系统后台模式运行时有机会跟踪相关情况。\n\
  \n### 管道数据\n\n虽然输出重定向允许我们将命令输出重定向到文件，但管道（piping）允许我们将输出重定向到另一个命令。第二条命令使用第一条命令的重定向输出作为输入数据。在运行处理数据的命令（例如\
  \ `sort` 命令）时，此功能非常有用。\n\n管道符号是竖线（`|`），它通常出现在美国键盘上反斜杠键上方。[列表 25.3]显示了使用管道的示例。\n\n\
  来自 `ls` 命令的输出直接作为输入发送到 `sort` 命令，但这是在背后。你看不到 `ls` 命令的输出；你只能看到管道线最后一条命令的输出，在这种情况下是\
  \ `sort` 命令。通过管道连接的命令数量没有限制。\n\n### Shell 脚本格式\n\n通过分号或管道将多条命令放在单行上是处理数据的好方法，但可能仍然很乏味。每当运行这组命令时，都需要在命令行提示符输入所有命令。\n\
  \n然而，Linux 允许我们将多条命令放在文本文件中，然后从命令行作为程序运行该文件。这被称为 shell 脚本，因为我们正在为 Linux shell 编写脚本。\n\
  \nShell 脚本文件是纯文本文件。要创建一个 shell 脚本文件，只需使用任何你熟悉的文本编辑器。如果你在基于 KDE 的图形桌面上工作，可以使用 KWrite\
  \ 程序；如果你在基于 GNOME 的图形桌面上工作，可以使用 GEdit 程序。\n\n如果你直接在命令行环境中工作，你仍然会有一些选择。许多 Linux 发行版包含了\
  \ `pico` 或 `nano` 编辑器，通过使用 ASCII 控制字符创建全屏编辑窗口来提供图形编辑器环境。\n\n如果你的 Linux 发行版没有包含 `pico`\
  \ 或 `nano` 编辑器，还有最后的最后手段：`vi` 编辑器。`vi` 编辑器是一个使用简单单字母命令的文本编辑器。它是 Linux 环境中最古老的文本编辑器，可以追溯到\
  \ Unix 的早期时代，这可能是它不是特别优雅或用户友好的原因之一。\n\n\n\n\n\n一旦你选择了文本编辑器，就可以创建你的 shell 脚本（shell\
  \ scripts）了。首先，为了让你的 shell 脚本运行，你需要遵循 shell 脚本文件的特定格式。文件的第一行通常指定运行该脚本所需的 Linux shell。这种写法的格式有点奇怪：\n\
  \n```\n #!/bin/bash\n```\n\nLinux 世界将井号符号和感叹号符号的组合（`#!`）称为 `shebang`。它告诉操作系统使用哪种\
  \ shell 来运行该 shell 脚本。大多数 Linux 发行版都支持多个 Linux shell，但最常见的是 `Bash` shell。只要你的 Linux\
  \ 发行版上安装了其他 shell，你就可以运行为这些 shell 编写的 shell 脚本。\n\n指定好 shell 后，你就可以开始在脚本中列出命令了。你不需要将所有命令写在同一行；Linux\
  \ 允许你将它们放在不同的行上。此外，Linux shell 假设每一行都是 shell 脚本中的一条新命令，因此你不需要使用分号来分隔命令。列出 25.4 显示了一个简单的\
  \ shell 脚本文件示例。\n\nListing 25.4 中显示的 `test1.sh` 脚本文件以 shebang 行开头，其标识了 Linux 中的标准\
  \ shell `Bash`。Listing 25.4 所示代码的第二行演示了 shell 脚本的另一个功能。以井号开头的行被称为 `comment lines`（注释行）。它们允许你将注释嵌入\
  \ shell 脚本程序中，帮助你记住代码的作用。shell 在处理 shell 脚本时会跳过注释行。你可以在 shell 脚本文件中开头的 shebang 行之后的任何地方放置注释行。\n\
  \n## 运行 shell 脚本\n\n如果你直接在命令行提示符输入 shell 脚本文件来运行它，你可能会有些失望：\n\n```\n $ test1.sh\n\
  test1.sh: command not found\n$\n```\n\n遗憾的是，shell 不知道在虚拟目录哪里寻找 `test1.sh` 命令。原因是\
  \ shell 使用了一个名为 `PATH` 的特殊环境变量来列出它查找命令的目录。如果你的本地 `HOME` 文件夹没有包含在 `PATH` 环境变量目录列表中，你就无法直接运行\
  \ shell 脚本文件。相反，你需要使用相对路径或绝对路径来指向 shell 脚本文件。最简单的方法是为文件添加 `./` 相对路径快捷键：\n\n```\n\
  \ $ ./test1.sh\nbash: ./test1.sh: Permission denied\n$\n```\n\n现在 shell 可以找到程序文件了，但仍然有一个错误信息。这次的错误告诉我们没有运行该\
  \ shell 脚本文件的权限。使用带有 `-l` 选项的 `ls` 命令查看 shell 脚本文件可以看到可以看到文件的权限：\n\n```\n $ ls -l\
  \ test1.sh\n-rw-r--r-- 1 rich rich 73 Feb 24 19:37 test1.sh\n$\n```\n\n默认情况下，Linux\
  \ 系统没有赋予任何人执行文件的权限。你可以使用 `chmod` 命令为文件所有添加该权限：\n\n```\n $ chmod u+x test1.sh\n$ ls\
  \ -l test1.sh\n-rwxr--r-- 1 rich rich 73 Feb 24 19:37 test1.sh\n$\n```\n\n`u+x`\
  \ 选项为文件所有者添加执行权限。你现在应该能够运行 shell 脚本文件并看到输出了：\n\n```\n $ ./test1.sh\nThu Feb 24 19:48:27 EST 2022\n\
  rich       :0       2022-02-24 19:15 (:0)\n$\n```\n\n现在你已经了解了脚本的基础，后续章节将深入探讨你可以添加的一些高级功能，让\
  \ shell 脚本更加丰富。\n\n## 高级 shell 脚本编写\n\n上一节介绍了如何在 shell 脚本文件中将普通的命令行命令组合在一起并在 Linux\
  \ shell 中运行的基础知识。我将通过展示 shell 脚本中提供的更多功能来补充这一点，使它们看起来和运行起来更像真正的程序。\n\n### 显示消息\n\
  \n当你在 shell 脚本文件中组合命令时，输出看起来可能会有些混乱。如果能够自定义输出，通过在每个列出的命令输出之间进行分离并添加我们自己的文本将会有帮助。\n\
  \n`echo` 命令允许你从命令行显示文本消息。在命令行中使用时，它并不太有趣：\n\n```\n $ echo This is a test\nThis is a test\n\
  $\n```\n\n但现在你有了在 shell 脚本文件输出的任何地方插入消息的能力。Listing 25.5 演示了如何实现这一点。\n\nListing 25.5\
  \ 所示的 shell 脚本为 `test1.sh` 脚本添加了三个 `echo` 命令。注意第一个 `echo` 命令没有使用任何引号，但第三个使用了。这是因为第三个\
  \ `echo` 命令的文本输出包含单引号。单引号也是 shell 中的一个元字符，它会混淆 `echo` 命令，因此你需要在文本周围加上双引号。另外注意第二个\
  \ `echo` 命令所在的行上没有任何文本。它会输出一个空行，这在你想要分隔多个命令的输出时非常有用。\n\n### 使用变量\n\n编程的一部分是能够临时存储数据以便稍后在程序。你通过使用\
  \ `variables`（变量）来实现这一点。\n\n变量允许你在内存中留出位置临时存储信息，然后在脚本后面通过引用变量名重新调用这些信息。\n\nLinux\
  \ shell 提供两种变量。接下来的章节将解释如何在你的 shell 脚本中使用这两种类型。\n\n#### 环境变量\n\n`Environment variables`（环境变量）跟踪特定的系统信息，例如系统名称、登录\
  \ shell 的用户名、用户的用户 ID (`UID`)、用户的默认主目录以及 shell 用于查找可执行程序的搜索路径。你可以使用 `set` 命令显示 shell\
  \ 中可用的活动环境变量的完整列表，如 Listing 25.6 所示。\n\n有某些环境变量可以跟踪命令行 shell 的几乎每一个特性。你可以通过在环境变量名称前加上美元符号，从脚本内部调用这些环境变量，如\
  \ Listing 25.7 所示。\n\n`$USER`、`$UID` 和 `$HOME` 环境变量通常用于显示登录用户的信息。如果你运行 Listing 25.7\
  \ 所示的 `test2.sh` shell 脚本，输出应该如下：\n\n```\n $ chmod u+x test2.sh\n$ ./test2.sh\n\
  User info for userid: rich\nUID: 1000\nHOME: /home/rich\n$\n```\n\n你看到的值应该与你的用户账户有关。这允许你动态地获取运行你的\
  \ shell 脚本的用户账户信息来自定义输出。\n\n#### 用户变量\n\n`User variables`（用户变量）允许你在 shell 脚本中存储自己的数据。你使用等号给用户变量赋值。在变量名、等号和值之间不能出现空格。这里有几个示例：\n\
  \n```\nvar1=10\nvar2=23.45\nvar3=testing\nvar4=\"Still more testing\"\n```\n\nshell\
  \ 脚本会自动确定用于变量值的数据类型。在 shell 脚本内部定义的变量被称为 `local variables`（局部变量），只能从 shell 脚本内部访问。`Global\
  \ variables`（全局变量）定义在 shell 脚本外部的主 shell 层，并被脚本 shell 环境继承。\n\n就像环境变量一样，你可以使用美元符号引用用户变量。Listing\
  \ 25.8 显示了一个使用用户变量的 shell 脚本示例。\n\n运行 Listing 25.8 中的 `test3.sh` 脚本产生以下输出：\n\n```\n\
  \ $ chmod u+x test3.sh\n$ ./test3.sh\nKatie checked in 10 days ago\n$\n```\n\n\n\
  \n\n当你将数据存储在用户变量中后，你可以在 shell 脚本的任何地方引用它！\n\n## 命令行参数\n\nshell 脚本最多功能的特性之一是在运行脚本时将数据传递给脚本的能力。这允许你在每次运行脚本时都使用新数据对脚本进行自定义。\n\
  \n将数据传递到 shell 脚本的一种方法是使用`命令行参数`（command-line arguments）。命令行参数是你在运行命令时包含在命令行中的数据。只需在命令后开始列出这些参数，并用空格将每个数据值隔开，格式如下：\n\
  \n```\n command argument1 argument2 ...\n```\n\n你可以在 shell 脚本代码中通过特殊的数字型`位置变量`（positional\
  \ variables）来获取这些值。使用变量 `$1` 获取第一个命令行参数，使用 `$2` 获取第二个参数，依此类推。列表 25.9 显示了如何在你的 shell\
  \ 脚本中使用位置变量。\n\n`test4.sh` shell 脚本使用了两个命令行参数。`$1` 变量存储人的姓名，`$2` 变量存储他们签到之前的天数。当你运行\
  \ `test4.sh` 脚本时，请确保在命令行中包含这两个数据值。如果位置变量不存在，shell 不产生错误信息；你只是不会得到预期的结果：\n\n```\n\
  \ $ ./test4.sh rich\nrich checked in days ago\n$\n```\n\n在你的程序代码中检查位置变量是否存在取决于你。我将在稍后讨论逻辑语句（logic\
  \ statements）时探讨如何做到这一点。\n\n## 退出状态\n\n当 shell 脚本结束时，它会向启动它的父级 shell 返回一个`退出状态`（exit\
  \ status）。退出状态告诉我们 shell 脚本是否成功完成。\n\nLinux 为我们提供了特殊的 `$?` 变量，它存储了上一次执行命令的退出状态值。要检查命令的退出状态，你必须在命令结束后立即查看\
  \ `$?` 变量。它会根据 shell 执行的最后一个命令的退出状态而改变值：\n\n```\n $ who\nrich      :0          \
  \   2019-02-20  23:16 (:0)\n$ echo $?\n0\n$\n```\n\n按照惯例，成功完成的命令退出状态为 0。如果命令带错误完成，则会出现一个正整数值作为退出状态。\n\
  \n你可以通过使用 `exit` 命令更改 shell 脚本的退出状态。只需在 `exit` 命令中指定你想要的退出状态值即可：\n\n```\n $ /bin/bash\n\
  $ exit 120\nexit\n$ echo $?\n120\n$\n```\n\n在这个示例中，我通过 `/bin/bash` 命令启动了一个新的子 shell，然后使用\
  \ `exit` 命令以 120 的退出状态码退出子 shell。在回到父级 shell 之后，我随后显示了 `$?` 变量的值，以查看它是否与我在 `exit`\
  \ 命令中设置的相同。随着你编写越来越复杂的脚本，你可以通过更改退出状态值来指示错误。这样一来，通过检查退出状态，你可以轻松地调试你的 shell 脚本。\n\n\
  ## 编写脚本程序\n\n到目前为止，我已经探索了如何在 shell 脚本中组合普通的命令行命令，以自动化你作为系统管理员可能执行的常见任务。但 shell 脚本允许我们做的远不止于此。Bash\
  \ shell 提供了更多像编程一样的命令，允许我们在 shell 脚本中编写全功能完备的程序，例如捕获命令输出、执行数学运算、检查变量和文件条件以及循环执行命令。本节将带你了解\
  \ Bash shell 提供的一些高级编程功能。\n\n### 命令替换（Command Substitution）\n\nshell 脚本最有用的功能之一可能是存储和处理数据的能力。到目前为止，我讨论了如何使用输出重定向将命令的输出存储到文件中，以及使用管道将命令的输出重定向到另一个命令。然而，还有另一种技术：命令替换（command\
  \ substitution）允许你将命令的输出赋值给变量。这种技术非常强大，你可以通过使用反引号（`` ` ``）或 `$(...)` 语法执行命令并获取其结果。\n\
  \n```bash\noutput=$(date)\necho $output\n```\n\n在上面的示例中，`date` 命令的输出被赋值给变量 `output`。在现代\
  \ Bash 中，更推荐使用反引号形式的 `$(...)` 语法，因为它更易读且支持嵌套。\n\n另一个例子是使用命令替换来获取当前目录下的文件列表：\n\n\
  ```bash\nfiles=$(ls)\necho $files $files\n```\n\n命令替换还可以用于将一个命令的输出作为另一个命令的输入。例如，你可以使用命令替换来过滤文件列表：\n\
  \n```bash\ncount=$(txt *.txt | wc -l)\necho \"There are $count text files.\"\n```\n\
  \n通过命令替换，shell 脚本可以变得更加灵活和强大，能够处理复杂的数据流。\n\n\n\n\n\n逻辑语句允许我们测试特定条件，并根据条件评估为逻辑真（True）还是假（False）跳转到代码的不同部分。因此，逻辑语句通常称为\
  \ `conditionals`（条件语句）。在 Bash 脚本中有几种不同的实现逻辑语句的方法。\n\n## `if` 语句\n\n最基本的逻辑语句是 `if\
  \ condition statement`。`if` 条件语句的格式如下：\n\n```\n if [ condition ]\nthen\n  commands\n\
  fi\n```\n\n如果你指定的 `condition` 评估为逻辑真值，shell 将运行 `then` 部分的命令。如果 `condition` 评估为逻辑假值，shell\
  \ 脚本将跳过 `then` 部分的命令。\n\n条件表达式通常被称为 `comparison`（比较），因为它比较了两个值。在 Bash Shell 编程中，比较有许多不同的格式。它针对数值值、字符串值、布尔逻辑值，甚至是文件和目录提供了内置测试。表\
  \ 25.1 列出了可用的不同内置测试。\n\n| 测试 | 类型 | 描述 |\n| --- | --- | --- |\n| `n1 -eq n2` | Numeric\
  \ | 检查 `n1` 是否等于 `n2` |\n| `n1 -ge n2` | Numeric | 检查 `n1` 是否大于或等于 `n2` |\n| `n1\
  \ -gt n2` | Numeric | 检查 `n1` 是否大于 `n2` |\n| `n1 -le n2` | Numeric | 检查 `n1` 是否小于或等于\
  \ `n2` |\n| `n1 -lt n2` | Numeric | 检查 `n1` 是否小于 `n2` |\n| `n1 -ne n2` | Numeric\
  \ | 检查 `n1` 是否不等于 `n2` |\n| `str1 = str2` | String | 检查 `str1` 是否与 `str2` 相同 |\n\
  | `str1 != str2` | String | 检查 `str1` 是否与 `str2` 不同 |\n| `str1 < str2` | String\
  \ | 检查 `str1` 是否小于 `str2` |\n| `str1 > str2` | String | 检查 `str1` 是否大于 `str2` |\n\
  | `-n str1` | String | 检查 `str1` 长度大于 0 |\n| `-z str1` | String | 检查 `str1` 长度为\
  \ 0 |\n| `-d file` | File | 检查 `file` 是否存在且是一个目录 |\n| `-e file` | File | 检查 `file`\
  \ 是否存在 |\n| `-f file` | File | 检查 `file` 是否存在且是一个文件 |\n| `-r file` | File | 检查 `file`\
  \ 是否存在且可读 |\n| `-s file` | File | 检查 `file` 是否存在且不为空 |\n| `-w file` | File | 检查\
  \ `file` 是否存在且可写 |\n| `-x file` | File | 检查 `file` 是否存在且可执行 |\n| `-O file` | File\
  \ | 检查 `file` 是否存在且由当前用户所有 |\n| `-G file` | File | 检查 `file` 是否存在且默认组与当前用户相同 |\n\
  | `file1 -nt file2` | File | 检查 `file1` 是否比 `file2` 新 |\n| `file1 -ot file2` | File\
  \ | 检查 `file1` 是否比 `file2` 旧 |\n\n表 25.1 条件测试\n\n列表 25.11 显示了在 shell 脚本中使用 `if-then`\
  \ 条件语句的示例。\n\n列表 25.11 所示的 `test5.sh` 脚本评估了作为命令行参数输入的两个值：\n\n```\n $ chmod u+x test5.sh\n\
  $ ./test5.sh 10 5\nThe first value is greater than the second\n$\n```\n\n只有 `if`\
  \ 语句中评估为逻辑真值的命令被 shell 脚本处理了。\n\n## `case` 语句\n\n你经常发现自己正尝试评估变量的值，在一组可能的值中寻找特定的值，这类似于我在列表\
  \ 25.11 中演示的。与其与其编写多个 `if` 语句来测试所有可能的条件，你可以使用 `case` 语句。\n\n`case` 语句允许你以列表形式格式检查单个变量的多个值：\n\
  \n```\n case variable in\npattern1) commands1;;\npattern2 | pattern3) commands2;;\n\
  *) default commands;;\nesac\n```\n\n`case` 语句将指定的变量与不同的模式进行比较。如果变量匹配模式，shell 将执行为该模式指定的命令。你可以在同一行中列出多个模式，使用竖线操作符分隔每个模式。星号\
  \ `*` 是不匹配任何列出模式的值的通符。列表 25.12 显示了使用 `case` 语句的示例。\n\n`case` 语句为每个可能的变量值指定各种选项提供了一种更整洁的方法。在列表\
  \ 25.12 所示的示例中，它检查特定的用户账户以输出特定的消息。如果运行脚本的用户不是这些账户之一，它会显示另一个消息。\n\n## 循环\n\n当你编写脚本时，经常会遇到需要重复执行相同命令多次的情况，例如对目录中的所有文件执行某个命令。Bash\
  \ Shell 提供了一些基本的循环命令来满足这一需求。\n\n### `for` 循环\n\n`for` 语句遍历序列中的每一个元素，例如目录中的文件或文本文档中的行。`for`\
  \ 命令的格式如下：\n\n```\n for variable in series ; do\n  commands\ndone\n```\n\n`variable`\
  \ 变成占位符，获取序列中每个元素的值。列表 25.13 显示了如何使用 `for` 循环遍历所有文件。\n\n如果你运行 `test7.sh` 脚本，你应该应该看到文件列表：\n\
  \n```\n $ ./test7.sh\nDesktop is a directory\nDocuments is a directory\nDownloads\
  \ is a directory\nMusic is a directory\nPublic is a directory\nTemplates is a directory\n\
  Videos is a directory\ntest1.sh is a file\ntest2.sh is a file\ntest3.sh is a file\n\
  test4.sh is a file\ntest5.sh is a file\ntest6.sh is a file\ntest7.sh is a file\n\
  today.txt is a file\n$\n```\n\n### `while` 循环\n\n另一个用的循环语句是 `while` 命令。它的格式如下：\n\
  \n```\n while [ condition ] ; do\n  commands\ndone\n```\n\n`while` 循环只要条件评估为逻辑真值就会持续循环。当条件评估为逻辑假值时，循环停止。`while`\
  \ 循环使用的条件与 `if` 语句相同，因此你可以测试数字、字符串和文件。列表 25.14 演示了使用 `while` 循环计算数字的阶乘。\n\nshell\
  \ 脚本获取传递给脚本的第一个参数并将其用于 `while` 循环。只要 `number` 变量存储的值大于 0，`while` 循环就会继续。在每次循环迭代中，该值都会减\
  \ 1，因此在某一点 `while` 条件会变为假。当这种情况发生时，`factorial` 变量包含最终计算结果。当你运行 `test8.sh` 程序时，你应该得到以下结果：\n\
  \n```\n $ ./test8.sh 5\nThe factorial of 5 is 120\n$ ./test8.sh 6\nThe factorial\
  \ of 6 is 720\n$\n```\n\n\n\n\n也许 shell 脚本最强大的用途之一就是快速方便地处理大量数据。第 4 章“搜索与分析文本”介绍了许多实用的命令行工具，用于在文本文件中查找和处理文本；然而，在\
  \ shell 脚本中使用这些工具会让它们的效果产生质的跃。\n\nShell 脚本允许你逐行处理大量数据文件、搜索特定数据，甚至仅需几条简单命令即可替换特定数据。你触手可及的常用命令行功能包括：\n\
  \n*   **通配符匹配（Globbing）：** 通配符允许你在脚本中使用通配符字符来搜索多个文件和目录。\n*   **参数扩展（Parameter expansion）：**\
  \ 通过在变量名周围加上大括号（例如 `${test}`），你可以使用参数扩展，这允许你根据偏移和长度从变量中指定子字符串值。\n*   **Read：** `read`\
  \ 工具允许你逐行读取文本文件，以便使用标准文本处理工具进行处理。\n*   **正则表达式（Regular expressions）：** 使用正则表达式允许你在文件中查找并替换特定的字符串。\n\
  \n## 创建函数\n\n你经常会发现自己在脚本的多个位置使用相同的代码。除了标准的内置函数外，Bash shell 允许你创建用户定义函数，允许你将代码封装到函数中，并在脚本中按需要多次使用。\n\
  \n要定义函数，你只需要为其分配一个唯一的名称，然后定义函数包含的代码。这有两种格式。第一种格式使用关键字 `function` 来定义函数名，如下所示：\n\n\
  ```\nfunction name {\n    commands\n}\n```\n\n第二种格式更贴近其他编程语言中函数的定义方式：\n\n```\nname()\
  \ {\n    commands\n}\n```\n\n`name` 属性定义了分配函数的唯一名称。`commands` 是组成函数的一个或多个 Bash shell\
  \ 命令。\n\n大多数编程语言也允许你向函数传递值并从函数返回值给主程序。你同样可以在 Bash shell 函数中这样做。\n\n要从函数返回值，你需要在函数末尾使用\
  \ `echo` 语句显示你想要返回的值，然后使用命令替换在主程序的变量中捕获该值：\n\n```\nvalue1=$(func1)\n```\n\n要向函数传递值，你可以在命令替换内部使用命令行参数：\n\
  \n```\nvalue1=$(func1 10)\n```\n\n列表 25.15 展示了将阶阶计算从列表 25.14 移动到函数，然后在同一脚本中多次使用的示例。\n\
  \n列表 25.15 显示一旦你定义了 `factor()` 函数，就可以在脚本中根据需要频繁使用它。运行 `test9.sh` 脚本应该产生以下结果：\n\n\
  ```\n$ ./test9.sh\nThe factorial of 5 is 120\nThe factorial of 6 is 720\n$\n```\n\
  \nBash shell 脚本可以通过自动化常见的管理活动来节省大量工作。练习 25.1 演示了编写一个 Bash shell 脚本来提取 Linux 系统上所有用户的密码信息。\n\
  \n## 总结\n\n基础 shell 脚本允许我们组合多个命令并将其作为单个命令运行。你可以使用输出重定向将命令的输出重定向到文件中，以便稍后读取；或者使用管道（piping）将一个命令的输出重定向作为另一个命令的输入数据。\n\
  \n当你将多个命令添加到文本文件中运行时，你必须以 shebang 行（`#!`）开头，该行指定了要使用的 Linux shell。你还需要使用 `chmod`\
  \ 命令配合 `u+x` 选项赋予自己运行该文件的执行权限。你可能还需要从命令行运行文件时指定文件的完整路径，或者修改系统上的 `PATH` 环境变量，以便 shell\
  \ 能够找到你的 shell 脚本文件。\n\nBash shell 提供了额外的功能，你可以将其添加到 shell 脚本文件中，使它们看起来更像真实的程序。`echo`\
  \ 语句允许你在脚本命令输出之间插入文本输出，以帮助修改脚本产生的输出。shell 还提供了环境变量和用户变量，你可以在 shell 脚本内部访问它们。环境变量允许你检索有关脚本运行的\
  \ shell 环境的信息，例如哪个用户账户启动了 shell 以及该账户的信息。用户变量允许你在脚本内部存储和检索数据，使其行为得更像一个真实的程序。\n\n\
  Bash shell 还提供了你可以在 shell 脚本中使用的高级编程功能。命令替换允许你将命令的输出捕获到变量中，以便你可以在 shell 脚本中从命令输出中提取信息。Bash\
  \ shell 支持基本的整数运算，但在处理浮点数方面并不擅长。你需要其他程序（如 `bc` 计算器）的帮助来完成。\n\n最后，Bash shell 支持一些标准的编程功能，如\
  \ `if` 和 `case` 逻辑语句，允许你针对特定条件测试数字、字符串文件，并根据结果运行命令。它还支持 `for` 和 `while` 循环，允许你遍历数据组，在一组命令中处理集合中的每个元素。这些功能可以帮助你的\
  \ Bash shell 脚本运行得像真实程序一样。\n\n## 考试要点\n\n**描述如何在 shell 脚本将多个命令行命令连接在一起。** Bash shell\
  \ 允许我们将多个命令顺序放置在文件中，并在从命令行运行该文件时，它将依次处理每个命令。每个命令的输出将出现在命令行输出中。\n\n**解释如何在 Bash shell\
  \ 脚本中处理数据。** Bash shell 提供了两种在命令中处理数据的方法。输出重定向允许将命令的输出重定向到文本文件，你或另一个命令稍后读取。管道允许你将一个命令的输出重定向作为另一个命令的输入数据。当你运行\
  \ shell 脚本时，输出永远不会显示在显示器上；数据传输在后台进行。\n\n**解释从 shell 脚本内部可以访问的数据类型。** Bash shell\
  \ 提供了对环境变量的访问，其中包含了脚本所在的 shell 环境的信息。你可以获取有关系统的信息以及运行 shell 脚本的用户账户的信息。shell 脚本还可以访问位置变量（positional\
  \ variables），这允许你在运行 shell 脚本时从命令行将数据传递给该脚本。\n\n**描述在 shell 脚本中使用另一个命令之前，如何对命令的输出数据进行处理。**\
  \ 命令替换允许你将命令的输出重定向到 shell 脚本中的用户变量。然后你可以使用标准的 Linux 文本处理命令对数据进行处理，例如进行排序或从中提取数据记录，然后再将变量数据重定向到另一个命令。\n\
  \n**描述 Bash shell 如何执行数学运算。** Bash shell 使用 `$[]` 符号定义要处理的数学方程。Bash shell 只能执行整数运算，因此这种能力相当有限。\n\
  \n\n\n\n# 解释在 Bash 壳脚本中实现逻辑的不同方法。\n\nBash 壳支持 `if` 语句和 `case` 语句。它们都允许你对数值值、字符串值或文件进行测试，然后根据测试结果运行一个命令块。\n\
