  \ Bar)**：此窗口区域包含常用的图标，通常频率更高。你可以根据需要删除或添加这些图标。某些桌面环境会在你使用系统时自动更新栏，以反映你经常使用的图标。\n\
  - **启动 (Launch)**：此程序（类）允许你搜索应用程序和文件。它还允许对搜索结果执行某些操作，例如启动或打开。\n- **菜单 (Menus)**：这些窗口区域通常通过图标访问。它们包含文件和/或程序列表，以及额外的文件和/或程序选择的子列表。\n\
  - **面板 (Panels)**：面板是细窄且通常呈矩形的区域，位于桌面环境主窗口的最顶部或底部。它们也可以位于桌面的最左侧或右侧。它们通常包含通知、系统日期和/或时间、程序图标等。\n\
  - **系统托盘 (System Tray)**：系统托盘是一个特殊的菜单，通常位于面板。它提供了程序访问，允许用户注销、锁定屏幕、管理音频设置、查看通知、关机或重启系统等。\n\
  - **小组件 (Widgets)**：小组件分为应用程序 (applets)、屏幕组件 (screenlets)、桌面组件 (desklets) 等。它们是为用户在桌面提供信息或功能的程序。例如，当前的体育新闻可以持续显示在屏幕组件上。另一个例子是便签应用程序，它允许用户在桌面上放置看起来像便签的图形窗口并向其中添加内容。\n\
  - **窗口管理器 (Window Manager)**：这些客户端程序决定了窗口（也称为 `frames`）在桌面上的呈现方式。这些程序控制如窗口的大小和外观等项目。此外，它们还管理额外窗口如何放置，例如是并排放置还是重叠。\n\
  \n许多 Linux 用户对他们使用的桌面环境充满热情，这很有道理。这里有几个非常优秀的环境供你选择。我将在接下来的章节中介绍其中几个桌面环境，并查看它们的通用辅助功能性。\n\
  \n## 了解 GNOME\n\nGNOME 桌面环境创建于 20 世纪 90 年代后期，非常流行，并在 `CentOS` 和 `Ubuntu` 等 Linux\
  \ 发行版中默认提供。目前由一个属于 `GNOME` 的大型志愿者小组进行维护。有关关于 `GNOME` 项目的更多信息，请访问 `www.gnome.org`。\n\
  \nGNOME 2 是一种更传统的桌面用户界面，当 GNOME 3（现在正式称为 `GNOME Shell`）于 2011 年发布时，由于其非传统的界面，许多用户的反应非常强烈。这促成了几个\
  \ `GNOME` 项目的分叉。然而，随着时间的推移和几次改进，`GNOME Shell` 赢得了地位。对于那些仍然喜欢传统 `GNOME` 2 环境的用户，可以使用\
  \ `GNOME Classic` 桌面。\n\n图 8.1 显示了 `Ubuntu` `24.04` 发行版上的 GNOME Shell 桌面环境。\n\n\
  ![带有工具栏和皇冠背景的深色主题桌面界面截图。](img/c08f001.png)\n\n图 8.1 GNOME Shell 桌面环境\n\n在 图 8.1\
  \ 中，注意框架顶部的面板，包含时钟和右侧的系统托盘。面板左上角的“活动 (Activities)”按钮允许你在窗口之间切换并提供搜索栏。UI 框架左侧的收藏栏显示了各种应用程序图标以及\
  \ `Ubuntu` 图标，即 `Apps` 按钮。`Apps` 按钮显示各种应用程序图标，允许你快速访问所需的程序。\n\n理解图形界面的最好方法是亲自尝试桌面环境。然而，为了帮助你记住组成这些不同桌面的各种组件，我提供了表格。GNOME\
  \ Shell 的某些各种组件在 表 8.1 中进行了简要描述。\n\n| 名称 | 程序名称和/或描述 |\n| --- | --- |\n| 显示器管理器\
  \ | GNOME 显示管理器 (`GDM`) |\n| 文件管理器 | GNOME Files（有时直接称为 Files）。以前称为 `Nautilus` |\n\
  | 收藏栏 | GNOME Shell Dash（有时称为 `Dock`） |\n| 面板 | 位于 GNOME Shell 框架顶部的单个面板 |\n| 系统托盘\
  \ | 位于单个面板的右侧 |\n| 窗口管理器 | Mutter |\n\n表 8.1 GNOME shell 桌面环境默认组件\n\nGNOME Shell\
  \ 的一个有趣特性是，包含系统托盘的面板在显示管理器中以及 GNOME Shell 内部都是可用的。\n\n## 探测 KDE Plasma\n\nKool 桌面环境\
  \ (`KDE`) 起于 1996 年，第一个版本于 1998 年发布。随着时间的推移，`KDE` 名字不再仅仅指桌面环境，而是指的是该项目的组织以及支持它的强大社区。KDE\
  \ 除了其著名的桌面环境外还有许多额外的软件项目。因此在 2009 年，KDE 的桌面环境被重命名为 `KDE Plasma`。有关 `KDE` 组的更多信息，请访问\
  \ `www.kde.org`。\n\n图 8.2 显示了 `openSUSE` `LEAP` 发行版上的 KDE Plasma 桌面环境。\n\n![电脑桌面截图，包含垃圾和主页图标、Leap\
  \ Logo 以及显示时间和日期的任务栏。](img/c08f002.png)\n\n图 8.2 KDE Plasma 桌面环境\n\n在 图 8.2 中，面板位于主\
  \ UI 框架的底部。这是旧版系统中使用的更传统的面板位置，这也是 KDE Plasma 被认为是 Linux 新手良好桌面环境的原因之一。在该面板上，包含通知、时间和各种其他\
  \ `plasmoids`（小组件）的系统托盘位于面板的右侧。应用程序菜单是各种程序的启动器，并包含收藏栏，位于面板的最左侧。表 8.2 简要描述了 KDE Plasma\
  \ 的某些组件。\n\n| 名称 | 程序名称和/或描述 |\n| --- | --- |\n| 显示器管理器 | `SDDM` (Simple Desktop\
  \ Manager) |\n| 文件管理器 | `Dolphin` |\n| 收藏栏 | 显示在应用程序菜单内部 |\n| 面板 | 位于 Plasma 框架底部的单个面板\
  \ |\n| 系统托盘 | 位于单个面板的右侧 |\n| 小组件 | 称为 `plasmoids` |\n| 窗口管理器 | `Kwin` |\n\n表 8.2\
  \ KDE Plasma 桌面环境默认组件\n\n为了帮助那些通过文件夹图标访问文件的用户，KDE Plasma 提供了文件夹视图。在 图 8.2 中，`openSUSE`\
  \ `Leap` 发行版的默认 UI 中显示文件夹。主桌面窗口上的这些图标允许你启动 `Dolphin` 文件管理器并直接跳转到文件夹图标上命名的目录。\n\n\
  ## 设置辅助功能\n\n在 GUI 环境中，辅助功能涉及用户使用桌面环境的能力。虽然 Linux 发行版提供的默认桌面环境适用于许多人，但辅助功能设置考虑了所有潜在用户。这包括可能有视觉障碍、使用鼠标困难、手指运动问题等的人士。了解与这些便利措施相关的桌面环境配置很重要，以便你帮助为所有人提供访问。\n\
  \n每个桌面环境将提供略有不同的配置辅助功能的方法。但大多数设置可以通过桌面环境控制面板完成，例如 GNOME Shell 设置中的通用访问（Universal\
  \ Access）面板。\n\n图 8.3 显示从 `Ubuntu` 登录窗口打开的通用访问菜单。你可以通过在 GNOME Shell 的搜索功能中搜索“universal\
  \ access”，在访问控制面板找到更多辅助功能设置。\n\n\n\n\n\n![桌面截图显示了通过 Tiger VNC Viewer 访问的 CentOS\
  \ 7，显示了首页和垃圾桶图标。](img/c08f005.png)\n\n图 8.3 GNOME Shell 中的通用访问顶栏菜单\n\n对于视力严重 way\
  \ 或视力不佳的用户，某些辅助功能设置可能会有所帮助。表 8.3 描述了更常见的视觉障碍设置。\n\n| 名称 | 描述 |\n| --- | --- |\n\
  | 光标闪烁 | 修改光标闪烁频率，以便更容易在屏幕上定位光标。 |\n| 光标大小 | 修改光标大小。 |\n| 高对比度 | 增加窗口和按钮的亮度，并加深窗口边缘以及文本和光标的颜色。\
  \ |\n| 大字体 | 修改字体大小。 |\n| 屏幕阅读器 | 使用屏幕阅读器朗读 UI。流行的选择包括 Orca 屏幕阅读器和 Emacspeak。 |\n\
  | 提示音 | 在开启或关闭大写锁定（Caps Lock）或数字锁定（Num Lock）时发出嘟声。也称为 `toggle keys`。 |\n| 缩放 | 将屏幕或屏幕部分放大到不同的倍率。\
  \ |\n\n表 8.3 常见的视觉障碍辅助功能设置\n\n如果盲人用户可以使用盲文显示器，你可以安装 `brltty` 包，该包在大多数 Linux 发行版的仓库中可用。BRLTTY\
  \ 作为 Linux 守护进程运行，并通过盲文显示器提供控制台（文本模式）访问。你可以在其官方网站 `http://mielke.cc/brltty` 更多信息。注意，你也可以配合刷新盲文显示器使用\
  \ Orca 屏幕阅读器。\n\n对于手部和/手指障碍的用户，某些辅助功能设置允许完全使用系统。更常见的设置列在 表 8.4 中。\n\n| 名称 | 描述 |\n\
  | --- | --- |\n| 粘滞键 | 键盘选项，有助于补偿不小心多次按下单键。 |\n| 双击延迟 | 鼠标选项，修改两次鼠标双击之间允许的时间。 |\n\
  | 手势 | 鼠标选项，通过组合鼠标点击和键盘按键激活程序和/或选项。 |\n| 悬停点击 | 鼠标选项，当指针悬停在某项上时触发鼠标点击。 |\n| 鼠标键\
  \ | 鼠标选项，允许你使用键盘键来模拟鼠标功能。 |\n| 重复键 | 键盘选项，修改按键按住的时间以及确认按键重复的延迟。也称为 `keyboard repeat\
  \ rate`。 |\n| 屏幕键盘 | 键盘选项，在 UI 上显示视觉键盘，可以通过鼠标或其他指向设备进行操作以模拟击击键。 |\n| 模拟右键点击 | 鼠标选项，设置一个主键在点击鼠标时按下，以模拟鼠标右键点击。\
  \ |\n| 慢速 | 键盘选项，修改按键按住以确认按键的时间。 |\n| 粘滞键 | 键盘选项，将键盘修饰键（如 Ctrl 和 Shift）设置为保持按下状态，直到按下下一个键为止。\
  \ |\n\n表 8.4 常见的手部和手指障碍辅助功能设置\n\nAccessX 是一个提供了 表 8.4 中许多选项的程序。因此，你经常会在辅助控制面板中看到它，例如在输入辅助（AccessX）选项中。一个有趣的\
  \ AccessX 设置是“键盘启用”，它允许你通过键盘上的按键开启或关闭辅助功能设置。\n\n## 提供 GUI\n\n许多组件参与了 Linux 系统用户界面的提供。桌面环境组件只是这块拼图的一部分。图\
  \ 8.4 是向用户提供 GUI 的简略描述。\n\n![带有终端窗口的桌面界面截图，显示了命令文本和桌面图标。](img/c08f006.png)\n\n图\
  \ 8.4 提供 GUI 组件\n\n在 图 8.4 中，注意窗口管理器是此场景中的协调者。窗口管理器是一个代表 UI 与显示服务器（有时被称为窗口管理器）通信的程序。每个特定的桌面环境都有它们自己的默认窗口管理器，例如\
  \ Mutter、Kwin、Muffin、Marco 和 Metacity。\n\n在接下来的章节中，我将关注 `display server`（显示服务器），该程序使用通信协议将\
  \ UI 的请求传输给操作系统，反之亦然。该通信协议称为 `display server protocol`，可以在网络上运行。\n\n显示服务器团队的另一个成员是\
  \ `compositor`（合成器）。合成器程序在窗口内排列各种显示元素，创建一个屏幕图像并传回客户端。\n\n## 了解 Wayland\n\nWayland\
  \ 是 X11 显示服务器（后文将描述）的替代品。它的设计更简单、更安全，并且更容易开发和维护。Wayland 专门定义了显示服务器与其各种客户端之间的通信协议。然而，Wayland\
  \ 也是一个涵盖合成器、窗口服务器和显示服务器的术语。\n\nWayland 协议最初发布于 2009 年，现在被许多当前的 Linux 桌面环境使用，如 GNOME\
  \ Shell 和 KDE Plasma。如果你真的深入研究 Wayland，请访问其网站 `https://wayland.freedesktop.org`。\n\
  \n在 练习 8.1 中，你将探索如何找出你的 Linux 系统使用的是哪个显示服务器，以及如何识别分配给桌面的话话。\n\nWayland 合成器是 Weston，它提供了非常基础的桌面体验。它是作为\
  \ Wayland 合成器的参考实现创建的，是为创建自己的 Wayland 合成器的开发者提供的器需求示例。因此，Weston 的核心重点是正确性和可靠性。\n\
  \nWayland 的合成器是可以更换的。换句话说，如果你需要功能全面的桌面体验，可以使用不同的合成器。有多个合成器可供 Wayland 使用，包括 Arcan、Sway、Lipstick\
  \ 和 Clayland。然而，你可能不需要去获取 Wayland 合成器。许多桌面环境创建自己的 Wayland 合成器，这些通常嵌入在它们的窗口管理器中。例如，Kwin\
  \ 和 Mutter 都完全处理 Wayland 合成任务。\n\n如果你的 UI 正在使用 Wayland 但遇到了 GUI 问题，可以尝试一些故障排除技术。以下列表列了一些基本方法。\n\
  \n* **尝试不带 Wayland 的 GUI**。如果你的 Linux 发行版有多个版本的桌面环境（带有 Wayland 或带有 X11），注销你的 GUI\
  \ 会话并选择不带 Wayland 的桌面环境。如果你的 UI 问题解决了，那么你就知道它可能与 Wayland 有关。\n* 如果你没有多个版本的桌面环境且正在使用\
  \ GNOME Shell 用户界面，请关闭 Wayland。通过超级用户权限编辑 `/etc/gdm3/custom.conf` 文件来实现此。删除 `#WaylandEnable=false`\
  \ 行中的 `#` 符号并保存文件。重启系统并登录 GUI 会话，看看问题是否消失。\n* **检查你系统的显卡**。如果你的系统在 X11 下运行正常，但在\
  \ Wayland 下出现问题，请检查你的显卡。访问显卡厂商的网站查看其驱动程序是否支持 Wayland。许多驱动都支持，但有几个著名的顽执者暂不点名了。\n\n\
  \n\n\n\n- **使用不同的合成器。** 如果你正在使用桌面环境内置的合成器或其他合成器，请尝试安装并使用 `Weston` 合成器包。请记住，`Weston`\
  \ 是为了可靠性而构建的。如果你的发行版软件仓库中没有 `Weston`，你可以从 `https://gitlab.freedesktop.org/wayland/weston`\
  \ 获取。该网站还包含有用的文档。如果使用 `Weston` 解决了你的 GUI 问题，那么你已经缩小了问题的祸首范围。\n\n## 检查 X11\n\nX Window\
  \ 系统（简称 X）自 20 世纪 80 代以来一直存在，因此它经住了时间的考验。在 Linux 上，直到 2004 年，实现 X 的主导服务器一直是 `XFree86`，随后发生了许可协议变更。这一变化导致许多\
  \ Linux 发行版切换到 `X.Org` 基金会的 X 实现。\n\n`X.Org` 的服务器实现了第 11 版 X Window 系统。因此，你会看到 Linux\
  \ X 显示服务器有各种名称，例如 `X.org-X11`、`X`、`X11`、`X.Org Server` 等。我在本章将使用 `X` 或 `X11`。\n\n\
  目前 `X11` 正在被 `Wayland` 快速取代。`Wayland` 不仅提供了更好的安全性，而且更容易维护。旧的 `X11` 配置中有许多过时且晦涩的选项。然而，你可能仍然在使用在使用\
  \ `X11` 的发行版，因此了解它的基础知识是非常重要的。\n\n`X11` 的主配置文件是 `/etc/X11/xorg.conf`，尽管它有时存储在 `/etc/`\
  \ 目录下。通常该文件不再被使用。相反，`X11` 通过对每个 GUI 会话涉及的硬件进行运行时自动检测，动态创建会话配置。\n\n然而，在某些情况下，自动检测可能无法正常工作，你需要更改\
  \ `X11` 配置。在这种情况下，你可以创建配置文件。要这样做，请关闭 X 服务器，打开终端模拟器，并使用超级用户权限通过 `Xorg -configure`\
  \ 命令生成文件。该文件名为 `xorg.conf.new`，将位于你的本地目录中。进行任何调整，重命名文件，将文件移动到正确位置，并重启 X 服务器。\n\n\
  `xorg.conf` 文件有几个部分。每个部分包含的重要配置信息如下：\n\n- **Input Device（输入设备）：** 配置会话的键盘和鼠标\n-\
  \ **Monitor（显示器）：** 设置会话的显示器配置\n- **Modes（模式）：** 定义视频模式\n- **Device（设备）：** 配置会话的显卡\n\
  - **Screen（屏幕）：** 设置会话的分和色彩深度\n- **Module（模块）：** 表示需要加载的模块\n- **Files（文件）：** 如果需要，设置字体、模块和键盘布局文件的路径\n\
  - **Server Flags（服务器标志）：** 配置全局 X 服务器选项\n- **Server Layout（服务器布局）：** 将会话的所有输入输出设备连接起来\n\
  \n请记住，许多桌面环境在它们的 UI 中也提供了对话框，允许你配置 GUI X 会话。你可能根本不需要创建或调整 `X11` 配置文件。但是，如果你真的想深入研究\
  \ `X11` 配置文件的细节，可以通过输入 `man 5 xorg.conf` 来查看其帮助手册。\n\n如果你需要排查 X 问题，两个工具可以提供帮助：`xdpyinfo`\
  \ 和 `xwininfo`。`xdpyinfo` 命令提供有关 X 服务器的信息，包括可用的不同屏幕类型、默认通信参数值、协议扩展信息等。\n\n`xwininfo`\
  \ 工具侧重于提供窗口信息。如果没有给出任何选项，交互式工具会要求你点击你想要统计信息的窗口。显示的统计数据包括位置信息、窗口尺寸（宽度和高度）、调色板 ID\
  \ 等。\n\n尽管 `Wayland` 正在取代 X 许多 Linux 系统的默认显示服务器，但 X 服务器还会存在很一段时间。因此，理解这两者不仅对于认证来说非常有价值，而且对于高效工作也是无价的。\n\
  \n## 使用远程桌面\n\n如今，直接连接到你的 Linux 服务器的显示器已是罕见的事。大多数服务器要么是环境控制环境中的架式系统，要么是运行在这些架式系统上的虚拟机。为了访问这些服务器，来自另一个房间桌面的用户通常会使用基于文本的\
  \ `OpenSSH` 工具。然而，有时你需要一个功能完整的桌面环境。\n\n远程桌面软件使用客户端/服务器模型。服务器运行在远程 Linux 系统上，而客户端运行在本地系统上。例如，假设你需要访问位于办公大楼某处服务器上的\
  \ Linux 虚拟机。你可以使用运行远程桌面客户端软件的笔记本电脑登录到运行远程桌面服务器软件的 Linux 虚拟机，并通过网络获得完整的桌面体验。\n\n\
  在接下来的章节中，你将探索 Linux 常见的远程桌面实现。它们包括 `VNC`、`Xrdp`、`NX` 和 `SPICE`。\n\n## 查看 VNC\n\n\
  虚拟网络计算（VNC）由 Olivetti & Oracle Research Lab 开发。它是多平台的，并采用远程帧缓冲（RFB）协议。该协议允许客户端用户向服务器发送\
  \ GUI 命令（例如鼠标点击）。服务器将桌面帧传回给客户端的显示器。由原始 VNC 项目团队开发者组成的 RealVNC Ltd. 现在拥有 VNC 的商标所有权。\n\
  \nVNC 服务器在 TCP 端口 `5900 + n` 上提供 GUI 服务，其中 `n` 等于显示器编号，通常为 `1`（端口 5901）。在命令行中，你将\
  \ VNC 客户端（称为 *viewer*，即查看器）指向 VNC 服务器的主机名和 TCP 端口。或者，你可以使用显示编号代替整个 TCP 端口号。客户端用户需要输入预定义的密码，该密码是用于\
  \ VNC 服务器的，而不是 Linux 系统认证。一旦客户端用户通过 VNC 验证，用户将获得桌面环境的显示管理器输出，以便进行系统认证。\n\nVNC 服务器非常灵活，你也可以使用支持\
  \ Java 的网络浏览器来访问它。它在 TCP 端口 `5800 + n` 上提供该服务。也支持 HTML5 客户端网络浏览器。\n\n以下是使用 VNC 的优点：\n\
  \n- 它在提供远程桌面方面具有很大的灵活性。\n- 多个用户可以使用桌面。\n- 可提供持久性和静态桌面。\n- 它可以根据需要提供桌面。\n- 可以通过 `ssh`\
  \ 或客户端器的命令行选项采用 SSH 隧道来加密流量。\n\n以下是使用 VNC 的潜在困难或问题：\n\n- VNC 服务器仅处理鼠标移动和击键。它不处理客户端的文件和音频传输或打印服务。\n\
  - VNC 默认不提供流量加密，因此你必须采用其他保护方法，例如通过 OpenSSH 建立隧道。\n- VNC 服务器密码以明文形式存储在服务器文件中。\n\n\
  除了 VNC 之外，还有实现 VNC 技术的替代方案。Linux 上一种流行的 VNC 实现是 TigerVNC。TigerVNC 网站为 `https://tigervnc.org`。它也适用于\
  \ Windows，因此你可以连接到远程 Linux 系统或远程 Windows 系统。要在 Linux 系统上安装服务器，请使用 `tigervnc-server`\
  \ 包。你需要进行一些设置来准备客户端，并配置服务器以提供适当的客户端需求。网上有许多优秀的教程。如果你想安装 VNC 客户端，只需使用 `tigervnc`\
  \ 包即可。\n\n\n\n\n\n一旦安装了 TigerVNC 服务器，你就可以使用 `vncserver` 和 `vncconfig` 命令来控制它。在对服务器防火墙进行适当修改后，客户端可以使用\
  \ `vncviewer` 命令连接到服务器系统并获取远程桌面。例如，服务器（`example.com`）已配置妥当，可以在显示器编号 1 为你提供远程桌面。你可以通过\
  \ `vncviewer example.com:1` 命令从另一个系统访问该桌面。图 8.5 显示了从 Fedora 系统到 CentOS 服务器的 TigerVNC\
  \ 连接，该服务器为用户提供了一个 GNOME Shell 桌面环境。\n\n![桌面截图显示了通过 Tiger VNC Viewer 访问的 CentOS 7，显示了首页和垃圾桶图标。](img/c08f005.png)\n\
  \n图 8.5 使用 TigerVNC\n\n在配置 VNC 服务器时，请务必对 VNC 服务器端口采用 OpenSSH 端口转发（本章稍后将介绍）。此外，配置你的防火墙允许流量通过端口\
  \ 22（或你用于 SSH 流量的任何端口）。\n\n## 掌握 Xrdp\n\nXrdp 是 VNC 的替代方案。它支持远程桌面协议 (RDP) 并使用 X11rdp\
  \ 或 Xvnc 来管理 GUI 会话。\n\nXrdp 仅提供 RDP 连接的服务端。它允许通过 RDP 客户端实现进行访问，例如 rdesktop、FreeRDP\
  \ 和微软远程桌面连接。\n\nXrdp 适配 systemd，因此你只需使用 `systemctl` 命令即可安装、启用并启动服务器。Linux 上的包名为\
  \ `xrdp`。请注意，它可能不在你的 Linux 发行版的标准仓库中。\n\n在安装并启动 Xrdp 服务器后，调整防火墙以便流量能够访问标准的 RDP 端口（TCP\
  \ 3389）。现在，通过其主机名或 IP 地址将你的 RDP 客户端指向服务器，并在必要时为客户端提供 RDP 端口号。\n\n取决于你所使用的 RDP 客户端，你可能会看到一个表示服务器不可的屏幕。如果这是你刚刚设置的服务器，你可以继续操作。你需要输入\
  \ Linux 系统的用户身份验证信息，但登录界面取决于你正在使用的 Xrdp 软件。Xrdp 的运行示例见图 8.6。\n\n![桌面界面截图，带有一个终端窗口，显示了命令文本和桌面图标。](img/c08f006.png)\n\
  \n图 8.6 显示了从 Windows 系统到 CentOS Linux 服务器的连接，该服务器正在运行 Xrdp 服务器。注意在终端模拟器中运行的命令的输出。你可以看到一个\
  \ X11 会话正在部署。\n\n以下是使用 Xrdp 的正面优点：\n\n*   Xrdp 使用 RDP，它使用 TLS 对其流量进行加密。\n*   有多种开源\
  \ RDP 客户端软件可供选择。\n*   你可以连接到已存在的连接以提供持久桌面。\n*   Xrdp 服务器处理鼠标移动和按键输入，以及音频传输和在远程系统上挂载本地客户端驱动器。\n\
  \n你可以在 `/etc/xrdp/xrdp.ini` 文件中确定各种 Xrdp 配置设置。该文件中的一个重要设置是 `security_layer` 指令。如果设置为\
  \ `negotiate`（默认值），Xrdp 服务器将与客户端协商使用的安全方法。共有三种方法可用：\n\n*   `tls` 为服务器认证和数据传输提供 SSL\
  \ (TLS 1.0) 加密。请注意，这未达到符合支付卡行业安全标准 (PCI) 所需的加密。\n*   `negotiate` 将安全方法设置为客户端可以使用的最高方法。如果连接通过公共网络进行且客户端必须使用标准\
  \ RDP 安全方法，这将产生问题。\n*   `rdp` 将安全方法设置为标准 RDP 安全。这种方法无法防止中间人攻击（on-path attacks）。\n\
  \nXrdp 使用起来非常简单。此外，由于许多面向 Windows 的用户已经熟悉“远程桌面连接”，因此在办公环境中采用它通常不需要很长时间。\n\n## 探索\
  \ NX\n\nNX 协议（有时称为 NX 技术）由 NoMachine 在 2001 年左右通过 `www.nomachine.com` 创建。NX 是另一种远程桌面共享协议。它的\
  \ v3.5 核心技术是开源的，并在 GNU GPL2 许可证可用。然而，当版本 4 发布时，NX 变得专有且闭源。\n\n但是，有几个基于 NX3 技术的开源变体，包括\
  \ FreeNX 和 X2Go。它们在各种 Linux 发行版上可用，但不一定在它们的默认软件仓库中。\n\n以下是使用 NX 产品的正面优点：\n\n*  \
  \ 它们提供了极的响应时间，即使是在具有高延迟问题的低带宽连接上。\n*   它们比基于 VNC 的产品更快。\n*   它们默认使用 OpenSSH 隧道，因此流量是加密的。\n\
  *   它们通过单个网络端口支持多个并发用户。\n\n## 研究 SPICE\n\n另一个有趣的远程连接协议是独立计算环境简单协议 (SPICE)。它最初是 Qumranet\
  \ 在 2007 年开发的闭源产品。然而，红帽在 2008 年收购了 Qumranet 并使 SPICE 成为开源。其网站地址为 `www.spice-space.org`。\n\
  \nSPICE（有时也写为 Spice）的开发目的是提供一种良好的远程桌面产品，允许连接到你的各种虚拟机。现在，SPICE 主要用于为 KVM 虚拟机提供连接，进入了\
  \ VNC 的领域。\n\nSPICE 是跨平台的，并具有一些很好的额外功能：\n\n*   它的客户端使用多个数据套接连接，你可以拥有多个客户端。\n*  \
  \ 它提供的桌面体验速度类似于本地连接。\n*   它消耗的 CPU 很少，因此你可以将其用于具有多个虚拟机的各种服务器，而不会对其性能产生不利影响。\n* \
  \  它支持高质量视频流。\n*   它提供了热迁移功能，这意味着当虚拟机被迁移到新主机时，连接不会中断。\n\n虽然 SPICE 有单服务器实现版本，但它有多个客户端实现。这些包括\
  \ `remote-viewer` 和 GNOME Boxes。\n\n使用 SPICE 的另一个优点是其强大的安全特性。传输的数据可以以明文发送，也可以使用\
  \ TLS 对流量进行加密。SPICE 客户端与远程 SPICE 服务器之间的认证使用简单身份验证和安全层 (SASL) 实现。该框架允许各种认证方法，只要它们被\
  \ SASL 支持。Kerberos 就是一个被支持的方法。\n\n如果你仍在处理 X11，可以使用 Xspice。由 X.Org 创建的 `Xspice` 既可以作为独立的\
  \ SPICE 服务器，也可以作为 X 服务器。\n\n## 端口转发\n\n仅向授权人员提供数据访问是至关重要的。无论是发送明文数据还是远程桌面 GUI 客户端/服务器交互信息，都需要在网络上确保安全。\n\
  \n提供安全的一种方法是通过 `SSH 端口转发`（有时称为 `SSH 隧道`）。SSH 端口转发允许你将连接从一个特定的网络端口重定向到 22 端口，SSH\
  \ 服务正在那里等待接收它。这允许数据流量通过安全的加密隧道往来移动，类似于虚拟专用网络 (VPN)。\n\n\n\n\n\n要使用 SSH 端口转发，你必须在\
  \ Linux 系统上安装并启用 OpenSSH 服务。幸运的是，大多数发行版都预装了此服务。你可以使用 `systemctl` 命令检查它是否正在运行，该命令在第\
  \ 6 章“维护系统启动和服务”中有介绍。在列表 8.1 中，对系统的 OpenSSH 服务进行了检查。结果显示 OpenSSH 处于 `active`（运行）且\
  \ `enabled`（启动时启动）。\n\n在尝试 SSH 端口转发之前，另一个需要检查的项目是 OpenSSH 配置文件 `/etc/ssh/sshd_config`。`AllowTcpForwarding`\
  \ 指令应设置为 `yes`。如果该指令被设置为 `no`，你必须修改它才能使用 SSH 端口转发。在列表 8.2 中，对 openSUSE 发行版上的配置中的该指令进行了检查。\n\
  \n请注意列表 8.2 中的该指令通过井号 (#) 注释掉了。这并不是问题，因为默认情况下 `AllowTcpFowarding` 被设置为 `yes`。\n\n\
  SSH 端口转发有以下三种类型：\n\n*   本地 (Local)\n*   远程 (Remote)\n*   动态 (Dynamic)\n\n这些变体都允许你执行各种类型的隧道流量。然而，由于我专注于\
  \ GUI 环境，我将涵盖用于远程桌面的本地和远程 SSH 端口转发。\n\n## 本地\n\n本地端口转发将流量从系统上的 OpenSSH 客户端发送到客户端的\
  \ OpenSSH 服务器。客户端的 OpenSSH 服务器通过安全隧道将该流量转发到目标服务器。换句话说，输出流量在离开客户端系统之前被重定向到不同的输出端口并通过\
  \ OpenSSH 进行隧道。\n\n要在命令行中实现此操作，可以使用 `ssh` 命令的 `-L` 选项结合一些参数。对于远程桌面，命令的语法如下：\n\n\
  ```bash\nssh -L local-port:127.0.0.1:remote-port -Nf user@destination-host\n```\n\
  \n该命令语法包含以下参数：\n\n*   `destination-host` 是你登录的计算机，以便使用位于那里的桌面环境。\n*   `user` 是你希望用于身份验证的桌面主机用户名，以便建立安全隧道。\n\
  *   `local-port` 是你在客户端侧使用的应用程序端口号。\n*   `remote-port` 是应用程序在目标主机上监听的端口。\n*   `127.0.0.1`\
  \ 指明你正在使用本地 SSH 端口转发方法。\n\n记住，此命令只建立隧道——它并不提供远程桌面连接。因此，还有两个重要的命令选项：`-N` 选项让 OpenSSH\
  \ 知道不需要远程终端进程，而 `-f` 选项表示在用户通过服务器身份验证后，`ssh` 命令应进入后台运行。这两个选项允许用户在建立安全隧道后发布额外的命令，例如远程桌面命令。\n\
  \n可以使用 VNC 描述一个实际示例。回想 VNC 使用端口 `5900 + n`，其中 `n` 等于显示器编号。因此，如果远程系统上的你的桌面在 2 号显示器上可用，你可以执行以下命令来使用\
  \ SSH 端口转发，并将你的本地 VNC 端口 5901 转发到远程机的端口 5902：\n\n```bash\nssh -L 5901:127.0.0.1:5902\
  \ -Nf Doug@example.com\n```\n\n一旦建立隧道，你就可以使用 VNC 远程桌面命令来访问并查看远程主机上的桌面环境。请记住，你需要执行一些防火墙配置以便访问远程主机。\n\
  \n幸运的是，TigerVNC 为本地 SSH 端口转发提供了一种更简单的方法。只需在 `vncviewer` 命令中使用 `-via localhost` 选项即可，如图\
  \ 8.7 所示。\n\n![带有两个打开窗口的桌面截图，描述了 VNC 连接详情和简单的桌面界面。](img/c08f007.png)\n\n图 8.7 使用\
  \ TigerVNC 进行本地 SSH 端口转发\n\n与 `vncviewer` 命令配合使用的 `-via localhost` 选项强制连接使用本地 SSH\
  \ 端口转发。最后一个命令参数是目标主机的 IPv4 地址（你也可以使用主机名），后面跟着冒号和远程桌面的显示编号 (`1`)。这要简单得多，而且显然需要少的命令和选项。\n\
  \n## 远程\n\n远程 SSH 端口转发方法始于目标主机（服务器），而不是远程客户端。因此，在目标主机上，你通过以下命令语法创建远程桌面安全隧道：\n\n\
  ```bash\nssh -R local-port:127.0.0.1:remote-port -Nf user@client-host\n```\n\n此命令与本地方法相比有一些重要的区别：\n\
  \n*   使用 `-R` 选项代替 `-L` 选项。\n*   `client-host` 是远程客户端的 IP 地址或主机名（你将在其发布远程桌面命令）。\n\
  *   `local-port` 是你在 `client-host` 上使用 `vncviewer` 命令时的端口号。\n*   `remote-port` 在远程桌面服务器上。\n\
  \n### 隧道化你的 X11 连接\n\n另一种在安全隧道内提供远程 GUI 交互的方法是 `X11 转发`。X11 转发允许你通过加密的网络连接与远程系统上的各种基于\
  \ X11 的图形实用程序进行交互。这种方法也是使用 OpenSSH 服务实现的。\n\n首先，你需要检查是否允许 X11 转发。此设置位于 OpenSSH 配置文件\
  \ `/etc/ssh/sshd_config` 中。在远程系统的配置文件中，`X11Forwarding` 指令应设置为 `yes`。如果指令被设置为 `no`，则你必须修改它以使用\
  \ X11 转发。在列表 8.3 中，对 CentOS 发行版上的配置文件中的该指令进行了检查。\n\n一旦你完成了任何必要的配置文件修改，使用的命令是 `ssh\
  \ -X user@remote-host`。与之前的 `ssh` 命令类似，`user` 是位于 `remote-host` 系统上的用户帐户。`remote-host`\
  \ 拥有你希望使用的 GUI 实用，可以通过 IP 地址或主机名指定。图 8.8 显示了从远程 Fedora 客户端连接到 CentOS 服务器并使用该服务器上的图形实用程序。\n\
  \n![桌面截图显示了一个带有命令的终端窗口，和一个列出以太网接口和网接器的网络连接窗口。](img/c08f008.png)\n\n图 8.8 转发 X11\n\
  \n检查你的 IP 地址始终是一个好习惯，以确保你已成功到达远程系统。在图 8.8 中，使用了 `ip addr show` 命令。完成工作后，输入 `exit`\
  \ 退出 X11 转发会话。\n\n## 总结\n\n为你自己和系统用户创建、管理和排故障 GUI 环境涉及重要的技能组合。你需要理解不同的桌面环境、它们的支持框架，以及如何跨网络安全、可靠地传输它们。\n\
  \n各种桌面环境，如 GNOME Shell、KDE Plasma、MATE、Cinnamon 和 Xfce，提供了多种环境来满足不同的需求和喜味。目前不断发展的显示服务器世界（主要包括\
  \ Wayland 和旧的 X11）支持这些 GUI 桌面。\n\nLinux 提供了带有许多辅助功能的 GUI 桌面环境，可以满足几乎任何 UI 需求。各种键盘和鼠标设置有助于手部或手指困难的人士。还有许多针对视障人士的实用程序，包括屏幕阅读器和缩放功能。\n\
  \n\n\n\n通过远程桌面软件可以跨网络访问 GUI。`VNC`、`Xrdp` 和 `NX` 是其中几个例子。`SPICE` 的独特之处在于，它的主要重点是为虚拟机提供远程桌面访问。\n\
  \n无论你访问的是架式物理服务器还是运行在该服务器上的虚拟机，确保远程桌面连接的安全都是至关重要的。这通过 `SSH` 端口转发以及在需要时的 `X11` 转发来实现。如果使用得当，两者都能为数据和\
  \ GUI 交互提供安全传输的加密隧道。\n\n## 考试要点\n\n### 概述各种 GUI 部分和功能。\n桌面环境为 GUI 提供了预定的外观和感受。它具有图形化区域，例如收藏栏、启动区、菜单、面板和系统托盘。GUI\
  \ 还具有典型功能，如桌面设置、显示管理器、文件管理器、访问程序的图标、小部件和窗口管理器。\n\n### 描述各种 GUI 桌面环境。\n当前 Linux 发行版使用的主要桌面环境包括\
  \ `GNOME Shell`、`KDE Plasma`、`MATE` 和 `Cinnamon`。\n\n### 总结可用的通用辅助工具。\n不同的辅助功能工具位于菜单或面板中。这些面板位于桌面环境的各个位置，名称如\
  \ `Universal Access`通用辅助、`Accessibility`辅助功能、`Assistive Technologies`辅助技术等等。最好使用桌面环境的搜索功能来定位它们。针对视障用户的各种访问工具包括光标闪烁、光标大小、对比度修改、字体放大、声音键、缩放功能和屏幕阅读器。对于那些需要盲文技术的个人，可以使用\
  \ `brltty` 软件。对于听力障碍者，可以设置窗口闪烁而不是提供声音报警。当人们使用键盘遇到困难时，有许多可用设置，如粘滞键、重复键、屏幕键盘、慢速键和锁定键。对于鼠标使用困难，可以探索的工具包括双击延迟、手势、悬停点击、鼠标键和模拟右键点击。\n\
  \n### 解释显示服务器的的作用。\n显示服务器是一个程序或程序组，它使用通信协议在 GUI 和操作系统之间传递信息。该通信协议被称为显示服务器协议，可以在网络上运行。与显示服务器一起使用的关键程序是合成器（compositor）。合成器安排窗口内的显示元素以创建屏幕图像。两个重要的显示服务器是\
  \ `Wayland` 和 `X11`。`X11` 是较旧的显示服务器，已经存在很久。`Wayland` 是较新的显示服务器，它增加了许多必要的安全功能并且更容易维护。\n\
  \n### 描述可用的远程桌面软件。\n远程桌面软件通过网络从远程服务器提供功能完整的桌面环境。它使用客户端/服务器模型，有几个软件包可选。它们包括 `VNC`、`Xrdp`、`NX`\
  \ 和 `SPICE`。\n\n### 总结 SSH 端口转发和 X11 转发。\n`SSH` 端口转发有时被称为 `SSH tunneling`，它将连接从一个特定的网络端口重定向到端口\
  \ `22` 的 `SSH` 服务。这允许数据流量通过安全的加密隧道往移动，类似于虚拟专用网络 (VPN)。`SSH` 端口转发有三种方法：本地、远程和动态。除了\
  \ `SSH` 端口转发，还可以使用 `X11` 转发。它也为 GUI 交互提供安全隧道。然而，而不是完整的桌面环境，你可以从远程系统的命令行启动基于 `X11`\
  \ 的图形化工具。\n\n## 复习题\n\n你可以在 附录 A 中找到复习题的答案。\n\n1. 以下哪项最能描述桌面环境？\n    1. 一组允许用户通过图标、窗口和其他各种视觉元素与系统交互的程序\n\
  \    2. 一个让你选择用户名并输入密码以获得系统访问权限的屏幕\n    3. 一系列共同工作的组件，为用户界面提供图形化设置\n    4. 一个允许你以图形化方式执行文件维护活动的程序\n\
  \    5. 一组决定窗口在桌面上呈现方式的程序\n\n2. 下列哪些是 GUI 组件？（选择所有适用项。）\n    1. 收藏栏\n    2. 文件管理器\n\
  \    3. 图标\n    4. 命令行\n    5. 系统托盘\n\n3. 下列哪项在 `GNOME Shell` 中不是默认使用的？\n    1.\
