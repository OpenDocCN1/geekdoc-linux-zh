  \ `_UDEV`\n11. 哪个 SNMP 特性允许服务器将错误消息转发到远程收集服务器？\n    1. Webhooks\n    2. Traps\n\
  \    3. API\n    4. MIB\n    5. JSON\n\n\n\n\n\n建筑中的防火墙是一种防火墙，有助于防止火灾在整个结构中蔓。在计算机安全中，`firewalls`\
  \ 用于阻止不受欢迎、未经授权的或恶意网络流量的传播。\n\n防火墙以不同的形式实现。你可以通过使用多个防火墙结构来提供分层安全。防火墙可以是硬件设备，也可以是软件应用程序，可以是基于网络或基于主机的，也可以是网络层或应用层的过滤器。在本章中，我们将查看基于主机的且运行在网络层上的软件应用程序防火墙。\n\
  \n## 提供访问控制\n\n防火墙为你的系统或网络提供访问控制。在防火墙内部实现的`access control list (ACL)` 可用于识别哪些网络数据包是被允许进入或出的。这通常被称为`数据包过滤`。\n\
  \n防火墙 ACL 通过检查网络数据包的控制信息和其他网络数据来识别网络数据包。这可能包括以下信息：\n\n* 源地址\n* 目的地址\n* 网络协议\n* 入站端口\n\
  * 出站端口\n* 网络状态\n\n一旦识别出网络数据包，防火墙的 ACL 规则还会决定对该数据包进行的操作。规则通常包括以下操作：\n\n* 接受 (Accept)\n\
  * 拒绝 (Reject)\n* 丢弃 (Drop)\n* 记录 (Log)\n\n区分 reject 和 drop 是重要的。reject 操作通常会向发送数据包的应用程序回传一条消息，而\
  \ drop 操作则不会。通过丢弃网络数据包，Linux 系统不会向潜在的恶意外部攻击者提供任何信息。\n\n在 Linux 上，`/etc/services`\
  \ 文件记录了不同的标准应用程序服务名称及其对应的端口号和协议，以及任何别名。这些信息由互联网分配号码机构（IANA）标准化。该服务目录被各种工具使用，例如 `netstat`\
  \ 网络工具和防火墙应用程序（如 `UFW`），用于确定特定服务的适当端口和协议信息。\n\n/etc/services 文件中的每个非注释记录使用以下语法：\n\
  \n```\n ServiceName PortNumber/ProtocolName [Aliases]\n```\n\n默认情况下，端口 1 到 1023\
  \ 是`特权端口`。只有超级用户才能在特权端口上运行服务。因此，这些指定的端口有助于防止恶意用户在上面建立虚假服务。\n\n防火墙可以以状态检测或无状态的方式运行。这两种技术各有其优缺点。\n\
  \n* **无状态 (Stateless)**：这种技术是两者中较老的。在这种模式下，防火墙只关注单个数据包。防火墙查看每个数据包的控制信息，并根据定义的 ACL\
  \ 规则决定对数据包进行什么。这种简单性使得无状态防火墙运行速度快。\n\n* 然而，由于无状态防火墙不跟踪活动网络连接、网络状态、数据流和流量模式等信息，它容易受到某些恶意活动的影响。这包括在多个数据包之间传播的网络攻击。此外，无状态防火墙的\
  \ ACL 规则是静态的。如果管理员更改了它们，通常必须重启防火墙软件。\n\n* **状态检测 (Stateful)**：这种技术是两者中较年轻的。虽然它也采用数据包过滤，但它不将数据包视为个体，而是将其视为流。它跟踪活动网络连接（如\
  \ TCP 和 UDP）并监控网络状态。状态检测防火墙可以确定数据包是否分片。因此，它不会受到在多个数据包之间传播的攻击。\n\n* 状态检测防火墙将网络信息存储在内存中。例如，当\
  \ TCP 连接的第一个数据包进入状态检测防火墙的视野时，防火墙会监控连接过程并跟踪其状态，例如 `SYN-SENT`、`SYN-RECEIVED` 和 `ESTABLISHED`。一旦连接建立，防火墙就会在其基于内存的连接表中创建一个记录。它使用该记录来跟踪网络连接。因此，它不仅仅为该连接的数据包使用\
  \ ACL 规则，还使用了连接表。这允许它为已建立连接的单个数据包做出更快的决策。\n\n* 虽然内存表允许对已建立连接进行快速访问，但为新连接构建表记录的速度较慢。此外，这使得状态检测防火墙比无状态防火墙更容易受到\
  \ DDoS 攻击。\n\n## 查看防火墙技术\n\nLinux 内核中嵌入了 `netfilter`。该软件提供了进入内核的代码钩子（hooks），允许其他包实现防火墙技术。从功能角度来看，可以将\
  \ `netfilter` 视为植入在 Linux 内核中的网络嗅探器，并提供数据包过滤服务。\n\n维护 `netfilter` 的组织在 `https://netfilter.org`\
  \ 提供了一个信息网站。他们还管理 `iptables` 防火墙软件，该软件使用了 `netfilter`。\n\n另一个使用 `netfilter` 的防火墙技术是\
  \ `firewalld`。较新的 `firewalld` 服务允许动态更新修改后的过滤规则，无需重启服务。对于基于 Red Hat 的发行版，如果你在安装期间配置了网络环境，它将默认安装完\
  \ firewalld` 服务。\n\n基于 Debian 的发行版使用另一种利用 `netfilter` 的防火墙服务：无配置防火墙 (`ufw`)。此防火墙配置工具是\
  \ `netfilter` 防火墙的接口，提供了更简单的规则管理。\n\n虽然 `firewalld` 和 `ufw` 服务为 `netfilter` 防火墙提供了易用的接口，但它们包含了一个可能会减慢数据包过滤过程的额外层。对于大多数服务器环境来说没没，但如果你将\
  \ Linux 作为专用网络防火墙，速度就是关键。`nftable` 服务提供了对 `netfilter` 防火墙的低级访问，类似于 `iptables`，但没有\
  \ `iptables` 那么复杂。\n\n本节将讨论这四个防火墙服务中的每一个。\n\n## 熟悉 firewalld\n\n`firewalld` 服务提供了数据包过滤以及用于\
  \ GUI 环境和命令行的用户界面。它支持 IPv4 以及 IPv6 等更多功能。你可以从 `firewalld` 官方网站 www.firewalld.org\
  \ 找到更多细节。\n\n此防火墙服务被称为动态防火墙守护进程，因为你可以在不需要重启服务的情况下更改 ACL 规则。规则通过 D-Bus 接口瞬时加载。\n\n\
  `firewalld` 的核心部分是区域 (zones)。网络流量被分组到一个预定义的规则集或区域中。每个区域都有一个定义该规则集的配置文件，也称为`信任级别`\
  \ (trust level)。流量分组可以是系统的网络接口或源地址范围，用于识别来自其他系统的流量。每个网络连接一次只能属于一个区域。\n\n默认情况下，`firewalld`\
  \ 区域配置文件存储在 `/usr/lib/firewalld/zones/` 目录下。自定义或用户创建的区域配置文件存储在 `/etc/firewalld/zones/`\
  \ 目录下。表 18.1 显示了使用 `firewalld` 的系统上的预定义区域。区域按照从不信任到最信任的网络连接顺序列出。\n\n| 名称 | 描述 |\n\
  | --- | --- |\n| `drop` | 丢弃所有入站网络数据包。只允许出站网络连接。 |\n| `block` | 只接受源自系统的网络连接。拒绝入站网络数据包并回传\
  \ `icmp-host-prohibited` 或 `icmp6-adm-prohibted` 消息。 |\n| `public` | 只接受选定的入站网络连接。通常用于公共环境，在这些环境中网络上的其他系统是不不可信的。\
  \ |\n\n\n\n\n\n| `external` | 功能与 `public` 类似，但通常用于外部网络，当本地系统启用伪装时。 |\n| `dmz` |\
  \ 功能与 `public` 类似，但用于位置的非军事化区域，该区域可以公开访问，且对内部网络的访问受限。 |\n| `work` | 仅接受选定的入网络连接。通常用于工作环境，网络中的其他系统大多是可信任的。\
  \ |\n| `home` | 功能与 `work` 类似，但用于家庭环境，网络中的其他系统大多是可信任的。 |\n| `internal` | 功能与 `work`\
  \ 类似，但通常用于内部网络，网络中的其他系统大多是可信任的。 |\n| `trusted` | 接受所有网络连接。 |\n| `nm-shared` | `NetworkManager`\
  \ 在使用连接共享时内部使用。 |\n\n## 表 18.1](#c018.xhtml_rc018-tbl-1) 预定义的 `firewalld` 区域\n\n\
  `firewall-cmd` 工具允许你查看并与各种 `firewalld` 配置设置进行交互。例如，要查看系统上所有预定义的区域，可以使用 `--get-zones`\
  \ 选项，如 Rocky Linux 发行版中的列表 18.1 所示。\n\n`NetworkManager` 也与 `firewalld` 集成。因此，当通过\
  \ `NetworkManager` 添加新网络设备时，`firewalld` 会自动将其分配到 `default zone`。`default` 区域通常预设置为\
  \ `public` 区域，但可以通过 `firewall-cmd` 工具进行自定义。你可以查看系统当前的 `default` 区域，如列表 18.2 所示。\n\
  \n如果你需要不同的 `default` 区域，可以对其进行修改。只需使用超级用户权限并采用 `––set-default-zone=zone` 选项。\n\n\
  你还可以查看所有当前激活的区域及其流量分组。只需使用 `––get-active-zones` 关，如列表 18.3 所示。\n\n除了区域之外，`firewalld`\
  \ 还使用 `services`（服务）。服务是针对特定提供的系统服务（如 DNS）的预定义配置集。配置信息可能包含端口列表、协议等项目。例如，DNS 服务配置集表示\
  \ DNS 在端口号 53 上同时使用 TCP 和 UDP 协议。列表 18.4 显示了 Rocky Linux 发行版上各种预定义服务的摘录列表。\n\n使用\
  \ `firewalld` 服务可以为特定的系统服务提供更简单的防火墙配置，因为你可以简单地将其分配给区域。示例如列表 18.5 所示。\n\n除了预设服务外，`firewalld`\
  \ 还允许你添加临时规则（称为 `rich rules`）来过滤特定的网络连接，例如阻止特定的 IP 网络地址访问特定的目的地/端口。你可以在命令行中使用 `--add-rich-rule`\
  \ 命令执行此操作。列表 18.6 演示了如何向 firewalld 配置中添加富规则。\n\n列表 18.6 所示的命令拒绝了来自 192.168.1.0 子网任何主机的\
  \ `ping` 尝试。该命令将规则应用于默认区域。你可以使用 `--list-rich-rules` 命令查看激活的富规则，如列表 18.6 所示。要删除规则，请使用\
  \ `--remove-rich-rule` 命令。遗憾的是，你必须按照你在 `--add-rich-rule` 命令中输入的格式完全指定规则。\n\n当你修改\
  \ `firewalld` 配置时，默认修改的是 `runtime`（运行时）环境。运行时是 `firewalld` 服务正在积极使用的配置。\n\n另一个 `firewalld`\
  \ 环境是 `permanent`（永久）环境。该环境是存储在配置文件中的防火墙配置。它在系统启动（或当 `firewalld` 重启或加载时）加载并成为激活的运行时环境。\n\
  \n这两个 `firewalld` 环境都有其用途。永久环境适用于生产环境，而运行时配置适用于测试防火墙设置更改。\n\n如果你已经在运行时环境中测试了防火墙配置更改并希望将其永久化，可以很容易实现。只需使用超级用户权限执行\
  \ `firewall-cmd --runtime-to-permanent` 命令。如果你认为运行时环境配置修改是正确的，可以在 `firewall-cmd`\
  \ 命令后加上 `--permanent` 选项。这将同时更改添加到运行时和永久环境中。请查看 `firewall-cmd` 命令的手页以获取更多信息。\n\n\
  ## 调查 iptables\n\n`iptables` 防火墙服务使用一种名为 `chains`（链）的进程来处理进入系统的数据包。链决定了每个数据包进入 Linux\
  \ 系统到达相应应用程序的路径。当应用程序将数据包发送回网络上的远程客户端时，这些链也会参与其中。图 18.1 显示了 Linux 系统处理网络数据包的不同链。\n\
  \n![流程图顺序描述了网络处理阶段，包括 Prerouting、Forward、Input、Postrouting、系统处理和 Output。](img/c18f001.png)\n\
  \n图 18.1 数据包处理链\n\n注意在图 18.1 中，有五个独立的链来处理数据包：\n\n*   `PREROUTING` 在路由决策过程之前处理数据包。\n\
  *   `INPUT` 处理指向本地系统的数据包。\n*   `FORWARD` 处理转发到远程系统的数据包。\n*   `POSTROUTING` 在转发过滤后处理发送到远程系统的数据包。\n\
  *   `OUTPUT` 处理从本地系统输出的数据包。\n\n每个链包含 `tables`（表），定义了处理数据包的规则。共有五种表类型：\n\n*   `filter`\
  \ 应用规则允许或阻止数据包离开链。\n*   `mangle` 应用规则在数据包离开链之前更改其特征。\n*   `nat` 应用规则在数据包离开链之前更改数据包的地址。\n\
  *   `raw` 对不进行跟踪的数据包应用 `NOTRACK` 设置。\n*   `security` 应用强制性访问控制规则。\n\n实施网络地址转换 (NAT)\
  \ 需要使用 `nat` 表在 `OUTPUT` 链中更改数据包的地址。实施防火墙稍微复杂一点，因为你在过程中对 `INPUT`、`OUTPUT` 和 `FORWARD`\
  \ 链应用了 `filter` 表。这在过程中提供了多个可以阻止数据包的位置。\n\n每个链都有一个 `policy`（策略）值。策略项定义了当没有规则适用于数据包时，该链默认处理数据包的方式。有两种不同的策略值：\n\
  \n*   `ACCEPT`：将数据包传递给下一个链。\n*   `DROP`：不将数据包传递给下一个链。\n\n你用于查看和更改 `iptables` 服务中链和过滤器的工具是\
  \ `iptables` 命令。表 18.2 显示了常用的 `iptables` 命令行选项。\n\n| 选项 | 说明 |\n| --- | --- |\n\
  | `-L [chain]` | 列出此 `chain` 中的规则。如果未指定 `chain`，则列出所有链中的所有规则。 |\n| `-S [chain]`\
  \ | 列出此 `chain` 中的规则详情。如果未指定 `chain`，则列出所有链中的规则详情。 |\n| `[-t table]` | 将应用于此 `table`。如果未指定\
  \ `-t table`，则将应用于 `filter` 表。 |\n| `-A chain rule` | 将此新 `rule` 添加到此 `chain` 中。\
  \ |\n| `-I chain index rule` | 在此 `chain` 的 `index` 处插入此新 `rule`。 |\n| `-D chain\
  \ rule` | 从此 `chain` 删除此 `rule`。 |\n| `-R chain index rule` | 从此 `chain` 的 `index`\
  \ 处移除此 `rule`。 |\n\n\n\n\n\n| 选项 | 说明 |\n| :--- | :--- |\n| `-F [chain]` | 移除（刷新）此\
  \ `chain` 中的所有规则。如果未指定 `chain`，则移除所有链中的所有规则。 |\n| `-P chain policy` | 为此 `chain`\
  \ 定义默认的 `policy`（策略）。 |\n\n#### 表 18.2 `iptables` 命令常用的选项\n\n要快速查看过滤表的链和规则，请使用超级用户权限，并在\
  \ `iptables` 命令上使用 `-L` 选项。Fedora 系统上的摘录示例可以在列表 18.7 看到。\n\n注意，在这种情况下不需要 `-t filter`\
  \ 选项。这是因为 `iptables` 命令默认将命令应用到过滤表。\n\n如果你想阻止所有离开你的 Linux 系统的数据包，只需将默认的 `OUTPUT`\
  \ 链更改为 `DROP` 策略即可。在这里需要小心，因为如果你正在使用 `ssh` 进入系统，这将导致你的连接数据包也被丢弃！列表 18.8 显示了 Rocky\
  \ 9.4 系统上阻止所有出站数据包的摘录示例。注意修改后 `ping` 命令的操作不再被允许。\n\n在列表 18.8 中，将默认的 `OUTPUT` 链改回\
  \ `ACCEPT` 策略后，`ping` 数据包将被允许。\n\n要更改链规则，你需要在 `iptables` 命令中使用一些额外的命令行选项。这些规则选项在表\
  \ 18.3 中。\n\n| 选项 | 说明 |\n| :--- | :--- |\n| `-d address` | 仅对目的地址为 `address` 的数据包应用规则\
  \ |\n| `-s address` | 仅对源地址为 `address` 的数据包应用规则 |\n| `-i name` | 仅对通过 `name` 网络接口进入的数据包应用规则\
  \ |\n| `-o name` | 仅对通过 `name` 网络接口发出的数据包应用规则 |\n| `-p protocol` | 仅对使用此 `protocol`\
  \ 的数据包应用规则，例如 `tcp`、`udp` 或 `icmp` |\n| `-j target` | 将此 `target` 操作（规则）应用于所选数据包\
  \ |\n\n#### 表 18.3 `iptables` 命令常用的链选项\n\n表 18.3 中的 `-j` 选项需要更进一步的解释。这是应用于所识别数据包的实际规则。最常用的不同\
  \ `target` 值如下：\n\n* `ACCEPT`: 将数据包传递给下一个链。\n* `DROP`: 不将数据包传递给下一个链。\n* `REJECT`:\
  \ 不传递数据包，并向发送者发送拒绝通知。\n\n将规则组合起来并添加到链中有点有点复杂，因此一个示例将会有帮助。在摘录列表 18.9 中，显示了一个 IP 地址为\
  \ 192.168.0.104 的 Ubuntu 24.04 系统成功向 IP 地址为 192.168.0.105 的远程 Rocky 9.4 系统发送了 `ping`。\n\
  \n现在在 Rocky 系统上，使用超级用户权限，你发布命令：\n\n```\nsudo iptables -I INPUT 1 -s 192.168.0.104\
  \ -j REJECT\n```\n\n这条新规则将被插入（`-I`）到 `INPUT` 链过滤表的索引 `1` 处（链中的第一条规则）。任何来自源地址（`-s`）`192.168.0.104`（Ubuntu\
  \ 系统）的数据包将被拒绝（`REJECT`）。现在规则已生效，当 Ubuntu 系统尝试 `ping` Rocky 系统时，它将失败，如摘录列表 18.10\
  \ 所示。\n\n虽然不需要重新加载 `iptables` 服务即可使新或修改的规则生效，但这些规则没有`持久性`。换句话说，如果系统重启或重启了 `iptables`\
  \ 服务，你将丢失所有这些新或修改的 ACL 规则。\n\n只要 `iptables` 服务设置为系统启动时启动，Red Hat 和基于 Red Hat 的发行版（如\
  \ Fedora 和 Rocky Linux）会自动加载存储在这些文件中的 `iptables` 规则：\n\n* `IPv4 规则`: `/etc/sysconfig/iptables`\n\
  * `IPv6 规则`: `/etc/sysconfig/ip6tables`\n\nDebian 和基于 Debian 的发行版（如 Ubuntu）需要安装并启用额外的软件包\
  \ `iptables-persistent`。该包用于加载持久规则的文件如下：\n\n* `IPv4 规则`: `/etc/iptables/rules.v4`\n\
  * `IPv6 规则`: `/etc/iptables/rules.v6`\n\n如果你需要保存当前的 `iptables` 规则，请使用 `iptables-save`\
  \ 命令。该工具需要将其输出重定向到文件，因为默认情况下会将规则发送到 STDOUT。\n\n要恢复已保存的 `iptables` 规则，请使用 `iptables-restore`\
  \ 命令。该工具需要从文件重定向输入。因此，如果你正在测试一个效果良好的 ACL 更改，可以快速恢复 `iptables` 的原始规则。在旧版本的 Fedora\
  \ 发行版上，你使用超级用户权限并执行 `iptables-restore < /etc/sysconfig/iptables` 命令来恢复所有原始 IPv4\
  \ 规则。\n\n#### 注意 `nftables`\n\n你可能注意到，在 `iptables` 中创建规则的格式往往变得相当复杂，特别是与 `firewalld`\
  \ 等工具相比。一个很好的折中方案是 `nftables` 服务。\n\n`nftables` 服务提供了对 `netfilter` 链的低级访问，类似于 `iptables`，这使其极其高效且快速。然而，在\
  \ `nftables` 中构建规则的命令语法已经了简化，使其更容易操作。\n\n`nftables` 服务使用了与 iptables 相同的表、链、策略和规则概念。你可以通过使用\
  \ `nft` 命令的 `list` 选项列出已定义的表，如列表 18.11 所示。\n\n注意在列表 18.11 中，在 Red Hat 系统中`firewalld`\
  \ 服务会在 netfilter 中创建其自己的表，`nftables` 会检测到这些。要创建一个新表，使用 `nft` 中的 `add table` 选项，如列表\
  \ 18.12 所示。\n\n`add` 命令创建了表，但如列表 18.12 所示，默认情况下它是空的。\n\n`nftables` 服务使用了与 iptables\
  \ 相同的表、链、策略和规则概念。你可以通过使用 `nft` 命令的 `list` 选项列出已定义的表，如列表 18.11 所示。\n\n注意在列表 18.11\
  \ 中，在 Red Hat 系统中`firewalld` 服务会在 netfilter 中创建其自己的表，`nftables` 会检测到这些。要创建一个新表，使用\
  \ `nft` 中的 `add table` 选项，如列表 18.12 所示。\n\n`add` 命令创建了表，但如列表 18.12 所示，默认情况下它是空的。\n\
  \n创建表后，下一步是创建链，链将包含你定义的防火墙规则。正如你预期的，`add chain` 选项执行了此操作。`add chain` 选项的基本格式如下：\n\
  \n```\nnft add chain [family] table_name chain_name { type type hook priority value\
  \ \\; [policy policy \\;] [comment “text \\;] }\n```\n\n`type` 值可以是 `filter`、`router`\
  \ 或 `nat`（与 iptables 相同），`hook` 值可以是 `prerouting`、`input`、`forward`、`output` 或 `postrouting`（再次与\
  \ iptables 相同）。`priority` 值决定了链的处理顺序；优先级较低的值先处理。`policy` 值可以是 `accept` 或 `drop`。列表\
  \ 18.13 显示了一个创建链的示例。\n\n如列表 18.13 所示，你必须为 `add chain` 命令加上单引号。此链的默认策略设置为 `drop`，因此所有入站数据包将被丢弃，除非它们匹配了相反的规则。\n\
  \n一旦创建了链，你就可以使用 `add rule` 选项为链定义规则。规则格式是 `nftables` 的卖点之一。该格式使用了与流行的 `tcpdump`\
  \ 监控程序类似的简单语法。列表 18.14 显示了允许 SSH 流量的规则示例。\n\n列表 18.14 显示规则已添加到 `test` 链中。你现在可以在同一链中创建额外的规则，或者创建具有不同优先级的链来包含额外的规则。\n\
  \n要从表中删除规则，请使用 `flush table` 选项：\n\n```\nsudo nft flush table rich\nsudo nft list\
  \ table ip rich\ntable ip rich {\n    chain test {\n        type filter hook input\
  \ priority filter; policy drop;\n    }\n}\n```\n\n\n\n\n要从表中删除链，请使用 `delete chain`\
  \ 选项。要删除整个表，请使用 `delete table` 选项：\n\n```bash\n$ sudo nft delete table ip rich\n\
  $ sudo nft list tables ip\ntable ip filter\ntable ip security\ntable ip raw\ntable\
  \ ip mangle\ntable ip nat\ntable ip firewalld\n$\n```\n\n## 了解 ufw\n\n简单防火墙（ufw`）是\
  \ Ubuntu 发行版默认的防火墙服务。它通过 `ufw` 命令行工具或用于图形界面的 `gufw` 进行配置（但你需要使用 `apt;` 安装它，请参见第\
  \ 13 章 中的“管理软件”）。\n\n有几个 `ufw` 命令可以控制防火墙的状态并查看其状态。这些命令如表 18.4 所示。每条命令都需要超级用户权限。\n\
  \n| 命令 | 说明 |\n| --- | --- |\n| `ufw enable` | 启动 `ufw` 防墙并允许其在系统启动时启动 |\n| `ufw\
  \ disable` | 停止 `ufw` 防墙并禁止其在系统启动时启动 |\n| `ufw reset` | 禁用 `ufw` 防墙并将其重置为安装默认值 |\n\
  | `ufw reload` | 重载 `ufw` 防墙 |\n| `ufw status` | 显示 `ufw` 防墙的当前状态 |\n\n表 18.4 控制状态和查看状态的\
  \ `ufw` 命令\n\n要查看 `ufw` 服务的当前状态，如果需要比 `status` 更多信息，请使用 `sudo ufw status verbose`。在\
  \ Ubuntu 24.04 系统上启用 `ufw` 防墙服务并查看其当前状态请参见列表 18.15。\n\n查看 `ufw` 防墙的详细状态可以提供有助于解释其配置的信息：\n\
  \n* `Status`: UFW 服务正在运行并将在系统启动时启动（`active`），或者服务已停止且系统启动不会改变此状态（`disabled`）。\n\
  * `Logging`: 服务的日志功能可以设置为 `off`；记录所有被拦截的数据包（`low`），这是默认设置；带速率限制地记录所有被拦截、无效、无策略匹配和新连接的数据包（`medium`）；带速率限制地记录中等日志级别包和所有其他数据包（`high`）；以及在无速率限制的情况下记录所有内容（`full`）。\n\
  * `Default`: 显示 `incoming`（入站）、`outgoing`（出站）和 `routed`（路由）数据包的默认策略，可以设置为`allow`（允许）数据包、`drop`（丢弃）数据包或\
  \ `reject`（拒绝）数据包并发送拒绝消息。\n* `New profiles`: 显示自动将新配置文件加载到防火墙的默认策略，可以设置为 `ACCEPT`、`DROP`、`REJECT`\
  \ 或 `SKIP`，其中 `ACCEPT` 被认为存在安全风险。\n\n各种默认 `ufw` 策略存储在 `/etc/default/ufw` 文件中。首次安装时，这些设置允许所有出站连接并拦截所有入站连接。你可以根据需要使用\
  \ `ufw` 命令及其各种参数对防火墙进行修改。一些常用参数见表 18.5。\n\n| 参数 | 说明 |\n| --- | --- |\n| `allow\
  \ Identifiers` | 将由 `Identifiers` 标识的规则设置为 `allow` 数据包 |\n| `deny Identifiers` |\
  \ 将由 `Identifiers` 标识的规则设置为 `deny`（丢弃）数据包 |\n| `reject Identifiers` | 将由 `Identifiers`\
  \ 标识的规则设置为 `reject` 数据包 |\n| `delete RULE | NUM` | 删除由 `RULE` 或 `NUM` 标识的规则 |\n\
  | `insert NUM RULE` | 将 `RULE` 插入到索引 `NUM`  |\n| `default POLICY DIRECTION` | 修改默认的\
  \ `DIRECTION` 策略，其中 `POLICY` 为 `allow`、`deny` 或 `reject`，`direction` 为 `incoming`、`outgoing`\
  \ 或 `routed` |\n| `logging LEVEL` | 设置日志级别，其中 `LEVEL` 为 `on`、`off`、`low`（默认）、`medium`、`high`\
  \ 或 `full` |\n\n表 18.5 `ufw` 命令的常用参数\n\n在创建新的 `ufw` 规则时，可以使用简单语法或完整语法。简单语法仅使用端口号或其服务名称来指定规则。你也可以为端口号添加协议，如列表\
  \ 18.16 所示。\n\n注意当添加规则时，应用了两规则——一个针对 IPv4 数据包，一个针对 IPv6 数据包。使用完整语法有很多选项。例如，你可以采用表\
  \ 18.6 所示的设置。\n\n| 设置 | 说明 |\n| --- | --- |\n| `comment \"string\"` | 为拒绝的流量显示此注释\
  \ |\n| `in` | 仅应用于入站流量 |\n| `out` | 仅应用于出站流量 |\n| `proto protocol` | 将规则应用于此 `protocol`\
  \ |\n| `port port#` | 将规则应用于此 `port#` |\n| `from source` | 将规则应用于来自 `source` 的流量，该源可以是单个\
  \ IP 地址、子网或 `any` 流量 |\n| `on interface` | 将规则应用于网络 `interface` 上的流量 |\n| `to destination`\
  \ | 将规则应用于往于 `destination` 的流量，目标可以是单个 IP 地址、子网或 `any` 流量 |\n\n表 18.6 `ufw` 命令的常用参数\n\
  \n\n\n\n一旦设置了这些内核值，你的 Linux 系统就能将流量从一个网络接口转发到另一个网络接口。如果 Linux 系统上有多个网络接口，它将通过路由表知道使用哪个接口向远程主机发送流量。路由表在第\
  \ 7 章“配置网络连接”中介绍过。\n\nIP 转发最用于 IP 伪装（也称为网络地址转换 [NAT]），即当你想要与外部世界通信时隐藏内部 IP 地址的情况。在这种场景下，防火墙从一个网络接口接收来自内部网络的数据包，然后在连接到外部网络的独立网络接口上，使用相同的\
  \ IP 地址发送所有输出数据包，但使用不同的端口号。\n\n要启用 NAT，你需要开启 IP 转发；然后你需要告诉防火墙服务将你的输出数据包伪装为不同的 IP\
  \ 地址。对于 `iptables`，命令如下：\n\n```\niptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE\n\
  ```\n\n该命令将 `eth0` 网络接口指定为输出接口。\n\n## 动态设置规则\n\n在保护系统时，拥有能够监控网络和系统上运行应用程序并寻找可疑行为的软件非常有帮助。这些应用程序被称为入侵检测系统\
  \ (IDS)。某些 IDS 应用程序允许你动态更改规则以阻止这些攻击。其中两个 IDS 程序是 `DenyHosts` 和 `Fail2ban`。\n\n你防火墙工具箱中的另一个实用工具是允许你快速更改规则，而无需反复输入长\
  \ IP 地址或 MAC 地址。`IPset` 可以帮助解决这个问题（参见接下来的章节，“IPset”）。\n\n## DenyHosts\n\n`DenyHosts`\
  \ 应用程序是一个 Python 脚本，有助于防止来自 OpenSSH 的暴力破解攻击。该脚本可以作为服务运行，也可以作为 `cron` 任务运行。它监控发行版认证日志文件中的\
  \ `sshd` 日志，例如 `/var/log/secure` 和 `/var/log/auth.log`。如果它看到来自同一主机的重复身份验证失败，它将通过\
  \ `/etc/hosts.deny` 文件封该 IP 地址。\n\n要配置 `DenyHosts`，你需要修改其 `/etc/denyhosts.conf`\
  \ 文件。你还需要准备好 TCP Wrappers 文件 `/etc/hosts.allow` 和 `/etc/hosts.deny`。\n\n## Fail2ban\n\
  \n`Fail2ban` 服务也监控系统日志，寻找来自同一主机的重复失败。如果它检测到问题，`Fail2ban` 可以阻止违规主机 IP 访问你的系统。虽然 `DenyHosts`\
  \ 仅配合 TCP Wrappers，但 `Fail2ban` 可以配合 TCP Wrappers、`iptables`、`firewalld` 等工作。\n\n\
  `fail2ban-client` 程序监控系统和应用程序日志以寻找问题。它监控常见的系统日志文件，如 `/var/log/pwdfail` 和 `/var/log/auth.log`\
  \ 日志，寻找多次失败登录尝试。当它检测到一个用户账户失败登录尝试过多时，它会阻止该用户账户尝试登录的主机访问。\n\n`Fail2ban` 的一个强大特性是它还可以监控单个应用程序日志文件，例如\
  \ Apache Web 服务器的 `/var/log/apache/error.log` 日志。与系统日志文件一样，如果 `Fail2ban` 检测到来自同一远程主机的过多连接尝试或错误，它将阻止该主机的访问。\n\
  \n`/etc/fail2ban/jail.conf` 文件包含 `Fail2ban` 配置。它定义了要监控的应用程序、其日志文件的位置，以及检测到问题时应采取的行动。\n\
  \n## IPset\n\n`IPset` 是一组 IP 地址、网络接口、端口、MAC 地址或子网的命名集合。通过创建这些集合，你可以轻松地通过防火墙以及任何支持\
  \ IPsets 的其他应用程序管理这些分组。\n\n`ipset` 工具用于管理 IPsets，并需要超级用户权限。当你创建一个 IPset 时，首先需要确定要给它起什么名字。然后，决定你想如何存储\
  \ IPset。你的存储选择有 `bitmap`、`hash` 或 `list`。通过 `ipset` 命令创建 IPset 有两种方法：\n\n```\nipset\
  \ create IPset-Name storage-method:set-type\nipset -N IPset-Name storage-method:set-type\n\
  ```\n\n在 Rocky Linux 发行版中创建子网 IPset 并向其添加成员的示例可见列表 18.22。\n\n一旦你完成了 IPset 的填充，就可以检查你的工作成果了。只需使用\
  \ `ipset list` 命令，如列表 18.23 所示。\n\n一旦创建并填充完成，在你的 `iptables` 或 `firewalld` ACL 规则中拦截该\
  \ IPset。要使 IPset 持久化，通过 `ipset save` 命令保存它并将其 STDOUT 重定向到 `/etc/ipset.conf` 文件，或使用\
  \ `-f` 选项。\n\n你可以通过 `ipset del` 命令从命名的 IPset 中删除单个项目。要删除整个 IPset，你需要销它，如列表 18.24\
  \ 所示。\n\n## 总结\n\n正确管理系统的防火墙应用程序及其包过滤 ACL 对于保护系统至关重要。为了做到这一点，你必须理解防火墙软件的基础框架、如何修改其\
  \ ACL 规则，以及可以使用哪些附加应用程序阻止恶意网络流量。使用正确的产品并正确配置不仅有助于保持系统安全，还能让你的工作变得更容易。\n\n## 考试要点\n\
  \n**总结各种防火墙功能。** 防火墙 ACL 识别哪些网络数据包允许进入或离开。无状态防火墙查看每个数据包的控制信息，并根据定义的 ACL 规则决定对数据包做什么。有状态防火墙跟踪活跃的网络连接（如\
  \ TCP 和 UDP）；监控网络状态；并能确定包是否分片。防火墙采用 `/etc/services` 文件，该文件记录了不同的标准应用程序服务名称及其对应的端口号、协议和别名。\n\
  \n**描述 `firewalld` 及其命令。** 对于 `firewalld` 服务，网络流量被分组为区域（zone），这是一个预定义的规则集。每个区域都有一个配置文件来定义此规则集，也称为信任级别。`firewalld`\
  \ 区域配置文件存储在 `/usr/lib/firewalld/zones/` 目录下。自定义或用户创建的区域配置文件存储在 `/etc/firewalld/zones/`\
  \ 目录下。对于 `firewalld`，服务是特定服务（如 DNS）的预定义配置集。当你修改 `firewalld` 配置时，默认修改的是运行时环境，即活动状态。永久环境是配置文件中的防火墙设置。`firewall-cmd`\
  \ 工具允许你查看并与 `firewalld` 交互。\n\n**描述 `iptables` 及其命令。** `iptables` 防火墙服务使用称为链（chains）的过程来处理进入系统的网络包。链决定了每个数据包进入\
  \ Linux 系统时到达相应应用程序的路径。每个链都有一个策略值，并包含定义处理包规则的表。`iptables` 中的 ACL 规则对识别出的数据包有目标值（target），这决定了对它们采取的行动。`iptables`\
  \ 命令允许你查看并与各种 `iptables` 配置设置交互。\n\n\n\n\n\n## 描述 `ufw` 及其命令。\n\nUncomplicated Firewall\
  \ (`ufw`) 是 Ubuntu 发行版的默认防火墙服务。它可以使用 `ufw` 命令行工具或图形界面的 `Gufw` 进行配置。默认 `ufw` 策略存储在\
  \ `/etc/default/ufw` 文件中。在创建新的 `ufw` 规则时，可以使用简单或完整语法。用户添加的 `ufw` 规则存储在 `/etc/ufw/user.rules`文件中。`ufw`\
  \ 服务为常用应用程序和守护进程使用配置文件，存储在 `/etc/ufw/applications.d/` 目录下。\n\n## 说明如何动态更改数据包过滤\n\
  \n`DenyHosts` 应用是一个 Python 脚本，有助于防止来自 SSH 的暴力破解攻击。它监控 `sshd` 日志并修改 `/etc/hosts.deny`\
  \ 以阻塞已识别的攻击。`Fail2ban` 服务也会监控系统日志，寻找来自同一主机的重复失败尝试。如果它检测到问题，`Fail2ban` 会阻塞违规主机的 IP\
  \ 地址。`ipset` 是 IP 地址、网络接口、MAC 地址或子网的命名集合。通过创建这些集合，你可以轻松通过防火墙拦截分组流量。\n\n## 复习题\n\n\
  你可以在 附录 A 中找到复习题的答案。\n\n1. 关于本章涵盖的 Linux 防火墙，以下哪些是正确的？（选择所有适用项）\n   - 它们使用 ACL 允许数据包。\n\
  \   - 它们检测恶意行为。\n   - 它们检查网络控制信息。\n   - 它们使用嵌入 Linux 内核的 `iptables`。\n   - 它们使用配置文件来实现持久化。\n\
  \n2. 下列哪个描述了数据包过滤？\n   - 通过控制信息识别网络数据包并允许其进入系统\n   - 通过控制信息识别网络数据包，并根据 ACL 规则决定如何操作\n\
  \   - 通过载荷识别网络数据包，并根据 ACL 规则决定如何操作\n   - 通过源地址识别网络数据包，并根据 ACL 规则决定如何操作\n   - 通过载荷识别网络数据包并根据源地址决定如何操作\n\
  \n3. 以下哪些是状态防火墙相比无状态防火墙的优势？（选择所有适用项）\n   - 它的运行速度更快。\n   - 它容易受到 DDoS 攻击的影响。\n \
  \  - 它能判断数据包是否分片。\n   - 对于已建立的连接，它的运行速度更快。\n   - 它容易受到 DDoS 攻击。\n\n4. `firewalld`\
  \ 服务使用 ____，这是一个预定义的集合。\n   - `netfilter`\n   - `firewall-cmd`\n   - Services\n\
  \   - `reject`\n   - Zones\n\n5. Linux 管理员 Peter Quill 一直测试一个新的 `firewalld` 配置。测试成功了。Peter\
  \ Quill 接下来应该做什么？\n   - 使用超级用户执行 `reboot` 命令。\n   - 使用超级用户执行 `firewall-cmd --panic-on`\
  \ 命令。\n   - 什么都不做。如果测试成功，运行时环境就是持久化环境。\n   - 使用超级用户执行 `firewall-cmd --runtime-to-permanent`。\n\
  \   - 执行另一个 `firewall-cmd` 命令，但添加 `--permanent` 选项。\n\n6. Peter Quill 是一个使用 `iptables`\
  \ 服务的 Linux 系统管理员。Quill 想添加一条规则仅拦截入站的 `ping` 数据包，而不向源发送拒绝消息。他应该使用哪个命令？\n   - `sudo\
  \ iptables -P INPUT`\n   - `sudo iptables -A INPUT -p icmp -j REJECT`\n   - `sudo\
  \ iptables -A INPUT -p icmp -j DROP`\n   - `sudo iptables -D INPUT -p icmp -j DROP`\n\
  \   - `sudo iptables -A OUTPUT -p icmp -j REJECT`\n\n7. 下列哪个命令允许你查看 `ufw` 防火墙中的各种规则及其关联数字？\n\
  \   - `sudo ufw show numeric`\n   - `sudo ufw status`\n   - `sudo ufw status verbose`\n\
  \   - `sudo ufw status numbered`\n   - `sudo ufw enable`\n\n8. 下列哪个是 `ufw` 简单语法的示例，用于在不提供拒绝消息的情况下拦截所有入出的\
  \ SSH 连接？\n   - `sudo ufw deny 22/tcp`\n   - `sudo ufw drop 22/tcp`\n   - `sudo\
  \ ufw reject 22/tcp`\n   - `sudo ufw accept 22/tcp`\n   - `sudo ufw block 22/tcp`\n\
  \n9. 下列哪些关于 `DenyHosts` 和 `Fail2ban` 的描述是正确的？（选择所有适用项）\n   - 它是一个入侵检测系统 (IDS)。\n\
  \   - 它修改 `/etc/hosts.deny` 文件。\n   - 它只处理 SSH 流量。\n   - 它的配置文件名为 `jail.conf`。\n\
  \   - 它可以与 TCP Wrappers、`iptables` 和 `firewalld` 工作。\n\n10. Virginia Potts 正在管理一个带有防火墙的\
  \ Linux 系统。她已经设置了一个 `ipset` 并将其命名为 `BlockThem`。一个新的攻击开始从 `72.32.138.96` 地址发生。除了超级用户权限外，Potts\
  \ 女士应该执行什么命令将此 IPv4 地址添加到 `ipset` 中？\n   - `ipset create BlockThem hash:net`\n \
  \  - `ipset -n BlockThem hash:net`\n   - `ipset save -f /etc/ipset.conf`\n   - `ipset\
  \ -A BlockThem 72.32.138.0/24`\n   - `ipset add BlockThem 72.32.138.96`\n\n# 第 19\
  \ 章：拥抱最佳安全实践\n\n![](img/chaptersquare.png)\n\n在本章中，我们将探索用于使你的 Linux 系统更安全的常用实践。幸运的是，许多经验丰富的\
  \ Linux 管理员已经为为我们开辟了道路，以便在 Linux 系统上实施良好的安全实践。本章将这些实践分为三类：用户安全、系统安全和网络安全。\n\n##\
  \ 用户安全\n\n虽然花费大量工作试图将未经授权的用户排除在 Linux 系统之外，但作为 Linux 管理员，你还需要考虑授权的用户。本节讨论了你可以在 Linux\
  \ 系统上使用的技术，帮助识别授权用户、了解他们在做什么，并在身份验证后提供更方便的网络资源访问。\n\n\n\n\n\n- **票据授予服务 (TGS):**\
  \ 在 KDC 向用户发布票据后，用户可以登录到网络上支持 Kerberos 系统的服务器。当用户尝试登录服务器时，该服务器会联系 TGS 以确定用户的票据是否有效。如果票据有效，服务器将使用\
  \ `kinit` 工具将票据存储在凭据缓存中，该缓存维护了用于登录服务器的所有票据。要查看服务器凭据缓存中包含的票据，请使用 `klist` 命令。\n\n\
  Kerberos 将身份验证过程集中化，但仍然需要单独的服务器维护自己的数据库，以记录用户账户对服务器上特定对象的访问权限。在与网络上的多个服务器协作时，这本身可能会变得复杂。\n\
  \n## LDAP\n\n这就是`轻量级目录访问协议 (LDAP)` 发挥用场的地方。LDAP 使用分级树数据库结构来存储有关网络用户和资源的信息。网络管理员可以在\
  \ LDAP 数据库结构中输入各种网络资源的权限。当用户账户请求访问服务器上的资源时，服务器会访问集中的 LDAP 数据库以确定是否应授予用户访问该资源的权限。这为网络中的所有服务器提供了一个集中的授权数据库。\n\
  \nLDAP 的一个很好特性是你可以将 LDAP 数据库分布在网络上的多个服务器上。每个服务器可以包含 LDAP 数据库树的一部分，也可以包含整个树的副本。这可以帮助加速查找过程，特别是对于地理位置分散的网络。\n\
  \n## RADIUS\n\n顾如其名，`远程拨号接入用户服务 (RADIUS)` 是一种相当老老的身份验证技术。它最初创建是为了为拨号公告板服务器提供集中的身份验证服务。然而，它的简单性和易于实现使其成为需要简单身份验证方式的现代身份验证应用程序的热门选择。你会在网络环境中常见的\
  \ RADIUS 身份验证服务器，用于验证网络访问，例如网络交换机上的 IEEE 802.1x 身份验证保护。\n\nRADIUS 允许身份验证服务器不仅验证用户账户，还可以验证用户的其他信息，例如网络地址、电话号码和访问权限。虽然没有\
  \ LDAP 那么灵活，但它可以为网络上的多个设备身份验证提供一些基础的数据库功能。\n\n## TACACS+\n\n`终端访问控制器访问控制系统 (TACACS)`\
  \ 定义了一系列在服务器环境中提供远程认证的协议。原始的 TACACS 身份验证协议在 Unix 系统早期非常流行。\n\n原始的 TACACS 协议使用集中的身份验证服务器从单个数据库服务器验证用户账户。网络上的每台服务器都会单独向集中服务器提交身份验证请求，要求用户单独登录每台服务器，尽管有一个通用的身份验证数据库。\n\
  \n## 多因素身份验证\n\n使用用户 ID/密码验证用户账户的方法已经存在很长时间，并且充满了问题。没有什么能阻止用户将其用户 ID 和密码共享给他人，允许他们登录系统并执行操作。\n\
  \n多年来，已经开发了其他登录方法以帮助提供更安全的登录环境。双因素身份验证的概念要求用户拥有两个信息才能登录系统：他们知道的（如密码）和他们拥有的。双因素身份验证利用了几种不同的所有物：\n\
  \n- **生物识别:** 双因素身份验证的最基本形式是生物识别。生物识别使用你必须通过来验证身份的物理特征。这包括指纹、虹膜扫描甚至面部识别。\n\n- **令牌\
  \ (Tokens):** 数字令牌将数字 ID 存储为加密文件。你必须向服务器出文件以获得访问服务器的授权。令牌可以是`硬件令牌`，它们通常存储在 USB 设备（如优存盘）上；也可以是`软件令牌`，即存储在网络设备上的文件。\n\
  \n- **公密钥基础设施 (PKI):** PKI 通过引入异步密钥环境为令牌增加了复杂性和安全性。在异步密钥系统中，有两个令牌密钥一起使用：私钥和公钥。私钥与其公钥唯一匹配；没有其他密钥会匹配。用户保持对其私钥的控制，但可以将公钥与任何需要登录的服务器共享。用户将私钥提交给服务器登录。服务器将提交的私钥与服务器上存储的公钥进行匹配。\n\
  \n- **一次性密码:** 在一次性密码设置下，你使用标准的用户 ID 和密码登录服务器，然后服务器会向你用户账户记录的电子邮件地址或短信发送一个额外的密码。你必须拥有该账户才能接收额外密码并将其应用于登录。这确保了登录尝试是由控制该账户的人执行的。\n\
  \n## 唯一用户账户\n\n任何类型安全计划的关键在于了解你的授权用户正在做什么。这有助于检测故意破坏系统的违规用户，也可以帮助检测偶然做错事情的新手。\n\n\
  监控用户的主要目标是`不可否认性`。不可否认性意味着用户采取的每一个操作都可以追溯到该特定用户。为了使系统上的每个操作都能归于特定的用户，每个用户必须使用唯一的用户账户登录。各种\
  \ Linux 系统日志将跟踪该用户账户执行的操作以及执行时间。\n\n不要允许用户与他人共享用户账户，在任何情况下都不应将同一个用户账户分配给多一个人。这确保了当你在系统日志文件中看到标记为特定用户账户的不当操作时，知道应该向哪个用户询问。这可能无法解决问题，但至少为你排查该问题提供了一个起点。\n\
  \n## 强制强密码\n\n基于密码的身份验证取决于你的系统用户所使用的密码的好坏。良好的安全规范要求用户密码应该是复杂的，并定期更改。遗憾的是，大多数用户倾向于不使用复杂密码或不以任何固定间隔更改它们。幸运的是，Linux\
  \ 提供了几种方法，让你强制你的系统用户在密码方面遵循良好的安全规范。\n\n第 10 章，“管理用户和组](#c010.xhtml_c010)” 引入了 `/etc/login.defs`\
  \ 配置文件，该文件定义了系统如何处理用户密码。使用该文件，你可以通过以下设置定义密码的基本安全设置：\n\n- `PASS_MAX_DAYS`: 更改密码前允许的天数\n\
  - `PASS_MIN_DAYS`: 更改密码后可以再次更改密码所需的天数\n- `PASS_MIN_LENGTH`: 密码所需的最小字符数\n- `PASS_WARN_AGE`:\
  \ 在密码过期前向用户发出警告的天数\n\n这些设置适用于密码的长度和有效期，但不适用于复杂度级别。对于这一点，你需要使用可插拔模块 (PAM) 身份验证服务中的功能（参见第\
  \ 16 章，“查看访问和身份验证方法](#c016.xhtml_c016)”）。\n\n\n\n\n如第 16 章所述，PAM 系统提供了控制 Linux 系统如何验证用户账户以进行访问的库。每个库都使用特定的设置来定制用于验证用户的方法和过程。定义密码复杂度规则就是这些库设置之一。\n\
  \n`pwquality.so` 库定义了适用于系统用户账户的密码规则。通过将此库添加到 PAM 规则中，你可以设置比标准 `/etc/login.defs`\
  \ 设置更额外的密码规则。\n\n在基于 Red Hat 的发行版中，您在 `/etc/pam.d/system-auth` 配置文件中定义密码质量设置。对于基于\
  \ Debian 的发行版，您在 `/etc/pam.d/common-password` 文件中定义它们。在两个文件中，质量设置都定义在这一行上：\n\n```\n\
  \ password     requisite   pam_pwquality.so\n```\n\n设置添加在行的末尾，格式如下：\n\n```\n directive=value\n\
  ```\n\n表 19.1 显示了 `pwquality.so` 库中可用的标准密码指令。\n\n| 指令 | 描述 |\n| --- | --- |\n| `difok`\
  \ | 指定新密码与旧密码相比的字符变化数量 |\n| `enforce_for_root` | 指定密码强制规则是否适用于 root 用户账户 |\n| `maxrepeat`\
  \ | 指定允许重复的字符最大数量 |\n| `minlen` | 指定密码最小长度 |\n| `reject_username` | 如果密码中包含正向或反向的用户名，则拒绝密码\
  \ |\n| `retry` | 指定允许的密码尝试次数 |\n\n表 19.1 PAM 密码标准指令\n\n您发会在表 19.1 显示了 `pwquality.so`\
  \ 复杂度指令。\n\n| 指令 | 描述 |\n| --- | --- |\n| `dcredit` | 数字数量 |\n| `lcredit` | 小写字母数量\
  \ |\n| `ocredit` | 特殊字符数量 |\n| `ucredit` | 大写字母数量 |\n\n表 19.2 PAM 密码复杂度指令\n\n`credit`\
  \ 指令有些奇怪，奇之处在于您需要将值指定为负数。例如，要指定一条要求至少包含一个数字、两个小写字母和一个大写字母的复杂度规则，您将使用以下规则：\n\n```\n\
  \ password     requisite   pwquality.so dcredit=-1  lcredit=-2\nucredit=-1\n```\n\
  \n所需的字符可以出现在密码的任何位置，并且密码值中出现的数量可以多于指定的最小值。\n\n## 限制 root 账户\n\nroot 用户账户非常重要，因为它对\
  \ Linux 系统的所有方面都拥有完全权限。您必须保护谁可以使用 root 用户账户以及他们从何处可以使用它。\n\n有几种安全最佳实践可以帮助限制 root\
  \ 用户账户在 Linux 系统上的使用方式。接下来，我们将讨论您应该考虑的基础安全理念。\n\n## 完全封锁 root 访问\n\n`su` 和 `sudo`\
  \ 命令允许任何用户账户在无需实际登录为 root 用户账户的情况下执行管理任务。这种方式更好，因为它们提供了一种记录谁在执行这些管理任务的方法。通过 `su`\
  \ 和 `sudo` 命令，可能根本没有必要允许 root 用户账户登录。\n\n为了防止任何人以 root 用户账户身份登录 Linux 系统，您可以使用一种涉及\
  \ `/etc/passwd` 文件的技巧。`/etc/passwd` 文件维护了关于用户账户的多个信息，包括当用户账户登录系统时 Linux 运行的 shell。锁定用户账户的技巧是将分配给\
  \ root 用户账户的默认 Bash shell 替换为 `/usr/sbin/nologin` shell，如下所示：\n\n```\n root:x:0:0:root:/root:/usr/sbin/nologin\n\
  ```\n\n`nologin` shell 不产生可用的 shell；它只是在控制台上显示一条消息：\n\n```\n $ /usr/sbin/nologin\n\
  This account is currently not available.\n$\n```\n\n当您将其分配为用户的 shell 时，该账户无法登录系统，只能看到输出消息。为\
  \ root 用户账户设置此项可以防止其能够登录，但 `su` 命令仍然可以正常工作。\n\n## 从特定设备阻止 root 访问\n\n对于使用物理连接到系统的控制台的\
  \ Linux 系统，您可能希望阻止任何人走到系统前并以 root 用户账户登录。\n\n要实现这一点，请在系统上创建一个 `/etc/securetty` 文件。`/etc/securetty`\
  \ 文件列出了 root 用户账户允许登录的设备设备列表。如果此文件是空的，root 用户账户将无法从任何物理控制台登录，尽管这不会阻止 root 用户账户通过网络登录。\n\
  \n## 从 SSH 阻止 root 访问\n\n为了阻止 root 用户账户从网络登录，您需要修改 OpenSSH 程序，该程序为您的 Linux 系统提供安全连接。您通过\
  \ OpenSSH 配置文件中的一个设置来实现这一点。\n\nOpenSSH 配置文件位于 `/etc/ssh/sshd_config`。用文本编辑器打开该文件，并查找此行：\n\
  \n```\n #PermitRootLogin yes\n```\n\n删除井号 (#) 符号使设置生效，并将 `yes` 改为 `no` 以阻止 root\
  \ 用户账户通过 SSH 登录。\n\n## 系统安全\n\n作为 Linux 管理员，您的工作是确保系统在所有条件下保持运行并保持安全。本节描述了一些可以帮助您完成该任务的技术。\n\
  \n## 数据分离\n\n当安装大多数 Linux 发行版时，默认情况下它们为虚拟目录根创建一个分区（参见第 11 章，“处理存储](#c011.xhtml_c011)”），使用系统上所有的可用磁盘空间。在整个磁盘上仅创建一个单独分区可以提供磁盘空间使用的最大灵活性；Linux\
  \ 系统和用户都可以访问整个磁盘。然而，这会导致问题。\n\nLinux 系统不断向虚拟目录写入数据。内核将每个内核事件记录到日志文件中。当每个用户登录系统时，该事件也会记录到日志文件中。在活跃的\
  \ Linux 系统上，系统向磁盘写入大量数据。\n\n但有了这些日志记录，有一个问题。如果 Linux 系统尝试向磁盘写入数据但虚拟目录文件系统中没有空间存储更多数据，系统将停止。这在多用户\
  \ Linux 系统中可能是一个关键性问题。\n\n如果所有磁盘空间都分配给单个分区，则同一块磁盘空间将用于管理系统文件和用户文件。如果用户决定将整个音乐库存储在\
  \ Linux 系统上，这可能会填满磁盘空间，而不为系统日志留出任何空间。如果系统日志停止，将无人登录 Linux 系统！\n\n在多用户环境中，将用户数据存储与系统存储分离始终是一个良好的做法。当您使用两个独立的分区时，如果用户填满了他们的存储分区，系统仍然可以在自己的存储分区中运行。\n\
  \n\n\n\n实现此操作的最方法是在磁盘上创建两个分区，然后将一个分配给根目录（`/`），将另一个分配给虚拟目录下的 `/home` 目录。\n\n## 磁盘加密\n\
  \n在当今世界，数据落入别有用之手已成为一个重大问题。有很多关于重要数据因笔记本被盗而破解、系统被破解以及恶意应用程序将数据上传到远程网站的故事。\n\n帮助保护数据的一种方法是对其进行加密，这使得数据即使泄露，攻击者使用这些数据也会变得困难得多。\n\
  \n然而，加密单个文件相当麻烦。你每次需要访问文件中的数据时都需要解密文件，并在完成后重新加密文件。此外，当你以解密状态使用这些文件时，你极易受到可以读取数据的攻击。\n\
  \n与其加密单个文件，解决方案是使用 `disk encryption`（磁盘加密）。磁盘加密在内核层工作，并加密所有存储在磁盘分区上的每一个文件。你不需要在应用程序中进行任何特殊操作。当你从加密磁盘上的文件读取数据时，内核会自动将其解密；当你向加密磁盘上的文件写入数据时，内核会自动对其进行加密。\n\
  \n`Linux Unified Key Setup (LUKS)` 应用在处理文件系统上的文件时充当媒介。它使用两个组件在内核和应用程序之间建立接口：\n\n\
  *   `dm-crypt`: 该模块插入内核，并提供虚拟映射驱动器与物理驱动器之间的接口。它通过 `/dev/mapper` 区域来实现。\n*   `cryptmount`:\
  \ `cryptmount` 命令创建虚拟映射驱动器，并通过 `dm-crypt` 模块将其连接物理驱动器。这确保所有传递到虚拟驱动器的数据在存储到物理驱动器之前经过加密。\n\
  \n## 限制应用程序\n\n就像繁忙的高速公路一样，如果你的 Linux 系统支持多个用户运行多个应用程序，有时会发生冲突。恶意应用程序可能会尝试访问属于另一个应用程序的数据（无论无意还是故意），从而给其他应用程序带来问题。\n\
  \n保护应用程序相互隔离的一种方法是引入 `chroot jail`（chroot 监狱）。`chroot` 工具在标准 Linux 虚拟文件系统中的新根目录结构中运行命令。该命令执行的所有磁盘访问都被限制在新的根目录结构中。\n\
  \n`chroot` 工具的格式为：\n\n```\nchroot starting_directory command\n```\n\n第一个参数指定启动新根目录结构的位置。第二个参数定义在新结构内运行的命令。当命令运行时，它引用的是相对于新根目录结构的文件和目录，而不是系统的根目录结构。你可以在\
  \ Linux 系统虚拟文件系统中的任何位置创建 chroot jail。\n\n### 防止未经授权的重启\n\n如果你的 Linux 服务器位于公共可访问区域，你可能需要采取预防措施防止攻击者重启服务器并获取控制权。你可以遵循三个常见做法来防止这种情况。\n\
  \n#### 防止访问 BIOS/UEFI\n\n当你启动计算机系统时，它使用基本输入输出系统（BIOS）或较新的统一可扩展固件接口（UEFI）来控制系统的启动方式。访问这些工具中的任何一个都可以允许攻击者将系统引导至\
  \ DVD 或或其他便质介。\n\n为了限制，启用 BIOS 或 UEFI 软件中的密码功能始终是一个好主意。分配密码后，你必须输入密码才能进入 BIOS 或\
  \ UEFI 菜单进行更改。\n\n#### 防止访问 GRUB 引导程序\n\n在启动过程中，当 Linux 开始启动时，它使用 GRUB 引导程序从硬盘加载相应的操作系统镜像。GRUB\
  \ 系统还提供了一种方法，让你退出启动过程并访问 GRUB 菜单，你可以在那里更改 Linux 系统启动的位置或方式。\n\n为了保护你的 Linux 系统免受物理攻击，你还应该为\
  \ GRUB 引导程序系统设置密码，防止未经授权的用户访问 GRUB 菜单。由于 GRUB 配置文件是明文，为了最大的安全性，你应该在将密码值存储到配置文件之前对其进行加密。\n\
  \n在基于 Debian 的系统上，请使用 `grub-mkpasswd-pbkdf2` 工具：\n\n```\n$ grub-mkpasswd-pbkdf2\n\
  Enter password:\nReenter password:\nPBKDF2 hash of your password is\ngrub.pbkdf2.sha512.10000.FE548777A9E101604D00DB\n\
  610E6BBB8E2269D4E98E17C1533C3B64EE3305B21D4F8AE089EE900668C78FCA4BE429D906ED104\n\
  9A8EF5C80A7621E5E17866DC556.250AAB4CD88CB2FB80D29D04DF3C381946A76AC9E1059B2C109\n\
  015217A63422C748A4E6E642517E15659FB69C4EAE55D953A4484C9C0D88DE37C099EAD79C27B\n\
  $\n```\n\n创建加密密码后，你可以将其添加到 GRUB 配置文件的密码设置中。在 Ubuntu 系统上，该文件为 `/etc/grub.d/40_custom`。添加以下行：\n\
  \n```\nset superuser “userid”\npassword_pbkdf2 userid password\n```\n\n其中 `userid`\
  \ 是你想要用于登录 GRUB 引导菜单的用户账户，`password` 是由 `grub-mkpasswd-pbkdf2` 工具提供的值。\n\n对于基于 Red\
  \ Hat 的系统，生成密码的工具是 `grub-md5-crypt`。添加到 GRUB 菜单文件中的行如下：\n\n```\npassword --md5 password\n\
  ```\n\n现在，当你重启 Linux 系统时，它会在允许你进入 GRUB 菜单之前提示用户账户和密码。\n\n#### 禁用 Ctrl+Alt+Del 键组合\n\
  \nWindows 自自早期以来一直使用 Ctrl+Alt+Del 键组合（通常称为“三指礼”）来重启整个系统。这一操作已引入 Linux 世界，并被大多数 Linux\
  \ 发行版支持。\n\n如果你的 Linux 系统有向其他人开放的物理控制台，那么禁用 Ctrl+Alt+Del 键组合重启系统是一个好主意。如何禁用键组合取决于系统使用的启动方法。\n\
  \n对于使用 SysV init 方法的系统，Ctrl+Alt+Del 操作在 `/etc/inittab` 文件中定义：\n\n```\nca::ctrlaltdel:/sbin/shutdown\
  \ -t3 -r now\n```\n\n键组合触发 `/sbin/shutdown` 程序，该程序启动 Linux 系统的关闭。为了防止这种情况，你只需要修改键组合运行的程序。例如，使用\
  \ `logger` 应用程序仅记录事件：\n\n```\nca::ctrlaltdel:/bin/logger -p authpriv.warning -t\
  \ “Ctrl+Alt+Del was ignored”\n```\n\n现在，如果有人尝试使用 Ctrl+Alt+Del 键组合，该事件将在系统标准日志文件中触发条目，而不会重启系统。\n\
  \n对于使用 systemd 启动方法的系统，你需要使用 `systemctl` 命令禁用 `ctrl-alt-del.target` 目标：\n\n```\n\
  $ sudo systemctl mask ctrl-alt-del.target\n```\n\n现在，systemd 也会忽略 Ctrl+Alt+Del 键组合。\n\
  \n### 限制未批准的任务\n\n`at` 和 `cron` 工具允许用户在未登录系统时调度任务。在某些环境中，这可能是一个安全问题并需要防止。\n\n`at`\
  \ 和 `cron` 工具都提供了黑名单和白文件，用于拒绝或允许用户账户调度任务。这些文件如下：\n\n*   `/etc/at.allow`\n*   `/etc/at.deny`\n\
  *   `/etc/cron.allow`\n*   `/etc/cron.deny`\n\n\n\n\n\n正如文件名所示，`.allow` 文件包含允许调度作业的用户账户列表，而\
  \ `.deny` 文件则包含被禁止调度作业的用户账户列表。Linux 检查这些文件的顺序可能有点复杂：\n\n1. 如果在 `.allow` 文件中找到了某个用户，则允许其调度作业，且不再进行后续检查。\n\
  2. 如果在 `.allow` 文件中未找到该用户，系统将会检查 `.deny` 文件。\n3. 如果在 `.deny` 文件中找到了该用户，则不允许其调度作业。\n\
  4. 如果在 `.deny` 文件中未找到该用户，则允许其调度作业。\n\n因此，在默认情况下，如果 `.allow` 和 `.deny` 文件都为空或不存在，所有用户账户都允许在\
  \ Linux 系统上调度作业。\n\n### 1. 横幅与消息\n\n向用户提供信息是 Linux 系统管理员任的另一项至关重要的工作。Linux 提供了多种方法，让你可以在用户登录系统时向他们展示预设的消息。\n\
  \n* `/etc/issue`：在控制台登录提示符出现之前，系统会显示 `issue` 文件的内容。这通常用于向系统上的攻击者显示法律免责声明和警告。\n*\
  \ `/etc/issue.net`：在网络登录（如 SSH 连接）提示符出现之前，系统会显示 `issue.net` 文件的内容。\n* `/etc/motd`：在用户登录控制台或终端会话后，系统会立即显示\
  \ `motd` 文件的内容（message of the day 的缩写）。这通常用于信息性消息，例如系统是否存在硬件故障或即将进行计划停机。\n* `/usr/bin/wall`：允许系统管理员向当前登录到系统的所有用户发送交互式消息。这通常用于紧急关机，提醒用户在关机前保存工作。\n\
  \n### 2. 限制 USB 设备\n\n虽然 USB 设备让我们的生活变得更加方便，它们也带来了一些安全隐忧。对于负责保护系统数据的管理员来说，轻松插入便携存储设备并复制文件的能力可能是一场噩梦。\n\
  \n对于需要高级别数据保护系统，防止用户插入 USB 存储设备拷贝数据是一个好主意。虽然没有单一的命令可以完成此任务，但你可以利用 `modprobe` 工具的工作原理来实现变通方案。\n\
  \n当用户插入 USB 存储设备时，内核会自动查找支持该设备的模块。如果没有安装该模块，它会调用 `modprobe` 工具自动加载相应的内核模块来支持该设备。`modprobe`\
  \ 工具使用配置文件来定义其运行方式以及在何处查找模块文件。配置文件存储在 `/etc/modprobe.d` 目录下。\n\n除了配置文件，`modprobe.d`\
  \ 目录下还有 `blacklist.conf` 文件。`blacklist.conf` 文件定义了禁止加载到内核的模块。因此，一种变通方案是阻止用于与 USB\
  \ 存储设备接口的模块加载。\n\n当你安装 USB 存储设备时，内核会加载两个模块：`uas` 和 `usb_storage`。为了防止这种情况发生，请打开\
  \ `blacklist.conf` 文本并添加这些行：\n\n```\nblacklist uas\nblacklist usb_storage\n```\n\
  \n保存文件并重启 Linux 系统。现在，如果用户插入 USB 存储设备，系统将忽略加载与设备接口所需模块的内核请求。然而，它仍然允许其他类型的 USB 设备（如键盘和鼠标）正常运行。\n\
  \n### 3. 寻找麻烦\n\n如今互联网上充斥着病毒、恶意软件和间谍软件，很难追踪哪些应用程序会对你的系统产生问题。虽然与 Windows 系统相比，针对\
  \ Linux 系统的病毒确实较少，但它们仍然存在，你仍必须保持警惕以保护你的系统。\n\n作为 Linux 管理员，你的工作是关注可能针对你 Linux 系统的攻击。美国国土安全部与非营利组织\
  \ MITRE 公司签约，公开发布信息系统安全警报，称为“通用漏洞与披露”（Common Vulnerabilities and Exposures, CVE）。\n\
  \nMITRE 维护着一个已发布 CVE 事件数据库，并为每个条目分配一个唯一的 CVE 标识符。你可以在 `https://cve.org` 网站查看当前发布的\
  \ CVE 事件。\n\n每个 CVE 事件都描述了该事件涉及的风险以及你作为 Linux 管理员应该采取的步骤来降低风险。监控 CVE 数据库以发现针对 Linux\
  \ 系统的新攻击至关重要。每个 CVE 都使用通用漏洞评分系统 (CVSS) 分配值，该值表示漏洞的严重程度。\n\n有多种工具可以扫描 Linux 系统以寻找\
  \ CVE 中列出的漏洞。`安全内容自动化协议 (SCAP)` 是由美国国家标准技术研究院 (NIST) 维护的一项标准，而 `OpenSCAP` 软件包提供了一套工具，用于扫描\
  \ Linux 系统并寻找 SCAP 定义的漏洞。互联网安全中心 (CIS) 也提供了用于扫描漏洞的基准。\n\nLinux 环境的另外两个常用工具是 `高级入侵检测环境\
  \ (AIDE)` 和 `Rootkit hunter (rkhunter)`。这些工具并不扫描漏洞，而是对 Linux 系统上的常用配置文件拍摄快照，然后监控配置文件的更改，并在检测到任何更改时通知你。\n\
  \n### 4. 审计\n\n你 Linux 系统上提供的标准系统日志提供了关于 Linux 系统运行情况的大量信息，但它们并不能涵盖所有内容。某些发生的事件不会被记录，例如当标准用户账户访问了他们不应访问的文件，或者外部攻击者从网络探测你的系统时。\n\
  \n跟踪这类信息需要比标准 rsyslog 日志事件更健壮的安全审计系统。`auditd` 软件包为我们提供了这种额外的日志记录。\n\n`auditd` 软件包允许你定义自己的安全规则，以监控并记录许多不同类型的系统事件，例如以下事件：\n\
  \n* 用户对文件和目录的访问\n* 应用程序执行系统调用\n* 用户运行特定的命令\n* 用户的网络访问\n* 外部主机发起的连接尝试\n\n你通过创建规则来定义要监控的事件。你可以创建三种类型的规则：\n\
  \n* 系统规则：记录应用程序执行的系统调用\n* 文件系统规则：记录对文件和目录的访问\n* 控制规则：修改 `auditd` 行为的规则\n\n你可以在 `/etc/audit/audit.rules`\
  \ 文件中定义规则，也可以使用 `auditctl` 工具即时定义。使用 `auditctl` 工具定义的规则仅在系统重启前有效。添加到 `audit.rules`\
  \ 文件中的规则是持久的。\n\n## 网络安全\n\n[content] \n\n将你的 Linux 系统连接到网络，就像把房子的正门向公众敞开。网络上的任何设备都可以尝试从网络访问你的\
  \ Linux 系统。本节描述了当 Linux 系统连接到网络时，你可以采取的帮助保护系统的基本安全措施。\n\n### 拒绝主机\n\n\n\n\n\n你可以实现的最基础的网络安全功能是使用\
  \ `/etc/hosts.deny` 文件。`/etc/hosts.deny` 文件创建了一个主机黑名单，用于列出你不允许连接到你 Linux 系统网络资源的主机。Linux\
  \ 系统上的 TCP Wrappers 程序（在第 16 章中讨论过）会读取 `hosts.deny` 文件，并阻止这些主机访问你系统的尝试。你可以在 `hosts.deny`\
  \ 文件中按名称或 IP 地址列出主机。\n\n如果你想采取更激进的网络安全措施，可以使用 `/etc/hosts.allow` 文件。正如你可能猜到的，当 `hosts.allow`\
  \ 文件存在时，只有在该文件中找到的主机被允许访问 Linux 系统的网络资源。TCP Wrappers 处理 `hosts.allow` 和 `hosts.deny`\
  \ 文件的方式与 `at.allow` 和 `at.deny` 文件的方式相同。如果这两个文件都为空或缺失，则允许所有主机访问系统上的网络资源。\n\n###\
  \ 禁用未使用的服务\n\nLinux 系统上仍然存在许多遗留的网络应用程序。遗憾的是，其中许多遗留网络应用程序仍使用不安全的方法传输用户数据和应用程序数据。同样遗憾的是，许多\
  \ Linux 发行版可能仍默认激活这些遗留网络应用程序，为你的 Linux 系统提供了一个你可能都不知道存在的后门。\n\n这里列出了一些可能仍在运行的较常见遗留网络服务：\n\
  \n*   `FTP`：原始文件传输协议，`FTP` 使用 TCP 端口 `21` 和 `22` 以明文形式跨网络发送用户帐户和应用程序数据。\n*   `Telnet`：原始远程终端应用程序，`telnet`\
  \ 也使用 TCP 端口 `23` 以明文形式跨网络发送所有用户和应用程序数据。\n*   `Finger`：一种旧的遗留应用程序，提供远程查找服务以寻找 Linux\
  \ 系统上的用户。该工具已被破解，现在通常不再安装，但你可以在 TCP 端口 `79` 上找到它。\n*   `Mail services`：如果你的 Linux\
  \ 系统不需要发送和接收电子邮件，那么卸载任何可能已并在后台静运行的邮件应用程序是一个好主意。最常用的 Linux 邮件包是 `sendmail` 和 `Postfix`。它们都使用\
  \ TCP 端口 `25` 接收来自远程主机的邮件消息。\n\n### 更改默认端口\n\n应用程序为了在网络上通信，必须使用网络端口。端口是分配给应用程序的唯一数字，这样当远程客户端与服务器通信时，服务器知道将连接发送给哪个应用程序。\n\
  \n网络端口分为三类：\n\n*   `Well-known ports`（已知端口）：`0` 到 `1023` 之间的端口，由互联网数字分配机构（IANA）正式分配给特定应用程序。只有具有\
  \ root 权限的进程可以使用这些端口。\n*   `Registered ports`（注册端口）：`1024` 到 `49151` 之间的端口，已 IANA\
  \ 注册但未正式分配。\n*   `Private ports`（私有端口）：大于 `49151` 的端口，任何应用程序都可以使用。\n\n大多数流行的网络应用程序已由\
  \ IANA 分配了已知端口，预计会被这些端口。这些端口列在 Linux 系统的 `/etc/services` 文件中。\n\n作为额外的安全层，某些 Linux\
  \ 管理员倾向于将通常使用已知端口的应用程序移动到私有端口。这可能会暂时阻止试图利用该应用程序的攻击者，因为应用程序没有在其通常应该监听的端口上监听连接。然而，许多高级黑客使用端口扫描工具来寻找非标准端口上的应用程序。如果你将应用程序移动到私有端口，必须确保任何打算使用该应用程序的客户端都知道分配端口已更改。\n\
  \n### 在网络上使用加密\n\n如今，跨网络以明文发送任何类型的数据都不是好主意。与其使用遗留的 `FTP` 应用程序传输数据以及使用 `telnet` 使用远程终端，不如使用采用加密的新型应用程序，例如\
  \ `SSH`、`SCP`、`SFTP` 和 `HTTPS`。\n\n安全套层（SSL）协议以及较新的传输层安全（TLS）协议通常用于在数据穿越网络时对其进行加密。要在\
  \ Linux 系统上实现这些协议，你需要安装 `OpenSSL` 包（在第 2 章 中的“服务介绍”中讨论过）。\n\n`OpenSSL` 包并不提供实际的网络应用程序，而是一个提供在网络上发送和接收加密数据所需框架的库。`SSL`\
  \ 和 `TLS` 都需要使用加密数据的证书。它们使用 `PKI`，这需要服务器的私钥以及可以发送给单个客户端的公钥来验证身份并加密网络流量。练习 19.1 向你展示如何在移动式\
  \ USB 存储设备上创建受密码保护的加密分区。\n\n## 总结\n\n在当今世界，保护 Linux 系统有许多方面。大多数安全实践可以分为用户安全、系统安全和网络安全。对于用户安全，有许多不同的方法来验证用户并授权其访问资源。`Kerberos`\
  \ 包为多个网络服务器提供了一个集中登录系统。`LDAP` 包创建一个分布式数据库，用于定义资源和用户并授予用户访问网络资源的权限。`RADIUS` 包是一个较简单的认证包，通常用于交换机和路由器等网络设备。`TACACS+`\
  \ 协议由思科开发，用于提供更高级的网络认证过程。\n\n系统安全涉及保护 Linux 系统环境本身。系统安全的一个步骤是使用单独的分区存放操作系统文件和用户数据文件。这样，即使过度热忱的学生填满了磁盘空间，也不会停止操作系统。磁盘加密现在也成为一个重要的工具，特别是在在移动设备上存储数据时。保护应用程序免受相互干扰是另一项系统安全功能。通过\
  \ `chroot` 监狱进程，你可以在主文件系统内创建单独的文件系统区域，以便应用程序无法相互破坏的文件。\n\n网络安全现已成为一个热门话题，Linux 提供了几个多个工具来提供帮助。`hosts.deny`\
  \ 和 `hosts.allow` 文件允许你在通过网络通信时阻止特定主机或仅允许特定主机访问。如果你的 Linux 系统包含某些遗留网络工具的程序包（如 `FTP`、`telnet`\
  \ 和 `Finger`），那么确保这些软件包已被禁用且用户无法运行它们是一个好主意。如果你想尝试迷惑潜在的攻击者，可以将标准应用程序使用的默认 `TCP` 或\
  \ `UDP` 端口改为替代端口号。最后，本章讨论了使用 `OpenSSL` 包为网络流量提供 SSL  和 TLS 级别的加密。\n\n## 考试要点\n\n\
  \n\n\n\n## 描述 Linux 中提供的各种身份验证方法。\n\n对于网络服务器，最常用的四种用户验证方法是：`Kerberos`，它使用单点登录方法来验证用户；`LDAP`，它包含了授权和验证；`RADIUS`，它提供简单的身份验证过程；以及通常用于网络设备的\
  \ `TACACS+`。Linux 还支持多种双因子身份验证方法，包括使用指纹、虹膜扫描和人脸识别等生物识别数据；软件和硬件令牌（它们提供标识用户的数字证书）；以及\
  \ `PKI`，它允许用户创建公钥和私钥，这样他们就可以隐藏私钥仅向服务器公开公钥。\n\n## 描述在 Linux 系统上应该考虑的各种系统安全类型。\n\n\
  系统数据与用户数据的分离是一项你可以实现的相对简单的安全功能。通过为用户数据创建单独分区，你可以防止用户占用整个系统磁盘空间导致服务器停止。在存储设备可能会离开物理区域的环境中（如笔记本电脑或外部存储设备），使用加密存储非常。使用\
  \ `chroot` 限制应用程序有助于防止意外或恶意程序获取其他程序使用的数据。同样，对于需要控制数据离开服务器的系统，禁用 USB 存储设备是一个很好的选择。如果你的\
  \ Linux 系统位于易受的物理位置，通过禁用 `Ctrl+Alt+Del` 组合键并实施 BIOS/UEFI 密码以及 GRUB 启动菜单密码来防止未经未经重启这也是一个好主意。\n\
  \n## 解释在网络上保护 Linux 系统的不同方法。\n\n为了保护网络上的 Linux 系统，你可以创建主机黑白名单。`hosts.deny` 文件允许你阻止可疑主机访问你系统上的网络资源。如果你愿意，也可以使用\
  \ `hosts.allow` 文件仅允许特定主机连接到系统上的应用程序。禁用任何未使用的网络应用程序也是好主意，特别是那些以明文发送接收用户账户和数据的程序，如\
  \ `FTP`、`Telnet` 和 `Finger`。更改网络应用程序使用的默认端口可能有助于威慑攻击者在你的系统中找到它们。最后，对 Linux 系统上的任何网络应用程序加入加密是一个好主意。`OpenSSL`\
  \ 包为任何应用程序提供 SSL 和 TLS 加密服务。\n\n## 复习题\n\n你可以在附录 A 中找到习题的答案。\n\n1. 哪种身份验证方法向用户发放票据，并有助于在服务器网络中实现单点登录功能？\n\
  \    1. `LDAP`\n    2. `Kerberos`\n    3. `RADIUS`\n    4. `TACACS+`\n    5. `Biometrics`\n\
  \n2. Mary 想使用指纹识别器让她的用户验证 Linux 系统。她应该考虑实现哪种身份验证方法？\n    1. `LDAP`\n    2. `Tokens`\n\
  \    3. `Biometrics`\n    4. `PKI`\n    5. `Kerberos`\n\n3. Jaime 有兴趣使用分布式数据库方法来授权用户访问位于多个网络服务器上的资源。哪种身份验证方法最适合她？\n\
  \    1. `LDAP`\n    2. `Kerberos`\n    3. `Tokens`\n    4. `RADIUS`\n    5. `PKI`\n\
  \n4. Fred 想要阻止用户从任何控制台或终端会直接用 root 用户账户登录。他做的最好的方法是什么？\n    1. 实现生物识别。\n    2. 实现\
  \ `tokens`。\n    3. 使用 `Kerberos` 身份验证。\n    4. 从 `/etc/passwd` 文件中删除 root 用户条目。\n\
  \    5. 将 root 用户的默认登录 shell 设置为 `/usr/sbin/nologin`。\n\n5. 你应该将目录放在单独的分区上以分离用户数据和系统数据？\n\
  \    1. `/usr`\n    2. `/home`\n    3. `/etc`\n    4. `/sbin`\n    5. `/bin`\n\n\
  6. Sally 担心一个允许客人连接到她的 Linux 系统并访问数据库的应用程序。她可以做什么将该应用程序限制在 Linux 服务器上的特定目录结构，使其无法访问系统数据？\n\
  \    1. 阻塞应用程序网络端口。\n    2. 将应用程序端口移动到私有端口号。\n    3. 将应用程序放在加密分区中。\n    4. 使用 `chroot`\
  \ 运行应用程序。\n    5. 将应用程序放在单独的分区中。\n\n7. Ted 想提供磁盘级加密，这样用户在存储文件时不需要单独加密文件。他应该使用哪种\
  \ Linux 功能？\n    1. `LUKS`\n    2. `chroot`\n    3. `auditd`\n    4. `PKI`\n   \
  \ 5. `Kerberos`\n\n8. Ned 在日志中注意到一个用户账户每天中午调度一个耗尽所有系统资源的任务。他如何防止该用户账户这样做？\n    1.\
  \ 为该用户账户使用 `chroot`。\n    2. 使用 `nologin` 作为用户的默认 shell。\n    3. 将用户账户添加到 `/etc/cron.deny`\
  \ 文件中。\n    4. 将用户账户添加到 `/etc/hosts.deny` 文件中。\n    5. 创建 `/etc/motd` 消息告诉用户不要调度大型任务。\n\
  \n9. Tom 看到一个攻击者不断尝试破解用户账户。他可以做什么来缓解这种情况？\n    1. 为用户账户使用 `chroot`。\n    2. 使用 `nologin`\
  \ 作为用户的默认 shell。\n    3. 将用户账户添加到 `/etc/cron.deny` 文件中。\n    4. 将用户账户添加到 `/etc/hosts.deny`\
  \ 文件中。\n    5. 创建 `/etc/motd` 消息告诉用户不要调度大型任务。\n\n10. 尽管 出了出了警告，Fred 仍然看到用户使用不安全的\
  \ FTP 向他的服务器传输文件。他该如何停止这种行为？\n    1. 在 `/etc/motd` 中放置消息告诉用户停止。\n    2. 将 FTP 应用程序移动到不同的网络端口。\n\
  \    3. 将用户账户添加到 `/etc/hosts.deny`。\n    4. 将用户账户添加到 `/etc/cron.deny`。\n    5. 移除\
  \ FTP 客户端和服务器软件包。\n\n# 第五部分：排除系统故障\n\n# 第 20 章：分析系统属性与修复\n\n![](img/chaptersquare.png)\n\
  \n即使是维护良好的 Linux 系统也会遇到问题。新的或经过修改的应用程序引入了不同的性能变量，不可预见的事件会导致停机，老化的硬件组件可能会故障。减少这些影响需要理解故障排除技术和工具，以及各种系统组件之间的相互作用。\n\
  \n## 排除网络故障\n\n当网络问题发生时（它们会发生的），请制定一个故障排除计划。首先识别症状，检查最近的网络配置更改，并制定潜在的问题原因理论。接下来，以开放系统互连（OSI）模型为指南，查看硬件项目（例如，电缆），进入数据链路层（例如，网卡驱动程序），继续到网络层（例如，路由器），依此类推。\n\
  \n### 探索网络问题\n\n为了正确创建故障排除计划，你需要理解各种网络配置和性能组件。理解这些元素有助于建立关于问题原因的理论，并帮助你通过 OSI 模型进行探索。\n\
  \n#### 加速运行\n\n熟悉一些网络术语和技术将帮助你排除网络问题并提高其性能。\n\n*   **带宽**：*带宽*是衡量一段时间内两个网络点之间传输的最大数据量的测量值。这种测量通常以每秒字节数表示。\n\
  \n\n\n\n\n-   例如，考虑道路设计。某些道路的设计是为了让车辆以 65 mph（约 105 km/h）的速度安全行驶。而其他道路只能处理速度约为 35\
  \ mph（约 56 km/h）的流量。\n\n-   **吞吐量 (Throughput)**：`Throughput` 是衡量在时间内两个网络点之间传输的实际数据量的。它与带宽的区别在于，带宽是最大速率，而吞吐量是实际速率。\n\
  \n-   由于网卡（NIC）故障或所使用的协议等因素，吞吐量可能无法达到最大带宽。回到道路的类比，虽然某些道路可以允许车辆以 65 mph 的安全行驶，但由于道路上有坑洼，某些车辆可能会行驶得慢。\n\
  \n-   **饱和 (Saturation)**：网络`saturation`（也称为`带宽饱和`）发生在网络流量超过容量时。在这种情况下，用毛巾类比非常有帮助。想象你有一条吸收了尽可能水分的毛巾。一旦它无法再吸收任何水，它就变得饱和了。\n\
  \n-   饱和有时称为`拥塞 (congestion)`。使用我们的交通类比，当特定道路上的车辆过多时，就会发生拥塞，流量就会变慢。\n\n-   **延迟\
  \ (Latency)**：`Latency` 是源端发送数据包与目的地接收数据包之间的时间。因此，`high latency`意味着慢，这通常是一个问题；而`low\
  \ latency`意味着快，这通常是人们追求的。\n\n-   高延迟通常由低带宽或饱和引起。此外，网络流量过载的路由器可能会导致高网络延迟。\n\n-  \
  \ `抖动 (Jitter)` 是一个用于指示网络平均延迟偏离较大的术语。对于视频等流媒体服务，抖动可能会产生严重的负面影响。\n\n-   **路由 (Routing)**：由于网络被分成若干段，你需要路由通过网络的各个分段将数据包从\
  \ A 点传输到 B 点。路由器连接这些网络段，并将 IP 数据包转发到指向最终目的地的相应网络段。\n\n-   路由器包含缓冲区，允许它们在出站队列过长时持有网络包。然而，如果路由器无法在合理的时间范围内转发其\
  \ IP 数据包，它将丢弃缓冲区中的数据包。这种情况通常发生在网络带宽饱和时。\n\n## 处理超时和丢包\n\n当网络包未能到达目的地时，就会发生`packet\
  \ drop`（也称为`packet loss`丢包）。不可靠的网线、故障的适配器、网络流量拥塞和性能不佳的设备是丢包的主要原因。\n\n用户数据 agram\
  \ 协议 (`UDP`) 不保证数据包的交付。因此，在采用 `UDP` 的 VoIP 服务中，轻微的丢包不会引起任何问题。大多数 VoIP 软件会补偿这些丢包。当你通过\
  \ VoIP 连接说话时，如果遇到轻微丢包，你可能会听到声音断断续续。\n\nTCP 保证数据包交付并重传任何丢失的数据包。因此，如果采用 `TCP` 的服务发生网络丢包，将会导致延迟。如果丢包是因为网络流量拥塞，在某些情况下，TCP\
  \ 数据包重传只会让情况恶化。请记住，`IP` 允许在缓冲区满且无法足够快地发送缓冲区包时丢弃包。这将导致 TCP 重传数据包。\n\n在网络通信中，`timeouts`通常是用于处理意外事件的预设时间段。例如，你打开网页浏览器并输入你想要访问的网站地址。该网站宕机了，但浏览器仍尝试连接。在预定时间（指定的超时时间段）之后，浏览器停止尝试连接并发出错误信息。\n\
  \n你可能由于多种原因遇到网络通信超时：\n\n-   系统宕机。\n-   使用了错误的 `IP` 地址。\n-   该系统未运行或未提供某服务。\n-  \
  \ 防火墙正在拦截流量。\n-   通往你系统的网络链路已断开。\n-   你系统上的网络接口配置不正确，或未与网络交换机协商出正确的网络参数。\n-   检查\
  \ `IPv4` 地址与 `IPv6` 地址的问题。\n-   `DHCP` 服务器向你的系统发放了错误的 `IP` 地址，导致 `IP` 冲突。\n-   网络流量拥塞导致丢包。\n\
  \n如果你或你的系统进程正遇到与网络通信相关的超时，这些每一项都值得探讨。\n\n## 解析域名\n\n在系统的完全限定域名 (FQDN) 和其 IP 地址之间进行翻译的过程被称为`name\
  \ resolution`（解析）。域名系统 (`DNS`) 是一种使用分布式数据库提供所需域名解析的网络协议。\n\n大多数系统只是简单地使用客户端 `DNS`，这意味着它们向其他服务器请求域名解析信息。使用\
  \ `/etc/resolv.conf` 和 `/etc/hosts` 文件配置客户端 `DNS` 已在第 7 章“配置网络连接](#c007.xhtml_c007)”中介绍。然而，关于域名解析问题和性能，你还有一些额外的事项需要了解。\n\
  \n-   **名称服务器位置**：使用客户端 `DNS` 时，涉及名称服务器选择，位置很重要。如果你在 `/etc/resolv.conf` 文件中设置的名称服务器在地球另一端，你的系统的域名解析速度将比选择物理位置更近的名称服务器慢。\n\
  -   **考虑缓存**：纯缓存名称服务器会将最近的解析查询结果保存在内存中。如果你仅使用客户端 `DNS`，可以考虑将系统配置为纯缓存服务器，使用 `dnsmasq`\
  \ 等软件。通过缓存域名解析，解析速度可以显著提高。\n-   **备服务器**：如果你为公司管理 `DNS` 服务器，除了主服务器外，考虑配置一个备服务器。该名称服务器从主服务器接收信息，并通过减轻主服务器负载来提高域名解析性能。\n\
  \n## 正确配置\n\n网络配置已在第 7 章中介绍。然而，还有一些可能帮助你排除故障的额外特殊主题。\n\n-   **接口配置**：在故障排除过程中，查看网卡的配置和状态至关重要。你可能需要查看其\
  \ IP 地址、MAC 地址、子网配置、错误率等。此外，理解配置项（例如网卡具有静态 IP 还是 DHCP 提供的 IP）也是该过程的一部分。\n-   注意，如果你在带有\
  \ `firewalld` 作为防火墙服务的系统使用 `NetworkManager`，当添加新网络设备时，它将自动添加到 `firewalld` 默认区域。如果默认区域设置为\
  \ `public`，网络设备将仅接受选定的入站网络连接。有关 `firewalld` 的更多信息，请参第 18 章“监控 Linux 防火墙](#c018.xhtml_c018)”。\n\
  -   **端口和套接字**：端口和套接字是 Linux 网络中的重要结构。理解两者的差异有助于故障排除。\n-   `port` 是协议（如 TCP 和 UDP）用于识别哪个服务或应用程序正在传输数据的数字。例如，端口\
  \ 22 是指定用于 OpenSSH 的已知端口，DNS 监听在端口 53。TCP 和 UDP 数据包的报头中同时包含数据包的源端口和目的端口。\n\n\n\n\
  \n\n*   到端口的程序连接称为 `socket`（套接字）。`network socket` 是网络连接两个端点中的一个。该端点位于本地系统并绑定到特定端口。因此，网络\
  \ socket 使用了 IP 地址（本地系统）和端口号的组合。\n\n*   **Localhost 与 Unix Socket**：localhost 标识和\
  \ Unix socket 通常用于如 SQL 等服务。能够区分二者非常有帮助。\n\n*   Localhost 是 `local loopback interface`（本地回环接口）的主机名，该接口在第\
  \ 7 章中首次描述。localhost 使用 127.0.0.1 的 IPv4 地址和 `::1` 的 IPv6 地址。基本上，它允许当前系统上的程序通过 TCP\
  \ 测试或实现网络服务，而无需使用外部网络结构。\n\n*   `Unix sockets`（也称为 Unix 域套接字）是与网络 socket 类似的端点。这些端点套接字不是跨网络跨系统的，而是你本地系统进程之间的。你系统的\
  \ Unix 域套接字执行进程间通信（IPC），其运行方式类似于 TCP/IP 网络。因此，这些 socket 也称为 `IPC sockets`。\n\n*\
  \   如果你在二者之间有一个配置选择，通常 Unix socket 提供的性能会比 localhost 好。这是由于系统在使用 localhost 时会采用消耗资源的正常网络行为，例如执行数据校验和和\
  \ TCP 握手。此外，由于特殊的 Unix socket 文件以及 Unix socket 理解文件权限的特性，你可以通过设置这些文件的访问权限来轻松实现访问控制。\n\
  \n*   **Adapters（适配器）** `Network adapters`（网络适配器）是允许网络通信的系统硬件。这些通信可以是线路或无线的。适配器还有\
  \ USB 形式，但通常不用于企业服务器环境。\n\n*   网络适配器常见的问题是硬件故障或失效以及驱动程序错误或效率低下。对于硬件故障，适配器上的错误率通常不应超过适配器\
  \ bps 吞吐率的 0.01%。\n\n*   **RDMA (远程直接内存访问)**：如果你的系统网络需要低延迟，可以考虑的技术是 `RDMA`。它允许客户端和服务器内存之间直接访问。结果是显著降低了网络延迟、更高的带宽，以及减少服务器\
  \ CPU 开销的额外好处。\n\n*   遗憾的是，这项技术需要特殊硬件。要在标准的 Linux 系统以太网 NIC 上使用它，你需要采用 `soft-RoCE`。该软件在汇融合以太网\
  \ (RoCE) 上提供 RDMA 功能。soft-RoCE 非常棒的地方在于，它的驱动程序是 Linux 内核的一部分，从 v4.8 版本开始。\n\n###\
  \ 查看网络性能\n\n启动排障过程需要了解各种使用的工具。在这里我提供了几张表格来帮助你选择工具。\n\n由于高延迟（缓慢）和网络饱和往往同时发生，表 20.1\
  \ 显示了你应该使用的用于解决或监控这些问题的工具。请记住，在使用这些工具之前，你应该已经知道你正在排障的网络段的带宽。\n\n| 命令 | 说明 |\n| ---\
  \ | --- |\n| `iperf`, `iperf3` | 执行网络吞吐量测试。`iperf` 命令是该工具的版本 2，而 `iperf3` 是版本 3。\
  \ |\n| `iftop -i adapter` | 以连续图表格式显示 `adapter` 的网络带宽使用情况（吞吐量）。 |\n| `mtr` | 以连续图表或报告格式显示从源到目的路径中前\
  \ 10 个路由器之间的近似传输时间丢丢包率百分比。 |\n| `nc` | 执行网络吞吐量测试。（称为 Netcat。） |\n| `netstat -s`\
  \ | 显示按协议划分的摘要统计，包含数据包速率但不包含吞吐量。该命令已废弃。 |\n| `ping`, `ping6` | 执行简单的 ICMP 数据包吞吐量测试，并显示往返时间等各项的统计数据。\
  \ |\n| `ss -s` | 显示按 socket 类型划分的摘要统计，包含数据包速率但不包含吞吐量。 |\n| `tracepath`, `tracepath6`\
  \ | 显示从源到目的之间每个路由器之间的近似传输时间，并发现沿途的最大传输单元（MTU）。 |\n| `traceroute`, `traceroute6`\
  \ | 显示从源到目的之间每个路由器之间的近似传输时间。 |\n\n表 20.1 检查高延迟、饱和的命令\n\n使用 `iperf` 工具进行吞吐量测试，你需要两个系统——一个作为服务器，另一个作为客户端。该工具必须安装在两个系统上，并且你需要通过防火墙允许访问默认端口\
  \ 5001（`iperf3` 为端口 5201）。在 Ubuntu 系统上设置并启动 `iperf` 服务器的截取示例在代码列表 20.1 中。\n\n`iperf`\
  \ 命令的 `-s` 选项告诉它作为服务器运行。`-t` 选项非常方便，因为服务将在指定的秒数后停止。这有助于避免使用 `Ctrl+C` 来停止服务器。\n\n\
  一旦你准备好服务端，请配置客户端并进行吞吐量测试。在 Rocky Linux 系统上设置并启动 `iperf` 客户端的截取示例在代码列表 20.2。虽然最后的输出摘要列出了\
  \ `Bandwidth`（带宽）列标题，但它实际上是在向你实现的吞吐量。\n\n注意，为 UDP 流量和 TCP 都添加了防火墙规则。这是由于在 `iperf`\
  \ 客户端使用了需要 UDP 的 `-b` 开关导致的。`iperf` 和 `iperf3` 工具有许多可用选项。代码列表 20.2 中使用的选项在表 20.2\
  \ 中描述。\n\n| 选项 | 说明 |\n| --- | --- |\n| `-c server-address` | 创建连接到位于 `server-address`\
  \ 服务器的客户端。 |\n| `-b size` | 将目标带宽设置为 `size` bits/sec（默认为 1 Mb）。 |\n| `-d` | 在客户端和服务器之间执行双向测试。\
  \ |\n| `-P n` | 创建并运行 `n` 个并行客户端线程。 |\n| `-e` | 提供增强输出。旧版本工具不可用。 |\n| `-i n` | 在周期性带宽报告之间暂停\
  \ `n` 秒。 |\n\n表 20.2 基础 `iperf` 客户端选项 |\n\n另一个测试吞吐量的方便工具是 Netcat 工具，其命令名为 `nc`。与\
  \ `iperf` 一样，你需要设置一个服务器和一个客户端来执行测试。代码列表 20.3 显示了在 Ubuntu 系统上设置 Netcat 服务器的示例。注意防火墙是如何修改以允许流量进入\
  \ Netcat 服务器所选端口 (8001) 的。\n\n`nc` 命令上的 `-l` 选项让进入进入模式并充当服务器。`8001` 参数告诉 Netcat\
  \ 在端口 `8001` 上监听。因为使用 Netcat 测试吞吐量，不需要显示任何接收到的数据。因此，接收到的数据被丢入黑洞文件（`/dev/null`）。\n\
  \n要使用 Netcat 进行测试，请使用一个向服务器发送数据包并允许你看到吞吐率的工具。`dd` 命令（涵盖第 12 章，“保护文件](#c012.xhtml_c012)”）效果良好，在\
  \ Rocky Linux 系统上进行测试的示例在代码列表 20.4 中。\n\n\n\n\n\n关于 `dd` 命令的注意：没有使用输出文件 (`of`) 选项。这强制命令的输出去到\
  \ STDOUT，然后通过管道 (`|`) 重定向到 `nc` 命令。`nc` 命令将输出内容作为数据包通过网络发送到 Netcat 服务器的 IP 地址 (`192.168.0.104`)\
  \ 端口 `8001`，监听服务器在该处接收这些数据包。`-i 2` 选项告诉 Netcat 在空闲 2 秒后退出并返回命令行。\n\n当 `dd` 完成其操作时，会显示吞吐率。你可以通过增加\
  \ `dd` 命令的 `bs` 选项指定的数据量以及通过 `count` 切换指定的发送次数来增加所发送的测试流量。在 Listing 20.4 示例中，仅发送了两次\
  \ 1 Mb 的数据。\n\n高延迟有时是由路由器过载引起的。硬件故障或配置不当（例如路由器的 MTU 设置过低）也会导致该问题。`tracepath` 和 `traceroute`\
  \ 工具不仅可以显示数据包通过网络路由器的路径，还可以提供吞吐量信息，允许你精确定潜在的问题区域。\n\n`mtr` 工具可以提供良好的图形显示或简单的报告，显示数据包的路径、旅行时间以及抖动等项目。Listing\
  \ 20.5 显示了使用 `mtr` 生成静态报告的示例。\n\n`mtr` 命令的 `-o` 选项允许你指定要查看的统计信息。在此示例中，选择了包丢失 (`L`)、丢弃\
  \ (`D`)、平均旅行时间 (`A`) 和抖动 (`J`)。`-c` 切换允许你设置数据包通过路由器的次数，`-r` 选项指定你需要静态报告。要显示连续的图形化界面，请省略\
  \ `-c` 和 `-r` 选项。最后一个 `mtr` 参数是目标 IP 地址。\n\n故障或失效的适配器也可能导致高延迟。如果你怀疑错误、丢包或超时导致了网络问题，请尝试使用\
  \ Table 20.3 中的工具来显示这些统计数据。\n\n| 命令 | 说明 |\n| --- | --- |\n| `ethtool -S adapter`\
  \ | 显示 `adapter` 摘要统计信息。 |\n| `ifconfig adapter` | 显示 `adapter` 摘要统计信息。此命令已废用。 |\n\
  | `ip -s link show adapter` | 显示 `adapter` 摘要统计信息。 |\n| `netstat - i adapter` |\
  \ 显示 `adapter` 摘要统计信息。要查看时间变化，请添加 `-c #` 切换，其中 `#` 是显示之间的秒数。此命令已废用。 |\n\nTABLE 20.3\
  \ 查找故障/损坏网络适配器的命令\n\n使用 `ip` 工具的片段如 Listing 20.6 。注意，尽管没有丢包，但它确实显示错误率徘徊在 0.05% 左右（RX\
  \ 或 TX 数据包 / RX 或 TX 错误）。任何超过 0.01% 的比率都足以认为适配器存在故障。\n\n如果你遇到了相当棘手的网络问题，直接查看在网络传输的数据包可能是值得的。执行此操作的工具有很多，例如网络嗅探器和数据包分析器。三个流行的工具是\
  \ Wireshark、`tshark` 和 `tcpdump`。\n\nWireshark（一个 GUI 程序）和 `tshark`（也称为基于终端的 Wishark）关联紧密，这在安装时会引起困惑。Table\
  \ 20.4 列出了本书涵盖的每个发行版中获取正确工具所需的包名。\n\n| 发行版 | Wireshark GUI 包 | `tshark` 包 |\n| ---\
  \ | --- | --- |\n| Rocky Linux 9 | `wireshark-gnome` | `wireshark-cli` |\n| Fedora\
  \ 41 | `wireshark` | `wireshark` |\n| OpenSUSE Leap 15 | `wireshark` | `wireshark`\
  \ |\n| Ubuntu 24.04 LTS | `wireshark` | `tshark` |\n\nTABLE 20.4 列出 Wireshark GUI\
  \ 和 `tshark` 包名\n\n一旦安装了正确的包，你就可以使用该工具分析数据包。在 Ubuntu 系统上使用 `tshark` 的简单片段示例见 Listing\
  \ 20.7。`tshark` 命令的 `-i` 选项允许你指定嗅探数据包的接口。`-c` 切换允许你指定捕获包的数量。\n\n`tshark` 和 `tcpdump`\
  \ 都允许你将嗅探到的数据存储到文件中。之后，如果你喜欢通过 GUI 查看数据，可以使用 Wireshark 工具查看包信息。\n\n### 检查网络配置\n\n\
  在网络排排除过程中，你可能想要检查各种网络配置。网络适配器配置在 Chapter 7 中介绍过。你可以使用 Table 20.3 中列出的工具以及 `nmcli`\
  \ 工具来检查适配器设置。\n\n在本地网络段内，路由器不使用 IP 地址来定位系统。相反，它们使用系统网络适配器的介质访问控制 (MAC) 地址。MAC 地址通过地址解析协议\
  \ (ARP) 表或 IPv6 地址邻居发现 (NDISC) 表映射到其服务器的 IPv4 地址。错误的映射或重复的 MAC 地址会对你的网络造成性影响。Table\
  \ 20.5 包含了你可以用于调查此问题的命令。\n\n| 命令 | 说明 |\n| --- | --- |\n| `arp` | 显示网络邻域的 ARP 表。检查错误或重复的\
  \ MAC 地址。 |\n| `ip neigh` | 显示网络邻域的 ARP 和 NDISC 表。检查错误或重复的 MAC 地址。 |\n\nTABLE 20.5\
  \ 检查错误的 MAC 映射或重复的命令\n\n你自己的服务器错误的 DNS 信息很棘手。此外，如果你考虑更改客户端 DNS 配置，有一些工具可以帮助你调查查询响应缓慢的问题。Table\
  \ 20.6 中的命令是引导你调查的良好工具。\n\n| 命令 | 说明 |\n| --- | --- |\n| `host FQDN` | 为 DNS 服务器查询\
  \ `FQDN` 并显示其 IP 地址。检查返回的 IP 地址的正确性。 |\n| `dig FQDN` | 对 DNS 服务器执行 `FQDN` 查询并显示与其关联的所有\
  \ DNS 记录。检查返回信息的正确性。 |\n| `nslookup` | 在交互模式或非交互模式下执行各种 DNS 查询。检查返回信息的正确性。 |\n|\
  \ `whois` | 对 Whois 服务器进行查询并显示存储在该处的 `FQDN` 信息。检查返回信息的正确性。 |\n\nTABLE 20.6 研究名称服务器响应的命令\n\
  \n`nslookup` 工具对于测试 DNS 查询速度非常方便。你在命令后跟上 FQDN，然后跟上你想要测试的 DNS 服务器。将其与 `time` 命令配合使用收集查询时间估计，如片段\
  \ Listing 20.8 所示。\n\n网络映射 (`nmap`) 工具通常用于渗透测试。然而，它对于网络排排除也非常有用。尽管通常不是默认安装，但大多数发行版的标准存储库中都有\
  \ `nmap` 包。\n\n你可以使用 `nmap` 运行许多扫描。Listing 20.9 中的片段示例显示了在系统防火墙内部使用 `nmap` 来查看哪些端口提供哪些服务（通过\
  \ `-sT` 选项）。\n\n你可以使用 `nmap` 扫描整个网络段并要求映射器对每个系统进行指纹识别，以识别运行其上的操作系统（通过 `-O` 选项）。执行此扫描需要超级用户权限，如片段\
  \ Listing 20.10 所示。\n\n## 排除存储问题\n\n\n\n\n\n数据存储是你的系统可能会遇到问题的领域之一。存储问题通常集中在硬件故障、磁盘\
  \ I/O 延迟以及磁盘空间耗尽。将在接下来的章节中重点关注这三个问题。\n\n### 文件系统空间耗尽\n\n没有什么比磁盘空间耗尽导致应用程序崩溃更能破坏系统运行时间统计了。两种协助故障排除和监控文件系统空间的工具是\
  \ `du` 和 `df` 命令，它们在第 11 章“处理存储”中介绍过。\n\n`df` 工具允许你查看整体空间使用情况。在列表 20.11 的示例中，通过\
  \ `-t` 选项仅查看 `ext4` 文件系统，并以人类可读格式（`-h`）显示结果，提供了简洁的显示。如果你看到某个文件系统的使用率超过预期百分比，可以通过\
  \ `du` 命令定位文件系统上的潜在问题区域。首先，通过查看文件系统的挂载点目录获取摘要，并使用 `-d 1` 选项仅显示第一级子目录使用的空间。列表 20.12\
  \ 显示了一个挂载点为 `/` 目录的文件系统示例。\n\n在找到潜在问题子目录后，开始通过 `du` 深入这些目录以寻找潜在的“空间大户”，如列表 20.13\
  \ 所示。\n\n如果你发现文件系统实际上需要它正在使用的磁盘空间，唯一的选择就是增加更多空间。如果你在逻辑卷上设置了原始文件系统，通过 LVM 工具添加空间是非常简单的（创建逻辑卷在第\
  \ 11 章中介绍过）。\n\n如果你的卷组中没有额外的物理卷来添加到需要磁盘空间的空系统卷，请执行以下操作：\n\n1. 如果需要，向系统添加备用驱动器。\n\
  2. 使用 `pvcreate` 命令创建物理卷。\n3. 使用 `vgextend` 将新物理卷添加到组中。\n4. 使用 `lvextend` 命令增加逻辑卷的大小。\n\
  \n### 等待磁盘 I/O\n\n如果磁盘经历的 I/O 超过了其合理处理能力，可能会减慢整个系统。你可以使用显示 `I/O wait` 时间的工具（如 `iostat`\
  \ 命令）来排除此问题。I/O wait 是一种显示处理器等待磁盘 I/O 时间统计数据。\n\n`iostat` 命令的语法如下：\n\n```\niostat\
  \ [OPTION] [INTERVAL] [COUNT]\n```\n\n如果你只是在命令行中输入 `iostat` 并按回车，你将看到自系统启动以来 CPU、文件系统和分区的静态摘要。然而，在故障排除的情况下，这并不值得。有几个实用的\
  \ `iostat` 选项用于故障排除：\n\n* `-y`: 不包含初始的“自系统启动以来”统计数据。\n* `-N`: 显示逻辑卷的注册设备映射器名称。\n\
  * `-z`: 不显示没有活动的设备。\n* `-p device`: 仅显示与此 `device` 相关的信息。\n\n`iostat` 命令的两个参数允许随时间查看统计数据。`INTERVAL`\
  \ 参数指定每次显示之间的秒数，`COUNT` 设置显示次数。请记住，如果你使用 `-y` 选项，在设置的时间间隔之前你将看不到第一条统计数据。\n\n列表 20.14\
  \ 显示了在故障排除情况下使用适当选项 `iostat` 的示例。在这种情况下，每隔 5 秒显示两个统计数据。你可以看到较高的 I/O 等待（`%iowait`\
  \ 列）百分比，表明存在潜在问题。\n\n对于高 I/O 问题，除了采用不同的磁盘技术外，你可能还需要检查 Linux 内核定义的 `I/O 调度`。I/O 调度是处理\
  \ I/O 请求及其相关活动的一系列内核操作。这些各种操作的进展通过在配置文件中选择特定的 I/O 调度器来引导，如表 20.7 所示。\n\n| 名称 | 说明\
  \ |\n| --- | --- |\n| `cfq` | 为每个进程创建队列并在循环中处理各种队列，同时提供读请求高于写请求的优先级。调度器适用于需要更平衡的\
  \ I/O 处理和/或系统具有多处理器的情况。 |\n| `deadline` | 批量磁盘 I/O 请求并尝试在指定时间内处理每个请求。该调度器适用于需要增加数据库\
  \ I/O 并整体降低 I/O 延迟，和/或使用 SSD，以及/或正在使用实时应用程序的情况。 |\n| `noop` | 将所有 I/O 请求放入单个 FIFO\
  \ 队列并按顺序处理。该调度器适用于需要较低 CPU 使用量和/或使用 SSD 的情况。 |\n\n表 20.7 I/O 调度器\n\n用于确定使用何种 I/O\
  \ 调度器的配置文件位于与每个磁盘关联的目录中。列表 20.15 显示了如何在 Rocky Linux 发版上找到各种磁盘目录及其关联的调度器文件。\n\n`sda`\
  \ 磁盘使用的调度器 `mq-deadline` 位于括号中。要更改当前的 I/O 调度器，只需使用超级用户权限和 `echo` 命令，如列表 20.16 所示。\n\
  \n如果你确定由于硬件限制，需要一个新的不同的硬盘来处理所需的 I/O 级别，则 `ioping` 工具可以在测试过程中为你提供帮助。`ioping` 工具通常默认不安装，但它在发行版的标准存储中通常可用。\n\
  \n通过 `ioping` 命令，你可以测试磁盘 I/O 延迟、寻道率和顺序速度。你还可以尝试异步、缓存和直接 I/O 速率。\n\n列表 20.17 中的摘取示例显示了使用\
  \ `ioping` 命令从临时文件读取随机数据块（非缓存）的简单测试。\n\n添加的 `-c 3` 选项指定了三次测试。更彻底的 `ioping` 测试有助于确定磁盘是否满足特定应用程序的需求。\n\
  \n### 测量磁盘性能\n\n有助于确定磁盘驱动器整体 I/O 性能的一个基准测试是每秒输入输出操作数（IOPS）。该值是存储设备每秒内可以执行的输入或输出操作次数。IOPS\
  \ 值不仅提供评估磁盘驱动器性能的方法，还提供了不同类型存储的方法，例如单 SATA 或 SSD 驱动器与 RAID 或 LVM 配置的对比。\n\nLinux\
  \ 环境中确定 IOPS 值的流行工具是灵活的 I/O 工具，名为 `fio`。该工具在基于 Debian 和基于 Red Hat 的软件存储库中都作为 `fio`\
  \ 包可用，必须手动安装。\n\n`fio` 工具会在你指定的文件和目录上执行多次读写操作，并使用你指定的文件大小和块大小。文件越大，获得的 IOPS 读取值越准确。列表\
  \ 20.18 显示了在磁盘上执行 `fio` 测试的示例。\n\n如你所见，`fio` 工具提供了关于读写测试的大量详细信息。你可以咨询 `fio` 手页以了解所有细节。在列表\
  \ 20.18 中，我们感兴趣的这里 IOPS 信息出现在这两行中：\n\n```\nread: IOPS=23.4k, BW=91.4MiB/s\nwrite:\
  \ IOPS=7818, BW=30.5MiB/s\n```\n\n对于此磁盘驱动器，读取 IOPS 值为 `23400`，写入 IOPS 为 `7818`。写入\
  \ IOPS 值显著低于读取 IOPS 值是正常的，因为向磁盘写入数据比从磁盘读取数据需要更长时间。现在你可以使用这些值与系统上的其他存储设备进行比较。\n\n\
  \n\n\n\n### 磁盘故障\n\n如果 HDD 或 SSD 的一小块区域对 I/O 请求没有响应，磁盘控制器会将其标记为坏道。当坏道被标记时，通常控制器的固件会尝试将数据从标记的扇区移动到新位置，并将逻辑扇区重映射到新扇区。因此，数据是安全的。\n\
  \n随机坏道并不意味着驱动器正在故障。然而，如果你发现磁盘上的坏道越来越多，那么它就必须更换了。因此，你应该监控这种情况。\n\n偶尔，驱动器上的某个文件会丢失其匹配的\
  \ inode 编号，这被称为不匹配（在第 3 章中的“管理文件、目录和文本”中介绍），或者发生了其他类型的磁盘损坏。这会导致数据留在原地，但没有任何可以访问它，必须手动修复该问题。\n\
  \n一个可以检查并修复 ext2、ext3 或 ext4 文件系统的工具是 `fsck` 命令（在第 11 章中介绍）。在对磁盘分区运行该工具之前，必须先卸载该分区。\n\
  \n物理损坏或磨损有时会导致驱动器发出异常声音。你可能会听到咔哒声、摩擦声或刮擦声。这些表明驱动器正在故障，应尽快更换。\n\n在确实需要更换驱动器并重建分区的情况下，请记住你可以使用\
  \ `partprobe` 命令。这个好用的工具允许你的系统在不重启系统的情况下重新读取磁盘的分区表。你需要使用超级用户权限来调用它。\n\n### CPU 故障排除\n\
  \n你需要根据服务器应用需求为你的 CPU 选择合适的规格。配置不足的处理器将迫使你获取新的，而配置过大的处理器将无法充分利用性能。两者都是浪费钱。\n\n为了排除故障，你需要了解你的\
  \ CPU 硬件——核心数、是否使用了超线程、缓存大小等。你可以轻松地查看系统当前处理器的信息。使用 `less` 工具并向其传递 `/proc/cpuinfo`文件名。该文件中列出的第一个处理器显示为\
  \ processor 0。\n\n要查看 CPU 使用率，你可以使用 `uptime` 命令。它显示系统已运行了多久，但重要的是它显示了 CPU `load\
  \ averages`（负载平均值）。负载平均值是等待或正在使用 CPU 的进程平均数量。例如，如果你有一个单核处理器，那么两个的负载平均值意味着通常有一个进程正在使用\
  \ CPU，而另一个进程在等待。\n\n`uptime` 工具显示三个负载平均值数字——1 分钟、5 分钟和 15 分钟的平均值。示例见列表 20.19。\n\n\
  这个单核 CPU 系统的负载平均值相当高，表明可能存在严重问题。首先，检查是否有逃逸进程。如果没有，你将需要调查诸如来自网络和磁盘的中断等项目。`top` 工具在这里可以提供帮助。\n\
  \n如果你需要随时间查看 CPU 性能，`sar`（system activity reporter 的缩写）工具非常有用。它通常默认安装在大多数发行发行版中，但如果你需要安装它，请使用\
  \ `sysstat` 包。\n\n`sar` 工具使用由 `sadc` 程序存储在 `/var/log/sa/` 目录的数据，该目录包含最多一个月的数据。在不带任何选项或参数的情况下，`sar`\
  \ 将以 10 分钟为间隔显示今天存储的 CPU 使用率信息，如列表 20.20 片段所示。\n\n如果你的服务器运行着多个虚拟机，`sar` 工具输出中的 `%steal`\
  \ 列非常有用。该列显示了系统上的虚拟机占用了多少 CPU。\n\n### 内存故障排除\n\n进程使用随机访问存储器（RAM）临时存储数据，因为访问比存储在磁盘上的数据更快。这种形式的一种形式是\
  \ `disk buffering`（磁盘缓冲），它可以提高磁盘读取性能。数据从磁盘读取并存储在称为 `buffer cache`（缓冲区缓存）的内存位置中一段时间。后续对该数据的访问将从内存而非磁盘读取，这显著提高了了性能。\n\
  \n内存为进程提供的速度非常宝贵，以至于 Linux 内核维护并管理共享内存区域。这些共享段允许多个运行中的程序对公共共享内存数据区域进行读写，这大大加快了进程间的交互。\n\
  \n你可以通过查看 `/proc/meminfo` 文件查看有关系统 RAM 的详细信息。要查看共享内存段，请使用 `ipcs -m` 命令。你可以使用 `free`、`sar`\
  \ 和 `vmstat` 等命令行工具查看系统的内存统计信息。\n\n#### 交换（Swapping）\n\n内存被分为称为 `pages`（页）的块。当系统需要更多内存并使用内存管理方案时，它获取空闲进程的内存页并复制到磁盘。这个磁盘位置是一个称为\
  \ `swap space`、`swap` 或 `virtual memory` 的特殊分区。如果空闲进程不再空闲，它的内存页将复制回内存。这种在磁盘交换空间和内存之间复制内存页的过程被称为\
  \ `swapping`（交换）。\n\n如果你的系统内存大小不合适，你应该通过 `free` 命令看到高 RAM 使用率。此外，系统会增加交换，导致磁盘 I/O\
  \ 增加。在这种情况下，`vmstat` 工具非常好用，因为它允许你查看特定于交换的磁盘 I/O 以及进入和传出设备的总块数。使用 `vmstat` 工具的示例见列表\
  \ 20.21。\n\n在 Linux 系统上，交换空间可以是磁盘分区或文件。交换分区是作为系统交换空间的特殊磁盘分区。\n\n查看内存并判断交换是文件还是分区的有用工具是\
  \ `swapon -s` 命令。如果可用，你可以从 `/proc/swaps` 文件获取相同的信息。在 Rocky Linux 系统上使用 `swapon -s`\
  \ 命令的示例见列表 20.22。\n\n注意在 Rocky Linux 上，交换空间是一个分区。在前一个示例的交换统计中，Priority 列显示为负二（−2）。如果有多个交换空间，此优先级数字决定了先使用哪个交换。\n\
  \n另一个 `swapon -s` 示例在 Ubuntu 24.04 发行版上执行，见列表 20.23。注意在这种情况下，交换空间是一个文件。\n\n在 Linux\
  \ OS 安装期间，通常会创建一个交换分区或文件并将其添加到 `/etc/fstab` 配置文件中。然而，你可能需要创建额外的交换分区文件——例如如果你增加了系统的\
  \ RAM。\n\n对于新的分区交换空间，在你创建新的磁盘分区后，使用 `mkswap` 命令将分区“格式化”为交换分区。交换文件和逻辑卷也使用相同的命令。在\
  \ Rocky Linux 系统上使用超级用户权限的示例见列表 20.24。\n\n现在交换分区或文件已准备就绪，使用 `swapon` 命令激活它。`free`\
  \ 命令在这里非常有用，因为它提供了当前空闲和已用内存的简明视图。这两个命令的示例见列表 20.25。\n\n你可以看到，通过添加第二个交换分区，交换空间大小增加了\
  \ 1 GB。`free` 命令的 `-h` 选项以更人类可读的格式显示内存信息。\n\n\n\n\n\n如果需要，可以使用 `swapon` 命令将新交换分区的优先级从当前的负二\
  \ `(-2)` 改为更高的优先级，如 Listing 20.26 所示。数字越大，该交换分区越在其他分区之前被用于交换。\n\n你必须首先在交换分区上使用 `swapoff`\
  \ 命令将其从交换空间中解除。之后，使用 `swapon -p` `priority` 来更改偏好优先级。你可以将 `priority` 设置为 `0` 到 `32767`\
  \ 之间的任何数字。\n\n如果新交换分区工作正常，请将其添加到 `/etc/fstab` 文件中，以便在系统重启后依然有效。你可以紧密模仿当前交换文件记录的设置，但务必将名称更改为你新的交换分区/文件。\n\
  \n### 内存耗尽\n\n默认情况下，Linux 内核允许对各种进程进行内存过度分配（overcommit）。这样做是为了效率和性能考虑。然而，由于这种许可，系统的可用内存可能会变得非常少。在临界的低内存情况下，Linux\
  \ 首先回收旧的内存页。如果回收的 RAM 不足以退出临界状态，它将采用 `out-of-memory killer`（也称为 `OOM killer`）。\n\
  \n当被触发时，OOM killer 会扫描所有使用内存的各种进程并创建一个评分。该评分基于进程（及其子进程）使用的总内存，以及为了退出临界低内存状态而需要杀掉的最小进程数量。内核、root\
  \ 用户和关键的系统进程会被自动赋予低分。如果某个进程的得分很高，它就会被杀死。OOM killer 会扫描并杀死高分进程，直到系统恢复到正常的内存状态。\n\n\
  你可以通过 `sysctl` 命令强制内核防止内存过度分配，将 `vm.overcommit_memory` 内核参数从默认的 `0` 更改为 `1`。然而，这可能不是最佳解决方案。在许多系统中，将\
  \ `vm.overcommit_memory` 设置为 `2` 来精细调整内存过度分配会更好。这允许你根据另一个内核参数 `overcommit_ratio`\
  \ 定义的内存来分配内存。在这种情况下，当进程请求的内存导致系统超过了设置的过度分配比例时，分配将失败。\n\n### 找回 root 密码\n\n忘记 root\
  \ 账户密码有很多麻烦的原因。快速修复的方法是使用你自己的账户的超级用户权限，通过 `passwd` 命令重置它。然而，如果你一直使用 root 账户来获取超级用户权限（这是一种坏习惯），或者你的权限不允许你更改\
  \ root 密码，你就遇到麻烦了。但并非全无希望。\n\n在较旧的 Linux 发行版和少数现代发行版（如 Ubuntu）中，将系统引导至单用户模式将你访问\
  \ root 账户并通过 `passwd` 命令更改其密码。请按照以下步骤操作：\n\n1. 启动（或重启）系统。当启动过程到达启动菜单时，在想要编辑的启动菜单行上按\
  \ `E` 键（系统通常运行的内核版本）。\n\n2. 通过方向键找到包含 `linux` 或 `linux16` 的行。\n\n3. 到该行的末尾，按一次空格键，然后输入\
  \ `1`。\n\n4. 按 `Ctrl+X` 启动系统。\n\n5. 系统启动后，如果显示你正处于紧急（Emergency）或救援（Rescue）模式，请按\
  \ `Enter` 键。\n\n6. 通过 `passwd` 命令更改 root 账户的密码。\n\n7. 通过 `reboot` 命令重启系统。\n\n在某些现代\
  \ Linux 系统上（例如 Rocky Linux 和 Fedora 发行版），你需要一种略有不同的方法。请按照以下步骤操作：\n\n1. 启动（或重启）系统。当启动过程到达启动菜单时，在想要编辑的启动菜单行上按\
  \ `E` 键（系统通常运行的内核版本）。\n\n2. 通过方向键找到包含 `linux` 或 `linux16` 的行。\n\n3. 在该行上找到 `ro`。它在行的中间位置。\n\
  \n4. 将 `ro` 替换为 `rw init=/sysroot/bin/sh`。不要替换该行中 `ro` 以外的任何内容。\n\n5. 按 `Ctrl+X`\
  \ 启动系统。\n\n6. 系统启动后，如果显示你正处于紧急（Emergency）或救援（Rescue）模式，请按 `Enter` 键。\n\n7. 输入 `chroot\
  \ /sysroot` 以设置禁锢的 root 环境。\n\n8. 通过 `passwd` 命令更改 root 账户的密码。\n\n9. 如果系统使用了 SELinux（Rocky\
  \ Linux 和 Fedora 通常会使用），通过输入 `touch /.autorelabel` 命令强制 SELinux 在下次启动时自动对系统进行重标记。\n\
  \n10. 通过 `reboot` 命令重启系统。（注意：在尝试重启系统之前，你可能需要输入 `exit` 并按 `Enter`。）\n\n你需要等待一段时间让系统完成\
  \ SELinux 重标记过程。\n\n## 总结\n\n排排除 Linux 性能问题需要为不利的事件做好计划。此外，你必须理解各种系统属性（如处理器、磁盘、网络和内存）之间的交互。合理设置系统组件的大小并配置\
  \ Linux 将提供一个更无故障的环境。\n\n## 考试要点\n\n**描述网络排排除工具。** `iperf`、`iperf3`、`iftop`、`mtr`、`nc`、`ping`、`ping6`、`ss`、`tracepath`、`trace6`、`traceroute`、`traceroute`\
  \ 用于检测网络饱和。如果适配器故障或损坏，诊断此问题的工具有 `ethtool`、`ifconfig`、`ip` 和 `netstat`。这些工具配合 `nmcli`\
  \ 有助于网络配置。对于路由器错误的或重复的 MAC 地址，请使用 `arp` 或 `ip neigh`。研究缓慢的服务器响应，`host`、`dig`、`nslookup`\
  \ 和 `whois` 工具很有帮助。\n\n**总结可能的磁盘问题和解决方案。** `du` 和 `df` 有助于防止系统空间不足。如果是逻辑卷，使用 LVM\
  \ 工具在需要时添加额外空间。I/O 等待时间可能会降低系统性能，可以通过 `iostat` 查看。更改系统的 I/O 调度器可能解决此问题。`ioping`\
  \ 工具测试磁盘以确定其是否适用于特定应用程序。修复 ext 文件系统请使用 `fsck` 命令。`partprobe` 命令对于新创建的分区非常好，可以在不需要重启系统的情况下强制重新读取磁盘分区表。\n\
  \n**澄清排排除步骤。** `/proc/cpuinfo` 包含系统当前处理器的信息。查看 CPU 使用情况，可以使用 `uptime` 和 `sar`。如果需要且合适，可以通过\
  \ `sysctl` 工具调整与处理器相关的内核参数。\n\n**解释内存问题和解决方案。** `/proc/meminfo` 提供详细的系统内存信息。如果系统内存大小不合理，可以通过\
  \ `free` 命令查看高内存使用率。此外，`vmstat` 工具允许你查看特定交换的磁盘 I/O，这在内存大小不合理时会增加。如果你需要额外的交换空间，`mkswap`\
  \ 工具将分区/文件格式化为交换，`swapon` 命令将其放入交换空间。如果你需要将分区/文件从交换空间取消，请使用 `swapoff` 工具。当内存使用达到临界水平时，内核释放\
  \ OOM killer，它会杀死特定的进程以将内存使用回到合理水平。内存管理可以通过某些内核参数和 `sysctl` 工具进行修改。\n\n复习题\n\n复习题的答案可以在附录\
  \ A](#a01.xhtml_a01) 中找到。\n\n\n\n\n\n1. 关于网络套字（network sockets），以下哪是正确的？（选择所有项）\n\
  \    1. 数字用于识别哪个服务正在传输数据。\n    2. 网络套字是网络连接两个端点中的一个端点。\n    3. 网络套字使用 IP 地址和端口号的组合。\n\
  \    4. 网络套字是本地系统中进程之间的端点。\n    5. 网络套字比 localhost 提供了更好的进程间通信（IPC）。\n\n2. 系统管理员\
