  \ 还是 `X11`？\n    1. `$WAYLAND_DISPLAY`\n    2. `echo $AccessX`\n    3. `loginctl`\n\
  \    4. `echo $X11`\n    5. `runlevel`\n\n\n\n\n13. 你在命令行运行命令 `gnome-shell --replace`\
  \ 并收到了该实用程序的错误信息。这表明了什么？\n    1. X11 显示服务器挂起。你需要重启服务器。\n    2. 应该将 `--replace` 替换为\
  \ `-R` 选项。\n    3. 你的显示服务器是 Wayland。\n    4. 当前正在使用 XWayland。\n    5. 此会话已禁用 Wayland。\n\
  \n14. 关于 X11，以下哪项是正确的？（选择所有适用项）\n    1. XFree86 是主地位的 X 服务器。\n    2. X.Org 基金会开发\
  \ X 服务器。\n    3. X 服务器正在被 Wayland 替替。\n    4. X11 意味着用户可以拥有 11 个会话。\n    5. X 是\
  \ X Window System 的缩写。\n\n15. 你的系统正在运行 X 显示服务器，用户的图形用户界面运行不正常。你首先可以使用以下哪条命令来诊断潜在问题？（选择所有适用项）\n\
  \    1. `xwininfo`\n    2. `Xorg -configure`\n    3. `xcpyinfo`\n    4. `xdpyinfo`\n\
  \    5. `loginctl`\n\n16. 以下哪些是远程桌面？（选择所有适用项）\n    1. SPICE\n    2. NX\n    3. Xrdp\n\
  \    4. VNC\n    5. Caja\n\n17. 以下哪些是通常用于虚拟机的远程桌面？（选择所有适用项）\n    1. SPICE\n    2.\
  \ NX\n    3. Xrdp\n    4. VNC\n    5. 以上所有\n\n18. Xrdp 采用了以下哪些协议？\n    1. 远程帧缓冲协议\
  \ (Remote Frame Buffer protocol)\n    2. Wayland 协议\n    3. NX 技术协议\n    4. ICE\
  \ 协议\n    5. 远程桌面协议 (Remote Desktop Protocol)\n\n19. 你想使用 SSH 端口转发并使用其本地模式。你应该使用哪些\
  \ `ssh` 命令开关？（选择所有适用项）\n    1. `-N`\n    2. `-X`\n    3. `-f`\n    4. `-R`\n   \
  \ 5. `-L`\n\n20. 你（用户名 Samantha）在 A 大楼的办公桌上一登录运行 Linux GNOME Classic 桌面环境的笔记本电脑（IP\
  \ 地址 192.168.0.42）。C 大楼的一台机架式 Linux 系统（IP 地址 192.168.0.7）发生了一个问题。你需要安全地访问远程系统上使用\
  \ X11 的 GUI 应用程序。你应该使用哪条命令？\n    1. `ssh -Y Samantha@192.168.0.7`\n    2. `ssh -X\
  \ Samantha@192.168.0.7`\n    3. `ssh -Y Samantha@192.168.0.42`\n    4. `ssh -X Samantha@192.168.0.42`\n\
  \    5. `ssh -L Samantha@192.168.0.42`\n\n# 第 9 章：调整本地化选项\n\n![](img/chaptersquare.png)\n\
  \nLinux 已成为全球性现象。你会在世界各地、各种环境中发现 Linux 桌面和服务器。然而，由于其在全球范围内的流行，Linux 必须支持多种语言、日期时间格式以及货币格式。\n\
  \n本章将引导你如何配置 Linux 系统，以适应其运行的本地环境。首先，本章将讨论 Linux 如何处理不同的语言字符，包括如何格式化货币值。然后将转向 Linux\
  \ 如何处理不同国家使用的日期和日期。\n\n## 理解本地化（Localization）\n\n世界充满了许多不同的语言。不仅每个国家都有自己的语言（有时是一组语言），而且每个国家都有书写数值、货币值以及时间和日期的特定方法。为了让\
  \ Linux 系统在任何特定位置都可用，它必须适应处理这些内容的本地方式。\n\n`本地化` 是使 Linux 系统适应特定区域设置（locale）的能力。为了实现这一点，Linux\
  \ 系统必须有一种方法来识别如何处理本地语言中包含的字符。后续章节将讨论 Linux 是如何做到的。\n\n### 字符集\n\n计算机的核心处理的是 0 和\
  \ 1，Linux 也如此。然而，为了让计算机与人类交互，它需要知道如何说我们的语言。这就是字符集的用用场。\n\n`字符集` 定义了用于解释和显示某种语言字符的标准代码。世界上使用了许多不同的字符集来表示字符。以下是你可能会遇到的最常见的（以及你在\
  \ Linux+ 考试中会看到的）：\n\n- `ASCII`：美国信息交换标准 (ASCII) 使用 7 位来存储英语语言中的字符。\n- `Unicode`：一种国际标准，使用\
  \ 3 字节代码，可以表示全球所有国家已知使用的每个字符。\n- `UTF`：Unicode 转换格式 (UTF)，它将较长的 Unicode 值转换为 1 字节（`UTF-8`）或\
  \ 2 字节（`UTF-16`）的简化代码。在英语国家中，`UTF-8` 字符集正在取代 ASCII 成为标准。\n\n一旦你为你的 Linux 系统确定了字符集，你就需要知道如何配置\
  \ Linux 系统来使用它，这将在接下来的章节中显示。\n\n### 环境变量\n\nLinux 将本地化信息存储在一组特殊的环境变量中（请参见 第 25 章，“部署\
  \ BASH 脚本”）。需要需要确定 Linux 系统本地化的程序只需要检索相应的环境变量即可查看使用何种字符集。\n\nLinux 提供了 `locale`\
  \ 命令来帮助你轻松显示这些环境变量。列表 9.1 显示了在美国安装的 Rocky Linux 系统上设置的 `locale` 环境变量。\n\n`locale`\
  \ 命令的输出按此格式定义本地化信息：\n\n```\nlanguage_country.character set\n```\n\n在列表 9.1 所示的示例中，Linux\
  \ 系统配置为美国英语，使用 `UTF-8` 字符集存储字符。\n\n每个 `LC_` 环境变量本身代表一组与本地化设置相关的更多环境变量的类别。你可以使用 `-ck`\
  \ 选项结合类别名称来探索类别中包含的环境变量，如列表 9.2 所示。\n\n列表 9.2 中显示的环境变量控制了表示货币值时使用的字符和格式。程序员可以精细调整每个单独的环境变量，以精确自定义他们的程序在本地化环境中的行为。\n\
  \n## 设置你的区域设置（Locale）\n\n如列表 9.1 所示，Linux 处理本地化包含三个组件。区域设置（locale）定义了系统使用的语言、国家和字符集。Linux\
  \ 提供了几种不同的方法让你更改这些本地化设置。\n\n### 安装时的区域设置决策\n\n当你首次安装 Linux 操作系统时，安装过程中的可用提示之一是设置默认系统语言。图\
  \ 9.1 显示了 Rocky Linux 8 安装时的提示。\n\n![Rocky Linux 9.4 安装屏幕截图，显示了语言选择，选择了英语-U S 并列出了各种语言。](img/c09f001.png)\n\
  \n图 9.1 Rocky Linux 8 安装中的语言选项\n\n当你从菜单中选择一种语言时，Linux 安装脚本会自动为该国家和语言恰当地设置本地化环境变量，包括表示所需字符所需的字符集。通常情况下，这就是为了让\
  \ Linux 系统在你的本地化环境中正确运行所需做的一切。\n\n### 更改你的区域设置\n\n在安装 Linux 操作系统之后，你仍然可以更改系统使用的本地化值。有两种方法可以实现：你可以手动设置\
  \ `LC_` 环境变量，或者使用 `localectl` 命令。\n\n#### 手动更改环境变量\n\n\n\n\n对于手动方法，你可以像处理其他其他环境变量一样，使用\
  \ `export` 命令来更改单个 `LC_` 本地化环境变量：\n\n```\n $ export LC_MONETARY=en_GB.UTF-8\n```\n\
  \n这对于更改单个设置非常有效，但如果你想更改系统所有的本地化设置，将会非常繁琐。\n\n与其逐个更改所有的 `LC_` 环境变量，不如 `LANG` 环境变量可以在一个地方控制所有它们：\n\
  \n```\n $ export LANG=en_GB.UTF-8\n$ locale\nLANG=en_GB.UTF-8\nLC_CTYPE=\"en_GB.UTF-8\"\
  \nLC_NUMERIC=\"en_GB.UTF-8\"\nLC_TIME=\"en_GB.UTF-8\"\nLC_COLLATE=\"en_GB.UTF-8\"\
  \nLC_MONETARY=\"en_GB.UTF-8\"\nLC_MESSAGES=\"en_GB.UTF-8\"\nLC_PAPER=\"en_GB.UTF-8\"\
  \nLC_NAME=\"en_GB.UTF-8\"\nLC_ADDRESS=\"en_GB.UTF-8\"\nLC_TELEPHONE=\"en_GB.UTF-8\"\
  \nLC_MEASUREMENT=\"en_GB.UTF-8\"\nLC_IDENTIFICATION=\"en_GB.UTF-8\"\nLC_ALL=\n$\n\
  ```\n\n某些 Linux 系统要求你也设置 `LC_ALL` 环境变量，因此通常与 `LANG` 环境变量一起设置是一个好主意。\n\n### `localectl`\
  \ 命令\n\n如果你正在使用 systemd 工具 set 的 Linux 发行版（参见第 6 章，“维护系统启动和服务服务”），则可以使用 `localectl`\
  \ 命令。默认情况下，`localectl` 命令仅显示当前的本地化设置：\n\n```\n $ localectl\n   System Locale: LANG=en_US.UTF-8\n\
  \      VC Keymap: us\n      X11 Layout: us\n$\n```\n\n它不仅显示 `LANG` 环境变量设置，还显示键盘布局映射以及\
  \ X11 图形环境布局。\n\n`localectl` 命令支持许多选项，但最常用的是 `list-locales` 选项列出系统上安装的所有区域（locales），以及使用\
  \ `set-locale` 选项更改本地化：\n\n```\n $ localectl set-locale LANG=en_GB.utf8\n```\n\n\
  这提供了一种更改整个 Linux 系统本地化设置的简便方法。\n\n## 查看时间\n\n与 Linux 系统相关的日期和时间对于系统的正常运行至关重要。Linux\
  \ 使用日期和时间来跟踪运行进程，确定何时启动或停止作业，并记录发生的重要事件。确保你的 Linux 系统与你所在位置的正确时间和日期同步是必须的。\n\nLinux\
  \ 将时间分为两个部分——与系统位置相关的时区，以及该时区内的实际时间和日期。本节将引导你如何更改这两个值。\n\n#### 时区工作\n\n时间最重要的方面之一是`时区`（time\
  \ zone）。每个国家都选择一个或多个时区，或相对于标准协调世界时间（UTC）的偏移量来确定该国的时间。如果你的 Linux 环境包含位于不同时区的服务器，那么知道如何设置正确的时区是必须的。\n\
  \n大多数基于 Debian 的 Linux 系统在 `/etc/timezone` 文件中定义本地时区，而大多数基于 Red Hat 的 Linux 系统使用\
  \ `/etc/localtime`。这些文件不是文本格式，因此不能简单地编辑 `/etc/timezone` 或 `/etc/localtime` 文件来查看或更改时区。相反，你必须将该文件链接到存储在\
  \ `/usr/share/zoneinfo` 文件夹中的模板文件。\n\n要确定 Linux 系统当前的时区设置，请使用不带选项的 `date` 命令：\n\n\
  ```\n $ date\nSat Oct  5 09:53:25 AM EDT 2024\n$\n```\n\n时区以标准三字母代码出现在日期时间显示的末尾，年份之前。\n\
  \n要查看系统正在使用的当前时区模板文件，只需使用 `ls` 命令显示激活的时区文件：\n\n```\n $ ls -al /etc/localtime\nlrwxrwxrwx.\
  \ 1 root root 38 Nov 30 09:06 /etc/localtime -> ../usr/share/zoneinfo/America/New_York\n\
  $\n```\n\n要更改 Linux 系统的时区，只需将 `/usr/share/zoneinfo` 文件夹中相应的时区模板文件链接到 `/etc/timezone`\
  \ 或 `/etc/localtime` 位置。`/usr/share/zoneinfo` 文件夹根据位置划分为子文件夹。每个位置文件夹可能进一步细分为更详细的位置文件夹。最终，你会看到与你特定时区相关的时区模板文件，例如\
  \ `/usr/share/zoneinfo/US/Eastern`。\n\n在复制新的时区文件之前，你需要删除原始的 `timezone` 或 `localtime`\
  \ 文件：\n\n```\n $ sudo ln -s /usr/share/zoneinfo/America/Chicago /etc/localtime\n\
  $ date\n\nSat Oct  09:56:25 AM CDT 2024\n$\n```\n\n新的时区将出现在 `date` 命令的输出中。\n\n####\
  \ 设置日期日期\n\n一旦你为 Linux 系统设置了正确的时区，就可以开始设置正确的时间日期值。有几种不同的命令可以执行此操作。\n\n###### 旧命令\n\
  \n在所有 Linux 发行版中，你都可以找到两个处理日期时间值的旧命令：\n\n* `hwclock` 显示或设置工作站或服务器内部 BIOS 或 UEFI\
  \ 时钟上保存的时间。\n* `date` 显示或设置 Linux 系统保存的日期。\n\n`hwclock` 命令提供了对 Linux 系统运行的物理工作站或服务器内置的硬件时钟的访问。你可以使用\
  \ `hwclock` 命令将系统时间和日期设置为物理工作站或服务器上的硬件时钟。或者，它也允许更改硬件时钟以匹配 Linux 系统的时间和日期。\n\n`date`\
  \ 命令是日期时间命令中的瑞士军刀。除了设置时间或/日期外，它还允许你以多种格式显示时间和日期。`+` 选项允许通过定义命令序列来指定用于显示时间或日期值的格式：\n\
  \n```\n $ date +\"%A, %B %d, %Y\"\nSaturday, December 05, 2024\n$\n```\n\n表 9.1\
  \ 显示了 `date` 命令中提供的不同命令序列。\n\n| 序列 | 描述 |\n| --- | --- |\n| `%a` | 缩写的星期几名称 |\n\
  | `%A` | 完整的星期几名称 |\n| `%b` | 缩写的月份名称 |\n| `%B` | 完整的月份名称 |\n| `%c` | 日期时间和 |\n\
  | `%C` | 世纪（例如，20） |\n| `%d` | 月中的数字日期 |\n| `%D` | 完整的数字日期 |\n| `%e` | 月中的日期，带空格填充\
  \ |\n| `%F` | SQL 格式的完整日期 (YYYY-MM-dd) |\n| `%g` | ISO1 周数的年份的最后两位 |\n| `%G` | ISO2\
  \ 周数的年份 |\n| `%h` | `%b` 的别名 |\n| `%H` | 24 小时制的小 |\n| `%I` | 12 小时制的小 |\n| `%j`\
  \ | 一年的数字日期 |\n| `%k` | 24 小时制的小，带空格填充 |\n| `%l` | 12 小时制的小，带空格填充 |\n| `%m` | 数字月份\
  \ |\n| `%M` | 分钟 |\n| `%n` | 换行符 |\n| `%N` | 纳秒 |\n| `%p` | AM 或 PM |\n| `%P` |\
  \ 小写的 am 或 pm |\n| `%r` | 完整的 12 小时钟 |\n| `%R` | 完整的 24 小时小时和分钟 |\n| `%s` | 自 1970-01-01\
  \ 00:00:00 UTC 以来的秒 |\n| `%S` | 秒 |\n| `%t` | 制表符 |\n| `%T` | 小:分:秒格式的完整时间 |\n|\
  \ `%u` | 数字星期几，1 是星期一 |\n| `%U` | 从星期日开始的年数字周数 |\n| `%V` | ISO3 周数 |\n| `%w` | 数字星期几，0\
  \ 是星期日 |\n| `%W` | 从星期一开始的年周数 |\n| `%x` | 本地月/日/年或日/月/年的日期表示 |\n| `%X` | 本地完整时间表示\
  \ |\n| `%y` | 年份的最后两位 |\n| `%Y` | 完整年份 |\n| `%z` | +hh:mm 格式的时区 |\n| `%:z` | +hh:mm\
  \ 格式的时区 |\n| `%::z` | +hh:mm:ss 格式的时区 |\n| `%:::z` | 有必要精度的数字时区 |\n| `%Z` | 字母时区缩写\
  \ |\n\n* 国际标准组织 (ISO) 定义了一年中周数的标准方法。\n\n\n\n\n\n如你从表 9.1 所示，`date` 命令为你提供了多种在程序和\
  \ shell 脚本中显示时间和日期的方法。\n\n你还可以通过指定以下格式的值来使用 `date` 命令设置时间和日期：\n\n```\n date MMDDhhmm[[CC]YY][.ss]\n\
  ```\n\n月份、日期、小时和分钟值是必须的，年份和秒是默认值，或者如果你愿意，也可以包含年份和秒。\n\n### `timedatectl` 命令\n\n\
  如果你的 Linux 发行版使用 Systemd 系列工具集（参见第 6 章），你可以使用 `timedatectl` 命令来管理系统的时日期设置：\n\n```\n\
  \ $  timedatectl\n             Local time: Sat 2024-10-05 09:58:03 EDT\n       \
  \      Universal time: Sat 2024-10-05 13:58:03 UTC\n                RTC time: Sat\
  \ 2024-10-05 13:58:03\n                Time zone: US/Eastern (EDT, -0400)\nSystem\
  \ clock synchronized: yes\n             NTP service: active\n             RTC in\
  \ local TZ: no\n$\n```\n\n`timedatectl` 命令提供了一站式服务，用于查看所有时间信息，包括硬件时（称为 `RTC`）、日期信息和时区信息。\n\
  \n你还可以通过 `set-time` 选项来修改任何这些设置：\n\n```\n #  timedatectl set-time \"2024-10-05 08:30:00\"\
  \n```\n\n你还可以使用 `timedatectl` 命令将工作站或服务器的硬件时与 Linux 系统时间同步。\n\n### 网络时间协议\n\n如今，大多数连接互联网的\
  \ Linux 系统都利用网络时间协议 (NTP) 来保持时间和日期与中央时间服务器同步。如果你的 Linux 系统执行了此操作，你将无法通过 `date` 或\
  \ `timedatectl` 命令更改时间或日期。相反，你需要将你的 Linux 服务器指向适当的网络时间服务器。\n\nLinux 世界中有三种常用的 NTP\
  \ 软件实现：\n\n* `ntpd`：旧版软件，使用简单网络时间协议 (SNTP) 连接到网络时间服务器\n* `chrony`：`ntpd` 软件的改进版本，利用安全特性\n\
  * `timesyncd`：Systemd 启动工具包的一部分，提供 NTP 服务\n\n旧版的 `ntpd` 软件技术上已不再支持，但由于其简单性，某些 Linux\
  \ 发行版仍在使用。大多数基于 Debian 的 Linux 发行版（包括 Ubuntu）使用 Systemd 启动工具，因此利用 `timesyncd` 服务提供网络时间服务。虽然基于\
  \ Red Hat 的系统也使用 Systemd，但 Red Hat 选择了实现多功能的 `chrony` 软件来提供网络时间服务。\n\n### 查看系统时间\n\
  \n虽然与特定的时间和日期无关，但 Linux+ 考试也涵盖了 `time` 命令。`time` 命令显示程序在 Linux 系统上运行所需的时间：\n\n```\n\
  \ $  time timedatectl\n             Local time: Sat 2024-10-05 10:01:11 EDT\n  \
  \           Universal time: Sat 2024-10-05 14:01:11 UTC\n                RTC time:\
  \ Sat 2024-10-05 14:01:10\n                Time zone: US/Eastern (EDT, -0400)\n\
  System clock synchronized: yes\n             NTP service: active\n             RTC\
  \ in local TZ: no\n\nreal    0m0.101s\nuser    0m0.008s\nsys    0m0.000s\n$\n```\n\
  \n在正常的命令输出之后，你将看到三行额外信息：\n\n* `real`：程序开始和结束之间的流逝时间\n* `user`：程序消耗的用户 CPU 时间\n*\
  \ `sys`：程序消耗的系统 CPU 时间\n\n当你排错那些似乎需要额外系统资源处理的程序时，这些信息无无价。\n\n练习 9.1 将引导你如何使用 Linux\
  \ 中可用的不同区域设置、时间和日期函数。\n\n## 总结\n\nLinux 系统通过整合不同的字符集支持许多不同的语言。字符集定义了字符如何显示。\n\n\n\
  \n\n# 总结在 Linux 系统中可用于处理时间和日期工具。\n\n`hwclock` 命令允许你将 Linux 系统时间与系统的硬件时钟同步，反之亦然。`date`\
  \ 命令允许你以多种格式显示时间和日期，或者设置当前的时刻日期。`timedatectl` 命令来自 Systemd 工具集，它除了允许你设置时间和日期的外，还允许你显示许多关于系统和硬件时间日期的各种信息。\n\
  \n## 描述 NTP 的工作原理以及 Linux 系统如何使用它。\n\n网络时间协议（NTP）允许 Linux 系统从网络上的中央服务器同步其时间和日期。Linux\
  \ 中有三个常用的实现 NTP 的软件包：`ntpd` 包、`chrony` 包以及来自 Systemd 工具集的 `timesyncd` 程序。\n\n##\
  \ 解释如何查看应用程序在系统上运行所需的时间。\n\n`time` 命令允许你在特定应用程序在系统上运行时对其放置计时器。`time` 命令的输出显示了程序运行所需的实际通过时间，以及应用程序所需的内核和系统\
  \ CPU 时间。\n\n## 复习题\n\n你可以在 附录 A 中找到复习题的答案。\n\n1. 哪个字符集使用 7 位来存储字符？\n    1. UTF-8\n\
