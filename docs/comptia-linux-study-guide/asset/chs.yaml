  \ D 是错误的。`vi` 编辑器也只显示文件中存在的数据而不是新添加的数据，因此选项 E 是错误的。\n\n## 28\nA. `systemd-journald`\
  \ 使用自己的二进制文件格式作为日志文件，并需要 `journalctl` 文件来读取它，因此选项 A 是正确的。`syslogd` 和 `klogd` 应用程序是\
