  \ `edquota -G`\n5. `edquota --grace`\n\n# 第 11 章\n\n处理存储\n\n![](img/chaptersquare.png)\n\
  \n世界运行在数据之上。无论是员工数据库、包含所有家庭照片的文件夹，还是每周的保龄球得分，保存和检索数据的能力对于每个应用程序都是必不可少的。Linux 为应用程序提供了许多不同的文件存储和管理方法。本章首先讨论\
  \ Linux 如何处理存储设备的基础知识，然后引导你如何使用这些方法在 Linux 环境中管理数据。\n\n## 存储基础\n\n在计算机系统中持久化存储数据最常见的方法是使用`硬盘驱动\
  \ (HDD)`。硬盘是物理设备，通过一组旋转的磁盘盘片存储数据，并使用可移动的读写头在盘片上进行磁性存储（写入和读取磁性图像）。\n\n如今，另一种流行的持久化存储类型被称为`固态硬盘\
  \ (SSD)`。这些驱动器使用集成电路以电子方式存储数据。SSD 内部不包含移动部件，使得它们比 HDD 更快且更具韧性。虽然目前 SSD 的价格比 HDD\
  \ 贵，但技术正在迅速地改变这一状况，HDD 可能很快就会成为过去。\n\nLinux 以相同的方式处理 HDD 和 SSD 存储设备。这主要取决于将驱动器连接到\
  \ Linux 系统的方法。本节描述了 Linux 用于连接和使用 HDD 及 SSD 设备的不同方法。\n\n### 驱动器连接\n\n尽管 HDD 和 SSD\
  \ 存储数据的方式不同，但它们都使用相同的方法与 Linux 系统接口。在 Linux 系统中，你会遇到四种主要的驱动器连接类型：\n\n* `并行 ATA ATA\
  \ (PATA)` 使用并行接口连接驱动器，这需要宽电缆。PATA 每个适配器支持两个设备。\n* `串行 ATA (SATA)` 使用串行接口连接驱动器，但速度比\
  \ PATA 快得多。SATA 每个适配器支持最多四个设备。\n* `小型计算机接口 (SCSI)` 使用并行接口连接驱动器，但具有 SATA 的速度。SCSI\
  \ 每个适配器支持最多八个设备。\n* `非易性内存表达式 (NVMe)` 使用并行接口连接固态硬盘，以实现最大的数据传输速度。NVMe 标准每个适配器支持最多\
  \ 12 个设备。\n\n当你将驱动器连接到 Linux 系统时，Linux 内核会在 `/dev` 文件夹中为该设备分配一个文件。该文件被称为`原始设备 (raw\
  \ device)`，因为它提供了从 Linux 系统直接到驱动器的路径。写入该文件的任何数据都会写入驱动器，读取该文件则直接从驱动器读取数据。\n\n对于 PATA\
  \ 设备，该文件命名为 `/dev/hdx`，其中 `x` 代表单个驱动器的字母，从 `a` 开始。对于 SATA 和 SCSI 设备，Linux 使用 `/dev/sdx`，其中\
  \ `x` 同样是代表单个驱动器的字母，从 `a` 开始。对于 NVMe 设备，Linux 使用 `/dev/nvmenx`，其中 `x` 也是代表单个驱动器的字母。因此，要引用系统上的第一个\
  \ SATA 设备，你会使用 `/dev/sda`，然后是第二个设备 `/dev/sdb`，依此类推。\n\n### 驱动器分区\n\n包括 Linux 在内的大多数操作系统，都允许你将驱动器`分区\
  \ (partition)`为多个区域。分区是驱动器内部的一个自包含的区域，操作系统将其视为独立的存储空间。\n\n对驱动器进行分区可以帮助你更好地组织数据，例如将操作系统数据与用户数据隔离开。如果恶意用户用数据填满了磁盘空间，操作系统仍然有空间在独立的分区上运行。\n\
  \n分区必须由驱动器上的某种索引系统进行跟踪。使用旧 BIOS 启动加载程序方法的系统（见第 5 章，“解释启动过程”）使用`主引导记录 (MBR)` 方法来管理磁盘分区。该方法在每个驱动器上仅支持多多四个`主分区\
  \ (primary partitions)`。然而，每个主分区本身都可以拆分为多个`扩展分区 (extended partitions)`。\n\n使用 UEFI\
  \ 启动加载程序方法的系统（再次见第 5 章）使用更高级的`GUID 分区表 (GPT)` 方法管理分区，它每个驱动器支持最多 128 个分区。Linux 按分区在驱动器上出现的顺序分配分区号，从\
  \ 1 开始。\n\nLinux 为每个单独磁盘分区创建 `/dev` 文件。它将分区号附加到设备名称末尾，并从 1 开始为主分区编号，因此第一个 SATA 驱动器上的第一个主分区是\
  \ `/dev/sda1`。MBR 扩展分区从 5 开始编号，因此第一个扩展分区被分配文件 `/dev/sda5`。\n\n### 自动驱动器检测\n\nLinux\
  \ 系统在启动时检测驱动器和分区，并为每个分区分配一个唯一的设备文件名。然而，随着可移动 USB 驱动器（如优存盘）的发明（这些设备可以在系统运行时随地添加和删除），该方法需要进行修改。\n\
  \n大多数 Linux 系统现在使用 `udev` 应用程序。`udev` 程序始终后台运行，并自动检测连接到运行中的 Linux 系统的新硬件。当你连接新驱动器、USB\
  \ 设备或光驱驱动器（如 CD 和 DVD 设备）时，`udev` 会检测它们并为 `/dev` 文件夹中的每一个分配一个唯一的设备文件名。\n\n`udev`\
  \ 应用程序的另一个功能是它还为存储设备创建了`持久设备文件 (persistent device files)`。当你添加或删除可移动存储设备时，分配给它的\
  \ `/dev` 名称可能会发生变化，取决于当时连接了哪些设备。这会导致应用程序难以找到同一个存储设备。\n\n为了解决这个问题，`udev` 应用程序使用 `/dev/disk`\
  \ 文件夹根据驱动器的唯一属性创建指向 `/dev` 存储设备文件的链接。`udev` 创建了四个独立的文件夹来存储链接：\n\n* `/dev/disk/by-id`\
  \ 通过制造商、品牌、型号和序列号对存储设备建立链接。\n\n\n\n\n\n*   `/dev/disk/by-label` 通过分配给设备的标签（label）来链接存储设备。\n\
  *   `/dev/disk/by-path` 通过设备连接的物理硬件端口来链接存储设备。\n*   `/dev/disk/by-uuid` 通过分配给设备的\
  \ 128 位通用唯一标识符（UUID）来链接存储设备。\n\n通过 `udev` 设备链接，你可以通过永久标识符来专门引用存储设备，而不是根据它插入 Linux\
  \ 系统的位置或时间。\n\n## 分区工具\n\n在将驱动器连接到你的 Linux 系统之后，你需要在其上创建分区（即使只有一个分区）。Linux 提供了几个工具用于处理原始存储设备以创建分区。本节涵盖了你在\
  \ Linux 中会遇到的最常用的分区工具。\n\n### 使用 fdisk\n\n最常用的命令行分区工具是 `fdisk` 实用程序。`fdisk` 程序允许你在任何使用\
  \ MBR 分区索引模式的驱动器上创建、查看、删除和修改分区。\n\n要使用 `fdisk`，你必须指定你想要操作的设备设备名称（而不是分区名称）：\n\n```\n\
  \ $ sudo fdisk /dev/sda\n[sudo] password for rich: \nWelcome to fdisk (util-linux\
  \ 2.23.2).\n\n更改将仅保留在内存中，直到你决定写入它们。\n在使用 write 命令前务要小心。\n\nCommand (m for help):\n\
  ```\n\n`fdisk` 程序使用它自己的命令行，允许你提交命令来操作驱动器分区。表 11.1 显示了你可以使用的常用命令。\n\n| Command |\
  \ Description |\n| --- | --- |\n| `a` | 切换启动标记。 |\n| `b` | 编辑 bsd 磁盘标签。 |\n| `c`\
  \ | 切换 DOS 兼容性标记。 |\n| `d` | 删除分区。 |\n| `g` | 创建新的空 GPT 分区表。 |\n| `G` | 创建 IRIX\
  \ (SGI) 分区表。 |\n| `l` | 列出已知的分区类型。 |\n| `m` | 此菜单。 |\n| `n` | 添加新分区。 |\n| `o` |\
  \ 创建新的空 DOS 分区表。 |\n| `p` | 打印分区表。 |\n| `q` | 不保存更改并退出。 |\n| `s` | 创建新的空 Sun 磁盘标签。\
  \ |\n| `t` | 更改分区的系统 ID。 |\n| `u` | 更改显示/输入单位。 |\n| `v` | 验证分区表。 |\n| `w` | 将表写入磁盘并退出。\
  \ |\n| `x` | 额外功能（仅限专家）。 |\n\n表 11.1 常用 `fdisk` 命令\n\n`p` 命令显示驱动器上当前的分区方案：\n\n```\n\
  \ Command (m for help): p\n\nDisk /dev/sda: 10.7 GB, 10737418240 bytes, 20971520\
  \ sectors\nUnits = sectors of 1 * 512 = 512 bytes\nSector size (logical/physical):\
  \ 512 bytes / 512 bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisk\
  \ label type: dos\nDisk identifier: 0x000528e6\n\n  Device Boot      Start     \
  \     End      Blocks    Id  System\n/dev/sda1    *         2048      2099199  \
  \   1048576   83  Linux\n/dev/sda2             2099200   20971519     9436160  \
  \ 83  Linux\n\nCommand (m for help):\n```\n\n在这个示例中，`/dev/sda` 驱动器被分为两个分区：`sda1`\
  \ 和 `sda2`。`Id` 和 `System` 列引用分区格式化为处理的文件系统类型。我在本章稍后的“理解文件系统”部分中介绍了这一点。两个分区都格式化为支持\
  \ Linux 文件系统。第一个分区分配了约 1 GB 的空间，而第二个分区分配了略多 9 GB 的空间。\n\n`fdisk` 命令有些原始，因为它不允许你更改现有分区的大小；你所能做的只是删除现有分区并从头开始重建。\n\
  \n为了能够从分区启动系统，你必须为该分区设置启动标记。你可以通过 `a` 命令实现这一点。输出列表中用用星号表示可启动的分区。\n\n如果你对驱动器分区进行了任何更改，你必须使用\
  \ `w` 命令退出并将更改写入驱动器。\n\n### 使用 gdisk\n\n如果你正在处理使用 GPT 索引模式的驱动器，将需要使用 `gdisk` 程序：\n\
  \n```\n $ sudo gdisk /dev/sda\n[sudo] password for rich: \nGPT fdisk (gdisk) version\
  \ 1.0.3\n\nPartition table scan:\n  MBR: protective\n  BSD: not present\n  APM:\
  \ not present\n  GPT: present\n\n找到带有保护性 MBR 的有效 GPT；使用 GPT。\n\nCommand (? for help):\n\
  ```\n\n`gdisk` 程序识别驱动器上使用的格式类型。如果驱动器当前没有使用 GPT 方法，`gdisk` 将为你提供转换为 GPT 驱动器的选项。\n\
  \n`gdisk` 程序也使用它自己的命令提示符，允许你输入命令来操作驱动器布局，如表 11.2 所示。\n\n| Command | Description\
  \ |\n| --- | --- |\n| `b` | 将 GPT 数据备份到文件。 |\n| `c` | 更改分区名称。 |\n| `d` | 删除分区。 |\n\
  | `i` | 显示分区的详细信息。 |\n| `l` | 列出已知的分区类型。 |\n| `n` | 添加新分区。 |\n| `o` | 创建新的空 GUID\
  \ 分区表 (GPT)。 |\n| `p` | 打印分区表。 |\n| `q` | 不保存更改并退出。 |\n| `r` | 恢复和转换选项（仅限专家）。 |\n\
  | `s` | 排序分区。 |\n| `t` | 更改分区类型代码。 |\n| `v` | 验证磁盘。 |\n| `w` | 将表写入磁盘并退出。 |\n| `x`\
  \ | 额外功能（仅限专家）。 |\n| `?` | 此菜单。 |\n\n表 11.2 常用 `gdisk` 命令\n\n你会发现 `gdisk` 的许多命令与\
  \ `fdisk` 程序中的命令相似，这使得在两个程序之间切换变得容易。新增的一个有用选项是 `i` 选项，它可以显示关于分区的更详细信息：\n\n```\n\
  \ Command (? for help): i\nPartition number (1-3): 2\nPartition code: 0FC63DA9-8483-4772-8E79-3D698477DE4\
  \ (Linux filesystem)\nUnique GUID: 5E421F9-9566-4898-8B4E-FB888ADE78\nFirst sector:\
  \ 195372 (at 954.0 MiB)\nLast sector: 26623999 (at 12.7 GiB)\nPartition size: 24670208\
  \ sectors (11.8 GiB)\nAttribute flags: 000000000000000\nPartition name: ''\n\nCommand\
  \ (? for help):\n```\n\n### GNU parted 命令\n\nGNU `parted` 程序提供了另一种用于处理分区的命令行界面：\n\
  \n```\n $ sudo parted\nGNU Parted 3.2\nUsing /dev/sda\nWelcome to GNU Parted! 输入\
  \ 'help' 查看命令列表。\n(parted) print\nModel: VBOX HARDDISK (scsi)\nDisk /dev/sda: 15.6GB\n\
  Sector size (logical/physical): 512B/512B\nPartition Table: gpt\nDisk Flags: \n\n\
  Number  Start  End      Size   File system  Name    Flags\n1       1049kB  1000MB\
  \   999MB  fat32               boot,esp\n2       1000MB  13.6GB  12.6GB ext4\n3\
  \       13.6GB  15.6GB  2000MB linux-swap(v1)\n\n(parted)\n```\n\n`parted` 程序的一个卖点是它允许修改现有分区的大小，因此你可以轻松地缩小或扩大驱动器上的分区。\n\
  \n## 图形化工具\n\n如果你在图形桌面环境中工作，也可以使用一些图形化工具。这些工具中最常用的是 GNOME 分区编辑器，称为 *GParted*。图 11.1\
  \ 显示了在 Ubuntu 桌面环境中运行 `gparted` 命令的示例。\n\n![G Parted 截图显示了三个分区，带有文件系统、挂载点、大小、已用、未使用和标记详情](img/c11f001.png)\n\
  \n图 11.1 GParted 界面\n\n`gparted` 窗口一次显示系统上的每个驱动器，以图形布局显示该驱动器包含的所有分区。右键点击分区可以选择挂载或卸载、格式化、删除或调整分区大小的选项。\n\
  \n\n\n\n\n虽然以原始设备的方式与驱动器交互是可能的，但这通常不是 Linux 应用程序的工作方式。向原始设备读写数据需要大量工作。相反，Linux 提供了一种为我们处理所有脏活累的方法，该方法将在下一节中介绍。\n\
  \n## 理解文件系统\n\n就像在衣柜里存放东西一样，在 Linux 系统中存储数据需要某些组织方法才能高效。Linux 利用 `filesystems` 来管理存储在存储设备上的数据。文件系统利用维护映射的方法来定位放置在存储设备中的每个文件。本节描述了\
  \ Linux 文件系统，并展示了如何定位其中的文件和文件夹。\n\nLinux 文件系统可能是使用 Linux 时最困惑的方面之一。最初在驱动器、CD 和 USB\
  \ 闪存上定位文件可能是一个挑战。\n\n如果你熟悉 Windows 如何管理文件和文件夹，你就知道 Windows 为连接到系统的每个存储设备分配`驱动器器`。例如，Windows\
  \ 使用 `C:` 作为系统主驱动器，或使用 `E:` 作为插入系统的 USB 闪存。\n\n在 Windows 中，你习惯了看到类似这样的文件路径：\n\n\
  ```\nC:\\Users\\rich\\Documents\\test.docx\n```\n\n此路径表示文件位于`rich` 用户账户的`Documents`\
  \ 文件夹中，该文件夹存储在分配字母 `C` 的磁盘分区（通常是系统上的第一个驱动器）。\n\nWindows 路径确切告诉你文件存储在哪个物理设备上。然而，Linux\
  \ 不使用这种方法引用文件。它使用`虚拟目录`结构。虚拟目录包含了系统上安装的所有存储设备的文件路径，并合并到一个单一目录结构中。\n\n### 虚拟目录\n\n\
  Linux 虚拟目录结构包含一个单一根目录，称为`根目录`（root directory）。根目录根据访问其所需的文件夹路径列出其下的文件和文件夹，类似于 Windows\
  \ 的做法。\n\n例如，Linux 文件路径可能看起来如下：\n\n```\n/home/rich/Documents/test.doc\n```\n\n首先，注意\
  \ Linux 路径使用正斜杠而不是 Windows 使用的反斜杠。这是一个让许多初学者 Linux 管理员感到困惑的重要区别。至于路径本身，还要注意没有驱动器字母。路径仅指示文件\
  \ `test.doc` 存储在用户 `rich` 的 `Documents` 文件夹中；它没有提供关于哪个物理设备包含文件的任何线索。\n\nLinux 使用`挂载点`（mount\
  \ points）将物理设备置于虚拟目录中。挂载点是虚拟目录内的文件夹占位符，指向特定的物理设备。图 11.2 展示了这是如何工作的。\n\n![硬盘 1 包含\
  \ bin, e t c, home, m n t；以及硬盘 2 包含带有标签的 Barbara, katie, Jessica, rich](img/c11f002.png)\n\
  \n图 11.2 分在两个驱动器之间的 Linux 虚拟目录结构\n\n在图 11.2 中，Linux 系统使用了两个驱动器。左侧第一个驱动器与虚拟目录的根相关。第二个驱动器挂载在\
  \ `/home` 位置，这是用户文件夹所在。一旦第二个驱动器挂载到虚拟目录，存储在驱动器上的文件和文件夹就可以在 `/home` 文件夹可用。\n\n由于 Linux\
  \ 将一切存储在虚拟目录中，它可能会变得相当复杂。幸运的是，Linux 虚拟目录定义了一个标准格式，称为 Linux`文件系统层次结构标准 (FHS)`。FHS\
  \ 定义了每个 Linux 系统上应该存在的核心文件夹名称和位置，以及它们应该包含什么类型的数据。表 11.3 显示了 FHS 定义的一些常见文件夹。\n\n\
  | 文件夹 | 描述 |\n| --- | --- |\n| `/bin` | 系统在单用户模式下运行所需的执行程序 |\n| `/boot` | 包含用于启动系统的引导加载程序文件\
  \ |\n| `/dev` | 设备文件 |\n| `/etc` | 系统服务配置文件 |\n| `/home` | 包含用户数据文件 |\n| `/lib`\
  \ | 可执行程序所需的库文件 |\n| `/media` | 用作可移动设备的挂载点 |\n| `/mnt` | 也作为可移动设备的挂载点 |\n| `/opt`\
  \ | 包含可选第三方程序的数据 |\n| `/proc` | 虚拟文件系统，以文件形式提供内核和进程信息，实时更新 |\n| `/root` | root 用户账户的家目录\
  \ |\n| `/sbin` | 系统所需的执行程序 |\n| `/sys` | 虚拟文件系统，以文件形式提供设备、驱动和某些内核信息，实时更新 |\n| `/tmp`\
  \ | 包含系统用户创建的临时文件 |\n| `/usr` | 包含标准 Linux 程序的数据 |\n| `/usr/bin` | 包含本地用户程序和数据 |\n\
  | `/usr/local` | 包含本地安装唯一程序的数据 |\n| `/usr/sbin` | 包含系统程序和数据 |\n| `/var` | 内容预期频繁更改的文件，例如日志文件\
  \ |\n\n表 11.3 常见的 Linux FHS 文件夹\n\n### 在文件系统中移动\n\n使用虚拟目录使得将文件从一个物理设备移动到另一个设备变得轻而易举。你不需要担心驱动器字母，只需关注虚拟目录内的位置：\n\
  \n```\n$ cp /home/rich/Documents/myfile.txt /media/usb\n```\n\n在将文件从 `Documents`\
  \ 文件夹移动到 USB 闪存时，我对文件和 USB 闪存都使用了虚拟目录内的完整路径。这种格式被称为`绝对路径`。文件的绝对路径始终从根目录（`/`）开始，并包括虚拟目录树中到文件的每一个文件夹。\n\
  \n或者，你可以使用`相对路径`（relative path）来指定文件位置。文件的相对路径表示文件相对于你在虚拟目录树结构中当前位置的位置。如果你已经位于 `Documents`\
  \ 文件夹中，你只需要输入：\n\n```\n$ cp myfile.txt /media/usb\n```\n\n当 Linux 看到路径不以正斜杠开头时，它假设该路径是相对于当前目录的相对路径。\n\
  \n## 格式化文件系统\n\n在将驱动器分区分配给虚拟目录中的挂载点之前，你必须使用文件系统对其进行格式化。Linux 支持许多不同的文件系统类型，每种都有不同的功能和能力。本节讨论\
  \ Linux 支持的不同文件系统以及如何为这些文件系统格式化驱动器分区。\n\n### 常见文件系统类型\n\n每个操作系统都使用自己的文件系统类型在驱动器上存储数据。Linux\
  \ 不仅支持自己的文件系统类型，还支持其他操作系统的文件系统。我们将介绍可以在 Linux 分区中常用的常用的 Linux 和非 Linux 文件系统。\n\n\
  #### Linux 文件系统\n\n当你专门为 Linux 系统使用创建一个文件系统时，有七种主要的文件系统可以选择：\n\n* `btrfs`: 一种较新的、高性能的文件系统，支持大小达\
  \ 16 艾字节（EiB）的文件和总文件系统大小为 16 EiB。它还可以执行自身的独立冗余磁盘阵列 (RAID) 以及逻辑卷管理 (LVM)。它还包含其他高级功能，如用于备份的内置快照、改进的容错能力和实时数据压缩。\n\
  \n\n\n\n\n- `eCryptfs`: 企业级加密文件系统 (eCryptfs) 在将数据存储到设备之前应用符合 POSIX 标准的加密协议。这为存储在设备上的数据提供了一层保护。只有创建该文件系统的操作系统才能从从中读取数据。\n\
  - `ext3`: 也称为 `ext3fs`，是原始 Linux ext 文件系统的后代。它支持最大为 2 tebib 字节 (TiB) 的文件，文件系统总大小为\
  \ 16 TiB。它还支持日志功能以及更快的启动和恢复速度。\n- `ext4`: 也称为 `ext4fs`，是原始 Linux 文件系统的当前版本。它支持最大为\
  \ 16 TiB 的文件，文件系统总大小为 1 EiB。它还支持日志功能并利用改进的性能特性。\n- `XFS`: 一由 Silicon Graphics 在\
  \ 1993 年创建的 64 位高性能日志文件系统，于 2001 年移植到 Linux。它支持高达 8 艾字节（exbibytes）的文件系统。\n- `tmpfs`:\
  \ 临时文件系统，允许你在内存中创建一个文件系统，该系统会在重启时被销毁。\n- `swap`: 交换文件系统允许你使用物理驱动器空间为系统创建虚拟内存。系统随后可以将数据从普通内存交换到交换空间，为你的系统提供增加内存的方法。这并非用于存储持久化数据。\n\
  \n如今，大多数 Linux 发行版都使用 `ext4fs` 文件系统作为默认值，尽管红帽（Red Hat）最近选择了 `XFS` 文件系统作为默认值。这两个文件系统都提供*日志记录（journaling）*，这是一种在日志文件中跟踪尚未写入磁盘的数据的方法，该文件被称为日志。如果系统在数据写入磁盘之前发生故障，日志数据可以在下次系统启动时被恢复并存储。\n\
  \n## 非 Linux 文件系统\n\nLinux 具有如此多功能用途的伟大特性之一是，它能够读取存储在为其他操作系统（如苹果和微软）格式化的设备上的数据。这一特性使得在运行不同操作系统的系统之间共享数据变得轻而易举。\n\
  \n以下是 Linux 可以处理常见的非 Linux 文件系统列表：\n\n- `CIFS`: 通用网络文件系统 (CIFS) 是微软创建的一种文件系统协议，用于通过网络存储设备在网络上读写数据。它已向公众发布，供所有操作系统使用。\n\
  - `HFS`: 分级文件系统 (HFS) 是苹果为其 macOS 系统开发的。Linux 也可以与更先进的 `HFS+` 文件系统交互。\n- `ISO-9660`:\
  \ `ISO-9660` 标准用于在 CD-ROM 设备上创建文件系统。\n- `NFS`: 网络文件系统 (NFS) 是一种开源标准，用于通过网络存储设备在网络上读写数据。\n\
  - `NTFS`: 新技术文件系统 (NTFS) 是微软 NT 操作系统及后续版本 Windows 使用的文件系统。从 `2.6.x` 内核版本开始，Linux\
  \ 就可以在 `NTFS` 分区上读写数据。\n- `SMB`: 服务器消息块 (SMB) 文件系统是微软创建的一种专有文件系统，用于网络存储和与其它网络设备（如打印机）进行交互。对\
  \ `SMB` 的支持允许 Linux 客户端和服务器与网络上的微软客户端和服务器交互。\n- `UDF`: 通用光盘格式 (UDF) 常用于 DVD-ROM\
  \ 设备存储数据。Linux 可以使用该文件系统同时从 DVD 读取数据并向 DVD 写入数据。\n- `VFAT`: 虚拟文件分配表 (VFAT) 是原始微软文件分配表\
  \ (FAT) 文件系统的扩展。它通常不用于磁盘，但常用于 USB 闪盘等可移动存储设备。\n- `ZFS`: 泽字节文件系统 (ZFS) 是由太阳微系统（现为甲骨文的一部分）为其\
  \ Unix 工作站和服务器创建的。作为另一种高性能文件系统，它具有与 Linux `btrfs` 文件系统类似的特性。\n\n如果你计划仅将驱动器用于 Linux\
  \ 系统，通常不建议使用非 Linux 文件系统格式化分区。Linux 支持这些文件系统主要作为与其他操作系统共享数据的方法。\n\n## 创建文件系统\n\n\
  Linux 中创建文件系统的“瑞士军刀”是 `mkfs` 程序。`mkfs` 程序实际上是用于创建特定文件系统的多个独立工具的前端，例如用于创建 ext4 文件系统的\
  \ `mkfs.ext4` 程序。\n\n`mkfs` 程序的妙之处在于，你只需要记住一个程序名称即可在 Linux 系统上创建任何类型的文件系统。只需使用 `-t`\
  \ 选项指定文件系统类型即可：\n\n```\n$ sudo mkfs -t ext4 /dev/sdb1\nmke2fs 1.4.1 (24-Mar-2018)\n\
  Creating filesystem with 2621440 4k blocks and 655360 inodes\nFilesystem UUID: f9137b26-0caf-4a8a-afd0-392002424ee8\n\
  Superblock backups stored on blocks: \n\n32768, 98304, 163840, 229376, 294912, 819200,\
  \ 884736, 1605632\nAllocating group tables: done \nWriting inode tables: done \n\
  Creating journal (16384 blocks): done\nWriting superblocks and filesystem accounting\
  \ information: done \n$\n```\n\n在指定 `-t` 选项后，只需在命令行中指定你想要格式化的分区设备文件名即可。请注意，`mkfs`\
  \ 程序在格式化文件系统时会在后台完成大量工作。每个文件系统都有其索引文件和文件夹以及跟踪文件访问的方法。`mkfs` 程序会创建特定文件系统所需的所有索引文件和表。\n\
  \n## 挂载文件系统\n\n一旦你用文件系统格式化了驱动器分区，就可以将其添加到 Linux 系统的虚拟目录中。这一过程被称为*挂载（mounting）*文件系统。\n\
  \n你可以从命令行在虚拟目录结构中手动挂载分区，也可以允许 Linux 在启动时自动挂载分区。本节将为你介绍这两种方法。\n\n### 手动挂载设备\n\n要将文件系统临时挂载到\
  \ Linux 虚拟目录，请使用 `mount` 命令。`mount` 命令的基本格式为\n\n```\nmount -t fstype device mountpoint\n\
  ```\n\n使用 `-t` 命令行选项指定设备的文件系统类型：\n\n```\n$ sudo mount -t ext4 /dev/sdb1 /media/usb1\n\
  $\n```\n\n如果你在指定 `mount` 命令时不带参数，它将显示当前挂载在 Linux 系统上的所有设备。不过，请准备好面对大量的输出，因为大多数 Linux\
  \ 发行版会在虚拟目录中挂载大量虚拟设备，以提供系统资源的信息。列表 11.1 显示了 `mount` 命令的部分输出。\n\n为了节省空间，我精简了 `mount`\
  \ 命令的输出，仅显示系统上的物理设备。硬盘设备（`/dev/sda`）包含两个分区，USB 闪盘设备（`/dev/sdb`）也包含两个分区。\n\n`mount`\
  \ 命令的缺点是它只在虚拟目录中临时挂载设备。当你重启系统时，必须手动手动挂载设备。对于 USB 闪盘等可移动设备通常没问题，但对于更持久的设备，如果 Linux\
  \ 能自动为我们挂载就太好了。幸运的是，Linux 可以做到。\n\n要从虚拟目录中移除已挂载的驱动器，请使用 `umount` 命令（注意缺少 *n*）。你可以通过指定设备文件名或挂载点目录来移除挂载的驱动器。\n\
  \n### 自动挂载设备\n\n\n\n\n\n对于持久性存储设备，Linux 维护 `/etc/fstab` 文件来指示在启动时应将哪些驱动器挂载到虚拟目录。`/etc/fstab`\
  \ 文件是一个表格，列出了驱动器文件（原始文件或其一个永久性 `udev` 文件名）、挂载点位置、文件系统类型以及挂载驱动所需的任何额外选项。列表 11.2 显示了来自\
  \ Ubuntu 工作站的 `/etc/fstab` 文件。\n\n此 `/etc/fstab` 文件通过设备的 `udev` UUID 值来引用设备，确保无论磁盘分区在原始设备表中的出现顺序如何，都能访问正确的磁盘分区。第一个分区挂载在虚拟目录的\
  \ `/boot/efi` 挂载点。第二个分区挂载在虚拟目录的根目录（`/`），第三个分区被挂载作为虚拟内存的交换区域（swap area）。\n\n你可以手动将设备添加到\
  \ `/etc/fstab` 文件中，以便它们在 Linux 系统启动时自动挂载。然而，如果这些设备在启动时不存在，将产生启动错误。\n\n一种更动态的自动挂载文件系统的方法是\
  \ `autofs` 程序。`autofs` 程序在后台作为守护进程运行，监控 `/etc/auto.master` 配置定义的文件系统。当进程尝试访问受监控文件系统中的文件时，`autofs`\
  \ 会自动挂载该文件系统。然后，在设定的一段时间闲后，它会自动卸载该文件系统。\n\n## 管理文件系统\n\n一旦创建了文件系统并将其挂载到虚拟目录，你可能需要对其进行管理和维护，以保持运行顺畅。本节将介绍一些用于管理\
  \ Linux 系统上文件系统的 Linux 工具。\n\n### 获取文件系统统计信息\n\n在使用 Linux 系统时，无疑在某时刻你将监控磁盘性能和使用情况。有几种不同的工具可以帮助你实现：\n\
  \n* `df` 按分区显示磁盘使用情况。\n* `du` 按目录显示磁盘使用情况，适用于查找占用磁盘空间的用户或应用程序。\n* `fio` 显示文件系统输入/输出测试的性能测试统计数据。\n\
  * `iostat` 显示分区的磁盘统计实时图表。\n* `lsblk` 显示当前分区大小和挂载点。\n\n使用 `df` 和 `du` 命令是快速获取 Linux\
  \ 系统磁盘空间状况快照的方法：\n\n```\n $ df -t xfs -h\nFilesystem         Size  Used  Avail \
  \ Use%  Mounted on\n/dev/mapper/rl-root   15G  6.6G  7.7G  47%  /\n/dev/sda1   \
  \          1014M   351M   664M  35%  /boot\n$ sudo du -d 1\n318632  ./boot\n0  \
  \     ./dev\n0       ./proc\n9448    ./run\n0       ./sys\n32400   ./etc\n48   \
  \   ./root\n704712  ./var\n5711056  ./usr\n114656  ./home\n369421  ./media\n0  \
  \     ./mnt\n18856   ./opt\n0       ./srv\n12      ./tmp\n7279241 .\n$\n```\n\n\
  `df` 命令显示系统上可用的磁盘空间，而 `du` 命令帮助显示哪些目录包含最多数据。\n\n除了这些工具外，`/proc` 和 `/sys` 文件夹是内核用于记录系统统计信息的特殊文件系统。处理文件系统时两个非常有用的目录是\
  \ `/proc/partitions` 和 `/proc/mounts` 文件夹，它们分别提供系统分区和挂载点的信息。此外，`/sys/block` 文件夹包含每个挂载驱动器的独立文件夹，显示分区和内核级统计数据。\n\
  \n### 文件系统工具\n\nLinux 使用 `e2fsprogs` 工具包提供处理 ext 文件系统（如 ext3 和 ext4）的实用。`e2fsprogs`\
  \ 包中最常用的工具如下：\n\n* `blkid` 显示块设备（如存储驱动器）的信息。\n* `chattr` 更改文件系统上的文件属性。\n* `debugfs`\
  \ 手动查看和修改文件系统结构，例如恢复删除的文件或提取损坏的文件。\n* `dumpe2fs` 显示块和超级块组信息。\n* `e2label` 更改文件系统的标签。\n\
  * `resize2fs` 扩展或缩小文件系统。\n* `tune2fs` 修改文件系统参数。\n\n这些工具帮助你精调 ext 文件系统上的参数，但如果文件系统本身发生损坏，则你需要\
  \ `fsck` 程序。\n\nXFS 文件系统也有一组用于调优文件系统的工具。以下是给你最可能会运行的四个：\n\n* `xfs_admin` 显示或更改文件系统参数，如分配的标签或\
  \ UUID。\n* `xfs_info` 显示挂载文件系统的信息，包括块大小、扇区大小以及标签和 UUID 信息。\n* `xfs_growfs` 允许你调整\
  \ XFS 文件系统的大小。\n* `xfs_repair` 尝试修复 XFS 文件系统的问题。\n\n如果你在使用 btrfs 文件系统，`btrfs` 命令提供了多个用于管理文件系统的实用程序：\n\
  \n* `balance` 在多个设备之间平衡文件系统块（chunks）。\n* `check` 对 btrfs 文件系统进行离线检查。\n* `device`\
  \ 通过添加或删除物理设备为 btrfs 文件系统提供设备管理。\n* `filesystem` 为现有 btrfs 文件系统提供文件系统管理工具，例如显示信息和调整文件系统大小。\n\
  * `quota` 允许对 btrfs 文件系统设置配额。\n* `restore` 允许从损坏的 btrfs 文件系统恢复文件。\n\n虽然这些 ext、XFS\
  \ 和 btrfs 工具很有用，但如果文件系统本身存在错误，它们无法帮助修复问题。为此，应该使用 `fsck` 程序：\n\n```\n $ sudo fsck\
  \ -f /dev/sdb1\nfsck from util-linux 2.31.1\ne2fsck 1.44.1 (24-Mar-2018)\nPass 1:\
  \ Checking inodes, blocks, and sizes\nPass 2: Checking directory structure\nPass\
  \ 3: Checking directory connectivity\nPass 4: Checking reference counts\nPass 5:\
  \ Checking group summary information\n/dev/sdb1: 11/655360 files (0.0% non-contiguous),\
  \ 66753/2621440 blocks\n$\n```\n\n`fsck` 程序是多个不同程序的界面，这些程序检查各种文件系统以使索引与存储在文件系统中的实际文件匹配。如果发生任何差异，请以修复模式运行\
  \ `fsck` 程序，它将尝试协调差异并修复文件系统。\n\n## 存储替代方案\n\n存储设备上的标准分区布局确实存在局限性。一旦创建并格式化了分区，就很难将其变大或缩小。单个分区也容易磁盘故障的影响，在这种情况下，分区中存储的所有数据将丢失。\n\
  \n为了适应更动态的存储选项以及容错功能，Linux 整合了一些先进的存储管理技术。本节涵盖了你可能会遇到的三种常用技术。\n\n### 多路径 (Multipath)\n\
  \nLinux 内核现在支持设备映射多路径（DM-multipathing），它允许你在 Linux 系统和网络存储设备之间配置多条路径。多路径聚合路径，在所有路径激活时提供更高的吞吐量，或在其中一条路径变为活动时提供容错。\n\
  \nLinux DM-multipathing 包含以下工具：\n\n* `dm-multipath`: 提供多路径支持的内核模块。\n* `multipath`:\
  \ 用于查看多路径设备的命令行。\n* `multipathd`: 用于监控路径并激活/停用路径的后台进程。\n* `kpartx`: 为多路径存储设备创建设备条目的命令行工具。\n\
  \n\n\n\n\nDM-multipath 功能使用了 Linux 中的动态 `/dev/mapper` 设备文件文件夹。每当你向系统添加一个新的多路径存储设备时，Linux\
  \ 都会为其创建一个名为 `mpathN` 的 `/dev/mapper` 设备文件，其中 `N` 是多路径驱动器的编号。该文件对 Linux 系统充当普通设备文件，允许你像处理普通硬盘分区一样在多路径设备上创建分区和文件系统。\n\
  \n### 逻辑卷管理器\n\nLinux `逻辑卷管理器 (Logical Volume Manager, LVM)` 也利用 `/dev/mapper` 动态设备文件夹允许你创建虚拟驱动器设备。你可以将多个物理硬盘分区聚合为虚拟卷，然后将其作为系统上的单个分区处理。\n\
  \nLVM 的用处在于，你可以根据需要向逻辑卷中添加或删除物理分区，并根据需要扩展或缩小逻辑卷。\n\n使用 LVM 相当复杂。插图 11.3 展示了 LVM\
  \ 环境的布局。\n\n![卷组 1 的插图显示了 3 个物理卷，每个卷有 3 个分区，并高亮了三个逻辑卷。](img/c11f003.png)\n\n图 11.3\
  \ Linux LVM 布局\n\n在图 11.3 所示的示例中，三个物理驱动器各包含三个分区。第一个逻辑卷由第一个驱动器的前两个分区组成。第二个逻辑卷跨越驱动器，将第一个驱动器的第三个分区与第二个驱动器的第一两个分区合并为一个卷。第三个逻辑卷由第二个驱动器的第三个分区和第三个驱动器的前两个分区组成。第三个驱动器的第三个分区未被分配，以后需要时可以添加到任何逻辑卷中。\n\
  \n对于每个物理分区，你必须在 `fdisk` 或 `gdisk` 中将分区类型标记为 Linux LVM 文件系统类型。然后，你必须使用若干 LVM 工具来创建和管理逻辑卷。表\
  \ 11.4 列出了 Linux 中可用的 LVM 工具。\n\n| Command | Description |\n| --- | --- |\n| `lvchange`\
  \ | 修改逻辑卷的设置 |\n| `lvconvert` | 为非镜像逻辑卷添加或删除镜像 |\n| `lvcreate` | 创建逻辑卷 |\n| `lvdisplay`\
  \ | 显示逻辑卷的信息 |\n| `lvextend` | 向现有逻辑卷中添加空间 |\n| `lvmdump` | 创建 LVM 设置的 tar 包 |\n\
  | `lvremove` | 现有逻辑卷 |\n| `lvrename` | 更改逻辑卷的名称 |\n| `lvresize` | 更改逻辑卷的大小 |\n|\
  \ `lvs` | 显示逻辑卷的信息 |\n| `lvsscan` | 扫描系统中的逻辑卷 |\n| `pvchange` | 修改物理卷的设置 |\n| `pvck`\
  \ | 检查物理卷上 LVM 元数据的一致性 |\n| `pvcreate` | 创建物理卷 |\n| `pvdisplay` | 显示物理卷的信息 |\n|\
  \ `pvmove` | 将任何使用的卷从一个设备移动到另一个设备 |\n| `pvremove` | 物理卷 |\n| `pvs` | 显示物理卷的信息 |\n\
  | `pvscan` | 扫描磁盘中的 LVM 和非 LVM 卷 |\n| `vgcfbackup` | 创建卷组元数据的文本备份 |\n| `vgcfrestore`\
  \ | 从备份文件恢复卷组元数据 |\n| `vgchange` | 修改卷组的设置 |\n| `vgck` | 检查卷组的完整性 |\n| `vgconvert`\
  \ | 将 LVM 元数据从一种格式更改为另一种 |\n| `vgcreate` | 将物理卷合并为卷组 |\n| `vgdisplay` | 显示卷组的信息\
  \ |\n| `vgexport` | 导出卷组 |\n| `vgextend` | 向现有卷组添加物理卷 |\n| `vgimport` | 导入卷组 |\n\
  | `vgimportclone` | 导入并重命名复制的卷组 |\n| `vgmerge` | 将两个卷组合并为一个卷组 |\n| `vmremove` |\
  \ 从卷组中删除物理卷 |\n| `vgrename` | 更改现有卷组的名称 |\n| `vgs` | 显示卷组的信息 |\n| `vgscan` | 扫描磁盘中的\
  \ LVM 卷组 |\n\n表 11.4 Linux LVM 命令\n\n逻辑卷在 `/dev/mapper` 文件夹中创建条目，代表 LVM 设备，你可以对其进行文件系统格式化并像普通分区一样使用它。列表\
  \ 11.3 显示了创建新的 LVM 逻辑卷并将其挂载到你的虚拟目录的步骤。\n\n虽然 LVM 的初始设置很复杂，但它确实提供了巨大的用处。如果逻辑卷空间不足，只需向该卷添加新的磁盘分区即可。\n\
  \n### 使用 RAID 技术\n\n`廉价磁盘冗余阵列 (RAID, 简称 RAID)` 技术改变了大多数数据中心的数据存储环境。RAID 技术允许通过将多个驱动器合并为一个虚拟驱动器，来提高数据访问性能和可靠性，并实现数据冗余以达到容错。常用的\
  \ RAID 版本有几种：\n\n- `RAID-0`：磁盘条纹，将数据分散在多个磁盘上以便更快速访问。\n- `RAID-1`：磁盘镜像，在两个驱动器上复制数据。\n\
  - `RAID-10`：磁盘镜像和条纹，提供用于性能的条纹和用于容错的镜像。\n- `RAID-4`：带校验位的磁盘条纹，增加一个存储在单独磁盘上的校验位，以便在数据磁盘故障时可以恢复其上的数据。\n\
  - `RAID-5`：带分布式校验位的磁盘条纹，在数据条带中添加一个校验位，使其出现在所有磁盘上，这样任何损坏的磁盘都可以被恢复。\n- `RAID-6`：带双校验位的磁盘条纹，对数据和校验位都进行条纹化，因此可以恢复两个的驱动器。\n\
  \n缺点是硬件 RAID 存储设备可能相当贵（尽管 `I` 代表的意思并非如此），而且对于大多数家庭用途来说是不实际的。因此，Linux 实现了一种软件 RAID\
  \ 系统，可以在任何磁盘系统上实现 RAID 特性。\n\n`mdadm` 工具允许你为任何类型的 RAID 环境指定要使用的多个分区。RAID 设备显示为 `/dev/mapper`\
  \ 文件夹中的单个设备，然后你可以对其进行分区并格式化为特定的文件系统。你可以通过显示 `/proc/mdstat` 文件的内容来查看内核 RAID 状态的当前状况。\n\
  \n### 加密分区\n\n如今数据安全在大多数业务环境中是必不可少的。随着便携笔记本电脑和外部存储设备的普及，敏感的公司（有时是个人）数据很容易被小偷窃取。\n\
  \n保护数据的一种防线是加密。Linux 提供了加密单个文件的工具，但这可能非常繁琐。更好的解决方案是加密存储数据的整个分区。那里的一种流行工具是 `Linux\
  \ 统一密钥设置 (LUKS, LUKS)`。LUKS 系统由 Clemens Fruhwirth 于 2004 年专门为加密 Linux 分区而创建。\n\n\
  LUKS 的核心工具是 `cryptsetup`。它允许你创建加密分区，然后打开它们以便在 Linux 虚拟目录中进行格式化和挂载。\n\n第一步是使用 `luksFormat`\
  \ 格式化用于加密的分区：\n\n```\nsudo cryptsetup -y -v luksFormat /dev/sdb1\n```\n\n警告！\n\n\
  这将不可恢复地覆盖 /dev/sdb1 上的数据。\n\n你确定吗？（输入大写的 'yes'）：YES\n输入 /dev/sdb1 的密码句： \n验证密码句：\
  \ \n密钥槽 0 已创建。\n命令成功。\n\n在这一步中，你必须指定打开加密分区所需的密码句。\n\n创建加密分区后，你可以使用 `luksOpen` 选项使其可用：\n\
  \n\n\n\n\n```\n $ sudo cryptsetup -v luksOpen /dev/sdb1 safedata\nEnter passphrase\
  \ for /dev/sdb1: \nKey slot 0 unlocked.\nCommand successful.\n$\n```\n\n`luksOpen`\
  \ 选项要求您知道加密分区所需的密码。`luksOpen` 选项后的第一个参数指定物理分区，第二个参数定义了一个将打开的分区映射到 `/dev/mapper`\
  \ 目录中虚拟设备的名称：\n\n```\n $ ls /dev/mapper -l\ntotal 0\ncrw-------. 1 root root 10,236\
  \ Dec 22 08:29 control\nlrwxrwxrwx. 1 root root       7 Dec 22 08:29 rl-root ->\
  \ ../dm-0\nlrwxrwxrwx. 1 root root       7 Dec 22 08:29 rl-swap -> ../dm-1\nlrwxrwxrwx.\
  \ 1 root root       7 Dec 22 09:02 safedata -> ../dm-2\n$\n```\n\n`/dev/mapper/safedata`\
  \ 设备文件现在引用已打开的加密分区，可以像普通的 Linux 分区一样处理：\n\n```\n $ sudo mkfs -t ext4 /dev/mapper/safedata\n\
  mke2fs 1.45.6 (20-Mar-2020)\nCreating filesystem with 257792 4k blocks and 64512\
  \ inodes\nFilesystem UUID: e2f03597-0108-48b3-a66b-d58fdd9c427f\nSuperblock backups\
  \ stored on blocks: \n       32768, 98304, 163840, 229376\n\nAllocating group tables:\
  \ done                           \nWriting inode tables: done                  \
  \          \nCreating journal (4096 blocks): done\nWriting superblocks and filesystem\
  \ accounting information: done\n\n$ sudo mount /dev/mapper/safedata /mnt/mydata\n\
  $\n```\n\n在创建文件系统并挂载分区后，您可以像处理任何其他 Linux 文件系统一样，在 `/mnt/mydata` 目录下创建、修改和删除文件及目录。\n\
  \n要关闭加密分区使其无法访问，请使用 `luksClose` 命令选项：\n\n```\n $ sudo cryptsetup -v luksClose /dev/mapper/safedata\n\
  Command successful.\n$ ls /dev/mapper -l\ntotal 0\ncrw-------. 1 root root 10, 236\
  \ Dec 22 08:29 control\nlrwxrwxrwx. 1 root root       7 Dec 22 08:29 rl-root ->\
  \ ../dm-0\nlrwxrwxrwx. 1 root root       7 Dec 22 08:29 rl-swap -> ../dm-1\n$\n\
  ```\n\n当关闭加密分区时，Linux 会将其从 `/dev/mapper` 目录中移除，使其无法访问。要再次挂载该分区，您将需要在 `cryptsetup`\
  \ 命令中使用 `luksOpen` 选项并提供密码。\n\n处理分区和文件系统可能变得复杂且危险，因此能够在安全环境中进行练习非常有帮助。下面的练习将引导您在空\
  \ USB 优存盘上创建分区和文件系统。\n\n## 总结\n\n在 Linux 系统上持久化存储数据的能力是必须的。Linux 内核同时支持机械硬盘（HDD）和固态硬盘（SSD）持久化存储数据技术。它还支持三种主要的驱动连接类型——PATA、SATA\
  \ 和 SCSI。对于连接到系统的每个存储设备，Linux 会在 `/dev` 文件夹中创建一个原始设备文件。PATA 驱动器的原始设备为 `hdx`，SATA\
  \ 和 SCSI 驱动器为 `sdx`，其中 `x` 是分配给驱动器的字母。\n\n一旦将驱动连接到 Linux 系统，您需要在驱动上创建分区。对于 MBR 磁盘，可以使用\
  \ `fdisk` 或 `parted` 命令行工具或 `gparted` 图形化工具。对于 GPT 磁盘，可以使用 `gdisk` 或 `gparted` 工具。在对驱动进行分区时，必须为其分配大小和文件系统类型。\n\
  \n对存储设备分区后，您必须使用 Linux 识别的文件系统对其进行格式化。`mkfs` 程序是一个前端实用程序，可以使用 Linux 支持的大多数文件系统格式化驱动器。ext4\
  \ 文件系统是目前流行的 Linux 文件系统。它支持日志记录并提供良好的性能。Linux 还支持更高级的文件系统，例如 btrfs、xfs、zfs，当然还有\
  \ Windows 的 VFAT 和 NTFS 文件系统。\n\n在分区上创建文件系统后，您需要挂载它。`mount` 命令允许您访问文件系统。`umount`\
  \ 命令用于卸载它。`df` 和 `du` 工具用于检查磁盘占用。`fsck` 实用程序用于修复文件系统。\n\n\n\n\n\n5. 哪种分区工具提供了图形界面？\n\
  \n1. `gdisk`\n2. `gparted`\n3. `fdisk`\n4. `parted`\n5. `fsck`\n\n6. Linux 使用 ___________\
  \ 将新存储设备上的文件系统添加到虚拟目录，以便用户访问。\n\n1. 挂载点 (Mount points)\n2. 驱动器器 (Drive letters)\n\
  3. `/dev` 文件\n4. `/proc` 文件夹\n5. `/sys` 文件夹\n\n7. 第一个 Linux 文件系统的最新版本是什么文件？\n\n\
  1. reiserFS\n2. btrfs\n3. ext3\n4. ext4\n5. nfs\n\n8. 你使用什么工具在分区上创建新的文件系统？\n\n1.\
  \ `fdisk`\n2. `mkfs`\n3. `fsck`\n4. `gdisk`\n5. `parted`\n\n9. 你使用什么工具手动将文件系统添加到虚拟目录？\n\
  \n1. `fsck`\n2. `mount`\n3. `umount`\n4. `fdisk`\n5. `mkfs`\n\n10. ___________ 程序是用于修复损坏文件系统的实用工具。\n\
  \n1. `fsck`\n2. `mount`\n3. `umount`\n4. `fdisk`\n5. `mkfs`\n\n# 第 12 章：保护文件\n\n\
  ![](img/chaptersquare.png)\n\n保护数据包括创建和管理备份。备份通常称为归档（archive），是数据的副本，如果数据被破坏或损坏，可以在未来的某个时候进行恢复。\n\
  \n备份你的数据是一项至关重要的活动。但更重要的是规划你的备份。这些计划包括选择备份类型、确定采用的的压缩方法，以及识别哪些工具最符合你组织的数据需求。你可能还需要通过网络传输你的备份文件。在这种情况下，确保归档在传输过程中安全至关重要，在到达目的地后验证其完整性也同样重要。本章涵盖了与保护你数据文件相关的所有这些主题。\n\
  \n## 理解备份类型\n\n数据备份有不同的分类。了解这些不同的类别对于制定你的备份计划至关重要。以下是常见的几种备份类型：\n\n* 系统镜像 (System\
  \ image)\n* 全量备份 (Full)\n* 增量备份 (Incremental)\n* 差异备份 (Differential)\n* 快照 (Snapshot)\n\
  * 快照克隆 (Snapshot clone)\n\n让我们探索每种备份类型及其优缺点：\n\n* **系统镜像 (System Image)**：系统镜像是操作系统二进制文件、配置文件以及你启动\
  \ Linux 系统所需的任何其他内容的副本。其目的是快速将你的系统恢复到可启动状态。这些备份有时被称为克隆（clone），它们通常不用于恢复单个文件或目录，在某些备份工具中，你甚至无法这样做。\n\
  \n* **全量备份 (Full)**：全量备份是所有数据的副本，忽略其修改日期。这种备份类型的主要优势是恢复系统数据的时间比其他类型要少得多。然而，与其他类型相比，创建全量备份所需的时间更多，而且需要更多的存储空间。在完全恢复系统时，不需要其他备份类型。\n\
  \n* **增量备份 (Incremental)**：增量备份仅对自上次备份操作（任何类型的备份操作）以来修改的数据进行复制。通常，会将文件的修改时间戳与上一次备份类型的时间戳进行比较。创建这种备份类型的时间比其他类型短得多，所需的空间也少得多。然而，这种备份类型的数据恢复时间可能非常长。想象一下你在周一执行了全量备份，从周二到周五执行了增量备份。周六磁盘崩溃必须更换。更换磁盘后，你必须使用周一的备份恢复数据，然后继续使用周二到周五创建的增量备份来恢复数据。这非常耗时，将导致系统恢复运行出现严重延迟。因此，为了优化考虑，需要定期完成全量备份。\n\
  \n* **差异备份 (Differential)**：差异备份是对自上次全量备份以来所有更改的数据进行复制。它可以被认为是全量备份和增量备份之间的良好平衡。这种备份类型花费的时间比全量备份少，但可能比增量备份多。所需的存储空间比全量备份少，但比普通的增量备份多。此外，使用差异备份恢复的时间比增量备份短得多，因为只需要全量备份和最新的差异备份。为了优化考虑，需要定期完成全量备份。\n\
  \n* **快照 (Snapshot)**：快照备份被认为一种混合方法，是一种略有不同的备份形式。首先在备份介质上创建数据的完整（通常是只读的）副本。然后，使用指针（如硬链接）创建一个引用表，将备份数据与原始数据连接起来。下次进行备份时，发生的不是全量备份，而是增量备份（仅将修改或新文件复制到备份介质中），并复制和更新指针引用表。这节省了空间，因为每个额外的备份只需要存储修改的文件和更新的指针引用表。\n\
  \n* 通过快照备份，你可以回到任何时间点并从该点进行全系统恢复。它使用的空间比其他备份类型少得多。本质上，快照模拟了每天多次全量备份，而不需要占用相同的空间或像全量备份那样消耗处理能力。`rsync`\
  \ 工具（在本章后面描述）使用了这种方法。\n\n* **快照克隆 (Snapshot Clone)**：快照备份的另一种变体是快照克隆。一旦创建了快照（例如\
  \ LVM 快照），就会进行克隆。快照克隆在高数据 I/O 环境中非常有用。执行克隆时，你可以减少对生产数据 I/O 的任何不利影响，因为克隆备份是在快照上而不是原始数据上进行的。\n\
  \n* 虽然不是所有快照都是可写的，但快照克隆通常是可以修改的。如果你使用 LVM，可以将这些快照克隆挂载到不同的系统。因此，快照克隆在灾难恢复场景中非常有用。你特定的服务器环境以及数据保护需求将决定采用何种备份方法。你可能需要结合上述类型来正确保护你的数据。这里有几个需要考虑的提示：\n\
  \n* 始终定期测试你的备份，以确保它们确实可以恢复。\n\n* 备份数据库文件可能是复杂的，因为通常涉及多个文件，且从增量备份恢复不可行。请务必遵循数据库供应商关于备份的建议。\n\
  \n* 随着如今勒索软件的流行，保留备份文件的离线副本变得至关重要，使其免受攻击。\n\n## 查看压缩方法\n\n备份数据可能会消耗大量的额外磁盘或介质空间。根据你采用的备份类型，可以通过数据压缩工具来减少这种消耗。Linux\
  \ 上提供了以下常用工具：\n\n* `gzip`\n* `bzip2`\n* `xz`\n* `zip`\n* `7-zip`\n\n让我们探索这些数据压缩方法的优缺点：\n\
  \n\n\n\n\n- `gzip` `gzip` 工具开发于 1992 年，用于取代旧的 `compress` 程序。`gzip` 使用 Lempel-Ziv\
  \ (LZ77) 算法来实现 60–70% 的文本文件压缩率，长期以来一直是一种广受欢迎的数据压缩工具。要压缩一个文件，只需输入 `gzip` 后跟文件名即可。原始文件将被具有\
  \ `.gz` 扩展名的压缩版本取代。要执行逆向操作，只需输入 `gunzip` 后跟压缩文件的文件名即可。`gzip` 包还包含了一组用于处理 `gzip`\
  \ 压缩文件的工具，例如使用 `zcat` 和 `zless` 列出包中的文件，以及使用 `zgrep` 搜索包中的文件。\n\n- `bzip2` `bzip2`\
  \ 工具开发于 1996 年，提供了比 `gzip` 更高的率，但执行数据压缩所需的时间稍长。`bzip2` 工具采用了多层压缩技术和算法。在 2013 年之前，该数据压缩工具一直用于压缩\
  \ Linux 内核以分发。要压缩一个文件，只需输入 `bzip2` 后跟文件名即可。原始文件将被具有 `.bz2` 扩展名的压缩版本取代。要执行逆向操作，只需输入\
  \ `bunzip2` 后跟压缩文件的文件名，这将解压（膨胀）数据。\n\n- `xz` `xz` 数据压缩工具开发于 2009 年，迅速在 Linux 管理员之间流行起来。由于它通过\
  \ LZMA2 压缩算法自称具有比 `bzip2` 和 `gzip` 更高的默认压缩率。然而，通过某些 `xz` 命令选项，如果需要或乐意，你可以采用旧的 LZMA\
  \ 压缩算法。2013 年 `xz` 压缩工具取代了 `bzip2` 用于压缩 Linux 内核分发。要压缩一个文件，只需输入 `xz` 后跟文件名即可。原始文件将被具有\
  \ `.xz` 扩展名的压缩版本取代。要执行逆向操作，只需输入 `unxz` 后跟压缩文件的文件名。\n\n- `zip` `zip` 工具具有处理多个文件的能力。如果你在\
  \ Windows 操作系统上创建过 zip 文件，那么你就用过这种文件格式。多个文件被打包在一个文件中（通常称为文件夹或归档文件），然后进行压缩。另一个与其他\
  \ Linux 压缩工具的区别是，`zip` 不会替换原始文件。相反，它将文件的副本放入归档文件中。\n\n- 使用 `zip` 归档并压缩文件，请输入 `zip`\
  \ 后跟最终归档文件的文件名（传统上以 `.zip` 扩展结尾）。在归档文件名之后输入一个或多个想要放入压缩包的文件名，并用空格分隔。原始文件保持完好，但它们的副本被放在压缩后的\
  \ zip 归档文件中。要执行逆向操作，输入 `unzip` 后跟压缩归档文件名。\n\n- `7-zip` `7-zip` 工具是另一个来自 Windows\
  \ 世界的跨压缩工具。默认情况下，`7-zip` 使用 `7z` 归档格式，该格式声称比大多数其他压缩工具具有更高的压缩率（通常比 zip 高 2–10%）。然而，`7-zip`\
  \ 也支持其他标准压缩格式，包括 `bzip2`。它允许将多个文件和文件夹归档到单个存档文件中，该文件默认以 `.7z` 扩展结尾。`7-zip` 的 Linux\
  \ 命令行版本被称为 `7za`。你可能需要使用 `a` 命令行选项将指定的文件夹添加到归档中，或使用 `e` 命令行选项将其提取出来。\n\n使用它们的默认设置对各种压缩工具进行并排比较非常有帮助。在\
  \ 列表 12.1 中，展示了一个 Rocky Linux 发行版的示例。\n\n在 列表 12.1 中，首先使用超级用户权限将 `/var/log/wtmp`\
  \ 文件复制到本地目录。然后创建该文件的 5 个副本。使用 `ls -lh` 命令，你可以以人类可读的格式看到 `wtmp` 文件的大小为 `21K`。接下来，采用各种压缩工具。注意，当使用\
  \ `zip` 和 `7za` 命令时，你必须给出归档文件的名称，并后跟任何文件名。在用各种工具对文件压缩后，在 列表 12.1 中再次执行 `ls -lh`\
  \ 命令。注意各种文件扩展名以及文件的压缩后大小。你可以看到 `xz` 程序对该文件产生了最高的压缩率，因为它的文件大小是最小的。\n\n有很多压缩方法。然而，当你将压缩工具配合归档和恢复程序进行数据备份时，使用无损压缩方法是至关重要的。无损压缩正如其名：无数据丢失。这里列出的所有工具都提供无损压缩。显然，在进行备份时不丢失数据是非常重要的。\n\
  \n## 比较归档和恢复工具\n\n你可以使用几个程序来管理备份。一些流行的产品是 Amanda、Bacula、Bareos、Duplicity 和 BackupPC。然而，这些\
  \ GUI 和/或基于 Web 的程序核心通常都是命令行工具。我们这里的重点是这些命令行工具：\n\n- `cpio`\n- `dd`\n- `rsync`\n\
  - `tar`\n\n### 使用 `cpio` 复制\n\n`cpio` 工具的名称代表“输入和输出”（copy in and out）。它收集文件副本并将其存储在归档文件中。该程序有几个实用的选项。较常用的选项在\
  \ 表 12.1 中描述。\n\n| 短写 | 全称 | 描述 |\n| --- | --- | --- |\n| `-I` | N/A | 指定要使用的归档文件。\
  \ |\n| `-i` | `--extract` | 从归档中复制文件或显示归档内的文件，取决于所使用的其他选项。称为输入模式。 |\n| N/A | `--no-absolute-filenames`\
  \ | 指定仅使用相对路径名。（默认使用绝对路径。） |\n| `-o` | `--create` | 通过将文件复制到归档中创建归档。称为输出模式。 |\n\
  | `-t` | `--list` | 显示归档中的文件列表。此列表被称为目录。 |\n| `-v` | `--verbose` | 在处理每个文件时显示每个文件的名称。\
  \ |\n\n表 12.1 `cpio` 命令的常用选项\n\n要使用 `cpio` 工具创建归档，你必须生成一个文件列表，然后将它们通过管道（pipe）传递给命令。列表\
  \ 12.2 展示了执行此项任务的示例。\n\n使用 `?` 通配符和 `ls` 命令，当前工作目录下的各种文本文件首先在 列表 12.2 中显示。然后使用该命令，将其标准输出（STDOUT）作为标准输入（STDIN）传递给\
  \ `cpio` 工具。（如果你需要复习 STDOUT 和 STDIN，请参 第 4 章，“搜索和分析文本](#c004.xhtml)”）。配合 `cpio`\
  \ 命令使用的选项是 `-ov`，它创建一个包含所列文件副本的归档。它还会在文件复制到归档时显示文件的名称。使用的归档文件命名为 `Project4x.cpio`。虽然不是必须，但在\
  \ `cpio` 归档文件使用 `.cpio` 扩展被认为是良好的习惯。\n\n你可以很容易地查看 `cpio` 归档中存储的文件。只需再次使用 `cpio`\
  \ 命令，并使用 `-itv` 和 `-I` 选项指定归档文件，如 列表 12.3 所示。\n\n虽然 列表 12.3 中没有显示，但 `cpio` 工具维护了每个文件的绝对目录引用。因此，它经常用于创建系统镜像和全备份。\n\
  \n\n\n\n\n要从归档恢复文件，只需使用 `-ivI` 选项。然而，由于 `cpio` 保留了文件的绝对路径，如果你需要将文件恢复到另一个目录位置，这可能会很麻烦。为了实现这一点，你需要使用\
  \ `--no-absolute-filenames` 选项，如列表 12.4 所示。\n\n在列表 12.4 中，`Project4x.cpio` 归档文件被移动到一个预先存在的子目录\
  \ `Projects` 中。通过 `--no-absolute-filenames` 选项从归档文件中剥离绝对路径，你可以将文件恢复到新的目录位置。如果你想将文件恢复到原始位置，只需跳过该选项，并仅使用列表\
  \ 12.4 所示的其他 `cpio` 切换选项。\n\n### 使用 `tar` 进行归档\n\n`tar` 工具的名称代表“tape archiver”（磁带归档器），它因创建数据备份而广受欢迎。与\
  \ `cpio` 一样，使用 `tar` 命令时，选定的文件会被复制并存储在一个文件中。该文件被称为 *tar 归档文件*。如果使用数据压缩工具对此归档文件进行压缩，则压缩后的归档文件被称为\
  \ *tarball*（tar 包）。\n\n`tar` 程序有几个实用的选项。用于创建数据备份的常用选项在表 12.2 中描述。\n\n| 短选项 | 长选项\
  \ | 描述 |\n| --- | --- | --- |\n| `-c` | `--create` | 创建一个 tar 归档文件。备份可以是全备份或增量备份，取决于选择的其他选项。\
  \ |\n| `-u` | `--update` | 将文件追加到现有 tar 归档文件中，但仅复制自原始归档文件创建以来修改过的文件。 |\n| `-g` |\
  \ `--listed-incremental` | 根据提供的文件中存储的元数据创建增量或全归档。 |\n| `-z` | `--gzip` | 使用 `gzip`\
  \ 将 tar 归档文件压缩为 tarball。 |\n| `-j` | `--bzip2` | 使用 `bzip2` 将 tar 归档文件压缩为 tarball。\
  \ |\n| `-J` | `--xz` | 使用 `xz` 将 tar 归档文件压缩为 tarball。 |\n| `-v` | `--verbose` |\
  \ 在处理每个文件时显示每个文件的名称。 |\n\n表 12.2 `tar` 命令常用的 tarball 创建选项\n\n要使用 `tar` 工具创建归档，你需要在选项和命令后添加几个参数。列表\
  \ 12.5 了创建一个 `tar` 归档的示例。\n\n在列表 12.5 中，使用了三个选项。`-c` 选项创建 `tar` 归档。`-v` 选项在文件被放入归档文件时显示文件名。最后，`-f`\
  \ 选项指定归档文件名，即 `Project42x.tar`。虽然不是强制的，但在 `tar` 归档文件使用 `.tar` 扩展名被认为是一种规范。命令的最后一个参数指定了要复制到此归档的文件。\n\
  \n如果你正在备份大量文件或大量数据，使用压缩工具是一个好主意。这通过向你的 `tar` 命令选项添加一个额外的切换开关轻松实现。列表 12.6 显示了一个示例，它使用\
  \ `gzip` 压缩来创建一个 tarball。\n\n注意列表 12.6 中，tarball 文件名具有 `.tar.gz` 扩展名。使用 `.tar` 扩展名并附加一个显示所用压缩方法的指示被认为是一种规范。然而，如果需要，你可以将其缩短为\
  \ `.tgz`。\n\n该命令有一个实用的变体可以同时创建全备份和增量备份。简单的示例有助于解释这个概念。创建全备份的过程如列表 12.7 所示。\n\n注意列表\
  \ 12.7 中的 `-g` 选项。`-g` 选项会创建一个名为 *snapshot file*（快照文件）的文件 `FullArchive.snar`。`.snar`\
  \ 文件扩展名表示该文件是 tarball 快照文件。快照文件包含了用于全备份和增量备份的 `tar` 命令相关的元数据。快照文件包含文件时间戳，因此 `tar`\
  \ 工具可以确定文件是否自上次备份以来被修改过。快照文件还用于识别任何新文件，或确定文件自上次备份以来是否被删除。\n\n上一个示例创建了指定文件的全备份以及元数据快照文件\
  \ `FullArchive.snar`。现在将使用同一个快照文件来帮助确定是否有任何文件被修改、是新的或被删除，以创建增量备份，如列表 12.8 所示。\n\n\
  在列表 12.8 中，文件 `Project42.txt` 被修改了。再次，`tar` 命令使用 `-g` 选项并指向之前创建的 `FullArchive.snar`\
  \ 快照文件。这次，`FullArchive.snar` 中的元数据显示 `tar` 命令中 `Project42.txt` 文件自上次备份以来已被修改。因此，新的\
  \ tarball 仅包含 `Project42.txt` 文件，它实际上上是一个增量备份。你可以根据需要继续使用同一个快照文件创建额外的增量备份。\n\n每当你创建数据备份时，验证它们都是一个良好的习惯。表\
  \ 12.3 提供了用于查看和验证数据备份的 `tar` 命令选项。\n\n| 短选项 | 长选项 | 描述 |\n| --- | --- | --- |\n\
  | `-d` | `--compare--diff` | 将 tar 归档文件的成员与外部文件进行比较并列出差异。 |\n| `-t` | `--list` |\
  \ 显示 tar 归档文件的内容。 |\n| `-W` | `--verify` | 在处理文件时验证每个文件。此选项不能与压缩选项一起使用。 |\n\n表 12.3\
  \ `tar` 命令常用的归档验证选项\n\n备份验证可以采取多种不同的形式。你可能通过在 `tar` 命令上使用 `-v` 选项来确保所需的文件（有时称为 *members*）包含在你的备份中，以便观察文件在包含归档文件时的列出情况。你也可以事后验证所需文件是否包含在备份中。使用\
  \ `-t` 选项列出 tarball 或归档文件的内容。列表 12.9 显示了一个示例。\n\n你可以通过将归档中的文件与当前文件进行比较来验证文件。完成此任务的选项是\
  \ `-d`。[列表 12.10 显示了一个示例。\n\n另一个良好的习惯是在创建 `tar` 归档后立即自动验证备份。这通过添加 `-W` 选项轻松实现，如列表\
  \ 12.11 所示。\n\n如果你使用压缩来创建 tarball，则无法使用 `-W` 选项。然而，你可以先创建并验证归档，然后在单独的步骤中对其压缩。当你从\
  \ `tar` 归档提取文件时，也可以使用 `-W` 选项。这对于立即验证从归档恢复的文件非常有用。\n\n表 12.4 列出了你可以配合 `tar` 工具从\
  \ tar 归档文件或 tarball 恢复数据的选项。请注意，用于创建备份的某些选项（如 `-g` 和 `-W`）也可以用于恢复数据时。\n\n| 短选项 |\
  \ 长选项 | 描述 |\n| --- | --- | --- |\n| `-x` | `--extract--get` | 从 tarball 或归档文件中提取文件并将其置于当前工作目录\
  \ |\n| `-z` | `--gunzip` | 使用 `gunzip` 解压 tarball 中的文件 |\n| `-j` | `--bunzip2` |\
  \ 使用 `bunzip2` 解压 tarball 中的文件 |\n| `-J` | `--unxz` | 使用 `unxz` 解压 tarball 中的文件\
  \ |\n\n\n\n\n\n使用 `tar` 实用程序从归档或 tar 包中提取文件非常简单。列表 12.12 显示了从之前创建的 tar 包中提取文件的示例。\n\
  \n在列表 12.12 中，创建了一个名为 `Extract` 的新子目录。将列表 12.6 中创建的 tar 包移动到新的子目录中，然后从 tar 包中恢复文件。如果你将此列表中使用的\
  \ `tar` 命令与列表 12.6 中使用的命令相比，你会发现这里用 `-x` 选项替换了列表 12.6 中使用的 `-c` 选项。还要注意列表 12.12\
  \ 中的 tar 包在提取提取后不会被删除，因此你可以根据需要反复使用它。\n\n由于 `tar` 实用程序是磁带归档器，如果需要，你也可以将 tar 包或归档文件放在磁带上。在挂载并正确定位磁带后，只需在\
  \ `tar` 命令中将 SCSI 磁带设备文件名（例如 `/dev/st0` 或 `/dev/nst0`）替换归档文件或 tar 包文件名即可。\n\n###\
  \ 使用 `dd` 复制\n\n`dd` 程序允许你备份磁盘上的几乎所有内容，包括一些旧版本 Linux 发行版仍在使用的旧主引导记录（MBR）分区。它主要用于创建整个硬盘或分区的底层拷贝。它经常用于数字取证、创建系统映像、复制损坏磁盘以及擦除分区。\n\
  \n命令本身非常简单。`dd` 程序的基本语法结构如下：\n\n```\n dd  if=input-device of=output-device [OPERANDS]\n\
  ```\n\n`output-device` 是整个驱动器或一个分区。`input-device` 也是如此。只需确保为输出和输入选择了正确的设备；否则你可能会无意中擦除数据。\n\
  \n除了 `of` 和 `if` 之外，还有其他几个可以辅助 `dd` 操作的参数（称为 `operands`）。常用的参数描述在表 12.5 中。\n\n|\
  \ 参数 | 说明 |\n| --- | --- |\n| `bs=`BYTES` | 设置一次读取和写入的最大块大小（`BYTES` 的数量）。默认为 512\
  \ 字节。 |\n| `count=`N` | 设置要拷贝的输入块数（`N`）。 |\n| `status=`LEVEL` | 设置显示到 STDERR 的信息量（`LEVEL`）。\
  \ |\n\n表 12.5 `dd` 命令常用的参数\n\n`status=`LEVEL` 参数需要稍作解释。`LEVEL` 可以设置为以下之一：\n\n* `none`\
  \ 仅显示错误信息。\n* `noxfer` 不显示最终传输统计数据。\n* `progress` 显示周期性的传输统计数据。\n\n通过示例来理解 `dd`\
  \ 程序通常更容易。一个执行将一个整个磁盘逐位拷贝到另一个磁盘的示例示例在列表 12.13 中显示。\n\n在列表 12.13 中，首先使用了 `lsblk`\
  \ 命令。通过 `dd` 程序拷贝磁盘时，确保驱动器没有载到虚拟目录结构的任何地方是明智的。此操作涉及的两个驱动器 `/dev/sdb` 和 `/dev/sdc`\
  \ 未挂载。使用 `dd` 命令时，使用 `if` 参数指定我想要拷贝的磁盘，即 `/dev/sdb` 驱动器。`of` 参数指定 `/dev/sdc` 磁盘将持有拷贝的数据。此外，`status=progress`\
  \ 将显示周期传输统计数据。你可以从列表 12.13 的传输统计数据中看到 `/dev/sdb` 上的数据不多，因此 `dd` 操作很快就完成了。\n\n你也可以使用与列表\
  \ 12.13 所示类似的 `dd` 命令并进行一些必要的修改来创建系统映像备份。基本步骤如下：\n\n1. 关闭你的 Linux 系统。\n2. 连接必要的备用驱动器。对于每个系统驱动器，你需要一个相同大小或更大的驱动器。\n\
  3. 使用现场 CD、DVD 或 USB 启动系统，以便保持系统驱动器未挂载状态，或在备份操作之前将它们卸载。\n4. 对于每个系统驱动器，执行 `dd` 命令，使用\
  \ `if` 参数指定要备份的驱动器，使用 `of` 参数指定备用驱动器。\n5. 关闭系统并移除包含系统映像的备用驱动器。\n6. 重启你的 Linux 系统。\n\
  \n如果你有一个要弃的磁盘，可以使用 `dd` 命令将磁盘置零。示例在列表 12.14 中所示。\n\n`if=/dev/zero` 使用零设备文件向磁盘写入零。你需要至少执行此操作\
  \ 10 次或更多才能彻底擦除磁盘。你也可以使用 `/dev/random` 和/或 `/dev/urandom` 设备文件向磁盘写入随机数据。对于大磁盘，这项特定任务运行可能需要很长时间。对于你公司将不再使用的任何磁盘，最好还是进行粉碎处理。\n\
  \n### 使用 `rsync` 复制\n\n最初在第 3 章“管理文件、目录和文本”中过的 `rsync` 程序以速度著称。通过此程序，你可以本地或远程拷贝文件，它非常适合创建备份。\n\
  \n在探索 `rsync` 程序之前，回顾几个常用选项是件好主意。第 3 章中的表 3.4 包含了常用的 `rsync` 选项。除了表 3.4 中列出的选项外，还有几个额外的开关可以帮助通过\
  \ `rsync` 程序进行安全数据传输：\n\n* `-e` 或 `--rsh` 选项更改用于本地和远程连接之间通信的程序。默认是 OpenSSH。\n* `-z`\
  \ 或 `--compress` 选项在传输期间压缩文件数据。\n\n在第 3 章中我简要提到了归档选项 `-a`（或 `--archive`），它指导 `rsync`\
  \ 执行备份拷贝。然而，它需要更多的解释。该选项等同于使用 `-rlptgoD` 选项并执行以下操作：\n\n* 指导 `rsync` 从目录内容拷贝文件，并对于原始目录树内的任何子目录，连续拷贝它们的内容（递归地）。\n\
  * 保留以下项目：\n    * 设备文件（仅当以超级用户权限运行时有效）\n    * 文件组\n    * 文件修改时间\n    * 文件所有权（仅当以超级用户权限运行时有效）\n\
  \    * 文件权限\n    * 特殊文件\n    * 符号链接\n\n在本地进行 `rsync` 备份非常简单。最流行的选项 `-ahv` 允许你快速将文件备份到本地位置，如列表\
  \ 12.15 所示。\n\n`rsync` 程序真正大放异彩的地方是在网络备份文件时保护文件。\n\n为了使安全的远程拷贝生效，你需要在远程系统上启动并运行\
  \ OpenSSH 服务。此外，本地和远程机器上必须安装 `rsync` 程序。使用 `rsync` 命令在网络上安全拷贝文件的示例在列表 12.16 中所示。\n\
  \n\n\n\n\n注意列表 12.16 中，`rsync` 工具使用了 `-avP` 选项。这些选项不仅将复制模式设置为归档（archive），还会在文件传输过程中提供详细信息。在此列表中，需要注意的重要开关是\
  \ `-e` 选项。该选项决定使用 `OpenSSH` 进行传输，并实际上创建了一个加密隧道，使得任何嗅探网络的人都无法看到流经的数据。命令中的 `*.tar`\
  \ 仅用于选择要复制到远程机器的本地文件。`rsync` 命令的最后一个参数指定了以下内容：\n\n*   用于传输的位于远程系统的用户账户（`user1`）。\n\
  *   远程系统的 IPv4 地址，也可以使用主机名代替。\n*   文件存放的位置。在这种情况下，它是由 `~` 符号表示的家目录。\n\n同样注意在最后一个参数中，IPv4\
  \ 地址和目录符号之间有一个必需的冒号（:`）。如果你不包含这个冒号，你会将文件复制到本地目录中一个名为 `user1@192.168.0.104~` 的新文件中。\n\
  \n`rsync` 工具对于将大文件复制到远程介质非常有用。如果你有一个快速的 CPU 但网络连接缓慢，可以通过采用 `rsync -z` 选项对数据进行压缩来进一步提高速度。这并不是使用\
  \ `gzip` 压缩，而是通过 `zlib` 压缩库应用压缩。你可以在 https://zlib.net 找到更多关于 `zlib` 的信息。\n\n## 保护异地/异系统备份\n\
  \n在业务中，数据就是金。因此，不仅要创建数据存档，还要保护它们。在将备份传输到远程位置时，还有几种额外的方法可以确保备份的安全。\n\n除了 `rsync`，你可以使用基于安全复制协议\
  \ (SCP) 的 `scp` 工具。此外，基于 SSH 文件传输协议 (SFTP) 的 `sftp` 程序也是安全传输存档的一种。我将在接下来的章节中介绍这两个工具。\n\
  \n### 通过 `scp` 安全复制\n\n`scp` 工具旨在用于网络上两个系统之间以非交互模式方式快速传输文件。该程序采用了 `OpenSSH`。\n\n\
  它最适合需要临时安全复制的小文件，因为如果在使用运行过程中被中断，它无法从中断的地方继续。对于较大的文件或大量数量的文件，最好使用 `rsync` 或 `sftp`\
  \ 工具。\n\n有一些非常有用的 `scp` 选项。其中一些常用的开关列在表 12.6 中。\n\n| 短写 | 说明 |\n| --- | --- |\n\
  | `-C` | 在传输期间压缩文件数据 |\n| `-p` | 保留文件的访问时间、修改时间以及文件权限 |\n| `-r` | 复制目录内容的文件，并对于原始目录树中的任何子目录，连续地复制其内容（递归）\
  \ |\n| `-v` | 显示有关命令执行的详细信息 |\n\n表 12.6 `scp` 命令常用的复制选项\n\n从本地系统到远程系统执行文件的安全复制相当相当简单的。你确实需要在远程系统上启动并运行\
  \ `OpenSSH` 服务。示例见列表 12.17。\n\n注意，为了完成这项任务，没有使用任何 `scp` 命令选项。`-v` 选项提供了许多在这种情况下不需要的信息。\n\
  \n使用 `scp` 的一种方便方法是从一个远程机器复制文件到另一个远程机器。示例见列表 12.18。\n\n首先在列表 12.18 中，使用 `ip addr\
  \ show` 命令检查当前机器的 IPv4 地址。接下来使用 `scp` 工具将 `Project42.txt` 文件从一个远程机器复制到另一个。当然，你必须在这些机器上运行了\
  \ `OpenSSH`，并有一个你可以登录的用户账户。\n\n### 通过 `sftp` 安全传输\n\n`sftp` 工具也允许你跨网络安全地传输文件。然而，它是为了更具交互性的体验而设计的。通过\
  \ `sftp`，你可以根据需要创建目录、立即检查传输的文件、确定远程系统的当前工作目录等。此外，该程序也采用了 `OpenSSH`。\n\n为了感受这种交互式工具是如何运作的，看一个简单的示例是好的。示例见列表\
  \ 12.19。\n\n在列表 12.19 中，使用用户名和远程主机的 IPv4 地址使用 `sftp` 工具。一旦输入正确的用户账户密码，就会显示 `sftp`\
  \ 工具的提示符。此时，你已连接到远程系统。在提示符处，你可以输入任何命令，包括 `help` 显示所有可能的命令，以及如列表所示的 `bye` 退出工具。一旦退出工具，你就不再连接到远程系统了。\n\
  \n在使用 `sftp` 交互式工具之前，了解一些常用命令会有帮助。其中一些列在表 12.7 中。\n\n| 命令 | same |\n| --- | ---\
  \ |\n| `bye` | 退出远程系统并退出工具。 |\n| `exit` | 退出远程系统并退出工具。 |\n| `get` | 从远程系统获取文件（或多个文件）并将它（它们）存储在本地系统。称为*下载*。\
  \ |\n| `reget` | 恢复中断的 `get` 操作。 |\n| `put` | 从本地系统发送文件（或多个文件）并将它（它们）存储在远程系统。称为*上传*。\
  \ |\n| `reput` | 恢复中断的 `put` 操作。 |\n| `ls` | 显示远程系统当前工作目录中的文件。 |\n| `lls` | 显示本地系统当前工作目录中的文件。\
  \ |\n| `mkdir` | 在远程系统上创建目录。 |\n| `lmkdir` | 在本地系统上创建目录。 |\n| `progress` | 开启/关闭进度显示。（默认开启。）\
  \ |\n\n表 12.7 `sftp` 命令常用的命令\n\n如果你以前从未用过 FTP 交互式程序，那么第一次使用 `sftp` 工具时可能会有点棘手。将本地文件发送到远程系统的示例见列表\
  \ 12.20。\n\n在列表 12.20 中，在建立与远程系统的连接后，在 `sftp` 工具中使用 `ls` 命令查看远程用户目录中的文件。使用 `lls`\
  \ 命令查看本地用户目录中的文件。接下来使用 `put` 命令将 `Project4x.tar` 存档文件发送到远程系统。不需要发布 `progress` 命令，因为默认已经开启了进度报告。一旦上传完成，将使用另一个\
  \ `ls` 命令查看文件现在是否在远程系统上，它确实在。。\n\n`rsync`、`scp` 和 `sftp` 工具都提供了安全复制文件的方法。然而，在确定为你的各种存档和检索计划采用哪些工具时，请记住，一种工具无法在每个备份情况下都有效工作。例如，通俗来说，在备份中\
  \ `rsync` 比 `scp` 更好用，因为它提供了更多选项。但是，如果你只有几个需要安全复制的文件，`scp` 效果很好。`sftp` 工具对于任何交互式复制都很有效，但\
  \ `scp` 更快，因为 `sftp` 设计为确认跨网络发送的每一个数据包。你很可能需要在公司的备份计划中以某种方式使用所有这些不同的工具。\n\n## 检查备份完整性\n\
  \n\n\n\n\n安全地传输你的归文件是不够的。你还需要考虑归文件在传输过程中可能会损坏的可能性。\n\n确保备份文件的完整性相当容易。一些简单的工具可以提供帮助。\n\
  \n### 使用 MD5 算法摘要\n\n`md5sum` 工具基于 MD5 消息摘要算法。它最初被创建用于密码学领域。由于各种已知的漏洞，它已不再用于此类领域。然而，它对于检查文件的完整性仍然非常优异。\n\
  \n列表 12.21 和 列表 12.22 显示了一个简单的示例。使用本节较早通过 `sftp` 上传的文件，对原始文件和上传后的文件均运行 `md5sum`。\n\
  \n`md5sum` 会生成一个 128 位的哈希值。从两个列表的结果中你可以看到，哈希值是匹配的。这表明文件在传输过程中没有发生损坏。\n\n### 使用安全哈希算法\n\
  \n安全哈希算法（SHA）是一系列各种哈希函数。虽然它们通常用于加密目的，但也可以用于验证归档文件的完整性。\n\nLinux 上有几个工具实现了这些不同的算法。找到它们最快的方法是通过\
  \ 列表 12.23 所示的方法。请记住，你特定的发行版可能会将它们存储在 `/bin` 目录中。\n\n每个工具的名称中包含了其所使用的 SHA 消息摘要。因此，`sha384sum`\
  \ 使用 SHA-384 算法。这些工具的使用方式与 `md5sum` 命令类似。列表 12.24 显示了几个示例。\n\n注意 列表 12.24 中不同命令产生的不同哈希值长度。`sha512sum`\
  \ 工具使用 SHA-512 算法，这是用于安全目的最佳选择，并且通常用于对 Linux 上 `/etc/shadow` 文件中的加盐密码进行哈希处理。\n\n\
  你可以使用这些 SHA 工具（就像在 列表 12.21 和 12.22 中使用 `md5sum` 程序一样）来确保归档文件的完整性。这样就可以避免备份损坏以及任何对文件的恶意修改。\n\
  \n## 总结\n\n提供适当的文件归档和检索至关重要。理解你的业务和数据需求是备份规划的一部分。在制定计划时，请考虑完整性问题、归档空间可用性、隐私需求等。一旦建立了严谨的计划，你就可以放心数据得到了保护。\n\
  \n## 考试要点\n\n**描述不同的备份类型。** 系统镜像备份是对操作系统运行所需文件的完整复制。这允许进行恢复，从而使系统恢复运行。全量备份、增量备份和差异备份在数据备份和恢复方面是紧密相关的。快照和快照克隆也密切相关，并提供了在高\
  \ I/O 环境下实现严格备份的机会。\n\n**总结压缩方法。** 不同的工具 `gzip`、`bzip2`、`xz` 和 `zip` 提供了不同级别的无损数据压缩。每个工具的压缩级别与其运行速度挂钩。减小归档数据文件的大小不仅是为了备份存储，也是为了提高跨网络的传输速度。\n\
  \n**比较各种归档/恢复工具。** 各种命令行工具在创建数据备份和恢复文件方面各有胜秋。虽然 `cpio` 是最老的工具之一，但它允许收集系统的各种文件并放入归档文件中。`tar`\
  \ 工具长期以来与带带一起使用，但提供了严谨且灵活的归档和恢复功能，使其在当今环境中仍然有用。`dd` 工具在创建整个磁盘的系统镜像方面表现出色。最后，`rsync`\
  \ 不仅非常快，而且允许跨网络进行加密数据传输以进行远程备份存储。\n\n**解释在其他系统上存储备份的需求。** 要将归档文件通过网络移动到另一个系统，提供数据安全是重要的。因此，通常采用\
  \ OpenSSH。此外，一旦归档文件到达最终目的地，确保传输过程中没有发生数据损坏至关重要。因此，使用了如 `md5sum` 和 `sha512sum` 等工具。\n\
  \n## 复习题\n\n你可以在 附录 A 中找到习题的答案。\n\n1. 生成归档的时间和空间不是问题，且你的系统环境不是高 I/O 环境。你希望每周为系统创建一次全量备份，并需要尽快恢复数据。你应该使用哪种备份类型计划？\n\
  \n    1. 每日全量归档\n    2. 每日增量归档\n    3. 每日差异归档\n    4. 每周全量备份；每日增量\n    5. 每周全量备份；每日差异\n\
  \n2. 系统管理员取了一个归档文件并对其使用了压缩工具。生成的文件扩展名为 `.gz`。使用的是哪种压缩工具？\n\n    1. `xz` 工具\n   \
  \ 2. `gzip` 工具\n    3. `bzip2` 工具\n    4. `zip` 工具\n    5. `dd` 工具\n\n3. 你需要快速创建一个特殊归档。该归档将单一压缩文件，包含虚拟目录结构中的任何\
  \ `.snar` 文件。你应该使用哪种归档工具？\n\n    1. `tar` 工具\n    2. `dd` 工具\n    3. `rsync` 工具\n\
  \    4. `cpio` 工具\n    5. `zip` 工具\n\n4. 管理员需要使用 `tar` 工具创建一个全量备份，尽可能进行压缩，并在文件复制到归档时查看它们。管理员应该采用哪些\
  \ `tar` 选项？\n\n    1. `-xzvf`\n    2. `-xJvf`\n    3. `-czvf`\n    4. `-cJf`\n \
  \   5. `-cJvf`\n\n5. 你需要对 `/dev/sdc` 驱动器上的所有数据创建底层备份，并想使用 `/dev/sde` 驱动器存储。你应该使用哪条\
  \ `dd` 命令？\n\n    1. `dd of=/dev/sde if=/dev/sdc`\n    2. `dd if=/dev/sdc of=/dev/sde`\n\
  \    3. `dd of=/dev/sde if=/dev/sdc count=5`\n    4. `dd if=/dev/sdc of=/dev/sde\
  \ count=5`\n    5. `dd if=/dev/zero of=/dev/sdc`\n\n6. 你需要创建一个用户目录树的备份。你希望保留文件元数据。使用超级用户权限，在使用\
  \ `rsync` 工具时应使用以下哪项？\n\n    1. `-r` 选项\n    2. `-z` 选项\n    3. `-a` 选项\n    4.\
  \ `-e` 选项\n    5. `--rsh` 选项\n\n7. 你决定使用 `rsync` 工具压缩你正在创建的归档并使用 `-z` 选项。在使用哪种压缩方法？\n\
  \n    1. `compress`\n    2. `gzip`\n    3. `bzip2`\n    4. `xz`\n    5. `zlib`\n\
  \n8. 关于 `scp` 工具，以下哪述正确？（选择所有适用项）\n\n    1. 适用于在网络两个系统之间快速传输文件\n    2. 比 `sftp`\
  \ 工具快\n    3. 一个用于快速传输大文件的交互式工具\n    4. 在传输过程中被中断没有不利影响\n    5. 使用 OpenSSH 进行文件传输\n\
  \n9. 你正在使用 `sftp` 工具向远程系统传输本地备份文件，过程中被中断。你接下来应该使用哪个 `sftp` 工具命令？\n\n    1. `progress`\
  \ 命令\n    2. `get` 命令\n    3. `reget` 命令\n    4. `put` 命令\n    5. `reput` 命令\n\n\
  10. 你完成了一个全量归档并使用 `sftp` 工具发送到远程系统。你在本地归档和远程副本上都运行 `md5sum` 程序。数字不匹配。最可能的原因是什么？\n\
  \n    1. 本地归档在创建时已损坏了。\n\n\n\n\n\n2. 归档在传输过程中损坏了。\n3. 你在 `sftp` 工具中使用了错误的命令。\n4.\
  \ 只有在发生损坏时，这些数字才会匹配。\n5. 你在 `md5sum` 上使用了错误的工具开关。\n\n# 第 13 章：管理软件\n\n![](img/chaptersquare.png)\n\
  \nLinux 系统的优劣取决于你安装在上面的软件。Linux 内核本身是非常无趣的；你需要 Web 服务器、数据库服务器、浏览器和文字处理工具等应用程序才能让你的\
  \ Linux 系统发挥任何实际作用。本章将介绍软件在 Linux 系统中的作用，以及你如何获取和管理它。首先，我将讨论在开源时代软件是如何产生的，以及你如何检索和编译软件代码。接下来，我将探索\
  \ Linux 如何通过捆预构建的软件包来让我们的工作变得更容易，使应用程序的安装和卸载变得极其简单。\n\n## 使用源码\n\n开源世界中的“源”部分是指创建应用程序所需的实际编程代码的可用性。虽然许多商业应用程序对其源代码避而不见，但开源项目将其程序代码公开，供任何人查阅并在需要时进行修改。Linux\
  \ 环境中的大多数应用程序都以开源项目的形式分发，因此你可以自由下载、修改、编译并在你的 Linux 系统上运行这些应用程序。\n\n虽然这听起来很复杂，但实际上并非如此。本节将引导你完成在\
  \ Linux 系统上下载、提取、编译和运行开源应用程序代码的过程。\n\n### 下载源码\n\n一旦开发者准备好向世界发布他们的开源应用程序，他们就会将它们发布在互联网上。大多数开源软件包的开发者使用一个网站来托管他们的代码和文档，许多甚至提供用户论坛，允许客户讨论问题和可能的改进。\n\
  \n虽然你可以使用图形化浏览器连接到网站并下载源码，但这并不总是可行的，特别是在 Linux 服务器环境中。Linux 提供了几个命令行工具，帮助我们直接从命令行下载源码文件。\n\
  \n`wget` 应用是来自 GNU 项目的命令行工具，它允许你通过 FTP、FTPS、HTTP 或 HTTPS 从远程服务器检索文件。你使用标准 URL 格式指定协议、服务器名称和要下载的文件，其中\
  \ `remotehost` 是托管文件位置的完整主机名，`filename` 是你想要检索的源码文件名，包括所需的文件夹路径：\n\n```\n wget http://remotehost/filename\n\
  ```\n\n另一个解决方案是 `cURL` 应用程序。它的功能与 `wget` 相同但支持更多协议，例如 DAP、DICT、FILE、Gopher、IMAP、LDAP、POP3、RTSP、SCP、SFTP、SMTP\
  \ 和 TFTP。它同样使用标准 URL 格式来指定协议、服务器名称和要下载的文件。\n\n`cURL` 的一个很棒的功能是它可以与安全的 HTTPS 协议配合。如果远程网站使用自签名证书或证书由不可信任的证书颁发机构\
  \ (CA) 签名，它会警告你。\n\n### 捆绑源码包\n\n分发应用程序的源码可能有些。源码项目通常包含许多不同的文件：\n\n* 源码文件\n* 头文件\n\
  * 库文件\n* 文档文件\n\n尝试为一个项目分发大量文件可能是一个挑战。Linux 为此提供了一个相当奇特的解决方案。\n\n`tar` 程序最初是为了将文件和文件夹归档到磁带驱动器进行备份（tar\
  \ 的名字最初代表 tape archiver，磁带归档器）。如今，它对于捆绑项目文件并在互联网上分发也同样方便。\n\n`tar` 命令允许你指定多个文件，甚至是多个文件文件夹，将它们捆绑成单个输出文件。然后你可以将整个项目包作为一个单独文件传输，并在远程系统上提取文件和文件夹。它的功能非常强大，以至于有一个长长的命令行选项列表，这看起来可能有些令人敬畏。\n\
  \n对于大多数捆绑操作，`tar` 命令通常使用三个基本选项组：\n\n* `-cvf`: 创建新的 tar 文件\n* `-tvf`: 显示 tar 文件的内容\n\
  * `-xvf`: 提取 tar 文件的内容\n\n要创建一个新的 tar 归档文件，指定输出文件名，然后列出要捆绑的文件和文件夹，如列表 13.1 中的示例所示。\n\
  \n在 列表 13.1 中，`test.tar` 是要创建的归档文件的名称。对于输入文件和文件夹，你可以使用通配符来指定名称，甚至可以将文件列表重定向到 `tar`\
  \ 命令，使其在脚本中非常灵活。使用 `tar` 捆绑文件夹的优势之一是它保留了你环境的文件夹结构，包括文件和文件夹的所有权，使得提取文件和重建原始环境变得更容易。\n\
  \n如果你需要查看 tar 归档文件中的内容，请使用 `-tvf` 选项组：\n\n```\n $ tar -tvf test.tar\n-rw-r--r--\
  \  rich/rich      795  2024-12-05  08:19  test1.txt\n-rw-r--r--  rich/rich     \
  \ 1020  2024-12-05  08:19  test2.txt\n-rw-r--r--  rich/rich      2280  2024-12-05\
  \  08:20  test3.txt\n$\n```\n\n注意，文件所有权和文件权限都保留在 tar 归档文件中。当你将文件提取到另一个系统时，它们将被分配给与原始文件用户数字匹配的用户\
  \ ID。\n\n从 tar 文件中提取文件和文件夹只需使用 `-xvf` 选项组：\n\n```\n $ tar -xvf test.tar\ntest1.txt\n\
  test2.txt\ntest3.txt\n$ ls -al\ntotal 32\ndrwxr-xr-x  2  rich  rich  4096  Dec \
  \ 5  08:38  .\ndrwxr-xr-x 20  rich  rich  4096  Dec  5  08:38  ..\n-rw-r--r--  1\
  \  rich  rich  795  Dec  5  08:19  test1.txt\n-rw-r--r--  1  rich  rich  1020  Dec\
  \  5  08:19  test2.txt\n-rw-r--r--  1  rich  rich  2280  Dec  5  08:20  test3.txt\n\
  -rw-r--r--  1  rich  rich 10240  Dec  5  08:38  test.tar\n```\n\n虽然 tar 归档方法让分发文件的打包变得简单，但它往往会创建一个巨大的文件，处理起来可能不方便。Linux\
  \ 开发者通常使用某种文件压缩工具来压缩最终 tar 归档文件。\n\n在 Linux 中，有很多方法可以创建压缩文件。表 13.1 列出了你会遇到的最流行的方法。\n\
  \n| 方法 | 文件扩展名 | 描述 |\n| --- | --- | --- |\n| bzip2 | `.bz2` | gzip 方法的改进，可缩小文件大小\
  \ |\n| compress | `.Z` | 原始的 Unix compress 工具 |\n| gzip | `.gz` | 快速压缩方法，产生中大小的文件\
  \ |\n| xz | `.xz` | 创建更小的压缩文件，但速度可能很慢 |\n| 7-zip | `.7z` | 使用高级压缩算法产生更小的归档文件 |\n\
  \n表 13.1 Linux 压缩方法\n\nLinux 中常用的常用的 tar 归档文件的工具是 GNU `gzip` 软件包。要压缩单个文件，使用 `gzip`\
  \ 工具配合文件名，如列表 13.2 所示。\n\n如 列表 13.2 所示，`gzip` 程序会在被压缩的文件末尾添加 `.gz` 文件扩展名。\n\n要解压缩压缩\
  \ tar 包并提取原始文件，你有几种选择。一种方案是使用两步法。首先直接对压缩的 tar 文件使用 `gunzip` 命令：\n\n```\n $ gunzip\
  \ test.tar.gz\n```\n\n这将恢复原始的 `test.tar` 文件。然后使用 `tar` 命令的标准 `-xvf` 选项提取 tar 文件。\n\
  \n\n\n\n第二种选项仅通过向 `tar` 命令行添加 `-z` 选项，一步到位完成解压并提取 tar 包文件：\n\n```\n$ tar -zxvf test.tgz\n\
  test1.txt\ntest2.txt\ntest3.txt\n$ ls -al\ntotal 24\ndrwxr-xr-x 2 rich rich 4096\
  \ Dec 5 09:03 .\ndrwxr-xr-x 3 rich rich 4096 Dec 5 09:02 ..\n-rw-r--r-- 1 rich rich\
  \ 795 Dec 5 08:19 test1.txt\n-rw-r--r-- 1 rich rich 1020 Dec 5 08:19 test2.txt\n\
  -rw-r--r-- 1 rich rich 2280 Dec 5 08:20 test3.txt\n-rw-r--r-- 1 rich rich 204 Dec\
  \ 5 09:02 test.tgz\n$\n```\n\n## 编译源代码\n\n一旦你将源代码包文件下载到 Linux 系统中，你就需要编译它们来创建一个可执行文件，以便运行应用程序。Linux\
  \ 支持多种编程语言，因此你只需要知道该应用程序是用什么编程语言编写的。一旦知道了这一点，你就需要为程序代码安装一个 `compiler`（编译器）。编译器会将源代码转换为\
  \ Linux 系统可以运行的可执行文件。\n\nLinux 中用于编译程序的最常用的工具是 `GNU Compiler Collection (gcc)`。虽然它最初是为了支持\
  \ C 编程语言而创建的，但 `gcc` 现在支持许多不同的编程语言，例如 Ada、C++、Fortran、Go、Java、Objective-C、Objective-C++\
  \ 和 OpenMP。\n\n要编译简单的单文件程序，只需对源代码文件运行 `gcc` 命令行命令，即可生成在你的系统上运行的可执行文件。`-o` 命令行选项允许你指定编译输出文件的名称；否则，它将默认为丑陋的\
  \ `a.out` 文件名：\n\n```\n$ cat hello.c\n#include <stdio.h>\nint main() {\n  printf(\"\
  Hello, this is my first C program!\\n\");\n  return 0;\n}\n$ gcc -o hello hello.c\n\
  $ ./hello\nHello, this is my first C program!\n$\n```\n\n如前所述，大多数较大的应用程序除了源代码文件外，还需要头文件和库文件来构建最终的应用程序文件。根据应用程序所需的源代码、头文件和库文件的数量，`gcc`\
  \ 命令过程可能会变得非常长且复杂。单独的库文件需要在编译主程序文件之前按照正确的顺序进行编译，这为生成应用程序创建了一条难以遵循的路线图。\n\n有一个简单的解决方案可以帮助你跟踪所有这些内容。`make`\
  \ 工具允许开发者创建脚本，以引导应用程序源代码包的编译和安装过程，使得是初学者也可以从源代码编译并安装应用程序。\n\n通常，安装使用 `make` 脚本的应用程序涉及三个步骤：\n\
  \n1. 运行 `configure` 工具，它会分析你的 Linux 系统并定制 `make` 脚本，以为你的环境构建该应用程序。\n2. 单独运行 `make`\
  \ 工具，为应用程序构建必要的库文件和可执行文件。\n3. 以 root 用户身份运行 `make install`，将应用程序文件安装到系统中的相应位置。\n\
  \nC 语言程序之所以如此复杂，是因为它们通常将应用程序功能拆分为单独的库文件。每个库文件包含应用程序代码中使用的一个或多个专门函数。\n\n将函数拆分为单独库文件的用处是，使用相同函数的多个应用程序可以共享相同的库文件。这些文件被称为\
  \ `shared libraries`（共享库），使得分发应用程序变得更容易，但跟踪哪些应用程序安装了哪些库文件却变得更加复杂。\n\n虽然编译应用程序源代码并非必需，但如果你需要跟踪应用程序缺失的库文件，`ldd`\
  \ 工具就会大有用场。它显示了指定应用程序文件所需的库文件列表：\n\n```\n$ ldd hello\n      linux-vdso.so.1 (0x00007fff7dff4000)\n\
  \      libc.so.6 => /lib64/libc.so.6 (0x00007fe154e57000)\n      /lib64/ld-linux-x86-64.so.2\
  \ (0x00007fe15521c000)\n$\n```\n\n我的简单 `hello` 应用程序需要两个外部库文件：标准的 `linux-vdso.so.1`\
  \ 和 `libc.so.6` 文件，它们提供了让 `printf()` 函数显示输出的能力。`ldd` 工具还显示了这些文件在 Linux 系统上的所在位置。这在排除应用程序加载了错误库文件的问题时本身就非常有帮助。\n\
  \n## 应用程序打包\n\n虽然 `tar`、`gcc` 和 `make` 程序让分发、编译和安装应用程序源代码变得更容易，但对于安装新应用程序来说仍然是一个混乱的过程。对于大多数\
  \ Linux 用户来说，他们想要的只是下载一个应用程序并使用它。\n\n为了帮助解决这个问题，Linux 发行版创建了一个捆绑已编译应用程序以便发布的系统。这种包被称为\
  \ `package`（软件包），它由运行单个应用程序所需的所有文件组成。你可以将整个应用程序作为一个软件包进行安装、删除和管理，而不是作为一组散乱的文件。\n\
  \n在 Linux 系统上跟踪软件包被称为 `package management`（包管理）。Linux 通过使用数据库来跟踪系统上安装的软件包来实现包管理。包管理数据库不仅跟踪安装了哪些软件包，还跟踪每个应用程序所需的精确文件和文件位置。确定系统中安装了哪些应用程序只需查询包管理数据库即可。\n\
  \n正如你所预期的，不同的 Linux 发行版创建了不同的包管理系统来处理它们的包管理数据库。然而，多年来，有两个主要的包管理系统脱颖而出并成为标准：\n\n\
  * Debian 包管理\n* Red Hat 包管理\n\n由于它们的流行，这两种是 Linux+ 考试涵盖的两种包管理方法，这也是我将在本章详细介绍的两种包管理方法。\n\
  \n每个包管理系统使用不同的方法来跟踪软件包和文件，但它们都跟踪类似的信息：\n\n*   **应用程序文件：** 包数据库跟踪每个单独的文件以及它所在的文件夹。\n\
  *   **库依赖：** 包数据库跟踪每个应用程序需要哪些库文件，并在安装软件包时如果依赖库文件不存在，会向你发出警告。\n*   **应用程序版本：** 包数据库跟踪应用程序的版本号，以便你知道何时有应用程序的更新版本。\n\
  \n本节讨论了用于使用这些包管理系统的工具。\n\n### 安装和管理软件包\n\nDebian 和 Red Hat 包管理系统拥有一套类似的工具，用于处理包管理系统中的软件包。让我们来看看这两个系统以及配合它们的工具。\n\
  \n### Debian 包工具\n\n正如你可能猜到的那样，Debian 包管理系统主要用于基于 Debian 的 Linux 系统，例如 Ubuntu。Debian\
  \ 将应用程序文件捆成单独的 `.deb` 软件包文件进行分发。处理 `.deb` 文件的核心工具是 `dpkg` 程序。\n\n`dpkg` 程序是一个命令行工具，具有在你的\
  \ Linux 系统上安装、更新和删除 `.deb` 软件包文件的选项。`dpkg` 命令的基本格式如下：\n\n```\ndpkg [options] action\
  \ package-file\n```\n\n`action` 参数定义了对文件要执行的操作。表 13.2 列出了你需要使用的更常用操作。\n\n| 操作 |\
  \ 描述 |\n| --- | --- |\n| `-C` | 搜索已安装的损坏软件包并建议修复方法 |\n| `--configure` | 重新配置已安装的软件包\
  \ |\n\n\n\n\n\n| `--get-selections` | 显示当前安装的软件包 |\n| `-i` | 安装软件包 |\n| `-I` | 显示未安装软件包文件的信息\
  \ |\n| `-l` | 列出所有匹配指定模式的已安装软件包 |\n| `-L` | 列出与软件包关联的安装文件 |\n| `-p` | 显示已安装软件包的信息\
  \ |\n| `-P` | 移除已安装的软件包，包括配置文件 |\n| `-r` | 移除已安装的软件包但保留配置文件 |\n| `-S` | 查找拥有指定文件的软件包\
  \ |\n\n#### 表 13.2](#c013.xhtml_rc013-tbl-2) `dpkg` 命令操作\n\n每个操作都有一组可选选项，你可以使用这些选项来修改操作的基本行为，例如强制覆盖已安装的软件包或忽略任何依赖错误。\n\
  \n要使用 `dpkg` 程序，你必须拥有 `.deb` 软件软件包，这可以从安装 DVD 获取，也可以从互联网下载该包。通常，你可以在应用程序的网站上找到准备好发布的\
  \ `.deb` 版本的应用程序包，或者大多数发行版都会维护一个用于下载软件包的中央位置。\n\n当你下载预编译应用程序的 `.deb` 软件包时，请确保获取的是适用于你的工作站处理器芯片的软件包。源代码文件是针对特定处理器编译的，尝试在系统上运行错误的包将无法工作。通常，处理器类型会作为包名的一部分。\n\
  \n一旦下载了 `.deb` 软件包，使用 `dpkg` 配合 `-i` 选项进行安装：\n\n```\n $ sudo dpkg -i zsh_5.9-4+b5_amd64.deb\n\
  Selecting  previously unselected package zsh.\n(Reading database ... 187664 files\
  \ and directories currently installed.)\nPreparing to unpack zsh_5.9-4+b5_amd64.deb\
  \ ...\nUnpacking zsh (5.9-4+b5) ...\ndpkg: dependency problems prevent configuration\
  \ of zsh:\n zsh depends on zsh-common (= 5.9-4); however:\n  Package zsh-common\
  \ is not installed.\n\ndpkg: error processing package zsh (--install):\n dependency\
  \ problems - leaving unconfigured\nProcessing triggers for debianutils (5.17build1)\
  \ ...\nProcessing triggers for man-db (2.12.0-4build2) ...\nErrors  were encountered\
  \ while processing:\n zsh\n$\n```\n\n从这个例子中看到，软件包管理软件会检查并确保应用程序所需的任何软件包都已安装，如果缺少任何一个包，它会产生错误消息。这为你提供了需要安装哪些其他软件包的线索。\n\
  \n如果你想查看系统上安装的所有软件包，请使用 `-l` 选项：\n\n```\n $ dpkg -l\nDesired=Unknown/Install/Remove/Purge/Hold\n\
  | Status=Not/Inst/Conf-files/Unpacked/halF-conf/Half-inst/trig-\n  aWait/Trig-pend\n\
  |/ Err?=(none)/Reinst-required  (Status,Err: uppercase=bad)\n||/ Name          \
  \  Version            Architecture Description\n+++-============================================================\n\
  ii  accountsservice    23.13.9-2ubuntu6  amd64      query and\n      manipulate\
  \ user account information\nii  acl               2.3.2-1build1     amd64 access\
  \ control\n      list -  utilities\nii  adduser           3.137ubuntu1      all\
  \  add and remove users and\n      groups\nii  adwaita-icon-theme 46.0-1       \
  \    all  default icon theme of\n      GNOME\n...\n```\n\n你也可以在命令行上提供搜索词来限制输出中返回的软件包：\n\
  \n```\n $ dpkg -l openssh*\nDesired=Unknown/Install/Remove/Purge/Hold\n| Status=Not/Inst/Conf-files/Unpacked/halF-conf/Half-inst/trig-\n\
  \  aWait/Trig-pend\n|/ Err?=(none)/Reinst-required  (Status,Err: uppercase=bad)\n\
  ||/ Name            Version            Architecture Description\n+++-=================-=================-========================\n\
  ii  openssh-client    1:9.6p1-3ubuntu13.5  amd64      secure shell\n     (SSH) client,\
  \ for secure access to remote machines\nun  openssh-server\n```\n\n### Red Hat 软件包工具\n\
  \nRed Hat 发行版以及 Rocky 和 CentOS 使用 `.rpm` 文件。`rpm` 程序也是用于安装、修改和移除的命令。与 `dpkg` 类似，你必须拥有\
  \ `.deb` 软件包，但更常用的是 `-U` 操作，如果软件包已安装，则对其进行升级。添加 `-vh` 选项是一种流行的组合，可以显示进度和正在执行的操作：\n\
  \n```\n $ sudo rpm -Uvh zsh_5.9-4+b5_amd64.deb\nVerifying...\n#################################\
  \ [100]\nPreparing...\n################################# [100]\nUpdating /installing...\n\
  \ 1:zsh_5.9-4+b5_amd64\n################################# [100]\n$\n```\n\n`rpm`\
  \ 的操作见表 13.3](#c013.xhtml_rc013-tbl-2)：\n\n| 操作 | 描述 |\n| --- | --- |\n| `-b` |\
  \ 从源码构建二进制包 |\n| `-e` | 卸载指定的软件包 |\n| `-F` | 仅在存在较早版本时升级软件包 |\n| `-i` | 安装指定的软件包\
  \ |\n| `-q` | 查询软件包是否已安装 |\n| `-U` | 安装或升级软件包 |\n| `-V` | 验证软件包是否存在 |\n\n你使用 `-q`\
  \ 操作查询软件包管理数据库以获取已安装的软件包：\n\n```\n $ rpm -q zsh\nzsh-5.9-4+b5_amd64\n$\n```\n\n\
  如果你需要移除已安装的软件包，只需使用 `-e` 操作即可：\n\n```\n $ sudo rpm -e zsh\n$ sudo rpm -q zsh\npackage\
  \ zsh is not installed\n$\n```\n\n### 理解仓库\n\n`dpkg` 和 `rpm` 命令是非常实用的工具，但它们都有自己的局限性。如果你在寻找要安装的新软件包，需要你自己去寻找。此外，如果一个软件包依赖其他软件包的安装，则需要你先按照正确的顺序安装这些软件包。跟进这些关系可能会变得非常麻烦。\n\
  \n为了解决这个问题，每个 Linux 发行版都有自己的软件包中央库，被称为*仓库*（repository）。仓库包含了在发行版环境中经过测试并已知可以正常运行的软件包。通过将所有已知软件包放入单个仓库中，Linux\
  \ 发行版可以为安装所有应用程序创建一个一站式的购物环境。\n\n大多数 Linux 发行版都会创建并维护自己的仓库。此外还有用于处理软件包仓库的额外工具。这些工具可以直接与软件包仓库接口，以寻找新软件，甚至可以自动安装应用程序运行所需的任何依赖包。\n\
  \n\n\n\n\n除了官方支持的发行版软件包仓库，互联网上还涌现许多第三方软件包仓库。许多专用或定制的软件包通常不会作为标准 Linux 发行版仓库的一部分发布，但在第三方仓库中可用。仓库工具允许你获取这些软件包。\n\
  \n接下来，让我们探索如何使用 Debian 和 Red Hat 的仓库工具。\n\n## Debian 仓库工具\n\n用于处理 Debian 仓库的核心工具是\
  \ `apt` 工具套件。这包括 `apt-cache` 程序（它提供有关软件包数据库的信息）以及 `apt-get` 程序（它负责执行安装、更新和删除软件包的工作）。为了方便起见，`apt`\
  \ 程序是一个前端脚本，它可以根据需要调用其中任一个核心程序。\n\n`apt` 工具套件依赖于 `/etc/apt/sources.list.d/ubuntu.sources`\
  \ 文件来识别查找仓库的位置。默认情况下，每个 Linux 发行版都会在该文件中列入其自身的仓库位置，但如果你安装了发行版不支持的第三方应用程序，你也可以添加额外的仓库位置。\n\
  \n`apt-cache` 程序中有几个实用的命令选项，用于显示软件包信息：\n\n* `depends`: 显示软件包所需的依赖关系\n* `pkgnames`:\
  \ 显示系统上安装的所有软件包\n* `showpkg`: 显示关于指定软件包的信息\n* `stats`: 显示系统的软件包统计信息\n* `unmet`:\
  \ 显示已安装软件包任何未满足的依赖关系\n\n`apt` 工具套件的主力工具是 `apt` 程序。它是你从 Debian 软件包仓库安装和删除软件包的工具。表\
  \ 13.4 列出了 `apt` 命令。\n\n| 操作 | 描述 |\n| --- | --- |\n| `autoremove` | 自动删除作为其他安装软件包依赖而安装的任何不再需要的软件包\
  \ |\n| `full-upgrade` | 功能与 `upgrade` 相同，但会删除升级整个系统所需的任何已软件包 |\n| `install` | 从仓库安装新的软件软件包\
  \ |\n| `list` | 显示当前安装的软件包 |\n| `purge` | 删除指定的应用程序以及任何配置或数据文件 |\n| `reinstall`\
  \ | 尝试从仓库重新安装已存在的软件包 |\n| `remove` | 删除指定的应用程序，但保留任何配置或数据文件 |\n| `satisfy` | 尝试解决已安装软件包中的软件依赖关系\
  \ |\n| `search` | 在仓库中搜索特定软件包 |\n| `show` | 显示关于指定软件包的信息 |\n| `update` | 从所有配置的仓库下载软件包信息\
  \ |\n| `upgrade` | 安装所有已安装软件包的可用更新 |\n\nTABLE 13.4 `apt` 程序操作命令\n\n从仓库安装新软件包只需通过\
  \ `install` 操作并指定软件包名称即可：\n\n```\n$ sudo apt install zsh\nReading package lists...\
  \ Done\nBuilding dependency tree... Done\nReading state information... Done\nSuggested\
  \ packages:\n  zsh-doc\nThe following NEW packages will be installed:\n  zsh\n0\
  \ upgraded, 1 newly installed, 0 to remove and 4 not upgraded.\nNeed to get 812\
  \ kB of archives.\nAfter this operation, 2,489 kB of additional disk space will\
  \ be used.\nGet:1 http://us.archive.ubuntu.com/ubuntu noble/main amd64 zsh amd64\
  \ 5.9-6ubuntu2 [812 kB]\nFetched 812 kB in 1s (1,053 kB/s)\nSelecting previously\
  \ unselected package zsh.\n(Reading database ... 189118 files and directories currently\
  \ installed.)\nPreparing to unpack .../zsh_5.9-6ubuntu2_amd64.deb ...\nUnpacking\
  \ zsh (5.9-6ubuntu2) ...\nSetting up zsh (5.9-6ubuntu2) ...\nProcessing triggers\
  \ for debianutils (5.17build1) ...\nProcessing triggers for man-db (2.12.0-4build2)\
  \ ...\n$\n```\n\n如果需要任何依赖项，`apt` 程序也会检索它们并自动安装。\n\n## Red Hat 仓库工具\n\n在过去，用于处理 Red\
  \ Hat 仓库的核心工具一直是 `yum` 工具（YellowDog Update Manager 的缩写，最初为 YellowDog Linux 发行版开发）。该工具最近被\
  \ `dnf` 工具所取代，它是 `yum` 的更新版本，并增加了额外功能。`dnf` 工具允许你直接从 Red Hat 仓库查询、安装和删除系统上的软件包。\n\
  \n`yum` 和 `dnf` 命令都使用 `/etc/yum.repos.d` 文件夹来存放列出其检查软件包的不同仓库的文件。对于默认的 Rocky 9 Linux\
  \ 系统，该文件夹包含几个仓库文件：\n\n```\n$ cd /etc/yum.repos.d\n$ ll\ntotal 32\n-rw-r--r--. 1\
  \ root root 1142 Aug 30 16:52 epel-cisco-openh264.repo\n-rw-r--r--. 1 root root\
  \ 1453 Aug 30 16:52 epel.repo\n-rw-r--r--. 1 root root 1552 Aug 30 16:52 epel-testing.repo\n\
  -rw-r--r--. 1 root root 6610 Jun 00 16:52 rockybase.repo\n$\n```\n\n`yum.repos.d`\
  \ 文件夹中的每个文件都包含关于仓库的信息，例如额外软件包的位置。`dnf` 程序非常多功能。表 13.5 显示了你可以使用的命令。\n\n| 操作 | 描述\
  \ |\n| --- | --- |\n| `alias` | 定义指向其他 `dnf` 命令的别名 |\n| `autoremove` | 任何不再作为依赖项被安装的软件包\
  \ |\n| `check` | 检查本地软件包数据库并报告任何问题 |\n| `check-update` | 检查仓库中指定软件包的更新 |\n| `clean`\
  \ | 对保留的临时文件进行清理 |\n| `deplist` | `repoquery` 的弃用别名 |\n| `distro-sync` | 降级或安装软件包以使系统与当前版本同步\
  \ |\n| `downgrade` | 将指定的软件包降至仓库中提供的版本 |\n| `group` | 将一组软件包视为单个实体进行管理 |\n| `help`\
  \ | 显示 `dnf` 命令的帮助信息 |\n| `history` | 显示之前的 `dnf` 命令 |\n| `info` | 显示已安装和可用软件包的信息\
  \ |\n| `install` | 从仓库安装软件包的当前版本 |\n| `list` | 显示所有已安装和可用的软件包 |\n| `makecache` |\
  \ 下载仓库的元数据 |\n| `mark` | 将指定的软件包标记为已安装 |\n| `module` | 管理模块软件包 |\n| `provides` |\
  \ 显示安装了指定文件的软件包 |\n| `reinstall` | 尝试重新安装指定的软件包 |\n| `remove` | 从系统中删除指定的软件包，包括依赖于该软件包的任何软件包\
  \ |\n| `repoinfo` | 显示配置仓库的信息 |\n| `repolist` | 显示当前配置仓库列表 |\n| `repoquery` | 在配置的仓库中搜索指定的软件包\
  \ |\n| `repository-packages` | 对仓库中的所有软件包运行命令 |\n| `search` | 在软件包元数据中搜索关键词 |\n\
  | `shell` | 显示用于输入多个 `dnf` 命令的交互式 shell |\n| `swap` | 删除并重新安装指定的软件包 |\n| `updateinfo`\
  \ | 显示更新公告 |\n| `upgrade` | 安装指定软件包的最新版本，如果未指定则安装所有软件包 |\n| `upgrade-minimal` |\
  \ 安装提供漏洞修复或安全修复的最新软件包版本 |\n\n\n\n\n\n使用 `dnf` 安装新应用程序非常简易：\n\n```bash\n $ sudo dnf\
  \ install zsh\nRocky Linux 9 - BaseOS              3.9 kB/s | 4.1 kB     00:01 \
  \  \nRocky Linux 9 - BaseOS             519 kB/s | 2.3 MB     00:04   \nRocky Linux\
  \ 9 - AppStream            683 B/s | 4.5 kB     00:06   \nRocky Linux 9 - Extras\
  \             3.6 kB/s | 2.9 kB     00:00   \nRocky Linux 9 - Extras           \
  \  14 kB/s |  15 kB     00:01   \nDependencies resolved.\n======================================================================\n\
  \ Package      Architecture    Version            Repository      Size\n======================================================================\n\
  Installing:\n zsh             x86_64            5.8-9.el9        baseos        \
  \   2.9 M\n\nTransaction Summary\n======================================================================\n\
  Install  1 Package\n\nTotal download size: 2.9 M\nInstalled size: 7.6 M\nIs this\
  \ ok [y/N]: y\nDownloading Packages:\nzsh-5.8-9.el9.x86_64.rpm             1.9 MB/s\
  \ | 2.9 MB     00:01   \n------------------------------------------------------\n\
  Total                                   431 kB/s | 2.9 MB     00:06   \nRunning\
  \ transaction check\nTransaction check succeeded.\nRunning transaction test\nTransaction\
  \ test succeeded.\nRunning transaction\n  Preparing        :                   \
  \          1/1\n  Installing        : zsh-5.8-9.el9.x86_64           1/1\n  Running\
  \ scriptlet: zsh-5.8-9.el9.x86_64           1/1\n  Verifying        : zsh-5.8-9.el9.x86_64\
  \           1/1\n\nInstalled:\n  zsh-5.8-9.el9.x86_64\n\nComplete!\n$\n```\n\n`dnf`\
  \ 的一个很棒的功能是能够对软件包进行分组发行。你不需要下载特定环境所需的所有软件包（例如用于 Apache、MySQL 和 PHP 服务的 Web 服务器），而是可以下载了这些软件包的包组。这使得在系统上安装软件包变得更加简单。\n\
  \n#### 图形化软件包工具\n\n基于 Debian 和基于 Red Hat 的软件包管理系统都提供了图形化工具，方便在桌面环境中安装软件。Ubuntu 和\
  \ Rocky 发行版中都可用的一种工具是 `gnome-software`。\n\n`gnome-software` 程序是 `PackageKit` 工具的图形化前端，而\
  \ `PackageKit` 本身是一个标准化包括 `apt` 和 `yum` 在内的多个软件包管理工具界面的前端。通过包含 `PackageKit` 和 `gnome-software`，Linux\
  \ 发行版可以为用户提供标准的图形化界面来管理其软件软件包。图 13.1 显示了 Ubuntu 24.04 Linux 发行版中的 `gnome-software`\
  \ 软件包。\n\n![软件中心界面的截图，包含导航边栏以及用于生产力、游戏和开发的各种应用程序。](img/c13f001.png)\n\n图 13.1 Ubuntu\
  \ 软件包图形化工具\n\n你可以搜索软件包、查看已安装的软件包，甚至查看存储库中可用的软件包。如果你使用的是 Rocky Linux 9.4 发行版，`gnome-software`\
  \ 界面看起来相同，如图 13.2 所示。\n\n![软件中心界面的截图，包含导航边栏以及用于生产力、游戏和开发的各种应用程序。](img/c13f001.png)\n\
  \n图 13.2 Rocky Linux 软件包图形化工具\n\n#### 使用应用程序容器\n\nLinux 世界中一个较新的特性是使用 `containers`。容器允许你将应用程序所需的文件封装到一个包中——这确保了你可以一次性安装所有内容。但这种方法的缺点是应用程序之间共享的任何依赖可能需要频繁切换。\n\
  \nUbuntu 的创建者 Canonical 开发了一种名为 `snap` 的格式。`snapd` 管理 `snap` 软件包。你使用 `snap` 命令行进行查询、安装和删除。\n\
  \n要检查 `snap` 是否正在运行，请使用 `snap version`：\n\n```bash\n $ snap version\nsnap 2.63.2\n\
  snapd 2.63.2\n```\n\n如果 `snap` 正在运行，你可以使用 `snap list` 查看已安装软件包列表：\n\n```bash\n $\
  \ snap list\nName                    Version      Rev    Tracking  Notes\nbase \
  \                    24.2.1        0        latest  \ncore24                   2024.2.2\
  \     0        latest  \ndesktop-runtime          24.04.1     40        latest \
  \ \nfirefox                  128.0.3     150      latest  \ngnome-software     \
  \       474.6       110      latest  \n```\n\n要搜索 snap 存储库中的新应用程序，使用 `snap find`：\n\
  \n```bash\n $ snap find mysql-shell\nName                    Version      Rev  \
  \  Tracking  Notes\nmysql-shell              8.0.33      1        latest  \n```\n\
  \n要查看有关应用程序的更多信息，使用 `snap info`：\n\n```bash\n $ snap info mysql-shell\nname:   \
  \                mysql-shell\nsummary:                MySQL Shell 是一个用于 MySQL 的高级客户端和代码编辑器。\n\
  description:            除了提供的 SQL 功能外（类似于 mysql），MySQL Shell 还为 JavaScript 和 Python\
  \ 提供了脚本功能，并包含了用于处理 MySQL 的 API。\nsnap-id:                BW9WD0mGu96vt1MszgPKgi1W1a4\n\
  publisher:              Canonical\nstore-url:              https://snapcraft.io/mysql-shell\n\
  license:                GPL-2.0\nchannels:\n  latest/stable          8.0.23    \
  \  2021-03-22 29 (98MB)\n  latest/candidate       8.0.31      2022-11-03 31 (85MB)\n\
  \  latest/edge            8.1.0       2023-07-20 34 (89MB)\n$\n```\n\n安装新的 snap，使用\
  \ `snap install` 命令：\n\n```bash\n $ sudo snap install mysql-shell\nmysql-shell 8.0.23\
  \ from Canonical installed\n```\n\n你可以通过 `list` 命令检查软件容器是否已安装。\n\n最后，你可以使用 `remove`\
  \ 命令删除已安装的应用程序容器：\n\n```bash\n $ sudo snap remove mysql-shell\nmysql-shell removed\n\
  $\n```\n\n\n\n\n`flatpak` 应用程序容器格式作为一个独立的开源项目被创建，与任何特定的 Linux 发行版没有直接联系。尽管如此，界限已经划定，基于\
  \ Red Hat 的 Linux 发行版倾向于使用 `flatpak` 而不是 Canonical 的 `snap` 容器格式。\n\n要显示系统上当前安装的\
  \ `flatpak` 容器，请使用 `list` 命令：\n\n```\n $ flatpak list\n$\n```\n\n没什么特别兴奋的。当你第一次安装\
  \ `flatpak` 时，不会安装任何容器，但现在你知道 `flatpak` 已经安装了。\n\n默认情况下，基于 Red Hat 的 Linux 发行版不会为\
  \ `flatpak` 配置任何仓库（称为 `remotes`）。最流行的 `flatpak` 远程仓库是 Flathub。目前，要将 `flatpak`指向\
  \ Flathub 远程仓库，你需要使用以下命令：\n\n```\n $ sudo flatpak remote-add --if-not-exists flathub\
  \ https://flathub.org/repo/flathub.flatpakrepo\n[sudo] password for rich: \n$\n\
  ```\n\n要在 flatpak 仓库中查找应用程序，你使用 `flatpak search` 命令：\n\n```\n $ flatpak search mosh\n\
  Name      Description         Application ID      Version           Branch  Remotes\n\
  Mosh      The Mobile Shell      org.mosh.mosh      1.4.0            stable  flathub\n\
  ...\n$\n```\n\n在操作容器时，你必须使用它的 Application ID 值而不是名称。要安装应用程序，使用 `flatpak install`\
  \ 命令：\n\n```\n $ sudo flatpak install org.mosh.mosh\nLooking for matches…\nRequired\
  \ runtime for org.mosh.mosh/x86_64/stable (runtime/org.freedesktop.Platform/x86_64/22.08)\
  \ found in remote flathub\nDo you want to install it? [Y/n]: y\n\norg.mosh.mosh\
  \ permissions:\n     network    ssh-auth\n\n      ID                           \
  \    Branch      Remote\n 1.  org.freedesktop.Platform.GL.default 22.08      flathub\n\
  \ 2.  org.freedesktop.Platform.GL.default 22.08-extra flathub\n 3.  org.freedesktop.Platform.Locale\
  \    22.08      flathub\n 4.  org.freedesktop.Platform.openh264    2.2.0      flathub\n\
  \ 5.  org.freedesktop.Platform            22.08      flathub\n 6.  org.mosh.mosh\
  \                       stable      flathub\n\nInstallation complete.\n$\n```\n\n\
  要检查安装是否成功，请再次使用 `flatpak list` 命令：\n\n```\n $ flatpak list\nName               Application\
  \ ID           Version\n  Branch      Installation\nFreedesktop Platform  org.freedesktop.Platform\
  \ freedesktop-sdk-22.08.27\n   22.08       system\nMesa               org.freedesktop.Platform.GL.default\
  \ 24.0.9\n   22.08       system\nMesa (Extra)       org.freedesktop.Platform.GL.default\
  \ 24.0.9\n   22.08-extra system\nopenh264            org.freedesktop.Platform.openh64\
  \    2.1.0\n   2.2.0       system\nMosh               org.mosh.mosh            \
  \               1.4.0\n  stable       system\n$\n```\n\n最后，要移除应用程序容器，使用 `flatpak\
  \ uninstall` 命令：\n\n```\n $ sudo flatpak uninstall org.mosh.mosh\n\n      ID   \
  \            Branch      Op\n 1.  [-] org.mosh.mosh       stable      r\n\nUninstall\
  \ complete.\n$\n```\n\n使用 `flatpak` 容器与使用包管理系统有些不同，但一旦你熟悉了这些格式，它与标准的包管理系统并没有太大区别。\n\
  \n以下练习演示了在 Debian 和 Rocky Linux 中使用包管理命令行工具安装 `zsh` 壳包的基本知识。\n\n## 总结\n\n轻松安装和删除应用程序的能力是每个\
  \ Linux 系统的必备条件。在开源世界中，开发者使用 `tar` 和 `gzip` 实用将源代码包打包成 tarball 文件（归档包）来发布他们的应用程序。在下载\
  \ tarball 文件后，你必须解压并提取其中包含的文件，才能编译应用程序。`gcc` 程序是编译许多开源应用程序最常用的程序。你使用 `configure`\
  \ 和 `make` 实用来创建并运行安装脚本，以便从源代码安装应用程序变得更加容易。\n\n大多数 Linux 发行版通过预编译源代码并将必要的应用程序文件封装到包中，来帮助简化应用程序的安装。包管理软件可以更容易跟踪你的\
  \ Linux 系统上安装了哪些应用程序以及它们文件所在的位置。基于 Debian 的 Linux 发行版使用 `.deb` 包管理格式和 `dpkg` 工具，而基于\
  \ Red Hat 的 Linux 发行版则使用 `RPM` 包管理格式和 `rpm` 工具。\n\n虽然包管理系统让安装和删除包变得更简单，但寻找包仍然有些不便。大多数\
  \ Linux 发行版现在都维护自己的包仓库，并提供额外的工具以便于从仓库中检索包。对于基于 Debian 的系统，使用 `apt` 工具套（包括 `apt-cache`\
  \ 和 `apt-get`）。对于基于 Red Hat 的系统，可以使用 `yum` 或 `dnf` 包管理工具。\n\n应用程序容器现在在 Linux 世界变得越来越流行。应用程序容器将运行程序所需的所有软件（包括依赖项）封装到一个安装包中。两种最流行的容器格式是\
  \ `snap` 和 `flatpak`。\n\n## 考试要点\n\n### 描述开发者如何封装开源应用程序进行发行\nLinux 开发者将源代码文件、头文件、库和文档文件封装成一个文件进行发行。他们使用\
  \ `tar` 工具将多个文件和文件夹归档为单一归档文件，并经常使用 `gzip` 工具对归档文件进行压缩。你可以使用 `wget` 或 `curl` 下载源码发行文件，然后使用\
  \ `gzip` 和 `tar` 工具解压并提取源代码文件。\n\n### 解释如何从源码 tarball 生成可执行程序\n在从发行版 tarball 中解压并提取出源代码文件后，你必须编译源代码以创建可执行文件。首先，你使用\
  \ `configure` 工具。它会检查你的 Linux 系统，以确保它具有应用程序所需的正确依赖项，并配置安装脚本以查找这些依赖项。接下来，你运行 `make`\
  \ 工具。`make` 工具运行一个脚本，使用 `gcc` 编译器编译必要的库和源代码文件以生成可执行文件。一旦脚本运行完成，使用带有 `install` 选项的\
  \ `make` 将可执行文件安装到你的系统中。\n\n### 描述 Linux 如何封装应用程序进行发行\nLinux 使用包管理系统来跟踪你的系统中安装了哪些应用程序。发行版将预编译的应用程序文件封装成包，你可以轻松地下载和安装。包管理数据库跟踪已安装的包以及包内包含的所有文件的位置。你也可以查询包管理数据库来确定安装了哪些包，并从系统中移除包。基于\
  \ Debian 的 Linux 系统使用 `dpkg` 工具与包管理数据库交互，而基于 Red Hat 的 Linux 系统使用 `rpm` 工具。\n\n\n\
  \n\n### 描述 Linux 发行版如何使用仓库。\n虽然使用软件包使得软件应用程序的安装、跟踪和删除变得更容易，但你仍然能够为你的应用程序找到最新的软件包。大多数\
  \ Linux 发行版通过创建一个当前应用程序软件包的中央仓库，以及用于操作该仓库的工具来提供帮助。对于基于 Debian 的系统，`apt` 工具套件允许你查询仓库中的软件包信息并下载任何新的或更新的软件包。基于\
  \ Red Hat 的系统使用 `yum` 或 `dnf` 工具与它们的仓库进行交互。这三个工具都允许你查询远程仓库中的软件包、查询本地软件包管理数据库，并根据需要安装或删除软件包。\n\
  \n### 解释应用程序容器与软件包管理系统有何区别。\n诸如 `snap` 和 `flatpak` 等应用程序容器将运行应用程序所需的所有文件（包括任何依赖程序）封装成单个软件包。虽然这可能会导致依赖应用程序的重复副本，但它确保了每个应用程序都安装了运行所需的、精确版本的库和依赖程序，使得将应用程序从一个系统移动到另一个系统变得轻而易举。\n\
  \n## 复习题\n\n你可以在 附录 A 中找到复习题的答案。\n\n1. 你应该使用哪两个程序从应用程序网站下载 tarball 包？（选择两个。）\n \
  \   1. `wget`\n    2. `cURL`\n    3. `dpkg`\n    4. `rpm`\n    5. `yum`\n\n2. Fred\
  \ 收到了一个源代码格式的应用程序。他应该运行什么脚本来创建可执行的应用程序程序？\n    1. `dpkg`\n    2. `rpm`\n    3. `yum`\n\
  \    4. `make`\n    5. `wget`\n\n3. Sherri 正在尝试从源代码编译应用程序。在创建应用程序可执行文件之前，她应该运行什么脚本来创建\
  \ `make` 脚本？\n    1. `make`\n    2. `make install`\n    3. `configure`\n    4. `gcc`\n\
  \    5. `dpkg`\n\n4. 用于开源 Linux 应用程序最常用的编译器是什么？\n    1. `gcc`\n    2. `make`\n \
  \   3. `configure`\n    4. `dpkg`\n    5. `rpm`\n\n6. Harry 已完成了应用程序源代码的编写，但需要将其打包以便发行。他应该使用什么工具以便其可以在任何\
  \ Linux 发行版中解压？\n    1. `dpkg`\n    2. `rpm`\n    3. `yum`\n    4. `apt-get`\n \
  \   5. `tar`\n\n7. 哪些 `tar` 命令行选项经常一起用于从 tarball 文件提取并解压缩文件？\n    1. `-Uvh`\n  \
  \  2. `-zxvf`\n    3. `-xvf`\n    4. `-zcvf`\n    5. `-cvf`\n\n8. Rocky Linux 发行版使用什么软件包扩展名？\n\
  \    1. `.deb`\n    2. `.rpm`\n    3. `.tgz`\n    4. `.tar`\n    5. `.gz`\n\n9.\
  \ Sally 需要在她的 Ubuntu Linux 系统上安装新软件包。该软件包以 `.deb` 文件形式发行。她应该使用什么工具？\n    1. `rpm`\n\
  \    2. `yum`\n    3. `dnf`\n    4. `dpkg`\n    5. `tar`\n\n10. 基于 Red Hat 的 Linux\
  \ 发行版利用哪种应用程序容器格式安装应用程序？\n    1. `flatpak`\n    2. `rpm`\n    3. `dpkg`\n    4.\
  \ `snap`\n    5. `gcc`\n\n# 第 14 章\n\n维护内核模块\n\n![](img/chaptersquare.png)\n\n`module`（也称为内核模块）是一个自包含的驱动程序库文件。使用模块而不是将所有功能编译到内核中的优势是，它们可以保持\
  \ Linux 内核更轻量、更灵活。我们可以根据需要或按需添加某些内核功能，因为模块可以动态地加载和卸载到内核中。它们可以在不需要重启系统的情况下扩展内核的功能。\n\
  \n你将查看各种内核模块类型、其文件的存储位置以及模块配置的位置。你还将探索如何动态链接和取消模块、查看模块信息以及删除模块。\n\n## 探索内核模块\n\n\
  内核模块有不同的类型，如下：\n\n* **设备驱动程序：** 促进与硬件设备进行通信。\n* **文件系统驱动程序：** 文件系统 I/O 所需。\n* **网络驱动程序：**\
  \ 用于实现网络协议。\n* **系统调用：** 为添加/修改系统服务提供额外功能。\n* **可执行加载器：** 允许加载额外的可执行格式。\n\n在处理模块时，你应该熟悉一些不同的文件和目录。支持内核所需的模块存储在\
  \ `/lib/modules/` 目录树中。你系统中可用的每个 Linux 内核版本在 `/lib/modules/` 目录下都有自己的子目录。Ubuntu\
  \ 24.04 发行版中该目录及其内核版本子目录的示例见 列表 14.1。\n\n请注意，发行版的实现方式可能略有不同。例如，基于 Red Hat 的发行版将\
  \ `/lib/modules/` 目录硬链接到 `/usr/lib/modules/` 目录。因此，它们是同一个目录，但有两个不同的名称。Rocky Linux\
  \ 9.4 系统的示例见 列表 14.2。\n\n注意 列表 14.2，这两个目录共享相同的 inode 索引节点号。硬链接最初在 第 3 章“管理文件、目录和文本](#c003.xhtml_c003)”中介绍。\n\
  \n如果有需要，你可以自定义模块以定义任何所需的唯一参数，例如设备运行至关重要的硬件设置。在某些旧的 Linux 发行版中，有一个配置文件 `/etc/modules.conf`，而在更现代的发行版中有配置目录：\n\
  \n* `/etc/modprobe.d/` 或 `/etc/modules-load.d/` 包含系统安装时生成或管理员创建的配置文件。\n* `/lib/modprobe.d/`\
  \ 存储第三方软件包生成的配置文件。\n* `/usr/lib/modprobe.d/` 如果存在，通常硬链接到 `/lib/modprobe.d/` 目录。\n\
  * `/run/modprobe.d/` 存储运行时生成的配置文件。\n\n在每个配置目录中，有多个具有 `.conf` 后名的配置文件。Rocky Linux\
  \ 9.4 发行版的示例见 列表 14.3。\n\n在 Linux 虚拟目录系统中，内核模块以及模块配置文件有许多可能的位置。因此，查看你自己的 Linux 服务器并记录它们的位置是明智的。\n\
  \n许多设备驱动内核模块在系统启动时加载，或者在硬件设备连接到系统时动态加载。如果发生问题，你需要知道使用哪些工具来帮助诊断问题。有三个方便程序可以帮助模块：\n\
  \n* `dmesg` 显示当前内核环形缓冲区。\n* `lsmod` 显示简要的模块信息。\n* `modinfo` 提供详细的模块数据。\n\n提到模块，模块失败有时会内核消息。`dmesg`\
  \ 命令非常有用，因为你可以查看与当前事件相关的内核消息。在启动时，你的发行版可能会获取内核环形缓冲区快照并将数据存储在文件中（通常是 `/var/log/dmesg`\
  \ 文件）。这两个环形缓冲区源都可以帮助你追踪内核模块问题。\n\n`dmesg` 工具将将当前内核环形缓冲区转储到标准输出（STDOUT）。使用 `grep`\
  \ 命令搜索消息是有帮助的。这部分的示例见 列表 14.4。\n\n\n\n\n\n你可以使用不同的搜索词来过滤 `dmesg` 程序的输出内容。例如，如果你只想查找有关\
  \ USB 设备问题的信息，可以将 `dmesg` 的输出通过到 `grep -i usb` 命令中。\n\n`lsmod` 工具显示当前 Linux 内核中模块的状态。显示列表\
  \ 14.5 展示了在 openSUSE 发行版上此项操作的片段示例。\n\n在 `lsmod` 输出中，每个模块都单独列一行。第一列是模块名称。\n\n注意列表\
  \ 14.5 中的 `Used by` 列。该列中的数字表示当前使用该模块的进程或其他模块的数量。如果是另一个内核模块在使用它，则会显示另一个模块的名称。\n\n\
  你可以通过 `modinfo` 工具获取有关特定内核模块的更详尽的信息。这可能需要超级用户权限，如列表 14.6 中的片段所示。\n\n注意列表 14.6 中的内核模块文件名。内核模块文件通常具有\
  \ `.ko` 文件扩展名。还请注意，显示了模块的版本号。如果你需要追踪与特定模块相关的已知错误，这非常有帮助。\n\n## 安装内核模块\n\nLinux 通常会在系统需要时自动加载模块。尽管如此，你可能仍然想要测试新模块或尝试新的模块配置。为了做到，你可能需要手动将模块安装到内核中。这被称为*插入*或*加载*模块。在本节中，我将介绍几个可以帮助你将模块加载到内核的工具它们如下：\n\
  \n* `insmod`\n* `modprobe`\n* `depmod`\n\n`insmod` 工具允许你将单个模块插入 Linux 内核中。遗憾的是，因为它非常基础，你必须提供模块文件的绝对路径引用。此外，该命令不会加载任何所需的模块依赖项。openSUSE\
  \ 发行版上的片段示例在列表 14.7 所示。\n\n在列表 14.7 中，系统使用 `lsmod` 命令检查是否加载了模块名为 `joydev` 的模块。未找到。因此，`insmod`\
  \ 命令使用其完整文件名和目录位置将其插入内核。再次采用 `lsmod` 命令显示该模块现在确实已加载到内核中。\n\n`modprobe` 命令比 `insmod`\
  \ 工具更容易使用，因为你可以通过模块名称来指定模块。它还会加载插入的模块运行所需的任何额外模块（依赖项）。列表 14.8 显示了一个片段示例，该示例在 `modprobe`\
  \ 命令上使用了 `-v` 开关，以便插入模块及其所有当前未加载依赖项时显示更多信息。\n\n`dm_mirror` 模块允许卷管理器镜像逻辑卷。在列表 14.8\
  \ 中，当使用 `modprobe` 命令加载此模块时，它也加载了另外两个模块，`dm_mirror` 模块正常工作所需的。注意 `modprobe` 工具正在调用\
  \ `insmod` 工具来执行插入工作。还请 `dm_mirror` 模块有一个略有不同的文件名 `dm-mirror.ko`，如 `modinfo` 工具的输出所示。\n\
  \n`modprobe` 程序使用 `modules.dep` 文件来确定任何模块依赖项。该文件通常位于 `/lib/modules/` 子目录下，如列表 14.9\
  \ 中的片段所示。\n\n在列表 14.9 中，使用 `grep` 工具在 `modules.dep` 文件中搜索单词 `mirror`。要查看特定模块的依赖项，你可以在文件中定位模块文件名。在冒号（`:`）之后，按完整的模块文件名列出模块的依赖项。因此对于\
  \ `dm_mirror` 模块 (`dm-mirror.ko`)，模块依赖项是 `dm-region-hash`、`dm-log` 和 `dm-mod` 模块。这与列表\
  \ 14.8 中 `modinfo` 工具的输出一致。\n\n你可以使用 `depmod` 命令扫描系统查找任何未自动检测到的硬件。这对于排除新设备的问题很有用。列表\
  \ 14.10 显示了一个片段示例。\n\n在列表 14.10 中，`depmod` 工具扫描系统，确定任何所需的模块，检查模块依赖关系，并更新相应的 `modules.dep`\
  \ 文件。注意它还将活动输出到 STDOUT。\n\n## 移除内核模块\n\n移除 Linux 系统上不再使用的内核模块是一个好主意。如果你只需要移除（卸载）没有依赖项的模块，可以使用\
  \ `rmmod` 命令。列表 14.11 所示示例。\n\n注意列表 14.11 中的 `rmmod` 工具理解模块名称，所以你不需要提供模块文件的绝对路径引用。一旦模块被卸载，`lsmod`\
  \ 工具在输出中不再显示该模块名称。\n\n`modprobe` 工具适用于移除具有一个或多个依赖项的模块。你只需要添加 `-r` 开关，如果需要详细信息，请包含\
  \ `-v` 开关，如列表 14.12 中的片段所示。\n\n在列表 14.12 中，模块 `dm_mirror` 与它的两个依赖项一起卸载。注意，如果模块未加载，你将看不到任何消息，只会得到命令行提示符。\n\
  \n## 总结\n\n当内核模块失败或当你需要测试新模块时，了解模块文件及其配置文件所在至关重要。同样重要的是能够使用可为此目的提供的各种命令行工具来诊断问题。由于模块可以与内核进行动态链接和取消链接，你应该理解如何使用正确的工具来执行这些任务。你\
  \ Linux 工具箱中的这些额外工具将允许你快速解决有关内核模块的问题。\n\n## 考试要点\n\n**描述内核模块文件的位置。** 内核模块文件具有 `.ko`\
  \ 文件扩展名，通常位于 `/lib/modules/` 目录的子目录下。每个特定的 Linux 内核版本都有子目录。某些发行版具有额外的目录，例如 `/usr/lib/modules/`，它们是到\
  \ `/lib/modules/` 目录的硬链接。\n\n**区分模块配置文件的位置。** 较旧的 Linux 发行版使用单个文件 `/etc/modules.conf`\
  \ 作为内核模块配置文件。更现代的发行版使用配置目录，可以是 `/etc/modprobe.d/`、`/etc/modules-load.d/`、`/lib/modprobe.d/`、`/usr/lib/modprobe.d/`\
  \ 和/或 `/run/modprobe.d/` 目录。在配置目录下，模块配置文件具有 `.conf` 文件扩展名。\n\n**总结用于排除模块故障工具。**\
  \ 因为内核模块失败时通常会发出内核消息，你可以使用 `dmesg` 工具查看最近的内核消息，或者在可用时浏览 `/var/log/dmesg` 文件以查看启动时的内核问题。`lsmod`\
  \ 工具显示所有当前加载的模块、使用它们的进程和其他模块的数量，以及其他模块的名称。`modinfo` 程序非常有帮助，因为它显示了有关模块的详细信息，包括它的依赖项。\n\
  \n\n\n\n\n比较用于安装内核模块的工具。低级工具 `insmod` 需要完整的模块文件名才能将模块插入内核，这可能非常繁琐。此外，它不会加载任何模块依赖项。相比之下，`modprobe`\
  \ 工具只需要模块名称。此外，它还会搜索 `modules.dep` 文件以确定并加载任何模块依赖项。\n\n解释用于删除内核模块的工具。`rmmod` 工具是一个低级工具。虽然它不需要完整的模块文件名即可从内核中取消链接模块，但它并不会卸载任何模块依赖项。因此，你可能会留下仍然链接到内核的不再需要的模块。`modprobe`\
  \ 工具使用 `-r` 选项可以卸载模块并取消链接任何模块依赖项。\n\n## 复习题\n\n你可以在 附录 A 中找到复习题的答案。\n\n1. 关于内核模块，以下哪些项是正确的？（选择所有适用项\n\
  \    1. 它是一个自包含的驱动程序库文件。\n    2. 它被编译到 Linux 内核中。\n    3. 它允许在需要时添加功能。\n    4. 可以在需要时加载。\n\
  \    5. 它使 Linux 内核更轻量、更灵活。\n\n2. 模块文件存储在何处？（选择所有适用项）\n    1. `/lib/modules/kernel/`\
  \ 子\n    2. `/lib/modules/KernelVersion/` 子目录\n    3. `/usr/lib/modules/kernel/`\
  \ 子目录\n    4. `/usr/lib/modules/KernelVersion/` 子目录\n    5. `/lib/kernel/modules`\
  \ 子目录\n\n3. 模块的配置信息可以存储在哪里？（选择所有适用项）\n    1. `/etc/modules.conf` 文件\n    2. `/etc/modprobe.d/*.conf`\
  \ 文件\n    3. `/etc/modules.d/*.conf` 文件\n    4. `/lib/modprobe.d/*.conf` 文件\n  \
  \  5. `/usr/lib/modprobe.d/*.conf` 文件\n\n4. 你需要确定已卸载的 `xyz` 模块的依赖项。哪种工具是完成此任务的最佳工具？\n\
  \    1. `dmesg`\n    2. `insmod`\n    3. `lsmod`\n    4. `modprobe`\n    5. `modinfo`\n\
  \n5. 你需要安装 `xyz` 模块，包括所有需要的依赖项。你应该使用以下哪个工具？\n    1. `insmod`\n    2. `modinfo`\n\
  \    3. `modprobe`\n    4. `lsmod`\n    5. `depmod`\n\n6. 当你在 Linux 系统上安装 USB 设备时，设备似乎没有被检测到。以下哪个命令是排除此特定情况的最佳命令？\n\
  \    1. `lsmod`\n    2. `modinfo`\n    3. `dmesg`\n    4. `depmod`\n    5. `insmod`\n\
  \n7. `modprobe` 工具使用 _____________ 文件来确定任何模块依赖项。\n    1. `modules.dep`\n    2. `/lib/modules`\n\
  \    3. `/usr/lib/modules`\n    4. `/etc/modprobe.d`\n    5. `/lib/modprobe.d`\n\
  \n8. 你需要将 `abc` 模块插入 Linux 内核。该模块没有任何依赖项。使用哪个工具是最佳？\n    1. `lsmod`\n    2. `modinfo`\n\
  \    3. `dmesg`\n    4. `depmod`\n    5. `insmod`\n\n9. 你需要从 Linux 内核卸载 `abc` 模块。该模块没有任何依赖项。使用哪个工具是最佳？\n\
  \    1. `insmod`\n    2. `unload`\n    3. `rmmod`\n    4. `modprobe`\n    5. `rm\
  \ -f`\n\n10. 你需要删除 `xyz` 模块及其所有依赖项。哪种命令是执行任务的最佳？\n    1. `dmesg`\n    2. `modprobe\
  \ -r`\n    3. `lsmod`\n    4. `paste`\n    5. `groupdel`\n\n# 第四部分：保护你的系统\n\n# 第\
  \ 15 章：应用所有权和权限\n\n![](img/chaptersquare.png)\n\n防止对文件和目录的未经访问是任何 Linux 管理员工作的主要部分。Linux\
  \ 提供了不同的方法来保护文件，这使得安全性变得有点复杂。本章深入研究 Linux 文件和目录安全，并演示如何在你的 Linux 系统上实现它。首先，它查看了\
  \ Linux 如何为文件和目录分配所有权。然后讨论了自 Linux 诞生以来一直存在的基本文件和目录安全功能。之后，它检查了为系统中的文件和应用程序添加额外保护的较新方法。简要概述了\
  \ Linux 在需要在系统上工作时如何处理管理员权限。\n\n## 查看文件和目录权限\n\nLinux 的核心安全特性是文件和目录权限。Linux 通过为每个文件和目录分配一个所有者，并允许该所有者设置基本安全设置以控制对文件或目录的访问来实现这一点。后续章节将带你了解\
  \ Linux 如何处理文件和目录的所有权，以及你可以分配给 Linux 系统上任何文件或目录的基本权限设置。\n\n### 理解所有权\n\nLinux 使用三级方法来保护文件和目录：\n\
  \n*   **所有者 (Owner)**：在 Linux 系统中，每个文件和目录都分配给单一所有者。Linux 系统管理员可以为文件或目录分配特定的特定权限。\n\
  *   **组 (Group)**：Linux 系统还将每个文件和目录分配给单一的用户组。管理员随后可以为该组分配特定于文件或目录的权限，这些权限与所有者的权限不同。\n\
  *   **其他 (Others)**：此类权限分配给任何既不是所有者也不属于指定用户组的用户账户。\n\n你可以通过向 `ls` 命令添加 `-l` 选项来查看文件或目录的分配所有者和组，如列表\
  \ 15.1 所示。\n\n在列表 15.1 中，第一列 `-rw-rw--` 定义了分配给所有者、组和其他人的访问权限。这将在本章稍后的“控制访问权限](#c015-sec-0007)”节中讨论。列表\
  \ 15.1 中的第三列，`Rich` 或 `Christine` 值显示了分配为文件所有者的用户账户。第四列 `sales` 显示了分配给文件的组。\n\n\
  当用户创建文件或目录时，Linux 系统默认将该用户分配为所有者，并使用该用户所属的主组作为文件的组。你可以使用 Linux 命令更改分配给文件和目录的默认所有者和组。后续章节将展示如何操作。\n\
  \n#### 更改文件或目录所有权\n\nroot 用户账户可以使用 `chown` 命令更改分配给文件或目录的所有者。`chown` 命令的格式如下：\n\n\
  ```chown [options] newowner filenames\n```\n\n`newowner` 参数是要分配给文件或目录的新所有者的用户名，`filenames`\
  \ 是你想更改的文件或目录名称。你可以通过在每个文件或目录名称之间放置空格来指定多个文件或目录：\n\n```\n$ sudo chown Christine\
  \ customers.txt\n$ ls -l\ntotal 12\n-rw-rw-r-- 1 Christine sales 1521 Jan 19 15:38\
  \ customers.txt\n-rw-r--r-- 1 Christine sales 479 Jan 19 15:37 research.txt\n-rw-r--r--\
  \ 1 Christine sales 696 Jan 19 15:37 salesdata.txt\n$\n```\n\n`chown` 命令有一些命令行选项，但大多数都很冷门。对你可能有用的是\
  \ `-R` 选项，它可以递归地更改指定目录下所有文件的所有者。\n\n#### 更改文件或目录组\n\n文件或目录的所有者或 root 用户账户可以使用 `chgrp`\
  \ 命令更改分配给文件或目录的组。`chgrp` 命令使用以下格式：\n\n```chgrp [options] newgroup filenames\n```\n\
  \n\n\n\n`newgroup` 参数是分配给文件或目录的新用户组名称，而 `filenames` 参数是你你想要更改的文件或目录名称。如果你是该文件的所有者，你只能将组更改为你所属的组。root\
  \ 用户账户可以将组更改为系统上的任何组：\n\n```\n $ sudo chgrp marketing customers.txt\n$ ls -l\ntotal\
  \ 12\n-rw-rw-r--  1  Christine  marketing  1521  Jan  19  15:38  customers.txt\n\
  -rw-r--r--  1  Christine  sales      479  Jan  19  15:37  research.txt\n-rw-r--r--\
  \  1  Christine  sales      696  Jan  19  15:37  salesdata.txt\n$\n```\n\n### 控制访问权限\n\
  \n在你确定了文件或目录的所有者和组之后，可以为它们分配特定的权限。Linux 使用三种类型的权限控制：\n\n- **读取 (Read)**：访问存储在文件或目录中的数据的能力\n\
  - **写入 (Write)**：修改存储在文件或目录中的数据的能力\n- **执行 (Execute)**：在系统上运行文件的能力，或列出目录中包含的文件的能力\n\
  \n你可以为每一层保护（所有者、组和其他）分配不同的读取、写入和执行权限。这创建了一组九种不同的权限，分配给 Linux 系统上的每个文件和目录。当你使用 `-l`\
  \ 选项时，这九种权限作为 `ls` 输出的第一列信息出现，如列表 15.1 所示。图 15.1 显示了权限在 `ls` 输出中显示的顺序。\n\n![文件和目录权限的插图描述了所有者、组和其他的读取、写入和执行类别](img/c15f001.png)\n\
  \n图 15.1 `ls` 输出中显示的文件和目录权限\n\n在图 15.1 中，第一个字符表示对象类型。破折号 `-` 表示文件，而 `d` 表示目录。\n\n\
  接三个字符按读取、写入和执行的顺序表示所有者权限。破折号 `-` 表示未设置该权限，而 `r`、`w` 或 `x` 表示设置了读取、写入或执行权限。在列表 15.1\
  \ 的示例中，所有三个文件都使用 `rw-` 作为所有者权限，这意味着所有者具有读取和写入文件的权限，但不能执行（或运行）该文件。这在数据文件中很常见。\n\n\
  第二组三个字符表示文件或目录的组权限。同样，使用读取、写入和执行的顺序，破折号 `-` 表示未设置权限。在对 marketing 组的 `customers.txt`\
  \ 文件进行更改后，`sales`组只能读取 `research.txt` 和 `salesdata.txt` 文件，但 `marketing` 组既可以读取也可以写入\
  \ `customers.txt` 文件。\n\n最后，第三组三个字符表示分配给不是所有者也不是文件或目录所属组成员的用户账户的权限。使用相同的读取、写入和执行顺序。在列表\
  \ 15.1 示例中，系统上的其他用户账户可以读取文件但不能写入或执行它们。\n\nroot 用户账户或文件或目录的所有者可以使用 `chmod` 命令更改分配的权限。\n\
  \n`chmod` 命令的格式可能有些困惑。它使用两种不同的模式来表示所有者、组和其他的读取、写入和执行权限设置。这两种模式都允许你定义相同的权限集，因此没有理由使用其中一种模式而不是另一种。\n\
  \n在**符号模式（symbolic mode）**中，你通过使用字母代码表示所有者 (`u`)、组 (`g`)、其他 (`o`) 或所有 (`a`)，并使用另一个字母代码表示读取\
  \ (`r`)、写入 (`w`) 或执行 (`x`) 权限。如果你想添加该权限，则两个代码之间用加号 (`+`) 分隔；如果想移除权限，使用减号 (`-`)；或者使用等号\
  \ (`=`) 将该权限设为唯一权限。列表 15.2 显示了此示例。\n\n在列表 15.2 中，`chmod` 命令中的 `g-w` 代码表示从 `customers.txt`\
  \ 文件中移除组的写入权限。\n\n你可以组合字母代码以便在单个 `chmod` 命令中进行多次更改，如列表 15.3 所示。\n\n`ug` 代码将更改同时分配给所有者和组，而\
  \ `rwx` 代码分配读取、写入和执行权限。等号表示设置这些权限。\n\n`chmod` 可用的第二种模式称为**八进制模式（octal mode）**。在八进制模式下，九个权限位被表示为三个八进制数，每个数字分别对应所有者、组和其他权限。表\
  \ 15.1 显示了八进制数如何匹配三种符号模式权限。\n\n| 八进制值 | 权限 | 含义 |\n| --- | --- | --- |\n| `0` |\
  \ `---` | 无权限 |\n| `1` | `--x` | 仅执行 |\n| `2` | `-w-` | 仅写入 |\n| `3` | `-wx` | 写入并执行\
  \ |\n| `4` | `r--` | 仅读取 |\n| `5` | `r-x` | 读取并执行 |\n| `6` | `rw-` | 读取并写入 |\n|\
  \ `7` | `rwx` | 读取、写入并执行 |\n\n表 15.1 八进制模式权限\n\n你必须按照正确的顺序指定所有者、组和其的三个八进制值，如列表 15.4\
  \ 所示。\n\n`664` 八进制模式将所有者和组的权限设置为读取和写入 (`6`)，但将其他权限设置为仅读取 (`4`)。你可以从 `ls` 输出中看到结果。这是一种通过单个命令设置文件或目录所有权限的方便方法。\n\
  \n### 探索特殊权限\n\nLinux 使用了三个特殊权限位来控制文件和目录的高级行为。\n\n**设置用户 ID (SUID)** 位用于可执行文件。它告诉\
  \ Linux 内核以文件所有者的权限运行程序，而不是运行程序的用户的账户权限。此功能最常用于必须以 root 用户账户运行以访问系统所有文件的应用程序。\n\n\
  SUID 位在文件所有者的执行权限处用 `s` 表示：`rwsxr-x`。系统假设具有执行权限以运行该文件。如果在一个所有者没有执行权限的文件上设置了 SUID\
  \ 位，则用大写的 `S` 表示。\n\n要为文件设置 SUID 位，在符号模式中向所有者权限添加 `s`，或者在八进制模式中在八进制模式设置的开头包含 `4`：\n\
  \n```\n # chmod u+s myapp\n # chmod 4750 myapp\n```\n\n**设置组 ID (SGID)** 也称为 `GUID`\
  \ 位在文件和目录中的工作方式不同。对于文件，它告诉 Linux 以文件的组权限运行程序文件。它在组执行权限处用 `s` 表示：`rwxrwsr--`。\n\n\
  对于目录，SGID 位帮助我们创建一个多个用户可以共享文件的环境。当目录设置了 SGID 位时，用户在目录中创建的任何文件都将分配该目录的组，而不是用户的组。这样，该组中的所有用户都可以拥有与目录中所有文件相同的权限。\n\
  \n要设置 SGID 位，在符号模式中向组权限添加 `s`，或者在八进制模式中在八进制模式设置的开头包含 `2`：\n\n```\n # chmod g+s /sales\n\
  \ # chmod 2660 /sales\n```\n\n最后，**粘滞位（sticky bit）**用于防止非所有者删除文件，即使他们属于对文件具有写入权限的组。粘滞位在其他执行权限位用\
  \ `t` 表示：`rwxrw-r-t`。\n\n\n\n\n粘位（sticky bit）通常用于组间共享的目录。组组成员对目录中包含的数据文件具有读取和写入权限，但只有文件所有者才能从共享目录中删除文件。\n\
  \n要设置粘位，在符号模式下向所有者权限中添加 `t`，或者在八进制模式下，在八进制模式设置的开头包含一个 `1`：\n\n```\n# chmod o+t /sales\n\
  # chmod 1777 /sales\n```\n\n## 管理默认权限\n\n当用户创建一个新文件或目录时，Linux 系统会为其分配默认的所有者、组和权限。正如预期的那样，默认所有者是创建该文件的用户。默认组是所有者的主组。\n\
  \n`user mask`（用户掩码）功能定义了 Linux 分配给文件或目录的默认权限。用户掩码是一个八进制值，代表从文件的八进制模式 `666` 权限或目录的八进制模式\
  \ `777` 权限中移除的位。\n\n用户掩码值通过 `umask` 命令设置。你可以通过直接在命令行输入该命令来查看当前的 `umask` 设置：\n\n\
  ```\n$ umask\n0022\n$\n```\n\n`umask` 命令的输出显示四个八进制值。第一个八进制值代表分配给文件和目录的 SUID (`4`)、GUID\
  \ (`2`) 和粘位 (`1`) 掩码。接下来的三个八进制值分别掩码所有者、组和其他设置。\n\n掩码是应用于文件或目录权限位上的位运算掩码。掩码中设置的任何位都会从文件或目录的权限中移除。如果某位未设置，则掩码不会发生变化。表\
  \ 15.2 展示了在创建文件和目录时 `umask` 值在实践中如何工作。\n\n| `umask` | 创建的文件 | 创建的目录 |\n| --- | ---\
  \ | --- |\n| `000` | `666 (rw-rw-)` | `777 (rwxrwxrwx)` |\n| `002` | `664 (rw-r--)`\
  \ | `775 (rwxrwxr-x)` |\n| `022` | `644 (rw-r--)` | `755 (rwxr-xr-x)` |\n| `027`\
  \ | `640 (rw-r--)` | `750 (rwxrwx---)` |\n| `077` | `600 (rw-------)` | `700 (rwx------)`\
  \ |\n| `277` | `400 (r--------)` | `500 (r--x------)` |\n\n### 常用 `umask` 值对文件和目录的结果\n\
  \n你可以通过在 Linux 系统上创建新文件和目录来测试这一点：\n\n```\n$ mkdir test1\n$ touch test2\n$ ls -l\n\
  total\ndrwxr-xr-x 2 rich Jan 19 07:08 test1\n-rw-r-- 1 rich Jan 19 07:08 test2\n\
  ```\n\n正如预期的，`022` 的 `umask` 值为 `test2` 文件创建了 `rw-r--`（或八进制 `644`）的默认权限，为 `test1`\
  \ 目录创建了 `rwx-xr-x`（或八进制 `755`）权限（注意权限列表中的目录项以 `d` 开头）。\n\n你可以通过命令行使用 `umask` 命令更改你用户账户的默认\
  \ `umask` 设置：\n\n```\n$ umask 027\n$ touch test3\n$ ls -l test3\n-rw------- 1 rich\
  \ Jan 19 12 test3\n```\n\n新文件的默认权限已更改，以匹配 `umask` 设置。\n\n## 访问控制列表\n\nLinux 基础权限方法有一个缺点，即其具有一定的局限性。你只能为文件或目录的单个组或用户分配权限。在不同组的人对文件和目录需要不同权限的复杂业务环境中，这种方法是不可通的。\n\
  \nLinux 开发人员设计了一种更高级的文件和目录安全方法，称为`访问控制列表 (ACL)`。ACL 允许你指定一个多个用户或组列表以及分配给它们的权限。与基础安全方法一样，ACL\
  \ 权限使用相同的读、写、执行位，但现在它们可以分配给多个用户和组。\n\n要在 Linux 中使用 ACL 功能，你需要使用 `setfacl` 和 `getfacl`\
  \ 命令。`getfacl` 命令允许你查看分配给文件或目录的 ACL，如列表 15.5 所示。如果你只为文件分配了基础安全权限，这些权限仍然出现在 `getfacl`\
  \ 输出中。要为额外的用户或组分配权限，请使用 `setfacl` 命令：\n\n```\nsetfacl [options] filename\n```\n\n\
  `setfacl` 命令允许你使用 `-m` 选项修改分配给文件或目录的权限，或使用 `-x` 选项移除特定权限。你通过三种格式定义`规则`：\n\n```\n\
  user[:]:perms\ngroup[:]:]:perms\nother::perms\n```\n\n要为额外的用户账户分配权限，使用用户格式；对于额外的组，使用组格式；对于其他人，使用其他格式。对于\
  \ `uid` 或 `gid` 值，可以使用数值用户标识符或组标识符或名称。以下是一个示例：\n\n```\n$ setfacl -m g:sales:rw test\n\
  $ ls -l\ntotal 0\n-rw-rw----+ 1 rich rich 0 Jan 19 33 test\n```\n\n此示例为 `test` 文件添加了\
  \ `sales` 组的读写权限。注意 `setfacl` 命令没有输出。当你列出文件时，只显示标准的所有者、组和其他权限，但权限列表中添加了一个加号（`+`）。这表示该文件应用了额外的\
  \ ACL。要查看额外的 ACL，请再次使用 `getfacl` 命令：\n\n```\n$ getfacl test\n# file: test\n# owner:\
  \ rich\n# group: rich\nuser::rw-\ngroup::r--\ngroup:sales:rw-\nmask::rw-\nother::---\n\
  ```\n\n`getfacl` 输出现在显示分配了两个组。默认文件组（`rich`）被分配了读取权限，但现在 `sales` 组对该文件具有读写权限。要移除权限，请使用\
  \ `-x` 选项：\n\n```\n$ setfacl -x g:sales test\n$ getfacl test\n# file: test\n# owner:\
  \ rich\n# group: rich\nuser::rw-\ngroup::r--\nmask::r--\nother::---\n$\n```\n\n\
  Linux 允许允许你在目录上设置默认 ACL，该 ACL 会自动继承到在该目录下创建的任何文件中。这种功能被称为`继承`。\n\n要在目录上创建默认 ACL，以\
  \ `d:` 开头规则，后跟普通规则定义。如下所示：\n\n```\n$ sudo setfacl -m d:g:sales:rw /shared/sales\n\
  ```\n\n此示例为 `/shared/sales` 目录的 `sales` 组分配了读写权限。现在，在该文件夹中创建的所有文件都将自动分配 `sales`\
  \ 组的读写权限。\n\n## 基于上下文的权限\n\n为文件和目录分配权限的原始方法和高级 ACL 方法都称为`强制访问控制 (DAC)` 方法。权限根据文件或目录所有者的决定设置。管理员无法采取任何操作来防止用户向其目录中的所有文件授予完全权限。\n\
  \n为了为 Linux 系统提供完全保护，利用某种类型的`强制访问控制 (MAC)` 方法会有帮助。MAC 方法允许系统管理员根据 Linux 系统中对象的上下文定义安全策略，以覆盖由文件和目录所有者设置的权限。MAC\
  \ 方法为管理员提供了限制访问文件和目录的规则，不仅针对用户，还针对系统上的应用程序。\n\n目前 Linux 中有两种流行的 MAC 实现：\n\n*   适用于基于\
  \ Red Hat 的系统的 SELinux\n\n*   适用于 Ubuntu 系统的 AppArmor\n\n接下来的章节提供了更多关于在你的 Linux\
  \ 环境中使用 SELinux 和 AppArmor 的详细信息。\n\n### 使用 SELinux\n\n`增强型 Linux (SELinux)` 应用程序美国国家安全局\
  \ (NSA) 的项目，自 2.6.x 版本以来已集成到 Linux 内核中。现在它是基于 Red Hat 的 Linux 发行版（如 Fedora、Rocky\
  \ 和 CentOS）的标准部分，也是基于 Debian 的发行版的可选安装项。\n\n\n\n\nSELinux 通过允许你设置策略规则来实施强制访问控制（MAC）安全，这些规则控制\
  \ Linux 系统上不同类型对象之间的访问，包括用户、文件、目录、内存、网络端口和进程。每当用户或进程尝试访问 Linux 系统上的某个对象时，SELinux\
  \ 都会拦截该尝试并根据定义的策略规则对其进行评估。\n\n## 启用 SELinux\n\n`/etc/selinux/config` 文件控制 SELinux\
  \ 的基本运行。你需要设置两个主要选项：\n\n* `SELINUX`：此设置决定 SELinux 的运行模式。将其设置为 `enforcing`（强制模式）以在系统上启用策略规则并阻止任何未经授权的访问。将其设置为\
  \ `permissive`（许可模式）时，SELinux 会监控策略规则并记录任何违反策略的行为，但不会强制执行。`disabled` 设置值则完全禁用 SELinux\
  \ 对系统操作监控。\n* `SELINUXTYPE`：此设置决定执行哪些策略规则。`targeted` 设置是默认值，且仅执行网络守护进程策略规则。`minimum`\
  \ 设置仅对指定的进程执行策略规则。`mls` 设置使用多级安全机制，遵循 Bell–LaPadula 安全控制模型提供高级策略，这是大多数要求高安全性的美国政府和军事环境强制要求的。它使用如机密、未分类和公共等安全分级。`strict`\
  \ 设置对所有守护进程执行策略规则，但不再建议使用。\n\n你也可以通过命令行使用 `setenforce` 工具来更改 SELinux 的状态。然而，你只能使用该工具在强制模式和许可模式之间切换\
  \ SELinux 。要禁用 SELinux，你必须在 SELinux 配置文件中进行更改。要查看 SELinux 的当前模式，请使用 `getenforce`\
  \ 工具：\n\n```\n $ sudo getenforce\nEnforcing\n$\n```\n\n要查看 SELinux 状态的更详细列表，请使用\
  \ `sestatus` 工具：\n\n```\n $ sudo sestatus\nSELinux status:               enabled\n\
  SELinuxfs mount:             /sys/fs/selinux\nSELinux root directory:      /etc/selinux\n\
  Loaded policy name:           targeted\nCurrent mode:                enforcing\n\
  Mode from config file:      enforcing\nPolicy MLS status:           enabled\nPolicy\
  \ deny_unknown status:  allowed\nMemory protection checking     actual (secure)\n\
  Max kernel policy version:   33\n$\n```\n\n启用 SELinux 后，它将开始对一组策略中定义的对象执行访问规则。接下来的章节将解释\
  \ SELinux 策略的工作原理。\n\n## 理解安全上下文\n\nSELinux 为系统上的每个对象都标记了 `security context`（安全上下文）。安全上下文定义了\
  \ SELinux 应用于该对象的策略。安全内容的格式如下：\n\n```\n user:role:type:level\n```\n\n`user` 和 `role`\
  \ 属性仅用于多级安全模式，并且可能非常复杂。在默认的 targeted 安全模式下运行的系统仅使用 `type` 属性设置对象的安全类型，并根据该类型控制访问。`level`\
  \ 属性设置安全敏感级和许可级。在 targeted 安全模式下，它是可选的，主要用于高安全环境。\n\n要查看分配给对象的安全上下文，为常用的 Linux 命令（如\
  \ `id`、`ls`、`ps` 和 `netstat`）添加 `-Z` 选项。例如，要查看用户的安全上下文，请使用以下命令：\n\n```\n $ id -Z\n\
  unconfined_u:unconfined_r:unconfined_t:s0-s0:c0.c1023\n$\n```\n\n`unconfined_u`\
  \ 用户安全上下文意味着该用户账户没有分配特定的安全策略；同样，`unconfined_r` 代表角色，`unconfined_t` 代表类型。`s0-s0:c0.c1023`\
  \ 级安全上下文意味着对象的安全和许可级也没有设置。\n\n要查看文件的安全上下文，请使用此命令：\n\n```\n $ ls -Z test1.txt\nunconfined_u:object_r:user_home_t:s0\
  \ test1.txt\n$\n```\n\n同样，`user` 和 `role` 属性是未限制（unconfined）的，但现在 `type` 属性被设置为\
  \ `user_home_t`。你可以在安全策略中使用此属性来设置每个用户账户 `$HOME` 目录下文件的访问权限。\n\n要检查分配给进程的安全上下文，请使用以下命令：\n\
  \n```\n $ ps -axZ | grep /sbin/auditd\nsystem_u:system_r:auditd_t:s0      700  ?\
  \      S<sl    0:00\n /sbin/auditd\n[...]\n$\n```\n\n`auditd` 所需的进程被设置为 `system_u`\
  \ 用户安全上下文和 `system_r` 角色安全上下文。这些标识表示该进程与系统相关。进程的类型安全上下文不同，这意味着可以使用单独的策略对其进行控制。\n\
  \n`semanage` 工具允许你查看和设置系统中用户账户的安全上下文。对于文件和目录，Linux 系统会在创建它们时根据父目录的安全上下文来设置它们的安全上下文。你可以使用\
  \ `chcon` 或 `restorecon` 工具更改分配给文件的默认安全上下文。\n\n`chcon` 格式如下：\n\n```\n chcon -u newuser\
  \ -r newrole -t newtype filename\n```\n\n`newuser`、`newrole` 和 `newtype` 值定义了你想要分配给指定文件的新用户、角色和类型安全上下文。\n\
  \n`restorecon` 工具将文件或目录的安全上下文恢复为策略中定义的默认设置。你可以使用 `-R` 选项递归地恢复指定目录下所有文件的安全上下文。\n\n\
  ## 使用策略\n\nSELinux 根据策略控制对系统对象的访问。在 targeted 安全模式下，每种策略都定义了特定类型安全上下文内的对象可以访问另一个类型安全上下文内的对象。这被称为\
  \ `type enforcement`（类型强制）。\n\n例如，标记为类型安全上下文 `sshd_t` 的应用程序只允许访问标记为类型安全上下文 `sshd_t`\
  \ 的文件。这限制了应用程序对系统上某些文件的访问。\n\nSELinux 将策略以文本文件的存储在 `/etc/selinux` 目录结构中。例如，所有针对\
  \ targeted 安全模式的策略都在 `/etc/selinux/targeted` 目录下。\n\n创建自己的策略可能会有点复杂。幸运的是，SELinux\
  \ 包含了名为 `modules`（模块）的策略组，你可以将其作为标准的 RPM 包安装。使用 `semodule` 工具可以在你的系统中列出、安装和删除策略模块。\n\
  \n为了让事情更简单，SELinux 使用了一种启用和禁用单条策略的方法，而无需修改策略文件。`Boolean`（布尔值）是一个开关，允许你根据策略名称从命令行启用或禁用策略规则。要查看策略的当前设置，请使用\
  \ `getsebool` 命令：\n\n```\n $ getsebool antivirus_can_scan_system\nantivirus_can_scan_system\
  \ --> off\n$\n```\n\n要查看系统所有的策略，请包含 `-a` 选项，如列表 15.6 所示。\n\n列表 15.6 仅显示 `getsebool`\
  \ 命令的部分输出；在大多数 Red Hat Linux 环境中默认安装了许多不同的策略。\n\n要更改布尔设置，请使用 `setsebool` 命令：\n\n\
  ```\n $  sudo setsebool antivirus_can_scan_system on\n$  getsebool antivirus_can_scan_system\n\
  antivirus_can_scan_system --> on\n$\n```\n\n此设置仅适用于你的当前会话。要使更改永久生效，你必须在命令中添加 `-P`\
  \ 选项。这让你对 SELinux 定义的策略设置拥有完全控制权。\n\n### 使用 AppArmor\n\n基于 Debian 的 Linux 发行版通常使用\
  \ `AppArmor` MAC 系统。AppArmor 不像 SELinux 那么复杂灵活；它只控制应用程序访问的文件和网络端口。\n\n\n\n\nAppArmor\
  \ 也根据策略定义访问权限，但将其称为“配置文件”（profiles）。配置文件在 `/etc/apparmor.d` 目录结构中为每个应用程序定义。通常情况下，每个应用程序包都会安装自己的配置文件。\n\
  \n每个配置文件都是一个文本文件，定义了应用程序允许通信的文件和网络端口，以及对每个项允许的访问权限。配置文件的名称通常引用应用程序可执行文件的路径，并将斜杠替换为点。例如，`mysqld`\
  \ 应用程序的配置文件名为 `usr.sbin.mysqld`。\n\n要确定你的 Linux 系统上 AppArmor 的状态，请使用 `aa-status`\
  \ 命令，如列表 15.7 所示。\n\n列表 15.7 中 `aa-status` 命令的输出显示了所有处于强制（enforce）、投诉（complain）或禁用（disabled）状态的配置。在你安装了\
  \ `apparmor-utils` 软件包后，你就有了几个不同的可用命令来处理 AppArmor 了。你可以使用 `aa-unconfined` 命令查看系统上未定义配置文件的活动网络端口列表：\n\
  \n```\n $ sudo aa-unconfined\n510 /usr/lib/systemd/systemd-resolved not confined\n\
  725 /usr/sbin/avahi-daemon not confined\n795 /usr/sbin/NetworkManager not confined\n\
  1350 /usr/sbin/cupsd confined by '/usr/sbin/cupsd (enforce)'\n$\n```\n\n要关闭特定的配置文件，使用\
  \ `aa-complain` 命令，它会将配置文件于投诉模式：\n\n```\n $ sudo aa-complain /usr/sbin/tcpdump\n\
  Setting /usr/sbin/tcpdump to complain mode.\n$\n```\n\n在投诉模式下，任何违反配置的行为都将被记录但不会被阻止。如果你想完全禁用单个配置文件，请使用\
  \ `aa-disable` 命令：\n\n```\n $ sudo aa-disable /usr/sbin/tcpdump\nDisabling /usr/sbin/tcpdump.\n\
  $\n```\n\n要重新开启配置文件，请使用 `aa-enforce` 命令：\n\n```\n $ sudo aa-enforce /usr/sbin/tcpdump\n\
  Setting /usr/sbin/tcpdump to enforce mode.\n$\n```\n\n虽然 AppArmor 不像 SELinux 那样灵活，但它为你的\
  \ Linux 系统上受攻击的应用程序提供了基础级的安全保护。\n\n## 理解 Linux 用户类型\n\nLinux 中比较令人困惑的话题之一是用户类型问题。在\
  \ Linux 中，并不是所有用户都是平等的，某些用户账户具有不同的用途，因此与其他账户不同的权限。以下章节将讨论不同的 Linux 用户账户类型以及如何在它们之间切换。\n\
  \n### 用户账户类型\n\n虽然在 Linux 中所有用户账户都是使用 `useradd` 工具以相同的方式创建的（参见第 10 章，“管理用户和组](#c010.xhtml_c010)”），但并不是所有用户账户的行为都相同。Linux\
  \ 中有三种基本的用户账户类型：\n\n- **Root**：root 用户账户是系统上的主管理员账户。它通过被分配特殊的用户 ID 值 `0` 来标识。root\
  \ 用户账户拥有访问系统上所有文件和目录的权限，无论分配了任何权限设置。\n- **Standard（标准）**：标准 Linux 用户用于登录系统并执行标准任务，例如运行桌面应用程序或\
  \ shell 命令。标准 Linux 用户通常被分配一个 `$HOME` 目录，拥有存储文件和创建子目录的权限。除非获得文件或目录所有者的许可，否则标准 Linux\
  \ 用户无法访问 `$HOME` 目录之外的文件。大多数 Linux 发行版分配的标准用户用户 ID 大于 1000。\n- **Service（服务）**：服务\
  \ Linux 用户账户用于后台启动的应用程序，例如网络服务如 Apache Web 服务器或 MySQL 数据库服务器。通过将 shadow 文件中的密码值设置为星号（*），这些用户账户受到限制，无法用于登录系统。此外，`/etc/passwd`\
  \ 文件中定义的登录 shell 被设置为 `nologin` 值，以防止访问命令 shell。服务账户的 little ID 通常小于 1000。\n\n###\
  \ 权限提升\n\n虽然 root 用户账户对整个 Linux 系统具有完全访问权限，但以 root 用户账户身份登录以执行系统相关活动通常被认为是一种坏习惯。无法追溯是谁用\
  \ root 用户账户登录的，而且向组织中的多个个人提供 root 用户账户密码可能是危险的。\n\n相反，大多数 Linux 管理员使用权限提升来允许其标准\
  \ Linux 用户账户以 root 管理员权限运行程序。这是通过三个不同的程序实现的：\n\n- `su`：`su` 命令是 `substitute user`（替换用户）的缩写。它允许标准用户账户以另一个用户账户（包括\
  \ root 用户）身份运行命令。要运行 `su` 命令，标准用户必须提供替换用户账户的密码。虽然这解决了知道是谁在执行管理任务的问题，但它没有解决多个人知道\
  \ root 用户账户密码的问题。\n- `sudo`：`sudo` 命令是 `substitute user do`（替换用户执行）的缩写。它允许标准用户账户以另一个用户账户（包括\
  \ root 用户）身份运行任何命令。`sudo` 命令提示用户输入自己的密码以验证其身份。\n- `sudoedit`：`sudoedit` 命令允许标准用户以另一个用户账户（包括\
  \ root 用户）的权限用文本编辑器打开文件。`sudoedit` 命令同样提示用户输入自己的密码以验证其身份。\n\n虽然 `su` 命令有些自言易懂，但\
  \ `sudo` 和 `sudoedit` 命令可能会让人困惑。通过提供自己的用户密码来以管理员权限运行命令似乎有点奇怪。\n\n每个 Linux 系统都使用一个文件来定义哪些用户允许运行\
  \ `sudo` 命令，该文件通常位于 `/etc/sudoers`。`sudoers` 文件不仅包含用户账户列表，还包含允许拥有管理员权限的用户组。有两种用于这些权限的常用用户组。基于\
  \ Debian 的发行版使用 `sudo` 组，而基于 Red Hat 的发行版使用 `wheel` 组（big wheel 的缩写）。作为 `sudoers`\
  \ 设置的一部分，你可以指定用户可以做什么或不能做什么。例如，`NOEXEC` 标签防止用户运行后续命令，例如运行具有管理员权限的 shell，然后从那里运行额外的命令。`PASSWD`\
  \ 标签要求用户在使用 sudo 命令时输入密码，而 `NOPASSWD` 标签则允许他们在不输入密码的情况下使用 sudo——这是一个非常危险的设置选项！\n\
  \n## 限制用户和文件\n\n最后，有两个你应该了解的命令，它们与文件所有权或权限没有关系，而是与用户和文件限制有关。\n\n`ulimit` 命令帮助你限制每个用户账户对系统资源的访问。列表\
  \ 15.8 显示了带有 `-a` 运行 `ulimit` 命令的输出，它显示了用户账户的设置。\n\n当用户账户消耗系统资源时，它会给系统带来负载，但在 CPU\
  \ 时间和内存方面。如果你在多用户 Linux 环境中工作，你可能需要对每个用户账户可以消耗的资源进行限制。这就是 `ulimit` 命令大显身场。表 15.3\
  \ 显示了你可以用于限制用户账户特定资源的命令行选项。\n\n| 选项 | 说明 |\n| --- | --- |\n| `-a` | 列出当前用户账户的限制\
  \ |\n| `-b` | 设置最大套接缓冲区大小 |\n| `-c` | 设置最大核心文件大小 |\n| `-d` | 设置进程的最大数据段大小 |\n| `-e`\
  \ | 设置允许的最大调度优先级 |\n\n\n\n\n\n### 表 15.3](#c015.xhtml_rc015-tbl-3) `ulimit` 命令选项\n\
  \n| 选项 | 描述 |\n| :--- | :--- |\n| `-f` | 设置允许写入的最大文件大小 |\n| `-i` | 设置挂起信号的最大数量 |\n\
  | `-k` | 设置可以分配的 kqueues 最大数量 |\n| `-l` | 设置可以锁定的内存内存 |\n| `-m` | 设置最大驻留集合大小 (RSS)\
  \ |\n| `-n` | 设置打开文件描述符的最大数量 |\n| `-p` | 以 512 KB 为块设置最大管道大小 |\n| `-r` | 设置最大实时调度优先级值\
  \ |\n| `-s` | 设置最大栈大小 |\n| `-t` | 设置用户账户允许的最大 CPU 时间 |\n| `-u` | 设置用户可以同时运行的最大进程数\
  \ |\n| `-v` | 设置用户可用的虚拟内存上限 |\n| `-x` | 设置文件锁的最大数量 |\n| `-P` | 设置用户账户可以登录的伪终端最大数量\
  \ |\n| `-T` | 设置用户可以拥有的最大线程数 |\n\n如表 15.3 所示，通过 `ulimit` 命令，Linux 管理员可以对单个用户账户在系统上的操作实施相当严格的限制。\n\
  \n你还可以对用户对文件和目录的操作设置限制。文件和目录属性定义了文件系统允许或阻止对文件或目录执行的操作。\n\n`chattr` 命令修改赋予文件或目录的属性。`chattr`\
  \ 命令的格式为：\n\n```\nchattr [ mode ] files...\n```\n\n`mode` 选项定义了要设置或取消的属性。表 15.4](#c015.xhtml_c015-tbl-4)\
  \ 定义了 Linux 中提供的不同属性。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| a | 写入时只能以追加模式打开。 |\n|\
  \ A | 文件打开时，不修改文件的访问时间。 |\n| c | 自动压缩磁盘上的文件。 |\n| C | 对于日志文件系统，在写入时时不自动复制文件。 |\n\
  | d | 不使用 dump 程序备份文件。 |\n| D | 所有更改都同步写入磁盘，不进行缓存（仅适用于目录）。 |\n| e | Linux 使用范围区（extents）映射磁盘上的块。\
  \ |\n| E | 文件由文件系统加密。 |\n| F | 应用于目录时，该目录中的所有路径查找均不区分大小写。 |\n| i | 文件无法修改或删除。 |\n\
  | I | 使用哈希树索引目录。 |\n| j | 如果文件系统支持日志记录，则写入文件的数据会先写入日志，然后再写入文件。 |\n| N | 文件包含存储在\
  \ inode 表本身的数据。 |\n| P | 应用于目录时，目录中的文件将继承该目录的项目 ID（project ID）。 |\n| s | 如果文件被删除，其块将被置零并写回磁盘。\
  \ |\n| S | 文件的更改同步写入磁盘，不存储在缓冲区中。 |\n| t | 如果文件末尾包含部分块碎片，它将不会与其他文件合并。 |\n| T | 出于考虑，该目录被视为目录层次结构的顶端。\
  \ |\n| U | 删除时保存文件内容，以实现恢复删除功能。 |\n| V | 对文件应用身份验证。 |\n\n### 表 15.4](#c015.xhtml_rc015-tbl-4)\
  \ Linux 文件和目录属性\n\n要为文件或目录分配属性，可以在属性前加一个加号：\n\n```\n$ sudo chattr +i test1.txt\n\
  $ rm test1.txt\nrm: cannot remove 'test1.txt': Operation not permitted\n$\n```\n\
  \n此示例为文件设置了不可变属性（`i`），使其无法被删除。此特定属性只能由 root 用户账户设置，因此需要使用 `sudo` 命令。设置属性后，文件将无法再删除。\n\
  \n要显示应用于文件或目录的当前属性，请使用 `lsattr` 命令：\n\n```\n$ lsattr test1.txt\n----i---------------\
  \ test1.txt\n$\n```\n\n要移除属性，请在 `chattr` 命令中使用减号：\n\n```\n$ sudo chattr -i test1.txt\n\
  $ lsattr test1.txt\n-------------------- test1.txt\n$ rm test1.txt\n$\n```\n\n练习\
  \ 15.1 将引导你设置一个简单的共享目录，其中多个用户账户可以对文件拥有读/写权限。\n\n## 总结\n\n文件和目录安全是所有 Linux 管理员的主要职责之一。Linux\
  \ 系统提供了多层安全机制，你可以将其应用于文件和目录，以帮助保护其安全。\n\nLinux 为系统上的所有文件和目录分配一组读、写和执行权限。你可以为文件或目录的所有者、Linux\
  \ 系统定义的特定组以及系统上的所有其他用户定义单独的访问设置。这三个访问级别设置和权限的组合，为每个文件和目录提供了九种可能的安全设置。你可以使用 `chmod`\
  \ 命令通过符号模式或八进制模式（数字模式）设置这些设置。\n\n一种更高级的文件和目录安全方法涉及为每个文件和目录设置访问控制列表（ACL）。ACL 可以为多个用户或组定义读、写和执行权限。`setfacl`\
  \ 命令允许你设置这些权限，并使用 `getfacl` 命令查看当前权限。\n\n下一层级的安全涉及设置基于上下文的权限。基于 Red Hat 的 Linux\
  \ 发行版使用 SELinux 程序，允许你设置策略规则，根据使用上下文来控制对文件、目录、应用程序和网络端口的访问。对于基于 Debian 的 Linux 发行版，AppArmor\
  \ 程序为访问文件的应用程序提供了高级安全。\n\nLinux 根据用户类型处理安全性。root 用户账户在 Linux 系统上拥有完全管理员权限，无论任何安全设置，都可以访问任何文件、目录或网络端口。服务用户账户用于启动和运行需要访问限制文件和目录的应用程序。服务用户账户通常无法从终端登录系统，无法打开任何类型的\
  \ shell。最后一种用户账户是标准用户账户。这些账户适用于登录终端并运行应用程序的普通系统用户。\n\n## 考试要点\n\n**描述 Linux 中提供的基本文件和目录安全。**\
  \ Linux 通过三类读、写和执行权限提供基本的文件和目录安全。文件或目录的所有者被分配一组权限，主组分配另一组权限，Linux 系统上的其他所有人被分配第三组权限。你可以分别设置这三类权限，以控制\
  \ Linux 系统中组成员和其他人员的访问权限。\n\n**解释如何修改分配给文件或目录的权限。** Linux 使用 `chmod` 命令为文件和目录分配权限。`chmod`\
  \ 命令使用两种不同的模式来分配权限：符号模式和八进制模式。符号模式使用单个字母来识别所有者（`u`）、组（`g`）、其他人（`o`）和所有人（`a`）类别。随后使用加号、减号或等号表示添加、删除或设置权限。权限也由单个字母表示读（`r`）、写（`w`）或执行（`x`）。在八进制模式下，使用八进制值表示每个类别的三个权限。三个八进制值定义了分配给文件或目录的完整权限集。\n\
  \n\n\n\n\n# 描述 Linux 如何使用访问控制列表 (ACL) 为文件和目录提供额外保护。\nLinux 还允许你为每个文件和目录的多个用户和组设置额外的权限。`setfacl`\
  \ 命令提供了一个接口，允许你为文件或目录的所有者和主组之外的用户或额外组定义读取、写入和执行权限。`getfacl` 命令允许你查看这些额外权限。\n\n#\
  \ 描述 Linux 如何使用基于上下文的权限进一步增强文件和目录的安全性。\n如 SELinux（适用于基于 Red Hat 的发行版）和 AppArmor（适用于基于\
  \ Debian 的发行版）等包提供了基于角色的强制访问控制 (RBMAC)，用于强制覆盖文件或目录所有者所设置权限的安全权限。系统管理员可以定义策略（或 AppArmor\
  \ 中的配置文件），Linux 内将在应用任何标准权限或 ACL 规则后会对其进行评估。你可以细调这些权限，以精确控制系统允许对每个单独文件或目录的什么类型的访问。\n\
  \n## 复习题\n\n你可以在 附录 A 中找到复习题的答案。\n\n1. 文件或目录可以应用哪些权限？（选择三个）\n    1. 读取\n    2. 写入\n\
  \    3. 删除\n    4. 修改\n    5. 执行\n2. Linux 中哪些用户类别可以分配权限？（选择三个）\n    1. Root\n \
  \   2. 所有者\n    3. 组\n    4. 其他\n    5. 部门\n3. Sam 需要允许标准用户以 root 权限运行应用程序。她应该对应用程序文件应用什么特殊权限位？\n\
  \    1. 粘滞位 (sticky bit)\n    2. SUID 位\n    3. GUID 位\n    4. 执行\n    5. 写入\n4.\
  \ 进制模式值 644 对应的符号符号模式权限是什么？\n    1. `rwxrw-r--`\n    2. `-w--w--w-`\n    3. `-w-r--r--`\n\
  \    4. `rwxrw-rw-`\n    5. `rw-r--r—`\n5. Fred 被分配了在公司 Linux 服务器上创建一个新组的任务，现在需要为该组分配文件和目录权限。他应该使用什么\
  \ Linux 工具来更改分配给文件和目录的组？（选择所有适用）\n    1. `chgrp`\n    2. `chown`\n    3. `chmod`\n\
  \    4. `chage`\n    5. `ulimit`\n6. Sally 需要查看其 Linux 服务器上某个文件分配的 ACL 权限。她应该使用什么命令？\n\
  \    1. `ls -Z`\n    2. `ls -l`\n    3. `getfacl`\n    4. `chmod`\n    5. `setfacl`\n\
  7. 哪种 SELinux 模式跟踪策略违反但不强制执行？\n    1. 禁用 (Disabled)\n    2. 强制 (Enforcing)\n   \
  \ 3. 目标 (Targeted)\n    4. 许可 (Permissive)\n    5. MLS\n8. Ted 的任务是记录目录中一组文件分配的\
  \ SELinux 安全上下文。他应该使用什么命令？\n    1. `getsebool`\n    2. `setsebool`\n    3. `ls -Z`\n\
  \    4. `getenforce`\n    5. `ls -l`\n9. Mary 需要以标准用户身份登录 Linux 系统，但需要以管理员权限运行应用程序。她可以使用哪些命令来实现这一点？（选择所有适用）\n\
  \    1. `su`\n    2. `wheel`\n    3. `visudo`\n    4. `sudo`\n    5. `adm`\n10.\
  \ 哪些用户组通常用于分配组成员以管理员身份运行程序的权限？（选择两个）\n    1. `lp`\n    2. `adm`\n    3. `wheel`\n\
  \    4. `sudo`\n    5. `su`\n\n## 第 16 章：查看访问和认证方法\n\n![](img/chaptersquare.png)\n\
  \n妥善保护系统及其数据的部分包括提供适当的访问和认证方法。有很多工具可以提供这些服务。理解它们如何工作以及如何正确地配置它们至关重要。\n\n在本章中，我们将探索各种认证和访问方法、它们的配置文件存储在何处以及如何正确配置它们。我还将涵盖一些重要的加密和认证主题。\n\
  \n## 了解 PAM\n\n可插认证模块 (PAM) 为 Linux 和应用程序提供集中的认证服务。PAM 最初由太阳微系统公司发明，Linux-PAM 项目于\
  \ 1997 年启动。今天，PAM 通常用于所有 Linux 发行版。\n\nPAM 提供了认证库，这些库被编译到应用程序中，成为需要认证的应用程序与认证方法之间的中间环节。它支持许多不同的底层认证库（称为模块），包括：\n\
  \n* **密码 (Password):** PAM 支持使用 `/etc/passwd` 和 `/etc/shadow` 密码文件通过文本密码进行认证。\n\
  * **证书 (Certificate):** PAM 可以使用公密钥基础设施 (PKI) 证书存储来认证用户。\n* **轻量级目录访问协议 (LDAP):**\
  \ PAM 可以连接到组织中的中央 LDAP 服务器支持网络登录。\n* **Kerberos:** PAM 支持 Kerberos 认证系统，该系统在客户端登录系统时向其发放令牌。这些令牌随后可以用于多个网络资源上的认证。此过程通常被称为单点登录\
  \ (SSO)，即你只需要登录一次即可访问网络上的多个资源。\n* **多因素认证 (MFA):** PAM 支持多种类型的 MFA 环境，例如生物识别、令牌、公共密钥基础设施\
  \ (PKI) 以及通过电子邮件发送用户的一次性密码。\n\nPAM 的妙之处在于，程序不需要更改任何内容即可使用不同的认证方法；PAM 通过配置文件控制这一切。需要使用\
  \ PAM 服务的程序是用 PAM 库 `libpam.so` 编译的，并关联 PAM 配置文件。使用 PAM 的应用程序被称为“PAM 感知”。你可以通过 `ldd`\
  \ 命令快速判断一个程序是否为 PAM 感知。列表 16.1 显示了一个片段示例。\n\n在 列表 16.1 中，使用 `ldd` 工具显示程序所有的共享库依赖。输出通过管道传递给\
  \ `grep` 以仅搜索 PAM `libpam.so` 库。在这种情况下，应用程序是用 PAM 库编译的。除了编译了 `libpam.so` 库外，应用程序还需要一个配置文件来使用\
  \ PAM。\n\n### 探索 PAM 配置文件\n\nPAM 配置文件位于 `/etc/pam.d/` 目录。列表 16.2 显示了 Rocky Linux\
  \ 9.4 发行版上的该目录文件。\n\n注意 列表 16.2 中，有一个 `login` 配置文件。该文件在 列表 16.3 中片段显示。\n\nPAM 配置文件中的记录具有特定的语法。该语法如下：\n\
  \n```\n type control-flag pam-module [module-options]\n```\n\n`type` 参数（有时称为 `context`\
  \ 或 `module interface`）指定特定的 PAM 服务类型。四种 PAM 服务类型如 表 16.1 所示。\n\n| 接口 | 服务描述 |\n\
  | --- | --- |\n| `account` | 实现账户验证服务，例如强制执行时间限制以及确定账户是否过期 |\n| `auth` | 提供账户认证管理服务，例如询问密码并验证密码是否正确\
  \ |\n| `password` | 管理账户密码，例如强制最小密码长度并限制错误密码输入次数 |\n| `session` | 为会话开始和结束提供经过身份验证的账户会话管理，例如记录会话的开始和结束时间，并在需要时挂载账户的家目录\
  \ |\n\n表 16.1 `/etc/pam.d/` 配置文件记录中的 `type`\n\n\n\n\n\n`/etc/pam.d/` 配置文件记录中的 `pam-module`\
  \ 部分仅仅是执行任务的模块的文件名。例如，`pam_nologin.so` 显示在 `/etc/pam.d/login` 配置文件中，参见列表 16.3。在模块文件名之后，可以包含额外的模块选项。\n\
  \n指定的 `pam-module` 按照它们在 PAM 配置文件中列出的顺序被调用。这被称为 `module stack`（模块栈）。每个 `pam-module`\
  \ 返回一个状态码，该码通过记录的 `control-flag` 设置进行处理。这些状态码和设置共同创建了一个最终状态，并发送给应用程序。表 16.2 列出了各种控制标志及其对应的响应或操作。\n\
  \n| 控制标志 | 描述 |\n| --- | --- |\n| `include` | 将指定的 PAM 配置文件中的状态码和响应评级添加到最终状态中。 |\n\
  | `optional` | 条件地将模块的状态码添加到最终状态中。如果这是 PAM 服务 `type` 的唯一记录，则包含它。如果不是，则状态码将被忽略。 |\n\
  | `requisite` | 如果模块返回失败状态码，则立即向应用程序返回最终失败状态，而不再运行配置文件中的其余模块。 |\n| `required` |\
  \ 如果模块返回失败状态码，则将向应用程序返回最终失败状态，但只有在配置文件中的其余模块运行完之后。 |\n| `substack` | 强制让特定 `type`\
  \ 包含的配置文件共同工作，向主模块栈返回单个状态码。 |\n| `sufficient` | 如果模块返回成功状态码，且之前的栈模块没有返回失败状态码，则立即向应用程序返回最终成功状态，而不运行配置文件中的其余模块。如果模块返回失败状态码，则将其忽略。\
  \ |\n\n表 16.2 `/etc/pam.d/` 配置文件记录的 `CONTROL-FLAG` 设置\n\n`/etc/pam.d/` 配置文件通过模块栈提供最终状态的过程有点难以理解。为了帮助你理解这一过程，图中展示了一个简化模型参见图\
  \ 16.1。\n\n![卡通描绘了 PAM 模块栈过程，带有 PAM 模块标签以及一个正在为系统访问验证密码的用户](img/c16f001.png)\n\n\
  图 16.1 PAM 模块栈过程\n\n以图 16.1 为指南，想象应用程序主体（用户）需要身份验证以访问系统。此时使用了相应的 `/etc/pam.d/` 配置文件。通过认证模块栈，用户通过各种安全检查点。在每个检查点处，一个守卫（PAM\
  \ 模块）检查不同的要求，确定用户是否具有所需的身份验证，并发放失败或成功卡。最后一个守卫检查状态卡以及他在剪字板上列出的控制标志。这名守卫决定了主体是否可以通过“系统访问”大门。当然，请记住，如果任何检查点被列为\
  \ `requisite` 且用户未通过该检查点，他会被立即踢出去。\n\n### 强制执行强密码\n\n当通过 `passwd` 命令修改密码时，会调用 PAM。这些不同的\
  \ PAM 模块可以帮助强制执行强密码：\n\n* `pam_unix.so`\n* `pam_pwhistory.so`\n* `pam_pwquality.so`\n\
  \n`pam_unix.so` 模块使用存储在 `/etc/passwd` 和 `/etc/shadow` 文件中的账户和密码数据进行认证。\n\n`pam_pwhistory.so`\
  \ 模块根据历史数据库检查用户新输入的密码，以防止用户重复旧密码。密码历史文件 `/etc/security/opasswd` 被锁定了。密码还以加盐和哈希的形式存储，使用与\
  \ `/etc/shadow` 文件中存储密码相同的哈希算法。\n\n要使用 `pam_pwhistory.so` 模块，你必须修改 `/etc/pam.d`\
  \ 中的一个配置文件。在指定 `password` 类型和模块名称的同时，你可以设置表 16.3 中列出的一个或多个 `MODULE-OPTIONS`。\n\n\
  | 模块选项 | 描述 |\n| --- | --- |\n| `enforce_for_root` | 如果使用此选项，root 账户在重置密码时必须检查密码是否重复使用。\
  \ |\n| `remember=N` | 指定记住 `N` 个密码。默认值为 10，最大值为 400。 |\n| `retry=N` | 限制在返回错误之前重复密码条目的数量为\
  \ `N`。默认值为 1。 |\n\n表 16.3 防止密码重复的 `MODULE-OPTIONS`\n\n对于 Ubuntu，你需要将这些配置信息放在 `/etc/pam.d/common-password`\
  \ 和 `/etc/pam.d/common-auth` 文件中。对于其他发行版，你将此配置放在系统默认的 `/etc/pam.d/` 文件 `password-auth`\
  \ 和 `system-auth` 中。\n\nRocky Linux 9.4 `/etc/pam.d/password-auth` 文件的片段示例可见列表 16.4。\n\
  \n在列表 16.4 中，使用了 `grep` 命令来搜索 PAM `password` 类型记录。`pam_pwhistory.so` 模块记录使用了 `requisite`\
  \ 控制标志且没有选项。注意，下一条记录是 `pam_unix.so` 模块的，它使用了 `use_authtok` 选项，这告诉模块使用已经输入的密码而不是再次提示。通常情况下，将密码历史记录直接置于此\
  \ `pam_unix.so` 记录上方是最好的。\n\n现在已经执行了密码历史检查，你可以通过尝试将密码重置为当前密码来测试它。片段示例可见列表 16.5。\n\
  \n使用 `pam_pwquality.so`，你可以为新密码强制执行规则，例如设置最小密码长度。你可以在 `/etc/security/pwquality.conf`\
  \ 文件中配置所需的指令，或者将其作为模块选项传递。该文件的片段示例可见列表 16.6。\n\n在 `pwquality.conf` 文件中，你可以设置几个密码质量指令。表\
  \ 16.4 描述了更常用的。\n\n| 指令 | 描述 |\n| --- | --- |\n| `minlen =N` | 强制新密码的最小字符数为 `N`。（默认值为\
  \ 9，最小允许为 6）。`credit` 设置也会影响此指令。 |\n| `dcredit=N` | 如果 `N` 为正数，则为任何包含的数字的密码 `minlen`\
  \ 设置增加 `N` 个额度。如果 `N` 为负数，密码中必须包含 `N` 个数字。（默认值为 1。） |\n| `ucredit=N` | 如果 `N` 为正数，则为任何包含的大写字母的密码\
  \ `minlen` 设置增加 `N` 个额度。如果 `N` 为负数，密码中必须包含 `N` 个大写字母。（默认值为 1。） |\n| `lcredit=N`\
  \ | 如果 `N` 为正数，则为任何包含的小写字母的密码 `minlen` 设置增加 `N` 个额度。如果 `N` 为负数，密码中必须包含 `N` 个小写字母。（默认值为\
  \ 1。） |\n| `ocredit=N` | 如果 `N` 为正数，则为任何包含的特殊字符（非字母数字）的密码 `minlen` 设置增加 `N` 个额度。如果\
  \ `N` 为负数，密码中必须包含 `N` 个特殊字符。（默认值为 1。） |\n| `difok=N` | 强制新密码中必须有 `N` 个不同的字符。 |\n\
  \n表 16.4 `pwquality.conf` 中常见的密码质量指令\n\n\n\n\n\n为了帮助你理解表 16.4 中的信用策略指令，让我们关注 `dcredit`\
  \ 设置。如果你设置 `dcredit = -3`，这意味着新密码中必须包含三个数字。如果你设置 `dcredit = 3`，这意味着如果新密码中包含三个数字，则密码所需的最小长度\
  \ `minlen` 就会减少三个。\n\n一旦你完成了 `pwquality.conf` 文件的指令设置，你可能需要在正确的 `/etc/pam.d/` 配置文件中启用\
  \ `pam_pwquality.so` 模块。这与处理 `pwhistory.so` 模块的方式类似。\n\n## 锁定账户\n\n当恶意用户试图通过反复尝试特定系统账户的各种密码来获取系统访问权限时，就会发生*暴力破解攻击*。为了防止此类攻击，你可以在用户尝试失败一定次数后锁定其账户。\n\
  \n`pam_tally2.so` 和 `pam_faillock.so` 模块允许你实现账户锁定。选择哪一个取决于你使用的发行版（例如，Ubuntu 默认未安装\
  \ `pam_faillock`）以及你希望采用的各种模块选项。\n\n这两个模块共享三个关键模块选项。它们如表 16.5 所示。\n\n| 模块选项 |  |\n\
  | --- | --- |\n| `deny =` `N` | 在密码输入失败 `N` 次后锁定账户。（默认值为 3。） |\n| `silent` | 不向用户显示任何信息性消息。\
  \ |\n| `unlock_time =` `N` | 账户被锁定 `N` 秒后解锁。如果未设置此选项，则管理员必须手动解锁账户。 |\n\n表 16.5 关键\
  \ `pam_tally2.so` 和 `pam_faillock.so` 模块选项\n\n在当前的 Ubuntu 发行版中，通常使用 `pam_tally2.so`\
  \ 模块更好。但请注意，在当前的 Rocky Linux 发行版上，它可能运行并不良好。在列表 16.7 中，修改后的 `/etc/pam.d/common-auth`\
  \ 文件的片段显示了该模块。\n\n列表 16.7 中的 `pam_tally2.so` 配置允许在锁定账户之前进行两次失败的登录尝试。此外，它不会在一段时间后自动解锁账户。\n\
  \n`pam_tally2` 命令允许你查看失败的登录尝试。列表 16.8 显示了在 Ubuntu 发行版上的示例。\n\n在列表 16.8 中，`imatest`\
  \ 账户有四次登录失败。由于 `pam_tally2.so` 模块选项被设置为 `deny=2`，该账户现在已被锁定。你无法通过 `usermod` 或 `passwd`\
  \ 工具解锁被 PAM 锁定的账户。相反，你必须使用 `pam_tally2` 命令并添加 `-r`（或 `--reset`）以及 `-u`（或 `--user`）选项，如列表\
  \ 16.9 所示。这会清除登录失败计数，使账户不再处于锁定状态。\n\n在当前的基于 Red Hat 的发行版中，通常使用 `pam_faillock.so`\
  \ 模块更好。列表 16.10 显示了修改后的 `/etc/pam.d/system-auth` 文件的片段，其中包含了该模块。\n\n注意在列表 16.10\
  \ 中，有四个 `pam_faillock.so` 模块记录。在这些记录中，有几个尚未涵盖的选项和一个控制标志：\n\n*   `preauth`: 如果存在大量连续的身份验证失败尝试，则阻止用户访问。\n\
  *   `audit`: 如果输入了不存在的用户账户，则记录尝试的账户名。\n*   `[default=die]`: 返回代码被视为失败。立即返回到应用程序。\n\
  *   `authfail`: 将身份验证失败记录到适当的用户计数文件中。\n*   `authsucc`: 识别失败的身份验证尝试是连续还是非连续的。\n\n\
  要让 `pam_faillock.so` 正确工作，你需要修改 `password-auth` 文件，并添加与列表 16.10 文件中完全相同的记录。它也位于\
  \ `/etc/pam.d/` 目录。\n\n`faillock` 命令允许你查看失败的登录尝试。列表 16.11 显示了 Rocky Linux 发行版上的示例。\n\
  \n注意在列表 16.11 中，`faillock` 工具显示了每次失败登录尝试的记录。在这种情况下，由于设置了 `deny=2`，`imatest` 账户被锁定。要解锁账户，再次使用相应的选项使用\
  \ `faillock` 命令。列表 16.11 中的另一个值得注意的项目是 `/var/run/faillock` 目录。当配置了 `pam_faillock.so`\
  \ 模块时，每个用户在该目录下都会接收一个失败登录尝试计数文件。然而，该文件在首次发生登录失败之前才会被创建。\n\n### 限制 Root 访问\n\n最好使用\
  \ `sudo` 命令（参见第 15 章，“应用所有权和权限”）来获取超级用户权限，而不是登录 root 用户账户。更好的方法是通过其 `/etc/shadow`\
  \ 文件记录禁用 root 账户登录。但是，如果你必须登录 root 账户，可以限制执行此操作的位置。\n\n如果配置得当，`pam_securetty.so`\
  \ PAM 模块和 `/etc/securetty` 文件用于限制 root 账户登录。它们通过将 root 登录仅限制在安全 TTY 文件列出的设备上来实现这一点。Ubuntu\
  \ 发行版上该文件的片段列表显示在列表 16.12 中。\n\n要理解 `/etc/securetty` 文件记录，你需要了解 TTY 终端是如何表示的。当你登录到虚拟控制台（通常通过按下\
  \ Ctrl+Alt+Fn 键序列到达）时，你正在登录到一个由 `/dev/tty*` 文件表示的终端。例如，如果你按下 Ctrl+Alt+F2 并登录到 tty2\
  \ 终端，该终端由 `/dev/tty2` 文件表示。注意在列表 16.12 中的 `/etc/securetty` 文件记录仅显示虚拟控制台终端名称（例如 `tty4`），而不显示其设备文件。\n\
  \n当你通过图形界面登录系统时，`who` 或 `w` 命令的输出将在你的进程的 TTY 列中显示类似于 `:0` 的内容。在列表 16.12 中，你也可以找到这些登录的记录。\n\
  \n如果你随后打开一个终端模拟器程序，你正在打开一个 TTY 终端（称为伪 TTY），它由 `/dev/pts/*` 文件表示，例如 `/dev/pts/0`。这些\
  \ TTY 终端*没有*列在 `/etc/securetty` 文件中，因为用户已经登录了图形环境。\n\n`pam_securetty.so` 模块通常位于\
  \ `/etc/pam.d/login` 和/或 `/etc/pam.d/remote` 配置文件中。Ubuntu 发行版上的一个示例显示在列表 16.13 中。\n\
  \n在这个 Ubuntu 发行版中，只有登录 PAM 配置文件包含了 `pam_securetty.so` 模块。注意在列表 16.13 中，用于此模块的 PAM\
  \ 服务*类型*是 `auth`。\n\n## 探索 PKI 概念\n\n\n\n\n\n加密算法使用称为 `keys`（密钥）的特殊数据进行加密解密；它们也被称为\
  \ `cipher keys`（密码密钥）。当与他人共享加密数据时，必须也共享这些密钥中的一些。如果来自可信源的密钥被窃取并替换为来自恶意源的密钥，就会产生问题。`公钥基础设施\
  \ (PKI)` 有助于保护密钥的完整性。PKI 是由一组组件组成的结构，这些组件共同工作证明密钥以及使用密钥的人或设备的真实性和有效性。\n\n### 获取证书\n\
  \nPKI 团队的几个核心成员是`证书机构 (CA)` 结构和 CA 颁发的`数字证书`。在验证了一个人的身份后，`CA` 会向请求者颁发数字证书。数字证书提供了身份证明，并附带了一个嵌入密钥，该密钥现在属于请求者。证书持有者现在可以使用证书的密钥对数据进行加密，并使用证书对其进行签名。这为解密数据的人提供了真实性和有效性，特别是当数据通过网络传输时。\n\
  \n从商业 CA 颁发的数字证书需要投入精力和资金，尽管开源 CA 网站（如 `LetsEncrypt.org`）正在取得进展，它们提供免费的数字证书。如果你只是开发一个新应用程序、处于测试阶段或正在为认证考试做准备，你可以生成并签名自己的证书。这种类型的证书被称为`自签名数字证书`。虽然自签名证书在某些情况下有用，但绝不应用于\
  \ Internet 生产环境（尽管某些组织允许在内网应用程序中使用它们）。\n\n### 发现核心概念\n\n理解密码密钥及其在加密/解密过程中的作用至关重要。密码密钥有两种类型——私钥和公钥/私钥。\n\
  \n- **私钥**：`对称密钥`，也称为私钥或秘密密钥，使用加密算法和`single`（单个）密钥对数据进行加密。明文的加密和解密都使用同一个密钥，并且通常由称为密码短（passphrase）的密码保护。对称密钥加密非常快。遗憾的是，如果你需要他人解密数据，你就必须共享私钥，这是它的主要缺点。\n\
  - **公钥/私钥对**：`非对称密钥`，也称为公钥/私钥对，使用加密算法和`two`（两个）密钥对数据进行加密。通常使用公钥加密数据，使用私钥解密数据。私钥可以使用密码短语保护并保密。密钥对中的公钥旨在共享。\n\
  - 系统用户以及许多应用程序（如 `SSH`）使用非对称密钥。图 16.2 提供了两人之间使用公钥/私钥对的场景。\n\n![四格漫画描绘了 Bob 和 Helen\
  \ 使用公钥和私钥交换加密消息。](img/c16f002.png)\n\n图 16.2 非对称加密示例\n\n注意图 16.2，为了让 Bob 为 Helen\
  \ 加密数据（在这种情况下为消息），他必须使用她的公钥。Helen 而使用她的私钥解密数据。然而，如果 Bob 不确定自己获得的是否 Helen 的公钥，就会发生问题。他可能收到来自名为\
  \ Evelyn 的恶意用户的公钥，并不小心将他的加密消息发送给她。这是一种路径攻击，或中间人攻击。稍后将介绍的数字签名在这种情况下有所帮助。\n\n## 数据安全\n\
  \nPKI 和密码学中的一个重要概念是哈希。`Hashing` 使用单向数学算法将明文转换为固定长度的密文。因为它是单向的，你无法“反哈希”哈希后的密文。通过哈希创建的密文称为`消息摘要`、`hash`、`hash\
  \ value`、`指纹`或`签名`。\n\n加密消息摘要的优势在于它可以用于数据比较。例如，如果哈希对明文 `FileA` 和明文 `FileB` 生成完全相同的消息摘要，那么这两个文件包含完全的数据。这种类型的哈希通常用于网络取证。\n\
  \n注意，简单的消息摘要（称为`非盐（non-salted）`和`非密钥消息摘要`）仅使用明文文件作为输入创建。这种哈希可以通过添加`salt`（盐）来加强，盐是与输入文件一起添加的随机数据，用于保护哈希免受某些恶意攻击。`加盐哈希`用于\
  \ `/etc/shadow` 文件中以保护密码。\n\n`密钥消息摘要`是使用明文文件以及私钥创建的。这种加密哈希类型能够抵抗多种恶意攻击，通常用于 Linux\
  \ 应用程序，如 `SSH`。\n\n## 签名传输\n\n哈希的另一个实际应用是在`数字签名`中。数字签名是一种提供身份验证和数据校验的加密令牌。它仅仅是原始明文数据的消息摘要，然后使用用户的私钥进行加密并随密文一起发送。\n\
  \n密文接收者使用发送者的公钥解密数字签名，以便获得原始消息摘要。接收者还解密密文，然后对其明文数据进行哈希。一旦创建了新的消息摘要，数据接收者就可以将新的消息摘要与发送的消息摘要对比。如果匹配，则数字签名通过验证，这意味着加密数据确实来自发送者。此外，它表明数据在传输过程中没有被修改。\n\
  \n## 使用 SSH\n\n当你通过网络连接到远程服务器时，如果不是通过加密方法，网络嗅探器可以看到发送和接收的数据。Secure Shell (SSH) 通过提供加密通信手段解决了这个问题。它是那些向远程系统安全发送数据的人的事实标准软件。\n\
  \nSSH 使用公钥/私钥对（非对称）进行加密。当两个系统之间建立 SSH 连接时，每个系统都会向对方发送自己的公钥。\n\n## 探索基础 SSH 概念\n\n\
  你通常会在大多数发行版中默认找到 OpenSSH (`www.openSSH.com`)。然而，如果由于某些原因你无法使用基础 SSH 服务，你可能需要检查是否安装了所需的\
  \ OpenSSH 包（软件包管理已在第 13 章，“管理软件](#c013.xhtml_c013)”中介绍过）。表 16.6 显示了本书使用的发行版及其基础\
  \ OpenSSH 服务包名。\n\n| 发行版 | OpenSSH 软件包名 |\n| --- | --- |\n| Rocky | `openssh`, `openssh-clients`,\
  \ `openssh-server` |\n| Fedora | `openssh`, `openssh-clients`, `openssh-server`\
  \ |\n| openSUSE | `openssh` |\n| Ubuntu | `openssh-server`, `openssh-client` |\n\
  \n表 16.6 各种发行版的 OpenSSH 软件包名\n\n要在两个系统之间创建安全的 OpenSSH 连接，使用 `ssh` 命令。基本语法如下：\n\n\
  ```bash\nssh [options] username@hostname\n```\n\n为了建立成功的加密连接，两个系统（客户端和远程）必须安装了 OpenSSH\
  \ 软件并运行了 `sshd` 守护进程。列表 16.14 显示了从 Rocky Linux 系统连接到远程 openSUSE Linux 服务器的示例。\n\n\
  \n\n\n\n在列表 16.14 中，`ssh` 命令没有使用任何选项，包含了远程系统账户用户名，并使用了远程系统的 IPv4 地址而不是其主机名。请注意，如果本地账户名称相同，则你*不需要*使用远程系统账户用户名。然而，在这种情况下，你必须输入远程账户的密码才能访问远程系统。\n\
  \n`OpenSSH` 应用程序在 `~/.ssh/known_hosts` 文件中跟踪以前连接过的主机。这些数据包含了远程服务器的公钥。\n\n如果你过去没有使用过\
  \ `ssh` 登录某个特定的远程主机，你将收到一条类似于列表 16.14 所示的看起来吓人的消息。该消息只是告诉你这个特定的远程主机不在 `known_hosts`\
  \ 文件中。当你在消息提示符处输入 `yes` 时，它会被添加到集合中。\n\n在第 3 章中介绍过的“管理文件、目录和文本”的 `rsync` 实用程序可以使用\
  \ SSH 通过加密隧道快速将文件拷贝到远程系统。若要在 `rsync` 命令中使用 `OpenSSH`，请在目标文件位置之前添加 `username@hostname`。示例在列表\
  \ 16.15 中显示。\n\n在列表 16.15 中，`Project4x.tar` 文件使用 `rsync` 命令和 `OpenSSH` 发送到远程系统。请注意，远程系统的用户名和\
  \ IP 地址后面增加了一个冒号（`:`）。这是为了指定该文件正在被传输到远程系统。如果你没有添加冒号，`rsync` 命令将不会传输文件。它只会简单地将文件重命名为带有\
  \ `Christine@` 的文件名，并同样附上 IP 地址。\n\n冒号之后指定了文件的目标目录。`~` 符号表示将文件存放在用户的家目录中。如果需要，你也可以给文件一个新名称。\n\
  \n你还可以使用 `ssh` 命令向远程系统发送命令。只需将带引号的命令添加到 `ssh` 命令的末尾。示例在列表 16.16 中显示。\n\n在列表 16.16\
  \ 中，该命令检查我们的文件是否已正确传输到远程系统。`Project4x.tar` 文件已成功移动。\n\n## 配置 SSH\n\n检查各种 `OpenSSH`\
  \ 配置文件及其指令是一个好主意。确保你的加密连接配置恰当对于保护远程系统通信至关重要。表 16.7 列出了主要的 `OpenSSH` 配置文件。\n\n| 配置文件\
  \ |  |\n| --- | --- |\n| `~/.ssh/config` | 包含 `OpenSSH` 客户端配置。可能会 `ssh` 命令选项覆盖。\
  \ |\n| `/etc/ssh/ssh_config` | 包含 `OpenSSH` 客户端配置。可能会 `ssh` 命令选项或 `~/.ssh/config`\
  \ 文件中的设置覆盖。 |\n| `/etc/ssh/sshd_config` | 包含 `OpenSSH` 守护进程 (`sshd`) 配置。 |\n\n表\
  \ 16.7 主要 `OpenSSH` 配置文件\n\n如果你需要更改 SSH 配置，知道需要修改哪些配置文件是有关重要的。以下指南可以有所帮助：\n\n* 对于个人用户到远程系统的连接，创建并/或修改客户端的\
  \ `~/.ssh/config` 文件。\n* 对于每个用户到远程系统的连接，创建并修改客户端的 `/etc/ssh/ssh_config` 文件。\n* 对于入站的\
  \ SSH 连接请求，修改服务器端的 `/etc/ssh/sshd_config` 文件。\n\n有多个 `OpenSSH` 配置指令。你可以通过 `ssh_config`\
  \ 和 `sshd_config` 文件的 man 查阅所有指令。然而，对于 `sshd_config` 文件有几个至关重要的指令：\n\n* `AllowTcpForwarding:`\
  \ 允许 SSH 端口转发。（参见第 8 章。）\n* `ForwardX11`: 允许 X11 转发。（参见第 8 章，“比较 GUI](#c008.xhtml_c008)”。）\n\
  * `PermitRootLogin`: 允许 root 用户通过 SSH 连接登录。通常，应设置为 `no`。\n* `Port`: 设置 `OpenSSH`\
  \ 守护进程 (`sshd`) 监听入站连接请求的端口号。（默认是 `22`。）\n\n你可能更改客户端的 `ssh_config` 或 `~/.ssh/config`\
  \ 文件的示例是，当远程系统的 SSH 端口在 `sshd_config` 文件中被修改时。在这种情况下，如果客户端配置文件没有更改以匹配此新端口，远程用户将必须修改其\
  \ `ssh` 命令的选项。此处的示例在列表 16.17 中截取显示。在该列表中，远程 Ubuntu 服务器的 `OpenSSH` 监听在端口 1138，而不是默认端口\
  \ 22，用户必须在使用 `ssh` 命令时使用 `-p` 选项来访问远程服务器。\n\n为了减轻 `OpenSSH` 客户端用户的麻烦，可以为个人用户创建或修改\
  \ `~/.ssh/config` 文件，或者为所有客户端用户修改 `/etc/ssh/ssh_config` 文件。在配置文件中将 `Port` 设置为 `1138`。这使得远程用户和系统管理员都更加方便。\n\
  \n## 生成 SSH 密钥\n\n通常，`OpenSSH` 会搜索其系统的公钥/私钥对。如果没有找到，`OpenSSH` 会自动生成它们。这些密钥对也称为*主机密钥*（host\
  \ keys），存储在 `/etc/ssh/` 目录下的文件中。列表 16.18 显示了 Fedora 发行版上的密钥文件。\n\n在列表 16.18](#c016.xhtml_lis16.18)中，同时显示了私钥和公钥。公钥文件以\
  \ `.pub` 扩展名结尾，而私钥没有文件名扩展。文件名遵循此标准：\n\n```\nssh_host_KeyType_key\n```\n\n密钥文件名中的\
  \ `KeyType` 对应于创建密钥时使用的数字签名算法。你在系统中可能看到的不同类型如下：\n\n* `dsa`\n* `rsa`\n* `ecdsa`\n\
  * `ed25519`\n\n有时你需要手动生成这些密钥或创建新的。为了实现这一点，使用了 `ssh-keygen` 实用程序。在列表 16.19 中，显示了在\
  \ Fedora 系统上使用该程序的截取示例。\n\n`ssh-keygen` 有几个选项。对于列表 16.19 中的命令，仅使用了两个。`-t` 选项设置 `KeyType`，在示例中为\
  \ `rsa`。`-f` 切换指定存储密钥的私钥文件。公钥存储在相同名的文件中，但增加了 `.pub` 文件扩展名。注意此命令会提示密码，该密码与私钥关联。\n\
  \n## 使用 SSH 密钥身份验证\n\n每次执行 SSH 命令都输入密码很麻烦。然而，可以使用密钥代替密码进行身份验证。设置这种身份验证方法需要几个步骤：\n\
  \n1. 登录 SSH 客户端系统。\n2. 生成 SSH 密钥对。\n3. 将公 SSH 密钥安全地传输到 SSH 服务器计算机。\n4. 登录 SSH 服务器系统。\n\
  5. 将公 SSH 密钥添加到服务器上的 `~/.ssh/authorized_keys` 文件中。\n\n让我们详细查看这些步骤。首先，你应该通过你将作为 SSH\
  \ 客户端的账户登录客户端系统。在该系统中，通过 `ssh-keygen` 实用程序生成 SSH 密钥对。你必须指定正确的密钥对文件名，即 `id_TYPE`，其中\
  \ `TYPE` 为 `dsa`、`rsa` 或 `ecdsa`。在客户端创建 SSH 密钥对的示例在列表 16.20 中截取显示。\n\n注意列表 16.20\
  \ 中的密钥文件。在这种情况下，`ssh-keygen` 命令生成了一个私钥（存储在 `~/.ssh/id_rsa` 文件中）和一个公钥（存储在 `~/.ssh/id_rsa.pub`\
  \ 文件中）。需要，你可以输入口短。注意在此情况下，没有输入口短。\n\n\n\n\n一旦在客户端系统上生成了这些密钥，必须将公钥复制到服务器系统。使用安全方法是最好的，而\
  \ `ssh-copy-id` 工具可以让你完成此操作。它不仅会拷贝你的公钥，还会为你将其存储在服务器系统的 `~/.ssh/authorized_keys`\
  \ 文件中。本质上，它通过一条命令就完成了第 3 到第 5 步。列表 16.21 显示了使用该工具的示例。\n\n注意在 列表 16.21 中，首先使用了 `ssh-copy-id\
  \ -n` 命令。`-n` 选项允许你查看哪些密钥将被复制并安装到远程系统中，而无需实际执行操作（干拟运行）。\n\n当下一次在 列表 16.21 中再次执行该命令时，移除了\
  \ `-n` 关。这样，`id_rsa.pub` 密钥文件就会安全地复制到服务器系统，密钥会被安装在 `~/.ssh/authorized_keys` 文件中。注意，当使用\
  \ `ssh-copy-id` 命令时，用户必须输入密码以允许公 ID 密钥复制到服务器。\n\n现在公 ID 密钥已经复制到 SSH 服务器系统上，就可以使用\
  \ `ssh` 命令从客户端系统连接到服务器系统，而无需输入密码。这在 列表 16.22 中同使用 `scp` 命令一起显示。注意，在使用 `scp` 命令拷贝文件时，在\
  \ IP 地址末尾必须添加一个冒号（:）。\n\n### 使用身份验证代理进行认证\n\n通过 SSH 连接到远程系统的另一种方法是通过身份验证代理（authentication\
  \ agent）。使用代理，你只需要输入密码即可发起连接。之后，代理会在代理会话期间记住密码。设置这种身份验证方法需要几个步骤：\n\n1. 登录到 SSH 客户端系统。\n\
  2. 生成 SSH ID 密钥对并设置短语。\n3. 安全地将公 SSH ID 密钥传输到 SSH 服务器计算机。\n4. 登录到 SSH 服务器系统。\n5.\
  \ 将公 SSH ID 密钥添加到服务器系统上的 `~/.ssh/authorized_keys` 文件中。\n6. 启动代理会话。\n7. 将 SSH ID\
  \ 密钥添加到代理会话中。\n\n步骤 1 到 5 与使用 SSH ID 密钥而非密码设置认证的步骤几乎相同。需要注意的一个例外是，在生成用于代理的 SSH ID\
  \ 密钥对时**必须**创建一个短语。列表 16.23 显示了设置用于 SSH 代理的 ECDSA 密钥的示例。\n\n一旦你在远程系统上正确创建了带有短语的密钥对，对其进行了安全传输，并安装到服务器的授权密钥文件中，你就可以使用\
  \ `ssh-agent` 工具启动 SSH 代理会话。会话启动后，通过 `ssh-add` 命令将私 ID 密钥添加到会话中。列表 16.24 显示了此的示例。\n\
  \n注意在 列表 16.24 中，`ssh-agent` 命令后面跟着 `/bin/bash`，这是 Bash Shell。该命令启动了一个运行 Bash Shell\
  \ 的新会话（代理会话）。一旦使用 `ssh-add` 命令并输入私短语添加私 SSH ID 密钥，你就可以连接到远程系统而无需再次输入密码或短语。然而，如果你退出并重新启动代理会话，必须重新添加密钥并重新输入短语。\n\
  \nSSH 代理会话允许你进入一次会话并添加密钥，然后根据需要通过加密的 SSH 方法连接到远程系统，而无需反复输入密码或短语。这不仅提供了安全性，还提供了便利性，这是一种罕见的结合。\n\
  \n## 安全地使用 SSH\n\n你可以采取以下几点来增强系统中 SSH 的安全性：\n\n*   使用与默认端口 22 不同的端口用于 SSH。\n*  \
  \ 禁用通过 SSH 进行 root 登录。\n*   管理 TCP Wrappers。\n\n本章之前提到的一点是，对于任何面向公众的系统，不要使用端口 22\
  \ 作为 SSH 端口。你可以通过修改 `/etc/ssh/sshd_config` 文件中的 `Port` 指令将其更改另一个端口号。请记住，这样做有优缺点。与更改默认\
  \ SSH 端口相比，加强防火墙可能是更好的替代方案。\n\n另一个关键项是禁用通过 SSH 进行 root 登录。默认情况下，任何允许 root 账户登录并启用了\
  \ OpenSSH 的系统都允许通过 SSH 进行 root 登录。由于 root 是标准用户名，恶意攻击者可以使用它进行暴力破解。由于 root 是超级用户账户，它需要额外的保护。\n\
  \n要禁用通过 SSH 进行 root 登录，请编辑 `/etc/ssh/sshd_config` 文件。将 `PermitRootLogin` 指令设置为 `no`，然后重启\
  \ OpenSSH 服务或加载其配置文件。\n\nTCP Wrappers 是一种控制基于网络的服务访问的旧方法。如果某个服务可以使用 TCP Wrappers，它在编译时就会包含\
  \ `libwrap` 库。你可以像 列表 16.25 所示使用 `ldd` 命令来检查支持情况。在 Ubuntu 系统的列表中，你可以看到 SSH 服务可以使用\
  \ TCP Wrappers。\n\nTCP Wrappers 使用两个文件来确定谁可以访问特定服务。这两个文件是 `/etc/hosts.allow` 和 `/etc/hosts.deny`。正如其名称所示，`hosts.allow`\
  \ 文件通常允许访问指定的服务，而 `hosts.deny` 文件通常阻止访问。这些文件具有简单的记录语法：\n\n```\n service: IPaddress…\n\
  ```\n\n这些文件的搜索顺序至关重要。对于入站的服务请求，会发生以下情况：\n\n*   检查 `hosts.allow` 文件中的远程 IP 地址。\n\
  \    *   如果找到，则允许访问，不再进行后续检查。\n*   检查 `hosts.deny` 文件中的远程 IP 地址。\n    *   如果找到，则拒绝访问。\n\
  \    *   如果没有找到，则允许访问。\n\n因为如果远程系统的地址在两个文件中都未找到，则允许访问，因此最好在 `/etc/hosts.deny` 文件中使用\
  \ `ALL` 通配符：\n\n```\n ALL: ALL\n```\n\n这将禁用任何在 `/etc/hosts.allow` 文件中未列出的 IP 地址对所有服务的访问。\n\
  \n记录中的 `IPaddress` 可以是 IPv4 是 IPv6。若要在 `hosts.allow` 文件中列出单个 IP 地址，你可以像下面这样用逗号分隔并指定它们：\n\
  \n```\n sshd: 172.243.24.15, 172.243.24.16, 172.243.24.17\n```\n\n不需要输入每一个允许访问 OpenSSH\
  \ 服务的 IP 地址。你可以指定整个子网。例如，如果你需要允许 C 类网络中的所有 IPv4 地址访问服务器，你只需要指定前三个地址字节，并在后面跟上一个尾随点，如下所示：\n\
  \n```\n sshd: 172.243.24.\n```\n\n## 总结\n\n评估你的系统和用户对适当访问和认证方法的需求，对于确保系统安全至关重要。使用正确的产品并进行正确配置不仅有助于保持系统安全，还能减少用户的用户的挫败感。这也会让你的工作变得更轻松。\n\
  \n## 考试要点\n\n\n\n\n\n## 总结各种 PAM 模块和功能。\n\nPAM 是各种应用程序实现身份验证服务的的一式解决方案。应用程序要使用 PAM，必须使用\
  \ `libpam.so` 模块编译，并拥有关联的 PAM 配置文件。配置文件位于 `/etc/pam.d/` 目录下。应用程序可以使用三种 PAM 模块之一——`pam_unix.so`、`pam_pwhistory.so`\
  \ 和 `pam_pwquality.so`（后者以前称为 `pam_cracklib.so`）来强制执行强密码策略。PAM 还可以提供账户锁定功能以防止暴力攻击。这取决于系统的发行版，通过\
  \ `pam_tally.so` 或 `pam_faillock.so` 模块实现。如果你的环境整合了 LDAP，它也可以与 PAM 集成。用于此目的 PAM\
  \ 模块是 `pam_ldap.so` 模块。\n\n## 描述 PKI 及其组件。\nPKI 保护密钥的完整性。该框架包含了 CA 结构，它可以验证个人或设备的身份并提供签名的数字证书。证书包含一个公钥，并可以发送给他人，以便他们验证公钥是否有效以及是否确实来自证书持有者。提供自签名证书，但应仅用于测试目的。对称密钥加密仅使用私钥对数据进行加密和解密。非对称密钥加密使用公私钥对，通常使用公钥加密而使用私钥解密。在加密之前对数据进行哈希处理，然后对生成的消息摘要进行加密，允许你为传输的加密数据添加数字签名。它提供了数据完整性的手段。\n\
  \n## 解释各种 SSH 功能和实用。\nOpenSSH 通过 `ssh` 命令和 `sshd` 守护提供 SSH 服务。配置 SSH 客户端连接，可以使用\
  \ `ssh` 命令行选项，或者使用 `~/.ssh/config` 或 `/etc/ssh/ssh_config` 文件。对于服务端，配置文件是 `/etc/ssh/sshd_config`。当你首次从客户端到远程\
  \ SSH 服务器建立 SSH 连接时，服务器的密钥信息存储在 `~/.ssh/known_hosts` 文件中。如果需要重新生成密钥或你正在设置无密码登录，可以使用\
  \ `ssh-keygen` 工具创建所需的密钥。当你设置无密码登录时，应该创建两个文件，它们位于 `~/.ssh/` 目录下并命名为 `id_rsa` 和 `id_rsa.pub`。公钥通过\
  \ `ssh-copy-id` 命令复制到 SSH 服务器系统并放置在 `~/.ssh/authorized_keys` 文件中。另一种方法是使用 `ssh-agent`\
  \ 并通过 `ssh-add` 命令添加所需的密钥。\n\n## 复习题\n\n你可以在附录 A 中找到习题的答案。\n\n1. 应用程序要使用 PAM，需要用哪个\
  \ PAM 库编译？\n    1. `ldd`\n    2. `pam_nologin.so`\n    3. `pam_unix.so`\n    4.\
  \ `libpam`\n    5. `pam_cracklib`\n\n2. 下列哪些是 PAM 控制标志？（多选择题）\n    1. `requisite`\n\
  \    2. `required`\n    3. `allowed`\n    4. `sufficient`\n    5. `optional`\n\n\
  3. 下列哪些项会显示失败的登录尝试？（多选择题）\n    1. `tally2`\n    2. `pam_tally2`\n    3. `pam_tally2.so`\n\
  \    4. `pam_faillock`\n    5. `faillock`\n\n4. Leigh 使用 Luke 的公钥加密消息，然后将消息发送给 Luke。接收消息后，Luke\
  \ 用他的私钥解密消息。这描述了什么？（多选择题）\n    1. 对称密钥加密\n    2. 非对称密钥加密\n    3. 公/私钥加密\n    4.\
  \ 密钥加密\n    5. 私钥加密\n\n5. 下列哪项最能描述数字签名？\n    1. 已转换为密文的明文\n    2. 已转换为明文\n    3.\
  \ 一个证明密钥以及使用密钥的人或设备真实性和有效的框架\n    4. 不是由 CA 而是由终端用户名的数字证书\n    5. 原始明文哈希，用私钥加密并随密文一起发送\n\
  \n6. OpenSSH 应用程序在哪个文件中跟踪以前连接的主机及其公钥？\n    1. `~/.ssh/known_hosts`\n    2. `~/.ssh/authorized_keys`\n\
  \    3. `/etc/ssh/known_hosts`\n    4. `/etc/ssh/authorized_keys`\n    5. `/etc/ssh/ssh_host_rsa_key.pub`\n\
  \n7. 下列哪些是 OpenSSH 配置文件？（多选择题）\n    1. `~./ssh/config`\n    2. `/etc/ssh/ssh_config`\n\
  \    3. `/etc/ssh/sshd_config`\n    4. `/etc/sshd/ssh_config`\n    5. `/etc/sshd/sshd_config`\n\
  \n8. 下列哪些文件可能涉及使用 SSH 密钥身份验证？\n    1. `/etc/ssh/ssh_host_rsa_key`\n    2. `/etc/ssh/ssh_host_rsa_key.pub`\n\
  \    3. `~/.ssh/id_rsa_key`\n    4. `~/.ssh/id_rsa_key.pub`\n    5. `~/.ssh/id_rsa`\n\
  \n9. 关于 TCP Wrappers，以下哪项是正确的？（多选择题）\n    1. 首先查询 `/etc/hosts.allow` 文件。\n    2.\
  \ `/etc/hosts.allow` 文件应包含 `ALL: ALL` 以提供最佳安全性。\n    3. 如果应用程序使用 `libwrap` 库编译，则它可以使用\
  \ TCP Wrappers。\n    4. 远程系统的 IP 地址可以单独列出，也可以作为整个子网列出。\n    5. 许多发行版认为 TCP Wrappers\
  \ 已时，应该使用防火墙。\n\n10. 哪个 PAM 库允许你限制登录尝试次数以防止暴力攻击？\n    1. `pam_pwhistory.so`\n  \
  \  2. `pam_pwquality.so`\n    3. `pam_tally2.so`\n    4. `pam_unix.so`\n    5. `pam_cracklib.so`\n\
  \n# 第 17 章\n\n## 实现日志服务\n\n![](img/chaptersquare.png)\n\nLinux 系统在运行时发生了很多事情。作为\
  \ Linux 管理员，你的工作部分就是知道确切发生了什么，并在问题出现时留意。完成该任务的主要工具是日志服务。所有 Linux 发行版都实现了某种日志服务，用于跟踪系统事件并将其存储在日志文件中。本章探讨了\
  \ Linux 发行版中最常用的两种日志方法：`rsyslog` 和 `systemd-journald`。首先，本章解释了 Linux 日志原理，帮助你了解日志的本质。然后本章讨论了\
  \ `rsyslog` 和 `systemd-journald` 生成日志的方法。最后，本章简要查看了一些用于 Linux 系统远程监控的新型工具。\n\n##\
  \ 理解日志的重要性\n\n所有 Linux 发行版都实现了某种日志方法。日志将指示发生了什么事件以及何时发生的短消息重定向到用户、文件甚至是远程主机进行存储。如果出现问题，Linux\
  \ 管理员可以查看日志条目来帮助确定问题原因。\n\n本节讨论了 Linux 中如何实现日志的基础，并展示了你在处理各种 Linux 发行版时可能遇到的主要的日志包。\n\
  \n## syslog 协议\n\n在 Unix 早期，使用了许多种日志方法来跟踪系统和应用事件。应用程序使用不同的日志方法，使得系统管理员难以排排除故障。\n\
  \n在 20 世纪 80 年代中期，Eric Allman 定义了一个名为 `syslog` 的协议，用于记录其 Sendmail 邮件程序的事件。syslog\
  \ 协议迅速成为 Unix 记录系统和应用事件的标准，并进入了 Linux 世界。\n\n\n\n\n\nsyslog 协议之所以如此流行，是因为它定义了一种标准消息格式，规定了事件的时间戳、类型、严重程度和细节。该标准可以被操作系统、应用程序甚至产生错误的设备使用。\n\
  \n事件的类型被定义为 `facility`（设施）值。`facility` 定义了生成事件消息的实体，例如系统资源或应用程序。表 17.1 列出了 syslog\
  \ 协议中定义的 facility 值。\n\n| 代码 | 关键字 | 描述 |\n| --- | --- | --- |\n| 0 | `kern` | 由系统内核生成的消息\
  \ |\n| 1 | `user` | 由用户事件生成的消息 |\n| 2 | `mail` | 来自邮件应用程序的消息 |\n| 3 | `daemon` |\
  \ 后台运行系统应用程序的消息 |\n| 4 | `auth` | 安全或认证消息 |\n| 5 | `syslog` | 由日志应用程序本身生成的消息 |\n\
  | 6 | `lpr` | 打印机消息 |\n| 7 | `news` | 来自新闻应用程序的消息 |\n| 8 | `uucp` | 来自 Unix-to-Unix\
  \ 拷贝程序的消息 |\n| 9 | `cron` | 由 `cron` 任务调度器生成的消息 |\n| 10 | `authpriv` | 安全或认证消息 |\n\
  | 11 | `ftp` | 文件传输协议应用程序消息 |\n| 12 | `ntp` | 网络时间协议应用程序消息 |\n| 13 | `security`\
  \ | 日志审计消息 |\n| 14 | `console` | 日志告警消息 |\n| 15 | `solaris-cron` | 另一个调度守护进程消息类型\
  \ |\n| 16–23 | `local0–local7` | 本地定义的消息 |\n\n表 17.1 syslog 协议 facility 值\n\n从表\
  \ 17.1 中可以看出，syslog 协议涵盖了 Linux 系统上可能出现的许多不同类型的事件。\n\n每个事件还被标记了一个 `severity`（严重程度）。`severity`\
  \ 值定义了消息对系统健康状况有多重要。表 17.2 显示了 syslog 协议定义的严重程度值。\n\n| 代码 | 关键字 | 描述 |\n| --- |\
  \ --- | --- |\n| 0 | `emerg` | 导致系统不可用的事件 |\n| 1 | `alert` | 需要立即关注的事件 |\n| 2 |\
  \ `crit` | 关键但不需要立即关注的事件 |\n| 3 | `err` | 允许系统或应用程序继续的错误错误 |\n| 4 | `warning` |\
  \ 系统或应用程序中的非正常警告状态 |\n| 5 | `notice` | 正常但重要的状态消息 |\n| 6 | `info` | 来自系统的信息性消息 |\n\
  | 7 | `debug` | 给开发者的调试消息 |\n\n表 17.2 syslog 协议严重程度值\n\n将 facility 和 severity 代码与简短的信息性消息结合，就提供了足够的日志信息，可以排查\
  \ Linux 中的几乎任何问题。\n\n多年来，Linux 系统有了许多开源日志项目。接下来的章节描述了两个最流行的：`rsyslog` 和 `systemd-journald`。\n\
  \n## 使用 `rsyslog` 进行基础日志\n\n`rsyslog` 使用原始 syslog 协议的所有功能，包括配置格式和日志操作。它是作为旧版 Linux\
  \ 系统使用的原始 `syslogd` 程序的改进而创建的。本节将引导你如何配置 `rsyslog` 日志应用程序，以及在哪里找到它生成的常用日志文件。\n\n\
  ## 配置\n\n`rsyslog` 软件包使用 `rsyslogd` 程序替代原始的 `syslogd` 程序。开发者声称 `r` 代表 `rocket fast`（极速），因为日志记录速度是该项目的重点。它监控事件并按照指示记录它们，使用\
  \ `/etc/rsyslog.conf` 配置文件定义监听哪些事件以及如何处理它们。许多 Linux 发行版还使用 `/etc/rsyslog.d` 目录来存储单独的配置文件，这些文件作为\
  \ `rsyslog.conf` 配置的一部分被包含进来。这允许不同的应用程序定义自己的日志设置。\n\n配置文件包含规则，定义了程序如何处理接收来自系统、内核或应用程序的\
  \ syslog 事件。`rsyslogd` 规则的格式如下：\n\n```\nfacility.priority action\n```\n\n`facility`\
  \ 条目使用标准 syslog 协议 facility 关键字之一。`priority` 条目使用 syslog 协议定义的严重程度关键字，但有一个不同。当你定义严重程度时，`syslogd`\
  \ 会记录所有该严重程度或更高（代码值更低）的事件。因此，条目\n\n```\nkern.crit\n```\n\n记录所有严重程度为 critical、alert\
  \ 或 emergency 的内核事件消息。要仅记录具有特定严重程度的消息，请在 priority 关键字之前使用等等号：\n\n```\nkern.=crit\n\
  ```\n\n你也可以对 facility 或 priority 使用通配符。条目\n\n```\n *.emerg\n```\n\n记录所有紧急 级别的事件。\n\
  \n`action` 条目定义了 `rsyslogd` 应该对接收到的 syslog 消息做什么。你有六种操作选项可供：\n\n*   转发到普通文件\n* \
  \  将消息管道传输到应用程序\n*   在终端或系统控制台上显示消息\n*   将消息发送到远程主机\n*   将消息发送给用户列表\n*   将消息发送给所有登录用户\n\
  \n列表 17.1 显示了 Ubuntu 24.04 系统的配置文件条目，可以在 `/etc/rsyslog.d/50-default.conf` 文件中找到。\n\
  \n列表 17.1 中第一个条目定义了一个处理所有 `auth` 和 `authpriv` facility 类型消息的规则。这表明你可以通过逗号分隔指定多个\
  \ facility 类型。该规则还对优先级使用了通配符，因此所有严重程度都会被记录。此规则指示所有安全事件消息将记录到 `/var/log/auth.log`\
  \ 文件。\n\n第二个条目定义了一个处理所有事件（`*.*`）但安全事件（`.none` 优先级）的规则。事件消息被发送到 `/var/log/syslog`\
  \ 文件。文件名前的减号告诉 `rsyslogd` 不要每次写入后同步文件，从而提高性能。缺点是，如果系统在下次正常系统同步之前崩溃，可能会丢失事件消息。\n\n\
  `kern.*` 条目定义了一个将所有内核事件消息存储在单独日志文件中的规则，位于 `/var/log/kern.log` 文件。这在 Linux 发行版中已成为某种标准。\n\
  \n`*.emerg` 条目定义了一个处理所有紧急事件的规则。`omusrmsg` 命令指示将事件消息发送到系统上的用户账户。通过指定通配符，此规则将所有紧急事件消息发送给系统上的所有用户。\n\
  \n作为对比，列表 17.2 显示了 Rocky Linux 9.4 系统的 `rsyslogd` 配置文件条目。\n\n注意基于 Red Hat 的系统使用\
  \ `/var/log/messages` 文件存储信息消息，使用 `/var/log/secure` 文件存储安全消息。\n\n## 创建日志\n\n如果你在\
  \ Linux 系统上创建并运行脚本（参见第 25 章，“部署 Bash 脚本](#c025.xhtml_c025)”），你可能想记录你自己的应用程序事件。你可以使用\
  \ `logger` 命令行工具做到这一点：\n\n```\nlogger [-isd] [-f file] [-p priority] [-t tag] [-u\
  \ socket] [message]\n```\n\n\n\n\n\n`-i` 选项指定创建日志条目的程序的进程 ID (PID)，并作为事件消息的一部分。`-p`\
  \ 选项允许你指定事件优先级。`-t` 选项允许你指定一个添加到事件消息的标签，以帮助在日志文件中更容易找到该消息。你可以在命令行中以文本形式指定消息，也可以使用\
  \ `-f` 选项通过文件指定。`-d` 和 `-u` 选项是将事件消息发送到网络的高级选项。`-s` 选项将事件消息发送到标准错误输出。\n\n在脚本中使用\
  \ `logger` 的示例所示：\n\n```\n $ logger This is a test message from rich\n```\n\n在 Rocky\
  \ 系统上，你可以查看 `/var/log/messages` 文件的末尾查看日志条目：\n\n```\n $ sudo tail /var/log/messages\n\
  ...\nNov 22 19:16:05 localhost rich[3104]: This is a test message from Rich\n$\n\
  ```\n\n注意，`rsyslogd` 为消息添加了时间戳、主机名和用户账户。这是一个非常棒的排错工具！\n\n## 查找事件消息\n\n通常，大多数 Linux\
  \ 发行版在 `/var/log` 目录下创建日志文件。取决于 Linux 系统的安全性，某些日志文件所有人可读的，但大多数可能不是。\n\n如列表 17.1\
  \ 和 列表 17.2 所示，大多数 Linux 发行版为不同类型的事件消息创建单独的日志文件，尽管它们的日志文件名并不总是一致。\n\n单个应用程序通常在 `/var/log`\
  \ 目录下拥有独立的目录，用于存储自身的应用程序事件消息，例如用于 Apache Web 服务器的 `/var/log/apache2`。\n\n由于 `rsyslogd`\
  \ 日志文件是文本文件，你可以使用 Linux 中提供的任何标准文本工具，如 `cat`、`head`、`tail`，当然还有 `vi` 来查看它们。管理员的一个常用技巧是使用\
  \ `tail` 命令时配合 `-f` 选项。这会显示日志文件的最后几行，然后监控该文件的任何新条目并同样显示这些出来。\n\n## 使用 systemd-journald\
  \ 进行日志记录\n\n`systemd` 系统服务包包含了用于日志记录的 `systemd-journald` 日志工具。注意，我称之为日志工具而非日志记录工具。`systemd-journald`\
  \ 程序使用它自己的存储事件消息的方法，这与 syslog 协议规定的方式完全不同。\n\n本节讨论了如何使用 `systemd-journald` 程序在你的\
  \ Linux 系统上跟踪事件消息。\n\n## 配置\n\n`systemd-journald` 服务从 `/etc/systemd/journald.conf`\
  \ 文件读取配置。当你检查此文件时，你会发现没有定义任何规则，只有控制应用程序如何运行的设置：\n\n* `Storage` 设置决定了 `systemd-journald`\
  \ 如何存储事件消息。当设置设置为 `auto` 时，它将查找 `/var/log/journal` 目录并将事件消息存储在那里。如果该目录不存在，它会将事件消息存储在时的\
  \ `/run/log/journal` 目录中，该目录在系统关闭时会被删除。你必须手动创建 `/var/log/journal` 目录以便持久存储事件消息。如果你将\
  \ `Storage` 设置为 `persistent`，`systemd-journald` 将自动创建该目录。\n* `Compress` 设置决定了是否压缩日志文件。\n\
  * 有几个文件维护设置可以控制日志允许使用的空间大小，以及根据时间或文件大小频繁地拆分日志文件进行归档。\n* `ForwardToSyslog` 设置决定了\
  \ `systemd-journald` 是否应将收到的消息转发到运行在系统上的单独 syslog 程序（如 `rsyslogd`）。这提供了两层日志记录能力。\n\
  \n有许多设置允许你精确自定义 `systemd-journald` 在你系统中的工作方式。要查看所有设置的完整列表和解释，请在命令行提示符输入 `man journald.conf`。\n\
  \n## 查看日志\n\n`systemd-journald` 程序并不在文本文件中存储日志条目。相反，它使用自己的二进制文件格式，类似于一个数据库。虽然这使得查看日志条目变得稍微困难，但它为快速搜索特定事件条目提供了便利。\n\
  \n`journalctl` 程序是我们日志文件的接口。`journalctl` 命令的基本格式如下：\n\n```\n journalctl [options]\
  \ [matches]\n```\n\n`options` 控制由匹配项返回的数据显示。表 17.3 列出了可用的选项。\n\n| 选项 | 描述 |\n| ---\
  \ | --- |\n| `-a` | 显示所有数据字段 |\n| `-e` | 跳转到日志末尾并使用分页器实用显示条目 |\n| `-l` | 显示所有可打印的数据字段\
  \ |\n| `-n` `number` | 显示最近的 `number` 条日志条目 |\n| `-r` | 反转输出中日志条目的顺序 |\n\n表 17.3\
  \ `journalctl` 命令选项\n\n`matches` 参数定义了要显示什么类型的日志条目。表 17.4 列出了可用的匹配项。\n\n| 匹配 | 描述\
  \ |\n| --- | --- |\n| `Fields` | 匹配日志中的特定字段 |\n| `Kernel` | 仅显示内核日志条目 |\n| `PRIORITY=`value`\
  \ | 仅匹配指定优先级的条目 |\n| `_UID=`userid` | 仅匹配由指定用户 ID 创建的条目 |\n| `_HOSTNAME=`host` |\
  \ 仅匹配来自指定主机的条目 |\n| `_TRANSPORT=`trans` | 仅匹配通过指定传输方法接收的条目 |\n| `_UDEV_SYSNAME=`dev`\
  \ | 仅匹配从指定设备接收的条目 |\n| `OBJECT_PID=`pid` | 仅匹配由指定应用程序进程 ID 创建的条目 |\n\n表 17.4 `journalctl\
  \ matches` 参数\n\n当你要在日志中查找特定事件条目时，`journalctl` 命令非常好；它允许你使用 matches 过滤事件并使用 options\
  \ 确定如何显示它们，如列表 17.3 所示。\n\n这使得挖掘日志文件变得简单得多！\n\n## 监控 Linux 系统\n\n如今，Linux 管理员团队负责几十台甚至数百台\
  \ Linux 服务器并不罕见。每天尝试读取每台服务器的日志文件几乎是一项无法完成的任务。幸运的是，有工具可以帮助。\n\n*日志聚合*（Log aggregation）是将多个服务器的日志条目合并到单一位置的过程。日志聚合有两种基本方法：\n\
  \n* 在代理导向的方法中，被监控的服务器在后台运行一个程序（称为代理），它在日志错误事件发生时将其推送到中心位置。\n* 在无代理的方法中，中心位置服务器按照预定的间隔轮询每个被监控的服务器以寻找错误事件。\n\
  \n聚合日志数据有许多不同的方法。以下是最流行的两种：\n\n* **简单网络管理协议 (SNMP)：** SNMP 可以用于代理导向的方法也可以用于无代理的方法。在代理导向的方法中，你必须在被监控的服务器上配置\
  \ SNMP 程序以查找特定事件（称为陷阱），当它们发生时，SNMP 程序会将事件转发到中心服务器。在无代理的方法中，中心服务器轮询被监控服务器特定条件，这些条件定义在管理信息库\
  \ (MIB) 中。不同的设备和操作系统使用不同的 MIB 定义来监控性能和错误。\n\n\n\n\n\n*   **Webhooks**: Webhooks\
  \ 是一种简单的应用程序接口（API），使用 HTTP 和 JSON 等通用网络协议进行通信。中央监控客户端向被监控的服务器发送 HTTP 请求，服务器随后以\
  \ JSON 文件格式返回请求的数据。这种方法常用于 DevOps 环境（请参 第 31 章，“编排环境”），），用于监控运行在多台服务器上的应用程序。\n\n\
  组织通常有跟踪应用程序可用性的服务需求，使得服务器监控成为必选项。服务监控世界中需要了解的关键术语如下：\n\n*   **服务水平协议 (SLA)**：服务提供者与客户之间的合同，概述了服务描述、预期性能指标、提供者的责任以及在未达到指标时可能涉及的惩罚。\n\
  *   **服务水平目标 (SLO)**：定义要监控的指标（如应用程序运行时间或延迟）、预期的目标水平以及报告方法。\n*   **服务水平指标 (SLI)**：系统中可测量的特征，用于判断是否满足了\
  \ SLO，例如 CPU 负载和网络负载。\n\n练习 17.1 将引导你了解如何实时监控系统日志，以及如何在向 Linux 系统的日志设施发送消息时进行观察。\n\
  \n## 总结\n\n记录发生在 Linux 系统或应用程序上的日志事件对于排排除故障至关重要。Linux 系统采用了 syslog 协议来处理事件消息。syslog\
  \ 协议定义了事件类型（称为“设施”，facility）和事件严重性（severity）。这有助于你确定哪些事件是需要处理的，哪些仅仅是信息性的。\n\n`rsyslogd`\
  \ 日志应用程序使用 syslog 协议记录系统和应用程序事件。`/etc/rsyslogd.conf` 配置文件控制记录哪些事件以及如何记录。`rsyslogd`\
  \ 应用程序可以将事件记录到文件、应用程序、远程主机、终端，甚至直接发送给用户。\n\nLinux Systemd 服务包还包含其自己的事件记录方法，称为 `journaling`（日志）。`systemd-journald`\
  \ 应用程序监控系统和应用程序的所有事件，并将它们发送到一个特殊的日志文件中。`systemd-journald` 的运行由 `/etc/systemd/journald`\
  \ 配置文件控制。你必须使用 `journalctl` 应用程序读取存储在日志文件中事件。\n\n监控 Linux 服务器可能是一项全职工作，但也有工具可以提供帮助。SNMP\
  \ 程序提供了从中央服务器轮询多台服务器的方法，或让被监控服务器将错误事件陷阱（traps）发送到中央服务器。Webhooks 为应用程序提供了轻松监控远程服务器和应用程序状态的\
  \ API。\n\n## 考试重点\n\n**描述大多数 Linux 日志应用程序使用的日志协议。** syslog 协议是大多数 Linux 日志应用程序的事实标准。它使用设施代码（facility\
  \ code）来识别事件类型，并使用严重性（severity）定义事件消息的重要性。`rsyslogd` 应用程序使用 syslog 协议来管理 Linux 中的系统和应用程序事件。最近，`systemd-journald`\
  \ 日志协议变得更加流行，并用于大多数现代 Linux 系统。\n\n**描述 `rsyslogd` 应用程序如何将事件重定向到特定位置。** `rsyslogd`\
  \ 应用程序使用 `/etc/rsyslogd.conf` 配置文件定义处理事件的规则。每个规则指定了 syslog 设施和严重性以及要执行的操作。匹配设施且优先级高于或等于定义的严重性的事件将发送到定义的操作中。该操作可以是将事件消息发送到日志文件、将消息传递给应用程序，或将事件消息发送到远程主机或系统上的用户。\n\
  \n**解释 Systemd 服务如何使用不同的方法记录事件。** Systemd 服务包使用 `systemd-journald` 应用程序，它不使用 syslog\
  \ 协议记录日志事件。相反，`systemd-journald` 创建了自己的二进制日志文件来存储事件消息。二进制日志文件经过索引，以便更快地搜索事件。`journalctl`\
  \ 应用程序提供了向日志文件发送搜索查询并显示结果的接口。\n\n**解释如何远程监控多个 Linux 服务器。** 简单网络管理协议（SNMP）和 Webhooks\
  \ 是监控远程 Linux 服务器状态的两种方法。SNMP 是一种常用的网络协议，使用管理信息库（MIB）定义来定义特定操作系统或设备监控的服务器事件。或者，SNMP\
  \ 陷阱（traps）允许服务器将事件数据发送到中央服务器进行记录。Webhooks 提供了应用程序接口（API），允许其他程序监控应用程序状态。\n\n##\
