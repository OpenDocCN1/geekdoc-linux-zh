  \ Plasma` 的文件管理器？\n    1. `Nautilus`\n    2. `Plasmoid`\n    3. `Dolphin`\n    4.\
  \ `Kwin`\n    5. `Nemo`\n\n5. 在带有旧 CPU 和小内存的旧桌面电脑上，你应该使用哪个桌面管理器？\n    1. `Xfce`\n\
