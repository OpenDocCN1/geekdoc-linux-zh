  \    2. `ping`\n    3. `ip neigh`\n    4. `dig`\n    5. `traceroute`\n\n3. Scott\
  \ 先生制定了一个问题原因理论，认为路由器被流量饱和，并且正在丢弃队列中的 TCP 数据包。他应该使用哪种工具来测试这一理论？（选择所有项）\n    1. `mtr`\n\
