  \    1. 当开启或关闭 `Caps Lock` 或 `Num Lock` 键时会发出声音。\n    2. 一个朗读 GUI 的程序，例如 `Orca`。\n\
  \    3. 修改光标闪烁频率，以便于在屏幕上定位光标。\n    4. 输出到 `Orca` 屏幕阅读器提供的可刷新盲文显示器。\n    5. 将屏幕或屏幕部分放大到不同的放大倍数。\n\
  \n7. 一位在 Linux 服务器上编程的盲人同事他的盲文显示设备突然出现奇怪的问题。你确定需要重启盲文服务。假设相应的 `systemd` 单元可用，你会使用哪个命令？\n\
  \    1. `systemctl restart braille`\n    2. `systemctl reload braille`\n    3. `systemctl\
  \ restart brailled`\n    4. `systemctl restart brltty`\n    5. `systemctl reload\
  \ brltty`\n\n8. 下列哪项最能描述慢速键辅助功能设置？\n    1. 一种键盘选项，修改按键必须按下多长时间才能被确认\n    2. 一种键盘选项，将键盘修饰键（如\
  \ `Ctrl` 和 `Shift`）设置为保持按下状态，直到按下下一个键为止\n    3. 一种键盘选项，修改按键必须按下的时间并定义确认按键重复的延迟\n\
  \    4. 一种键盘选项，设置主键在配合鼠标点击时按下以模拟鼠标右键\n    5. 一种键盘选项，在 UI 上显示一个视觉键盘，可以通过鼠标或其他指向设备进行操作以模拟击键\n\
  \n9. 下列哪项与 Linux 操作系统通信以传输 UI 愿望和需求？\n    1. 窗口管理器\n    2. 显示管理器\n    3. 桌面环境\n\
  \    4. Windows 服务器\n    5. 显示服务器\n\n10. 关于合成器，以下哪项是正确的？（选择所有适用项。）\n    1. 合成器安排窗口内的显示元素以创建屏幕图像。\n\
  \    2. `Wayland` 是一个合成器。\n    3. `Mutter` 包含一个合成器。\n    4. `Kwin` 包含一个合成器。\n  \
  \  5. `Weston` 是一个合成器。\n\n11. 关于 `Wayland`，以下哪项是正确的？（选择所有适用项。）\n    1. 目前 `X11`\
  \ 比 `Wayland` 更安全。\n    2. `Wayland` 使用环境变量 `$WAYLAND_DISPLAY`。\n    3. `Wayland`\
