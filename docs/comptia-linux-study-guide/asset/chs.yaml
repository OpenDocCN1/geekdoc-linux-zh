  \ 命令 `FORMAT` 设置中哪个是正确的？\n    1. `\"%s\\n\"`\n    2. `\"%.2s\\n\"`\n    3. `\"%d\\\
  n\"`\n    4. `\"%.2c\\n\"`\n    5. `\"%.2f\\n\"`\n\n13. 一个 Unicode 编码的文本文件 `MyUCode.txt`\
  \ 需要审阅。在决定使用什么工具查看文件内容之前，你对它使用了 `wc` 命令。该工具向 STDOUT 显示了 `2020 6786 11328`。以下哪项是正确的？（选择所有适用项。）\n\
  \    1. 文件有 2,020 行。\n    2. 文件有 2,020 个字符。\n    3. 文件有 6,786 个单词。\n    4. 文件有 11,328\
  \ 个字符。\n    5. 文件有 11,328 行。\n\n14. 以下哪项是对文件描述符的最佳定义？\n    1. 代表文件类型的字母\n    2.\
  \ 代表进程打开文件的数字\n    3. 文件名的另一个术语\n    4. 代表标准输出的六字符名称\n    5. 表示文件分类的符号\n\n15. 默认情况下，STDOUT\
  \ 指向哪个项？\n    1. `/dev/ttyn`，其中 `n` 是数字\n    2. `/dev/null`\n    3. `>`\n    4.\
  \ `/dev/tty`\n    5. `pwd`\n\n16. 以下哪个命令会将 `SpaceOpera.txt` 输出到终端，同时将其副本保存到文件 `SciFi.txt`？\n\
  \    1. `cat SpaceOpera.txt | tee SciFi.txt`\n    2. `cat SpaceOpera.txt > SciFi.txt`\n\
  \    3. `cat SpaceOpera.txt 2> SciFi.txt`\n    4. `cp SpaceOpera.txt SciFi.txt`\n\
  \    5. `cat SpaceOpera.txt &> SciFi.txt`\n\n17. 以下哪些命令会将生成的错误信息放入“黑洞”？\n    1.\
  \ `sort SpaceOpera.txt 2> BlackHole`\n    2. `sort SpaceOpera.txt &> BlackHole`\n\
  \    3. `sort SpaceOpera.txt > BlackHole`\n    4. `sort SpaceOpera.txt 2> /dev/null`\n\
  \    5. `sort SpaceOpera.txt > /dev/null`\n\n18. 以下哪些命令可以确定 `Problems.txt` 文件中有多少记录包含单词\
  \ `error`？\n    1. `grep error Problems.txt | wc -b`\n    2. `grep error Problems.txt\
  \ | wc -w`\n    3. `grep error Problems.txt | wc -l`\n    4. `grep Problems.txt\
  \ error | wc -w`\n    5. `grep Problems.txt error | wc -l`\n\n19. 你想要在当前目录树中查找任何名为\
  \ `42.tmp` 的文件并将其内容输出到 STDOUT。以下哪些项可以让你构建实现此任务的命令？（选择所有适用项。）\n    1. `xargs (find.\
  \ -name 42.tmp) cat`\n    2. `cat 'find. -name 42.tmp'`\n    3. `cat $(find. -name\
  \ 42.tmp)`\n    4. `cat {find. -name 42.tmp}`\n    5. `find. -name 42.tmp | xargs\
  \ cat`\n\n\n\n\n\n20. 你想编辑 `SpaceOpera.txt` 文件，并决定使用 `vim` 编辑器来完成此任务。以下哪些是你可能使用的\
  \ `vim` 模式？（选择所有适用。）\n\n1. Insert（插入模式）\n2. Change（更改模式）\n3. Command（命令模式）\n4. Ex\n\
  5. Edit（编辑模式）\n\n# 第二部分：启动与配置系统\n\n## 第 5 章：解释启动过程\n\n## Linux 启动过程\n\n当你开启 Linux\
  \ 系统的电源时，会触发一系列事件，最终导致登录提示符。通常情况下，你不需要担心这些事件在幕后发生了什么；你只需要登录并开始使用应用程序即可。\n\n然而，有时你的\
  \ Linux 系统可能无法正常启动，或者你期望在后台模式运行的某个应用程序并没有运行。在这种情况下，了解 Linux 如何启动操作系统和启动程序的基本知识将有助于你排排除故障。\n\
  \n接下来的章节将详细介绍启动过程的步骤，以及你如何观察启动过程以查看哪些步骤失败了。\n\n### 遵循启动过程\n\nLinux 启动过程可以分为三个主要步骤：\n\
  \n1. 工作站固件启动，对硬件进行快速检查（称为 `Power-On Self-Test, or POST`，电源自检），然后查找从可启动设备运行的引导加载程序。\n\
  2. 引导加载程序运行并确定加载哪个 Linux 内核程序。\n3. 内核程序加载到内存中，并启动系统运行所需的后台程序（例如用于桌面的图形桌面管理器，或用于服务器的\
  \ Web 和数据库服务器）。\n\n虽然表面上这三个步骤看起来很简单，但背后发生着一系列操作“芭蕾”，以保持启动过程的正常运行。每个步骤在准备你的系统运行 Linux\
  \ 时，都会执行若干操作。\n\n### 查看启动过程\n\n你可以通过在系统启动时观察系统控制台屏幕来监控 Linux 启动过程。当系统检测硬件并加载软件时，你会看到大量信息性消息滚动过。\n\
  \n通常，启动消息滚动得非常快，很难看清发生了什么。如果你需要排查启动问题，可以使用 `dmesg` 命令查看启动时间段的消息。大多数 Linux 发行版会将启动内核消息复制到内存中的一个特殊环形缓冲区，称为\
  \ `kernel ring buffer`（内核环形缓冲区）。该缓冲区是循环的，并设置了预定的大小。当新消息记录在缓冲区中时，旧消息会被轮换出去。\n\n`dmesg`\
  \ 命令显示当前存储在内核环形缓冲区中的最新启动消息，如列表 5.1`（基本输入输出系统）。在新的工作站和服务器上，一种名为 `Unified Extensible\
  \ Firmware Interface (UEFI)`（统一可扩展固件接口）的新方法维持系统硬件状态并启动已安装的操作系统。\n\n## BIOS 启动\n\n\
  BIOS 固件有一个简单的菜单界面，允许你更改某些设置以控制系统如何查找硬件，并定义 BIOS 应该使用哪个设备启动操作系统。\n\n原始 BIOS 固件的一个局限性是，它只能从硬盘读取一个扇区大小的数据到内存中运行。这空间不足以加载整个操作系统。为了克服这一局限性，绝大多数操作系统（包括\
  \ Linux 和 Microsoft Windows）将启动过程分为两个部分。\n\n首先，BIOS 运行一个 `bootloader`（引导加载程序）程序，这是一个用于初始化必要的硬件以查找并运行完整操作系统程序的小程序。它通常位于同一块硬盘的另一个位置，但有时位于单独的内部或外部存储设备。\n\
  \n引导加载程序通常有一个配置文件，因此你可以告诉它去哪里寻找要运行的实际操作系统文件，甚至生成一个小型菜单，允许用户在多个操作系统之间进行启动。\n\n为了启动程序，BIOS\
  \ 必须知道在安装的存储设备上哪里找到引导加载程序。大多数 BIOS 设置允许你从几个位置加载引导加载程序：\n\n*   内部硬盘\n*   外部硬盘\n*\
  \   CD 或 DVD 驱动器\n*   USB 优存盘\n*   ISO 文件\n*   使用 NFS、HTTP 或 FTP 的网络服务器\n\n从硬盘启动时，你必须指定\
  \ BIOS 应该从哪个硬盘以及硬盘上的分区加载引导加载程序。这是通过定义 `Master Boot Record (MBR)`（主引导记录）来实现的。\n\n\
  MBR 是系统上第一个硬盘分区的第一个扇区。计算机系统只有一个 MBR。BIOS 查找 MBR 并将存储在那里的程序读取到内存中。由于引导加载程序必须适合一个扇区，所以它必须非常小，因此不能做太多事情。引导加载程序主要指向实际操作系统内核文件的位置，该文件存储在系统上安装的独立分区的启动扇区中。内核启动文件没有大小限制。\n\
  \n## UEFI 启动\n\n随着操作系统变得越来越复杂，显然需要开发一种新的启动方法。\n\nIntel 在 1998 年创建了 `Extensible Firmware\
  \ Interface (EFI)`（可扩展固件接口）以解决 BIOS 的某些局限性。到 2005 年，这一想法得到了其他供应商的认可，通用 EFI (UEFI)\
  \ 规范被采用为标准。如今，几乎所有兼容 IBM 的桌面和服务器系统都使用 UEFI 固件标准。\n\nUEFI 不再依赖硬盘上的单个启动扇区来存放引导加载程序，而是指定了一个特殊的磁盘分区，称为\
  \ `EFI System Partition (ESP)`（EFI 系统分区），用于存储引导加载程序。这允许存储任何大小的引导加载程序，并具有存储多个操作系统的多个引导加载程序的能力。\n\
  \nESP 设置利用旧的 Microsoft 文件分配表 (FAT) 文件系统来存储引导加载程序。在 Linux 系统上，ESP 通常挂载在 `/boot/efi`\
  \ 目录下，引导加载文件通常使用 `.efi` 文件名存储，例如 `linux.efi`。\n\nUEFI 固件利用内置的微引导加载程序（有时称为 `boot\
  \ manager` 启动管理器），允许你配置启动哪个引导加载程序文件。\n\n使用 UEFI，你需要在启动管理器界面菜单中注册每个希望在启动时显示的单个引导加载程序文件。然后你可以在每次启动系统时选择运行的引导加载程序。\n\
  \n一旦固件找到并运行了引导加载程序，它的任务就完成了。启动过程中的引导加载程序步骤可能会有点复杂。下一节将深入介绍这一点。\n\n## Linux 引导加载程序\n\
  \n引导加载程序帮助桥接系统固件与完整 Linux 操作系统内核之间的差距。在 Linux 中，有多种引导加载程序可供选择。然而，Linux 发行版中默认使用的主要引导加载程序程序如下：\n\
  \n*   Linux Loader (LILO)\n*   Grand Unified Bootloader (GRUB) Legacy\n*   GRUB2\n\
  \n\n\n\n\n在原始的 Linux 版本中，`Linux Loader (LILO)` 引导程序是唯一可用的引导程序。它的功能极其有限，但它完成了任务——从\
  \ BIOS 启动加载 Linux 内核。LILO 配置文件存储在单一文件 `/etc/lilo.conf` 中，该文件定义了要启动的系统。遗憾的是，LILO\
  \ 无法配合 UEFI 系统，因此在现代系统上的作用有限并已淡出历史舞台。\n\n第一代 GRUB 引导程序（现在称为 `GRUB Legacy`）创建于 1999\
  \ 年，旨在提供一个更健壮、可配置的引导程序来取代 LILO。GRUB 迅速成为所有 Linux 发行版的默认引导程序，无论它们运行在 BIOS 还是 UEFI\
  \ 系统上。\n\n`GRUB2` 创建于 2005 年，是对 `GRUB Legacy` 系统的完全重写。它支持许多高级功能，例如加载硬件驱动程序模块的能力，以及使用逻辑语句根据系统检测到的条件（例如是否连接了外部硬盘）动态地更改启动菜单选项。\n\
  \n虽然几乎所有的现代 Linux 发行版都使用 `GRUB2` 引导程序，但了解 `GRUB Legacy` 的配置格式是有帮助的，因为 `GRUB2` 是在其基础上构建。因此，我将先讨论\
  \ `GRUB Legacy` 的工作原理，然后讨论 `GRUB2`。\n\n## GRUB Legacy\n\n`GRUB Legacy` 引导程序的设计是为了简化启动菜单和向内核传递选项的过程。`GRUB\
  \ Legacy` 允许你通过菜单界面和交互式 shell 选择多个内核和或操作系统。你可以配置菜单界面，为你想要启动的每个内核或操作系统提供选项。交互式 shell\
  \ 则为你提供了一种即时自定义启动命令的方法。\n\n菜单和交互式 shell 都使用一组控制引导程序特性的命令。接下来的章节将介绍如何配置 `GRUB Legacy`\
  \ 引导程序、如何安装它以及在启动时如何与它交互。\n\n### 配置 GRUB Legacy\n\n当你使用 `GRUB Legacy` 交互式菜单时，你需要使用特殊的\
  \ GRUB `menu commands` 告诉它显示哪些选项。\n\n`GRUB Legacy` 系统将菜单命令存储在一个名为 `menu.lst` 的标准文本配置文件中。该文件存储在\
  \ `/boot/grub` 文件夹中（虽然不是必须，但某些 Linux 发行版会在硬盘上创建一个独立的 `/boot` 分区）。基于 Red Hat 的 Linux\
  \ 发行版（如 CentOS 和 Fedora）使用 `grub.conf` 代替 `menu.lst` 作为配置文件。\n\n`GRUB Legacy` 配置文件包含两个部分：\n\
  \n* 全局定义 (Global definitions)\n* 操作系统启动定义 (Operating system boot definitions)\n\n\
  全局定义部分定义了控制 `GRUB Legacy` 启动菜单整体运行的命令。全局定义必须出现在文件的开头。你可以进行的全局设置寥寥几个。\n\n| 设置 | 描述\
  \ |\n| --- | --- |\n| `color` | 指定启动菜单使用的前景颜色和背景颜色 |\n| `default` | 定义默认选择的菜单选项\
  \ |\n| `fallback` | 如果默认菜单选项失败，备备菜单选择 |\n| `hiddenmenu` | 不显示菜单选择选项 |\n| `splashimage`\
  \ | 指向用作启动菜单背景的图像文件 |\n| `timeout` | 指定在使用默认值之前等待菜单选择的时间 |\n\n对于 `GRUB Legacy`，要为列出的命令定义一个值，你需要将该值作为命令行参数列出：\n\
  \n```\ndefault 0\ntimeout 10\ncolor white/blue yellow/blue\n```\n\n`color` 命令定义了菜单的配色方案。第一对定义了普通菜单项的前景/背景对，而第二对定义了被选中菜单项的前景/背景对。\n\
  \n在全局定义之后，你放置了安装在系统上的各个操作系统的定义。每个操作系统都应该有自己的定义部分。有很多启动定义设置可以供你自定义引导程序找到寻找操作系统内核文件的方式。幸运的是，定义操作系统只需要几个命令。需要记住的列在此处：\n\
  \n* `Title`: 每个启动定义部分的第一行；这是在启动菜单中显示的内容。\n* `Root`: 定义系统上 GRUB `/boot` 文件夹分区所在的磁盘和分区。\n\
  * `Kernel`: 定义存储在 `/boot` 文件夹中等待加载的内核镜像文件。\n* `Initrd`: 定义初始 RAM 磁盘文件，它包含了内核与系统硬件交互所需的驱动程序。\n\
  * `Rootnoverify`: 定义非 Linux 启动分区，例如 Windows。\n\n`root` 命令定义了包含用于 `GRUB Legacy` 的\
  \ `/boot` 文件夹的硬盘和分区。遗憾的是，`GRUB Legacy` 使用了一种略显奇怪的方式来引用这些值：\n\n```\n(hddrive, partition)\n\
  ```\n\n此外，遗憾的是，`GRUB Legacy` 并不像 Linux 那样引用硬盘；它使用数字系统来引用磁盘和分区，从 0 开始而不是 1。例如，要引用系统上第一块硬盘上的第一个分区，你会使用\
  \ `(hd0,0)`。要引用第一块硬盘上的第二个分区，你会使用 `(hd0,1)`。\n\n`initrd` 命令是 `GRUB Legacy` 中的另一个重要功能。它帮助解决了在使用专用硬件或文件系统作为根驱动器时出现的问题。`initrd`\
  \ 命令定义了一个由内核在启动时挂载为 RAM 磁盘的文件，也称为 `initrd`。内核随后可以从 `initrd` RAM 磁盘中加载模块，从而允许其访问未编译到内核本身中的硬件或文件系统。`initrd`\
  \ RAM 磁盘文件位于 `/boot` 目录，命名为 `initrd.img-kversion`，其中 `kversion` 是内核版本号。\n\n此示例显示了两个启动选项——一个用于\
  \ Ubuntu Linux 系统，另一个用于 Windows 系统。Ubuntu 系统安装在第二块硬盘的第一个分区上，而 Windows 系统安装在第一块硬盘的第一个分区上。Linux\
  \ 启动选择指定了要加载的内核文件以及加载到内存中的 `initrd` 镜像文件。\n\n### 安装 GRUB Legacy\n\n一旦你构建了 `GRUB\
  \ Legacy` 配置文件，就必须将 GRUB Legacy 程序安装到 MBR 中。执行此操作的命令是 `grub-install`。\n\n`grub-install`\
  \ 命令使用单一参数——要安装 GRUB 的分区。你可以使用 Linux 或 GRUB Legacy 格式来指定分区。例如，要使用 Linux 格式，你会使用\n\
  \n```\n# grub-install /dev/sda\n```\n\n在第一块硬盘的 MBR 上安装 GRUB。要使用 GRUB Legacy 格式，你必须将硬盘格式括在引号中：\n\
  \n```\n# grub-install '(hd0)'\n```\n\n如果你使用链加载（chainloading）方法，并倾向于在分区的引导扇上安装 GRUB\
  \ Legacy 副本，而不是硬盘的 MBR，你必须指定分区，同样可以使用 Linux 或 GRUB 格式：\n\n```\n# grub-install /dev/sda1\n\
  # grub-install 'hd(0,0)'\n```\n\n在修改配置文件后，你不需要在 MBR 中重新安装 GRUB Legacy。GRUB Legacy\
  \ 每次运行时都会读取配置文件。\n\n\n\n\n当你启动使用 GRUB Legacy 引导加载程序的系统时，你会看到一个菜单，其中显示了你在配置文件中定义的启动选项。如果你等待超时，系统将处理默认启动选项。或者，你也可以使用方向键选择其中一个启动选项，然后按\
  \ Enter 键进行选择。\n\n你还可以从 GRUB 菜单即时编辑启动选项。首先，使用方向键移动到你想修改的启动选项，然后按 `E` 键。使用方向键将光标移动到需要修改的行，然后按\
  \ `E` 键进行编辑。按 `B` 键使用新值启动系统。你也可以随时按 `C` 键进入交互式 shell 模式，允许随时提交命令。\n\n### GRUB2\n\
  \n由于 GRUB2 系统旨在改进 GRUB Legacy，因此许多功能是相同的，但也有一些变动。例如，GRUB2 系统将配置文件文件名更改为 `grub.cfg`\
  \ 并将其存储在 `/boot/grub/` 文件夹中（这允许你同时安装 GRUB Legacy 和 GRUB2）。某些基于红帽（Red Hat）的 Linux\
  \ 发行版还在 `/etc/grub2.cfg` 文件中创建该文件的符号链接以便方便引用。\n\n#### 配置 GRUB2\n\nGRUB2 中使用的命令也有一些变化。例如，GRUB2\
  \ 不使用 `title` 命令，而是使用 `menuentry` 命令，而且你必须在紧随 `menuentry` 命令之后用大括号包含每个单独的启动部分。这是一个\
  \ GRUB2 配置文件的示例：\n\n```\n menuentry \"Ubuntu Linux\" {\n set root=(hd1,1)\n linux\
  \ /boot/vmlinuz\n initrd /initrd\n}\nmenuentry\"Windows\" {\n set root=(hd0,1)\n\
  }\n```\n\n注意，GRUB2 使用 `set` 命令为 `root` 关键字赋值，并使用等号分配设备。GRUB2 使用环境变量来配置设置，而不是使用命令。\n\
  \nGRUB2 还更改了分区的编号系统。虽然它仍然使用 0 表示第一块硬盘，但第一个分区被设置为 1。因此，若要在第一块硬盘的第一个分区上定义 `/boot`\
  \ 文件夹，你现在需要使用：\n\n```\n set root=hd(0,1)\n```\n\n此外，注意 GRUB2 不再使用 `rootnoverify`\
  \ 和 `kernel` 命令。非 Linux 启动选项现在使用 `root` 环境变量以与 Linux 启动选项相同的方式定义，使用 `linux` 命令定义内核位置。\n\
  \nGRUB2 的配置过程也所不同。虽然 `/boot/grub/grub.cfg` 文件是 GRUB2 使用的配置文件，但你不应该修改该文件。相反，在 `/etc/grub.d`\
  \ 文件夹中存储着单独的配置文件。这允许你（或系统）为系统中安装的每个启动选项创建单独的配置文件（例如，一个用于启动 Linux 的配置文件，另一个用于启动 Windows\
  \ 的配置文件）。\n\n对于全局命令，请使用 `/etc/default/grub` 配置文件。某些全局命令的格式已从 GRUB Legacy 命令发生变化，例如使用\
  \ `GRUB_TIMEOUT` 代替简单的 `timeout`。\n\n大多数 Linux 发行版会在某些事件（如升级内核）后自动生成新的 `grub.cfg`\
  \ 配置文件。通常，发行版会保留一个指向旧内核文件的启动选项，以防新内核失败。\n\n#### 安装 GRUB2\n\n与 GRUB Legacy 不同，你不需要安装\
  \ GRUB2；你只需要运行 `grub2-mkconfig` 程序重新构建主安装文件。\n\n`grub2-mkconfig` 程序读取存储在 `/etc/grub.d`\
  \ 文件夹中的配置文件，并将命令汇成单一的 `grub.cfg` 配置文件。\n\n你可以通过运行 `grub2-mkconfig` 命令手动更新配置文件：\n\
  \n```\n # grub2-mkconfig -o /boot/grub2/grub.cfg\n```\n\n注意，你必须使用 `-o` 命令行选项将 `grub2-mkconfig`\
  \ 程序的输出重定向到 `grub.cfg` 配置文件。默认情况下，`grub2-mkconfig` 程序仅将新的配置文件命令输出到标准输出。\n\n在某些情况下，你确实需要在引导器上重新安装\
  \ GRUB2。要这样做，在创建 `grub.cfg` 配置文件后，你可以使用 `grub2-install` 命令将其安装到主硬盘：\n\n```\n # grub2-install\
  \ /dev/sda\n```\n\n#### 与 GRUB2 交互\n\nGRUB2 引导加载程序产生的启动菜单与 GRUB Legacy 方法类似。你可以使用方向键在启动选项之间切换，使用\
  \ `E` 键编辑启动项，或使用 `C` 键调出 GRUB2 命令行以提交交互式启动命令。图 5.1 显示了在 Rocky Linux 系统上编辑 GRUB2\
  \ 启动菜单中的项。\n\n![GNU GRUB 版本 2.06 引导加载程序屏幕，带有命令行和按键导航说明。](img/c05f001.png)\n\n图 5.1\
  \ 编辑 Rocky Linux GRUB2 菜单项\n\n### 替代引导器\n\n虽然 GRUB Legacy 和 GRUB2 是最流行的 Linux 引导程序，但取决于你使用的\
  \ Linux 发行版，你可能会遇到其他几个。\n\n*Syslinux 项目* 包含了五个独立的引导加载程序，它们在 Linux 中有特殊用途：\n\n* \
  \  **SYSLINUX:** 用于使用微软 FAT 文件系统的系统的引导加载程序（常用于从 USB 闪盘启动）\n*   **EXTLINUX:** 用于从\
  \ ext2、ext3、ext4 或 btrfs 文件系统启动的微引导加载程序\n*   **ISOLINUX:** 用于从 LiveCD 或 LiveDVD\
  \ 启动的引导加载程序\n*   **PXELINUX:** 用于从网络服务器启动的引导加载程序\n*   **MEMDISK:** 用于从其他 SYSLINUX\
  \ 引导加载程序启动旧 DOS 操作系统的工具\n\nISOLINUX 引导加载程序对于发布 LiveDVD 版本的发行版非常流行。该引导加载程序需要两个文件：包含引导程序镜像的\
  \ `isolinux.bin` 以及包含配置设置的 `isolinux.cfg`。\n\nPXELINUX 引导加载程序使用预执行环境 (PXE)* 标准，该标准定义了网络工作站如何从中央服务器启动并加载操作系统。PXE\
  \ 使用 DHCP 为工作站分配网络地址，并使用 BOOTP 从服务器加载引导程序镜像。网络服务器必须支持 TFTP 协议以将引导镜像文件传输到工作站。\n\n\
  要使用 PXELINUX，TFTP 服务器需要存储为 `/tftpboot/pxelinux.0` 的 PXINUX 引导加载程序，供工作站下载。每个工作站还必须在\
  \ `/tftpboot/pxelinux.cfg` 目录下有一个可用配置文件。文件根据工作站的 MAC 地址命名，并包含该工作站所需的特定配置设置。\n\n\
  ## 系统恢复\n\n没有什么比启动 Linux 系统却没有得到登录提示更糟糕的了。Linux 启动过程中可能会出现很多问题，但大多数问题可归为两类：\n\n\
  *   内核故障\n*   驱动器故障\n\n后续章节将介绍你可以遵循的一些标准故障排除实践，以尝试恢复无法启动的 Linux 系统。\n\n## 内核故障\n\
  \n内核故障是指 Linux 内核停止在内存运行，导致 Linux 系统崩溃。这通常被称为*内核恐慌 (kernel panic)*。内核恐慌通常是软件更改的结果，例如在没有相应模块或库更改的情况下安装了新内核，或在新的运行级别上启动（或停止）程序。通常，此类启动错误可以通过使用替代方法启动系统并编辑必要文件来更改系统从而修复。\n\
  \n#### 在启动时选择之前的内核\n\n\n\n\n导致启动失败的最常见原因之一是升级了 Linux 内核，无论是手动升级还是通过发行版的软件包包升级。当你安装新内核文件时，保留旧的内核文件并在\
  \ GRUB 启动菜单中创建一个额外的条目以指向新内核始终是一个好习惯。\n\n通过在 GRUB 启动菜单中创建多个内核条目，你可以选择启动哪个内核版本。如果新内核无法正常启动，你可以重启并选择旧的内核版本。\n\
  \n大多数 Linux 发行版在添加新内核时会自动执行此操作，在启动菜单中保留最近的一个旧版本内核，如图图 5.2\n\n图 5.2 具有多个内核选项的 Rocky\
  \ Linux Grub 启动菜单\n\n## 单用户模式\n\n有时，你可能需要执行某些类型的系统维护，例如添加新的硬件模块或库文件以便系统能够正常启动。在这种情况下，你希望系统在启动时不允许多个用户连接，特别是在服务器环境中。这被称为单用户模式。\n\
  \nGRUB 菜单允许你通过在启动菜单命令的 `linux` 行中添加 `single` 命令来以单用户模式启动系统。要进入该界面，请在 GRUB 启动菜单的启动选项上按\
  \ `E` 键。\n\n当你添加 `single` 命令时，系统将启动到 `runlevel 1`（对于使用 Systemd 启动方法的系统，则是 `runlevel-1`\
  \ 目标），这会为 root 用户账户创建一个单一登录。一旦你以 root 用户身份登录，就可以修改使系统正确启动所需的适当模块、init 脚本或 GRUB 启动菜单选项。\n\
  \n### 传递内核参数\n\n除了单用户模式技巧外，你还可以在 GRUB 启动菜单的 `linux` 命令中添加其他内核参数。内核接受可以更改其激活的硬件模块或其查找特定设备查找的硬件设置的参数（这对于声卡和网卡尤为如此）。你可以将不同的硬件设置作为附加参数指定给\
  \ `linux` 命令中的内核，然后从 GRUB 菜单中的该条目启动。\n\n### 根驱动器故障\n\n对于 Linux 系统管理员来说，最糟糕的感觉可能是看到启动加载程序无法读取根驱动器设备。然而，这种类型的错误可能并不致命，因为有时可以从损坏的根驱动器中恢复。\n\
  \n## 使用救援磁盘\n\n许多 Linux 发行版在发生致命磁盘错误时提供救援磁盘。救援磁盘通常从 CD 驱动器或 USB 闪盘启动，并将一个小型 Linux\
  \ 系统加载到内存中。由于 Linux 系统完全运行在内存中，它可以让所有工作站硬盘空闲以供检查和修复。从系统命令行提示符处，你可以对系统硬盘执行某些诊断和修复任务。\n\
  \n用于检查和修复硬盘错误的首选工具是 `fsck` 命令。`fsck` 命令并不是一个程序；它是针对不同类型文件系统的系列命令的别名（例如 `ext2`、`ext3`\
  \ 和 `ext4`）。你需要针对包含 Linux 系统根目录的分所在区设备名称运行 `fsck` 命令。例如，如果根目录在 `/dev/sda1` 分区上，你应该运行以下命令：\n\
  \n```\n# fsck /dev/sda1\n```\n\n`fsck` 命令将检查索引表（inode table）以及存储在硬盘上的文件块，并尝试协调它们。如果发生任何错误，系统将提示你是否修复它们。如果分区上有许多错误，你可以添加\
  \ `-y` 参数来自动对所有修复问题回答“是”。成功修复后，最好再次运行一次 `fsck` 命令以确保所有错误都已发现并纠正。继续运行 `fsck` 命令，直到获得一个无错误的清洁运行结果。\n\
  \n#### 挂载根驱动器\n\n当 `fsck`（或 `xfs_repair`）修复完成后，你可以通过将修复分区挂载到内存中创建的虚拟目录来测试该分区。只需使用\
  \ `mount` 命令将其挂载到可用的挂载目录即可：\n\n```\n# mount /dev/sda1 /media\n```\n\n你可以检查分区中的文件系统以确保其没有损坏。在重启之前，你应该使用\
  \ `umount` 命令卸载分区：\n\n```\n# umount /dev/sda1\n```\n\n在成功卸载分区后，你可以使用标准启动加载程序重启 Linux\
  \ 系统，并尝试使用标准内核和运行级别启动。\n\n练习 5.1 将引导你学习 Linux 管理员的一项重要技能：以单用户模式启动 Linux 系统的能力。单用户模式允许你为了修复而启动\
  \ Linux 系统，同时防止其他用户登录系统。\n\n## 总结\n\n虽然 Linux 发行版设计为无需任何用户干预即可启动，但了解 Linux 启动过程对于在出现问题时非常有帮助。大多数\
  \ Linux 系统使用 GRUB Legacy 或 GRUB2 启动加载程序。这些程序都存在于 BIOS 主引导记录（MBR）中或 UEFI 上的 ESP 分区中。启动加载程序加载\
  \ Linux 内核程序，然后运行 SysV init 或 Systemd 程序来启动 Linux 系统所需的各个后台程序。\n\n如果没有检查系统恢复方法，Linux\
  \ 启动讨论就是完整的。如果你的 Linux 系统无法启动，最可能的原因内核问题或根设备问题。对于内核问题，你通常可以修改 GRUB 菜单添加额外的内核参数，甚至从旧版本的内核启动。对于根驱动器问题，你可以尝试从救援模式启动运行在内存中的\
  \ Linux 版本，然后使用 `fsck` 命令修复损坏的根驱动器。\n\n## 考试要点\n\n**描述 Linux 启动过程。** BIOS 或 UEFI\
  \ 从主引导记录中启动启动加载程序，该程序通常是 Linux GRUB Legacy 或 GRUB2 程序。启动加载程序将 Linux 内核加载到内存中，内核查找并运行\
  \ `init` 程序。`init` 程序启动各个应用程序，并启动命令行终端或图形桌面管理器。\n\n**描述 Linux GRUB Legacy 和 GRUB2\
  \ 启动加载程序。** GRUB Legacy 启动加载程序将文件存储在 `/boot/grub`文件夹中，并使用 `menu.lst` 或 `grub.conf`配置文件定义启动时使用的命令。命令可以创建启动菜单，允许你在多个启动位置、选项或功能之间选择。你必须使用\
  \ `grub-install` 程序将 GRUB Legacy 启动加载程序安装到主引导记录中。GRUB2 启动加载程序也将文件存储在 `/boot/grub`\
  \ 文件夹中，但它使用 `grub.cfg`配置文件定义菜单命令。你不直接编辑 `grub.cfg` 文件，而是将文件存储在 `/etc/default/grub`\
  \ 文件或 `/etc/grub.d` 文件夹中的单独配置文件。运行 `grub-mkconfig` 程序从配置文件生成 GRUB2 配置，然后将输出重定向到\
  \ `/etc/grub.cfg` 文件。\n\n\n\n\n\n### 描述替代的 Linux 引导程序。\n\n`LILO` 引导程序用于较旧的 Linux\
  \ 系统。它使用 `/etc/lilo.conf` 配置文件定义启动选项。Syslinux 项目创建了最流行的替代 Linux 引导程序。`SYSLINUX`\
  \ 引导程序提供了一个运行在 FAT 文件系统（如软盘和 USB 闪存盘）上的引导程序。`ISOLINUX` 引导程序在 LiveCD 发行版中很流行，它可以从\
  \ CD 或 DVD 启动。它将引导程序存储在 `isolinux.bin` 文件中，将配置设置存储在 `isolinux.cfg` 文件中。PXELINUX`\
  \ 引导程序允许网络工作站从网络服务器启动。服务器必须包含 `pxelinux.0` 镜像以及 `pxelinux.cfg` 目录，后者包含每个工作站的独立配置文件。`EXTINUX`\
  \ 引导程序是一个小型引导程序，可用于较小的嵌入式 Linux 系统。\n\n### 描述如何从内核恐慌（kernel panic）中恢复。\n\n`GRUB`\
  \ 引导程序提供了选项，如果你的 Linux 系统无法启动或因内核恐慌问题而停止，这些选项可以提供帮助。你可以在 `GRUB` 启动菜单处按 `E` 键编辑任何启动菜单条目，然后添加额外的内核参数，例如将系统置于单用户模式。你还可以使用救援磁盘将\
  \ Linux 引导到内存，然后使用 `fsck` 命令修复任何损坏的硬盘，最后使用 `mount` 命令将它们挂载起来以检查文件。\n\n## 复习题\n\n\
