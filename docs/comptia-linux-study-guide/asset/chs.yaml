  \    1. `>`\n    2. `>>`\n    3. `$[]`\n    4. `|`\n    5. `$()`\n\n# 第 26 章：Python\
  \ 概念\n\n![](img/chaptersquare.png)\n\n在 第 25 章“部署 Bash 脚本”中，我带你介绍了如何使用 Bash 壳中的简单脚本来帮助自动化常见的\
  \ Linux 管理任务。然而，某些时候使用更健壮的编程语言来帮助分析和处理数据会很有。Python 编程语言因其简单性和大量的数据相关函数库，已成为数据处理的首选脚本语言。本章将深入探讨如何在你的\
  \ Linux 系统上设置 Python 编程环境，并介绍 Python 编程基础帮助你入门。\n\n## 构建 Python 环境\n\n多年来，Python\
  \ 编程语言已成为最流行的编程语言之一。它运行在各种平台上，拥有庞大的用户群（他们经常为各种应用程序贡献有用函数），而且最好的是它是免费的！\n\nPython\
  \ 编程语言使用了易于理解的语法。`Syntax` 指 Python 命令、它们在 Python 语句中的正确顺序，以及使 Python 语句正常工作所需的额外字符。Python\
  \ 的语法让初学者很容易开始编程，但它包含了许多丰富且强大的特性（包括对面向对象编程的支持），使其对高级程序员也十分有用。\n\n本节将介绍你在设置 Python\
  \ 编程环境时需要考虑的事。\n\n### 运行 Python 代码\n\nPython 是一种解释型编程语言，而不是编译型语言。`compiled` 编程语言在系统上运行之前，所有的语句都已转换为二进制代码。二进制代码直接在系统\
  \ CPU 上运行，执行速度更快。\n\n`interpreted` 语言需要另一个程序来读取每条语句，解码该语句的作用，然后将语句转换为在 CPU 上执行的二进制代码。由于\
  \ Python 是解释型编程语言，它需要另一个程序来读取程序代码并转换为二进制代码。\n\nPython 由 Guido van Rossum 在 20 世纪\
  \ 80 年代后期创建。他构建了这种语言以及将该语言解释为二进制代码所需的程序。Python 语言的人气日益增长，多年来发布了许多语言更新。然而，从 2008\
  \ 年 12 月发布 Python 3.0 版本开始出现了混乱。\n\nPython 3.0 改变了 Python 语言的核心语法，使其与旧版本编写的代码不兼容。不用说，这让\
  \ Python 程序员的生活变得艰难。由于许多应用程序是使用旧版本编写的，程序员面临着必须对其程序进行重大修改才能在 Python 3.x 系列中运行。\n\n\
  为了适应这一点，Python 开发人员维护了旧的 Python 2.x 系列，一直持续了其预期的 2015 年寿命结束日期直到……（等等，原文在此处中断了，但我将遵循提供的流程）。\n\
  \n由于 2.x 版本已停止支持，某些 Linux 发行版（如基于 Red Hat 的发行版）现在将 `python` 指向 3。从 Rocky 9.4 Linux\
  \ 发行版你可以直接使用 `python` 命令：\n\n```\n$ python\nPython 3.9.21 (main, Dec 5 2024, 00:00:00)\n\
  [GCC 11.5.0-2024719] on linux\nType \"help\", \"copyright\", \"license\" for more\
  \ information.\n>>>\n```\n\n然而，某些 Linux 发行版（如基于 Debian 的发行版）保留了旧的 `python3` 命令。因此，在\
  \ Ubuntu 24.04 LTS 中你需要使用 `python3`：\n\n```\n$ python\nCommand 'python' not found,\
  \ did you mean:\n  command 'python3' from deb python3\n  command 'python-is-python3\n\
  $ python3\nPython 3.12.3 (main, Sep 11 2024, 14:17:37) [GCC 13.2.0] on linux\nType\
  \ \"help\", \"copyright\", \"license\" for more information.\n>>>\n```\n\n### Python\
  \ 编码环境\n\nPython 解释器程序提供了两种运行 Python 程序的方法：\n\n*   开发交互式壳\n*   生产级脚本解释器程序\n\n开发交互式壳提供了一个提示符，允许你一次输入一条\
  \ Python 语句进行解释。列表 26.1 显示了在交互式壳中运行 Python 语句的示例。\n\n一旦从 Linux 命令行启动交互式壳，它会产生自己的命令提示符（`>>>`）。从这里你可以输入单个\
  \ Python 语句。列表 26.1 展示了使用 `print()` 函数显示一行输出。要退出交互式壳，必须使用 `exit()` 函数。\n\n运行 Python\
  \ 程序更实用的方法是使用 Python 解释器程序。它是同一个命令行命令，但你在命令行中包含了你的 Python 程序文件。列表 26.2 展示了这一点。\n\
  \n\n\n\n\n在列表 26.2 中，我首先使用 `ls` 命令来显示用于存储程序的 `script2601.py` 文件的权限。请注意，要运行 Python\
  \ 程序，程序文件并不需要具有执行权限。你的用户账户只需要读取权限即可通过解释器程序处理该程序文件。\n\n接下来，我使用 `cat` 命令显示了 `script2601.py`\
  \ 程序的内容，然后使用 `python3` 命令运行该程序文件。默认情况下，`print()` 函数的输出将指向 `Bash` 终端的标准输出。\n\n##\
  \ Python 基础\n\nPython 语言是一门庞大且复杂的语言。试图在一个书籍的章节内总结 Python 是不可能的。本节描述了 Python 核心语言的一些基础知识，帮助你感受\
  \ Python 的强大和实用性。\n\n#### 输出输出\n\n你已经看到过在列表 26.1 和 26.2 中，Python 如何使用 `print()`\
  \ 函数输出文本。之前的 Python 版本使用 `print` 语句，这需要程序员在输出方面花费许多额外精力，但 3.0 版本通过引入 `print()` 函数改变了这一点。\n\
  \n`print()` 函数的基本基本格式非常简单：\n\n```\n print(argument)\n```\n\n`argument` 可以是被引号括的字符（称为字面量），也可以存储在变量中的值（将在下一节讨论）。Python\
  \ 不在意你使用单引号还是双引号来定义字面量，但最佳实践是选择一种方法并坚持下去。\n\n```\n >>> print('This example uses\
  \ single quotes')\nThis example uses single quotes\n>>> print(\"This example uses\
  \ double quotes\")\nThis example uses double quotes\n>>>\n```\n\n#### 使用变量\n\n你编写\
  \ Python 程序最可能的原因是因为你想处理数据。在程序中存储和操作数据是使用 `variables` 完成的。变量是一个引用内存位置的名字，程序在内存位置存储一个值，以供脚本后续使用。\n\
  \n变量通过程序中唯一的变量名定义。Python 在创建变量名时需要遵循一些规则：\n\n* 你不能使用 Python 关键字作为变量名。\n* 变量名中只能使用大写字母、小写字母、数字和下划线字符。\n\
  * 变量名的第一个字符不能是数字。\n* 变量名中不允许有空格。\n\n要给变量赋值，使用等号（`=`）：\n\n```\n >>> test1=500\n>>>\
  \ print(test1)\n500\n>>> print(\"The value of test1 is\", test1)\nThe value of test1\
  \ is 500\n>>>\n```\n\n注意，当我给变量 `test1` 赋值时，Python 交互式式外壳没有返回任何消息。同样注意，你可以在 `print()`\
  \ 函数内部指定变量名，它会自动识别这是一个变量并显示变量的值而不是变量名。然而，在第二个 `print()` 语句中，我在引号内使用了 `test1` 变量名，Python\
  \ 随后将其解释为字面文本的一部分。要显示实际变量值，我需要在引号之外指定它。\n\n使用变量名要小心，因为它们在 Python 中是区分大小写的。如果你使用了一个之前没有定义的变量名，Python\
  \ 将产生错误：\n\n```\n >>> print(Test1)\nTraceback (most recent call):\n  File \"<stdin>\"\
  , line 1, in <module>\nNameError: name 'Test1' is defined. Did you mean: 'test1'?\n\
  >>>\n```\n\n你可以在变量中存储不同类型的数据。Python 支持几种基本数据类型：\n\n* **Numeric（数值）**: 数值数据类型包含包含数值，例如：\n\
  \    * `int`: 整数\n    * `float`: 浮点数\n    * `complex`: 存储为实部和虚部的复数\n* **Boolean（布尔）**:\
  \ 仅包含 `True` 或 `False` 值\n* **Set（集合）**: 无序的数据值集合\n* **Sequence（序列）**: 序列数据类型包括有序集合。该数据类型包括：\n\
  \    * `str`: Unicode 字符数组（字符串）\n    * `list`: 赋值给单个变量的值数组\n    * `tuple`: 赋值给单个变量的不可变数组\n\
  * **Dictionary（字典）**: 使用键值对的无序数据集合\n\nPython 可能会让初学者遇到问题的特性之一是，你可以随时更改变量中存储的数据类型。列表\
  \ 26.3 演示了这一点。\n\n在列表 26.3 中，我首先将整数值 500 赋值给变量 `test1`。然后我使用 Python 的 `type()` 函数显示变量包含的数据类型。接下来我将字符串值赋值给变量\
  \ `test1`，并再次使用 `type()` 函数显示数据类型。这说明你可以在整个程序中使用同一个变量名存储不同的数据类型。\n\n#### 执行数学运算\n\
  \n正如你预期的那样，Python 支持你正常计算所需的所有基本数学运算符：\n\n```\n >>> 1 + 1\n2\n>>> 5 - 2\n3\n>>>\
  \ 2 * 5\n10\n>>> 15 / 3\n5.0\n>>>\n```\n\n注意，当我执行除法时，Python 自动将结果转换为浮点数据类型，即使输入都是整数。\n\
  \n表格 26.1 显示了你可以在脚本中使用的所有 Python 数学运算符。\n\n| 运算符 | 说明 |\n| --- | --- |\n| `+` |\
  \ 加法 |\n| `–` | 减法 |\n| `*` | 乘法 |\n| `/` | 除法 |\n| `%` | 取模 |\n| `//` | 整除 |\n\
  | `**` | 幂 |\n| `&` | 二进制 AND |\n| `&#124;` | 二进制 OR |\n| `^` | 二进制 XOR |\n| `~`\
  \ | 二进制取反 |\n| `<<` | 二进制左移 |\n| `>>` | 二进制右移 |\n| `and` | 逻辑 AND |\n| `or` | 逻辑\
  \ OR |\n| `not` | 逻辑 NOT（非） |\n\n表格 26.1 Python 数学运算符\n\n整除运算符（`//`）返回除法结果的整数部分（即我们在以前的长除法课上称之为“商”的部分）。取模运算符（`%`）返回除法的余数（我们以前称之为“余下”的部分）。\n\
  \n你从表格 26.1 中会发现有两种类型的 `AND` 和 `OR` 运算符。二进制运算符和逻辑运算符之间存在细微区别。二进制运算符用于所谓的位运算，使用二进制值进行二进制数学运算。\n\
  \n在 Python 中将一个值指定为二进制数，只需在值前面使用 `0b` 符号，如下：\n\n```\n >>> a = 0b01100101\n>>> b\
  \ = 0b01010101\n>>> c = a & b\n>>> bin(c)\n'0b1000101'\n>>>\n```\n\n要以二进制符号显示变量\
  \ `c` 的值，只需使用 `bin()` 函数。\n\n逻辑运算符与布尔 `True` 和 `False` 逻辑值工作，最用于 `if-then` 比较（稍后在“逻辑语句”部分中讨论）：\n\
  \n```\n >>> a = 101\n>>> b = 85\n>>> if ((a > 100) and (b < 100)): print(\"It worked!\"\
  )\n...\nIt worked!\n>>>\n```\n\n在你输入 `if` 语句后，交互式解释器会产生带有三个点的行，等待你完成 `if` 语句。只需按回键即可完成语句。\n\
  \n当你对计算进行实验时，可能会看到某些浮点计算出现一些奇怪的行为。这里有一个我意思的例子：\n\n```\n >>> 5.2 * 9\n46.800000000000004\n\
  >>>\n```\n\n5.2 乘以 9 的结果本应该是 46.8，但显示的结果在实际结果上增加了一个随机值。这是由底层 CPU 处理浮点算术的方式造成的。由于浮点数据类型将数字转换为特殊格式，计算结果是不准确的。\n\
  \n\n\n\n你无法回避这个问题，但你可以在代码中对其进行补偿。Python 提供了 `format()` 函数，它允许你指定 Python 如何在输出中（例如来自\
  \ `print()` 函数）显示值：\n\n```\n >>> result=5.2 * 9\n>>> print(result)\n46.800000000000004\n\
  >>> print(\"The result is {0:.2f}\".format(result))\nThe result is 46.8\n>>>\n```\n\
  \n`format()` 函数使用一个你在输出字符串的 `{}` 占位符中定义的模板。`{0:.2f}` 模板告诉 `format()` 函数显示数字中从位置\
  \ 0 开始的值，并且只显示两位小数。\n\n# 高级 Python 特性\n\n虽然能够存储值并对它们进行数学运算对于编程至关重要，但另一个关键特性是程序做出决策的能力。本节将讨论\
  \ Python 中可用的逻辑函数和循环函数。\n\n### 逻辑语句\n\n默认情况下，Python 按照语句在程序代码中出现的顺序处理每条语句。这对于顺序操作来说运行良好，但并不是所有程序都是这样工作的。\n\
  \n许多程序要求语句之间有某种逻辑流控制。逻辑语句允许我们测试特定条件，然后根据条件求值是 `True` 还是 `False` 逻辑值分支到不同的代码部分。\n\
  \n最基础的逻辑语句类型是 `if` 语句。Python 中的 `if` 语句具有以下基本格式：\n\n```\n if (condition): statement\n\
  ```\n\n如果你在其他编程语言中使用过 `if` 语句，这种格式可能看起来很奇怪，因为语句中没有“then”（那么）关键字。Python 使用冒号来充当“then”关键字。Python\
  \ 评估括号中的条件，如果它返回 `True` 逻辑值，则执行冒号后面的语句。如果条件求值结果为 `False` 逻辑值，则跳过冒号后面的语句。\n\n基础的\
  \ `if` 语句格式允许你根据指定的条件处理一条条语句。然而，在大多数情况下，你希望根据指定的条件执行多条语句。许多编程语言使用某种符号或关键字来指示成组语句的结束。然而，Python\
  \ 使用的是缩进，这可能会导致问题。\n\n为了将一组语句组合成 `if` 语句，你必须将它们分别放在程序代码的不同行中，并相对于 `if` 语句的位置进行缩进。Listing\
  \ 26.4 展示了如何在代码中实现这一点。\n\nListing 26.3 显示的 `script2602.py` 程序使用了我尚未讨论过的 Python 特性，特别是在这一行：\n\
  \n```\n a=int(input(\"Enter your age: \"))\n```\n\n`input()` 函数显示文本字符串，然后等待用户输入值并按回车键。`input()`\
  \ 函数返回字符串值，因此我使用 `int()` 函数将字符串值转换为整数值。\n\n`if` 语句使用比较运算符将输入值与值 `10` 进行比较。比较运算符如\
  \ 表 26.2 所示。\n\n| Operator | Description |\n| --- | --- |\n| `==` | 等于 |\n| `!=`\
  \ | 不等于 |\n| `>` | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n\nTable\
  \ 26.2 Python 比较运算符\n\n当我在提示处输入值 `5` 时，`if` 语句求值为 `True` 值，两个缩进的 `print()` 函数都被执行了。当我在提示处输入值\
  \ `65` 时，`if` 语句求值为 `False` 值，因此两个缩进的 `print()` 函数都被跳过了。未缩进的 `print()` 函数不是 `if`\
  \ 语句分组的一部分，它始终会被执行。\n\n与 Bash 脚本脚本不同，Python 在数值比较和字符串比较中使用完全相同的比较运算符。对于字符串值，Python\
  \ 对值进行字典顺序比较。这种方法将字符串中的字母转换为 ASCII 数值等价物，然后比较这些数值。这可能会产生一些你意想不到的结果：\n\n```\n >>>\
  \ a=\"test\"\n>>> if (a == \"Test\"):print(\"It's equal\")\n...\n>>> if (a < \"\
  Test\"):print(\"It's less than\")\n...\n>>> if (a > \"Test\"):print(\"It's greater\
  \ than\")\n...\nIt's greater than\n>>>\n```\n\n字符串的大写版本求值结果小于小写版本。在 Python 中比较字符串值时，这是一个非常重要的特性！\n\
  \n与其他编程语言类似，Python 也支持 `else` 和 `elif` 语句。在这些它们时，它们没有缩进，而是与原始 `if` 语句处于同一水平：\n\n\
  ```\n if (condition):\n    statements\nelse:\n    other statements\n```\n\n### 循环语句\n\
  \n使用计算机的巨大优势之一是它不会因重复执行任务而厌倦。这种重复（在编程世界也称为迭代）通常在需要多次执行一组任务时在程序中使用。与其多次输入语句，不如将它们放在循环语句中。\n\
  \nPython 中最基础的循环语句是 `for` 循环。默认情况下，`for` 循环遍历数据列表数据类型中定义的一组值：\n\n```\n >>> for i\
  \ in [1, 2, 3, 4, 5]:\n...     square = i * i\n...     print(square)\n...\n1\n4\n\
  9\n16\n25\n>>>\n```\n\n在 Python 中使用 `range()` 函数也很常见，它允许你指定起始和结束数字：\n\n```\n >>>\
  \ for i in range(1,6):\n...     square = i * i\n...     print(i, square)\n...\n\
  1 1\n2 4\n3 9\n4 16\n5 25\n>>>\n```\n\n另一个流行的循环语句是 `while` 循环。`while` 循环允许你指定一个条件，Python\
  \ 在循环每次迭代后都会测试该条件：\n\n```\n while condition:\n    statements\n```\n\n`while` 循环的关键在于，条件在至少一次迭代中必须求出一个不同的值，表示循环应该停止。通常这涉及到一个在\
  \ `while` 循环内部更改的变量。Listing 26.5 展示了使用 `while` 循环的示例。\n\nListing 26.5 显示我使用 `script2603.py`\
  \ 文件存储我的 Python 脚本，然后使用 `python3` 命令运行了它。\n\n### 创建函数\n\n通常，你会发现发现在程序的多个位置使用相同的代码。除了标准的内置函数外，Python\
  \ 还允许你定义自己的函数，并在程序中根据需要频繁地使用它们。\n\n在 Python 中定义函数的格式为：\n\n```\n def name(arg1, arg2,\
  \ ...):\n    statements\n    return value\n```\n\n正如你在 Python 中预期的那样，函数依赖代码中的缩进来确定哪些语句包含在函数中。函数定义可以指定是否需要从主程序向函数传递参数。`return`\
  \ 语句允许你从函数返回一个值到主程序。\n\nListing 26.6 展示了如何在你的 Python 程序中创建你自己的函数。\n\n在你开始创作你自己的函数杰作之前，Python\
  \ 的优势之一是它有一个由 Python 开发者和其他终端用户创建的函数库供你调用。下一节将描述你如何利用这一资源。\n\n# Python 模块\n\n\n\n\
  \n\n在 Python 中，`module`（模块）是函数的集合。模块存在于你的 Python 脚本外部，但包含在加载到你 Linux 系统上的 Python\
  \ 库中。Python 标准库包含数百个模块，并在系统上安装 Python 时包含在内。本节将带你了解如何使用 Python 模块、如何查找和安装新模块，以及在安装新模块时如何避免给\
  \ Linux 系统上的其他 Python 开发者引起问题。\n\n### 使用模块\n\n由于模块位于你的 Python 代码外部，因此在使用模块中包含的函数之前，你需要告诉\
  \ Python 加载特定的模块以便使用。你可以通过 `import` 语句来实现：\n\n```\n import module\n```\n\n非常简单！要使用模块中包含的函数，必须指定模块名、一个点（.），然后是函数名。例如：\n\
  \n```\n >>> import math\n>>> math.factorial(5)\n120\n>>>\n```\n\n在 Listing 26.6\
  \ 中，我不需要编写那些代码来创建自己的阶阶函数；`math` Python 模块已经包含了它！如果你想查看模块包含的函数列表，可以在导入模块后使用 `help()`\
  \ 函数：\n\n```\n >>> help('math')\n```\n\n这将生成所有函数及其描述以及使用方法的列表。\n\n### 查找新模块\n\n\
  虽然 Python 安装包含了许多标准模块，但仍有很多模块可以帮助你进行 Python 开发。技巧在于查找和安装它们。\n\n幸运的是，Python 开发者创建了一种简单的方法。在第\
  \ 13 章 的“软件管理”中，我讨论了 Linux 发行版如何创建自己的仓库来打包软件包。Python 开发者使用相同的技术来打包和部署 Python 模块！\n\
  \n`pip` 程序是 Python 模块管理器。它允许你查询位于 `http://pypi.org` 的官方 Python 模块仓库，然后下载、安装和删除模块。\n\
  \n要查询当前系统中安装的模块，请使用 `list` 命令行选项：\n\n```\n $ pip list\nPackage         Version\n\
  --------------- --------\nargcomplete     1.12.0\nblivet          3.6.0\nBrlapi\
  \          0.8.2\ncffi            1.14.5\nchardet         4.0.0\ncryptography  \
  \  36.0.1\ndasbus          1.4\ndbus-python     1.2.18\ndistro          1.5.0\n\
  file-magic      0.4.0\ngpg             1.15.1\nidna            2.10\n...\n```\n\n\
  要搜索可用模块，请访问 `http://pypi.org` 网站并使用搜索功能。一旦找到感兴趣的模块，使用 `pip` 的 `install` 选项进行下载和安装（安装新模块你必须拥有系统的管理员权限）。Listing\
  \ 26.7 显示了安装和使用 `camelsplit` 模块的示例。\n\n在 Listing 26.7 中，`camelsplit()` 函数接收驼命名法的文本字符串（注意文本中间的大写字母），并根据每个驼峰“峰”将文本分成独立的字符串。\n\
  \n要删除从 `pip` 安装的现有模块，只需使用 `uninstall` 命令选项：\n\n```\n $ sudo pip uninstall camelsplit\n\
  ```\n\n回到 Listing 26.7，请注意我安装新模块时 `pip` 命令产生的警告。在 Linux 系统的主 Python 库中安装模块可能是件危险的事情，特别是有多个\
  \ Python 开发者使用该系统时。一个开发者可能需要特定版本的模块，而下载新版本可能会破坏他们的代码！下一节将描述如何避免这种情况。\n\n## 虚拟 Python\
  \ 环境\n\n如上一节所述，为多个开发者维护 Python 开发环境可能是复杂的。然而，Python 开发者创建了一个让大家都开意的解决方案：虚拟 Python\
  \ 环境。\n\n虚拟 Python 环境允许你将模块包安装到自己的 Python 空间中，而不需要 root 权限，也不会覆盖系统中其他 Python 开发者已安装的任何模块。\n\
  \n要创建你的虚拟 Python 环境，请使用以下命令：\n\n```\n python3 -m venv name\n```\n\n其中 `name` 是调用你开发环境的唯一名称。要激活新的开发环境，请使用\
  \ `source` 命令。Listing 26.8 展示了创建并激活我的虚拟开发环境，然后在其中安装了 `camelsplit` 模块。\n\n在 Listing\
  \ 26.8 中，注意在激活激活虚拟开发环境（名为 `mytest`）后，名称出现在命令行的括号中。随后我使用 `pip` 命令安装了 `camelsplit`\
  \ 模块，并在 `python3` 会话中使用它。\n\n要退出开发环境，只需在 Linux 命令行使用 `deactivate` 命令。\n\n## 总结\n\
  \nPython 编程语言为创建辅助 Linux 系统管理的应用程序提供了一个极佳的平台。它提供了丰富的数据分析和处理函数。\n\nPython 当前版本是 3.x\
  \ 版本，因此请确保你的 Linux 发行版使用的是该系列而不是旧的 2.x 系列。Python 提供了交互式开发环境和 Python 语言解释器，因此你可以即时开发脚本，也可以从\
  \ Linux 命令行运行保存在文件中的脚本。\n\nPython 编程语言包含了大多数编程语言的特性，例如在变量中存储不同数据类型、执行数学运算以及使用逻辑或循环语句来控制程序流。\n\
  \n## 考试要点\n\n**描述如何设置 Python 虚拟环境。** Python 中包含的 `venv` 工具允许你创建虚拟开发环境。一旦创建了虚拟环境，你就可以加载独立于系统主\
  \ Python 模块库的模块，而不影响其他开发者。\n\n**解释如何使用 Python 的内置模块。** 要使用 Python 内置模块，你需要在 Python\
  \ 代码中使用 `import` 命令来导入模块。一旦导入模块，你就可以通过先引用模块名、一个点、然后是函数名来使用模块中定义的任何函数。\n\n**解释 Python\
  \ 提供的数据类型。** Python 提供了五种数据类型。数值数据类型处理整数、浮点数和复数。布尔数据类型处理 `True` 和 `False` 值。集合数据类型可以存储多个数据值的无序集合，而序列数据类型可以存储多个数据值的有序集合。字典数据类型允许你存储使用键/值对引用数据的无序数据集合。\n\
  \n**描述在 shell 脚本中将数据用于另一个命令之前，如何处理来自命令的输出数据。** 命令替换允许你将命令的输出重定向到 shell 脚本中的用户变量。然后可以使用标准的\
  \ Linux 文本处理命令对数据进行处理，例如进行排序或从中提取数据记录，然后再将变量数据重定向到另一个命令。\n\n**解释使用人工智能创建 Python\
  \ 代码的危险性。** 人工智能（AI）创建的代码在部署到生产系统之前需要离线审查。无法保证代码运行是否正确，或是否会对你的系统造成损害。\n\n## 复习题\n\
  \n1. 编译程序和解释型程序的区别是什么？\n    1. 解释型程序被转换为二进制格式直接在 CPU 上运行，而编译程序必须由另一个程序运行。\n    2.\
  \ 解释型程序可以访问外部代码库，而编译代码不能。\n\n\n\n\n3. 编译后的程序可以访问外部代码库，而解释型代码不能。\n\n4. 编译后的程序被转换为二进制格式以便直接在\
  \ CPU 上运行，而解释型程序必须由另一个程序运行。\n\n5. 编译程序和解释型程序之间没有区别。\n\n2. Python 为运行程序提供了哪两个功能？\n\
  \n1. 交互式开发环境\n2. 脚本解释器程序\n3. 用于输入代码的文本编辑器\n4. 用于检查错误信息的调试工具\n5. 用于纠正代码的语法检查器\n\n\
  3. 你如何通过命令行解释器运行你的 Python 脚本文件？\n\n1. `python3 > myscript.py`\n2. `myscript.py >\
  \ python3`\n3. `python3 myscript.py`\n4. `myscript.py python3`\n5. `myscript.py\
  \ | python3`\n\n4. 一旦启动交互式 Python 开发环境，你如何返回 Linux shell？\n\n1. Python 的 `exit()`\
  \ 函数\n2. Python 的 `print()` 函数\n3. `exit` 语句\n4. `return` 语句\n5. `venv` 选项\n\n5.\
  \ 你使用什么函数将输出显示在 Linux 系统的 STDOUT 上？\n\n1. `exit()`\n2. `return`\n3. `input()`\n\
  4. `import`\n5. `print()`\n\n6. 以下哪些是 Python 中的有效变量名？\n\n1. `myTest`\n2. `1Test`\n\
  3. `_mytest`\n4. `test value`\n5. `$Test`\n\n7. 哪个 Python 数据类型允许你存储程序内部不能更改的有序数据集？\n\
  \n1. List（列表）\n2. Tuple（元组）\n3. Dictionary（字典）\n4. Complex（复数）\n5. String（字符串）\n\
  \n8. 哪个 Python 数学运算符允许你执行二进制 `AND` 运算？\n\n1. `and`\n2. `%`\n3. `&`\n4. `|`\n5. `**`\n\
  \n9. Python 如何界定 `if` 语句块中的语句？\n\n1. 使用结束的 `fi` 语句\n2. 使用 `end` 语句\n3. 使用大括号\n4.\
  \ 使用方括号\n5. 使用缩进\n\n10. 你使用什么程序下载并安装新的 Python 模块？\n\n1. `python`\n2. `python3`\n\
  3. `pip`\n4. `venv`\n5. `source`\n\n# 第 27 章：作业自动化\n\n![](img/chaptersquare.png)\n\
  \n当你开始构建 shell 脚本时，你可能会好奇如何在 Linux 系统上运行和控制它们。到本书为止，我只在实时模式下从命令行界面直接运行命令和脚本。这并不是在\
  \ Linux 中运行脚本的唯一方法。在 Linux 系统上有许多其他选项可以运行你的 shell 脚本。本章将探讨你用来启动脚本的不同方法。此外，有时你可能会遇到脚本陷入循环的问题，此时你需要弄清楚如何让它停止，而无需关闭\
  \ Linux 系统。本章还探讨了控制你的 shell 脚本在系统上如何运行以及何时运行的不同方法。\n\n## 在后台模式下运行脚本\n\n有时，直接从命令行界面运行\
  \ shell 脚本是不方便的。某些脚本可能需要很长时间处理，而你可能不想为了等待而占用命令行界面。在脚本运行时，你无法在终端会话中进行任何其他操作。幸运的是，这个问题有一个简单的解决方案。本节将介绍如何在\
  \ Linux 系统上以后台模式运行脚本。\n\n### 在后台运行\n\n在后台模式下运行 shell 脚本是一件很容易的事。要从命令行界面以后后台模式运行\
  \ shell 脚本，只需在命令后加上用于 符号（&）：\n\n```\n $ ./test1.sh &\n [1] 19555\n $ This is a test\
  \ program\nLoop #1\nLoop #2\n\n $ ls -l\n total 8\n -rwxr--r--    1 rich     rich\
  \          219 Feb  26 19:27 test1.sh\n $ Loop #3\n```\n\n当你在命令后放置 & 符号时，它会将命令与\
  \ `Bash` shell 分离，并作为系统上独立的后台进程运行。首先显示的行是：\n\n```\n [1] 19555\n```\n\n括号中的数字是 shell\
  \ 分配给后台进程的作业号（job number）。shell 为每个启动的进程分配一个唯一的作业号。下一个数字是 Linux 系统本身分配给进程的进程 ID（PID）。因此，每个运行在\
  \ shell 中的进程都有一个唯一的作业号，而每个运行在 Linux 系统上的进程都有一个唯一的 PID。\n\n一旦系统显示了这些项目，就会出现一个新的命令行界面提示符。你返回到了\
  \ shell，你执行的命令正在安全地以后台模式运行。\n\n此时，你可以在提示符处输入新命令（如示例所示）。然而，当后台进程仍在运行时，它会使用你的终端显示器输出输出消息。你会注意到示例中，`test1.sh`\
  \ 脚本的输出与从 shell 运行的任何其他命令输出混合在一起。\n\n当后台进程完成时，它会在终端上显示消息：\n\n```\n [1]+  Done  \
  \                 ./test1.sh\n```\n\n这显示了作业号和作业状态（Done），以及用于启动作业的命令。\n\n### 运行多个后台作业\n\
  \n你可以从命令行提示符同时启动任意数量的后台作业：\n\n```\n $ ./test1.sh &\n[1] 19582\n$ This is the test1\
  \ program output\nTest 1 Loop #1 output\n$ ./test2.sh &\n[2] 19597\n$ This is the\
  \ test2 program output\nTest 2 Loop #1 output\n$ ./test3.sh &\n[3] 19612\n$ This\
  \ is the test3 program output\nTest 3 Loop #1 output\nTest 1 Loop #2 output\nTest\
  \ 2 Loop #2 output\nTest 3 Loop #2 output\n```\n\n每当你启动新作业时，shell 都会为它分配一个新的作业号，Linux\
  \ 系统会为它分配一个新的 PID。你可以使用 `ps` 命令查看所有脚本都在运行：\n\n```\n $ ps au\nUSER       PID %CPU\
  \ %MEM   VSZ  RSS TTY      STAT START   TIME COMMAND\nrich 19498 0.0 1.2 2688 1628\
  \ pts/0 S 11:38 0:00 -bash\nrich 19582 0.0 0.9 2276 1180 pts/0 S 11:55 0:00 /bin/bash\
  \ ./test3.sh\nrich 9597  0.1 0.9 2276 1180 pts/0 S 11:55 0:00 /bin/bash ./test2.sh\n\
  rich 19612 0.1 0.9 2276 1180 pts/0 S 11:55 0:00 /bin/bash ./test1.sh\nrich 19639\
  \ 0.0 0.4 1564 552  pts/0 S 11:56 0:00 sleep 10\nrich 19640 0.0 0.4 1564 552  pts/0\
  \ S 11:56 0:00 sleep 10\nrich 19641 0.0 0.4 1564 552  pts/0 S 11:56 0:00 sleep 10\n\
  rich 19642 0.0 0.5 2588 744  pts/0 R 11:56 0:00 ps au\n$\n```\n\n你启动的每个后台进程都会出现在\
  \ `ps` 命令的运行进程列表中。如果所有进程都在你的终端会话中输出，情况很快就会变得非常混乱。幸运的是，有一个简单的方法可以解决这个问题，我将在下一节中讨论。\n\
  \n### 无控制运行脚本\n\n有时，你可能希望从终端会话启动 shell 脚本，然后让它以后台模式运行直到完成，即使你退出了终端会话。你可以通过使用 `nohup`\
  \ 命令来实现。\n\n`nohup` 命令运行另一个命令并阻塞发送给该进程的任何 SIGHUP 信号。这防止进程在你退出时退出（`nohup` 是“no hangup”的缩写）。\n\
  \n可以将 `nohup` 命令与 & 符号结合，在后台运行脚本并防止其被中断：\n\n```\n $ nohup ./test1.sh &\n[1] 19831\n\
  $ nohup: appending output to  'nohup.out'\n$\n```\n\n与普通后台进程一样，shell 为命令分配一个作业号，Linux\
  \ 系统分配一个 PID 号。区别在于，当你使用 `nohup` 命令时，即使你退出会话，脚本也会忽略终端会话发送的任何 SIGHUP 信号。\n\n\n\n\n\
  由于 `nohup` 命令将进程与终端分离，进程会失去与你显示器的输出链接。为了适应命令生成的任何输出，`nohup` 命令会自动将输出消息重定向到当前工作目录下一个名为\
  \ `nohup.out` 的文件中。\n\n`nohup.out` 文件包含了所有通常会发送到终端显示器的输出。在进程运行结束后，你可以查看 `nohup.out`\
  \ 文件来获取输出结果：\n\n```\n $ cat nohup.out\n This is a test program\n Loop #1\n Loop\
  \ #2\n Loop #3\n Loop #4\n Loop #5\n Loop #6\n Loop #7\n Loop #8\n Loop #9\n Loop\
  \ #10\n This is the end of the test program\n $\n```\n\n输出出现在 `nohup.out` 文件中的方式，就像进程在命令行中运行一样！\n\
  \n## 发送信号\n\n正如在第 21 章中讨论的“优化性能”所示，Bash 壳可以向运行在系统上的进程发送信号。这允许你在必要时停止或中断失控的应用程序进程。虽然在第\
  \ 21 章中讨论的 `kill` 和 `pkill` 命令对于停止后台进程很有用，但在控制台上在前台运行的应用程序更难控制。幸运的是，你可以使用键盘组合键生成两种基本的\
  \ Linux 信号来中断或停止前台进程。\n\n### 中断进程\n\n`Ctrl+C` 键组合会生成一个中断信号 (`SIGINT`)），并将其发送给当前在\
  \ shell 中运行的任何进程。你可以通过运行一个通常需要长时间才能完成的命令并按下 `Ctrl+C` 键组合来测试这一点：\n\n```\n $ sleep\
  \ 100\n$\n```\n\n`Ctrl+C` 键组合不会在显示器上产生任何输出；它只是停止了 shell 中运行的当前进程。\n\n### 暂停进程\n\n\
  与其终止进程，不如你可以在进程执行任何操作的中途暂停它。有时这可能是危险的（例如，如果脚本对关键系统文件打开了文件锁），但通常它允许你窥探脚本正在做什么，而无需实际终止进程。\n\
  \n`Ctrl+Z` 键组合会生成一个终端停止信号 (`SIGTSTP`)，停止 shell 中运行的任何进程。停止进程与终止进程不同，因为停止进程会让程序留在内存中，并能够从停止的地方继续运行。在后面的“作业控制”节中，你将学习如何重启已停止的进程。\n\
  \n当你使用 `Ctrl+Z` 键组合时，shell 会通知你进程已停止：\n\n```\n $ sleep 100\n[1]+  Stopped      \
  \           sleep 100\n$\n```\n\n方括号中的数字表示 shell 中的进程作业号。如果你在 shell 会话中分配了一个已停止的作业，当你尝试退出\
  \ shell 时，Bash 会警告你：\n\n```\n $ exit\nlogout\nThere are stopped jobs.\n$\n```\n\n\
  你可以使用 `ps` 命令查看停止的作业：\n\n```\n $ ps au\nUSER PID   %CPU %MEM   VSZ  RSS TTY   STAT\
  \  START   TIME COMMAND\nrich 20560  0.0  1.2  2688 1624 pts/0  S    05:15   0:00\
  \ -bash\nrich 20605  0.2  0.4  1564  552 pts/0  T    05:22   0:00 sleep 100\nrich\
  \ 20606  0.0  0.5  2584  740 pts/0  R    05:22   0:00 ps au\n$\n```\n\n`ps` 命令将停止作业的状态显示为\
  \ `T`，这表示该命令要么正在被追踪要么已停止。原始的 Bash shell 显示为 `S`，表示它正在睡眠，等待脚本结束。`ps` 命令本身显示为 `R`\
  \ 状态，表示它是当前正在运行的作业。\n\n如果你真的想在停止的作业仍然活动的情况下退出 shell，只需再次输入 `exit` 命令。shell 将退出，并终止已停止的作业。或者，既然你已经知道了已停止作业的\
  \ PID，可以使用 `kill` 命令发送一个杀死信号 (`SIGKILL`) 来终止它：\n\n```\n $ kill -9 20605\n$\n[1]+\
  \  Killed                  sleep 100\n$\n```\n\n当你杀死作业时，最初你不会得到任何响应。然而，当你下次执行产生\
  \ shell 提示符的操作时，你会看到一条指示作业已被杀死的消息。每当 shell 提示符时，它还会显示 shell 中状态发生变化的任何作业的状态。\n\n\
  ## 作业控制\n\n在上一节中，你学习了如何使用 `Ctrl+Z` 键组合来停止 shell 中运行的作业。停止作业后，Linux 系统允许你杀死或重启它。重启已停止的进程需要向其发送一个继续信号\
  \ (`SIGCONT`)。\n\n启动、停止、杀死和恢复作业的功能被称为作业控制。通过作业控制，你可以完全控制进程在你的 shell 环境中运行方式。\n\n\
  本节描述了你用于查看和控制在 shell 中运行的作业的命令。\n\n### 查看作业\n\n作业控制的关键命令是 `jobs` 命令。`jobs` 命令允许你查看\
  \ shell 正在处理的当前作业。列表 27.1 使用 shell 脚本演示了如何查看停止的作业。\n\n列表 27.1 中所示的脚本使用 `$$` 变量来显示\
  \ Linux 系统分配给脚本的 PID；然后它进入循环，每次迭代睡眠 10 秒。在示例中，我从命令行界面启动了第一个脚本，然后使用 `Ctrl+Z` 键组合停止它。接下来，使用\
  \ `&` 符号作为后台进程启动了另一个作业。为了方便起，我将该脚本的输出重定向到一个文件中，这样它就不会显示在显示器上。\n\n在启动了两个作业后，我使用 `jobs`\
  \ 命令查看分配给 shell 的作业。`jobs` 命令显示了停止和运行的作业，以及它们的作业号和在作业中使用的命令。\n\n`jobs` 命令使用了几个不同的命令行参数，如表\
  \ 27.1 所示。\n\n| 参数 | 说明 |\n| --- | --- |\n| `-l` | 列出进程的 PID 及其作业号 |\n| `-n` | 仅列出自\
  \ shell 上次通知以来状态发生变化的作业 |\n| `-p` | 仅列出作业的 PID |\n| `-r` | 仅列出运行中的作业 |\n| `-s` |\
  \ 仅列出停止的作业 |\n\n表 27.1 `jobs` 命令参数\n\n你可能注意到了列表 27.1 输出中的加号和减号。带有加号的作业被视为默认作业。如果在命令行中没有指定作业号，则任何作业控制命令引用的都将该作业。带有减号的作业是在当前默认作业完成后将成为默认作业的作业。无论\
  \ shell 中运行了多少个作业，任何时候都只有一个带加号的作业和一个带减号的作业。\n\n列表 27.2 显示了下一个作业如何接管默认状态的示例。\n\n\
  在列表 27.2 中，我启动并停止了三个独立的进程。`jobs` 命令列表显示了这三个进程及其状态。注意 PID 号，默认进程（带有加号列表出的进程）是 29105，即最后一个启动的进程。\n\
  \n我随后使用 `kill` 命令向默认进程发送了 SIGHUP 信号。在下一次作业列列表中，之前带有减号的作业 29090 现在是默认作业了。\n\n###\
  \ 重启停止的作业\n\n在 Bash 作业控制下，你可以将任何已停止的作业重启为后台进程或前台进程。前台进程会接管你正在工作的终端的控制权，因此在使用该功能时要小心。\n\
  \n要在后台模式下重启作业，请使用 `bg` 命令结合作业号：\n\n\n\n\n```\n $ bg 2\n[2]+ ./test2.sh &\nTest 2\
  \ Loop #2 output\n$ Test 2 Loop #3 output\nTest 2  Loop #4 output\n\n$ jobs\n[1]+\
  \  Stopped                 ./test2.sh\n[2]-  Running                 ./test2.sh\
  \ &\n$ Test 2 Loop #6 output\nTest 2 Loop #7 output\nTest 2 Loop #8 output\nTest\
  \ 2 Loop #9 output\nTest 2 Loop #10 output\nThis is the end of the test2 program\n\
  [2]-  Done                    ./test2.sh\n$\n```\n\n由于我在后台模式下重启了作业，命令行提示符出现了，允许我们继续其他命令。`jobs`\
  \ 命令的输出显示作业确实正在运行（你可以从现在显示器上出现的输出判断出来）。\n\n要在前台模式下重启作业，请使用 `fg` 命令配合作业号：\n\n```\n\
  \ $ jobs\n[1]+  Stopped                 ./test2.sh\n$ fg 1\n./test4\nLoop #2\nLoop\
  \ #3\n```\n\n由于作业在前台模式运行，在作业完成之前，我不会得到新的命令行界面提示符。\n\n## 像时一样运行\n\n我确定，当你开始使用脚本时，会遇到你希望在预设时间运行脚本的情况，通常是你不在场的时候。在预选时间运行脚本有两种常用方法：\n\
  \n*   `at` 命令\n*   `cron` 表格\n\n每种方法都使用不同的技术来调度运行脚本的时间和频率。本节将描述这些方法中的每一种。\n\n###\
  \ 使用 `at` 命令调度作业\n\n`at` 命令允许你指定 Linux 系统运行脚本的时间。它将作业提交到队列，并附带 shell 应何时运行该作业的指示。另一个命令\
  \ `atd` 在后台运行，并检查作业队列是否有需要运行的作业。大多数 Linux 发行版会在系统启动时自动启动它。\n\n`atd` 命令会检查系统上的一个特殊目录（通常是\
  \ `/var/spool/at`），查找使用 `at` 命令提交的作业。默认情况下，`atd` 命令每 60 秒检查一次该目录。当存在作业时，`atd` 命令会检查作业设置运行的时间。如果时间与当前时间匹配，`atd`\
  \ 命令就会运行该作业。\n\n让我们看看如何使用 `at` 命令提交作业运行以及如何管理这些作业。\n\n#### `at` 命令格式\n\n基础的 `at`\
  \ 命令格式非常简单：\n\n```\n at [-f filename] time\n```\n\n默认情况下，`at` 命令将来自 STDIN 的输入提交到队列。你可以使用\
  \ `-f` 参数指定用于读取命令（你的脚本文件）的文件。\n\n`time` 参数指定了你希望 Linux 系统何时运行作业。你可以在指定时间方面充分发挥创意。`at`\
  \ 命令识别许多不同的时间格式：\n\n*   标准的小时和分钟，例如 10:15\n*   AM/PM 标识符，例如 10:15 p.m.\n*   特定的命名时间，例如\
  \ now（现在）、noon（中午）、midnight（午夜）或 teatime（下午 4 点）\n\n如果你指定了一个已经过去的时间，`at` 命令将在次第二天该时间运行作业。\n\
  \n除了指定运行作业的时间外，你还可以使用不同的日期格式包含特定的日期：\n\n*   标准的日期格式，例如 MMDDYY、MM/DD/YY 或 DD.MM.YY\n\
  *   文本日期，例如 Jul 4 或 Dec 25，带不带年份\n*   你还可以指定不同格式的时间增量：\n    *   Now + 25 minutes\n\
  \    *   10:15p.m. tomorrow\n    *   22:15 tomorrow\n    *   10:15 + 7 days\n\n\
  当你使用 `at` 命令时，作业会被提交到作业队列。作业队列持有 `at` 命令提交的待处理作业。共有 26 个不同的作业队列用于不同的优先级级别。作业队列使用小字母\
  \ `a` 到 `z` 进行引用。\n\n默认情况下，所有 `at` 作业都提交到作业队列 `a`（最高优先级队列）。如果你想以较低优先级运行作业，可以使用 `-q`\
  \ 参数指定字母。\n\n#### 获取作业输出\n\n当作业在 Linux 系统上运行时，没有与作业关联的显示器。相反，Linux 系统使用提交作业用户的电子邮件地址。任何发往\
  \ STDOUT 或 STDERR 的输出都会通过邮件系统发送给用户。\n\n列表 27.3 显示了使用 `at` 命令调度作业运行的简单示例。\n\n如列表\
  \ 27.3 所示，当我运行 `at` 命令时，它产生了一条警告信息，指示系统使用什么 shell 来运行脚本（分配给 `/bin/sh` 的默认 shell，对于\
  \ Linux 来说是 Bash shell），以及分配给作业的作业号和作业计划运行的时间。\n\n当作业完成时，显示器上不会出现任何内容，但系统会生成一封电子邮件。邮件显示了脚本生成的输出。如果脚本没有产生任何输出，默认情况下它不会生成邮件。你可以通过使用\
  \ `at` 命令中的 `-m` 选项来更改。这会生成一封邮件指示作业已完成，即使脚本没有生成任何输出。\n\n#### 列出待处理作业\n\n`atq` 命令允许你查看系统中哪些待处理的作业：\n\
  \n```\n $ at -f test3.sh 10:15\n warning: commands will be executed using /bin/sh\n\
  \ job 7 at 2022-03-04 10:15\n $ at -f test5 4PM\n warning: commands will be executed\
  \ using /bin/sh\n job 8 at 2022-03-03 16:00\n $ at -f test5 1PM tomorrow\n warning:\
  \ commands will be executed using /bin/sh\n job 9 at 2022-03-04 13:00\n $ atq\n\
  \ 7       2025-03-04 10:15 a\n 8       2025-03-03 16:00 a\n 9       2025-03-04 13:00\
  \ a\n $\n```\n\n作业列表显示了作业号、系统运行作业的日期和时间，以及存储作业的作业队列。\n\n#### 删除作业\n\n在了解作业队列中哪些待处理作业的信息后，可以使用\
  \ `atrm` 命令删除待处理的作业：\n\n```\n $ atrm 8\n $ atq\n 7       2025-03-04 10:15 a\n 9\
  \       2025-03-04 13:00 a\n $\n```\n\n只需指定你想删除的作业编号即可。你只能删除自己提交执行的作业。不能删除别人的作业。\n\
  \n### 调度定期脚本\n\n使用 `at` 命令在预设时间调度脚本很棒，但如果你需要脚本每天、每周或每月运行一次该怎么办？与其不断提交 `at` 作业，你可以使用\
  \ Linux 系统的另一项功能。\n\nLinux 系统使用 `cron` 程序来调度需要定期运行的作业。`cron` 程序在后台运行，并检查名为 cron\
  \ 表的特殊表格查找计划运行的任务。\n\n#### cron 表\n\n`cron` 表使用特殊格式允许你指定何时运行作业。`cron` 表的格式如下：\n\n\
  ```\n min hour dayofmonth month dayofweek command\n```\n\n`cron` 表允许你指定特定值、值范围（例如\
  \ 1–5）或通配符（星号）。例如，如果你想每天上午 10:15 运行一个命令，你将使用 `cron` 表条目：\n\n```\n 15 10 * * * command\n\
  ```\n\n由于 `cron` 表无法指示 a.m. 或 p.m.，你需要使用 24 小时制格式来表示 p.m. 时间。`dayofmonth`、`month`\
  \ 和 `dayofweek` 字段中的通配符表示 `cron` 将在每月每日的上午 10:15 执行该命令。要指定每周一下午 4:15 运行一个命令，你将使用：\n\
  \n```\n 15 16 * * 1 command\n```\n\n你可以将 `dayofweek` 条目指定为三字符文本值（`mon`、`tue`、`wed`、`thu`、`fri`、`sat`、`sun`）或数值，\
  \ 0 代表星期日，6 代表星期六。\n\n这是另一个例子。要在每月 1 号正午执行命令，你将使用如下格式：\n\n```\n 00 12 1 * * command\n\
  ```\n\n`dayofmonth` 条目指定了月份的日期值（1–31）。\n\n\n\n\n\n在指定要运行的命令或 shell 时，你必须使用其完整路径。你可以像使用普通命令行一样，添加你喜欢的任何命令行参数或重定向符号：\n\
  \n```\n15 10 * * * /home/rich/test4.sh > test4out\n```\n\n`cron` 程序使用提交作业的用户账户运行脚本。因此，你必须拥有适当的权限来访问命令列表中指定的命令和输出文件。\n\
  \n### 构建 `cron` 表\n\n所有系统用户（包括 root 用户）都可以拥有自己的 cron 表，用于运行调度作业。Linux 提供了 `crontab`\
  \ 命令来处理 `cron` 表。要列出现有的 `cron` 表，请使用 `-l` 参数：\n\n```\n$ crontab -l\n no crontab\
  \ for rich\n $\n```\n\n要向你的 `cron` 表中添加条目，请使用 `-e` 参数。当你执行该操作时，`crontab` 命令会自动启动\
  \ `vi` 编辑器并打开现有的 `cron` 表；如果文件不存在，则打开一个空文件。\n\n### 使用 `systemd` 计时器\n\n利用 `systemd`\
  \ 启动方法的系统（参见第 6 章”）也可以使用 `systemd` 计时器功能自动启动程序。计时器单元文件允许你定义在特定日期或时间发生的事件，类似于 `cron`\
  \ 程序的工作方式。然而，计时器单元文件允许你精确控制程序启动的时间。\n\n计时器单元文件以 `.timer` 扩展命名，并包含一个 `[Timer]` 部分，用于定义确定何时启动事件所需的指令。表\
  \ 27.2 描述了这些指令。\n\n| 指令 | 描述 |\n| --- | --- |\n| `AccuracySec` | 指定计时器的精度。默认为一分钟精度。\
  \ |\n| `OnActiveSec` | 定义计时器相对于激活时刻的间隔。 |\n| `OnBootSec` | 定义计时器相对于系统启动时间的间隔。 |\n\
  | `OnCalendar` | 将计时器定义为特定的日期/时间值。 |\n| `OnStartupSec` | 定义计时器相对于 systemd 程序启动时间的间隔。\
  \ |\n| `OnUnitActiveSec` | 定义计时器相对于计时器单元上次激活时间的间隔。 |\n| `OnUnitInactiveSec` | 定义计时器相对于计时器单元上次停止激活时间的间隔。\
  \ |\n| `Persistent` | 设置后，计时器单元上次触发的时间将存储在磁盘上。 |\n| `RandomizedDelaySec` | 通过随机时间延迟计时器的激活。\
  \ |\n| `RemainAfterElapse` | 设置后，过期的计时器单元将保持加载状态，允许你使用 `systemctl` 查询其状态。 |\n| `Unit`\
  \ | 定义在计时器过期启动的单元文件。 |\n| `WakeSystem` | 设置后，计时器单元将导致系统从挂起状态恢复。 |\n\n表 27.2 常用的计时器单元文件\
  \ `[Timer]` 部分指令\n\n如你从表 27.2 中所示，计时器单元为设置计时器提供了多种 `cron` 程序不具备的选项，例如程序自上次完成以来的时间。这允许你精确选择程序在系统上的启动时间。\n\
  \n接下来的练习将引导你学习如何在 Linux 系统上操作作业。\n\n## 总结\n\n默认情况下，当你在终端会话中运行脚本时，交互式 shell 会挂起直到脚本运行完成。你可以通过在命令名后添加与符号（`&`）让脚本或命令在后台模式运行。当你以后台模式运行脚本或命令时，交互式\
  \ shell 会返回，允许你继续输入更多命令。使用此方法运行的任何后台进程仍然绑定到终端会话。如果你退出了终端会话，后台进程也会退出。\n\n为了防止这种情况发生，请使用\
  \ `nohup` 命令。该命令会拦截任何发送给命令并导致其停止的信号，例如当你退出终端会话时。这允许脚本即使在你退出终端会话后继续在后台模式运行。\n\n当你将进程移动到后台模式时，你仍然可以控制它的运行情况。`jobs`\
  \ 命令允许你查看从 shell 会话启动的进程。一旦你知道了后台进程的作业 ID，就可以使用 `kill` 命令向进程发送 Linux 信号，或者使用 `fg`\
  \ 命令将进程带回 shell 会话的前台。你可以通过使用 `Ctrl+Z` 组合键暂停运行的前台进程，然后使用 `bg` 命令将其放回后台模式。\n\n除了控制运行中的进程外，你还可以确定进程在系统上的启动时间。与其直接从命令行提示符运行脚本，不如可以调度进程在其他时间运行。有几种不同的方法可以实现这一点。`at`\
  \ 命令允许你在预设时间运行一次脚本。`cron` 程序提供了一个可以按定期调度间隔运行脚本的接口。\n\n## 考试要点\n\n**描述如何从控制台或终端会话以后台模式运行\
  \ shell 脚本。** 要以后台模式运行 shell 脚本，请在 shell 脚本后添加与符号（`&`）。\n\n**解释如何将 shell 脚本与控制台断开，以便在控制台退出后继续运行。**\
  \ `nohup` 命令将脚本与会话断开，使其继续运行。\n\n**解释如何停止或暂停在前台运行的 shell 脚本。** 要暂停控制台或终端会话中运行的脚本，请按下\
  \ `Ctrl+Z` 组合键。\n\n**描述如何列出在后台模式运行的脚本。** `jobs` 命令显示由 shell 分配的作业号和系统分配的进程 ID（PID）。\n\
  \n**描述如何在特定时间运行 shell 脚本。** `at` 命令允许你调度作业在特定时间运行。\n\n**解释如何在设定时间自动运行 shell 脚本。**\
  \ `cron` 程序通过检查 `crontab` 表来检查已调度待运行的作业。\n\n## 复习题\n\n1. Frank 想要在他的控制台会话以后台模式运行他的数字计算程序。他需要使用什么命令来实现？\n\
  \   - `>`\n   - `&`\n   - `|`\n   - `>>`\n   - `nohup`\n\n2. 你使用什么命令将 shell 脚本与当前控制台断开，以便在控制台退出后继续运行？\n\
  \   - `>`\n   - `&`\n   - `|`\n   - `>>`\n   - `nohup`\n\n3. 当 Melanie 运行一个 shell\
  \ 脚本时，她注意到它占满了 Linux 系统所有的内存，她需要停止它。她应该如何做？\n   - 使用 `nohup` 命令启动它。\n   - 使用与符号（`&`）命令启动它。\n\
  \   - 在脚本运行时按下 `Ctrl+C`。\n   - 使用管道符号重定向输出。\n   - 使用 `kill` 命令停止它。\n\n4. 你如何临时暂停控制台会话中在前台模式运行的\
  \ shell 脚本？\n   - 按下 `Ctrl+Z`。\n   - 按下 `Ctrl+C`。\n   - 使用 `nohup` 命令启动命令。\n\n\n\
  \n\n\n4. 使用连接符 (`&`) 启动命令。\n5. 使用 `fg` 命令启动命令。\n\n### 5. 如何确定控制台会话中运行的默认作业？\n1.\
  \ 通过 PID 号\n2. 通过作业号\n3. 通过 `jobs` 输出中作业号旁边的加号 (+)\n4. 通过 `jobs` 输出中作业号旁边的减号 (-)\n\
  5. 使用 `ps` 命令\n\n### 6. Barbara 在她的控制台会话中有一个以后台模式运行的应用程序，需要将其切换到前台模式。她应该使用哪个命令来操作？\n\
  1. `bg`\n2. `fg`\n3. `nohup`\n4. `&`\n5. `at`\n\n### 7. 哪个命令允许你在特定时间运行 shell 脚本？\n\
  1. `nohup`\n2. `&`\n3. `at`\n4. `|`\n5. `>`\n\n### 8. Nick 需要每天午夜在他的 Linux 系统上运行一份报告。他应该如何做？\n\
  1. 使用 `at` 命令调度作业。\n2. 使用 `nohup` 命令运行作业。\n3. 使用连接符 (`&`) 符号运行作业。\n4. 使用 `cron`\
  \ 调度作业。\n5. 使用 `atq` 命令运行作业。\n\n### 9. `cron` 表条目 `10 5 * * * myscript` 将于何时运行指定的\
  \ shell 脚本？\n1. 每天上午 10:05\n2. 每年 5 月 10 日\n3. 每年 10 月 5 日\n4. 每天下午 5:10\n5. 每天凌晨\
  \ 5:10\n\n### 10. Jane 需要检查她的用户账户安排了哪些自动运行的作业。她应该使用哪个命令列出其用户账户的 `cron` 表条目？\n1.\
  \ `cron`\n2. `at`\n3. `crontab`\n4. `jobs`\n5. `nohup`\n\n# 第 28 章\n## 使用 Git 控制版本\n\
  \n![](img/chaptersquare.png)\n\nLinux 是一个流行的开发平台。如果你为程序员管理系统，理解他们所使用的各种工具是非常关重要的。此外，你可能会发现自己正在编写复杂的\
  \ shell 脚本，这些脚本需要类似的工具。在本章中，我将带你了解版本控制的概念以及实现它的流行 Git 工具。\n\n***\n\n## 理解版本控制\n\n\
  两个软件开发人员 Natasha 和 Bruce 正在努力开发一个名为 StoneTracker 的新项目。由于所有的修改和修订，该项目被分为几个程序文件，现在的文件名类似于\
  \ `UI-3.2.A-73.py`。Natasha 和 Bruce 不断地告诉对方自己正在处理哪个文件，以防对方意外覆盖。此外，他们创建了多个目录树来存储各种项目文件的修订版本。项目由于这些复杂性以及额外的通信而变得进展缓慢。这些开发者需要版本控制。版本控制（也称为源码控制或修订控制）是一种组织各种项目文件并保护其修改的方法或系统。\n\
  \n版本控制系统 (VCS) 提供了一个通用的中心来存储和合并项目文件，以便你可以访问最新的项目版本。它保护文件，防止文件被其他开发者覆盖，并消除了任何关于谁正在修改该文件的额外通信。\n\
  \n额外的益处包括新开发者加入项目的情况。例如，如果 Tony 是一个新团队成员，他可以通过版本控制系统复制最新的 StoneTracker 项目文件并开始工作。\n\
  \n分布式版本控制系统 (VCSs) 让项目变得更加简单。开发者可以离线工作，而无需担心是否连接到网络。开发工作在他们自己的系统上本地进行，直到他们将修改后的文件副本和\
  \ VCS 元数据发送到远程中心系统。只有在那时才需要网络连接。一个侧面好处是，现在工作被备份到了中心位置。\n\nGit 是一个分布式 VCS，通常用于敏捷和持续软件开发环境。要理解\
  \ Git 的底层原理，你需要了解一些关于其配置的术语。图 28.1 显示了 Git 环境的概念图。\n\n![流程图描述了工作目录、暂存区、本地仓库和远程仓库之间的工作流交互](img/c28f001.png)\n\
  \n图 28.1 Git 环境的概念图\n\n*   **工作目录 (Working Directory)**：工作目录是创建、修改和审查所有程序文件的地方。它通常是开发者家目录树的一个子目录。根据工作需求，开发者的计算机可以是本地服务器或笔记本电脑。\n\
  *   **暂存区 (Staging Area)**：暂存区也称为索引 (index)。该区域位于与工作目录相同的系统中。工作目录中的程序通过 Git 命令 (`git\
  \ add`) 注册到暂存区。暂存区使用名为 `.git` 的隐藏子目录，该目录是通过 `git init` 命令创建的。\n*   当文件被分类到暂存区时，Git\
  \ 在索引文件 `.git/index` 中创建或更新有关这些文件的信息。数据包括校验和、时间戳和关联的文件名。\n*   除了更新 `index` 文件外，Git\
  \ 还会压缩程序文件并将压缩后的文件作为对象 (object)（也称为 blob）存储在 `.git/objects/` 目录中。如果程序文件已被修改，它会被压缩并作为新对象存储在\
  \ `.git/objects/` 目录中。Git 不仅仅存储文件的修改；它保留了每个修改文件的压缩副本。\n*   **本地仓库 (Local Repository)**：本地仓库包含每个项目文件的历史。它也使用了\
  \ `.git` 子目录。项目树和提交信息通过 Git 命令 (`git commit`) 以对象的形式存储在 `.git/objects/` 目录中。这些数据被称为快照\
  \ (snapshot)。每次 `commit` 都会创建一个新的快照。可以查看旧快照，并在需要时恢复到之前的版本。\n*   **远程仓库 (Remote Repository)**：远程仓库通常是一个云端位置。根据项目需求，它也可以是本地网络上的另一个服务器。著名的远程仓库包括\
  \ GitHub、GitLab、BitBucket 和 Launchpad。但到目前为止，GitHub 是最流行的。\n\n使用 Git 作为你的 VCS 具有以下优点：\n\
  \n*   **性能**：除了向远程仓库发送/检索文件外，Git 只使用本地文件进行操作，使其运行更快。\n*   **历史记录**：Git 在文件注册到索引的时刻捕捉所有文件内容。当向本地仓库完成\
  \ `commit` 时，Git 会创建并存储指向该时间快照的引用。\n*   **准确性**：Git 使用校验和来保护文件完整性。\n*   **去中心化**：开发者可以在同一个项目上工作，但他们并不非要处于同一个网络或系统上。\n\
  \n较较旧的 VCS 要求开发者位于同一个网络中，这没有提供很大的灵活性。它们的操作速度也较慢，这也是 Linus Torvalds 决定创建 Git 的原因之一。\n\
  \n## 设置你的 Git 环境\n\nGit 工具通常不会默认安装。因此，在设置 Git 环境之前，你需要安装 `git` 软件包。请参阅第 13 章“管理软件](#c013.xhtml_c013)”了解有关软件包安装的详情。\n\
  \n在系统上安装好 `git` 软件包后，为新项目设置 Git 环境有四个基本步骤：\n\n1. 创建工作目录。\n2. 初始化 `.git/` 目录。\n3.\
  \ 设置本地仓库选项。\n4. 建立你的远程仓库。\n\n\n\n\n\n要启动新项目的流程，请创建一个工作目录。在你的本地主文件夹中创建一个子目录即可。示例见列表\
  \ 28.1。\n\n在列表 28.1 中，为项目创建了一个名为 `MWGuard` 的简单子目录。创建工作目录后，使用 `cd` 命令将你的当前工作目录进入该目录。\n\
  \n在工作目录中，初始化 `.git/` 目录。此任务通过 `git init` 命令完成。示例见列表 28.2。\n\n`git init` 命令会显示一条提示信息，说明它正在使用默认的\
  \ `master` 作为分支名称，然后创建 `.git/` 子目录。由于目录名以点（`.`）开头，因此它在普通的 `ls` 命令中是隐藏的。请使用 `ls -a`\
  \ 命令或将目录名作为 `ls` 命令的参数（如列表 28.2 所示），以查看其元数据。\n\n如果这是你第一次在系统中构建 `.git/` 子目录，请修改全局\
  \ Git 仓库配置文件以包含你的用户名和电子邮件地址。这些信息有助于跟踪文件更改。`git config` 命令允许你执行此任务，如列表 28.3 所示。\n\
  \n通过在列表 28.3 的 `git config` 命令中包含 `--global`，`user.name` 和 `user.email` 数据将存储在全局\
  \ Git 配置文件中。注意，你可以使用 `--get` 选项并将数据名称作为参数来查看这些信息。\n\nGit 配置信息存储在全局 `~/.gitconfig`\
  \ 文件和本地仓库（即 `working-directory/.git/config` 配置文件）中。（某些系统还有一个系统级配置文件 `/etc/gitconfig`）。要查看所有各种配置，请使用\
  \ `git config --list` 命令，如列表 28.4 所示。\n\n通过 `--list` 选项显示的设置使用 `file-section.name`\
  \ 格式。注意，当在列表 28.4 中通过 `cat` 命令将两个 Git 配置文件（全局和项目的本地仓库）输出到标准输出（STDOUT）时，节名称将与它们包含的数据一起显示。\n\
  \n当你的本地 Git 环境配置完成后，是时候建立项目的远程仓库了。为了演示，我选择了云端远程仓库 GitHub。如果你想跟着操作，可以在 `http://github.com/join`\
  \ 设置一个免费的远程仓库。\n\n建立项目的远程仓库后，你需要记录它提供的 URL。此网页地址用于将你的项目文件发送到远程仓库，这将在本章稍后部分介绍。\n\n\
  ## 使用 Git 提交\n\n当你建立好 Git 环境后，就可以开始使用版本控制了。分为以下四个步骤：\n\n1. 创建或修改程序文件。\n2. 将文件添加到暂存区（索引）。\n\
  3. 将文件提交（commit）到本地仓库。\n4. 将文件推送（push）到远程仓库。\n\n根据你团队的工作流，你可能在进行下一步之前重复某些步骤。例如，在一天之内，程序员会在完成文件后将其添加到暂存区。在一天结束时，开发者将项目提交到本地仓库，然后将项目工作推送到远程仓库，供非本地团队成员访问。\n\
  \n在列表 28.5 中，创建名为 `MyScript.sh` 的简单 shell 脚本作为 Git VCS 示例。\n\n程序创建（或修改）后，添加到暂存区（索引）。这是通过\
  \ `git add` 命令完成的，如列表 28.6 所示。文件位于工作目录，你在该目录下执行 `git add` 命令。\n\n`git add` 命令在执行时不会提供任何响应。因此，为了查看它是否按预期工作，请使用\
  \ `git status` 命令，如列表 28.6 所示。`git status` 显示新文件 `MyScript.sh` 已添加到索引，但尚未提交。同样注意名称\
  \ `branch master`。Git 分支将在本章稍后介绍。\n\n你可以同时将当前工作目录中的所有文件添加到暂存区索引中。要实现此操作，请发布 `git\
  \ add.` 命令。注意命令末尾的点（`.`）。它实际上是一个通配符，告诉 Git 将工作目录中的所有文件添加到索引。\n\n暂存区索引的文件名为 `.git/index`，当在列表\
  \ 28.7 中使用 `file` 命令处理它时，文件类型显示为 Git index。Git 使用此文件来跟踪文件的更改。\n\n流程的下一步是将项目提交到本地仓库。这将创建一个项目快照，其中包含项目当前的树结构和提交数据等信息。Git\
  \ 将这些数据存储在 `.git/` 目录中。提交通过 `git commit` 命令完成，如列表 28.8 所示。`-m` 选项为 `COMMIT_EDITMSG`\
  \ 文件添加一行注释，有助于跟踪更改。在项目后期后期进行提交时，在 `-m` 参数中包含额外信息是有帮助的，例如 `-m \"Presentation Layer\
  \ Commit\"`。\n\n当你将项目提交到本地仓库后，`git status` 命令将显示列表 28.8 所示的消息，指示所有文件都已提交。\n\n现在项目已提交到本地仓库，就可以通过推送到远程仓库来与其他开发团队成员共享。如果项目已完成，你还可以与你指定的人或全世界共享。\n\
  \n如果这是一个新项目，在你设置好远程仓库账户后，创建一个名为 `README.md` 的 Markdown 文件。该文件的内容显示在远程仓库的网页上并描述仓库。它使用了所谓的\
  \ `Markdown` 语言。创建此文件、将其添加到暂存区索引并提交到本地仓库的示例见列表 28.9。\n\n你可以随时查看 Git 日志（log），但在将项目推送到远程仓库之前查看总是一个好主意。查看日志的示例见列表\
  \ 28.10。每个提交都给有一个哈希值来识别，显示在日志中。此外，注意不同的注释行以及日期以及作者信息。\n\n在将项目推送到远程仓库之前，你需要在系统中配置它的地址。这是通过\
  \ `remote add origin URL` 命令完成的，其中 `URL` 是远程仓库的地址。示例见列表 28.11。\n\n注意在列表 28.11 中，你可以通过\
  \ `git remote -v` 命令检查远程地址的状态。在推送项目之前检查地址是一个好主意。\n\n配置好远程仓库 URL 后，将项目推送到它的位置。示例见列表\
  \ 28.12。\n\n通常远程仓库会要求用户名和密码，除非你已将其设置为使用 SSH 密钥（OpenSSH 已在第 16 章“查看访问和身份验证方法”中介绍过）。当项目推送到远程仓库后，你应该能够看到它。如果它是私有仓库，你需要登录远程仓库才能看到你的工作。\n\
  \n\n\n\n远程仓库非常棒的一点是，你的项目团队可以使用 `git pull` 命令获取项目的最新文件。你需要为他们设置对远程仓库的访问权限，或者将其公开。拉取文件的摘录示例在列表\
  \ 28.13 中所示。\n\n新的开发团队成员可以使用 `git clone` 命令从远程仓库将*整个*项目（包括 `.git/` 文件）复制到他们的本地系统。摘录示例在列表\
  \ 28.14 中所示。\n\n当从远程仓库克隆项目时，会自动创建工作目录，以及 `.git/` 目录、Git 暂存区（index）和本地仓库。`git log`\
  \ 命令显示项目的历史。对于新团队成员来说，这是获取开始工作项目所需内容的简单方法。\n\n## 标签 (Tags)\n\n当你开始向项目提交新版本的文件，并且项目历史变得越来越长，情况可能会迅速变得混乱。为了帮助维持组织结构，Git\
  \ 软件提供了*标签（tagging）*。\n\n标签允许你使用额外信息（如发布版本号）对特定的提交版本进行标记。然后，你可以根据分配的标签轻松地引用仓库中的特定版本。\n\
  \nGit 中提供两种标签格式：\n\n*   **轻量级标签 (Lightweight):** 仅包含标签名\n*   **注释标签 (Annotated):**\
  \ 包含标签名以及可以提供更多信息以帮助识别版本的元数据\n\n要创建一个轻量级标签，只需使用 `git tag` 命令配合标签名：\n\n```\n $ git\
  \ tag v2.0\n$\n```\n\n该命令不返回任何信息，但你可以通过不带任何参数的 `git tag` 命令来验证标签已创建，该命令会列出现有的标签：\n\
  \n```\n $ git tag\nv0.1\nv1.0\nv1.5\nv2.0\n$\n```\n\n要创建一个注释标签，请包含 `-a` 参数以及 `-m`\
  \ 参数来指定你想添加的描述文本：\n\n```\n $ git tag -a v2.1 -m \"development code for 2.0 branch\"\
  \n$\n```\n\n标签可以帮助你区分生产版本和开发版本，更容易识别提交历史中何时发生了发布更改。\n\n## 合并版本 (Merging Versions)\n\
  \nGit 中一个非常有用的概念是分支。*分支（branch）*是本地仓库中用于项目特定部分的区域。默认情况下，Git 将你的工作存储在 `master` 分支中，如列表\
  \ 28.15 所示。\n\n一个项目可以有多个分支。一个简单的例子是为生产软件设置一个分支 (`master`)，为开发中的软件设置一个分支 (`develop`)，为测试开发更改设置一个分支\
  \ (`test`)。你可以指定要工作的分支，防止另一个分支中的文件被更改。使用该示例，你肯定不想让开发代码文件进入生产分支（`master`）。相反，你希望它们在\
  \ `develop` 分支中维护，直到它们在 `test` 分支中通过测试并准备好绪。\n\n让我们来看一个需要分支的项目。StoneTracker 项目正处于生产状态，其文件通过\
  \ `master` 分支管理，如列表 28.16 所示。\n\n注意列表 28.16 中的 `* master` 行。星号 (`*`) 表示当前分支是 `master`\
  \ 且它是唯一的分。如果有更多分支，它们也会被显示。当前分支旁边始终有一个星号。\n\n你可以通过使用 `git ls-tree` 命令查看特定分支内的文件名。StoneTracker\
  \ 项目的提交文件在列表 28.17 中所示。\n\n在 `master` 分支（生产环境）中，StoneTracker 项目目前通过其业务层 `ST-Main.py`\
  \ 使用基于文本的用户界面。开发团队需要添加一个表现层，该层将提供 GUI 用户界面。为了在不影响生产环境的情况下创建此新程序，他们使用列表 28.18 中所示的\
  \ `git branch` 命令为项目创建一个新分支。\n\n注意列表 28.18，当创建新分支 `develop` 时，它并没有被设置为当前分支。要切换分支，需要使用\
  \ `git checkout` 命令，如列表 28.19 所示。\n\n现在切换了分支，就可以对新的用户界面 (`ST-UI.py`) 进行开发，而不会影响\
  \ `master` 分支。然而，仍然在使用 Git VCS，如列表 28.20 所示。\n\n当对新用户界面的开发（和测试）完成后，会将 `develop`\
  \ 分支合并到 `master` 分支（生产环境）。要合并分支，使用 `git merge branch-name-to-merge` 命令。合并必须从目标分支执行。因此，在这种情况下，你必须在发布命令之前返回\
  \ `master` 分支，如列表 28.21 摘录所示。\n\n注意列表 28.21，现在 `master` 分支内管理着新的生产层程序 `ST-UI.py`。同样注意两个分支之间的\
  \ Git 日志也已合并，如 `git log` 命令所示。\n\n## 总结 (Summary)\n\n分布式 VCS 工具 Git 在开发者需求之外的许多方面都有用。理解如何设置工作目录、暂存区以及本地和远程仓库是一项极佳的技能。你不仅能够与程序员使用适当的术语，还可以将\
  \ Git 应用于其他许多有用用途来管理你的 Linux 系统。\n\n## 考试要点 (Exam Essentials)\n\n**描述版本控制。** 版本控制是一种组织各种项目文件并保护对其进行修改的方法或系统。分布式\
  \ VCS 允许开发者离线和独立地工作。Git VCS 提供了工作目录、暂存区（index）和本地仓库，并使用第三方提供的远程仓库。它因其高性能、维护修改记录和去中心化而广受欢迎。\n\
  \n**解释如何设置你的 Git 环境。** `git` 包提供了用于各种 VCS 的各种工具。使用 `mkdir` 命令为每个项目创建一个工作目录。用于暂存区和本地仓库的\
  \ `.git/` 目录通过 `git init` 命令初始化。最后，第三方（如 GitHub）可以提供供使用的远程仓库。\n\n**详细阐述使用 Git 进行提交。**\
  \ 根据需要，通过 `git add` 工具将文件从工作目录移动到暂存区（index）。项目的工作流决定了何时通过 `git commit` 命令将程序移动到本地目录，然后通过\
  \ `git push` 工具推送到远程仓库。如果远程开发者需要最新的项目文件，则使用 `git pull` 命令。对于需要包括修改历史在的所有项目文件的新团队成员，使用\
  \ `git clone` 命令。\n\n**总结 Git 分支。** Git 分支是本地仓库中用于项目特定部分（如开发或项目测试）的区域。默认情况下，主分支被称为\
  \ `master` 分支。使用 `git branch branch-name` 命令创建新分支。你可以使用 `git branch` 工具查看可用分支，它使用星号表示当前分支。要切换到另一个项目分支，使用\
  \ `git checkout branch-name`。在完成分支工作后，其 VCS 文件和项目文件可以通过 `git merge branch-name-to-merge`\
  \ 命令与另一个分支合并。\n\n## 复习题 (Review Questions)\n\n1. 关于版本控制，以下哪项是正确的？（选择所有适用项。）\n\n\
  \    1. 提供一个合并和存储文件的公共位置\n    2. 要求文件名包含版本号\n\n\n\n3. 可能分发也可能不分发\n4. 文件不被覆盖\n5.\
  \ 可以处理程序以外的文件\n\n2. 从概念上来说，Git 被划分为不同的区域。以下是这些区域中的哪一个？（选择多项。）\n\n1. Blob\n2. 本地仓库\n\
  3. 远程仓库\n4. 索引 (Index)\n5. 工作目录\n\n3. 以下哪些是首次设置 Git 环境运行所需的步骤？（选择多项。）\n\n1. 创建工作目录。\n\
  2. 在工作目录中初始化 `.git/` 目录。\n3. 设置本地仓库选项。\n4. 准备好后将文件添加到暂存区（staging area）。\n5. 建立远程仓库。\n\
  \n4. Natasha 为新项目创建了工作目录。她接下来应该做什么来设置她的 Git 项目环境？\n\n1. 执行 `mkdir` 命令。\n2. 输入 `git\
  \ config --list` 命令。\n3. 设置她的 GitHub 仓库。\n4. 输入 `git init` 命令。\n5. 开始创建她的程序文件。\n\
  \n5. 当 Bruce 设置 Git 配置选项时，他在命令中使用了 `--global` 选项。这意味着什么？\n\n1. 配置信息存储在 GitHub 上。\n\
  2. 配置信息存储在 `~/.gitconfig` 中。\n3. 配置信息存储在工作目录的 `.git/config` 文件中。\n4. 配置信息存储在工作目录的\
  \ `.git/index` 文件中。\n5. 配置信息存储在工作目录的 `.git/objects` 目录中。\n\n6. Bruce 已经设置好了 Git\
  \ 环境并完成了他的新 `GreenMass.sh` 脚本的工作。他接下来应该做什么？\n\n1. 将脚本添加到暂存区。\n2. 执行 `git init` 命令。\n\
  3. 将脚本提交到本地仓库。\n4. 执行 `git log` 命令。\n5. 将脚本提交到远程仓库。\n\n7. Natasha 的工作目录中有 25 个文件，她只想将其中\
  \ 22 个文件添加到索引。她计划使用 `git add .` 命令来提高效率。她应该怎么做？\n\n1. 将这三个文件移出工作目录。\n2. 通过 `git\
  \ add` 命令逐个添加 22 个文件。\n3. 为这三个文件创建一个新的工作目录。\n4. 将这三个文件名添加到 `.gitignore` 文件中。\n5.\
  \ 临时删除这三个文件。\n\n8. Natasha 完成了她的开源项目，该项目计划今天公开发。她已经将文件移动到暂存区，将工作提交到本地仓库，并配置了远程仓库的地址。她的下一步是什么？\n\
  \n1. 回家休息。她应得。\n2. 将远程仓库克隆到她的本地系统。\n3. 将她的项目推送到远程仓库。\n4. 从远程仓库拉取她的项目。\n5. 使用 `remote\
  \ add origin` `URL` 命令。\n\n9. 以下哪个命令允许你切换到一个名为 `testing` 的新 Git 分支？\n\n1. `git branch\
  \ testing`\n2. `git ls-tree --name-only -r testing`\n3. `git branch`\n4. `git commit\
  \ -m \"testing\"`\n5. `git checkout testing`\n\n10. Tony 为 StoneTracker 创建了一个名为\
  \ `report` 的新分支。他已经完成并测试了他的工作。他现在需要将其与 StoneTracker 项目的 `master` 分支合并。在切换到 `master`\
  \ 分支后，他应该使用哪个命令？\n\n1. `git merge master`\n2. `git merge report`\n3. `git rebase\
  \ master`\n4. `git rebase report`\n5. `git checkout master`\n\n# 第七部分：实现虚拟化和云环境\n\
  \n# 第 29 章：理解云和虚拟化概念\n\n![](img/chaptersquare.png)\n\n云技术极大地改变了计算机世界的格局。将计算机资源和应用程序移动到共享网络环境中，改变了许多公司经营业务和向客户提供服务的方式。本章介绍了云的核心概念，以及\
  \ Linux 在云计算中扮演的角色。本章首先定义了什么是云计算以及不同类型的云计算环境。接下来讨论了虚拟化如何在云计算中发挥重要作用，以及它如何在 Linux\
  \ 中实现。最后，本章解释了容器如何融入云计算，以及它们是如何改变开发者工作方式的\n\n***\n\n## 考虑云服务\n\n在深入研究 Linux 如何参与云计算之前，定义云以及它提供什么类型的资源是一个好主意。\n\
  \n### 什么是云计算？\n\n`cloud` 一词最早出现在 1977 年原始 ARPAnet 网络环境的文档，它是现代互联网的前身。在那个文档中，云符号通常用于表示地理上分散的互连服务器的大网络。然而，在这种环境中，每个服务器都是自包含和自给自足的；没有分布式计算。\n\
  \n`云计算` 一词与分布式计算有关。在分布式计算中，资源在两个或多个服务器之间共享以完成单项任务，例如运行应用程序。这种环境变成了我们今天所知的云计算的前身，并由\
  \ Amazon Web Services (AWS)、Google Cloud Platform 和 Microsoft Azure 等公司推普及。\n\n\
  通过云计算，你可以跨互联网交付计算资源。现在客户可以根据需要从云计算供应商处购买硬件和软件资源。这包括服务器、存储空间、数据库、网络、操作系统，甚至单个应用程序。\n\
  \n图 29.1 展示了提供云计算服务的种不同方法。\n\n![插图描述了三种主要方法，包括私有云、混合云和公有云，强调了它们之间的相互作用。](img/c29f001.png)\n\
  \n图 29.1 云计算方法\n\n如图 29.1 所示，提供云计算环境主要有三种方法：\n\n*   **公有 (Public)：** 在公有云计算环境中，由第三方提供组织之外的所有计算资源。这池资源通常在多个也能访问该平台的组织之间共享。\n\
  *   **私有 (Private)：** 在私有云计算环境中，每个独立组织构建自己的云计算资源来向内部提供资源。\n*   **混合 (Hybrid)：**\
  \ 在混合云云计算环境中，计算资源在组织内部提供，但同时也连接到外部公有云，以便在需要时补充资源。\n\n### 什么是云服务？\n\n云计算环境可以根据每个客户的需求自定义提供给客户的资源水平。以下章节介绍了云计算供应商提供的三种最流行的资源水平模型。\n\
  \n#### 基础设施即服务 (IaaS)\n\n在基础设施即服务 (IaaS) 模型中，云计算供应商提供低级服务器资源来为组织托管应用程序。这些低级资源包括物理服务器所需的所有组件，包括\
  \ CPU 时间、内存空间、存储空间和网络资源，如图 29.2 所示。\n\n![插图展示了云中的服务器硬件和 IaaS 托管，支持操作系统和客户处理的 3 个虚拟机或应用程序。](img/c29f002.png)\n\
  \n图 29.2 IaaS 云模型\n\n\n\n\n\n提供的服务器资源可能位于单台服务器上，也可能分布在多台服务器上。在分布式环境中，服务器可能共同位于某处设施内，也可能分散在位于不同城市的多个设施中。这有助于提高可用性。\n\
  \n如图 29.2 所示，在 IaaS 模型中，客户提供操作系统以及其运行所需的任何应用程序。大多数 IaaS 环境支持 Linux 或 Windows 操作系统。客户负责操作系统所需的任何系统管理工作以及任何应用程序管理工作。云计算提供商则负责维护物理基础设施环境。\n\
  \n## 平台服务 (PaaS)\n\n在平台服务（PaaS）模型中，云计算提供商为客户提供物理服务器环境以及操作系统环境，如图 29.3 所示。\n\n![服务器硬件、云端\
  \ PaaS 主机、一个操作系统以及由客户处理的 3 个虚拟机或应用程序的插图](img/c29f003.png)\n\n图 29.3 PaaS 云模型\n\n\
  在 PaaS 模型中，云计算提供商负责物理组件以及操作系统管理。它提供系统管理支持，以确保操作系统得到适当的修复和更新，以跟上当前的发布和安全特性。这允许客户主要专注于开发运行在\
  \ PaaS 环境中的应用程序。\n\n## 软件服务 (SaaS)\n\n在软件服务（SaaS）模型中，云计算提供商提供完整的应用程序环境，例如邮件服务器、数据库服务器或\
  \ Web 服务器。提供商提供物理服务器环境、操作系统以及执行功能所需的应用程序软件。如图 29.4 所示。\n\n![SaaS 模型插图描述了客户访问托管在云端服务器硬件和操作系统上的应用程序](img/c29f004.png)\n\
  \n图 29.4 SaaS 云模型\n\n## 理解虚拟化\n\n云计算环境的缺点是它们是计算密集密集型的。运行云计算环境需要大量的计算能力，这可能会变得昂贵。\n\
  \n让云计算成为可能的技术是虚拟化，这也是使得 Linux 成为云计算提供商流行选择的原因。后续章节将描述什么是虚拟化、可用的不同虚拟化类型以及如何在 Linux\
  \ 环境中实现虚拟化。\n\n### 虚拟机管理器 (Hypervisors)\n\n对于运行支持大量客户端应用的组织，标准的性能模型规定您应该将应用程序的不同功能分离到不同的服务器上，如图\
  \ 29.5 所示。\n\n![插图描述了应用程序分离为 Web 服务器、应用程序服务器和数据库服务器以支持客户端](img/c29f005.png)\n\n\
  图 29.5 分离应用程序资源\n\n如图 29.5 所示，应用程序服务器、Web 服务器和数据库服务器位于不同的服务器上。客户仅与前端 Web 服务器通信。Web\
  \ 服务器将连接传递给应用程序，应用程序随后与数据库服务器通信。从性能的角度来看，这种模型是合理的，因为你为每个元素分配了单独的计算资源。此外，从安全的角度来看，这有助于隔离访问，使任何潜在攻击者的工作变得更加困难。\n\
  \n然而，随着服务器容量的增加，这种模型变得有些低下。将整台物理服务器仅用于运行 Web 服务器，另一台物理服务器仅用于运行数据库服务器，再将第三台物理服务器仅用于运行应用程序，无法充分利用服务器的全部性能并变得昂贵。\n\
  \n这就是虚拟化的用用场。通过虚拟化，你可以在单台物理服务器上运行多个较小的虚拟服务器环境。图 29.6 展示了这一概念。\n\n![插图描述连接到物理服务器的云，带有\
  \ Web 服务器、应用程序服务器和数据库服务器](img/c29f006.png)\n\n图 29.6 服务器虚拟化概念\n\n每个虚拟服务器都作为一个运行在物理服务器硬件上的独立服务器运行。这被称为\
  \ `virtual machine (VM)`。没有任何虚拟服务器之间相互交互，因此它们的作用就像位于不同的物理服务器上一样。但是，需要一种方法让每个虚拟服务器公平地共享服务器上的物理资源，以防它们之间发生冲突。\n\
  \n这就是 `hypervisor` 发挥作用的地方。`hypervisor` 也称为 `virtual machine monitor (VMM)`，充当虚拟机之间共享的物理服务器资源的“交通交警”。它为运行在服务器上的每个虚拟机提供\
  \ CPU 时间、内存空间和存储空间的虚拟环境。对于每个虚拟机而言，它直接访问服务器资源，并且完全不知道 `hypervisor` 在中间控制着对资源的访问。\n\
  \n由于每个虚拟机都是服务器上的一个独立实体，你可以在不同的虚拟机中运行不同的操作系统。这允许你轻松地尝试在不同的操作系统中运行应用程序，或者只是运行同一个操作系统的不同版本，而这一切无需购买额外的服务器。\n\
  \n### 虚拟机管理器的类型\n\n实现 `hypervisor` 有两种不同的方法。本节将讨论它们是什么以及它们之间的区别。\n\n#### Type I\
  \ 虚拟机管理器\n\nType I 虚拟机管理器通常称为裸机虚拟机管理器。虚拟机管理器系统直接运行在服务器硬件上，没有中间环节。虚拟机管理器软件直接与系统上的\
  \ CPU、内存和存储进行交互，根据需要将它们分配给每个虚拟机。图 29.7 说明了这种设置。\n\n![插图描述了 Type I 虚拟机管理器在服务器硬件上管理四个客主机操作系统](img/c29f007.png)\n\
  \n图 29.7 Type I 虚拟机管理器\n\n在 Linux 世界中，两个流行的 Type I 虚拟机管理器包是：\n\n* `KVM`: 基于 Linux\
  \ 内核的虚拟机 (`KVM`) 利用标准的 Linux 内核以及一个特殊的虚拟机管理器模块，取决于所使用的 CPU（Intel 或 AMD）。安装后，它可以托管任何类型的客主机操作系统。\n\
  * `XEN`: `XEN` 项目是硬件虚拟化的开源标准。它不仅支持 Intel 和 AMD CPU，还有适用于 ARM CPU 版本。`XEN` 项目除了虚拟机管理器软件外，还包含了用于从客主机操作系统管理管理器的\
  \ API 栈。\n\n#### Type II 虚拟机管理器\n\nType II 虚拟机管理器通常称为 `hosted hypervisors`（托管型虚拟机管理器），因为它们运行在已有的操作系统之上。虚拟机管理器软件像主机操作系统上的任何其他应用程序一样运行。图\
  \ 29.8 展示了 Type II 虚拟机管理器的工作原理。\n\n![插图描述了 Type 2 虚拟机管理器、主机操作系统和服务器硬件管理 4 个客主机操作系统](img/c29f008.png)\n\
  \n图 29.8 Type II 虚拟机管理器\n\n\n\n\n\nII 型虚拟机监控程序（hypervisor）软件在宿主机操作系统上作为独立的进程运行客户虚拟机。客户虚拟机支持客户操作系统，这些操作系统与宿主机操作系统完全隔离。因此，你可以使用\
  \ Linux 宿主机操作系统并同时运行 Windows 或 macOS 客户操作系统。\n\n使用 II 型虚拟机监控程序的吸引之处在于，你可以在已经安装的操作系统上运行它。你不需要为运行虚拟机专门创建一个新的服务器环境。对于\
  \ I 型虚拟机监控程序，你必须专门一台服务器来托管虚拟机；而对于 II 型虚拟机监控程序，你的服务器可以在托管虚拟机的同时执行其他功能。\n\n目前有许多不同的流行的\
  \ Windows 和 macOS II 型虚拟机监控程序，例如 VMware Workstation 和 QEMU，但对于 Linux，最常用的是 Oracle\
  \ VirtualBox。\n\n## 虚拟机监控程序模板\n\n你创建并在虚拟机监控程序运行的虚拟机必须经过配置，以确定它们所需的资源以及它们如何与硬件交互。这些配置设置可以保存到模板文件中，以便你能够在同一个虚拟机监控程序或单独的虚拟机监控程序服务器上轻松复制虚拟机环境。\n\
  \n虚拟机配置的开源标准被称为 `Open Virtualization Format (OVF)`。OVF 格式创建了一个包含多个文件的分发包。该包使用单个\
  \ XML 配置文件来定义虚拟机的硬件环境需求。除了该文件外，其他文件定义了虚拟机网络访问需求、虚拟驱动器需求以及任何操作系统的需求。\n\nOVF 模板的缺点是分发不便。对此的解决方案是\
  \ `Open Virtualization Appliance (OVA)` 格式。OVA 模板将所有 OVF 文件封装在一个单个 `tar` 归档文件中以便分发。\n\
  \n## 探索容器\n\n虽然利用虚拟机是在服务器环境中启动多个服务器的极佳方法，但在处理和分发应用程序时，它们仍然显得有些笨拙。分发应用程序并不需要复制整个操作系统环境。这个问题的解决方案是容器。本节将探索什么是容器，以及它们如何改变开发者在云环境中管理和分发应用程序的方式。\n\
  \n### 什么是容器？\n\n开发应用程序需要大量文件。应用程序运行时文件通常位于同一个目录中，但通常还需要额外的库文件来使应用程序与数据库、桌面管理软件或内置操作系统功能交互。这些文件通常散落在\
  \ Linux 虚拟目录中各种难以发现的地方。\n\n由于运行应用程序需要所有辅助文件，经常会出现一个应用程序在开发环境中运行良好，但在部署到未能准确重现开发环境的生产环境时却崩溃的情况。在\
  \ Windows 世界中，这通常被称为“DLL 地狱”（DLL hell），因为不同的应用程序会覆盖公共 DLL 库文件，导致其他应用程序损坏。然而，这不仅限于\
  \ Windows 世界；也适用于 Linux 世界。\n\n`Containers`（容器）的设计是为了解决这个问题。容器收集了运行应用程序所需的所有文件——运行时文件、库文件、数据库文件以及任何特定于操作系统的文件。容器使得应用程序的运行自给自足；应用程序所需的一切都存储在容器内部。\n\
  \n如果你在服务器上运行多个应用程序，可以安装多个容器。每个容器对于特定的应用程序来说仍然是一个自包含的环境，如图图 29.9\n\n图 29.9 在容器中运行应用程序\n\
  \n应用程序容器是可选的。你可以在任何宿主机环境中运行相同的容器，并期望应用程序具有相同的行为。这对于应用程序开发者来说是理想的。开发者可以在一个环境中开发应用程序容器，将其复制到测试环境，然后将应用程序容器部署到生产环境，而无需担心缺少文件。\n\
  \n通过将应用程序封装并分发为容器，开发者可以确保应用程序在客户处的运行方式与在开发环境中完全一致。\n\n由于容器不包含整个操作系统，它们比完整的虚拟机更轻量，因此更容易分发。\n\
  \n创建容器的早期尝试使用了 `chroot` 监狱方法（在第 19 章，“拥抱最佳安全实践](#c019.xhtml_c019)”中描述）来隔离应用程序。然而，开发者很快意识到\
  \ `chroot` 的局限性，并研究了替代方案。\n\n开放容器倡议（OCI）是 Linux Foundation 于 2015 年启动的一个项目，旨在标准化\
  \ Linux 环境下的容器运行。OCI 开发并发布了 `runc` 容器运行时应用程序，作为更高级工具的基础。接下来的章节将讨论 Linux 中可用的高级容器管理工具。\n\
  \n### 容器软件\n\nLinux 一直处于容器开发的前沿，是开发者的热门选择。Linux 中有多种容器包可用，以下是其中一些比较流行的：\n\n- **Podman**:\
  \ Podman 包由红帽开发，是一项用于开发、管理和运行容器的开源工具。虽然你可以单独使用 `Podman` 来运行和管理容器，它也被其他更高级的包（如 `Docker`）用于提供基础容器服务。红帽还开发了\
  \ `Podman Desktop` 包用于在 Microsoft Windows 环境下运行容器。\n- `containerd`: `containerd`\
  \ 包是另一个用于较小容器实现的容器管理器。正如其名称中的“d”所示，它在 Linux 或 Windows 系统上作为后台守护进程运行。虽然你可以单独使用 `containerd`\
  \ 来管理容器，但它也被整合到 `Docker` 等更高级的容器程序中。\n- `LXC`: `LXC` 包作为创建容器的开源标准而开发。LXC 中的每个容器都比标准的轻量级应用容器复杂一些，但又不像完整的虚拟机那么重，因此介于两者之间。`LXC`\
  \ 容器包含自己的精简操作系统，直接与宿主机系统硬件接口，而不需要宿主机操作系统。由于 `LXC` 容器包含自己的微型操作系统，它们有时被称为`虚拟机`，尽管这个术语并不完全准确，因为\
  \ `LXC` 容器仍然需要宿主机操作系统才能运行。\n- `Docker`: `Docker` 包由 Docker 公司开发并作为开源项目发布。`Docker`\
  \ 非常轻量，允许多个容器在同一个宿主机 Linux 系统上运行。`Docker` 使用运行在宿主机 Linux 系统上的独立守护进程来管理已安装的 `Docker`\
  \ 镜像。该守护进程监听来自单个容器以及 `Docker` 命令行界面的请求，允许你控制容器环境。\n\n### 容器模板\n\n与虚拟机一样，容器允许创建创建以轻松复制容器环境。不同类型的\
  \ Linux 容器使用不同的方法来分发模板。\n\n\n\n\n\nLXC 软件包使用一个名为 `LXD` 的独立程序来管理容器。在最近的版本中，`LXD`\
  \ 变得非常流行，现在本身作为容器软件进行打包，尽管它仍然使用 LXC 容器系统镜像。\n\nDocker 使用 Docker `container image`\
  \ 文件来存储容器配置。容器镜像文件是一个只读镜像，可以存储和分发应用程序容器。\n\nDocker 容器软件包提供了一个在你的 Linux 环境中运行 OS\
  \ 容器的便捷平台。你只能在 Linux Docker 宿主机上运行 Linux 容器；但是，Docker Desktop 软件包允许你在 Windows 宿主机上运行\
  \ Linux 或 Windows 容器。\n\n你使用 `docker` 命令行工具轻松地与 Docker 系统交互，包括启动、停止和与容器交互。表 29.1\
  \ 显示了你可以使用的 `docker` 可用命令。\n\n| 命令 | 描述 |\n| --- | --- |\n| `attach` | 将主机的 STDIN、STDOUT\
  \ 和 STDERR 连接到容器 |\n| `build` | 从 Docker 配置文件创建新的容器镜像 |\n| `commit` | 在本地系统上为编辑过的容器创建新镜像\
  \ |\n| `cp` | 在本地系统和容器之间复制文件和目录 |\n| `exec` | 连接到运行中的容器并执行命令 |\n| `images` | 列出本地存储的容器镜像\
  \ |\n| `inspect` | 显示有关容器的详细信息 |\n| `kill` | 立即停止运行的容器 |\n| `login` | 登录 Docker\
  \ hub 仓库 |\n| `logs` | 获取运行中容器的日志 |\n| `ps` | 列出运行中的容器 |\n| `pull` | 从 Docker 仓库拉取容器\
  \ |\n| `push` | 将容器镜像提交到 Docker 仓库 |\n| `rm` | 删除已停止的容器 |\n| `rmi` | 从本地存储中删除容器镜像\
  \ |\n| `run` | 启动容器镜像 |\n| `stop` | 停止运行的容器 |\n| `start` | 启动已停止的容器 |\n\n表 29.1\
  \ `docker` 程序命令\n\n你可以从 Docker 配置文件构建新的容器镜像，也可以直接从容器仓库下载预先配置的容器镜像，其他管理员在那里发布他们的容器。Docker\
  \ 本身在 `http://hub.docker.com.` 维护了一个容器仓库。许多开发者利用混合方法，通过自定义现有的 Docker 镜像来构建镜像。\n\n\
  要构建镜像，你使用 `docker build` 命令。`build` 命令选项读取名为 `Dockerfile` 的文件，该文件定义了要使用的核心镜像以及你需要添加到自定义镜像中的特性。表\
  \ 29.2 列出了包含在 `Dockerfile` 文件中的常用 `build` 命令。\n\n| 命令 | 描述 |\n| --- | --- |\n| `FROM`\
  \ | 定义用于当前镜像的 Docker 镜像文件。 |\n| `RUN` | 定义在当前镜像之上运行的任何命令。 |\n| `WORKDIR` | 为脚本运行的任何命令设置工作目录。\
  \ |\n| `COPY` | 从主机向容器镜像复制文件或目录。 |\n| `CMD` | 定义镜像中一个 Docker 在镜像运行时启动的程序。你可以定义多个\
  \ CMD 命令行来运行多个程序。 |\n| `ENTRYPOINT` | 定义镜像中一个 Docker 在镜像运行时启动的默认程序。 |\n\n表 29.2\
  \ `Dockerfile` 命令\n\n下面的练习将引导你通过在 Linux 系统上安装和使用 Docker 的步骤，来托管 Apache Web 服务器容器镜像。\n\
  \n## 总结\n\n云计算为公司扩展计算资源提供了一种简便的方法，而无需购买和管理自己的硬件。云计算有三个层次，每种层次提供不同的服务。基础设施即服务（IaaS）提供硬件资源，如服务器、存储和网络。软件即服务（SaaS）通过互联网从云服务器运行应用程序。平台即服务（PaaS）提供开发环境，该环境由操作系统和开发、测试和交付应用程序软件所需的任何库组成。\n\
  \n云计算环境利用虚拟化技术来实现许多服务器，而不需要大量的物理硬件。通过虚拟化，一台大型服务器可以托管多个较小的客体系统（虚拟机）。虚拟机程序（hypervisor）软件管理分配给每个客体系统的资源并管理这些资源的使用方式。\n\
  \n使用了两种类型的虚拟机程序环境。第一型虚拟机程序直接与系统硬件交互。客体系统直接从虚拟机程序接收系统资源。\n\n第二型虚拟机程序运行在宿主操作系统之上。宿主操作系统与系统硬件交互并为第二型虚拟机程序提供资源，第二型虚拟机程序随后将资源分配给客体系统。\n\
  \n容器是另一种虚拟化类型。容器为单个应用程序提供一致的运行环境。当你将应用程序部署到容器时，可以确保无论它运行在什么服务器上都会以相同的方式运行。通过使用容器部署应用程序，你可以确保应用程序在开发、测试和生产环境中以相同的方式运行。容器的开销没有虚拟机那么大，因此更容易分发。\n\
  \n## 考试要点\n\n**描述提供云计算环境的三种主要方法。** 公有云托管在第三方拥有并的服务器上。公司不拥有或操作任何服务器硬件；它只是利用这些服务器上的空间。其他公司可以在同一个公云中租用空间。私有云托管位于公司网络内的服务器上。所有的应用程序文件以及数据文件位于公司网络内部。混合云利用私有云服务器，但将其与公云服务器接口。通过混合云，数据可以位于外部的公云，也可以位于内部的私有云。\n\
  \n**解释三种云服务类型。** 基础设施即服务（IaaS）为客户提供硬件级服务。这包括服务器、存储空间以及连接它们的网络资源。软件即服务（SaaS）在云环境中运行应用程序，允许客户通过互联网访问这些应用程序。平台即服务（PaaS）为软件开发提供按需环境。在\
  \ PaaS 云服务中，服务器硬件、操作系统和运行时库均由云服务提供。\n\n**解释两种类型的虚拟机程序。** 第一型虚拟机程序直接运行在系统硬件上。它们充当硬件和客体操作系统之间的中介。第一型虚拟机程序为每个客体操作系统分配资源，确保每个系统都能获得足够的资源。第二型虚拟机程序运行在宿主操作系统之上。宿主操作系统与服务器硬件交互；虚拟机程序软件必须通过宿主操作系统来访问资源。客体操作系统仍然仅与虚拟机程序交互。\n\
  \n**描述容器与虚拟机的区别。** 大多数容器包不包含虚拟机那样的完整操作系统。容器包仅包含运行特定应用程序所需的库文件和应用程序运行时文件。这使得容器轻量级且于部署。\n\
  \n## 复习题\n\n1. 哪种云服务方法仅利用第三方拥有并运营的服务器？\n\n    1.  私有云\n    2.  公有云\n    3.  混合云\n\
  \    4.  第二型\n    5.  第一型\n\n\n\n\n\n2. Tom 目前在内部服务器上为公司运行一个云服务，但需要额外的处理能力来运行一个新的应用程序。他可以考虑哪种云服务方法来利用现有的云，而无需购买更多内部服务器？\n\
  1. 私有 (Private)\n2. 公有 (Public)\n3. 混合 (Hybrid)\n4. 类型 I (Type I)\n5. 类型 II (Type\
  \ II)\n\n3. Sally 有兴趣在云端开发她的应用程序，而无需担心管理操作系统。她应该购买哪种类型的云服务？\n1. PaaS\n2. 私有云 (Private\
  \ cloud)\n3. IaaS\n4. SaaS\n5. 混合云 (Hybrid cloud)\n\n4. 哪种类型的云服务允许你在云提供的基础设施上启动你自己的操作系统？\n\
  1. PaaS\n2. 私有云 (Private cloud)\n3. IaaS\n4. SaaS\n5. 混合云 (Hybrid cloud)\n\n6. 哪种类型的虚拟机程序直接与宿主机系统硬件接口？\n\
  1. 私有 (Private)\n2. 公有 (Public)\n3. 类型 II (Type II)\n4. 类型 I (Type I)\n5. 混合 (Hybrid)\n\
  \n6. Henry 已经在服务器上安装了 Red Hat Linux，但现在需要安装虚拟机。他应该使用哪类型的虚拟机程序包？\n1. 私有 (Private)\n\
  2. 公有 (Public)\n3. 类型 II (Type II)\n4. 类型 I (Type I)\n5. 混合 (Hybrid)\n\n7. 哪种类型的虚拟机模板将所有配置文件合并到一个文件中进行分发？\n\
  1. XML\n2. JSON\n3. OVA\n4. OVF\n5. YAML\n\n8. Fred 希望封装他的应用程序，以便无论客户使用什么 Linux\
  \ 发行版，它都能以相同的方式运行。他如何做到这一点？\n1. 将应用程序封装为容器。\n2. 将应用程序封装为虚拟机程序。\n3. 将应用程序部署到私有云。\n\
  4. 将应用程序作为虚拟机部署。\n5. 将应用程序打包为 `tar` 文件并部署。\n\n9. 你应该使用哪种方法轻松地将应用程序从开发环境移动到生产环境，而无需复制操作系统？\n\
  1. 公有云 (Public cloud)\n2. 私有云 (Private cloud)\n3. 类型 I 虚拟机程序 (Type I hypervisor)\n\
  4. 类型 II 虚拟机程序 (Type II hypervisor)\n5. 容器 (Container)\n\n10. 哪种 Linux 容器包将引擎作为进程在宿主机上运行，并提供控制容器的命令行界面？\n\
  1. Snap\n2. Docker\n3. KVM\n4. XEN\n5. VirtualBox\n\n# 第 30 章：检查云和虚拟化服务\n\n![](img/chaptersquare.png)\n\
  \n在设计和管理各种云和虚拟化系统配置时，你需要理解虚拟网络和物理网络如何协作、可用的磁盘存储选择、如何自动化启动以及如何在虚拟机上快速安装 Linux 发行版。此外，你还需要了解基本的虚拟机创建和管理工具。在本章中，我将从第\
  \ 29 章开始的之旅，进入云和虚拟化主题。\n\n***\n\n## 专注于虚拟机工具\n\n各种虚拟机工具允许你创建、销毁、启动、关闭和配置客机虚拟机。有很多开源替代方案供选择。有些仅在命令行运行，有时在\
  \ shell 脚本中使用，而另一些是图形界面的。在本节中，我将查看其中的一些工具。\n\n### 查看 `libvirt`\n\n一个流行的虚拟化管理软件集合是\
  \ `libvirt` 库。该集合包含以下元素：\n\n* 一个应用程序接口 (API) 库，集成在多个开源 VMM（虚拟机程序）中，例如 `KVM`\n* 一个守护进程\
  \ `libvirtd`，它运行在虚拟机主机系统上并执行任何所需的虚拟机客机系统管理任务，例如启动和停止虚拟机\n* 命令行工具，例如 `virt-install`\
  \ 和 `virsh`，它们运行在虚拟机主机系统上，用于控制和管理虚拟机客机系统\n\n虽然通常大多数以 `vir` 或 `virt` 开头的命令行工具都使用\
  \ `libvirt` 库，但你可以通过 `ldd` 命令双重检查这一点。在安装了虚拟机程序包的 Rocky Linux 发行版中，可以在列表 30.1 中看到示例。\n\
  \n`libvirt` 项目的主要目标是提供一种管理虚拟机的单一方法。它支持多种虚拟机程序，如 `KVM`、`QEMU`、`Xen`、`VMware ESXi`\
  \ 等。你可以在 `http://libvirt.org` 网站上找到关于关于 libvirt` 项目的信息。\n\n### 查看 `virsh`\n\n使用\
  \ `libvirt` 库的一个方便工具是 `virsh` shell。这是一个你可以用来管理系统虚拟机的基本 shell。\n\n如果你安装了 VMM（虚拟机程序）产品，你可以利用\
  \ `virsh` shell 来创建、删除、启动、停止和管理你的虚拟机。进入和退出 `virsh` shell 的示例在列表 30.2 中所示。请记住，涉及虚拟机的\
  \ shell 命令通常需要超级用户权限。\n\n你不需要进入 `virsh` shell 就可以管理你的虚拟机。可以直接从 Bash shell 输入各种 `virsh`\
  \ 命令，这对于那些希望在 shell 脚本中使用命令来自动执行虚拟机管理的人来说非常有用。交互式使用 `virsh` 工具的示例在列表 30.3 中。\n\n\
  ### 使用虚拟机管理器管理\n\n不要与虚拟机程序 (VMM) 混淆，*Virtual Machine Manager*（也称为 *vmm*）是一个用于创建和管理虚拟机的轻量级桌面应用程序。它是许多使用\
  \ GUI 的发行版中可用的 Python 程序，可以通过 `virt-manager` 包获取。\n\n可以通过图形化环境内的终端模拟器通过 `virt-manager`\
  \ 命令启动虚拟机管理器。用户界面在图 30.1 的 Rocky Linux 8 发行版中显示。\n\n![Linux 桌面上打开的虚拟机管理器截图，显示 CPU\
  \ 使用率 Q E M U 或 K V M。](img/c30f001.png)\n\n图 30.1 虚拟机管理器\n\n你确实需要使用超级用户权限运行虚拟机管理器，如果不是从具有这些权限的账户执行\
  \ `virt-manager` 命令，它将弹出一个窗口，要求 root 账户密码或类似内容，取决于发行版。\n\n虚拟机管理器通过其“视图”菜单提供的一个不错的功能是性能统计图。此外，GUI\
  \ 界面允许修改客机虚拟机的配置，例如它们的虚拟网络（虚拟网络配置在本章稍后部分介绍）。\n\n你可以在 `http://virt-manager.org` 网站查看虚拟机管理器的截图、阅读其文档并浏览其代码。\n\
  \n## 理解引导 (Bootstrapping)\n\nBootstrap 是鞋子后部的小织物或皮环。现在你使用它们来帮助把鞋穿在脚上，手指钩住环并拉。。从小工具发展而来的短语是，“提着鞋带提起来”，意味着在没有外部帮助的情况下从挫折中恢复。\n\
  \n随着时间的推移，计算机行业通过 *bootstrapping*（引导）和 *booting*（启动）术语模仿了这个短语。它们通常互换使用，但通常启动系统是指开启电源并通过引导加载程序代码启动。引导系统是指使用早期系统安装的配置文件或镜像来安装新系统。\n\
  \n### 使用 shell 脚本启动\n\n无论你是在云端还是在自己的本地主机上创建客机虚拟机，都有多种方法让它们启动。通过 GUI 启动几个虚拟机并不太困难，但如果你的公司雇用了数百台虚拟机，你就需要考虑自动化这一过程。\n\
  \n\n\n\n使用 shell 脚本启动虚拟机通常是一种“自制型”方法，尽管互联网上有许多示例。这种方法在公司控制的宿主机上启动客户机虚拟机时效果最好。\n\n\
  你可以为各种虚拟机创建配置文件，并根据需要将它们读取到启动的 shell 脚本中。可以在宿主机系统启动时、预定时间或按需要启动客户机。这是一个灵活的方法，允许进行大量的自定义。\n\
  \n## 使用 Anaconda 快速启动\n\n你可以使用 `kickstart 安装方法` 快速且相当容易地引导一个新系统（物理机或虚拟机）。这种基于 RHEL\
  \ 的技术用于设置和执行系统安装，它包含以下步骤：\n\n1. 创建一个 kickstart 文件来配置系统。\n2. 将 kickstart 文件存储在网络或可拆卸设备上（例如\
  \ USB 闪存盘）。\n3. 将安装源（例如 ISO 文件）放置在 kickstart 进程可以访问的地方。\n4. 创建一个将启动 kickstart 进程的启动介质。\n\
  5. 启动 kickstart 安装。\n\n### 创建 Kickstart 文件\n\n`kickstart file` 是一个文本文件，包含了你对新系统所需的所有安装选项。虽然你可以用文本编辑器手动创建此文件，但使用\
  \ `anaconda file` 要简易得多。对于基于 Red Hat 的发行版，该文件会在安装时创建并存储在 `/root` 目录下，命名为 `anaconda-ks.cfg`。它包含了系统安装时进行的所有安装选择。\n\
  \nRocky Linux 8 发行版的 anaconda 文件示例见 Listing 30.4 中的代码片段。\n\n注意 Listing 30.4 中，root\
  \ 密码存储在 във文件中。如果在安装时创建了其他用户账户，这些账户也会存储在这里。虽然这些值经过了加密，但仍应保持该文件的安全，以免危及使用该文件进行引导的任何虚拟机或物理系统的安全。\n\
  \n为了为系统安装创建 kickstart 文件，请从 anaconda 文件开始并将其复制到新机器上。通常使用 `ks.cfg` 作为 kickstart 文件名。之后，用文本编辑器打开该文件并进行任何必要的修改。\n\
  \nKickstart 文件使用特殊的语法，遗憾的是没有描述它的 man pages（帮助手册）。你最好的选择是打开你喜欢的网络浏览器并输入 `Kickstart\
  \ Syntax Reference` 以查找 Fedora 或 Red Hat 的文档站点。\n\n### 存储 Kickstart 文件\n\n对于普通的物理系统安装，通常将配置好的\
  \ kickstart 文件存储在可移动介质（如 USB 闪存盘）上，或者如果你计划使用 PXE 或 TFTP 启动过程，则存储在网络某处。对于虚拟机，你可以将其存储在宿主机本地。无论什么情况下，请确保文件受到妥善保护。\n\
  \n### 放置安装源\n\n安装源通常是你用于安装 Linux 发行版的 ISO 文件。然而，你也可以使用 `installation tree`，这是一个包含提取出的安装\
  \ ISO 文件内容的目录树。\n\n通常情况下对于普通的物理系统，ISO 存储在可移动介质或网络位置上。但对于虚拟机，只需将 ISO 或安装树存储在宿主机上。你甚至可以将其与\
  \ kickstart 文件放在同一个目录下，正如 Listing 30.5 所示系统中所做的那。\n\n### 创建启动介质\n\n对于物理安装，选择的方法和介质取决于各种系统启动选项以及你执行安装的系统类型。对于具有从\
  \ USB 驱动器或 DVD 启动能力的服务器，一种简单的方法是在这些选择之一上存储一个可启动的 live ISO。\n\n对于虚拟机安装（例如 KVM 虚拟机管理器上的虚拟机），则无需创建启动介质。这只会变得越来越简单！\n\
  \n### 启动安装\n\n当一切都准备就绪后，启动 kickstart 安装。对于物理系统，启动引导过程，到达引导提示符，并输入类似 `linux ks=hd:sdc1:/ks.cfg`\
  \ 的命令，具体取决于你的硬件环境、引导程序以及 kickstart 文件的位置。\n\n对于虚拟系统，如果你的宿主机上提供了 `virt-install` 命令，你可以直接使用它。除了用于创建虚拟机的其他选项外，你还可以添加两个类似于这些选项：\n\
  \n```\n --initrd-inject /root/VM-Install/ks.cfg\n--extra-args=\"ks=file:/ks.cfg\
  \ console=tty0 console=ttyS0,115200n8\"\n```\n\n如果需要，你可以创建一个带有循环的 shell 脚本，并让它多次执行\
  \ `virt-install` 命令，以创建/安装你所需的数量的虚拟机。\n\n## 使用 Cloud-init 初始化\n\n`Cloud-init` 是\
  \ Canonical 的产品（生产 Ubuntu 发行版的同一公司）。它提供了一种引导虚拟机的方法。Canonical 在其 cloud-init 网站 `http://cloud-init.io`\
  \ 上对其描述最为准确：“云镜像是操作系统模板，每个实例在启动时都是其他实例的完全相同的克隆。是用户数据赋予了每个云实例个性，而 cloud-init 是自动将用户数据应用到你的实例的工具。”\n\
  \ncloud-init 服务用 Python 编写，适用于基于云的虚拟化服务，例如 Amazon Web Services (AWS)、Microsoft Azure\
  \ 和 DigitalOcean，以及基于云的管理操作系统（如 OpenStack）。你的虚拟机并不一定在云端才能使用 cloud-init。它也可以使用如 VMware\
  \ 和 KVM 等 VMM（虚拟机管理器）产品来引导本地虚拟机。此外，它还受到大多数 Linux 发行版的支持。它被称为 `行业标准`是有原因的。\n\nCloud-init\
  \ 允许你配置虚拟机的主机名、临时挂载点和默认区域设置。更好的是，可以创建预生成的 OpenSSH 私密钥，以对虚拟化系统提供加密访问。可以使用自定义脚本在虚拟机引导时运行。所有这些都通过所谓的\
  \ `user-data` 完成，`user-data` 是一段信息字符串或存储在文件中的数据，这些文件采用 YAML（Yet Another Markup Language）格式。\n\
  \n`/etc/cloud/cloud.cfg` 是主要的 cloud-init 配置文件。命令行工具名称正如你所料到的样，是 `cloud-init` 命令。使用\
  \ `cloud-init` 获取帮助的示例见 Listing 30.6。\n\n## 探索存储问题\n\n很容易忘记你的虚拟机并不使用真实的磁盘。相反，它们的虚拟磁盘只是物理宿主机磁盘上的文件。取决于所采用的\
  \ VMM（虚拟机管理器）和设置的配置，单个虚拟磁盘可能由单个物理文件或多个物理文件表示。\n\n在设置你的虚拟系统时，理解各种虚拟磁盘配置选项至关重要。你所做的将直接影响虚拟机的性能。在进行这些配置之前，几个虚拟化服务和产品有一些你需要理解的术语：\n\
  \n* **Provisioning (分配)**：在创建虚拟机时，你选择磁盘存储容量。然而，这比简单选择大小要复杂一点。虚拟磁盘以“精简配置”（thinly）或“厚模式配置”（thickly）的方式进行分配。\n\
  \n\n\n\n\n- `Thick provisioning`（精备配置）是一种静态设置，其中会选择虚拟磁盘的大小，并在物理磁盘上预先分配已创建的物理文件。因此，如果您选择\
  \ 700 GB 作为虚拟磁盘大小，物理驱动器上将消耗 700 GB 的空间。某些虚拟机监控程序（VMM）具有多个版本的精备配置，例如 `Lazy Zero Thick`（延迟置零精备配置），这些版本会对性能产生影响。\n\
  \n- `Thin provisioning`（精简配置）是动态增长的，这使得虚拟机程序仅消耗虚拟驱动器实际使用的磁盘空间。因此，如果您选择 700 GB 作为虚拟磁盘大小，但仅向虚拟驱动器写入了\
  \ 300 GB 空间，那么物理驱动器上仅消耗 300 GB 空间。随着更多数据写入虚拟驱动器，物理驱动器上的利用空间会增加，直到达到 700 GB 的设置。请注意，反过来并不一定——当您从虚拟驱动器删除数据时，它不会自动释放物理驱动器上的磁盘空间。\n\
  \n- `Thin provisioning` 通常用于允许 `overprovisioning`（超额配置）。在这种情况下，分配的虚拟磁盘空间比物理可用的空间多。其核心思想是可以根据需要扩展物理存储。例如，如果主机系统正在使用\
  \ `LVM`（在第 11 章“处理存储””中介绍），将根据需要向物理逻辑卷添加额外的卷以满足虚拟机的需求。\n\n- `Persistent Volumes`（持久卷）：`persistent\
  \ volume` 一词被许多虚拟化产品使用，例如 `OpenStack` 和 `Kubernetes`。本质上，虚拟化持久卷在运行方式上类似于物理磁盘。数据保留在磁盘上，直到系统或用户覆盖它。无论虚拟机是否运行，数据都会留在磁盘上，对于某些虚拟化产品，即使在使用的虚拟机被删除，数据仍然存在。\n\
  \n- `Blobs`（二进制对象）：`Blob storage` 是 Microsoft Azure 云平台的一个术语。`Blob storage` 是通过互联网提供的大型非结构化数据，并可以使用\
  \ `.NET` 代码进行操作。通常，一个 blob 包含图像、流媒体视频音频、大数据等。\n\n- Blob 数据项被分组到特定用户账户的容器中，并可以是三种不同类型之一：\n\
  \n    - `Block blobs`（块 blob）是文本和二进制数据块。这些 blob 不作为一个组进行管理，而是相互独立地处理。它们的大小限制为 4.7\
  \ TB。\n\n    - `Append blobs`（追加 blob）也是文本和二进制数据块。然而，它们的存储经过增强，允许进行高效的追加操作。因此，这种\
  \ blob 类型通常用于日志数据。\n\n    - `Page blobs`（页 blob）仅仅是随机访问文件，大小可达 8 TB。它们也被用作 Azure\
  \ 虚拟机的虚拟磁盘。\n\n## 考虑网络配置\n\n物理系统上的应用程序可以通过网卡（`NIC`）和连接的网络访问外部世界。对于虚拟化系统和虚拟网络，情况有所不同。虚拟机可以拥有任意数量的虚拟化\
  \ NIC，虚拟机监控程序可以提供虚拟化内部交换机，且 NIC 配置选择非常丰富。正确的配置可以带来更高的网络和应用程序性能，并增强安全性。\n\n### 虚拟化网络\n\
  \n网络虚拟化在过去几年中不断演进。过去它仅是指位于 OSI 第 2 层和第 3 交换机和路由器的虚拟化，而现在可以在更高层次的 OSI 层中包含防火墙、服务器负载均衡等。某些云提供商甚至提供网络服务（`NaaS`）。\n\
  \n两个基本的网络虚拟化概念是虚拟本地局域网（`VLANs`）和叠加网络（overlay networks）：\n\n- `VLAN`：要理解 `VLAN`，最好从局域网（`LAN`）描述开始。LAN\
  \ 上的系统和设备设备位于一个小区域，例如办公室或建筑。它们共享公共通信线路或无线链路，通常被分为不同的网络段，其网络流量以较高的速度传输。\n\n- `VLAN`\
  \ 也由 LAN 上的系统和各种设备组成。然而，这些系统和设备物理上可能分布在不同的 LAN 子网中。VLAN 基于物理位置和连接，而是基于逻辑和虚拟连接，并使用第\
  \ 2 层广播消息。运行在第 3 路由器用于实现这种局域网虚拟化。\n\n- `Overlay Network`（叠加网络）：`overlay network`\
  \ 是一种使用封装和通信通道带宽隧道的网络虚拟化方法。网络的通信媒介（有线或无线）在虚拟上被分成不同的通道。每个通道被分配给特定的服务或设备。在通道上传输的数据包首先封装在另一个数据包内部进行传输。当隧道通道的接收端获得封装的数据包时，数据包将从胶囊中移除并处理。\n\
  \n- 通过 `overlay network`，应用程序管理网络基础设施。除了典型的网络硬件外，这种网络类型还采用了虚拟交换机、隧道协议和`软件定义网络 (SDN)`。`软件定义网络`\
  \ 是一种通过软件控制和管理网络通信的方法。它由一个 `SDN` 控制器程序以及两个称为 `northbound` 和 `southbound` 的应用程序编程接口组成。网络网络上的其他应用程序将\
  \ SDN 视为逻辑网络交换机。\n\n- 叠加网络比非虚拟化网络解决方案提供了更好的灵性和利用率。它们还降低了成本并提供了显著的可扩展性。\n\n### 配置虚拟化\
  \ NIC\n\n虚拟 `NICs`（适配器）有时直接连接到主机系统的物理 `NIC`。其他情况下，它们连接到虚拟交换机，取决于配置和所使用的虚拟机监控程序。虚拟机适配器使用虚拟交换机的示例见图\
  \ 30.2。\n\n![虚拟系统插图，带有虚拟 NIC 和交换机、虚拟机监控程序和主机系统上的物理 NIC 以及物理网络云。](img/c30f002.png)\n\
  \n图 30.2 使用虚拟交换机的虚拟机\n\n在配置虚拟机的 `NIC` 时，你有许多选择。了解你的可选方案对于做出正确选择至关重要。\n\n- `Host-Only`（仅限主机）：`host-only\
  \ adapter`（有时称为 `local adapter`）连接到虚拟机主机系统内部的虚拟网络。它没有到主机系统所连接的外部物理（或虚拟）网络的连接。\n\n\
  - 结果是速度。如果主机系统有两个或多个虚拟机，虚拟机（VMs）之间的网络速度非常快。这是因为虚拟机的流量不通过电线或空气传输，而是在主机系统的 RAM 中进行的。\n\
  \n- 这种配置还提供了增强的安全性。虚拟代理服务器就是一个很好的例子。通常，代理服务器位于本地系统和互联网之间。本地系统发送到互联网的任何网络请求会被代理服务器拦截，然后进行转发。它可以缓存数据以增强性能，充当防火墙并提供隐私和安全。主机上的一个虚拟机可以利用不同的\
  \ `NIC` 配置充当代理服务器，并具有访问外部网络的能力。使用主机限适配器的另一个虚拟机通过该虚拟机代理服务器发送/接收其网络请求，从而增加了其保护。\n\n\
  \n\n\n\n- **桥接 (Bridged)**：`bridged NIC` 使虚拟机类似于宿主机系统所属的局域网或 VLAN 上的节点。虚拟机获得自己的\
  \ IP 地址，并可以在网络上可见。\n- 在此配置下，虚拟网卡连接到宿主机的物理网卡。它向/从外部物理（或虚拟）网络发送/接收其自身的流量。\n- 此配置用于较早的虚拟代理服务器示例。代理服务器的网卡被配置为桥接主机，因此它可以访问外部网络，并作为网络上的普通系统节点运行。\n\
  - **NAT（网络地址转换）**：`network address translation (NAT)` 适配器配置的工作方式与物理世界中 NAT 的原理相似。物理网络领域中的\
  \ `NAT` 使用网络设备（如路由器）在计算机将流量发送到另一个网段时，“隐藏”局域网计算机系统的 IP 地址。所有其他局域网系统的 IP 地址都被翻译成单个\
  \ IP 地址发送到其他网段。路由器跟踪每个局域网计算机的外部流量，因此当流量传回该系统时，它会被路由到相应的计算机。\n- 在虚拟化环境中，NAT 表由管理程序维护而非网络设备。此外，宿主机系统的\
  \ IP 地址被用作发送到外部网络的单一 IP 地址。每个虚拟机在宿主机系统的虚拟网络中都有自己的 IP 地址。\n- 物理和虚拟系统的 NAT 具有相同的优点。其中之一是通过保持内部\
  \ IP 地址对外部网络私密来增强安全性。\n- **双宿主机 (Dual-Homed)**：在物理世界中，`dual-homed system`（有时称为 `multihomed\
  \ system`）是指拥有一个或多个活动网络适配器的计算机。物理主机通常配置有多个 NIC。这种配置提供了冗余。如果一个物理网卡损坏，负载由其他网卡处理。此外，它还提供了外部网络流量的负载均衡。\n\
  - 在虚拟世界中，许多虚拟机是双宿主机甚至多宿主机，取决于虚拟网络环境配置和目标。回顾我们的虚拟代理服务器示例，它是双宿主机，具有一个内部网络网卡（仅主机模式）与受保护的虚拟机通信，并有一个桥接适配器用于在外部网络上发送和接收数据包。图\
  \ 30.3 显示了该虚拟代理服务器的完整网络图。\n\n![虚拟代理服务器和虚拟系统的插图，在管理程序、宿主机系统和物理网络上标记了网络组件。](img/c30f003.png)\n\
  \nFIGURE 30.3 虚拟代理服务器\n\n物理和虚拟机网络适配器配置对性能和安全性有影响。了解你的内部虚拟网络、外部物理网络以及目标是做出这些选择的重要部分。\n\
  \n## 总结\n\n配置你的云和/或虚拟化环境需要有关网络和存储选项的知识。此外，你还需要理解如何快速启动大量虚拟机以及如何引导新虚拟机。识别某些各种虚拟机和云机器工具也很重要。通过牢牢掌握这些概念，你可以参与云和虚拟系统规划团队，成功地将公司的物理系统迁移到更现代、更具成本效益的环境中。\n\
  \n## 考试要点\n\n### 描述各种虚拟机工具。\n`libvirt` 库是一个流行的虚拟化管理组件软件集合。它包含一个 API、一个守护进程 (`libvirtd`)\
  \ 以及命令行实用，如 `virt-install` 和 `virsh`。`virsh` 壳是 `libvirt` 库提供的此类工具之一，允许你管理系统的虚拟虚拟机。虚拟机管理器\
  \ (vmm) 是一个用于创建和管理虚拟机的轻量级桌面应用程序。可以在终端模拟器中通过执行 `virt-manager` 命令启动它。\n\n### 解释引导工具。\n\
  kickstart 安装方法使用一个 kickstart 文件，该文件包含新系统所需的所有引导选项。与其从零开始，基于 Red Hat 的发行版中提供了 `anaconda`\
  \ 文件 `/root/anaconda-ks.cfg`，并且可以修改它以配置 kickstart 文件。Ubuntu 发行版默认不使用 kickstart 安装方法，相反它们使用一个名为\
  \ `preseed` 的引导产品。openSUSE 发行版也有自己的替代方案，即 `AutoYaST`。Canonical 的产品 `cloud-init`\
  \ 是一种引导工具，适用于本地虚拟机以及云端虚拟机。\n\n### 详细说明各种虚拟存储选项。\n虚拟磁盘可以按厚量配置（thick provisioning）或精简配置（thin\
  \ provisioning）进行配置。厚量配置是一种静态设置，其中选择虚拟磁盘的大小并在物理磁盘上创建的物理文件是预分配的。精简配置是动态增长的，这使得管理程序仅消耗虚拟驱动器实际使用的磁盘空间。驱动器可以是持久的或临时的。临时卷在虚拟机停止时会被丢弃，而持久磁盘不仅在虚拟机关闭时保留，有时甚至在删除后仍保留。Blob\
  \ 存储是指 Microsoft Azure 云平台提供的非结构化数据。这种存储通常包括图像、流媒体视频音频、大数据等。有三种 blob 类型——块 (block)、追加\
  \ (append) 和页 (page)。\n\n### 总结虚拟网络配置。\n一种网络类型是叠加网络 (overlay network)。这种网络虚拟化方法使用封装和通道带宽隧道。除了典型的网络硬件外，这种网络还使用虚拟交换机、隧道协议和软件定义网络\
  \ (SDN)。网卡 (NIC) 许多配置虚拟选项。双宿主机虚拟机有两个虚拟化的 NIC。仅主机适配器连接到虚拟机宿主机系统内部的虚拟网络，没有到外部网络的连接。桥接\
  \ NIC 使虚拟机类似于宿主机系统所属网络上的节点。NAT 适配器为虚拟机创建了一个虚拟化的 NAT 路由器。\n\n## 复习题\n\n1. 关于 `libvirt`\
  \ 库软件集合，以下哪项是正确的？（选择所有适用项。）\n    1. 为管理程序提供 API 库\n    2. 提供一个完整的管理程序 (VMM) 应用\n\
  \    3. 提供 `virsh` 和 `virsh-install` 实用工具\n    4. 提供用于引导的 anaconda 文件\n    5. 为宿主机提供\
  \ `libvirtd` 守护进程\n2. Carol 想要通过 Bash 壳脚本自动管理她的虚拟机。她可以在此脚本中使用以下哪些实用工具？（选择所有适用项。）\n\
  \    1. `virsh`\n    2. `virtinst`\n    3. `virt-manage`\n    4. `virt-install`\n\
  \    5. `setvcpus`\n3. Nick 正在 RHEL 系统上设置引导过程。他需要存储安装树。以下哪些位置是他可以存储它？（选择所有适用项。）\n\
  \    1. 网络位置\n    2. USB 闪存盘\n    3. 在 AutoYaST 上\n    4. 在 preseed 目录内\n    5.\
  \ 与 kickstart 文件放在一起\n4. 关于 `cloud-init` 产品，以下哪项是正确的？（选择所有适用项。）\n    1. 它是由微软创建并维护的。\n\
  \    2. 它可以被云端虚拟化服务使用。\n    3. 它可以被云端管理操作系统使用。\n    4. 它受到大多数主流 Linux 发行版的支持。\n\
  \    5. 它是一个引导产品。\n\n\n\n\n\n## 5. Danvers 女士正在为她的公司 Miracle 设计一组虚拟机。目前，她的主机使用 LVM，但磁盘空间仅够存储\
  \ 1 TB 的数据。她的三台虚拟机立即需要 200 GB 的磁盘空间，但预计在未来一年内每台将增长到 300 GB。她应该怎么做？\n\n1. 配置三台虚拟机使用持久化存储。\n\
  2. 配置三台虚拟机使用临时存储。\n3. 配置三台虚拟机使用厚配置存储（thick provisioned storage）。\n4. 配置三台虚拟机使用精简配置存储（thin\
  \ provisioned storage）。\n5. 配置三台虚拟机使用对象存储（blob storage）。\n\n## 6. Fury 先生是银河大学的一位编程教授。下学期，他为学生的实验选择使用虚拟机。学生将在整个学期中编写一个单一程序。对于\
  \ Fury 教授的学生虚拟机，磁盘存储的最佳选择是什么？\n\n1. 持久化存储 (Persistent storage)\n2. 临时存储 (Temporary\
  \ storage)\n3. 厚配置存储 (Thick provisioned storage)\n4. 精简配置存储 (Thin provisioned storage)\n\
  5. 对象块存储 (Blob block storage)\n\n## 7. 关于叠加网络（overlay network），以下哪些描述是正确的？（选择所有适用项）\n\
  \n1. 它是一种存储虚拟化方法。\n2. 它是一种网络虚拟化方法。\n3. 它是一种采用封装的方法。\n4. 它是一种采用带宽隧道技术的方法。\n5. 它是一种使用页块（page\
  \ blobs）的方法。\n\n## 8. Carol 需要她的虚拟机都作为其主机局域网上的节点，并获取自己的 IP 地址以用于发送/接收网络流量。她应该在它们上配置哪种类型的虚拟网卡？\n\
  \n1. 主机模式 (Host-only) \n2. 桥接模式 (Bridged)\n3. NAT\n4. 多宿主 (Multihomed)\n5. 双宿主 (Dual-homed)\n\
  \n## 9. Danvers 女士希望她的三台虚拟机的 IP 地址保持私密，但她又希望它们使用主机的 IP 地址在主机网络进行通信。她应该在它们上配置哪种类型的虚拟网卡？\n\
  \n1. 主机模式 (Host-only)\n2. 桥接模式 (Bridged)\n3. NAT\n4. 多宿主 (Multihomed)\n5. 双宿主 (Dual-homed)\n\
  \n## 10. Nick 在他的主机系统上创建了五台虚拟机。其中一台虚拟机作为其他四台机器的防火墙，这四台机器被限制在主机模式适配器中。防火墙虚拟机作为节点在主机系统网络上运行。以下描述了他的防火墙适配器配置？（选择所有适用项）\n\
  \n1. 主机模式 (Host-only)\n2. 桥接模式 (Bridged)\n3. NAT\n4. 多宿主 (Multihomed)\n5. 双宿主 (Dual-homed)\n\
  \n# 第 31 章：环境编排\n\n![](img/chaptersquare.png)\n\n编排（Orchestration）是指对一个平衡、协调并能实现结果一致的过程进行组织。在音乐中，指挥家帮助组织音乐家们产生美妙时必须经历的过程。指挥家分析乐谱（音乐配方），确定所需的声音，并编排不同的个人音乐家以达到预期且一致的结果。\n\
  \n计算世界中的编排与音乐乐团有许多相似之处，不同在于涉及的不是音乐家，而是技术。例如，一些需要编排的 IT 过程如下：\n\n* 应用开发\n* 配置管理\n\
  * 灾难恢复\n* 服务器监控\n* 安全\n\n注意此列表中许多过程是重叠的。例如，安全不仅是服务器监控中的重要项目，对于列表中的其他成员也是如此。因此，IT\
  \ 编排通常涉及多个技术层和工具。在本章中，我将介绍认证涵盖的 IT 过程编排子集。\n\n## 理解编排概念\n\n如今备受关注的一个特定 IT 编排过程是\
  \ DevOps。这种方法改进了软件交付操作。DevOps 包括以下组件：\n\n* 持续集成\n* 持续测试\n* 持续交付（或部署）\n* 基础设施即代码\n\
  * 基础设施自动化\n* 监控与日志记录\n\n### 探测程序\n\n在 DevOps 中，核心思想是快速且持续向客户提供新的软件功能、错误修复和所需的修改。其重点是对应用进行持续的小范围更改，而不是大型的单体更新。\n\
  \n* **持续的应用处理**：一个 DevOps 层涉及软件版本控制（参见第 27 章 的“自动化任务”），它能将应用更改快速集成到主软件分支（`持续集成*`）。此外，这些更改会经过自动化测试，以避免在分支合并时破坏应用（`持续测试*`）。在上述两个组件的帮助下，软件会持续交付给客户（`持续交付*`）。\n\
  \n* **控制应用环境**：为了支持这种持续的应用处理层，DevOps 中开发环境和生产环境的匹配至关重要。这包括等效硬件、设备驱动程序、操作系统版本、软件库等。这一要求提供了一个软件开发环境，使其产生的生产代码不会因环境不匹配而产生错误或复杂问题。\n\
  \n* 此外，环境的变化必须以类似于编排软件版本的方式进行控制和测试。例如，如果开发环境中对 Linux 内核的受控更新引入了不可预的应用错误，则可以将环境回滚到之前的版本，直到错误被解决。环境更新通常以小块形式进行，就像处理应用版本一样，这样每个环境修改都能够得到妥当且离散的管理。测试过的新环境会被添加到注册表中，注册表中也会维护旧环境，以防需要回滚到较早的环境。\n\
  \n* **定义应用环境**：在 DevOps 中，开发环境和生产环境（基础设施）具有预定义的规范，例如使用什么硬件、基础操作系统以及任何所需的软件软件包和关键代码库。非硬件规范通常通过自动化代码实现到环境中（`配置管理*`）。\n\
  \n* 除了环境配置外，安全措施（如防火墙 ACL，参见第 18 章 的“监控 Linux 防火墙”以及身份验证策略（参见第 16 章 的“查看访问和验证方法”））也必须进行编排。这同样通过自动化代码实现到环境中（`策略即代码*`）。\n\
  \n* 配置管理和策略即代码属于`基础设施即代码*`这一术语。使用基础设施即代码的好处是环境是可重复的。此外，它们可以版本化，这对于在应用环境中对策略和配置实施版本控制是必要的。这一\
  \ DevOps 组件将在本章后部分进行详细介绍。\n\n* **部署应用环境**：应用及其开发环境通常以持续的方式移动到生产状态（生产环境）。“持续的方式”可以是每小时、每天、每周或任何满足应用业务要求的频率。\n\
  \n采用基础设施即代码技术的处在于，部署应用及其环境的过程很容易自动化（`基础设施自动化*`）。Red Hat 的 Ansible 产品就是用于此类 DevOps\
  \ 部署的工具之一。\n\n\n\n\n\n## 监控应用环境\n\n当应用在生产环境中运行时，需要对其进行监控和日志记录。软件指标、基础设施资源使用情况和性能统计只是需要监控和记录的项目中的一部分。其目标是跟踪应用环境并确保其符合预设条件（环境健康状况）。通常，这种监控也是自动化的。\n\
  \n随着业务需求的变化，记录的数据对于未来预期的环境状态具有重要价值。它提供了阈值和性能测量，使得在决定需要对应用或环境基础设施进行修改时更容易做出决策。\n\n\
  此外，监控还可以对潜在的故障或资源耗尽事件提供告警。如果超过了特定的预设限制，监控软件可以发布告警，甚至可以使用预定义的事件规则处理该事件。\n\n编排（Orchestration）是敏捷\
  \ DevOps 的关键。除了方法论之外，各种编排工具提供了在持续软件交付业务环境中成功所需的额外速度。\n\n### 分析属性\n\n虚拟化，更具体地说，容器（在第\
  \ 29 章，“理解云和虚拟化概念”中介绍介绍）对 DevOps 过程有很大帮助。DevOps 中的容器提供了以下功能：\n\n*   **静态环境**：容器提供了一个预设的应用环境（也称为\
  \ `container image`），该环境不会随时间而改变（不可变）。容器是使用预设的库、操作系统版本以及安全设置创建的。所有这些设置都被记录下来。镜像内部不会发布任何软件更新（例如通过\
  \ `sudo apt-get dist-upgrade` 命令）。\n\n*   **版本控制**：在软件开发过程之后、将修改后的应用容器镜像移动到生产环境之前，容器及其记录的配置将注册到版本控制系统中。版本控制系统可以包含之前的应用容器镜像，包括当前生产环境中的镜像。有些公司使用通过备份实现的人工版本控制系统。\n\
  \n*   **替换而非更新**：注册后，应用容器准备准备移动到生产环境了。不是更新生产应用容器镜像以匹配开发镜像，而是停止生产容器。然后用开发应用容器镜像替换生产容器并作为生产环境启动。因此，发生了环境切换。\n\
  \n*   **高可用性**：`Replication`（复制）是创建多个生产应用容器镜像副本并运行它们的过程。这允许你停止旧的当前未使用的生产应用容器，并将其替换为新的生产应用容器，为你的应用用户提供持续的运行时间。通过容器和复制，那种在凌晨时段关闭生产环境进行更新的旧方法已经消失了。\n\
  \n为了通过容器镜像完成这些任务，你需要编排。编排原则为在快速环境中（如使用 DevOps 的环境）实施应用容器镜像提供了工具、实用程序和指导。\n\n## 数据中心配置\n\
  \n如果实施得当，容器编排提供了一种提高应用部署速度和敏捷性的方法。无论公司的数据中心是在本地还是云端，你都可以使用编排概念快速快速应用所需的基础设施。以下章节介绍了一些重要的基础设施配置概念。\n\
  \n### 基础设施代码\n\n类似于物理数据中心，容器基础设施也需要管理和控制。在编排中，容器的配置处理方式类似于处理软件版本。\n\n*   **确定基础设施**：除了应用需求外，运行应用的环境必须经过预计划。这项活动是软件开发和技术运维之间的共同活动。在这种共同活动中，选择了容器的操作系统、库、服务、安全配置以及任何其他支持软件或网络实用。\n\
  \n*   确定的基础设施被冻结，以为开发和生产提供一个不可改变（不可变）的环境。通常，这种应用容器基础设施仅通过应用或开发者的 API 访问。为了保护其不可变环境，不提供如\
  \ `OpenSSH` 等远程访问服务。\n\n*   **记录基础设施**：预设的应用容器基础设施通常通过编排工具记录。配置管理和代码策略设置（在本章前面提到）被加载到实用工具的基础设施代码门户中，这一过程被称为\
  \ `automated configuration management`。数据随后被用于通过 `build automation` 部署和复制应用容器。\n\
  \n*   **提供版本控制**：基础设施代码信息不仅被记录。它还被插入到编排工具注册表中，提供版本控制。每当容器镜像基础设施发生变化时，其修改都会被跟踪。\n\
  \n*   **故障排除基础设施**：如果应用容器部署到生产环境并发生问题，由技术运维、软件开发人员或两者共同处理故障排除。要检查的一个项目是生产容器的记录配置（以及其版本），以确定是否有任何基础设施项目可能是祸首。\n\
  \n*   这为追踪导致所有问题的棘手新软件库提供了一种简单的方法。各种编排工具允许快速确定被修改的基础设施组件，并更快地解决问题。\n\n以这种方式处理应用基础设施增加了你的应用容器部署的敏捷性。它还提高了进入生产的速度。编排应用容器镜像的基本生命周期见图\
  \ 31.1。\n\n![应用容器生命周期的六步流程图，从设计应用容器配置到部署或复制生产应用容器](img/c31f001.png)\n\nFIGURE 31.1\
  \ 应用容器生命周期\n\n注意，在容器生命周期结束时（通常是当新应用容器镜像就绪时），容器镜像会被移除。然而，旧应用容器镜像的配置应该存储在版本控制系统（或备份存储）中，如果新应用容器镜像出现任何问题，则重新部署。\n\
  \n### 基础设施自动化\n\n通过自动化配置管理，不仅可以更轻松地排除基础设施故障并将环境回滚到之前的版本，部署也是自动化的。通常为了性能和负载均衡，需要多个应用容器。你的环境可能需要数百个运行中的生产应用容器。\n\
  \n目前使用的一些常用的自动化实用工具是\n\n\n\n\n\n- **Ansible**: 归 Red Hat 所有，其主要卖点是远程控制服务器不需要运行单独的代理包。Ansible\
  \ 使用 `OpenSSH` 和 `Python` 通过基于 `JSON` 的协议与远程服务器通信。配置文件是一个标准的文本文件，可以存储在加密库中。Ansible\
  \ 使用基于文本的剧本（playbook）为主机列表定义要执行的任务。\n- **Chef**: 一个基于 Ruby 的包，使用基于 Ruby 的“配方”（recipes）来定义服务器配置。可以在客户端服务器模式或独立模式下运行。\n\
  - **Puppet**: 使用自己的语言为远程服务器定义系统配置，因此配置时很少或不需要编程知识。它采用客户端/服务器架构，要求被远程控制的服务器在后台运行客户端。目前提供商业版和开源版本。\n\
  - **SaltStack**: 归 `VMWare` 所有，是一个基于 `Python` 的配置管理工具，将服务器配置数据存储在 `YAML` 数据结构中。\n\
  - **OpenTofu**: 由 `Linux Foundation` 管理，是 `HashiCorp` 商业自动化工具 `Terraform` 的分支。它使用标准的\
  \ `JSON` 数据格式来定义服务器配置数据。\n\n### 比较代理与无代理模式\n\n编排监控、日志和报告工具允许你跟踪应用容器的健康状况（运行性能以及每个容器是否仍然存活）。对这些工具可能对应用容器健康产生不利影响的担忧引发了代理与无代理之争。\n\
  \n`代理式监控工具`是编排工具，需要在被监控的应用容器中安装软件（一个 `agent`）。这些代理收集数据并将其传输到另一个位置，例如监控服务器。监控服务器管理信息、提供分析报告，并对事件（如容器崩溃）发送警报。\n\
  \n`无代理监控工具`同样是编排工具。在这种情况下，被监控的应用容器内不安装 `agent`。相反，该工具使用容器内部或容器外部环境中预有的以及/嵌入的软件来执行其监控活动。\n\
  \n使用基于代理还是无代理的编排工具存在激烈争论。一些人认为代理会对应用容器的性能有害，而另一些人则认为影响微乎其微。技术运维坚持认为无代理工具缺乏活性，而另一些人则认为在容器中安装和维护代理是不必要的麻烦。无论你选择哪一方，请意识到大多数公司都结合使用代理和无代理编排工具。\n\
  \n### 调查清单\n\n编排监控工具可以处理应用容器的意外死亡。当应用容器关闭时，会触发一个事件，并且不再满足`期望状态`（desired state）。期望状态是一个预设设置，声明了应该部署和运行的容器数量。\n\
  \n例如，假设你的软件应用程序需要运行 10 个生产应用容器来高效地处理负载。如果其中一个容器崩溃了，容器清单现在将切换为 `9`。这会触发监控工具中的事件，表明期望状态不再被满足。\n\
  \n许多编排工具采用`自愈`（self-healing）。通过自愈功能，如果当前没有实现`期望状态`，编排工具可以自动部署额外的生产应用容器。在之前的示例中，这意味着编排工具将使用容器存储的配置设置（构建自动化）立即启动额外的生产应用容器。不需要人工干预。\n\
  \n当首次部署一个新的生产应用容器时，自愈的编排属性会导致容器自动部署，直到满足期望状态。这非常方便。\n\n### 观察容器编排引擎\n\n容器编排（无论容器是在本地服务器上还是云端）都需要各种编排引擎（也称为`orchestration\
  \ systems`）。没有哪个系统可以包揽一切。最佳组合是一组通用和专门的编排工具。\n\n### 拥抱 Kubernetes\n\n`Kubernetes`\
  \ 最初由 `Google` 设计并使用，是一个开源的编排系统，被许多人视为事实上的标准。`Kubernetes` 不仅非常受欢迎且免费，它还具有高度的可扩展性、容错性且（相对）易学。\n\
  \n该系统包含了 `Google` 多年的编排经验，因为是开源的，所以添加了许多社区所需的功能。这是许多公司采用它进行容器编排的原因之一。\n\n每个由 `Kubernetes`\
  \ 管理的服务或应用程序都有以下主要组件：\n\n- **Cluster service**:集群服务，使用 `YAML` 文件部署和管理应用 pod\n- **Pod**:\
  \ 包含一个或多个运行中的容器\n- **Service**: 运行的应用容器的单实例\n- **Worker**: Pod 宿主机系统，使用 `kubelet`（`agent`）与集群服务通信\n\
  - **YAML file**: 包含特定应用容器的自动化配置管理和期望状态设置\n\n`YAML` 配置文件定义了集群中所有 pod 使用的设置。包括每个服务所需的副本数量、任何自定义网络设置（以便不同物理服务器上的\
  \ pod 可以相互通信）、共享存储卷设置、密钥（允许你加密服务中使用的密码）、日志文件以及每个容器中设置的系统变量。\n\n这种分布式组件配置允许高可扩展性和极大的灵活性。它也非常适用于采用\
  \ `DevOps` 模型的公司所需的持续软件交付。\n\n### 查看 Docker Compose\n\n作为 `Docker` 软件包的一部分，`Docker\
  \ Compose` 允许你在单个 `YAML` 文件中定义多个容器，然后定义容器共享共享资源，例如网络和数据卷连接。在 `Docker Compose` 中，单个应用容器被称为服务。\n\
  \n虽然 `Docker Container` 运行和管理多个容器的方式类似于 `Kubernetes`，但它只能在同一台物理服务器上操作。为了管理不同物理服务器上的多个容器，`Docker`\
  \ 有另一个软件包，将在下一节中描述。\n\n### 检查 Docker Swarm\n\n流行的应用容器管理工具 `Docker` 创建了自身的编排系统来管理运行在不同物理服务器上的容器，称为\
  \ `Docker Swarm`（也称为 `Swarm`）。在在 Docker Swarm` 中，与 `Docker Compose` 类似，应用容器被称为服务，每个物理服务器被称为\
  \ `node`。一组 `Docker` 容器被称为集群，对用户而言表现为一个单个容器。要编排 `Docker` 集群，你可以使用 `Swarm`。\n\n通过\
  \ `Swarm` 系统，你可以监控集群的健康状况，并在集群内的某个容器失败时将集群恢复到期望状态。如果未达到理想的应用性能，你还可以部署额外的 `Docker`\
  \ 容器。在部署额外容器方面，`Swarm` 通常比 `Kubernetes` 快。\n\n虽然没有 `Kubernetes` 编排系统受欢迎，但 `Docker\
  \ Swarm` 也有其用之地。它通常被那些编排的新手且已经熟悉 `Docker` 工具的人使用。\n\n## 总结\n\n\n\n\n\n编排可能涉及计算世界内部和外部的过程，因为许多系统需要和谐、平衡且协调的程序来实现结果的一致性。DevOps\
  \ 是一种从编排中极大获益的 IT 方法，包括应用容器编排。这些项目带来的收益实现了软件的持续交付等功能。即使在 DevOps 之外，应用容器编排对许多企业环境也有益。\n\
  \n## 考试要点\n\n### 描述编排流程。\n首先根据选定的操作系统、库和支持软件设计应用容器，并将其作为安全和身份验证策略安装。在镜像设计完成后，会对其进行记录并存储，通常存储在版本控制注册表中。根据需要部署并复制应用容器。此时，应用容器进入监控阶段，该阶段将持续持续到容器镜像不再被需要为止。\n\
  \n### 解释编排的应用容器属性。\n应用容器镜像是静态的（不可变的），在完成设计和记录后不会发生变化。对于开发类应用容器，仅修改应用程序本身，而不修改基础设施或策略。容器镜像注册在版本控制系统中，以协助进行故障排除，并在需要时进行回滚。当新的应用容器镜像就绪时，会停止旧的生产容器镜像，而不是对其更新。在原位置启动新的应用容器。应用容器是可以复制的。因此，如果需要额外的应用容器，则复制新镜像以满足需求。\n\
  \n### 总结容器监控。\n编排监控工具可以在应用容器上安装软件（代理模式），也可以使用已嵌入或其他预定义的容器软件（无代理模式）。监控实用程序收集性能数据和软件指标，并监控应用容器的健康状况。如果容器数量低于预期状态，编排工具可以使用自动化配置管理和构建自动化来复制容器数量，将应用容器数量恢复到预期状态。\n\
  \n## 复习题\n\n1. 下列哪些项可以使用编排？（选择所有适用项。）\n    1. 软件开发\n    2. 音乐制作\n    3. 服务器监控\n\
  \    4. DevOps\n    5. 容器\n\n2. 技术运营负责人 Connie 为开发团队提供了一个目前与生产环境匹配的开发环境。她坚持认为除了应用程序修改外，环境不应发生变化。该开发环境应该具备什么属性才能满足\
  \ Connie 的要求？\n    1. 自复制\n    2. 不可变\n    3. Kubernetes\n    4. 基础设施即代码\n    5.\
  \ 自愈\n\n3. 软件开发团队负责人 Bill 理解 Connie（技术运营负责人）对静态且匹配的开发环境的需求。然而，由于他们在使用容器，Bill 建议了一个更好的改进方案。他应该建议以下哪项？\n\
  \    1. 修改生产容器，使其在应用程序准备好上线时能与开发容器匹配。\n    2. 在应用程序准备好上线时，将应用程序从开发容器移动到生产容器。\n \
  \   3. 在应用程序准备好上线之前，停止开发容器上发生任何软件更新。\n    4. 在应用程序准备好上线时，用开发容器替换生产容器。\n    5. 在应用程序准备好上线时，移除开发容器上任何生产容器中不存在的更新。\n\
  \n4. 下列哪种编排容器属性最能为应用用户提供高可用性？\n    1. 不可变性\n    2. 版本控制\n    3. 复制\n    4. 自动化\n\
  \    5. 文档记录\n\n5. 在 DevOps 和容器编排中，操作系统、库和安全策略等非硬件项目在编排工具中被记录，并实现到预期环境中，这些统称为什么？\n\
  \    1. Marathon（马拉松）\n    2. 构建自动化\n    3. 开发环境\n    4. 容器\n    5. 基础设施即代码\n\n\
  6. Ward 女士需要将一个应用容器移动到生产环境。她使用了一种编排工具，使用预定义的基础设施即代码来部署和复制所需的生产容器镜像。Ward 女士使用了什么编排概念？\n\
  \    1. 监控\n    2. 构建自动化\n    3. 复制\n    4. 版本控制\n    5. Docker Swarm\n\n7. 下列哪些项是容器编排中自动化配置管理的优势？（选择所有适用项。）\n\
  \    1. 容器可以自动部署。\n    2. 容器可以自动复制。\n    3. 更容易排除基础设施问题。\n    4. 实现了软件持续交付。\n  \
  \  5. 基础设施修改被跟踪。\n\n8. Abbot 先生正在记录新编排工具的需求。他需要工具自动部署和复制任何崩溃的容器。这称为什么？\n    1. 自愈\n\
  \    2. 构建自动化\n    3. 持续集成\n    4. 基础设施即代码\n    5. Pod 构建\n\n9. 下列哪些是编排监控工具可能收集、使用或监控的项目？（选择所有适用项。）\n\
  \    1. 版本控制错误\n    2. 应用容器性能\n    3. 应用指标\n    4. 应用容器健康状况\n    5. 默认状态\n\n10.\
  \ Connie 为她的应用容器选择了一个无代理编排监控工具。她在做出这一决定时可能使用了以下哪些原因？（选择所有适用项。）\n    1. Connie 想在每个应用容器上安装监控软件。\n\
  \    2. 她不想在每个应用容器上安装监控软件。\n    3. Connie 担心容器性能受到监控软件的负面影响。\n    4. 她不担心容器性能受到监控软件的负面影响。\n\
  \    5. Connie 想使用大多数公司使用的编排监控工具。\n\n# 录\n\n## 复习题答案\n\n### 第一章：准备你的环境\n\n1. B.\
  \ GPL 许可证模型要求任何衍生软件也必须使用 GPL 许可证发布，因此选项 B 正确。MIT 许可证不要求你对衍生软件进行授权，因此选项 A 错误。Apache\
  \ 许可证允许你使用任何许可证发布衍生软件，因此选项 C 错误。LGPL 许可证不要求你向公众发布衍生软件，因此选项 D 错误。专有许可不允许你发布任何衍生软件，因此选项\
  \ E 错误。\n\n2. C. RISC-V 架构是任何 CPU 制造商均可使用的开放标准，因此选项 C 正确。x86 和 x86_64 架构是 Intel\
  \ old 的专有架构，因此选项 A 和 B 错误。s390x 架构由 IBM 发布且并非开放，因此选项 D 错误。aarch64 架构由 ARM 公司发布，因此选项\
  \ E 错误。\n\n3. A. 基于 dpkg 的发行组基于 Debian Linux 发行版，因此选项 A 正确。选项 B aarch64 是一种 CPU\
  \ 架构类型而非发行组，因此是错误的。选项 C (GPL) 和 E (LGPL) 是许可证模型而非发行组，因此它们都是错误的。基于 RPM 的发行组基于 Red\
  \ Hat Enterprise Linux 发行版，而不是 Debian Linux 发行版，因此选项 D 错误。\n\n## 第二章：服务简介\n\n\n\n\
  \n\n### 1. Web 服务器与数据库\n`Apache` Web 服务器因与 `Linux` 操作系统、`MySQL` 数据库服务器以及 `PHP` 编程服务器结合而流行，构成了\
  \ `LAMP` 栈。`NginX` 服务器是一个较新的 Web 服务器，正变得流行，但它不是 `LAMP` 栈的一部分。`Lighthttpd` Web 服务器内存和\
  \ CPU 占用较小，非常适合嵌入式系统，但不适用于大型 `LAMP` 应用。`PostgreSQL` 软件包是一个数据库服务器，而不是 Web 服务器。\n\n\
  ### 2. 守护进程与服务\n`daemon`（守护进程）是一个在后台运行并监听客户端连接请求的应用程序，因此选项 A 是正确答案。超级服务器（super-server）监听多个应用程序，因此选项\
  \ B 不适用。`shell` 不监听网络连接；它以交互式方式启动应用程序，因此选项 C 是错误的。图形桌面也允许你启动应用程序，但它不监听客户端连接请求，因此选项\
  \ D 是错误的。\n\n### 3. 数据库性能\n`MySQL` 数据库服务器在首次发布时侧关注速度，使其成为高流量互联网 Web 应用的热门选择，因此选项\
  \ C 是正确的。`MongoDB` 数据库服务器提供面向对象的数据库功能，但不关注性能，因此选项 A 是错误的。`PostgreSQL` 数据库侧重于实现复杂的数据库功能而非速度，因此选项\
  \ B 是错误的。`NoSQL` 是一种结合了对象数据记录的数据库存储方法，本身并不是数据库服务器软件包，因此选项 D 是错误的。\n\n### 4. 网络服务\n\
  `Linux` 服务在已知端口上监听客户端的请求，因此选项 B 是正确的。服务器通常有一个 IP 地址以支持多个应用程序，因此选项 A 是错误的。服务器通常也只有一个以太网地址，因此选项\
  \ C 是错误的。客户端不能在服务器上启动单独的服务，因此选项 D 是错误的。\n\n### 5. 负载均衡\n`nginX` Web 服务器还可以充当负载均衡器并工作，将客户端请求发送到多个后端\
  \ Web 服务器，因此选项 A 是正确的。`Apache` 和 `lighthttpd` Web 服务器不支持此功能，因此选项 B 和 D 是错误的。`PostgreSQL`\
  \ 服务器是数据库而非 Web 服务器，因此选项 C 是错误的。\n\n### 6. 数据存储\n`MongoDB` 数据库服务器使用 `JSON` 格式存储数据记录。关系型数据库是一种数据库系统，而不是存储数据的方法，因此选项\
  \ A 是错误的。`YaML` 是一种用于创建配置文件的纯文本方法，但它不用于 `MongoDB` 存储数据，因此选项 B 是错误的。`MongoDB` 数据通常不加密，因此选项\
  \ D 也是错误的。\n\n### 7. 邮件系统 (MTA, MUA, MDA)\n`MTA` 软件包负责连接远程邮件主机以递送邮件消息，因此选项 B 是正确的。`MUA`\
  \ 允许客户端连接到邮件服务器读取消息，因此选项 A 是错误的。`MDA` 允许你创建本地处理邮件的规则，而不是远程服务器，因此选项 C 是错误的。`Evolution`\
  \ 是一个邮件 `MUA` 客户端应用程序，而不是服务器 `MTA` 软件包。`Evolution` 软件包是一个图形邮件客户端，因此选项 D 是错误的。\n\n\
  ### 8. 邮件过滤\n`MDA` 允许你创建过滤器匹配邮件消息并重定向到其他文件夹，因此选项 C 是正确的。`MUA` 是用户界面，不控制服务器如何递送入邮件，因此选项\
  \ A 是错误的。`MTA` 将邮件递送到远程主机并接收来自远程主机的邮件，因此选项 B 是错误的。`Evolution` 软件包是用于客户端的图形 `MUA`\
  \ 包，不允许你创建过滤器来递送邮件消息，因此选项 D 是错误的。\n\n### 9. 网络协议\n`NFS` 协议用于在网络上与客户端共享文件夹区域，因此选项\
  \ D 是正确的。`SNMP` 是一种用于管理远程设备的网络协议，因此选项 A 是错误的。`NTP` 是一种用于设置服务器时间的网络协议，因此选项 B 是错误的。`DHCP`\
  \ 是一种用于为网络设备分配 IP 地址的网络程序，因此选项 C 是错误的。\n\n### 10. Samba 和 SMB\n`Samba` 软件包允许 `Linux`\
  \ 服务器使用 `SMB` 协议与 `Windows` 服务器和客户端通信，因此选项 B 是正确的。`ntpd` 守护进程监听来自远程时间服务器的请求，因此选项\
  \ A 是错误的。`DHCPd` 软件包在 `Linux` 服务器上提供 `DHCP` 服务以分配网络 IP 地址；它不允许工作站映射 `Linux` 服务器上的文件夹，因此选项\
  \ C 是错误的。`Evolution` 软件包是一个用于访问邮件文件夹中邮件的图形桌面程序，不是服务器服务，因此选项 D 是错误的。\n\n### 11. 日志系统\n\
  `rsyslogd` 程序被 `SysV init` 系统用于记录事件，`journald` 程序被 `Systemd` 系统用于记录事件，因此选项 A 和 B\
  \ 是正确答案。`ntpd` 程序提供时间服务而非日志服务，因此选项 C 是错误的。`DHCPd` 程序用于在本地网络上分配 IP 地址，而非日志服务，因此选项\
  \ D 是错误的。\n\n### 12. 时间同步\n`ntpd` 服务使用 `NTP` 将服务器时间与远程系统同步，因此选项 C 是正确的。`DHCPd` 程序为本地网络上的设备分配\
  \ IP 地址而非时间，因此选项 A 是错误的。`BIND` 程序提供主机名解析服务而非时间服务，因此选项 B 是错误的。`Samba` 软件包允许 `Linux`\
  \ 服务器与 `Windows` 客户端和服务器进行交互，但它不提供时间服务，因此选项 D 是错误的。\n\n### 13. 打印服务\n`CUPS` 应用程序提供打印机驱动程序和服务，允许\
  \ `Linux` 系统连接本地和远程打印机，因此选项 D 是正确的。`DHCPd` 程序为本地网络上的设备分配 IP 地址但不连接远程打印机，因此选项 A 是错误的。`BIND`\
  \ 应用程序提供主机名解析服务但无法连接打印机，因此选项 B 是错误的。`ntpd` 程序允许你将服务器时间与远程时钟同步，但不连接网络打印机，因此选项 C 是错误的。\n\
  \n### 14. 主机名解析\n`named` 程序是 `BIND` 应用程序的一部分，该程序提供主机名解析服务，因此选项 B 是正确的。`ntpd` 程序提供网络时间，因此选项\
  \ A 是错误的。`DHCPd` 程序在本地网络上提供动态 IP 地址分配，因此选项 C 是错误的。`CUPS` 应用程序在 `Linux` 系统上提供打印服务，因此选项\
  \ D 是错误的。\n\n### 15. 安全与身份验证\n`NIS` 软件包曾被称为 `Yellow Pages (YP)`，但由于商标问题必须更改名称，因此选项\
  \ C 是正确的。`Samba` 软件包在 `Linux` 中提供 `Windows` 客户端和服务器服务指的是一种流行的拉丁舞，而非 `Yellow Pages`，因此选项\
  \ A 是错误的。`Kerberos` 软件包在 `Linux` 中确实提供身份验证服务，指的是守卫冥界的三头犬，而非 `Yellow Pages`，因此选项\
  \ B 是错误的。`BIND` 应用程序指的是将名称绑定到 IP 地址，功能与 `Yellow Pages` 类似，但它以前并不被称为 `Yellow Pages`，因此选项\
  \ D 是错误的。\n\n### 16. DHCP 服务\n`DHCPd` 程序在本地网络上提供 `DHCP` 服务器服务，因此选项 A 是正确的。`BIND`\
  \ 软件包提供主机名解析服务；它不分配 IP 地址，因此选项 B 是错误的。`ntpd` 软件包提供网络时间而非地址服务，因此选项 C 是错误的。`Evolution`\
  \ 是用于读取邮件的客户端 `MUA` 软件包；它不为客户端提供 IP 地址，因此选项 D 是错误的。\n\n\n\n\n\n### 17\nC. `OpenSSH`\
  \ 包允许你使用证书在网络上的两个设备之间建立安全连接，因此选项 C 是正确的。`BIND` 包提供的是主机名解析，而不是安全连接，因此选项 A 是错误的。`ntpd`\
  \ 包在网络上提供时间服务，而不是安全连接，因此选项 B 是错误的。`OpenSSL` 包允许你创建用于加密通信的证书，但它本身不执行通信，因此选项 D 是错误的。\n\
  \n### 18\nC. Web 代理服务器允许你拦截客户端 Web 请求，并根据你定义的规则拦截任何请求，因此选项 C 是正确的。`DHCP` 服务器为本地网络上的设备分配\
  \ IP 地址；它不会拦截 Web 请求，因此选项 A 是错误的。Web 服务器托管网站，但不拦截本地客户端发出的请求，因此选项 B 是错误的。容器允许开发者在环境中环境中部署\
  \ Web 应用程序，但不拦截来自本地客户端的请求，因此选项 D 是错误的。\n\n### 19\nA. 负载均衡器将客户端请求发送到服务器集群中的一台服务器，以在服务器之间平衡流量，因此选项\
  \ A 是正确的。Web 代理服务器拦截客户端的 Web 请求，但只能过滤或将请求传递给目标主机，因此选项 B 是错误的。`DHCP` 服务器为本地网络上的设备分配\
  \ IP 地址，但不能帮助增加网络应用程序的性能，因此选项 C 是错误的。容器允许开发者轻松将 Web 应用程序部署到不同的环境，但无法控制流量流向哪台服务器，因此选项\
  \ D 是错误的。\n\n### 20\nC. 容器允许开发者在受控环境中开发应用程序，并可以轻松部署到其他服务器上，因此选项 C 是正确的。Web 代理拦截客户端的\
  \ Web 请求，但不控制应用程序如何部署，因此选项 A 是错误的。`DHCP` 服务器为本地网络上的设备分配 IP 地址，但不控制应用程序如何部署，因此选项\
  \ B 是错误的。集群可以通过在多个服务器之间分配负载来帮助应用程序性能，但无法控制开发者如何将应用程序部署到服务器上，因此选项 D 是错误的。\n\n## 第\
  \ 3 章：管理文件、目录和文本\n\n### 1\nC. 选项 C 会每个目录名称后添加 `/` 指示代码，因此它是最佳选择。`mkdir -v` 命令创建一个目录并让你知道是否成功，但它不会指示目录，因此选项\
  \ A 是错误答案。`ls` 命令仅显示文件和目录名称，因此选项 B 也是错误答案。`ls -i` 命令将显示文件名及其 inode 号，但它不会指示目录，因此选项\
  \ D 是错误的。虽然选项 E 在某些发行版中可以生成可以指示目录的详细列表，但此命令在每个发行版中都没有别命名为 `ls -l`，因此它不是最好的命令。\n\n\
  ### 2\nB. `ls` 命令的 `-d` 选项允许你查看目录文件的元数据，而不是查看该目录管理的文件元数据。因此，选项 B 是正确选择。选项 A 是错误答案，因为\
  \ `-a` 选项强制 `ls` 命令显示隐藏文件（以点 `.` 开头的文件）。`-F` 选项会在每个文件后添加指示代码，但不会让你查看目录的元数据，因此选项\
  \ C 是错误选择。由于你正在查看元数据，已经在使用 `-l` 选项，因此不需要添加。因此，选项 D 是错误答案。`-R` 选项允许你通过目录树递归查看文件信息，因此选项\
  \ E 也是错误选择。\n\n### 3\nA. `mkdir -v` 命令创建一个目录并让你知道是否成功，因此选项 A 是正确答案。`touch` 命令创建空白和空文件，因此选项\
  \ B 是错误的。`cp -R` 命令将递归地将包含许多文件的整个目录复制到另一个目录。由于你不知道 `TheDir` 目录是否为空，你很可能没有使用此命令。选项\
  \ C 是错误答案。`mv -r` 命令将目录重命名为新目录名。同样，你不知道 `TheDir` 目录是否为空，所以很可能没有使用此命令，因此选项 D 也是错误答案。选项\
  \ E 是错误答案，因为 `rmdir` 命令删除空目录。\n\n### 4\nE. `rsync` 实用允许你执行快速本地复制，因此对于大文件来说，它是这种情况下最好的用工具。因此，选项\
  \ E 是正确答案。`readlink -f` 命令通过一系列软链接找到被指向的文件，因此选项 A 是错误答案。`mv` 命令将重命名文件而不是创建备份副本，因此选项\
  \ B 是错误的。`cp` 命令确实会创建文件副本。但它不像 `rsync` 工具那么快，因此不是最佳选择。选项 C 是错误答案。`scp` 命令也会创建文件副本。但是，它也不像\
  \ `rsync` 工具那么快，因此不是最佳选择。选项 D 也是错误答案。\n\n### 5\nE. `rm -rI` 命令将递归删除 `/home/Zoe`\
  \ 目录树中的文件，并在启动前会询问，所以你知道你正在删除正确的树。因此，选项 E 是最佳答案。选项 A 是错误的，因为 `cp` 命令只是复制文件，它不会删除它们。选项\
  \ B 是错误的，不仅部分目录名大小错误，而且没有验证正确的目录已移动到黑洞设备 `/dev/null/`。`rm -Rf` 命令可行，但它不是最好的命令，因为它在启动前不会询问，所以你不知道正在删除正确的树。事实上，`-f`\
  \ 选项会抑制错误消息，因此选项 C 是错误的。选项 D 也可行，但不是最佳答案，因为它使用了 `-i` 选项。如果 Zoe 的主目录下有很多多年的文件，你可能需要坐在那里很久来删除文件，因为在删除每个文件之前你必须确认。因此，选项\
  \ D 是错误答案。\n\n### 6\nB, C, E. 重命名目录时，你只需要使用 `mv` 命令。然而，使用 `-i` 选项是明智的，因为如果新目录名已存在，实用程序将停止并在继续前请求权限。更好的是使用\
  \ `-n` 选项；这样，如果你选择的新名称已被占用，`mv` 命令不允许你覆盖它。此外，`-v` 选项也值得使用，因为它让 `mv` 命令以详细模式运行，告诉你正在发生什么。因此，选项\
  \ B、C 和 E 都是正确选择。`-f` 选项不是明智的选择，因为即使已经存在同名的目录，它也会强制重命名。因此，选项 A 是错误答案。此外，没有 `-r`\
  \ 选项，因为使用 `mv` 命令重命名目录不需要任何递归操作。因此，选项 D 是错误选择。\n\n\n\n\n\n### 7\nB. 选项 B 是正确答案，因为硬链接会防止其他三个命令行界面用户意外删除数据。如果他们删除了自己的链接名称，并不会删除数据。选项\
  \ A 是错误选择，因为硬链接文件必须共同存在于文件系统中。选项 C 也是错误选择，因为如果你不向其他三个数据用户提供符号链接（symbolic links），他们将不得不直接访问文件并可能删除它。虽然创建符号链接可以通过让数据存储在不同的文件系统中来保护数据，但如果是任务关键数据，所采用的文件系统应该足够严谨以保护数据，因此你唯一的威胁将是人为因素。因此，选项\
  \ D 是错误答案。符号链接文件不共享索引节点（inode number）。因此，选项 E 是错误选择。\n\n### 8\nA. `cat -v` 命令将显示可能嵌入到控制文件中任何非打印字符，这些字符可能导致文件损坏，因此选项\
  \ A 是正确答案。`-z` 选项仅让你在行尾字符为 NUL 时才能看到它们，因此选项 B 是错误的选择。`-n` 选项仅对输出的文本行进行编号，所以选项 C\
  \ 也是错误答案。`cat -s` 命令将文件中的多个空行显示为一个空行。这无助于调查，所以选项 D 是错误答案。`-E` 选项在每次遇到换行符时都会显示 `$`，虽然可能有所帮助，但它不是这种情况下使用的选项。因此，选项\
  \ E 是一个错误的答案。\n\n### 9\nD. 选项 D 是正确答案，因为要使用的最佳命令是 `pr -mtl 20`。这会将并列显示文件，移除任何文件头或页尾，并将页长度设置为\
  \ 20 行，以便文件不会超出你的屏幕。当然，你可能需要根据屏幕的分辨率调整行长度。选项 A 是错误的，虽然它会并列显示文件，但显示内容可能会超出屏幕。选项 B\
  \ 也是错误的，因为该命令不会并列显示你的文件。选项 C 是一个错误选择，因为 `cat` 命令不会并列显示文件。选项 E 的命令可能对你有效，但它不是最佳选择，因为文件头或页尾不会被移除。因此，选项\
  \ E 是一个错误答案。\n\n### 10\nC. `head` 命令可以使用 `-n 15` 关或 `-15` 关来显示文件的前 15 行。因此，选项 C\
  \ 是正确答案。要显示文件除最后 15 行以外的所有内容，你需要使用 `-n -15` ，所以选项 A 是错误的。要显示除前 15 行以外的内容，你需要使用 `tail`\
  \ 命令而不是 `head` 命令，所以选项 B 是一个错误的答案。此外，你需要使用 `tail` 来显示文件的最后 15 行，所以选项 D 也是一个错误答案。选项\
  \ E 是一个错误选择，因为该命令在这种情况下不会生成错误消息。\n\n### 11\nE. 账号 Hal 可能在生成的文本文件中以 `hal` 的形式列出。因此，你最好的下一步是在\
  \ `grep` 命令上使用 `-i` 选项。这将快速搜索文件中的单词 `Hal`，同时忽略大小写。选项 E 是正确答案。选项 A 是错误的选择，因为 `tail`\
  \ 命令不允许你搜索文件。选项 B 也是一个错误答案，因为 `cat` 命令只会将整个文本文件显示在屏幕上，并不是查找几行文本的高效方法。虽然你最终可能需要重新生成文本文件，在此之前，你应该忽略大小写检查\
  \ `Hal`。如果你找到了记录，那么你就节省了一些时间。因此，选项 C 也是一个错误选择。最后，`grep` 命令上的 `-d skip` 选项允许搜索跳过任何目录文件。此选项在这种情况下毫无用，因此选项\
  \ D 是一个错误答案。\n\n### 12\nB. 分页器（pager）工具允许你每次查看一文本，并按照自己的节奏移动文本。因此，选项 B 是正确答案。一个只允许查看文件前几行的工具在这种情况下是没用的，而且这些工具不被称为分页器。因此，选项\
  \ A 是一个错误的答案。虽然 `less` 工具是一个分页器并允许你搜索文本文件，但同事提到了分页器，包含了 `more` 工具。使用 `more` 工具时你无法搜索文本，所以选项\
  \ C 是一个错误选择。你不需要过滤文件中的文本，过滤工具不被称为分页器，所以选项 D 是一个错误的答案。一个只允许查看文件最后几行的工具在这种情况下是没用的，而且这些工具不被称为分页器。因此，选项\
  \ E 是一个错误选择。\n\n### 13\nE. 你需要使用 `q` 键退出 `less` 分页器工具；因此，只有选项 E 没有描述 `less` 是正确答案。选项\
  \ A 是错误的答案，因为 `less` 在显示文件的第一页之前不会读取整个文件。你还可以使用向上向下方向键遍历文件，并使用空格键向前页以及 `Esc+V` 组合键向后页，所以选项\
  \ B、C 和 D 都是错误答案。\n\n### 14\nB. 与 `diff` 命令配合使用的 `-q`（或 `--brief`）选项允许你快速判断两个文本文件是否不同。因此，选项\
  \ B 是正确答案。`-e` 选项允许你创建一个 `ed` 脚本供以后使用，所以选项 A 是一个错误选择。`-s` 选项确实允许查看文件是否相同，并显示一条说明这一事实的简单消息。然而，它侧重于文件差异，因此它不是最佳选项。因此，选项\
  \ C 也是一个错误的答案。`diff` 命令的 `-W` 选项允许你设置显示宽度，因此选项 D 是一个错误选择。`-y` 选项以两列显示两个文件，所以选项 E\
  \ 也是一个错误的选择。\n\n### 15\nC. 选项 C 是正确答案，因为 `which` 命令将允许你快速看到作为参数提供的程序的位置。如果你没有看到响应，可以继续下一个故障排除步骤：确定程序是否未安装。选项\
  \ A 不是正确的，因为这些操作只会调回原始的 `diff` 命令并重试。注销再登录可能会重置你创建的一些变量，但这不是此故障排除过程中良好的第一步。因此，选项\
  \ B 是一个错误的答案。输入 `whereis diff` 命令将提供有关 `diff` 命令的额外信息，例如程序位置、源代码文件位置以及手册页位置。这些额外信息，所以选项\
  \ D 是一个错误选择。仅仅因为命令不起作用就重启服务器不是良好的第一步。因此，选项 E 也是一个错误的答案。\n\n### 16\nE. 默认情况下，`locate`\
  \ 命令使用文件通配（globbing），这会在你输入的模式中添加通配符。因此，`conf` 变为 `*conf*`。因此，选项 E 最好解释了结果并是正确答案。`locate`\
  \ 命令将搜索指定模式的文件名和目录名，除非提供了修改此行为的选项。因此，选项 A 是一个错误答案。`locate` 命令没有使用 `-d skip` 选项（虽然\
  \ `grep` 命令确实使用了它），所以选项 B 是一个错误的答案。因为命令运行正常，所以 `locate` 数据库没有问题，所以选项 C 是一个错误选择。此外，`locate`\
  \ 命令中没有使用正则表达式开关，所以选项 D 也是一个错误选择。\n\n\n\n\n\n### 17. A. `locate` 实用搜索 `mlocate.db`\
  \ 数据库，该数据库通常每天通过 `cron` 任务更新一次。因此，对于这个新创建的文件，你应该做的第一件事是使用超级用户权限通过 `updatedb` 命令更新\
  \ `mlocate.db`。因此，选项 A 是正确答案。在更新数据库后，选项 B、C 或 E 中的任何命令都运行得相当良好，其中选项 B 的命令是最佳选择。然而，对于第一步，选项\
  \ B、C 和 E 都是错误答案。重新下载文件既冗长又耗时，而且可能不必要地消耗磁盘空间。因此，选项 D 是错误选择。\n\n### 18. D. 使用 `locate`\
  \ 命令时，`path` 参数第一个列，这是一个起始目录。`find` 实用将在该目录及其所有子目录（递归地）中搜索你正在寻找的文件或文件。此外，`-name`\
  \ 选项允许你通过名称搜索文件，因此选项 D 是正确答案。选项 A 是错误的，因为没有 `-r` 选项，而且不需要它。选项 B 不是这种情况下最好的命令，因为起始目录是\
  \ `/`，它是虚拟目录结构的根。从 `/etc` 目录开始要好得多，因为文件可能位于该目录树的某个地方。使用 `-maxdepth` 选项可能会干扰搜索，因为它设置了停止搜索的子目录级别。因此，选项\
  \ C 是错误答案。选项 E 是错误选择，因为 `path` 和文件名颠反了，并且缺少了 `-name` 选项。\n\n### 19. E. `find / -nouser`\
  \ 命令将搜索整个虚拟目录结构，寻找任何没有关联用户名的文件。由于 Michael 的账户和主目录已被删除，他在虚拟目录结构中拥有的任何文件都将没有关联用户名，而只有一个用户\
  \ ID (UID)。因此，选项 E 是最佳答案。选项 A 是错误的，因为 `-name` 选项用于文件名，而不是用户名。选项 B 也是错误答案，因为 `-user`\
  \ 选项用于搜索由特定账户拥的文件。由于 Michael 的账户已被删除，他的用户名将不再与任何文件关联。选项 C 是错误答案，因为你不知道他的文件何时发生过数据更改（如\
  \ `-mmin` 选项所示），因此这是尝试识别它们的一种坏方法。选项 D 是错误选择，因为 `find` 命令是从用户的主目录而不是虚拟目录结构的根 (`/`)\
  \ 开始搜索过程的。\n\n### 20. C. `grep` 实用允许你快速且有效地搜索文件内容。因此，选项 C 是正确答案。`which` 实用可以帮助你通过名称定位程序的位置，但它不搜索内容，所以选项\
  \ A 是错误选择。`whereis` 命令将搜索文件的程序位置、源代码文件和帮助页，但它不能搜索文件的内容，因此选项 B 也是错误选择。`locate` 实用将使用名称搜索文件的位置，但不能搜索文件的内容，因此选项\
  \ D 是错误答案。`find` 命令可以使用文件的元数据来找到文件，但它不搜索文件内部，所以选项 E 是错误选择。\n\n## 第 4 章：搜索与分析文本\n\
  \n### 1. C. 文本文件记录被视为单行文件，并以换行行符（即 ASCII 字符 LF）结束。你可以通过 `cat -E` 命令查看你的文本文件是否使用这种结束符。因此，选项\
  \ C 是正确答案。文本文件可能已经损坏，但此命令并没有指示这一点，所以选项 A 是错误选择。文本文件记录以 ASCII 字符 LF 结束，而不是 NUL 或\
  \ `$`。因此，选项 B 和 D 是错误的。文本文件记录末尾完全可能包含一个 `$`，但你无法通过描述判断，所以选项 E 是错误答案。\n\n### 2. E.\
  \ 为了正确使用某些 `cut` 命令选项，每个文本文件记录中必须存在字段。这些字段是由于分隔符分隔的数据，分隔符是一个或多个字符，它们在记录内的不同数据项之间创建边界。因此，选项\
  \ E 最好地描述了分隔符，是正确答案。选项 A 是虚构的，是错误答案。选项 B 描述的是结束符，例如 ASCII LF。选项 C 是虚构的，是错误答案。虽然单个空格和冒号可以作为分隔符，但选项\
  \ D 不是最佳答案，因此是错误选择。\n\n### 3. C, D. 记住，许多处理文本的实用程序除非使用重定向，否则不会更改文件内的文本。列表中允许你修改文本的实用程序包括文本编辑器\
  \ `vim` 和 `nano`。因此，选项 C 和 D 是正确答案。`cut`、`sort` 和 `sed` 实用从指定的文本文件中收集数据，根据所使用的选项对其进行修改，并将修改后的文本输出到标准输出。文件中的文本并未被修改。因此，选项\
  \ A、B 和 E 是错误选择。\n\n### 4. A. `cut` 命令从列为最后一个参数的文件中收集数据，并根据所使用的选项进行显示。定义分隔符为逗号的选项是\
  \ `-d,`。不需要特殊开关。因此，选项 A 是正确选择。选项 B 使用了不需要的 `-z` 选项，因此是错误答案。选项 C 是错误选择，因为它反转了 `-f`\
  \ 和 `-d` 选项。选项 D 和 E 是错误答案，因为它们将文件名放在了命令之前。\n\n### 5. D. 选项 D 是最佳答案，因为正则表达式程序（如\
  \ `grep`）定义的模式模板，程序使用该模式过滤文本。虽然你可以在 `grep` 中使用一组字符，但它们不被称为正则表达式，所以选项 A 是错误答案。选项\
  \ B 描述的是结束符而不是正则表达式，所以它也是错误答案。虽然 `?` 在正则表达式中使用，但 `*` 没有（然而，`.*` 被使用了）。因此，选项 C 是错误选择。引号可能用于\
  \ `pattern` 周围，但它们不被视为表达式字符，因此选项 E 是错误答案。\n\n### 6. B. 选项 B 是最佳命令，因为此 `grep` 命令采用了了正确的语法。它在\
  \ `pattern` 周围使用引号以避免意外结果，并使用 `.*` 正则表达式字符表示 May 30 和 IPv4 地址之间可以有任何内容。不需要额外的开关。选项\
  \ A 不是最佳 `grep` 命令，因为它使用了错误的正则表达式 `?`，它只允许在 May 30 和 IPv4 地址之间存在一个字符。选项 C 和 D 不是最佳\
  \ `grep` 命令，因为它们使用了 `-i` 选项来忽略大小写，而这在当前情况下是不需要的。选项 E 中的 `grep` 命令是一个错误选择，因为它使用了\
  \ `-v` 选项，该选项会显示不匹配 `pattern` 的文本记录。\n\n### 7. A, B, C, E. BRE 是一种基础正则表达式，它描述了你可以在\
  \ `grep` 命令中使用的某些模式。ERE 是一种扩展正则表达式，需要使用 `grep -e` 或 `egrep` 命令。选项 A、B、C 和 E 都是可以在\
  \ `grep` 命令中使用的 BRE 模式，所以它们是正确选择。唯一的 ERE 在选项 D 中，因此它是一个错误选择。\n\n\n\n\n\n### 8. E\n\
  为了满足搜索需求，选项 E 是与 `egrep` 命令配合使用的 ERE。因此，选项 E 是正确答案。选项 A 将返回以 `Luke` 结尾的记录或以 `Laura`\
  \ 结尾的记录。因此，选项 A 是错误答案。选项 B 是错误选择，因为它将返回以 `Luke` 开头的记录，或以 `Laura` 开头且 `Laura` 与 `Father\
  \ is` 短语之间有一个字符的记录。选项 C 的 ERE 中 `Luke` 和 `Laura` 部分是正确的，但它只允许名称与 `Father is` 短语之间有一个字符，这无法满足搜索需求。因此，选项\
  \ C 是错误选择。选项 D 将尝试返回以 `Luke` 结尾的记录或以 `Laura` 结尾且包含 `Father is` 短语的记录，因此 `egrep`\
  \ 命令将不显示内容。因此，选项 D 是错误选择。\n\n### 9. A, B\n要对 `data.txt` 文件进行数值排序并将输出保存到新文件 `newdata.txt`，你可以使用\
  \ `-o` 选项保存文件，或者通过 `>` 符号使用标准输出重定向。无论在种情况下，你都需要使用 `-n` 选项来正确执行数值排序。因此，选项 A 和 B 都是正确的。选项\
  \ C 是错误答案，因为命令语法中 `newdata.txt` 和 `data.txt` 的位置颠反了。选项 D 和 E 没有使用 `-n` 选项，因此它们也是错误答案。\n\
  \n### 10. C, E\n选项 C 和 E 中的命令都将把 `data.txt` 和 `datatoo.txt` 文件的内容连续显示到 STDOUT。`cat\
  \ -n` 命令还会为其添加行号，但它仍然会将文件内容连接到标准输出。因此，选项 C 和 E 是正确的。选项 A 只会将文件名称显示到 STDOUT，因此它是错误答案。选项\
  \ B 将对 `data.txt` 进行数值排序，清空 `datatoo.txt` 文件的内容，并用来自 `data.txt` 文件的数值排序内容替换它。因此，选项\
  \ B 是错误答案。选项 D 将向 STDOUT 显示两个文件的元数据而不是其内容，因此也是一个错误选择。\n\n### 11. C\n`pr` 命令的主要用途是为打印特殊格式化文本文件，它可以相当快速地完成所需任务。因此，选项\
  \ C 是最佳选择。虽然 `pr` 工具可以处理整个文本文件的格式化，但 `printf` 命令旨在格式化单行文本的输出。虽然你可以编写一个 shell 脚本通过\
  \ `printf` 命令读取并格式化每个文本文件的行，但这不是采用最快的方法。因此，选项 A 是错误答案。选项 B 的 `wc` 命令会对文本文件进行计数，而不格式化文本文件内容，因此它也是错误答案。`paste`\
  \ 命令将“粗略地”将两个或多个文本文件并排放在。因此，选项 D 是错误答案。选项 E 是错误选择，因为 `nano` 编辑器将强制你手动格式化文本文件，这并不是所需的操作。\n\
  \n### 12. E\n`printf` 的 `FORMAT` `“%.2f\\n”` 将产生 `42.78` 的预期结果，因此选项 E 是正确答案。选项 A\
  \ 中的 `FORMAT` 将仅输出 `42.777`，因此是错误选择。选项 B 中的 `FORMAT` 将输出 `42`，因此是错误答案。选项 C 中的 `printf`\
  \ `FORMAT` 设置将产生错误，因此它是错误选择。选项 D 的 `printf` `FORMAT` `“%.2c\\n”` 将显示 `42`，因此也是一个错误答案。\n\
  \n### 13. A, C\n`wc` 工具输出的第一项是指定文本文件中的行数。因此，选项 A 是正确的。选项 C 也是正确的，因为 `wc` 工具输出的第二项是指定文本文件中的单词数。选项\
  \ B 是错误答案，因为文件包含 2,020 行而不是字符。选项 D 是错误选择，因为你不知道是否使用了 ASCII Unicode 子集作为文本文件的编码。你应该始终假设最后一个数字是文件中的字节数。在\
  \ `wc` 命令上使用 `-m` 或 `--chars` 选项来获取字符计数。因此，文件中可能包含 11,328 个字节而不是字符。选项 E 也是错误选择，因为文件中有\
  \ 2,020 行。\n\n### 14. B\n文件描述符是代表进程打开文件的数字。因此，选项 B 是正确答案。文件类型代码是表示文件类型的字母，显示在 `ls\
  \ -l` 输出行的第一项。因此，选项 A 是错误答案。选项 C 也是错误的，因为它是一个虚构的答案。选项 D 是错误的，因为它只描述了 STDOUT，其文件描述符为\
  \ 1，且它是多个文件描述符之一。文件指示代码是指示文件分类的符号，由 `ls -F` 命令生成。因此，选项 E 也是错误选择。\n\n### 15. D\n\
  默认情况下，STDOUT 输出到你当前的终端，由 `/dev/tty` 文件表示。因此，选项 D 是正确答案。`/dev/ttyn` 文件（如 `/dev/tty2`）可能是你特定时刻的终端，但\
  \ `/dev/tty` 始终代表你的当前终端，因此选项 A 是错误答案。选项 C 是错误的，因为它是命令行用于重定向 STDOUT 离开其默认行为的符号。`pwd`\
  \ 命令显示你当前的工作目录，所以选项 E 是错误选择。\n\n### 16. A\n选项 A 中的命令将输出 `SpaceOpera.txt` 文件内容，同时将其副本保存到\
  \ `SciFi.txt` 文件。因此，选项 A 是正确答案。选项 B 是错误答案，因为它只会将 `SpaceOpera.txt` 的副本放入 `SciFi.txt`\
  \ 文件中。选项 C 是错误选择，因为这将输出 `SpaceOpera.txt` 文件，并将任何错误信息放入 `SciFi.txt` 文件。`cp` 命令只会将一个文本文件复制到另一个文件中。它不会将原始文件显示到输出，因此选项\
  \ D 是错误答案。选项 E 是错误选择，因为它会将 `SpaceOpera.txt` 的副本放入 `SciFi.txt` 文件并包含任何生成的错误信息。\n\n\
  ### 17. D\n`/dev/null` 文件也被称为黑洞，因为你放入其中的任何内容都无法检索。如果你不想在执行命令时看到任何错误信息，可以将 STDERR\
  \ 重定向到它。因此，选项 D 是正确答案。选项 A 到 C 是错误答案，因为它们执行的是将重定向到一个名为 `BlackHole` 的文件，而不是 `/dev/null`。选项\
  \ E 也是错误的，因为它将 STDOUT 重定向到了 `/dev/null` 文件，任何错误信息将被显示出来。\n\n### 18. C\n要在 `Problems.txt`\
  \ 文件中查找包含一次 `error` 单词的记录，需要使用 `grep` 命令。正确的语法是 `grep error Problems.txt`。要计算记录，将\
  \ `grep` 命令的 STDOUT 通过管道作为 STDIN 输入 `wc` 工具。计算记录的正确语法是 `wc -l`。因此，选项 C 是正确答案。选项\
  \ A 中的命令是错误的，因为它的 `wc` 命令正在计算每个输入记录中的字节数。选项 B 是错误答案，因为它的 `wc` 命令正在计算每个输入记录中的单词数。选项\
  \ D 中的命令有两个问题：首先，它的 `grep` 命令语法中搜索项和待搜索文件的位置颠反了。此外，它的 `wc` 命令正在计算每个输入记录中的单词数。因此，选项\
  \ D 是错误选择。选项 E 是错误答案，因为它的 `grep` 命令语法中搜索项和待搜索文件的位置颠反了。\n\n\n\n\n\n19. B, C, E. `xargs`\
  \ 命令、`$()` 方法、反引号（`` ` ``）和大括号扩展都允许你动态构建命令行命令。在这种情况下，只有选项 B、C 和 E 使用了正确的命令语法来查找任何名为\
  \ `42.tmp` 的文件（该文件存在于你当前目录树结构的某处），并将其内容显示到 STDOUT。因此，选项 B、C 和 E 是正确答案。选项 A 使用的 `xargs`\
  \ 命令语法是错误的，该命令将生成错误消息。因此，选项 A 是错误答案。选项 D 使用的大括号扩展语法也是错误的，因此它也是一个不正确的选项。\n\n20. A,\
  \ C, D, E. `vim` 编辑器的三种模式是命令模式（也称为普通模式）、插入模式（也称为编辑或输入模式）和 Ex 模式（有时称为冒号命令模式）。因此，选项\
  \ A、C、D 和 E 是正确答案。此题唯一的错误选项是选项 B。\n\n## 第 5 章：解释启动过程\n\n1. A. 工作站固件会寻找引导加载程序以加载操作系统系统。`fsck`\
  \ 程序（选项 B）用于检查和修复硬盘损坏，因此在 Linux 系统启动之前它是没用用的。Windows 操作系统只有在 Windows 引导加载程序运行后才会启动，因此选项\
  \ C 是错误的。`mount` 程序是用于将分区挂载到虚拟目录的 Linux 工具，它在 Linux 系统启动后才可用，因此选项 D 也是错误的。`mkinitrd`\
  \ 程序用于创建用于启动的 `initrd` RAM 磁盘，但它在工作站启动时不会运行，因此选项 E 是错误的。\n\n2. B. 工作站固件查看第一块硬盘的第一个扇区以加载引导加载程序。这被称为主引导记录（Master\
  \ Boot Record），因此选项 A 是正确的。引导加载程序本身可以使用链式加载（chainloader）功能在启动分区中寻找另一个引导加载程序，但固件无法做到此点，因此选项\
  \ D 是错误的。选项 A 指定了用于存储 GRUB 配置文件和内核镜像文件的配置文件夹，但实际的 GRUB 引导加载程序无法存储在该处。选项 C 指定了公共日志文件文件夹，但它不包含\
  \ GRUB 引导加载程序。选项 E 也指定了一个常用的 Linux 配置文件目录，但它不用于存储固件可以访问的 GRUB 引导加载程序。\n\n3. D. 你可以通过输入\
  \ `dmesg` 查看内核环形缓冲区，它包含了内核启动消息的消息；因此选项 D 是正确的。`fsck` 程序（选项 A）修复受损的分区，`mount` 程序（选项\
  \ C）用于将分区挂载到虚拟目录，因此这两者都不正确。选项 B `init` 程序用于从内核启动程序，而不是显示启动消息，因此它也是错误的。选项 E `mkinitrd`\
  \ 程序用于创建新的 `initrd` RAM 磁盘，与启动消息无关，因此它也是错误的。\n\n4. C. 大多数 Linux 发行版将启动日志文件存储在 `/var/log`\
  \ 文件夹中。`/etc` 文件夹通常用于存储系统和应用程序配置文件，而不是启动日志，因此选项 A 是错误的。某些 Unix 系统使用 `/var/messages`\
  \ 文件夹存储日志文件，但 Linux 尚未采用这一标准，因此选项 B 也是错误的。`/boot` 文件夹包含 GRUB 配置文件以及启动系统所需的镜像镜像文件，但它不是\
  \ Linux 存储启动日志的地方，因此是不正确的。`/proc` 文件夹的独特之处在于 Linux 内核动态地在该处存储系统信息，但它不在那里存储启动日志信息。\n\
  \n5. A, B, C, D, E. BIOS 固件可以在多个位置查找引导加载程序。最常见的是它查找系统上安装的内部硬盘，但如果没有找到，它可以搜索其他地方。大多数工作站允许你从外部硬盘或\
  \ DVD 驱动器启动。现代工作站现在还提供从插入工作站 USB 端口的 USB 闪存启动启动。最后，许多工作站提供 PXE 启动选项，允许工作站从网络服务器远程启动。\n\
  \n6. A. 主引导记录（MBR）仅位于一处：工作站第一块硬盘的第一个扇区，因此选项 A 是唯一的正确答案。任何硬盘中的启动分区都可能包含引导加载程序，但它不是主引导记录（固件首先运行\
  \ MBR），因此选项 B 是错误的。其他位置都不是主引导记录的有效位置。\n\n7. D. ESP 存储在 Linux  `/boot/efi` 目录下。UEFI\
  \ 固件始终查找 `/boot/efi` 目录下的引导加载程序，因此选项 D 是正确的。`/etc` 目录用于存储应用程序系统配置文件，而不是引导加载程序，因此选项\
  \ B 是错误的。`/var` 文件夹用于存储日志文件等变量文件，而不是可启动文件，因此选项 C 是错误的。选项 E `/boot/grub` 文件在 GRUB\
  \ Legacy 和 GRUB2 中用于存储引导加载配置文件以及内核镜像文件。然而，它不用于存储引导加载文件本身，因此选项 E 是错误的。\n\n8. E. UEFI\
  \ 规范没有要求 UEFI 引导加载文件有特定的扩展名，但在 Linux 中使用 `.efi` 文件扩展名来识别它们已变得相当常见；因此选项 E 是正确的。选项\
  \ A 和 D 指定了用于识别 GRUB2（选项 A）和 GRUB Legacy（选项 D）配置文件的扩展名，而不是 UEFI 引导加载文件，因此它们都是错误的。选项\
  \ C 指定了 `.lst` 文件扩展名，它也用于 GRUB Legacy 配置文件，因此它也是错误的。Linux 不使用 `.uefi` 文件扩展名，因此选项\
  \ B 是错误的。\n\n9. B. Linux 加载器（LILO）引导加载程序是 Linux 中使用的第一个引导加载程序，因此选项 B 是正确的。GRUB Legacy\
  \ 引导加载程序尽管名字如此，但它并不是第一个引导加载程序，而是 Linux 中常用的第二个引导加载程序。GRUB2 引导加载程序是对 GRUB Legacy\
  \ 引导加载程序的后续改进，因此选项 A 和 C 是错误的。选项 D SYSLINUX 引导加载程序提供了用于 Microsoft FAT 分区的功能，以便你可以从软盘或\
  \ USB 闪存启动 Linux，但它是后期产物，不是第一个 Linux 引导加载程序。选项 E ISOLINUX 也是后期引导加载程序，允许我们从 CD 或\
  \ DVD 驱动器启动 Linux。\n\n10. A. GRUB Legacy 配置文件存储在 `/boot/grub` 目录，因此选项 A 是正确的。选项\
  \ B `/boot/efi` 目录用于存储 UEFI 引导加载程序，而不是 GRUB 配置文件，因此它是错误的。选项 C `/etc` 目录存储许多应用程序系统配置文件，但不是\
  \ GRUB Legacy 配置文件。var` 目录存储日志文件等变量文件，而不是配置文件，因此选项 D 是错误的。同样，Linux 使用 `/proc` 目录提供动态内核运行时数据，而不是配置文件。\n\
  \n11. B, C. GRUB2 引导加载程序在 `/boot/grub` 目录和 `/etc/grub.d` 目录中都存储配置文件，因此选项 B 和 C 是正确的。Linux\
  \ 使用 `/proc` 目录提供动态内核运行时数据，而不是配置文件，因此选项 A 是错误的。选项 D `/boot/efi` 存储 UEFI 引导加载程序文件，而不是\
  \ GRUB2 配置文件，因此它也是错误的。选项 E `/var` 用于存储日志文件等变量文件，而不是配置文件，因此它是错误的。\n\n\n\n\n\n###\
  \ 12\nC. `grub-mkconfig` 命令将 `/etc/default/grub` 文件中定义的配置以及 `/etc/grub.d` 文件夹中的所有文件合并为一个单一的\
  \ `grub.cfg` 。`mkinitrd` 命令（选项 A）用于创建新的 `initrd` 内存磁盘镜像文件，因此是错误的。同样，`mkinitramfs`\
  \ 命令（选项 B）也用于在 Debian 系统上创建 `initrd` 镜像文件，因此它也是错误的。`grub-install` 程序被 GRUB Legacy\
  \ 引导加载程序用于在 MBR 或引导扇区中安装引导加载程序，但它并不用于生成 GRUB2 配置文件，因此是错误的。选项 E 是 `fsck` 程序，它用于检查和修复硬盘分区，是本题的错误答案。\n\
  \n### 13\nD. `grub-install` 命令将任何配置更改更改安装到 GRUB 的 MBR 中，因此选项 D 是正确的。`mkinitrd` 命令创建一个新的\
  \ `initrd` 内存磁盘镜像文件，因此选项 A 是错误的。同样，`mkinitramfs` 命令（选项 B）也用于在 Debian 系统上创建 `initrd`\
  \ 镜像文件，因此它也是错误的。`grub-mkconfig` 命令用于 GRUB2 系统中创建更新的配置文件，但在 GRUB Legacy 系统中不使用，因此选项\
  \ C 是错误的。`fsck` 程序检查并修复硬盘分区，因此选项 E 是错误的。\n\n### 14\nB. UEFI 固件方法已取代了大多数 IBM 兼容计算机中的\
  \ BIOS，因此选项 B 是正确的。FTP、PXE、NFS 和 HTTPS 并不是固件方法，而是加载 Linux 引导加载程序的方法，因此选项 A、C、D 和\
  \ E 都是错误的。\n\n### 15\nE. 内核环缓冲区（kernel ring buffer）是内存中预留的区域，用于存储 Linux 系统启动时的输出消息，因此选项\
  \ E 是正确的。选项 A，BIOS 是工作站上的固件，而不是内存区域，因此是错误的。GRUB 引导加载程序（选项 B）是一个启动 Linux 系统的程序，不在内存中，因此它也是错误的。MBR\
  \ 是硬盘上的一个位置，用于存储 Linux 引导加载程序，因此选项 C 是错误的。`initrd` 内存磁盘是内存中的一个区域，存储启动过程所需的模块，但它并不存储系统启动时的启动消息，因此选项\
  \ D 是错误的。\n\n### 16\nA. `single` 命令参数指示 Linux 系统在启动后进入单用户模式，因此选项 A 是正确的。`fsck` 命令检查并修复硬盘分区，因此选项\
  \ B 是错误的。`mkinitrd` 和 `mkinitramfs` 命令都创建 `initrd` 内存磁盘文件，因此选项 C 和 D 是错误的。`dmesg`\
  \ 命令显示内核环缓冲区中的启动消息，因此选项 E 是错误的。\n\n### 17\nA. 当 Linux 系统由于系统错误意外停止时，会发生内核恐（kernel\
  \ panic），因此选项 A 是正确的术语。内核环缓冲区在启动时存储启动消息，因此选项 B 是错误的。`initrd` 内存磁盘是内存中的一个区域，用于存储启动系统所需的模块文件，因此选项\
  \ C 是错误的。引导加载程序和固件是 Linux 启动过程的一部分，并不指系统停止时，因此选项 D 和 E 都是错误的。\n\n### 18\nB. `grub-mkconfig`\
  \ 命令处理存储在 `/etc/grub.d` 文件夹中的 GRUB2 指令以创建 `/etc/grub2.cfg` 配置文件，因此选项 B 是正确的。`mkinitrd`\
  \ 和 `mkinitramfs` 命令用于创建 `initrd` 内存磁盘以存储模块文件，因此选项 A 和 D 是错误的。`grub-install` 命令用于\
  \ GRUB Legacy 将 GRUB 配置文件安装到正确的位置，但在 GRUB2 中不使用，因此选项 C 是错误的。`dmesg` 命令显示系统启动消息，不是\
  \ GRUB2 引导加载程序的一部分，因此选项 E 是错误的。\n\n### 19\nC. `fsck` 程序可以对分区上的多种类型的文件系统进行文件检查和修复。你应该对任何因错误而无法挂载的分区使用它。`mount`\
  \ 程序（选项 A）用于将分区附加到虚拟目录，但它不能修复包含错误的分区（并且通常会拒绝挂载它们）。`umount` 命令（选项 B）也是错误的。它用于从虚拟目录中移除已挂载的分区。选项\
  \ D（`dmesg` 命令）显示启动消息，选项 E（`mkinitrd` 命令）创建 `initrd` 内存磁盘，因此两者都是错误的。\n\n### 20\n\
  A. `mount` 命令允许你同时指定分区以及在虚拟目录中附加分区文件和文件夹的位置。分区中包含的文件和文件夹随后出现在虚拟目录的该位置。`umount` 命令（选项\
  \ B）用于移除已挂载的分区。选项 C，`fsck` 命令用于修复损坏且无法挂载的硬盘，但它本身并不会实际挂载驱动器。选项 D 中的 `dmesg` 命令用于查看系统的启动消息，它可能会告诉你硬盘是在何处被附加到虚拟目录的，但它本身并不会实际执行附加操作。选项\
  \ E，`kninitramfs` 命令创建一个 `initrd` 内存磁盘，并不直接处理将硬盘挂载到虚拟目录。\n\n## 第 6 章：维护系统启动与服务\n\
  \n### 1\nB, C, E. `init` 程序可能存在于 `/etc/`、`/sbin/` 或 `/bin/` 目录下，取决于你的发行版及其版本，因此选项\
  \ B、C 和 E 是正确的。`/etc/rc.d/` 目录用于 SysVinit 系统，不是 `init` 程序的所在位置，因此选项 A 是错误的答案。`/etc/lib/systemd/`\
  \ 目录是 systemd 程序的所在地，因此选项 D 也是一个错误选择。\n\n### 2\nA, B, C, D, E. 这是一个很有陷阱的问题，因为关于\
  \ systemd 服务单元的所有陈述都是正确的。这让你意识到由 systemd 管理的系统是非常的。\n\n### 3\nA. 没有 `runlevel7.target`。提供向后\
  \ Sys init 兼容性的合法 systemd target 从 `runlevel0.target` 到 `runlevel6.target`。因此，选项\
  \ A 是正确答案。`emergency.target` 是一个用于进入紧急模式的特殊 systemd 单元。当系统进入紧急模式时，系统仅挂载根文件系统并以只读方式挂载。因此，选项\
  \ B 是 systemd target 而不是正确答案。`graphical.target` 是一个合法的 systemd target，允许用户通过本地终端和/或通过网络访问系统并提供\
  \ GUI。因此，选项 C 是一个错误的选择。`multi-user.target` 也是一个合法的 systemd target，与 `graphical.target`\
  \ 类似，只是它不提供 GUI。因此，选项 D 也是错误的答案。`rescue.target` 类似于 `emergency.target`，但它以读写方式挂载根文件系统。因此，选项\
  \ E 是错误的选择。\n\n### 4\nC. 任何修改过的 systemd 服务单元配置文件都应存储在 `/etc/systemd/system/` 目录下。这将防止软件包升级覆盖它，并防止目录优先级使用可能位于\
  \ `/usr/lib/systemd/system/` 目录的未修改的服务单元副本。因此，选项 C 是正确答案。选项 A 和 B 中的目录是虚构的，因此这些选项是错误的。`/usr/lib/systemd/system/`\
  \ 目录应只存储未修改的单元文件（由默认提供），因此选项 D 是错误的答案。`/run/system/systemd/` 目录是虚构的，因此选项 E 也是一个错误的选择。\n\
  \n\n\n\n\n### 5. E\n为了在启动 `Service-A` 之前立即启动 `Service-B`，`Service-A` 单元配置文件需要采用\
  \ `After` 指令，将其设置为类似于 `After=Service-B.unit` 的内容。因此，选项 E 是正确答案。`Conflicts` 指令设置单元不与指定的单元一起启动。如果任何指定的单元启动了，该单元将不会启动。因此，选项\
  \ A 是错误答案。`Wants` 指令设置单元与指定的单元共同启动。如果任何指定的单元未启动，该单元仍然会启动。因此，选项 B 也是错误答案。`Requires`\
  \ 指令设置单元与指定的单元共同启动。如果任何指定的单元未启动，该单元将不会启动。因此，选项 C 是错误选择。`Before` 指令设置该单元在指定的单元之前启动。虽然这应该设置在\
  \ `Service-B` 的单元配置文件中，但在这种情况下，它并不适用于 `Service-A` 的配置文件。因此，选项 D 也是错误答案。\n\n### 6.\
  \ B, D\nLinux 系统使用环境变量来存储关于 shell 会话和工作环境的信息。如果你需要确保为服务正确设置特定的环境变量，你需要使用 `Environment`\
  \ 指令和/或 `EnvironmentFile` 指令来设置环境参数。因此，选项 B 和 D 是正确答案。`Type` 指令设置单元的启动类型，例如 `forking`。因此，选项\
  \ A 是错误答案。`EnvironmentParam` 是一个虚构的指令，因此选项 C 是错误选择。`PATH` 是一个环境变量，你可以对其进行修改以调整单元的环境参数。然而，它不是一个指令，因此选项\
  \ E 也是错误答案。\n\n### 7. D\n如果目标（target）单元文件具有 `AllowIsolate=no` 设置，则无法使用 `systemctl\
  \ isolate` 命令该目标。因此，选项 D 是正确答案。选项 A 的 `static` 是通过 `systemctl --list-unit-files`\
  \ 命令显示的单元文件启用状态。因此，选项 A 是错误答案。`AllowIsolate=yes` 指令允许目标使用 `systemctl isolate` 命令。因此，选项\
  \ B 也是错误选择。`Type=oneshot` 是服务单元指令，你不会在目标单元文件中找到它。因此，选项 C 是错误答案。选项 E 的 `disabled`\
  \ 也是一种启用状态，类似于 `static`。因此，选项 E 也是错误选择。\n\n### 8. A\n让 OpenSSH 服务对修改的文件立即生效的最佳命令是\
  \ `systemctl reload`。该命令会在不停止服务的情况下加载正在运行的指定服务的配置文件。因此，选项 A 是最佳答案。`daemon-reload`\
  \ 会加载单元配置文件而不是服务配置文件。因此，选项 B 是错误答案。`restart` 命令将停止并立即重启服务。虽然这会加载修改的服务配置文件，但它也会中断当前服务用户的正常操作。因此，选项\
  \ C 不是最佳答案，是错误的答案。`mask` 命令阻止特定服务的启动。因此，选项 D 是错误选择。`unmask` 命令撤销 `mask` 命令的效果，因此选项\
  \ E 也是错误答案。\n\n### 9. E\n要设置特定的服务单元在启动时自动启动，你需要使用 `systemctl enable` 命令并在后跟服务单元的名称。因此，选项\
  \ E 是正确答案。`restart` 命令会停止并立即重启服务，但并不控制服务单元是否在系统启动时启动。因此，选项 A 是错误答案。`start` 命令将启动服务，但不控制服务单元是否在系统启动时启动。因此，选项\
  \ B 也是错误选择。`isolate` 命令用于 systemd 目标单元（targets），而不是服务单元，因此选项 C 是错误选择。选项 D 的 `disable`\
  \ 命令将一个特定的服务单元设置为在启动时不启动（禁用其启动），因此选项 D 也是错误答案。\n\n### 10. B\n要更改系统的默认目标，你需要使用 `systemctl\
  \ set-default` 命令，将目标名称作为参数传递并使用超级用户权限。因此，选项 B 是正确答案。`get-default` 命令将显示系统当前的默认目标。因此，选项\
  \ A 是错误答案。`isolate` 命令用于跳转到新目标，而不是设置默认目标。因此，选项 C 是错误选择。`is-enabled` 命令对任何配置为系统启动时启动的服务显示\
  \ `enabled`，对任何未配置为系统启动时启动的服务显示 `disabled`。它只处理服务，因此选项 D 是错误选择。`is-active` 命令同样只处理服务，因此选项\
  \ E 也是错误答案。\n\n### 11. D\n`blame` 命令显示每个运行单元初始化所需的时间，并按从慢到快的顺序列出单元及其时间。这样，你可以从列表顶端开始调查这些单元。因此，选项\
  \ D 是正确答案。`time` 命令显示系统初始化在内核、初始内存文件系统（ramfs）花费的时间，以及普通系统用户空间初始化所需。然而，它不能帮助你确定哪些单元配置可能是导致启动缓慢的原因。因此，选项\
  \ A 是错误答案。`dump` 命令显示有关所有单元的数据，但其格式并不易于追踪哪个单元在启动时耗时最长。因此，选项 B 是错误选择。选项 C 的 `failure`\
  \ 是一种服务状态，表示服务已失败。因此，选项 C 也是错误答案。`verify` 命令非常有用，它可以扫描单元文件并在发现任何错误时显示警告信息。然而，它没有提供可以帮助你揭示系统启动缓慢原因的配置信息。因此，选项\
  \ E 是错误选择。\n\n### 12. C, E\n使用 SysV init 的基于 Debian 的 Linux 发行版仅使用 0 到 2 的运行级别（runlevels）。`runlevel`\
  \ 命令显示上一个运行级别，或者对于新启动显示 `N`。因此，在运行 SysV init 的旧版 Debian 系 Linux 系统上，`runlevel` 命令显示的选项只有\
  \ C 和 E。因此，这些选项是正确的。选项 A 是错误的，因为它显示 `5` 为当前运行级别，而基于 Debian 的发行版不使用该运行级别。选项 B 也是错误的，因为它显示\
  \ `5` 为当前运行级别。选项 D 是错误的，因为它显示 `3` 为当前运行级别，且基于 Debian 的发行版也不使用该运行级别。\n\n### 13. A\n\
  对于 SysV init 系统，默认运行级别存储在 `/etc/inittab` 文件的 `initdefault` 记录中。因此，选项 A 是正确答案。`/etc/rc.d`\
  \ 是目录而不是文件。因此，选项 B 是错误答案。`rc` 文件是一个可以位于 `/etc/init.d/` 或 `/etc/rc.d/` 目录下的脚本。它在切换运行级别或启动系统时运行启动各种系统服务的脚本。然而，该脚本并不包含任何关于默认运行级别的信息。`/etc/rc.local`\
  \ 文件允许你在系统初始化完成后立即执行某些命令或运行任何脚本。然而，该脚本也不包含任何关于默认运行级别的信息。因此，选项 E 是错误答案。\n\n\n\n\n\
  \n### 14. **C.** 存储旧（以及新）SysV init 系统服务启动脚本的目录是 `/etc/init.d/` 目录。因此，选项 C 是正确答案。`/etc/rc.d/rc-n.d/`\
  \ 目录用于 SysV init 系统，但它们包含指向 `/etc/init.d/` 目录内脚本的符号链接。因此，选项 B 是错误答案。选项 A、D 和 E 都是\
  \ systemd 目录。因此，它们是错误的选择。\n\n### 15. **A, B, D, E.** 运行级别 1 也称为单用户模式。你可以使用 `init`\
  \ 或 `telinit` 命令跳转到该运行级别，并向它们传递以下三个参数之一：`1`、`s` 或 `S`。因此，选项 A、B、D 和 E 是正确答案。你不能使用\
  \ `one` 参数来进入运行级别 1，因此选项 C 是唯一的错误选择。\n\n### 16. **B.** 最佳命令是 `service status` 命令，将服务名作为参数传递给它。这将显示服务的当前状态，并允许你快速开始故障排除过程。因此，选项\
  \ B 是正确答案。`service start` 命令将启动指定的服务，但你不知道该服务是否已经停止。因此，它不是最佳命令，选项 A 是错误选择。`service\
  \ --status-all` 命令不是最佳命令，因为它显示了所有各种服务的状态。因此，选项 C 是错误答案。`service stop` 命令将停止指定的服务，如果它已经停止，则会提供\
  \ `FAILED` 状态。然而，这并不是在 SysV init 系统上检查服务状态的最佳方法。因此，它不是最佳命令，选项 D 是错误选择。`service reload`\
  \ 命令将加载指定服务的配置文件，如果服务已停止，则会提供 `FAILED` 状态。尽管如此，这仍然不是检查服务状态的方法。因此，选项 E 也是错误答案。\n\n\
  ### 17. **D.** 要要在基于 Red Hat 的 SysV init 系统上为运行级别 3 和 5 启用 DHCP 服务，正确的命令是 `chkconfig\
  \ --levels 35 dhcp on`。因此，选项 D 是正确答案。选项 A 和 E 是错误的，因为你不能使用 `service` 命令来启用 SysV\
  \ init 服务。选项 B 是错误答案，因为你不能使用逗号等分隔符来分隔运行级别列表。选项 C 是错误选择，因为该命令的服务名和 `on` 参数位置颠倒了。\n\
  \n### 18. **E.** 要要在基于 Debian 的 SysV init 系统上为默认运行级别启用 DHCP 服务，正确的命令是 `update-rc.d\
  \ dhcp defaults`。因此，选项 E 是正确答案。选项 A 是错误的，因为最后一个命令参数应该是 `defaults` 而不是 `default`。选项\
  \ B 是错误答案，因为你不能在基于 Debian 的发行版上使用 `chconfig` 命令。选项 C 是错误选择，因为该命令的服务名和 `default`\
  \ 参数位置颠倒了。此外，它使用了错误的参数。参数应该是 `defaults`。选项 D 中使用的命令是错误的，因为该命令的服务名和 `defaults` 参数位置颠倒了。因此，选项\
  \ D 也是错误选择。\n\n### 19. **C.** 挂载单元文件名是通过以下方式生成的：移除绝对目录引用开头的正斜杠 (`/`)，将随后的正斜杠转换为连字符\
  \ (-`)，并移除末尾的正斜杠。挂载单元文件名还有 `.mount` 扩展名。因此，`/var/log/` 挂载点的挂载单元文件为 `var-log.mount`。因此，选项\
  \ C 是正确答案。`/var/log.mount` 单元文件名是错误的，因为没有移除或替换正斜杠。因此，选项 A 是错误答案。`/var/log.unit`\
  \ 基名是错误的，因为正斜杠没有移除或替换。此外，使用了错误的文件扩展名。因此，选项 B 是错误答案。`var-log.unit` 基名是错误的，因为使用了错误的文件扩展名。因此，选项\
  \ D 是错误选择。`var/log.mount` 文件名是错误的，因为中间的正斜杠没有被替换连字符。因此，选项 E 是错误选择。\n\n### 20. **A,\
  \ C, D.** 对于 systemd 自动挂载单元文件，[Automount] 部分可以包含的指令只有 `Where`、`DirectoryMode` 和\
  \ `TimeOutIdleSec`。因此，选项 A、C 和 D 是正确答案。`Options` 和 `What` 指令是在挂载单元文件的 `[Mount]`\
  \ 部分中看到的指令。因此，选项 B 和 E 是错误的选择。\n\n## 第 7 章：配置网络连接\n\n### 1. **C, D.** `nmtui` 命令提供了一个交互式文本菜单用于选择网络接口和设置网络参数，`ip`\
  \ 命令提供了一个用于设置网络参数的命令行工具，因此选项 C 和 D 都是正确的。`netstat` 命令显示网络连接信息，但不设置网络参数，因此选项 A 是错误的。`ping`\
  \ 命令可以向远程主机发送 ICMP 数据包，但不设置本地网络参数，因此选项 B 是错误的。`route` 命令设置路由网络参数，但不设置 IP 地址或子网掩码，因此选项\
  \ E 是错误的。\n\n### 2. **B.** 从 17.04 版本开始，Ubuntu 已切换到使用 Netplan 工具设置网络地址信息，因此选项 B\
  \ 是正确答案。`netstat` 命令不设置网络信息，而是显示活跃的网络连接，因此选项 A 是错误的。`iwconfig` 命令设置无线网络参数而不是网络地址信息，因此选项\
  \ C 是错误的。`route` 命令设置默认路由器而不是网络地址信息，因此选项 D 是错误的。`ifconfig` 命令确实设置网络地址信息，但新版本的 Ubuntu\
  \ 不再使用它，因此选项 E 是错误的。\n\n### 3. **A.** `ethtool` 命令显示网卡的功能和参数，因此选项 A 是正确答案。`netstat`\
  \ 命令显示网络统计和连接，因此选项 B 是错误的。`iwconfig` 和 `iwlist` 命令用于设置无线网络参数而不是以太网设置，因此选项 C 和 D\
  \ 是错误的。`route` 命令设置或显示路由信息而不是以太网卡设置，因此选项 E 是错误的。\n\n### 4. **E.** `ss` 命令显示 Linux\
  \ 系统上开放的端口列表，以及与每个端口相关的进程，因此选项 E 是正确的。`iwconfig` 命令设置无线网络信息而不是开放端口，因此选项 A 是错误的。`ip`\
  \ 命令显示或设置网络接口上的网络信息，但不显示开放端口，因此选项 B 是错误的。`ping` 命令向远程主机发送 ICMP 消息，但不显示任何开放端口，因此选项\
  \ C 是错误的。`nmtui` 命令允许为网络接口配置网络参数，但不显示系统上的开放端口，因此选项 D 是错误的。\n\n### 5. **A, C.** `nmcli`\
  \ 和 `ip` 命令都允许你从命令行设置和更改网络设置，因此选项 A 和 C 都是正确的。`iwconfig` 命令仅设置无线网络信息，因此选项 B 是错误的。`netstat`\
  \ 命令显示开放端口并不更改任何网络设置，因此选项 D 是错误的。`ping` 命令向远程主机发送 ICMP 数据包进行测试；它也不设置任何网络设置，因此选项\
  \ E 也是错误的。\n\n\n\n\n\n## 6. A. 默认路由器用于将数据包从本地网络发送到远程网络，因此为了与远程主机通信，你需要定义默认路由器地址，所以选项\
  \ A 正确。`netmask` 仅定义本地网络，它并不定义如何处理针对远程主机的数据包，因此选项 B 错误。主机和 IP 地址仅定义本地主机的特征，因此选项\
  \ C 和 D 错误；而 DNS 服务器定义了如何根据域名检索主机的 IP 地址，因此选项 E 错误。\n\n## 7. E. DNS 服务器将主机名映射到 IP\
  \ 地址，因此你必须在网络配置中定义 DNS 服务器，才能在应用程序中使用主机名。因此，选项 E 正确。默认路由器仅定义如何向远程主机发送数据包；它不将主机名映射到\
  \ IP 地址，因此选项 A 错误。`netmask` 值定义本地网络，但不定义如何将主机名映射到 IP 地址，因此选项 B 错误。主机和 IP 地址定义本地主机的特征，因此选项\
  \ C 和 D 错误。\n\n## 8. B. 动态主机配置协议 (DHCP) 用于为网络上的客户端工作站分配动态 IP 地址，因此选项 B 正确。默认路由器不能为设备分配地址，因此选项\
  \ B 错误。`ARP` 表将网卡的硬件地址映射到 IP 地址，但不分配 IP 地址，因此选项 C 错误。`netmask` 值决定网络地址，而不是主机的 IP\
  \ 地址，因此选项 D 错误。`ifconfig` 命令可以设置主机的静态 IP 地址，但不会自动分配 IP 地址，因此选项 E 错误。\n\n## 9. B.\
  \ 回环地址是分配给回环接口的特殊地址，允许本地应用程序之间进行通信，因此选项 B 是正确答案。动态和静态 IP 地址是分配给网络接口的，网络接口与远程系统交互，而不是与本地交互，因此选项\
  \ A 和 C 错误。主机名用于为远程连接识别本地主机，而不是用于本地应用程序，因此选项 D 错误。MAC 地址识别网卡硬件地址，但不被本地应用程序使用，因此选项\
  \ E 错误。\n\n## 10. A. `dig` 命令可以显示域名的单个主机记录，你可以用它来查找该域的 MX 邮件主机，因此选项 A 正确。`host`\
  \ 命令仅显示主机 IP 地址信息；它无法从 DNS 记录中确定服务器类型，因此选项 D 错误。`netstat` 和 `ss` 命令显示活动网络连接，但不显示远程主机类型，因此选项\
  \ B 和 E 均错误。`ping6` 命令发送 IPv6 ICMP 数据包以测试远程主机，但无法判断远程主机是否为邮件服务器，因此选项 C 错误。\n\n##\
  \ 11. B. `ss` 命令可以显示打开的端口以及所有端口的应用程序，因此选项 B 正确。`ip` 和 `ifconfig` 命令仅显示或设置网络设置，因此选项\
  \ A 和 E 错误。`host` 和 `dig` 命令仅显示主机信息，因此选项 C 和 D 也错误。\n\n## 12. C. `ipef3` 工具允许你建立服务器和客户端并通过网络推送数据以测试网络带宽，因此选项\
  \ C 正确。`nmap` 工具用于查找网络上的服务器并扫描开放的网络端口，但不测试带宽，因此选项 A 错误。`nc` 工具允许你建立服务器和客户端来传输数据，但它不会测试连接的网络带宽，因此选项\
  \ B 错误。`ifconfig` 和 `iwlist` 命令是 net-tools 软件包的一部分，用于配置系统上的网络设置；它们不测试网络带宽，因此选项 D\
  \ 和 E 均错误。\n\n## 13. A. `nmap` 工具扫描网络寻找开放网络端口的服务器，允许你记录网络上所有的服务器，因此选项 A 正确。`nc`\
  \ 工具允许你建立服务器和客户端来测试网络，但不会扫描网络寻找其他服务器，因此选项 B 错误。`iperf3` 工具允许你建立服务器和客户端来测试网络带宽，但不扫描网络寻找其他服务器，因此选项\
  \ C 错误。`ifconfig` 和 `iwlist` 命令是 net-tools 软件包的一部分，用于配置系统网络设置；它们不扫描网络，因此选项 D 和 E\
  \ 错误。\n\n## 14. B. DNS 服务器在 `/etc/resolv.conf` 文件中通过 `nameserver` 设置列出，因此选项 B 正确。`/etc/dhcpd.conf`\
  \ 文件定义 DHCP 服务器的配置设置，因此选项 A 错误。`/etc/nsswitch.conf` 文件定义系统搜索主机名的顺序，而不是使用的 DNS 服务器列表，因此选项\
  \ C 错误。`/etc/network/interfaces` 文件定义基于 Debian 系统的网络接口，而不是 DNS 服务器列表，因此选项 D 也错误。`/etc/sysctl.conf`\
  \ 文件定义内核网络参数而非 DNS 服务器列表，因此选项 E 错误。\n\n## 15. A. `ifconfig` 命令必须指定网络接口、IP 地址，然后在掩码地址之前指定\
  \ `netmask` 选项。你可以使用 `up` 或 `down` 选项默认将网卡置于活动或非活动状态，但这不是强制要求的。选项 A 是唯一按正确顺序使用正确值的选项。选项\
  \ C 接近但未能指定网络接口。选项 B 格式不正确，选项 D 和 E 未能列出必要的配置设置。\n\n## 16. A. `iwlist` 命令显示无线网卡检测到的可用无线网络接入点，因此选项\
  \ A 正确。`iwconfig` 命令配置网卡连接到特定的接入点，但不列出所有检测到的接入点，因此选项 B 错误。选项 C 指定了 `ifconfig` 命令，它用于为无线网卡分配\
  \ IP 地址，但不列出接入点。选项 D 中指定的 `ip` 命令同样可以用于设置卡的 IP 地址，但不列出接入点。选项 E 的 `arp` 命令将硬件地址映射到\
  \ IP 地址，以便你找到网络上重复的 IP 地址，但不列出无线接入点。\n\n## 17. D. SSID 值定义接入点名称，它通过 `iwconfig` 命令中的\
  \ `essid` 选项设置，因此选项 D 是正确答案。`key` 指定连接接入点所需的加密密钥，而不是接入点名称，因此选项 A 错误。`netmask` 和\
  \ `address` 值不是通过 `iwconfig` 命令设置的，因此选项 B 和 C 错误。`channel` 定义接入点使用的射频，而不是接入点名称，因此选项\
  \ E 也错误。\n\n## 18. E. `ip` 命令允许你同时显示和设置网络接口的 IP 地址、掩码和默认路由器值，因此选项 E 正确。`ifconfig`\
  \ 命令可以设置 IP 地址和掩码，但不能设置默认路由器。`iwconfig` 用于设置无线接入点设置，`route` 命令用于设置默认路由器，但不设置 IP\
  \ 地址或掩码值。`ifup` 命令仅激活网络接口；它无法设置地址值。\n\n\n\n\n\n19. C. `ping` 命令向指定的远程主机发送 ICMP 数据包并等待响应，因此选项\
  \ C 是正确答案。`netstat` 命令显示有关网络接口的统计信息，所以它是错误的。`ifconfig` 命令显示或设置网络信息，但并不发送 ICMP 数据包，因此选项\
  \ B 是错误的。`iwconfig` 命令显示或设置无线网络信息，但不处理 ICMP 数据包，因此选项 D 是错误的。`ss` 命令显示系统上打开的连接和端口的信息，因此选项\
  \ E 也是错误的。\n\n20. B. `tcpdump` 命令显示通过系统网络接口的数据包，因此你可以使用它来监控网络上的应用程序包，因此选项 B 是正确答案。`nc`\
  \ 命令允许你手动在网络上发送数据包，但不允许你监控应用程序包，因此选项 A 是错误的。`ping` 和 `traceroute` 命令仅向远程服务器发送 ICMP\
  \ 数据包；它们不监控数据包，因此选项 C 和 D 是错误的。`mtr` 命令可以显示到远程服务器的连接性状态，但不允许你查看发往服务器的应用程序包，因此选项\
  \ E 是错误的。\n\n## 第 8 章：比较 GUI\n\n1. C. 桌面环境是一系列共同工作的组件，为用户界面提供图形化设置。因此，选项 C 是正确答案。图形化用户界面（GUI）是一组允许用户通过图标、窗口和其他各种视觉元素与系统交互的程序。因此，选项\
  \ A 是错误的答案。显示管理器（display manager）运行在屏幕，你在那里选择用户名并输入密码以获得系统访问。因此，选项 B 是错误的选择。文件管理器允许你以图形化方式执行文件维护活动的程序。因此，选项\
  \ D 也是错误的选择。窗口管理器是一组决定窗口在桌面上如何呈现的程序。因此，选项 E 也是错误的选择。\n\n2. A, B, C, E. 收藏栏、文件管理器、图标和系统托盘都是图形\
  \ UI 的部分。因此，选项 A、B、C 和 E 是正确选择。命令行是输入文本命令的地方，虽然你可以通过终端模拟器从 GUI 访问它，但它不被认为是图形 UI\
  \ 的部分。因此，选项 D 是唯一的错误选择。\n\n3. A. SDDM（简单桌面显示管理器）是 KDE Plasma 桌面环境的默认显示管理器。因此，选项\
  \ A 是正确答案。Files（也称为 GNOME files）是 GNOME Shell 桌面环境中的文件管理器。因此，选项 B 是错误的答案。Mutter\
  \ 是 GNOME shell 窗口管理器，因此，选项 C 是错误的答案。GDM 代表 GNOME 显示管理器。因此，选项 D 是错误的选择。Dock 是 GNOME\
  \ Shell Dash 的另一个名称，它是 GNOME Shell 内部的收藏栏。因此，选项 E 也是错误的选择。\n\n4. C. KDE Plasma 的文件管理器名为\
  \ Dolphin。因此，选项 C 是正确答案。Nautilus 是 Unity 桌面环境上的文件管理器，因此选项 A 是错误的答案。Plasmoid 是 KDE\
  \ Plasma 小部件的另一个名称。因此，选项 B 是错误的答案。Kwin 是 KDE Plasma 的窗口管理器，因此，选项 D 是错误的选择。Nemo 是\
  \ Cinnamon 桌面环境的默认文件管理器。因此，选项 E 是错误的选择。\n\n5. A. Xfce 桌面管理器专门为具有旧旧 CPU 和少量内存的系统设计，因此选项\
  \ A 是正确的。GNOME2、GNOME3 和 KDE Plasma 桌面管理器都需要更高的 CPU 和内存要求，因此选项 B、C 和 E 是错误的。Wayland\
  \ 是一个低级显示服务器，而不是桌面管理器，因此选项 E 是错误的。\n\n6. A. 声音键辅助功能设置会在大写锁定或数字锁定键开启或关闭时提供哔哔声。因此，选项\
  \ A 是正确答案。能够朗读 GUI 的程序（如 Orca）是屏幕阅读器。因此，选项 B 是错误的答案。光标闪烁设置修改光标闪烁频率，以便在屏幕上更容易光标。因此，选项\
  \ C 也是错误的答案。输出到可刷新盲文器由 Orca 屏幕阅读器提供，它是一个屏幕阅读器。因此，选项 D 是错误的选择。缩放设置允许将屏幕或屏幕部分放大到不同的级别。因此，选项\
  \ E 也是错误的选择。\n\n7. D. 盲显示设备将使用 `brltty` 服务。重启服务的正确 `systemctl` 命令在选项 D 中。选项 A、B\
  \ 和 C 都使用了盲文服务的错误名称，是错误的答案。选项 E 中的命令将重新加载任何修改过的 `brltty` 配置文件，而不是重启服务。因此，选项 E 也是错误的选择。\n\
  \n8. A. 慢速（Slow keys）是一种键盘选项，修改了按键必须按下多长时间才能确认按键。因此，选项 A 是正确答案。粘滞键（Sticky keys）是一种键盘选项，将键盘修饰键（如\
  \ Ctrl 和 Shift）保持为按下状态，直到按下下一个按键。因此，选项 B 是错误的答案。重复键（Repeat keys）是一种键盘选项，它修改了按键必须按下多长时间，并定义了确认按键重复的延迟。因此，选项\
  \ C 也是错误的选择。模拟次要点击（Simulated secondary click）实际上是鼠标选项，它设置一个主键与鼠标点击一起按下，以模拟鼠标右键点击。因此，选项\
  \ D 是错误的答案。屏幕键盘是一种键盘选项，在 UI 上显示视觉键盘，可以通过鼠标或其他指向设备进行操纵以模拟击键。因此，选项 E 也是错误的选择。\n\n\
  9. E. 显示服务器使用通信协议将 UI 的意愿传输到操作系统，反之亦然。因此，选项 E 是正确答案。窗口管理器是代表 UI 与显示服务器通信的程序。因此，选项\
  \ A 是错误的答案。显示管理器控制桌面环境的登录界面，你在那里选择用户名并输入密码以获得系统访问。因此，选项 B 也是错误的选择。桌面环境是一个用户环境，为\
  \ GUI 提供预定的外观和感觉，但它不传输 UI 的意愿到操作系统，因此选项 C 是错误的答案。窗口服务器是窗口管理器的另一个名称，因此选项 D 也是错误的答案。\n\
  \n10. A, C, D, E. 合成器（compositor）安排窗口内的各种显示元素以创建屏幕图像。因此，选项 A 是正确答案。Mutter 和 Kwin\
  \ 虽然主要职责是窗口管理器，但也包含合成器。因此，选项 C 和 D 也是正确答案。Weston 是 Wayland 显示服务器的合成器，因此选项 E 也是正确选择。Wayland\
  \ 是显示服务器，而不是合成器。因此，选项 B 是唯一的错误答案。\n\n11. B, D. Wayland 使用使用 `$WAYLAND_DISPLAY` 环境变量，因此选项\
  \ B 是正确答案。此外，XWayland 支持旧的 X11 程序。因此，选项 D 是额外的正确答案。Wayland 是 X11 显示服务器的替代品，设计得更加安全。因此，选项\
  \ A 是错误的答案。Wayland 的合成器是可以更换的，除了 Weston 之外，还有其他合成器可供 Wayland 使用。因此，选项 C 是错误的选择。为了在\
  \ GNOME Shell 中禁用 Wayland，你需要编辑 `/etc/gdm3/custom.conf` 文件并将 `WaylandEnable` 设置为\
  \ `false`。因此，选项 E 也是错误的答案。\n\n\n\n\n### 12\nC. `loginctl` 命令将帮助你确定当前的 GUI 会话编号。然后你可以再次使用\
  \ `loginctl` 命令结合你的会话编号，来确定你的 GUI 会话是 Wayland 还是 X11。因此，选项 C 是正确答案。虽然你可以执行命令 `echo\
  \ $WAYLAND_DISPLAY` 来帮助判断 GUI 会话是 Wayland 还是 X11，但 `$WAYLAND_DISPLAY` 本身没有任何作用。因此，选项\
  \ A 是错误答案。AccessX 是一个最初提供许多通用访问设置的程序。Wayland 或 X11 没有使用名为 `$AccessX` 的环境变量，因此选项\
  \ B 是错误答案。`$X11` 环境变量是虚构的，所以选项 D 是错误选择。`runlevel` 命令允许你确定系统当前的运行级别，不用于确定显示服务器。因此，选项\
  \ E 也是一个错误选择。\n\n### 13\nC. 当你的显示服务器为 Wayland 时，某些命令（例如 `gnome-shell --replace`）在你的\
  \ GUI 会话中无法工作。因此，选项 C 是正确答案。该场景并未指示 X11 显示服务器已挂起。所以请不要重启服务器，并知选项 A 是错误答案。错误信息并未指示应该改用\
  \ `-R` 选项。因此，选项 B 是错误答案。如果正在使用 XWayland，你不会收到错误信息。因此，选项 D 也是一个错误选择。如果会话禁用了 Wayland，命令将不会产生错误信息。因此，选项\
  \ E 是一个错误答案。\n\n### 14\nB, C, E. X.Org 基金会确实开发名为 X11 的 X 服务器。X 服务器正在被 Wayland 替代。X\
  \ 是 X Window System 的缩写，它是一种显示服务器。因此，选项 B、C 和 E 是正确的。XFree86 直到 2004 年一直是实现 X 的主导服务器。现在主导的服务器是\
  \ X.Org 基金会的 X11 服务器，所以选项 A 是一个错误答案。X.Org 服务器实现了第 11 版本的 X Window System，这就是为什么它有时被称为\
  \ X11。这并不是由于特定用户可以拥有的图形会话数量导致的。因此，选项 D 也是一个错误选择。\n\n### 15\nA, D. `xwininfo` 和 `xdpyinfo`\
  \ 命令提供了有关 X 服务器的信息，包括可用的不同屏幕类型、默认通信参数值、协议扩展信息以及单个窗口信息。这两个工具是开始诊断问题的最佳选择。因此，选项 A\
  \ 和 D 是正确答案。`Xorg -configure` 会为你的创建一个新的 X11 配置文件供你查阅，这在随后的故障排除过程中可能会有用。但是，这并不是开始诊断的最佳命令。因此，选项\
  \ B 是一个错误答案。`xcpyinfo` 命令是虚构的。因此，选项 C 也是一个错误答案。`loginctl` 命令可以帮助你确定用户正在使用 X11 还是\
  \ Wayland，但由于你已经知道 X 显示服务器正在运行，执行此命令将没有帮助。因此，选项 E 也是错误答案。\n\n### 16\nA, B, C, D.\
  \ SPICE（有时写为 Spice）、NX、Xrdp 和 VNC 都是远程桌面。因此，选项 A、B、C 和 D 是正确答案。Caja 是 MATE 桌面环境中的文件管理器，而不是远程桌面。因此，选项\
  \ E 是唯一的错误答案。\n\n### 17\nA, D. SPICE 和 VNC 是远程桌面，通常与虚拟机配合使用。默认情况下，VNC 与 KVM 虚拟机配合。然而，你可以用\
  \ SPICE 替换 VNC。因此，选项 A 和 D 是正确答案。NX 和 Xrdp 通常不用于虚拟机，因此选项 B、C 和 E 不是正确答案。\n\n###\
  \ 18\nE. Xrdp 远程桌面软件使用远程桌面协议 (RDP)。因此，选项 E 是正确答案。远程帧缓冲 (RFB) 协议被 VNC 使用。因此，选项 A\
  \ 是错误答案。Wayland 协议被 Wayland 显示服务器使用。因此，选项 B 也是一个错误选择。选项 C 也是错误答案，因为 NX 技术协议被 NX\
  \ 远程桌面使用。ICE 的简单协议，或独立计算环境简单协议 (SPICE)，被 Spice 远程桌面使用。因此，选项 D 也是一个错误选择。\n\n### 19\n\
  A, C, E. 你需要告知 openSSH 服务器不需要终端，因为你只是在建立隧道。因此，需要 `-N` 切换开关。`-f` 切换会将 openSSH 隧道放入后台运行，释放你的命令行界面，以便你可以输入远程桌面命令。`ssh`\
  \ 命令的本地模式要求使用 `-L` 切换来指定本地系统以及要使用的本地和远程端口。因此，选项 A、C 和 E 是正确的。`-X` 切换不用于 SSH 端口转发，所以选项\
  \ B 是一个错误答案。`-R` 切换用于远程模式 SSH 端口转发。因此，选项 D 也是一个错误选择。\n\n### 20\nB. 你需要使用 X11 转发。为了正确且安全地访问远程\
  \ Linux 系统并运行基于 X11 的应用程序，选项 B 中的命令是最佳选择。因此，选项 B 是正确答案。选项 A 中的命令通过 `-Y` 切换使用可信 X11，这是不安全的。因此，选项\
  \ A 是错误答案。选项 C 中的命令也使用了 `-Y` 切换，所以选项 C 也是错误答案。选项 D 中的命令使用了正确的切换开关，但将连接发送到了笔记本电脑而不是架式\
  \ Linux 服务器。因此，选项 D 是一个错误答案。选项 E 命令使用了 `-L` 切换，它是用于本地 SSH 端口转发的，并且该切换使用了错误的语法并尝试将连接发送到笔记本电脑。因此，选项\
  \ E 是错误答案。\n\n## 第 9 章：调整本地化选项\n\n### 1\nC. ASCII 字符集使用七位代码来存储英语字符，所以选项 C 是正确的。UTF-8\
  \ 字符集使用 1 字节（8 位）存储字符，所以选项 A 是错误的。UTF-16 字符集使用 2 字节（16 位）存储字符，所以选项 B 是错误的。Unicode\
  \ 字符集使用 3 字节（24 位）存储字符，所以选项 D 是错误的，而 UTF-32 字符集使用 4 字节（32 位）存储字符，所以选项 E 是错误的。\n\n\
  ### 2\nA, B. UTF-8 和 UTF-16 字符集使用转换过程将 Unicode 字符集转换为 1 字节（UTF-8）或 2 字节（UTF-16）的值，所以选项\
  \ A 和 B 是是的。ASCII 字符集不转换任何字符，所以选项 C 是错误的。Unicode 字符集也不转换字符，所以选项 D 是错误的。`locale`\
  \ 是一个 Linux 命令而不是字符集，所以选项 E 是错误的。\n\n### 3\nE. Unicode 字符集使用 3 字节存储字符，这提供了足够的空间来表示已知世界语言中的所有字符，所以选项\
  \ E 是正确的。ASCII 字符集仅支持英语字符，所以选项 A 是错误的。`LC_ALL` 环境变量定义了 Linux 系统使用的字符集，但它本身不是字符集，所以选项\
  \ B 是错误的。UTF-8 和 UTF-16 字符集都是 Unicode 字符集的子集，因此它们不能表示世界上使用的所有语言字符，所以选项 C 和 D 是错误的。\n\
  \n\n\n\n\n### 分析与解析\n\n#### 4. E.\n`locale` 命令显示所有的 `LC_` 环境变量及其取值，因此选项 E 是正确的。`date`\
  \ 命令仅显示时间和日期，不显示本地化信息，因此选项 A 是错误的。`time` 命令显示应用程序在系统上消耗的时间，而不是本地化信息，因此选项 B 是错误的。`hwclock`\
  \ 命令显示硬件时钟时间，而不是本地化信息，因此选项 C 是错误的。`LANG` 环境变量允许你一次性设置所有的 `LC_` 环境变量，但它不会显示它们的所有设置，因此选项\
  \ D 是错误的。\n\n#### 5. C, E.\n`LANG` 和 `LC_ALL` 环境变量控制所有的本地化环境变量设置，因此选项 C 和 E 是正确的。`LC_MONETARY`、`LC_NUMBERIC`\
  \ 和 `LC_CTYPE` 环境变量分别控制一类本地化环境变量，而不是所有的本地化环境变量，因此选项 A、B 和 D 都是错误的。\n\n#### 6. B.\n\
  本地化是使 Linux 系统的字符集适应使用本地语言的过程，因此选项 B 是正确的。`locale` 命令允许你查看字符集，但并不能让 Linux 系统适应本地化环境，因此选项\
  \ A 是错误的。字符集用于指定语言字符，但它不能让 Linux 系统适应特定的语言，因此选项 C 是错误的。Unicode 和 ASCII 是两种类型的字符集，并不能让\
  \ Linux 系统适应特定的语言，因此选项 D 和 E 是错误的。\n\n#### 7. D.\n`localectl` 命令是 Systemd 软件包的一部分，允许你显示和更改\
  \ Linux 系统的本地化设置，因此选项 D 是正确的。`timedatectl` 命令也是 Systemd 软件包的一部分，但仅适用于时间和日期的更改，不适用于本地化更改，因此选项\
  \ A 是错误的。`time`、`date` 和 `locale` 程序是旧程序，不属于 Systemd 软件包，因此选项 B、C 和 E 是错误的。\n\n\
  #### 8. B.\n`export` 命令设置与环境变量关联的值，因此选项 B 是正确的。`time` 命令显示应用程序在系统上使用的时间，而不是环境变量的值，因此选项\
  \ A 是错误的。`locale` 命令显示本地化环境变量的值，但并不允许你更改它们，因此选项 C 是错误的。`date` 命令显示并设置时间和日期值，但不涉及本地化环境变量，因此选项\
  \ D 是错误的。`hwclock` 命令显示并设置硬件时钟，但不涉及环境变量，因此选项 E 是错误的。\n\n#### 9. B.\n`LC_MONETARY`\
  \ 环境变量决定用于显示货币数值的字符集，因此选项 B 是正确的。`LC_NUMERIC` 环境变量决定 Linux 如何显示数值，因此选项 A 是错误的。`LC_CTYPE`\
  \ 环境变量决定程序使用的默认字符集，但不一定仅用于货币值，因此选项 C 是错误的。`LC_TIME` 环境变量决定 Linux 系统如何显示时间，而不是货币值，因此选项\
  \ D 是错误的。`LC_COLLATE` 环境变量决定 Linux 如何对字母进行排序，而不是如何显示货币值，因此选项 E 是错误的。\n\n#### 10.\
  \ A.\n每个时区决定了适用于特定地点的 UTC 偏移量，因此选项 A 是正确的。本地化决定用于显示语言字符的字符集，而不是时间，因此选项 B 是错误的。字符集决定如何显示语言字符，但不时间，因此选项\
  \ C 是错误的。`locale` 决定 Linux 如何显示时间，而不是实际的时间设置，因此选项 D 是错误的。硬件时钟是物理工作站或服务器在 BIOS 或\
  \ UEFI 中设置的时间，它并不一定代表相对于 UTC 的时间，实际上甚至可以存储为 UTC 值，因此选项 E 是错误的。\n\n#### 11. B, E.\n\
  `hwclock` 和 `timedatectl` 命令都从物理工作站或服务器获取时间和日期，因此选项 B 和 E 是正确的。`date` 命令显示系统的时间和日期，而不是物理硬件上设置的时间和日期，因此选项\
  \ A 是错误的。`time` 命令显示程序在系统上使用的时间，而不是工作站或服务器上的物理硬件时间和日期，因此选项 C 是错误的。`locale` 命令显示本地化环境变量及其取值，而不是硬件时间和日期，因此选项\
  \ D 是错误的。\n\n#### 12. A.\n基于 Red Hat 的系统使用 `/etc/localtime` 文件来存储适用于系统运行所在位置的适当时区文件，因此选项\
  \ A 是正确的。`/etc/timezone` 文件通常由基于 Debian 的系统使用，因此选项 B 是错误的。`/usr/share/zoneinfo`\
  \ 文件夹存储时区文件，你必须将它们复制到 `/etc/localtime` 文件，因此选项 C 是错误的。`/usr/share/timezone` 和 `/usr/share/localtime`\
  \ 文件夹是错误的文件夹名，因此选项 D 和 E 是错误的。\n\n#### 13. B.\n`/usr/share/zoneinfo` 文件夹包含 Linux\
  \ 支持的每个时区的模板文件，因此选项 B 是正确的。`/etc/localtime` 和 `/etc/timezone` 文件是你复制或链接适当时区文件的目标位置，但它们两者都不是模板文件夹，因此选项\
  \ A 和 C 是错误的。`$HOME` 文件夹包含用户环境设置和用户文件，但不包含时区模板文件，因此选项 D 是错误的。`/usr/share/timezone`\
  \ 文件夹是错误的文件夹名，因此选项 E 是错误的。\n\n#### 14. B.\nSystemd 软件包中的 `timedatectl` 命令显示当前日期、Linux\
  \ 系统时间、硬件时钟时间和时区，因此选项 B 是正确的。`date` 命令显示当前的系统时间、日期和时区，但不显示硬件时间，因此选项 A 是错误的。`time`\
  \ 命令显示应用程序在 CPU 上使用的时间，而不是当前的日期和时间，因此选项 C 是错误的。`hwclock` 命令显示当前的硬件时间，但不显示系统时间、日期或时区，因此选项\
  \ D 是错误的。`localectl` 命令显示系统的本地化设置，但不显示时间、日期、硬件时间或时区，因此选项 E 是错误的。\n\n#### 15. A.\n\
  `date` 命令允许你指定显示时间和日期的格式，因此选项 A 是正确的。`time` 命令显示应用程序消耗的 CPU 时间，而不是当前的日期时间，因此选项 B\
  \ 是错误的。`timedatectl` 命令显示当前的日期时间，但不允许你对输出进行格式化，因此选项 C 是错误的。`localectl` 命令显示系统的本地化设置，但不显示当前的日期时间，因此选项\
  \ D 是错误的。`hwclock` 命令显示当前的硬件时间，但不允许你指定格式，因此选项 E 是错误的。\n\n#### 16. A, D.\n`hwclock`\
  \ 和 `timedatectl` 命令允许你将 Linux 系统时间同步到工作站 BIOS 时间，因此选项 A 和 D 是正确的。`date` 命令允许你更改日期和时间，但不允许将其与工作站\
  \ BIOS 时间同步，因此选项 B 是错误的。`time` 命令允许你显示应用程序消耗的 CPU 时间，但不允许你将系统时间与工作站 BIOS 时间同步，因此选项\
  \ C 是错误的。`localectl` 命令用于本地化，而不是设置时间，因此选项 E 是错误的。\n\n\n\n\n\n17. 基于 Red Hat 的 Linux\
  \ 系统利用 `chrony` 软件包来连接到网络时间服务器。`ntpd` 软件包是一个旧版软件包，且不经常使用，因此选项 A 错误。`localectl` 命令用于设置时间，因此选项\
  \ C 错误。虽然你可以使用 `timedatectl` 命令设置本地时间，但无法用它通过网络时间服务器设置时间，因此选项 D 错误。尽管基于 Red Hat\
  \ 的系统使用了 Systemd 工具，但它们并不使用 `timesyncd` 程序进行网络时间同步，因此选项 E 错误。\n\n18. E. `TZ` 环境变量会覆盖会话应用程序的默认系统时区，因此选项\
  \ E 正确。`LANG` 和 `LC_ALL` 环境变量设置整个系统时区，而不仅仅是编程环境，因此选项 A 和 D 错误。`LC_MONETARY` 和 `LC_NUMERIC`\
  \ 环境变量设置货币值和数值的本地化，它们不会改变时区设置，因此选项 B 和 C 错误。\n\n19. C. UTF-8 字符集复制了 ASCII 字符集，是大多数美国\
  \ Linux 安装中默认使用的字符集，因此选项 C 正确。Unicode、UTF-16 和 UTF-32 字符集使用多个字节来表示字符，因此它们通常不用于英语字符，因此选项\
  \ A、B 和 D 错误。`locale` 命令显示本地化环境变量及其值，它不是字符集代码，因此选项 E 错误。\n\n20. B. `localectl` 命令使用\
  \ `list-locales` 显示 Linux 系统上安装的所有本地化设置，因此选项 B 正确。`timedatectl` 命令显示本地时间和日期，但它不提供关于安装了哪些本地化文件的信息，因此选项\
  \ A 错误。`locale` 命令显示本地化环境变量设置，但不会列出安装了哪些本地化设置，因此选项 C 错误。`LANG` 和 `LC_ALL` 环境变量设置当前的本地化，但无法显示系统上安装了哪些本地化设置，因此选项\
  \ D 和 E 错误。\n\n## 第 10 章：用户与组管理\n\n1. A, B, E. 用户账户的用户名、密码（尽管通常只包含 `x`）和 UID 都是\
  \ `/etc/passwd` 文件记录中的合法字段。因此，选项 A、B 和 E 是正确答案。密码更改日期和特殊标记是 `/etc/shadow` 文件中的字段。因此，选项\
  \ C 和 D 是错误选择。\n\n2. A, B, C. 密码过期日期、账户过期日期和密码都是 `/etc/shadow` 文件记录中的合法字段。因此，选项\
  \ A、B 和 C 是正确答案。注释和默认 shell 是 `/etc/passwd` 文件中的字段。因此，选项 D 和 E 是错误选择。\n\n3. E. 用户账户的用户名是\
  \ `/etc/passwd` 和 `/etc/shadow` 记录中唯一包含相同数据的字段。因此，选项 E 是正确答案。虽然两个文件都有密码字段，但它们包含的数据并不相同。密码只存在于两个文件之一，且最好是\
  \ `/etc/shadow` 文件。因此，选项 A 是错误答案。账户过期日期仅存在于 `/etc/shadow` 文件中，因此选项 B 也是错误选择。UID\
  \ 和 GID 字段仅于 `/etc/passwd` 文件中，因此选项 C 和 D 也是错误答案。\n\n4. B, D, E. 虽然效率不高，但 `cat /etc/passwd`\
  \ 命令允许你查看 `/etc/passwd` 文件中 `NUhura` 账户的记录。`grep NUhura /etc/passwd` 和 `getent passwd\
  \ NUhura` 命令也允许你看到 `NUhura` 记录。因此，选项 B、D 和 E 是正确选择。选项 A 中的 `getent` 命令将用户名和文件名颠倒了，因此它是错误选择。此外，`passwd\
  \ NUhura` 尝试更改账户密码而不是显示其文件记录，因此选项 C 也是错误答案。\n\n5. E. `useradd -D` 命令允许你查看 `/etc/default/useradd`\
  \ 文件中的账户创建配置指令。因此，选项 E 是正确答案。`/etc/passwd`、`/etc/shadow` 和 `/etc/group` 文件不包含账户创建配置指令，因此选项\
  \ A、B 和 C 是错误答案。虽然 `/etc/login.defs` 文件包含账户创建配置指令，但你无法通过 `useradd -D` 命令显示它。因此，选项\
  \ D 也是错误选择。\n\n6. C. 如果没有设置 `CREATE_HOME` 指令或将其设置为 `no`，那么在创建用户账户时，默认不会创建家目录。这很可能是导致问题的原因，所以选项\
  \ C 是正确答案。`HOME` 指令决定了创建新账户家目录时使用的基础目录名称，因此选项 A 是错误答案。如果你没有使用超级用户权限，你甚至无法创建账户，因此选项\
  \ B 是错误选择。`INACTIVE` 指令涉及账户何时被视为非活动，因此选项 D 也是错误答案。`EXPIRE` 指令涉及账户过期，而不是家目录的创建。因此，选项\
  \ E 也是错误选择。\n\n7. D. 要使用超级用户权限立即删除 `KSingh` 账户及其所有的家目录文件，你需要使用 `userdel -r KSingh`\
  \ 命令。因此，选项 D 是正确答案。`usermod` 命令没有 `-r` 选项，因此选项 A 是错误答案。`rm -r /home/KSingh` 命令只会删除账户的家目录文件，而不会删除用户账户。因此，选项\
  \ B 是错误答案。不带任何选项的 `userdel` 命令只会删除账户而不移除任何家目录文件，因此选项 C 是错误选择。`usermod` 命令的 `-d`\
  \ 选项用于更改账户的家目录。因此，选项 E 也是错误选择。\n\n8. A, B, C, E. `passwd`、`usermod`、`userdel` 和\
  \ `chage` 命令都可以以某种方式操作（或删除）账户的 `/etc/shadow` 文件记录。因此，选项 A、B、C 和 E 都是正确的。虽然 `getent`\
  \ 命令允许你显示来自 `/etc/shadow` 的记录，但它不允许你操作文件数据。因此，选项 D 是错误的。\n\n9. B. `newgrp` 命令允许你临时从默认组切换到你有权限的其他组。因此，选项\
  \ B 是正确答案。`usermod` 命令可以进行切换，但它适用于临时情况，因此它是错误选择。`groups` 命令允许显示组信息，但不更改组，因此它也是错误答案。`groupadd`\
  \ 和 `groupmod` 命令处理组管理，而不是临时切换账户的默认组。因此，选项 D 和 E 也是错误选择。\n\n10. C. `usermod -aG\
  \ NCC-1701 JKirk` 命令会将 `JKirk` 作为成员加入 `NCC-1701` 组，而不会移除账户之前的组成员。因此，选项 C 是正确答案。`usermod\
  \ -g NCC-1701 JKirk` 命令将更改 `JKirk` 账户的主组身份，因此选项 A 是错误答案。选项 B 中的命令会将 `JKirk` 账户作为成员加入\
  \ `NCC-1701` 组，但会移除账户之前的所有组成员。因此，选项 B 是错误答案。`groupadd NCC-1701` 命令只会添加 `NCC-1701`\
  \ 组。因此，选项 D 也是错误答案。`groupmod` 命令用于修改组，因此选项 E 中的命令会产生意外的结果。因此，选项 E 是错误选择。\n\n\n\n\
  \n\n### 11. B, D. `getent group NCC-1701` 命令和 `grep NCC-1701 /etc/group` 命令都可以让你看到\
  \ `NCC-1701` 组的各种成员。因此，选项 B 和 D 是正确答案。`groups` 命令用于查看账户所属的各种组成员身份。因此，选项 A 是错误答案。因为\
  \ `groups` 命令的存在，人们总是想在 `/etc/group` 文件名后面加一个 `s`。然而，文件是 `group` 文件而不是 `groups`\
  \ 文件。因此，选项 C 和 E 是错误的选择。\n\n### 12. A. 骨架目录 `/etc/skel/` 通常包含用户环境文件，这些文件在创建账户时会被复制到账户的家目录。因此，选项\
  \ A 是正确答案。选项 B、C 和 D 都包含对家目录（或潜在家目录）的引用。那里是用户环境文件的最终去向，而不是它们的来源。因此，选项 B、C 和 D 都是错误答案。`/etc/`\
  \ 目录是全局环境文件所在的地方。因此，选项 E 也是错误的选择。\n\n### 13. E. 如果在用户账户家目录中找到 `.bash_profile` 用户环境文件，它会被首先运行。因此，选项\
  \ E 是正确答案。如果在用户家目录中与 `.bash_profile` 文件并存在 `.bash_login` 和 `.profile` 用户环境文件，它们将被忽略。因此，选项\
  \ A 和 C 是错误答案。`.bashrc` 文件通常在交互式登录会话中从其他用户环境文件调用执行。因此，选项 B 也是错误答案。`.bash.bashrc`\
  \ 文件虽然与全局环境文件命名相似，但并不存在。因此，选项 D 是错误的选择。\n\n### 14. B, C, D, E. 根据当前使用的 Linux 发行版，选项\
  \ B、C、D 和 E 中的文件（和目录）可能参与全局环境的设置。选项 A 中的目录虽然与用户环境文件的命名相似，但它是虚构的。因此，选项 A 是唯一的错误选择。\n\
  \n### 15. A, B, E. `whoami`、`who am i` 和 `id` 命令都会显示发布命令的当前账户信息。因此，选项 A、B 和 E 是正确答案。虽然\
  \ `cat` 命令可以显示账户家目录中的用户环境文件，但它们不显示有关账户的信息。因此，选项 C 和 D 是错误的选择。\n\n### 16. D. `w`\
  \ 命令显示过去 1、5 和 15 分钟的 CPU 负载信息以及当前访问系统的用户数据。因此，选项 D 是正确答案。`who` 命令将显示当前登录系统的用户信息，但不是\
  \ CPU 负载数据。因此，选项 A 是错误答案。`id` 命令显示用户账户信息，而不是 CPU 负载数据或活动用户信息。因此，选项 B 也是错误选择。`whoami`\
  \ 命令只显示发布命令的当前用户名。因此，选项 C 是错误答案。`last` 命令显示用户账户过去和现在的系统访问信息，但不包含任何关于 CPU 负载的数据。因此，选项\
  \ E 是错误的选择。\n\n### 17. B. `last` 命令默认从 `/var/log/wtmp` 文件提取数据。因此，选项 B 是正确答案。`w`\
  \ 命令使用来自 `/var/run/utmp` 文件的数据，所以选项 A 是错误选择。`last` 命令可以从旧的保存 `wtmp` 文件（例如 `/var/log/wtmp.1`）中提取信息，但它默认并不这样做。因此，选项\
  \ C 是错误选择。`/etc/shadow` 和 `/etc/passwd` 文件不包含任何可用于 `last` 命令的数据。因此，选项 D 和 E 是错误答案。\n\
  \n### 18. A, C. `usrquota` 和 `grpquota` 是 `/etc/fstab` 设置，用于启用文件系统的用户和组配额。因此，选项\
  \ A 和 C 是正确答案。选项 B 和 D 包含了用于管理文件系统配额的命令。因此，选项 B 和 D 是错误答案。`aquota.user` 是在使用 `quotacheck\
  \ -cu` 命令时创建的文件。因此，选项 E 是错误选择。\n\n### 19. B. 要快速移除所有文件系统的配额限制，你需要使用 `quotaoff -a`\
  \ 命令。因此，选项 B 是正确答案。编辑 `/etc/fstab` 将花费太长时间，因为你需要移除配额选项，然后卸载并重新挂载所有文件系统。因此，选项 A 是错误答案。`quotacheck`\
  \ 工具在使用 `-cg` 选项时会创建 `aquota.group` 文件，在使用 `-cu` 选项时会创建 `aquota.user` 文件，如果使用 `-cug`\
  \ 则会创建两个文件。然而，它对于快速关闭文件系统的配额没有任何作用。因此，选项 C 和 D 是错误答案。`umount` 命令不会关闭文件系统的配额，因此选项\
  \ E 也是错误的选择。\n\n### 20. C. `edquota -t` 命令将编辑配额宽限期。因此，选项 C 是正确答案。`edquota -u` 命令编辑指定用户的配额限制。因此，选项\
  \ A 是错误答案。`edquota -g` 命令编辑指定组的配额限制。因此，选项 B 也是错误答案。`edquota -G` 命令和 `edquota --grace`\
  \ 命令是虚构的。因此，选项 D 和 E 都是错误的选择。\n\n## 第 11 章：处理存储\n\n### 1. A. 固态硬盘（SSD）存储设备使用集成电路来存储数据，所以选项\
  \ A 是正确的。SATA、SCSI 和 PATA 是驱动器连接类型而非存储设备类型，所以选项 B、C 和 E 都是错误的。硬盘驱动器（HDD）存储设备使用磁盘盘和读写头来存储数据，而不是集成电路，所以选项\
  \ D 是错误的。\n\n### 2. B. Linux 在 `/dev` 文件夹中为 SCSI 设备创建名为 `sdx` 的文件。对于第二个 SCSI 设备，Linux\
  \ 会创建文件 `/dev/sdb`，所以选项 B 是正确的。`/dev/hdb` 文件代表连接到系统的第二个 HDD 驱动器，所以选项 A 是错误的；而 `/dev/sda`\
  \ 代表连接到系统的第一个 SCSI 设备，所以选项 E 是错误的。选项 C 和 D 都代表分区而非整个驱动器，所以它们都是错误的。\n\n### 3. E.\
  \ `udev` 程序在 Linux 系统上于后台运行，并在存储设备连接到系统时检测并挂载它们，所以选项 E 是正确的。`mkfs` 程序在分区上创建文件系统；它不挂载分区，所以选项\
  \ A 是错误的。`fsck` 程序修复文件系统但不挂载它们，所以选项 B 是错误的。`umount` 程序卸载文件系统，而不是挂载它们，所以选项 C 是错误的。`mount`\
  \ 程序手动挂载文件系统，但不在后台运行或不会自动检测它们，所以选项 D 是错误的。\n\n### 4. C. `udev` 程序在 `/dev/disk/by-id`\
  \ 文件夹中创建链接到存储设备原始设备文件的文件。这些文件通过制造商信息（识别，包括分配给设备的序列号）进行标识符，所以选项 C 是正确的。`/dev/disk/by-path`\
  \ 文件夹根据驱动器与系统的连接情况链接文件，所以选项 A 是错误的。`/dev/sdb` 文件代表分配给该设备的原始设备文件，而不是永久链接文件，所以选项 B\
  \ 是错误的。`/dev/disk/by-uuid` 文件夹包含基于设备 UUID 值的永久链接文件，而不是序列号，所以选项 D 是错误的。`/dev/mapper`\
  \ 文件夹包含用于 LVM 和多路径系统的虚拟驱动文件，而不是指向原始设备文件的永久链接，所以选项 E 是错误的。\n\n### 5. B. GNU `gparted`\
  \ 程序提供了一个管理设备分区的图形窗口，所以选项 B 是正确的。`gdisk`、`fdisk` 和 `parted` 程序都是命令行分区工具，所以选项 A、C\
  \ 和 D 都是错误的。`fsck` 程序是修复文件系统的工具，而不是创建或修改分区的工具，所以选项 E 是错误的。\n\n\n\n\n\n### 6. A.\
  \ Linux 使用挂载点将存储设备上的文件系统插入到虚拟目录，因此选项 A 正确。与 Windows 不同，Linux 不为存储设备分配驱动器号，因此选项 B\
  \ 错误。`/dev` 文件用作存储设备的原始设备；它们不访问文件系统，因此选项 C 错误。`/proc` 和 `/sys` 文件夹用于内核显示和更改存储设备信息，而不是将文件系统添加到虚拟目录，因此选项\
  \ D 和 E 错误。\n\n### 7. D. `ext` 文件系统是 Linux 使用的原始文件系统，`ext4` 是它的最新版本，因此选项 D 正确选项\
  \ C 错误。`reiserFS` 和 `btrfs` 文件系统是独立于 `ext` 文件系统创建的特殊文件系统，因此选项 A 和 B 也错误。`nfs` 文件系统的创建是为了跨网络共享文件和文件夹，并不是原始的\
  \ Linux 文件系统，因此选项 E 错误。\n\n### 8. B. `mkfs` 程序允许你在分区上创建新的文件系统，因此选项 B 正确。`fdisk`、`gdisk`\
  \ 和 `parted` 程序用于创建或修改分区，但不用于处理安装在分区上的文件系统，因此选项 A、D 和 E 均错误。`fsck` 程序修复文件系统但不能创建它们，因此选项\
  \ C 错误。\n\n### 9. B. `mount` 程序允许你将分区上的文件系统插入到虚拟目录，因此选项 B 正确。`fsck` 程序修复文件系统但不将其插入虚拟目录，因此选项\
  \ A 错误。`umount` 程序从虚拟目录中移除文件系统，而不是插入它们，因此选项 C 错误。`fdisk` 程序对设备进行分区，但不创建文件系统或将其插入虚拟目录，因此选项\
  \ D 错误。`mkfs` 程序创建文件系统但不将其插入虚拟目录，因此选项 E 同样错误。\n\n### 10. A. `fsck` 程序修复损坏的文件系统，因此选项\
  \ A 正确。`mount` 程序将文件系统插入虚拟目录，但它不能修复它们，因此选项 B 错误。`umount` 程序从虚拟目录中移除文件系统但不能修复它们，因此选项\
  \ C 同样错误。`fdisk` 程序创建和修改分区，但不处理文件系统，因此选项 D 错误。`mkfs` 程序创建文件系统但不修复它们，因此选项 E 错误。\n\
  \n## 第 12 章：保护文件\n\n### 1. E. 每周调度一次全归档并实施每日差异备份（备份自上次全归档以来所有新增或修改的数据）将满足要求。因此，选项\
  \ E 是正确答案。由于你只想每周创建一个全量备份，选项 A 是错误的答案。每天进行增量备份而没有定期的全量备份将导致恢复数据的时间过长。因此，选项 B 不符合要求，是一个错误的选择。每天进行差异归档也不完全符合要求，因为你没有每周进行全归档。因此，选项\
  \ C 是错误的答案。选项 D 在数据恢复方面的时间效率不如选项 E，因为你必须应用每个增量来恢复数据，而不是使用一个差异归档。因此，选项 D 也是一个错误的选择。\n\
  \n### 2. B. `gzip` 工具压缩数据文件并赋予其 `.gz` 文件扩展名。因此，选项 B 是正确答案。xz`、`bzip2` 和 `zip` 压缩工具压缩数据文件并赋予不同的文件扩展名，因此选项\
  \ A、C 和 D 是错误的答案。`dd` 工具不是压缩程序。因此，选项 E 也是一个错误的选择。\n\n### 3. D. 为了快速创建虚拟目录结构周围离散文件的归档，使用的最佳工具是\
  \ `cpio` 程序。这是因为你可以利用 `find` 命令找到文件，然后将结果传递给 `cpio` 工具。因此，选项 D 是正确答案。虽然 `tar` 工具使用\
  \ `.snar` 文件，但它不是这种场景下最高效的程序，因此选项 A 是一个错误的答案。`dd` 工具用于整个磁盘或分区，因此选项 B 是一个错误答案。`rsync`\
  \ 和 `zip` 程序不是这种场景下最高效的工具，因此选项 C 和 E 也是错误的选择。\n\n### 4. E. `tar` 选项 `-cJvf` 将使用最高压缩工具\
  \ `xz` 创建一个 tar 包，并允许管理员在文件复制到压缩归档期间通过详细选项（verbose option）查看文件。因此，选项 E 是正确答案。选项\
  \ A 和 B 中的开关执行的是提取（`-x`）而不是创建，所以它们是错误的答案。选项 C 唯一错误之处是它通过 `-z` 开关采用了 `gzip` 压缩，因此它是一个错误的选择。选项\
  \ D 漏掉了详细开关，所以它也是一个错误的选择。\n\n### 5. A. 选项 A 中的 `dd` 命令将正确完成工作。因此，它是正确答案。选项 B 到 D\
  \ 中的 `dd` 命令输入和输出文件反反了，它们将破坏 `/dev/sdc` 驱动器数据。因此，选项 B、C 和 D 是错误的答案。选项 E 中的 `dd`\
  \ 命令将使用零清空 `/dev/sdc` 驱动。因此，选项 E 也是一个错误的选择。\n\n### 6. C. `-a` 开关允许你递归备份目录树并保留所有的文件元数据。它等同于使用\
  \ `-rlptgoD` 。因此，选项 C 是正确答案。`-r` 开关只允许递归操作但不保留元数据（例如文件所有权）。因此，选项 A 是错误的答案。`-z` 开关仅采用压缩而不进行其他，所以选项\
  \ B 是一个错误的选择。`-e` 和 `--rsh` 开关用于在发送文件到远程系统时指定远程程序。因此，选项 D 和 E 也是错误的选择。\n\n### 7.\
  \ E. 当你结合使用 `rsync` 工具和 `-z` 开关时，你正在使用 `zlib` 库的压缩。因此，选项 E 是正确的。因此，选项 A、B、C 和 D\
  \ 是错误的选择。\n\n### 8. A, B, E. 选项 A、B 和 E 关于 `scp` 工具都是真语句，因此是正确答案。`scp` 程序不是交互式工具，因此选项\
  \ C 是错误的答案。此外，`scp` 工具无法在不产生副作用的情况下中断（你必须重新开始），所以选项 D 也是一个错误的选择。\n\n### 9. E. `reput`\
  \ 命令将恢复你中断的上传本地备份到远程系统的操作。因此，选项 E 是正确答案。`progress` 命令切换进度显示的开启关闭，所以选项 A 是错误的答案。`get`\
  \ 命令和 `reget` 命令涉及从远程系统下载文件到本地系统。因此，选项 B 和 C 是错误的选择。虽然在操作开始前可能使用了 `put` 命令，但它不会恢复上传，因此选项\
  \ D 也是一个错误的选择。\n\n### 10. B. 在这种情况下，最可能的原因是归档在传输到远程系统时损坏了。因此，选项 B 是正确的。如果本地归档在创建时已损坏，传输要么会使其进一步损坏要么保持不变。因此，选项\
  \ A 是错误的答案。在 `sftp` 工具内部使用错误的命令或在 `md5sum` 程序上使用错误的开关通常不会导致损坏。因此，选项 C 和 E 是错误的。只有在没有发生损坏时数字才会匹配，因此选项\
  \ D 也是一个错误的选择。\n\n## 第 13 章：软件管理\n\n\n\n\n\n### 1. A, B\n当开发者使用 `tar` 和 `gzip` 实用程序以源码\
  \ tar 包的形式分发应用程序时，你通常需要从网站下载该文件。`wget` 和 `cURL` 程序允许你从命令行下载文件，因此选项 A 和 B 是正确的。`dpkg`\
  \ 工具用于安装 `.deb` 软件包文件，而不是 tar 包，因此选项 C 是错误的。`rpm` 和 `yum` 工具用于安装 `.rpm` 软件包，因此选项\
  \ D 和 E 是错误的。\n\n### 2. D\n`make` 脚本运行必要的编译器步骤，以编译构建应用程序可执行文件所需的所有源代码和库文件，因此选项 D\
  \ 是正确的。`dpkg` 工具安装 `.deb` 软件包文件，而不是源代码文件，因此选项 A 是错误的。`rpm` 和 `yum` 工具用于安装 `.rpm`\
  \ 软件包，因此选项 B 和 C 是错误的。`wget` 程序用于下载源码包，但并不用于构建它们，因此选项 E 是错误的。\n\n### 3. C\n`configure`\
  \ 工具评估你的 Linux 系统，以确保满足所有依赖项并安装了正确的编译器工具，然后构建 `make` 脚本，因此选项 C 是正确的。`make` 脚本配合\
  \ `install` 选项运行 `make` 脚本但并不创建它，因此选项 A 和 B 是错误的。`gcc` 程序编译源代码和库文件，但不创建 `make` 脚本，因此选项\
  \ D 是错误的。`dpkg` 安装 `.deb` 软件包文件但不创建 `make` 脚本，因此选项 E 是错误的。\n\n### 4. A\nGNU 编译器集合\
  \ (`gcc`) 是 Linux 中最常用的编译器，因此选项 A 是正确的。`make` 实用程序运行 make 脚本以帮助使用 `gcc` 构建应用程序，但它并不直接编译源代码，因此选项\
  \ B 是错误的。`configure` 实用程序根据编译器程序的位置帮助构建 `make` 脚本，但不编译源代码，因此选项 C 是错误的。`dpkg` 和 `rpm`\
  \ 程序分别是用于安装 `.deb` 和 `.rpm` 软件包的包工具，不用于编译源代码文件，因此选项 D 和 E 都是错误的。\n\n### 5. E\n磁带存档程序\
  \ `tar` 通常用于将源代码项目打包成单个的可分发文件，因此选项 E 是正确的。`dpkg`、`rpm`、`yum` 和 `apt-get` 程序都与包管理文件一起，而不是用于存档源代码文件，因此选项\
  \ A、B、C 和 D 都是错误的。\n\n### 6. B\n`tar` 程序的 `-zxvf` 命令行选项通常用于解压并从 tar 包文件中提取文件，因此选项\
  \ B 是正确的。`-Uvh` 选项组通常用于 `rpm` 程序安装软件包，但它对 `tar` 程序无效，因此选项 A 是错误的。`-xvf` 命令行选项组合从\
  \ tar 包中提取文件但不对其进行解压，因此选项 C 是错误的。`-zcvf` 选项组将创建一个新的 tar 包并对其进行压缩，而不是提取和解压文件，因此选项\
  \ D 是错误的。`-cvf` 选项组创建一个新的 tar 包文件，但它不会从现有文件中提取文件，因此选项 E 是错误的。\n\n### 7. B\nRocky\
  \ Linux 发行版使用 Red Hat 包管理系统，该系统使用 `.rpm` 文件，因此选项 B 是正确的。`.deb` 文件名扩展用于识别基于 Debian\
  \ 的包管理文件，因此选项 A 是错误的。`.tgz` 文件名扩展用于识别压缩的 tar 存档文件，因此选项 C 是错误的。`.tar` 文件名扩展用于识别 tar\
  \ 存档文件，因此选项 D 是错误的，`.gz` 文件名扩展用于识别用 `gzip` 实用程序压缩的文件，因此选项 E 是错误的。\n\n### 8. D\n\
  `dpkg` 程序用于在基于 Debian 的系统上安装 `.deb` 软件包，因此选项 D 是正确的。`rpm`、`yum` 和 `dnf` 程序都是用于基于\
  \ Red Hat 的包管理系统的工具，而不是基于 Debian 的系统，因此选项 A、B 和 C 都是错误的。`tar` 程序用于创建和提取 tar 包存档文件，而不是\
  \ `.deb` 文件，因此选项 E 是错误的。\n\n### 9. C, E\n`yum` 和 `dnf` 程序用于从基于 Red Hat 的仓库安装 `.rpm`\
  \ 软件包，因此选项 C 和 E 是正确的。`dpkg` 和 `apt-get` 程序用于在基于 Debian 的包管理系统中安装 `.deb` 文件，因此选项\
  \ A 和 D 是错误的。`tar` 程序用于创建和提取存档文件，因此选项 B 是错误的。\n\n### 10. A\n基于 Red Hat 的 Linux 发行版使用\
  \ flatpak 应用程序容器格式安装容器，使得选项 A 是正确的。snap 应用程序容器格式用于 Ubuntu，但不用于 Red Hat，因此选项 D 是错误的。`rpm`\
  \ 和 `dpkg` 格式用于包管理，而不是应用程序容器，因此选项 B 和 C 是错误的。`gcc` 程序用于将源代码编译为可执行程序，因此选项 E 是错误的。\n\
  \n## 第 14 章：维护内核模块\n\n### 1. A, C, D, E\n内核模块是一个自包含的驱动库文件，它没有预编译到 Linux 内核中。它可以根据需要加载和卸载，在需要时提供额外功能。这些内核模块使得\
  \ Linux 内核保持轻量且更灵活。因此，选项 A、C、D 和 E 都是正确答案。唯一的错误答案是选项 B，它是错误的是因为内核模块没有编译到内核中。\n\n\
  ### 2. B, D\n内核模块文件取决于发行版，可以存储在 `/lib/modules/KernelVersion/` 或 `/usr/lib/modules/KernelVersion/`\
  \ 的子目录下。如果使用了 `/usr/lib/modules/KernelVersion/` 目录，它通常硬链接到 `/lib/modules/KernelVersion/`\
  \ 目录。因此，选项 B 和 D 是正确答案。其他目录名是虚构的。因此，选项 A、C 和 E 是错误选项。\n\n### 3. A, B, D, E\n旧版本的\
  \ Linux 发行版将模块配置信息存储在配置文件 `/etc/modules.conf` 中。在更现代的发行版中，配置信息存储在 `/etc/modprobe.d/`、`/lib/modprobe.d/`、`/usr/lib/modprobe.d/`\
  \ 和 `run/modprobe.d/` 目录下的 `*.conf` 文件中。因此，选项 A、B、D 和 E 都是正确答案。`/etc/modules.d/`\
  \ 目录是虚构的，因此选项 C 是错误选项。\n\n### 4. E\n`modinfo` 实用程序允许你查看作为命令行参数传递的模块的详细信息。这些详细信息包括任何依赖项。因此，选项\
  \ E 是正确答案。`dmesg` 命令有助于查看与模块失败相关的内核消息，但不显示模块依赖信息。因此，选项 A 是错误答案。`insmod` 实用程序用于动态加载模块，因此，选项\
  \ B 是错误选项。`lsmod` 命令显示当前加载的模块。虽然它显示了其他正在使用模块的模块，但因为它没有列出依赖项也不显示未卸载模块的信息，所以不是最佳选择。因此，选项\
  \ C 也是错误答案。`modprobe` 实用程序用于加载和卸载内核模块，因此，它也不是最佳选择。因此，选项 D 是错误选项。\n\n\n\n\n\n###\
  \ 5\nC. 如果你将 `xyz` 工具作为参数传递给命令，`modprobe` 工具将动态加载该工具，并加载其任何需要的依赖项。因此，选项 C 是正确答案。`insmod`\
  \ 工具用于动态加载模块。然而，它不会加载模块的任何依赖项，因此，选项 A 是错误的选择。`modinfo` 工具允许你查看作为命令参数传递的模块的详细信息，但它不会加载模块。因此，选项\
  \ B 是错误答案。`lsmod` 命令显示当前加载的模块，因此选项 D 是错误答案。`depmod` 命令用于扫描系统以更新 `modules.dep` 文件。因此，选项\
  \ E 也是错误的选择。\n\n### 6\nD. Linux 系统通常会自动检测新硬件并加载任何需要的模块。`depmod` 命令将扫描系统以寻找任何未自动检测到的硬件。它会确定任何需要的模块，检查模块的依赖关系，并更新相应的文件。因此，选项\
  \ D 是正确答案。`lsmod` 命令显示当前加载的模块，因此选项 A 是错误答案。`modinfo` 工具允许你查看作为命令参数传递的模块的详细信息。然而，如果你不知道设备相关的模块，此工具的作用就有限了。因此，选项\
  \ B 是错误的选择。`dmesg` 命令有助于查看任何关于模块失败的内核消息，因此如果如果是模块失败问题，你可以使用此命令进行查看。但是，由于设备未被检测到，它不是启动故障排除过程的最佳命令。因此，选项\
  \ C 是错误答案。`insmod` 工具用于动态加载模块，因此，选项 E 是错误的选择。\n\n### 7\nA. `modprobe` 工具使用 `modules.dep`\
  \ 文件来确定任何模块依赖关系。因此，选项 A 是正确答案。其他选项包含涉及内核模块管理的目录，因此选项 B、C、D 和 E 是错误的选择。\n\n### 8\n\
  E. `insmod` 工具允许你快速将作为命令参数传递的模块插入 Linux 内核中。因此，选项 E 是正确答案。`lsmod` 命令显示当前加载的模块，因此选项\
  \ A 是错误答案。`modinfo` 工具允许你查看作为命令参数传递的模块的详细信息，但它不会加载模块。因此，选项 B 是错误答案。`dmesg` 工具显示内核环形缓冲区，但并不允许向其中插入模块。因此，选项\
  \ C 也是错误的选择。`depmod` 命令用于扫描系统以更新 `modules.dep` 文件。因此，选项 D 也是错误的选择。\n\n### 9\nC.\
  \ `rmmod` 命令将快速从 Linux 内核中卸载模块及其任何依赖项。由于 `abc` 模块没有任何依赖项，选项 C 是最佳答案。`insmod` 工具用于加载（插入）模块而不是卸载模块。因此，选项\
  \ A 是错误答案。`unload` 不是此用途的标准命令，所以 B 是错误的选择。`modprobe` 命令也可以卸载模块，但 `rmmod` 专门用于简单的卸载。`depmod`\
  \ 命令用于更新依赖关系，因此选项 D 是错误的选择。\n\n### 10\nB. `modprobe -r` 命令将快速卸载一个模块及其依赖项，因此选项 B\
  \ 是正确答案。`dmesg` 命令有助于查看内核消息。`lsmod` 命令显示当前加载的模块。`paste` 命令不用于此。`groupdel` 命令用于删除组。\n\
  \n## 第 15 章：所有权与权限\n\n1. A, B, E. `getfacl` 命令检索分配给文件或目录的所有 ACL 权限。`chmod` 命令更改分配给文件或目录的权限。`chown`\
  \ 命令更改所有者和组。\n\n2. B, C, D. 标准的 Linux 权限是所有者、组和其他人。`chmod` 命令更改这些权限。`chown` 命令更改所有权。\n\
  \n3. B. 用户 ID 位 (SUID) 允许应用程序以所有者的权限运行。粘滞位 (sticky bit) 防止用户删除他们拥有访问权限的文件。\n\n4.\
  \ E. 八进制模式 `644` 代表所有者具有读/写权限，组和其他人只有读权限。在符号模式下，这是 `rw-r----`。\n\n\n\n\n\n### 7.\
  \ D. \nSELinux 的 `permissive` 模式会记录策略违规行为，但不会阻止操作发生，因此选项 D 是正确的。`disabled` 模式允许所有操作发生但不进行记录，因此选项\
  \ A 是错误的。`enforcing` 模式会记录策略违规行为并强制执行，因此选项 B 是错误的。选项 C 和 E，即 `targeted` 和 `MLS`，并不是\
  \ SELinux 模式，而是定义要监控什么种类型的守护进程；它们都是错误的。\n\n### 8. C.\n`ls` 命令的 `-Z` 选项显示分配给文件或目录的\
  \ SELinux 安全上下文，因此选项 C 是正确的。`getsebool` 命令显示策略规则的当前设置，而不是文件的安全上下文，因此选项 A 是错误的。`setsebool`\
  \ 命令用于启用或禁用策略规则，它并不会显示文件的安全上下文，因此选项 B 是错误的。`getenforce` 命令显示当前的 SELinux 模式，而不是文件的安全上下文，因此选项\
  \ D 是错误的。`ls` 命令的 `-l` 选项显示分配给文件的标准权限，而不是文件的 SELinux 安全上下文，因此选项 E 是错误的。\n\n### 9.\
  \ A, D.\n`su` 命令允许你以另一个用户（包括 root 用户）的身份运行应用程序，`sudo` 命令允许你以 root 用户身份运行应用程序，因此选项\
  \ A 和 D 都是正确的。`wheel` 和 `adm` 都是提供管理员权限的用户组，但它们本身不是运行应用程序的命令，因此选项 B 和 E 都是错误的。`visudo`\
  \ 命令打开编辑器编辑 `sudoers` 文件以便你进行编辑，但它不能运行其他应用程序，因此选项 C 是错误的。\n\n### 10. C, D.\n基于 Red\
  \ Hat 的发行版使用 `wheel` 组，基于 Debian 的发行版使用 `sudo` 组来允许成员获得系统管理员权限运行应用程序，因此选项 C 和 D\
  \ 是正确的。`lp` 组用于授予访问系统打印机的权限，而不是以管理员权限运行应用程序，因此选项 A 是错误的。`adm` 组通常用于基于 Debian 的系统以授予访问日志文件的权限，而不是以管理员权限运行应用程序，因此选项\
  \ B 是错误的。选项 E `su` 是一个以另一个用户身份运行命令的命令行工具，而不是用户组，因此它是错误的。\n\n## 第 16 章：查看访问和身份验证方法\n\
  \n### 1. D.\n应用程序要使用 PAM，它必须配合 `libpam`（也称为 `libpam.so`）库进行编译。因此，选项 D 是正确答案。选项 A\
  \ 列出了 `ldd` 命令，它允许你查看与各种应用程序编译的模块。因此，选项 A 是错误的答案。选项 B、C 和 E 都是 PAM 模块，但没有一个是使应用程序感知\
  \ PAM 所需的 PAM 库模块。因此，选项 B、C 和 E 都是错误的选择。\n\n### 2. A, B, D, E.\n`requisite`、`required`、`sufficient`\
  \ 和 `optional` 都是你在 PAM `/etc/pam.d/` 配置文件中可能找到 PAM 控制标志。因此，选项 A、B、D 和 E 都是正确的。选项\
  \ C `allowed` 是虚构的，因此是一个错误的选择。\n\n### 3. B, E.\n`pam_tally2` 和 `faillock` 命令显示失败的登录尝试，因此选项\
  \ B 和 E 是正确答案。`tally2` 命令不存在，因此选项 A 是错误的答案。`pam_tally2.so` 模块涉及由于登录失败而锁定账户，但它不显示失败的登录。因此，选项\
  \ C 是错误的选择。`pam_faillock` 是虚构的，因此选项 D 也是一个错误的选择。\n\n### 4. B, C.\n非对称（或公钥/私钥）加密涉及消息发送者使用接收者的公钥对消息进行加密。当接收者获得加密消息时，使用接收者的私钥进行解密。因此，选项\
  \ B 和 C 是正确答案。对称加密也被称为秘密或私钥加密。它涉及发送者和接收者使用相同的密钥对消息进行加密和解密。因此，选项 A、D 和 E 是错误的选择。\n\
  \n### 5. E.\n选项 E 描述描述数字签名，因此是正确答案。选项 A 描述加密，因此是错误的答案。选项 B 描述解密，也是一个错误的选择。选项 C 描述了\
  \ PKI，因此选项 C 是错误的答案。选项 D 描述了自签名数字证书，因此它也是一个错误的选择。\n\n### 6. A.\nOpenSSH 会在每个用户的\
  \ `~/.ssh/known_hosts` 文件中跟踪任何之前连接过的主机及其公钥。因此，选项 A 是正确答案。`~/.ssh/authorized_keys`\
  \ 文件在 SSH 中用于存储授权密钥，以实现无密登录。因此，选项 B 是错误的答案。选项 C 和 D 是虚构的，因此是错误的选择。选项 E 是由 `ssh-keygen`\
  \ 工具创建的公钥，用于建立密码认证连接，因此它是一个错误的选择。\n\n### 7. A, B, C.\n`~/.ssh/config`、`/etc/ssh/ssh_config`\
  \ 和 `/etc/ssh/sshd_config` 文件都是 SSH 配置文件。因此，选项 A、B 和 C 是正确的选择。选项 D 和 E 是虚构的，因此是错误的。\n\
  \n### 8. E.\n正确答案是选项 E。这些密钥的文件名为 `id_<type>` 表示私钥，`id_<type>.pub` 表示公钥。选项 E 使用 RSA\
  \ 算法。选项 A 的密钥是用于密码认证连接的私钥，因此它是错误的答案。选项 B 是 A 密钥的公钥，因此它也是错误的选择。选项 C 和 D 是虚构的，因此它们也是错误的。\n\
  \n### 9. A, C, D, E.\n选项 A、C、D 和 E 都是关于 TCP Wrappers 的正确陈述。你永远不会想在 `/etc/hosts.allow`\
  \ 中放置 `ALL: ALL`，因为这将阻止所有人访问服务。相反，你会将此记录放在 `/etc/hosts.deny` 中以提供最好的安全性，因为它最后被检查。因此，选项\
  \ B 是错误的选择。\n\n### 10. C.\n`pam_tally2.so` 库允许你设置锁定账户前的登录尝试次数，有助于防止暴力破解。这使得选项 C\
  \ 是正确的。`pam_pwhistory.so` 库防止你重复密码，但不限制登录尝试次数，因此选项 A 是错误的。`pam_pwquality.so` 库要求密码中使用混合大小写和特殊字符，但并不限制登录尝试次数，因此选项\
  \ B 是错误的。`pam_unix.so` 库使用 shadow 密码文件，但不限制登录尝试次数，因此选项 D 是错误的。`pam_cracklib.so`\
  \ 库是一个旧的 PAM 库，仅强制强密码——并不限制登录尝试次数，因此选项 E 是错误的。\n\n## 第 17 章：实现日志服务\n\n### 1. D.\
  \ 由 Sendmail 项目创建的 syslog 协议已成为 Linux 记录系统事件消息的标准，因此选项 D 是正确的。SMTP 是邮件协议，FTP 是文件传输协议，因此选项\
  \ A 和 B 都是错误的。NTP 是网络时间协议，因此选项 C 是错误的。选项 E `journalctl` 是用于读取 `systemd-journald`\
  \ 日志文件的工具，而不是记录事件消息的协议，因此它也是错误的。\n\n\n\n\n\n## 2. A. `cron` 应用在 Linux 系统上调度作业，因此\
  \ `cron` 设施关键字代表从作业调度器接收的事件消息，所以选项 A 是对的。`user` 关键字代表从用户处接收的事件，因此选项 B 是错误的。`kern`\
  \ 关键字代表从内核接收的事件，因此选项 C 是错误的。`console` 关键字代表从系统控制台接收的事件，因此选项 D 是错误的。`local0` 关键字在标准中没有定义，通常在系统内部定义，但它通常不会接收来自作业调度器的事件，因此选项\
  \ E 是错误的。\n\n## 3. C. `emerg` 严重级别优先级为 0，是 syslog 中的最高级别，因此选项 C 是对的。`crit` 严重级别为\
  \ 2，因此它不是最高级别，选项 A 是错误的。`alert` 关键字被分配级别为 1，但它不是最高级别，因此选项 B 是错误的。`notice` 关键字被分配级别\
  \ 5 且不是最高级别，因此选项 D 是错误的。`err` 关键字被分配级别 3 且不是最高级别，因此选项 E 是错误的。\n\n## 4. B. `notice`\
  \ 严重级别代表重要但正常的系统事件消息，因此选项 B 是对的。`crit` 和 `alert` 关键字代表关键或需要特殊关注的事件消息，因此选项 A 和 D\
  \ 是错误的。`info` 关键字代表仅具有信息性但不重要的事件消息，因此选项 C 是错误的。`local0` 关键字不是在 syslog 协议中定义的，而是由本地系统定义的，因此选项\
  \ E 是错误的。\n\n## 5. E. `rsyslogd` 应用被设计为 `syslogd` 应用的快速版本，因此选项 E 是对的。`syslogd` 应用是原始的\
  \ syslog 应用，并不以速度著称，因此选项 A 是错误的。`syslog-ng` 应用的设计比 `syslogd` 更具功能性，但更快，因此选项 B 是错误的。`systemd-journald`\
  \ 应用以读取日志条目时查询更快而闻名，但并非设计为处理事件消息时更快，因此选项 C 是错误的。`klogd` 应用是原始 `sysklogd` 应用的一部分，同样也不快，因此选项\
  \ D 是错误的。\n\n## 6. A. `rsyslogd` 应用默认使用 `rsyslog.conf` 配置文件，因此选项 A 是对的。选项 D `rsyslog.d`\
  \ 通常用作存储额外 `rsyslogd` 配置文件的文件夹，但它不是默认配置文件名，因此是错误的。选项 B 和 C 是其他日志应用程序的配置文件，而不是 `rsyslogd`\
  \ 的，因此它们是错误的。选项 E 不是有效的日志应用配置文件名。\n\n## 7. D. `rsyslogd` 应用根据定义的严重级别或更高级别对日志事件消息进行排序，因此选项\
  \ D 会记录所有 `warn`、`alert` 或 `emerg` 严重级别的内核事件消息，因此它是对的。选项 A 的设施和优先级设置只会记录严重性为警告的内核消息，因此是错误的。选项\
  \ B 会记录所有内核事件消息，而不仅仅是警告或更高级别，因此是错误的。选项 C 会记录所有设施类型的事件消息，但包含信息或更高级严重性，因此是错误的。选项 E\
  \ 会记录内核事件消息，但仅限 `alert` 或 `emerg` 严重级别，而不包含警告级别，因此是错误的。\n\n## 8. B. `Storage` 设置控制\
  \ `systemd-journald` 如何管理日志文件。将值设置为 `persistent` 可确保日志文件保留在 `/var/log/journal` 目录中，因此选项\
  \ B 是对的。将值设置为 `auto` 仅确保当 `/var/log/journal` 目录存在时日志文件才是持久的，因此选项 A 是错误的。将值设置为 `volatile`\
  \ 确保文件不持久化，因此选项 D 是错误的。选项 C 和 E 指的是控制是否将事件消息传递给 `rsyslogd` 应用的设置，它们都是错误的。\n\n##\
  \ 9. C. `-r` 选项反序显示日志条目，因此最近的条目将首先出现。因此选项 C 是对的。`-a` 选项显示所有数据字段，但按正常顺序，因此选项 A 是错误的。`-l`\
  \ 选项显示所有可打印的数据字段，但按正常顺序，因此选项 B 是错误的。`-e` 选项跳转到日志文件末尾但按正常顺序显示剩余条目而不是反序，因此选项 D 是错误的。`-n`\
  \ 选项显示指定数量的条目，但按正常顺序，因此选项 E 是错误的。\n\n## 10. A. `journalctl` 应用允许通过 `OBJECT_PID`\
  \ 匹配应用程序进程 ID (PID) 来过滤与特定应用程序相关的事件消息，因此选项 A 是对的。`Kernel` 匹配检索由系统内核而非应用程序生成的事件消息，因此选项\
  \ B 是错误的。`_TRANSPORT` 根据接收方式过滤事件消息而不是根据应用程序，因此选项 C 是错误的。选项 D `_UID` 根据用户 ID 值过滤事件消息而不是根据应用程序，因此是错误的。选项\
  \ E `_UDEV` 根据设备 ID 过滤事件而不是根据应用程序，因此它也是错误的。\n\n## 11. B. SNMP 使用陷阱（traps）捕获服务器事件并将其到远程监控服务器，因此选项\
  \ B 是对的。Webhooks 允许远程程序使用应用程序编程接口（API）连接并查询服务器，通常使用 JSON 文件格式，但它们本身不发送错误消息，因此选项\
  \ A、C 和 E 都是错误的。管理信息基础（MIB）在 SNMP 中定义了监控的事件代码，但它不会将它们转发到远程服务器，因此选项 D 是错误的。\n\n##\
  \ 第 18 章：监控 Linux 防火墙\n\n### 1. A, C, E. 本章涵盖的 Linux 防火墙应用使用访问控制列表 (ACL) 来识别哪些网络包允许进入或离开系统。因此，选项\
  \ A 是正确的。它们通过检查控制信息和其他网络数据来识别网络包。因此，选项 C 也是正确选择。此外，Linux 防火墙应用使用配置文件维持持久性，这允许防火墙配置在系统重启和/或防火墙应用启动或重新加载后存在。因此，选项\
  \ E 也是正确答案。这些防火墙无法检测恶意行为。它们仅遵循定义的规则。因此，选项 B 是错误的。此外，它们使用 Linux 内核的 netfilter，而不是\
  \ `iptables`（它是防火墙服务），因此选项 D 也是错误选择。\n\n### 2. B. 选项 B 最好描述了包过滤。选项 A 描述了如何识别包，但仅允许它们进入系统，因此不是最佳答案。包的负载（payload）指的是它携带的数据。在包过滤中，通过其控制信息（如源\
  \ IP 地址）识别包。因此，选项 C 也不是正确答案。网络包可以通过比源地址多得的信息进行识别，因此选项 D 也是错误答案。选项 E 也是错误答案，因为它关注包的负载而不是其控制信息。\n\
  \n\n\n\n\n### 3. C, D.\n状态检测防火墙使用内存表来跟踪已建立连接的数据包，这使这些连接处理更快。此外，它可以检测数据包是否被碎片，从而保护系统免于跨多个数据包的攻击。因此，选项\
  \ `C` 和 `D` 是正确答案。无状态防火墙整体运行速度更快，而且不受 DDoS 攻击的影响那么大。因此，选项 `A` 和 `B` 是错误答案。虽然状态检测防火墙容易受到\
  \ DDoS 攻击，但这并不是它的优势。因此，选项 E 也是错误选择。\n\n### 4. E.\n在 `firewalld` 中，网络流量被分组到一个区域（zone）中，这是一个预定义的规则集，也称为信任级别。因此，选项\
  \ E 是正确答案。虽然 `firewalld` 确实使用了 `netfilter` 以及 `firewall-cmd` 命令，但这些项目并不是预定义的规则集，因此选项\
  \ `A` 和 `B` 是错误答案。服务（service）是特定服务（如 DNS）的预定义配置集。因此，选项 C 也是错误答案。选项 D 是错误选择，因为拒绝数据包的区域被称为\
  \ `block`。\n\n### 5. D.\n`firewalld` 的运行环境是活动防火墙，但如果配置没有被保存为永久环境，它就不是持久的。因此，在成功测试后，Quill\
  \ 先生应该执行 `firewall-cmd --runtime-to-permanent` 命令将运行时环境保存到永久环境中。因此，选项 D 是正确答案。重启系统将丢失测试过的运行时环境，所以选项\
  \ A 是错误答案。`--panic-on` 选项会阻塞所有入站流量，因此选项 B 也是错误答案。在这种情况下，运行时与永久环境不同，因此选项 C 是错误选择。虽然\
  \ `--permanent` 选项允许你同时修改运行时和永久环境，但 Quill 先生并没有这样做，因此选项 E 也是错误答案。\n\n### 6. C.\n\
  为了达到预期的结果，Quill 先生需要修改 `ping` 使用的协议（即 ICMP）的 `iptables` `INPUT` 链。此外，目标需要设置为 `DROP`，以便不发送任何拒绝消息。因此，选项\
  \ C 是要使用的正确 `iptables` 命令。选项 A 中的命令将对 `INPUT` 链中没有规则的所有入站数据包策略设置为 `DROP`，但它并没有针对\
  \ `ping` 数据包。因此，选项 A 是错误答案。选项 B 中的命令将发送拒绝消息，这不是我们想要的，所以它也是错误答案。选项 D 中的命令尝试删除规则而不是添加规则。因此，选项\
  \ D 是错误选择。选项 E 中的命令修改的是 `OUTPUT` 链而不是 `INPUT` 链，这将影响出站网络数据包。因此，选项 E 是错误选择。\n\n###\
  \ 7. D.\n`sudo ufw status numbered` 命令将显示 `ufw` 防火墙的 ACL 规则及其关联编号。因此，选项 D 是正确答案。选项\
  \ A 是虚构的，所以是错误答案。选项 B 和 C 会显示任何规则，但不会包含编号，因此这些选项是错误答案。选项 E 中的 UFW 命令启用了防火墙但不显示 ACL\
  \ 规则，因此它也是错误选择。\n\n### 8. A.\n虽然所有选项都使用了简单的语法，但选项 A 中的 `ufw` 命令将阻塞所有入站和出站 OpenSSH\
  \ 连接，且不发送阻塞（拒绝）消息。因此，选项 A 是正确答案。`ufw` 命令中没有 `drop` 参数，所以选项 B 是错误答案。选项 C 中的命令将发送拒绝消息。因此它是一个错误选择。选项\
  \ D 中的命令将允许 OpenSSH 连接，因此它是一个错误答案。`ufw` 命令中没有 `block` 参数，所以选项 E 也是错误选择。\n\n### 9.\
  \ A, B.\n选项 A 和 B 是关于 `DenyHosts` 和 `Fail2ban` 的正确陈述。`DenyHosts` 仅适用于 OpenSSH 流量，而\
  \ `Fail2ban` 可以处理许多类型的流量。所以选项 C 是错误答案。`Fail2ban` 的配置文件名为 `/etc/fail2ban/jail.conf`，而不是\
  \ `DenyHosts`。因此，选项 D 也是错误答案。`DenyHosts` 只能配合 TCP Wrappers 工作，而 `Fail2ban` 可以配合\
  \ `iptables`、TCP Wrappers、`firewalld` 等。因此，选项 E 是错误选择。\n\n### 10. E.\n选项 E 中的命令将把新\
  \ IP 地址正确地添加到 `BlockThem` IPset 中。因此，它是正确答案。选项 A 和 B 中的命令创建了 IPset 而没有向其添加新地址。因此，这些选项是错误答案。选项\
  \ C 中的命令将当前 IPset 配置保存到 IPset 配置文件中。虽然这是 Potts 女士在添加新地址后应该做的，但它不是当前需要的命令。因此，选项 C\
  \ 是错误答案。选项 D 中的命令将整个子网的地址添加到 IPset 中，而不是单个 IP 地址。因此它也是错误答案。\n\n# 第 19 章：拥抱最佳安全实践\n\
  \n### 1. B.\nKerberos 认证方法使用票据授予系统在身份验证后为用户账户分配票据。网络上使用 Kerberos 的任何服务器都可以使用该票据验证用户账户。因此，选项\
  \ B 是正确的。LDAP、RADIUS 和 TACACS+ 认证方法不使用票据进行用户验证，所以选项 A、C 和 D 都是错误的。生物识别认证方法使用用户的物理特征来验证用户账户，但不发放票据来允许单点登录，所以选项\
  \ E 是错误的。\n\n### 2. C.\n生物识别利用用户的物理特征在 Linux 系统上对其进行身份验证，所以选项 C 是正确的。LDAP 和 Kerberos\
  \ 只是单因子认证方法，所以选项 A 和 E 是错误的。令牌（Tokens）和 PKI 都是双因子认证方法，但它们使用数字令牌而不是物理特征进行验证，所以选项\
  \ B 和 D 是错误的。\n\n### 3. A.\nLDAP 认证方法允许管理员创建一个分布式数据库，该数据库不仅验证用户账户，还能跟踪用户对网络资源的授权，所以选项\
  \ A 是正确的。Kerberos 和 RADIUS 认证方法不使用分布式数据库，也不能授权用户访问网络资源，所以选项 B 和 D 是错误的。令牌和 PKI 是双因子认证方法，不使用分布式数据库，也不授权用户访问网络资源，所以选项\
  \ C 和 E 是错误的。\n\n### 4. E.\n当您指定 `nologin` 工具为用户账户的默认 shell 时，用户在成功登录后将收到一条消息，他们他们被允许访问系统，所以选项\
  \ E 是正确的。生物识别、令牌和 Kerberos 不能防止 root 用户账户登录的认证方法，所以选项 A、B 和 C 都是错误的。从 `/etc/passwd`\
  \ 文件中删除 root 用户账户将从系统中删除 root 用户，这将破坏需要 root 用户运行的应用程序，因此选项 D 是错误的。\n\n### 5. B.\n\
  在 Linux 系统上，所有用户数据通常存储在 `/home` 目录结构，因此将 `/home` 目录放在单独的分区可以将用户数据与系统数据分离，使得选项 B\
  \ 是正确的。`/usr`、`/etc`、`/sbin` 和 `/bin` 目录包含系统数据而不是用户数据，所以选项 A、C、D 和 E 都是错误的。\n\n\n\
  \n\n6. D. `chroot` 程序将应用程序限制在虚拟文件系统结构中的特定区域，因此选项 D 是正确的。阻止应用程序的网络端口将防止访客连接到应用程序，因此选项\
  \ A 是错误的。将应用程序移动到私有端口号不会限制对目录的访问，因此选项 B 是错误的。将应用程序放置在加密分区或单独分区上不会阻止应用程序访问应用程序之外的数据，因此选项\
  \ C 和 E 是错误的。\n\n7. A. Linux 统一密钥设置 (LUKS) 功能提供磁盘级加密，使得存储在分区中的所有文件在写入时自动加密，在读取时自动解密，因此选项\
  \ A 是正确的。`chroot` 实用将应用程序限制在虚拟文件系统中的特定位置，但不会加密文件，因此选项 B 是错误的。`auditd` 实用创建系统活动的详细日志（例如用户文件访问），但不会加密文件或磁盘，因此选项\
  \ D 是错误的。PKI 和 Kerberos 都是身份验证方法，而不是磁盘加密方法，因此选项 D 和 E 都是错误的。\n\n8. C. `/etc/cron.deny`\
  \ 文件是一个被禁止调度作业的用户账户列表，因此将用户添加到该文件中将阻止他们调度作业，使得选项 C 是正确的。`chroot` 程序将应用程序限制在虚拟文件系统中的特定位置，它不会阻止用户调度作业，因此选项\
  \ A 是错误的。`nologin` 程序防止用户账户登录系统，这是解决问题的一种极端方案，因此选项 B 不是一个好的解决方案。`/etc/hosts.deny`\
  \ 文件阻止主机访问系统而不是阻止用户调度作业，因此选项 D 是错误的。`/etc/motd` 文件在用户登录系统时向所有用户显示消息，但不会阻止他们调度作业，因此选项\
  \ E 是错误的。\n\n9. D. 威慑攻击者的最快方法是将 IP 地址放置在 `/etc/hosts.deny`文件中，防止其访问系统，因此选项 D 是正确的。将应用程序放入\
  \ chroot 监狱（chroot jail）可以防止应用程序访问监狱文件系统之外的文件，但不能阻止攻击者继续访问用户账户，因此选项 A 是错误的。在用户账户中添加\
  \ `nologin` shell 将阻止攻击者访问该用户账户，但也会阻止合法用户访问账户，因此选项 B 是错误的。实施双因子身份验证将有助于停止攻击者，但这不是快速解决方案，因此选项\
  \ C 是错误的。将用户账户添加到 `/etc/cron.deny` 文件中防止用户账户调度作业，但不能阻止攻击者尝试以该用户身份登录，因此选项 E 是错误的。\n\
  \n10. E. 虽然这看起来很极端，但移除 FTP 客户端和服务器应用程序软件可以防止意外使用不安全的协议，因此选项 E 是正确的。在 `/etc/motd`\
  \ 文件中放置消息并在用户登录时显示并无法阻止他们使用 FTP 服务，因此选项 A 是错误的。将 FTP 应用程序移动到不同的网络端口可能会临时解决问题，但一旦用户找到了替代端口，他们就可以继续使用\
  \ FTP，因此选项 B 是错误的。`/etc/hosts.deny` 文件包含要阻止的远程主机的 IP 地址或主机名，而不是用户账户，因此选项 C 是错误的。`/etc/cron.deny`\
  \ 文件阻止用户调度作业，而不是访问网络应用程序，因此选项 D 是错误的。\n\n## 第 20 章：分析系统属性与修复\n\n1. B, C. 网络套字是网络连接两个端点中的单个端点。该端点位于本地系统上，绑定到特定端口，并使用\
  \ IP 地址和端口号的组合。因此，选项 B 和 C 是正确答案。端口使用数字来标识哪个服务或应用程序正在传输数据，因此选项 A 是错误答案。Unix 套字是本地系统中进程之间的端点，比\
  \ localhost 提供了更好的进程间通信。因此，选项 D 和 E 是错误选择。\n\n2. A, B, E. `iperf`、`ping` 和 `traceroute`\
  \ 实用程序将帮助测试网络是否存在高延迟（慢速）以确定原因。因此，选项 A、B 和 E 是正确答案。`ip neigh` 命令用于检查路由表，通常用于重复或错误的\
  \ MAC 地址导致本地网段出现问题的情况。因此，选项 C 是错误答案。`dig` 实用程序检查名称服务器解析，而不是高延迟。因此，选项 D 也是错误选择。\n\
  \n3. A, D, E. `mtr`、`tracepath` 和 `traceroute` 实用程序都允许 Scott 先生查看通过某些网络网段的路由器包，并隔离哪些路由器可能会丢包。因此，选项\
  \ A、D 和 E 是正确答案。`ifconfig` 工具用于查看和配置网络适配器。因此，选项 B 是错误答案。`ethtool -s` 命令将显示适配器统计数据而不是路由器信息，因此选项\
  \ C 也是错误选择。\n\n4. D. `nslookup` 实用程序可以配合 `time` 命令测试新的名称服务器，以查看它们是否更高效（更快）。因此，选项\
  \ D 是正确答案。选项 A 的 `dnsmasq` 是仅缓存的名称服务器软件，因此是错误答案。`whois` 实用程序执行 Whois 服务器的查询，而不是名称服务器。因此，选项\
  \ B 是错误答案。`nmap` 实用程序用于网络映射和分析（或渗透测试），因此选项 C 是错误选择。`ipset list` 命令显示系统上的各种 IPsets，但未参与名称解析。因此，选项\
  \ E 是错误选择。\n\n5. A. `iostat` 命令显示 I/O 等待（I/O wait），这是一个显示处理器必须等待磁盘 I/O 耗的性能统计数据。因此，选项\
  \ A 是正确答案。`ioping` 实用程序更多用于测试新磁盘的性能项，如磁盘 I/O 延迟、寻道率、顺序速度等。因此，选项 B 是错误答案。`du` 和 `df`\
  \ 命令对于磁盘空间问题很有用，但不提供 I/O 等待统计数据。因此，选项 C 和 D 是错误答案。`iotop` 实用程序有助于定位导致高 I/O 的应用程序或进程，而不是由于高\
  \ I/O 导致的 CPU 延迟。因此，选项 E 也是错误答案。\n\n6. B. `deadline` I/O 调度器适用于增加数据库 I/O 并总体减少 I/O\
  \ 延迟、或使用 SSD、以及或在使用实时应用程序的情况。因此，选项 B 是正确答案。选项 A 是 I/O 调度器配置文件名，因此是错误答案。选项 C 是包含\
  \ I/O 调度器配置文件的子目录之一，例如 `/sys/block/sdc/queue/`。因此，选项 C 也是错误答案。`cfq` 调度器最适用于需要更平衡\
  \ I/O 处理和或系统具有多处理器的情况。因此，选项 D 是错误答案。`noop` I/O 调度器适用于使用 SSD 但不需要少量 CPU 的。因此，选项 E\
  \ 是错误选择。\n\n7. A, B, D. `uptime` 命令显示 1、5 和 15 分钟增量的 CPU 负载平均值。因此，选项 A、B 和 D 是正确答案。选项\
  \ C 和 E 是错误选择。\n\n\n\n\n### 8. C. `sar` 工具是查看系统处理器随时间变化的性能的最佳工具。它使用由 `sadc` 程序在\
  \ `/var/log/sa/` 目录中存储的数据，该目录包含多一个月的数据。因此，选项 C 是正确答案。`uptime` 工具虽然方便查看处理器性能，但查看其随时间的变化时\
  \ `sar` 更好。因此，选项 A 是错误答案。`sysstat` 是提供 `sar` 工具的包，因此，选项 B 是错误答案。`/proc/cpuinfo`\
  \ 文件包含详细的处理器信息，但它不是查看 CPU 性能的最佳选择。因此，选项 D 也是错误选择。`sysctl` 工具用于查看或调整内核参数。因此，选项 E\
  \ 是错误选择。\n\n### 9. E. `swapon -s` 命令将允许 Gertie 查看交换空间元素的类型、名称和优先级。因此，选项 E 是正确答案。`vmstat`\
  \ 工具提供了大量的内存统计信息，包括特定于交换的磁盘 I/O 以及进入设备的总块和出块。然而，它没有提供 Gertie 所需的信息，因此选项 A 是错误答案。`free`\
  \ 命令显示内存项，如空闲内存、使用内存和缓冲区/缓存使用。因此，选项 B 是错误答案。`fstab` 不是命令而是一个文件。该文件是交换分区/文件必须具有记录的地方，以便交换空间在重启后保持持久。因此，选项\
  \ C 是错误选择。`swapoff` 工具将分区/文件从交换空间中解除，因此，选项 D 是错误选择。\n\n### 10. E. 在此场景中，由于已经存在多个交换空间，且唯一的交换分区或文件位于逻辑卷上，Elliot\
  \ 应该使用 LVM 工具增加逻辑卷来添加更多交换空间。因此，选项 E 是正确答案。虽然在扩展逻辑卷后需要对其使用 `mkswap` 和 `swapon`，但选项\
  \ A、B、C 和 D 是在文件或分区上使用这些工具，而不是逻辑卷。因此，这些选项是错误选择。\n\n## 第 21 章：优化性能\n\n### 1. A, C,\
  \ D. Linux 中的 GNU `ps` 命令支持旧版 BSD 和 Unix `ps` 命令支持的参数，以及 GNU 创建的新选项，因此选项 A、C 和 D\
  \ 是正确的。`ps` 命令没有使用 Linux 风格的选项，因此选项 B 是错误的。`ps` 命令不支持数字选项，因此选项 E 也是错误的。\n\n### 2.\
  \ B. GNU `ps` 命令的 Unix 风格命令行选项通过在选项前加单个横杠来识别，因此选项 B 是正确的。较新的 GNU 选项通过使用双横杠识别，因此选项\
  \ A 是错误的。旧版 BSD 风格选项通过不在选项字母前加任何内容来识别，因此选项 C 是错误的。Unix 风格选项仍然使用字母，而不是十进制或十六进制，因此选项\
  \ D 和 E 都是错误的。\n\n### 3. D. 在没有命令行选项的情况下，GNU `ps` 命令仅显示由当前 shell 运行的进程，因此选项 D 是正确的。要显示运行在特定终端上的所有进程，需要添加\
  \ `-t`选项，因此选项 A 是错误的。要显示所有活动进程，必须添加 `-A` ，因此选项 B 是错误的。要显示睡眠进程，需要使用 `-ef` ，因此 C 是错误的。要显示当前用户账户运行的所有进程，需要添加\
  \ `-x` ，因此选项 E 是错误的。\n\n### 4. A. `top` 命令显示系统上当前运行的进程并每 3 秒更新一次，因此选项 A 是正确的。`ps`\
  \ 命令显示当前运行的进程但不实时更新，因此选项 B 是错误的。`lsof` 命令显示进程当前打开的文件，而不是进程本身，因此选项 C 是错误的。`pkill`\
  \ 和 `kill` 命令用于停止运行的进程，而不是显示它们，因此选项 D 和 E 都是错误的。\n\n### 5. E. `S` 命令根据每个进程的累积 CPU\
  \ 时间显示进程，因此选项 E 是正确的。`l` 命令根据负载负载显示进程，因此选项 A 是错误的。`F` 命令允许你选择用于排序排序的字段，因此选项 B 是错误的。`r`\
  \ 命令反转显示的排序顺序，因此选项 C 是错误的。`y` 命令高亮运行中的任务，因此选项 D 是错误的。\n\n### 6. B. `top` 输出中的 `RES`\
  \ 列显示应用程序使用的物理内存量，因此选项 B 是正确的。`VIRT` 列显示虚拟内存量，而不是物理内存，因此选项 A 是错误的。`SHR` 列显示使用的共享内存量，因此选项\
  \ C 是错误的。`S` 列显示应用程序进程的状态，因此选项 D 是错误的。`%MEM` 列显示应用程序使用的物理内存百分比，而不是物理内存的量，因此选项 E\
  \ 是错误的。\n\n### 7. C. `nice` 命令允许你为应用程序指定优先级，因此选项 B 是正确的。`renice` 命令允许你更改已运行应用程序的优先级，但不能更改尚未启动的程序，因此选项\
  \ A 是错误的。`pkill` 和 `kill` 命令用于停止运行的进程，而不是更改它们的优先级，因此选项 B 和 D 是错误的。`pgrep` 命令显示匹配搜索词的应用程序进程；它不会更改进程的优先级，因此选项\
  \ E 是错误的。\n\n### 8. A. `renice` 命令允许你更改分配给系统中已运行应用程序的优先级，因此选项 A 是正确的。`pkill` 和 `kill`\
