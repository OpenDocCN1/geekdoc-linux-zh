  \    5. `LC_COLLATE`\n\n10. __________ 决定了特定位置相对于 UTC 时间的时间。\n    1. time zone (时区)\n\
  \    2. localization (本地化)\n    3. character set (字符集)\n    4. locale (区域设置)\n \
  \   5. hardware clock (硬件时钟)\n\n11. 哪些 Linux 命令允许你从物理工作站或服务器获取时间？选择两个）\n    1. `date`\n\
  \    2. `hwclock`\n    3. `time`\n    4. `locale`\n    5. `timedatectl`\n\n12. 基于\
  \ Red Hat 的系统使用哪个文件定义 Linux 系统的时区？\n    1. `/etc/localtime`\n    2. `/etc/timezone`\n\
  \    3. `/usr/share/zoneinfo`\n    4. `/usr/share/timezone`\n    5. `/usr/share/localtime`\n\
  \n13. 哪个文件夹包含 Linux 支持的每个时区的模板文件？\n    1. `/etc/localtime`\n    2. `/usr/share/zoneinfo`\n\
  \    3. `/etc/timezone`\n    4. `$HOME`\n    5. `/usr/share/timezone`\n\n14. 哪个命令显示当前日期、系统时间、硬件时间和时区？\n\
  \    1. `date`\n    2. `timedatectl`\n    3. `time`\n    4. `hwclock`\n    5. `localectl`\n\
  \n15. 你使用哪个命令使用特定的输出格式显示当前时间和日期？\n    1. `date`\n    2. `time`\n    3. `timedatectl`\n\
  \    4. `localectl`\n    5. `hwclock`\n\n16. 哪些命令允许你设置工作站的时间？（选择两个）\n    1. `hwclock`\n\
  \    2. `date`\n    3. `time`\n    4. `timedatectl`\n    5. `localectl`\n\n17. 基于\
  \ Hat 的系统利用哪个网络包与服务器同步时间？\n    1. `ntpd`\n    2. `chrony`\n    3. `localectl`\n\
  \    4. `timedatectl`\n    5. `timesyncd`\n\n18. 哪个环境变量可以临时更改时区？\n    1. `LANG`\n\
  \    2. `LC_MONETARY`\n    3. `LC_NUMBER`\n    4. `LC_ALL`\n    5. `TZ`\n\n19. 哪个字符集已经取代\
  \ ASCII 默认字符集？\n    1. Unicode\n    2. UTF-16\n    3. UTF-8\n    4. UTF-32\n   \
  \ 5. locale\n\n20. 哪个命令列出你系统中安装的所有本地化设置？\n    1. `timedctl`\n    2. `localectl`\n\
  \    3. `locale`\n    4. `LANG`\n    5. `LC_ALL`\n\n\n\n\n此配置文件中的指令控制着密码长度、用户需要更改账户密码的时间、默认是否创建主目录等。该文件通常充满了注释和被注释掉的指令（这会使指令失效）。列表\
  \ 10.1 中的`UID_MIN` 指令。`用户标识符 (UID)` 是 Linux 用于识别用户账户的数字。`用户账户`（有时称为`普通账户`）是任何授权给授权的人类以访问系统、拥有适当的凭据并执行日常任务的账户。虽然人类使用账户名，但\
  \ Linux 使用 UID。`UID_MIN` 表示允许用户账户的最低 UID。在列表 10.1 中的片段所示。\n\n一些对普通用户账户创建至关重要的额外指令在表\
  \ 10.1 中进行了简要介绍。\n\n| 名称 | 描述 |\n| --- | --- |\n| `PASS_MAX_DAYS` | 更改密码所需的天数。这是密码的过期日期。\
  \ |\n| `PASS_MIN_DAYS` | 密码更改后到再次更改密码之间的天数。 |\n| `PASS_MIN_LENGTH` | 密码所需的最小字符数。\
  \ |\n| `PASS_WARN_AGE` | 在密码过期前向用户发出警告的天数。 |\n| `CREATE_HOME` | 默认为 `no`。如果设置为 `yes`，则创建用户账户主目录。\
  \ |\n| `ENCRYPT_METHOD` | 用于哈希账户密码的方法。 |\n\n表 10.1 几个关键的 `/etc/login.defs` 指令\n\n\
  `/etc/login.defs` 文件仅是用于用户账户过程创建侧的配置文件之一。另一个文件将在接下来介绍。\n\n### `/etc/default/useradd`\
  \ 文件\n\n`/etc/default/useradd` 文件是另一个指导创建账户过程的配置文件。它通常比 `/etc/login.defs` 文件短得多。Rocky\
  \ Linux 发行版的示例在列表 10.3 中所示。\n\n注意列表 10.3 中显示此文件中活动指令有两种不同的方法。你可以使用 `cat` 命令或调用 `useradd\
  \ -D` 命令。两者的用法同样简单。关于 `useradd -D` 命令的一个酷的事实是，你可以用它来修改 `/etc/default/useradd` 文件中的指令。\n\
  \n在列表 10.3 中，注意 `HOME` 指令。它目前设置为 `/home`，这意味着任何新创建的用户账户的目录都将位于 `/home` 目录内。请记住，如果在\
  \ `/etc/login.defs` 文件中未设置 `CREATE_HOME` 或将其设置为 `no`，则默认*不会*创建主目录。\n\n一些对普通用户账户创建至关重要的额外指令在表\
  \ 10.2 中进行了简要介绍。\n\n| 名称 | 描述 |\n| --- | --- |\n| `HOME` | 用户账户目录的基础目录。 |\n| `INACTIVE`\
  \ | 密码过期后未更改直到账户被禁用的天数。参见表 10.1 中的 `PASS_MAX_DAYS`。 |\n| `SKEL` | 骨架目录。 |\n| `SHELL`\
  \ | 用户账户默认的 shell 程序。 |\n\n表 10.2 几个关键的 `/etc/default/useradd` 指令\n\n`SHELL` 指令需要更多的解释。通常它被设置为\
  \ `/bin/bash`，这意味着当您访问命令行时，您的用户进程正在运行 `/bin/bash` shell 程序。该程序为您提供命令行行的提示符，并处理您那里输入的任何命令。\n\
  \n### `/etc/skel/` 目录\n\n`/etc/skel` 目录，或者通常被称为`骨架目录`（参见表 10.2），包含文件。如果为用户创建了主目录，则在创建账户时，这些文件将被复制到用户账户的主目录。列表\
  \ 10.4 显示了 Rocky 9 Workstation 发行版中 `/etc/skel`目录中的文件。\n\n在列表 10.4 中，使用了带有 `-a`\
  \ 选项的 `ls` 命令以便显示隐藏文件（以点开头的文件）。记得，如果不使用 `ls` 命令的 `-a` 选项，隐藏文件通常不会显示。\n\n既然我已经涵盖了创建侧的文件，让我们来看看作为过程一部分被构建或修改的文件和目录。\n\
  \n### `/etc/passwd` 文件\n\n账户信息存储在 `/etc/passwd` 文件中。每个账户的数据占用文件中的单行。当创建账户时，会在 `/etc/passwd`\
  \ 文件中为该账户添加新记录。片段示例在列表 10.5 中所示。\n\n`/etc/passwd` 记录包含几个字段。记录中的每个字段由冒号（`:`）分隔。总共有七个字段，如表\
  \ 10.3 所示。\n\n| 字段编号 | 描述 |\n| --- | --- |\n| 1 | 用户账户的用户名。 |\n| 2 | 密码字段。通常此文件不再用于存储密码。此字段中的\
  \ `x` 表示密码存储在 `/etc/shadow` 文件。 |\n| 3 | 用户账户的用户标识符 (UID)。 |\n| 4 | 用户账户的组标识符 (GID)。\
  \ |\n| 5 | 注释字段。此字段是可选的。传统上包含用户的全名。 |\n| 6 | 用户账户的主目录。 |\n| 7 | 用户账户的默认 shell。如果设置为\
  \ `/sbin/nologin` 或 `/bin/false`，则用户无法交互式登录系统。 |\n\n表 10.3 `/etc/passwd` 文件的记录字段\n\
  \n\n\n\n\n你可能注意到，在 `/etc/password` 记录中，第 7 字段可能包含 `/sbin/nologin` 或 `/bin/false`\
  \ 默认 shell。这是为了防止账户交互式地登录系统。`/sbin/nologin` 通常用于系统服务账户记录。系统服务（守护进程）确实需要系统账户，但它们不需要交互式登录。相反，它们在自己的账户名下后台运行。如果恶意人员尝试使用该账户交互式登录（假设他们绕过了其他限制，你稍后会学习），他们会被礼貌地踢出系统。基本上，`/sbin/nologin`\
  \ 在你到达命令提示符之前显示一条简短的消息并让你注销。如果需要，你可以通过创建 `/etc/nologin.txt` 文件并添加所需的文本来修改显示的消息。\n\
  \n`/bin/false` shell 则稍微粗暴一点。如果将其设置为用户账户的默认 shell，则不会显示任何消息，用户将直接被登出系统。\n\n## `/etc/shadow`\
  \ 文件\n\n在创建账户时，另一个会被更新的文件是 `/etc/shadow` 文件。它包含了账户密码的信息，即使你尚未为该账户提供密码也是如此。与 `/etc/passwd`\
  \ 文件一样，每个账户的数据占据文件的一行。代码列表 10.6 显示了一个截取示例。\n\n`/etc/shadow` 记录包含多个字段。记录中的每个字段由冒号（`:`）分隔。总共有九个字段，描述在\
  \ 表 10.4 中。\n\n| 字段编号 | 描述 |\n| --- | --- |\n| 1 | 用户账户的用户名。 |\n| 2 | 密码字段。密码是经过加盐哈希处理的密码。`!!`\
  \ 或 `!` 表示账户未设置密码。`!` 或 `*` 表示该账户无法使用密码登录。密码前的 `!` 表示账户已被锁定。 |\n| 3 | 上次更改密码的 Unix\
  \ Epoch 时间（天数）格式。 |\n| 4 | 更改密码后到可以再次更改密码的天数。 |\n| 5 | 必须更改密码的天数。这是密码的过期日期。 |\n\
  | 6 | 密码过期前向用户发出警告的天数。（参见字段 #5。） |\n| 7 | 密码过期后（参见字段 #5）且未更改密码直到账户被停用的天数。 |\n| 8\
  \ | 账户过期的日期 Unix Epoch 时间（天数）格式。 |\n| 9 | 称为特殊标记。这是一个留作未来特殊用途的字段，目前未使用，且为空。 |\n\n\
  表 10.4 `/etc/shadow` 文件的记录字段\n\n注意字段 #1 是账户的用户名。这是唯一与 `/etc/passwd` 文件共享的字段。\n\n\
  理解不同的可能过期情况至关重要。当发生密码过期时，会有一个宽限期。用户将有若干天数（在字段 #7 中指定）可以使用旧密码登录账户，但必须立即更改密码。然而，如果密码过期且用户没有及时登录系统，则该用户将实际上被锁定在系统之外。\n\
  \n对于账户过期，没有宽限期。账户过期后，用户无法使用其密码登录账户。\n\n你可能注意到我还没有介绍 `/etc/group` 文件。它确实作为账户创建过程的一部分被修改。不过，该讨论留到了本章后面的“管理组”部分。\n\
  \n## 账户创建过程\n\n发行版在用户账户方面的配置往往差异很大。因此，在你使用 `useradd` 工具创建账户之前，明智之是查看每个发行版用户账户配置文件的某些指令（参见\
  \ 表 10.1 和 10.2）。在 代码列表 10.7 中，在 Rocky Linux 发行版上检查了 `CREATE_HOME` 和 `SHELL` 指令。\n\
  \n你可以看到在这个 Rocky Linux 发行版上，默认将创建主目录，因为 `CREATE_HOME` 被设置为 `yes`。`SHELL` 指令指向 Bash\
  \ shell，`/bin/bash`，这是大多数交互式用户账户的典型 shell。\n\n如前所述，`useradd` 命令大多数发行版上创建用户账户的主要工具。在\
  \ Rocky Linux 发行版上使用 `useradd` 工具创建账户见 代码列表 10.8。\n\n由于我在 代码列表 10.8 中使用的 Rocky Linux\
  \ 发行版将 `CREATE_HOME` 指令设置为 `yes` 且 `SHELL` 设置为 `/bin/bash`，因此不需要使用任何 `useradd` 命令选项。唯一需要的参数是用户账户名，即\
  \ `DAdams`。在使用工具在 代码列表 10.8 中创建账户后，注意 `/etc/passwd` 和 `/etc/shadow` 文件中现在都存在新用户账户的记录。此外，还创建了一个目录\
  \ `/home/DAdams`，其中包含了来自 `/etc/skel/` 目录的文件。此时请记住，`DAdams` 账户尚未添加密码，因此其在 `/etc/shadow`\
  \ 文件中的记录在密码字段显示 `!!`。\n\n现在让我们来看看在不同的 Linux 发行版上创建账户。Ubuntu 桌面发行版的处理方式略有不同。在 代码列表\
  \ 10.9 中，你可以看到 `CREATE_HOME` 未设置，所以它默认为 `no`。\n\n同样在 代码列表 10.9 中，注意 `SHELL` 指令设置为\
  \ `/bin/sh` 而不是 Bash shell。这意味着当你创建一个交互式用户账户时，如果需要，你需要指定 Bash shell。\n\n因此，在这个 Ubuntu\
  \ 发行版上创建用户账户时，如果你希望账户拥有主目录并使用 Bash shell，你将需要使用额外的 `useradd` 命令选项。`useradd` 工具具有许多满足各种需求的有用选项，最常见的选项列在\
  \ 表 10.5 中。\n\n| 短格式 | 长格式 | 描述 |\n| --- | --- | --- |\n| `-c` | `--comment` | 注释字段内容。传统上包含用户的全名。可选。\
  \ |\n| `-d` | `--home` 或`--home-dir` | 用户主目录指定。默认操作由 `HOME` 和 `CREATE_HOME` 指令设置。\
  \ |\n| `-D` | `--defaults` | 显示 `/etc/default/useradd` 指令。 |\n| `-e` | `--expiredate`\
  \ | `YYYY-MM-DD` 格式的账户过期日期。默认操作由 `EXPIRE` 指令设置。 |\n| `-f` | `--inactive` | 密码过期后未更改直到账户被停用的天数。`-1`\
  \ 表示账户永停用。默认操作由 `INACTIVE` 指令设置。 |\n| `-g` | `--gid` | 用户登录系统时激活的账户组（默认组）。 |\n|\
  \ `-G` | `--groups` | 账户的额外组成员。 |\n| `-m` | `--create-home` | 如果不存在，则创建用户账户的主目录。默认操作由\
  \ `CREATE_HOME` 指令设置。 |\n| `-M` | N/A 或`--no-create-home` | 不创建用户账户的主目录。默认操作由 `CREATE_HOME`\
  \ 指令设置。 |\n| `-s` | `--shell` | 账户的 shell。默认操作由 `SHELL` 指令设置。 |\n| `-u` | `--uid`\
  \ | 账户的用户标识符 (UID) 数字。 |\n| `-r` | `--system` | 创建系统账户而非用户账户。 |\n\n表 10.5 `useradd`\
  \ 命令的常用选项\n\n我们需要使用 表 10.5 中的一些选项在 Ubuntu 桌面发行版上创建用户账户。示例见 代码列表 10.10。\n\n\n\n\n\
  \n注意看列表 10.10，在在使用 `useradd` 命令时使用了三个选项。由于此系统没有设置 `CREATE_HOME` 指令，因此需要 `-m` 选项来强制\
  \ `useradd` 为账户创建家目录。`-d` 关指定目录名称为 `/home/JKirk`。由于该系统的 `SHELL` 指令被设置为 `/bin/sh`，因此需要\
  \ `-s` 选项将账户的默认 shell 设置为 `/bin/bash`。\n\n在使用该实用程序在列表 10.10 中创建账户后，注意 `/etc/passwd`\
  \ 和 `/etc/shadow` 文件中现在存在新用户账户的记录。此外，还创建了一个目录 `/home/JKirk`，其中包含了该发行版 `/etc/skel/`\
  \ 目录中的文件。请记住，此时 `JKirk` 账户尚未添加密码，因此它在 `/etc/shadow` 文件中的记录在密码字段显示为 `!`（注意 Debian\
  \ 使用单个感叹号，而 Red Hat 使用双感叹号）。\n\n另一种查看 `/etc/passwd` 和 `/etc/shadow` 文件中账户记录的方法是通过\
  \ `getent` 实用程序。对于此程序，你只需传递文件名，然后加上想要查看记录的账户名。该命令用于列表 10.11 中查看在列表 10.10 中创建的账户。\n\
  \n注意看列表 10.11，当未使用超级用户权限通过 `getent` 处理 `shadow` 文件时，将不会返回任何内容。这是因为 `getent` 尊重 `/etc/shadow`\
  \ 文件的安全设置。\n\n在创建账户时，你可以通过 `crypt` 实用程序创建密码，然后在通过 `useradd` 实用程序的 `-p` 选项创建账户时将其添加。然而，这样做不仅繁琐，而且被认为是一种坏做法。在下一节中，我们将介绍正确地创建和管理账户密码。\n\
  \n### 维护密码\n\n当你首次创建一个交互式账户时，应该立即使用 `passwd` 实用程序为该账户创建一个密码。在列表 10.12 中，为 Rocky\
  \ Linux 系统上的新 `DAdams` 账户创建了密码。\n\n你也可以使用 `passwd` 实用程序更新特定用户的密码，并将用户的账户名作为参数传递，类似于列表\
  \ 10.12 中所示。如果你需要更新自己的账户密码，只需输入不带额外命令参数的 `passwd` 即可。\n\n使用 `passwd` 实用程序不仅限于设置和修改密码。你还可以锁定或解锁账户、设置账户密码过期、删除账户密码等。表\
  \ 10.6 显示了更常用的 `passwd` 选项；所有这些选项都需要超级用户权限。\n\n| 短选项 | 长选项 | 描述 |\n| --- | --- |\
  \ --- |\n| `-d` | `--delete` | 账户密码。 |\n| `-e` | `--expire` | 设置账户密码为过期。用户必须在下次登录时更改账户密码。\
  \ |\n| `-i` | `--inactive` | 设置密码过期后未更改的持续数，在此之后账户将被停用。 |\n| `-l` | `--lock` | 在\
  \ `/etc/shadow` 文件的账户密码前放置一个感叹号 (`!`)，有效防止用户使用该账户密码登录系统。 |\n| `-n` | `--minimum`\
  \ | 设置密码更改后可以再次更改密码所需的天数。 |\n| `-S` | `--status` | 显示账户的密码状态。 |\n| `-u` | `--unlock`\
  \ | 移除 `/etc/shadow` 文件中账户密码前放置的感叹号 (`!`)。 |\n| `-w` | `--warning` 或 `--warndays`\
  \ | 设置在密码过期前向用户发出警告的天数。 |\n| `-x` | `--maximum` 或 `--maxdays` | 设置需要更改密码所需的天数。这是密码的过期日期。\
  \ |\n\n表 10.6 `passwd` 命令常用的选项\n\n表 10.6 中的一个选项需要更多的解释，那就是 `-S` 选项。示例在列表 10.13 中显示。\n\
  \n在列表 10.13 中，显示了 `DAdams` 账户的密码状态。状态包含账户密码的状态，可以是可用密码 (`P`)、无密码 (`NP`) 或已锁定密码 (`L`)。在密码状态之后显示最后一次更改密码的日期，然后是密码的最小、最大、警告和非活动设置。括号内显示了额外的状态，包括是否设置了密码以及用于保护它的哈希算法。\n\
  \n你也可以使用 `chage` 实用程序显示类似的密码信息，但格式更符合人类阅读习惯，如列表 10.14 所示。\n\n`chage` 程序也可以修改密码设置。你可以选择使用各种命令选项（详情请参阅其帮助页），或以交互方式使用\
  \ `chage` 实用程序，如列表 10.15 所示。\n\n注意看列表 10.15，密码过期警告被设置为 15 天。如果你的公司允许两周的休假，这是一个很好的设置。\n\
  \n### 修改账户\n\n用于修改账户的实用程序是 `usermod` 程序。与 `passwd` 命令类似，你可以锁定和解锁账户，如列表 10.16 所示。\n\
  \n注意看列表 10.16，使用 `usermod -L` 命令来锁定 `DAdams` 账户。`passwd -S` 命令显示密码状态为 `LK`，表示它已锁定。在列表\
  \ 10.16 中，截取的 `getent` 实用程序输出显示，在 `DAdams` 账户密码前放置了感叹号 (`!`)，这导致了账户被锁定。随后通过 `usermod\
  \ -U` 命令移除锁定，并重新检查状态。\n\n你可以通过 `usermod` 实用程序的开关对账户进行许多修改。常用选项在表 10.7 中。\n\n| 短选项\
  \ | 长选项 | 描述 |\n| --- | --- | --- |\n| `-c` | `--comment` | 修改注释字段。 |\n| `-d` |\
  \ `--home` | 设置新的用户目录。配合 `-m` 选项将当前目录移动到新位置。 |\n| `-e` | `--expiredate` | 修改账户过期日期。使用\
  \ `YYYY-MM-DD` 格式。 |\n| `-f` | `--inactive` | 设置密码过期后未更改账户将被停用的天数。`-1` 表示账户永不停用。\
  \ |\n| `-g` | `--gid` | 修改账户的默认组身份。 |\n| `-G` | `--groups` | 更新账户的附加组成员。如果仅指定新组，请使用\
  \ `-a` 选项以避免移除其他组成员。 |\n| `-l` | `--login` | 将账户名修改为指定的名称。不修改家目录。 |\n| `-L` | `--lock`\
  \ | 通过在 `/etc/shadow` 文件的账户密码前放置感叹号来锁定账户。 |\n| `-s` | `--shell` | 修改账户的 shell。 |\n\
  | `-u` | `--uid` | 修改账户的用户标识符 (UID) 数字。 |\n| `-U` | `--unlock` | 通过移除 `/etc/shadow`\
  \ 文件中账户密码前的感叹号来解锁账户。 |\n\n表 10.7 `usermod` 命令常用的选项\n\n注意，你可以更改账户的默认组并提供附加组的成员身份。账户组将在本章稍后的部分进行详细介绍。\n\
  \n\n\n\n\n`usermod` 命令真正派上用场的场景是：你创建了一个账户，但忘记检查发行版的账户创建配置设置了。列表 10.17 显示了在 Ubuntu\
  \ 桌面发行版上的一个示例。\n\n在列表 10.17 中，创建了用户账户 `DBowman`，但当使用 `getent` 实用程序检查账户时，显示使用的是 `/bin/sh`\
  \ shell 而不是 Bash shell。为了解决这个问题，需要使用 `usermod` 命令并配合 `-s` 选项，将账户的 shell 修改为 `/bin/bash`\
  \ shell。\n\n### 删除账户\n\n在 Linux 上删除账户非常简单。`userdel` 实用程序是完成此任务的关键工具。最常用的选项是 `-r`\
  \ 开关。该选项将删除账户的家目录树及其其中的任何文件。列表 10.18 显示了删除账户的示例。\n\n在列表 10.18 中的前两个命令显示 `/home/DBowman`\
  \ 目录存在且包含文件，并且该账户在 `/etc/passwd` 文件中有相应的记录。第三条命令包含了 `userdel -r` 命令，用于删除账户以及家目录。注意系统生成了一条错误信息，说明找不到\
  \ `/var/mail/DBowman` 文件。这不是问题，这意味着该文件在创建账户时并未被创建。最后，最后两个命令显示 `/home/DBowman` 目录及其文件均已删除，且\
  \ `/etc/passwd` 文件不再包含 `DBowman` 账户的记录。\n\n## 管理组\n\n组是 Linux 任意访问控制（DAC）体系的组织结构。DAC\
  \ 是传统的 Linux 安全控制机制，对文件（或任何对象）的访问是基于用户的身份和当前的组成员身份的。当创建一个用户账户时，它会被赋予一个特定组的成员，称为该账户的默认组。虽然用户账户可以拥有许多组成员身份，但其进程一次只能有一个指定的当前组。当用户首次登录系统时，默认组即为该账户的当前组。\n\
  \n组通过名称以及其组标识符（GID）来识别。这与用户通过 UID 识别的方式类似，Linux 使用 GID 来识别特定组，而人类则使用组名。\n\n如果在创建用户账户时没有指定默认组，则会创建一个新组。该新组的名称与用户账户名称相同，并被分配一个新的\
  \ GID。要查看账户的默认组，可以使用 `getent` 命令查看该账户的 `/etc/passwd` 记录。回想记录中的第四字段是账户的 GID，即为默认组。如果你需要复习各种\
  \ `/etc/passwd` 记录字段，请查阅表 10.3。列表 10.19 显示了在 Rocky Linux 发行版上创建的 `DAdams` 账户查看其默认组信息的示例。\n\
  \n在列表 10.19 中的第一条命令显示 `DAdams` 账户的默认组 GID 为 1002，但它没有提供组名。`groups` 命令显示了组名，该名与用户账户名\
  \ `DAdams` 相同。这在创建账户时未指定默认组时是典型的现象。第三条命令（另一个 `getent` 命令）显示 `DAdams` 组确实映射到 1002\
  \  GID。第四条命令确认了这一信息。\n\n要将用户添加到新组或更改账户的默认组，该组必须预先存在。此任务通过 `groupadd` 实用程序完成。组的 GID\
  \ 将由系统自动设置，但你可以通过 `-g` 命令选项来覆盖这一默认行为。创建新组的示例见列表 10.20。\n\n注意，在列表 10.20 中，创建新组需要超级用户权限。使用\
  \ `getent` 实用程序以及 `grep` 命令来显示 `/etc/group` 文件中的新组记录。`/etc/group` 文件中的字段由冒号（`:`）分隔，如下所示：\n\
  \n*   组名\n*   组密码：`x` 表示如果存在组密码，它存储在 `/etc/gshadow` 文件中。\n*   GID\n*   组员：属于该组的用户账户，用逗号分隔。\n\
  \n新创建的组没有为其创建组密码。然而，`/etc/group` 文件中 `Project42` 组记录中的 `x` 并不能证明这一点。为了确保没有组密码，在列表\
  \ 10.21 中检查了存储组密码的 `/etc/gshadow` 文件。\n\n列表 10.21 中的命令显示了 `/etc/gshadow` 文件中的 `Project42`\
  \ 组记录。第二个字段包含一个感叹号（`!`），表示该组未设置密码。\n\n一旦创建了新组，就可以设置组成员身份，这只需将用户账户添加到组中。列表 10.22\
  \ 显示了使用 `usermod` 命令执行此操作的示例。\n\n注意，列表 10.22 中的 `usermod` 命令使用了两个选项 `-aG`。`-G` 将\
  \ `DAdams` 账户作为 `Project42` 组的成员，但 `-a` 开关非常重要，因为它保留了 `DAdams` 账户之前的任何组成员身份。在将 `DAdams`\
  \ 账户添加 `Project42` 组成员后，从最后两个命令的结果可以看到 `/etc/group` 文件中 `Project42` 的记录已更新。\n\n\
  如果你需要修改特定组，`groupmod` 命令很有帮助。组的 GID 通过 `-g` 选项修改，而组名通过 `-n` 开关修改。在列表 10.23 中，修改了\
  \ `Project42` 组的 GID。\n\n注意，在列表 10.23 中，`Project42` 组的 GID 被修改为 `1138`。`getent`\
  \ 命令确认了 `/etc/group` 文件已更新。如果 `1138` GID 已被另一个组占用，`groupmod` 命令将显示错误信息而不会更改组的 GID。\n\
  \n要删除组，使用 `groupdel` 实用程序。示例见列表 10.24。\n\n注意，在列表 10.24 中删除 `Project42` 组后，`getent`\
  \ 命令显示 `/etc/group` 文件中的 `Project42` 组记录已被移除。非常棒的一点是，删除组的任何成员其组信息也已得到更新，如第三条命令所示。\n\
  \n删除组后，在虚拟目录系统中搜索任何可能对该组具有访问设置的文件是非常重要的。你可以使用 `find` 命令和被删除组的 GID 来进行此类审计。该任务的示例如第四条命令所示。如果你需要帮助记忆如何使用\
  \ `find` 实用程序，请回到第 3 章，“管理文件、目录和文本”，该命令最初在那里介绍过。\n\n除了添加、修改和删除用户账户及组之外，还有其他几个涉及管理它们的关键项目。这些主题将在接下来的几个章节中介绍。\n\
  \n## 设置环境\n\n在用户登录 Linux 系统之后、进入 Bash shell 命令行提示符之前，会配置用户环境。该环境由环境变量、命令别名以及各种其他设置组成。例如，`PATH`\
  \ 环境变量（见第 3 章）在配置用户环境时经常会被操作。\n\n\n\n\n\n用户环境配置是通过环境文件完成的。这些文件包含了执行必要操作的 `Bash`\
  \ shell 命令，本节将介绍这些文件，并列出几个环境变量的重点。\n\n### 熟悉 Bash 参数\n\nBash shell 使用一种名为`环境变量`的特性来存储\
  \ shell 会话和工作环境的信息（因此得名环境变量）。你可以通过 `set`、`env` 和 `printenv` 命令查看系统上设置的所有各种环境变量。然而，出于用户环境的目的，我们将仅关注其中`少数`变量。这些变量列在表\
  \ 10.8 中。\n\n| 名称 | 描述 |\n| --- | --- |\n| `HISTCONTROL` | 控制命令在历史列表中的保存方式 |\n|\
  \ `HISTSIZE` | 控制历史列表中保存命令的最大数量 |\n| `PATH` | 设置 shell 搜索命令程序的目录 |\n| `PS1` | 配置\
  \ shell 的主提示符 |\n| `SHELL` | 设置 shell 程序的绝对目录引用 |\n| `USER` | 包含当前进程的用户账户名称 |\n\n\
  表 10.8 与用户环境相关的几个环境变量\n\n虽然你可以随时修改这些变量，但这里的重点是这些参数是如何为用户登录过程持久化地设置或修改的。当你通过登录 Linux\
  \ 系统启动 Bash shell 时，默认情况下，Bash 会检查几个文件进行配置。这些文件被称为`环境文件`，有时也称为`启动文件`。Bash 处理的环境文件取决于你启动\
  \ Bash shell 的方法。你可以通过三种方式启动 Bash shell：\n\n*   作为默认登录 shell，例如在 tty# 终端登录系统时\n\
  *   作为通过派子 shell 启动的交互式 shell，例如在 Linux GUI 中打开终端模拟器时\n*   作为非交互式 shell（也称为`non-login\
  \ shell`）启动，例如运行 shell 脚本时\n\n环境文件实际上是 shell 脚本。shell 脚本将在第 25 章“部署 Bash 脚本”中有更深入的介绍。接下来的章节将带你了解各种环境文件。\n\
  \n### 理解用户条目\n\n在用户目录 `$HOME` 中可以找到四个潜在的环境文件。对于默认登录或交互式 shell，系统将按照以下顺序运行找到第一个文件，并忽略其余文件：\n\
  \n*   `.bash_profile`\n*   `.bash_login`\n*   `.profile`\n\n通常，第四个文件 `.bashrc` 会从上述列表中找到的文件运行。然而，每当启动非交互式\
  \ shell 时，都会运行 `.bashrc` 文件。\n\n在列表 10.25 中，在 Rocky Linux 发行版上，会检查用户目录下的四个环境文件。注意，其中两个没有被找到。因此，该系统仅使用了\
  \ `.bash_profile` 和 `.bashrc` 文件。\n\n如果你想持久化地修改 shell 的主提示符（`$PS1`），可以通过向其中一个本地环境配置文件添加修改内容来实现。列表\
  \ 10.26 显示了 Fedora Workstation 发行版上 `PS1` 变量的修改。\n\n注意在列表 10.26 中，用户的提示符仍被设置为 `$`。在\
  \ `$HOME/.bash_profile` 文件中指定的新提示符直到运行该文件才会生效，这可以通过手动完成，也可以在用户注销并重新登录 shell 时自动完成。\n\
  \n这些单独的用户环境文件通常从 `/etc/skel/` 目录填充，取决于你的账户创建配置设置。对于未来的账户，你可以修改骨架环境文件。请记住，任何可以访问命令行的单个用户都有修改自己的文件的能力。因此，对于需要应用到所有用户的环境配置，最好在下一个全局环境文件中创建一个全局条目，这些文件将在下文中介绍。\n\
  \n### 掌握全局条目\n\n全局配置文件修改所有启动 Bash shell 的用户的工作环境和 shell 会话。正如前面提到的，这些文件中的全局条目可以通过账户用户向其\
  \ `$HOME` 环境文件添加用户条目来修改。\n\n全局环境文件包括以下内容：\n\n*   `/etc/profile` 文件\n*   `/etc/profile.d/`\
  \ 目录下的文件\n*   `/etc/bashrc` 或 `/etc/bash.bashrc` 文件\n\n你的 Linux 系统是否存在 `/etc/bashrc`\
  \ 或 `/etc/bash.bashrc` 文件取决于你运行的是哪个发行版。其中任何文件通常都会从用户的 `$HOME/.bashrc` 文件调用。\n\n\
  建议不要为了全局环境需求更改 `/etc/profile`或其他文件，而是创建一个自定义环境文件，赋予其 `.sh` 文件扩展名，并将其放在 `/etc/profile.d/`\
  \ 目录下。`/etc/profile.d/` 目录下的所有 `.sh` 文件都会在登录 Bash shell 时通过 `/etc/profile` 环境文件运行。\n\
  \n现在你知道如何在本地和全局设置用户环境的持久化更改。接下来，我们将监控这些用户。\n\n## 查询用户\n\n几个实用允许你审计哪些用户正在访问系统，以及过去访问过系统的用户。你还可以验证当前使用的账户名称并查看有关用户账户的各种信息。\n\
  \n### 探索 *whoami* 工具\n\n`whoami` 命令将显示你当前正在使用的用户账户。虽然这看起来可能很傻，但知道自己当前使用的账户很重要，特别是当你的组织有共享账户或你使用的发行版允许交互登录\
  \ root 账户时。\n\n`whoami` 命令在列表 10.27 中进行了演示。注意它只显示当前用户账户的名称。\n\n### 理解 *who* 工具\n\
  \n`who` 命令比 `whoami` 工具提供了更多数据。你可以查看有关你自己的账户的信息，也可以查看系统上的每个当前用户。示例在列表 10.28 中显示。\n\
  \n注意列表 10.28 中，当单独使用 `who` 命令时，它会显示所有当前系统用户、他们使用的终端、进入系统的时间，以及对于远程用户，还会显示他们的远程 IP\
  \ 地址。\n\n尽管这是一个非常短的命令，但 `w` 工具提供了大量的有用信息。示例在列表 10.29 中显示。\n\n注意列表 10.29 中 `w` 命令的详细输出。显示的第一行显示了以下信息：\n\
  \n*   当前时间\n*   系统已运行了多久\n*   当前有多少用户正在访问系统\n*   过去 1、5 和 15 分钟的 CPU 负载平均值\n\n接下来几行涉及当前系统用户信息。列如下：\n\
  \n*   `USER`: 账户名称\n*   `TTY`: 账户当前使用的终端\n*   `LOGIN@`: 用户登录账户的时间\n*   `IDLE`: 用户上一次与系统交互以来过去了多久\n\
  *   `JCPU`: 账户总共使用了多少 CPU 时间\n*   `PCPU`: 账户当前命令（进程）使用了多少 CPU 时间\n*   `WHAT`: 账户当前正在运行什么命令\n\
  \n`w` 工具从 `/var/run/utmp` 文件获取用户信息。它还从 `/proc/` 目录下的文件中收集额外数据进行显示。\n\n### 使用 *id*\
  \ 程序识别身份\n\n\n\n\n\n`id` 工具允许你提取有关当前用户进程的各种数据。它还可以显示任何你作为参数传递给 `id` 的账户信息。`id` 命令提供了一个简洁的单行摘要，如\
  \ 列表 10.30 所示。\n\n如果你不需要 列表 10.30 中第一个命令提供的所有信息，可以通过采用各种 `id` 工具选项来过滤结果，如 列表 10.30\
  \ 中的第二个命令所示。其中一些较常用的选项列在 表 10.9 中。\n\n| 简写 | 完整名称 | 描述 |\n| --- | --- | --- |\n\
  | `-g` | `--group` | 显示账户当前组的 GID，该 GID 是账户的默认组或通过使用 `newgrp` 命令到达的组。 |\n| `-G`\
  \ | `--groups` | 通过每个组的 GID 显示账户所有的组成员身份。 |\n| `-n` | `--name` | 在 `-g`、`-G` 或 `-u`\
  \ 选项中使用此开关时，显示账户名称而非 UID，或显示组名而非 GID。 |\n| `-u` | `--user` | 显示账户的 UID。 |\n\n表 10.9\
  \ `id` 命令的常用选项\n\n`id` 工具在 shell 脚本中非常有用。在片段 列表 10.31 中，你可以看到它是如何被用于在 Rocky Linux\
  \ 系统的 `/etc/profile` 文件设置 `USER` 环境变量的。\n\n### 使用 `last` 工具显示访问历史\n\n`last` 命令从\
  \ `/var/log/wtmp` 文件提取信息，并列出账户列表，显示它们上次登录/退出系统的时间或它们是否仍处于登录状态。它还会显示系统重启的时间以及 `wtmp`\
  \ 文件启动的时间。片段示例见 列表 10.32。\n\n请注意，`/var/log/wtmp` 文件通常通过 `cron` 工具自动轮转，这在 第 26 章\
  \ 中介绍。如果你需要从旧的 `wtmp` 文件收集信息，可以使用 `-f` 选项。例如，你可以输入 `last -f /var/log/wtmp.1` 来查看来自\
  \ `/var/log/wtmp.1` 文件的数据。\n\n`last` 命令以及这些节涵盖的其他各种工具对于审计当前用户和检查你自己的账户身份非常有帮助。它们是你\
  \ Linux 管理工具箱中的更多工具。\n\n## 管理磁盘空间使用\n\n防止文件系统被文件填满并导致程序或整个系统问题的方法之一是对用户的磁盘空间使用设置限制。这是通过配额（quotas）实现的。Linux\
  \ 可以对用户可以创建的文件数量设置上限，并限制单个用户消耗的文件系统总空间。这些限制不仅适用于账户，也可以为组设置。\n\n在特定文件系统上启用配额基本上有四个步骤。你需要使用超级用户权限完成这些步骤。步骤如下：\n\
  \n1. 修改 `/etc/fstab` 文件以启用文件系统配额支持。\n2. 如果文件系统已经挂载，则卸载并重新挂载。如果文件系统之前没有挂载，则只需挂载它。\n\
  3. 创建配额文件。\n4. 建立用户或组配额限制和宽限（grace periods）。\n\n必要的 `/etc/fstab` 文件修改非常简单。你只需要编辑文件并在系统的挂载选项（第四字段）中添加\
  \ `usrquota` 或 `grpquota` 或两者。示例如 列表 10.33 所示。\n\n一旦修改了 `/etc/fstab` 文件，如果文件系统已经挂载，你需要通过\
  \ `umount` 命令将其卸载。然后使用 `mount -a` 命令挂载或重新挂载系统，该命令将挂载 `/etc/fstab` 文件列出的任何未挂载的文件系统。示例如\
  \ 列表 10.34 所示。\n\n注意 列表 10.34，你可以通过使用 `mount` 命令和 `grep` 工具来检查挂载是否成功。还要注意，挂载的文件系统同时启用了\
  \ `usrquota`（用户配额）和 `grpquota`（组配额）。\n\n一旦文件系统正确挂载并启用配额支持，你就可以创建执行限制所需的配额文件。这是通过\
  \ `quotacheck` 工具完成的。`-c` 选项通过扫描文件系统创建所需的文件，记录当前的配额使用情况。`-u` 选项创建 `aquota.user`\
  \ 文件，`-g` 选项创建 `aquota.group` 文件。因此，如果你只实现用户配额而不实现组配额，可以省去 `-g` 选项，反之亦然。使用 `quotacheck`\
  \ 的示例如 列表 10.35 所示。\n\n创建配额文件后，你就可以使用 `edquota` 工具为用户账户和/或组开始创建配额限制。编辑用户配额使用 `-u`\
  \ 选项（默认值），编辑组配额使用 `-g` 选项。编辑用户账户配额的片段示例见 列表 10.36。\n\n当你输入 `edquota` 命令时，你会被放入 `vim`\
  \ (`vi`) 编辑器处理配额文件，除非你已将 `$EDITOR` 环境变量指向另一个文本编辑器。在配额文件中，有两个无法永久修改的预设项目：`blocks`（已用块）和\
  \ `inodes`（当前文件数量）。这是因为这些信息是在之前运行 `quotacheck` 命令时获得的，并且不是通过 `edquota` 工具设置的。\n\n\
  然而，你可以修改 `blocks` 和 `inodes` 的 `soft`（软）和 `hard`（硬）限制。当你设置硬块限制时，你是在设置用户可以填充数据的最大块数。当你设置\
  \ inode 硬限制时，你是在设置用户可以创建的文件总数。一旦用户达到其中任何一个限制，该账户在该特定文件系统上将不再有可用的磁盘空间或文件空间。注意如果设置为\
  \ `0`，则禁用该限制。注意 列表 10.36，inode 限制已禁用。\n\n软限制要友好一些。一旦用户达到设定的软限制，他们可以在超过该限制的情况下持续一段时间。这被称为*宽限*（grace\
  \ period）。\n\n一旦你修改了用户（或组）配额，你就需要为任何设置的软限制建立宽限。要为此，你使用 `edquota -t` 命令。这些宽限适用于所有用户和组。示例如\
  \ 列表 10.37 所示。\n\n当你发布 `edquota -t` 命令时，你再次会进入 `vim` 编辑器，除非你修改了 `$EDITOR` 环境变量。宽限可以针对\
  \ `blocks` 和 `inodes` 设置，且单位可以是天、小时、分钟甚至秒，这听起来并不大优雅。\n\n当你修改了用户的配额限制并设置了宽限后，最好检查一下你的修改。`quota`\
  \ 命令在此可以提供帮助。示例如 列表 10.38 所示。\n\n注意 列表 10.38，用户账户在宽限列中没有显示任何信息。这意味着用户没有超出软限制，并且当前不处于宽限期。\n\
  \n在完成所有工作后，你应该再次进行检查。你可以通过 `repquota` 命令审计所有采用配额限制的文件系统。示例如 列表 10.39 所示。\n\n这应该让你的文件系统运行良好。然而，请注意，定期通过\
  \ `quotacheck` 工具检查你的文件系统的配额是一个好主意。你可以通过设置 `cron` 任务来实现自动化，这在 第 26 章 “自动化作业”中有所介绍。\n\
  \n\n\n\n\n管理 Linux 系统的用户帐户和组成员关系涉及许多关键部分。你需要理解账户创建过程以及所使用的文件。在需要为特定用户排查身份验证问题时，你必须掌握整个机制。此外，能够使用各种实用程序来识别不同的用户也会有所帮助。\n\
  \n用户账户可以被组合到不同的组中，这提供了额外的访问权限。这些组成员关系是授权的一部分，用户可以通过它们进入各种文件和目录。了解组管理的关键区域对于适当的 Linux\
  \ 系统管理至关重要。\n\n除了通过适当的用户和组身份验证与授权机制来保护系统外，你还可以防止文件系统被过度使用。特别是，设置文件系统用户和组配额将提供额外的保护。\n\
  \n## 考试要点\n\n### 描述管理用户账户的参与者。\n`/etc/login.defs` 和 `/etc/default/useradd` 文件配置了\
  \ `useradd` 命令默认行为的各种设置。由于这些文件中的指令设置随发行版的不同而异，因此在使用 `useradd` 工具创建账户之前审阅它们是明智的。当创建账户时，`/etc/passwd`、`/etc/shadow`\
  \ 和 `/etc/group` 文件都会被修改。根据用户账户创建配置，可能会创建一个用户主目录并将文件从 `/etc/skel/` 目录复制到其中。\n\n\
  ### 总结组的管理。\n涉及创建、修改和删除组的命令是 `groupadd`、`groupmod` 和 `groupdel` 命令。这些命令会对 `/etc/group`\
  \ 文件进行修改。如果你需要将用户添加到组中，则需要使用 `usermod` 实用程序。用户可以使用 `newgrp` 程序轻松地从帐户的默认组切换到其所属的另一个组。帐户组成员关系可以通过\
  \ `groups` 和 `getent` 命令以及查看 `/etc/group` 文件进行审计。\n\n### 列出环境文件。\nBash shell 使用环境变量来存储有关\
  \ shell 会话和工作环境的信息。这些变量通过环境文件进行设置。运行哪些环境文件取决于用户登录系统的方式以及账户所属的发行版。用户环境文件是隐藏文件，因为它们以点（`.`）开头，可能是\
  \ `.bash_profile`、`.bash_login`、`.profile` 和 `.bashrc` 文件。全局文件可能包括 `/etc/bashrc`、`/etc/bash.bashrc`、`/etc/profile`\
  \ 以及 `/etc/profile.d/` 目录下的文件。\n\n### 解释查询用户帐户信息的各种方法。\n你可以使用多种实用程序来确定当前登录帐户的用户以及未登录用户的帐户信息。“who”系列命令有三种变体，即\
  \ `whoami`、`who` 和 `w` 实用程序。`id` 程序用于将 UID 和 GID 数字与特定的用户帐户匹配。`last` 命令有助于查看系统何时重启，还可以查看用户是否已登录系统，或者帐户最后一次被访问的时间。\n\
  \n### 描述如何管理文件系统使用配额。\n在系统上设置用户帐户或组配额限制之前，你必须通过 `/etc/fstab` 文件中的 `usrquota` 和 `grpquota`\
  \ 选项在文件系统上启用配额。一旦文件系统卸载并重新挂载，你可以通过 `quotacheck` 工具创建所需的用户和/组文件。完成后，可以通过 `edquota`\
  \ 命令设置用户或组限制。你还可以通过 `repquota` 程序查看和/或验证配额。\n\n## 复习题\n\n你可以在 附录 A 中找到复习题的答案。\n\n\
