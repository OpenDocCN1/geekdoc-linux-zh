    Ubuntu is available in three official editions: Ubuntu Desktop, Ubuntu Server,
    and Ubuntu Core (for the Internet of Things). Supported are a range of architectures
    like `i386`, `IA-32`, `amd64`, `ARMhf` (ARMv7 VFPv3-D16), `ARM64`, `powerpc` (64
    bit) and `s390x`. Initially published in 2004, there are two releases per year:
    one in April and another in October. The release is reflected by the version number:
    `18.04` refers to the April release of the year 2018\. The code name of a release
    is based on an adjective and an animal, such as `Utopic Unicorn` for Ubuntu 14.10.![](image287.jpg)


    # Linux Mint

    Linux Mint is a non-commercial distribution that is based on Ubuntu and follows
    its release scheme. The initial publication dates back to the year 2006\. As of
    2014 there have been two releases per year following the release from Ubuntu by
    one month. The code name for the release is a female name that ends with an a
    , such as `Felicia` for version 6\. Linux Mint supports the two architectures
    `IA-32` and `amd64`. The target of the distribution is desktop users that can
    use it easily.![](image292.jpg)


    # Red Hat Enterprise Linux (RHEL)

    RHEL is a commercial Linux distribution. It is based on the combination of Red
    Hat Linux (available between 1995 and 2004) plus `Fedora` 19 and 20\. Its original
    release dates back back to the year 2000\. Its focus on business customers includes
    long-term support, training, and a certification program (see Chapter 1). Red
    Hat’s community project is called `Fedora` (see below). The packages are made
    available in `.rpm` format (Red Hat Package Manager). RHEL supports the architectures
    `arm` (64 bit), `i386`, `amd64`, `powerpc`, as well as `s390` and `zSeries`. The
    distribution targets both servers and desktops. The code name for the release
    looks rather random, as it does not follow a similar scheme as used for Debian
    or Ubuntu.![](image298.jpg)


    # Fedora

    Fedora is a community Linux distribution, aimed mainly at desktop usage. It is
    based on Red Hat Enterprise Linux (RHEL) and sponsored by Red Hat. It was launched
    in 2003 at the time the support for Red Hat Linux ended. As of 2018 it is available
    in the following versions:


    *   Workstation: for pc

    *   Server: for servers

    *   Atomic: for cloud computing


    Fedora supports the architectures `amd64`, `ArmHF`, `powerpc`, `mips`, `s390`
    and `RISC-V`. The distribution has a rather short lifecycle where a new release
    follows roughly every 6 months. The code name for a release does not follow a
    fixed naming scheme but mostly consists of city names.![](image311.jpg)


    # CentOS

    CentOS abbreviates from the name Community Enterprise Operating System. As with
    Fedora it is based on Red Hat Enterprise Linux, and compatible in terms of the
    binary packages. This allows the use of software on CentOS that is initially offered
    and developed with RHEL in mind. In contrast to Fedora it focuses on enterprise
    use for both desktop and server, with long-term support. The initial release of
    CentOS goes back to May 2004\. The software packages come from three different
    repositories:


    *   Base: regular, stable packages

    *   Updates: security, bug fix or enhancement updates

    *   Addons: packages required for building the larger packages that make up the
    main CentOS distribution, but are not provided upstream


    CentOS is available for the architectures `i386` and `amd64`. Other architectures
    are not supported.![](image324.jpg)


    # openSUSE

    The Linux distribution openSUSE has its roots in the distributions SUSE Linux
    and the commercial SUSE Linux Professional that saw its first release in 1994\.
    The name SUSE is an abbreviation for the original German owner named `Gesellschaft
    für Software- und Systementwicklung GmbH`. OpenSUSE is based on the structures
    of Red Hat Linux and Slackware, and uses `.rpm` as a software archive format.
    It is available for the architectures `i586`, `x86-64` and `ARM`. The openSUSE
    project aims to release a new version every eight months. As with Fedora, the
    code name for a release does not follow a fixed naming scheme.![](image330.jpg)


    # Arch Linux

    Arch Linux is a free Linux distribution that saw its first release in 2002\. It
    follows the principle of a rolling release, which results in monthly releases
    of the distribution. Currently the core team consists of about 25 developers and
    is supported by a number of other developers, called trusted users. Arch Linux
    uses `Pacman` as a package management system. The single packages are held in
    four software repositories:


    *   Core: packages for the basic system

    *   Extra: additional packages like desktop environments and databases

    *   Community: packages that are maintained by trusted users

    *   Multilib: packages that can be used on several architectures


    Arch Linux supports the architecture `amd64`. The early releases until 2007 had
    code names that do not follow a specific scheme.![](image345.jpg)


    # Gentoo

    As with Arch Linux, Gentoo follows the principle of a rolling release. New installation
    images are available weekly, with the first release available in 2002\. Gentoo
    is special due to being a source code based distribution. Before installing the
    software, it has to be compiled first. Supported architectures are `alpha`, `amd64`,
    `arm`, `hppa`, `IA-64`, `m68k`, `mips`, `powerpc`, `s390`, `sh` and `sparc`.![](image350.jpg)


    # Slackware

    Slackware is the oldest active Linux distribution. The first release dates back
    to 1992\. Regular releases are available without a fixed interval. It targets
    the professional user, and gives him/her as much freedom as possible. Slackware
    uses compressed `.tar.gz` archives as a package format, and supports the four
    architectures `i486`, `alpha`, `sparc` and `arm`. The distribution was also ported
    to architecture `s390`.![](image356.jpg)](http://www.Amazon.com/gp/customer-reviews/write-a-review.html?asin=B07HDTG5D)


    # Setting up a Linux System

    As mentioned in the previous chapter, we will be using Debian for our demonstrations.
    To recap, Debian is a distribution that provides great stability and scales up
    exceptionally well once your skills and knowledge progress past the beginner stages.
    In this chapter we will install and configure Debian, showing you every single
    step along the way.


    ## Types of Installations

    Debian offers a variety of methods for a proper setup. This includes a graphical
    and a text-based installation; we will use the former. For installation media
    the Debian developers offer three variants:


    *   A CD or DVD for 32 bit and 64 bit

    *   A network image for 32 bit and 64 bit (a so-called Netinst-ISO)

    *   A tiny CD for 32 bit or 64 bit

