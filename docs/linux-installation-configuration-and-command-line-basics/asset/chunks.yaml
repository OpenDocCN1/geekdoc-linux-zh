    ## 1.2 A Brief History of Linux


    Similar to UNIX, the Linux operating system has different roots and is based on
    the work of quite a few masterminds. Among others, this includes Richard M. Stallman,
    Andrew S. Tanenbaum and Linus Torvalds.


    Richard M. Stallman, a hacker and developer at MIT, is the first president of
    the Free Software Foundation (FSF), and the father of the `GNU` project. `GNU`
    abbreviates the slogan `GNU` is Not UNIX. The goal of the project was to develop
    a free UNIX operating system. Until the beginning of the 1990s a collection of
    tools were available, but the kernel was still missing. The entire software was
    published under the `GNU Public License` (`GPL`) around 1983.


    The next step for Linux came from Andrew S. Tanenbaum. At that time he was a professor
    at the University of Amsterdam. For his students he developed `Minix`, an operating
    system for educational purposes to demonstrate and understand the UNIX principles.
    As he pointed out, `Minix` was not intended to be used in practice.


    Linus Torvalds, a Finish student at the University of Helsinki, was a user of
    `Minix` and quite unhappy with its boundaries. In 1990 he began to develop a new
    operating system based on the ideas of `Minix`, the UNIX principles, and the `POSIX`
    standard. His motivation was to have his own system that was understandable, and
    maximized to the boundaries of the hardware. He also wanted to have fun, and had
    no commercial intent in mind. The entire story behind Linux is described in his
    autobiographical book titled `Just for Fun`. Today, Linus Torvalds oversees the
    development of the `Linux kernel`.


    To make Linux attractive to the outside world it needed a nice logo. Based on
    a competition for mascots, a large number of proposals were handed in. Larry Ewing
    sent in his idea for a penguin as seen on the cover of this book, and his proposal
    won. Designed with a cheeky smile and a well-fed body this penguin, named `Tux`,
    represents the image of a happy and satisfied user.


    ## 1.3 Linux Range of Use


    Originally designed for Intel-based systems, Linux runs on a variety of platforms
    today. Among others this includes the ARM architectures (named `arm` and `arm64`),
    Motorola/Freescale’s 68k architecture (`m68k`), Intel x86 (`i386` and `amd64`),
    IBM s390 (`s390`), PowerPC (`powerpc`) and SPARC (`sparc`).


    Right from the beginning Linux focused on server systems. It is in constant use
    as a web server, file server, mail and news server, internet gateway, wireless
    router and firewall. Used as a computing unit, it helped to render video sequences
    and entire films such as Titanic, Shrek and Toy Story. Furthermore, Linux is in
    use in automotive products, astronautics, military, logistics and the engineering
    environment. Since 2006, Linux servers run all the world’s stock exchanges. It
    also runs almost all internet search engines.


    Over the last decade Linux also conquered the desktop. Due to its high flexibility
    and stability, it works as a reliable setup for text processing, graphic design,
    desktop publishing, calculations in spreadsheets, communication (email, chat,
    audio, and video) as well as user interfaces for your phone and television.


    ## 1.4 Linux Certifications


    The widespread use of Linux has increased the demand for engineers and users who
    know exactly what they are doing. At this point a certification for Linux becomes
    advantageous. These certifications can be divided into programs that are general
    (not specific to a distribution) and focused (specific to a Linux distribution).
    The lists below give an overview of the primary certifications that currently
    exist.


    ### Non-specific Certifications


    * Linux Essentials

    * LPIC-1: Linux Server Professional Certification

    * LPIC-2: Linux Engineer

    * Linux Foundation Certified System Administrator (`LFCS`)

    * Linux Foundation Certified Engineer (`LFCE`)

    * CompTIA A+

    * CompTIA Network+


    ### Distribution-specific Certifications


    * RedHat Certified Engineer (`RHCE`)

    * RedHat Certified System Architect (`RHCSA`)

    * RedHat Certified Architect (`RCA`)

    * SUSE Certified Administrator (`SCA`)

    * SUSE Certified Engineer (`SCE`)

    * SUSE Enterprise Architect (`SEA`)


    ## 2. Software Licenses


    As with most products available on the market, software is also packaged with
    an according license. A software license describes the usage of the software and
    allows or limits its usage. For commercial software, changes and copies are allowed
    within rather strict boundaries only. As an example, the license restricts you
    to use it for 5 users in parallel, and requires you to obtain another license
    block to add a 6th or 7th user. Common licenses are `Shared Source` from Microsoft
    and the `Apple License`.


    For open source software, licenses are much less restrictive. Changes and copies
    are explicitly allowed, and are even desired in some cases to make improvements
    for every user and purpose. The goal is to keep the software available for everyone
    from now and into the future. This so-called `Copyleft` principle ensures that
    everyone has access to do adaptations if needed, and the restrictions on the use
    and redistribution of covered software are as minimal as possible. Common licenses
    that are in use for the single Linux components and its tools are the `GNU Public
    License` (`GPL`), `BSD Licenses` and the `Apache License`.


    The licenses for open source software follow a number of freedom rules as follows:


    * To use the program for every purpose (right of unlimited use - `freedom 0`)

    * To understand how the program works and how to change it according to your needs
    (right to read the source code of the program - `freedom 1`)

    * To make copies of the software to help your neighbor (right of redistribution
    - `freedom 2`)

    * To improve the software and to publish your changes so that all other users
    can also benefit from your improvements (`freedom 3`)

