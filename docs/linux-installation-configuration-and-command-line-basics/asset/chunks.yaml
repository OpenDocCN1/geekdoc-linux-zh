    cpThe cp command copies files. In order to operate properly, it requires two names:
    the name of the original file and the name of the copy. The next example creates
    a copy of the calendar file that is named “calendar-2018”.


    | $ cp calendar calendar-2018$ |


    The original file is not touched and stays intact. The copy has the same content
    as the original, but with the current timestamp. Use the option -i (or --interactive)
    to prevent overwriting existing files.mvThe mv command abbreviates the word “move”
    and moves and renames files and directories. It requires two names: the name of
    the original file and its new name. The following example renames the “calendar”
    file to “calendar-2018”.


