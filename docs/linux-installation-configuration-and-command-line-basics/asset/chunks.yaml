    # 4.5 Exiting Linux


    In order to use Linux properly, you also have to learn how to exit Linux and to
    reboot the system. Below you will learn how to quit the XFCE desktop environment,
    to shut down the Linux system and to reboot the system. We will look at two methods;
    the first is based on the graphical interface and the second can also be used
    on non-graphical systems like servers and wireless routers .


    ## Quitting the XFCE Desktop Environment

    The easiest way to quit the XFCE desktop and to log out from your current session
    is to click on the button in the right corner of the upper navigation bar. The
    button is labeled with your username, which in our case is `Debian User`. From
    the small menu select the last item labeled `Log Out` (see image below). Alternatively,
    you can choose either the item labeled `Log Out` from the `Application` button
    in upper-left corner or from the context menu.![](image701.jpg)


    A second window opens that contains the five buttons labeled `Log Out`, `Restart`,
    `Shutdown`, `Suspend` and `Hibernate` (see image below). Click on `Log Out` to
    quit your session. Subsequently you will return to the login screen.![](image705.jpg)


    ## Shutting Down the Linux System

    The way to shut down the entire Linux system is similar to exiting XFCE. Click
    on the button in the right corner of the upper navigation bar. The button is labeled
    with your username which in our case is `Debian User`. From the small menu (see
    image above) select the item labeled `Shut Down`. From the next dialog window
    click on the button labeled with `Shut Down` to stop the Linux system.


    From a terminal session you can run the commands `halt` or `shutdown -h now` as
    an administrative user. A regular user is not allowed to issue these commands.


    ```

    | # halt

    ```


    ## Rebooting the Linux System

    In order to restart the Linux system, click on the button in the right corner
    of the upper navigation bar. The button is labeled with your username, which in
    our case is `Debian User`. From the small menu select the item labeled `Restart`
    (see image above). From the next dialog window click on the button labeled `Restart`
    to reboot the Linux system.


    From a terminal session you can run the command `reboot` or `shutdown -r now`
    as an administrative user. A regular user is not allowed to issue these commands.


    ```

    | # reboot

    ```


    Subsequently the system will reboot and you will return to the boot screen.


    # 5. Navigating Linux

    File systems on UNIX/Linux systems contain different types of entries. This includes
    regular files, directories (or folders), symbolic links, block and character devices,
    named pipes and sockets. This chapter deals with directories and the corresponding
    Linux tools.


    ## 5.1 The Filesystem Hierarchy Standard (FHS)

    Modern Linux systems have a rather consistent directory structure, which is based
    on the Filesystem Hierarchy Standard (FHS). This definition specifies which main
    directories exist, and which content is stored in them. The FHS is maintained
    by the Linux Foundation. The latest version of the FHS is 3.0 and was released
    on 3 June 2015.


    The Linux distributions mentioned in Chapter 3 follow the FHS structure. Nevertheless,
    there are distribution-specific extensions. Below are the common directories that
    are in use:


    | Directory | Description |

    | :--- | :--- |

    | `/` | primary hierarchy root and root directory of the entire file system hierarchy
    |

    | `/bin` | essential command binaries for all the users |

    | `/boot` | the boot loader |

    | `/etc` | abbreviates etcetera and contains host-specific system-wide configuration
    files |

    | `/home` | the home directories of the users |

    | `/lib` | libraries essential for the binaries in `/bin` and `/sbin` |

    | `/media` | mount points for removable media |

    | `/proc` | abbreviates processes and is the virtual file system of the Linux
    kernel |

    | `/root` | the home directory for the root user |

    | `/sbin` | essential system binaries |

    | `/tmp` | temporary data and files |

    | `/usr` | Unix System Resources, contains user utilities and applications |

    | `/var` | variable data, such as log files and database files |


    Some Linux distributions have additional directories like `/opt` or use symbolic
    links. Linux also has some abbreviations in use. They can be quite helpful in
    your daily work:


    | Abbreviation | Description |

    | :--- | :--- |

    | `$HOME` | local variable that contains the user’s home directory |

    | `~` | points to the user’s home directory like `/home/tom` |

    | `.` | points to the current directory |

    | `..` | points to the parent directory |


    You can use these abbreviations on the command line in a terminal and in shell
    scripts to shorten commands. Next we will look at some of these commands.


    ## 5.2 Commands for Directories

    As with files, Linux offers a range of commands to list, create, remove, change
    and rename directories. You can use these commands in your terminal.


    ### Listing Directories

    In order to list the directories use the command `ls` with the switch `--directory`
    (short `-d`) as follows:


    ```

    $ ls -d */finances/projects/work/...$

    ```


    This example lists the names of the directories in the current directory. The
    line “...” in the output indicates that the list is longer and the output is shortened
    here. In order to list all the directories including the hidden ones starting
    with “.” you may type the `find` command as follows:


    ```

    $ find . -maxdepth 1 -type d./projects./.mozilla./.ipython./.dbus./.video...$

    ```


    In order to learn more about the `ls` command and also list other entries, have
    a look at Chapter 6 which covers terminal commands.


    The `tree` command searches the directory recursively and outputs an entire directory
    structure quite nicely. The switch `-d` limits the output to directories and looks
    as follows:


    ```

    $ tree -d.

    ├── archive

    │   ├── ballet-zebola

    │   │   ├── documents

    │   │   └── invoices

    │   └── charles-darwin-university

    ├── projects

    ├── .dbus

    ├── .ipython

    └── .mozilla...$

    ```


    ### Creating Directories

    In order to create a directory, use the `mkdir` command (make directory). The
    next example creates a new entry named “training” in the current directory:


    ```

    $ mkdir training

    ```


    The switch `--verbose` (short `-v`) prints an additional message that the command
    succeeded.


    ```

    $ mkdir -v training

    mkdir: directory "training" created$

    ```


    The switch `--parents` (short `-p`) allows you to create entire subdirectory structures.
    Parent directories that do not exist yet are created as well. The following example
    creates the directory “training” as well as its subdirectories “linux” (level
    1) and “lpic1” (level 2).


    ```

    $ mkdir -p training/linux/lpic1

    ```


    In order to create two subdirectories on the same level, make use of the capabilities
    the underlying command line interpreter has. The Bash uses values in brackets
    `{}` to achieve this. The next example shows you how to create the two directories
    `training/linux/lpic1` and `training/linux/lpic2` in one go:


    ```

    $ mkdir -p training/linux/{lpic1,lpic2}$

    ```


    ### Removing Directories

    Removing a directory is done using the `rmdir` command (remove directory). The
    next example removes the entry named “training” in the current directory:


    ```

    $ rmdir training

    ```


    As with `mkdir`, the switch `--verbose` (short `-v`) prints an additional message
    that the command succeeded.


    ```

    $ rmdir -v training

    mkdir: directory is removed, "training"$

    ```


    This works well, as long as the directory is empty. In case your directory contains
    any entries like files or subdirectories, the `rmdir` command will complain when
    using this message, and keep the directory unchanged:


    ```

    $ rmdir training

    rmdir: failed to remove `training`: Directory not empty$

    ```


    To solve this situation the `rm` command (remove) combined with the switch `--recursive`
    (short `-r`) becomes quite handy. Then, `rm` removes all the entries recursively.
    The following example combines the two switches `-r` and `-v` in order to delete
    one file and three directories.

