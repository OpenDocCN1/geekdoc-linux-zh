    \ This Book\nThis book has been created to guide you through your very first steps\
    \ in the Linux environment. If you are a complete novice, or need a refresher\
    \ in Linux, you’ve chosen the right book.\n\nIn the upcoming chapters we will\
    \ cover the Linux diversity and history and then continue on with setting up a\
    \ Linux system from scratch for the end user. Here we will guide you through the\
    \ setup and configuration process step by step.\n\nWe will take a detailed look\
    \ at the infamous command line by covering numerous essential terminal commands.\
    \ We will also address specific topics such as choosing a distribution, adding\
    \ a graphical user interface, package management, navigating the filesystem and\
    \ directories, partitioning, software selection, and using the help system.\n\n\
    By the end of this book you will have set up and configured Linux from start to\
    \ finish, and be able to use Linux at a proficient level.\n\n## 1. What is Linux?\n\
    Linux is the name for the kernel of an operating system that is based on the UNIX\
    \ principles. The name is derived from the first name of its Finnish inventor,\
    \ Linus Torvalds, and follows the methodology used by other UNIX-based systems\
    \ (the last letter is an x). Today, Linux is developed and maintained by thousands\
    \ of people around the world.\n\nThe kernel of an operating system is its heart.\
    \ It is required for communication between the hardware of your computer and you,\
    \ the user. An operating system is a collection of different software components:\
    \ a kernel, various tools and the accompanying libraries. It is a software that\
    \ extends the basic operating system of your computer, known as the BIOS.\n\n\
    ### 1.1 From UNIX to Linux\nThe history of Linux can be traced back to the 1990s.\
    \ In order to understand the story behind Linux, we also have to look back briefly\
    \ at the early days of computing after the 2nd World War.\n\nAt that time computing\
    \ machines filled entire buildings and the transformation from mechanical to electronic\
    \ components, like microprocessors, was underway. Moreover, in the 60s and 70s\
    \ hardware and software components were quite expensive and not standardized.\
    \ Various vendor-specific platforms existed and each of them had their own interface.\
    \ Communication between these single devices required specific knowledge. The\
    \ development of UNIX was an aim to circumvent these obstacles and to simplify\
    \ the usage on a larger scale.\n\n### UNIX\nAt the beginning of 1965 the development\
    \ of the Multiplexed Information and Computing Service (`Multics`) started. Multics\
    \ was the result of a collaboration between the Massachusetts Institute of Technology\
    \ (`MIT`), General Electric (`GE`) and Bell Labs/AT&T. Led by the developers Ken\
    \ Thompson and Dennis Ritchie, the main product they developed was `Unics`. Later\
    \ on it was renamed to `UNIX`. The UNIX operating system was mainly in use at\
    \ the University of California in Berkeley.\n\n### UNIX Variants\nThe concept\
    \ of UNIX became licensed to several companies that developed and maintained their\
    \ own variant of UNIX. This included `Solaris/SUN OS` (`SUN Microsystems`, nowadays\
    \ owned by `Oracle`), `AIX` (`IBM`), Scenix (`Siemens`), `SCO UNIX`, `Xenix` (`Microsoft`),\
    \ as well as `HP-UX` (`Hewlett-Packard`), `NeXTSTEP`, `Mac OS` (`Apple`) and `Android`\
    \ (`Google`).\n\nOpen-source implementations comprised of the Berkeley System\
    \ Distribution (`BSD`) with its variants: `NetBSD`, `OpenBSD`, and `FreeBSD`.\
    \ Today, Linux is the most popular free software among open source developers.\n\
    \n### UNIX Philosophy\nUNIX is designed with a number of strict principles in\
    \ mind. These principles cover portability, multi-tasking and multi-user orientation\
    \ in combination with a time-sharing approach. Furthermore, it is based on network\
    \ connectivity following the `TCP/IP` scheme.\n\nThe original development was\
    \ done in the `C` programming language that resulted in independence from a hardware\
    \ platform. Delivered with a selection of development tools and libraries, it\
    \ allows you to easily extend it to your specific needs.\n\n### Tools\nSimilar\
    \ to a toolbox, UNIX consists of a variety of tools. Each of them having a specific\
    \ purpose and being designed exactly for that task. The idea is to use one tool\
    \ per task. In order to achieve more complex goals, you would combine several\
    \ tools into a chain. The following example combines the two commands `ls` and\
    \ `wc` by means of a pipe to be able to count the number of Python files in the\
    \ current directory.\n\n```\nls .py | wc -l\n```\n"
