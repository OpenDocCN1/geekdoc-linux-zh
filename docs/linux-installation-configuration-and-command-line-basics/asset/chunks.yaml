    ## 1.2 Linux 简简史


    与 UNIX 类似，Linux 操作系统有着不同的根源，它基于许多位大师的作品。其中包括理查德·M·斯尔曼（Richard M. Stallman）、安德鲁·S·塔能鲍姆（Andrew
    S. Tanenbaum）和林纳·托瓦尔斯（Linus Torvalds）。


    理查德·M·斯尔曼是 MIT 的一名黑客和开发者，自由软件基金会（FSF）的首任主席，GNU` 项目之父。`GNU` 是口号“GNU 不是 UNIX”的缩写。该项目的目标是开发一个自由的
    UNIX 操作系统。直到 20 世纪 90 年代初，工具集可用但内核仍然缺失。整个软件于 1983 年左右根据 `GNU 公共许可证`（`GPL`）发布。


    Linux 的下一步来自安德鲁·S·塔能鲍姆。当时他是阿姆斯特丹大学的教授。为了他的学生，他开发了 `Minix`，这是一个用于教学目的操作系统，旨在演示和理解
    UNIX 原则。正如他指出的，`Minix` 并非用于实际操作。


    林纳·托瓦尔斯是赫尔辛基大学的一名芬兰学生，他是 `Minix` 的用户，并对其限制并不满意。1990 年，他开始基于 `Minix` 的理念、UNIX 原则和
    `POSIX` 标准开发一个全新的操作系统。他的动力是拥有一个自己能理解且能最大限度利用硬件边界的系统。他还想寻找乐趣，并且没有任何商业意图。Linux 背后的整个故事记录在他名为《趣味人生》（`Just
    for Fun`）的自传中。如今，林纳·托瓦尔斯监督着 `Linux 内核` 的开发。


    为了让 Linux 对外部世界产生吸引力，它需要一个漂亮的标志。基于吉祥物竞赛，提交了大量的提案。拉里·尤因（Larry Ewing）提交了他关于书封面上企鹅的想法，他的提案获胜了。这只企鹅设计带有顽皮的微笑和丰满的身，名为
    `Tux`，代表了快乐且满意的用户形象。


    ## 1.3 Linux 的用途范围


    Linux 最初为基于 Intel 的系统设计，如今运行在各种平台上。其中包括 ARM 架构（命名为 `arm` 和 `arm64`）、Motorola/Freescale
    的 68k 架构（`m68k`）、Intel x86（`i386` 和 `amd64`）、IBM s390（`s390`）、PowerPC（`powerpc`）和
    SPARC（`sparc`）。


    从一开始开始，Linux 就专注于服务器系统。它作为 Web 服务器、文件服务器、邮件和新闻服务器、互联网网关、无线路由器和防火墙被持续使用。作为一个计算单元，它帮助渲染了视频序列以及泰坦坦号》、《史莱克》、《玩具总动员》。此外，Linux
    还应用于汽车产品、航天、军事、物流和工程领域。自 2006 年以来，Linux 服务器运行着世界上所有的交易所。它还运行着几乎所有的互联网搜索引擎。


    在过去的十年里，Linux 也征服了桌面。由于其极高的灵性和稳定性，它作为文本处理、图形设计、桌面出版、电子表格计算、通信（电子邮件、聊天、音频和视频）以及你的手机和电视的用户界面的可靠配置。


    ## 1.4 Linux 认证


    Linux 的广泛使用增加了对确清楚自己在做什么的工程师和用户的需求。在此时，获得 Linux 认证变得非常有优势。这些认证可以分为通用程序（不特定于某个发行版）和专项程序（特定于某个
    Linux 发行版）。下面的列表提供了目前存在的主要认证的概述。


    ### 非通用认证


    * Linux Essentials

    * LPIC-1: Linux 服务器专业认证

    * LPIC-2: Linux 工程师

    * Linux Foundation 认证系统管理员 (`LFCS`)

    * Linux Foundation 认证工程师 (`LFCE`)

    * CompTIA A+

    * CompTIA Network+


    ### 特定于发行版的认证


    * RedHat 认证工程师 (`RHCE`)

    * RedHat 认证系统架构师 (`RHCSA`)

    * RedHat 认证架构师 (`RCA`)

    * SUSE 认证管理员 (`SCA`)

    * SUSE 认证工程师 (`SCE`)

    * SUSE 企业架构师 (`SEA`)


    ## 2. 软件许可证


    与市场上的大多数产品一样，软件也附带相应的许可证。软件许可证描述了软件的使用方法并允许或限制其使用。对于商业软件，仅在相当严格的边界内允许更改和复制。例如，许可证限制你供
    5 个用户并行使用，并要求你获取另一个许可证块来添加第 6 或第 7 个用户。常见的许可证有微软的 `共享源代码` 和 `Apple 许可证`。


    对于开源软件，许可证的限制要少得多。明确允许更改和复制，在某些情况下甚至鼓励这样做，以便为每个用户和目的做出改进。目标是让软件现在和将来对所有人可用。这种所谓的“左拷贝”（`Copyleft`）原则确保每个人都有权根据需要进行调整，并且对涵盖软件的使用和分发的限制降到最低。用于单个
    Linux 组件及其工具的常用许可证是 `GNU 公共许可证`（`GPL`）、`BSD 许可证` 和 `Apache 许可证`。


    开源软件许可证遵循若干自由规则：


    * 为任何目的使用该程序（无限使用权 - `自由 0`）

    * 理解程序如何工作以及如何根据需求更改它（阅读程序源代码的权利 - `自由 1`）

    * 复制软件以帮助你的邻居（分发权 - `自由 2`）

    * 改进软件并发布你的更改，以便所有其他用户也能从你的改进中受益（`自由 3`）


