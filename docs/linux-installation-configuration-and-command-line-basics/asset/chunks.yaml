    Navigating LinuxFile systems on UNIX/Linux systems contain different types of
    entries. This includes regular files, directories (or folders), symbolic links,
    block and character devices, named pipes and sockets. This chapter deals with
    directories and the corresponding Linux tools.5.1 The Filesystem Hierarchy Standard
    (FHS)Modern Linux systems have a rather consistent directory structure, which
    is based on the Filesystem Hierarchy Standard (FHS). This definition specifies
    which main directories exist, and which content is stored in them. The FHS is
    maintained by the Linux Foundation. The latest version of the FHS is 3.0 and was
    released on 3 June 2015.The Linux distributions mentioned in Chapter 3 follow
    the FHS structure. Nevertheless, there are distribution-specific extensions. Below
    are the common directories that are in use:


    | Directory | Description |


    | / | primary hierarchy root and root directory of the entire file system hierarchy
    |


    | /bin | essential command binaries for all the users |


    | /boot | the boot loader |


    | /etc | abbreviates etcetera and contains host-specific system-wide configuration
    files |


    | /home | the home directories of the users |


    | /lib | libraries essential for the binaries in /bin and /sbin |


    | /media | mount points for removable media |


    | /proc | abbreviates processes and is the virtual file system of the Linux kernel
    |


    | /root | the home directory for the root user |


    | /sbin | essential system binaries |


    | /tmp | temporary data and files |


    | /usr | Unix System Resources, contains user utilities and applications |


    | /var | variable data, such as log files and database file s |


    Some Linux distributions have additional directories like /opt or use symbolic
    links. Linux also has some abbreviations in use. They can be quite helpful in
    your daily work:


    | Abbreviation | Description |


    | $HOME | local variable that contains the user’s home directory |


    | ~ | points to the user’s home directory like /home/tom |


    | . | points to the current directory |


    | .. | points to the parent directory |


    You can use these abbreviations on the command line in a terminal and in shell
    scripts to shorten commands. Next we will look at some of these commands.5.2 Commands
    for DirectoriesAs with files, Linux offers a range of commands to list, create,
    remove, change and rename directories. You can use these commands in your terminal.Listing
    DirectoriesIn order to list the directories use the command ls with the switch
    --directory (short -d) as follows:


    | $ ls -d */finances/projects/work/...$ |


    This example lists the names of the directories in the current directory. The
    line “...” in the output indicates that the list is longer and the output is shortened
    here. In order to list all the directories including the hidden ones starting
    with “.” you may type the find command as follows:


    | $ find . -maxdepth 1 -type d./projects./.mozilla./.ipython./.dbus./video...$
    |


    In order to learn more about the ls command and also list other entries, have
    a look at Chapter 6 which covers terminal commands.The tree command searches the
    directory recursively and outputs an entire directory structure quite nicely.
    The switch -d limits the output to directories and looks as follows:


    | $ tree -d.├── archive│      ├── ballet-zebola│       │      ├── documents│  
        │      └── invoices│      ├── charles-darwin-university├── projects├── .dbus├──
    .ipython├── .mozilla...$ |


    Creating DirectoriesIn order to create a directory, use the mkdir command (make
    directory). The next example creates a new entry named “training” in the current
