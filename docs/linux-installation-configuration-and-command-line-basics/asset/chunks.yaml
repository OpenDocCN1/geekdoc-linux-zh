  trans: '

    我们还提供了测试介质。这些包括 32 位和 64 位的实时镜像，允许你在向电脑上安装 Debian 之前进行尝试。在编写本文时，版本 9.5 是 Debian
    的当前稳定版本。此处描述的设置基于此版本和 `amd64` 架构。从 [www.debian.org/distrib](http://www.debian.org/distrib)
    下载网络镜像后，系统不再需要引用额外的静态镜像。相反，它依赖互联网连接来检索要安装的软件包并保持你的操作系统更新。整个过程将花费大约一小时，并允许你根据特定需求进行精简的软件选择。你不需要使用的软件包将不会出现在你的系统中。你可以在需要时随时添加它们。我们安装的目标系统是一个基于
    XFCE 的单用户桌面系统，配有网络浏览器和音乐播放器。网络浏览器我们使用 `Mozilla Firefox`，音乐播放器使用 `VLC`。这两个程序都是
    Linux 发行版的永久组件。我们用于演示的环境是一个基于 `VirtualBox` 的虚拟机，配置有 4 GB 内存和 15 GB 磁盘空间。


    ## 4.2 逐步安装 Linux


    ### 启动菜单

    为了开始安装 Debian，首先从你下载的 ISO 镜像启动电脑（在我们的案例是 `VirtualBox` 镜像）。如果你也使用虚拟机，请查看虚拟机供应商网站获取如何启用
    ISO 镜像的帮助。接下来，等待启动菜单在屏幕上出现。下图显示了提供的不同选项。使用方向键导航启动菜单，按 `Enter` 键选择项目。


    ![](img/image382.jpg)

    不同的选项有：


    *   图形化安装 (Graphical install)：使用图形化安装程序启动安装过程

    *   安装 (Install)：使用文本安装程序启动安装过程

    *   高级选项 (Advanced options)：选择更多选项，如专家模式、自动安装或救援模式（详细信息见下图）

    *   帮助 (Help)：获取进一步帮助

    *   带语音合成安装 (Install with speech synthesis)：带有语音支持启动安装过程


    ![](img/image397.jpg)


    从主启动菜单中选择 `Graphical install` 项，并按 `Enter` 键继续。


    ### 语言选择

    接下来，选择你希望在整个安装过程中使用的语言。对话框和消息将进行相应的翻译。此选择不会不可逆地决定你的 Linux 系统的语言，你以后可以随时选择不同的语言。下图显示了对话框。英语已被预选，因此你只需点击对话框右下角的
    `Continue` 按钮即可继续。


    ![](img/image404.jpg)


    ### 位置选择

    第三，对你的位置进行选择（见下图）。根据你之前设置的语言，列表将列出主要使用该语言的国家。这也会影响本地化设置，例如你电脑所在的时区。如果需要不同的设置，请选择列表末尾标题为
    `other`（其他）的项目并从那里开始。完成后，点击 `Continue` 按钮进入第四步。


    ![](img/image409.jpg)


    ### 键盘选择

    第四，从列表中选择你的键盘布局（见下图）。对于美国，预选是美英语 (American English)。如果你使用不同的键盘布局，请从列表中选择正确的项。完成后，点击
    `Continue` 按钮进入第五步。


    ![](img/image414.jpg)


    ### 网络设置

    第五步包括从 ISO 镜像加载安装程序组件，并检测网络硬件以加载正确的网络驱动程序。然后，安装程序尝试连接互联网，通过 `DHCP` 从你的本地网络服务器检索
    IP 地址。


    完成后，你可以设置电脑的主机名（见下图）。为你的机器选择一个唯一的名称，该名称由单个名称组成且在你的本地网络段中尚不存在。使用水果、地点、乐器、作曲家和电影角色名称是很常见的。在这种情况下，我们选择了名称
    `debian95`，它简单代表 Linux 发行版及其版本号。


    ![](img/image420.jpg)


    完成后，点击 `Continue` 按钮进入第六步，添加类似 `yourcompany.com` 的域名（见下图）。在本文情况下不需要。因此我们留空该输入字段。点击右下角的
    `Continue` 按钮继续安装。


    ![](img/image424.jpg)


    ### 用户与角色

    我们的 Linux 系统至少需要两个用户才能正常运行。一个是具有固定名称 `root` 的管理员用户，另一个是普通用户，在此案例中我们将其命名为 `User`。


    在接下来的两个步骤中，你为 `root` 用户设置密码（见下图），以及普通用户的全名和账户名。为了简单起见，我们使用 `Debian User` 作为全名，`User`
    作为账户名。对于这两个用户，请选择一个不同且你记得的密码。


    稍后你需要这些密码来登录电脑。


    ![](img/image430.jpg)


    ### 时区

    设置正确的时区对于与其他服务的通信非常重要，特别是在网络中。从下所示的列表中选择值。列表中的项目基于你之前选择的位置。完成后，点击 `Continue` 按钮定义存储介质及相应的分区。


    ![](img/image435.jpg)


    ### 存储介质与分区

    Linux 系统可以分布在多个不同的存储介质上，如硬盘和闪存。此外，一个存储介质可以划分为多个磁盘分区。为了实现这一点，Debian 的设置程序提供了以下方法（见下图）：


    *   引导式 - 使用整个磁盘 (Guided - use entire disk)：按照提供的步骤操作，并将整个磁盘用于 Linux 安装。这将创建固定大小的分区。

    *   引导式 - 使用整个磁盘并设置 LVM (Guided - use entire disk and set up LVM)：按照提供的步骤操作，并将整个磁盘用于
    Linux 安装。此选项利用逻辑卷管理 (`LVM`) 来创建以后可以更改大小的分区。

    *   引导式 - 使用整个磁盘并设置加密 LVM (Guided - use entire disk and set up encrypted LVM)：按照提供的步骤操作，并将整个磁盘用于
    Linux 安装。此选项利用逻辑卷管理 (`LVM`) 来创建以后可以更改大小的加密分区。

    *   手动 (Manual)：单独创建分区。这是专家模式，需要关于分区和文件系统参数的更深知识。


    ![](img/image449.jpg)


    从列表中选择 `Guided - use entire disk` 项。分区大小的值根据经验通过算法实现选择。不需要手动计算。点击右下角的 `Continue`
    按钮继续安装。


    接下来，选择要分区的磁盘。在我们的案例中，只有一个可用磁盘（见下图）。在指南的后文中，该磁盘将统称为 `/dev/sda`（第 1 个 SCSI 磁盘）。


    ![](img/image454.jpg)


    磁盘分区是指存储介质上单独组织的部分，旨在包含 Linux 文件系统树的一个分支。没有通用的方法来正确进行这种分离。本指南展示了一个适用于基础系统的简单且安全的解决方案。对话框中的菜单提供以下选项：


    *   所有文件在一个分区中 (All files in one partition)：仅使用单个分区存放程序和用户数据

    *   单独的 /home 分区 (Separate /home partition)：将程序和用户数据存储在单独的分区中

    *   单独的 /home, /var 和 /tmp 分区 (Separate /home, /var, and /tmp partitions)：将用户数据、变量数据和临时数据保持在单独的分区中

    '
