  trans: '

    如如下所示，选择第三项 `Separate /home`, `/var`, and `/tmp` partitions`。点击右下角的 `Continue`
    按钮继续安装。(image466.jpg)


    下一步是确认分区方案。该方案是根据经验自动计算，包含以下分区：


    *   `sda1`：第一个 SCSI 磁盘的第一个分区是主分区，大小为 3 GB，使用 `ext4` 文件系统格式，称为文件系统树的根部分（用 `/` 表示）

    *   `sda5`：第一个 SCSI 磁盘的第五个分区是逻辑分区，大小为 1.3 GB，使用 `ext4` 文件系统格式，用于存储文件系统树的变量数据（用
    `/var` 表示）

    *   `sda6`：第一个 SCSI 磁盘的第六个分区是逻辑分区，大小为 3.3 GB，格式为交换文件系统（swap）

    *   `sda7`：第一个 SCSI 磁盘的第七个分区是逻辑分区，大小为 311 MB，使用 `ext4` 文件系统格式，用于存储文件系统树的临时数据（用
    `/tmp` 表示）

    *   `sda8`：第一个 SCSI 磁盘的第八个分区是逻辑分区，大小为 8.8 GB，使用 `ext4` 文件系统格式，用于存储文件系统树的用户数据，即主目录（用
    `/home` 表示）


    由于历史原因，一个硬盘只能包含四个主分区。如果第四个分区被划分为所谓的逻辑分区或逻辑驱动器，则称为 `Extended Partition`。在我们案例中，逻辑分区
    `/dev/sda5`、`/dev/sda6`、`/dev/sda7` 和 `/dev/sda8` 存储在主分区 `/dev/sda4` 上。分区 `/dev/sda2`
    和 `/dev/sda3` 未使用。(image482.jpg)


    从上述列表中选择 `Finish partitioning and write changes to disk` 项。点击右下角的 `Continue` 按钮继续并确认分区方案（见下图）。从列表中选择
    `yes` 并点击 `Continue` 按钮对磁盘分区。请注意，所选存储设备上的所有数据将丢失，且磁盘将为空。(image486.jpg)


    在将存储介质划分为分区后，分区将按照之前定义的文件系统进行格式化。在我们案例中，分区 `/dev/sda1`、`/dev/sda5`、`/dev/sda7`
    和 `/dev/sda8` 将获得 `ext4` 文件系统，分区 `/dev/sda6` 将获得交换文件系统。一旦完成此步骤，接下来将安装 Debian 的基础系统。


    ## 软件包管理


    ISO 镜像包含了安装程序和若干用于设置 Linux 系统的软件包。例如，这包括下方将安装的 Linux 内核。(image492.jpg)


    接下来，你需要决定是否使用额外的安装介质。在我们案例中，我们只有一个安装磁盘，因此可以从菜单中选择 `No`（见下图）。然后点击 `Continue` 按钮继续。(image496.jpg)


    如前所述，Debian 的软件是以包的形式组织的。这些包在多个软件存储库中提供。存储库通过由大学、个人、公司和其他组织维护的软件包镜像提供。这些镜像位于不同的国家。


    在下一步中，你必须决定从哪个国家获取你的 Debian 软件包。建议选择地理位置上离你最近的镜像，以尽量减少数据通过网络从镜像传输到你电脑的时间。作为第一步，选择你所在的国家。(image501.jpg)


    作为第二步，从列表中选择一个首选镜像（见下图）。列表包含了大学、互联网提供商、政府服务和其他组织。(image505.jpg)


    如果你的计算机网络包含用于与外界通信的代理服务器，请在此处输入相应信息。在我们案例中没有代理，因此留空字段。点击 `Confirm` 按钮继续。(image509.jpg)


    一旦设置好单个参数，Debian 安装程序将连接到之前选择的软件包镜像并那里获取软件包列表。软件包列表包含可用包，包括名称、大小和描述。取决于网络连接的质量和带宽，此步骤可能需要一段时间。(image513.jpg)


    接下来，你会被要求参加 `Popcon`，即 Debian 软件包受欢迎调查（见下图）。此信息可选可选，仅供负责 Debian 软件包的开发者团队使用。根据
    `Popcon`，他们找出哪些 Debian 软件包安装频率最高。该信息直接影响安装镜像的准备，以及针对不同架构保留或舍弃哪些包。在我们案例中，我们不参与
    `Popcon`，将选择留在 `No`。点击 `Confirm` 按钮继续选择软件任务 (`tasksel`)。(image518.jpg)


    ## 软件选择


    Debian 提供精心安排的软件包选择，称为“任务”（tasks）。其后的思想是将特定用途的软件包分组，以简化安装。从对话框中的列表（见下图），你可以选择不同的桌面环境，以及
    Web 服务器、打印服务器、SSH 服务器和标准系统实用程序。要进行最小化安装，只需启用列表最后两项。我们将稍安装 `XFCE` 桌面环境。(image523.jpg)


    确认软件选择后，Debian 安装程序将从软件包镜像检索所需的包、解压并安装。下方的进度条显示进度。在我们案例中，需要下载 140 个软件包。(image527.jpg)


    ## 设置 GRUB


    为了启动新安装的 Debian 系统，我们也必须设置这些信息。这个过程被称为系统引导。处理这一步骤的软件组件名为 `Grand Unified Boot Loader`（准确说是
    `GRUB` 或 `GNU GRUB`）。`Yes` 项已预选，因此我们可以点击 `Continue` 继续。(image532.jpg)


    Debian 安装程序需要知道在哪里安装 `GRUB`。下图中的菜单列出了需要考虑的存储介质。在我们案例中，我们选择列表中的第二项 (`/dev/sda`)。然后点击
    `Continue` 继续。(image536.jpg)


    现在基础安装已接近完成，剩下的工作只需读取一个对话框。


    ## 完成安装


    以下对话框告知你安装已完成。点击 `Continue` 重启新安装的系统。(image542.jpg)


    几秒钟后屏幕上将出现文本版本的 `GRUB` 启动菜单（见下图）。启动菜单包含两个选项：`Debian GNU/Linux` 和 `Advanced options
    for Debian GNU/Linux`。第一个菜单项被选中并预选。第二个菜单项允许你设置特定的启动选项。要查看这些选项的完整列表，请参考 [www.gnu.org/software/grub/manual/grub](http://www.gnu.org/software/grub/manual/grub)
    中的 `GNU GRUB` 手册。


    保持第一个菜单项选中并按 `Enter` 继续并启动新系统。(image547.jpg)


    你的 Debian 系统将启动并初始化必要的系统服务。这一步骤需要几秒完成。最后，在名为 `tty1` 的第一个文本终端上（见下图）将看到一个黑白屏幕，并要求你登录系统。(551.jpg)


    登录提示由两部分组成：你的 Linux 系统主机名 (`debian95`)，后面跟着一个空格和单词 `login`。


    ```

    | Debian GNU/Linux 9 debian95 tty1debian95 login: _ |

    ```

