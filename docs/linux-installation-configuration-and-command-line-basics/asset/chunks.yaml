    \n## 1. 什么是 Linux？\nLinux 是一个基于 UNIX 的操作系统，其核心由成千万万人维护。今天，Linux 是开发者中最受欢迎的。\n\n\
    ### 1.1 从 UNIX 到 Linux\nLinux 的历史可以追溯到 90 年代。为了理解 Linux 背后的故事，我们还需回顾一下早期的。\n\n\
    ### 1.2 Linux 简史\n在 1965 年，多路用信息计算服务 (`Multics`) 开始开始。Multics 是麻省理工学院 (MIT)、通用电气\
    \ (GE) 和贝尔实验室 (Bell Labs) 合作的结果。在 Ken Thompson 和 Dennis Ritchie 的领导下，他们开发的主要产品是\
    \ `Unics`。后来它被命名为 `UNIX`。当时的 UNIX 操作系统主要在加州大学伯克利分校使用。\n\n### UNIX\n### UNIX 变体\n\
    UNIX 的概念被许可给几家公司，它们开发并维护了自己的 UNIX 变体。这包括 `Solaris/SUN OS` (`SUN Microsystems$，现由\
    \ `Oracle` 所有)、`AIX` (`IBM`)、Scenix (`Siemens`)、`SCO UNIX`、`Xenix` (`Microsoft`)\
    \ 以及 `HP-UX` (`Hewlett-Packard`)、`NeXTSTEP`、`Mac OS` (`Apple`) 和 `Android` (`Google`)。开源实现包含了伯克利系统发行\
    \ (`BSD`) 及其变体：`NetBSD`、`OpenBSD` 和 `FreeBSD`。\n\n### UNIX 哲学\nUNIX 在设计时考虑了许多严格的原则。这些原则涵盖了可移植性、多任务和多用户导，并结合了分时方法。此外，它基于网络连接，遵循\
    \ `TCP/IP` 方案。\n\n原始开发是使用 `C` 编程语言进行的，这导致了对硬件的独立。它附带了一系列开发工具和库，允许你轻松扩展到你特定的需求。\n\
    \n### 工具\nUNIX 类似于一个工具箱，由各种工具组成。每个工具都有特定的目的，并专为该任务设计。其核心思想是每个任务使用一个工具。为了实现更复杂的目标，你会把多个工具组合成链。\n\
    \n"
