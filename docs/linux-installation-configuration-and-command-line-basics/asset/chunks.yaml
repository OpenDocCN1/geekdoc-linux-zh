    登录系统后，你将添加额外的软件以能够基于 XFCE 桌面的图形用户界面。在安装过程的这一步，添加额外的软件只能通过管理员 root 用户身份登录来完成。要这样做，请在登录提示符输入
    `root`，按 `Enter`，等待 `Password:` 文本出现，然后输入你之前为 root 用户设置的密码。Linux 系统将用一条登录消息欢迎你（见下图）。登录消息的第一行将显示你上次登录的时间，随后是当前运行的
    Linux 内核版本（第二行）以及使用建议（第五行到第八行）。![](img/image566.jpg) 在显示欢迎消息后，Debian 会打开一个命令行提示符：


    ```

    root@debian95 ~# |

    ```


    该命令行提示符由四个部分组成：


    * `root`: 登录用户的名称

    * `debian95`: Linux 系统的主机名

    * `~`: 当前目录。在这种情况下，它是当前登录用户的家目录。如果没有其他设置，它对于普通用户定义为 `/home/username`，对于管理员用户定义为
    `/root`。`~` 只是它的缩写。

    * `#`: 登录符号。`#` 符号代表 root 用户，而 `$` 用于没有管理员权限的普通用户


    **重要提示**：你现在以管理员 root 用户身份登录。请小心你输入的命令，如果有疑问请检查两次。任何错误都可能导致需要重新安装或修复你的 Linux 系统。


    ## 4.3 添加图形用户界面


    在当前阶段，Debian 系统已完全激活并可以用于生产环境。对于适用于普通用户的桌面系统，它仍然缺少一个漂亮且易用的图形用户界面。在这一步，我们将改变这一点并安装
    XFCE 桌面管理器。为了这样做，我们将安装以下软件包：


    * `aptitude` 包管理器

    * `xdm` 显示管理器

    * `xfce4` 桌面环境


    Debian 使用软件包管理器 `apt` 来处理软件包及相关包列表的安装、更新和删除。此外，`apt` 还会解决所有的包依赖并确保相关软件在系统上可用。在我们案例中，需要从软件包镜像检索并安装总计约
    450 MB 的数据/软件。如前，这需要可用的互联网连接来下载所需的软件包。要安装这三个软件包，请在命令行提示符输入以下命令。只需在 `#` 符号后输入命令即可：


    ```

    root@debian95 ~# apt-get install aptitude xdm xfce4 |

    ```


    `apt` 将显示有关要安装软件包的更多信息。这包括依赖包列表和推荐包。最后，你将看到一个命令行提示符。输入 `Y` 或按 `Enter` 安装 `aptitude`、`xdm`
    和 `xfce4` 以及相关的依赖包。对于 `xdm` 显示管理器，必须确认两个对话框（见下图）。按两次 `Enter` 确认使用 `xdm`![](img/image607.jpg)![](img/image610.jpg)


    检索要安装的软件软件包需要一些时间。完成后，命令行提示符将再次出现。为了激活有关图形桌面环境的更改，请重启系统。在命令行提示符上所示输入命令 `reboot`：


    ```

    root@debian95 ~# reboot |

    ```


    重启 Linux 系统后，Debian 用一个图形化启动屏幕欢迎我们（见下图）。按 `Enter` 以默认设置启动 Linux 系统。(image621.jpg)
    几秒钟后，将看到图形化登录界面（见下图）。使用之前创建的名为 `user` 的普通用户登录系统。输入 `user`，按 `Enter` 并输入用户的密码。然后再次按
    `Enter` 确认并登录。(image625.jpg)


    接下来，将看到 XFCE 桌面（见下图）。桌面带有若干默认元素：一个顶部导航栏、底部导航栏和桌面图标。这些元素在下文中有详细解释。(image629.jpg)


    * **顶部导航栏**：显示访问不同应用程序、四个虚拟桌面、时钟以及各种用户操作按钮，例如锁定屏幕、切换用户、切换到待机模式和退出当前会话。

    * **底部导航栏**：此栏包含几个按钮，用于隐藏所有打开的窗口并显示空桌面、打开终端、文件管理器、网络浏览器、查找应用程序以及直接用家目录打开文件管理器。

    * **桌面图标**：从上到下有垃圾箱、链接到计算机的文件管理器图标以及家目录


    在桌面上右键点击可以打开一个菜单，允许你访问各种应用程序（见下图）。image640.jpg)


    ## 4.4 添加额外软件


    到目前，你的 Linux 系统上可用的软件相当有限。下一步要做的工作是添加以下四个 Debian 软件包，让你的生活变得简单一点：


    * `firefox-esr`: 浏览器 Mozilla Firefox（扩展支持版）

    * `gnome-terminal`:由 GNOME 项目维护的终端模拟器

    * `screensaver`:X11 系统的基础锁屏程序

    * `vlc`:视频播放器 Video Lan Client (VLC)


    这三个软件包的安装将通过终端模拟器中的命令行完成（我们将在指南稍后的部分详细介绍终端）。目前，你的系统上安装了 X11 终端模拟器 `xterm`。要打开
    `xterm`，请点击底部导航栏中的终端按钮，或从上下文菜单中选择 `Application > System > Xterm`。第一步，打开 `xterm`。接下来，在命令行提示符旁输入命令
    `su` 并按 `Enter`：


    ```

    user@debian95: ~$ suPassword: |

    ```


    你可能记得之前的步骤提到，只有管理员用户才能 Debian 系统上安装、更新或删除软件。`su` 命令是 switch user（切换用户）的缩写，并改变你的当前角色。在不带额外名称的情况下使用，角色将变为管理员
    root 用户。在密码提示符输入管理员用户的密码并按 Enter。作为管理员用户，安装软件包：`firefox-esr`、`gnome-terminal`、`screensaver`
    和 `vlc` 如下：


    ```

    root@debian95: ~# apt-get install firefox-esr gnome-terminal xscreensaver vlc
    |

    ```


    输出所示：image673.jpg 安装四个软件包后，你可以切换回普通用户角色。按 `Ctrl+D` 退出管理员部分，再次按 `Ctrl+D` 关闭 `xterm`。


    安装 Firefox 产生以下影响：


    * 应用程序菜单中出现了新软件 `Firefox`

    * 命令行出现了新命令 `firefox`

    * 底部导航栏中的地球图标链接到 Firefox 浏览器

    * 安装 GNOME 终端软件包产生以下影响：

    * 新软件 `gnome-terminal` 均可通过命令行和应用程序菜单可用

    * 底部导航栏中的终端图标指向 GNOME 终端

    * 上下文菜单中的“在此处打开终端”项指向 GNOME 终端


