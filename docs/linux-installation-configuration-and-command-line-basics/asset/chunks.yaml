    When selecting a distribution, we recommend one that is stable, that is updated
    regularly and fits into the purpose you need the computer for. Below you will
    find a short description for each of the Linux distributions mentioned above.![](image254.jpg)Debian
    GNU/LinuxEstablished in 1993, Debian GNU/Linux (Debian for short) is an entirely
    free and community-based operating system that follows the GNU principles. More
    than 1,000 developers continuously work on it based on their own free will. Behind
    Debian is no company and there are no business interests involved .One design
    goal is to have a stable and reliable operating system for computers that are
    actively delivering services. It is targeted to users who know what they want
    and have experience. The Debian developers maintain and use their own software.
    The packages are made available in .deb format, and are divided into categories
    according to the following licenses:


    *   Main: free software


    *   Contrib: free software that depends on non-free software


    *   Non-free: packages that have a non-free license


    Debian works excellent on both servers and desktop systems. A range of architectures
    are supported like ARM EABI (arm), IA-64 (Itanium), mips, MIPSel, powerpc, s390
    (32 and 64 bit), as well as sparc, i386 (32 bit) and amd64 (64 bit). The code
    name of each release is based on the name of a character from the film Toy Story,
    such as Stretch for Debian GNU/Linux 9.![](image270.jpg)UbuntuUbuntu is a free
    Linux distribution that is financed by the company Canonical Ltd. It is based
    on Debian but focuses on beginners instead. That’s why it contains just one tool
    per task. Also, the Ubuntu team tries to incorporate brand new elements that lack
    stability. The packages are made available in .deb format, and are divided into
    categories according to their support from Canonical:


    *   Main: free software, supported by Canonical


    *   Restricted: non-free software, supported by Canonical


    *   Universe: free software, unsupported


    *   Multiverse: non-free software, unsupported'
