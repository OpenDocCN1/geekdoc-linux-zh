- fmt: "\nThe `su` command changes the current role permanently. In order to run only\
    \ a single command as an administrative user, use the `sudo` command. This requires\
    \ the Debian “sudo” package to be installed (refer to Chapter 4 on installing\
    \ additional software) and the additional user to be added to the configuration\
    \ file `/etc/sudoers` using the `visudo` command. This step will be explained\
    \ in further detail later on.\n\n### adduser\nThe `adduser` command creates new\
    \ user accounts. The image below shows the information that is required. This\
    \ includes a new entry in the file `/etc/passwd` as well as the creation of a\
    \ new group, plus home directory. Furthermore, prepared data from the directory\
    \ `/etc/skel` is copied into the previously created home directory. Afterward,\
    \ the account information is modified using the `chsh` command (see earlier in\
    \ this chapter).\n\n![](image1738.jpg)\n\nHaving set up the new user, the entry\
    \ in the file `/etc/passwd` looks as follows:\n\n![](image1742.jpg)\n\nDeleting\
    \ user accounts and modifying user accounts is done with the help of the two commands\
    \ `deluser` and `usermod`. The usage of these commands will be explained in further\
    \ detail later on.\n\n### 7.4 Process Management\n\n### ps\nThis command lists\
    \ the running processes of your Linux system. The image below shows the processes\
    \ in your current terminal session, where the call `ps ax` (see the image thereafter)\
    \ lists all the processes in your Linux system. The `ps` command has a long list\
    \ of options that will be explained later on in more detail.\n\n![](image1749.jpg)\n\
    ![](image1752.jpg)\n\n### pgrep\n`pgrep` is the `grep` command (see earlier in\
    \ this chapter) for processes. This command looks through the currently running\
    \ processes and outputs the process ID’s that match the given pattern. \n\nThe\
    \ image below shows two calls. The first call asks `pgrep` to search for the processes\
    \ that have the string pattern “xterm” in its name, and to output the resulting\
    \ process ID only. The second call uses the two options `-l` (short for `--list-name`)\
    \ and `-a` (short for `--list-full`) in order to show the process ID and the resulting\
    \ process name.\n\nThe partner of `pgrep` is `pkill`. Both commands are part of\
    \ the Debian “procps” package (refer to Chapter 4 on how to install additional\
    \ software packages).\n\n![](image1759.jpg)\n\n### kill\nThis command sends a\
    \ specific signal to a process. In order to terminate this process use the `SIGTERM`\
    \ signal. The next example shows how to end the process that has the process ID\
    \ 12345.\n\nThe `kill` command requires a process ID to work properly. Use `ps`\
    \ or `pgrep` to obtain the according process ID first (see earlier in this chapter).\n\
    \n```\n$ kill 12345\n```\n\n### killall\nThis command is part of the essential\
    \ Debian package “psmisc” (refer to Chapter 4 on installing additional packages).\
    \ `killall` sends a signal to all the processes that match the specified command.\
    \ As an example, the command\n\n```\nkillall firefox\n```\n\nsends the signal\
    \ `SIGTERM` to all the processes that have the name “firefox” in order to terminate\
    \ the process. Amongst other options, `killall` allows these parameters:\n\n-\
    \ `-e` (short for `--exact`): require an exact match\n- `-I` (short for `--ignore-case`):\
    \ treat the process name case-insensitive\n- `-i` (short for `--interactive`):\
    \ interactively ask for confirmation before terminating the process\n- `-v` (short\
    \ for `--verbose`): send a confirmation message if the process terminated\n\n\
    The following example shows how to combine the two commands `pgrep` and `killall`.\
    \ First, obtain the process ID using `pgrep` as well as the exact name of the\
    \ process. Second, invoke `killall` with the two options `-i` and `-v` to terminate\
    \ all the processes that have that name. Prior to killing the processes `killall`\
    \ asks you for confirmation, and afterward outputs a confirmation message.\n\n\
    ![](image1792.jpg)\n\n### pkill\nThe two commands `pkill` and `pgrep` (see earlier\
    \ in this chapter) belong to the same software package. Whilst `pgrep` scans the\
    \ process list and outputs the process ID, the `pkill` command will send the termination\
    \ signal to the processes that match the given pattern. In order to terminate\
    \ all the “xterm” processes, invoke the following command:\n\n```\n$ pkill xterm\n\
    ```\n\n### top\nThe `top` command displays the processes according to their activity.\
    \ The most active process is on top, followed by the less active ones. The list\
    \ is updated every second. The single columns contain the process ID (titled `PID`),\
    \ the username of the owner of the process (titled `USER`), the process priority\
    \ (titled `PR`), the nice level (titled `NI`), the virtual memory usage (titled\
    \ `VIRT`), the reserved memory (titled `RES`), the shared memory (titled `SHR`),\
    \ both the percentile CPU and memory usage (titled `%CPU` and `%MEM`), the running\
    \ time of the process (titled `TIME+`) as well as the command that was used to\
    \ invoke the process (titled `COMMAND`).\n\nIn order to quit `top` press the `q`\
    \ key.\n\n![](image1808.jpg)\n\n### htop\n“htop” is an additional software package\
    \ (refer to Chapter 4 on installing additional packages) and contains a more interactive\
    \ version of `top` (which we mentioned above). The arrangement of the columns\
    \ is similar to `top`. Use the navigation and function keys in order to select\
    \ the processes, sort them, or delete them. The function keys are:\n\n- `F1`:\
    \ show help\n- `F2`: configure htop\n- `F3`: search within the process list\n\
    - `F4`: filter the terminal output\n- `F5`: display the processes as a process\
    \ tree\n- `F6`: change the sort order of the processes\n- `F7`: decrease the nice\
    \ level of the selected process\n- `F8`: increase the nice level of the selected\
    \ process\n- `F9`: terminate the selected process\n- `F10`: quit the program\n\
    \n![](image1834.jpg)\n\n### 7.5 Network and System Information\n\n### uname\n\
    `uname` abbreviates the term “UNIX name”. The command displays system information\
    \ such as the exact name and version of the Linux kernel and the hostname of your\
    \ computer.\n\nThe image below shows the call of the `uname` command with the\
    \ parameter `-a` (short for `--all`). The output contains the name of the operating\
    \ system (Linux), the hostname (debian95), the kernel version and its build date\
    \ (4.9.8-7-amd64 #1 SMP Debian 4.9.110-1 (2018-07-05)) as well as the architecture\
    \ of the system (x86_64).\n\n![](image1841.jpg)\n\n### uptime\nThis command shows\
    \ how long the system is running. It displays the current time (07:36:47) followed\
    \ by the uptime in hours (21:56), the number of logged in users (1 user) and the\
    \ average load (load average: 0.47, 0.43, 0.29) for the last 1, 5 and 15 minutes.\n\
    \n![](image1846.jpg)\n\nIn order to see the uptime in a nicer way, use the option\
    \ `-p` (short for `--pretty`). The image below displays a more human-readable\
    \ version of the information. The system is up 22 hours and 3 minutes.\n\n![](image1850.jpg)\n\
    \n### ip\nThe `ip` command (along with the two keywords `address show` ) displays\
    \ the current network configuration. The image below shows the loopback interface\
    \ (`lo`) and the ethernet interface (`enp0s3`). The ethernet interface is configured\
    \ with the IP address `10.0.2.15`. The network interfaces are abbreviated as follows:\n\
    \n- `lo`: the loopback interface. It is used to access local services such as\
    \ a proxy or web server http://127.0.0.1/\n- `eth0`: the first Ethernet interface\
    \ connected to a network switch or router\n- `wlan0`: the first wireless interface\n\
    - `ppp0`: the first point-to-point interface, used to connect via VPN or dial-up\
    \ service\n"
