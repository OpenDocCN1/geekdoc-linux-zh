    As shown in the image below, choose the third entry `Separate /home`, `/var`,
    and `/tmp` partitions`. Click the `Continue` button on the lower-right corner
    to proceed with the installation.![](image466.jpg)


    The next step is to confirm the partition scheme. This is calculated automatically
    based on experience and contains these partitions:


    *   `sda1`: the first partition of the first SCSI disk is a primary partition
    with a size of 3 GB, formatted with the `ext4` file system, and referred to as
    the root part of the file system tree (indicated with `/`)

    *   `sda5`: the fifth partition of the first SCSI disk is a logical partition
    with a size of 1.3 GB, formatted with the `ext4` file system, and reserved to
    store variable data of the file system tree (indicated with `/var`)

    *   `sda6`: the sixth partition of the first SCSI disk is a logical partition
    with a size of 3.3 GB, formatted as a swap file system

    *   `sda7`: the seventh partition of the first SCSI disk is a logical partition
    with a size of 311 MB, formatted with the `ext4` file system, and reserved to
    store temporary data of the file system tree (indicated with `/tmp`)

    *   `sda8`: the eighth partition of the first SCSI disk is a logical partition
    with a size of 8.8 GB, formatted with the `ext4` file system, and reserved to
    store the user data of the file system tree aka home directories (indicated with
    `/home`)


    Due to historical reasons a hard disk can contain four primary partitions only.
    The fourth one is called an `Extended Partition` if divided into so-called logical
    partitions or logical drives. In our case the logical partitions `/dev/sda5`,
    `/dev/sda6`, `/dev/sda7` and `/dev/sda8` are stored on the primary partition `/dev/sda4`.
    The partitions `/dev/sda2` and `/dev/sda3` are not in use.![](image482.jpg)


    From the above list, choose the entry `Finish partitioning and write changes to
    disk`. Click the `Continue` button on the lower-right corner to proceed and to
    confirm the partition scheme (see below image). Choose `yes` from the list and
    click the `Continue` button to partition the disk. Note that all the data on the
    selected storage device will be lost and the disk will be empty.![](image486.jpg)


    Having divided the storage media into single partitions, the partitions will be
    formatted with the file system as defined before. In our case the partitions `/dev/sda1`,
    `/dev/sda5`, `/dev/sda7` and `/dev/sda8` will get an `ext4` file system, and the
    partition `/dev/sda6` will get a swap filesystem. As soon as this step is completed,
    the base system of Debian will be installed next.


    ## Package Management


    The ISO image contains the installer and a number of packages to set up the Linux
    base system. For example this includes the Linux kernel being installed below.![](image492.jpg)


    Next you need to decide whether to use additional installation media or not. In
    our case we have just a single installation disk and can consequentially select
    `No` from the menu (see image below). Then click the `Continue` button to proceed.![](image496.jpg)


    As pointed out earlier, the software for Debian is organized in packages. These
    packages are provided in multiple software repositories. The repositories are
    made available via package mirrors that are maintained by universities, private
    persons, companies and other organizations. These mirrors are located in different
    countries.


    In the next step you will have to decide from which country you would like to
    retrieve your Debian packages. It is recommended to choose a mirror that is geographically
    located near you to minimize the time that is needed to transport the data from
    the mirror to your computer via network. As an initial step, choose your desired
    country.![](image501.jpg)


    As a second step choose a preferred mirror from the list (see image below). The
    list contains universities, internet providers, government services and other
    organizations.![](image505.jpg)


    In case your computer network includes a proxy server to communicate with the
    outside world, enter the according information here. In this case we don’t have
    that and leave the entry field empty. Click the `Confirm` button to proceed.![](image509.jpg)


    As soon as the single parameters are set, the Debian installer connects to the
    previously selected package mirror and retrieves the package lists from there.
    A package list contains the packages that are available, including the name, size
    and description. Depending on the quality and bandwidth of your network connection
    this step can take a while.![](image513.jpg)


    Next, you are asked to take part in `Popcon`, the Debian package popularity contest
    (see image below). This information is optional, and is used only by the team
    of developers that is responsible for the Debian packages. Based on `Popcon`,
    they figure out which Debian packages are the ones that are installed most often.
    The information has a direct influence on the preparation of installation images
    and which packages to keep or to dismiss for the different architectures. In our
    case we do not participate in `Popcon`, and leave the selection to `No`. Click
    the `Confirm` button to proceed with the selection of software tasks (`tasksel`).![](image518.jpg)


    ## Software Selection


    Debian offers carefully arranged selections of packages, so-called tasks. The
    idea behind them is to group packages for specific uses in order to simplify the
    installation. From the list in the dialog window (see image below) you can choose
    between different desktop environments, as well as a web server, a print server,
    a SSH server and the standard system utilities. To have a minimal installation
    just enable the last two entries from the list. We will install the `XFCE` desktop
    environment later.![](image523.jpg)


    Having confirmed the software selection, the Debian installer retrieves the needed
    packages from the package mirror, unpacks and then installs them. The bar below
    shows the progress. In this case 140 packages have to be downloaded.![](image527.jpg)


    ## Setting up GRUB


    In order to start our newly installed Debian system, we have to set this information
    too. This process is called booting the system. The software component that handles
    this step is named `Grand Unified Boot Loader` (`GRUB` or `GNU GRUB` to precise).
    The entry `Yes` is already pre-selected, and so we can click `Continue` to proceed.![](image532.jpg)


    The Debian installer needs to know where to install `GRUB`. The menu in the image
    below lists the storage media to be considered. In our case we choose the second
    entry from the list (`/dev/sda`). Then, click `Continue` to proceed.![](image536.jpg)


    Now that we are nearly finished with the basic installation, the only thing left
    to do is just a single dialog box to read.


    ## Finishing the Installation


    The following dialog box informs you that the installation is complete. Then click
    `Continue` to reboot the newly installed system.![](image542.jpg)


    After a few seconds, the text-based `GRUB` boot menu will appear on the screen
    (see image below). The boot menu includes two options: `Debian GNU/Linux` and
    `Advanced options for Debian GNU/Linux`. The first menu item is highlighted and
    pre-selected. The second menu entry allows you to set specific boot options. For
    a comprehensive list of these options have a look at the `GNU GRUB` manual at
    [www.gnu.org/software/grub/manual/grub](http://www.gnu.org/software/grub/manual/grub)


    Keep the first menu item selected and press `Enter` to proceed and boot the new
    system.![](image547.jpg)


    Your Debian system will start and initialize the necessary system services. This
    step will take a few seconds to be completed. Finally, a black-and-white screen
    will be visible on the first text terminal named `tty1` (see image below) and
    ask you to log into the system.![](551.jpg)


    The login prompt consists of two components: the hostname of your Linux system
    (`debian95`) followed by a space and the word `login`.


    ```

    | Debian GNU/Linux 9 debian95 tty1debian95 login: _ |

    ```

