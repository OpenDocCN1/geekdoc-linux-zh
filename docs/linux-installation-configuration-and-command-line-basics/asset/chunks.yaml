    这确保了可用软件的质量不断提高，并且每个人都能获得这些改进。使用 `GPL` 时，更改必须使用相同的许可证发布。其他如 `BSD` 之类的开源许可证则没有这种强制性要求。


    # 3. 生活中的 Linux


    有几个术语可能会让 Linux 初学者感到困惑。首先是它的名称，`Linux` 与 `GNU/Linux`。正如第 1 章之前描述的，`Linux` 术语仅指
    `Linux` 内核。在实际上，许多用户将 `Linux` 称为整个操作系统，即内核加上库和工具。此外，`Linux` 一词也用于包含所有在 `Linux`
    上运行的或为这个伟大的操作系统提供的程序。


    此外，`GNU/Linux` 的描述需要进一步理解。带有此名称前缀的 Linux 发行版通过 `GNU` 实现的系统工具和程序来充实。其中一个例子是 `Debian
    GNU/Linux`。正如第 1 章所指出的，`GNU` 项目起源于理查德·M·斯尔曼（Richard M. Stallman）的倡议以及他开发自由 `UNIX`
    系统的梦想。基于他在 MIT 的经验以及与其他同事的合作，他选择使用已有的自由软件来重写他需要的工具。这包括 `TeX` 排版系统以及 `X11` 窗口系统。他尽可能在
    `GPL` 许可证下发布这些重写后的工具，以便让任何感兴趣的人都能免费使用他的工作。


    接下来我们将更详细地查看不同的 Linux 发行版。


    ## 3.1 什么是 Linux 发行版？


    Linux 发行版是一组相互配合的软件包集合。一个发行版由一个软件开发者团队维护。团队的每个成员专注于发行版中不同的包。他们作为一个团队，共同确保单个软件包是最新的，并且不会与该发行版同一发布版本的其他包发生冲突。


    截至 2018 年，对于 `Debian GNU/Linux` 9，官方仓库包含超过 51,000 个不同的包。仓库是具有特定目的的包目录。`Debian
    GNU/Linux` 根据开发状态对其包进行分类。官方仓库名为 `stable`，反映了当前发布的稳定包。其他仓库命名为 `testing` 和 `unstable`，工作方式相同，但不被视为官方包。


    通常，一个 Linux 发行版包含 `Linux` 内核包、引导加载程序、`GNU` 工具和库、带有窗口环境的图形桌面环境，以及额外的软件，如网络浏览器、电子邮件客户端、数据库和文档。软件以两种方式提供：源代码和编译后的二进制包。这允许你理解软件是如何设计的，对其进行研究并根据你的个人需求进行调整。这一步被描述为第
    2 章列表中的自由 1。


    根据 Linux 发行版的侧重点不同，它还包含特定用途的包，例如网络或取证工具、用于教育目的科学软件以及多媒体应用。更多细节见下文。


    ## 3.2 哪些 Linux 发行版？


    根据 Distrowatch 的数据，存在超过 600 个不同的 Linux 发行版。主要发行版包括 `Debian GNU/Linux`、`Ubuntu`、`Linux
    Mint`、`Red Hat Enterprise Linux` (`RHEL`)、`Fedora`、`CentOS`、`openSUSE Linux`、`Arch
    Linux`、`Gentoo` 和 `Slackware`。主要问题之一是：使用哪种 Linux 发行版？根据我们的经验，建议如下：


    *   对于初学者：`Ubuntu`、`Xubuntu`、`openSUSE`、`Linux Mint`

    *   对于有经验的高级用户：`Debian GNU/Linux`、`Red Hat Enterprise Linux` (`RHEL`)、`Fedora`、`CentOS`

    *   对于开发者：`Arch Linux`、`Gentoo`、`Slackware`


    书中的示例我们使用 `Debian GNU/Linux`。虽然这个发行版被推荐给高级用户，但它对初学者仍然非常友好，我们将在本指南后面展示这一点。但选择它最重要的原因是它的稳定性，以及人们在过去
    20 年作为服务器和桌面系统长期使用对该 Linux 发行版的信任。其他 Linux 发行版波动太大，让人难以适应。


    非常欢迎你选择不同的 Linux 发行版。本书的大部分适用于大多数发行版。但如果你是一个完全的新手，我们强烈建议至少在本指南期间坚持使用 `Debian GNU/Linux`，因为我们将逐步完成它的安装和配置。


    通常，选择 Linux 发行版可以取决于下述的几个标准：


    *   根据可用性：免费或商业用途

    *   根据用途：桌面、服务器、Wi-Fi 路由器/网络设备

    *   根据目标读者：终端用户、网络工程师、系统管理员、开发者

    *   根据包格式：`.deb`、`.rpm`、`.tar.gz`

    *   根据更新时间：每个 Linux 发行版都有自己的更新周期

    *   根据提供的支持：支持可以是免费的（基于社区）或付费的（基于支持合同）


    在选择发行版时，我们建议选择稳定、定期更新并符合你计算机用途的发行。下面你将找到上述每个 Linux 发行行的简短描述。


    ![](img/image254.jpg)


    ### Debian GNU/Linux

    `Debian GNU/Linux`（简写为 `Debian`）建立于 1993 年，是一个完全免费且基于社区的操作系统，遵循 `GNU` 原则。超过 1,000
    名开发者根据自己的意愿持续对其进行工作。`Debian` 背后没有公司，也不涉及商业利益。


    一个设计目标是为积极提供服务的计算机提供一个稳定可靠的操作系统。它针对那些明确自己需求且有经验的用户。`Debian` 开发者维护并使用他们自己的软件。包以
    `.deb` 格式提供，并根据以下许可证进行分类：


    *   `Main`:自由软件

    *   `Contrib`:依赖非自由软件的自由软件

    *   `Non-free`: 具有非自由许可证的包


    `Debian` 在服务器和桌面系统上的运行都非常好。支持多种架构，如 `ARM EABI` (`arm`)、`IA-64` (`Itanium`)、`mips`、`MIPSel`、`powerpc`、`s390`
    (32 和 64 位)，以及 `sparc`、`i386` (32 位) 和 `amd64` (64 位)。每个版本的代号基于电影《玩具总动员》中的角色名字，例如
    `Debian GNU/Linux` 9 的 `Stretch`。


    ![](img/image270.jpg)


    ### Ubuntu

    `Ubuntu` 是由 Canonical Ltd 公司资助的自由 Linux 发版。基于 `Debian` 但专注于初学者。这就是为什么它每个任务只包含一个工具。此外，`Ubuntu`
    团队尝试引入缺乏稳定性的新元素。包以 `.deb` 格式提供，并根据来自 `Canonical` 的支持情况进行分类：


    *   `Main`: 由 `Canonical` 支持的自由软件

    *   `Restricted`: 由 `Canonical` 支持的非自由软件

    *   `Universe`:不受支持的自由软件

    *   `Multiverse`:不受支持的非自由软件


