    ## 6.3 Available Shells

    Your Linux system allows the usage of various shells. Each shell is available
    as a separate software package through the Debian package manager, `Aptitude`,
    we installed earlier. The list of shells is quite long, so we list only a selection
    of the available shells that are the most popular:


    * Almquist Shell (ash)

    * Bourne Again Shell (bash)

    * Debian Almquist Shell (dash)

    * Z Shell (zsh)

    * C Shell (csh)

    * Korn Shell (ksh)

    * Tenex C Shell (tcsh)


    Unless otherwise stated the examples in this document are based on the Bourne
    Again Shell (`bash`). At the time of writing this document this is the default
    shell on Debian. Which other shells are allowed in your Linux system, is set up
    in the configuration file `/etc/shells`. Using the `cat` command you can see the
    list of allowed shells:


    ```bash

    user@debian95:~$ cat /etc/shells

    # /etc/shells: valid login shells

    /bin/sh

    /bin/dash

    /bin/bash

    /bin/rbash

    /usr/bin/screen

    user@debian95:~$

    ```


    The name of the shell that is currently in use in your terminal is kept in the
    shell variable `$0`. The following simple command outputs the shell’s name:


    ```bash

    user@debian95:~$ echo $0

    bash

    user@debian95:~$

    ```


    In order to change the shell currently in use, have a look at the `chsh` command
    and the configuration file `/etc/passwd` covered in the following section.


    ## 7. Essential Linux Commands

    In this chapter we explain basic Linux commands that will help you to deal with
    files and directories, text processing commands, users and groups, process management,
    networks, and the help system.


    ### 7.1 Files and Directories

    #### touch

    The `touch` command is used to update the access date or modification date of
    a file and works in two ways: if the file already exists, the timestamp for access
    and modification of the file is set to the current timestamp. In case the file
    does not exist yet, an empty file will be created that has the current timestamp
    (see image below).

    ![](image1335.jpg)


    Use the `touch` command in order to set the timestamp of a file and to figure
    out if you have the appropriate permissions to write to a directory or an entire
    filesystem.


    #### ls

    This command lists the entries of a directory. The image below shows two common
    ways: without any options, and with the options `-la` (short for `-l -a` which
    means long all). The first output displays the entry names only for regular files,
    whereas the second output lists both regular and hidden entries. Over and above,
    it shows all the information like type of entry, permissions, name of owner, size
    of entry, access date and name of entry.

    ![](image1341.jpg)


    In order to list directories only, use the option `-d` (abbreviates `--directory`).


    #### mkdir

    This command is used in order to create a directory (make directory). The following
    example creates a new directory named “training” in the current directory:


    ```bash

    $ mkdir training

    ```


    #### rmdir

    This command is used in order to remove an empty directory (remove directory).
    The following example deletes an empty directory named “training” in the current
    directory.


    ```bash

    $ rmdir training

    ```


    #### rm

    The `rm` command abbreviates the word “remove” and deletes files and directories.
    In order to delete all the files ending with `.txt` that reside in the current
    directory issue the following command:


    ```bash

    $ rm *.txt

    ```


    In order to be on the safe side when deleting files and directories, use the option
    `-i` (or `--interactive`) in combination with `-v` (for `--verbose`). Before deleting
    a file `rm` will then request your explicit confirmation, and prints a status
    message:


    ```bash

    $ rm -iv invoice156.txt

    rm: remove regular file "invoice156.txt"? y

    "invoice156.txt" was deleted

    ```


    #### cp

    The `cp` command copies files. In order to operate properly, it requires two names:
    the name of the original file and the name of the copy. The next example creates
    a copy of the calendar file that is named “calendar-2018”.


    ```bash

    $ cp calendar calendar-2018

    ```


    The original file is not touched and stays intact. The copy has the same content
    as the original, but with the current timestamp. Use the option `-i` (or `--interactive`)
    to prevent overwriting existing files.


    #### mv

    The `mv` command abbreviates the word “move” and moves and renames files and directories.
    It requires two names: the name of the original file and its new name. The following
    example renames the “calendar” file to “calendar-2018”.


    ```bash

    $ mv calendar calendar-2018

    ```


    The original file is removed and the new entry receives the current timestamp.
    Use the option `-i` (or `--interactive`) to prevent overwriting existing files.


    #### cd

    The `cd` (change directory) command allows you to move through the system. To
    move into the subdirectory “work”, use this command:


    ```bash

    $ cd work

    ```


    #### file

    The `file` command determines the type of entry in the file system. There are
    three sets of tests that are performed in the following order: filesystem tests,
    magic tests, and language tests. The first test that succeeds causes the file
    type to be printed. As shown in the image below “Music” is classified as a directory,
    “testfile” as an empty file and `/etc/passwd` as a text file. This command also
    detects PDF files as well as various image formats.

    ![](image1422.jpg)


    #### du and df

    These two very similar commands tell you more about the disk space that is in
    use, `du` abbreviates “disk usage” and `df` means “disk free”.


    `du` calculates the amount of disk space that is used by a directory. The regular
    output states the value for every single entry and can be a bit confusing. In
    order to get a summary for a directory, extend the command line call by the three
    parameters `-s`, `-c` and `-h`. `-s` abbreviates “summary”, `-c` means “total”
    and `-h` outputs the value in human-readable format. The image below shows the
    disk usage of your home directory.

    ![](image1428.jpg)


    In contrast, the `df` command shows how much space is left on the devices. The
    image below shows the available disk space of your system. From left to right
    the columns cover the filesystem, the disk size, the amount of space that is used,
    the amount of space that is still available and the device that is mounted to
    that directory.

    ![](image1432.jpg)


    ### 7.2 Output and Text Processing

    #### echo

    `echo` is a built-in shell command and is intended to output text:


    ```bash

    $ echo help

    help

    ```


    As already shown earlier, the shell evaluates the command and prints the value
    of variables too. The next example prints the value of the shell variable `$HOME`
    which represents your home directory.


    ```bash

    $ echo $HOME

    /home/user

    ```


    #### cat and tac

    These two commands print a file, line by line. `cat` starts with the first line
    up to the last line, and `tac` starts with the last line up to the first line.
    The next example uses a simple plain text file named “places” that contains the
    names of one city per line. For `cat` Amsterdam comes first, and for `tac` it
    is Cape Town.


    ```bash

    $ cat places

    AmsterdamBerlinBernCape Town

    $ tac places

    Cape TownBernBerlinAmsterdam

    ```


    #### grep

    The `grep` command abbreviates the description “global regular expression print”.
    The command acts as a filter that only prints the lines of text that match a given
    pattern. `grep` needs data to work on, in combination with a pattern to look for.
    Based on the example used above for `cat` and `tac`, the following command line
    call only outputs the lines from the file that contain the character string “Ber”.
    Keep in mind that `grep` filters are case-sensitive, i.e. it looks for the character
    string that starts with an uppercase “B” followed by the two lowercase letters
    “e” and “r”. It does not matter whether the pattern is at the beginning, in the
    middle or at the end of text.


    ```bash

    $ grep Ber places

    BerlinBern

    ```


    When it comes to patterns, `grep` supports character strings and regular expressions
    (RegEx). In order to find all the strings that end with the letter “n” use the
    option `-E` (or `--extended-regexp`) followed by the pattern `n$` as shown below:


    ```bash

    $ grep -E "n$" places

    BerlinBernCape Town

    ```

