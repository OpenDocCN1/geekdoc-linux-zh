    `head` 和 `tail` 输出文件的前几行。在不带后续参数的情况下调用，它们会输出最多十行。相比之下，`tail` 执行相同的操作，但从文件末尾开始。为了输出前两行，请如下所示添加
    `-n 2` 选项：


    ```bash

    $ head -n 2 placesAmsterdamBerlin$

    ```


    为了输出最后两行，按照同样的方法使用 `tail` 即可。与 `tac`（见本章前面的部分）不同，`tail` 不会改变输出顺序。


    ```bash

    $ tail -n 2 placesBernCape Town$

    ```


    `nl` 类似于 `cat`（见本章前面的部分），但会在输出的每行开头添加行号。


    ```bash

    $ nl places1 Amsterdam2 Berlin3 Bern4 Cape Town$

    ```


    `wc`

    该命令是“word count”（单词计数）的缩写，用于统计输入数据的行数、单词数和字符数。除非另有指定，将打印所有三个值：


    ```bash

    $ wc places4 5 32 places$

    ```


    `wc` 还提供了以下选项来限制输出：


    - `-l`: 仅输出行数，后跟文件名

    - `-w`: 仅输出单词数，后跟文件名

    - `-c`: 仅输出字符数，后跟文件名


    此示例显示了如何统计文件的行数：


    ```bash

    $ wc -l places4 places$

    ```


    ### 7.3 用户与组

    这些命令处理各种操作以管理你 Linux 系统的用户和组。除非明确说明，这些这些都可以作为普通用户运行。


    #### `whoami`

    该命令如下返回你的当前用户 ID：


    ```bash

    $ whoamiuser$

    ```


    #### `users`, `who` 和 `w`

    `users`、`who` 和 `w` 命令显示当前登录你 Linux 系统的用户。`w` 扩展了 `who` 的输出增加了运行时间和另一个包含最后执行命令的列。相比之下，`users`
    仅以空格分隔的列表形式单行输出用户名（见下图）。![](img/image1610.jpg)


    `who` 的单列以用户的登录名开始。输出随后是终端名称，其中“console”代表登录终端，“pts/1”是第一个伪终端会话的缩写。最后两列包含登录时间和用户所在的主机，在括号中（见下图）。![](img/image1614.jpg)


    `w` 的单列包含用户的登录名（标题为 `LOGIN`）、终端名称（标题为 `TTY`）、用户所在的主机（标题为 `FROM`）、登录时间（标题为 `LOGIN@`）、活动（空闲时间和
    CPU 使用率标题为 `IDLE`、`JCPU` 和 `PCPU`）以及用户执行的最后命令（标题为 `WHAT`）（见下图）。![](img/image1618.jpg)


    #### `id` 和 `groups`

    `id` 命令输出当前用户的用户和组信息（见下图）。从左到右列显示用户 ID (`uid=1000(user)`)、组 ID (`gid=1000(group)`)
    以及用户所属的组名称![](img/image1623.jpg)


    为了列出用户所属的所有组，也可以调用 `groups` 命令（见下图）。输出是空格分隔的组名列表。![](img/image1627.jpg)


    #### `passwd`

    如第 4 章所述，Linux 系统至少有两个用户：一个管理员 root 用户和一个我们简称为 `user` 的普通用户。每个账户也用密码保护。为了更改密码，请使用
    Debian `passwd` 软件包中的 `passwd` 命令（参考第 4 章关于如何安装额外软件）。如下所示，先输入当前密码，按回车，输入新密码，按回车确认，再次输入新密码并按回车确认![](img/image1633.jpg)


    作为普通用户，你只被允许更改自己的密码。管理员 root 用户能够为自己以及其他用户设置新密码。在这种情况下，我们如下调用 `passwd`：


    ```bash

    # passwd felix

    Changing password for felix.(current) UNIX password:

    Enter new UNIX password:

    Retype new UNIX password:

    passwd: password updated successfully

    ```


    密码以哈希值的形式存储在配置文件 `/etc/shadow` 中。该文件的内容对管理员用户可见。下面的示例显示了如何借助 `grep` 命令（见本章前面的部分）提取用户“user”的信息![](img/image1656.jpg)


    #### `chfn`

    该命令同样来自 Debian `passwd` 软件包，用于更改存储在系统文件 `/etc/passwd` 中的用户信息。在你的 Debian 系统安装期间，基础设置已经完成。为了修改这些信息，你可以在交互模式下不带后续参数运行
    `chfn`，或使用以下一个或多个选项仅调整特定值：


    - `-f` 或 `--full-name`: 更改用户的全名

    - `-h` 或 `--home-phone`: 更改家庭电话

    - `-r` 或 `--room`: 更改房间号

    - `-w` 或 `--work-phone`: 更改办公电话


    以下示例将家庭电话号码项改为 135：


    ```bash

    $ chfn -h 135Password:$

    ```


    #### `chsh`

    该命令（同样来自 Debian `passwd` 软件包）更改你登录 Linux 系统时使用的 shell 条目。同样，这些信息存储在 `/etc/passwd`
    文件中。允许使用的 shell 受配置文件 `/etc/shells` 中的条目。`chsh` 的工作与 `chfn` 命令类似。不带后续选项调用时，将使用交互方法（见下图）。![](img/image1684.jpg)


    `chsh` 接受选项 `-s`（`--shell` 的缩写）以便在非交互模式下设置 shell。以下示例显示了相应的命令行调用：


    ```bash

    $ chsh -s /bin/bash

    ```


    为了修改你之外其他用户的 shell，请将用户名作为参数调用 `chsh` 命令。注意，只有管理员才能为其他用户执行此操作。下一个示例显示了如何为用户“felix”操作：


    ```bash

    # chsh felix

    Changing the login shell for felix

    Enter the new value, or press ENTER for the new value

    Login shell [/bin/bash]:#

    ```


    #### `su` 和 `sudo`

    为了从一个用户切换到另一个，你使用 `su` 命令。`su` 是“switch user”（切换用户）的缩写。在不带后续选项的情况下，你如下切换到 root
    用户：


    ```bash

    $ suPassword:#

    ```


    作为管理员 root 用户工作意味着巨大的责任，并假设你完全清楚自己在做什么。要以 root 不同的用户身份工作，如下使用所需的用户名调用 `su` 命令：


    ```bash

    $ su felixPassword:$

    ```

