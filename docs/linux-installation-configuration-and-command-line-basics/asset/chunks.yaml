    ![](img/image1864.jpg)

    `pingping` 向给定的 IP 地址或主机发送 ICMP 网络包，并显示往返时间。下图展示了针对主机 [`www.google.com`](http://www.google.com)
    的操作。![](img/image1869.jpg)


    ## 8. 获取帮助


    UNIX/Linux 是一个相当复杂的操作系统，特别是对于初学者来说。当你开始学习时，程序列表可能会让你非常困惑。每个程序的参数或选项列表都比上一个长。而且它们并不容易记忆，有长短名称，且没有标准化。在遇到困难时寻求帮助并不是错误，也不是知识匮乏的表现。


    为了在你的 Linux 系统上获取帮助，有几种方法。这包括手册页（称为 `man pages`）、信息页（称为 `info pages`）以及每个命令内置的帮助。在本章中，我们将仔细查看这些帮助系统，并熟悉
    `man`、`info`、`whereis` 和 `whatis` 命令。


    ### 8.1 Man 手页


    Man 手页是分发程序文档的传统方式。“man page”一词是“manual page”（手册页）的缩写，对应于打印版手册的页面。Man 手页是你 Linux
    系统基础安装的一部分。相应的 Debian 软件包名为“manpages”。


    一个 man 手页对应于完整 UNIX 手册中的特定章节：1 代表命令，2 代表系统调用，等。要获取有关特定命令的信息，请在终端窗口中打开相应的 man 手页。例如，对于
    `cp` 命令，操作如下：


    ```bash

    $ man cp

    ```


    生成的 man 手页如下所示：![](img/image1894.jpg)快捷键绑定与文本编辑器 `vi(m)` 类似。使用方向键向上向下滚动，使用 `q`
    退出 man 手页并返回终端。


    ### 8.2 Info 页


    Info 是 GNU 项目内部文档的默认格式。在 20 世纪 90 年代初，GNU 项目认为 man 文档系统已经过时，并编写了 `info` 命令来取代它。`info`
    具有基础的超链接功能，并使用了一种更简单的标记语言（与用于 man 页的 `troff` 系统相比）。如今，这两个系统并存存在。


    Debian 的基础安装不包含 info 页。为了使用它，请安装后安装名为“info”的软件包（参考第 4 章关于如何安装额外软件包）。要获取有关特定命令的信息，请在终端窗口中打开相应的
    info 页。例如，对于 `cp` 命令，操作如下：


    ```bash

    $ info cp

    ```


    生成的 info 页如下所示：![](img/image1908.jpg)


    ### 8.3 内置帮助


    除了 man 和 info 页外，许多命令都有 `-h` 选项（`--help` 的缩写）。使用此选项调用命令会打开一个特定的帮助部分。下图显示了 `uname`
    命令的内置帮助。![](img/image1913.jpg)


    此外，`whatis` 命令有助于获取 Linux 命令或函数的简要信息。它会为与命令行参数传递给 `whatis` 命令的字符串匹配的命令显示单行 man
    手页描述。


    `whatis` 命令在其索引数据库中搜索该字符串（该数据库由 `mandb` 程序维护），并从该命令 man 手页的 NAME 部分选取简短描述。下图展示了
    `mv` 和 `man` 两个命令的情况。![](img/image1918.jpg)


    另一个选项是 `whereis` 命令，它有助于在 Linux 系统中定位命令的手册页。这是一个非常简单的实用。下图展示了 `mv` 和 `man` 两个命令的情况![](img/image1922.jpg)


    每个命令还提供了额外的信息和配置示例。这些内容存储在 `/usr/share/doc` 目录下，每个程序都有自己的子目录。内容是标准化的，且因程序而异。每个用户都可以访问这些内容。下方显示目录片段![](img/image1926.jpg)


    ### 8.4 外部帮助


    如果软件工具提供的帮助不足，需要进一步的解释，则需要用到外部资源。可以咨询几个在线社区，例如：


    * LinuxHint - [`support.linuxhint.com`](https://support.linuxhint.com)

    * LinuxHelp - [`www.linuxhelp.com`](https://www.linuxhelp.com)


    另一个选项是 Linux 用户组 (LUG)。LUG 是由来自同一地区、对 Linux 操作系统有共同兴趣的人组成的群体。他们被组织为松散关联的人群或定期聚会的协会。全球
    LUG 的完整列表可以在 LugsList 获取：[`lugslist.com`](http://lugslist.com)!!![](img/image1937.jpg)


    许多 LUG 组织聚会和活动，以分享想法、交流经验并相互学习。这包括本地和国际活动。


    ## 延伸阅读


    关于 Linux 的进一步阅读，请务必关注我们的指南 [Linux: System Administration and Practical Management
    Guidelines](https://www.amazon.com/dp/1085961540)。系统管理是 Linux 一个不可避免的方面。即使出现了像
    Ubuntu 和 Mint 等用户友好的发行版，仍然需要大量的用户配置来保持 Linux 日常运行。本书的编写旨在引导你应对大多数遇到的场景，无论你是系统管理的新手还是维护系统多年的专家。


    在书中，我们将详细查看用户和组的管理，研究如何创建一个更安全、更受威胁的系统，并深入探讨文件系统和存储分区的各个方面。我们还讨论了特定主题，如处理硬链接和软链接、充分利用文本处理、包管理和架构、利用共享库、通过进程优化系统，以及每个精通的
    Linux 用户和管理员需要了解的其他主题。![](https://www.amazon.com/dp/1085961540)


    ## 关于作者


    Nathan Clark 是一位资深程序员，在软件行业拥有近 20 年的经验。他拥有麻理工硕士学位，曾在美国一些领先的软件公司工作过，积累了丰富的软件设计和开发知识。


    Nathan 和他的妻子 Sarah 于 2009 年创立了自己的开发公司，以便承担更具挑战性和创造力的项目。如今，他们为来自全球的高端客户提供服务。Nathan
    喜欢通过他的系列书籍分享编程知识，为客户开发创新的软件解决方案，并在空闲时间观看经典的科幻电影。


    '
