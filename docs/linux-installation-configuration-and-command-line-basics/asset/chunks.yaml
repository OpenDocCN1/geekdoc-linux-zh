    The name of the shell that is currently in use in your terminal is kept in the
    shell variable $0 . The following simple command outputs the shell’s name:


    | user@debian95:~$ echo $0bashuser@debian95:~$ |


    In order to change the shell currently in use, have a look at the chsh command
    and the configuration file /etc/passwd covered in the following section.7\. Essential
    Linux CommandsIn this chapter we explain basic Linux commands that will help you
    to deal with files and directories, text processing commands, users and groups,
    process management, networks, and the help system.7.1 Files and DirectoriestouchThe
    touch command is used to update the access date or modification date of a file
    and works in two ways: if the file already exists, the timestamp for access and
    modification of the file is set to the current timestamp. In case the file does
    not exist yet, an empty file will be created that has the current timestamp (see
    image below).![](image1335.jpg)Use the touch command in order to set the timestamp
    of a file and to figure out if you have the appropriate permissions to write to
    a directory or an entire filesystem.lsThis command lists the entries of a directory.
    The image below shows two common ways: without any options, and with the options
    -la (short for -l -a which means long all). The first output displays the entry
    names only for regular files, whereas the second output lists both regular and
    hidden entries. Over and above, it shows all the information like type of entry,
    permissions, name of owner, size of entry, access date and name of entry.![](image1341.jpg)In
    order to list directories only, use the option -d (abbreviates --directory) .mkdirThis
    command is used in order to create a directory (make directory). The following
    example creates a new directory named “training” in the current directory:


    | $ mkdir training$ |


    rmdirThis command is used in order to remove an empty directory (remove directory).
    The following example deletes an empty directory named “training” in the current
    directory.


    | $ rmdir training$ |


    rmThis command abbreviates the word “remove” and deletes files and directories.
    In order to delete all the files ending with .txt that reside in the current directory
    issue the following command:


    | $ rm *.txt$ |


    In order to be on the safe side when deleting files and directories, use the option
    -i (or --interactive) in combination with -v (for --verbose). Before deleting
    a file rm will then request your explicit confirmation, and prints a status message:


    | $ rm -iv invoice156.txtrm: remove regular file "invoice156.txt"? y"invoice156.txt"
