    has access to these improvements. Using the `GPL`, the changes have to be published
    using the same license. Other open source licenses like `BSD` do not have this
    strong requirement.


    # 3. Linux in Day-to-Day Life


    There are a few terms that may confuse Linux beginners. The first thing is its
    name, `Linux` vs `GNU/Linux`. As described earlier in Chapter 1, the term `Linux`
    refers to the `Linux` kernel only. In reality many users refer to `Linux` as the
    operating system as a whole, the kernel plus libraries and tools. Also the term
    `Linux` is used to include all the programs that run on `Linux`, or that are available
    for this great operating system.


    Furthermore, the description `GNU/Linux` needs understanding. Linux distributions
    with this name prefix are fleshed out with `GNU` implementations of the system
    tools and programs. One such example is `Debian GNU/Linux`. As already pointed
    out in Chapter 1, the `GNU` project goes back to the initiative of Richard M.
    Stallman and his dream to develop a free `UNIX` system. Based on his experiences
    at MIT and the collaboration with other colleagues he choose to use free software
    that was already available to rewrite the tools he needed. This included the `TeX`
    typesetting system as well as `X11` window system. He published the rewritten
    tools under the `GPL` license whenever possible to make his work available freely
    to everyone who was interested in it.


    Next we will have a closer look at the different Linux distributions.


    ## 3.1 What is a Linux Distribution?


    A Linux distribution is a collection of software packages that fit together. A
    distribution is maintained by a team of software developers. Each member of the
    team focuses on a different package of the distribution. Together as a team they
    ensure that the single software packages are up-to-date and do not conflict with
    the other packages of the same release of the distribution.


    As of 2018 for `Debian GNU/Linux` 9, the official repositories contain more than
    51,000 different packages. A repository is a directory of packages with a certain
    purpose. `Debian GNU/Linux` sorts its packages according to the development state.
    The official repository is named `stable` and reflects the current release of
    stable packages. The other repositories are named `testing` and `unstable`, and
    work in the same way but do not count as official packages.


    Typically a Linux distribution comprises of packages for a `Linux` kernel, a boot
    loader, `GNU` tools and libraries, a graphical desktop environment with a windows
    environment, as well as additional software like a web browser, an email client,
    databases and documentation. The software is provided in two ways; as the source
    code and as the compiled binary packages. This allows you to understand how the
    software is designed, to study it and to adjust it according to your personal
    needs. This step is described as freedom 1 on the list shown in Chapter 2.


    Depending on the focus of the Linux distribution, it also contains packages for
    a specific purpose like network or forensic tools, scientific software for educational
    purposes, and multimedia applications. More details are given below.


    ## 3.2 Which Linux Distributions Exist?


    According to Distrowatch, more than 600 different Linux distributions exist. Major
    distributions are `Debian GNU/Linux`, `Ubuntu`, `Linux Mint`, `Red Hat Enterprise
    Linux` (`RHEL`), `Fedora`, `CentOS`, `openSUSE Linux`, `Arch Linux`, `Gentoo`
    and `Slackware`. One of the major questions is: which Linux distribution to use?
    Based on our experience these are the recommendations:


    *   For beginners: `Ubuntu`, `Xubuntu`, `openSUSE`, `Linux Mint`

    *   For advanced users with experience: `Debian GNU/Linux`, `Red Hat Enterprise
    Linux` (`RHEL`), `Fedora`, `CentOS`

    *   For developers: `Arch Linux`, `Gentoo`, `Slackware`


    For the examples in this book we use `Debian GNU/Linux`. Even though this distribution
    is recommended for advanced users it is still very beginner friendly, which we
    will show later in the guide. But the most important reason for this selection
    is its stability and the trust in this Linux distribution that was built up during
    the last 20 years of permanent use as a server and desktop system. Other Linux
    distributions fluctuate too much for comfort.


    You are more than welcome to choose a different Linux distribution. The majority
    of this book applies to most distributions. But if you are a complete novice,
    we highly recommend sticking to `Debian GNU/Linux` at least for the duration of
    this guide, as we will go step by step through its setup and configuration.


    In general, choosing a Linux distribution can depend on several criteria as stated
    below:


    *   By its availability: free or commercial use

    *   By its purpose: desktop, server, Wi-Fi router/network appliance

    *   By the intended audience: end user, network engineer, system administrator,
    developer

    *   By the package format: `.deb`, `.rpm`, `.tar.gz`

    *   By the time updates are available: every Linux distribution follows its own
    update cycle

    *   By the support that is provided: support can be free (community-based) or
    with costs (based on a support contract)


    When selecting a distribution, we recommend one that is stable, that is updated
    regularly and fits into the purpose you need the computer for. Below you will
    find a short description for each of the Linux distributions mentioned above.


    ![](image254.jpg)


    ### Debian GNU/Linux

    Established in 1993, `Debian GNU/Linux` (`Debian` for short) is an entirely free
    and community-based operating system that follows the `GNU` principles. More than
    1,000 developers continuously work on it based on their own free will. Behind
    `Debian` is no company and there are no business interests involved.


    One design goal is to have a stable and reliable operating system for computers
    that are actively delivering services. It is targeted to users who know what they
    want and have experience. The `Debian` developers maintain and use their own software.
    The packages are made available in `.deb` format, and are divided into categories
    according to the following licenses:


    *   `Main`: free software

    *   `Contrib`: free software that depends on non-free software

    *   `Non-free`: packages that have a non-free license


    `Debian` works excellent on both servers and desktop systems. A range of architectures
    are supported like `ARM EABI` (`arm`), `IA-64` (`Itanium`), `mips`, `MIPSel`,
    `powerpc`, `s390` (32 and 64 bit), as well as `sparc`, `i386` (32 bit) and `amd64`
    (64 bit). The code name of each release is based on the name of a character from
    the film Toy Story, such as `Stretch` for `Debian GNU/Linux` 9.


    ![](image270.jpg)


    ### Ubuntu

    `Ubuntu` is a free Linux distribution that is financed by the company `Canonical
    Ltd`. It is based on `Debian` but focuses on beginners instead. That’s why it
    contains just one tool per task. Also, the `Ubuntu` team tries to incorporate
    brand new elements that lack stability. The packages are made available in `.deb`
    format, and are divided into categories according to their support from `Canonical`:


    *   `Main`: free software, supported by `Canonical`

    *   `Restricted`: non-free software, supported by `Canonical`

    *   `Universe`: free software, unsupported

    *   `Multiverse`: non-free software, unsupported

