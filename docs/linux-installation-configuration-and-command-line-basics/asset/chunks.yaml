- fmt: '

    Having logged into the system you will add further software to be able to use
    a graphical user interface, based on the XFCE desktop. At this step of the installation
    process, adding further software can only be done by logging in as the administrative
    root user. In order to do so, type in `root` at the login prompt, press `Enter`,
    wait for the text `Password:` to appear and type in the password set for the root
    user you defined before. The Linux system will welcome you (see image below) with
    a login message. The first line of the login message will give you a display on
    the time of your last login followed by the version of the Linux kernel that is
    currently running (line two) and the usage advice (lines five to eight).![](image566.jpg)
    After the welcome message Debian opens a command-line prompt:


    ```

    root@debian95 ~# |

    ```


    This command-line prompt consists of four components:


    * `root`: the name of the user who logged in

    * `debian95`: the hostname of the Linux system

    * `~`: the current directory. In this case it is the home directory of the user
    currently logged in. If not otherwise set, this is defined as `/home/username`
    for regular users and `/root` for the administrative user. `~` is just an abbreviation
    of it.

    * `#`: the login symbol. The `#` symbol represents the user root whereas `$` is
    used by regular users without administrative rights


    **Important**: You are now logged in as the administrative root user. Take care
    which commands you type in, and check twice if doubt. Any mistakes can lead to
    the necessity to install or repair your Linux system.


    ## 4.3 Adding a Graphical User Interface


    At its current stage, the Debian system is fully active and can be used in production.
    For a desktop system suitable for a regular user, it still lacks a nice and easy-to-use
    graphical user interface. In this step we will change that and install the XFCE
    desktop manager. In order to do so, we will install the following packages:


    * The `aptitude` package manager

    * The `xdm` display manager

    * The `xfce4` desktop environment


    Debian uses the package manager `apt` to handle the installation, the update and
    the removal of software packages and the related package lists. Also, `apt` resolves
    all the package dependencies and ensures that the relevant software is available
    on the system. In our case a total of roughly 450 MB of data/software have to
    be retrieved from the package mirror and installed. As pointed out earlier, this
    requires a working internet connection to download the needed software packages
    . In order to install the three packages, type in the following commands at the
    command-line prompt. Just type the command after the `#` symbol:


    ```

    root@debian95 ~# apt-get install aptitude xdm xfce4 |

    ```


    `apt` will display further information regarding the packages to be installed.
    This includes the list of depending packages and recommended packages. At the
    end you will see a command-line prompt. Type `Y` or press `Enter` to install `aptitude`,
    `xdm` and `xfce4` as well as the depending packages. For the `xdm` display manager,
    two dialog boxes have to be confirmed (see images below). Press `Enter` two times
    to confirm the use of `xdm`.![](image607.jpg)![](image610.jpg)


    The retrieval of the software packages to be installed takes a while. When finished,
    the command-line prompt will appear again. In order to activate the changes regarding
    the graphical desktop environment, restart the system. Type the command `reboot`
    at the command-line prompt as follows:


    ```

    root@debian95 ~# reboot |

    ```


    Having restarted the Linux system, Debian welcomes us with a graphical boot screen
    (see image below). Press `Enter` to start the Linux system with the default settings.![](image621.jpg)
    A few seconds later a graphical login screen will be visible (see image below).
    Log in to the system with the regular user named `user` as created earlier. Type
    in `user`, press `Enter` and type in the password for the user. Then, press `Enter`
    again to confirm and log in.![](image625.jpg)


    Next, the XFCE desktop will be visible (see image below). The desktop comes with
    a number of default elements: an upper navigation bar, a lower navigation bar
    and desktop icons. These elements are explained in more detail below.![](image629.jpg)


    * **Upper navigation bar**: this shows buttons to access the different applications,
    the four virtual desktop screens, the clock and a button for various user actions
    such as to lock the screen, change the user, change to standby mode and exit the
    current session

    * **Lower navigation bar**: this bar contains several buttons to hide all the
    opened windows and show the empty desktop, to open a terminal, the file manager,
    a web browser, to find an application and to open the file manager directly with
    your home directory.

    * **Desktop icons**: from top to bottom there is a trash bin, file manager icons
    that link to the computer, and the home directory


    A right-click on the desktop opens a context menu that allows you to access the
    various applications (see image below).![](image640.jpg)


    ## 4.4 Adding Additional Software


    Up until now the software available to be used on your Linux system has been rather
    limited. The next thing to do is to add the following four Debian packages to
    make your life a bit easier:


    * `firefox-esr`: the web browser Mozilla Firefox (Extended Support Release)

    * `gnome-terminal`: a terminal emulation maintained by the GNOME project

    * `screensaver`: a basic screensaver for the X11 system

    * `vlc`: the video player Video Lan Client (VLC)


    The installation of the three packages will be done using the command-line in
    a terminal emulator (we will look at terminals in detail later in the guide).
    Currently, on your system the X11 terminal emulator `xterm` is installed. In order
    to open `xterm`, click on the terminal button in the lower navigation bar or select
    the entry `Application > System > Xterm` from the context menu. As step one, open
    `xterm`. Next, type in the command `su` next to the command-line prompt as follows
    and press `Enter`:


    ```

    user@debian95: ~$ suPassword: |

    ```


    You may remember from the previous steps that only an administrative user can
    install, update or remove software on a Debian system. The `su` command abbreviates
    switch user and changes your current role. Used without an additional name, the
    role changes to the administrative root user. At the password prompt type in the
    password for the administrative user and press Enter. As an administrative user,
    install the packages: `firefox-esr`, `gnome-terminal`, `screensaver` and `vlc`
    as follows:


    ```

    root@debian95: ~# apt-get install firefox-esr gnome-terminal xscreensaver vlc
    |

    ```


    The output is seen below:![](image673.jpg) After the installation of the four
    packages, you can switch back to your role as a regular user. Press `Ctrl+D` to
    quit the admin part, and press `Ctrl+D` again to close `xterm`.


    The installation of Firefox has the following effects:


    * The new software `Firefox` is available from the application menu

    * The new command `firefox` is available from the command-line

    * The earth icon from the lower navigation bar links to the Firefox web browser

    * The installation of the GNOME terminal package has the following effects:

    * The new software `gnome-terminal` is available from both the command-line and
    the application menu

    * The terminal icon from the lower navigation bar links to the GNOME terminal

    * The entry `Open Terminal Here` from the context menu refers to the GNOME terminal

