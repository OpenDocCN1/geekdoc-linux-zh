    `pingping` sends ICMP network packets to the given IP address or hostname, and
    displays the turnaround time. The image below demonstrates this for the host [http://www.google.com](http://www.google.com)
    .![](image1869.jpg)


    ## 8. Getting Help


    UNIX/Linux is a rather complex operating system, especially for beginners. When
    you get started, the list of programs can be quite confusing. Each program has
    a longer list of parameters or options than the last. And they are not easy to
    memorize, they have long and short names, and are not standardized. Asking for
    help when you get stuck is not a mistake or sign of low knowledge.


    In order to get help on your Linux system, there are several ways to go about
    it. This includes the manual pages (called `man pages`), information pages (called
    `info pages`), as well as the integrated help of each command. In this chapter
    we will have a closer look at these help systems and get familiar with the commands
    `man`, `info`, `whereis` and `whatis`.


    ### 8.1 Man Pages


    Man pages are the traditional way of distributing documentation about programs.
    The term “man page” is short for “manual page”, as they correspond to the pages
    of the printed manual. Man pages are part of the basic installation of your Linux
    system. The corresponding Debian package is named “manpages”.


    A man page corresponds to a specific section in the full UNIX manual: 1 for commands,
    2 for system calls, etc. To get information regarding a specific command, open
    the corresponding man page in a terminal window. As an example, for the `cp` command
    it is done as follows:


    ```bash

    $ man cp

    ```


    The resulting man page looks like this:![](image1894.jpg)The key bindings are
    similar to the ones from the text editor `vi(m)`. Use the navigation keys to scroll
    up and down, and `q` to exit the man page and to return to the terminal.


    ### 8.2 Info Pages


    Info is the default format for documentation inside the GNU project. In the early
    1990s, the GNU project decided that the man documentation system was outdated,
    and wrote the `info` command to replace it. `info` has basic hyperlinking features
    and a simpler markup language to use (compared to the troff system used for man
    pages). Nowadays both systems exist in parallel.


    The basic installation of Debian does not contain the info pages. In order to
    use it, post-install the package named “info” (refer to Chapter 4 on how to install
    additional packages). To get information regarding a specific command, open the
    corresponding info page in a terminal window. As an example, for the `cp` command
    it is done as follows:


    ```bash

    $ info cp

    ```


    The resulting info page looks like this:![](image1908.jpg)


    ### 8.3 Integrated Help


    Aside from man and info pages, many commands have an option `-h` (short for `--help`).
    Calling the command with this option opens a specific help section. The image
    below shows the built-in help of the `uname` command.![](image1913.jpg)


    Alternatively, the `whatis` command is helpful to get brief information about
    Linux commands or functions. It displays a single line man page description for
    the command that matches the string passed as a command line argument to the `whatis`
    command.


    The `whatis` command searches for the string in its index database, which is maintained
    by the `mandb` program, and picks a short description from the NAME section of
    the man page for that command. The image below shows this for the two commands
    `mv` and `man`.![](image1918.jpg)


    Another option is the `whereis` command, which is helpful to locate the manual
    page of the command in the Linux system. It is very simple utility. The image
    below shows this for the two commands `mv` and `man`.![](image1922.jpg)


    Every command also provides additional information and configuration examples.
    This is kept in the directory `/usr/share/doc`, and every program has its own
    subdirectory. The content is standardized and differs from program to program.
    The content is also accessible for every user. A snippet of the directory is shown
    below.![](image1926.jpg)


    ### 8.4 External Help


    If the help already provided with the software tools is not enough, and further
    explanation is necessary, external resources come into play. There are a few online
    communities that can be consulted such as:


    * LinuxHint - [https://support.linuxhint.com](https://support.linuxhint.com)

    * LinuxHelp - [https://www.linuxhelp.com](https://www.linuxhelp.com)


    Another option is Linux User Groups (LUG). A LUG is a group of people from the
    same place sharing their common interest in the Linux operating system. They are
    organized as a loosely associated number of people, or an association that meets
    regularly. A full list of LUGs worldwide is available from LugsList at [http://lugslist.com](http://lugslist.com)!![](image1937.jpg)


    Many LUGs organize meet-ups and events in order to share ideas, exchange experiences,
    and to learn from each other. This includes local and international events.


    ## Further Reading


    For further reading on Linux, be sure to look out for our guide [Linux: System
    Administration and Practical Management Guidelines](https://www.amazon.com/dp/1085961540).
    System administration is an aspect of Linux that is unavoidable. Even with the
    emergence of user friendly distributions like Ubuntu and Mint, a significant amount
    of user configuration is still required to keep a Linux system running on a daily
    basis. This book has been created to guide you through most scenarios you will
    encounter, whether you’re new to system administration or have been maintaining
    systems for years.


    In this book we take a detailed look at managing users and groups, we look at
    how to create a more secure system that will be less vulnerable to threats, as
    well as delving into the various aspects of managing filesystems and storage partitions.
    We also address specific topics such as working with hard and soft links, getting
    the most out of text processing, package management and architecture, utilizing
    shared libraries, manipulating processes for system optimization, as well as other
    essential topics every proficient Linux user and administrator needs to know.[![](image46.jpg)](https://www.amazon.com/dp/1085961540)


    ## About the Author


    Nathan Clark is an expert programmer with nearly 20 years of experience in the
    software industry. With a master’s degree from MIT, he has worked for some of
    the leading software companies in the United States and built up extensive knowledge
    of software design and development.


    Nathan and his wife, Sarah, started their own development firm in 2009 to be able
    to take on more challenging and creative projects. Today they assist high-caliber
    clients from all over the world. Nathan enjoys sharing his programming knowledge
    through his book series, developing innovative software solutions for their clients
    and watching classic sci-fi movies in their free time.

