    1) and “lpic1” (level 2).


    | $ mkdir -p training/linux/lpic1$ |


    In order to create two subdirectories on the same level, make use of the capabilities
    the underlying command line interpreter has. The Bash uses values in brackets
    {...} to achieve this. The next example shows you how to create the two directories
    “training/linux /lpic1” and “training/linux/lpic2” in one go:


    | $ mkdir -p training/linux/{lpic1,lpic2}$ |


    Removing DirectoriesRemoving a directory is done using the rmdir command (remove
