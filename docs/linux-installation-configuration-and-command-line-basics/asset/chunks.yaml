    为了看到更改，请从右菜单中选择 `Open Terminal Here` 项。下面的图片显示了终端窗口。它具有白色背景和更大的字体，更容易阅读。![](img/image694.jpg)


    # 4.5 退出 Linux


    为了正确使用 Linux，你还需要学习如何退出 Linux 以及重启系统。在下面，你将学习如何退出 XFCE 桌面环境、关闭 Linux 系统以及重启系统。我们将介绍方法：第一种基于图形界面，第二种也可以用于服务器和无线路由器等非图形系统。


    ## 退出 XFCE 桌面环境

    退出 XFCE 桌面并注销当前会的最简单方法是点击顶部导航栏右角的按钮。该按钮标记有你的用户名，在我们的案例中是 `Debian User`。从弹出菜单中选择标记为
    `Log Out` 的最后一项（见下图）。或者，你也可以从左上角的 `Application` 按钮或右菜单选择标记为 `Log Out` 的项![](img/image701.jpg)


    会打开另一个窗口，其中包含 `Log Out`（注销）、`Restart`（重启）、`Shutdown`（关机）、`Suspend`（挂起）和 `Hibernate`（休眠）五个按钮（见下图）。点击
    `Log Out` 退出你的会话。随后你将返回登录界面![](img/image705.jpg)


    ## 关闭 Linux 系统

    关闭整个 Linux 系统的方法与退出 XFCE 类似。点击顶部导航栏右角的按钮。该按钮标记有你的用户名，在我们的案例中是 `Debian User`。从弹出菜单（见上图）选择标记为
    `Shut Down` 的项。在接下来的对话框中，点击标记为 `Shut Down` 的按钮停止 Linux 系统。


    在终端会话中，你可以以管理员身份运行 `halt` 或 `shutdown -h now` 命令。普通用户不允许执行这些命令。


    ```

    | # halt

    ```


    ## 重启 Linux 系统

    为了重启 Linux 系统，点击顶部导航栏右角的按钮。该按钮标记有你的用户名，在我们的案例中是 `Debian User`。从弹出菜单中选择标记为 `Restart`
    的项（见上图）。在接下来的对话框中，点击标记为 `Restart` 的按钮重启 Linux 系统。


    在终端会话中，你可以以管理员身份运行命令 `reboot` 或 `shutdown -r now`。普通用户不允许执行这些命令。


    ```

    | # reboot

    ```


    随后系统将重启，你将返回启动界面。


    # 5. Linux 导航

    UNIX/Linux 系统上的文件系统包含不同类型的项目。这包括普通文件、目录（或文件夹）、符号链接、块设备和字符设备、命名管道和套接字。本涉及目录以及相应的
    Linux 工具。


    ## 5.1 文件系统层次结构标准 (FHS)

    现代 Linux 系统具有相当一致的目录结构，这是基于文件系统层次结构标准 (FHS)。该定义规定了哪些主目录以及它们存储了哪些内容。FHS 由 Linux
    基金维护。FHS 的最新版本是 3.0，于 2015 年 6 月 3 日发布。


    第 3 章提到的 Linux 发行版遵循 FHS 结构。尽管如此，存在发行特定的扩展。以下是正在使用的常用目录：


    | 目录 | 描述 |

    | :--- | :--- |

    | `/` | 主层次结构根和整个文件系统层次结构的根目录 |

    | `/bin` | 所有用户所需的各种命令二进制文件 |

    | `/boot` | 引导加载程序 |

    | `/etc` | etcetera 的缩写，包含特定主机的系统级配置文件 |

    | `/home` | 用户的家目录 |

    | `/lib` | `/bin` 和 `/sbin` 中二进制文件所需的库 |

    | `/media` | 可移动式介质的挂载点 |

    | `/proc` | processes 的缩写，是 Linux 内核的虚拟文件系统 |

    | `/root` | root 用户的家目录 |

    | `/sbin` | 关键系统二进制文件 |

    | `/tmp` | 临时数据和文件 |

    | `/usr` | Unix 系统资源，包含用户工具和应用程序 |

    | `/var` | 可变数据，如日志文件和数据库文件 |


    某些 Linux 发行版具有如 `/opt` 等额外目录或使用符号链接。Linux 还有一些常用的缩写，它们在日常工作中非常有帮助：


    | 缩写 | 描述 |

    | :--- | :--- |

    | `$HOME` | 包含用户家目录的本地变量 |

    | `~` | 指向用户的家目录，例如 `/home/tom` |

    | `.` | 指向当前目录 |

    | `..` | 指向父目录 |


    你可以在终端的命令行和 脚本中使用这些缩写来缩短命令。接下来我们将查看其中一些命令。


    ## 5.2 目录命令

    与一样，Linux 提供了一系列命令来列出、创建、删除、更改和重命名目录。你可以在终端中使用这些命令。


    ### 列出目录

    要列出目录，使用命令 `ls` 并配合开关 `--directory`（短 `-d`）：


    ```

    $ ls -d */finances/projects/work/...$

    ```


    此示例列出了当前目录下目录的名称。输出中的“...”表示列表较长，此处进行了缩短。若要列出包括以“.”开头的隐藏目录在内的所有目录，你可以输入如下命令：


    ```

    $ find . -maxdepth 1 -type d./projects./.mozilla./.ipython./.dbus./.video...$

    ```


    要了解更多关于 `ls` 命令的信息并列出其他项目，请查看涵盖终端命令的第 6 章。


    `tree` 命令递归搜索目录并非常漂亮地输出整个目录结构。开关 `-d` 将输出限制为目录，如下所示：


    ```

    $ tree -d.

    ├── archive

    │   ├── ballet-zebola

    │   │   ├── documents

    │   │   └── invoices

    │   └── charles-darwin-university

    ├── projects

    ├── .dbus

    ├── .ipython

    └── .mozilla...$

    ```


    ### 创建目录

    要创建目录，使用 `mkdir` 命令（make directory）。下一个示例在当前目录下创建一个名为“training”的新条目：


    ```

    $ mkdir training

    ```


    开关 `--verbose`（短 `-v`）会打印一条命令执行成功的额外消息。


    ```

    $ mkdir -v training

    mkdir: directory "training" created$

    ```


    开关 `--parents`（短 `-p`）允许你创建整个子目录结构。尚的父目录也会被创建。以下示例创建了目录“training”及其子目录“linux”（第
    1 级）和“lpic1”（第 2 级）。


    ```

    $ mkdir -p training/linux/lpic1

    ```


    要在同一层级创建两个子目录，请利用底层命令行解释器的功能。Bash 使用括号 `{}` 中的值来实现这一点。下一个示例展示了你如何一次性创建 `training/linux/lpic1`
    和 `training/linux/lpic2` 两个目录：


    ```

    $ mkdir -p training/linux/{lpic1,lpic2}$

    ```


    ### 删除目录

    使用 `rmdir` 命令（remove directory）删除目录。下一个示例删除了当前目录下名为“training”的条目：


    ```

    $ rmdir training

    ```


    与 `mkdir` 来说，开关 `--verbose`（短 `-v`）会打印命令执行成功的额外消息。


    ```

    $ rmdir -v training

    mkdir: directory is removed, "training"$

    ```


    只要目录是空的，这种方法就有效。如果你的目录包含任何项目（如文件或子目录），使用 `rmdir` 命令会报错并保持目录不变：


    ```

    $ rmdir training

    rmdir: failed to remove `training`: Directory not empty$

    ```


    为了解决这种情况，`rm` 命令（remove）结合开关 `--recursive`（短 `-r`）变得非常有用。此时，`rm` 会递归删除所有项目。以下示例结合了
    `-r` 和 `-v` 两个开关，以便删除一个文件和三个目录。


    '
- fmt: "\n```bash\n$ tree training/training/\n├── lpic1\n│   └── introduction.txt\n\
    └── lpic2\n2 directories, 1 file\n$ rm -rv training/\n\"training/lpic1/introduction.txt\"\
    \ was removed\nDirectory was removed: \"training/lpic1\"\nDirectory was removed:\
    \ \"training/lpic2\"\nDirectory was removed: \"training/\"\n```\n\n## Changing\
    \ Directories\n\nThe `cd` (change directory) command allows you to move through\
    \ the system. To move one level upwards towards the root directory use this command:\n\
    \n```bash\n$ cd ..\n```\n\nTo move downwards into a subdirectory enter the `cd`\
    \ command followed by the directory name. The command `cd /home/user/test` will\
    \ take you straight into the `/home/user/test` directory. As already explained\
    \ earlier, there are some shortcuts available. The commands `cd ~` (tilde) and\
    \ `cd $HOME` will always take you to your home directory whereas `cd /` will take\
    \ you to the `/` directory.\n\n**Tip**: Because Linux is case-sensitive, `cd`\
    \ is not the same as `CD`. You need to be careful when using upper and lower case.\n\
    \n## Renaming Directories\n\nThis can be achieved using the `mv` command (move).\
    \ In order to change the name of a directory from “lpic1” to “lpic-1” type in\
    \ the following:\n\n```bash\n$ mv lpic1 lpic-1\n```\n\n## 5.3 Terminal-based File\
    \ Managers\n\nNavigating Linux on the command line is not the most ideal situation.\
    \ Terminal-based and graphical file managers are a great alternative. Terminal-based\
    \ file managers run inside a terminal and do not open a separate window on your\
    \ desktop. There are tons of programs available, that’s why we only present you\
    \ with a selection of our favorites.\n\n### GNU Midnight Commander (mc)\n[www.midnight-commander.org](http://www.midnight-commander.org)\n\
    This is a free software, full-screen, text mode, visual file manager that lets\
    \ you search, copy, move and also delete both single and multiple files, and even\
    \ a whole directory tree. The `mc` integrates a viewer and editor.\n![](image1051.jpg)\n\
    \n### The Vi File Manager (vifm)\n[https://vifm.info/](https://vifm.info/)\nSimilar\
    \ to `mc`, the Vi File Manager `vifm` comes with two navigation windows based\
    \ on a curses interface. It provides a Vi(m)-like environment for managing files\
    \ and directories. If you are familiar with the Vi key bindings, this is the file\
    \ manager for you.\n![](image1057.jpg)\n\n## 5.4 Graphical File Managers\n\nSimilar\
    \ to terminal-based file managers, graphical file manager assist in navigating\
    \ Linux. These file managers do open in separate windows, but provide a much nicer\
    \ user experience. Again, there are tons of programs available, so we only present\
    \ you with a selection of our favorites.\n\n### Konqueror\n[https://packages.debian.org/stretch/konqueror](https://packages.debian.org/stretch/konqueror)\n\
    Konqueror is a powerful file manager for the KDE desktop environment. Konqueror\
    \ offers simple file management functionalities such as copying, moving, searching\
    \ and deleting files and directories plus some advanced features and functionalities,\
    \ such as access to archives, browse and rip audio CDs as well as support for\
    \ access to FTP and SFTP servers and SAMBA (Windows) shares.\n![](image1065.jpg)\n\
    \n### Nautilus\n[https://wiki.gnome.org/Apps/Nautilus](https://wiki.gnome.org/Apps/Nautilus)\n\
    Nautilus is the file manager on the GNOME desktop. It offers easy navigation and\
    \ management of files on a Linux system. This includes simple file management\
    \ functionalities such as copying, moving, searching and deleting files and directories,\
    \ as well as easy access to local and remote files.\n![](image1071.jpg)\n\n###\
    \ Dolphin\n[www.kde.org/applications/system/dolphin/](http://www.kde.org/applications/system/dolphin/)\n\
    Dolphin is a lightweight file manager developed as part of the KDE applications\
    \ package. Designed for simplicity, flexibility and full customization, it allows\
    \ users to browse, locate, open, copy and move files around a Linux system with\
    \ a lot of ease.\n![](image1077.jpg)\n\n### Thunar\n[https://docs.xfce.org/xfce/thunar/start](https://docs.xfce.org/xfce/thunar/start)\n\
    Thunar is a modern, lightweight file manager for the XFCE desktop. It is designed\
    \ to be fast, responsive and easy to use. We use it here because it has a clean\
    \ and intuitive interface with few and important user options available.\n![](image1083.jpg)\n\
    \n## 6. Introduction to Linux Terminals\n\nWorking with the Linux operating system\
    \ requires you to have knowledge about the terminal and the command line. It is\
    \ essential to know what these things are, to be at least slightly familiar with\
    \ their usage and the standard commands available. A few of these commands have\
    \ already been introduced in Chapter 5.\n\n### 6.1 What is a Terminal?\n\nA terminal\
    \ is described as \"a program that emulates a video terminal within some other\
    \ display architecture. Though typically synonymous with a shell or text terminal,\
    \ the term terminal covers all remote terminals, including graphical interfaces.\
    \ A terminal emulator inside a graphical user interface is often called a terminal\
    \ window”. \n\nTo be precise, a terminal is simply the outside. Inside a terminal\
    \ runs a command line interpreter that is called a `shell`.\n\nDebian Linux supports\
    \ a long list of terminal software. This includes the `Aterm`, as well as the\
    \ `GNOME terminal`, the `Kterm`, the `Mate Terminal`, the `Rxvt`, the `Xterm`\
    \ and the `Xvt`. These different implementations of terminal software vary in\
    \ terms of stability, support for character sets, design, colors and fonts, as\
    \ well as the possibility to apply background images or work with transparency\n\
    \nIn this book we will use the `GNOME terminal` because of its stability, simplicity\
    \ and adjustability. In order to increase and decrease the size of the content\
    \ that is displayed inside the terminal window; use the two-key combinations `CTRL+`\
    \ and `CTRL-`.\n\n### 6.2 What is a Shell?\n\nSimply speaking, a `shell` is a\
    \ sophisticated command-line interpreter. In a loop the `shell` reads characters,\
    \ modifies them under certain conditions, and executes the result.\n\nUnder certain\
    \ conditions, between reading from the command-line and the execution of the actual\
    \ result, the `shell` has to interpret special characters that are part of your\
    \ input. The table below displays the special characters that are available:\n\
    \n| Character | Meaning |\n| :--- | :--- |\n| `$name` | substitution of a variable\
    \ |\n| `name=` | assignment of a variable |\n| `'command'` | substitution of a\
    \ command |\n| `$( command )` | substitution of a command |\n| `< > >> 2> 2>>`\
    \ | redirection of input and output |\n| `\\|` | pipining of commands |\n| `\"\
    \ ' \\ \\|` | quoting |\n| `* [ ] ?` | creation of file names ( globbing) |\n\
    | `;` | separation of commands |\n| `&` | run the command in the background |\n\
    | `\\| &&` | run the commands under certain conditions |\n| `{ } ( )` | cramp\
    \ commands |\n\nFor interest sake, the `shell` divides the command-line into single\
    \ words in order to determine the commands, by means of the following process:\n\
