    `su` 命令永久更改当前角色。若要以管理员身份运行单个命令，请使用 `sudo` 命令。这需要安装 Debian 的“sudo”软件包（请参阅第 4 节“安装额外软件”），并使用
    `visudo` 命令将额外用户添加到配置文件 `/etc/sudoers` 中。这一步将在稍后进行详细解释。


    ### adduser

    `adduser` 命令用于创建新用户账户。下图显示了所需的信息。这包括在 `/etc/passwd` 文件中添加一个新条目，以及创建一个新组和主目录。此外，来自
    `/etc/skel` 目录的预备数据会被复制到之前创建的主目录中。之后，可以使用 `chsh` 命令修改账户信息（参见本章前面的内容）。


    ![](img/image1738.jpg)


    设置好新用户后，`/etc/passwd` 文件中的条目如下：


    ![](img/image1742.jpg)


    删除用户账户和修改用户账户通过 `deluser` 和 `usermod` 两个命令完成。这些命令用法将在稍后进行详细解释。


    ### 7.4 进程管理


    ### ps

    该命令列出 Linux 系统中运行的进程。下图显示了你当前终端会话中的进程，其中调用 `ps ax`（见随后的图像）列出了 Linux 系统中的所有进程。`ps`
    命令有一长系列选项，将在稍后进行更详细解释。


    ![](img/image1749.jpg)

    ![](img/image1752.jpg)


    ### pgrep

    `pgrep` 是用于进程的 `grep` 命令（参见本章前面的内容）。该命令遍历当前运行的进程，并输出匹配给定模式的进程 ID。


    下图显示了两次调用。第一次请求 `pgrep` 搜索名称中包含“xterm”字符串模式的进程，并仅输出结果进程 ID。第二次调用使用了 `-l`（--list-name
    的缩写）和 `-a`（--list-full 的缩写）两个选项，以便显示进程 ID 和结果进程名。


    `pgrep` 的伙伴是 `pkill`。这两个命令都是 Debian “procps”软件包的一部分（请参阅第 4 节“如何安装额外软件包”）。


    ![](img/image1759.jpg)


    ### kill

    该命令向进程发送特定信号。要终止此进程，请使用 `SIGTERM` 信号。下一个示例显示了如何结束 ID 为 12345 的进程。


    `kill` 命令需要进程 ID 才能正常工作。请先使用 `ps` 或 `pgrep` 获取相应的进程 ID（参见本章前面的内容）。


    ```

    $ kill 12345

    ```


    ### killall

    该命令是 Debian 基本软件包“psmisc”的一部分（请参阅第 4 节“安装额外软件包”）。`killall` 向所有匹配指定命令的进程发送信号。例如，命令


    ```

    killall firefox

    ```


    向所有名为“firefox”的进程发送 `SIGTERM` 信号以终止进程。除其他选项外，`killall` 还允许这些参数：


    - `-e`（--exact 的缩写）：要求精确匹配

    - `-I`（--ignore-case 的缩写）：处理进程名时不区分大小写

    - `-i`（--interactive 的缩写）：在终止进程前交互式请求确认

    - `-v`（--verbose 的缩写）：如果进程终止，则发送确认消息


    接下来的示例显示了如何结合 `pgrep` 和 `killall` 两个命令。首先，使用 `pgrep` 获取进程 ID 以及进程的精确名称。其次，带有 `-i`
    和 `-v` 选项调用 `killall` 以终止所有该名称的进程。在杀死进程之前，`killall` 会要求你确认，并在之后输出确认消息。


    ![](img/image1792.jpg)


    ### pkill

    `pkill` 和 `pgrep`（参见本章前面的内容）两个命令属于同一个软件包。`pgrep` 扫描进程列表并输出进程 ID，而 `pkill` 命令向匹配给定模式的进程发送终止信号。要终止所有“xterm”进程，请调用以下命令：


    ```

    $ pkill xterm

    ```


    ### top

    `top` 命令根据活动情况显示进程。最活跃的进程位于顶部，随后是不活跃的进程。列表每秒更新一次。单列包含进程 ID（标题为 `PID`）、进程所有者的用户名（标题为
    `USER`）、进程优先级（标题为 `PR`）、nice  own（标题为 `NI`）、虚拟内存使用（标题为 `VIRT`）、预留内存（标题为 `RES`）、共享内存（标题为
    `SHR`）、CPU 和内存使用的百分比（标题为 `%CPU` 和 `%MEM`）、进程的运行时间（标题为 `TIME+`）以及调用进程的命令（标题为 `COMMAND`）。


    要退出 `top` 请按 `q` 键。


    ![](img/image1808.jpg)


    ### htop

    “htop”是一个额外的软件包（请参阅第 4 节“安装额外软件包”），包含一个更具交互性的 `top` 版本（我们在上面提到过）。列的布局与 `top` 类似。使用导航键和功能键来选择、排序或删除进程。功能键如下：


    - `F1`:显示帮助

    - `F2`:配置 htop

    - `F3`:在进程列表中搜索

    - `F4`:过滤终端输出

    - `F5`:以进程树的形式显示进程

    - `F6`:更改进程的排序顺序

    - `F7`:降低选中进程的 nice  own

    - `F8`:增加选中进程的 nice  own

    - `F9`:终止选中进程

    - `F10`:退出程序


    ![](img/image1834.jpg)


    ### 7.5 网络和系统信息


    ### uname

    `uname` 是“UNIX name”的缩写。该命令显示系统信息，例如 Linux 内核的准确名称和版本以及你计算机的主机名。


    下图显示了带有参数 `-a`（--all 的缩写）的 `uname` 调用。输出包含操作系统（Linux）、主机名（debian95）、内核版本及其编译日期（4.9.8-7-amd64
    #1 SMP Debian 4.9.110-1 (2018-07-05））以及架构（x86_64）。


    ![](img/image1841.jpg)


    ### uptime

    该命令显示系统运行了多久。它显示当前时间（07:36:47），随后是以小时计算的运行时间（21:56）、登录用户数（1 user）以及过去 1、5 和 15
    分钟的平均负载（load average: 0.47, 0.43, 0.29）。


    ![](img/image1846.jpg)


    为了以更漂亮的方式查看运行时间，请使用选项 `-p`（--pretty 的缩写）。下图显示了更易读的信息版本。系统已运行了 22 小时 3 分钟。


    ![](img/image1850.jpg)


    ### ip

    `ip` 命令（配合关键词 `address show`）显示当前的网络配置。下图显示了环回接口（`lo`）和以太网接口（`enp0s3`）。以太网接口配置了
    IP 地址 `10.0.2.15`。网络接口缩写如下：


    - `lo`:环回接口。用于访问本地代理或 Web 服务器 http://127.0.0.1/

    - `eth0`:连接到网络交换机或路由器的第一个以太网接口

    - `wlan0`:第一个无线接口

    - `ppp0`:第一个点对点接口，用于通过 VPN 或拨号服务连接

