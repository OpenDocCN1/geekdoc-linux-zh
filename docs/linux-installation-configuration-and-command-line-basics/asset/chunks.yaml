    ## 6.3 可用的 Shell

    你的 Linux 系统允许使用多种 shell。每个 shell 都可以通过我们之前安装的 Debian 软件包管理器 `Aptitude` 作为独立的软件包进行安装。shell
    的列表非常长，因此我们只列出了一些最常用的可用 shell：


    * Almquist Shell (ash)

    * Bourne Again Shell (bash)

    * Debian Almquist Shell (dash)

    * Z Shell (zsh)

    * C Shell (csh)

    * Korn Shell (ksh)

    * Tenex C Shell (tcsh)


    除非另有说明，本文档中的示例均基于 Bourne Again Shell (`bash`)。在编写本文档时，这是 Debian 的默认 shell。你的 Linux
    系统允许哪些其他 shell 可以在配置文件 `/etc/shells` 中进行设置。使用 `cat` 命令，你可以查看到被允许的 shell 列表：


    ```bash

    user@debian95:~$ cat /etc/shells

    # /etc/shells: valid login shells

    /bin/sh

    /bin/dash

    /bin/bash

    /bin/rbash

    /usr/bin/screen

    user@debian95:~$

    ```


    你终端中当前正在使用的 shell 名称存储在 shell 变量 `$0` 中。以下简单命令可以输出 shell 的名称：


    ```bash

    user@debian95:~$ echo $0

    bash

    user@debian95:~$

    ```


    为了更改当前正在使用的 shell，请查看后续章节介绍的 `chsh` 命令和配置文件 `/etc/passwd`。


    ## 7. 基础 Linux 命令

    在本章中，我们将解释基础 Linux 命令，这些命令将帮助你处理文件和目录、文本处理命令、用户和用户组、进程管理、网络以及帮助系统。


    ### 7.1 文件和目录

    #### touch

    `touch` 命令用于更新文件的访问日期或修改日期，它以两种方式工作：如果文件已存在，则文件的访问和修改时间戳将被设置为当前时间戳。如果文件不存在，将创建一个具有当前时间戳的空文件（见下图）。

    ![](img/image1335.jpg)


    使用 `touch` 命令可以设置文件的时间戳，并判断你是否有相应的权限写入目录或整个文件系统。


    #### ls

    此命令列出目录中的条目。下图显示了两种常用方式：不带任何选项，以及带有选项 `-la`（`-l -a` 的缩写，意味着 long all）。第一个输出仅显示普通文件的条目名称，而第二个输出列出了普通文件和隐藏条目。此外，它还显示了所有信息，如条目类型、权限、所有者名称、条目大小、访问日期和条目名称。

    ![](img/image1341.jpg)


    为了仅列出目录，使用选项 `-d`（`--directory` 的缩写）。


    #### mkdir

    此命令用于创建目录（make directory）。以下示例在当前目录下创建一个名为“training”的新目录：


    ```bash

    $ mkdir training

    ```


    #### rmdir

    此命令用于删除空目录（remove directory）。以下示例删除了当前目录下一个名为“training”的空目录。


    ```bash

    $ rmdir training

    ```


    #### rm

    `rm` 命令是“remove”的缩写，用于删除文件和目录。要删除当前目录下所有以 `.txt` 结尾的文件，请执行以下命令：


    ```bash

    $ rm *.txt

    ```


    在删除文件和目录时为了起起见，请结合选项 `-i`（或 `--interactive`）和 `-v`（用于 `--verbose`）。在删除文件之前，`rm`
    将请求你的显式确认并打印状态消息：


    ```bash

    $ rm -iv invoice156.txt

    rm: remove regular file "invoice156.txt"? y

    "invoice156.txt" was deleted

    ```


    #### cp

    `cp` 命令用于复制文件。


    #### mv

    `mv` 命令是“move”的缩写，用于移动或重命名文件和目录。


    #### file

    `file` 命令用于确定文件类型。


    '
- fmt: '

    `head` and `tail` outputs the first lines from a file. Invoked without further
    parameters it outputs up to ten lines. In contrast `tail` does the same thing,
    but starts at the end of a file. In order to output the first two lines, add the
    option `-n 2` as follows:


    ```bash

    $ head -n 2 placesAmsterdamBerlin$

    ```


    In order to output the last two lines, do the same thing using `tail` as follows.
    In contrast to `tac` (see earlier in this chapter) `tail` does not change the
    order of output.


    ```bash

    $ tail -n 2 placesBernCape Town$

    ```


    `nln` is similar to `cat` (see earlier in this chapter) but adds a line number
    at the beginning of each line of output.


    ```bash

    $ nl places1 Amsterdam2 Berlin3 Bern4 Cape Town$

    ```


    `wc`

    This command abbreviates the phrase “word count” and counts lines, words and single
    characters of the input data. Unless otherwise specified, all three values are
    printed:


    ```bash

    $ wc places4 5 32 places$

    ```


    Amongst others `wc` offers the following options to limit the output:


    - `-l`: output the number of lines only, followed by the filename

    - `-w`: output the number of words only, followed by the filename

    - `-c`: output the number of characters only, followed by the filename


    This example shows how to count only the lines in a file:


    ```bash

    $ wc -l places4 places$

    ```


    ### 7.3 Users and Groups

    These commands deal with a variety of actions in order to manage the users and
    groups of your Linux system. Unless explicitly stated, these commands can be run
    as a regular user.


    #### `whoami`

    This command returns your current user ID as follows:


    ```bash

    $ whoamiuser$

    ```


    #### `users`, `who` and `w`

    The `users`, `who` and the `w` commands show the users that are currently logged
    into your Linux system. `w` extends the output of `who` by the uptime information
    and another column that contains the last command that was executed. In contrast,
    `users` simply outputs the name of the users as a space-separated list in a single
    line (see image below).![](image1610.jpg)


    The single columns for `who` start with the login name of the user. The output
    is followed by the name of the terminal, where “console” represents a login terminal,
    and “pts/1” abbreviates the first pseudo terminal session. The last two columns
    contain the login time and the host the user comes from, in brackets (see image
    below).![](image1614.jpg)


    The single columns for `w` contain the login name of the user (titled `LOGIN`),
    the name of the terminal (titled `TTY`), the name of the host the user comes from
    (titled `FROM`), the login time (titled `LOGIN@`), the activity (idle time and
    CPU usage titled `IDLE`, `JCPU`, and `PCPU`) as well as the last command the user
    executed (titled `WHAT`) (see image below).![](image1618.jpg)


    #### `id` and `groups`

    The `id` command outputs the user and group information of the current user (see
    image below). From left to right the columns show the user ID (`uid=1000(user)`),
    the group id (`gid=1000(group)`) and the name of the groups the user is a member
    of.![](image1623.jpg)


    In order to list the names of all the groups the user belongs to, you can also
    invoke the `groups` command (see image below). The output is a space-separated
    list of the group names.![](image1627.jpg)


    #### `passwd`

    As described in Chapter 4, the Linux system has at least two users: an administrative
    root user and a regular user that we simply called `user`. Every account is also
    secured with a password. In order to change your password, use the `passwd` command
    from the Debian `passwd` package (refer to Chapter 4 on how to install additional
    software). As shown below, type in the current password first, press Enter, type
    in the new password, press Enter to confirm, retype the new password and press
    Enter to confirm, again.![](image1633.jpg)


    As a regular user, you are allowed to change your own password only. The administrative
    root user is able to set a new password for itself and other users as well. In
    such a scenario, we call `passwd` as follows:


    ```bash

    # passwd felix

    Changing password for felix.(current) UNIX password:

    Enter new UNIX password:

    Retype new UNIX password:

    passwd: password updated successfully

    ```


    The password is stored as a hashed value in the configuration file `/etc/shadow`.
    The content of this file is only visible to the administrative user. The example
    below shows how to extract the information for the user “user” with the help of
    the `grep` command (see earlier in this chapter).![](image1656.jpg)


    #### `chfn`

    This command is also from the Debian `passwd` package and changes the user information
    that is stored on your system in the file `/etc/passwd`. During the installation
    of your Debian system the basic setup was already done. In order to modify this
    information you can run `chfn` without further parameters in interactive mode,
    or with one or more of the following options to adapt only a specific value:


    - `-f` or `--full-name`: change the full name of the user

    - `-h` or `--home-phone`: change the home phone of the user

    - `-r` or `--room`: change the room number of the user

    - `-w` or `--work-phone`: change the work phone of the user


    The following example changes the entry for the home phone number to 135:


    ```bash

    $ chfn -h 135Password:$

    ```


    #### `chsh`

    This command (also from the Debian `passwd` package) changes the entry for the
    shell that you use to log into your Linux system. Again, this information is stored
    in the file `/etc/passwd`. Which shells are allowed to be used are limited by
    the entries in the configuration file `/etc/shells`. `chsh` works similar to the
    `chfn` command. Invoked without further options an interactive method is used
    (see image below).![](image1684.jpg)


    `chsh` accepts the option `-s` (short for `--shell`) in order to set the shell
    in non-interactive mode. The following example shows the according command line
    call:


    ```bash

    $ chsh -s /bin/bash

    ```


    In order to modify the shell for a different user other than yourself, invoke
    the `chsh` command with the username as a parameter. Note that only the administrative
    user can do this for a different user. The next example shows how to do that for
    the user “felix”.


    ```bash

    # chsh felix

    Changing the login shell for felix

    Enter the new value, or press ENTER for the new value

    Login shell [/bin/bash]:#

    ```


    #### `su` and `sudo`

    In order to change your role from one user to another, you utilize the `su` command.
    `su` abbreviates “switch user”. Invoked without further options you change to
    the root user as follows:


    ```bash

    $ suPassword:#

    ```


    Working as the administrative root user comes with great responsibility and presumes
    that you know exactly what you are doing. To work as a different user than root,
    invoke the `su` command with the desired username as follows:


    ```bash

    $ su felixPassword:$

    ```

