    Introduction to Linux TerminalsWorking with the Linux operating system requires
    you to have knowledge about the terminal and the command line. It is essential
    to know what these things are, to be at least slightly familiar with their usage
    and the standard commands available. A few of these commands have already been
    introduced in Chapter 5.6.1 What is a Terminal?A terminal is described as "a program
    that emulates a video terminal within some other display architecture. Though
    typically synonymous with a shell or text terminal, the term terminal covers all
    remote terminals, including graphical interfaces. A terminal emulator inside a
    graphical user interface is often called a terminal window”.To be precise, a terminal
    is simply the outside. Inside a terminal runs a command line interpreter that
    is called a shell.Debian Linux supports a long list of terminal software. This
    includes the Aterm, as well as the GNOME terminal, the Kterm, the Mate Terminal,
    the Rxvt, the Xterm and the Xvt. These different implementations of terminal software
    vary in terms of stability, support for character sets, design, colors and fonts,
    as well as the possibility to apply background images or work with transparencyIn
    this book we will use the GNOME terminal because of its stability, simplicity
    and adjustability. In order to increase and decrease the size of the content that
    is displayed inside the terminal window; use the two-key combinations CTRL+ and
    CTRL-.6.2 What is a Shell?Simply speaking, a shell is a sophisticated command-line
    interpreter. In a loop the shell reads characters, modifies them under certain
    conditions, and executes the result.Under certain conditions, between reading
    from the command-line and the execution of the actual result, the shell has to
    interpret special characters that are part of your input. The table below displays
    the special characters that are available:


    | Character | Meaning |


    | $name | substitution of a variable |


    | name= | assignment of a variable |


    | ''command'' | substitution of a command |


    | $( command ) | substitution of a command |


    | < > >> 2> 2>> | redirection of input and output |


    | &#124; | pipelining of commands |


    | " '' \ | quoting |


    | * [ ] ? | creation of file names ( globbing) |


    | ; | separation of commands |


    | & | run the command in the background |


    | &#124;&#124; && | run the commands under certain conditions |


    | { } ( ) | cramp commands |


    For interest sake, the shell divides the command-line into single words in order
    to determine the commands, by means of the following process:


    | Step | Description | Special Characters |


    | 1 | read until the command separator and tagging (substitution of commands)
    | \n & &#124; &#124;&#124; && ; $(...) \ "..." ''..." |


    | 2 | tagging (input-/output redirection, assignment of values) | < > >> 2> 2>>
    name= |


    | 3 | division into single words | space, tabulator |


    | 4 | substitution of variables | $name |


    | 5 | substitution of commands | tagging, see step 1 and 2 |


    | 6 | input-/output redirection | tagging, see step 1 and 2 |


    | 7 | assignment of variables | tagging, see step 1 and 2 |


    | 8 | division into words | based on IFS |


    | 9 | creation of file names | * [ - ] |


    | 10 | command execution |  |


    In steps 1 and 2 tagging happens for steps 5 to 7 only, and no further action
    takes place. Steps 5 to 7 are executed if tagging is completed. Next, the shell
    removes all the special characters. In step 10 the command-line contains only
    the arguments that are needed to execute the command. The shell interprets the
    first word as the name of the command to be executed, and the remaining words
    are its arguments:


    | command arg1 arg2 arg3 ... |'
