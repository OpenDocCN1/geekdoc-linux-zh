    ## 切换目录


    `cd`（切换目录）命令允许你在系统中进行移动。要向上移动一级层到根目录，请使用此命令：


    ```bash

    $ cd ..

    ```


    要向下进入子目录，请输入 `cd` 命令后紧跟目录名称。`cd /home/user/test` 命令将直接带你进入 `/home/user/test` 目录。正如之前解释过的，有一些快捷方式可用。命令
    `cd ~`（波浪号）和 `cd $HOME` 始终会将你带回主目录，而 `cd /` 则将带你去 `/` 根目录。


    **提示**：由于 Linux 是区分大小写的，因此 `cd` 和 `CD` 是不同的。在使用大写和小写字母时需要格外小心。


    ## 重命名目录


    可以使用 `mv` 命令（移动）来实现。要将目录名称从“lpic1”重命名为“lpic-1”，请输入以下：


    ```bash

    $ mv lpic1 lpic-1

    ```


    ## 5.3 基于终端的文件管理器


    在命令行中导航 Linux 并不是最理想的情况。基于终端和图形化的文件管理器是极好的替代方案。基于终端的文件管理器运行在终端内部，不会在桌面上打开独立的窗口。有许多程序可用，因此我们只向你介绍我们最喜欢的几个。


    ### GNU Midnight Commander (mc)

    [www.midnight-commander.org](http://www.midnight-commander.org)

    这是一个免费的、全屏的文本模式可视化文件管理器，允许你搜索、复制、移动以及删除单个或多个文件，甚至是整个目录树。`mc` 集成了查看器和编辑器。

    ![](img/image1051.jpg)


    ### Vi 文件管理器 (vifm)

    [`vifm.info/`](https://vifm.info/)

    与 `mc` 类似，Vi 文件管理器 `vifm` 带有基于 curses 界面的两个导航窗口。它为管理文件和目录提供了类似于 Vi(m) 的环境。如果你熟悉
    Vi 的键位绑定，那么这个文件管理器非常适合你。

    ![](img/image1057.jpg)


    ## 5.4 图形化文件管理器


    与基于终端的文件管理器类似，图形文件管理器也能协助导航 Linux。这些文件管理器会在独立的窗口中打开，但提供了更好的用户体验。同样，有许多程序可用，所以我们只向你介绍我们最喜欢的几个。


    ### Konqueror

    [`packages.debian.org/stretch/konqueror`](https://packages.debian.org/stretch/konqueror)

    Konqueror 是 KDE 桌面环境的强大文件管理器。Konqueror 提供了简单的文件管理功能，如复制、移动、搜索和删除文件目录，以及一些高级功能，例如访问压缩包、浏览和刻录音频
    CD，以及对访问 FTP 和 SFTP 服务器以及 SAMBA（Windows）共享的支持。

