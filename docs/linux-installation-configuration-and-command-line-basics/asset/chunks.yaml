    Ubuntu 提供三个官方版本：Ubuntu Desktop、Ubuntu Server 和 Ubuntu Core（用于物联网）。它支持多种架构，如 `i386`、`IA-32`、`amd64`、`ARMhf`
    (ARMv7 VFPv3-D16)、`ARM64`、`powerpc` (64 位) 和 `s390x`。最初发布于 2004 年，每年发布两次：分别在 4
    月和 10 月。发布版本通过版本号体现：`18.04` 指的是 2018 年 4 月发布的版本。版本的代号基于一个形容词和一个动物，例如 Ubuntu 14.10
    的代号为 `Utopic Unicorn`。![](img/image287.jpg)


    # Linux Mint

    Linux Mint 是一种基于 Ubuntu 的非商业发行版，并遵循其发布方案。首次发布日期可以追溯到 2006 年。从 2014 年开始，每年发布两次，比
    Ubuntu 发布晚一个月。发布版本的代号是以 `a` 结尾的女性名字，例如版本 6 的 `Felicia`。Linux Mint 支持 `IA-32` 和
    `amd64` 两种架构。该发行版的目标是能够轻松使用的桌面用户。![](img/image292.jpg)


    # Red Hat Enterprise Linux (RHEL)

    RHEL 是一种商业 Linux 发行版。它基于 Red Hat Linux（1995 年至 2004 年间可用）加上 `Fedora` 19 和 20 的组合。其原始发布日期可以追溯到
    2000 年。它对企业客户的关注包括长期支持、培训和认证计划（见第 1 章）。红帽的社区项目被称为 `Fedora`（见下文）。软件包以 `.rpm` 格式（红帽包管理器）提供。RHEL
    支持 `arm` (64 位)、`i386`、`amd64`、`powerpc` 以及 `s390` 和 `zSeries` 架构。该发行版同时针对服务器和桌面。版本的代号看起来相当随机，因为它没有遵循类似于
    Debian 或 Ubuntu 的方案。![](img/image298.jpg)


    # Fedora

    Fedora 是一种社区 Linux 发行版，主要面向桌面使用。它基于 Red Hat Enterprise Linux (RHEL) 并由红帽赞助。它于
    2003 年 Red Hat Linux 结束支持时推出。截至 2018 年，它提供了以下版本：


    *   Workstation：用于 pc

    *   Server：用于服务器

    *   Atomic：用于云计算


    Fedora 支持 `amd64`、`ArmHF`、`powerpc`、`mips`、`s390` 和 `RISC-V` 架构。该发行版的生命周期较短，大约每
    6 个月发布新版本。版本的代号没有遵循固定的命名方案，主要由城市名称组成。![](img/image311.jpg)


    # CentOS

    CentOS 是 Community Enterprise Operating System（社区企业操作系统）的缩写。与 Fedora 一样，它基于 Red
    Hat Enterprise Linux，并在二进制软件包方面保持兼容。这允许在 CentOS 上使用最初为 RHEL 设计和开发的软件。与 Fedora
    不同，它侧关注桌面和服务器的企业级用途，并提供长期支持。CentOS 的首次发布可以追溯到 2004 年 5 月。软件包来自三个不同的仓库：


    *   Base：常规、稳定的软件包

    *   Updates：安全、错误修复或增强更新

    *   Addons：构建构成 CentOS 发行版的大型软件包所需的包，但上游并未提供


    CentOS 支持 `i386` 和 `amd64` 架构。不支持其他架构。![](img/image324.jpg)


    # openSUSE

    Linux 发行版 openSUSE 起根于 SUSE Linux 和商业版的 SUSE Linux Professional，后者于 1994 年首次发布。SUSE
    的名称是原始德国所有者 `Gesellschaft für Software- und Systementwicklung GmbH` 的缩写。openSUSE
    基于 Red Hat Linux 和 Slackware 的结构，并使用 `.rpm` 作为软件归档格式。它支持 `i586`、`x86-64` 和 `ARM`
    架构。openSUSE 项目的目标是每八个月发布一个新版本。与 Fedora 一样，版本的代号没有遵循固定的命名方案。![](img/image330.jpg)


    # Arch Linux

    Arch Linux 是一种免费的 Linux 发行版，于 2002 年首次发布。它遵循滚动更新（rolling release）原则，导致该发行版每月发布一次。目前核心团队由约
    25 名开发者组成，并受到许多被称为“信任用户”的其他开发者的支持。Arch Linux 使用 `Pacman` 作为软件包管理系统。软件包存储在四个软件仓库中：


    *   Core：用于基础系统的软件包

    *   Extra：额外的软件包，如桌面环境和数据库

    *   Community：由信任用户维护的软件包

    *   Multilib：可以在多个架构上使用的软件包


    Arch Linux 支持 `amd64` 架构。2007 年之前的早期版本代号没有遵循特定方案。![](img/image345.jpg)


    # Gentoo

    与 Arch Linux 一样，Gentoo 也遵循滚动更新原则。每周提供新的安装镜像，首次发布见于 2002 年。Gentoo 的特殊之处在于它是一个基于源码的发行版。在安装软件之前，必须先编译。支持的架构包括
    `alpha`、`amd64`、`arm`、`hppa`、`IA-64`、`m68k`、`mips`、`powerpc`、`s390`、`sh` 和 `sparc`。![](img/image350.jpg)


    # Slackware

    Slackware 是最老的活跃 Linux 发行版。首次发布可以追溯到 1992 年。定期发布没有固定间隔。它针对专业用户，并尽可能给予他们自由。Slackware
    使用压缩的 `.tar.gz` 存档作为软件包格式，并支持 `i486`、`alpha`、`sparc` 和 `arm` 四种架构。该发行版也被移植到了 `s390`
    架构。image356.jpg](http://www.Amazon.com/gp/customer-reviews/write-a-review.html?asin=B07HDTG5D)


    # 安装 Linux 系统

    如上一章所述，我们将使用 Debian 进行演示。回顾一下，Debian 是一个提供极佳稳定性且一旦你的技能和知识超过了初级阶段，其扩展性非常好。在本章中，我们将安装并配置
    Debian，向你展示其中的每一个步骤。


    ## 安装类型

    Debian 提供了多种设置方法。这包括图形界面安装和文本安装；我们将使用前者。对于安装媒体，Debian 开发者提供了三种变体：


    *   用于 32 位和 64 位的 CD 或 DVD

    *   用于 32 位和 64 位的网络镜像（所谓的 Netinst-ISO）

    *   用于 32 位或 64 位的微型 CD


    '
- fmt: '

    We also have test media available. These include live images for 32 bit and 64
    bit, and allow you to try Debian before installing it on your computer. During
    the time of writing this document, version 9.5 is the current stable release of
    Debian. The setup described here is based on this release and the `amd64` architecture.
    After downloading the network image from [www.debian.org/distrib](http://www.debian.org/distrib)
    no further static images are required to be referenced in the system. Instead,
    it depends on the internet connection to retrieve the packages to be installed
    and keep your operating system up-to-date. The entire process will take you about
    an hour and it allows you to have a lean software selection according to your
    specific needs. Software packages that you do not use will not be available on
    your system. They can be added whenever you feel the need for them. The target
    system of our installation is an XFCE-based desktop system for a single user with
    a web browser and a music player. For the web browser we use `Mozilla Firefox`
    and for the music player, `VLC`. Both programs are a permanent component of the
    Linux distribution. The environment we use for demonstration purposes is a virtual
    machine based on `VirtualBox` with 4 GB of RAM and 15 GB of disc space.


    ## 4.2 Installing Linux Step-by-Step


    ### Boot Menu

    In order to begin with the installation of Debian, first boot the computer (in
    our case the `VirtualBox` image) from the ISO image you have downloaded. If you
    are also using a virtual machine, see your virtual machine vendor website for
    help on how to enable the ISO image. Next, wait for the boot menu to appear on
    the screen. The image below shows you the different options that are offered.
    Using the cursor keys you can navigate the boot menu, and the `Enter` key selects
    an entry.


    ![](image382.jpg)

    The different options are:


    *   Graphical install: start the installation process using a graphical installer

    *   Install: starting the installation process using a text-based installer

    *   Advanced options: select further options like Expert mode, Automated install
    or Rescue mode (see image below for more details)

    *   Help: get further help

    *   Install with speech synthesis: starting the installation process with speech
    support


    ![](image397.jpg)


    From the main boot menu choose the entry `Graphical install`, and press the `Enter`
    key to proceed.


    ### Language Selection

    Next, choose the language you prefer to be used during the entire installation
    process. The dialogs and messages are translated accordingly. This selection does
    not determine irrevocably the language your Linux system will have, you can always
    choose a different language later. The image below shows the dialog box. English
    is already pre-selected, and so you just have to click the `Continue` button on
    the lower-right corner of the dialog box to proceed.


    ![](image404.jpg)


    ### Location Selection

    Third, make a selection regarding your location (see image below). Based on your
    language setting made before, the countries are listed in which the chosen language
    is mainly spoken. This also influences the locale settings like the time zone
    your computer is in. In order to have a different setting choose the entry titled
    `other` from the end of the list and go on from there. When you are done, click
    the `Continue` button to proceed with step four.


    ![](image409.jpg)


    ### Keyboard Selection

    Fourth, choose your keyboard layout from the list (see image below). For the United
    States the pre-selection is American English. If you use a different keyboard
    layout select the right one from the list. If done click the `Continue` button
    to proceed with step five.


    ![](image414.jpg)


    ### Network Setup

    Step five includes loading the installer components from the ISO image, and the
    detection of the network hardware in order to load the correct network driver.
    Then, the installer tries to connect to the internet to retrieve an IP address
    via `DHCP` from your local network server.


    When done, you can set up the hostname of your computer (see image below). Choose
    a unique name for your machine that consists of a single name and does not exist
    yet in your local network segment. It is common to use names of fruits, places,
    musical instruments, composers and characters from movies. In this case we choose
    the name `debian95` that simply represents the Linux distribution and its version
    number.


    ![](image420.jpg)


    When you are done, click the `Continue` button to proceed with step six to add
    a domain name like `yourcompany.com` (see image below). In this case it is not
    needed. That’s why we leave the entry field empty. Click the `Continue` button
    on the lower-right corner to proceed with the installation.


    ![](image424.jpg)


    ### Users and Roles

    Our Linux system needs at least two users in order to be operated properly. One
    is an administrative user that has a fixed name `root` and the other is a regular
    user that we just give the name of `User` in this case.


    In the next two steps you set the password for the user `root` (see image below)
    and both the full name and account name for the regular user. For simplicity we
    use `Debian User` as the full name and `User` as the account name. For both users,
    choose a password that is dissimilar and that you can remember. You will need
    these passwords later in order to log onto your computer.


    ![](image430.jpg)


    ### Time Zone

    Setting the correct time zone is of significant importance for communication with
    other services, especially in a network. Choose the value from the list as seen
    in the image below. The entries in the list are based on the location you have
    selected before. When done, click the `Continue` button to define the storage
    media and the accompanying partitions.


    ![](image435.jpg)


    ### Storage Media and Partitioning

    A Linux system can be distributed across a number of different storage media like
    hard disks and flash drives. Over and above, a storage media can be separated
    into multiple disk partitions. In order to do so, the setup program of Debian
    has the following methods available (see image below):


    *   Guided - use entire disk: follow the steps as provided and use the entire
    disk for the Linux installation. This creates partitions with fixed sizes.

    *   Guided - use entire disk and set up LVM: follow the steps as provided and
    use the entire disk for the Linux installation. This option makes use of Logical
    Volume Management (`LVM`) in order to create partitions with sizes that can be
    changed later on.

    *   Guided - use entire disk and set up encrypted LVM: follow the steps as provided
    and use the entire disk for the Linux installation. This option makes use of Logical
    Volume Management (`LVM`) in order to create encrypted partitions with sizes that
    can be changed later on.

    *   Manual: create partitions individually. This is the expert mode and requires
    deeper knowledge about partitions and file system parameters.


    ![](image449.jpg)


    From the list choose the entry `Guided - use entire disk`. The values for partition
    sizes are chosen according to experience, implemented as an algorithm. A manual
    calculation is not required. Click the `Continue` button on the lower-right corner
    to proceed with the installation.


    Next, select the disk to partition. In our case we have only one disk available
    (see image below). Later on in this guide the disk will be referred to as `/dev/sda`
    for the 1st SCSI disk.


    ![](image454.jpg)


    A disk partition refers to a piece of the storage media that is organized separately
    and is intended to contain a branch of the Linux file system tree. There is no
    universal way to do this separation correctly. This guide shows a simple but safe
    solution that works for a basic system. The menu in the dialog box offers the
    following options:


    *   All files in one partition: use just a single partition to keep programs and
    user data

    *   Separate /home partition: store programs and user data in separate partitions

    *   Separate /home, /var, and /tmp partitions: keep user data, variable data and
    temporary data in separate partitions

