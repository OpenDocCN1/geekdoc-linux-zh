    \ will only work for executables stored on disk, not aliases or built-in shell\
    \ functions.\n\n# nohup\n\nSometimes you have to run a long-lived process on a\
    \ remote machine, and then you need to disconnect.\n\nOr you simply want to prevent\
    \ the command to be halted if there's any network issue between you and the server.\n\
    \nThe way to make a command run even after you log out or close the session to\
    \ a server is to use the `nohup` command.\n\nUse `nohup <command>` to let the\
    \ process continue working even after you log out.\n\n# xargs\n\nThe xargs command\
    \ is used in a UNIX shell to convert input from standard input into arguments\
    \ to a command.\n\nIn other words, through the use of xargs the output of a command\
    \ is used as the input of another command.\n\nHere's the syntax you will use:\n\
    \n```\ncommand1 | xargs command2\n```\n\nWe use a pipe (|) to pass the output\
    \ to `xargs`. That will take care of running the command2 command, using the output\
    \ of command1 as its argument(s).\n\nLet's do a simple example. You want to remove\
    \ some specific files from a directory. Those files are listed inside a text file.\n\
    \nWe have 3 files: file1, file2, file3.\n\nIn todelete.txt we have a list of files\
