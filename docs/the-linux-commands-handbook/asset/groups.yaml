    # find


    Whenever you feel lost in the filesystem, call the `find` command to know where
    you are:


    ```bash

    find .

    ```


    It will list all files and folders in the current directory. You can search for
    files by name:


    ```bash

    find . -name "filename*"

    ```


    You can also search by type, `f` for files or `d` for directories:


    ```bash

    find . -type f

    ```


    You can also search by size, using `-size`. For example, files larger than 100MB:


    ```bash

    find . -size +100M

    ```


    And search by modification time, using `-mtime`. For example, files modified in
    the last 7 days:


    ```bash

    find . -mtime -7

    ```


    The `find` command is incredibly powerful and can be used for many complex tasks.
    For example, you can find all files with a certain extension and delete them:


    ```bash

    find . -name "*.log" -delete

    ```


    # cp


    The `cp` command is used to copy files and directories. The syntax is:


    ```bash

    cp [options] <source> <destination>

    ```


    Example: copy a single file:


    ```bash

    cp file.txt file_copy.txt

    ```


    To copy a directory, you must use the `-r` option:


    ```bash

    cp -r folder/ folder2/

    ```


    You can also use the `-p` option to preserve file attributes like ownership and
    timestamps:


    ```bash

    cp -p file.txt file_copy.txt

    ```


    # rm


    The `rm` command is used to delete files and directories. The syntax is:


    ```bash

    rm [options] <file or directory>...

    ```


    Example: delete a single file:


    ```bash

    rm file.txt

    ```


    To delete a directory, you must use the `-r` option:


    ```bash

    rm -r folder/

    ```


    The `-f` option forces deletion without asking for confirmation:


    ```bash

    rm -f file.txt

    ```


    Warning: use `rm -rf` with extreme caution, as it will delete everything permanently.


    # mv


    The `mv` command is used to move or rename files and directories. The syntax is:


    ```bash

    mv [options] <source> <destination>

    ```


    Example: rename a file:


    ```bash

    mv old_name.txt new_name.txt

    ```


    Example: move a file to another directory:


    ```bash

    mv file.txt /path/to/destination/

    ```


    To move a directory, the syntax is the same:


    ```bash

    mv folder/ /path/to/destination/

    ```

