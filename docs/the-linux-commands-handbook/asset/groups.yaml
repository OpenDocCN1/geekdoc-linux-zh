    # uname


    Calling `uname` without any options will return the Operating System codename:


    ```

    flavio — fish /Users/flavio —fish —44x8

    → ~ uname

    Darwin

    → ~

    ```


    The `-m` option shows the hardware name ( `x86_64` in this example) and the `-p`
    option prints the processor architecture name ( `i386` in this example):


    ```

    flavio — fish /Users/flavio —fish —44x8

    → ~ uname -mp

    x86_64 i386

    → ~

    ```'
