    # chown


    Every file/directory in an Operating System like Linux or macOS (and every UNIX
    systems in general) has an **owner**.


    The owner of a file can do anything with it. It can decide the fate of that file.


    The owner (and the `root` user) can change the owner to another user, using the
    `chown` command:


    ```

    chown <owner> <file>

    ```


    Like this:


    ```

    chown flavio test.txt

    ```


    For example if you have a file that''s owned by `root` , you can''t write to it
    as another user:


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_60_0.png)


    You can use `chown` to transfer the ownership to you:'
  - '[PAGE 61]


    ```

    ```

    flavio --fish/Users/flavio --fish 65x7

    ~ sudo touch test.txt

    ~ echo test >> test.txt

    < fish: An error occurred while redirecting file ''test.txt''

    open: Permission denied

    ~ sudo chown flavio test.txt

    ~ echo test >> test.txt

    ~

    ```

    ```


    It''s rather common to have the need to change the ownership of a directory, and
    recursively all the files contained, plus all the subdirectories and the files
    contained in them, too.


    You can do so using the -R flag:


    ```

    chown -R <owner> <file>

    ```


    Files/directories don''t just have an owner, they also have a **group**. Through
    this command you can change that simultaneously while you change the owner:


    ```

    chown <owner>:<group> <file>

    ```


    Example:


    ```

    chown flavio:users test.txt

    ```


    You can also just change the group of a file using the `chgrp` command:


    ```

    chgrp <group> <filename>

    ```'
