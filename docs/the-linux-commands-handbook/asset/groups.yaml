    # which


    Suppose you have a command you can execute, because it''s in the shell path, but
    you want to know where it is located.


    You can do so using `which` . The command will return the path to the command
    specified:


    ```

    flavio — fish /Users/flavio — -fish — 40x6

    → which ls

    /bin/ls

    → which docker

    /usr/local/bin/docker

    → ~

    ```


    `which` will only work for executables stored on disk, not aliases or built-in
    shell functions.'
