    ```bash\nchown <owner> <file>\n```\n\n例如：\n\n```bash\nchown flavio test.txt\n\
    ```\n\n如果你有一个由 `root` 拥的文件，你无法作为另一个用户写入它。你可以使用 `chown` 将所有权转移给你。\n\n(注：原始文本中存在大量重复的错误片段，已按核心逻辑进行翻译)\n\
