- md: '

    ## THE LINUX


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_0_0.png)


    ## COMMANDS HANDBOOK


    Flavio Copes


    ## Table of Contents


    - Preface

    - Introduction to Linux and shells

    - man

    - ls

    - cd

    - pwd

    - mkdir

