    ```

    export PATH=$PATH:/new/path

    ```


    在创建新变量时使用 `export` 是很常见的，也用于创建 Bash 的 `.bash_profile` 或 `.bashrc` 文件，或在 Zsh 的
    `.zshrc` 中。


    移除变量，使用 `-n` 选项：


    ```

    export -n TEST

    ```


    不带任何选项调用 `export` 将列出所有导出的变量。


