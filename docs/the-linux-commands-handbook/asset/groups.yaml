    ```'
  - '[PAGE 110]


    # passwd


    Users in Linux have a password assigned. You can change the password using the
    `passwd` command.


    There are two situations here.


    The first is when you want to change your password. In this case you type:


    ```

    passwd

    ```


    and an interactive prompt will ask you for the old password, then it will ask
    you for the new one:


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_110_0.png)


    When you''re `root` (or have superuser privileges) you can set the username of
    which you want to change the password:


    ```

    passwd <username> <new password>

    ```


    In this case you don''t need to enter the old one.'
  - '[PAGE 111]


    # ping


    The `ping` command pings a specific network host, on the local network or on the
    Internet.


    You use it with the syntax `ping <host>` where `<host>` could be a domain name,
    or an IP address.


    Here''s an example pinging `google.com` :


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_111_0.png)


    The commands sends a request to the server, and the server returns a response.


    `ping` keep sending the request every second, by default, and will keep running
    until you stop it with `ctrl-C`, unless you pass the number of times you want
    to try with the `-c` option: `ping -c 2 google.com`.


    Once `ping` is stopped, it will print some statistics about the results: the percentage
    of packages lost, and statistics about the network performance.


    As you can see the screen prints the host IP address, and the time that it took
    to get the response back.


    Not all servers support pinging, in case the requests times out:'
  - '[PAGE 112]


    ```

    ping flavociopes.com

    PING flavociopes.com (167.99.137.12): 56 data bytes

    Request timeout for icmp_seq 0

    Request timeout for icmp_seq 1

    Request timeout for icmp_seq 2

    Request timeout for icmp_seq 3

    ^C

    --- flavociopes.com ping statistics ---

    5 packets transmitted, 0 packets received, 100.0% packet loss

    ```


    Sometimes this is done on purpose, to "hide" the server, or just to reduce the
    load. The ping packets can also be filtered by firewalls.


    ping works using the ICMP protocol (Internet Control Message Protocol), a network
    layer protocol just like TCP or UDP.


    The request sends a packet to the server with the ECHO_REQUEST message, and the
    server returns a ECHO_REPLY message. I won''t go into details, but this is the
    basic concept.


    Pinging a host is useful to know if the host is reachable (supposing it implements
    ping), and how distant it is in terms of how long it takes to get back to you.
    Usually the nearest server is geographically, the less time it will take to return
    back to you, for simple physical laws that cause a longer distance to introduce
    more delay in the cables.'
