    ```


    sort does not just works on files, as many UNIX commands it also works with pipes,
    so you can use on the output of another command, for example you can order the
    files returned by ls with:


    ```

    ls | sort

    ```


    sort is very powerful and has lots more options, which you can explore calling
    man sort.'
