    ## 前言\n\n《Linux 命令手册》遵循 80/20 法则：用 20% 的时间学习一个主题 80% 的内容。\n\n我发现这种方法可以提供一个全面的概述。\n\
    \n本书并没有试图涵盖所有与 Linux 及其命令相关的所有知识。它侧重于你在 80% 或 90% 的时间内会用到的少量核心命令，并尝试简化那些更复杂命令用法。\n\
    \n所有这些命令都可以在 Linux、macOS、WSL 以及任何你拥有 UNIX 环境的地方运行。\n\n我希望这本书的内容能帮助你实现目标：**熟练掌握\
    \ Linux。**\n\n本书由 Flavio 编写。我每天都会我的网站 flavocopes.com 上发布编程教程。\n\n你可以在 Twitter\
    \ 上通过 @flaviocopes 与我联系。\n\n祝阅读愉快！\n\n## Linux 和 Linux Shell 简介\n\nLinux 是一种操作系统，就像\
    \ macOS 或 Windows 一样。\n\n它也是最受欢迎的开源且免费（自由自由）的操作系统。\n\n它驱动着构成互联网的绝大多数服务器。它是构建一切的基础。但不仅如此，Android\
    \ 也是基于（Linux 的修改版本）的。\n\nLinux 的“核心”（称为内核）于 1991 年在芬兰诞生，从它微小的起点经历了非常长的道路。它后来成为了\
    \ GNU 操作系统的内核，创建了 GNU/Linux 这一组合。\n\n关于 Linux 有有一点是微软、苹果、Google 这样的公司永远无法提供的：对你的电脑做任何你想做事的自由。\n\
    \n它们实际上在向相反的方向努力，正在构建围墙花园，特别是在移动端。\n\nLinux 是终极的自由。\n\n它由志愿者开发，有些由依赖它的公司付费，有些是独立开发的，但没有哪家单一的商业公司可以决定\
    \ Linux 的内容或项目的优先级。\n\nLinux 也可以作为你的日常电脑使用。我使用 macOS 是因为我非常喜欢它的应用和设计，而且我曾是一名 iOS\
    \ 和 Mac 应用开发者，但在使用之前，我曾将 Linux 作为我的主操作系统。\n\n没有人可以规定你可以运行哪些程序，或者让那些追踪你、你的位置等信息的程序“返回总部”。\n\
    \nLinux 的特殊之处还在于不存在所谓的“一个 Linux”，就像在 Windows 或 macOS 上那样。相反，我们有不同的发行版。\n\n一个“发行版”（distro）由公司或组织制作，将\
    \ Linux 内核与额外的程序和工具打包在一起。\n\n例如，你有 Debian、Red Hat 和 Ubuntu，后者可能是最流行的。\n\n还有很多、非常多。你也可以创建自己的发行版。但你很可能会使用一个流行的、周围有大量用户和社区支持的版本，这样你就可以完成所需的工作，而不会浪费太多时间在重复造轮和寻找常见问题的答案上。\n\
    \n有一些预装了 Linux 的桌面电脑和笔记本电脑。或者你也可以在你的基于 Windows 的电脑或 Mac 上安装它。\n\n但你不需要为了了解 Linux\
    \ 是如何工作的就扰乱你现有的电脑。\n\n我没有 Linux 电脑。\n\n如果你使用 Mac，你需要知道在底层macOS 是一个 UNIX 操作系统，它共享了许多与\
    \ GNU/Linux 系统使用的相同理念和软件，因为 GNU/Linux 是 UNIX 的免费替代方案。\n\n> UNIX 是一个统术语，归类了从 70\
    \ 年代开始在大型公司和机构使用的许多操作系统。\n\nmacOS 终端让你访问我在本手册其余部分将描述的完全相同的命令。\n\n微软有一个官方的 Windows\
    \ Linux 子系统（WSL），你可以在 Windows 上安装（并且应该！）它。这将使你能够以非常简单的方式在 PC 上运行 Linux。\n\n但大多数时候，你会通过\
    \ VPS（虚拟专用服务器）如 DigitalOcean 在云端运行 Linux 。\n\nShell 是一个命令解释器，向用户提供一个与底层操作系统交互的界面。\n\
    \n它允许你使用文本和命令执行操作，并为用户提供高级功能，如创建脚本。\n\n这很重要：Shell 让你以比 GUI（图形用户界面）可能实现的更优化的方式执行任务。命令行工具可以提供许多不同的配置选项，而使用起来并不会复杂。\n\
    \n有许多不同类型的 Shell。本文关注 Unix Shell，即你在 Linux 和 macOS 电脑上常见的那些。\n\n随着时间的推移，这些系统创建了许多不同种的\
    \ Shell，其中几个占据了主导地位：Bash、Csh、Zsh、Fish 等更多！\n\n所有 Shell 都源于 Bourne Shell，称为 `sh`。之所以称为“Bourne”，是因为它的创建者是\
    \ Steve Bourne。\n\nBash 的意思是 `Bourne-again shell`（再次出生的 Bourne Shell）。`sh` 曾是专有的且不是开源的，而\
    \ Bash 创建于 1989 年，旨在为 GNU 项目和自由软件基金会创建一个免费的替代方案。由于项目必须付费才能使用 Bourne shell，Bash\
    \ 变得非常流行。\n\n如果你使用 Mac，尝试打开你的 Mac 终端。默认运行的是 ZSH。（或者，在 Catalina 之前是 Bash）\n\n你可以设置你的系统运行任何种的\
    \ Shell，例如我使用 Fish shell。\n\n每个单独的 Shell 都有自己独特的特性和高级用法，但它们都共享一个共同的功能：它们可以让你执行程序，并且它们是可以编程的。\n\
    \n在手册的其余部分，我们将详细介绍你将用到的最常用命令。\n\n## man\n\n我想介绍的第一个命令是一个可以帮助你理解所有其他命令的命令。\n\n\
    每当我不知道如何使用某个命令时，我都会输入 `man <command>` 来获取手册：\n\n![](img/0c7b9b0aff6a10fb1e91386acabb3c33_8_0.png)\n\
    \n这是一个 man（手册）页面。手册对于开发者来说是必不可少的工具。它们包含的信息非常多，以至于有时让人过载。\n\n上面的截图只是 ls 命令说明的 14\
    \ 个屏幕之一。\n\n大多数时候当我需要快速学习一个命令时，我会使用这个名为 tldr 的工具：https://tldr.sh/。这是一个你可以安装的命令，然后像这样运行：tldr\
    \ <command>，它会提供一个非常快速的概述，以及一些常用场景的方便示例：\n\n```tldr ls\nls\n列出目录内容。\n- 每行一个文件：ls\
    \ -1\n- 列出所有文件（包括隐藏文件）：ls -a\n- 所有文件的详细格式列表（权限、所有者、大小和修改日期）：ls -la\n 使用人类可读单位（KB,\
    \ MB, GB）显示大小的详细格式列表：ls -lh\n- 按大小（降序）排序的详细格式列表：ls -S\n- 按修改日期（最早在前）排序的所有文件详细格式列表：ls\
    \ -ltr\n```这不是 man 的替代品，而是防止在大量信息中迷失的方便工具。然后可以使用 man 页面来探索你可以使用的不同选项和参数。\n\n"
