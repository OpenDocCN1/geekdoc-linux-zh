  mdcn: "\n\n# tail\n\n在我看来，`tail` 的最佳用例是配合 `-f` 选项调用。它打开文件的末尾并监控文件变化。每当文件有新内容时，它就会打印到窗口中。这非常适合查看日志文件，例如：\n\
    \n```\ntail -f /var/log/system.log\n```\n\n按下 `ctrl-C` 退出。\n\n你可以打印文件中最后 10 行：\n\
    \n```\ntail -n 10 <filename>\n```\n\n你可以使用在行号前加 `+` 从特定行开始打印整个文件内容：\n\n```\ntail\
    \ -n +10 <filename>\n```\n\n`tail` 还能做很多事情，一如既往，我的建议是查看 `man tail`。\n\n# WC\n\n\
