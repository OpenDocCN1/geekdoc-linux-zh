    bar and `b` to navigate page by page. You can also jump to the end of the file
    pressing `G` and jump back to the start pressing `g`.


    You can search contents inside the file by pressing `/` and typing a word to search.
    This searches forward. You can search backwards using the `?` symbol and typing
    a word. You can open multiple files, and navigate through them using `:n` (to
    go to the next file) and `:p` (to go to the previous).

