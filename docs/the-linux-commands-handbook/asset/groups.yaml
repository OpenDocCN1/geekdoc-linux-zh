    \nsort -- sort merge keys (lines) of text and binary files\n\nSYNOPSIS\n\n```\n\
    sort [-BcfdhgMnsuwx] [-k field,field] [-s merge] [-d] [-c char] [-output]\n  \
    \     file...\n       --help\n       --version\n```\n\nDESCRIPTION\n\nThe sort\
    \ utility sorts text and binary files by lines. A line is separated from the sub-\n\
    sequent by a newline (default) or a NULL character (-z option). A line can contain\
    \ any\nprintable character and space, and input is processed lexicographically,\
    \ according to the current locale's\ncollating order. Each sort has various command-line\
    \ options that can tune the actual sorting behavior.\nIf input files are not sorted,\
    \ sort merges them for comparison.\n\nThe command line is as follows:\n\n+   -c,\
    \ --check-all\nCheck that the input file is sorted. If the file is not sorted,\
    \ sort produces an\ner message and exits with code 1, otherwise returns 0. If\
    \ --check-all is specified, sort produces no output. This is a \"silent\" version\
    \ of -c.\n\n+   -merge\nMerge only input files that are assumed to be pre-sorted.\
    \ If they are not sorted the output order is undefined.\n\n+   -output=file\n\
    Print the output to the output file instead of the standard output.\n\n+   -size,\
    \ --buffer-size\nUse for the maximum size of the memory buffer. Size modifiers\
    \ N,D,K,M,G,T,P,E,Z\nbe used. If a memory limit is not specified, sort takes up\
    \ to 100% of available memory. If the file size is too big to fit into the memory\
    \ buffer, temporary files are used to perform the sorting.\n\n+   -dir, --directory=dir\n\
    Store temporary files in the directory. The default path is the value of the environ-\n\
    variable TMPDIR or /tmp if TMPDIR is not defined.\n\n+   -u\nUnique. Suppress\
    \ all lines that have a key that is equal to an already processed\none. This similarly\
    \ to -s implies a stable sort. If used with -c, sort also checks there are no\
    \ lines with duplicate keys.\n\n+   -s\nStable sort. This option maintains the\
    \ original record order of records that have an\nequal key. This is a non-standard\
    \ feature, but it is widely accepted and used.\n\n+   --version\nPrint the version\
