    You create soft links using the `-s` option of `ln`:


    ```

    ln -s <original> <link>

    ```


    For example, say you have a file called recipes.txt. You can create a soft link
    to it using:


    ```

    ln -s recipes.txt newrecipes.txt

    ```


    In this case you can see there''s a special `-l` flag when you list the file using
    `ls -al`, and the file name has a `@` at the end, and it''s colored differently
    if you have colors enabled:


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_24_0.png)


    If you delete the original file, the links will be broken, and the shell will
    tell you "No such file or directory" if you try to access it:


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_24_1.png)


    # gzip


    You can compress a file using the gzip compression protocol named LZ77 using the
    `gzip` command.


    Here''s the simplest usage:


    ```

    gzip filename

    ```


    This will compress the file, and append a `.gz` extension to it. The original
    file is deleted. To prevent this, you can use the `-c` option and use output redirection
    to write the output to the filename.gz file:


    ```

    gzip -c filename > filename.gz

    ```


    > -c option specifies that output will go to the standard stream, leaving the
    original file intact.


    Or you can use the `-k` option:


    ```

    gzip -k filename

    ```


    There are various levels of compression. The more the compression, the longer
    it will take to compress (and decompress). Levels range from 1 (fastest, worst
    compression) to 9 (slowest, better compression), and the default is 6.


    You can choose a specific level with the `-<NUMBER>` option:


    ```

    gzip -1 filename

    ```


    You can compress multiple files by listing them:


    ```

    gzip filename1 filename2

    ```


    You can compress all the files in a directory, recursively, using the `-r` option:


    ```

    gzip -r a_folder

    ```


    The `-v` option prints the compression percentage information. Here''s an example
    of it being used along with the `-k` (keep) option:


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_26_0.png)


    gzip can also be used to decompress a file, using the `-d` option:


    ```

    gzip -d filename.gz

    ```


    # gunzip


    The `gunzip` command is basically equivalent to the `gzip` command, except the
    `-d` option is always enabled by default.


    The command can be invoked in this way:


    ```

    gunzip filename.gz

    ```


    This will gunzip and will remove the `.gz` extension, putting the result in the
    `filename` file. If that file exists, it will overwrite that.


    You can extract to a different filename using output redirection using the `-c`
    option:


    ```

    gunzip -c filename.gz > anotherfilename

    ```


    # tar


    The `tar` command is used to create an archive, grouping multiple files in a single
    file.


    Its name comes from the past and means `tape archive`. Back when archives were
    stored on tapes.


    This command creates an archive named `archive.tar` with the content of `file1`
    and `file2`:


    ```

    tar -cf archive.tar file1 file2

    ```


    The `c` option stands for `create`. The `f` option is used to write to file archive.


    To extract files from an archive in the current folder, use:


    ```

    tar -xf archive.tar

    ```


    the `x` option stands for `extract` and to extract them to a specific directory,
    use:


    ```

    tar -xf archive.tar -C directory

    ```


    You can also just list the files contained in an archive:


    ```

    tar -tf archive.tar

    file1

    file2

    ```


    tar is often used to create a compressed archive, gzipping the archive.


    This is done using the `z` option:


    ```

    tar -czf archive.tar.gz file1 file2

    ```


    This is just like creating a tar archive, and then running gzip on it.


    To unarchive a gzipped archive, you can use gunzip, or `gzip -d`, and then unarchive
    it, but `tar -xf` will recognize it''s a gzipped archive, and do it for you:


    ```

    tar -xf archive.tar.gz

    ```


    # alias


    It''s common to always run a program with a set of options you like using.


    For example, take the `ls` command. By default it prints very little information:


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_30_0.png)


    while using the `-al` option it will print something more useful, including the
    file modification date, the size, the owner, and the permissions, also listing
    hidden files (files starting with a .):


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_30_1.png)


    You can create a new command, for example I like to call it `ll`, that is an alias
    to `ls -al`.


    You do it in this way:


    ```

    alias ll=''ls -al''

    ```


    ```

    flavio — bash/Users/flavio — bash — 61×

    bash-3.2$ alias ll=''ls -al''

    bash-3.2$ ll

    bash-3.2$ total 0

    drwxr-xr-x 3 flavio staff 96 Sep 3 15:20 .

    drwxr-xr-x+ 55 flavio staff 1760 Sep 3 15:20 ..

    -rw-r-- 1 flavio staff 0 Sep 3 15:20 words.txt

    bash-3.2$ $

    ```


    Now calling aliases without any option will list the bash defined:


    ```

    flavio — bash/Users/flavio — bash — 61×

    bash-3.2$ alias

    alias ll=''ls -al''

    bash-3.2$ $

    ```


    The alias will work until the terminal session is closed.


    To make it permanent, you need to add it to the shell configuration, which could
    be `~/.bashrc` or `~/.profile` or `~/.bash_profile` if you use the Bash shell,
    depending on the use case.


    Be careful with quotes if you have variables in the command: using double quotes
    the variable is resolved at definition time, using single quotes it''s resolved
    at invocation time. Those 2 are different:


    ```

    alias lsthis=''ls $PWD''

    alias lcurrent=''ls $PWD''

    ```


    $PWD$ refers to the current folder shell is into. If you now navigate to a new
    folder, `lcurrent` lists the files in the new folder, `lsthis` still lists the
    files in the folder you were when you defined the aliases.


    # cat


    Similar to tail in some way, we have `cat`. Except cat can also add content to
    a file, and this makes it super powerful.


    In its simplest usage, cat prints a file''s content to the standard output:


    ```

    cat file

    ```


    You can print the content of multiple files:


    ```

    cat file1 file2

    ```


    and using the output redirection operator `>` you can concatenate the content
    of multiple files into a new file:


    ```

    cat file1 file2 > newfile

    ```


    Using `>>` you can append content to a file:


    ```

    cat file1 >> file2

    ```


    cat is often used in combination with the pipe `|` to feed file content to another
    command:


    ```

    cat file | grep pattern

    ```


