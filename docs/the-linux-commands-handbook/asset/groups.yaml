    \ option maintains the original order of records that have\nequal key. This is\
    \ a non-standard feature, but it is widely accepted and used.\n\n+   --version\n\
    Print the version and silently exits.\n\n# uniq\n\n`uniq` is a command useful\
    \ to sort lines of text.\n\nYou can get those lines from a file, or using pipes\
