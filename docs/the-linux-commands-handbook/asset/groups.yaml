    This command just visualizes the file''s content. You can directly open an editor
    by pressing `v`. It will use the system editor, which in most cases `vim`.


    Pressing the `F` key enters follow mode, or watch mode. When the file is changed
    by someone else, like from another program, you get to see the changes live. By
    default this is not happening, and you only see the file version at the time you
    opened it. You need to press `Ctrl+C` to quit this mode. In this case the behavior
