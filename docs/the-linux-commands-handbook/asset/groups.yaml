    # uniq


    `uniq` is a command useful to sort lines of text.


    You can get those lines from a file, or using pipes from the output of another
    command:


    ```

    uniq dogs.txt


    ls | uniq

    ```


    You need to consider this thing: `uniq` will only detect adjacent duplicate lines.


    This implies that you will most likely use it along with `sort` :


    ```

    sort dogs.txt | uniq

    ```


    The `sort` command has its own way to remove duplicates with the `-u` (`unique`)
    option. But `uniq` has more power.


    By default it removes duplicate lines:'
  - '[PAGE 47]


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_47_0.png)


    You can tell it to only display duplicate lines, for example, with the `-d` option:


    ```

    sort dogs.txt | uniq -d

    ```'
