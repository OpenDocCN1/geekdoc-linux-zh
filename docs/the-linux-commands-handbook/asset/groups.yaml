    Ivica\n```\n\n默认排序区分大小写并按字母顺序排序。使用 `--ignore-case` 选项不区分大小写，使用 `-n` 选项按数字顺序排序。\n\
    \n如果文件包含重复行：\n\n```\ncat dogs.txt\nRoger\nSyd\nVanille\nLuna\nIvica\nTina\n```\n\
    \n你可以使用 `-u` 选项移除它们：\n\n```\nsort -u dogs.txt\nIvica\nLuna\nRoger\nSyd\nTina\n\
    Vanille\n```\n\n`sort` 不仅作用于文件，像许多 UNIX 命令一样也适用于管道，所以你可以将其用于另一个命令的输出，例如对 `ls`\
    \ 返回的结果排序：\n\n```\nls | sort\n```\n\n`sort` 非常强大并有很多更多选项，你可以通过 `man sort` 进行探索。\n\
    \n# SORT(1)\n\n# BSD General Commands Manual\n\n# SORT(1)\n\nNAME\n\nsort -- 文本和二进制文件的行排序\n\
    \nSYNOPSIS\n\n```\nsort [-BcfdhMnsuwx] [-k field,field] [-s] [-d] [-c] [-output]\n\
    \       file...\n       --help\n       --version\n```\n\nDESCRIPTION\n\nsort 工具按行对文本和二进制文件进行排序。行由换行符（默认）或\
    \ NULL 字符（-z）分隔。行可以包含任何打印字符和空格，并根据当前 locale 的排序顺序进行处理。每个 sort 命令都有各种命令行选项可以调整实际排序行为。如果输入文件未排序，sort\
    \ 将它们合并以进行比较。\n\n命令行如下：\n\n- -c, --check-all：检查输入文件是否排序。如果文件未排序，sort 会产生错误并以代码\
    \ 1退出，否则返回 0。如果指定了 --check-all，sort 不产生输出。这是 -c 的“静默”版本。\n- -merge：合并假设已排序的输入文件。如果它们未排序，输出顺序未定义。\n\
    - -output=file：将输出到输出文件而不是标准输出。\n- -size, --buffer-size：用于内存缓冲区的大小。修饰符 N,D,K,M\n\
    - -dir, --directory=dir：将临时文件存储在目录中。如果没有定义 TMPDIR，默认路径为 /tmp。\n- -u：唯一。抑制所有具有相同键的行，类似于\
    \ -c。\n- -s：稳定排序。此选项保持具有相等键记录的原始顺序。这是一个非标准功能，但被广泛接受和使用。\n- --version：打印版本并静默退出。\n\
    \n# uniq\n\n`uniq` 是一个用于对文本行排序的命令。\n\n你可以从文件中获取这些行，或通过管道从另一个命令的输出获取：\n\n```\n\
    uniq dogs.txt\n\nls | uniq\n```\n\n你需要考虑这一点：`uniq` 只检测相邻的重复行。\n\n这意味着你可能会与 `sort`\
    \ 一起使用它：\n\n```\nsort dogs.txt | uniq\n```\n\n`sort` 命令有自己的方法通过 `-u` 选项移除重复。但\
    \ `uniq` 更强大。\n\n默认情况下它移除重复行：\n\n![](img/0c7b9b0aff6a10fb1e91386acabb3c33_47_0.png)\n\
    \n你可以告诉它只显示重复行，例如使用 `-d` 选项：\n\n```\nsort dogs.txt | uniq -d\n```\n\n你可以使用 `-u`\
    \ 选项只显示非重复行：\n\n```\nsort.txt | uniq -u\nIvica\nLuna\nTina\nVanille\n```\n\n你可以使用\
    \ `-c` 选项统计每行的出现次数：\n\n```\ncat dogs.txt\nRoger\nSyd\nVanille\nLuna\nIvica\nTina\n\
    sort dogs.txt | uniq -c\n  1 Ivica\n  1 Luna\n  2 Roger\n  2 Syd\n  1 Tina\n \
    \ 1 Vanille\n```\n\n使用特殊组合：\n\n```\nsort dogs.txt | uniq -c | sort -nr\n```\n\n\
    然后按频率从高到低排序这些行：\n50\n\n"
