    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_92_0.png)


    The way it works is that xargs will run rm 2 times, one for each line returned
    by cat.


    This is the simplest usage of xargs . There are several options we can use.


    One of the most useful in my opinion, especially when starting to learn xargs
    , is -p . Using this option will make xargs print a confirmation prompt with the
    action it''s going to take:


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_92_1.png)'
