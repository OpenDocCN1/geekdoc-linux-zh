    # type


    A command can be one of those 4 types:


    - an executable

    - a shell built-in program

    - a shell function

    - an alias


    The type command can help figure this out, in case we want to know or we''re just
    curious. It will tell you how the command will be interpreted.


    The output will depend on the shell used. This is Bash:


    ```

    flavio@bash /Users/flavio-bash ~

    bash-3.2$ type ls

    ls is hashed (/bin/ls)

    bash-3.2$ type cat

    cat is /bin/cat

    bash-3.2$ type pwd

    pwd is a shell builtin

    bash-3.2$ type ll

