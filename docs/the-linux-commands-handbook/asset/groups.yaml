    # chmod


    Every file in the Linux / macOS Operating Systems (and UNIX systems in

    general) has 3 permissions: Read, write, execute.


    Go into a folder, and run the `ls -al` command.


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_62_0.png)


    The weird strings you use on each file line, like `drwxr-xr-x` , define the

    permissions of the file or folder.


    Let''s dissect it.


    The first letter indicates the type of file:


    +   - means it''s a normal file

    - d means it''s a directory

    - l means it''s a link


    Then you have 3 sets of values:


    +   - The first set represents the permissions of the owner of the file

    - The second set represents the permissions of the members of the

    group the file is associated to


    62'
  - '[PAGE 63]


    • The third set represents the permissions of the everyone else


    Those sets are composed by 3 values. rwx means specific persona has read, write
    and execution access. Anything that is removed is swapped with a - , lets you
    form various combinations of values and relative permissions: rw-, r-, r-x, and
    so on.


    You can change the permissions given to a file using the chmod command.


    chmod can be used in 2 ways. The first is using symbolic arguments, the second
    is using numeric arguments. Let''s start with symbols first, which is for more
    intuitive.


    You type chmod followed by a space, and a letter:


    +   - a stands for all

    - u stands for user

    - g stands for group

    - o stands for others


    Then you type + or - to add a permission, or to remove it. Then you enter one
    or more permissions symbols ( r, w, x ).


    All followed by the file or folder name.


    Here are some examples:


    ```

    chmod a+r filename #everyone can now read

    chmod a+rw filename #everyone can now read and write

    chmod o-rwx filename #others (not the owner, not in the same group of the

    ```


    You can apply the same permissions to multiple personas by adding multiple letters
    before the + / - :


    ```

    chmod og-r filename #other and group can''t read any more

    ```


    In case you are editing a folder, you can apply the permissions to every file
    contained in that folder using the -r (recursive) flag.'
  - '[PAGE 64]


    Numeric arguments are faster but I find them hard to remember when you are not
    using them day to day. You use a digit that represents the permissions of the
    persona. This number value can be a maximum of 7, and it''s calculated in this
    way:


    +   * 1 if has execution permission

    * 2 if has write permission

    * 4 if has read permission


    This gives us 4 combinations:


    +   * 0 no permissions

    * 1 can execute

    * 2 can write

    * 3 can write, execute

    * 4 can read

    * 5 can read, execute

    * 6 can read, write

    * 7 can read, write and execute


    We use them in pairs of 3, to set the permissions of all the 3 groups altogather:


    ```

    chmod 777 filename

    chmod 755 filename

    chmod 644 filename

    ```'
- md: "\n## umask\n\nWhen you create a file, you don't have to decide permissions\
    \ up front.\nPermissions have defaults.\n\nThose defaults can be controlled and\
    \ modified using the `umask` command.\nTyping `umask` with no arguments will show\
    \ you the current umask, in this case `0022`:\n\n![](img/0c7b9b0aff6a10fb1e91386acabb3c33_65_0.png)\n\
    \nWhat does `0022` mean? That's an octal value that represents the permissions.\n\
    \nAnother common value is `0002`.\n\nUse `umask -S` to see a human-readable notation:\n\
    \n![](img/0c7b9b0aff6a10fb1e91386acabb3c33_65_1.png)\n\nIn this case, the user\
    \ ( u ), owner of the file, has read, write and execution permissions on files.\n\
    \nOther users belonging to the same group ( g ) have read and execution permission,\
    \ same as all the other users ( o ).\n\nIn the numeric notation, we typically\
    \ change the last 3 digits.\n\nHere's a list that gives a meaning to the number:\n\
    \n- 0 read, write, execute\n- 1 read and write\n- 2 read and execute\n- 3 read\
    \ only\n- 4 write and execute\n- 5 write only\n- 6 execute only\n- 7 no permissions\n\
    \nNote that this numeric notation differs from the one we use in `chmod`.\n\n\
    We can set a new value for the mask setting the value in numeric format:\n\n```\n\
    umask 002\n```\n\nor you can change a specific role's permission:\n\n```\numask\
    \ g+r\n```\n\n## du\n\nThe du command will calculate the size of a directory as\
    \ a whole:\n\n```\nflavio — bash /Users/flavio — bash — 38×5\nbash-3.2$ du\n32\n\
    bash-3.2$ \n```\n\nThe 32 number here is a value expressed in bytes.\n\nRunning\
    \ `du *` will calculate the size of each file individually.\n\n```\nflavio — bash\
    \ /Users/flavio — bash — 38×6\nbash-3.2$ du *\n8 Card.vue\n8 CardList.vue\n8 Form.vue\n\
    8 HelloWorld.vue\nbash-3.2$ \n```\n\nYou can set du to display values in MegaBytes\
    \ using `du -m`, and GigaBytes using `du -g`.\n\nThe `-h` option will show a human-readable\
    \ notation for sizes, adapting to the size:\n\n![](img/0c7b9b0aff6a10fb1e91386acabb3c33_68_0.png)\n\
    \nAdding the `-a` option will print the size of each file in the directories,\
    \ to:\n\n![](img/0c7b9b0aff6a10fb1e91386acabb3c33_68_1.png)\n\nA handy thing is\
    \ to sort the directories by size:\n\n```\ndu -h <directory> | sort -nr\n```\n\
    \nand then piping to head to only get the first 10 results:\n\n```\nbash-3.2$\
    \ du -h vuehandbook | sort -nr | head\n932K vuehandbook/05-vue-code\n63K vuehandbook/.git/objects/75\n\
    54K vuehandbook/03-vue-cli\n536K vuehandbook/04-vue-devtools\n120K vuehandbook/02-vue-first-app\n\
    88K vuehandbook/.git/objects/pack\n88K vuehandbook/.git/objects/b0\n84K vuehandbook/20-vux\n\
    76K vuehandbook/.git/objects/6f\n64K vuehandbook/.git/objects/41\nbash-3.2$\n\
    ```\n\n## df\n\ndf command is used (` df -h` ) will show values in a human-readable\
    \ format.\n\nIts basic form will print information about the volumes mounted:\n\
    \n```\ndf /home/users/flavier/fish --width=108x\nFilesystem      Size Used Available\
    \ Use% Mounted on\n/dev/disk11     976490576 219746708 756743868 23% 48418 481964462\
    \ 0% /\ndevfs            375 0 375 0% 0 100% /dev\n/dev/disk12     976490576 454785076\
    \ 521705500 46% 428795 4878164985 0% /System/Volumes/Data\n/dev/disk5     976490576\
    \ 104854800 871638296 11% 582452875 0% /private/var/vm\nmap auto_home        \
    \                       0 0 100% 0 100% /System/Volumes/Data/home\n```\n\nUsing\
    \ the `-h` option will show these values in a human-readable format:\n\n```\n\
    df /home/users/flavier/fish --width=108x\nFilesystem      Size Used Available\
    \ Use% Mounted on\n/dev/disk1s     466G 101G 236G 22% 48418 481964462 0% /\ndevfs\
    \            188K 188K 0i 0% 0 100% /dev\n/dev/disk2s     466G 217G 236G 46% 428795\
    \ 4878164896 0% /System/Volumes/Data\n/dev/disk5s     466G 5.0G 236G 1% 582452875\
    \ 0% /private/var/vm\nmap auto_home     80i 80i 100i 0% 0 100% /System/Volumes/Data/home\n\
    ```\n\nYou can also specify a file or directory name to get information about\
    \ the specific volume it lives on:\n\n```\ndf /dev /home/users/flavier/fish --width=108x\n\
    Filesystem      Size Used Available Use% Mounted on\n/dev/disk1s2     976490576\
    \ 454788176 487732640 49% 4287987 487164893 0% /System/Volumes/Data\n```\n\n##\
    \ basename\n\nSuppose you have a path to a file, for example `/Users/flavio/test.txt`.\n\
    \nRunning:\n\n```\nbasename /Users/flavio/test.txt\n```\n\nwill return the test.txt\
    \ string:\n\n![](img/0c7b9b0aff6a10fb1e91386acabb3c33_71_0.png)\n\nIf you run\
