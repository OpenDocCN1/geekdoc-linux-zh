  pgno: 94
- img_proc: true
  md: 'You have to know that Vim has 2 main modes:


    +   - command (or normal) mode

    - insert mode


    When you start the editor, you are in command mode. You can''t enter text like
    you expect from a GUI-based editor. You have to enter **insert mode**. You can
    do this by pressing the i key. Once you do so, the INSERT -- word appear at the
    bottom of the editor:'
  merge: -1
