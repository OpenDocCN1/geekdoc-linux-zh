- img_proc: true
  md: '# kill


    Linux processes can receive **signals** and react to them.


    That''s one way we can interact with running programs.


    The `kill` program can send a variety of signals to a program.


    It''s not just used to terminate a program, like the name would suggest, but that''s
    its main job.


    We use it in this way:


    ```

    kill <PID>

    ```


    By default, this sends the TERM signal to the process id specified.


    We can send other signals, including:


    ```

    kill -HUP <PID>

    kill -INT <PID>

    kill -KILL <PID>

    kill -TERM <PID>

    kill -CONT <PID>

    kill -STOP <PID>

    ```


    HUP means **hang up**. It''s sent automatically when a terminal window that started
    a process is closed before terminating the process.


    INT means **interrupt**, and it sends the same signal used when we press ctrl-C
    in the terminal, which terminates the process.


    KILL is not sent to the process, but to the operating system kernel, which immediately
    stops and terminates the process.


    TERM means **terminate**. The process will receive it and terminate itself. It''s
    the default signal sent by `kill`.'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'CONT means **continue**. It can be used to resume a stopped process.


    STOP is not sent to the process, but to the operating system kernel, which immediately
    stops (but does not terminate) the process.


    +   - 1 corresponds to HUP . 2 corresponds to INT . 9 corresponds to KILL . 15
    corresponds to TERM . 18 corresponds to CONT . 15 corresponds to STOP .'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# killall


    Similar to the `kill` command, `killall` instead of sending a signal to a specific
    process id will send the signal to multiple processes at once.


    This is the syntax:


    ```

    killall <name>

    ```


    where `name` is the name of a program. For example you can have multiple instances
    of the `top` program running, and `killall top` will terminate them all.


    You can specify the signal, like with `kill` (and check the `kill` tutorial to
    read more about the specific kinds of signals we can send), for example:


    ```

    killall -HUP top

    ```'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# jobs


    When we run a command & Linux / macOS, we can set it to run in the background
    using the & symbol after the command. For example we can run `top` in the background:


    ```

    top &

    ```


    This is very handy for long-running programs.


    We can get back to that program using the `fg` command. This works fine if we
    just have one job in the background, otherwise we need to use the job number:
    `fg 1`, `fg 2` and so on. To get the job number, we use the `jobs` command.


    Say we run `top &` and then `top -o mem &`, so we have 2 top instances running.
    `jobs` will tell us this:


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_82_0.png)


    Now we can switch back to one of those using `fg <jobid>`. To stop the program
    again we can hit `cmd-Z`.


    Running `jobs -l` will also print the process id of each job.'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# bg


    When a command is running you can suspend it using ctrl-Z.


    The command will immediately stop, and you get back to the shell terminal.


    You can resume the execution of the command in the background, so it will keep
    running but it will not prevent you from doing other work in the terminal.


    In this example I have 2 commands stopped:


    ```

    flavio bash — /Users/flavio — bash — 61x5

    bash-3.2$ jobs top (wd: ~)

    [1]+ Stopped top -o mem (wd: ~)

    [2]- Stopped bash-3.2$

    ```


    I can run bg 1 to resume in the background execution of the job #1.


    I could have also said bg without any option, as the default is to pick the job
    #1 in the list.'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# fg


    When a command is running in the background, because you started it with & at
    the end (example: top & or because you put it in the background with the bg command,
    you can put it to the foreground using fg.


    Running


    ```

    fg

    ```


    will resume to the foreground the last job that was suspended.


    You can also specify which job you want to resume to the foreground passing the
    job number, which you can get using the jobs command.


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_84_0.png)


    Running fg 2 will resume job #2:'
