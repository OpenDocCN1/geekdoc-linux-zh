  md: '# export


    The export command is used to export variables to child processes.


    What does this mean?


    Suppose you have a variable TEST defined in this way:


    ```

    TEST="test"

    ```


    You can print its value using echo $TEST :


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_118_0.png)


    But if you try defining a Bash script in a file script.sh with the above command:


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_118_1.png)'
  merge: -1
  pgno: 118
- img_proc: true
  md: 'Then you set chmod u+ script.sh and execute this script with ./script.sh, the
    echo $TEST line will print nothing!


    This is because in Bash the TEST variable was defined local to the shell. When
    executing shell script or another command, a subshell is launched to execute it,
    which does not contain the current shell local variables.


    To make the variable there we need to define TEST not in this way:


    ```

    TEST="test"

    ```


    but in this way:


    ```

    export TEST="test"

    ```


    Try that, and running ./script.sh now should print "test":


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_119_0.png)


    Sometimes you need to append something to a variable. It''s often done with the
    PATH variable. You use this syntax:


    ```

    export PATH=$PATH:/new/path

    ```


    It''s common to use export when you create new variables in this way, also when
    you create variables in the .bash_profile or .bashrc configuration files with
    Bash, or in .zshenv with Zsh.


    To remove a variable, use the -n option:'
  merge: -1
  pgno: 119
- img_proc: true
  md: '```

    export -n TEST

    ```


    Calling `export` without any option will list all the exported variables.'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# crontab


    Cron jobs are jobs that are scheduled to run at specific intervals. You might
    have a command perform something every hour, or every day, or every 2 weeks. Or
    on weekends. They are very powerful, especially on servers to perform maintenance
    and automations.


    The `crontab` command is the entry point to work with cron jobs.


    The first thing you can do is to explore which cron jobs are defined by you:


    ```

    crontab -l

    ```


    You might have have none, like me:


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_121_0.png)


    Run


    ```

    crontab -e

    ```


    to edit the cron jobs, and add new ones.


    By default this opens with the default editor, which is usually `vim`. I like
    `nano` more, you can use this line to use a different editor:


    ```

    EDITOR=nano crontab -e

    ```'
  merge: -1
  pgno: 121
- img_proc: true
  md: 'Now you can add one line for each cron job.


    The syntax to define cron jobs is kind of scary. This is why I usually use a website
    to help me generate it without errors: https://crontab-generator.org/


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_122_0.png)


    You pick a time interval for the cron job, and you type the command to execute.


    I chose to run a script located in /Users/flavio/test.sh every 12 hours. This
    is the crontab line I need to run:'
  merge: -1
  pgno: 122
- img_proc: true
  md: '```

    * */12 * * /Users/flavio/test.sh >/dev/null 2>&1

    ```


    I run `crontab -e` :


    ```

    EDITOR=nano crontab -e

    ```


    and I add that line, then I press `ctrl-X` and press `y` to save.


    If all goes well, the cron job is set up:


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_123_0.png)


    Once this is done, you can see the list of active cron jobs by running:


    ```

    crontab -l

    ```


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_123_1.png)


    You can remove a cron job running `crontab -e` again, removing the line and exiting
    the editor:'
  merge: -1
