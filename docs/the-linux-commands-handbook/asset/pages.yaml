  md: '# vim


    vim is a very popular file editor, especially among programmers. It''s actively
    developed and frequently updated, and there''s a very big community around it.
    There''s even a Vim conference!


    vi in modern systems is just an alias to vim , which means vi m proved.


    You start it by running vi on the command line.


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_94_0.png)


    You can specify a filename at invocation time to edit that specific file:


    vi test.txt'
