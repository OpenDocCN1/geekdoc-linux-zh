  md: '# grep


    The grep command is a very useful tool, that when you master will you help you
    tremendously in your day to day.


    > If you''re wondering, grep stands for global regular expression print


    You can use grep to search in files, or combine it with pipes to filter the output
    of another command.


    For example here''s how we can find the occurences of the document.getElementById
    in the line index.md file:


    ```

    grep document.getElementById index.md

    ```


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_39_0.png)


    Using the -n option will show the line numbers:


    ```

    grep -n document.getElementById index.md

