- img_proc: true
  md: '![](img/0c7b9b0aff6a10fb1e91386acabb3c33_96_0.png)


    Now you can start typing and filling the screen with the file contents:


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_96_1.png)


    You can move around the file with the arrow keys, or using the h - j - k

    l keys, h-l for left-right, j-k for down-up.


    Once you are done editing you can press the esc key to exit insert mode,and go
    back to command mode.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '![](img/0c7b9b0aff6a10fb1e91386acabb3c33_97_0.png)


    At this point you can navigate the file, but you can''t add content to it (and
    be careful which keys you press as they might be commands).


    One thing you might want to do now is saving the file. You can do so by pressing
    `: (colon), then `w`.


    You can save and quit pressing `:` then `w` and `: q :wq`


    You can quit without saving, pressing `:` then `q` and `! :q!`


    You can undo and edit by going to command mode and pressing `u`. You can redo
    (cancel an undo) by pressing `ctrl-r`.


    Those are the basics of working with Vim. From here starts a rabbit hole you can''t
    go into this little introduction.


    I will only mention those commands that will get you started editing with Vim:


    +   - pressing the `x` key deletes the character currently highlighted

    - pressing `A` goes to the end of the currently selected line

    - pressing `0` to go to the start of the line

    - go to the first character of a word and `d` followed by `w` to delete that word.
    If you follow it with `e` instead of `w`, the white space before'
