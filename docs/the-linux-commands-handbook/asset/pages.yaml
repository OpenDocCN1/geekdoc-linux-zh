  md: '# who


    The `who` command displays the users logged in to the system.


    Unless you''re using a server multiple people have access to, chances you will
    be the only user logged in, multiple times:


    ```

    ```bash

    flavio - fish /Users/flavio -fish — 53×7

    → ~ who

