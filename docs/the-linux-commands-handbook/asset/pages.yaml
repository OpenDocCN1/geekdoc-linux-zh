  md: '# su


    While you''re logged in to the terminal shell with one user, you might have the
    need to switch to another user.


    For example you''re logged in as root to perform some maintenance, but then you
    want to switch to a user account.


    You can do so with the su command:


    ```

    su <username>

    ```


    For example: su flavio.


    If you''re logged in as a user, running su without anything else will prompt you
    to enter the root user password, as that''s the default behavior.


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_107_0.png)


    su will start a new shell as another user.


    When you''re done, typing exit in the shell will close that shell, and will return
    back to the current user''s shell.'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# sudo


    `sudo` is commonly used to run a command as root.


    You must be enabled to use `sudo`, and once you do, you can run commands as root
    by entering your user''s password (not the root user password).


    The permissions are highly configurable, which is great especially in a multi-user
    server environment, and some users can be granted access to running specific commands
    through `sudo`.


    For example you can edit a system configuration file:


    ```

    sudo nano /etc/hosts

    ```


    which would otherwise fail to save since you don''t have the permissions for it.


    You can run `sudo -i` to start a shell as root:


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_108_0.png)


    You can use `sudo` to run commands as any user. `root` is the default, but use
    the `-u` option to specify another user:'
  merge: -1
  pgno: 108
- img_proc: true
  md: '```

    sudo -u flavio ls /Users/flavio

    ```'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# passwd


    Users in Linux have a password assigned. You can change the password using the
    `passwd` command.


    There are two situations here.


    The first is when you want to change your password. In this case you type:


    ```

    passwd

    ```


    and an interactive prompt will ask you for the old password, then it will ask
    you for the new one:


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_110_0.png)


    When you''re `root` (or have superuser privileges) you can set the username of
    which you want to change the password:


    ```

    passwd <username> <new password>

    ```


    In this case you don''t need to enter the old one.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# ping


    The `ping` command pings a specific network host, on the local network or on the
    Internet.


    You use it with the syntax `ping <host>` where `<host>` could be a domain name,
    or an IP address.


    Here''s an example pinging `google.com` :


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_111_0.png)


    The commands sends a request to the server, and the server returns a response.


    `ping` keep sending the request every second, by default, and will keep running
    until you stop it with `ctrl-C`, unless you pass the number of times you want
    to try with the `-c` option: `ping -c 2 google.com`.


    Once `ping` is stopped, it will print some statistics about the results: the percentage
    of packages lost, and statistics about the network performance.


    As you can see the screen prints the host IP address, and the time that it took
    to get the response back.


    Not all servers support pinging, in case the requests times out:'
  merge: -1
  pgno: 111
- img_proc: true
  md: '```

    ping flavociopes.com

    PING flavociopes.com (167.99.137.12): 56 data bytes

    Request timeout for icmp_seq 0

    Request timeout for icmp_seq 1

    Request timeout for icmp_seq 2

    Request timeout for icmp_seq 3

    ^C

    --- flavociopes.com ping statistics ---

    5 packets transmitted, 0 packets received, 100.0% packet loss

    ```


    Sometimes this is done on purpose, to "hide" the server, or just to reduce the
    load. The ping packets can also be filtered by firewalls.


    ping works using the ICMP protocol (Internet Control Message Protocol), a network
    layer protocol just like TCP or UDP.


    The request sends a packet to the server with the ECHO_REQUEST message, and the
    server returns a ECHO_REPLY message. I won''t go into details, but this is the
    basic concept.


    Pinging a host is useful to know if the host is reachable (supposing it implements
    ping), and how distant it is in terms of how long it takes to get back to you.
    Usually the nearest server is geographically, the less time it will take to return
    back to you, for simple physical laws that cause a longer distance to introduce
    more delay in the cables.'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# traceroute


    When you try to reach a host on the Internet, you go through your home router,
    you reach your ISP network, which in turn goes through its own upstream network
    router, and so on, until you reach the host.


    Have you ever wanted to know what are the steps that your packets go through to
    that?


    The traceroute command is made for this.


    You invoke


    ```

    traceroute <host>

    ```


    and it will (slowly) gather all the information for my blog with the packet travels.


    In this example I tried reaching for my blog with traceroute flaviocopes :


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_113_0.png)


    Not every router travelled returns its information. In this case, traceroute prints
    ***. Otherwise, we can see the hostname, the IP address, and some performance
    indicator.'
  merge: -1
