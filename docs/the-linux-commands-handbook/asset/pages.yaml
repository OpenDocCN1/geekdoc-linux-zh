- img_proc: true
  md: '# mkdir


    You create folders using the `mkdir` command:


    ```

    mkdir fruits

    ```


    You can create multiple folders with one command:


    ```

    mkdir dogs cars

    ```


    You can also create multiple nested folders by adding the `-p` option:


    ```

    mkdir -p fruits/apples

    ```


    Options in UNIX commands commonly take this form. You add them right after the
    command name, and they change how the command behaves. You can often combine multiple
    options, too.


    You can find which options a command supports by typing `man <commandname>`. Try
    now with `man mkdir` for example (press the `q` key to esc the man page). Man
    pages are the amazing built-in help for UNIX.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# rmdir


    Just as you can create a folder using `mkdir`, you can delete a folder using `rmdir`:


    ```

    mkdir fruits

    rmdir fruits

    ```


    You can also delete multiple folders at once:


    ```

    mkdir fruits cars

    rmdir fruits cars

    ```


    The folder you delete must be empty.


    To delete folders with files in them, we''ll use the more generic `rm` command
    which deletes files and folders, using the `-rf` options:


    ```

    rm -rf fruits cars

    ```


    Be careful as this command does not ask for confirmation and it will immediately
    remove anything you ask it to remove.


    There is no `bin` when removing files from the command line, and recovering lost
    files can be hard.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# mv


    Once you have a file, you can move it around using the mv command. You specify
    the file current path, and its new path:


    ```

    touch pear

    mv pear new_pear

    ```


    The pear file is now moved to new_pear . This is how you rename files and folders.


    If the last parameter is a folder, the file located at the first parameter path
    is going to be moved into that folder. In this case, you can specify a list of
    files and they will all be moved in the folder path identified by the last parameter:


    ```

    touch pear

    touch apple

    mkdir fruits

    mv pear apple fruits #pear and apple moved to the fruits folder

    ```'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# cp


    You can copy a file using the `cp` command:


    ```

    touch test

    cp apple another_apple

    ```


    To copy folders you need to add the `-r` option to recursively copy the whole
    folder contents:


    ```

    mkdir fruits

    cp -r fruits cars

    ```'
  merge: -1
