- img_proc: true
  md: '# find


    The `find` command can be used to find files or folders matching a particular
    search pattern. It searches recursively.


    Let''s learn it by example.


    Find all files under the current tree that have the `.js` extension and print
    the relative path of each file matching:


    ```

    find -name ''*.js''

    ```


    It''s important to use quotes around special characters like `*` to avoid the
    shell interpreting them.


    Find directories under the current tree matching the name "src":


    ```

    find . -type d -name src

    ```


    Use `-type f` to search only files, or `-type l` to search symbolic links. `-name`
    is case sensitive, use `-iname` to perform a case-insensitive search.


    You can search under multiple root trees:


    ```

    find folder1 folder2 -name filename.txt

    ```


    Find directories under the current tree matching the name "node_modules" or "public":


    ```

    find . -type d -name node_modules -or -name public

    ```


    You can also exclude a path, using `-not -path` :


    ```

    find . -type d -name ''*.md'' -not -path ''node_modules/*''

    ```'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'You can search files that have more than 100 characters (bytes) in them:


    ```

    find -type f -size +100c

    ```


    Search files bigger than 100KB but smaller than 1MB:


    ```

    find -type f -size +100k -size -1M

    ```


    Search files edited more than 3 days ago


    ```

    find -type f -mtime +3

    ```


    Search files edited in the last 24 hours


    ```

    find -type f -mtime -1

    ```


    You can delete all the files matching a search by adding the -delete option. This
    deletes all the files edited in the last 24 hours:


    ```

    find -type f -mtime -1 -delete

    ```


    You can execute a command on each result of the search. In this example we run
    cat to print the file content:


    ```

    find -type f -exec cat {} \;

    ```


    notice the terminating \; . {} is filled with the file name at execution time.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# ln


    The ln command is part of the Linux file system commands.


    It''s used to create links. What is a link? It''s like a pointer to another file.
    A file that points to another file. You might be familiar with Windows shortcuts.
    They''re similar.


    We have 2 types of links: hard links and soft links.


    # Hard links


    Hard links are rarely used. They have a few limitations: you can''t link to directories,
    and you can''t link to external filesystems (disks).


    A hard link is created using


    ```

    ln <original> <link>

    ```


    For example, say you have a file called recipes.txt. You can create a hard link
    to it using:


    ```

    ln recipes.txt newrecipes.txt

    ```


    The new hard link you created is indistinguishable from a regular file:'
  merge: -1
  pgno: 22
- img_proc: true
  md: '```

    flavio — fish /Users/flavio —fish — 63x10

    ls -al newrecipes.txt

    -rw-r--r-- 1 flavio staff 8 Sep 2 11:25 newrecipes.txt

    ~

    ```


    Now any time you edit any of those files, the content will be updated for both.


    If you delete the original file, the link will still contain the original file
    content, as that''s not removed until there is one hard link pointing to it.


    ```

    flavio — fish /Users/flavio —fish — 49x9

    ln recipes.txt newrecipes.txt

    ~ cat newrecipes.txt

    recipes

    ~ rm recipes.txt

    ~ cat newrecipes.txt

    recipes

    ~

    ```


    # Soft links


    Soft links are different. They are more powerful as you can link to other filesystems
    and to directories, but when the original is removed, the link will be broken.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'You create soft links using the `-s` option of `ln` :


    ```

    ln -s <original> <link>

    ```


    For example, say you have a file called recipes.txt. You can create a soft link
    to it using:


    ```

    ln -s recipes.txt newrecipes.txt

    ```


    In this case you can see there''s a special -l flag when you list the file using
    `ls -al`, and the file name has a `@` at the end, and it''s colored differently
    if you have colors enabled:


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_24_0.png)


    If you delete the original file, the links will be broken, and the shell will
    tell you "No such file or directory" if you try to access it:


    ![](img/0c7b9b0aff6a10fb1e91386acabb3c33_24_1.png)'
  merge: -1
