  md: '# WC


    The wc command gives useful information about a file or input it receives pipes.


    ```

    echo test >> test.txt

    wc test.txt

    1 1 5 test.txt

    ```


    Example via pipes, we can count the output of running the ls -al command:


    ```

    ls -al | wc

    6 47 284

    ```


    The first column returned is the number of lines. The second is the number of
    words. The third is the number of bytes.


    We can tell it to just count the lines:


    ```

    wc -l test.txt

    ```


    or just the words:


    ```

    wc -w test.txt

    ```


    or just the bytes:


    ```

    wc -c test.txt

    ```


    Bytes in ASCII charsets equate to characters, but with non-ASCII characters, the
    number of characters might differ because some characters might take multiple
    bytes, for example this happens in Unicode.'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'In this case the `-m` flag will help getting the correct value:


    ```

    wc -m test.txt

    ```'
