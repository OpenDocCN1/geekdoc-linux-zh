  md: '# env


    The `env` command can be used to pass environment variables without setting them
    on the outer environment (the current shell).


    Suppose you want to run a Node.js app and set the `USER` variable to it.


    You can run


    ```

    env USER=flavio node app.js

    ```


    and the `USER` environment variable will be accessible from the Node.js app via
    the Node `process.env` interface.


    You can also run the command clearing all the environment variables already set,
    using the `-i` option:


    ```

    env -i node app.js

    ```


    In this case you will get an error saying `env: node: No such file or directory`
    because the `node` command is not reachable, as the `PATH` variable used by the
    shell is unset.


    So you need to pass the full path to the `node` program:


    ```

    env -i /usr/local/bin/node app.js

    ```


    Try with a simple `app.js` file with this content:


    ```

    console.log(process.env.NAME)

    console.log(process.env.PATH)

    ```


    You will see the output being'
