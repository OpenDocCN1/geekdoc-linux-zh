  md: '# less


    The less command is one I use a lot. It shows you the content stored inside a
    file, in a nice and interactive UI.


    Usage: less <filename>.


    ```

    bash-scripting -less /Users/flaviacomopes/www/flaviacomopes.com/content/post/cli/bash-scripting
    ---less index.md --72~-

    title: "Introduction to Bash Shell Scripting"

    date: 2019-01-15T07:00:02+00

    description: "A detailed overview to scripting the Bash Shell"

    tags: cli


    Shell scripting is a powerful way to automate tasks that you regularly execute
    on your computer.

    In this tutorial I give an extensive overview of shell scripting, and will be
    the base reference for in-depth and advanced tutorials on creating shell scripts.

    > Check out my [introduction to Bash](/bash/) post.

    Bash gives you a set of commands that put together can be used to create little
    programs, that by convention we call scripts.

    Note the difference. We don''t say Bash programming but Bash scripting, and we
    don''t call Bash scripts "Bash programs". This is because you can g

    ```


    Once you are inside a less session, you can quit by pressing q.


    You can navigate the file contents using the up and down keys, or using the space
    bar and b to navigate page by page. You can also jump to the end of the file pressing
    G and jump back to the start pressing g.


    You can search contents inside the file by pressing / and typing a word to search.
    This searches forward. You can search backwards using the ? symbol and typing
    a word.'
