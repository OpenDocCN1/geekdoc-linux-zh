- img_proc: true
  md: 'The columns returned by ps represent some key information.


    The first information is PID, the process ID. This is key when you want to reference
    this process in another command, for example to kill it.


    Then we have TT that tells us the terminal ID used.


    Then STAT tells us the state of the process:


    +   - I a process is idle (sleeping for longer than 20 seconds) R a runnable process
    S a process that is sleeping for less than 20 seconds T a stopped process U a
    process in uninterruptible wait Z a dead process (a zombie)


    If you have more than one letter, the second represents further information, which
    can be very technical.


    It''s common to have + which indicates the process is in the foreground its terminal.
    S means the process is a session leader.


    TIME tells us how long the process has been running.'
  merge: -1
  pgno: 76
