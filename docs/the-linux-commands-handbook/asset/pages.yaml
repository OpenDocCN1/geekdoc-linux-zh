  md: '# nohup


    Sometimes you have to run a long-lived process on a remote machine, and then you
    need to disconnect.


    Or you simply want to prevent the command to be halted if there''s any network
    issue between you and the server.


    The way to make a command run even after you log out or close the session to a
    server is to use the `nohup` command.


    Use `nohup <command>` to let the process continue working even after you log out.'
