  md: '# cd


    Once you have a folder, you can move into it using the cd command. cd means change
    directory. You invoke it specifying a folder to move into. You can specify a folder
    name, or an entire path.


    Example:


    ```

    mkdir fruits

    cd fruits

    ```


    Now you are in the fruits folder.


    You can use the .. special path to indicate the parent folder.


    ```

    cd .. #back to the home folder

    ```


    The # character indicates the start of the comment, which lasts for the entire
    line after it''s found.


    You can use it to form a path:


    ```

    mkdir fruits

    mkdir cars

    cd fruits

    cd ../cars

    ```


    There is another special path indicator which is ., and indicates the current
    folder.


    You can also use absolute paths, which start from the root folder / :


    ```

    cd /etc

    ```'
  merge: -1
  pgno: 12
- img_proc: true
  md: This command works on Linux, macOS, WSL, and anywhere you have a UNIX environment
