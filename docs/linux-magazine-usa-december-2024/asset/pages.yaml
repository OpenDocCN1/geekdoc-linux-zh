  md: '# Write Code with AI


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_20_0.png)


    **Figure 10:** Some tools, such as GitHub Copilot, not only offer IDE plugins
    but also support queries via a command-line tool.


    # Data Protection


    In order to generate high-quality source code for different languages, a wizard
    requires a large neural network and huge amounts of training data. The required
    computing power and financial resources are primarily the domain of large corporations
    such as Google, Amazon, and Microsoft, as well as players like OpenAI. Smaller
    providers of programming tools, such as the former pioneer Kite [14], are falling
    by the wayside or are increasingly forced to rely on preparatory services by the
    global players. Refraction from Portugal, for example, uses customized models
    from OpenAI.


    This reliance on background services leads to a data protection problem. In order
    to provide immediate suggestions, the AI monitors the developer’s work and sends
    some of the source code to the cloud for evaluation. If you let CodeConvert translate
    all of your source code, for example, this means you have sent the internals of
    your entire program to a company in India. In most cases, the providers also receive
    further information. GitHub Copilot collects various metrics such as the errors
    reported by the development environment and the features enabled in it.


    What happens to the data in the cloud is up to the provider. In particular, the
    source code and therefore important internal enterprise data could be incorporated
    into the AI as training material. As a result, the wizards would then offer up
    your company’s knowledge to other users. In the worst case, code fragments could
    even appear there. Manufacturers deal with this problem in different ways, and
    the pertinent details are often hidden in the small print. GitHub Copilot, for
    example, only guarantees for the business plan that the source code sent to the
    cloud will not be used as training data. GitHub also reserves the right to allow
    employees working on the Copilot project to view the requests. These include employees
    of Microsoft and OpenAI.


    Anyone considering running Tabnine themselves or using an open source AI such
    as Tabby for data protection reasons will inevitably face issues with this technology.
    Even if you no longer have to train these models yourself, running them still
    requires powerful hardware. Ideally, your system will include a powerful NVIDIA
    graphics card with plenty of memory that can be addressed via the CUDA interface.
    The FauxPilot quick-start guide cites this configuration as a mandatory requirement.


    # Conclusions


    Automatically generated tests and references to best practices – according to
    a survey of Go developers – is what many programmers want from an AI wizard [15].
    And, at least with most commercial services, these wishes are likely to come true.
    But no AI is currently able to implement complex code automatically. In practice,
    the wizards do their jobs primarily as enhanced auto-completers, documentation
    aids, and unit test generators. In these areas, the tools take tedious routine
    work off the developer’s plate, although you still need to double-check the results.


