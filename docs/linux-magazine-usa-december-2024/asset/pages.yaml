    \ improvements. Similarities between SimpleRemote and an older version of DiodasRAT\
    \ include the use of the same Zlib library (version 1.2.11) and some overlaps\
    \ in the code (Figure 1).\n\nThe developers of DiodasRAT re-hashed parts of the\
