- pgno: 64
  md: '![](img/d6d2a4cd4a2f445e8c9e8079857e2469_64_0.png)


    Figure 2: The Raspberry Pi Zero 2 W connected to a monitor, keyboard and mouse
    for development.


    I also bought two different cases to try. Some have more openings than others,
    and I wanted black to be low-key. Since this project only requires WiFi and no
    HAT or buttons, I preferred the case with fewer openings. You can attach a WiFi
    antenna, but in my testing it wasn’t necessary to cover the cabin. If you’re just
    starting with the Pi Zero, I would recommend buying a kit: Mine came with an HDMI
    adapter, a USB power cord with an on/off switch, and an SD card, among other handy
    things. The Zero has two USB ports: for power and, well, non-power users. I bought
    a USB hub so I could plug a keyboard and mouse into the non-power USB port. I
    already had a mouse, keyboard and HDMI monitor. With all this set up, I was able
    to use it like a regular, albeit slightly slow desktop computer (Figure 2). I
    read that the typical power consumption of a Raspberry Pi Zero 2 W is 350mA, making
    it one of the most energy-efficient options of Raspberry Pi models [1].


    For the software environment, NextPi [2] can turn your Pi into a Nextcloud appliance,
    but I wanted more control. Ultimately, I selected a regular Raspberry Pi OS install
    with ownCloud instead of Nextcloud (ownCloud, Nextcloud’s predecessor, is still
    in development). The official Raspberry Pi Imager [3] recommends the 32-bit OS
    for the Pi Zero W and the 64-bit version for the newer Pi Zero 2 W. You initially
    boot into the graphical environment. That’s cool, but I found that running apt
    update in a terminal window hung it. So I stayed in the graphical environment
    just long enough to enable SSH access and to tell it to boot in console mode.


    Since every project needs a snappy name, I decided to call this “lodge” – that’s
    what we call the cabin where it lives, and that’s what I’ve named the access point
    and some other resources that I have set up.


    # ownCloud Setup


    You can use the commands in Listing 1 to install and setup ownCloud like I did.
    Connect your Pi to the local network via an Ethernet cable and do not connect
    it to any WiFi network – you’ll need the WiFi to set up your own hotspot later.
    In the terminal, log in on the Raspberry Pi Zero via SSH and run sudo su to gain
    admin access for all the following commands.


    First, use systemctl to disable Bluetooth to save some power (line 1) – don’t
    uninstall it because that will stop WiFi. Next, remove some packages we aren’t
    going to use. I ran


    ```

    apt --installed list

    ```


    # Listing 1: ownCloud Setup


    ```

    ```bash

    01 systemctl --now disable bluetooth

    02 apt remove firefox chromium chromium-browser linux vic-* | pipewire pulseaudio-caps-*

    03 apt install apache2 mariadb-server

    04 systemctl restart mariadb

    05 apt remove php-*

    06 wget https://packages.sury.org/php/gpg.php.gpg -O /usr/share/keyrings/deb.sury.org-php.gpg

    07 echo "deb [signed-by=/usr/share/keyrings/deb.sury.org-php.gpg] https://packages.sury.org/php/
    $(lsb_release -sc) main" > /etc/apt/sources.list.d/php-sury.list

    08 apt update

    09 wget install php7.4 libapache2-mod-php7.4 php7.4 php7.4-cli php7.4-gd php7.4-mysql
    php7.4-xml php7.4-xml php7.4-xml2 php7.4-intl php7.4-ambering php7.4-common php7.4-readline

    10 ntermmod php7.4

    11 wget https://download.owncloud.com/server/stable/owncloud-complete-latest.zip

    12 unzip owncloud-complete-latest.zip

    13 mv owncloud /var/www/html/

    14 chmod -R www-data:www-data /var/www/html/owncloud/

    15 mysql -u root

    ```

    ```'
