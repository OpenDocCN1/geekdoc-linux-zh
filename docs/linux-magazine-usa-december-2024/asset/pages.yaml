  md: '# **IN-DEPTH**


    **Web Page Monitoring**


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_25_0.png)


    Do you want to be alerted when a product is back in stock on your favorite online
    store? Do you want to know when a website without an RSS feed gets an update?
    With changedetection.io, you can stay up-to-date on website changes. **By Koen
    Vanvloostem**


    If you want to stay updated on news from various websites, Really Simple Synchronization
    (RSS) [1] is a great solution. Many websites offer their news in an RSS feed,
    which is an XML file with a specific format. You can subscribe to these feeds
    and read the content in RSS feed readers, which can be graphical, command-line,
    or web-based clients.


    However, not all websites provide an RSS feed, and RSS usage seems to have diminished
    somewhat in recent years. Moreover, not all websites offer their content in the
    form of articles. Still, you may want to know about changes on these websites,
    such as the price of your favorite product on an online store or a new page in
    the table of contents of an online document. Are you then doomed to regularly
    visit all those websites you''re interested in?


    With changedetection.io [2], you can monitor arbitrary changes on web pages and
    be notified in various ways. At first glance, changedetection.io''s website (Figure
    1) seems to suggest it is a commercial service that requires a monthly subscription
    fee. However, changedetection.io is a completely open source project, with its
    source code [3] published


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_25_1.png)


    # **Figure 1: It takes some time to discover that changedetection.io is an open
    source project.**'
