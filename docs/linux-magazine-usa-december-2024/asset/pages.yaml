  md: '# Virtual flashcards with Anki

    Learn It!


    Flashcards are a fast and effective way to memorize pertinent facts for your next
    exam. Anki takes this time-honored trick in a direction you never could have imagined
    in the days of those classic 3x5 cards.


    **BY MARCO FIORETTI**


    Anki is a multiplatform, open source digital version of paper flashcards that
    “makes remembering things easy” [1] and “makes memory a choice” [2]. You can run
    Anki on Linux, macOS, and Windows systems, as well as on mobile devices [3].


    Flashcards are a quick and easy way to memorize facts for academic tests and other
    training scenarios. The two main reasons to try Anki are the sheer number of cards
    it can handle (more than 100,000, according to its developers), and how easy it
    is to embed all kinds of content in each card, from audio and video to scientific
    formulas and musical scores. Anki also has many add-ons and a web interface [4]
    that can be used to study your cards online or keep them synchronized across multiple
    devices. Personally, I also really like that Anki saves and exports data in well-supported
    formats that make it easy to automatically create or analyze as many flashcards
    as I want in many different ways.


    # Installation and Upgrades


    At the time of writing, there are two branches of Anki for Linux, one built with
    version 5 and one with version 6 of the same Qt graphic libraries that are the
    foundation of the KDE Desktop Environment. Both branches also depend on three
    external


    ```

    ```

    Listing 1: Anki Archive Contents

    #> cd anki-24.06.3-1-linux-gtk6

    #> anki-24.06.3-1-linux-gtk6 ls


    anki

    anki.l

    anki_desktop

    anki.png

    anki.xml

    anki.xpm

    install.sh

    README.md

    uninstall.sh

    ```

    ```


    libraries – called libxcb-xinerama0, libxcb-cursor0, and libnss3 – that you should
    be able to install from the standard repositories of most Linux distributions.


    Anki developers are not happy with the Anki packages available in the repositories
    of Linux distributions and consequently won’t support them. Instead they recommend
    users download the branch they prefer from the Anki website and install it manually.
    At the time of writing, the Qt6 branch is recommended for most users because,
    while it still doesn’t support all the add-ons available for Anki, it has better
    support for HiDPI displays and the Wayland graphic subsystem.


    After downloading the Anki archive in compressed .zst format, you must expand
    it with this command (adapting it to the actual version of Anki you chose):


    ```

    #> tar zxf anki-24.06.3-1-linux-qt6.tar.zst

    ```


    This will create a directory with the same name of the archive, containing the
    same or similar files shown in Listing 1.


    The first and biggest file is the actual Anki executable program, which is just
    over 100MB, and the second is the source code of its man page. The install.sh
    and uninstall.sh scripts are those you should run, with root privileges, to install
    or uninstall Anki for all the users of your system.


    By default, the first script will place all those files (including the uninstall.sh
    script) in /usr/local/share/anki, and then create a link to the Anki executable
    in /usr/local/bin. After that, the script will set up the Anki man page and all
    the Anki entries and icons in your system menus and desktop background.


    Alternatively, you may try Anki without installing anything, by just launching
    the executable file from the prompt, in the installation folder:


    ```

    #> ./anki

    ```'
