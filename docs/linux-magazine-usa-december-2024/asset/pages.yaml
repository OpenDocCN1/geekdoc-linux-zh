  md: '# ### RSS terminal reader

    CAST-text


    Platforms such as Facebook, Instagram, and Pinterest may have deprecated their
    RSS feeds in favor of ad-filled, short-form videos, but RSS isn''t dead. In fact,
    as a journalist I find these types of web feeds far superior when it comes to
    assimilating large amounts of news. Developer Edì Pignedri clearly feels the same
    way, having developed this handy utility.

    I had no joy with the instructions to download and run CAST-text via Go. However,
    precompiled binaries are available for a number of platforms including Linux.
    After extracting the archive and using chmod a+x to make the program executable,
    it can be run directly in the terminal. As an Englishman, I was delighted to see
    that CAST-text defaults to BBC News. However, you can change this to other RSS
    feeds using the -rss flag. For instance, I was able to access Linux Magazine''s
    feed running


    ```

    cast-text -rss https://www.linux-magazine.com/rss/feed/ini_full

    ```


    Once the news loads you can use the up and down arrow keys to switch between story
    titles on the left-hand pane. The story text itself is displayed on the right.
    You can use the right and left arrow keys to scroll up and down the titles. Scrolling
    via trackpad is also supported. Press Enter at any time to launch the corresponding
    news article in your default browser. Use q to exit the utility.


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_83_0.png)


    The project page lists ambitious plans for future development including importing
    non-RSS news feeds such as CNN. Still, this is another great example of a single
    program that does one thing very well, so there''s no particular need for this.
    My only complaint is that, despite trying to open the utility via the fish interactive
    shell, all the text remains stubbornly black and white.


    **Project Website**

    https://github.com/pignoni/cast-text


    # ### 3D-model viewer

    Exhibit


    I''ll never forget the first time I tried to contend with 3D models. I''d found
    a rendering of some classic walkie-talkies as used in the TV series *Stranger
    Things*. I duly sent the files to a company that specialized in 3D printing, only
    to find they couldn''t open them. It was only then I discovered the plethora of
    formats for 3D models, not to mention the various software and in-browser solutions
    for previewing them.

    Exhibit offers a lightweight solution to do this. It''s powered by the same library
    as the F3D viewer, so it supports diverse model formats including FBX, glTF, OBJ,
    PLY, STL, STEP, USD, and Alembic. Binaries are currently available from Flathub
    only, though the developer also lists instructions on the GitHub page on how to
    clone and compile from source.


    After installing the Flathpak via the terminal, I was gratified to see that Exhibit
    had a dedicated icon in Ubuntu''s Activities. This saves having to run via the
    command line as I had to do for the other Flaptaks I reviewed for the column this
    month. As a GNOME App, the user interface is well spaced and simple to navigate.
    On first launch, you can click Load to navigate to your chosen 3D model (in my
    case a rendering of the Scottish steam ship MV Spartan). Once the model loads,
    Exhibit defaults to the Render tab. From here you can toggle options such as rendering
    and anti-aliasing. You can also enable showing edges and/or spheres and then define
    their width. The Model tab allows you to fine-tune the material and color of the
    model. I had the most fun with the Scene tab, which lets you display the grid
    as well as choose from one of a number of image backgrounds. You can also customize
    a background color. Exhibit also supports exporting models in PNG format.


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_83_1.png)


    **Project Website**

    https://github.com/Nokse22/Exhibit'
