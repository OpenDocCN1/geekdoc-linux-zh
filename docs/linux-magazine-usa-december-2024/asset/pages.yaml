- pgno: 72
  md: '# MADDOG''S

    DOGHOUSE


    The stakeholder approach of open source broadens the pool of who can access, influence,
    and benefit from information technologies.


    BY JON “MADDOG” HALL


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_72_0.png)


    > Jon “maddog” Hall is an author, educator, computer scientist, and free software
    pioneer who has been a passionate advocate for Linux since 1994 when he first
    met Linus Torvalds and facilitated the port of Linux to a 64-bit system. He serves
    as president of Linux International®.


    # FOSS and economic models


    In 1999, I was honored to work with several groups of people who were interested
    in helping make GNU/Linux a commercial success. One group was the Linux Professional
    Institute (LPI, www.lpi.org), who decided to implement a nonprofit certification
    group headquartered in Canada.


    The people instigating LPI came from a wide variety of backgrounds, but had significant
    experience in free and open source software (FOSS) and various business backgrounds.
    Some were more oriented toward commercial companies, and some were more oriented
    toward community groups, but we all wanted the same thing: quality, respected,
    high-value certifications which offered a large number of options for learning
    the materials.


    One aspect of LPI stood out. Because LPI was not a share-holder-based organization,
    an organization where people profited from owning part of the organization, the
    founders cared more about how LPI helped the community than making them a profit.
    The founders were stakeholders, not shareholders. One of the other goals LPI had
    was to be a community-based organization where people who earned the certificates
    were also the people who helped decide the future of LPI, along with the people
    who hired those certificate holders, and the ones who trained them.


    If you study economics, you find there are many different economic and political
    models. Some of the most famous today are capitalism and socialism, with other
    offshoots of these (communism, democratic socialism, etc.). Many of these have
    been around a long time but were dominated by feudalism, serfdom, slavery, etc.,
    until more modern times forced those less-desirable models into regression. Some
    people argue that these older economic platforms still exist but are just hidden
    better.


    Capitalism started to emerge as a dominant force during the age of mechanization.
    It took money to buy the machinery to automate production, and people who had
    money could now invest to hire employees to run the machinery. To pay them back
    for their investment, the stock holders would look for dividends on their stock
    and see the value of the stock increase. However, the employees often did not
    benefit from the value of the company increasing nor have much input as to how
    the company was run.


    Information technology started much the same way. The first computers were physically
    large and expensive and logically small. They were designed and built by companies
    like IBM, DEC, Hewlett-Packard, and others. Some companies, like IBM, started
    long before computers as we think of them were developed, and IBM lent its wealth
    to going into the "computer field." Other companies may have famously started
    in garages but reached out to investors who turned money into ownership. If you
    wanted to program or start a company around system development, you either went
    to a university that had the hardware resources or you found investors to help
    you start the company.


    Today, however, the field has changed. Open hardware, free and open source software,
    open data, and social marketing have changed the need for vast amounts of capital
    needed to start a systems-solution business. People can develop great solutions
    on inexpensive computers or through resources "in the cloud:" No longer do people
    buy just a piece of hardware or a piece of software, but they purchase a total
    solution which can be assembled by a small group of people and solve the specific
    needs of a specific customer. The creators of the solution can put all of the
    profits into their own pocket instead of the pockets of investors. The creators
    of the solution, not some disjoined "stockholder" can determine the future of
    the organization.


    A concrete example of this has been the rise of the Odo ERP system. An open source
    solution, Odo runs on many different operating systems. While there is a corporate
    component of Odo, there is also a vibrant community edition that is installed
    on thousands of new installations every day. Odo has been favorably compared to
    other ERP systems sold by large commercial companies at much higher prices.


    There is nothing that stops an individual from assembling a series of off-the-shelf
    components and putting together a low-cost point-of-sale or ERP system for a local
    customer and selling it to a fraction of the cost of some other commercial systems
    or from tailoring the Odo system to exactly what their customer needs.


    Of course, these customers will pay for the skills of the local developers, and
    that is how the stakeholder system moves forward. This is sometimes known as an
    employee-owned cooperative, where the employees have a direct stake in how the
    company succeeds or fails, and open technologies allow these to occur more and
    more every day. Direct contact with the customer by the developers means that,
    in effect, the customer also becomes a direct stakeholder. ◼◼◼'
  merge: -1
  img_proc: true
