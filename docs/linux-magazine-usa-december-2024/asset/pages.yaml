    Listing 3 defines which entries are permitted as elements of the long list of
    entries in the **Y**AML file. An entry can specify a **type**. If this is missing,
    you are looking at a simple repository definition consisting of the **URL** and
    its target directory.


    The **Go** **GitMetaEntry** type defines all permitted field names of the entries
    in the **_.gaf** file starting in line 9. In addition to the optional entry **type**,
    an entry can contain the **URL** and **Dir** fields for a single entry, or the
    user for a **GitHub** repository (**Figure 3**), or the host and path for an **SSH**
    host that stores **Git** repositories.


    The **parseGMF**() function starting in line 18 expects an open file descriptor,
    reads **Y**AML data from it, converts the **Y**AML configuration into a list of
    **GitMetaEntry** objects, and passes these back to the caller.


