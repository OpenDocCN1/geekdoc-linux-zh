  md: '+   - AlmaLinux Certified: This is a more rigorous certification process that
    guarantees the hardware works and meets performance and reliability standards.


    According to benny Vasquez, chair of the AlmaLinux OS foundation, “The creation
    of the Certification SIG and the program around it illustrates that AlmaLinux
    continually empowers its community and enables action based on the feedback from
    users all around the world.” She continues, “Our users depend upon and appreciate
    the interactive approach to governance that leads to ongoing advancements in the
    community. We’re committed to providing a clear and consistent path toward hardware
    certification.”


    For those who are concerned that the process will take an extended period, the
    new AlmaLinux Hardware Certification takes just days to complete. To do this,
    the process leverages an open source certification toolkit, developed by AlmaLinux
    OS Foundation, that is built upon various open source hardware and software testing
    projects and tools.


