  md: '# IN-DEPTH


    # Programming Snapshot -- Go Interfaces


    starting at line 21. `sshGitorDir`() runs ssh on the command line, which runs
    an `ls` command on the remote host to list the Git repositories under the specified
    path. It is assumed that ssh is configured with a key pair and works without manual
    password entry.


    # Listing 8: clone.go


    ```

    ```

    01 package main

    02

    03 import (

    04     "os"

    05     "os/exec"

    06     "path"

    07 )

    08

    09 func cloneOrUpdate(c Cloneable, gitPath string) error {

    10     fullPath := path.Join(gitPath, c.Dir)

    11     _, err := os.Stat(fullPath)

    12     if os.IsNotExist(err) {

    13         cmd := exec.Command("git", "clone", c.URL, fullPath)

    14         _, err := cmd.CombinedOutput()

    15         if err != nil {

    16             return err

    17         }

    18     }

    19     err = os.Chdir(fullPath)

    20     if err != nil {

    21         return err

    22     }

    23

    24     cmd := exec.Command("git", "pull")

    25     _, err := cmd.CombinedOutput()

    26     return err

    27 }

    ```

    ```


    Starting with the paths to the config files inside the repositories that have
    been found, line 53 truncates them to their last two parts and adds this relative
    directory name to the end of the results string array slice. Back in `Expand()`,
    line 29 trims the frequently used `.git` suffix to create the name I want the
    Git cloning tool to use for the local copy. Line 31 then cobbles together the
    URL for the repository from the hostname, the path, and the repository''s directory.
    The result is a list of `Cloneable` structures.


    # And ... Action!


    The main program in Listing 7 now has to read the name of the GMF file to be processed
    from the command line in `main()`, open the file, and send it to the parser by
    calling `AddGMF()`. If successful, a list of `Cloneable` structures is returned;
    the for loop then checks these, starting at line 33, calling `cloneOrUpdate()`
    from Listing 8 in each case.


    This function in turn expects a `Cloneable` struct and the path under which all
    Git clones are stored. Prior to this, the main program has set `gitPath` to the
    git directory in the current user''s home directory; if you want something else,
    you will need edit this section.


    There are now two options for the actual cloning process: Either the directory
    with the clone already exists and only needs to be updated with `git pull`. Or
    it does not yet exist, and `git clone` in line 13 of Listing 8 creates a new local
    copy of the remote repository.


    # Bringing It All Together


    To build a binary from all of the listings in this issue, follow the usual steps:


    ```

    ```

    git mod init gitmeta

    git mod tidy

    go build

    ```

    ```


    This defines a new Go module, resolves all the dependencies on external libraries,
    and links everything to create an executable. Now you just need to quickly create
    a `.gnf` file with all the repositories you want to clone before you set off on
    vacation! +++


    # Info


    > [1] "Manage Git Repositories with a Meta Directory" by Mike Schilli, *Linux
    Magazine*, issue 118, September 2010, pp. 50-55'
