    the wizards appear to have tempted many developers to adopt the code without checking
    it carefully. In a blog post [7], developer Marco Frazoye shows how quickly bugs
    can slip through.


    # Exam Board


    GitHub Copilot tries to mitigate these problems with filters. The filters scan
    the generated code snippet for common problematic patterns. According to GitHub,
    potential problems include SQL injections and hard-coded credentials. If Copilot
    detects a problem, it blocks the suggestion or at least notifies the developer
    of the problem. Having said that, the AI wizard does not deploy any additional
    security measures. GitHub does recommends its other tools, such as GitHub Advanced
    Security.


    Programmers should always check the auto-generated source code themselves. GitHub
    Copilot and CodeConvert even explicitly point this out in the small print and
    in their FAQs. A second look is definitely recommended if a feature is still tagged
    as beta or even experimental, such as the Codium Command function in Codium, which
    generates code that matches a natural language description. The quality of the
    suggestions largely depends on the wizard''s knowledge base and therefore on the
    training data. But where the data comes from remains a mystery throughout. It
    is only rarely that providers give a source. The notable exceptions include Tabnine
    and GitHub.


    Both Als learn from the source code in publicly accessible repositories, including
    those on GitHub. However, there is significantly more source code in C than in
    less popular languages such as D or Cobol. Thanks to the AI wizards'' greater
    knowledge of C, the wizards can create far more complex code in the C language,
    whereas even simple situations in D will lead to nonsensical solutions.


    The various quirks of the leading AI development tools mean that developers walk
    away with widely differing experiences. Some programmers no longer want to be
    without their AI tools, and others find them useless. Anyone interested in these
    experiences will want to take a look at the discussions on Reddit, such as the
    thread on GitHub Copilot [8].


    # Legal Pitfalls


    Another problem with the training data is that AI users can never be sure whether
    the source code generated on demand violates licenses, copyrights, or even patents.
    This problem is exacerbated if the AI simply copies code snippets from the training
    data and passes them off as its own. According to GitHub, this happens with Copilot,
    especially if there isn''t very much code in the programmer''s editor, or if the
    AI is asked for very common solutions, such as a bubble-sort algorithm. Source
    code also often contains personal data, such as the email addresses of the developers
    involved. Basically, this information can also be found in the AI''s memory.


    GitHub tries to filter the output of email addresses, but you can''t rule out
    the risk of some slipping through. And there is duplicate detection to help prevent
    code copying. The GitHub AI searches for the code snippet it has generated in
    all public GitHub repos. If it finds what it is looking for, it either blocks
    its proposal or reports the location and license. Developers can


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_17_1.png)


    Figure 6: The Als generate documentation relatively accurately. In this example,
    Codium has written a correct comment for the task of computing the greatest common
    divisor.'
