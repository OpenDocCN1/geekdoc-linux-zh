  md: '![](img/d6d2a4cd4a2f445e8c9e8079857e2469_75_0.png)


    # Figure 2: The Anki editor is a basic HTML editor with just the functions you
    need to create efficient cards.


    happens, you have to decide whether to just remove that question, if it’s not
    really essential, or change it to make it easier to memorize.


    # The Power of Anki Notes


    Most things that you want to remember have more than one (for lack of a better
    term) face. For example, to pass an exam on Roman history, you should be able
    to answer without hesitation both this question:


    +   *   Q. Who was the first Roman Emperor?

    +       A. Gaius Julius Caesar Augustus.


    and its opposite:


    +   *   Q. Who was Gaius Julius Caesar Augustus?

    +       A. The first Roman Emperor.


    This is even truer when studying languages:


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_75_1.png)


    # Figure 3: This is what the question and answer created in Figure 2 look like
    when studying Linux with Anki.


    When speaking with a French person, for example, you should remember both that
    *ami* means “friend” and that *friend* means *ami*. With flashcards, this means
    you should have two cards for any term in the dictionary.


    Anki handles this issue in a way that is as efficient as it is badly documented
    on the website (and half-hidden in the user interface). Each piece of information
    you pass to Anki (e.g., who was the first Roman Emperor) is stored not in a card,
    but in a note that, depending on its type (more on this later), may generate one
    or more cards whenever you run a study session.


    This is good, but it should be the very first thing you read, in big letters,
    in the Anki start screen, its homepage, and the first page of its manual. Otherwise,
    people who download Anki because it is a “flashcard program” will believe they
    are creating cards when they are creating notes, and the mismatch can cause confusion,
    as proven by the fact that, in the 18 years since the first release of Anki, “What
    are notes?” has been a recurring question [6, 7].


    In fact, by default, if you click the *Add* button at the top of the Anki window,
    the program will show you right away the panel shown in Figure 2—a simple but
    perfectly adequate HTML editor, with all the parameters set to create the simplest
    possible Anki note that will generate only one card with two sides, Front and
    Back.


    When studying, Anki will show you the front side of that card (top part of Figure
    3). Then, when you click on *Show Answer* it will show the other side (bottom
    of Figure 3), plus buttons to declare how easy it was to remember the


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_75_2.png)


    # Figure 4: The Anki card-review management panel, with more options than most
    people will ever use.'
