    # The Gnome Foundation Struggling to Stay Afloat


    The Gnome Foundation has announced changes are underway due to some serious financial
    issues [https://foundation.gnome.org/2024/10/07/Update-from-the-board-2024-10/].
    Their current budget was approved on October 1, and they have been forced to make
    some very tough decisions to ensure long-term sustainability.


    Those decisions include layoffs, most notably Caroline Henrickson, Creative Director,
    and, Melissa Wu, Director of Community Development. The foundation also indicated
    that, unless more funds are secured, they will have to make serious changes in
    how they market, fundraise, and even attend events.


    One area that did not see cuts is Gnome''s two major conferences; Gnome Asia and
    GUADec. Fortunately, these events are backed by corporate sponsorship, so they
    have been spared (for the time being). The Gnome Foundation internship programs
    and the group''s participation in Google Summer of Code are also not impacted
    by the current cuts.


    Part of the reason for these cuts is that the Gnome Foundation had been living
    off a surplus of funds, but those funds dwindled until, in April 2024, Robert
    McQueen (Gnome Foundation president) announced that the surplus was gone.


    At the time of writing, the Gnome Foundation is currently searching for a new
    executive director.


    The Gnome Foundation is asking for community support by way of volunteering, idea
    sharing, and donations ([https://www.gnome.org/donate/]).


    # Thousands of Linux Servers Infected with Stealth Malware Since 2021


    A strain of malware has been exploiting misconfigurations on Linux servers since
    2021 and has been found to be quite challenging to remove. The malware has been
    dubbed perfect and, as you might expect, mines cryptocurrency.


    The developers of this malware are as of yet unknown. They have created a malicious
    piece of software that uses processes and file names that are either identical
    or very similar to those already found in Linux environments.


    To keep itself hidden, perfect uses several tricks, one of which is to install
    many of its components as rootkits, which by nature are harder to detect. Perfect
    also stops all easily detected activities when a user logs in, uses a Unix socket
    over Tor for communication, deletes the installation binary after the service
    is up and running, manipulates the pcap\_loop process by way of hooking to obfuscate
    the malware, and suppresses error messages to avoid warnings during execution.


    In regards to perfect, Assaf Morag, a researcher for Aqua Security, said, "The
    main impact of the attack is resource hijacking. In all cases, we observed a monero
    cryptominer (XMRI)G) executed and exhausting the server''s CPU resources. The'
  merge: -1
