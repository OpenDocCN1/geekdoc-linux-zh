  md: '# NEWS


    # Kernel News


    “So I do end up taking small fixes, because at that point it is indeed a ‘it wouldn’t
    help to wait’ situation. ”


    “But your pull requests haven’t been *small fixes*. And I admit, I’ve let it slide.
    You never saw the last pull request, when I sighed, did a ‘git fetch’, and went
    through every commit just to see. And then did the pull for real.


    “This time I did the same. And came to the conclusion that no, this was not a
    series of small fixes any more.”


    To Linus’s ‘bugs happen’ comment, Kent replied:


    “I _.know_.”


    “Look, filesystem development is as high stakes as it gets. Normal kernel development,
    you fuck up – you crash the machine, you lose some work, you reboot, people are
    annoyed but generally it’s ok.


    “In filesystem land, you can corrupt data and not find out about it until weeks
    later, or _worse_. I’ve got stories to give people literal nightmares. Hell, that
    stuff has fueled my own nightmares for years. You know how much grey my beard
    has now?


    “Which is why I have spent many years of my life building a codespace and development
    process where I can work productively where I can not just catch but recover from
    pretty much any fuckup imaginable.


    “Because peace of mind is priceless…” At this point in the conversation, Carl
    E. Thompson joined in, trying to bridge the gap. He said:


    “Kent, I’m not a kernel developer I’m just a user that is impressed with backefs,
    uses it on his personal systems, and eagerly waits for new features. I am one
    of the users who’s been using backefs for years and has never lost any data using
    it.


    “However I am going to be blunt: as someone who designs and builds Linux-based
    storage servers (well, I used to) as part of their job I would never, ever consider
    using backefs professionally as it is now and the way it appears to be developed
    currently. It is simply too much changed too fast without any separation between
    what is


    currently stable and working for customers and new development. Your work is excellent
    but ‘process’ is equally and sometimes even more important. Some of the other
    hats I’ve worn professionally include as a lead C/C++ developer and as a product
    release manager so I’ve learned from very painful experience that large projects
    absolutely *must* have strict rules for process. I’m sure you realize that. Linus
    is not being a jerk about this. Just a couple of months ago Linus had to tell
    you the exact same thing he’s telling you again here. And that wasn’t the first
    time. In your plan to just continue to break the rules and do whatever the heck
    you want until Linus stops bothering you! I don’t think that’s a good plan.


    “Since I’m already being blunt I’m going to be even more blunt: You have a serious
    problem working with others. In the past and in this thread I’ve read where you
    seem to imply that other kernel developers are gatekeeping and resist some of
    your ideas because you’ve created something that (in your opinion) is already
    better in some ways than some of things they’ve created. But from where I’m sitting
    the problems you’ve experienced are 90% because of ‘you’. You’re an adult and
    you need to understand that about yourself so you can do something about it.”


    Kent got the final word of the conversation, replying:


    “Your guys are freaked out because I’m moving quickly and you don’t have visibility
    into my own internal process, that’s all.


    “I’ve got a test [cluster], a community testing my code before I send it to Linus,
    and a codespace that I own and know like the back of my hand that’s stuffed with
    assertions. And, the changes in question are algorithmically fairly simple and
    things that I have excellent test coverage for. These are all factors that let
    me say, with confidence, that there really aren’t any bugs in this this pull request.


    “Look, there will always be a natural tension between ‘strict rules and


    processes” vs. ‘weighing the situations and using your judgement’. There isn’t
    a right or wrong answer as to where on the spectrum we should be, we just all
    have to use our brains.


    “No one is being perfect here, Linus and I are just sitting in different places
    with different perspectives. He has a responsibility as someone managing a huge
    project to enforce rules to see best, while I have a responsibility to support
    users with working code, and to do that to the best of my abilities.”


    The discussion ended there. My own take on the situation is that Linus generally
    prefers to win an argument rather than enforce his position. He may have a reputation
    for being mean and bombastic, but I believe that looking only at those snapshots
    tends to miss what’s really going on. In general, Linus loses patience when he
    feels the other person has had something clearly explained and is willingly refusing
    to get the point.


    So, since Kent seems to be honestly disagreeing with Linus in this conversation,
    I think it could go either way. I wouldn’t be surprised if Linus, for example,
    accepts another big patch from Kent and gives him another reminder that this needs
    to change. At the same time, in this discussion, Linus did say “enough is enough”,
    and that generally indicates that he’s about to enforce the rules. To me, it really
    could go either way at this point.


    Part of the problem is that many kernel developers are really amazing, and there
    can be a certain amount of arrogance that goes along with having such amazing
    skills and abilities. Kent would not be the first Linux developer to feel that
    their contributions were better and more carefully written than other people’s
    and deserving of special treatment. Part of Linus’s main discovery of the principles
    of open source development was to encourage people in their contributions. In
    the spirit of fun, I will say, if Linus turned developers away simply because
    they were arrogant, he might have run out of contributors a long time ago. ■■'
