    # ### Kubuntu 24.10

    #### “Orcular Oriole”

    **64-bit**


    # ### Kali Linux 2024.3

    **64-bit**


    Kubuntu 24.10, codenamed Orcular Oriole, is the newest release of the popular
    KDE-based Ubuntu flavor known as Kubuntu. The latest edition, which ships with
    Linux kernel 6.11, will receive nine months of full support until the next long-term
    support release in April 2025.

    The new Kubuntu comes with the KDE Plasma 6.1 desktop, KDE Frameworks 5.116 and
    6.6.0, and “many updated KDE Get applications.” The latest release is the next
    step in the developers'' quest to replace the ancient X11 graphics system with
    the more recent Wayland compositor. In the new edition, Wayland is the default,
    although X11 is still available as an option.

    Plasma 6.1 comes with a new option for easy remote access to other Plasma desktops.
    Also included are enhanced capabilities for screen locking and desktop customization.
    A new experimental feature called “permissions prompting” offers “fine-grained
    control over Snap applications permissions.”


    Based on Debian, Kali Linux is a security-directed distribution. It is a popular
    choice for forensics, penetration testing, and reverse engineering. Kali Linux
    2024.3 is the third release of the year.

    The focus of Kali Linux 2024.3 is the update and optimization of programming tools,
    including the documentation. However, the release notes also highlight what is
    not included because the update and optimization are taking weeks to complete.
    An important feature still to come is Python 3.12, whose exclusion has also blocked
    other packages (for details, see https://www.kali.org/blog/kali-linux-2024-3-release/).
    If a temporarily excluded package interests you, check the weekly updates to see
    if it is now available.'
