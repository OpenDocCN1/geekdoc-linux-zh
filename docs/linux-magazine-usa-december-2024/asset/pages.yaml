    ```


    you will get some information about how the code is laid out in memory (see Listing
    1). It shows that the vector table is located at the start of the flash memory,
    the program code (`.text`) 0x400 bytes later, and it’s all of 0x8e bytes in size.
    Any variables (`.data`) would be located in RAM, though in this case, with the
    program being so simple, the `.data` segment has zero size.

