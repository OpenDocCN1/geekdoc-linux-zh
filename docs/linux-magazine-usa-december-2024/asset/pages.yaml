  md: "![](img/d6d2a4cd4a2f445e8c9e8079857e2469_77_0.png)\n\n**Figure 8:** Once the\
    \ templates for all the cards of a note type are ready, you can generate as many\
    \ of those notes (and cards) as desired.\n\ntranslation of the French word and\
    \ the corresponding page in the dictionary.\n\nFigure 7 shows, as you can see\
    \ by comparing the Card Type value with the one of Figure 6, the front and back\
    \ template configuration of the other type of card supported by the Basic (and\
    \ reversed card) note type. As expected, it’s the same structure, just with inverted\
    \ fields.\n\nWhen the template configurations are done, you can click on the Add\
    \ button in the main Anki window as many times as desired and, after selecting\
    \ the right note type, enter all the French/English word pairs you want to memorize\
    \ with Anki. The screenshot collage of Figure 8 shows the three pairs I created\
    \ for this tutorial: Bonjour/Hello, Ami/Friend and Merci/Thanks. The two screenshots\
    \ in Figure 9 show how Anki creates two distinct cards from the same Ami/Friend\
    \ note.\n\nSumming up, cards are what you actually use when studying with Anki,\
    \ but they are generated on the fly from notes prepared in advance. Thanks to\
    \ this architecture, you can define and update all the raw data about a fact just\
    \ once, but reuse every “side” it has only where and when you actually need it.\n\
    \nThanks to this, if your brain remembered English-to-French translations much\
    \ more easily than French-to-English ones, Anki could show you the French-to-English\
    \ much more frequently than the\n\n![](img/d6d2a4cd4a2f445e8c9e8079857e2469_77_1.png)\n\
    \n**Figure 9:** The two specular cards generated by the single note created for\
    \ the Ami/Friend word pair.\n\nothers and never show the two cards of each note\
    \ back to back. Besides, you could further help your memory by customizing every\
    \ side of every card in different ways, for example giving a blue background to\
    \ English-to-French cards, and a red background to French-to-English cards.\n\n\
    # Cloze and Image Occlusion Notes\n\nTwo other very important note types are those\
    \ for “clozes” and “image occlusions.” The clozes are notes in which you can select\
    \ and hide the part or parts of text that constitute the answer to a question.\
    \ Instead of a basic Q&A card such as this:\n\n> Q. What is the last name of the\
    \ inventor of the Linux kernel?\n> \n> A. Torvalds.\n\nYou can create a note whose\
    \ card looks like this:\n\n```\nLinus [...] invented the Linux kernel.\n```\n\n\
    The answer is obviously the same in both cases, but the cloze version allows you\
    \ to add more context. Besides, you may use more clozes, hiding more than one\
    \ part of the text in the same card. To create a cloze note, select the corresponding\
    \ note type in the same panel shown in Figure 5, write the whole text of the note\
    \ in the Front field, and any additional text in the Back field. Then, select\
    \ the text you want to elide and click on the [.] button in the same panel. Assuming\
    \ you had written this sentence in the Front field:\n\n```\nLinus Torvalds invented\
    \ the Linux kernel.\n```\n\nand then selected for clozing the word “Torvalds,”\
    \ Anki will mark that word in this way:\n\n```\nLinus ({c1::Torvalds}) invented\
    \ the Linux kernel.\n```\n\nand hide it whenever it presents you the corresponding\
    \ card. To hide more words, just repeat the process. As in the French language\
    \ example, it is possible to create multiple cards from the same note by adding\
    \ more clozes. A cloze note with this text:\n\n```\n({c2::Linus}) ({c1::Torvalds})\
    \ invented the Linux kernel.\n```\n\nwill create two cards, the first hiding only\
    \ “Torvalds” and the second will only hide “Linus”; because “Linus” has the successive\
    \ cloze index (c2 instead of c1). If both words had the same index, Anki would\
    \ create only one card, hiding them both.\n\nImage occlusion (IO) notes perform\
    \ the same task as clozes, but hide parts of images (instead of sections of text)\
    \ with a rectangle, ellipse, or polygon. Quoting from the Anki documentation,\
    \ this is “especially useful when studying material that heavily relies on images,\
    \ such as anatomy and geography.”"
