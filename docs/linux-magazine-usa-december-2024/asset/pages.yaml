  md: 'To create IO notes, choose the corresponding note type, load into the note
    the image that should be occluded, and then use the additional buttons that appear
    in the Anki note editor to hide as many parts of the image as desired and also
    add captions. Then, click on the Image Occlusion Mode button, to the left of the
    button with the cursor, to choose between Hide All, Guess One and Hide One, Guess
    One. The first mode hides all the areas you masked and reveals them one at a time;
    the second one only hides one area.


    # Card Decks and Note Maintenance


    Anki includes a card and note browser with two separate views, one for notes and
    one for cards. Both views, distinguishable by the different colors of the view
    selector, are partially visible in the collage in Figure 10, where you can also
    check that the data I entered for the sample French language course indeed produced
    three notes and six cards.


    As soon as you have more than a 100 notes, you should check the browser regularly
    to see how many notes or cards are in each state, change the state, or add flags
    and tags to organize them better. The browser is also the place where you can
    arrange cards or notes in different orders, or search all the those that contain
    specific text, even saving the most frequent searches with custom names.


    # Anki Decks and Tags


    As powerful as notes are, if they were the only way Anki had to organize content,
    things would get very messy as soon as you tried to study more than one subject.


    In practice, this is no problem because Anki lets you assign any notes and their
    cards to one or more decks, regardless of the note type, and also tag them in
    any way desired.


    Having one deck for every topic ensures that when, for example, you need to refresh
    your memory about Linux administration, or whatever else you need to know to pay
    the bills, Anki won''t distract you with questions about video game history or
    any other hobby you may have.


    Besides these obvious advantage, Anki decks have an even bigger one if you build
    or customize them yourself, rather than using decks made by somebody else without
    any changes. When you assemble a deck by choosing all the right questions as I
    mentioned above, deciding which note type is better for memorizing each piece
    of information, how much context it should have, and so on, you have already started
    to learn and memorize, before having actually reviewed a single Anki card.


    To make things even easier, each deck can have as many sub-decks as desired, using
    two colons as a level separator. That is, a deck called


    Linux Distributions:Debian and one called Linux Distributions:Slackware would
    be two sub-decks of the upper-level deck about Linux distributions.


    That said, with Anki it is important to not get carried away with partitioning
    decks in smaller sub-decks, for the simple reason that the smaller a deck is,
    the more predictable the order of its cards become. You may end up memorizing
    the order of the answers and find yourself unable to remember all of them separately.


    The right way to classify your notes is now any way you want without this problem
    is to give each of them tags (compare with the bottom of Figure 2), which you
    can then organize into trees as desired by dragging and dropping them onto each
    other in the browser shown in Figure 10.


    # Anki Data Formats


    At the beginning of this article, I observed that I really like how Anki saves
    and exports its internal data, because it makes it easy to automatically create
    or analyze how many flashcards I want, in many ways.


    Here is what I mean: Your Anki user profile contains, besides a directory for
    compressed back-ups in ZIP format, another directory called collection.media and
    two files called collection.anki2 and collection.media.db2. They are nothing other
    than two single-file databases in the SQLite3 format that are fully supported
    on all operating systems.


    This means that you can restore them with any SQLite recovery tool if something
    bad happens (and it does, Anki will let you know!). Besides, if you aren''t satisfied
    by all the reports that Anki generates (see Figure 11), you can create your own
    by directly querying those databases, even aggregating the statistics of multiple
    users!


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_78_0.png)


    **Figure 10: The Anki browser is the one-stop shop where you can keep all your
    notes and cards under control.**'
  merge: -1
  img_proc: true
- pgno: 79
  md: "Equally interesting are Anki's import and export capabilities, both accessible\
    \ from the File main menu. You can export just one deck or all of your user profile\
    \ as ZIP archives, which you can share with other users with the .apkg (Anki package)\
    \ suffix for decks and .colpkg (Anki collection package) for your whole profile.\n\
    \nBut you may also export (and subsequently import in any another Anki instance)\
    \ all your notes in plain-text format, and this is the part I really like. To\
    \ see what I mean, check out Listing 2, the Anki export file of all the notes\
    \ I created for this tutorial, telling Anki to include everything but the unique\
    \ note identifier it uses internally.\n\n# Listing 2: Anki Notes Export, Plain-Text\
    \ Format\n\n```\n#separator:tab\n#html:true\n#notetype column:1\n#deck column:2\n\
    #tags column:8\n\nBasic\t(and reversed card)\tCustom Study Session\tBonjour Hello\t\
    12\t\tlanguages\nBasic\t(and reversed card)\tCustom Study Session\tMerci Thanks\t\
    35\t\tlanguages\nBasic\t(and reversed card)\tCustom Study Session\tAmi Friend\t\
    34\t\tlanguages\n\nClose\tanki-test-deck\tLinus\t{ {cl:Torvalds} } invented the\
    \ Linux kernel.\tTorvalds\n\nImage Occlusion\tanki-test-deck\t{ {cl::image-occlusion:ellipse:left=.4278;top=.1498;rx=.0892;ry=.048;ol=1}\
    \ }{br:{ {c1::image-occlusion:text:left=-.2519;top=.3399;fill=rgb(0,0,0):text=Who's\
    \ this?;scale=1.:fa=.0053;ol=1} } }<br>\t\"<img src=\"**20240926_083104.jpg**\"\
    >\n```\n\nListing 2's format is easy to decode: After a simple, self-explaining\
    \ header, there is one note per row, with tab-separated columns that contain note\
    \ type, deck, fields, and tags. The reason why this makes me happy is that if\
    \ this format is easy to read, it's also easy to write! In other words, it would\
    \ be quite easy, with the tons of text-processing tools available on Linux, to\
    \ generate a separate deck for each student of a entire course, and that's just\
    \ one use case. Aren't open formats wonderful?\n\n# Conclusions\n\nThe distinction\
    \ between cards and notes should really be explained better in the documentation\
    \ and\n\n![](img/d6d2a4cd4a2f445e8c9e8079857e2469_79_0.png)\n\nFigure 11: The\
    \ only problem with the Anki statistics about your study may be how many of them\
    \ there are."
  merge: -1
  img_proc: true
