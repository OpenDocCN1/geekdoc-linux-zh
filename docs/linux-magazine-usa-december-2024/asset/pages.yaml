    \ This code includes functions for handling INI files. DiodasRAT uses encryption\
    \ used in QQ Messenger.\n\n# Independent Code Base\n\nAll examples of the cross-platform\
    \ DiodasRAT embed a string containing the internal version of the backdoor. Some\
    \ strings reflecting the development of the backdoor appear in Table 1.\n\nThe\
    \ earliest version for Linux was first spotted in the wild by security researchers\
    \ in July 2021. Lionodas has the same logic as the Windows version, but it adds\
    \ a number of its own behaviors and specifically targets Linux servers. The latest\
    \ Lionodas version (v11) can also be observed in a Windows version, which communicates\
    \ with the same C2 server update.microsoft-setting[.](.local (see Table 2).\n\n\
    Two samples with different internal versions suggest that there were two different\
    \ development teams or at least two backdoors in different stages of development\
    \ communicating with the same C2 server. The Linux and Windows versions have overlapping\
    \ command IDs that seamlessly support the same malware functionality for different\
    \ operating systems.\n\nThe cybersecurity researchers have im-planted their work\
