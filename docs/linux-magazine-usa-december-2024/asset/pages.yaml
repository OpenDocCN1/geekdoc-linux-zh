    # Programming the Target


    To program your microcontroller with this code, you need one further tool, `cargo
    embed`. This tool talks over USB to the companion processor on the target board,
    which in turn manages programming the microcontroller. You can no longer install
    cargo embed directly as it is now part of a project called probe-rs. Follow the
    instructions at the project website [13], which just amounts to running a `cur`
    command. Let’s first check that probe-rs supports our target:


    ```

    ```bash

    $ probe-rs chip list | grep STM32L476

    ...

    STM32L476RCTX

    STM32L476RET

    STM32L476RGT

    ...

    ```


    The output shows it supports many variants of the STM32L476, including our target.
    Now connect the target board to a USB socket on your host. The power LED should
    light. Type `probe-rs list` and you should see that it has detected the target
    board. Our output may vary, depending on the exact configuration:

    ```


    ```

    ```text

    The following debug probes were found:

    [0]: STM32 V3 -- 0403:3753:0000002737 5650132903558 (ST-LINK)

    ```


    Let’s try programming the target:


    ```bash

    cargo embed --chip STM32L476RGT

    ```


    You should see an output similar to that in Figure 2 – success: your code runs!
    Note that the proper launch command was `cargo embed` and not `cargo run`, which
    would attempt to run your program on the host.

    ```


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_57_0.png)


    To complete the project configuration, you can add the chip information to an
    `Embed.toml` file in the project’s root folder, so you don’t have to provide all
    the details every time:


    ```

    ```toml

    [default.general]

    chip = "STM32L476RGT"


    [default.rtt]

    enabled = false


    [default.reset]

    halt_afterwards = false

    ```


    Then typing `cargo embed` will be enough to program and run your code on the target.

    ```


    # Runtime Debugging


    Before diving into programming the microcontroller’s I/O, I’ll deal with a debugging
    technique which allows you to print data back to your host’s console. The first
    step is to add another crate with


    ```

    ```bash

    cargo add rtt-target

    ```


    (which provides a feature called real-time transfer, RTT) and a new statement
    to the program:


    ```rust

    use rtt_target::{rprint!, rtt_init_*

    print!};

    ```


    Modify the `Embed.toml` file you created above, and set `enabled` to `true` in
    the `default.rtt` section. Then you can add some `print` statements to your code
