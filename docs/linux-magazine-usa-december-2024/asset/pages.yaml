    These tools can also help newcomers master a new language (Figure 8). You can
    tell the AI wizards to show you examples and ask questions about the existing
    code. Some AIs offer special assistance: Refraction will create an introduction
    to an arbitrary programming topic on request, whereas JetBrains AI guides you
    through the range of functions in its in-house IDEs. However, the texts of the
    AI tools sometimes sound very much like boring reference manuals, which is why
    many developers prefer to switch to ChatGPT for this task.


    # Testing, Testing, 1, 2, 1, 2


    The AI wizards also offer useful support for testing. More specifically, they
    can automatically generate test cases or unit tests at the push of a button. The
    AI developed by JetBrains for its IDE is based on both the source code and the
    documentation. Refraction, in turn, automatically inserts debug texts into the
    code, such as “All elements processed. The AI derives the texts from the names
    of functions, variables, and other elements, which is why they often require some
    rework. Some AIs detect typical or potential programming errors and alert you
    to them. These errors can even happen while you are typing. Refraction even explains
    how the error occurred and how to remedy it. But none of the AI assistants can
    guarantee completely error-free code.


    When things have to be done quickly, spaghetti code with variables whose names
    consist of just one letter is still commonplace. Some AI tools are capable of
    unraveling this mess of code and formatting it in compliance with a style guide.
    In addition to optimized code, Refraction offers natural language improvement
    tips. For example, the AI complains about a lack of input checking and meaningless
    variable names. Refraction, Codeium, and others can automatically refactor the
    code (Figure 9). Refraction also automatically converts hard-coded strings and
    numbers into variables and adds missing types. Once again, the quality of the
    results depends to a huge extent on the complexity of the source code.


    # Payment Plans


    Most smart programming aids are only available as commercial cloud services, which
    the plugins for the development environments then consult. Alternatively, you
    can talk to the AI directly in the browser, but this means that you have to constantly
    copy the source code back and forth. Tabnine is one of the few providers that
    lets you host its models on-premises yourself.


    Any free offers available are either time-limited or severely restricted in terms
    of their feature set. Fees also vary considerably among the services. Professional
    developers will pay at least US$80 per year with Refraction, whereas GitHub Copilot
    charges US$19 per user and month. Special conditions are often available for students,
    teachers, and developers of open source projects.


    Looking for open source programming wizards is like finding a needle in a haystack,
    and they are also far more complex to set up. As with Tabby [10] and FauxPilot
    [11], you typically need to launch a server in a Docker container. Well-known
    open source models often operate in the background. Tabby uses Code Llama, StarCoder,
    or CodeGen, for example.


    Some AI wizards let you query with an API – via OpenAI in the case of Tabby, for
    example. If you do not want to use Curl to access these interfaces, you will need
    a matching client or a plugin for your own IDE. Fortunately, the Tabby project
    itself provides some plugins. In the case of FauxPilot, you either have to resort
    to plugins from third-party developers or use tricks to persuade the official
    Visual Studio code plugin for the GitHub Copilot to cooperate (Figure 10). As
    an alternative to Tabby and FauxPilot, you can install the Ollama framework [12]
    directly and use it to run an open source model such as Code Llama locally. If
    you decide to take this extremely bumpy path, you will find a usable Visual Studio
    code plug-in in the form of Privy [13].


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_19_0.png)


    Figure 9: Refraction refactoring older Rust code while adapting it to current
    Rust versions at the same time.'
