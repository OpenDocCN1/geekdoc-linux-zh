- pgno: 23
  md: '# REVIEW


    # Distro Walk - ArcoLinux


    resolutions. Only then can users choose an automatic easy install or an advanced
    install in which every option is chosen by the user. The advanced install is the
    most secure choice, although ArcoLinux does not mention the factor.


    The easy install is similar to that of many distributions. Although extensive
    online help is provided, the advanced installation is best installed with a browser
    at hand to help in making choices. The advanced installation defaults to American
    English and includes the usual basics, but many of its pages require some knowledge.
    Otherwise, users may puzzle over which kernel to install – the latest, a hardened
    kernel, or half a dozen others. The choices threaten to be even more overwhelming
    in over 20 additional pages of options for drivers, login, office software, fonts,
    and graphics. Even if you adopt the policy of leaving installation until later
    when in doubt, this is no 15-minute install. Most likely it will be more like
    45 minutes, but those who value customization should appreciate the freedom of
    choice (Figure 3).


    # ArcoLinux Applications


    ArcoLinux’s desktop applications depend on how the desktop is installed and the
    choices made (Figure 4). The easy installation’s curated applications are mostly
    unexceptional. They vary with the desktop chosen, especially among the development
    apps. For instance, choosing KDE Plasma also installs the Plasma Engine Explorer
    and Plasma Theme Manager. Otherwise, the choices are mostly typical of most distributions.
    The main exceptions in the easy installation are the apps inherited from Arch
    Linux. Chief among them are the Arch Linux Tweak Tool (Figure 5), to which a few
    ArcoLinux extras are added, and the Arch Linux Kernel Manager. Both are comprehensive
    administration apps that would be useful in any distribution. In addition, the
    ArcoLinux install includes a welcome screen with a few basic utilities, a guide
    to building custom install images (Figure 6) and another for building Conky docks,
    and still another for removing one or more desktops. All are more comprehensive
    than the average desktop app and deserve to be ported to other distributions.


    With an advanced installation, by definition, the variation becomes more personal.
    Many productivity categories have multiple choices, but the most varied are the
    dozens of choices for desktop environments, which range from window managers to
    almost every desktop I have ever heard of, and many I haven’t. A close second
    is the choice of web browsers. Where some distributions offer two or three, ArcoTool
    offers over two dozen, although some are only variations of the same choice.


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_23_0.png)


    free software, but ArcoLinux is an example of how it should be done. While ArcoLinux
    is probably unsuitable for absolute beginners, it is ideal for beginners who aspire
    to become experts, and for anyone who values customization and freedom of choice.


    +   - [1] ArcoLinux: https://www.arcolinux.info/

    +   - [2] ArcoLinux videos: https://www.arcolinux.info/arcolinux-editions/

    +   - [3] Learning paths: https://www.arcolinux.info/learning-path/


    # The State of the Project


    ArcoLinux could benefit from some reorganization. The text on links could be more
    descriptive, and the site was hard to navigate and not just for the first time.
    All the same, ArcoLinux is an ambitious project, especially for a small development
    team. What it does to make Linux in general and Arch Linux in particular more
    accessible is impressive. Documentation is often a weak point in


