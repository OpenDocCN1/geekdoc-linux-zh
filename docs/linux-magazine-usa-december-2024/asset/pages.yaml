    # ## OSI and LPI Form Strategic Alliance


    During the OSPGs for Good event at the United Nations headquarters in New York
    City, the Open Source Initiative (OSI, https://members.Opensource.org/oin) and
    the Linux Professional Institute (LPI, https://www.lpi.org/) confirmed a new alliance
    to address the growing demand for employability from public and private organizations
    worldwide. This will bring the two groups together to collaborate on technical
    education projects aimed at increasing professional growth for both Linux and
    open source technologies.


    The agreement bolsters LPI''s professional certification by ensuring that open
    source licenses meet open source software requirements, and encouraging members
    of the public to participate in the development and maintenance of open source
    projects and achieve certifications.


    This coming together will also help both LPI and OSI financially, because it means
    they will be eligible to receive certain discounts and exclusive opportunities.
    However, more importantly, both organizations will collaborate on initiatives
    that strengthen the Linux and open source ecosystems.


    According to Stefano Maffulli, Executive Director at OSI, "The global open source
    movement has generated immeasurable economic value, yet the movement has never
    been in greater need of educated professionals to drive the next leap forward
    in open source understanding, innovation, and adoption." Maffulli continues, "OSI
    exists to both promote the Open Source Definition and to encourage the growth
    of open source communities around the world. This partnership with LPI is one
    in a series of initiatives that will increase accessibility to the certifications
    and community participation that open source needs to thrive.")


    G. Matthew Rice, Executive Director at LPI, had this to say of the alliance: "It
    is our mission to promote the use of open source by supporting the people who
    work with it. A closer relationship with OSI makes a valuable contribution to
    this effort. We are excited to open up new opportunities for people around the
    world - personally, professionally, and in their communities.")


