- pgno: 92
  md: '# TUTORIAL – LEGACY VIDEO GAMES


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_92_0.png)


    **Figure 5: 86Box requires a ROM pack in order to run and will suggest a download
    link to retrieve one. If you are running the AppImage, the pack will be loaded
    from the `roms` folder in the working directory from which 86Box was invoked.**


    remembering why you like Linux so much. On the other hand, 86Box performs emulation
    on the software layer only, as opposed to Qemu/KVM, which leverages your CPU’s
    virtualization features. As such, 86Box pays a heavy performance penalty – which
    won’t be noticeable when emulating low capacity computers, but will be when emulating
    a powerful machine without a beefy physical CPU in your host.


    86Box is available in many package types, including AppImage [12]. I recommend
    creating a dedicated folder if you intend to use the AppImage version, because
    86Box is a bit messy and will use the current working directory to store its configuration
    data. Therefore, to save yourself the trouble just download the AppImage to a
    dedicated empty folder, open a terminal, switch to that directory, and execute
    86Box from there.


    In order for 86Box to function, you will need to provide the appropriate ROMs
    for any hardware component you want to build your virtual PC with. This means
    you will have to obtain a ROM for the motherboard, the video adapter, etc. When
    started for the first time, 86Box will offer a download link to retrieve the official
    ROM collection from GitHub if ROMs are not present (Figure 5).


    A primitive machine will be launched by default after invoking 86Box (assuming
    ROMs are present), but chances are you will have to build an entirely different
    virtual PC. You may select the components you want your virtual computer to have
    from *Tools / Settings*, which is a very tricky task. There are many pieces of
    hardware to pick from and the difference is not obvious for a novice. As a rule
    of thumb, remember that emulating a powerful computer is much harder than emulating
    a primitive one, so when in doubt, try to build the less-powerful machine that
    can run your games. As of 2024, it is said that a Pentium II CPU with an early
    Voodoo graphics card ROMs is the most powerful combination that can be emulated,
    in practice, by 86Box running on a modern consumer-grade CPU. If you get stuck,
    check with the VOGONS [13] community and see which virtual hardware configuration
    people are using.


    The final step is installing the operating system alongside the necessary drivers.
    Windows 98 Second Edition is a safe pick, as long as you have a legitimate installation
    CD and boot disk laying around. Installing Windows on 86Box is no


    different than installing it on a real machine and the process is sufficiently
    documented. Don’t forget to install the Windows drivers for your virtual computer!


    Performance for games is sufficient as long as you are using a good CPU in your
    host and the games you run are not very demanding. As a reference, I used an Intel
    Core i5-2467M during my tests. Keep also in mind that some games run better than
    others on different hardware platforms, so feel free to experiment. Certain titles
    will misbehave on virtual computers that can cope with more demanding games (Figures
    6 and 7).


    # Conclusions


    Archiving old PC games is easier than it seems, at least up to the age in which
    copy protection became prevalent. On the other hand, preserving the platforms
    those games can be run on is complex.


    DOSBox and its forks make it possible to run DOS games without need for a dedicated
    MS-DOS machine. Therefore, storing images of your CDs and keeping a copy of DOSBox
    is all you need to ensure your DOS games remain playable.


    Reproducing an early Windows platform for your Windows games takes effort. Wine
    is complex and results are mixed, but when it works, it offers the best performance.
    Modern hypervisors such as VirtualBox are not designed for retro games and will
    likely not support pre-Windows NT versions of Windows. 86Box offers great emulation
    fidelity, at the cost of performance and great complexity. In fact, DOSBox-X might
    be an adequate choice if you are willing to sacrifice


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_92_1.png)


    **Figure 6: Krush, Kill ''N Destroy 2 (KKND2) works fine in a 86Box machine, with
    a virtual Intel Pentium 90MHz!**'
