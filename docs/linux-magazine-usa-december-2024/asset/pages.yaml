  md: "via in-memory buffers, it is very fast. Embedded debugging is a whole topic\
    \ in itself, and sometimes there is no substitute for a full gdb-type debugger,\
    \ but print statements like this will answer many questions such as “did my code\
    \ reach this point?” or “what is the value of this register?” without interrupting\
    \ what can be time-sensitive code. Press Ctrl + C to return to the command line.\n\
    \n# Configuring I/O Pins and Internal Clocks\n\nWith vendor IDEs, you configure\
    \ I/O pins for a user interface. For instance, you can make port A pin 5 an output\
    \ (it’s connected to an LED) and port C pin 13 an input (it’s connected to a push\
    \ button).\n\nThe IDE will generate the appropriate C/C++ code for you and add\
    \ it to your project’s startup code. Rust doesn’t offer this option, but of course,\
    \ you can examine the microcontroller data sheet, figure out what values to write\
    \ to what register, and dispense entirely with the IDE approach.\n\nI’ve annotated\
    \ the code in Figure 4 (main-04.rs), with references to the manual, to show how\
    \ I found the values. I have now managed to make the LED blink using only direct\
    \ register writes. If you are very familiar with this approach, possibly coming\
    \ from an assembler or C/C++ background, this may seem or you, though I think\
    \ in all but the most trivial cases it’s tressome and error-prone. That’s a matter\
    \ of taste though.\n\nFor a higher-level approach, like that provided by ST’s\
    \ hardware abstraction layer (HAL), you have the choice of two levels available\
    \ in Rust crates. For the current device, you could replace stm3214 with stm3214\
    \ via cargo add stm3214. Repeat the earlier test and make the LED blink using\
    \ a different approach. First modify your Cargo.toml file to specify the exact\
    \ microcontroller in use. Change\n\n```\n```toml\nstm3214 = \"0.15.1\";\n```\n\
    \nto\n\n```toml\nstm3214 = { version = \"0.15.1\", \nfeatures = [\"stm321xx\"\
    \ ]};\n```\n```\n\nThen change main.rs to look like Figure 5 (main-05.rs). The\
    \ stm3214 crate sticks closely to the register names in the data-sheet, so with\
    \ a bit of careful study it should be clear what’s happening. For instance, odr\
    \ is the output data register, so odr5 refers to bit 5, which is the bit that\
    \ controls pin 5 of that particular port, in this case port A. For example, it\
    \ should be clear what the following in line 27 is doing.\n\n```\n```python\n\
    gpioa.omd.modify(|_, w| w\n.010(2).clear_bit(0));\n```\n```\n\nYou can step up\
    \ a level and use a HAL crate. Run these commands:\n\n```\n```bash\ncargo remove\
    \ stm3214\ncargo add stm3214x\ncargo clean\n```\n\nChange Cargo.toml again, replacing\n\
    \n```bash\nstm3214x-hal = \"0.7.1\"\n```\n\nwith\n\n```bash\nstm3214x-hal = {\
    \ version = \"0.7.1\", \nfeatures = [\"rt\", \"stm321476\"] };\n```\n```\n\nNow\
    \ change main.rs into the version in Figure 6 (main-06.rs). Compile and run it.\
    \ I’ve added an input for a push button, but otherwise the result is the same\
    \ – this code is more concise and easier to read.\n\n# Setting Up the Microcontroller\
    \ Clock Tree\n\nBy default, the STM32 processor runs off an internal RC clock\
    \ at 4MHz, so you are not getting its best performance. The delays I’ve added\
    \ are clock dependent. If you set up the clock correctly with\n\n```\n```python\n\
    let mut flash = peripherals.FLASH;\nconstrain());\nlet mut pwr = peripherals.PWR;\n\
