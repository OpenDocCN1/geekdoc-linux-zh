- pgno: 56
  md: "# Embedded Rust\n\n# MAKERSPACE\n\nBy default, your Rust installation only\
    \ supports your host architecture, Linux. To add support for your target, simply\
    \ type:\n\n```\n`rustup target add thumbv7em-none-eabihf`\n```\n\nTyping `rustup\
    \ show` will confirm the supported targets. To start a project, type:\n\n```\n\
    `cargo new nucleo-l476rg-primer`\n```\n\nChange your directory to the directory\
    \ created in that command and start VS Code by typing `code .` (with a dot for\
    \ the current directory at the end). You should see a source subdirectory and\
    \ a `Cargo.toml` file; you can ignore the other files and directories for now.\
    \ Open the `main.rs` file in the source directory. You need to tell the compiler\
    \ not to include the standard library and that your program does not have the\
    \ usual entry point. We use the `#![no_std]` and `#![no_main]` directives for\
    \ this. Later you will add another directive to tell the compiler where the entry\
    \ point is, and that can be a function with any name of your choice (including,\
    \ oddly enough, `main`).\n\nAt this point you need support from an external library.\
    \ There is a registry of available libraries (known as *crates* in Rust) [11].\
    \ The `cortex_m` crate\n\n![](img/d6d2a4cd4a2f445e8c9e8079857e2469_56_0.png)\n\
    \nFigure 1: The NUCLEO-L476RG is an STM32 development board. © st.com\n\nprovides\
    \ support for the Cortex core and includes linker instructions to ensure our code\
    \ is properly located in the target memory [12]. You can add this crate as a dependency\
    \ with\n\n```\n`cargo add cortex-m-rt`\n```\n\nthis should add a dependency line\
    \ to `Cargo.toml`.\n\nNow you can add the entry-point directive and a function\
    \ that never returns. Your code should look like this (`main-01.rs`):\n\n```\n\
    ```\n#![no_std]\n#![no_main]\n\nextern crate cortex_m;\nuse cortex_m_rt::entry;\n\
    \n# [entry]\nfn entry_point() -> ! {\n    loop {}\n}\n```\n```\n\nIn order for\
    \ the linker to know where to locate your code, you need to provide the `cortex-m-rt`\
    \ crate with a memory layout file that it adds to the linker script. Looking at\
    \ the memory map in the STM32L476 datasheet (page 103), you see that there is\
    \ 128KB of internal RAM located at 0x20000000. Looking more closely at the datasheet\
    \ (page 20), the SRAM is divided into 96KB mapped at address 0x20000000 (SRAM1)\
    \ and 32KB located at address 0x20000000 with hardware parity check (SRAM2), so\
    \ SRAM1 is the one you need. I will return to SRAM2 later. There is also 1MB internal\
    \ FLASH at 0x08000000. With some digging in the reference manual (at page 393),\
    \ you can find that at reset the\n\nprocessor will jump to an entry in the interrupt\
    \ vector table located at the beginning of FLASH. This is taken care of in the\
    \ start-up code, so all you have to tell the linker is where to find the memory.\
    \ Add `memory.x` with the following lines in the root of your project directory:\n\
    \n```\n```\nMEMORY\n{\n    RAM : ORIGIN = 0x20000000, LENGTH = 96K\n    FLASH\
    \ : ORIGIN = 0x08000000, LENGTH = 1024K\n}\n```\n```\n\nThe linker also needs\
    \ to know the target microcontroller so you need to add another file, `config.toml`,\
    \ in a new `.cargo` directory:\n\n```\n```\n[build]\ntarget = \"thumbv7em-none-eabihf\"\
    \n\n[target.thumbv7em-none-eabihf]\nrustflags = [\"-C\", \"link-arg=-Tlink.x\"\
    ]\n```\n```\n\nThis saves you from having to pass these arguments on the command\
    \ line. The file `link.x` that `rustflag` refers to is generated by Cargo, and\
    \ `memory.x` is included in it. If you attempt to control memory layout by adding\
    \ statements to `memory.x`, they may clash with those in `link.x` and lead to\
    \ some puzzling error messages. If you want finer control over memory layout,\
    \ use the Rust flags to point to your own linker script.\n\nTo help VS Code’s\
    \ Rust analyzer, you need to add a further configuration file, which will ensure\
    \ that it applies checks to the target architecture instead of the host. Otherwise\
    \ you will get some strange messages. In a directory called `.vscode` add the\
    \ `settings.json` file from the source code file collection.\n\nIf you try to\
    \ compile the code now with cargo build, you’ll get an error: The compiler will\
    \ complain about a missing panic handler. As you may know, Rust may panic when\
    \ something bad happens, such as an out-of-bounds array reference. In a desktop\
    \ application, this would cause the program to terminate and print an informative\
    \ error message. On an embedded system, that’s impossible, so for the moment,\
    \ we’ll add a default handler which just stops the processor in an infinite loop.\
    \ To add the handler, run\n\n```\n`cargo add panic-halt`\n```"
