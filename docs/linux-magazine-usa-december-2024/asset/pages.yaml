  md: '![](img/d6d2a4cd4a2f445e8c9e8079857e2469_28_0.png)


    page changedetection.io monitors for changes. The *Visual Filter Selector* is
    advanced functionality that I’ll explain later, and *Filters* and *Triggers* allows
    you to remove HTML elements or select only specific HTML elements from the page.
    For example, one of the web pages I’m watching has a footer showing how many “bad”
    access attempts it has blocked. Naturally, this triggers change detections I’m
    not interested in. When examining the web page’s HTML code, I noticed that the
    `main` element contains all the information I need, without the footer. So I added
    the XPath filter `/main` to the CSS/JSONPath/JQ/XPath Filters text box on this
    tab. Don’t forget to save your changes.


    For stock and price detection, the *Re-stock & Price Detection* tab allows you
    to adjust the watch’s behavior. For example, you can specify whether you want
    to know about any availability changes or only when an out-of-stock product is
    back in stock. You can also enable and disable price monitoring, and you can even
    trigger notifications when the price changes below or above a set value (Figure
