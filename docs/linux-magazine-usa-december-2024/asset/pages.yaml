  md: '# ## FOS SPicks


    Sparkling gems and new releases from the world of Free and Open Source Software


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_81_0.png)


    Nate explores some top FOSS tools, including the latest Gnome desktop, a slick
    3D model viewer, LibreQuake, and a neat currency converter. **BY NATE DRAKE**


    # ## Desktop environment


    # Gnome 47


    On September 18, the Gnome Community released the latest version of the desktop,
    codenamed \''Den-\ ver.\'' The top-billed new \''Accent Colors\'' feature is underwhelming
    to Ubuntu users, given the OS has supported this since 2022. Still, it\''s easy
    to access via Gnome settings and was the first change I made when testing Gnome
    47 in a daily build of Ubuntu 24.10.


    The Nautilus file manager has also been overhauled. Traditionally, bookmarks to
    Home folder locations such as Documents and Pictures could be removed. This is
    now supported and I put it to good effect to remove the


    redundant Videos folder. I also noted that the *Other Locations* bookmark is no
    longer there. All internal drives are listed in the sidebar instead. The release
    notes also state that file searching has been improved in that users will see
    an info button if trying to search a location that isn\''t indexed or a remote
    folder. This provides more contextual information, though it doesn\''t speed up
    the search.


    A number of other Gnome apps have also been updated. The Gnome Web browser, Epiphany,
    has a new bookmarks sidebar to make bookmarks easier to search and navigate, as
    well as an auto-fill feature for forms.


    Gnome Calendar also contains numerous bug fixes and an improved layout for displaying
    event details. Some new Gnome Circle apps have been added including the Mastodon
    client Tuba, which I reviewed last month, as well as the currency converter Valuta,
    which is covered in this issue.


    Gnome also now works better with Remote Desktop sessions, because these can now
    be automatically resumed even when cut off. Dialogs have been modified to work
    better with narrow screens and now display clearly defined buttons. When creating
    a new folder in Pictures, I noted that the dialogs also follow custom accent colors.
    Open and Save dialogs have received an upgrade and now support zoom, reordering,
    preview, and even renaming files.


    Special mention should also go to Gnome Control Center, which has an upgraded
    Add User dialog. This now enforces the password requirements found in the configuration
    file in */etc/security*. When creating accounts, you can still choose to set a
    password immediately or upon login. Gnome\''s Disk Usage Analyzer also apparently
    has a refreshed interface with a modernized file list, updated icons, and a new
    look for the location bar. However, when I checked the app against the version
    in my Ubuntu 24.04 virtual machine, I couldn\''t noticed any appreciable difference
    beyond a slightly more compact interface.


    Beneath the hood, Gnome\''s online accounts feature now supports automatically
    completing IMAP/SMTP configuration details when users enter an email address.
    Email, Calendar, and Contact Information have been added for Microsoft 365 accounts.
    Gnome now also includes an experimental enhanced fractional display scaling feature
    to support legacy X11 apps. Users can also play VR games while using Wayland desktop
    sessions. The release notes also mention the addition of the \''foundations for
    reliable and hardware-accelerated screen sharing\'' required by the proprietary
    NVIDIA graphics driver.


    If you\''re excited to test the latest Gnome, you can fire it up in a supported
    operating system like Ubuntu 24.10 or Fedora 41. At the time of writing both these
    operating systems are in beta. Make sure to wait for the stable release if you
    want to use Gnome 47 as your daily driver.


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_81_1.png)


    +   1. **Epiphany:** New browser features include a sidebar for searching and
    loading bookmarks.

    +   2. **New apps:** Gnome comes with new Circle apps including the mighty Mastodon
    client Tuba.

    +   3. **Removable bookmarks:** Nautilus now supports removing bookmarks to home
    folder locations like Videos.

    +   4. **Internal drives:** Instead of listing *Other Locations*, Nautilus now
    displays all internal disks.

    +   5. **New dialogs:** These now have a cleaner, improved layout and follow Gnome
    accent colors.

    +   6. **Informative search:** Gnome now alerts users who try to search in non-indexed
    or remote locations.

    +   7. **Persistent connections:** Remote login sessions that are disconnected
    for any reason can now be resumed.

    +   8. **Accent colors:** Although already supported in Ubuntu, this feature is
    now simpler to access.


    **Project Website**

    https://release.gnome.org/47/'
