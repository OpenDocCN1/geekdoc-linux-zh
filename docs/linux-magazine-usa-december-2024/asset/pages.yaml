    # ## No Spaghetti Code


    The parser calls Expand() three times, but each time it achieves the result in
    a different way. Of course, Expand() could find the currently correct algorithm
    in a forest of if-else branches, but this is confusing, not to mention difficult
    to test for correctness, expand, and maintain. In object-oriented terms, it makes
    more sense to write the solution to the problem as different classes whose


    # ## Multifaceted in Go


    In object-oriented programming, this process is known as polymorphism, which comes
    from the Greek word for "many forms." What this translates to is that an identifier
    (i.e., a variable containing an object) can accept instances of different classes
    that all use the same method. Although the methods trigger different actions as
    a function of the type currently in use, they have the same name and deliver the
    results in the same format. Unfortunately, Go is committed to strict typing, and
    the same variable can never store different types. This is where the Go interface
    type enters the scene; it determines which functions a variable of a specific
    type offers. Variables of type interface can then be stored in


    # ## One Plug for Every Task


    To allow the GMF parser in Listing 2 to collectively process the entries of different
    types, the parser defines the PluginInf type, starting in line 17; the type has
    three functions. Rep() callable() checks whether the plugin can actually process
    the current GMF entry from the meta file. If this returns true, the main program
    calls the plugin''s Expand() function to obtain an array of cloneable repositories.
    If false is returned, the main program moves on and tries the next plugin.


    What the call to Expand() does now depends on the plugin. The plugin for single
    entities with a repository URL and clone directory, like in line 1 of Listing
    1, just returns an array with a single element -- a variable of the Cloneable
    type containing these values. The code for this simple plugin is shown later in
    Listing 4. What all plugins have in common is that they offer a constructor (e.g.,
    NewGMFEntry()), which returns an object of the type in question that the main
    program can use later on to call the functions standardized in the interface.


