    the default fetch method is much more efficient. It''s recommended to only change
    the fetch method for individual watches where the default method doesn''t work.


    You can make this change in the *Request* tab of the watch settings by changing
    the *Fetch Method* to *Playwright Chromium/JavaScript via ''ws://playwright-chrome:3000''*.
    Save your changes and wait for the queued watch to be executed. If all goes well,
    the change detection watch works now. However, some websites (such as Amazon)
    detect that you''re visiting them with a bot, so they don''t show the desired
    content. You can check this by clicking on *Preview* next to the change detection
    watch. If you go to the *Screenshot* tab, you''ll see what the page looks like
    to the browser in the container, and this often shows a CAPTCHA. There are solutions
    for this problem, such as Bright Data''s (paid) Scraping Browser [8], but that
    is beyond the scope of this article.


