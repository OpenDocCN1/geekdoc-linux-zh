    Issue 290 / January 2024


    # # Alternative Office Suites


    Most Linux distributions come bundled with the LibreOffice suite, but Linux is
    all about choice, and a number of other options exist in the wild. If you’re getting
    restless and want to explore the contenders for word processing, accounting, and
    presentations, look for next month’s issue, where we study some of the leading
    office alternatives.


    +   Also inside:

    +   * Weather Cam

