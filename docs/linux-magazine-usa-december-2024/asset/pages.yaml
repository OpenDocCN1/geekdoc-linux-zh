  img_proc: true
- pgno: 38
  md: '+   • Z0_FZF_OPTS: Provides custom options to pass to fzf during interactive
    selection. Useful options include case-sensitivity, alternative ways of weighting
    directories in search results, and as-sorted display options. See man fzf for
    the list of options.


    +   • Z0_MAXAGE: Limits the maximum number of entries in the database. The default
    is 10,000.


    # ## Using zoxide


    All this lengthy configuration results in the basic use of Zoxide being simple.
    Type z PATH, and the final directory is added to the database. The next time you
    need to navigate to that directory, you only need to type z DIRECTORY, no matter
    how deep in the directory tree it is buried. For instance, if you type


    ```

    ```

    z /home/bb/creative

    ```

    ```


    next time you only need to type z creative. Once zoxide is set up, you can quickly
    add your most-used directories to the database and simplify your future navigation.
    When paths are similar, you can use z1 as the basic command or press Space + Tab
    to choose from a list (Figure 1).


    As the database is populated, zoxide will choose the highest ranked directory
    by default. You can change this behavior by searching for multiple directories
    in the path, or by specifying a subdirectory with /. In cd, you can also move
    up one directory with z . , or into the previous directory with z . . .


    For many users, no further information is needed. However, zoxide’s database can
    be edited by subcommands placed after the basic command:


    +   • zoxide add PATHS: Adds a path with a ranking of 1, or adds 1 to the ranking
    of a directory already in the database. After either, the last updated field of
    the entry is updated. Directories excluded by the Z0_EXCLUDE_DIRS environmental
    variable cannot be added.


    +   • This subcommand is a quicker way to add directories than letting zoxide
    learn from your navigation.


    +   • zoxide import --from FORMAT: The format is autojump or z for fasd, z.lua,
    or zsh-2.


    +   • zoxide-init: Automatically initializes a command shell to read it for use.
    This action can also be done manually in a text editor.


    +   • zoxide query KEYWORDS OPTIONS: Searches the database for keywords. Options
    for results are --all and --exclude PATH. With fzf installed, --interactive (
    -i) is enabled. With --list ( -l), all results are listed, not just the most used,
    while --score ( -s) lists rankings, which can be manipulated with zoxide-add.


    +   • zoxide remove PATHS: Deletes directories from the database. To permanently
    remove a directory from the database, specify it in the Z0_EXCLUDE_DIRS environment
    variable.


    Except for zoxide query, none of the subcommands return feedback.


    # ### Alternative Navigation


    If zoxide does not suit you, there are other cd replacements, including autojump,
    z.lua, and rupa.2. Many of these alternatives are structured similarly to zoxide,
    using a database and assigning directories a score based on frequency of use.
    Some, such as zsh, can be combined with zoxide during configuration.


    Data from some can be transferred to zoxide. Keep in mind that zoxide has the
    advantages of being simple to use and easy to learn.


    True, new users might wish for a zoxide installer to replace the complicated configuration
    process. More advanced users might wish for additional features, such as associating
    a directory with a particular application. However, once set up, zoxide in its
    current form is a substitute for cd that is only slightly more complicated. Users
    might want to make zoxide an alias of cd by adding alias z=''cd'' to their shell
    configuration file. With zoxide, users will save thousands of keystrokes, an improvement
    that is both efficient and economic. ■■


    # ### Info


    [1] zoxide: [https://github.com/ajeetdsouza/zoxide](https://github.com/ajeetdsouza/zoxide)


    # ### Author


    Bruce Byfield is a computer journalist and a freelance writer and editor specializing
    in free and open source software. In addition to his writing projects, he also
    teaches free and e-learning courses. In his spare time, Bruce writes about Northwest
    Coast art ([http://brucebyfield.wordpress.com](http://brucebyfield.wordpress.com)).
    He is also cofounder of Preamble Pieces, a blog about writing and fantasy at [https://preamblepieces.com/](https://preamblepieces.com/).


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_38_0.png)


    Figure 1: When directories contain similar names, zoxide provides a list of alternatives
    to select from.'
