  md: 'Method 2 (Red Hat) – init.d script: The backdoor calls up the command, the
    output from which is analyzed by Chkconfig, and attempts to execute it. If the
    command is found and executed correctly, it adds it to the PATH environment variable
    and continues with the actual persistence. The malware checks whether the file
    /etc/init.d/[SELF_FILE_NAME] exists and then writes the code from Listing 3 to
    it. If the file has not been created, it writes the same data to the /etc/ch.sh
    file and executes the following command:


    ```

    my /etc/ch.sh /etc/init.d/[SELF_FILE_NAME]

    ```


    The malware then executes the chadd 777 command for the created file and checks
    the persistence using the next call:


    ```

    chkconfig --list | grep [SELF_FILE_NAME]

    ```


    If the result does not contain 6:, the following two commands are used:


    ```

    chkconfig --add [SELF_FILE_NAME]

    chkconfig zentao [SELF_FILE_NAME]

    ```


    Method 3 (Red Hat) – rc.local: Persistence takes place via the file /etc/rc.d/rc.local.
    If the file exists, the backdoor checks whether its self path exists in the content
    – if not, it adds itself to the file with the \n[SELF_PATH]\n string.


    # Listing 3: Modify /etc/init.d[SELF_FILE_NAME]


    ```

    #!/bin/sh


    ### BEGIN INIT INFO

    # Provides: [SELF_FILE_NAME]

    # Required Start: $local_fs $network

    # Required Stop: $local_fs

    # Default Start: 2 3 4 5

    # Default Stop: 0 1 6

    # Short Description: [SELF_FILE_NAME] service

    # Description: [SELF_FILE_NAME] service daemon

    ### END INIT INFO

    [SELF_FULL_PATH] restart

    ```


    # Listing 4: Unique Computer ID


    ```

    Linux_[TIMESTAMP]_[MD5SUM]_[RANDOM_NUMBER]_v11

    Linux_20240910_11cb06d0bf4f9c43708a5266e3c601e1a6_04059_V11

    ```


    # Core Logic


    After the malware has executed correctly with two arguments, it moves on to the
    actual logic. First, it runs a series of checks, including root privileges, the
    path/folder, and the process ID of the calling daemon and saves them all in global
    variables. The backdoor then changes the timestamp of its file.


    ```

    touch -d "\"2010-09-08\"#1:23:23:02\"* [SELF_FILE_PATH]

    ```


    Now a configuration file based on the hard-coded string /etc/.netsc.conf is read.
    The configuration files for all examples are usually hidden files. From the configuration
    file, the malware attempts to read the [me] field under the para section. The
    field stands for the bot ID generated for the infected computer. If it is missing
    in the configuration file, a unique computer ID is generated on the basis of computer
    parameters in five steps. The first step is to determine the computer’s MAC address.
    The malware runs the ifconfig ip command and extracts the MAC address from the
    output; this depends on the distribution. The malware then calls the dmidecode
    command to obtain the system’s SMIIBIOS. After it has combined the MAC address
    and the output of dmidecode, it executes the md5sum command. Finally, in the fourth
    and fifth steps, the backdoor generates a random number and a timestamp based
    on the current time. All of the fields and an example are shown in Listing 4.
    After it is generated, the bot ID is saved in the configuration file and the configuration
    file timestamp is also changed, as with the executable file. The backdoor then
    enumerates the system to determine the distribution, the exact operating system
    version, and the system architecture. All of these values are stored in global
    variables and used later on when the backdoor contacts C2 for the first time.


    The hard-coded C2 address is parsed, stored in a global structure, and the malware
    reads two more configuration fields, mode and checkroot, from the para section.
    The mode field specifies the transport protocol to use: TCP or UDP. In contrast,
    the checkroot field determines whether the backdoor should monitor logged-in users.
    After the initial configuration, the backdoor generates several threads that are
    used for monitoring and cleaning up. It then initiates the connection to the C2
    server.


    # Monitoring and Cleaning Up


    The backdoor creates five threads that are tasked with system monitoring, downloading
    helper modules, and cleaning up old reverse shell connections. Thread #1 handles
    monitoring of the logged-in user. If the mode field in the configuration or the
    global variable for mode is set to 1, this thread monitors logged-in users with
    the who command. It analyzes the output and closes the C2 connection if the registered
    IP is not a local IP or the C2 IP. Thread #2 is responsible for monitoring the
    C2 connection status. Each time a valid request is made to the C2, the time field
    in the global C2 connection structure is updated. If half an hour has passed since
    the last request to the C2 server, the thread closes the connection to C2. Thread
    #3 downloads and sets up the filter module. The thread first uses a variable to
    check whether the module has already been downloaded. If this is not the case,
    the thread again carries out a few steps. It first checks whether the file [SELF_PATH].506
    exists and computes an Md5 hash of its content. It then sends an encrypted request
    to C2, in which it requests the Md5 hash of a module available on the C2 server
    and compares the received Md5 hash with the existing one. If the hash is different,
    the thread makes another request to C2 and saves the newly received file under
    the same name. In the second-to-last step, it reads the data from the /usr//11/b-sysgt4r.so
    file; this was probably stored at an earlier stage of the infection. This file
    should contain a series of values'
