  md: '(main-07.rs), the LED should blink much faster. This still uses the internal
    4MHz clock, but via a PLL, which increases the system clock frequency to 80MHz.
    If your board has an external crystal (usually 8MHz), you can use that as the
    primary clock source, and your system clock frequency will be much more stable
    (see below). However, using cortex_m::asm::del() is clock dependant, so its time
    to use a proper delay mechanism that runs from sysclk. This is shown in Figure
    7 (main-08.rs). In that version, the LED flashes at a more accurate one-second
    period.


    If you set the clock to 40MHz, you''ll notice that the code does not run. What''s
    going on? Let''s improve our panic handling to see if there is a panic occurring.
    Replace the line

    with


    ```

    use core::panic::PanicInfo;


    run

    panic!("testing panic handler");

    ```


    before the end of the loop, and add this panic handler at the end of the file:


    ```

    #[inline(never)]

    #[panic_handler]

    fn panic(_info: &PanicInfo) -> ! {

    ```


    ```

    rprintln!("{:}", _info);

    loop {}

    ```


    The modified version outputs something like this:


    ```

    panicked at /cargo/registry/src/index.crates.io-6f17d22bba15001f/crates stm32g4xx-hal-0.7.1/src/rc.rs:719:13:

    assertion failed: pllconf.n >= 8

    ```


    So you can see the PLL configuration is not correct, and an assertion in the clock
    configuration has failed. There are limits to the frequencies that can be generated.
    If you set the clock frequency to 64MHz, the code will run again. Note that the
    LED period stays the same – this is all sorted out internally. If you want to
    use an external crystal (usually an 8MHz crystal), which is known as the HSE clock
    source, you can set it up as shown in Listing 2.


    # Next Steps


    So far, I have created a very simple Rust program running on a microcontroller.
    I’ve dealt with clock configuration and toggling an I/O pin. The stm32l4xx hal
    repository [4] has an examples folder demonstrating how to set up and use the
    various I/O facilities of the STM32, such as I2C, SPI, UARTs, and USB. The crate
    documentation is another good source for details on how to use this library. The
    “Working with Legacy Code” box shows how to integrate old C code.


    # Memory Management


    If you try to use a String or Vec type, you’ll notice these are not available,
    as they are part of the standard library and I have disabled it with #[no_std].
    This leads to a thorny topic for embedded systems: memory allocation. Many projects
    avoid memory allocation altogether or restrict its use to initialization, as there
    is a risk of the heap becoming full or so fragmented that it cannot allocate any
    further space. In order to use strings and vectors in embedded Rust, you can use
    the alloc crate. This comes as part of the distribution, so there is no need to
    change Cargo.toml. However, if you use this crate and attempt to create a string
    like this:


    ```

    extern crate alloc;

    use alloc::string::String;

    let s = String::from("I am a string allocated on the heap");

    ```


    you will get a compile time error. You have to supply your own allocator, as the
    alloc crate only supplies the types, but no implementation of the heap allocator.
    The excellent Embedded Rust book [17] shows how to implement a simple allocator
    that never frees up memory. Of course, that might cause problems in some circumstances,
    but if you carefully instrument the allocation, it may work for you. Alternatively,
    you can look for a more sophisticated allocator at crates.io. I’ll give the simple
    approach a try. First, modify


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_59_0.png)


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_59_1.png)'
