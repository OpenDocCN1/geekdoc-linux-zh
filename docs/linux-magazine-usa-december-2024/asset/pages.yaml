    page, and clicking on the second one stops notifying you of changes, but keeps
    checking for them. A click on the Edit button opens the settings for the page’s
    change detection watch.


    # Basic Settings


    Before adding pages, I’ll first cover some of changedetection.io’s basic settings.
    After clicking on Settings at the top right, the General tab allows you to set
    the time between checks (the default is three hours), as well as other general
    settings. This is where you can set a password on changedetection.io. Click on
    Save at the bottom if you change any of the settings.


    In the Notifications tab (Figure 3), you define how changedetection.io sends you
    notifications when it detects a page change. You can leave this field blank if
    you’re content with regularly checking the watch list manually or if you monitor
    the changes in your RSS feed reader. But if you want faster notifications, set
    this up here.


    Changdetection.io uses Apprise [4] for notifications. Apprise is a library that
    supports sending notifications to more than a 100 popular services, including
    Telegram, Discord, Slack, Home Assistant, Kodi, Pushbullet, and email. For each
    of these services, Apprise defines a URL. I’ll use sending emails with Mailjet
    [5] as an example (for more examples, see the Apprise wiki [6]).


    Enter one or more Apprise URLs in changedetection.io’s Notification URL List.
    For Mailjet, this looks like:


    ```

    mailto://username:password@in-v3.mailjet.com/?from=Change&detection2@changedetection@example.com&to=koen@vervioesem.eu&mode=ssl

    ```


    This defines the notification as secure SMTP, with a username and password for
    login and a from and to email address in SSL mode.


    If you then click on Send test notification, you should receive a notification
    on all services you set up. If not, click on Notification debug logs and try to
    find out what went wrong. You can also change the title and body of the notifications,
    but the defaults are often fine.


    Don’t forget to click on Save at the bottom to save your notification settings.
    For now, you can ignore the other tabs of changedetection.io’s settings.


    # Adding a New Change Detection Watch


    If you want to monitor a specific web page for changes, you can simply add the
    URL in the text box at the top, under Add a new change detection watch. Optionally,
    add one or more tags (separated by a comma), and then click on Watch to add the
    watch with the default settings or Edit | Watch to edit the watch’s settings before
    adding it.


    By default, changedetection.io watches for web page text/HTML, JSON, and PDF changes.
    However, if you select Re-stock & Price detection for single product pages, the
    program looks for signs of a price or terms such as "in stock" or "out of stock,"
    which lets you watch for changes in prices or stock status. Note that this only
    works if the page covers one product.


    There’s also a Chrome extension [7] that works together with your changedetection.io
    instance. Just add it to Chrome, open your Changedetection.io’s Settings and go
    to the API tab. Then open the extension from the toolbar and click on Sync API
    Access. The extension then automatically configures itself to talk to your changedetection.io
    instance.


    On any page, you can now click on the extension icon in the toolbar, select whether
    you want to detect normal changes or stock and price changes, optionally add one
    or more tags, and click on Watch this website to add a change detection watch
    (Figure 4).


    # Change Detection Watch Settings


    If you click on Edit | Watch when adding a new watch or click on Edit for an existing
    watch, you can modify various settings specific to the change detection watch.
    In the General tab, you can change the title shown in the watch table (by default
    the full URL), the tags, and the time between checks if you want something other
    than the global settings. The Request tab allows you to adjust how changedetection.io
    fetches the web pages, which I’ll explain later. For general web page changes,
    there are settings to filter which parts of the


