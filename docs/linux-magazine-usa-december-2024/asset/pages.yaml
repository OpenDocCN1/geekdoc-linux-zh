  md: '# Anatomy of a Linux backdoor attack

    **Through the Back Door**


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_31_0.png)


    Cybercriminals are increasingly discovering Linux and adapting malware previously
    designed for Windows systems. We take you inside the Linux version of a famous
    Windows ransomware tool.


    By Thomas Boele


    Since the beginning of the year, security researchers from Check Point Research
    (CPR) have been investigating the activities of a Chinese cyber espionage threat
    actor focused on Southeast Asia, Africa, and South America. The toolkit for this
    threat actor includes the DinodasRAI [1] cross-platform backdoor, also known as
    XDealer, which was previously observed in attacks by the Chinese group known as
    LuoYu.


    This article provides technical analysis of the Linux version (v11) of DinodasRAI,
    aka Linodas. The Linux edition appears to be more sophisticated than the Windows
    version and has a range of features specially tailored to Linux servers. In


    ![](img/d6d2a4cd4a2f445e8c9e8079857e2469_31_1.png)


    **Figure 1:** Similarities in the function for identifying the operating system
    version between the Dinodas example (left) and the open source code. © Check Point
    Software


    Photo by David Svedendal on Unsplash'
