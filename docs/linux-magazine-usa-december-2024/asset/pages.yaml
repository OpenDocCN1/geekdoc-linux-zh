  md: "# Tampermonkey\n\nListing 1: manifest.json\n\n```\n{\n  \"manifest_version\"\
    : 2,\n  \"version\": \"1.0\",\n  \"name\": \"Hello World!\",\n  \"content_scripts\"\
    : [\n    {\n      \"matches\": [\"*://*.per1.org/*\"],\n      \"js\": [\"main.js\"\
    ]\n    }\n  ]\n}\n```\n\nListing 2: main.js\n\n```\nconst btn =\ndocument.createElement('button');\n\
    btn.textContent = \"ClickMe\";\nbtn.onclick = function() {\nalert(\"Hello World!\"\
    );\n}\nalert(\"JavaScript loaded!\");\ndocument.body.appendChild(btn);\n```\n\n\
    is called main.js (Listing 2). The script is located in the same directory as\
    \ the manifest file.\n\nThe script doesn't do much, but it illustrates very well\
    \ what is possible. You add a button to all pages matching the domain per1.org.\
    \ You also define a new JavaScript function to be executed when the button is\
    \ pressed. For simplicity, this function only executes the alert function.\n\n\
    Now you just need to load the extension into your browser. Open the link about:debugging#/runtime/this-firefox.\
    \ Click on the button Load Temporary Add-on and load the manifest.json file. From\
    \ now on, all pages from the domain per1.org opened with this browser instance\
    \ will contain a brand-new ClickMe button. You have successfully changed the DOM\
    \ and added a function that is\n\nexecuted when the user clicks the ClickMe button.\
    \ Look online if you're interested in learning more about creating extensions\
    \ [3] [4].\n\n# Extending the Browser\n\nIntegrating code into the DOM is easy.\
    \ Consider the classic \"Hello World\" example to demonstrate this process. You\
    \ need one file called manifest.json (Listing 1) and at least one program file.\
    \ manifest.json outlines several details, such as the plugin's name, version,\
    \ and, important to us, the URLs of the web pages where the plugin should be inserted\
    \ (in this case, all URLs of the domain per1.org).\n\nThe second file you need\
    \ contains the script you wish to inject. The script is defined in the js parameter\
    \ of the manifest.json file. In this example, the script\n\n# Permanence\n\nSo\
    \ far, the plugin you created is only temporary. When you restart the browser,\
    \ you have to load it again. With the help of the Node.js framework and a function\
    \ called use-ext, you can create a permanent extension. Now that you understand\
    \ the basic process, I'll show you an easier way to achieve the same result: using\
    \ an extension such as Tampermonkey [5].\n\n# How Tampermonkey Helps\n\nTampermonkey\
    \ lets you permanently load a user-defined extension into your browser. You can\
    \ use Tampermonkey to inject JavaScript code into the DOM to be executed in the\
    \ context of the loaded web page. Tampermonkey is based upon Greasemonkey [6],\
    \ which currently only works in the Firefox browser. Tampermonkey, on the other\
    \ hand, works with the most common web browsers, and it has a huge user community.\
    \ The examples in this article were produced on the Firefox web browser on Linux\
    \ Mint, but they work also on other browsers, as\n\n![](img/d6d2a4cd4a2f445e8c9e8079857e2469_42_0.png)\n\
    \nFigure 1: Tampermonkey asks you to accept privacy conditions."
  merge: -1
  img_proc: true
- pgno: 43
  md: "well as on other operating systems. You can also use different browser extensions\
    \ if they are available for your browser.\n\n# Installing the Tampermonkey Extension\n\
    \nTampermonkey is quite easy to install. In Firefox, select **Add-ons and themes**\
    \ then choose *Extensions* in the menu on the left. Search for Tampermonkey, and\
    \ click on the Tampermonkey icon to install. The provider of the extension asks\
    \ you to accept the necessary conditions regarding privacy (Figure 1); you should\
    \ read that text carefully then choose which permissions you give to the provider.\
    \ Monitoring network traffic, you will notice that the provider of the extension\
    \ is notified not only that you install his extension, but every time you use\
    \ it. Once you accept these conditions, the extension will install.\n\n# Let’s\
    \ Play\n\nWhen you open Tampermonkey for the first time, it kindly asks if you\
    \ will allow sending anonymous statistics about its usage home to its developer.\
    \ It is up to you whether you allow or disallow this. After that, you can write\
    \ a new user script. Click on **create a new script . . . .** . Tampermonkey creates\
    \ a skeleton for your new user script and displays it in the Tampermonkey editor.\
    \ You will find the same meta information you configured in the manifest file\
    \ in the previous example. I will reuse the \"`Hello World`\" example I created\
    \ before as a plugin. In Figure 2, you see the script, which you just need to\
    \ save using the menu that opens when you click on *File*. The result is the same\
    \ as before, which gives a certain confidence that what you did before is working\
    \ correctly.\n\n# Same Play with AI . . .\n\nFor a more challenging example, there\
    \ are people who prefer to access YouTube videos using the Invidious front end\
    \ [7]. Of course, Google is not happy about the presence of an alternative open\
    \ source front end for YouTube that doesn’t allow Google’s tracking, and they\
    \ have demanded that the developers take down Invidious. Over the past few months,\
    \ Google has been actively working to shut down Invidious, so by the time you\
    \ read this, this example might not give the result shown here. In this case,\n\
    \nFor a more challenging example, there are people who prefer to access YouTube\n\
    \n# Listing 3: Substitute YouTube Links\n\n```\n```\n// ==UserScript==\n// @name\t\
    \tReplace YouTube Links on DuckDuckGo\n// @namespace\thttp://tampermonkey.net/\n\
    // @version\t\t0.1\n// @description\tReplaces YouTube links with invidious.private.coffee\
    \ in DuckDuckGo search results\n// @author\tYour Name\n// @match\thttps://*.duckduckgo.com/*\n\
    // @grant\tnone\n// ==/UserScript==\n\n(function() {\n'use strict';\n\n// Function\
    \ to replace YouTube URLs with invidious.private.coffee\nfunction replaceYouTubeLinks()\
    \ {\nconst links = document.querySelectorAll('a[href*=\"www.youtube.com\"]');\n\
    links.forEach(link => {\nlink.href = link.href.replace(\n\"www.youtube.com\",\
    \ \"invidious.private.coffee\");\n});\n}\n})();\n```\n```\n\n![](img/d6d2a4cd4a2f445e8c9e8079857e2469_43_0.png)"
