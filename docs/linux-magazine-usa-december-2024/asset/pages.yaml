  md: 'answer. The button you press will determine how much time will pass before
    Anki shows you that card again. The intervals can be changed, of course, and you
    can change the status and many other parameters for each card in the More menu
    of Figure 4.


    Besides text and images, you can insert math formulas in your cards by typing
    them in Tex format (e.g., `\sqrt{x^{3}}`) to add the square root of x selecting
    that text, and pressing the button labeled fx in Figure 2. Anki will add the same
    type of content and equations, MathJax (which is integrated in Anki) would be
    a zero-setup solution more than adequate to the task.


    Its only problem is the one I already mentioned: Figure 2 actually creates one
    "Basic" note, that is a data structure which just by coincidence generates just
    one card with two sides, thus continuing (to-gether with the lack of current,
    clear documentation) to hide the true power of Anki.


    Until now, that is. I''ll show how to create a more sophisticated note that can
    generate two complex cards by entering the corresponding data just once. For simplicity,
    the data will be French-to-English word pairs, for a French language course.


    From the Anki main window click on Add, select **Basic (and reversed card)** as
    the note type, and then click on **Fields**, as shown in the top left of Figure
    5. In the **Fields** pop-up window (bottom-right corner of Figure 5), delete any
    preconfigured fields and add three new ones: one for French words, one for their
    English equivalents, and (just as example) one for the corresponding page of your
    French-to-English dictionary.


    Then, click on **Cards** to configure the templates of all the cards that Note
    type can generate. As you can see in the top-left corner of Figure 6, the note
    I chose has two card types: The first is for what I will call “direct” questions,
    which in my case would ask the English translation of a French word. The second
    would be for the “inverse” question, French terms for English words. For both
    card types, you must define what to show on the front and back sides. Looking
    at the **Back Template** panel of Figure 6, you can see that the back (the answer
    side of each card of this type) will have the same content as the front side,
    followed by a two-line answer containing the English


