    # ### Hallucinations


    If you believe the many videos and marketing texts on the Internet, AI wizards
    effortlessly pull complex code snippets in countless languages out of their hats.
    The providers try to undo each other in their claims. Refraction claims to support
    56 programming languages, and Codeium supports more than 70. It all sounds too
    good to be true. And, as anyone who has tried out the tools in a larger project
    will be aware, it often is.


    The AI wizards are capable of writing simple functions such as Bubblesort or the
    Euclidean algorithm from Figure 3 quite reliably. They will even provide new solutions
    or implement ideas that programmers might not have thought of. However, if you
    need more complex code, you will often only see unusable suggestions, some of
    which are not


    outputs also stick to the coding conventions of the rest of the document. AI coding
    thus goes far beyond conventional rule-based autocompletion.


    In order to autonomously complete a function, the wizards use the existing or
    surrounding code as a reference point. Tabnine [6] is based on both the signature
    of a function and on a comment above it. Programmers can use hint lines to steer
    the AI to the right results. Keep in mind that many providers don''t bother describing
    the working methods of their AI tools. In the case of Codeium (Figure 2), for
    example, it is unclear which lines the wizard takes into account when it generates
    code.


    Most AI tools don''t just rewrite source code; you can also explicitly ask them
    to solve a programming problem. You need to describe the task for the AI with
    a short statement to immediately see the matching code. For example, the AI wizards
    provide the complete code for sort algorithms or make suggestions relating to
    classes. Some tools, such as Refraction, can also derive a regular


    even recognizable as code (Figure 4).


    Problems of this kind are due to the way the AI tools work: The source code of
    neural networks is generated in the background, usually in the form of Large Language
    Models (LLM). The programming wizards therefore use the same technology that powers
    ChatGPT. Unlike ChatGPT, however, the neural networks are not simply trained with
    everyday knowledge from Wikipedia but with existing source code. Tabnine and some
    of its competitors also offer to customize the resulting models for their customers.
    To do this, they train their models with the private source code of the customer.


    In all cases, the neural networks will always suggest the kind of source code
    that they believe is most likely to match the existing code. But when faced with
    complex code, the AI wizards tend to go haywire. The resulting suggestions sometimes
    consist of confusing instructions or are no longer fit for the purpose, although
    the code might require closer inspection to discover these issues (Figure 5).


    Worse still: The generated source code can contain errors and security vulnerabilities,
    for example, if the AI recommends the use of an outdated API. The self-confidence
    that


