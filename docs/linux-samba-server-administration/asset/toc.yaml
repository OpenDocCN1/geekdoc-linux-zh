  - print command
- - '###'
  - print command 参数将作业发送到打印机的命令。默认值取决于 `printing` 参数，大多数 Linux 系统使用 BSD 或 LPR。你可以调整此参数来实现不同的类型。
- - '###'
  - 在输出中，`%s` 是相应的命令。`%p` 和 `/j` 分别引用打印机名称和作业号。
- - '###'
  - pause command
- - '###'
  - pause 命令在客户端上暂停作业。在 Linux 上，通常通过设置极低优先级来实现不同的系统之间存在差异。此参数的默认值为空（未指定命令）。
- - '###'
  - lpr command
- - '###'
  - lpr command 指定客户端请求删除作业时，使用 `%p` 和 `/j` 引用打印机名称和作业号。默认值取决于 `printing` 参数。
