    Once you have the ISO and the universal installer you want to make sure you have
    the USB stick plugged into the computer and reading. Next you want to double click
    on the universal installer to start it up. From there you will be presented with
    a visual interface of he installer.


    In the dropdown menu you want to click on the distribution of Linux you downloaded.
    After completing this step you will be presented with the browse button. Click
    on the browse button and navigate through your computer to the location where
    you have downloaded the ISO Linux file. Click on the file and select `OK`.


    When you complete this step you will now see that the file is active in the software.
    Next you want to select the location of the flash drive. In the little dropdown
    box select your flash drive letter. If no letter is showing make sure that it
    is plugged into your computer and functioning.


    When your drive is selected you will see an option to format the drive. This is
    a good idea to select this box. Formatting the drive will remove any data from
    the drive making it clean and usable. This is an optional step but one I suggest
    that you use. If you have data on the USB stick you don’t want to lose I strongly
    suggest backing it up or purchasing a separate USB drive specifically for this
    task.


    Once completed click next. You will then be presented with a warning screen that
    will tell you that it will now install your Linux distribution. Click `OK` and
    Linux will be installed on the USB drive.


    The second method is to download the software to a CD or DVD. The process is virtually
    the same as above but instead of using the USB program you just need to burn the
    ISO files to the CD or DVD.


    ## Running from a CD or USB


    To run your copy of Linux you will need to reboot your computer and boot to the
    USB or the CD. Then you will be able to install and run the software.


    The third and most popular way to run Linux on your computer is through a virtual
    machine. A virtual machine is a piece of software that you run on your existing
    computer that creates a virtual copy of the operating system of your choice.


    This is the most popular since it allows you to do everything a fresh install
    would do but protects your current computers operating system and file.


    ## Choosing your distribution of Linux


    When it comes to choosing your distribution of Linux there is no easy solution.
    It is highly recommended that you download several different versions and install
    them on your computer via the virtual machine method discussed above. This way
    you can play with each version and see if it meets your needs.


    The most popular version is Ubuntu and is my personal recommendation for people
    starting out or switching from Windows or Mac operating systems.


    To get a listing of different Linux distributions you can do a simple Google search
    or visit `http://lwn.net/Distributions/` which will give a listing of the most
    popular distributions.


    Now that we have a basic introduction to Linux and how to get it installed on
    your computer let’s jump right in and start seeing what Linux can do and how it
    works.


    # Chapter 2 – Using Linux


    Now that we have everything up and running let’s talk about how to use Linux.
    If you are a current computer user I can assume that you have used an operating
    system such as Windows or OS X. These operating systems work off of a file structure
    system.


    The file structure system starts you off with a drive letter such as `C`, `D`
    or `E`. From there you have what is known as folders or directories. In each of
    these folders or directories you have additional folders, directories and now
    files. When we look at the Linux file structure it is setup differently and may
    take a little getting used to. In Linux we have a tree file structure. In this
    structure we begin with the roots or the root directory as it were.


    From the root we expand out up the trunk and into the branches. If you look at
    the structure of a tree you will have a clearer visual picture of the file structure.


    With the implementation of this tree structure we no longer have directories,
    folders and files. We are now only left with files. Everything that we see and
    interact with is a file. This even includes the physical hardware that we interact
    with such as a keyboard, mouse, printer and other.


    ## Types of files


    When dealing with Linux we the files system we have several file variations. The
    first variations are the General Files.


    General files are the files such as Images, Video, Audio, Software Programs and
    even ordinary text. These files are either formatted as `ASCI` or `Binary` and
    are the most common files you will be associating yourself with while using Linux.


    The next set of files are the directory files. These can be best associated as
    file folders in Windows but they act is a slightly different way. With directory
    files they are a warehouse for other file types.


    ## Comparing Windows File System to Linux Directory System


    **Windows** – In Windows the files on your computer are stored in a drive letter
    titled `C:`


    **Linux** – In Linux you won’t see drive letters. What you will see are directories.
    So for the `C:` drive ebullient in Linux you will see a folder called `File /
    System`


    **Windows** – In Windows you will see the drive letter for your CD or DVD Rom.


    **Linux** – In Linux you will see a file folder titled `CD Linux`


    **Windows** – In windows you will find your programs that you install under the
    `Program Files` directory.


    **Linux** – In Linux you will find your program files under the `BIN` directory.


    ### Device Files


    The last types of files we have in Linux are the device files.


    **Windows** – In Windows all of the devices are represented by Drive Letters such
    as `C`, `D`, `E`, `F`, and etc.


    **Linux** – In Linux all devices are represented as files and reside in the `DEV`
    directory.


    ## Working with Files


    When working with files you need to realize that each file will be given a specific
    permission. These permissions will allow Linux to either read, write or execute
    the commands within that particular file. Access to any specific tile can be given
    on a per user, per file basis. This is what gives Linux its power and flexibility.


    Now that we have talked about how Linux works and how you can expect to navigate
    through Linux lets talk about users and user accounts, permissions and usability.


    ## User Accounts


    User accounts are accounts that you create or are created for you by Linux when
    you first start using Linux. These accounts are managed by permissions that will
    allow you as the user to perform specific tasks and functions.


    User accounts are created in order to protect sensitive information and data that
    inexperienced users should not access and possibly delete as well as create protected
    areas keeping information and programs separated if multiple users us that computer.


    ## Regular User


    The regular user is the user that is automatically created when you install Linux.
    This regular user has open control over the system and can install, delete and
    modify files.


    As a regular user you only have access to your own personal user account and can’t
    access user accounts of others unless you have authentication privileges such
    as usernames and passwords.


    ## Root User


    The Root User or Administrator Users as it is called in Windows is automatically
    generated when you install Linux. The Root User has unrestricted access to the
    entire system and can even modify the core kernel of Linux if so desired.


    ## Service Users


    Service users are users created only when you run Linux as a web server. This
    allows you to have multiple users on a shared hosting plan. Since this is an advanced
    user and not supported on Desktop versions of Ubuntu we will not focus on this
    particular user.


    ## Filename Conventions


    Filenames are used to determine what exactly it is that you are using. For example
    if you have a file called `dog_names.txt` the file name is `dog_names`.


    ## Windows

