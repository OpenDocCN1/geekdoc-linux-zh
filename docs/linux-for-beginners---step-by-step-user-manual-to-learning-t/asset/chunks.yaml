    在 Windows 环境下，你不可以在同一个文件夹中拥有两个同名文件。如果你这样做，Windows 会自动在文件名末尾分配一个数字，生成一个不同的文件名。


    这条规则唯一的例外是文件具有不同的扩展名。这可以是像 `dog_names.txt` 和 `dog_names.jpg`。从表面上看它们的文件名相同，但实际上由于文件扩展不同，它们是不同的文件。


    ## Linux


    在 Linux 中，你可以拥有两个相同的文件。唯一的要求是文件需要区分大小写。例如，`DogNames` 和 `dognames` 会被视为不同的文件，尽管它们的名称相同。


    ## 用户目录


    用户目录是允许每个用户存储其用户账户所需的所有文件的地方。在 Windows 中，你可以将文件放置在 `C:` 盘的任何文件夹或目录中。但在 Linux 中，你将有一个名为
    `/home/username` 的特定文件夹。


    `/username` 是你用户账户的名称。例如，如果你创建了一个名为 `John Smith` 的用户账户，那么你的用户目录将类似于 `/home/johnsmith/`。


    ## 命令行对比图形用户界面（或 GUI）


    当使用 Linux 时，最频繁的操作是处理文件。这包括读取、写入和执行。在 Linux 中，你有两种不同的方式与文件交互。


    一种是通过命令行界面，你必须输入所有你想让 Linux 执行的操作内容；或者你可以使用 GUI（图形用户界面），它看起来像 Windows，并且是一种非常流行且易于用户与
    Linux 交互的方式。


    ## 命令行


    刚开始使用命令行界面非常灵活，它允许你执行许多 GUI 界面中无法提供的命令和选项。仅凭这一点，我强烈建议你学习命令行界面。


    在许多情况下，命令行可以比 GUI 更快。例如，如果你在命令行界面中，只需一条命令行即可创建一个新用户账户。而在 GUI 中，完成相同任务可能需要五或六个步骤。


    在移动大量文件时，命令行赋予你更大的力量。在 Windows 中，你可以轻松地选择大量文件并将它们拖动到目标位置。


    在 Linux 的 GUI 版本中，你需要一次移动一个或两个文件。这就是命令行将为你提供类似 Windows 拖放功能的地方，但它是通过命令行界面实现的。


    总的来说，命令行速度更快。使用 GUI 界面时，向系统加载了大量的资源和数据，这使得它比命令行慢。因此，如果你在追求额外的速度和灵活性，使用命令行界面是更好的选择。


    ## GUI 界面


    涉及到 GUI 界面时，你可能会在执行视觉密集型任务时使用它。这可以是编辑视频和音频、处理照片以及其他更倾向于视觉辅助的任务。


    使用 GUI 界面时，你从 Windows 或 Mac 等操作系统中学到的许多相同技能都可以适用。出于这个原因，我们在这书中更多地关注命令行界面，这样你就能对
    Linux 的核心建立基础并有更好的理解，从而让你能够充分发挥它的作用。


    ## 使用命令行界面


    在操作 Linux 时，命令行界面可能看起来很可怕且复杂。如果你在 20 世纪 80 年代后期 Windows 开发之前用过 Microsoft Dos，你将会感到很亲切熟悉。然而，如果你从未用过
    DOS，这可能会有一点挑战性。


    命令行背后的原理与图形界面是相同的。例如，当你创建一个新文件时，你输入命令行的命令与你点击一系列按钮时执行的命令是相同的。唯一的区别在于你不需要碰键盘。


    在我深入介绍命令行的过多细节之前，我想先给你上一上通用的计算机课程。


    当我们观察计算机时，它是通过给一组命令来运行的。例如，如果你想复制一个文件，你会使用 `copy` 这个词。如果你想删除一个文件，例如你会输入 `delete`。人们感到害怕是因为不知道该复制什么、删除什么，以及做错了。


    首先，在处理计算机时有一个参考的简单公式。这是一个无论你使用何种操作系统都有效的标准公式：`命令 + (位置 / 文件) 到 目的地`


    例如，你想从计算机复制一个文件到软磁盘或光盘。基本概念是 `(Computer/file to Destination)`。假设文件是 `Dog.txt`。该命令将是——`c:\dog.txt
    e:`


    `C:\` 是目标文件的位置。

    `Dog.txt` 是文件名。

    `E:` 是你想让文件去往的地。


    现在加上命令。如果你想复制一个文件，你应该这样做：`Copy c:\dog.txt e:\`


    如果你想把狗文件复制到 E: 盘上的一个目录，你只需要稍微修改一下。`Copy c:\dog.txt e:\directory_name`


    这就是涉及计算机的基本原理。不过，命令在不同的操作系统之间可能会略有不同，但核心基础是相同的。


    ## 现在回到 Linux。


    在 Linux 中，命令行被称为 `Terminal`（终端）。终端允许你轻松地输入命令并查看结果。当你在 Linux、Windows、Mac 或任何其他操作系统中打开终端时，它看起来是一样的。它是一个黑底白字的屏幕。你会看到一段文本，后面跟着一个符号，如
    `\` 或 `>`。


    在 Linux 中，你的命令行有一个特定的结构。根据使用命令行身份，结尾可能会略有不同。


    `Usrename@hostname:~$`


    现在根据你的具体情况，这可能会不同。但核心思想是相同的。例如，如果你的用户名是 John，你的计算机名为 office，那么你的命令行看起来像这样：`john@office:~$`
    或 `john@office:~#`


    `Username` – 这是你在计算机上自称的名称。这是在第一次安装 Linux 时生成或选择的内容。

    `Hostname` – 这是主机名或计算机名。在设置网络或尝试连接两个或多台计算机时，你需要给它起一个网络名称。主机名就像计算机本身的用户名。

    :` – 冒号只是一个分隔符，没有其他作用。

    `~` – 波浪号表示你正处于主目录。

    `$` – 美元符号表示你是系统上的普通用户。

    `#` – 井号表示你是管理员或 root 用户。


    ## 当前工作目录


    当前工作目录（Present working directory）是指你当前正在操作的目录。默认情况下，你处于主目录中。要检查你当前所在的工作目录，你需要在命令行中输入以下命令：


    `pw`


    一旦输入了该命令，按下键盘上的回车键。默认情况下，你位于主目录，所以你应该看到一行类似于 `/home/username/` 的内容。


    如果你离开了主目录，你也会知道。每当你需要知道自己在命令行界面中的位置时，请使用此命令。


    ## 切换目录


    当你在一个目录中并想要移动到另一个目录时，你会想要 `CD` 命令。`CD` 代表 Change Directory（切换目录）。例如，如果你想切换到 `tmp`
    目录，你只需要输入 `cd /tmp` 并按回车即可。


    '
- fmt: '

    Now of course the desired directory needs to exist and be within the tree structure
    but presuming that it does you will be able to move in and out of directories
    easily. Now, if you remember what I was talking about previously in the above
    section about Dos Commands you will see that the Linux commands are pretty much
    exactly the same.


    To return to the home directory you want to type `CD ~` and hit enter.


    To return to the Root directory or main directory you need to type `CD /`.


    Remember the root directory is the same as `C:` in Windows.


    To navigate multiple directories at a time you can easily do this as well. You
    will need to know the file path structure to ensure that they exist or you will
    get an error. To do this you would just add on to the current command.


    ```bash

    Cd /john/documents/Friday/homework

    ```


    To move back a directory all you would need to type would be `cd ..`


    ## Understanding path in Linux


    When working in an operating system such as Windows for example you would have
    a path that looked like this: `c:/windows/documents`.


    In Linux you would have the same setup but it would look like this: `Home\john\bin\`.


    When working with paths you need to understand that there are two types of path
    in Linux. The first is the Absolute and the second is the Relative. Let’s explore
    these in more detail.


    ## Absolute Path


    The absolute path is the exact path that a file can be found. For example if you
    want to find the files in the pictures directory you would do something like this.


    ```bash

    Cd /home/user/pictures

    ```


    ## Relative Path


    The relative path is very handy when you are in the directory structure and don’t
    want to type the entire path. So for this example you would just need to type
    the following command to get to the pictures director.


    ```bash

    Cd /pictures/

    ```


    This would bring you into the pictures directory.


    As you can see it is fairly easy to navigate through Linux. If you are familiar
    with DOS in any way then this should be second nature. From what I have taught
    you so far you now have the power to master using the command line in Linux. In
    the next section I am going to go over the command that you need to learn in order
    to perform specific tasks and get the most out of your Linux installation.


    ## The Most Needed Linux Commands


    Check a list of files on your computer you will want to use the `LS` command.
    This is similar to the `DIR` command in Dos. When look at the results form the
    `LS` command you will see two different colors.


    You will have a blue color and a white color to the text. The blue color are the
    directories and the white words are the files contained within those specific
    directories. Depending on the specific distribution of Linux these colors may
    differ.


    ```bash

    LS – R

    ```


    The `LS – R` command is used to list all of your files in the current directory
    you are in as well as all other sub directories.


    ```bash

    LS – AR

    ```


    This command will give you more details about the files you are working with.
    It will give you things such as creation date, file size and more.


    ## Hidden Files


    In Linux and other operating systems there will be times that the operating system
    wants to hid files for protective purposes. These files are shown with a `.` in
    front of them. These files will not be displayed with the default `LS` command.
    To see these files you will want t use the following command


    ```bash

    LS – A

    ```


    ## Creating and Viewing Files


    Now that we were shown how to look for files on the computer in Linux let’s jump
    into creating and viewing files which will be a main feature in your use of Linux.


    ## The CAT Command


    In Linux we use the `CAT` command in order to work with files. The `cat` command
    allows us to display, copy, combine and create text files. Let’s create a new
    file called `dogs`.


    To do this type the following command into the terminal command line.


    ```bash

    Cat > dog

    ```


    Once done hit enter. Linux will then drop down one line allowing you to start
    entering in the contents of that file. Go ahead and start writing whatever you
    want to be contained within this file.


    Once you are done entering in your text you will want to save the file by pressing
    the `CTRL D` on your keyboard.


    Once done you will be taken back to the command prompt.


    To view the contents of a file you just need to type in the `cat` command and
    the name of the file. So for this example it would look like this.


    ```bash

    cat dog

    ```


    this will then print the contents you wrote in the `dog` file.


    ## Combining two files together


    When working with multiple files you may want to combine the contents of these
    files into a single file. To do this you would use the following command.


    ```bash

    Cat file1 file2 > file3

    ```


    When you hit enter you will be returned to the command line. This is normal. With
    Linux you are working in silent mode. This means that you won’t see a result like
    you would in Windows. You only see a message when you get an error.


    To see if it worked you will need to view the new file. Just repeat the same process
    by typing in `cat` and the new file name you created. Also, this only works when
    creating and working with text files. It does not work with any other file format.


    ## Deleting Files


    When working in Linux you will have need to delete files that you no longer want.
    Again, when deleting files you will not receive a confirmation message so make
    sure you are sure you are deleting the correct file.


    To delete files you will want to use the `rm` command.


    ```bash

    rm filename

    ```


    When done you will be returned to the terminal


    ### Moving Files


    When moving files you will need to have root or super user permissions to do this.
    If you are a root or super user you will just need to enter in `mv` as the command.
    If you are not a root or super user you will need to use the super command `sudo`
    in front of your commands to execute them. When using the `sudo` command however
    you will be asked for the root password. This is a safety and security measure.


    ```bash

    mv file destination

    ```


    or


    ```bash

    sudo mv file destination

    ```


    Let’s move the file `dog` to the `cats` directory.


    ```bash

    Mv dog /home/user/destination

    ```


    Or


    ```bash

    Sudo mv dog /home/user/destination

    ```


    When working with files like this Linux will also keep a log of all the activity
    that has been performed on the terminal. This is useful for administrators to
    keep track of what users are doing and when.


    ## Renaming Files


    When working with Linux you will want to sometimes rename files that you have
    been working on. To do this you will use `mv filename newfilename`


    ## Creating Directories


    When working with your computer you will want it to be kept nice and clean. You
    can do this by creating new directories in which to store your files. To do this
    you will use the `mkdir` command. This is the same command you will use in DOS.


    So for example if you want to make a directory called `chew toys` you would type
    in the following command.


    ```bash

    Mkdir chew toys

    ```


    ### Creating multiple directories at the same time


    If you wanted to create several different directories at the same time you would
    use the following command.


    ```bash

    Mkdir dir1 dir2 dir3

    ```


    and so on. To create a directory within a different directory than you are currently
    in you would use the absolute path stating the path for the directory location.


    ```bash

    Mkdir /home/photos/john

    ```


    To remove a directory you will want to use the `rmdir` command.


    ```bash

    Rmdir photos

    ```


    This command will remove the photos directory. When removing directories you will
    want to ensure that they are clear of sub-directories and files first or this
    command will throw back an error.


    Now these are just a few of the command that you can use in Linux. There are hundreds
    of these commands and to go through them all would take years. However there is
    a built in manual in Linux that you can use to get information about your commands.
    This command is `MAN`.


    To use this command you will just need to type in `man` and the command you want.


    *   `man ls`

    *   `man mkdir`


    And so forth.

