    # Introduction


    The world as we know it is now run and controlled by computers.  Computers allow
    us to perform tasks quickly, easily and more efficiently than any time in history.  


    With a computer we can write books like this one, we can play games, keep track
    of important data such as bank records, personal photos or even play games that
    entertain us for hours on end.


    When it comes to computers they are just connected pieces of hardware that work
    together to process information.  At their core they do very little without the
    user interaction of humans.


    When we look at a computer we see that we have a visual interface that allows
    us to perform specific tasks and functions.  This visual interface can either
    be text based, where we type in commands in order to get a response or a visual
    interface or GUI that allows us to use a mouse or other device to visually interact
    with the computer.


    This interface is known as the operating system and every computer needs one. 
    The most popular operating system in the world is Microsoft Windows.  Windows
    is a visual interface that allows us to do everything that I discussed here earlier
    plus a lot more. 


    However windows doesn’t do everything and in fact isn’t designed for specific
    jobs.  There is however an operating system that will do everything as well as
    allow you, if you’re a programmer to create your very own operating system.  This
    software is called Linux.


    Linux is a clone of another operating system known as Unix.  Unix however is specifically
    designed to run on mainframes and university computers where Linux is more of
    a web hosting and development environment.


    In this book we are going to explore Linux and its core features.  We will talk
    about the different distributions of Linux, how to install it and what exactly
    you can do with it.  At the end of this book you will have a good understanding
    of what Linux is and be on your way to playing and creating with this robust operating
    system.


    # Chapter 1 – Linux 101 – Getting and Installing your New OS


    Linux comes in a wide variety of different distributions.  Each distribution builds
    off the core programming or kernel.  Each distribution of Linux is built to do
    specific tasks and functionality.  Deciding on which exact distribution of Linux
    to choose may take some time but the best part about it is that they are all FREE.


    When we look at this operating system we are working with a FREE and open source
    piece of software.  This means that anyone can take it, edit it, and even if they
    have the skills required create their own version of the operating system.


    ## Installing Linux


    Before we get into the different version of Linux lets talk about what you need
    and how to get started.  Each distribution of Linux can be installed the same
    way.  The basic equipment that you will need is a computer and a USB stick with
    the Linux distribution of your choice.


    The first thing that you will want to do is go to the web site for your selected
    distribution.  For example if you want Ubuntu you can go to their site from this
    address.


    [http://www.ubuntu.com/download/desktop](http://www.ubuntu.com/download/desktop)


    The file you will download will be an ISO file.  Save this file to your hard drive. 
    The next step will be to download the universal USB installer.  You can do this
    by visiting the following web site.


    [http://www.pendrivelinux.com](http://www.pendrivelinux.com)'
