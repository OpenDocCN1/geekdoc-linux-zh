- fmt: '

    In the Windows environment you are not allowed to have two files with the same
    name in the same folder. If you do Windows will automatically assign a number
    to the end of the file generating a different filename.


    The only exception to this rule is if the files have different extensions. This
    can be something like `dog_names.txt` and `dog_names.jpg`. On the surface it appears
    that they have the same file name but in reality they are different because of
    the file extension.


    ## Linux


    In Linux you can have two files that have the same name. The only requirement
    is that the files need to have different cases. So for example `DogNames` and
    `dognames` would be considered different files even though they are named the
    same.


    ## User Directory


    The user directory is the location where each user will be allowed to store all
    of the files that they use for their user account. In Windows you can place files
    anywhere on your `C:` in any folder or directory. In Linux however you will have
    a specific folder called `/home/username`.


    The `/username` is the name of your user account. So for example if you created
    a user account of `John Smith` then your user directory will be something like
    `/home/johnsmith/`.


    ## Command Line V.S. Graphical User Interface or (GUI)


    When using Linux the most performed action is dealing with files. This will be
    reading, writing and executing. With Linux there are two different ways that you
    can interact with files.


    This is through the command line interface where you have to type out everything
    that you want Linux to do or you can use the GUI or Graphical User Interface which
    looks like Windows and is a very popular and user friendly way of interacting
    with Linux.


    ## The Command Line


    To start out with the command line interface is very flexible and allows you to
    do a wide range of commands and options that are not available in the GUI interface.
    For this reason alone it is highly recommended that you learn the command line
    interface.


    The command line can be faster in many cases compared to the GUI. For example
    if you are in the command line interface you can create a new user account with
    a single command line. In the GUI it would take you five or six steps to complete
    the same task.


    With the command line you have more power when moving large numbers of files.
    In Windows, you can easily select a large number of files and drag and drop them
    to their destination.


    In the GUI version of Linux you will need to move files over one or two at a time.
    This is where the command line will give you the power of the windows drag and
    drop but with the command line interface.


    The command line interface is overall faster. With the GUI Interface you are lading
    a lot of resources and data into the system which makes it slower than the command
    line. So if you are looking for additional speed and flexibility using the command
    line interface is the way to go.


    ## The GUI Interface


    When it comes to the GUI Interface you will want to use this when performing visually
    intensive tasks. This can be editing video and audio, working with photos, and
    other tasks where visual assistance is preferred.


    When using the GUI interface many of the same skills you learned from using operating
    systems such as Windows or Mac can be applied. For that reason we will focus more
    on the Command line interface here in this book so that you can have a foundation
    and better understanding of the core of Linux which will also allow you to get
    the most out of it.


    ## Using the Command Line Interface


    When working with Linux the command line interface may seem scary and complicated.
    If you have ever used Microsoft Dos back in the late 1980’s before the development
    of Windows you will have a comfortable familiarity. If however you have never
    used DOS before this may be a little challenging.


    The basis behind the command line is just the same as the graphical interface.
    For example, when you create a new file the command hat you type into the command
    line is the same one that is being executed when you click on a series of buttons.
    The only difference is you don’t touch the keyboard.


    Before I get into too much detail about the command line I wanted to give you
    a quick computer lesson in general.


    When we look at a computer it is run by giving it a set of commands. For example
    if you want to copy a file you would use the word `copy`. If you wanted to delete
    a file for example you would type `delete`. Where people get scared is knowing
    what to copy and what to delete and doing it wrong.


    First of all there is a simple formula that you can look at when dealing with
    computers. This is a standard formula that is true no matter what operating system
    you use. `Command + (location / file) to Destination`


    So for example you wanted to copy a file form your computer to a floppy disk or
    CD. The basic concept would be `(Computer/file to Destination)`. Let’s say the
    file is `Dog.txt`. This would be the command – `c:\dog.txt e:`


    The `C:\` is the location of the desired file.

    `Dog.txt` is the name of the file.

    `E:` is the destination where you want the file to go.


    Now you add in the command. If you want to copy a file this is what you would
    do. `Copy c:\dog.txt e:\`


    If you wanted to copy the dog file to a directory on the E: drive you would then
    change it up a little. `Copy c:\dog.txt e:\directory_name`


    Now this is the basic principal when it comes to computers. The commands however
    may differ slightly between operating systems but the core foundation will be
    the same.


    ## Now back to Linux.


    In Linux the command line is called the `Terminal`. The terminal allows you to
    easily enter in your commands and see results. When you open the terminal in Linux,
    Windows, Mac or any other operating system it will look the same. It will be a
    black screen with white text. You will have a bit of text followed by a symbol
    such as `\` or a `>`.


    In Linux you will have a specific structure to your command line. Depending on
    the role of the person using the command line the ending may be slightly different.


    `Usrename@hostname:~$`


    Now depending on your specific situation this may differ. However the core idea
    is the same. For example if your username was John and your computer was named
    office your command line would look like this. `john@office:~$` or `john@office:~#`


    `Username` – This is what you call yourself on your computer. This is what is
    generated or you select when first installing Linux.

    `Hostname` – this is the hostname or computer name. When setting up a network
    or trying to connect two or more computers together you will need to give it a
    network name. A hostname is just like a username for the computer itself.

    :` – the colon is just a separator and serves no other purpose than that

    `~` – the tilde signifies that you are in the home directory.

    `$` – The Dollar sign signifies that you are a regular user on the system.

    `#` – The hashtag signifies that you are an administrator or root user.


    ## Present Working Directory


    The present working directory is the current directory that you are working in.
    By default you are in the home directory. To check your current present working
    directory you will want to type in the following command into the command line.


    `pw`


    Once you have typed that hit enter on your keyboard. By default you will be in
    the home directory so you should see a line that looks like `/home/username/`


    If you are out of your home directory you will know this as well. Use this command
    whenever you need to know where you are in the command line interface.


    ## Changing directories


    When you are in a directory and want to move to another directory you will want
    to use the `CD` command. `CD` stands for Change Directory. So for example if you
    wanted to change to the `tmp` directory all you would do is type `cd /tmp` and
    hit enter.

