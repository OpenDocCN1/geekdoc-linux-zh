    \ 是按钮被点击时发出的信号。\n- `on_button_clicked()` 是响应按钮点击而执行的槽函数。\n- `button.clicked.connect(on_button_clicked)`\
    \ 建立了信号和槽之间的连接。\n\n### 3. 事件处理\n\n信号和槽对于处理 PyQt 应用程序中的各种事件至关重要：\n\n#### 鼠标事件：\n\
