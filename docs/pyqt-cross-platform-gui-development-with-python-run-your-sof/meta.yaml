    ## 主要特性：\n\n- **富文本编辑：** 支持富文本格式，包括**粗体**、*斜体*、下划线、字体更改和颜色。\n- **撤销/重做：** 提供文本编辑的撤销和重做功能。\n\
    - **查找和替换：** 允许用户在编辑器中搜索和替换文本。\n- **信号：** 当编辑器中的文本被修改时，会发出诸如 `textChanged()` 之类的信号。\n\
    \n## 示例：\n\n```\nPython\nfrom PyQt5.QtWidgets import QApplication, QWidget, QTextEdit,\
    \ QLabel\n\nif __name__ == '__main__':\n    app = QApplication([])\n    window\
    \ = QWidget()\n    window.setWindowTitle(\"QTextEdit Example\")\n\n    text_edit\
    \ = QTextEdit(window)\n    text_edit.setGeometry(50, 50, 300, 150)\n\n    label\
    \ = QLabel(\"Text entered:\", window)\n    label.setGeometry(50, 220, 200, 30)\n\
    \n    def on_text_changed():\n        label.setText(\"Text entered: \" + text_edit.toPlainText())\n\
    \n    text_edit.textChanged.connect(on_text_changed)\n\n    window.show()\n  \
    \  app.exec_()\n```\n\n本示例演示了如何创建 `QTextEdit` 控件，连接其 `textChanged()` 信号，并在标签中显示输入的文本。\n\
    \n## 3. QComboBox：创建下拉列表\n\n- **用途：** `QComboBox` 提供一个下拉选项列表，供用户从中选择。\n\n## 主要特性：\n\
    \n- **选项：** 可以容纳一组选项（字符串、图标或自定义对象）。\n- **当前索引：** 跟踪当前选中的选项。\n- **可编辑：** 可以配置为允许用户输入自定义值。\n\
    - **信号：** 当所选选项发生变化时，会发出诸如 `currentIndexChanged()` 之类的信号。\n\n## 示例：\n\n```\nPython\n\
    from PyQt5.QtWidgets import QApplication, QWidget, QComboBox, QLabel\n\nif __name__\
    \ == '__main__':\n    app = QApplication([])\n\n    window = QWidget()\n    window.setWindowTitle(\"\
    QComboBox Example\")\n\n    combo_box = QComboBox(window)\n    combo_box.setGeometry(50,\
    \ 50, 200, 30)\n    combo_box.addItems([\"Option 1\", \"Option 2\", \"Option 3\"\
    ])\n\n    label = QLabel(\"Selected option:\", window)\n    label.setGeometry(50,\
    \ 100, 200, 30)\n\n    def on_selection_changed(index):\n        label.setText(\"\
    Selected option: \" + combo_box.currentText())\n\n    combo_box.currentIndexChanged.connect(on_selection_changed)\n\
    \n    window.show()\n    app.exec_()\n```\n\n本示例演示了如何创建一个包含三个选项的 `QComboBox`，连接其\
    \ `currentIndexChanged()` 信号，并在标签中显示所选选项。\n\n## 4. QCheckBox 和 QRadioButton：处理用户选择\n\
    \n- `QCheckBox`：允许用户选择或取消选择一个或多个选项。\n- `QRadioButton`：允许用户从一组互斥选项中仅选择一个选项。\n\n\
    ## 主要特性：\n\n- 选中状态：标识选项是否被选中。\n- 信号：当选中状态发生变化时，会发出诸如 `stateChanged()` 之类的信号。\n\
    \n## 示例：\n\n```\nPython\nfrom PyQt5.QtWidgets import QApplication, QWidget, QCheckBox,\
    \ QLabel, QVBoxLayout, QRadioButton\n\nif __name__ == '__main__':\n    app = QApplication([])\n\
    \    window = QWidget()\n    window.setWindowTitle(\"QCheckBox and QRadioButton\
    \ Example\")\n\n    layout = QVBoxLayout()\n\n    checkbox = QCheckBox(\"Option\
    \ 1\", window)\n    layout.addWidget(checkbox)\n\n    radio1 = QRadioButton(\"\
    Option A\", window)\n    radio2 = QRadioButton(\"Option B\", window)\n    layout.addWidget(radio1)\n\
    \    layout.addWidget(radio2)\n\n    label = QLabel(\"Your choices:\", window)\n\
    \    layout.addWidget(label)\n\n    def on_checkbox_changed(state):\n        if\
    \ state == 2: # 2 represents the checked state\n            label.setText(\"Option\
    \ 1 is checked\")\n        else:\n            label.setText(\"Your choices:\"\
    )\n\n    def on_radio_changed():\n        if radio1.isChecked():\n           \
    \ label.setText(\"Option A is selected\")\n        elif radio2.isChecked():\n\
    \            label.setText(\"Option B is selected\")\n\n    checkbox.stateChanged.connect(on_checkbox_changed)\n\
    \    radio1.toggled.connect(on_radio_changed)\n    radio2.toggled.connect(on_radio_changed)\n\
    \    window.setLayout(layout)\n    window.show()\n    app.exec_()\n```\n\n本示例演示了如何使用\
    \ **QCheckBox** 和 **QRadioButton** 控件来捕获用户选择，并相应地更新标签。\n\n通过有效使用这些控件，您可以创建用户界面，为用户提供直观、高效的交互方式，使其能够与应用程序进行交互、输入数据和做出选择。\n\
    \n# PyQt 中的容器控件\n\n容器控件提供了一种在 PyQt 应用程序中对其他控件进行分组和组织的方式。它们增强了 UI 的结构性和可读性，使其更易于管理和维护。以下是三种重要的容器控件：\n\
    \n## 1. QGroupBox：对相关联控件进行分组\n\n- **用途：** **QGroupBox** 提供了一个用于将相关联控件组合在一起的视觉容器。它为该组添加了一个边框和标题，使其在\
    \ UI 中视觉上与其他部分区分开来。\n\n### 主要特性：\n\n- **标题：** 在控件组上方显示一个标题。\n- **边框：** 在控件组周围绘制一个边框。\n\
    - **布局：** 你可以在 **QGroupBox** 中使用布局管理器（例如 **QVBoxLayout**、**QHBoxLayout**）来组织容纳的控件。\n\
    \n## 示例：\n\n```\nPython\nfrom PyQt5.QtWidgets import QApplication, QWidget, QGroupBox,\
    \ QLabel, QVBoxLayout\n\nif __name__ == '__main__':\n    app = QApplication([])\n\
    \    window = QWidget()\n    window.setWindowTitle(\"QGroupBox Example\")\n\n\
    \    group_box = QGroupBox(\"User Information\")\n    group_box_layout = QVBoxLayout()\n\
    \    group_box_layout.addWidget(QLabel(\"Name:\"))\n    group_box_layout.addWidget(QLabel(\"\
    Email:\"))\n    group_box.setLayout(group_box_layout)\n\n    main_layout = QVBoxLayout(window)\n\
    \    main_layout.addWidget(group_box)\n\n    window.show()\n    app.exec_()\n\
    ```\n\n本示例创建了一个标题为 \"User Information\" 的 `QGroupBox`，并在其中添加了两个标签。\n\n## 2. QTabWidget：创建选项卡界面\n\
    \n- **用途：** `QTabWidget` 允许你创建选项卡式界面，其中多个控件显示在不同的选项卡中。这对于组织大量信息或在单个窗口中呈现不同视图非常有用。\n\
    \n## 主要特性：\n\n- **选项卡：** 为每个控件创建选项卡，使用户可以轻松地在它们之间切换。\n- **选项卡栏：** 在控件的顶部、底部、左侧或右侧显示选项卡。\n\
    - **当前控件：** 跟踪当前选中的选项卡，并显示相应的控件。\n\n## 示例：\n\n```\nPython\nfrom PyQt5.QtWidgets\
    \ import QApplication, QWidget, QTabWidget, QLabel, QVBoxLayout\n\nif __name__\
    \ == '__main__':\n    app = QApplication([])\n    window = QWidget()\n    window.setWindowTitle(\"\
    QTabWidget Example\")\n\n    tab_widget = QTabWidget()\n    tab1 = QWidget()\n\
    \    tab2 = QWidget()\n\n    tab1_layout = QVBoxLayout(tab1)\n    tab1_layout.addWidget(QLabel(\"\
    Tab 1 Content\"))\n\n    tab2_layout = QVBoxLayout(tab2)\n    tab2_layout.addWidget(QLabel(\"\
    Tab 2 Content\"))\n\n    tab_widget.addTab(tab1, \"Tab 1\")\n    tab_widget.addTab(tab2,\
    \ \"Tab 2\")\n\n    window.setCentralWidget(tab_widget)\n    window.show()\n \
    \   app.exec_()\n```\n\n本示例创建了一个包含两个选项卡的 [QTabWidget](https://doc.qt.io/qt-5/qtabwidget.html)，每个选项卡中包含一个简单的标签。\n\
    \n## 3. QScrollArea：处理可滚动内容\n\n- **用途：** `QScrollArea` 为大于可用空间的控件提供可滚动视图。这对于在有限的窗口区域内显示大量内容至关重要。\n\
    \n## 主要特性：\n\n- **滚动条：** 当内容超出可视区域时，自动添加水平和/或垂直滚动条。\n- **控件可调整大小：** 允许你调整滚动区域内控件的大小，这对于动态内容很有用。\n\
    \n## 示例：\n\n```\nPython\nfrom PyQt5.QtWidgets import QApplication, QWidget, QScrollArea,\
    \ QLabel, QVBoxLayout\n\nif __name__ == '__main__':\n    app = QApplication([])\n\
    \    window = QWidget()\n    window.setWindowTitle(\"QScrollArea Example\")\n\n\
    \    scroll_area = QScrollArea()\n    scroll_area.setWidgetResizable(True)\n\n\
    \    scroll_area_widget = QWidget()\n    scroll_area_layout = QVBoxLayout(scroll_area_widget)\n\
    \    for i in range(20):\n        scroll_area_layout.addWidget(QLabel(f\"Label\
    \ {i+1}\"))\n\n    scroll_area.setWidget(scroll_area_widget)\n\n    window.setCentralWidget(scroll_area)\n\
    \    window.show()\n    app.exec_()\n```\n"
