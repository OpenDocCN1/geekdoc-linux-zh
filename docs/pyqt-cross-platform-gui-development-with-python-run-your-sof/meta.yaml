    - **子选择器：** 选择父部件内的子部件（例如，`QWidget > QPushButton`）。\n- **伪状态：** 根据部件的状态进行选择（例如，`QPushButton:hover`、`QPushButton:pressed`、`QLineEdit:disabled`）。\n\
    \n### 属性：\n\n- **背景：** `background-color`、`background-image`、`background-position`、`background-repeat`\n\
    - **文本：** `color`、`font-size`、`font-family`、`font-weight`\n- **边框：** `border`、`border-width`、`border-color`、`border-radius`\n\
    - **内边距：** `padding`（在部件边框内添加空间）\n- **外边距：** `margin`（在部件边框外添加空间）\n\n## 2. 创建自定义样式表\n\
