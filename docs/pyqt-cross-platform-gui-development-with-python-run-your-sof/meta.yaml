    widgets together. It adds a frame and a title to the group, making it visually
    distinct from the rest of the UI.


    # ### Key Features:


    +   - **Title:** Displays a title above the group of widgets.

    - **Frame:** Draws a frame around the group of widgets.

    - **Layout:** You can use a layout manager (e.g., **QVBoxLayout**, **QHBoxLayout**)
    within the **QGroupBox**'
