    \n### 多图显示：\n\n- 在单个 PyQt 窗口中嵌入多个 Matplotlib 图形。\n- 使用 [QTabWidget](https://doc.qt.io/qtforpython-5/PySide2/QtWidgets/QTabWidget.html)\
    \ 创建标签页界面，在不同的标签页中显示不同的图表。\n\n## 4. 注意事项\n\n- **性能：** 对于复杂的图表或大型数据集，请考虑优化代码以避免性能问题。\n\
    - **用户界面：** 设计 PyQt 界面，为嵌入式图表的交互提供流畅、直观的用户体验。\n- **Matplotlib 样式：** 使用 Matplotlib\
    \ 的内置样式或创建自定义样式表来自定义图表的外观。\n\n通过结合 Matplotlib 和 PyQt 的强大功能，您可以在 Python 应用程序中创建视觉丰富且交互性强的数据可视化。这使你能够以更吸引人、更具信息量的方式呈现数据，让用户更容易理解和解释复杂信息。\n\
    \n# 使用 PyQt 创建交互式图表：处理图表和图形\n\n本节探讨如何在 PyQt 应用程序中创建交互式图表和图形。我们将介绍使用 PyQt 的内置图表功能以及与流行的第三方库集成。\n\
    \n# 1. 使用 PyQt 的内置图表\n\n虽然 PyQt 本身没有像 Matplotlib 那样全面的图表库，但它通过 QChart 及其相关类提供了一些基本的图表功能。\n\
    \n- **QChart：** 创建图表的基类。\n- **QChartView：** 显示 QChart 的部件。\n- **QLineSeries：**\
    \ 创建用于折线图的线系列。\n- **QBarSeries：** 创建用于条形图的条形系列。\n- **QPieSeries：** 创建用于饼图的饼系列。\n\
    \n# 示例：简单折线图\n\n```python\nfrom PyQt5.QtWidgets import QApplication, QWidget,\
    \ QVBoxLayout\nfrom PyQt5.QtCharts import QChart, QLineSeries, QValueAxis, QChartView\n\
    \nif __name__ == '__main__':\n    app = QApplication([])\n    window = QWidget()\n\
    \    window.setWindowTitle(\"Simple Line Chart\")\n\n    series = QLineSeries()\n\
    \    series << QPointF(1, 1) << QPointF(2, 3) << QPointF(3, 2) << QPointF(4, 4)\n\
    \n    chart = QChart()\n    chart.addSeries(series)\n    chart.createDefaultAxes()\n\
    \    chart.setTitle(\"Line Chart\")\n\n    chart_view = QChartView(chart)\n\n\
    \    layout = QVBoxLayout()\n    layout.addWidget(chart_view)\n    window.setLayout(layout)\n\
    \n    window.show()\n    app.exec_()\n```\n\n此示例创建了一个包含四个数据点的简单折线图。\n\n# PyQt\
    \ 内置图表的局限性\n\n- **图表类型有限：** 与 Matplotlib 等库相比，PyQt 的内置图表功能相对有限。\n- **自定义：** 图表及其外观的自定义选项可能不够丰富。\n\
    \n# 2. 与第三方库集成\n\n对于更高级的图表和可视化需求，强烈建议与 Matplotlib 和 Plotly 等强大的第三方库集成。\n\n## 2.1.\
    \ Matplotlib（如上一节所述）\n\n**主要优势：**\n\n- 广泛的图表类型（折线图、条形图、散点图、直方图等）\n- 高度可定制，具有众多样式和格式选项。\n\
    - 庞大且活跃的社区，拥有丰富的资源和支持。\n\n## 2.2. Plotly\n\n**主要优势：**\n\n- 交互式图表，具有缩放、平移和工具提示等功能。\n\
    - 支持多种图表类型，包括 3D 图表和金融图表。\n- 非常适合创建视觉吸引力强、引人入胜的可视化效果。\n\n**示例：交互式 Plotly 图表**\n\
    \n```python\nfrom PyQt5.QtWidgets import QApplication, QWidget, QVBoxLayout\n\
    from PyQt5.QtWebEngineWidgets import QWebEngineView\nimport plotly.graph_objects\
    \ as go\n\nif __name__ == '__main__':\n    app = QApplication([])\n    window\
    \ = QWidget()\n    window.setWindowTitle(\"Interactive Plotly Chart\")\n\n# Create\
    \ a Plotly figure\nfig = go.Figure(data=go.Scatter(x=[1, 2, 3], y=[4, 5, 6]))\n\
    \n# Convert the Plotly figure to HTML\nhtml = fig.to_html(full_html=False)\n\n\
    # Display the HTML in a QWebEngineView\nweb_view = QWebEngineView()\nweb_view.setHtml(html)\n\
    \nlayout = QVBoxLayout()\nlayout.addWidget(web_view)\nwindow.setLayout(layout)\n\
    \nwindow.show()\napp.exec_()\n```\n\n此示例演示了如何创建简单的 Plotly 散点图并在 [QWebEngineView](https://doc.qt.io/qtforpython-5/PySide2/QtWebEngineWidgets/QWebEngineView.html)\
    \ 部件中显示它。\n\n**关键考虑因素：**\n\n- **选择合适的库：** 选择最适合你具体需求和可视化复杂度的图表库。\n- **性能：** 考虑使用特定库的性能影响，尤其是对于大型数据集或复杂可视化。\n\
