  md: "```\nclass PlotCanvas(FigureCanvas):\n    def __init__(self, parent=None, width=5,\
    \ height=4,\ndpi=100):\n        fig = Figure(figsize=(width, height), dpi=dpi)\n\
    \        self.axes = fig.add_subplot(1, 1, 1)\n\n        super().__init__(fig)\n\
    \n        self.plot()\n\n    def plot(self):\n        x = np.linspace(0, 10, 100)\n\
    \        y = np.sin(x)\n        self.axes.plot(x, y)\n\nclass MyWindow(QWidget):\n\
    \    def __init__(self):\n        super().__init__()\n        self.setWindowTitle('Matplotlib\
    \ in PyQt')\n\n        layout = QVBoxLayout()\n        canvas = PlotCanvas(self)\n\
    \        layout.addWidget(canvas)\n\n        self.setLayout(layout)\n\nif __name__\
    \ == '__main__':\n    app = QApplication([])\n    window = MyWindow()\n    window.show()\n\
    \    app.exec_()\n```\n\nThis code:\n\n+   1. **Creates a PlotCanvas class:**\
    \ Inherits from **FigureCanvasQTAgg** and creates a simple line plot using Matplotlib.\n\
