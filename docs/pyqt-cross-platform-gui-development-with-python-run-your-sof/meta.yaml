  mdcn: "\n ## 3. 高级功能\n\n### 交互式绘图：\n\n- 使用 Matplotlib 的事件处理机制（例如，[mpl_connect](https://matplotlib.org/stable/users/event_handling.html)）创建响应鼠标点击、悬停和其他用户交互的交互式图表。\n\
