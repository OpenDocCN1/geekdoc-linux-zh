    ```\n\n```\nQLabel\n  font-size: 14px;\n  font-weight: bold;\n```\n\n## 3. 在您的应用程序中加载样式表：\n\
    \n```\nfrom PyQt5.QtWidgets import QApplication, QWidget,\nQPushButton, QLabel\n\
