    To read a man page for a command, click System man page contents in the KDE Help
    window shown in step 1. An index of man page sections appears. Click the appropriate
    section, and click a command name to view its man page. For now, click the Previous
    Document button in the toolbar to return to KDE Help''s main page.


    # Select an Info Document


    Many programs included with OpenLinux are from the Free Software Foundation and
    include read documentation in info format. To use KDE Help to read info documents,
    click GNU info contents in KDE''s main page (refer to step 1). An index of GNU
    info documents and categories appears. To read an info file, click a name, such
    as


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_71_1.png)


