  md: '# Select a Screensaver tab


    Click the Screensaver tab, and scroll through the list of screensavers; a preview
    of the selected screensaver appears in the dialog. Click Setup to enter various
    parameters for the selected screensaver. Click Test to see the screensaver in
    action. Set how long your system is idle before the screensaver appears, enter
    a number in the Wait for field. Click Require checkbox, and your password will
    be required for you to work after the screensaver kicks in. To use the selected
    screensaver, click the Apply button.


    # Change How Windows Look


    Click the Colors tab, and scroll through the list of color schemes to change how
    windows'' title bars, frames, menus, or selected text looks. Note that the scheme
    will be shown in preview as you click each different scheme.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_40_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_40_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_40_2.png)


    # How-To Hints


    # KDE Window Element Colors


    KDE comes with 14 color schemes, but you can create your own by selecting specific
    items and assigning colors to the Widget color area of the Colors tab on the Display
    Settings dialog. Select a window element from the pop-down menu, and then click
    the rectangle between the menu to display the Select Color dialog. Select a color
    by choosing from the System Colors Palette, or create your own by holding down
    your left mouse button and moving over the color box in the upper-right quadrant
    of the dialog. When you are satisfied with the color, click the OK button. To
    use the new color for the desired window item, click the Apply button in the Display
    Settings dialog.


    # Setting Desktop Options Directly


    You can change the desktop''s background, colors, screensaver, or fonts directly
    by clicking the Application Starter button (the large K) in KDE''s panel, scrolling
    up to the Settings menu, and then selecting the Desktop item. A submenu will appear,
    and you then choose the item to change. This is handy if you can''t find a blank
    area of your root desktop, but want to change how your desktop looks.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_40_3.png)


    # Custom Controls for Screen Saving


    A hidden feature in the Screensaver tab of the Display Settings dialog lets you
    KDE to ignore, save or lock (password protected) your display. Click the Screensaver
    tab in the Display Settings dialog, and then click one corner of the preview dialog.
    A small pop-up menu will appear, from which you can select an action for that
    corner. For example, to immediately run a screensaver when you move your cursor
    to the bottom left of your display, move your mouse to the bottom left of the
    preview box, click, and select Save Screen.


    # End


    # How TO Configure YOUR DESKTOP


