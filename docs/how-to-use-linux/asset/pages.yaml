  md: '# CHAPTER 15

    Capturing and Creating Graphics


    Graphics are an important part of using Linux. Graphics are used in icons, in
    programs'' toolbars, in the desktop, and in documents. Using graphics can make
    using Linux more fun and interesting.


    This chapter shows you how to capture, create, and convert graphics files. You''ll
    see that OpenLinux comes with a wealth of graphics editors and conversion utilities,
    some of which—GIMP—rival commercial software applications.


    You need to run the X Window System to use many (but not all) of these programs.
    Read on and see how you can get started with your own graphics!'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# TASK


    # Begin


    # How to Capture a Window or Desktop


    # 1 Start xwd


    Several programs installed with OpenLinux can be used to capture and save graphic
    files off your display. This task starts with one of the simplest programs and
    then shows you how to use xv, a more flexible utility.


    The xwd (X Window dump) command is started from the command line of an X terminal
    window. Type the command and, using output redirection with the shell''s > operator,
    redirect xwd''s output to the name of a graphic file, like this: xwd > capture.xwd.
    When you press the Enter key, your cursor turns into a cross-hair.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_183_0.png)


    # 2 Capture a Window


    # 3 Start xv


    To capture a window, move the cross-hair cursor to a window and click with your
    left mouse button. To capture the entire desktop, use xwd with the -root option.
    You can also use the -out option, followed by a filename for capture. From the
    command line of a terminal window, type xwd -root -desktop.xwd. When you press
    the Enter key, a picture of the entire desktop is saved in file desktop.xwd. The
    file is saved in the X Window dump format.


    The xv is a capable graphics utility included with OpenLinux. Start xv from the
    command line of an X11 terminal window like & . A splash screen appears; right-click
    the display to open the xv Controls dialog. Click the Grab to begin.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_183_1.png)




    ![](img/c48ad0dbc61332ca39f773da7141f4e1_183_2.png)


    Right Click




    CHAPTER 15: CAPTURING AND CREATING GRAPHICS


    Click'
