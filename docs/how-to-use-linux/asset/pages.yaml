    in the index (for example, pilot-xfer), click the entry. A small window appears,
    telling the page you are formatting, and then the man page displayed.


    # Search for a Manual Page


    Click the Options button in the Manual Page window, and then press and hold the
    left mouse button. A menu of man options appears; select Search. In the small
    window appears, type a command and click the Manual Page button. If found, the
    command''s manual page displays.


