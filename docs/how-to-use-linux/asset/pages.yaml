    End


    # How-To Hints


    See the next task, "How to Use the plan Client," to find out how create schedules
    for your projects or appointments.


    # Scheduling at Reminders with OpenLinux


    Use the command to send yourself reminders. For example, remind yourself about
    a dental appointment at 1 p.m., type at 12:45 and press Enter. Then type xmessage
    -display :0.0 **"Time for the dentist!", press Enter, and press Ctrl+D to save
    the reminder. You can also use the atq command to run other programs at a scheduled
    time, such as tape backups at the end of the day. Use the atq command to see your
    scheduled jobs, and use atm to remove jobs. Read the at man for details.


    # Setting Routine Schedules


    Use the crontab command to schedule repetitive tasks. As the root operator, you
    can set these schedules in your OpenLinux system''s crontab file, found under
    the /etc directory. Individual users can set programs to run at regular times
    by using the crontab command with -e option. Make sure to read the crontab man
    page.


