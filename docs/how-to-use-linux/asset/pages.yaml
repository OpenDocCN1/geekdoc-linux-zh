  md: '# # Search by Date


    Another handy kfind feature is its capability to search your system''s files or
    directories by date. In the kfind window, click the New Search on the left far
    of kfind''s toolbar to clear any previous settings, and then click the Date Modified
    tab. To find files created in the last 24 hours, click the All Files Created or
    Modified; and then click the Previous button. The default number of days is 1,
    but you can change your search to use any number of days by clicking in the text
    field and entering a number. When finished, click the NameLocation tab, and then
    start the search.


    # # Delete a Found File


    You''d be surprised how many files are created or modified in a 24-hour period
    on OpenLinux computer, especially if you leave the computer all to time! To delete
    a file or directory, select its name in the file list, and then click the Delete
    on the kfind toolbar. Fortunately, kfind first asks whether you want to delete
    the item.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_84_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_84_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_84_2.png)


    # # Get File Information


    To find out more about a file or directory, select its name in the file list,
    and then click the Properties button on kfind. A dialog appears, showing general
    information about the file. Click on the other tabs to see what the file owns
    (its ownership) and what you can do with it (its permissions).


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_84_3.png)


    # # How-To Hints


    kfind is Taking Too Long! If you find that a search is taking too long, click
    the Stop button on kfind-toolbar (it looks like a traffic light). Try entering
    a more specific search in the Named field, or enter a specific directory, such
    as Jusr, in the Look in.


    # # Search Wildcards


    Using wildcards in search expressions is an art in Linux. As you become more proficient
    in finding files, learn how to use pattern-matching characters. Strings of these
    characters, such as *(a-z-9)*, are called regular and extended expressions. To
    learn more about creating and extended expressions, see the grep and ed pages.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_84_4.png)'
