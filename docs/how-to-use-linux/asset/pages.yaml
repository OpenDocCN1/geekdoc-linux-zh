    # End


    # How-To Hints


    # OpenLinux Won''t Recognize My CD-ROM!


    Take a look at the CDROM-HOWTO under the /usr/doc/HOWTO directory. You will find
    lots of tips and pointers on troubleshooting problems with CD-ROM drives.


    # Are There Other Music CD Players for OpenLinux?


    Oh yes. Try cdplay, xplaycd, or WorkMan. You''re sure to find at least one you
    like. There are also many other audio CD players for Linux. Browse to ftp://sunite.unc.edu/pub/linux/apps/sound/cdrom
    for pointers to dozens of players.


    # Why Only 11 Categories for Music?


