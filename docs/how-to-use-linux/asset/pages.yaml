- img_proc: true
  md: '# Begin


    # How to Fax with OpenLinux


    # 1 Send a Text File


    This task shows you how to send, receive, view, and print fax documents using
    the fax command. To view a fax, you must first start an X11 session. In order
    to print a fax, your printer must be configured to work with OpenLinux. To set
    up your printer, see "Printing Text Files and Graphics," and follow the steps
    in the "How to Install a "Printer" task.


    To send a text fax, use the fax command, along with its send and -l (lowercase
    L) options, followed by a fax number and the name of the text document. For example,
    to send the file mydocument.txt to a fax at 820-7442, type fax -l 8207442 mydocument.txt
    and press Enter. The -l is a low resolution, which is safer and faster for transmission.


    ```

    ```bash

    $ fax bjaall mydocument.txt

    mydocument.txt: 11/27/98 13:27 1998 efax 16 Ed Cases

    efam

    fax: 02: opened /dev/ttyS0

    fax: 07: session 9600bps 8.5"B-rt44

    fax: 12: dialing 8207442

    fax: 17: connected 8207442 9300 bps (1 703 123 121)

    fax: 27: sent 24-2064 lines, 19380-bytes

    fax: 32: header (11/27/98 13:26) Coastal Development (1 703 123 121)

    fax: 37: sent -l mydocument.txt

    fax: 42: sent 24-2064 lines, 19370+bytes

    fax: 47: sent 24-2064 lines, 19710+ bytes, S 9048 bytes

    fax: 52: closed

    (root)morearea bjaall

    ```

    ```


    # 2 Send a PostScript Graphics File


    To send a PostScript graphic by fax, use the fax command, along with its send
    and -l options, followed by a fax number and the name of the PostScript graphic.
    For example, to send the graphic.ps to a fax at 820-7442, type fax send -l 8207442
    tiger.ps and press Enter.


    # 3 Set to Receive a Fax


    To wait to receive a fax, use the fax command''s wait option on the command line
    and press Enter. The fax command waits for any incoming faxes.


    ```

    ```bash

    $ fax bjaall tiger.ps -l 820-7442

    tiger.ps: 11/27/98 12:24 1998 efax 16 Ed Cases

    efam

    fax: 02: opened /dev/ttyS0

    fax: 07: session 9600bps 8.5"B-rt44

    fax: 12: dialing 8207442

    fax: 17: connected 8207442 9300 bps (1 703 123 121)

    fax: 27: sent 24-2064 lines, 19380-bytes

    fax: 32: header (11/27/98 13:26) Coastal Development (1 703 123 121)

    fax: 37: sent -l tiger.ps

    fax: 42: sent 24-2064 lines, 19370+bytes

    fax: 47: sent 24-2064 lines, 19710+ bytes, S 9048 bytes

    fax: 52: closed

    (root)morearea bjaall

    ```

    ```


    106 CHAPTER 9: SENDING AND RECEIVING FAX DOCUMENTS'
