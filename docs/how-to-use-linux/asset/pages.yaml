    appropriate radio buttons. To continue, click the Next button.


    # 3 Fill in the Details


    The AutoPilot Letter dialog again appears, but with a preview of your document.
    To use a logo in your letter, click the Picture or Text radio buttons. If you
    choose Text, a Logo field appears, and you can enter text. To get a picture for
