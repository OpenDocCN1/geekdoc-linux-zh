    # Having Problems with Your ISP Settings for OpenLinux?


    When getting ready to configure Netscape or other internet software, make sure
    to get as much technical information as you can from your ISP. If you''re just
    starting to search for a service to use, ask your potential work right, by attending
    a local linux user group, or LUG (browse to http://www.sccom/glue for more info).
    Want free support? Try browsing to http://support.marko.net and registering as
    a customer!


    # How Do I Create A Signature File?


    A signature file usually contains your name, address, organization, and perhaps
    a witty quote. Traditionally, this four-line text file is named signature and
    resides in your home directory. Use your favorite text editor to create this file
    (see Chapter 10, "Word Processing with OpenLinux").


    HOW TO SET UP NETSCAPE MESSENGER FOR EMAIL 93'
