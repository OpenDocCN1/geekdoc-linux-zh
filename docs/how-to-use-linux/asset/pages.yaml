  md: '# Copy a File to the Desktop


    KDE''s desktop supports moveable icons and drag-and-drop action. This means that
    you can open a folder and drag into and out of it. You can copy or move files
    into folder by dragging the file or dropping it onto a folder''s icon or into
    an open folder window. To copy a file, click it, and then, holding the mouse button,
    drag it to the desktop. When you release your mouse button, a small menu appears.
    Click Copy.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_54_0.png)


    # Move a File to the Desktop


    Note that the file is still in the folder, but a copy is also on the desktop.
    To move a file, repeat the previous step, but click Move. Note that the file is
    no longer in the folder.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_54_1.png)


    # Create a Link


    Repeat the previous drag and drop, but this means time click Link in the pop-up
    menu. KDE creates a new file with the same name as the original, but with a slightly
    different icon. A link is a pointer to a corresponding file. If the original file
    is a text document, clicking its link loads the original document. If you delete
    the link, you are not deleting the original file; however, if you delete the original
    document, the link is useless.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_54_2.png)


    # How-To Hints


    Renaming Files and Folders with mw

    Use the mv command to rename files on the command line. For example, the command
    mv Scotty Belinda renames the file Scotty to Belinda. For example, use mv /home/bball/Whoopie
    /home/bball/Desktop moves the file Whoopie to your KDE desktop. If you give the
    original file a new name in the destination path, such as /home/bball/Desktop/Freaky,
    the file is moved and renamed at the same time. For safety''s sake, always use
    mv -i (interactive) option. This way, mv first asks whether it''s okay before
    writing over an existing file.


    End


    How To Manage Your Files


