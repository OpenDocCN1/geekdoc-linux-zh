  md: '# Configure dosemu and DR-OpenDOS


    This task gets you starting with dosemu. OpenLinux uses the rpm command to install
    and use dosemu on your computer''s hard drive. Although the files are are correctly
    copied from your CD-ROM, you still need to edit a system file in order to use
    dosemu and DR-OpenDOS. The default configuration is very restrictive; aside from
    the root operator, no one can use a floppy drive or create and delete files on
    the DOS drive.


    # Start a DR-OpenDOS Session


    Click the Application Starter on your desktop''s panel, choose Applications, and
    click DR-OpenDOS.


    +   Applications

    - BRU 2000

    - Games

    BRU 2000 configuration

