    containing a number of running programs. Although you can navigate to each desktop,
    manage and organize your desktops by function (such as Browsing, Editing, and
    so on), you''ll learn how to navigate directly to a program running in a different
    desktop. You''ll also learn how to manage your desktop windows.


    # Select the KPanel''s Windowlist Icon


    Click the Windowlist icon on the panel. You''ll see a menu containing the names
    of your desktops, along with any running applications. This programs is a handy
    index to the number of currently running programs. To jump to a running application
    in another desktop, scroll up the list, and click the desired program.


