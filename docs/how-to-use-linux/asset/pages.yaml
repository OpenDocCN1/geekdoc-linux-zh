  md: '# How to Back Up Files with BRU 2000


    If you use a stable Linux kernel (such as the one provided onLinux CD-ROM), you''ll
    enjoy the benefits of using a nearly crash-free operating system. But this doesn''t
    mean that all the software included with OpenLinux is immune to a software glitch.
    If a program barfs, you can easily kill the process using the shell''s command
    and start anew—which means no Blue Screen of Death with Linux! However, in order
    to avoid any problems with lost files, always back up and save important documents.
    This section shows you how to use the BRU 2000 client to back up floppy disks.
    You must be logged in as the root operator in order to use BRU 2000. Start this
    program from your desktop''s panel menu or the command line of X11 terminal window
    by typing `su -c xbru` .


    # 1 Configure BRU 2000


    Click the File menu, and then Configure BRU.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_63_0.png)


    Click


    # 2 Start Device Configuration


    The BRU 2000 Configuration dialog appears; click Devices. A /etc/brutab window
    appears. Click


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_63_1.png)


    # 3 Select a Device


    Open the Device Type drop-down menu in the New Device window, and choose 1.44Mb
    Floppy. Then click the Device node field, type /dev/ffd0, and click Create.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_63_2.png)


    Click'
