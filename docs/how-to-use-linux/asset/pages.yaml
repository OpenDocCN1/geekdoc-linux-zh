  md: '# TASK


    # How to Use the plan Client


    OpenLinux comes with several calendar programs you can use to see the current
    date, set a schedule, or plan appointments. This task shows how to start and use
    the plan client for X11.


    # Begin


    1 Start the plan Daemon and plan Client

    Start a terminal program. At the command line, type plan and press Enter to start
    the plan daemon (used to track appointments). Next, type plan and press Enter.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_213_0.png)


    # 2 View Current Month


    The plan window appears. By default, the plan shows the current month. To view
    past or future months or years, click the left or right arrow, respectively. The
    current day is highlighted. Open the Config menu, and then Adjust Time.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_213_1.png)


    # 3 Set the Time


    Click the Timezone is GMT field and enter the number of hours that your time zone
    is offset from Greenwich Mean Time (GMT). For example, if you use EST, Eastern
    Standard Time, enter 5 (PST), or Pacific Standard Time use 8). Click your Daylight
    Saving preference. Click Automatic to have plan automatically guess what to turn
    Daylight Savings Time on and off. When finished, click Done.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_213_2.png)


