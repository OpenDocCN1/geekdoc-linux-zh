  md: '# # Attach a File


    To attach a file, such as a graphic image, to your message, click the Attach button
    on the Compose window toolbar. In the menu that appears, click File; the Attach
    dialog will appear. Scroll through your directories, and double-click a file name
    to attach it to your message.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_108_0.png)


    # # Save the Message as a Draft


    To save the message in draft form, open the File menu, and click Save Draft. To
    open a draft file for editing or sending, click the drop-down mailbox below the
    toolbar in the Messenger window, and then click Draft. To open your draft message,
    double-click its name in the Messenger window, and edit it.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_108_1.png)


    # # Send or Save Your Message


    When you''re ready to send your message, click the Send Now button in the Compose
    window toolbar. To go back to Messenger, open the File menu, and select Close.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_108_2.png)


    # # How-To Hints


    # ### Formatting and Mail Preferences


    If you select Hmtl as the default format for your messages, you can sent messages
    with different fonts in different sizes-but if your mail recipient does not use
    Netscape, your message might look ragged (it can be hard to read HTML in raw format).


    # ### How Do I Send Postponed Messages?


    If you select Send Later from the File menu in the Compose window, your message
    will be filed in the Unsent messages mailbox. Access unsent messages such as those
    in the Drafts mailbox, double-click the message in the Unsent messages mailbox.
    The message will appear in a window. Open the File menu, and then click Edit message.
    You''ll be there in the Compose window, where you can click the Send Now button.


    # End


