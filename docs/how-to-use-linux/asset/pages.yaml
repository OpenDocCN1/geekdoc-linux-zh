  md: '# Begin


    # How to Play MIDI Karaoke Music


    Start the Application Starter button on your desktop''s panel, choose Multimedia,
    and then click KMid Midi/Karaoke Player.


    Your OpenLinux system comes with several musical instrument digital interface
    (MIDI) files. MIDI files, usually distinguished by the file extension .mid, contain
    information needed by your computer''s sound card to play different musical instruments.
    This section introduces you to the kmid player, which not only plays MIDI files,
    but also shows lyrics so you can sing along!


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_221_0.png)


    # Open kmid''s Organizer


    # Create a Collection


    The kmid player has a menu bar, toolbar of player controls, and a sliding control
    for MIDI songs. To create a collection of songs to play, open the Collections
    menu and choose Organizer.


    When kmid Collections manager appears, click the New button. In the New Collection
    dialog, enter a name for your collection, such as nysongs, and click the OK button.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_221_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_221_2.png)'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# Add Songs


    Click the Add button in the Collections Manager dialog, and kmid''s Open dialog
    appears. Click the Location field, press the backspace key, type /opt/kde/share/apps/kmid/,
    and press Enter. A list of kmid files appears. Click as AlwaysOnClickTheBrightSideOfLife.kar,
    and then click the OK button. Repeat until you''ve added all the songs you want.
    When finished, click the OK button in the Collections Manager dialog.


    # Play a Song


    Click the Play button to start playing the first song in your collection. kmid
    plays the song, each word in the song''s lyrics is highlighted.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_222_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_222_1.png)


