  md: '# Begin


    # Manage Your Software with Lisa


    The lisa command is a graphical interface program for the rpm command that does
    not require the X Window System. You must be logged in as the root operator to
    install and remove software using lisa. Start lisa from the command line of your
    console by typing su -c "lisa - pkg".


    # 1 Select Package Removal


    The lisa command proceeds right to the Software Package Administration dialog;
    scroll down to item 4, Remove Software Packages that Have Already Been Installed,
    and press Enter.


    ```

    --- Software Package Administration

    - software package administration features of lisa (all)

    - install and remove software packages as you wish...

