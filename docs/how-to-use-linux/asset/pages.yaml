  md: '# TASK


    # How to Copy and Paste Graphics


    This task shows you how to copy and paste graphics between X11 graphic clients.
    You learn how to use the xmag program. Copying and pasting images is very easy!


    # Begin


    # 1 View a Graphic


    Use the xv client to display a favorite graphic. From the command line of a terminal,
    type a command such as xv nat.jpg & (where nat.jpg is the name of the file you
    want to display) and press Enter. The graphic is displayed on your desktop.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_33_0.png)


    # 2 Start the xmag Client


    At the command line of the terminal, use the xmag client to capture a 200-200
    pixel area of your graphic at a 1:1 ratio (the default is 1:5). Type a command
    such as xmag -mag 1 -source 200x200 &, and then press Enter.


    # 3 Copy Graphic


    Your X11 cursor changes to a backward 7. Move your mouse to the area of the graphic
    you''d like to capture and click. The copied graphic appears in xmag''s window.


    ```

    xwin

    -root=process graphics1 xv=nat.jpg &

    -id 297 &

    -root=process graphics1 xmag -source 200x200 &

    ```


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_33_1.png)'
