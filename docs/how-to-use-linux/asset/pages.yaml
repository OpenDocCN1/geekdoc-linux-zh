  md: '# Change KPanel tab of the KPanel


    Click the **Options** tab to set other options, such as pop-up help, autohiding,
    and the panel control. Click **Show Menu Tooltips** to toggle pop-up help over
    panel controls. Drag the **Delay** slider to set the amount of time before help
    appears (1000 ms one second, obviously). For the panel or taskbar autohiding,
    click the appropriate button in the **Others** section. When you hide the panel
    or taskbar, it will appear only when your mouse lingers in the panel or taskbar''s
    normal location. Don''t forget to click the **Apply** button.


    # 5 Change Desktop Buttons


    Click the **Desktops** tab to configure the **Desktop buttons** in the panel.
    These buttons are used to navigate to different "virtual" desktops–it''s like
    having four displays at the same time! If you need more than four desktops, drag
    the **Visible** slider to control it, and two new desktops appear (you can use
    many as eight). To control the size of the X buttons in the panel, drag the **Width**
    slider to the left or right. Note that the default desktop buttons are **One**,
    **Two**, and **Three**. To change the name of a desktop, click the text field
    of the desktop you want to change and enter your own.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_44_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_44_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_44_2.png)


    # How-To Hints


    The default KPanel configuration uses normal-sized icons. This means that if you
    use X sessions on an 800×600-pixel display, you might not see the clock (it''s
    at the far-right end of the panel). To see the clock, select the **Tiny** setting
    in the panel''s configuration dialog, delete unwanted icons from the panel, or
    try using the panel vertically.


    # Make a Mistake?


    Be careful! Although in many cases you can revert to KDE''s original settings
    by clicking the **Default** button in configuration dialogs, this doesn''t always
    work (KDE is a "work in progress"). Note your original settings before making
    changes to your desktop.


    # Using and Labeling Desktops


    Using desktops and desktop labels is a handy way to organize your work. For example,
    if you run Netscape in one desktop and StarOffice in another, labeling Netscape''s
    desktop as **Internet**, and StarOffice''s as **Office** not only serves as a
    reminder, but can also keep related activities in single screens.


    HOW TO CONFIGURE THE KDE PANEL AND TASKBAR 31'
