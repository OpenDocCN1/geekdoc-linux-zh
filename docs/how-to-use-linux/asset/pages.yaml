  md: '# How to Change the KPanel


    The panel, besides hosting the Application Starter menu and other controls, is
    a handy tool that you can use to quickly launch your favorite programs. This section
    will show you how to install, move, configure, or remove buttons from the KPanel.


    # Add a Panel Application


    To add an application to the panel, select the Application Starter menu, select
    the Add Application menu item, and then choose the menu of applications and applications
    groups. To add a graphic application, such as the KPaint program, select it from
    the Graphics menu. The program''s button will appear in your panel immediately
    to the right of the panel''s desktop buttons. Existing buttons will be pushed
    to the right.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_45_0.png)


    # Add a Panel Menu


    To add a menu to the panel, again open the Application Starter menu, select the
    Panel menu item, and then choose the Add Application menu item. Select a menu
    of applications (Graphics), and select an application group from the menu (again,
    Graphics). The icon of the group will appear on the panel.


    # Remove a Panel Application or Menu


    To remove an application or menu from your panel, right-click the icon and select
    Remove from the small pop-up menu that appears.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_45_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_45_2.png)'
