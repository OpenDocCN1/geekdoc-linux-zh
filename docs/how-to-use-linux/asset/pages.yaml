  md: '# How to Track Time with KArm


    This task shows you how to keep track of time for selected tasks with KArm. This
    program is handy for measuring the progress of different tasks or for accounting
    billable hours for different projects.


    # 1 Start a New KArm Task


    Click the Utilities button on your desktop''s panel, and then click KArm. A blank
    window appears, containing a menu bar and a toolbar. The toolbar boasts Start
    Clock, Stop Clock, New Task, Delete Task, and Edit buttons. Open the Task menu
    and click New.


