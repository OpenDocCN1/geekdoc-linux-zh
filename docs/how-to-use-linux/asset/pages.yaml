- img_proc: true
  md: '# 4 Choose a Font and Background


    Use the -fn option to start a new terminal with a different font. At the command
    line of a terminal, type xterm -fg black -bg lightblue -fn 9x15 and press Enter.
    A new terminal appears using the specified color and font. (it) runs the window
    independently of the original terminal (this is known as starting a program in
    the background). Click the Close button to quit the new terminal.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_28_0.png)


    # 5 Use a Specific Size and Location


    Use the -geometry option to start a terminal with a specific size and location.
    Geometry settings represent width, height, x-offset, and y-offset. The offset
    values can be positive or negative. An x-offset of +0 and a y-offset of +0 represent
    the upper-left corner of your display. A geometry offset of -0,-0 is the lower-right
    corner of your display. At the command line, type xterm -fg black -bg 9x15+geometry
    60x150+200+150 A new terminal appears with a 50-character width, 15-line window,
    with the window''s edge 200 pixels from the left edge of the desktop, and it''s
    top edge 150 pixels below the top edge of the desktop.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_28_1.png)


    # 6 Run a Program in a Terminal


    Use the -e option to run a program in a terminal window. At the command line,
    type xterm -fg black Papaway -fn 9x15 -geometry 60x15+200+150 -cr - e /usr/bin/pico.
    A new terminal window appears, using a cursor with the pico editor.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_28_2.png)


    # How-To Hints


    What Colors Are Available?


    Read the file rgb.txt under /usr/X11/lib/rgb directory for a list of color names
    you can use during X sessions. The less pager at the command line like: less /usr/X11/lib/rgb.txt.
    Press Q when you''ve finished reading it. Also see the next task, "How to See
    Fonts and Colors"


    What Fonts Are Available?


    OpenLinux comes with nearly 600 fonts that can be used during X sessions. Many
    of these fonts are international, so everyone can enjoy using a graphical interface
    to Linux. The next task, "How to See Fonts and Colors," for more information.


    # End


    HOW TO START X11 TERMINAL WINDOWS


