    \ have at least four services start when you boot Linux: Cron for scheduling events;\
    \ Print server for; Mail Transfer Agent so you can send electronic mail; and System\
    \ Logger for creating your system's logs under the /var/log directory.\n\n# Select\
    \ Web Server\n\nFor example, to have the Apache web server start the next time\
    \ you boot Linux, scroll down to the Web Server (Apache) item, press the Spacebar,\
    \ and then Enter.\n\n```\nConfigure server autostart\nSelect all services that\
    \ should be started automatically.\nAutoMount Daemon (NFS) local\n- AutoMount\
    \ Daemon (NFS) local\n  - Large filesystem support (ext3)\n  - AutoMount Daemon\
    \ (NFS) local\n  - AutoMount\n- network daemon (nell) local\n  - network daemon\
    \ (nell) local\n  - network daemon (nell)\n\nContinue\n```\n\n![](img/c48ad0dbc61332ca39f773da7141f4e1_66_0.png)\n\
    \nEnd\n\n# How-To Hints\n\n### What Are These Different Services?\n### Using Netscape\
    \ and Apache to Search for Packages ### Installed On This Computer?\nOpenLinux\
    \ can be used as a desktop computer operating system or a platform to support\
    \ large-capacity and high-demand Internet services. This book's CD-ROM contains\
    \ nearly all the software needed to use Linux on a personal computer, a high-end\
    \ graphics workstation, or a network server. To learn more about how to administer-Linux,\
