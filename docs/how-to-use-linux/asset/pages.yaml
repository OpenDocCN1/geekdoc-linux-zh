- img_proc: true
  md: '# ## Check Your Modem


    You can monitor your modem activity during your online sessions if you selected
    **Dock into Panel on Connect** in the PPP tab. A tiny indicator, showing two colored
    circles, will be embedded in your desktop''s panel after a connection is made.
    Data flowing in and out of your computer will flash the green circles. This is
    handy for making sure you''ll still connected during long downloads of large files.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_96_0.png)


    # ## 5 Stop Your PPP Session


    There are at least two ways to stop your PPP session. One is to click the button
    for kpppp''s connection dialog in your desktop''s taskbar. When the dialog appears,
    click the **Disconnect** button. Another way is to right-click the kpppp modem
    monitor in your panel and choose **Disconnect** from the pop-up menu.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_96_1.png)


    # # How-To Hints


    # ### Having Trouble Connecting?


    You''ll find a number of documents installed on your system setting up and troubleshooting
    the PPP connection. First, make sure to thoroughly read kpppp''s handbook (click
    the **Help** button when you first start kpppp). Next, use the zless command to
    read the PPP-HOWTO. From the command line of your console or X11 terminal window,
    down type zless `/usr/doc/HOWTO/PPP-HOWTO.gz`.


    # ### Troubleshoot Your Connection using kppp


    Need to see what''s going on after you click the **Connect** button? Click the
    **Show Log Window** button on kpppp''s main dialog before you connect. A window
    will appear in the lower-right portion of your display, showing your connections
    sent to and received by your modem.


    # ### Can''t See Your kpppp Modem Monitor?


    Can''t see your clock? Chances are you won''t see the kpppp modem monitor either.
    You''ll need to configure your panel to use smaller icons. Click the **Application
    Starter**, choose **Panel**, and select **Configure**. A dialog will appear, enabling
    you to make your panel larger or smaller.


