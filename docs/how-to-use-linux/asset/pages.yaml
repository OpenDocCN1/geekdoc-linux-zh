  md: '# 13


    # CHAPTER


    # Getting Started with StarCalc


    StarCalc is the spreadsheet component of the StarOffice office-automation productivity
    suite for OpenLinux. This program is integrated into the StarOffice desktop and
    can share information with other parts of StarOffice, such as StarWriter or StarOffice
    Presentations. StarOffice must be installed, and you must be running the X Window
    System in order to use StarCalc. Definitely read Chapter 11, "Getting Started
    with StarOffice," before starting tasks in this chapter; doing so makes your StarOffice
    desktop sessions a lot more fun!


    This chapter introduces you to StarCalc. You start by using some basic StarCalc
    features; you then move on to creating more complex sheets and graphing your spreadsheet
    data. Next, you see how to quickly create custom documents using templates. Finally,
    you see how to share your spreadsheet data to create professional-looking documents.


    Start StarCalc from the command line of a terminal window. Type Office40/bin/soffice
    &, press the Enter key, and get started! ●'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# TASK


    # How to Create, Format, and Save a StarCalc Spreadsheet


    Spreadsheets are handy tools for storing and tracking information, and forecasting,
    or providing "what if" calculations.


    # Begin


    # 1 Create a Spreadsheet


    The easiest way to create a new StarCalc spreadsheet is to double-click the New
    Spreadsheet icon in the StarOffice desktop. Alternatively, you can click the New
    button in the lower-left portion of the desktop, or choose the File menu, choose
    New, and then click Spreadsheet.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_161_0.png)


    # 2 Enter Some Data


    Enter some data-text or numbers by clicking in a blank spreadsheet cell. The data
    in the current cell appears in the data entry field above the work area. Press
    Enter to move to the cell below the current cell; press Tab to move to the cell
    to the right of the current cell. In addition, you can use the cursor to move
    to different cells in your sheet.


    # 3 Format Your Data


    To format a single cell, click it and choose formatting options above the formatting
    toolbar. To select multiple cells, select a cell and then drag. To format two
    or more areas of your spreadsheet at the same time, click the first cell and drag
    to select the first area. Then, holding the Ctrl key, click and drag to select
    another area, and then format the cells as needed.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_161_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_161_2.png)


    CHAPTER 13: GETTING STARTED WITH StarCALC'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Total a Column of Numbers


    StarCalc performs quick totals of your data. Click in the bottom cell of a column
    of numbers and click the Sum button (the marked with a Σ next to the equal sign
    in the data-entry field above your work area). Two new buttons, one with an X
    and another with a check, appear next to the data entry field, which has the SUM
    inserted. Click the check mark button to accept the entry, or click the X to cancel


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_162_0.png)


    # 5 Total Columns of Numbers


    StarCalc can also quickly total two or more columns of data. Click in the bottom
    of one of numbers, drag to select an adjacent cell and click the Sum button. The
    sums of both columns appear, and each cell contains the SUM formula.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_162_1.png)


    # How-To Hints


    Quick Totals Works Horizontally, Too

    You can also use the Sum button to total a row of numbers. Click and drag to the
    left or right across a row of numbers to an empty cell, and click the Sum button.
    The sum appears in the empty cell. This is a fancy feature to build simple spreadsheets.


    # Quick Copies of Data


    Don''t want to use the keyboard or menu commands to copy sections of your spreadsheet?
    Click and drag to select the desired cells, then hold your mouse button down,
    press the Ctrl key, and when you release your mouse button, voilà! The original
    cells are copied and placed in the new area.


    # 6 Save Your Spreadsheet


    Open the File menu and choose Save. The first time you save a spreadsheet, the
    Save as dialog appears. By default, StarOffice spreadsheets are saved in StarCalc
    format, but by using the dropdown menu in the File Type field, you can export,
    or save, your sheet in a format used by other spreadsheets.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_162_2.png)


    End


    How to Create, Format, and Save a StarCalc Spreadsheet 149'
