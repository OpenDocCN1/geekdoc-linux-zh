  md: '# # Edit the Frame


    Your graph appears in the frame. To resize the graph in the frame, click and drag
    one of the graph''s eight anchor points. You can move the graph within the confines
    of the frame; you can also add text to the frame by clicking in a blank frame
    area.


    # # Add Background


    To add a color background to your frame, right-click inside the frame and choose
    Paragraph from the pop-up menu. Click the Background tab on the Paragraph dialog,
    and click a background color, such as Gray 10%. Click OK. When finished, save
    or print your document by choosing the appropriate command from the File menu.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_168_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_168_1.png)


    # ## How-To Hints


    With your frame selected, choose Frame from the Format menu to determine how the
    frame interacts with text. When the Frame dialog appears, click the Wrap tab,
    and then select the type of text wrapping desired. By choosing different values
    in the Spacing section, you can change how much space is between the text and
    each side of the frame.


    # ## Working Around Pictures


    If you insert a graphic into your StarOffice document, choose Picture from the
    Format menu to determine how text interacts with your picture. When the Pictures
    dialog appears, click the Wrap tab and choose the type of text wrapping. An exciting
    feature under the Options section is the Contour check box. If you click Contour,
    text flows around the outer edges of your picture and not just around its box!


    HOW TO SHARE SPREADSHEET GRAPHS 155'
