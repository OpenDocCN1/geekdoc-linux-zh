  md: '# 8


    # CHAPTER


    # Using Netscape Communicator


    Netscape Communicator is a free suite of Internet tools that you can use with
    OpenLinux. You can use this software not only to browse the Web, send and receive
    email, read news, but also to create your own Web pages. Much of the magic of
    the Internet comes alive with these easy-to-use software tools for OpenLinux,
    and these programs are part of the Communicator suite of Internet productivity
    programs included with OpenLinux on this book''s CD-ROM.


    Netscape Communicator is installed into the /opt/netscape directory during a full
    OpenLinux installation. You must run X11 in order to use Netscape Communicator
    (the tasks in this chapter show how to use it with X and KDE; see Chapter 3, "Getting
    Started with the K Desktop Environment"). You must also have an active Internet
    connection in order to browse the Web, send receive email, or use Netscape news
    (see Chapter 7, "Connecting to the Internet" for details).


    In this chapter, you''ll see how to set up, configure, and use Netscape Communicator
    to make the most out of your online sessions. One component not discussed in this
    chapter is Netscape Composer. But don''t despair: For a tutorial on using Composer,
    select Communicator''s Help menu, click the Help Contents menu item, and then
    click the Composing and Editing Web Pages item in Communicator''s NetHelp dialog.'
