  md: '# How to Do Advanced Searches


    # Begin


    You can also use the kfind client to perform advanced searches of your OpenLinux
    system. for example, you can search your system for the largest programs, or see
    a list of all files created in the last 24 hours, or get a list of all the sound
    files included with OpenLinux.


