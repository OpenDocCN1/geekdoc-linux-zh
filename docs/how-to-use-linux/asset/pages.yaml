  md: 'To protect your Zip disk and assign a password, put a Zip disk in its drive
    and use ziptool like:


    ziptool -rp /dev/sda

    The command asks for a password (you can enter up to 32 characters). After you
    press Enter, ziptool password-protects and ejects your Zip disk from its drive.
    Don''t forget your password!


    # # Setting Up OpenLinux for the Palm Computer


    The 3Com Palm computers have taken the handheld computer industry by storm. There
    are now more than one million Palm computer owners. If you are a Palm Pilot, Palm
    Pilot Professional, or Palm III computer, you''ll be happy to know that OpenLinux
    comes with nearly two support programs you can use with Linux.


    The easiest of these programs is pilot-xfer, which can back up, restore, install,
    and list the contents of your Palm. To use pilot-xfer, first log in as the root
    operator. Create a symbolic link with the In command to the serial port used to
    connect your Palm''s computer could like:


    ```

    ln -s /dev/ttySX /dev/pilot

    ```


    Where X represents the number 0, 1, 2, or 3 of the tty device. For example, if
    your Palm connects to COM1, /dev/pilot should point to /dev/tty0. Next, to ensure
    the fastest transmission rate, set the PILRATE environment variable with the value
    of the fastest baud rate supported by your serial port. For example, to use 57600
    baud, use the bash''s export command like:


    ```

    PILRATE="57600"; export PILRATE

    ```


    Connect your Palm''s cradle to your computer''s serial port and place your Palm
    in its cradle.


    # # Back Up Your Palm


    Use the mkdir command to create a backup directory, such as ppro, for the contents
    of your Palm. To back up your Palm, pilot-xfer -b command, followed by the name
    of the directory, like this:


    ```

    pilot-xfer -b ppro

    ```


    To start the backup, press the HotSync button on your Palm''s cradle.


    # # Install a File


    Use pilot-xfer -i, or install, option, followed by the name of a Palm PRC or PDB
    file to install a program or database. For example, to install the teezee.prc,
    use pilot-xfer like this


    ```

    pilot-xfer -i teezee.prc

    ```


    To start the install, press the HotSync button on your Palm''s cradle.


    > Note Use KDE? Try the Kpilot

    If you use KDE and a Palm computer, you definitely should try the Kpilot application.
    Navigate to http://www.slac.com/pilone/home_page.html. You need to download and
    install the application, but you get a first-class interface for using your Palm
    with OpenLinux and KDE.


    SETTING UP OPENLINUX FOR THE PALM COMPUTER 261'
