  md: '# How to View Graphic Images


    There are many different ways to view graphics with Linux. This task shows you
    how to view the-shots captured in the previous task and shows what you can do
    with them.


    # Begin


    # 7 Undump a Window Dump


    When you capture and save a graphic using the xwud command, use the xwud (X Window
    dump) command to display the graphic. On the command line of a terminal window,
    use the xwud command and its -in command line option, followed by the name of
    your graphic, like so: xwud -in capture.xwud. After you press the Enter key, the
    graphic is displayed in a window on your desktop.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_185_0.png)


    # 2 Display a Graphic


    The ximage command included with OpenLinux can display nearly 20 different graphics
    files formats. From the command line of a terminal window, type ximage graphic.gif
    (where mygraphic.gif is the name of your graphic). After you press the Enter key,
    the graphic is-played in a window on your desktop.


    # 3 Load an image into the Desktop


    One of the things you can do is load an image into the desktop, or root window.
    Use the ximage command, along with its -onroot and - fullscreen options, followed
    by the name of the graphic, like: :ximage -fullscreen graphic.gif. The image enlarges
    to fill the background, or root display, of your desktop.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_185_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_185_2.png)'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# Change a Capture


    OpenLinux comes with a number of programs you can use to change the appearance
    of your graphic. For example, to rotate an image 45°, use the display command
    along with its -rotate command line like this: display -rotate 45 mygraphic.gif.
    The display command has many other options for changing graphics; See the display
    man page to learn how to create other effects with your graphics.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_186_0.png)


    # Magnify an Icon


    Another nifty utility to display a portion of a window or your desktop is the
    xmag client. From the command line of a terminal window, use xmag and press the
    Enter key. Your cursor changes to a backward 7. Click a part of your display,
    and xmag captures magnifies the area you clicked.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_186_1.png)


    # View a Graphic with kwiew


    KDE fans will definitely want to use the kwiew utility to view graphics. This
    program supports drag and drop to display graphics. Click the Application Starter
    button on your desktop, choose Graphics, and then click Image Viewer. The kwiew
    appears. If you have your home folder open in your desktop, select a graphics
    file and drag it into kwiew. Double-click the graphic''s name in kwiew; kwiew
    displays it in a separate window. Use kwiew''s toolbar buttons to shrink, enlarge,
    or resize the graphic.


    # How-To Hints


    > I Don''t Use KDE, but I Want a Root Image!


    If you don''t use KDE, but you''d like to use a graphic as the background, you''ll
    have to use the loadimage command line into .xinitrc file in your home directory.
    For details about using xinitrc, see Chapter 2, "Getting Started with the X Window
    System."


    # My Graphics Awful!


    Although the problem could be that the graphic is low resolution, or an enlargement
    of a small picture, it might be that your use colors as possible for X sessions.
    Use the startx or kde commands to start your X session. Type kde -bpp 16 to enable
    your X session to support thousands of colors or kde -24 for millions of colors.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_186_2.png)


    # End


    HOW TO VIEW GRAPHIC IMAGES'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# # TASK 3: How to Open a Graphic with GIMP


    The GNU Image Manipulation Program, or GIMP, is one of the latest and best tools
    for Linux, with features that rival rival graphics applications. GIMP has many
    menus, tools, and filters, but in this task, you learn how easy it is to use.
    Start GIMP from the command line of a terminal window by typing gimp & A dialog
    appears, telling you that GIMP will install a configuration directory in your
    home directory. Click the Install button to continue. A second dialog shows what
    has been installed. Click the Continue button to start editing.


    # Read the Tip of the Day


    After GIMP installs its directory and plays few splash screens, you see the GIMP
    tip of the day. Click the Close button.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_187_0.png)


    # Show Tool Dialogs


    If you plan to spend some time editing, open the File menu, choose Dialogs, and
    click Brushes. Repeat this step until each item listed in the Dialogs submenu
    is displayed.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_187_1.png)


    # Open a Graphics File


    Display a graphics file by clicking the File menu and choosing Open. Scroll through
    your directories, click Gimp''s file name, and click the OK.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_187_2.png)


    174 CHAPTER 15: CAPTURING AND CREATING GRAPHICS'
