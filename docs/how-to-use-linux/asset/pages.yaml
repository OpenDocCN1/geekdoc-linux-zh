    How-To Hints for more information if StarOffice reports an error or if your printer
    does not print.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_138_1.png)


    # # Select the Default Printer


    After confirming your test page, select the printer you''d like to use with StarOffice
    from the Installed Printers list in the Printer Installation dialog and click
    the Default button. Click the Close button to exit. Any changes are saved in the
    file Xdefaults under the Office40/xp3 directory in your home directory.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_138_2.png)


    # # How-To Hints


    # ## Pursuring Printer Problems


    You should have installed a printer during your OpenLinux installation. If you
    chose not to, see Chapter 16 for details on how to install your printer. If you
    did install a printer but still have problems, make sure that your printer is
    properly connected to your computer and it is turned on. Make sure you are not
    using an image-parallel port Zip at the same time. Try to load the parallel-printer
    kernel module by using insmod commands like `so -c /sbin/insmod lp1`. If you hear
    your printer activate, try printing a test page again. If insmod command reports
    that a module named lp already exists, your kernels support parallel printing.
    For detailed troubleshooting tips, read the Printing-HOWTO under the /usr/doc/HOWTO
    directory (type zless /usr/doc/HOWTO/Printing-HOWTO.gz).


    End'
  merge: -1
