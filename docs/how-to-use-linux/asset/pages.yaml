    Believe it or not, there''s an even easier way! With a few clicks of the mouse
    and a little typing, you can have a great-looking document ready to save, print,
    or publish. How? Read on, and you''ll see how to use the AutoPilot feature from
    your StarOffice desktop.


    # 1 Start AutoPilot


