  md: '# How to Use the kfind Client


    The kfind program is included with the K Desktop Environment and is a handy tool
    that you can use to search your OpenLinux directories. You must start an X11 session
    before using kfind. From the command line of your console, start X and KDE by
    typing kde.


    # 1 Start kfind


    Click the Find Utility button on your desktop''s panel.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_81_0.png)


    # 2 Enter a Search File Name


    The kfind window appears. To start a search, click the Named field and type all
    or part of the name of the file. You can also use wildcards to search for a matching
    file name. For example, to find any files containing the letters PPP, enter PPP*
    in the field.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_81_1.png)


    # 3 Set a Search Location


    To tell kfind where to look on your hard drive, click the Browse button on the
    kfind window. A small dialog appears. Click the pop-up menu at the top of the
    dialog, select the / character, and click the OK button. The forward slash (/),
    root directory, is the base of your OpenLinux system. Selecting this directory
    means that kfind searches your entire hard drive.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_81_2.png)'
