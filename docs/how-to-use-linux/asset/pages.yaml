  md: '# How to Read Usenet News


    Besides browsing the Web and sending email, Netscape Communicator can also be
    used to read Usenet news. Usenet news is a worldwide system of computers running
    software that stores, exchanges, and updates collections of text files, or newsgroups,
    organized by category and hierarchy. A newsgroup name might look something like
    comp.os.linux.x, which translates to "discussions of using the X Window System
    for the Linux computer operating system." Usenet news has been around since Prehistoric
    Times (in Internet). In 1986, there were about 500 different newsgroups—today
    there are more than 40,000!


    # Begin


    # 1 Open Discussions


    Select Message Center from Netscape''s Communicator menu. To specify what groups
    you''d like to join or read, click the Join Groups button in the Netscape Message
    Center toolbar.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_111_0.png)


    # 2 Get Discussion Groups


    The Get Discussion Groups window will appear. Click the Add Server button and
    type the name of your ISP''s news server, which is displayed below your mail folders
    in the previous window. If Netscape Discussions do not start retrieving the list
    of newsgroups click the Get Discussion Groups button on the right side of the
    dialog.


    # 3 Browse Newsgroups


    When Netscape finishes retrieving your list of newsgroups, a list of top-level
    newsgroup sections will appear. Click the Discussion Group field and type comp.os..linux.a.
    Netscape will automatically scroll through the list until it displays the newsgroups,
    and then expand the comp.os.linux group to show the current groups.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_111_1.png)


    98 CHAPTER 8: USING NETSCAPE COMMUNICATOR'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# Subscribe to Some Newsgroups


    Click in the check-mark on the line of a group''s name to subscribe to that newsgroup.
    A check mark will appear to show that you have joined the discussion group. Continue
    selecting newsgroups; when finished, click OK.


    # Open Discussions Folder


    Click the plus sign in front of the folder name in the Message Center. Your subscribed
    newsgroups will be listed in the main window. To start reading in a newsgroup,
    double-click the group''s listing.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_112_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_112_1.png)


    # View Discussion Lists


    The lists of messages for the newsgroup will appear in a Mail & Discussions window.
    Click the plus sign to the left of a subject to see the number of messages about
    a subject. Click Reply to reply to the current message. Click New Msg to post
    a new message to the group. When finished, open the File menu and then Select.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_112_2.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_112_3.png)


