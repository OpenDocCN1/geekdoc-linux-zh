  md: '# How to Use KJots


    This task shows you how to quickly take notes with the KJots program. Use this
    program to jot down information and save indexed notes in different "books" on
    your hard drive. You should know that although you can save a lot of information
    using KJots, it''s not a word processor[md]but you save notepaper!


    # 1 Start KJots


    Click the Utilities button on your desktop''s panel and click KJots.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_207_0.png)


    # 2 Create a New Book


    The KJots window appears. Open the File menu and click New Book.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_207_1.png)


    # 3 Name the Book


    Click the Book Name field and type a subject, date, or other mnemonic (such as
    Pets) for your new KJots book and click OK.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_207_2.png)'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# # Enter a Subject


    Click the blank field next to the book''s name and enter a short, more specific
    subject, such as Feeding Schedule. Next, click the blank field and type your node.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_208_0.png)


    # # Add a Page


    Open the Edit menu and click New Page to add a page to the current book. Repeat
    the previous step with a different subject and text.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_208_1.png)


    # # Save Book and View Subjects


    When you''ve finished taking notes, press Ctrl+S, or open the File menu and click
    Save Book. To view the list of subjects for the current book, click the Subject
    List button. A Kjots dialog appears with a list of subjects. Double-click a subject
    to add more text, or click Close.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_208_2.png)


    # # How-To Hints


    # ## Kjots Keyboard Quickies


    Press Ctrl+A to add a new subject, or page, to the current book. To switch to
    different subjects, click the Next or Previous buttons in Kjots''s toolbar. To
    show the list of subjects in the current book, press Ctrl+L.


    Periodically check http://www.kde.org to see if a newer version of Kjots has been
    released.


    # ## Other Features


    Kjots also has HotList feature that you can use to switch to different books.
    Open the Help menu and click Contents to read about how to use this and other
    features.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_208_3.png)


    # End


    HOW TO USE KJOTS 195'
