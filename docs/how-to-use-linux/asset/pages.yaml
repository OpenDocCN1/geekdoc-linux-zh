  md: '# # Click the Mouse Icon


    Click the Mouse icon in the left-hand panel to open the Mouse control panel in
    the KDE Control Center. Adjust the Acceleration or Threshold controls by dragging
    the slider. The Acceleration slider controls how quickly your mouse moves across
    your display, whereas the Threshold slider controls how fast your cursor moves
    before clicking. Normal values are 2 for Acceleration, and 4 for Threshold. To
    use your settings immediately, click the Apply button.


    # # Set the Mouse for Lefties


    If you''re left handed, the Left Handed radio button under the Button Mapping
    section. This reverses the left and right mouse buttons. To use your settings
    immediately, click the Apply button.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_42_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_42_1.png)


    # Setting Your Cursor


    Although you won''t find a cursor-appearance control program with KDE (yet), you
    can use the xsetroot command from the command-line of a kvt terminal to change
    how your cursor looks. For example, to change your cursor like this: `xsetroot
    -cursor_name sailboat` (the default cursor name is X).


    # Settings with the xsetroot client


    Using a mouse and KDE''s graphical dialogs to control your keyboard and mouse
    is More experienced and intuitive for Linux users will use the xsetroot program
    from the command line of a terminal to control numerous set-Num Lock states).
    For example, to turn off keyboard repeat, use `xset r off`. To turn back on, use
    `xset r on`.


    # Manual Mouse Mapping


    If you find it more convenient, you can also use the xmodmap command from the
    command line of a kv terminal to quickly remap your mouse''s buttons. For example,
    left-handed users can use xmodmap with -e (execute) option to reverse the left
    and right mouse buttons, like this: `xmodmap -e "pointer 3 2 1"`. Use xmodmap
    with -pp option to show the current mouse button map.


    HOW TO CONFIGURE YOUR KEYBOARD AND MOUSE'
