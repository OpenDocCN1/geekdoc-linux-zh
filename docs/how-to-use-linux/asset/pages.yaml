    on the right side of the screen). In the dialog that appears, click Uninstall.
    If you would like to uninstall to see whether removing this package can cause
    other programs to work, click Test and then Uninstall.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_58_0.png)


    # 5 Start Package Install


    Open your computer''s CD-ROM bay, and insert your OpenLinux CD-ROM. Type `mount
    -c /mnt/cdrom` to mount the CD-ROM, and then choose from the File menu. The kpackage
    Install dialog appears. Erase the Location entry, `/mnt/cdrom/Packages`, and RPM.
    Enter to see the list of packages and click the tape rim file, then click OK.


