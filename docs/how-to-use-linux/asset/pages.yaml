    a Help menu in the menu bar of each KDE''s window. One of the most helpful programs
    in the KDE collection is the kdehelp client. You can use it not only to find out
    about KDE and its programs, but also to find out about OpenLinux. To open the
    KDE Help window, click the Application Starter button on your desktop panel, and
    then click the KDE Help menu item.


    # Navigate KDE Help Pages


    To go to an index of different KDE clients, click KDE application help index.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_71_0.png)


