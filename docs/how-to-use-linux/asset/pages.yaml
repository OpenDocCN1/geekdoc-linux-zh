    task you''ll need to perform in Linux—the first operating system to effectively
    manage Microsoft Windows.


    +   * Install and use Linux to your home or office computer

    * Connect to the Internet, send and receive faxes, word process, and get started
    with StarOffice.

    * Capture and create graphics, play music, watch TV, and play games.


