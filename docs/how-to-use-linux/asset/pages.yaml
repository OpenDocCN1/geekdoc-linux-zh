  md: '# Set Grid Lines or a Variation


    Click the X Axis, Y Axis, or Z Axis boxes to add lines to your chart. If you want,
    click a chart variation, and then click the Next button to continue. Note that
    you can also return to previous dialogs if you change your mind about the chart;
    simply click the Back button.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_164_0.png)


    Click


    # Set Chart Title


    Enter a name for your chart in the Chart Title field. You can also add titles
    to the X, Y, or Z axes. To add a legend, click the Yes radio button, and then
    click the Create button to help StarCalc draw your chart.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_164_1.png)


    Click


    Click


    # Preview, Move, or Resize Your Chart


    The chart appears in your spreadsheet. Click in a blank area of the spreadsheet,
    and then click the spreadsheet again to enable the chart''s eight anchor points.
    To resize your chart, click and drag an anchor point while holding down your left
    mouse button. To delete your chart, press the Backspace key or Delete button when
    the anchor points are displayed. When finished, save your spreadsheet by selecting
    Save from the File menu.


    # How-To Hints


    # Changing Chart Fonts


    You can change the font used in your chart by right-clicking the chart element
    whose font you want to change. For example, if you want to change the font of
    the chart''s title, click the title to select, right-click, and choose Object
    Properties from the pop-up menu. A title dialog appears. Click the Character menu
    and set the font, style, size, and color of this font. This also works for the
    legend. To change the fonts, use the Format menu, choose Axis, and then click
    the axis for which you want to change.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_164_2.png)


    # Using Different Chart Views


    Three-dimensional charts are attractive, but sometimes they need to be rotated
    or stretched to display data. To change the view of your chart, use the Format
    menu and choose 3-D View. A 3-D View dialog appears. Change the X-, Y-, or Z-axis
    orientation by increasing or decreasing the degree of the angle.


