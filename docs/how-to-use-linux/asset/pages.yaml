    Start the display command, specifying the name of a graphic image like so: display/usr/share/ghostscript/4.03/examples/tiger.ps
    Press Enter. When the graphic appears, click the image to display ImageMagick''s
    menu and choose Print from the menu.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_202_1.png)


