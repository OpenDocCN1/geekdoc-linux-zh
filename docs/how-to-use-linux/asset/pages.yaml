  md: '# # Read HTML with Netscape Navigator


    The Navigator component of Netscape''s Communicator suite of Internet tools can
    be used to open and browse local HTML files. Type `netscape` followed by the path
    to a file, like: `/usr/doc/html/index.html`. Netscape has the most features of
    any browser included with OpenLinux.


    # # Read PostScript with gv


    From the command line of a terminal window, type `gv`, followed by the path to
    a PostScript document like: `gv /usr/doc/xv-3.10/xvdocs.ps`. To scroll around
    a page, use the sliding box your cursor under the Save Marked entry on the main
    window. Click and drag the box to scroll the currently displayed page. Scroll
    through the document, press the Spacebar. To move backward, press the B key.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_76_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_76_1.png)


    # ## A Foxy Trick Using Lynx


    Did you know that the Lynx browser can be used to read Usenet newsgroups? This
    browser is full of tricks, including one you can get the contents of a Web page
    without loading the page to your display! Pick a favorite Web site that displays
    updated information. On the command line, type `lynx`, followed by the page''s
    URL, and the Lynx `-dump` option to retrieve and save the information to a file
    like: `lynx http://www.yahoo.com/headlines/news -dump > news.txt`.


    # ## Wait a Second! gv Can Read a Compressed Document!


    That''s right. The gv client decompresses and displays compressed PostScript documents.
    It also tries to do a credible job of handling PDF files! Read the gv manual page
    for more info.


    # ## The Default Navigator Home Page


    The Calder folks must like Netscape as much as many Linux users. When you start
    Netscape, its home page is configured to `/usr/doc/html/index.html`, a great starting
    point to learn about OpenLinux!'
