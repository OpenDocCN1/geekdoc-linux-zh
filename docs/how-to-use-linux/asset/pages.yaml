  md: '# TASK 2


    # Begin


    # How to Manage Your Users


    # 1 Start the usercfg Client


    When you install OpenLinux, you are in charge of the system. Your job is to protect
    Linux from people sitting at your computer''s console, calling on a phone line,
    or logging through a network. This task shows you how to add and change passwords
    to your system.


    Log in as the root operator and start the usercfg command by typing usercfgs.
    The main dialog appears. Click Add.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_55_0.png)


    # 2 Add a User


    # 3 Configure Password Management


    In the Edit User definition, enter the new user''s username (the name typed at
    the OpenLinux login prompt), full name, office location (or other information),
    office phone, home phone (or other information), and pathname of the user''s shell.
    Use the Shell drop-down list to select the shell to be used when the user logs
    in. When finished, click Shadow.


    In the Edit Account Management dialog, enter a number (in days) to control how
    the user''s passwords are handled. When finished, click Done in the Edit Account
    Management dialog, and again in the Edit User Definition dialog, click Save.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_55_1.png)'
