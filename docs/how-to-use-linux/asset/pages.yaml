    # What Is KDE?


    KDE is a collection of programs, including an X11 program, or client, called kwm.
    The kwm client is a window manager, and used to control and manage your desktop
    during your session. See Chapter 3, "Getting Started with the K Desktop Environment,"
    for more information.


    # What Is X11?


    The X Window System, known as X11 or X, is a collection of software that includes
    programs, fonts, documentation, and critical servers. This graphical interface
    system can be used on a standalone desktop or laptop or set up to provide graphics
    across a network. Getting X to run on your computer is critical to enjoying software
    as KDE, OpenLinux can also be used productively without X. See Chapter 2 for more
    information about X.


