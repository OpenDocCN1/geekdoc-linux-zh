    Right-click the knot window, and then click Operations | Alarm. To set an alarm,
    click the appropriate buttons up and down triangles for the day, month, year,
    and time, and then click Set. When the alarm triggers three times and a small
    dialog with a notification appears. KNotes also starts and shows you your note.


