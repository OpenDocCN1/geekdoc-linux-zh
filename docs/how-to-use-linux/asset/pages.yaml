  md: '# How to Manage the StarOffice Desktop


    The StarOffice desktop is the main interface for StarOffice and its component
    programs. This section introduces you to different desktop elements and shows
    you how to start a StarOffice project.


    # Explore the Desktop


    The desktop includes a menu bar along with a function bar, which contains a text
    field showing a path or Web address, followed by various buttons and controls.
    The left area of the desktop, called the Explorer, lists StarOffice''s programs
    and documents. The work area, the large area of the StarOffice desktop, contains
    numerous links.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_139_0.png)


    # Show the Beamer


    You can use the Beamer to view the contents of directories or graphics listed
    in the Explorer window. To open the Beamer, click the Beamer icon.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_139_1.png)


    # View Graphics


    Click the plus sign in front of the Gallery. A list of StarOffice''s categories
    drops down; click a category, such as Flags & Maps.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_139_2.png)'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# # Create a Project Folder


    To help organize your work, StarOffice supports the grouping of related files
    into folders, or directories. Create your first project folder by clicking a blank
    area of the work area. A pop-up menu appears; select **New** and **Folder**. When
    the folder appears in the work area, give it a name, such as *Project*. If you
    make an error typing, right-click the folder and select **Rename** from the pop-up
    menu


    # # 5 Put the Folder into the Explorer


    The next step is to put the folder into the Explorer. Using the Explorer is a
    handy way to view and access the contents of your project folders. To put your
    new folder into the Explorer, select your folder in the work area and, holding
    down the mouse button, drag and drop into a blank area of the Explorer window.
    Your folder disappears from the work area but is available in the Explorer.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_140_0.png)


    # # 6 Create a Document


    Double-click your project folder in the Explorer, and the work area clears. To
    create a new document in your project folder, right-click in your project''s work
    area, select **New**, and click document. A Writer text document appears in the
    work area; try typing text in the document.


    # # 7 Save Your Document


    To save your document, press Ctrl+S, or open the **File** menu and choose **Save**.
    A dialog appears, asking you to enter a file name. Enter a file name, such as
    *mydocument*, and click the **Save** button. To save your new document, open the
    **File** menu and click **Close.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_140_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_140_2.png)


    HOW TO Manage the StarOffice Desktop 127'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# # How to Manage the StarOffice Desktop Continued


    # # 9 Move Documents


    To move a file from your work area to a different folder, select the file and
    drag and release in a different folder in the Explorer. Select a file, but hold
    the Ctrl key when you drag and release. You can also copy files from other directories
    (filesystems) in your OpenLinux directory by navigating through the Workplace
    folder in the Explorer. StarOffice asks you to confirm if move and copy operation
    would overwrite a file.


    # # 8 Copy a Document


    After you save your document, its icon appears in your work area. To make a copy
    of your document, right-click it, and select Copy from the pop-up menu. Right-click
    in a blank area and click Paste from the pop-up menu. A copy of your document
    appears in the work area.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_141_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_141_1.png)


    # # 10 Delete One or More Documents


    # # 11 View the Trash


    To delete a single document, right-click it select Delete from the pop-up menu.
    To delete several documents, use multiple selection by holding your mouse button
    down in a part of the work area and drawing a rectangle around the documents.
    right-click one of the documents and select Delete from the pop-up menu. A Confirm
    All to delete all documents or Yes to delete one document at a time.


    Deleting StarOffice is relatively safe, because you''ll get a second chance if
    you need to retrieve a deleted document (drag out of the Recycle Bin). To see
    what files are in the trash, select the Recycle Bin in the Explorer, and then
    click the Beamer on the Function bar.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_141_2.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_141_3.png)


    128 Chapter 11: GETTING STARTED WITH StarOffice'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# # Empty the Trash


    After you''ve worked with StarOffice for some time, you might need to reclaim
    disk space taken up by documents sitting in the Recycle Bin. To empty the trash,
    right-click the Recycle Bin and select **Empty Bin** from confirming that you
    want to continue with the dialog. If you want to delete a file from the Recycle
    Bin without viewing the confirmation dialog, select **Empty Immediately** instead
    of **Empty Recycle Bin**.


    # # How-To Hints


    ## Need a Bigger Work Area?

    Use the **Explorer** (to the left of the Beam button) on the Function bar if you
    need more room for a document or your work area. You can also shrink the Explorer
    by moving mouse cursor to the right edge of its window. When your cursor changes
    from an arrow to a vertical bar with a left and right arrow, hold your left mouse
    button, and drag the right edge of the Explorer window to the left to make more
    room.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_142_0.png)


    # ## Where''s My Document?


    If you click the **New** button at the bottom of the screen''s desktop, your document
    is created in the default work folder. If you select **File | New | Document**,
    the document is also created in the work folder. To make sure a folder or document
    in your project folder, create the file or folder by right-clicking a blank area
    in your work area.


    ## Using the Keyboard Versus the Mouse

    StarOffice supports numerous keyboard commands. To access the desktop''s menu
    bar, hold the **Alt** key and press the first letter (usually underlined) of the
    desired item. For example, to drop the **File** menu, press **Alt+F**. You can
    then use your cursor keys to navigate across or up and down menu bar, or you may
    type the first letter of a desired menu item (if it is underlined). To unselect
    a menu, press the **Esc** key. If you have several open documents, switch between
    them using the **Ctrl+Tab** key combination.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_142_1.png)


    # End'
  merge: -1
