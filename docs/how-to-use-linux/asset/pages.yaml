  md: '# CHAPTER 5


    # Getting Help


    You can find lots of help when using OpenLinux. Some programs have helpful pop-up
    tips, whereas other applications have built-in help menus—and nearly every command
    has a corresponding manual page. Help files for programs and procedures are literally
    scattered all over your OpenLinux file system. You can find help files, manual
    pages, and documentation under the following directories:


    +   - /usr/man More than 10 directories of manual pages for nearly 3,000 programs,
    system-files, and programming functions

    - /usr/info Nearly 500 hyperlinked GNU info files

    - /usr/doc More than 400 directories of program documentation, with 200 HOWTOs

    - /usr/X11r/man More than 1,200 files of manual pages


    Sometimes the problem is having too information! To compound this overload, you
    can find information in all sorts of different formats, such as compressed text,
    HTML, PostScript, or scrot (used to format manual pages). This chapter shows you
    how to find the answers you need, and how to read these different documentation
    file formats. Note: This chapter assumes you use KDE (discussed in Chapters 2,
    "Getting Started with the X Window System," and 3, "Getting Started with the KDE
    Desktop Environment") for your X sessions!'
