    # Time Stamping Made Easy


    You can quickly and easily insert the current date and time—as well as other bits
    of information—into your document. Open the Insert menu, choose Field, and click
    Other; you''ll find more than 30 different statistics and bits of information
    that you can paste into your document.


    # Feel the Need for Change?


    Don''t like the personal information StarOffice uses when it creates your customized
    letters? You can change your information by opening the Tools menu, choosing Options,
    and clicking General. Click the User Data tab in the General Options dialog ;
    you can then edit your personal information.'
