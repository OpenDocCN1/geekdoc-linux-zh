  md: '# APPENDIX


    # Adding Miscellaneous Hardware


    T his appendix gives you some pointers on how to configure OpenLinux to support
    hardware such as an internal sound card, external Iomega Zip drive, or 3Com Palm
    Computer. You can find support for many different types of hardware and add-on
    for peripherals you can use with OpenLinux. However, finding out how to add hardware
    or configure OpenLinux for sound can initially confusing.


    The first place to look for technical information is Caldera''s Web site. You
    can find the latest tips, hints, and fixes for configuring OpenLinux to work with
    your computer. Browse to http://www.calderasysystems.com/support/index.html for
    starters. For technical information, try http://www.calderasysystems.com/techguide.html.
    You can find information about how


    +   * Use a true PostScript printer with OpenLinux

    * Rebuild the Linux kernel

    * Install Linux via your computer''s parallel port

    * Configure OpenLinux for sound

    * Set up OpenLinux for dial-in networking

    * Set up OpenLinux to connect to your Internet service provider


    Unless you have an off-board or home-built PC, chances are good that other OpenLinux
    users have asked the same questions you might ask as a new user. You definitely
    should read the Usenet newsgroup alt.os.linux.caldera to learn new tips, tricks,
    or traps when using OpenLinux. To participate in discussions about OpenLinux by
    electronic mail, see Appendix C, "Internet Resources for Linux and OpenLinux,"
    for directions on how to subscribe to the caldera-users digest.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_268_0.png)'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Configuring OpenLinux for Sound


    OpenLinux uses loadable code modules to provide sound support for your computer.
    One of the first things you should do after logging in and configuring the X Windows
    System for your display is to configure OpenLinux to support sound.


    Fortunately, most computers today follow common protocols when playing sound.
    You should be able to easily configure OpenLinux to play sound through your computer''s
    sound card. And if your computer doesn''t have a sound card, you can rebuild the
    Linux kernel to play sound through your computer''s speaker (granted, the sound
    is pretty tiny, but it''s better than nothing).


    # Load Sound Modules


    OpenLinux comes with at least 17 loadable code sound modules, found under /lib/modules/2.0.xx/sound
    directory, where xx is the version of your OpenLinux kernel (or the output of
    the uname command with the -r option). Before you begin, you need to find and
    write down the i/o port address, IRQ, DMA channel numbers, and i/o port addresses
    for any other sound subsystems for your computer.


    Log in as the root operator. At the command line of your console or X11 terminal
    window, use the insmod command to load the sound kernel modules. This procedure
    should work for most computers with SoundBlaster or equivalent cards. Type the
    following (the example works with a Compaq Presario 1240 laptop), replacing the
    io, irq, -dma, and mpu values with those of your computer- er:


    ```

    insmod sound

    insmod uart401

    insmod sb=0x220 irq=5 dma=1,0 mpu_io=0x330

    ```


    # Test Sound


    Use the play command to test your sound card, like this

    play /usr/share/sounds/dingdong.au


    If you''ve installed StarOffice4.0, try this


    ```

    play HOME/Office40/gallery/sound/kongas.wav

    ```'
  merge: -1
  pgno: 269
- img_proc: true
  md: 'If your sound configuration doesn''t work, or if you enter an incorrect setting,
    you must reboot Linux to restore system memory and try again. If the sound works,
    great! You can find numerous sound utilities for OpenLinux on this book''s CD-ROM.
    Some handy utilities include kmix for KDE and mixer to control the balance and
    source of your system''s sound.


    # Quick Recording


    Here''s a short recording script you can use to record sound with a built-in or
    attached microphone. The script works by using the dd command to save and convert
    a specified amount of data (in seconds) to your hard drive. Type this script into
    a file using your favorite text editor:


    ```

    echo -ne "recording"

    echo -ne $$

    echo -ne "seconds of sound to"

    echo $2.au

    /bin/dd bs=8k=$1 /dev/audio$2.au

    ```


    Save the file with a name, such as record, and use the chmod command to make the
    script executable like:


    ```

    chmod +x recordit

    ```


    First, use kmix or mixer to set your microphone''s input level. To record a sound,
    type recordit, followed by a number in seconds, and then press Enter, like this


    ```

    record 5 myfirstsound

    ```


    The script responds with

    recording 5 seconds of sound to myfirstsound

    5+0 records in

    5+0 records out


    Play the sound by sending it to your audio device like this


    ```

    cat myfirstsound.au ~/dev/audio

    ```


    # An Easier Way


    Of course, there''s an even easier way to configure OpenLinux for sound. Browse
    to http://www.opensound.com/linux.html. You can find detailed technical procedures
    for manual sound configuration, or you can use the commercial version of the Open
    Sound System for Linux, which supports more than 200 sound cards (and saves you
    a lot of time and effort).


    For a small amount of information about playing sound through your computer''s
    speaker, read the Sound-HOWTO, found under the usr/doc/HOWTO directory. To download
    the latest release of the PC Speaker software (pcsndrv-1.0.tgz), browse to http://metalab.unc.edu/pub/Linux/kernel/patches/console.


