  md: '# How to Install, Configure, and Use RealPlayer


    You can use the RealPlayer from Real, Inc. to listen to live radio or watch TV
    from all stations over the world. You need to run the X Window System and install
    Netscape Communicator from this CD-ROM before you can use RealPlayer.


    You also need to open an Internet connection and browse to http://www.real.com
    to download RealPlayer for Linux. The prompts at Real Inc.''s site, and then download
    RealPlayer (about 1.6MB) to your hard drive.


    # Install RealPlayer


    On the command line of a terminal window, run tar xzf rv50_linux20.tar.gz and
    press Enter. Next, run Netscape to connect and read RealPlayer''s installation
    notes by typing netscape rvplayer5.0/ index.html and press Enter.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_225_0.png)


    # 2 Configure Your Environment


    Open the .profile in your directory. If you are using pico, type pico -w .profile.
    Scroll to line and end type:


    ```

    LD_LIBRARY_PATH=$HOME/rvplayer5.0

    export LD_LIBRARY_PATH=$HOME/rvplayer5.0:"

    ```


    From the command line, read in RealPlayer''s environment variables by typing source
    .profile.


    # 3 Configure Netscape Navigator


    Choose Preferences from Netscape''s Edit menu. Click the Navigator item in the
    Category list, and then choose Options. In the Applications dialog, click the
    New.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_225_1.png)'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Add RealPlayer


    # Configure RealPlayer


    In the Description field, type the MIMEtype field, type audio/x-realaudio. In
    the Suffix field, type .rm,.ra,.ra.. Click the Application button in the Handy
    Section, and type rvplayer % in the Application field. Click OK in the Netscape:
    Application dialog and again in Netscape: Preferences dialog.


    Start RealPlayer from the command line of your terminal by typing rvplayer & Choose
    Preferences from RealPlayer edit menu. When the Preferences dialog appears, click
    the Bandwidth box, click the type of Internet connection you use (for example,
    56k Modem) and click OK. Finally, click the Exit item of RealPlayer''s menu.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_226_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_226_1.png)


    # Watch TV!


    # How-To Hints


    Log in to your ISP, start Netscape from the command line of your terminal window,
    and navigate to a Web site (such as http://www.foxnews.com) that provides RealPlayer
    video. When you click a video icon, Netscape launches RealPlayer so you can watch.


    Netscape Says It Can''t Find rvplayer!


    If Netscape says it can''t find rvplayer, the best approach after editing your
    .profile file is to log out of Linux and to log back in. Use the env command from
    the command line of your console to see whether the path to the rvplayer is listed
    and active. Make sure that you follow the directions included with RealPlayer
    for installation, and that you configured Netscape''s application preferences
    correctly. You can also try typing rvplayer rvplayer5.0/welcome.rm from the command
    line to see whether RealPlayer is working correctly on your system.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_226_2.png)


    HOW TO INSTALL, CONFIGURE, AND USE REALPLAYER 213'
