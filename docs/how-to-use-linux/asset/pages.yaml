  md: '# Confirm the Deletion


    Click Yes to delete the task.


    # Track a Task


    To track a task, click the task name in the list, and then click the Start Click
    button (alternatively, open the Click menu and click Start). To track a different
    task, click the Stop Click button and highlight another task, or click another
    task while the click is running.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_212_0.png)


