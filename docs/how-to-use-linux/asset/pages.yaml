  md: '# CHAPTER


    # Playing Games


    It''s time to take a break and relax! This chapter shows you how to play a small
    sampling of the nearly 100 games included with OpenLinux. The chapter starts with
    a selection included with the K Desktop Environment (KDE), and then introduces
    you to some traditional board games. Next you''ll see how to start and run the
    LinCity city and country simulator. At the end of this chapter, you''ll learn
    about some window action games for Linux.


    These games require the X Window System, so you need to start an X session. You
    should also configure OpenLinux to work with your computer''s sound card to fully
    enjoy the raucous sounds included with some of these games. If you haven''t configured
    X for your computer''s graphics card, see the last section of Appendix A, "Installing
    Caldera OpenLinux," to learn how. To configure OpenLinux to work with your computer''s
    sound card, read Appendix B, "Adding Miscellaneous Hardware."


