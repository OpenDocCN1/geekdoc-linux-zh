  md: '# How-To Hints


    How Much Free Hard Drive Space Do I Have?

    To find out how much free space is on your hard drive before installing StarOffice,
    use the df command from the command line of your console or a terminal window.
    This shows how much free space is on each currently mounted filesystem (or hard
    drive, CD-ROM, and so on). The values are shown in 1024-byte blocks. You can see
    how large your hard drive is, how many blocks are used, how many are available,
    what percentage of your hard drive is used, and where it is mounted. Note that
    any mounted CD-ROMs always show 0 for available space (because the CD is read-only).


    Okay, I Want to Edit My CD-ROM. How Do I Do This?

    In OpenLinux, different filesystems or storage devices such as flash memory cards,
    CD-ROMs, and different partitions, must be mounted with the mount command at a
    specific point in your filesystem, or directory structure. The traditional mount
    point is in a directory under the /mnt directory. After mounting a filesystem,
    unmount the device or partition with the unmount command, followed by the mount
    point. So, after mounting your CD-ROM at /mnt/cdrom, unmount your CD-ROM by entering
    su su command is necessary because generally only the root operator, or superuser,
    is allowed to mount and unmount filesystems under OpenLinux (although it doesn''t
    have to be this way--the mount and fstab manual pages).


    The StarOffice Desktop Is Too Small!

    StarOffice is a large complex program with many interface elements in its desktop
    display. To enlarge the desktop, either click the Maximize button in the desktop''s
    title bar or double-click a blank area of the bar. The desktop enlarges to fit
    between KDE''s taskbar and panel. Need more room? Configure to Auto Hide by clicking
    the Application Starter button, choosing Panel, and then selecting Configure Hidden
    in the Taskbar section of the Panel tab in the Panel Configuration dialog. Next,
    click the Options tab and select Auto Hide Panel and Auto Hide Taskbar in the
    Others section. When you maximize the StarOffice desktop, it uses your entire
    display.'
