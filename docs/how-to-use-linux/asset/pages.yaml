- img_proc: true
  md: '# # Open the Clip Art Gallery


    The frames appear in your document.

    Click a blank area of the document to select the form and click inside the frame
    to activate an insertion point (blinking vertical cursor). Next, click the plus
    sign to the left of the Gallery folder in the Explorer and double-click Icons
    & Symbols folder. Beamer displays the various pieces of clip art to find. To use
    a piece of clip art, scroll through the Beamer, select a desired picture, drag
    it onto the new frame, and release it.


    # # 5 Resize and Move a Picture Frame


    The picture appears inside your frame.

    Click and drag one of the eight anchor points to make your picture larger or smaller.
    When finished, click in a corner of your frame and drag the picture around your
    document. Note that the picture and any text typed into the frame go along where
    you want and finish typing your letter; then spell-check, save, and print.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_156_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_156_1.png)


    Click


    Anchor point


    End


    # # How-To Hints


    # ## My Posted Graphic Looks Funny


    The best way to resize a graphic is to use proportional resizing. Hold down the
    Shift key when you click and drag a resize anchor point in a graphic''s frame.
    Proportionally sized graphics look more natural when printed; or course, you can
    always distort the image for a special effect!


    # ## You''ll Flip Over Graphics


    If your graphic is facing towards the left, and you''d like it facing right, flip
    it! Double-click the graphic in your document and, in the Pictures dialog, click
    the Graphics tab. Select either Vertical or Horizontal to flip the art-work. Of
    course, this will not work for text (unless you are reading backwards or upside
    down).


    # ## Create Your Own Graphics


    StarOffice has numerous graphics capabilities. You can select one of thirteen
    different drawing tools from the Draw pop-up menu on the vertical toolbar to the
    left of the work area. You can import graphics files from your OpenLinux directories
    and copy and paste graphics from other StarOffice documents. See Chapter 14, "Getting
    Started with StarOffice Presentations," for more information.


    # ## How TO CUSTOMIZE A PERSONAL LETTER 143'
