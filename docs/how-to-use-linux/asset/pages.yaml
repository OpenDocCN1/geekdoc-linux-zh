  md: '# CHAPTER


    # # Connecting to the Internet


    Getting connected is an essential part of the computing experience. When you connect
    your computer to the Internet, you can send and receive electronic mail, browse
    the World Wide Web, download new software, read Usenet news, even watch TV from
    other countries! This chapter will show how to connect to your Internet service
    provider (or ISP) using the kpppp client included with KDE (KDE) is discussed
    in Chapter 3, "Getting Started with the K Desktop Environment".


    I''ll assume you use an ISP that supports the Point-to-Point Protocol, or PPP.
    Although there are a number of ways to connect to the Internet, PPP is the most
    commonly supported protocol. And Linux grows in popularity, and more ISPs are
    supporting Linux and with good reason: Linux is a great way to connect and use
    the Internet!


    You need to have a modem connected to your computer, and you need to know the
    following:


    +   - Which serial port is connected to your modem


    +   - Your account name and password for your ISP


    +   - Your ISP''s domain name (such as erols.com)


    +   - Your ISP''s domain server addresses in numerical format (such as 205.198.114.9)


    +   - How your Internet address is assigned—that is, whether it is the same all
    the time (static), or different each time you log on (dynamic)


    The methods outlined in this chapter work for many ISPs. You should know that
    there are a number of different ways to set up and connect to the Internet with
    Linux. See the How-To Hints for pointers on more information and troubleshooting.'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# TASK


    # How to Set Up Your Modem Connection


    Make sure that your modem works and that you can dial out using the Linux Support
    Team''s Installation and System Administration Utility, or LISA. You should know
    what COM port your modem uses; LISA will create a file named under the /dev directory
    that points to the correct port. COM (serial communications) ports under Linux
    have names tty0, tty1, tty2, or tty3, and are defined as devices under the /dev.
    COM1, COM2, COM3, or COM4. If you''re not sure what COM ports you have (or that
    Linux has recognized), pipe the output of the dmesg command through the fgrep
    command like this: dmesg | grep tty


    # Begin


    # Start the command line


    From the command line of your console or a terminal window, run the su program
    with -c command-line option to start the LISA utility: su -c lisa --hardware.
    Press Enter, type the superuser (or root) password, and press Enter again. LISA
    will start by opening its Hardware Configuration menu. Press the down arrow on
    your key to scroll down to the Configure Mode and press Enter to start the modem
    configuration.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_89_0.png)


    # Start the Modem Configuration


    The Modem Selection menu will appear. Again, use the arrow keys or a number key
    to highlight the type of modem you are using with OpenLinux, and then press enter.
    If you''re not sure what type of modem you have, choose Unknown modem type or
    Hayes-compatible modem.


    # Choose the Serial Port for Your Modem


    After you select your modem, you''ll be asked to select a serial port. Under OpenLinux,
