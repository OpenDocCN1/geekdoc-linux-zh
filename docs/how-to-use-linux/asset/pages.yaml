  md: '# TASK


    # Begin


    # How to Configure the KDE Panel and Taskbar


    # 1 Hide the KPanel


    Hiding the panel is a handy way to create more screen real estate. Move your cursor
    to the far left of the panel. Note the small rectangle next to the Application
    Starter (the big K) button. To hide the panel, click the rectangle. The panel
    will disappear and shrink to a vertical button. To make the panel reappear, click
    the button again.


    The KDE panel, or KPanel, is used to launch applications, control and configure
    your KDE sessions, navigate to "virtual" desktops or program windows, and log
    out of KDE. The panel has a number of controls: the Application Starter button;
    a pop-up window list; pop-up program menus; Logout, Screenlock, and Virtual Desktop
    buttons; program-launching icons show you how to add and delete panel programs,
    and how to hide, resize, or reorient the panel.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_43_0.png)


    # 2 Start the KPanel Configuration Dialog


    # 3 Reorient the KPanel and Taskbar


    If you don''t want the panel at the bottom of your display, you can put it at
    the top or left side of your screen; you specify this from the KPanel Configuration
    dialog. You can click the Application Starter button, scroll to the Panel item,
    and select Configure.


    To reorient the panel to the left side of your display, click the Left button
    in the Location section of the KPanel Configuration dialog, and then click the
    Apply button. To orient or hide the taskbar, click the appropriate button in the
    Taskbar section of the dialog. The buttons in the Style section control the size
    of the icons in the panel. Select the size you want for your display, and then
    click the Apply button.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_43_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_43_2.png)


    30 CHAPTER 3: GETTING STARTED WITH THE K Desktop Environment'
