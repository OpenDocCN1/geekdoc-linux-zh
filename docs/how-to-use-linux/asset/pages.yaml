  md: '# # Adding a Parallel-Port Zip Drive


    OpenLinux provides out-of-the-box support if you have a parallel-port version
    of the omega Zip drive (http://www.iomegaega.com). The Zip drive is a removable
    hard drive with a disk storage capacity of about 100MB, and attaches to your computer''s
    parallel printer port. The default OpenLinux kernel (boot/mlinux-2.0.XX-modular)
    provides the three necessary support mechanisms for the Zip drive:


    +   - SCSI support either compiled in or available as loadable modules

    - Parallel-printer support is a loadable module (you must be able to unload the
    lp module before a Zip disk can be mounted)

    - The ppa module is available under the /lib/modules directory


    # ## Mount a Zip Disk


    To install the ppa module and mount a Zip disk, make sure your Zip drive is properly
    connected to your computer and turned on. Log in as the root operator, or create
    a mount point for your Zip disk with the mkdir command like


    ```

    mkdir /mnt/zip

    ```


    Insert a Zip disk into the drive. Use the rmmod command to make sure the lp.0,
    or parallel printer module, is unloaded, like this


    ```

    rmmod lp1

    ```


    Use the insmod command to load the ppa module like this


    ```

    insmod ppa

    ```


    To make sure the kernel supports filenames for the vfat filesystem, use the insmod
    command to load the vfat module like this


    ```

    mount -t vfat /dev/sda4 /mnt/zip

    ```


    Then mount the Zip disk using the mount command to specify the filesystem type,
    the Zip device, and the mount point, like this


    # ## Format and Mount a Linux Zip Disk


    You can format and mount a Zip disk in Linux''s native format (although backwards
    you won''t be able to use it with "other operating system"). Create a mount point
    with the mkdir command like this:


    ```

    mkdir /mnt/zip2

    ```'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'Insert a Zip disk into its drive. Make sure the p module is loaded. Use the
    mke2fs command to format the disk like this:


    > Note: Squeezing More Space Out of Your Zip Disk


    mke2fs /dev/sda4

    Mount the new Zip disk with the mount command like this:


    mount - ext2 /dev/sda4 /mnt/zipex2


    # Printing and the Zip Drive


    You cannot print and use a parallel-port Zip drive at the same time. A workaround,
    however, is to use insmod and rmmod to load and unload the proper modules.


    You can get an extra 5MB of storage on your native Linux Zip disks using the -m
    option of mke2fs with a value of zero (0). By default, mke2fs reserves 5% of a
    volume or partition''s size for the root operator (root directory). To fully format
    your Zip disk, use the mke2fs command like this


    You can use a script called dozip to alternate between your printer and Zip drive:


    ```

    # dozip alternate between Zip disk and printing

    # assumes Linux ext2 Zip disks are mounted at /mnt/zipex2

    # assumes vfat Zip disks are mounted at /mnt/vfat

    # assumes vfat module is loaded


    # usage:

    # dozip show help

    # dozip unmount Zip, load printer module

    # dozip ext2 unload printer, mount Linux Zip disk

    # dozip vfat unload printer, mount vfat Zip disk


    #

    !/bin/bash

    option=$

    ```


    ```

    mke2fs -m /dev/sda4

    ```


    ```

    if [ $option = "h" ]

    then /bin/echo "usage: dozip [h][lp];[vfat];[ext2]"

    fi


    if [ $option = "lp" ]

    then

    # we want to print, so unmount any Zip disk

    # and load the printer module

    /bin/echo "unmounting Zip disk"

    /bin/unmount /mnt/zip >dev/null 2>&1

    /bin/unmount /mnt/zipex2 >dev/null 2>&1

