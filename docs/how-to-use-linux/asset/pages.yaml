  md: '# Getting Started with StarWriter


    StarWriter is the word processor portion of the StarOffice office-automation productivity
    suite for Linux. This program is integrated into the StarOffice desktop, and shares
    information with other parts of StarOffice, such as StarCalc or StarOffice Presentations.
    In order to use StarWriter, you need to install StarOffice and run the X Window
    System. Before you begin this chapter, take a moment to read Chapter 11, "Getting
    Started with StarOffice"; this will help familiarize you with some of the elements
    and features of the StarOffice desktop.


    This chapter introduces you to StarWriter. You start by using StarWriter''s basic
    features but then move on to more advanced tools, such as using spell check or
    the thesaurus. Finally, you will see how to create professional-looking documents
    easily using the use of templates and AutoPilot.


    Begin by starting StarOffice from the command line of a terminal window. Type
    Office40/bin/soffice & press the Enter key, and begin!'
