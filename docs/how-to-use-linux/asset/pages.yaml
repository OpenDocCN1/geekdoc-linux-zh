  md: '# How to Open, Spell-Check, and Print Your Document


    Before you begin this task, make sure that you''ve installed a printer for StarOffice,
    or you''ve identified that your printer works by printing a test page, as shown
    in Chapter 11. This task shows how to open a document, check its spelling, and
    then print it.


    # Open a Document


    There are several ways to open a document. First is to click the document''s folder
    in the Explorer, and double-click its icon in the work area. Alternatively, you
    can press Ctrl+O or select Open from the File menu, select your document from
    the Open dialog, and click the Open button.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_151_0.png)


    # Enable Auto Spellcheck


    After your open document, tell StarWriter to automatically underline any misspelled
    or suspect words by enabling Auto Spellcheck. The Tools menu, select Spelling,
    and then click Auto Spellcheck.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_151_1.png)


    # Check Spelling


    To spell-check your document, open the Tools menu, select Spelling, and then click
    Check. The Spelling dialog opens, displaying the first word. Note that this is
    also highlighted in your document. Click the appropriate button to ignore, replace,
    globally ignore, or replace the word in your document. If you are certain the
    word is spelled correctly, click the Add button to add the word to StarWriter''s
    dictionary.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_151_2.png)'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Correct Spelling


    a misspelled word or phrase, select a suggested word and then click the Replace
    button. If no suggestion appears in the Spelling dialog''s Suggestions list, either
    click Ignore, or click the Replacement field, correct the spelling, and click
    the Replace button. Continue through the document (or, if you started at the beginning
    of the document, click the Backwards check box to spell-check through to the beginning
    of the document.


    # Preview Printing


    When you finish the spell check, check the document by choosing Save from the
    File menu or by pressing Ctrl+S. To preview your document, open the File menu
    and choose Page View. Click the Close button over the work area to return to normal
    view.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_152_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_152_1.png)


    # How-To Hints


    # Spell Check Tips


    Make sure to read the Advanced Tips section of StarOffice''s help documentation
    to get the most out of spell check. Open the Help menu, and then click Contents.
    In the Explorer index in the left side of the work area, click Advanced Tips,
    and Advanced Tips for Text Documents, and finally Spellcheck, Thesaurus, and Hyphenation.


    # Added a Misspelled Word During Spell Check!


    To remove a word from the dictionary, open the Tools menu, click General, and
    then click the Linguistic tab. Next, click the middle button (called Edit) on
    the right side of the dialog. The Edit Custom Dictionary dialog appears. Scroll
    the list of words until you find the misspelled word, select the word, and then
    click the Remove button.


    # Print the Document


    To print your document, select Print from the File menu, or press Ctrl+P. The
    Print dialog lists the current printer (which should be Generic PostScript Printer).
    If you want more than one copy of your document, change the number in the Copies
    section by clicking the click down arrow. To print a portion of your document,
    enter a range of pages in the Print Range field. To start printing, click the
    OK button.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_152_2.png)


    # End


    HOW TO OPEN, SPELL-CHECK, AND PRINT YOUR DOCUMENT


    139'
