  md: '# How to Start an X11 Session


    This task shows you how to start an X11 session using different window managers.
    You learn how to start both of the default window managers, and then learn to
    configure OpenLinux to start your window manager.


    # Start X11 Using AfterStep


    At the command line of your console, type startx and press Enter. If you''ve installed
    and configured X11 properly (according to directions in Appendix A), the screen
    clears and you start your X session with the AfterStep window manager running
    the Looking Glass desktop.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_25_0.png)


    # Stop X11 Using AfterStep


    To stop your X11 session, click a blank area of the desktop, click Exit Desktop,
    and then choose Quit Desktop. You end up back at your console.


    # Start X11 Using KDE


    To start an X11 session with the KDE Environment, use the kde command. At the
    command line of your console, type kde and press Enter. If you''ve installed KDE,
    the screen clears and your X session starts at the KDE desktop.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_25_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_25_2.png)'
