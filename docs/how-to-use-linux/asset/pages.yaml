    # How Do I Put Other Pictures into My Document?


    To put a graphic (other than one from StarOffice''s Gallery folder in the Explorer)
    into your document, open the Insert menu, choose Picture, and then click From
    File. In the Insert dialog, navigate through your folders to select a picture
    and click the Open button.


    # How Many Types of Graphics Can I Use?


    You can insert one of at least fifteen types of graphics into your StarOffice
    documents, including scanned images, Macintosh graphics, and Windows bitmaps.
    Click the drop-down menu in the File type area of the Insert dialog to see the
    different types of graphics you can insert.


    # Changing Chart Data on the Fly


    If a pasted chart''s data is incorrect, you have to reopen its spreadsheet and
    go through the whole process of re-creating the chart! Select the chart''s graphic,
    and then select Edit | Object | Edit. A thin, black bar appears around the chart.
    Select Chart Data from the View menu; a dialog with the chart''s spreadsheet data
    appears. Change the desired values, and then click the Transfer data button (to
    the right of the input field). You see your chart''s graphic updated on your document''s
    page!


