  md: '# Introduction to OpenLinux


    Welcome to Linux! This book contains all the software and directions you need
    to install, configure, and run Caldera''s OpenLinux distribution. You''ll find
    easy to configure the Linux operating system, X Window System graphical interface
    software, more than 1,200 help files or HOWTO documents, and nearly 3,000 programs
    included on this book''s CD-ROM.


    Linux is the kernel or core operating system. OpenLinux is a distribution of Linux,
    specifically configured by Caldera to be easy to install, configure, use, and
    maintain. Linux has become widely popular around the last few years since its
    initial release in 1991 by author Linus Torvalds, a graduate student at the University
    of Helsinki, Finland.


    Linux is not a toy operating system. Although it is relatively new, Linux draws
    on more than one-century of heritage and experience inherited from the UNIX operating
    system. But this operating system is not just for techno-geeks and computer nerds.
    Linux can be kind and gentle yet robust and industrial-strength—it won''t let
    you down. If you have enough hardware, it will not crash.


    Want to play some awesome games? You''ll find more than 200 included in OpenLinux.
    You will need a word processor? There are nearly a dozen on in this book''s CD-ROM.
    How about using a spreadsheet? In fact, you''ll need to choose among several.
    You''ll also get the complete integrated office suite, StarOffice, Star Division,
    which includes word processing, spreadsheet, and graphics applications.


    Want to learn how to run a Web site? All software you need is included. Want to
    learn programming? You''ll find compilers and interpreters


    for C, C++, FORTRAN, Perl, Java, Lisp, Python, Tcl/Tk, BASIC, Pascal, and more.
    Want to set up a computer network at home or in the office? All software you need
    is on this book''s CD-ROM.


    Graphics artists will appreciate the GNU Manipulation Program, or GIMP, which
    has features rivaling those of commercial graphics programs. Math and science
    students will find it worth modeling, simulation and plotting software. If you''re
    busy and on-the-go, OpenLinux includes database and personal information programs
    to keep you organized. And if you have a 3Com Palm computer, you''ll find support
    with the included pixfer suite of games.


    Start by following the instructions in Appendix A, "Installing Caldera Linux."
    After you install Linux, this book will help you learn how to configure and use
    Linux. Step-by-step instructions will show you


    +   - How to start and shut down Linux


    +   - How to start the K Window Desktop Environment


    +   - How to configure your computer''s desktop


    +   - How to read manual pages and program documentation


    +   - How to manage windows and programs


    +   - How to back up and install or remove software


    +   - How to connect to the Internet


    +   - How to create text and graphics documents


    +   - How to set up a printer and print text and graphics


    +   - How to use the StarOffice suite of programs


    +   - How to play games and music CDs'
