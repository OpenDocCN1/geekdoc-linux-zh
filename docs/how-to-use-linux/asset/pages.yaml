  md: '# How to Import and Export a Document


    Besides quickly creating complex documents, StarWriter can also read, or import,
    documents from different types of word processors. You can also use StarWriter
    to export, or save, your document in different formats. This task shows you how
    to import and export documents in several different formats.


    # Select a Document Filter


    If StarWriter is not sure about the file''s type, it shows the Select Filter dialog,
    listing different types of documents. Scroll through the list to select the correct
    type, and then click OK.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_157_0.png)


    # Import a Foreign Document File


    Start StarOffice and click the Work folder in the Explorer. StarOffice documents
    are represented by a icon with a vertical blue stripe. Word-processing document
    icons can be recognized and shown. To open a foreign document, double-click its
    icon.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_157_1.png)


    # Edit a Foreign Document


    After the document opens, edit the text as needed. You can use any StarOffice
    tools with the new document, such as formatting, styles, or drawing.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_157_2.png)


    CHAPTER 12: GETTING STARTED WITH STARWRITER'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Export a Document


    To export a StarWriter document to another file type, open the document, and then
    open the File menu and choose Save As. The Save as dialog appears. To export your
    document, open the File type drop-down menu (click the small black arrow at the
    end of the File type) and scroll through it until you find the file type you want
    to save the document. Note that if the Automatic Name Extension box is checked,
    a period and three-letter extension are appended to the document''s name. Rename
    the document if you''d like, and then click the Save button to export it.


    # Export an HTML Document


    StarWriter can import Hypertext Markup Language, or HTML documents. However, your
    choices are somewhat limited when exporting an HTML document, such as the Linux
    Commercial-HOWTO, and select Save As. Click the File drop-down menu. Note that
    you can export HTML documents to more limited number formats.


    Save as:


    ```

    /usr/local/HOWTO/other-formats/html

    ```


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_158_0.png)


    | File Name | Size | Type | Created | Modified |

    | --- | --- | --- | --- | --- |

    | HOWTO-1.html | 9 KB | Document | 5/10/98 12:53:45 AM | 5/10/98 12:53:45 AM |

    | HOWTO-2.html | 5 KB | Document | 5/10/98 12:53:44 AM | 5/10/98 12:54:19 AM |

    | HOWTO-3.html | 5 KB | Document | 5/10/98 12:53:43 AM | 5/10/98 12:54:19 AM |

    | HOWTO-4.html | 2 KB | Document | 5/10/98 12:53:42 AM | 5/10/98 12:42:22 PM |


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_158_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_158_2.png)


    # How-To Hints


    # How Do Get Files into the Work Folder?


    In order to open files directly from the Work folder, you must first navigate
    to the folder and then copy files into it. If you use KDE, drag files from the
    desktop or other folders into the Office4/explorer/Work folder. To do this from
    the command line, use the cd (change directory) command like, where your username
    is the name of your home directory: /home/username/


    Then, use the cp command to copy files into the Work folder like so: cp /wheretheisfile/filename
    (wheretheisfile is the directory path and filename of the document). The period
    (.) means to copy the file here, or the current directory.


    # How Many Types of Documents Can I Read?


    StarOffice can read at least 68 different types of documents (Undoubtedly, by
    the time you read this, more document types will have been added.) Do you need
    to use all types of documents? Most people won''t. If you plan to trade documents
    with other people, stick to a document format most word processors (even on other
    computer operating systems) can read: Rich Text Format, or RTF. You''ll still
    be able to use many formatting features, and there''s a much smaller chance of
    losing formatting with other document types.


    HOW TO IMPORT AND EXPORT A DOCUMENT 145'
