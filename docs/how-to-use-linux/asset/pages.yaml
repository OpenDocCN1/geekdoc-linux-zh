  md: '# How to Customize a Personal Letter


    Now that you know how to create a letter from a template, you''ll now see how
    to customize a personal letter with a graphic or other information.


    # Select a Template


    Open the File menu, select New, and choose From Template. When the New dialog
    appears, select the Personal Correspondence entry in the Categories list and choose
    Personal Letter in the Templates list. Click OK.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_155_0.png)


    # Insert a Frame


    A blank personal letter, with your address, fills the work area. To make room
    for a graphic in the upper left corner of your letter, you must insert a frame.
    Open the Insert menu and click Frame.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_155_1.png)


    # Configure the Frame


    In the Frame dialog, select the width and height of the graphic in the Size section
    and select the appropriate position for your frame. The preview shows where the
    frame will appear in the document window or work area. You can set various options
    by clicking the appropriate tabs at the top of the Frame dialog. When finished,
    click OK.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_155_2.png)'
