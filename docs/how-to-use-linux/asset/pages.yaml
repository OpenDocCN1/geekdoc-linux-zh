  md: '# Review Data


    The pasted spreadsheet data appears in a box with eight anchor points. You can
    resize the pasted data like a graphic by clicking and dragging the different points.
    Move the pasted data by pressing the left mouse button and boxing the data around
    the page.


    # Edit Data


    You can edit the data! Double-click your left mouse button on the pasted data;
    StarCalc window appears over your document''s page. You can make changes to the
