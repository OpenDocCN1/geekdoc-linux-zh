  md: '# # How to Play a Music CD


    Playing music CDs with Linux is not only easy, but also convenient and fun! This
    task shows you how to use ksd player. It''s best to have access Internet connection
    when you use ksd (although you don''t have to). Why? If you do, when you insert
    a CD and start ksd, the player goes out to Internet, queries a remote computer,
    and retrieves the name of your music CD, the artist''s name, the number of tracks,
    and the name of each track. You can save this information on your hard drive.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_217_0.png)


    # ## 1 Detect the CD-ROM Device


    Make sure that OpenLinux found your CD-ROM drive when you started Linux. On the
    command line of X11 window, type dmesg | Scroll through the information until
    you find a section that is the circled below.


    The hdc: TOSHIBA CD-ROM XM-19828, ATAPI cdrom drive line that matches /dev/hdc
    represents your CD-ROM drive. If you have a SCSI device, the device list is different.


    # ## 2 Look for cdrom in the /dev Directory


    Check to make sure a device named cdrom exists in the /dev directory by typing
    ls -l /dev/cdrom. The dev/cdrom -> /dev/hdc portion of your output indicates that
    the default CD-ROM device correctly points to your CD-ROM drive.


    # ## 3 Check the Settings


    Just to make sure that everything is correct, use the chmod command to change
    the permissions of your CD-ROM so that you can read your CD. Typing su - chmod
    664 /dev/cdrom runs the chmod command as root and sets your CD-ROM device to the
    correct permissions (otherwise, you will get an error from the CD player software).


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_217_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_217_2.png)


    CHAPTER 18: PLAYING MUSIC AND WATCHING TV'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# # 4 Start ksd Player


    Before you begin, connect to your ISP, and start X. Open your computer''s CD-ROM
    bay and insert a music CD. Next, click the Application Starter on your desktop,
    choose Multimedia, and select ksd Player.


    # # 5 Select the Artist and Title


    The ksd player automatically goes out to the Internet and tries to locate your
    CD''s artist and title. You don''t have to do anything! In the Ksed dialog, click
    the CD from the list and then click the OK button.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_218_0.png)


    # # 6 View ksd Controls


    The ksd main window appears. Note that the artist and title of your CD appears
    in the window; also note that ksd has many of the familiar controls of a hardware
    audio CD player, including the Play, Stop, Previous Track, Next Track, and Eject
    buttons, and a sliding volume control. Click the Play button to start playing
    your CD and click the Configure to set various options.


    # # 7 Configure ksd Remote Search


    When the ksd dialog appears, note that the Enable Remote CDDB is selected. If
    ksd has trouble connecting to a remote Internet database, a different server in
    the CDDB Server list. If you don''t want ksd for database entries, deselect the
    Enable Remote CDDB button.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_218_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_218_2.png)


    How TO PLAY A MUSIC CD 205'
