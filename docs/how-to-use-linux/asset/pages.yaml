  md: '# Check Fax Status


    To check to see whether faxes have been used, use the fax command''s queue option
    (type fax queue and press Enter). The fax command lists any files in the /var/spool/fax
    directory. Each page of the fax document is a separate file. The first part of
    the filename (representing the day, month, hour, minute, and second) of each is
    the same, but each has a different extension. For example, the first page of a
    two-page fax received November 24 at 1:57 p.m. is named 1214135748.001, whereas
    the second page is named 1214135748.002.


    # View a Fax


    To view a fax, you must run the X Window System. Start an X11 terminal program,
    and use the fax command''s view option, followed by the name of a fax page, to
    read a fax. Using the previous step, you''d type fax view 1214135748.001 and press
    Enter. The command automatically launches the xv graphics client to display your
    fax.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_120_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_120_1.png)


    # Print a Fax Document


    # How-To Hints


    To print a fax, use the fax command''s print option, followed by the name of your
    fax document. Your printer must be configured to work with OpenLinux. Make sure
    your printer is connected to your computer and turned on, type fax print 1214135748.001,
    and press Enter.


    Omit the -l option to send faxes at a higher resolution. The low resolution is
    98 lines per inch (completely adequate for text documents). The high resolution
    tries to send your document at 200 lines per inch. Fax resolutions depend on the
    capabilities of the sending and receiving mediums, so check your modem manual
    for more information.


    # How Do I Deleted Faxes?


    Use the fax command''s rm option, along with the name of your fax document. Use
    the asterisk wildcard to delete all the pages of a fax by typing fax rm 1214135748.*
    and pressing Enter. Do not use the rm option without a filename, or you could
    delete all the files in the current directory!


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_120_2.png)


    End


    HOW TO FAX WITH OPENLINUX


    107'
