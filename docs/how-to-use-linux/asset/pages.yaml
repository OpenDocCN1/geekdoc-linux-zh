  md: '# Move a Panel Application


    To move an application or menu on your panel, right-click the application''s menu
    icon and select Move from the small pop-up menu that appears. Then, holding your
    left mouse button, drag the icon to the left or right, and release when the icon
    is where you want it to be. Note that any icons to the right of the moved icon
    will shift to the right to make room.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_46_0.png)


    # Change Tooltips


    To change the pop-up text, or tooltip, displayed by a panel application, right-click
    the program''s icon, and click Properties. In the kfm dialog, click the Application
    tab. Click and enter new text in the Comment field, and then click OK.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_46_1.png)


    Click & Drag


    Release


    End


    # How-To Hints


    # The KPanel: a Moving Experience


    All items on your panel can be moved, including the desktop group of buttons.
    Simply right-click the desktop buttons and drag them where you want. Unfortunately,
    the Logout and Screenlock buttons will go along for the ride!


    # Orientation Can Organize Your Panel


    The default horizontal panel puts the Application Starter and other system utilities
    on the left, with important programs on the right. This might not be what you
    want, especially if you use your panel vertically. Think carefully before arranging
    your panel applications and menus.


    # Manual Configuration


    If you''re an experienced user, you can configure the panel by editing a file
    called kpanelrc, found in your home directory ~/.kde/share/config.


    To Change THE KPanel 33'
