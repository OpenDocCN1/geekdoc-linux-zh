  md: '# How to Create, Format, and Save a StarWriter Document


    This task leads you through the basic steps of creating, formatting, and saving
    your first StarWriter document.


    # 1 Create a Document


    Double-click the New Document icon in the StarOffice desktop.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_149_0.png)


    # 2 Enter Text


    Click in the blank page and start typing. Note that the ruler over the work area
    is used to set margins and tab stops, and the formatting toolbar is used to set
    the font, font size, attributes (such as bold, italic, and underline), justification
    (as left, centered, right, or filled). The vertical toolbar to the left of the
    work area is used to insert tables, fields, graphics, or drawn objects; start
    search and replace; show spell checking; do show hidden characters; and perform
    other actions.


    # 3 Highlight Some Text


    One way to format your text is to highlight it and select the appropriate toolbar
    icon. Another way is to right-click the text and select the attributes from a
    pop-up menu. Double-click to select a word; triple-click to select a line. To
    select the end of a line, press Shift+End. To select multiple lines, click an
    insertion point and, holding your mouse button, drag up or down to highlight the
    desired text.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_149_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_149_2.png)


