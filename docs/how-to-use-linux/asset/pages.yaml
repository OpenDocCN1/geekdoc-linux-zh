  md: '# Begin


    # How to Print Graphic Images


    # 1 Select Print Mode with xv


    Many different programs included with OpenLinux print graphics. This section shows
    you how to print graphic files using three different applications. You see how
    to preview PostScript graphics and prepare other files for printing.


    Start xv and load a graphic file. The graph-ic image appears onscreen. Right-click
    the image to see the xv controls dialog and click the Print but-ton. In the xv
    prompt dialog, click a print mode, such as grayscale.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_201_0.png)


    xv- a command which wrapped a file from stdin and prints it to the desired printer.


    ```

    xv -tpr ''filename'' -dev

    ```


    # 2 Select Print Options


    # 3 Load a Graphic with gv


    In the xv postscript dialog, click the desired orientation and paper size. Click
    the Center, Origin, or Max button to adjust the image''s size on the printed page
    and click OK to print your document.


    To start gv from the command line and load a sample image (in this example, tiger.ps),
    type gv /usr/share/ghostscript/4.03/examples/tiger.ps.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_201_1.png)'
  merge: -1
  pgno: 201
