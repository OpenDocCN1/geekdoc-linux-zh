  md: '# APPENDIX


    # # Installing Caldera OpenLinux


    Linux is the kernel of an operating system released to the world in 1991 by Linus
    Torvalds while he was working as a graduate student at the University of Helsinki,
    Finland. Remember: Linux is the kernel—the thousands of programs and support software
    packages that come with the Linux kernel make up what is called a Linux distribution.
    Caldera''s OpenLinux is Caldera''s System''s distribution of Linux. There are
    other Linux distributions from a variety of companies, organizations, and even
    individuals.


    You can find Caldera''s OpenLinux on this book''s CD-ROM. This appendix shows
    you one way of installing OpenLinux on your computer. However, you should keep
    in mind that there are a number of ways to install and run Linux on a PC. You
    can find all the documentation and technical details about installing OpenLinux
    on this book''s CD-ROM.


    If you want to read more about OpenLinux before starting your installation, browse
    to http://www.calderasystems.com and follow the various links to OpenLinux. To
    read the OpenLinux Getting Started Guide, browse to http://www.calderasystems.com/doc/index.html
    and click the Getting Started Guide link. You can read the guide in German, English,
    Spanish, French, and Italian. Read Chapter 2 of the guide for specific information
    about installing OpenLinux ●'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# Will Linux Run on My Computer?


    If you can run DOS or Win9x on your computer, you can install and run Linux. There
    are versions of Linux for other computers, such as those from Sun Microsystems,
    or computers using other Central Processing Units (CPUs) such as the Alpha chip.
    To read more about other distributions of Linux for other computers besides based
    on the x86 architecture, browse to http://sunsite.unc.edu/LDP.


    The general requirements for installing OpenLinux are


    +   - 386 or better equivalent CPU

    - 16MB of random access memory (RAM)—although Linux works with 8MB

    - 1.44MB 3.5-inch floppy drive

    - CD-ROM drive

    - Minimum of 60MB hard drive space. Up to 1GB might be required for a complete
    installation of the contents of this book''s CD-ROM


    # How Do I Install OpenLinux?


    There are several ways to install OpenLinux. This section gives an overview of
    various methods you can use. It does not cover installing Linux using a network
    or a Parallel Line Internet Protocol (PLIP) interface (for details about these
    methods, see Caldera System''s web site).


    The Easy Way: Using the OpenLinux CD-ROM


    The easiest way to install Caldera OpenLinux is to insert the CD-ROM in your computer,
    reboot, and follow the prompts. Booting from a CD-ROM drive might require you
    to reset your computer''s BIOS to change the order of boot disk recognition (usually
    done by pressing a particular function key after starting your computer—see your
    computer''s manual for details).'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# The Harder Way: Using a Boot Floppy


    You can create a floppy disk, insert your OpenLinux CD-ROM, and boot from your
    floppy to start an installation. You need to use the RAWWRITE3.COM program under
    DOS to create the floppy if you cannot boot the OpenLinux CD-ROM. First, note
    the drive letter (as D or E) for your CD-ROM. To create a boot floppy, do the
    following:


    +   1. Insert the OpenLinux CD-ROM, and reboot to DOS. At the DOS command line,
    type each of the following lines and Enter:


    D:

    CD \COL\LAUNCH\FLOPPY

    RAWWRITE3


    +   2. After the RAWWRITE3 programs starts, it asks you to enter the source filename.
    Type INSTALL.144 and press Enter.


    +   3. RAWWRITE3 asks you to enter the destination (A or B); type the drive letter
    of your floppy, as A, and press Enter.


    +   4. RAWWRITE3 asks you to insert the target disk in the disk drive. Insert
    a blank disk into your drive and press Enter.


    +   5. RAWWRITE copies the file INSTALL.144 onto your floppy.


    +   6. When finished, either remove the disk or reboot to start the installation.

    To start the installation, insert your OpenLinux CD-ROM in your computer, insert
    your floppy into its drive, and reboot.


    > If you have a PCMIA CD-ROM drive or need other specialized support, repeat these
    steps with a separate floppy, but use MODULES.144 instead of INSTALL.144. This
    creates a second disk with software you need to help OpenLinux recognize your
    external CD-ROM during the first installation steps.


    # Other Ways


    You can also install Linux on an existing DOS partition. This is a safe way to
    install Linux. For details about this type of installation, see the file README
    under the OpenLinux CD-ROM''s col/linux/ directory.


    Alternatively, you can buy Linux preinstalled on a brand new laptop or computer.
    This can be costly, but if you buy a computer fully configured out of the box,
    this is the way to go. Browse to http://sunsite.unc.edu/LDP/HOWTO/VARTO.html.


    # Get by a Little Help from Your Friends


    If this seems too daunting, ask a friend with Linux experience to come over and
    install Linux for you! This is a great way to share information, and having someone
    to help can make the installation process easier.


    Alternatively, go to a Linux User Group (LUG) InstallFest! Check your local computer
    club to find out whether a LUG meets near you. LUGs regularly hold installation
    meetings, and you''ll have Linux installed and configured in no time at all! Browse
    to http://www.linux.org/users/index.html to find a LUG near you. And if there
    isn''t one, start a LUG yourself!


    How Do I Install OpenLINUX 233'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# # How Do I Start Linux?


    There are different of ways to start Linux:


    +   - LILO The Linux loader (LILO) is a small program used to jumpstart. It can
    be installed in the Master Boot Record of a DOS partition, or in the root partition
    of a Linux partition on your hard drive.


    +   - LOADLIN.EXE You can use the LOADLIN program from DOS to boot Linux. This
    means that you do not have to install LILO if you use this program and you can
    also install Linux on a DOS partition. Booting from DOS can enable you to make
    that "Plug-and-Pray" hardware works correctly.


    +   - Boot disk You can easily create a boot disk to start Linux. You have an
    option during installation to save LILO on disk.


    +   - Floppy Don''t want to install Linux? Browse to http://metalab.unc.edu/LDP
    and search for Linux distributions that fit on a floppy. You can boot Linux with
    a single floppy (but you won''t get the X Window System).


    +   - System Commander This is a commercial program you can use to boot multiple
    operating systems from a single computer. Browse to http://www.systemcommander.com
    for details.


    +   - BootMagic Included with PowerQuest Corp''s PartitionMagic, BootMagic can
    be used to boot multiple operating systems from a single computer. Browse to http://www.powerquest.com
    for details.


    # # Installing Linux


    This appendix describes installing and using the Linux loader, or LILO, to boot
    Linux. This section does not covering boot Linux over a network.


    # ## Preflight Checklist


    Here''s a list of things you should know before installing OpenLinux. Unfortunately,
    many manufacturers do not document the technical characteristics of their computers,
    so you might have to dig through your computer manuals, call the manufacturer,
    or browse to the manufacturer''s Web site for your data. You won''t need all this
    information to install Linux, but you might need some of it later in order to
    configure any PC cards, set up and, so on.


    +   - Type of CPU (386, and so on).


    +   - Amount of system RAM (in megabytes).


    +   - Size of hard drive (in megabytes).


    +   - Size of hard drive for Linux swap (twice the size of system memory),


    +   - Size of hard drive for Linux (in megabytes).'
