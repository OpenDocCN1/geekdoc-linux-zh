  md: '# TASK


    # Begin


    # How to Boot Linux to the X Window System


    # 1 Boot Directly to X


    Start your computer. At the LILO boot prompt, type linux 5 and press Enter. When
    Linux finishes booting, your display clears and you see a login window. Type your
    username and press Enter. Then, type your password and press Enter to start an
    X session using the AfterStep window manager.


    This task shows you how to boot directly to the X Window System using LILO. You
    must have correctly configured the X Window System in order to boot directly to
    X (see Appendix A for information on configuring X). Chapter 2, "Getting Started
    with the X System," shows you what to do after you start an X session.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_21_0.png)


    ```

    login:

    Password:

    ```


    # 2 Open /etc/initabb


    # 3 Set Boot Level


    Log in as the root operator. At the command line, use the pico text editor to
    open the file initabb under /etc directory. Be careful! You should first make
    a copy of this file with the cp command; type cp /etc/initabb /etc/initabb and
    press Enter. For editing the file, typing pico -w /etc/initabb and press Enter.


    Scroll through the file until you see the Default runlevel. This entry normally
    contains the command id:3;initdefault=; which starts Linux in the multiuser mode
    with a console command-line prompt. Cursor the number 3 and change the 3 to 5.
    Press Ctrl+X to save the file and then press Y to confirm the save. The next time
    you boot Linux, you''ll be presented with a login screen, as in step 1.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_21_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_21_2.png)


    ```

    root:init:5

    1: Single user mode, if no networking available

    2: Single user mode, if networking available

    3: Multi-user mode (default)

    4: Multi-user mode without networking

