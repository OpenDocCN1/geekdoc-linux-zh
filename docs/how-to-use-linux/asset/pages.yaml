  md: '# Play Mahjong


    Click the Application Starter button on your desktop''s panel. Click Games, and
    then click Mahjong. The object of this game is a click tile, and then click a
    matching tile to remove the tiles. To remove as many tiles as you can. Only rarely
    are you able to remove all the tiles—but it is possible!


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_230_0.png)


    # Play Reversi


    Click the Application Starter button on your desktop''s panel. Click Games, and
    then click Reversi. The object of this game is to capture and reverse the opponent''s
    colored buttons. Your color is blue by default. Click a blank square on the other
    side (diagonally, horizontally, or vertically) of a red button to flip the color
    of any red button between the blank square and your blue button. Here''s a hint:
    Try to capture at least three corners of the grid to win.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_230_1.png)


    # Play Patience


    Click the Application Starter button on your desktop''s panel. Then click Patience.
    This offers not one, but nine solitaire card games. The default game is the familiar
    Klondike solitaire. To play a different type of solitaire, open the Game menu,
    select Choose New Game, and click one of the nine different card games.


    # How-To Hints


