  md: "# TASK\n\n# Begin\n\n# How to Start Linux\n\n# Start Linux\n\nThis task shows\
    \ you a number of ways to start Linux, or LILO, using the Linux loader, prompt.\
    \ This task assumes you've installed OpenLinux and LILO on your computer's hard\
    \ drive (see Appendix A), but each step will work if you're booting from a floppy\
    \ disk.\n\nTurn on your computer. When the Caldera OpenLinux screen appears, you\
    \ see the boot prompt at the bottom of your screen. If you don't type anything,\
    \ your computer will boot to Linux in 20 seconds. You will see a list of boot\
    \ images to use, press Tab. To boot to DOS, type dos and press Enter. To boot\
    \ to Linux, type linux and press Enter.\n\n```\nCaldera\nlinux:~$ login\npassword:\n\
    Config: /var/sys/C-2-Systems, Inc.\n~$\n```\n\n# Enter Your Username and Password\n\
    \n# Configure Your Environment\n\nType your username and press Enter again. You\
    \ end up in your home directory at the command line of your shell (if you chose\
    \ bash for your default shell, right?). If you've logged in before, Linux will\
    \ tell you when and what console, or terminal, you will\n\nSome of the most basic\
    \ commands—such as cp for copying files, mv for moving or renaming files, or rm\
    \ for deleting files—can be dangerous. At the command line of your console, use\
    \ the pico editor (of the pine email program) to open the bash shell's resource\
    \ file .bashrc by typing pico .bashrc and pressing Enter.\n\n```\nCaldera\nuser:~$\
    \ login\npassword:\nConfig: /var/sys/C-2-Systems, Inc.\nroot@linux:/home/user\
    \ (192.168.1.100)~$ \nused.\n```\n\n![](img/c48ad0dbc61332ca39f773da7141f4e1_19_0.png)\n\
    \n6 CHAPTER 1: GETTING STARTED WITH CALDERA OPEN LINUX"
