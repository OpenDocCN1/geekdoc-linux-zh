  md: '# How to Play Animations or Movies


    OpenLinux comes with several programs you can use to watch animations or movies.
    This section introduces you to some of the animations included on this book''s
    CD-ROM. You see how to run several demonstration programs.


    # Start a gnuplot Animation


    The gnuplot mathematical modeling and plotting program can be used for simple
    animations. To see a demonstration, run the following commands and press Enter:


    ```

    cd /usr/X11R6/lib/gnuplot/demo\gnuplot animate.dem

    ```


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_223_0.png)


    # Play an Illustrated Audio File


    You can play synchronized computer slide shows and audio tracks in Illustrated
    Audio format by using the iaplay client included with OpenLinux. To play a demonstration
    clip, cd /usr/share/data/illustrated-audio iaplay

    After you press Enter, each-second demo is played.


    # Play an MPEG Video


    Use the mpeg_play client to play Moving Picture Expert Group (MPEG1) video animations
    on your desktop. To play a video clip, use the mpeg_play command by the name of
    the video clip. For example, use mpeg_play /usr/share/data/mpeg/RedsNightmare.mpg,
    and press Enter.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_223_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_223_2.png)'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Play an MPEG Video in Grayscale


    You can also use the xmpeg client to play MPEG1 videos. This program has a single
    control window but can be used to play video in a variety of display modes, such
    as grayscale. To play a demo video clip, use the xmpeg command followed by the
    name of the demo video clip. For example, type xmpeg /usr/share/data/mpeg/RedNightmare.mpg
    and press Enter. Click the main window to open xmpeg''s color control dialog.
    Select a video display mode by its name, and then click the OK button.


    # Play a QuickTime or Active Movie File


    You can use the xanim client to play files in one of fifteen different formats,
    including QuickTime MOV files or Active Movie AVI files. On the command line of
    an X11 terminal, use xanim followed by the name of a video file. For example,
    type xanim-dawayay.avi . The xanim has several controls, including Pause, Frame-by-Frame,
    and Play buttons.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_224_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_224_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_224_2.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_224_3.png)


    # How to Learn About Making Movies


    To learn more about how to make MPEG videos, browse to the U.S. Army''s High Performance
    Computing Research Center''s Graphics and Visualization Laboratory at http://www.arc.umn.edu/GVL/Software/mpeg.html.
    This site has numerous links to movie-making-software and offers tutorials on
    using different graphics software to make movies.


    # Looks Awful on My Display!


    Start your X session at a higher color depth than the default 256 colors to see
    better rendering of all. Use the startx or kde command from the command line of
    your console. For example, type kde -bpp 16 to start X using thousands of colors.
    If your computer and the XFree86 software support greater depths, you can try
    -bpp 24 or -bpp 32.


    HOW TO PLAY ANIMATIONS OR MOVIES 211'
