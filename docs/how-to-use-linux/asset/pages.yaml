  md: '# Begin


    # How to Manage Your Files


    # 1 Click a File or Folder


    Right click a file or folder on the desktop, and choose Properties from the pop-up
    menu.


    There are several ways to manage files using OpenLinux. This task uses KDE''s
    desktop for its examples. See the How-To-Hints section for information about other
    ways to manipulate files.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_53_0.png)


    # 2 Rename a File or Folder


    Click in the Name field, enter a new filename, and click OK.


    # 3 Delete a File or Folder


    You can delete a file or folder in two ways. You can put the file in the desktop''s
    trash can, or you can delete the file entirely. To put the file in the trash can,
    right-click it, and choose Move to Trash from the pop-up menu. The file disappears
    from the desktop and the Trash icon changes to show that its is full. To delete
    a file, right-click it and choose Delete from the pop-up menu. KDE asks you to
    confirm the deletion; click Yes.


