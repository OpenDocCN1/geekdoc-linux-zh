  md: '# Add a User


    Scroll down to the guest entry and add your username (in this example, I typed
    bball). Press the spacbar. To give yourself access to your computer''s floppy
    drive, type c_normal. To give yourself full access to all of dosemu''s features,
    type c_all. When finished, press Ctrl+X to save the file.


    # Start a DR-OpenDOS Session


    Repeat step 1. This time, an window appears with the name DOS in a BOX. You''re
    now running DR-OpenDOS!


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_240_0.png)


    # Configure Your Computer


    The default configuration used by dosemu and DR-OpenDOS is you 80386-type computer
    with 1MB of system memory, 650KB available for DOS programs, and a 7.7MB hard
    drive. You can change these settings by adding or removing an 80486 Central Processing
    Unit (CPU) by editing, as the root operator, the file dosemu.conf under the /etc
    directory. You can also build a new hard drive (the hard drive is actually a 7.7MB
    file called himage.od in the /var/lib/dosemu directory) if you need more space
    for DOS programs.


    # How-To Hints


    # How Do I Quit a DOS Session?


    The C: drive used by dosemu and DR-OpenDOS contains two directories EMUBIN and
    EMENDOS. Use the EXITEMU command to quit your DOS session.


    # How Do I Find More About dosemu?


    Read the README.txt under the /usr/lib/dosemu/doc directory for details about
    how to use dosemu, configure custom settings, and create larger hard drives using
    the setup-hdimage command.


    # How Do I Access My Floppy or Linux Directories?


    A single-floppy drive has drive A: assigned to the first floppy. Drive B: presents
    the second floppy on a two-floppy system. Drive L is defined as your Linux drive,
    Type L: and you''ll need to be at your root, or / directory. Use the cd command
    to navigate to your home directory like so: cd home/$username


    CONFIGURE DOSEMU AND DR-OPENDOS 227'
