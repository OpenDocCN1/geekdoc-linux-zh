    ![](img/c48ad0dbc61332ca39f773da7141f4e1_239_0.png)


    # Read Error Message


    The xmessage command reports an error and tells you to contact the system administrator.
    Who is that person? Why you, of course! Click the okay button.


    ```

    The applications "/home/billy/index" returned the following:

    Sorry billy. You are not allowed to run dosemu. Contact System Admin

    ```


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_239_1.png)


    # Open the User Configuration File


    At the command line of a terminal window, as the root operator and open dosemu''s
    configuration file with the pico text editor (type su c pico -w /etc/dosemu.users).
    Press Enter to edit the file.


    ```

    vi /etc/dosemu.users

    This is a sample /etc/dosemu.users file

    Billy DOES RESTRICTED TO NORMAL USERS !!!

    If you are not allowed to run DOSEMU, INSECURE one

    at = /etc/dosemu.users


    [ config ] [ confaver { ... }]

    login the name of a user

    comment a configuration variable is which

    set the value to use

    Variables starting with "c" class definition

    - for more details look here

    root

    password

    root is allowed to do everything

    root = /etc/dosemu.users

    - allow only dosemu to run restrictions

    guest

    password

    If you want to allow dosemu to all users, use the line below

    replace the password field with *

    ```


