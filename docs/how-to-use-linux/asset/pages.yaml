    In the xfontsel window, click fmly and select courier. Click the slant button
    and choose r (Roman). Click the pkldsz button and select 12. Next, click the select
    button. Then, move your mouse to the xterm window, hold the Ctrl key, right-click
    in the window, and choose Selection. The xterm window shows the fonts you''ve
    selected.


    # 3 View a Font Character Set


    Use the xfd (X font display) client to see a font''s character set. Use xfd''s
