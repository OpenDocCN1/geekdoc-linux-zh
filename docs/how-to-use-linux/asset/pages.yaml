  md: '# # How To Use This Book


    # ## The Complete Visual Reference


    Each chapter of this book is made up of a series of short, instructional tasks,
    designed to help you understand all the information you need to get the most out
    of your computer hardware and software.


    +   - **Click:** Click the left mouse button once.

    - **Double-click:** Click the left mouse button twice in rapid succession.

    - **Right-click:** Click the right mouse button once.

    - **Pointer Arrow:** Highlights an item on the screen you need to point to or
    focus on in the step or task.

    - **Selection:** Highlights the area onscreen discussed in the step or task.

    - **Click and Type:** Click once where indicated and begin entering your text
    or data.

    - **How to Drag:** Point to the starting place or object. Hold down the mouse
    button (right or left per instructions), move the mouse to the new location, and
    release the button.


    Each task includes a series of easy-to-understand steps designed to guide you
    through the procedure.


