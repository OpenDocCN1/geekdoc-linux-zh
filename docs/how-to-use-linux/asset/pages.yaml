  md: '# CHAPTER


    # Getting Started with StarOffice


    A number of office-automation productivity suites are available for OpenLinux.
    An office suite is a collection of integrated programs, such as a word processor,
    spreadsheet, and presentation graphics client. A good office suite''s programs
    use many of the same menu commands (such as for starting a print job), have an
    integrated "feel", and work well together when sharing data. A great office suite
    makes your computing experience more efficient and productive.


    This chapter introduces you to one of the latest and best office suites for OpenLinux—StarOffice
    from Star Division GmbH. You can find a copy on the CD-ROM included with this
    book. You first learn how to install, configure, and use some of StarOffice''s
    basic features, and then move on to more advanced features, such as automatic
    document creation and using template documents.


    In following chapters, you see how to use four out of StarOffice''s ten different
    components, including StarWriter and StarCalc, in more detail using graphic examples.'
