    Click


    End


    # How-To Hints


    # How About Other MIDI Players?


    Several MIDI players are included with OpenLinux. Try playmidi or timidity (highly
    recommended) to play MIDI files without using X Window. KDE users should also
    try the KMidi player, which has an interface similar to kscd. Try the xplaymidi
    client or timidity with its -ik command-line option to play MIDI files using a
    Tel/Tjk graphical interface.


    # Where Can I Get More kmid Files?


    One place to try is the home page of kmid player''s author at http://www.arrakis.is/~lrarrosa/midfiles.html.
    To look for regular MIDI files, use your favorite Web search engine.


