  md: '# Name the Device


    Click the Device Name field and type Floppy Backup, and then choose Save from
    the File menu. Finally, Click | Exit.


    # Select New Device


    Choose New Device from BRU 2000''s File menu. In the Select Device dialog, open
    the Device drop-down menu, choose /dev/itd0, and click OK.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_64_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_64_1.png)


    # How-To Hints


    Other Devices You Can Use with BRU 2000


    Nearly 40 different backup devices are listed in BRU 2000''s configuration files,
    but you can also define your own. All you need to know is the name of the device
    under the dev directory—such as /dev/sda for a parallel-port Iomega drive—and
    the capacity of the device (100MB per disk).


    # Select Files


    Click the Backup Data to Archive in the main BRU 2000 window. Scroll through your
    home directory, choose a desired file or directory to back up, and then click
    Add. When finished, insert a floppy disk into your computer and click Start Backup.
    BRU 2000 asks for an archive label, gives you an estimate of how many disks are
    needed, and begins the backup.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_64_2.png)


    # Another Backup Program You Can Use


    Use the taper command -T, followed by the name of a backup device, to start a
    backup. The taper command does not require the X Window System and can be started
    from the command line of any console. Make sure to read the taper FAQ using the
    /usr/doc/taper directory. However, this is so simple and easy to use, you dont
    need a manual! For example, to start a backup session and use your floppy as the
    backup medium, type taper -r.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_64_3.png)


    # Using the tar command


    You can use the tar command to back up files to your floppy drive. For example,
    use a command such as cvf /dev/fd0 -m myfiles to back up the contents of the myfiles
    directory. The -M option tells tar that the back-up is a multarchive archive.
    When the first disk fills up, press tar to insert the next disk.


    Back-up data button


    End


    HOW TO BACK UP FILES WITH BRU 2000 51'
