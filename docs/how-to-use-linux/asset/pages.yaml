  md: '# How to Create a Personalized Calendar


    This task shows you StarCalc can help you quickly create a custom calendar for
    any month or year. You can use StarOffice''s template feature to create these
    calendars, which can be edited, saved, or printed.


    # Choose a Calendar Template


    Start by opening the File menu, choosing New, and then clicking From Template.
    In the New template dialog, click the Spreadsheets category and the Yearly/Monthly
    Calendar template. Click the Preview check box, and then the More to see a preview
    and short description. Click.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_165_0.png)


    # Select a Calendar Type


    In the Calendar Template dialog, click Year Overview or Month in the Calendar
    section. You also need to enter a year–or the desired month and year–in in the
    Time frame. Next, click the Personal Data button.


    # Enter Personal Data


    Click in the Event field and type the day and month of the event in the appropriate
    fields. If this is a one-time event, click the One-Time check box, which enables
    you to enter a year. Click the Insert button to submit the event and to enter
    another one. To delete an event, click it in the list, and then click Delete.
    When finished, click.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_165_1.png)


    CHAPTER 13: GETTING STARTED WITH StarCALC'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Select Graphics for Your Calendar


    StarCalc then creates your calendar. To add a graphic, click the plus sign to
    the left of the Gallery in the Explorer and double-click Miscellaneous. The Beamer
    opens and displays rows of graphics.


    # Insert a Graphic in Your Calendar


    Click a graphic you like, then, holding down your left mouse, drag the graphic
    from the Beamer to your spreadsheet. Resize the graphic by holding down the Shift
    key and clicking and moving the graphic by dragging it over the sheet. Save or
    print your calendar by selecting the appropriate command from the File.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_166_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_166_1.png)


    Double Click


    Click & Drag


    Release


    End


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_166_2.png)


    # Graphics on My Display Lose Color!


    Don''t worry if graphics lose color on your display. When you print StarOffice
    graphics to your color printer, they look okay. A lack of color probably means
    you''re using only 256 colors, or an 8-bit pixel depth during your X session.
    If your computer''s graphics card supports more than 256 colors, the XFree86_SVGA
    server supports your graphics card, use a greater color depth for your X session.
    For example, to use the K Desktop Environment, use kde and the -bpp option followed
    by a color depth like 16 by typing bpp 16.


    # What’s the Day?


    OpenLinux comes with many other tools you can use to create weekly, monthly, or
    annual calendars. From the command line of console or an X terminal window, use
    the cal command, which prints the month''s calendar. If you use gcal, the current
    month is printed, but the current day is highlighted. If you use tcal, tomorrow''s
    day is highlighted. To set appointments for a weekly, monthly, or annual calendar,
    try the cal X11 client. If you like to use a day planner, try the plan X11 client.


    HOW TO CREATE A PERSONALIZED CALENDAR 153'
