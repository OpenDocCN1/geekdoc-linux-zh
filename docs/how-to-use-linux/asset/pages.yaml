  md: '# TASK 4


    # How to Share Spreadsheet Graphs


    You can share your spreadsheet graphs with other StarOffice documents. In this
    task, you see how to copy and paste spreadsheet graphs into a StarWriter document.
    Start by opening a StarCalc spreadsheet graph.


    # Begin


    1 Copy a Graph to the Clipboard

    Create and click on a new graph (or click an existing graph), and then open the
    Edit menu and choose Copy. (Note that you can also select the graph and press
    Ctrl+C) The graph is now in the StarOffice clipboard.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_167_0.png)


    # 2 Open the Frame Dialog


    Open an existing StarWriter document or create a new one. Then open the Insert
    menu and choose Frame. The Frame dialog opens. By default, your frame has a thin,
    black border. Click the Borders tab and then click the left box in the Presets
    selection to specify that no border is needed. When finished, click the OK.


    # 3 Select Paste


    The new frame appears in your document. Resize the frame by clicking and dragging
    one of its eight anchor points. When finished, click a blank area of your document
    and then click inside the frame—you see a blinking insertion cursor. Open the
    Edit menu and choose Paste.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_167_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_167_2.png)


    154 CHAPTER 13: GETTING STARTED WITH STARCALC'
