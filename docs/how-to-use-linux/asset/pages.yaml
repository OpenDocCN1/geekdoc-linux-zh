  md: '# How to Use the xman Client


    You use the xman client to read Linux program pages during your X11 sessions.
    This program provides an easy way to read documentation for many of the programs
    that come with OpenLinux. Found under the /usr/X11/bin directory, xman is the
    X counterpart that can be used to read man pages from the command line of your
    console (without running X11), or from the command line inside an X11 terminal.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_69_0.png)


    # Start xman


    Start xman from the command line of an X11 terminal window by typing xman &. The
    xman Manual Browser window appears on your desktop.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_69_1.png)


    # Read xman''s Manual Page


    Click the Manual button to open the initial man page, which will be for xman.
    Scroll through the page by dragging the scrollbar on the left side of the window.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_69_2.png)


    # Display Manual Page Index


    Click the Sections button, and select (1) User Commands to display an index of
    man pages for this section.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_69_3.png)


    CHAPTER 5: GETTING HELP'
