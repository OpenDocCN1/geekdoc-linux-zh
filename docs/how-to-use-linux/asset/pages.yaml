  md: '# TASK


    # How to Configure Your Desktop


    When you use KDE, you''ll see different elements on your computer screen, such
    as the KDE panel (along the bottom), a taskbar (along the top), several icons
    (such as Trash), and perhaps a window displaying files or folders in your home
    directory. Notice that your root display color (or customize desktop background)
    is blue by default. You can customize this background by choosing a new color,
    showing a picture, changing how windows look, and choosing your fonts!


    # 1 Open the Display Properties Menu


    Right-click a blank area of your desktop, and choose the Display Properties item
    from the pop-up menu that appears.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_39_0.png)


    # 2 Change Desktop Fonts


    To change the type of font used for filenames or programs in KDE''s taskbar, click
    the Typeface drop-down list and select a different menu. You''ll see a preview
    of the font in the Sample Text area. To have windows, buttons, or menus like those
    of "other" operating system, check the Draw Widgets in the Style of Windows 95
    box at the top of the dialog. To use your new setting right away, click the Apply
    button.


    # 3 Click the Background Tab


    Click the Background tab. To change the background to a picture, click the drop-down
    menu in the Wallpaper section. You will see a list of different background patterns
    and pictures. Scroll through the list, and select the wallpaper you want to use
    by clicking its name. A preview of the selected wallpaper appears near the top
    of the dialog. Click the Apply button to change your display''s background.


