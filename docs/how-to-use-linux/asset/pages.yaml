  md: '# Begin


    # How to Graph Your Spreadsheet Data


    1 Highlight Select the spreadsheet data you''d like to graph. Include any columns
    or rows you''d like to use as labels for your numbers. Then, click the Insert
    Object on the vertical toolbar. The cursor turns into a plus sign with a tiny
    chart. Click and drag on a blank area of your spreadsheet to set the initial size
    of your graph. When you release your left mouse, the AutoFormat Chart dialog appears.


    Use StarCalc to create complex graphs of your spreadsheet''s data. This task shows
    you how to build a chart quickly and easily, using the previous data as an example.
    Start StarCalc and open your spreadsheet to begin.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_163_0.png)


    # 2 Set Autoformat Options


    The AutoFormat Chart dialog leads you through the steps to create your chart.
    If your data has row and column labels, make sure to click the First Row as Label
    and First Column as Label check click the Next button to continue.


    # Choose a Chart


    Scroll through the chart types and select a chart. Note that the Preview area
    of dialog shows how your data will look. When finished, click the Next button
    to continue.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_163_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_163_2.png)'
