    You can use Netscape Messenger to compose and send email. In this section, you''ll
    learn how to start Netscape Messenger, compose a message, and send it.


    # 1 Select Netscape Messenger


    Launch Communicator, open the Communicator menu, and click Netscape Mailbox.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_107_0.png)


    Click


    # 2 Open the Messenger Mailbox


    The main Netscape Mail & Discussions window contains a menu bar, a toolbar, a
    drop-down menu, and a main display area. The toolbar buttons, labeled Get Msg,
    New Msg, Reply, Forward, and so on, are used to manage your mail. To compose an
    email message, click the New Msg button.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_107_1.png)


    mailbox drop-down menu


    toolbar


    menu bar


    Click


    # 3 Compose an Email Message


    In the Compose window, type the recipient''s email address in the To field. In
    the Subject field, type a brief description of your message''s subject. Then click
    the Text area and compose your message. Click the Spell button on the Compose
    window''s toolbar. If an unknown word is found, Netscape will present a Spell
    dialog. Click the appropriate buttons to go through your message; when finished,
    click the Stop button.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_107_2.png)


