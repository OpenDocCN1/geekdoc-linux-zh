  md: '# CHAPTER

    Starting and Running DOS Programs with DR-OpenDOS


    OpenLinux comes with Caldera''s DR-OpenDOS, a disk-operating system (DOS) that
    runs under the dosemu emulator program. You can run DOS from the console or in
    a window during your X sessions. DR-OpenDOS can run older or legacy DOS programs,
    perform network connections, and even build a bootable DOS system disk for your
    PC.


    This chapter shows you how to configure dosemu so you or other users can start
    DR-OpenDOS. You''ll also see how to read the DR-OpenDOS manual and get help with
    DOS commands. Using dosemu during an X session is a convenient way to run two
    operating systems at the same time. To do this, first start X from the command
    line of your console.'
