  md: '# Grab a Window or a Desktop


    To grab a window or the entire desktop, click the Grab button in the xv Grab dialog
    and click a window or a blank area in your desktop to capture a graphic of the
    window or the desktop, respectively. Click the Hide XV Windows check box before
    you click the Grab button. This hides xv.


    # Save a Grabbed Graphic


    A captured window appears in a new window. To save the graphic, click the Save
    button on the xv Controls window.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_184_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_184_1.png)


    # How-To Hints


    Is there a KDE Capture Program?

    Yes! Browse to http://www.kde.org/applications.html and download snapshot. This
    handy tool captures an image of a window or the desktop and can save the capture
    in five different graphics formats.


    Is xv Free?


    Unlike the majority of software included with OpenLinux, xv is free, but if you
    use it for work, you must pay a $25 registration fee. For more information, click
    the About button in the xv Controls dialog, or read the xv documentation under
    the usr/doc directory.


    # Specify Graphics Type


    When the xv Save dialog appears, click the Save File field and name it, such as
    mygraphic. To save the graphic in one of fourteen different formats, click the
    Format button, and select a graphic type from the drop-down list. Don''t forget
    to use an appropriate extension for the filename, when saving a Graphics Interchange
    Format, or GIF, graphic type, .gif at the end of your name. When finished, click
    the OK button.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_184_2.png)


    # End


    HOW TO CAPTURE A WINDOW OR DESKTOP 171'
