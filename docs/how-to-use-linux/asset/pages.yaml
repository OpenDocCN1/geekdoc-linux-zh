  md: '# How to Receive and Reply to Email


    You can use Netscape Messenger to receive, save, and reply to email. To get started,
    log in to your ISP and start an Internet session.


    # 1 Open the Messenger Mailbox


    Launch Communicator, and select Messenger from the Communicator File menu.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_109_0.png)


    # 2 Click the Get Msg Button


    To get your mail, click the Get Msg button on the Messenger window''s toolbar.
    Netscape Messenger will then ask for your password. After you type the password
    for your Internet account and click OK, Messenger will forward a request to your
    ISP''s computer to send any waiting mail.


    # 3 Receive Email


    If mail is available, a small window will appear to let you know many messages
    are available, and a meter will display the progress of the message download.
    Netscape will store the retrieved messages in the Inbox mailbox, and display the
    messages by subject in a list. To retrieve a retrieved message, double-click.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_109_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_109_2.png)


    96 CHAPTER 8: USING NETSCAPE COMMUNICATOR'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# Read a Message


    Your email will appear in a Messenger window. Any file attachments will be listed
    below the message''s text. If you click the small paper-clip icon at the top of
    the message, a window will appear at the bottom of the message, displaying an
    icon representing the attachment along with attachment''s filename. If you double-click
    the clip icon and Netscape recognizes the attachment type, it will launch the
    appropriate helper application to handle the file. (For example, Adobe Acrobat
    will open an attached PDF-file).


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_110_0.png)


    # Reply to a Message


    To reply to a message, click the Reply button in the message''s toolbar. The message
    will appear in a Messenger Compose window; the To and Subject fields will be automatically
    filled out, and from the text to which you are replying will Type your reply,
    and then click the Send Now button to send the message immediately. As before,
    you can spell-check, save, or postone the message.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_110_1.png)


    # Cancel the Reply


    To cancel your reply, close the Compose window (open the File menu, and then close
    to close Messenger or Exit to Communicator). Before closing, Netscape Messenger
    will first ask whether you want to save your reply in the Drafts mailbox. To discard
    your reply, click the No button.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_110_2.png)


    # How-To Hints


    Save Email or Flush Your Server?

    You can configure Netscape to tell your ISP''s mail server to hold on messages
    after you''ve retrieved them. To keep your messages on your ISP''s computer, open
    Communicator''s Edit menu and choose Preferences. Click Mail & Groups in the Category
    list, and click the Mail Server list item. In the Mail Server dialog, toggle the
    push button for the Leave messages on Server item. Note: As a courtesy, you should
    periodically flush your mail from your ISP''s server (besides, many ISPs impose
    a limit on the size or number of messages you can store on your computer).


    HOW TO RECEIVE AND REPLY TO EMAIL'
