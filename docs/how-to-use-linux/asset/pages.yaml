  md: '# How-To Hints


    # Can''t Run AOL''s Instant Messenger?


    If you install and then try to run IM, but get an error message about not being
    able to find Oscar.main, don''t worry! Use the glint client or rpm command to
    uninstall the Java Development Kit. Then, if you''re using the bash shell, use
    the unset command to remove the default Java environment variable; simply type
    unset JAVA_HOME. Reinstall IM, and then starting it again.


    # Have Too Many Friends?


    Well, everyone should be so lucky! But if you have a lot of different friends,
    acquaintances, students, or even clients, use IM''s Buddy List Group feature to
    categorize and organize your IM buddies. Click Setup from IM''s initial dialog,
    or click File, then Options, and then Preferences while logged in. At the top
    of the Buddy List dialog in Setup, you''ll see buttons to Add, Rename, or Delete
    buddy groups. This is a handy way to organize your lists.


    # Configure IM Offline


    You don''t have to have an active Internet connection or be logged into IM to
    configure most features of this program. You do have to be online and logged in
    to change options concerning your nickname or privacy. You can, however, change
    which buddies can send instant messages, or which you want blocked. See the Permit
    tab in the Privacy dialog (refer to step 8).


