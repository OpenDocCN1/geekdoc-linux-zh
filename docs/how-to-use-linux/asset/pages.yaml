  md: '# CHAPTER 10


    # # Word Processing with OpenLinux


    Word processing is one of the most important tasks people accomplish with their
    computers (besides browsing the Web and playing games). You can find a rich assortment
    of text editors and word processors included on this book''s CD-ROM; this chapter
    introduces you to a few of these programs. You can use these editors to produce
    simple text files, edit OpenLinux system configuration files, develop computer
    programs, or produce typeset documents. You also see how to spell check your documents
    and look up words in your system''s dictionary.

    It''s important to know how to use a text editor, because you might need, at one
    time or another, to know how to open an OpenLinux system system file and then
    make and save changes. Some of these editors, such as kedit, require that you
    use the X Window System, whereas others can be used with or without X. You should
    also read Chapter 12, "Getting Started with StarWriter," to learn more about word
    processing with the StarOffice suite of programs.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# How to Use the kedit Program


    One of the easiest to use editors included with OpenLinux is the kedit text editor
    included with the K Desktop Environment, or KDE. You need to start an X session,
    using KDE, in order to run kedit. Start X system from the command line of a terminal
    window by typing kde and press Enter to begin. Start kedit by clicking the Application
    button, choosing Applications and selecting Editor.


    # Select, Copy, and Paste Text


    Click at the beginning of the text and then, holding down your left mouse button,
    drag to highlight the desired text (to highlight a single word, double-click it).
    To copy the text, open the Edit menu and click Copy. After the selection is copied,
    click in where you''d paste the text and then paste using the Edit menu.


    # Choose a Font and System


    Right-click anywhere in your document and choose Font from the pop-up menu. The
    default Font is Courier, but you can use the Select Font dialog to change your
