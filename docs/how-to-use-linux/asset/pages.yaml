- img_proc: true
  md: '# Printing Text Files and Graphics


    One of the most important tasks you perform when using OpenLinux is installing
    and configuring printing support. If you have a parallel-port printer that works
    with other operating systems and isn''t a “WinPrinter,” chances are very good
    that you can print text and graphics using OpenLinux.


    Your time and effort in configuring printing support is quite rewarding, because
    you end up with a printing system that supports PostScript document preparation,
    including color PostScript graphics! Combine this capability with the low cost
    of today''s color inkjet printers, and you can see why many people think OpenLinux
    is a bargain.


    Log in as the root operator, because you need permission to configure your OpenLinux
    system. Some of programs discussed here also require the X Window System, so it''s
    best to start an X session before you begin.'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# How to Install a Printer


    # 1 Plug in the Printer


    Make sure your printer is plugged into

    your computer''s parallel port and turned on.


    Boot OpenLinux and log in as the root operator.

    Although you don''t have to, you can start X. This

    task shows you how to configure OpenLinux to sup-

    port your printer. The magic of printing

    happens in the background. When you print,

    document is converted to the PostScript printing

    language, saved in your system''s printer spool direc-

    tory, /var/spool/lpd, and then fed to your printer

    through your computer''s parallel port.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_195_0.png)


    +   - Serial Port

    - Parallel Port


    # 2 Detect the Printer Device


    On the command line of the X11 termi-

    window, use dmesg | less. Scroll through the

    information until you find a line that looks-

    like lp1 at 0x0378 (polling), which indicates

    that OpenLinux detected your printer as device

    /dev/lpd (which is one of three devices, such as lp0

    or lp2, under the /dev directory).


    # 3 Check for Printer Device Support


    You can check whether you have printer

    device (lp) by listing devices in the /proc

    directory. Use the cat command to list the current

    devices and pipe the output through the grep-

    and print any matches (look for lp). Type

    cat /proc/devices | grep lp


    ```

    $ cat /proc/devices | grep lp

    6 lp1

    ```


    ```

    $ dmesg | less

    [ kernel] initializing modules...

    [ kernel] SCSI disk partition tables

    [ kernel] hda: hda1

    [ kernel] root filesystem

    Mounting root filesystem on hda1 read-only

    Linux version 2.4.0-25-generic (build@root@local)

    Jan 25 12:34:56 2001) x86

    Version 2.4.0-25-generic SMP (gcc 2.4.4)

    [ kernel] Kernel built by (root@local) Jan 25 2001

    [ kernel] at Silicon Valley, California, Inc.

    [ kernel] Linux devices registered

    [ kernel] SCSI host 0:0:0: detected drive controller

    [ kernel] SCSI: Port Couplers: 1 (1995, California, Inc.)

    [ kernel] SCSI disk (0:0:0:0) [0:0:0] hda: hda1: 800MB Seagate III 1.0

    [ kernel] Linux PCI Card Services 3.0.2

    Linux version: 2.4.0-25-generic (Mar 14 17:22:09 1998) *

    ```


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_195_1.png)


    182 CHAPTER 16: PRINTING TEXT FILES AND GRAPHICS'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# Check for Printer Support Module


    Finally, you can check see whether the printer support module, lp0, is loaded
    into the kernel by typing the following:


    ```

    lsmod | fgrep lp

    lp                                     0

    ```


    Look for a line containing lp after you pipe the output of the lsmod command (which
    lists currently loaded modules).


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_196_0.png)


    # 5 Start System Configuration


    To begin installing your printer, the Linux Installation and System Administration
    (lisa) tool from the command line of your terminal by typing lisa. Use your keyboard''s
    downarrow key to cursor down, select System Configuration, and press Enter.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_196_1.png)


    # 6 Select Hardware Configuration


    In lisa''s System Configuration dialog, select Hardware Configuration and press
    Enter.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_196_2.png)


    # 7 Select Configure Printer


    In the Hardware Configuration dialog, cursor down using your down-arrow key and
    highlight item 6, Configure Printer. Press Enter.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_196_3.png)


    Continues'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# How to Install a Printer Continued


    # Select a Printer Port


    In the Select Printer Driver dialog, use your cursor keys to scroll through the
    list of nearly 40 printer types to specify which printer driver you need to use.
    If you don''t see your printer type listed, select a printer that most closely
    resembles yours (for example, if you have an HP4000 desktop, select HP Deskjet).
    When finished, press Enter.


    In the Configure Printer Connection dialog, scroll through the list of printer
    ports and select the port—parallel or serial-to—to which you''ve connected your
    printer. Press Enter.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_197_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_197_1.png)


    # Set the Default Printer Resolution


    # Select the Default Paper Size


    Some printers offer different resolutions or dots per inch. Select the default
    resolution for your printer (check your printer''s manual) in the Default Printer
    Resolution dialog and press Enter.


    In the Default Paper Size dialog, select the paper size usually used for your
    printer, and press Enter. Your printer is now configured and installed.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_197_2.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_197_3.png)


    184 CHAPTER 16: PRINTING TEXT FILES AND GRAPHICS'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# 12 Test Your Printer


    To test your new printer, try sending a directory listing to the printer using
    the ls command. Use the pipe (|) shell operator and the line-printer command,
    lpr, to send the listing to your printer; type ls -l | lpr. Your printer activates
    and a long-format listing of your directory is printed.


    # How-To Hints


    # My Printer''s Not Printing!


    Before you do anything else, make sure your printer is turned on. If lpr reports
    an error, the problem could be that the printer spooling system, lprNG, is not
    set up correctly or that the printer daemon, lpd, is not running. For more information,
    see the lpr man page and read the documentation under the /usr/doc/LPRng directory.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_198_0.png)


    # What About Epson Printers?


    Consider models of Epson printers, such as the Stylus Color printers, require
    special setup procedures in order to work with OpenLinux. To find directions on
    setting up your Epson printer, mount your OpenLinux CD-ROM, and then use Netscape
    Navigator to read Calder''s Technical Support pointers:


    +   - mount /mnt/cdrom

    - netscape

    - /mnt/cdrom/OpenLinux/doc/col13/ex.html


    # Where Else Can I Get Help on Printing?


    For more information on printing, navigate to the /usr/doc/HOWTO directory, and
    read the Printing-HOWTO and the Printing-HOWTO. An easy way to peruse this information
    is to start Netscape Navigator, click the Home Page button, and browse through
    the HOWTO document links. Don''t forget to check Calder''s Web site (http://www.calderasystems.com)
    for the latest errata or fixes. Finally, if you get stuck, join the Calder users
    mailing list and ask for help (see Appendix C, "Internet Resources for Linux and
    OpenLinux," for details).


    # HOW TO INSTALL A PRINTER 185'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# How to Print Text Files


    There are several ways to print text files using OpenLinux. This section shows
    you how to print text documents using the command line, as well as using different
    programs included with OpenLinux.


    # 1 Print from the Command Line


    The best way to print a document from the command line is to send the file through
    the line-printer spool, lpr, by using cat file.txt ; lpr.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_199_0.png)


    # 2 Print a Text File with Emacs


    To print a document that has been created or imported to the emacs text editor,
    open the document and select Buffer from the File menu. use emacs'' commands to
    print a document, press Esc and then X. At the prompt, press lpr-buffer and press
    Enter. To print only highlighted text, press Esc and then X, and type print-region.
    To send a PostScript version of your document directly to the printer, press Esc
    and then X, and use ps-buffer at the prompt.


    # 3 Import a Text File with LyX


    To use the LyX editor to print text files, you must first import the file you
    want to print to LyX. To start LyX, type lyn on the command line and press Enter.
    To import a file you must create a new file and "pour" the contents of the file
    you are importing into it. Select New from the File menu. In the Filename field
    of the new document dialog, give the new file name and click OK. Import ASCII
    File from LyX''s Insert menu and as Lines.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_199_1.png)


    186 CHAPTER 16: PRINTING TEXT FILES AND GRAPHICS'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# Select the File You Want to Print


    In the Insert dialog, type the name of file whose contents you want to print and
    click OK (alternatively, you can simply double-click the file''s name).


    # Print the File


    Use LyX to format your document with different fonts and styles. When finished,
    choose Print from the File menu. In the Print dialog, click Printer in the Printer
    field, and click OK to start printing.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_200_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_200_1.png)


    # How-To Hints


    # Preview a PostScript Text File


    You can use the mpage command to create PostScript documents with multiple pages
    on a single printed page. Printing multiple pages of text on a single page not
    only conserves time, but trees. To generate a PostScript file that prints two
    pages side-by-side in landscape format (with border), type mpage -2 -o myfile.txt
    >myfile.ps. Although you can print directly from the command line, using the gs
    PostScript viewer to view your document. Simply type gs myfile.ps. To send the
    file to your printer, choose Print Document from gs''s menu and click Print.


    # Other Printing Utilities


    Many Linux users are accustomed to formatting text documents with a word processor.
    You''ll be pleased to know that you can use many different typesetting software
    packages with OpenLinux to produce attractive documents. For starters, see the
    griff or tex managers.


    # What Commercial Word Processors?


    For more information on creating and printing professional documents using commercial
    software, see Chapters 11-14, which cover the StarOffice suite of programs. In
    addition, Corel (http://www.corel.com) offers the WordPerfect word-processing
    software for Linux free for personal use, and a company called Appix (http://www.appliz.com)
    markets an office suite called Appliware.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_200_2.png)


    # Print Management


    Use the lpc command to see how many print jobs are waiting to be printed, the
    lprm command to kill any waiting print jobs, and the lpc command to control your
    printers. Make sure to read the man pages for these commands!


    # HOW TO PRINT TEXT FILES


    187'
  merge: -1
  pgno: 200
