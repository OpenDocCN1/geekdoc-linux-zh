  md: '# CHAPTER 2

    Getting Started with the X Window System


    This chapter shows you how to use the X Window System included with OpenLinux.
    The X Window System, known as X11 or X, is the graphical interface to Linux. For
    information about configuring X to work with your computer''s graphic card, see
    Appendix A, "Installing Caldera OpenLinux." Although configuring X requires a
    little effort, that effort is well rewarded—a new world of graphical applications
    are available to you during your Linux sessions.


    In this chapter, you learn how to start different X11 clients, or programs, and
    control how the programs appear on your display. You discover how you can set
    the background color of your desktop, view fonts, and use the clipboard to copy
    and paste text. You also see how to start your X11 sessions using different window
    managers, such as the K Desktop Environment (KDE), AfterStep, and twm. Window
    managers are X11 programs that control how X handles your desktop, client windows,
    and other aspects of your X session. The KDE is used as the default window manager
    throughout this book, but the techniques discussed in this chapter work with any
    window manager.'
