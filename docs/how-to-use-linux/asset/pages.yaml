  md: '# # Open a Graphic File


    Navigate through your directories by clicking the Up or Home button. The Home
    button takes you to your home directory. If you click the Grab button, ImageMagick
    performs a screen capture. Select a graphics filename, and then click the Open
    button.


    # # 5 Save the Graphic


    The graphic appears in a window. Click the window to open ImageMagick''s menu.
    To convert your graphic, choose Save from the File menu.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_192_0.png)


    # # 6 Select the Graphic Format


    Click the Format button in the Browse and Select a File dialog. Another dialog
    appears with a list of graphics formats. Scroll through the list, select a format
    such as ZSoft PC'' or pex, and then click the Select button. The format dialog
    disappears. Next, click the Save button in the Browse and Select a File dialog
    to convert and save your graphic.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_192_1.png)


    # ## How-To Hints


    Use a Visual Directory

    To see a window containing miniature images of all the graphics files in a directory,
    use ImageMagick''s visual directory feature. Navigate to the graphics directory,
    and then start ImageMagick. Choose Visual Directory from the File menu. When the
    directory dialog appears, click the Directory button. In a few moments (maybe
    more depending on the size and number of graphics), a window appears with your
    images. To open a file, right-click its image.


    Is a Faster Way to Convert Graphics?

    You could use ImageMagick''s convert command. By specifying a file extension,
    the convert command translates and saves a new graphic. For example, to convert
    the mygraphic.gif to the PCX format, use the command line like convert mygraphic.gif
    mygraphic.pcx.


