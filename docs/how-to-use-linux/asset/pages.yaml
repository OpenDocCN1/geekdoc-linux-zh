  md: '# How to Start and Configure Calculators


    This task shows you how to start and configure the xcale and kcale calculators
    included with OpenLinux.


    # Select Calculator


    Click the Utilities button on your desktop''s panel, and then click Calculator
    to start the xcale client.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_205_0.png)


    # Select a Base


    Click Dee to perform calculations in decimal, or base 10, kcale can also use hexadecimal
    (base 16), octal (base 8), and binary (base 2).


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_205_1.png)


    # Enter and Translate a Number


    By clicking kcale''s number pad, enter the number 32767. The preferred method
    is to use the keypad of your keyboard. If you have a laptop or a keyboard with
    a keypad, press on Num Lock and use the keypad numbers printed on your keyboard.
    As a last resort, you can use the numbers and characters *, -, +, and = on your
    keyboard (Backspace or Del clears all results). Click Hex to translate 32767 to
    hexadecimal.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_205_2.png)'
