  md: '# How to Browse,

    Download, and

    Print with

    Navigator


    Netscape Navigator offers one of the most intuitive interfaces for browsing the
    Web of any Internet software application included with OpenLinux. This friendly
    program, with its large buttons and multi-features, is a favorite tool used by
    millions of people around the world today. And now you can too! Before you learn
    how to use of Navigator''s basic features, start KDE, and then start an Internet
    session with your ISP.


    # 1 Start Navigator


    To start Navigator, click its icon on the taskbar at the bottom of your screen
    (a light-circled by a ring of fire), or click the Application Starter button,
    choose Applications, and then click Navigator.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_113_0.png)


    # 2 Enter an Address


    Enter a Web address in the Location field of Navigator''s main window, as http://www.caldera.com/openlinux/index.html.
    When the page displays, click a link.


    # 3 Follow a Link


    The new page will display. To return to the previous page, click the Back button
    on the Navigator toolbar. Click the Location field, enter the current address,
    and enter an FTP address (as ftp://ftp.caldera.com/pub) Press Enter.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_113_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_113_2.png)


    100 CHAPTER 8: USING NETSCAPE COMMUNICATOR'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# # Jump to an FTP Site


    Navigator will automatically log you in a remote computer system and display a
    list of directories you can navigate (such as Web pages) or files you can download.
    Scroll through the list until you see file called README. Move your cursor to
    the file''s name, hold the Shift key, and click the file.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_114_0.png)


    # # 5 Download a File


    Navigator will display a download and ask you where to save the file. Note the
    file''s name and where it will be saved, then click the OK button. Navigator will
    download and save the file. Navigator will display a Netscape Download, showing
    what percent of the file has been downloaded.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_114_1.png)


    # # 6 Print a File


    You can use Navigator to interest Web pages or to create hard copy of information
    displayed in Navigator''s window. Open the File menu, and then click Print. Navigator
    will display a Print dialog. Click the Printer button in the Print To section.
    If multiple pages are printed, click the Last First button in the Print section
    (this will output pages from first, so you don''t have to shuffle paper after
    printing). Select the appropriate orientation, whatever you want color, and what
    paper size to use. When finished, click the Print button.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_114_2.png)


    # # How-To Update Pages


    Netscape Communicator saves or portions of Web pages in a special cache (cached
    memory) on your hard drive. If you want to see the latest version of a Web page,
    or you want to make sure that what you see is from the Internet and not from cache,
    hold down Shift key and click the Reload button in Navigator''s toolbar to update
    the page.


    # # How to Control Storage Space


    If your hard drive space is at a premium, you can limit the size of downloaded
    email and set Communicator to periodically flush old newsgroup messages. Navigate
    to Communicator''s Preferences dialog, select the Advanced item under the Category
    list, and click Disk Space. Set the appropriate settings in the Disk Space dialog.


    # # End


    HOW TO BROWSE, DOWNLOAD, AND PRINT WITH Navigator 101'
