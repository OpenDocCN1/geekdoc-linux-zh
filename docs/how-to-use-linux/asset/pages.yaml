    KDE''s configuration for using the kdm daemon to log might not be correct (this
    is not Caldera Systems'' fault). To get out of the login screen Ctrl+Alt+F1 and
    log in as the root operator. You can then edit the /etc/initab to boot OpenLinux
    normally. Then, browse to http://www.calderasystems.com and look in the Support
