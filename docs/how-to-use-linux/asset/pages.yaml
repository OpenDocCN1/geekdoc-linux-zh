    To find out which programs to use, say, to manipulate your computer''s floppy
    drive, select Search from xman''s Options menu. Type floppy, and click the Apropos
    button. Manual pages with the word floppy appear (unfortunately, you can''t click
    in the list of pages to link to a manual page-you have to remember the name of
    the page and use it in your next search).


    # How-To Hints


    More About Man Pages


    Manual pages for programs in your OpenLinux distribution are grouped by category
    into sections. These categories and sections are documented in the man page in
