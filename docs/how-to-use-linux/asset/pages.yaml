  md: 'permissions When applied to files, they are the attributes that control access
    to a file. There are three levels of access: User (the file creator), Group (people
    belonging to a related group as determined by the system administrator), and Other
    (everyone else). The permissions are usually r for read, w for write, and x for
    execute. The permissions flag is also used to control who can scan a directory.


    redirection The process of redirecting a flow from the default. Input can be redirected
    to get data from a file or the output of another program. Normal output can be
    sent to another program or a file. Errors can be sent to another program or a
    file.


    regular expression A way of specifying and matching strings for files (filename
    wildcard), grep (file searches), sed, and awk.


    pipe A method of sending the output of one program (redirecting) to become the
    input of another. The pipe character ( | ) tells the shell to perform the redirection.


    root The user that uses the operating system and controls the computer. The processes
    of the operating system run as though a user, root, signed on and started them.
    Root users are all powerful and can do anything they want. For this reason, they
    are often referred to as supers. Root is also the very top of the directory tree
    structure.


    POSIX Portable Operating System Interface, UNIX. POSIX is the name for a family
    of open system standards based on UNIX. The name has been created by Richard Stallman.
    The POSIX Shell and Utilities standards developed by IEEE Group 1003(POSIX)2 concentrates
