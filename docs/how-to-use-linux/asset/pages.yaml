  md: '# # 18

    CHAPTER

    Playing Music and Watching TV


    Any people enjoy listening to the radio or watching TV, and OpenLinux users are
    no exception! This chapter shows you how to pop a music CD into your computer
    and listen to your favorite tunes. If you like listening to the radio or watching
    TV, you also see how to install and use RealPlayer software for Linux.


    You must configure Linux to work with your computer''s sound card in order to
    use the programs discussed in this chapter. See Appendix B, "Adding Miscellaneous
    Hardware," for more information about configuring Linux for sound.


    Some programs discussed here also require the X Window System and an active Internet
    connection, so it''s best to start an X session and log in to your ISP before
    you begin.'
