  md: '# Choose Your Modem''s Speed


    When the Data Transfer Rate menu appears, scroll through and pick a rate one item
    higher than advertised for your modem, and then press the Enter key. For example,
    if you have a 56K modem, utilize 115200 bits. Unless your ISP limits incoming
    calls to certain baud rates, it''s better to try a connection with a faster rate.


    # Enter Your Fax Number


    The next menus you ask to enter a modem fax ID. This is your fax number. Most,
    but not all, modems support sending and receiving faxes (see Chapter 9, "Sending
    and Receiving Fax Documents," for details about faxing with OpenLinux). If you
    want to enter your fax number, simply type it in and then press the Enter key
    (if you don''t need to fax, press Enter to skip this step). When LISA''s main
    menu reappears, press the Esc key, and you''re finished!


    ```

    115200 bps

    1 9600 bps

    2 4800 bps

    3 2400 bps

    4 1200 bps

    5 600 bps

    6 300 bps

    ```


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_90_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_90_1.png)


    # How-To Hints


    # Sleuthing Serial Ports


    For more info about your computer''s serial ports and OpenLinux? Run the zless
    text pager from the command line to zless /usr/doc/HOWTO/Serial-Howto.gz.


    # Some Modems Will Not Work with Linux!


    If you have a so-called WinModem, or controllerless modem, stop! Go out and buy
    a "real" modem, which will work with any computer or operating system. Modems
    that require special drivers or software data dumps in order to work with Linux-period.


    # Using a PC Card Modem?


    Using a laptop with OpenLinux? In order to use a pc card, you must first enable
    PCMCIA service. Log in as the root operator, and then use a text editor to create
    a file pcmcia under the /etc/sysconfig directory. The file should contain (for
    most users) the following:


    ```

    PCMCIA=yes

    PCID=12365

    OPTS="poll_interval=300"

    ```


    For more information about using PC cards with OpenLinux, read the PCMCIA-HOWTO
    under the /usr/doc/pcmcia-cs directory.


