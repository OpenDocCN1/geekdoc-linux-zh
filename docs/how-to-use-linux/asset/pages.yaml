  md: '# How to Start X11 Terminal Windows


    # Begin


    This task shows you how to use different command-line options when starting X11
    terminals. You see how to control the size, placement, and background and foreground
    colors of X11 terminal windows. A terminal window is an important tool during
    an X11 session because it gives you access to the OpenLinux command line. Before
    you begin, start an X11 session using the startx command.


    +   1 Start a Terminal\ Click the Terminal icon. An xterm terminal appears. Click
    the title bar and drag to move the window to a different part of your desktop.
    To resize the window, click the edge or corner of a window and drag.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_27_0.png)


    # 2 Minimize the Terminal


    # 3 Use Specific Colors


    Click the terminal''s control button, and then choose icon. The terminal becomes
    an icon in the lower-left corner of your desktop. To restore the terminal, click
    its icon.


    Use the fg and bg options to start a new terminal with specific colors. At the
    command line of a terminal, type xterm -fg black -bg lightgreen and press Enter.
    A new terminal appears with black text on a light-green background. Click the
    original terminal window and press Ctrl+C to close the terminal.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_27_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_27_2.png)'
