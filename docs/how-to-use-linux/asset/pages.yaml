- img_proc: true
  md: '# How to Configure fax


    The first step to set up faxing is to configure the fax shell script, found under
    the /usr/bin directory. This command uses several programs included with OpenLinux
    to prepare documents for faxing. The following tasks show how to edit and configure
    your script. You must be the root operator to configure fax, so log in as root
    before you begin.


    # Open the fax Script


    Use your favorite text editor, as pico, to open the fax command (a type of Linux
    command called a shell script). At the command line of your console or terminal,
    type pico -w /usr/bin/fax and press Enter.


    ```

    $ Terminal

    $root@boball:~# pico -w /usr/bin/fax-

    ```


    # Configure Your Modem


    Scroll down to the DEV= entry and type the device name for your fax modem. For
    example, if you have your modem on COM2, use ttyS1. Use the linda command to configure
    the /dev/modem symbolic link, this entry should be DEV=modem.


    # Select Modem Class


    The fax command supports three types of fax protocols: Class 1, Class 2, and Class
    2.0. Select the correct class for your modem by removing the pound sign (#) in
    the correct class. For example, if your fax modem supports Class 2 protocols,
    remove the pound sign from CLASS2=. Check your modem''s documentation to see which
    fax protocol is supported. Make sure that only one protocol is selected and that
    the other are preceded with a pound sign.


    ```

    $ Terminal

    $root@boball:~# linda /dev/modem

    # The names of the fax script, efax and including full path

    # if necessary.

    # /usr/bin/efax

    # /etc/efax.conf

    # The device where the fax modem is connected to, e.g., for

    # a external modem on COM2, use ttyS1. For example, if

    # your modem is connected to a built-in serial port, use ttyS1. Thus, use either
    dev-modem or dev-tty1.

    DEV=modem

    # The type of modem commands to use. Uncomment one of the

    ```


    ```

    $ Terminal

    $root@boball:~# linda /dev/modem

    # The type of modem commands to use. Uncomment one of the

    # following lines depending on your modem.

    CLASS=2

    # Your phone number in international format, 20 characters maximum.

    # For example, +1-555-5555, and the character set.

    # Your name as it should appear on the page header

    NAME=Fax from +1-555-5555

    ```


    CHAPTER 9: SENDING AND RECEIVING FAX DOCUMENTS'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# # Enter Your Fax Number


    Scroll down and enter your fax number in the FROM= entry. (Substitute your number
    for the number already present). For example, if your number is 1-703-123-1234,
    type the entry, without hyphens, in this format: FROM=*1 703 123 1234.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_118_0.png)


    # # 5 Enter Your Name, Save Edits


    Scroll down and type your name in the NAME= entry. (Substitute your name or your
    company name for the existing entry). For example, if your name is Joseph Piccolo,
    type the entry so it looks like: NAME=Joseph Piccolo. Then press Ctrl+X, and press
    Y to save the file.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_118_1.png)


    # # 6 View Fax Test


    To test your fax setup, save the output of the fax command''s test option. At
    the command line of a terminal, type fax test >fastest, and then type less fastest
    to read the test. When finished, press Q to quit reading.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_118_2.png)


    # # How-To Hints


    # Different Document Sizes


    Change the PAGE= entry in the fax script to use a different default paper size
    (such as legal-sized paper) when faxing.


    # Other Options


    You can set other options in the fax script, such as the default command used
    to print faxes or the default program used to view received faxes. OpenLinux includes
    all the programs you need if you use the fax script''s default settings.


    # Troubleshooting


    Read the efax page for troubleshooting tips when setting up your fax mode (using
    a command line such as efax). You''ll also find a man page with tips and tricks
    on using the fax shell script.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_118_3.png)


    HOW TO CONFIGURE FAX 105'
  merge: -1
