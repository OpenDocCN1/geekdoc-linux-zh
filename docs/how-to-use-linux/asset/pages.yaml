  md: '# 3 TASK

    How to Start, Check, and Stop Your Internet Connection


    You''ll now see how to start your PPP connection. In addition, you learn about
    features of the kppp tool that you can also use to check your modem and progress
    of your connection for troubleshooting. You''ll also learn about other Linux tools
    that you can use to diagnose your connection.


    # Begin


    1 Start kppp

    Start kppp by clicking the Application Starter button, selecting Internet, and
    choosing Kppp. When the kppp dialog appears, select the account you want to connect
    from the Connect drop-down list and enter your password (if necessary). To start
    the connection, click the Connect button.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_95_0.png)


    # 2 Monitor Your Connection


    The kppp Connecting to dialog will appear. A one-line prompt will tell you the
    status of the connection. If you selected Minimize Window on Connect in the PPP
    tab when you set up your account, the monitor window will disappear into your
    desktop''s taskbar (at the top of your display) when the connection is made.


    # 3 Check the Connection


    If you''d like to see some information about your connection, click the kppp Monitor
    button in your desktop''s taskbar. The connection monitor will appear. Click its
    Details button. The kppp Statistics dialog will appear, showing your current IP
    addresses with detailed statistics about the type and amount of data flowing into
    and out of your PPP connection. Note that the window shows your connection speed
    and a running clock of your connection.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_95_1.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_95_2.png)


