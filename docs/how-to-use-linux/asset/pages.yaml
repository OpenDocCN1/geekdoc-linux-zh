    # How-To Hints


    Need More Information About kppp?

    The kppp tool comes with a 10-section handbook. To read all about kppp, click
    the Help button in kppp''s initial dialog. You''ll find loads of tips and tricks,
    along with detailed information about each of its options and settings.


    Make Sure Your OpenLinux Kernel Supports PPP


    In order to connect with your ISP, you need not only the pppd software, but also
    kernel support for PPP. You should be okay with a default OpenLinux installation,
    but you can quickly check for PPP support from the command line of your console
    or an X11 terminal window. Pipe the output of the dmesg command through the fgrep
    command to search for PPP in your OpenLinux boot messages like this:


    ```

    dmesg | fgrep PPP

    ```


    You should see something like this:

    PPP: version 2.2.0 (dynamic channel allocation)

    PPP Dynamic channel allocation code copyright 1995 Caldera, Inc.

    P line line discipline registered.


