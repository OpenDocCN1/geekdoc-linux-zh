  md: '# CHAPTER

    Getting Started with Caldera OpenLinux


    This chapter shows you how to get started with Caldera System''s OpenLinux distribution
    of Linux, including several ways you can start and then log in to Linux (directions
    and tips for installing Linux are in Appendix A, "Installing Caldera OpenLinux").
    You also learn how to make the Linux command line a little safer. In addition,
    you see how to log directly into the graphical interface for Linux, the X Window
    System. Make sure you''ve correctly configured X to work with your computer''s
    graphic card and monitor before you begin. Make sure to follow the directions
    in Appendix A!


    When you first log in to Linux, you''re in your home directory. This directory
    has a location, or pathname, such as /home/yourusername where username is the
    name selected when you first installed Linux.'
