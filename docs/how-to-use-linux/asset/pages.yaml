  md: '# Begin


    # How to Manage Your Software with kpackage


    1 Start kpackage

    Click the Application Starter button on your desktop''s panel, choose Utilities,
    and click kpackage.


    Fortunately for Linux users, all software installation and removal is handled
    by the Red Hat Package Manager, or the rpm command also maintains a database of
    installed software for your system under the /var/lib/rpm directory. This section
    shows you how to use the kpackage graphical interface program to run rpm. You
    must be logged in as the root operator to install and remove software. If you
    are not logged in as the root operator, start kpackage from the command line of
    X11 terminal by typing su - "kpackage".


