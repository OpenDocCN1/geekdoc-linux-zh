  md: '# Begin


    # How to Configure Your Keyboard and Mouse


    If you are left-handed, or you want to hear your keyboard click as you type, use
    KDE''s client, or KDE Control Center. This program is used to perform keyboard
    and mouse (and other) settings during KDE sessions.


    # 1 Select the KDE Control Center


    Move your cursor to KDE''s panel at the bottom of your screen, and click the Application
    Starter (the big K) to display its menu. Move your mouse to the KDE Control Center
    menu, and then click it.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_41_0.png)


    Click


    # 2 Select Input Devices


    When the KDE Control Center appears, click the small plus (+) sign to the left
    of the Input Devices icon. A menu tree, showing Keyboard and Mouse icons, will
    appear.


    # 3 Click the Keyboard Icon


    Click the Keyboard icon; the Keyboard control panel will appear in the KDE Control
    Center. Click the On or Off radio buttons to enable or disable keyboard repeat
    (keyboard repeat refers when a character repeats itself when you hold down a key
    on your keyboard). Adjust the slider to increase or decrease the Key Volume. (A
    setting of 0% will turn off key clicks). To use these settings immediately, click
    the Apply button.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_41_1.png)


    Click


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_41_2.png)


