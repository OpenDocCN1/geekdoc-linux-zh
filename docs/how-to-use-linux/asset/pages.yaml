  md: '# Start Package Install


    Make sure your CD-ROM is mounted and then click Available, glint searches the
    /mnt/cdrom/Packages directory for rpm files. A Small Scanning dialog appears while
    glint searches your CD-ROM, and the Available Packages window appears.


    # Select, Install Package


    Click the Administration folder, and then the Archiving folder. To install the
    package, click the package icon, and click Install.


