  md: '# Configure kcale


    Click kcale (the button above the Base buttons) to view the KCal Configuration
    dialog. Click Statistical Mode to change kcale''s buttons to perform statistical
    calculations (the default is trigonometry mode).


    # Select a Color


    Click the button next to Foreground Color to change the color of kcale''s LEDs.
    Then, click the button next to Background Color to change the background color.
    When finished, OK.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_206_0.png)


