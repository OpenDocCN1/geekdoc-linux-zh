  md: "# 4 Edit the .bashrc\n\nPress the down-arrow key to scroll to end of the .bashrc\
    \ Enter an alias definition for the cp (copy) by typing alias cp='cp -i' and pressing\
    \ Enter. Follow this with an alias for the rm (delete); type alias rm='rm -i'\
    \ and press Enter. Next, enter an alias for the mv (rename) by typing alias mv='mv\
    \ -i' and pressing Enter. When finished, press Ctrl+X. The pico editor will ask\
    \ you whether you want to save your changes; press Y and then Enter to save the\
    \ file. These changes will effect from now on, after you reboot and log back in,\
    \ each command will ask for permission before overwriting a file.\n\n# 5 Reboot\
    \ Linux\n\nIf you are the root operator, simply enter the shutdown command and\
    \ with -r option to reboot Linux. If you are not root, you may use su (substitute\
    \ user) command to reboot OpenLinux. Type the command line -c \"/bin/shutdown\
    \ -r now\" and press Enter. If you are asked for the root operator's password;\
    \ type it in and press Enter to reboot Linux.\n\n```\n```\n# 1.2             \
    \                  File: .bashrc                               Modified\n#   \
    \                                                           \nalias cp='cp -i'\
    \                                                \nalias rm='rm -i'          \
    \                                      \nalias mv='mv -i'                    \
    \                            \n                                              \
    \                \n# Modified buffer for editing TO SYSTEM LINUX\n```\n```\n\n\
    ![](img/c48ad0dbc61332ca39f773da7141f4e1_20_0.png)\n\n# How-To Hints\n\n# How\
    \ Do I Learn to use the Command Line?\n\nThere are many ways to use the command\
    \ line, better known as the shell. One of the best ways to learn Linux is to read\
    \ Matt Welsh Linux Installation and Getting Started Guide. You can use the Lynx\
    \ browser to read a copy that was installed on your hard drive when you installed\
    \ OpenLinux; type lynx /usr/doc/LDP/install-guide/install-guide-3.2.html/index.html\
    \ press Enter, and navigate to Chapter 3.\n\n# How Do I Change My Password?\n\n\
    At the prompt, type passwd and press Enter. OpenLinux will respond with the prompt\
    \ Enter New UNIX Password. Type a new password and press Enter; verify the new\
    \ password by retyping it and pressing Enter. Don't forget your password, especially\
    \ if your root operator password!\n\n# What Are Some Basic Commands I Should Know?\n\
    \nSee the document \"Common OpenLinux Commands,\" included on this book's CD-ROM,\
    \ for a list of common commands you should know when learning how to use Linux.\n\
    \nHOW TO START LINUX\n\n7"
