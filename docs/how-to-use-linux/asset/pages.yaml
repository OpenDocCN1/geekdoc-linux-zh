  md: '# 4


    # How to Spell Check Documents


    This task introduces you to the spelling checker included with your OpenLinux
    CD-ROM. The program is a flexible, interactive spelling checker with a 30,000
    base word dictionary that can also use your system''s 45,000-word dictionary.
    The spelling checker can be used with or without the X Window System and is generally
    started from the command line, followed by the name of a text document you''d
    like to spell check, like this: ispell mynewdocument.txt.


    # Begin


    # 1 Start ispell


    When ispell starts, the first suspect word is displayed in context. Along the
    bottom of the screen is a menu of commands. To continue checking, press the Spacebar.
    To replace a suspect word with a suggested one, press the number or character
    of the suggested word.


    ```

    ```

    ispell -d

    File Edit Save  File: mynewdocument.txt

    3100 Four Mile Run

    Return: 2206

    00: Ew

    01: Er

    02: La

    03: Li

    04: Lo

    05: Ps

    06: Pr

    07: Re

    08: Wrd

    09: Var

    10: Vor

    11: Vi

    12: Xi

    ```

    ```


    [#] (number) R#pl Alcept Insert Lookup Uimap Qluit E#xit it or ? help


    # 2 Replace Words


    Press the R key to replace a word with a correctly spelled word or phrase. At
    the Replace with: prompt, type the correct word. After you press Enter, ispell
    removes the suspect word and replaces it with your entry.


    ```

    ```

    ispell -d

    File Edit Save  File: mynewdocument.txt

    Automobile have been paid, and will be held in escrow until

    released by attorney, pending currently

    0: litigation

