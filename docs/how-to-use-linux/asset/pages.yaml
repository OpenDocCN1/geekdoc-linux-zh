    # How-To-Hints


    Using Other CD-ROMs with glint

    If you''d like to install rpm packages from other CD-ROMs or a floppy drive, start
    glint, and then click Configure. In the Package field, type the path, as /mnt/floppy,
    and click OK. When you click the Available button, glint searches your floppy
    disk.


    How to Mount a Floppy

    In order to install rpm files from a floppy, you should first mount the floppy.
    For example, to support long filenames on your floppy and mount it at the /mnt/floppy
    directory, type mount -t vfat /dev/fdb0 /floppy.


    OpenLinux Says vfat is not Supported!


    Don''t worry. Use the insmod command to load the vfat kernel module supporting
    long filenames by typing su -c "/sbin/insmod vfat". Try mounting your floppy again.


