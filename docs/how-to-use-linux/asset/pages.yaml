  md: '# CHAPTER 9

    Sending and Receiving Fax Documents


    Most (if not all) modems that work with Linux can send or receive fax documents.
    This chapter shows how to configure and use the efax family of programs to send
    and receive faxes. You need to first read Chapter 7, "Connecting to the Internet,"
    to learn how to set up and test your modem.


    You don''t have to use the X Window System to send, receive, or print faxes, but
    you do need to use X to view any received pages. Follow the tasks in this chapter
    and you should be faxing in no time at all!'
  merge: -1
