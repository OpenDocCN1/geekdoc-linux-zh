  md: '# 6

    CHAPTER

    Finding Files and Text


    There will be more than 67,000 files on your hard drive if you do a full installation
    of OpenLinux. These files include more than 2,000 programs; 11,000 compressed
    text files; 300 uncompressed text files; 1,100 device files; and 6,000 graphics
    files. That''s a lot of files! At some point you might need to know whether a
    certain file is installed, where it''s located, or what it contains.


    This chapter shows you how to find files and how search inside files using the
    kfind client to find what you need. With a little practice, you should be able
    to find anything in your OpenLinux system.'
  merge: -1
