    toolbar are now active. Click these buttons to navigate the GNU info-structure,
    or use the Previous button to return back through your pages.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_72_0.png)


    ''cp'' Copy files and directories


    The cp command is used to copy files independently of the original. You can also
    copy files to directories and rename them.


    ```

    cp [OPTIONS] SOURCE... DEST

    ```


    If the last argument is a directory, cp copies each source into the destination.
    If the last argument is not a directory and more than one source is specified,
    cp fails.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_72_1.png)


    # Set KDE Help Options


    Click the Options menu to set various KDE options, such as toolbars or information
    fields appear in the main window. The General Preferences item enables you to
    set the type and size of fonts, colors to display help.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_72_2.png)


    ''cp'' Copy files and directories


    The cp command is used to copy files independently of the original. You can also
    copy files to directories and rename them.


    ```

    cp [OPTIONS] SOURCE... DEST

    ```


    If the last argument is a directory, cp copies each source into the destination.
    If the last argument is not a directory and more than one source is specified,
    cp fails.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_72_3.png)


    # Search for Help


    One of the most useful KDE Help features is its search function. From the main
    KDE Help window (refer to step 1), click the Search for Keyword text to display
    the KDE Help form. Enter a term, such as floppy, click the Online Manuals button,
    and then click the Submit button. In the KDE window, you will see a list of files
    and files matching your search. Click a topic or man page to view the documentation.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_72_4.png)


    # How-To Hints


    # Browsing with KDE Help


    If you have an active Internet connection (see Chapter 7, "Connecting to the Internet")
    and click a Web site or link while using KDE Help, you will go directly to that
    site''s Web page! This feature, called Network Access or NRA, is built into KDE
    and supported by many applications, including KDE Help.


    # Using KDE Help''s Toolbar


    KDE Help provides a toolbar that operates in the same way as toolbars on web browsers.
    Buttons include Previous Document, Next Document, Previous Node, Next Node, Up
    Node, Top Node, Help Contents, Reload Current Document, and Stop. The buttons
    are handy tools you can use to navigate through GNU documents, and save you the
    trouble of remembering GNU keyboard commands.


    HOW TO USE KDE HELP


