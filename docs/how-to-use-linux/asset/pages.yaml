  md: '# Select a GIMP Menu


    The image is displayed in a GIMP window.

    Use GIMP''s floating toolbar to select different tools, such as the pen, pencil,
    airbrush, fill bucket, eraser. To access the full set of GIMP menus, right-click
    your mouse and hold the button over the image. A series of pop-up menus appears.


    # Save a GIMP Graphic


    To save your graphic, right-click it and choose File | Save as from the pop-up
    menu. The Save Image dialog, click the Selection field and type a filename. To
    select a different graphics format, open the drop-down list to save your graphic,
    open the Options section of the dialog, and when finished, click OK.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_188_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_188_1.png)


    # How Do I Learn More About GIMP?


    GIMP is a complex graphics application, but if you take the time to read about
    its features, you''ll be on your way to creating great graphics in no time at
    all. However, in order to learn more (besides the information in this short manual),
    you must go to http://www.gimp.org for the details. You''ll find a GIMP FAQ, numerous
    tutorials, and a


    # How Do I Configure GIMP?


    Start GIMP, open the File, and choose Preferences. You''ll find many different
    settings you can change, such as the default image size and type, how many levels
    of undo are supported (five is the default), or which directories to use.


    # My System Slows Down When I Open a Graphics File!


    You should be warned that opening large graphics with GIMP can eat up a lot of
    your system''s memory. When this happens, Linux uses the swap file you created,
    and if memory gets "tight", you have a lot of disk swapping. Let''s put it this
    way: The more memory, or RAM, you have, the better you''ll be if you need to edit
    graphics files.


    How TO OPEN A GRAPHIC WITH GIMP 175'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# How to Edit Graphics with the kpaint Client


    This section introduces you to the kpaint program, which comes with the K Desktop
    Environment (KDE) and reads five different graphics formats. You can use this
    program to create your graphics or to edit files to use with KDE.


    # Open a File


    Note that kpaint, like other KDE applications, has a menu bar and a toolbar. The
    program has an additional toolbar, containing basic drawing tools. Open the File
    menu and choose Image; an Open dialog appears. Navigate through your folders and
    scroll through your graphics files. Click a file name and then click the OK button
    to open the file.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_189_0.png)


    # 1 Start kpaint


    Click the Application Starter button, select Graphics, and choose Paint.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_189_1.png)


    # 3 View a Graphic


    Your graphic appears in kpaint''s main window. To enlarge your graphic to work
    on it more easily, click the Zoom In button on kpaint''s toolbar.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_189_2.png)'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# Edit the Graphic


    The graphic enlarges. Click one of the color selector buttons on the right side
    of the display to set an outline or fill color. tool, with the spray can. When
    you''re finished "spraying" your image, choose the Zoom Out to view your work.


    # Save the Graphic


    To overwrite the original file, choose Save Image from the File menu. To save
    the file with a different name, choose File | Save Image as; kpaint''s Save dialog
    appears. Type a filename in the Location field. Note that although kpaint can
    read different formats, you must save the file in JPEG (Joint Picture Experts
    Group) format. Graphic files of this type usually have a name ending in jpg. When
    finished, click the OK button.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_190_0.png)


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_190_1.png)


    # How-To Hints


    Freedom of Choice

    You''ll find many other graphics tools included on your OpenLinux CD-ROM. For
    technical drawing, try the x clients. Another program to try is xpaint. You can
    also use the display command as a graphic''s file editor.


    # How Many Graphics Formats Exist?


    This is a good question. The answer is that you probably don''t have to worry
    about using different graphics when using Linux. Why? Because your OpenLinux CD-ROM
    comes with programs that can read, convert, or write nearly 100 different graphics
    formats. Some programs, such as xv and the ImageMagick suite of commands discussed
    in the next task can convert nearly 70 formats.


    # Kpaint Can Save Only JPEG Graphics?


    At the time of this writing, kpaint was still in beta release (although quite
    usable). This means that by the time you read this, kpaint might have additional
    features and tools and better documentation. Check http://www.kde.org for details
    about the latest versions of KDE application. Besides, you can always convert
    a kpaint graphic to another format by using other graphics utility!


    HOW TO EDIT GRAPHICS WITH THE KPAINT CLIENT 177'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# TASK


    # How to Convert Graphics


    # Begin


    This task shows you how to convert graphics formats. By using a couple of different
    graphics programs, you should be able to read, process, and convert 70 different
    graphics formats. You''ll see how to use the xv and ImageMagick clients to convert
    files.


    1 Start xv and open a graphics file, such as a KDE wallpaper JPG file. From the
    command line of a terminal window, type xv /opt/kde/share/wall-papers/ruins.jpg
    & The graphics app appears in a new window. Right-click the window to display
    the xv Controls.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_191_0.png)


    # 2 Convert and Save the Graphic


    Click xv''s Save button, and the xv Save dialog appears. To convert the graphics
    to a different format, such as TIFF (Tagged Image File Format), click the Format
    button and choose TIFF from the drop-down list that opens. Note that the file''s
    name in the Save file has an extension of .tif. When finished, click the OK button.
    Then, xv asks whether you would like to save the file in one of three TIFF formats.
    Click one, and then click the OK.


    # 3 Start ImageMagick


    ImageMagick is a collection of graphics tools you can use to edit or convert graphics.
    Start ImageMagick by running it from the command line. Type display & ImageMagick''s
    splash screen appears, along with its Open File dialog.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_191_1.png)


