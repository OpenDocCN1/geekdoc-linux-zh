    # 6 Select Geometry and Print


    Click the page size used by your printer and then click the Select button. A small
    print dialog appears. Click Print to print your graphic.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_202_2.png)


    Click


    # How-To Hints


    # Other Graphics Programs


    See Chapter 15, "Capturing and Creating Graphics," for information about GIMP.
    This professional graphics tool also be used to send images to your printer. To
    create technical drawings and other images, try the xfig or xgif clients. To print
    other graphics images, as bitmap files, try the xpaint program. All these software
    packages are included with OpenLinux.


    # Converting Graphics


    You can find more than 175 different graphics-conversion programs on your OpenLinux
    CD-ROM. These programs, part of the portable bitmap, pixmap, graymap, and anymap
    software packages, are used from the command line of your console or X11 window.
    For details, see the pbm, ppm, pnm, and pgm man pages.


