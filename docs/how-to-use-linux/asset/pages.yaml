  md: '# How to Read Documents


    You run across a lot of different document files when you use OpenLinux. Of course,
    you''ve already seen how to read pages and info files, but there are other file
    types on your system. These files can be text, compressed text, HTML, device independent,
    PostScript, or SGML. In the following examples, see how to open and read different
    types of documents from your KDE desktop.


    # Read a Text File


    The KEdit launches and displays your file. Use your cursor keys or drag the vertical
    scrollbars with your mouse to read the document.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_73_0.png)


    Horizontal scrollbar


    # Open a Text File


    Right-click a text (.txt) file on the desktop. In the pop-up menu that appears,
    KDE suggests an application to open the file. Select Editor.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_73_1.png)


    # Open and Read a Compressed Text File


    To open and read a compressed file (usually a file with .gz or .bz2 at the end
    of its name), click the file''s icon. KDE launches the KZip program to decompress
    the file, and then loads the file into KEdit to read.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_73_2.png)


    Vertical Scrollbar


    Double Click'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# # Open and View a PostScript Document


    To view a PostScript document (a file with .ps at the end of its name), click
    the document''s icon. KDE uses the kghstview application to display the file.
    Click a page number in the left portion of the kghstview window to go to pages.


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_74_0.png)


    # # 5 Open and View a DVI File


    To open a DVI file (.dvi), click the document''s icon with your left mouse button.
    KDE uses the kdvi viewer after processing the file (there might be a delay before
    the document is displayed on your screen).


    ![](img/c48ad0dbc61332ca39f773da7141f4e1_74_1.png)


    # ## Casual Browsing From the Command Line


    You can also read documents from the command line of your console or a terminal
    window. Without a doubt, the best program to use is the less pager, which provides
    a way to interactively move forward, backward, and sideways through a file. This
    program also has search and bookmark capabilities. To read a file, use a command
    such as the Hardware-HOWTO.


    # ## Can''t Read Compressed Text Files?


    If you try to use the less command to read a compressed text file, such as Italian-HOWTO.gz
    under the /usr/doc/HOWTO directory, you get a message that says "Italian-HOWTO.gz"
    may be a binary file. Use the unless command, which decompresses and displays
    compressed text files on the fly.


    # ## What Is TeX?


    TeX is a complex and capable text-formatting and typesetting system included with
    your OpenLinux distribution. More than 65 programs and numerous fonts are included
    under the /usr/TeX directory. Getting into the details about using TeX is beyond
    the scope of this book, but if you''re interested, you can find a large amount
    of documentation and sample files in the /usr/TeX/texmf/doc directory.


    # ## How-To Hints


    How to Read Documents 61'
