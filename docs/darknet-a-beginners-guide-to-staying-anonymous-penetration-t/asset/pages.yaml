  pgno: 29
- img_proc: true
  md: 'Being in North America at the time, it would be a few weeks to get up speed
    on all the pros and cons of Tor relays, and not from the technical standpoint,
    but the legal. I envisioned Blackhawk helicopters and car chases involving white
    vans with license plates that read "NOTOJ" should be so unlucky to screw up my
    configuration. With my paranoia aside, I finally got it running full speed, and
    studied the network logs like a hawk to see what it was doing. And I was well-pleased.
    Full of pride, you might say.


    Tor traffic trickled in like a sprinkle before a storm, and after three days my
    node spread just as the bandwidth limits had kicked in. The feeling was euphoric.
    Addicting. I envisioned some tech-starved villager in North Korea accessing something
    forbidden by the Korean government. I kept thinking about Matthew Broderick in
    WarGames and the famous line, "The only way to win the game, was not to play."
    Well, I tweaked it to add, "...by the Man''s rules." It was all good.


    Until a week later when my ISP ordered me to cut the Tor umbilical. It was polite,
    but stern. It seemed a few complaints sailed their way. As my luck would have
    it, that North Korean villager turned out to be a swarm torrentors using Tor to
