  md: '# Chapter 10: How to Defeat the NSA: a Guide to Staying Anonymous


    It needs to be said: The time is nigh for the NSA to dissolve. If not dissolved,
    then at least broken up as Nazi Germany was after WWII. Yeah I hear your eyes
    rolling. Comparing the Nazis again? Please.


    But mission creep, the expansion of a project beyond its original goals (often
    after initial successes) has reared its ugly head again as the NSA, once known
    as "No Such Agency", has far surpassed its original purpose: to secure American
    communications while gathering intel on our enemies. Unfortunately, it seems we
    have become the enemy. we, the path of least resistance, to speak.


    Intelligence gathering is now such a high priority to the NSA that it has gone
    global at the expense of sovereign security. The Tailored Access Operations (TAO)
    directive makes this obvious. Install spyware/backdoors on the enemy''s computers...
    well and good until Snowden revealed that they do the same to their own countrymen.
    It''s called *bulk surveillance*. The more data they have, the louder they are
    on claiming victory over the usual boogeymen: Terrorists. Drug lords. (how long
    was it to catch Bin Laden?). Emails, calls, even video is collected without your
    consent. You could say it a system ripe for abuse, if it were not already rotting
    from the inside out due to [Patriot Act (section 215)].The very notion that the
    NSA can shield itself from Congress and the taxpayers who foot the bill should
    appall most Americans.


    So, what to do when the mother eagle turns on her chicks? Answer: Build your own
    nest. First things first, however. Understand that if you are a high value target
    like Bin Laden or a Mafia don, the'
