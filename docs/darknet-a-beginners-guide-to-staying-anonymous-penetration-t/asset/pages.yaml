  md: '# Chapter 1 - Privacy and Anonymity


    If you''re like one of the many billions of people on the planet who use the internet
    to surf the net, check email, download programs or do any kind of online work,
    then you probably know there are risks associated with being a habitual internet
    user. That''s just how it is. But it is not your fault that there are so many
    latent traps and pitfalls associated with online spelunking, in whatever form
    that may be.


    It is just a fact of life that the Good lives alongside the Evil in our lives,
    offline or online. This book is meant as a guide to distinguish between the Good
    and the Evil, and to conceal your online footprint. To be a ghost on the internet,
    that is our aim.


    This book is not necessarily for the advanced, such as those who teach computer
    science courses, but rather it is for those who like to learn to surf without
    compromising their identity, or having their online habits tracked 24/7, and who
    engage in some risky speech against their government once in a blue moon. It is
    also for those who might not know about some of the little known in their favorite
    “anonymous” software programs. In the end, you might just learn there is a vast
    difference between “anonymity” and “privacy”.


    Let''s start with the basics. I''ll just put that out so you know the weight of
    the privacy situation entirely. As of 2014, you are always being tracked on the
    internet in just about every way you can imagine. Search engines, cookie managers,
    download managers and everything you do online has the potential to make someone,
    somewhere, a LOT of money. Most of the time, this is because lasertargeted advertising
    is extremely profitable. The more they know about your habits, the more money
    they make.'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'How?


    Simple. If they know more about your fears, your likes and dislikes, and how and
    where you spend your money, they can deliver targeted advertising to you. Laser
    targeted advertising. That means more power for them, less for you. Now, advertising
    in and of itself is not such a bad thing, but neither is a loaded gun sitting
    on top of the fridge. By itself it can do nothing. However it is the method of
    execution that defines its usefulness.


    If you type any medical search term into a major search engine such as Google,
    Yahoo, or Bing, soon enough you''ll start to see targeted ads. If you search for
    “how to cure a hangover”, you might not see anything right away, since hangovers
    generally don''t last that long. However if you were to type “how to cure herpes”,
    you will likely be typing variations of that sentence over the course of a few
    weeks or months since it is not an easy condition to treat. Eventually you would
    see pay-per-click ads to manifest themselves in your search engine results in
    the top corners. These ads might be selling all manner of snake-oil remedies for
    the cure to herpes, or they might be referrals to medical specialists.


    The bottom line is this: why do they think you have this disease? The answer is
    because you repeatedly typed it into the search engine over the course of days/months.
    Over the course of a year, how much do you reveal about your medical history and
    identity to your favorite search engine? Do you ever wish you could keep this
    information private?


    They like to “bubble” your identity based on how you search: the time between
    searches, the time of day, your country, your area. With the help of a very specific
    item in your internet portfolio called an IP address, they can even find out where
    you live, who your ISP'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'is, and chart a course right to your very doorstep. With the help of Google
    Maps, and a whole plethora of other mapping applications, this can potentially
    lead to some very annoying and/or embarrassing situations. Do you think this information
    would be valuable to door-to-door salesmen? Or perhaps a company that sends out
    mailed advertisements? Or course.


    But first things first, let''s briefly say a word about the difference between
    privacy and anonymity many would-geeks confuse the two. They are not the same
    thing. Not by a long shot.


    # Anonymity & Privacy - The Differences


    While we shouldn''t waste time splitting hairs here, it is probably a good idea
    to distinguish between the terms “privacy” and “anonymity”. The two terms are
    not really interchangeable as you think. Let''s say that you have Firefox running,
    and you are working from home with a direct connection to your ISP. You don''t
    want anyone knowing what you''re doing, so you select the “private mode” tab in
    Firefox. This disables cookies and inhibits the ability to store any remembered
    websites (unless you choose to do).


    However this privacy only goes so far. It does nothing for the IP address problem
    we discussed earlier. Search engines still see it, as does your internet service
    provider. Both entities know which sites you visit and for how long, based on
    your IP address. In short, they can see everything. Your wife can''t, however.
    That is why privacy mode in web browsers were built: to keep the sites you visit
    private and out of the public view. Is this privacy enough for your needs? You
    certainly have some level of privacy, but anonymity is another matter. Anonymity
    takes privacy to an entirely different level, where'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'the IP address, and thus anything you do online, is extinguished like a wet
    cloth to a candle''s flame through layer after layer of digital barriers. If you
    want to have privacy, use Firefox''s private mode, or use a VPN service provider
    in conjunction with this feature to ensure no one else in your household can see
    your online footprints. This assumes that they do not have access to your laptop
    or PC. If that''s the case, it''s game over.


    If on the other hand you want anonymity, there are several tools are your disposal,
    one of which is to use the Tor network. In doing so, you will guarantee yourself
    strict anonymity and be assured of simple privacy as well...provided you don''t
    do something like blurt out enough info (on a forum, for instance) that narrows
    you down to a city or state.


    > "If money is your hope for independence you will never have it. The only real
    security that a man will have in this world is a reserve of knowledge, experience,
    and ability.

    Henry Ford'
  merge: -1
