  md: '# Chapter 9: Tails


    Edward Snowden. The name rings a bell for most people around the globe. In tech
    circles he is a visionary. As for the non-techies, a few labels come to mind:
    Whistleblower. Hero. Traitor. Regardless of what you pin him with, one thing is
    certain: He hates censorship and loves anonymity, the kind of anonymity that calls
    untrackable execution. Before discussing anything, he insisted liaisons not only
    PGP (pretty good privacy) by the end-all-be-of anonymity tools: Tails-- a thief-simple
    tool that frustrates those in the upper echelon of the NSA. For good reason, since
    even they do not know the wizard who designed it.


    Where Tor is the worm of the anonymous fisherman, Tails is the fishing box. The
    fish at the other end have no idea who is inside the boat, watching, listening.
    It''s a hacker''s tool also a patriot weapon. Using it is a breeze: install it
    on a USB stick, CD, whatever, boot from said stick and find yourself cloaked and
    shielded from the NSA, provided that you don''t outsmart yourself. And if you''re
    using Tails, you''re smarter than that anyway.


    Built upon the shell of Linux, it acts as an operating system and comes with an
    assortment of nukes to launch under Big Brother’s nose: Tor browser, chat client,
    email, office suite and image/sound editor, among others.


    Snowden preferred Tails on account of its no-write rule: no direct data writing.
    A breach from a remote adversary? Not going to happen. Forensics investigation?
    Nope. No trace is to be left on the DVD/USB. Obviously this is no brainer to use
    if you''re an NSA employee looking to spill the beans on unconstitutional spying.'
  merge: -1
  pgno: 67
- img_proc: true
  md: 'as well as a must-have for political dissidents and journalists. It is armored
    with plausible deniability, the same as Truecrypt.


    Tor runs like warm butter when you boot with Tails. There''s not much of a learning
    curve, and no excessive tweaking required. You can use it in the same PC you use
    at work. Boot from USB or DVD. Do your thing then reboot back into your normal
    PC with no record or footprint of your Tailing. For all intents, you''re a ghost
    on the internet. And speaking of ghosts, the creators of Tails are anonymous themselves.
    No one knows their identities. But what we know is they will not bow to governments
    trying to muscle a backdoor into the code.


    Linus Torvalds, creator of Linux, said in 2013, "The NSA has been pressuring free
    software projects and developers in various ways," implying that they had made
    the effort, and all with taxpayer funds. A bit like the cat saying to the mouse,
    "Transparency is good for you. Sleep out in the open and not the damp and dark,
    flea-infested mousehole." They don''t like secrets.


    You might be asking, how we know that Tails does not already have a backdoor?
    How do we know that the NSA has not already greased their hands? The evidence
