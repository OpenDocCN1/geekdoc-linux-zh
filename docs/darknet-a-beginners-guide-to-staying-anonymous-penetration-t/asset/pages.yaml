  md: '# Chapter 4: Torwraiths


    "Who can you trust? Nobody, cause nobody wants you here."


    Those words, uttered by Sean Connery in The Untouchables, are as appropriate for
    darknet discussions as they are for the mafia. But let''s be realistic for a moment.
    There are, as you read this, ten thousand more organized crime syndicates spread
    out over the net than you will ever come across in the "Deep Web". They run the
    same secure, enterprise-grade software that Wall Street banks use and cloak themselves
    better than Ringwraiths. No outside eyes peer unless the alphabet agency has a
    guy on the inside. Cartels like these raise millions in drugs, arms, counterfeit
    pharmaceuticals, mercs and excel at human trafficking.


    The Deep Web is similar, but not that similar. But those who are for outlawing
    it completely are reality advocating for more control rather than for less crime,
    as was the case with Prohibition. They claim the negatives outweigh the positives.
    Let''s say a guy in North Korea gets curious as to why his government is censoring
    information from him. He wants to know why. He uses Tor to access websites blocked
    by the North Korean regime (Facebook for instance, to hook up with an uncle who
    may have escaped to S. Korea). And he does so anonymously is one positive trait.


    But this, they say, does not outweigh the child porn, contract killers and heroin
    runners. They say, people aren''t going to Tor to discuss ways of avoiding the
    mine fields on the border and neither are they discussing the latest enlightenment
    from Tibet. Yes, anonymity has its meritorious moments, but someone wants to'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'hide almost always does so at the circumvention of the law. There are only
    so many North Koreans, after all.


    # Hazards of running a Tor Exit Node


    In 2012, an Austrian named William Weber, an IT admin, was arrested for running
    Tor servers that route anonymous traffic over the Tor network. The charge? Distributing
    illegal items. Police detected the data coming off one of the nodes he ran. A
    police raid ensued. Searched his home. Confiscated his Xbox, iPads, all drives
    and miscellaneous electronics and even his legally owned firearms. The court order
    revealed one of the Tor exit nodes (he ran seven) was transporting the data.


    Notice, we did not state that he transported the data. The data in question is
    going to come down on some node, be it his or someone else''s. That is how Tor
    works: via encrypted traffic that gets piped through servers on its own IP address,
    through various layers (hence the term Onion layer) and decrypted back into its
    initial form. An ISP cannot discern the contents in transit. However, law enforcement
    can see the contents coming out of a node that was sent from the other side of
    the globe. Holding a node operator responsible would be like holding a forum administrator
    responsible because some anonymous poster said he was going to kill the president.'
  merge: -1
