- img_proc: true
  md: 'As of 2014, no one has been sued or prosecuted in a U.S. court of law for running
    a Tor relay (unlike those using BitTorrent). Furthermore, using Tor as well as
    running a Tor relay is perfectly legal under U.S. law.


    # Benefits of Running a Tor Exit Node:


    We''ve talked a little about the risks of being a Tor exit mode. You might be
    saying, well, the risks far outweigh the benefits. And in some places, you''re
    right. But it depends on where you live, the laws, the bandwidth, your setup,
    etc.


    +   What are the benefits?

    - Help people all over the world browse the net anonymously (esp. censorship-prone
    countries)

    - Provide support for the network

    - Exit nodes are always scarce. Your generosity supports development.

    - Defeat tyranny (what''s that? Well, North Korea for one)

    - Prevent websites/search engines from tracking you

    - Help others get beyond the Great Firewall of China

    - Join the Rebel Alliance (yeah right)


    At this point it might be prudent to relay my own experience. The first time I
    used Tor, I was already fairly good as not only admin of several websites and
    hosted machines, but quite good at encryption. My frame of thought was, if I was
    no slouch at encryption, Tor would be a piece of cake. And it was...for a while.
    I had plenty of bandwidth available, so I jumped right in.'
