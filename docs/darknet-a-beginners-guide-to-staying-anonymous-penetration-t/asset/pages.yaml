    to finish the wipe process, dependent on the speed of the hard drive and what
    other programs you have running. It does not touch any installed programs that
    exist already on the system unless you tell it to, and then only that free space
    is allocated for use.


    **Swap file:** Let''s talk briefly about the “swap” file that most operating systems
    use. What this means is that sometimes during heavy PC usage, you will run low
    on system memory, and then the operating system will use your hard drive as a
    temporary ram storage device. This is what is called the “swap file”, which increases
    the speed of computer operations. This swap file can be a veritable gold mine
    of data to someone with nefarious intentions. Text files, video thumbnails, and
    word document fragments can exist herein, enough to print out a pretty good snapshot
    of your past. There have even been court cases where people were convicted in
    court using nothing but thumbnail fragments. You can disable the swap file'
