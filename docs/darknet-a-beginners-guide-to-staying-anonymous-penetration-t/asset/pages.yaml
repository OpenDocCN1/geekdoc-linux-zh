    space is overwritten at again by some other program.


    Government agencies have programs that can delete a file. The way around this
    is to use various programs to securely delete a file, such as Cleaner. This app
    has an interesting wipe utility as well, in that it can wipe the free space of
    any previously deleted contents on the hard drive. You can even do this while
