    Until this is done, every single folder with pictures in it will store a mini-snapshot
    of the pictures unless this is disabled. Windows 7 is a completely different file
    system to Windows XP. Instead of keeping the thumbnail cache within the folder
    where the pictures reside, it stores it in a central location

    (%userprofile%\AppData\Local\Microsoft\Windows\Explorer)


    I have found it much better to just leave the thumbnail option in Windows 7, as
    the images load fairly quickly without the need for a cache to speed up things.
    There are other files, like text, audio and the like, that are also at risk of
    being discovered if you do not take precautions to securely delete the file. That
