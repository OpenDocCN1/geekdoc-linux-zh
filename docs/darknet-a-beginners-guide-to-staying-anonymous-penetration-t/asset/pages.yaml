- img_proc: true
  md: 'A word about torrents and the Tor network. It might seem on the surface that
    running your torrent client through the Tor network would be an obviously beneficial
    idea. After all, if Tor can cloak your regular Firefox downloads, surely it can
    do the same with torrents too, right? Well, yes and no. Yes, you could route your
    traffic through Tor using your favorite torrent client, however this is not a
    good idea for several reasons.


    The first is that Tor was never developed to withstand the kind of punishing traffic
    bandwidth that usually comes from torrenting.


    Secondly, most torrent clients like uTorrent, BitSpirit, and libTorrent are not
    coded properly to make you anonymous on the Tor network. They often ignore their
    socks proxy settings since UDP protocol is heavily involved with torrenting, and
    will send your real IP address to the tracker, thereby defeating the purpose of
    using Tor completely. Tor in fact still does what it is coded to do: send whatever
    packets anonymously through the Tor network to your destination. However, it sends
    your IP address within the torrent tracker right along it...anonymously.


    It would be like sending a secret message in an envelope directly to the person
    you are attempting to hide that message from. This is not a problem with the Tor
    application, but rather the way torrent trackers are coded. The only fix would
    be if the torrent application coders themselves rewrote their applications to
    work harmoniously with the Tor network, something they probably will not get around
    to doing anytime soon (and much to the glee of Tor developers).'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Tor Onion Sites


    One of the most secretive elements of the Tor network is the existence of Tor
    Onion websites, which are pseudo top level domains acting as anonymous hidden
    services. In other words, they are hidden in that they can only be accessed by
    the Tor users themselves residing within the Tor network, rather than the open
    web. The motive for the creation of such hidden sites is so that the admin of
    the site as well as those accessing such sites cannot be traced. Since onion sites
    that are based on the hidden service protocol cannot be accessed from the regular
    internet, the address of the onion site you are looking for must be known. You
    can connect to an onion website on Tor just as you can a regular website, by typing
    the address into the address bar. For example, you might want to go to Tor2Web,
    in which case the address is:


    http://tor2web.org/


    A warning about tor2web: it is intended to offer one-sided security, that is,
    to protect the identity of those publishing content on Tor, not those browsing
    it. If you want to be secure while browsing you''ll need to install the Tor application.
    Convenience and speed should always take a back seat when security is concerned.


    Needless to say, a hidden network would not stay completely benign of nefarious
    webmasters if it wasn''t indeed anonymous. To that end, the Hidden Wiki was developed,
    a singular .onion page with a wikipedia-like structure outlining in every conceivable
    criminal group from political activists to imaginable. There are links to hundreds
    of various .onion sites'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'dealing with everything from how to obtain illegal drugs, warez operations,
    virus creation, anonymous use of Bitcoins, illegal pornography, hacked Paypal
    accounts and even how to hire contract killers. Needless to say, some of these
    sites need to be taken with a grain of salt.


    Be aware of your own country’s laws regarding what can legally be obtained. What
    goes around in Amsterdam or Japan may not fly straight with the authorities in
    the USA. Remember that that exists in Deep Web is just that: information. By itself,
    the information can do nothing. Words are rearranged letters to get your point
    across. Pictures and videos are simply ones and zeros moving across your display.
    It is what they are eventually used for that define their ethics.


    At the core of it, the Hidden Wiki is not terribly dissimilar from any run-of-the-mill
    black market operation offline. It just happens to be online, and accessible by
    anyone with a little search engine sleut capability. Not all of the information
    in the Deep Web is used for nefarious purposes. Like Freenet, there are a lot
    of different sites that concentrate on exposing human rights abuse, political
    corruption, and government scandals involving high-level politicians. In the end,
    it is what you do with the data that determines the criminal element.


    # Testing your IP address visibility on Tor


    When you have installed Tor, you may want to test your IP address to see if it
    is really broadcasting Tor IP and not your real IP address. If you installed the
    default package of Tor, then Tor'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'will show you the IP you are broadcasting as your start page. If you want to
    check it yourself, then go to


    http://whatismyipaddress.com/


    This will show you not only your IP address, but your internet service provider
    as well, and where it is located on google maps. It will also show city and country.
    When you are using Tor, you will see a different city/country than the one you
    currently reside in. Mark down what your IP address is outside of Tor, and check
    this site when your launch Tor if you''re especially paranoid (I am).'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# VPNs


    The last few years have seen an emergence of many different VPN (virtual private
    network) providers with server farms in just about every country. What a VPN does
    is somewhat similar to what the Tor network does. It sends a different IP address
    to your destination, whether that is a webpage, usenet provider, or webhost. There
    are some pros and cons to this. First, a VPN will cost the same amount you would
    get for Usenet service: about ten dollars per month. This amount fluctuates from
    provider to provider. Sometimes it is a little more, sometimes a bit less, but
    all providers have you login to their service the same way you would an ISP. Most
    of the configuration is automatic and doesn''t require any technical wizardry
    to setup. Five minutes, give or take.


    Another difference is that while Tor provides anonymity, and is free, a VPN will
    provide you with *privacy*, but not necessarily *anonymity*. This is because the
    middle man, the VPN in this case, knows your real IP address. They have to know
    this information in order to forward your requests. The VPN service is built upon
    a different technology than Tor. It is built for *speed* and *stability*. Torrenting,
    do you say? Knock yourself out.


    Further, let''s say that you''re a Chinese dissident. You don''t like the way
    your country is headed in regards to speech and human rights. You can''t exactly
    criticize the Chinese government in the Saturday paper can you? Of course not.
    So what is a good, law-abiding dissident to do? You build a news website using
    a VPN in another country and relay your dissent through internet portal. You don''t
    necessarily have to build a website. You could simply setup your newsreader to
    access Usenet via the VPN connection. In'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'that way, the Chinese government could not determine the origin of any anti-governmental
    messages through the use of the IP address (unless of course you hint of incriminating
    personal information that narrows down your location).


    You can also access forbidden places by the Chinese government, such as Facebook,
    Skype, private chat rooms and even Usenet. The reason these kinds of places are
    blocked by the Great Firewall of China is precisely because they are fertile ground
    for free speech enthusiasts. While this might sound like an easy way to circumvent
    the Chinese police, remember that most VPN providers offer connections through
    almost every civilized country you can think of. If you are a Chinese dissident,
    I wouldn''t connect to a VPN located in China, but rather Canada or perhaps a
    country hostile to China. Most VPN providers offer a selection of many servers
    to choose from in which to route your messages and traffic.


    On that note, let''s talk a bit about law enforcement and VPNs. Many in the past
    have erroneously thought that a VPN carried with it a strong dose of anonymity,
    similar to what Tor offered. It doesn''t quite stack up that way. A VPN service
    offers privacy, not anonymity, as we stated. They do not route your data through
    intermediaries the way Tor does. Depending on which VPN you choose, you could
    end up with one in Switzerland who will not cave to anyone''s request for subscriber
    information outside of Sweden. On the other hand, you might have a US based provider
    who will bow down to the whims of any judge''s warrant for subscriber information
    in a New York minute.


    While most are perfectly safe using for purposes of torrents and the like, one
    should think twice about using a VPN in a western country for felonious offenses,
    as they will most likely give your name and address up to law enforcement in order
    to stave off any fines/or'
  merge: -1
  pgno: 23
- img_proc: true
  md: trouble by the government. There are of course ways around this, such as not
    using your credit card and paying anonymously, however sometimes it is better
    not to use a VPN at all for those kinds of purposes (think hackers, smuggling,
    illicit banned goods, drugs etc). Vpns have never been built with anonymity in
    mind. Tread carefully.
  merge: -1
  pgno: 24
