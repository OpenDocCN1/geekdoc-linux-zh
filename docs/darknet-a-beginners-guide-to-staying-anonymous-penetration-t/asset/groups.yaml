    do something like blurt out enough info (on a forum, for instance) that narrows
    you down to a city or state.


    > "If money is your hope for independence you will never have it. The only real
    security that a man will have in this world is a reserve of knowledge, experience,
    and ability."

    > Henry Ford


    # Chapter 2 - The Anonymous Tor Network


    Every Internet Service Provider assigns an IP address to every user who logs into
    their network. From there, you can connect to the millions of websites, newsgroups,
    and online applications that you enjoy most. IP addresses are like phone numbers.
    They tell your computer where to connect and send packets of data. They need this
    information to not only send data, such as html code, flash code so you can watch
    Youtube videos. These are targeted with ads, too. And if you bring task manager
    in Windows, you can see Flash player running. Do you think Adobe is not sending
    data back to them about your habits? Let''s continue.


    So, if the security of online privacy involves concealing the IP address between
    two computers, how do those two computers talk to each other without a direct
    connection? If you hide the phone number, how do you make the call? The answer
    is simple: you have someone else in another country dial the number for you. This
    is the first step to being anonymous online. Do not use the IP address (yours)
    as a direct connection. Hire a middle man to do the talking for you. How is this
    possible? There are several ways. You can use the free online program Tor, which
    acts a relay point between you and your online destination. There are also paid
    services VPNs (virtual private networks) as well as other anonymous networks like
    Freetet and I2P, but we''ll get into the specifics of those later.


    First and foremost, let''s talk about Tor. It is the quintessential solution to
    online privacy, since it masks your IP address. The websites you connect to have
    no way of knowing where you live, which ISP you are using, or what your browsing
    habits are. When you connect to the Tor network, you are establishing a conduit
    whereby if you connect to a website (Google for instance), it connects through
    several layers of IP addresses, or "onion layers" to reach your destination. You
    send out a message, email, or some type of communication. The message then goes
    to Bob, Jane and Herb, finally reaches the end of the line...your favorite webpage.
    routes data (backwards/forwards) through an onion layer of addresses, so that
    no one adversary can see who sent what without very significant resources.


    As you have probably guessed, there is a small speed hit in doing this. In order
    to hide your IP address, several "hops" or intermediaries, have to be jumped through.
    Like portals. Without going into much technical detail, let''s say that these
    hops serve a very valuable purpose: to keep your private communications out of
    the hands of those that intend tonoop on you. Since your IP address changes every
    time you login to the Tor network, they can''t “bubble’ you effectively and target
    you with ads because you look like a different person from a foreign country to
    them each time you login. The Tor relay will end up giving you a different country
    to “pop-out” from each session of your Tor browser, making it impossible to know
    your origin or where you will go.


    Let''s examine an analogy between Tor and regular internet usage. You''re sitting
    in your living room browsing anonymously via the Tor network. Your wife on the
    other hand is sitting in the kitchen on her Macbook, browsing without Tor. You
    might wonder if her browsing habits break your anonymity. They don''t...up to
    a point. While your isp doesn''t know what *you* are doing online, they certainly
    do in regards to your wife.


    Imagine yourself driving down Main Street in a Mercedes with tinted windows. No
    one can peer inside to see what you are doing at the stoplight. Not even the cops.
    Your wife on the other hand has non-tinted windows. People can glance over without
    effort and tell if she is smoking a cigarette, listening to iPod or talking on
    her phone. You are anonymous. She is not. The ISP along with any websites she
    visits can see everything she does online. They can''t see what you are doing,
    however.


    Firefox (and many other browsers) talk to different hosts, with the router acting
    as the traffic cop. An example:


    - Your machine: Port X, Machine A (Tor: all encrypted traffic)

    - Your wife: Port Y, Machine B (without Tor: all visible traffic)


    It''s like shooting in a barrel, and for the NSA, even easier than that. This
    same concept also applies with other things you may do on your machine using Tor.
    If you use BitTorrent, your ISP can still see what you do on the P2P network even
    if you are running Tor simultaneously. But it cannot see the contents of the Tor
    network.


    Thus, don''t do anything on your P2P network that you wouldn''t want your ISP
    to know about. Tor however is a different story since they cannot see what is
    going on between Tor relays. For all intents and purposes, Tor is like a cloak
    of invisibility that shields you from the sight of all onlookers, unless you have
    accidentally ripped a hole in the cloak (i.e. turned on javascript). If you are
    thinking, "Wow, it might be cool to run BitTorrent through Tor so I won''t get
    sued". A nice goal, except BitTorrent devs aren''t falling over themselves to
    implement this feature with Tor, and the Tor network can''t really-handle the
    bandwidth anyway. You''ll just make everyone miserable by downloading those 720p
    Blu-Ray rips you can easily get from Usent (and with SSL, you''re not likely to
    get sued.)


    It might be prudent to spell out some of the best practices using the Tor network
    should you decide to use it. First, although the Tor package comes with a preconfigured
    Firefox browser, there are still some rules you should follow that might not be
    apparent.


    - 1.) Never give any compromising information on the network that could be used
    to identify you. This means using your credit card for purchases, logging into
    a social media site like Facebook. Card transaction are traceable. Tor, in fact,
    may even result in flagging transactions via a Tor exit node.

    - 2.) Never mix browsers. Don''t use the same browser you browse every day to
    Facebook and your ISP email as you do to access the Tor network. Super cookies
    can give away which sites you visit outside of Tor and can lead to a correlation
    attack on your identity/IP address.

    - 3.) Always disable Javascript. The reason for this is that exploits can be used
    to reveal your IP address through using flash. Flash videos as those on Youtube
    only work if this is enabled. After installation of Tor, ensure that the settings
    in the NoScript plugin are ON and not off by default in the plugins options screen.

    - 4.) Install a bare minimum of browser plugins. You want to be as vanilla as
    everyone else. Too many addins, plugins, games, etc., can act as an identity beacon--fonts
    you use, time of day you use certain features, can all be used to build a profile
    on you. BE VANILLA.

    - 5.) Disable any automatic updates in the browser’s options tab. This also includes
    updates for any addons. You should update manually, not automatically.


