    # 暗网


    # 匿名保护新手指南


    ![](img/675a83624bdcd733e68e8d24915eadde_0_0.png)


    LANCE HENDERSON


    # 暗网：在线匿名保护新手指南


    Lance Henderson


    版权所有 2017 Lance Henderson


    保留所有权利。本书的任何部分不得以任何形式或通过任何手段使用、复制或传输。


    如果你更想听有声版，请务必[点击此处](#)获取。它是免费的。


    # 目录


    - 第一章 - 隐私与匿名

    - 第二章 - 匿名 Tor 网络

    - 第三章 - Tor 与种子下载（Torrents）

    - 第四章 - Tor 中继节点

    - 第五章 - Freenet

    - 第六章 - Truecrypt

    - 第七章 - I2P

    - 第八章 - Facebook 及其他社交媒体异类

    - 第九章 - Tails

    - 第十章 - 如何击败 NSA：匿名保护终局指南


    朋友：


    我叫 Lance，是本关于加密安全和匿名书籍的作者。十年来，我一直一直是加密爱好者，并一直撰写关于通用安全的文章。从 20 世纪 80 年代起我一直是许多安全和加密论坛的成员，在那之前我就已经接触计算机技术（是的，我知道这让我听起来像个老古董）。但只要世界上存在安全或加密程序，我就用过并体验过它们的优缺点（并且很可能）引起了当局的注意（后文将详述）。


    当 PGP 首次出现以及 Napster 成为 P2P 交易主导方法时，我就在现场。我用过大多数版本的 PGP、Drivecrypt、Bestcrypt、Truecrypt、Tor、Freetet、I2P
    以及你能想象到的所有衍生版本和模仿品。


    让我们面对现实吧。今天，我们不断受到媒体新闻的轰炸，看到那些被搜查、突袭、逮捕、监禁、折磨和羞辱的人，他们并不一定违反了任何法律，仅仅因为他们不知道“隐私”与“匿名”之间的区别。我等了又等，某个聪明的黑客在亚马逊上发布一些东西来防止这种情况的发生。


    并没有发生。


    所以我决定由我来。我挺身而出，尽管说实话，我一直打算把加密安全的一些基础元素整合在一起，让没有任何安全、加密或匿名知识的人士也能熟悉它们。


    这不是一本特别高深的书，而是一个门户，让新手在上网时可以在获得匿名性的保证下步入其中。为了这一目标，我为你提供了一些工具（大多是免费的）供你使用以实现这一高远目标。如果你是高级用户，你可能会从你喜爱的匿名程序中学到一些隐藏的漏洞。


    使用加密不需要计算机科学博士学位。你也不需要成为任何类型的程序员。你只需要熟悉你的操作系统，并能够完全按照指示操作。如果你知道如何安装操作系统（或任何应用程序），你就可以安全地使用加密程序来保护自己的数字数据和安全。


    > “如果你想要绝对的安全，就去监狱吧。在那里你有饭吃、有衣服穿、有医疗等等。唯一缺失的是……自由。”


    - 德怀特·艾森豪威尔


    # 第一章 - 隐私与匿名


    如果你是地球上数十亿人之一，使用互联网冲浪、检查邮件、下载程序或进行任何类型的在线工作，那么你可能知道作为习惯性上网用户存在风险。事实就是如此。但在线探险（无论何种形式）存在这么多潜在的陷阱和误区，并不是你的错。


    生活中一个事实是，无论线下还是在线，善与恶在我们生活中并存。这本书旨在引导你区分善与恶，并隐藏你的在线足迹。我们的目标是成为互联网上的一个幽灵。


    这本书并不一定针对高级人士（例如那些教授计算机科学课程的人），而是针对那些喜欢在不损害身份的情况下学习冲浪、不希望其在线习惯被 24 小时追踪，并且偶尔会对自己的政府发表一些高风险言论的人。它也适用于那些可能不了解他们喜爱的“匿名”软件程序中某些冷门知识的人。最终，你可能会发现“匿名”与“隐私”之间存在巨大的差异。


    让我们从基础知识开始。我之所以说这些，是为了让你完全了解隐私状况的严重性。截至 2014 年，你正以你能想象的几乎每种方式在互联网上被追踪。搜索引擎、Cookie
    管理器、下载管理器以及你在线上的每一步操作都有可能让某人在某地赚进大笔钱。大多数时候，这是因为精准广告极具利润。他们对你的习惯了解得越多，赚的钱就越多。


    这很简单。如果他们更了解你的恐惧、喜好，以及你如何以及在何处花钱，他们就可以向你投放精准广告。精准广告。这意味着他们的权力更大，你的权力更小。现在，广告本身并不是什么坏事，但放在冰箱顶上的上弹枪也同样如此。它本身无所事事。然而，执行方法决定了它的用处。


    如果你在 Google、Yahoo 或 Bing 等主流搜索引擎中输入任何医疗搜索术语，很快你就会开始看到精准广告。如果你搜索“如何治疗宿醉”，你可能不会立即看到任何，因为宿醉通常不会持续那么久。然而，如果你输入“如何治疗疱疹”，在接下来的几周或几个月里，你可能会反复输入这句话的变体，因为这不是一种容易治愈的疾病。最终，你会看到付费广告出现在搜索结果的右上角。这些广告可能在销售各种治疗疱疹的“蛇油”妙药，也可能是对医学专家的推荐。


    核心问题是这个：他们为什么认为你患有这种疾病？答案是因为你在几天或几个月里反复在搜索引擎中输入了它。在一年中，你向你喜爱的搜索引擎透露了多少关于你的病史和身份的信息？你是否曾希望能够保持这些信息的私密？


    他们根据你的搜索方式来“泡化”你的身份：搜索之间的时间、一天中的时间、你的国家、地区。通过你网络组合中一个名为 IP 地址的非常特定的项目，他们甚至可以发现你住在哪里，你的互联网服务提供商（ISP）是谁，并规划出直达你门口的路线。通过
    Google Maps 以及大量的其他地图应用，这可能会导致一些非常恼人和或尴尬的局面。你认为这些信息对上门推销员有用吗？或者对于一家发送邮寄广告的公司？当然有用。


    但事有其缓，让我们简单谈谈“隐私”与“匿名”的区别——很多极客混淆了这两者。它们不是一回事。差得远。


    # 匿名与隐私 - 区别


    虽然我们不应该浪费时间在这里钻牛角尖，但区分“隐私”和“匿名”这两个词可能是一个好主意。这两个词并不像你想象的那样可以互换。假设你正在运行 Firefox，并在家里工作，直接连接到你的
    ISP。你不希望任何人知道你在做什么，所以你选择了 Firefox 中的“无痕模式”标签页。这禁用了 Cookie 并阻止了存储任何已访问网站的能力（除非你选择这样做）。


    然而，这种隐私只到此为止。它对我们之前讨论的 IP 地址问题毫无帮助。搜索引擎仍然能看到它，你的互联网服务供应商也是如此。这两个实体都根据你的 IP 地址知道你访问了哪些网站以及持续多久。简而言之，他们可以看到一切。然而，你的妻子不能。这就是为什么网页浏览器设计了隐私模式：为了让你你访问的网站保持私密且不被公众看到。这种隐私足够你的需求吗？你确实拥有某种程度的隐私，但匿名是另一回事。匿名将隐私提升到了完全不同的层次，


    '
