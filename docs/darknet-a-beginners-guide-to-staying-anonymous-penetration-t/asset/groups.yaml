  - '[PAGE 33]


    # Chapter 5 - Freenet


    Freenet is unlike any anonymizing beast on the entire internet. It takes quite
    a wizardly mind to crack its protection and to that, it is a bit like chess: easy
    to grasp the basics, long and difficult to become a master. Built in 2000, Freenet
    is a vast, encrypted datastore spanning thousands of connected computers across
    the globe, all distributing encrypted contents from one computer to another. To
    this end, it is somewhat similar to a P2P program like Emule. Except with eEule,
    every file, whether it mp3, rar or iso is out there in the open for weeks, months
    and years, long with the IP addresses, trumpeting who downloaded and uploaded
    every file. You know what you upload, and what you download, and so everyone else.


    Freenet is different in this regard. While your IP address is visible, what you
    are uploading out of your datastore is not. You initially setup the size of the
    datastore for others to download from you. This datastore is encrypted. You have
    no idea what will eventually be inside, as the contents are encrypted. It is a
    bit like a postal worker delivering the mail. He has no idea what is in the package
    he is delivering. That is not his job. His job is to deliver the contents to its
    destination. Therein the strength of Freenet. While you can see your downloads
    merrily trickle their way down to your laptop, there is no way to decrypt your
    datastore’s content and see what it''s passing along to the nearest node. And
    to that, the bigger the datastore, the more efficiently Freenet runs. After one
    inserts a file into Freenet, the user is free to shutdown their pc. This is unlike
    torrents in that the stability of the torrent file is dependent on the length
    of online seeds. Thus, high reliability is a factor with Freenet'
  - '[PAGE 34]


    files, as the file is spread between encrypted blocks residing in the Freenet
    system.


    Freenet is slow. So slow in fact, that you may not see any measurable progress
    in download speed for a couple hours or after install, and it may be a day before
    you can see extensive progress with old (unpopular) files. Don''t get discouraged
    because of this. It will speed up gradually over time.


    Now, with your IP address out there in the open, you might be tempted to think
    it is not very anonymous. Nothing could be further from the truth. Whatever you
    download is encrypted from one end of Freenet to the other, and decrypted on your
    PC. No one looking from the outside can see who requested which file or message.
    No one on the inside knows either, except you. For this reason alone, it is extremely
    censorship-resistant. This level of anonymity requires each node that requests
    data to operate in "hops", from many intermediaries, similar to what you would
    see in Tor.


    However, no node knows who requested which file, thus giving a high level of anonymity.
    This requirement carries a price in that downloads as well as uploads are initially
    extremely slow, especially for new data inserts.


    Let''s say you want to share an iso dvd image on this network. You fire up Frost
    (a front-end addon for Freenet), then hit insert, select the file. Then depending
    on how big your file is, you could be waiting for a long time, say several hours,
    for the file to finish. If this file had been inserted three months prior, and
    was very popular, with dozens of users trying to fetch said file, then that file
    would download very fast. However this is not usually the case with new files
    since every kernel of data on Freenet operates faster and if only if it is a popular
    file.'
  - '[PAGE 35]


    There are two types of security protocols that Freetet offers: Darknet and Openet.
    For Openet, you connect to other users, called “strangers”. There is nothing sinister
    about this, as this is what the Freetet developers envisioned that most beginners
    would use. The IP address of said strangers is visible, but the anonymity of Freetet
    isn’t nested in the security of the IP address like Tor, but rather it is nested
    in the encryption methods of the distributed datastore.


    The other security option, which you are given at installation, is Darknet, where
    you will connect to “friends” rather than “strangers”. These will be Freetet users
    that you will have (presumably) previously exchanged node references, which are
    public security keys. With Darknet mode, it is assumed that you will have a higher
    level of trust, as your node reference is related to your online Freetet identity.
    Needless to say, You really do have to TRUST those you add to this protocol. That
    is, the darknet protocol.


