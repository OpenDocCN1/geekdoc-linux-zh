    to encrypt Freeten usage. This setting is in the security configuration, along
    with a host of other options of varying system requirements. The higher the security
    setting, the slower Freeten will run as it will use more resources to cover your
    footsteps.


    When first installing Freeten, it will likely take no more than a few minutes,
    while asking which security level you would like to operate at (normal up to maximum).
    After that a bit of time allowed for Freeten to find nodes to connect, you''ll
    be presented with a previously hidden world where a Freeten index lists every
    possible combination of Freeten available. Everything from anarchy sites to Iranian
    news, to pirated copies of books, films and game roms and even a few political
    how-to documents describing how to protest a corrupt government without getting
    caught will be indexed. These are the types of things typically censored by Google
    in China, or deindexed altogether. The only thing missing is a disclaimer at the
    bottom of the screen welcoming you to the deepest, darkest depths of the internet,
    known as Darknet.


    Optionally, you may run Freeten from an encrypted Truecrypt container file. You
    will need to create a Truecrypt volume that is sufficiently large enough to hold
    whatever files you intend on downloading from Freet. Remember to keep in mind
    that when Freeten asks you how large you want the datastore to be, the size you
    choose could be a benefit to other Freet users. The larger the datastore, the
    more efficient the Freet network operates. That is not to say that downloads will
    always come down faster, but rather encrypted data will last longer on the network.
    This is similar to the retention times that Usenet providers talk about when they
    try to sell their servers to you. The higher the data retention, the longer the
    files on the network will last. There is also another bonus to having large datastore,
    say fifty gigabytes or so. Files that you may request may already be in your datastore
    after running Freeten for some time, thereby shortening the time to retrieve them.


    With your Truecrypt container you can run Freeten with the volume mounted and
    not worry about your Freeten activities being used against you in case of your
    computer being confiscated. You can also do the same for your Tor browser as well.
    Install Tor browser bundle to a mounted Truecrypt container and only run the program
    when mounted.


    # Frost


    Frost is a separate application than Freeten, which acts as a front-end. It makes
    browsing on the Freeten network more akin to browsing Usenet newsgroups. Download
    at:


    http://jtcfrost.sourceforge.net


    After running Freeten, you can optionally run Frost simultaneously to download
    inserts from the Freeten network. It is not mandatory but it is incredibly helpful.
    Run Freeten, then Frost, and then wait an hour or so for Frost to find some groups,
    and then hit the globe button at the top panel to subscribe to groups. These groups
    all have discussions going about every topic under the sun. Some of them are fairly
    dead, with almost no discussion at all, and others swarm with activity.


    Frosty Tips:


    - 1.) If you started downloading something in Frost, finish it in Frost

    - 2.) Like Usenet, don''t troll the boards. It will get you put on user’s “ignore”
    list and they will henceforth not see any messages from your nick.

    - 3.) Never reveal your node reference to anyone on the Frost boards, as it could
    be used to locate you.

    - 4.) Set days to download backwards to 60 (or however long you wish). Just be
    aware that it may take several days to retrieve all messages if you select a very
    large amount of days.

    - 5.) In the options/preferences tab, you may adjust the setting to ignore comments
    from users with less than four messages attached to their nickname. This is very
    effective at eliminating spam messages on the board.


    # Chapter 6 - Truecrypt


    It would be folly if we went to all this work of laying out the security options
    to keep our online footprint out of nefarious hands and not say something about
    our offline footprint. Put simply, you should tread carefully with your offline
    habits just as you should your online persona.


    Let''s say you''re in your favorite cafe. You''re sipping your ice cappuccino
    with your laptop in the corner of the coffee scented shop and have to make a break
    for the restroom. It''ll only take a minute or so, right? While you''re in there,
    the guy sitting at the next table decided to insert a USB key into your laptop
    and upload a keylogger virus your machine. This keylogger is ridiculously small
    in size, and can hide undetected by most users. It can even disguise itself as
    a window service and look just like any other svchost process, while the taking
    snapshots of your screen, recording everything you typed for the remainder of
    that day, and emailing them to whoever installed the virus. You would be a bit
    worried if you knew about it.


    However, most not realize they leave themselves vulnerable to such attacks in
    public places. Some experts have referred to this as the “evil maid attack”, after
    a scenario whereby you are in a hotel and briefly step outside for a moment and
    at which the point comes in and has physical access to your running machine. They
    now have access to every cookie stored by your browser in addition to any credit
    card numbers you have used, possible phone numbers/emails of friends, and the
    like. How to prevent this?


    For starters, to prevent identity theft you need to seriously consider full-disk
    encryption. This is not nearly as complex as you might think. It is ridiculously
    easy to encrypt your boot drive and costs you nothing, and potentially saves you
    from months of headache.


    There are several encryption apps at your disposal: the paid programs, such as
    PGP, Drivecrypt, and Phonecrypt, and the popular free versions, PGP and Truecrypt.
    There are a few differences between them but the one to take away from both free
    and paid versions is that they inhibit booting your computer, laptop, or phone
    without the password.


    Truecrypt is free, and does this by creating a 256 AES encryption key. You install
    the application, select your drive to encrypt, and select your passphrase and
    create an encrypted key. Simple.


    How does this benefit you? Well, the next time that thief stole your laptop tries
    to boot up the hard drive, without the password will be out of luck. He is presented
    with this password field before windows boots, and if it is not keyed in correctly,
    the drive halts. The password, if sufficiently long, is enough to withstand almost
    any brute-force attack, even by the NSA. Just make sure to use a passphrase that
    will be easy to remember, but long enough to thwart any attacker: 15-character
    passphrase with upper/lowercase letters with a number or two.


    Just how is Truecrypt? It is considered impossible to crack, on the order of millions
    of years. It would take quantum computers eons to crack even a moderately length
    passphrase using brute-force methods. In all likelihood the absolute weakest link
    is you. Keyloggers can obtain your password if you are unlucky enough to get one.
    However, these are a fairly rare occurrence if you keep your operating system,
    anti-virus and anti-malware programs up to date. The other weakest link is your
    passphrase. You would be surprised at just how many people use their personal
    information in their passphrases. Doing this might make the password easier to
    remember but also easier to crack. At each instance a bit is added to a passphrase,
    the computational crunching requirement to crack such passphrase is doubled.


    Dricrypt is another encryption program, but it is not open-source and is not free.
    I have used this program for eight years and have to say if money is a concern,
    then with Truecrypt as it has many of the functions Truecrypt does, and for zero
    cost. Drivecrypt has an option “bootauth” which is short for boot authorization.
    The install process is similar to Truecrypt, though the bootup passphrase screen
    is a little different. You boot your hard drive, and then type in the passphrase
    to boot the OS. Truecrypt has this function as well.


    As stated, it is not open-source. What means that it cannot be studied by the
    public sector (read: security users) to determine if any backdoors have been coded
    in. Like Truecrypt, it offers the option to create an encrypted operating system
    that has a hidden operating system as well whose existence can be denied to those
    trying to harm or prosecute you. This is especially beneficial if you live in
    the UK, where failure to hand over a passphrase to an encrypted hard drive can
    get you two years in prison for contempt of court.

