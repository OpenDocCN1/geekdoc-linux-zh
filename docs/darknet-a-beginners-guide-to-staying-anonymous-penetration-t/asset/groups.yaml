    While I2P is a technical powerhouse for anonymity, it can be a bit like a house
    of cards. Once the Ace is pulled from the bottom layer (by you), it can be rendered
    moot. I2P is just a tool, as is Tor and Freenet. It is not an invisibility cloak.
    Do something stupid, like move too much when a pack of Orcs are looking your way,
    you''re bound to get an arrow in a place where you least expect it. Thus, act
    smart by being proactive in anonymity:


    ## 1.) Turn Off Javascript


    Yes, it bears repeating, with arms waving in the air and shouting at the top of
    my lungs. Javascript is the bane of not only Tor, but other networks that rely
    on cloaking your IP address. Leaving this beastly plugin ON allow code to be run
    on your machine, code that will decloak you. Look at your browser settings and
    disable it. Also disable cookies. Super cookies are deployed in the wild to track
    down Tor users. Don''t let it happen to you on I2P. Javascript can reveal a ton
    of antics that fingerprint a user. Display resolution, page width, font and so
    on can be sent to an adversary by stealth. You''re in doubt, take a look at the
    web API at Mozilla:


    https://developer.mozilla.org/en-US/docs/Web/API


    ## 2.) Silence is Golden!


    Don''t say a peep. Sure, you can talk. Refrain from discussing: the weather, your
    geography, your hobbies, your city politician that was just arrested for soliciting
    hookers. If someone says, "Hows the weather in your town?" You say: "Sunny." Every
    time. Alternatively, you may misinform. The CIA does it, why can''t you? Their
    entire organization is built on secrecy and deception. Don''t get choked up about
    a few white lies. Spreading misinformation about trivial things like the weather
    and the local politics can really put a nail in an adversary''s coffin. Ditto
    on employment. If you are asked about your work and you''re a programmer, say
    you''re a mail sorter down the Post Office. They''re not going to ask you about
    the latest Elvis stamp.


    ## 3.) Rotate Usernames/Nics


    The desire for convenience often gets people in trouble. They use the same usernames
    on multiple sites/forums. That''s fine for the daytime, open web. Not so much
    for the darknet. It breaks anonymity. Take forums for example. When your username
    becomes infamous for a wealth of knowledge, change it. Create a new one. Don''t
    tell anyone. Entropy rises when many users swap information like this on a frequent
    basis. Maintain separate personas: one for the darknet, one for regular internet.
    Memorization is better than writing it down.


    ## 4.) Never turn off your router


    I turn mine off. Ever. If it is constantly going on and off while Freetet, Tor,
    I2P or IRC is running, after a while clues surface as to who I really am, provided
    a sufficiently determined adversary has the resources to do it (NSA). The cost
    in power is negligible, so don''t go cheap with anonymity. As the saying: out
    of speed, anonymity and reliability, you can only pick two, but make up for the
    lost component by acting smart.


    ## 5.) Power in Numbers: Bandwidth


    Don''t be stingy with your connection. The more you participate in the storm of
    users (Freetet, I2P), the more cloaked you will be. It is better to run 24/7 if
    you can. This makes it more difficult for an adversary to discern if you sent
    a file to someone else, or if you are merely the middle man to some file sent
    by a total unknown on the other side of the globe. Besides this, leaving the program
    running just makes it a lot faster network in general for other users. Think Safety
    in Numbers.


    ## 6.) Optional (but smart)


    In the browser settings, set browser.safebrowsing.enabled and browser.safebrowsing.malware.enabled
    to false. Search goliaths Google and Microsoft do not need to know the website
    URLs you visit.


    Get into the habit of flushing the cache--cookies, etc. You can set this to do
    it automatically upon exit of the browser.


    Refrain from using Foxy Proxy to selective proxy .i2 links. You don''t want to
    be sent to the clearnet. If an I2P website is a honeypot, your Firefox browser
    can send a unique identifier in the referrer, in which case... anonymity broken.


    At this point you''re probably thinking this is way more headaches than it is
    worth. And you''d be right...in the beginning. But anything worth doing is usually
    hard at the outset. I well as my colleagues do all of these things only because
    we have done for years. We do them every day. Are we thinking about them? No,
    not in the least on account of smart habits done daily. Do you think intently
    starting your car? Pulling out the driveway? No. But it''s a good bet you were
