    克制使用 Foxy Proxy 来选择性代理 `.i2` 链接。你不希望被重定向到明文网（clearnet）。如果一个 I2P 网站是蜜罐，你的 Firefox
    浏览器可能会在引用页（referrer）中发送唯一的标识符，在这种情况下……匿名性被破。


