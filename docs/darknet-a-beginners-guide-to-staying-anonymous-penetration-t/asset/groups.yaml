    could still use other ports. BitTorrent clients like uTorrent and BitLord can
    run on any port, almost all randomly chosen. Thus every port you add to your exit
    node can connect to another client listening on that same port. Some users even
    enable a range of ports, thereby increasing the chance of getting a DMCA takedown
    for you.


    Hence, we come to the Reduced Exit Policy of Tor, an alternative to the default
    exit policy. You are still able to connect and at the same time block TCP ports
    (usually) used by BitTorrent users. Below are a couple of port lists to check
    against BitTorrent clients:


    https://secure.wikimedia.org/wikipedia/en/wiki/List_of_TCP_and_UDP_port_numbers


    http://www.speedguide.net/ports.php


    What should become clear as crystal at this point is that you should not run an
    exit relay from your house, with emphasis on should not run. Why not? Because
    of the aforementioned scenarios with law enforcement. As we''ve seen in prior
    cases, it is quite easy for them to get a judge''s signature (a judge who knows
