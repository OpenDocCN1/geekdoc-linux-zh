    # 第 2 章 - 匿名 Tor 网络


    每个网络服务提供商（ISP）都会为登录其网络的每个用户分配一个 IP 地址。从那里，你可以连接到你最喜欢的数百万个网站、新闻组和在线应用程序。IP 地址就像电话号码。它们告诉你的计算机连接到哪里以及发送数据包。它们需要这些信息不仅是为了发送数据，例如
    html 代码、flash 代码以便你可以观看 Youtube 视频。这些内容也会针对性投放广告。如果你在 Windows 中打开任务管理器，你可以看到 Flash播放器正在运行。你认为
    Adobe 不会向他们传回关于你习惯的数据吗？让我们继续。


    所以，如果在线隐私的安全涉及到隐蔽两台计算机之间的 IP 地址，那么那两台计算机如何在没有直接连接的情况下相互通信呢？如果你隐藏了电话号码，你该如何拨打电话？答案很简单：让另一个国家的某人为你拨打号码。这是在网上匿名的第一步。不要使用
    IP 地址（你自己的）作为直接连接。雇佣一个中间人替你说话。这如何可能实现？有几种方法。你可以使用免费的在线程序 Tor，它充当你和在线目标之间的中继点。还有付费的
    VPN（虚拟私有网络）以及其他如 Freetet 和 I2P 等匿名网络，但我们稍后会讨论它们的细节。


    首先，让我们谈谈 Tor。它是在线隐私的典型解决方案，因为它掩盖了你的 IP 地址。你连接的网站无法得知你住在哪里、你使用哪种 ISP 或你的浏览习惯。当你连接到
    Tor 网络时，你正在建立一个通道，通过该通道如果你连接到网站（例如 Google），它将通过多层 IP 地址或“洋葱层”到达你的目标。你发送出消息、电子邮件或某种通信内容。消息然后发送给
    Bob、Jane 和 Herb，最后到达线路末端……你喜爱的网页。它（反向/正向）通过洋葱般的地址层路由数据，使得任何对手在没有极大量资源的情况下，都无法看到谁发送了什么。


    正如你可能猜到的那样，这样做会有轻微的性能损失。为了隐藏你的 IP 地址，必须跳过几个“跳节点”或中间节点。就像门户一样。在不涉及过多技术细节的情况下，让我们说这些跳节点具有非常有价值的用途：让你的私人通信避开那些意图监视你的人。由于你每次登录
    Tor 网络时 IP 地址都会发生变化，他们无法有效地对你进行“泡化”并用广告针对你，因为对他们来说，你每次登录时都像是一个来自不同国家的人。Tor 中继会在每次
    Tor 浏览器的会话中为你提供一个不同的国家进行“弹出”，使得无法获知你的起源或你将去向何处。


    让我们来看 Tor 与普通互联网使用之间的类比。你正坐在客厅里通过 Tor 网络匿名浏览。而你的妻子正坐在厨房里用着她的 Macbook 在没有使用 Tor
    的情况下浏览。你可能会想她的浏览习惯是否破坏了你的匿名性。它们没有……在某种程度上是如此。虽然你的 ISP 不知道*你*在网上做什么，但他们对你妻子的情况确实很清楚。


    想象你自己正开着一辆带有色膜窗的奔驰汽车在主街上行驶。没有人可以看向内部看你在红灯处做什么。即使是警察也不行。而你妻子的窗户不是色的。人们可以毫不费力地瞥一眼，判断她是否在抽烟、听
    iPod 或在打手机。你是匿名的。她不是。ISP 以及她访问的任何网站都可以看到她在网上所做的一切切。然而，他们看不到你在做什么。


    Firefox（以及许多其他浏览器）与不同的主机通信，路由器充当交通警察。一个例子：


    - 你的机器：端口 X，机器 A（Tor：所有流量均加密）

    - 你的妻子：端口 Y，机器 B（未使用 Tor：所有流量均可见）


    这就像在桶里射击，对于 NSA 来说，比这还容易。同样的概念也适用于你使用 Tor 在你的机器上可能进行的任何其他事情。如果你使用 BitTorrent，即使你同时运行
    Tor，你的 ISP 仍然可以看到你在 P2P 网络上做什么。但它看不到 Tor 网络的内容。


    因此，不要在你的 P2P 网络上做任何你不想让 ISP 知道的事情。然而， Tor 是另一回事，因为他们看不到 Tor 中继之间正在发生什么。从所有意义上来说，Tor
    就像一件隐身衣，保护你免受所有旁观者的视线，除非你不小心撕开了这件斗篷的漏洞（即开启了 javascript）。如果你在想：“哇，通过 Tor 运行 BitTorrent
    这样就不会被起诉”。这是一个很棒的目标，只是 BitTorrent 开发者并没有急于实现这个功能，而且 Tor 网络根本无法处理这种带宽。


    如果你决定使用 Tor 网络，列出一些最佳实践可能是明智的。首先，尽管 Tor 软件包包含一个预配置的 Firefox 浏览器，但你仍需要遵循一些可能并不明显的规则。


    - 1.) 永远在网络上提供任何可能用于识别你身份的敏感信息。这意味着使用你的信用卡购买物品、登录 Facebook 等社交媒体网站。卡交易是可追踪的。事实上，Tor
    甚至会导致通过 Tor 出口节点的标记。

    - 2.) 永远不要混合浏览器。不要使用你每天访问 Facebook 和 ISP 邮箱的同一个浏览器来访问 Tor 网络。超级 Cookie 可以泄露你在
    Tor 之外访问的网站，并导致对你身份/IP 地址的关联攻击。

    - 3.) 始终禁用 Javascript。此的原因是因为漏洞可以通过使用 Flash 暴露你的 IP 地址。Flash 视频只有在启用此项时才能工作。安装
    Tor 后，确保 NoScript 插件的设置是开启的，而不是在插件选项屏幕默认关闭。

    - 4.) 安装最少量的浏览器插件。你希望像其他人一样纯净。过多的添加项、插件、游戏等可以作为身份灯塔——你使用的字体、你使用某些功能的时间，都可以用来建立你的个人画像。保持纯净。

    - 5.) 禁用浏览器选项卡中的任何自动更新。这也包括任何插件的更新。你应该手动更新，而不是自动更新。


