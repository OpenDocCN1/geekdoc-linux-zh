    为了加密 Freeten 的使用。此设置位于安全配置中，与其他许多具有不同系统要求的选项在一起。安全性设置越高，Freeten 运行得越慢，因为它会使用更多资源来掩盖你的行迹。


    首次安装 Freeten 时，可能只需要几分钟，期间会询问你希望在什么种安全级别运行（从普通到最高）。之后，给 Freeten 留出一点时间寻找连接节点，你将看到一个之前隐藏的世界，其中
    Freeten 索引列出了所有可能的 Freet 可组合。从无政府状态网站到伊朗新闻，从盗版书籍、电影、游戏 ROM，甚至几份描述如何在不被抓获的情况下抗议腐败政府的政治指南，都会被索引。这些都是
    Google 在中国通常审查的、或被完全删除索引的内容。唯一缺失的是屏幕底部的一条免责声明，欢迎来到互联网最深处、最黑暗的领域——即暗网（Darknet）。


    可选地，你可以从加密的 Truecrypt 容器文件中运行 Freeten。你需要创建一个足够大的 Truecrypt 卷，以容纳你打算从 Freet 下载的任何文件。请记住，当
    Freeten 询问你数据存储需要有多大时，你选择的大小可能对其他 Freet 用户有益。数据存储越大，Freet 网络的运行越高效。这并不是说下载速度总是更快，而是说加密数据在网络上的留存时间更长。这类似于
    Usenet 提供商在向你推销服务器时提到的保留时间。数据留存时间越高，网络上的文件存在时间就越长。拥有大型数据存储还有另一个好处，比如大约五十 GB 大。在运行
    Freeten 一段时间后，你请求的文件可能已经位于你的数据存储中，从而缩短了检索它们的时间。


    通过你的 Truecrypt 容器，你可以在挂载卷的情况下运行 Freeten，而不必担心电脑被没收时你的 Freeten 活动会被用来对付你。你也可以对
    Tor 浏览器这样做。将 Tor 浏览器包安装到挂载的 Truecrypt 容器中，仅在挂载时运行程序。


    # Frost


    Frost 是一个 Freeten 独立的应用程序，作为一个前端。它让在 Freeten 网络上的浏览更类似于浏览 Usenet 新闻组。下载地址：


    http://jtcfrost.sourceforge.net


    运行 Freeten 后，你可以选择同时运行 Frost 以从 Freeten 网络下载插入内容。这并非强制性的，但非常有帮助。运行 Freeten，然后运行
    Frost，等待大约一小时让 Frost 找到一些小组，然后点击顶部面板上的地球按钮来订阅小组。这些小组都在讨论着世界上方方面面的话题。其中一些小组相当死气，几乎没有任何讨论，而另一些则异常活跃。


    Frost 小贴士：


    - 1.) 如果你在 Frost 中开始下载某些东西，请在 Frost 中完成它

    - 2.) 像 Usenet 一样，不要在版块上挑事。这会让你进入用户的“忽略”列表，从以后他们将再看不到来自你昵称的任何消息。

    - 3.) 永远不要向 Frost 版块上的任何人透露你的节点引用（node reference），因为它可能被用于定位你。

    - 4.) 将下载天数倒退设置为 60（或你想要的任何长度）。只需注意如果你选择非常大的天数，检索所有消息可能需要几天时间。

    - 5.) 在选项/偏好选项卡中，你可以调整设置，忽略昵称下关联少于四条消息用户的评论。这对于消除版块上的垃圾信息非常有效。


    # 第 6 章 - Truecrypt


    如果我们花费了这么多精力制定安全选项以确保我们的在线足迹不落入坏人之手，却对我们的线下足迹闭而不谈，那是愚蠢的。简单来说，你应该谨慎对待你的线下习惯，就像谨慎对待你的在线人格一样。


    假设你正在你喜爱的咖啡馆里。你坐在咖啡香浓郁的角落，用笔记本电脑喝着冰咖啡，必须去去趟洗手间。只需要一分钟左右，对吧？当你进去时，坐在隔壁桌的人决定向你的笔记本电脑插入
    USB 密钥，并向你的机器上传一个键盘记录器病毒。这个键盘记录器的尺寸小得离谱，大多数用户都无法察觉到。它甚至可以伪装成窗口服务，看起来和任何其他 svchost
    进程一样，同时截取你的屏幕截图，记录你当天剩余时间内输入的所有内容，并将其发送给安装病毒的任何人。如果你知道这件事，你会有点担心的。


    然而，大多数人并没有意识到他们在公共场所让自己容易受到此类攻击。一些专家将此称为“恶女仆攻击”（evil maid attack），源于这样一个场景：你住在酒店，短暂地走到外面片刻，这时有人进入并对你正在运行的机器拥有物理访问权限。他们现在可以访问你浏览器存储的每个
    cookie，以及你用过的任何信用卡号、朋友可能的电话号码/电子邮件等。如何防止这种情况？


    首先，为了防止身份盗用，你需要认真考虑全盘加密。这远没有你想象的那么复杂。加密你的启动驱动器简单得离谱，而且不需要你支付任何费用，并可能让你免于数月的头疼。


    你有几种加密应用程序供你选择：付费程序，如 PGP、Drivecrypt 和 Phonecrypt，以及流行的免费版本 PGP 和 Truecrypt。它们之间存在细微差别，但免费版和付费版共同具备的点是：在没有密码的情况下，它们都能阻止启动。


    Truecrypt 是免费的，它通过创建 256 AES 密钥来实现这一点。你安装应用程序，选择要加密的驱动器，选择你的密码。简单。


    这对你有什么好处？嗯，当下一次偷你笔记本电脑的人尝试启动硬盘时，没有密码他将无计可做。他会看到一个密码字段，如果输入不正确，硬盘就会停止。密码如果足够长，足以抵御几乎任何暴力破解攻击，即使是国家安全局（NSA）。只需确保使用易于记忆但足够长的密码：15
    位，包含大小写字母和两个数字。


    Truecrypt 如何？它被认为是不可破解的，即使使用暴力破解法破解一个中等长度的密码也需要数亿。所有情况下，绝对的薄弱环节是你。如果你足够不幸中中了键盘记录器，它们可以获取你的密码。然而，如果你保持操作系统、防病毒软件和反恶意软件程序的更新，这种情况相当少见。另一个薄弱环节是你的密码。你会惊讶于有多少人在密码中使用了自己的个人信息。这样做可能会让密码更容易记忆，但也更容易被破解。在密码中每增加一个位，破解此类密码的计算需求就会翻倍。


    Dricrypt 是另一个加密程序，但它不是开源的，也不是免费的。我使用这个程序八年了，不得不说如果预算有限，请选择 Truecrypt，因为它具有许多 Truecrypt
    的功能，且免费。Dricrypt 有一个“bootauth”选项，是启动授权的缩写。安装过程与 Truecrypt 类似，尽管启动密码界面略有不同。你启动硬盘，然后输入密码启动操作系统。Truecrypt
    也有这一功能。


    如前所述，它不是开源的。这意味着它无法被公共部门（即：安全用户）研究，以确定是否被植入了任何后门。

