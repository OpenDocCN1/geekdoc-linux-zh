    # 第 4 章：Tor 戒灵（Torwraiths）


    “你能信任谁？没人，因为没人希望你出现在这里。”


    这些由肖恩·康纳在《不可接触者》中说出的话，对于暗网讨论来说，对于黑手党同样贴切。但让我们现实一点。当你读到这些文字时，网络上分布的有组织犯罪集团比你在“深网”中遇到过的还要多出一万个。他们运行着华尔街银行使用的安全企业级软件，自我伪装得比戒灵还要好。除非情报机构在内部有线，否则没有外人可以窥视。这类毒枭在毒品、武器、假药、雇佣兵交易上赚取数百万美元，并擅长人口贩卖。


    深网与之相似，但并不完全相同。但那些主张完全禁止它的人，实际上是在主张更多的控制，而不是更少的犯罪，正如禁酒时期一样。他们声称负面影响大于正面影响。假设一个朝鲜人对政府为何向他审查信息感到好奇。他想知道为什么。他使用
    Tor 访问被朝鲜政权封的网站（例如 Facebook，为了联系一位可能逃往韩国的叔叔）。而他匿名地做到这一点，这是一个优点。


    但他们说，这抵消不了儿童色情、职业杀手和海洛毒贩。他们说，人们去 Tor 不是为了讨论如何避开边境的雷区，也不是为了讨论来自西藏的最新启示。是的，匿名性有其有价值的时刻，但想要隐藏身份的人几乎总是为了规避法律。毕竟，朝鲜人并没那么多。


    ## 运行 Tor 出口节点的风险


    2012 年，一位名叫威廉·韦伯（William Weber）的奥地利 IT 管理员因运行在 Tor 网络上路由匿名流量的 Tor 服务器而被捕。指控罪名是什么？分发非法物品。警方检测到从他运行的一个节点传出的数据。随后发生了警察搜查。搜查了他的家。没收了他的
    Xbox、iPad、所有硬盘和各种杂电子设备，甚至还有他合法拥有的枪器。法院法令显示，其中一个 Tor 出口节点（他运行了七个）正在传输数据。


    注意，我们并没有说他传输了数据。问题中的数据将进入某个节点，不论是他的还是别人的。这就是 Tor 的工作原理：通过加密流量通过到其自身 IP 地址的服务器，经过多个层级（因此被称为“洋葱层”），然后解密回初始形式。ISP（服务提供商）无法识别传输中的内容。然而，执法部门可以看到从地球另一端发送并从节点流出的内容。让节点运营者负责，就像因为某个匿名发帖者说他要杀死总统，就让论坛管理员负责一样。


    滥用 Tor 节点的情况相当常见。2008 年，一名男子在炸弹威胁通过他的 Tor 节点后被德国警察逮捕，同样，他们没收了他的所有电子设备——硬件、软件，并威胁要将其监禁，因为有人滥用了了他的慷慨。这类案件引发了一些相似之处。奥地利政府是否应该因为有非法数据流经其服务器而起诉
    Google？我们讨论的不仅是图片或炸弹威胁。盗版软件、绑架、勒索、贿赂、间谍活动以及一长串的罪行每天都通过他们的搜索引擎发生，尽管 Google 与执法部门合作（像韦伯
    那样），但你上一次听闻 Google 的服务器被法院法令没收是什么时候？


    还有加密问题。Drivecrypt 和 Truecrypt 的开发者是否应该为帮助非法企业而承担责任？Truecrypt 是墨西哥毒枭以及美国组织犯罪集团频繁使用的软件。执法部门，特别是
    FBI，倾向于先开枪后问话。也许吧。如果他们心情不错（或者听从了法官的命令）。与此同时，你的电子设备被没收，声誉也受损了。


    这整个过程多年来一直在创造一种危险的先例，因为任何普通人只要恰好通过他的连接传输了部分非法数据包（或不安全的 Wi-Fi），就可能被起诉。此外，警察并不以技术专长闻名，无论是在奥地利还是其他地方。他们拿走了他的
    Xbox 360 以及任何其他看起来像烤面包机复杂的设备。我们不能让 Tor 节点运营者成为替罪羊。如果 Tor 消失，无辜的人就会死去。他们无法在冒生命生命的情况下传播腐败政府行为的消息。他们不应该为了传播信息而冒任何风险。


    截至 2014 年，尚未有人人在美国法院因运行 Tor 中继而被起诉（与使用 BitTorrent 的不同）。此外，使用 Tor 以及运行 Tor 中继在美国法律下是完全合法的。


    ## 运行 Tor 出口节点的处：


    我们讨论了一些作为 Tor 出口的风险。你可能会说，风险远大于收益。在某些地方，你是正确的。但这取决于你住在哪里、法律、带宽、你的设置等。


    - 有什么好处？

    - 帮助全球范围内的人匿名浏览网络（特别是易受审查的国家）

    - 为网络提供支持

    - 出口节点总是稀缺的。你的慷慨支持了发展。

    - 击败暴政（那是什么？嗯，朝鲜就是一个例子）

    - 防止网站/搜索引擎跟踪你

    - 帮助他人翻越中国防火墙

    - 加入反抗军联盟（得了吧）


