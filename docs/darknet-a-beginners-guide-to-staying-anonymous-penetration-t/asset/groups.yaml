    ## Chapter 8 - Facebook and Other Misfits


    Facebook is a bit of a mixed bag where ethics is concerned. On the one hand, it
    is immensely popular and profit-inducing for a reason: people love to chat with
    relatives, old neighborhood friends, girlfriends, mistresses and political liaisons,
    all in real-time. People love connections. The feeling of unity and solidarity.
    The benefits are fairly immediate if you''re the type of individual who likes
    instant gratification. There is nothing quite like the feeling of seeing old friends
    on your friend''s list who you have not seen in twenty-five years, now instantly
    accessible for a chat session at just about any time of day.


    It used to be Facebook never really rely on the IP address as a P2P network did.
    Times have changed. Nowadays, all of your personal information is theirs for the
    taking, and in some cases offered up on a digital platter by endusers. Your real
    name, phone number, who your past and present friends are, and even your pets
    are all valuable data as it can be targeted with advertising tailored to every
    atom of your personality. What could go wrong, you ask?


    One problem facing Facebook users is that it is all too easy for Facebook to give
    this treasure trove of data up to the highest bidder. Worse, Facebook acts not
    as a protector of the 4th amendment, but as an destroyer of it. Many government
    agencies and local law enforcement have relied on Facebook profiles to establish
    alibis, reveal private emails, and prove or disprove acts that may be criminal
    or not. Read the Facebook privacy policy for yourself:


    > "We may also share information when we have a good faith belief it is necessary
    to prevent fraud or other illegal activity, to prevent imminent bodily harm, or
    to protect ourselves and you from people violating our Statement of Rights and
    Responsibilities. This may include sharing information with other companies, lawyers,
    courts or other government entities."


    They''re mandated by the government to abide by subpoenas user information data
    except any private messages that are unopened and are less than 181 days of age
    (these require a warrant). The problem is that the Supreme Court never recognized
    a 4th amendment right to privacy. That is, data being shared with third parties,
    so the government pretty much has a blank check to engage in “shooting-fish-in-a-barrel”
    type expeditions for subscriber information that may not have anything to do with
    any criminal acts. State and corporation are thus conjoined at the hip in a quasi-fascism
    that is difficult to defeat and predict, never the fact that the government often,
    when it has nothing else to do, creates laws that are meant to be broken--over
    and over (speed limits, anyone?).


    Thus, outside of discussions on anonymity, there is a not much to do when the
    enemy''s archers are standing upon the castle towers with flaming arrows aimed
    at the exposed king. But we''ll try nevertheless.


    Be mindful of what you type on Facebook. Actually, be paranoid, unless you are
    one of the king''s fools. This should go without saying, but the never stream
    of fools on Facebook often doesn''t even recognize your need for privacy or anonymity
    to say nothing of their own. They get accustomed to the personalized interface
    that you start to think they''ve got it in for you with their shouting your real
    name across the internet. You are not anonymous here, or on any other social media
    site--Twitter, Pinterest, Google Plus, etc. In fact, a new Facebook account has
    even less privacy than one on a P2P network like Emule. Where emule is concerned,
    you only had to worry about the ip address. With Facebook, your private life belongs
    to them unless you take drastic action to prevent it. Yes, you may have heard
    more than a few complaints from a few peasants about the lack of privacy on Social
    Media. It hasn''t failed to reach the ears of the ivory tower executives at Facebook,
    Inc. But what do they really think of anonymity?


    ## The Anomaly: Anonymous Facebook Login


    In April of 2014, CEO Mark Zuckerberg announced that Facebook planned to implement
    "Anonymous Login" for all users. It was a misnomer in the same way that "cat owner"
    is a misnomer. It offers more privacy, certainly, but not anonymity. It doesn''t
    come close to anonymity since you cannot login to Facebook *anonymously*. What
    it means is that, using your Facebook login, you can sign in to other websites,
    as at Ars Technica or Wired, and make comments without having grant access to
    the treasure of data Facebook holds on you: your list of contacts, relatives,
    friends, favorite cereals and the fact you hate cats with a brimstone passion.


    Presently they are testing this so called "anonymity" service with a smattering
    of social sites and forums so as to better "benefit the end-user", as Zuckerberg
    claims--grant more control to its userbase on some of the data that gets transferred.
    Notice the word "some"... of the data. Not all.


    And herein is the fallacy: most people, especially those on social media, do not
    know the difference between anonymity and privacy. Thus the masses will gobble
    it. Certainly signing up for a new service can be cumbersome--email, check link,
    click on link, fill out forms, click another link in email, fill out more forms.
    It''s a breath of fresh air to know simpler times are in the pipeline, but let''s
    call what it is: efficiency, not anonymity.


    Most people will think Facebook will stand true to their anonymity statement,
    but the truth of it is that they lied to theirbase out out of the gate, trading
    the mundane term privacy for the much loftier goal of anonymity. Facebook knows
    all about these third party sites you visit, and is willing to offer the data
    up to the highest bidder. Your behavior, your identity, your favorites, all are
    a win-win for Facebook, and a lose-lose for the third party sites and you. If
    a nosy judge wants to uncloak you on a third party site over "slanderous" comment
    you made, they need not go to the third party site. They will go to Facebook.
    They know the name you signed in with, the time you made the comment, the IP address
    you used to bounce to the discussion. Checkmate.


    In interview with Wired''s Steve Levy, Zuckerberg had this to say about their
    new vision:


    > "When we were a smaller company, Facebook login was widely adopted, and the
    growth rate has been quite quick. But in order to get to the next level and become
    more ubiquitous, it needs to be trusted even more. We''re a bigger company now
    and people have more questions. We need to give people more control over their
    information so that everyone feels comfortable using these products."


    Sounds suspicious, does it not? Well, that''s not to say it''s good for the goose
    either. In this case, the third party. Website developers who decide to use Facebook''s
    API to expand their readership will have that decision come back to haunt them
    since Facebook "controls" the client that uses the API login. They can shut off
    the API for the developers just as Nevada can shut off water piping up to California.
    To counter this, they will be ever more vigilant in mining user data and be hesitant,
    if not fully opposed, to using this new "anonymous" setting as grants Facebook
    absolute rule over its userbase. That is, if they were smart. Many are not.


    ## How to Be Anonymous on Facebook


    Facebook is allergic to anonymity. You''ve probably heard that they frown on anonymous
