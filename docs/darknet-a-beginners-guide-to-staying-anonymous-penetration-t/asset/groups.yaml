    # Chapter 9: Tails


    Edward Snowden. The name rings a bell for most people around the globe. In tech
    circles he is a visionary. As for the non-techies, a few labels come to mind:
    Whistleblower. Hero. Traitor. Regardless of what you pin him with, one thing is
    certain: He hates censorship and loves anonymity, the kind of anonymity that calls
    untrackable execution. Before discussing anything, he insisted liaisons not only
    PGP (pretty good privacy) by the end-all-be-of anonymity tools: Tails-- a thief-simple
    tool that frustrates those in the upper echelon of the NSA. For good reason, since
    even they do not know the wizard who designed it.


    Where Tor is the worm of the anonymous fisherman, Tails is the fishing box. The
    fish at the other end have no idea who is inside the boat, watching, listening.
    It''s a hacker''s tool also a patriot weapon. Using it is a breeze: install it
    on a USB stick, CD, whatever, boot from said stick and find yourself cloaked and
    shielded from the NSA, provided that you don''t outsmart yourself. And if you''re
    using Tails, you''re smarter than that anyway.


    Built upon the shell of Linux, it acts as an operating system and comes with an
    assortment of nukes to launch under Big Brother’s nose: Tor browser, chat client,
    email, office suite and image/sound editor, among others.


    Snowden preferred Tails on account of its no-write rule: no direct data writing.
    A breach from a remote adversary? Not going to happen. Forensics investigation?
    Nope. No trace is to be left on the DVD/USB. Obviously this is no brainer to use
    if you''re an NSA employee looking to spill the beans on unconstitutional spying.'
- md: '

    as well as a must-have for political dissidents and journalists. It is armored
    with plausible deniability, the same as Truecrypt.


    Tor runs like warm butter when you boot with Tails. There''s not much of a learning
    curve, and no excessive tweaking required. You can use it in the same PC you use
    at work. Boot from USB or DVD. Do your thing then reboot back into your normal
    PC with no record or footprint of your Tailing. For all intents, you''re a ghost
    on the internet. And speaking of ghosts, the creators of Tails are anonymous themselves.
    No one knows their identities. But what we know is they will not bow to governments
    trying to muscle a backdoor into the code.


    Linus Torvalds, creator of Linux, said in 2013, "The NSA has been pressuring free
    software projects and developers in various ways," implying that they had made
    the effort, and all with taxpayer funds. A bit like the cat saying to the mouse,
    "Transparency is good for you. Sleep out in the open and not the damp and dark,
    flea-infested mousehole." They don''t like secrets.


    You might be asking, how we know that Tails does not already have a backdoor?
    How do we know that the NSA has not already greased their hands? The evidence
    is twofold: the code is open-source (anyone can audit it), and the mere fact that
    the NSA made an effort to sideline end-users says they fear such a powerful package.
    They cannot peer inside to see what the mice are doing. Snowden claimed that the
    NSA, while he was with them, was a major thorn in the side of that organization.


    At the time of Tails conception five years ago, the interest had already started
    to build up in the Tor community for a more cohesive toolbox. "At that time some
    of us were already Tor enthusiasts and had been involved in free software communities
    for years," they said.


    “But we felt that something was missing to the panorama: a toolbox that would
    bring all the essential privacy enhancing technologies together and made them
    ready to use and accessible to a larger public."


    PGP is also included in package. You owe it to yourself and peace of mind to learn
    it. Spend a Sunday with it and you''ll be a competent user. Spend a week and you''ll
    be an enthusiast. As well, KeePassX can be useful if you want to store different
    info (usernames, pass phrases, sites, comments) into one database. These two are
    like a great set of gauntlets no aspiring black knight would do without. And don''t
    think the blacksmiths have just smelted down some cheap metal, either. The designers
    have gone to a lot of trouble to modify the privacy and security settings. The
    more they do, the less you have to.


    This is not to say you should use Tails every day. Only use it in those times
    you feel anonymity is warranted. As mentioned before, if you start mixing up services,
    operating systems and mac addresses, you may blow your cover. Though Tails is
    packaged with programs that one wouldn''t normally associate with anonymity (GIMP,
    OpenOffice, Audacity, etc) you don''t want to leak where an adversary might build
    a profile on you. You''d be shocked at how many applications these days "dial
    home" without your knowledge (hint: almost all of them).


    But the true Achilles heel is the metadata. Tails is really lousy at hiding it.
    It doesn''t try to. It doesn''t clear any of it nor does it encrypt the headers
    of your encrypted emails. Are you an ebook author? Be careful about PDFs and .mobi
    files, as depending on which software you use, it can store the author''s name
    and creation date of your work. But this is not really the fault of Tails. Rather,
    it is the wishes of the development team to stay compatible with the SMTP protocol.


    The other problem with metadata is pictures: JPEGs, TIFF, BITMAPs and so on, which
    again, depending on the software, can store EXIF--data that stores the date the
    picture was taken as well as the GPS coordinates of the image. Newer cameras and
    mobile phones like Samsung Galaxy are notorious for this, and even keep a thumbnail
    of the EXIF data intact for nose parkers with nothing to do all day but to sniff
    through other people''s property.


    fake GPS spoofer may be useful but even that won''t eliminate the exist data.
    You will need a separate app for this. You might even go so far as to use formats
    that don''t store any metadata at all. Plain-text is one option, though even that
    can be watermarked.


    You might think, "Can I hide Tails activity?" The short answer is maybe. It depends
    on the resources of the adversary. And who is the adversary? The government? The
    private detective? The employer? The fingerprint Tails leaves is far less visible
    than what Tor leaves. And yes, it is possible for an administrator to see you
    are using Tor, as well as your ISP. They cannot tell what you''re doing on Tor,
    mind you, but there are Tor Browser Bundle users, and Tails users. All comes down
    to the sites you visit.


    We''ve seen how they can build a profile on you from your resolution, window metrics,
    addons and extensions and time zones fonts, but to alleviate this Tails developers
    have tried to make everyone look the same, as if they were all wearing white Stormtrooper
    armor. Some fall through the cracks, making themselves easier for a correlation
    attack by installing too many addons and thus marking themselves in the herd:
    A purple-colored stormtrooper, if you will. Such and such user has a nice font
    enhancer while no other user does. This alone does not break anonymity, but with
    a hundred other factors and sufficient resources, it might be the one detail that
    breaks the house of cards. Death by a thousand stings.


    You might find Tor bridges (alternative entry points on Tor) to be a good investment
    in reading, as they can better hide you from your ISP. In fact, using a bridge
    makes it considerably harder for your ISP to even know you are using Tor. If you
    decide this route (and you should if merely use Tor can get you arrested– a case
    in which you should NOT use the default Tor configuration), the bridge address
    must be known.


    Mindful of the fact that a few bridges can be obtained on the Tor website. If
    you know about it, others do too–even adversaries like the NSA, but it is still
    stronger for anonymity purposes than the default Tor config. Like Freetet, it
    would be optimal if you personally know someone in a country outside the USA who
    runs a private obfuscated bridge that has the option PublishServerDescriptor 0.
    As always, luck favors the prepared.


    > "The government does things like insisting that all encryption programs should
    have a back door. But no one is stupid enough to think the terrorists are going
    to use encryption systems with a back door. The terrorists will simply hire a
    programmer to come up with a secure scheme."

    Kevin Mitnick


