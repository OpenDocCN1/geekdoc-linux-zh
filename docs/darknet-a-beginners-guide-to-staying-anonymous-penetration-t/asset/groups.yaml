    # 第 7 章 - I2P


    I2P，又名“隐藏网络项目”（Invisible Internet Project），是人们用来隐藏在线 IP 地址的另一种选择。它与其他网络有许多相同特征，即通过邻居节点路由流量。开发者表示，他们的主要目标并不一定是
    100% 的匿名性（某些人认为这个目标是不可能的），而是让攻击系统变得困难且昂贵。它是一种通过多层加密封装所有传输数据的匿名网络。


    # I2P 对比 Tor


    你可能认为这听起来很像 Freetet，但它实际上更像 Tor。I2P 提供了网站、博客、论坛、聊天和搜索引擎的交互，而无需在本地安装任何内容。这些都是 I2P
    的特征。存在于 I2P 网络中的网站被称为 Eepsites，必须通过 I2P 匿名访问。在这里，它类似于只能通过 Tor 访问的 .onion 站点。连接到
    I2P 网络的每个 PC 都会到达终点之前通过代理转发加密包。每个后续代理都会剥离一层加密，直到加密被移除。结论是：没有人知道这些数据的来源，这是 Tor
    也具有的特征。虽然 Tor 和 I2P 的目标不同，但它们存在许多相似之处：


    - 它们都是匿名网络

    - 它们都使用分层加密

    - 它们都有隐藏服务

    - Tor 有出口节点，而 I2P 有出口代理


    # Tor 相比 I2P 的优势


    - 用户群比 I2P 大；有学术来源的支持，不断改进稳定性和抗攻击能力

    - 资金来自全球多个国家

    - 出口节点数量多

    - 翻译成多种语言

    - 针对出口流量进行了优化

    - 内存优于 I2P

    - 使用 C 语言编写


    # I2P 相比 Tor 的优势


    - 隐藏服务比 Tor 网络快得多。

    - 遭受的拒绝服务（DoS）攻击比 Tor 少。

    - 支持点对点文件共享（Tor 不支持）。

    - Tor 隧道相比 I2P 持久得多。这确保了黑客可以使用的样本数量有限。

    - 每个节点都为他人路由数据。

    - 提供 TCP/UDP。

    - 使用 Java 语言编写。


