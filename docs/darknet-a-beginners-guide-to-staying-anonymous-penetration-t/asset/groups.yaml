    of court charge. However you could give them the password to your decoy system.
    There is no way they could know if you were concealing a hidden operating system
    without a keylogger in place.


    Truecrypt and Drivecrypt give no hints or leak any data regarding the existence
    of hidden files. The only way to mount said file is to know the password, and
    there are two you create with such an option: one for the decoy, and one for the
    hidden container/operating system.


    Truecrypt and Drivecrypt also support the use of encrypted container files, which
    when clicked will mount the file the same way a mounting application like DaemonTools
    or Nero mounts an iso image. Prior to mounting, the application will ask you for
    the password. Mistype the password and the container does not mount at all. This
    can be very hard as there are a plethora of private items that you could conceal
    from government or any kind of prosecuting institution, such as medical records,
    tax records, school transcripts, business correspondence and this like.


    Some tips for Truecrypt/Drivecrypt users:


    - 1.) If you have one, disable the firewire port, as this can be used to reveal
    the encryption keys.

    - 2.) Never leave any containers mounted on a laptop when crossing a border station,
    unless you want your private information in said container to be shared with the
    guards.

    - 3.) Never leave your PC powered on and unattended for any lengthy amount of
    time (public wifi spots, cafes, libraries, college classrooms, etc). All security
    goes out the window when an attacker (or anyone else) has physical access to your
    machine. Neither Truecrypt nor Drivecrypt can protect your data in such a case,
    as the attacker can install a keylogger that can record your keystrokes.


    **Thumbnails:** If you possess any incriminating snapshots (files, Wikileak photos,
    informant docs) then at a later time delete the images in the folder, be aware
    that a shadow copy still exists. In windows XP (yes, legions of users are still
    clinging to this OS), thumbnails of jpe are stored within each folder of the image''s
    location. So if you have a folder called "government office snapshots", you will
    have thumbnails enabled in the folder settings for any pictures (jpegs, bitmaps,
    etc.), and a hidden thumbs.db file will be present that shows a mini version of
    the picture in question. So even if you delete the jpegs, this hidden file will
    still reveal to anyone the contents of the original folder were. The only way
    to see or disable this hidden file is to go to Tools – Options – View and set
    the option to “show hidden files and folders.


    Until this is done, every single folder with pictures in it will store a mini-snapshot
    of the pictures unless this is disabled. Windows 7 is a completely different file
    system to Windows XP. Instead of keeping the thumbnail cache within the folder
    where the pictures reside, it stores it in a central location (%userprofile%\AppData\Local\Microsoft\Windows\Explorer)


    I have found it much better to just leave the thumbnail option in Windows 7, as
    the images load fairly quickly without the need for a cache to speed up things.
    There are other files, like text, audio and the like, that are also at risk of
    being discovered if you do not take precautions to securely delete the file. That
    does not mean deleted from the recycle bin, however. When you delete any items
    from the recycle bin, all that does tell the operating system that the space previously
    occupied by that file can be written to again. It does not delete the file permanently
    until space is overwritten at again by some other program.


    Government agencies have programs that can delete a file. The way around this
    is to use various programs to securely delete a file, such as Cleaner. This app
    has an interesting wipe utility as well, in that it can wipe the free space of
    any previously deleted contents on the hard drive. You can even do this while
    the operating system is in use.


    Needless to say, if you have a 2 terabyte hard drive and you’re only using 20%
    of the drive, with 80% being “free space”, then it will be a few hours for it
    to finish the wipe process, dependent on the speed of the hard drive and what
    other programs you have running. It does not touch any installed programs that
    exist already on the system unless you tell it to, and then only that free space
    is allocated for use.


    **Swap file:** Let''s talk briefly about the “swap” file that most operating systems
    use. What this means is that sometimes during heavy PC usage, you will run low
    on system memory, and then the operating system will use your hard drive as a
    temporary ram storage device. This is what is called the “swap file”, which increases
    the speed of computer operations. This swap file can be a veritable gold mine
    of data to someone with nefarious intentions. Text files, video thumbnails, and
    word document fragments can exist herein, enough to print out a pretty good snapshot
    of your past. There have even been court cases where people were convicted in
    court using nothing but thumbnail fragments. You can disable the swap file windows
    uses by going to control panel, System & Security, System, Advanced, Performance,
    Settings, Advanced, Virtual Memory and click Change. Choose “No Paging File”.
    Reboot.


    Note: Some resource intensive games use the swap file to speed up their games
    when there is not enough ram. If you run into any slowdowns with normal PC usage
    you can always switch this option back on, then reboot.


