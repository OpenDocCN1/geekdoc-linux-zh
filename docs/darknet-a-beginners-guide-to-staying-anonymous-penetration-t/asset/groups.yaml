    Tails 包装了一些人们通常认为与匿名不相关的程序（GIMP、OpenOffice、Audacity 等），但你不想泄露对手可能对你建立个人画像的地方。你会惊讶地发现，如今有多少应用程序在你的不知情的情况下“拨回总部”（提示：几乎所有的程序都是如此）。


    但真正的阿喀琉斯之踵是元数据。Tails 在隐藏元数据方面非常糟糕。它甚至没有尝试这样做。它没有清除任何元数据，也没有加密你加密邮件的标头。你是电子书作者吗？小心处理
    PDF 和 .mobi 文件，因为取决于你使用的软件，它们可能会存储作者姓名和作品创建日期。但这真的不是 Tails 的错。反而是开发团队为了保持与 SMTP
    协议兼容的意愿。


    元数据的另一个问题是图片：JPEG、TIFF、BITMAP 等，同样取决于软件，它们可以存储 EXIF 数据——其中存储了照片拍摄日期以及图像的 GPS 坐标。较新的相机和手机（如三星
    Galaxy）在这方面臭名昭著，甚至保留了完整的 EXIF 数据缩略图，供那些整天无所事事、偷窥他人财产的闲人使用。


    虚假 GPS 骗器（fake GPS spoofer）可能有用，但即使那样也无法消除现有数据。你需要单独的应用程序处理。你甚至可以采用完全不存储任何元数据的格式。纯文本是一个选项，即使它也可以被水印。


    你可能会想：“我可以隐藏 Tails 的活动吗？”简单的回答是可能。这取决于对手的资源。谁是对手？政府？私家侦探？老板？Tails 留下的指纹比 Tor 留下的要明显得多。而且是的，管理员可以看到你正在使用
    Tor，以及你的 ISP（服务提供商）。请注意，他们无法知道你在 Tor 上做了什么，但有 Tor 浏览器包用户，也有 Tails 用户。这一切取决于你访问的网站。


    我们已经看到他们如何通过你的分辨率、窗口指标、插件、扩展和时区字体对你建立画像，但为了缓解这一点，Tails 开发者尝试让每个人看起来都一样，就好像他们都穿着白色的风暴兵盔甲一样。有些人掉进了缝隙，通过安装过多的插件使自己更容易受到关联攻击，从而在群体中标记了自己：比方说，一个紫色的风暴兵。比如某位用户有一个很不错的字体增强器，而其他用户都没有。这本身并不会破坏匿名性，但在其他百个因素和充足资源的情况下，它可能就是导致多骨牌屋崩塌的那个细节。千刀穿心。


    你可能会发现 Tor 桥接（Tor 的备用入口点）是阅读上值得的投资，因为它们可以更好地在 ISP 面前隐藏你。事实上，使用桥接让你的 ISP 甚至想知道你正在使用
    Tor 变得困难得多。如果你决定走这条路线（如果仅仅使用 Tor 就会被捕——在这种情况下你**不应该**使用默认 Tor 配置），那么桥接地址必须是已知的。


    注意可以在 Tor 网站上获取几个桥接。如果你知道它，其他人也知道——即使是 NSA 这样的对手，但对于匿名目的来说，它仍然比默认 Tor 配置更强。就像
    Freetet 一样，如果你个人认识在美国外的国家运行具有 `PublishServerDescriptor 0` 选项的私人混淆桥的人，那是理想的。一如既往，天佑有备者。


    > “政府会做的事情是坚持认为所有的加密程序都应该有后门。但没人蠢到认为恐怖分子会使用带有后门的加密系统。恐怖分子会直接雇佣程序员设计出一个安全的方案。”

