    NSA 无论如何都会黑入你连接互联网的电脑或手机。这是无法避免的。如果你在想：“噢，我花了一百美金买了 Drivecrypt 和 Phonecrypt，所以它们对那些骗子来说是安全的，”那么，牛仔哥，有一条坏消息需要你吞下。它们远非安全。


    Drivecrypt 是商业软件且是闭源的，考虑到市面上的免费选择（Truecrypt——开源且经过*审计*的），最好的结果是你只是在为品牌买单。最坏的情况呢？NSA
    在代码中留有后门，或者至少知道一个其他人都不知道的漏洞。你可以参考 NSA 的 BULLRUN 计划，它试图“向商业加密系统、IT 系统、网络和终端通信设备植入漏洞”。


    在一个理想的、维护宪法的国家，保护公民免受外国威胁的安全性应该是首要任务。相反，我们面对的是一个资金充足的巨头，它将对*公民*进行监控和数据采集视为首要任务。再次，想想“最小阻力”。从
    Blizzard 到 Kickstarter 再到 Yahoo，账户被黑事件每月都在发生，而 NSA 似乎无能阻止。事实上的真相与他们引导我们相信的略有不同。


    事实证明，他们确实有能力阻止。但这需要大量重新分配资源，以确保公民受到保护，而不是被监控并被假定犯某种模糊的犯罪。更糟糕的是，权力和影响地位是不平衡且倾斜的。网络司令部完全不应该与
    NSA 的优先级整合。他们的重点应该放在国外，*就像所有其他军事行动一样*，而不是像索伦之眼那样凭空制造犯罪并盯着公民。


    幸运的是，有几个人从 NSA 的库中泄露了足够的数据来发起反击。一个人无法消除他们造成的破坏，但一个国家可以：数百万人可以压制他们的过度扩张，并将他们送回适当的位置。


    如何做到？


    知识就是力量。这随时间推移几乎没有改变，对于 NSA 来说，知识存在于网络本身。那里是 NSA 最喜欢探测和植入后门的地方。为此，他们采集所有数据。一切数据。然后雇佣分析师进行分类。他们监控电话、卫星信息，甚至听听与我们盟友之间往返的海底通话。他们在源头截获瀑布，在高处，或者根据需要从脚下截获。优质的情报，正等待筛选。


    但什么对他们有用呢？嗯，任何能触发最多红旗的东西：涉及的人员、他们的国家、使用的语言、他们的宗教。这一切都根据其算法代理分类的画像进行优先级排序。红旗越多，在图腾上的位置越高……进入元数据的源泉。通过检查元数据比研究完整的电子邮件和对话更容易精挑细目标。这节省了时间，也节省了钱。对
    NSA 来说，元数据就像毒毒贩手中的柯因。那是很有价值的东西。


    系统情报局（Systems Intelligence Directorate）负责此类数据的筛选和排序，每年获得国会拨款数十亿美元来优化其运营。他们不断更新并完善自己的能力。测试哪些有效，哪些无效。高层下达的每一项指令都有一个专门的安全小组。他们所做的就是寻找简化每种渗透策略的方法。按一下按钮让这一切变得极其简单，这个按钮具有全球影响范围。


    NSA 特员可以随心所欲地渗透，但他们特别喜欢像路由器这样未更新的硬件。你上次更新路由器加密密钥是什么时候？没错。NSA 也知道这一点。他们对许多路由器都留有后门，并有整个团队
    24/7 致力于为每个品牌的路由器和密码加密方案寻找漏洞。这一切都是通过 TAO（定制访问操作）完成的。一旦进入你的电脑，他们就可以轻松安装一个自定义记录器，记录你的击击次数并悄悄地避开监视发送出去。你的杀病毒软件检测不到它。一旦完成，你的密码有多复杂都无关了。因此，很容易看出预防有多有价值。


    但人们如何防止这种来自资金充足的实体的入侵呢？答案是加密。加密你的电子邮件。你的数据。你的启动后短语。大多数人不会费心邮件。有些人可能会费心数据。更少的人会费心加密整个操作系统，因为对于
    2TB 的硬盘来说可能需要几个小时。


    几条严格的安全建议：


    - I) NSA 不喜欢 Tor。追踪用户的成本很高。当向国会索要大量资金时，他们就会开始提问并要求结果。他们不希望有人提问。所以请使用 Tor。但是，不要在邮件中写任何即使在网络电视上播播你也无法恢复的内容。不要使用
    Tor 访问你的普通邮箱账户或银行账户。你能看出为什么吗？


    - II.) 为任务关键数据投资一台离线笔记本或笔记本电脑。制作加密备份：蓝光、USB、SD 卡。永远不要让数据进入你的联网电脑，除非是加密格式：Truecrypt
    容器/PGP 加密等。仅在离线且远离互联网的情况下解密信息。学习 SSL/IPsec。许多 Usenet 提供商免费提供 SSL，但默认关闭了。开启它。


    - III.) 尽可能避免商业加密包。专有软件几乎从不经过审计，不像 Truecrypt。当他们害怕人们查看代码时这说明了什么？当加密程序是开源时，它更安全而不是不安全，因为其他人可以验证。当发现后门时，消息会像野火一样蔓，但如果门被钉死就不会。


    - IV.) 屏幕锁不需要完美。如果笔记本电脑被盗，你的数据将由他们支配。使用像 Password Safe 等开源应用来保护它们。


    你可能在想，隐私你需要这些工具吗？Truecrypt 或 SSL 不行吗？短答案是：这取决于你自己的风险水平。如果失去一切，你能接受什么。而你的损失就是 NSA
    的收益，通过他们作为唯一钥匙持有者的威胁。只有当好人无所作为时，他们才能成功。像弹药一样信任加密。而且像弹药一样，它可以在周末学会。但精通需要时间和努力，但要知道加密本身只会让暴政滋生


    ## 结局


    希望如果你读到了这里，那么你现在已经意识到我们未来面临的一些危险。显然，暴露 IP 地址与即将到来的权力夺取相比只是冰山一角。不幸的是，总会有不断新的社交网络和应用程序试图超越
    IP 地址的范围来监控你。多年来，我们已经看到这种情况发生在许多个人应用上：Internet Explorer、Napster、Limewire、Myspace、Facebook
    等。'
