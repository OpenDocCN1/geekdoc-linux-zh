    # Hazards of running a Tor Exit Node


    In 2012, an Austrian named William Weber, an IT admin, was arrested for running
    Tor servers that route anonymous traffic over the Tor network. The charge? Distributing
    illegal items. Police detected the data coming off one of the nodes he ran. A
    police raid ensued. Searched his home. Confiscated his Xbox, iPads, all drives
    and miscellaneous electronics and even his legally owned firearms. The court order
    revealed one of the Tor exit nodes (he ran seven) was transporting the data.


    Notice, we did not state that he transported the data. The data in question is
    going to come down on some node, be it his or someone else''s. That is how Tor
    works: via encrypted traffic that gets piped through servers on its own IP address,
    through various layers (hence the term Onion layer) and decrypted back into its
    initial form. An ISP cannot discern the contents in transit. However, law enforcement
    can see the contents coming out of a node that was sent from the other side of
    the globe. Holding a node operator responsible would be like holding a forum administrator
    responsible because some anonymous poster said he was going to kill the president.'
  - '[PAGE 28]


    Misuse of Tor nodes are fairly common. Back in 2008, a man was arrested by German
    police after bomb threats passed through his Tor node, and similarly, they confiscated
    all electronics--hardware, software, and threatened imprisonment because someone
    abused his generosity. These kinds of cases bring up a few parallels. Should the
    Austrian government use Google for having illegal data flowing through its servers?
    We''re not only talking about images or bomb threats. Warez, kidnapping, extortion,
    bribery, espionage, and a long laundry list of crimes occur on a daily basis via
    their search engine, though Google cooperates with law enforcement (as Weber did),
    when was the last time you heard Google''s servers confiscated by a court order?


    And there is encryption. Should Drivecrypt and Truecrypt developers be held liable
    for helping illegal enterprises? Truecrypt is a software used quite heavily by
    Mexican cartels as well as organized crime in the United States. Law enforcement,
    particularly the FBI, tends to shoot first and ask questions later. Maybe. If
    they''re in a good mood (or ordered by a judge). Meanwhile, your electronics are
    confiscated and your reputation damaged.


    The entire ordeal has been setting dangerous precedent for years, as any average
    Joe who happens to pass some part of an illegal data packet through his connection
    (or unsecured WiFi) can be prosecuted. Furthermore, police are not known for their
    technical aptitude, in Austria or anywhere else. They took their Xbox360 and anything
    else plugged in that looked about complex as a toaster. We mustn''t allow Tor
    node operators to be scapegoats. If Tor dies, innocent people die. They won''t
    get the word out about corrupt government actions without risking their own lives.
    And they shouldn''t have to risk anything to get the word out.'
