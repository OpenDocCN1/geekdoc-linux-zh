  raw:
  - '[PAGE 73]


    NSA will hack your internet-connected computer or phone regardless. There''s no
    getting around it. If you''re thinking, "Well, I paid a hundred claims for Drivecrypt
    and Phonecrypt and so it is safe from those hucksters," there is some bad news
    for you to swallow, cowboy. It is far from safe.


    Drivecrypt is commercial software and closed-source, and considering the free
    offers out there (Truecrypt--open-source and *audited*), the best case would be
    that you''re only paying for the name. Worst case? The NSA has a backdoor within
    the code, or at least knows of an exploit no one else knows about. You can think
    the NSA''s BULLRUN program, which attempts to "insert vulnerabilities into commercial
    encryption systems, IT systems, networks and endpoint communication devices."


    In an ideal, pro-Constitution country, the security of the citizenry against foreign
    threats would be priority one. Instead, we are faced with a well-funded behemoth
    that considers the monitoring and data farming of *citizens* priority one. Again,
    think "least resistance". Hacked accounts from Blizzard to Kickstarter to Yahoo
    occur every month and the NSA seems helpless to stop it. Only the truth is a little
    different than they led us to believe.


    They do have the means to stop it, as it turns out. But it would require a significant
    rerouting of resources so that citizens are protected and not monitored and assumed
    guilty of some obscure crime. Worse, the positions of authority and influence
    are unbalanced and skewed. Cyber Command should not be integrated with NSA priorities
    at all. Their priorities should be focused abroad, *like all other military operations*,
    and not focused on citizens like some Eye of Sauron that creates crime out of
    thin air.'
  - '[PAGE 74]


    Luckily, a few have leaked enough data from the NSA''s coffers to mount a counteroffensive.
    One man cannot undo the damage they''ve done, but a nation can: the millions can
    overpower their overreach and send them back to their proper place.


    How?


    Knowledge is power. This hardly changes over time and for the NSA, the knowledge
    resides in the network itself. That''s where the NSA loves to probe and plant
    their bugs. For this, they farm all the data. Everything. Then hire analysts to
    sort it all. They monitor phone calls, satellite messages and even listen to the
    oceanic calls running to and fro to our allies. They tap the waterfall at the
    source, high above, or beneath our feet if need be. Good intel, ripe for the sifting.


    But what is good to them? Well, whatever sets off the most flags: the people involved,
    their countries, the language they use, their religion. It all prioritize based
    on profiles of their algo agents categorize. The more red flags, the higher the
    totem pole it goes... into a wellspring of metadata. It is easier to cherry pick
    targets by examining metadata than to study complete emails and conversations.
    It saves time. It saves money. Metadata to the NSA is like cocaine to a drug dealer.
    It''s valuable stuff.


    The Systems Intelligence Directorate does the data sifting and sorting in this
    case, is given billions by Congress to optimize its operations every year. They
    are always updating and honing their capabilities. Testing what works and what
    doesn''t. A security group exists for each directive handed down by the brass.
    They do nothing but look for ways to streamline each infiltration tactic. Make
    it all blood simple with the push of a button, a button that has global outreach.'
  - '[PAGE 75]


    NSA agents can infiltrate at will, but they especially love non-updated hardware
    like routers. When was the last time you updated your router encryption key? Right.
    The NSA knows this as well. They have a backdoor for many of them and entire teams
    devoted 24/7 to finding exploits for every brand of router and password encryption
    scheme. This is all accomplished by the TAO (Tailored Access Operations). Once
    inside your PC, they can easily install a custom-made logger that records your
    keystrokes and will send them quietly under the radar. Your anti-virus will not
    detect it. Once it is done, it doesn''t matter how complex your password is. Thus,
    it is easy to see how valuable prevention is.


    But how can one prevent such an intrusion from a well-funded entity? The answer
    is encryption. Encrypt your email. Your data. Your boot post phrase. Most people
    will not bother with email. Some might bother with data. And fewer still bother
    with encrypting the entire OS as it can take hours for a 2TB hard drive.


    A few strict security suggestions:


    +   I) The NSA does not like Tor. It''s expensive to track users. When a lot of
    money is asked of Congress, they start asking questions and demanding results.
    They don''t want anyone asking questions. So use Tor. However, do not say anything
    in an email that you would not recover from if it was broadcasted on network TV.
    And do not access your normal email account or bank account using Tor. Can you
    see why?


    +   II.) Invest in an offline notebook or laptop for mission critical data. Make
    encrypted backups: Blu-Ray, USB, SD. Never allow the data'
  - '[PAGE 76]


    onto your internet PC unless encrypted form: Truecrypt

    containers/PGP encrypted, etc. Only decrypt messages offline and

    away from the internet. Learn about SSL/IPsec. Many Usenet

    providers offer SSL for free but leave it off by default. Turn it on.


    III.) Whenever possible, avoid commercial encryption packages.

    The proprietary software is almost never audited, unlike Truecrypt.

    What does that tell you when they are afraid of people looking at

    the code? They''re hiding something from you. When an encryption

    program is open-source, it is more secure, not less, because others

    can verify its security and detect any back doors. Word spreads like

    wildfire when a backdoor is discovered, but not if the door is nailed

    shut from the other side.


    IV.) Your screen lock does not have to be perfect. It won''t keep

    out any government agents but it may keep out nosy wives and

    friends. If however the OS is not encrypted and your laptop is stolen,

    all your data is theirs for the taking. Use an open-source app like

    Password Safe to secure them all from prying eyes.


    You''re probably thinking, why do you need all of these tools for

    privacy? Shouldn''t Truecrypt or SSL for your Usenet be?

    The short answer is: it depends. It depends on your own level of risk.

    What you can live with if all is lost. And your loss is the NSA''s gain,

    through threats of lawsuits and coercions unconstitutional

    spyying. They''ve almost succeeded in turning the web into a vast

    Orwellian looking glass-- with themselves as the only keymasters.

    They can only succeed if good men do nothing.'
  - '[PAGE 77]


    Trust encryption like you trust ammunition. And like ammunition,

    it can be learned in a weekend. Mastery however takes some time\and effort, but
    know that by itself, it will do nothing but allow tyranny

    to flourish unless used for its original purpose.'
  - '[PAGE 78]


    # Endgame'
  - '[PAGE 79]


    Hopefully if you have read this far, then you are now aware of some of the dangers
    that await us in the future. Clearly, having an exposed IP address is only a drop
    in the ocean next to the coming power grab. Unfortunately, there are always going
    to be up and coming social networks and applications that try to go above and
    beyond the use of the IP address to monitor you. We have seen it happen with many
    personal applications over the years: Internet Explorer, Napster, Limewire, Myspace,
    Facebook and the like. These make their profits by subverting your personal choices
    and then targeting you based on those choices, and when you get right down to
    it, the longer you put off protecting your individuality, the less choice you
    will have in the long run. However, you now have at least an effective arsenal
    of tools in which to minimize this subversion. If enough people take notice, it
    may stem or even reverse the tide of fascism coming over the hills.'
  - '[PAGE 80]


    More and more we are seeing a gradual erosion of privacy. Some employers reject
    applicants to entry level positions based on credit score. Some employers demand
    Facebook usernames and passwords before hire. Some fire employees for words on
    a Facebook post. In the end it is all about control and eroding individual choice.
    For there is no one in the universe more unique than you. You are worth more than
    all the stars combined, and they know it. And want to control it. And there is
    no such thing as controlling just a little bit of a star.


    Stay safe, always.'
