    Using `yum-config-manager` command to enable/add/disable repositories. You need
    to install `yum-utils` to use `yum-config-manager`.


    ```bash

    # yum install yum-utils

    ```


    ### Disable already enabled repository


    First list all repositories

    ```bash

    # yum repolist all

    ```


    ### Disable the repository


    To enable and disable the repository use repository id which you will get through
    list command.


    #### Syntax

    ```bash

    # yum-config-manager --disable repository_id

    ```


    #### Example

    ![](Image00050.jpg) # `yum-config-manager --disable InstallMedia-AppStream`


    ### Enable a repository

    ```bash

    # yum-config-manager --enable InstallMedia-AppStream

    ```

    ![](Image00051.jpg)


    ### Add repository


    Repositories usually provide their own `.repo` file for repository configuration.
    To add repository which provides `.repo` file, you can use this command.


    #### Syntax

    ```bash

    # yum-config-manager --add-repo repository_url

    ```


    #### Example

    ```bash

    # yum-config-manager --add-repo https://www.example.com/abc.repo

    ```


