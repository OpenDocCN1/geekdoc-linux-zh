    Selinux 实现了 MAC，即强制访问控制（Mandatory Access Control）。Selinux 是一组安全规则，决定哪些进程可以访问哪些文件、目录或端口等。访问进程、目录和文件的
    SELinux 策略被称为上下文（context）。Selinux 的目标之一是保护数据和系统。Selinux 有三种访问控制形式：


    1. `Enforcing`（强制模式）

    2. `Permissive`（许可模式）

    3. `Disabled`（禁用）


    ### Enforcing

    Selinux 根据 SELinux 策略规则拒绝访问。


    ### Permissive

    Selinux 不拒绝访问，但对于在 `enforcing` 模式会被拒绝的操作会记录日志。


    ### Disabled

    Selinux 已完全禁用。


    ### 检查安装

    ```bash

    rpm -qa | grep selinux

    ```


    ### 安装 selinux

    ```bash

    yum install policycoreutils-python

    ```


    ### 检查当前模式

    ```bash

    getenforce

    ```


    ### 检查状态

    ```bash

    sestatus

    ```


    ### 主配置文件

    `/selinux/config`


    ### 更改模式

    编辑 `/etc/selinux/config` 文件并将 `selinux=enforcing` 改为所需的模式如 `selinux = permissive`。保存文件并重启服务器。如果你将模式设置为
    permissive，可以检查日志查看 SELinux 正在做什么。

    ```bash

    cat /var/log/messages | grep -i selinux

    ```

    或者

    ```bash

    tail -f /var/log/audit.log

    ```


    ### 显示上下文的命令


    | 描述 | 命令 |

    | :--- | :--- |

    | 列出进程 | `ps aux` |

    | 显示用户上下文 | `id` |

    | 显示文件上下文 | `ls -l` |

    | 复制上下文 | `cp` |

    | 创建上下文 | `mkdir` |


    ### 修改上下文的工具

    ```bash

    semanage

    ```


    ### 显示上下文

    ```bash

    semanage fcontext -1

    ```


    ### 类型

    使用 targeted 策略的主要权限控制方法提供了高级的进程隔离。所有文件和进程都被标记为类型。SEelinux 域（domain）定义：

    * `httpd_sys_content_t`

    * `tmp_t`


    ### 添加上下文

    ```bash

    semanage fcontext -a -t httpd_sys_content_t /abc/zzz.txt

    ls -Z

    ```

    输出：`-rw-r-- root unconfined_u:object_r:samba_share_t:s0 zzz.txt`


    ### 设置默认上下文

    ```bash

    restorecon -v /abc/zzz.txt

    ```


    ### 布值

    SELinux 策略允许在运行时更改布值。


    ```bash

    semanage boolean -l

    ```


    ### 配置布值

    在此示例中，我们将允许读写用户目录：


    1. 列出所有：

    ```bash

    semanage -l

    ```

    2. 列出布值是否开启/关闭：

    ```bash

    getsebool -a

    ```

    3. 允许读写用户目录：

    ```bash

    setsebool -P ftp_home_dir on

    ```

    4. 检查：

    ```bash

    getsebool ftp_home_dir

    ```

    输出：`ftp_home_dir --> on`


    # 第 30 章 系统监控工具


    持续监控是系统管理的重要部分。系统监控有助于为项目合理配置资源。它还有助于调整服务器。适当监控可以避免资源瓶颈导致的不必要停机，可以使用工具预测硬件故障。


    ### 查看系统进程

    `ps` 显示运行进程报告。它是当前进程的快照。查看系统上的所有进程及其所有：

    ```bash

    ps aux

    ```

    列出所有相关线程：

    ```bash

    ps ax

    ```


    ### Top

    `top` 命令显示 Linux 机器处理器活动。`top` 命令显示系统运行进程列表，还显示关于 CPU、内存和交换区的当前使用附加信息。

    ```

    top -21:59:05 up 5:58, 3 users, load average: 0.16, 0.03, 0.01

    Tasks : 188 total, 187 sleeping, 0 stopped, 0 zombie

    %Cpu(s) : 0.0 us, 0.7 sy, 0.0 ni, 97.7 id, 1.0 wa, 0.3 hi, 0.3 si

    KiB Mem : 2045748 total, 168512 free, 1038120 used, 839116 buff/cache

    KiB Swap : 2097148 total, 1906704 free, 190444 used, 89136 avail

    PID USER PR NI VIRT RES SHR S %CPU %MEM TIME

    1771 root 20 0 406112 10888 7084 S 0.3 0.5 0:30.40 vmtoolsd

    5854 root 20 0 156652 3960 3456 R 0.3 0.2 0:00.03 top

    1 root 20 0 215220 8316 5820 S 0.0 0.4 0:09.58 systemd

    2 root 20 0 0 0 0 S 0.0 0.0 0:00.03 kthreadd

    3 root 20 0 0 0 0 S 0.0 0.0:0:02.07

    ```


    ### 系统监控工具

    持续监控是系统管理的重要部分。系统监控有助于为项目合理配置资源。它还有助于调整服务器。适当监控可以避免资源瓶颈导致的不必要停机，可以使用工具预测硬件故障。

    '
