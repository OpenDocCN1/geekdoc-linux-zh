    DVD ISO as YUM Repository


    When you are using Redhat servers in production environment there are four ways
    to install the additional software.


    1.  Server has internet access so it can install software from RedHat web repositories.


    2.  You have your own satellite server which provides the content.


    3.  Using downloaded ISO image


    4.  Directory as repository.


    In the procedure bellow we will explain the scenario where your server doesn’t
    have internet and satellite server connection.


    You can make downloaded RHEL ISO image as repository in three ways. If you have
    DVD drive in the server. you can write the image to DVD and use this DVD drive
    to copy the content to local directory so in case you remove the DVD still repository
    will work. Other scenario can be you have ISO image and the server is a virtual
    machine you can attach the ISO image to the server. Third scenario which I generally
    use is that I will transfer the ISO file to the server and loop mount the ISO
    image so that its contents are available as repository. I will explain the third
    scenario but the procedure is almost same for all three scenarios, the repository
    directory must have contents it doesn’t matter how you copy the contents.  


    Steps are bellow:-


    1.  Download the ISO image


    2.  Transfer the image to the target server using scp or FTP. In this example
    ISO had already been transferred to the server in /disc directory


    3.  Make Directory for mounting the ISO image. This directory will be used as
    repository.


    # mkdir /rhcd


    4.  Mount RHEL DVD ISO


    Syntax


    mount -o loop /path_to_iso /mount_point


    Example


    # mount -o loop /disc/RHEL8.iso /rhcd'
