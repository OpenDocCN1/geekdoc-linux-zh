- fmt: "\n## 5. Create `.rep` repository configuration file with following content.\
    \ If you are coming from old version of RedHat there is change in RedHat version\
    \ 8, now you have to define two repositories instead of one which are `BaseOS`\
    \ and `Appstream`\n\n```bash\nvi /etc/yum.repos.d/rhiso.repo\n```\n\n```ini\n\
    [InstallMedia-BaseOS]\nname=Red Hat Enterprise Linux 8 - BaseOS\nmetadata_expire=-1\n\
    gpgcheck=1\nenabled=1\nbaseurl=file:///rhcd/BaseOS/\ngpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release\n\
    \n[InstallMedia-AppStream]\nname=Red Hat Enterprise Linux 8 - AppStream\nmetadata_expire=-1\n\
    gpgcheck=1\nenabled=1\nbaseurl=file:///rhcd/AppStream/\ngpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release\n\
    ```\n\nClean the yum cache\n\n```bash\nyum clean all\n```\n\nNow list the repositories\n\
    \n```bash\nyum repolist\n```\n\n## Own Custom Repository\n\nThere are cases when\
    \ you require to create your own repository. For example you have developed a\
    \ software and it is in rpm format for distribution or you may have downloaded\
    \ some set of software which you want to distribute through repository. To make\
    \ your own custom repository for RPM packages the steps are following :-\n\n1.\
    \ Create directory for your custom repository.\n```bash\nmkdir /myrepo\n```\n\n\
    2. Transfer/ download files to this directory\n\n3. Use `createrepo` to create\
    \ `repodata`. If `createrepo` command is not there than first install `createrepo`\
    \ command. `createrepo` is provided by the `createrepo_c` package.\n\n```bash\n\
    yum -y install createrepo_c\ncreaterepo /myrepo\n```\n\n4. Create configuration\
    \ files\n\n`/etc/yum.repos.d/mycustom.repo`\n\nBelow is example of custom repo\
    \ file\n\n```ini\n[mycustomrepo]\nname=Custom Repository\nbaseurl=file:///myrepo/\n\
    enabled=1\ngpgcheck=0\n```\n\n## Chapter 9. Managing services\n\nWhen system boot,\
    \ it starts and stops some services to achieve required state of the system. Suppose\
    \ you want to start the system in GUI mode, system has to start all the services\
    \ related to Desktop environment. Same way if you have configured the server as\
    \ web server you have to start the web services during boot process. Even to do\
    \ its basic tasks it requires many services to be running like network, date and\
    \ time etc. In the older versions of Redhat enterprise Linux `SysV` was the default\
    \ service manager. `SysV` use to start services one by one at boot time this means\
    \ next service will start once previous service finish starting. In RHEL version\
    \ 7 `Systemd` was introduced.\n\n### Introduction to systemd\n\n`Systemd` is a\
    \ system and service manager for RHEL 8. It has limited backward compatible with\
    \ `SysV` init scripts. It provides number of new features like:-\n\n- Parallel\
    \ startup of system service at boot time\n- On demand activation of devices\n\
    - Dependency based service control logic\n- Path-based activation: on demand activation\
    \ of services when a particular file or directory changes its state\n- Device\
    \ based activation (like USB)\n- Earlier BOOT Logging\n\nBefore `systemd`, previous\
    \ versions of RHEL used `SysV` scripts located in the `/etc/rc.d/init.d/` directory\
    \ to control the system state. With `Systemd` these init scripts have been replaced\
    \ with service units, service units reside in `/etc/systemd/system/` directory.\
    \ Service units end with the `.service` file extension. `systemctl` command is\
    \ used to view, start, stop, restart, enable, or disable system services. If you\
    \ are coming from Redhat version 6 or earlier there use to be more than one command\
    \ for service management, like for service status management `service` command\
    \ and for service startup management `chkconfig` command. With `Systemd` it has\
    \ been replaced by single command `systemctl`. Now `systemctl` command can handle\
    \ both service management and its startup at boot.\n\n### Systemd unit files locations\n\
    \n| Detail | Command |\n| :--- | :--- |\n| `/usr/lib/systemd/system/` | Systemd\
    \ unit files initially get installed here. |\n| `/run/systemd/system/` | At run\
    \ time Systemd unit files are created. here this directory takes precedence over\
    \ the directory with installed service unit files. |\n| `/etc/systemd/system/`\
    \ | When you enable a service Systemd unit files created here as well as unit\
    \ files added for extending a service. This directory takes precedence over the\
    \ directory with runtime unit files. |\n\n### Service Status Management\n\n| Detail\
    \ | Command |\n| :--- | :--- |\n| Starts a service | `systemctl start name.service`\
    \ (Example `systemctl start iscsi.service`) |\n| Stops a service | `systemctl\
    \ stop name.service` (Example `systemctl stop iscsi.service`) |\n| Restarts a\
    \ service | `systemctl restart name.service` (Example `systemctl restart iscsi.service`)\
    \ |\n| Restarts a service only if it is running. | `systemctl try-restart name.service`\
    \ (Example `systemctl try-restart iscsi.service`) |\n| Reloads configuration |\
    \ `systemctl reload name.service` (Example `systemctl reload iscsi.service`) |\n\
    | Checks if a service is running. | `systemctl status name.service` (Example `systemctl\
    \ status iscsi.service`, `systemctl is-active iscsi.service`) |\n| Displays the\
    \ status of all service | `systemctl list-units --type service --all` (Example\
    \ `systemctl -at service`) |\n\nLike `chkconfig` in earlier versions, you can\
    \ use the `systemctl` to control the services during system boot.\n\n### Enable\
    \ and disable service at startup\n\n| Task | Command |\n| :--- | :--- |\n| Enable\
    \ service | `systemctl enable name.service` (Example `systemctl enable iscsi.service`)\
    \ |\n| Disable service | `systemctl disable name.service` (Example `systemctl\
    \ disable iscsi.service`) |\n| To prevent service from starting dynamically unless\
    \ masked | `systemctl mask name.service` (Example `systemctl mask iscsi.service`)\
