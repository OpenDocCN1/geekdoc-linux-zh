    \n```bash\nsemanage fcontext -a -t httpd_sys_content_t \"/var/www/html/abc_example.com(/.*)?\"\
    \nsemanage fcontext -a -t httpd_sys_content_t \"/var/www/html/xyz_example.com(/.*)?\"\
    \nrestorecon -R -v /var/www/html/\n```\n\n## Verify the context\n\n```bash\nls\
    \ -laZ /var/www/html/\n```\n\n## 5. Configure your virtual host configuration\
    \ directories\n\nCreate two directories for configuration files for virtual sites-&nbsp;one\
    \ directory is for all configured websites (`sites-available`) and another to\
    \ hold symbolic links to virtual hosts that will be published (`sites-enabled`).\n\
    \n```bash\nmkdir -p /etc/httpd/sites-available\nmkdir -p /etc/httpd/sites-enabled\n\
    ```\n\n## 6. Change Apache configuration file\n\nEdit the main configuration file\
    \ (`/etc/httpd/conf/httpd.conf`) to include new configuration directory (`sites-enabled`)\
    \ so that Apache will look for virtual hosts in this directory.\n\n```bash\nvi\
    \ /etc/httpd/conf/httpd.conf\n```\n\nAdd this line at the very end of the file:\n\
    \n```apache\nIncludeOptional sites-enabled/*.conf\n```\n\nSave the file and exit\
    \ from `vi`.\n\n## 7. Create virtual host configuration files\n\nCreate configuration\
    \ files for each virtual host.\n\n```bash\nvi /etc/httpd/sites-available/abc_example.com.conf\n\
    ```\n\n```apache\n<VirtualHost *:80>\n    ServerName www.abc_example.com\n   \
    \ ServerAlias abc_example.com\n    DocumentRoot /var/www/html/abc_example.com\n\
    </VirtualHost>\n```\n\n```bash\nvi /etc/httpd/sites-available/xyz_example.com.conf\n\
    ```\n\n```apache\n<VirtualHost *:80>\n    ServerName www.xyz_example.com\n   \
    \ ServerAlias xyz_example.com\n    DocumentRoot /var/www/html/xyz_example.com\n\
    </VirtualHost>\n```\n\nCreate soft links of virtual host configuration files in\
    \ `sites-enabled` directory (Note this command is in single line, due to page\
    \ width limitation it wrapped to next line. When you issue this command, issue\
    \ it in single line).\n\n```bash\nln -s /etc/httpd/sites-available/abc_example.com.conf\
    \ /etc/httpd/sites-enabled/abc_example.com.conf\nln -s /etc/httpd/sites-available/xyz_example.com.conf\
    \ /etc/httpd/sites-enabled/xyz_example.com.conf\n```\n\n## 8. Verify the configuration\
    \ files and restart the httpd service\n\n### Verify the configuration files\n\n\
