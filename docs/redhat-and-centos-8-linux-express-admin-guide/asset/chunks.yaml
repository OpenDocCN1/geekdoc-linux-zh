  trans: "\n\n# 用户管理\n\n用户管理描述了管理员管理用户对服务器资源及附加设备访问的能力。在多用户环境中，出于安全和隐私考虑，建议为每个用户创建独立的用户名，以便每个用户都能将其数据保存在各自的家目录中。用户和组的管理是系统管理的核心部分。\n\
    \n## 用户与组\n\n用户是指任何使用计算机或网络服务的人。用户可以是人类，也可以是账户。为了方便管理，用户被分组在不同的组中。`Group` 是一个根据不同属性将用户组织在一起的逻辑实体，可以基于相同的部门、相同的地点或相同的工作。有时，创建组仅仅是为了给不同的用户提供某些公共设施或权限。\n\
    \n## Root 用户对比普通用户\n\n在安装时，安装屏幕提供了创建 `root` 用户密码和一个额外用户密码的选项。你也可以在同一屏幕上为该额外用户分配\
    \ root 权限。在 RHEL Linux 中，`root` 是系统的默认管理员。`root` 是 RHEL 服务器上所有所有用户中权限最大的用户。一旦你以\
    \ `root` 用户身份登录，就可以在服务器上执行任何操作。与普通用户不同，`root` 用户可以读、写和修改所有其他用户的文件的和目录。`root` 用户甚至可以修改和删除系统文件。因此，妥善保管\
    \ `root` 用户的密码绝对重要。\n\n## 在图形终端上以 root 用户身份登录\n\n如果安装了图形桌面环境，系统启动后你将看到登录界面。\n\n\
    ![](img/Image00034.jpg) 点击用户图标以普通用户身份登录\n\n![](img/Image00035.jpg) 要以 `root` 用户身份登录，从图形登录界面选择\
    \ `Not listed?`（未列出？）。\n\n一旦出现登录名的框，输入 `root` 并按 `ENTER`，在密码提示处输入安装期间选择的 `root`\
    \ 密码，然后按 `ENTER`。\n\n## 使用 GUI 管理用户\n\n在 RHEL 中创建用户。\n\n1. 以 `root` 用户身份登录。\n\
    2. ![](img/Image00036.jpg) 从面板点击 `Activities`（活动），并在搜索栏中输入 `users`，点击 `users`。这将打开用户管理窗口。\n\
    \n![](img/Image00037.jpg)\n\n3. 点击 `Add User`（添加用户）按钮添加用户。这将弹出包含以下字段的对话框：\n  \
    \  - **Account Type**（账户类型）：你有两个选项 `Standard`（标准）或 `administrator`（管理员）\n    -\
    \ **Full Name**（全名）：输入用户的全名\n    - **Username**（用户名）：输入你想创建的用户名\n    - **Allow\
    \ User to set password when they next login/Set a password now**（允许用户下次登录时设置密码/现在设置密码）：设置密码有两种方法。第一种是强制用户在下次登录时设置密码。另一种是由管理员设置临时密码，以便新用户可以方便地更改密码。这种这种你增加了额外的安全层，使得在用户设置密码之前，未经授权的用户无法新创建的用户名。\n\
    \n![](img/Image00038.jpg)\n\n## 使用命令行管理用户\n\n使用命令行进行用户管理非常有趣，并且提供了更多的选项和活性。\n\n\
    ### 添加用户\n\n语法\n```bash\n# useradd –c “Full name of user” username\n```\n\n示例\n\
    ```bash\n# useradd –c “Adam mark” adam1\n```\n\n### 现在设置密码\n\n语法\n```bash\n# passwd\
    \ username\n```\n\n示例\n```bash\n# passwd adam1\n```\n\n### 修改用户\n\n语法\n```bash\n\
    # usermod option username\n```\n\n示例\n```bash\n# usermod –c “Adam markwel” adam1\
    \ \n```\n\n### 删除/移除用户\n\n语法\n```bash\n# userdel username\n```\n\n示例\n```bash\n\
    # userdel adam1\n```\n\n### 显示用户信息\n\n显示当前用户的信息\n语法\n```bash\n$ id\n```\n\n示例\n\
    ```bash\n$ id\n```\n\n显示其他用户的信息\n语法\n```bash\n# id username\n```\n\n示例\n```bash\n\
    # id admin\n```\n\n为其他用户更改密码\n语法\n```bash\n# passwd username\n```\n\n示例\n```bash\n\
    # passwd admin\n```\n\n更改自己的密码\n```bash\n$ passwd\n```\n\n### 列出密码过期信息\n\n语法\n\
    ```bash\n# chage –l username\n```\n\n示例\n```bash\n# chage –l admin\n```\n\n###\
    \ 设置密码过期\n\n`root` 用户可以为任何用户设置密码过期日期。在本示例中，密码将在上次更改密码后 10 天过期。\n\n语法\n```bash\n\
    # chage -M no of days from last password change username\n```\n\n示例\n![](img/Image00039.jpg)\
    \ # chage -l admin\n# chage -M 10 adam1\n# chage -l adam1\n![](img/Image00040.jpg)\n\
    \n### 禁用用户的密码过期\n\n语法\n```bash\n# chage –M 99999 username\n```\n\n示例\n```bash\n\
    # chage -M 99999 admin\n```\n![](img/Image00041.jpg)\n\n### 强制用户在下次登录时更改密码\n\n\
    语法\n```bash\n# chage –d0 username\n```\n\n示例\n```bash\n# chage –d0 adam1\n```\n\
    \n### 锁定用户\n\n语法\n```bash\n# usermod –L username\n```\n\n示例\n```bash\n# usermod\
    \ –L adam1\n```\n\n### 解锁用户\n\n语法\n```bash\n# usermod –U username\n```\n\n示例\n\
    ```bash\n# usermod –U adam1\n```\n\n## UID\n\n唯一用户 ID，通常称为 `UID`。系统上存在的每个用户都有一个\
    \ `UID`。\n\n| 用户 | UID |\n| :--- | :--- |\n| root | 0 |\n| 系统用户 | 999 |\n| 普通用户\
    \ | 1000+ |\n\n## 组\n\n通常称为 `UID` 的唯一用户 ID。系统上存在的每个用户都有一个 `UID`。`/etc/passwd`\
    \ 文件包含了每个用户的 `UID`。\n\n用户是指任何使用计算机或网络服务的人。用户可以是人类，也可以是账户。为了方便管理，用户被分组在不同的组中。`Group`\
    \ 是一个根据不同属性将用户组织在一起的逻辑实体，可以基于相同的部门、相同的地点或相同的工作。有时，创建组仅仅是为了给不同的用户提供某些公共设施或权限。\n\
    \n### 主组\n\n用户所属的主组。\n\n更改辅助组\n```bash\n# usermod –G2 user1\n```\n\n### 添加新组\n\
    \n语法\n```bash\n# groupadd groupname\n```\n\n示例\n```bash\n# groupadd data1\n```\n\
    \n### 删除组\n\n语法\n```bash\n# groupdel groupname\n```\n\n示例\n```bash\n# groupdel\
    \ data1\n```\n\n### /etc/group 文件\n\n`/etc/group` 文件存储组信息。每行对应一个组，每行包含由冒号（:）分隔的字段。\n\
    \n| 字段 | 描述 |\n| :--- | :--- |\n| groupname | 组名。 |\n| password | 通常不使用。 |\n|\
    \ GID | 组 ID。 |\n| Group List | 该组的用户列表。用逗号分隔用户名。 |\n\n示例\n`science:x:1003:class1,\
    \ class2`\n\n## /etc/passwd 文件\n\n`passwd` 文件在登录时需要。这是一个纯文本文件，包含了系统账户。和 `/etc/group`\
    \ 文件一样，每行对应一个用户，每行包含由冒号（:）分隔的字段，如用户 ID、组 ID、家目录和 shell。只有 `root` 用户对此有写权限。\n\n\
    格式\n![](img/Image00042.jpg) `username:x:UID:GID:Full_user_name:home_directory:shell`\n\
    \n| 字段 | 描述 |\n| :--- | :--- |\n| username | 用户名。应该是唯一的，最多 8 个字符。它区分大小写，通常通常全小写。\
    \ |\n| x | x 字符表示加密密码存储在 `/etc/shadow` 文件中。 |\n| UID | 用户 ID |\n| GID | 组 ID |\n\
    | Full_user_name | 用户的全名 |\n| home_directory | 指定的用户家目录，用户将在此处存放文件。 |\n| shell\
    \ | 用户的默认 shell，通常设置为 `/bin/bash`，也可以是 `/etc/ksh`、`/etc/csh` 或任何其他 shell |\n\n\
    示例\nadam1:x:1004:1004:Adam mark:/home/adam1:/bin/bash`\n\n## /etc/shadow\n\n以加密格式存储实际密码。\n\
    \n格式\n`username:password:last_password_change:minimum`\n\n| 字段 | 描述 |\n| :---\
    \ | :--- |\n| username | 最多 8 个字符。区分大小写，通常全小写。与 `/etc/passwd` 中的用户名直接匹配。 |\n|\
    \ password | 13 字符加密密码。空表示登录不需要密码（通常是个坏主意），“ * ” 表示账户已禁用。 |\n| last_password_change\
    \ | 上次更改密码的日期。以自 1970 年 1 月 1 日以来的天数表示。 |\n\n"
