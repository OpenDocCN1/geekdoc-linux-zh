    kill Stops the process


    ps Show the process information


    & if command ends with the & the shell execute the command in background and shell
    will not wait for finish 


    Example gcalctool &


    Bring command to foreground


    $ fg


    ctrl + c


    Check the running jobs


    $ jobs


    List the current running process


    $ ps –ef


    or


    $ ps aux


    Kill the process forcefully


    First check the process ID with ps –ef command then  


    $ sudo kill -9 <process –id >


    Monitoring the process with ps command


    ps command show the percentage of CPU & memory utilization of the process it is
    very useful if your machine is underperforming. ps command gives you indication
    which process is hogging memory/CPU.


    Process scheduling


    Scheduler is part of kernel, which select process to run next. The purpose is
    to run the processes according to priorities. To set the priority of running process
    nice and renice command is used which decide how longer or smaller CPU time is
    given to process.


    Nice set the priority or niceness of new process.


    renice adjust nice value of running process


    niceness of -20 is highest priority and 19 is lowest priority. The default priority
    is 0


    Example


    $ sudo nice –n 19 cp –r /as /map


    Commands show priorities of running processes


    ps –al


    or


    top


    To change the priority


    $ sudo renice –n 10 <pid>


    Note: You need root / superuser privilege to change to higher priority.


