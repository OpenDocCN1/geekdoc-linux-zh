    \ VG 使用多个磁盘，首先为所有磁盘创建 PV。然后使用 `vgcreate` 命令和所有 PV 名称来定义 VG。\n```bash\n# vgcreate\
    \ vg01 /dev/sdb3\n```\n卷组 `vg01` 创建成功。\n\n### 3. 创建逻辑卷 (LV)\n上所述 LV 是创建文件系统的基础。某些情况下\
    \ LV 也可以作为原始设备使用。使用 `lvcreate` 命令定义 LV。\n```bash\nlvcreate -n LV_name -L size\
    \ VG_name\n# lvcreate -n lv01 -L 1G vg01\n```\n逻辑卷 `lv01` 创建。\nLV 也可以镜像。镜像 LV\
    \ 在不同设备上维护相同的数据。当数据写入一个设备时，也会写入第二个设备以实现冗余。\n创建镜像 LV：\n```bash\n# lvcreate -n lv01\
    \ -m1 -L 1G vg01\n```\n\n### 4. 在 LV 上创建文件系统\n使用 `mkfs` 命令创建文件系统\n```bash\nmkfs\
    \ -t xfs /dev/VG_name/LV_name\n```\n其中 `-t` 用于指定文件系统类型，逻辑卷名称按其卷组顺序指定。\n```bash\n\
    # mkfs -t xfs /dev/vg01/lv01\n```\n\n### 5. 自动挂载新文件系统\n为了在系统启动时自动挂载文件系统，必须在 `/etc/fstab`\
    \ 文件中添加条目。有两种方法：使用设备名称，另一种使用设备通用唯一标识符。使用 UUID 的优点是它独立于操作系统赋予硬盘的实际设备号。如果添加新设备，设备名称可能会更改，但设备的\
    \ UUID 保持不变。\n\n#### 使用设备名称在 fstab 文件中添加条目\n```bash\n# vi /etc/fstab\n```\n```\n\
    /dev/sdb2 /newfs  xfs     defaults       1 2\n```\n\n#### 使用 UUID 在 fstab 文件中添加条目\n\
    1. 新创建文件系统的 UUID：\n```bash\n# blkid /dev/vg01/lv01\n```\n2. 将条目添加到 `/etc/fstab`\
    \ 以启动时自动挂载：\n```\nUUID=6acaa-5541139e830e  /newfs  xfs     defaults       1 2\n\
    ```\n\n### 6. 挂载文件系统\n```bash\nmount -a\n```\n\n## LVM 查表\n\n### PV 命令\n| 描述 |\
    \ 命令 |\n| :--- | :--- |\n| 显示 PV 属性 | `pvdisplay` |\n| 显示所有 LVM 块设备 | `pvscan`\
    \ |\n| 防止在 PV 上分配 PE | `pvchange -xn /dev/PV_name` |\n| 移除 PV | `pvremove /dev/PV_name`\
    \ |\n\n### 卷组命令\n| 描述 | 命令 |\n| :--- | :--- |\n| 显示 VG 属性 | `vgdisplay` |\n| 显示\
    \ VG 列表 | `vgs` |\n| 将 PV 添加到 VG | `vgextend vgname /dev/PV_name` (示例：# vgextend\
    \ vg01 /dev/sdb5`) |\n| 从 VG 移除 PV | `vgreduce vg1 /dev/PV_name` (示例：# vgreduce\
    \ vg01 /dev/sdb5`) |\n| 激活 VG | `vgchange -ay VG_name` |\n| 停用 VG | `vgchange\
    \ -ay VG_name` |\n| 移除 VG | `vgremove VG_name` (示例：`vgremove /dev/vg02`) |\n|\
    \ 重新创建 VG 目录 | `vgmknodes` |\n\n"
- fmt: "\nIf situation arises, in which you have to move whole volume group from one\
    \ system to other system. It can be due to some hardware problem on the current\
    \ system or for moving old storage to new hardware you can use following procedure.\
    \ In this example, there are two systems: one is old system on which `VG` is currently\
    \ located and new system that is where you want to move. \n\n### On old system\n\
    \n1. Unmount all File systems which are part of Volume Group\n```bash\numount\
    \ /newfs\n```\n\n2. Deactivate the VG `vgchange -an VG_name` command\n```bash\n\
    [root@RHEL1 /]# vgchange -an sharedvg\n```\n\n3. Export the VG with `vgexport\
    \ VG_name` command\n```bash\n[root@RHEL1 /]# vgexport sharedvg\n```\n\n### On\
    \ the New System\n\n4. After attaching HDD to new system, import the VG with `vgimport\
    \ VG_name` command\n```bash\n[root@RHEL2 ~]# vgimport sharedvg\n```\n\n5. Activate\
    \ the VG with `vgchange -ay VG_name`\n```bash\n[root@RHEL2 ~]# vgchange -ay sharedvg\n\
    ```\n\n6. Mount the file systems on the VG\n```bash\n[root@RHEL2 ~]# mount /dev/sharedvg/sharedlv\
    \ /mnt\n```\n\n7. Check the contents of file system\n```bash\n[root@RHEL2 ~]#\
    \ cd /mnt\n```\n\n### Extending File System\n\n1. Check the current FS size\n\
    ```bash\ndf -h /fsname\n/dev/mapper/vg01-lv01      1008M  34M  924M  4% /newfs\n\
    ```\n\n2. Check if you have enough free space i.e. free PE on the VG where LV\
    \ of FS you want extend is there.\n```bash\n# vgdisplay vg01\n  --- Volume group\
    \ ---\n  VG Name             vg01\n  System ID\n  Format               lvm2\n\
    \  Metadata Areas        1\n  Metadata Sequence No  5\n  VG Access           \
    \ read/write\n  VG Status            resizable\n  MAX LV               0\n  Cur\
    \ LV               1\n  Open LV              1\n  Max PV               0\n  Cur\
    \ PV               1\n  Act PV               1\n  VG Size              5.00 GiB\n\
    \  PE Size              4.00 MiB\n  Total PE             1280\n  Alloc PE / Size\
    \      256 / 1.00 GiB\n  Free PE / Size       1024 / 4.00 GiB\n```\n\n3. Extend\
    \ the Logical Volume `lvextend -L size /dev/vgname/lvname`\n```bash\n# lvextend\
    \ -L +200M /dev/vg01/lv01\n```\n\n4. Extend the file system using `xfs_growfs\
    \ /fsname`\n```bash\n# xfs_growfs /newfs\n```\n\n5. Check the FS size\n```bash\n\
    df -h /fsname\n/dev/mapper/vg01-lv01  1.2G  34M  1.1G \n```\n\n### Reduce the\
    \ File System\n\n1. Check the current FS size\n```bash\ndf -h /fs_name\n/dev/mapper/vg01-lv01\
    \  1.2G  34M  1.1G \n```\n\n2. Backup the File System\n```bash\n# xfsdump -f /tmp/newfs.dump\
    \ /newfs\n```\n\n3. Unmount the File system\n```bash\numount /fs_name\n# umount\
    \ /newfs\n```\n\n4. Remove the LV\n```bash\n# lvremove /dev/mapper/vg01-lv01\n\
    ```\n\n5. Recreate LV\n```bash\n# lvcreate -n lv01 -L1G vg01\n```\n\n6. Recreate\
    \ the File system\n```bash\n# mkfs.xfs /dev/vg01/lv01\n```\n\n7. First check the\
    \ UUID\n```bash\n# blkid /dev/vg01/lv01\n```\n\n8. Change the UUID of File system\
    \ in `/etc/fstab`\n\n9. Mount File System\n```bash\n# mount -a\n```\n\n10. Restore\
    \ the backup\n```bash\nxfsrestore -f /tmp/newfs.dump /newfs\n```\n\n11. Check\
    \ File System\n```bash\n# df -h /newfs\n```\n\n# NFS\n\n`NFS` (Network File System)\
    \ is file sharing file system, which works on server client basis. Server’s shared\
    \ file systems are mounted on clients.\n\nFour version of NFS are there:\n1. NFS\
    \ V1\n2. NFS V2\n3. NFS V3\n4. NFS V4\n\nWhere `NFS V3` and `NFS V4` are more\
    \ recent version of NFS, `V3` is safer and works on UDP protocol while `V4` has\
    \ added advantage of working through firewall and works on TCP.\n\nTo make shared\
    \ file system available on the client it has be exported from server. For exporting\
    \ there are two ways to configure exports on an NFS server:\n* Through `/etc/exports`\
    \ configuration file.\n* Explicitly Using the `exportfs` utility on the command\
    \ line, but this way you have to do every time after reboot.\n\n### Configure\
    \ NFS on the server\n\nInstall packages\n```bash\n# yum install nfs-utils\n# yum\
    \ install rpcbind\n```\n\nStart the services\n```bash\n# systemctl start rpcbind\n\
    # systemctl start nfs-server\n```\n\nMake service start on next reboot\n```bash\n\
    # systemctl enable rpcbind\n# systemctl enable nfs-server\n```\n\nTo export file\
    \ system without `/etc/exports` manually.\n```bash\n# exportfs -i /user1\n```\n\
    \nTo export file system using `/etc/exports`\nEdit `/etc/exports` file to add\
    \ file systems you want to share to clients format of that is:\n`mountpoint [host][permissions/options]`\n\
    \nwhere:\n* `mountpoint` is file systems you want export\n* `host` is optional,\
    \ the client you want to give access the filesystems\n* `permissions` is optional\
    \ it can be `ro` read only, `rw` read write, `sync` changes written before command\
    \ finished.\n\nExample:\n`/software/c1 192.168.10.12(rw,sync)`\n\nExport file\
    \ system\n```bash\n# exportfs -a\n```\n\nSee the file system exported\n```bash\n\
    # showmount -e\n```\n\nConfigure firewall to allow NFS server to clients\n```bash\n\
    firewall-cmd --permanent --zone public --add-service mountd\nfirewall-cmd --permanent\
    \ --zone public --add-service rpc-bind\nfirewall-cmd --permanent --zone public\
    \ --add-service nfs\n```\n\nConfigure NFS server to clients\n```bash\n# showmount\
    \ -e 192.168.10.12\n```\n\nTo export all exported\n```bash\n# exportfs -u\n```\n\
