  trans: "\n\n与实施许可费模式不同，Redhat 实施的是**订阅模式**。在订阅模式中，你无需支付任何预付款，只需按每台机器支付年度订阅费用。这种订阅模式根据订阅类型为客户提供不同类型的支持。该模式最大的优点是，如果发布了新版本且你的订阅处于激活状态，你无需支付任何升级费用，即可免费下载并使用该版本。你将获得与旧版本相同的支持。大致有三种类型的订阅：\n\
    \n-   自助支持（Self support）：仅提供下载和更新。\n-   标准支持（Standard support）：通过网页和电话提供支持。\n\
    -   高级支持（Premium support）：通过网页和电话提供支持，此外其响应时间比标准支持快得多。例如，对于 1 级问题，标准支持的响应时间为 1\
    \ 个工作小时，而高级支持为 1 小时。区别在于，工作时间可能取决于地区可能是早上 9 点到下午 5 点，之后将不再提供支持，因此如果你在 Redhat 中遇到任何问题，必须等候下一个工作日。此外，如果支持仅限于工作时间，则假日不提供支持。\n\
    \n## 使用 RedHat 订阅注册系统\n\n有两种方式可以向 Redhat 注册你的服务器：\n\n1. 在安装后的初始配置期间。\n2. 在安装后的任何时间使用\
    \ `subscription-manager` 命令。\n\n注册订阅的命令为：\n```bash\nsubscription-manager register\
    \ --username username --password password --auto-attach\n```\n![](img/Image00044.jpg)\n\
    \n检查订阅情况：\n```bash\nsubscription-manager list\n```\n或\n```bash\nsubscription manager\
    \ list --consumed\n```\n\n## 使用 Yum 进行包管理\n\n### 列出所有已安装和可选软件\n```bash\nyum list\n\
    ```\n\n### 列出所有可用软件\n```bash\nyum list available\n```\n\n### 列出所有已安装软件\n```bash\n\
    yum list installed\n```\n\n### 使用关键字搜索包名\n语法：\n```bash\nyum search keyword\n```\n\
    示例：\n```bash\nyum search bzip2\n```\n\n### 显示包信息\n语法：\n```bash\nyum info package_name\n\
    ```\n示例：\n```bash\nyum info zip\n```\n\n### 安装包\n语法：\n```bash\nyum install –y\
    \ package_name\n```\n示例：\n```bash\nyum install -y firefox\n```\n\n### 包\n语法：\n\
    ```bash\nyum remove package_name\n```\n示例：\n```bash\nyum remove firefox\n```\n\
    \n### 检查哪个包提供特定文件\n语法：\n```bash\nyum provides file-name\n```\n示例：\n```bash\nyum\
    \ provides /etc/hosts\n```\n\n### 获取帮助\n```bash\nyum help\n```\n\n### 检查可用更新\n\
    ```bash\nyum check-update\n```\n\n### 更新由已启用库提供的所有软件\n```bash\nyum update\n```\n\
    \n### 清理 yum 缓存\n```bash\nyum clean all\n```\n\n### 交互式 shell\n```bash\nyum shell\n\
    ```\n\n### 列出 yum 历史\n```bash\nyum history list\n```\n\n## 包组 (Package group)\n\
    \n包组是一组软件，这些软件具有相同的安装目的，例如开发工具、Web 服务器、桌面环境等。它通过自动安装和下载依赖软件，简化了管理员的工作。例如，如果你想安装备份客户端，只需运行命令\
    \ `yum group install “Backup Client”`。\n\n### 列出所有可用包组\n```bash\nyum group list\n\
    ```\n\n### 安装组包\n语法：\n```bash\nyum group install package_name\n```\n示例：\n```bash\n\
    yum group install “Backup Client”\n```\n\n### 移除包组\n语法：\n```bash\nyum group remove\
    \ package_name\n```\n示例：\n```bash\nyum group remove “Backup Client”\n```\n\n###\
    \ 组包信息\n语法：\n```bash\nyum group info package_name\n```\n示例：\n```bash\nyum group\
    \ info “Development Tools”\n```\n\n## 模块 (Modules)\n\n### 流 (Streams) 和配置 (Profiles)\n\
    \n#### 模块流 (Module Streams)\n模块可以在一个或多个流可用，通常代表软件的版本，让你可以选择安装哪些版本的软件包。模块流类似于虚拟仓库。每个模块可能有一个默认流，该流通常提供组件的最新或推荐版本。默认流使得用户无需了解模块知识即可轻松安装软件包。模块使得你的系统可以有多个版本的软件供安装。\n\
    \n#### 模块配置 (Module Profiles)\n为了进一步简化安装，模块通常根据特定的工作负载或用户用例分类为一组特定的软件包。这组包列表被称为配置（profile）。配置名称可以是任何内容，如服务器（server）、客户端（client）、开发（development）、极简安装（minimal\
    \ install）等。\n\n## 使用模块进行包管理\n\n### 列出所有可用模块\n```bash\nyum module list\n```\n\
    ![](img/Image00045.jpg)\n\n它将显示四列输出：\n- 模块名称\n- 流 (Stream)\n- 配置 (Profile)\n-\
    \ 摘要 (Summary)\n\n输出在流和配置列中带有 `[d]`、`[e]`、`[x]` 和 `[i]`，显示模块流和配置的状态。其中 `[d]` 表示默认（default），`[e]`\
