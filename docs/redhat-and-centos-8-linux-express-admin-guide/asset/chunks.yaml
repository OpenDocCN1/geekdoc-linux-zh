  raw: 'Unlike license fee models Redhat implements subscription model. In the subscription
    you don’t pay any upfront fee, you just pay fees for yearly subscription per machine.
    This subscription model offers different type of support to the customer depending
    upon the type of subscription. Best part of this model is that you do not have
    to pay for any upgradation fee if new version comes and your subscription is active
    you can freely download and use that version. You will get same support what you
    were getting with older version. Broadly three types of subscriptions are there


    *   Self support


    *   Standard


    *   Premium


    Self support


    Offers only download and updates


    Standard support


    Offers support via web and phone


    Premium support


    Offers support via web and phone but additionally the response time is much quicker
    than standard support. For example, for severity 1 problem response time is 1
    business hour in case of standard support and for premium it is one hour. The
    difference is that business hours can be 9 to 5 depending on the region and there
    will be no support after that, so if you have any problem in the Redhat you have
    to wait for next business day. Moreover, there is no support on holidays if support
    is only for business hours.


    Registering system with RedHat subscription


    There are two ways to register your server with Redhat


    1.  At the time of initial configuration after installation


    2.  Using subscription-manager command any time after installation.


    The command to register for subscription


    # subscription-manager register --username username --password password --auto-attach


        ![](Image00044.jpg)


    To check the subscription


    #subscription-manager list


    Or


    #subscription manager list --consumed


    Package management using Yum


    List all installed and available software


    # yum list


    List all available software


    # yum list available


    List all installed software


    # yum list installed


    Search the package name with keyword


    Syntax


    # yum search keyword


    Example


    # yum search bzip2


    Display information about the package


    Syntax


    # yum info package_name


    Example


    # yum info zip


    Install package


    Syntax


    # yum install –y package_name


    Example


    # yum install –y firefox 


    Remove package


    Syntax


    # yum remove package_name


    Example


    # yum remove firefox 


    Check which package provides specific file


    Syntax


    # yum provides file-name


    Example


    # yum provides /etc/hosts 


    Get help


    # yum help


    Check for Available Updates


    # yum check-update


    Update all software provided by enabled repositor ies


    # yum update


    Clean the yum cache


    # yum clean all


    Interactive shell


    # yum shell


    List yum history


    # yum history list


    Package group


    Package group is group of software, which have same motive to install such as
    development tools, web server, desktop etc. It makes administrator’s life easy
    by installing and downloading dependent software automatically. For example, you
    want to install backup client you will give command yum group install “Backup
    Client”


    List all package group available


    # yum group list


    Install group package


    Syntax


    yum group install package_name


    Example


    # yum group install “Backup Client”


    Remove package group


    Syntax


    yum group remove package_name


    Example


    # yum group remove “Backup Client”


    Information about group package


    Syntax


    # yum group info package_name


    Example


    # yum group info “Development Tools”


    Modules


    Streams and profiles


    Module Streams


    Modules are available in one or multiple streams which usually represent a version
    of a software, giving you an option to choose what versions of packages you want
    to install. Module stream is like virtual repository. Each module may have a default
    stream which usually provides the latest or recommended version of the component.
    Default streams make it easy to install packages without the need to learn about
    modules. Modules make it possible to have multiple versions of software available
    to your system for installation.


    Module Profiles


    To simplify installation further, modules usually classified with set of specific
    set of packages for specific workload or user case. This list of packages is known
    as profile. A profile name can be anything like server, client, development, minimal
    install etc.


    Package management using modules


    List all available modules


    # yum module list


    ![](Image00045.jpg)


    It will show output in four columns


    *   Name of the module


    *   Stream


    *   Profile


    *   Summary


    The output shows Steams and profiles with [d], [e], [x] and [i] in the stream
    and profile column which show the status of module’s stream and profile. Where
    [d] if for default, [e] for enabled [x] for disabled [i] installed. 


    Display information about specific module


    Syntax


    yum module info module_name


    Example


    # yum module info


    Display profile information of particular module


    Syntax


    yum module info --profile module_name


    Example


    # yum module info –profile gimp


    Find out which modules provide a package


    Syntax


    # yum module provides package


    Example


    # yum module provides gimp


    Display current status of module


    Syntax


    Yum module list module_name


    Example


    # yum module list gimp


    Enabling Module


    Enable the module when you wish to make the packages available for  installation.


    Enable a module using its default stream


    Syntax


    yum module enable module-name


    Example


    yum module enable gimp


    Enable a module without default stream


    Modules which do not have default streams, you must explicitly specify the stream.


    Syntax


    yum module enable module-name:stream


    Example


    # yum module enable 389-ds:1.4


    Installing module


    Syntax


    yum install module module_name


    Example


    # yum install module gimp


    Or


    # yum install @gimp


    This command will install default stream and default profile of the module. This
    command is very useful, in case you do not care about version and workload. But
    default stream should be enabled


    Installing non default Stream


    List the available Streams


    # yum module list perl


    ![](Image00046.jpg)


    Install specific stream


    # yum install @perl:5.24


    This command will install perl 5.24 version instead of default version which 5.26


    Installing non default profile of an application


    # yum module list gimp


    # yum install @gimp/devel


    This command will install gimp software suited for development environment.


    Installing non-default profile and non-default stream


    # yum module install Module_name:stream/profile


    Removing modules


    In general, to remove a module installed on your system, use the following command:


    Syntax


    # yum module remove module_name:stream/profile


    Example


    # yum module remove gimp/devel


    Resetting module streams


    The reset command of modules returns all of its streams to their initial state
    which is neither enabled nor disabled. If the module has a default stream, that
    stream becomes active.


    Syntax


    # yum module reset module-name


    Example


    ![](Image00047.jpg) # yum module reset php


    Disable a module and all its streams


    Syntax


    # yum module disable module-name


    Example


    # yum module disable php


    ![](Image00048.jpg)


    Package management using RPM


    RPM stands for R ed Hat P ackage M anager. RPM packages have .rpm extension. rpm
    command is used to manage software which include listing, installing, updating
    and removing rpm packages. RPM is usually used to install packages that have been
    downloaded locally.


    Install


    Syntax


    rpm -ihv  package_name


    Example


    # rpm -ihv zip-3.0-11.el7.x86_64.rpm


    Update


    Syntax


    rpm –Uhv package_name


    Example


    # rpm –Uhv zip-3.0-11.el7.x86_64.rpm


    Remove


    Syntax


    rpm –ev package_name


    Example


    # rpm -ev zip


    Query all installed packages


    Syntax


    rpm -qa 


    Display detailed information about package


    Syntax


    rpm –qi package_name


    Example


    # rpm -qi zip


    Find the file belongs to which package


    Syntax


    rpm –qf  path_to_the_file


    Example


    # rpm -qf /etc/hosts


    setup-2.8.71-4.el7.noarch


    Find out all dependences


    Syntax


    rpm -qpR package_name    


    Example


    # rpm -qpR zip-3.0-11.el7.x86_64.rpm


    libbz2.so.1()(64bit)


    libc.so.6()(64bit)'
