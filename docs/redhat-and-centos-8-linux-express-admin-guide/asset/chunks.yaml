  trans: "\n系统产生了大量的日志，如果不进行过滤，几乎无法使用这些日志。为了过滤日志，我们使用 `/etc/rsyslog.conf` 文件。它包含两个参数\
    \ `facility`（设施）和 `priority`（优先级），用点（`.`）隔开。`Facility` 是你想要记录的进程名称，`priority`\
    \ 指定日志级别，如 `debug`、`info`、`notice`、`warning`、`err`、`crit`、`alert`、`emerg` 或代表所有类型消息的\
    \ `*`。\n\n### Example\n\n#### authpriv 文件具有限制访问权限。\n\n```\nauthpriv.* /var/log/secure\n\
    ```\n\n#### 在一处记录所有邮件消息。\n\n```\nmail.* -/var/log/maillog\n```\n\n在示例中，`authpriv`\
    \ 和 `mail` 是设施，优先级为 `*`，意味着所有日志。\n\n### 使用 logrotate 轮转日志\n\n日志需要轮转以避免填充文件系统，并使日志更易管理。一旦日志文件被轮转，它将被重命名为新文件名。经过一定的轮转时间后，旧的日志文件将被删除以节省空间。\n\
    \n`logrotate` 包根据 `/etc/logrotate.conf` 中的配置或命令行选项指定，管理日志文件的自动轮转。\n\n#### Install\n\
    \n```bash\nsudo apt install logrotate\n```\n\n#### 验证 logrotate 是否安装成功\n\n```bash\n\
    logrotate\n```\n\n`/etc/logrotate.conf` 文件中一些重要的配置设置有 `rotation-interval`、`log-file-size`、文件的\
    \ `permssions`、`missingok`、`rotation-count` 和 `compression`。对于每个日志，建议你在 `/etc/logrotate.d`\
    \ 目录下创建文件。\n\n### Example\n\n```\n[root@redhat1 logrotate.d]# cat bootlog\n\n\
    /var/log/boot.log\n\n{\n    missingok\n    daily\n    copytruncate\n    rotate\
    \ 7\n    notifempty\n}\n```\n\n在这个示例中，日志轮转工具 `rotate` 对 `boot` 进行了轮转，详情如下： \n\
    - `missingok`: 如果日志缺失则忽略\n- `daily`: 日志每天进行一次轮转\n- `copytruncate`: 在创建副本后在原地截断原始日志文件\n\
    - `rotate 7`: 保留 7 天的日志\n- `notifempty`: 如果日志为空则不进行轮转\n\n### 重要日志\n\n日志的主目录是 `/var/log`。该目录下一些值得关注的日志文件：\n\
    * `wtmp`\n* `utmp`\n* `dmesg`\n* `messages`\n* `maillog`\n* `spooler`\n* `auth.log`\
    \ 或 `secure`\n* `yum.log`\n* `boot.log`\n\n#### `/var/log/wtmp` 和 `/var/run/utmp`\n\
    \n`wtmp` 和 `utmp` 文件跟踪用户登录和退出系统的情况。这两个文件都是二进制文件。你不能直接使用文本编辑器、`cat` 或 `more` 命令读取这些文件的内容。你必须使用特定的命令。\n\
    \n`who` 命令使用 `/var/run/utmp` 文件提供当前登录系统的用户信息。\n\n```bash\n[root@RHEL2 log]# who\n\
    (unknown) :0      2018-10-02 05:34 (:0)\nroot     pts/0      2018-10-02 05:38\
    \ (192.168.131.1)\n```\n\n#### `/var/log/wtmp` 文件\n\n该文件维护所有登录和退出用户的历史记录。最后一个命令使用此文件显示最后登录用户的列表。\n\
    \n```bash\n[root@RHEL2 log] # last\nroot     pts/0      192.168.131.1    Tue Oct\
    \  2 05:38  still logged in\n(unknown :0             :0               Tue Oct\
    \  2 05:34  still logged in\nreboot    system boot  3.10.0-514.el7.x Tue Oct \
    \ 2 05:33 - 05:47  (00:13)\nroot     pts/1      192.168.131.1    Mon Oct  1 13:23\
    \  crash\n```\n\n#### `dmesg`\n\n`dmesg` 通过读取内核缓冲区获取数据。缓冲区是计算机内存的一部分，被留作临时从外部设备发送或接收数据的存放地。这些消息对于诊断设备故障非常重要。每当发生硬件变化时，大多数消息都会记录在这里。如果你遇到任何问题，请使用\
    \ `dmesg` 进行系统诊断。`dmesg` 工具存在于 `/var/log/`。\n\n```bash\n[root@RHEL2 log]# dmesg\
    \ |more\n```\n\n#### `Messages`\n\n通用日志在此文件中。要查看此文件，可以使用文本编辑器或任何常用的文本查看工具如 `cat`、`less`\
    \ 或 `more`。\n\n```bash\n[root@RHEL2 log] # cat messages\nOct  2 06:07:02 localhost\
    \ rsyslogd: [origin=\"rsyslog\"] swVersion=\"7.4.7\" x-pid=\"1056\" x-info=\"\
    http://www.rsyslog.com\"] rsyslogd was HUPed\n```\n\n#### `Maillog`\n\n该文件记录运行服务器上的邮件服务器的消息。\n\
    \n```bash\n[root@RHEL2 log]# cat maillog\n```\n\n#### `Spooler`\n\n记录打印程序消息。Spooler\
    \ 被打印队列用于打印。\n\n#### `secure`\n\n此文件捕获身份验证日志。要检查此文件，可以使用 `more` 或 `less` 命令。\n\
    \n#### `dnf.log`\n\n在 RHEL 8 中，`yum` 是 `dnf` 命令的前端。`yum` 命令将消息记录在 `dnf.log` 文件。还有其他\
    \ dnf 日志文件如 `dnf.librepo.log` 和 `dnf.rpm.log`。\n\n"
- fmt: "\nSelinux implements MAC, Mandatory Access Control. Selinux is a set of security\
    \ rules, which determine which process can access which file, directory or port\
    \ etc. Selinux policy to access process, directory, and files is known as context.\
    \ One goal of Selinux is to protect data and system. Selinux has three forms of\
    \ access control:\n\n1. `Enforcing`\n2. `Permissive`\n3. `Disabled`\n\n### Enforcing\n\
    Selinux denies access based on SELinux policy rules.\n\n### Permissive\nSelinux\
    \ does not deny access but denials are logged for the action that would have been\
    \ denied if running in enforcing mode.\n\n### Disabled\nSelinux is completely\
    \ disabled\n\n### Check the installation\n```bash\nrpm -qa | grep selinux\n```\n\
    \n### Install selinux\n```bash\nyum install policycoreutils policycoreutils-python\n\
    ```\n\n### Check current mode\n```bash\ngetenforce\n```\n\n### Check the status\n\
    ```bash\nsestatus\n```\n\n### Main configuration file\n`/etc/selinux/config`\n\
    \n### To Change the mode\nEdit `/etc/Selinux/config` configuration file and change\
    \ `selinux=enforcing` to desired mode like `selinux = permissive`. After saving\
    \ the file and reboot the server.\n\nIf you set the mode to permissive, you can\
    \ check the log to see what Selinux is doing.\n```bash\ncat /var/log/messages\
    \ |grep -i selinux\n```\nOr\n```bash\ntail -f /var/log/audit/audit.log\n```\n\n\
    ### Commands to display context\n\n| Description | Command |\n| :--- | :--- |\n\
    | List process context | `ps auxZ` |\n| Display user context | `Id –Z` |\n| Display\
    \ files with context | `ls -lZ` |\n| copy with context | `cp -Z` |\n| mkdir with\
    \ context | `mkdir -Z` |\n\n### Tool to change context\n```bash\nsemanage\n```\n\
    \n### Show context\n```bash\nsemanage fcontext -1\n```\n\n### Types\nThe main\
    \ permission control method used in SELinux targeted policy to provide advanced\
    \ process isolation is Type Enforcing. All files and processes are labeled as\
    \ a type. Types define a SELinux domain for processes and a SELinux type for files.\n\
    \nExample of Types are:\n* `httpd_sys_content_t`\n* `tmp_t`\n\n### Add context\n\
    ```bash\nsemanage fcontext -a -t httpd_sys_content_t /abc/zzz.txt\nls -Z\n```\n\
    Output: `-rw-r--r--. root root unconfined_u:object_r:samba_share_t:s0 zzz.txt`\n\
    \n### Set the context to default\n```bash\nrestorecon -v -t /abc/zzz.txt\n```\n\
    \n### Booleans\nBooleans allow a part of SELinux policy to change at runtime without\
    \ any knowledge of SELinux policy writing.\n\n### List Booleans\n```bash\nsemanage\
    \ boolean -l\n```\n\n### Configure Booleans\nIn this example, we will allow ftp\
    \ read and write access in user’s home directory\n\n1. list all:\n```bash\nsemanage\
    \ boolean -l\n```\n2. list Booleans whether they are on/off:\n```bash\ngetsebool\
    \ -a\n```\n3. Allow ftp read and write files in the user’s home directory:\n```bash\n\
    setsebool -P ftp_home_dir on\n```\n4. Check:\n```bash\ngetsebool ftp_home_dir\n\
    ```\nOutput: `ftp_home_dir --> on`\n\n# Chapter 30. System Monitoring Tools\n\n\
    Continuous monitoring is a vital part of the system administration. System monitoring\
    \ helps in properly provisioning resources for projects. It also helps in tuning\
    \ the server. Monitoring helps in avoiding unnecessary downtime due to resource\
    \ bottleneck as proper monitoring can predict hardware failure example you can\
    \ use tools to predict disk failure.\n\n### Viewing system processes\n`ps` displays\
    \ report of running process. It is a snapshot of current processes at time. To\
    \ see every process on the system and their owner:\n```bash\nps aux\n```\nTo list\
    \ all related threads each process:\n```bash\nps ax\n```\n\n### Top\n`top` command\
    \ displays processor activity of Linux machine. The `top` command displays list\
    \ of running processes on the system it also displays additional information about\
    \ current usage of CPU, memory and swap.\n```bash\ntop -21:59:05 up 5:58, 3 users,\
    \ load average: 0.16, 0.03, 0.01\nTasks : 188 total, 187 sleeping, 0 stopped,\
    \ 0 zombie\n%Cpu(s) : 0.0 us, 0.7 sy, 0.0 ni, 97.7 id, 1.0 wa, 0.3 hi, 0.3 si\n\
    KiB Mem : 2045748 total, 168512 free, 1038120 used, 839116 buff/cache\nKiB Swap\
    \ : 2097148 total, 1906704 free, 190444 used, 89136 avail\nPID USER PR NI VIRT\
    \ RES SHR S %CPU %MEM TIME\n1771 root 20 0 406112 10888 7084 S 0.3 0.5 0:30.40\
    \ vmtoolsd\n5854 root 20 0 156652 3960 3456 R 0.3 0.2 0:00.03 top\n1 root 20 0\
    \ 215220 8316 5820 S 0.0 0.4 0:09.58 systemd\n2 root 20 0 0 0 0 S 0.0 0.0 0:00.03\
    \ kthreadd\n3 root 20 0 0 0 0 S 0.0 0.0 0:02.07\n```\n\n### System Monitor Tool\n\
    System monitor tool is a GUI tool for system monitoring. The `Processes` tab allows\
    \ you to view, search for, change the priority of, and kill processes. Press `Activities`\
    \ > Write `System monitor` in search bar.\n\n* Click `Processes` tab to view the\
    \ list of running processes.\n* To kill the process right-click on the process\
    \ and select the operation like kill the selected process.\n* Click `resources`\
    \ tab to check CPU, memory and Swap space utilization. It also shows network activities.\n\
    * `File system` tab provide information about filesystem type, total size, available,\
    \ used and percentage used.\n\n### Free\n`free` command provides information about\
    \ system memory and swap space.\n```bash\n~]# free\n             total      used\
    \      free shared buff/cache available\nMem:       2045748  1066888  135120 \
    \   7596  843740      863048\nSwap:      2097148  1906704   190444\n```\n\n###\
    \ View memory in Megabytes\n```bash\nfree -m\n```\n\n### lsblk\n`lsblk` displays\
    \ information about available block devices includes block device’s major and\
    \ minor number, size and mount point.\n```bash\n~]# lsblk -a\nNAME MAJ:MIN RM\
    \ SIZE TYPE MOUNT\nsda 8:0 0 20G disk\n├-sda1 8:1 0 1G part /boot\n└-sda2 8:2\
    \ 0 17.9G part\n├-cl-root 253:0 0 15.9G lvm /\n└-cl-swap 253:1 0 2G lvm [SWAP]\n\
    ```\n\n### Get UUID of a block device\n```bash\n~]# blkid /dev/sda1\n/dev/sda1:\
    \ UUID=\"bbd591a1\" TYPE=\"ext4\" PART=\"f27d4-01\"\n```\n\n### partx\n`partx`\
    \ display list of disk partitions. To display list of partition for a device:\n\
    ```bash\n~]# partx -s /dev/sda\nNR START END SECTORS SIZE NAME\n1 2048 209919\
    \ 207872 1G f2acfd4-01\n2 209920 4194339 3984340 19G f2acfd4-02\n```\n\n### findmnt\n\
    `findmnt` allows you to list all mounted file systems.\n```bash\n~]# findmnt\n\
    TARGET SOURCE FSTYPE OPTIONS\n/ /dev/mapper/cl-root xfs rw,relatime,seclabel\n\
    ├-sys sysfs sysfs rw,nosuid,nodev,noexec\n```\n\n### du\n`du` command allows you\
    \ to display disk usage by files in a directory.\n```bash\n~]# du\n4 ./Templates\n\
    4 ./Music\n4 ~/.pki/nssdb\n8 ~/.pki\n24 ~/.gnup\n```\nTo display in human readable\
    \ format i.e. the size in KB and MB:\n```bash\n~]# du -h\n4.0K ./Templates\n4.0K\
    \ ./Music\n4.0K ~/.pki/nssdb\n8.0K ~/.pki\n24K ~/.gnup\n```\nDisplay summary:\n\
    ```bash\n~]# du -sh\n9.1M .\n```\n\n### df\n`df` command displays report of file\
    \ system disk space usage. To display the disk space usage by each file system:\n\
    ```bash\n~]# df -h\nFilesystem Size Used Avail Use% Mounted on\ndevtmpfs 476M\
    \ 0 476M 0% /dev\ntmpfs 487M 336K 487M 1% /dev/shm\ntmpfs 487M 2.4M 485M 1% /run\n\
    ```\n\n# Chapter 31. Cockpit\n\nIn redhat 8 one of the prominent addition is a\
    \ web console known as cockpit. In Redhat version 8 it is available in main repositories\
    \ and firewall is already opened for Cockpit. Cockpit is a web based interface\
    \ designed for managing and monitoring Redhat system locally or anywhere on the\
    \ network. Cockpit also allows to manage multiple servers Although cockpit was\
    \ available since long time but it was made available in main repositories in\
    \ RHEL 8. It makes possible to perform system tasks with a mouse. Following tasks\
    \ can be achieved with cockpit:-\n\n* System performance overview and live performance\
    \ graphs\n* Logs\n* Managing storage\n"
