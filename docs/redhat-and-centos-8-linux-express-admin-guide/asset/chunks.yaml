    Lock user


    Syntax


    # usermod –L username


    Example


    # usermod –L adam1


    Unlock user


    Syntax


    # usermod –U username


    Example


    # usermod –U adam1


    UID


    Unique User ID better known as UID. For every user that exist on system has UID.
    UID is numerical representation of every user.   For root user it is 0\. For regular
    users it starts from 1000. 


    | User | UID |


    | root | 0 |


    | System user | 1 – 999 |


    | Regular users | 1000 + |


    Groups


    Every user we create belongs at least one group and all groups have their group
    ID. /etc/group file contains list of all available groups and their member users.


    There are two type of groups:-


    *   Primary group


    *   Secondary group


    Primary group


    When you create a new user a new group of same name also gets created and the
    new user become member of that group. This is the group applied to your login
    and used by default when you create new files and directories. Primary group ID
    is written in /etc/passwd file for respective users in the third field.


    Secondary Group


    These are the groups users are member other than primary group.


    Changing secondary group


    # usermod –G data2 user1


    Where user1 is user and data2 is group and G option for assigning secondary group


    Add new group


    Syntax


    # groupadd groupname


    Example


    # groupadd data1


    Delete group


    Syntax


    # groupdel groupname


    Example


    # groupdel data1


    /etc/group file


    /etc/group files stores the group information. There is one entry per line for
    each group and each line has the fields separated by a colon (:) .


    groupname:password:GID:grouplist


    | Field | Description |


    | Groupname | Name of group. |


    | password | This is useful to implement privileged groups. Generally, password
    is not used. It can store encrypted password. |


    | GID | Group ID |


    | Group List | List of all users who are members of the group. Commas must separate
    the user names. |


    Example


    science:x:1003:class1, class2


    /etc/passwd


    passwd file in the /etc directory stores information of all users. The information
    in /etc/passwd file is required during login. It is a plain text file, which contains
    list of the system’s accounts. Like /etc/group file there is one entry per line
    for each user, and each line has the fields separated by a colon (:) containing
    information like user ID, group ID, home directory, shell, etc. Only root user
    has write permission for this file.


    Format


    ![](Image00042.jpg) username:x:UID:GID: Full_user_name :home_directory:shell


    | Field | Description |


    | Username | Username of the user. It should be unique and can be up to 8 characters.
    It is also case-sensitive |


    | x | An x character indicates that encrypted password is stored in /etc/shadow
    file. |


    | UID | User ID |


    | GID | Group ID |


    | Full_user_name | Full name of the user |


    | Home directory | Home directory of the user is specified here where user will
    keep his files. |


    | shell | Default shell for user, normally set to “/bin/bash’’ but it can be /etc/ksh
    , /etc/csh or any other shell |


    Example


    adam1:x:1004:1004:Adam mark:/home/adam1:/bin/bash


    /etc/shadow


    Stores actual password in encrypted format


    Format


    username:password:last_password_change:minimum


    | Field | Description |


    | Username | Up to 8 characters. Case-sensitive, usually all lowercase. A direct
    match to the username in the /etc/passwd file. |


    | Password | 13 character encrypted password. A blank entry indicates a password
    is not required to log in (usually a bad idea), and a “ * ” indicates account
    has been disabled. |


    | Last_password_change | Date of last password change. Expressed in numbers of
    days since January 1, 1970 |'
