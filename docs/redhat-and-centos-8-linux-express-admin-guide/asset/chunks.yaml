    2.  Defining Volume Group (VG)


    Once PV has been defined you can create VG over it. If more than one disk is used
    in creating VG then first create PVsfor all disks. Then use vgcreate command and
    all PV’s name to define VG 


    vgcreate VG_name PV_name or pv_names


    # vgcreate vg01 /dev/sdb3


      Volume group "vg01" successfully created


    3.  Create new Logical Volume(LV)


    As mentioned LV is base for creating file system. LV can also be used as raw in
    some cases. To define LV use lvcreate command


