    # Chapter 8


    ## Software management


    Every Linux distribution has set of packages that gets installed with installation.
    As an organization, you may require some more software according to your requirement,
    like you may be using this server as web server so you require `Apache` or other
    http server. For additional software installation, you require packages. Package
    is a bundle of all executables and data files in to single file. There are two
    types of packages are available


    ### 1. Source code packages


    Bundle of files related to one program, which includes source code, configuration
    files and documentation.


    ### 2. Binary Packages


    Binary package is bundle of precompiled binary files and its metadata files.


    ## Package distribution formats


    As mentioned packages are of two types, hence distributed in either binary or
    source code format. The main package distribution systems are :-


    ### Redhat Package Manager


    As name suggests this format was introduced by Redhat. This format is not only
    used by Redhat based distribution like `RHEL` and `Fedora` but also adopted by
    many other distributions like `SUSE` and `Mandriva`. `RPM` packages uses files
    with `.rpm` extension.


    ### Debian package manager


    This package distribution system was introduced by Debian. Mainly used by Debian
    and Debian based distributions like `Ubuntu`, `Linux Mint` and `PureOS`. It uses
    files with `.deb` extension.


    ## Source Code Packages


    Source code packages can be distributed in to two formats:


    ### 1.1 Tarball files


    Tarball package distribution is conventional type of package distribution. These
    type of packages are available from any third-party software providers and require
    `make` utility to compile.


    ### 1.2 SRPM


    Redhat based distributions provide repositories from where you can download source
    code of available binaries we call these files as `SRPMS` or source RPMs. `SRPMs`
    are `rpm` packages containing only the source code, `rpm` spec files which can
    be installed with `rpm` and then can be compiled or modified manually.


    ## Package metadata


    `RHEL` uses `.rpm` packages for installing software with `rpm` command. `RPM`
    package is simply a file that contains some files and information about those
    files. Technically speaking `RPM` is a file containing `cpio` archive and metadata
    about itself. `RPM` Header contains the metadata and this metadata is used to
    determine following things about the package:-


    * Description of package.

    * List of files in the package.

    * Version and release of package.

    * When and who made it.

    * Architecture supported.

    * Checksums of the files contained in the package.

    * Dependences.

    * Etc.


