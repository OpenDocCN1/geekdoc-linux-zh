    # xfsrestore


    `xfsrestore` command is used to restore the backup taken with `dump` command.


    ## Syntax

    ```bash

    xfsrestore <options> backupdevice target

    ```


    ## Example

    To restore backup stored on `/dev/st0` device

    ```bash

    xfsrestore -f /dev/st0 /home1

    ```


    ### Where option

    - `-f` is for device name


    # Chapter 15. Archiving and Compression


    Archiving is the process of collecting and storing a group of files and directories
    into one file, `Tar`, `cpio`, `zip` and `ar` are example of utilities which performs
    this action. Whereas compression is processes of reducing the size of files using
    mathematical compression algorithm. It is quite useful in sending large files
    over the internet. Example of compression utilities are `gzip`, `bzip2`, `xz`
    etc.


    ## GZIP

    With `gzip` you can compress and decompress individual file. When you give `gzip`
    command to compress any file, the file will be replaced with extension `.gz` file
    keeping the same ownership modes, access and modification times. In sort, you
    will not see original file only compressed file will be there.


    ### Syntax

    ```bash

    gzip filename

    ```


    ### Example

    ```bash

    gzip sysctl.conf

    ```


    ### Decompress

    To decompress the compressed file use `gunzip` command. However this command will
    remove the compressed file you will see only uncompressed file only.


    ### Syntax

    ```bash

    gunzip filename

    ```


    ### Example

    ```bash

    gunzip sysctl.conf.gz

    ```


    ## BZIP2

    `bzip` compresses file using compression algorithm known as Burrows Wheel block
    sorting. Like `gzip` it removes the original file and creates compressed file
    with same name plus extension `.bz2`. Each compressed file has same modification
    date, permission and if possible with same ownership as corresponding original
    file.


    ### Syntax

    ```bash

    bzip2 filename

    ```


    ### Example

    ```bash

    bzip2 sysctl.conf

    ```


    ### Decompress

    To decompress the file compressed with `bzip2` command use `bunzip2`. By default
    it will not overwrite if file of same name exist unless you give `-f` option.


    ### Syntax

    ```bash

    bunzip2 filename

    ```


    ### Example

    ```bash

    bunzip2 sysctl.conf.bz2

    ```


    ## XZ

    `xz` is successor of the `lzma` utility, it will add `.xz` extension to compressed
    file automatically and remove original file. Like `bzip` and `gzip` it will keep
    same modification date, permission and if possible with same ownership as corresponding
    original file.


    ### Syntax

    ```bash

    xz filename

    ```


    ### Example

    ```bash

    xz sysctl.conf

    ```


    ### Decompress

    ### Syntax

    ```bash

    unxz filename

    ```


    ### Example

    ```bash

    unxz sysctl.conf.xz

    ```


    ## ZIP

    `Zip` is archiving and compression utility. It creates files with `.zip` extension.
    It is cross platform compression utility so you can compress and decompress files
    from Linux to windows or vice versa. It will keep the original files intact.


    ### Syntax

    ```bash

    zip zipfile.zip file/files_to_compress

    ```


    ### Example

    ```bash

    zip abc.zip sysctl.conf signond.conf

    ```

    you can use `zip` also with wild cards

    ```bash

    zip abc.zip s*

    ```


    ### Zip files recursively (include sub directories also)

    ### Syntax

    ```bash

    zip -r zipfile.zip directoryname

    ```


    ### Example

    ```bash

    zip -r asp.zip monk

    ```


    ### Listing content of compressed file

    ### Syntax

    ```bash

    unzip -l zipfile.zip

    ```


    ### Example

    ```bash

    unzip -l asp.zip

    ```


    ### Decompress

    To decompress compressed files with `zip` command `unzip` is used.


    ### Syntax

    ```bash

    unzip zipfile.zip

    ```


    ### Example

    ```bash

    unzip asp.zip

    ```


    ## ar

    `ar` is not so known predecessor of `rar` which is still in use in RHEL. It used
    for archiving only as such there is no compression in it.


    ### Create archive

    ### Syntax

    ```bash

    ar cvsr archivefile.a files_to_archive

    ```


    ### Example

    ```bash

    ar cvsr abc.a s*

    ```


    ### Extract archive

    ### Syntax

    ```bash

    ar xv archivefile.a

    ```


    ### Example

    ```bash

    ar xv abc.a

    ```


    There are many third party utilities available which can be installed, you can
    try following:

    - `peazip`

    - `p7zip`

    - `pax`

    - `kgb`

    Many more..


    # Chapter 16. Firewall


    According to dictionary, a firewall is a wall or partition designed to inhibit
    or prevent the spread of fire. In computer world, firewall is network security
    system used to secure the incoming and outgoing connections. It prevents unauthorized
    access to the system. It restricts user to access only designated services.


    ## nftables

    In earlier version of Redhat `iptables` were used for packet filtering, but in
    with Redhat 8 it has been replaced with `nftables`. it is single tool for all
    `iptables` framework like `iptables`, `ip6tables`.


    ## Firewallld

    `Firewalld` is the dynamic firewall manager. It uses zones and services. It stores
    configuration in `/etc/firewalld/` and `/usr/lib/firewalld/`.


    ### Install fireld

    ```bash

    yum install firewalld

    ```


    ### Check the status

    ```bash

    systemctl status firewalld

    ```

    or

    ```bash

    firewall-cmd --state

    ```


    ## Firewallld concepts

    ### Configuration options

    Rules of firewalld can be designated as either Permanent or Runtime. Runtime changes
    are those changes to firewall settings that take effect immediately but are not
    permanent. Permanent changes are written into configuration files but will not
    be applied immediately unless you reload or reboot the machine.


    ### Zones

    In firewalld concept of zone is based on network interface. All network interfaces
    can be located in the same default zone or divided into different zones according
    to the levels of trust defined. By default `public` zone is used.


    ## List of zones with explanation

    - `Drop`: Drop all incoming connections, only outgoing network connections are
    available.

    - `Block`: Allows only outgoing network connection. Reject all incoming connection
    with `icmp-host-prohibited` message.

    - `Public`: You do not trust the other computers on the network. Only selected
    incoming connections are accepted. For use in public areas.

    - `Home`: Only selected incoming connections are accepted. For use in home area.

    - `Work`: You mostly trust the other computers on networks. Only selected incoming
    connections are accepted. For use in work areas.

    - `DMZ`: For the computers in DMZ demilitarized zone that are publicly accessible
    with limited access to the internal network, only selected incoming connections
    are accepted.

    - `External`: For use on external networks with masquerading enabled. Only selected
    incoming connections are accepted.

    - `Internal`: For use on internal networks. You mostly trust the other computers
    on the networks. Only selected incoming connections are accepted.

    - `Trusted`: All network connections are accepted.


    ## Zones commands

    List the available zones

    ```bash

    firewall-cmd --get-zones

    ```

    To display default zone

    ```bash

    firewall-cmd --get-default-zone

    ```


    Change the default zone

    ```bash

    firewall-cmd --set-default-zone=internal

    ```


    Check the zone to which interface is associated

    ```bash

    firewall-cmd --get-zone-of-interface=ens33

    ```

