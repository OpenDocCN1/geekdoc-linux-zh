  trans: "\n\n- `RHEL 8` 分为两个主要仓库：`BaseOS` 和 `Application Stream` (`AppStream`)。\n\
    - 支持更高的内存，最高支持 `4PB` 物理内存。\n- 默认显示服务器不再是 `Xorg` 而是 `Wayland`。\n- `XFS` 现在支持共享写时复制（copy-on-write）数据范围区功能。\n\
    - `XFS` 文件系统的最大大小为 `1024 TiB`，在早期版本中为 `500 TiB`。\n- `nftables` 代替 `iptables` 默认的网络过滤框架。\n\
    - `Python 3.6` 是默认的 Python 版本。\n- `PHP 7.2`。\n- `RHEL 8` 提供 `Node.js 10`。之前 `Node.js`\
    \ 仅作为软件集合（Software Collection）可用。\n- `Apache HTTP Server 2.4.37` 具有更好的安全性能。\n\
    - `GCC` 版本 `8.2`。\n- `LUKS` 版本 2 (`LUKS2`) 格式取代了旧的 `LUKS` (`LUKS1`) 格式用于加密卷。\n\
    - `Nginx 1.14` 在核心仓库中可用。\n- `Varnish Cache`。\n\n# 第 3 章 最小系统要求\n\n以下是安装 `RHEL`\
    \ 的最低要求。然而，为了获得机器的最佳性能，拥有比这些更多的资源是理想的。\n\n- 处理器：`1GHz` 或更快\n- 系统内存 (`RAM`）：`2GB`\n\
    - 硬盘：`20GB`\n\n`RHEL` 的图形化安装至少需要 `800x600` 的屏幕分辨率。如果您使用的设备分辨率较低，则应该进行 `VNC` 安装。\n\
    \n# 第 4 章 安装\n\n在本章中，我们将介绍版本 `8` 的 `Redhat Enterprise Linux` 的安装。`RHEL` 的安装非常简单且直观。本章的设计使得即使您没有先前的\
    \ `Linux` 知识，也可以轻松地安装 `RHEL`，因为整个安装过程都通过截图逐步进行了说明。\n\n安装 `RHEL` 涉及的步骤总结如下：\n\n\
    1. **下载媒体镜像**\n   您可以使用用户名和密码从 Red Hat 客户门户 `https://access.redhat.com/downloads`\
    \ 下载安装镜像。如果您没有用户名和密码，Red Hat 允许您获取评估版本。对于 Centos，请从 centos 网站下载镜像。\n\n2. **验证镜像**\n\
    \   一旦完成安装镜像，验证下载镜像的完整性是一个良好的习惯。\n\n3. **将镜像写入介质**\n   现在将镜像写入所需的介质。由于此镜像无法放入\
    \ `DVD`，您需要双层 `DVD`，或者可以使用 `USB 驱动器`。\n\n4. **选择您想要的安装方式**。有两种常用的安装方式：\n   - **交互式**：交互式方法是普通的安装方法，可以是基于\
    \ `Text` 的或 `GUI`。这种安装方法在安装过程中需要用户交互进行输入。\n   - **使用 Kickstart 自动化**：对于 `Kickstart`\
    \ 安装，我们需要创建一个单文件，包含 `RHEL` 安装在交互式安装期间通常询问的所有问题的答案。一旦开始安装，就不需要用户干预。\n\n5. **验证安装。**\n\
    \n## 交互式安装\n\n在本节中，我们将介绍 `Redhat` 的普通交互式安装，如果您正在安装 `Centos`，步骤是相同的：-。\n\n### 下载媒体镜像\n\
    \n首先，安装我们需要介质。为了准备介质，您必须下载安装 ISO 镜像。在您的 `MS windows` 机器上打开 Internet Explorer。打开\
    \ Redhat 客户门户网站或 `https://access.redhat.com/downloads`。\n\n从列表中选择 `Red Hat Enterprise\
    \ Linux 8` 并提供您的凭据。如果您没有 redhat 账户，可以请求评估副本。成功登录后，您将获得下载列表，选择 `Red Hat Enterprise\
    \ Linux 8.0 Binary DVD` 并点击“立即下载”。\n\n![](img/Image00000.jpg)\n\n文件下载完成后，检查文件的完整性。如果您您在\
    \ `MS Windows 10` 电脑上下载了文件，进入下载文件的文件夹。按住 `shift` 键并点击鼠标左键。\n\n这将打开菜单，点击“在此处打开\
    \ PowerShell 窗口”。\n\n![](img/Image00001.jpg)\n\n在 shell 提示符上输入命令：\n\n```bash\n\
    Get-FileHash -Path .\\rhel-8.0-x86_64-dvd.iso -Algorithm SHA256\n```\n\n![](img/Image00002.jpg)\n\
    \n它将显示哈希值，将此值与下载页面提供的值进行比对。\n\n![](img/Image00003.jpg)\n\n### 将镜像写入介质\n\n验证镜像后，您可以将\
    \ ISO 文件写入 `DVD`。如果计算机中的 `DVD 驱动器`无法工作或不存在，可以将此镜像写入 `USB 闪存盘`。写入 `USB 闪存盘` 的步骤如下所示：\n\
    \n#### 在 Windows 上创建 USB 介质\n\n1. 从 `https://github.com/MartinBriza/MediaWriter/releases`\
    \ 下载 `Fedora media writer`。\n\n![](img/Image00004.jpg)\n2. 双击下载的文件进行安装并遵循“向导”操作。\n\
    3. 安装完成后，从开始菜单运行 `Fedora Media Writer`。\n4. 在主窗口点击 `Custom image` 并选择下载的 `RedHat\
    \ enterprise Linux ISO Image`。\n5. 从下拉菜单选择您想要使用的驱动器。\n6. 点击 `Write to disk`。这将开始创建介质。\n\
    7. 一旦过程完成，卸载 `USB` 设备。\n8. `USB 闪存盘` 已准备就绪。\n\n### 安装步骤\n\n#### 使用介质启动\n\n介质就绪后。将\
    \ `USB` 设置为启动设备。一旦系统启动，将显示安装菜单。安装 `RHEL 8.0`。\n\n![](img/Image0005.jpg)\n\n在语言菜单选择\
    \ `Language` 并继续。\n\n![](img/Image00006.jpg)\n\n这将进入安装摘要。选择 `Date and time` 修改日期和时区。\n\
    \n![](img/Image00007.jpg)\n\n如果您使用 `Network Time`，可以进行配置。将 `Network` 按钮切换为开启状态并点击小齿轮进行网络设置。设置完成后点击\
    \ `Done`。\n\n![](img/Image00008.jpg)\n\n从屏幕上点击 `Software Selection` 并选择 `Base\
    \ environment`。为了演示，我选择了 `Server with GUI` 并点击 `Done`。\n\n![](img/Image00009.jpg)\n\
    \n在安装摘要屏幕上，选择 `Installation Destination`。\n\n![](img/Image00010.jpg)\n\n![](img/Image00011.jpg)\n\
    \n要么留给 `Automatic Configure`，或者选择 `I will configure partitioning` 进行手动分区。在选择 `Manual\
    \ partitioning` 的情况下，虽然 `RedHat` 可以通过 root 和 swap 分区工作，但最好有三个分区。这三个分区分别是 `boot`、`/\
    \ (root)` 和 `swap`。`boot` 至少应 `1 GB`，`root` 至少 `20GB`，`swap` 分区应等于或大于物理 `RAM`。您可以使用易读格式编写容量，例如\
    \ `10G` 代表 `10GB`，`500M` 代表 `500MB`。\n\n现在点击 `Network and Host Name` 配置网络设置和主机。\n\
    \n![](img/Image00012.jpg)\n\n1. 在 `Host Name` 框中写入主机。\n2. ![](img/Image00013.jpg)\
    \ 选择网卡\n3. 将 `Connected` 按钮切换到 `On`。\n4. 点击 `configure` 按钮。\n\n将进入网络配置屏幕。\n\n\
    1. 选择 `IPv4 setting` 标签页。\n2. 如果有静态 `IP`，则从下拉菜单将 `method` 设置为 `manual`，否则留空 `Automatic`。\n\
    3. 在静态 `IP` 的情况下，点击 `Add` 按钮。\n4. 填写 `IP address`、`Netmask` 和 `gateway`。\n5. 添加\
    \ `DNS server IP Address`，如果有多个 `DNS server`，则用逗号分隔 `IP Address`。\n6. ![](img/Image00014.jpg)\
    \ 选择 `General Tab`。\n7. 勾选 `Automatically connect to this network when it is available`。\n\
    \n点击 `Save` 保存设置。\n\n点击 `Begin installation`。这将进入一个屏幕，其中显示安装进度、设置 `root password`\
    \ 的选项以及创建一个新用户。\n\n"
- fmt: "\nSelect Root password and provide root password. Press Done.\n\n![](Image00018.jpg)\n\
    \nDuring installation, you have to create one normal user. Click `Create New user`.\
    \ Provide Full name of the user, `username` and password and press done. If you\
    \ do not want to use root user for administration you can make this user as administration\
    \ by selecting `Make this user administrator`.\n\n![](Image00019.jpg)\n\nOnce\
    \ installation gets complete press `Reboot`.\n\n![](Image00020.jpg)\n\nAfter restart\
    \ system will bring screen for license and add the RedHat subscription details.\n\
    \n![](Image00021.jpg)\n\nSelect `License information`\n\n![](Image00022.jpg)\n\
    \nOn next screen Select `I accept the license agreement` and press `Done`\n\n\
    Now press `Subscription Manager` (this is step is optional you can do this later\
    \ on also)\n\nOn the next screen if you are using proxy provide proxy setting\
    \ for connecting internet. Press `Done`.\n\n![](Image00023.jpg)\n\nOn the next\
    \ screen provide login and password for your redhat subscription and press `Done`.\n\
    \n![](Image00024.jpg)\n\nNow press `Finish Installation`.\n\nNow you have finished\
    \ your installation. It’s time to connect to the newly created server from remote\
    \ machine, we will discuss how to connect your windows machine in the next chapter.\n\
    \n# Chapter 5. Connecting Your PC to RHEL Server\n\nIn practical life you occasionally\
    \ work physically on server, usually you connect from your PC and do administration.\
    \ You may be using MS MS windows 10 on your PC. First thing you require to connect\
    \ to Linux host is a software. There are many options like `VanDyke`, `bitvise`\
    \ and `putty`. Among them `PuTTY` is free and most popular option.\n\n`PuTTY`\
    \ is an SSH and telnet client, developed originally by Simon Tatham for the Windows\
    \ platform. It is a software that provides text terminal access of servers on\
    \ remote MS Windows machine. To install `putty` open internet explorer and download\
    \ `putty` from\n\n`http://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html`\n\
    \nOnce you have downloaded the `putty`, install it.\n\nWhen you run `putty` you\
    \ will see following screen. On this screen:\n\n1. Write the IP Address of the\
    \ newly installed server.\n2. Select the Protocol as `SSH`\n3. Give name of Session\
    \ like `RHEL1` or `linux1` etc.\n4. Press `Save` button\n\n![](Image00025.jpg)\n\
    \nOnce session is saved either double click the session name to connect to the\
    \ Linux host or select the session press `Load` then press `Open`\n\n# Chapter\
    \ 6. Network\n\nNetwork is group of two or more computers connected together.\
    \ Network allows interconnection between different machines. You require network\
    \ card on each computer to connect. Every network card has physical address known\
    \ as `Media Access Control address` (`MAC address`). `MAC address` works on layer\
    \ 2 of OSI model. Manufacturer of network interface card assigns MAC addresses\
    \ to network cards. As network card can go faulty and needs replacement, with\
    \ replacement of network card, the `MAC address` will change. To overcome this\
    \ problem, we assign `IP address` to network card, which works on layer 3 of OSI\
    \ model. As `IP address` are still numeric value it is difficult to remember,\
    \ more over there is possibility of `IP address` may change in case of dynamic\
    \ IPs. To make life easy for humans we use `hostname`, which is nothing but name\
    \ of computers.\n\nJust to give an idea about OSI model and list of applications\
    \ and devices with their respective layers, a chart is given below.\n\n### Seven\
    \ layer of OSI and TCP Mapping\n\n| OSI Model | TCP Model | Application | Address\
    \ | Devices |\n| :--- | :--- | :--- | :--- | :--- |\n| 7:Application layer | `ApplicationLayer`\
    \ | `HTTP` / `Telnet` / `SSH` | Applications `DNS`, `DHCP`, `ntp`, `HTTP` | |\n\
    | 6:Presentation layer | `SSL` / `MIME` | | | |\n| 5: Session layer | `Sockets`\
    \ and Remote Procedure Call (RPC)` | | |\n| 4: Transport layer | `Transportlayer`\
    \ | `Transmission Control Protocol (TCP)` | `TCP/UDP` | Gateway |\n| 3: Network\
    \ layer | `Internetlayer` | `Internet Protocol (IP)` | `IP4`, `IP6`, `IPX`, `ICMP`\
    \ | Router, `firewallLayer 3 switch` |\n| 2: Data link layer | `Network AccessLayer`\
    \ | `Ethernet` / `Frame Relay` | `MAC address`, `ARP` | Bridge `Layer 2 switch`\
    \ |\n| 1: Physical layer | `IEEE 802.x` | `Ethernet` | HUB | |\n\n## Commands\
    \ to check network configuration\n\nAfter fresh installation, it is good idea\
    \ to check the network configuration. As a best practice note down this configuration.\n\
    \n### Show IP address\n```\n# ip addr show\n```\nOr\n```bash\n# ifconfig -a\n\
    ```\n\n### Show Link status\n```bash\n# ip link show\n```\n\n### Show routing\
    \ table\n```bash\n# ip route\n```\nOr\n```bash\n# netstat -rn\n```\n\n### Check\
    \ and change hostname\n\n#### Show hostname\n```bash\n# hostname\n```\n\n####\
    \ Change hostname\nWhenever you want to change hostname, you have to change it\
    \ in two steps:\n\n1. Change hostname using command `hostnamectl`.\n2. Next change\
    \ entry in `/etc/hosts`.\n\n1. Give `hostnamectl` command status to check the\
    \ current:\n```\n# hostnamectl status\n  Static hostname: RHEL1\n       Icon name:\
    \ computer\n          Chassis: n/a\n```\n\n2. Change hostname:\n```bash\n# hostnamectl\
    \ set-hostname RHEL1\n```\n3. Next step is to change `/etc/hosts`:\n```bash\n\
    # edit /etc/hosts\n```\n"
