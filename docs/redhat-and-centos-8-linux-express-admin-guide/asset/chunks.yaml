    # CodeReady Linux Builder 仓库


    Red Hat 在所有类型的订阅中默认都提供 `BaseOS` 和 `Appstream` 仓库，这两个仓库默认都是启用的。除了 `BaseOS` 和 `Appstream`
    仓库外，还为开发者添加了一个名为 `CodeReady` 的新仓库。所有订阅都包含对新的 `CodeReady Linux Builder` 仓库的访问。正如名称所示，`CodeReady
    Linux Builder` 适用于使用 Red Hat Enterprise Linux 基础设施开发 Linux 程序的开发者。它包含了开发者在构建应用程序时专门使用的包。`CodeReady
    Linux Builder` 是一个类似于旧版本 Red Hat Enterprise Linux 中找到的可选仓库的仓库。`CodeReady Linux
    Builder` 包含了构建工具和 `-devel` 包。尽管 `CodeReady Linux Builder` 包含了构建工具和 `-devel` 包。


