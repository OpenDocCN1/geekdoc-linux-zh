    Parted


    Parted is an other famous command line tool that allows you to easily manage hard
    disk partitions. The utility parted allows users to:


    *   View the existing partition table


    *   Add partitions from free space


    *   Delete existing partitions


    Install Parted on Linux


    If parted is not installed on your Linux machine you can install it using following
    command


    # yum install parted   


    Check version of installed parted


    To know version of installed parted either you can give parted -v


    [root@RHEL2 ~]# parted -v


    parted (GNU parted ) 3.2


    Copyright (C) 2014 Free Software Foundation, Inc.


    License GPLv3+: GNU GPL version 3 or later <http://gnu.org/licenses/gpl.html>.


    This is free software: you are free to change and redistribute it.


    There is NO WARRANTY, to the extent permitted by law..


    List partitions


    To list partition start parted and give print command or


    parted -l


    [root@RHEL2 ~]# parted -l


    Model: VMware, VMware Virtual S (scsi)


    Disk /dev/sda: 21.5GB


    Sector size (logical/physical): 512B/512B


    Partition Table: msdos


    Disk Flags:


    Number  Start   End     Size    Type     File system     Flags


    1      1049kB  10.7GB  10.7GB  primary  xfs             boot


    2      10.7GB  15.0GB  4295MB  primary  linux-swap(v1)


    <output truncated >


    List Partition of specific disk


    To list partition of specific disk, give parted command with device name then
    use print and quit command.


    [root@RHEL2 ~]# parted /dev/sda


    GNU Parted 3.1


    Using /dev/sda


    Welcome to GNU Parted! Type ''help'' to view a list of commands.


    (parted) print


    Model: VMware, VMware Virtual S (scsi)


    Disk /dev/sda: 21.5GB


    Sector size (logical/physical): 512B/512B


    Partition Table: msdos


    Disk Flags:


    Number  Start   End     Size    Type     File system     Flags


    1      1049kB  10.7GB  10.7GB  primary  xfs             boot


    2      10.7GB  15.0GB  4295MB  primary  linux-swap(v1)


    (parted) quit


    Create partition


    Define partition type


    First thing when add new disk you have to decide partition style it can be either
    MBR or GPT.


    MBR and GPT are two style of partitioning. Master boot record (MBR) is old standard
    supported by most of the OS. MBR disk use the standard BIOS partition table. On
    the other hand, GUID partition table (GPT) is a new technology in which disks
    uses unified extensible firmware interface (UEFI). The advantage of GPT disks
    is that you can have more than four partitions on each disk and it can support
    disks larger than 2 terabytes.


    To change the partition type with parted command, use mklabel command option followed
    by partition type, Use mklabel msdos command for MBR type partition writ e mklabel
    gpt for GPT type partition.


    [root@RHEL2 ~]# parted /dev/sdb


    GNU Parted 3.1


    Using /dev/sdb


    Welcome to GNU Parted! Type ''help'' to view a list of commands.


    (parted) mklabel msdos


    Warning: The existing disk label on /dev/sdb will be destroyed and all data on
    this disk will be lost. Do you want to continue?


    Yes/No? yes


    (parted)


    Create partition


    Once defined the partition style it’s time to create partition.'
