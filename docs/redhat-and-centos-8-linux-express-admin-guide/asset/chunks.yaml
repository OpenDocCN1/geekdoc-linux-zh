    on remote MS Windows machine. To install putty open internet explorer and download
    putty from


      [http://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html](http://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html)


    Once you have downloaded the putty, install it.


    When you run putty you will see following screen. On this screen  


    1.  Write the IP Address of the newly installed server.


    2.  Select the Protocol as SSH


    3.  Give name  of Session like RHEL1 or linux1 etc


    4.  Press Save button


    ![](Image00025.jpg)


    Once session is saved either double click the session name to connect to the Linux
    host or select the session press Load then press Open


    Chapter 6.              


    # Network


    Network is group of two or more computers connected together. Network allows interconnection
    between different machines. You require network card on each computer to connect.
    Every network card has physical address known as M edia A ccess C ontrol address
    (MAC address). MAC address works on layer 2 of OSI model. Manufacturer of network
    interface card assigns MAC addresses to network cards. As network card can go
    faulty and needs replacement, with replacement of network card, the MAC address
    will change. To overcome this problem, we assign IP address to network card, which
    works on layer 3 of OSI model. As IP address are still numeric value it is difficult
    to remember, more over there is possibility of IP address may change in case of
    dynamic IPs. To make life easy for humans we use hostname, which nothing but name
    of computers.


    Just to give an idea about OSI model and list of applications and devices with
    their respective layers, a chart is given bellow.


    Seven layer of OSI and TCP Mapping


    | OSI Model | TCP Model | Application | Address | Devices |


    | 7:Application layer | ApplicationLayer | HTTP / Telnet / SSH | ApplicationsDNS,
    DHCP.ntp,HTTP, |  |


    | 6:Presentation layer | SSL / MIME |  |


    | 5: Session layer | Sockets and Remote Procedure Call (RPC) |  |


    | 4: Transport layer | Transportlayer | Transmission Control Protocol (TCP) |
    TCP/UDP | Gateway |


    | 3: Network layer | Internetlayer | Internet Protocol (IP) | IP4, IP6, IPX, ICMP
    | Router, firewallLayer 3 switch |


    | 2: Data link layer | Network AccessLayer | Ethernet / Frame Relay | MAC address,
    ARP | BridgeLayer 2 switch |


    | 1: Physical layer | IEEE 802.x | Ethernet | HUB |


    Commands to check network configuration


    After fresh installation, it is good idea to check the network configuration.
    As a best practice note down this configuration 


    Show IP address


    # ip addr show


    Or


    # ifconfig -a


    Show Link status


    # ip link show


    Show routing table


    # ip route


    Or


    # netstat -rn


    Check and change hostname


    Show hostname


    # hostname


    Change hostname


    Whenever you want to change hostname, you have to change it in two steps 


    1.  Change hostname using command hostnamectl


    2.  Next change entry in /etc/hosts


    1.  Give hostnamectl command status to check the current


    # hostnamectl status


       Static hostname: RHEL1


             Icon name: computer


               Chassis: n/a


            Machine ID: 98c0429d893c48b88fba101f95aa70ca


               Boot ID: 864f0f4e99cd4442b4f388a15a7fc132


    Or


    # hostname


    2.  Change the hostname


    # hostnamectl set-hostname RHEL2


    3.  Next step is to change /etc/hosts file


    127.0.0.1 RHEL2 localhost.localdomain localhost


    Setting Up the DNS Name Resolution


    Whenever you write hostname instead of IP address to ping or to connect Linux
    host. You have multiple option to resolve hostname to IP address. 


    *   Local file i.e. /etc/hosts


    *   DNS server


    *   NIS


    Local file (/etc/hosts)


    /etc/hosts is file which stores hostname to IP address mapping. It provides ability
    to resolve hostname without using DNS server.  We generally use this file if we
    are connecting to limited number of host due scope or security reason. But problem
    in using this file is that if host changes its ipaddress for any reason then administrator
    has to change this file on all servers or PC who wants to resolve this hostname. 


    Format


    IP_address hostname aliases


    Example


    127.0.0.1  RHEL1 localhost


    ::1         RHEL1 localhost


    192.168.228.129 RHEL1


    DNS


    A DNS server is a central repository that contains a database of public IP addresses
    and their associated hostnames. Whenever any client wants to resolve hostname
    to IP address instead of using its local file it sends request to DNS server.
    If IP Address of some client changes you just have to update the DNS entry. You
    can have multiple DNS server in one organization. To redirect your request for
    hostname resolution RedHat uses resolve.conf file which is present. in /etc directory 


    /etc/resolv.conf


    /etc/resolv.conf is required in case DNS is used to resolve host names. You need
    to put your DNS server IP addresses in this file. Generally, you need one name
    server, but you can include up to three if you want redundancy. If the first one
    on the list is not responding, system tries to resolve against the next one on
    the list, and so on.


    Edit /etc/resolv.conf to add list of name servers, like this:


    nameserver 8.8.8.8


    nameserver 8.8.8.9


    nameserver 1.2.3.6


    NIS


    Network Information Service (NIS) was developed by Sun Microsystems as a way to
    share information among all computers in a local area network. Of many tasks NIS
    can also be used for Name resolution.


    Changing order for hostname resolution


    /etc/nsswitch.conf


    If hosts file and DNS configuration is there in resolv.conf in your server, Whenever
    you do hostname resolution the system looks for local file (/etc/hosts) for entry
    of hostname and respective IP address. If there is no entry, it looks for /etc/resolv.conf
    file for DNS configuration. If there is no DNS configuration also then it will
    check for NIS configuration. However, you can change this behavior by changing
    order in /etc/nsswitch.conf file.


    vi /etc/nsswitch.conf


    ![](Image00026.gif)


    In this example search sequence is first files means /etc/hosts then DNS server.


    Network Manager'
