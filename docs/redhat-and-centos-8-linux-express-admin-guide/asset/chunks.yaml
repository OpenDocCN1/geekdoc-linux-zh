    旧版本（如 RedHat 6 及更早版本）实现了运行级别（run levels）。运行级别是操作系统运行的某种或模式。每个运行级别会导致某些服务的停止或启动，从而实现对机器行为的控制。然而，在
    RHEL 7 中，它被 `systemd` 目标（targets）取代了。Redhat 6 或更早版本有七个运行级别，它们在新版本中已被相应的目标单元取代。


    | 运行级别 | 描述 | 目标单元 (Target unit) |

    | :--- | :--- | :--- |

    | 0 | 关机 | `poweroff.target` |

    | 1 | 单用户模式 | `rescue.target` |

    | 2 | 无 GUI 的命令行多用户模式 | `multiuser.target` |

    | 3 | 无 GUI 的命令行多用户模式 | `multiuser.target` |

    | 4 | 无 GUI 的命令行多用户模式 | `multiuser.target` |

    | 5 | 带 GUI 的多用户模式 | `graphical.target` |

    | 6 | 重启 | `reboot.target` |


    列出当前加载的目标

    ```

    systemctl list-units --type target

    ```


    ## 默认目标 (Default Target)

    默认目标决定了 systemd 在启动时引导系统的方向。`/etc/inittab` 文件不再像在 RHEL 早期版本那样用于设置默认运行级别。现在默认目标单元由
    `/etc/systemd/system/default.target` 文件表示。该文件是当前设置目标的符号链接。假设当前目标设置为 graphical，此文件将指向
    graphical 目标文件的符号链接。


    ### 修改默认目标

    #### 语法

    ```

    systemctl set-default <name of target>.target

    ```

    #### 示例

    ```

    systemctl set-default graphical.target

    ```

    已删除符号链接 `/etc/systemd/system/default.target`。

    已创建从 `/etc/systemd/system/default.target` 到 `/usr/lib/systemd/system/graphical.target`
    的符号链接。


    ### 查看默认目标

    ```

    systemctl get-default

    ```


    ### 修改当前目标

    在更改默认目标后，当前目标在下次重启之前将保持不变。要在不重启的情况下更改当前目标，请使用：


    #### 语法

    ```

    systemctl isolate default

    ```

    或

    ```

    systemctl default

    ```


    将当前目标更改为默认目标以外的不同目标。假设你想启动单用户目标：


    #### 语法

    ```

    systemctl isolate newtarget.target

    ```

    #### 示例

    ```

    systemctl isoloate rescue.target

    ```


    ## 第 10 章. OpenSSH

    SSH（安全外壳）在客户端-服务器架构中为不安全的网络提供了一个安全通道。SSH 是不安全协议 `telnet` 的替代品。它允许通过安全通道远程登录并执行命令，因为客户端和服务器之间的所有通信都是加密的。RHEL
    包含了用于 `ssh` 的 `OpenSSH` 包。随 RHEL 附带的 SSH 套件是 SSH 版本 2。OpenSSH 为安全通信提供了许多工具，如 `ssh`、`scp`
    和 `sftp`。它还提供了安全隧道、不同的身份验证方法和易于配置的功能。RHEL 8 包含了 `openssh`、`openssh-server` 和 `openssh-clients`
    软件包。`openssh` 包还需要在系统中安装 `openssl-libs`，因为它为加密通信提供了加密库。RHEL 的默认安装预装了 `openssh`。如果没有，则需要使用此命令安装它们。


    ```

    yum install openssh openssh-server openssh-clients openssl-libs

    ```


    ### 启动服务

    ```

    systemctl start sshd.service

    ```

    ### 设置服务在系统启动时自动启动

    ```

    systemctl enable sshd.service

    ```

    ### 检查状态

    ```

    systemctl status sshd.service

    ```


    ### SSH 协议版本

    SSH 有两个版本：版本 1 和版本 2。RHEL 8 提供的 OpenSSH 套件是 SSH 版本 2。SSH2 更安全，并且包含了 SFTP，其功能与
    FTP 类似，但具有加密。`scp` 代替了 `rcp`。


    检查你正在运行的 `ssh` 版本：

    ```

    ssh -v localhost

    ```

    此命令显示 `ssh` 的详细模式，请查找以下行：

    `debug1: Local version string SSH-2.0-OpenSSH_7.8`


    ### 配置文件

    | 文件 | 描述 |

    | :--- | :--- |

    | `/etc/ssh/sshd_config` | `sshd` 守护进程的默认配置文件 |

    | `/etc/ssh/ssh_config` | SSH 客户端默认配置文件。如果存在 `~/.ssh/config`，则它会被覆盖 |

    | `~/.ssh/config` | 客户端侧配置文件 |


    ### 从客户端连接

    如果你在 Linux 客户端机器上并想要登录到远程 RHEL 服务器，你需要在客户端机器上安装 `ssh` 客户端，并在 RHEL 服务器上运行 SSH 服务端。从客户端执行此命令：

    ```

    ssh –x user@ server-IPaddress_or_hostname

    ```

    #### 示例

    ```

    ssh –x root@RHEL1

    ```

    无法建立主机 ''RHEL1 (192.168.131.152)'' 的真实性。

    ECDSA 密钥指纹为 SHA256:kJkcVAsgMdv5FsbEeaHWNK33LJHHLaHSUC8WZE/Sri8。

    你确定要继续连接吗 (yes/no)? yes

    警告: 已将 ''RHEL1,192.168.131.152'' (ECDSA) 永久添加到已知主机列表。

    `root@RHEL1''s password:`

    `[root@RHEL1 ~]`


    它会询问 `ssh` 命令中指定的用户的密码。当第一次从客户端到服务器建立 `ssh` 连接时，服务器的公钥将存储在客户端本地，这样下次就可以验证其身份。

    `Ctrl + d` 或 `exit` 命令将终止 `ssh` 会话。

    从客户端终止 `ssh` 会话：

    ```

    exit

    ```


    ## 使用 SSH 密钥免密登录

    SSH 也允许客户端在无密码登录。在本节中，我们将学习如何操作。客户端....... R111....1....1.1 keys 在上


    111































    11

    ```

    ssh-keygen

    ```

    2. 将公钥从 RHEL1 复制到第二台服务器 RHEL2：

    ```

    scp ~/.ssh/id_rsa.pub root@RHEL2:/root/

    ```

    3. 在第二台服务器 RHEL2 的家目录下创建 `.ssh` 目录并将权限更改为 700（仅所有者可读写执行）：

    ```

    mkdir .ssh

    chmod 700 .ssh

    ```

    4. 将早期复制到 /root 的公钥追加到 `authorized_keys` 文件并更改权限：

    ```

    cat id_rsa.pub >> .ssh/authorized_keys

    chmod 644 .ssh/authorized_keys

    ```

    5. 现在尝试从 RHEL1 登录 RHEL2，将不需要密码：

    ```

    ssh root@RHEL2

    ```


    ## scp 工具

    `scp` 是 openssh 套件的一部分，可以通过加密连接在机器间传输文件。它是 `rcp` 命令的安全替代方案。`scp` 命令的语法如下：


    #### 语法

    ```

    scp filename username@hostname:/directory

    ```

    #### 示例

    ```

    scp abc.txt user1@RHEL2:.

    ```

    在此示例中，我们将 `abc.txt` 从主机 1 RHEL1 传输到远程机器 RHEL2。


    从远程机器传输文件到本地系统：

    #### 语法

    ```

    scp username@hostname:remotefile localdirectory

    ```

    #### 示例

    在此示例中，我们将 xyz.txt` 从远程主机 2 RHEL2 传输到本地机器 RHEL1。在 RHEL1 shell 提示符下：

    ```

    scp user2@RHEL2:/home/user2/xyz.txt /home/user1/

    ```


    ## sftp 工具

    文件传输协议 (FTP) 是用于计算机间传输文件的常用协议，特别是从互联网下载文件。然而，它使用未加密的通信，是不安全的。SSH 文件传输协议 (SFTP)
    是 FTP 的一种 SSH 实现，提供了加密数据传输。`sftp` 提供交互式提示符。你可以使用命令向远程主机下载或上传文件。


    使用 `sftp username@hostname` 或服务器 IP 地址连接远程系统，它会询问用户名的密码：


    #### 语法

    ```

    sftp username@hostname

    ```

    #### 示例

    ```

    sftp user1@RHEL2

    ```


    ### sftp 常用命令

    | 命令 | 描述 |

    | :--- | :--- |

