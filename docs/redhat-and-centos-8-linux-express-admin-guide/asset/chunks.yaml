    \ what system was doing at specific point in time. Suppose your machine is running\
    \ slow or not working properly as a Linux administrator, first thing to look for\
    \ problem is logs. Logs provides clue when and how problem started and what part\
    \ of OS is giving problem.\n\nThe log files generated in a Linux environment can\
    \ normally be classified into four different categories:\n\n*   Application Logs\n\
    \n*   Event Logs\n\n*   Service Logs\n\n*   System Logs\n\nRHEL provide services\
    \ for saving log information. Some application in RHEL use their own mechanism\
    \ to logs directly to their log information files, example of which is apache\
    \ Some of the service maintain their logs through systemctl. systemctl further\
    \ communicates to Journald which keep track on log information.\n\nrsyslog is\
    \ another logging method. rsyslog and Journal, have several distinguishing features\
    \ that make them suitable for specific use cases. In many situations, it is useful\
    \ to combine their capabilities.\n\njournald\n\njournald daemon is a component\
    \ of systemd which is used for logs management. It’s a centralized location for\
    \ all messages logged by different components in a systemd enabled Linux system.\
    \ This includes kernel and boot messages, initial RAM disk, messages coming from\
    \ syslog or different services, it indexes and makes them available to the user.\
    \ Log data collected by the journal is primarily text-based but can also include\
    \ binary data where necessary. Log files produced by journald are not persistent,\
    \ log files are stored only in memory or a small ring-buffer in the /run/log/journal/\
    \ directory. The amount of logged data depends on free memory. Logs gets rotated\
    \ periodically. But you can configure the system to make these logs persistent.\n\
    \nViewing log with journalctl\n\nTo view log\n\njournalctl\n\nTo view full meta\
    \ data about all entries\n\njournalctl -o verbose\n\nLive view of logs\n\njournalctl\
    \ -f\n\nFiltering by Priority\n\nYou can filter the logs on basis of priority.\n\
    \nSyntax\n\njournalctl -p priority\n\nExample\n\nIn this example, we want to view\
    \ only lines with error from the log \n\njournalctl -p err\n\nTo view log entries\
    \ only from the current boot\n\njournalctl -b\n\nTo make logs persistent\n\n$\
    \ sudo mkdir -p /var/log/journal\n\nThen, restart journald to apply the change:\n\
    \nsystemctl restart systemd-journald\n\nRsyslogd\n\nSome logs are controlled by\
    \ rsyslogd daemon. It is enhanced replacement of sysklogd. It offers high-performance,\
    \ great security features, modular design and support for transportation via the\
    \ TCP or UDP protocols. Every logged message contains at least a time and normally\
    \ a program name field.\n\n/etc/rsyslog.conf\n\nThe   rsyslog.conf   file  is \
    \ the  main  configuration  file  for  the rsyslogd which logs system messages \
    \ on  the   systems. This file specifies rules for logging rsyslogd. List of log\
    \ files maintained by rsyslogd can be found in the rsyslog.conf configuration\
    \ file. Log files are usually located in the /var/log/ directory.\n\nSample rsyslog.conf\n\
    \netc]$ cat rsyslog.conf\n\n# rsyslog v5 configuration file\n\n# For more information\
    \ see /usr/share/doc/rsyslog-*/rsyslog_conf.html\n\n# If you experience problems,\
    \ see http://www.rsyslog.com/doc/troubleshoot.html\n\n*.info;mail.none;authpriv.none;cron.none               \
    \ /var/log/messages\n\n# The authpriv file has restricted access.\n\nauthpriv.*                                             \
    \ /var/log/secure\n\n# Log all the mail messages in one place.\n\nmail.*                                                 \
    \ -/var/log/maillog\n\n# Log cron stuff\n\ncron.*                                                 \
    \ /var/log/cron\n\n# Everybody gets emergency messages\n\n*.emerg                                                \
    \ *\n\n# Save news errors of level crit and higher in a special file.\n\nuucp,news.crit                                         \
    \ /var/log/spooler\n\n# Save boot messages also to boot.log\n\nlocal7.*                                               \
    \ /var/log/boot.log\n\nLog filtering with rsyslog.conf"
