    Chapter 21.              


    # NFS


    NFS (Network File System) is file sharing file system, which works on server client
    basis. Server’s shared file systems are mounted on clients.


    Four version of NFS are there:-


    1. NFS V1


    2. NFS V2


    3. NFS V3


    4. NFS V4


    Where NFS V3 and NFS V4 are more recent version of NFS, V3 is safer and asynchronous
    works on UDP protocol while V4 has added advantage of working through firewall
    and works on TCP.


    To make shared file system available on the client it has be exported from server.
    For exporting there are two ways to configure exports on an NFS server.


    *   Through /etc/export s configuration file.


    *   Explicitly Using the exportfs utility on the command line, but this way you
    have to do every time after reboot.


    Configure NFS on the server


    Install packages


    # yum install nfs-utils


    # yum install rpcbind


    Start the services


    # systemctl start rpcbind


    # systemctl start nfs-server


    Make service start on next reboot


    # systemctl enable rpcbind


    # systemctl enable nfs-server


    To export file system without /etc/exports manually.


    # exportfs –i /user1


    To export file system using /etc/exports


    Edit /etc/export s file to add file systems you want to share to clients format
    of that is :-


    mountpoint [host][permissions/options]


    where


    mountpoint is file systems you want export


    host is optional, the client you want to give access the filesystems


    permissions is optional it can be ro read only, rw read write insecure, sync changes
    written before command finished.


    Example


    /software/c1 192.168.10.12(rw,sync)


    Export file system


    # exportfs –a


    See the file system exported


    # showmount –e


    Configure firewall to allow NFS server to clients


    firewall-cmd --permanent --zone public --add-service mountd


    firewall-cmd --permanent --zone public --add-service rpc-bind


    firewall-cmd --permanent --zone public --add-service nfs


    firewall-cmd --reload


    On client


    # showmount –e server IP address / hostname


    # mount –t nfs 192.168.0.1:/userfs /newmnt  


    To unexport all exported file system


    # exportfs –ua


    Chapter 22.              


    # LVM snapshot


    LVM snapshot is a point in time copy of Logical Volume. The snapshot provides
    static view of original volume. Once snapshot has been taken we can use this snapshot
    to take backup of volume as snapshot is static copy and it will not change while
    backup is happening unlike the original volume which is dynamic.


    The snapshot volume size should be enough to store the data that will change after
    snapshot has been taken. The volume will store only changes after the snapshot
    has been taken.


    Create snapshot LV


    1.  Check the LV name and size of File System for which you want to create snapshot


    # df -hT /newfs


    Filesystem        Type  Size  Used Avail Use% Mounted on


    /dev/mapper/vg01-lv01 ext4 1008M   34M  924M   4% /newfs


    2.  Check you have space at least equivalent to 10% of file system you want to
    take snapshot available on the VG where original LV is located


    # vgdisplay vg01


    3.  Create LV 8 to 10 % of capacity of  original LV


    lvcreate -s -n snaplvname -L size /dev/vgname/orginal_lv_name


    # lvcreate -s -n snaplv1 -L 100M /dev/mapper/vg01-lv01


    4.  if you want to see content of snapshot LV


    mount -o ro /dev/vgname/snaplv /mount_point_snaplv


    # mount -o ro /dev/vg01/snaplv1 /snapfs/


    5.  Change to directory to check the contents


    cd /mount_point_snaplv


    # cd /snapfs/


    # ls


    Remove snapshot LV


    Once you have taken backup and you do not want this snapshot, you can remove it
    using following procedure


    1.  Unmount snap File system


    umount /mount_point_snaplv


    [root@RHEL1 /]# umount /snapfs


    2.  Remove the snap logical volume


    lvremove /dev/vgname/snaplv


    [root@RHEL1 /]# lvremove /dev/mapper/vg01-snaplv1


    Chapter 23.              


    # Utilities and commands


    In this chapter we will discuss some of the common command utilities very useful
    in RHEL administration. Most of the commands discussed in chapter can also be
    used on almost any flavor of Linux.  


    cp


    Command to copy files


    Syntax


    cp <options> source destination


    Example


    cp /home/abc.txt /home1/


    Copy all files in the directory recursively


    cp –R /home/* /home1/


    Prompt before any overwrite


    cp –i /home /home1


    Copy all new files to the destination


    cp –u * /tmp


    Forcefully copy files


    cp –f /tmp/abc.txt /backup/.


    Copy without prompting to overwrite


    cp -n * t


    scp


    scp command is used to copy files from one host to another host in secured manner.


    Copy files from local machine to remote machine


    Syntax


    scp filename remote_user@remote_host:/some/remote_diectory


    Example


    $ scp /home/ana/atom.txt adams@server1/home/adams/.


    Copy files from remote host to local host


    Syntax


    scp remote_user@remote.host:/path/filename .


    Example


    $ scp adams@server1/home/adams/tasks.txt /home/ana/.


    ls


    Lists the names of Files


    Syntax


    ls -<options>


    Example


    $ ls -al To list directories and files


    cat


    Displays a Text File


    Syntax


    cat filename


    Example


    $ cat abc.conf


    rm


    Deletes a file, files or directory


    Syntax


    rm filename


    Example


    rm abc.conf


    To delete abc directory recursively'
