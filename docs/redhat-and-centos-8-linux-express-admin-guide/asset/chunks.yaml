    all logs.


    Rotating logs with logrotate


    Logs needs rotation to avoid filling of file systems and make log more manageable.
    Once log file is rotated, it will be renamed with new file name. After certain
    time of rotation, older log files are deleted to save space.


    logrotate package manages automatic rotation of log files according to configuration
    in /etc/logrotate.conf or otherwise specified with command option


    Install


