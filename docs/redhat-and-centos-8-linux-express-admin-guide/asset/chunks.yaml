    \ system size is 1024 TiB in earlier version it was 500 TiB\n\n*   nftables replaces\
    \ iptables as the default network filtering framework\n\n*   Python 3.6 is the\
    \ default Python version\n\n*   PHP 7.2\n\n*   RHEL 8 provides Node.js 10. Previously\
    \ Node.js was available only as Software Collection.\n\n*   Apache HTTP Server\
    \ 2.4.37 with better security and performance.\n\n*   GCC Version 8.2\n\n*   The\
    \ LUKS version 2 (LUKS2) format replaces the legacy LUKS (LUKS1) format for encrypting\
    \ volumes\n\n*   Nginx 1.14 is available in core repository\n\n*   Varnish Cache\n\
    \nChapter 3.              \n\n# Minimum system requirement\n\nFollowing are minimum\
    \ requirement to install RHEL. However, it is ideal to have more resources than\
    \ this for optimum performance of your machine\n\nProcessor 1GHz or faster\n\n\
    System memory (RAM) 2GB\n\nHard disk 20GB\n\nGraphical installation of RHEL requires\
    \ a minimum screen resolution of 800x600\\. If you have device with lower resolution\
    \ you should do VNC installation.\n\nChapter 4.              \n\n# Installation\n\
    \nIn this chapter we will covers installation of Redhat Enterprise Linux version\
    \ 8\\. The installation of RHEL is very easy and straightforward. This chapter\
    \ is designed in such way even if you do not have prior knowledge of Linux you\
    \ can install RHEL easily as whole installation is explained step by step with\
    \ screenshots.\n\nThe summary of steps involved in installation RHEL are following:\n\
    \n1.  Download Media Image\n\nYou can download installation image from customer\
    \ portal of Red hat   [https://access.redhat.com/downloads](https://access.redhat.com/downloads)\
    \ , using your username and password. If you don’t have username and password,\
    \ Red hat allows you to have evaluation version.  For Centos download the image\
    \ from centos site \n\n2.  Verify image\n\nOnce you finish downloading of installation\
    \ image, it is good practice to verify the integrity of the downloaded image.\n\
    \n3.  Write image to media\n\nNow write the image to required media. As this image \
    \ will not fit in DVD you require Double layer DVD or you can use USB Drive.\n\
    \n4.  Select way, how you want install it. There are two common ways to install:-\n\
    \n    1.  Interactive\n\nInteractive method is normal installation method, which\
    \ can be either Text based or GUI. This method of installation requires user interaction\
    \ for inputs during installation.\n\n2.  Automated using Kickstart\n\nFor Kickstart\
    \ installation, we have to create a single file containing answers to all the\
    \ questions RHEL installation normally asks during interactive installation. Once\
    \ the installation starts, no user intervention is required.\n\n5.  Verify the\
    \ installation .\n\nInteractive installation\n\nIn this section we will go through\
    \ normal interactive installation of Redhat if you are installing Centos the steps\
    \ are same: -   .\n\nDownload Media Image\n\nFirst thing first, for installation\
    \ we require media. For media preparation, you have to download the installation\
    \ ISO image. Open the internet explorer on your MS windows machine. Open the site\
    \ of Redhat customer portal or [https://access.redhat.com/downloads](https://access.redhat.com/downloads)\
    \ .  \n\nSelect Red Hat Enterprise Linux 8 from the list and provide your credentials.\
    \ If you do not have redhat account you can request evaluation copy. After successful\
    \ login you will get list of downloads select Red Hat Enterprise Linux 8.0 Binary\
    \ DVD and press Download Now\n\n![](Image00000.jpg)\n\nOnce file has been downloaded,\
    \ check the integrity of file. If you have downloaded file on MS Windows 10 computer,\
    \ go to the folder in which you had downloaded the file. Press shift key and press\
    \ left button of mouse.\n\nIt will open menu, press Open PowerShell window here\n\
    \n  ![](Image00001.jpg)\n\nOn the shell prompt give command\n\nGet-FileHash -Path\
    \ .\\rhel-8.0-x86_64-dvd.iso -Algorithm SHA256\n\n![](Image00002.jpg)\n\nIt will\
    \ show hash value, match this value with value given on the download page of the\n\
    \n![](Image00003.jpg)\n\nWrite image to media\n\nAfter verification of image,\
    \ you can write the ISO file to DVD. If DVD Drive in your computer is not working\
    \ or not present you can write this image to USB flash drive. The procedure to\
    \ write image to USB flash drive is given bellow:-\n\nCreating USB Media on Windows\n\
    \n1.  Download Fedora media writer from\n\n[https://github.com/MartinBriza/MediaWriter/releases](https://github.com/MartinBriza/MediaWriter/releases)\n\
    \n![](Image00004.jpg)\n\n2.  Double click the downloaded file to install it and\
    \ follow the Wizard.\n\n3.  Once installation is finished run Fedora Media Writer\
    \ from start menu.\n\n4.  In the main window click Custom image and select the\
    \ downloaded RedHat enterprise Linux ISO Image .\n\n5.  From the drop down menu\
    \ select the drive you want to use\n\n6.  Click Write to disk . This will start\
    \ the media creation process.\n\n7.  Once the process finishes and complete message\
    \ appears, umount the USB device.\n\n8.  Now USB flash is ready for installation.\n\
    \nSteps to do installation\n\nBooting with Media\n\nOnce media is ready. Make\
    \ media as first boot device in the BOIS of computer. Check the manual of your\
    \ computer to change boot priority.\n\nOnce system boots, it will show Installation\
    \ menu.\n\nSelect Install RHEL Linux 8.0.0\n\n![](Image00005.gif)\n\nOn the language\
    \ menu Select the Language and press Continue\n\n![](Image00006.jpg)  \n\n![](Image00007.jpg)\
    \ This will bring Installation Summary Screen.\n\nSelect Date and time to modify\
    \ date time and time zone\n\n![](Image00008.jpg) .\n\n![](Image00009.jpg) If you\
    \ are using Network Time server for time synchronization you can configure it\
    \ here. To use network time, change the position of Network time button to on\
    \ position and press small gear button for network time server settings. Once\
    \ you enter the server settings press Done .\n\n![](Image00010.jpg)\n\n![](Image00011.jpg)\
    \ Click Software Selection from Installation summary screen and select required\
    \ Base environment . For demo purpose I have selected Server with GUI and press\
    \ Done .\n\nOn Installation Summary screen, select Installation Destination .\n\
    \n![](Image00012.jpg)\n\n![](Image00013.jpg) Either leave it to Automatic Configure\
    \ partitioning or you can select I will configure partitioning for manual partitioning.\n\
    \nIn case you select Manual partitioning, Although RedHat can works fine with\
    \ two partitions root and swap but it is ideal to have minimum three partitions.\
    \ These three partitions are boot , / (root) and swap . Boot should be at least\
    \ 1 GB, root should at least 20GB and swap partition should be equal to or more\
    \ than physical RAM in the system. You write the capacity in human readable format\
    \ like 10G for 10GB and 500M for 500MB.    \n\nNow Click Network and Host Name\
    \ for configuring network settings and hostname.\n\n![](Image00014.jpg)\n\n1.\
    \  In Host Name textbox write the hostname.\n\n2.  ![](Image00015.jpg) Select\
    \ the network card\n\n3.  Change Connected button to On position\n\n4.  Press\
    \ configure button.\n\nIt will bring network configuration screen.\n\n1.  Select\
    \ IPv4 setting tab\n\n2.  Select method as manual from drop down menu if you have\
    \ static IP address otherwise leave it Automatic.\n\n3.  In case of static IP\
    \ address, press Add button\n\n4.  Write down IP address, Netmask and gateway\n\
    \n5.  Add DNS server IP Address, if you have more than one DNS server you add\
    \ the IP Address separated with coma.\n\n6.  ![](Image00016.jpg) Select General\
    \ Tab\n\n7.  Select Automatically connect to this network when it is available.\
    \ Otherwise after next boot network will not be connected automatically . Press\
    \ Save to save setting\n\n![](Image00017.jpg)\n\n8.  Press Done.  \n\nPress Begin\
    \ installation . It will bring screen on which it will show progress of installation,\
    \ option to set root password and create one new users."
