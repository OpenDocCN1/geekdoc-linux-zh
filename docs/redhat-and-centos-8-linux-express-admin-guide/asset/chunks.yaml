  trans: "\n选择 Root 密码并提供 root 密码。点击 Done（完成）。\n\n![](img/Image00018.jpg)\n\n安装过程中，你需要创建一个普通用户。点击\
    \ `Create New user`（创建新用户）。提供用户的姓名、`username` 和密码并点击完成。如果你不想使用 root 用户进行管理，可以通过选择\
    \ `Make this user administrator`（将此用户设置为管理员）将该用户设置为管理员。\n\n![](img/Image00019.jpg)\n\
    \n安装完成后点击 `Reboot`（重启）。\n\n![](img/Image00020.jpg)\n\n重启后系统将显示许可界面并添加 RedHat 订阅详情。\n\
    \n![](img/Image00021.jpg)\n\n选择 `License information`（许可信息）\n\n![](img/Image00022.jpg)\n\
    \n在下一个页面选择 `I accept the license agreement`（我接受许可协议）并点击 `Done`（完成）\n\n现在点击 `Subscription\
    \ Manager`（订阅管理器）（这一步是可选的，你也可以以后进行）\n\n在下一个页面，如果你使用代理，请提供连接互联网的代理设置。点击 `Done`（完成）。\n\
    \n![](img/Image00023.jpg)\n\n在下一个页面提供你的 redhat 订阅登录名和密码并点击 `Done`（完成）。\n\n![](img/Image00024.jpg)\n\
    \n现在点击 `Finish Installation`（完成安装）。\n\n现在你已经完成了安装。是时候从远程机器连接新创建的服务器了，我们将在下一章讨论如何连接你的\
    \ Windows 机器。\n\n# 第 5 章 将你的 PC 连接到 RHEL 服务器\n\n在现实生活中，你偶尔会物理性地操作服务器，但通常你是从 PC\
    \ 连接并进行管理。你的 PC 上可能运行着 MS Windows 10。连接到 Linux 主机首先需要一个软件。有很多选项，如 `VanDyke`、`bitvise`\
    \ 和 `putty`。其中 `PuTTY` 是免费且最流行的选项。\n\n`PuTTY` 是一个 SSH 和 telnet 客户端，最初由 Simon Tatham\
    \ 为 Windows 开发。它是一个为远程 MS Windows 机器上的服务器提供文本终端访问的软件。要安装 `putty`，打开 Internet Explorer\
    \ 并从以下地址下载 `putty`：\n\n`http://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html`\n\
    \n下载好 `putty` 后，进行安装。\n\n当你运行 `putty` 时会看到以下屏幕。在此屏幕上：\n\n1. 填写新安装服务器的 IP 地址。\n\
    2. 选择协议为 `SSH`。\n3. 给会话（Session）命名，如 `RHEL1` 或 `linux1` 等。\n4. 点击 `Save`（保存）按钮。\n\
    \n![](img/Image00025.jpg)\n\n保存保存后，双击会话名称连接到 Linux 主机，或选择会话点击 `Load`（加载）然后点击 `Open`（打开）。\n\
    \n# 第 6 章 网络\n\n网络是两个或多个连接在一起的计算机组。网络允许不同机器之间进行互连。每台计算机都需要网卡来连接。每张网卡都有一个物理地址，称为\
    \ `Media Access Control address`（MAC 地址）。`MAC address` 工作在 OSI 模型的第 2 层。网卡制造商为网卡分配\
    \ MAC 地址。由于网卡可能会故障并需要更换，随着网卡的更换，`MAC address` 会改变。为了解决这个问题，我们为网卡分配 `IP address`，它工作在\
    \ OSI 模型的第 3 层。由于 `IP address` 仍然是数值，因此很难记忆，而且在动态 IP 的情况下，`IP address` 可能会更改。为了方便人类使用，我们使用\
    \ `hostname`（主机名），这无非计算机的名字。\n\n为了让你对 OSI 模型以及应用和设备及其对应层次有一个直观的概念，如下所示。\n\n###\
    \ OSI 七层与 TCP 映射\n\n| OSI 模型 | TCP 模型 | 应用 | 地址 | 设备 |\n| :--- | :--- | :--- |\
    \ :--- | :--- |\n| 7:应用层 | `ApplicationLayer` | `HTTP` / `Telnet` / `SSH` | 应用\
    \ `DNS`, `DHCP`, `ntp`, `HTTP` | |\n| 6:表示层 | `SSL` / `MIME` | | | |\n| 5:会话层\
    \ | `Sockets` 和 远程过程调用 (RPC)` | | | |\n| 4:传输层 | `Transportlayer` | `传输控制协议 (TCP)`\
    \ | `TCP/UDP` | 网关 |\n| 3:网络层 | `Internetlayer` | `IP 协议 (IP)` | `IP4`, `IP6`,\
    \ `IPX`, `ICMP` | 路由器, 防火墙 三层交换机 |\n| 2:数据链路层 | `Network AccessLayer` | `以太网`\
    \ / `帧中继` | `MAC address`, `ARP` | 桥器 二层交换机 |\n| 1:物理层 | `IEEE 802.x` | `以太网`\
    \ | 集器 | |\n\n## 检查网络配置的命令\n\n在新安装之后，检查网络配置是一个好主意。作为最佳实践，请记录此配置。\n\n### 显示 IP\
    \ 地址\n```\n# ip addr show\n```\n或\n```bash\n# ifconfig -a\n```\n\n### 显示链路状态\n\
    ```bash\n# ip link show\n```\n\n### 显示路由表\n```bash\n# ip route\n```\n或\n```bash\n\
    # netstat -rn\n```\n\n### 并修改主机名\n\n#### 显示主机名\n```bash\n# hostname\n```\n\n####\
    \ 修改主机名\n当你想更改主机名时，必须分步完成：\n\n1. 使用命令 `hostnamectl` 更改主机名。\n2. 接下来修改 `/etc/hosts`\
    \ 中的条。\n\n1. 输入 `hostnamectl` 命令状态来检查当前：\n```\n# hostnamectl status\n  Static\
    \ hostname: RHEL1\n       Icon name: computer\n          Chassis: n/a\n```\n\n\
    2. 修改主机名：\n```bash\n# hostnamectl set-hostname RHEL1\n```\n3. 下一步是修改 `/etc/hosts`：\n\
    ```bash\n# edit /etc/hosts\n```\n\n"
- fmt: "\n`NetworkManager` is a daemon which provides interface for easy configuration\
    \ and management of Network Connectivity. In the previous versions of `RHEL`,\
    \ Network configuration was handled using files. However, in RedHat 8 it is handled\
    \ by `network manager`. `Network manager` is a dynamic network configuration and\
    \ control daemon. It can manage network interface like `Wifi`, `Ethernet` and\
    \ mobile devices. `Network manager` can switch network automatically from wired\
    \ to WiFi incase wired network is unavailable and vice versa.\n\nIf you are coming\
    \ from older version of RedHat and use to use network scrirts like `ifup` and\
    \ `ifdown`, In RedHat 8 `ifup` and `ifdown` scripts has been deprecated, now it\
    \ is handled by `network manager`. The `ifcfg` configuration files which were\
    \ used traditionally, still supported in `RHEL` but not available by default.\n\
    \n## Network Manager configures\n\n1. IP address\n2. Static routes\n3. Network\
    \ aliases\n4. VPN configuration \n5. DNS information\n\n### Check the status of\
    \ networkmanager daemon\n```bash\nsystemctl status NetworkManager\n```\n\n###\
    \ Start Networkmanager if it is not working\n```bash\nsystemctl start NetworkManager\n\
    ```\n\n### Enable it to start automatically with system start (Most of the time\
    \ it is not required as networkmanager is configured to start automatically by\
    \ default ) \n```bash\nsystemctl enable NetworkManager\n```\n\n## Set up Static\
    \ IP Address using Graphical interface\n\nTo set static IP address following steps\
    \ are there:\n\n6. Login as root\n7. Click network manager icon and select Wired\
    \ settings\n![](Image00027.jpg)\n8. ![](Image00028.jpg) ![](Image00029.jpg) Click\
    \ setting icon, small gear\n9. ![](Image00030.jpg) Select IPv4 tab settings\n\
    1. Select `Manual` from IPv4 Method.\n2. Provide IP address, `Netmask` and `Gateway`.\n\
    3. Write DNS server IP address. If you have more than one DNS provide all IP addresses\
    \ separated by commas.\n4. Press `Apply`.\n\n## Network Configuration using text\
    \ based interfac e nmtui\n\n`Nmtui` is text based interface tool for configuring\
    \ networking. If you do not have GUI installed on your system, this tool is very\
    \ helpful specially if you are administrating system remotely. This tool is installed\
    \ by default with `RHEL` server installation. In case it is not there you can\
    \ install it.\n\n```bash\nyum install NetworkManager-tui\n```\n\n### To start\
    \ nmtui\n```bash\nnmtui\n```\n\n## Commands\n\n### Edit the connection setting\n\
    Syntax\n```bash\nnmtui edit connection_name\n```\nExample\n```bash\nnmtui edit\
    \ ens33\n```\n\n### Connect the disconnected connection\nSyntax\n```bash\nnmtui\
    \ connect connection_name\n```\nExample\n```bash\nnmtui connect ens33\n```\n\n\
    ### Change hostname using nmtui\nSyntax\n```bash\nnmtui hostname new_hostname\n\
    ```\nExample\n```bash\nnmtui hostname RHEL2\n```\n\n### Navigate NMTUI\nAs `nmtui`\
    \ is a text based user interface you have to use keyboard for navigation. To move\
    \ the cursor to next field press `TAB` key, use `SHIFT + TAB` to move backward\
    \ . Use `SPACE` bar key for drop down menu.\n\n## Modifying IP address using NMTUI\n\
    \nStart `nmtui`\n```bash\nnmtui\n```\n1. Select `Edit a connection`\n2. ![](Image00031.jpg)\
    \ Select the connection profile from the list and press `Edit` \n![](Image00032.jpg)\n\
    3. From the next screen press `SPACEBAR` key on the IPv4 configuration to get\
    \ popup menu.\n    1. Select `Manual` to set static IP address.\n    2. Press\
    \ `TAB` key to move to `Address` field and provide IP Address with `Netmask`.\n\
    \    3. Press `TAB` key to move to `Gateway` column and provide `Gateway`.\n \
    \   4. Press `TAB` for `DNS Servers`. Press `SPACE` key to add DNS server. You\
    \ can add more than one DNS server.\n    5. Make sure `Automatically connect`\
    \ is selected.\n    6. ![](Image00033.jpg) Press `OK`\n7. Press `ESC` key to come\
    \ out from `NMTUI`\n\n## Modifying network configuration using configuration files\n\
    \nIf you are old school guy like me, who enjoy in working with configuration files\
    \ instead of GUI. Although in `RHEL8` configuration files has been deprecated\
    \ you can still use configuration files to control networking. In this example,\
    \ I will explain how to change IP address of host using configuration files.\n\
    \n### Changing IP address using configuration files\n\n1. Check current setting\n\
    ```bash\nip addr show\n```\n2. Check current devices\n```bash\n[root@RHEL2]# nmcli\
    \ d\nDEVICE  TYPE      STATE      CONNECTION\nens33  ethernet connected  ens160\n\
    lo      loopback  unmanaged  --\n```\n3. Edit `/etc/sysconfig/network-scripts/ifcfg-*`.\
    \ Where `ifcfg-*` file is device file you just checked in last command. The command\
    \ output shows `ens160` as device name then the file name will be `ifcfg-ens160`.\n\
    ```bash\nvi /etc/sysconfig/network-scripts/ifcfg-ens160\n```\n4. Change `/etc/sysconfig/network-scripts/ifcfg-ens160`\
    \ file depending on whether you have static IP address or you are using DHCP.\n\
    \n| Static | DHCP |\n| :--- | :--- |\n| `DEVICE=ens160BOOTPROTO=staticIPADDR =192.168.0.132NETMASK=255.255.255.0GATEWAY=192.168.0.1ONBOOT=yes`\
    \ | `DEVICE=ens160BOOTPROTO=dhcp` |\n\n5. Restart network connection to change\
    \ IP address without rebooting. For that we will switch off and on. Unlike the\
    \ previous version of `RedHat` where you use to restart the network services,\
    \ in current version it is `networkManager` to start automatically.\n```bash\n\
    nmcli down ens160\nnmcli up ens160\n```\n\n### Network Scripts\nAs mentioned the\
    \ support for network scripts is deprecated in `Red Hat 8`. `RHEL 8` calls `NetworkManager`.\
    \ If you require any of these scripts, you can still install them in the system\
    \ with the following command:\n```bash\nyum install network-scripts\n```\n\n###\
    \ Changing DNS server using configuration file\nEdit `/etc/resolv.conf` and add\
    \ `search` for DNS:\n```text\nsearch example.com // give own FQDN\nnameserver\
    \ 8.8.8.8 // IPaddress of first DNS\nnameserver 8.8.4.4 // IPaddress of Second\
    \ DNS\n```\n\n## NMCLI\n`NetworkManager Command Line Interface` is command line\
    \ utility for controlling `NetworkManager`. It is also used for reporting status\
    \ of network. The main use of this utility is in Servers, Headless machines, terminals\
    \ and by power users who prefer to use command line. `NMCLI` is ideal tool used\
    \ in scripts. Few examples of the `nmcli` are below:\n\nDisplay the overall status\
    \ of `NetworkManager`:\n```bash\nnmcli general status\n```\nDisplay all connections\n\
    ```bash\nnmcli connection show -a\n```\nDisplay only active connections\n```bash\n\
    nmcli connection show -active\n```\nDisplay a list of devices recognized by `NetworkManager`\
    \ and their current state:\n```bash\nnmcli device status\n```\nBring down Ethernet\
    \ interface\nSyntax\n```bash\nnmcli connection down interface_name\n```\nExample\n\
    ```bash\nnmcli connection down ens160\n```\nBring up Ethernet interface\nSyntax\n\
    ```bash\nnmcli connection up interface_name\n```\nExample\n```bash\nnmcli connection\
    \ up ens160\n```\nChange IP address using `nmcli`\nSyntax\n```bash\nnmcli connection\
    \ modify interface_name IPv4.address <ipaddr>/netmask\n```\nExample\n```bash\n\
    nmcli connection modify ens160 IPv4.address 192.168.239.141/24\n\n\n## Network\
    \ Commands\n\n| Task | Command |\n| :--- | :--- |\n| Check connectivity between\
    \ two systems | `ping IP_address of other system Example ping 10.1.1.2` |\n| Check\
    \ IP address configuration | `ifconfig -a` or `ip addr show` |\n| Check configuration\
    \ of network card | `cat /etc/sysconfig/network-scripts/ifcfg-*` |\n| Check routing\
    \ table | `ip route show` |\n| Querying DNS | `dig` |\n| Local file to resolve\
    \ hosts to IP address | `/etc/hosts` |\n| DNS server configuration file | `/etc/resolv.conf`\
    \ |\n\nChapter 7.\n\n# Users Management\n"
