    # Firewall


    According to dictionary, a firewall is a wall or partition designed to inhibit
    or prevent the spread of fire. In computer world, firewall is network security
    system used to secure the incoming and outgoing connections. It prevents unauthorized
    access to the system. It restricts user to access only designated services.


    nftables


    In earlier version of Redhat iptables were used for packet filtering, but in with
    Redhat 8 it has been replaced with nftables. it is single tool for all iptable
    framework like iptables, ip6tables, arptables etc. It allows you to perform packet
    filtering (firewalling), NAT, mangling and packet classification.  Now you can
    build firewall over nftables. nftables by default does not pre-create tables and
    chains like its predecessor, iptables, which results in increase in system performance.


    Check if system is using nftables


    # iptables --version


    iptables v1.8.2 ( nf_tables )


    Firewalld


    Firewalld is the dynamic firewall manager. Changes can be done immediately in
    the runtime environment. No restart of the service is needed. firewalld use nft
    binary to interacts with nftables. It is an interface and connects to the netfilter
    kernel code. FirewallD uses services and zones. firewalld stores its rules in
    various XML files under /usr/lib/firewalld/ and /etc/firewalld/ folders. Firewalld
    allows security configuration without stopping current configuration. In earlier
    version with iptables every change requires flushing of all old rules and reading
    new rules from iptable configuration file, but in firewalld only new differences
    are applied without disturbing current connections.


    A command-line client firewall-cmd , is provided. It can be used to make permanent
    and runtime changes to firewall rules. You require to be root or with administrative
    privileges to run firewalld-cmd command


    Install firewalld


    # yum install firewalld


    Check the status


    # systemctl status firewalld


    or


    # firewall-cmd --state


    running


    Firewalld concepts


    Configuration options


    Rules of firewalld can be designated as either Permanent or Runtime. Runtime changes
    are those changes to firewall settings that take effect immediately but are not
    permanently. Runtime changes will not retain after reboot of system or configuration
    reload. Whereas permanent changes are those changes which are written into configuration
    files but will not be applied immediately unless you reload the configuration
    or reboot the machine.


    Zones


    In firewalld concept of zone is based on network interface. All network interfaces
    can be located in the same default zone or divided into different zones according
    to the levels of trust defined. By defualt public zone is used for configuration.
    If you have more than one interface than you can create more zones and restrict
    trafic between zones. Lets take example if we have  web server having two interface
    one connecting to outside world i.e. public zone and second interface in trusted 
    zone that connects to database server.


    Note : Without any configuration, everything is done by default in the public
    zone.


    List of zones with explanation


    *   Drop


    Drop all incoming connections, only outgoing network connections are available.


    *   Block


    Allows only outgoing network connection. Reject all incoming connection with icmp-host-prohibited
    message.


    *   Public


    You do not trust the other computers on the network. Only selected incoming connections
    are accepted. For use in public areas.


    *   Home


    Only selected incoming connections are accepted. For use in home area


    *   Work


    You mostly trust the other computers on networks. Only selected incoming connections
    are accepted. For use in work areas.


    *   DMZ


    For the computers in DMZ demilitarized zone that are publicly accessible with
    limited access to the internal network, only selected incoming connections are
    accepted.


    *   External


    For use on external networks with masquerading enabled. Only selected incoming
    connections are accepted.


    *   Internal


    For use on internal networks. You mostly trust the other computers on the networks.
    Only selected incoming connections are accepted.


    *   Trusted


    All network connections are accepted.


    Zones commands


    List the available zones


    # firewall-cmd --get-zones


    To display default zone


    # firewall-cmd --get-default-zone


    Change the default zone


    # firewall-cmd --set-default-zone= internal


    Check the zone to which interface is associated with


    # firewall-cmd --get-zone-of-interface=ens33'
