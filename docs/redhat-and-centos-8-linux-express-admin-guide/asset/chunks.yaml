    # Web server


    In this online world almost all information is no the web, this information can
    be accessed by means of various websites. To run these website requires a server
    known as webserver. A webserver is program, which allows web browser clients to
    access website pages. It uses HTTP (Hypertext Transfer Protocol). In RHEL 8 Apache
    HTTP server can be used as Web Server.


    Deploying http server


    Installation of Apache web server includes following steps


    1.  Installation


    2.  Start service


    3.  Enable the service to start at boot time


    4.  Firewall configuration


    5.  Test


    Install http server


    # yum install httpd


    Start service


    # systemctl start httpd


    Enable the service to start on boot


    # systemctl enable httpd


    Open firewall port and reload its configuration


    # firewall-cmd --permanent --add-service=http


    # firewall-cmd --reload


    Default directory where http keeps contents


    /var/www/html


    Configuration file


    /etc/httpd/conf/httpd.conf


    Directory for additional configuration files that are included in the main configuration
    file.


    /etc/httpd/conf.d/


    Verifying Configuration


    After changing configuration, verify it before using:-


    # apachectl configtest


    If you change the configuration files, you have to restart/reload the service,
    for that refer the Restarting service section.


    Test


    1.  Create file in directory /var/www/html/index.html and Write Hello


    2.  Save the file and exit


    3.  Open the Firefox and on the address bar write [http://localhost](http://localhost)


    4.  You should see hello


    Stop the Service


    To stop running httpd service


    # systemctl stop httpd


    To prevent http service from starting automatically at boot time


    # systemctl disable httpd


    Restarting service


    There are three ways to restart the service httpd


    1.  Complete restart using systemctl command


    # systemctl restart httpd


    2.  Reload only configuration, in case you have changed the configuration. In
    this case, all request during reload will be denied including active requests
    also.


    # systemctl reload httpd


    3.  To reload configuration without affecting active requests. If the daemon is
    not running, it is started.


    # apachectl gracefull


    Verifying the service


    To verify the service if it is active


    # systemctl is-active httpd


    Virtual Hosts


    The Apache HTTP Server offers option to create multiple websites on single webserver
    using virtual hosts. Based on host name, IP address or port number, virtual hosts
    allow same webserver to provide different information. You can host multiple websites
    on a single machine with a single IP using virtual hosting. Virtual hosting is
    suitable for shared web hosting environments, where multiple websites are hosted
    on a single server.


    Steps to host multiple sites on single server using virtual hosting:-


    1.  Create the directory structure


    2.  Create test web pages for each host


    3.  Set ownership and permissions


    4.  Change SELinux context of files


    5.  Configure your virtual host directories


    6.  Change the Apache configuration file


    7.  Create virtual host configuration files


    8.  Verify the configuration files and restart the httpd service


    9.  Create DNS record in /etc/hosts file or in the DNS server


    10.  Test the virtual hosts


    Steps in detail


    In this example, we will host two websites abc_example.com and xyz_example.com.


    1.  Create Directory Structure


    First, create directory for each website to hold html files. This directory is
    known as document root for each website


    # mkdir -p /var/www/html/abc_example.com


    # mkdir -p /var/www/html/xyz_example.com


    2.  Create test web pages for each host


    # vi /var/www/html/abc_example.com/index.html


    Add following content


    Abc_example.com


    Save the file and exit from vi


    Same way


    # vi /var/www/html/xyz_example.com/index.html


    Add following content


    Xyz_example.com


    Save the file and exit from vi


