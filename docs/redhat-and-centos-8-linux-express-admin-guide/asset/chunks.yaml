    Chapter 18.              


    # File system


    File System is method used by operating system to store and retrieve data. File
    system helps in managing and arranging data. There are different types of file
    systems available in Linux. Each type of file system uses different structure
    and logic for storing and retrieving data. Some file systems have been specifically
    designed for specific devices and applications, for example ISO 9660 file system
    is used for optical disks like CDROM. Depending of file system type it can be
    local or over network. Linux support wide variety of file systems each file system
    has pros and cons. We will discuss some of the common filesystems used in RHEL.
    In RHEL 8 BTRFS file system has been removed. This means you will not be able
    to create, mount or install Btrfs file system on RHEL 8 machine.


    XFS


    XFS is a high-performance journaling file system that was initially created by
    Silicon Graphics, Inc. for the IRIX operating system and later ported to Linux.
    XFS supports metadata journaling, which facilitates quicker crash recovery. The
    XFS file system can also be defragmented and enlarged while mounted and active.
    XFS records file system updates asynchronously to a circular buffer (the journal)
    before it can commit the actual data updates to disk. XFS is default File system
    for RHEL 8\. New features copy-on-write data extents has been added to XFS. This
    feature allows two or more files to share a common set of data blocks. When there
    is change on either of the files sharing common blocks, XFS breaks the link to
    common blocks and creates a new file. This helps in saving space and disk writes. 


    Creating XFS file system


    1.  Create partition using fdisk as described in the earlier chapter


    2.  fdisk -l check the required device name


    3.  mkfs -t xfs /dev/sdb1 where sdb1 is device name and xfs is file system type.


    ~]# mkfs -t xfs /dev/sdb1


    4.  create mount point


    ~]# mkdir /test1


    5.  Add entry in the /etc/fstab


    ~]# vi /etc/fstab


    /dev/mapper/cl-root /    xfs     defaults       1 1


    UUID=6b761a5f-8c7c-465d-b58c-d29267938403 /boot  xfs defaults        1 2


    /dev/mapper/cl-swap swap swap    defaults        0 0


    /dev/sdb1       /test1          xfs     defaults        0 2


    Where /dev/sdb1 is device   /test1 mount point, xfs for partition type, 0 for
    dump and 2 order for fsck.


    EXT File System


    Extended file system (EXT) is most popular file system used in Linux Operating
    systems. In its lifespan it had evolved a lot from its first implementation in
    1992 to till date. EXT 4 is the most recent version of EXT. From third generation
    i.e. EXT 3 it came up with journalized file system. With JFS feature it keep the
    track of changes not yet committed to the file system by recording such changes
    in data structure to journal which in turn generate circular log. In case of abrupt
    system down like power failure, crashed file system can be brought back online
    easily. EXT3 having limitation of file system size as 8TB /16TB and file size
    as 2 TB whereas Ext4 is the next generation of ext file system having improved
    file system and file size upper limits of 16TB. It is efficient reliable and robust.
    In RHEL 8 ext4 metadata is protected by checksums. This enables the file system
    to identify the corrupt metadata, this results increase in the file system resilience.


    Creating EXT4 file system


    1.  Create partition with fdisk


    2.  fdisk -l  check the device name


    3.  mkfs -t ext4 /dev/sdb1 where sdb1 is device name and ext4  is file system
    type


    Syntax


    mkfs –t ext4 device_name


    Example


    ~]# mkfs -t ext4 /dev/sdb1


    Or


    ~]# mkfs.ext4 /dev/sdb1


    4.  create mount point


    ~]# mkdir /test1


    5.  Mount new File system


    ~]# mount -t ext4 /dev/sdb1 /test1


    6.  Add entry in the /etc/fstab


    ~]# vi /etc/fstab


    /dev/mapper/cl-root /    xfs     defaults       1 1


    UUID=6b761a5f-8c7c-465d-b58c-d29267938403 /boot  xfs defaults        1 2


    /dev/mapper/cl-swap swap swap    defaults        0 0


    /dev/sdb1       /test1          ext4     defaults        0 2


    Chapter 19.              


    # Swap space


    Swap space is used in Linux and UNIX to free up physical memory. The inactive
    pages of data are written to slower storage i.e. hard disk. The area where inactive
    data is written is called as swap space.


    Add swap space   


