    becomes almost impossible to use these logs. To filter the logs, we use /etc/rsyslog.conf
    file. It has two parameter facility and priority separated with dot ( . ). Facility
    is name of process for which you want to log and priority specify level of log
    like debug, info, notice, warning, err, crit, alert, emerg or * for all type of
    messages you want to keep.


    Example


