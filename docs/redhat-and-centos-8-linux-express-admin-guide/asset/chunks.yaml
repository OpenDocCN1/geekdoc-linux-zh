    ## 软件管理


    每个 Linux 发行版都有一组在安装时自动安装的包。作为一个组织，你可能根据需要需要更多的软件，例如，你可能将此服务器用作 Web 服务器，因此需要 `Apache`
    或或其他 HTTP 服务器。为了安装额外的软件，你需要包。包是将所有可执行文件和数据文件封装成的单个文件。目前有两种类型的包可用：


    ### 1. 源码包


    与一个程序相关的文件包，包括源代码、配置文件和文档。


    ### 2. 二进制包


    二进制包是预编译的二进制文件及其元数据文件的包。


    ## 包的发行格式


    如前所述，包有两种类型，因此以二进制或源码格式分发。主要的包发行系统有：-


    ### Redhat 包管理器 (RPM)


    顾如名，这种格式由 Redhat 引入。这种格式不仅被 `RHEL` 和 `Fedora` 等基于 Redhat 的发行版使用，还被 `SUSE` 和 `Mandriva`
    等许多其他发行版采用。`RPM` 包使用扩展名为 `.rpm` 文件。


    ### Debian 包管理器


    该包发行系统由 Debian 引入。主要用于 Debian 以及基于 Debian 的发行版，如 `Ubuntu`、`Linux Mint` 和 `PureOS`。它使用扩展名为
    `.deb` 文件。


    ## 源码包


    源码包可以以两种格式分发：


    ### 1.1 Tar 包文件 (Tarball)


    Tar 包分发是传统的包发行类型。这类包可以从任何第三方软件提供者获取，并需要 `make` 工具进行编译。


    ### 1.2 SRPM


    基于 Redhat 的发行版提供仓库，你可以在那里下载可用二进制文件的源码，我们称这些文件为 `SRPMS` 或源码 RPM。`SRPMs` 是仅包含源代码和
    `rpm` spec 文件的 `rpm` 包，这些 spec 文件可以使用 `rpm` 安装，然后可以手动编译或修改。


    ## 包元数据


    `RHEL` 使用 `.rpm` 包通过 `rpm` 命令安装软件。`RPM` 包只是一个包含某些文件和关于这些文件信息的文件。从技术上说，`RPM` 是一个包含
    `cpio` 归包及其自身元数据的文件。`RPM` Header 包含元数据，这些元数据用于确定关于包的以下内容：-


    * 包的描述。

    * 包中的文件列表。

    * 包的版本和发布版本。

    * 制作时间和及制作者。

    * 支持的架构。

    * 包中所含文件的校验和。

    * 依赖关系。

    * 等。


