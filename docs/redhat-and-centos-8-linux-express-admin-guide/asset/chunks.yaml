    ## 5. 使用以下内容创建 `.rep` 仓库配置文件。如果你是从旧版本的 RedHat 迁移过来的，在 RedHat 8 版本中发生了变化，现在你必须定义两个仓库而不是一个，即
    `BaseOS` 和 `Appstream`。


    ```bash

    vi /etc/yum.repos.d/rhiso.repo

    ```


    ```ini

    [InstallMedia-BaseOS]

    name=Red Hat Enterprise Linux 8 - BaseOS

    metadata_expire=-1

    gpgcheck=1

    enabled=1

    baseurl=file:///rhcd/BaseOS/

    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release


    [InstallMedia-AppStream]

    name=Red Hat Enterprise Linux 8 - AppStream

    metadata_expire=-1

    gpgcheck=1

    enabled=1

    baseurl=file:///rhcd/AppStream/

    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release

    ```


    清理 yum 缓存


    ```bash

    yum clean all

    ```


    现在列出仓库


    ```bash

    yum repolist

    ```


    ## 自定义自定义仓库


    在某些情况下，你需要创建自己的仓库。例如，你开发了一个软件并将其转换为 rpm 格式进行分发，或者你下载了一组软件并想通过仓库进行分发。为 RPM 软件包创建自己的自定义仓库的步骤如下：


    1. 为你的自定义仓库创建目录。

    ```bash

    mkdir /myrepo

    ```


    2. 将文件传输/下载到此目录


    3. 使用 `createrepo` 创建 `repodata`。如果没有 `createrepo` 命令，请先安装 `createrepo` 命令。`createrepo`
    由 `createrepo_c` 包提供。


    ```bash

    yum -y install createrepo_c

    createrepo /myrepo

    ```


    4. 创建配置文件


    `/etc/yum.repos.d/mycustom.repo`


    以下是自定义仓库文件的示例：


    ```ini

    [mycustomrepo]

    name=Custom Repository

    baseurl=file:///myrepo/

    enabled=1

    gpgcheck=0

    ```


    ## 第 9 章. 管理服务


    系统启动时，它会启动和停止某些服务以达到系统所需的状态。假设你想以 GUI 模式启动系统，系统必须启动所有与桌面环境相关的服务。同样，如果你将服务器配置为
    Web 服务器，你必须在启动过程中启动 Web 服务。即使是执行其基本任务，它也需要许多运行的服务，如网络、日期和时间等。在旧版本的 Redhat enterprise
    Linux 中，`SysV` 是默认的服务管理器。`SysV` 通常在启动时逐个地启动服务，这意味着下一个服务将在上一个服务启动完成后开始启动。在 RHEL
    7 版本中，引入了 `Systemd`。


    ### systemd 简介


    `Systemd` 是 RHEL 8 的系统和服务运行管理器。它与 `SysV` init 脚本具有有限的向后兼容性。它提供了许多新功能，如：


    - 启动时并行启动系统服务

    - 按需激活设备

    - 基于依赖的服务控制逻辑

    - 基于路径的激活：当特定文件或目录的状态发生变化时，按需激活服务

    - 基于设备的激活（如 USB）

    - 较早的 BOOT 日志


    在 `systemd` 之前，旧版本的 RHEL 使用位于 `/etc/rc.d/init.d/` 目录下的 `SysV` 脚本来控制系统状态。使用 `Systemd`
    后这些这些 脚本被服务单元（service units）取代，服务单元位于 `/etc/systemd/system/` 目录中。服务单元以 `.service`
    文件扩展结尾。`systemctl` 命令用于查看、启动、停止、重启、启用或禁用系统服务。如果你是从 Redhat 6 或更早版本过来的，以前有多个命令用于服务管理，例如用于服务状态管理的
    `service` 命令和用于服务启动管理的 `chkconfig` 命令。在 `Systemd` 中，它被单一命令 `systemctl` 代替。现在 `systemctl`
    命令可以同时处理服务管理及其启动时的启动。


    ### Systemd 单元文件位置


    | 详情 | 命令 |

    | :--- | :--- |

    | `/usr/lib/systemd/system/` | Systemd 单元文件最初安装在这里。 |

    | `/run/systemd/system/` | 在运行时会创建 Systemd 单元文件。此目录的优先级高于已安装的服务单元文件的目录。 |

    | `/etc/systemd/system/` | 当你启用服务时，会在这里创建 Systemd 单元文件，并为扩展服务而添加单元文件。此目录的优先级高于运行时单元文件的目录。
    |


    ### 服务状态管理


    | 详情 | 命令 |

    | :--- | :--- |

    | 启动服务 | `systemctl start name.service` (示例 `systemctl start iscsi.service`) |

    | 停止服务 | `systemctl stop name.service` (示例 `systemctl stop iscsi.service`) |

    | 重启服务 | `systemctl restart name.service` (示例 `systemctl restart iscsi.service`)
    |

    | 仅在服务运行时重启服务。 | `systemctl try-restart name.service` (示例 `systemctl try-restart
    iscsi.service`) |

    | 重新加载配置 | `systemctl reload name.service` (示例 `systemctl reload iscsi.service`)
    |

    | 检查服务是否正在运行。 | `systemctl status name.service` (示例 `systemctl status iscsi.service`,
    `systemctl is-active iscsi.service`) |


