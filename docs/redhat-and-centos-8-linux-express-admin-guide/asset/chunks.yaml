    # Chapter 14


    ## Backup and Restore


    Backup of your computer data is always important to prevent data loss. Backup
    saves you in case of data loss. There can be many reasons for data loss like hard
    disk failure, OS failure, virus, malware or due to human error. Before taking
    actual backup you should try to answer three W’s : what, when and where.


    ### What


    In my experience as an administrator if you ask any user what part of data is
    important for backup, the simple answer will be whole data. As an administrator,
    you should understand it is ideal to take backup of whole system daily but practically,
    first you require huge device which can accommodate the whole data. Second taking
    backup also takes time. Suppose if you take full backup of server which is online,
    it may takes hours to finish. In this case, by the time you are on verge of finishing
    the backup half of the data has already changed. Therefore, data insistency arises.
    Best way to take consistent data backup is to stop the whole system and then take
    backup but if your backup window is large, then it is very difficult to get down
    time of production systems. The solution for this problem is to segregate the
    data in two or more parts. First part of data that is changing regularly. Second,
    the data that changes once a while. The best example of that is, in normal production
    environment you have software binary files that changes very rarely and data files
    which gets updated regularly. You can take backup of whole system monthly or quarterly
    and take backup of data files daily.


    ### Where


    Next question is where you want to keep backup. There two part of this question
    first part is device on which you want to take backup. It can be external hard
    disk, tape drive, DVD or even USB drive. The second part of question is the location
    where you want to physically keep the backup media. It can be stored at same location
    ( onsite ) or at remote location ( offsite ). The benefit of storing at same location
    is easy and quick availability in case of loss of data but when there is total
    loss of site in case of flood , hurricane or fire ,offsite backup is more useful.
    According to the best practices, you should follow 3-2-1 plan. In this, you keep
    three backup copies of your data two copies onsite and third copy offsite. If
    condition arises, in which you require backup copy to restore data you have two
    good copies of data onsite and in case of total disaster, remote copy is there.


    ### When


    Next question, when to take backup? It all depends on your business needs. Frequency
    of data backup depends on frequency of change and criticality of data. Next thing,
    which define backup time, is functionality of system. System used for server and
    system used as workstation can have different backup windows.


    ### Backup type


    Now you know the answer of three W’s, its time to understand backup more deeply.
    Backup is broadly of three types depending on how much backup you are taking.


    1. Full backup

    2. Differential backup

    3. Incremental backup


    #### Full backup


    As name suggest it is backup which contains all files. When you require to restore
    only one full backup is required.


    #### Differential backup


    A differential backup is cumulative backup of files, which have changed since
    last full backup. In case of restore only last full backup and last differential
    backup is required.


    #### Incremental backup


    Incremental backup backs up only the changed data since the last backup, whether
    it is a full or incremental backup. Suppose you had taken full backup on Sunday.
    On Monday, you will take incremental backup of changed files since Sunday. On
    Tuesday if you take incremental backup once again, it will backup only files that
    has changed since last incremental backup i.e. since Monday. However, if you take
    differential backup on Tuesday it will take backup of all files that have changed
    since full backup i.e. Sunday. To restore incremental backup, you require full
    backup and all incremental backups since last full backup.


    ## Backup tools for RHEL


    RHEL provides some basic tools to take backup. If you require advanced features,
    you can use proprietary tools which provides automated backup, backup over network,
    backup using own database etc.


    RHEL basic tools for full and partial backup are following:


    * `Tar`

    * `CPIO`

    * `dump` and `restore`


    ### Advanced utility for RHEL backup


    The Advanced Maryland Automatic Network Disk Archiver (`AMANDA`) client/ server
    based utility which uses `dump` or `tar` to take backup over network.


    ### Proprietary tools for backup


    Some of the corporate tools for backup which are more advanced and feature rich:


    * `IBM’s Tivoli Storage Manager`

    * `Veritas Netbackup`

    * `EMC NetWorker`

    * `HPE StoreOnce`


    ## RHEL backup tools explained


    ### Tar


    `Tar` is the most versatile tool in Unix and Linux to take backup. `tar` command
    can be used to create one archive file of multiple files. You can copy `tar` archive
    files to tape, DVD or USB drive as a backup. You can also create compressed file
    by adding options while creating achieve file.


    #### Create tar


    Syntax

    ```bash

    tar cvf name_of_archive_file files_or_directory_to_archive

    ```

    Where

    * `c`: create

    * `v`: verbose

    * `f`: file name types of achieve file


    Example

    ```bash

    # cd /var/log

    # tar cvf /backup/varlogs.tar *.log

    ```

    Output:

    ```

    boot.log

    vmware-vmsvc.log

    vmware-vmusr.log

    wpa_status.log

    ```


    #### Create compressed file


    You can also create compressed file by adding options while creating achieve file.


    #### Gzip format


    Syntax

    ```bash

    tar cvzf name_of_archive_file files_or_directory_to_archive

    ```

    Where

    * `c`: create

    * `v`: verbose

    * `z`: gzip

    * `f`: file name


    Example

    ```bash

    # tar cvzf /backup/varlogs.tar.gz *.log

    ```


    #### Bzip format


    Syntax

    ```bash

    tar cvfj name_of_archive_file files_or_directory_to_archive

    ```

    Where

    * `c`: create

    * `v`: verbose

    * `j`: bzip2

    * `f`: file name


    Example

    ```bash

    # tar cvfj /backup/varlogs.tar.bz2 *.log

    ```


    #### Extract


    To restore the files taken backup with `tar` command.


    Syntax

    ```bash

    tar xvf name_of_archive_file

    ```

    Where

    * `x`: extract

    * `v`: verbose

    * `f`: file name


    Gzip format

    ```bash

    tar xvf /backup/varlogs.tar

    ```


    Bzip format

    ```bash

    tar xvf /backup/varlogs.tar.bz2

    ```


    #### List


    Use `t` option to show content of archive file. Same command can be used to list
    the content of compressed files.


    Syntax

    ```bash

    tar tvf name_of_archive_file

    ```

    Example

    ```bash

    # tar tvf /backup/varlogs.tar

    # tar tvf /backup/varlogs.tar.bz2

    # tar tvf /backup/varlogs.gz

    ```


    ### CPIO


    `CPIO` utility copies files from and to achieve. It can be used to achieve and
    to copy files from one place to another.


    To archive all files in `/var/log` folder to backup:

    ```bash

    # cd /var/log

    # ls |cpio -ov > /backup/varlogs.cpio

    ```


    To extract files from CPIO:

    ```bash

    # mkdir newbackup

    # cd newbackup

    # cpio -idv < /backup/varlogs.cpio

    ```


    Creating archive from list of specific files:

    Example:

    ```bash

    # find /var -iname *.log -print|cpio -ov > /backup/varlog.cpio

    ```


    CPIO to create tar file:

    ```bash

    # ls|cpio -ovH tar -F abc.tar

    ```


    ### dump and restore


    #### xfsdump


    `xfsdump` utility is used to take backup of whole file system or files that has
    changed since last dump. Ideally, dump should be taken on the quiescent file system,
    so that files should not change during backup.


    Syntax

    ```bash

    xfsdump <options> target_device filessystem_tobe backed_up

    ```

    Example

    To take backup of whole root filesystem to device `st0`:

    ```bash

    # xfsdump -l 0 -f /dev/st0 /

    ```

    Where

    * `-l`: for dump level. There are ten dump levels from 0 to 9.

    * `0`: complete

    * `1`: increment from last backup

    * `2-9`: increment from last incremental backup

    * `-f`: for device name


    #### xfsrestore

    ```bash

    xfsrestore

    ```

