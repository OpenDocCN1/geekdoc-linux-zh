    \ files has been deprecated you can still use configuration files to control networking.\
    \ In this example, I will explain how to change IP address of host using configuration\
    \ files.\n\nChanging IP address using configuration files\n\n1.  Check current\
    \ setting\n\n# ip addr show\n\n2.  Check current devices\n\n[root@RHEL2]# nmcli\
    \ d\n\nDEVICE  TYPE      STATE      CONNECTION\n\nens33   ethernet  connected \
    \ ens160\n\nlo      loopback  unmanaged  --\n\n3.  Edit /etc/sysconfig/network-scripts/ifcfg-*.\
    \ Where ifcfg-* file is device file you just checked in last command. The command\
    \ output shows ens160 as device name then the file name  will be   ifcfg- ens160\n\
    \n# vi /etc/sysconfig/network-scripts/ifcfg-ens160\n\n4.  Change /etc/sysconfig/network-scripts/ifcfg-ens160\
    \ file depending on whether you have static IP address or you are using DHCP\n\
    \n| Static | DHCP |\n\n| DEVICE=ens160BOOTPROTO=staticIPADDR =192.168.0.132NETMASK=255.255.255.0GATEWAY=192.168.0.1ONBOOT=yes\
    \ | DEVICE=ens160BOOTPROTO=dhcp |\n\n5.  Restart network connection to change\
    \ IP address without rebooting. For that we will switch off and on the network\
    \ connection. Unlike the previous version of RedHat where you use to restart the\
    \ network services, in the current version it recommended the NetworkManager.service\
    \ daemon should always running. Instead you use nmcli command to bring connection\
    \ down and up. Moreover ifup and ifdown scripts has also been deprecated. If you\
    \ use these ifup and ifdown scripts in new version, it calls nmcli command.   \n\
    \n# nmcli con down ens160\n\n# nmcli con up ens160\n\nNetwork Scripts\n\nAs mentioned\
    \ the support for network scripts is deprecated in Red Hat Enterprise Linux 8\\\
    . In RHEL 8 even the ifup and ifdown scripts has been replaced with newer version\
    \ which call the NetworkManager service through the nmcli tool. By Default, that\
    \ custom commands in /sbin/ifup-loca l , ifdown-pre-loca l and ifdown-loca l scripts\
    \ are not executed.\n\nIf you really require any of these scripts, you can still\
    \ install deprecated network scripts in the system with the following command:\n\
    \n# yum install network-scripts\n\nChanging DNS server using configuration file\n\
    \nEdit /etc/resolv.conf and add the ebtries for DNS server\n\nsearch example.com\
    \ // give own FQDN\n\nnameserver 8.8.8.8 // IPaddress of first DNS\n\nnameserver\
    \ 8.8.4.4 // IPaddress of Second DNS\n\nNMCLI\n\nNetworkManager Command Line Interface\
    \ is command line utility for for controlling NetworkManager. It is also used\
    \ for reporting status of network. The main use of this utility is in Servers,\
    \ Headless machines, terminals and by power users who prefer to use command line.\
    \ NMCLI is ideal tool used in scripts . Few examples of the nmcli are given bellow\
    \ :-\n\nDisplay the overall status of NetworkManager.\n\n# nmcli general status\n\
    \nDisplay all connections\n\n# nmcli connection show -a\n\nDisplay only active\
    \ connections\n\n# nmcli connection show -active\n\nDisplay a list of devices\
    \ recognized by NetworkManager and their current state.\n\n# nmcli device status\n\
    \nBring down Ethernet interface\n\nSyntax\n\nnmcli connection down interface_name\n\
    \nExample\n\n# nmcli connection down ens160\n\nBring up Ethernet interface\n\n\
    Syntax\n\nnmcli connection up interface_nam e\n\nExample\n\n# nmcli connection\
    \ up ens160\n\nChange IP address using nmcli\n\nSyntax\n\nnmcli connection modify\
    \ interface_name  IPv4.address <ipaddr>/netmask\n\nExample\n\n# nmcli connection\
    \ modify ens160 IPv4.address 192.168.239.141/24\n\nImportant Network Commands\n\
    \n| Task | Command |\n\n| Check connectivity between two systems | ping IP_address\
    \ of other systemExampleping 10.1.1.2 |\n\n| Check IP address configuration |\
    \ ifconfig -aorip addr show |\n\n| Check configuration of network card | cat /etc/sysconfig/network-scripts/ifcfg-*\
    \ |\n\n| Check routing table | ip route show |\n\n| Querying DNS | dig |\n\n|\
    \ Local file to resolve hosts to IP address | /etc/hosts |\n\n| DNS server configuration\
    \ file | /etc/resolv.conf |\n\nChapter 7.              \n\n# Users Management"
