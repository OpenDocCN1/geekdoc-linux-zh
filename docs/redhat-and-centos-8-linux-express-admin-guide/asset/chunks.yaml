- fmt: "\n- `RHEL 8` divided in two main repositories `BaseOS` and `Application Stream`\
    \ (`AppStream`).\n- Higher memory support, up to `4PB` of physical memory.\n-\
    \ instead of the `Xorg` server `Wayland` is default display server.\n- `XFS` now\
    \ supports shared copy-on-write data extent functionality.\n- Maximum `XFS` file\
    \ system size is `1024 TiB`, in earlier version it was `500 TiB`.\n- `nftables`\
    \ replaces `iptables` as the default network filtering framework.\n- `Python 3.6`\
    \ is the default Python version.\n- `PHP 7.2`.\n- `RHEL 8` provides `Node.js 10`.\
    \ Previously `Node.js` was available only as Software Collection.\n- `Apache HTTP\
    \ Server 2.4.37` with better security and performance.\n- `GCC` Version `8.2`.\n\
    - The `LUKS` version 2 (`LUKS2`) format replaces the legacy `LUKS` (`LUKS1`) format\
    \ for encrypting volumes.\n- `Nginx 1.14` is available in core repository.\n-\
    \ `Varnish Cache`.\n\n# Chapter 3. Minimum system requirement\n\nFollowing are\
    \ minimum requirement to install `RHEL`. However, it is ideal to have more resources\
    \ than this for optimum performance of your machine.\n\n- Processor: `1GHz` or\
    \ faster\n- System memory (`RAM`): `2GB`\n- Hard disk: `20GB`\n\nGraphical installation\
    \ of `RHEL` requires a minimum screen resolution of `800x600`. If you have device\
    \ with lower resolution you should do `VNC` installation.\n\n# Chapter 4. Installation\n\
    \nIn this chapter we will covers installation of `Redhat Enterprise Linux` version\
    \ `8`. The installation of `RHEL` is very easy and straightforward. This chapter\
    \ is designed in such way even if you do not have prior knowledge of `Linux` you\
    \ can install `RHEL` easily as whole installation is explained step by step with\
    \ screenshots.\n\nThe summary of steps involved in installation `RHEL` are following:\n\
    \n1. **Download Media Image**\n   You can download installation image from customer\
    \ portal of Red hat `https://access.redhat.com/downloads`, using your username\
    \ and password. If you don’t have username and password, Red hat allows you to\
    \ have evaluation version. For Centos download the image from centos site.\n\n\
    2. **Verify image**\n   Once you finish downloading of installation image, it\
    \ is good practice to verify the integrity of the downloaded image.\n\n3. **Write\
    \ image to media**\n   Now write the image to required media. As this image will\
    \ not fit in `DVD` you require Double layer `DVD` or you can use `USB Drive`.\n\
    \n4. **Select way, how you want install it.** There are two common ways to install:\n\
    \   - **Interactive**: Interactive method is normal installation method, which\
    \ can be either `Text` based or `GUI`. This method of installation requires user\
    \ interaction for inputs during installation.\n   - **Automated using Kickstart**:\
    \ For `Kickstart` installation, we have to create a single file containing answers\
    \ to all the questions `RHEL` installation normally asks during interactive installation.\
    \ Once the installation starts, no user intervention is required.\n\n5. **Verify\
    \ the installation.**\n\n## Interactive installation\n\nIn this section we will\
    \ go through normal interactive installation of `Redhat` if you are installing\
    \ `Centos` the steps are same: -.\n\n### Download Media Image\n\nFirst thing first,\
    \ for installation we require media. For media preparation, you have to download\
    \ the installation ISO image. Open the internet explorer on your `MS windows`\
    \ machine. Open the site of Redhat customer portal or `https://access.redhat.com/downloads`.\n\
    \nSelect `Red Hat Enterprise Linux 8` from the list and provide your credentials.\
    \ If you do not have redhat account you can request evaluation copy. After successful\
    \ login you will get list of downloads select `Red Hat Enterprise Linux 8.0 Binary\
    \ DVD` and press Download Now.\n\n![](Image00000.jpg)\n\nOnce file has been downloaded,\
    \ check the integrity of file. If you have downloaded file on `MS Windows 10`\
    \ computer, go to the folder in which you had downloaded the file. Press `shift`\
    \ key and press left button of mouse.\n\nIt will open menu, press `Open PowerShell\
    \ window here`.\n\n![](Image00001.jpg)\n\nOn the shell prompt give command:\n\n\
    ```bash\nGet-FileHash -Path .\\rhel-8.0-x86_64-dvd.iso -Algorithm SHA256\n```\n\
    \n![](Image00002.jpg)\n\nIt will show hash value, match this value with value\
    \ given on the download page of the.\n\n![](Image00003.jpg)\n\n### Write image\
    \ to media\n\nAfter verification of image, you can write the ISO file to `DVD`.\
    \ If `DVD Drive` in your computer is not working or not present you can write\
    \ this image to `USB flash drive`. The procedure to write image to `USB flash\
    \ drive` is given bellow:\n\n#### Creating USB Media on Windows\n\n1. Download\
    \ `Fedora media writer` from `https://github.com/MartinBriza/MediaWriter/releases`.\n\
    \n![](Image00004.jpg)\n2. Double click the downloaded file to install it and follow\
    \ the `Wizard`.\n3. Once installation is finished run `Fedora Media Writer` from\
    \ start menu.\n4. In the main window click `Custom image` and select the downloaded\
    \ `RedHat enterprise Linux ISO Image`.\n5. From the drop down menu select the\
    \ drive you want to use.\n6. Click `Write to disk`. This will start the media\
    \ creation.\n7. Once the process finishes and complete message, ummount the `USB`\
    \ device.\n8. Now `USB flash` is ready.\n\n### Steps to installation\n\n#### Booting\
    \ with Media\n\nOnce media is ready. Make `USB` as first boot device. Once system\
    \ boots, it will show Installation menu. Install `RHEL Linux 8.0`.\n\n![](Image0005.jpg)\n\
    \nOn the language menu select `Language` and press Continue.\n\n![](Image00006.jpg)\n\
    \nThis will bring Installation Summary. Select `Date and time` to modify date\
    \ and time zone.\n\n![](Image00007.jpg)\n\nIf you are using `Network Time` for\
    \ time synchronization you can configure it. Change the `Network time` button\
    \ to on position and press small gear for network time settings. Once you enter\
    \ the server settings press `Done`.\n\n![](Image00008.jpg)\n\nClick `Software\
    \ Selection` from Installation screen and select `Base environment`. For demo\
    \ purpose I have selected `Server with GUI` and press `Done`.\n\n![](Image00009.jpg)\n\
    \nOn Installation Summary screen, select `Installation Destination`.\n\n![](Image00010.jpg)\n\
    \n![](Image00011.jpg)\n\nEither leave it to `Automatic Configure` or you can select\
    \ `I will configure partitioning` for manual partitioning. In case you select\
    \ `Manual partitioning`, Although `RedHat` can works fine with two partitions\
    \ root and swap but it is ideal to have three partitions. These three partitions\
    \ are `boot`, `/ (root)` and `swap`. `boot` should be at least `1 GB`, `root`\
    \ at least `20GB` and `swap` partition should be equal to or more than physical\
    \ `RAM` in the system. You write the capacity in human readable format like `10G`\
    \ for `10GB` and `500M` for `500MB`.\n\nNow Click `Network and Host Name` for\
    \ configuring network settings and hostname.\n\n![](Image00012.jpg)\n\n1. In `Host\
    \ Name` textbox write the hostname.\n2. ![](Image00013.jpg) Select the network\
    \ card\n3. Change `Connected` button to `On` position.\n4. Press `configure` button.\n\
    \nIt will bring network configuration screen.\n\n1. Select `IPv4 setting` tab.\n\
    2. Select `method` as `manual` from drop down menu if you have static `IP` otherwise\
    \ leave it `Automatic`.\n3. In case of static `IP`, press `Add` button.\n4. Write\
    \ down `IP address`, `Netmask` and `gateway`.\n5. Add `DNS server IP Address`,\
    \ if you have more than one `DNS server` you add the `IP Address` separated with\
    \ coma.\n6. ![](Image00014.jpg) Select `General Tab`.\n7. Select `Automatically\
    \ connect to this network when it is available`.\n\n Press `Save` to save setting.\n\
    \nPress `Begin installation`. It will bring screen on which it will show progress\
    \ of installation, option to set `root password` and create one new users.\n"
