    # Management Overview


    * Managing user accounts

    * Managing services

    * Configuring network interfaces and firewall

    * Create Diagnostic report

    * Kdump Configuration

    * SELinux

    * Software updates

    * Subscription

    * Terminal

    * Managing virtual machines


    ## Installing Cockpit


    If Cockpit is not installed by default, you can install with following procedure.


    ### Install

    ```bash

    yum install cockpit

    ```


    ### Start the service

    ```bash

    systemctl start cockpit

    ```


    ### Enable the service to start on boot

    ```bash

    systemctl enable cockpit

    ```


    ### Check weather service is running or not

    ```bash

    systemctl status cockpit.socket

    ```


    Firewall is by default opened for cockpit in RHEL 8; if it is not there you can
    do with following command:

    ```bash

    firewall-cmd --add-service=cockpit --permanent

    firewall-cmd --reload

    ```


    ## Starting the web console (cockpit)


    You can start cockpit on the same server in the firefox browser, if GUI is installed.
    On MS Windows client you can use web browser of your choice.


    The default https port for cockpit is `9090` and username and password is same
    as system credentials.


    In this example I am running cockpit from windows 10 workstation the IP Address
    of the server `192.168.190.128`. So in the address bar of the browser like chrome
    or Microsoft internet explorer write `https://192.168.190.190:9090`. if you are
    running on same server write `https://localhost:9090` in address bar of the browser
    and press enter.


    ![](Image00070.jpg)


    ## Installing add-ons


    To add the add-on modules to cockpit:


    ### Syntax

    ```bash

    yum install package

    ```


    ### Example

    ```bash

    yum install cockpit-machines

    ```


    To manage multiple machines in single UI you can install dashboard package:

    ```bash

    yum install cockpit-dashboard

    ```


    ## Exploring Cockpit


    In this section I will do few task as a demonstration, going through the whole
    UI is beyond the scope of this book.


    ### Shutdown / Restart the server


    To shutdown or restart the machine using cockpit :-


    1. From the left hand side pan select `System` > `Power options`.

    2. Under Power options drop down menu select the task whether you want to `Restart`
    or `Shutdown` the server.


    ![](Image00071.jpg)


    3. On next screen specify when you want to shutdown/restart the machine and message
    you want to send the message to logged in users.


    ![](Image00072.jpg)


    ### Set the hostname


    1. Click `host name` on the system screen.

    2. On ![](Image00073.jpg) the next screen change the real hostname and press change.


    ![](Image00074.jpg)


    These are few example of task that can be performed with cockpit. As it is GUI
    you can explore and learn more.

    '
