    # Express Guide

    ## Red Hat Enterprise Linux

    ### Centos Version 8

    **Shiv Kumar Goyal**


    ## Preface

    This book is specially for system administrators or Linux enthusiast. This book
    is written in such manner that it covers practical aspects of `RedHat Enterprise
    Linux` and `Centos`. If you are planning to deploy version 8 of `Redhat Enterprise
    Linux` or maintaining it then this book is for you. All procedures written in
    the book are to the point with available screen shots and output samples. If you
    are short of time and hates reading bulky books, then this book is for you. It
    covers all articles from basics to advance level.


    I hope you will like this book.


    Thanks,

    Shiv Kumar Goyal


