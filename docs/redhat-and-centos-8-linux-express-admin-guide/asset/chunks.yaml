    Chapter 13.              


    # Exploring Shell


    Shell


    A shell is a command-line interpreter. It is interface between user and Operating
    system. User gives command on Shell prompt and operating system executes that
    command. As shell is a command language interpreter, the basic purpose of shell
    is to translate human readable commands typed at a terminal into system actions.
    A shell is a special user program through which other programs are invoked. The
    shell gets started when the user logs in or start the terminal. Although several
    shells are available with Linux distributions like Bash, Korn, C shell zsh  etc,
    Bash is the default shell for Linux. Depending on the shell you use, there may
    be minor difference in command’s usage.


    Shell Script


    Generally, we use shell in interactive mode, where user inputs command and gets
    output. However, some time you use shell scripts.  Shell script is script you
    write to give series of command. Scripts that are more complex check conditions
    and run loops. Seasoned administrators use shell scripts to automate administrative
    tasks and to monitor system. Suppose, you want to check the disk space, memory
    availability and environment variables before invoking a program. There are two
    ways to do it, either you can give all commands manually every time before running
    that program or you can use shell script to do that. Shell scripts generally end
    with sh extension. Figure bellow shows an example of shell script. 


    ![](Image00057.jpg)


    Command line Interface


    Command line interface (CLI) is way to access the shell. If you do RHEL installation
    without GUI or Minimal, you will get only command line interface through virtual
    terminals. When you install Linux with GUI you have two option to access CLI


    *   Virtual Terminals


    *   Graphical Terminal


    Virtual Terminals


    Virtual Terminal is full screen command line interface. If you are working on
    RHEL server locally, you will get more than one Virtual terminal running on same
    server. Having more than one virtual terminal allows the administrator to switch
    to another terminal if necessary.  Even with Graphical Desktop environment installed
    you can access virtual terminals. Virtual terminals can be accessed by pressing
    Ctrl+Alt+F2 till F6\. To come back to the graphical session, press Ctrl+Alt+F1\.
    On pressing Ctrl+Alt+F2 you will get first Virtual terminal ![](Image00058.jpg)
    like that


    Login and start issuing commands


    Graphical Terminal Emulator


    ![](Image00059.jpg) System with Graphical desktop environment can get CLI inside
    GUI with Terminal Emulator. Terminal allows you to open a window and lets you
    interact with the shell. Depending on Graphical Desktop environment installed
    on Linux distributions you have bunch of terminal emulator available like gnome-terminal,
    konsole, rxvt, xterm, LXterminal, guake, terminator, tilde, yakuake etc. Gnome-terminal
    is the default terminal emulator for RHEL Linux with GNOME desktop environment.
    To start Gnome terminal, press Activities and press terminal icon.


    Command prompt


    Although you can customize the prompt, but more often you will get either # or
    $ at end of prompt. Where # indicates the user is logged in as root (administrator)
    user and $ prompt as normal user. You can display additional information in the
    prompt like username, current directory and server name even you can show current
    date and time.


    Structure of commands


    Normally if you run command from the shell prompt will have the following format:


    command –options <filename>


    Example


    tail –f myfile


    However, file name is not used in all commands. in some commands only command
    or command with options are used


    ls –la


    Tips for the bash shell


    Whether you are on virtual terminal or using Terminal emulator, command format
    is same. Following are some of the useful features of bash shell you can use in
    day-to-day tasks


    TAB completion


    Tab completion is one of the most useful feature of Bash shell. It has ability
    to guess the command, directory or file name by pressing TAB after writing partial
    command, directory or file name, shell will automatically complete the word if
    only one option is present otherwise it will offers all possible completions.
    For example, suppose you want to change directory to abc you write cd ab and press
    TAB, the system will complete the word automatically.


    Bash History


    Shell saves all the command given by you on shell prompt in a file in your home
    directory. You can check the last commands by giving history command.


     $ history


    If you want to give last command again, you can press UP arrow key and then press
    ENTER key. You can press UP arrow key repeatedly to scroll backward in the history
    of commands.


    Wildcards


    Wildcards or wild characters are symbols representing one or more characters in
    the shell command. Most common wild card characters are


    *     Star


    ?     Question mark


    [ ]     Square baskets


    Where


    Star (*)


    Represents zero or more characters


    Example


    $ ls b*


    List all files starting with b


    Question mark (?)


    Represents single character


    Example


    $ ls ?at


    List all files whose first letter of file name can be any character like bat,
    cat or hat


    Square brackets


    Represent a range of characters


    Example


    ls b[1-5]'
