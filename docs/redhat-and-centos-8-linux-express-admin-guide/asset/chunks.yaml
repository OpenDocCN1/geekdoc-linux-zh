  trans: "\n任务自动化在计算机领域非常重要。假设你必须在晚上 11:00 系统无人使用时进行每日备份。那么你就必须在深夜起来进行备份。然而，你可以对备份进行调度，这样计算机就会在晚上\
    \ 11:00 自动运行备份脚本。第二天早晨，你可以验证备份情况。RHEL 提供了许多工具来实现任务自动化。这些工具可以用于自动化系统管理员定期执行或指定时间执行的任务。以下是主要的工具：\n\
    \n* `cron` \n* `at`\n* `batch`\n\n## cron\n\n`cron` 是一个守护进程，可以根据时间、日期、星期调度周期性任务的执行。\n\
    \n### 配置文件\n`/etc/crontab`\n\n### 命令描述\n* `crontab –l` 列出 crontab 条目\n* `crontab\
    \ –e` 编辑 crontab\n* `crontab –r` 删除 crontab\n\n### \n`minutes hours Day_of_month\
    \ Month Day_of_week Command`\n\n### 参数说明\n* 分钟 (0 到 59)\n* 小时 (0 到 23)\n* 日期 (1\
    \ 到 31)\n* 月份 (1 到 12)\n* 星期 (0 到 6) (0=星期日)\n\n### 调度周期性任务\n1. 通过命令 `crontab\
    \ -e` 编辑 crontab\n2. 在文件末尾添加条目，按 `i` 键（注意此文件将在 `vi` 编辑器中打开，因此你可以使用所有 `vi` 命令）\n\
    假设你想每天晚上 23:30 运行备份脚本：\n```\n30 23 * * * /myscripts/backup.sh\n```\n3. 按 `ESCAPE`\
    \ 键，然后输入 `: write x` 并按 `ENTER` 键保存条目。\n\n## at and batch\n\n`crontab` 用于周期性任务，但对于指定时间执行的单次任务，可以使用\
    \ `at` 和 `batch` 命令。\n\n运行 `at` 命令必须安装了 `rpm` 且 `atd` 服务必须正在运行。当你输入带有时间的 `at`\
    \ 命令时，系统会向你显示 `at` 提示符。在 `at` 提示符下，你可以输入想要调度的命令。输入所有命令后，按 `CTRL + d` 键退出 `at`\
    \ 提示符。\n\n### 检查安装\n```\n# rpm -q at\n```\n### 安装 at 包\n```bash\n# yum install\
    \ at\n```\n### 启动服务\n```bash\n# service start atd\n```\n\n### 启动命令\n```bash\n\
    # at 4:00\nat > ls\nctrl + d\n```\n\nBatch 命令在系统平均负载低于 0.8 小时执行单次任务\n```\n~]#\
    \ batch\nat> ls -la\nat> ctrl + d\n```\n\n### 显示待处理作业列表\n```bash\n# atq\n```\n\
    \n## 第 27 章 启动过程\n\n按下电源键进入 RHEL 登录提示界面后，系统会进行大量处理以带你进入登录界面。这个过程被称为启动过程。理解 Linux\
    \ 的启动过程对于排排除启动问题以及正确配置 Linux 至关重要。\n\n以下步骤总结了 RHEL 中启动过程是如何：\n1. 计算机使用 `BIOS`\
    \ 执行 `POST`（上电自检）。\n2. `BIOS` 读取主引导记录（Master Boot Record）获取引导程序。\n3. 控制权交交给 `GRUB2`。它使用\
    \ `/boot/grub/grub.cfg` 选择内核镜像。\n4. 内核\n    1. 根据 `grub.conf` 中指定的 `root=` 挂载根分区。\n\
    \    2. 内核启动进程 ID 为 1 (`PID 1`) 的 `systemd` 进程。\n    3. `initrd`（初始内存磁盘）被内核作为临时根文件系统，直到内核启动完成并挂载真实的根文件系统。它还包含了访问硬盘和其他必要的硬件所需的驱动程序。\n\
    5. `systemd`\n\n`systemd` 是 Linux 操作系统的系统和服务服务管理器。它提供了许多功能，例如在启动时并行启动系统服务。`systemd`\
    \ 是系统中所有进程的父进程。`systemd` 确定默认系统目标，在旧版本中被称为运行级别（run level）。确定目标后，它执行系统初始化，包括：\n\
    1. 设置主机名\n2. 初始化网络\n3. 初始化系统硬件\n4. 挂载文件系统\n5. 启动交换分区\n\n## 第 28 章 日志管理\n\n日志文件在系统故障排除中非常有用。日志文件对于审计系统是否存在未经授权的访问也很有用。日志文件让你了解系统在特定时间点正在做什么。假设作为\
    \ Linux 管理员，你的机器运行缓慢或工作不正常，首先要查找的就是日志。日志提供了问题何时以及如何开始的线索，以及操作系统的哪个部分出了问题。\n\n\
    Linux 环境下生成的日志文件通常可以分为四类：\n* 应用日志\n* 事件日志\n* 服务日志\n* 系统日志\n\nRHEL 提供了保存日志信息的服务。RHEL\
    \ 中的某些应用程序使用自己的机制直接将日志记录到其日志文件中，例如 `apache`。某些服务通过 `systemctl` 维护其日志。`systemctl`\
    \ 进一步与 `Journald` 通信，由 `Journald` 跟踪日志信息。\n\n`rsyslog` 是另一种日志记录方法。`rsyslog` 和\
    \ `Journal` 具有若干不同的特征，使得它们适用于特定的场景。在许多情况下，结合使用非常有效。\n\n### journald\n\n`journald`\
    \ 守护进程是 systemd 的组件，用于日志管理。它收集了系统的所有消息。\n\n#### 使用 journalctl 查看日志\n\n查看日志：\n\
    ```\njournalctl\n```\n查看所有条目的元数据：\n```\njournalctl -o verbose\n```\n实时查看日志：\n\
    ```bash\njournalctl -f\n```\n\n#### 按优先级过滤\n\n你可以根据优先级过滤日志。\n语法：\n```\njournalctl\
    \ -p priority\n```\n示例：在此示例中，我们只想查看日志中错误级别的行：\n```\njournalctl -p err\n```\n查看本次启动的日志条目：\n\
    ```\njournalctl -b\n```\n让日志持久化：\n```bash\n$ sudo mkdir -p /var/log/journal\n\
    ```\n然后重启 journald 以应用更改：\n```bash\nsystemctl restart systemd-journal\n```\n\n\
    ### syslogd\n\n某些日志由 `rsyslogd` 守护进程控制。它是 `sysklog` 的增强版。它提供了高性能、出色的安全性、模块化设计以及通过\
    \ TCP 或 UDP 协议传输的支持。每条日志消息至少包含时间和程序名称字段。\n\n`/etc/rsyslog.conf` 文件是 `rsyslogd`\
    \ 的主配置文件，用于记录系统上的日志消息。该文件指定了 `rsyslogd` 的记录规则。由 `rsyslogd` 维护的日志文件列表可以在 `rsyslog.conf`\
    \ 配置文件找到。日志文件通常位于 `/var/log/` 目录。\n\n####样例 rsyslog.conf\n```bash\netc]$ cat rsyslog.conf\n\
    \n# rsyslog v5 配置文件\n# 更多信息请参 /usr/share/doc/rsyslog-*/rsyslog_conf.html\n# 如果遇到问题，请访问\
    \ http://www.rsyslog.com/doc/troubleshoot.html\n\n*.info;mail.none;cron.none \
    \ /var/log/messages # authpriv 文件具有限制访问。\nauthpriv.*                         \
    \     /var/log/secure # 将所有邮件记录在一个处。\nmail.*                                -var/log/maillog\
    \ # 记录 cron 信息\ncron.*                               /var/log/cron # 所有人都能接收紧急消息\n\
    *.emerg                                * # 将 crit 及以上的新闻错误保存到特殊文件中。\nuucp,news.crit\
    \                         /var/log/spooler # 将启动消息也保存到 boot.log\nlocal7.*    \
    \                          /var/log/boot.log\n```\n\n使用 rsyslog.conf 进行日志过滤\n"
- fmt: "\nThere is too much logging happens in the system, if it is not filtered it\
    \ becomes almost impossible to use these logs. To filter the logs, we use `/etc/rsyslog.conf`\
    \ file. It has two parameter `facility` and `priority` separated with dot (`.`).\
    \ `Facility` is name of process for which you want to log and `priority` specify\
    \ level of log like `debug`, `info`, `notice`, `warning`, `err`, `crit`, `alert`,\
    \ `emerg` or `*` for all type of messages you want to keep.\n\n### Example\n\n\
    #### The authpriv file has restricted access.\n\n```\nauthpriv.* /var/log/secure\n\
    ```\n\n#### Log all the mail messages in one place.\n\n```\nmail.* -/var/log/maillog\n\
    ```\n\nIn the example where `authpriv` and `mail` is facility and priority is\
    \ `*` which means all logs.\n\n### Rotating logs with logrotate\n\nLogs needs\
    \ rotation to avoid filling of file systems and make log more manageable. Once\
    \ log file is rotated, it will be renamed with new file name. After certain time\
    \ of rotation, older log files are deleted to save space.\n\n`logrotate` package\
    \ manages automatic rotation of log files according to configuration in `/etc/logrotate.conf`\
    \ or otherwise specified with command option.\n\n#### Install\n\n```bash\nsudo\
    \ apt install logrotate\n```\n\n#### To verify if logrotate installed successfully\n\
    \n```bash\nlogrotate\n```\n\nSome of the important configuration settings in `/etc/logrotate.conf`\
    \ file are `rotation-interval`, `log-file-size`, `permssions` of files, `missingok`,\
    \ `rotation-count` and `compression`. For each log it is recommended you create\
    \ file in the `/etc/logrotate.d` directory.\n\n### Example\n\n```\n[root@redhat1\
    \ logrotate.d]# cat bootlog\n\n/var/log/boot.log\n\n{\n    missingok\n    daily\n\
    \    copytruncate\n    rotate 7\n    notifempty\n}\n```\n\nIn this example the\
    \ log rotation utility `rotate` the logs for `boot` with following details :-\
    \ \n- `missingok`: ignore if logs are missing\n- `daily`: log is rotated on daily.\n\
    - `copytruncate`: Truncate the original log file in place after creating a copy\n\
    - `rotate 7`: retain logs for 7 days.\n- `notifempty`: Do not rotate the log if\
    \ it is empty\n\n### Important logs\n\nThe main directory for logs is `/var/log`.\
    \ Some of the important log files in this directory is worth mentioning:\n* `wtmp`\n\
    * `utmp`\n* `dmesg`\n* `messages`\n* `maillog`\n* `spooler`\n* `auth.log` or `secure`\n\
    * `yum.log`\n* `boot.log`\n\n#### `/var/log/wtmp` and `/var/run/utmp`\n\nThe `wtmp`\
    \ and `utmp` files keep track of users logging in and out of the system. These\
    \ two files are binary files. You cannot directly read the contents of these files\
    \ using text editor, `cat` or `more` command. You have to use specific command\
    \ for that.\n\n`who` command uses `/var/run/utmp` file to provide information\
    \ about the users who are currently logged onto the system.\n\n```bash\n[root@RHEL2\
    \ log]# who\n(unknown) :0      2018-10-02 05:34 (:0)\nroot     pts/0      2018-10-02\
    \ 05:38 (192.168.131.1)\n```\n\n#### `/var/log/wtmp` file\n\nThis file maintains\
    \ history of all logged in and logged out users. The last command uses this file\
    \ to display listing of last logged in users.\n\n```bash\n[root@RHEL2 log] # last\n\
    root     pts/0      192.168.131.1    Tue Oct  2 05:38  still logged in\n(unknown\
    \ :0             :0               Tue Oct  2 05:34  still logged in\nreboot  \
    \  system boot  3.10.0-514.el7.x Tue Oct  2 05:33 - 05:47  (00:13)\nroot     pts/1\
    \      192.168.131.1    Mon Oct  1 13:23  crash\n```\n\n#### `dmesg`\n\n`dmesg`\
    \ obtains its data by reading kernel buffer. A buffer is a portion of computer's\
    \ memory that is set aside as temporary holding place for data that is sent or\
    \ received from an external device. The messages are very important in diagnosing\
    \ purpose of device failure. Whenever hardware change happens most time messages\
    \ are logged here. If you are facing any problem, use `dmesg` for system diagnosis.\
    \ `dmesg` tool present in `/var/log/`.\n\n```bash\n[root@RHEL2 log]# dmesg |more\n\
    ```\n\n#### `Messages`\n\nGeneral messages are logged in this file. To view this\
    \ file, you can use text editor or any common tool for viewing text file like\
    \ `cat`, `less` or `more`.\n\n```bash\n[root@RHEL2 log] # cat messages\nOct  2\
    \ 06:07:02 localhost rsyslogd: [origin=\"rsyslog\"] swVersion=\"7.4.7\" x-pid=\"\
    1056\" x-info=\"http://www.rsyslog.com\"] rsyslogd was HUPed\n```\n\n#### `Maillog`\n\
    \nThis file logs the messages for mail server running on the server.\n\n```bash\n\
    [root@RHEL2 log]# cat maillog\n```\n\n#### `Spooler`\n\nLogs the spooler messages.\
    \ Spooler is used by print queues to print.\n\n#### `secure`\n\nThis file captures\
    \ authentication logs. To check this file, you can use `more` or `less` command.\n\
    \n#### `dnf.log`\n\nAs in RHEL 8 `yum` is frontend for `dnf` command. `yum` command\
    \ logs messages in `dnf.log` file. There are other dnf log files like `dnf.librepo.log`\
    \ and `dnf.rpm.log`.\n"
