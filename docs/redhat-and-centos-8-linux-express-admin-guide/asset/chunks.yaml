- fmt: "\n# Following are the steps to create partition\n\n1. Give `parted` command\
    \ with required device name.\n2. use `mkpart` command.\n3. Select partition type,\
    \ it can be primary or extended.\n4. Give file system type, default is `ext2`.\n\
    5. Like `fdisk`, give starting and ending sector number; if disk is new, starting\
    \ sector will be `1` and for ending you can give size like `1G` for 1GB partition\
    \ size.\n\n```\n(parted) mkpart\nPartition type? primary/extended? primary\nFile\
    \ system type? [ext2]?\nStart? 1\nEnd? 1G\n(parted) print\nModel: VMware, VMware\
    \ Virtual S (scsi)\nDisk /dev/sdb: 21.5GB\nSector size (logical/physical): 512B/512B\n\
    Partition Table: msdos\nDisk Flags:\nNumber  Start   End     Size   Type     File\
    \ system Flags\n  1       1049kB  1000MB  999MB  primary\n(parted) quit\n```\n\
    \n## Add partition\n\nIf you have space available on the hard disk and you want\
    \ to add one more partition you can give `mkpart` command in `parted` interface.\
    \ It will ask same question as in case of creating first partition. However, this\
    \ time start will be end of the previous partition as start of this partition\
    \ plus size of the partition is the end of the partition. In this example, start\
    \ is `1000MB` as the end is at `1000MB` for first partition and end of this partition\
    \ will be `2000MB` (`1000MB + 1000MB`) if you want add `1000MB` partition.\n\n\
    ```\n(parted) mkpart\nPartition type? primary/extended? primary\nFile system type?\
    \ [ext2]?\nStart? 1000MB\nEnd? 2000MB\n(parted) print\nModel: VMware, VMware Virtual\
    \ S (scsi)\nDisk /dev/sdb: 21.5GB\nSector size (logical/physical): 512B/512B\n\
    Partition Table: msdos\nDisk Flags:\nNumber  Start   End     Size   Type     File\
    \ system Flags\n1       1049kB  1000MB  999MB  primary\n2       1000MB  2000MB\
    \  999MB  primary\n```\n\n## Delete partition\n\nTo delete the partition use `rm\
    \ partition_number` command.\n\n### Example\n\n```\n(parted) print\nModel: VMware,\
    \ VMware Virtual S (scsi)\nDisk /dev/sdb: 21.5GB\nSector size (logical/physical):\
    \ 512B/512B\nPartition Table: msdos\nDisk Flags:\nNumber  Start   End     Size\
    \   Type     File system Flags\n1       1049kB  1000MB  999MB  primary\n2    \
    \   1001MB  2001MB  999MB  primary\n3       2001MB  3001MB  1000MB primary\n(parted)\
    \ rm 3\n(parted) print\nModel: VMware, VMware Virtual S (scsi)\nDisk /dev/sdb:\
    \ 21.5GB\nSector size (logical/physical): 512B/512B\nPartition Table: msdos\n\
    Disk Flags:\nNumber  Start   End     Size   Type     File system Flags\n1    \
    \   1049kB  1000MB  999MB  primary\n2       1001MB  2001MB  999MB  primary\n```\n\
    \nIn this Chapter, we learned how to manage partitions, in the next chapter we\
    \ will discuss how to create file system on these partitions.\n\n# Chapter 18.\
    \ File system\n\nFile system is method used by operating system to store and retrieve\
    \ data. File system helps in managing and arranging data. There are different\
    \ types of file systems available in Linux. Each type of file system uses different\
    \ structure and logic for storing and retrieving data. Some file systems have\
    \ been specifically designed for specific devices and applications, for example\
    \ `ISO 9660` file system is used for optical disks like `CDROM`. Depending of\
    \ file system type it can be local or over network. Linux support wide variety\
    \ of file systems each file system has pros and cons. We will discuss some of\
    \ the common filesystems used in RHEL. In RHEL 8 `BTRFS` file system has been\
    \ removed. This means you will not be able to create, mount or install `trfs`\
    \ file system on RHEL 8.\n\n## XFS\n\nXFS is a high-performance journaling file\
    \ system that was initially created by Silicon Graphics, Inc. for the `IRIX` operating\
    \ system and later ported to Linux. XFS supports metadata journaling, which facilitates\
    \ quicker crash recovery. The XFS file system can also be defagmented and enlarged\
    \ while mounted and active. XFS records file system updates asynchronously to\
    \ a circular buffer (the journal) before it can commit the actual data to disk.\
    \ XFS is default File system for RHEL 8. New features copy-on-write data extents\
    \ have been added to XFS. This feature allows two or more files to share a common\
    \ set of data. When is change on either of the files sharing blocks, XFS breaks\
    \ the link to common blocks and creates a new file. This helps in saving space\
    \ and disk writes.\n\n### Creating XFS file system\n\n1. Create partition using\
    \ `fdisk`.\n2. `fdisk -l` check the device name.\n3. `mkfs -t xfs /dev/sdb1` where\
    \ `/dev/sdb1` is device name and `xfs` is file system type.\n```\n~]# mkfs -t\
    \ xfs /dev/sdb1\n```\n4. create mount point.\n```\n~]# mkdir /test1\n```\n5. Add\
    \ entry in the `/etc/fstab`.\n```\n~]# vi /etc/fstab\n```\n/dev/mapper/cl-root\
    \ /  xfs  defaults  1 1\nUUID=6b761a5f-8c7c-465d-b58c-d296793803 /boot xfs defaults\
    \  1 2\n/dev/mapper/cl-swap swap defaults  0 0\n/dev/sdb1  /test1  xfs  defaults\
    \  0 2\nWhere `/dev/sdb1` is device, `/test1` mount point, `xfs` for partition\
    \ type, `0` for dump and `2` for `fsck`.\n\n## EXT File System\n\nExtended file\
    \ system (`EXT`) is most popular file system used in Linux Operating systems.\
    \ In its lifespan it had evolved a lot from its first implementation in 1992 till\
    \ date. `EXT4` is the most recent version of `EXT`. From third generation i.e.\
    \ `EXT3` it came up with journalized file system. With `JFS` feature it keeps\
    \ the track of changes not yet committed to the file system by recording such\
    \ changes in data structure which in turn generate circular log. In case of abrupt\
    \ system down like power failure, crashed file system can be brought online easily.\
    \ `EXT3` having limitation of file system size as 8TB/16TB and file size as 2\
    \ TB whereas Ext4 is the next generation of ext file system having improved file\
    \ system and file size upper limits of 16TB. It is efficient reliable and robust.\
    \ In RHEL 8 `ext4` metadata is protected by checksums. This enables the file system\
    \ to identify corrupt metadata, this increase in file system resilience.\n\n###\
    \ Creating EXT4 file system\n\n1. Create partition with `fdisk`.\n2. `fdisk -l`\
    \ check the device name.\n3. `mkfs -t ext4 /dev/sdb1` where `/dev/sdb1` is device\
    \ name and `ext4` is file system type.\n\n```\nmkfs –t ext4 device_name\n```\n\
    Example\n```\n~]# mkfs -t ext4 /dev/sdb1\nOr\n~]# mkfs.ext4 /dev/sdb1\n```\n4.\
    \ create mount point.\n```\n~]# mkdir /test1\n```\n5. Mount new File system.\n\
    ```\n~]# mount -t ext4 /dev/sdb1 /test1\n```\n6. Add entry in the `/etc/fstab`.\n\
    ```\n~]# vi /etc/fstab\n```\n/dev/mapper/cl-root /  xfs  defaults  1 1\nUUID=6b761a5f-8c7c-465d-b58c-d296793803\
    \ /boot xfs defaults  1 2\n/dev/mapper/cl-swap swap swap  defaults  0 0\n/dev/sdb1\
    \  /test1  ext4  defaults  0 2\n\n# Chapter 19. Swap space\n\nSwap space is used\
    \ in Linux and UNIX to free up physical memory. The inactive pages of data are\
    \ written to slower storage i.e. hard disk. The area where inactive data is written\
    \ is called as swap space.\n\n## Add swap space\n\n1. Create partition.\n```\n\
    ~]# fdisk /dev/sdb\nWARNING: DOS-compatible mode is deprecated. It's strongly\
    \ recommended to switch off the mode (command 'c') and change display units to\
    \ sectors (command 'u').\nCommand (m for help): n\nCommand action\n  e  extended\n\
    \  p  primary partition (1-4)\np\nPartition number (1-4): 2\nFirst cylinder (307-6132,\
    \ default 307):\nUsing default value 307\nLast cylinder, +size{K,M,G} (307-6132,\
    \ default 6132): +1G\nChange the type by pressing t of partition selected to 82\
    \ which is Linux swap\nCommand (m for help): t\nPartition number (1-4): 2\nHex\
    \ code (type L to list codes): 82\nChanged system type of partition 2 to 82 (Linux\
    \ swap / Solaris)\nCheck the partition\nCommand (m for help): p\nDisk /dev/sdb:\
    \ 21.5 GB, 21474836480 bytes\n171 heads, 40 sectors/track, 6132 cylinders\nUnits\
    \ = cylinders of 6840 * 512 = 3502080 bytes\nSector size (logical/physical): 512\
    \ bytes / 512 bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nDisk identifier:\
    \ 0xdec2ee90\nDevice Boot  Start  End     Blocks  Id  System\n/dev/sdb1      \
    \ 1     307     1048576  83  Linux\n```\n"
