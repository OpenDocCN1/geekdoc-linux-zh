    # Repository


    As mentioned, repositories are collection of RPM packages with metadata that is
    used by `Yum` command. This is a better way of distributing contents of Linux
    distributions. Repositories make sure you get safe and authentic contents. As
    most of the time we use repositories on the internet, the authenticity of the
    content of the repository which we download is a pristine requirement. Moreover,
    the download should also be in secured manner. The Red hat ensures it uses end-to-end
    security of the RPM packages. First thing is by using `https` site instead of
    `http` site which makes sure that the contents are distributed over secured channel.
    The Redhat uses separate Public key infrastructure. For RPM Package security,
    RPM package signatures can be used to implement cryptographic integrity checks
    for RPM packages. At the time of RPM package installation, these signatures can
    be verified as it is part of the RPM package. To enable RPM signature checking,
    the `yum` repository file must contain a `gpgcheck=1` line, as in the following
    example:


    ```ini

    [myrepo]

    name=My Repository

    baseurl=https:///download.myrepoex.com/version8/

    enabled=1

    gpgcheck=1

    ```


    # Working with repositories


    ### Display all enabled repositories


    ![](Image00049.jpg) # `yum repolist`


    ### Display all repositories enabled and disabled

    ```bash

    # yum repolist all

    ```


    ### Display packages for specific repository

    ```bash

    # yum list |grep baseos

    ```


