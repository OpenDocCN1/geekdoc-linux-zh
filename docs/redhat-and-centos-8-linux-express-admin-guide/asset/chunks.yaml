  trans: "\n\n`NetworkManager` 是一个守护进程，为网络连接的简易配置和管理提供接口。在 `RHEL` 的之前的版本中，网络配置是通过文件处理的。然而在\
    \ RedHat 8 中，它由 `network manager` 处理。`Network manager` 是一个动态网络配置和控制守护进程。它可以管理如\
    \ `Wifi`、`Ethernet` 和移动设备等网络接口。`Network manager` 可以在有线网络不可用时自动从有线切换到 WiFi，反之亦然。\n\
    \n如果你来自旧版本的 RedHat 并且习惯于使用 `ifup` 和 `ifdown` 等网络脚本，那么在 RedHat 8 中，`ifup` 和 `ifdown`\
    \ 脚本已弃用，现在由 `network manager` 处理。传统使用的 `ifcfg` 配置文件在 `RHEL` 中仍然受支持，但默认不可用。\n\n\
    ## Network Manager 配置以下内容\n\n1. IP 地址\n2. 静态路由\n3. 网络别名\n4. VPN 配置 \n5. DNS 信息\n\
    \n### 检查 networkmanager 守护进程状态\n```bash\nsystemctl status NetworkManager\n```\n\
    \n### 如果 Networkmanager 未运行，则启动它\n```bash\nsystemctl start NetworkManager\n```\n\
    \n### 设置其随系统启动自动启动（大多数情况下不需要，因为 networkmanager 默认配置为自动启动） \n```bash\nsystemctl\
    \ enable NetworkManager\n```\n\n## 使用图形界面设置静态 IP 地址\n\n设置静态 IP 地址的步骤如下所示：\n\n\
    6. 以 root 身份登录\n7. 点击 network manager 图标并选择 Wired settings（有线设置）\n![](img/Image00027.jpg)\n\
    8. ![](img/Image00028.jpg) ![](img/Image00029.jpg) 点击设置图标，小齿轮\n9. ![](img/Image00030.jpg)\
    \ 选择 IPv4 tab 设置\n1. 从 IPv4 Method 中选择 `Manual`（手动）。\n2. 提供 IP 地址、`Netmask` 和\
    \ `Gateway`。\n3. 填写 DNS 服务器 IP 地址。如果你有多个 DNS，请用逗号分隔所有 IP 地址。\n4. 按 `Apply`（应用）。\n\
    \n## 使用基于文本的界面 nmtui 进行网络配置\n\n`Nmtui` 是一个配置网络的文本界面工具。如果你系统中没有安装 GUI，这个工具非常有帮助，特别是当你远程管理系统时。该工具在\
    \ `RHEL` 服务器安装时默认安装。如果不存在，你可以安装它。\n\n```bash\nyum install NetworkManager-tui\n\
    ```\n\n### 启动 nmtui\n```bash\nnmtui\n```\n\n## 命令\n\n### 编辑连接设置\n语法\n```bash\n\
    nmtui edit connection_name\n```\n示例\n```bash\nnmtui edit ens33\n```\n\n### 连接已断开连接\n\
    语法\n```bash\nnmtui connect connection_name\n```\n示例\n```bash\nnmtui connect ens33\n\
    ```\n\n### 使用 nmtui 修改主机名\n语法\n```bash\nnmtui hostname new_hostname\n```\n示例\n\
    ```bash\nnmtui hostname RHEL2\n```\n\n### 导航 NMTUI\n由于 `nmtui` 是一个文本用户界面，你必须使用键盘进行导航。按\
    \ `TAB` 键移动光标到下一个字段，使用 `SHIFT + TAB` 向后移动。使用 `SPACE` 空格键打开下拉菜单。\n\n## 使用 NMTUI\
    \ 修改 IP 地址\n\n启动 `nmtui`\n```bash\nnmtui\n```\n1. 选择 `Edit a connection`（编辑连接）\n\
    2. ![](img/Image00031.jpg) 从列表中选择连接配置并按 `Edit`（编辑） \n![](img/Image00032.jpg)\n\
    3. 在下一个界面的 IPv4 配置上按 `SPACEBAR` 键获取弹出菜单。\n    1. 选择 `Manual` 设置静态 IP 地址。\n   \
    \ 2. 按 `TAB` 键移动到 `Address` 字段并提供带有 `Netmask` 的 IP 地址。\n    3. 按 `TAB` 键移动到 `Gateway`\
    \ 列并提供 `Gateway`。\n    4. 按 `TAB` 键 `DNS Servers`。按 `SPACE` 键添加 DNS 服务器。你可以添加多个\
    \ DNS 服务器。\n    5. 确保选中了 `Automatically connect`（自动连接）。\n    6. ![](img/Image00033.jpg)\
    \ 按 `OK`（确定）\n7. 按 `ESC` 键退出 `NMTUI`\n\n## 使用配置文件修改网络配置\n\n如果你像我一样是一个老派的人，喜欢使用配置文件而不是\
    \ GUI 来工作。虽然在 `RHEL8` 中配置文件已弃用，但你仍然可以使用配置文件来控制网络。在这个示例中，我将解释如何使用配置文件更改主机的 IP 地址。\n\
    \n### 使用配置文件更改 IP 地址\n\n1. 检查当前设置\n```bash\nip addr show\n```\n2. 检查当前设备\n```bash\n\
    [root@RHEL2]# nmcli d\nDEVICE  TYPE      STATE      CONNECTION\nens33  ethernet\
    \ connected  ens160\nlo      loopback  unmanaged  --\n```\n3. 编辑 `/etc/sysconfig/network-scripts/ifcfg-*`。其中\
    \ `ifcfg-*` 文件是你上一个命令中检查的设备文件。命令输出显示 `ens160` 为设备名，则文件名将是 `ifcfg-ens160`。\n```bash\n\
    vi /etc/sysconfig/network-scripts/ifcfg-ens160\n```\n4. 根据是否有静态 IP 地址还是使用 DHCP，更改\
    \ `/etc/sysconfig/network-scripts/ifcfg-ens160` 文件。\n\n| 静态 | DHCP |\n| :--- |\
    \ :--- |\n| `DEVICE=ens160BOOTPROTO=staticIPADDR =192.168.0.132NETMASK=255.255.255.0GATEWAY=192.168.0.1ONBOOT=yes`\
    \ | `DEVICE=ens160BOOTPROTO=dhcp` |\n\n5. 重启网络连接以更改 IP 地址无需重启。对于之前的版本使用脚本，当前版本中使用\
    \ `networkManager` 自动启动。\n```bash\nnmcli down\nnmcli up\n0\n```\n\n### 网络脚本\n\
    `Red Hat 8` 中网络脚本已弃用。如果你需要这些脚本，可以通过以下命令在系统中安装它们：\n```bash\nyum install network-scripts\n\
    ```\n\n### 使用配置文件更改 DNS\n编辑 `/etc/resolv.conf` 并添加 `search`：\n```text\nsearch\
    \ example.com // 自己的 FQDN\nnameserver 8.8.8.8 // 第一 DNS\nnameserver 8.8.4.4 //\
    \ 第二 DNS\n```\n\n"
- fmt: "\n# User Management\n\nUser management describes the ability of administrators\
    \ to manage user access to resources of the server and attached devices. In multiuser\
    \ environment it is recommended for security and privacy purpose to create separate\
    \ username for each user so that every user can keep his data in their respective\
    \ home folder. The control of users and groups is a central part of system administration.\n\
    \n## User and group\n\nA user is anyone who uses a computer or network service.\
    \ A user can be ether human or an accounts. For better management, the users are\
    \ grouped together in groups . `Group` is logical entity to organize users together\
    \ based on their different properties, it can be either based on same department,\
    \ same place or same work. Sometimes groups are just made to provide certain common\
    \ facilities or right to different users.\n\n## Root user V/S normal user\n\n\
    At the time of installation, the installation screen gives option to create the\
    \ password for `root` user and additional one user. You can also assign this additional\
    \ user with root privileges on same screen. In RHEL Linux `root` is the default\
    \ administrator of the system. `root` is the most powerful user among all users\
    \ on RHEL server. Once you login as a `root` user, you can do anything on the\
    \ server. Unlike normal user, `root` user can read write and modify the files\
    \ and directories of all other users. `root` user can even modify and delete system\
    \ files also. Hence, it is absolutely important to keep the `root` user’s password\
    \ in safe custody.\n\n## Login as root user on graphical terminal\n\nIf Graphical\
    \ desktop environment is installed, after system boot you will get the login screen.\n\
    \n![](Image00034.jpg) Press the user’s icon to login as normal user\n\n![](Image00035.jpg)\
    \ To login as `root` user, you select `Not listed?` from the graphical login screen.\n\
    \nOnce text box for login name appears type `root` and press `ENTER`, type the\
    \ `root`’s password that you selected during installation at the password prompt,\
    \ and press `ENTER`.\n\n## User Management using GUI\n\nTo create user in RHEL.\n\
    \n1. Login as `root` user.\n2. ![](Image00036.jpg) Click `Activities` from panel\
    \ and write `users` in search bar, click `users`. It will open users administration\
    \ windows .\n\n![](Image00037.jpg)\n\n3. To add user press `Add User` button.\
    \ It will bring another dialog box with following fields:\n    - **Account Type**:\
    \ You have two options `Standard` or `administrator`\n    - **Full Name**: Type\
    \ Full name of the user\n    - **Username**: Type username of user you want to\
    \ create\n    - **Allow User to set password when they next login/Set a password\
    \ now**: There are two ways to set password. First way, you can force user to\
    \ set password on next login. Other way is by setting temporary password by administrator\
    \ so that new user can change password at his convenience. This way you add additional\
    \ security layer so that no unauthorized user can use newly created username before\
    \ user sets password.\n\n![](Image00038.jpg)\n\n## Users management using Command\
    \ Line\n\nUser management using command line is very interesting and it offers\
    \ more options and flexibility.\n\n### Add User\n\nSyntax\n```bash\n# useradd\
    \ –c “Full name of user” username\n```\n\nExample\n```bash\n# useradd –c “Adam\
    \ mark” adam1\n```\n\n### Now set the password\n\nSyntax\n```bash\n# passwd username\n\
    ```\n\nExample\n```bash\n# passwd adam1\n```\n\n### Modify user\n\nSyntax\n```bash\n\
    # usermod option username\n```\n\nExample\n```bash\n# usermod –c “Adam markwel”\
    \ adam1 \n```\n\n### Delete/remove user\n\nSyntax\n```bash\n# userdel username\n\
    ```\n\nExample\n```bash\n# userdel adam1\n```\n\n### Display information about\
    \ user\n\nShow current user’s information\nSyntax\n```bash\n$ id\n```\n\nExample\n\
    ```bash\n$ id\n```\n\nShow information of other users\nSyntax\n```bash\n# id username\n\
    ```\n\nExample\n```bash\n# id admin\n```\n\nChange password for other user\nSyntax\n\
    ```bash\n# passwd username\n```\n\nExample\n```bash\n# passwd admin\n```\n\nChange\
    \ own password\n```bash\n$ passwd\n```\n\n### List password expiry information\n\
    \nSyntax\n```bash\n# chage –l username\n```\n\nExample\n```bash\n# chage –l admin\n\
    ```\n\n### Set password expiry\n\n`root` user can set the password expiry date\
    \ for any user. In this example password will expire after 10 from last password\
    \ change.\n\nSyntax\n```bash\n# chage -M no of days from last password change\
    \ username\n```\n\nExample\n![](Image00039.jpg) # chage -l admin\n# chage -M 10\
    \ adam1\n# chage -l adam1\n![](Image00040.jpg)\n\n### Disable password expiration\
    \ for user\n\nSyntax\n```bash\n# chage –M 99999 username\n```\n\nExample\n```bash\n\
    # chage -M 99999 admin\n```\n![](Image00041.jpg)\n\n### Force user to change password\
    \ at next login\n\nSyntax\n```bash\n# chage –d0 username\n```\n\nExample\n```bash\n\
    # chage –d0 adam1\n```\n\n### Lock user\n\nSyntax\n```bash\n# usermod –L username\n\
    ```\n\nExample\n```bash\n# usermod –L adam1\n```\n\n### Unlock user\n\nSyntax\n\
    ```bash\n# usermod –U username\n```\n\nExample\n```bash\n# usermod –U adam1\n\
    ```\n\n## UID\n\nUnique User ID better known as `UID`. For every user that exist\
    \ on system has `UID`. `UID` is numerical representation of every user. For `root`\
    \ user it is `0`. For regular users it starts from `1000`.\n\n| User | UID |\n\
    | :--- | :--- |\n| root | 0 |\n| System user | 1 – 999 |\n| Regular users | 1000\
    \ + |\n\n## Groups\n\nEvery user we create belongs at least one group and all\
    \ groups have their group ID. `/etc/group` file contains list of all available\
    \ groups and their member users.\n\nThere are two type of groups:\n- `Primary\
    \ group`\n- `Secondary group`\n\n### Primary group\n\nWhen you create a new user\
    \ a new group of same name also gets created and the new user become member of\
    \ that group. This is the group applied to your login and used by default when\
    \ you create new files and directories.\n\n### Secondary group\n\nThese are the\
    \ groups users are member than primary group.\n\nChanging secondary group\n```bash\n\
    # usermod –G data2 user1\n```\n\n### Add new group\n\nSyntax\n```bash\n# groupadd\
    \ groupname\n```\n\nExample\n```bash\n# groupadd data1\n```\n\n### Delete group\n\
    \nSyntax\n```bash\n# groupdel groupname\n```\n\nExample\n```bash\n# groupdel data1\n\
    ```\n\n## /etc/group file\n\n`/etc/group` file stores the group information. There\
    \ is one entry per line for each group and each line has the fields separated\
    \ by a colon (:).\n\n`groupname:password:GID:grouplist`\n\n| | Description |\n\
    | :--- | :--- |\n| groupname | Name of group. |\n| password | This is useful to\
    \ implement privileged groups. Generally, password is not used. It can store encrypted\
    \ password. |\n| GID | Group ID |\n| Group List | List of all users who are members\
    \ of the group. Commas must separate the user names. |\n\nExample\n`science:x:1003:class1,\
    \ class2`\n\n## /etc/passwd\n\n`passwd` file required during login. It is a plain\
    \ text file, which contains list of the system’s accounts. Like `/etc/group` file\
    \ there is one entry per line for each user, and each line has the fields separated\
    \ by a colon (:) containing information like user ID, group ID, home directory,\
    \ shell. Only `root` user has write permission for this file.\n\nFormat\n![](Image00042.jpg)\
    \ `username:x:UID:GID:Full_user_name:home_directory:shell`\n\n| Field | Description\
    \ |\n| :--- | :--- |\n| username | Username of the user. It should be unique and\
    \ can be up to 8 characters. It is also case-sensitive |\n| x | An x character\
    \ indicates that encrypted password is stored in `/etc/shadow` file. |\n| UID\
    \ | User ID |\n| GID | Group ID |\n| Full_user_name | Full name of the user |\n\
    | home_directory | Home directory of the user is specified here where user will\
    \ keep his files. |\n| shell | Default shell for user, normally set to `/bin/bash`\
    \ but it can be `/etc/ksh`, `/etc/csh` or any other shell |\n\nExample\nadam1:x:1004:1004:Adam\
    \ mark:/home/adam1:/bin/bash`\n\n## /etc/shadow\n\nStores actual password in encrypted\
    \ format.\n\nFormat\n`username:password:last_password_change:minimum`\n\n| Field\
    \ | Description |\n| :--- | :--- |\n| username | Up to 8 characters. Case-sensitive,\
    \ usually all lowercase. A direct match to the username in the `/etc/passwd` file.\
    \ |\n| password | 13 character encrypted password. A blank entry indicates a password\
    \ is not required to log in (usually a bad idea), and a “ * ” indicates account\
    \ has been disabled. |\n| last_password_change | Date of last password change.\
    \ Expressed in numbers of days since January 1, 1970 |\n"
