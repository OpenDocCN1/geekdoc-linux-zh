    ## 第 1 章 介绍

    操作系统是一种用于管理你计算机上硬件资源的软件。操作系统是运行在应用程序和硬件之间的一层。要运行任何应用程序，你都需要机器上安装操作系统。市场上有许多操作系统，如
    `MS windows`、`Apple OS`、`Unix`、`Linux`。就像 `Windows 7`、`MS Windows 10` 和 `Mac OS`
    一样，`Linux` 也是一种主流的操作系统。与其他操作系统不同，`Linux` 是一个开源操作系统，这意味着源代码是免费获取的。开源的好处是任何人都可以查看源代码并根据自己的需求进行修改。


    1991 年，`Linus Torvalds` 启动了 `Linux` 项目。`Linux` 最初是为基于 Intel 的个人电脑开发的，但最终被移植到了其他平台。不仅是在
    PC 上，`Linux` 内核还用于智能手机上的 `Android` 操作系统。由于 `Linux` 是一个开源项目，许多公司和个人使用了这些代码并开始创建自己的
    Linux 发行版。今天，市场上有数千个 Linux 发行版，但某些发行版在 Linux 用户中占据了绝大部分份额。许多 Linux 社区和公司使用这些流行的发行版作为基础，通过修改或添加某些包来创建自己的版本。广义上，我们可以根据来源对
    Linux 发行版分类，例如 `Centos`、`Oracle` 和 `Scientific Linux` 是基于 `Redhat` 的，而基于 `Debian`
    的发行版有 `Ubuntu`、`Mint`、`tails` 等。


    ### 免费与付费

    Linux 虽然是一个开源项目，但有两种类型的 Linux 发行版可用：一种是免费的，另一种是付费的。免费的发行版是不需要付费的，而付费的则需要费用。


