    files and documentation.


    2.  Binary Packages


    Binary package is bundle of precompiled binary files and its metadata files.


    Package distribution formats


    As mentioned packages are of two types, hence distributed in either binary or
    source code format. The main package distribution systems are :-


    R edhat P ackage M anager


    As name suggests this format was introduced by Redhat. This format is not only
    used by Redhat based distribution like RHEL and Fedora but also adopted by many
    other distributions like SUSE and Mandriva. RPM packages uses files with .rpm
    extension.   


    DEB ian package manager


    This package distribution system was introduced by Debian. Mainly used by Debian
    and Debian based distributions like Ubuntu, Linux Mint and PureOS. It uses files
    with .deb extension.


    Source Code Packages


    Source code packages can be distributed in to two formats


    1.  Tarball files


    Tarball package distribution is conventional type of package distribution. These
    type of packages are available from any third-party software providers and require
    make utility to compile.


    2.  SRPM


    Redhat based distributions provide repositories from  where you can download source
    code of available binaries we call these files as SRPMS or source RPMs. SRPMs
    are rpm packages containing only the source code, rpm spec files which can be
    installed with rpm and then can be compiled or modified manually. 


    Package metadata


    RHEL uses .rpm packages for installing software with rpm command. RPM package
    is simply a file that contains some files and information about those files. Technically
    speaking RPM is a file containing cpio archive and metadata about itself. RPM
    Header contains the metadata and this metadata is used to determine following
    things about the package:-


    *   Description of package.


    *   List of files in the package.


    *   Version and release of package.


    *   When and who made it.


    *   Architecture supported.


    *   Checksums of the files contained in the package.


    *   Dependences.


    Etc…


    Package Management System


    If you try to install single package manually you have to first install all its
    dependences and keep track of versions also. To make software management easy
    Linux companies had developed a system known as package management system or package
    manager. Package management system install precompiled packages, which are archives
    that contains binaries of software, configuration files, and information about
    dependencies. Package management system is a collection of software tools to automate
    the process of installation, upgradation and removal of software packages. Software
    manager maintains its own database of software dependencies and version information.
    Package management system helps in preventing software mismatches and missing
    prerequisites. RHEL uses YUM tool for package management.


    YUM


    Like other Linux distributions, RHEL has very comprehensive package management
    system known as YUM. Y ellow dog U pdater M odifier is command line tool for package
    management. Yum uses repositories to fetch the correct version of a particular
    package compatible for your system. Yum allows automatic updating of packages
    and dependency management. When you use yum command for installation of software,
    it automatically downloads package and all its dependencies from the defined repositories.
    In RHEL version 8 uses YUM v4 instead to YUM v3 used on RHEL 7\. YUM v4 tool,
    which is based on the DNF technology has the following advantages over the previous
    YUM v3 used on RHEL 7:


    *   Better performance


    *   Support for modular content (We will discuss later about modules)


    *   Stable API for integration with tooling


    Modules


    IN RHEL 8 new concept of modules has been introduced. Modules is the extension
    to RPM. A module is set of RPM packages that represent a component. A module typically
    contains application packages, its libraries, dependent packages and documentation
    including help files for these packages. Now in RHEL 8 can contain multiple versions
    of same package for example you can have two versions of python or perl. These
    packages have its own life cycle rather than RHEL life cycle. When you install
    one version of module its dependences and libraries will be automatically installed
    from the module. You can consider module as virtual repository. For handling module
    yum modul e command has been introduced. The modules has extension module after
    rpm like abc.rpm.module.


    Repository


    Yum repository is collection of RPM packages with metadata that is used by Yum
    Command. It is way of distributing content in any Linux Distribution. It can be
    present locally (DVD, directory) or remotely (FTP, HTTP, HTTPS). The package manager
    uses repositories to install, remove, and upgrade packages. The configuration
    file for yum repositories is /etc/yum.conf . To define repositories you can use
    this file. However, it is recommended to create or use existing .repo file in
    the /etc/yum.repos.d/ directory for defining repositories .  Redhat 8 is now distributed
    through two main repositories.


    *   BaseOS


    *   Appstream


    There is no extras channel in RHEL 8. BaseOS and AppStream contains all software
    packages, which were available in extras and optional repositories in earlier
    version of RHEL.


    BaseOS


    BaseOS is intended to provide core set of functionality and core component to
    OS independent all type of installation. Which mean BaseOS repository is required
    for all set of installation even for headless installation.  


    Appstream


    Appstream contains additional userspace applications, languages, databases etc.
    Appstream is intended for different set of workloads. For example if you want
    make this server as http server or want install database. Appstream is updated
    more frequently than BaseOS. Appstream is made up of rpm packages and modules.


    If you think required software is not available in the RedHat repositories, you
    have option to add third party repositories like rpmfusion, epel etc. You can
    easily install various packages by using these third party repositories. Please
    note that these packages are not officially supported by Red Hat, Inc, but provides
    many popular packages and apps. For example epel repository is required to install
    openvpn server.


