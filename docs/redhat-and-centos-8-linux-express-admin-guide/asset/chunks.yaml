    When you want to view a file that is longer than one screen, you can use `more`
    utility. `More` is used for paging through text one screen full at a time.


    ### Syntax

    ```bash

    more filename

    ```


    ### Example

    ```bash

    more /etc/hosts

    ```


    ### less

    `Less` is a program similar to `more`, but it allows backward movement in the
    file as well as forward movement.


    ### Syntax

    ```bash

    less filename

    ```


    ### Example

    ```bash

    less /etc/hosts

    ```


    ### mv

    `mv` command is used to move file from one location to other location. `mv` command
    can also be used to rename the file.


    #### mv command to move file

    ### Syntax

    ```bash

    mv filename destination_directory

    ```


    ### Example

    ```bash

    mv a.txt /tmp/.

    ```

    It will move `a.txt` file from current directory to `/tmp` directory.


    #### To rename

    ### Syntax

    ```bash

    mv filename newfilename

    ```


    ### Example

    ```bash

    mv a.txt b.txt

    ```


    ### grep

    Searches for a String from one or more files. Display each line which has string.


    ### Syntax

    ```bash

    grep string file

    ```


    ### Example

    ```bash

    grep ''127.0.0.1'' /etc/hosts

    ```


    ### head

    Print the first 10 lines of file to standard output. You can also specify how
    many line it will show.


    ### Syntax

    ```bash

    head option file

    ```


    ### Example

    ```bash

    head -20 /tmp/abc.txt

    ```

    This command will show first 20 lines of `abc.txt` file.


    ### tail

    Print the last 10 lines of file to standard output if used without any parameter,
    otherwise you can specify number of lines to display.


    ### Syntax

    ```bash

    tail option file

    ```


    ### Example

    ```bash

    tail -20 /var/log/logfile

    ```

    It will show last 20 lines.


    Use `tail` to monitor dynamic file continuously

    ```bash

    tail -f /var/log/logfile

    ```

    It will show end of growing file. Press `Ctrl +c` to interrupt.


    ### diff

    Compares two Files.


    ### Syntax

    ```bash

    diff First_file Second_file

    ```


    ### Example

    ```bash

    diff abc.txt bbc.txt

    ```


    ### file

    Determine file type


    ### Syntax

    ```bash

    file file_name

    ```


    ### Example

    ```bash

    file bbc.txt

    ```


    ### echo

    Write arguments to the standard output


    ### Syntax

    ```bash

    echo text

    ```


    ### Example

    ```bash

    echo hello

    ```


    ### date

    Print or change the system data and time.


    ### Syntax

    ```bash

    date

    ```


    ### Example

    To check date

    ```bash

    date

    ```

    To set date and time

    ```bash

    date -s "24 feb 2017 19:00"

    ```


    Chapter 24.


    # Piping and Redirection


    In the previous chapter we learned Linux commands in this chapter we will see
    how Linux commands and files can be used in conjunction with one another to turn
    simple commands into much more complex commands. This involves movement of data
    from one command to other command or command to file or file to command.


    This data traveling from command to other command or file to command or command
    to file is known as stream. Stream can be of three types:-


    * Standard input (`stdin`)

    * Standard output (`stdout`)

    * Standard error (`stderr`)


    Normally when user is working on a PC, standard input flows from keyboard of the
    user to standard out that is the monitor, where user gets the output. If there
    are errors in the operation the user will see the standard error on the terminal.
    However, we can change this behavior by using angle brackets and pipes. Some time
    we refer these streams with their corresponding numbers.


    | Stream | Number | Sign | Append |

    | :--- | :--- | :--- | :--- |

    | Stdin | 0 | < | << |

    | stdout | 1 | > | >> |

    | stderr | 2 | 2> | 2>> |


    ### Redirection

    When you want change the normal flow of data we use redirection. You can send
    output of the command to file or device. You can also take input from file or
    device to command.


    #### Sending output to file (`>`)

    Normally, we get our output on the screen, but if we wish to save it into a file,
    then greater than operator (`>`) is used to send the standard out to file. Please
    note this command will overwrite content of the existing output file.


    ### Syntax

    ```bash

    Command > filename

    ```


    ### Example

    ```bash

    ls > abc.txt

    ```


    #### Sending input from file (`<`)

    If we use the less than operator (`<`) then we can read data from file and feed
    it into the program via it''s `STDIN` stream.


    ### Syntax

    ```bash

    Command < filename

    ```


    ### Example

    ```bash

    wc -l < abc.txt

    ```


    #### Sending standard error to file

    If we use `2` with greater than operator (`2>`) then we can send `STDERR` stream
    to a file.


    ### Syntax

    ```bash

    Command or script 2> filename

    ```


    ### Example

    ```bash

    myscript 2>abc.log

    ```


    #### Append

    We have seen that use of the single-bracket command overwrites the prior contents
    of the file. To append the content, we can use double brackets (`>>`) or (`2>>`).


    To append the standard out to existing file or create new one if it is not there

    ### Syntax

    ```bash

    Command >> filename

    ```


    ### Example

    ```bash

    # la -la >> abc.txt

    ```


    To append the stderr stream to file

    ### Syntax

    ```bash

    Command 2>> filename

    ```


    ### Example

    ```bash

    # myscript.sh 2>> abc.txt

    ```


    Sometimes, you might want to redirect both standard output and standard error
    into same file. This is often done in case of automated processes so that you
    can later review the output and errors if any. Use `&>` or `&>>` to redirect both
    standard output and standard error to the same place. Another way is to use the
    numbers of the stream `2>&1`.


    ### Syntax

    ```bash

    Command >outputfile 2>&1

    ```


    ### Example

    ```bash

    ls b* >abc.log 2>&1

    ```


    ### Piping (`|`)

    For sending data from one program to another, we use pipe (`|`)


    ### Syntax

    ```bash

    Command1 | Command2

    ```


    ### Example

    ```bash

    ls | head -10

    ```

    This command will show only 10 lines. This is a simple example of pipe.

    ```bash

    sort abc.txt | uniq

    ```


    Chapter 25.


    # Process and threads

    Every task done by Linux has process associated with it. A task may consist of
    one or more processes. In the simplest terms, process is an executing program.
    A thread is the basic unit to which operating system allocates processor time.
    The idea is to achieve parallelism by dividing a process into multiple threads.
    The primary difference between process and thread is that threads within the same
    process run in shared memory, while processes run in separate spaces. Processes
    have following properties:


    * Process has priority based on context switches.

    * Each process provides required resources to execute.

    * Each process starts with single thread.

    * Process can have multiple threads.

    * Process runs in foreground and background


    #### Processes

    A foreground process is any command or task you run directly and wait for it to
    complete.


    #### Background Process

    Background process are process which runs behind the scene. Unlike with a foreground
    process, the shell does not have to wait for a background process to end before
    it can run more processes. The maximum number of process that can run in background
    depends on amount of available memory.


    | Command | Description |

    | :--- | :--- |

    | bg | Sends job to Background |

    | fg | Bring job to foreground |

    | jobs | Show current jobs |

    | kill | Stops the process |

    | ps | Show the process information |


    If command ends with `&` the shell execute the command in background and shell
    will not wait for finish

    ### Example

    ```bash

    gcaltool &

    ```


    Bring command to foreground

    ```bash

    fg

    ```

    ctrl + c


    Check the running jobs

    ```bash

    jobs

    ```


    List the current running process

    ```bash

    ps -ef

    ```

    or

    ```bash

    ps aux

    ```


    Kill the process forcefully

    First check the process ID with `ps -ef` then

    ```bash

    sudo kill -9 <process –id>

    ```


    Monitoring the process with ps command

    `ps` command show the percentage of CPU & memory utilization of the process it
    is very useful if your machine is underperforming. `ps` command gives you indication
    which process is hogging memory/CPU.


    ### Process scheduling

    Scheduler is part of kernel, which select process to run next. The purpose is
    to run the processes according to priorities. To set the priority of running process
    `nice` and `renice` command is used which decide how longer or smaller CPU time
    is given to process.


    `nice` set the priority or niceness of new process.

    `renice` adjust nice value of running process.


    niceness of -20 is highest priority and 19 is lowest priority. The default priority
    is 0.


    ### Example

    ```bash

    $ sudo nice -n 19 cp -r /as /map

    ```


    Commands show priorities of running processes

    ```bash

    ps -al

    ```

    or

    ```bash

    top

    ```


    To change the priority

    ```bash

    $ sudo renice -n 10 <pid>

    ```

    Note: You need root / superuser privilege to change to higher priority.

