    \ |\n| `get filename` | 将文件下载到本地机器 |\n| `mget files` | 下载多个文件 |\n| `bye` | 退出\
    \ sftp |\n| `! command` | 执行 shell 命令 |\n\n## 示例\n\n### 获取帮助\n```\nsftp> ?\n```\n\
    可用命令：\n- `bye`: 退出 sftp\n- `cd path`: 将远程目录切换到 'path'\n- `chgrp grp path`: 将文件\
    \ 'path' 的组更改为 'grp'\n`[…输出截断.. ]`\n\n### 上传单个文件\n将文件从本地传输到远程机器：\n```\nsftp> put\
    \ xyz.txt\n```\n将 `xyz.txt` 上传到 `/home/user1/xyz.txt`\n`xyz.txt 100% 1508 1.5KB/s\
    \ 00:00`\n\n### 上传多个文件\n```\nsftp> mput *.txt\n```\n正在将 `11.txt` 上传到 `/home/user1/11.txt`\n\
    `11.txt 100% 1663 1.6KB/s 00:00`\n正在将 `a2.txt` 上传到 `/home/user1/a2.txt`\n`a2.txt\
    \ 100% 1715 1.7KB/s 00:00`\n\n### 下载单个文件\n将文件从远程传输到本地机器：\n```\nsftp> get abc.txt\n\
    ```\n正在获取 `/home/user1/abc.txt` 到 `abc.txt`\n`/home/user1/abc.txt 100% 1508 1.5KB/s\
    \ 00:00`\n\n### 下载多个文件\n```\nsftp> mget *.txt\n```\n\n### 切换目录\n要在远程机器上从一个目录切换到另一个：\n\
    ```\nsftp> cd Documents\n```\n在本地机器上：\n```\nsftp> lcd Downloads\n```\n\n### 创建新目录\n\
    在远程机器上：\n```\nsftp> mkdir julli\n```\n在本地机器上：\n```\nsftp> lmkdir David\n```\n\n\
    ### 删除目录\n```\nsftp> rmdir julli\n```\n\n### 退出 sFTP\n```\nsftp> bye\n```\n\n\
    # 第 11 章. VNC\n\n`VNC (Virtual Network Computing)` 是一种图形化桌面共享系统。它用于远程获取 Linux\
    \ 服务器的 GUI 桌面。VNC 包含两个部分：一个是 `VNC server`，另一个是 client `VNC client`。`VNC server`\
    \ 运行在 RHEL 服务器上，而客户端运行在 MS Windows 或 Linux 工作站上。`X Server` 运行在 RHEL 服务器上，而 `VNC\
    \ client` 仅显示显示器的副本。\n\n## 在想要共享桌面的服务器上配置 VNC\n\n1. **安装**\n   ```bash\n   yum\
    \ install tigervnc-server\n   ```\n\n2. **设置 VNC 密码**\n   语法：\n   ```bash\n  \
    \ su - user_name\n   vncpasswd\n   ```\n   示例：`![](img/Image00054.jpg)`\n\n3.\
    \ **创建文件 `/etc/systemd/system/vncserver@.service`**\n   ```bash\n   vi /etc/systemd/system/vncserver@.service\n\
    \   ```\n   在此文件中添加以下行。请确保将用户名、组和主目录替换为上一步中设置密码密码的用户和主目录。\n\n```ini\n[Unit]\n\
    Description=远程桌面 VNC 服务\nAfter=syslog.target network.target\n\n[Service]\nType=forking\n\
    WorkingDirectory=/home/admin\nUser=admin\nGroup=admin\nExecStartPre=/bin/sh -c\
    \ '/usr/bin/vncserver -kill %i > /dev/null 2>&1 || :'\nExecStart=/usr/bin/vncserver\
    \ -autokill %i\nExecStop=/usr/bin/vncserver -kill %i\n\n[Install]\nWantedBy=multi-user.target\n\
    ```\n\n4. **在显示数字为 1 的端口启动并启用 VNC 服务**\n   ```bash\n   systemctl start vncserver@:1.service\n\
    \   systemctl enable vncserver@:1.service\n   ```\n\n5. **验证 VNC 服务是否在 5901 端口**\n\
    \   ```bash\n   netstat -tunlp | grep 5901\n   ss -tunlp | grep 5901\n   ```\n\
    \   **开启防火墙端口**\n   ```bash\n   firewall-cmd --permanent --add-port=5901/tcp\n\
    \   firewall-cmd --reload\n   ```\n\n6. 在 Windows 7/10 工作站从 tigervnc 网站下载 `vncviewer`。\n\
    \n7. 运行下载的文件，它将提示 vnc 服务器的 IP 地址和显示数字。按 `IPAddress:DisplayNumber` 格式输入 IP 地址和显示数字后，点击连接。\n\
    \   `![](img/Image00054.jpg)`\n\n8. `![](img/Image00054.jpg)` 9. `![](img/Image00054.jpg)`\
    \ 虚拟\n\n# 第 12 章. Web\n\nHTTP（文本传输协议）\n\n"
