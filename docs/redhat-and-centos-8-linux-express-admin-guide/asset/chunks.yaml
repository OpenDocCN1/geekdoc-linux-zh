  trans: "\n如果出现需要将整个卷组（Volume Group）从一个系统移动到另一个系统的情况。可能是由于当前系统的某些硬件问题，或者为了将旧存储迁移到新硬件，可以使用以下步骤。在这个示例中，有两个系统：一个是当前\
    \ `VG` 所在的旧系统，另一个是你想要移动到的新系统。\n\n### 在旧系统上\n\n1. 卸载所有属于该卷组的文件系统\n```bash\numount\
    \ /newfs\n```\n\n2. 使用 `vgchange -an VG_name` 命令停用 VG\n```bash\n[root@RHEL1 /]#\
    \ vgchange -an sharedvg\n```\n\n3. 使用 `vgexport VG_name` 命令导出 VG\n```bash\n[root@RHEL1\
    \ /]# vgexport sharedvg\n```\n\n### 在新系统上\n\n4. 将 HDD 连接到新系统后，使用 `vgimport VG_name`\
    \ 命令导入 VG\n```bash\n[root@RHEL2 ~]# vgimport sharedvg\n```\n\n5. 使用 `vgchange\
    \ -ay VG_name` 激活 VG\n```bash\n[root@RHEL2 ~]# vgchange -ay sharedvg\n```\n\n\
    6. 在 VG 上挂载文件系统\n```bash\n[root@RHEL2 ~]# mount /dev/sharedvg/sharedlv /mnt\n\
    ```\n\n7. 检查文件系统内容\n```bash\n[root@RHEL2 ~]# cd /mnt\n```\n\n### 扩展文件系统\n\n1.\
    \ 检查当前 FS 大小\n```bash\ndf -h /fsname\n/dev/mapper/vg01-lv01      1008M  34M  924M\
    \  4% /newfs\n```\n\n2. 检查是否有足够的空空间空间即你想要扩展的 FS 所在的 VG 是否空闲 PE。\n```bash\n# vgdisplay\
    \ vg01\n  --- Volume group ---\n  VG Name             vg01\n  System ID\n  Format\
    \               lvm2\n  Metadata Areas        1\n  Metadata Sequence No  5\n \
    \ VG Access            read/write\n  VG Status            resizable\n  MAX LV\
    \               0\n  Cur LV               1\n  Open LV              1\n  Max PV\
    \               0\n  Cur PV               1\n  Act PV               1\n  VG Size\
    \              5.00 GiB\n  PE Size              4.00 MiB\n  Total PE         \
    \    1280\n  Alloc PE / Size      256 / 1.00 GiB\n  Free PE / Size       1024\
    \ / 4.00 GiB\n```\n\n3. 使用 `lvextend -L size /dev/vgname/lvname` 扩展逻辑卷\n```bash\n\
    # lvextend -L +200M /dev/vg01/lv01\n```\n\n4. 使用 `xfs_growfs /fsname` 扩展文件系统\n\
    ```bash\n# xfs_growfs /newfs\n```\n\n5. 检查 FS 大小\n```bash\ndf -h /fsname\n/dev/mapper/vg01-lv01\
    \  1.2G  34M  1.1G \n```\n\n### 缩小文件系统\n\n1. 检查当前 FS 大小\n```bash\ndf -h /fs_name\n\
    /dev/mapper/vg01-lv01  1.2G  34M  1.1G \n```\n\n2. 备份文件系统\n```bash\n# xfsdump\
    \ -f /tmp/newfs.dump /newfs\n```\n\n3. 卸载文件系统\n```bash\numount /fs_name\n# umount\
    \ /newfs\n```\n\n4. 移除 LV\n```bash\n# lvremove /dev/mapper/vg01-lv01\n```\n\n\
    5. 重新创建 LV\n```bash\n# lvcreate -n lv01 -L1G vg01\n```\n\n6. 重新创建文件系统\n```bash\n\
    # mkfs.xfs /dev/vg01/lv01\n```\n\n7. 检查 UUID\n```bash\n# blkid /dev/vg01/lv01\n\
    ```\n\n8. 在 `/etc/fstab` 中修改文件系统的 UUID\n\n9. 挂载文件系统\n```bash\n# mount -a\n```\n\
    \n10. 恢复备份\n```bash\nxfsrestore -f /tmp/newfs.dump /newfs\n```\n\n11. 检查文件系统\n\
    ```bash\n# df -h /newfs\n```\n\n# NFS\n\n`NFS`（网络文件系统）是一种文件共享文件系统，基于服务器/客户端模式工作。服务器的共享文件系统挂载在客户端上。\n\
    \nNFS 有四个版本：\n1. NFS V1\n2. NFS V2\n3. NFS V3\n4. NFS V4\n\n其中 `NFS V3` 和 `NFS\
    \ V4` 是较新的 NFS 版本，`V3` 更安全且基于 UDP 协议，而 `V4` 增加了通过防火墙运行的优势并基于 TCP 运行。\n\n要让客户端可以使用共享文件系统，必须从服务器进行导出。在\
    \ NFS 服务器上配置导出的方法有两种方法：\n* 通过 `/etc/exports` 配置文件。\n* 在命令行中显式地使用 `exportfs` 工具，但这种方法在每次重启后都需要重新执行。\n\
    \n### 在服务器上配置 NFS\n\n安装包\n```bash\n# yum install nfs-utils\n# yum install rpcbind\n\
    ```\n\n启动服务\n```bash\n# systemctl start rpcbind\n# systemctl start nfs-server\n\
    ```\n\n让服务在下次重启时启动\n```bash\n# systemctl enable rpcbind\n# systemctl enable nfs-server\n\
    ```\n\n手动不通过 `/etc/exports` 导出文件系统\n```bash\n# exportfs -i /user1\n```\n\n使用 `/etc/exports`\
    \ 导出文件系统\n编辑 `/exports` 文件以添加要向客户端共享的文件系统，格式如下：\n`mountpoint [host][permissions/options]`\n\
    \n其中：\n* `mountpoint` 是要导出的文件系统。\n* `host` 是可选的，你想授予访问权限的客户端。\n* `permissions`\
    \ 是可选的，可以是 `ro` 只读、`rw` 读写、`sync` 在命令完成前写入。\n\n示例：\n`/software/c1 192.168.10.12(rw,sync)`\n\
    \n导出文件系统\n```bash\n# exportfs -a\n```\n\n查看已导出的文件系统\n```bash\n# showmount -e\n\
    ```\n\n配置防火墙允许客户端访问 NFS 服务器\n```bash\nfirewall-cmd --permanent --zone public --add-service\
    \ mountd\nfirewall-cmd --permanent --zone public --add-service rpc-bind\nfirewall-cmd\
    \ --permanent --zone public --add-service nfs\n```\n\n第 21 章 移动卷组\n\n如果出现需要将整个卷组从一个系统移动到另一个系统的情况。可能是由于当前系统的某些硬件问题，或者为了将旧存储迁移到新硬件，可以使用以下步骤。在这个示例中，有两个系统：一个是当前\
    \ `VG` 所在的旧系统，另一个是你想要移动到的新系统。\n"
