    # xfsrestore


    `xfsrestore` 命令用于恢复使用 `dump` 命令创建的备份。


    ## 语法

    ```bash

    xfsrestore <options> backupdevice target

    ```


    ## 示例

    恢复存储在 `/dev/st0` 设备上的备份

    ```bash

    xfsrestore -f /dev/st0 /home1

    ```


    ### 选项说明

    - `-f` 用于设备名称


    # 第 15 章 归档与压缩


    归档是将一组文件和目录收集并存储到一个文件过程，`Tar`、`cpio`、`zip` 和 `ar` 是执行此操作的实用示例。而压缩是使用数学压缩算法减小文件的大小。这在通过互联网发送大文件时非常有用。压缩工具的示例有
    `gzip`、`bzip2`、`xz` 等。


    ## GZIP

    使用 `gzip` 可以压缩和解压单个文件。当你使用 `gzip` 命令压缩任何文件时，该文件将被替换为扩展名为 `.gz` 的文件，并保持相同的所有权模式、访问和修改时间。简单来说，你将看不到原始文件，只有压缩后的文件。


    ### 语法

    ```bash

    gzip filename

    ```


    ### 示例

    ```bash

    gzip sysctl.conf

    ```


    ### 解压

    使用 `gunzip` 命令解压压缩文件。然而，此命令会删除压缩文件，你只会看到解压后的文件。


    ### 语法

    ```bash

    gunzip filename

    ```


    ### 示例

    ```bash

    gunzip sysctl.conf.gz

    ```


    ## BZIP2

    `bzip` 使用名为 Burrows Wheel 块排序的压缩算法压缩文件。像 `gzip` 一样，它会删除原始文件并创建一个相同名称加 `.bz2` 扩展名的压缩文件。每个压缩文件与相应的原始文件具有相同的修改日期、权限，如果可能还具有相同的所有权。


    ### 语法

    ```bash

    bzip2 filename

    ```


    ### 示例

    ```bash

    bzip2 sysctl.conf

    ```


    ### 解压

    使用 `bunzip2` 解压用 `bzip2` 命令压缩的文件。默认情况下，如果存在同名文件，它不会覆盖，除非你提供了 `-f` 选项。


    ### 语法

    ```bash

    bunzip2 filename

    ```


    ### 示例

    ```bash

    bunzip2 sysctl.conf.bz2

    ```


    ## XZ

    `xz` 是 `lzma` 工具的继承者，它会自动为压缩文件添加 `.xz` 扩展并删除原始文件。像 `bzip` 和 `gzip` 一样，它将保持与原始文件相同的修改日期、权限，如果可能还具有相同的所有权。


    ### 语法

    ```bash

    xz filename

    ```


    ### 示例

    ```bash

    xz sysctl.conf

    ```


    ### 解压

    ### 语法

    ```bash

    unxz filename

    ```


    ### 示例

    ```bash

    unxz sysctl.conf.xz

    ```


    ## ZIP

    `Zip` 归档和压缩工具。它创建扩展名为 `.zip` 的文件。它是跨平台压缩工具，因此你可以从 Linux 到 Windows 压缩解压文件，反之亦然。它会保持原始文件完整。


    ### 语法

    ```bash

    zip zipfile.zip file/files_to_compress

    ```


    ### 示例

    ```bash

    zip abc.zip sysctl.conf signond.conf

    ```

    你也可以配合通配符使用 `zip`

    ```bash

    zip abc.zip s*

    ```


    ### 递归压缩文件（包含子目录）

    ### 语法

    ```bash

    zip -r zipfile.zip directoryname

    ```


    ### 示例

    ```bash

    zip -r asp.zip monk

    ```


    ### 列出压缩文件的内容

    ### 语法

    ```bash

    unzip -l zipfile.zip

    ```


    ### 示例

    ```bash

    unzip -l asp.zip

    ```


    ### 解压

    使用 `unzip` 命令解压用 `zip` 命令压缩的压缩。


    ### 语法

    ```bash

    unzip zipfile.zip

    ```


    ### 示例

    ```bash

    unzip asp.zip

    ```


    ## ar

    `ar` 是 `rar` 不为人知的先驱，`rar` 在 RHEL 中仍在在使用。它仅用于归档，因为它本身没有压缩。


    ### 创建归档

    ### 语法

    ```bash

    ar cvsr archivefile.a files_to_archive

    ```


    ### 示例

    ```bash

    ar cvsr abc.a s*

    ```


    ### 提取归档

    ### 语法

    ```bash

    ar xv archivefile.a

    ```


    ### 示例

    ```bash

    ar xv abc.a

    ```


    有很多可以安装的第三方工具，你可以尝试以下：

    - `peazip`

    - `p7zip`

    - `pax`

    - `kgb`

    等更多..


    # 第 16 章 防火墙


    根据字典，防火墙是旨在抑制或防止火灾蔓的墙或隔层。在计算机世界中，防火墙是用于保护入站和出站连接的网络安全系统。它防止未经授权的访问。限制用户仅访问指定的服务。


    ## nftables

    在 Redhat 的早期版本中，`iptables` 用于数据包过滤，但在 Redhat 8 中它被 `nftables` 取代了。它是所有 `iptables`
    框架（如 `iptables`、`ip6tables`）的单一工具。


    ## Firewallld

    `Firewalld` 是动态防火墙管理器。它使用区域（zones）和服务（services）。它将配置存储在 `/etc/firewalld/` 和 `/usr/lib/firewalld/`
    中。


    ### 安装 fireld

    ```bash

    yum install firewalld

    ```


    ### 检查状态

    ```bash

    systemctl status firewalld

    ```

    或者

    ```bash

    firewall-cmd --state

    ```


    ## Firewallld 概念

    ### 配置选项

    firewalld 的规则可以指定为永久性（Permanent）或运行时（Runtime）。运行时更改是立即生效但非永久的防火墙设置更改。永久性更改写入配置文件，但除非重新加载或重启机器，否则不会立即应用。


    ### 区域 (Zones)

    在 firewalld 中，区域的概念是基于网络接口的。所有网络接口都可以位于同一个默认区域，或者根据定义的信任级别划分到不同的区域。默认使用 `public`
    区域。


    ## 区域列表说明

    - `Drop`: 丢弃所有入站连接，仅可用出站网络连接。

    - `Block`: 仅允许出站网络连接。使用 `icmp-host-prohibited` 消息拒绝所有入站连接。

    - `Public`: 你信任网络上的其他计算机。只接受选定的入站连接。用于公共区域。

    - `Home`: 仅接受选定的入站连接。用于家庭区域。

    - `Work`: 你大部分信任网络上的其他计算机。只接受选定的入站连接。用于工作区域。

    - `DMZ`: 用于 DMZ 非军事化区的计算机，这些计算机可公开访问但访问内部网络有限，只接受选定的入站连接。

    - `External`: 用于启用了伪装（masquerading）的外部网络。只接受选定的入站连接。

    - `Internal`: 用于内部网络。你大部分信任网络上的其他计算机。只接受选定的入站连接。

    - `Trusted`: 所有网络连接。


    ## Zones 命令

    列出可用区域

    ```bash

    firewall-cmd --get-zones

    ```

    显示默认区域

    ```bash

    firewall-cmd --get-default-zone

    ```


    更改默认区域

    ```bash

    firewall-cmd --set-default-zone=internal

    ```


    检查接口关联的区域

    ```bash

    firewall-cmd --get-zone-of-interface=ens33

    ```


    '
- fmt: '

    Where `ens33` is interface name you can check this using `ip add show` command.


    ## Change the zone of the interface


    ```bash

    firewall-cmd --permanent --zone=internal --change-interface= ens33

    ```


    ## Services


    Firewalld services allows network traffic based on predefined rules. A `Firewalld`
    service can be a list of local ports, protocols and destinations. You can also
    create your own custom rules for services. The `/usr/lib/firewalld/services` directory
    contains configuration files for default supported services and custom service
    files created by users are located in `/etc/firewalld/services` directory.


    ### List of services in the default zone

    ```bash

    firewall-cmd --list-services

    ```


    ### Add a service permanently to default zone


    #### Syntax

    ```bash

    firewall-cmd --permanent --add-service=servicename

    ```


    #### Example

    ```bash

    firewall-cmd --permanent --add-service=http

    ```


    After that, you have to reload the new configuration

    ```bash

    firewall-cmd --reload

    ```


    ### Add service to specific zone

    ```bash

    firewall-cmd --permanent --zone=internal --add-service=http

    ```


    ## Port


    Firewalld allows us to manage the network port directly.


    ### List of ports in the default zone

    ```bash

    firewall-cmd --list-ports

    ```


    ### Opening Port in the Firewall

    To open up a new port (e.g., `TCP/5903`) permanently, use these commands.


    ```bash

    firewall-cmd --permanent --zone=public --add-port=5903/tcp

    ```


    Then reload the configuration

    ```bash

    firewall-cmd --reload

    ```


    ### Check the new configuration

    ```bash

    firewall-cmd --list-ports

    ```


    ## Firewall configuration using GUI


    If you do not like to use commands, Redhat also provides GUI interface for configuration
    of firewall.


    ### Installation

    If GUI firewall is not already installed it can be installed with following command

    ```bash

    yum install firewall-config

    ```


    There are two version of firewall interface, the first one is a version that runs
    under Gnome, and second one works on the command line. Here we will discuss Gnome
    version.


    ### To start the GUI login as root on Gnome terminal

    1. Run terminal window.

    2. In the terminal windows write following command

    ```bash

    firewall-config

    ```

    ![](Image00060.jpg) It will open firewall interface


    ## Changing the Firewall Settings


    ### Changing Configuration

    When you start the interface, Runtime configuration is selected from the configuration
    dropdown menu for immediate change in the current firewall settings, Alternatively
    to apply the setting on next system start or firewall configuration reload , select
    `Permanent` from the drop-down list.


    ### Change zone of Connection

    To configure or add connection to a zone start `firewall-config`, from the option
    menu select `Change zone of connections`. It will show sub menu with list of connections
    available, select the desired connection from the dropdown menu. From next dropdown
    menu, select the `Zone`.


    ![](Image00061.jpg)

    ![](Image00062.jpg) Set default zone

    ![](Image00063.jpg) ![](Image00064.jpg) To set the default zone for new interface
    or change the default zone for a existing interface, start `firewall-config`,
    First select the desired connection then select `Options` from the menu bar, and
    select `Change Default Zone` from the drop-down menu. Now select the require zone
    from the list Menu.


    ### Configuring services

    `Firewall-config` tool provides interface to enable and disable predefined or
    custom services.

    1. select the configuration type `permanent` or `runtime`

    2. Select `zone`.

    3. Select or deselect the service check box. Selected check box means service
    is enabled and cleared (un-selected) checkbox is to block the service.

    ![](Image00065)


    ## Partition


    Hard disk or drive is piece of hardware installed in your PC or server that stores
    data and provides quick access to large amounts of data on electromagnetically
    charged surface or chips. Today capacity of hard disk can be in gigabytes and
    terabytes of storage. Hard disk can be attached internally or externally. With
    ever increasing capacity of hard disk you are tempted to install more than one
    Operating system on the same machine, for that partitioning of hard disk. Partitioning
    is also useful in keeping Operating system, application and data separate for
    better management.


    ### Partitions

    Partition in computer language is to divide the storage, mostly hard disk into
    segments in which you have more than one systems. Partitioning of storage helps
    in better management and easy backup. There are variety of tools available in
    Linux for storage like `fdisk`, `parted` etc. We will discuss main tools `fdisk`
    and `parted`.


    ### fdisk

    `fdisk` is a powerful and most popular command line tool used for partition management.
    It is a text based menu-driven program for creation and manipulation of partition
    tables. It supports multiple types of partition formats, including MS-DOS and
    GPT. It provides interface to display, create, resize, delete and modify partitions
    on disks.


    #### fdisk for partition management

    ##### List the partition table

    ```bash

    fdisk -l

    ```

    ##### List the partition table for specific Syntax

    ```bash

    fdisk -l <device name>

    ```


    #### Example

    Create new partition on device In this example `/dev/sdb` is added to system:

    1. First print the list of all storage devices and check the device name for the
    device which you want to create partition

    ```bash

    fdisk -l

    ```

    Output:

    `Disk /sdb: 21.5 GB, 21474836480 bytes, 41943040 sectors`

    `Units = sectors of 1 * 512 = 512 bytes`

    `Sector size (logical/physical): 512 bytes / 512 bytes`

    `----Output is truncated -----`


    2. Run `fdisk` on required device

    ```bash

    fdisk /dev/sdb

    ```

    3. Print the partition table of selected device

    Press `p` and enter key

    ```bash

    p

    ```

    Output:

    `Disk /sdb: 21.5 GB, 21474836480 bytes, 255 heads, 63 sectors/track, 2610 cylinders,
    total 41943040 sectors`

    `Units = sectors of 1 * 512 = 512 bytes`

    `Sector size (logical/physical): 512 bytes / 512 bytes`

    `I/O size (minimum/optimal): 512 bytes / 512 bytes`

    `Disk identifier: 0xdecee90`

    `Device Boot Start End Blocks Id System`

    `Output shows no present on sdb device`


    4. Press `n` to create new partition

    ```bash

    n

    ```

    5. Press `p` to set partition type as primary or Press `e` for extended partition

    ```

    e extended

    p primary partition (1-4) p

    ```

    6. Give partition number like 1, 2, 3, 4. If it is first partition on this device
    then press 1 for second partition press 2 like that

    ```

    Partition number (1-4): 1

    ```

    7. Press `enter` to use default starting sector or you can enter desired value
    if you do not want to start from the default sector

    ```

    First sector (2048-41943039, default 2048): 2048

    ```

    Using default value

    8. For last sector, if you can calculate the size with sector numbers you can
    give sector number, otherwise you can give size in human readable value like `+1G`
    to create 1 GB partition. If you press Enter without any value it will create
    partition on whole remaining space on the device

    ```

    Last sector, +sectors or +size{K,M,G} (2048-41943039, default 41943039): +1G

    ```

    9. Press `w` to write on disk

    ```

    w

    ```


    ### Delete the partition

    To delete partition present on disk drive using `fdisk` following procedure is
    there. In this example device name is `/dev/sdb` and we want to delete the `/dev/sdb2`
