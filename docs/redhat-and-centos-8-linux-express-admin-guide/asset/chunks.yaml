    CodeReady Linux Builder Repository


    Redhat provides BaseOS and Appstream repos by default in all type of subscriptions,
    both repositories are enabled by default. In addition to the BaseOS and Appstream
    repos, a new repository CodeReady has been added for developers. All subscriptions
    include access to the new CodeReady Linux Builder repository. As the name implies,
    CodeReady Linux Builder is for developers who develop linux application using
    Red Hat Enterprise Linux infrastructure. It includes packages specifically for
    developers to use when building their applications. CodeReady Linux Builder is
    repository similar to optional repository found in the previous version of Redhat
    enterprise Linux. the CodeReady Linux Builder contains build tooling and -devel
    packages. Although Red Hat provides updates and maintain contents in CodeReady
    Linux Builder during the life of Red Hat Enterprise Linux 8, but packages in CodeReady
    Linux Builder are not supported by RedHat. Therefore Developers are encouraged
    to use the content for application building purpose only and should use with caution
    in production environment. The example of additional packages can be additional
    libraries for perl which are not commonly used.


    Enabling the Repository


    To enable the repository, you can use subscription-manager command:


    # subscription-manager repos --enable codeready-builder-for-rhel-8-x86_64-rpms


    To list the modules of codeready-builder repository


    yum module list --disablerepo=* --enablerepo=codeready-builder-for-rhel-8-x86_64-rpms


    Enable third party repository


    As redhat is open source project there is very few limitation for availability
    of software. If software you require is not available in the BaseOS, Appstream
    and codeready repository you can install third party repositories which provide
    required software. The reason for non-availability of the software can be the
    license issues. These third party repositories can be added in many ways. One
    way is to install repo file other is to create own repo file and third way is
    to install the rpm package supplied by the repository site for adding repository.
    Simple example for requirement of third party repository can be proprietary codecs,
    software which do not adhere GPL and open source license. For demonstration purpose
    we will install third party repository Extra Packages for Enterprise Linux (or
    EPEL) repository which is maintained by Fedora Special Interest Group. Installing
    and enabling EPEL repository is very simple in RHEL. Use yum command to install
    package epel-release


    # yum install https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm


    Now check it


    # yum repolist enabled


    When you using EPEL repository it is advisable to enable codeready repository
    as some software may have dependences in the codeready.


    Other than EPEL there are other very famous third party repositories are there
    like rpmfusion, REMI, ELRepo, NUX-dextop etc.


    Manually adding repository


    As mentioned earlier you can also add repository by manually creating repo file.
    Repository configuration files for yum repositories are located in /etc/yum.repos.d
    / directory having .repo extension. This repository configuration file has following
    options :-


    repo file


    | Repository ID | One word unique repository ID |


    | Name | Human readable string describing the repository |


    | Baseurl | URL to the repodata directory of repository is located. |


    | Gpgcheck | Enable/disable GPG signature checking |


    | Gpgkey | URL to the GPG key file for a repository |


    | Exclude | List of the packages to exclude |


    | Includepkgs | List of packages that yum can see |


    | Enabled | Enable/Disable repository |


    Minimum required fields are:


    *   Repository ID


    *   Name


    *   Baseurl


    *   Enabled


