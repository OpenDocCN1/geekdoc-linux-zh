    6. 提供所需的十六进制代码，在本例中为 `8e`。\n7. 按下 `w` 写入更改。\n\n```bash\n[root@RHEL2 ~]# fdisk\
    \ -l /dev/sdb\n\nDisk /dev/sdb: 21.5 GB, 21474836480 bytes, 41943040 sectors\n\
