    Chapter 20.              


    # Logical Volume Manager


    In earlier section we have learned about creating Linux partition but Linux provides
    option to create partition type as LVM (logical partition manager). LVM is more
    sophisticated than normal Linux partition. LVM offers following benefits


    -           Increase the File system dynamically


    -           Shrink the File system


    -           Add disk dynamically


    -           Mirroring


    -           Stripping


    -           Snapshot as backup of File system


    Terms used in LVM


    Physical Volume


    Physical Volume (PV) is physical storage unit of an LVM is a block device such
    as a partition or whole disk. To use the device for an LVM create partition with
    fdisk as LVM type.             


    Volume Groups


    One or more physical volumes combined into Volume Group (VG). Volume group is
    an abstract that presents underlying devices as a unified logical device with
    combined storage capacity of the physical volumes


    Physical Extent


    Storage space from Physical Volume is divided in to small unit of fixed size known
    as physical extent, which is smallest unit that can be allocated. P.E. size is
    always same for all physical volume in the same VG.


    Logical extent


    Mapping of PE to make up frontend of LVM. By default, one PE is generally mapped
    to one LE. However, you can map more than one PE to one LE in case of mirroring.


    Logical Volume


    Logical volume is group of Logical Extent. It is here we create File system. Logical
    volume is not restricted to physical disk sizes. In additionto that, the hardware
    storage layer is isolated from software.  


    Steps to create File system on new disk added to the system


    1.  Create Physical volume (PV)


    Scan the new disk


    If you plugged the hot swap disk or added the virtual disk to virtual machine
    while machine is running, to detect the new disk on the SCSI bus use following
    script. This script is to avoid server restart, if you can reboot the machine
    this step is not required as during boot process system will automatically add
    the newly installed disk. 


    for host in `ls /sys/class/scsi_host/`;do


    echo "- - -" >/sys/class/scsi_host/${host}/scan;


    done


    Change disk partition as LVM


    Use fdisk command and create partition type Linux LVM 8e. This step can be ignored
    if whole disk is used as PV.


