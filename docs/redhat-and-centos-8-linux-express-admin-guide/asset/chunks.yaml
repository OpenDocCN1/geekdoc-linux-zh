    \ `vgchange -an VG_name` command\n```bash\n[root@RHEL1 /]# vgchange -an sharedvg\n\
    ```\n\n3. Export the VG with `vgexport VG_name` command\n```bash\n[root@RHEL1\
    \ /]# vgexport sharedvg\n```\n\n### On the New System\n\n4. After attaching HDD\
    \ to new system, import the VG with `vgimport VG_name` command\n```bash\n[root@RHEL2\
    \ ~]# vgimport sharedvg\n```\n\n5. Activate the VG with `vgchange -ay VG_name`\n\
    ```bash\n[root@RHEL2 ~]# vgchange -ay sharedvg\n```\n\n6. Mount the file systems\
    \ on the VG\n```bash\n[root@RHEL2 ~]# mount /dev/sharedvg/sharedlv /mnt\n```\n\
    \n7. Check the contents of file system\n```bash\n[root@RHEL2 ~]# cd /mnt\n```\n\
    \n### Extending File System\n\n1. Check the current FS size\n```bash\ndf -h /fsname\n\
    /dev/mapper/vg01-lv01      1008M  34M  924M  4% /newfs\n```\n\n2. Check if you\
    \ have enough free space i.e. free PE on the VG where LV of FS you want extend\
    \ is there.\n```bash\n# vgdisplay vg01\n  --- Volume group ---\n  VG Name    \
    \         vg01\n  System ID\n  Format               lvm2\n  Metadata Areas   \
    \     1\n  Metadata Sequence No  5\n  VG Access            read/write\n  VG Status\
    \            resizable\n  MAX LV               0\n  Cur LV               1\n \
    \ Open LV              1\n  Max PV               0\n  Cur PV               1\n\
    \  Act PV               1\n  VG Size              5.00 GiB\n  PE Size        \
    \      4.00 MiB\n  Total PE             1280\n  Alloc PE / Size      256 / 1.00\
    \ GiB\n  Free PE / Size       1024 / 4.00 GiB\n```\n\n3. Extend the Logical Volume\
    \ `lvextend -L size /dev/vgname/lvname`\n```bash\n# lvextend -L +200M /dev/vg01/lv01\n\
    ```\n\n4. Extend the file system using `xfs_growfs /fsname`\n```bash\n# xfs_growfs\
    \ /newfs\n```\n\n5. Check the FS size\n```bash\ndf -h /fsname\n/dev/mapper/vg01-lv01\
    \  1.2G  34M  1.1G \n```\n\n### Reduce the File System\n\n1. Check the current\
    \ FS size\n```bash\ndf -h /fs_name\n/dev/mapper/vg01-lv01  1.2G  34M  1.1G \n\
    ```\n\n2. Backup the File System\n```bash\n# xfsdump -f /tmp/newfs.dump /newfs\n\
    ```\n\n3. Unmount the File system\n```bash\numount /fs_name\n# umount /newfs\n\
    ```\n\n4. Remove the LV\n```bash\n# lvremove /dev/mapper/vg01-lv01\n```\n\n5.\
    \ Recreate LV\n```bash\n# lvcreate -n lv01 -L1G vg01\n```\n\n6. Recreate the File\
    \ system\n```bash\n# mkfs.xfs /dev/vg01/lv01\n```\n\n7. First check the UUID\n\
    ```bash\n# blkid /dev/vg01/lv01\n```\n\n8. Change the UUID of File system in `/etc/fstab`\n\
    \n9. Mount File System\n```bash\n# mount -a\n```\n\n10. Restore the backup\n```bash\n\
    xfsrestore -f /tmp/newfs.dump /newfs\n```\n\n11. Check File System\n```bash\n\
    # df -h /newfs\n```\n\n# NFS\n\n`NFS` (Network File System) is file sharing file\
    \ system, which works on server client basis. Server’s shared file systems are\
    \ mounted on clients.\n\nFour version of NFS are there:\n1. NFS V1\n2. NFS V2\n\
    3. NFS V3\n4. NFS V4\n\nWhere `NFS V3` and `NFS V4` are more recent version of\
    \ NFS, `V3` is safer and works on UDP protocol while `V4` has added advantage\
    \ of working through firewall and works on TCP.\n\nTo make shared file system\
    \ available on the client it has be exported from server. For exporting there\
    \ are two ways to configure exports on an NFS server:\n* Through `/etc/exports`\
    \ configuration file.\n* Explicitly Using the `exportfs` utility on the command\
    \ line, but this way you have to do every time after reboot.\n\n### Configure\
    \ NFS on the server\n\nInstall packages\n```bash\n# yum install nfs-utils\n# yum\
    \ install rpcbind\n```\n\nStart the services\n```bash\n# systemctl start rpcbind\n\
    # systemctl start nfs-server\n```\n\nMake service start on next reboot\n```bash\n\
    # systemctl enable rpcbind\n# systemctl enable nfs-server\n```\n\nTo export file\
    \ system without `/etc/exports` manually.\n```bash\n# exportfs -i /user1\n```\n\
    \nTo export file system using `/etc/exports`\nEdit `/etc/exports` file to add\
    \ file systems you want to share to clients format of that is:\n`mountpoint [host][permissions/options]`\n\
    \nwhere:\n* `mountpoint` is file systems you want export\n* `host` is optional,\
    \ the client you want to give access the filesystems\n* `permissions` is optional\
    \ it can be `ro` read only, `rw` read write, `sync` changes written before command\
    \ finished.\n\nExample:\n`/software/c1 192.168.10.12(rw,sync)`\n\nExport file\
    \ system\n```bash\n# exportfs -a\n```\n\nSee the file system exported\n```bash\n\
    # showmount -e\n```\n\nConfigure firewall to allow NFS server to clients\n```bash\n\
    firewall-cmd --permanent --zone public --add-service mountd\nfirewall-cmd --permanent\
    \ --zone public --add-service rpc-bind\nfirewall-cmd --permanent --zone public\
    \ --add-service nfs\n```\n\nConfigure NFS server to clients\n```bash\n# showmount\
    \ -e 192.168.10.12\n```\n\nTo export all exported\n```bash\n# exportfs -u\n```\n\
