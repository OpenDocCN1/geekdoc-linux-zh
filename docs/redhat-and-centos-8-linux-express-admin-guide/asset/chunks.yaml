- fmt: "\nAutomation of task is very important in computer field. Suppose you have\
    \ to take daily backup at 11.00 O’clock in the night when there is no usage of\
    \ system. Then you have to come in night to take backup. However, you can schedule\
    \ your backup then computer will run the backup script at 11.00 o’clock in night\
    \ automatically. In the morning you can verify the backup. RHEL provides many\
    \ utilities to automate the task. These utilities can be used to automate the\
    \ tasks which system administrators do regularly or at specified time. Following\
    \ are the main utilities:\n\n* `cron` \n* `at`\n* `batch`\n\n## cron\n\n`cron`\
    \ is daemon that can be used to schedule the execution of recurring tasks according\
    \ to time, day of month, day of week.\n\n### Configuration file\n`/etc/crontab`\n\
    \n### Command Description\n* `crontab –l` List crontab entries\n* `crontab –e`\
    \ Edit crontab\n* `crontab –r` Remove crontab\n\n### Format\n`minutes hours Day_of_month\
    \ Month Day_of_week Command`\n\n### Where\n* Minutes (from 0 to 59)\n* hours (from\
    \ 0 to 23)\n* day of month (from 1 to 31)\n* month (from 1 to 12)\n* day of week\
    \ (from 0 to 6) (0=Sunday)\n\n### To schedule a recurring task\n1. Edit crontab\
    \ by giving command `crontab -e`\n2. Add entries at bottom of file press `i` (Note\
    \ this files will open in `vi` editor so you can use all `vi` commands)\nSuppose\
    \ you want to run backup script every night at 11:30:\n```\n30 23 * * * /myscripts/backup.sh\n\
    ```\n3. Press `ESCAPE` and press `: write x` after that press `ENTER` to save\
    \ the entry.\n\n## at and batch\n\n`crontab` is used for recurring task but for\
    \ one time tasks at specified time `at` and `batch` commands can be used.\n\n\
    To run `at` command `rpm` must be installed and `atd` service must be running.\
    \ When you give `at` command with time, the system presents you the `at` prompt.\
    \ On `at` prompt you can give the commands you want to schedule. After giving\
    \ all commands, you press `CTRL + d` key to exit from `at` prompt.\n\n### Check\
    \ Installation\n```\n# rpm -q at\n```\n### Install at package\n```bash\n# yum\
    \ install at\n```\n### Start service\n```bash\n# service start atd\n```\n\n###\
    \ Start command\n```bash\n# at 4:00\nat > ls\nctrl + d\n```\n\nBatch command executes\
    \ one-time task when system average load decreases bellow 0.8\n```\n~]# batch\n\
    at> ls -la\nat> ctrl + d\n```\n\n### Display list of pending jobs\n```bash\n#\
    \ atq\n```\n\n## Chapter 27. Boot process\n\nAfter pressing power on button to\
    \ RHEL login prompt screen, system do lot of processing to get you to login prompt.\
    \ This process is known as boot process. It is important to understand the boot\
    \ process of Linux to troubleshoot startup issues and to configure Linux properly.\n\
    \nThe following steps summarize how the boot procedure happens in RHEL:\n1. Computer\
    \ uses `BIOS` to perform `POST`.\n2. `BIOS` reads `Master Boot Record` for bootloader.\n\
    3. Control goes to `GRUB2`. It uses `/boot/grub/grub.cfg` to select the kernel\
    \ image.\n4. Kernel\n    1. Mounts the root filesystem as specified with `root=`\
    \ in `grub.conf`\n    2. The kernel starts the `systemd` process with a process\
    \ ID of 1 (`PID 1`)\n    3. `initrd` which stands for Initial RAM Disk is used\
    \ by kernel as temporary root file system until kernel is booted and the real\
    \ root filesystem is mounted. It also contains drivers, which are required to\
    \ access hard disk and other necessary hardware.\n5. `systemd`\n\n`systemd` is\
    \ a system and service manager for Linux operating systems. Provides a number\
    \ of features such as parallel startup of system services at boot time. `systemd`\
    \ is the parent process of all processes on a system. `systemd` determine the\
    \ default system target earlier it used to be known as run level in older version.\
    \ After determining the target, it performs the initialization of system, which\
    \ includes:\n1. Setting the host name\n2. Initializing the network\n3. Initializing\
    \ the system hardware\n4. Mounting the file systems\n5. Starting swapping\n\n\
    ## Chapter 28. Log management\n\nLog files are very useful in troubleshooting\
    \ the system. Log files are also useful in auditing system for unauthorized system\
    \ access. Log files give you an idea that what system was doing at specific point\
    \ in time. Suppose your machine is running slow or not working properly as a Linux\
    \ administrator, first thing to look for problem is logs. Logs provides clue when\
    \ and how problem started and what part of OS is giving problem.\n\nThe log files\
    \ generated in a Linux environment can normally be classified into four different\
    \ categories:\n* Application Logs\n* Event Logs\n* Service Logs\n* System Logs\n\
    \nRHEL provide services for saving log information. Some application in RHEL use\
    \ their own mechanism to logs directly to their log information files, example\
    \ of which is `apache`. Some of the service maintain their logs through `systemctl`.\
    \ `systemctl` further communicates to `Journald` which keep track on log information.\n\
    \n`rsyslog` is another logging method. `rsyslog` and `Journal`, have several distinguishing\
    \ features that make them suitable for specific use cases. In many situations,\
    \ it is useful to combine their capabilities.\n\n### journald\n\n`journald` daemon\
    \ is a component of `systemd` which is used for logs management. It’s a centralized\
    \ location for all messages logged by different components in a systemd enabled\
    \ Linux system. This includes kernel and boot messages, initial RAM disk, messages\
    \ coming from `syslog` or different services, it indexes and makes them available\
    \ to the user. Log data collected by the journal is primarily text-based but can\
    \ also include binary data where necessary. Log files produced by `journald` are\
    \ not persistent, log files are stored only in memory or a small ring-buffer in\
    \ the `/run/log/journal/` directory. The amount of logged data depends on free\
    \ memory. Logs gets rotated periodically. But you can configure the system to\
    \ make these logs persistent.\n\n#### Viewing log with journalctl\n\nTo view log:\n\
    ```\njournalctl\n```\nTo view full meta data about all entries:\n```\njournalctl\
    \ -o verbose\n```\nLive view of logs:\n```bash\njournalctl -f\n```\n\n#### Filtering\
    \ by Priority\nYou can filter the logs on basis of priority.\nSyntax:\n```\njournalctl\
    \ -p priority\n```\nExample:\nIn this example, we want to view only lines with\
    \ error from the log:\n```\njournalctl -p err\n```\nTo view log entries only from\
    \ the current boot:\n```\njournalctl -b\n```\nTo make logs persistent:\n```bash\n\
    $ sudo mkdir -p /var/log/journal\n```\nThen, restart `journald` to apply the change:\n\
    ```bash\nsystemctl restart systemd-journald\n```\n\n### Rsyslogd\n\nSome logs\
    \ are controlled by `rsyslogd` daemon. It is enhanced replacement of `sysklogd`.\
    \ It offers high-performance, great security features, modular design and support\
    \ for transportation via the TCP or UDP protocols. Every logged message contains\
    \ at least a time and normally a program name field.\n\n`/etc/rsyslog.conf` file\
    \ is the main configuration file for the `rsyslogd` which logs system messages\
    \ on the systems. This file specifies rules for logging `rsyslogd`. List of log\
    \ files maintained by `rsyslogd` can be found in the `rsyslog.conf` configuration\
    \ file. Log files are usually located in the `/var/log/` directory.\n\n#### Sample\
    \ rsyslog.conf\n```bash\netc]$ cat rsyslog.conf\n\n# rsyslog v5 configuration\
    \ file\n# For more information see /usr/share/doc/rsyslog-*/rsyslog_conf.html\n\
    # If you experience problems, see http://www.rsyslog.com/doc/troubleshoot.html\n\
    \n*.info;mail.none;cron.none  /var/log/messages # The authpriv file has restricted\
    \ access.\nauthpriv.*                              /var/log/secure # Log all the\
    \ mail messages in one place.\nmail.*                                -var/log/maillog\
    \ # Log cron stuff\ncron.*                               /var/log/cron # Everybody\
    \ gets emergency messages\n*.emerg                                * # Save news\
    \ errors of level crit and higher in a special file.\nuucp,news.crit         \
    \                /var/log/spooler # Save boot messages also to boot.log\nlocal7.*\
    \                              /var/log/boot.log\n```\n\nLog filtering with rsyslog.conf\n"
