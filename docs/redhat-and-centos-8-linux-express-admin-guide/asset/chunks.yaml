    Older versions like RedHat 6 and earlier implemented run levels. Run level is
    state or mode of OS in which it will run. Each run level causes certain number
    of services to be stopped or started, providing control over behavior of machine.
    However, in RHEL 7 it was replaced by `systemd` targets. There were seven Runlevels
    in redhat 6 or earlier, which has been replaced by corresponding target units
    in new version.


    | Run level | Description | Target unit |

    | :--- | :--- | :--- |

    | 0 | Halt the machine | `poweroff.target` |

    | 1 | Single user mode | `rescue.target` |

    | 2 | Multiuser with command line no GUI | `multiuser.target` |

    | 3 | Multiuser with command line no GUI | `multiuser.target` |

    | 4 | Multiuser with command line no GUI | `multiuser.target` |

    | 5 | Multiuser with GUI | `graphical.target` |

    | 6 | Reboot | `reboot.target` |


    List currently loaded target

    ```

    systemctl list-units --type target

    ```


    ## Default Target

    Default target decides the direction in which systemd process takes the system
    at boot time. The file `/etc/inittab` is no longer used to set the default run
    level as it was in earlier version of RHEL. Now default target unit is represented
    by the `/etc/systemd/system/default.target` file. This file is a symbolic link
    to current set target. Suppose current target is set to graphical, this file will
    be symbolic link to graphical target file.


    ### Change default target

    #### Syntax

    ```

    systemctl set-default <name of target>.target

    ```

    #### Example

    ```

    systemctl set-default graphical.target

    ```

    Removed symlink `/etc/systemd/system/default.target`.

    Created symlink from `/etc/systemd/system/default.target` to `/usr/lib/systemd/system/graphical.target`.


    ### Viewing the Default Target

    ```

    systemctl get-default

    ```


    ### Changing the Current Target

    After changing default target, the current target remains unchanged until next
    reboot. To change the current target without reboot use:


    #### Syntax

    ```

    systemctl isolate default

    ```

    Or

    ```

    systemctl default

    ```


    To Change the current target to different target other than default target. Suppose
    you want to start the single user target:


    #### Syntax

    ```

    systemctl isolate newtarget.target

    ```

    #### Example

    ```

    systemctl isoloate rescue.target

    ```


    ## Chapter 10. OpenSSH

    SSH(Secure Shell) provides a secure channel over insecure network in client server
    architecture. SSH is a replacement of `telnet`, which is insecure protocol. It
    allows secure channel to login and execute command remotely because all communication
    between client and server is encrypted. RHEL includes the `OpenSSH` package for
    `ssh`. The OpenSSH suite comes with RHEL is SSH version 2. OpenSSH provides number
    of tools for secure communication like `ssh`, `scp` and `sftp`. It also offers
    capabilities for secure tunneling, different authentication methods, and easy
    configuration. RHEL 8 includes `openssh`, `openssh-server` and `openssh-clients`
    packages. The `openssh` package also requires `openssl-libs` to be installed on
    the system, as it provides cryptographic libraries for encrypted communication.
    The default installation of RHEL comes with `openssh` preinstalled. If is not
    there, you need to install them with this command.


    ```

    yum install openssh openssh-server openssh-clients openssl-libs

    ```


    ### Start the service

    ```

    systemctl start sshd.service

    ```

    ### Enable the service to start automatically on system boot

    ```

    systemctl enable sshd.service

    ```

    ### Check the status

    ```

    systemctl status sshd.service

    ```


    ### Versions of SSH protocol

    There are two varieties of SSH,version 1 and version 2. The OpenSSH suite comes
    under RHEL 8 is SSH version 2. SSH2 is a more secure, also includes SFTP, which
    is functionally similar to FTP, but with encryption. `scp` instead of `rcp`.


    To check version of `ssh` you are running:

    ```

    ssh -v localhost

    ```

    This command show verbose mode of `ssh` in that look for following line:

    `debug1: Local version string SSH-2.0-OpenSSH_7.8`


    ### Configuration file

    | File | Description |

    | :--- | :--- |

    | `/etc/ssh/sshd_config` | The default configuration file for the `sshd` daemon
    |

    | `/etc/ssh/ssh_config` | The default configuration file for SSH client. it will
    be overridden, if `~/.ssh/config` exists |

    | `~/.ssh/config` | The client-side configuration file |


    ### Connecting from client

    If you are on the Linux client machine and you want to login on to remote RHEL
    server you require `ssh` client installed on your client machine and SSH server
    running on RHEL server. From client give this command:

    ```

    ssh –x user@ server-IPaddress_or_hostname

    ```

    #### Example

    ```

    ssh –x root@RHEL1

    ```

    The authenticity of host ''RHEL1 (192.168.131.152)'' can''t be established.

    ECDSA key fingerprint is SHA256:kJkcVAsgMdv5FsbEeaHWNK33LJHHLaHSUC8WZE/Sri8.

    Are you sure you want to continue connecting (yes/no)? yes

    Warning: Permanently added ''RHEL1,192.168.131.152'' (ECDSA) to the list of known
    hosts.

    `root@RHEL1''s password:`

    `[root@RHEL1 ~]`


    It will ask password of the user name specified in the `ssh` command. When `ssh`
    connection from client to server is made first time, the public key of server
    is stored locally on the client, so it’s identity can be verified next time.

    `Ctrl + d` or `exit` command will terminate `ssh` session.

    From client terminate `ssh` session:

    ```

    exit

    ```


    ## Passwordless Login Using SSH Keys

    SSH also allows password client to without password. In section, we will learn
    how to. client....... R111....1....1.1 keys on


























    111

























































    11

    ```

    ssh-keygen

    ```

    2. Copy public key from RHEL1 to second server RHEL2:

    ```

    scp ~/.ssh/id_rsa.pub root@RHEL2:/root/

    ```

    3. On second server RHEL2 create directory `.ssh` in home directory and change
    the permissions to 700 (only owner can read, write and execute):

    ```

    mkdir .ssh

    chmod 700 .ssh

    ```

    4. Append the public key earlier copied in /root directory to `authorized_keys`
    file and change permissions:

    ```

    cat id_rsa.pub >> .ssh/authorized_keys

    chmod 644 .ssh/authorized_keys

    ```

    5. Now try login from RHEL1 to server RHEL2 it will not ask for password:

    ```

    ssh root@RHEL2

    ```


    ## scp Utility

    `scp` is part of opensopens` suit which can be used to transfer files between
    machines over a encrypted connection. It is secure alternative to `rcp` command.
    Syntax for `scp` command is:


    #### Syntax

    ```

    scp filename username@hostname:/directory

    ```

    #### Example

    ```

    scp abc.txt user1@RHEL2:.

    ```

    In this example we will transfer `abc.txt` from host1 ie. RHEL1 to remote machine
    RHEL2.


    To transfer a file from remote machine to the local system:

    #### Syntax

    ```

    scp username@hostname:remotefile localdirectory

    ```

    #### Example

    In this example we will transfer xyz.txt` from remote host2 ie. RHEL2 to local
    machine RHEL1. On RHEL1 shell prompt:

    ```

    scp user2@RHEL2:/home/user2/xyz.txt /home/user1/

    ```


    ## sftp Utility

    File Transfer Protocol (FTP) is widely used protocol for transferring files between
    computers specially for downloading files from internet. However, it uses unencrypted
    communication, which is not secure. SSH File Transfer Protocol (SFTP) is a SSH
    implementation for FTP that provides encrypted data transfer. `sftp` provides
    interactive prompt. You can use command to download or upload file to remote host.


    To connect to a remote system using `sftp username@hostname` or IP address of
    server it will ask the password for username:


    #### Syntax

    ```

    sftp username@hostname

    ```

    #### Example

    ```

    sftp user1@RHEL2

    ```


