    ## Chapter 1. Introduction

    An operating system is piece of software, which manages hardware resources on
    your computer. Operating System is a layer that runs between your applications
    and hardware. To run any application, you require operating system on your machine.
    There are lot of operating system available in market like `MS windows`, `Apple
    OS`, `Unix`, `Linux` Just like `Windows 7`, `MS Windows 10` and `Mac OS`, `Linux`
    is a prominent operating system. Unlike other OS, `Linux` is open source operating
    system that means source code is freely available. The benefit of having open
    source is that anyone can see source code and modify it according to his requirements.


    In 1991 `Linus Torvalds` started `Linux` project. `Linux` was originally developed
    for Intel based personal computers but eventually had been ported to other platforms.
    Not only on PC, `Linux` kernel is also used in `Android` operating system on smartphones.
    As `Linux` is open source project lot of companies and individual used this source
    code and started creating their Linux distributions. Today there are thousands
    of Linux distributions in market, but some distributions enjoy lion share among
    Linux users. Over the lot of Linux communities and companies use these popular
    distributions as base to create their own flavor by modifying or adding some packages.
    Broadly, we can classify Linux distribution based on their source example `Centos`,
    `Oracle` and `Scientific Linux` are based on `Redhat` whereas `Debian` based distributions
    are `Ubuntu`, `Mint`, `tails` etc.


    ### Free vs Paid

    Linux although is open source project but there are two types of Linux distribution
    available one is free and other is paid. Free is self-explanatory you do not have
    to pay anything. If you have any problem, you can take help of volunteers working
    for that Linux community. However, problem is that this type of support is not
    bound as it is voluntarily. For corporate sector where Linux is used in production
    environment, this is not acceptable. So companies who uses mission critical Linux
    servers and computers prefers paid type of Linux where they pay fixed amount as
    subscription and support fee to get services with Service Level Agreement (`SLA`).
    These paid Linux distribution keeps team of Linux experts to provide support and
    fixes. The prominent players in free Linux are `Ubuntu`, `Debian`, `Fedora`, `Centos`,
    `Opensuse` etc. `Red hat` and `SUSE` are major players in non free enterprise
    distribution.


    ### Relationship between Fedora and Red Hat Enterprise Linux

    Both the `Fedora Linux` and `Red Hat Enterprise Linux` are open source technologies.
    `Fedora` although supported by Red Hat company but still it is community project
    built by the community. On other hand `Fedora` is community project focused on
    the individuals who wants to try and use bleeding edge technology. `Fedora` releases
    new version after every six months and provide updates support for 13 months whereas
    new version of `Red Hat` comes out every few years and supported for 10 Years
    or more. Therefore, `Red Hat Enterprise Linux` is first choice for Enterprise
    IT platform where stability and long term release is primary requirement.


    ### What is community Project?

    Linux community projects are those projects in which Linux enthusiast and contributors
    come together to build a project which helps in exploring new technologies and
    solutions. Contributor can be an end user, developer or tester or even designer.
    These type of projects are generally built voluntarily. But still to run these
    type of project you require financial power for the infrastructure like websites
    servers and office. Some communities take help from individuals as donation on
    other hand some projects get sponsorship from corporate companies like `RedHat`,
    `IBM`, `HP` etc. In return these companies take advantage of the new technologies
    developed by these communities. Like in the case of `Fedora` project which is
    sponsored by `RedHat`. The developers of both distributions collaborate together
    in fixing bugs and improving the technologies developed by Fedora community.


    ### Centos and Red hat Linux

    `Red Hat Enterprise Linux` is known for its stability. As name suggest it is enterprise
    level Linux. The `Centos` (short for `Community Enterprise Operating System`)
    Linux distribution is free Linux distribution derived from source code of `Red
    hat Enterprise Linux`. It is enterprise class Linux distribution. Unlike `Red
    Hat` where you have to pay subscription fee for updates and upgrades, `Centos`
    is fully free. `Centos` Linux provides same software packages as `Red hat` but
    without support from `red hat`. `Centos` takes source code from `Red Hat` repositories.
    Using this source code `Centos` rebrand it after removing Red Hat logos, trademarks
    and proprietary software. `Centos` also removes and modify some original software
    provided by Red Hat like `subscription manager`, which is not required in `Centos`.


    ## Chapter 2. New Features in Red Hat Enterprise Linux Version 8

    `Red Hat Enterprise Linux` distribution is a stable platform derived from the
    sources of `Fedora 28`. With new version 8, `RHEL` has brought many improvements
    from its previous versions. Here is a summary of new features came with RHEL version
    8:-


    - The `Cockpit` is now available by default

    - `GNOME Shell` version 3.28

    - `DNF` as package management tool. For backward compatibility `Yum` is still
    working using `DNF` infrastructure.

    - `RPM` v4.14 is distributed in `RHEL 8`. `RPM` now validates the whole package
    contents before starting the installation.

