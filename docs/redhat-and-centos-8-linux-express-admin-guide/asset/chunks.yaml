    ## YUM


    `RHEL` uses `.rpm` packages for installing software with `rpm` command. `RPM`
    package is simply a file that contains some files and information about those
    files. Technically speaking `RPM` is a file containing `cpio` archive and metadata
    about itself. `RPM` Header contains the metadata and this metadata is used to
    determine following things about the package:-


    * Description of package.

    * List of files in the package.

    * Version and release of package.

    * When and who made it.

    * Architecture supported.

    * Checksums of the files contained in the package.

    * Dependences.

    * Etc.


    ## Modules


    IN `RHEL 8` new concept of modules has been introduced. Modules is the extension
    to `RPM`. A module is set of packages that represent a component. A module typically
    contains application packages, its libraries, dependent packages and documentation
    including help files. Now in `RHEL 8` can contain multiple versions of same package
    for example python or perl. These packages have its own life cycle rather than
    RHEL cycle. When you install one version of module its dependences will be automatically
    installed. You can consider module as virtual repository. For handling module
    `yum module` command has been introduced. The modules has extension after rpm
    like `abc.rpm.module`.


    ## Repository


    Yum repository is collection of RPM packages with metadata that is used by `Yum`.
    It is way of distributing content in any Linux Distribution. It can be present
    locally (DVD, directory) or remotely (FTP, HTTPS). The package manager uses repositories
    to install, remove, and upgrade packages. The configuration file for yum is `/etc/yum.conf`.
    However, it is recommended to create or use existing `.repo` file in the `/etc/yum.repos.d/`
    directory for defining repositories. `Redhat 8` is now distributed through two
    main repositories:


    * BaseOS

    * Appstream


    There is no extras channel in `RHEL 8`. `BaseOS` and `Appstream` contain all software
    packages, which were available in extras and optional repositories in earlier
    version of `RHEL`.


    BaseOS is intended to provide core set of functionality and core component to
    OS independent all type of installation. Which mean BaseOS repository is required
    for all set of installation even for headless installation.


    Appstream contains additional userspace applications, languages, databases etc.
    Appstream is intended for different set of workloads. For example if you want
    make this server as http server or want install database. Appstream is updated
    more frequently than BaseOS. Appstream is made up of rpm packages and modules.


    If you think required software is not available in the RedHat repositories, you
    have option to add third party repositories like `rpmfusion`, `epel` etc. You
    can easily install various packages by using these third party repositories. Please
    note that these packages are not officially supported by Red Hat, Inc, but provides
    many popular packages and apps. For example `epel` repository is required to install
    openvpn server.

