    # 快速指南

    ## 红帽企业 Linux (Red Hat Enterprise Linux)

    ### Centos 版本 8

    **Shiv Kumar Goyal**


    ## 前言

    本书专为系统管理员或 Linux 爱好者编写。本书的编写方式涵盖了 `RedHat Enterprise Linux` 和 `Centos` 的实际操作方面。如果你计划部署
    `Redhat Enterprise Linux` 第 8 版本或对其进行维护，那么这本书就是为你准备的。书中编写的所有步骤都直击要点，并配有相应的屏幕截图和输出示例。如果你时间紧迫且讨厌阅读厚重的书籍，那么这本书正适合你。它涵盖了从基础到高级水平的所有文章。


    希望你会喜欢这本书。


