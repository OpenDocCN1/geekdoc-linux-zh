    log-file-size, permssions of files, missingok, rotation-count and compression.
    For each log it is recommended you  create file in the /etc/logrotate. d directory


    Example


    [root@redhat1 logrotate.d]# cat bootlog


    /var/log/boot.log


    {


        missingok


        daily


