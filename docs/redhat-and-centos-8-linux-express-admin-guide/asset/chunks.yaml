    ssh keys


    ssh keys helps in identifying yourself to a server using public key cryptography
    and challenge response authentication. ssh keys are generated in pairs known,
    one as public and other as private key. The public is for sharing and private
    key is for you. It must be kept safely. Server having public key can send challenge,
    which can only be answered by client holding private key. This allows password
    less login.


    Passwordless Login Using SSH Keys


    SSH also allows to connect trusted SSH client to SSH server without password.
    In this section, we will learn how to do passwordless login from Linux client
    to Linux server. In bellow example, RHEL1 is Linux client and RHEL2 act as Linux
    server.


