  \ www.abc_example.com\n192.168.131.152 www.xyz_example.com\n```\n\n## 30. 创建虚拟主机配置文件\n\
  \n为了测试目的，你可以在 `/etc/hosts` 中添加条目。\n\n```bash\nvi /etc/hosts\n```\n\n```text\n192.168.131.152\
  \ www.abc_example.com\n192.168.131.152 www.xyz_example.com\n```\n\n## 13. 探索 Shell\n\
  \n如果系统中启用了 SELinux，请更改新创建目录的上下文。\n\n```bash\nsemanage fcontext -a -t httpd_sys_content_t\
  \ \"/var/www/html/abc_example.com(/.*)?\"\n```\n\n### Shell\nShell 是输入到系统的人类可读界面。它是用户与系统之间的接口。\n\
  \n### 命令行界面\n命令行界面 (CLI) 是与程序交互的方式。\n\n### 命令提示符\n虽然你可以自定义提示符，但通常会在提示符末尾看到 `#` 或\
  \ `$`。其中 `#` 表示用户以 root 身份登录，`$` 表示普通用户。你可以在提示符中显示额外信息，如用户名、当前目录和服务器名称。\n\n### Shell\
  \ 脚本\n脚本用于自动化任务。它们通常以 `.sh` 结尾。\n\n### Tab 补全\nTab 补全是 bash shell 最实用的功能之一。通过在输入部分命令、目录或文件名后按下\
  \ `TAB` 键，它可以自动补全单词，如果只有一个选项；否则它会提供所有可能的补全。\n\n### Bash 历史记录\nShell 将你在 shell 提示符上输入的所有命令保存在用户主目录下的文件中。你可以通过输入\
  \ `history` 命令查看最近的命令。\n\n```bash\n$ history\n```\n\n\n\n\n\n列出所有以 `b` 开头且第二个字符为\
  \ 1 到 5 之间的数字的文件。可以是 `b1`、`b2`、`b3`、`b4` 和 `b5`。\n\n检查当前的 shell\n\n```bash\n###\
  \ echo $SHELL\n```\n\n## 第 14 章\n\n## 备份与恢复\n\n计算机数据备份对于防止数据丢失始终非常重要。在发生数据丢失时，备份可以为你提供保护。数据丢失有许多原因，如硬盘故障、操作系统故障、病毒、恶意软件或人为错误。在进行实际备份之前，你应该尝试回答三个\
  \ W：什么（what）、何时（when）和哪里（where）。\n\n### 什么 (What)\n\n根据我作为管理员的经验，如果你询问任何用户哪些数据对备份很重要，简单的答案将是所有数据。作为管理员，你应该理解每天对整个系统进行备份是理想的，但在实践中，你首先需要一个可以容纳所有数据的巨大设备。其次，备份也需要时间。假设你对一台在线服务器进行全量备份，可能需要几个小时才能完成。在这种情况下，当你准备完成备份时，一半的数据已经发生了变化。因此，产生了数据一致性问题。获取一致数据备份的最佳方法是停止整个系统然后进行备份，但如果你的备份窗口很大，那么很难获得生产系统的停机时间。解决这个问题的方案是将数据分为两部分或多部分。第一部分数据是经常更改的。第二部分是偶尔更改的数据。这最好的例子是，在正常的生产环境中，你有极少变化的软件二进制文件和定期更新的数据文件。你可以每月或每季度对整个系统进行备份，并每天对数据文件进行备份。\n\
  \n#### 哪里 (Where)\n\n下一个问题是你想把备份存在哪里。这个问题包含两个部分：第一部分是你想要进行备份的设备。可以是外部硬盘、磁带驱动器、DVD\
  \ 甚至是 USB 驱动器。第二部分是你想要物理存放备份介质的位置。它可以存储在相同的位置（本地 onsite）或远程位置（离地 offsite）。存储在相同位置的处是在数据丢失时可以方便快速地获取，但当由于洪水、飓风或火灾导致站点完全损失时，离地备份更有用。根据最佳实践，你应该遵循\
  \ 3-2-1 计划。在其中，你保留数据的三个份备份副本：两份在本地，第三份在离地。如果发生需要备份副本来恢复数据的情况，你本地有两个良好的数据副本，而且在发生完全灾难时，还有远程副本。\n\
  \n#### 何时 (When)\n\n下一个问题是，何时进行备份？这完全取决于你的业务需求。数据备份的频率取决于数据的更改频率和重要性。定义备份时间的下一个因素是系统功能。用于服务器的系统和作为工作站的系统可能有不同的备份窗口。\n\
  \n### 备份类型 (Backup type)\n\n现在你已经知道了三个 W 的答案，是时候深入理解备份了。根据你备份的量，备份大致分为三种：\n\n1.\
  \ 全量备份 (Full backup)\n2. 差异备份 (Differential backup)\n3. 增量备份 (Incremental backup)\n\
  \n#### 全量备份 (Full backup)\n\n顾如其名，包含所有文件的备份。当你需要恢复时，只需要一份全量备份。\n\n#### 差异备份 (Differential\
  \ backup)\n\n差异备份是自上一次全量备份以来更改的文件的累积备份。在恢复时，只需要上一次全量备份和上一次差异备份。\n\n#### 增量备份 (Incremental\
  \ backup)\n\n增量备份仅备份自上次备份（无论是全量还是增量备份）以来更改的数据。假设你在周日执行了全量备份。周一，你将对自周日以来更改的文件进行增量备份。周二，如果你再次进行增量备份，它将只备份自上一次增量备份（即自周一）以来发生过更改的文件。然而，如果你在周二进行差异备份，它将备份自全量备份（即自周日）以来更改的所有文件。要恢复增量备份，你需要全量备份以及自上一次全量备份以来的所有增量备份。\n\
  \n### 用于 RHEL 的备份工具 (Backup tools for RHEL)\n\nRHEL 提供了一些基础工具来进行备份。如果你需要高级功能，可以使用专有工具，这些工具提供自动化备份、网络备份、使用自有数据库备份等功能。\n\
  \nRHEL 用于全量和部分备份的基础工具如下：\n\n* `Tar`\n* `CPIO`\n* `dump` 和 `restore`\n\n#### RHEL\
  \ 备份的高级实用 (Advanced utility for RHEL backup)\n\n高级马里兰自动网络磁盘归档器 (`AMANDA`) 客户端/服务器工具，它使用\
  \ `dump` 或 `tar` 进行网络备份。\n\n#### 备份的专有工具 (Proprietary tools for backup)\n\n一些更高级、功能丰富的企业备份工具：\n\
  \n* `IBM’s Tivoli Storage Manager`\n* `Veritas Netbackup`\n* `EMC NetWorker`\n*\
  \ `HPE StoreOnce`\n\n## RHEL 备份工具详解 (RHEL backup tools explained)\n\n### Tar\n\n\
  `Tar` 是 Unix 和 Linux 中用于备份的多功能工具。`tar` 命令可以用于创建一个多个文件的归档文件。你可以将 `tar` 归档文件拷贝到磁带、DVD\
  \ 或 USB 驱动器作为备份。你可以在创建归档文件时添加选项创建压缩文件。\n\n#### 创建 tar (Create tar)\n\n语法\n```bash\n\
  tar cvf name_of_archive_file files_or_directory_to_archive\n```\n其中\n* `c`: 创建 (create)\n\
  * `v`: 详细 (verbose)\n* `f`: 归档文件名类型\n\n示例\n```bash\n#### cd /var/log\n#### tar cvf\
  \ /backup/varlogs.tar *.log\n```\n输出：\n```\nboot.log\nvmware-vmsvc.log\nvmware-vmusr.log\n\
  wpa_status.log\n```\n\n#### 创建压缩文件 (Create compressed file)\n\n在创建归档文件时添加选项也可以创建压缩文件。\n\
  \n#### Gzip 格式 (Gzip format)\n\n语法\n```bash\ntar cvzf name_of_archive_file files_or_directory_to_archive\n\
  ```\n其中\n* `c`: 创建\n* `v`: 详细\n* `z`: gzip\n* `f`: 文件名\n\n示例\n```bash\n#### tar\
  \ cvzf /backup/varlogs.tar *.log\n```\n\n#### Bzip 格式 (Bzip format)\n\n语法\n```bash\n\
  tar cvfj name_of_archive_file files_or_directory_to_archive\n```\n其中\n* `c`: 创建\n\
  * `v`: 详细\n* `j`: bzip2\n* `f`: 文件名\n\n示例\n```bash\n#### tar cvfj /backup/varlogs.tarbz2\
  \ *.log\n```\n\n#### 提取 (Extract)\n\n使用 `tar` 命令恢复备份的文件。\n\n语法\n```bash\ntar xvf\
  \ name_of_archive_file\n```\n其中\n* `x`: 提取 (extract)\n* `v`: 详细\n* `f`: 文件名\n\n\
  示例\n```bash\n# tar xvf /backup/varlogs.tar\n```\n\n#### Gzip 格式\n```bash\ntar xvf\
  \ /backup/varlogs.tar.gz\n```\n\n#### Bzip 格式\n```bash\ntar xvf /backup/varlogs.tar.bz2\n\
  ```\n\n#### 列出 (List)\n\n使用 `t` 选项显示归档文件的内容。相同的命令也可以列出压缩文件的内容。\n\n语法\n```bash\n\
  tar tvf name_of_archive_file\n```\n其中\n* `t`: 列出 (list)\n* `f`: 文件名\n\n示例\n```bash\n\
  #### tar tvf /backup/varlogs.tar\n#### tar tvjf /backup/varlogs.tar.bz2\n#### tar\
  \ tvzf /backup/varlogs.gz\n```\n\n### CPIO\n\n`CPIO` 工具归档文件之间拷贝文件。它可以用于归档并将文件从一个地方拷贝到另一个地方。\n\
  \n将 `/var/log` 文件夹中的所有文件归档到备份：\n```bash\n#### cd /var/log\n#### ls |cpio -ov > /backup/varlogs.cpio\n\
  ```\n\n从 CPIO 提取文件：\n```bash\n#### mkdir newbackup\n#### cd newbackup\n#### cpio\
  \ -idv < /backup/varlogs.cpio\n```\n\n从特定文件列表创建存档：\n示例：\n```bash\n#### find /var\
  \ -iname *.log -print|cpio -ov > /backup/varlog.cpio\n```\n\n使用 CPIO 创建 tar 文件：\n\
  ```bash\n#### ls|cpio -ovH tar -F abc.tar\n```\n\n### dump and restore\n\n#### xfsdump\n\
  \n`xfsdump` 工具用于整个文件系统或自上次 dump 以来更改的文件备份。理想情况下，应该对静止的文件系统进行 dump，这样文件在备份期间就不会发生更改。\n\
  \n语法\n```bash\nxfsdump <options> target_device filessystem_tobe backed_up\n```\n\
  示例\n将整个根文件系统备份到设备 `st0`：\n```bash\n#### xfsdump -l 0 -f /dev/st0 /\n```\n其中\n* `-l`:\
  \ 备份级别。从 0 到 9 有十个备份级别。\n* `0`: 完全\n* `1`: 自上次备份的增量\n* `2-9`: 自上一次增量备份的增量\n* `-f`:\
  \ 设备名称\n\n#### xfsrestore\n```bash\nxfsrestore\n```\n\n\n\n#### xfsrestore\n\n`xfsrestore`\
  \ 命令用于恢复使用 `dump` 命令创建的备份。\n\n#### 语法\n```bash\nxfsrestore <options> backupdevice\
  \ target\n```\n\n#### 示例\n恢复存储在 `/dev/st0` 设备上的备份\n```bash\nxfsrestore -f /dev/st0\
  \ /home1\n```\n\n### 选项说明\n- `-f` 用于设备名称\n\n## 第 15 章 归档与压缩\n\n归档是将一组文件和目录收集并存储到一个文件过程，`Tar`、`cpio`、`zip`\
  \ 和 `ar` 是执行此操作的实用示例。而压缩是使用数学压缩算法减小文件的大小。这在通过互联网发送大文件时非常有用。压缩工具的示例有 `gzip`、`bzip2`、`xz`\
  \ 等。\n\n## GZIP\n使用 `gzip` 可以压缩和解压单个文件。当你使用 `gzip` 命令压缩任何文件时，该文件将被替换为扩展名为 `.gz`\
  \ 的文件，并保持相同的所有权模式、访问和修改时间。简单来说，你将看不到原始文件，只有压缩后的文件。\n\n#### 语法\n```bash\ngzip filename\n\
  ```\n\n#### 示例\n```bash\ngzip sysctl.conf\n```\n\n### 解压\n使用 `gunzip` 命令解压压缩文件。然而，此命令会删除压缩文件，你只会看到解压后的文件。\n\
  \n#### 语法\n```bash\ngunzip filename\n```\n\n#### 示例\n```bash\ngunzip sysctl.conf.gz\n\
  ```\n\n## BZIP2\n`bzip` 使用名为 Burrows Wheel 块排序的压缩算法压缩文件。像 `gzip` 一样，它会删除原始文件并创建一个相同名称加\
  \ `.bz2` 扩展名的压缩文件。每个压缩文件与相应的原始文件具有相同的修改日期、权限，如果可能还具有相同的所有权。\n\n#### 语法\n```bash\n\
  bzip2 filename\n```\n\n#### 示例\n```bash\nbzip2 sysctl.conf\n```\n\n### 解压\n使用 `bunzip2`\
  \ 解压用 `bzip2` 命令压缩的文件。默认情况下，如果存在同名文件，它不会覆盖，除非你提供了 `-f` 选项。\n\n#### 语法\n```bash\n\
  bunzip2 filename\n```\n\n#### 示例\n```bash\nbunzip2 sysctl.conf.bz2\n```\n\n## XZ\n\
  `xz` 是 `lzma` 工具的继承者，它会自动为压缩文件添加 `.xz` 扩展并删除原始文件。像 `bzip` 和 `gzip` 一样，它将保持与原始文件相同的修改日期、权限，如果可能还具有相同的所有权。\n\
  \n#### 语法\n```bash\nxz filename\n```\n\n#### 示例\n```bash\nxz sysctl.conf\n```\n\n\
  ### 解压\n#### 语法\n```bash\nunxz filename\n```\n\n#### 示例\n```bash\nunxz sysctl.conf.xz\n\
  ```\n\n## ZIP\n`Zip` 归档和压缩工具。它创建扩展名为 `.zip` 的文件。它是跨平台压缩工具，因此你可以从 Linux 到 Windows\
  \ 压缩解压文件，反之亦然。它会保持原始文件完整。\n\n#### 语法\n```bash\nzip zipfile.zip file/files_to_compress\n\
  ```\n\n#### 示例\n```bash\nzip abc.zip sysctl.conf signond.conf\n```\n你也可以配合通配符使用\
  \ `zip`\n```bash\nzip abc.zip s*\n```\n\n### 递归压缩文件（包含子目录）\n#### 语法\n```bash\nzip\
  \ -r zipfile.zip directoryname\n```\n\n#### 示例\n```bash\nzip -r asp.zip monk\n```\n\
  \n### 列出压缩文件的内容\n#### 语法\n```bash\nunzip -l zipfile.zip\n```\n\n#### 示例\n```bash\n\
  unzip -l asp.zip\n```\n\n### 解压\n使用 `unzip` 命令解压用 `zip` 命令压缩的压缩。\n\n#### 语法\n```bash\n\
  unzip zipfile.zip\n```\n\n#### 示例\n```bash\nunzip asp.zip\n```\n\n## ar\n`ar` 是\
  \ `rar` 不为人知的先驱，`rar` 在 RHEL 中仍在在使用。它仅用于归档，因为它本身没有压缩。\n\n### 创建归档\n#### 语法\n```bash\n\
  ar cvsr archivefile.a files_to_archive\n```\n\n#### 示例\n```bash\nar cvsr abc.a s*\n\
  ```\n\n### 提取归档\n#### 语法\n```bash\nar xv archivefile.a\n```\n\n#### 示例\n```bash\n\
  ar xv abc.a\n```\n\n有很多可以安装的第三方工具，你可以尝试以下：\n- `peazip`\n- `p7zip`\n- `pax`\n- `kgb`\n\
  等更多..\n\n## 第 16 章 防火墙\n\n根据字典，防火墙是旨在抑制或防止火灾蔓的墙或隔层。在计算机世界中，防火墙是用于保护入站和出站连接的网络安全系统。它防止未经授权的访问。限制用户仅访问指定的服务。\n\
  \n## nftables\n在 Redhat 的早期版本中，`iptables` 用于数据包过滤，但在 Redhat 8 中它被 `nftables` 取代了。它是所有\
  \ `iptables` 框架（如 `iptables`、`ip6tables`）的单一工具。\n\n## Firewallld\n`Firewalld` 是动态防火墙管理器。它使用区域（zones）和服务（services）。它将配置存储在\
  \ `/etc/firewalld/` 和 `/usr/lib/firewalld/` 中。\n\n### 安装 fireld\n```bash\nyum install\
  \ firewalld\n```\n\n### 检查状态\n```bash\nsystemctl status firewalld\n```\n或者\n```bash\n\
  firewall-cmd --state\n```\n\n## Firewallld 概念\n### 配置选项\nfirewalld 的规则可以指定为永久性（Permanent）或运行时（Runtime）。运行时更改是立即生效但非永久的防火墙设置更改。永久性更改写入配置文件，但除非重新加载或重启机器，否则不会立即应用。\n\
  \n### 区域 (Zones)\n在 firewalld 中，区域的概念是基于网络接口的。所有网络接口都可以位于同一个默认区域，或者根据定义的信任级别划分到不同的区域。默认使用\
  \ `public` 区域。\n\n## 区域列表说明\n- `Drop`: 丢弃所有入站连接，仅可用出站网络连接。\n- `Block`: 仅允许出站网络连接。使用\
  \ `icmp-host-prohibited` 消息拒绝所有入站连接。\n- `Public`: 你信任网络上的其他计算机。只接受选定的入站连接。用于公共区域。\n\
  - `Home`: 仅接受选定的入站连接。用于家庭区域。\n- `Work`: 你大部分信任网络上的其他计算机。只接受选定的入站连接。用于工作区域。\n- `DMZ`:\
  \ 用于 DMZ 非军事化区的计算机，这些计算机可公开访问但访问内部网络有限，只接受选定的入站连接。\n- `External`: 用于启用了伪装（masquerading）的外部网络。只接受选定的入站连接。\n\
  - `Internal`: 用于内部网络。你大部分信任网络上的其他计算机。只接受选定的入站连接。\n- `Trusted`: 所有网络连接。\n\n## Zones\
  \ 命令\n列出可用区域\n```bash\nfirewall-cmd --get-zones\n```\n显示默认区域\n```bash\nfirewall-cmd\
  \ --get-default-zone\n```\n\n更改默认区域\n```bash\nfirewall-cmd --set-default-zone=internal\n\
  ```\n\n检查接口关联的区域\n```bash\nfirewall-cmd --get-zone-of-interface=ens33\n```\n\n\n\
  \n\n\n其中 `ens33` 是接口名称，你可以使用 `ip add show` 命令进行检查。\n\n## 更改接口的区域\n\n```bash\nfirewall-cmd\
  \ --permanent --zone=internal --change-interface= ens33\n```\n\n## 服务 (Services)\n\
  \nFirewalld 服务允许基于预定义的规则允许网络流量。一个 `Firewalld` 服务可以是本地端口、协议和目的地的列表。你也可以为服务创建自己的自定义规则。`/usr/lib/firewalld/services`\
  \ 目录包含默认支持服务的配置文件，用户创建的自定义服务文件位于 `/etc/firewalld/services` 目录。\n\n### 列出默认区域（default\
  \ zone）中的服务列表\n```bash\nfirewall-cmd --list-services\n```\n\n### 将服务永久添加到默认区域\n\n\
  #### 语法\n```bash\nfirewall-cmd --permanent --add-service=servicename\n```\n\n####\
  \ 示例\n```bash\nfirewall-cmd --permanent --add-service=http\n```\n\n之后，你必须重新加载新配置\n\
  ```bash\nfirewall-cmd --reload\n```\n\n### 将服务添加到特定区域\n```bash\nfirewall-cmd --permanent\
  \ --zone=internal --add-service=http\n```\n\n## 端口 (Port)\n\nFirewalld 允许我们直接管理网络端口。\n\
  \n### 列出默认区域中的端口\n```bash\nfirewall-cmd --list-ports\n```\n\n### 在防火墙中开放端口\n要永久打开一个新端口（例如\
  \ `TCP/5903`），请使用这些命令。\n\n```bash\nfirewall-cmd --permanent --zone=public --add-port=5903/tcp\n\
  ```\n\n然后重新加载配置\n```bash\nfirewall-cmd --reload\n```\n\n### 检查新配置\n```bash\nfirewall-cmd\
  \ --list-ports\n```\n\n## 使用 GUI 进行防火墙配置\n\n如果你不喜欢使用命令，Redhat 还提供了用于配置防火墙的 GUI（图形化用户界面）。\n\
  \n### 安装\n如果尚未安装 GUI 防火墙，可以通过以下命令安装：\n```bash\nyum install firewall-config\n```\n\
  \n防火墙界面有两个版本：第一个是在 Gnome 环境下运行的版本，第二个可以在命令行中工作。这里我们将讨论 Gnome 版本。\n\n### 在 Gnome\
  \ 终端中以 root 身份启动 GUI 登录\n1. 运行终端窗口。\n2. 在终端窗口输入以下命令\n```bash\nfirewall-config\n\
  ```\n![](img/Image00060.jpg) 它将打开防火墙界面\n\n## 更改防火墙设置\n\n### 更改配置\n当你启动界面时，从配置下拉菜单中选择\
  \ `Runtime`（运行时）配置可以立即更改当前防火墙设置；或者，若要让设置在下次系统启动或防火墙配置重重加载时生效，请从下拉列表中选择 `Permanent`（永久）。\n\
  \n### 更改连接的区域\n要为某个区域配置或添加连接，启动 `firewall-config`，从选项菜单中选择 `Change zone of connections`（更改连接区域）。它将显示带有可用连接列表的子菜单，从下拉菜单中选择所需的连接。从下一个下拉菜单选择\
  \ `Zone`（区域）。\n\n![](img/Image00061.jpg)\n![](img/Image00062.jpg) 设置默认区域\n![](img/Image00063.jpg)\
  \ ![](img/Image00064.jpg) 要为新接口设置默认区域或更改现有接口的默认区域，启动 `firewall-config`。首先选择所需的连接，然后从菜单栏中选择\
  \ `Options`，并从下拉菜单中选择 `Change Default Zone`。现在从菜单列表中选择所需的区域。\n\n### 配置服务\n`Firewall-config`\
  \ 工具提供了启用和禁用预定义或自定义服务的界面。\n1. 选择配置类型 `permanent` 或 `runtime`。\n2. 选择 `zone`。\n3.\
  \ 选中或取消服务复选框。选中的复选框表示服务已启用，取消勾选的复选框用于阻止该服务。\n![](img/Image00065)\n\n## 分区 (Partition)\n\
  \n硬盘或驱动器是安装在电脑或服务器上的硬件部分，用于存储数据并通过电磁电荷表面或芯片快速访问大量数据。今天硬盘的容量可以达到 GB（千字节）和 TB（太字节）。硬盘可以是内置或外部。随着硬盘容量的不断增加，你可能会想在同一台机器上安装多个操作系统，这就需要对硬盘分区。分区也有助于将操作系统、应用程序和数据分开，以便更好地管理。\n\
  \n### 分区\n在计算机语言中，分区是将存储设备（主要是硬盘）划分为多个段，你可以在其中运行多个一个系统。存储分区有助于更好地管理和方便备份。Linux 中有多种存储工具，如\
  \ `fdisk`、`parted` 等。我们将讨论主要的工具 `fdisk` 和 `parted`。\n\n### fdisk\n`fdisk` 是一个强大且最流行的用于分区管理的命令行工具。它是一个基于文本的菜单驱动程序，用于创建和操作分区表。它支持多种类型的分区格式，包括\
  \ MS-DOS 和 GPT。它提供了在磁盘上显示、创建、调整大小、删除和修改分区的接口。\n\n#### 使用 fdisk 管理分区\n##### 列出分区表\n\
  ```bash\nfdisk -l\n```\n##### 列出特定设备的分区表语法\n```bash\nfdisk -l <device name>\n```\n\
  \n#### 示例\n在设备上创建新分区。在此示例中，`/dev/sdb` 被添加到了系统：\n1. 首先打印所有存储设备的列表，并检查想要创建分区的设备名称\n\
  ```bash\nfdisk -l\n```\n输出：\n`Disk /sdb: 21.5 GB, 21474836480 bytes, 41943040 sectors`\n\
  `Units = sectors of 1 * 512 = 512 bytes`\n`Free space: 21474836480 bytes`\n\n4.\
  \ 在 `/dev/sdb` 设备上运行 `fdisk` 准备创建分区的设备：\n```bash\nfdisk -l\n```\n输出：\n`Disk /sdb:\
  \ 21.5 GB, 21474836480 bytes, 41943040 sectors`\n`Units = sectors of 1 * 512 = 512\
  \ bytes`\n`Free space: 21474836480 bytes`\n`Sector size (logical/physical): 512\
  \ bytes / 512 bytes`\n`I/O size (minimum/optimal): 512 bytes / 512 bytes`\n\n2.\
  \ 在 `/设备上运行 `fdev `fdb`\n```bash\nfdisk /dev/sdb\n```\n3. 打印分区表，输入 `p` 键\n```bash\n\
  p\n```\n输出：\n`Disk /sdb: 21.5 GB, 21474836480 bytes, 41943040 sectors`\n`Units =\
  \ sectors of 1 * 512 = 512 bytes`\n`Free space: 21474836480 bytes`\n`Disk label\
  \ type: dos`\n`Disk identifier: 0xd397c54b`\n`Device             Start         End\
  \   Sectors Id`\n\n4. 按 `n` 创建新分区\n```\nn\n```\n5. 按 `p` 设置分区类型为主主分区，或按 `e` 设置扩展分区\n\
  ```\np\n```\n6. 给分区编号，如 1, 2, 3, 4。如果是设备上的第一个分区，则输入 1\n```\n1\n```\n7. 按回车使用默认起始扇区，如果不从默认扇区开始，可以输入值\n\
  ```\n2048\n```\n8. 对于最后一个扇区，你可以通过扇区数计算大小，可以使用人类可读的值 `+1G` 来创建 1 GB 分区。如果你直接按回车不输入任何值，将在设备上创建剩余空间分区\n\
  ```\n+1G\n```\n9. 按 `w` 写入磁盘\n```\nw\n```\n\n### 删除分区\n使用 `fdisk` 删除硬盘上存在的分区的步骤如下。在此示例中，设备名称为\
  \ `/dev/sdb`，我们想要删除 `/dev/sdb2` 分区。\n\n#### 显示所需设备的分区表\n```\nfdisk -l /dev/sdb\n\
  ```\n输出：\n`Disk /sdb: 21.5 GB, 21474836480 bytes, 41943040 sectors`\n`Units = sectors\
  \ of 1 * 512 = 512 bytes`\n`Free space: 21474836480 bytes`\n`Disk label type: dos`\n\
  `Disk identifier: 0xd397c54b`\n`Device             Start         End   Sectors Id`\n\
  `/dev/sdb1 2048 1955839 976896 83 Linux`\n`/dev/sdb2 1955840 41943039 19993600 83\
  \ Linux`\n\n一旦知道了要删除的分区分区，运行磁盘命令并指定设备名称\n```\nfdisk /dev/sdb\n```\n输出：\nWelcome\
  \ to fdisk (util-linux 2.23.2).\nChanges 将仅留在内存中，直到你决定写入它们。\n\n\n\n\n\n在使用 `write`\
  \ 命令前请务小心。\n\n### 删除分区\n\n命令（输入 m 获取帮助）：\n\n按下 `d` 删除分区。\n\n命令（输入 m 获取帮助）：`d`\n\n\
  输入要删除的分区号，在此例中，分区号为 `2`。按下 `2` 并按回车。\n\n分区号（1,2, 默认 2）：`2`\n\n分区 2 已删除。\n\n按下 `p`\
  \ 和回车打印新的分区表。\n\n命令（输入 m 获取帮助）：`p`\n\n```text\nDisk /dev/sdb: 21.5 GB, 21474836480\
  \ bytes, 41943040 sectors\nUnits = sectors of 1 * 512 = 512 bytes\nSector size (logical/physical):\
