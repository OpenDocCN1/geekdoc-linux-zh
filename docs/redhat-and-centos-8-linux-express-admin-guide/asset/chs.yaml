  \n安装新服务的步骤\n\n1. 安装新服务包\n```bash\nyum install service_name\n```\n\n2. 配置服务在启动时自动启动\n\
  ```bash\nsystemctl enable name.service\n```\n\n3. 启动服务\n```bash\nsystemctl start\
  \ name.service\n```\n\n示例\n```bash\nyum install httpd\nsystemctl enable httpd.service\n\
  systemctl start httpd.service\n```\n\nsystemd 目标\n\n\n\n\n\n旧版本（如 RedHat 6 及更早版本）实现了运行级别（run\
  \ levels）。运行级别是操作系统运行的某种或模式。每个运行级别会导致某些服务的停止或启动，从而实现对机器行为的控制。然而，在 RHEL 7 中，它被 `systemd`\
  \ 目标（targets）取代了。Redhat 6 或更早版本有七个运行级别，它们在新版本中已被相应的目标单元取代。\n\n| 运行级别 | 描述 | 目标单元\
  \ (Target unit) |\n| :--- | :--- | :--- |\n| 0 | 关机 | `poweroff.target` |\n| 1 |\
  \ 单用户模式 | `rescue.target` |\n| 2 | 无 GUI 的命令行多用户模式 | `multiuser.target` |\n| 3 |\
  \ 无 GUI 的命令行多用户模式 | `multiuser.target` |\n| 4 | 无 GUI 的命令行多用户模式 | `multiuser.target`\
  \ |\n| 5 | 带 GUI 的多用户模式 | `graphical.target` |\n| 6 | 重启 | `reboot.target` |\n\n\
  列出当前加载的目标\n```\nsystemctl list-units --type target\n```\n\n## 默认目标 (Default Target)\n\
  默认目标决定了 systemd 在启动时引导系统的方向。`/etc/inittab` 文件不再像在 RHEL 早期版本那样用于设置默认运行级别。现在默认目标单元由\
  \ `/etc/systemd/system/default.target` 文件表示。该文件是当前设置目标的符号链接。假设当前目标设置为 graphical，此文件将指向\
  \ graphical 目标文件的符号链接。\n\n### 修改默认目标\n#### 语法\n```\nsystemctl set-default <name\
  \ of target>.target\n```\n#### 示例\n```\nsystemctl set-default graphical.target\n\
  ```\n已删除符号链接 `/etc/systemd/system/default.target`。\n已创建从 `/etc/systemd/system/default.target`\
  \ 到 `/usr/lib/systemd/system/graphical.target` 的符号链接。\n\n#### 查看默认目标\n```\nsystemctl\
  \ get-default\n```\n\n### 修改当前目标\n在更改默认目标后，当前目标在下次重启之前将保持不变。要在不重启的情况下更改当前目标，请使用：\n\
  \n#### 语法\n```\nsystemctl isolate default\n```\n或\n```\nsystemctl default\n```\n\
  \n将当前目标更改为默认目标以外的不同目标。假设你想启动单用户目标：\n\n#### 语法\n```\nsystemctl isolate newtarget.target\n\
  ```\n#### 示例\n```\nsystemctl isoloate rescue.target\n```\n\n## 第 10 章. OpenSSH\n\
  SSH（安全外壳）在客户端-服务器架构中为不安全的网络提供了一个安全通道。SSH 是不安全协议 `telnet` 的替代品。它允许通过安全通道远程登录并执行命令，因为客户端和服务器之间的所有通信都是加密的。RHEL\
  \ 包含了用于 `ssh` 的 `OpenSSH` 包。随 RHEL 附带的 SSH 套件是 SSH 版本 2。OpenSSH 为安全通信提供了许多工具，如 `ssh`、`scp`\
  \ 和 `sftp`。它还提供了安全隧道、不同的身份验证方法和易于配置的功能。RHEL 8 包含了 `openssh`、`openssh-server` 和 `openssh-clients`\
  \ 软件包。`openssh` 包还需要在系统中安装 `openssl-libs`，因为它为加密通信提供了加密库。RHEL 的默认安装预装了 `openssh`。如果没有，则需要使用此命令安装它们。\n\
  \n```\nyum install openssh openssh-server openssh-clients openssl-libs\n```\n\n\
  ### 启动服务\n```\nsystemctl start sshd.service\n```\n### 设置服务在系统启动时自动启动\n```\nsystemctl\
  \ enable sshd.service\n```\n### 检查状态\n```\nsystemctl status sshd.service\n```\n\n\
  ### SSH 协议版本\nSSH 有两个版本：版本 1 和版本 2。RHEL 8 提供的 OpenSSH 套件是 SSH 版本 2。SSH2 更安全，并且包含了\
  \ SFTP，其功能与 FTP 类似，但具有加密。`scp` 代替了 `rcp`。\n\n检查你正在运行的 `ssh` 版本：\n```\nssh -v localhost\n\
  ```\n此命令显示 `ssh` 的详细模式，请查找以下行：\n`debug1: Local version string SSH-2.0-OpenSSH_7.8`\n\
  \n### 配置文件\n| 文件 | 描述 |\n| :--- | :--- |\n| `/etc/ssh/sshd_config` | `sshd` 守护进程的默认配置文件\
  \ |\n| `/etc/ssh/ssh_config` | SSH 客户端默认配置文件。如果存在 `~/.ssh/config`，则它会被覆盖 |\n| `~/.ssh/config`\
  \ | 客户端侧配置文件 |\n\n### 从客户端连接\n如果你在 Linux 客户端机器上并想要登录到远程 RHEL 服务器，你需要在客户端机器上安装 `ssh`\
  \ 客户端，并在 RHEL 服务器上运行 SSH 服务端。从客户端执行此命令：\n```\nssh –x user@ server-IPaddress_or_hostname\n\
  ```\n#### 示例\n```\nssh –x root@RHEL1\n```\n无法建立主机 'RHEL1 (192.168.131.152)' 的真实性。\n\
  ECDSA 密钥指纹为 SHA256:kJkcVAsgMdv5FsbEeaHWNK33LJHHLaHSUC8WZE/Sri8。\n你确定要继续连接吗 (yes/no)?\
  \ yes\n警告: 已将 'RHEL1,192.168.131.152' (ECDSA) 永久添加到已知主机列表。\n`root@RHEL1's password:`\n\
  `[root@RHEL1 ~]`\n\n它会询问 `ssh` 命令中指定的用户的密码。当第一次从客户端到服务器建立 `ssh` 连接时，服务器的公钥将存储在客户端本地，这样下次就可以验证其身份。\n\
  `Ctrl + d` 或 `exit` 命令将终止 `ssh` 会话。\n从客户端终止 `ssh` 会话：\n```\nexit\n```\n\n## 使用 SSH\
  \ 密钥免密登录\nSSH 也允许客户端在无密码登录。在本节中，我们将学习如何操作。客户端....... R111....1....1.1 keys 在上\n\n\
  111\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n11\n```\nssh-keygen\n\
  ```\n2. 将公钥从 RHEL1 复制到第二台服务器 RHEL2：\n```\nscp ~/.ssh/id_rsa.pub root@RHEL2:/root/\n\
  ```\n3. 在第二台服务器 RHEL2 的家目录下创建 `.ssh` 目录并将权限更改为 700（仅所有者可读写执行）：\n```\nmkdir .ssh\n\
  chmod 700 .ssh\n```\n4. 将早期复制到 /root 的公钥追加到 `authorized_keys` 文件并更改权限：\n```\ncat\
  \ id_rsa.pub >> .ssh/authorized_keys\nchmod 644 .ssh/authorized_keys\n```\n5. 现在尝试从\
  \ RHEL1 登录 RHEL2，将不需要密码：\n```\nssh root@RHEL2\n```\n\n### scp 工具\n`scp` 是 openssh\
  \ 套件的一部分，可以通过加密连接在机器间传输文件。它是 `rcp` 命令的安全替代方案。`scp` 命令的语法如下：\n\n#### 语法\n```\nscp\
  \ filename username@hostname:/directory\n```\n#### 示例\n```\nscp abc.txt user1@RHEL2:.\n\
  ```\n在此示例中，我们将 `abc.txt` 从主机 1 RHEL1 传输到远程机器 RHEL2。\n\n从远程机器传输文件到本地系统：\n#### 语法\n\
  ```\nscp username@hostname:remotefile localdirectory\n```\n#### 示例\n在此示例中，我们将 xyz.txt`\
  \ 从远程主机 2 RHEL2 传输到本地机器 RHEL1。在 RHEL1 shell 提示符下：\n```\nscp user2@RHEL2:/home/user2/xyz.txt\
  \ /home/user1/\n```\n\n### sftp 工具\n文件传输协议 (FTP) 是用于计算机间传输文件的常用协议，特别是从互联网下载文件。然而，它使用未加密的通信，是不安全的。SSH\
  \ 文件传输协议 (SFTP) 是 FTP 的一种 SSH 实现，提供了加密数据传输。`sftp` 提供交互式提示符。你可以使用命令向远程主机下载或上传文件。\n\
  \n使用 `sftp username@hostname` 或服务器 IP 地址连接远程系统，它会询问用户名的密码：\n\n#### 语法\n```\nsftp\
  \ username@hostname\n```\n#### 示例\n```\nsftp user1@RHEL2\n```\n\n### sftp 常用命令\n\
  | 命令 | 描述 |\n| :--- | :--- |\n| `?` | 帮助 |\n\n\n\n\n\n# SFTP 命令\n\n| 命令 | 说明 |\n\
  | :--- | :--- |\n| `ls` | 列出远程目录内容 |\n| `lls` | 列出本地目录内容 |\n| `cd` | 切换远程目录 |\n\
  | `lcd` | 切换本地目录 |\n| `mkdir directoryname` | 在远程服务器上创建目录 |\n| `lmdir directoryname`\
  \ | 创建本地目录 |\n| `rmdir directoryname` | 删除远程目录 |\n| `put filename` | 将文件传输到远程服务器\
  \ |\n| `mput files` | 将多个文件传输到远程机器 |\n| `get filename` | 将文件下载到本地机器 |\n| `mget files`\
  \ | 下载多个文件 |\n| `bye` | 退出 sftp |\n| `! command` | 执行 shell 命令 |\n\n#### 示例\n\n\
  ### 获取帮助\n```\nsftp> ?\n```\n可用命令：\n- `bye`: 退出 sftp\n- `cd path`: 将远程目录切换到 'path'\n\
  - `chgrp grp path`: 将文件 'path' 的组更改为 'grp'\n`[…输出截断.. ]`\n\n### 上传单个文件\n将文件从本地传输到远程机器：\n\
  ```\nsftp> put xyz.txt\n```\n将 `xyz.txt` 上传到 `/home/user1/xyz.txt`\n`xyz.txt 100%\
  \ 1508 1.5KB/s 00:00`\n\n### 上传多个文件\n```\nsftp> mput *.txt\n```\n正在将 `11.txt` 上传到\
  \ `/home/user1/11.txt`\n`11.txt 100% 1663 1.6KB/s 00:00`\n正在将 `a2.txt` 上传到 `/home/user1/a2.txt`\n\
  `a2.txt 100% 1715 1.7KB/s 00:00`\n\n### 下载单个文件\n将文件从远程传输到本地机器：\n```\nsftp> get abc.txt\n\
  ```\n正在获取 `/home/user1/abc.txt` 到 `abc.txt`\n`/home/user1/abc.txt 100% 1508 1.5KB/s\
  \ 00:00`\n\n### 下载多个文件\n```\nsftp> mget *.txt\n```\n\n### 切换目录\n要在远程机器上从一个目录切换到另一个：\n\
  ```\nsftp> cd Documents\n```\n在本地机器上：\n```\nsftp> lcd Downloads\n```\n\n### 创建新目录\n\
  在远程机器上：\n```\nsftp> mkdir julli\n```\n在本地机器上：\n```\nsftp> lmkdir David\n```\n\n\
  ### 删除目录\n```\nsftp> rmdir julli\n```\n\n### 退出 sFTP\n```\nsftp> bye\n```\n\n# 第\
  \ 11 章. VNC\n\n`VNC (Virtual Network Computing)` 是一种图形化桌面共享系统。它用于远程获取 Linux 服务器的\
  \ GUI 桌面。VNC 包含两个部分：一个是 `VNC server`，另一个是 client `VNC client`。`VNC server` 运行在 RHEL\
  \ 服务器上，而客户端运行在 MS Windows 或 Linux 工作站上。`X Server` 运行在 RHEL 服务器上，而 `VNC client` 仅显示显示器的副本。\n\
  \n## 在想要共享桌面的服务器上配置 VNC\n\n1. **安装**\n   ```bash\n   yum install tigervnc-server\n\
  \   ```\n\n2. **设置 VNC 密码**\n   语法：\n   ```bash\n   su - user_name\n   vncpasswd\n\
  \   ```\n   示例：`![](img/Image00054.jpg)`\n\n3. **创建文件 `/etc/systemd/system/vncserver@.service`**\n\
  \   ```bash\n   vi /etc/systemd/system/vncserver@.service\n   ```\n   在此文件中添加以下行。请确保将用户名、组和主目录替换为上一步中设置密码密码的用户和主目录。\n\
  \n```ini\n[Unit]\nDescription=远程桌面 VNC 服务\nAfter=syslog.target network.target\n\n\
  [Service]\nType=forking\nWorkingDirectory=/home/admin\nUser=admin\nGroup=admin\n\
  ExecStartPre=/bin/sh -c '/usr/bin/vncserver -kill %i > /dev/null 2>&1 || :'\nExecStart=/usr/bin/vncserver\
  \ -autokill %i\nExecStop=/usr/bin/vncserver -kill %i\n\n[Install]\nWantedBy=multi-user.target\n\
  ```\n\n4. **在显示数字为 1 的端口启动并启用 VNC 服务**\n   ```bash\n   systemctl start vncserver@:1.service\n\
  \   systemctl enable vncserver@:1.service\n   ```\n\n5. **验证 VNC 服务是否在 5901 端口**\n\
  \   ```bash\n   netstat -tunlp | grep 5901\n   ss -tunlp | grep 5901\n   ```\n \
  \  **开启防火墙端口**\n   ```bash\n   firewall-cmd --permanent --add-port=5901/tcp\n  \
  \ firewall-cmd --reload\n   ```\n\n6. 在 Windows 7/10 工作站从 tigervnc 网站下载 `vncviewer`。\n\
  \n7. 运行下载的文件，它将提示 vnc 服务器的 IP 地址和显示数字。按 `IPAddress:DisplayNumber` 格式输入 IP 地址和显示数字后，点击连接。\n\
  \   `![](img/Image00054.jpg)`\n\n8. `![](img/Image00054.jpg)` 9. `![](img/Image00054.jpg)`\
  \ 虚拟\n\n# 第 12 章. Web\n\nHTTP（文本传输协议）\n\n\n\n\n\n如果系统中启用了 SELinux，请更改新创建目录的上下文。\n\
  \n```bash\nsemanage fcontext -a -t httpd_sys_content_t \"/var/www/html/abc_example.com(/.*)?\"\
  \nsemanage fcontext -a -t httpd_sys_content_t \"/var/www/html/xyz_example.com(/.*)?\"\
  \nrestorecon -R -v /var/www/html/\n```\n\n## 验证上下文\n\n```bash\nls -laZ /var/www/html/\n\
  ```\n\n## 5. 配置你的虚拟主机配置目录\n\n为虚拟站的配置文件创建两个目录——一个目录用于所有已配置的网站 (`sites-available`），另一个目录用于存放将发布的虚拟主机的符号链接\
  \ (`sites-enabled`）。\n\n```bash\nmkdir -p /etc/httpd/sites-available\nmkdir -p /etc/httpd/sites-enabled\n\
  ```\n\n## 6. 修改 Apache 配置文件\n\n编辑主配置文件（`/etc/httpd/conf/httpd.conf`）以包含新的配置目录 (`sites-enabled`），以便\
  \ Apache 将在该目录中查找虚拟主机。\n\n```bash\nvi /etc/httpd/conf/httpd.conf\n```\n\n在文件的最末尾添加此行：\n\
  \n```apache\nIncludeOptional sites-enabled/*.conf\n```\n\n保存文件并退出 `vi`。\n\n## 7.\
  \ 创建虚拟主机配置文件\n\n为每个虚拟主机创建配置文件。\n\n```bash\nvi /etc/httpd/sites-available/abc_example.com.conf\n\
  ```\n\n```apache\n<VirtualHost *:80>\n    ServerName www.abc_example.com\n    ServerAlias\
  \ abc_example.com\n    DocumentRoot /var/www/html/abc_example.com\n</VirtualHost>\n\
  ```\n\n```bash\nvi /etc/httpd/sites-available/xyz_example.com.conf\n```\n\n```apache\n\
  <VirtualHost *:80>\n    ServerName www.xyz_example.com\n    ServerAlias xyz_example.com\n\
  \    DocumentRoot /var/www/html/xyz_example.com\n</VirtualHost>\n```\n\n在 `sites-enabled`\
  \ 目录中创建虚拟主机配置文件的软链接（注意此命令是单行的，由于页面宽度限制它被折到了下一行。执行此命令时，请以单行执行）。\n\n```bash\nln -s\
  \ /etc/httpd/sites-available/abc_example.com.conf /etc/httpd/sites-enabled/abc_example.com.conf\n\
  ln -s /etc/httpd/sites-available/xyz_example.com.conf /etc/httpd/sites-enabled/xyz_example.com.conf\n\
  ```\n\n## 8. 验证配置文件并重启 httpd 服务\n\n### 验证配置文件\n\n```bash\napachectl configtest\n\
  ```\n\n### 重启服务\n\n```bash\nsystemctl restart httpd\n```\n\n## 6. 在 /etc/hosts 文件或\
