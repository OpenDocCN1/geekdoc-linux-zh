  \  QNX.x 2nd part 8e  Linux LVM      df\n9  AIX bootable    4f  QNX.x 3rd part 93\
  \  Amoeba\na  OS/2 Boot Manag 50  OnTrack DM      94  Amoeba BBT      e3  DOS/O\n\
  b  W95 FAT32       51  OnTrack DM6 Aux 9f  BSD/OS      e4  SpeedStor\nc  W95 FAT32\
  \ (LBA) 52  CP/M            a0  IBM Thinkpad eb  BeOS fs\ne  W95 FAT16 (LBA) 53\
  \  OnTrack DM6 Aux a5  FreeBSD      ee  GPT\nf  W95 Ext'd (LBA) 54  OnTrackDM6 \
  \     a6  OpenBSD      ef  EFI (FAT-12/16/\n10 OPUS            55  EZ-Drive    \
  \    a7  NeXTSTEP      f0  Linux/PA-RISC\n```\n\n\n\n\n# 以下是创建分区的步骤\n\n1. 输入 `parted`\
  \ 命令并指定所需的设备名称。\n2. 使用 `mkpart` 命令。\n3. 选择分区类型，可以是主分区（primary）或扩展分区（extended）。\n\
  4. 指定文件系统类型，默认为 `ext2`。\n5. 类似于 `fdisk`，提供起始和结束扇区编号；如果是新磁盘，起始扇区将为 `1`，结束位置可以指定大小，如\
  \ `1G` 表示 1GB 的分区大小。\n\n```\n(parted) mkpart\nPartition type? primary/extended?\
  \ primary\nFile system type? [ext2]?\nStart? 1\nEnd? 1G\n(parted) print\nModel:\
  \ VMware, VMware Virtual S (scsi)\nDisk /dev/sdb: 21.5GB\nSector size (logical/physical):\
  \ 512B/512B\nPartition Table: msdos\nDisk Flags:\nNumber  Start   End     Size \
  \  Type     File system Flags\n  1       1049kB  1000MB  999MB  primary\n(parted)\
  \ quit\n```\n\n## 添加分区\n\n如果你在硬盘上有可用空间并想再添加一个分区，可以在 `parted` 接口中输入 `mkpart` 命令。它会询问与创建第一个分区时相同的问题。然而，这次的起始位置将上一个分区的结束位置，该起始位置加上分区的大小即该分区的结束位置。在示例中，起始位置是\
  \ `1000MB`（因为第一个分区的结束于 11000MB`），如果你想添加 `1000MB` 的分区，则该分区的结束位置将是 `2000MB`（`1000MB\
  \ + 1000MB`）。\n\n```\n(parted) mkpart\nPartition type? primary/extended? primary\n\
  File system type? [ext2]?\nStart? 1000MB\nEnd? 2000MB\n(parted) print\nModel: VMware,\
  \ VMware Virtual S (scsi)\nDisk /dev/sdb: 21.5GB\nSector size (logical/physical):\
  \ 512B/512B\nPartition Table: msdos\nDisk Flags:\nNumber  Start   End     Size \
  \  Type     File system Flags\n1       1049kB  1000MB  999MB  primary\n2       1000MB\
  \  2000MB  999MB  primary\n```\n\n## 删除分区\n\n使用 `rm partition_number` 命令删除分区。\n\n\
  #### 示例\n\n```\n(parted) print\nModel: VMware, VMware Virtual S (scsi)\nDisk /dev/sdb:\
  \ 21.5GB\nSector size (logical/physical): 512B/512B\nPartition Table: msdos\nDisk\
  \ Flags:\nNumber  Start   End     Size   Type     File system Flags\n1       1049kB\
  \  1000MB  999MB  primary\n2       1001MB  2001MB  999MB  primary\n3       2001MB\
  \  3001MB  1000MB primary\n(parted) rm 3\n(parted) print\nModel: VMware, VMware\
  \ Virtual S (scsi)\nDisk /dev/sdb: 21.5GB\nSector size (logical/physical): 512B/512B\n\
  Partition Table: msdos\nDisk Flags:\nNumber  Start   End     Size   Type     File\
  \ system Flags\n1       1049kB  1000MB  999MB  primary\n2       1001MB  2001MB \
  \ 999MB  primary\n```\n\n在本章中，我们学习了如何管理分区，在下一章中，我们将讨论如何在这些分区上创建文件系统。\n\n# 第 18 章\
  \ 文件系统\n\n文件系统是操作系统用于存储和检索数据的方法。文件系统有助于管理和安排数据。Linux 提供了不同类型的文件系统。每种文件系统都使用不同的结构和逻辑来存储和检索数据。某些文件系统是专门为特定设备和应用程序设计的，例如\
  \ `ISO 9660` 文件系统用于 `CDROM` 等光盘。根据文件系统的类型，它可以是局部的，也可以是网络上的。Linux 支持多种文件系统，每个文件系统都有其优缺点。我们将讨论\
  \ RHEL 中使用的一些常用文件系统。在 RHEL 8 中，`BTRFS` 文件系统已被移除。这意味着你将无法在 RHEL 8 上创建、挂载或安装 `btrfs`\
  \ 文件系统。\n\n## XFS\n\nXFS 是一种高性能日志文件系统，最初由 Silicon Graphics, Inc. 为 `IRIX` 操作系统创建，后来移植到\
  \ Linux。XFS 支持元数据日志，这有助于更快地恢复崩溃。XFS 文件系统在挂载和激活状态下也可以进行碎片整理和扩展。XFS 在将实际数据提交磁盘之前，会将文件系统的更新异步记录到循环缓冲区（日志）中。XFS\
  \ 是 RHEL 8 的默认文件系统。XFS 新增了写时复制（copy-on-write）数据段的新功能。此功能允许两个或多个文件共享一组公共数据。当共享块的任一个文件发生变化时，XFS\
  \ 会断开与公共块的链接并创建一个新文件。这有助于节省空间和磁盘写入。\n\n### 创建 XFS 文件系统\n\n1. 使用 `fdisk` 创建分区。\n\
  2. 使用 `fdisk -l` 检查设备名称。\n3. 使用 `mkfs -t xfs /dev/sdb1` 创建文件系统。\n4. 创建挂载点。\n5. 在\
  \ `/etc/fstab` 中添加配置。\n\n（注：由于原文后续 XFS 创建步骤描述存在大量逻辑乱码和重复，此处译文已根据技术逻辑进行了精简处理，以确保核心步骤清晰。）\n\
  \n\n\n\n\n```\n/dev/sdb2      307     614     1050280   82 Linux swap / Solaris\n\
  \nPress w to write partition to disk\n\nCommand (m for help): w\n\nThe partition\
  \ table has been altered!\n\nCalling ioctl() to re-read partition table.\n\nSyncing\
  \ disks.\n```\n\n### 2. 执行 `mkswap /dev/sdb2`，`sdb2` 是将用交换区的分区名称。\n\n```bash\n~]#\
  \ mkswap /dev/sdb2\n```\nSetting up swapspace version 1, size = 1050276 KiB\nno\
  \ label, UUID=c1f98067-9548-4bf1-843d-5f09f5d5ba56\n\n### 3. 在 `/etc/fstab` 中添加条\n\
  \n```bash\n~]# cat /etc/fstab\n```\n/dev/mapper/cl-root /  xfs     defaults    \
  \   1 1\nUUID=6b761a5f-8c7c-465d-b58c-d29267938403 boot xfs     defaults       1\
  \ 2\n/dev/mapper/cl-swap swap               swap     defaults       0 0\n/dev/sdb1\
  \      /test1         xfs     defaults       0 2\nUUID=c1f98067-9548-..5ba56 swap\
  \ swap     defaults       0 0\n\n### 4. `swapon -a` 将激活交换区\n\n### 5. `swapon -s`\
  \ 将显示所有交换区的状态\n\n```bash\n~]# swapon -s\n```\nFilename            Type         \
  \   Size    Used    Priority\n/dev/dm-1           partition       2097144 0    \
  \   -1\n/dev/sdb2           partition       1050272 0       -2\n\n要停用交换空间：\n```bash\n\
  # swapoff /dev/sdb2\n```\n\n# 第 20 章 逻辑卷管理器 (LVM)\n\n在前面的章节中，我们学习了如何创建 Linux 分区，但\
  \ Linux 提供了创建 LVM 类型分区的选项。LVM 比普通分区更复杂。LVM 提供了以下优势：\n- 动态扩展文件系统\n- 缩小文件系统\n- 动态添加磁盘\n\
  - 镜像 (Mirroring)\n- 条带 (Stripping)\n- 文件系统的快照备份\n\n## LVM 中使用的术语\n\n### 物理卷 (PV)\n\
  物理卷 (PV) 是块设备的物理存储单元，可以是分区或整个磁盘。要将设备用于 LVM，请使用 `fdisk` 创建类型为 LVM 的分区。\n\n#### 1.\
  \ 创建物理卷 (PV)\n如果你在运行时插了了热拔磁盘或向虚拟机添加了虚拟磁盘，请使用以下脚本在 SCSI 总线上检测新磁盘。此脚本用于避免重启服务器；重启机器则不需要此步骤，因为启动过程会自动添加新安装的磁盘。\n\
  ```bash\nfor host in `ls /sys/class/scsi_host/`;do\necho \"- -\" >/sys/class/scsi_host/${host}/scan;\n\
  done\n```\n\n将磁盘分区更改为 LVM\n使用 `fdisk` 命令创建类型为 Linux LVM 8e 的分区。如果整个磁盘被用作 PV，则可以忽略此步骤。\n\
  ```bash\n~]# fdisk /dev/sdb\nWARNING: DOS-compatible mode 已弃用。强烈建议关闭该模式（命令 'c'）并将显示单位更改为扇区（命令\
  \ 'u'）。\nCommand (m for help): n\nCommand action\n  e  extended\n  p  primary partition\
  \ (1-4)\np\nPartition number (1-4): 3\nFirst cylinder (615-6132, default 615): Using\
  \ default value 615\nLast cylinder, +cylinders or +size{K,M,G} (615-6132, default\
  \ 6132): +5G\nCommand (m for help): t\nPartition number (1-4): 3\nHex code (type\
  \ to list): 8e\nChanged system of partition 3 to 8e (Linux LVM)\nCommand (m for\
  \ help): p\nDisk /devdb: 5 GB, 2147483648 bytes\n171 heads, 40 sectors/track, 6132\
  \ cylinders\nUnits = cylinders\n6132 = 3502080 bytes\nSector size (logical/physical):\
  \ 512 bytes\nDisk identifier: 0xdecee90\nDevice    Start   End     Blocks  Id  System\n\
  /dev/sdb1      1       307     104857683 Linux\n/dev/sdb2      307     614     1050280\
  \ 82 swap / Solaris\n/dev/sdb3      615     5246280 e LVM\nCommand (m for help):\
  \ w\nThe partition table has been altered!\n```\n\n#### 使用 `pvcreate` 创建 PV\n使用\
  \ `pvcreate` 创建由 `fdisk` 创建的设备。如果是整个磁盘，使用设备名称。\n```bash\n~]# pvcreate /dev/sdb3\n\
  ```\n物理卷 `/sdb3` 创建成功。\n```bash\n~]# pvdisplay /sdb3\n```\n`/sdb3` 是一个为 \"5.00 GiB\"\
  \ 的新物理卷。\n--- NEW Physical volume ---\nPV Name: /sdb3\nVG Name:\nPV Size: 5.00 GiB\n\
  Allocatable:\nTotal PE: 0\nFree PE: 0\nAllocated PE: 0\nPV UUID: 7El-WiGK-Z0m5-gP95\n\
  \n### 2. 定义卷组 (VG)\n一旦定义了 PV，就可以在其创建 VG。如果创建 VG 使用多个磁盘，首先为所有磁盘创建 PV。然后使用 `vgcreate`\
  \ 命令和所有 PV 名称来定义 VG。\n```bash\n# vgcreate vg01 /dev/sdb3\n```\n卷组 `vg01` 创建成功。\n\
  \n### 3. 创建逻辑卷 (LV)\n上所述 LV 是创建文件系统的基础。某些情况下 LV 也可以作为原始设备使用。使用 `lvcreate` 命令定义 LV。\n\
  ```bash\nlvcreate -n LV_name -L size VG_name\n# lvcreate -n lv01 -L 1G vg01\n```\n\
  逻辑卷 `lv01` 创建。\nLV 也可以镜像。镜像 LV 在不同设备上维护相同的数据。当数据写入一个设备时，也会写入第二个设备以实现冗余。\n创建镜像 LV：\n\
  ```bash\n# lvcreate -n lv01 -m1 -L 1G vg01\n```\n\n### 4. 在 LV 上创建文件系统\n使用 `mkfs`\
  \ 命令创建文件系统\n```bash\nmkfs -t xfs /dev/VG_name/LV_name\n```\n其中 `-t` 用于指定文件系统类型，逻辑卷名称按其卷组顺序指定。\n\
  ```bash\n# mkfs -t xfs /dev/vg01/lv01\n```\n\n### 5. 自动挂载新文件系统\n为了在系统启动时自动挂载文件系统，必须在\
  \ `/etc/fstab` 文件中添加条目。有两种方法：使用设备名称，另一种使用设备通用唯一标识符。使用 UUID 的优点是它独立于操作系统赋予硬盘的实际设备号。如果添加新设备，设备名称可能会更改，但设备的\
  \ UUID 保持不变。\n\n#### 使用设备名称在 fstab 文件中添加条目\n```bash\n# vi /etc/fstab\n```\n```\n\
  /dev/sdb2 /newfs  xfs     defaults       1 2\n```\n\n#### 使用 UUID 在 fstab 文件中添加条目\n\
  1. 新创建文件系统的 UUID：\n```bash\n# blkid /dev/vg01/lv01\n```\n2. 将条目添加到 `/etc/fstab`\
  \ 以启动时自动挂载：\n```\nUUID=6acaa-5541139e830e  /newfs  xfs     defaults       1 2\n\
  ```\n\n### 6. 挂载文件系统\n```bash\nmount -a\n```\n\n## LVM 查表\n\n### PV 命令\n| 描述 | 命令\
  \ |\n| :--- | :--- |\n| 显示 PV 属性 | `pvdisplay` |\n| 显示所有 LVM 块设备 | `pvscan` |\n\
  | 防止在 PV 上分配 PE | `pvchange -xn /dev/PV_name` |\n| 移除 PV | `pvremove /dev/PV_name`\
  \ |\n\n### 卷组命令\n| 描述 | 命令 |\n| :--- | :--- |\n| 显示 VG 属性 | `vgdisplay` |\n| 显示\
  \ VG 列表 | `vgs` |\n| 将 PV 添加到 VG | `vgextend vgname /dev/PV_name` (示例：# vgextend\
  \ vg01 /dev/sdb5`) |\n| 从 VG 移除 PV | `vgreduce vg1 /dev/PV_name` (示例：# vgreduce\
  \ vg01 /dev/sdb5`) |\n| 激活 VG | `vgchange -ay VG_name` |\n| 停用 VG | `vgchange -ay\
  \ VG_name` |\n| 移除 VG | `vgremove VG_name` (示例：`vgremove /dev/vg02`) |\n| 重新创建 VG\
  \ 目录 | `vgmknodes` |\n\n\n\n\n如果出现需要将整个卷组（Volume Group）从一个系统移动到另一个系统的情况。可能是由于当前系统的某些硬件问题，或者为了将旧存储迁移到新硬件，可以使用以下步骤。在这个示例中，有两个系统：一个是当前\
  \ `VG` 所在的旧系统，另一个是你想要移动到的新系统。\n\n### 在旧系统上\n\n1. 卸载所有属于该卷组的文件系统\n```bash\numount\
  \ /newfs\n```\n\n2. 使用 `vgchange -an VG_name` 命令停用 VG\n```bash\n[root@RHEL1 /]#\
  \ vgchange -an sharedvg\n```\n\n3. 使用 `vgexport VG_name` 命令导出 VG\n```bash\n[root@RHEL1\
  \ /]# vgexport sharedvg\n```\n\n### 在新系统上\n\n4. 将 HDD 连接到新系统后，使用 `vgimport VG_name`\
  \ 命令导入 VG\n```bash\n[root@RHEL2 ~]# vgimport sharedvg\n```\n\n5. 使用 `vgchange -ay\
  \ VG_name` 激活 VG\n```bash\n[root@RHEL2 ~]# vgchange -ay sharedvg\n```\n\n6. 在 VG\
  \ 上挂载文件系统\n```bash\n[root@RHEL2 ~]# mount /dev/sharedvg/sharedlv /mnt\n```\n\n7.\
  \ 检查文件系统内容\n```bash\n[root@RHEL2 ~]# cd /mnt\n```\n\n### 扩展文件系统\n\n1. 检查当前 FS 大小\n\
  ```bash\ndf -h /fsname\n/dev/mapper/vg01-lv01      1008M  34M  924M  4% /newfs\n\
  ```\n\n2. 检查是否有足够的空空间空间即你想要扩展的 FS 所在的 VG 是否空闲 PE。\n```bash\n# vgdisplay vg01\n \
  \ --- Volume group ---\n  VG Name             vg01\n  System ID\n  Format      \
  \         lvm2\n  Metadata Areas        1\n  Metadata Sequence No  5\n  VG Access\
  \            read/write\n  VG Status            resizable\n  MAX LV            \
  \   0\n  Cur LV               1\n  Open LV              1\n  Max PV            \
  \   0\n  Cur PV               1\n  Act PV               1\n  VG Size           \
  \   5.00 GiB\n  PE Size              4.00 MiB\n  Total PE             1280\n  Alloc\
  \ PE / Size      256 / 1.00 GiB\n  Free PE / Size       1024 / 4.00 GiB\n```\n\n\
  3. 使用 `lvextend -L size /dev/vgname/lvname` 扩展逻辑卷\n```bash\n# lvextend -L +200M\
  \ /dev/vg01/lv01\n```\n\n4. 使用 `xfs_growfs /fsname` 扩展文件系统\n```bash\n# xfs_growfs\
  \ /newfs\n```\n\n5. 检查 FS 大小\n```bash\ndf -h /fsname\n/dev/mapper/vg01-lv01  1.2G\
  \  34M  1.1G \n```\n\n### 缩小文件系统\n\n1. 检查当前 FS 大小\n```bash\ndf -h /fs_name\n/dev/mapper/vg01-lv01\
  \  1.2G  34M  1.1G \n```\n\n2. 备份文件系统\n```bash\n# xfsdump -f /tmp/newfs.dump /newfs\n\
  ```\n\n3. 卸载文件系统\n```bash\numount /fs_name\n# umount /newfs\n```\n\n4. 移除 LV\n```bash\n\
  # lvremove /dev/mapper/vg01-lv01\n```\n\n5. 重新创建 LV\n```bash\n# lvcreate -n lv01\
  \ -L1G vg01\n```\n\n6. 重新创建文件系统\n```bash\n# mkfs.xfs /dev/vg01/lv01\n```\n\n7. 检查\
  \ UUID\n```bash\n# blkid /dev/vg01/lv01\n```\n\n8. 在 `/etc/fstab` 中修改文件系统的 UUID\n\
  \n9. 挂载文件系统\n```bash\n# mount -a\n```\n\n10. 恢复备份\n```bash\nxfsrestore -f /tmp/newfs.dump\
  \ /newfs\n```\n\n11. 检查文件系统\n```bash\n# df -h /newfs\n```\n\n# NFS\n\n`NFS`（网络文件系统）是一种文件共享文件系统，基于服务器/客户端模式工作。服务器的共享文件系统挂载在客户端上。\n\
  \nNFS 有四个版本：\n1. NFS V1\n2. NFS V2\n3. NFS V3\n4. NFS V4\n\n其中 `NFS V3` 和 `NFS V4`\
  \ 是较新的 NFS 版本，`V3` 更安全且基于 UDP 协议，而 `V4` 增加了通过防火墙运行的优势并基于 TCP 运行。\n\n要让客户端可以使用共享文件系统，必须从服务器进行导出。在\
  \ NFS 服务器上配置导出的方法有两种方法：\n* 通过 `/etc/exports` 配置文件。\n* 在命令行中显式地使用 `exportfs` 工具，但这种方法在每次重启后都需要重新执行。\n\
  \n### 在服务器上配置 NFS\n\n安装包\n```bash\n# yum install nfs-utils\n# yum install rpcbind\n\
  ```\n\n启动服务\n```bash\n# systemctl start rpcbind\n# systemctl start nfs-server\n\
  ```\n\n让服务在下次重启时启动\n```bash\n# systemctl enable rpcbind\n# systemctl enable nfs-server\n\
  ```\n\n手动不通过 `/etc/exports` 导出文件系统\n```bash\n# exportfs -i /user1\n```\n\n使用 `/etc/exports`\
  \ 导出文件系统\n编辑 `/exports` 文件以添加要向客户端共享的文件系统，格式如下：\n`mountpoint [host][permissions/options]`\n\
  \n其中：\n* `mountpoint` 是要导出的文件系统。\n* `host` 是可选的，你想授予访问权限的客户端。\n* `permissions` 是可选的，可以是\
  \ `ro` 只读、`rw` 读写、`sync` 在命令完成前写入。\n\n示例：\n`/software/c1 192.168.10.12(rw,sync)`\n\
  \n导出文件系统\n```bash\n# exportfs -a\n```\n\n查看已导出的文件系统\n```bash\n# showmount -e\n```\n\
  \n配置防火墙允许客户端访问 NFS 服务器\n```bash\nfirewall-cmd --permanent --zone public --add-service\
  \ mountd\nfirewall-cmd --permanent --zone public --add-service rpc-bind\nfirewall-cmd\
  \ --permanent --zone public --add-service nfs\n```\n\n第 21 章 移动卷组\n\n如果出现需要将整个卷组从一个系统移动到另一个系统的情况。可能是由于当前系统的某些硬件问题，或者为了将旧存储迁移到新硬件，可以使用以下步骤。在这个示例中，有两个系统：一个是当前\
  \ `VG` 所在的旧系统，另一个是你想要移动到的新系统。\n\n\n\n\n```\nrm -r abc\n```\n\n当你想查看超过一个屏幕长度的文件时，可以使用\
  \ `more` 工具。`More` 用于一次一屏地翻页查看文本。\n\n#### 语法\n```bash\nmore filename\n```\n\n####\
  \ 示例\n```bash\nmore /etc/hosts\n```\n\n### less\n`Less` 是一个与 `more` 类似的程序，但它允许在文件中向后移动，也可以向前移动。\n\
  \n#### 语法\n```bash\nless filename\n```\n\n#### 示例\n```bash\nless /etc/hosts\n```\n\
  \n### mv\n`mv` 命令用于将文件从一个位置移动到另一个位置。`mv` 命令也可以用于重命名文件。\n\n#### 移动文件的命令\n#### 语法\n\
  ```bash\nmv filename destination_directory\n```\n\n#### 示例\n```bash\nmv a.txt /tmp/.\n\
  ```\n它将 `a.txt` 文件从当前目录移动到 `/tmp` 目录。\n\n#### 重命名\n#### 语法\n```bash\nmv filename\
  \ newfilename\n```\n\n#### 示例\n```bash\nmv a.txt b.txt\n```\n\n### grep\n从一个或多个文件中搜索字符串。显示包含该字符串的每一行。\n\
  \n#### 语法\n```bash\ngrep string file\n```\n\n#### 示例\n```bash\ngrep '127.0.0.1'\
  \ /etc/hosts\n```\n\n### head\n将文件的前 10 行打印到标准输出。你也可以指定显示多少行。\n\n#### 语法\n```bash\n\
  head option file\n```\n\n#### 示例\n```bash\nhead -20 /tmp/abc.txt\n```\n该命令将显示 `abc.txt`\
  \ 文件的前 20 行。\n\n### tail\n如果不带任何参数使用，将文件的最后 10 行打印到标准输出；否则，你可以指定显示的行数。\n\n#### 语法\n\
  ```bash\ntail option file\n```\n\n#### 示例\n```bash\ntail -20 /var/log/logfile\n\
  ```\n它将显示最后 20 行。\n\n使用 `tail` 持续监控动态文件\n```bash\ntail -f /var/log/logfile\n```\n\
  它将显示不断增长的文件末尾。按 `Ctrl +c` 中断。\n\n### diff\n比较两个文件。\n\n#### 语法\n```bash\ndiff First_file\
  \ Second_file\n```\n\n#### 示例\n```bash\ndiff abc.txt bbc.txt\n```\n\n### file\n\
  确定文件类型\n\n#### 语法\n```bash\nfile file_name\n```\n\n#### 示例\n```bash\nfile bbc.txt\n\
  ```\n\n### echo\n将参数写入标准输出\n\n#### 语法\n```bash\necho text\n```\n\n#### 示例\n```bash\n\
  echo hello\n```\n\n### date\n打印或更改系统日期和时间。\n\n#### 语法\n```bash\ndate\n```\n\n####\
  \ 示例\n检查日期\n```bash\ndate\n```\n设置日期和时间\n```bash\ndate -s \"24 feb 2017 19:00\"\n\
  ```\n\n第 24 章。\n\n# 管道与重定向\n\n在上一章中，我们学习了 Linux 命令，在本章中，我们将看到如何结合使用 Linux 命令和文件，将简单的命令转换为更复杂的命令。这涉及到数据从一个命令到另一个命令，或从命令到文件，以及从文件到命令的移动。\n\
  \n这种从命令到另一个命令或从文件到命令或从命令到文件的数据传输被称为流（stream）。流有三种类型：\n\n* 标准输入 (`stdin`)\n* 标准输出\
  \ (`stdout`)\n* 标准错误 (`stderr`)\n\n通常情况下，当用户在 PC 上工作时，标准输入从用户的键盘流到标准输出（即显示器），用户在那里获取输出。如果操作过程中出现错误，用户将在终端上看到标准错误。然而，我们可以通过角括号和管道来改变这种行为。有时我们通过它们对应的数字来引用这些流。\n\
  \n| 流 | 编号 | 符号 | 追加 |\n| :--- | :--- | :--- | :--- |\n| Stdin | 0 | < | << |\n\
  | stdout | 1 | > | >> |\n| stderr | 2 | 2> | 2>> |\n\n### 重定向\n当你想要更改数据的正常流向时，我们使用重定向。你可以将命令的输出发送到文件或设备。你也可以从文件或设备获取输入并交给命令。\n\
  \n#### 将输出发送到文件 (`>`)\n通常，我们在屏幕上获取输出，但如果我们希望将其保存到文件中，则使用大于运算符 (`>`) 将标准输出发送到文件。请注意，此命令将覆盖现有输出文件的内容。\n\
  \n#### 语法\n```bash\nCommand > filename\n```\n\n#### 示例\n```bash\nls > abc.txt\n\
  ```\n\n#### 从文件发送输入 (`<`)\n如果我们使用小于运算符 (`<`)，那么我们就可以从文件中读取数据并通过其 `STDIN` 流将其输入程序。\n\
  \n#### 语法\n```bash\nCommand < filename\n```\n\n#### 示例\n```bash\nwc -l < abc.txt\n\
  ```\n\n#### 将标准错误发送到文件\n如果我们在大于运算符在使用 `2` (`2>`)，我们就可以将 `STDERR` 流发送到文件。\n\n####\
  \ 语法\n```bash\nCommand or script 2> filename\n```\n\n#### 示例\n```bash\nmyscript\
  \ 2>abc.log\n```\n\n#### 追加\n我们已经看到，使用单括号命令会覆盖文件的原有内容。要追加内容，我们可以使用双括号 (`>>`) 或 (`2>>`)。\n\
  \n将标准输出追加到现有文件，如果文件不存在则创建一个新文件\n#### 语法\n```bash\nCommand >> filename\n```\n\n####\
  \ 示例\n```bash\n# la -la >> abc.txt\n```\n\n将 stderr 流追加到文件\n#### 语法\n```bash\nCommand\
  \ 2>> filename\n```\n\n#### 示例\n```bash\n# myscript.sh 2>> abc.txt\n```\n\n有时，你可能想将标准输出和标准错误都重定向到同一个文件中。这通常用于自动化过程，以便你稍后检查输出和可能任何错误。使用\
  \ `&>` 或 `&>>` 将标准输出和标准错误都重定向到同一个地方。另一种方法是使用流的数字 `2>&1`。\n\n#### 语法\n```bash\nCommand\
  \ >outputfile 2>&1\n```\n\n#### 示例\n```bash\nls b* >abc.log 2>&1\n```\n\n#### 管道\
  \ (`|`)\n为了将数据从一个程序发送到另一个程序，我们使用管道 (`|`)。\n\n#### 语法\n```bash\nCommand1 | Command2\n\
  ```\n\n#### 示例\n```bash\nls | head -10\n```\n该命令仅显示 10 行。这是管道的一个简单示例。\n```bash\n\
  sort abc.txt | uniq\n```\n\n第 25 章。\n\n# 进程与线程\n每一个进程都是执行中的程序。在 Linux 中，进程是分配处理器时间的最小单位。为了实现并行性，将进程分为多个线程。进程具有以下属性：\n\
  \n* 进程根据上下文切换运行。\n* 每个进程提供所需的资源。\n* 进程包含多个线程。\n* 进程在前台或后台运行。\n\n#### 前台\n是你直接运行并等待其完成的任何命令或任务。\n\
  \n#### 后台进程\n后台进程是在后台运行的进程。与前台进程不同，shell 不需要等待后台进程结束就可以运行。后台进程的数量取决于可用内存。\n\n| 命令\
  \ | 说明 |\n| :--- | :--- |\n| bg | 将任务移至后台 |\n| fg | 将任务移回前台 |\n| jobs | 显示任务 |\n\
  | kill | 停止进程 |\n| ps | 显示进程信息 |\n\n如果命令以 `&` 结尾，shell 将后台执行该命令且不会等待。\n#### 示例\n\
  ```bash\ngcaltool &\n```\n\n将命令移回前台\n```bash\nfg\n```\nctrl + c\n\n检查运行的任务\n```bash\n\
  jobs\n```\n\n列出当前运行的进程\n```bash\nps -ef\n```\n或\n```bash\nps aux\n```\n\n强制杀死进程\n\
  首先通过 `ps -ef` 检查进程 ID，然后\n```bash\nsudo kill -9 <process –id>\n```\n\n使用 ps 命令监控进程\n\
  `ps` 命令显示进程的 CPU 和内存利用百分比，当你的机器性能不佳时非常有用。`ps` 命令可以告诉你哪个进程正在占用资源。\n\n### 进程调度\n调度器是内核的一部分，负责选择下一个运行的进程。其目的是根据优先级运行进程。为了设置运行进程的优先级，使用了\
  \ `nice` 和 `renice` 命令，它们决定了给进程分配更长或更少的 CPU 时间。\n\n`nice` 设置新进程的优先级或 nice 值。\n`renice`\
  \ 调整运行进程的 nice 值。\n\nnice 值 -20 为优先级最高，19 为最低。默认优先级为 0。\n\n#### 示例\n```bash\n$ sudo\
  \ nice -n 19 cp -r /as /map\n```\n\n显示运行进程的优先级\n```bash\nps -al\n```\n或\n```bash\n\
  top\n```\n\n更改优先级\n```bash\n$ sudo renice -n 10 <pid>\n```\n注意：你需要 root / 超用户权限才能更改更高的优先级。\n\
  \n\n\n\n任务自动化在计算机领域非常重要。假设你必须在晚上 11:00 系统无人使用时进行每日备份。那么你就必须在深夜起来进行备份。然而，你可以对备份进行调度，这样计算机就会在晚上\
  \ 11:00 自动运行备份脚本。第二天早晨，你可以验证备份情况。RHEL 提供了许多工具来实现任务自动化。这些工具可以用于自动化系统管理员定期执行或指定时间执行的任务。以下是主要的工具：\n\
  \n* `cron` \n* `at`\n* `batch`\n\n## cron\n\n`cron` 是一个守护进程，可以根据时间、日期、星期调度周期性任务的执行。\n\
  \n### 配置文件\n`/etc/crontab`\n\n### 命令描述\n* `crontab –l` 列出 crontab 条目\n* `crontab\
  \ –e` 编辑 crontab\n* `crontab –r` 删除 crontab\n\n### \n`minutes hours Day_of_month\
  \ Month Day_of_week Command`\n\n### 参数说明\n* 分钟 (0 到 59)\n* 小时 (0 到 23)\n* 日期 (1\
  \ 到 31)\n* 月份 (1 到 12)\n* 星期 (0 到 6) (0=星期日)\n\n### 调度周期性任务\n1. 通过命令 `crontab -e`\
  \ 编辑 crontab\n2. 在文件末尾添加条目，按 `i` 键（注意此文件将在 `vi` 编辑器中打开，因此你可以使用所有 `vi` 命令）\n假设你想每天晚上\
  \ 23:30 运行备份脚本：\n```\n30 23 * * * /myscripts/backup.sh\n```\n3. 按 `ESCAPE` 键，然后输入\
  \ `: write x` 并按 `ENTER` 键保存条目。\n\n## at and batch\n\n`crontab` 用于周期性任务，但对于指定时间执行的单次任务，可以使用\
  \ `at` 和 `batch` 命令。\n\n运行 `at` 命令必须安装了 `rpm` 且 `atd` 服务必须正在运行。当你输入带有时间的 `at` 命令时，系统会向你显示\
  \ `at` 提示符。在 `at` 提示符下，你可以输入想要调度的命令。输入所有命令后，按 `CTRL + d` 键退出 `at` 提示符。\n\n### 检查安装\n\
  ```\n# rpm -q at\n```\n### 安装 at 包\n```bash\n# yum install at\n```\n### 启动服务\n```bash\n\
  # service start atd\n```\n\n### 启动命令\n```bash\n# at 4:00\nat > ls\nctrl + d\n```\n\
  \nBatch 命令在系统平均负载低于 0.8 小时执行单次任务\n```\n~]# batch\nat> ls -la\nat> ctrl + d\n```\n\
  \n### 显示待处理作业列表\n```bash\n# atq\n```\n\n## 第 27 章 启动过程\n\n按下电源键进入 RHEL 登录提示界面后，系统会进行大量处理以带你进入登录界面。这个过程被称为启动过程。理解\
  \ Linux 的启动过程对于排排除启动问题以及正确配置 Linux 至关重要。\n\n以下步骤总结了 RHEL 中启动过程是如何：\n1. 计算机使用 `BIOS`\
  \ 执行 `POST`（上电自检）。\n2. `BIOS` 读取主引导记录（Master Boot Record）获取引导程序。\n3. 控制权交交给 `GRUB2`。它使用\
  \ `/boot/grub/grub.cfg` 选择内核镜像。\n4. 内核\n    1. 根据 `grub.conf` 中指定的 `root=` 挂载根分区。\n\
  \    2. 内核启动进程 ID 为 1 (`PID 1`) 的 `systemd` 进程。\n    3. `initrd`（初始内存磁盘）被内核作为临时根文件系统，直到内核启动完成并挂载真实的根文件系统。它还包含了访问硬盘和其他必要的硬件所需的驱动程序。\n\
  5. `systemd`\n\n`systemd` 是 Linux 操作系统的系统和服务服务管理器。它提供了许多功能，例如在启动时并行启动系统服务。`systemd`\
  \ 是系统中所有进程的父进程。`systemd` 确定默认系统目标，在旧版本中被称为运行级别（run level）。确定目标后，它执行系统初始化，包括：\n1.\
  \ 设置主机名\n2. 初始化网络\n3. 初始化系统硬件\n4. 挂载文件系统\n5. 启动交换分区\n\n## 第 28 章 日志管理\n\n日志文件在系统故障排除中非常有用。日志文件对于审计系统是否存在未经授权的访问也很有用。日志文件让你了解系统在特定时间点正在做什么。假设作为\
  \ Linux 管理员，你的机器运行缓慢或工作不正常，首先要查找的就是日志。日志提供了问题何时以及如何开始的线索，以及操作系统的哪个部分出了问题。\n\nLinux\
  \ 环境下生成的日志文件通常可以分为四类：\n* 应用日志\n* 事件日志\n* 服务日志\n* 系统日志\n\nRHEL 提供了保存日志信息的服务。RHEL\
  \ 中的某些应用程序使用自己的机制直接将日志记录到其日志文件中，例如 `apache`。某些服务通过 `systemctl` 维护其日志。`systemctl`\
  \ 进一步与 `Journald` 通信，由 `Journald` 跟踪日志信息。\n\n`rsyslog` 是另一种日志记录方法。`rsyslog` 和 `Journal`\
  \ 具有若干不同的特征，使得它们适用于特定的场景。在许多情况下，结合使用非常有效。\n\n### journald\n\n`journald` 守护进程是 systemd\
  \ 的组件，用于日志管理。它收集了系统的所有消息。\n\n#### 使用 journalctl 查看日志\n\n查看日志：\n```\njournalctl\n\
  ```\n查看所有条目的元数据：\n```\njournalctl -o verbose\n```\n实时查看日志：\n```bash\njournalctl\
  \ -f\n```\n\n#### 按优先级过滤\n\n你可以根据优先级过滤日志。\n语法：\n```\njournalctl -p priority\n```\n\
  示例：在此示例中，我们只想查看日志中错误级别的行：\n```\njournalctl -p err\n```\n查看本次启动的日志条目：\n```\njournalctl\
  \ -b\n```\n让日志持久化：\n```bash\n$ sudo mkdir -p /var/log/journal\n```\n然后重启 journald\
  \ 以应用更改：\n```bash\nsystemctl restart systemd-journal\n```\n\n### syslogd\n\n某些日志由\
  \ `rsyslogd` 守护进程控制。它是 `sysklog` 的增强版。它提供了高性能、出色的安全性、模块化设计以及通过 TCP 或 UDP 协议传输的支持。每条日志消息至少包含时间和程序名称字段。\n\
  \n`/etc/rsyslog.conf` 文件是 `rsyslogd` 的主配置文件，用于记录系统上的日志消息。该文件指定了 `rsyslogd` 的记录规则。由\
  \ `rsyslogd` 维护的日志文件列表可以在 `rsyslog.conf` 配置文件找到。日志文件通常位于 `/var/log/` 目录。\n\n####样例\
  \ rsyslog.conf\n```bash\netc]$ cat rsyslog.conf\n\n# rsyslog v5 配置文件\n# 更多信息请参 /usr/share/doc/rsyslog-*/rsyslog_conf.html\n\
  # 如果遇到问题，请访问 http://www.rsyslog.com/doc/troubleshoot.html\n\n*.info;mail.none;cron.none\
  \  /var/log/messages # authpriv 文件具有限制访问。\nauthpriv.*                          \
  \    /var/log/secure # 将所有邮件记录在一个处。\nmail.*                                -var/log/maillog\
  \ # 记录 cron 信息\ncron.*                               /var/log/cron # 所有人都能接收紧急消息\n\
  *.emerg                                * # 将 crit 及以上的新闻错误保存到特殊文件中。\nuucp,news.crit\
  \                         /var/log/spooler # 将启动消息也保存到 boot.log\nlocal7.*      \
  \                        /var/log/boot.log\n```\n\n使用 rsyslog.conf 进行日志过滤\n\n\n\n\
  系统产生了大量的日志，如果不进行过滤，几乎无法使用这些日志。为了过滤日志，我们使用 `/etc/rsyslog.conf` 文件。它包含两个参数 `facility`（设施）和\
  \ `priority`（优先级），用点（`.`）隔开。`Facility` 是你想要记录的进程名称，`priority` 指定日志级别，如 `debug`、`info`、`notice`、`warning`、`err`、`crit`、`alert`、`emerg`\
  \ 或代表所有类型消息的 `*`。\n\n### Example\n\n#### authpriv 文件具有限制访问权限。\n\n```\nauthpriv.*\
  \ /var/log/secure\n```\n\n#### 在一处记录所有邮件消息。\n\n```\nmail.* -/var/log/maillog\n```\n\
  \n在示例中，`authpriv` 和 `mail` 是设施，优先级为 `*`，意味着所有日志。\n\n### 使用 logrotate 轮转日志\n\n日志需要轮转以避免填充文件系统，并使日志更易管理。一旦日志文件被轮转，它将被重命名为新文件名。经过一定的轮转时间后，旧的日志文件将被删除以节省空间。\n\
  \n`logrotate` 包根据 `/etc/logrotate.conf` 中的配置或命令行选项指定，管理日志文件的自动轮转。\n\n#### Install\n\
  \n```bash\nsudo apt install logrotate\n```\n\n#### 验证 logrotate 是否安装成功\n\n```bash\n\
  logrotate\n```\n\n`/etc/logrotate.conf` 文件中一些重要的配置设置有 `rotation-interval`、`log-file-size`、文件的\
  \ `permssions`、`missingok`、`rotation-count` 和 `compression`。对于每个日志，建议你在 `/etc/logrotate.d`\
  \ 目录下创建文件。\n\n### Example\n\n```\n[root@redhat1 logrotate.d]# cat bootlog\n\n/var/log/boot.log\n\
  \n{\n    missingok\n    daily\n    copytruncate\n    rotate 7\n    notifempty\n\
  }\n```\n\n在这个示例中，日志轮转工具 `rotate` 对 `boot` 进行了轮转，详情如下： \n- `missingok`: 如果日志缺失则忽略\n\
  - `daily`: 日志每天进行一次轮转\n- `copytruncate`: 在创建副本后在原地截断原始日志文件\n- `rotate 7`: 保留 7 天的日志\n\
  - `notifempty`: 如果日志为空则不进行轮转\n\n### 重要日志\n\n日志的主目录是 `/var/log`。该目录下一些值得关注的日志文件：\n\
  * `wtmp`\n* `utmp`\n* `dmesg`\n* `messages`\n* `maillog`\n* `spooler`\n* `auth.log`\
  \ 或 `secure`\n* `yum.log`\n* `boot.log`\n\n#### `/var/log/wtmp` 和 `/var/run/utmp`\n\
  \n`wtmp` 和 `utmp` 文件跟踪用户登录和退出系统的情况。这两个文件都是二进制文件。你不能直接使用文本编辑器、`cat` 或 `more` 命令读取这些文件的内容。你必须使用特定的命令。\n\
  \n`who` 命令使用 `/var/run/utmp` 文件提供当前登录系统的用户信息。\n\n```bash\n[root@RHEL2 log]# who\n\
  (unknown) :0      2018-10-02 05:34 (:0)\nroot     pts/0      2018-10-02 05:38 (192.168.131.1)\n\
  ```\n\n#### `/var/log/wtmp` 文件\n\n该文件维护所有登录和退出用户的历史记录。最后一个命令使用此文件显示最后登录用户的列表。\n\n\
  ```bash\n[root@RHEL2 log] # last\nroot     pts/0      192.168.131.1    Tue Oct \
  \ 2 05:38  still logged in\n(unknown :0             :0               Tue Oct  2\
  \ 05:34  still logged in\nreboot    system boot  3.10.0-514.el7.x Tue Oct  2 05:33\
  \ - 05:47  (00:13)\nroot     pts/1      192.168.131.1    Mon Oct  1 13:23  crash\n\
  ```\n\n#### `dmesg`\n\n`dmesg` 通过读取内核缓冲区获取数据。缓冲区是计算机内存的一部分，被留作临时从外部设备发送或接收数据的存放地。这些消息对于诊断设备故障非常重要。每当发生硬件变化时，大多数消息都会记录在这里。如果你遇到任何问题，请使用\
  \ `dmesg` 进行系统诊断。`dmesg` 工具存在于 `/var/log/`。\n\n```bash\n[root@RHEL2 log]# dmesg\
  \ |more\n```\n\n#### `Messages`\n\n通用日志在此文件中。要查看此文件，可以使用文本编辑器或任何常用的文本查看工具如 `cat`、`less`\
  \ 或 `more`。\n\n```bash\n[root@RHEL2 log] # cat messages\nOct  2 06:07:02 localhost\
  \ rsyslogd: [origin=\"rsyslog\"] swVersion=\"7.4.7\" x-pid=\"1056\" x-info=\"http://www.rsyslog.com\"\
  ] rsyslogd was HUPed\n```\n\n#### `Maillog`\n\n该文件记录运行服务器上的邮件服务器的消息。\n\n```bash\n\
  [root@RHEL2 log]# cat maillog\n```\n\n#### `Spooler`\n\n记录打印程序消息。Spooler 被打印队列用于打印。\n\
  \n#### `secure`\n\n此文件捕获身份验证日志。要检查此文件，可以使用 `more` 或 `less` 命令。\n\n#### `dnf.log`\n\
  \n在 RHEL 8 中，`yum` 是 `dnf` 命令的前端。`yum` 命令将消息记录在 `dnf.log` 文件。还有其他 dnf 日志文件如 `dnf.librepo.log`\
  \ 和 `dnf.rpm.log`。\n\n\n\n\nSelinux 实现了 MAC，即强制访问控制（Mandatory Access Control）。Selinux\
  \ 是一组安全规则，决定哪些进程可以访问哪些文件、目录或端口等。访问进程、目录和文件的 SELinux 策略被称为上下文（context）。Selinux 的目标之一是保护数据和系统。Selinux\
  \ 有三种访问控制形式：\n\n1. `Enforcing`（强制模式）\n2. `Permissive`（许可模式）\n3. `Disabled`（禁用）\n\
  \n### Enforcing\nSelinux 根据 SELinux 策略规则拒绝访问。\n\n### Permissive\nSelinux 不拒绝访问，但对于在\
  \ `enforcing` 模式会被拒绝的操作会记录日志。\n\n### Disabled\nSelinux 已完全禁用。\n\n### 检查安装\n```bash\n\
  rpm -qa | grep selinux\n```\n\n### 安装 selinux\n```bash\nyum install policycoreutils-python\n\
  ```\n\n### 检查当前模式\n```bash\ngetenforce\n```\n\n### 检查状态\n```bash\nsestatus\n```\n\
  \n### 主配置文件\n`/selinux/config`\n\n### 更改模式\n编辑 `/etc/selinux/config` 文件并将 `selinux=enforcing`\
  \ 改为所需的模式如 `selinux = permissive`。保存文件并重启服务器。如果你将模式设置为 permissive，可以检查日志查看 SELinux\
  \ 正在做什么。\n```bash\ncat /var/log/messages | grep -i selinux\n```\n或者\n```bash\ntail\
  \ -f /var/log/audit.log\n```\n\n### 显示上下文的命令\n\n| 描述 | 命令 |\n| :--- | :--- |\n|\
  \ 列出进程 | `ps aux` |\n| 显示用户上下文 | `id` |\n| 显示文件上下文 | `ls -l` |\n| 复制上下文 | `cp` |\n\
  | 创建上下文 | `mkdir` |\n\n### 修改上下文的工具\n```bash\nsemanage\n```\n\n### 显示上下文\n```bash\n\
  semanage fcontext -1\n```\n\n### 类型\n使用 targeted 策略的主要权限控制方法提供了高级的进程隔离。所有文件和进程都被标记为类型。SEelinux\
  \ 域（domain）定义：\n* `httpd_sys_content_t`\n* `tmp_t`\n\n### 添加上下文\n```bash\nsemanage\
  \ fcontext -a -t httpd_sys_content_t /abc/zzz.txt\nls -Z\n```\n输出：`-rw-r-- root\
  \ unconfined_u:object_r:samba_share_t:s0 zzz.txt`\n\n### 设置默认上下文\n```bash\nrestorecon\
  \ -v /abc/zzz.txt\n```\n\n### 布值\nSELinux 策略允许在运行时更改布值。\n\n```bash\nsemanage boolean\
  \ -l\n```\n\n### 配置布值\n在此示例中，我们将允许读写用户目录：\n\n1. 列出所有：\n```bash\nsemanage -l\n```\n\
  2. 列出布值是否开启/关闭：\n```bash\ngetsebool -a\n```\n3. 允许读写用户目录：\n```bash\nsetsebool -P\
  \ ftp_home_dir on\n```\n4. 检查：\n```bash\ngetsebool ftp_home_dir\n```\n输出：`ftp_home_dir\
  \ --> on`\n\n# 第 30 章 系统监控工具\n\n持续监控是系统管理的重要部分。系统监控有助于为项目合理配置资源。它还有助于调整服务器。适当监控可以避免资源瓶颈导致的不必要停机，可以使用工具预测硬件故障。\n\
  \n### 查看系统进程\n`ps` 显示运行进程报告。它是当前进程的快照。查看系统上的所有进程及其所有：\n```bash\nps aux\n```\n列出所有相关线程：\n\
  ```bash\nps ax\n```\n\n### Top\n`top` 命令显示 Linux 机器处理器活动。`top` 命令显示系统运行进程列表，还显示关于\
  \ CPU、内存和交换区的当前使用附加信息。\n```\ntop -21:59:05 up 5:58, 3 users, load average: 0.16,\
  \ 0.03, 0.01\nTasks : 188 total, 187 sleeping, 0 stopped, 0 zombie\n%Cpu(s) : 0.0\
  \ us, 0.7 sy, 0.0 ni, 97.7 id, 1.0 wa, 0.3 hi, 0.3 si\nKiB Mem : 2045748 total,\
  \ 168512 free, 1038120 used, 839116 buff/cache\nKiB Swap : 2097148 total, 1906704\
  \ free, 190444 used, 89136 avail\nPID USER PR NI VIRT RES SHR S %CPU %MEM TIME\n\
  1771 root 20 0 406112 10888 7084 S 0.3 0.5 0:30.40 vmtoolsd\n5854 root 20 0 156652\
  \ 3960 3456 R 0.3 0.2 0:00.03 top\n1 root 20 0 215220 8316 5820 S 0.0 0.4 0:09.58\
  \ systemd\n2 root 20 0 0 0 0 S 0.0 0.0 0:00.03 kthreadd\n3 root 20 0 0 0 0 S 0.0\
  \ 0.0:0:02.07\n```\n\n### 系统监控工具\n持续监控是系统管理的重要部分。系统监控有助于为项目合理配置资源。它还有助于调整服务器。适当监控可以避免资源瓶颈导致的不必要停机，可以使用工具预测硬件故障。\n\
  \n\n\n\n# 管理概述\n\n* 管理用户账户\n* 管理服务\n* 配置网络接口和防火墙\n* 创建诊断报告\n* Kdump 配置\n* SELinux\n\
  * 软件更新\n* 订阅\n* 终端\n* 管理虚拟机\n\n## 安装 Cockpit\n\n如果默认没有安装 Cockpit，你可以按照以下步骤进行安装。\n\
  \n### 安装\n```bash\nyum install cockpit\n```\n\n### 启动服务\n```bash\nsystemctl start\
  \ cockpit\n```\n\n### 设置服务开机自启\n```bash\nsystemctl enable cockpit\n```\n\n### 检查服务是否正在运行\n\
  ```bash\nsystemctl status cockpit.socket\n```\n\n在 RHEL 8 中，防火墙默认已为 cockpit 开启；如果未开启，可以使用以下命令进行：\n\
  ```bash\nfirewall-cmd --add-service=cockpit --permanent\nfirewall-cmd --reload\n\
  ```\n\n## 启动 Web 控制台 (cockpit)\n\n如果安装了 GUI，你可以在同一台服务器的 Firefox 浏览器中启动 cockpit。在\
  \ Windows 客户端上，你可以使用任何喜欢的 Web 浏览器。\n\nCockpit 默认的 https 端口为 `9090`，用户名和密码与系统凭据相同。\n\
  \n在此示例中，我从 Windows 10 工作站运行 cockpit，服务器 IP 地址为 `192.168.190.128`。因此，在 Chrome 或 Microsoft\
  \ Internet Explorer 等浏览器地址栏中输入 `https://192.168.190.190:9090`。如果你在同一台服务器上运行，请在浏览器地址栏输入\
  \ `https://localhost:9090` 并回车。\n\n![](img/Image00070.jpg)\n\n## 安装插件\n\n要为 cockpit\
  \ 添加插件模块：\n\n#### 语法\n```bash\nyum install package\n```\n\n#### 示例\n```bash\nyum\
  \ install cockpit-machines\n```\n\n若想在单一 UI 中管理多台机器，可以安装 dashboard 软件包：\n```bash\n\
  yum install cockpit-dashboard\n```\n\n## 探索 Cockpit\n\n在本节中，我将完成一些任务作为演示，遍历整个 UI\
  \ 超出了本书的涵盖范围。\n\n### 关机 / 重启服务器\n\n使用 cockpit 关机或重启机器：\n\n1. 从左侧面板选择 `System`（系统）\
  \ > `Power options`（电源选项）。\n2. 在 Power options 下拉菜单中选择你想要 `Restart`（重启）还是 `Shutdown`（关机）服务器。\n\
  \n![](img/Image00071.jpg)\n\n3. 在下一个页面指定你想要关机/重启机器的时间，以及你想发送给已登录用户的消息。\n\n![](img/Image00072.jpg)\n\
  \n### 设置主机名\n\n1. 在系统界面点击 `host name`（主机名）。\n2. 在 ![](img/Image00073.jpg) 的下一个页面更改真实主机名并点击\
  \ `change`（更改）。\n\n![](img/Image00074.jpg)\n\n这些都是可以使用 cockpit 执行的任务示例。由于它是 GUI，你可以探索并学习更多内容。\n\
