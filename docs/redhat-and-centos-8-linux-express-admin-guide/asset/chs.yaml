  \ C:  c6  DRDOS/sec (FAT-\n4  FAT16 <32M      40  Venix 8026      85  Linux    \
  \  c7  Syrinx\n5  Extended        41  PPCRe Boot      86  NTFS set da  Non-FS data\n\
  6  FAT16           42  SFS             87  NTFS set db  CP/M /CTOS /\n7  HPFS/NTFS/exFAT\
