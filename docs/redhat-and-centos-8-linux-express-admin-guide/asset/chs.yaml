  ## 仓库 (Repository)\n\n如前所述，仓库是带有元数据的 RPM 软件包集合，这些元数据被 `Yum` 命令使用。这是分发 Linux 发行版内容的更好方式。仓库确保你获得的是安全且真实的内容。由于我们大多数时候都在使用互联网上的仓库，因此下载的仓库内容的真实性是一项首要要求。此外，下载也应该以安全的方式进行。Red\
  \ Hat 确保使用 RPM 包的端到端安全性。首先是使用 `https` 站点而不是 `http` 站点，这确保了内容通过安全通道分发。Red Hat 使用了独立的公钥基础设施（PKI）。对于\
  \ RPM 包的安全，可以使用 RPM 包签名对 RPM 包实现加密完整性检查。在安装 RPM 包时，这些签名可以被验证，因为它们是 RPM 包的一部分。要启用\
  \ RPM 签名检查，`yum` 仓库文件必须包含 `gpgcheck=1` 行，如下例所示：\n\n```ini\n[myrepo]\nname=My Repository\n\
  baseurl=https:///download.myrepoex.com/version8/\nenabled=1\ngpgcheck=1\n```\n\n\
  ## 仓库操作\n\n### 显示所有启用的仓库\n\n![](img/Image00049.jpg) # `yum repolist`\n\n### 显示所有已启用和禁用的仓库\n\
  ```bash\n#### yum repolist all\n```\n\n### 显示特定仓库的包\n```bash\n#### yum list |grep\
  \ baseos\n```\n\n### 添加 / 启用 / 禁用仓库\n\n使用 `yum-config-manager` 命令启用/添加/禁用仓库。你需要安装\
  \ `yum-utils` 来使用 `yum-config-manager`。\n\n```bash\n#### yum install yum-utils\n\
  ```\n\n### 禁用已启用的仓库\n\n首先列出所有仓库\n```bash\n#### yum repolist all\n```\n\n### 禁用仓库\n\
  \n要启用和禁用仓库，请使用通过列表命令获取的仓库 ID（id）。\n\n#### 语法\n```bash\n#### yum-config-manager --disable\
  \ repository_id\n```\n\n#### 示例\n![](img/Image00050.jpg) # `yum-config-manager --disable\
  \ InstallMedia-AppStream`\n\n## 启用仓库\n```bash\n# yum-config-manager --enable InstallMedia-AppStream\n\
  ```\n![](img/Image00051.jpg)\n\n### 添加仓库\n\n仓库通常提供其自己的 `.repo` 文件用于仓库配置。要添加提供 `.repo`\
  \ 文件的仓库，可以使用此命令。\n\n#### 语法\n```bash\n# yum-config-manager --add-repo repository_url\n\
  ```\n\n#### 示例\n```bash\n#### yum-config-manager --add-repo https://www.example.com/abc.repo\n\
  ```\n\n# CodeReady Linux Builder 仓库\n\nRed Hat 在所有类型的订阅中默认都提供 `BaseOS` 和 `Appstream`\
  \ 仓库，这两个仓库默认都是启用的。除了 `BaseOS` 和 `Appstream` 仓库外，还为开发者添加了一个名为 `CodeReady` 的新仓库。所有订阅都包含对新的\
  \ `CodeReady Linux Builder` 仓库的访问。正如名称所示，`CodeReady Linux Builder` 适用于使用 Red Hat\
  \ Enterprise Linux 基础设施开发 Linux 程序的开发者。它包含了开发者在构建应用程序时专门使用的包。`CodeReady Linux Builder`\
  \ 是一个类似于旧版本 Red Hat Enterprise Linux 中找到的可选仓库的仓库。`CodeReady Linux Builder` 包含了构建工具和\
  \ `-devel` 包。尽管 `CodeReady Linux Builder` 包含了构建工具和 `-devel` 包。\n\n## 启用仓库\n\n要启用和禁用仓库，请使用通过列表命令获取的仓库\
  \ ID（id）。\n\n## 手动添加仓库\n\n如前所述，你也可以通过手动创建 仓库文件来添加仓库。仓库配置文件位于 `/etc/yum.repos.d/`，扩展名为\
  \ `.repo`。\n\n\n\n\n\n## 5. 使用以下内容创建 `.rep` 仓库配置文件。如果你是从旧版本的 RedHat 迁移过来的，在 RedHat\
  \ 8 版本中发生了变化，现在你必须定义两个仓库而不是一个，即 `BaseOS` 和 `Appstream`。\n\n```bash\nvi /etc/yum.repos.d/rhiso.repo\n\
  ```\n\n```ini\n[InstallMedia-BaseOS]\nname=Red Hat Enterprise Linux 8 - BaseOS\n\
  metadata_expire=-1\ngpgcheck=1\nenabled=1\nbaseurl=file:///rhcd/BaseOS/\ngpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release\n\
  \n[InstallMedia-AppStream]\nname=Red Hat Enterprise Linux 8 - AppStream\nmetadata_expire=-1\n\
  gpgcheck=1\nenabled=1\nbaseurl=file:///rhcd/AppStream/\ngpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release\n\
  ```\n\n清理 yum 缓存\n\n```bash\nyum clean all\n```\n\n现在列出仓库\n\n```bash\nyum repolist\n\
  ```\n\n## 自定义自定义仓库\n\n在某些情况下，你需要创建自己的仓库。例如，你开发了一个软件并将其转换为 rpm 格式进行分发，或者你下载了一组软件并想通过仓库进行分发。为\
  \ RPM 软件包创建自己的自定义仓库的步骤如下：\n\n1. 为你的自定义仓库创建目录。\n```bash\nmkdir /myrepo\n```\n\n2.\
  \ 将文件传输/下载到此目录\n\n3. 使用 `createrepo` 创建 `repodata`。如果没有 `createrepo` 命令，请先安装 `createrepo`\
  \ 命令。`createrepo` 由 `createrepo_c` 包提供。\n\n```bash\nyum -y install createrepo_c\n\
  createrepo /myrepo\n```\n\n4. 创建配置文件\n\n`/etc/yum.repos.d/mycustom.repo`\n\n以下是自定义仓库文件的示例：\n\
  \n```ini\n[mycustomrepo]\nname=Custom Repository\nbaseurl=file:///myrepo/\nenabled=1\n\
  gpgcheck=0\n```\n\n## 第 9 章. 管理服务\n\n系统启动时，它会启动和停止某些服务以达到系统所需的状态。假设你想以 GUI 模式启动系统，系统必须启动所有与桌面环境相关的服务。同样，如果你将服务器配置为\
  \ Web 服务器，你必须在启动过程中启动 Web 服务。即使是执行其基本任务，它也需要许多运行的服务，如网络、日期和时间等。在旧版本的 Redhat enterprise\
  \ Linux 中，`SysV` 是默认的服务管理器。`SysV` 通常在启动时逐个地启动服务，这意味着下一个服务将在上一个服务启动完成后开始启动。在 RHEL\
  \ 7 版本中，引入了 `Systemd`。\n\n### systemd 简介\n\n`Systemd` 是 RHEL 8 的系统和服务运行管理器。它与 `SysV`\
  \ init 脚本具有有限的向后兼容性。它提供了许多新功能，如：\n\n- 启动时并行启动系统服务\n- 按需激活设备\n- 基于依赖的服务控制逻辑\n- 基于路径的激活：当特定文件或目录的状态发生变化时，按需激活服务\n\
  - 基于设备的激活（如 USB）\n- 较早的 BOOT 日志\n\n在 `systemd` 之前，旧版本的 RHEL 使用位于 `/etc/rc.d/init.d/`\
  \ 目录下的 `SysV` 脚本来控制系统状态。使用 `Systemd` 后这些这些 脚本被服务单元（service units）取代，服务单元位于 `/etc/systemd/system/`\
  \ 目录中。服务单元以 `.service` 文件扩展结尾。`systemctl` 命令用于查看、启动、停止、重启、启用或禁用系统服务。如果你是从 Redhat\
  \ 6 或更早版本过来的，以前有多个命令用于服务管理，例如用于服务状态管理的 `service` 命令和用于服务启动管理的 `chkconfig` 命令。在 `Systemd`\
  \ 中，它被单一命令 `systemctl` 代替。现在 `systemctl` 命令可以同时处理服务管理及其启动时的启动。\n\n### Systemd 单元文件位置\n\
  \n| 详情 | 命令 |\n| :--- | :--- |\n| `/usr/lib/systemd/system/` | Systemd 单元文件最初安装在这里。\
  \ |\n| `/run/systemd/system/` | 在运行时会创建 Systemd 单元文件。此目录的优先级高于已安装的服务单元文件的目录。 |\n\
  | `/etc/systemd/system/` | 当你启用服务时，会在这里创建 Systemd 单元文件，并为扩展服务而添加单元文件。此目录的优先级高于运行时单元文件的目录。\
  \ |\n\n### 服务状态管理\n\n| 详情 | 命令 |\n| :--- | :--- |\n| 启动服务 | `systemctl start name.service`\
  \ (示例 `systemctl start iscsi.service`) |\n| 停止服务 | `systemctl stop name.service`\
  \ (示例 `systemctl stop iscsi.service`) |\n| 重启服务 | `systemctl restart name.service`\
  \ (示例 `systemctl restart iscsi.service`) |\n| 仅在服务运行时重启服务。 | `systemctl try-restart\
  \ name.service` (示例 `systemctl try-restart iscsi.service`) |\n| 重新加载配置 | `systemctl\
  \ reload name.service` (示例 `systemctl reload iscsi.service`) |\n| 检查服务是否正在运行。 |\
