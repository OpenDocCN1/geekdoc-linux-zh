- "# Redhat 和 CentOS 8：Linux 快速管理员指南\n\n\n\n![](img/Image00075.jpg)\n\n\n## 前言\n本书专为系统管理员或\
  \ Linux 爱好者编写。本书的编写方式涵盖了 `RedHat Enterprise Linux` 和 `Centos` 的实际操作方面。如果你计划部署 `Redhat\
  \ Enterprise Linux` 第 8 版本或对其进行维护，那么这本书就是为你准备的。书中编写的所有步骤都直击要点，并配有相应的屏幕截图和输出示例。如果你时间紧迫且讨厌阅读厚重的书籍，那么这本书正适合你。它涵盖了从基础到高级水平的所有文章。\n\
  \n希望你会喜欢这本书。\n\n感谢，\nShiv Kumar Goyal\n\n\n## 第 1 章 介绍\n操作系统是一种用于管理你计算机上硬件资源的软件。操作系统是运行在应用程序和硬件之间的一层。要运行任何应用程序，你都需要机器上安装操作系统。市场上有许多操作系统，如\
  \ `MS windows`、`Apple OS`、`Unix`、`Linux`。就像 `Windows 7`、`MS Windows 10` 和 `Mac OS`\
  \ 一样，`Linux` 也是一种主流的操作系统。与其他操作系统不同，`Linux` 是一个开源操作系统，这意味着源代码是免费获取的。开源的好处是任何人都可以查看源代码并根据自己的需求进行修改。\n\
  \n1991 年，`Linus Torvalds` 启动了 `Linux` 项目。`Linux` 最初是为基于 Intel 的个人电脑开发的，但最终被移植到了其他平台。不仅是在\
  \ PC 上，`Linux` 内核还用于智能手机上的 `Android` 操作系统。由于 `Linux` 是一个开源项目，许多公司和个人使用了这些代码并开始创建自己的\
  \ Linux 发行版。今天，市场上有数千个 Linux 发行版，但某些发行版在 Linux 用户中占据了绝大部分份额。许多 Linux 社区和公司使用这些流行的发行版作为基础，通过修改或添加某些包来创建自己的版本。广义上，我们可以根据来源对\
  \ Linux 发行版分类，例如 `Centos`、`Oracle` 和 `Scientific Linux` 是基于 `Redhat` 的，而基于 `Debian`\
  \ 的发行版有 `Ubuntu`、`Mint`、`tails` 等。\n\n### 免费与付费\nLinux 虽然是一个开源项目，但有两种类型的 Linux 发行版可用：一种是免费的，另一种是付费的。免费的发行版是不需要付费的，而付费的则需要费用。\n\
  \n\n\n\n\n- `RHEL 8` 分为两个主要仓库：`BaseOS` 和 `Application Stream` (`AppStream`)。\n-\
  \ 支持更高的内存，最高支持 `4PB` 物理内存。\n- 默认显示服务器不再是 `Xorg` 而是 `Wayland`。\n- `XFS` 现在支持共享写时复制（copy-on-write）数据范围区功能。\n\
  - `XFS` 文件系统的最大大小为 `1024 TiB`，在早期版本中为 `500 TiB`。\n- `nftables` 代替 `iptables` 默认的网络过滤框架。\n\
  - `Python 3.6` 是默认的 Python 版本。\n- `PHP 7.2`。\n- `RHEL 8` 提供 `Node.js 10`。之前 `Node.js`\
  \ 仅作为软件集合（Software Collection）可用。\n- `Apache HTTP Server 2.4.37` 具有更好的安全性能。\n- `GCC`\
  \ 版本 `8.2`。\n- `LUKS` 版本 2 (`LUKS2`) 格式取代了旧的 `LUKS` (`LUKS1`) 格式用于加密卷。\n- `Nginx\
  \ 1.14` 在核心仓库中可用。\n- `Varnish Cache`。\n\n## 第 3 章 最小系统要求\n\n以下是安装 `RHEL` 的最低要求。然而，为了获得机器的最佳性能，拥有比这些更多的资源是理想的。\n\
  \n- 处理器：`1GHz` 或更快\n- 系统内存 (`RAM`）：`2GB`\n- 硬盘：`20GB`\n\n`RHEL` 的图形化安装至少需要 `800x600`\
  \ 的屏幕分辨率。如果您使用的设备分辨率较低，则应该进行 `VNC` 安装。\n\n## 第 4 章 安装\n\n在本章中，我们将介绍版本 `8` 的 `Redhat\
  \ Enterprise Linux` 的安装。`RHEL` 的安装非常简单且直观。本章的设计使得即使您没有先前的 `Linux` 知识，也可以轻松地安装 `RHEL`，因为整个安装过程都通过截图逐步进行了说明。\n\
  \n安装 `RHEL` 涉及的步骤总结如下：\n\n1. **下载媒体镜像**\n   您可以使用用户名和密码从 Red Hat 客户门户 `https://access.redhat.com/downloads`\
  \ 下载安装镜像。如果您没有用户名和密码，Red Hat 允许您获取评估版本。对于 Centos，请从 centos 网站下载镜像。\n\n2. **验证镜像**\n\
  \   一旦完成安装镜像，验证下载镜像的完整性是一个良好的习惯。\n\n3. **将镜像写入介质**\n   现在将镜像写入所需的介质。由于此镜像无法放入 `DVD`，您需要双层\
  \ `DVD`，或者可以使用 `USB 驱动器`。\n\n4. **选择您想要的安装方式**。有两种常用的安装方式：\n   - **交互式**：交互式方法是普通的安装方法，可以是基于\
  \ `Text` 的或 `GUI`。这种安装方法在安装过程中需要用户交互进行输入。\n   - **使用 Kickstart 自动化**：对于 `Kickstart`\
  \ 安装，我们需要创建一个单文件，包含 `RHEL` 安装在交互式安装期间通常询问的所有问题的答案。一旦开始安装，就不需要用户干预。\n\n5. **验证安装。**\n\
  \n## 交互式安装\n\n在本节中，我们将介绍 `Redhat` 的普通交互式安装，如果您正在安装 `Centos`，步骤是相同的：-。\n\n### 下载媒体镜像\n\
  \n首先，安装我们需要介质。为了准备介质，您必须下载安装 ISO 镜像。在您的 `MS windows` 机器上打开 Internet Explorer。打开\
  \ Redhat 客户门户网站或 `https://access.redhat.com/downloads`。\n\n从列表中选择 `Red Hat Enterprise\
  \ Linux 8` 并提供您的凭据。如果您没有 redhat 账户，可以请求评估副本。成功登录后，您将获得下载列表，选择 `Red Hat Enterprise\
  \ Linux 8.0 Binary DVD` 并点击“立即下载”。\n\n![](img/Image00000.jpg)\n\n文件下载完成后，检查文件的完整性。如果您您在\
  \ `MS Windows 10` 电脑上下载了文件，进入下载文件的文件夹。按住 `shift` 键并点击鼠标左键。\n\n这将打开菜单，点击“在此处打开 PowerShell\
  \ 窗口”。\n\n![](img/Image00001.jpg)\n\n在 shell 提示符上输入命令：\n\n```bash\nGet-FileHash\
  \ -Path .\\rhel-8.0-x86_64-dvd.iso -Algorithm SHA256\n```\n\n![](img/Image00002.jpg)\n\
  \n它将显示哈希值，将此值与下载页面提供的值进行比对。\n\n![](img/Image00003.jpg)\n\n### 将镜像写入介质\n\n验证镜像后，您可以将\
  \ ISO 文件写入 `DVD`。如果计算机中的 `DVD 驱动器`无法工作或不存在，可以将此镜像写入 `USB 闪存盘`。写入 `USB 闪存盘` 的步骤如下所示：\n\
  \n#### 在 Windows 上创建 USB 介质\n\n1. 从 `https://github.com/MartinBriza/MediaWriter/releases`\
  \ 下载 `Fedora media writer`。\n\n![](img/Image00004.jpg)\n2. 双击下载的文件进行安装并遵循“向导”操作。\n\
  3. 安装完成后，从开始菜单运行 `Fedora Media Writer`。\n4. 在主窗口点击 `Custom image` 并选择下载的 `RedHat\
  \ enterprise Linux ISO Image`。\n5. 从下拉菜单选择您想要使用的驱动器。\n6. 点击 `Write to disk`。这将开始创建介质。\n\
  7. 一旦过程完成，卸载 `USB` 设备。\n8. `USB 闪存盘` 已准备就绪。\n\n### 安装步骤\n\n#### 使用介质启动\n\n介质就绪后。将\
  \ `USB` 设置为启动设备。一旦系统启动，将显示安装菜单。安装 `RHEL 8.0`。\n\n![](img/Image0005.jpg)\n\n在语言菜单选择\
  \ `Language` 并继续。\n\n![](img/Image00006.jpg)\n\n这将进入安装摘要。选择 `Date and time` 修改日期和时区。\n\
  \n![](img/Image00007.jpg)\n\n如果您使用 `Network Time`，可以进行配置。将 `Network` 按钮切换为开启状态并点击小齿轮进行网络设置。设置完成后点击\
  \ `Done`。\n\n![](img/Image00008.jpg)\n\n从屏幕上点击 `Software Selection` 并选择 `Base environment`。为了演示，我选择了\
  \ `Server with GUI` 并点击 `Done`。\n\n![](img/Image00009.jpg)\n\n在安装摘要屏幕上，选择 `Installation\
  \ Destination`。\n\n![](img/Image00010.jpg)\n\n![](img/Image00011.jpg)\n\n要么留给 `Automatic\
  \ Configure`，或者选择 `I will configure partitioning` 进行手动分区。在选择 `Manual partitioning`\
  \ 的情况下，虽然 `RedHat` 可以通过 root 和 swap 分区工作，但最好有三个分区。这三个分区分别是 `boot`、`/ (root)` 和 `swap`。`boot`\
  \ 至少应 `1 GB`，`root` 至少 `20GB`，`swap` 分区应等于或大于物理 `RAM`。您可以使用易读格式编写容量，例如 `10G` 代表\
  \ `10GB`，`500M` 代表 `500MB`。\n\n现在点击 `Network and Host Name` 配置网络设置和主机。\n\n![](img/Image00012.jpg)\n\
  \n1. 在 `Host Name` 框中写入主机。\n2. ![](img/Image00013.jpg) 选择网卡\n3. 将 `Connected` 按钮切换到\
  \ `On`。\n4. 点击 `configure` 按钮。\n\n将进入网络配置屏幕。\n\n1. 选择 `IPv4 setting` 标签页。\n2. 如果有静态\
  \ `IP`，则从下拉菜单将 `method` 设置为 `manual`，否则留空 `Automatic`。\n3. 在静态 `IP` 的情况下，点击 `Add`\
  \ 按钮。\n4. 填写 `IP address`、`Netmask` 和 `gateway`。\n5. 添加 `DNS server IP Address`，如果有多个\
  \ `DNS server`，则用逗号分隔 `IP Address`。\n6. ![](img/Image00014.jpg) 选择 `General Tab`。\n\
  7. 勾选 `Automatically connect to this network when it is available`。\n\n点击 `Save`\
  \ 保存设置。\n\n点击 `Begin installation`。这将进入一个屏幕，其中显示安装进度、设置 `root password` 的选项以及创建一个新用户。\n\
  \n\n\n\n选择 Root 密码并提供 root 密码。点击 Done（完成）。\n\n![](img/Image00018.jpg)\n\n安装过程中，你需要创建一个普通用户。点击\
  \ `Create New user`（创建新用户）。提供用户的姓名、`username` 和密码并点击完成。如果你不想使用 root 用户进行管理，可以通过选择\
  \ `Make this user administrator`（将此用户设置为管理员）将该用户设置为管理员。\n\n![](img/Image00019.jpg)\n\
  \n安装完成后点击 `Reboot`（重启）。\n\n![](img/Image00020.jpg)\n\n重启后系统将显示许可界面并添加 RedHat 订阅详情。\n\
  \n![](img/Image00021.jpg)\n\n选择 `License information`（许可信息）\n\n![](img/Image00022.jpg)\n\
  \n在下一个页面选择 `I accept the license agreement`（我接受许可协议）并点击 `Done`（完成）\n\n现在点击 `Subscription\
  \ Manager`（订阅管理器）（这一步是可选的，你也可以以后进行）\n\n在下一个页面，如果你使用代理，请提供连接互联网的代理设置。点击 `Done`（完成）。\n\
  \n![](img/Image00023.jpg)\n\n在下一个页面提供你的 redhat 订阅登录名和密码并点击 `Done`（完成）。\n\n![](img/Image00024.jpg)\n\
  \n现在点击 `Finish Installation`（完成安装）。\n\n现在你已经完成了安装。是时候从远程机器连接新创建的服务器了，我们将在下一章讨论如何连接你的\
  \ Windows 机器。\n\n## 第 5 章 将你的 PC 连接到 RHEL 服务器\n\n在现实生活中，你偶尔会物理性地操作服务器，但通常你是从 PC\
  \ 连接并进行管理。你的 PC 上可能运行着 MS Windows 10。连接到 Linux 主机首先需要一个软件。有很多选项，如 `VanDyke`、`bitvise`\
  \ 和 `putty`。其中 `PuTTY` 是免费且最流行的选项。\n\n`PuTTY` 是一个 SSH 和 telnet 客户端，最初由 Simon Tatham\
  \ 为 Windows 开发。它是一个为远程 MS Windows 机器上的服务器提供文本终端访问的软件。要安装 `putty`，打开 Internet Explorer\
  \ 并从以下地址下载 `putty`：\n\n`http://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html`\n\
  \n下载好 `putty` 后，进行安装。\n\n当你运行 `putty` 时会看到以下屏幕。在此屏幕上：\n\n1. 填写新安装服务器的 IP 地址。\n2.\
  \ 选择协议为 `SSH`。\n3. 给会话（Session）命名，如 `RHEL1` 或 `linux1` 等。\n4. 点击 `Save`（保存）按钮。\n\
  \n![](img/Image00025.jpg)\n\n保存保存后，双击会话名称连接到 Linux 主机，或选择会话点击 `Load`（加载）然后点击 `Open`（打开）。\n\
  \n## 第 6 章 网络\n\n网络是两个或多个连接在一起的计算机组。网络允许不同机器之间进行互连。每台计算机都需要网卡来连接。每张网卡都有一个物理地址，称为\
  \ `Media Access Control address`（MAC 地址）。`MAC address` 工作在 OSI 模型的第 2 层。网卡制造商为网卡分配\
  \ MAC 地址。由于网卡可能会故障并需要更换，随着网卡的更换，`MAC address` 会改变。为了解决这个问题，我们为网卡分配 `IP address`，它工作在\
  \ OSI 模型的第 3 层。由于 `IP address` 仍然是数值，因此很难记忆，而且在动态 IP 的情况下，`IP address` 可能会更改。为了方便人类使用，我们使用\
  \ `hostname`（主机名），这无非计算机的名字。\n\n为了让你对 OSI 模型以及应用和设备及其对应层次有一个直观的概念，如下所示。\n\n### OSI\
  \ 七层与 TCP 映射\n\n| OSI 模型 | TCP 模型 | 应用 | 地址 | 设备 |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| 7:应用层 | `ApplicationLayer` | `HTTP` / `Telnet` / `SSH` | 应用 `DNS`,\
  \ `DHCP`, `ntp`, `HTTP` | |\n| 6:表示层 | `SSL` / `MIME` | | | |\n| 5:会话层 | `Sockets`\
  \ 和 远程过程调用 (RPC)` | | | |\n| 4:传输层 | `Transportlayer` | `传输控制协议 (TCP)` | `TCP/UDP`\
  \ | 网关 |\n| 3:网络层 | `Internetlayer` | `IP 协议 (IP)` | `IP4`, `IP6`, `IPX`, `ICMP`\
  \ | 路由器, 防火墙 三层交换机 |\n| 2:数据链路层 | `Network AccessLayer` | `以太网` / `帧中继` | `MAC address`,\
  \ `ARP` | 桥器 二层交换机 |\n| 1:物理层 | `IEEE 802.x` | `以太网` | 集器 | |\n\n## 检查网络配置的命令\n\n\
  在新安装之后，检查网络配置是一个好主意。作为最佳实践，请记录此配置。\n\n### 显示 IP 地址\n```\n#### ip addr show\n```\n\
  或\n```bash\n#### ifconfig -a\n```\n\n### 显示链路状态\n```bash\n#### ip link show\n```\n\
  \n### 显示路由表\n```bash\n#### ip route\n```\n或\n```bash\n#### netstat -rn\n```\n\n\
  ### 并修改主机名\n\n#### 显示主机名\n```bash\n#### hostname\n```\n\n#### 修改主机名\n当你想更改主机名时，必须分步完成：\n\
  \n1. 使用命令 `hostnamectl` 更改主机名。\n2. 接下来修改 `/etc/hosts` 中的条。\n\n1. 输入 `hostnamectl`\
  \ 命令状态来检查当前：\n```\n#### hostnamectl status\n  Static hostname: RHEL1\n       Icon\
  \ name: computer\n          Chassis: n/a\n```\n\n2. 修改主机名：\n```bash\n#### hostnamectl\
  \ set-hostname RHEL1\n```\n3. 下一步是修改 `/etc/hosts`：\n```bash\n#### edit /etc/hosts\n\
  ```\n\n\n\n\n\n`NetworkManager` 是一个守护进程，为网络连接的简易配置和管理提供接口。在 `RHEL` 的之前的版本中，网络配置是通过文件处理的。然而在\
  \ RedHat 8 中，它由 `network manager` 处理。`Network manager` 是一个动态网络配置和控制守护进程。它可以管理如 `Wifi`、`Ethernet`\
  \ 和移动设备等网络接口。`Network manager` 可以在有线网络不可用时自动从有线切换到 WiFi，反之亦然。\n\n如果你来自旧版本的 RedHat\
  \ 并且习惯于使用 `ifup` 和 `ifdown` 等网络脚本，那么在 RedHat 8 中，`ifup` 和 `ifdown` 脚本已弃用，现在由 `network\
  \ manager` 处理。传统使用的 `ifcfg` 配置文件在 `RHEL` 中仍然受支持，但默认不可用。\n\n## Network Manager 配置以下内容\n\
  \n1. IP 地址\n2. 静态路由\n3. 网络别名\n4. VPN 配置 \n5. DNS 信息\n\n### 检查 networkmanager 守护进程状态\n\
  ```bash\nsystemctl status NetworkManager\n```\n\n### 如果 Networkmanager 未运行，则启动它\n\
  ```bash\nsystemctl start NetworkManager\n```\n\n### 设置其随系统启动自动启动（大多数情况下不需要，因为 networkmanager\
  \ 默认配置为自动启动） \n```bash\nsystemctl enable NetworkManager\n```\n\n## 使用图形界面设置静态 IP\
  \ 地址\n\n设置静态 IP 地址的步骤如下所示：\n\n6. 以 root 身份登录\n7. 点击 network manager 图标并选择 Wired\
  \ settings（有线设置）\n![](img/Image00027.jpg)\n8. ![](img/Image00028.jpg) ![](img/Image00029.jpg)\
  \ 点击设置图标，小齿轮\n9. ![](img/Image00030.jpg) 选择 IPv4 tab 设置\n1. 从 IPv4 Method 中选择 `Manual`（手动）。\n\
  2. 提供 IP 地址、`Netmask` 和 `Gateway`。\n3. 填写 DNS 服务器 IP 地址。如果你有多个 DNS，请用逗号分隔所有 IP 地址。\n\
  4. 按 `Apply`（应用）。\n\n## 使用基于文本的界面 nmtui 进行网络配置\n\n`Nmtui` 是一个配置网络的文本界面工具。如果你系统中没有安装\
  \ GUI，这个工具非常有帮助，特别是当你远程管理系统时。该工具在 `RHEL` 服务器安装时默认安装。如果不存在，你可以安装它。\n\n```bash\nyum\
  \ install NetworkManager-tui\n```\n\n### 启动 nmtui\n```bash\nnmtui\n```\n\n## 命令\n\
  \n### 编辑连接设置\n语法\n```bash\nnmtui edit connection_name\n```\n示例\n```bash\nnmtui edit\
  \ ens33\n```\n\n### 连接已断开连接\n语法\n```bash\nnmtui connect connection_name\n```\n示例\n\
  ```bash\nnmtui connect ens33\n```\n\n### 使用 nmtui 修改主机名\n语法\n```bash\nnmtui hostname\
  \ new_hostname\n```\n示例\n```bash\nnmtui hostname RHEL2\n```\n\n### 导航 NMTUI\n由于\
  \ `nmtui` 是一个文本用户界面，你必须使用键盘进行导航。按 `TAB` 键移动光标到下一个字段，使用 `SHIFT + TAB` 向后移动。使用 `SPACE`\
  \ 空格键打开下拉菜单。\n\n## 使用 NMTUI 修改 IP 地址\n\n启动 `nmtui`\n```bash\nnmtui\n```\n1. 选择 `Edit\
  \ a connection`（编辑连接）\n2. ![](img/Image00031.jpg) 从列表中选择连接配置并按 `Edit`（编辑） \n![](img/Image00032.jpg)\n\
  3. 在下一个界面的 IPv4 配置上按 `SPACEBAR` 键获取弹出菜单。\n    1. 选择 `Manual` 设置静态 IP 地址。\n    2.\
  \ 按 `TAB` 键移动到 `Address` 字段并提供带有 `Netmask` 的 IP 地址。\n    3. 按 `TAB` 键移动到 `Gateway`\
  \ 列并提供 `Gateway`。\n    4. 按 `TAB` 键 `DNS Servers`。按 `SPACE` 键添加 DNS 服务器。你可以添加多个\
  \ DNS 服务器。\n    5. 确保选中了 `Automatically connect`（自动连接）。\n    6. ![](img/Image00033.jpg)\
  \ 按 `OK`（确定）\n7. 按 `ESC` 键退出 `NMTUI`\n\n## 使用配置文件修改网络配置\n\n如果你像我一样是一个老派的人，喜欢使用配置文件而不是\
  \ GUI 来工作。虽然在 `RHEL8` 中配置文件已弃用，但你仍然可以使用配置文件来控制网络。在这个示例中，我将解释如何使用配置文件更改主机的 IP 地址。\n\
  \n### 使用配置文件更改 IP 地址\n\n1. 检查当前设置\n```bash\nip addr show\n```\n2. 检查当前设备\n```bash\n\
  [root@RHEL2]# nmcli d\nDEVICE  TYPE      STATE      CONNECTION\nens33  ethernet\
  \ connected  ens160\nlo      loopback  unmanaged  --\n```\n3. 编辑 `/etc/sysconfig/network-scripts/ifcfg-*`。其中\
  \ `ifcfg-*` 文件是你上一个命令中检查的设备文件。命令输出显示 `ens160` 为设备名，则文件名将是 `ifcfg-ens160`。\n```bash\n\
  vi /etc/sysconfig/network-scripts/ifcfg-ens160\n```\n4. 根据是否有静态 IP 地址还是使用 DHCP，更改\
  \ `/etc/sysconfig/network-scripts/ifcfg-ens160` 文件。\n\n| 静态 | DHCP |\n| :--- | :---\
  \ |\n| `DEVICE=ens160BOOTPROTO=staticIPADDR =192.168.0.132NETMASK=255.255.255.0GATEWAY=192.168.0.1ONBOOT=yes`\
  \ | `DEVICE=ens160BOOTPROTO=dhcp` |\n\n5. 重启网络连接以更改 IP 地址无需重启。对于之前的版本使用脚本，当前版本中使用\
  \ `networkManager` 自动启动。\n```bash\nnmcli down\nnmcli up\n0\n```\n\n### 网络脚本\n`Red\
  \ Hat 8` 中网络脚本已弃用。如果你需要这些脚本，可以通过以下命令在系统中安装它们：\n```bash\nyum install network-scripts\n\
  ```\n\n### 使用配置文件更改 DNS\n编辑 `/etc/resolv.conf` 并添加 `search`：\n```text\nsearch example.com\
  \ // 自己的 FQDN\nnameserver 8.8.8.8 // 第一 DNS\nnameserver 8.8.4.4 // 第二 DNS\n```\n\
  \n\n\n\n\n## 用户管理\n\n用户管理描述了管理员管理用户对服务器资源及附加设备访问的能力。在多用户环境中，出于安全和隐私考虑，建议为每个用户创建独立的用户名，以便每个用户都能将其数据保存在各自的家目录中。用户和组的管理是系统管理的核心部分。\n\
  \n## 用户与组\n\n用户是指任何使用计算机或网络服务的人。用户可以是人类，也可以是账户。为了方便管理，用户被分组在不同的组中。`Group` 是一个根据不同属性将用户组织在一起的逻辑实体，可以基于相同的部门、相同的地点或相同的工作。有时，创建组仅仅是为了给不同的用户提供某些公共设施或权限。\n\
  \n## Root 用户对比普通用户\n\n在安装时，安装屏幕提供了创建 `root` 用户密码和一个额外用户密码的选项。你也可以在同一屏幕上为该额外用户分配\
  \ root 权限。在 RHEL Linux 中，`root` 是系统的默认管理员。`root` 是 RHEL 服务器上所有所有用户中权限最大的用户。一旦你以\
  \ `root` 用户身份登录，就可以在服务器上执行任何操作。与普通用户不同，`root` 用户可以读、写和修改所有其他用户的文件的和目录。`root` 用户甚至可以修改和删除系统文件。因此，妥善保管\
  \ `root` 用户的密码绝对重要。\n\n## 在图形终端上以 root 用户身份登录\n\n如果安装了图形桌面环境，系统启动后你将看到登录界面。\n\n\
  ![](img/Image00034.jpg) 点击用户图标以普通用户身份登录\n\n![](img/Image00035.jpg) 要以 `root` 用户身份登录，从图形登录界面选择\
  \ `Not listed?`（未列出？）。\n\n一旦出现登录名的框，输入 `root` 并按 `ENTER`，在密码提示处输入安装期间选择的 `root`\
  \ 密码，然后按 `ENTER`。\n\n## 使用 GUI 管理用户\n\n在 RHEL 中创建用户。\n\n1. 以 `root` 用户身份登录。\n2.\
  \ ![](img/Image00036.jpg) 从面板点击 `Activities`（活动），并在搜索栏中输入 `users`，点击 `users`。这将打开用户管理窗口。\n\
  \n![](img/Image00037.jpg)\n\n3. 点击 `Add User`（添加用户）按钮添加用户。这将弹出包含以下字段的对话框：\n    -\
  \ **Account Type**（账户类型）：你有两个选项 `Standard`（标准）或 `administrator`（管理员）\n    - **Full\
  \ Name**（全名）：输入用户的全名\n    - **Username**（用户名）：输入你想创建的用户名\n    - **Allow User to\
  \ set password when they next login/Set a password now**（允许用户下次登录时设置密码/现在设置密码）：设置密码有两种方法。第一种是强制用户在下次登录时设置密码。另一种是由管理员设置临时密码，以便新用户可以方便地更改密码。这种这种你增加了额外的安全层，使得在用户设置密码之前，未经授权的用户无法新创建的用户名。\n\
  \n![](img/Image00038.jpg)\n\n## 使用命令行管理用户\n\n使用命令行进行用户管理非常有趣，并且提供了更多的选项和活性。\n\n\
  ### 添加用户\n\n语法\n```bash\n#### useradd –c “Full name of user” username\n```\n\n示例\n\
  ```bash\n#### useradd –c “Adam mark” adam1\n```\n\n### 现在设置密码\n\n语法\n```bash\n####\
  \ passwd username\n```\n\n示例\n```bash\n#### passwd adam1\n```\n\n### 修改用户\n\n语法\n\
  ```bash\n#### usermod option username\n```\n\n示例\n```bash\n# usermod –c “Adam markwel”\
  \ adam1 \n```\n\n### 删除/移除用户\n\n语法\n```bash\n#### userdel username\n```\n\n示例\n\
  ```bash\n#### userdel adam1\n```\n\n### 显示用户信息\n\n显示当前用户的信息\n语法\n```bash\n$ id\n\
  ```\n\n示例\n```bash\n$ id\n```\n\n显示其他用户的信息\n语法\n```bash\n#### id username\n```\n\
  \n示例\n```bash\n#### id admin\n```\n\n为其他用户更改密码\n语法\n```bash\n#### passwd username\n\
  ```\n\n示例\n```bash\n#### passwd admin\n```\n\n更改自己的密码\n```bash\n$ passwd\n```\n\n\
  ### 列出密码过期信息\n\n语法\n```bash\n#### chage –l username\n```\n\n示例\n```bash\n#### chage\
  \ –l admin\n```\n\n### 设置密码过期\n\n`root` 用户可以为任何用户设置密码过期日期。在本示例中，密码将在上次更改密码后 10 天过期。\n\
  \n语法\n```bash\n#### chage -M no of days from last password change username\n```\n\
  \n示例\n![](img/Image00039.jpg) # chage -l admin\n#### chage -M 10 adam1\n#### chage\
  \ -l adam1\n![](img/Image00040.jpg)\n\n### 禁用用户的密码过期\n\n语法\n```bash\n#### chage\
  \ –M 99999 username\n```\n\n示例\n```bash\n#### chage -M 99999 admin\n```\n![](img/Image00041.jpg)\n\
  \n### 强制用户在下次登录时更改密码\n\n语法\n```bash\n#### chage –d0 username\n```\n\n示例\n```bash\n\
  #### chage –d0 adam1\n```\n\n### 锁定用户\n\n语法\n```bash\n#### usermod –L username\n\
  ```\n\n示例\n```bash\n#### usermod –L adam1\n```\n\n### 解锁用户\n\n语法\n```bash\n####\
  \ usermod –U username\n```\n\n示例\n```bash\n#### usermod –U adam1\n```\n\n## UID\n\
  \n唯一用户 ID，通常称为 `UID`。系统上存在的每个用户都有一个 `UID`。\n\n| 用户 | UID |\n| :--- | :--- |\n| root\
  \ | 0 |\n| 系统用户 | 999 |\n| 普通用户 | 1000+ |\n\n## 组\n\n通常称为 `UID` 的唯一用户 ID。系统上存在的每个用户都有一个\
  \ `UID`。`/etc/passwd` 文件包含了每个用户的 `UID`。\n\n用户是指任何使用计算机或网络服务的人。用户可以是人类，也可以是账户。为了方便管理，用户被分组在不同的组中。`Group`\
  \ 是一个根据不同属性将用户组织在一起的逻辑实体，可以基于相同的部门、相同的地点或相同的工作。有时，创建组仅仅是为了给不同的用户提供某些公共设施或权限。\n\n\
  ### 主组\n\n用户所属的主组。\n\n更改辅助组\n```bash\n#### usermod –G2 user1\n```\n\n### 添加新组\n\n\
  语法\n```bash\n#### groupadd groupname\n```\n\n示例\n```bash\n#### groupadd data1\n\
  ```\n\n### 删除组\n\n语法\n```bash\n#### groupdel groupname\n```\n\n示例\n```bash\n####\
  \ groupdel data1\n```\n\n### /etc/group 文件\n\n`/etc/group` 文件存储组信息。每行对应一个组，每行包含由冒号（:）分隔的字段。\n\
  \n| 字段 | 描述 |\n| :--- | :--- |\n| groupname | 组名。 |\n| password | 通常不使用。 |\n| GID\
  \ | 组 ID。 |\n| Group List | 该组的用户列表。用逗号分隔用户名。 |\n\n示例\n`science:x:1003:class1, class2`\n\
  \n## /etc/passwd 文件\n\n`passwd` 文件在登录时需要。这是一个纯文本文件，包含了系统账户。和 `/etc/group` 文件一样，每行对应一个用户，每行包含由冒号（:）分隔的字段，如用户\
  \ ID、组 ID、家目录和 shell。只有 `root` 用户对此有写权限。\n\n格式\n![](img/Image00042.jpg) `username:x:UID:GID:Full_user_name:home_directory:shell`\n\
  \n| 字段 | 描述 |\n| :--- | :--- |\n| username | 用户名。应该是唯一的，最多 8 个字符。它区分大小写，通常通常全小写。\
  \ |\n| x | x 字符表示加密密码存储在 `/etc/shadow` 文件中。 |\n| UID | 用户 ID |\n| GID | 组 ID |\n\
  | Full_user_name | 用户的全名 |\n| home_directory | 指定的用户家目录，用户将在此处存放文件。 |\n| shell |\
  \ 用户的默认 shell，通常设置为 `/bin/bash`，也可以是 `/etc/ksh`、`/etc/csh` 或任何其他 shell |\n\n示例\n\
  adam1:x:1004:1004:Adam mark:/home/adam1:/bin/bash`\n\n## /etc/shadow\n\n以加密格式存储实际密码。\n\
  \n格式\n`username:password:last_password_change:minimum`\n\n| 字段 | 描述 |\n| :--- |\
  \ :--- |\n| username | 最多 8 个字符。区分大小写，通常全小写。与 `/etc/passwd` 中的用户名直接匹配。 |\n| password\
  \ | 13 字符加密密码。空表示登录不需要密码（通常是个坏主意），“ * ” 表示账户已禁用。 |\n| last_password_change | 上次更改密码的日期。以自\
  \ 1970 年 1 月 1 日以来的天数表示。 |\n\n\n\n\n\n| 最小值 (Minimum) | 密码前可以更改的天数（0 表示可以随时更改） |\n\
  | 最大值 (Maximum) | 密码必须更改后的天数（99999 表示用户可以多年不更改密码） |\n| 告警 (Warn) | 密码即将过期前提醒用户的天数（7\
  \ 表示整整一周） |\n| 非活跃 (Inactive) | 密码过期后账户被禁用的天数 |\n| 过期 (Expire) | 以自 1970 年 1 月 1\
  \ 日起计算的过期天数表示的过期日期（此后账户将被禁用） |\n\n![](img/Image00043.jpg) 示例\n\n`user1:$6$0UseZ0gR$yxl3B9SilhVjpu6epAlir1:17261:0:99999:7:::`\n\
  \n## 第 8 章\n\n## 软件管理\n\n每个 Linux 发行版都有一组在安装时自动安装的包。作为一个组织，你可能根据需要需要更多的软件，例如，你可能将此服务器用作\
  \ Web 服务器，因此需要 `Apache` 或或其他 HTTP 服务器。为了安装额外的软件，你需要包。包是将所有可执行文件和数据文件封装成的单个文件。目前有两种类型的包可用：\n\
  \n### 1. 源码包\n\n与一个程序相关的文件包，包括源代码、配置文件和文档。\n\n### 2. 二进制包\n\n二进制包是预编译的二进制文件及其元数据文件的包。\n\
  \n## 包的发行格式\n\n如前所述，包有两种类型，因此以二进制或源码格式分发。主要的包发行系统有：-\n\n### Redhat 包管理器 (RPM)\n\n\
  顾如名，这种格式由 Redhat 引入。这种格式不仅被 `RHEL` 和 `Fedora` 等基于 Redhat 的发行版使用，还被 `SUSE` 和 `Mandriva`\
  \ 等许多其他发行版采用。`RPM` 包使用扩展名为 `.rpm` 文件。\n\n### Debian 包管理器\n\n该包发行系统由 Debian 引入。主要用于\
  \ Debian 以及基于 Debian 的发行版，如 `Ubuntu`、`Linux Mint` 和 `PureOS`。它使用扩展名为 `.deb` 文件。\n\
  \n## 源码包\n\n源码包可以以两种格式分发：\n\n### 1.1 Tar 包文件 (Tarball)\n\nTar 包分发是传统的包发行类型。这类包可以从任何第三方软件提供者获取，并需要\
  \ `make` 工具进行编译。\n\n### 1.2 SRPM\n\n基于 Redhat 的发行版提供仓库，你可以在那里下载可用二进制文件的源码，我们称这些文件为\
  \ `SRPMS` 或源码 RPM。`SRPMs` 是仅包含源代码和 `rpm` spec 文件的 `rpm` 包，这些 spec 文件可以使用 `rpm` 安装，然后可以手动编译或修改。\n\
  \n## 包元数据\n\n`RHEL` 使用 `.rpm` 包通过 `rpm` 命令安装软件。`RPM` 包只是一个包含某些文件和关于这些文件信息的文件。从技术上说，`RPM`\
  \ 是一个包含 `cpio` 归包及其自身元数据的文件。`RPM` Header 包含元数据，这些元数据用于确定关于包的以下内容：-\n\n* 包的描述。\n\
  * 包中的文件列表。\n* 包的版本和发布版本。\n* 制作时间和及制作者。\n* 支持的架构。\n* 包中所含文件的校验和。\n* 依赖关系。\n* 等。\n\
  \n## 包管理系统\n\n`RHEL` 使用 `.rpm` 包通过 `rpm` 命令安装软件。`RPM` 包只是一个包含某些文件和关于这些文件信息的文件。从技术上说，`RPM`\
  \ 是一个包含 `cpio` 归包及其自身元数据的文件。`RPM` Header 包含元数据，这些元数据用于确定关于包的以下内容：-\n\n* 包的描述。\n\
