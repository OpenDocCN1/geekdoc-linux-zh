    In executing an import, several things happen:


    +   1. The module source code is located. If it can''t be found, an ImportError
    exception is raised.


    +   2. A new module object is created. This object serves as a container for all
    of the global definitions contained within the module. It''s sometimes referred
    to as a namespace.


    +   3. The module source code is executed within the newly created module namespace.


    +   4. If no errors occur, a name is created within the caller that refers to
    the new module object. This name matches the name of the module, without any kind
