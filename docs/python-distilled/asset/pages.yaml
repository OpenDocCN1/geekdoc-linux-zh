  md: "# # 6. Generators\n\nGenerator functions are one of Python’s most interesting\
    \ and powerful features. Generators are often presented as a convenient way to\
    \ define kinds of iteration patterns. However, there is much more to them: Generators\
    \ can also fundamentally change the whole execution model of functions. This chapter\
    \ discusses generators, generator delegation, generator-based coroutines, and\
    \ common applications of generators.\n\n# ## 6.1 Generators and yield\n\nIf a\
    \ function uses the yield keyword, it defines an object known as a generator.\
    \ The primary use of a generator is to produce values for use in iteration. Here’s\
    \ an example:\n\nClick to view code image\n\n```\ndef countdown(n):\n    print('Counting\
    \ down from', n)\n    while n > 0:\n        yield n\n        n -= 1\n```\n\n#\
    \ Example use\nfor x in countdown(10):\n\n```\n    print('T-minus', x)\n```\n\n\
    If you call this function, you will find that none of its code starts executing.\
    \ For example:\n\nClick to view code image\n\n```\n>>> c = countdown(10)\n>>>\
    \ c\n```"
