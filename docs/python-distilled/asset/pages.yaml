    partial() lambda can be used for similar purposes, but there is important semantic
    distinction between the two techniques. partial(), the arguments are evaluated
    and bound at time the partial function is first defined. With a zero-argument
    lambda, the arguments are evaluated and bound when the lambda function actually
    executes later (the evaluation of everything is delayed). To illustrate:


    Click here to view code image


    ```

    >>> def func(x, y):

    ...    return x + y

    ...

    >>> a = 2

    >>> b = 3

    >>> f = lambda: func(a, b)

    >>> g = partial(func, a, b)

    >>> a = 10

    >>> b = 20

    >>> f()    # Uses current values of a, b

    30

    >>> g()    # Uses initial values of a, b

    5

    >>>

    ```


    Since partials are fully evaluated, the callables created by partial() are objects
    that can be serialized into bytes, saved in files, and even transmitted across
    network connections (for example, using the pickle standard library module). This
    is not possible with a lambda function. Thus, in applications where functions
    are passed around, possibly to Python interpreters running in different processes
    or on different machines, you''ll find partial() to be a bit more adaptable.'
