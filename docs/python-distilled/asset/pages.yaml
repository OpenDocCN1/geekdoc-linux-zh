  md: "```\nreader1(sock1)\nreader2(sock2)\n```\n\nIn practice, relying only on nonblocking\
    \ I/O is clumsy and inefficient. For example, the core of this program is the\
    \ run() function at the end. It will run in an inefficient busy loop as constantly\
    \ tries to read on the sockets. This works, but it is not a good design.\n\n#\
    \ 9.14.2 I/O Polling\n\nInstead of relying upon exceptions and spinning, it is\
    \ possible to poll I/O channels to see if data is available. The select or selectors\
    \ module can be used for this purpose. For example, here's a slightly modified\
    \ version of the run() function:\n\nClick here to view code image\n\n```\nfrom\
    \ selectors import DefaultSelector, EVENT_READ, EVENT_WRITE\n```\n\n```\ndef run(sock1,\
    \ sock2):\n    selector = DefaultSelector()\n    selector.register(sock1, EVENT_READ,\
    \ data=reader1)\n    selector.register(sock2, EVENT_READ, data=reader2)\n    #\
    \ Wait for something to happen\n    while True:\n        for key, ev in selector.select():\n\
    \            func = key.data\n            func(key.fileobj)\n```\n\nIn this code,\
    \ the loop dispatches either reader1() or reader2() function as a callback whenever\
    \ I/O is detected on the appropriate socket. The selector.select() operation itself\
    \ blocks, waiting for I/O to occur. Thus, unlike the previous example, it won't\
    \ make the CPU furiously spin.\n\nThis approach to I/O is the foundation of many\
    \ so-called \"async\" frameworks such as asyncio, although you usually don't see\
    \ the inner workings of the event loop.\n\n# 9.14.3 Threads"
