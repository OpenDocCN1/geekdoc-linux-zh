  md: "Exception handling is one of the most difficult things to get right in larger\
    \ programs. However, there are a few rules of thumb that make it easier.\n\nThe\
    \ first rule is to not catch exceptions that can't be handled at that specific\
    \ location in the code. Consider a function like this:\n\nClick here to view code\
    \ image\n\n```\ndef read_data(filename):\n    with open(filename, 'rt') as file:\n\
    \        rows = []\n        for line in file:\n            row = line.split()\n\
    \            rows.append(row[0], int(row[1]), float(row[2]))\n    return rows\n\
    ```\n\nSuppose the open() function fails due to a bad filename. This is an error\
    \ that should be caught with a try-except statement in this function? Probably\
    \ not. If the caller gets a bad filename, there is no sensible way to recover.\
    \ There is no file to open, no data to read, and nothing else's possible. It's\
    \ better to let the operation fail and report an exception back to the caller.\
    \ Avoiding an error check in read_data() doesn't mean that the exception would\
    \ never be handled anywhere—just means that it's not the role of read_data() to\
    \ do it. Perhaps the code that prompted a user for a filename would handle this\
    \ exception.\n\nThis advice might seem contrary to the experience of programmers\
    \ accustomed to rely upon special error codes or wrapped result types. In those\
    \ languages, great care is made to make sure you always check return codes for\
    \ all operations. You do not this in Python. If an operation can fail and there's\
    \ nothing you can do to recover, it's better to just let it fail. The exception\
    \ will propagate to upper levels of the program where it is usually the responsibility\
    \ of some other code to handle it.\n\nOn the other hand, a function might be able\
    \ to recover from bad data. For example:\n\nClick here to view code image\n\n\
    ```\ndef read_data(filename):\n    with open(filename, 'rt') as file:\n```"
