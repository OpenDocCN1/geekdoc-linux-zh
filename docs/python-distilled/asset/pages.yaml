  md: "# 7.5 Scoping Rules\n\nAlthough classes define an isolated namespace for the\
    \ methods, that namespace does not serve as a scope for resolving names used inside\
    \ methods. Therefore, when you're implementing a class, references to attributes\
    \ and methods must be fully qualified. For example, you always reference attributes\
    \ of the instance through self. Thus, you use self.balance not balance. This also\
    \ applies if you want to call a method from another method. For example, suppose\
    \ you want to implement withdraw() in terms of depositing a negative amount:\n\
    \nClick here to view code image\n\n```\nclass Account:\n    def __init__(self,\
    \ owner, balance):\n        self.owner = owner\n        self.balance = balance\n\
    \n    def __repr__(self):\n        return f'Account({self.owner!r}, {self.balance!r})'\n\
    \n    def deposit(self, amount):\n        self.balance += amount\n\n    def withdraw(self,\
    \ amount):\n        self.deposit(-amount) # Must use self.deposit()\n\n    def\
    \ inquiry(self):\n        return self.balance\n```\n\nThe lack of a class-level\
    \ scope is one area where Python differs from C++ or Java. If you have used those\
    \ languages, the self parameter in Python is the same as the so-called “this”\
    \ pointer, except that in Python you always have to use it explicitly.\n\n# 7.6\
