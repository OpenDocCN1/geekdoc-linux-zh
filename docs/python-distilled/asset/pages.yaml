    \ when you start iterating on it. One way to do that is to call next() on it:\n\
    \nClick here to view code image\n\n```\n>>> next(c)\nCounting down from 10\n10\n\
    >>> next(c)\n9\n```\n\nWhen next() is called, the generator function executes\
