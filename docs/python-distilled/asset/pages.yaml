  md: '# # 9. Input and Output


    Input and output (I/O) is part of all programs. This chapter describes the essentials
    of Python I/O including data encoding, command-line options, environment variables,
    file I/O, and data serialization. Particular attention is given to programming
    techniques and abstractions that encourage proper I/O handling. The end of this
    chapter gives an overview of common standard modules related to I/O.


    # ## 9.1 Data Representation


    The main problem of I/O is the outside world. To communicate with it, data must
    be properly represented, so that it can be manipulated. At the lowest level, Python
    works with two fundamental datatypes: *bytes* that represent unsigned bytes of
    any kind and *text* that represents Unicode characters.


    To represent, two built-in types are used, bytes and bytearray. bytes is an immutable
    string of integer value. bytearray is a mutable byte array that behaves as a combination
    of a byte string and a list. Its mutability makes it suitable for building groups
    of bytes in a more incremental manner, when assembling data from fragments. The
    following example illustrates a few features of bytes and bytearray:


    Click here to view code image


    ```

    # Specify a bytes literal (note: b'' prefix)

    a = b''hello''

    ```


    ```

    # Specify bytes from a list of integers

    b = bytes([0x68, 0x65, 0x6c, 0x6c, 0x6f])

    ```


    ```

    # Create and populate a bytearray from parts

    c = bytearray()

    ```'
