    In practice, it can get complicated, but this approach avoids the problem of hard-wiring
    export names into the __init__.py file. Instead, if a submodule wants to export
    something, its name gets listed in one place—the __all__ variable. Then, by magic,
    it propagates to its proper place in the package namespace.


