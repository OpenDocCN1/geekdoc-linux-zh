    The modules listed below are notable because they are generally useful for a wide
    variety of applications and for Python programming in general.


    # 10.3.1 Module


    The collections module supplements Python with a variety of additional container
    objects that can be quite useful for working with data such as a double-ended
    queue (deque), dictionaries that automatically initialize missing items (defaultdict),
    and counters for tabulation (Counter).


    # 10.3.2 datetime Module


    The datetime module is where you find functions related to dates, times, and computations
    involving those things.


    # 10.3.3 itertools Module


    The itertools module provides a variety of useful iteration patterns—chaining
    iterations together, iterating over product sets, permutations, grouping, and
