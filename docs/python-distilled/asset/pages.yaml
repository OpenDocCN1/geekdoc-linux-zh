  md: 'The MRO specifies the search order for attribute lookup. Specifically, whenever
    you search for an attribute on an instance or class, each class on the MRO is
    checked in the order list. The search stops when the first match is made. The
    object class is listed in the MRO because all classes inherit from object, whether
    or not it’s listed as a parent.


    To support multiple inheritance, Python implements what’s known as “cooperative
    inheritance.” With cooperative inheritance, all of the classes are placed on the
    MRO list according to two primary ordering rules. The first rule states that a
    child class must always be checked before any of its parents. The second rule
    states that if a class has multiple parents, those parents must be checked in
    the same order as they’re written in the inheritance list of the child. For the
    most part, these rules produce an MRO that makes sense. However, the precise algorithm
    that orders the classes is quite complex and not based on any simple approach
    such as depth-first or breadth-first. Instead, the ordering is determined according
    to the C3 linearization algorithm, which is described in the paper “A Monotonic
    Superclass Linearization for Dylan (K. Barrett, et al., presented at OOPSLA96).
    A subtle aspect of this algorithm is that certain class hierarchies will be rejected
    by Python with a TypeError. Here’s an example:


    Click here to view code image


    ```

    class X: pass

    class Y(X): pass  # TypeError.

    class Z(X,Y): pass  # Can''t create consistent MRO

    ```


    In this case, the method resolution algorithm rejects class z because it can’t
    determine an ordering of the base classes that makes sense. Here, the class x
    appears before class y in the inheritance list, so it must be checked first. However,
    class y inherits from x, so if x is checked first, it violates the rule about
    children being checked first.—and if they do, it usually indicates a more serious
    design problem.


    As an example of an MRO in practice, here’s the MRO for the AnnoyingLoudCyclist
    class shown earlier:


    Click here to view code image'
