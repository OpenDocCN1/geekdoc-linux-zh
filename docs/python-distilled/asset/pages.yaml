    # # 7.33 Final Words: Keep It Simple


    This chapter has presented a lot of information about classes and the ways to
    customize and control them. However, when writing classes, keeping it simple is
    often the best strategy. Yes, you could use abstract based classes, metaclasses,
    descriptors, class decorators, properties, multiple inheritance, mixins, patterns,
    and type hints. However, you could also just write a plain class. There''s a pretty
    good chance that this class is good enough and that everyone will understand what
    it''s doing.


    In the big picture, it''s useful to step back and consider a few generally desirable
    code qualities. First and foremost, readability counts for a lot— and it often
    suffers if you pile on too many layers of abstraction. Second, you should try
    to make code that is easy to observe and debug, and don''t forget about using
    the REPL. Finally, making code testable is often a good driver for good design.
    If your code can''t be tested or testing is too awkward, there may be a better
    way to organize your solution.'
