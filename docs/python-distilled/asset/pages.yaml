    # 5.18 Decorators


    A decorator is a function that creates a wrapper around another function. The
    primary purpose of this wrapping is to alter or enhance the behavior of the object
    being wrapped. Syntactically, decorators are denoted using the @ symbol as follows:


    ```

    @decorator

    def func(x):

    ...

    ```


    The preceding code is shorthand for the following:


    ```

    def func(x):

    ...

    func = decorate(func)

    ```


    In the example, a function func() is defined. However, immediately after its definition,
    the function object itself is passed to the function decorate(), which returns
    an object that replaces the original func.'
