  md: "A generator function produces items until it returns—by reaching the end of\
    \ the function or by using a return statement. This raises a StopIteration exception\
    \ that terminates a for loop. If a generator function returns a non-None value,\
    \ it is attached to the StopIteration exception. For example, this generator function\
    \ uses both yield and return:\n\n```\ndef func():\n    yield 37\n    return 42\n\
    ```\n\nHere's how the code would execute:\n\nClick here to view code image\n\n\
    ```\n>>> f = func()\n>>> f\n<generator object func at 0x10b7cd480>\n>>> next(f)\n\
    37\n>>> next(f)\nTraceback (most recent call last):\n  File \"<stdin>\", line\
    \ 1, in <module>\nStopIteration: 42\n>>>\n```\n\nObserve that the return value\
    \ is attached to StopIteration. To collect this value, you need to explicitly\
    \ catch StopIteration and extract the value:\n\nClick here to view code image\n\
    \n```\ntry:\n    next(f)\nexcept StopIteration as e:\n    value = e.value\n```\n\
    \nNormally, generator functions don't return a value. Generators are almost always\
    \ consumed by a for loop where there is no way to obtain the exception value.\
    \ This means the only practical way to get the value is to drive the generator\
    \ manually with explicit next() calls. Most code involving generators just doesn't\
    \ do that."
