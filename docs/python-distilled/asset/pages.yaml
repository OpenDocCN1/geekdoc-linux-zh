    Although this scheme provides the illusion of data hiding, there’s no mechanism
    in place to actually prevent access to the “private” attributes of a class. In
    particular, if the names of the class and the corresponding private attribute
    are known, they can still be accessed using the mangled name. If access to private
    attributes is still a concern, you might consider a more painful code review process.


    At first glance, name mangling might look like an extra processing step. However,
    the mangling process actually occurs once when the class is defined. It does not
    occur during execution of the methods, nor does it add extra overhead to program
    execution. Be aware that name mangling does not occur in functions such as getattr(),
    hasattr(), setattr(), or dir() where the attribute name is specified as a string.
    For these functions, you would need to explicitly use the mangled name such as
    `_ClassName__name` to access the attribute.


    In practice, it’s probably best to not overthink the privacy of names. Double-underscore
    names are less so. Although you can take further steps to try and truly hide attributes,
    the extra effort and added complexity is hardly worth the benefits gained. Perhaps
    the most useful thing is that if you see leading underscores on a name, it''s
    almost certainly some kind of internal detail best left alone.


