    The __enter__() method is invoked when the with statement executes. The value
    returned by this method is placed into the variable specified with the optional
    as var specifier. The __exit__() method is called as soon as control flow leaves
    the block of statements associated with the with statement. As arguments, __exit__()
    receives the current exception type, value, and a traceback if an exception has
    been raised. If no errors are being handled, all three values are set to None.
    The __exit__() method should return True or False to indicate if a raised exception
    was handled or not. If True is returned, any pending exception is cleared and
    program execution continues normally with the first statement after the with block.


    The primary use of the context management interface is to allow for simplified
    resource control on objects involving system state such as open files, network
    connections, and locks. By implementing this interface, an object can safely clean
    up resources when execution leaves a context in which an object is being used.
