  md: 'For network programming, it is common to use pickle to create byte-encoded
    messages. To do that, use dumps() and loads(). Instead of reading/writing data
    to a file, these functions work with byte strings.


    Click here to view code image


    ```

    obj = SomeObject()


    # Turn an object into bytes

    data = pickle.dumps(obj)

    ...


    # Turn bytes back into an object

    obj = pickle.loads(data)

    ```


    It is not normally necessary for user-defined objects to do anything extra to
    work with pickle. However, certain kinds of objects can''t be pickled. These tend
    to be objects that incorporate runtime state—open files, threads, closures, generators,
    and so on. To handle these tricky cases, a class can define the special methods
    __getstate__() and __setstate__().


    The __getstate__() method, if defined, will be called to create a value representing
    the state of an object. The value returned by __getstate__() is typically a string,
    tuple, list, or dictionary. The __setstate__() method receives this value during
    unpickling and should restore the state of an object from it.


    When encoding an object, pickle does not include the underlying source code itself.
    Instead, it encodes a name reference to the defining class. When unpickling, this
    name is used to perform a source-code lookup on the system. It is also important
    to emphasize that pickle is inherently insecure—unpickling untrusted data is a
    known vector forfor remote code execution. Thus, pickle should only be used if
    you can completely secure the runtime environment.


