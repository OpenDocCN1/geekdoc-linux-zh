  md: "# 6.3 Generator Delegation\n\nAn essential feature of generators is that a\
    \ function involving yield never executes by itself—it always has to be driven\
    \ by some other code using a for loop or explicit next() calls. This makes it\
    \ somewhat difficult to write library functions involving yield because calling\
    \ a generator function is not enough to make it execute. To address this, the\
    \ yield from statement can be used. For example:\n\nClick here to view code image\n\
    \n```\ndef countup(stop):\n    n = 1\n    while n <= stop:\n        yield n\n\
    \        n += 1\n```\n\n```\ndef countdown(start):\n    n = start\n    while n\
    \ > 0:\n        yield n\n        n -= 1\n```\n\n```\ndef up_and_down(n):\n   \
    \ yield from countup(n)\n    yield from countdown(n)\n```\n\n`yield from` effectively\
    \ delegates the iteration process to an outer iteration. For example, you would\
    \ write code like this to drive the iteration:\n\nClick here to view code image\n\
    \n```\n>>> for x in up_and_down(5):\n...    print(x, end=' ')\n1 2 3 4 5 4 3 2\
    \ 1\n>>>\n```\n\n`yield from` mainly saves you from having to drive iteration\
    \ yourself. Without this feature, you would have to write `up_and_down(n)` as\
    \ follows:\n\nClick here to view code image"
