  md: 'To open a file, you need to give open() the name of the file. The name can
    either be a fully specified absolute pathname as ''/Users/guido/Desktop/files/old/data.csv''
    or a relative pathname such as ''data.csv'' or ''../data.csv''. For relative filenames,
    the file location is relative to the current working directory returned by os.getcwd().
    The current working directory can be changed with os.chdir(newdir).


    The name itself can be encoded in a number of forms. If it''s a text string, the
    name is interpreted as the text encoding returned by sys.getfilesystemencoding()
    before being passed to the host operating system. If the filename is a byte string,
    it is left unencoded and passed as is. This latter option may be useful if you''re
    writing programs that must handle the possibility of degenerate or miscoded filenames—instead
    of passing the filename as text, you can pass the raw binary representation of
    the name. This might seem like an obscure edge case, but Python is commonly used
    to write system-level scripts that manipulate the filesystem. Abuse of the filesystem
    is a common technique used by hackers to either hide their tracks or break system
    tools.


    In addition to text and bytes, any object that implements the special method __fspath()
    can be used as a name. The __fspath() method must return a text or bytes object
    corresponding to the actual name. This is the mechanism that makes standard library
    modules such as pathlib work. For example:


    Click here to view code image


    ```

    >>> from pathlib import Path

