    # 8.17 The Penultimate Word: Start with a Package


    When starting a new program, it is easy to start with a single single Python file.
    For example, you might write a script called program.py and start with that. Although
    this will work fine for throwaway programs and short tasks, your “script” may
    start growing and adding features. Eventually, you might want to split it into
    multiple files. It''s at that point problems often arise.


    In light of this, it makes sense to get in the habit of starting all programs
    as a package from the outset. For example, instead of making a file called program.py,
    you should make a program package directory called program/


    ```

    __init__.py __main__.py

    ```


