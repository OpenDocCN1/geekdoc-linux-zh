    # 9.7.1 File Methods


    The exact type of object returned by open() depends on the combination of file
    mode and buffering options provided. However, the resulting file object supports
    the methods in Table 9.4.


    Table 9.4 File Methods


    | Method | Description |

    | --- | --- |

    | f.readable() | Returns True if file can be read. |

    | f.read([n]) | Reads at most n bytes. |

    | f.readline([n]) | Reads a single line of input up to n characters. If n is omitted,
    this method reads the entire line. |

    | f.readlines([size]) | Reads all lines and returns a list, size optionally specifies
    the approximate number of characters to read on the file before stopping. |

    | f.readinto(buffer) | Reads data into a memory buffer. |

    | f.writable() | Returns True if file can be written. |

    | f.write(s) | Writes string s. |

    | f.writelines(lines) | Writes all strings in iterable lines. |

    | f.close() | Closes the file. |

    | f.seek() | Returns True if file supports random-access seeking. |

    | f.tell() | Returns the current file pointer. |'
