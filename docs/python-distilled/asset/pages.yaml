    When presented with an expression such as x + y, the interpreter invokes a combination
    of the methods x.__add__(y) or y.__radd__() to carry out the operation. The initial
    choice is to try x.__add__(y) in all cases except the special case where y happens
    to be a subtype of x; in that case, y.__radd__() executes first. If the initial
    method fails by returning NotImplemented, an attempt is made to invoke the operation
    with reversed operands such as y.__radd__(). If this second attempt fails, the
    entire operation fails. Here is an example:


    Click here to view code image


    ```

    >>> a = 42 # int

    >>> b = 3.7 # float

    >>> a.__add__(b)

    NotImplemented

    >>> b.__radd__(a)

    45.7

    >>>

    ```


    This example might seem surprising but it reflects the fact that integers don''t
    actually know anything about floating-point numbers. However, floating-point numbers
    do know about integers—as integers are, mathematically, a special kind of floating-point
    numbers. Thus, the reversed operand produces the correct answer.'
