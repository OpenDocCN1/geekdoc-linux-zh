  md: '| Exception Class | Description |

    | --- | --- |

    | BaseException | The root class for all exceptions |

    | Exception | Base class for all program-related errors |

    | ArithmeticError | Base class for all math-related errors |

    | ImportError | Base class for import-related errors |

    | LookupError | Base class for all container lookup errors |

    | OSError | Base class for all system-related errors. IOError and EnvironmentError
    are aliases. |

    | ValueError | Base class for value-related errors, including Unicode |

    | UnicodeError | Base class for a Unicode string encoding-related errors |


    The BaseException is rarely used directly in exception handling because it matches
    all exceptions whatsoever. This includes special exceptions that affect the control
    flow such as SystemExit, KeyboardInterrupt, and StopIteration. Catching these
    is rarely what you want. Instead, all normal program-related errors inherit from
    Exception. ArithmeticError is the base for all math-related errors such as ZeroDivisionError,
    FloatingPointError, and OverflowError. ImportError is a base for all import-related
    errors. LookupError is a base for all container-related errors. OSError is a base
    for all errors originating from the operating system and environment. OSError
    encompasses a wide range of exceptions related to files, network connections,
    permissions, pipes, timeouts, and more. The ValueError exception is commonly raised
    when a bad input value is given to an operation. UnicodeError is a subclass of
    ValueError grouping all Unicode-related encoding and decoding errors.


    Table 3.2 shows some common built-in exceptions that inherit directly from Exception
    but aren''t part of a larger exception group.


