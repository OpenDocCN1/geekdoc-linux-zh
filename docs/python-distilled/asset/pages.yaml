  md: "A generator expression can only be used once. If you try to iterate a\nsecond\
    \ time, you’ll get nothing:\n\n```\n>>> for n in squares:\n...     print(n)\n\
    ...\n>>>\n```\n\nThe difference between list comprehensions and generator expressions\
    \ is\nimportant but subtle. With a list comprehension, Python actually creates\
    \ a\nlist that contains the resulting data. With a generator expression, Python\n\
    creates a generator that merely knows how to produce data on demand. In\ncertain\
    \ applications, this can greatly improve performance and memory usage.\nHere’s\
    \ an example:\n\nClick here to view code image\n\n```\n# Read a file\nf = open('data.txt')\
    \               # Open a file\nlines  = (t.strip() for t in f)      # Read lines,\
    \ strip\nwhitespace                                     # trailing/leading\n```\n\
    \n```\ncomments = (t for t in lines if t[0] == '#')  # All comments\nfor c in\
    \ comments:\n    print(c)\n```\n\nIn this example, the generator expression that\
    \ extracts lines and strips\nwhitespace does not actually read and hold the entire\
    \ file in memory. The\nsame is true of the generator that extracts comments. Instead,\
    \ the lines of\nthe file are read one-by-one when the program starts in the for\n\
    loop that follows. During this iteration, the lines of the file are produced\n\
    down demand and filtered accordingly. In fact, at no time is the entire file\n\
    loaded into memory during this process. This is a highly\nefficient way to extract\
    \ comments from a gigabyte-sized Python source file.\n\nUnlike a list comprehension,\
    \ a generator expression does not create an\nobject that works like a sequence.\
    \ It can’t be indexed, and none of the usual\nlist operations (such as append())\
    \ will work. However, the items produced\nby a generator expression can be converted\
    \ into a list using list():\n\n```\nclist = list(comments)\n```"
