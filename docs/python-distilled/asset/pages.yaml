  md: "A fundamental aspect of I/O is the concept of blocking. By its very nature,\
    \ I/O is connected to the real world. It often involves waiting for input or devices\
    \ to be ready. For example, code that reads data on the network might perform\
    \ a receive operation on a socket like this:\n\nClick here to view code image\n\
    \n```\ndata = sock.recv(8192)\n```\n\nWhen this statement executes, it might return\
    \ immediately if data is available. However, if that's not the case, it will stop—waiting\
    \ for data to arrive. This is blocking. While the program is blocked, nothing\
    \ else\n\nFor a data analysis script or a simple program, blocking is not something\
    \ that you worry about. However, if you want your program to do something else\
    \ while an operation is blocked, you will need to take a different approach. This\
    \ is the fundamental problem of concurrency—having a program work on more than\
    \ one thing at a time. One common problem is having a program on two or more different\
    \ network sockets at the same time:\n\nClick here to view code image\n\n```\n\
    def reader1(sock):\n    while (data := sock.recv(8192)):\n        print('reader1\
    \ got:', data)\n```\n\n```\ndef reader2(sock):\n    while (data := sock.recv(8192)):\n\
    \        print('reader2 got:', data)\n```\n\n```\n# Problem: How to make reader1()\
    \ and reader2()\n# run at the same time?\n```\n\nThe rest of this section outlines\
    \ a few different approaches to solving this problem. However, its not meant to\
    \ be a full tutorial on concurrency. For that, you will need to consult other\
    \ resources.\n\n# 9.14.1 Nonblocking I/O"
  merge: -1
  pgno: 384
- img_proc: true
  md: "One approach to avoiding blocking is to use so-called nonblocking I/O. This\
    \ is a special mode that has to be enabled—for example, on a socket:\n\nClick\
    \ here to view code image\n\n```\nsock.setblocking(False)\n```\n\nOnce enabled,\
    \ an exception will now be raised if an operation would have blocked. For this\
    \ example:\n\nClick here to view code image\n\n```\ntry:\n    data = sock.recv(8192)\n\
    except BlockingIOError as e:\n    # No data is aviable\n    ...\n```\n\nIn response\
    \ to a BlockingIOError, the program could elect to work on something else. It\
    \ could retry the I/O operation to see if any data has arrived. For example, here's\
    \ how you might read on two sockets at once:\n\nClick here to view code image\n\
    \n```\ndef reader1(sock):\n    try:\n        data = sock.recv(8192)\n        print('reader1\
    \ got:', data)\nexcept BlockingIOError:\n    pass\n```\n\n```\ndef reader2(sock):\n\
    \    try:\n        data = sock.recv(8192)\n        print('reader2 got:', data)\n\
    except BlockingIOError:\n    pass\n```\n\n```\ndef run(sock1, sock2):\n    sock1.setblocking(False)\n\
    \    sock2.setblocking(False)\n    while True:\n```"
