    def reader2(sock):\n    while (data := sock.recv(8192)):\n        print('reader2\
    \ got:', data)\n\nt11 = threading.Thread(target=reader1, args=[sock1]).start()\n\
    t22 = threading.Thread(target=reader2, args=[sock2]).start()\n\n# Start the threads\n\
    t11.start()\nt22.start()\n\n# Wait for the threads to finish\nt11.join()\nt22.join()\n\
    ```\n\nIn this program, the reader1() and reader2() functions execute concurrently.\
    \ This is managed by the host operating system, so you don't need to know how\
