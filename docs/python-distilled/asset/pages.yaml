  md: 'I/O is a fundamental part of writing any useful program. Given its popularity,
    Python is able to work with literally any data format, encoding, or document structure
    that’s in use. Although the standard library might not support it, you will almost
    certainly find a third-party module to solve your problem.


    In the big picture, it may be more useful to think about the edges of your application.
    At the outer boundary between your program and reality, it’s more common issues
    related to data encoding. This is especially true for textual data and Unicode.
    Much of the complexity in Python’s I/O handling—supporting different encoding,
    error handling policies, and so on—is aimed at this specific problem. It’s also
    critical to keep in mind that textual data and binary data are strictly separated.
    Knowing what you’re working with helps in understanding the big picture.


    A secondary consideration in I/O is the overall evaluation model. Python code
    is currently separated into two worlds—normal synchronous code and asynchronous
    code usually associated with the async module (characterized by the use of async
    functions and the async/await syntax). Asynchronous code almost always requires
    using dedicated libraries that are capable of operating in that environment. This,
    in turn, forces your hand on writing your application code in the “async” style
    as well. Honestly, you should avoid asynchronous coding unless you absolutely
    know you need it—and if you’re not sure, then you will almost certainly don’t.
    Most of the well-adjusted Python-speaking universe codes in a normal synchronous
    style that is far easier to reason about, debug, and test. You should choose that
    binary.'
