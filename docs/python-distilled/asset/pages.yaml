  md: '# 9.2 Text Encoding and Decoding


    If you work with text, all data read from input must be decoded and all data written
    to output must be encoded. For explicit conversion between text and bytes, there
    are encode(text [,errors]) and decode(bytes [,errors]) methods on text and bytes
    objects, respectively. For example:


    Click here to view code image


    ```

    a = ''hello''                          # Text

    b = a.encode(''utf-8'')         # Encode to bytes

    ```


    ```

    c = b''world''                          # Bytes

    d = c.decode(''utf-8'')         # Decode to text

    ```


    Both encode() and decode() require the name of an encoding such as ''utf-8'' or
    ''latin-1''. The encodings in Table 9.1 are common.


    Table 9.1 Common Encodings


    | Encoding Name | Description |

    | ''ascii'' | Character values in the range [0x00, 0x7f]. |

    | ''latin1'' | Character values in the range [0x00, 0xff]. Also known as ''iso-8859-1''.
    |

    | ''utf-8'' | Variable-length encoding that allows all Unicode characters to be
    represented. |

    | ''cp1252'' | A common text encoding on Windows. |

    | ''macroman'' | A common text encoding on Macintosh. |


    Additionally, the encoding methods accept an optional errors argument that specifies
    behavior in the presence of encoding errors. It is one of the values in Table
    9.2.


    Table 9.2 Error Handling Options


    | Value | Description |'
