  md: "these documented patterns are aimed at working around specific issues that\
    \ arise from the strict static type system of C++ or Java. The dynamic nature\
    \ of Python renders lot of these patterns obsolete, an overkill, or simply unnecessary.\n\
    \nThat said, there are a few overarching principles of writing good software—such\
    \ as striving to write code that is debuggable, testable, and extensible. Basic\
    \ strategies such as writing classes with useful __repr__() methods, preferring\
    \ composition over inheritance, and allowing dependency injection can go a long\
    \ way towards these goals. Python programmers also like to work with code that\
    \ can be “Pythonic.” Usually, that means objects obey various built-in protocols,\
    \ such as iteration, containers, or context management. For example, instead of\
    \ trying to implement some exotic data traversal pattern from a Java programming\
    \ book, a Python programmer would probably implement it with a generator function\
    \ feeding a for loop, or just replace the entire pattern with a few dictionary\
    \ lookups.\n\n# 7.15 Data Encapsulation and Private Attributes\n\nIn Python, all\
    \ attributes and methods of a class are public, that is, accessible without any\
    \ restrictions. This is often undesirable in object-oriented applications that\
    \ have reasons to hide or encapsulate internal implementation details.\n\nTo address\
    \ this problem, Python relies on naming conventions as a means of signaling intended\
    \ usage. One such convention is that names starting with a single leading underscore\
    \ (_) indicate internal implementation. For example, here’s a version of the Account\
