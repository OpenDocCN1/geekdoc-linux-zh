    Unlike a compiler for a static language, Python does not verify correct program
    behavior in advance. Instead, the behavior of an object is determined by a dynamic
    process that involves the dispatch of so-called "special" or "magic" methods.
    The names of these special methods are always preceded and followed by underscores
    (_). The methods are automatically triggered by the interpreter as a program executes.
    For example, the operation x * y is carried out by a method x.__mul__(y). The
    names of these methods and their corresponding operators are hard-wired. The behavior
    of any given object depends entirely on the set of special methods that it implements.


    The next few sections describe the special methods associated with different core
    interpreter features. These categories are sometimes called "protocols." An object,
    including a user-defined class, may define any combination of these features to
    make the object behave in different ways.


