  md: "An asynchronous function, or coroutine function, is defined by prefacing a\
    \ normal function definition with the extra keyword async. For example:\n\nClick\
    \ here to view code image\n\n```\nasync def greeting(name):\n    print(f'Hello\
    \ {name}')\n```\n\nIf you call such a function, you'll find that it doesn't execute\
    \ in the usual way—in fact, it doesn't execute at all. Instead, you get an instance\
    \ of a coroutine object return in. For example:\n\nClick here to view code image\n\
    \n```\n>>> greeting('Guido')\n<coroutine object greeting at 0x104176dc8\n>>>\n\
    ```\n\nTo make the function, it must execute under the supervision of other code.\
    \ A common option is asyncio. For example:\n\nClick here to view code image\n\n\
    ```\n>>> import asyncio\n>>> asyncio.run(greeting('Guido'))\nHello Guido\n>>>\n\
    ```\n\nThis example brings up the most important feature of asynchronous functions—that\
    \ they never execute on their own. Some kind of manager or library code is always\
    \ required for their execution. It's not necessarily asyncio as shown, something\
    \ is always involved in making async functions run.\n\nAside from being managed,\
    \ an asynchronous function evaluates in the same manner as any other Python function.\
    \ Statements run in order and all of the usual control-flow features work. If\
    \ you want to return a result, use the usual return statement. For example:\n\n\
    Click here to view code image\n\n```\nasync def make_greeting(name):\n    return\
    \ f'Hello {name}'\n```"
