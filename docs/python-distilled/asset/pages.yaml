  md: '# # 1. Python Basics


    This chapter gives an overview of the core of the Python language. It covers variables,
    data types, expressions, control flow, functions, classes, and input/output. The
    chapter concludes with a discussion of modules, script writing, packages, and
    a few tips on organizing larger programs. This chapter is not trying to provide
    comprehensive coverage of every feature, nor does it concern itself with all of
    the tooling that might surround a Python project. However, experienced programmers
    should be able to extrapolate from the material here to write more advanced programs.
    Newcomers are encouraged to try the examples in a simple environment, such as
    a terminal window and a basic text editor.


    #  1.1 Running Python


    Python programs are executed by an interpreter. There are many different environments
    in which the Python interpreter might run—an IDE, browser, or a terminal window.
    However, underneath all, the core of the interpreter is a text-based application
    that can be started by typing python in a command shell such `bash`. Since Python
    2 and Python 3 might both be installed on the same machine, you might need to
    type python2 or python3 to pick a version. This book assumes Python 3.8 or newer.


    When the interpreter starts, a prompt appears where you can type programs into
    a so-called “read-evaluation-print loop” (REPL). For example, in the following
    output, the interpreter displays its copyright message and presents the user with
    the `>>>` prompt, at which the user types a familiar “Hello World” program:


    Click here to view code image


    ```

    Python 3.8.0 (default, Feb 3 2019, 05:53:21)

    [GCC 4.2.1 Compatible Apple LLVM 8.0.0 (clang-800.0.38)] on darwin

    type "help", "copyright", "credits" or "license" for more

    ```'
  merge: -1
