    Table 2.5 Operations on Iterables


    | Operation | Description |

    |---|---|

    | for vars in s: | Iteration |

    | v2, ... = s | Variable unpacking |

    | x in s, x not in s | Membership |

    | [a, *s, b], (a, *s, b), {a, *s, b} | Expansion in list, tuple, or set literals
    |


    The most essential operation on an iterable is the for loop. This is how you iterate
    through the values by one all. The other operations build upon this.


    The x in s operator tests whether object x appears as one of the items produced
    by the iterable s and returns True or False. The x not in s operator is the same
    as not (x in s). For strings, the in and not in operators accept substrings. For
    example, ''hello'' in ''hello world'' produces True. Note that the in operator
    does not support wildcards or any kind of pattern matching.


    Any object supporting iteration can have its values unpacked into a series of
    locations. For example:


    Click here to view code image


