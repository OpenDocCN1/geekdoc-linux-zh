  md: "# 3.5 Context Managers and the with Statement\n\nProper management of system\
    \ resources such as files, locks, and connections is often a tricky problem when\
    \ combined with exceptions. a raised exception can cause control flow to bypass\
    \ statements responsible for releasing critical resources, such as a lock.\n\n\
    The with statement allows a series of statements to execute inside a runtime context\
    \ that is controlled by an object serving as a context manager. Here is an example:\n\
    \nClick here to view code image\n\n```\nwith open('debuglog', 'wt') as file:\n\
    \    file.write('Debugging\\n')\n    statements\n    file.write('Done\\n')\n\n\
    import threading\nlock = threading.Lock()\nwith lock:\n    # Critical section\n\
    \    statements\n    # End critical section\n```\n\nIn the first example, the\
    \ with statement automatically causes the opened file to be closed when the control\
    \ flow leaves the block of statements that follow. In the second example, the\
    \ with statement automatically acquires and releases a lock when control enters\
    \ and leaves the block of statements that follow.\n\nThe obj statement allows\
    \ the object obj to manage what happens when the control enters and exits the\
    \ associated block of statements that follow. When the obj statement executes,\
    \ it calls the method obj.__enter__() to signal that a new context is being entered.\
    \ When control flow leaves the context, the method obj.__exit__(type, value, traceback)\
    \ executes. If no exception has been raised, the three arguments to __exit__()\
    \ are all set to None. Otherwise, they contain the type, value,"
