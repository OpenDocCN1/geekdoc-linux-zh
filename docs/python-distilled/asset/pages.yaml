  md: 'Table 2.11 lists the order of operation (precedence rules) for Python operators.
    All operators except the power (**) operator are evaluated from left to right
    and are listed in the table from highest to lowest precedence. That is, operators
    listed first in the table are evaluated before operators listed later. Operators
    included together within subsections, as x * y, / y, x // y, y % x, x % y, x @
    y, have equal precedence.


    # Table 2.11 Order of Evaluation (Highest Precedence to Lowest)


    | Operator | Name |

    | --- | --- |

    | (..), [...], {...} | Tuple, list, and dictionary creation |

    | s[i], s[i:j] | Indexing and slicing |

    | s.attr | Attribute lookup |

    | f(...) | Function calls |

    | +x, -x, ~x | Unary operators |

    | x ** y | Power (right associative) |

    | x * y, y / x, x // y, y % x, x @ y | Multiplication, division, floor division,
    modulo, matrix multiplication |

    | x + y, x - y | Addition, subtraction |

    | x << y, x >> y | Bit-shifting |

    | x & y | Bitwise |

    | x ^ y | Bitwise exclusive or |

    | x | y | Bitwise or |

    | x < y, x <= y, x > y, x >= y, x == y, !==y, x is y, x is not y, x in y, x not
    y | Comparison, identity, and sequence membership tests |

    | not x | Logical negation |

    | x and y | Logical and |

    | x or y | Logical or |

    | lambda args: expr | Anonymous function |'
