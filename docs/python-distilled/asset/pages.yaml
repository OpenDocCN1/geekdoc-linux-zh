  md: '# 1.3 Primitives, Variables, and Expressions


    Python provides a collection of primitive types such as integers, floats, and
    strings:


    Click here to view code image


    ```

    42              # int

    4.2             # float

    ''forty-two''    # str

    True            # bool

    ```


    A variable is a name that refers to a value. A value represents an object of some
    type:


    ```

    x = 42

    ```


    Sometimes you might see a type explicitly attached to a name. For example:


    ```

    x: int = 22

    ```


    The type is merely a hint to improve code readability. It can be used by third-party
    code-checking tools. Otherwise, it is completely ignored. It does not prevent
    you from assigning a different kind of value later.


    An expression is a combination of primitives, names, and operators that produces
    a value:


    Click here to view code image


    ```

    2 + 3 * 4        # -> 14

    ```


    The following program uses variables and expressions to perform a compound-interest
    calculation:


    Click here to view code image


    ```

    # interest.py


    principal = 1000      # Initial amount

    rate = 0.05           # Interest rate

    numyears = 5          # Number of years

    ```'
  merge: -1
