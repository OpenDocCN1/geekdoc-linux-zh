    # ## 4.1 Essential Concepts


    Every piece of data stored in a program is an object. Each object has an identity,
    a type (also known as its class), and a value. For example, when you write $a=42$,
    an integer object is created with the value of 42. The identity of the object
    is a number representing its location in memory; $a$ is a label that refers to
    this specific location although the label is not part of the object itself.


    The type of an object, also known as the object''s class, defines the object''s
    internal data representation as well as supported methods. When an object of a
    particular type is created, it is called an *instance* of that type. After an
    instance is created, its identity does not change. If an object''s value can be
    modified, the object is said to be mutable. If the value cannot be modified, the
    object is said to be immutable. An object that holds references to other objects
    is said to be a container.


