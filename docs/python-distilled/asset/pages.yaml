    Regardless of the exact form of output you see, the underlying principle is the
    same. You type a command, it runs, and you immediately see the output.


    Python’s interactive mode is one of its most useful features because you can type
    any valid statement and immediately see the result. This is useful for debugging
    and experimentation. Many people, including the author, use interactive Python
    as your desktop calculator. For example:


    Click here to view code image


    ```

    >>> 6000 + 4523.50 + 134.25

    10657.75

    >>> _ + 8192.75

    18850.5

    >>>

    ```


    When you use Python interactively, the variable _ holds the result of the last
    operation. This is useful if you want to use that in subsequent statements. This
    variable only gets defined when working interactively, so don’t use it in saved
    programs.


    You can exit the interactive interpreter by typing quit() or the EOF (end of file)
    character. On UNIX, EOF is Ctrl+D; on Windows, it’s Ctrl+Z.'
