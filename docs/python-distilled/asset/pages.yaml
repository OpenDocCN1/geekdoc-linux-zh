  md: 'The sys module contains a variety of attributes and methods related to the
    runtime environment of Python itself. This includes command-line options, standard
    I/O streams, the import path, and similar features.


    # 10.3.12 time Module


    The time module is where you find various functions related to system time, such
    as getting the value of the system clock, sleeping, and the number of elapsed
    CPU seconds.


    # 10.3.13 turtle Module


    Turtle graphics. You know, for kids.


    # 10.3.14 unittest Module


    The unittest module provides built-support for writing unit tests. Python itself
    is tested using unittest. However, many programmers prefer using third-party libraries
    such as pytest for testing. This author concurs.


    # 10.4 Final Words: Use the Built-Ins


    In the modern world where there are hundreds of thousands of Python packages,
    it is easy for programmers to seek solutions to small problems in the form of
    third-party package dependencies. However, Python has long had an extremely useful
    set of built-in functions and datatypes. Combined with modules from the standard
    library, a wide range of common programming problems can often be solved using
    nothing beyond what Python already provides. Given a choice, prefer that.'
