  md: '# 1.2 Python Programs


    If you want to create a program that you can run repeatedly, put statements in
    a text file. For example:


    ```

    # hello.py

    print(''Hello World'')

    ```


    Python source files are UTF-8-encoded text files that normally have a .py suffix.
    The # character denotes a comment that extends to the end of the line. International
    (Unicode) characters can be freely used in the source code as long as you use
    the UTF-8 encoding (this is the default in most editors, but it never hurts to
    check your editor settings if you''re unsure.


    To execute the hello.py file, provide the filename to the interpreter as follows:


    ```

    shell % python3 hello.py

    Hello World

    shell %

    ```


    It is common to use #! to specify the interpreter on the first line of a program,
    like this:


    ```

    #!/usr/bin/env python3

    print(''Hello World'')

    ```


    On UNIX, if you give this file execute permissions (for example, by chmod +x hello.py),
    you can run the program by typing hello.py into your shell.


    On Windows, you can double-click on a .py file or type the name of the program
    into the Windows Start menu to launch it. The # line, if it is used to pick the
    interpreter version (Python 2 versus 3). Execution of a program might take place
    in a console window that disappears immediately after the program completes—before
    you can read its output. For debugging, it''s better to run the program within
    a Python development environment.


    The interpreter runs statements in order until it reaches the end of the input
    file. At that point, the program terminates and Python exits.'
  merge: -1
  pgno: 22
