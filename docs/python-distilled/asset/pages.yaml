    # # 1.4 Arithmetic Operators


    Python has a standard set of mathematical operators, shown in Table 1.1.

    These operators have the same meaning they do in most other programming languages.


    Table 1.1 Arithmetic Operators


    | Operation | Description |

    | x + y | Addition |

    | x - y | Subtraction |

    | x * y | Multiplication |

    | x / y | Division |

    | x // y | Truncating division |

    | x ** y | Power (x to the y power) |

