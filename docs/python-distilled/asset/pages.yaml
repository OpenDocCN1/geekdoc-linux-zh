    # 7.32 Built-in Objects for Instances and Classes


    This section gives some details about the low-level objects used to represent
    types and instances. This information may be useful in low-level metaprogramming
    and code that needs to directly manipulate types.


    Table 7.1 shows commonly used attributes of a type object `cls`.


    Table 7.1 Attributes of Types


    | Attribute | Description |

    | --- | --- |

    | cls.__name__ | Class name |

    | cls.__module__ | Module name in which the class is defined |

    | cls.__qualname__ | Fully qualified class name |

    | cls.__bases__ | Tuple of base classes |

    | cls.__mro__ | Method Resolution Order tuple |

    | cls.__dict__ | Dictionary holding class methods and variables |

    | cls.__doc__ | Documentation string |

    | cls.__annotations__ | Dictionary of class type hints |


    The `cls.__name__` attribute contains a short class name. The `cls.__qualname__`
    attribute contains a fully qualified name with additional information about the
    surrounding context (this may be useful if defined inside a function or if you
    create a nested class definition). The `cls.__annotations__` dictionary contains
    class-level type hints (if any).'
