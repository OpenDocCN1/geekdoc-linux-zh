  md: '# Configuring and Building the Kernel


    Hackito ergo sum Anonymous


    One of the neatest things about Linux is that you have the source code. You''re
    free to do whatever you want with it. Most of us have no intention, or need, to
    dive in and directly hack the kernel sources. Access to the source code does mean
    that the kernel is highly configurable. That is, you can build a kernel that precisely
    matches the requirements, or limitations, of your target system.


    Now again, if you are writing applications for Linux, as we''ve been doing in
    the last few chapters, or if you''re a Linux system administrator, you may never
    have to touch the kernel. But as an embedded systems developer, you will most
    certainly have to build a new kernel, probably several times, either for the workstation
    or the target environment. Fortunately, the process of configuring and building
    a kernel is fairly straightforward. My experience has been building a new kernel
    is a great confidence-building exercise, especially if you''re new to Linux.


    The remainder of this chapter details the various steps required to configure
    and build an executable kernel image for your target board.


