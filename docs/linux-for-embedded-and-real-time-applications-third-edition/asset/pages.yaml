    I think this quote says best:


    > A real-time system is one in which the correctness of the computations not only
    depends upon the logical correctness of the computation but also upon the time
    at which the result is produced. If the timing constraints of the system are not
    met, system failure is said to have occurred.


    Donald Gilles in the Real-Time Computing FAQ


    So the art of real-time programming is designing systems that reliably meet timing
    constraints in the midst of random asynchronous events. Surprisingly this is easier
    said than done, and there is an extensive body of literature and development work
    devoted to the theory of real-time systems.


    # How and Why Does Linux Fit In?


    Linux developed as a general-purpose OS in the model of Unix whose basic architecture
    it emulates. One would suggest that Unix is suitable as an embedded or real-time
    OS (RTOS). It''s big, its resource hog and its scheduler is based on “fairness”
    rather than priority. In short, it''s the exact antithesis of an embedded OS.


    But Linux has several things for that earlier versions of Unix lack. It''s “free”
    and you get the source code. There is a large and enthusiastic community of Linux
    developers and users. There''s a good chance that someone else is working or has
    worked on the same problem you''re facing. It''s all out on the web. The trick
    is finding it.


    # Open Source


    Linux has been developed under the philosophy of Open Source software pioneered
    by the Free Software Foundation (FSF). Quite simply, Open Source is based on the
    notion that software should be freely available: to use, modify, and to copy.
    The idea has been around for some 20 years in the technical culture that built
    the Internet and the World Web and in recent years has spread to the commercial
    world.


    There are a number of misconceptions about the nature of Open Source software.
    Perhaps the best way to explain what it is, is by talking about what it isn''t.


    +   Open Source is not shareware. A precondition for the use of shareware is that
    you pay the copyright holder fee. Shareware is often distributed in a free form
    that is either time- or feature-limited. To get the full package, you have to
    pay. By contrast, Open Source code is freely available and there is no obligation
    for it.'
