  md: '# The Embedded and Real-Time Space 9


    This allows other users to understand the software better and to make further
    changes if they wish.


    Open Source licenses are called "copyleft" licenses, a play on the copyright intended
    to convey the idea of using copyright law as a way of enhancing access to intellectual
    property like software rather than restricting it. Whereas copyright normally
    used by an author to prevent others from reproducing, adapting, or distributing
    a work, copyleft explicitly allows such adaptation and redistribution the resulting
    work is released under the same license terms. Copyleft allows you to benefit
    from the work of others, but any modifications you make must be released under
    similar terms.


    Arguably, the best-known, and most widely used, Open Source is the GNU General
    Public License (GPL) first released by the FSF in 1989. The Linux kernel is licensed
    under the GPL. But the GPL has a problem that makes it unviable in many commercial
    situations. Software that make use of, or relies upon, other software released
    under the GPL, even just linking to a library, is considered a derivative work
    and is therefore subject to the terms of the GPL and must be made available in
    source code.


    To get around this, and thus promote the development of Open Source libraries,
    the FSF came up with the "Library GPL.\ The distinction is that a program linked
    to a library covered by the LGPL is not considered a derivative work and so there''s
    no requirement to distribute the source, although you must still make available
    the source to the library itself.


    Subsequently, the LGPL became as the "Lesser GPL" because it offers more freedom
    to the user. While the LGPL makes it possible to develop proprietary products
    using Open Source software, the FSF encourages developers to place their libraries
    under the GPL in the interest of maximizing openness.


    At the other end of the scale is the Berkeley Software Distribution (BSD) license,
    which predates the GPL by 12 years. "suggests," but does not require, that source
    code modifications be returned to the developer community and it specifically
    allows derivative products to use other licenses, including proprietary ones.


    Other licenses—and there are quite a few—fall somewhere between these two poles.
    The Mozilla Public License (MPL), for example, developed in 1998 when Net made
    its browser open source, contains more requirements for derivative works than
    the BSD license, but fewer than the GPL or GPL. The Open Source Initiative, a
    non-profit group that certifies licenses meeting its definition of Open Source,
    78 licenses on its web site as of December 2011.


    Most software released under the GPL, including the Linux kernel, is covered by
    version 2 of the license, which was released in 1991, coincidentally the same
    year Linux was born. FSF released version 3 of the GPL in June of 2007. One of
    the motivations for version 3'
