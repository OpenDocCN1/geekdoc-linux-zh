    and download linux-3.1.5.tar.bz2. Create a directory arm/ in /usr/src and unzip
    the archive. First though, check to be sure /usr and /src have read and write
    permission for “other” enabled so that you can work with the kernel as a normal
    user. I chose to create the arm/ directory to make it clear that we are building
    this kernel for an ARM target.


