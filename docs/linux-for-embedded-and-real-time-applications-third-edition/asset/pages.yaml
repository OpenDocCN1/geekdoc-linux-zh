  md: '# Configuring and Building the Kernel 171


    Given that you may have multiple kernel source trees in your file system, the
    kernel''re currently working with is usually identified by a symbolic link in
    `/usr/src` called `linux`, although in this case `linux` will be in `/usr/src/arm`.
