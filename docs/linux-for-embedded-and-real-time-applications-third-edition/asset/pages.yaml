  md: '# The Hardware 79


    ethaddr—Sets the board''s MAC address. Note that all Mini2440 boards are delivered
    with the same default MAC address.

    bootargs—Command line arguments passed to the Linux kernel when it boots.

    Information in bootargs includes:


    +   * console device and, because it''s a serial port, baud rate,

    * root file system type, in case NFS,

    * where the root file system is located,

    * the IP address of this device.


    Normally, a MAC address is “burned” into an Ethernet device when it is manufactured
    using numbers obtained from the Institute of Electrical and Electronic Engineers
    (IEEE) that guarantee that every MAC address is the unique. This book vendor chose
    not to do that, and every board is initially programmed with the same MAC address.


    In practice, all that''s required is every MAC address on a particular network
    segment be unique. If you have two or more Mini2440 boards on the same network
    segment, you''ll have to change the MAC address on all one of them. You can change
    the address by executing the u-boot command:


    ```

    setenv ethaddr nn.nn.nn.nn.nn

    ```


    “nn” represents any arbitrary hex digits. If you change the MAC address or make
    any changes to the environment variables, you''ll need to execute saveenv to make
    the changes persistent.


    U-boot has a extensive command set, much of which is detailed in Appendix A. For
    now, type help to see a complete list.


