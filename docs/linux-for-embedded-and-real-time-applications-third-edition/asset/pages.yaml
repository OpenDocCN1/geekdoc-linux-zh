  md: '# U-Boot Boot Loader and Getting Ready to Ship


    The box said “Requires Windows 95 or better.” So, I installed Linux.


    # U-Boot


    As we saw in the previous chapter, a boot loader is a program that does some initialization
    in preparation for loading and running the OS and its supporting infrastructure.
    In a sense, the boot loader is like the BIOS in a desktop PC or server. The principal
    difference is that a boot loader executes once when the system powers up and then
    goes away. The BIOS hangs around to provide low-level I/O services.


    # Background


    Desktop Linux systems have a boot loader in addition to the BIOS. These days it''s
    usually GRUB. Because the BIOS does the heavy lifting of initializing the hardware,
    GRUB itself does little more than load and start the OS. If you''re building an
    embedded system based on conventional x86 PC, GRUB is probably the way to go.


    Our target base uses a very popular, very capable, Open Source, cross-platform
    boot loader to get things started. We briefly saw the features of U-Boot back
    in Chapter 5 when we brought the target up.


    U-Boot began as a PowerPC boot loader named 8xxROM written by Magnus Damm. Wolfgang
    Denk subsequently moved the project to Source Forge and renamed PPCBoot. The source
    code was briefly forked into a product called ARMBoot by Sysgo GmbH. The name
    was changed to U-Boot when the ARMBoot was merged into the PPCBoot tree. Today,
    U-Boot supports roughly a dozen architectures and over 400 boards.


    The development of U-Boot is closely tied to Linux with it shares some header
    files. Some of the source code originated in the kernel source.


    U-Boot supports an extensive command set not only facilitates booting but also
    manages memory, downloads files over the network, and more. Appendix A details'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# 226 Chapter 14


    the command set. The command set is augmented by environment variables and a scripting
    language.


    # Installing and Configuring U-Boot


    See the Resources section for the location of the U-Boot source tarball. There
    are a number of versions to choose from, I happen to have settled on version 1.3.2.
    Untar the tarball in your home directory. You''ll find a new subdirectory uboot-<version_number>.
    There''s a very extensive README file in the top-level directory. There are additional
    README files in the doc/ directory, primarily describe features of boards.


    U-Boot doesn''t support makeconfig or even menuconfig, at least not yet. Configuration
    is done by manually editing a header file. cd to include/configs/ and open mini2440.h.
    Configuration variables are identified as follows:


    +   - Configuration options have names beginning with CONFIG_

    - Configuration settings, which are hardware specific, have names beginning with
    CFG_

    The README file cautions that you shouldn''t meddle with these "if you don''t
    know what you''re doing."

    - Included shell commands are identified by names beginning with CONFIG_CMD_


    Like BusyBox, you can select any of the more than 150 shell commands to include
    in U-Boot. Starting at line 111 is the initial list of commands starting with
    a default set. Down at line 299, the NAND partitions are defined followed by the
    initial setup environment variables.


    When you''ve finished installing, and possibly editing, mini2440.h, cd back up
    to uboot-<version_number>, execute:


    ```

    make mini2440_config

    ```


    The U-Boot Makefile is interesting. Open it with an editor. Starting at line 470,
    there is a "config" target for every header file in the include/configs/ directory.
    Most of these entries like the one for the Mini240 at line 2480. The make unconfig
    deletes several files that were created by a previous invocation of the mkconfig
    script. Next, the mkconfig script is invoked with parameters that describe the
    question in board.


    To build U-Boot then, invoke make by itself just as we''ve done with the kernel
    and BusyBox. Note by the way that it''s not necessary to specify the cross-tool
    prefix, arm-linux-. That''s taken care of the configuration process. Of course,
    if your prefix happens to be different, you''ll either have to edit the Makefile
    to change it or pass the CROSS_COMPILE environment variable as CROSS_COMPILE=my_tool_prefix-


    ```

    make CROSS_COMPILE=my_tool_prefix-

    ```'
