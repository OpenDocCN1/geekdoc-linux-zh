  md: '# Appendix B


    system of owners of software encourages software owners to produce something—but
    not what society really needs. And it causes intangible ethical pollution that
    affects us all.


    What does society need? It needs information that is truly available to its citizens—for
    example, programs that people can read, fix, adapt, and improve, not operate.
    But what software owners typically deliver is a black box that we can''t study
    or change.


    Society also needs freedom. When a program has an owner, the users lose freedom
    to control part of their own lives.


    And above all society need to encourage the spirit of voluntary cooperation in
    its citizens. When software owners tell us that helping our neighbors in a natural
    way is “piracy”, they pollute society’s civic spirit.


    This is why we free software is a matter of freedom, not price.


    The economic argument for free is erroneous, but the economic issue is real. Some
    people write useful software for the pleasure of writing it or for admiration
    and love; but if we want more software than those people write, we need to raise
    funds.


    For ten years, free software developers have tried various methods of finding
    funds, with some success. There''s no need to make anyone rich; the median family
    income, around $35k, proves to be enough incentive for many jobs that are less
    satisfying than programming.


    For years, until a fellowship made it unnecessary, I made a living from custom
    enhancements of the free software I had. Each enhancement was added to the standard
    released version and thus eventually became available to the general public. Clients
    paid me so I would work on the enhancements they wanted, rather than on the features
    I would otherwise have considered high priority.


    The Free Software Foundation (FSF), a tax-exempt charity for free software development,
    raises funds by selling GNU CD-ROMs, T-shirts, manuals, and deluxe distributions
    (all of which users are free to copy and change), as well as from donations. It
    now has a staff of five programmers, plus three employees who handle mail orders.


    Some free developers make money by selling support services. Cygnus Support, with
    around 50 employees [when this article was written], estimates that about 15 per
    cent of its staff activity is free software development—a respectable percentage
    for a software company.


    Companies including Intel, Motorola, Texas Instruments and Analog Devices combined
    to fund the continued development of the GNU compiler for the language C. Meanwhile,
    the GNU compiler for the Ada language is being funded by the US Air Force,'
