  md: '# 204 Chapter 12


    flags has several bits including these three:


    +   - IRQ_DISABLED—indicates a "fast" handler when set. A fast handler executes
    with interrupts disabled. This bit should not be set unless it''s absolutely necessary.

    - IRQ_SHARED—when set, it indicates the interrupt line is shared. Multiple registrations
    of a shared interrupt succeed.

    - IRQ_SAMPLE_RANDOM—indicates that the generated interrupts can contribute to
    the "entropy pool" used by `/dev/random` and `/dev/urandom`.


    The last flag serves a more detailed explanation. `/dev/random` and `/dev/urandom`
    generate truly random numbers to secure keys for encryption. These random numbers
    are based on random events that contribute to an "entropy pool." If your device
    generates interrupts at truly random intervals, a keyboard for example, you should
    set this bit.


    However, devices that generate interrupts at regular intervals, the tick or the
    vertical blinking, shouldn''t set this bit. Interestingly, network drivers won''t
    set this bit because they are subject to hacking in the form of regular and predictable
    packet timing from determined hackers. The file `drivers/char/random.c` has some
    relevant comments on this.


    When the kernel calls the interrupt in response to an interrupt, it passes two
    arguments:


    +   - The interrupt number that was activated.

    - The private data argument passed to `request_irq()`.


    The handler''s return value indicates whether or not actually serviced the interrupt.
    If the handler services the interrupt, it should return `IRQ_HANDLED`. Otherwise,
    it should return `IRQ_NONE`. This helps the kernel deal with shared interrupts
    and detect spurious.


    # Probing for the Interrupt


    Take a look at `int_init()` at line 381. Following the normal device registration
    process, the next issue of concern is how we determine interrupt number to request.
    Two load time arguments control how this happens—`irq` and `probe` is initialized
    to `-1`, meaning that we haven''t yet determined interrupt to use. `probe` has
    three possible values:


    +   - 0—use a default value based on the default output (bit 0).

    - 1—get some help from the kernel in finding the correct IRQ.

    - 2—the driver will do the probing itself.'
