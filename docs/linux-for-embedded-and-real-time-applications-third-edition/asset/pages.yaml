    # Embedded Web Servers


    While programming directly at the sockets is a good introduction to networking,
    and a good background to have in case, most real-world network communication is
    done using higher level application protocols. HTTP, the protocol of the World
    Wide Web, has become the facto standard for transferring information across networks.
    No big surprise there. After all, virtually every desktop computer in the world
    has a web browser. Information rendered in HTTP is accessible to any of these
    computers with no additional software.


    # Background on HTTP


    HTTP is a fairly synchronous request/response ASCII protocol over TCP/IP as illustrated
    in Figure 10.3. The client sends a request message consisting of a header and,
    possibly, a body separated by a blank line. The header includes what the client
    wants along with some optional information about its capabilities. Each of the
    protocol elements shown in Figure 10.3 is a line of terminated by CR/LF. The single
    blank line at the end of the header tells the server to proceed.'
