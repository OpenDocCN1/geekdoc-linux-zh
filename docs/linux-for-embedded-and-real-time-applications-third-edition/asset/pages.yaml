    # Getting Started


    Bill Sargent''s blog (see Resources) has a good HOW-TO on getting started with
    OE. A number of tools are needed that may or not be installed on your system.
    The HOW-TO has a complete list. It is simple to install OE directly under your
    home directory.


    We''re using a version of OE tuned for the Mini2440. Get the repository with this
    command:


    ```

    git clone git://repo.or.cz/openembedded/mini2440.git

    ```


    When the download you''ll have a new directory, mini2440/, containing over 19,000
    files occupying about 40 MB. Have a look at a couple of typical recipe files:
    recipes/bash/bash_3.0.bb and recipes/helloworld/helloworld_1.0.0.bb. The bash
    recipe is quite simple. The key word require is equivalent to #include in C. PR
    is the Package Revision, or version number, SRC_URI is found in almost every recipe.
    It tells BitBake how and to find the files that make up the package.


    By contrast, the helloworld recipe lacks an SRC_URI directive and instead defines
    a do_fetch() method that overrides BitBake''s default fetch method. The S and
    D variables represent respectively the source and destination directories. This
    recipe also illustrates a couple of additional descriptive variables.'
