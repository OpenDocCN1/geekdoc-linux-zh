  md: '# Chapter 9


    An important philosophical point is that all Pthreads objects are considered to
    be “opaque.”

    Most of anyway. We''ll see an exception shortly. This means that you never directly
    access members of the object itself. All access is through API functions that
    get and set the member arguments of the object. This allows new arguments to be
    added to a Pthreads object by simply defining a corresponding pair of get and
    set functions for the API. In simple implementations, the get and set functions
    may be nothing more than a pair of macros that access the member of the attribute
    data structure.


    ```

    int pthread_attr_init(pthread_attr_t *attr);

    int pthread_attr_destroy(pthread_attr_t *attr);

    int pthread_attr_getdetachstate(pthread_attr_t *attr, int detachstate);

    int pthread_attr_setdetachstate(pthread_attr_t *attr, int detachstate);

    Scheduling Policy Attributes

    int pthread_attr_setschedparam(const pthread_attr_t *attr, const sched_param *param);

    int pthread_attr_getschedparam(const pthread_attr_t *attr, const sched_param *param);

    int pthread_attr_setschedpolicy(pthread_attr_t *attr, int policy);

    int pthread_attr_getschedpolicy(const pthread_attr_t *attr, int *policy);

    int pthread_attr_setinherit(const pthread_attr_t *attr, int inherit);

    int pthread_attr_getinherited(const pthread_attr_t *attr, int *inherit);

    ```


    Before an attribute object can be used, it must be initialized. Then any of the
    attributes defined for that object may be set or retrieved by the appropriate
    functions. This must be done before the attribute object is used in a call to
    thread_create(). If necessary, an attribute object can also be “destroyed.” Note
    that a single attribute object can be used in the creation of multiple threads.


    The only required attribute for thread objects is the “detach state.” This determines
    whether or not a thread can be joined when it terminates. The default state is
    PTHREAD_CREATE_JOINABLE meaning that the thread can be joined on termination.
    The alternative is PTHREAD_CREATE_DETACHED, which means the thread can''t be joined.


    Joining is useful if you need to know the thread''s return value or you want to
    make sure threads terminate in a specific order. Otherwise it''s better to create
    the thread detached. The resources of a joinable thread can''t be recovered until
    another thread joins it whereas a detached thread''s resources can be recovered
    as soon as it terminates.


    There are also a number of optional scheduling policy attributes.


