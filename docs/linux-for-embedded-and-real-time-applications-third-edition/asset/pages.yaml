    # More Thoughts on Flash Partitions


    On the running Linux, execute cat/proc/mtd. You should see the following:


    ```

    mtd0: 0004000000200000 "supervivi"

    mtd1: 0002000000200000 "param"

    mtd2: 0050000000200000 "Kernel"

    mtd3: 07aa000000200000 "root"

    mtd4: 0800000000200000 "nand"

    ```


    Compare with the partition list we got from the mtdparts command in U-Boot. That''s
    odd, the names are different. The kernel has its own view of flash partitions.
    U-Boot declares the partitions in include/configs/mini2440.h. The kernel declares
    them in arch/arm-mach2440/mach-mini2440.c. Fortunately, the sizes are the same
    as the partitions list up. The 00020000 is the partition’s erase block size.


    There''s obviously a potential here for confusion, and even worse. Clearly, it
    would be preferable to declare the partitions in one place. Only there are a couple
    of ways to accomplish this. Partitions can be passed on the kernel command line.
    The format is:


    ```

    mtdparts = <mtddef>[,<mtddef>

    <mtddef> = <mtd_id>:<partdef>[,<partdef>

    where mtd_id is a name.

    <partdef> = <size>@[offset][<name>][ro]

    <size> = ('' NAME '')

    ```


    This is essentially the format as declaration in order to turn on a specific configuration
    variable that is not by default. That is to use CONFIG_MTD_CMDLINE_PARTS, which
    is found under Device Drivers -> Memory Technology Devices (MTD) Support -> Command
    line partition table parsing in the kernel’s xconfig menu.


