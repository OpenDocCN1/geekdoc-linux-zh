  md: '# 236  Chapter 15


    A commit is a snapshot of all the files in the tree at the moment the commit command
    is executed. Differences from the previous commit or snapshot are stored in a
    compressed delta under .git/objects.


    When you create a new repository (Figure 15.4), a new subdirectory, .git/, shows
    up in the directory where you created the repository, .git/ contains everything
    you need to know about the project.


    .gitignore is a file you add to every repository you create. It contains a list
    of files that don''t need to be tracked by git. You don''t need to track object
    files (*.o) or backups (~) for instance, hello-world/ has an example of a .gitignore
    file.


    # File States and Life Cycle


    From git''s perspective, every file in your working directory exists in one of
    two states: tracked or untracked. Tracked files are the ones git knows about and
    "tracks." Tracked files may be unmodified, modified, or staged. When you clone
    a project, all files are initially tracked and unmodified. You determine the state
    of project files with the git status command.


    Try this. Add a README to the hello-world project and then execute git status.
    The result will look something like Listing 15.1. In this case, there''s a modified
    file that has been staged (by executing git add on it) but hasn''t been committed.
    As the status output says, use git add<file> to track the file and include it
    in the next commit.


    Execute git add README README that is, now staged, ready to be committed, along
    with any files that have been modified and added since the last commit.


    This brings us to the state diagram of Figure 15.5. The primary purpose of this
    state machine view is to make that most operations are performed locally, off-line.
    This has two advantages:


    +   1. It''s faster.

    2. You don''t have to be online to work.


    | git init | Create a new repository in the current directory |

    | git add * | Add all existing files to the index |

    | git commit -m ''initial project version'' | |

    | git push | Send to a remote repository |


    ![](img/55fba0370caa0078213ac3714cffd0ec_254_0.png)'
