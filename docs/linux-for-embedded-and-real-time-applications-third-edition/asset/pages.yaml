    The driver''s write function toggles the output bit for each byte sent to. Thus,
    every second byte causes an interrupt. The interrupt handler gets the current
    time with microsecond resolution and a timestamp string to a circular buffer.
    The read function "sleeps" until the interrupt handler wakes up. Then it passes
    the contents of the circular buffer to User Space. The result is a string of timestamps
    that show how quickly the system can generate interrupts. This operation is illustrated
