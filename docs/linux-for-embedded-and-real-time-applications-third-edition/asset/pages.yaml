  md: '# BusyBox and Linux Initialization 219


    until the reference count goes to zero. By contrast, a soft link or symbolic link
    points, not at data, but by a file *name*, which may or may not exist.


    # Using BusyBox


    The BusyBox executable is usually installed in the /bin directory where most user-level
    command-line utility resides. Then, for example, in /bin we create the following
    symbolic link:


    ```

    ln -s busybox ls

    ```


    Now when you invoke ls from a shell, what really gets executed is BusyBox. The
    program figures out what it''s supposed to do by looking at the first argument
    to main(), which is the name that it invoked, i.e., ls. A similar link is created
    for every command that BusyBox implements.


    You can invoke BusyBox directly, passing a command name and its arguments as a
    command line, like this:


    ```

    busybox ls-1

    ```


    Executing busybox -help or just busybox by itself yields a help message including
    a list of the commands built into the current instance of BusyBox.


    # A Thermostat Display


    Our thermostat is now a relatively useful network-enabled device, but it has no
    local display. If your Mini2440 has an LCD, we can now remedy that problem. First
    a little history.


    Many years ago, the typical "console" device for Unix, and later Linux, system
    was a dumb terminal connected to the computer via a serial line. This is a classic
    case of a character device. When video terminals like Digital Equipment Corporation’s
    (DEC’s) VT100 developed some smarts, providing means to move the cursor around,
    change colors, and selectively erase parts of the screen. Later, the PC introduced
    the notion of bit-mapped "framebuffer" devices into the computer itself.


    These developments inevitably introduced additional layers of complexity in the
    Linux driver model. During the era of serial line video terminals, every manufacturer
    initially invented its own protocol for things like cursor control. So for the
    sake of portability, these various, usually incompatible, protocols had to be
    “abstracted out” into something uniform.'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# 220 Chapter 13


    The role of a "console device driver" then is to do exactly that—provide a uniform
    interface to applications that need to do more than just output a stream of characters.

    The VT100 protocol has emerged as the de facto standard for terminal control and
    this is what a typical console driver exposes as its API.


    Likewise, framebuffer devices come in various shapes and sizes with a range of
    color depths and various ways of mapping bits and bytes to pixels on the screen.
    The role of a framebuffer is to expose a uniform API that allows applications
    (and indeed other drivers like the console) to manage these differences in a consistent
    manner.


    The driver for the LCD panel is a framebuffer driver. Framebuffers devices with
    major number 29. Unfortunately, the framebuffer API is not very well documented.
    But that''s OK because we''re not going to use it directly anyway.


    Instead, we''re going to use a console driver that is attached to device number
    4 0. This driver properly attaches itself to the S3C2410 LCD framebuffer driver
    that anything written to it ends up displayed on the screen.


    # ANSI Terminal Escape Sequences


    There is in fact a standard protocol for controlling a console device. It is based
    on the protocol originally developed by DEC for its VT100 series video terminals.
    The standard goes by number of common names, most of which contain the acronym
    ANSI (American National Standards Institute).


    Terminal control commands begin with the escape character, 27 or 0×1b, usually
    abbreviated <ESC>. This is usually followed by a "[ character and one or more
    characters that define some control action. The string <ESC>[ is known as the
    Control Sequence Initiator or CSI.


    The complete ANSI standard for terminal control is extensive, and I have to find
    a genuinely readable version of it. For reference, the version written by the
    European Computer Manufacturers Association (ECMA) is included on the CD ECMA-048.pdf.
    To find other versions, Google something like "ansi terminal escape.".


    Fortunately, there''s not a whole lot we need to do with escape sequences for
    our purposes. The main thing we want to do is move the cursor around to create
    a user-friendly display for our thermostat. The to set the cursor is:


    ```

    <ESC><row>:<col>H

    ```


    where <row> and <col> are representing the desired cursor position. Row 1, column
    1 is the upper left-hand corner of the screen. So, for example, to set the cursor
    at row 2, column 12, we would create the following string in C:


    ```

    \x1b[2;12H"

    ```'
  merge: -1
