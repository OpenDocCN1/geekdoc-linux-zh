  md: '# 40 Chapter 3


    The ps command lists the processes running on the system. The output of ps is
    one line per process. The wc command counts the number of lines, words, and characters
    passed to it. The number of lines is essentially the number of processes running.
    On my Fedora 14 system, there are 281 processes running.


    Now try:


    ```

    ps -A | more

    ```


    This lets you see the output of ps one page at a time. Note that the information
    for the ps command comes from the /proc file system.


    Here''s another command that highlights the real-time nature of /proc data. Execute:


    ```

    cat /proc/interrupts

    ```


    The interrupts list all of the interrupts in the system, the number of times each
    interrupt has fired off since the system was booted, and the driver registered
    to the interrupt. Now, execute the command again:


    ```

    cat /proc/interrupts

    ```


    You''ll see that many of the numbers have gone up, proving that the data is generated
    dynamically.


    # The Filesystem Hierarchy Standard


    A Linux system typically contains a large number of files. For example, a typical
    Fedora installation may contain around 30,000 files occupying several gigabytes
    of disk space. Clearly, it is imperative that these files be organized in some
    consistent, coherent manner. That''s the motivation behind the Filesystem Hierarchy
    Standard (FHS). The standard allows both users and software developers to “predict
    the location of installed files and directories.”4 FHS is by no means specific
    to Linux. It applies to Unix-like OSs in general.


    The directory structure of a Linux system always begins at the root, identified
    as “/. FHS specifies several directories and their contents directly subordinate
    to the root. This is illustrated in Figure 3.9. The FHS starts characterizing
    files along two independent axes:


    +   * Sharable vs. non-sharable. A networked system may be able to mount certain
    directories through Network File System (NFS) that multiple users can share executives.
    However, some information is unique to a specific computer and is thus not sharable.


    > 4 Filesystem Hierarchy Standard—Version 2.3 dated 1/29/04, edited by Rusty Russell,
    Daniel Quinlan, and Christopher Yeoh. Available from www.pathname.com/fs.'
