  md: '# 62 Chapter 4


    # Network File System


    We use NFS to mount the target board''s root file system. The reason for doing
    that will become apparent when we start developing applications in Chapter 7.
    That means we have to “export” one or more directories on the workstation to make
    them visible on the network.


    Exported directories are specified in the /etc/exports. The file probably exists,
    but is empty at this point. As root user, open it with an editor and add the following
    line:


    ```

    /home/<your_home_name>*(rw,no_root_squash,sync,no_subtree_check)

    ```


    Replace <your_home_name> with the name of your directory. This makes your directory
    visible on the network where other clients mount parts of it to their local file
    system. The "*" represents clients that are allowed to mount this directory. In
    this case, the directory is visible to any machine on the network. You can specify
    specific machines by DNS name or IP address (as in machine.intellimetrix.us, or
    192.168.1.50, for example). You can also specify all the machines on a given network
    by giving the network and root mask as in 192.168.1.0/255.255.255.


    The options inside the parentheses describe how the clients can access the directory.
    Options shown here:


    +   - rw: Allow read and write access. Alternately, you can specify ro for read
    only.

    - no_root_squash: By default, a file request made by the root user on a client
    machine is treated on the server as if it comes from nobody. If no_root_squash
    is specified, the root user on the client has the same level of access as the
    server''s root user. This can have security implications, but is necessary in
    some circumstances.

    - sync: Normally, file writing is asynchronous, meaning that the client will be
    informed that a write is complete when NFS has the request to the file system
    before it actually reaches its final destination. The sync option waits until
    the operation really complete.

    - no_subtree_check: If only part of a volume is exported, a routine called subtree
    checking verifies that a requested file is in the exported part. If the entire
    volume is exported, or you''re not concerned about this check, disabling subtree
    checking will speed up transfers.


    NFS is somewhat picky about the format of this file. The last line must end with
    an end-line character and no spaces are allowed inside the parentheses.


    With the exports in place, we need to ensure that NFS is actually running. The
    Fedora graphical dialog for this is at Administration>Services (Service Management)
    as shown in Figure 4.5. Scroll down to find and select it. Initially NFS is probably
    disabled, so you’ll need


    > 5 Ubuntu distros tend to not have NFS installed by default. Execute sudo apt-get
    install nfs-kernel-server to install it.'
