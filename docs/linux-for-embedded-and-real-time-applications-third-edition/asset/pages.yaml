    is normally mounted at /media/cdrom and what type of file system, in this case
    iso9660, the device contains.


    Like file permissions, mount can sometimes be a nuisance if all you want to do
    is read a couple of files off a CD. The real value of the mount paradigm is that
    it is not limited to physical devices directly attached to the computer nor it
    only understand native Linux file systems. As we’ll see later, we can mount parts
    of file systems from remote computers attached to a network to make their files
    accessible on the local machine. It’s also possible to mount a device that has
    a DOS FAT or VFAT file system. This is particularly useful if you use a “dual-boot”
    system that can boot up into either Windows or Linux. Files can be easily shared
    between the two systems.


