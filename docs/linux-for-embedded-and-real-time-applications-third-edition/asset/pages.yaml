    # Ubuntu


    According to its web site, Ubuntu is an ancient African word meaning “humanity
    to others.” It also means “I am what I am because of who we all are.” It is a
    fork of the Debian code base released in 2004 with the aim of creating an easy-to-use
    version of Linux. It is available in two versions: desktop and server.


    Releases are made on a predictable 6 month schedule with each fourth release getting
    long term support (LTS). LTS has been supported for 3 years for the desktop version
    and 5 years for the server version. With the pending release of 12.04, desktop
    support will be extended to 5 years.


    Historically, Ubuntu, like other Linux distros, supported the graphical desktop
    environments, both GNU Object Model Environment (GNOME) and K Desktop Environment
    (KDE). Release 11.04 in spring 2011 introduced a new desktop environment called
    Unity that is a “shell interface” for GNOME. The intention is to make more efficient
    use of space on the limited size screens of notebooks and tablets. Some users
    have criticized the new interface as “too different and less capable than GNOME”
    while others find the minimalist approach more appealing than the older paradigm.


    While Ubuntu emphasizes ease of use, the developers have made basic system configuration
    more difficult by eliminating many of the graphical dialogs that support setup
    and configuration in, for example, Fedora. Furthermore, the root account is “locked”
    so it’s not possible to directly log in root. You must use the sudo command. This
    is apparently intentional, in the traction of Windows, with a way of discouraging
    “average users” from messing around with their systems.


    Difficulty in configuration will become an issue in Chapter 4 when we have to
    change some network parameters. I don’t recommend Ubuntu unless your favorite
    distribution and you’re very comfortable with it.


