  md: '# 44 Chapter 3


    Unix outines Windows. In any case, the /etc directory contains essentially all
    of the configuration information required by the kernel and applications in the
    form of plain text. The syntax and semantics of these files isn’t immediately
    obvious, but at least you can read them. The format of many of the kernel’s configuration
    files is documented in man pages (see Section "Getting Help")


    By contrast, Windows systems have made a point of hiding configuration information
    in a magical place called "the Registry". Mortal users are often cautioned to
    stay away from the Registry because improper changes can render the system unbootable.
    In fact, the Registry can only be changed by a special program, regedit, and it
    was about a year ago that I finally figured out where the Registry resides.


    If you’ve ever mustered the courage to run regedit and actually look at the Registry,
    you’ve doubt noticed that the entries are obscure symbols and the values are even
    more obscure binary values. I submit that was absolutely intentional on Microsoft’s
    part. They didn’t want idiot consumers mucking around with their computers and
    possibly bricking them. Linux users, however, know they’re doing (it says here)
    and are entitled to see and modify configuration data to their heart’s content.


    # The Shell


    One of the last things that happens as a Linux system boots up to invoke the command
    interpreter program known as the shell. Its primary job is to parse commands you
    enter at the console and execute the corresponding program. But the shell is much
    more than just a simple command interpreter. It incorporates a powerful, expressive
    programming language of its own. Through a combination of the shell script language
    and existing utility programs it is possible to produce very sophisticated applications
    without ever writing a line of C code. In fact, this is the general philosophy
    of Unix programming. Start with a set of simple utility programs and link them
    together through the shell scripting language.


    The shell scripting language contains the usual set of programming constructs
    for looping, testing, functions, and so on. But perhaps the dearest trick in the
    shell bag is the concept of “pipes.” This is a mechanism for streaming data from
    one program to another. The metaphor is perfect. One program dumps bytes into
    one end of the pipe while a second program takes them the other end.


    > “Bricking” refers to messing up the configuration of a computer so badly that
    it no longer boots, thus rendering it the equivalent of a brick. The term is used
    alot in the embedded space. A more apt term for desktop boxes might be “boat anchoring."'
