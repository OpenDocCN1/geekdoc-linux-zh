  md: '# Embedded Networking


    Give a man a fish and feed him for a day.

    Teach him to use the Net and he won''t bother you for weeks.


    Everything is connected to the Internet, even refrigerators.$1$ So it’s time to
    turn our attention to network programming in the embedded space. Linux, as a Unix
    derivative, have extensive support for networking.


    We’ll begin by looking at the fundamental network interface, the socket. With
    that as a foundation, we’ll go on examine how common application-level network
    protocols can be used in embedded devices.


    # Sockets


    The “socket” interface, first introduced in the Berkeley versions of Unix, forms
    the basis for most network programming in Unix systems. Sockets are a generalization
    of the Unix file access mechanism that provides an endpoint for communication
    either across a network or within a single computer. A socket can also be thought
    of as an extension of the named pipe that explicitly supports a client/server
    model wherein multiple clients may be attached to a single server.


    The principal difference between file descriptors and sockets is that a file descriptor
    is bound to a specific file or device when the application calls open() whereas
    sockets can be created without binding them to a specific destination. The application
    can choose to supply a destination each time it uses the socket, for example,
    when sending datagrams, or it can bind the destination to the socket to avoid
    repeatedly specifying the destination, for example, when using TCP.


    Both the client and the server may exist on the same machine. This simplifies
    the process of building client/server applications. You can test both ends on
    the machine before distributing the application across a network. By convention,
    network address 127.0.0.1 is a “local loopback” Processes can use this address
    exactly in the way they use other network addresses.


    > $1$ http://www.engadget.com/2011/01/12/sandbox-wifi-enabled-rf4289-fridge-codes-ets-and-we-go/
    or just Google “internet refrigerator”. I don’t suppose there are any net-connected
    toaster ever.'
