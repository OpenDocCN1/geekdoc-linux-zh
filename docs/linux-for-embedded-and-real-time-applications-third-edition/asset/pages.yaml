    BusyBox menuconfig Top Menu.


    # Applets


    The 300-odd BusyBox applets are divided among several categories. These categories
    correspond closely to the BusyBox directory tree. In many cases, the BusyBox version
    of a utility omits some of the more obscure options. You might think of these
    as “lite” versions. Nevertheless, the options that are available will suffice
    for just anything you need in your embedded system.


    In some cases, you can select the options you want for a command. For example,
    the Coreutils category and scroll down to ls. You will find selectable ls options.
    Presumably, the reason for doing this is to reduce the code size if that''s important.
    It would be nice if help give some indication of how much space could be saved
    with each option.


    Browse through the categories to get a feel of what''s there. You''ll find that
    there''s an awful lot list that you don''t need, like the vi editor, for example.
    And you really need tar gzip on an embedded device? Take a look at the Shells
    category. The default shell is ash, claimed to be the most complete and “pedantically
    correct” shell in the BusyBox distribution. Two other shells, hush and msh, offer
    less functionality in exchange for a smaller footprint.


    # Building and Installing


    BusyBox uses the normal pattern of make and make install commands to build and
    install the package. If you execute make, you''ll find that it fails with the
    following error message:


    ```

    Makefile:1273: *** mixed implicit and normal rules. Stop

    ```'
