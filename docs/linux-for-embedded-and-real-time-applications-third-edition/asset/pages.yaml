  md: '# 152 Chapter 10


    A socket is characterized by three attributes that determine how communication
    takes. The domain specifies the communication medium. The most commonly used domains
    are PF_UNIX for local file system sockets and PF_INET for Internet connections.
    The “PF” stands for Protocol Family.


    The domain determines the format of the name or address. PF_INET, the address
    is AF_INET and is in the form of a dotted quad. Here “AF” stands for Address Family.
    Generally, there is a one-to-one correspondence between AF_ values and PF_ values.
    A network computer may support many different network services. A specific service
    is identified by a “port number”. Established services like ftp, http, and so
    on have defined port numbers before 1024. Local services may use port numbers
    over 1023.


    Some domains, PF_INET for example, alternate communication mechanisms. SOCK_STREAM
    is a sequenced, reliable, connection-based, two-way byte stream. This is the basis
    for TCP and is the default for PF_INET domain sockets. SOCK_DGRAM is a datagram
    service. It is used to send small messages with no guarantee that they will be
    delivered or they won’t be reordered by the network. This is the basis of UDP.
    SOCK_RAW allows a process to access the IP directly. This can be useful for implementing
    new protocols directly in User Space.


    The protocol is usually determined by the socket domain and you don’t have a choice.
    The protocol argument is usually zero.


