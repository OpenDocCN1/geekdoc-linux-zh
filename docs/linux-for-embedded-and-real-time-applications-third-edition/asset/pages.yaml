    The subject of shell programming is worthy of a book in itself and there are many.
    When I searched Amazon.com for “shell programming,” I got 189 hits.


    # Getting Help


    The official documentation for a Unix/Linux system is a set of files called “man
    pages,” being short for manual. Man pages are accessed at a time with the shell
    command as in:


    ```

    man cp

    ```


    To get help on the shell command copy. Try it. Use man man at the prompt to learn
    more about the man command. The page presents a screen at a time with a “:” prompt
    on the bottom line. To move to the next screen, type <space>. To exit man before
    reaching the end of the page, type “q”. You can also page up and page down through
    the page. Interestingly enough, you won’t find information in the man man page.
    The writing style in man pages is rather terse; they’re reference in nature, not
    tutorial. The information is typically limited to: what the command does, what
    its arguments are, and what options it takes.


    To make it easier to find a specific topic, the man pages are organized into sections
    as follows:


    +   - Section 1: User commands entered at the shell prompt.

    - Section 2: The kernel Application Programming Interface (API) functions.

    - Section 3: C library functions.

    - Section 4: Devices. Information on specific peripheral devices.

    - Section 5: File formats. Describes the syntax and semantics for many of the
    files /etc.

    - Section 6: Games.

    - Section 7: Miscellaneous.

    - Section 8: System administration. Shell commands primarily used by the system
    administrator.'
