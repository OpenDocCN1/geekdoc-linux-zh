  md: '# Embedded Networking 153


    architectures with different byte-ordering policies. The Internet has established
    a standard “network byte order,” which happens to be Big Endian. All binary data
    are expected to be in network byte order when it reaches the network. htons()
    translates a short (16 bit) integer from “host byte order,” whatever happens to
    be, network byte order. There is a companion function, ntohs(), that translates
    back from network byte order to host order. Then there is a corresponding pair
    of functions that do the same translations on long (32 bit) integers.²


    Now we bind server_socket to server_addr with the bind() function. Finally, we
    create a queue for incoming connection requests with the listen() function. A
    queue length of one should be sufficient in this case because there''s only one
    client that will be connecting to this server.


    Now, we''re ready to accept connection requests. The arguments to accept() are:


    +   * The socket descriptor.

    * A pointer to a sockaddr structure that accept() will fill in.

    * A pointer to an integer that currently holds the length of the structure in
    argument 2. accept() will modify this if the length of the client''s address structure
    is shorter.


    accept() blocks until a connection request arrives. The return value is a socket
    descriptor to be used for data transfers/from this client. the server simply echoes
    back text strings received from the client until the incoming string begins with
    “q”.


    # The Client


    Now look at netclient.c netclient determines at runtime whether it is connecting
    to a server locally or across the network. We start by creating a socket and an
    address structure in the same manner as in the server. Then, we connect to the
    server by calling connect(). The arguments are:


    +   * The socket descriptor.

    * A pointer to a sockaddr structure containing the address of the server we want
    to connect to.

    * The length of the sockaddr structure.


    When connect() returns we''re ready to transfer data. The client prompts for a
    text string, writes this string to the socket, and waits to read a response. The
    process terminates when the first character of the input string is “q”.


