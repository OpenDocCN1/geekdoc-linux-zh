  md: '# 248 Chapter 16


    that Buildroot is specifically designed to run as a normal user. You don''t have
    to be the root.


    Begin by downloading the tarball from buildroot.uclibc.org. At the time of this
    writing, the most stable release is buildroot-2012.05. Untar in a suitable location,
    probably your home directory. Execute make help to see all what is available.
    Note that there is a set of _defconfig target similar to what we saw for the kernel,
    including mini2440_defconfig. Execute make mini2440_defconfig by make xconfig.


    Figure 16.1 is a screenshot of the xconfig menu. Broadly speaking, configuration
    options falling into the following categories:


    +   * Target architecture and variant

    * Options for building Buildroot

    * Toolchain options

    * System Configuration

    * Target Package selection

    * Boot loader

    * Kernel.


    The help generally tends to be less useful than what we saw with kernel configuration.
    There are a few things you''ll probably want to change. Under Toolchain enable
