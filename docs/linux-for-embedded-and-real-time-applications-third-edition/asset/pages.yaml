  md: '# Build Tools 249


    3.1.x headers since we''re using version 3.1.5. Enable gdbserver for the target
    and Build gdb for the host. Under networking applications you''ll probably want
    to select openssh for the Eclipse Remote System Explorer. Under Filesystems select
    ext2 root filesystem is what we use for NFS mounting. Exit and save the changes.


    Execute make. A few hours later you should find the output/ subdirectory populated
    with this:


    +   - build/—All components except the cross-tool chain are here.

    - images/—Final images for the boot loader, kernel, and root file system.

    - host/—Installation tools compiled for the host needed by BuildRoot including
    the cross-tool chain.

    - staging/—A link to output/host/usr/sysroot. Its purpose isn''t very clear.

    - target/—An almost complete target file system. It''s missing the dev/ directory,
    which must be created as root user. Use a file system in images/ instead.

    - toolchain/—Build directories for components of the cross-tool chain.


    # OpenEmbedded


    The OE project describes itself as a software framework for creating Linux distributions
    primarily, not exclusively, for embedded applications. It grew out of the OpenZaurus
    project for Sharp Zaurus Personal Digital Assistants (PDAs). The OpenZaurus developers
    felt they had pushed the limits of Buildroot.


    Soon other developers involved in OE development and over the years embedded distributions
    have been based on the OE code base. OE merged with the Yocto project in March
    2011 to form the OE-Core project.


    Fundamentally, OE comprises two elements: the build engine, called BitBake, and
    the metadata tells what BitBake what to do. BitBake is written in Python. To quote
    the user’s manual, “unlike simple project tools like [BitBake] is not based on
    onemakefile or a closed set of interdependent makefiles, which collects and manages
    an set of largely independent build descriptions (package recipes) and builds
    them in proper order.”


    BitBake''s operation can be represented graphically as shown in Figure 16.2. It
    interprets, or if you prefer, recipes and configuration files to determine what
    needs to be built and how. Then it fetches the necessary source code over the
    network. The output is a set of packages and file systems.


    Metadata is grouped into four categories, each of which fulfills a specific role:


    +   - Recipes (*.bb)—These are the most common form of metadata. A recipe provides
    instructions for BitBake to build a single package. It describes the package,
    its dependencies, and any special actions required to build it.'
