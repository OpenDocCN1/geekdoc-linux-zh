    the hardware.


    Embedded devices are often severely resource-constrained. Although a typical PC
    now has 4 GB of RAM and several hundred gigabytes of disk, embedded devices often
    get by a few megabytes of RAM and non-volatile storage. This requires creativity
    on the part of the programmer.


    # What Is Real-Time?


    Real-time is even harder to explain. The basic idea behind real-time is that we
    expect the computer to respond to its environment in *time*. But what does “in
    time” mean? Many people assume that real-time means fast. Not true. Real-time
    simply means *fast enough* in the context in which the system is operating. If
    we''re talking about the computer that runs your car, that''s fast to make decisions—about
    fuel flow, spark timing—every time the engine makes a revolution.


    On the other hand, consider a chemical refinery controlled by one or more computers.
    The computer system is responsible for controlling the process and detecting potentially
    destructive malfunctions. But chemical processes have a constant time in the range
    of seconds to the very least. So we would assume that the computer system should
    be able to respond to any malfunction in time to avoid a catastrophe.


    But suppose the computer were in the midst of printing an extensive report about
    last week''s production or running payroll when the malfunction occurred. How
    soon would it be able to respond to the potential emergency?


    The essence of real-time computing is not only that the computer responds to its
    environment fast enough but also responds reliably fast enough. The engine control
    computer must be able to adjust fuel and spark every time the engine turns over.
    If it''s late, the engine doesn''t perform right. The controller of a chemical
    plant must'
