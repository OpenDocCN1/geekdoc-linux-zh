  md: '# BusyBox and Linux Initialization


    Linux: the choice of a GNU generation

    ksh@cix.ufl.edu put this on T-shirts in 1993


    Very often the biggest problem in an embedded environment is the lack of resources,
    specifically memory and storage space. As you’ve no doubt observed, either in
    the course of reading this book, or from other experience, Linux is big! The kernel
    itself is often in the range of 2–3 MB, and then there’s root file system with
    its utility programs and configuration files. In this chapter, we’ll look at a
    powerful tool for substantially reducing the overall “footprint” of Linux to make
    it fit in limited resource devices.


    The other topic we’ll address in this chapter is User Space initialization and
    specifically the question of how to get our thermostat application to start at
    boot up. We’ll also add a simple display to the thermostat.


    # Introducing BusyBox


    Even if your embedded device is “headless,” that it has no screen and/or keyboard
    in the usual sense for user interaction, you still need a minimal set of command-line
    utilities. You won’t need mount, ifconfig, and probably several others to get
    the system up and running. Remember that every shell command-line utility is a
    separate program with its own executable file.


    The idea behind BusyBox is brilliantly simple. Rather than having every utility
    a separate program with its attendant overhead, why not simply write one program
    that implements all the utilities? Well, perhaps not all, but a very large number
    of the most common utilities. Most utilities require the same set of “helper”
    functionality as parsing command lines and converting ASCII to binary. Rather
    than duplicating these functions in hundreds of files, BusyBox implements them
    exactly.


    The BusyBox project began in 1996 with the goal of putting a complete Linux system
    on a single floppy disk as a rescue disk or an installer for the Debian Linux
    distribution. A rescue disk is used to repair a Linux system that has become unemable.
    This means the rescue disk must be able to boot the system and mount the hard
    disk file systems, and it must provide sufficient command-line tools to bring
    the hard disk file system back to a bootable state.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# 214 Chapter 13


    Subsequently, embedded developers figured out that this was an obvious way to
    reduce the Linux footprint in resource-constrained embedded environments. So the
    project grew well beyond its Debian roots and today BusyBox is a part of almost
    every embedded Linux offering, and it is found in a wide array of Linux-based
    products including numerous routers and media players.


    BusyBox calls itself the "Swiss army knife" of embedded Linux, because like the
    knife, it''s an all-purpose tool. Technically, the developers refer to it as a
    "multicallar binary," meaning that the program is invoked in multiple ways to
    execute different commands. This is done with symbolic links named for the various
    utilities. These links then all point to the BusyBox executable.


    # Configuring and Installing BusyBox


    There is a version of BusyBox on the board''s DVD. Although it''s a little old,
    I suggest that it''s a good place to start just because that''s running on the
    board now. Later on you can get a more recent version from the web site. Copy
    `linux/busybox-1.13-mini2440.tgz` from the DVD to your home directory and untar.
    You''ll find a new subdirectory, `busybox-1.13.3/`.


    BusyBox is highly modular and configurable. While it is capable of implementing
    over 300 commands, which means you are required to have all of them in your system.
    The configuration process you choose exactly which commands will be included in
    your system. [Table 13.1](#) the full list of commands available in recent releases
    of BusyBox.


    BusyBox supports `xconfig` and `menuconfig` menus for configuration just like
    the kernel. [Figure 13.2](#) the `menuconfig` menu shows the top-level `menuconfig`
    menu. Also like the kernel''s `make help` target that shows the other targets.
    Oddly, `xconfig` doesn''t show in the list.


    There are no `_defconfig` targets for default configurations, so our initial configuration
    will come from somewhere else. That''s what the file `fa.config` is for. Copy
    it to `.config` and then execute either `make xconfig` or `make menuconfig`.


    # BusyBox Settings


    While the xconfig navigation panel shows a number of option categories, there
    are really only two options: (1) to configure, build, and install BusyBox and
    (2) to select the desired applets. Under Build Options, you have the choice of
