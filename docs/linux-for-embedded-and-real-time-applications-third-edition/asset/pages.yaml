    # Virtualization


    But the big buzzword in computing these days is virtualization, the process of
    running OS on top of another. The base, or native, OS is called the *host*. It
    runs a *virtual machine manager*, VMM, that turn runs one or more virtual machines
    called *guests*. Whereas in the dual-boot scenario one or the other OS running
    exclusively, with virtualization the host and the guests are running simultaneously.
    You can even move files and data between seamlessly.


    There are two popular VMs—VMware and VirtualBox. VMware is a commercial product
    from a company of the same name. They offer a free version VMware Player that
    runs on both Windows and Linux hosts.


    VirtualBox is an open source package sponsored by Oracle (formerly Sun Microsystems).
    It is too available for both Windows and Linux hosts, but also supports Mac OS
    X and Solaris.


    The two packages are fairly similar in their installation and operation. After
    installing the software (see Resources section for download pages), you create
    one or more guest machines allocating resources to them such as disk and RAM.
    A “wizard” steps you through the process of creating a new machine. A disk in
    the guest machine is represented'
