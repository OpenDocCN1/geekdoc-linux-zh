  md: "# Chapter 8\n\nWe'll have our thermostat activate a “cooler” when the temperature\
    \ rises above a given setpoint and turn the cooler off when the temperature falls\
    \ below the setpoint. In practice, real thermostats incorporate hysteresis that\
    \ prevents the cooler from rapidly switching on and off when the temperature is\
    \ right at the setpoint. This is implemented in the form of a “deadband” such\
    \ that the cooler turns on when the temperature rises above the setpoint + deadband\
    \ and doesn't turn off until the temperature drops below setpoint—deadband. Additionally,\
    \ the program includes an “alarm” that flashes if the temperature exceeds a specified\
    \ limit.\n\nTwo of the LEDs will serve as the cooler and the alarm, respectively.\
    \ These are defined in driver.h in the measure/ directory asER and ALARM. The\
    \ thermostat itself is fundamentally a simple state machine with three states\
    \ based on indicated temperature:\n\n+   * Normal\n* High\n* Limit\n\nFor each\
    \ state, the action taken and next state are:\n\n+   * Current state Normal\n\
    \    Temperature above setpoint + deadband\n    Turn on COOLER\n    Next state\
    \ = High\n    Temperature above limit\n    Turn on ALARM\n    Next state = Limit\n\
    * Current state High\n    Temperature below setpoint—deadband\n    Turn off COOLER\n\
    \    Next state = Normal\n    Temperature above limit\n    Turn on ALARM\n   \
    \ Next state = Limit\n* Current state Limit\n    Temperature below limit\n   \
    \ Turn off ALARM\n    Next state = High\n    Temperature below setpoint—deadband\n\
    \    Turn off COOLER\n    Next state = Normal\n\nThe state machine is just a big\
    \ switch() statement on the state variable."
  merge: -1
