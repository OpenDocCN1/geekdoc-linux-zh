    # The Linux Process Model


    The basic structural element in Linux is a process consisting of executable code
    and a collection of resources like data, file descriptors, and so on. These resources
    are fully protected that one process can''t directly access the resources of another.
    In order for two processes to communicate with each other, they must use the inter-process
    communication mechanisms defined by Linux as shared memory regions or pipes.


    This is all well and good as it establishes a high degree of protection in the
    system. An errant process will most likely be detected by the system and thrown
    out before it can cause any damage to other processes (Figure 3.7). But there''s
    a price to be paid in terms of excessive overhead in creating processes and using
    the inter-process communication mechanisms.


    A thread however is code only. Threads only exist within the context of a process,
    and all threads in one share its resources. Thus, all threads have equal access
    to data memory and file descriptors. This model is sometimes called lightweight
    multitasking to distinguish it from the Unix/Linux process model.


    The advantage of lightweight tasking is that inter-thread communication is more
    efficient. The drawback of course is that any thread can clobber any other thread''s
    data. Historically, most RTOS have been structured around the lightweight model.
    In recent years of the cost of memory protection hardware has dropped dramatically.
