    # Portable and Scalable


    Linux was originally developed for the Intel x86 family of processors and most
    of the ongoing kernel development work continues to be on x86s. Nevertheless,
    the design of the Linux kernel makes a clear distinction between processor-dependent
    code, which must be modified for each different architecture, and code that can
    be ported to a new processor simply by recompiling it. Consequently, Linux has
    been ported to a wide range of 32-bit, and more recently 64-bit, processor architectures
    including:


    +   - Motorola 68k and its many variants

    - Alpha

    - Power PC

    - Advanced RISC Machines (ARM)

    - Sparc

    - MIPS


    to name a few of the more popular. So whatever 32-bit architecture you’re considering
    for your embedded project, chances there’s a Linux port available for it and a
    community of developers supporting it.


    A typical desktop Linux installation runs 10–20 GB of disk space and requires
    a gigabyte of RAM to execute directly. By contrast, embedded targets are often
    limited to 64 MB or less of RAM and perhaps 128 MB of flash for storage. Fortunately,
    Linux is highly modular. Much of that 10 GB represents documentation, desktop
    utilities, and options like games that simply aren’t necessary in an embedded
    target. It is not difficult to produce a fully functional, if limited, Linux system
    occupying no more than 2 MB of flash memory.


    The kernel itself is highly configurable and includes reasonably user-friendly
    tools that allow you to remove kernel functionality not required in your application.


    # Where Is Linux Embedded?


    Just about everywhere. As of July 2005, the web LinuxDevices.com listed a little
    over 300 commercially available products running Linux. They run from cell phones,
    Personal Digital Assistant (PDAs), and other handheld devices through routers
    and gateways, thin clients, multimedia devices, and TV set-top boxes to robots
    and even rugged VMEbus chassis suitable for military command and control applications.
    And these are just the products LinuxDevices editors happen to know about.


    One of the first and perhaps the best-known home entertainment devices to embed
    Linux is the TiVo Personal Video Recorder that created a revolution in television
    viewing when it


    > ³ VERSA Module Eurocard, an industrial computer packaging and interconnection
    standard.'
