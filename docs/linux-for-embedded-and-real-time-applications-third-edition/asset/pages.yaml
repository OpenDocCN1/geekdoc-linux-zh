  md: '# 202 Chapter 12


    Interrupt handlers, by their nature, run concurrently with other code. Thus, they
    inevitably raise issues of concurrency and contention for data structures and
    hardware. All of the tools and techniques for handling race conditions and concurrent
    access come into play when dealing with interrupt handlers.


    Although the driver code we encountered up to now runs in the context of whatever
    process called it, interrupt handlers being being, run outside the context of
    any process in a state known as interrupt context. As a result, they are rather
    limited in what they can do. Here are some of the things that interrupt handlers
    are not allowed to do:


    +   * Access user space. Since the interrupt handler is executing asynchronously
    with respect to processes, we don''t know what process is running when the handler
    is invoked.

    * Sleep. Only process can sleep.

    * Execute for a long time. The handler interrupted something. We want to get back
    to whatever was as soon as possible. If an interrupt handler does require lengthy
    operation, it should invoke a bottom half.


    The example for experimenting with interrupts is called simple_int.c. The operation
    of simple_int is quite straightforward. We connect a GPIO output pin to a GPIO
    input pin that''s also configured to generate interrupts on a rising edge. Figure
    12.3 shows how to use a jumper plug to connect the appropriate bits together.


    ![](img/55fba0370caa0078213ac3714cffd0ec_193_0.png)


    Figure 12.3

    Connecting Output Bit to Input Bit.'
