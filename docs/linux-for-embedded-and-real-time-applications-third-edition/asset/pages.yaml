    # Flash Memory and File Systems


    # Flash Memory—NAND and NOR


    The Mini2440 has several forms of memory, both volatile and non-volatile, as shown
    in Figure 5.3. There are two forms of non-volatile storage: a 2 MB NOR flash that
    occupies part of the processor’s memory address space and a 128 MB NAND flash
    that uses a wide-port for address and data. Then there is 64 MB of SDRAM for working
    memory.


    There are two fundamental forms of flash memory, known as NAND and NOR, named
    for the basic logic structure of the memory cells. These two types have distinctive
    characteristics that suit them to different functions in the system.


    NOR flash is well suited for code storage because of its reliability, fast read
    operations, and random access capability. Because codes can be directly executed
    in place, NOR is ideal


    ![](img/55fba0370caa0078213ac3714cffd0ec_66_0.png)


    Figure 5.3

    Mini2440 Memory Configuration.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# The Hardware 71


    for storing firmware, boot code, OSs, and other data that change infrequently.
    The

    Mini2440 has 2 MB of NOR flash, although we''re not using it.


    The downside to NOR flash is that write and erase times are relatively slow. NAND
    flash is

    characterized by higher density, lower cost, faster write and erase times, and
    a longer

    rewrite life expectancy. This makes it useful for storing data. But whereas NOR
    flash is

    direct accessible in the processor''s memory space just like RAM, NAND flash is
    accessed

    either by serially or a byte at a time.


    Our system has 128 MB of byte-wide NAND flash organized as four “partitions":


    | Name | Size | Offset |

    |---|---|---|

    | u-boot | 0x00040000 | 0×00000000 |

    | env | 0x00020000 | 0×00040000 |

    | kernel | 0x00050000 | 0×00006000 |

    | root fs | 0x07aa0000 | 0×00560000 |


    The first partition is 256 KB and holds the boot loader, u-boot. The next partition
    of

    128 KB holds the environment variables for the boot loader. The third partition
    is the Linux

    kernel. It occupies 5 MB. Finally, the last partition is everything else and holds
    the root file

    system.


    # Root File System in Flash


    In a production-embedded environment, the root file system typically exists as
    a

    compressed image in flash memory. When the kernel boots, it copies and decompresses
    the

    image into RAM so that the file system can be writable. One consequence of this
    is that the

    file system is *volatile*. Any changes made while the system is powered up are
    lost when

    power is removed. To make changes permanent, you have to reflash the image.


    With the root file stored in NAND flash, we can make changes to files that are

    reflected directly back to the flash and are *non-volatile*.


    There are many different formats for file systems in Linux, the most popular of
    which are

    extext3 and ext4. These file systems generally reside on a mass storage device
    like a disk and

    are not well-suited to flash storage devices.


    File systems must deal with issues such as “wear leveling” and bad blocks.

    In order to write to a sector of flash memory, it must be erased. Each sector
    of a flash

    device can tolerate a limited number of erase cycles, usually counted in the hundreds
    of

    thousand. A file system for flash memory attempts to maximize the useful life
    of

    device by distributing writes evenly over the entire device. Likewise, it detects
    sectors

    have developed flaws and moves data around them.'
