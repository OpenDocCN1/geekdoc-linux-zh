  md: '# Thermostat Display


    With that background, let''s add a display to our thermostat that looks something
    like Figure 13.3. Create a Eclipse project called "lcd" located in home/src/lcd.
    Open lcdutils.c. The file contains the following functions:


    +   - lcd_erase(int what)—erases the current line or the entire screen depending
    on the value of what. A pair of constants is defined in lcdutils.h. Other options
    could be added to this function.

    - lcd_init(void)—initialize the LCD screen. Opens a file to the console device
    and returns the file descriptor. Gets access to I/O port C to manipulate the backlight.
    If anything fails it returns -1. Note that the file descriptor is not normallyed
    but available if necessary.

    - lcd_cursor(int row, int col)—moves the cursor to the indicated position.

    - lcd_write_string(int row, int col, char *string)—writes a string at the indicated
    position.

    - lcd_write_number(int row, int col, int value, int width)—writes a decimal value
    at the indicated position with the indicated width.

    - lcd_backlight(int on)—if it is zero, turn off the backlight. Otherwise turn
    it on.

    - lcd_close(void)—closes the file to the console and unmaps the I/O space.


    There’s a simple program here, lcdtest.c, that exercises these functions. Take
    a look at lcdtest.c. Then build and try it out.


    That’s sufficient functionality to create the screen shown in Figure 13.3. Have
    a go at it using the new version of the thermostat. Then, when any of the parameters
