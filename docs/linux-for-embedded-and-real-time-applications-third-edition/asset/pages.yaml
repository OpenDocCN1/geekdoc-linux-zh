  md: '# Chapter 12


    When the module is built into the kernel, the function identified by module_init()
    is added to a table of initialization functions that are called at boot up. The
    upshot is that you don''t have to modify main.c to add a new initialization function
    every time you add a new driver. It happens automatically.


    Also, we no longer need hw_cleanup() because the device will never be removed.
    You can bracket that function and the exit_module() macro with:


    ```

    #ifndef MODULE

    #endif

    ```


    Next you''ll need to edit the Makefile in usr/src/linux/drivers/char. Note that
    the Makefile consists mostly of lines like obj-*.o


    ```

    obj-$(CONFIG_yyyy) += yyyy.

    ```


    where CONFIG_yyyy represents an environment variable set by the makeconfig process
    and yyyy.o is an object file. Remember from the last chapter that all of these
    environment variables end with one of two:


    +   - “y” Yes. Build this feature into the kernel.

    - “m” Module. Build this feature as a kernel-loadable module or it''s commented
    out.


    When the top-level Makefile completes its traverse of the kernel source tree,
    the environment variable obj-y contains a list of all the object files that should
    be linked to the kernel image, and obj-m is a list of the object files that should
    be built as kernel-loadable modules.


    Add the following line to the Makefile, perhaps at the end:


    ```

    obj-$(CONFIG_SIMPLE) += simple_hw.o

    ```


    You also need to add an entry into the configuration menu. Open the Kconfig file
    in /usr/src/linux/drivers/char. Using the entries for the mini2440 device drivers
    as a model, create an entry for CONFIG_SIMPLE.


    Go back up to /usr/src/arm/linux and run makeconfig. Scroll down to the character
    device section and note that your new entry shows up and has (NEW) after the prompt.
    xconfig has noticed there''s a configuration variable in the menu that is not
    yet in the .config file.


