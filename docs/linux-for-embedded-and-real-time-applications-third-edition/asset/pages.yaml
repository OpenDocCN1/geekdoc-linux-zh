    20 bits point to the base of a Page Table or Page Frame. Bits 9–11 are available
    to the OS for its own use. Among other things, these could be used to indicate
    that a page is to be "locked" in memory, i.e., not swappable.


    Of the remaining controls bits the most interesting are as follows:


    +   P =1 This page is in memory. If this bit is 0, referencing this Page Directory
    or PTE causes a page fault. Note that when P = 0 the remainder of the entry is
    not relevant


    +   A =1 This page has been read or written. Set by the processor but cleared
    by the OS. By periodically clearing the Accessed bits, the OS can determine whether
