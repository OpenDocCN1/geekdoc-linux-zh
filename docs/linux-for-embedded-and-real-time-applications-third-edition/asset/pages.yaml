    A segment can be up to 64 KB long and is aligned on 16-byte boundaries. Programs
    less than 64 KB are inherently position-independent and can be easily relocated
    anywhere in the 1 MB address space. Programs larger than 64 KB, either in code
    or data, require multiple segments and must explicitly manipulate the segment
    registers.


    # Protected Mode


    Protected mode still makes use of the segment registers instead of providing a
    piece of the address directly, the value in the segment register (now called the
    selector) becomes an index into a table of Segment Descriptors. The segment descriptor
    describes a block of memory including, among other things, its base and limit
    (Figure 3.5). The linear address in physical memory is computed by adding the
    offset in the logical address to the base contained in the descriptor. If the
    resulting address is greater than the limit specified in the descriptor, the processor
    signals a memory protection fault.


    A descriptor is an 8-byte object that tells us everything we need to know about
    a block of memory.


    +   - Base Address [31:0] Starting address for this block/segment.

    - Limit [19:0] Length of this segment—This may be the length in bytes (up to 1
    MB) or the length in 4 KB pages. The interpretation is defined by the Granularity
    bit.

    - Type A 4-bit field that defines the kind of memory that this segment describes.'
