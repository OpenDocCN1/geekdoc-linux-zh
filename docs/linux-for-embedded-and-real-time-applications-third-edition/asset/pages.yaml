  md: '# 184 Chapter 11


    # Booting the New Kernel


    Now that we have a new kernel, how do we test it? We could of course load the
    new image into flash, either in addition to, or in place of, the kernel image
    presently there.


    The other alternative is to boot the new image over the network using TFTP. This
    is particularly advantageous in a development environment because we can quickly
    test a new kernel image without the time-consuming process of burning flash.


    Move `arch/boot/image` to `/var/lib/tftboot`, or wherever you chose as the tftp
    directory. Boot the target board into U-boot and execute the following commands:


    ```

    tftboot 320000000u

    boot 320000000

    ```


    `tftboot` downloads uimage to location 0x32000000 in RAM. `bootm` interprets the
    U-boot header at 0x32000000, copies the image to correct memory, uncompressing
    if necessary, and transfers control to it. After the kernel boots, execute the
    command `uname -a` and note that the kernel image has a timestamping when you
    built it.


    Congratulations! You can pat yourself on the back. You''re now a Linux hacker.


    Note that U-boot also interprets numbers as hex. Also, there''s a u-boot environment
    variable, `boot_tftp`, that includes the two commands listed above. Run to that
    and boot the kernel.


    In the next chapter, we''ll dive down into kernel space and look at the resources
    for Linux device drivers.


    # Resources


    For more details on the process of configuring and building a kernel, look at
    the files in `/usr/src/arm/linux/Documentation/kbuild`. Additionally, the following
    HOW-TOs at www.tldp.org may be of interest:


    Config-HOWTO This is primarily concerned with how you configure your system once
    it''s built.

    Kernel-HOWTO provides additional information on the topics covered in this chapter.


    www.linuxfromscratch.org—This is a project that provides you with step-by-step
    instructions for building your own Linux system, entirely from source code. There''s
    a subproject that deals with building Linux for embedded environments.


    www.yaffis.net—The home page for YAFFS.'
