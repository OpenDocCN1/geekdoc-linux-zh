  md: '# Other Application-Level Protocols


    The three protocols we''ve looked at, HTTP, SMTP, and POP3, can be useful for
    certain classes of embedded problems. There are a many other application-level
    protocols that can also be useful in other situations. Simple Network Management
    Protocol (SNMP), for example, has become the de facto standard mechanism for managing
    network resources. Virtually, every device attached to a network implements SNMP
    and your embedded devices probably should too. In an embedded scenario, SNMP can
    be used for simple monitoring and control.


    We''ve pretty much wrapped up our tour of application-level programming. In Chapter
    11 we dive down into Kernel space and have a look at the Linux kernel.


