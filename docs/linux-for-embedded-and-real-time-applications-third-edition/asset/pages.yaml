    Linux system that gives you an opportunity to play around with a new distribution
    without actually installing it. Of course, you can’t save any data or modify the
    configuration. Every time it boots it reverts to the default configuration.


    One of the options the Live CD offers to install the distribution. When you select
    this option, it runs through essentially the same installation process as you
    would with a DVD or complete set of CDs. The difference is that packages to install
    are pulled from the network rather than from physical media.


    # Installation Process


    Regardless of which scenario or installation medium you choose, the installation
    process is pretty much the same. This section describes Fedora installation, but
    other distributions have a very similar process:


    +   - Download the distribution medium (see Resources section). This will be a
    .iso file, an exact image of either a DVD or a Live CD.

    - Burn the .iso to the corresponding physical medium. You’ll need a disk-burning
    program to transfer the .iso(file) to physical media. In a virtual machine environment,
    you can mount the .iso file directly if it were a CD or a DVD.

    - Boot the computer from the installation medium or click the install icon on
    Live CD. You may have to configure your PC’s BIOS to boot from optical media.

    - Follow the instructions.


    The installation process itself is fairly straightforward. You are asked to select
    a number of common options such as language, keyboard, time zone, and so on. You’ll
    select a root password. The root user is the system administrator, also known
    as the “superuser.” More about that in the next chapter.'
