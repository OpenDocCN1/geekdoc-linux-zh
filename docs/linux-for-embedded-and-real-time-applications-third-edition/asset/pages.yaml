  md: 'To understand how branching works, we need to step back and take a closer look
    at how git stores the commits. Figure 15.6 shows the contents of a single commit.
    It consists of a commit metadata object that contains the author, committer, and
    commit comment among other things, plus a pointer to a tree object that in turn
    points to blobs representing individual objects that have changed in this commit.
    The tree and blobs constitute the snapshot that this commit represents.


    Figure 15.7 shows the situation after two commits. Each subsequent commit object
    points to its parent, from the commit from which it was created. This is how we
    recreate the complete history of the project. There are two other objects in this
    figure. Master is the name of the master branch, the one that you are currently
    working in. Every project starts with a master branch. HEAD points to the currently
    active branch. HEAD is a file in .git/


    OK, let''s create a new branch. Maybe you want to test some ideas, but don''t
    want to disturb the production code until you''ve thoroughly tested it. Try it
    with the hello-world project. Execute git branch testing by checkout testing.
    The branch command creates a new branch called testing, and the checkout command
    causes HEAD to point to the specified branch as illustrated in Figure 15.8.


    Now make a change to one of the files followed by git add and git commit. Checkout
    the master branch and make a change there. The results are depicted in Figure
    15.9. The branches have diverged. It''s important to remember that whenever you
    checkout a different branch, git restores the state of the working directory to
    the snapshot that the branch is currently pointing to.


    Eventually, you''ll reach the point where you want to merge the testing branch
    back into the master production branch. With the master branch checked out, execute
    git merge testing.


    ![](img/55fba0370caa0078213ac3714cffd0ec_256_0.png)'
