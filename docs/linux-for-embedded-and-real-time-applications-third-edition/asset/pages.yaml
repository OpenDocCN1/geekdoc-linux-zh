  md: '# The Hardware


    # The Procedure


    +   1. Connect all three cables (USB, network, serial) and the power supply to
    the board. Move the board selector switch to the NOR position, toward the edge
    of the board.


    +   2. In a Linux shell, cd to factory_images/ and execute minicom -w (-w for
    “wrap long lines”). In another shell window, cd to factory_images/ and become
    root user.


    +   3. Power up the board. Supervivi presents the menu shown in Figure 5.4. This
    appears in the window running minicom. Press “d”. The board is now waiting to
    download a file.


    +   4. In the other shell window (root user), execute ./u-boot.bin. The file downloads
    to the target board and begins execution when the download is finished. U-Boot
    is now running on the board.


    +   5. In the minicom window, execute the following two commands:


    ```

    nand scrub really erase the flash

    ```


    ```

    nand createbt create a block table

    ```


    Both of these commands require confirmation that you really want to do this. A
    1 GB flash can take up to 15 min. createbt command takes a long time.


    +   6. In the minicom window, type Ctrl-g “b” to bring up the Run script dialog
    (Figure 5.5). Type “c” and enter “set-mini-boot”. Hit the <Enter> key twice. The
    minicom script runs for a while.


    ![](img/55fba0370caa0078213ac3714cffd0ec_71_0.png)


    Figure 5.4

    Supervivi Menu.'
