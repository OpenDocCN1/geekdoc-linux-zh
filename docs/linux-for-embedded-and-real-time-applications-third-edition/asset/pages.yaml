  md: '# Source Code Control—GIT


    And then realize that nothing is perfect.

    GIT is just closer to perfect than any other SCM out there.


    Linus Torvalds


    # Background


    Source Code Control (SCC), also known as Revision Control, refers to the practice
    of storing the source code files and other artifacts of a project, such as documentation,
    in a common repository so that multiple developers can work on the project simultaneously
    without interfering with each other. SCC software maintains a record of changes
    and supports multiple versions of a project simultaneously.


    There are a number of SCC packages, both Open Source and proprietary, in widespread
    use. Most of these follow a centralized client/server model where the repositories
    reside on a central server as illustrated in Figure 15.1. Developers “check out”
    individual project files, work on them, and subsequently check them back. Most
    SCCs allow multiple developers to edit the same file at the same time. The first
    developer to check in changes to the central repository always succeeds. Many
    systems provide facilities to automatically merge subsequent changes provided
    they don’t conflict.


    Some of the better known SCM systems include:


    +   * Concurrent Versioning System (CVS)

    * BitKeeper

    * Rational Clear Case

    * Mercurial

    * Perforce

    * Subversion

    * Visual Source Safe.


    Until 2002, the kernel development community didn’t use a version control system
    (VCS). In 2002, the community began using BitKeeper, a proprietary distributed
    VCS. Subsequently, friction between the kernel developers and the BitKeeper people
    resulted in losing their free usage of the package.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# 234 Chapter 15


    ![](img/55fba0370caa0078213ac3714cffd0ec_252_0.png)


    This prompted the Linux community to develop their own tool based on lessons learned
    while using BitKeeper. The resulting system features a simple design that runs
    incredibly fast while satisfying these goals:


    +   - Speed

    - Simple design

    - Fully distributed

    - Support for “non-linear” development

    - Potentially thousands of parallel branches

    - Handles large projects such as the kernel efficiently.


    So where did the name “git” come from? Git is British slang for a stupid or unpleasant
    person. As Linux explained, “I’m an egotistical bastard, and I name all my projects
    after myself. First ‘Linux’, now ‘git’.


    # Introducing Git


    Git is a distributed VCS where clients don''t just check snapshots of files, they
    fully mirror the central repository. This is illustrated in Figure 15.2. Each
    checkout is a full backup. If the central server dies, it can be restored from
    any of the clients with little or no loss. Git is installed with the development
    tools in most modern Linux distributions.


    Figure 15.3 shows a typical sequence of git commands. You start by getting a copy
    of a project repository with the git clone command. This creates a local copy
    of the project from the currently active branch of the central repository. The
    hello-world project is 43 versions of the Hello-World program in different languages.'
  merge: -1
