    # Embedded E-mail


    To wrap up our tour of embedded networking, let''s take a quick look at how we
    might use e-mail in an embedded context. Suppose our thermostat maintains a log
    of temperatures and tracks how often the cooler comes on and for how long. We
    might want to periodically send that log for review and analysis.


    The protocol for sending e-mail is called SMTP for Simple Transfer Protocol. Like
    HTTP, it is a fairly simple ASCII-based client—server mechanism. SMTP uses a full
    duplex socket stream where the client sends commands and the server replies with
    responses numeric status codes. It is a “lock step” protocol in which every command
    gets a response.


    Listing 10.2 is a typical dialog with an SMTP server. The client entries are bolded
    and extra blank lines have been added to improve readability. When the connection
    is first established, the server introduces itself telling us a little about it.
    The client introduces itself with the HELO command, specifying a domain name.
    Note that each reply from the server begins with a three-digit code. This allows
    for straightforward automatic handling of a message dialog, yet the accompanying
    text supports human interpretation. Commands and replies are not case sensitive.


