  md: '# Configuring and Building the Kernel 173


    usr/src/arm/linux contains a standard make file, Makefile, with a very large number
    of make targets. By default, the kernel is built for the architecture on which
    the makefile is running, which in the vast majority of cases is some variant of
    the x86. In our case, we want to cross-compile the kernel for the ARM target board.


    As noted above, there is an environment variable, ARCH, which can be set to select
    the architecture to build for. This can be set on the command line that invokes
    make as:


    ```

    make ARCH = arm

    ```


    Or, what I prefer is to edit the makefile to permanently set the value of ARCH.
    Open the makefile in /usr/src/arm/linux with your favorite editor and go to line
    195, which initially reads:


    ```

    ARCH ?= $(SUBARCH)

    ```


    Change it to read:


    ```

    ARCH ?= arm

    ```


    The next line defines the variable CROSS_COMPILE. This identifies a cross-tool
    chain by specifying a prefix to be added to the tool name. Our ARM cross-tool
    chain is identified by the prefix arm-linux-. You can enter that here or, optionally,
    specify it as part of the configuration process. Save the file and exit from the
    editor.


    Now execute make help. You''ll see a very long list of make targets in several
    categories. Our specific interest at the moment is the kernel Architecture specific
    targets (arm). Under that, there are a large number of targets that end with "_defconfig.\
    These make default configuration files for various ARM-based boards. When building
    a new kernel, its always good practice to start with a known good configuration.
    In our case, that''s mini2440_defconfig. So execute:


    ```

    make mini2440_defconfig

    ```


    There''s a new file in /usr/src/arm/linux-.config.


    > 1 There''s not much point in Eclipse for configuring and building the kernel.
    We won''t be editing any source files and the kernel has its own graphical configuration
