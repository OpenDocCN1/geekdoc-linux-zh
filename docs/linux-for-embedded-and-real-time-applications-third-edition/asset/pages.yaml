    # Content Assist


    The CDT Editor has a number of features to make your coding life easier. These
    fall under the general heading of Content Assist. The basic idea of Content Assist
    is to reduce the number of keystrokes you must type by predicting what you’re
    likely to type based on the current context, scope, and prefix. Content Assist
    is invoked by typing Ctrl+Space and it’s also auto-activated when you type “.,”,
    “->”, or “:” following a struct or class name.


    # Code Templates


    Code Templates are elements of Content Assist that provide starting points for
    frequently used sections of code. When you enter a letter combination followed
    by Ctrl+Space, a list of code templates that begin with that letter combination
    is displayed. Select one and it is automatically inserted into the file at the
    current cursor location.


    Try—entering the #include lines in Figure 6.4, type “ma”Ctrl+Space. This brings
    up a template for the main() function. You can edit templates at Window>Preferences>C/C++Editor>Templates.
    Other aspects of Content Assist can also be customized under Preferences.


    # Automatic Closing


    As you note, whenever you open an opening quote (“), parenthesis ((), square ([]),
    angle bracket (<), or brace ({), the Editor automatically adds the corresponding
    closing character and positions the cursor between the two. Whatever is required
    in the enclosure and hit Enter. This positions the cursor just beyond the character.
    However, if you move the cursor out of the enclosed space, to copy and paste some
    text for example, Enter reverts it to its normal behavior of starting a new line.


    In the case of an opening brace, the closing brace is positioned according to
    the currently selected coding style and the cursor is properly indented.


    Finally, notice that as you type, appropriate entries appear in the Outline view
    identifying header files, functions, and, if we had any, global variables.'
