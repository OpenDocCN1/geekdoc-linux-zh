    # Protected Mode Architecture


    The implementation of protected memory in contemporary Intel processors first
    made its appearance in the 80386. It utilizes a full 32-bit address for an addressable
    range of 4 GB. Access is controlled such that a block of memory may be Executable,
    Read only, or Read/Write.


    The processor can operate in one of four privilege levels. A program at the highest
    privilege level, level 0, can do anything—execute I/O instructions, enable and
    disable interrupts, and modify descriptor tables. Lower privilege levels prevent
    programs from performing operations that might be “dangerous.” A word-processing
    application probably shouldn''t be messing with interrupt flags, for example.
    That''s the job of the OS.


    So application code typically runs at the lowest level while the OS runs at the
    highest. Device drivers and other services may run at the intermediate levels.
    In practice however, Linux and most OSs for Intel processors use only levels 0
    and 3. In Linux, level 0 is called “Kernel Space” while level 3 is called “User
    Space.”


    # Real Mode


    To begin our discussion of protected mode programming in the x86, it''s useful
    to review how “real” address mode works.


    Back in the late 1970s, when Intel was designing the 8086, the designers faced
    the dilemma of how to access a megabyte of address space with only 16 bits. At
    the time, a megabyte was considered an immense amount of memory. The solution
    they came up with, for better or worse, was a 20-bit (1 MB) address out of two
    16-bit quantities the Segment and Offset. Shifting the segment four bits to the
    left and adding it to the offset creates the 20-bit linear address (Figure 3.4).'
