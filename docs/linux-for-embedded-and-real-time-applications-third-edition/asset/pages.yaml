    like this: 3.1.5. The first number is the "version", in this case 3. Normally,
    this number increments when truly major architectural changes are made to the
    kernel and its APIs. The version number was 2 from 1996 until mid-2011 when Linus
    arbitrarily rolled the version to 3 in honor of the 20th anniversary of Linux.


    The second number, 1, is used to identify releases where the kernel APIs may differ
    the differences aren''t enough to justify a full version change. New releases
    appear about every 2–3 months.


    The final number, 5 in this example, represents bug and security fixes that don''t
    change the kernel APIs. Applications built to a specific release should be, in
    principle, on any security level.


    <additional_features> is a way of identifying patches to a stock kernel to support
    additional functionality. We''ve installed a stock 3.1.5 kernel and so the <additional_features>
    is null. Later on we''ll create a specific configuration of the kernel and add
    the appropriate <additional_field> features.


    The <additional_features> field is also used by the kernel developers to identify
    developmental source trees known as release candidates. Starting a stable release,
    sufficiently stable code is merged into the mainline to become the next release
    -rc1. So, for example, 3.1.5 would become 3.2-rc1. A period of 6–10 weeks of testing
    and patching ensues with the -rc number being rolled about every week. When the
    new tree is deemed sufficiently stable, the -rc is dropped and the process starts
    over again.'
