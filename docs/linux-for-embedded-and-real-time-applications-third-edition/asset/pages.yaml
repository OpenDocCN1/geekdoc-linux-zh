    # Workstation Digression


    Before we move on loading and testing our new kernel, the last two items mentioned
    deserve a passing explanation. Most workstation installations use a boot loader
    to select the specific kernel or alternate OS to boot. There''s a very good reason
    for having the ability to boot multiple kernel images. Suppose you build a new
    kernel and it fails to boot properly. You can always go back and boot a known
    working image and then try to figure out what went wrong in your new one. If you''re
    curious, have a look at /boot/grub/grub.conf on your workstation.


    Most kernels are set up to use initrd, which is for initial ramdisk. An initial
    ramdisk is a very small Linux file system loaded into RAM by the boot loader and
    mounted as the kernel boots, before the main root file system is mounted. The
    usual reason for using initrd is that some kernel modules need to be loaded before
    mounting the root partition. Usually, these modules are required to support the
    file system used by the root partition, ext3 for example, or perhaps the controller
    that the hard drive is attached to, such as SCSI or RAID.'
