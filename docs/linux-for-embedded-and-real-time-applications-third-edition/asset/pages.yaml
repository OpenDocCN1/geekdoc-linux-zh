  md: '# Chapter 5


    A cable with female connectors on both ends is normally a crossover or “null modem,”
    but the Mini2440 is configured for a straight through cable.


    Common networking problems include having Security-Enhanced Linux (SELinux)enabled
    and/or the firewall turned on. This will prevent the target from NFS mounting
    its root file system. As a starting point, disable SELinux and turn off the firewall.
    Later on you can configure either of these features to allow NFS mounting but
    still provide some level of protection.


    Make sure the IP address is correct. Double check that you''re using the right
    network cable—a crossover cable if you''re connecting directly between the target
    and workstation, or a straight through cable if you''re going through a hub or
    switch.


    # The Boot Loader


    The Mini2440 employs a two-stage boot process that we’ll explore in detail in
    Chapter 14. The last stage is an Open Source boot loader called Das U-Boot or
    just u-boot that resides in NAND flash. Press the reset button, but this quickly
    type a key or two. I usually hit the space bar.


    Instead of executing its autoboot sequence, u-boot presents its own prompt after
    printing some basic information about the board.


    Enter the command printenv to see the environment variables. There are lot of
    them. Here are some of the more significant environment variables:


    ```

    bootdelay=3

    baudrate=115200

    bootcmd=nand read 32000000 kernel 267000; bootm 32000000

    stdin=serial

    stdout=serial

    stderr=serial

    etaddr=08:08:11:18:12:27

    bootargs=console=ttySAC0,115200 root=/dev/nfs fsroot=192.168.1.2:/home/dog/

    root_qtopia ip=192.168.1.50

    ```


    Note that the two lines above are actually one in U-Boot. The default variables
    are:


    ```

    bootdelay—Seconds to wait before proceeding with autoboot.

    baudrate—For the serial port.

    bootcmd—Command executed if the autoboot sequence is interrupted.

    stdin, stdout, stderr—Direct standard file descriptors to the serial port.

    ```'
