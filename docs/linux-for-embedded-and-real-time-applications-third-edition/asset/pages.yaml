  md: '# The Host Development Environment


    When you say “I wrote a program that crashed Windows,” people just stare at you
    blankly and say “Hey, I got those with the system, for free.”


    Linus Torvalds


    In this chapter, we''ll configure our host workstation environment in preparation
    for configuring the target board in Chapter 5. The steps involved:


    +   * Installing some software from the Mini2440 DVD

    * Configuring the workstation

    * Configuring networking on the workstation


    We''ve got a lot to do in this chapter. But before we dive into that, let''s take
    a look at the cross-development environment in general.


    # Cross-Development Tools—The GNU Tool Chain


    Not only is the target limited in resources, it may be a totally different processor
    architecture from your (probably) x86-based development workstation. Thus, we
    need a cross-development tool chain that runs on the PC but may have to generate
    code for a different processor. We also need a tool that will help us debug code
    running on that (possibly different) target.


    # GCC


    By far the most used compiler in the Linux world is the GNU compiler collection
    (GCC). It was originally called the GNU C compiler but the name was changed to
    reflect its support for more than just the C language. GCC has language front
    ends for C, C++, Objective C, Fortran, Java, and Ada as well as run-time libraries
    for these languages.


    GCC also supports a wide range of target architectures in addition to the x86.
    Supported targets:


    +   * Alpha

    * ARM

    * M68000

    * MIPS'
  merge: -1
  pgno: 47
- img_proc: true
  md: '+   * PowerPC

    * SPARC


    among others. In fact, the Wikipedia article on GCC lists 43 processors and processor
    families supported by the FSF version of GCC.


    GCC can run in a number of operating environments including Linux and other variants
    of Unix. There are even versions that run DOS and Windows.


    GCC can be built on one architecture (a PC for example) while generating code
    for a different architecture (an ARM perhaps). This is the essence of code development.


    GCC is an amalgam of compiler, assembler, and linker. Individual language front
    ends translate source code into an intermediate assembly language format that
    is then assembled by a processor-specific assembler and ultimately linked into
    an executable. For a program consisting of a single C source file, the command
    to build an executable can be as simple


    ```

    gcc myprogram.c

    ```


    By default, this creates an executable called a.out. The -o option lets you do
    the obvious thing and rename the executable:


    ```

    gcc -o myprogrammyprogram.c

    ```


    If you project projects of multiple source files, the -c option tells GCC to compile
    each.


    ```

    gcc -c myprogram.c

    ```


    generates the relocatable object file myprogram.o. Later this can be linked with
    other .o files with another GCC command to produce an executable.


    Generally though, you won''t be invoking GCC directly. You''ll use a makefile
    instead.


    # Make


    Real-world projects consist of anywhere from dozens to thousands of source files.
    These files have dependencies such that if you change one file, a header for example,
    another file, a C source, needs to be recompiled and ultimately the whole project
    needs to be rebuilt. Keeping track of these dependencies and determining what
    files need to be rebuilt at any given time is the job of a powerful tool called
    the Make utility.


    In response to the shell command make, the Make utility takes its instructions
    from a file named Makefile or makefile in the current directory. This file consists
    of dependency that specify how a target file depends on one or more prerequisite
    files. If any of the'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# The Host Development Environment 53


    prerequisite files are more recent than the target, make updates the target using
    one or more construction commands that follow the dependency line. The basic syntax
    is:


    ```

    target: prerequisite-list

    <tab> construction commands

    ```


    One common mistake to watch out when writing makefiles is substituting spaces
    for the leading tab in the construction commands. It must be a tab.


    Don''t let this simple example fool you. There is a great deal of complexity and
    subtlety in the make syntax, which looks something like the shell scripting language.
    The sample code you''ll download later in the chapter has some simple examples
    of makefiles. In a later chapter, you''ll configure and build the Linux kernel,
    which has a huge, very involved


    The best way to create a javafx for a new project is to start with the one for
    an existing, similar project.


    # GDB


    GDB stands for the “GNU DeBug”. This is a powerful source-level debugging package
    that lets you see what''s going inside your program. You can step through the
    code, breakpoints, examine and change variables, and so on. Like most Linux tools,
    GDB itself is command-line driven, making it rather tedious to use. There are
    several graphical front ends for GDB that translate graphical user interface (GUI)
    commands into GDB''s text commands. Eclipse, which you''ll encounter in Chapter
    6, has an excellent graphical front end for GDB.


    GDB can be set up on a host workstation while debugging code on a separate target
    machine. The two machines can be connected via serial or network ports, or you
    can use an in-circuit emulator (ICE). Many ICE vendors provide GDB back for their
    products.


    There are also specialized debug ports built into some processor chips. These
    go by the names Joint Test Group (JTAG) and Background Debug Mode (BDM). These
    ports provide access to debug features such as hardware breakpoint registers.
    GDB back ends exist for these ports as well.


    # Install Software


    # What''s on the DVD?


    The recommended target board for the examples in the book is the Mini2440 produced
    by FriendlyARM and distributed in the United States by Industrial ARMworks. The
    resources section has links for ordering. Chapter 5 contains more details on the
    board.'
