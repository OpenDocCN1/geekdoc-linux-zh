  md: '# Build Tools


    The great thing about Object code is that it can make small, simple problems

    look like large, complex ones.


    An embedded Linux system has several major components, all of which are derived

    freely available source code and all of which may require varying levels of customization.

    These components include:


    +   - Boot loader

    - Linux kernel

    - Root file system

    - Cross-tool chain.


    In the course of this book we''ve treated these as independent elements without
    paying a lot

    of attention to where they come from, how they are constructed, or how they interact
    with

    each other.


    Taken together, these elements constitute an embedded Linux distribution. A number
    of

    embedded distributions have evolved to address the issues of building and integrating
    them

    elements. We''ll take a look at some of them in this chapter.


    # Buildroot


    Buildroot grew out of the same project that developed uClib and Busybox. uClib
    is a

    small footprint version of glib that was specifically developed for embedded Linux

    applications. It was originally developed to support uClux, the variant for Linux

    non-Memory Management Unit processors (MMU). Like most contemporary Open Source

    libraries, uClib is released under the Library General Public License (LGPL).


    Buildroot is a set of Makefiles, scripts, and patches intended to ease the process
    of building

    cross-compilation tools, root file systems, and Linux kernel images. This is a

    particularly important issue for embedded developers who are working with non-x86

    processors.


    An interesting aspect of Buildroot and other similar systems such as OpenEmbedded

    (OE) is that everything built from sources from the Internet. One consequence

    of this initial build can take a long time, typically several hours. Another feature
    is'
  merge: -1
