  md: '# U-Boot Loader and Getting Ready to Ship 227


    The make step generates several output files:


    +   - u-boot—the executable in Executable and Linkable Format (ELF) binary format,

    - U-Boot.bin—the raw binary image, suitable for writing to flash,

    - u-boot.map—map file output by the linker,

    - u-boot-nand2k.bin—binary executable added to a 2k block size,

    - u-boot-nand16k.bin—binary executable added to a 16k block size,

    - u-boot.srec—the executable in Motorola S record format.


    The make step also builds several tools using mkimage in the tools/ directory.


    # Testing a New U-Boot


    You will want to test your new U-Boot initially in RAM before burning it to flash.
    You can use a JTAG hardware debugger if you happen to have one. This is useful
    if you''ve made substantial changes and really need to test the new U-Boot because
    it''s probably the only way to use breakpoints on boot loader.


    Another approach is similar to what we did in Chapter 5 when we initially configured
    the board. This approach uses the Supermini boot loader loaded in NOR flash. Proceed
    as follows:


    +   1. Copy U-boot.bin to factory_images/

    2. Connect the target board to your workstation with a USB cable.

    3. Move the boot select switch to the NOR position and power up (or reset) the
    board.

    4. Select [d] Download and Run from the Supermini menu.

    5. In another shell, cd to factory_images/ and become a root user.

    6. Execute ./u-boot u-boot.bin.

    7. The new U-Boot image should download and start executing.


    When you''re ready to burn the new boot loader into flash, you can use either
    the new image or the one currently loaded in flash:


    +   1. Boot into the U-Boot prompt.


    +   2. nand erase u-boot.

    3. nand erase env.

    4. Move or copy u-boot.bin to /var/lib/tftboot.

    5. tftp 32000000 u-boot.bin.

    6. nand write.e 32000000 u-boot $(filesize).

    7. Reset. The new U-Boot is running.


    > ¹ This step is optional. This forces U-Boot to load the environment with default
    values. If you''re with the environment as it is, skip this step.


    > ² filesize is an environment variable that is set to the size of the last file
    downloaded to U-Boot.'
