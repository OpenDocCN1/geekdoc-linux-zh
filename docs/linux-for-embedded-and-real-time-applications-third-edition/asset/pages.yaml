    Then you make changes to the project. git add adds the changes you''ve made to
    the index in preparation for the next commit. The index holds a snapshot of the
    changes that have been added since the last commit. You can invoke git add multiple
    times between commits.

    ngit commit stores the index back to the local repository with a comment describing
    what has been changed. The -m option means a message follows. This is good for
    relatively short log messages. If you leave off the -m option, git opens $EDITOR
    which allows you to create a more detailed log message. The significant point
    is that git insists you provide a comment every time you do a commit.'
