  md: '# 106 Chapter 7


    In the Linux view, programs are “files” that must be loaded into memory before
    executing.

    Therefore, we create a ROM “file system” containing file images of whatever programs
    the system needs to run. This may include various utilities and daemons for things
    like networking. These programs are loaded into RAM by the boot initialization
    process, as needed, and they execute from there.


    Generally, the C library is not statically linked to these image files but is
    dynamically linked so that a single copy of the library can be shared by whatever
    programs are in memory at a given time.


    One of the advantages of the Linux approach is that we''re not confined to loading
    program files from the ROM file system. As just demonstrated, we can just easily
    load programs over a network for testing purposes.


