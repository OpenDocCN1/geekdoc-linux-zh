  md: '# 42 Chapter 3


    +   /lib: Contains those shared library images needed to boot the system and run
    the commands in the root file system, i.e., the binaries in /bin and /sbin. In
    Linux systems /lib has a subdirectory, /modules, that contains kernel loadable
    modules.

    /media: Mount point for removable media. When a removable medium is auto-mounted,
    the mount point is usually the name of the volume.

    /mnt: Provides a convenient optional add-in software packages. Each package has
    its own subdirectory under /opt.

    /root: Home directory for the root user. This is not a requirement of FHS but
