    # What About Wireless?


    Personally, I have not had any success configuring wireless network ports directly
    in Linux. But wireless ports do work fine in a virtual machine environment because
    the VM manager virtualizes the network interface so that it looks something else
    to the guest machine. VirtualBox for example translates any physical network interface
    to an Intel 82540EM gigabit interface.


    Having two interfaces can be very useful. You could, for example, leave the wireless
    port attached to your network getting its IP address through DHCP and reconfigure
    the Ethernet port as described above for exclusive connection to the target. For
    example, my network is 192.168.1. I plug the target board into a switch. The DHCP
    server in the router sends addresses ranging from 100 to 199. The Windows OS on
    my laptop gets its IP address from DHCP. The Linux guest has its address fixed
    by the procedure described here and everything gets along fine.'
