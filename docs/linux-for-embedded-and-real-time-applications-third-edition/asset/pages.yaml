  md: '# 222 Chapter 13


    ncurses Library


    There''s actually a higher level solution to this problem that we encountered
    briefly back in Chapter 6 in the discussion of simulation. The devices program
    makes use of the ncurses library to move the cursor in a window. ncurses can do
    lots of things like changing colors and settings fonts.


    There are a couple of reasons for not using ncurses here. Although it''s part
    of virtually every x86 Linux distribution, it is not by default part of the ARM
    toolset we''re using. It''s a useful tool and I encourage you to check it out,
    yet nevertheless, understanding the lower level API is still useful.


    ncurses is part of the GNU Library. See Resources for the Web location.


    # User Space Initialization


    We now have a useful thermostat application. The next thing we need to do is arrange
    for that application when the system is powered up. Also, we probably don''t need
    a console shell in the final product.


    Let''s say by examining the initialization process from the moment power is turned
    on until the Linux kernel starts the first user space process. There are basically
    four steps in this process.


    # Stage 1 Boot Loader


    When power is applied to the S3C2440 and the reset pin is released, execution
    begins at the location specified by the reset vector at address 0. The chip contains
    4 KB of SRAM, called the Steppingstone, mapped to address 0. When the board is
    set to boot from NAND flash, the first 4 KB of NAND are copied to the Steppingstone
    before execution begins. This code does very low-level initialization of things
    chip select lines, clocks, and RAM. Basically, the minimum needed to run the processor
    and access RAM. Then it copies Uboot from Flash to DRAM and starts executing.


    # U-Boot


    The U-boot loader continues the initialization process by initializing the peripherals
    it needs, typically the serial port, network, and maybe USB. Then, if the auto-boot
    sequence is not interrupted, it will usually copy the kernel from Flash to RAM
    and starts executing.'
  merge: -1
