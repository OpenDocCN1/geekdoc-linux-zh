  md: '# # Appendix B: Why Software Should Not Have Owners


    Digital information technology contributes to the world by making it easier to
    copy and modify information. Computers promise to make this easier for all of
    us.


    Not everyone wants it to be easier. The system of copyright gives software programs
    “owners”, most of whom wish to withhold software’s potential benefit from the
    rest of the public. They would like to be the only ones who can copy and modify
    the software that we use.


    The copyright system grew up with printing—a technology for mass production copying.
    Copyright fit in well with this because it restricted only the mass producers
    of copies. It did not take freedom away from readers of books. An ordinary reader,
    who did not own a printing press, could copy books with only pen and ink, and
    few readers were suited for that.


    Digital technology is more flexible than the printing press: when information
    has digital form, you can easily copy it to share with others. This flexibility
    makes a bad fit with a system like copyright. That’s the reason for the increasingly
    nasty and draconian measures we need to enforce software copyright. Consider these
    four practices of the Software Publishers Association (SPA):


    +   * Massive propaganda saying it is wrong to disobey the owners to help your
    friend.

    * Solicitation for stolen pigs to inform on their coworkers and colleagues.

    * Raids (with police) on offices and schools, in which people are told they must
    prove they are innocent of illegal copying.

    * Prosecution (by the US government, the SPA’s request) of people such as MIT’s
    David LaMacchia, not copying software (he is not accused of copying any), but
    merely for leaving copying facilities unguarded and to censor their use.


    All four practices resemble those in the former Soviet Union, where every copying
    machine had a guard to prevent forbidden copying, and where individuals had to
    copy information secretly and pass it from hand to hand as “samizdat”. There is
    of course a difference: the motive for information control in the Soviet Union
    was political; but it is the actions that affect us, not the motive. Any attempt
    to block the sharing of information, no matter why, leads to the same methods
    and the same harshness.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# Appendix B


    Owners make several kinds of arguments for giving them the power to control how
    we use information:


    +   - Name calling.

    Owners smear words such as "piracy" and "theft", as well as expert terminology
    such as "intellectual property" and "damage", to suggest a certain line of thinking
    to the simplistic analogy between programs and physical objects.

    Our ideas and intuitions about property for material objects are about whether
    it is right to take an object away from someone else. They don''t directly apply
    to making a copy of something. But the owners ask us to apply them anyway.

    - Exaggeration.

    Owners say they suffer "harm" or "economic loss" when users use programs themselves.
    The copying has no direct effect on the owner, and it has none. The owner can
    lose only if the person who made the copy would otherwise have paid for it from
    the owner.

    A little shows that most people would not bought copies. Yet the owners compute
    their "losses" as if each and every one would have bought a copy. That is exaggeration—to
    put kindly.

    - The law.

    Owners often describe the current state of the law, and the harsh penalties they
    threaten us with. Implicit in this approach is the suggestion that today''s law
    reflects an unquestionable view of morality—yet at the same time, we are urged
    to regard these penalties as facts of nature that cannot be blamed on anyone.

    This line of persuasion is not designed to stand up to critical thinking; it''s
    intended to reinforce a habitual mental pathway.

    It''s elementary that laws do not decide right and wrong. Every American should
    know that, years ago, was against the law in many states for a black person to
    sit in the front of a bus; but only racists would say sitting there was wrong.

    - Natural rights.

    Authors claim a special connection with programs they have written, and go on
    assert that, as a result, their desires and interests connecting the program simply
    outweigh those of anyone else—or even those of the rest of the world. (Typically
    companies, not authors, hold the copyrights on software, but we are expected to
    ignore this discrepancy).

    To those who propose this as an ethical axiom—the author is more important than
    you—I can say I, a notable software author, call it bunk.

    But people in general are only likely to feel any sympathy with the natural rights
    claims for two reasons.'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# Why Software Should Not Have Owners 267


    One reason is an stretched analogy with material objects. When I cook spaghetti,
    I do object if someone eats it, because then I cannot eat it. His action hurts
    as much as it benefits him; only one of us can eat the spaghetti, so the question
    is, which? The smallest distinction between us is enough to tip the ethical balance.


    But however you run or change a program I affects you directly and me only indirectly.
    Whether you give a copy to your friend affects you and your friend much more than
    it affects me. I shouldn''t have the power to tell you not to do these things.
    No one should.


    The second reason is that people have been told that natural rights for authors
    are the accepted and unquestioned tradition of our society.


    As a matter of history, the opposite is true. The idea of natural rights of authors
    was proposed and decisively rejected when the US Constitution was drawn. That''s
    why the Constitution permits a system of copyright and does not require one; that''s
    why that copyright may be temporary. It also states that the purpose of copyright
    is to promote progress—not to reward authors. Copyright does reward authors somewhat,
    and publishers more, but that is intended as a means of modifying their behavior.


    The real established tradition of our society is that copyright cuts into the
    natural rights of the public—and that can only be justified for the public''s
    sake.


    +   - Economics.

    The final argument made for having owners of software is that this leads to production
    of more software.

    Unlike the others, this argument lasts a legitimate approach to the subject. It
    is based on a valid goal—satisfying the users of software. And it is empirically
    clear that people will produce more of something if they are well paid for doing
    so. But the economic argument has a flaw: it is based on the assumption that the
    difference is only a matter of how much money we pay for. It assumes that "production
    of software" is what we want, whether the software has owners or not. People easily
    accept this assumption it accords with our experiences with material objects.
    Consider a sandwich, for instance. You might well be able to get an equivalent
    sandwich either free or for a price. If so, the amount you pay is the only difference.
    Whether or not you have to buy it, the sandwich has the same taste, the same nutritional
    value, and in each case you can only eat it once. Whether you get the sandwich
    from an owner or cannot directly affect anything but the amount of money you have
    afterwards.


    This is true for any kind of material object—whether or not it has an owner does
    not directly affect what it is, or what you can do if you acquire it.


    But if a program has an owner, this very much affects what it is, and what you
    can do with a copy if you buy one. The difference is not just a matter of money.'
