    should work fine. You will also need a network interface. We’ll use a combination
    of serial and network ports to communicate with the target as well as debug target
    code.


    # Installation Scenarios


    The next decision then is how you want to install Linux. There are basically three
    installation scenarios.


    # Stand-Alone


    This is the obvious choice if you can dedicate a machine to Linux. You will let
    the installation process format the entire disk.


    # Dual-Booting


    In many cases, you’ll probably want to install Linux on a machine that already
    runs some variant of Windows. There are a couple of approaches to that. This section
    describes dual-booting, and the next one describes virtualization.


    In the dual-boot scenario, you select at boot time which OS to boot. That OS takes
    full control of the machine. The Linux installation will replace the standard
    Windows boot loader with GRUB, the Grand Unified Boot loader. GRUB then offers
    the option of selecting the OS to boot as shown in Figure 2.1.


    While dual- booting has been the most popular installation scenario for average
    users, it’s the most complicated because it requires reconfiguring your hard disk.
    The most common case is that you already have a version of Windows installed on
    the machine and you want to add Linux.


    At this point, Windows probably occupies the entire disk and so you have to make
    space available for Linux. Fundamentally, this requires reducing the size of the
    disk partition holding Windows so you can create unallocated space for Linux.
    Remember, that you’ll need on the order of 20 GB of disk space for Linux, so your
    disk must have at least contiguous free space. You can use the Windows defragmentation
    tool to put all free space at the “end” of the disk.'
