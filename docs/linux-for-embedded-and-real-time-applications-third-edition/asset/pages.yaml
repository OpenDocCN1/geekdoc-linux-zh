  md: '# 218 Chapter 13


    This is a known problem resulting from an update to make syntax. I could tell
    you how to fix it, but at this point it''s probably more useful if you do the
    appropriate Google searches and fix it yourself.


    Following make you''ll find several new files in the top-level BusyBox directory
    starting with “busybox”. One of them is the actual executable, busybox. Next,
    execute make install, which will copy the busybox executable and all of the links
    to the destination you specified during configuration. That''s it, BusyBox is
    ready to go.


    # Hard vs. Soft Links


    Back in Chapter 3, we briefly discussed the idea of “links,” entries in the file
    system that just point to other files, without considering the distinction between
    hard links vs soft or symbolic links.


    Try this. In a shell window on your workstation go to ~/target_fs/home/src/led,
    Execute these commands:


    ```

    ln led.c led2.c

    ln -s led.c led3.c

    ls -l

    stat led.c

    stat led2.c

    stat led3.c

    ```


    What do you notice? In particular, note the reference counts, the number just
    after the permissions field, and the file sizes. led3.c is identified as a link
    that points to led.c. Its length is S, the size of the file name it is pointing
    to. By contrast, led2.c and led.c have the same name and a reference count of
    2 whereas else has a reference count of 1. The stat tells us what inode represents
    each of the files. The thing to notice is that led.c and led2.c share the same
    inode, but led3.c has a different inode.


    Now do this:


    ```

    rm led.c

    ls -l

    ```


    On Fedora 14, the entry for led3.c is highlighted to show that the file it points
    to doesn''t exist. The reference count for led2.c is now 1.


    Finally, rename led2.c as led.c:


    ```

    mv led.c led2.c

    ls -l

    ```


    The led3.c entry is once again pointing at a valid entry.


    The point of this exercise is that hard links are alternate names, or aliases
    if you will, for the same data. They all point to the same data blocks on the
    disk. That data can''t be deleted'
