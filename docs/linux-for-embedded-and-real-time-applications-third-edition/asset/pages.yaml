    IDEs are a great tool for improving productivity. Desktop developers have been
    using them for years. Perhaps the most common example is Microsoft''s Visual Studio
    environment. In the past, a number of embedded tool vendors have built their own
    proprietary IDEs.


    In the Open Source world, the IDE of choice is Eclipse, also known as the Eclipse
    Platform and sometimes just the Platform. The project was started by Object Technology
    International (OTI), which was subsequently purchased by IBM. In late 2001, IBM
    and several partners formed an association to promote and develop Eclipse as an
    Open Source project. It is now maintained by the Eclipse Foundation, a non-profit
    consortium of software industry vendors. Several embedded Linux vendors such as
    Monte Vista, TimeSys, LinuxWorks, and Wind River Systems have embraced Eclipse
    as the basis for their future IDE development.


    I would go so far as say that Eclipse is the most professional, well-run Open
    Source project out there. Every year for about the past 6 years, in the middle
    of June, the foundation publishes a major release of the platform and most of
    the related projects, amounting to something like 20–30 million lines of code.
    Until 2011, these releases were named after the moons of Jupiter in alphabetical
    order. The 2010 release was called Helios. The 2011 release broke with that tradition
    and is called Indigo.


    It should be noted that Eclipse is not confined to running under Linux. It runs
    just as well under various Windows OS.


    Portions of this chapter are adapted from Eclipse Platform Technical Overview,
