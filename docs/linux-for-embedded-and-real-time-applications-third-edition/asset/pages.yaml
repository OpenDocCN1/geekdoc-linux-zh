  md: '# xvi Preface


    Needless to say, Linux has come a long way in 20 years. The original release,
    version 0.01 released on September 17, 1991, consisted of 88 files adding up to
    278 KB.

    A contemporary Linux release close to 40,000 files taking up 400 plus MB. Literally,
    thousands of programmers all over the planet are engaged in Linux development
    in one way or another.


    Much has happened in the Linux world since the second edition of this book was
    published in 2006, which of course is the motivation for a new edition. The kernel
    continues to evolve and improve having recently been rolled to version 3.0 in
    honor of the 20th anniversary. Google introduced the Android variant in late 2007.
    In August of 2011, it was estimated that Android had a 48% share of the smart
    phone market with over 500,000 devices being activated every day!


    I began the preface to the first edition by confessing that I''ve never liked
    Unix, considering it deliberately obscure and difficult to use. Initially, Linux
    did little to change impression and I still have some of a love/hate relationship
    with the thing.


    But, while Linux is still slowly getting ready for prime time in the world of
    desktop computing, it has achieved notable success in the embedded space where
    I work and in the world of network servers. In 2007, LinuxDevices.com reported
    Linux being used in just 50% of embedded projects and/or products with projections
    of up to 70% by 2012. Even Microsoft admits that Linux runs 60% of the world''s
    web servers vs. 40% running Windows servers.


    Linux is indeed complex and, unless you''re already a Unix guru, the learning
    curve is quite steep. Information is out there on the web but it is often easier
    to find readable. There are probably hundreds of books in print on Linux covering
    every aspect from beginners'' guides discussing the internal workings of the kernel.
    But there are now even a number of books discussing Linux in the embedded and
    real-time space.


    I decided to climb the Linux learning curve partly because I was intrigued by
    the Open Source development model. The idea of programmers all over the world
    contributing to the development of a highly sophisticated operating system for
    the fun of it is mind-boggling. Having the complete source code not only allows
    you to modify it to your heart''s content but also allows you (in principle least)
    to understand how the code works.


    Open Source has the potential to be a major paradigm shift in how our society
    conducts business because it demonstrates that cooperation can be as useful in
    developing solutions to problems as competition. And while I doubt that anyone
    is getting fabulously wealthy out of Linux, a number of companies have demonstrated
    that it''s possible to build a viable business model around it.'
