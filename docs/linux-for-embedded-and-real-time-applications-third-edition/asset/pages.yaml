    | THREAD 1 | THREAD 2 | THREAD 3 |


    Figure 3.7

    Processes vs. Threads.


    RTOS vendors now offer protected mode versions of their systems that look like
    the Linux process model.


    # The fork() Function


    Linux starts life with one process, the init process, is created at boot time.
    Every other process in the system is created by invoking fork(). The process calling
    fork() is termed the parent and the newly created process is the child. So every
    process has ancestors and may have descendants depending on who created who.


    If you''ve grown up with multitasking OSs where tasks are created from functions
    by a task creation service, the fork process may seem downright bizarre. fork()
    creates a copy of the parent process—code, data, file descriptors, and other resources
    the parent may currently hold. This could add up to megabytes of memory space
    to copy. To avoid copying a lot of stuff that may be overwritten anyway, Linux
    employs a copy-on-write strategy.


    fork() begins making a copy of the process data structure and giving it a new
    process identifier (PID) for the child process. Then, it makes a new copy of the
    Page Directory and Page Tables. Initially, the PTEs all point to the same physical
    pages as the parent process. All pages for both processes are set to read only.
    When one of the processes tries to write, that causes a page fault, which in turn
    Linux to allocate a new page for that process and copy over the contents of the
    existing page.'
