  md: '# 174 Chapter 11


    # Patching the Kernel


    Before we get on actually configuring and building the kernel, there’s one more
    hoop we have to jump through in our particular situation. This gives us an opportunity
    to look at the notion of “patching” Open Source code trees.


    It turns out YAFFS, the file system that’s used on the target board’s NAND flash
    is not incorporated into the mainline kernel source. This is apparently a licensing
    issue. Although YAFFS is released under the GPL, its copyright owner, a British
    company, Aleph One, retains the right to charge for a license under certain circumstances.
    This is enough to keep YAFFS out of the truly free kernel.


    Aleph One provides a zipped tar for YAFFS including a script that installs it
    in a kernel source tree. But since my objective is to introduce the patch mechanism,
    I chose to execute its script against the “vanilla” (unmodified) 3.1.5 kernel
    source from kernel.org and then create a patch.


    The mechanism for changing released source code in an orderly manner is the patch
    utility. The input to patch is a text file created by the diff utility that compares
    two files and reports differences. If an Open Source manager wants to upgrade
    to source code, he or she does between the modified code and the original code
    redirecting the output of diff to a patch file.


    In this case created two kernel source trees from linux-3.1.5.tar.bz2 and renamed
    the first linux-3.1.5-orig/, I executed Aleph One’s script on the other source
    tree and then from /usr/src/arm, I executed:


    ```

    diff -upr linux-3.1.5-orig linux>yaffs.patch

    ```


    to create an appropriate patch file, yaffs.patch see the diff man to learn what
    the various options represent. Copy (move) that file from factory_images/ to /usr/src/arm/
    linux and execute:


    ```

    patch -p1 yaffs.patch

    ```


    Note that patch normally takes its input from stdin, so we have to redirect the
    input to the file. -pl tells patch to remove one situation and everything before
    it from the names of files to be patched. This recognizes the usual situation
    that the root directory from which the patch was created is not the same as the
    directory in which we’re applying it. Removing everything in the path before the
    first clash makes the directories relative.


    Everything necessary to support YAFFS is now added to the kernel source tree.


    This patch also installs the mini2440_* drivers that the Posix and layer thermostat
    examples along with a revised .config file. The default configuration leaves a
    lot of things'
