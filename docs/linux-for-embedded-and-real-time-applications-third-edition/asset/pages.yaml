  md: '# 64 Chapter 4


    As name implies, TFTP is a simple protocol for file transfer that can be implemented
    in a relatively small amount of memory. As such, it is useful for things like
    booting devices that have no local storage. It uses UDP datagrams and provides
    its own simplified session and transport mechanisms. No authentication or encryption
    mechanisms are provided, so it shouldn’t be used in situations where security
    is a concern.


    The workstation will serve as our TFTP server just as it provides the NFS server
    function. Some distributions do not install the TFTP server by default and so
    you must install it yourself. Just as we did earlier with minicom, Fedora users
    can execute `apt-get install ttfp-server.


    TFTP is one of several network protocols managed by xinetd, the xExtended Internet
    Daemon access control mechanisms as TCP Wrapper ACLs, extensive logging capabilities,
    and the ability to make services available based on time. It can place limits
    on the number of servers that the system can start, and has deployable mechanisms
    to protect against port scanners, among others.


    Once installed, TFTP needs to be enabled. There are two ways to accomplish this.
    You can fire up the Service Configuration dialog like we did for NFS. Scroll down
    to tftp and enable it. Then scroll down and make sure xinetd is running. The other
    approach is to edit the file `/etc/xinetd/tftp`. You’ll need to be root to save
    any changes. Find the line that starts “disable = ” and change “yes” to “no.”


    While you’re in this file, also note the line that starts “server_args =\ ”. The
    argument for this line is the default directory for TFTP transfers. Currently,
    in Fedora it is /var/lib/tftpboot. Any files you need to download to the target
    board over TFTP need to be copied to this directory. This directory is owned by
    root and not writable by the world. So you need to make it writable by everyone
    by executing, as root user:


    ```

    chmod 777 /var/lib/tftpboot

    ```


    We have almost everything we need on the host workstation for embedded development.
    In Chapter 5, we’ll focus on configuring the target embedded board that we’ll
    use for application development. Following that we’ll install an integrated development
    environment (IDE) that will make application development a more productive.


