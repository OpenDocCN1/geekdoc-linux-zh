    ```

    service nfs stop

    ```


    Check the status with:


    ```

    service nfs status

    ```


    Look in /etc/init.d to see that there is a script file named nfs. Have a look
    at the file to see how it works.


    # Trivial File Transfer Protocol


    The last item of business for this chapter is installing (if necessary) and enabling
    the trivial file transfer protocol (TFTP). We''ll use that in Chapter 5 for downloading
    some images to the target board''s boot loader and later when building a new Linux
    kernel.'
