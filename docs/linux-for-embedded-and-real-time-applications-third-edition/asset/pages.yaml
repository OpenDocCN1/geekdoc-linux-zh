    the Mini2440.

    riendlyarm.net—Chinese manufacturer of the Mini2440. There is an extensive download
    page, but much of the useful stuff is already on the DVD. The sales page has a
    list of distributors worldwide.

    Meckenburg, Robert, Managing Project with GNU Make, third Ed., O’Reilly, 2005.
    This is the bible when you’re ready to fully understand and exploit the power
    of make.'
