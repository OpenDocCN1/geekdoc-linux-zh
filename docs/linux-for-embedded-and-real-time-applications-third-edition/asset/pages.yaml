  md: "# Linux Kernel\n\nIf the kernel is a compressed image, it uncompresses itself\
    \ into the appropriate location in RAM. Then it initializes all of the kernel\
    \ subsystems as memory management and drivers for all of the peripheral devices\
    \ in the system. To some extent, this may duplicate the initialization done by\
    \ U-boot, but of course the kernel has no idea what U-boot did and so initialize\
    \ the devices to suit its own requirements. During the initialization process,\
    \ the kernel spews out a large number of messages describing what it is doing.\n\
    \nNext, it mounts the root file system. Up to this point the kernel has been running\
    \ in kernel space. Finally, it starts the init process, which makes the transition\
    \ to user space.\n\n# Init Process\n\ninit is always the first process that the\
    \ kernel starts and its job is to get everything up and running properly.\n\n\
    The init executable is typically /sbin/init although there are several alternative\
    \ locations that the kernel will search. In the case of our target board, /sbin/init,\
    \ like virtually every other executable, is simply a link back to BusyBox.\n\n\
    init gets its instructions from the file /etc/initabb. Take a look at target_fs/etc/initabb.\
    \ The comments on the top give a pretty good idea of what's going on. Each entry\
    \ has four fields separated by colons:\n\n```\n<runlevel>:<action>:process\n```\n\
    \n| id | tty connected to the process. NULL if the process doesn't use a console.\
    \ |\n runlevel | Ignored by BusyBox. |\n action | One of the ways init will treat\
    \ the process. |\n process | Program to run including arguments if any. |\n\n\
    The allowable actions are:\n\n| once | Execute the process once. |\n wait | Execute\
    \ the process once. Init waits until the process terminates. |\n askfirst | Ask\
    \ the user if this process should be run. |\n sysinit | These processes are executed\
    \ before anything else executes. |\n respawn | Restart the process whenever it\
    \ terminates. |\n restart | Like respawn. |\n shutdown | Execute these processes\
    \ when the system is shutting down. |\n ctrlltdel | Execute this when init receives\
    \ a SIGINT signal, meaning the operator presses\n CTRL-ALT-DEL. |\n\nNote that\
    \ the sysinit action in this case is to execute the rc script."
