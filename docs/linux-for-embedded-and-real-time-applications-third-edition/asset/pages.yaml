    # Paging


    Paging is the mechanism that allows each task to pretend that it owns a very large
    flat address space. That space is broken down into 4 KB pages. Only the pages
    currently being accessed are kept in memory. The others remain on disk.


    As shown in Figure 3.6, paging adds another level of indirection. The 32-bit linear
    address derived from the selector and offset is divided into three fields. The
    high-order 12 bits serve as an index into the Page Directory. The Page Directory
    Entry (PDE) points to a Page Table. The next 10 bits in the linear address provide
    an index into that table. The Page Table Entry (PTE) provides the base address
    of a 4 KB page in physical memory called a Page Frame. The low-order 12 bits of
    the original linear address supplies the offset into the page frame. Each task
    has its own Page Directory pointed to processor control register CR3.


    At either stage of this lookup process, it may turn out that the Page Table or
    the Page Frame is not present in physical memory. This causes a Page Fault, which
    in turn causes the OS to find the corresponding page on disk and load it into
    an available page in memory. This in turn may require “swapping out” the page
    that currently occupies memory.


    A further advantage of paging is that it allows multiple tasks or processes to
    easily share code and data by simply mapping the appropriate sections of their
    individual address spaces into the same physical pages.


    Paging is optional, you don''t have to use it, although Linux does. Paging is
    controlled by a bit in processor register CR0.


