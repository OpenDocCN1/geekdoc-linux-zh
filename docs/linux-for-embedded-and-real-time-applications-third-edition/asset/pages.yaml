    # Configuring the Kernel—make config, menuconfig, xconfig


    The process of building a kernel begins by invoking one of the three make targets
    that carry out the configuration process. make config starts a text-based script
    that sequentially steps you through each configuration option. For each option
    you have either three or four choices. The three choices are: “y” (yes), “n” (no)
    and “?” (ask for help). The default choice is shown in upper case.


    Some options have a fourth choice, “m”, which means this feature is a loadable
    kernel module rather than building it into the kernel image. Kernel modules are
    a way of dynamically extending the kernel and are particularly useful for things
    like device drivers. The next chapter goes into modules in some detail.


    Figure 11.2 shows an example from the make config dialog.


