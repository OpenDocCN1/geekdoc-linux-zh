    # The Kernel Source Tree


    Needless to say, the kernel encompasses a very large number of files—C sources,
    headers, makefiles, scripts, scripts, etc. Version 3.1.5 has files taking up 317
    MB. So not surprisingly, there''s a standard directory structure to organize these
    files in a manageable fashion. Figure 11.1 shows the kernel source tree starting
    at `/usr/src/arm/linux`. The directories are as follows:


    Documentation—Pretty self-explanatory. This is a collection of text files describing
    various aspects of the kernel, problems, "gotchas," and so on. There are many
    subdirectories under Documentation for topics that require more extensive explanations.
    While the information here is generally useful, it also tends to be dated. That
    is, the documentation was initially written when a particular feature was added
    to the kernel, but it has not been kept up as the feature has evolved.


