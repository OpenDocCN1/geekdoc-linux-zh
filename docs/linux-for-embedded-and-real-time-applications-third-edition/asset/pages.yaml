  md: '# Chapter 1


    was to address the problem of “tivoization,” a term coined by Richard Stallman,
    founder of the FSF. It turns out that TiVo will only run code with an authorized
    digital signature. So even though TiVo makes the source code available in compliance
    with the GPL, modifications to code won’t run.


    Stallman considers this circumventing the spirit of the GPL. Other developers,
    including Linus Torvalds, see digital signatures as a useful security tool and
    wouldn’t want to ban them outright. The debate continues. In any case, the kernel
    itself is unlikely to move up to version 3 anytime soon.


    # Legal Issues


    Considerable FUD⁴ has been generated about the legal implications of Open Source,
    particularly in light of SCO’s claims that the Linux is “contaminated” with its
    proprietary Unix code. The SCO Group, formerly known as Santa Cruz Operations,
    acquired the rights to the Unix V source code from Novell in 1996, although there
    is some dispute as to what SCO bought from Novell. In any case, SCO asserted that
    IBM introduced pieces of SCO’s copyrighted, proprietary Unix code into the Linux
    kernel and is demanding fees from Linux users as a consequence.


    Ultimately, SCO’s case collapsed and the company filed for Chapter 11 bankruptcy
    in 2007. But all of a sudden there is serious money to be made by fighting over
    Open Source licensing issues. The upset is that embedded developers need to be
    aware of license issues surrounding both Open Source and proprietary software.
    Of necessity, embedded software is often intimately tied to the OS and elements
    derived or acquired from other sources. While no one expects developers to be
    intellectual property attorneys, it is nevertheless essential to understand the
    license terms of the software you use and create to be sure that all the elements
    “play nicely” together.


    And the issue cuts ways. There are also efforts to identify violations of the
    GPL. The intent here is not to make money but to defend the integrity of the GPL
    by putting pressure on violators to clean up their act. In particular, the GPL
    Violations Project has “outed” a dozen or so embedded vendors who appear to have
    played fast and loose with the GPL terms. According to Harald Welte, founder of
    the GPL Project, the most common offenders are networking devices such as routers,
    followed by set-top boxes, and vehicle navigation systems.


    Open Source licensing expert Bruce Perens has observed that embedded developers
    seem to have a mindset that “this is embedded, no one can change the source—so
    the GPL must not really apply to us.” It does.


    > ⁴ Fear, Uncertainty, and Doubt.'
