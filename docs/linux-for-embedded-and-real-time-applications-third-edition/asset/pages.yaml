  md: '# 228 Chapter 14


    # “JTAGing” the NOR


    OK, let''s say your NOR flash hosed. What do you do then? Well, the NOR flash
    can be reprogrammed through the board''s JTAG port.


    Part of the Mini2440 kit is a device called a JTAG “wiggler” that plugs into a
    PC''s parallel port and connects to the 10-pin flat JTAG port on the board. Note
    that a USB to parallel port converter won''t work; it has to be a native parallel
    port. Directory H-JTAG/ on the kit CD contains a Windows-based application to
