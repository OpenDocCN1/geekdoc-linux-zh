  md: "# U-Boot Boot Loader and Getting Ready to Ship 231\n\nIn fact, the problem\
    \ is more than just the flash partitions. There's a whole host of hardware information\
    \ that's shared between the boot loader and the kernel:\n\n+   * RAM—size and\
    \ location\n* Peripherals:\n    * Ethernet\n    * Console\n\nFDT, also known as\
    \ the Device Tree Blob, device tree binary, or just device tree, provides a mechanism\
    \ to communicate that information to both the boot loader and the kernel. The\
    \ FDT is derived from IBM's Open Firmware specification and is a database to represent\
    \ the low-level hardware details of a board.\n\nA representation of the hardware\
    \ is created in a file with the extension .dtts. A special compiler, dtc, converts\
    \ the tree to a binary representation, a “blob,” that is loaded into memory along\
    \ with the kernel, which translates the information to an internal representation\
    \ used by device drivers to identify hardware resources.\n\nThe device tree consists\
    \ of nodes representing devices or buses. Each node contains properties, name_value\
    \ pairs that give information about the device. The values are arbitrary byte\
    \ strings, and for some properties, they contain tables or other structured information.\
    \ We won't go into detail on the syntax here. See the Resources section for references.\n\
    \nThe FDT concept evolved in the PowerPC branch of the kernel and that's where\
    \ it seems to be the most. In fact, it is a requirement that all PowerPC platforms\
    \ pass a device tree to the kernel at boot time. The .dtts files are typically\
    \ found in the source tree at at arch/boot/dtts. The powerpc/ branch has 145 .dtts\
    \ files while the arm/ branch has eight. To get a feel for the syntax, look at\
    \ one of the files in arm/boot/dtts.\n\nDevice tree support has to be built into\
    \ both the kernel and U-Boot. U-Boot has a couple of configuration variables CONFIG_OF_FDT\
    \ and CONFIG_OF_BOARD_SETUP to enable device tree support. The kernel uses CONFIG_DTC\
    \ and CONFIG_OF. Neither of these is user-selectable. They're on if the implementation\
    \ supports device trees or otherwise.\n\nThe boot process is a little different\
    \ when device tree support is enabled in U-Boot. You must load the kernel image\
    \ and a compiled device tree into RAM. The boot syntax changes to:\n\n```\nbootm<kernel_address>..<fdt_address>\n\
    ```\n\nThe <fdt_address> is typically passed in a processor register when control\
    \ is transferred to the <kernel_address>."
