  md: '# Linux Device Drivers


    Posix Threads 145


    We''re going to introduce another Linux “feature” with this exercise. Instead
    of accessing

    t I/O ports directly from User space, we''ll make use of Kernel space device drivers
    that

    further isolate us from the hardware. Here we focus on using drivers from User
    space.

    Chapter 12 we''ll look at the drivers themselves.


    While other OSs treat devices as files, “sort of,” Linux goes one step further
    in actually

    creating a directory for devices. This is typically /dev. One consequence of this
    is that the

    redirection mechanism can be applied to devices as easily as to files.


    Devices come in “flavors”: Character, Block, Pipe, and Network. The principal

    distinction between character and block is that the latter, such as disks, are
    randomly

    accessible, i.e., you can move back and forth within a stream of characters. With
    character

    devices, the stream generally moves in one direction only. Block devices are accessed

    through a file system whereas character devices are accessed directly. In both
    cases, I/O

    data are viewed as a “stream” of bytes.


    Pipes are pseudodevices establish unidirectional links between processes. Process

    writes into one end of the pipe and another process reads from the other.


    Network devices are different in that they handle “packets” of data for multiple
    protocol

    clients rather than a “stream” of data for a single client. This necessitates
    a different

    interface between the kernel and the device driver. Network devices are not nodes
    in the

    /dev directory.


    From here on out we''ll only be dealing with character devices.


    # The Low Level I/O API


    The set of User Space system functions closest to the device drivers is termed
    “low level I/

    .” For the kind of device we''re dealing with in this chapter, low level I/O is
    probably

    most useful because the calls are inherently synchronous. That is, the call doesn’t
    return

    til the data transfer has completed.


    ```

    int open(const char *path, int flags);

    int open(const char *path, int flags, mode_t mode);

    size_t read(int fileied, void *buf, size_t count);

    size_t write(int fileied, void *buf, size_t count);

    int close(int fileied);

    int ioctl(int fileied, int cmd, ...);

    ```


    The box shows the basic elements of the low level I/O API.'
