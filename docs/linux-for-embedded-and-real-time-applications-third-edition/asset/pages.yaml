    A common solution to this problem is to temporarily raise the priority of Thread
    2 to that as soon as Thread 1 pends on the mutex. Now Thread 2 can''t be preempted
    by anything of lower priority than Thread 1. This is called priority inheritance.


    Another approach, called priority ceiling, raises the priority of Thread 2 to
    a specified value higher than that of any task that may pend on the mutex as Thread
    2 gets the mutex. This is considered to be more efficient because it eliminates
    unnecessary context switches. Thread needing the resource can preempt the thread
    currently holding it.


