  md: '# 206 Chapter 12


    Virtually, all useful OSs split interrupt handling into two parts. The first part
    is the ISR itself responds directly to the interrupt. At the very least, the ISR
    needs to clear the interrupt flag and probably read or write some data. That’s
    all it should do. If there''s more work to do, processing a network packet for
    example, that should be deferred to some time later it''s more “convenient” for
    the system.


    In Linux, these two parts are called the “top half” and the “bottom half”. The
    bottom half mechanism has undergone extensive revision and upgrade over the years
    and, in fact, the original bottom half mechanism is deprecated in the 2.6 series.
    The two strategies currently available for bottom half processing are taskslets
    and workqueues.


    A tasklet is a simple function taking a long argument that is scheduled to run
    at some time in the future. It executes in “soft interrupt” context meaning interrupts
    are enabled and it must strictly observe the rules of ISRs.


    Workqueues are very much like tasklets except that they operate in the context
    of a dedicated “kernel thread”. This means, among others, that the workqueue function
    can sleep. The function does not execute atomically.


    ```

    simple_int can implement either top half/bottom half paradigm using a pair of
    parameters. Alternate interrupt handlers are registered when either wo or tasklet
    are set non-zero.

    ```


    The “top half” interrupt handler writes a binary timestamp, two long words, to
    a circular buffer and invokes the bottom half, which happens to be the same function
    for both the tasklet and workqueue versions. Writing a timestamp is clearer than
    formatting and writing ASCII text.


    The handler increments a counter to know how many times it fired before the bottom
    half got to execute.


    The bottom half function, do_bottom_half() at line 200, first reads and resets
    the interrupt count. It formats the count and writes it to a text buffer. Next,
    whatever is in the binary timestamp buffer, formats as that, and writes to the
    text buffer. Finally, it wakes up the reader function. Figure 12.5 depicts this
    graphically.


    # Try it Out


    +   - rmmod simple_int

    - insmod_simple_int.ko tasklet=1

    - echo "a string of text">/dev/port0

    - cat /dev/port0

    - rmmod simple_int'
