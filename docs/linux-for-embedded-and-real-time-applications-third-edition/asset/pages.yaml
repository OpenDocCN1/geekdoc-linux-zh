  md: '# 146 Chapter 9


    +   OPEN. Establishes a connection between the calling process and the file or
    device. path is the directory entry to be opened. In the case of a peripheral
    device, it is usually an entry in the /dev directory. flags is a bitwise set of
    flags specifying access mode and must include one of the following:


    +   O_RDONLY Open for read-only.


    +   O_WRONLY Open for write-only.


    +   O_RDWR Open for both reading and writing.


    Additionally flags may include one or more of the following modes:


    +   O_APPEND Place written data at the end of the file.


    +   O_TRUNC Set the file length to zero, discarding existing contents.


    +   O_CREATE Create the file if necessary. The function call with three arguments
    where mode is the initial permission.


    If OPEN is successful it returns a non-negative integer representing a “file descriptor.”
    This value is used in all subsequent I/O operations to identify this specific
    connection.


    +   READ and WRITE. These functions transfer data between the process and the
    file or device. fds is the file descriptor returned by OPEN. buf is a pointer
    to the data to be transferred and count is the size of buf in bytes. If the return
    value is non-negative, it is the number of bytes actually transferred, which may
    be less than count.


    +   CLOSE. When a process is finished with a particular device or file, it can
    close the connection, which invalidates the file descriptor and frees up any resources
    to be used for another process/file connection. It is good practice to close any
    unneeded connections because there is typically a limited number of file descriptors
    available.


    +   IOCTL. This is the “escape hatch” to deal with specific device idiosyncrasies.
    For example, a serial port has a baud rate and may have a modem attached to it.
    The manner in which these features are controlled is specific to the device. Each
    device can enable its protocol for the IOCTL function.


    A characteristic of most Linux system calls is that, in case of error, the return
    value is –1 and not directly identify the source of the error. The actual error
    code is placed in the global variable errno. So you should always test the return
    function for a negative value and then inspect errno to find out what really happened.
    Or better call perror(), which prints a sensible error message on the console.


    There are few other low level I/O functions but they''re not particularly relevant
    to this discussion.'
