    Git performs a three-way merge among the two divergent branches and a common ancestor,
    creating a new commit object. See Figure 15.10.


    At this point you did probably no longer need the testing branch. You can delete
    it with merge -d testing.


    # Configuring Git


    When you did your first commit, you may have noticed that git suggested a name
    and an e-mail address that it pulled from your system information. User name and
    information are rather important pieces of data that other developers may need
    to contact you about your commits to the project. So it''s important to configure
    your git package with basic information.'
