  md: 'To get started, set your user information:


    ```

    git config --global user.name "Homer Simpson"

    git config --global user.email homer@thesimpsons.com

    ```


    These commands hint at the basic structure of the configuration files. All configuration
    variables are specified as section.variable. In the configuration file, the section
    name is enclosed in square brackets. The square brackets may also include a subsection
    name enclosed in quotes. That syntax becomes section.variable.subsection.


    To get a better feel for how all of this hangs together, execute git config-list,
    which lists all of the currently defined configuration variables. Then open hello-world/.config
    with an editor to see where those values come from.


    Git provides a help command, git help, which lists all of the commands. If you
    execute git help<command>, you''ll get the man page for <command>. Execute git
    config and you''ll eventually come to a list of configuration variables that git
    recognizes.


    # Graphical Git


    It should perhaps come as no surprise that Eclipse supports git. Fire up Eclipse
    and change to the Git Repository Exploring perspective. The Project Explorer has
    been replaced by Git Rep. The menu bar of that view has icons to the following:


    +   * Add a local repository to the view.

    * Clone the repository to the view.

    * Create a new git repository in the view.


    Since we already have a repository for hello-world, let''s add that to Eclipse.
    Click the icon to bring up the dialog as shown in Figure 15.11. Starting in the
    hello-world/ directory, or any parent, click the Search button. Eclipse should
    find the hello-world repository. Click OK and the repository will be added to
    the Git repositories.


    Expand the hello-world entry and various subsets in the Git Repository view to
    reveal as depicted in Figure 15.12. The context menus for the objects shown here
    are pretty much what you would expect. If you right-click on Branches you can
    create a new branch. The currently checked out branch is identified by a check
    mark. Right-click a different branch name to it.


    In order to manage hello-world in the context of Eclipse, we need to make it an
    Eclipse project. Right-click the Working directory and select Copy Path to Clipboard.
    Strictly speaking, this isn''t a C/C++ project, so we''ll select File > New >
    Project, expand and select Project. Click Next and give the project a name. “Hello
    World” comes to mind.'
