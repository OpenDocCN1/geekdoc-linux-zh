    The Eclipse Platform is built on a mechanism for discovering, integrating, and
    running plug-ins. A tool provider writes a tool as a separate plug-in that operates
    on files in the workspace and exposes its tool-specific UI in the workbench. When
    you launch Eclipse, it presents an IDE composed of the set of available plug-ins.


    The Eclipse platform is written primarily in Java and in fact was originally designed
    as a Java development tool. Figure 6.2 shows the platform’s major components and
    APIs. The platform’s principal role is to provide tool developers with mechanisms
    to use, and rules to follow, for creating seamlessly integrated tools. These mechanisms
    are exposed via well-defined APIs, classes, and methods. The platform also provides
    useful building blocks and frameworks that facilitate the developing of new tools.


    Eclipse is designed and built to meet the following requirements:


    +   - Support the construction of a variety of tools for application development.

    - Support an unrestricted set of tool providers, including independent software
    vendors.

    - Support tools to manipulate arbitrary content types such as HTML, Java, C, JSP,
    EJB, XML, GIF.

    - Facilitate seamless integration of tools within and across different content
    types and tool providers.

    - Support both GUI and non-GUI-based application environments.

    - Run on a wide range of OSs, including Windows and Linux.

    - Capitalize on the popularity of the Java programming language for writing tools.


