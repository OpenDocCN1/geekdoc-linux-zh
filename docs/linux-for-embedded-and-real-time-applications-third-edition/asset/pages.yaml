    # ARM I/O Architecture


    Like most contemporary architectures, the ARM places peripheral devices in the
    same address space as memory. This means that peripherals can be accessed with
    the same instructions as memory. The program need not know or care whether it’s
    accessing memory or a hardware device. This is in contrast to, for example, the
    x86 architecture where peripheral devices exist in a separate address space to
    separate I/O instructions.


    In the case of the x86, only is I/O in a separate address space, the I/O instructions
    can only be executed from Privilege Level 0, also known as “Kernel space”. This
    necessitates the use of Kernel space device drivers to access peripherals. The
    ARM, however, lets us access peripherals directly from a user application.


    The map in Figure 7.1 shows how the 32-bit address space of the S3C2400 processor
    is allocated. The processor’s eight chip selects access 128 MB of'
