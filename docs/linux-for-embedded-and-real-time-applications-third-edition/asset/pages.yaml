  md: '# Introducing Linux 37


    executables rarely have an extension at all. And by large, the contents of a file
    are identified by a file header rather than a specific extension identifier. Nevertheless,
    many applications, the C compiler for example, do default file extensions.


    Unlike Windows, file names in Linux are case sensitive. Foobar is a different
    file from foobar and is different from foobar. Sorting is also case sensitive.
    File names with upper case letters appear before those that begin with lower case
    letters in directory listings sorted by name. File names that begin with “.” are
    considered to be “hidden” and are not displayed in directory listings unless specifically
    asked for them.


    Additionally, the Linux filesystem has a number of features that go beyond what
    you find in a typical Windows system. Let''s take a look at some of the features
    that may be of interest to embedded programmers.


    # File Permissions


    Because Linux is multiuseruser, every file has a set of permissions associated
    with it to specify what classes of users are allowed to do with that file. Get
    a detailed listing of some Linux directory, either by entering the command ls
    -l in a command shell window or with the desktop file manager. The part of entry
    for each file is a set of 10 flags and a pair of names that look something like
    this:


    ```

    -rw-r--r-- Andy physics

    ```


    In this example, Andy is the owner of the file and the file belongs to a group
    of users called physics, perhaps the physics department at some university. Generally,
    but not always, the owner is the person who created the file.


    The first of the 10 flags identifies the file type. Ordinary files get a dash
    here. Directories are identified by “d”, links are “i”, and so on. We’ll see other
    entries for this flag when we get to device drivers later. The remaining nine
    flags divide into three groups of three flags each. The flags are the same for
    all groups and represent permission to read the file, “r”, write, “w”, or execute
    the file if it’s an executable, “x”. Write permission also allows the file to
    be deleted.


    The three groups then represent the permissions granted to different classes of
    users. The first group identifies the permissions to the owner of the file and
    virtually allows reading and writing. The second group gives permissions to other
    members of the same group of users. In this case, the physics group has read access
    to the file but not write access. The final flag group gives permissions to the
    “world,” i.e., all users.


    > ³ The graphical file manager offers insensitive sort as an option.'
