  md: 'arch—All architecture-dependent code is contained in subdirectories of arch.
    Each architecture supported by the kernel has a directory under arch with its
    own subarchitecture structure. The executable kernel image will end up in <architecture>/boot.
    An environment variable in the makefile, ARCH, points to the appropriate architecture
    directory. arch/ is one of the two largest subdirectories in the kernel, comprising
    almost 12,400 files.


    block—The block layer. This is the code that optimizes transforms with block storage
    devices.


    crypto—Code dealing with the cryptographic aspects of system security.


    drivers—Device driver code. Under drivers, there are a large number of subdirectories
    for various devices and classes of device. This is the other major kernel subtree
    with close to 9,600 files.


    fs—File systems. Under fs, there is a set of directories for each type of file
    system that Linux supports.


    include—Header files. The most important subdirectory of include/ is linux/ that
    contains headers for the kernel APIs.


    init—The basic initialization code.


    ipc—Code to support Unix System 5 Inter-Process Communication mechanisms such
    as semaphores, message passing, and shared memory.


    kernel—This is the heart of the matter. Most of the basic architecture-independent
    kernel code that doesn''t fit in any other category is here. This includes things
    like the scheduler and basic interrupt handler.


    mm—Several utility functions that are collected into a library.


    net—Network support. Subdirectories under net contain code supporting various
    networking protocols.


    samples—Another relatively new addition, this has sample code showing how to manage
    some of the kernel''s internal data structures.


    scripts—Text files and shell scripts that support the configuration and build
    process.


    security—Offers alternative security models for sound cards and the Advanced Linux
    Sound Architecture (ALSA).


    tools—A performance monitor for the kernel.


    usr—Mostly assembly code that sets up linker segments for an initial RAM disk.


    virt—A virtual environment for the kernel.'
