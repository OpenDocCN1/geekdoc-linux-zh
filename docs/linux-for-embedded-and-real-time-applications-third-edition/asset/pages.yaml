  md: '# Networking


    There are a couple of changes needed on the host''s network configuration.


    # Network Address


    Your workstation is probably configured to get a network address via dynamic host
    configuration protocol (DHCP). But in this case, to keep things simple, we''re
    going to specify fixed IP addresses for both the workstation and the target.


    The Fedora graphical menu for changing network parameters is accessed from Administration
    -> Network Configuration⁴. In the Network Configuration dialog box, select the
    Devices tab (it''s the default), highlight eth0 and click Edit. In the Ethernet
    Device dialog, unselect the "Automatically obtain IP address with..." box. Now
    enter the IP address. Network address 192.168.1 is a good choice because it''s
    one of a range of network addresses reserved for local networks. Select node 2
    for your workstation. Under the Subnet Mask as in Figure 4.4. You may also want
    to set the Default Gateway Address and DNS nodes if you''re connected to a network.


    The checkbox Controlled by NetworkManager can be a problem. If your network port
    is already active and this box is checked, it''s probably not an. But when you
    exit back to the Network Configuration dialog, the Activate and Deactivate buttons
    are "active". If the network port is not active, you have no control over it and
    it''s unlikely to be auto-activated at boot time. What I have found to work through
    experimentation is to uncheck the NetworkManager box in the edit dialog, activate
    the port, then check the box again. The next time you use, the port should auto-activate.


    When you exit from the Network Configuration dialog, you''re asked if you want
    to save the changes. Yes do. You''re also warned that you may need to restart
    the network. Click OK. My experience has been that you usually don''t have to
    restart the network.


    Alternatively, you can just go in and directly edit the network device parameters
    file. Network configuration parameters are found in /etc/sysconfig/network-scripts/
    where you should find a file named something like ifcfg-eth0 that contains the
    parameters for network 0. You might want to make a copy of this file and name
    it using dhcp-ifcfg-eth0. That you''ll have a DHCP configuration file for future
    use if needed. Now open the original file with an editor (as root user of course).
    It should look something like Listing 4.1a. The lines shown here may be in a different
    order and interspersed with other lines.


