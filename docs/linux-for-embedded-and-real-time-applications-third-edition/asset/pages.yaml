    inheritance or priority ceiling and for setting the priority ceiling value.


    # Communication—Condition Variables


    There are many situations where one thread needs to notify another thread about
    a change in status to a shared resource protected by a mutex. Consider the situation
    in Figure 9.5 where two threads share access to a queue. Thread 1 reads the queue
    and Thread 2 writes it. Clearly, each thread requires exclusive access to the
    queue and so we protect it with a mutex.


    Thread 1 will lock the mutex and see if queue has any data. If it does, Thread
    1 reads the data and unlocks the mutex. However, if the queue is empty, Thread
    1 needs to block somewhere until Thread 2 writes some data. Thread 1 must unlock
    the mutex before blocking or else Thread 2 would not be able to write. But there''s
    a gap between the time Thread 1 unlocks the mutex and blocks. During that time,
    Thread 2 may execute and not recognize that anyone is blocking on the queue.


    The condition variable solves this problem by waiting (blocking) with the mutex
    locked. Internally, the conditional wait function unlocks the mutex allowing Thread
    2 to proceed. When the conditional wait returns, the mutex is locked.


