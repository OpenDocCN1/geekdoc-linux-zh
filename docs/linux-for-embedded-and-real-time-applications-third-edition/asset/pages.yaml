  md: '# 84 Chapter 6


    # Plug-ins


    A plug-in is the smallest unit of Eclipse functionality that can be developed
    and delivered separately. A small tool is usually written as a single plug-in,
    whereas a complex tool may have its functionality split across several plug-ins.
    Except for a small kernel known as the Platform Run-time, all of the platform’s
    functionality is located in plug-ins.


    Plug-ins are coded in Java. A typical plug-in consists of Java code in a JAR library,
    some read-only files, and other resources such as images, templates, message catalogs,
    and native code libraries. Some plug-ins don’t contain code at all. An example
    is a plug-in that contributes online help in the form of HTML pages. A single
    plug-in’s code libraries and read-only content are located together in a directory
    in the file system, or at a base URL on server.


    Each plug-in’s configuration is described by a pair of files. The manifest file,
    manifest.mf, declares essential information about the plug-in, including the name,
    version, and dependencies to other plug-ins. The second optional file, plugin.xml,
    declares the plug-in’s interconnections to other plug-ins. The interconnection
    model is simple: a plug-in declares any number of extension points and any number
    of extensions to one or other plug-ins.


    The extension points can be extended by other plug-ins. For example, the workbench
    plug-in declares an extension point for user preferences. Any plug-in can contribute
    its own user preferences by defining extensions to this extension point.


    # Workbench


    The Eclipse workbench API, UI, and implementation are built from two toolkits:


    +   1. Standard Widget Toolkit (SWT)—a widget set and graphics library integrated
    with the native system window with an OS-independent API.

    2. JFace—a UI toolkit implemented using SWT that simplifies common UI programming
    tasks.


    Unlike SWT and JFace, which are both general purpose UI toolkits, the workbench
    provides the supplies in which tools interact with the user. Because of this central
    and defining role, the workbench is synonymous with the Eclipse Platform UI as
    a whole and the main window you see when the Platform is running (Figure 6.1).
    The workbench API is dependent on the SWT and to a lesser extent on the JFace
    API.


    The Eclipse Platform UI paradigm is based on editors, views, and perspectives.
    From the user’s standpoint, a workbench window consists visually of views and
    editors. Perspectives'
