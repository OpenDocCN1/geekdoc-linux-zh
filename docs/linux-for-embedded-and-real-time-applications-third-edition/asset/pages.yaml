  md: 'Figure 9.1. In the absence of any kind of synchronizing mechanism, the result
    could be something “II a amm TaTaskkk 12.”


    What is needed some way to regulate access to the printer so that only one task
    can use it at a time.


    A mutex (short for “mutual exclusion”) acts like a key to control access to a
    resource. Only the thread that has the key can use the resource. In order to use
    the resource (in this case a printer), a thread must first acquire the key (mutex)
    by calling an appropriate kernel service (Figure 9.2). If the key is available,
    the resource (printer) is not currently in use by someone else, the thread is
    allowed to proceed. Following its use of the printer, the thread releases the
    mutex so no other thread may use it.


    If, however, the printer is in use, the thread is blocked until the thread that
    currently has the mutex releases it. Any number of threads may try to acquire
    the mutex while it is in use.


