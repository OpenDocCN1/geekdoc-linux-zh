    # The /proc File System


    The /proc file system is an interesting feature of Linux. It acts just like an
    ordinary file system. You can list the files in the /proc directory, you can read
    and write files, but they don’t really exist. The information in a /proc file
    is generated on the fly when the file is read. The kernel module that registered
    a given /proc file contains the functions that generate read data and accept write
    data.


    /proc files are a window into the kernel. They provide dynamic information about
    the state of the system in a way that is easily accessible to user-level tasks
    and the shell. The abbreviated directory listing of Figure 3.8, the directories
    with number labels represent processes. Each process generates a directory under
    /proc with several directories and files describing the state of the process.


    # Try It Out


    It’s interesting to see how many processes spawns just by booting up. Reboot your
    system, open a command shell and execute:


    ```

    ps -A | wc

    ```'
