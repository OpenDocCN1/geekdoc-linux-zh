    # Embedded Hardware


    Embedded computing covers an extremely wide range of hardware: from the (probably)
    8-bit processor that powers your automatic coffee maker to the (perhaps multicore)
    32-bit processor in your cell phone or tablet, to the massively parallel processing
    environment that runs the telecommunications network. In this chapter, we''ll
    get to work on the embedded target board that we''ll use in the next few chapters
    for applications programming.


    # ARM Single Board Computer


    ARM is a 32-bit reduced instruction set computer (RISC) architecture developed
    by ARM Holdings, a British company originally known as Advanced RISC Machines.
    It is said to be the most widely deployed 32-bit architecture in terms of numbers
    produced. The relative simplicity of ARM processors makes them suitable for low-power
    applications. As a result, they come to dominate the mobile and consumer electronics
    market. About 98% of all mobile phones use at least one ARM processor.


    ARM Holdings itself does not make chips. Rather, it licenses the architecture
    to a number of semiconductor manufacturers using AppliedMicro, Atmel, Freescale,
    Marvell (formerly Intel), Nvidia, St-Ericsson, Samsung, and Texas Instruments
    (TI), among others.


    The next few chapters will explore programming in a cross-platform environment
    using a single board computer (SBC) as the target. Specifically, we''ll be using
    a small, ARM-based SBC, the Mini2340, based on the Samsung S3C2440 system-on-chip
    (SOC). The Mini35 version of the board includes a3.5 in. screen LCD and comes
    with all necessary cables and a power supply, a DEV of useful software. The Mini35
    is priced at around $120 in single quantities (Figure 5.1).


    ¹ cinet "ARMed for the Living Room," http://news.cnet.com/ARMed-for-the-living-room/2100-1006_3-6056729.html.'
