    # The Terminal Emulator, minicom


    minicom is a fairly simple Linux application that emulates a dumb RS-232 terminal
    through a serial port. This is what we''ll use to communicate with the target
    board.


    Recent Linux distributions don''t install minicom by default. It''s easy enough
    to install. As root user (either `su` or `sudo`) execute:


    | yum install minicom | in Fedora |

    | apt-get install minicom | in Ubuntu or Debian |


    Both of these commands essentially do the same thing. They go out to the Internet
    to find the specified package, resolve any dependencies, download and install
    them.


    Once minicom is installed, there is a number of configuration options that we
    need to change to facilitate communication with the target.


    In a shell window, again *as root user*, enter the command `minicom-s`. If you''re
    running minicom for the first time you may see the following warning message:


    > WARNING: Configuration file not found. Using defaults


    You will be presented with a configuration menu. Select serial port setup (Figure
    4.1). By default, minicom connects through the device, `/dev/mem`. We need to
    change to talk directly to the PC''s serial ports Type “A” and replace the word
    “mode” with either `ttyS0` or `ttyS1`, where ttyS0 represents serial port COM1
    and ttyS1 represents COM2. However, if you only has USB ports and you''re using
    a USB to serial converter, the correct device is likely `ttyUSB0`. Again, if you''re
    running a virtual machine, make sure the VM is attached to the serial port.


    Type “E” followed by “I” to select 115,200 baud. Make sure both hardware and software
    are set to “no”. These are toggles. Type “F” or “G” will get the corresponding
    value between “yes” and “no.” Figure 4.1 shows the final serial port configuration.


    Type <Enter> to exit serial port setup and select modem and dialing. Here we want
    to delete the modem''s Init string and Reset string since they''re just in the
    way on a direct serial connection. Type “A” and backspace through the entire Init
    string. Type “B” and the same to the Reset string. The other strings in this menu
    don''t matter because they''ll never be invoked.'
