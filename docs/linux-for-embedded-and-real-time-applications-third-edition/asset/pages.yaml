  md: '# Preface xvii


    # Audience and Prerequisites


    My motivation for writing this book was to create the kind of book I wished I
    had I started out with Linux. With that in mind, the book is directed at two different
    audiences:


    +   1. The primary audience is embedded programmers who need an introduction to
    Linux in the embedded space. This is where I came from and how I got into Linux;
    so, it seems like a reasonable way to structure the book.

    2. The other audience is Linux programmers who need an introduction to the concepts
    of embedded and real-time programming.


    Consequently, each group will likely see some material that is review although
    it may be presented with a fresh perspective.


    This book is not intended as a beginners'' guide. I assume that you have successfully
    installed a Linux system and have at least played with it. You know how to log
    in, you''ve experimented with the command utilities and have probably fired up
    a GUI desktop. Nonetheless, Chapter 2 takes you through the installation process
    and Chapter 3 is a cursory introduction to some of the features and characteristics
    of Linux that are of interest to embedded and real-time programmers.


    The book is loosely divided into three parts. Part 1 is largely introductory and
    sets the stage for Part 2, which discusses application programming in a cross-development
    environment. Part 3 takes a more detailed look at some the components and tools
    introduced earlier. It also examines real-time performance in Linux.


    It goes without saying that you can''t learn to program by reading a book. You
    have to do it. That''s why this book is designed as a practical hands-on-guide.
    You''ll be installing a number of software packages on your Linux workstation,
    and there is sample code available at the book''s web, www.elsevier.com/.


    Embedded programming generally implies a target machine that is separate and distinct
    from the workstation development machine. The principal target environment we''ll
    be working within this book is an ARM-based single board computer. This is a widely
    available, relatively inexpensive device with capabilities typical of a real-world
    embedded product. But even if you choose not to purchase the, we''ll introduce
    an approach to simulation that will allow you to play around with many of the
    basic concepts on your workstation.


    # Personal Biases


    Like most computer, for better or worse, I''ve spent years in front of a Windows
    screen, and true be told, I still use Windows for my day-to-day computing. But
    before that'
