    # Installing SSH


    SSH is a network protocol for secure data communication, remote shell services,
    command execution, and other secure services between networked computers connected
    via a secure channel over an insecure network. It is a replacement for Telnet
    and other insecure remote shell protocols such as the Berkeley rsh and rex protocols,
    which send information, notably passwords, in plaintext, rendering them susceptible
    to interception and disclosure using packet analysis. The encryption used by SSH
    is intended to provide confidentiality and integrity of over an unsecured network.


    There are a number of implementations of SSH floating around, many of them proprietary.
    There is also an Open Source version called, perhaps surprisingly, OpenSSH. This
    is what we use.


    Installing OpenSSH on your target board out to be relatively easy as someone has
    done all the work for the Mini2440 and posted the results to a Google page. See
    the Resources section for the URL. From the top-level group page, go to Source
    and Browse. You''ll see a list of five files, a README, a script, and three zipped
    tar files. SSH is built on top of two other packages—the secure sockets layer
    (SSL) and zlib, a'
