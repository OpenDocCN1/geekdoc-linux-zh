  md: "# 72 Chapter 5\n\nIdeally, a file system for a flash device will implement\
    \ these operations transparently so the user or application programmer sees the\
    \ file system as if it were an ext3 or an ext4 residing on a hard disk. Popular\
    \ file systems for flash are JFF2, the Journaling Flash File System 2, and YAFFS,\
    \ Yet Another File System. YAFFS is somewhat newer and claims to be better suited\
    \ to NAND flash devices. The target board does have a YAFF root file system loaded\
    \ in NAND flash, but we’re not using at the moment because it’s not convenient\
    \ for software development.\n\nAs “journaling” file systems, both JFF2 and YAFFS\
