    # Behind the Scenes—What''s Really Happening


    The information in this section is not essential to the process of building a
    kernel and you''re free to ignore it for now. But when you reach the point of
    developing device drivers or other kernel enhancements (perhaps hacking the kernel
    itself), you will need to modify the files that control the configuration process.


    All the information in the configuration menu is provided by a set of files named
    Kconfig that are scattered throughout the source tree. These are script files
    written in Config Language, which looks suspiciously like a shell language but
    isn''t exactly. The main Kconfig file is located in linux/arch/$(ARCH) where ARCH
    is a variable identifying the base architecture.


    Go to linux/arch/ and open Kconfig. Find the line that reads menu "System Type"
    around line 222. Compare the structure of the file menu starting at System Type
    and the pattern should appear clearly. Each configuration option is identified
    by the keyword config followed by the option''s symbolic name, for example config
    MMU. Each of these gets turned into a Makefile, or macro, such as CONFIG_MMU.
    The Makefiles then use these variables to determine which components to include
    in the kernel and to use #define symbols to the source code.


    The option type is identified by one of the following words:


    +   * bool—The option has two values, "y" or "n"

    * tristate—The option has three values, "y", "n", and "m"

    * choice—The option has one of the listed values

    * int—The option takes an integer value.


    The type word usually includes a prompt, where the text is displayed in the configuration
    menu. Alternatively, the prompt key word specifies the prompt. There are also
    "hidden" options that have no display prompt. At the top of Kconfig is a set of
    options that don''t show up in the menu because no prompt is specified. In the
    configuration menu, click on Options->Show All Options. Now all options are displayed,
    including those with no prompt and those deselected options.


    Other key words within a configuration entry include help to specify the text
    and depends, which means that this option is only valid, or visible, if some other
    option that it depends on is selected. There''s also select, which says that if
    this option is selected, of necessity some other option must also be turned on.'
