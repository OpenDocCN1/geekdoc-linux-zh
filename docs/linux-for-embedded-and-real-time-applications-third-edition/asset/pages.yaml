    # Registering an Interrupt Handler


    Like any device resource, an interrupt handler must be registered with the kernel
    before it can be used. Open simple_int.c with an editor. Starting at line 436
    in the module function, there''s a set of four calls to request_irq representing
    different operating modes. We''ll come back to the tasklet and wq modes. For now
    we''ll register my_interrupt the interrupt handler. The arguments to request_irq()
    are:


    +   - The interrupt number you''re registering.

    - A pointer to the handler function, which takes two arguments to be described
    shortly.

    - A flags mask.

    - The device name. This is used by /proc/interrupts to identify the devices holding
    interrupts.

    - A pointer used for shared interrupt lines. Typically, this would point to the
    driver''s private data area as a way of identifying which device caused the interrupt.
    If the interrupt isn''t shared, this can be NULL.


    As usual, the return value is 0 if the function succeeds and a negative error
    code if it fails. The most likely error is -EBUSY, meaning that another device
    has registered this nonshared interrupt.


