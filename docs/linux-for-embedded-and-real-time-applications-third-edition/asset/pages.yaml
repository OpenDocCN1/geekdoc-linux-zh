  md: '# Debugging Embedded Software


    If debugging is the process of removing bugs, then programming must be the process

    of putting them in.


    > Edsger W. Dijkstra


    In Chapter 6, you saw how Eclipse integrates very nicely with the Gnu Debugger,
    GDB.

    In this chapter, we''ll look at additional features of GDB and explore how to
    use GDB on

    our target board. We''ll also consider a simple approach to high-level simulation
    that can be

    useful in the early stages of development.


    # Remote Debugging with Eclipse


    In a typical desktop environment, the target program runs on the same machine
    as the

    debugger. But in our embedded environment Eclipse with GDB runs on the host

    workstation and the program being debugged runs on the ARM target. You can think
    of

    as having both a client and a server side as illustrated in Figure 8.1. The client
    is the

    user interface, and the server is the actual interaction with the program test.
    GDB

    implements a serial protocol that allows the server and the client sides to be
    separated and

    of communicate each other via RS-232 line or Ethernet.


    There are two approaches to interfacing the target to the gdb serial protocol:


    +   - gdb stubs. A set of functions linked to the target program. gdb stubs is
    an RS-232-only

    solution.

    - gdbserver. This is a stand-alone program running on the target that, in turn,
    runs the

    program to be debugged. The advantage of gdbserver is that it is totally independent
    of

    the target program. In other words, the target builds the same regardless of remote

    debugging. Another advantage of gdbserver is that it runs over Ethernet. Finally,

    Eclipse uses gdbserver, so that''s the best reason of all to use it.


    gdbserver is part of the ARM tool chain in /usr/local/arm/4.3.2. Interestingly,
    we

    are six different copies of gdbserver spread out arm-linux-gnueabibc. Through

    trial and error, I discovered that the one in armv4/usr/bin works. The gdb file
    must

    be copied into the target file system so the Mini240 can execute. A good location,

    because it''s in the PATH, is /usr/bin.'
  merge: -1
  pgno: 105
- img_proc: true
  md: '![](img/55fba0370caa0078213ac3714cffd0ec_106_0.png)


    To run the measure program in GDB you would first cd to the src/measure directory
    and execute:


    ```

    `gdbserver:10000 measure```

    ```


    The arguments to gdbserver are:


    +   - Network port number preceded by a colon. The normal format is "host:port",
    where "host" is either a host name or an IP address in the form of a dotted quad,
    but gdbserver ignores the port. The port number is arbitrary as long as it doesn''t
    conflict with another port number in use. Generally, port numbers below 1024 are
    reserved for established network protocols such as HTTP (port 80), so it''s best
    to pick a number above 1023. Port number 10000 happens to be the default for the
    Eclipse debugger.

    - Target program name.

    - Arguments to the target program, if any.


    gdbserver responds with something like:


    ```

    `Process measure created; pid = 703`

    ```


    Your pid value may be different. This says that gdbserver has loaded the program
    and is waiting for a debug session to begin on the specified port.


