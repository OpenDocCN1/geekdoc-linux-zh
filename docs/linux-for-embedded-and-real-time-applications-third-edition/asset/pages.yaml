  md: '# # Appendix A: U-Boot Commands


    Das U-Boot supports an extensive command set. This section describes the most
    useful of those commands. Because U-Boot is highly configurable, not all commands
    are necessarily in any given implementation. The behavior of some commands is
    also configuration-dependent and may depend on environment-variable values.


    All U-Boot commands expect numbers to be entered in hexadecimal. In the following
    descriptions, arguments are bracketed by < >. Optional arguments are further bracketed
    by [ ]. Command names can be generally abbreviated to the shortest unique string,
    shown in parentheses.


    # ## Information Commands


    bdinfo (bdi)—Displays information about the target board such as memory sizes
    and locations, clock frequencies, and MAC address. This information is available
    to the Linux kernel.


    coninfo (conin)—Displays information about available console I/O devices. It shows
    the device name, flags, and the current usage.


    flinfo [<bank#>] (fli)—Displays information about the available flash memory.
    Without an argument, it lists all flash memory banks. With a numeric argument,
    n, it lists memory bank n.


    ininfo<start addr>(imi)—Displays header information for images as Linux kernels
    or ramdisks. It lists the image name, type, size and verifies the CRC32 checksum.


    ininfo takes an argument that is the starting address of the image. The behavior
    of ininfo is influenced by the verify environment variable.


    help [<command name]>—Self-explanatory. Without an argument, it prints a short
    description of all commands. With a command name argument it provides more detailed
    help.


    # ## Memory Commands


    By default, the memory commands operate on 32-bit integers. They can be made to
    operate on 16-bit words or 8-bit types by appending “.w" (for 16 bits) or “.b"
    (for 8 bits) to the command name. There is also a “.l" suffix to explicitly specify
    32 bits. Example: cmp.w 1000 2020 compares 32 (20 hex) words at addresses 0×1000
    and 0×2000.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# 258 Appendix A


    base [<offset>](—Gets or sets a base address to be used as an offset for all other
    memory commands. With no argument it displays the current base, default is 0.
    A numeric argument becomes the new base. This is useful for repeated accesses
    to a specific section of memory.


    crc32 <start addr><length>[store addr>] (crc)—Computes and displays a 32-bit checksum
    over <length> bytes starting at <start addr>. The optional third argument specifies
    a location to store the checksum.


    cmp <addr1><addr2><count>—Compares two regions of memory. <count> is the number
    of data items independent of the specified size, byte, or word.


    cp <source><dest><count>—Copies a range of memory to another location. <count>
    is the number of items copied.


    md <addr> [<count>]—Memory display. Displays a range of memory in both hex and
    ASCII. The optional <count> argument defaults to 64 items. md remembers the most
    recent <addr> and <count> so that if it is entered without an address argument,
    it continues from where it left off.


    mm <start addr>—Modifies memory with auto-increment. Displays the address and
    current contents of items and prompts for user input. A hexadecimal value replaces
    the current value and displays the next. This continues as long as you enter valid
    values. To terminate the command, enter a non-hex value.


    mtest <start addr><end addr>[pattern>]—Simple read/write RAM test. This test modifies
    RAM and may crash the system if it touches areas used by U-Boot such as the stack
    or heap.


    mw <addr>value [<count>]—Writes <value> to a range of memory starting at <addr>.
    The optional <count> defaults to 1.


    nm <addr>—Modifies memory at a constant address (no auto-increment). Interactively
    writes valid hex data to the same address. This is useful for accessing I/O device
    registers. Terminate the command with a non-hex input.


    loop <addr><count>—Reads memory in a tight loop. This can be useful for scoping.
    The command never terminates! The only way out is to reset the board.


    # NOR Flash Memory Commands


    U-Boot organizes flash memory into sectors and banks. A bank is defined as an
    area of memory consisting of one or more memory chips connected to the chip select
    signal. A bank is subdivided into sectors where a sector is the smallest unit
    that can be'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# U-Boot Commands 259


    written or erased in a single operation. Bank numbering begins at 1 while sectors
    are numbered with 0.


    cp <source><count>-The Cp command is “flash aware”. If <dest> is in flash it invokes
    the appropriate programming algorithm. Note that the copy may fail if the target
    area has not been erased or if it includes any protected sectors.


    erase <start><end>(era)—Erase from <start> to <end>. <start> must be the first
    address of a sector and <end> must be the last address of a subsequent sector.
    The command does not execute. A warning is displayed if the range includes any
    protected sectors. The range to be erased can also be expressed in banks and sectors.


    erase bank#:<start sector>[<end sector>]—Erase from <start sector> to <end sector>
    in flash bank <bank #>. If <sector> is not present, only <start sector> is erased.


    all—Erase flash memory except protected sectors.


    on|off <start><end>—Sets write protection on or off for the specified range. <start>
    must be the first address of a sector and <end> must be the last address of a
    subsequent sector. The protect command can be expressed in banks and sectors.


    on|off bank#:<start sector>[<end sector>]—Sets write protection on or off from
    <start sector> to <end sector> in flash bank <bank #>. If <sector> is not present,
    only <start sector> is affected.


    protect bank<#>—Sets write protection on or off for all sectors in the specified
    bank.


    all—Sets write protection on or off for flash in the flash system.


    Note that the protection mechanism is software-only that protects against writing
    by U-Boot. Additional hardware protection depends on the capabilities of the flash
    chips and the flash device driver.


    # NAND Flash Memory Commands


    NAND flash is organized into arbitrary sized partitions. All NAND commands are
    prefixed by the key word nand.


    and info—Shows available NAND devices.


    mtdparts—Lists NAND partitions.


    and erase [clean] [<offset><<size>]—Eases <size> bytes starting at <offset>. If
    <offset> is not specified, erases entire chip.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# 260 Appendix A


    nand scrub—Really erases the entire chip, including bad blocks. Considered “unsafe.”


    nand createbbt—Creates bad block table.


    nand bad—Lists bad blocks.


    nand read.<jfs2|yaffs><offset>|<partition><size>—Reads <size> bytes from flash
    from numerical <offset> or <partition> name into RAM at <addr>. .jfs2 and .yaffs
    modifiers file system images.


    nand write.<e|.jfs2|yaffs><offset>|<partition><size>—Writes <size> bytes from
    <addr> in RAM to flash at numerical <offset> or <partition> name. The .e writes
    error correction codes. .jfs2 and .yaffs modifiers identify system images.


    # Execution Control Commands


    autoscr <addr>—Executes a “script” of U-Boot commands. The script is written to
    a text file that is transferred to a U-Boot image with the mkimage utility. <addr>
    is the start of the image header.


    boot<addr> [<param> ...]—Boots an image such as an OS from memory. The image header,
    starting at <addr>, contains the necessary information about the OS type, compression,
    if any. <param> is one or more optional parameters passed to the OS. The OS image
    is copied into RAM and uncompressed if necessary. Then control is transferred
    to the entry point address. For Linux, one optional parameter is recognized, the
    address of an initrd RAM disk image.


    Note incidentally that images can be booted from RAM, having been downloaded,
    for example, by TFTP. In this case, be careful that the compressed image does
    not overlap the memory area used by the uncompressed image.


    go<addr> [<param> ...]—Transfers control to a “stand-alone” application starting
    at <addr> and passing the optional parameters. These are programs that don’t require
    the complex environment of an OS.


    # Download Commands


    Three commands are available to boot images over the network using TFTP. Two of
    them also obtain an IP address before executing the file download.


    bootp<load_addr><filename>—Obtain an IP address using the bootp protocol, then
    download <filename> to <load_addr>.'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# U-Boot Commands 261


    arpboot<load_addr><filename>(rarp)—Obtain an IP address using the RARP protocol,
    then download <filename> to <load_addr>.


    tftpboot<load_addr><filename>(tftp)—Just download the file. Assumes client already
    has an IP address, either staticially assigned or obtained through DHCP.


    dhcp—Get an IP address using DHCP.


    It’s also possible to download files using a serial line. The recommended terminal
    emulator for serial image download is kermit as some users have reported problems
    using minicom for image download.


    loadb<offset>—Accept a binary image to download <offset> over the serial port.
    Start this command in U-Boot, then initiate the transmission on the host side.


    loads<offset>—Accept an S-record file download to address <offset> over the serial
    port.


    # Environment Variables Commands


    printenv [<name>]—Prints the value of one or more environment variables. With
    no argument, printenv lists all environment variables. Otherwise, it lists the
    value(s) of the specified variable.


    setenv <name> [<value>]—setenv removes the specified variable from U-Boot’s environment
    and reclaims the storage. With two arguments it sets variable <name> to <value>.
    These changes take place in RAM only. **Warning**: use a space between <name>
    and <value>, not “=\”. The latter will be interpreted literally with rather strange
    results.


    Standard quoting rules apply when a value contains characters with special meaning
    to the command line using "$" for substitution and "; for command separation.
    These are “escaped” with a backslash, \\". Example:


    ```

    setenv netboot tftp 01200000\; bootm

    ```


    saveenv—Writes the environment to persistent storage.


    run<name><...>—Treats the value of environment variable <name> as one or more
    U-Boot commands and executes them. If more than one variable is specified, they
    are executed in order.


    boot(boot)—A synonym for run bootcmd to execute the default boot command.


    # Environment Variables


    The U-Boot environment is kept in persistent storage and copied to RAM when U-Boot
    starts. It stores environment variables used to configure the system. The environment
    is'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# 262 Appendix A


    protected by a CRC32 checksum. This section lists some of the environment variables
    that U-Boot recognizes.


    The variables shown here serve specific purposes in the context of U-Boot and,
    for the most part, will not be used explicitly. When needed, U-Boot environment
    variables are used explicitly in commands the same way that they are in shell
    scripts and makefiles, enclosing them in $().


    autoload—If set to "no," or any string beginning with "n", the rarp and boot commands
    will only get configuration information and not try to download an image using
    TFTP.


    autostart—If set to "yes," an image loaded using rarp, boot, or tftp commands
    will be automatically started by initially calling the boot command.


    baudrate—A decimal number that specifies the bit rate for the console serial port.
    Following the setenv baudrate <> command, U-Boot expects to receive a newline
    character at the new rate before actually committing the rate. If this fails,
    the board must be reset and reverts to the old baud rate.


    bootargs—The value of this variable is passed to the Linux kernel as boot arguments,
    i.e., the "command line.".


    bootcmd—Defines a command string that is automatically executed when the initial
    countdown is not interrupted, but only if the bootdelay is also defined with a
    non-negative value.


    bootdelay—Wait many seconds before executing the contents of the bootcmd variable.
    The delay can be interrupted by pressing any key before the bootcmd sequence starts.
    Warning: setting bootdelay 0 executes bootcmd immediately and disables any interaction
    with U-Boot. On the other hand, setting this variable to —I disables auto boot.


    bootfile—The name of the image to be loaded by the tftpboot command.


    ethaddr—MAC address for the first or only Ethernet interface on the board, known
    as Linux as eth0. A MAC address is 48 bits represented as six pairs of hex digits
    separated by dots.


    eth2addr—MAC addresses for the second and third Ethernet interfaces when present.


    ipaddr—Sets an IP address on the target board for TFTP loading.


    loadaddr—Default buffer address in commands like tftpboot, loads, and bootm. Note:
    it appears, but does not seem to be documented, that there is a default load address,
    0x21000000, built into the code.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# U-Boot Commands 263


    serverip—IP address of the TFTP server used by the tftpboot command.


    serial—A string containing hardware identification such as type and serial number.
    This variable can only be set once, often during manufacturing of the board. U-Boot
    refuses to delete or overwrite this variable once it has been set.


    verify—If set to “n” or “no”, disables the checksum calculation over the complete
    image in the boot command to trade speed for safety in the boot process. The header
    checksum is still verified.


    The following environment variables can be automatically updated by the network
    boot commands (boot, dhcp, or tftp) depending on the information provided by your
    boot server:


    +   - boot—see above,

    dnsip—IP address of your Domain Name Server

    gateway—IP address of the Gateway (Router),

    hostname—target hostname,

    ipaddr—see above,

    netmask—subnet mask,

    rootpath—path to the root filesystem on the NFS server,

    serverip—see above,

    filesize—size in bytes, as a hex string, of the file downloaded using the last
    boot, or dhcp, or tftp command.'
  merge: -1
