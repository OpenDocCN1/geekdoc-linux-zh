    # Host Workstation as Debug Environment


    Although remote GDB gives us a pretty good window into the behavior of a program
    on the target, there are good reasons why it might be useful to do initial debugging
    on your host development machine. To begin, with the host is available as soon
    as a project starts, probably well before any real target hardware is available
    or working. In many cases, it''s easier to exercise limit conditions with a simulation
    than with the real hardware. The host has a file system that can be used to create
    test scripts and document results.


    When you characterize the content of most embedded system, you will usually find
    that something like 5%, maybe 10%, of the code deals directly with the hardware.
    The rest of the code is independent of the hardware and therefore shouldn''t need
    hardware to test it, provided the code is properly structured to isolate the hardware-dependent
    elements.


    The idea is to build a simple simulation that stands for the hardware I/O devices.
    You can exercise the application by providing stimulus through the keyboard and
    noting the output on the screen. In later stages of testing you may want to substitute
    a file-based "script driver" for the screen and keyboard to create reproducible
    tests.


    Take a look at simdrive.c in the measure/ directory. This file exposes the same
    API as trdrive.c but uses a shared memory region to communicate with another process
    that displays outputs on the screen and accepts analog input via the keyboard.
    This functionality is implemented in devices.c. The shared memory region consists
    of a data structure type shmn_t (defined in driver.h) that includes fields for
    an analog input and a set of digital outputs that are assumed connected to LEDs.
    It also includes a process ID field (pid_t) set to the devices process that allows
    the thermostat process to signal when a digital output has changed.


    creates and initializes the shared memory region. In simdrive, initAD() attaches
    to the previously created shared memory region. readAD() simply returns the current
    value of'
