  md: '# 38 Chapter 3


    The “x” permission is worth a look. In Windows, a file with the extension .exe
    is assumed to be executable. In Linux, a binary executable is identified by the
    “x” permission since we don''t have an explicit file extension to identify it.
    Furthermore, only those classes of users whose “x” permission is set allowed to
    invoke execution of the file. So if I''m logged in as an ordinary user, I''m not
    allowed to invoke programs that might change the state of the overall system such
    as changing the network address.


    Another interesting feature of “x” is that it also applies to shell scripts, which
    we''ll come to later in this chapter. For you DOS, a shell is the same thing as
    a .bat file. It''s a text file of commands to be executed as a program. But the
    shell won''t execute the script unless its “x” bit is set.


    # The “root” User


    There''s one very special user, “root,” in every Linux system. Root can do anything
    to any file regardless of the permission flags. Root is primarily intended for
    system administration purposes and is not recommended for day-to-day use. Clearly,
    you can get into a lot of trouble if you''re not careful, and root privileges
    pose a potential security threat. Nevertheless, the kinds of things embedded and
    real-time developers do with the system often require write or executable access
    to files owned by root and thus require you to be logged in as root user.


    In the past, I would log in as root most of the time because it was less hassle.
    One consequence of this is that every file I created was owned by root and couldn''t
    be written by an ordinary user without changing the permissions. It became a vicious
    circle. The more I logged in root, the more I had to log in root to do anything
    useful. Since I''ve adopted the more prudent practice of logging in as a normal
    user and switching when necessary.


    If you''re logged in as a normal user, you can switch to root with either the
    su, substitute user or sudo commands with no arguments up a shell with root privileges
    you entered the correct root password. To return back to normal user status, terminate
    the shell typing ^ exit.


    The sudo command allows you to execute a command as root provided you are properly
    authorized to use “sudoers,” /etc/sudoers. The sudoers file is of course owned
    by root, only the root user can authorize others. Once you''ve authenticated,
    by entering your password, you may use sudo for a short period of time (default
    5 min) without reentering your password.


    For example, if I wanted to change the permissions on a file in the /dev directory,
    I could execute:


    ```

    sudo chmod +rw/dev/ttyS0

    ```'
