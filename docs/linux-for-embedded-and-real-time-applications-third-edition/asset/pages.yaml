  md: '# 240 Chapter 15


    ![](img/55fba0370caa0078213ac3714cffd0ec_258_0.png)


    ![](img/55fba0370caa0078213ac3714cffd0ec_258_1.png)


    Git stores configuration information in three places:


    +   1. /etc/gitconfig—System-wide parameters applicable to all users. Use `git
    config --system` to read or write these values.

    2. ~/.gitconfig—Parameters specific to each user. Use `git config --global` to
    access these.

    3. .gitconfig—Project-specific parameters found in the repository you''re currently
    working with.


    Each level overwrites values in the previous level, so values in `.git/config`
    take precedence over those in `/etc/gitconfig`, for instance. These files are
    of plain ASCII text so you can set the values by manually editing the file and
    inserting the correct syntax, but it''s generally easier to run the `git config`
    command.'
