    File System Hierarchy.


    +   **Static vs. variable.** Many of the files in a Linux system are executables
    that don''t change, they are *static*. The files that users create or acquire,
    by downloading or email for example, are *variable*. These two classes of files
    should be cleanly separated.


    Here is a description of the directories defined by FHS:


    +   * /bin/: Contains binary executables of commands used by both users and the
    system administrator. FHS specifies what /bin must contain. These include among
    other things the command shell and basic file utilities. /bin files are static
    and sharable.

    * /boot/: Contains everything required for the boot process except configuration
    files and the map installer. In addition to the kernel executable, /boot contains
    data that is used before the kernel begins executing user-mode programs. /boot
    files are static and non-sharable.

    * /etc/: Contains host-specific configuration files and directories. With the
    exception of mtab, which contains dynamic information about file systems, /etc
    files are static. FHS identifies three optional subdirectories of /etc:

    * /opt/: Configuration files for add-on application packages contained in /opt.

    * /sgml/: Configuration files for Standard Generalized Markup Language (SGML)
    and Extended Markup Language (XML).

    * /x11/: Configuration files for X windows.


    In practice, most Linux distributions have many more subdirectories of /etc representing
    optional setup and configuration requirements.


    +   * /home: (optional) Contains home directories. Each user has a subdirectory
    under home with the same name as his/her user name. Although FHS calls this optional,
    it is almost universal among Unix systems. The contents of subdirectories under
    /home is of course variable.'
