  md: '# 252 Chapter 16


    I''ve had some (but not a lot) success with BuildRoot. At least BuildRoot is more
    “approachable” in that it''s built from familiar concepts such as scripts and
    Makefiles.


    # Android


    By now everyone with the remotest connection to consumer tech knows Android is
    Google’s implementation of Linux for mobile devices. What you may not know is
    that Android is the world’s leading smart phone platform with 59% of the market
    in the first quarter of 2012. One million Android devices are activated every
    day!


    Of course, Android is more than Linux; it’s a complete development framework as
    illustrated in Figure 16.3. While most Android applications are written in Java,
    there is no Java Virtual Machine in the platform and Java code is not executed.
    Java classes are compiled into Dalvik executables and run on Dalvik, a specialized
    machine designed specifically for Android and optimized for battery-powered mobile
    devices with limited memory and CPU.


    The most recent release of Android as this writing is 4.1, Jelly Bean, released
    in July 2012. Interestingly, since version 1.5, Cupcake, released in April 2009,
    all releases have been named in alphabetical order for desserts.


    There are two distinct levels to Android development: applications and platform
    development. Application development can be done in Windows, Linux, or Mac OS
    (Intel). Platform development is limited to Linux and Mac OS.


    # Application Development


    Begin by downloading the Android Software Development Kit (SDK) for Linux tarball
    from developer.android.com/sdk/. Untar the 80 some megabyte file in a suitable
    location. This is just the start. You will need the Android SDK Platform Tools
    and an actual execute. tools/android to bring up the dialog of Figure 16.4. Select
    Android SDK tools and Android 4.1 (API 16), then click on Install 7 packages.
    You’ll be to accept the license agreements. The simplest thing of course is to
    Accept All.


    With the downloads complete, the most useful thing to do is docs/about and open
    index.html with a web browser. This leads you to a very extensive and thorough
    developer’s guide. Eclipse is the preferred development environment for Android,
    so you’ll want to download the Android add-in for Eclipse. After everything is
    installed and configured, probably the best thing to do is to go to Building Your
    First App.'
