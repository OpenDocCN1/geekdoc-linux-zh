- pgno: 110
  md: '# Linux has a strong security system for files and directories.


    The most important element of this security system is, well established design
    on the user authority permissions on files and directories. As known, the top
    authorized users in the system is called root and there are no restrictions for
    this user. Therefore, if you''re working with root user rights on the system operation
    its better to pay attention.


    # Access Privileges


    Each user on the system can process within the framework of the authority delegated
    to him. The users can have three different series of actions on file or directory.


    +   - read (r): Can he/she see the file content? (For folders) can he/she get
    the file list?


    +   - write (w): Permission of writing to the file and also delete the file. (For
    folders) Can he/she create files or subfolders within this folder?


    +   - execute (x): Can she/he execute the files? (For folders) Can she/he get
    in to the folder?


    Now use ls -l command to list the directory we are in and look at the sub-directories
    and files related to the case.


    ```

    root@kemal:~# ls -l

    toplam 40

    drwxr-xr-x 2 root root 4096 Agu 22:10 Belgeler

    drwxr-xr-x 2 root root 4096 Eyl 13 00:44 Downloads

    drwxr-xr-x 2 root root 4096 Agu 22:12:21 dwhelper

    drwxr-xr-x 2 root root 4096 Agu 22:10 Genel

    drwxr-xr-x 5 root root 4096 Eyl 11:18 Masaüstü

    drwxr-xr-x 2 root root 4096 Agu 22:10 Müzik

    drwxr-xr-x 2 root root 4096 Agu 22:10 Resimler

    drwxr-xr-x 2 root root 4096 Agu 22:10 Şablonlar

    -rw-r--r-- 1 root root 144 Eyl 18 02:09 users.txt

    drwxr-xr-x 2 root root 4096 Agu 22:10 Videolar

    ```'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Master of Linux Commands


    When we examine the list, we see **drwx-xr-x** and **rw-r--r--** expressions.
    This encoding statements, the listed files / directories are showing the current
    access rights for users. A directory that you see at the beginning of the expression
    **d**, says it is a directory, - sign says it is a file. And let''s sort the remaining
    codes, which consists of 9 characters **rwxr-xr-x** and **rw-r--r--** in three
    groups.


    +   - **rwx-xr-x = rwx r-x r-x**

    - **rw-r--r-- = rw- r-- r--**


    First of the group (rwx) files / directories with the owners of the second group
    (r-x), the owner of the file users privileges in the same group, the third group
    (r-x) and the other (general) represents the authority of the user. Of course,
    this applies to the above coding. For the following rw- for the owner, for the
    same group as the owner r-- and other users will also be shaped to r- as as well.
    Let''s do a little summary:


    +   - **r: (read)** Read permission

    - **w: (write)** Write permission

    - **x: (execute)** execute permission


    Now let''s look again rwxr-xr-x expression. Let''s take first expression to form
    of three goups as rx rwx groups in the form of three groups. Then examine:


    +   - **rwx**: Owner of the file has read, write and execute privileges there.

    - **r-x**: The group members where the owner is belong read and execute privileges
    same as the owner.

    - **r-x**: Other users have read and execute privileges.


    §'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Changing the Privileges


    The process of replacing a file or directory can be made only by the root user.
    We can do the modification of access privileges with chmod command. Usage patterns
    of this command is as follows: chmod <ugo> +--> <rwx> <file/directory>


    +   - u: File or directory''s owner

    - g: Users in the same group with the file or directory owner(group)

    - o: Other users (others)

    - a: All

    - + : adding authorization

    - - : removing authorization

    - = : synchronizing authorization

    - r: Reading authorization

    - w: Writing authorization

    - x: operating authorization

    - s: Suid bit

    - t: Sticky bit


    Let''s look at a few examples of use.

    chmod +r <file_name> (give everyone reading authorization)

    chmod u+rwx <file_name> (all rights given the owner of the file)'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Master of Linux Commands


    chmod o-wx <file_name> (To remove all the rights of to read and write from the
    other users)


    chmod u+rw,g+r,o+r <file_name> (give all rights to owner, reading rights to groups,
    reading rights to other users)


    chmod go-rwx <file_name> (remove rwxr authority from group and others)


    chmod +x <file_name> (give everyone permission to execute)


    Let''s see a simple example how to change the permissions. We have a file named
    users.txt. Let look at the file permissions with ls -l users.txt.


    ```

    root@kemal:~# ls -l users.txt

    -rw-r--r-- 1 root 144 Eyl 18 02:09 users.txt

    ```


    Allow state seems to be -rw-r--r--. Initial - mark, as we mentioned earlier, indicates
    that this is a file. If that was d letter we would understand that it was a directory.
    According to this allowing status, the owner has read and write authority. In
    all other users we want to give the group and other users write access, we must
    use chmod go+w users.txt command.


    ```

    root@kemal:~# chmod go+w users.txt

    root@kemal:~# ls -l users.txt

    -rw-rw-rw- 1 root 144 Eyl 18 02:09 users.txt

    ```


    For example, to remove read permission users in this group, and also to remove
    other users writeite permission we use chmod g-r,o-w users.txt command.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Kemal Demirez | 115


    ```

    root@kemal:-# ls -l users.txt

    -rw-rw-rw-- 1 root root 144 Eyl 18 02:09 users.txt

    root@kemal:-# chmod g-r,o-w users.txt

    root@kemal:-# ls -l users.txt

    -rw-rw-r-- 1 root root 144 Eyl 18 02:09 users.txt

    ```


    We use the chmod command to edit authorization, we may use it for more practical
    format. We do this process with express the authorities in numerical mode. Digital
    equivalents of authorization showing the mold situation are like below.


    # file owner groupmates with the file owner other users


    | r = 4 | r = 4 | r = 4 |

    |---|---|--|

    | w = 2 | w = 2 | w = 2 |

    | x = 1 | x = 1 | x = 1 |


    According to matching above we can use 7 (4+2+1) instead of rwx. Just like this,
    we can use 777 instead of rwxrwxrx, 700 instead of rwx------, 755 instead of rwx-xr-x.
    (r-x=4+0+1, rw-=4+2+0, r=-4+0+0, --x=0+0+1)


    For example, we have a file named deneme, and lets give all the permissions on
    this file (rwx). For this, we use chmod 777 deneme command.


    ```

    root@kemal:-# ls -l deneme

    -rw-r-r-- 1 root root 0 Eyl 21 00:27 deneme

    root@kemal:-# chmod 777 deneme

    root@kemal:-# ls -l deneme

    -rwxrwxwx 1 root root 0 Eyl 21 00:27 deneme

    ```


    §'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# 116 | Master of Linux Commands


    Now, lets turn off the all permissions of the file named deneme to all users but
    the owner. We need to use chmod 700 deneme command for this.


    ```

    root@kemal:~# su zeynep

    zeyep@kemal:/$ ls

    Belgeler Downloads Genel Müzik Şablonlar Videolar deneme dwhelper Masaüstü Resimler
    users.txt

    zeyep@kemal:/root$ cat deneme

    Linux Commands

    zeyep@kemal:/root$ exit

    root@kemal:~# chmod 700 deneme

    root@kemal:~# su zeynep

    zeyep@kemal:/root$ cat deneme

    cat: deneme: Erişim engellendi

    zeyep@kemal:~$ _

    ```


    If you want to the permissions of a directory, subdirectory, and they also found
    in the file with, for example 755, you must use a command such as chmod -R 755
    <directory>. Here note that the use of the R parameter.


    # Suid Bit


    Each user can perform actions on the extent of their authority in the system.
    Sometimes it may be necessary for a normal user with root user rights temporarily.
    So normally the root user is able to run the program, if suid bit is set up, when
    other users want to use this program, as long as the program works, it runs with
    owners authorities. With a clearer expression, a user who wants to use the program
    but not have the authority, will need suid bit to run the program temporarily.


    To set SUID bit, chmod u+s <file_name> command is used. To find the files which
    have suid bit, we use find / -perm -4000 command.


    §'
  merge: -1
  img_proc: true
