- pgno: 25
  md: "# 26 | Master of Linux Commands\n\nLinux systems have very strong support system.\
    \ There is a large help documentation which includes using the parameters of the\
    \ command arguments on the command line and/or how to use an application. Usually\
    \ help subjects come with applications which are already installed or newly set\
    \ up. There are some options that you can get help while using the commands. You\
    \ can use these help documents when you struggle with commands.\n\n# Help\n\n\
    You can get information about how to use Is command using Is --help that we will\
    \ explain later.\n\n```\nroot@kernel:~# ls --help\nKullan: ls [SECKEN] [DOSYA]...\n\
    List information about the FILES (the current directory by default).\nSort entries\
    \ alphabetically if none of -ctftux nor --sort is specified.\nMandatory arguments\
    \ to long options are mandatory for short options .\n-a, --all do not ignore entries\
    \ starting with .\n-A, --almost-all do not list implied . and .\n--author with\
    \ -l, print the author of each file\n-b, --escape print-style=escapes for nongraphic\
    \ characters\nscale size=SIZE before printing them; e.g.,\n--block-size=SIZE prints\
    \ sizes in units of \n1,048,576 bytes; see SIZE format below\n-B, --ignore-backups\
    \ do not list implied entries ending with ~\n```\n\nYou can get help either this\
    \ or like help <command>"
