    rsyslog 576 root 11w REG 8,1 59873 669241 /var/log/daemon.log

    rsyslog 576 root 12w REG 8,1 278171 669242 /var/log/user.log

    xorg 608 root 0w REG 8,1 206874 723878 /var/log/xorg.log

    root@kemal:~#

    ```


