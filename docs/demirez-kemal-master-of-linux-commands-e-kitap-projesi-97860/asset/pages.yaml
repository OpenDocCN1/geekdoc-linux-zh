- pgno: 188
  md: '# Regular Expressions


    Regular expressions are used in programming and in some Linux shell process. They
    provide us easiness in many areas. They often us e forgot the information we need
    from such kinda, control of user input, etc.. For example, while searching an
    given template is an easy job, we need to use regular expressions to get the search
    complex and large files. They are not only beneficial in the search process, also
    we can use them for operations to be applied to search procedures.


    Now let''s explain some of the regular expressions used by a Linux system and
    do a few examples:


    +   - Character in the square brackets indicates the desired template to use.
    For example, to list the phrases beginning with A, and h or l in users.txt file,
    we use grep A[hl] users.txt command.


    ```

    root@kemal:~# cat users.txt

    Ali

    Ahmet

    Aslan

    Mehmet

    Zeynep

    root@kemal:~# grep A[hl] users.txt

    Ali

    Ahmet

    root@kemal:~# _

    ```


    To find the phrases starts with A and continue with a character between a-z, we
    can use grep A[a-z] users.txt command.


    ```

    root@kemal:~# grep A[a-z] users.txt

    Ali

    Ahmet

    Aslan

    root@kemal:~# _

    ```'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'The dot (.) As indicated by the point would be stated that there can be any
    character.


    ```

    root@kemal:~# cat test

    adana

    ankara

    konya

    izmir

    root@kemal:~# grep a.a test

    adana

    ankara

    root@kemal:~#

    ```


    The asterisk (*) Refers to any character in any number.


    ^ : It corresponds to the beginning of the line.

    $ : It refers to the last row.


    ```

    root@kemal:~# cat /etc/passwd | grep bash$

    root:x:0:0:root:/bin/bash

    postgresql:x:122:122:PostgreSQL administrator,,,/var/lib/postgresql:/bin/bash

    zeynep:x:1000:1001,,,/home/zeynep:/bin/bash

    root@kemal:~#

    ```


    [^.] With the exception of the characters in the cluster corresponds to any character.


    ```

    root@kemal:~# cat test

    adana

    ankara

    konya

    izmir

    123

    456

    789

    root@kemal:~# cat test | grep [^0-9]

    adana

    ankara

    konya

    izmir

    root@kemal:~# ~

    ```'
  merge: -1
  img_proc: true
- pgno: 190
  md: '\n\}: : It indicates that the previous character is repeated n times.


    \{n,m\} : It indicates that one previous character itself, repeated min n times
    and maximum m times.


    \{n,\} : It indicates that at least ten times the previous character.


    + : It indicates that the previous character is one or more.


    \? : It indicates that the preceding character zero or one me.


    \ : It refers to the previous or next character.


    \(\.) : Define regular expressions as a group.


    \ : Ensures special characters perceived as normal characters.


    # Examples:


    a?b : b,ab...


    a[^a-z] : a0, a1, aZ,...


    ^a : Words with a at the beginning of the line


    ^zzz or ^z\3\} : Words with 3 z characters at the beginning of the line


    \{3|5\}+ : : words with 3 or 5 numbers in least once


    <Zey> : Find the line that starts with Zey


    yî> : finds the lines with the end yi'
