  md: '# Vi-Vim


    The most famous and most capable editor in Linux which you can use with the commands
    from the terminal is Vi editor. Today, there are also type of Vi editors which
    also have visual interface (gvim), but users generally prefer to use the commands
    from the terminal. The old name of this tool is Vi, however it''s chaged to current
    name of VIM (Vi improved). Vi is a symbol of the UNIX tradition. VIM is an improved
    version of the Vi''s.


    To open the editor in a normal way, we need to use the vim command. With this
    command, our editor, terminal/console will be opened and be as follows:


    ```

