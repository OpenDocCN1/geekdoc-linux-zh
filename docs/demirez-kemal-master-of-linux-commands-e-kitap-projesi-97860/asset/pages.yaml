  md: '# 92 | Master of Linux Commands


    There are two basic commands in linux system we use to copy and move files. These
    are cp and mv commands. Cp command is used for copying, the mv command is used
    for moving.


    # Cp


    As the copy command, using the form of cp command is as cp <source> <target>.
    So, for example, to copy the fileA to another location on the fileB name file
    we use the cp fileA fileB command.


    Let''s see it with an application. For example, I want to copy testA under zeyno
    directory (folder) to use /home directory as testB name. For this I need to use
    cp zeyno/testA /home/testB


    ```

    root@kemal:~# cp zeyno/testA /home/testB

    root@kemal:~# cd /home

    root@kemal:/home# ls -l testB

    -rw-r--r-- 1 root root 0 Kas 15 23:42 testB

    ```


    If you think that you are not careful, you can use cp command -i. So if you have
    an old file of the same name, you receive a warning before writing on it (interactive).
    Data copying occurs with your confirmation.


    ```

    root@kemal:~# cp -i zeyno/testA /home/testB

    cp: `/home/testB'' üzerine yazılsın mı?n

    root@kemal:~# _

    ```


    For example, when working in zeyno directory, to copy sample, test and testA files
    under /home/zeynep directory, we can use cp sample test testA /home/zeynep command.


    ![](img/aa6ce54dbb8ffe5b9d7befb8c6764064_91_0.png)'
  merge: -1
  img_proc: true
- pgno: 92
  md: '```

    root@kemal:~ cd zeyno

    root@kemal:~/zeyno# ls

    sample test testA

    root@kemal:~/zeyno# cp sample test testA /home/zeynep

    root@kemal:~/zeyno# cd ../../home/zeynep

    root@kemal:/home/zeynep# ls

    KS MATERYAL sample test testA

    root@kemal:/home/zeynep# _

    ```


    Here''s a little reminder. If you are wondering why we use cd

    ../ cd the above example, we work with root as

    home directory (ie /root), with root (/) are very different from

    each other. When our home directory zeyno under

    home directory we work, /home directory a root directory is

    under the root directory (ie/).


    ```

    root@kemal:~# pwd

    /root

    root@kemal:~# cd /

    root@kemal:/# pwd

    /

    root@kemal:/# cd _

    root@kemal:~# _

    ```


    You can not just copy files but you can also copy

    directories. To copy a directory we use -r (recursive) parameter.

    So we also copy everything under the directory. For example, it

    is used as a command cp -r dir1 dir2. We talked about copy

    the directory in this section, deleting the indexing and also

    would like to explain in the next section.


    ```

    root@kemal:~# cp -r zeyno /home/zeynep

    root@kemal:~# cd /home/zeynep

    root@kemal:/home/zeynep# ls

    KS MATERYAL sample test testA zeyno

    root@kemal:/home/zeynep# _

    ```'
  merge: -1
  img_proc: true
