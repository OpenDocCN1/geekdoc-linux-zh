- pgno: 193
  md: 'In Sed (stream editor) and awk commands, I will talk about

    t use of sed, first. In fact, sed and awk rather can be called as

    programs rather then commands. We use them as commands

    from the console, but keep in mind both of them are very

    advanced and flexible tools.


    # Sed (Stream Editor)


    We can make some changes in to the text documents using

    the sed program. We can do this process by entering

    commands directly from the console or ensure the commands

    get from a file. The operators/parameters we can use when

    performing tasks / parameters are as follows:


    +   -n: Just make application to the specified lines only.


    +   -e: The next command is a modify command


    +   -f: The next statement is a file name (that is to take input from

    (file))


    +   p: Print


    +   d: It means delete


    +   s/before/after/g : This operation, phrases within a text file

    can be changed. If g at the and not added, it will be the first

    mold base in each row instead of the entire file.


    When using sed regular expressions can also be used. Below are

    some examples:


    +   5d: 5: delete the 5th line


    +   /^$/d: delete all empty lines'
  merge: -1
  img_proc: true
- pgno: 194
  md: 's/*$//: Delete spaces at the end of each row


    /abc/d: deletes all rows with abc statement


    s/00*/0/g: type singlele instead of sequential zero,


    sed -e "s/apple/orange/g" -e "s/prg/program/g" : for multiple replacing at the
    same time, -e can be used.


    s/\.\&lg: The characters after the point will be shifted to the new line.


    10,20d: Delete line 10 from line 20 (including 10 and 20 lines)


    ^\*\*\*\$/d: Delete all the lines which have ***** all in row


    sed -e "s/[^|]*\*/" <file>: remove tab and space character in the specified file


    Let''s see a few examples of the use of sed. For example, erase the second line
    of the content in a test file. For this we can use sed -e "2d" test command.


    ```

    root@kemal:~ cat test

    Zeynep

    kemal

    Ceren

    cenK

    Zengin

    Best of Linux

    root@kemal:~ sed -e "2d" test

    Zeynep

    Ceren

    cenK

    Zengin

    Best of Linux

    root@kemal:~ _

    ```'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 196 | Master of Linux Commands


    Now to replace one word with another in the text, lets use sed -n "s/Linux/Hacking/p"
    test command.


    ```

    root@kemal:-# cat test

    Zeynep

    kemal

    Ceren

    cenK

    Zengin

    Best of Linux

    root@kemal:-# sed -n "s/Linux/Hacking/p" test

    Best of Hacking

    root@kemal:-#

    ```


    As you can see we change the word and what is written on the screen with p. We
    use -n to print the lines containing the word changes on the screen.


    Let''s change the words in a text and see what the use of g parameter. We want
    to replace the Linux word in our file with Kali. First we should use cat tests
    | sed "s/Linux/ Kali /" command, then we use cat test | sed "s/Linux/Kali/g" command,
    and let''s look at our differences.


    ```

    root@kemal:-# cat test

    Best of Linux

    Linux

    Debian Linux and CentOS Linux

    root@kemal:-# cat test | sed "s/Linux/Kali/"

    Best of Kali

    Kali

    Debian Kali and CentOS Kali

    root@kemal:-# cat test | sed "s/Linux/Kali/g"

    Best of Kali

    Kali

    Debian Kali and CentOS Kali

    root@kemal:-# _

    ```


    As seen, if the g not added to at the end of the command, instead of the whole
    file, operation is performed on the first mold base in each row.'
