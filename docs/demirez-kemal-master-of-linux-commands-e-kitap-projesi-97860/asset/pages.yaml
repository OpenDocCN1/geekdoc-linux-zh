- pgno: 118
  md: 'Let us explain what does umask means: the umask value as it is 022, lets classify
    it as the number of 0 2 2 seperated points. Then chain each number to three-digit
    binary number (binary). Like 0 2 2 : 000 010 010. Let''s write this with a template
    with one under the jurisdiction codes as “rw- rw- rw-” and “rwx rwx rwx”.


    | for files | for folders |

    | rw- rw- | rwx rwx rwx |

    | 000 010 010 | 010 010 010 |

    | file to add -> | rw- r-- r- | rwx r-x r-x |


    Like that, after writing one under the authority templates and binary numbers,
    let''s do a different collection process, and let''s find the authority will be
    appointed. In this collection, which will not be the touched under the jurisdiction
    of 0, but came under the authority of 1 will be removing. According to this process,
    for files rw-r--r-- for directories rwxr-xr-x results will occur.


    # Chattr


    Sometimes you can delete a file by mistake. Or you can edit the configuration
    file, but when the system is restored, you will see that you edited settings disappear.
    To avoid situations like these chatter command is available. Lets explain it with
    an example. For example, we have a file called users.txt, and do not want to make
    any changes on this file. Even as the root user if we try to make a change by
    mistake, you will be blocking. For this, we use chattr +i users.txt command.'
