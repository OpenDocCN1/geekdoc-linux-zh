- pgno: 163
  md: '# 164 | Master of Linux Commands


    Linux systems has two connection types: hard link (connection) and symbolic link.
    The difference between these connection types: established a connection file with
    hard link, the other file is a copy literally. Even if the original file deleted
    the file created with solid link remain created. Connection files created by symbolic
    links (soft-link) are used for a shortcut in a real term. Function of this file
    is only redirecting to the original file.


    # Inode


    What we call the inode is a structure that contains meta data about the file like
    the access number, etc. as. Normally, each inode is unique. But the inodes of
    the files created with solid link are the same. df -i command is used to view
    the inode table. Now we see the example that explains all. We said, each inode
    number is unique. To examine this inode (node) of the numbers, we use the ls -li
    command.


    ```

    root@kemal:# ls -li

    toplam 36

    171562 drwxr-xr-x 2 root 4096 Agu 22 10:10 Dodger

    171559 drwxr-xr-x 2 root 4096 Eyl 13 00:44 Downloads

    171561 drwxr-xr-x 2 root 4096 Agu 22 10:10 Genel

    171558 drwxr-xr-x 2 root 4096 Kas 10 17:57 Masaüstü

    171563 drwxr-xr-x 2 root 4096 Agu 22 10:10 Müzik

    171564 drwxr-xr-x 2 root 4096 Agu 22 10:10 Resimler

    171560 drwxr-xr-x 2 root 4096 Agu 22 10:10 Şablonlar

    171565 drwxr-xr-x 2 root 4096 Agu 22 10:10 Videoolar

    197539 drwxr-xr-x 2 root 4096 Kas 18 00:53 zeyno

    root@kemal: -#

    ```


    The numbers that appear in the left-are inode numbers. Soon as we will see from
    the examples, the files with tsame inode numbers also have same file permissions
    and some contents. The fact that files with the same inode number are identical
    to each other.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Hard Link


    In command is used for hard link connectivity. Now let''s create one file and
    make a hard link to this file.


    ```

    root@kemal:~/zeyno# ls

    root@kemal:~/zeyno# touch test

    root@kemal:~/zeyno# ls

    test

    root@kemal:~/zeyno# ln test testlink

    root@kemal:~/zeyno# ls

    test testlink

    root@kemal:~/zeyno# ls -i test testlink

    1975922 test 1975922 testlink

    root@kemal:~/zeyno# _

    ```


    As is seen in the above example, first we create a file called test with touch
    test command. After that we created a hard link called testlink with In testlink
    command.. Then we look at the inode of the file with ls - test testlink command
    and we saw the same inode number. We acually said files created by hard link are
    the same files. When any data added to a file''s contents, this data must be added
    to the other files automatically. Let''s try. Now let''s write some expressions
    into test file and check other files made two hard link.


    ```

    root@kemal:~/zeyno# test testlink

    root@kemal:~/zeyno# echo "linux commands" > test

    root@kemal:~/zeyno# cat test

    linux commands

    root@kemal:~/zeyno# cat testlink

    linux commands

    root@kemal:~/zeyno# _

    ```'
  merge: -1
  img_proc: true
