- pgno: 274
  md: '# Log Files


    Log files are the files where records relating to work done kept on the system.
    These files are located /var/log index.


    ```

    root@kemal:~# ls /var/log samba

    alternatives.log dpkg.log lastlog macchanger.log speech-dispatcher

    apache2 dradis stunnel4

    apt exim4 messages syslog

    auth.log fail2 mysql.sql user.log

    bootstrap.log config.log wtmp

    btmp mysql.log Wvdialconf.conf

    chrootkit gdm3 nptaps Xorg.log

    demon.log initsim postgres Xorg.log.old

    debug installer redis

    kern.log

    ```


    Log files are divided into several categories. While some of them found as files,
    some of located as subdirectories and folders. In general, a service of the log
    file is saved with that service name. For example, when we look at the auth.log
    file see information about the users of the session.


    ```

    root@kemal:~/var/log cat auth.log[524]: New set seat0.

    Nov 22 11:07:26 kemal system-log[524]: Watching system buttons on /dev/input

    events(Power Button)

    Nov 22 11:07:26 kemal system-log[524]: Watching system buttons on /dev/input

    event6(Video Button)

    Nov 22 11:07:26 kemal system-log[524]: Watching system buttons on /dev/input

    event4(Left Switch)

    Nov 22 11:07:26 kemal system-log[524]: Watching system buttons on /dev/input

    event3(Slee Button)

    ```


    Another log file user.log stores process records in.


    ```

    root@kemal:~/var/log cat user.log

    Nov 22 11:07:26 kemal mtp-probe: checking bus 1, device 2: "/sys/devices/pci0000:00:14.0/usb1/1-2/id0000"

    Nov 22 11:07:26 kemal mtp-probe: device 1 was not on an MTP device

    Nov 22 11:07:32 kemal gdm-Xorg:[616]: X Server 1.17.2

    Nov 22 11:07:32 kemal gdm-Xorg:[616]: Release Date: 2015-06-16

    Nov 22 11:07:32 kemal gdm-Xorg:[616]: X Protocol Version 11, Revision 0

    Nov 22 11:07:32 kemal gdm-Xorg:[616]: Building Operating System: Linux 3.16.0-4-a

    s64 1086 Debian

    ```


    ![](img/aa6ce54dbb8ffe5b9d7befb8c6764064_274_0.png)'
