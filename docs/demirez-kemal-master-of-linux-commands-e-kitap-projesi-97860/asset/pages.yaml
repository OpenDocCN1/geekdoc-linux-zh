  md: 'In Linux terminal, a dot (.) sign indicates the directory we are working at
    the moment. For example when we use “cp /etc/issue.” command, issue file is copied
    up to the etc directory that we worked at that time.


    ```

    root@kemal:-# ls

    Belg dweller Masaüst Resimler Video

    Downloads Genel Müzik Sablonlar zeyno

