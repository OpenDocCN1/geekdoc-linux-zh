    000000 BIOS-e820: mem 0x0000000200000000-0x00000002ffffffff reserved

    000000 BIOS-e820: mem 0x0000000300000000-0x00000003ffffffff usable

    ```


    Of course, if you want to list the kernel messages based on

    cany criteria you can use dmesg. For example dmesg | grep fail.

    You can also use dmesg -c to delete kernel log records.'
