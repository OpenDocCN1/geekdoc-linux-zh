- pgno: 266
  md: '# Wget


    To download from the console we can use an easy and handy wget tool. Usage format
    is basic wget <parameter> <file_road>


    One of the most important features wget have the ability to continue where it
    left off. -c parameter is used for this. example wget -c <site.com/file_name>
    (-c:contuntie)


    To download a directory or site completely, wget -r <site_name>(-recursive) command
    should be used.


    ```

    root@kemal:~$ wget -r http://www.facebook.com/

    --2015-11-21 17:40:56-- http://www.facebook.com/

    www.facebook.com (www.facebook.com) çözleniyor... 31.13.93.36, 2a03:2880:f01c:

    face:b678:25de

    www.facebook.com (www.facebook.com) [31.13.93.36:80] bağlantılar kur

    ultdu.

    HTTP isteği gönderildi, yanıt bekleniyor... 302 Found

    Ver: https://www.facebook.com/ [izlenen]

    --2015-11-21 17:40:56-- https://www.facebook.com/

    www.facebook.com (www.facebook.com) [31.13.93.36:443] bağlantılar ku

    ruldlu.

    ```


    When we look, we see that the downloaded site saved.


    ```

    root@kemal:~# cd www.facebook.com/

    root@kemal:~~/www.facebook.com# ls

    index.html robots xt unsupportedbrowser?_fb_noscript=1

    ```


    You to make multiple downloads, you can create a txt file which has all download
    addresses in it and you can download all files once. wget -i textfile.txt


    To download specific files -A parameter used. For example, if you want to download
    only jpg and png files from a website you can use wget -r -A jpg.png <site.com>
    command.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# 268 | Master of Linux Commands


    ```

    root@kem:~# wget -r -A .jpg http://www.9sn.net

    --=2015-11-21 17:50:30-- http://www.9sn.net/

    www.9sn.net (www.9sn.net) indiriliyor... from 212.83.198.73

    www.9sn.net gönderildi, yanıt bekleniyor... [212.83.198.73]: baglaniliyor...,
    baglanti kuruldu.

    HTTP istegi gönderildi, yanıt bekleniyor... 200 OK

    Ürunuk: 2112 2084B [html]

    Kayit yerli: www.9sn.net/index.html

    www.9sn.net/index.h 100%=================> 28,53K 68,9KB/s içinde 0,3s

    2015-11-21 17:50:40 (68,9 KB/s) www.9sn.net/index.html kaydedildi [2123/211

    23]

    robots.txt yukleniyor: lütfen dosyayin yoksin.

    --=2015-11-21 17:50:40-- http://www.9sn.net/robots.txt

    Baglanti tekrar kullaniliyor: www.9sn.net:88.

    ```


    Download all the files except a specific file use **-R (--reject)** parameter.
    For example, to download everything except jpg and png files, except: **wget -r
    -R .jpg,.png <site.com>** command should be used


    To repeat the download process in case of an error, -t parameter is used. For
    example **wget -t6 <site.com>**


    §'
