- pgno: 169
  md: '# 170 | Master of Linux Commands


    Installing a program in linux is quite different than windows and is actually
    very simple. We have several possibilities to set up a Linux program. One of these
    options is to establish the desired program by compiling from source code. Second
    option, to install of the software with the package management system in accordance
    with the distribution we use. Another option is to make automated testing repository
    installation of storage used by the distribution.


    Compiled and become ready to use with package management system files are called
    packages. Different package files are used for diffrent Linux systems. Today,
    majority of Linux distribution use two types of package type. While RedHat/CentOS/Fedora
    and similar distributions use the rpm package, Debian / Ubuntu Linux distributions
    and similars different package used. Of course, to install this installation packages
    different package management systems used. Again RedHat/CentOS/Fedora distribution
    use dpkg package manager. These are manual package management system. As well
    there are programs downloaded and installed automatically. These are the rpm package
    for distribution using yum, deb package for distribution the apt package manager..


    Now first examine Debian-based Linux distributions how to set up the program,
    remove the program, the system update process then we will check RedHat based
    systems works.


    §'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Dpgk


    Debian/Ubuntu Linux distribution base is a mangament system which uses deb. The
    program installed by manually. For example, if you want to install Opera web browser
    on your system you need to download the debkg package of the Opera browser. The
    program package has a similar name as such:


    ```

    root@kemal:~# ls -l opera_12.16.1860_i386.deb

    -rw-r--r-- 1 root root 13063000 Kas 20 15:14 opera_12.16.1860_i386.deb

    root@kemal:~#

    ```


    As seen, deb package is ready to be installed. We give the command with specifying
    the path to the directory which our packet is in. For example, I saved the file
    in my home directory (home), so I use the command like dpkg -i <package.deb> If
    you press the tab key by typing the first letters of the name of a deb package,
    command will automatically be completed. For example, when you are completing
    typing dpkg -opera.


    ```

    root@kemal:~# dpkg -i 12.16.1860_i386.deb

    Daha önce seçili olan paketler açılıyor.

    (Veritabanı hazırlığı ongoing ... opera_12.16.1860_i386.deb ...)

    Paket açılıyor ... 329017 dosya ve dizin kuruldu.

    Paket açılıyor (opera_12.16.1860)

    Alternatifler: /usr/bin/x-browser (x-browser) alternatifini sağlayan

    asi-alternatifleri:/usr/bin/google-browser (google-browser) alternatifini sağlayan

    işlemi /usr/bin/opera otomatik olarak kullanılıyor

    Tetkleyiciçiler: (2.7.8-5)

    Tetkleyiciçiler manager (2.17)

    Tetkleyiciçiler menu (3.11.3-6)

    Tetkleyiciçiler desktop-file-utils (0.22-1)

    Tetkleyiciçiler image-support (3.5.10)

    Tetkleyiciçiler shared-mime-info (0.13-1)

    Tetkleyiciçiler hicolor-icon-theme (0.13-1) \

    root@kemal:~# _

    ```


    It is simple to install deb files. For example, if you have more than one deb
    files in the same folder for installation, you can use dpkg -i *. command. With
    this command all deb files to be installed.'
