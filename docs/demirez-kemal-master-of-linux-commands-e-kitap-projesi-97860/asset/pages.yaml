  md: "# 250 | Master of Linux Commands\n\n# Ssh Service\n\nSSH is a protocol that\
    \ provides secure connections, to be made in the local network or remote connection\
    \ between the two systems. All network traffic is encrypted, data security connection\
    \ is provided between the two systems.\n\nUser information sent as encrypted to\
    \ the server while connection made. Also, while the data transfer made with special\
    \ encryption between the client and the server, the data transfer performed. SSH\
    \ services have to be running on both systems which will be connected thru SSH\
    \ connection. prefered Porteux Linux distribution as it is a lightweight Linux\
    \ distribution and Kali 2.0 system(which I have been using already) on my examples.\n\
    \nLet's see how to set up SSH connection by step. First we are using service ssh\
    \ start command to start ssh service in Kali system.\n\n```\nroot@kimal:~# service\
    \ ssh start\nroot@kimal:~# service status\nssh.service - OpenBSD Secure Shell\
    \ server\nLoaded: Loaded (/lib/systemd/system/ssh.service; enabled)\nActive: active\
    \ (running) since Cum 2015-11-27 23:47:07 EET; 8s ago\n```\n\nAs a second step,\
    \ we use the ifconfig command to learn my address in Kali system (if you connect\
    \ via wireless you can use the ifconfig wlan0).\n\n```\nroot@kimal:~# ifconfig\
    \ wlan0\nwlan0      Link:ether 34:5d:5c:95:0f:ec\n       inet:192.168.43.22 Bcast:192.168.43.255\
    \ Mask:255.255.255.0\n       inetaddr:fe80::ff00:42fe:66f:68/64 Scope:link\n \
