- pgno: 269
  md: "# 270 | Master Linux Commands\n\n# Cron-Crontab\n\nOn the Linux operating system,\
    \ it is possible to edit some of the work you want to do in specific time range.\
    \ Means, you can delete some log files on time you scheduled, and you can schedule\
    \ any processyou want. It is possible to schedule every job with cron service.\n\
    \nYou can use service cron status command to get information about the status\
