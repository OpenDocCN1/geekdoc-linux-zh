- pgno: 10
  md: '# Intro


    There are many books written about Linux operating system so far and it will continue
    to be. Each book is a unique method of expression and a path to follow. I, as
    a Linux lover, also wanted to say a few words in this field. My work is just about
    that. I stood on the issue was the using of Linux commands. Of course, there are
    many resources relates to this issue both printed and on the internet. I can say
    there are some differences in this book. What are those differences? For example,
    I chose simple explanation, I did not care too much with the details, which is
    to me unnecessary, and also could be exhaustive for user / reader unnecessarily.
    I elaborate on more practice that will benefit command to use, I try to add images
    on the use of almost every command, and through a rigid categorization. I tried
    to explain that I deem necessary, rather than being grouped in topics, etc. Of
    course, all work can be done much better all the time. I wish to be helpful to
    all readers.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# # Chapter-1


    # ## Bash and the Linux Command Line'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'If you start to use the Linux operating system, the first concepts you need
    to learn is linux terminal (console) and Linux command line concepts. We will
    talk about them, but first, the Linux kernel is worth talking about. Kernel is
    the heart of an operating system. In the Linux world, it refers to itself as linux.
    So when we''re talking about the Linux, we talk about kernel. Actually the correct
    term for this, the GNU Linux. nowadays it is used to express the same thing as
    Linux and GNU Linux. I will use it in for this term.


    After this preamble, let''s continue to explain the kernel. Kernel is the heart
    of the operating system. Kernel’s most important task is to provide hardware-software
    communications. Another important task is to check of the system memory and the
    system running processes. All actions should be an intermediary together between
    the users of the system for processing with input from the user system. Even if
    we use a graphical user interface (GUI), or we only work with commands, it does
    not make any difference, all transactions happens on the background with interpreted
    commands. In Linux we run this process with a system called command line which
    take a shell program by working through the basic structure. Linux terminal (console),
    provides us with a very flexible and useful structure for the works we want to
    do in the system. Flexible structure of this measure skills of shell program performance
    are satisfactory.'
  merge: -1
  img_proc: true
- pgno: 13
  md: "# 14 | Master of Linux Commands\n\n# Shell\n\nShell is taking place between\
    \ the user and kernel tasks, interprets commands from the user to communicate\
    \ with the kernel. Kernel and shell's interaction happens through with the system\
    \ calls.\n\nThere are many shells are used in Linux systems but the most preferred\
    \ programs are BASH shell program. To learn using shell program in our system,\
    \ we can use the echo $SHELL command.\n\n```\nroot@kemal:~# echo $SHELL\n/bin/bash\n\
    root@kemal:~# \n```\n\nThe console commented our order and sent us an outcome.\
    \ We said it would also reviewed the commands issued from the console, but it\
    \ will be interpreted according to what? That point, environmental variables come\
    \ play into concept.\n\n# Environment Variables\n\nWe will use the following command\
    \ and check what command try to explain to us to get the subject. The command\
    \ we will use is echo $ PATH command\n\n```\nroot@kemal:~# echo PATH\n/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/bin\n\
    root@kemal:~# \n```\n\n§"
  merge: -1
  img_proc: true
- pgno: 14
  md: 'What does this command output tell us? What it wants to say is: I need to look
    at some index respectively for operating a command entered from the console. If
    the executable file is under the command of these directories, I can run it. If
    that path (PATH) is attached than ":" sign to the structure formed by the divided
    statement seperated by that statement (PATH) it is called environment variables.


    We can use the printenv or env commands to see the environment variables for working
    environment at any time.


    ```

    root@kemal:~# env

    XDG_VTNR=7

    SSH_AGENT_PID=922

    XDG_SESSION_ID=1

    GPG_AGENT_INFO=/run/user/0/keyring/gpg:0:1

    TERM=xterm

    SHELL=/bin/bash

    XDG_MENU_PREFIX=gnome-

    VTE_VERSION=3801

    GJS_DEBUG_OUTPUT=stderr

    WINDOWID=29360139

    GJS_DEBUG_TOPICS=JS ERROR; JS LOG

    USER=root

    ```


    Now, let''s see what the command output is also seen in medium / environment or
    shell variables means:


    +   PATH: When a command is given, searches the directories of the files that
    make up the command program.


    +   HOME: Contains the variable name of user''s personal directory (home directory).


    +   TERM: The variables associated with the X server which the graphic screen
    images to be sent.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# 16 | Master of Linux Commands


    SHELL: It is the name of the current running shell scripts locations.


    For example, you want to program to operate with a command which given directly
    from the console. Means you don''t want to run the command under the directory,
    you want to add PATH on the line so the appropriate command would work directly.
    For this you must add the directory to the path. If your program is in /usr/local/prog
    directory, you can add it to the path by giving the following command:


    # PATH=$PATH:usr/local/prog


    We said we can also learn the name of the environment variable with the command
    echo $ PARAMETER_NAME. But let''s say we want to change the value of an environment
    variable. To do this, we use the following command pattern.


    ```

    export PARAMETER_NAME =value

    ```


    If you want to make this change to be permanent in system, you need to include
    this statement in the .bashre file. Because when the system starts it will open
    the file and operate by the values of the file.


    # Assign Shortcut Keys For Terminal


    Because we use lots of works done in Linux thru the console we have to use command
    line frequently. In this case, to do our work with more easily and efficiency,
    there are some console shortcuts and variety of methods to get things done more
    easily. The aim is to use the Linux system consoleleeasily and efficiently.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'First, we can create a shortcut key combination to open the terminal. This
    is the menu for the system settings (Kali 2.0) keyboard and we choose the keyboard
    and open the shortcut menu.


    | Yazma | Kısayollar | |

    |---|---|---|

    | Başlatıcılar | Yardım çalıştır | Kapalı |

    | Ekran Görüntüleri | Ayarlar | Tool |

    | Evsel Erişim | Hesap makinesini çalıştır | Calculator |

    | Geinti | E-posta istemcisini çalıştır | Mail |

    | Pencereler | Web tarayıcısını çalıştır | WWW |

    | Ses ve Ortam | Ev Klasörü | Explorer |

    | Sistem | Arama | Search |

    | Yazma | | |

    | Özel Kısayollar | + | |


    Bir kısayolu düzenlemek için, ilgili satıra tıklayın ve tuşlara da temizlemek
    için Backspace tuşuna basın.


    To fix the new shortcut, click on the + sign on the bottom side. We organize pop-up
    box as below.


    ![](img/aa6ce54dbb8ffe5b9d7befb8c6764064_16_0.png)


    After editing this way, we press the Add button. The main screen opens after this
    and we see a line with Terminal Closed written. After right-click on this line,
    New accelerator.. warning appears, we use the ctrl + alt + T on keyboard as we
    assigned terminal shortcut to these keys. We can now easily open a Linux terminal
    using this key combination.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Alt+F2


    Using Alt + F2 to open a box allowing us to run programs and commands and typing
    gnome-terminal in the box we can also open the command line. In fact, the shortcut
    we assigned Ctrl + Alt + T key is a shortcut of this command.


    # Bash Shell Shortcuts


    When using the bash shell (writing the script) some shortcuts can simplifies our
    work. Most of these shortcuts are listed below. You can be more practical with
    exercising them frequently.


    +   - ctrl+A: Move the cursor to the beginning of the line.

    - ctrl+E: Move the cursor to the end of the line.

    - ctrl+B: The cursor goes one character back.

    - ctrl+F: The cursor goes one character further.

    - alt+B: The cursor goes one word back.

    - alt+F: The cursor goes one word further.

    - ctrl+XX: The cursor goes and returns from its location to beginning of the line.

    - ctrl+L: Clears the screen and the cursor goes all the way to the top (same as
    clear command)

    - ctrl+U: Everything left of the cursor will be deleted.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Kemal Demirer | 19


    +   - **ctrl+K**: Everything right of the cursor will be deleted.


    +   - **esc+T**: Cursor replaces the previous two words.


    +   - **ctrl+C**: Cuts the command.


    +   - **ctrl+Z**: Assigns running applications to the background. With bg command,
    the process will continue working in the background, it can be taken forward with
    the **fg** command.


    +   - **ctrl+D**: Stops the terminal (same as **exit** command)


    +   - **Tab**: It provides auto-completion. In this case, both the file / directory
    is available for commands. For example, you may not remember exactly the command
    you want to use, and you type the first few letters. Once you press the Tab key
    it will complete that command. If you press the Tab key in a row, it will show
    all the possible commands starting with letters that you wrote.


    +   - **ctrl+H**: As Backspace key deletes characters to the left.


    +   - **ctrl+R**: Search through previously used commands and lets you perform
    actions as re-use that command.


    You can learn these shortcuts we listed above by doing lots of practicing than
    they become permanat habit.


    # Open Multiple Consoles


    In linux system you can open many consoles and work independent sessions simultaneously.
    You can open 6 separate consoles simultaneously and you can separate process.
    From X session (it can be called as graphical user session) to switch to the console,
    **<Ctrl + Alt> <Fn> (n = 1, ... 6)** keys are used.


    §'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'return to the session X, Ctrl + Alt + F7 is used. Yes, we can open 6 virtual
    terminal from F1-F6. If the system is in use, <ctrl + alt + Fn>(n = 7, ..., 12)
    can also switch between X servers.


    # Simultaneous Use of MultiplenCommands On the Command Line


    In terminal / console, you can use multiple commands simultaneously. To do this,
    simply use semicolon to separate the commands. For example, ls /etc output of
    the command will be as follows:


    ```

    root@kemal:-# ls /etc

    Belgeler dhelper Masaüstü Resimler Videolar

    Downloads Genel Müzik Şablonlar

    adduser.conf ImageMagick-6 iceweasel

    adjime profile.d

    alias idmapd.conf proxychains.conf

    alternatives ifplugd intd.conf all

    amap purple

    anfforontab initsim python

    apache2 init python2.7

    apg.conf init.d

    apm init.d-initramfs-tools python3

    ```


    To run multiple commands, && operator can be used as well. This operator used
    a lot during system update operator. For example, when apt-get update && apt-get
    upgrade commands are given executing commands and systems will be updated. Now
    let''s ls && cd /etc make an example, and look at the output of the command.


    ```

    root@kemal:-# ls && cd /etc

    Belgeler dhelper Masaüstü Resimler Videolar

    Downloads Genel Müzik Şablonlar

    root@kemal:/etc# -

    ```'
