    twitter.com      mail exchanger = 30 ASPMX2.GOOGLEMAIL.com.

    twitter.com      mail exchanger = 20 alt1.aspmx.l.google.com.

    twitter.com      mail exchanger = 20 alt2.aspmx.l.google.com.

