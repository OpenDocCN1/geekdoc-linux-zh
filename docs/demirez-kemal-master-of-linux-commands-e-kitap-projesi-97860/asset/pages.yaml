  md: '# Changing User Password


    As you know, root users have the authority to do any changens on the system. Including
    all applications about users. Root user can change any user in the system at any
    time. To do this, root user must use, such as for zeynep user, its passwd zeynep
    command. If root user wants to change his password, he/she can only use passwd
    command.


    ```

    root@kemal:-# passwd zeynep

    Yeni parolayı girin:

    Yeni parolayı tekrar girin:

    passwd: şifre başarıyla güncellendi

    root@kemal:-#

    ```


    # Impersonating Another User''s Profile


    A user can impersonate other user''s identity which means works with other users
    authorities and execute some process. To do first he/she should know the user''s
    password. If you are a root user, you can work with any user''s profile.


    Before continue, lets remember w, and whoami command we mentioned earlier. With
    these commands we can see some informations such as which identity we are working
    with, identity we connect to the system with. You can see the sample use and differences
    on the table:


    ```

    root@kemal:-# w

