    Downloads Genel Masaüst Resimler Video

    root@kemal:-

    ```


    If we want to copy file to the directory at the top of the array that we work,
    we can use cp file ../ command form.


    ```

    root@kemal:-# cd zeyno

    root@kemal:-zeyno# ls

    sample test testA

    root@kemal:-zeyno# cp sample ../

    root@kemal:-zeyno# cd

