    Downloads Genel Masaüst Resimler Sablonlar zeyno

    root@kemal:-#

    ```


    # Mv


    mv command is used to move files. The use of this command same as cp command.
    For example, we use the mv issue zeyno command to move issue file which is in
    our directory under zeyno folder where we operate.


    ```

    root@kemal:-# mv issue zeyno

    root@kemal:-# cd zeyno

    root@kemal:-~/zeyno# ls

    issue sample test testA

    root@kemal:-~/zeyno#

    ```'
