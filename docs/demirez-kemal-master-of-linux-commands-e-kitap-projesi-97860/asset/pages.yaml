  md: '# Nslookup


    This command is used to make DNS queries via communicate

    with DNS server. The simplest query format is check the IP

    address with the host name. Basic usage pattern is as follows:

    slookup [options] [query]


    When using nslookup without any parameters it starts to

    operating in interactive mode. Any queries can be performed in

    interactive mode too. By default, record queries make straight

    and reverse process. So if the hostname given IP address of the

    machine will be queried, if the IP address of the machine given

    the command names of the machine.


    ```

    root@kemal:~# nslookup

    > facebook.com

    Server:         192.168.1.1

    Address:        192.168.1.153


    Non-authoritative answer:

    Name:             facebook.com

    Address:        173.252.120.68

    > 173.252.120.68

    Server:         192.168.1.1

    Address:        192.168.1.153


    Non-authoritative answers:

    name = edge-star-mini-shv-12-frc3.facebook.com.

    68.252.253.173.in-addr.arnameserver = b.facebook.com.

    120.252.253.173.in-addr.arpa internet = 69.171.239.12

    a.ns.facebook.com has AAAA 2a63:2888:ffff:c6f1:face:b00c:35

    b.ns.facebook.com internet = 69.171.255.132

    > has AAAA 2a63:2888:ffff:face:b00c:35

    ```


    On above example, we make a ip address query from the

    name first, then the name from the ip address. We use our

    command without any parameters as nslookup and > mark

    showed us that the command starts in interactive mode. Then we

    did our queries. While questioning in interactive mode, you can

    change the type of questioning at any time. For example:'
