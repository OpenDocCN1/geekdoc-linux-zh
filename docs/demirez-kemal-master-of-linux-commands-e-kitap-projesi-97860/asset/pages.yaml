    # # Tail


    One the important file is messages file. A lot of records about


    One the important file is messages file. A lot of records about system events
    kept in this file. To see the records live written on messages files, you can
    use tail -f /var/log/messages command.


    ```

    root@kemma:~# tail -f /var/log/messages

