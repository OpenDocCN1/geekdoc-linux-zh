- pgno: 63
  md: '# 64 | Master of Linux Commands


    In this chapter, we will talk about creating a file, copy, move, view the contents,
    command output file to divert etc. Here we will work files will be usually text
    files.


    Our subject order will be as follows: more than a categorical order, the place
    where the samples will be given on the use of commands when they are necessary,
    so the subject will provide more efficient processing. I think it would be a better
    narrative style.


    # Touch


    One of the easiest way to create a text file is to use the touch command. For
    example, with the touch test command, we can create a text file named as test.
    (you can give the name test.txt if you want)


    ```

    root@kemal:~/zeyno# touch test

    root@kemal:~/zeyno# ls

    test

    ```


    This command is not only to create a text file, you can also use it to update
    the existing file''s date stamp.


    ```

