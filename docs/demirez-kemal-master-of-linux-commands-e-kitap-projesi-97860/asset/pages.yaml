- pgno: 20
  md: "We also have another operator which is || operator. If we put this operator\
    \ between two commands we are using, second command runs if the first command\
    \ fails. For example, lets try abc || cd /home command:\n\n```\nroot@kemal:-#\
    \ abc || cd /home\nbash: abc: komut yok\nroot@kemal:/home#\n```\n\nAs you see,\
    \ it runs the second command.\n\n# Bash Shell Configuration Files\n\nThere are\
    \ some configuration files of bash itself. Each user can make some special arrangements\
    \ with these settings files in their shell. These files are:\n\n+   - /bin/bash\
    \ (shell itself)\n- /etc/profile (the settings file that contains the public profile\
    \ of the shell)\n\n```\nroot@kemal:~# cat profile\n# /etc/profile: system-wide\
    \ .profile file for the Bourne shell (sh)\n# and Bourne compatible shells (bash(1),\
    \ ksh(1), ash(1), ...).\n\nif [ \"$u\" -eq 0 ]; then\nPATH=$usr/local/sbin:usr/local/bin:usr/sbin:usr/bin:$bin\n\
    else\nPATH=$usr/local/bin:usr/bin/bin:usr/local/games:usr/games\nfi\nexport PATH\n\
    \nif [ \"$PS1\" ]; then\nif [ \"$BASH\" != \"bin/sh\" ]; then\n# The file bash.bashrc\
    \ already sets the default PS1.\n# PS1='\\h:\\$'\nif [ -f /etc/bash.bashrc ];\
    \ then\n /etc/bash.bashrc\nfi\n```"
  merge: -1
  img_proc: true
- pgno: 21
  md: "# 22 | Master of Linux Commands\n\n+   - ~/.bashrc (the settings file that\
    \ contains initialization bash parameters)\n\n```\nroot@local:~# cat .bashrc\n\
    # ~/.bashrc: executed by bash(1) for non-login shells.\n# see /usr/share/doc/bash/examples/startup-files\
    \ (in the package bash-doc)\n# for examples\n\n# If not running interactively,\
    \ don't do anything\ncase $-\nn  +i))\n    return;\nnesac\n\n# don't duplicate\
    \ lines or lines starting with space in the history\n# See(1) for more options\n\
    HISTCONTROL=ignoreboth\n\n# append to the history file, don't overwrite it\nshopt\
    \ -s histoptappend\n\n# for setting history length size HISTSIZE and HISTFILESIZE\
    \ in bash(1)\nHISTSIZE=1000\nHISTIFILIZE=2000\n```\n\n# Ignoreeof Configuration\n\
    \nThere are many features of the bash shell. One of them is that CTRL + D keypad\
    \ is used to exit the shell. When we press keys and we're out of the shell it\
    \ terminates shell itself. There is a regulation that can be done to prevent accidental\
    \ exit from the shell. We do this arrangement with ignoreeof. Ignoreeof arrangement\
    \ prevents to exit from the shell through CTRL + D keypads. We can organize this\
    \ in several different ways. For example, we can use set -o ignoreeof command,\
    \ to make it back to the old we we use set +o ignoreeof command.\n\nAnother command\
    \ is export IGNOREEOF=2. export IGNOREEOF = 0 can be used to restore. We can make\
    \ this arrangement permanent by writing this second command on the bottom line\
    \ of .bashrc (by typing IGNOREEOF = 2) and saving it. Thus, this adjustment would\
    \ have become permanent."
  merge: -1
  img_proc: true
- pgno: 22
  md: "The last method is to use the ignoreeof = 2 command. With this arrangement,\
    \ if you press the CTRL + D keyboard twice, we order to exit from the shell.\n\
    \n```\nroot@kemal:~# set -o ignoreeof\nroot@kemal:~# Kabuğu bırakmak için \"exit\"\
    \ kullanın.\nroot@kemal:~# Kabuğu bırakmak için \"exit\" kullanın.\nroot@kemal:~#\
    \ Kabuğu bırakmak için \"exit\" kullanın.\nroot@kemal:~# Kabuğu bırakmak için\
    \ \"exit\" kullanın.\nroot@kemal:~# Kabuğu bırakmak için \"exit\" kullanın.\n\
    root@kemal:~# Kabuğu bırakmak için \"exit\" kullanın.\nroot@kemal:~# \n```\n\n\
    As you can see when ignoreeof editing is done, it gives a warning that we can\
    \ only end the shell with exit command. Let's try the other method.\n\n```\nroot@kemal:~#\
    \ ignoreeof=2\nroot@kemal:~# Kabuğu bırakmak için \"exit\" kullanın.\nroot@kemal:~#\
    \ Kabuğu bırakmak için \"exit\" kullanın.\nroot@kemal:~# \n```\n\nAfter making\
    \ this arrangement pressing twice to CTRL + D keypad we have those warnings shown\
    \ above, we use the same keypad terminates the third time.\n\n# Noclober Definitions\n\
    \nLets give an example of the description of the set command which is also a feature\
    \ of the bash shell. Definitions are written in small letters, the reason is to\
    \ seperate them from variables which typed with capital letters. To run a definition\
    \ we use set-o definition, to remove a definition we use set+o definition. One\
    \ of these definitions command noclober works when this: the output of a command\
    \ to a file, the old contents of the file"
  merge: -1
  img_proc: true
- pgno: 23
  md: 'remains the same. The writing of other information on a file by mistake can
    be avoided with this definition. Let''s do an example: First, let''s create a
    document with the touch command, and write an expression with the help of echo
    into this document. Then check the file with cat command. Then active noclobber
    definition and lets see if we did any reengineering.


    ```

    root@kemal:~# touch important

    root@kemal:~# echo "linux bash commands" > important

    root@kemal:~# cat important

    lux bash commands

