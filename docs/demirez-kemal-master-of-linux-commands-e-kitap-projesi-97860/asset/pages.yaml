- pgno: 233
  md: "There are many scripts on Linux systems for the network.\nBut we will talk\
    \ about the use of commands usefull for us.\nWe will not discuss concepts of Networks\
    \ in detail. Those who want to obtain information from the network and can get\
    \ more detailed information from network books and from the web.\n\n# Ifconfig\n\
    \nIfconfig command is used to view the settings related to IP configuration on\
    \ Linux systems.\n\n```\nroot@local:~# ifconfig HWaddr 00:15:60:b2:71:77\neth0\n\
    \ Link:Ethernet MULTICAST MTU:1500 Metric:1\nRX packets:28 errors:0 dropped:0\
    \ overflows:frame:0\nTX packets:28 errors:0 dropped:0 overflows:carrier:0\ncollisions:0\
    \ transmitted:0\nRX bytes:1680 (1.6 KiB) TX bytes:1680 (1.6 KiB)\nInterrupt:16\n\
    lo\n Link:Loopback\n inet:127.0.0.1 Mask:255.255.255.0\nUP_RUNNING MTU:65536 Metric:1\n\
    RX packets:28 errors:0 dropped:0 overflows:frame:0\nTX packets:28 errors:0 dropped:0\
    \ overflows:carrier:0\ncollisions:0 transmitted:0\nRX bytes:1680 (1.6 KiB) TX\
    \ bytes:1680 (1.6 KiB)\nwlan0\n Link:Ethernet HWaddr 54:e6:fc:95:fc:ec\n inet\
    \ addr:192.168.1.3 Bcast:192.168.1.255 Mask:255.255.255.250\n inet6 addr:fe80::55e6:fcff:fe64/64\
    \ Scope:link\n```\n\nIn above example eth0 shows our ethernet card (network interface\
    \ card). If there are any other in the system they will also shown as, eth1, eth2.\
    \ The computer itself is shown by lo (localhost). Another phrase wlan0 refers\
    \ the wireless network and provides information about our network configuration\
    \ (IP address, MAC address, broadcast address, etc.)\n\nIf you are connecting\
    \ via wireless network and you want to see information about this network, you\
    \ can use the ifconfig command."
