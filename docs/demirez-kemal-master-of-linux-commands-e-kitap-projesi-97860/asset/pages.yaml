- pgno: 121
  md: '# 122 | Master of Linux Commands


    In a linux system, many user profiles can be created and users can perform various
    operations on the system within their authority limits. As you know, a root user
    is the top authorized user in linux system. Root user is authorized to make any
    changes in the system.


    In linux system, informations and passwords about the users are stored in two
    important files. Now let''s examine those files.


    # Shadow-Passwd


    The files which informations and passwords of the users are stored under /etc
    directory. Information about the users stored in /etc/passwd file, the encrypted
    version of the user''s password stored in /etc/shadow. When a new user is added
    to the system, the information of added user are written in these files.


    Before written in to the shadow file user passwords are encrypted using encryption
    algorithms, and kept in the file in encrypted form. This encryption process done
    by a method known as the crypt. User passwords in the system are generated as
    follows.


    +   - get the password user wants to set.

    - To be used as salt, create a string of eight characters.

    - Create an encrypted string with taking the password that you received from the
    user and work through the crypt function with the salt value.


    §'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Kemal Demirez | 123


    Above, we talked about something called salt. Now let''s see what it is. In linux
    systems, passwords storages in hash-salt formats. Hash means cryptographic summary.
    That value determines the user''s password, encrypted according to various algorithms,
    created a new encrypted. This created expression is what we call hash. Now if
    we come back to the salt, statements that identify a user''s password by adding
    salt value generated randomly, so this new expression is encrypted and written
    to the shadow file safely. Because this salt value is randomly generated by the
    system and cannot be estimated by the user, the job of an attacker who wants to
    crack passwords would be difficult.


    Again, let''s examine the crypt function mentioned above. Giving man 3 crypt command
    from the terminal, we can learn about the types of encryption. The output of this
    command is as follows.


    | If salt is a character string starting with the characters "$id$" followed by
    a string terminated by "$": |

    |$id$salt$encrypted |

    then instead of using the DES machine, it identifies the encryption method used
    and this determines how the rest of the password string is interpreted. The following
    values of id are supported:

    | ID | Method |

    |---||

    | 1 | MDS |

    | 2a | Blowfish (not in mainline glibc; in some Linux distributions) |

    | 5 | SHA-256 (since glibc 2.7) |

    | 6 | SHA-512 (since glibc 2.7) |

    So $5$salt$encrypted is an SHA-256 encoded password and $6$salt$encrypted is SHA-512
    encoded one. |


    This information means;'
  merge: -1
  img_proc: true
