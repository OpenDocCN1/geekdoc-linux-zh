- pgno: 258
  md: '# Sftp


    File transfers can be done by connecting to a remote server via sftp. Of course
    it is possible to transfer the files in the local network. File transfer can be
    made with sftp via secured connection in the systems where SSH connection used.
    We have seen how to make a ssh connection in the previous topic, and then we talked
    about copying files with scp. Now, assuming that ssh connection made, let''s see
    how to use sftp.


    Basic command usage is sftp user@host (for example, sftp root@kemal) or sftp user@ip_address
    (sftp root@192.168.43.2).


    ```

    root@porteus:~# sftp root@192.168.43.2

    root@192.168.43.2 password:

    Connected to 192.168.43.2.

    sftp> _

    ```


    As you can see, we need to enter the password first, after that the screen comes
    up showing that the connection has been made. We can get information about sftp
    command usage with the help command.


    ```

    root@porteus:~# sftp root@192.168.43.2

    root@192.168.43.2 password:

    Connected to 192.168.43.2.

    sftp> help

    Available commands:

    bye

    cd path

    chgrp path group

    chmod mode path

    own own path

    df [-l] [path]

    r

    exit

    get [-Prl] remote [local]

    help

    lcd path

    ls [-options path]]

    mkdir path

    ln [-s] oldpath newpath

    lpwd

    ls [-iahrinSt] [path]

    \Quit sftp

    Change remote directory to ''path''

    Change group of file ''path'' to ''grp''

    Change permissions of file ''path'' to ''mode''

    Change owner of file ''path'' to ''own''

    Display statistics for current directory o

    filesystem containing ''path''

    Quit sftp

    Download file

    Display this help text

    Change local directory to ''path''

    Display local directory listing

    Create local directory

    Link remote file (ce for symlink)

    Print local working directory

    Display remote directory listing

    ```'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# 260 | Master of Linux Commands


    As soon as the connection is established it means we are working on remote system.
    When we use ls command we list the files on the connected system, with lls command
    we list the files in our system.


    ```

    sftp ls

    Desktop Documents Downloads

    sftp ls

    Belgeler General Masallı

    Downloads Resimer Videoolar VirtualBox VMs

    Muriza fotololar.tar.gz test

    deneme Şablonlar

    sftp |

    ```


    Two commands used for file transfer. These commands are put and get commands.
    To copy the file on connected system we use put command and copy a file in our
    system we get command. For example, to copy important.txt file we have in our
    computer to connected computer we use put /root/Desktop/important.txt /root command.


    ```

    sftp> put /root/Desktop/important.txt /root

    Uploading /root/Desktop/important.txt to /root/important.txt

    /root/Desktop/important.txt 100% 0 0.0KB/s 00:00

    sftp> |

    ```


    When we use ls command to check the list, we can see important.txt file is in
    the list.


    ```

    sftp> ls Downloads Genel

    Belgeler Resimer Videoolar

    Müzik fotololar.tar.gz important.txt

    deneme

    Şablonlar

    sftp> |

    ```


    To copy the test file (which is saved on connected computer) to our computer we
    should use get /root/test /root/Desktop command.


    §'
  merge: -1
  img_proc: true
- pgno: 260
  md: '```

    sftp get /root/test /root/Desktop

    Fetching /root/test to /root/Desktop/test

    sftp > lls

    Desktop Documents Downloads

    sftp > lls Desktop

    Home.desktop System.desktop important.txt test

    sftp > _

    ```


    To copy a directory/folder in lieu of file, we can use the -r parameter.


    ```

    sftp get -r Belgerer /root

    Fetching /root/Belgerer/ to /root/Belgerer

    Retrieving /root/Belgerer

    sftp > lls

    Belgerer Desktop Documents Downloads

    sftp > _

    ```


    Also, the commands we can use on similar ways are:


    +   * help: The Help command. It gives lists of all commands and their function
    list

    * **put**: To copy files on to connected computer

    * **get**: Copy files from connect computer to our computer

    * **cd**: Changes the folder on connected computer.

    * **lcd**: It allows us to change folders in our own computer.

    * **rm**: delete files on the other computer.

    * **rmdir**: delete a folder on the other computer.

    * **chmod**: It allows you to change user permissions on the fi-le.

    * **ls**: Displays the contents of the folder on the other computer.

    * **ls**: Displays the contents of folders on your own computer.'
  merge: -1
  img_proc: true
