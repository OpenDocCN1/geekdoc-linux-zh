- pgno: 185
  md: '# Wildcards


    There are some parameters/methods in Linux which allows us to make our work more
    convenient and easy when using commands, and working on various operations. They
    called wildcards, these characters make most of the jobs easier when used in the
    commands. Functions of these characters are:


    +   * : Fits all kinds of characters. Especially to select all the files in a
    particular feature and making transactions with them.

    * ? : Matches any single character.

    * [a,b,c] Matches/sorponds to a b or c corresponds to one of the character.

    * [abc] : It matches the specified character list.

    * [a-c] : Matches between the characters.

    * ![abc] : Matches the characters except those in the list.

    * ![a-c] : Matches the characters except the characters between them.

    * [0-9] : Fits up to 9 characters.

    * {falan,filan} : Matches the word on the list.


    Now let''s make a few examples. For example, we use ls -l / etc / host * command,
    it lists all files that begin with host under the /etc directory


    ```

    root@kemal:~# ls -l /etc/host*

    -rw-r--r-- 1 root 9 Tem 23 09:53 /etc/host.conf

    -rw-r--r-- 1 root 6 Aug 22 10:20 /etc/hostname

    -rw-r--r-- 1 root 186 Aug 22 10:00 /etc/hosts

    -rw-r--r-- 1 root 411 Aug 11 11:41 /etc/hosts.allow

    -rw-r--r-- 1 root 711 Aug 11 11:41 /etc/hosts.deny

    root@kemal:~#

    ```


    For example just to list hosts.allow and hosts.deny in the /etc files in the directory
    only, we can use ls -1 /etc/hosts.{allow,deny} command.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Kemal Demireç | 187


    ```

    root@kemal:-# ls -l /etc/hosts.{allow,deny}

    -rw-r--r--r-- 1 root root 411 Aug 11 11:41 /etc/hosts.allow

    -rw-r--r--r-- 1 root root 711 Aug 11 11:41 /etc/hosts.deny

    root@kemal:-# _

    ```


    If there are LISTA, LISTB and LISTC files in the directory, and you want to list
    these files you can use ls LIST [AC] command.


    ```

    root@kemal:~/zeyno# ls

    hacker LIST LISTB LISTC linuxcmd list

    root@kemal:~/zeyno# ls LIST[A-C]

    LISTA LISTB LISTC

    root@kemal:~/zeyno# _

    ```


    We say that the wildcard character matches with everything. For example, to delete
    all the files under a directory you can use the rm command. You must be careful
    when using this type of commands. Because you may delete the necessary files.
    Though You can also use rm -i * command to do so. This way, you will ask before
    deleting.


    ```

    root@kemal:~/zeyno# ls

    hacker LIST LISTB LISTC linuxcmd list NEW_LIST test test-1 test-2

    root@kemal:~/zeyno# rm *

    root@kemal:~/zeyno# ls

    root@kemal:~/zeyno# _

    ```


    We delete all files found in our directory, then create new files and using the
    rm -i * command as we asked the command to ask us before deleting.


    ```

    root@kemal:~/zeyno# ls

    file1 file2 file3 file4 file5

    root@kemal:~/zeyno# rm -i *

    rm: normal boş dosya `file1'' silinsin mi?y

    rm: normal boş dosya `file2'' silinsin mi?y

    rm: normal boş dosya `file3'' silinsin mi?y

    rm: normal boş dosya `file4'' silinsin mi?y

    rm: normal boş dosya `file5'' silinsin mi?y

    root@kemal:~/zeyno# ls

    root@kemal:~/zeyno# _

    ```'
  merge: -1
  img_proc: true
