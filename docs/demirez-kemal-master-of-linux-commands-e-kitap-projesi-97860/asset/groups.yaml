    \n## Tcpdump\n\n可以使用 `tcpdump` 命令来查看进入系统的连接和/或从系统发出的连接。通过使用此命令，捕获连接请求并显示在控制台上。因此它可以捕获并显示网络上的数据包。你也可以查看记录的数据包。下面的示例展示了带有\
