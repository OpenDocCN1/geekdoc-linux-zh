    # Zcat-Zgrep-Bzcat-Bzgrep


    现在我们来谈谈用于读取压缩文件内容并在其中搜索内容的命令。如你所知，我们使用 `cat` 命令在屏幕上读取文本文件的内容，并使用 `grep` 命令搜索内容。同样，我们对压缩文件使用
    `zcat` 和 `zgrep` 命令。例如，我们可以使用 `zcat sample.gz` 命令来读取 `sample.gz` 的内容。


    ```

    root@kemal:~zeyno# cat sample

    Linux

    Kali

    Debian

    root@kemal:~zeyno# gzip sample

    root@kemal:~zeyno# ls

    sample.gz test

    root@kemal:~zeyno# zcat sample.gz

    Linux

    Kali

    Debian

    root@kemal:~zeyno# _

    ```


    我们可以使用类似 `zgrep Ka* sample.gz` 的命令根据压缩文件的特定标准进行搜索。


    ```

    root@kemal:~zeyno# ls

    sample.gz test

    root@kemal:~zeyno# zgrep Ka* sample.gz

    Kali

    root@kemal:~zeyno# _

    ```


    这些示例是针对使用 `gzip` 压缩的文件。如果文件是使用 `bzip2` 压缩的，我们需要使用 `bzcat` 和 `bzgrep` 命令。


    ```

    root@kemal:~/zeyno# ls

    sample.bz2 test

    root@kemal:~/zeyno# bcat sample.bz2

    Linux

    Kali

    Debian

    root@kemal:~/zeyno# bzgrep De* sample.bz2

    Debian

    root@kemal:~/zeyno# _

    ```


