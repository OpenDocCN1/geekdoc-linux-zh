    # 关于作者 (Yazar Hakkında)


    ![](img/aa6ce54dbb8ffe5b9d7bef8c676406_9_0.png)


    我1977出生于安卡拉。在安卡拉完成中学后，我进入了科贾大学的机械工程系。之后，我离开了该部门并转读了安纳利亚大学的工商管理专业。


    此前，我出版过两本书，分别是《Linux BackTrack 5》和《Linux 2012》。目前我居住在土耳其安卡拉，并继续网络安全领域的研究工作。


    # 引言 (Intro)


    到目前为止，有很多关于 Linux 操作系统的书籍，而且还将继续。每本书都是一种独特的表达方式和可以遵循的路径。作为一名 Linux 爱好者，我也想在这个领域说几句话。我的工作正是关于
    Linux 命令的使用。当然，关于这个问题，纸质书籍和互联网上都有很多资源。可以说，这本书有一些不同之处。不同之处在哪里？例如，我选择了简单的解释，没有过度关注细节（这些细节对我来说是不必要的，而且对用户/读者来说可能过于繁琐）。我详细阐述了对使用命令有益的实践，尝试为几乎每个命令的使用添加图片，并通过严格的分类进行组织。我尝试解释我认为有必要的内容，而不是按照主题进行分组等。


    '
