    ## Cfdisk


    As again, to partition a disk cfdisk command is a simple interface version of
    fdisk. When you give cfdisk command, you will see a screen such as:


    ![](img/aa6ce54dbb8ffe5bd7befb8c6764064_144_0.png)


    ## Badblocks


    To determine the blocks on a disk, badblocks command is used. If there are bad
    blocks, these blocks will be tried to be fixed by fsck command. I want to make
    a sample from usb flash drive. First list the sections in our system with fdisk
    -l


    ```

    root@local:~# fdisk -l

    /dev/sda: 37.3 GiB, 4008771920 bytes, 78140160 sectors

    Units of sectors * 512 = 512 bytes

    Sector size (logical/physical): 512 bytes / 512 bytes

    I/O size (minimum/optimal): 512 bytes / 512 bytes

