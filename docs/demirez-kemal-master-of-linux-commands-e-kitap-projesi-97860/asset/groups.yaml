    ## Umask


    In a linux system, the default access privileges assigned to newly created files
    and directories are determined by umask. To determine the umask value, we use
    umask command.


    ```

    root@kemal:~# umask

    0022

    root@kemal:~#

    ```


    Generally, this value is 022 in all linux distributions. When you create a file
    or directory, the default permissions will be as follows according to umask:


    - for directories rwx-xr-x (755)

    - for files rw-r-- (644)


    To change umask value, we use umask <new_value> command.


    Let us explain what umask means: the umask value as it is 022, then chain each
    number to three-digit number (binary). Like 022, let''s write this with authority
    codes as "rw-rw-" and "rwx".


    ## Chattr


    Sometimes you can delete a file by mistake. Or you can edit a configuration file,
    but when the system is restored, you will see that your edits disappear. To avoid
    situations like these chatter command is available. Lets explain it with an example.
    For example, we have a file called users.txt, and do not want to make any changes
    on this file. Even as the root user if we try to make a change by mistake, it
    will be blocked. For this, we use chattr +i users.txt command.


    ```

    root@kemal:~# chattr +i users.txt

    root@kemal:~# rm users.txt

    rm: `users.txt` silinemedi: İşleme verilmedi

    root@kemal:~#

    ```


    To list the blocked files like this in the system, we use the lsattr command.
    If you want to check all files under a directory, you must use lsattr -R <directory>
    command.


    ```

    root@kemal:~# lsattr

    -------e-- /deneme

    -------e-- /Downloads

    ----i----e /users.txt

    -------e-- /dwhelper

    -------e-- /Masaüstü

    -------e-- /Belgeler

    -------e-- /Genel

    -------e-- /Resimler

    -------e-- /Şablonlar

    -------e-- /Müzik

    -------e-- /Videolar

    ```


    When you pay attention to the list, you will see the letter i in line with users.txt
    file.


    To bring the protected file to previous form we use chattr -i users.txt command.


    ```

    root@kemal:~# chattr -i users.txt

    root@kemal:~#

    ```


