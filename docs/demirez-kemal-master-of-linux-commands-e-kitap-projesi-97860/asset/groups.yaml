    \ image-support (3.5.10)\nTetkleyiciçiler shared-mime-info (0.13-1)\nTetkleyiciçiler\
    \ hicolor-icon-theme (0.13-1) \\\nroot@kemal:~# _\n```\n\n安装 deb 文件非常简单。例如，如果你在同一个文件夹中有多个\
    \ deb 文件需要安装，你可以使用 `dpkg -i *. command`。使用此命令后，所有的 deb 文件都将被安装。\n\n## 172 | Linux\
    \ 命令精通\n\n让我们在这里提供一些信息。要确定 Debian 版本，可以使用 `cat /etc/debian_version` 命令。\n\n```bash\n\
