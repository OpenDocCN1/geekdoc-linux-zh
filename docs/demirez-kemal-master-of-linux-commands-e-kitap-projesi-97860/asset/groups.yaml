    当配合 `-i` 使用 `netstat` 工具时，会显示系统的接口信息。这些信息包括之间发送的数据包数量 (TX-OK)、数据包错误数量 (TX-ERR)、丢弃的数据包数量
    (TX-DRP)、输出数据包错误数量 (TX-OVR) 等。


    ```

    root@kemal:~# netstat -i

