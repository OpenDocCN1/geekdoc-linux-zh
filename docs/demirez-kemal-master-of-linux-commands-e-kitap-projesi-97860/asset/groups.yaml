    # # Chapter-3


    # ## Commands to Get Information'
  - '[PAGE 32]


    There are several commands to get the relevant information with files stored in
    our system about processes, users, etc. Let''s see what are those commands.


    # Lsb Release


    To find out the Linux distribution name that we have, we use lsb_release -a command.


    ```

    root@kemal:-# lsb_release -a

    No LSB modules are available.

    Distributor ID: Kali

    Description: Kali GNU/Linux 2.0

    Release: 2.0

    Codename: sana

    ```


    A similar command is cat /etc/*release command. With this we can get a little
    more information about our system.


    ```

    root@kemal:-# cat /etc/*release

    DISTRIB_ID=Kali

    DISTRIB_RELEASE=2.0

    DISTRIB_DENAME=sana

    DISTRIB_DESCRIPTION="Kali GNU/Linux 2.0"

    PRETTY_NAME="Kali GNU/Linux 2.0 (sana)"

    NAME="Kali GNU/Linux"

    ID=kali

    VERSION="2.0 (sana)"

    VERSION_ID="2.0"

    ID_LIKE=debian

    ANSI_COLOR="1;31"

    HOME_URL="http://www.kali.org/"

    SUPPORT_URL="http://forums.kali.org/"

    BUG_REPORT_URL="http://bugs.kali.org/"

    root@kemal:-# _

    ```'
  - '[PAGE 33]


    # 34 | Master of Linux Commands


    # Ete/Issue


    To see linux name that we are using, cat /etc/issue commands can also be used.


    ```

    root@kemal:~# cat /etc/issue

    Kali GNU/Linux 2.0 \n \l

    ```


    # Uname


    To find out the kernel (core) version of our system uses, uname -a command can
    be used.


    ```

    root@kemal:~# uname -a

    Linux kemal 4.0.0-kali1-686-pae #1 SMP Debian 4.0.4-1+kali2

    (2015-06-03) i686 GNU/Linux

    root@kemal:~#

    ```


    In fact, with -a parameter we did not only learn kernel-parameter version, we
    also learn kernel name, hostname, all the information, such as core architecture.
    Individual query can be done as in the following example.


    ```

    root@kemal:~# uname

    Linux

    root@kemal:~# uname -n

    kemal

    root@kemal:~# uname -m

    i686

    root@kemal:~# uname -r

    4.0.0-kali1-686-pae

    root@kemal:~# _

    ```


