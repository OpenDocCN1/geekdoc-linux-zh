    \                   0               27\nwlan0           1500 0               2207\
    \ 0                   1682 0\n```\n\n# 242 | nslookup\n\nThis command is used\
    \ to make DNS queries via a DNS server. The simplest query format is checking\
    \ the IP address with the hostname. Basic usage pattern is as follows: `nslookup\
    \ [options] [query]`.\n\nWhen using nslookup without parameters it starts operating\
    \ in interactive mode. Any queries can be performed in interactive mode too. By\
    \ default, record queries make straight and reverse process. So if the hostname\
    \ given IP address of the machine will be queried, the command shows the names\
    \ of the machine.\n\n```\nroot@kemal:~# nslookup\n> facebook.com\nServer:    \
    \     192.168.1.1\nAddress:        192.168.1.153\n\nNon-authoritative answer:\n\
    Name:             facebook.com\nAddress:        173.252.120.68\n> 173.252.120.68\n\
    Server:         192.168.1.1\nAddress:        192.168.1.153\n\nNon-authoritative\
    \ answers:\nname = edge-star-mini-shv-12-frc3.facebook.com.\n68.252.253.173.in-addr.arnameserver\
    \ = b.facebook.com.\n120.252.253.173.in-addr.arpa internet = 69.171.239.12\na.ns.facebook.com\
    \ has AAAA 2a63:2888:ffff:c6f1:face:b00c:35\nb.ns.facebook.com internet = 69.171.255.132\n\
    > has AAAA 2a63:2888:ffff:face:b00c.35\n```\n\nOn above example, we make an IP\
    \ address query from the name first, then the name from the IP address. We use\
    \ our command without any parameters as nslookup and the `>` mark showed us that\
    \ the command starts in interactive mode. Then we did our queries. While questioning\
    \ in interactive mode, you can change the type of questioning at any time. For\
    \ example:\n\n# 214 | Master of Linux Commands\n\n- NS: Used to view the list\
    \ of authorized DNS servers for a given area.\n- MX: Used to see servers that\
    \ accept sent-emails for a given domain and server.\n- ANY: Used all types of\
    \ queries to retrieve the required information.\n- SOA: Used for getting the information\
    \ about the person responsible for the domain, the TTL time is used to retrieve\
    \ information, the serial number of domain etc.\n\nTo change the query type in\
    \ interactive mode \"set query query_type\" or \"set type = query_type\" commands\
    \ should be given.\n\nFor example:\n\n```\nset query=NS\nset query=SOA\nset query=ANY\n\
    ```\n\n```\nroot@kemal:~# nslookup\n> set type=mx\n> twitter.com           192.168.1.1\n\
    Address:         192.168.1.153\n\nNon-authoritative answer:\ntwitter.com     \
    \ mail exchanger = 30 ASPMX3.GOOGLE.com.\ntwitter.com      mail exchanger = 10\
    \ aspmx.l.google.com.\ntwitter.com      mail exchanger = 30 ASPMX2.GOOGLE.com.\n\
    twitter.com      mail exchanger = 20 alt1.aspmx.l.google.com.\ntwitter.com   \
    \   mail exchanger = 20 alt2.aspmx.l.google.com.\n```\n\n# Whois\n\nWe can use\
    \ whois to get whois information about the target system. If your system does\
    \ not have this tool you can install with `apt-get install whois` command (`yum\
    \ install whois`) for the systems use rpm.\n"
