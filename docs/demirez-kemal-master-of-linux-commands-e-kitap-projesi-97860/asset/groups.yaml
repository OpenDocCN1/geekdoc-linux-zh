    \ Tab 键，它将完成命令。连续按下 Tab 键，将显示所有以你输入的字母开头的可能命令。\n- ctrl+H：同退格键，删除左侧字符。\n- ctrl+R：搜索以前使用的命令并允许执行重用该命令的操作。\n\
    \n通过大量练习我们列出的这些快捷键，它们将成为永久习惯。\n\n# 打开多个控制台\n\n在 Linux 系统中，你可以打开多个控制台并同时运行独立的会话。你可以同时打开\
    \ 6 个独立的控制台并分离进程。从 X 会话（可以称为图形化用户会话）切换到控制台，使用 **<Ctrl + Alt> <Fn> (n = 1, ...\
    \ 6)** 键。\n\n"
