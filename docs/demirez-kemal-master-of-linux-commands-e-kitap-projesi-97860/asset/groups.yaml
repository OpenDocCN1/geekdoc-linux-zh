    \n# Ip Command\n\nWe can also use one of the Linux networking commands, the ip\
    \ command, for making various arrangements. Learning the ip number, to view the\
    \ routing table, listing the arp cache etc. are some of them.\n\nWhen we use ip\
    \ command alone, a help screen about ip commands does\n\n```\nroot@kem:~ # ip\n\
    Usage: ip [ OPTIONS ] OBJECT { COMMAND | help }\nip [ -force ] [-batch file] ...\n\
    where OBJECT := { link | add | deladdr | route | rule | neigh | ntable |\ntunnel\
    \ | tuntap | mroute | mrule | monitor | xfrm |\nnets | l2tp | tcp metrics | tokens\
    \ | netconf }\nOPTIONS := { -version} [-statistics] [-details] | [-resolve] |\n\
    (family) { ipv4 | ipv6 } dnet | bridge | link } |\n-4 | -6 | -I | -D | -B | -0\
    \ |\n-loops | maximum-addr-flush-attempts |\n-selline | -t[timestamp] | -b[atch]\
    \ [filename] |\n-rcvbuf [size]\n```\n\nTo see the information about the ip configuration\
    \ if addr, ip show or ip commands can be used.\n\n```\nroot@kem:~ # ip a\n1: lo:\
