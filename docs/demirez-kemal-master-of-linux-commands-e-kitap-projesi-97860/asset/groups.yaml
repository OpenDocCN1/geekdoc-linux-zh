    # 移动文件-复制-删除


    # 92 | Linux 命令大师


    Linux 系统中段两个基本命令用于复制和移动文件。它们是 `cp` 和 `mv`。`cp` 命令用于复制，`mv` 命令用于移动。


    # cp


    `cp` 命令的格式为 `cp <source> <target>`。例如，为了将文件 `fileA` 复制到另一个位置 `fileB`，我们使用 `cp
    fileA fileB` 命令。让我们通过应用来看它。例如，我想将 `zeyno` 目录下的 `testA` 复制到 `/home` 目录并命名为 `testB`。这需要使用
    `cp zeyno/testA /home/testB`。


    ```

    root@kemal:~# cp zeyno/testA /home/testB

    root@kemal:~# cd /home

    root@kemal:/home# ls -l testB

    -rw-r--r-- 1 root root 0 Kas 15 testB

    ```


    如果你认为你不小心，可以使用 `cp -i` 命令。如果你有一个同名的旧文件，会在写入之前收到警告（交互式）。数据复制需要你的确认。


    ```

    root@kemal:~# cp -i zeyno/testA /home/testB

    cp: `/home/testB'' üzerine yazıls mı?

    root@kemal:~# _

    ```


    例如，在 `zeyno` 目录工作时，为了将 `sample` 和 `testA` 复制到 `/home/zeyep` 目录，我们可以使用 `cp sample
    testA /home/zeyep`。


    ![](img/aa6ce54db9ffe9dc6c740649.png)


    ```

    root@kemal:~# cd zeyno

    root@kemal:~/zeyno# ls sample testA

    root@kemal:~/zeyno# cp sample testA /home/zeyep

    root@kemal:~/zeyno# cd ../home/zeyep

    root@kemal:/home/zeyep# ls sample

    ```


    这是一个小提示。如果你好奇为什么我们在上面的示例中使用 `../`，是因为根目录（`/`）和家目录是不同的。当我们在家目录工作并在 `zeyno` 时，`/home`
    目录位于根目录下。


    ```

    root@kemal:~# pwd

    root@kemal:~# cd /

    root@kemal:/# cd ~

    ```


    你不止复制文件，也可以复制目录。为了复制目录，我们使用 `-r`（递归）。因此我们也可以复制目录下的所有内容。例如，使用 `cp -r dir1 dir2`
    命令。在本节中讨论了复制目录，删除索引将在下一节解释。


    ```

    root@kemal:~# cp -r zeyno /home/zeyep

    root@kemal:~# cd /home/zeyep

    root@kemal:/home/zeyep# ls sample testA zeyno

    ```


    在 Linux 终端中，点符号（`.`）表示我们当前所在的目录。例如，当我们使用 `etc/issue .` 时，`issue` 文件被复制到我们当时工作的
    `etc` 目录。


    ```

