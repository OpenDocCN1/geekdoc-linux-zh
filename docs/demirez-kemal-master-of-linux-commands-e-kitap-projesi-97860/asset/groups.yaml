    To find the location of the resource files and help files the whereis command
    should be used. When used without parameters, it gives the location of the executable
    files and data as output to the help page. If we give the command with the -b
    parameter, it shows only the location of the executable file, with -m with only
    the location of the man page, with -s gives the location information of it exists.


