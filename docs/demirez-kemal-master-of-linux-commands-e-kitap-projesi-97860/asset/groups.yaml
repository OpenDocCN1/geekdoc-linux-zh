    ## Shadow-Passwd


    The files which informations and passwords of the users are stored under /etc
    directory. Information about the users stored in /etc/passwd file, the encrypted
    version of the user''s password stored in /etc/shadow. When a new user is added
    to the system, the information of added user are written in these files.


    Before written in to the shadow file user passwords are encrypted using encryption
    algorithms, and kept in the file in encrypted form. This encryption process done
    by a method known as the crypt. User passwords in the system are generated as
    follows:


    - get the password user wants to set.

    - To be used as salt, create a string of eight characters.

    - Create an encrypted string with taking the password that you received and work
    through the crypt function with the salt value.


