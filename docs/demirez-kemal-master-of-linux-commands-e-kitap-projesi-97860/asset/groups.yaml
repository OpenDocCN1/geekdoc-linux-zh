  md: "\nWe see that Apache is not working. Lets check it out with de-service apache2\
    \ status command.\n\n```\nroot@kemal:~# service apache2 status\n● apache2.service\
    \ - LSB: Apache2 web server\nLoaded: loaded (/etc/init.d/apache2)\nActive: inactive\
    \ (dead)\nroot@kemal:~#\n```\n\nNow run the Apache service.\n\n```\nroot@kemal:~#\
    \ service apache2 start\nroot@kemal:~# service apache2 status\n● apache2.service\
    \ - LSB: Apache2 web server\nLoaded: loaded (/etc/init.d/apache2)\nActive: active\
    \ (running) since Pr 2015-08-27 02:10:45 I\nProcess: 5705 ExecStart=/etc/init.d/apache2\
    \ start (code=0)\nGroup: /system.slice/apache2.service\n-5719 /usr/sbin/apache2\
    \ -k start\n-5723 /usr/sbin/apache2 -k start\n-5724 /usr/sbin/apache2 -k start\n\
    -5726 /usr/sbin/apache2 -k start\n```\n\nWe ran our service, we check the sign\
    \ on the screen that lists all the services again with service --status-all command.\n\
    \n```\nroot@kemal:~# service --status-all\n[ ] anacron\n[ + ] apache2\n[ ] arpwatch\n\
    [ + ] atd\n[ ] atftpd\n[ + ] avahi-daemon\n[ ] beef-xss\n```\n\nWe see the information\
    \ that the Apache service is running. As you can see with few simple commands\
    \ it is easy to start services, end the process, check the status etc.\n\n## Reboot-Halt\n\
    \nWe talked about these work level on the linux system, and some of the worrk\
    \ levels such as **reboot**, **halt** etc. When turning off or restarting our\
    \ system we can use commands on the operating level, also we can use different\
    \ commands for these jobs. For example, to turn off the system we can use the\
    \ **init 0** command. Our system will pass to run level 0 this command and because\
    \ there is none working service in this level the system will shutdown.\n\nThis\
    \ is not the only command to shut down our system. We can shut down our system\
    \ using the following commands:\n\n- **shutdown -h now** (shuts down directly)\n\
    - **shutdown -h now+10** (shuts down 10 minutes later)\n- **halt** (shut down\
    \ begins)\n\nWe can use the commands below when we want to restart the system\n\
    \n- **reboot**\n- **init 6** (passing the 6th working level)\n\n## Chapter-14\n\
    \n### Symbolic Link-Hard Link\n\n§\n\n164 | Master of Linux Commands\n\nLinux\
    \ systems has two connection types: hard link (connection) and symbolic link.\
    \ The difference between these connection types: established a connection file\
    \ with hard link, the other file is a copy literally. Even if the original file\
    \ deleted the file created with solid link remain created. Connection files created\
    \ by symbolic links (soft-link) are used for a shortcut in a real term. Function\
    \ of this file is only redirecting to the original file.\n\n### Inode\n\nWhat\
    \ we call the inode is a structure that contains meta data about the file like\
    \ the access number, etc. as. Normally, each inode is unique. But the inodes of\
    \ the files created with solid link are the same. df -i command is used to view\
    \ the inode table. Now we see the example that explains all. We said, each inode\
    \ number is unique. To examine this inode (node) of the numbers, we use the ls\
    \ -li command.\n\n```\nroot@kemal:# ls -li\ntoplam 36\n171562 drwxr-xr-x 2 root\
    \ 4096 Agu 22 10:10 Dodger\n171559 drwxr-xr-x 2 root 4096 Eyl 13 00:44 Downloads\n\
    171561 drwxr-xr-x 2 root 4096 Agu 22 10:10 Genel\n171558 drwxr-xr-x 2 root 4096\
    \ Kas 10 17:57 Masaüstü\n171563 drwxr-xr-x 2 root 4096 Agu 22 10:10 Müzik\n171564\
    \ drwxr-xr-x 2 root 4096 Agu 22 10:10 Resimler\n171560 drwxr-xr-x 2 root 4096\
    \ Agu 22 10:10 Şablonlar\n171565 drwxr-xr-x 2 root 4096 Agu 22 10:10 Videoolar\n\
    197539 drwxr-xr-x 2 root 4096 Kas 18 00:53 zeyno\nroot@kemal: -#\n```\n\nThe numbers\
    \ that appear in the left-are inode numbers. Soon as we will see from the examples,\
    \ the files with same inode numbers also have same file permissions and some contents.\
    \ The fact that files with the same inode number are identical to each other.\n\
    \n### Hard Link\n\nIn command is used for hard link connectivity. Now let's create\
    \ one file and make a hard link to this file.\n\n```\nroot@kemal:~/zeyno# ls\n\
    root@kemal:~/zeyno# touch test\nroot@kemal:~/zeyno# ls\ntest\nroot@kemal:~/zeyno#\
    \ ln test testlink\nroot@kemal:~/zeyno# ls\ntest testlink\nroot@kemal:~/zeyno#\
    \ ls -i test testlink\n1975922 test 1975922 testlink\nroot@kemal:~/zeyno# _\n\
    ```\n\nAs is seen in the above example, first we create a file called test with\
    \ touch test command. After that we created a hard link called testlink with ln\
    \ testlink command.. Then we look at the inode of the file with ls - test testlink\
    \ command and we saw the same inode number. We actually said files created by\
    \ hard link are the same files. When any data added to a file's contents, this\
    \ data must be added to the other files automatically. Let's try. Now let's write\
    \ some expressions into test file and check other files made two hard link.\n\n\
    ```\nroot@kemal:~/zeyno# test testlink\nroot@kemal:~/zeyno# echo \"linux commands\"\
    \ > test\nroot@kemal:~/zeyno# cat test\nlinux commands\nroot@kemal:~/zeyno# cat\
    \ testlink\nlinux commands\nroot@kemal:~/zeyno# _\n```\n\nTo create a symbolic\
    \ link, in -s command is used. Again, let's create a file with the touch command,\
    \ and let the shortcut link to this file.\n\nKemal Demirez | 167\n\n```\nroot@kemal:~/zeyno#\
    \ ls\nroot@kemal:~/zeyno# touch example\nroot@kemal:~/zeyno# ln -s exampleSYM\n\
    root@kemal:~/zeyno# ls\nexampleSYM\nroot@kemal:~/zeyno# ls -i\n1975924 example\
    \ 1975924 exampleSYM\nroot@kemal:~/zeyno# _\n```\n\nAs you can see exampleSYM\
    \ is a shortcut link of example-file. So we've created the shortcut file example,\
    \ and gave the name of the exampleSYM. You may notice that the inode numbers of\
    \ the output are different. Also the color of the file name seems to be different.\
    \ When we check the output of the ls -l command which we use to list of files\
    \ we will see I at lrwxrwrwx expression at the beginning of the line about link\
    \ file. This character indicates that this is a shortcut link file. In addition,\
    \ you may notice that the location of the display, the original files/programs,\
    \ etc. is marked by the arrow (->) mark.\n\n```\nroot@kemal:~/zeyno# ls -l\ntoplam\
    \ 0\n-rw-r--r 1 root root 0 Kas 18 10:47 example\nlwxrwrwx 1 root root 7 Kas 18\
    \ 10:47 exampleSYM -> example\nroot@kemal:~/zeyno# ls -l example\n-rw-r--r 1 root\
    \ root 0 Kas 18 10:47 example\nroot@kemal:~/zeyno# ls -l exampleSYM\nlwxrwrwx\
    \ 1 root root 7 Kas 18 10:47 exampleSYM -> example\nroot@kemal:~/zeyno# _\n```\n\
    \nWe may also check our file with stat command. Let's use stat example to examine\
    \ the status of the file.\n\n167\n```\nroot@kemal:~/zeyno# stat exampleSYM\nFile:\
    \ exampleSYM -> example\nSize: 7\tBlocks: 0\nDevice: 801h\tInode: 1975924\nAccess:\
    \ (lrwxrwxrwx)\tUid: (0/root)\nGid: (0/root)\tAccess: 2015-11-18 10:47\nModify:\
    \ 2015-11-18 10:47\nChange: 2015-11-18 10:47\nBirth: -\nroot@kemal:~/zeyno# _\n\
    ```\n\nWith the file command we can also get information about files.\n\n```\n\
    root@kemal:~/zeyno# file example\nexample: empty\nroot@kemal:~/zeyno# file exampleSYM\n\
    exampleSYM: symbolic link to example\nroot@kemal:~/zeyno#\n```\n\nWe will end\
    \ this chapter by mentioning symbolic links can not be create for only normal\
    \ files, directories.\n\n§\n\n## Chapter-15\n\n### Program Installation-Remove-\n\
    System Update\n\n170 | Master of Linux Commands\n\nInstalling a program in linux\
    \ is quite different than windows and is actually very simple. We have several\
    \ possibilities to set up a Linux program. One of these options is to establish\
    \ the desired program by compiling from source code. Second option, to install\
    \ of the software with the package management system in accordance with the distribution\
    \ we use. Another option is to make automated testing repository installation\
    \ of storage used by the distribution.\n\nNow first examine Debian-based Linux\
    \ distributions how to set up the program, remove the program, the system update\
    \ process then we will check RedHat based systems works.\n\n§"
  mdcn: "\n## 14\n\n### 符号链接-硬链接\n\n§\n\n164 | Linux 命令大师\n\nLinux 系统有两种连接类型：硬链接（hard\
    \ link）和符号链接（symbolic link）。这些连接类型之间的区别在于：建立硬链接时，另一个文件是字面上的副本。即使删除了原始文件，通过硬链接创建的文件仍然存在。符号链接（软链接）创建的连接在实际上用于快捷方式。该文件的功能仅重定向到原始文件。\n\
    \n### Inode\n\n我们所说的 inode 是一个包含文件元数据的结构，如访问次数等。通常，每个 inode 都是唯一的。但通过硬链接创建的文件\
    \ inode 是相同的。`df -i` 命令用于查看 inode 表。现在我们来看解释一切的示例。我们说过，每个 inode 号都是唯一的。要检查这些 inode\
    \ 号（节点），我们使用 `ls -li` 命令。\n\n```\nroot@kemal:# ls -li\ntotal 36\n171562 drwxr-xr-x\
    \ 2 root 4096 Aug 22 10:10 Dodger\n171559 drwxr-xr-x 2 root 4096 Sep 13 00:44\
    \ Downloads\n171561 drwxr-xr-x 2 root 4096 Aug 22 10:10 General\n171558 drwxr-xr-x\
    \ 2 root 4096 Nov 10 17:57 Desktop\n171563 drwxr-xr-x 2 root 4096 Aug 22 10:10\
    \ Music\n171564 drwxr-xr-x 2 root 4096 Aug 22 10:10 Pictures\n171560 drwxr-xr-x\
    \ 2 root 4096 Aug 22 10:10 Templates\n171565 drwxr-xr-x 2 root 4096 Aug 22 10:10\
    \ Videos\n171539 drwxr-xr-x 2 root 4096 Nov 18 00:53 zeyno\nroot@kemal: -#\n```\n\
    \n左侧显示的数字是 inode 号。很快我们将从示例中看到，相同 inode 号的文件也具有相同的权限和内容。它们是完全相同的。\n\n### 硬链接\n\
    \n`ln` 命令用于硬链接。现在我们创建一个文件并为该文件创建一个硬链接。\n\n```\nroot@kemal:~/zeyno# touch test\n\
    root@kemal:~/zeyno# ls\nroot@kemal:~/zeyno# ln test testlink\nroot@kemal:~/zeyno#\
    \ ls\nroot@kemal:~/zeyno# ls -i\n1975922 test\n1975922 test\n```\n\n如上面的示例所示，我们首先使用\
    \ `touch` 命令创建一个名为 `test` 的文件。然后使用 `ln` 命令创建一个名为 `testlink` 的硬链接。接着通过 `ls -i`\
    \ 命令查看文件的 inode，我们发现 inode 号相同。实际上，通过硬链接创建的文件是相同的。当向其中一个文件添加任何数据时，这些数据会自动添加到另一个文件中。让我们尝试一下。现在向\
    \ `test` 文件中写入一些内容并检查另一个文件。\n\n```\nroot@kemal:~/zeyno# echo \"linux commands\"\
    \ > test\nroot@kemal:~/zeyno# cat test\nlinux commands\nroot@kemal:~/zeyno# cat\
    \ testlink\nlinux commands\n```\n\n### 符号链接\n\n使用 `-s` 命令创建符号链接。再次，我们使用 `touch`\
    \ 命令创建一个文件并为该文件创建快捷链接。\n\nKemal Demirez | 167\n\n```\nroot@kemal:~/zeyno# touch\
    \ example\nroot@kemal:~/zeyno# ln -s example exampleSYM\nroot@kemal:~/zeyno# ls\n\
    root@kemal:~/zeyno# ls -i\n197524 example\n```\n\n你可以看到 `exampleSYM` 是 `example`\
    \ 的快捷链接。所以我们创建了快捷文件 `example` 并将其命名为 `exampleSYM`。你可能会注意到输出的 inode 号是不同的。此外，文件名的似乎也不同。当我们检查用于列出文件的\
    \ `ls -l` 命令时，会在链接文件的行开头看到 `lrwxrwxrwx`。这个字符表示这是一个快捷链接文件。此外，你可能注意到原始文件/程序的显示位置是用箭头\
    \ `(->)` 标记的。\n\n```\nroot@kemal:~/zeyno# ls -l\ntotal 0\n-rw-r--r 1 root root\
    \ 0 Nov 18 10:47 example\nlrwxrwxrwx 1 root root 7 Nov 18 10:47 exampleSYM ->\
    \ example\nroot@kemal:~/zeyno# ls -l example\n-rw-r--r 1 root root 0 Nov 18 10:47\
    \ example\nroot@kemal:~/zeyno# ls -l exampleSYM\nlrwxrwxrwx 1 root root 7 Nov\
    \ 18 10:47 exampleSYM -> example\n```\n\n我们也可以用 `stat` 命令检查我们的文件。让我们使用 `stat example`\
    \ 来检查文件的状态。\n\n167\n```\nroot@kemal:~/zeyno# stat exampleSYM\nFile: exampleSYM\
    \ -> example\nSize: 7\tBlocks: 0\nDevice: 801h\tInode: 1975924\nAccess: (lrwxrwxrwx)\t\
    Uid: (0/root)\nGid: (0/root)\tAccess: 2015-11-18 10:47\nModify: 2015-11-18 10:47\n\
    Change: 2015-11-18 10:47\nBirth: -\n```\n\n通过 `file` 命令我们也可以获取有关文件的信息。\n\n```\n\
    root@kemal:~/zeyno# file example\nexample: empty\nroot@kemal:~/zeyno# file exampleSYM\n\
    exampleSYM: symbolic link to example\n```\n\n我们将通过提到这一点来结束本章：符号链接不能为普通文件和目录创建。\n\
    \n§\n\n## 15\n\n### 程序安装-删除-\n系统更新\n\n170 | Linux 命令大师\n\n在 Linux 中安装程序与 Windows\
    \ 完全不同，实际上非常简单。我们有多种方法来设置 Linux 程序。这些选项之一是通过从源代码编译来建立所需的程序。第二个选项是根据我们使用的发行版，使用包管理系统安装软件。另一种选项是使用发行版使用的自动化测试仓库进行安装。\n"
