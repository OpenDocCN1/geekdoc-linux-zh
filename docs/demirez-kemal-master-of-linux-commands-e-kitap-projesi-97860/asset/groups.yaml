    \ ko man4 man8 pl sk tr zh_TW\nroot@kemal:/usr/share/man# _\n```\n\n手册页的配置如下：\n\
    \n- man1：通用用户程序。\n- man2：系统程序。\n- man3：库函数。（关于 C 语言编程）\n- man4：私有文件。\n- man5：文件格式。\n\
    - man6：游戏和屏幕保护程序。\n- man7：不属于其他类别的各种命令。\n- man8：系统管理与维护。\n\n要查看 ls 命令的 man 帮助页（解释我们在上面提供的示例中的\
