  mdcn: "\n与性能有关。使用某些参数可能是危险的。因此，在在使用它时你应该应该小心。\n\n## Modinfo\n\n`modinfo` 命令用于列出\
    \ Linux 内核模块的信息。例如，你必须使用 `modinfo cdrom` 命令来获取 CDROM 相关的内核模块信息。\n\n```\nroot@kemal:~#\
    \ modinfo cdrom\nfilename: /lib/modules/4.0.0-kalil-686-pae/kernel/drivers/cdrom.ko\n\
    license: GPL\ndepends:\nintro:\nvermag: 4.0.0-kalil-686-pae SMP mod_unload versions\
    \ 686\nparm: debug:autoclose\nparm: autoeject:bool\nparm: lockdoor:bool\nparm:\
    \ check_media_type:bool\nparm: mrw_format_restart:bool\n```\n\n如果你想查看模块列表，可以使用\
    \ `lsmod` 命令。\n\n## Stat\n\n使用 `stat` 命令可以获取文件或目录的状态信息。它可以不带参数使用，也可以带有 `-f` 参数（如\
    \ `stat -f`）。\n\n```\nroot@kemal:~# stat /etc\nFile: \"/etc\" Blocks: 24 10 Block:\
    \ 4096 dizin\nSize: 12288 Device: 801/2649d Inode: 17006069 Links: 179\nAccess:\
    \ [0755/drwxr-xr-x] Uid: 0/root Gid: 0/root)\nAccess: 2015-11-12 16:52:11.8637477\
    \ +0200\nModify: 2015-11-12 16:17:52.22489130 +0200\nChange: 2015-11-12 16:17:52.22489130\
    \ +0200\nBirth:\nroot@kemal:~# stat -f /etc\nFile: \"/etc\"\nID: c6233bcc30090ee\
    \ Name: 255 Type: ext2/ext3\nBlock size: 4096 Fundamental block size: 4096\nBlocks:\
    \ Total: 9327789 Free: 702615 Available: 6547025\nInodes: Total: 2379216 Free:\
    \ 2027069\n```\n\n## Vinstat\n\n我们可以使用 `vmstat` 命令查看系统的整体状态。\n\n```\nroot@kemal:~#\
    \ vmstat\nprocs    memory------swap------system------cpu----\n  r b swpd free\
    \ buff cache  si bo in in cs us sy id wa st\n  0 0 263432 11796 15652 232344 \
    \  0  17  62 27 88 227  4 1 193  2  0\nroot@kemal:~#\n```\n\n如果调用时不带任何参数，信息将在列出后就会退出。为了以特定的时间间隔刷新信息，`vmstat`\
    \ 命令 应该使用 `vmstat delay [renewal_number]`。\n\n```\nroot@kemal:~# vmstat 3 4\n\
    procs    memory------swap------system------cpu----\n  r b swpd free buff cache\
    \  si bo in in cs us sy id wa st\n  0 0 20568 10580 16528 234484   5 17 62 27\
    \ 89 231  4  1 193  2  0\n  0 0 20568 10324 16628 234804   0  0  0  0 66 163 \
    \ 1 196  2  0\n  0 0 20568 10324 16636 234768   0  0  0 13 61 142  1 295  2  0\n\
    \  0 0 20568 10332 16636 234768   0  0  0  0 178 415  6 9 84  1  0\nroot@kemal:~#\n\
    ```\n\n## History\n\n事实上，这个主题可以在后续章节中描述。但在这里提到会更合适。Linux 系统使用的命令保留在内存中（通过为分配的数量的空间写入文件），然后通过调查使用了哪些命令，并让我们追溯允许让我们再次使用它们。是的，命令行中使用的命令保存在\
    \ `.bash_history` 文件中。我们可以使用 `history` 命令来列出之前使用的命令。该命令将引用 `.bash_history` 文件。\n\
    \n```\nroot@kemal:~# history\n1 nano /etc/hostname\n2 ls\n3 tar -zxvf LibreOffice_5.0.0_Linux_x86_deb.tar.gz\n\
    4 ls\n5 tar -zxvf LibreOffice_5.0.0_Linux_x86_deb_helpack_tr.tar.gz\n6 tar -zxvf\
    \ LibreOffice_5.0.0_Linux_x86_deb_langpack_tr.tar.gz\n7 ls\n8 cd LibreOffice_5.0.5_Linux_x86_deb\n\
    9 ls\n10 cd DEBS/\n11 ls\n12 dpkg -i *.deb\n13 ls\n14 cd LibreOffice_5.0.5_Linux_x86_deb\
    \ -h\n15 cd LibreOffice_5.0.5_Linux_x86_deb_helpack_tr/\n```\n\n要从终端再次使用这些命令列出的命令中的某一个，只需要在命令左侧加上一个\
    \ `!` 符号即可。例如，我列出了我在终端编号为 215 的屏幕命令：`cd /home` 命令，为了再次使用它，我必须输入 `!215` 命令。\n\n\
    ```\nroot@kemal:~# !215\ncd /home\nroot@kemal:/home# \n```\n\n如果你想复用最后使用的命令，你必须输入命令\
    \ `!!` 来为此\n\n```\nroot@kemal:~# !!\ncd\nroot@kemal:~#\n```\n\n若要以相同的方式使用之前过的命令，应该在命令左侧放置\
    \ `!` 符号。例如，如果你想以相同的方式使用 `cat` 命令，你必须输入 `!cat` 命令。\n\n```\nroot@kemal:~# !cat\n\
    cat /proc/meminfo\nMemTotal:       502812 kB\nMemFree:        19420 kB\nMemAvailable:\
    \   173512 kB\nBuffers:        16596 kB\nCached:         211156 kB\nSwapCached:\
    \     18876 kB\n```\n\n如果你想知道之前使用的命令用法，必须保留关于需要写入终端命令 `<Command>:p` 的说明。因此，它将打印到表单以显示之前使用的命令。\n\
    \n```\nroot@kemal:~# !cat:p\ncat /proc/meminfo\nroot@kemal:~#\n```\n\n如果你想知道之前使用的命令用法，必须保留关于需要写入终端命令\
    \ `<Command>:p` 的说明。因此，它将打印到表单以显示之前使用的命令。\n\n如果你想知道之前使用的命令用法，必须保留关于需要写入终端命令 `<Command>:p`\
    \ 的说明。因此，它将打印到表单以显示之前使用的命令。\n\n如果你想知道之前使用的命令用法，必须保留关于需要写入终端命令 `<Command>:p` 的说明。因此，它将打印到表单以显示之前使用的命令。\n\
    \n如果你想知道之前使用的命令用法，必须保留关于需要写入终端命令 `<Command>:p` 的说明。因此，它将打印到表单以显示之前使用的命令。\n\n如果你想知道之前使用的命令用法，必须保留关于需要写入终端命令\
    \ `<Command>:p` 的说明。因此，它将打印到表单以显示之前使用的命令。\n\n如果你想知道之前使用的命令用法，必须保留关于需要写入终端命令 `<Command>:p`\
    \ 的说明。因此，它将打印到表单以显示之前使用的命令。\n\n（注：原文后续存在大量重复段落，已按要求不重复输出原文）\n"
