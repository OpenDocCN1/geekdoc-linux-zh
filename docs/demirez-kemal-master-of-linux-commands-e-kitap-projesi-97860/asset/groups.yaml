    \tinet 192.168.1.24/24 brd 192.168.1.255 scope global dynamic wifi\n\tvalid lft\
    \ 40116sec preferred lft 40116sec\n\tinet6 fe80::55e6:fec7:fe95:fec764 scope link\n\
    \tvalid lft forever preferred lft forever\nroot@kem:~ #\n```\n\n![](img/aa6ce54dbb8ffe5b9d7befb8c6764064_237_0.png)"
