    3 次，但使用 `-n` 参数时，我们可以指定写入次数。如果使用 `-u`，目标文件在结束后会被删除。为了在终端上查看详细交易输出，使用 `-v`。基本上，它是这样运作的。现在让我们做一些示例。例如，名为
    `deneme` 的文件，使用 `shred` 向其写入随机数据，尝试阻止恢复。

