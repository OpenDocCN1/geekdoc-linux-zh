    # Netstat


    列出网络连接、路由表等信息我们使用 `netstat` 命令。该命令可以使用不同的参数，获取系统链接信息的方法是 `netstat -ant`。


    # 212 | Linux 命令大师


    ```

    root@kemal:~# netstat -antp

