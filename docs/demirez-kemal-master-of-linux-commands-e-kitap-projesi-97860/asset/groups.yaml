    ```\nroot@kemal:-# awk \"{print}\"\ndemirez\ndemirez\nzeynep\nzeynep\nroot@kemal:-#\
    \ _\n```\n\n如果你想使用从文件中读取的命令，应该使用 `awk -f <script_file>` 命令。我们可以在文本文件中编写 awk 代码并保存，然后使用\
    \ `-f` 参数定位该文件位置。虽然文件不需要任何扩展名，但在保存时使用 `.awk` 扩展名有助于记住这是一个 awk 脚本文件。对于小规模处理，通过命令行输入命令更符合逻辑。然而，使用脚本文件在大文件中执行大量操作是有意义的。现在，让我们使用一个小文件的示例。将以下语句输入到文本文件中，扩展名为\
    \ `.awk`。\n\n# BEGIN {print \"linux commands\"}\n\n我使用命令 `awk -f sample.awk`，是因为我给文件命名为\
    \ `sample.awk`。\n\n```\nroot@kemal:~# cat sample.awk\nBEGIN {\n  print \"linux\
    \ commands\"\n}\nroot@kemal:~# awk -f sample.awk\nlinux commands\nroot@kemal:~#\n\
    ```\n\nawk 有不同的版本。除了原始的 awk 外，你也可以使用 `gawk` (GNU awk)、`nawk`。我将提供 awk 的示例，但如果你愿意，可以使用\
    \ nawk。\n\n```\nroot@kemal:~# which awk\n/usr/bin/awk\nroot@kemal:~# which nawk\n\
    /usr/bin/nawk\nroot@kemal:~# nawk -f sample.awk\nlinux commands\nroot@kemal:~#\
    \ -\n```\n\n由于我们将解释控制台的使用，我们的示例将关于 awk 命令的使用，即从控制台从文件中获取给定的命令。使用控制台有一些规则我们需要记住。这些是：\n\
    \n## 201 | Linux 命令精要\n\n- `'` 命令写在双引号内，然后执行的文件将是指定的指定。\n- `$` 引用文件中的列（将进行处理的）。如果没有进行更改，列将按空格分隔。`$0`\
    \ 显示总行数（对应每行的整行），`$1` 显示行的第一列，`$2` 显示行的第二列。\n- `NR`: 总记录数（行号）。\n- `NF`: 列数/字段数。\n\
    - `-F`: 用于指定字段分隔符符号。\n- `/..//`: 使用在两个 `/` 之间的正则表达式。\n- `FS`: 字段分隔符。\n\n数学运算符\
    \ (`+`, `-`, `=`, `++`, `--`, `*`, `*`, `/`, `/=` 等) 可以在 awk 中使用。比较表达式 `<`, `<=\
    \ `>=`, `=`, `!=` 也可以使用。\n\n现在让我们做一些练习。例如，要原样显示文件内容，使用 `awk '{print $0}' <file`\
    \ 命令。\n\n```\nroot@kemal:~# cat test\nLinux BackTrack 5\nKali Linux 2.0\nEthical\
    \ Hacking\nCentOS\nRedHat System Mng.\nroot@kemal:~# awk '{print $0}' test\nLinux\
    \ BackTrack 5\nKali Linux 2.0\nEthical Hacking\nCentOS\nRedHat System Mng.\n```\n\
    \n要检查文件中的任何语句，我们必须使用 `/../` 模式。包含查询词的单行或多行将被显示。\n\n```\nroot@kemal:~# cat test1\n\
    Linux BackTrack 5\nRedHat System Mng.\nroot@kemal:~# awk '/Red/' test1\nRedHat\
    \ System Mng.\nroot@kemal:~# _\n```\n\n为了查看每个分配空间开头处的特定区域，必须使用通过通过文件的行来查看任何表达式的\
    \ `awk '/string/ {print $1}'` 模板。\n\n```\nroot@kemal:~# cat test\nLinux BackTrack\
    \ 5\nKali Linux 2.0\nEthical Hacking\nCentOS\nRedHat System Mng.\nroot@kemal:~#\
    \ awk '/Kali/ {print $1}' test\nKali\nroot@kemal:~# _\n```\n\n如果我们想查看字段的头部，我们使用\
    \ `awk '{print $1}'` 命令。\n\n## 206 | Linux 命令精要\n\n```\nroot@kemal:~# cat test\n\
    Linux BackTrack 5\nKali Linux 2.0\nEthical Hacking\nCentOS\nRedHat System Mng.\n\
    root@kemal:~# awk '{print $1}' test\nLinux\nKali\nEthical\nCentOS\nRedHat\nroot@kemal:~#\
    \ _\n```\n\n如果表达式之间是 `:` 而不是空格，我们应该使用 `awk -F` 点符号：\n\n```\nroot@kemal:~# cat\
    \ personal\nAli:312:Ankara\nVeli:212:İstanbul\nKemal:232:İzmir\nroot@kemal:~#\
    \ awk -F: '{print $1}' personal\nAli:312\nVeli:212\nKemal:232\nroot@kemal:~# _\n\
    ```\n\n如你所见，`'{print $1}' personal` 无法得到预期的结果。我们使用 `-F: '{print $1}' personal`\
    \ 因为 `:` 被用作分隔符。要查看保留区域的短语，例如查看第一和第三区域的短语，应该使用 `'{print $1,$3}'` 命令，如果你忘记在 `$1`\
    \ 和 `$3` 之间放置逗号，所有的表达式将在一起显示。\n\n## Kemal Demirez | 207\n\n```\nroot@kemal:~#\
    \ cat personal\nAli:312:Ankara\nVeli:212:İstanbul\nKemal:232:İzmir\nroot@kemal:~#\
    \ awk -F: '{print $1, $3}' personal\nAli Ankara\nVeli İstanbul\nKemal İzmir\n\
    root@kemal:~# awk -F: '{print $1$3}' personal\nAliAnkara\nVeliİstanzbul\nKemalİzmir\n\
    root@kemal:~# _\n```\n\n在接下来的示例中，我们将看到 `-F:` 表达式，它用于区域工作相当于 `FS=\":\"`。\n\n```\n\
    root@kemal:~# cat personal\nAli:312:Ankara\nVeli:212:İstanbul\nKemal:232:İzmir\n\
    root@kemal:~# awk -F: '{print $3}' personal\nAnkara\nİstanbul\nİzmir\nroot@kemal:~#\
    \ awk '{print $3}' FS=\":\" personal\nAnkara\nİstanbul\nİzmir\nroot@kemal:~# _\n\
    ```\n\n你不仅可以使用表达式 `FS=\":\"` 形式，还可以使用 `FS=''` 或 `FS=:`。当将所需的短语作为输出显示在屏幕上时，如果你想，可以使用另一个短语输出。例如，`awk\
    \ -F: '{print \"city: $3}' personal` 命令的输出将如下。\n\n## 208 | Linux 命令精要\n\n```\n\
    root@kemal:~# cat personal\nAli:312:Ankara\nVeli:212:İstanbul\nKemal:232:İzmir\n\
    root@kemal:~# awk -F: '{print \"city: $3}' personal\ncity: Ankara\ncity: Istanbul\n\
    city: İzmir\nroot@kemal:~# _\n```\n\n"
