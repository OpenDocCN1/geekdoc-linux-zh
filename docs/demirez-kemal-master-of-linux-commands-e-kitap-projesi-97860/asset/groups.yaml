    # Nslookup


    This command is used to make DNS queries via communicate

    with DNS server. The simplest query format is check the IP

    address with the host name. Basic usage pattern is as follows:

    slookup [options] [query]


    When using nslookup without any parameters it starts to

    operating in interactive mode. Any queries can be performed in

    interactive mode too. By default, record queries make straight

    and reverse process. So if the hostname given IP address of the

    machine will be queried, if the IP address of the machine given

    the command names of the machine.


    ```

