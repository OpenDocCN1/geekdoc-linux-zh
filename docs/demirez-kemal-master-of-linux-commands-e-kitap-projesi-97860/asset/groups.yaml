  - '[PAGE 130]


    # Changing User Password


    As you know, root users have the authority to do any changens on the system. Including
    all applications about users. Root user can change any user in the system at any
    time. To do this, root user must use, such as for zeynep user, its passwd zeynep
    command. If root user wants to change his password, he/she can only use passwd
    command.


    ```

    root@kemal:-# passwd zeynep

    Yeni parolayı girin:

    Yeni parolayı tekrar girin:

    passwd: şifre başarıyla güncellendi

    root@kemal:-#

    ```


    # Impersonating Another User''s Profile


    A user can impersonate other user''s identity which means works with other users
    authorities and execute some process. To do first he/she should know the user''s
    password. If you are a root user, you can work with any user''s profile.


    Before continue, lets remember w, and whoami command we mentioned earlier. With
    these commands we can see some informations such as which identity we are working
    with, identity we connect to the system with. You can see the sample use and differences
    on the table:


    ```

    root@kemal:-# w

    10:50 up 11 min, 2 users,  load average: 0.27, 0.52, 0.46

    USR     TTY             FROM             LOGIN   JCPU    PCPU    WHAT

    root     0                               10:15  ?xd7   1:12  0.14s gdm-session-wor

    pts/0    :0                               10:19  2.00s  0.14s 0.01s w

    root@kemal:-# who

    root     0                               2015-08-19 10:19 (:0)

    pts/0

    root@kemal:-# whoami

    root     0                               2015-08-19 10:19 (:0)

    pts/0

    root@kemal:-# who am i

    root     0                               2015-08-19 10:19 (:0)

    pts/0

    ```'
  - '[PAGE 131]


    To learn when the system was turned on who -b, to see the run level information
    you can use who -r command.


    ```

    root@kemal:-# who -b

    system boot 2015-09-18 10:14

    root@kemal:-# who -r

    acılış-seviyesi 5 2015-09-18 10:15

    ```


    Especially using whoami command, we can easily see which identity we are working
    at the system at that time. Yoo may ask why we would need it. If you are working
    only in your system, than there is no need for sure but if you are working as
    a system admin on a multiple user system you may need it much.


    Now lets see how to impersonate others'' identity. For root user there is already
    not limitation so they can do any process with any users identity. However if
    other users want to root or another user''s id to process they must know their
    password. To impersonate other user''s id we basically use su command. How they
    work this is:


    +   - su <user_name> switches to other user ID.

    - su - <user_name> both switches to other user''s id and begins to work in his/her
    shell.


    ```

    root@kemal:-# su zeyep

    zeyep@kemal:/root$ whoami

    zeyep

    zeyep@kemal:/root$ exit

    root@kemal:-# _

    ```'
  - '[PAGE 132]


    As you can see with su zeynep command, we begin to work

    zeynep id. When we want to exit, we used exit command.

    Because we are the root user, it did not ask a password. Lets see

    su - zeynep command.


    ```

    root@kemal:-# su - zeynep

    zeynep@kemal:-$ whoami

    zeynep

    zeynep@kemal:-$ _

    ```


    We said a reguler er user must know the password if he wants to

    works as root or another user''s id. Lets make a sample.


    ```

    zeynep@kemal:-$ su - root

    Parola:

    root@kemal:-# _

    ```


    In any user''s id, if you want to impersonate the root id, you

    can use either su or su - commands. Of course you should type

    root''s password too. As I menioned before, you can be another

    user with su command but you would still be working in your

    directory. With su - command, you can do both, be the user and

    work in his/her directory.


    ```

    zeynep@kemal:-$ su

    Parola:

    root@kemal:/home/zeynep# exit

    exit

    zeynep@kemal:-$ su -

    Parola:

    root@kemal:-# _

    ```'
