    \ 创建用户，删除用户及其家目录（例如 'zeynep'）可以使用 `deluser --remove-home zeynep`。如果你使用 `useradd\
    \ -m` 创建用户，删除其家目录必须使用 `userdel -r zeynep`。\n\n## 手动添加新用户\n\n手动向系统添加用户需要在 passwd、shadow\
    \ 和 group 文件进行设置。使用 vim 等控制命令可以方便地编辑 passwd 和 group 文件。记住这一点。例如，我们想向系统添加一个名为 deneme\
    \ 的用户。为了实验，我们在 passwd 文件中添加 `deneme:x:2000:2000::/home/deneme:/bin/false`，创建一个名为\
    \ deneme 的用户，其数字为 2000，属于 2000 组。在完全创建用户后，我们将 /bin/false 改为 /bin/bash 以赋予他们 bash\
    \ 壳。我们将 /home/deneme 设置为主目录。现在需要在 shadow 文件中进行设置。为此，我们将该行复制到底部，然后将用户名改为 deneme。然后我们从终端使用\
    \ `passwd deneme` 为新用户设置新密码。最后，在 /etc/group 文件中添加 `deneme:x:2000` 并保存。在完成这些设置后，我们在\
    \ /home 下创建 deneme 文件夹并安排权限：\n\n```bash\n- cd /home\n- mkdir deneme\n- chown deneme:deneme\
    \ deneme\n- chmod 700 deneme\n```\n\n通过在 /bin/false 开头写入 /bin/bash，我们创建了新用户。\n\
    \n## 修改用户信息\n\n在系统中更改用户的个人信息可以使用 `chfn` 命令。例如，要更改 zeynep 的资料，输入 `chfn zeynep`\
    \ 并按顺序输入所需信息即可完成所需的更改。\n\n![](img/aa6ce54dbb8ffe59d7befb8c6764064_128_0.png)\n\
    \n## 列出用户信息\n\n要查看用户信息可以使用 `chage` 命令。例如，通过 `chage -l zeynep` 命令将列出用户 zeynep 的信息。\n\
    \n![](img/aa6ce54dbb8ffe59d7befb8c6764064_128_1.png)\n\n此命令不仅用于显示用户信息。例如，`chage`\
    \ 命令用于更改用户的密码过期日期。如果我们想让 zeynep 的密码在 2015 年 11 月 16 日失效，必须使用 `chage -E 2015/11/16\
    \ zeynep`。\n\n## 使用户激活或非激活\n\n锁定用户账户或重新激活已锁账户我们基本上使用 `usermod [-L|-U] <user>`\
    \ 命令。例如，锁定名为 deneme 的用户账户使用 `usermod -L deneme`；要重新激活账户必须使用 `usermod -U deneme`。要禁用用户账户，在\
    \ /etc/shadow 文件的加密密码区域，我们在密码开头添加一个感叹号 (!)。\n\n额外信息，如果你想删除属于 /etc/shadow 文件的密码区域，必须使用\
    \ `passwd -d <user>` 命令。此过程不会禁用用户。用户可以在不需要密码的情况下远程连接到系统。因此，这种方法被称为快速禁用用户方法。或者如果你倾向于使用列表账户，可以使用此方法。\n\
    \n"
