    # 272 | Master of Linux Commands


    +   * 1st field: Determines how many minutes after the hour starts the job will
    execute. (0-59) (for example, 30 minutes job starts after the 30 minutes of selected
    hour –like 30 minutes after 1 o''clock)


    +   * 2nd field: Determines the start time of job. (0-23) (number instead of *
    means that every hour is entered)


    +   * 3rd field: determines which days the job will start. (1-31) (number instead
    of * means every day is entered. 7,14 would mean also, 7th and 14th day of month)


    +   * 4th field: Determines which month the job will be held. (1-12) (if the number
    is entered * means every month. 1,6 means in January and June. 1-3 expression
    means that in January-February-March


    +   * 5th field: Determines which days of the week the job will be performed.
    (0-7) (number instead of * means every day is entered, 0 and 7 means Sunday. 1,2
    expressed on Monday and Tuesday, 1-3 refers to the Monday-Tuesday-Wednesday


    We add the lines regarding the work we want to the bottom line of the crontab
    file we open with crontab -e command. Our tasks will be performed as scheduled
    after we save and quit. Now let''s make a simple example. For example, we have
    a folder named Aproce which we add some work everyday. We want to back this file
    with Aproce.tgz under /var/backup directory. To do this we add 0 22 * * * tar
    -zef /var/backups/Aproce.tgz/root/Masaüstü/Apro at the end of our crontab file.
    This command will backup Aproce folder everyday at 22:00 (10 pm) under /var/backup
    directory with the name of Aproce.tgz.'
