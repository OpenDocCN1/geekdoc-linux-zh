    \ event6(Video Button)\nNov 22 11:07:26 kemal system-log: Watching system buttons\
    \ on /dev/input event4(Left Switch)\nNov 22 11:07:26 kemal system-log: Watching\
    \ system buttons on /dev/input event3(Slee Button)\n```\n\nAnother log file user.log\
    \ stores process records in.\n\n```\nroot@kemal:~/var/log cat user.log\nNov 22\
    \ 11:07:26 kemal mtp-probe: checking bus 1, device 2: \"/sys/devices/pci0000:00:14.0/usb1/1-2/id0000\"\
    \nNov 22 11:07:26 kemal mtp-probe: device 1 was not on an MTP device\n```\n"
  mdcn: "\n\n## 第 23 章\n## 计划任务\n\n## 270 | 精通 Linux 命令\n### Cron-Crontab\n\n在 Linux\
    \ 操作系统中，你可以在特定的时间范围内编辑你想要执行的工作。这意味着你可以在预设的时间删除某些日志文件，也可以调度任何你想要的进程。可以通过 cron 服务对每项任务进行调度。\n\
    \n你可以使用 `service cron status` 命令来获取你的 cron 服务状态信息。\n\n```\nroot@kemal:~# service\
    \ cron status\n● cron.service - Regular background program processing daemon\n\
    \ Loaded: loaded (/usr/lib/system/cron.service; enabled)\n Active: active (running)\
    \ since Tue 2015-11-22 18:23:24 EET; 2h18min ago\n Docs: mancron(8)\n Main PID:\
    \ 520 (cron)\n Cgroup: L520 /usr/sbin/cron -f\n```\n\n`crontab` 命令用于编辑计划任务。因此可以使用\
    \ `crontab` 命令编辑 crontab 文件。Cron 配置文件是 `/etc/crontab` 文件。\n\n```\nroot@kemal:~#\
    \ cat /etc/crontab\n# /etc/crontab: system-wide crontab\n# Unlike any other crontab\
    \ you don't have to run the 'crontab'\n# command to install the new version when\
    \ you edit this file\n# and files in /etc/cron.d. These files also have username\
    \ fields,\n# and none of the other crontabs do.\nSHELL=/bin/sh\nPATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin\n\
    # hour mon dom user command\n17 + * * * root\n25 6 * * * root test -x /usr/sbin/annhourly\
    \ || ( cd /root; run-parts --report /etc/cron.daily )\n47 6 * * * root test -x\
    \ /usr/sbin/anndaily || ( cd /root; run-parts --report /etc/cron.daily )\n52 6\
    \ * * * root test -x /usr/sbin/annmonthly || ( cd /root; run-parts --report /etc/cron.monthly\
    \ )\nroot@kemal:~#\n```\n\n经过这段简单的介绍后，我们将了解如何使用 `crontab` 命令进行安排和规范。某些发行版使用 `vim`\
    \ 打开 cron 文件。（因此，它会根据执行 cron 命令的用户打开对应的 cron 文件）在进行完更改并退出后，cron 服务将以新设置启动。我正在使用的\
    \ Kali 系统会询问我想用什么编辑器打开文件。要进行编辑，我输入 `crontab -e` 命令，会出现蓝色屏幕；\n\n```\nroot@kemal:~#\
    \ crontab -e\ncrontab for root - using an empty one\n```\n\n- 选择一个编辑器。稍后要更改，运行\
    \ 'select-editor'。\n1. /usr/bin/nano <---- 最简单\n2. /usr/bin/mcedit\n3. /usr/bin/vim.basic\n\
    4. /usr/bin/vim.gtk\n5. /usr/bin/vim.tiny\n\n选择 1-5 [1]:\n\n你可以选择任何喜欢的编辑器。\n\n\
    ```\n# 编辑此文件以引入由 cron 运行的任务。\n# 每个任务都必须通过单行定义，\n# 通过不同的字段指示任务运行的时间\n# 以及为任务运行什么命令\n\
    # 要定义时间，你可以为\n# 分钟 (m)、小时 (h)、每月的几号 (dom)、月份 (mon)、\n# 周几 (dow) 提供具体值，或在这些字段中使用\
    \ '*'（表示“任何”）。\n# 注意，任务将根据 cron 系统\n# 守护进程的时间和时区来启动。\n# crontab 任务的输出（包括错误）将通过邮件\n\
    # 发送到 crontab 文件所属的用户（除非经过重定向）。\n# 例如，你可以在每周凌晨 5 点运行所有用户账户的备份：\n# 0 5 * * * 1\
    \ tar -zcf /var/backups/home.tgz /home/\n```\n\n计划任务信息应该写在打开的文件中。它管理调度并根据我们的命令工作。为了进行安排，我们首先需要学习\
    \ cron 文件的特性。cron 文件中有 6 个字段。前五个字段用于设置与请求的工作相关的日期、小时、信息（例如分钟），最后一个字段用于运行命令。\n\n\
    - 第 1 字段：决定任务在整点开始后多少分钟执行。（0-59）（例如， 30 分钟的任务将在选定小时的 30 分钟后开始——就像 1 点后的 30 分钟）\n\
    - 第 2 字段：决定任务的开始时间。（0-23）（数字代替 `*` 意味着每小时都进入）\n- 第 3 字段：决定任务在哪些天开始。（1-31）（数字代替\
