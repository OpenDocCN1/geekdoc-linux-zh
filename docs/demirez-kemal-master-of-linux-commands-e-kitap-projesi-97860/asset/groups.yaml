  - '[PAGE 29]


    # 30 | Master of Linux Commands


    # # Whatis


    There is another command **whatis** command, helps us indirectly. We can use this
    command to find out where the help topic of an application or command in the manual.


    ```

    root@kemal:~ whatis echo

    echo (1)           - display a line of text

    ```


    If you want to make queries using wildcards that we will talk about later, you
    must use the **-w** parameter. For example **whatis -w cal**.


    ```

    root@kemal:~ whatis cal+

    cal+: nothing appropriate.

    root@kemal:~ whatis cal+

    cal (1)           - displays a calendar and the date of Easter

    calendar (1)      - reminder service

    calloc (3)       - allocate and free dynamic memory

    calloc (3avr)     - (unknown subject)

    callprpc (3)     - library routines for remote procedure calls

    ```


    # # Apropos


    **apropos** command which to be used to get help actually runs **man -k** command
    in the background.


    ```

    root@kemal:~ man -k printf

    asprintf (3)      - print to allocated string

    dnprintf (3)       - print to a file descriptor

    fprintf (3)       - formatted output conversion

    printf (3avr)     - (unknown subject)

    printf.P (3avr)   - (unknown subject)

    fprintf (3)      - formatted character output conversion

    printf (1)        - format and print data

    printf (3)        - formatted output conversion

    printf (3avr)     - (unknown subject)

    printf.P (3)       - (unknown subject)

    sprintf (3)      - formatted output conversion

    sprintf (3avr)     - (unknown subject)

    sprintf.P (3avr)   - (unknown subject)

    ```


    Looking at the output command we see the applicationsincludes **printf** term
    are listed. The output of the **apropos** command will be the same as output of
    **man -k** command.'
