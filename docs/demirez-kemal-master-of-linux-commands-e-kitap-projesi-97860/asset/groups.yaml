    Our other two important files are /var/run/utmp and /var/log/wtmp files. User
    login informations are kept in these files. Records relating to active log files
    kept in utmp file and records relating to inactive sessions of the past kept in
    wtmp file. These two files can not be read with any text editor or the cat command
    because they are data file. We use string command to see the strings in them.


    §'
