    # Grep


    To search for an expression (string) in files or output of a command, we can use
    grep command. Before the example of our command, let''s use some of the important
    parameters.


    +   - -r: Reverses the behavior of the command line that does not contain the
    sought word lists.

    - -i: Upper / lower case is not taken during a search.

    - -n: Searches in the subdirectories of a given directory.

    - -c: It displays the line number where the search word now.

    - -l: The specified index indicates the number of times the word you are looking
    for.

    - -l: Where appropriate template column lists file names.


    Let''s make a simple example. For example in /etc/passwd fi- to list the includes
    zeynep, we can use either grep /etc/passwd or cat /etc/passwd | grep zeynep commands.


    ```

    root@kemal:-# grep zeynep /etc/passwd

    zeynep:x:1000:1001,,,/home/zeynep:/bin/bash

    root@kemal:-# /etc/passwd | grep zeynep

    zeynep:x:1000:1001,,,/home/zeynep:/bin/bash

    root@kemal:-#

    ```


    Now Let''s cat LIST |grep -ni ali command. With this command: in LISTC file, upper
    / lower case without distinction, (-l) in expression lines, line number (n), we
    have also shown together.


