    -   **cd**: 更改连接电脑上的文件夹。\n-   **lcd**: 允许我们更改自己电脑上的文件夹。\n-   **rm**: 删除远程电脑上的文件。\n\
    -   **rmdir**: 删除远程电脑上的文件夹。\n-   **chmod**: 允许你更改文件的用户权限。\n-   **ls**: 显示远程电脑文件夹的内容。\n\
    -   **ls**: 显示自己电脑上文件夹的内容。\n-   **rename**: 修改连接电脑上的文件名。\n-   **mkdir**: 在远程电脑上创建文件夹。\n\
    -   **lmkdir**: 在自己电脑上创建文件夹。\n\n我们可以使用 **exit** 命令在完成工作后退出。\n\n```\nsftp> exit\n\
    root@porteus:~# \n```\n\n# FileZilla\n\n如果两个系统都是 Linux，那么通过 `sftp` 在它们之间传输文件非常简单且安全。但如果你想使用图形界面从\
    \ Windows 系统传输文件到 Linux 系统，你可以使用 **FileZilla ftp client** 软件程序。\n\n你可以从 **www.filezilla-project.org**\
    \ 地址下载相应版本的 filezilla 客户端程序。\n\n![](img/aa6ce54dbb8ffe5b9d7befb8c6764 the64_261_0.png)\n\
    \n下载后我们现在可以安装程序了。安装时我们将按照标准说明进行。\n\n![](img/aa6ce54dbb8ffe5b9d7befb8c6764064_262_0.png)\n\
    \n安装 FileZilla 程序后，我们运行程序。我们在主界面上填写区域（服务器、用户名、密码和端口号）。我们在服务器地址处填写连接系统的系统 IP 号。我们将端口号设为\
    \ 22。当然，这要求我们要连接的系统中必须运行 SSH 服务，这意味着服务可以监听 22 号端口。该 SSH 服务应该在系统中处于激活状态（`service\
    \ ssh start`）。同时，我们需要知道要连接的系统的 IP 号，并如上所述进行填写。\n\n```\nroot@kemal:# ifconfig wlan0\n\
    wlan0  link enc:Ethernet  HWaddr 54:e9:fc5:6f:ec\n      inet addr:192.168.43.2\
    \ Bcast:192.168.43.255 Mask:255.255.255.0\n      inet6 addr fe80::566f:cfe95:6ec/64\
    \ Scope:Link\n      UP BROADCAST RUNNING MULTICAST  MTU:1500  Metric:1\n     \
    \ RX packets:386 dropped:0 overruns:0 frame:0\n      TX packets:54 dropped:0 overruns:0\
    \ carrier:0 queue:1000\n      RX bytes:86232 (84.2 KiB) TX bytes:5542 (5.4 KiB)\n\
    ```\n\n我们可以填写这些区域。![](img/aa6ce54dbb8ffe5b9d7befb8c6764064_263_0.png)\n\n现在一切都准备就绪了，我们可以点击\
    \ Connect 标签卡进行连接。连接建立后的状态将如下所示![](img/aa6ce54dbb8ffe5b9d7befb8c6764064_263_1.png)\n\
    \n连接状态可以在上一个面板中看到。\n\n| 服务器 | 用户名 | 密码 |\n| :--- | :--- | :--- |\n| sftp://192.168.43.2\
    \ | root | *** |\n| 状态：192.168.43.2 | 正在连接... | |\n| 状态：已连接到 192.168.43.2 | 正在列出目录...\
    \ | |\n| 状态：正在列出目录 /root | | |\n| 状态:/root | | |\n\n连接系统中所有的文件和文件夹现在都可见，我们可以执行想要的可视化显示的操作。\n\
    \n| 远程站点: /root | 文件名 | 类型 | 最后修改 | 权限 | 所有者 | 组 |\n| :--- | :--- | :--- | :---\
    \ | :--- | :--- | :--- |\n| .aptitude | | | 27.11.2015 | drwx------ | root | root\
    \ |\n| .cache | | | 28.11.2015 | | | |\n| .config | | | 22.11.2015 | drwx-xr-x\
    \ | root | root |\n| .dbus | | | 22.11.2015 | drwx------ | root | root |\n| .gconf2\
    \ | | | 22.11.2015 | drwx------ | root | root |\n| .gnome2 | | | 22.11.2015 |\
    \ drwx------ | root | root |\n| .local | | | 22.11.2015 | drwx------ | root |\
    \ root |\n\n我们可以将任何文件复制到连接系统。\n\n| 服务器/本地文件 | 方向 | 远程文件 | 大小 | 优先级 | 时间 |\n| :---\
    \ | :--- | :--- | :--- | :--- | :--- |\n| sftp://root@192.168.43.2 | ---> | /root/170229-Chenden.zip\
    \ | 668.44 | 22.12.2015 |\n\n如 FileZilla 所示，我们可以在图形界面工作并以简单的方式处理许多任务。\n\n## 第22\
    \ 章 使用 Wget 下载文件\n\n### Wget\n\n要从命令行下载文件，我们可以使用简单且方便的 wget 工具。用法格式为 `wget <参数>\
    \ <路径>`。\n\nwget 最重要的功能之一是能够从中断的地方继续。`-c` 参数用于此功能。例如 `wget -c <site.com/文件名>`。要要完整下载一个目录或站点，应该使用\
    \ `wget -r <站点名>` 命令（递归）。\n\n```\nroot@kemal:~$ wget -r http://www.facebook.com/\n\
    --2015-11-21 17:40:56-- http://www.facebook.com/\nwww.facebook.com (www.facebook.com)\
    \ 解析域名中... 31.13.93.36, 2a03:2880:f01c:face:b678:25de\nwww.facebook.com (www.facebook.com)\
    \ [31.13.93.36:80] 连接建立。\nHTTP 请求已发送，等待响应... 302 Found\n定向: https://www.facebook.com/\
    \ [已跟踪]\n--2015-11-21 17:40:56-- https://www.facebook.com/\nwww.facebook.com (www.facebook.com)\
    \ [31.13.93.36:443] 连接建立。\n```\n\n当我们查看时，可以看到下载的站点已保存。\n\n```\nroot@kemal:~# cd\
    \ www.facebook.com/\nroot@kemal:~/www.facebook.com# ls\nindex.html robots xt unsupportedbrowser?_fb_noscript=1\n\
    ```\n\n下载下载创建一个创建一个包含所有下载地址的 txt 文件，并一次性下载所有文件。`wget -i textfile.txt`\n\n下载特定文件使用\
    \ `-A` 参数。例如，如果你只想从某个网站下载 .jpg 和 .png 文件，可以使用 `wget -r -A .jpg,.png <site.com>`\
    \ 命令。\n\n"
