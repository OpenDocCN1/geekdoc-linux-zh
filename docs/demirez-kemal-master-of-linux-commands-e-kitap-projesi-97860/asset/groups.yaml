    # 56 | Master of Linux Commands


    ```

    root@kemal:/home# pushd /etc

    etc /home

    root@kemal:/etc# pushd

    /home /etc

    root@kemal:/home# pushd

    /etc /home

    root@kemal:/etc# pushd

    /home /etc

    root@kemal:/home# _

    ```


    We have two simple examples above. The transition can be made between permanent
    directory with the command pushd, with popd we can switch the other directories
    for once and work on them.


    ```

    root@kemal:~# cd /home

    root@kemal:/home# pushd /etc

    etc /home

    root@kemal:/etc# pushd /var

    /var /etc /home

    root@kemal:/var# popd

    /etc /home

    root@kemal:/etc# popd

    /home

    ```


    To list the open directories, we can use dirs -v command.


    §'
  - "[PAGE 56]\n\n# ls Command\n\n```\nroot@kemal:~# cd /home\nroot@kemal:/home# pushd\
    \ /etc\n/etc /home\nroot@kemal:/etc# dirs -v\n0 /etc\n1 /home\nroot@kemal:/etc#\
    \ \n```\n\nTo list subdirectory under the directory, folder and files, use the\
    \ ls command. We can use this command either with parameters or without parameters.\
    \ Without parameters will give an out put such as:\n\n```\nroot@kemal:~# ls\n\
    Belgeler dwhelper Masaüst Resimler Videolar\nDownloads Genel Müzik Şablonlar\n\
    root@kemal:~# -\n```\n\nIf you use ls -l, we have a more detailed output. In this\
    \ detailed list provides information such as file access permissions, owner, date\
    \ of creation.\n\n```\nroot@kemal:~# ls -l\ntoplam 36\ndrwxr-xr-x 2 root 4096\
    \ Agu 22 10:10 Belgeler\ndrwxr-xr-x 2 root 4096 Agu 22 10:10 Downloads\ndrwxr-xr-x\
    \ 2 root 4096 Agu 22 12:21 dwhelper\ndrwxr-xr-x 2 root 4096 Agu 22 10:10 Genel\n\
    drwxr-xr-x 2 root 4096 Agu 22 17:34 Masaüstü\ndrwxr-xr-x 2 root 4096 Agu 22 10:10\
    \ Müzik\ndrwxr-xr-x 2 root 4096 Agu 22 10:10 Resimler\ndrwxr-xr-x 2 root 4096\
    \ Agu 22 10:10 Şablonlar\ndrwxr-xr-x 2 root 4096 Agu 22 10:10 Videolar\nroot@kemal:~#\
    \ \n```"
  - '[PAGE 57]


    # 58 | Master of Linux Commands


    If we want to see hidden files (hidden files begins with ".") use ls -la command.


    ```

    root@kemal:~# ls -la

    toplam 06

    drwr-xr-x 2 root 4096 Agu 23 12:40 .

    drwr-xr-x 2 root 4096 Agu 22 11:18 .

    -rw------- 1 root 1714 Agu 23 10:42 .bash_history

    -rw-r--r-- 1 root 3391 Agu 11 11:06 .bashrc

    drwr-xr-x 2 root 4096 Agu 22 10:10 .Beliger

    drwx------ 2 root 4096 Agu 22 12:22 .cache

    drwr-xr-x 15 root 4096 Agu 22 18:48 .config

    drwx------ 3 root 4096 Agu 23 10:10 .dbus

    drwr-xr-x 2 root 4096 Agu 22 10:10 Downloads

    drwr-xr-x 2 root 4096 Agu 22 12:21 dwhelper

    drwx------ 3 root 4096 Agu 23 09:50 .gconf

    drwr-xr-x 2 root 4096 Agu 22 11:35 .gnome2

    -rw------- 1 root 1554 Agu 23 09:50 .iceauthority

    drwx------ 3 root 4096 Agu 22 10:10 .local

    ```


    We can also use the -R parameter to list the contents of the directory as recursive.


    ```

    root@kemal:~# ls -R

    .

    Beleler dwhelper Masaüstü Resimler Videolar

    Downloads Genel Müzik Şablonlar

    ./Belgeler:

    ./Downloads:

    ./dwhelper:

    ./Genel:

    ./Masaüstü:

    Aproce Linux Komut Satırı.pdf LKS MATERYAL

    ```


    §'
  - '[PAGE 58]


    To see the put out on row basis list, we should use the ls -1

    command.


    ```

    root@kemal:~# ls -1

    Belgeler

    Downloads

    dwhelper

    Genel

    Masaüstü

    Müzik

    Resimler

    Şablonlar

    Videolar

    root@kemal:~#

    ```


    The other parameters we can use are these:


    +   - ls -r: Screen output shows the list as reverse.

    - ls -S: Sorts by file size.

    - ls -F: According to sort by file type sign.


    * : The executable file

    @ : Symbolic link

    / : directory


    +   - ls -i: Lists the inode number that we will mention later


    | 171562 Belgeler | 171561 Genel | 171564 Resimler |

    | 171559 Downloads | 171558 Masaüstü | 171560 Şablonlar |

    | 171855 dwhelper | 171563 Müzik | 171565 Videolar |


    §'
  - '[PAGE 59]


    # 60 | Master of Linux Commands


    +   - ls -lh: Listes sizes more readable (human readable).

    - ls -lt: Sort files by modified date (modification).


    Now let''s talk about the other forms of the ls command use. For example, we want
    to see only hidden files in the directory not all files and folders which command
    shold we use? The answer is ls -d. * command.


    ```

    root@kemal:~# ls -ld .*

    .bashrc .dbus ICEauthority .profile

    .cache .gconf .local .rnd

    .bash_history .config .gnome2 .mozilla .wireshark

    ```


    If you do not want "." and ".." directories listed, then you should use ls -d
    [!] command. To show files beginning only with "b" ls -d b*, to show beginning
    all others rather than "m" ls -d[!]* must be used. If you want to list the directories
    above the one you are in, you must use the command as “ls ..”. If you want to
    see what is in the two directories above you you must use ls ..../ command.


    ```

    root@kemal:/var/log/apache2# ls ../..

    backups lib lock mail run tmp WWW

    cache local log opt spool unicornscan

    root@kemal:/var/log/apache2# -

    ```


    §'
