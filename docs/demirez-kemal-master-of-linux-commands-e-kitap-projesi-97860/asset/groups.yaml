  - "[PAGE 52]\n\nIn the linux world, everything (programs, files, devices) is located\
    \ in the sub-directories / files under a directory view. All directories, hierarchically\
    \ connected in the **root directory**. This is expressed as root directory / (slash).\
    \ Each users have their own **home** directories, including linux system root.\
    \ **Console / terminal** starts to work on the user's own directory by default.\
    \ Root's home directory is **/root** directory. When a new user is added to the\
    \ system, the home directory of the user will place under (personal directory)\
    \ / **home** directory as /home/user1, /home/user2.\n\nNavigating between directories,\
    \ to list their contents, see which directory we are working on there are some\
    \ commands. Let's see these commands.\n\n# # Pwd\n\nTo view the directory in which\
    \ we work, we use `pwd` command. If you ask why we would want to know, if you\
    \ use a linux system as personel, then yes, no need to worry which you work with.\
    \ But if you are a system administrator which has many users, sometimes you may\
    \ need to use the **pwd** command. \n\n```\nroot@kemal:~# pwd\n/root\nroot@kemal:~#\
    \ cd /home\nroot@kemal:/home# pwd\n/home\n```"
  - '[PAGE 53]


    # Master of Linux Commands


    # Cd


    As you can see cd (change directory) command is able to switch between directories.
    For example: we can go to /share with cd/usr/share command. To return to our main
    directory we can use cd command.


    ```

    root@kemal:/usr/share/apps# cd

    root@kemal:~#

    ```


    If we want to move to the parent directory from a subid, we can use the command
    .. (or cd ../). If we want to get in the top two directories of the directory,
    we should use cd ../../, to move to the top three cd ../../.. commands.


    ```

    root@kemal:/usr/share/sqlmap# cd ../

    root@kemal:/usr/share# cd ../../

    root@kemal:/#

    ```


    For example, we want to go to the top two directory and also we want to move to
    another subid of the series that we passed. For this, we should use a command
    similar to the following.


    ```

    root@kemal:/usr/share/sqlmap# cd ../wpscan

    root@kemal:/usr/share/wpscan#

    ```


    With this command from / share/sqlmap directory, we have passed to the /share/wpscan
    directory.'
  - '[PAGE 54]


    There is an easy way to pass between two directories. We can use cd - command.


    # # Pushd-Popd


    To open two separate folder / directory, and switch between these directories
    as we wanted to, we use pushd and popd commands. This process is a kind of directory-doing
    pull shift as we can say. Let us explain what we mean that the following examples.


    ```

    root@kemal:~# cd /home

    root@kemal:/home# pwd

    /home

    root@kemal:/home# pushd /etc

    /etc/home

    root@kemal:/etc# pwd

    /etc

    root@kemal:/etc# popd

    /home

    ```'
