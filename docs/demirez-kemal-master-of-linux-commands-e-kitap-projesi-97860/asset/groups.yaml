    ## 第 7 章


    ## 创建和删除目录


    对于索引和删除，使用了两个命令：`mkdir` 和 `rm`。


    ### Mkdir


    在简单的情况下，例如，我们可以通过 `mkdir deneme1` 创建名为 `deneme1` 的目录。


    ```bash

    root@kemal:~/zyno# mkdir deneme1

    root@kemal:~/zyno# ls -ld deneme1

    drwxr-xr-x 2 root 4096 deneme1

    root@kemal:~/zyno# _

    ```


    如果你想创建多个目录，可以使用类似 `mkdir deneme1 deneme2 deneme3` 等命令。


    ```bash

    root@kemal:~/zyno# mkdir deneme2 deneme3

    root@kemal:~/zyno# ls -ld deneme2 deneme3

    drwxr-xr-x 2 root 4096 deneme2

    drwxr-xr-x 2 root 4096 deneme3

    ```


    ### -p 参数


    要创建创建一个目录及其子目录，我们使用 `-p` 参数。例如，通过 `mkdir -p linux/examples/png`，我们创建了一个名为 `linux`
    的目录，其名为 `examples` 的子目录以及 `png` 下的子目录。


    ```bash

    root@kemal:~/zyno# mkdir -p linux/examples/png

    root@kemal:~/zyno# ls -ld linux

    drwxr-xr-x 3 root 4096 linux

    root@kemal:~/zyno# cd linux

    root@kemal:~/linux# cd examples

    root@kemal:~/linux/examples# ls

    ```


    ### -m 参数


    对于我们创建的目录，如果我们想在安排时创建权限，则应该使用 `-m` 参数。例如，通过 `mkdir -m 700 blue`，我们创建了一个名为 `blue`
    的权限为 700 的目录。


    ```bash

    root@kemal:~/zyno# mkdir -m 700 blue

    root@kemal:~/zyno# ls -ld blue

    drwx------ 2 root 4096 blue

    root@kemal:~/zyno# _

    ```


    ### Rm


    用于删除目录的命令是 `rm`。如果我们想删除目录及其子目录和文件，应该使用 `rm -r`；如果我们希望在删除前进行询问，则使用 `rm -ri`；如果我们想在不询问的情况下删除所有内容，应该使用
    `rm -rf` 命令。


    ```bash

    root@kemal:~/zyno# rm -ri linux

    rm: `linux` içine silinsin mi?

    rm: `linux/examples` içine silinsin mi?

    rm: `linux/examples/` silinsin mi?

    rm: `linux/examples` içine silinsin mi?

    rm: `linux` silinsin mi?

    root@kemal:~/zyno# ls -ld linux

    ls: linux''e erişilemedi; Böyle bir dosya ya dizin yok

    root@kemal:~/zyno# _

    ```


    如果我们想同时删除几个目录，必须并排输入指定这些目录。例如，如 `rm -r <dir1> <dir2> <dir3>` 等。


    ## 第 8 章


    ## 文件压缩归档


    在 Linux 系统中，你可以通过存档备份所需的文件或文件组，并在需要时存储并重新加载。你可能想在存档文件中创建一个大文件。你可以像往一样归档文件，也可以选择压缩文件。我们一些命令来处理此类所有事务。在本节中，我们将讨论这些命令的使用。


    ### Tar


    创建存档文件的基本命令是 `tar` 命令。让我们在一个简单的示例中看看它的用法。例如，在 `zyno` 目录下，我们想要合并 example、sample
    和 test 文件并创建一个名为“file.tar”的存档。我们使用 `tar -cf file.tar example sample test` 命令（在这里在
    `-cf` 处，你可以使用不带横杠的 `cf`）。


    ```bash

    root@kemal:~/zyno# tar -cf file.tar example sample test

    root@kemal:~/zyno# ls

    file.tar

    root@kemal:~/zyno# _

    ```


    当我们在命令中使用 `c` 时意味着创建（create），使用 `f` 时我们指定要创建的存档文件名。我们可以使用 `tar xvf file.tar` 来打开存档文件（`x`
    表示提取，`v` 表示详细，`f` 表示文件）。


    ```bash

    root@kemal:~/zyno# tar -cf file.tar example sample test

    root@kemal:~/zyno# ls

    file.tar

    root@kemal:~/zyno# _

    ```

