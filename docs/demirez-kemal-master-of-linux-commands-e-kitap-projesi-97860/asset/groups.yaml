    \            0               17:39 ?xdm? 55:50\nroot     pts/0           :0  \
    \             17:48 0.00s 0.58\n```\n\nThere are uses of these commands. Briefly:\n\
    \n- w: To find out the information which user runs at that moment which applications\
    \ / command.\n- who: Identity which profile is worked in the system.\n- whoami:\
    \ Identify which profile user is working with.\n\n```\nroot@kemal:-# who     \
    \         2015-08-22 17:39 (:0)\nroot     :0\nroot     pts/0         2015-08-22\
    \ 17:48 (:0)\nroot@kemal:-# whoami\nroot\nroot@kemal:-# am i\nroot     pts/0 \
    \        2015-08-22 17:48 (:0)\n```\n\nWhen we use who command with -b we can\
    \ see when the system run last time, with -r shows the opening levels (runlevel).\n"
