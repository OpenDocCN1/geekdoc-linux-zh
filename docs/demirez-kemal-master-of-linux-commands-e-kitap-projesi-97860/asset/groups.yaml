    \ Opera browser. The program package has a similar name as such:\n\n```bash\n\
    root@kemal:~# ls -l opera_12.16.1860_i386.deb\n-rw-r--r-- 1 root root 13063000\
    \ Kas 20 15:14 opera_12.16.1860_i386.deb\nroot@kemal:~#\n```\n\nAs seen, deb package\
    \ is ready to be installed. We give the command with specifying the path to the\
    \ directory which our packet is in. For example, I saved the file in my home directory\
    \ (home), so I use the command like `dpkg -i <package.deb>`. If you press the\
