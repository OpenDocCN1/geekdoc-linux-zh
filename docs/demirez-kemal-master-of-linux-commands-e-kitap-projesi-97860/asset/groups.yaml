    and doing backup in different formats. This command called dd command. The basic
    usage of this command like dd if=/dev/sda of=/dev/sdb means sda disk will be copied
    in dd disk. To erase the contents of disc partition by writing random bits we
    should use dd if=/dev/urandom of=/dev/sdb (in this line /dev/sdb refers usb flash
    disk contents)


