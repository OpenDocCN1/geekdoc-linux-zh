  mdcn: "\n\n# 第1章\n\n## Bash 与 Linux 命令行\n\n如果你开始使用 Linux 操作系统，首先需要学习的概念是 Linux 终端（控制台）和\
    \ Linux 命令行概念。我们将讨论这些内容，但首先，Linux 内核（Kernel）非常值得探讨。内核是操作系统的核心。在 Linux 世界中，它自称为\
    \ linux。因此，当我们谈论 Linux 时，我们实际上是在谈论内核。实际上，此处的正确术语是 GNU Linux。如今，它被用来表达 Linux 和\
    \ GNU Linux 相同的意思。我将在本文中使用该术语指代它们。\n\n在这些序言之后，让我们继续解释内核。内核是操作系统的核心。内核最重要的任务是提供硬件与软件之间的通信。另一个重要任务是检查系统内存和系统运行的进程。所有操作都应该作为系统用户之间的中介，根据来自用户的输入进行处理。即使我们使用图形化用户界面（GUI）或只通过命令工作，也没有区别，所有事务都是通过解释型命令在后台发生的。在\
    \ Linux 中，我们通过一个名为命令行的系统运行此过程，它通过基本结构获取一个 shell 程序。Linux 终端（控制台）为我们在系统中想要执行的工作提供了一个非常灵活且实用的结构。这种灵活的结构使得\
    \ shell 程序的性能是可以满意的。\n\n# 14 | Linux 命令大师\n\n### Shell\n\nShell 位于用户和内核任务之间，解释用户的命令以与内核进行通信。内核与\
    \ shell 的交互通过系统调用（system calls）发生。\n\nLinux 系统中有许多 shell，但最受欢迎的程序是 BASH shell\
    \ 程序。要学习在我们的系统中使用 shell 程序，可以使用 `echo $SHELL` 命令。\n\n```bash\nroot@kemal:~# echo\
    \ $SHELL\n/bin/bash\nroot@kemal:~# \n```\n\n控制台记录了我们的订单并向我们返回结果。我们说它还会检查从控制台发布的命令，但它是根据什么进行解释的？这一点，环境变量的概念就发挥作用了。\n\
    \n# 环境变量\n\n我们将使用以下命令并检查该命令尝试向我们解释什么，以获取主题。我们将使用的命令是 `echo $ PATH` 命令\n\n```bash\n\
    root@kemal:~# echo PATH\n/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/bin\n\
    root@kemal:~# \n```\n\n这个命令的输出告诉了我们什么？它想表达的是：我需要分别查看某些索引来操作从控制台输入的命令。如果可执行文件位于这些目录之下，我就可以运行它。如果该路径（PATH）通过\
    \ `:` 符号附加到由该语句（PATH）分隔的语句形成的结构上，它被称为环境变量。\n\n我们可以使用 `printenv` 或 `env` 命令随时查看工作环境的环境变量。\n\
    \n```bash\nroot@kemal:~# env\nXDG_VTNR=7\nSSH_AGENT_PID=922\nXDG_SESSION_ID=1\n\
    GPG_AGENT_INFO=/run/user/0/keyring/gpg:0:1\nTERM=xterm\nSHELL=/bin/bash\nXDG_MENU_PREFIX=gnome-\n\
    VTE_VERSION=3801\nGJS_DEBUG_OUTPUT=stderr\nWINDOWID=29360139\nGJS_DEBUG_TOPICS=JS\
    \ ERROR; JS LOG\nUSER=root\n```\n\n现在，让我们看看命令输出在媒介/环境或 shell 变量中意味着：\n\n- PATH：当给定命令时，搜索构成该命令程序的文件的目录。\n\
    - HOME：包含用户个人目录（主目录）的变量名。\n- TERM：与 X 服务器相关的变量，图形屏幕图像将发送到该服务器。\n\n# 16 | Linux\
    \ 命令大师\n\nSHELL：它是当前运行的 shell 脚本的位置。\n\n例如，你想编写一个程序来操作直接从控制台给出的命令。这意味着你不想在特定目录下运行命令，而是想在行末尾添加\
    \ PATH，这样适当的命令就可以直接工作。为了这一点，你必须将目录添加到路径中。如果你的程序在 `/usr/local/prog` 目录，你可以通过以下命令将其添加到路径中：\n\
    \n```bash\nPATH=$PATH:usr/local/prog\n```\n\n我们提到也可以通过 `echo $ PARAMETER_NAME`\
    \ 命令学习环境变量的名称。但假设我们想更改环境变量的值。为了做到这一点，我们使用以下命令模式。\n\n```bash\nexport PARAMETER_NAME\
    \ =value\n```\n\n如果你想让此更改在系统中永久生效，你需要将此语句包含在 `.bashrc` 文件。因为当系统启动时，它会打开该文件并根据文件值进行操作。\n\
