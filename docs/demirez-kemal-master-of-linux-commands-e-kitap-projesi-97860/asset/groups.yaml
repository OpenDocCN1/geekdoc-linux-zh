  mdcn: "\n\n## dpkg\n\nDebian/Ubuntu Linux 发行版基础是一个使用 deb 的管理系统。该程序是通过手动安装的。例如，如果你想在你的系统上安装\
    \ Opera 浏览器，你需要下载 Opera 浏览器的 debkg 软件包。该程序包的名称类似于此：\n\n```bash\nroot@kemal:~#\
    \ ls -l opera_12.16.1860_i386.deb\n-rw-r--r-- 1 root root 13063000 Kas 20 15:14\
    \ opera_12.16.1860_i386.deb\nroot@kemal:~#\n```\n\n如所示，deb 软件包已准备好安装。我们通过指定软件包所在目录的路径来执行命令。例如，我将文件保存在我的家目录（home），所以我使用了诸如\
    \ `dpkg -i <package.deb>` 的命令。如果你通过输入 deb 软件包名称的前几个字母并按 tab 键，命令将自动补全。例如，当你正在输入\
    \ `dpkg -opera` 时。\n\n```bash\nroot@kemal:~# dpkg -i 12.16.1860_i386.deb\nDaha\
    \ önce seçili olan paketler açılıyor.\n(Veritabanı hazırlığı ongoing ... opera_12.16.1860_i386.deb\
    \ ...)\nPaket açılıyor ... 329017 dosya ve dizin kuruldu.\nPaket açılıyor (opera_12.16.1860)\n\
