    \ `who -r` 命令。\n\n```\nroot@kemal:-# who -b\nsystem boot 2015-09-18 10:14\nroot@kemal:-#\
    \ who -r\nacılış-seviyesi 5 2015-09-18 10:15\n```\n\n特别是使用 `whoami` 命令，我们可以轻松地看到此时在系统中以何种身份工作。你可能会问为什么我们需要它。如果你只在自己的系统中工作，那么确实没有需要，但如果你作为多用户系统的管理员工作，你可能非常需要它。\n\
    \n现在让我们看看如何冒充他人的身份。对于 root 用户来说已经没有限制，因此他们可以使用任何用户的身份执行任何进程。然而，如果其他用户想以 root 或另一个用户的\
    \ ID 进行处理，他们必须知道密码。要冒充其他用户的 ID，我们基本上使用 `su` 命令。它们的工作原理如下：\n\n- `su <user_name>`\
    \ 切换到另一个用户 ID。\n- `su - <user_name>` 既切换到另一个用户的 ID 又在他/她的 shell 中开始工作。\n\n```\n\
    root@kemal:-# su zeynep\nzeyep@kemal:/root$ whoami\nzeyep\nzeyep@kemal:/root$\
    \ exit\nroot@kemal:-# _\n```\n\n正如你通过 `su zeynep` 命令看到的，我们开始以 zeynep 的身份工作。当我们要退出时，使用了\
    \ `exit` 命令。因为我们是 root 用户，所以它没有询问密码。让我们看看 `su - zeynep` 命令。\n\n```\nroot@kemal:-#\
    \ su - zeynep\nzeyep@kemal:-$ whoami\nzeyep\nzeyep@kemal:-$ _\n```\n\n我们提到，如果一个普通用户想以\
    \ root 或另一个用户的身份工作，他 必须知道密码。让我们做一个示例。\n\n```\nzeynep@kemal:-$ su - root\nParola:\n\
    root@kemal:-# _\n```\n\n在任何用户的 ID 下，如果你想冒充 root ID，你可以可以使用 `su` 或 `su -` 命令。当然，你必须输入\
    \ root 的密码。正如我之前提到的，你可以通过 `su` 命令成为另一个用户，但你仍然在自己的目录中工作。使用 `su -` 命令，你可以同时做到这两点：成为该用户并在他/她的目录中工作。\n\
    \n```\nzeyep@kemal:-$ su\nParola:\nroot@kemal:/home/zeynep# exit\nzeynep@kemal:-$\
    \ su -\nParola:\nroot@kemal:-# _\n```\n\n## 进程\n\n进程是指文件运行状态的名称。当你运行一个程序时，它会被加载到内存中。除了我们在系统中启动的进程外，系统中有很多服务和服务进程正在运行。同时运行程序可能包含多个进程。\n\
    \n我们使用 `ps` 命令来查看任何正在运行的进程。要学习此命令的参数，可以使用 `ps --help (a)` 命令。\n\n```\nroot@local~$\
    \ ps aux\nUSER       PID CPU VSZ RSS TTY START COMMAND\nroot      1 0.1 24184\
    \ ? S 23:36 [/bin/init\nroot      7 0.0 0 ? S 23:36 [thread]\nroot      3 0.0\
    \ 0 ? S 23:36 [kthread]\nroot      5 0.0 0 ? S 23:36 [kworker/events]\nroot  \
    \    7 0.0 0 ? S 23:36 [rcu_sched]\nroot      8 0.0 0 ? S 23:36 [rcu_bh]\nroot\
    \      9 0.0 0 ? S 23:36 [migration]\nroot     10 0.0 0 ? S 23:36 [watchdog]\n\
    root     11 0.0 0 ? S 23:36 [khelper]\n```\n\n当然，为了达到最好的效果，使用参数是一个更好的主意。我们可以使用如下命令：\n\
    \n- `ps`: 与活动用户相关的进程。\n- `ps -e`: 系统中运行的所有进程。\n- `ps -e` 或 `ps -f`: 用于系统中运行进程的详细列表。\n\
    - `ps -u <user>`: 与特定用户相关的进程。\n\n如果我们希望看到所有进程以获取我们想要查看的进程。为了获取关于进程的信息，可以使用 `ps\
    \ aux`。\n\n```\nroot@local:~# ps aux\nroot      1 0.1 24184 ? S 23:36 [/bin/init\n\
    root      7 0.0 0 ? S 23:36 [thread]\nroot      3 0.0 0 ? S 23:36 [kthread]\n\
    root      5 0.0 0 ? S 23:36 [kworker/events]\nroot      7 0.0 0 ? S 23:36 [rcu_sched]\n\
    root      8 0.0 0 ? S 23:36 [rcu_bh]\nroot      9 0.0 0 ? S 23:36 [migration]\n\
    root     10 0.0 0 ? S 23:36 [watchdog]\nroot     11 0.0 0 ? S 23:36 [khelper]\n\
    ```\n\n当然，为了达到最好的效果，使用参数是一个更好的主意。我们可以使用如下命令：\n\n- `ps`: 与活动用户相关的进程。\n- `ps -e`:\
    \ 系统中运行的所有进程。\n- `ps -e` 或 `ps -f`: 用于系统中运行进程的详细列表。\n- `ps -u <user>`: 与特定用户相关的进程。\n\
    \n如果我们希望看到所有进程以获取我们想要查看的进程。为了获取关于进程的信息，可以使用 `ps aux`。\n\n```\nroot@local:~# ps\
    \ aux\nroot      1 0.1 24184 ? S 23:36 [/bin/init\nroot      7 0.0 0 ? S 23:36\
    \ [thread]\nroot      3 0.0 0 ? S 23:36 [kthread]\nroot      5 0.0 0 ? S 23:36\
    \ [kworker/events]\nroot      7 0.0 0 ? S 23:36 [rcu_sched]\nroot      8 0.0 0\
    \ ? S 23:36 [rcu_bh]\nroot      9 0.0 0 ? S 23:36 [migration]\nroot     10 0.0\
    \ 0 ? S 23:36 [watchdog]\nroot     11 0.0 0 ? S 23:36 [khelper]\n```\n\n特别是使用\
    \ `whoami` 命令，我们可以轻松地看到此时在系统中以何种身份工作。你可能会问为什么我们需要它。如果你只在自己的系统中工作，那么确实没有需要，但如果你作为多用户系统的管理员工作，你可能非常需要它。\n\
    \n如果你关注命令的输出，我们必须查看最近使用的进程。为了避免这种情况，我们可以尝试以下命令。\n\n```\nroot@kemal:~# ps aux |\
    \ grep 'ssh'\nroot      819 0.0 6412 24 7 Ss 23:07 /usr/bin/ssh-agent /dbus-agent-exit-with-session-classic\n\
    ```\n\n## Ptree\n\n为了以分级列表查看系统进程，可以使用 `ptree` 或 `ps -forest` 命令。\n\n```\nroot@kemal:~#\
    \ ptree\nsystemd--ModemManager--gdbus\n               |{gmain}\n           -NetworkManager--NetworkManager\n\
    \                                     |{gdbus}\n                             \
    \        |{gmain}\n           -accounts-daemon--gdbus\n                      \
    \               |{gmain}\n               -agetty\n               -at-spi-bus-laun--dbus-daemon\n\
    \                                     |--dconf worker\n                      \
    \               |--gdbus}\n                                     |{gmain}\n```\n\
    \n如果你想查看带有 PID 数字的进程，可以使用 `ptree -p` 命令。\n\n```\nroot@kemal:~# pstree -p\nsystemd(1)-----ModemManager(512)--gdbus(572)\n\
    \                                     |{gmain}(568)\n                      |--NetworkManager(520)--NetworkManager(604)\n\
    \                                     |{gdbus}(619)\n                        \
    \             |{gmain}(617)\n                      |--accounts-daemon(509)--gdbus(573)\n\
    \                                     |{gmain}(577)\n                      |--agetty(584)\n\
    \                      |-at-spi-bus-laun(827)--dbus-daemon(831)\n            \
    \                         |--dconf worker}(828)\n                            \
    \         |--gdbus}(830)\n                                     |--{gmain}(832)\n\
    ```\n\n## Top\n\n为了获取有关进程的信息，另一个名为 `top` 的命令。与 `ps` 工具不同，该工具监控进程内部的突发变化。系统中运行的应用程序对工作负载有需求，这就是为什么可能会发生突发变化。该命令最基本的用法是\
    \ `top`。如果我们使用 `top -d 10` 命令，它将每 10 秒更新一次结果（默认值为 3 秒）。退出时，你可以按 q 键。\n\n"
