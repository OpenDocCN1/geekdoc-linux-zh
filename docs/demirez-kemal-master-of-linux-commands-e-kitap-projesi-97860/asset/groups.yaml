    \n使用该命令后，你会发现 `kali` 词被替换为 `debian`。假设我们有一个名为 `distro` 的文件，我们想要将第 2 行和第 3 行短语中的\
    \ `linux` 单词更改为 `LINUX` 单词。我们将使用 `:2,3s/linux/LINUX/g` 命令来实现。\n\n## Kemal Demirez\
    \ | 225\n\n![](img/aa6ce54dbb8ffe5b9d7befb8c6764064_224_0.png)\n\n在使用上述所示的命令后，新情况如下。\n\
    \n![](img/aa6ce54dbb8ffe5b9d7befb8c6764064_224_1.png)\n\nVim 编辑器有许多功能。虽然我们无法展示所有的功能（因为那将是一本书的大量），但让我们继续解释一些功能和应用。例如，通过\
    \ `vim -` 命令，文本从标准输入（即命令行/终端）传输到 Vim 缓冲区。写入完成后，你可以使用 `CTRL + D` 键组合完成，并继续在标准的\
    \ Vim 界面工作。\n\n```\nroot@kemal:~# vim -\nVim: Reading from stdin...\nAnkara\n\
    Istanbul\nIzmir\nBursa\nAfyon\nBalıkesir\nAntalya\n```\n\n在我们完成上述写入过程后通过 `CTRL\
    \ + D` 结束文本输入，并移动到如下所示的标准 Vim 编辑器。\n\n![](img/aa6ce54dbb8ffe5b9d7befb8c6764064_225_0.png)\n\
    \n打开文件后，例如为了将光标定位在第 10 行，我们使用 `vim +10 <file>` 命令。如果使用 `vim +<file>` 命令，光标将放在最后一行。如果你想以只读模式打开文件，可以使用\
    \ `vim -R <file>`。例如，让我们用 `vim -R distro` 以只读模式打开名为 `distro` 的文件。\n\n![](img/aa6ce54dbb8ffe5b9d7befb8c6764064_226_0.png)\n\
    \n位于底部的只读警告引起了你的注意。当你切换到插入模式对文件进行更改时，你会收到下面的警告。\n\n![](img/aa6ce54dbb8ffe5b9d7befb8c6764064_226_1.png)\n\
    \n当然，这种方式你仍然可以工作，但不允许对该文件进行更改。如果你决定使用 `:w!` 或 `:set noro` 保存你的工作，你可以重置只读功能。我们可以使用\
    \ `vim -x <file>` 创建加密文件，当写入文件时，它会要求输入密码。举个例，我们有一个名为 `hacker` 的文件。为了获取关于我们文件的信息，我们使用\
    \ `file hacker`，查看内容使用 `cat hacker`。\n\n```\nroot@kemal:~# file hacker\nhacker:\
    \ ASCII text\nroot@kemal:-# cat hacker\nLinux\nWindows\nAndroid\nVoip\nAPT\nReverse\n\
    root@kemal:-#\n```\n\n Kemal Demirez | 229\n\n![](img/aa6ce54dbb8ffe5b9d7befb8c6764064_228_0.png)\n\
    \n在我们使用 `:w` 保存文件后，会在底部看到这样的警告：\"hacker\" [readonly]。现在让我们退出 Vim 编辑器并再次检查我们的文件。\n\
    \n```\nroot@kemal:~# file hacker\nhacker: Vim encrypted data\nroot@kemal:-# cat\
    \ hacker\n```\n\n可以看到我们的文件已被加密。当我们用 `vim hacker` 命令打开文件时，它会要求输入已识别的密码。\n\nNeed\
    \ key for \"hacker\"\nEnter key: ****\n\n输入密码后，将允许我们对文件进行操作。\n\n## 230 | Linux\
    \ 命令精通\n\n我们可以使用 `:set nu` 命令列出文本中的行。如果你想让光标位于第 11 行，可以使用 `:11` 命令。\n\n![](img/aa6ce54dbb8ffe5b9d7befb8c6764064_229_0.png)\n\
    \n如果你想查看与 Vim 编辑器相关的所有设置，必须使用 `:set all` 命令。\n\n## Kemal Demirez | 231\n\n![](img/aa6ce54dbb8ffe5b9d7befb8c6764064_230_0.png)\n\
    \n```\nDosya Düzenle Görünüm Ara Yardım\n-- set all\n-- Options --\naleph=224\n\
    noashhape\nnoowreviews\nnokeymap\namowidth\nnotocdir\nnotoindent\nnotoread\nnoitwrite\n\
    backgroundlight\nbackcopyauto\nbackpexite=\nbackupskimp/\nballoundelay=60\nboballoneval\n\
    bobonnexpr=\nbobinery\nbobmb\n-- More --\nquitabtcoltip=\nshellquote=\nheight=28\n\
    helplan=str\nnohidden\nhistory=50\nnohelpmap\nnosearch\nicon\nconstructing\nnoignorecase\n\
    imactivefunc=\nimactivatekey\nnoimudline\niminsert=2\ninstatusfunc=\nindexpr=\n\
    nosearch\nashiftright\nshiftwidth=\nshowbreak=\nshowcmd\nshowfulltag\nshowmode\n\
    showtable=1\nsidescolloffs=\nsmartcase\nsmartindent\nsmartabb\nselfstop=0\nspospell\n\
    spellfile=\n```\n\n要列出之前使用的命令：使用 `:history` 命令即可。对于内存中存储了多少命令，可以使用 `:set history`。要更改存储命令的数量，应使用\
    \ `:set history=XY`（XY 存储命令的数量）命令。\n\n:history\n\n+   # cmd history\n1 wq vimtest\n\
    2 r file_B\n3 !ls\n4 !ls\n5 set history\n6 p\n7 next\n8 previous\n9 n\n10 s/kali/devian/g\n\
    11 2,3s/linux/LINUX/\n12 set bomb\n13 set fileencoding=utf-8\n14 wq\n15 w!\n16\
    \ set noro\n\n## 232 | Linux 命令精通\n\n你可以直接在文件中使用 `/search-word` 命令来查找单词。光标会经过你搜索的单词。\n\
    \n```\nVIEW\ngvim gview\nevim eview\nrvim rview\nrgvim rgview\n```\n\nDESCRIPTION\n\
    Vim 是一个文本编辑器，可以用于编辑所有，对于编辑 /gvim 特别有用。\n\n当我们搜索文本时，为了消除大小写敏感，使用 `:set` 命令。\n\n\
    最后，Vim 编辑器的配置文件是 `vimrc` 文件。行开头的 \" 符号表示这是一行注释。如果你删除了 \" 符号，该文件中的设置将被激活。可以此方便地进行任何安排。\n\
    \n```\n\" 以下内容被注释掉了，因为会导致 Vim 的行为与普通 Vi 有很大不同。不过非常建议使用。\n\" showcmd 在状态行中显示（部分）命令。\n\
    \" showwatch 显示匹配的括号，\n\" set ignorecase 执行不忽略大小写的匹配\n\" set smartcase 执行智能大小写匹配\n\
    \" setsearch 增量搜索\n\" set autowrite 在执行如 :next\n和 :make 等命令前自动写入\n\" set hidden\
    \ 在丢弃缓冲区时隐藏缓冲区\n\" set mouse 启用鼠标使用（所有模式）\n\" 加载全局配置文件（如果可用）\nif filereadable(\"\
    /etc/vim/vimrc.local\")\n\" source /etc/vim/vimrc.local\ndefif\n```\n\n"
