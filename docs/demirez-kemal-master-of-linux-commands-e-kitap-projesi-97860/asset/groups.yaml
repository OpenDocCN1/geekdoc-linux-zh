    gw 192.168.1.1` 命令。


    # Ping


    `ping` 命令用于查看本地网络或远程网络是否存在活跃地址。`ping` 命令通过 ICMP协议发送 ECHO_REQUEST。


    当服务器接收到此请求时会进行回答，计算并向用户显示已时间。`ping` 命令通常用于检查被测机器是否工作正常。如果它对 `ping` 请求没有响应，说明远程连接的机器可能没有正常工作。`ping`
    也用于估计机器之间的传输速度。响应快速的机器通信将比响应慢的机器更快。


    当您不带参数使用 `ping` 命令时，它会继续向目标系统发送数据包，直到您通过 CTRL + C 停止命令。为了防止这种情况，您应该使用 `-c` 参数。例如，使用
    `ping -c 3 <target_address>` 命令仅向向地发送 3 个查询数据包。


    # Kemal Demirez | 241


    ```

    root@kemal:~# ping -c 3 192.168.1.2

