    # Date


    Date command is used to find the current time and date information of the system.


    ```

    root@kemal:~# date

    Cts Agu 22 21:00:34 EEST 2015

    root@kemal:~#

    ```


    # Hostname


    To view the hostname we get from the computer system that we use, we can use the
    hostname command.


