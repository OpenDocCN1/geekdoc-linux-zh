    \ `ifconfig wlan0` 命令来查看无线网络配置信息。\n\n```\nroot@kemal:~# ifconfig wlan0\nwlan0\
    \      Link enc:Ethernet HWaddr 54:e6:fc:95:fc:ec\n               inet addr:192.168.1.3\
    \ Cast:192.168.1.255 Mask:255.255.255.0\n               inet6 addr:fe80::566:ff:fe05/64\
    \ Scope:link\n               UP BROADCAST RUNNING MULTICAST MTU:1500 Metric:1\n\
