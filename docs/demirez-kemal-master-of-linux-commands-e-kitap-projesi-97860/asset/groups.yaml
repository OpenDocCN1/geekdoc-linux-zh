    \ 系统中的基础帮助文件。一个 man 页的结构通常如下：\n\n- NAME：命令的名字和定义\n- SYNOPSIS：如何使用该命令\n- DESCRIPTION：命令功能的描述\n\
    - EXAMPLES：命令的用法示例。\n- SEE ALSO：相关标题。\n\n手册页位于下方 /usr/share/man。\n\n```\nroot@kemal:/usr/share/man#\
