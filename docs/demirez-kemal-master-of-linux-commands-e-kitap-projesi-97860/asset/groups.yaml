    | /dev/sda2 | | 760832010 | 78139391 | 2056192 | 1024M | 82 | Linux swap / Solaris
    |


    In this output /dev/sdb shows my usb flash drive. To test me flash disk I use
    badblocks -v /dev/sdb command.


    ```

