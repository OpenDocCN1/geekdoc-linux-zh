    我们将在第 12 级结束对该书的深入研习。既然 HackersLab 有（至少据我目前所知）17 个级别，为什么这么安排呢？问题在于，从第 13 级开始，不再有值得研习的“新”内容了。我认为你不会希望只是通过关卡而不学习。好吧，让我们假设第
