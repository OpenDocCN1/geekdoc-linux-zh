    # What Is a VPN?


    VPN is an acronym for the virtual private network and a service that allows or
    enables you to have access to the internet privately and safely without any compromise
    to your information. Furthermore, it allows you to get through restricted contents,
    which naturally you may not have access to using your normal internet connection.
    With the VPN, you route your connection via a server that allows you to hide your
    online activities.


    There are some basic terms I want you to understand before we dive deeper into
    the VPN. With these terms, you can easily understand certain things I will explain
    in the latter part of this chapter.


    +   *   **VPN Client** – This represents the software that links your device/computer
    to the VPN service. At times, the “VPN app” and “VPN client” are used consecutively.

    +   *   **VPN Server** – This represents a single endpoint in the VPN network
    where the connection and encryption of your internet traffic takes place

    +   *   **VPN Protocol** – This represents the method used by a device to successful
    create a secured connection to the VPN server.

    +   *   **VPN Service** – This represents an entity, which offers you the capability
    of using their VPN network. Besides this service, they provide VPN software to
    clients. To access these services, clients must be subscribed to their packages.
    VPN providers and VPN services are used interchangeably.


    # How Does VPN Work?'
  - '[PAGE 192]


    With the strong foundation you have received, it is time to dive into the working
    principle of a VPN. It is not enough to just subscribe to a VPN service and neglect
    how it works. Once, you know how it works, you can avoid any loopholes you may
    intentionally or accidentally open to your attackers or cybercriminals.


    VPN uses a simple operation to provide the services you need by encrypting your
    connection between your computer system and the server. You can consider this
    encrypted connection to be a protected tunnel that allows you to access everything
    online while appearing in the location of the VPN server that you are connected
    to. For instance, you may be in the United States and appear to be connected online
    in China. The VPN server protects your location and uses its server position as
    yours. This gives you additional security, a high level of online anonymity, and
    unrestricted access to the internet irrespective of your location.


    ![](img/3160dc3e935e544bd1134d7a61442b62_192_0.png)


    From the diagram above, you can see how VPN works. It is hard for hackers or government
    agencies to monitor and restrict your activities. The tunnel serves as your VPN
    that protects your online presence and privacy. Does that sound interesting? Well,
    let''s look at another scenario where there is no VPN used.'
