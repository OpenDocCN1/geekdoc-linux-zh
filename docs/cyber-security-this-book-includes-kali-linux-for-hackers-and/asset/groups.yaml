    - 我们连接到 HackersLab 并尝试列出具有 level3 用户权限和 level2 组权限的文件。

    - 我们找到了 alert 文件。大概是从本级别描述中之前创建的那个。

    - 下一步：列出它。执行它。让我们做。


    我们运行了 alert 文件，发现 Kevin 使用 more 命令在你的文件屏幕之间暂停。如果我们按下 Enter，Page Down 和其他一些键，文件将继续缓慢显示。相反，我们将执行以下操作：我们在
    `--More--` 上写下命令 `! /bin/sh`。这意味着告诉系统：亲爱的 Linux，运行（`!`）bin 目录（`/bin/sh`）内的命令解释器
    sh。我们跌入了 shell。因为谁正在运行 shell 是一个具有 level3 权限的程序，我们用 `whoami` 测试，发现已经是 level3 就绪了。运行
    `pass`，就这样，我们到达 level3！


    ## Level 3 题目


    登录名：level3

    密码：hackerproof

    学习内容：PATH 和 IFS HackersLab


    Level 3 和 Level 4 几乎是一样的，在这两个级别中，你需要理解 PATH、IFS 和 export 的概念。这些级别在挑战的早期部分确实非常有趣且困难（你稍后会发现
    level5 和 6 要容易得多）。虽然这本书侧重于如何破解 Linux 系统，但我将简要解释 PATH。学习这个术语使理解其他术语更容易。首先，让我们进入概念：


    PATH 是目录的绝对路径，系统总是在这些目录中查找要运行的文件。例如，在系统根目录中输入命令 `ls`、`dir`、`date` 或任何其他命令，操作系统将按这些命令搜索
    PATH 目录并执行它们。如果没有，它将返回错误。复杂吗？没那么复杂。


    让我们看一个简单的例子。在上面的 DOS 例子中，我列出了名为 test director 的目录中的数据。我发现有一个名为 `app.exe` 的程序。然后我尝试从根目录运行
    app。我收到一个错误，说命令未被识别（未找到）。因此，我修改了 PATH 并将其指向 app 所在的 test director。只需使用 `PATH =
    C:\directory\test`。我再次尝试运行 app，瞧！它正常运行了。当然，现在命令在系统搜索的 PATH 内部。


    好的，但这与黑客挑战有什么关系？全部。想象一个 Windows 应用程序外部调用 `send NET.EXE`（控制 NetBIOS 协议的命令，可能连接到共享、发送消息、启用用户等）。如果我自己创建了另一个同名文件（`NET.EXE`），把它放在
    test director 并设置 PATH，会发生什么？`NET` 将由个人程序正常调用，但我的 `NET`，可能是一个入侵程序，如后门（或木马）。


    回到 Linux，那么想象 Steven 的程序只是写入日期。这很容易，只需在目录中创建一个伪造版本


    '
