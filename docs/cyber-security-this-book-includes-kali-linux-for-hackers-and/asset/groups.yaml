    Perhaps you are trying to come to the reality of the recent data breach headlines,
    it does help you to recognize the various means these attackers can cause severe
    harm to their victims. Before looking at the different types of attacks, I want
    to categorize these cyber threats into three categories.


    +   1.  Attacks on Confidentiality

    +       Most cyber-attacks begin with the stealing of personal information rather
    than copying it. These attacks on confidentiality including stealing Bitcoin wallets,
    identity theft, and credit card fraud, etc. Some hackers or cybercriminals make
    confidential attacks their priority as they aim to gather confidential information
    for their economic, military, and political gain.


    +   2.  Attacks on Availability

    +       Today, we see this kind of attack in the form of denial-of-service and
    ransomware where victims are denied access to their data when they need it. A
    denial-of-service flood the resource of a network to make it unavailable whereas
    ransomware encrypts the information of a victim and request for a ransom before
    it can be decrypted.'
