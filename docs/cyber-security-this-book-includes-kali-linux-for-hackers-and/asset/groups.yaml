    \n## 第5关题目\n### 用户名: level5 密码: Silent night, holy night!\n#### 学习内容：二进制文件中的字符串。\n\
    \n首先，什么是字符串？如大学所学，它是字符分组。在通俗语言中，它是单词、句子或文本。每当我们要编程时，我们需要使用字符串彼此以及用户进行沟通。以下是不同语言中面向用户的字符串示例：\n\
    \n- Pascal: `writeln('Enter a number');`\n- C++: `cout >> \"Enter a number \\\
    n\";`\n\n字符串也用于对单词和短语进行简单的比较。\n\n我知道所有程序员都厌倦了看到这些，但对于非程序员来说，基础解释很重要，以免他们感到太困惑。一个比较的示例：\n\
    \n```\nTest Program;\nvar x: string;\nbegin\n  writeln('Enter your password: ');\n\
    \  readln(x);\n  if x = 'binladen' then\n    begin\n      writeln('Correct Password');\n\
    \    end\n  else\n    begin\n      writeln('Incorrect password');\n    end;\n\
    end;\n```\n\n在这个 Pascal 小程序中，我首先向用户发送一段请求密码的文本。我读取包含密码的变量，然后进行比较：如果字符串（密码）与 `binladen`\
    \ 相同，我写入密码正确，否则，输入密码错误。这对任何人来说都不是什么新鲜事。在这里，对我们来说有趣的部分将是编译后的程序，而不是源代码。当我们不使用加密功能或可执行文件时，编译后的程序会保留大多数我们的字符串供查看。你可以使用十六进制编辑器看到这一点。但有一种更简单的方法，即\
    \ `strings` 命令，它扫描任何二进制文件（不仅仅是可执行文件）并显示找到的字符串。我将在 DOS 中编译之前显示的代码，并逐步展示问题。我编写了程序并进行了测试。\n\
    \n我输入 `saddamhussein` 作为密码。它返回密码错误，所以我用默认密码 `binladen` 进行测试。程序返回密码正确。很快之后，我将输入\
    \ `strings` 命令 `progtest.exe` 来尝试找到字符串 `binladen`。\n\n噢…… 快速查看 `strings` 命令生成的结果，我们发现了四行有趣的内容：\n\
    \n- 输入你的密码：\n- bin Laden\n- 密码正确\n\n因此，我们可以不使用加密功能或可执行文件中的任何压缩，就能找出简单的密码。我们在 DOS\
    \ 中看到了这一点，但在 Linux 中呢？所以，让我们一步步来。\n\n我们以 level5 身份连接到 HackersLab。我们正在寻找目标文件，即题目中提到的新修改的后门位置。我们找到了\
    \ `/lib/security/pam_auth.so`（目录 `/lib/security` 中的文件 `pam_auth.so`）。我列出了你的信息，并且再次被允许执行。那就让我们执行吧。\n\
    \n我们运行了 `pam_auth.so`，它询问密码，我们放入任何字符串词，它返回密码错误。让我们首先检查你的目录是否有更多有趣的文件。有很多文件。如果我们在每个文件中都尝试\
    \ `strings` 命令，会浪费大量时间。所以，我们将尝试主要的那个，`pam_auth.so`。我们会发现什么有趣的东西吗？我们找到了几个可能的密码：`abcd1234`,\
    \ `loveyou!`, `flr1234`，我们将不得不逐一将这些作为第6关密码进行尝试。还有两个短语可能是密码：\n\n- what the hell\
    \ are you thinking?\n- Best of The Best Hackerslab\n\n嗯，这个“Best of The Best Hackerslab”非常可疑。让我们先试试它。\n\
    \n“Best of The Best Hackerslab”是密码。直接到达顶级层级。如果你想，代替直接以 level6 登录并输入密码，可以使用正确的密码通过后来再次让约翰生气！\n\
    \n"
