    # Chapter 5: Computer Virus and Prevention Techniques


    # Introduction


    Today, the idea of you having a computer virus is frightening and poses a sense
    of discomfort. No one wants to be in that situation where a security expert informs
    them that their computer has been infected with a virus with no remedy to rescue
    their files and important document.


    Computer viruses comprise of three different parts, which includes the infection
    mechanism, the trigger, and the payload. Don''t border asking how I came about
    this. Well, the explanation below will make sense to you. The infection mechanism
    deals with how the virus spreads, which is normally by modifying code that contains
    a copy of the virus. Actually, an infection vector is the way a virus spreads
    through its medium. Furthermore, some various use multiple ways of infecting files.
    The trigger part deals with the choice of whether to distribute the payload or
    not. Finally, the payload involves damaging the system accidentally or intentionally.
    Besides the infection mechanism, the trigger and payload parts are optional.


    A computer virus can spread into your system through the following means:


    +   - Pirated software

    +   - Visiting an infected website

    +   - Installing/downloading media players, toolbars, free games, and other system
    utilities

    +   - Sharing pictures, files, and music with friends

    +   - Installing mainstream software applications

    +   - Connecting infected external storage devices'
