    Unix / Linux Passwords.


    Many older hackers are already used to the words DES, shadow, CrackerJack, John
    the Riper ... shame the new generation doesn''t have such intimacy with these
    terms. Unix / Linux uses a password encryption system called DES. This system
    creates an encrypted string and places it in the security file system names which
    are usually / etc / passwd. Used to use now / etc /shadow. They moved to the shadow
    archive hoping to increase the security, leaving the original password with only
    the usernames. Those who take control of the system can get any file, even the
    shadow. A typical shadow entry: mflavio: yFdrXa1EwNYng: 12126: 0: 99999: 7 :::
    According to the previous information, we have the username asmfavio. Encrypted
    Password: yFdrXa1EwNYng. The rest of the numbers are System IDs (UID, GID, etc.).


    Great, I have a user''s password on Linux, but it''s encrypted! No problem, I''ll
    get a program that decrypts. That sounds feasible, but that''s impossible. As
    I said before, DES creates a hash, which is a one-way encryption system. It cannot
    be decrypted. But then ... how do we find out the password? Just use your imagination.
    Think: if the password in shadow cannot be decrypted, how does the system compare
