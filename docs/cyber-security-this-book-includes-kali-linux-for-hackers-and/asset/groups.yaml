    # Chapter 1 - Basic and Essential Linux: The Necessary Basics


    In this chapter, I will cover what you need to know about Linux to perform the
    challenge. Basically, we will see text mode (shell ) commands that will be some
    basic notions of system structuring and usage. Throughout the challenges shown,
    I will explain each command that will be used along with the details.


    We have our structure of use divided into users and groups. This is done so that
    the system administrator can have greater control over who will access it. There
    is also the "superuser," called "root" that, regardless of permissions (which
    we will see below), can perform anything in the system. A practical example: My
    user account on system X is called milestones – a space in the home/macros/ folder
    so I can store my files. My group within this system is called read. It''s a non-original
    name given by root to designate that everyone in my group has permission only
    to read files, nothing more.


    But why the groups? The root administrator could not set this straight into the
    accounts. It could ... but what if a system has a thousand accounts? Not anymore.
    It is easy to separate into groups and perform the permissions collectively than
    individually?


    Still using the previous example, suppose inside the folder/home/milestones, I
    have the permission to do whatever I want (read, write and execute files...).
    Let''s go then. I created a text file called test.txt. When I list the data, it
    will look like this: -rwxr-x—milestones read 10297 test.txt ... What did we get?
    After test.txt we do not care. Let''s look at the initial letters, which are the
    permissions of the text file I created. They are divided as follows: r -> readw
    -> writex -> execute and the division is done as follows: Type: - User:'
