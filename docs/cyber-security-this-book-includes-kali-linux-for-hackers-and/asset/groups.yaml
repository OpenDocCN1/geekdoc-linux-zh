    \ John the Ripper（可以在 [http://www.blackcode.com](http://www.blackcode.com) 获取）来找出密码。但首先，我们需要停止词库并适配加密密码。有没有一种方法，你可以尝试仅仅通过作为\
    \ John the Ripper 命令行输入的哈希值来确定密码？为此，你可以使用单个选项。但为了研究问题，我们获取了一个 shadow 文件，并用我们获得的哈希值替换了\
    \ root 密码。因此，我们模拟并破解了一个 shadow 文件。JTR（John The Ripper）将尝试将此列表中的所有单词作为密码。列表已保存为\
    \ `passwords.txt`。现在，让我们使用 JTR。JTR 以 `john – wordfile: passwords.txt shadow` 执行（签名说明：亲爱的\
    \ John，请使用词库 passwords.txt 来去除将在 shadow 中测试的密码）。它迅速将密码返回给我。\n\n太棒了。这是一个多么奇怪的词？过了一会儿我们发现：`wonderfu`\
    \ 实际上是英语中的 `wonderful`，是我们列表中的一个词。但他为什么只显示了八个字符（最后一个缺失的 \"l\"）？这是当 Program File\
    \ 目录变成文件时发生的同样问题。该程序基于 DOS，只能显示八个字符。当然，你可以在规则中更改这一点。要了解更多信息，请查看 JTR 手册。重要的是，level8\
    \ 的密码是 **wonderful**！\n\n## 第 8 关题目\n\n登录名: level8  \n密码: wonderful  \n学习内容: 竞态条件\
