    \n- **信任问题** – 考虑到接收方和发送方都需要相同的密钥，这要求双方之间存在不可动摇的信任。例如，接收方可能会在未通知发送方的情况下将密钥泄露给未授权的用户。\n\
    - **密钥建立** – 在通信发生之前，发送方和接收方必须商定一个秘密密钥。这需要一个安全的密钥建立机制才能使该过程有效。\n\n当你考虑到我刚才提到的这两个挑战时，显然它们是现代通信的障碍。如今，个人需要与不可信或不熟悉的各方交换信息。由于发送方和接收方之间存在限制，这就催生了非对称密钥加密方案。\n\
