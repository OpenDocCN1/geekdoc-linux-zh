    \n- **隐私保护**\n\n  保护你的隐私至关重要，你不会愿意为了任何事情而冒风险。如今的大多数防火墙都具有阻止广告软件、劫持程序和间谍软件访问你的计算机的能力。隐私保护功能使你能够保护计算机免受任何感染，特别是那些泄露用户私人信息的软件。\n\
    \n- **应用程序完整性**\n\n  此功能使防火墙能够监控计算机上的文件，以检查是否存在修改问题或这些文件是如何启动的。一旦防火墙检测到任何更改，它会通知用户并拒绝应用程序运行或向互联网传输数据。通常，这些文件修改可能看起来像是一个升级；然而，恶意程序可能触发了这种修改。\n\
    \n- **入侵检测**\n\n  犯罪分子、入侵者或黑客使用各种手段来劫持你的计算机安全。然而，入侵检测功能会扫描所有传入数据，以寻找已知方法的特征。此外，当它识别出任何此类攻击时，会通知你。有趣的是，通过防火墙，你可以知道黑客或入侵者想要攻击你的计算机的方法。\n\
    \n## 通知\n\n通过此功能，你可以了解防火墙上正在发生的特定活动，因为它有多种方式通知你计算机可能遭受的任何渗透或入侵。\n\n## 流行防火墙\n\n\
    由于网络空间中广泛的安全威胁，市场上充斥着各种各样的防火墙。这些不同的防火墙各有其优缺点。然而，以下是一些你可以尝试的个人防火墙：\n\n- Zone Alarm\
    \ Free\n- Outpost Firewall\n- Emsisoft Online Armor Free\n\n商业个人防火墙：\n\n- Zone\
    \ Alarm pro/plus\n- Outpost Firewall Pro\n- McAfee Personal Firewalls\n\n硬件路由器或防火墙供应商：\n\
    \n- NETGEAR\n- Linksys\n- D-Link\n- Belkin\n\n## 结论\n\n获取防火墙来保护计算机的重要性不容忽视。有了防火墙，你可以保护自己免受黑客和病毒的侵害。此外，当你整合适当的规则和监督流程时，你可以放心地使用计算机，无需担心来自任何人的外部威胁。你永远不会在犯罪多发地区将家锁开着。你总是锁门，以防止入侵者和窃贼窃取你的贵重物品。当你可以透过防火墙保护你的文件和重要信息时，为什么要让你的计算机暴露在黑客面前呢？\n\
    \n# 第9章：虚拟私人网络\n\n## 简介\n\n随着在线隐私的持续冲击和不断警示的安全威胁，许多人都面临着这些问题，转向使用VPN服务的人数正在增加。对于可能第一次听到VPN的人来说，使用它可能看起来很复杂，但事实并非如此，因为在这一章中，我将消除对这些概念的迷雾，解释你可以使用它们的用途，为什么你应该考虑使用它们，以及如何有效地利用它们为你带来优势。此外，如果你决定为自己选择一个VPN，我会提出一些建议来帮助你。\n\
    \nVPN，也称为虚拟私人网络，是充分利用你的在线自由和隐私的决定性工具，尤其当你大部分时间都花在网上时。拥有一个好的VPN是不可或缺的，因为它允许你：\n\
    \n- 保护你的设备免受攻击、黑客以及公共无线网络威胁的增加\n- 通过加密你的互联网流量来恢复你的隐私，这使得第三方（如监控机构、网络管理员和互联网服务提供商）难以读取你的信息\n\
    - 通过交换你的位置和IP地址来使用VPN服务器，从而在世界任何地方露面\n- 无论你的位置如何，解除任何受限内容的封锁\n\n除了隐私和安全问题之外，推动VPN使用的两个因素是被封禁的网站和内容限制。从中国到美国，再到北美洲，依赖使用VPN来获得私密、安全、无限制在线体验的人数不断增加。当你拥有保护自己所需的一切时，为什么要允许你的重要信息被盗或被泄露？你的信息安全掌握在你手中。\n\
    \n## 什么是VPN？\n\nVPN是虚拟私人网络的缩写，是一种允许或使你能够私密且安全地访问互联网的服务，而不会对你的信息造成任何损害。此外，它允许你获取受限内容，这些内容在使用普通互联网连接时你可能无法访问。通过VPN，你通过服务器路由你的连接，这允许你隐藏你的在线活动。\n\
    \n在我们深入探讨VPN之前，我想让你理解一些基本术语。借助这些术语，你可以轻松理解我在本章后半部分将要解释的某些内容。\n\n- **VPN客户端** –\
    \ 这代表将你的设备/计算机连接到VPN服务的软件。有时，“VPN应用”和“VPN客户端”互换使用。\n- **VPN服务器** – 这代表VPN网络中的一个端点，你的互联网流量的连接和加密在此处发生。\n\
    - **VPN协议** – 这代表设备用来成功创建与VPN服务器的安全连接的方法。\n- **VPN服务** – 这代表一个实体，它提供使用其VPN网络的能力。除了这项服务外，他们还向客户提供VPN软件。要访问这些服务，客户必须订阅他们的套餐。VPN提供商和VPN服务可以互换使用。\n\
    \n## VPN是如何工作的？\n\n在你获得了坚实的基础后，现在是深入了解VPN工作原理的时候了。仅仅订阅VPN服务并忽视其工作原理是不够的。一旦你了解它是如何工作的，你就可以避免任何你有意或无意地向攻击者或网络犯罪分子开放的漏洞。\n\
    \nVPN通过一种简单的操作来提供你需要的服务，即加密你的计算机系统与服务器之间的连接。你可以将这个加密连接视为一个受保护的隧道，它允许你访问网上的一切，同时出现在你连接的VPN服务器的位置。例如，你可能在美国，但看起来像是连接在中国在线。VPN服务器保护你的位置，并使用其服务器位置作为你的位置。这为你提供了额外的安全性、高水平的在线匿名性，以及无论你的位置如何都能无限制地访问互联网。\n\
    \n![](img/3160dc3e935e544bd1134d7a61442b62_192_0.png)\n\n从上面的图表中，你可以看到VPN是如何工作的。对于黑客或政府机构来说，监控和限制你的活动是困难的。隧道充当你的VPN，保护你的在线存在和隐私。这听起来有趣吗？好吧，让我们看看另一个未使用VPN的情景。\n\
    \n![](img/3160dc3e935e544bd1134d7a61442b62_193_0.png)\n\n关于这张第二张图片，你能说什么？它看起来熟悉吗？当然，这是不使用VPN的人所经历的情况。互联网由负责存储网站并允许任何想要查看它们的人访问的服务器组成。这些服务器彼此通信并共享重要信息，包括你的银行详情、安全号码等。在线共享和浏览是很棒的，但这对于你的隐私来说不是好消息。\n\
    \n当你上网时，就像你登上了一架商业航班。安保人员、行李处理人员、空乘人员和票务代理都需要你的数据才能将你路由到你的城市。互联网上也会发生类似的事情，你的信息会经过各种服务器。如果你只是浏览互联网以寻找乐趣，那么你不应该担心任何人看到你的信息。然而，如果这与商务邮件、在线银行或任何敏感事项有关，情况就大不相同了。如果没有使用VPN，你的所有在线活动都可以追溯到你的物理位置。此外，你的设备暴露了你的IP地址。你用来连接互联网的每台计算机系统或设备都有其独特的地址。\n\
    \n然而，通过VPN，你可以隐藏你的主要位置，并使用VPN服务器的位置来保护自己免受正在增多的网络犯罪分子的攻击。大多数VPN服务提供商维护他们的服务器\n\
    \n"
