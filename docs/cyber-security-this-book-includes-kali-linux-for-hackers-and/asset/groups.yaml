    - 保护并阻碍敏感私人数据，包括照片、信用卡、银行密码以及其他相关信息

    - 在没有受到攻击或泄露风险的情况下访问互联网

    - 防范网络犯罪分子或黑客，特别是在使用机场、酒店和咖啡馆的公共 Wi-Fi 连接时

    - 进行媒体流媒体传输、P2P 下载和 torrent 活动


    你仍然怀疑为你的互联网连接使用 VPN 吗？迄今为止，你已经了解了什么是 VPN，它是如何工作的，以及为什么使用它们。阐明在使用时它们是否安全对于消除疑虑至关重要。


    ## VPN 有多安全


    如今，VPN 的安全性在 IT 专业人士之间引发了激烈的争论。然而，需要注意的是，没有两种服务在安全性或提供的功能方面是完全相同的。鉴于此，如果你能自信地说某款
    VPN 是安全的，那么它对于你的互联网和信息安全就是可用的，前提是一款高质量的 VPN。


    ![](img/3160dc3e935e544bd1134d7a61442b62_196_0.png)


    尽管如此，这并不意味着没有缺陷。如今，市场上有超过 350 款 VPN，如果你考虑到 Google Play 和 Apple 商店中的免费 VPN 应用，这个数字还会继续增加。遗憾的是，这些提供免费服务的
    VPN 存在 bug、缺陷，并对你的个人信息构成巨大的安全和隐私威胁。然而，为了保护你的数据并防止任何信息或设备泄漏，选择一款高质量的 VPN 至关重要。


    如果可能，你应该避免使用任何免费 VPN 应用或服务，因为最近的研究发现，约 84% 的用户数据泄漏源于免费 Android VPN 应用。尽管大多数人已经认识到应该避免使用这些应用，但仍有数以百万计的人出于各种目的在使用它们。如果你认真对待网络安全，就有各种理由建议你避免使用免费
    VPN。包括：


    - 你赋予第三方访问你敏感数据的权限

    - 流量泄漏，例如 DNS 和 IP 地址泄漏

    - 带宽被盗

    - 对你活动的隐藏跟踪

    - 嵌入式恶意软件，这在免费 VPN 中很常见

    - 欺诈行为，包括金融欺诈和身份盗用

    - 浏览器劫持


    重要的是，警惕各种 VPN 骗局，从虚假评论、虚假功能到终身 VPN 订阅。作为一条基本原则，当你订阅 VPN 服务时，应该得到你所付费的服务内容。


    ## VPN 服务合法吗？


    这个问题的答案取决于你居住在世界哪个地区。嗯，在西方世界，只要用于安全和在线隐私目的，使用 VPN 服务是合法的。事实上，大多数企业每天都在使用 VPN，我不认为这种情况会很快改变。


    ![](img/3160dc3e935e544bd1134d7a61442b62_197_0.png)


    然而，有一些国家，如沙特阿拉伯、阿拉伯联合酋长国、伊朗、伊拉克、朝鲜、阿曼、俄罗斯、白俄罗斯和土库曼斯坦，不允许使用 VPN 服务。这些国家对使用此类服务持反对态度，因为它们赋予用户在线获取一切可能内容的权力。


    例如，在中国，政府加强了“Great Firewall”（中国防火墙）的建设，旨在封锁网站和 VPN。尽管如此，一些互联网用户仍使用某些 VPN 来绕过这些问题。另一个禁止使用
    VPN 的措施失败的国家是俄罗斯，因为 VPN 流量是隐藏的，看起来像正常的 HTTPS 流量。


    重要的是，世界各地的企业和私人个人经常使用 VPN 服务进行网络安全管理。因此，鉴于 VPN 对私人和企业安全的重要性，不太可能对其使用进行全面禁止。


    如果 VPN 服务有助于保护或隐藏个人的 IP 地址和位置这一事实显而易见，那么人们难道不能将其用于欺诈或不良活动吗？当然可以！然而，VPN 就像钢铁一样，我们可以将其用于运输、建筑和桥梁等各种用途。此外，其用途并不限于这些，正如我们看到的，钢铁被用于制造坦克、枪支和炸弹，这些会伤害人类。将负面影响与其积极影响相对比，我们要说禁止钢铁会产生更好的结果吗？显然不是，因为这样做将是愚蠢和疯狂的。这就好比因为轻微的伤害而砍断你的左腿。


    VPN 和加密技术也是同样的道理。涉及敏感数据使用且必须加密并用于日常目的的企业、银行和不同网站。无论人们如何滥用这些加密和 VPN 工具，它们对于我们的在线安全和隐私都是必需的。


    ## 设置虚拟专用网络


    你的在线安全和隐私是我的优先事项，这就是为什么在这一部分，我想向你介绍设置 VPN 的最简单方法。然而，设置的具体说明可能会因你使用的设备或系统而异。另一个因素是你可能正在使用的特定
    VPN 服务。尽管如此，本书中的安装步骤是大多数 VPN 提供商针对大多数设备和操作系统推荐的方法。


    以下是如何有效设置你的 VPN 的概述。


    - 选择一个良好且可靠的 VPN 提供商

    - 订阅其套餐，然后将软件下载到你的设备或操作系统上

    - 使用订阅后提供的凭据登录 VPN

    - 连接到你选择的服务器，然后你就可以享受你的在线隐私了


    以下平台的用户 iOS、Android、Mac OS 和 Windows 可以选择使用其操作系统的内置 VPN 功能。这些系统不使用 OpenVPN，而是使用
    IPSec/L2TP 或 IPSec/IKEv2 协议。虽然这可能成本较低；然而，为了享受所有功能并在在线时避免任何数据泄漏，建议使用 VPN 服务来保护你的在线安全和隐私。


    ## VPN 在在线隐私中的作用


    毫无疑问，VPN 既提供安全性又提供在线隐私。如前所述，如果设备没有使用任何 VPN，你的互联网服务提供商或网络犯罪分子可以轻松地监视和记录你的在线活动。这可能包括你与朋友和家人的社交媒体互动、你发布的评论、你访问的网站、你的偏好等。如今，我们有各种隐私违规行为，其中政府或机构要求互联网服务提供商提供用户浏览和数据活动的日志。因此，使用
    VPN 后，你的所有互联网服务提供商看到的只是你通过设备连接到 VPN 服务器并在线。然而，你的数据是安全且经过加密的，第三方没有能力读取你的信息。


