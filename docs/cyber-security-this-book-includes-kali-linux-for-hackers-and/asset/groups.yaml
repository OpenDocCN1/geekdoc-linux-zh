    ### 使用 HTTPS 协议


    如果你的网站没有运行在这个协议上，那么你需要改变这种情况。该协议告诉你的访客，当他们与你的网站互动时他们是安全的。此外，他们知道他们的信息是安全的，没有人可以中断或更改内容。


    如果你的网站没有 HTTPS 协议，它容易受到黑客的攻击，黑客可以更改你页面的信息以收集敏感信息。例如，他们可以窃取你的登录信息以及你用户的登录信息。拥有
    HTTPS 协议的好处不仅在于保护你的站点安全，还有助于提高你的搜索排名。有趣的是，谷歌会对使用此协议的人给予奖励。这就像给你的孩子每一个好的行为都奖励一颗糖果一样。


