    \ shell（文本）模式的命令。在这里 shell 中完成的一切也可以在图形界面中完成，而且这些命令在不同版本的系统中几乎不变。如果您不知道这些命令，请不要担心：在下一章中，我会简要解释您将使用的最重要命令。即使您只有\
    \ Windows，也可以享受内容，因为您只需通过 telnet 连接到 HackersLab 即可使用 Linux。第 1 级将逐步展示这一点。\n\n\
    我们如此频繁地提到 HackersLab……这到底是什么？OHackersLab Challenge 是在安全和黑客界众所周知的一种“游戏”。它如此知名，以至于在巴西版本（由里约热内卢联邦大学\
    \ UFRJ 制作）出现之前就已存在，该版本名为 LockABit (www.lockabit.com)。挑战很简单（至少在术语上）。您从第 0 级开始。目前，共有\
    \ 18 个级别（包括 0 级）需要破解。一旦您赢得挑战，您将获得上一层级的密码。如果挑战结束了，本书会失去实用性吗？当然不会。正如我所说，已经存在其他基于\
    \ HackersLab 的挑战，即使不存在，本书也教了您足够的知识，您可以在自己的 Linux 系统上进行测试。如果我不理解更高级别的关卡怎么办？没关系……本书将始终是您参考。如果您到达需要\
    \ C 编程且仍然无法理解的级别？那就先学习 C 吧。挑战的目标是让您实际上到达第 17 级，成为大师。我可以为您指明方向，但您必须独自走完这条路。如果您是安全领域的新手，我建议您阅读《黑客指南》，这样您将有更好的基础来吸收这里将要教授的内容。\n\
    \n## 第 1 章 - 基础与必要的 Linux：必备基础\n\n在本章中，我将涵盖完成挑战所需了解的 Linux 知识。基本上，我们将查看文本模式（shell）命令以及一些关于系统结构和用法的基本概念。在展示的挑战过程中，我会解释每个使用的命令及其细节。\n\
    \n我们的使用结构分为用户和组。这样做是为了让系统管理员能够更大地控制谁将访问系统。还有“超级用户”，称为“root”，无论权限如何（我们稍后将会看到），它可以在系统中执行任何操作。一个实际的例子：我在系统\
    \ X 上的用户账户名为 milestones – 这是 home/macros/ 文件夹中的一个空间，以便我可以存储我的文件。我在这个系统中的组名为 read。这是\
    \ root 给的一个非原始名称，用来指定我组中的每个人只有读取文件的权限，除此之外没有任何权限。\n\n但是为什么要有组？root 管理员不能直接将其设置到账户中吗？它可以……但如果一个系统有一千个账户呢？不再这样了。将权限集体分配给组比单独分配给每个用户更容易吗？\n\
    \n继续使用之前的例子，假设在 /home/milestones 文件夹内，我有做任何事情的权限（读取、写入和执行文件……）。那么让我们开始。我创建了一个名为\
    \ test.txt 的文本文件。当我列出数据时，它将看起来像这样：-rwxr-x—milestones read 10297 test.txt …… 我们得到了什么？test.txt\
    \ 之后的部分我们不关心。让我们看看开头的字母，那是我创建的文本文件的权限。它们划分如下：r -> 读取 w -> 写入 x -> 执行，划分方式如下：类型：-\
    \ 用户：\n\n"
