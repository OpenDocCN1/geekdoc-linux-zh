    \ `clear` 命令在外部运行吗？让我们沿着这个推理进行，并尝试像第3关那样继续操作。\n\n同样，我们将 `PATH` 导出到 `/home/level4/tmp`\
    \ 目录（我们唯一可以记录的地方）。我们还向系统导出了 `IFS`。我们的记录目录中有一个名为 `clear` 的文件，我们在其中使用了 `/bin/pass`\
