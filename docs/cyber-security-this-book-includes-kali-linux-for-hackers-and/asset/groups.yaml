    # ## Hash Function


    Message digests or hash function is a cryptography technique that doesn''t use
    any key; rather, it uses a fixed-length hash value, which is computed using plaintext.
    This makes it hard for the length or content of the plaintext to be recovered.
    This algorithm is used to offer a digital fingerprint of the content of a file.
    It helps to ensure that a virus or an intruder hasn''t changed the content of
    the file. Most operating systems use the hash function to encrypt passwords, which
    further provide a mechanism to guarantee the reliability of the file content.


    # ## Importance of Cryptographic Algorithm


    A major issue for most people is why do we have different types of cryptographic
    algorithms? What is the need of having three different algorithms when we can
    use only one? The reason behind this is that each algorithm is optimized for a
    specific cryptographic application. For instance, the hash function algorithm
    is perfectly suited for guaranteeing data integrity since any alternation to the
    content of the message will lead to the receiver calculating a hash value that
    is different from that placed by the sender during the transmission of the message.
    Considering the fact that two different messages will not get the same hash value,
    there is a high level of confidence in data integrity.'
