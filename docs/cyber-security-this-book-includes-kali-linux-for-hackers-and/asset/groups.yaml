    # ## OSI Model


    As mentioned earlier, the OSI Model followed a layered approach where each of
    the layers performs a specific function. Simply put, it allocates separate responsibilities
    to each layer that determine how two systems communicate over the internet. For
    this to happen, both systems should be using the same protocol even if they might
