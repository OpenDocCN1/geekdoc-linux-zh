    \n在 1970 年之前，各种密码系统使用对称密钥加密。然而，如今其相关性非常高，并被广泛使用。考虑到对称密钥加密相对于非对称密钥加密的优势，有迹象表明这种加密过程将会长期存在。其优势或特性包括：\n\
    \n- 密钥会不断变更，以阻止对系统的任何形式攻击。\n- 使用对称密钥加密的个人必须拥有一个共同的密钥，才能实现信息的交换。\n- 与非对称密钥加密相比，由于密钥使用的位数较少，加密和解密过程更快。\n\
