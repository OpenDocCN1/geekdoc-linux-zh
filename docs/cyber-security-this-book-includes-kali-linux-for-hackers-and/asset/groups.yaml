    \ C 语言，最好先有一个概念，但现在没关系。理解问题背后的基本概念已经是一个进步。\n\n关于竞态条件问题的这么多理论介绍，对于理解它是如何发生的、两个读取和写入函数之间如何产生问题以及哪些函数可以用来纠正特定问题是必要的。如果你没有\
    \ C 语言的概念并在解释中感到“迷失”，我建议你尝试学习一点，因为此关卡之后的所有级别都将使用编程。这一关比之前的关卡高得多，并且可以分步轻松理解。\n\n\
    我们连接为 level8 进入 HackersLab，我们查找 level9 UID 和 level8 GID 的文件。我们找到了题目中提到的 `/usr/bin/ps2`。进入\
