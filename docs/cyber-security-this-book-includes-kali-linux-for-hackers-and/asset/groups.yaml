    \ 注入和 Stagers。\n\n其操作方式如下：\n\n目标 攻击者  \n(Meterpreter)\n\n首先，漏洞利用程序和第一阶段被发送到目标。\n\
    在成功利用后，Stager 在目标中连接到一个任务，并尝试再次与 msfconsole 通信以建立连接。\n\n一旦连接建立，就会发送第二阶段。如果你成功地执行了\
    \ DLL 注入，metasploit 会发送 Meterpreter DLL 以建立完整且稳定的通信通道。\n\n最后，Meterpreter 使用 TLV\
    \ 协议加载必要的扩展（例如 stdapi 或 priv）。\n\n1. **DLL（动态链接库）**：在 Windows 操作系统中，进程通常加载动态链接库。DLL\
    \ 是执行许多程序共用功能的文件，因此使用它旨在促进代码的模块化以及更好地利用系统资源（特别是内存）。\n\nDLL 注入是一种允许你向其他进程注入代码的技术，这将强制正在运行的进程加载带有恶意代码的\
    \ DLL。由于它“隐藏”在常规进程中，安全程序更难检测到它。\n\n2. **Stager**：建立攻击者和受害者之间的连接负载。它尽可能小且可靠，因此最终会使用几个大小不一的小型\
    \ Stager（metasploit 会根据情况选择合适的）。\n\n3. **Stage**：Stager 的组件或模块。\n\n4. **TLV 协议（Type\
    \ Length Value，类型长度值）**：一种可以非常高效地表示信息的格式。为此使用三个字段：数据类型（基本上是一个标签）、长度（字段值）和值（我们的数据）。\n\
    \nMeterpreter 的额外目标：\n**隐蔽性**\n- Meterpreter 仅驻留在内存中（不在磁盘上留下痕迹）\n- 不创建新进程（注入到已活动的进程中）\n\
    - 我们的机器和目标之间的通信是加密的\n\n**强度**\n- Meterpreter 使用通信通道\n- TLV 协议限制很少\n\n**可扩展性**\n\
    你可以轻松添加扩展，无需重新构建/重新编译\n- Rex：大多数任务的基础库（基本任务、插件管理、协议等）\n- MsfCore：提供“基本”API，定义\
    \ Metasploit 框架\n- MsfBase：提供“友好”API，并与其交互（通常通过接口），简化了在框架中的使用\n\n**模块**\n- 辅助模块允许外部工具（如漏洞扫描器、嗅探器等……）与\
    \ Metasploit 框架进行交互。\n- 编码器模块：提供用于编码和混淆（尝试使其不可理解）我们在漏洞利用成功后将使用的负载的算法。\n- 漏洞利用模块：这是框架中所有可用的漏洞利用程序所在的位置，用于获取访问不同操作系统的权限。\n\
    - 负载模块：提供大量可在漏洞利用成功后远程执行的代码。\n- Post 模块：提供后渗透阶段的功能。\n- Nops 模块：确保负载的连接和数据流量保持恒定\n\
    \n# 第 5 章 - Kali Linux 入门\n\nKali Linux 是著名的 Linux BackTrack 发行版的新版本，用于执行安全审计和渗透测试。Kali\
    \ Linux 是基于 GNU/Linux Debian 的平台，是对 BackTrack 的完整重构，包含大量用于捕获信息、识别漏洞、利用漏洞、提升权限和掩盖痕迹的工具。\n\
    \n本章提供了使用 Kali Linux 中包含的最受欢迎工具的出色实践指南，涵盖了渗透测试的基础知识。本文也是深入该领域的专业人士以及初学者的绝佳知识来源。\n\
    \n## Kali Linux 特性\n\nKali Linux 是对 BackTrack Linux 的完整重构，并完全符合 Debian 开发标准。一套全新的基础设施已投入使用，所有工具都经过检查和打包，现在使用\
    \ Git 作为版本控制系统（VCS）。\n\n- 超过 300 个渗透测试工具\n- 免费，且永远免费\n- 开源 Git 代码树\n- 符合 FHS（文件系统层次结构标准）\n\
    - 对无线设备的广泛支持\n- 用于注入的内核补丁。\n- 安全的开发环境\n- 使用 GPG 签名打包的软件包和仓库\n- 多种语言支持\n- 完全可定制\n\
    - 支持 ARMEL 和 ARMHF\n\n## 获取 Kali Linux\n\nKali Linux 可以下载不同架构的版本，如 i386、amd64\
    \ 以及 armel、armhf。对于 i386、i686 和 amd64，可以下载 ISO 镜像格式或用于 VMware 的虚拟机。也可以通过直接下载或通过\
    \ Torrent 获取。\n\n"
