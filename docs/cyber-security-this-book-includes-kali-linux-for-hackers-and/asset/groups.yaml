    # Chapter 1: Fundamentals and Importance of Cybersecurity


    # Fundamentals of Cybersecurity


    The innovation in the information technology industry is driving efficacy and
    ease of use; this represents a big deal of great value. If you have observed the
    nature of technology, you will know by now that these attributes (efficacy and
    ease of usage of technology) will overtime increase. While various organizations
    are embracing different cybersecurity methods to protect their data and information,
    it is imperative for individuals to take their online security very crucial. In
    view of this, I have assembled the four fundamentals for personal cybersecurity
    that every individual requires. The truth remains that the government alone cannot
    pull the string as we all have a vital role to play. The following four fundamentals
    to your personal cybersecurity aren’t relevant to individuals alone as companies
    and employees in various workplaces can adhere to them.


    # Protection of Devices


    All our gadgets and devices such as tablets, pads, laptops, smartphones, etc.
    are always connected to the internet. In order to avoid any leak of information
    or any intrusion, individuals must protect these devices using the best security
    protection features available. Luckily, a recent innovation in technology has
    brought about effective and high-quality protection systems, which previously
    were only available to large firms. The following precautions must be followed
    as it regards your device protection.


    +   Your device should have real-time antivirus with other defense systems set
    up


    +   There must be a remote management feature, which removes any requirement for
    users input or any behavioral modifications'
  - '[PAGE 105]


    Password management applications must work effortlessly throughout various mobile
    device platforms


    # Protection of Internet Connection


    It is not enough protecting your device because immediately your device connects
    online, it can become a victim. Due to this, your device will require more defenses
    to protect every information within it, which is transmitted through the internet.


    Your device should have its own virtual private network (VPN) to encrypt your
    location. I will talk about VPN extensively in latter chapters because of its
    importance to your cybersecurity. However, a good VPN will do you much good, as
    it will protect your location, identity, banking, shopping, and browsing history.
    It also protects your information transacted online, whether it is business or
    personal.


    # Protect Email Communication


    The third fundamentals to your personal cybersecurity are the protection of your
    email communication. Statistics have shown that most hackers gain the back door
    to your personal information through email communication. Regrettably, in the
    United States, for instance, many consumers expect emails to be free, and this
    has preoccupied us from the primary sense of privacy.


    In using email communication, it is important to use an email service provider
    that uses open-source software for portability, security, and compatibility throughout
    various technology platforms and architecture. Furthermore, the service must automatically
    strip metadata information and IP location from personal emails as they are sent
    through the internet.'
