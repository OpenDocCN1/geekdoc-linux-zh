    # ## Cryptography Digital Signature


    Have you ever signed a document physically? Do you know the importance and implication
    of your action? I am sure you understand if it is a matter of life and death.
    Well, a digital signature is like your handwritten signatures or typed messages,
    which is a binding signatory to that message or document. It is a technique, which
    binds an entity/person to digital data or information. Both the receiver and any
    third party can independently verify this binding.


    In the physical world, when we sign documents, it is a sign of assurance that
    such a message is from the sender, and there shouldn''t be any repudiation of
    the original message. In the case of a digital signature, the signer only knows
    the secret key.


    The model of the digital signature system is based on public-key cryptography,
    and the diagram below shows the entire process involved.


    ![](img/3160dc3e935e544bd1134d7a61442b62_179_0.png)


    The following is an explanation of what goes on in the entire process:


    +   * Each individual implementing the digital signature has his or her own pair
    of the public or private key


    +   * Normally, the keys used for the encryption and decryption process is different
    from that use in the signing and verification process. The signature key is the
    private key whereas the verification key is the public key'
  - '[PAGE 180]


    +   * The signer provides data to the hash function before generating a hash of
    data

    +   * The signature key and hash value are then sent to the signature algorithm,
    which then generates the digital signature based on the given hash. Furthermore,
    the signature is appended to the information before sending it to the verifier.

    +   * The verifier then feeds the verification key and digital signature to the
    verification algorithm, which generates some values as an output

    +   * Additionally, the verifier runs the same hash function from the data received
    to produce the hash value

    +   * In order to ascertain that the digital signature is valid, the verifier
    then compare the output of the verification algorithm with the hash value


    # The importance of Cryptography Digital Signature


    Of all cryptographic primitives we have, the digital signature through public-key
    cryptography is the most useful and significant tool to provide information security
    in this world. Besides its capability of hindering the reproduction of messages,
    it further provides data integrity and message authentication. Let us look at
    the important role that digital signature plays in information security.


    **Data integrity** – peradventure the attacker has access to the information and
    alters anything, at the receiver’s end; the digital signature verification will
    fail. This is because the output from the verification algorithm and the hash
    modified information will not match. Therefore, the receiver can safely reject
    the message, citing a breach of data integrity.'
  - '[PAGE 181]


    +   - **Message authentication** – Once the verifiers authenticate the digital
    signature through the sender’s public key, the verifier is assured that the sender,
    who has access to the equivalent secret private key, created the signature. Therefore,
    the key is between the sender and receiver without any third parties involved.


    +   - **Non-repudiation** – Based on the assumption besides the signer no other
    person has the signature key, the sender can generate a unique signature on a
    set of data. With this, the receiver has evidence of the present data along with
    the digital signature if there is any issue that may arise in the future.


    +   - **Benefits, challenges and The Future of Cryptography in Information Security**


    In conclusion, to this chapter, it is important to explore the benefits of cryptography
    along with its challenges. Currently, we are interconnected with information now
    in its digital form of bytes and bits. Relevant and critical information must
    be protected from criminals. They must be stored, processed, and transferred in
    a digital format through various communication channels. Considering the fact
    that information plays an important role in national security, intruders or attackers
    are targeting any open communication channels and computer systems to either interrupt
    the flow of critical information or steal sensitive information from innocent
    users.


    However, with the advent of technology, various cryptography techniques have been
    a provider to guarantee that the malicious objectives of these cybercriminals
    are not only thwarted but ensuring that only authorized users have access to this
    information. Without further ado, let us look at the benefits, limitations, and
    the future of cryptography in information security.'
