    of the TCP/IP suite. Used by routers and other network devices, its function is
    to send error messages or operational information pertaining to the unavailability
    of a service, host or router. Diagnostic tools such as ping and traceroute that
    uses this protocol are generally used by attackers. Common attacks as classified
    as ICMP attacks include the Ping of Death, Smurf, Fraggle, ICMP Redirect, Ping
    Scanning, and Traceroute Exploitation.


