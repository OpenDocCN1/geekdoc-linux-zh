    an operating system patch.


    # ## Polymorphic Virus


    This particular virus is one of the most hardly detectable or removable viruses
    for any antivirus program. These antivirus programs are hard to protect you when
    a polymorphic virus attacks your system because the software program has the capability
    of blacklisting a particular virus variant. However, a polymorphic virus changes
    its binary pattern whenever it duplicates. When an antivirus program encounters
    a polymorphic virus, it sees it as a different software in the system. This makes
    it evade the antivirus blacklist.


