    a shower, dress up and off you go for the day''s work. You got to the office and
    took your first coffee before realizing that you are on autopilot mode.


    Without considering anything, it is logical for us to close our doors before leaving.
    At least for our safety, we put on a seat belt not because we are comfortable
    with them. The same thing applies to a helmet when you are riding a bike. You
    don''t just cross the street without looking for an incoming vehicle. The truth
    is we integrate various safety actions to survive the dangers of real-life situations.
    However, one question many haven''t answered is if they are prepared to survive
    in the cyber world?


    As you are reading this book, you may be among the 1 billion people connected
    to the internet. You are one of those internet users that contribute to generating
    information on the internet whenever you:


    - Click a link

    - Perform a Google search on anything

    - Send or receive an instant message

    - Download or install an application

    - Publish content on a blog, social network, or web

    - Like content on social media

    - Buy something through an online store


    The list is endless because the internet has enabled us to do way beyond our imagination.
    The amount of information we produce is far more than what anyone can imagine
    and we most times underestimate this information. We underestimate their value
    and quantity and downplay on a whole lot of things. We have become less concerned
    about the kind of information we generate while we perform various activities
    online. It doesn’t matter if you believe it or not, we have people who want that
    information at your own disadvantage.


    Our information becomes like gold once we are connected to the internet. We begin
    to live like those in a glasshouse. The bad thing about living in a glasshouse
    is that those passing through your vicinity will see what you are doing. In the
    same vein, when we leave our devices unsecured, we let the hackers take advantage
    of our information.


    I know the word “hacker” means different things for different people. Today, its
    meaning may vary depending on the particular context upon which the word is used.
    For instance, if you check the dictionary, you will find its meaning relating
    to an individual who likes to explore the complexities of programmable systems
    and find ways of squeezing their capabilities. This is different from those whose
    endeavor is to learn the skill. This doesn’t speak of anyone whose primary motive
    is to commit fraudulent activities on the network. Notwithstanding, if you check
    through various publications on the internet and the media, you do find out that
    the term “hacker” usually refers to someone who deals in cybercrime. At times,
    they are referred to as crackers, black hats, or attackers. The primary motives
    of these attackers are to make money from innocent users online. In situations
    where such a motive isn’t monetary, it can be as a way of boasting in their capabilities
    or merely ideological.


    What should matter to you, as a user, is that these attackers create complex attack
    methods daily to steal sensitive information? Regrettably, they are successful
    in doing things because users haven’t put into place necessary security practices
    to mitigate their strategies. It may interest you to know that criminal activities
    generate much money in the world than anything. A recent report indicated that
    cyber-attack is higher in cost than a natural disaster.


    ## Chapter 1: Fundamentals and Importance of Cybersecurity


    ### Fundamentals of Cybersecurity


    The innovation in the information technology industry is driving efficacy and
    ease of use; this represents a big deal of great value. If you have observed the
    nature of technology, you will know by now that these attributes (efficacy and
    ease of usage of technology) will overtime increase. While various organizations
    are embracing different cybersecurity methods to protect their data and information,
    it is imperative for individuals to take their online security very crucial. In
    view of this, I have assembled the four fundamentals for personal cybersecurity
    that every individual requires. The truth remains that the government alone cannot
    pull the string as we all have a vital role to play. The following four fundamentals
    to your personal cybersecurity aren’t relevant to individuals alone as companies
    and employees in various workplaces can adhere to them.


    ### Protection of Devices


    All our gadgets and devices such as tablets, pads, laptops, smartphones, etc.
    are always connected to the internet. In order to avoid any leak of information
    or any intrusion, individuals must protect these devices using the best security
    protection features available. Luckily, a recent innovation in technology has
    brought about effective and high-quality protection systems, which previously
    were only available to large firms. The following precautions must be followed
    as it regards your device protection.


    - Your device should have real-time antivirus with other defense systems set up

    - There must be a remote management feature, which removes any requirement for
    users input or any behavioral modifications

    - Password management applications must work effortlessly throughout various mobile
    device platforms


    ### Protection of Internet Connection


    It is not enough protecting your device because immediately your device connects
    online, it can become a victim. Due to this, your device will require more defenses
    to protect every information within it, which is transmitted through the internet.


    Your device should have its own virtual private network (VPN) to encrypt your
    location. I will talk about VPN extensively in latter chapters because of its
    importance to your cybersecurity. However, a good VPN will do you much good, as
    it will protect your location, identity, banking, shopping, and browsing history.
    It also protects your information transacted online, whether it is business or
    personal.


    ### Protect Email Communication


    The third fundamentals to your personal cybersecurity are the protection of your
    email communication. Statistics have shown that most hackers gain the back door
    to your personal information through email communication. Regrettably, in the
    United States, for instance, many consumers expect emails to be free, and this
    has preoccupied us from the primary sense of privacy.


    In using email communication, it is important to use an email service provider
    that uses open-source software for portability, security, and compatibility throughout
    various technology platforms and architecture. Furthermore, the service must automatically
    strip metadata information and IP location from personal emails as they are sent
    through the internet.


    ### Protection and Backing up of Files and Electronic Documents


    We have various remote backup services that provide backup services at an affordable
    rate. Furthermore, the convenience of saving your documents on the cloud sounds
    amazing in this generation. However, not all documents can go through this process.
    You can also use a digital vault to save critical and sensitive documents. Sensitive
    documents include birth certificates, scanned passports, tax returns, trusts,
    wills, social security cards, etc.


    The promotion of these four fundamentals of personal cybersecurity processes in
    your personal life or company can help drive cybersecurity awareness to a higher
    level. Interestingly, these solutions are not expensive but important if you don''t
    want anyone to invade your privacy.


    ### Importance of Cyber Security


    We live in a world where our daily lives are constantly conducted online. It is
    astounding to neglect the issues faced online regarding your computer and network
    security. However, most people become aware of these issues when there is a national
    challenge, such as a photo leak of a celebrity or security breach of a top politician.
    Notwithstanding, we are faced with common cybercrime, which tends to be more prevalent
    than those of the national issues are. You will agree with me that daily we are
    bombarded with cybercriminals or hackers who do everything possible to victimize
    their victims.


    Regrettable, most victims give these cybercriminals an easy chase. Only a few
    of these hackers or criminals are masterminds or experts at what they do. Furthermore,
    the lack of awareness and ignorance concerning cybersecurity has made it easier
    for these criminals to have an easy ride and target their victims. With these,
    they can steal their identity and hack into their information without any fight
    from their victim.

