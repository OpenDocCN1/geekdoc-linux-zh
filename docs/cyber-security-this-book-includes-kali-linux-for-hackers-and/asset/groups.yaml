    -rwxr-xr-x  level2 level1 876 Jun 23 13:12 /usr/bin/list

    ```


    让我们仔细看看刚才的操作。我们本应登录到 HackersLab 系统，然后查找拥有 level2 UID 和 Level1 GID 的文件（如果你仍然不明白为什么要这样搜索，请重读
    level0）。我们找到了文件 `/usr/bin/list`。我尝试运行它并成功了。它要求我输入任意文件，并告知我同样的信息，正如我们之前使用的那样，只是为了看看会发生什么（实际上可以是任何文件）。随后，list
    程序返回了关于我提供的文件的信息。问题就出在这里。从内部执行 list 的命令实际上是 `ls -l`，用于显示文件信息。它在系统上执行了以下操作：


    ```text

    [level1 @ level1] $ ls -la /usr/bin/list

    -rwxr-xr-x  level2 level1 876 Jun 23 13:12 /usr/bin/list

    ```


    但它是以高于我们的权限执行的（忘了你的创造性用户和 ID 是 level2 吗???）。既然它外部执行 ls，我们该如何添加另一个命令呢？最简单的方法是使用管道符（`|`），我们在命令章节中见过它。它允许你输入另一个待执行的命令。但我们要在哪里做呢？让我们再次运行
    list：


    ```text

    [level1 @ level1 bin] $ ./list

    Enter a file: /usr/bin/list

    ```


    这里就是秘密所在。除了仅仅输入文件的 PATH，我们能否在前面加上管道符和某些命令？就像这样：


    `Enter a file: /usr/bin/list | pass`


    就是这样！如果我们的理论正确，它将运行 `ls`，列出我们的程序 `/usr/bin/list`，然后立即运行提供密码的程序。现在完成：


    ```text

    [level1 @ level1 bin] $ ./list

    Enter a file: /usr/bin/list | pass

    -rwxr-xr-x  level2 level1 876 Jun 23 13:12 /usr/bin/list

    The password for level2 is ...

    ```


    准备就绪！我们获得了新的密码。现在让我们进入真实的 walkthrough。


