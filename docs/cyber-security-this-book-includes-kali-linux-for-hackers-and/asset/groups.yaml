    +   3.


    # # Attacks on Integrity


    Also known as a sabotage attack, the purpose of this attack is to damage, corrupt,
    and destroy the systems or information. This attack would cause a little typographical
    error.


    # ## Methods of Cyber-Attacks


    Cybercriminals employ various means to perform their malicious activities.


    Among these includes:


    +   •


    # ### Social Engineering or Malware


    If hackers can see a human being, there won’t be any need to hack into your computer.
    Socially engineered attacks come in various forms; oftentimes, this is normally
    through malware. Has your antivirus popped up an alert message on your screen?
    Have you unknowingly clicked on a malicious attachment? If this is true, then
    you have come close to a malware attack. Cybercriminals like to invade their target’s
    system using malware because of their effectiveness. Malware is a very dangerous
    software, which includes ransomware and virus. Once it gains access to your system,
    it causes havoc, ranging from monitoring your online actions, controlling your
    machine, and monitoring your keystrokes to steal sensitive information from you.
    You will learn more about malware, viruses, and ransomware in later chapters.


    +   •


    # ### Phishing Attacks


    The likelihood of you clicking a link in your email or opening an attachment is
    slim. However, there must be a compelling reason to take such a step considering
    the danger involved. Cybercriminals are aware of this fact and will do anything
    within their reach to persuade.'
  - '[PAGE 115]


    The best way for anyone to steal your password or information is to track you
    to reveal such information. It doesn’t matter your level of security expertise,
    anyone can be a victim of a phishing attack. Because of this, most people use
    a two-factor authentication process to protect their information. If an attacker
    stils your password, it is as good as unless if he doesn’t know the second-factor
    key.


    What happens during a phishing attack is that the attacker poses as a trusted
    friend or business partner and sends you an email. The email will look authentic
    and have certain urgency written in it. The email will contain a link or attachment
    that requires you to open. Once you mistakenly open the email attachment, it installs
    the malware to your system. Alternatively, if it is a link, it transfers you to
    a website that looks genuine and requests for login information. Actually, this
    trap is to lure you to revealing your credentials. In dealing with this kind of
    situation, you must verify the email and attachments from the sender.


    +   * **SQL Injection Attack**


    With your little computer knowledge, you do know that we use SQL (structured querry
    language) to communicate with databases. These databases are essential for storing
    relevant information. Most servers that stores sensitive information for websites
    and services utilize the services of SQL to manage the data. This particular attack
    focuses on the SQL database and reveals sensitive. The issue increases if such
    a server stores individual details of the client such as passwords, credit card
    numbers, etc., which serves as a lucrative and tempting target for attackers.


    # **Cybersecurity Basics – Protecting Your Computer Network Aginst Virus and Malware**


    Spyware, ransomware, worms, viruses, and hackers are just a few things that have
    the potential of harming your network and computer system. The situation gets
    worst when you discover how'
  - '[PAGE 116]


    easy it is for these hackers to steal your information merely through a malicious
    link in an email. However, there are various ways to attack or exploit a computer.
    In the same manner, we also have ways of protecting ourselves from these hackers.
    In this section, I will explore important ways of protecting your computer network
    against viruses and malware.


    +   *   **Use Complex Passwords and Occasionally Change Them**


    One easy thing to do to improve your security is to use a strong password. You
    should use a strong password, which includes special characters like "&*!@#" in
    addition with numbers and letters. A complex password should be within 8-17 characters
    in length. Furthermore, don''t write or store your passwords on your device as
    this is an easier means for hackers to steal your information. You should change
    your password occasionally, as it will help prevent any force password cracks.
    The best practice in protecting your cybersecurity is to update your passwords
    once every 3 months.


    +   *   **Install Antivirus**


    The first step to protecting your computer network and the system is to install
    an antivirus to protect you against viruses and malware. An antivirus can actively
    scan for any virus attempting to penetrate into your system files, email, or operating
    system. Importantly, the antivirus you decide to use must run periodic updates.
    These updates are crucial because every day new viruses are created and these
    updates are the key to averting any likely attack.'
  - '[PAGE 117]


    # Install Anti-Malware and Anti-Spyware Programs


    Spyware and malware can cause severe damage to your computer network in the same
    manner as a virus. It is imperative to install anti-spyware and anti-malware programs
    besides the antivirus you have installed. You should occasionally update this
    software to help remove and quarantine any malware or spyware. What most people
    do is to install an antivirus only and think they will be protected from any likely
    danger.


    # Perform Periodic System Backup


    There are various types of malicious agents such as ransomware, malware, viruses,
    worms, etc., which can destroy your files. A good way to safeguard yourself against
    any attack is to create a periodic backup. For instance, if you consistently back
    up your computer, you may have something to leverage on if you are attacked by
    a ransomware. Remember, what attackers do when they attack your system with ransomware
    is to encrypt your data and expects you to pay a ransom to decrypt these files.
    However, if you have previous backups, you won''t border paying such ransom because
    at times there is no assurance of the hackers decrypting the file after payment.
    You can use external drives to backup your data. However, recently we have seen
    the rise of cloud storage systems.


    # Install Firewall


    A firewall is an essential security tool you need to protect your network against
    attack. It serves as a perimeter within your computer and blocks any unapproved
    outgoing and incoming access. When you want to configure or set it up, ensure
    to use'
