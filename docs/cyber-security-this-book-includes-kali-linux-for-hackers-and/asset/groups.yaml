    \n## 密码系统的类型\n\n根据加密和解密过程，密码系统分为两种类型。这包括对称密钥加密和非对称密钥加密。这些类型的密码系统的主要区别在于加密密钥和解密密钥。然而，对于任何密码系统，加密密钥和解密密钥都是密切相关的。本质上，使用与加密密钥不相关的密钥来解密密文是非常困难的。\n\
    \n- **对称密钥加密**\n  在这种类型的密码系统中，加密和解密过程使用相同的密钥。如果你看到“对称密码学”这个术语，它指的是对称密码系统的研究。对称密钥加密方法的示例包括\
