    ## 半双工

    数据仅在一个方向发送，但通信发生在两个方向。


    ## 全双工

    通信和数据流发生在两个方向。


    ## 第 4 层：传输层


    现在，一旦信息被添加到会话层，下一步就是为正在进行的会话制定一些基本规则。这是通过握手过程完成的，其中涉及 TCP 的三次握手。在我们描述该层如何处理此问题之前，必须指出的是，协议数据单元现在被转换为段（segment）。


    传输层不仅决定一次必须发送多少数据，还决定数据被传输到目标系统的顺序。除此之外，它还处理诸如缺失数据包等问题，并验证数据的完整性。可以说，传输层还负责网络设备如何被引用或寻址。在此领域运行的一些流行协议包括传输控制协议
    (TCP)、用户数据报协议 (UDP)、安全套接字层 (SSL) 和传输层安全 (TLS)。


    虽然会话层和传输层都执行设置和完成会话（在此期间数据传输）的共同功能，但前者在应用程序之间建立会话，而后者在两个计算机系统之间执行完全相同的功能。


    ## 第 3 层：网络层


    一旦网络层接收到一段数据，就会添加源 IP 地址和目标 IP 地址，其中目标系统可以位于同一网络上或远程网络上。根据具体情况，段中还会添加路由信息。完成后，该段现在被称为数据包（packet），并将其传递给数据链路层。简而言之，数据包将包含必要的信息，以帮助它从一个局域网移动到另一个局域网。此层中的一些常见协议是互联网协议
    (IP)、互联网协议安全 (IPSec)、路由信息协议 (RIP) 和互联网消息控制协议 (IMCP)。路由器和网桥是有助于这些网络层功能的设备。


    ## 第 2 层：数据链路层


    数据链路层负责将接收到的数据包准备好作为帧（frame）传输到特定网络上的目标系统。每个网络都有自己独立的硬件和技术。其中一些网络是令牌环、以太网、异步传输模式
    (ATM)、光纤分布式数据接口 (FDDI) 和铜缆 DDI。


    数据链路层理解成功传输数据（无错误）所需的格式，然后将其传递给物理层。也就是说，有两个数据链路子层执行这些任务，它们由逻辑链路控制 (LLC) 和媒体访问控制
    (MAC) 子层组成。是 MAC 子层确定帧必须传输到哪种类型的网络，并将该信息连同帧一起添加。


    最后，在此层执行功能的协议包括点对点协议 (PPP)、地址解析协议 (ARP) 和逆向地址解析协议 (RARP)。


    ## 第 1 层：物理层


    作为 OSI 模型中最底层，物理层从数据链路层接收帧，然后将其转换为比特（零和一），以便通过网络传输。当它以比特形式接收数据时，它也会将此转换为帧，然后将其传输到数据链路层。必须指出的是，设备驱动程序在物理层运行，以指示协议如何以比特形式传输或接收帧。物理层的一些协议包括
    SONET、蓝牙、RS-232 和 DSL。


    此外，还有在此层运行的网络硬件设备，包括网络接口卡 (NIC)、集线器、中继器、放大器和集中器，它们有助于在长距离上传输信号。


    由于这仅涵盖有线连接，无线和光纤网络使用交替的无线电波和光来表示这些比特。


    ## TCP/IP 模型


    如果有一件事是 OSI 和 TCP/IP 模型共有的，那就是数据包共享的理念。TCP/IP 模型由 DARPA 在二十世纪七十年代开发，其 humble beginnings
    始于作为广域网 (WAN) 的实施。当然，正如我们所知，互联网是一个由这些广域网和互联网服务提供商组成的全球网络。


    这两个模型之间的差异很小，因为 OSI 模型提供七层，而 TCP/IP 模型仅使用四层。即便如此，功能非常相似，除了 TCP/IP 模型在数据传输方面侧重于
    TCP/IP 协议。尽管如此，这是一个协议套件，除了 TCP 和 IP 协议外，还包括更多协议。也就是说，即使 OSI 和 TCP/IP 模型相似，当涉及到功能时，它们的层并不一定能够整齐地映射。


    ### 网络访问层或链路层


    TCP/IP 模型中的网络访问层结合了 OSI 模型的物理层和数据链路层。因此，使用 LLC 和 MAC 子层，它不仅添加源和目的 MAC 地址等信息，还会添加尾部以验证数据的完整性。但这还不是全部：它还执行将数据比特跨物理介质（无论是光纤、有线还是无线）发送的功能。此层使用的一些常见协议包括
    IEEE 802.3 和 802.11 以及地址解析协议 (ARP) 和邻居发现协议 (NDP)。


    ### 互联网层


    该层负责路由和查找目标主机位置。如果互联网层未确定这一点，那么传输层将无法建立连接。它通过将在数据包中放置源和目标 IP 地址来实现这一点。有四种协议有助于实现这一点，即互联网协议
    v4 和互联网协议 v6 (IPv4 和 IPv6)、互联网控制消息协议 (ICMP)、互联网组管理协议 (IGMP) 和地址解析协议 (ARP)。鉴于安全专业人员理解
    IP 地址和类别的重要性，值得仔细查看。


    ### 主机到主机传输层


    在此处比较 OSI 和 TCP/IP 模型，它们执行相同的功能，即在两个主机之间打开和维持连接。此功能必须在应用层将数据发送到其他应用程序之前完成。通常，存在两种实现方式：无连接或面向连接的传输。对于前者，UDP
    在传输层中充当无连接协议，而 TCP 是此处使用的面向连接协议。


    无论哪一个更合适，端口号和传输协议将始终提供给接收主机。虽然 TCP 在功能和可靠性方面提供了更多，但代价也更高。与 UDP 协议相比，使用 TCP 协议时头部要大得多，即使由于在传输任何数据之前发生的三次握手，所有数据包被交付的可能性更大。


    ### 应用层


    也称为进程到进程层，应用层处理在 OSI 模型中由应用层、表示层和会话层处理的任务。换句话说，该层仅创建信息并将其发送到另一个主机上的其他进程或应用程序。在此层运行的协议执行与应用程序和服务相关的特定功能。相比之下，传输层协议仅检测位置和路由，以支持这些高层协议。随着传输的数据一起，接收主机还被提供标识这些高层协议及其关联程序的端口号。


