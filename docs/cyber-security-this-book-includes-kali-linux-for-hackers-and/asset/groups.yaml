    server is exposed and attackers find out, you stay to lose your sensitive information.
    Importantly, this will mean bad business for you because your clients won’t trust
    you. However, once you set up a good security system in place, every facet of
    your physical security can be managed, including the authentication of an employee,
    visitors'' access, etc. There are basically five stages to access control procedures,
    which include authorization, authentication, accessing, management, and auditing.
    The processes, conditions, and criteria of these different stages must be implemented.


    # Chapter 7: Basic Concept of Cryptography


    In this chapter, I will introduce the concept of cryptography. The word shouldn''t
    instill any fear because it is quite easy to understand and use to your advantage.
    Amazingly, most computer security terms have straightforward meaning that is not
    complex to understand. However, my aim in this chapter is to help you understand
    even the complicated terms and proffer solutions to your security based issues.


    Cryptography is an act, which involves encoding messages to make them hard to
    read. Do you remember the illustration I gave concerning leaving in a glass house?
    Every passersby gets to see the content of your house. However, if it is built
    with brick and block, it will be hard for them to know what you have within your
    own.


    In the olden days, cryptography was performed using manual methods. Although times
    have changed, the basic framework for performing cryptography hasn''t changed
    that much, in as much as there has been a notable improvement in the techniques.
    Importantly, computers have the capability to perform these algorithms, thereby
    making the process more secure faster.


    We have five functions of cryptography today. These include:


    - **Authentication** – This involves one proving its identity. It ensures that
    the receiver is authorized to have access to the information. Cryptography authentication
    comprises of two variants – the message authentication and the entity authentication.
    The message authentication identifies the message originator without regarding
    any system or router that sent the message. However, the entity authentication
    ensures that the information has been received.

    - **Confidentiality/privacy** – Ensuring that the message sent is for the intended
    receiver only and nobody can read it. Confidentiality is an essential security
    service that cryptography provides. It safeguards information from unauthorized
    individuals and can be gotten through various processes beginning from the use
    of physical techniques to mathematical algorithms.

    - **Integrity** – Guaranteeing the receiver that the content of the message is
    not tempered or changed in any way from the original message. An unauthorized
    person may alter the data either intentionally or accidentally. However, cryptography
    helps to safeguard data integrity by detecting if a particular data have been
    manipulated or altered by an unauthorized individual.

    - **Non-repudiation** – a mechanism to ascertain that the receiver sent the message

    - **Key exchange** – the process whereby crypto keys are shared between the receiver
    and the sender.


    In cryptography, we normally begin with the unencrypted data, which we call plaintext.
    The plaintext is then encrypted to ciphertext, which is further decrypted into
    usable plaintext. This whole encryption and decryption process is based on the
    particular cryptography scheme implemented along with the key used. To make it
    easier, I will illustrate the encryption and decryption process using a formula
    to enable you to understand it clearer.


    Let us assume that C represents ciphertext, P is plaintext, and k is the key used,
    while E and D are the encryption and decryption method, respectively.


    ```

    C = E_k(P)

    P = D_k(C)

    ```


    When I am referring to two parties communicating, I will use the nickname Alice
    and Bob because it is a conversant terminology used in the cryptography industry.
    If the communication involves a third and fourth individual, then you may hear
    names like Carol and Dave. Furthermore, if during the communication, there is
    a malicious party, then I will call such party Mallory. A spy and a trusted third
    party will be referred to as Eve and Trent, respectively. If you are clear with
    these terms then we are ready to begin.


    Do not forget that cryptography mostly deals with the creation and development
    of mathematical algorithms to encrypt and decrypt messages. On the other hand,
    cryptology refers to the general study of secret writing, whereas cryptanalysis
    is the science of examining and breaking encryption.


    ## Brief Evolution of Cryptography


    Early cryptography began during the European Renaissance. Different Italian and
    Papal states helped in the propagation of cryptographic techniques. During this
    period, various inquiry and attack methods were studied in order to break secret
    codes. One such improvement was the Vigenère coding, which came to limelight in
    the 15th century. Furthermore, in the 19th century, more sophisticated cryptography
    approaches were discovered. However, in the 20th century, came the invention of
    the electromechanical and mechanical machines, which provided an efficient and
    advanced means of encrypting information. Finally, during World War II, cryptanalysis
    and cryptography became extremely mathematical.


    With various advancements taking place in the world, military units, corporate
    bodies, government organizations, and security professionals are advocating and
    adopting the use of cryptography. Today, most organizations are using cryptography
    to protect their information and secrets from intruders or attackers.


    ## Cryptographic Algorithms


    There are various ways of categorizing cryptographic algorithms; however, in this
    book; I will classify them based on the number of keys used in implementing the
    encryption and decryption process. Let us look at the three main types of algorithms.

