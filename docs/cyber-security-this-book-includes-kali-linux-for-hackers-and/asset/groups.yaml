    # ## Cellular Networks


    The five techniques used for modulation over cellular networks include Frequency
    Division Multiple Access (FDMA), Time Division Multiple Access (TDMA), Code Division
    Multiple Access (CDMA), Orthogonal Frequency Division Multiple Access (OFDMA)
    and Global System for Mobile Communications (GSM). While TDMA was an improvement
