    could be through a method or through a single payload. However, just like Oliver
    Twist that always asks for more, the multipartite virus wants it all. This particular
    virus spread in various ways and infects files and operating system. Furthermore,
    the multipartite virus can simultaneously affect executable and boot sector files,
    which allow them to spread quickly and rapidly. This "two-edged" sword-like attack
    makes it hard for anyone to remove the virus. It doesn''t matter if you decide
    to wipe the program files because the virus remains in'
