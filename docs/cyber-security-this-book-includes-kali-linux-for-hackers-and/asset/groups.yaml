    \ of cryptographic algorithms? What is the need of having three different algorithms\
    \ when we can use only one? The reason behind this is that each algorithm is optimized\
    \ for a specific cryptographic application. For instance, the hash function algorithm\
    \ is perfectly suited for guaranteeing data integrity since any alternation to\
    \ the content of the message will lead to the receiver calculating a hash value\
    \ that is different from that placed by the sender during the transmission of\
    \ the message. Considering the fact that two different messages will not get the\
    \ same hash value, there is a high level of confidence in data integrity.\n\n\
    On the other hand, secret key cryptography is well-suited in cases of encrypting\
    \ messages, which provides confidentiality and privacy. In this, the sender will\
    \ generate a session key for the encryption of that particular message. The sender\
    \ will need that same session key to be able to decrypt the message effectively.\n\
    \n# Modern Cryptography\n\nToday, cryptography is the cornerstone of communication\
    \ and computer security. It is the foundation upon which various mathematical\
    \ concepts such as probability, computational-complexity, and number theory are\
    \ based. There are three main characteristics of modern cryptography, which separates\
    \ it from the approaches used in the old days. To make it easier for you, I will\
    \ present it in a tabular form.\n\n| Classic Cryptography | Modern Cryptography\
    \ |\n| :--- | :--- |\n| Operates on traditional characters such as digits and\
    \ letters directly | Operates on the binary bit sequence |\n| The technique is\
    \ based on security through obscurity. This means that only the parties involved\
    \ get to know the particular coding technique employed. | Modern cryptography\
    \ depends on publicly known mathematical algorithms for information coding. However,\
    \ secrecy only exists through a secret key. It is hard for intruders or attackers\
    \ to get the original information since there is the absence of a secret key.\
    \ Furthermore, the computational difficulty of algorithms makes it impossible\
    \ for intruders to get the original information. |\n| Classic cryptography requires\
    \ the whole cryptosystem in order to communicate confidentially. | This requires\
    \ the parties involved in private communication to have the secret key. |\n\n\
    Cryptology is the study of cryptosystems, which is further divided into two branches,\
    \ namely cryptanalysis, and cryptography. Our focus in this book is on cryptography,\
    \ but it is important to understand that cryptanalysis involves the art and science\
    \ of breaking ciphertext. Cryptography and cryptanalysis co-exist without anyone\
    \ being distinctively on its own. However, cryptography as already indicated in\
    \ the process of making a cryptosystem with the capability of offering information\
    \ security effectively. It deals with the security of digital data. At times,\
    \ cryptography is referred to the design of mechanisms that uses mathematical\
    \ algorithms to provide essential information security services.\n\n# Cryptosystem\n\
    \nThis involves the implementation of cryptographic techniques along with their\
    \ associated infrastructure to offer information security services. Another word\
    \ for cryptosystem is cipher systems. In this section, I will look at a simple\
    \ model of a cryptosystem, which offers confidentiality to the information transmitted.\
    \ The diagram below shows the basic model of a cryptosystem.\n\n![](img/3160dc3e935e544bd1134d7a61442b62_166_0.png)\n\
    \nThe diagram above depicts a sender with the intention of sending sensitive information\
    \ to a receiver in a way that no third party that intercepts the information in\
    \ whatever channel can effectively extract the information. The primary objective\
    \ of using a cryptosystem is to ensure that only the sender and receiver can decode\
    \ the plaintext. Let us look at the element of a cryptosystem.\n\n# Elements of\
    \ a Cryptosystem\n\nFrom the diagram, we have six basic elements of a cryptosystem,\
    \ which includes:\n\n- **Plaintext**\n  - This is the data or information that\
    \ must be protected during the transmission process\n- **Encryption algorithm**\n\
    \  - This entails the mathematical process that generates the ciphertext for any\
    \ encryption key and plaintext. In simple terms, it is an algorithm, which takes\
    \ plaintext and transforms it into a ciphertext having an encryption key.\n- **Ciphertext**\n\
    \  - The ciphertext is a scrambled version of the plaintext, which is generated\
    \ through the encryption algorithm via an encryption key. However, the ciphertext\
    \ is not protected as it passes through various public channels. Individuals who\
    \ have access to the communication channel can compromise the data or information.\n\
    - **Decryption Algorithm**\n"
  mdcn: "\n\n- 秘密密钥密码学\n- 公钥密码学\n- 哈希函数\n\n## 秘密密钥密码学\n\n在这种密码算法方法中，我们使用单个密钥来实现加密和解密过程。在下图中，你将观察到消息的发送者在将密文发送给接收者之前，使用该密钥对明文进行了加密。反过来，接收者使用相同的密钥对消息进行解密，然后才能获知消息的内容。\n\
    \n![](img/3160dc3e935e544bd1134d7a61442b62_162_0.png)\n\n在这种情况下，密钥同时服务于两个功能——加密和解密。有时，秘密密钥密码学被称为对称加密。在这种密码算法中，发送者和接收者必须知道密钥，因为那是消息的秘密所在。然而，这种特定方法的挑战在于密钥的分发方式。尽管如此，组织仍然依赖这种方法，尤其是在涉及隐私和机密性的问题中。\n\
    \n## 公钥密码学\n\n在网络安全行业中，公钥密码学是我们过去 400 年里在密码学中见证的重大进展之一。斯坦福大学的马丁·赫尔曼教授和他的学生惠特菲尔德·迪菲于\
    \ 1976 年首次公开描述了公钥密码学。在他们的一篇论文中，他们描述了一个双钥公钥系统，其中两方可以通过不安全的通信通道进行有效的安全通信，而无需共享秘密密钥。\n\
    \n公钥密码学依赖于数学函数或单向函数的存在，这些函数计算起来比较容易。然而，如果你想计算其逆函数，则会复杂得多。让我们看看下面两个例子。\n\n- **乘法与分解**\
    \ – 例如，你想计算以下两个质数 3 和 7 的乘积。执行这个简单的计算应该不会花费你太多时间。我们知道答案将是 21。假设你已知两个数的乘积为 21，并想找到该数的质因子。当你进行两个质数的乘法时，相比于找到这两个质因子，花费的时间要少得多。当你试图对\
    \ 400 位以上的数字进行质数分解时，问题会变得更大。\n\n- **指数运算与对数** – 假设你想计算 5 的 5 次方。这不会花费你太多时间，因为你只需要计算\
    \ $5^5$，其结果等于 3125。然而，如果你从数字 3125 开始，并决定找到两个整数，那将花费你很长时间。\n\n这两个例子可能看起来微不足道；然而，它们代表了公钥密码学中使用的功能对，包括乘法和指数的简单性，分别对抗分解和对数的难度。在使用公钥密码学时，诀窍在于找到一个“陷门”。通常，公钥密码学使用两个不同的密钥——一个用于加密，另一个用于解密。大多数用户使用公钥密码学进行密钥交换、认证和不可否认性。公钥密码学的另一个名称是非对称加密。\n\
    \n## 哈希函数\n\n消息摘要或哈希函数是一种不使用任何密钥的密码技术；相反，它使用通过明文计算出的固定长度哈希值。这使得明文长度或内容的恢复变得困难。该算法用于提供文件内容的数字指纹。它有助于确保病毒或入侵者没有更改文件的内容。大多数操作系统使用哈希函数来加密密码，这进一步提供了一种保证文件内容可靠性的机制。\n\
    \n## 密码算法的重要性\n\n对大多数人来说，一个主要问题是：为什么我们有不同类型的密码算法？当我们可以只使用一种算法时，为什么需要三种不同的算法？原因在于，每种算法都是针对特定的密码应用进行优化的。例如，哈希函数算法非常适合保证数据完整性，因为对消息内容的任何更改都会导致接收者计算出与发送者在消息传输期间放置的哈希值不同的哈希值。考虑到两个不同的消息不会获得相同的哈希值，我们对数据完整性有很高的信心。\n\
    \n另一方面，秘密密钥密码学非常适合加密消息的情况，这提供了机密性和隐私。在此过程中，发送者为特定消息的加密生成一个会话密钥。发送者需要该相同的会话密钥才能有效地解密消息。\n\
    \n# 现代密码学\n\n如今，密码学是通信和计算机安全的基石。它是概率、计算复杂性和数论等各种数学概念的基础。现代密码学有三个主要特征，这些特征将其与旧时代使用的方法区分开来。为了方便大家理解，我将以表格形式呈现。\n\
    \n| 经典密码学 | 现代密码学 |\n| :--- | :--- |\n| 直接处理传统字符，如数字和字母 | 操作二进制比特序列 |\n| 技术基于“隐蔽性安全”。这意味着只有相关方才能知道所采用的特定编码技术。\
    \ | 现代密码学依赖于公开已知的数学算法进行信息编码。然而，秘密性仅通过秘密密钥存在。由于缺乏秘密密钥，入侵者或攻击者很难获取原始信息。此外，算法的计算难度使得入侵者无法获取原始信息。\
    \ |\n| 经典密码学需要整个密码系统才能进行机密通信。 | 这需要参与私密通信的相关方拥有秘密密钥。 |\n\n密码学研究密码系统，它进一步分为两个分支，即密码分析（Cryptanalysis）和密码学（Cryptography）。本书的重点是密码学，但理解密码分析涉及破解密文的艺术和科学是很重要的。密码学和密码分析共存，没有任何一方是独立突出的。然而，如前所述，密码学在创建具有有效提供信息安全能力的密码系统的过程中起着关键作用。它处理数字数据的安全性。有时，密码学被指代为设计利用数学算法提供基本信息安全服务的机制。\n\
    \n# 密码系统\n\n这涉及实施密码技术及其相关基础设施，以提供信息安全服务。密码系统的另一个词是密码系统（cipher systems）。在本节中，我将探讨一个简单的密码系统模型，该模型为传输的信息提供机密性。下图显示了密码系统的基本模型。\n\
    \n![](img/3160dc3e935e544bd1134d7a61442b62_166_0.png)\n\n上图描绘了一个发送者，其目的是以某种方式向接收者发送敏感信息，使得任何在某个通道中拦截信息的第三方都无法有效提取该信息。使用密码系统的主要目的是确保只有发送者和接收者才能解码明文。让我们来看看密码系统的元素。\n\
    \n# 密码系统的元素\n\n从图中我们可以看出，密码系统有六个基本元素，其中包括：\n\n- **明文**\n  - 这是必须在传输过程中保护的数据或信息\n\
    - **加密算法**\n  - 这涉及为任何加密密钥和明文生成密文的数学过程。简单来说，它是一种算法，接受明文并借助加密密钥将其转换为密文。\n- **密文**\n\
    \  - 密文是明文的混淆版本，通过加密算法和加密密钥生成。然而，当密文通过各种公共通道传输时，它不受保护。能够访问通信通道的人员可能会破坏数据或信息。\n\
    - **解密算法**\n\n"
