    \  - **公开算法** – 在这种选项下，由于算法处于公共领域，因此每个人都知道算法的细节。\n\n当涉及专有算法时，信息的安全是通过匿名性或隐蔽性来实现的。对于私有算法，由于开发过程由内部人员在没有对任何弱点进行广泛调查的情况下进行，因此它们可能较弱。此外，它们仅允许封闭群体之间进行通信。因为\n\
    \n"
