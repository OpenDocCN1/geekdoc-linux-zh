    话虽如此，对于拨号连接，PPP 是取代 SLIP 的最常用协议。


    ### 关于 VPN


    虚拟专用网（VPN）是一种连接，它可能使用不可信的通信网络来传输数据，但受到强大的身份验证协议和加密机制的保护。换句话说，整个协议相互包裹，无论是局域网（LAN）、线路、加密还是身份验证协议。PPTP、L2TP
    和 IPSec 是已知提供加密、身份验证或两者的协议。


    ### VPN 屏幕抓取


    在授予远程访问权限时出现的一个安全风险涉及屏幕抓取。就定义而言，这是攻击者刮取屏幕并访问其中敏感信息的能力。为此，必须实施屏幕抓取加密解决方案。


    ### 虚拟应用/桌面


    虚拟应用或桌面是另一种日益普及的通信通道，它使远程用户能够像坐在远程访问的终端前一样执行命令。由于安全在此也起着重要作用，安全专业人员必须在主机计算机和虚拟机上实施相同的安全措施。


    ### 虚拟化网络


    虚拟化网络能够将硬件和软件网络资源结合为一个提供管理功能的单一软件实体，从而模拟传统网络。这些实施不仅缩短了恢复时间，还提高了安全性。虚拟 SAN、SDN、客户机操作系统和端口隔离是虚拟化网络类型的一些示例。


    ### 虚拟 SAN


    虚拟存储区域网络（SAN）不仅允许存储池化，还提供包括自动即时分配虚拟机存储在内的功能。被视为软件定义存储的一种方法，这里数据的可用性由软件而非硬件决定。因此，可以制定策略让软件决定数据应放置的位置。这反过来又比仅硬件选项更好地支持数据可用性和保护。


    ### SDN


    软件定义网络（SDN）是通过策略驱动的工作流自动化来降低 IT 成本的一种方法。它不仅将网络控制平面与转发平面分离，还将网络流量管理为三个组件：原始数据、数据传输和数据目的。SDN
    由三个架构层组成，如基础设施层、控制层和应用层。由于这些层级的存在，硬件将不再需要直接引导流量。


    ### 客户机操作系统和端口隔离


    如果组织决定实施虚拟化网络，可能需要访问客户机操作系统。在这种情况下，配置私有局域网（LAN）可能有帮助，其中创建的第一个是主 LAN。你还可以创建其他 LAN，它们将被称为次级
    LAN。次级 LAN 可以配置为三种模式：混杂模式、社群模式或隔离模式。此 PVLAN 内的节点将根据其所在模式受到通信限制。话虽如此，使用 PVLAN 的活动称为端口隔离。


    ### 预防或缓解网络攻击


    如果你希望应对网络攻击，第一步是理解通常发生的攻击类型以及如何应对它们。更好的情况是你一开始就能预防这些类型的攻击。话虽如此，虽然据说布线的安全性要高得多，但它仍然存在一系列问题，可能影响可用性。


    ### 布线


    噪声、衰减和串扰是影响有线网络的常见问题。虽然屏蔽布线可以保护网络免受噪声影响，但无论涉及同轴电缆、双绞线还是光纤电缆，遵循衰减的长度建议同样有效。串扰是影响双绞线的问题，可以通过正确绞合电缆来解决。话虽如此，有线介质上可能发生窃听，但更容易解决。由于光纤使用光而不是电压作为信号，这可以显著增加窃听的难度。但真正能提高安全性的是确保这些电缆的物理安全。


    ### 网络组件攻击


    攻击网络组件发生的原因是每个组件由多个组织共享。安全专业人员理解每种攻击至关重要。


    一些最常见的攻击包括非盲伪装（Non-Blind Spoofing）、盲伪装（Blind Spoofing）、中间人攻击（Man-in-the-Middle
    Attacks）、MAC 泛洪攻击（MAC Flooding Attack）、802.1Q 和交换机间链路协议（ISL）标记攻击（Tagging Attack）、双重封装
    802.1Q/嵌套 VLAN 攻击以及 ARP 攻击。


    ### ICMP 攻击


    正如我们之前所学，ICMP 是 TCP/IP 套件中互联网层使用的协议。路由器和其他网络设备使用它来发送与服务、主机或路由器不可用相关的错误消息或操作信息。使用此协议的诊断工具（如
    ping 和 traceroute）通常被攻击者使用。被归类为 ICMP 攻击的常见攻击包括死亡之 Ping（Ping of Death）、Smurf、Fraggle、ICMP
    重定向（ICMP Redirect）、Ping 扫描（Ping Scanning）和 Traceroute 利用（Traceroute Exploitation）。


    虽然其中一些攻击寻找与数据包和 IP 地址相关的信息，但其他攻击利用 ICMP 协议来压倒系统。在这些攻击中，DoS 和 DDoS 攻击因造成的破坏而登上了新闻头条。


    应对此类攻击的一个明智措施是阻止 ICMP 的协议号 1。一些防火墙也允许你阻止特定类型的 ICMP 消息。


    ### DNS 攻击


    DNS 在网络安全中扮演着重要角色，负责将 IP 地址解析为计算机和域名。如果 DNS 服务器通过 DoS 或 DDoS 攻击成为目标，可能会引起很大的混乱。在出现问题时，拥有多个
    DNS 服务器可能会派上用场。一些常见的 DNS 攻击包括 DNS 缓存投毒（Cache Poisoning）、DoS、DDoS、URL 隐藏（URL Hiding）、域名抢注（Domain
    Grabbing）和域名抢注（Cybersquatting）。


    无论是重定向网站流量以收集信息，甚至使网络停止运作，你的 DNS 服务器都是此类攻击的目标。对于域名抢注，真正需要管理层在其他人之前购买与名称相关的站点。


    ### 电子邮件攻击


    由于电子邮件是我们每天使用的常见工具，它已成为攻击的首选来源。为了对抗这些攻击，这实际上源于用户部分糟糕的安全实践。一些常见的电子邮件攻击包括电子邮件伪装（Email
    Spoofing）、网络钓鱼（Phishing）、鱼叉式网络钓鱼（Spear Phishing）、鲸鱼式网络钓鱼（Whaling）和垃圾邮件（Spam）。


    对于伪装和网络钓鱼，目标是获取用户名和密码。在鲸鱼式网络钓鱼的情况下，风险甚至更高，因为目标是重要人物。虽然垃圾邮件令人烦恼，但仍应加以防范，因为今天向人们发送此类电子邮件是非法的。


    ### 无线攻击


    鉴于找出谁在捕获作为无线电波发出的数据包是非常困难的，防止无线攻击可能很难解决。有两种常见的无线攻击，即驾车侦察（wardriving）和徒步侦察（warchalking）。


    这两者都涉及寻找无线网络中的漏洞，并且通常一个接一个发生。仅仅因为某人无法成为网络上的无线客户端，这并不会阻止他们寻找有价值的信息。


    ### 远程攻击


    这种攻击专注于特定的远程系统，例如 VPN 服务器，或者像过去一样的拨号服务器，但由于安全实践的改进，后者已停止。后者的一个例子是战争拨号（war dialing），其中创建的软件会拨出一个大的号码列表，以查找与调制解调器相关的号码。如果是电话或传真号码，应答会被记录。然而，如果是调制解调器，将尝试建立连接，使网络对攻击者开放。


    ### 其他攻击


    现在，还有一份不必然归入上述任何类别的最终攻击列表。这些攻击包括 SYN/ACK 攻击、会话劫持（session hijacking）、端口扫描（port
