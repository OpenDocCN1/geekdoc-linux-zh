    With the ciphertext and algorithm known to the attacker, he tries every possible
    256 keys for the decryption. However, the time taken by the attacker to complete
    this attack is very high because he has to try every single key.


    # Man in the Middle Attack


    The primary focus of the attackers in this attack is mostly public key cryptosystems,
    especially in areas where keys must be exchanged before communication can occur.
    For instance, host X wants to transmit a message to host Y, thereby request for
    the public key of host Y. then the attacker intercepts this request from host
    X and sends the key instead of host Y sending it. Due to this, whatever host X
    sends to host Y, the attacker has access to read it. To maintain the communication
    process going between the two hosts, the attacker re-encrypts the information
    after reading it and resend it to host Y. The attackers send his personal public
    keys as the key from host X in order to deceive host Y that the message is coming
    from host X.'
