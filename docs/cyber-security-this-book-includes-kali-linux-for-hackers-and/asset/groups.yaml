    # ## TCP/IP Model


    If there’s one aspect that both the OSI and TCP/IP Model share, it’s the idea
    of packet sharing. Developed in the seventies by DARPA, the TCP/IP Model found
    its humble beginnings when it was implemented as a Wide Area Network (WAN). Of
    course, the Internet, as we know, is a global network that consists of these wide
    area networks and Internet Service providers.


    There’s very little difference between the two models since the OSI Model offers
    seven layers while the TCP/IP Model only uses four. Even then, the functions are
    very similar with the exception that the TCP/IP Model focuses on the TCP/IP protocols
    when it comes to data transmission. Still, this is a protocol suite that consists
    of both the TCP and IP protocols apart from several more. That said, even if the
    OSI and TCP/IP models are similar, their layers don’t necessarily map neatly when
    it comes to functions.


    # ## Network Access or Link Layer


    The Network Access Layer in the TCP/IP Model combines both the Physical and Data
    Link layers of the OSI Model. Hence, using the LLC and MAC sublayers, it will
    not only add information such as the source and destination MAC addresses but
    it will also add a trailer so as to verify the integrity of the data. But that’s
    not all: it also carries out the function of sending bits of data across the physical
    medium to be it fiber, wired or wireless. Some of the common protocols used in
    this layer include IEEE 802.3 and 802.11 as well as the Address Resolution Protocol
    (ARP) and the Neighbor Discovery Protocol (NDP).


