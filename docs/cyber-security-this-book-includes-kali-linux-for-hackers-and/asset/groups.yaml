    # Introduction


    Congratulations on purchasing *Kali Linux for Hackers* and thank you for doing
    so.


    There are plenty of books on this subject on the market, thanks again for choosing
    this one! Every effort was made to ensure it is full of as much useful information
    as possible; please enjoy!


    Once upon a time, there was a system called Unix. It was created by Ken Thompson,
    Dennis Ritchie, and the team. They wanted a system superior to the widely used
    Multicsin season. They developed a very powerful language to use in this system:
    the C language. Many Unix variants have come up since then: Digital Unix, AIX,
    HPUX and even versions for personal computers like Xenix and Minix. It is precisely
    in Minix that our story begins. A student called Linus Torvalds used and undermined
    this system but thought it could be improved. Then, in the mid-1990s, Linus developed
    a kernel (the heart of a system) of a new system based on Minix and the Unix,
    called Linux (from Linus). From there, the popularity of the system is only growing
    and there are even different versions of Linux (it is interesting to note that
    there are more versions of Linux than Unix itself today): Red Hat, Mandrake, SuSe,
    Slackware, Debian, and even the Brazilian Conectiva compete for space in thousands
    of servers and personal computers.


    You may be wondering: Which version should I use to follow the book? Or: I have
    an affinity for this or that version of Linux, does it make any difference? No,
    not at all. We will only use commands in mode.shell (text). Everything that is
    done in the shell here can be done in the graphical interface and the commands
    hardly change on different versions of the system. Don''t worry if you don''t
    know the commands: in the next chapter, I''ll give you a brief explanation of
    the most important commands that you will use. Even if you only have Windows,
    you can enjoy the content since it is only by connecting to'
