  mdcn: "\n## 网络安全威胁/攻击的类型\n\n研究著名战役的历史时，你会发现每场战役都有所不同。这些战役的战术和战略可能相似，因为它们长期以来都行之有效。同理，当网络犯罪分子攻击计算机时，除非局势要求，否则他们不会重新发明攻击策略。他们会想出各种长期以来对他们有效的攻击策略。他们可能会使用跨站脚本、网络钓鱼或恶意软件来实现这一点。\n\
    \n也许你正在努力认清近期数据泄露头条新闻的现实，认识到这些攻击者可以对其受害者造成严重伤害的各种手段确实有帮助。在了解不同类型的攻击之前，我想将这些网络威胁分为三类。\n\
    \n1.  **对机密性的攻击**\n    大多数网络攻击始于窃取个人信息，而不是复制它。这些针对机密性的攻击包括窃取比特币钱包、身份盗用和信用卡欺诈等。一些黑客或网络犯罪分子将机密性攻击作为其优先事项，因为他们旨在收集机密信息以谋取经济、军事和政治利益。\n\
    2.  **对可用性的攻击**\n    如今，我们以拒绝服务和勒索软件的形式看到了这种攻击，其中受害者在需要数据时被拒绝访问其数据。拒绝服务会淹没网络资源使其不可用，而勒索软件则加密受害者的信息，并在解密前索要赎金。\n\
    3.  **对完整性的攻击**\n    也称为破坏性攻击，这种攻击的目的是损坏、破坏和摧毁系统或信息。这种攻击会导致轻微的排版错误。\n\n## 网络攻击的方法\n\
    \n网络犯罪分子采用各种手段来进行其恶意活动。\n\n其中包括：\n\n-   **社会工程学或恶意软件**\n    如果黑客能看到人，那么就没有必要黑进你的电脑了。社会工程学攻击形式多样；通常，这是通过恶意软件进行的。你的防病毒软件是否在屏幕上弹出了警报消息？你是否无意间点击了恶意附件？如果事实如此，那么你就接近了一次恶意软件攻击。网络犯罪分子喜欢使用恶意软件入侵目标系统，因为这样做效果显著。恶意软件是一种非常危险的软件，包括勒索软件和病毒。一旦它获得对你系统的访问权限，就会造成破坏，从监控你的在线行为、控制你的机器、监控你的键盘输入以窃取你的敏感信息不等。你将在后续章节中更多地了解恶意软件、病毒和勒索软件。\n\
    -   **网络钓鱼攻击**\n    你点击电子邮件中的链接或打开附件的可能性微乎其微。然而，考虑到其中涉及的危险，必须有一个令人信服的理由采取这种步骤。网络犯罪分子意识到这一点，并将尽一切所能进行劝说。\n\
    \n任何人窃取你的密码或信息的最佳方法是诱骗你透露此类信息。无论你的安全专业知识水平如何，任何人都可能成为网络钓鱼攻击的受害者。正因为如此，大多数人使用双因素身份验证过程来保护他们的信息。如果攻击者窃取了你的密码，这几乎等同于他们没有第二个因素密钥的情况一样无效。\n\
    \n网络钓鱼攻击发生的情况是，攻击者冒充受信任的朋友或商业伙伴给你发送电子邮件。该电子邮件看起来真实，并且其中写有一定的紧迫感。电子邮件将包含一个需要你打开的链接或附件。一旦你错误地打开了电子邮件附件，它会将恶意软件安装到你的系统中。或者，如果它是一个链接，它会转移到看起来真实的网站，并请求登录信息。实际上，这个陷阱是为了诱使你透露你的身份验证信息。在处理这种情况时，你必须验证来自发送者的电子邮件和附件。\n\
