    模型的其他层不会发生任何变化，就像在此意义上描述的物理层和链路层一样。


    # 网络类型


    观察网络的第三种方式是涉及网络类型。除了外联网和内联网外，一些常见的类型包括局域网（LAN）、城域网（MAN）和广域网（WAN）。


    ## 局域网、城域网与广域网


    局域网（LAN）的传统解释是指办公室中互连的一组计算机，但按现代标准，它是任何速度大于 10 Mbps 的网络。另一方面，城域网（MAN）是一种覆盖距离较广的广域网，其作用类似于城市中心区域。它作为局域网（LANs）连接的骨干。最后，广域网（WAN）将局域网（LANs）和城域网（MANs）连接在一起，这通常由电信公司作为服务提供。当然，互联网是广域网（WAN）的完美例子。话虽如此，并非所有广域网都连接到互联网，有些是组织付费的私有专用链路。


    ## 内联网与外联网


    这两种网络类型都存在于组织内部，并出于安全目的进行隔离。内联网是组织的内部网络，而外联网向客户、商业伙伴和公众提供组织资源。话虽如此，敏感信息不应放在后者的外联网中。外联网应像内联网受到防火墙和强身份验证机制保护一样，接受持续的监控。


    # 协议与服务


    由于网络使用的日益普及，自九十年代以来已经开发了许多新协议。就像我们在 TCP/IP 模型的应用层中讨论过的协议一样，这些协议与特定服务相关联。我们将进一步讨论的一些协议不仅位于应用层，还位于处理路由和数据包传递的较低层。一如既往，端口或协议编号被视为重要。


    ## ARP


    地址解析协议（ARP）位于 OSI 模型的第 3 层。ARP 的目标是通过在网络中发送广播帧来添加目标主机的 MAC 地址。具有唯一 IP 地址的目标主机用其
    MAC 地址进行响应。此信息被添加到数据包头部中。


    ## DHCP


    该服务帮助你自动为网络中的所有设备分配 IP 地址，并作为任何操作系统中的客户端存在。由于它是一个客户端/服务器程序，你甚至可以将其配置为服务器。这很容易，因为大多数操作系统都有
    DHCP 客户端。DHCP 使用 UDP 端口 67 和 68。


    ## DNS


    该服务在将计算机名称解析为主机的 IP 地址方面起着至关重要的作用。同样，域名也被分配给网站。DNS 在大多数操作系统中作为客户端/服务器程序存在，并使用
    UDP 和 TCP 端口 53。


    ## ICMP


    ICMP 在 OSI 模型的网络层运行，当传输中出现问题时，系统使用它来传输错误消息。ping 和 traceroute 命令是该协议的一部分，有助于解决网络连接问题。


    ## FTP, FTPS, SFTP, NFS & CIFS/SMB


    文件传输协议（FTP）常用于在两个系统之间传输文件。FTPS 和 SFTP 是该协议更安全的版本。NFS 是用于 UNIX/Linux 系统的文件共享协议。CIFS/SMB
    协议使用 TCP 端口 445。


    ### HTTP, HTTPS & SHTTP


    HTTP 协议用于传输 Web 内容，还有另外两个安全版本，即 HTTPS 和 SHTTP。HTTPS 在 SSL/TLS 协议之上添加了 HTTP。HTTP
    使用 TCP 端口 80，而 HTTPS 使用 TCP 端口 443。SHTTP 的作用是加密提供和保存的页面数据。


    ### POP, SMTP & IMAP


    这三个协议都用于检索电子邮件。POP3 是最新版本，仅允许下载。IMAP4 从服务器访问电子邮件，它不仅是从服务器下载副本，还会在服务器上保留一份。SMTP
    与 POP 和 IMAP 都不同，因为它用于电子邮件服务器之间的通信。


    ### SNMP


    该应用层协议从网络设备中检索信息，并使用 UDP 161 以及 TCP 161 和 162 端口。虽然该协议容易受到数据包嗅探和暴力破解攻击，但 SNMPv3
    协议被认为是最安全的。


    ## 多层协议的影响


    如你所见，封装在 TCP/IP 模型中扮演着重要角色，并产生了成为多层协议的可能性。在当今世界，已经开发了许多专有协议，并用于工业控制系统和电力网。由于这些
    SCADA 系统并不安全，安全架构师和专业人士正在学习如何保护这些关键系统。当然，还有其他用于盈利的多层协议。有些人使用 TCP/IP 协议栈来路由他们自己的协议。如前所述，封装有助于创建多层协议，如下面的简单示例所示：


