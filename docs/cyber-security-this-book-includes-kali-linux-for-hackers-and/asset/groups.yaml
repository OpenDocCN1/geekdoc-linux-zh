    \n如今，我们的日常生活和商业都是信息驱动的。这引发了对加强保护重要信息免受恶意活动（包括攻击和数据篡改）的需求。为了让你有一个清晰的概念，我将详细阐述你的信息可能遭受的各种攻击，以及避免此类攻击的重要性。这些针对你信息的攻击可以是被动攻击或主动攻击。\n\
    \n### 被动攻击\n\n你之所以可能遭遇被动攻击，主要原因是攻击者未经授权访问了你的信息。例如，被动攻击的行为可能包括入侵者拦截和窃听特定的通信信道。\n\
    \n从本质上讲，这些攻击是被动的，因为它们不会影响信息，也不会干扰用于传输信息的通信信道。大多数时候，被动攻击被视为攻击者窃取你的信息。这类窃取与物理商品被偷窃的主要区别在于，你的数据或信息仍然在你手中。如果有人偷走了你的手机，你就自动失去了它，除非你找回它。\n\
    \n虽然对某些人来说，手机被偷无关紧要，但当涉及到你的信息时，你就不能轻视它。这比窃取任何实体物品或商品都更危险，因为信息的拥有者可能不知道他的信息已被泄露。\n\
    \n![](img/3160dc3e935e544bd1134d7a61442b62_174_0.png)\n\n### 主动攻击\n\n这种特定的攻击涉及通过影响原始信息的过程来改变信息。以下示例将让你明白主动攻击意味着什么。这包括：\n\
    \n- 使用非法手段或方法修改信息。\n- 通过各种介质发起意外或非法的信息传输。\n- 更改已认证的数据，如时间戳或发起人的名称。\n- 拒绝合法用户访问信息。\n\
    - 非法删除信息或数据。\n\n![](img/3160dc3e935e544bd1134d7a61442b62_174_1.png)\n\n然而，借助密码学，你可以阻止这些攻击，因为有各种可用的技术和工具来实施密码系统。\n\
    \n# 攻击者的假设\n\n在进一步深入之前，强调这些攻击者的某些假设非常重要。你会同意我的观点：在罪犯来到你家之前，他可能假设你没有报警系统、枪支或任何自卫手段。同样的情况也适用于这些攻击者，他们会不惜一切代价窃取你的信息。我不想让你置身事外，因此你需要了解密码系统的环境。此外，你必须理解攻击者的假设以及决定攻击者能力的环境。我们关于环境和攻击者能力有三个基本假设。\n\
