    \ The principle is the same but much easier. UDP, unlike TCP, has no three-way\
    \ handshake. It is considered an “unreliable” communication protocol because if\
    \ a packet is lost it doesn't matter. UDP is widely used for broadcasting (when\
    \ streaming some video or music on the Internet, for example). Consequently, we\
    \ need not try to find out some type of sequence number to send a spoofed UDP\
    \ packet. Just get the header of this package (still on the root machine that\
    \ allows us RAW packets) and include the new “spoofed” address.\n\nWe have two\
    \ options to do this:\n- Use the excellent `hping` tool (www.hping.org), which\
    \ performs various types of spoofing, including UDP, with the exception of result\
    \ filters.\n- Or we will write our own code in C to do so. As per a didactic question,\
    \ we will have the second option.\n\nExchange my code email for yours, and you\
    \ will receive the password. Remember in the beginning I said that few people\
    \ can get through even at this level? Well, the problem is this: too many firewalls\
    \ and routers block spoofed packets. That means there is a very good chance that\
    \ on the route between your computer and HackersLab, a router will “prevent” the\
    \ spoofed package. How to do it then? Try multiple routes ... I tried to run the\
    \ program from several free shells I could get on the Internet until from a shell\
    \ of a friend of mine from Fortaleza worked and I received the password by email.\n\
    \n### Step by Step\n\nSo let's try our spoofing. In the figure below, we compile\
    \ `udpspoofbr` (or whatever name you want), which we saw the code in the study\
    \ section, and we execute it. It asked us for source IP, source port, destination\
    \ IP and destination port. In the problem, it asked us to send a message as if\
    \ it were from `www.hackerslab.org`, from any port, to `drill.hackerslab.org`\
    \ on port 5555. So I typed the command like this:\n\n`./udpspoofbr www.hackerslab.org\
    \ 1234 drill.hackerslab.org 5555`\n\nNote that the source port makes no difference,\
    \ so much so that we put 1234. But I got a \"socket failed\" error. Of course,\
    \ I have to be root to do it, or the system won't allow you to manipulate RAW\
    \ packets to spoof. Let's try again as root.\n\nNow yes ... with my proper root\
    \ privileges, I sent the spoofed package. That's why if you don't have Linux at\
    \ home, you need it. In HackersLab, you don't have root access and you can't send\
    \ the spoofed UDP package. After a few minutes, I received something interesting\
    \ in the message content sent to me by email:\n\n\"What?? Does that mean I couldn't??\
    \ (Permission Denied)? No ... this (curiously) is the password for the next level.\
    \ Forward to level 11!\"\n"
