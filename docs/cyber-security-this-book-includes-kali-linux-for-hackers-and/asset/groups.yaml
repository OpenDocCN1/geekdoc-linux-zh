    - **第 16 级**：更多的堆栈溢出……可能稍微复杂一点，但它仍然是经典的老堆栈溢出！！！

    - **第 17 级**：我不会剧透你的惊喜……来看看就知道了！！！ :-)


    ## 结论


    感谢坚持读完 *Kali Linux for Hackers*。希望它信息丰富，并能为你提供实现目标所需的所有工具，无论你的目标是什么。


