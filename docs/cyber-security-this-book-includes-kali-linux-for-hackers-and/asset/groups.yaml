    \n例如：当我连接到像 http://www.visualbooks.com.br 这样的任何网页时，我实际上是在连接到 http://www.visualbooks.com.br:80（visualbooks.com.br，端口\
    \ 80，即 Web 标准）。到目前为止，这看起来很轻松。但我们面临以下问题——TCP 和 UDP 协议各有 65535 个端口。还有无尽的门。我们如何找出哪些是开放的，哪些不是？通过使用端口扫描器。端口扫描器是试图找出特定\
    \ IP 地址或主机上哪些端口开放的应用程序。它们通常可以使用最知名端口的列表，或一个范围（例如：从 1000 到 8000）。它们通常速度极快，结果会迅速返回给我们。常见的端口扫描器会对目标机器执行\
    \ TCP connect()。这意味着它执行三个 TCP 认证路径（syn-syn/ack-ack）。使用这种系统，扫描器很容易发现扫描尝试。例如，防火墙或\
    \ IDS 会迅速捕获黑客的 IP。为了解决这个问题，现在有更加复杂的扫描器，如 NMAP。NMAP 除了 TCP connect() 外，还可以以多种方式扫描，包括半\
    \ syn() 扫描（仅发送 syn）、fin、Xmas 等。每种类型使用不同的标志，使被扫描的主机难以检测。在这个逐步教程中，我将使用两个不同的扫描器：用于\
    \ Linux 的 NMAP 和用于 Windows 的 VALHALLA，并尝试找到端口。\n\n我们连接为 level6 并再次进行了基本操作。但现在我们没有任何文件……为什么？当然……我必须找到一个系统访问门，但不要试图破解任何文件的安全设置。让我们先使用\
    \ NMAP 来尝试检测端口。在发送 NMAP 扫描 drill.hackerslab.org 后，它返回了三个：23、80 和 6969。现在 23 来自\
    \ telnet，80 来自 webserver，而这个 6969 呢？嗯嗯，非常可疑。那么，让我们转到 Windows 下的 VALHALLA。VALHALLA\
    \ 是我创建的一个程序，除了作为主机和 IP 扫描器外，还是一个端口监控器和端口扫描检测器。可以在 [http://www.anti-trojans.cjb.net](http://www.anti-trojans.cjb.net)\
    \ 获取。结果几乎相同。发现了端口 23、80、100 和 6969。最可疑的肯定是 6969。让我们 telnet 到它，看看会发生什么。\n\n只需输入\
    \ `telnet drill.hackerslab.org 6969`，将端口放在名称前面。结果出来了吗？出现了一个类似于常规 HackersLab 登录的登录提示。它要求输入我的\
    \ level6 密码……输入后，bing0! 系统返回给我：assets!! 第 7 关的密码是 **Can't help falling in love**（不由自主地坠入爱河）。我已经说过这一关会很轻松……不是吗？\n\
    \n## 第 7 关题目\n\n登录名: level7  \n密码: Can't help falling in love  \n学习内容: 破解 Unix\
    \ / Linux 密码。\n\n许多老派的黑客已经习惯了 DES、shadow、CrackerJack、John the Ripper 这些词……遗憾新一代对这些术语并不熟悉。Unix\
    \ / Linux 使用一种称为 DES 的密码加密系统。该系统创建一个加密字符串，并将其放在通常名为 `/etc/passwd` 的安全文件系统中。现在使用的是\
    \ `/etc/shadow`。他们移动到 shadow 档案中，希望提高安全性，只保留用户名，将原始密码分离。那些获得系统控制权的人可以获取任何文件，即使是\
    \ shadow。\n\n典型的 shadow 条目：\n`mflavio: yFdrXa1EwNYng: 12126: 0: 99999: 7 :::`\n\
    \n根据上述信息，我们拥有用户名 `mflavio`。加密后的密码：`yFdrXa1EwNYng`。其余的数字是系统标识符（UID、GID 等）。\n\n\
    很好，我在 Linux 上有一个用户的密码，但它是加密的！没问题，我会获取一个解密程序。这听起来可行，但这是不可能的。正如我之前所说，DES 创建哈希值，这是一次性加密系统。它不能被解密。但那么……我们如何找出密码？只需使用你的想象力。思考：如果\
    \ shadow 中的密码不能被解密，系统如何将该密码与用户登录时输入的密码进行比较？很简单。系统对新密码进行加密，并比较两个加密值。如果它们相等，那就是密码。\n\
    \nCrackerJack 和 John The Ripper 是允许你使用词库或暴力破解来“破解”Unix / Linux 的程序。它们会使用 DES 对每个单词进行加密，并与密码文件中的密码进行比较。如果结果命中……那就是正确的密码。当然，为此，你需要一个好的词库。词库包含常用密码，并按类别划分，如电影名称、德语单词等……\n\
