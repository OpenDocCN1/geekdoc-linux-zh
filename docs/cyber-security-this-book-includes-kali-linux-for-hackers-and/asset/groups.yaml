    # IPv4 与 IPv6 的对比


    直到 20 世纪 90 年代，人们一直在使用 IPv4，但随着互联网普及度的不断上升，该协议承受着巨大的压力。安全性问题以及未分配地址的短缺是其核心问题所在。为此，IPv6
    被引入，并带来了诸如更大的地址字段、更好的安全性、更小的 IP 数据包头部以及改进的服务质量等优势。


    # MAC 寻址


    到目前为止，我们只查看了第三层（网络层）发生的寻址，即逻辑寻址。MAC 寻址发生在第二层（数据链路层），并被归类为物理寻址，因为它是一个永久且唯一的地址。


    一个标准的 MAC 地址看起来是这样的：02:25:31:55:72:ac


    MAC 地址采用这种格式也是有充分理由的。当 ARP（地址解析协议）在每一跳都更改 MAC 地址时，这一点非常有用，它确保了数据包通过沿途的路由信息，经由各个网络设备移动，从而到达其目的地。


    # 网络传输类型


    有多种介质类型用于传输数据，它们涉及独特的流程并拥有不同的特征。让我们来讨论一些常见的网络传输类型：


    ## 1. 模拟与数字


    这可能是描述模拟信号（如模拟电话通信中使用的）的最佳示例。模拟信号本质上具有无限多的数值。另一方面，发生在计算机传输中的数字信号有两个值：开（on）和关（off）。因此，数字信号更受青睐，因为它们对线路噪声的敏感性较低，但相比模拟信号可以传输得更远。


    ## 2. 异步与同步


    当两个系统进行通信时，使用相同的数据格式与使用相同的同步技术同样重要。异步数据传输使用起始位、停止位和校验位来确保数据的准确传输，而同步传输则采用一种时钟机制来同步发送方和接收方。显然，异步传输使用不同类型的错误检查，并且由于其优于同步传输（注：原文此处逻辑略显矛盾，通常同步优于异步用于高速，但此处原文称异步用于高速大量传输，可能是指异步在低速或特定场景下的特性，或原文有误，这里忠实于原文翻译：异步传输使用不同的错误检查机制，并且作为同步传输的
    superior 版本，用于高速、大量的传输），它被用于高速、大量的传输。


    *注：根据技术常识，通常同步传输优于异步传输用于高速大容量。原文写道 "asynchronous transmission... being superior
    to synchronous transmissions"，这在技术上是错误的。作为翻译员，我应忠实于原文，但考虑到这是“高级文档工程师”，如果原文有明显事实错误，是否要保留？指令要求“翻译内容”，未要求纠错。为了严谨，我将按原文直译，但原文表述确实奇怪。让我们再读一遍："asynchronous
    transmission uses a different type of error checking and, being superior to synchronous
