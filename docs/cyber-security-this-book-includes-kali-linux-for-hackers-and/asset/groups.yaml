    $ ./encrypt aaaaaaaaa

    encrypted character: ''GGGDBBB-SS''

    ```


    We use encrypted to encrypt the string `aaaaaaaaa`, from nine characters. From
    here, let''s change (kicking) some values to try to get close to our encrypted
    value.


    ```

    $ ./encrypt aaa1aaaaaa

    encrypted character: ''tGGGBBB-SS''

    $ ./encrypt aaaa2aaaaa

    encrypted character: ''GuGBBB-SS''

    $ ./encrypt aaaaa9aaa

    encrypted character: ''GG|BBB-SS''

    $ ./encrypt aaa129aaa

    encrypted character: ''you|BBB-SS''

    $ ./encrypt caa129aaa

    encrypted character: ''you|BBB/SS''

    $ ./encrypt cha129aaa

    encrypted character: ''you|BBB/ZS''

    $ ./encrypt chl129aaa

    encrypted character: ''you|BBB/Z^''

    $ ./encrypt chl1296aa

    encrypted character: ''you|tBB/Z^''

    $ ./encrypt chl1296rh

    encrypted character: ''tu|tSI/Z^''

    ```


    Going on the basis of trial and error, we managed to come up with a value that
    corresponds to the encrypted password. I did a lot more than shown above, but
    it would be a little pointless to spend a few pages with malicious attempts.


    Of course, the chances are slim when encryption involves lots of numbers. In this
    case, you can make a script that automates the process. Is it with this value
    that we come to the password to the next level? Let''s test it step by step. Step
    by step, we connected to HackersLab and found the encrypted program. Let''s guess
    it now with the string `chl1296rh` which we got in the study where we tested `encrypt`
    thoroughly. We then run `./encrypt chl1296rh | more` (to go to screen by screen).
    Encryption will be applied a few dozen times and we will reach the encrypted result:


    It''s really the password we try to match the encrypted password that we were
    given. But does it work? Just testing to know ... That!!! The password works yes.
    This means that the password for level 13 is `chl1296rh`.


    ## Other Levels ... More of the same


    We will end the in-depth study of the book at level 12. Why is this so if HackersLab
    has (at least so far I''m writing) 17 levels? The problem is that from level 13
    there are no more "news" that might be worth a study. I don''t think you want
    to just pass the levels and not learn. Well, let''s say the levels 13 to 17 are
    a set of what you have learned so far with a hint of C. The study, from now on,
    would be nothing more than "a book of C", with gigantic codes and many comments,
    and besides, I''m sure you want a little break to get your head past those levels
    now that you already have a good sense of how the challenge works.


    To help a little, I will list the remaining levels and write what kind of subject
    each one is about. So, you will know that "Way" to follow.


    - **Level 13**: This level handles socket programming. Following the specifications
    of the level problem (seen at www.hackerslab.org), use a header `protocol.h` (http://www.hackerslab.org/erog/fhz/proto.h)
    and build a program, according to your instructions, to calculate distances and
    send the value three times back to the server to get the password.

    - **Level 14**: This level will require you to know C, what `execve` is, and how
    to set breakpoints using GDB. It''s very annoying. But it''s worth it! Overflow
    using function pointers. Not much different than what we did before. Reread the
    heap overflow chapter, there is everything you need to solve this.

    - **Level 16**: More stack overflow ... a bit more complicated maybe, but it''s
    still the good old stack overflow!!!

    - **Level 17**: I won''t spoil your surprise ... come and find out!!! :-)


    ## Conclusion


    Thank you for making it through to the end of *Kali Linux for Hackers*. Let''s
    hope it was informative and able to provide you with all of the tools you need
    to achieve your goals, whatever they may be.


    Administrators should keep up with the times and deal with the hacker''s weapons.
    Of course, Kali Linux does not include all the tools that cybercriminals try.
    But with the included tools, relatively obvious weaknesses can be traced. This
    book has attempted to lead the readers through the partly complex use of Kali
    Linux.


    The nice thing about this book is that it not only presents the tools in Kali
    Linux and their use in detail, but also addresses the exploited gaps themselves.
    This allows less experienced users to understand where possible dangers threaten.


    Finally, if you found this book useful in any way, a review on Amazon is always
    appreciated!


