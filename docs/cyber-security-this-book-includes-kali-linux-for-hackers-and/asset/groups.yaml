    如你所见，HTTP 被 SSL、TCP、IP、IPsec 和以太网所封装，鉴于此，你可以在极高的灵活性和韧性下支持复杂的网络结构，这被证明是一种优势。其缺点在于，多层协议有时被用于进行隐蔽的任务，而这些任务往往毫无用处甚至有害。


    特别是，有一种被称为分布式网络协议（DNP3）的多层协议，它广泛应用于电力、水利公用事业及管理行业。其目的是促进现场数据采集系统与控制系统之间的通信。这种多层协议与
    TCP/IP 协议族非常相似，并且是一个开放且公开的標準。


    ## 融合协议


    融合协议是指将专有协议与标准协议（如 TCP/IP）进行合并的那些协议。事实上，人们可以利用 TCP/IP 支持的网络基础设施来托管自己的服务。这样可以节省成本，可靠性及吞吐量则因具体实施情况而异。


    以下是四种融合协议的示例：


    ## FCoE


    光纤通道（Fibre Channel）是一种网络数据存储解决方案，可帮助以 16 GBps 及以上的高速度传输文件。虽然其运行中曾使用光纤电缆，但后来开发了一种使用铜线的更廉价方案，即以太网光纤通道（FCoE）。它作为第三层协议运行，使用独立电缆，并取代
    IP 成为标准以太网网络的标准有效载荷。


    ## MPLS


    多协议标签交换（MPLS）避免了使用较长的网络地址，而是使用较短的路径标签来在网络上移动数据。与传统的 IP 路由过程相比，这可以节省更多时间。最好的一点是：MPLS
    可用于管理那些不属于 TCP/IP 协议族甚至与该协议族不兼容的协议。


    ## VoIP


    IP 语音（VoIP）被定义为一种隧道机制，可在 TCP/IP 网络上传输数据或语音。它不仅被视为计算机网络上公共交换电话网络（PSTN）的优秀替代品，还可在智能手机上使用。VoIP
    支持视频会议和远程项目协作等重要功能。话虽如此，某些 VoIP 解决方案旨在替代电话听筒或作为软件使用。Skype 就是后者的一个例子。


    ## iSCSI


    iSCSI 被视为 FCoE 的低成本替代品，它是一种基于 IP 的网络存储标准。你可以使用这种位置无关的技术在局域网（LAN）、广域网（WAN）及其他互联网连接上存储、检索和传输文件。


    ## 软件定义网络


    软件定义网络（SDN）为网络操作、设计和维护提供了新的视角。组织在网络设计方面不得不面对某些局限性，这就是为什么他们别无选择只能坚持使用单一供应商的原因。然而，借助
    SDN，控制层（数据传输管理的网络服务）与基础设施层（硬件及硬件配置）被分离开来。此外，由于 SDN 可以从中心位置进行编程，其优势包括基于开放标准、厂商中立以及灵活性。最重要的是，在这种网络中，组织可以根据诸如最高吞吐量评级或成本效益等效益，选择其偏好的硬件。


    ## 无线网络


    尽管无线网络最初因其带来的安全威胁而显得棘手，但其普及率在用户中飙升。随着时间推移，随着安全技术的发展，这一问题变得不那么严重，安全专业人员也开始采用无线网络。因此，让我们来看看一些与无线网络相关的概念。


    ### WLAN 与蜂窝技术


    虽然不同的电压代表有线网络中传输的数据的零和 one，但在无线网络中，这是通过无线电波来表示的。这被称为调制，以下是几种用于在 WLAN 和蜂窝网络上传输数据的技术。


    ## WLAN


    在 WLAN 上使用的四种常见技术包括跳频扩频（Frequency Hopping Spread Spectrum）、直接序列扩频（Direct Sequence
    Spread Spectrum）、正交频分复用（Orthogonal Frequency Division Multiplexing）和矢量正交频分复用（Vectored
    Orthogonal Frequency Division Multiplexing）。前两者是原始 802.11 标准的一部分，而后两者则是更为先进的调制形式。最后一种是思科（Cisco）开发的。


    ## 蜂窝网络


    蜂窝网络上用于调制的五种技术包括频分多址（FDMA）、时分多址（TDMA）、码分多址（CDMA）、正交频分多址（OFDMA）和全球移动通信系统（GSM）。虽然
    TDMA 是对 FDMA 的改进，但 CDMA 通过在整个频谱上扩展数据，允许通话使用所有频率。OFDMA 改进了 FDMA，常用于 4G 蜂窝设备。最后，GSM
    提供带有 SIM 卡的手机，SIM 卡必须留在手机上才能工作。使用秘密加密技术来防止手机克隆。


    ## 卫星


    卫星不仅可以通过微波技术为用户提供电视节目服务，还可以提供互联网。虽然与其他类型相比可能较慢，但这种技术在无法实施其他解决方案的偏远地区非常有用。


    ### WLAN 结构


    在查看 WLAN 标准之前，了解 WLAN 组件和整体结构是个好主意。


    ### 接入点


    这种无线发射器和接收器与有线部分连接，是有线设备接入网络的验收点。路由器是常见的例子。如今，“瘦”接入点类似于天线，可以连接到称为控制器的中央系统。


    ### SSID


    此名称或值用于区分一个 WLAN 与其他 WLAN。它可由接入点隐藏或广播。隐藏 SSID 并不是一种称职的安全策略，因为它仅仅移除了信标帧。由于其他帧的存在，无线网络存在的发现可以被“嗅探”。


    ### 基础设施模式与 Ad Hoc 模式


    由于 WLAN 必须包含一个 AP（接入点），所有站点和设备之间的通信都必须通过 AP 路由，这被称为基础设施模式。Ad Hoc 模式是指站点和设备无需 AP
    即可直接相互通信的模式。


    ## WLAN 标准


    ### 802.11 标准


    802.11 标准已经存在了一段时间。对该标准进行了多项修订，但有时被视为独立的版本。这些包括 802.11a、802.11b、802.11c、802.11f、802.11g
    和 802.11n。


    ## 蓝牙


    这种无线技术可用于在设备和外围设备之间创建个人区域网络。蓝牙 3.0 和 4.0 可以以 24 Mbps 的速度运行。Bluejacking（蓝牙劫持）和
    bluesnarfing（蓝牙窃取）是指未经授权的讯息和访问行为。


    ## 红外线


    这种短距离无线技术使用光而不是无线电波，并且要求两个设备都具有红外端口。它可以在 5 米的范围内工作，速度最高可达 4 Mbps。IrTran-P 协议可能会引发安全问题，因为它会自动接受文件。


    ## 近场通信（NFC）


    当两个通信设备彼此靠近至 2 英寸（约 5 厘米）以内时，可用于进行支付或读取电子标签。这两个设备中通常有一个是移动设备。


    ## WLAN 安全


    为了安全地实施 802.11 技术，你必须了解随着时间发展并使用的那些安全措施。开放系统和共享密钥认证是过去使用的传统身份验证方法，而针对无线网络的三种安全措施包括
    WEP、WPA 和 WPA2。与使用 TKIP 协议的 WPA 相比，WPA2 基于 CCMP 协议，因此被认为更加安全。


    ## MAC 过滤


    这种安全措施包括添加允许访问 AP 的 MAC 地址列表。然而，MAC 地址可以被欺骗，这就是为什么它不是一个很好的安全措施。话虽如此，你可以将特定设备列入黑名单或拒绝其访问
    AP。


    '
