  mdcn: "\n## 加密学的优势\n\n加密学是信息安全的一项基本工具，这一点无人能否认。然而，它为信息安全提供了四项基本优势。这些优势包括：\n\n- **保密性**\
    \ – 通过加密学，我们可以保护各种信息免受未授权用户的访问。\n- **认证性** – 通过数字签名和消息认证码（MAC）等各种加密技术，我们可以保护信息免受伪造和欺骗。\n\
    - **不可否认性** – 它提供不可否认服务，以防止因否认发送消息而产生的任何争议。\n- **数据完整性** – 加密学的哈希函数有助于让用户确信信息的完整性。\n\
    \n## 加密学的缺点\n\n尽管加密学在信息安全行业得到了广泛接受，但它确实存在一些缺点，这些缺点影响了信息的有效使用。这些问题包括：\n\n- 即使是合法用户，在决策时期也可能难以访问经过认证、加密和数字签名的信息。入侵者可以攻击计算机或网络，使其无法正常运行。\n\
    - 加密学在金钱和时间上的高成本是信息安全面临的主要挑战。\n- 它并不能保护那些由于系统、流程和协议设计缺陷而可能出现的威胁和漏洞。\n\n## 加密学的未来\n\
    \n技术将持续进步，这带来了椭圆曲线加密技术；尽管它有其自身的优缺点，但尚未被完全理解。尽管如此，椭圆曲线加密技术允许用户在更短的时间内完成加密和解密过程，从而能够以同等的安全性传输大量数据。虽然椭圆曲线加密技术仍然较新，但在它被用于私人、商业和政府目的之前，需要对其进行测试和证明其安全性。\n\
    \n另一个新现象是量子计算。既然现代计算机的数据以位（bit）为单位存储，那么量子计算机则通过多个状态的量子叠加来存储数据。有迹象表明，现代加密技术将探索更困难的计算问题，或者或许会制定新的策略以实现当前的目标。\n\
    \n# 第8章：防火墙\n\n## 简介\n\n如果你询问任何网络安全专家，互联网是否是一个令人恐惧的地方，10个人中有9个会表示同意。黑客或网络犯罪分子有能力隐藏自己的身份，同时试图入侵人们的计算机，以访问他们的个人信息，并意图利用这些信息谋取私利。\n\
    \n使问题复杂化的是，假设你的操作系统或软件存在一个安全漏洞，并且没有迅速修复，这可能导致有人在你不知不觉中入侵你的计算机。在这种情况下你会怎么做？这意味着你必须停止使用互联网吗？有没有一种方法可以保护你免受这种未经授权的隐私侵犯？\n\
    \n令人惊讶的是，你可以迅速采取措施保护自己。通过防火墙，你可以在没有任何外部入侵的情况下保护自己。以前，防火墙是“抢手货”，只有大公司才会使用，因为它们是高价的硬件设备。在那个时期，没有很多人使用互联网。然而，如果他们使用了，他们使用的是拨号连接，速度不够快。因此，大多数黑客瞄准拥有大带宽的公司。\n\
    \n如今，几乎每个人都能以廉价且快速的网速连接到互联网。黑客已将他们的“游戏”扩展到大型公司和家庭用户，特别是那些安全防护不当的用户。不过，在进一步探讨之前，理解防火墙的含义及其独特功能是至关重要的。\n\
    \n## 什么是防火墙？\n\n防火墙可以是一个软件应用程序或硬件设备，它充当互联网和你的计算机之间的保镖。它屏蔽所有你未请求的“互联网流量”访问你的计算机。这是一个简单的类比，但这就是防火墙所做的。简单地说，假设你浏览到xyz网站，防火墙会允许来自“xyz”网站的流量访问你的计算机。但是，如果你没有请求访问xyz网站，而该网站现在向你的系统发送流量，防火墙将不允许它访问你的计算机。尽管如此，这些表现出的特性是可以更改的。\n\
    \n当我说防火墙可以是软件应用程序或硬件设备时，请不要混淆；区别就在这里。硬件防火墙设备位于你的互联网连接中，而另一部分则连接到你的计算机。大多数这类防火墙内置集线器，使你能够连接多台计算机以共享单一的互联网连接。\n\
    \n防火墙使用一种称为网络地址转换（NAT）的技术，为所有连接至它的计算机提供所需的保护。受保护的计算机通过私有IP地址执行此保护，这些地址最初无法通过互联网访问。此外，防火墙将这些内部IP地址转换为单一的公共IP地址，然后分配给你的防火墙。通过这种方式，你的硬件防火墙可以接受每个传入请求，并将其转发到你内部计算机的请求。\n\
    \n另一方面，个人防火墙是一种安装在你要保护的计算机上的软件。该软件的作用是过滤传入和传出流量，并仅允许你个人请求的数据通过。与硬件防火墙不同，个人防火墙具有更多功能，尽管它们缺乏让你与单个网络上的多台计算机共享互联网连接的好处。\n\
    \n也许你在想，哪一种最适合你的保护？好吧，这个决定将取决于多种因素。然而，如果你只想保护一台计算机，最佳选择将是个人防火墙；如果你想保护多台计算机，最好选择硬件防火墙。此外，在保护多台计算机时，硬件防火墙更具成本效益。你也可以结合这两种设备来保护你的计算机。你应该考虑这一点，因为为了保障你的信息，特别是当你寻求额外安全级别时，这可能是一个好主意。\n\
    \n## 防火墙的重要特性\n\n在选择特定的防火墙使用时，务必特别关注它们的特性。这可能会对你的计算机如何抵御外部访问产生重大影响。尽管这些特性因人而异，但我整理了在考虑购买防火墙时应检查的最重要特性。尽管如此，在安全性方面，你的关注点应放在应用程序保护、隐形模式、通知、传入和传出过滤等功能上。让我们逐一查看这些特性，以让你了解它们的重要性。\n\
    \n- **传入和传出过滤**\n\n  此特性是独特的，因为它有助于确定允许或禁止的信息。防火墙的主要功能是根据制定好的标准或规则允许和丢弃信息。它通过执行此任务来处理你的所有安全问题。大多数人认为传入过滤是防火墙的主要功能，但他们错了。传入过滤是针对流向你的计算机的传入数据进行过滤的过程。\n\
    \n- **隐形模式**\n\n  重要的是，你的防火墙不仅要阻止请求到达计算机，还必须表现得好像它不存在于互联网上。当你的计算机处于隐形模式时\n\n"
