    Ripper 程序来尝试找出加密的密码。


    我们当时有一个在这个关卡没有的优势。加密算法是已知的，我们甚至有一个现成的程序来完成这项工作。现在，我们只有问题中提到的加密工具：`/usr/bin/encrypt`。目标：使用此程序，尝试编码一些东西，以找出使用的是什么类型的“加密”。我们知道加密后的密码是
    `tu|tSI/Z^`。让我们探索一下我们用来弄清楚它如何工作的程序的一小部分。


    我们可以使用脚本或代码来尝试为我们做这项工作，但为了避免在 HackersLab VI 中输入程序造成不必要的“手指磨损”，让我们动用头脑。首先：密码 `tu|tSI/Z^`
    有九个字符长。如果加密很简单，这很可能就是要加密的原始密码的字符数。这是我们将使用加密进行的第一项测试：


    ```

    $ ./encrypt aaaaaaaaa

    encrypted character: ''GGGDBBB-SS''

    ```


    我们使用加密程序加密了由九个字符组成的字符串 `aaaaaaaaa`。从这里开始，让我们改变（踢动）一些值，以试图接近我们的加密值。


    ```

    $ ./encrypt aaa1aaaaaa

    encrypted character: ''tGGGBBB-SS''

    $ ./encrypt aaaa2aaaaa

    encrypted character: ''GuGBBB-SS''

    $ ./encrypt aaaaa9aaa

    encrypted character: ''GG|BBB-SS''

    $ ./encrypt aaa129aaa

    encrypted character: ''you|BBB-SS''

    $ ./encrypt caa129aaa

    encrypted character: ''you|BBB/SS''

    $ ./encrypt cha129aaa

    encrypted character: ''you|BBB/ZS''

    $ ./encrypt chl129aaa

    encrypted character: ''you|BBB/Z^''

    $ ./encrypt chl1296aa

    encrypted character: ''you|tBB/Z^''

    $ ./encrypt chl1296rh

    encrypted character: ''tu|tSI/Z^''

    ```


    基于试错法，我们设法得出了一个与加密密码对应的值。我做了比上面展示的更多的尝试，但花几页篇幅记录恶意的尝试是有点徒劳的。


    当然，当加密涉及大量数字时，机会微乎其微。在这种情况下，你可以编写一个脚本来自动化这个过程。我们是用这个值来到达下一关的密码吗？让我们逐步测试一下。逐步地，我们连接到
