    - 我们找到了两个文件：`/proc/20840` 和 `/usr/bin/amos`。

    - 但等等……Amos 是一位先知的名字（叮叮，叮叮……我们发现为什么这个提示级别是这样的了）。

    - 让我们检查一下 amos 文件，然后：


    通过查看来自管理员的信息，我们发现再次拥有执行该文件的组权限（`x`）。我们成功运行了它，无需在前面加“./”（斜杠），这意味着它在 PATH 中。在我们的学习会话模拟中这是如何发生的？程序要求我们输入任意文件的
    PATH。我们输入了当前正在运行的文件（如前所述，可以是任何文件）。它通知我们该文件是可执行的。


    回到本阶段的问题，我们看到 Matthew 必须使用 file 命令来生成 amos 程序。那么，程序是否在外部运行文件归档？是的？让我们试一试！是的！！示例在外部运行了文件。让我们尝试运行它，并制作一个管道来尝试获取你的权限。所以让我们以我们学习的方式进行：我们输入
    `/usr/bin/amos` 的信息，`|`（管道符）以及 `pass` 命令。因此，程序将处理文件 `/usr/bin/amos|pass`。结果如何？level2
    的密码。又赢了一个阶段。


    ## Level 2 题目


    Kevin，一位 BBS 程序员，希望在你的主页上添加一个警报，以便你的成员每次登录时都能看到你的帖子。不幸的是，该消息有多页，且他的成员无法阅读。结果，他日夜挠头，试图找到一个解决方案。最后，他考虑使用
    more 命令来解决这个问题。然而，由于安全问题，这种方法是有风险的。


    提示：无须多言！


    **登录名：level2**

    **密码：DoItYourself**

    **学习内容：Shell 与子 Shell**


    系统的 Shell 不过就是执行输入的 Shell 解释器命令。它是一个文本模式屏幕，你可以通过系统命令与之交互。例如在 DOS 系统中，命令解释器是 `command.com`
    文件。在 Windows NT 及兼容系统中，它是 `cmd.exe`。你可以在 NT 上通过进入 开始/运行 并输入 `cmd` 来证明这一点。将会打开一个命令屏幕。


    为什么要用 Windows 作为例子？为什么 Linux 没有接近的不同之处。它有几种 shell 类型（sh, csh, ksh, bash2 ...），当在图形窗口管理器（如
    GNOME 或 KDE）内运行时，会给你一个另一个小的文本模式窗口，即命令提示符老板。结束它很简单。只需关闭它即可。当你在窗口管理器内运行 shell 时，你将在后台运行。这是一个重要的概念，因为我们要稍后大量使用它。我还可以在一个
    shell 内运行另一个 shell。这被称为子 shell。下面是一个例子：


    ```text

    [my system] $ ls

    ....

    rohtspasswd.old

    [my system] $ /bin/sh

    bash $

    ```


    在上面的例子中，我在一个 shell（展示我拼写的系统）中，然后移动到另一个 shell，sh（或简单的 bash）。如果我输入 exit 命令，我会回到上一个
    shell。这证明了 sh 是一个子 shell，因为它是在最初运行的 shell 内部运行的。


    ```text

    bash $ exit

    [my system] $

    ```


    这也可以通过程序完成。许多在 shell 上运行的文本模式程序（如 pine, vi 和其他）允许你从内部运行子 shell。甚至像 more 这样的命令也允许。这将在本级别的实践部分中变得清晰。


