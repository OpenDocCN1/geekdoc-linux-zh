    `PROGVULN` 和 `ARQVULN` 的值。逐步地，我连接到 HackersLab，找到了问题描述中引用的文件 `/usr/local/bin/hof`。让我们看一下，看看它是否真的会导致分段错误。让我们执行它。


    就在这里。它向我们索要第 11 级的密码，随后不久就发生了一次分段错误。就像在堆栈中一样，这是我们的入口点。只是现在情况有所不同。该程序运行如下：如果我们提供正确的密码，它将访问
    `passwd.success` 文件（或者如果未发生错误则访问该文件）；如果我们出错，则它访问 `passwd.fail`。我们将尝试利用 `passwd.success`，利用分段错误通过
    `hof` 程序的 SUID 权限来访问该文件的内容。我在 VI 中编写我们的漏洞利用程序，并将 `PROGVULN` 常量设置为 `/usr/local/bin/hof`，将
    `ARQVULN` 设置为 `/usr/local/bin/passwd.success`。保存。我们编译它（`cc exploit.c -o exploit`），就这样！让我们测试一下，并进行一点十六进制地址的暴力破解，直到我们可以成功为止。


