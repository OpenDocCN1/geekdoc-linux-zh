    While viruses are becoming obsolete, it doesn''t mean that they won''t pop out.
    The boot sector virus affects mostly floppy disks, which are used in booting a
    computer. However, modern systems don''t use floppy disks, but these viruses can
    still appear on the Master Boot Record of the system. They normally take place
    in the partitioned storage device of the computer. Notwithstanding, these threats
    are now mitigated since the evolution of the internet.


    # Direct Action Virus


    This virus shocked the world in 1998 and is normally triggered when the infected
    file is executed. It is an infectious virus, which doesn''t stay hidden in the
    computer memory or install itself. Instead, the load is sent directly to your
    computer before the virus becomes active. The only limitation to this virus it
    is activated only when you implement the infected file.


    What the direct action virus does is to attach itself to a COM or EXE files and
    wait for someone to activate it by clicking on the file. Once the file is executed,
    it pops into the computer system, looking for similar files in your computer directory
    to spread the virus. Nevertheless, do not be frightened because the virus doesn''t
    delete any file, nor does it affect your computer performance. Besides making
    some of your files inaccessible, the impact on the user is minimal and can be
    removed with a reliable antivirus program.


    # Resident Virus


    This particular virus is a file infector. Unlike the direct action viruses, which
    don''t install itself, the resident virus installs itself in the computer. Even
    when the original source file has been infected and eradicated, the resident virus
    makes the file to continue work. Most security experts regard the resident virus
    is more deadly than its cousin the direct action virus does.'
