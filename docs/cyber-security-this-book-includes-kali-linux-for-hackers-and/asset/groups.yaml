    We talk so much about this HackersLab ... What exactly is this? OHackersLab Challenge
    is a kind of "game" very well known in the security and hackers circle in general.
    It is so well known that it already existed until the Brazilian version was made
    by UFRJ (Federal University of Rio de Janeiro).ro) which was named LockABit (www.lockabit.com).
    The challenge is simple (good, in terms). You start at level 0. Currently, there
    are 18 levels (counting zero) to break. Once you win a challenge, you get the
    password to the top level. If the challenge ever ends, will the book lose its
    usefulness? Of course not. As I said, there are already other challenges based
    on HackersLab, and even if they didn''t exist, the book teaches you enough for
    you to test even on your own Linux system. What if I can''t understand the higher
    levels? It does not matter...The book will always be a reference for you. It''s
    at a level that needs C programming and you can''t still understand? Learn C then,
    first of all. The goal of the challenge is to get you to level 17 practically,
    as a master. I can show you the way, but you have to walk the path alone. If you
    are new to the security world, I suggest you read the Hacker Guide, so you will
    have a better basis for absorbing what will be taught here.'
