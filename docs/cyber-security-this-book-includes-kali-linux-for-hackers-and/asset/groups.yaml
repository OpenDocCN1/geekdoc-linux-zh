    Login: level6 Password: Best of The Best Hackerslab Study: Port Scan.


    This is one of the easiest levels of HackersLab. It''s for a really relaxed time.
    It focuses on the following fact: there is a second open door for access to the
    system. What are these doors? Whenever you connect to a system, a "Socket" is
    created. A socket is nothing more than the IP + address combination service door.
    This allows the same internet address to have multiple services running as Web
    Server, FTP, SMTP, POP, and others.Some common port numbers:21 - FTP22 - SSH23
    - TELNET25 - SMTP79 - FINGER80 - WWW3128 - PROXY6000 – XWINDOWSSERVER, common
    ports using TCP and UDP protocols.


    For example: when I connect to any web page like http://www.visualbooks.com.br,
    I''m actually connecting to HTTP: //www.visualbooks.com.br:80 (visualbooks.com.br,
    on port 80, which is the web standard). So far it seems easy. But we fall into
    the following problem - there are 65535 ports for both TCP and UDP protocols.
    There are doors that never end anymore. How can we find out which ones are open
    and which aren''t? By using door scanners. Port scanners are applications that
    try to find out in a certain IP address or host, which ports are open. They can
    usually use a list of most known ports, or a range (example: from 1000 to 8000).
    They are usually extremely fast and results quickly return to us. Common port
    scanners perform a TCP connect () on the most targeted machine. This means that
    it performs the three TCP authentication paths ( syn-syn / ack-ack ). Using this
    system, it is easy for the scanner to discover the scanning attempt. A firewall
    or IDS, for example, quickly captures the hacker''s IP. To end this, there are
    now more sophisticated scanners, like NMAP.NMAP, which can scan in many ways besides
    TCP connect (), has half syn () scanning (only sent syn), fin, Xmas and others.
    Each type uses different flags to make it difficult to detect the scanned host.
    At this step-by-step level, I will use two different scanners: NMAP, for Linux,
    and VALHALLA for Windows and we''ll try to find the port.'
