- - '######'
  - 3. 创建好软盘后，请将其和 Xandros 安装光盘分别留在各自的驱动器中。假设您已准备好开始安装过程，请按下**自动运行向导**中的**重新启动**按钮以重启您的计算机。随后，您可以按照下文所述的仅安装
    Xandros 或双启动安装的说明继续进行。如果您现在还未准备好，请关闭自动运行向导窗口并暂时移除这两张磁盘。当您准备好执行安装时，稍后可以在启动计算机之前重新插入这两张磁盘。
- - '#####'
  - 付诸行动——安装 Xandros
- - '######'
  - 项目 2B：安装过程
- - '#######'
  - 1. **整理硬盘碎片（仅限双启动设置）** 如果您希望创建一个双启动设置，允许您在 Windows 或 Xandros 中启动，最好在继续之前先整理您的
    Windows 硬盘碎片。这将使后续安装过程更快，当 Xandros 缩小您的 Windows 分区以为自身腾出空间时。
- - '#######'
  - 2. **启动它** 将 Xandros 安装光盘放入您的光驱（如果您的计算机无法从光盘启动，请将启动软盘放入软驱），然后启动或重新启动您的计算机。
- - '#######'
  - 3. **欢迎** 计算机启动后，您会看到其常规的硬件 BIOS 屏幕，这些屏幕无论您使用什么系统都会出现。之后，将显示第一个 Xandros 屏幕，这是一个半图形化且以黑色为主的开场屏幕。随后将显示
    Xandros 安装向导的第一个屏幕——欢迎屏幕（图 2-5）。当它出现时，您只需点击**下一步**按钮即可。
- - '#######'
  - 4. **许可协议** 阅读此向导屏幕（图 2-6）中的许可协议，假设您同意，请点击“I accept this agreement”字样旁边的单选按钮（如果您不同意……好吧，那我们就到此为止了），然后点击
    Next。
- - '#######'
  - 5. **安装选择** 接下来的屏幕（见图 2-7）允许您在快速安装和自定义安装之间进行选择。快速安装本质上是一个完整安装，因此请点击“Express install”字样旁边的单选按钮以坚持使用它，然后点击
    Next 按钮继续。
- - '#######'
  - 6. **系统配置** 在此屏幕（图 2-8）中，Xandros 检查您打算如何处理磁盘上已有的内容。如果您的机器上已有早期版本（甚至相同版本）的 Xandros，您将被询问是否希望保留您主目录（Home）和根目录（root）中的数据（遗憾的是，全局设置和自定义安装的包除外），还是希望用全新安装替换整个系统。然而，如果您像大多数人一样，Windows
    占据了您的整个硬盘，您将被询问是否希望通过调整其分区大小来保留该操作系统（从而为安装 Xandros 腾出空间），还是希望用 Xandros 覆盖它。做出符合您意图的选择，然后点击**Next**。
- - '#######'
  - 7. **管理配置** 在此屏幕中（见图 2-9），您将输入我稍早前让您准备好的 root（也称为“管理员”）密码。在两个方框中分别输入它，然后如果您想更改默认计算机名称，也请一并更改。只需确保仅使用字母、数字、下划线和破折号——并且不要超过
    15 个字符。完成后，点击**Next**。务必记住您的 root 密码，否则您将无法安装任何应用程序或更改某些系统设置。
