- pgno: 127
  md: '# 7A-2: Switching Between User Accounts


    Now that you have added your new user, it might be good idea to give that new
    account a spin in order to see how things work. Basically, the process differs
    only slightly from what you use when shutting down your system. Start off by quitting
    any open applications you are running (including the Control Center), and then
    follow these steps:


    +   1. Go the **Launch** menu, and select **Logout**.

    +   2. In the window that appears, click the **Logout** button.

    +   3. When the Login screen appears, click the down arrow at the right side of
    the box containing your username (next to the words *User name*), and then select
    your new user account in the drop-down menu.

    +   4. Type the user password for the new account, and then click **OK**.


    After a few seconds, you will have arrived at your new user''s desktop, and, just
    like the first time you have arrived at your own, the First Run Wizard will appear.
    You can go through the steps of the wizard now, if you like, or you can do it
    later by clicking **Cancel** for now. Once the wizard is gone, you will notice
    that your new user account looks almost exactly like your own, assuming you haven''t
    performed any dramatic changes since installing the system.


    If you look a little more carefully, however, you will also notice that the various
    launchers and applets we added to your desktop in Chapter 3 are not present in
    the panel of your new account. If you double-click the **Home** folder on the
    desktop, you will also find that the Home folder is empty, except for the desktop
    icon and My Documents folder. No need to panic, though, because this is the way
    things are supposed to be. Remember that I said that *changes made in one user
    account do not affect those in another*, so you are now face-to-face with the
    proof of that assertion.


    Anyway, as we are soon to embark on a journey into the world of cosmetic customization,
    you can just stay in your new account as you follow along with the next projects.
    If you would prefer to perform those customizations on your own account environment,
    go ahead and log out of the new account and back in to your regular one. The choice
    is yours.


    # **Project 7B: Installing Fonts**


    Ever since the debut of the first Macintosh way back in 1984, computer users have
    been obsessed with fonts. That was certainly the case for me the first time I
    laid hands on a Mac at the UCLA bookstore. Of course, once other operating systems
    went graphical, font fun was available to all, and so it was with Linux as it
    began to develop. In the past, however, installing fonts in a Linux system could
    prove a rather challenging endeavor. This is fortunately no longer the case, and
    the Xandros Control Center makes even easier work of things.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# 7B-1: Downloading New Fonts


    Before you can install any new fonts, you first have to get some. The Internet
    is an excellent source of these, with numerous freeware, shareware, and for-sale
    fonts being available. Remember one thing: you want to use Windows fonts, not
    those for the Mac. A favorite font-supply source of mine is www.fontfreak.com,
    which I’ll be using as the source of the fonts in this project. The Font Foundry
    (www.fontfoundry.com) and Font Paradise (www.fontparadise.com) are also excellent
    sources that you might want to check out.


    Get started by going to the FontFreak site and clicking the **ENTER** link on
    that page. On the next page on that site, there is a message notifying you of
    the fact that you can purchase all of the 4,700 files it has available.


    If you’re really into fonts, you might consider doing that later, but for now,
    just click the **No Thanks** link. Finally, once on the main FontFreak page, click
    the **PC Fonts** link in the small menu on the left side of the page. Oh, and
    if you end up on a completely different website, you have clicked the wrong PC
    Fonts link, so don’t be surprised if it happens to you. If you want to follow
    along with me, and keep things simple, just download the fonts Action Jackson,
    Airmole, and Airstream from the first page; otherwise, just browse around until
    you find three fonts that you like. Try to find some that are somewhat gaudy,
    or at least ornate, so that they will be clearly distinguishable from the ones
    that come with your system. Once you have downloaded three fonts, close your web
    browser.


    # 7B-2: Preparing Your New Fonts for Installation


    The fonts that you download from FontFreak will come as compressed ZIP archives,
    so before you can install them, you will have to extract them, as you learned
    to do in Chapter 5. To make things easier, first create a new folder called My
    Fonts, and then place the various fonts into that folder once you have extracted
    them.


    # 7B-3: Installing Your New Fonts


    Once your fonts are downloaded and unzipped, you can install them by following
    these steps:


    +   1. Open the Control Center.

    +   2. In the left pane of the Control Center window, click **Display**.

    +   3. In the list of subcategories that then appears, click **Font Installer**;
    the Font Installer module will appear in the right pane of the window (Figure
    7-5).


    As you will immediately notice, the list of fonts in the module window will be
    empty, which may come as a surprise given the fact that your system comes bundled
    with a good number of fonts of its own. The reason for this is that the Font Installer
    is displaying only the fonts installed exclusively in your user account. Fonts
    installed in this way will be available'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'for use only in the account in which they were installed. Thus, the fonts you
    install while in your `graphhka` account will not be usable in your regular user
    account and vice versa.


    This might sound like a somewhat odd arrangement, but imagine what would happen
    if your son, for example, developed a real thing for fonts and installed over
    a hundred of them. If we were able to install those fonts system-wide, rather
    than strictly for use in his own account, you would end up having to scroll through
    your font menu forever when trying to switch fonts while writing a document in
    OpenOffice.org Write, for example. It really is all for the best, as you will
    hopefully never have to find out.


    ![](img/3badae5570de77b990135448f8a8a1cc_129_0.png)


    +   4. Continue the installation process by clicking the **Add Fonts** button;
    the Add Fonts window will appear.

    +   5. Double-click the **My Fonts** folder icon in that window, and while holding
    down the **CTRL** key, click each font file in the window.

    +   6. Once you have selected the fonts, release the **CTRL** key, and click **Open**.

    +   7. A small window will then appear telling you that any running applications
    will have to be restarted before the font changes will take effect in those programs.
    Remember what it says (I’ll remind you later, in case you forget), and click **OK**
    to close that window.


    You have now successfully installed your fonts, which will appear in the previously
    empty list in the Font Installer module window. If you now click one those fonts
    in the list, a preview of that font will then appear in the right pane of the
    module (Figure 7-6).'
  merge: -1
  img_proc: true
- pgno: 130
  md: '![](img/3badae5570de77b990135448f8a8a1cc_130_0.png)


    > Figure 7-6:: Previewing fonts in the Font Installer module


    Remember that if you had any applications open when you installed the fonts, you
    will first have to restart those applications before you can use your new fonts
    in them. If you have experience using OpenOffice.org in earlier versions of Xandros
    or other Linux distros, you will also be happy to know that your new fonts will
    also be immediately available for use in that application as well, which is quite
    a change from how things used to be even in the recent past.


    # Windows Fonts for Dual-Booters


    If you created a dual-boot setup when installing Xandros, you will be pleased
    to know that all of your Windows fonts will also be available for use in Xandros,
    because they are automatically recognized by the system. No special steps are
    required.


    # Project 7C: Having Some Fun with your System''s Font Settings


    Now that you have some new fonts to play around with, let’s move on to gaudying
    up your system a bit by changing some of the system’s font settings. If you are
    a little worried about creating an aesthetically dreadful mess of your system
    in the process, don’t be—just a few mouse clicks will bring everything back the
    way it was before we got started. Let’s move on and have some fun!'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# **7C-1: Changing Your System''s Fonts**


    In the previous project, I mentioned that the fonts you installed via the Control
    Center will be immediately available for use once you restart any applications
    that were open when you installed the new fonts. The only exception to this rule,
    however, is the Control Center itself. In order to use the fonts you just installed
    from within the Control Center, you will first need to restart the whole system.
    So, that said, go ahead and restart your system now, and be sure to log in to
    the same account in which you installed the fonts.


    Waiting . . . . . . . Hmmmm . . . . Duh dum duh dooo . . . Should be ready soon
    . . . . . Bingo!


    Assuming your system has now restarted and you have logged back in, let''s get
    started with our font-customization project. Here''s what you need to do:


    +   Run the Control Center, and then click **Display** in the left pane of the
    window once it appears.


    +   Now click **Fonts** in the list of subcategories that appears.


    In the right pane, you will see a list of the fonts currently in use for the various
    components of your system (Figure 7-7). For example, the font used for the text
    below the various icons on your desktop is Bitstream Vera Sans 12, the font used
    for the titles that appear at the top of your windows is Bitstream Vera Sans 12
    Bold, and so on.


    For our immediate purposes, these fonts are all just too staid and stuffy, so
    let''s get a bit wilder. Let''s start off by changing the font for the text displayed
    on the desktop.


    ![](img/3badae5570de77b990135448f8a8a1cc_131_0.png)


    *Figure 7-7: System font settings*'
  merge: -1
  img_proc: true
