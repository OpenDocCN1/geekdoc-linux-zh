    \ black space at its edges. Needless to say, unless you like having it there because\
    \ of a rather unique sense of aesthetics, that black space will have to go. For\
    \ this chore you will need to do some cropping. \nTo crop an image in Digikam,\
    \ follow these steps:\n\n+   1. Place your mouse cursor in one of the corners\
    \ within the picture area of your image (avoiding the black space), press the\
    \ left mouse button, and then drag the cursor until it reaches the diagonally\
    \ opposite corner and you have created a rectangle within the picture portion\
    \ of the image.\n\n+   2. When you have finished, release the mouse button, and\
    \ then everything outside of the rectangle will darken, as you can see in Figure\
    \ 11-16. The bright area within the rectangle is what will be left of your image\
    \ when you have finished the cropping process, while the darkened area outside\
    \ the rectangle is what will be cropped. That being the case, if you have any\
    \ black space remaining that still needs to be removed, try"
