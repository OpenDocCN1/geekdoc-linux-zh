- pgno: 399
  md: 'If everything looks as it should, go to the **File** menu and select **Save**.
    Then you can test out the new launcher by quitting the Menu Editor and selecting
    **Applications** ▶ **Games** ▶ **Arcade** ▶ **Njam** in the Launch menu. Njam
    should then reappear in its own window, as before. If not, go back to the Menu
