    8. In the Properties window, select Large from the drop-down menu button beneath
    the word Size (Figure 19-21). Then click OK, and the Panel will bloat up to almost
    three times its original size.


    ![](img/3badae5570de77b990135448f8a8a1cc_424_1.png)


