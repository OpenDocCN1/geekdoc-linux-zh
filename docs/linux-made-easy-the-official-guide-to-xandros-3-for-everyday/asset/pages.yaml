- pgno: 272
  md: '![](img/3badae5570de77b990135448f8a8a1cc_272_0.png)


    # EAR CANDY


    Xandros Does Audio


    ![](img/3badae5570de77b990135448f8a8a1cc_272_1.png)


    It’s now time to move on to the audio side of things in our Xandros workout. In
    Chapter 6, you learned about Kscd, your system’s default CD player, but in this
    chapter you will find out even more about your system’s other musical talents.
    You will learn how to rip CDs and create MP3 and Ogg files (which have the .mp3
    and .ogg filename extensions, respectively), how to change the tags of such files,
    and how to play them. You’ll also learn how to play the different varieties of
    Internet broadcast streams.


    # Audio Formats


    Before we start off on our discussion of how to work with audio files in Xandros,
    it is probably best to first discuss the various formats in which audio data can
    be stored on your computer, as this is essential information. The de facto audio
    file standards in the computer world for the longest time have been WAV (created
    by Microsoft/IBM and using the .wav extension), AU (from Sun/Unix and using the
    .au extension), and AIFF (from Apple). All of'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'these are uncompressed formats, so files saved in these formats are therefore
    exceedingly large, with an average WAV file of CD-quality music weighting in at
    about 10 MB per minute of music. To put that in perspective, back in 1988 my first
    Macintosh had a 40 MB hard disk—more space than I would ever need, I thought at
    the time, but not enough to store a WAV file of Nirvana’s “Come as You Are.”


    As computers evolved into the multimedia machines they are today, it became clear
    that something was going to have to be done about those disk-space-devouring audio
    files. Audio-compression formats were thus developed. To oversimplify things a
    bit, these compression formats work by cutting out the portions of the audio signal
    that the human is less likely to notice if gone—sort of a dog-whistle approach.
    The most widely known and embraced of these audio-compression formats is MP3 (mp3).
    Audio files encoded in MP3 format can end up being as little as one-twelfth the
    size of the original CD audio (.cda) file without any noticeable loss in quality.


    Another audio-compression format that was developed is Ogg Vorbis (.ogg). Ogg
    Vorbis is a product of the open-source community, and so, unlike MP3, which has
    always been used under the shadow of yet-to-be-exercised patent rights, it has
    been free of patent and licensing worries from the get-go. Because of that, and
    the fact that it was equal to or, as many contend, better than MP3 in terms of
    quality and performance, Ogg Vorbis has become the darling of the Linux community
    and its de facto audio-compression format.


    # The Xandros File Manager as an Audio App?


    In Chapters 5, 6, and 13 you learned about many things you can do with the Xandros
    File Manager. With XFM, you can work with your files, burn CDs, browse through
    your digital images, and even view web pages. But XFM can also function to some
    degree as an audio application. Xandros File Manager won’t play your audio files
    for you, but it will allow you to *rip* (copy) files from audio CDs and save those
    files as it (uncompressed). It can also *encode* them as (convert them to) compressed
    Ogg files for your own personal use. After you complete Project 14A, you will
    also be able to encode the tracks as MP3s if you prefer.


    Xandros File Manager’s DVD-Writer will also allow you to take those files you’ve
    ripped and then *burn* (record) them onto recordable CDs or audio CDs that can
    be played on any standard audio CD player. This allows you to create compilations
    of your favorite songs and then play them on your living room or car stereo without
    worry as to whether or not those players are .mp3- or .ogg-compatible.


    # Using Xandros File Manager to Rip and Encode Audio Files


    You will find that ripping the tracks from a CD and then encoding them in the
    Ogg or MP3 file format is quite simple. Since XFM will first search the CDBB online
    database for album, artist, and song title information for the'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'CD you are ripping, it is best to be connected to the Internet when doing so
    if you want that information encoded in the final MP3 or OGG files. Other than
    that, all you have to do is follow these steps:


    +   1.  Insert an audio CD in your disk drive. Kscd will appear and begin playing
    the songs on it.

    +       2.  Because you have inserted the CD for the purpose of ripping it, not
    listening to it, quit Kscd and its Panel applet.

    +       3.  Next, open a Xandros File Manager window and click the **CD-RW** or
    **DVD-ROM** icon in the file tree in the left pane of the window. The contents
    of the CD will appear in the right pane of the window (Figure 14-1), though this
    might take a bit more time than it does for data CDs. Just be patient and stare
    at the little paper airplane that will float back and forth in the right pane
    as Xandros File Manager reads the disc.


    ![](img/3badae5570de77b990135448f8a8a1cc_274_0.png)


    Once the tracks on the CD appear, you are ready to roll. What you do at this point,
    however, depends on how many of the tracks you want to rip and encode.


    +   4.  If you want to convert only a single track, drag that track to a folder
    of your choice in the file tree in the left panel-your My Music folder would be
    an appropriate location. If you want to convert more than one track, hold down
    the CTRL key, and select the target files by clicking once on each of them.

    +       5.  Once you''ve finished selecting the files, release the CTRL key, click,
    but don''t release, any one of the files you''ve selected, and then drag them
    all in unison to the destination folder.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'When you have done this, Xandros File Manager will begin copying the files
    from the CD to your hard drive. Again, this will take longer than you may have
    gotten used to when copying files from a data disc, but they are larger files,
    after all. Also, do not too concerned about the progress window; it sometimes
    seems to give rather odd readings during the process. At some time during the
    process, another window will appear, asking how you’d like to save the files.


    As you can see in Figure 14-2, the choices listed are WAV, CDA, OGG, and MP3,
    although the MP3 option will not be selectable until after you’ve installed MP3
    encoding support in Project 14A. Unless you choose OGG or MP3, you pretty much
    will be defeating the purpose of ripping and encoding your audio tracks, so stick
    with one of those two compressed formats. If you also want to use the files on
    your Windows side or on your Mac, if you have them, it is probably best to go
    with MP3.


    ![](img/3badae5570de77b990135448f8a8a1cc_275_0.png)


    +   6. Once you have made your selection, click **OK**. Xandros File Manager will
    then move on to the encoding process, and when it is done, the progress window
    will close automatically. The compressed files now reside on your computer.


    # Get Started Organizing Your Now-Compressed Audio Files


    Once the rip-and-encode process is complete, you should organize your files so
    that in the future you’ll know what is what. The standard way of doing this is
    to create a new folder in your My Music folder named after the artist who performed
    the tracks you just ripped. Inside that folder, create another folder with the
    title of the album from which you just ripped the tracks. For example, if you
    ripped songs from Molly Bancroft’s *Get Closer* album, you would create a *Molly
    Bancroft* folder and a *Get Closer* folder within that. Of course, in the future,
    if you were to rip and encode songs from a different album by the same artist,
    you would create a new folder for *that* album within the original folder you’ve
    already created for the artist and move all of the newly ripped files into it.'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'If your encoded tracks are not named with the actual song titles, because you
    weren’t connected to the Internet when you ripped the tracks or because the album
    you ripped wasn’t listed in the CDDB online database, it is probably also a good
    idea, though not a necessity, to go on and rename the tracks themselves with their
    appropriate titles. For example, in the case of Molly Bancroft’s Get Closer album,
    the filename Track 6.mp3 would be renamed Funky Little Mouth.mp3, and so on.


    In this case, if you would like the artist and track names to appear when playing
    the files in an audio player, you will also need to input each track’s tag information.
    This is a bit tedious when dealing with many files in one go, but it is easy.
    You will learn how to do it in the XMMS section of this chapter.


    # Settings


    If you would like to adjust Xandros File Manager’s encoding settings for Ogg files,
    you can do so by going to the **Launch** menu and selecting **Control Panel**.


    When the Control Panel window appears, click the + symbol next to **Sound & Multimedia**,
    and then click **Audio CDs**. You can then get to the encoding settings by clicking
    the **Ogg Vorbis Encoder** tab in the right pane of that window (Figure 14-3).


    ![](img/3badae5570de77b990135448f8a8a1cc_276_0.png)


    Figure 14-3: Changing the encoding settings for Xandros File Manager


    In this tab you can select the encoding bit rate, which allows you to control
    the sound quality of the final encoded file. The basic rule to remember is that
    the higher the bit rate, the better the sound quality. If you are short on disk
    space, you should also be aware that higher bit rates take up more disk space,
    so you’ll need to define your priorities in terms of sound and space. The most
    common choices are 128 kbps, 160 kbps, and 192 kbps though the default, 128 kbps,
    should provide more than acceptable sound quality if disk space is of great concern.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Creating an Audio CD with Xandros File Manager


    As I already mentioned, another cool feature of the Xandros File Manager''s DVD/CD-Writer
    is that it allows you to use your Ogg and MP3 files to create (for your personal
    use) standard audio CDs that can be played on any standard audio CD player.


    The process for doing this is essentially the same as that for creating data CDs,
    albeit with just one minor exception. Here are the steps:


    +   1. Open a Xandros File Manager window, and then click the **DVD-Writer** or
    **CD-Writer** icon (depending on the hardware you happen to have) in the file
    tree at the left side of the window.


    +   2. Next, click **Create music CD** in the right pane of the window (Figure
    14-4).


    ![](img/3badae5570de77b990135448f8a8a1cc_277_0.png)


    Figure 14-4: Creating an audio CD in XFM


    +   3. Copy the MP3 and Ogg music files you want to include on your CD (and yes,
    you can mix both file types) to the right pane of the window until you have about
    14 songs.


    +   4. Once you’ve done that, click the words **Write files to disc**, after which
    the usual window warning you about running programs while burning discs will appear.


    +   5. Click **OK** to follow that bit of sound advice.


    +   6. After the **Create Disc** window appears, click **OK**. The DVD-Writer
    will then check to see if you have a blank disc in your drive, and if you don’t,
    it will request that you insert one.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '+   7. Insert a blank disc (my experience is that 650 MB discs seem to work
    best), and once the light on your drive stops flashing, click **OK**. The process
    will then begin.


    As with all other disc-burning scenarios I have mentioned thus far, the progress
    of the burning process will be indicated in the Create Disc window, and once the
    process is complete, the disc will be ejected automatically.


    You can now test out your new audio disc by reinserting it into the drive. After
    doing that this time around, however, Xscd should start up automatically and begin
    playing the CD.


    Be aware that since the disc you’ve just created is not a standard commercial
    album, it won’t be listed in the freedb.org database. Xscd therefore cannot gather
    and display track information for the songs on your disc. A small price to pay,
    as they say.


    # Project 14A: Adding MP3 Encoding Support to Xandros


    As you have learned, you can rip audio files from CD and encode them in Ogg Vorbis
    format using either the Xandros File Manager DVD-Writer or other applications
    that I will discuss shortly. You also already know that Xandros does not come
    with MP3 encoding support; however, as a personal user, you can install such support
    yourself in the form of an application called LAME. Of course, since LAME is not
    included in the Xandros distribution itself due to licensing concerns over MP3,
    it is only logical that it is likewise not available via the Xandros Networks
    repositories. You will thus have to download LAME from outside sources and then
    install it via the Xandros Networks application. Here are the very simple steps:


    +   1. Open your web browser, and go to http://users.rise.anu.edu.au/~conrad/not_lame.


    +   2. When that page appears, look for and download the file lame_3.91_2_i386.deb.
    Don’t use the newer 3.92 version, as it might not work with your system. There
    may be still newer versions available by the time you read this, but the file
    I’ve listed here works; I can’t guarantee any others.


    +   3. Once the download is complete, run Xandros Networks, and then in the File
    menu select **Install DEB File**.


    +   4. In the Browse for Package window that appears, locate the LAME file you’ve
    just downloaded, select it (by clicking on it once), and then click the **Open**
    button.


    +   5. Click the **Install** button in that window.


    +   6. You will then be prompted for your root password, so type it, and then
    click **OK**. Xandros Networks will then install the file while showing its progress
    in a separate window.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '+   7. When the installation process is complete, the word *Done* will appear
    in the progress window. You can then click the **Close** button and drag the LAME
    file you downloaded to the Trash.


    Once the installation is complete, you can encode the audio files you rip from
    a CD into the MP3 format from the Xandros File Manager.


    # ## An Alternative Ripping and Encoding Application—RipperX


    Although Xandros File Manager’s ripping and encoding capability is very handy,
    it is not without some minor drawbacks. The fact that it does not create artist
    and album folders or provide track names can, in the end, mean more work for you,
    especially if you are doing a lot of ripping. There are, however, a couple of
    other applications available from Xandros Networks that can do all of these chores
    for you in one fell swoop, thus making the process much easier and quicker. *My
    favorite of these is called* ripperX.


    RipperX is an alternative ripping-and-encoding application that gathers from the
    Internet artist, album, and track information for the album you are ripping. It
    rips and encodes the tracks of that album in either Ogg or MP3 format and then
    places the encoded files in the artist and album folders it creates on your hard
    disk. It is extremely easy to use and configure. Best of all, it’s pretty quick.


    # ### Installing RipperX


    To install ripperX, just run Xandros Network, and make sure that the *Debian unsupported
    site repository* is enabled in the Set Application Sources window (Edit ▶ Set
    Application Sources). After doing that, type *ripperX* in the text box next to
    the *Search* button, and then click *Search* or press ENTER. RipperX will then
    appear in the list of results below (it will probably be the only item listed).
    Now click *Install*, and then follow the remaining simple installation steps you
    learned in Chapter 8.


    # ### Using RipperX


    To use ripperX, just follow these steps:


    +   1. Insert an audio CD in your disk drive, and then quit KsCD and its Panel
    applet once they appear.


    +   2. Go to the Launch menu, and select Run Command.


    +   3. In the Run Command window, type ripperX, and then click Run.


    +   4. When the ripperX window appears the first time, a small window, “Wanna
    create . . . ,” will appear asking if you want to create a config file (Figure
    14-5). You do, so click Yes.'
  merge: -1
  img_proc: true
- pgno: 280
  md: '![](img/3badae5570de77b990135448f8a8a1cc_280_0.png)


