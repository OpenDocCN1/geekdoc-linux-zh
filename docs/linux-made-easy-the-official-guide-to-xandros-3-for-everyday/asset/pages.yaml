    ![](img/3badae5570de77b990135448f8a8a1cc_350_1.png)


    # Word Count


    A common feature that is very easy to use, but not so easy to find, is *Word Count*.
    To take a tally of the number of words, characters, images, and lines in your
    document, just go to the **File** menu within your document and select **Properties**.
    When the Properties window for your document appears, click the **Statistics**
    tab, after which you will see all of the information clearly laid out before you,
    as in the example in Figure 17-5.'
