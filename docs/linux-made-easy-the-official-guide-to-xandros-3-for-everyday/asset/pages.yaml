  md: '![](img/3badae5570de77b990135448f8a8a1cc_344_0.png)


    # Other Graphics Apps You Might Want to Consider


    If you’re looking for still other applications to work with, you might want to
    consider *Sodipodi*, which is a drawing program. Drawing programs, in case you
    didn’t know already, produce images in which the various shapes are based on a
    series of mathematical formulae. This is in contrast to painting programs, such
    as Paint or the GIMP, which save data as a collection of dots, or bits, in which
    the location and color of every single pixel is recorded. Images created with
    paint programs are thus often referred to as *bitmaps*.


    The advantages of drawing programs over paint programs are that their files are
    smaller because they don’t need to hold as much information and that the actual
    drawings can be increased to near gigantic sizes without losing their shape. When
    you do the same thing with an image you create in a paint program, curved edges
    will become more and more jagged as you increase their size. Of course, on the
    other hand, paint programs are much more intuitive and thus easier to use.


    If you are a real graphics aficionado, you might also want to consider installing
    *Blender*, which is a widely respected and exceedingly sophisticated 3-D modeling,
    animation, and rendering application that is widely used in the Linux, Windows,
    and Macintosh worlds.


    Both Sodipodi and Blender are available from Xandros Networks. Just *type* the
    name of the one that interests you in the text box at the top of the XN application
    window, click the *Search* button, and then click *Install* next to the application
    in the list of results in main pane of that window.'
  merge: -1
  img_proc: true
