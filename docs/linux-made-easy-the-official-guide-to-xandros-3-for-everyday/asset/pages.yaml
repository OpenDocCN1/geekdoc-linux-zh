    # Moving Out on Your Own with the GIMP


    Well, you''ve gotten some hands-on experience with the GIMP, but there is still
    a lot more under the hood for you to play around with. Go ahead and try things
    out on your own, which can be a lot of fun if you''re into that sort of thing.
    Just be sure to save a copy of whatever image you are going to work with before
    getting down to it. After all, “an ounce of prevention . . .” as the saying goes.
    If you prefer working through tutorials instead of just finding things out by
    goofing around, the GIMP Documentation page (www.gimp.org/tutorials) has a number
    of links to tutorials covering various functions, features, and skill levels.


    # **Project 16B: Screenshots**


