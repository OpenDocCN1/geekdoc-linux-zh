- pgno: 300
  md: '![](img/3badae5570de77b990135448f8a8a1cc_300_0.png)


    *Figure 14-31: Playing a MIDI karaoke file in MIDI Player*


    If you''re interested in that sort of thing, you can find a wide variety of such
    MIDI or MIDI karaoke files on the Internet by doing a Yahoo or Google search.
    To get you started, one site you might try out straightaway for MIDI karaoke files
