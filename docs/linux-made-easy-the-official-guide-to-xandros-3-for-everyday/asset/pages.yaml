    will actually appear in your printout.


    # Removing Headers and Footers


    Well, now that you know how to add headers and footers to a document, you may
    also be wondering how you can get rid of them. Here are the steps:


    +   1. Go to the **Format** menu and select **Page**.

    +   2. In the Page Style window, click on the **Header** or **Footer** tab (depending
    on which of the two you want to remove).

    +   3. In that tab, uncheck the box next to *Header on* or *Footer on*.

    +   4. Finally, click **OK**, and it’ll be bye-bye header or footer.


    # Creating a Header-less (or Footer-less) Cover or Title Page


    You can see how easy it is to add and remove headers and footers, but sometimes
    you might merely want to remove a header or footer from just your top (or first)
    page. Although this seems as if it would be a very easy thing to do, figuring
    out how to do it can be rather challenging. Fortunately, I’ve done the figuring
    out for you, so here’s all you need to do:


    +   1. Click anywhere in the first page of your document.

    +   2. Next, select **Stylist** in the **Format** menu.'
