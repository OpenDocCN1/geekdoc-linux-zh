- pgno: 133
  md: '# Project 7D: Changing the Look of Your System


    You’ve just seen how you can have a bit of fun with your system by changing the
    fonts it uses for everyday system-related display tasks. Of course, when it comes
    to fonts, the choices you make are not just based on your individual sense of
    aesthetics; you also have to consider readability. Some fonts look really cool,
    to be sure, but if you can’t read anything when you use those fonts, there isn’t
    much point bothering. When it comes to customizing the components that give your
    system its distinctive look, however, you can really let loose and get wild.


    While it is possible to customize the looks of both Windows and Macintosh OS X,
    in my opinion the options available to you there are actually quite limited. In
    Xandros, and most other Linux distros, however, you can happily and freely go
    absolutely berserk. In Xandros, not only can you change the colors of the various
    components of your system, but you can also even change the window decorations
    and control themes to such an extent that you practically won’t be able to recognize
    your system by the time you’ve finished.


    # 7D-1: Changing Window Borders


    The most immediately gratifying graphical customization you can make is to the
    window borders that surround the various system and application windows you use
    every day. It is also one of the easiest things you can do. Just follow along
    with these steps:


    +   1.  Click **Display** in the left pane of the Control Center window.

    +   2.  In the list of subcategories that appears, click **Window Decorations**.

    +       As you can see in Figure 7-9, the module display consists of a sample
    of the window decoration currently selected (Plastik is the default), and directly
    above that, a drop-down menu button that you can use to browse and select from
    among the various window decorations available.

    +   3.  Click that drop-down menu button and select **Keramik**, which, although
    not one of my personal favorites, is pretty popular in the Linux world in general
    and (if nothing else other than that) strikingly different.

    +       Once you’ve made the selection, a sample of the Keramik window decoration
    will appear in the right pane of the Control Center window along with the various
    options available for that decoration below it. If you then click the **Apply**
    button, the border of the Control Center itself will be … well, Keramified (Figure
    7-10).'
  merge: -1
  img_proc: true
- pgno: 134
  md: '![](img/3badae5570de77b990135448f8a8a1cc_134_0.png)


    Figure 7-9: Changing window borders via the Control Center


    ![](img/3badae5570de77b990135448f8a8a1cc_134_1.png)


    Figure 7-10: The Keramik window-border decoration'
  merge: -1
  img_proc: true
- pgno: 135
  md: "# **7D-2: Changing Control Styles**\n\nOkay, so now that you've changed your\
    \ window borders, the next step is to change the control styles. Doing this will\
    \ change the looks of the various scroll bars, buttons, menus, and bevels that\
    \ make up the bulk of an application or system window.\n\n> **NOTE** *Changes\
    \ to the control-style themes will be fully realized only in KDE-based applications,\
    \ though fortuntately includes your system itself. There will be little or no\
    \ difference in the appearances of certain applications, such as OpenOffice.org\
    \ or RealPlayer.*\n\nTo bring about the change, here's what you have to do:\n\n\
    +   1.  Click **Style** beneath the Display heading within the left pane of the\
    \ Control Center window. The Style module will appear in the right pane of the\
    \ window, as you can see in Figure 7-11.\n\n![](img/3badae5570de77b990135448f8a8a1cc_135_0.png)\n\
    \n+   2.  Click the drop-down menu button below the words *Widget Style* and select\
    \ **Keramik**. \n+       3.  Once you have made the selection, click **Apply**,\
    \ and the changes will immediately take effect. The results can be seen in Figure\
    \ 7-12.\n\n# **7D-3: Doing a Bit of Coloring**\n\nSo now that we have some big\
    \ ol' chunky window borders and rather goopy semi-industrial-looking controls,\
    \ let's go for a total gaud-out by playing around with the colors of those elements.\
    \ To get started, click **Colors** beneath the Display heading in the left pane\
    \ of the Control Center window to bring up the Colors module display in the right\
    \ pane (Figure 7-12)."
  merge: -1
  img_proc: true
- pgno: 136
  md: '![](img/3badae5570de77b990135448f8a8a1cc_136_0.png)


    Figure 7-12: Changing the colors of your window borders and controls


    As with the module displays for Window Decorations and Styles, the Colors module
    display includes a previewer, though this time it is at the top of the pane, and
    a color-scheme selector (to the left just below the previewer). By clicking on
    the various items within the Color Scheme selector pane, you can see in the previewer
    the color changes that will take place with the scheme you have just selected.
    As you will notice, the default this time around is Keramik, which means that
    we have thus far created an all-Keramikk window interface theme. Of course, this
    is not what we ultimately intend to do, so go ahead and give the other Color Scheme
    choices a look-through before we move on. Be sure to try out Blue Slate and Solaris,
    because they are rather striking. Anyway, click Apply for at least a couple of
    these schemes so you can see what things really look like.


    # Creating an Original Color Scheme


    Assuming that we have now played around a bit, let’s get back to where we were.
    If you have changed to one of the other color schemes, as I suggested you do,
    go ahead and change things back to Keramik by clicking the Defaults and then Apply
    buttons.


    Once everything is back to relative normal, here’s what you need to do:


    +   1.  In the previewer at the top of the right pane, click the blue area just
    to the right of, but not directly on, the words *Active Window*.

    +   2.  The drop-down menu button in the Widget Color section at the right side
    of the pane should then say *Active Title Bar*. If it does, click the color button
    directly below that menu button (Figure 7-13).'
