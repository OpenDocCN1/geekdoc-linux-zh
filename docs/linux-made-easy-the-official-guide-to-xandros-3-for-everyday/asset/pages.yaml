- pgno: 72
  md: '# 4


    # AN UNTANGLED WEB

    Setting Up Your Internet Connection


    ![](img/3badae5570de77b990135448f8a8a1cc_72_0.png)


    These days, average home-computer users spend more time at their computers surfing
    the Web and writing email messages than doing just about anything else. Even if
    you''re not much of a surfer, there are still numerous other applications that
    aren''t really Internet applications per se but that still make use of the Internet
    in some way in order to gather data. The Panel Weather applet, when accessing
    weather data, and Xandros File Manager, when gathering song and album information
    while ripping and encoding audio files, are good examples.


    That said, having a computer that isn''t hooked up to the Internet is like buying
    a new Maserati and then refusing to take it out of the garage.


    # Connections


    To get connected to the Internet, you must have the right hardware. There are
    a number of possibilities in this area, including high-speed local area networks
    (LANs), cable modems, and ADSL connections from phone companies.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Most computers also have an internal 56 Kbps modem or can be connected to external
    dial-up modems for slower connections over regular phone lines. Depending on what
    you''ve got, setting things up on your system should prove a cinch in the case
    of LAN connections and cable modems. It might be slightly more of a challenge
    in the case of dial-up connections.


    # ## High-Speed Connections


    If you have a high-speed Internet connection from your cable television company,
    or if you are connected to the Net by a *local area network* (LAN) at your office,
    you are really in luck, because these setups are probably the easiest to deal
    with. Most likely, all you have to do is connect the Ethernet cable from the wall
    (if you are using a LAN), or from your cable modem, to the port of the network
    card on your machine. After that, once you start up your machine you should be
    ready to go. If you have a high-speed connection from your phone company (ADSL),
    you will have to follow pretty much the same procedure as that for a dial-up modem,
    as explained later on in the chapter.


    **NOTE** *In case you''re not sure what an Ethernet cable looks like, it is a
    round cable, about one-eighth of an inch thick, with a plug at the end that looks
    like an oversized phone plug, as you can see in Figure 4-1.*


    ![](img/3badae5570de77b990135448f8a8a1cc_73_0.png)


    If you have a problem getting online, and you are trying to connect to the Net
    via a LAN or cable modem, the problem could very likely be that your network card
    is not supported by your system. This is relatively rare, but fortunately, easily
    remedied (by replacing it).


    The problem could also be that your network or service provider does not automatically
    assign addresses via *DHCP* (*Dynamic Host Configuration Protocol*). DHCP is a
    means by which your Internet provider can automatically (dynamically) provide
    your system with the configuration information it needs in order to connect to
    the Internet. If your provider does not utilize DHCP, you will have to get the
    necessary information about settings from the network administrator or service
    provider and enter them yourself.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Setting Up a Cable or Ethernet Connection for Providers Not Utilizing DHCP


    To input your cable or Ethernet settings yourself, run the Control Center (**Launch
    &rarr; Control Center**), and click **Network** in the left pane of the Control
    Center window when it appears. In the list of subcategories that then appears
    below that, click **Network Connection**. When the Network Connection module appears
    in the right pane of the window, click the **Administrator** button, and then
    type your root password when prompted to do so.


    The right pane of the Control Center will soon be outlined in red, and everything
    within it will be active, meaning that you can alter its contents. Click the **Interfaces**
    tab, and then, once in the new tab, make sure that **Enable Network** is selected,
    click **Specify Static Address**, and input the appropriate addresses as instructed
    by your network administrator or Internet provider (Figure 4-2). When you are
    finished, click **Apply**, and then close the Control Center window.


    ![](img/3badae5570de77b990135448f8a8a1cc_74_0.png)


    **Figure 4-2**: *Manually inputting network IP settings*


    > **NOTE** *If you are wondering what IP and DNS are all about, you can simply
    think of them in this way: the DNS translates the easy-to-remember URLs that you
    have come to know, such as www.yahoo.com, into numerical, or IP, addresses that
    the Internet can understand. The address http://www.yahoo.com thus becomes http://216.109.118.68.
    You can type the numerical version into your browser later to see for yourself.*'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Internal Dial-up Modems


    Many, if not most, of you are still using dial-up Internet connections, which
    means that you need to have a traditional dial-up modem to reach beyond your box
    to the outside world. These modems, in case you’ve forgotten, are those wonderful
    machines that whistle, chime, screech, and spit whenever you dial up your Internet
    provider. I suppose you could think of them as noisy telephones in need of a good
    burp.


    The biggest drawback to dealing with modems in Linux is that very few modems are
    supported. On the positive side of things, though, once you do find a modem that
    works, it is relatively easy to set up. The main reason behind this compatibility
    problem is that most built-in modems are software dependent, and the software
    they depend on is part of, or designed for, Windows. Such modems are thus called
    Winmodems.


    Of course, the Linux community has been working on ways to deal with these Winmodem
    beasts so that they will work with Linux systems. Though support for the wide
    variety of Winmodem models out there is still rather spotty, the Xandros Connection
    Wizard does a pretty good job of trying to get yours to work. If you are not sure
    what kind of modem you have installed, my advice would be to go through the Internet
    connection setup process to see whether or not your modem works with Xandros.
    If it doesn’t, you can replace the modem with one that is known to work, preferably
    a true-hardware modem. Hardware modems, in case you are not familiar with the
    term, are modems that are not software dependent and thus work with whatever system
    you happen to use them. You can think of them as telephones without a handset.


    Probably the best way to find out which modems do work with Xandros is to check
    out the Xandros hardware-compatibility database (http://support.xandros.com/hclv3)
    or go to Xandros User Forums (http://forums.xandros.com) and ask for suggestions.
    The US Robotics models 56K V.92 Performance Pro Modem (internal slot) and 56 PC
    Card Modem (PC card slot, for laptops) are both true-hardware modems that are
    easily available and said to work. You can check out the US Robotics site (www.usr.com)
    for more information on these models.


    > **WARNING**

    > When purchasing a modem, beware of generic, no-name internal modems that say
    they are Linux-compatible. Check out the Internet first to verify such a claim.
    Sometimes such modems are only compatible after you do all sorts of dreadful things
    to your system that even a hardcore Linux geek wouldn’t want to bother with. A
    cute little Tux icon on the box doesn’t necessarily mean that the modem is Linux-friendly.


    # External Dial-up Modems


    If you find that the dial-up modem you have does not work with your Xandros system,
    the best solution is to buy an external serial modem. An external modem sits in
    a box outside your computer, and it connects to the serial port in the back of
    the computer, which is the one that looks like a'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'hole with little prongs in it (see Figure 4-3). Because the modem doesn’t use
    your operating system to operate, it does not tie up system resources while it’s
    busy, which may result in a possible pick up in computer speed.


    ![](img/3badae5570de77b990135448f8a8a1cc_76_0.png)


    *Figure 4-3: Serial port and connector*


    Most external serial modems should work with your system, or at least that is
    what most people will tell you. If you are worried and are looking for a sure
    thing, Zoom Telephonics (www.zoom.com) makes an external serial modem that is
    compatible with Linux, and they say so right on their site. The US Robotics 56K
    V.92 External Faxmodem is also said to work, though I haven’t tried out this model
    myself.


    If you find another model that you think will do the trick, before you commit
    to it by slapping down the cash, do a Yahoo or Google search with that modem’s
    make and model number, along with the word “Linux,” and see what search results
    you get. Of course, you can also try out one of the Linux forums and ask about
    the modem make and model there. There are a lot of people in the same boat as
    you, so you are sure to get plenty of opinions and advice.


    # ### Setting Up a Dial-up or ADSL Connection


    If you are going to use an external modem (ADSL or dial-up), first power down
    your computer, connect the modem to the computer and the phone line, power on
    the modem, and then restart your computer. Once your computer is up and running
    again, you will have to set things up so that your modem can communicate with
    your Internet provider. This is pretty easy to do, and through this process you
    can also make sure that your modem, especially in the case of dial-up modems,
    actually works with your system.


    To do this, you will use the Xandros Connection Wizard, which you can access by
    going to the Launch menu and selecting **Applications ▶ Internet ▶ Connection
    Wizard**. The steps of the wizard are pretty much self-explanatory, but I will
    point out a couple of steps that might be puzzling or at least unfamiliar to you.


    The first page of the wizard (Figure 4-4) is quite simple, because it merely asks
    you what type of connection you are trying to configure. You can configure a connection
    for more than one type of device, so if, for example, you have a laptop computer
    that you haul back and forth between home and work, this might be of great interest
    to you. Just be sure to configure the connection'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'for the type of device you are connected to at the time, and then run the wizard
    again later when you are connected to the other device. Once you have made your
    selection, click **Next**.


    ![](img/3badae5570de77b990135448f8a8a1cc_77_0.png)


    The next page of the wizard (Figure 4-5) is another area that might be unfamiliar
    to you. In this page, you will be asked which users will be allowed to use the
    connection service you are configuring. If you are the only person using your
    computer, or if you want everyone who is using your computer to be able to access
    the Internet, accept the default **All users**. If you want to allow yourself,
    but nobody else, Internet access, select **User**. If you want to allow some users
    to have access and others not (such as access for you, your spouse, and oldest
    kids, but not the real young''ns), click **Selected group** (you can set up the
    details later). Once you have made your selection, click **Next**.


    If you are trying to set things up using a Winmodem, the next page of the wizard
    warrants a special mention (if you''re not working with a Winmodem, you won''t
    even see this page). The Connection Wizard will check to see what kind of modem
    you have connected to your machine. It will then display the results of that search
    in the next page of the wizard, next to the word **Device** (Figure 4-6). You
    can just click **Next** unless you also see a list of drivers in the bottom pane
    of the wizard window (next to the word **Driver**). If you see drivers listed,
    select one of them (and just take a guess if you''re not sure which one to use),
    and then click the **Load button**. In this case, the wizard will test the driver
    you selected. If it works, the wizard will tell you so in a pop-up window. Then
    you can click **OK** to close that window. If it doesn''t work, go back and try
    one of the other drivers. Once you find a combo that works, click **Next**. If
    nothing works... well, it''s time to do some shopping.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '![](img/3badae5570de77b990135448f8a8a1cc_78_0.png)


    Figure 4-5: Deciding who will be able to use your Internet connection in the Connection
    Wizard


    ![](img/3badae5570de77b990135448f8a8a1cc_78_1.png)


    Figure 4-6: Choosing a driver for your Winmodem


    The rest of the wizard will be easy enough to figure out. Just be sure to have
    the account information you received from your Internet provider in hand as you
    proceed. Once you come to the final page of the wizard and'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'click the **Finish** button, the Connect to the Internet window (Figure 4-7)
    will appear. This is the same window that will appear any time you choose to connect
    to the Internet in the future.


    ![](img/3badae5570de77b990135448f8a8a1cc_79_0.png)


    # Changing Your Dial-up Connection Settings from Pulse to Tone Dialing


    There are two ways in which telephones transmit the numbers you dial when you
    try to call someone. The most common these days is tone dialing, which transmits
    the phone number you dial by means of tones. When you frequently dial a certain
    number, you probably have noticed that the number seems to have a distinct tune,
    which in fact it does. You might even have caught a mis dial at times when dialing
    a number because the tune for that phone number sounded wrong.


    The other, increasingly less common, phone number transmission protocol is *pulse*
    dialing, which transmits the phone number you dial by means of pulses, one pulse
    for a 1, two pulses for a 2, and so on. If you have pulse dialing on your line,
    you will probably know it, because you can hear the pulses, or clicks, when you
    dial.


    When you set up an Internet dial-up connection via the Connection Wizard, things
    are automatically set up for tone dialing. If you happen to have a line that requires
    pulse dialing, you will have to make a simple modification. To do this, open the
    Connect to the Internet window (Launch * Applications * Internet * Connect to
    the Internet), and click the **Properties** button. When the Properties window
    appears, click the **Protocol and Hardware** tab, and then click the **Properties**
    button in that tab.


    In that Properties window, click the **Commands** tab, and then click directly
    on the word **ATDT** (to the right of *Dial*). The area directly surrounding the
    word will then transform into a text-input box, as you can see in Figure 4-8.
    In that box, change the current entry, **ATDT**, to **ATDP** (the last letter
    in “ATDT” is either T for tone or P for pulse), and then click **OK** in both
    of the open properties windows. After that, you’ll be ready to go.


    # Connecting and Disconnecting Dial-up Connections


    To get connected to the Internet via your dial-up connection, go to the Launch
    menu and select Applications * Internet * Connect to the Internet. After double-checking
    that your modem is on (if it is an external modem),'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'click **Connect** when the Connect to the Internet window appears. A small
    window, Figure 4-9, will then appear and show you what''s going on while your
    modem goes through its dreadful routine of making spitting, hissing, and churning
    noises until you are finally up, running, and ready to surf. You will know that
    you have established an Internet connection when your Connect to the Internet
    window automatically minimizes. It will continue to be accessible in the Panel.


    ![](img/3badae5570de77b990135448f8a8a1cc_80_0.png)


    *Figure 4-8: Changing your dialup connection settings from tone to pulse dialing*


    ![](img/3badae5570de77b990135448f8a8a1cc_80_1.png)


    *Figure 4-9: The Connect to the Internet window shows what''s going on as it tries
    to connect*


    Once you are done surfing around, you can disconnect from the Internet quite easily
    by clicking on the minimized **Connect to the Internet** window in the Panel and
    then, when the window bloats back up to its original size, clicking **Disconnect**.
    You can then click **Quit** in the Connect to Internet window to finish things
    off.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# An Untethered Connection—Wireless


    The great thing about laptop computers when they first came out was that they
    freed people from their desks. People could do whatever they needed or wanted
    to do on their computer wherever they wanted. As a cross-legged-on-the-floor kind
    of guy, it was really great for me, as I could prop my laptop down right there
    on the floor in front of the TV, and then sit there writing and gaming while playing
    Wall Street for the twentieth time on my VCR. Yes, everything was great, but then
    came the Internet. Laptops suddenly became tethered to telephone lines and Ethernet
    cables.


    Fortunately, laptops have unleashed again as the computer world goes wireless.
    With the right wireless hardware, you can now use your computer just about anywhere
    you can catch a wave, so to speak. Whether you happen to be at your breakfast
    table, on your backyard deck, in the library of your university, or at your local
    Starbucks, you can now go online without having to physically hook up your computer
    to anything.


    # Do I Need to Go Wireless?


    Whether or not you should join the fray and go wireless is still primarily a question
    of personal choice or individual needs. For example, if you don''t have a laptop,
    you will have a hard time of it, as Linux support for desktop wireless hardware
    is not really ready for prime time. If, on the other hand, you have a laptop that
    you would like to prop down on the dining room table and use during dinner (married
    readers beware), or while sitting in the Santa Fe depot in San Diego waiting for
    your train to L.A., or while sitting in your hotel room looking for things to
    do during your vacation in Seattle, or just while sitting on your front porch
    taking in a bit of sun, then why not go for it? Whether you are ready to commit,
    still considering, or just plain curious, read on.


    # Wi-Fi


    To get up to speed in the wireless world, you should first be aware of the three
    wireless protocols commonly in use today: 802.11a, 802.11b, and 802.11g, which
    are collectively referred to as Wi-Fi (wireless fidelity). In case you are wondering,
    a protocol is basically a data-transmission format that has been generally agreed
    upon, in this case by the IEEE (Institute of Electrical and Electronics Engineers).
    Of these three 802.11 protocols, average home users need only concern themselves
    with 802.11b and 802.11g, because the hardware for these protocols is considerably
    less expensive than that for 802.11a, which is primarily used in large office
    environments.


    The faster of the two protocols is 802.11g, which has a transmission speed of
    54 Mbps; the 802.11b''s speed is 11 Mbps. Linux support for 802.11g wireless cards,
    however, is still developmental at best, which means that you had better stick
    to the 802.11b protocol when selecting a wireless card. Although this may sound
    like an undesirable limitation, it is pretty much'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'irrelevant in the real-world scheme of things because the speed of your Internet
    connection is still most likely to be slower than the capabilities of your 802.11b
    hardware. . . .


    First of all, the 802.11b protocol is still more commonly used than the newer
    802.11g. Most public wireless access areas (hot spots), such as airports, university
    campuses, and hotels, still use the 802.11g protocol. Even if the 802.11g protocol
    is used in such places, or even if someone in your family has a 802.11g-based
    system set up and running in your house, you can still connect to the Net with
    your 802.11b network card, because the two protocols are compatible, which means
    that you can use a 802.11b with a 802.11g WAP and vice versa (not so for the 802.11a,
    however).


    Finally, the somewhat lower speed of the 802.11b devices will most likely matter
    very little to you unless you are forking out an awful lot of money to your Internet
    provider each month for some extreme bandwidth. After all, the average transmission
    speed of most home cable Internet connections is still less than the 11 Mbps speed
    of 802.11b, so don''t fret too much. Just remember that a traditional dial-up
    telephone modem has a maximum transmission speed of 56 Kbps, or 56 *thousand*
    bits per second, though such speeds are rarely achieved in reality; 11 Mbps is
    11 *million* bits per second. That is plenty fast for the average mortal.


    # Hardware


    To create your own home Wi-Fi setup, you need at least two pieces of hardware:
    a *wireless access point* (WAP) and a *wireless network interface card* (NIC)
    that goes inside your computer, both of which you can see in Figure 4-10. These
    two devices act like a pair of transceivers, communicating with each other via
    radio signals rather than over a wired connection. The WAP transmits data it receives
    from the Internet source device (such as your cable or ADSL modem) to the computer
    and receives data transmitted by the NIC that''s inside the computer. The NIC,
    for its part, receives transmitted data from the WAP and transmits data from the
    computer back to the WAP.


    ![](img/3badae5570de77b990135448f8a8a1cc_82_0.png)


    Figure 4-10: All you need for a Wi-Fi setup—an access point and a network interface
    card'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'The basic differences between a wired and wireless Internet connection setup
    can be seen in Figure 4-11. In the typical wired setup, a cable from your high-speed
    Internet source device is directly connected to your computer by an Ethernet cable.
    If you are using a cable modem, for example, you would have an Ethernet cable
    going from your cable modem directly into the Ethernet port of your computer.
    It''s very straightforward and simple. In a Wi-Fi setup, you are basically replacing
    that direct-Ethernet-cable connection with radio signals. The Ethernet cable from
    your Internet source device is in this case directly connected to the wireless
    access point, rather than to your computer.


    ![](img/3badae5570de77b990135448f8a8a1cc_83_0.png)


    Figure 4-11: Wired and wireless Internet connections compared


    What is connected to your computer is the wireless NIC. This is most frequently
    a PC card that you plug into one of the PCI/PCIA ports on your laptop (or into
    a special adapter on desktops). The NIC and access point then communicate with
    each other via radio waves rather than a hard-wire connection—a sort of virtual
    wire, if you like.


    # ## Wireless Access Points


    If you want to set up a wireless system in your home or office, then the first
    thing you will need to get is a WAP. Fortunately, Linux compatibility is not really
    much of an issue in this department, because the access point doesn''t physically
    interface with your computer. In addition, because the 802.11b and 802.11g protocols
    are compatible with each other, it doesn''t really matter what type of access
    point you use. This is not to say that you needn''t pay attention to what you
    are getting, because there is one type of wireless access point you will want
    to avoid.


    While whatever wireless access point you use should work right out of the box
    without the need for any special settings, there are a number of settings that
    you might want to consider, especially for reasons of security. You can usually
    input or change such settings by opening a web browser and then'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'typing in the IP address of the wireless access point, which is generally printed
    somewhere in the user''s manual. Once you do this, a web page will appear in which
    you can change or input the various settings available. You do not need to be
    connected to the Internet while doing this, however, as these settings pages are
    actually embedded within WAP itself.


    Unfortunately (for Linux users, anyway), there are a few WAPs that require you
    to use Internet Explorer to handle such browser-based settings. Because a Linux
    version of Internet Explorer does not exist, you will find yourself stuck unless
    you have a Mac or Windows machine somewhere else in the house to complete the
    job. Worse yet is the fact that some machines do not support browser-based settings
    at all. Instead, they require you to install special Windows software to do the
    job. When selecting hardware for your wireless setup, it is obviously best to
    stay clear of WAPs of this kind.


    # ## Wireless Network Interface Cards


    The other piece of hardware that you will need for your wireless setup is a wireless
    NIC, which is actually the only hardware you will need if you just want to go
    wireless when you are outside of your home. Because these cards plug directly
    into your system, you must find and use a card that is Linux-compatible. Xandros
    comes with several wireless drivers built in, so if you use a card that is compatible
    with one of those drivers, you will have smooth sailing.


    Most wireless NICs are PC cards that pop into the PCMClA slot at the side of your
    laptop computer (Figure 4-12). However, there are also NICs that plug into one
    of your machine''s USB ports or one of its PCI slots. Unfortunately, Linux support
    is still pretty much limited to NICs of the PC card variety, though there are
    other Linux wireless drivers available for those other NICs.


    ![](img/3badae5570de77b990135448f8a8a1cc_84_0.png)


    I don''t really recommend going this non-PCMClA NIC route, because doing so is
    not the simple slip-in-and-double-click procedure that it can be in other systems.
    Adding a driver to Linux usually involves much mucking around with the Linux kernel
    itself, which is a cumbersome and even daunting process, especially for a beginner.
    Most drivers eventually make their way into future releases of the Linux kernel,
    so for now I would strongly recommend sticking to hardware that is supported by
    the drivers that are included with your Xandros distro.


    If you already have an NIC, you can just try it out to see if it works by going
    through the setup steps in the following section. If you are going to go out and
    buy an NIC, or are thinking of doing so, and do not want to waste your hard-earned
    cash experimenting, you will want to check things out more'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'thoroughly. Before getting started, you should first check out the Xandros
    hardware compatibility database (http://support.xandros.com/hcl/3) or the Xandros
    User Forums (http://forums.xandros.com), where you can also find for suggestions.


    # **Setting Up Your Wireless Card**


    Setting up a Linux-compatible wireless PC card is actually relatively simple.
    It is probably best, though not essential, to first physically connect your WAP
    to your Internet source and then turn on the WAP. Once it is up and running, plug
    your wireless NIC into the PCMCIA slot on your computer. Any LEDs on the card
    might light up at this time. If not, they will do so after you finish configuring
    the card.


    Once your card is inserted into the machine, it is time to configure the system
    to deal with the card, which is all very easy. First open the **Control Center**
    via the Launch menu, and then, once it opens, click the + symbol next to **Network**.
    In the subcategories that then appear, click **Network Connection**. The Network
    Connection module will then appear in the right pane of the window. Click the
    **Administrator** button in that pane, type your root password when prompted to
    do so, and then, when the module reloads, click the **Interfaces** tab.


    Once in the Interfaces tab, make sure that **eth0 (Wireless Device)** is selected
    in the drop-down menu next to the words **Network Interface** (Figure 4-13). After
    that, click **Enable network**, and then select **Use dynamic address (DHCP)**
    or **Specify static address** (and input the appropriate settings), according
    to what your provider requires. When you are done with all that, click the **Apply**
    button. Your NIC should then be active and ready for action, so you can close
    the Control Center window now.


    ![](img/3badae5570de77b990135448f8a8a1cc_85_0.png)'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# ### Releasing and Renewing Your Wireless Connection


    There will be times when you want to turn your wireless card off, such as when
    you use your laptop on an airplane, or when you just want to flush the IP address
    in your Network settings (*release*) and update the settings with the IP address
    of a new network (*renew*), such as when you move your desktop from one wireless
    hotspot to another without rebooting your computer.


    This last point might seem a bit mysterious to you, so I will explain things briefly
    at this point: When you boot up your computer, your wireless card (NIC) performs
    a scan of available networks (WAPs) in order to see which one it can connect to.
    Once it finds a network, it gathers an IP address from that network via DHCP in
    order to allow you to access the Internet. Utilizing release and renew allows
    you to change WAPs without having to reboot your computer or when your machine,
    for whatever reason, just can’t seem to do so on its own.


    To turn off your wireless card or release the current IP address in your network
    settings, just follow these steps:


    +   1. Go to the Launch menu and select **Control Center**.

    +   2. Click the + icon next to Network, and then click **Network Connection**.

    +   3. When the Network Connection module appears in the right side of the Control
    Center window, click the **Administrators** button, type your root password when
    prompted to do so, and then click **OK**.

    +   4. Click the **Interfaces** tab.

    +   5. Once in that tab, uncheck the **Enable Network** box, and then click **Apply**.

    +   6. Click **OK** in the warning window that then appears to complete the process.


    The boxes in the DHCP part of the window will now be empty, meaning that you have
    successfully released your settings and disabled your card. If you would like
    to reactivate your card later on, or if you would just like to refresh the IP
    address settings now, you basically do a variation on the same theme: check the
    **Enable network** box, click the **Apply** button, and then click **OK** in the
    warning window.


    You can also release and renew your IP address by following steps 1–4, and then
    clicking the **Release** button. Once the boxes in the DHCP part of the window
    are empty, click the **Renew** button. When a new IP address appears in the DHCP
    part of the window, click the **Apply** button, and then click **OK** in the warning
    window that then appears.'
  merge: -1
  img_proc: true
