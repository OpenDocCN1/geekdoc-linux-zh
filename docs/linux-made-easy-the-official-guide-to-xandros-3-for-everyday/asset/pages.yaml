- pgno: 218
  md: '# # 12

    ## KEEPING TABS ON YOURSELF

    ### Working with Your PDA


    ![](img/3badae5570de77b990135448f8a8a1cc_218_0.png)


    When Apple Computer released the first personal digital assistant (PDA), the Newton
    MessagePad, back in 1993, then-CEO John Scully saw it as the wave of the future.
    As things turned out, Scully was right; PDAs (often called *hand-helds*) eventually
    became as popular as chocolates on Valentine’s Day. Only problem was that it wasn’t
    the Newton that put PDAs on the map in terms of popularity. Although decidedly
    cool, the ahead-of-its-time, overpriced, oversized, initially underpowered, and
    definitely not-yet-ready-for-prime-time Newtons were soon outshone by the smaller,
    cheaper, and arguably easier-to-use PalmPilots from 3Com (see comparison in Figure
    12-1). Yes, eventually it was a chicken-in-every-pot-and-a-PalmPilot-in-every-pocket
    sort of world, with the Newton, despite having improved significantly through
    time, ultimately going the way of the pet rock and the Betamax (yup, I had one
    of those too).


    Other makers would soon join in on the PDA boom by producing their own units,
    many of which are still being marketed today. These included series such as the
    Zaurus from Sharp, the CLIE from Sony, and the Visor'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'from Handspring. The PalmPilot, however, remains the king of the hill in the
    world of PDAs.


    ![](img/3badae5570de77b990135448f8a8a1cc_219_0.png)


    *Figure 12-1: An Apple Newton MessagePad and a PalmPilot*


    # ## But Can I Use My PDA with Xandros?


    A friend of mine, who was thinking of switching over to Linux, recently said that
    one of the things holding him back was the fact that he wouldn''t be able to use
    his PalmPilot if he were to make the switch. His reasoning was logical enough,
    as each PDA sold today comes with software that you can install on your computer
    to allow you to synchronize the data on your PDA with that on your computer. Such
    software disks contain Windows and usually Macintosh versions of the software,
    but nothing for Linux.


    So, no software, no go, right?


    Well, no. As I pointed out to my friend, that''s just the way it always is with
    Linux. No matter what hardware device you buy, there is almost never a Linux version
    of the software for that device included. Instead, and quite fortunately, everything
    you need to run the device is usually contained within the Linux distribution
    itself. Such is the case with Xandros when it comes to PDAs. Xandros allows you
    to work right out of the box, so to speak, with many Palm OS-based PDA models
    and series including


    +   - Handspring Visor and Treo

    +   - Sony CLIÉ

    +   - Samsung SCH 1300

    +   - Garmin iQue 3600

    +   - Palm M Series

    +   - Palm 1705

    +   - Palm Tungsten

    +   - Palm Zire'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# Project 12A: Setting Up Xandros to Work with Your PDA


    The key to setting up your system to work with your PDA is an application called
    *Palm Pilot Tool*. It doesn’t matter if your device is not a PalmPilot; as long
    as it is one of the models listed in the previous section (and that list could
    be larger by the time you read this), it will work. To get started, run the Palm
    Pilot Tool by heading over to the **Launch** menu and selecting **Applications
    ▶ Utilities ▶ Palm Pilot Tool**.


    The first time you do this, a window will appear telling you that the application
    (also known as *KPilot*) is not yet configured for use (Figure 12-2). Click the
    **Use Wizard** button to move on to configuring it.


    ![](img/3badae5570de77b990135448f8a8a1cc_220_0.png)


    At this point, the first page of the rather plain-looking configuration wizard
    will appear. Setting up your system to work with your PDA is actually a very simple
    procedure. Just follow these steps:


    +   1. Before you do anything else, connect your PDA to your computer and power
    up the device.


    +   2. Once your PDA is attached and powered up, you’ll have to teach your system
    to find the device. You can most easily do this by clicking the **Automatically
    Detect Handheld & User Name** button in the first page of the wizard (Figure 12-3).


    ![](img/3badae5570de77b990135448f8a8a1cc_220_1.png)'
  merge: -1
  img_proc: true
- pgno: 221
  md: '3. A small window will appear telling you to place your PDA in its cradle and
    press the HotSync button. Your PDA is already attached to the computer, either
    by cradle or direct USB connection, so you have already fulfilled the first of
    these directives.


    4. To fulfill the second directive in the message window, press the HotSync button
    on your PDA''s cradle, or if you prefer, or just don''t have a cradle, use your
    stylus to tap on the HotSync icon in your PDA''s home page (left side of Figure
    12-4), and then tap the HotSync icon again in the following screen (right side
    of Figure 12-4). Once you have done that, click the Continue button in the wizard''s
    message window.


    ![](img/3badae5570de77b990135448f8a8a1cc_221_0.png)


    *Figure 12-4: Starting HotSync on your PDA*


    5. The configuration wizard will then search your machine for a connected device,
    showing the progress of its search in a new window until it finds one. Once it
    does, click **OK** in that window (Figure 12-5).


    ![](img/3badae5570de77b990135448f8a8a1cc_221_1.png)


    *Figure 12-5: The setup wizard displays the progress of its hardware search*


    6. You will now find yourself back at the window where you started, but this time
    around, the information in the two text boxes will have been completed, reflecting
    the results of the wizard''s search (Figure 12-6). Click **Next** to proceed.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '![](img/3badae5570de77b990135448f8a8a1cc_222_0.png)


    Figure 12-6: Hardware and user settings for your PDA displayed in the configuration
    wizard window


    7. In the final page of the wizard (Figure 12-7), you are asked to choose the
    application you want to use for syncing purposes. Accept the default by clicking
    Finish.


    ![](img/3badae5570de77b990135448f8a8a1cc_222_1.png)


    Figure 12-7: The final page of the configuration wizard


    8. A small window will appear telling you that the process is complete. Click
    OK to close the window.


    The Palm Pilot Tool application window will then appear, and it will try to sync
    with your PDA. At this point, however, your PDA will probably already have given
    up trying to sync, so go back to your PDA and tap the HotSync button again with
    your stylus. The synchronization process will begin again, during which time the
    Palm Pilot Tool will show, in the right pane of the window, a log of what''s going
    on (Figure 12-8).'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'When the process is complete, you will see the words *HotSync Completed* near
    the end of the log file. There will also probably be another short string of messages
    after that saying that the Pilot device does not exist. You can ignore this last
    set of lines, as it is just the log of the Palm Pilot Tool giving another go at
    syncing while your PDA itself is already done doing any more synching for now.
    You can also go ahead and disconnect it.


    ![](img/3badae5570de77b990135448f8a8a1cc_223_0.png)


    *Figure 12-8: The Palm Pilot Tool shows a log of the HotSync process*


    # ## Syncing Forever After


    Once you have set up your PDA to work with Xandros, you can perform a HotSync
    at any time, using the steps you have just learned. To make these steps easier
    to follow for future reference, I’ll rehash and streamline them a bit here:


    +   1. Connect your PDA to your computer.

    +   2. Power up the PDA.

    +   3. Run the Palm Pilot Tool by going to the **Launch** menu and selecting *Applications*
    ➤ *Utilities* ➤ *Palm Pilot Tool*.

    +   4. Press the **HotSync** button on your PDA’s cradle or tap the **HotSync**
    icon on your PDA’s home screen and then again in the following screen.


    If for any reason your PDA and computer don’t sync, quit the Palm Pilot Tool (and
    its Panel applet), power down the PDA itself, and start over.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Personal Information Manager—Kontakt


    The Palm Pilot Tool is a handy application, but its real purpose is syncing. To
    add, edit, or delete data to later sync with your PDA, you should use the various
    KDE applications that are *conduits* to the categories of information on your
    PDA. This application group consists of Address Book, Organizer, KNotes, and (if
    your PDA does email) KMail.


    Of course, using this application and that application to check one thing or another
    can get to be quite the proverbial pain. Rather than bother with all those bits
    and pieces, you can use the *Personal Information Manager* application, also known
    as *Kontakt*, instead.


    Kontakt (Figure 12-9) acts as a centralized viewing and editing interface for
    the other four modules and also to one of the email applications on your system.
    KMail (which I won’t be covering because Thunderbird is so much better). It’s
    pretty good-looking to boot.


    ![](img/3badae5570de77b990135448f8a8a1cc_224_0.png)


    As you will see, Kontakt provides you with a Summary view of all the important
    information you have stored on your PDA or computer (yes, you can use Kontakt
    without having a PDA). It also warns you when birthdays and anniversaries are
    fast approaching, and it even tells you the weather conditions in as many cities
    as you set it up to show, though weather information is supplied by your Xandros
    system, not your PDA.


    You can also easily navigate to the various application modules to input and examine
    data by clicking the icons in the left pane of the window.


    # Setting Up the Kontakt Summary View Page


    Kontakt lets you customize the contents of its Summary View page. To add or remove
    categories from that page, go to the **Settings** menu and select **Configure
    Summary View**.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'The Configure window for the Summary View page (Figure 12-10) consists of two
    panes: a right pane, which shows the items that can actually appear in the Summary
    View page, and a left pane, which, when clicked, allows you to configure some
    of the displayed items. To add an item to the Summary View page, check the box
    next to the item you want to add. Conversely, you can delete an item from the
    Summary View page by unchecking the appropriate box.


    ![](img/3badae5570de77b990135448f8a8a1cc_225_0.png)


    *Figure 12-10: Configuring the Kontact Summary View page*


    I should mention at this point that one of the checked items in Figure 12-10,
    *Contacts*, may seem a bit bewildering, as it doesn''t seem to appear in the actual
    Summary View page.


    This was certainly the case for me. As I later discovered, however, Contact information
    is in fact displayed in that page in the form of Birthdays and Anniversaries,
    as this information is stored in the Address Book module, from which Contact information
    is gathered. This is the only information from the Address Book module that is
    displayed in the Summary View page.


    # Adjusting the Address Book Summary Display Settings


    If you click the second icon in the left pane of the Summary View Configure window
    (*Address Book Summary*), you can adjust some of the basic settings for the Contacts,
    or Address Book, display module. Basically, you have very few options here: whether
    or not to show birthdays and/or anniversaries and how many days in advance those
    events should be displayed.


    # Adjusting the Schedule Summary Display Settings


    To adjust the settings for the Schedule module of the Summary View page, click
    the *Schedule* icon in the left pane of the Configure window. From the settings
    that appear in the right pane of the window, you can decide how'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'many days of schedule information should be displayed on the Summary View page,
    and which Todos, all or just those for today, should be displayed in the Todos
    section of that page.


    # Setting Up the Weather Summary Display


    If you click the **Weather Service** icon in the left pane of the Configure window,
    you can set up the cities you want displayed in the Weather section of your Summary
    View page. You can do this via the right pane of the window by clicking the various  symbols
    in the subpane on the left until you reach the location you would like to add.
    Once you have found that location, click it once to select it, and then click
    the **Add** button.


    The location will then appear in the subpane on the right (Figure 12-11). For
    example, if you wanted to add Karachi to your list of weather stations, you would
    click  Asia  Pakistan  Karachi. You can, of course, add as many locations as you
    want to show up on the Summary View page.


    ![](img/3badae5570de77b990135448f8a8a1cc_226_0.png)


    # Using the Various Application Modules That Appear in Kontakt


    As I mentioned in the previous section, Kontakt is really just a centralized environment
    from which you can view and edit data in a number of otherwise stand-alone applications,
    each of which can be started on its own via the Launch menu. The Address Book,
    for example, can be opened by selecting Applications Accessories  Address Book.
    Because Kontakt allows you to conveniently use all of these applications in one
    place, however, I will focus on using these applications via that framework.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'The data in the various application modules in Kontact are all synced with
    that which you have on your PDA. When you input data into your PDA and then perform
    a HotSync, the data on your PDA will be copied to the respective application modules
    in Kontact. Conversely, when you input or edit data in one of Kontact''s application
    modules and then perform a HotSync, the data or changes will be copied to your
    PDA. All very handy.


    This does not mean, however, that you have to have a PDA in order to use Kontact
    or these modules. You will be happy to know that you can use all of them quite
    handily without ever joining the handheld fray.


    To view, edit, or add data to your address book, click the **Contacts** icon in
    the left pane of the Personal Information Manager (Kontact) window.


    When the Contacts module appears in the right pane of the window, you will see
    a list of your contacts; and if you click one of the entries in that list, a summary
    of the data you have saved for that entry will appear at the right side of the
    window (Figure 12-12).


    ![](img/3badae5570de77b990135448f8a8a1cc_227_0.png)


    To add a new entry to the address book, click the first icon in the horizontal
    icon bar below the menu bar, or select **New Contact** from the **File** menu.
    An Edit Contact window (Figure 12-13) will appear in which you can input all the
    data you have. If you would like to input birthday or anniversary information
    so that it will appear in the Summary View page, click the **Details** tab, and
    then, in that tab, enter the information in the appropriate boxes. When inputting
    birthday information, be sure to input the birth date (9-28-1958, for example),
    rather than the birthday (9-28).


    If you would like to edit the information for a contact already in your address
    book, just double-click that contact''s name from the list in the main page of
    the module, and the Edit Contact window for that entry will appear. Whether creating
    a new contact or editing the information for an existing contact, once you are
    finished, click the **OK** button.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '![](img/3badae5570de77b990135448f8a8a1cc_228_0.png)


    # Todo List


    The **Todo List** (Figure 12-14), as its name implies, is a simple list of reminders
    for things that you need to do. You can open the Todo List module by clicking
    the **Todo List** icon in the left pane of the Kontakt window.


    When the module appears in the right pane of the window, you can add a new Todo
    item by clicking directly in the box that says **To add a new Todo** in light
    gray letters. After that, just type your new Todo in that same box, and press
    ENTER when you are finished. The new item will then appear in the list of Todos
    below.


    If you look at the top of your actual Todo List, you will notice that it is divided
    into categories, such as *Summary*, *Recurse*, and *Categories*. You can do a
    bit of fine-tuning to your entry by right-clicking that entry below one of these
    categories and then choosing from the various options in the pop-up menu that
    appears (Figure 12-15).


    The options listed in the menu will vary according to the category you clicked.
    To access all of the entries in one go, double-click the entry, and an Edit window
    for that entry will appear. If you would like to delete an entry from your Todo
    List, just right-click that entry within the Summary column, and then select *Delete*
    in the pop-up menu. You can also add new Todos or even sub-Todos from the same
    menu.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '![](img/3badae5570de77b990135448f8a8a1cc_229_0.png)


    Figure 12-14: The ToDo List module


    ![](img/3badae5570de77b990135448f8a8a1cc_229_1.png)


    Figure 12-15: Fine-tuning a To-do List entry


    # Calendar


    Tied in with the To-do List to some extent, and sharing the same set of icon buttons
    in its interface, is the Calendar module (Figure 12-16), which you can open by
    clicking the **Calendar** icon in the left pane of the Kontakt window. You can
    view your calendar in one of many views by clicking the various view buttons below
    the menu bar (Figure 12-17).'
  merge: -1
  img_proc: true
- pgno: 230
  md: '![](img/3badae5570de77b990135448f8a8a1cc_230_0.png)


    Figure 12-16: The Calendar module


    ![](img/3badae5570de77b990135448f8a8a1cc_230_1.png)


    Figure 12-17: The Calendar view buttons in the Calendar module


    The views provided by these buttons, moving from left to right, are: *What''s
    Next*, which actually shows the next dated items in your Todo list; *List*, which
    shows the times on your schedule in list form; *Day*, which shows a calendar view
    for that day; *Work Week*, which shows your schedule for the entire work week;
    *Week*, which shows the view for one calendar week; *Next 3 Days*, which provides
    a three-day view of your schedule starting with the current day; *Month*, which
    provides a somewhat traditional one-month view of your calendar, starting with
    the current week; *Todo List*, which is the same list you dealt with in the previous
    section; and *Journal*, in which you can keep a diary journal or just jot down
    and read notes for any given day.


    # Adding or Editing an Event or Appointment to Your Calendar


    Adding an event or appointment to your calendar is quite simple, and there are
    many ways to go about it. The easiest of these, in my opinion, is to switch to
    one of the multiday views (Month view is always good), and double-click the day
    for which you want to make an entry. Upon doing this, a blank Edit Event window
    (Figure 12-18) will appear, in which you can provide the relevant details for
    the event. If you want to edit the details (such as the time or date) of an event
    you’ve already entered, you can do so by double-clicking that event in the calendar
    and then making the changes in the Edit Event window for that entry.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '![](img/3badae5570de77b990135448f8a8a1cc_231_0.png)


    Figure 12-18: Adding an event or appointment to your calendar


    # ## Making or Reading a Journal Entry


    If you would like to record your reflections or comments for a particular day,
    you can do so by creating a journal entry. You can do this by clicking the **Journal**
    view button and then clicking the date for which you want to create an entry in
    the calendar at the left part of the Calendar module.


    A blank area will then appear to the right, in which you can type away. If you
    would like to make entries for multiple, successive days, just highlight the days
    in question in the calendar on the left, and a corresponding number of blank boxes
    will appear to the right. You can then make entries into all or some of those
    boxes (Figure 12-19).


    ![](img/3badae5570de77b990135448f8a8a1cc_231_1.png)


    Figure 12-19: Making a journal entry'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Notes


    Clicking the last item, **Notes**, in the left pane of the Kontact window will
    bring up the Notes module (Figure 12-20).


    ![](img/3badae5570de77b990135448f8a8a1cc_232_0.png)


    Figure 12-20: *The Notes module in Kontact*


    To add a new note to the list, just click the icon below the **File** menu that
    looks like a pad of yellow Post-it’s (it’s the one at the bottom). In fact, if
    you run this module as a stand-alone application (*Launch » Accessories » Popup
    Notes*), these notes will actually appear scattered about your desktop in that
    Post-it-like form. You can also add a new note directly from the **File** menu
    by selecting **New Note**.


    Once you have chosen one of the two ways to create a new note, a small window
    will appear, in which you can give your note a title. Once you have done that,
    click **OK**, and another small window will appear in which you can write the
    note. Once you click **OK** in that window, the note will appear in the list within
    the main Kontact window. To delete a note from the list, just right-click the
    note you want to remove, and select **Delete** from the pop-up menu.


    # Installing Applications and Documents on Your PDA


    One of the cool things about PDAs is that they are not static, closed systems,
    as they allow you to install and use third-party applications. There is a vast
    number of such applications available, especially for Palm OS (Palm Operating
    System)-based devices, ranging from games and puzzles to spreadsheets, learning
    tools, and databases (see examples in Figure 12-21). You can even install text
    documents converted to PalmDOC format (more on how to do that later) that you
    can then read on your PDA.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '![](img/3badae5570de77b990135448f8a8a1cc_233_0.png)


    Figure 12-21: A third-party PDA spreadsheet application and solitaire game


    To install an application for use with a Palm OS-based device, you must first
    download it from the Internet to your computer. There are many sites with freeware,
    shareware, and for-sale applications for Palm OS–based devices, such as www.freewarepalm.com.
    Files from such sites are usually prepared as ZIP archives, so once you download
    them, you must first unzip, or extract, them using one of the methods you learned
    in Chapter 5. After that, you can easily install the applications, or other files,
    on your PDA using the Palm Pilot Tool.


    To do this, just follow these steps:


    +   1. Run the Palm Pilot Tool (**Launch** » **Applications** » **Utilities**
    » **Palm Pilot Tool**).

    +   2. Click the last item in the left pane of the Palm Pilot Tool window, **File
    Installer**.

    +   3. Next, click the **Add File** button in the right pane of the window, and
    in the **Open** window that then appears, locate and select your file.

    +   4. Once you’ve done that, click the **Open** button, after which the Open
    window will close. The file you selected will then appear in the right pane of
    the Palm Pilot Tool window (Figure 12-22). You can also add additional files before
    syncing with your PDA.


    Once all the files you want to install are visible in the Palm Pilot Tool window,
    you can install them by performing a HotSync with your PDA, as you learned to
    do earlier in the chapter. When the process is complete, the files will no longer
    be visible in the Palm Pilot Tool window.


    You should note that application files for Palm OS–based devices end with a .prc
    extension, while the database files required by some applications end in .pdb,
    which is the same extension used for text documents prepared in the PalmDOC format.
    Before installing, it is always a good idea to check the contents of the ZIP file
    for the application you are planning to install in order to see if there is a
    README file included. The README file should tell you what files to install on
    your PDA in order to ensure that the application runs as it should.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '![](img/3badae5570de77b990135448f8a8a1cc_234_0.png)


    # Converting Text Documents to PalmDOC Format


    As I mentioned in the previous section, you can also install text documents (ending
    in .txt), such as letters, reports, and even whole books, on your PDA. If you
    want to install a document that is not in text format, you must first save it
    as text. For example, if you wanted to install a really important email message
    you received from a colleague, you would first right-click the email message in
    your email application, select Save As in the pop-up menu, and then save it as
    yourfilename.txt.


    Once you have the text file you want to install, you are just about ready to install
    it. First, however, you must convert the document to PalmDOC format in order to
    use it on your PDA. Your Xandros system comes with a special utility to do just
    that: Palm Document Converter (Figure 12.23). To run Palm Document Converter,
    go to the Launch menu and select Applications ▸ Utilities ▸ Palm Document Converter.


    ![](img/3badae5570de77b990135448f8a8a1cc_234_1.png)'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'To use the Palm Document Converter, here’s what you need to do:


    +   Click the icon to the right side of the text box next to the words *Text file*.


    +   In the add file window that then appears, navigate to and select the text
    file you want to convert. Once you’ve done that, click **OK**, after which the
    window will close, and the path to the text file will appear in the previously
    empty upper text box.


    +   Next, type in the path to and a filename for the converted file you are about
    to save in the bottom text box. Be sure to add the extension `.pdb` to the end
    of the filename. For example, if you would like to convert a text file called
    RalstyMessage.txt to a PalmDOC format file by the same name and have it appear
    in your Home folder, you would type `/home/your_username/RalstyMessage.pdb`. Your
    window should then look something like mine in Figure 12-24.


    +   Once everything looks right, click the **Convert Text to PalmDOC** button,
    shortly after which a small window will appear telling you that the conversion
    was successful.


    ![](img/3badae5570de77b990135448f8a8a1cc_235_0.png)


    +   Finally, close that message window by clicking **OK**, and then close the
    Palm Document Converter window by clicking **Close**. Now you can install the
    new .pdb file on your PDA using the installation you learned in the previous section
    of this chapter.'
  merge: -1
  img_proc: true
