- pgno: 160
  md: 'If by any chance, New TuxBar suddenly appears in a new position on your desktop
    after you reload it, which it might do (and who knows why?), just drag it back
    to its original position. Unlike the other themes you''ve worked with thus far,
    the menu option for toggling the theme''s locked position in New TuxBar is inactive,
    so in order to drag it, you will have to hold down the ALT key while dragging.


    On, and one more thing . . . when using New TuxBar, you will probably notice that
    when the icon pop up in their enlarged state, they look rather fuzzy, which allows
    the icons to pop up more rapidly. Because your hardware may be fast enough to
    negate the need for that speed enhancement, you may be able to avoid the fuzziness
    without any problems in terms of pop-up speed. You can quite easily do this by
    right-clicking the TuxBar and deselecting Use fast image scaling in the pop-up
    menu. If, after doing this, you find the pop-up animation speed to be too slow,
    go back and select Use fast image scaling again.


    If you like New TuxBar, but would prefer that it load icons reflective of your
    needs as a Xandros user, you are in luck.


    I have a modified version (shown in Figure 8-21) available free for download via
    the website for this book (www.edgy-penguins.org/LME). Just click the link for
    the file on that page.


    ![](img/3badae5570de77b990135448f8a8a1cc_160_0.png)


    *Figure 8-21: A more Xandros-friendly TuxBar with a definite OS X-ish flair*


    The file comes in the form of a tarball, which includes not only the theme file
    itself but also a document explaining how I modified the file, in case you want
    to play around with things yourself. There is also a link on that page for a KDE
    theme, Aqua, which, used in conjunction with my modified version of New TuxBar,
    will give your desktop a very OS X–ish flair, albeit heavily muncaned in the flavor
    of Linux.


    # ## Using Xandros Networkso to Install Applications from CD (Deluxe and Business
    Edition Users Only)


    If you happen to have purchased the Xandros Deluxe or Business Editions, a good
    number of the applications available via the sources we''ve mentioned thus far
    are included with your Xandros system on the Application Disc that came along
    with your system installation disc. To view the contents of this CD and install
    the applications on it, slip the disc into your drive, and then go to the Edit
    menu in the XN application and select Set Application Sources. When the Set Application
    Sources window appears, check either CD-ROM drive 1 or CD-ROM drive 2, depending
    on how many drives you have and which one you''ve placed the CD in, and then uncheck
    all other items in that window. When done, click OK, and you''ll be ready to start
    browsing.'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'In later releases of the Deluxe and Business Editions, a separate window (Figure
    8-22) will automatically appear after you insert the disc labeled Application
    Disc in your drive. In that window you can check off the applications you wish
    to install, and then click **Install**. The Xandros Networks application will
    then start up, prompt you for your root password, and go on to install the items
    you chose.


    ![](img/3badae5570de77b990135448f8a8a1cc_161_0.png)


    # Updating Your System and Applications via Xandros Networks


    Xandros Networks not only allows you to download and install software, but also
    allows you to download and install updates when they are available. There are
    a couple of ways that you can check for updates. The easiest way is to simply
    look at the Xandros Update applet, right next to the volume controller on your
    desktop Panel.


    If everything is up-to-date, the icon will have a little green arrow on it. If
    you aren''t convinced, or just want to double-check, click the applet, and a Xandros
    Update Status window (Figure 8-23) will appear. In that window, click the **Check
    Now** button, and the results will be shown to you.


    Another way to go about checking is via the XN application window. In that window,
    click on **Application Updates** in the left pane. If any updates are available,
    they will be displayed in the right pane of that window, and they can be installed
    in the same way as the other applications you''ve installed so far in this chapter.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '![](img/3badae5570de77b990135448f8a8a1cc_162_0.png)


    Figure 8.23: Checking for updates via the Xandros Update Status Panel applet and
    window


    # Registering with Xandros Networks, and Why It Won’t Hurt You to Do So


    If you want to get even more out of Xandros Networks, it is worth your while to
    register. Now, I know registering seems like a big bother, but it’s not. Really.
    Registering with Xandros Networks is easy and doesn’t require any credit card
    information, if you’re concerned about that.


    What do you get for your efforts if you do register? Well, at the least you will
    have access to a few other choice applications that you can download and install
    for free. Nothing wrong with that, right? Of course, once you do register with
    Xandros Networks, you can also later purchase an XN Premium membership, which
    allows you to download a host of other cool stuff; purchase other commercial applications,
    such as CrossOver Office; or upgrade to the Deluxe Edition of Xandros, with which
    you can get the full shebang. Of course, these purchase options are strictly up
    to you—nobody is going to be knocking at your door (or inbox) demanding that you
    do so.


    Anyway, once you ready to register, here is how to go about it:


    +   1.  Click the + symbol next to Shop in the left pane of the Xandros Networks
    window.


    +   2.  When the list of categories appears below Shop, click My Account.


    +   3.  A Sign In page will then appear in the right pane of the window. Click
    Continue in the New Customer section to the right.


    A KWallet wizard will now appear (Figure 8-24).


    KWallet has no relation to Xandros Networks; it is a part of your system that
    allows you to store passwords and other information safely in an encrypted file.
    I am sort of paranoid about saving passwords on my computer, except for those
    accounts that really house little information about me, such as forums. If you
    want to sign up on KWallet, click Cancel. If you want to go ahead with it, click
    Next in this window and finish the very simple two-page wizard before moving on.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '![](img/3badae5570de77b990135448f8a8a1cc_163_0.png)


    Figure 8-24: The KWallet wizard


    +   4. Once you''ve bypassed or completed the KWallet formalities, fill out the
    form in the next registration page that appears in the right pane of the XN window
    (Figure 8-25).


    ![](img/3badae5570de77b990135448f8a8a1cc_163_1.png)


    Figure 8-25: Filling out the Xandros Networks registration form'
  merge: -1
  img_proc: true
- pgno: 164
  md: '+   5. When you’ve finished, click **Continue** at the bottom of the page.


    +   6. Assuming you filled in all the required information, the next page that
    appears in the right pane will tell you that your registration was successful.
    Click **Continue**.


    +   7. Finally, you will be presented with a summary of your account (Figure 8-26),
    basically showing you all the details you entered in step 4.


    ![](img/3badae5570de77b990135448f8a8a1cc_164_0.png)


    Figure 8-26: Filling out the Xandros Networks registration form


    You are now finished with the registration process. If you like, you can continue
