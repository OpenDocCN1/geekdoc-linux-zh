    Once the frame appears, you can move it to wherever you would like to place it
    by clicking anywhere within the frame (but not on its borders) and dragging. Just
    as with images (discussed earlier in this section), you can adjust a frame''s
    size by tugging on any of the green squares that appear on each of its borders
    and corners until the frame is the size you want.


    To type text in the frame, first deselect it by clicking anywhere on the page
    outside the frame itself. Once you''ve done that, the small green squares on the
    edges of the frame will disappear. You can then click within the frame (but not
    on its borders) and start typing. As I mentioned before, the frame is kind of
    a document within a document, so you can format the text (font, font size, font
    color, text justifications, and so on) within it as you would in any document.


    If you would like to go on to further adjust the frame''s attributes, such as
    eliminate or change the thickness of its border, select the frame by clicking
    its border (the green boxes at its edges will reappear), and then double-click
    within the frame itself, thus bringing back up the Frame window.


    # **Project 17A: Figuring Out What to Do with and How to Use a Spreadsheet**


    Next to the word processor, the second most coveted application in an office suite
    is its spreadsheet, which in OpenOffice.org is called *Calc* (Figure 17-15). Spreadsheets
    are extremely useful calculating and graphing tools, and many a person who has
    built up a certain expertise with such applications has founded a rather profitable
    career based on his or her abilities in that regard. Still, in all too many cases,
    spreadsheets go unused and forgotten, taking up valuable disk space and serving
    as much purpose as a pack of dried cherries tucked away inside one of your running
    shoes. Hmmmm... The reason for this neglect is very often that such users (or
    rather non-users, in this case) just can''t seem to find any practical reason
    to use a spreadsheet. This is logical enough, because spreadsheets are in fact
    nothing more than electronic ledger sheets, and as we all know, ledger sheets
    are something'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'used only in businesses. Well, what might be true for ledger sheets isn''t
    neces- sarily true of spreadsheets, because spreadsheets can be used to perform
    some pretty mundane, albeit important, everyday tasks. And I''m not just talking
    numbers here. For example, whenever I get a class schedule or class list here
    at work, that list is created with a spreadsheet. Ditto for the students'' grade
    transcripts.


    ![](img/3badae5570de77b990135448f8a8a1cc_359_0.png)


