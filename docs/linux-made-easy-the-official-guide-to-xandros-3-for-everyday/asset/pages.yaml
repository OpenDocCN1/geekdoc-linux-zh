  md: '![](img/3badae5570de77b990135448f8a8a1cc_423_0.png)


    Figure 19-19: Identifying the flag of a specified state or country


    # Project 19B: Creating a Kid-Friendly (and Kid-Safe) User Account


    So now you''ve installed a heap of applications for your little ones to use, but
    you still don''t feel quite safe leaving them alone at the helm of your computer.
    What if they screw up something? What if they start viewing web pages that might
    corrupt their tender young minds? And what if they dump some of your files? The
    list of possible nighttime scenarios goes on and on.


    Well, the simple answer is to create a special user account just for them and
    then to customize it so that they can do only what you want them to do. Sound
    interesting? Here''s how to do it:


    +   1. Create a new user account for your children via the Control Center, as
    you learned to do in Chapter 7.


    +   2. Run Xandros Networks, type eyes in the text box, and then click Search.
    Once the results are displayed, click to install Eyes. After you''ve completed
    the installation, quit Xandros Networks. We''ll get back to Eyes in a moment.


    +   3. Log out of your own user account, and then log in to the new account you''ve
    just created for your children.


    Now comes the dramatic stuff:


    +   4. Change the desktop wallpaper, as you learned to do in Chapter 3, to something
    that might make your children feel at home—a picture of Tucker, the family dog,
    or maybe a scanned image of one of your children''s own drawings.


    +   5. Remove all of the desktop icons except for the Trash. Don''t worry, the
    icons are all just links, not the real thing, so no harm done.'
  merge: -1
  img_proc: true
- pgno: 424
  md: '6. Now, remove all of the items from the Panel by right-clicking each item
