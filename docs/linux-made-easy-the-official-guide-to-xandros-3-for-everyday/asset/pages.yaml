- pgno: 139
  md: '# ## Screen Savers


    You may already have noticed that when you leave your computer running unused
    and untouched for five minutes or so, the screen will go black, though it will
    return to life when you move your mouse or tap on your keyboard.


    This is not some glitch in your system causing your machine to act up—it is your
    screen saver snapping into service. Of course, usually when you think of a screen
    saver, you think of pretty pictures or geometric patterns dancing about your screen,
    so the idea of a blank-screen screen saver might come across as quite the dud.


    Fortunately, this blank-screen screen saver is just one of the many screen saver
    modules available to you on your system. There are actually close to a hundred
    different screen saver modules for you to choose from, including the perennial
    favorite, **Flying Toasters**.


    To access and select these modules, click **Screen Saver** beneath the Display
    heading in the left pane of the Control Center window.


    You will now be able to try out the various screen saver modules available to
    you in the right pane of the window (Figure 7-16) by selecting the module and
    then clicking **Test**. A sample will then appear in the small monitor at the
    right side of the window. When you find a module you would like to use, just click
    the **Apply** button.


    ![](img/3badae5570de77b990135448f8a8a1cc_139_0.png)


    You can also decide when you want your screen saver to kick in by adjusting the
    Start Automatically settings, the default setting for which is five minutes of
    nonuse. Many screen saver modules also allow you to configure them individually,
    but the nature of the configuration options depends on the module in question.
    For example, in the case of Flying Toasters, you'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'can choose the animation speed, the number of toasters, the number of slices
    of flying toast, and even the look of the toasters themselves.


    To make changes of this sort, select the module in question, and then click **Setup**.
    A configuration window (**Figure 7-17**) will then appear. Once you have set things
    up the way you like, click the **OK** button in that window and then the **Apply**
    button in the Control Center window.


    ![](img/3badae5570de77b990135448f8a8a1cc_140_0.png)


    *Figure 7-17: Configuring a screen saver module*


    # ## Enabling Auto-Login


    I mentioned earlier in the book that it is possible to set up your system so that
    you won’t have to type your user password when you log in each and every time
    you start up Macintosh. If you are the only one using in machine, and are in an
    environment where no one else has access to your machine, this might not be a
    bad idea.


    If you want to set things up this way, here’s all you need to do:


    +   1. Click **System Administration** in the left pane of the Control Center
    window.

    +   2. In the subcategories that appear below System Administration, click **Login
    Manager**.

    +   3. When the Login Manager module appears in the right pane of the window,
    click the **Administrator** button at the bottom of the window, type your root
    password when prompted to do so, and then click **OK** in that password window.

    +   4. Once in root mode, click the **Convenience** tab in the right pane of the
    Control Center window.

    +   5. In that page, check **Enable auto-login**. Your window should then look
    something like mine in Figure 7-18.

    +   6. If everything in your window looks hunky-dory, click **Apply**, and the
    deal will then be sealed. Good-bye, login password!'
  merge: -1
  img_proc: true
- pgno: 141
  md: '![](img/3badae5570de77b990135448f8a8a1cc_141_0.png)


    # ## Configuring User Accounts


    In Project 7A, you learned how to set up additional user accounts, a pretty easy
    endeavor, all things told. There are, however, a few settings you can apply to
    those user accounts that might be of interest of you. In order to access these
    features, you must first open the **User Accounts** module by clicking **System
    Administration** in the left pane of the Control Center window, and then clicking
    **User Manager**. When the User Manager module appears in the right pane of the
    window, click the **Administrator** button at the bottom of the window, and then
    supply your root password when prompted to do so. You will then be ready to perform
    either of the settings changes I will now describe.


    # ### Limiting Login Availability


    One of these settings that you might find handy is limiting the time and/or days
    that a user can log in to the system. For example, let’s say that you don’t want
    your kids playing around with the computer when you are at work or when they should
    be doing their homework . . . or playing outside to get some exercise.


    To set things up in this way, just follow these steps:


    +   1. Select the username of the user for whom you wish to limit access in the
    User Manager module (by clicking on that user’s name once), and then click **Properties**.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '+   In the **User Properties** window that appears, click the **Account** tab.


    +   Once in that tab, click the checkbox next to the words *Only allow user to
    login between*.


    +   Now set the times and days that you want the user in question to have access
    to your computer. When done, your window should look something like that in Figure
    7-19.


    ![](img/3badae5570de77b990135448f8a8a1cc_142_0.png)


    +   Once you have finished, click **OK** to close that window, and then click
    **Apply** in the Control Center window.


    # Locking an Account


    You can also just lock an account, thus prohibiting a given user from accessing
    your computer until you wish to allow them to use it again. For example, you might
    want to make sure that your daughter finishes that essay that is due next week,
    and so until she does you don''t want her to be playing around on the Internet.
    You can block her account from the same **Account** tab mentioned in the previous
    section. Click your username before opening the User Properties window, and then
    click the checkbox next to the words *Lock User Account*. Of course, when you
    are ready to provide access again, just uncheck the box, and all will be back
    to normal.


    # Dual-Booters: Changing the Default Operating System on Boot-Up


    If you have a Xandros/Windows dual-boot setup, you no doubt already know that
    when you start up your machine, you are given the choice of which operating system
    to boot up. The default system in such a setup is Xandros, which means that if
    you make no choice at the time, your machine will automatically boot up into Xandros,
    but you will have to use your cursor and ENTER keys to select Windows.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'If you would prefer to have Windows as the default boot-up system, you can
    do so in the Control Center window by following these steps:


    +   1. Click **System Administration** in the left pane of the Control Center
    window.


    +   2. In the subcategories that appear below System Administration, select **Boot
    Manager**.


    +   3. When the Boot Manager module appears in the right pane of the window, click
    the **Administrator** button at the bottom of the window, type your root password
    when prompted to do so, and then click **OK** in that password window.


    +   4. Once in root mode, click the drop-down menu button next to the words *Default
    operating system* (the button itself will be showing the version of Xandros you
    are using, such as *Xandros Desktop 3.0.1 OC*), and then select the version of
    Windows you are using in the drop-down menu (Figure 7-20).


    ![](img/3badae5570de77b990135448f8a8a1cc_143_0.png)


    *Figure 7-20: Changing the default operating system in dual-boot setups*


    +   5. If you would also like to decrease the default auto boot-up time (the time
    before the system automatically boots up when you do nothing—the default is 30
    seconds), adjust the numbers in the box to the right of the words *Automatically
    start default operating system after*.


    +   6. Once you have finished making the changes, click the **Apply** button,
    and then quit the Control Center.


    The next time you start up your machine, you will, as usual, see the boot-up screen;
    however, if you do not manually select Xandros at that time, your machine will
    automatically boot up into Windows.'
