- pgno: 238
  md: '# 13


    # SURF''S UP


    Internet Applications


    ![](img/3badae5570de77b990135448f8a8a1cc_238_0.png)


    Now that you’ve gotten your computer hooked up and online (we did it in Chapter
    4), let’s take a look at the various software tools you can use to take advantage
    of the situation. Xandros comes with a wide variety of Internet-oriented applications,
    with which you will be able to browse the Web, send and receive email, pass instant
    messages back and forth among your friends, and even make long-distance phone
    calls cost-free.


    # Surfing the Web with Firefox


    The web browser that comes bundled with Version 3 of Xandros Open Circulation
    (OC), Surfside, and later releases of all other editions is the new and highly
    popular offering from Mozilla.org called *Firefox*. Firefox is making great inroads
    not only in the Linux world but the Windows and Mac worlds as well. In addition
    to being faster than the other popular browsers out there today, Firefox includes
    such features as tabbed browsing, pop-up window blocking,'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'spyware prevention, and Live Bookmarks. Together, all of these help to make
    Firefox a really pleasurable browser to use. As Forbes Magazine put it, Firefox
    is “better than Internet Explorer by leaps and bounds.” Can’t beat that, eh?


    **NOTE** Firefox was not bundled with earlier releases of Xandros Standard, Deluxe,
    or Business Editions V3. If you are using either of those earlier releases but
    would like to join the fray, take advantage of Firefox’s new features, and follow
    along with the rest of this book, then download and install Firefox now via Xandros
    Networks.


    # ### Tabbed Browsing in Firefox


    One of Firefox’s nicest features is what is known as *tabbed browsing*. Tabbed
    browsing is not unique to Firefox. I admit, as it is a legacy carryover from its
    stablemate and immediate predecessor, the Mozilla browser—not to be confused with
    Mozilla.org, which is the creator of the two.


    Tabbed browsing is also available, albeit in something hidden form, in Apple’s
    Safari browser and is now even available for Microsoft Internet Explorer as an
    add-on, even though the MS people for years insisted it was a feature in which
    their users were not particularly interested.


    So what is tabbed browsing? Well, usually when you click a link in a web page,
    the new page opens in the same window as the one you were in. On some pages, links
    are coded so that the new page opens in a new, separate window, or maybe you occasionally
    opt for opening a link in a new window by right-clicking the link and then selecting
    the **Open Link in New Window** option. This can be very useful; once you have
    more than a few browser windows open at once, it gets sort of hard to find what
    you’re looking for in them. It can also slow things down a bit on more challenged
    hardware systems as well.


    This is where the tabbed browsing feature comes in handy. To see how it works,
    and to give Firefox’s built-in search function a try at the same time, let’s try
    it out right here and now.


    Open Firefox by clicking the **Firefox** launcher on the Panel (or from the **Launch**
    menu, by selecting **Applications ▸ Internet ▸ Mozilla Firefox**), and then type
    **nyckelharpa** next to the Google logo in the text box at the top-right corner
    of the window (Figure 13-1).


    ![](img/3badae5570de77b990135448f8a8a1cc_239_0.png)


    *Figure 13-1: Firefox’s built-in Google search box*


    Once you’ve typed that in, press **ENTER**, after which the results of your search
    will appear in a familiar Google search results page.


    In that page, right-click the top link (**ANA: The American Nyckelharpa Association**),
    and then in the pop-up menu, select **Open Link in New Tab** (see Figure 13-2).
    If it’s not the first link, just read down the search results until you come to
    it. You won’t have to look far.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '![](img/3badae5570de77b990135448f8a8a1cc_240_0.png)


    Figure 13-2: Opening a link in a new tab in Firefox


    After you have done this, the new page will appear in a new tab, and your original
    page of Google’s search results will still be there, ready and waiting in the
    other tab (see Figure 13-3).


    ![](img/3badae5570de77b990135448f8a8a1cc_240_1.png)


    Figure 13-3: A link opened in a new tab in Firefox


    I am pretty confident in saying that, once you get used to this feature, you will
    never miss your old browser.'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'By the way, if you aren''t all that keen on right-clicking and fiddling around
    with drop-down menus every time you want to take advantage of Firefox''s tabbed
    browsing function by opening a link in a new tab, you can achieve the same thing
    by clicking the link in question with *both* mouse buttons in unison.


    # ## More on Firefox''s Built-in Search Feature


    In the previous section, you performed a Google search using Firefox''s built-in
    Internet search feature. Well, Google is not the only search engine you can use
    by means of this feature. In fact, if you click the tiny arrow next to the Google
    logo in that search box, you will see a whole list of other sites from which you
    can perform searches (Figure 13-4).


    ![](img/3badae5570de77b990135448f8a8a1cc_241_0.png)


    Figure 13-4: *Firefox allows you to search for more than just websites*


    As you will notice, these sites include the traditional search engines, such as
    Google and Yahoo, as well as such sites as Amazon.com, eBay, and Dictionary.com.
    You can thus search not only for information or other websites via this handy
    feature, but also for books, goods, and the meaning of words.


    You will also notice an *Add Engines* item at the bottom of this menu. If you
    select that item, you will be directed to a page from which you can easily add
    still other engines. These include the ever-so-useful Wikipedia, Ask Jeeves, and
    IMDB (Internet Movie DataBase). You can add any or all of these (or the many others
    available from that site) to your search box list by clicking the link for the
    search plug-in that interests you. A small window will then appear. In that window,
    just click **OK**, and the plug-in for that search engine will be immediately
    added to your list.


    # ## In-page Searches


    Sometimes you might want to search for a particular word within a certain page.
    To do this in Firefox, go to the **Edit** menu and select **Find in This Page**,
    or press the CTRL and F keys in unison.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'What I have described so far is pretty much standard operating procedure in
    any browser, and you would probably expect a pop-up window to now appear in which
    to type the word you want to find. In Firefox, however, things are a tad different,
    and arguably more convenient, because instead of a search window, you will find
    a search bar at the bottom of the browser window (Figure 13-5).


    ![](img/3badae5570de77b990135448f8a8a1cc_242_0.png)


    # **Figure 13-5**: Performing in-page searches in Firefox


    In that bar you can type whatever word you want to find, and as you are typing,
    and without pressing another key or clicking another button, Firefox will identify
    and highlight (in green) the first instance of that word within the document.


    Another cool feature within the search bar is its highlight function. If you click
    the **Highlight** button in the lower search bar after typing in the word you’re
    searching for, all instances of that word within the entire page will be highlighted
    in yellow (Figure 13-6).


    ![](img/3badae5570de77b990135448f8a8a1cc_242_1.png)


    In the late 1960s and early 1970s, there were a few people (Tord Johansson, Erik
    Olsson, Karl Svenson, Lundin) who developed 4-row *nyckelharpa*. These are essentially
    of two different kinds. Olsson and Svenson simply added a 4th row of keys, stopping
    the low C(4) string on a modern chromatic *nyckelharpa* (left, picture), Johansson
    and his followers have invented the rows of the keys, so that the highest string
    is stopped by the 4th row of keys, and the lowest string by the top row of keys
    (right, picture). They also tune the 4 strings the same as a fiddle (G-D-A-E,
    from lowest to highest). This makes it easier for fiddle players to quickly pick
    up the *nyckelharpa*, as the fingerings are the same – leading some to call this
    *variant* the “tidlharpa”. Mechanically, it’s difficult to make a tangelo on the
    4th row just enough to produce good tone – it gets too long and gives too much,
    Johansson solved this problem by padding 2 rows underneath the strings, and 2
    rows above the strings. It looks complicated, but isn’t really. Despite these
    innovations, the 4-row *nyckelharpa* has failed to gain much popularity in Sweden
    during its first 30 years of existence. In contrast, the modern chromatic harpa
    was already the dominant form in use by 1955, 30 years after the innovation. Perhaps
    5% of the *nyckelharpa* players in Sweden today play the 4-row harpa.


    # **Figure 13-6**: Firefox can highlight every instance of the word you’re searching
    for with a single click of your mouse.


    When you want to de-highlight the words, simply click the **Highlight** button
    again, and voilà!'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# ## Firefox Popup Manager


    Firefox also has a handy feature called the *Popup Manager*, which blocks those
    annoying pop-up windows that appear when opening certain sites. When you come
    to a web page that shoots out one of those windows, Firefox will display a banner
    across the top of the page, telling you that it has prevented a pop-up window
    from opening (Figure 13-7).


    ![](img/3badae5570de77b990135448f8a8a1cc_243_0.png)


    Figure 13-7: Firefox lets you know when it has blocked a pop-up window


    It will also display a small icon with a red X in it at the bottom-right corner
    of the window (also shown in Figure 13-7). If you click either of these items,
    a pop-up menu will appear, from which you can tell Firefox to allow pop-ups from
    that site or tell it to let you view just the particular pop-up window in question.
    Of course, if you are happy with things the way they are and just want to leave
    the pop-up blocked, you can simply proceed as normal. You can close the top message
    (*Firefox prevented this site...* ) by clicking the red square with a white X
    in it. Needless to say, this is an extremely useful, effective, and welcome feature.


    # ### Live Bookmarks in Firefox


    Another cool feature in Firefox is *Live Bookmarks*. Live Bookmarks are essentially
    bookmarked collections of frequently updated items, such as for news headlines
    or blogs. Firefox already comes with one such Live Bookmark (*Latest Headlines*),
    configured for BBC News, in its Bookmarks Toolbar, which is the bottom-most toolbar
    of the three located at the top of the window. Every time you click that bookmark
    button, a list of the most recent news headlines from BBC will appear in a drop-down
    menu, and clicking one of the links in that menu will bring you to the page for
    that particular story (Figure 13-8).'
  merge: -1
  img_proc: true
- pgno: 244
  md: "![](img/3badae5570de77b990135448f8a8a1cc_244_0.png)\n\n# Adding Your Own Live\
    \ Bookmarks\n\nYou can, of course, add your own Live Bookmarks to Firefox for\
    \ your favorite news feeds or blogs. Most of the URLs for such updated feeds usually\
    \ contain rss somewhere in the address and end in .xml or .rdf, though you might\
    \ not always be able to see this ending. For example, the URL for Yahoo News is\
    \ http://news.yahoo.com/rss/topstories, while the URL for a Live Bookmark is http://rss.news.yahoo.com/rss/topstories.\
    \ To provide another example, to view Television Without Pity (a site that keeps\
    \ you up-to-date with your favorite TV shows) in your web browser, you would type\
    \ www.televisionwithoutpity.com, while you would use www.televisionwithoutpity.com/rss.xml\
    \ in order to set up a Live Bookmark for the site.\n\n> **NOTE**  \n> If you punch\
    \ either of the Live Bookmark URLs into your web browser, you will get a page\
    \ of code that will most likely be of little meaning to you. These URLs are instead\
    \ used only when setting up Live Bookmarks and are not intended for typical browsing.\n\
    \nIf you want to add a Live Bookmark for one of these feeds, here's what you should\
    \ do, and I'll use Yahoo News as my example:\n\n+   1. Go to the **Bookmarks**\
    \ menu, and select **Manage Bookmarks**."
  merge: -1
  img_proc: true
- pgno: 245
  md: "+   2. In the **Bookmarks Manager** window that appears, go to the **File**\
    \ menu and select **New Live Bookmark**.\n+   \n+   3. When the **Properties**\
    \ window for the new Live Bookmark appears, type **Yahoo! News** in the *Name*\
    \ box and **http://rss.news.yahoo.com/rss/topstories** in the *Feed Location*\
    \ box. Your Properties window should then look much like that in Figure 13-9.\
    \ If so, click **OK**.\n\n![](img/3badae5570de77b990135448f8a8a1cc_245_0.png)\n\
    \n*Figure 13-9: Setting up a Live Bookmark of your own*\n\n# Finding Feeds for\
    \ Live Bookmarks\n\nWell this is all very cool, but you are probably wondering\
    \ where you can find feeds that match your personal interests. A good place to\
    \ start is a site called Feedster. By going to Feedster's Feedfinder page (http://feedfinder.feedster.com),\
    \ you can type a keyword for the area you are interested in, and you will be presented\
    \ with a list of results showing all of the available feeds that are relevant\
    \ to your topic area.\n\nTo show you what to do then, let's use Chinese pop star\
    \ Faye Wong as an example. If you want to search for someone or something else,\
    \ feel free to make appropriate substitutions if you are going to follow along.\n\
    \nAnyway, here's what to do:\n\n+   1. Go to http://feedfinder.feedster.com.\n\
    +   2. Type **Faye Wong** in the *Feedfinder* search box, and then click the **Find\
    \ Feeds** button.\n+   3. In the page of results that appears, click one of the\
    \ links that sounds the most appropriate to you. When that page appears, there\
    \ will be a small orange icon in the bottom-right corner of the window (Figure\
    \ 13-10). The icon's appearance will vary according to the theme you are using.\n\
    \n![](img/3badae5570de77b990135448f8a8a1cc_245_1.png)\n\n*Figure 13-10: Firefox\
    \ lets you know when you can create a Live Bookmark for a site*"
  merge: -1
  img_proc: true
- pgno: 246
  md: '+   4. If the page seems to be what you are looking for, click that orange
    icon, and select **Subscribe to...** in the pop-up menu.


    +   5. In the Add Bookmark window, select the location where you would like the
    bookmark to appear. If you want it to appear in the Bookmarks menu, accept the
    default location (**Bookmarks**), but if you want it to appear in the Bookmarks
    Toolbar, change the location in the Create in box to Bookmarks Toolbar Folder
    (Figure 13-11).


    ![](img/3badae5570de77b990135448f8a8a1cc_246_0.png)


    +   6. Once you''ve made your decision, click **Add** to finish the job.


    # Managing Bookmarks


    Anyone who does a lot of web surfing ends up with numerous bookmarks for their
    favorite sites. Over time, however, you end up with so many that they become somewhat
    hard to manage. Perhaps you would find it helpful to group some of them together,
    or maybe you want to rename some so that they are easier to recognize, or maybe
    you would just like to delete some altogether. Well, you can do all of this via
    the *Bookmarks Manager* (Figure 13-12). To get started, open the Bookmarks Manager
    by going to the **Bookmarks** menu and selecting **Manage Bookmarks**.


    ![](img/3badae5570de77b990135448f8a8a1cc_246_1.png)'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# ## Grouping Bookmarks Together


    You can group bookmarks of a common theme together by creating a new folder and
    then placing all of the relevant bookmarks within it. For example, let''s say
    that you do a lot of online shopping and thus have numerous bookmarks for the
    sites with which you do business. In that case, you could create a new folder
    called Shopping and then drag all of your shopping sites into it. Here''s how
    to do it:


    +   1. Click the **New Folder** button.

    +   2. When the *Properties* window for the new folder appears, type **Shopping**
    in the *Name box*, and then click **OK**.

    +   3. Press the **CTRL** key, and then click each of the bookmarks related to
    online shopping in the right pane of the Bookmarks Manager window.

    +   4. Release the **CTRL** key, and then **click** but don''t release any one
    of the highlighted bookmarks in the right pane. Once you have done that, drag
    the bookmarks to the new **Shopping** folder in the left pane. Now you can release
    the mouse button.

    +   5. If you now go to the **Bookmarks** menu in the main Firefox window and
    select the **Shopping** folder in the left pane, you will see all of your shopping
    sites nicely arranged together in a pop-out submenu (Figure 13-13).


    ![](img/3badae5570de77b990135448f8a8a1cc_247_0.png)'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Moving a Bookmark or Group of Bookmarks to the Bookmarks Toolbar


    Sometimes, when you use a particular bookmark quite frequently, it is more convenient
    to have it located in the Bookmarks Toolbar than in the Bookmarks menu. In this
    way, your bookmark is always visible to you and thus only one mouse click away
    whenever you need it—no scrolling and searching through long menus.


    To add a bookmark to the Bookmarks Toolbar, find the bookmark you want to relocate
    in the right pane of the Bookmarks Manager window, and drag it to the **Bookmarks
    Toolbar** folder in the left pane. A perhaps even easier way of going about things
    is to click the icon at the very left end of the URL for the page you''re viewing,
    drag it to the **Bookmarks Toolbar**, and then release the mouse button. The bookmark
    will immediately appear in the toolbar.


    # Renaming a Bookmark or Bookmarks Folder


    Occasionally one of your bookmarks might be so named that it is impossible to
    find when you are looking for it. For example, my bookmark for Town and Country
    Real Estate appears merely as *Home Page*, which is pretty useless as is. To change
    this state of affairs, or any like it, find and click the file you want to rename
    in the right pane of the Bookmarks Manager window, or a folder in either pane,
    and then click the **Rename** button. You can then type the new name for the bookmark
    or folder in the *Name* box of the Properties window.


    # Deleting a Bookmark


    When a bookmark is no longer of use to you, and just sits there wasting space,
    you easily can delete it by clicking it once to select it, and then clicking the
    **Delete** button.


    # Saving and Transferring a Copy of Your Bookmarks


    Friends often ask me how they can save and transfer their bookmarks from one computer
    to another. Fortunately, this is easy to do once you know how. First, save the
    bookmarks on the original machine by going to Firefox''s *File* menu, selecting
    *Export*, and then in the Export bookmark file window, giving your collection
    of bookmarks a meaningful name in the *File name* box, such as **homebookmarks.html**.
    Just be sure to keep the .html extension when you do your renaming. Once you have
    done that, your bookmarks will saved as an HTML file, the same format as a web
    page.


    After you have saved your bookmarks, transfer the HTML file to the other machine
    by floppy, CD, flash drive, or whatever you prefer. Once it is in place in the
    other machine''s Home folder, open Firefox on that machine and then its Bookmarks
    Manager. Select *Import* from the *Manager* *File* menu. In the window that appears,
    select *From File* and click *Next*. You will then see an Import bookmark file
    window, and in that window, find your bookmark file. Click on it once to select
    it, and then click *Open*. Your old bookmarks will then be nicely in place on
    your other computer.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Firefox Themes


    An arguably less useful, albeit more fun, feature of Firefox is that it lets you
    change its appearance, to varying degrees, through the use of themes. As you can
    see in the samples shown in Figure 13-14 these themes may merely consist of a
    different set of buttons in the Navigation Toolbar or a more total and dramatic
    change in appearance incorporating changes in the buttons, sliders, and background
    color.


    ![](img/3badae5570de77b990135448f8a8a1cc_249_0.png)


    There is only one theme, called *Plastix Crystal SVG*, included with the copy
    of Firefox in your Xandros distro. If you would like to add a few more themes,
    however, here''s what you need to do: .


    +   1. Go to the Firefox **Tools** menu and select **Themes**.

    +   2. In the bottom-right corner of the Themes window that appears, click the
    **Get more themes** link. Mozilla''s Firefox Themes site will then appear in your
    browser.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '+   3.  On that page, click any of the themes listed, and a new page with a
    sample of that theme will open (Figure 13-15).


    ![](img/3badae5570de77b990135448f8a8a1cc_250_0.png)


    Figure 13-15: *Viewing samples of Firefox themes on the Web*


    +   4.  Once you find a theme you like, click the **Install Now** link on the
    sample page for that theme.


    +   5.  A confirmation window will appear. Just click **OK** in that window, and
    the download and the installation of the theme will begin.


    The progress of the download and installation process will be shown in the left
    side of the Themes window, which will suddenly reappear. Once the installation
    is complete, the name of the theme and an icon for it will replace the progress
    bar (Figure 13-16).


    ![](img/3badae5570de77b990135448f8a8a1cc_250_1.png)


    Figure 13-16: *Selecting themes from the Firefox Themes window*


    To use one of the themes you’ve installed, click the name of the theme in the
    left pane of the Themes window, click the **Use Theme** button, and then restart
    Firefox.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# The Xandros File Manager as an Internet Application?


    You may be surprised to discover that you actually have yet another web browser
    bundled with your system, and you will probably be even more surprised by what
    it is. Yes, the Xandros File Manager (XFM) that you learned to use in Chapters
    5 and 6 can also act as a web browser. If you find this hard to believe, go ahead
    and try it out yourself. Just type a URL in the `Address` box at the top of the
    XFM window, press `ENTER`, and there you have it (Figure 13-17).


    ![](img/3badae5570de77b990135448f8a8a1cc_251_0.png)


    Now, I should say that XFM’s role as a web browser does have its limita- tions,
    especially in regard to the availability of plug-ins, but it can come in handy
    for quick views of a certain page or for performing quick online searches, and
    so on. Play around with it, and see what you think. It should be pretty intuitive
    in terms of usage, so I won’t bog you down with redundant details.


    # Project 13A: Email with Thunderbird


    There are two email clients that come bundled with your Xandros system, but the
    one that is all the rage these days is Mozilla.org’s *Thunderbird*.


    Thunderbird, in terms of look and feel, is essentially very similar to Windows’
    Outlook Express, as you can see in Figure 13-18, but it’s actually much better.
    One of the reasons for this claim is that Thunderbird isn’t sus- ceptible to the
    myriad of viruses that perpetuate themselves in the Windows world via the Outlook
    and Outlook Express address books. It also has a built- in junk-mail filter that
    helps you cope with that most unwelcome variety of mail—spam. Like Firefox, Thunderbird
    also allows you to expand its versatility through the installation of various
    extensions. And if you want to dress it all up a bit, you can even change its
    appearance through the use of skins. All very cool!'
  merge: -1
  img_proc: true
- pgno: 252
  md: '![](img/3badae5570de77b990135448f8a8a1cc_252_0.png)


    **NOTE** *Thunderbird was not bundled with earlier releases of Xandros Standard
    or Deluxe Edition V3, so if you are a Thunderbird-less user of those releases
    and would like to download and install Thunderbird, you can easily do so via Xandros
    Networks.*


    # 13A-1: Setting Up an Email Account in Thunderbird


    When you first run Thunderbird, you will be presented with an *Account Wizard*
    (Figure 13-19), with which you can easily set up your email account. Here are
    the steps to do just that:


    +   1.  In the first page of the wizard, select **Email account**, and click **Next**.

    +       2.  In the second page of the wizard, type the name you would like to
    appear in the From field of your email messages (in the *Your Name* box) and your
    email address (in the *Email Address* box). Once you''ve finished, click **Next**.

    +       3.  In the third page of the wizard, select the type of account you are
    creating, **POP or IMAP** (most home accounts are POP, but if you want to be sure,
    ask your Internet provider). Then type the name of the incoming server and outgoing
    server in the appropriate boxes. This information should also have been supplied
    by your Internet provider; if you don''t have it, give them a call. When you have
    finished, click **Next**.


    **NOTE** *In case you were wondering, a POP account is a traditional email account
    in which new email is downloaded from your provider''s mail server and onto your
    computer. The mail is automatically removed from the server when you download
    it and thus exists only on your computer, from which you can read it at any time.
    In IMAP accounts,*'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'the mail resides on the server, and your computer thus acts only as a viewer
    of sorts. The advantage of this is that you can access and see all of your mail
    from any computer that connects to the mail server. On the negative side, if your
    provider''s mail server is down for any reason, you cannot read any of your mail.


    ![](img/3badae5570de77b990135448f8a8a1cc_253_0.png)


    Figure 13.19: The Thunderbird Account Wizard


    +   4.  In the next page, type the username for your mail account as instructed
    by your Internet provider. This is generally not the same as the username you
    use when logging in to your system. It could be something as simple as your last
    name or something more complex in appearance, such as **MyClearEmailName@MyInternetProvider.com**.
    Click **Next** when finished.


    +   5.  In the next page of the wizard, name your account. This name can be whatever
    you want it to be, but it should be a meaningful way of differentiating this account
    from any others you might use now or in the future. A good choice is to use your
    name and that of your provider. Thus, for example, if your name is Jack, and your
    provider is telepathy.com, you might type **Jack''s Telepathy Mail**. Once you''ve
    named your account, click **Next**.


    +   6.  In the final page of the wizard, you will be shown a rundown of everything
    you have typed thus far. If everything looks right, click **Finish**.


    +   7.  If you have set up an IMAP account, you will then be immediately queried
    for your mail password. If you have set up a POP account, this won''t happen until
    you click the **Get Mail** button in the main Thunderbird window. Whatever your
    particular case might be, once queried, type your mail password (per your provider''s
    instruction), and then click **OK**.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# 13A-2: Sending and Receiving Attachments in Thunderbird


    One question I am often asked by compu-novices and casual compu-users is how to
    deal with email attachments. Attachments, in case you don’t know, are files, such
    as photos, word processor or spreadsheet documents, compressed archives (such
    as ZIP files), and even music files, that are sent attached to an email message
    (hence the name).


    Attachments are a very convenient way of sending such files to others, but, unfortunately,
    they are also a common way of spreading viruses. Although, as a Linux user, you
    are pretty safe from the viruses that are out there in the world today, a bit
    of caution is always a good thing. That said, before moving on to the subject
    of dealing with attachments, let me first lay down some basic ground rules you
    should follow when dealing with them, regardless of the system you happen to be
    using.


    Here they are:


    +   - Don’t open or save attachments if you don’t know the sender.

    +   - Don’t open or save any attachment that ends in .pif, .scr, or .exe, as these
    are the most common forms in which viruses are masked and sent. There should be
    little reason for anyone to be sending you these kinds of files anyway.

    +   - If you do receive attachments of this sort (.pif, .scr, or .exe) from senders
    you know, don’t assume that person is deliberately sending you viruses. As I mentioned
    earlier, many viruses spread themselves by searching through Windows users’ Outlook
    address books and then mailing copies of themselves to all of the contacts listed
    therein. A person’s computer might thus be sending out hundreds of virus-infected
    emails without the person knowing it is doing so. If you receive email with such
    attachments from someone you know, let them know so; their system might be infected.
    Of course, since such files are created to infect Windows systems, they shouldn’t
    do yours any harm, but still it is best to avoid them.

    +   - Don’t open or save any attachment of which you do not recognize the file
    extension. Most files you receive should end in familiar extensions, such as .jpg,
    .png, .gif, .swx, .swc, .doc, .xls, .mp3, and .ogg. Again, even if you recognize
    the extension, don’t open or save the attachment if you don’t recognize the sender
    because virus authors are always finding new ways to worm their creations into
    your system, even via .jpg files.

    +   - If you receive an email attachment from someone you know, but it, or the
    email itself, seems suspicious, check with the sender before opening or saving
    the attachment so as to make sure that the sender did indeed intend to send it.

    +   - Always be suspicious of files attached to mail forwarded to you. Check with
    the sender first before opening or saving the attachment, and even then be wary.
    After all, even though you know who forwarded the attachment to you, you can’t
    be too sure where it came from in the first place.'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'If the title of an email contains the word “virus,” even if it is from someone
    you know, then it is probably best to be suspicious of it also. After all, even
    if a message titled “Help, I think I’ve got a virus!” is legit, it would indicate
    that the sender’s system is infected, right?


    Okay, so now that I’ve hopefully instilled a useful level of paranoia in you,
    let’s get on to dealing with legitimate, nonviral attachments, starting with opening
    and saving those that you receive.


    # Opening and Saving Received Attachments


    When you receive an attachment, you’ll know because the title of the mail will
    have a small paper-clip icon next to it (Figure 13-20).


    ![](img/3badae5570de77b990135448f8a8a1cc_255_0.png)


    Figure 13-20: Thunderbird lets you know when you have received an attachment


    In addition, a small box will appear at the bottom of the email message in an
    Attachments box, displaying the name of that attachment, as you can also see in
    Figure 13-21. If the attachment is a graphics file, such as a digital photo, the
    image will also appear within the email message area.


    You have two ways to deal with the attachment, both of which involve right-clicking
    the filename in the Attachments box at the bottom of the window. When you do this,
    a pop-up menu will appear, and from that menu you can select either Open, after
    which a window will appear asking you which application to use in order to open
    the attachment, or Save As, which is the preferred method. When you select Save
    As in the pop-up menu, the attachment will be saved to your hard disk, from which
    you can do with it as you see fit. Of course, if the attachment is just a picture,
    you can just view it in the message area and leave it at that if you have no interest
    in saving it for future viewing or use.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# ### Sending Attachments


    If you want to send your own attachment, simply click the **Attach** button in
    the Compose window for the email message you are writing, and then navigate to
    and select the file you want to attach in the Attach File window that appears.
    If you would like to attach more than one file, you can do so by holding down
    the CTRL key and then selecting each of the files you want to attach (Figure 13-21).


    ![](img/3badae5570de77b990135448f8a8a1cc_256_0.png)


    *Figure 13-21: Sending email attachments in Thunderbird*


    When you have finished making your selections, release the CTRL key (if you were
    selecting more than one file), click the **Open** button, and the files will then
    be attached to your email message. Once you send that mail, the job will be done.


    # ### 13A-3: Dealing with Spam in Thunderbird


    Well, if you are anything like the millions of other email users in the world
    today, you are probably deluged every week with hundreds of unwanted and uninvited
    email messages announcing that you qualify for a mortgage, offering you low-cost
    prescription drugs, telling you how you can get an online degree, or advising
    you where you can meet singles in your area. Yes, such are the wondors of the
    greatest nuisance foisted upon society since the heyday of telemarketers: *spam*.


    Fortunately, Thunderbird helps reduce the annoying effects of spam by means of
    its *Junk Mail Controls* feature. Thunderbird’s Junk Mail Controls feature is
    essentially an adaptive filter that tries to determine which of your email messages
    are spam. At first, it is none too clever and marks many a good message as junk,
    while leaving some junk messages as is. You will know'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'when Thunderbird has marked a message as junk by the trash can icon in place
    next to the sender’s name in the list of email messages in the main window (Figure
    13-22).


    ![](img/3badae5570de77b990135448f8a8a1cc_257_0.png)


    # Figure 13-22: Marking or unmarking messages as junk


    If Thunderbird has made a mistake, you can correct it by clicking the icon when
    a message is not junk or by clicking the small dot icon if the message should
    be marked as junk (also seen in Figure 13-23). Through time, Thunderbird learns
    what is junk and what isn’t (hence the *adaptive* bit I mentioned), eventually
    getting it right most of the time. When you are satisfied that Thunderbird is
    getting things right most of the time, you can set up the Junk Mail Controls to
    automatically load any incoming email deemed to be junk in a special junk folder.


    You can set it up to automatically reroute such mail to the Junk folder by going
    to the **Tools** menu and selecting **Junk Mail Controls**. When the Junk Mail
    Controls window appears (Figure 13-24), click the box next to *Move incoming messages
    determined to be junk mail to*:


    ![](img/3badae5570de77b990135448f8a8a1cc_257_1.png)


    # Figure 13-23: Setting up Thunderbird to automate the junk-mail-handling process'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'The other settings should already be correct, so just click the **OK** button,
    and your world, at least the world of your inbox, will become a much happier and
    less-cluttered place.


    Of course, spam from new sources will arrive from time to time, so you might still
    have to mark certain items manually as junk. When you do that, on this point on
    however, those messages will be automatically moved to the junk folder. It is
    also a good idea to check through the junk folder before trashing its contents—just
    to make sure that no good messages are inadvertently being placed there.


    # **13A-4: Using Folders in Thunderbird**


    When you receive a lot of mail from a particular sender, it can be useful for
    you to set up a folder for that sender. This is especially handy if you happen
    to subscribe to one or more mailing lists, whose string of messages can quickly
    fill up your inbox. Just go to the **File** menu and select **New ➤ New Folder**.
    After that, a small window will appear in which you type in a name for the folder
    and then click **OK**. The folder will then appear in the left pane of the Thunderbird
    window. Once the folder is in place, you can simply drag all the email that falls
    under the category you’ve just created into the folder.


    A still easier way to do this is by typing the name of the sender or group in
    question in the search box near the top-right corner of the window. Once you do
    that, only the messages matching that entry will appear in the list of email messages
    below (Figure 13-24).


    ![](img/3badae5570de77b990135448f8a8a1cc_258_0.png)


    If you then click one of the messages in the list, and choose **Select ➤ All**
    in the **Edit** menu, you can easily select all of these messages in one go. Dragging
    them to the new folder thus becomes a much easier chore, so all you have to do
    is click any one of the now-highlighted messages and drag the whole lot into your
    new folder.


    # **13A-5: Creating a Message Filter in Thunderbird**


    If you would like to automate things a tad so that certain messages are automatically
    loaded to your new, or some another, folder in the future, you can create a message
    filter. To do this, start out by going to the **Tools** menu and'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'selecting **Message Filters**. Once the Message Filters window appears, click
    the **New** button, which will bring up the Filter Rules window, shown in Figure
    13-25.


    In that window, here’s what you have to do:


    +   1. In the uppermost text box, give your new filter a name.

    +   2. In the same window, choose a surefire way to distinguish the messages that
    you would like to be automatically loaded into the folder upon arrival. For example,
    let’s say that you created a folder for one of the mailing lists to which you
    belong. The subject lines of most mailing-list messages are preceded by the name
    of the list in brackets, such as [Music Lovers] or [Faye Wong List]. Since this
    is consistent at all mail from the list and is not likely to appear in any of
    your other e-mail messages, it would be a good candidate for this purpose. That
    being the case, in the top pane of the Filter Rules window you would select **Subject**
    in the first drop-down menu, select **contains** in the second, and then in the
    adjacent box type the bracketed name of the list.

    +   3. In the bottom pane of the window, select **Move to folder**, and then,
    via the drop-down menu in the middle of the pane, select the folder to which you
    want the mail moved. In the case of this example, you would be selecting the folder
    you just created in Project 13A-4.

    +   4. Your Filter Rules window would then look something like that in Figure
    13-25. If so, click **OK**. The Filter Rules window will then close, and your
    new filter will appear in the list of filters within the Message Filters window,
    which you can then close. Now all of the mail you receive in the future from the
    person or group specified in your new message filter rule will be automatically
    rerouted to that folder.


    ![](img/3badae5570de77b990135448f8a8a1cc_259_0.png)'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# ## More on Security


    Since I’ve just discussed protecting yourself from email-borne viruses in the
    previous section, it is worth mentioning at this point that there are some other
    security features available in various editions of Xandros to help protect you
    from other network/ Internet-related dangers. In addition to the ability to encrypt
    Home folders, which I mentioned in Chapter 7, the Xandros Surfside Linux and Business
    Editions have built-in antivirus software (though viruses are not very much of
    a problem in Linux world), while the Deluxe, Surfside Linux, and Business Editions
    have a handy firewall configuration wizard (**Launch » Applications » Internet
    » Firewall Wizard**), which helps you set up a personal firewall to ward off online
    intruders. This is especially useful for those with an always-on network or Internet
    connection.


    # ## Project 13B: Instant Messaging (Kopete)


    If you are fond of instant messaging, you’ll be glad to know that Xandros is ready
    to serve your needs with its *Instant Messaging* application, also known as *Kopete*.
    It doesn’t matter whether you usually use MSN/Windows Instant Messenger, Yahoo
    Messenger, AOL Instant Messenger (AIM), or ICQ; Kopete can handle them all. In
    fact, it can handle all of them at the same time, a really big plus.


    Now some of you might not know what instant messaging is, so I’ll fill you in
    before moving on. Basically, *instant messaging* is a service provided by a number
    of companies (such as those I’ve just mentioned) that allows you to communicate
    with your friends or acquaintances online via instant text messages. Once you
    create an account, you add contacts of people you know who also have accounts
    of their own. Then, you’re ready to go. When any of your contacts are online,
    Kopete will let alert you, while their instant messaging software will also let
    your contacts know that you are online. Now you can all contact one another via
    real-time text messages. The typed conversation that you and your contacts have
    is displayed in a separate window.


    As you can see in Figure 13-26, the conversation looks something like a script.
    In short, it’s sort of like talking on the phone, but instead of talking you’re
    typing. All very fun and handy.


    # ### 13B-1: Setting Up Kopete


    You can run Kopete by going to the **Launch** menu and selecting **Applications
    » Internet » Instant Messaging**. The first time out, Kopete will bring up its
    Configure window, in which you can set up an account for each of the services
    with which you are registered. If you aren’t already registered with a messaging
    service, you will also be able to create one. Get started by clicking the **New**
    button, and Kopete’s Add Account Wizard will appear (Figure 13-27).'
  merge: -1
  img_proc: true
- pgno: 261
  md: "![](img/3badae5570de77b990135448f8a8a1cc_261_0.png)\n\n*Figure 13-26: Kopete\
    \ displays a running transcript of your real-time text conversation*\n\n![](img/3badae5570de77b990135448f8a8a1cc_261_1.png)\n\
    \n*Figure 13-27: Kopete’s Add Account Wizard*\n\n+   1. In the first page of the\
    \ wizard, just click **Next**, as there is nothing else for you to do.\n+   \n\
    +   2. In the second page (Figure 13-28), select the messaging service for which\
    \ you want to set up an account by clicking it once and then clicking **Next**.\
    \ You can add other accounts later, if you wish. If you haven’t already registered\
    \ with the messaging service you’ve selected, you can do so at this point by clicking\
    \ the **Register New Account** button.\n+   \n+   3. In the third page, enter\
    \ your account information. For example, if you have an MSN account, you would\
    \ type in your MSN mail address. If you select *Remember password* (a good idea,\
    \ in my opinion), you must then also type your password for that messaging service\
    \ (Figure 13-29). When finished, click **Next**."
  merge: -1
  img_proc: true
- pgno: 262
  md: '![](img/3badae5570de77b990135448f8a8a1cc_262_0.png)


    Figure 13-28: Selecting the type of account you wish to set up in Kopete


    ![](img/3badae5570de77b990135448f8a8a1cc_262_1.png)


    Figure 13-29: Inputing account information in the Kopete Add Account Wizard


    +   4. In the final page of the wizard ... well, there is nothing you really have
    to do, so just click **Finish**.


    At this point, Kopete will try to log you onto the service for which you''ve just
    set up an account. If you didn''t select the *Remember password* option in the
    wizard, A KDM Wallet window will most likely now appear. If so, click **Next**
    in that window, type a password for KDE Wallet, and then click **Finish**. You
    will then be prompted for the password of the account you''ve just set up, so
    type that in when prompted, and you will be logged in and ready to go.


    If you want to set up accounts for other messaging services with which you are
    registered, you can do so now, or later, by going to the **Settings** menu, selecting
    **Configure Kopete**, and then clicking the **New** button in the Configure window
    that appears.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# **13B-2: Adding Contacts to Kopete**


    Although you are now set up and logged in, you really can''t do anything until
    you add some contacts to Kopete. If you want to be able to communicate with these
    contacts via Kopete, they must have accounts with one of the same messaging services
    as you. To add such contacts, go to the **File** menu and select **Add Contact**,
    after which an Add Contact Wizard will appear (Figure 13-30). To help you in following
    along with the wizard, I''ll spell out the steps here:


    +   1.  In the first page of the wizard, just click **Next**.


    +   2.  In the top box of the next page of the wizard (Figure 13-31), type the
    name of the contact as you would like it to appear in the Kopete window.


    ![](img/3badae5570de77b990135448f8a8a1cc_263_0.png)


    +   3.  Next, you must decide to which group you want to add your contact. The
    default group is *Top Level* (also shown in Figure 13-31), so click the box next
    to that group, and then click **Next**.


    +   4.  In the next page of the wizard, check the box next to the messaging service
    to which your contact belongs. If, for example, the contact uses Yahoo, check
    the box next to that service, and then click **Next**. Note that only those services
    for which you have set up your own accounts will appear in this list, so if your
    contact is registered with a different messaging service, you will have to register
    for the same service yourself and then set up a Kopete account for it.


    +   5.  In the next page, type the username or email address under which the contact
    is registered with his or her messaging service. Of course, you will have to get
    this information from the person in question. Once finished, click **Next**.


    +   6.  In the final page of the wizard, just click **Finish**.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '![](img/3badae5570de77b990135448f8a8a1cc_264_0.png)


    *Figure 13-31: Naming your contact in the Kopete Add Contact Wizard*


    Your new contact will then appear in the main Kopete window, though you will not
    be able to see that contact''s online status until you receive his or her online
    approval. This is usually requested, and hopefully given, the first time you try
    to send a message to the contact. The same is true when someone tries to do the
