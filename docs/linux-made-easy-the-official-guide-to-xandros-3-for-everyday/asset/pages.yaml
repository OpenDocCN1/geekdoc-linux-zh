    # ### Inserting Images into a Document


    With all the images available to you via the Internet, your scanner, or your digital
    camera, it is hard to resist jazzing up your documents a bit by adding an image
    here and there. To insert an image into your document, just follow these steps:


    +   1.  Click once wherever you want the image to appear in the document.

    +   2.  Go to the **Insert** menu, and select **Graphics ▸ From File**.

    +   3.  When the Insert Graphics window appears, check the box next to *Preview*
    (to make it easier to select images), and then navigate to and select the image
    you want to insert by clicking it once (Figure 17-10).

    +   4.  Once you have selected your image, click **Open**, and the image will
    appear within your document.


    ![](img/3badae5570de77b990135448f8a8a1cc_355_1.png)


    Figure 17-10: Inserting an image in a Writer document'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# Resizing an Inserted Image and Adjusting Text Wrap Properties


    If the image you''ve inserted is a large one, it may be way too big to deal with
    within the confines of your letter-size page. Conversely, if the image is a small
    one, or if you click in the bottom third of a page before inserting the image,
    it may end up being too small to use. In either case, you will need to resize
    the image to get things right. Here''s what you need to do:


    +   1. Press and hold down the SHFT key (to retain the image''s horizontal to
    vertical aspect ratio), and then, from within the document, drag one of the image''s
    four corners until the image is the size you would like it to be.

    +   2. Once you have done that, release the SHFT key.


    After you have resized the image, it will be positioned either between, above,
    or below the lines of text in the document, as you can see in the left half of
    Figure 17-11.


    ![](img/3badae5570de77b990135448f8a8a1cc_356_0.png)


    It is possible, however, to have the text wrap around the image, so as to produce
    more of the newsletter-ish look shown in the right half of Figure 17-11.


    +   1. Double-click the image within the document to bring up the Graphics window
    (Figure 17-12).

    +   2. In that window, click the Parallel button and then OK.


    When you now look at your document, you will notice that the text comes out flush
    to one or more sides of the image, which you most likely do not want. That being
    the case, open the Graphics window once again, and adjust the appropriate numbers
    in the Spacing section. Increasing the numbers will increase the distance between
    the text and the image. Trial and error will help you to get it just right.'
  merge: -1
  img_proc: true
