- pgno: 38
  md: '# 2


    # METAMORPHOSIS


    # Installing Xandros on Your Machine


    ![](img/3badae5570de77b990135448f8a8a1cc_38_0.png)


    If you have already installed Xandros on your machine, you can skip right over
    this chapter and go on to the next one. If, however, your machine is still Xandros-free
    and you are ready and raring to change that state of affairs, then you had better
    stay right where you are and read on.


    In this chapter, I will review everything you need to do before I guide you through
    the installation steps to get Xandros up and happily running on your machine.


    > NOTE If you are computerless at the moment or are contemplating buying a new
    machine, you might want to just forgo this whole chapter on installation and go
    out and buy a machine with Xandros preinstalled. Information about the availability
    of such machines is given on the Xandros site at http://www.xandros.com/partners/ormpcs.html.
    As for the rest of you . . . read on!'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Single or Dual-Boot Setup?


    Before getting started, you first need to decide whether to install Xandros as
    the only operating system on your machine or to create a dual-boot setup, which
    lets you easily choose to run Xandros or Windows each time you start up your machine.
    You see, it is possible to have both Windows and Xandros installed on the same
    machine and for them to happily coexist.


    Creating a dual-boot setup in Xandros is incredibly easy, but you do need to have
    a hard disk with enough space to accommodate the two systems comfortably in their
    own partitions. Most computers these days come with at least a 60 gigabyte (GB)
    hard disk, which I would say is the bare minimum required to accommodate the 2
    gigs required by Windows XP (not including space required for other applications)
    and the 3 gigs required by Xandros. Of course, the bigger the partitions (and,
    logically enough, the hard disk), the smoother things will be for you when running
    either system.


    In my own case, I started out with just such a dual-boot setup, so I can tell
    you firsthand that it all works just fine. The only problem I found was that over
    time, I just stopped using the Windows side of things completely—I just had no
    need to go there. However, having so much disk space taken up by a Windows system
    I wasn’t using anymore seemed a waste of prime real estate, so eventually I just
    dumped the whole thing and went for a straight Linux-only setup.


    That said, unless there is some application that you really need but is not available
    on the Xandros side (probably some game), I’d go ahead and dump your Windows system
    (and all the viruses and speware that have buried themselves in there) and go
    for the Xandros-only setup. Xandros has most of what you will need anyway, and
    because OpenOffice can read and write MS Office files, you’ll be well-enough connected,
    if that is of concern to you.


    # But What If I Want My Windows Back?


    You may be thinking that if you do as I suggest and dump your Windows system,
    you’ll end up having to install it again if you don’t like Xandros. That would
    be a considerable waste of time and energy, to be sure. However, believe it or
    not, there are advantages to my suggestion even if your no-go scenario turns out
    to be the case.


    You may have noticed that your Windows system, as you’ve used it over time, has
    gotten sort of gunked up—it is no longer the quick little kitten it used to be.
    Menus don’t pop open as quickly as they used to, things take longer to start up
    than they did before, and you find yourself asking "What the Sam Habberdack is
    that?" all the time as mysterious things happen with increasing frequency.


    This is just the nature of the beast, and a very good way of getting things back
    to normal is to reinstall the whole thing. This will also rid your system of any
    speware or viruses it might have embedded in it. So even if you do decide to come
    back to Windows later, you’ll be doing yourself a favor, because it should run
    better and more safely than before. It’s a little more work up front, but in the
    long run you’ll be a happier camper.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Protecting You from Yourself


    During the installation process, you will be asked to create and type in three
    things: an administrator password, a username, and a user password. Deciding on
    these now so as to get things out of the way is a good idea. If you are like most
    Windows home users, however, you might not be quite sure about why you need all
    this information, so I will fill you in now.


    Xandros, like most Linux distros, tries to keep you and the actual workings of
    the system somewhat separated by all but forcing you to do your day-to-day work
    in a user account. When you install software or perform certain other system chores,
    however, you are asked to momentarily dip into the administrator account (also
    known as root, usually by merely typing in the administrator password when prompted
    to do so.


    Compared to what you are probably familiar with in Windows, where every user account
    is an administrator account when set up, this might seem a bit cumbersome. Maybe
    so, but it is a great idea that provides you with much better security (both systemic
    and psychological), because it protects you from yourself by limiting any screwing
    up you do to your user account alone. In fact, even the MS boys recommend that
    you do this with Windows—just open your Windows Help page and do a search for
    “why not administrator” and see for yourself.


    In addition to security, this setup can also add convenience and privacy. With
    your administrator-account powers, you can create additional user accounts at
    any time, as you would on Mac OS X or Windows XP. For example, say that your family
    wants to use your computer, but you don''t want them messing around with your
    files or, worse yet, blitzing the whole system in some way. You could use one
    account for yourself and then add additional accounts for your daughter (Erika),
    your son (Jothro), and your spouse (Pat). Under this system, when any one of them
    starts up your computer, they will only be able to log in to their own account.
    You can also set things up so that they will not be affected by the settings of
    any of the other users, and their settings will not affect anyone else''s.


    Now that you understand the root/user distinction, decide upon a root password
    and a user password. You will be using the user password every time you log in,
    so make sure it is something you won''t forget and, more importantly, won''t mind
    typing in every day. You won''t really need the root password as much, although
    you will be using it quite a bit while doing the projects in this book. Still,
    it should be something that you will remember, because it is very important.


    You will also need to come up with a username for yourself. It could be as simple
    as your initials (my username is rg) or the name of your favorite tropical fish,
    such as neontetra. Whatever you choose, it will appear on your screen once you''ve
    logged in, so make sure it is a username you don''t mind seeing every day. Having
    to see “Stinky''s Home” on your computer screen day in and day out could prove
    a little annoying, if not embarrassing.


    NOTE Your username can consist of any combination of numbers, underscores (_),
    hyphens (-) and lowercase letters. The first character, however, must be a letter.
    It also cannot have any spaces.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Once you''ve decided upon your username and your root and user passwords, make
    sure that you write them down on a piece of paper or in a book (something that
    you can''t delete). Keep them at hand until the installation process is over and
    you have gotten into the swing of things. After that, you can store them in some
    safe place—but don''t forget, as I am prone to do, where that safe place is. The
    information is very important, and it is easy, as time rolls by, to forget such
    things, which you definitely do not want to do. Holding onto your root password
    is most important of all, because without it you won''t be able to do certain
    things, such as install packages or add users.


    # Pre-installation: Can You Boot from CD?


    Before you go on to the installation (Project 2B), make sure that your computer
    is set up to boot from your CD drive. Most machines these days are set up to do
    this, so you probably don''t have to do anything special. If you''re not sure
    and don''t feel like tinkering around, you can find out by just going right to
    the installation steps in the next section. If the Xandros installation screen
    appears, you can just keep going. On the other hand, if you suddenly boot up in
    Windows, you will have to make some adjustments.


    Probably the only thing you have to do is restart your machine and then press
    whatever key the screen tells you to press in order to enter your BIOS setup.
    This is usually DELETE or F1, but not all machines are the same. If the on-screen
    information passes by so fast that you miss it, you can check your user''s manual
    to see what the correct key is. Once you get into the BIOS setup, change the boot
    sequence so that your CD drive is first. The method of doing this will differ
    depending on your machine, so see your user manual.


    # Project 2A: Creating a Boot Disk (If You Need One)


    In the extremely unlikely event that your machine cannot boot from a CD at all,
    you will have to create a 3.5-inch boot diskette, which you can do very easily
    while using your (or someone else''s) Windows system. To do this, you must first
    boot up your machine in Windows. Once you are at your Windows desktop, insert
    the Xandros Install CD. The Xandros Desktop Autoturn Wizard (Figure 2-1) will
    appear. Just click the Next button to proceed.


    +   1. In the new Wizard window, click the radio button next to the words Floppy
    diskette, as shown in Figure 2-2, and then click Next.

    +   2. All you need to do now in order to create the boot floppy is to click the
    Create Floppy button, as seen in Figure 2-3. You will then be prompted to insert
    a floppy disk, so first label a 1.44 MB, 3.5-inch floppy disk as Xandros 3.0 Boot
    Disk and put it in your floppy drive. Once you''re done that, click the OK button
    in the disk prompt window. The creation of your boot floppy will now begin.'
  merge: -1
  img_proc: true
