- pgno: 448
  md: '# PROXY SETTINGS


    ![](img/3badae5570de77b990135448f8a8a1cc_448_0.png)


    If your Internet provider or network has you behind a firewall, you will not be
    able to access Internet content, such as web pages and broadcast streams, unless
    you input the *proxy server settings* given to you by the service provider or
    network administrator. The method of inputting these settings, however, varies
    slightly from application to application. Although most KDE apps, such as the
    Panel Weather applet and Kdict, utilize the proxy settings you input for the system
    as a whole in the Xandros Control Center, instructions for inputting both system-wide
    and application-specific settings are provided here.


    The information you need in order to input your proxy settings usually consists
    of a *URL* and a *port number*. The *proxy preferences window* for most applications
    provides separate input boxes for these two components of the proxy address. In
    cases where there is only one box for the information, write the two components
    together, separated by a colon, as in the example *proxy.crazfish.se:3128*. Some
    providers or network administrators may also'
  merge: -1
