    \ not sure which one it is, just move your mouse over the buttons without clicking,\
    \ and a small box will appear telling you what each is (Figure 16-23). Once you\
    \ do this, a new layer, titled *Empty Layer*, will appear highlighted in the pane\
    \ above the buttons.\n\n![](img/3badae5570de77b990135448f8a8a1cc_333_0.png)\n\n\
    Figure 16-23: The New Layer button\n\nBefore moving on, it is probably a good\
    \ idea at this point to explain briefly how layers work. In the case of our wallpaper\
    \ project, the easiest way to envision this is to think of your background image\
    \ as a painting on paper. On top of that, you are adding clear sheets of plastic\
    \ (the layers) upon which you will draw other elements. If you don't like what\
    \ you've added on one sheet, you can simply throw the sheet into the trash, while\
    \ your other sheets will remain as they were before, untouched and intact. You\
    \ can, of course, add still more sheets to add still other items. Every step is\
    \ thus protected from any slip-ups you might make in the next step. All very useful\
    \ and convenient.\n\nIf this explanation comes across as somewhat obtuse, perhaps\
    \ it will help to put it into the context of what we are going to be doing in\
    \ this project.\n\nIf you take a look at Figure 16-24, you will see that you will\
    \ be adding two layers for each paste-on image you add to your background image,\
    \ one for the paste-on image itself and one for its shadow. That means that you\
    \ will actually be adding eight different layers (assuming you are adding four\
    \ paste-on images) in total. Well, all that said, let's get back to work.\n\n\
    +   3. Now that you have added an empty layer to your background image, click\
    \ that image, and then select **Paste** in the **Edit** menu (remember, we copied\
    \ the image just before we started step 1). Your first paste-on image will then\
    \ appear within the background image (actually in its own layer), surrounded by\
    \ a dashed-line selection box.\n+   \n+   4. Next, drag the image and place it\
    \ somewhere in the upper-left portion of the background image. Remember that your\
    \ desktop has icons on it, so you don't want to place the image too far to the\
    \ left. Also be careful not to click anywhere except within the area of the selected\
    \ paste-on image, since you want to keep it selected."
