- pgno: 88
  md: '# 5


    # THERE’S NO PLACE LIKE HOME


    Working with Your Files in the Xandros File Manager


    ![](img/3badae5570de77b990135448f8a8a1cc_88_0.png)


    Double-click your ruby slippers and you may well end up in some dust bowl of a
    town in Kansas, where some nasty old lady is trying to have your dog sent to the
    pound—and in a wicker basket, no less! Double-click the Home icon on your desktop,
    however, and you will find yourself looking at the Xandros File Manager—a much
    happier place to be, all things considered. The Xandros File Manager (commonly
    referred to as XFWM on Xandros user group forums) is arguably the most important
    part of your system. It allows you to access your files; view your digital images;
    browse other computers connected to your network; copy files to and from your
    Windows partition (if you have one); browse the contents of CDs, floppies, and
    other removable storage devices; burn CDs or DVDs; and even rip and encode music
    from audio CDs. Because the capabilities of this jack-of-all-trades are so great,
    I will be covering most of its features in this chapter and the next, while mentioning
    yet other features elsewhere throughout the book.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# # Navigation


    When you launch the Xandros File Manager, by double-clicking the **Home** folder
    on your desktop or single-clicking the **XFM** launcher on the Panel, it will
    open up to your Home folder (Figure 5-1).


    ![](img/3badae5570de77b990135448f8a8a1cc_89_0.png)


    *Figure 5-1: The Xandros File Manager*


    At this point in the game, the only two things you will find there are two icons:
    Desktop and My Documents. Double-clicking the **Desktop** icon will show all the
    files and launchers you happen to have located there, which at this point should
    just be the five desktop launchers we discussed in Chapter 3. Double-clicking
    the **My Documents** folder, on the other hand, will reveal the three folders
    that Xandros has already set up for you there: My Music, My Pictures, and My Videos.


    # ## Two Navigation Methods


    Xandros provides you with two methods of navigating through your files: using
    the XFM navigation buttons and using the XFM file tree.


    # ### Navigating via the XFM Navigation Buttons


    Once you''ve done some digging around in your various folders, you can move back
    and forth between them by using the three **XFM** navigation (arrow) buttons located
    below the Address bar (Figure 5-2). The left and right arrow buttons are very
    much like those you would use in a web browser—the left arrow takes you back to
    the folder or file you were just viewing, while the right arrow takes you back
    again to whatever you just left. The up arrow, on the other hand, brings you up
    one folder per click. If this'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'doesn''t seem clear to you at this point, give it a try later on when you have
    more files and folders with which to play around. You''ll get the hang of it soon
    enough.


    ![](img/3badae5570de77b990135448f8a8a1cc_90_0.png)


    Figure 5-2: The Navigation buttons in XFM


    To get double-click access to the other options available to you from the Xandros
    File Manager, such as your Windows partition or a CD or DVD, you can just click
    the up arrow button while in your My Home folder, or click once on the **My Linux**
    button in the left pane of the XFM window. The various devices and options will
    then appear in the right pane (Figure 5-3). We will be covering these items later
    on in this and the next chapter, so just hold off on fiddling with these for now.


    ![](img/3badae5570de77b990135448f8a8a1cc_90_1.png)


    Figure 5-3: Accessing it all in the Xandros File Manager window


    # Navigating via the XFM File Tree


    One of the most obvious things you''ll notice in a Xandros File Manager window
    is the presence of a file tree, which appears in the left pane of the XFM window,
    which should be quite familiar if you''re coming over from a Windows environment.
    You can use this file tree to navigate through your file system rather than using
    the double-click / arrow-button method I just described. Clicking any of the icons
    in the file tree will reveal the contents of that folder, network, or device in
    the right-hand pane. You can also view the subfolders within that tree by clicking
    the + symbol next to any item. Obviously, if there is nothing within that item,
    nothing will appear.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'To have a look for yourself, click the + symbol next to My Home, and then click
    the + symbol next to the My Documents folder, which appears after that. Beneath
    the My Documents folder in the file tree you should see the three subfolders that
    Xandros has already set up for you: My Music, My Pictures, and My Videos. At this
    point, you probably don’t have any files in any of these three folders, but if
    you do... say, some photos in the My Pictures folder.... clicking that folder
    would reveal (in the pane on the right) the image files you have stored there,
    as you can see in Figure 5-4.


    ![](img/3badae5570de77b990135448f8a8a1cc_91_0.png)


    # Bookmarks Within XFM


    Another very handy feature of XFM is that it lets you create bookmarks. You are
    no doubt familiar with creating bookmarks for web pages that you frequent, but
    why on earth would you want to create bookmarks within your file system? Well,
    imagine that you have a folder that you often need to use but that it takes an
    excessive number of mouse clicks to reach. To reduce your risk of repetitive stress
    injury (RSI) and the risk of developing carpal tunnel syndrome (CTS), you can
    reduce the number of clicks needed to get to the folder by navigating to that
    folder once, and then, in the Bookmarks menu of the XFM window, selecting **Add
    Bookmark**. After that, whenever you want to get back to that well-buried folder,
    you can just click the **Bookmarks** menu, and that folder will be right there
    waiting for you on the menu.


    For example, let’s say that you frequently need to deal with a particular group
    of images you’ve downloaded from your digital camera to your hard disk. The photos
    are in the *Summer in Wilmington* folder within the *My Albums* folder, which
    is located within your *My Pictures* folder, which is located in your'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'My Documents folder. That’s a lot of clicking. By clicking your way to that
    folder once and then bookmarking it, getting to it in the future will be a mere
    two-click endeavor via the Bookmarks menu (Figure 5-5). You’ll be saving your
    weary hand up to six mouse clicks every time you want to go to that folder.


    ![](img/3badae5570de77b990135448f8a8a1cc_92_0.png)


    # ## Creating Folders and Renaming Files in XFM and on the Desktop


    Two of the most common file-related procedures in any system, creating folders
    and renaming files, are easily performed in the Xandros File Manager. To create
    a folder in XFM, right-click any open space in the right pane of the XFM window,
    and then select **New Folder** in the pop-up menu.


    To rename a file in XFM, right-click the file and select **Rename** in the pop-up
    menu. The filename below the file will then be highlighted. You can then rename
    the file and then press ENTER to complete the process or just click any open space
    within the window to complete the process. Remember to retain the original file
    extension (.doc, .png, .jpg, and so on) when you rename a file.


    To create a folder or rename a file on the desktop, the procedures are essentially
    the same as those for XFM. To create a folder, right-click directly on any open
    space on the desktop, and then select **Create New ➔ Folder** in the pop-up menu.
    To rename a file, right-click the file, select **Rename** in the pop-up menu,
    type the new name, and then press ENTER or click any open space on the desktop.
    You can also rename a file by clicking the file once to select it and then pressing
    the **F2** key.


    # ## Copying and Moving Files in XFM


    Copying and moving files within the Xandros File Manager is a pretty straightforward
    endeavor, although it might be slightly different from what you are used to in
    your previous operating system. In most other operating systems, dragging a file
    and dropping it in a new location moves the file to that new location. In XFM,
    however, that same *drag-and-drop* procedure copies the file, thus leaving you
    with two copies of the file, each in a different location.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Copying a File


    Keeping that warning in mind, you now basically know how to copy a file: click
    the file, and keeping the mouse button depressed, drag the file to wherever it
    is you want to create the copy. You can drag it to a folder within the right pane
    or to a folder within the file tree in the left pane. Once the mouse cursor is
    over the destination folder, that folder will be highlighted. It is then safe
    to release the mouse button. A window will then appear (for a very short time
    in the case of small files) that indicates the progress of the copying process.
    When that window is gone, the copying is complete.


    # Moving a File


    Moving a file is almost exactly the same process I have just described, except
    that you need to use the right mouse button instead of the left one. To move a
    file, right-click the file you want to move, and then drag it to the target folder
    in either pane of the XFM window. Once the target folder is highlighted, release
    the mouse button. A small pop-up menu will then appear (Figure 5-6).


    ![](img/3badae5570de77b990135448f8a8a1cc_93_0.png)


    Figure 5-6: Moving files in XFM


    In that menu, move your cursor (without holding down either mouse button) over
    Move Here, in order to select that option, and then click once with your left
    mouse button. A progress window will appear for a brief time until the process
    is complete.


    # Copying and Moving Files on the Desktop


    You can also save files to your desktop, as you could with your previous operating
    system, but there''s more than one way to do so:


    +   - To copy a file from the desktop to the Xandros File Manager, while you are
    holding down the left mouse button, drag the file from the desktop, and then drop
    it in the right pane of the window by releasing the mouse button. If you would
    like to copy the file to a folder other than the one open in the right pane, you
    can drop the file directly on the target folder in either the right pane or the
    file tree in the left pane. If your XFM window is minimized, you can still drag
    the file from the desktop, then hover the cursor over the XFM entry in the taskbar
    and wait for the window to appear in the foreground.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '+   To move a file from the desktop to XFM, first copy it to XFM, and then
    drag the original file to the trashcan.


    +   To copy or move a file from XFM to the desktop or to a folder on the desktop,
    hold down the left mouse button and then drag the file to the desktop and release
    the file. A pop-up menu appears (Figure 5-7). Select Move Here to move the file
    or Copy Here to copy it. When you have made your choice, click the left mouse
    button.


    +   To move or copy a file from the desktop to a folder on the desktop, drag and
    drop the file using the left mouse button.


    ![](img/3badae5570de77b990135448f8a8a1cc_94_0.png)


    # Another Way to Copy and Move Files


    You can also copy or move files by cutting and pasting them in XFM or on the desktop.
    To do so, right-click the file that you want to copy or move, and then, in the
    pop-up menu, select Copy (to copy the file) or Cut (to cut the file from its present
    location and move it to a new location). Then left-click your selection. Now drag
    the file to where you want to copy or move the file, right-click the mouse, and
    in the pop-up menu, select Paste. Finally, click the left mouse button, and you''re
    finished.


    # Creating a Desktop Link to a File in XFM


    Rather than copying or moving a file from XFM to your desktop, you can create
    a link (or shortcut) to the file. To access the file, you would just double-click
    that link.


    To create a link on your desktop to a file within XFM, drag the file to where
    you want to create the link using the left or right mouse button, and then release
    the mouse button. In the pop-up menu that appears, select Link Here, and then
    click the left mouse button.


    # Extracting and Creating Archived Files in XFM


    In addition to its many other capabilities, the Xandros File Manager allows you
    to easily open and create archived files without installing any additional software.
    If you''ve ever dealt with a ZIP file in Windows or a StuffIt file (.sit) file
    in Mac OS, you have experience with archived (also referred to as compressed)
    files. Basically, when you compress a file, you are taking a single file or, more
    often, a group of files and shrinking them to a size that takes up less disk space.
    This is very useful when trying to squeeze as much as you can onto a floppy disk
    or a CD, or when trying to send files over the Internet. Most applications you
    downloaded from the Internet thus come in this fashion.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'Most archived files in the Linux world are created with some variation of the
    <i>Tar</i> program. The archives created in that format are therefore often referred
    to as <i>tarballs</i> and usually end with the extension .tgz. Of course, Linux
    can also create and extract ZIP archives, so the compression format used for a
    particular archive usually reflects the system on or for which it was created.


    # Extracting an Archived File


    There are a couple of ways to extract the contents of an archived file, but the
    easiest is to double-click the archived file, right-click the folder you find
    within, and then select **Copy** in the pop-up menu. After that, navigate to wherever
    it is you want to place the folder, right-click any open space in that window,
    and then select **Paste** in the pop-up menu.


    If the files within the archive are not already in a folder of their own, you
    will have to create a folder for them first, using the more conventional methods
    you learned earlier in this chapter. Once you’ve done that, select all of the
    files within the archived file, right-click any one of them, and then select **Copy**
    in the pop-up menu. After that, navigate to the new folder you’ve just created
    for your new files, right-click any open space in that window, and then select
    **Paste** in the pop-up menu.


    # Creating Your Own Compressed Files


    Now that you know how to extract the various types of compressed file formats
    out there, you probably should also know how to create your own. As a general
    rule of thumb, the format you choose to use should reflect the system of the person
    who will ultimately be opening the archive. That said, if you are creating archives
    for Windows users, use ZIP; for Linux or Mac users, use TGZ.


    # Creating a Tarball (TGZ File)


    How about if you want to create your own tarball in XFM? No problem; just follow
    these steps:


    +   1. If you want to place multiple files in the same archive, first create a
    new folder, name it appropriately, and then place all the files you want to add
    to the archive into that folder. (If you want to archive only a single file, you
    can omit this folder-creation and file-moving step.)


    +   2. Next, right-click the folder (or the single file) from within XFM, and
    then select **Create TGZ Archive** in the pop-up menu.


    +   3. The archive will automatically have the name of the folder or single file
    you clicked, plus the extension .tgz. In a matter of seconds (slightly longer
    for bigger archives), the new archive will appear next to the folder that you
    just moments before right-clicked, and your mission will be complete.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Creating a ZIP File


    The procedure for creating a ZIP archive is essentially the same as that for creating
    a tarball: create a new folder, copy or move all the files you want to place in
    the archive in that folder, right-click the folder, and select **Add to ZIP Archive**
    in the pop-up menu. Once you''ve completed those steps, an *Add to Zip Archive*
    window (Figure 5-8) will appear with the name of the folder you''re archiving
    given as the name of the soon-to-be-created ZIP file. Assuming that name will
    do, all you have to do is click **OK**, and the process will be complete within
    a few seconds—maybe less. If, however, you suddenly remember that you forgot to
    add a certain file to the archive, you can choose to add it at this point (before
    clicking **OK**).


    ![](img/3badae5570de77b990135448f8a8a1cc_96_0.png)


    *Figure 5-8: Creating a ZIP archive*


    To add a file to your under-construction ZIP archive, click the **Add** button
    in the bottom half of the Add to Zip Archive window. Another window, *Add files
    or folders*, will then appear, and from that window you can choose other files
    to add. Once you have found the file you want to add, select it and then click
    **Open**. The file you choose will then appear in the list at the bottom of the
    Add to Zip Archive window. To add yet another file, repeat this procedure again.
    Once you have finished adding files, click **OK**.


    What if you want to add files after the ZIP archive is already created? Well,
    just treat the archive like a regular folder and do a copy-and-paste routine.
    Here''s what you would do, step-by-step:


    +   1.  Select the file (or files) you want to add to an existing ZIP archive,
    right-click it (or them), and then select **Copy** in the pop-up menu.


    +   2.  Next, double-click the ZIP archive you will be adding to.


    +   3.  When the window for that archive opens, right-click any open space within
    that window, and then select **Paste** in the pop-up menu.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# # Xandros File Manager as an Image Viewer


    Another one of the handy things about XFM is that it can act as a sort of picture
    viewer and previewer. If you click once on any graphics file, a thumbnail of that
    file will appear in the left side of the right pane of the XFM window, as you
    can see in Figure 5-9.


    ![](img/3badae5570de77b990135448f8a8a1cc_97_0.png)


    Figure 5-9: Viewing a thumbnail of an image file in an XFM window


    You can also have your graphics files appear as thumbnails, rather than icons
    (as shown in Figure 5-10), by going to the View menu and selecting Thumbnails.
    This lets you see your graphics files without having to use any other special
    imaging software. Admittedly, this feature is no longer unique in the world of
    operating systems, but it is handy nonetheless. What is more unique to Xandros,
    you will learn shortly, is that same functionality works for text files too.


    When you double-click a thumbnail of an image in XFM, that image will appear at
    a larger size in the right pane of the XFM window (Figure 5-11). At the same time,
    a set of controls will appear with which you can browse through your images at
    an enlarged size, rotate them, adjust the level of magnification, or even run
    an in-window slideshow. This is all very cool, especially for a mere file manager.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '![](img/3badae5570de77b990135448f8a8a1cc_98_0.png)


    ![](img/3badae5570de77b990135448f8a8a1cc_98_1.png)'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'If you would like to see an image at a size beyond the constraints of the right
    pane of the XFM window, you can do so by right-clicking the thumbnail of the image
    in question and selecting **Open With > Image Viewer** in the pop-up menu. The
    image will then appear in its own window, as you can see in Figure 5-12. In Image
    Viewer (also called KView), not only do you have all the viewing options you do
    when viewing images in an XFM window, but you can also have your images fill the
    entire screen by selecting **Full Screen Mode** in the Settings menu and then
    selecting **Fit Image to Window** in the View menu. To get back to normal, just
    go to the Settings menu again and select **Exit Full Screen Mode**.


    ![](img/3badae5570de77b990135448f8a8a1cc_99_0.png)


    # ## Using XFM to View Text and PDF Files


    In addition to letting you view graphics files, the Xandros File Manager allows
    you to read the contents of text files (those saved with a .txt file format),
    again without the need for any other software. If, for example, you have some
    notes that you jotted down and saved as a text file, you can simply double-click
    the file’s icon in the right pane of the XFM, and the file’s contents will be
    displayed in the XFM window. XFM can even do the same for PDF files, acting as
    a simple PDF viewer. Just clicking a text or PDF file will even give you a small
    preview of that document in the left-hand side of'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'the XFM window, as is the case with graphics files. Of course, you can always
    opt to read a PDF file in a window of its own by right-clicking the PDF file you
    want to view and selecting **Open With** » **Acrobat Reader** in the pop-up menu
    (Figure 5-13), or, if Acrobat Reader doesn''t seem to do the trick, **Open With**
    » **PostScript Viewer**. Text files can be read in a similar fashion by selecting
    **Open With** » **Text Editor**.


    ![](img/3badae5570de77b990135448f8a8a1cc_100_0.png)


    *Figure 5-13: Viewing a PDF file in Acrobat Reader*


    # Changing File and Folder Permissions Within XFM


    You will find, as you make your way along in the Linux world, that occasionally
    you come across a file that your system will not allow you to alter. When you
    open up such a file in the appropriate application, the title bar will often say
    *Read Only*, or when you try to save the file, you will get a *Permission Denied*
    message. Messages of this type are telling you that the file is write-protected,
    meaning that you do not have permission to alter the file. In all likelihood,
    the only time you will encounter this situation in Xandros is when you copy files
    from a CD to your hard disk or when you copy files from your Windows partition
    to your Linux partition. This is another way that Linux tries to protect you from
    harming your system, though in the case of copied CD files, it may not be clear
    to you how it’s protecting you.


    If you want to alter a file or gain access to a folder that is write-protected,
    it is possible to do so in an XFM window as long as you are listed as the owner
    of that file or folder. To change file or folder permissions, just right-click
    the file or folder in question and then select **Properties** from the pop-up
    menu.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'Once the Properties window opens, click the **Permissions** tab, and you will
    see who the owner of the file or folder is and what you are allowed or not allowed
    to do with it (see Figure 5-14).


    ![](img/3badae5570de77b990135448f8a8a1cc_101_0.png)


    > *Figure 5-14: Changing permissions in an XFM Properties window*


    As you can see in Figure 5-14, permissions can be granted or denied to the *owner*
    of the file or folder (you), to a specified *group*, or to *others* (everybody
    else). These permissions are:


    +   *   **Read**

    +       Permission to view the contents of a file or folder

    +   *   **Write**

    +       Permission to alter the contents of a file or folder

    +   *   **Execute**

    +       Permission to run a program or script


    In general, you needn’t worry all that much about setting permissions for your
    own files, because you are really the only one who has access to your user account.
    The main exception to this is when you transfer files from a CD to your hard disk.
    In this case, the files likely will be write-protected, meaning that you cannot
    alter the files until you change their permissions.


    If you are dealing with a write-protected folder or file, you can change the file’s
    permissions to allow you to alter it by clicking the checkbox under the word *Write*
    in the *Owner* row. Once you have finished, click **OK** and you’ll be free to
    do what you like with that file.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Using XFM with Your Windows Partition (for Dual-Booters Only)


    If you set up a dual-boot system when you installed Xandros, you can also get
    read-only access to the files in your Windows partition, but not the programs,
    via the Xandros File Manager. To do so, follow these steps:


    +   1. Click the C: icon in the file tree in the left pane of the XFM window (or
    whatever drive contains the files you want). The contents of your Windows C: drive
    should appear on the right-hand side of the right pane of the XFM window (Figure
    5-15).


    > **NOTE** You still only have read access to the partition (see the left-hand
    side of the XFM window, which tells you this), which means you can copy files
    from, but not to, the Windows partition. Although this may seem a bit inconvenient,
    it is probably best in the long run, because it protects the integrity of your
    Windows system and can help to prevent any problems from occurring the next time
    you decide to boot up in Gatesville.


    ![](img/3badae5570de77b990135448f8a8a1cc_102_0.png)


    *Figure 5-15: Getting read-only access to your Windows files*


    > **NOTE** Assuming your files are stored, as most people''s are, in your Windows
    *My Documents* folder, you can access them by double-clicking the *Documents and
    Settings* folder.


    +   2. Once the contents of that folder appear in the right pane, look for the
    folder with your Windows username (mine says rg) and then double-click that folder.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '3. Finally, double-click the **My Documents** folder that appears in the right
    pane, inside which you should be able to find all of your files. If you happen
    to have saved some files to your Windows desktop and would like to access them,
    double-click the **Desktop** folder instead of My Documents.


    NOTE *Creating a bookmark in XFM for this Windows My Documents or Desktop folder
    might be a pretty convenient thing to do now that you know how.*


    # Dealing with Your Network in XFM


    If your computer is connected to a local network, as is often the case with office
    computers, you can also browse the computers connected to that network, and assuming
    you have permission from your network administrator to do so, you can also have
    read and write access to the files located there.


    # Browsing Your Network


    If you are on a network, the chances are good that it is a Windows network, or
    at least acting like one, so to start browsing, click the **Windows Network**
    icon in the file tree in the left pane of the XFM window. A window may pop up
    at that point asking for your Windows Network Password. If it does, just click
    **Cancel**, and after a bit of searching, the workgroups located on the network
    (Figure 5-16), one of which will be your own computer, will appear in the right
    pane. If nothing appears after a few seconds, try clicking the NFS Network icon
    in the file tree.


    ![](img/3badae5570de77b990135448f8a8a1cc_103_0.png)


    Figure 5-16: Network workgroups shown in an XFM window'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'Once the workgroups appear, double-click the workgroup that you belong to;
    the various computers belonging to that network will then appear (Figure 5-17).
    Search through the list until you find the host computer that you have permission
    to log on to (ask your network administrator if you’re not sure), and then double-click
    the icon for that computer.


    # ## Mounting a Network Share


    At this point, a small window will appear showing your username and asking for
    your password. Be aware that the username and password you chose for your Xandros
    system may be different from those for your network. My Xandros username, for
    example *is* rg, while my username for my office network is grant. My passwords
    are also different, but I’ll keep the information to myself. At any rate, your
    situation may be similar to mine, so be sure to input the appropriate information.
    Once you have done so, click the **OK** button.


    ![](img/3badae5570de77b990135448f8a8a1cc_104_0.png)


    You should now be able to see the contents of the host computer in the right pane
    of the XFM window. Look for the folder with your network username (or any other
    folder you have permission to use), and then double-click it if you just want
    to see what’s inside. If you want to access the folder for file-writing or copying
    tasks, click it once to select it, and then click the **Mount this share** link
    at the left side of the right pane of the XFM window.


    A new window, Mount Network Share, will now appear. In this window, you will see
    three text boxes: *Share to mount*, *Mount point*, and *Connect as*. The information
    in the first and last of these three boxes is information regarding the network;
    the network needs to know what you are trying to mount and who you happen to be.
    The middle box, however, contains information for your own computer. The *Mount
    point* box tells your system where in your file system it should display the files
    on your network share, or folder.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'This may sound a bit confusing, but I will try to simplify things a bit. Your
    Xandros system, like all other Linux distributions, sees the world as a series
    of files and folders. In order to display the files on your network share, it
    needs a folder in which to do so. Again, this is no different from what happens
    when you insert a CD or floppy into your computer—your computer mounts the disk
    and then displays its contents in a folder, which, unknownst to you, is located
    on your hard disk at /mnt/cdrom0, or, in the case of a floppy, at /mnt/fd0. Of
    course, you needn''t worry about these details.


    What you do need to worry (or at least think) about, however, is where on your
    disk you want your system to place the folder it will use to mount your network
    share or shares. The default location in the Mount Network Share window is /home/Xandros_username/share_name,
    which is fine enough. I would personally recommend creating an intermediary folder
    of sorts, however, especially if you have more than one share you are going to
    be mounting. To do this, change the text in the Mount point box to read /home/Xandros_username/Network_Share/share_name
    (of course, substituting your username for the Xandros_username in that string).
    Your window should then look something like Figure 5-18.


    ![](img/3badae5570de77b990135448f8a8a1cc_105_0.png)


    *Figure 5-18: Creating a folder with which to mount your network share*


    Whether or not you take this extra step is strictly up to you, but because whatever
    folder you create for this purpose will appear in your Home folder, I think you
    eventually will appreciate the lack of confusion that this extra folder will bring
    about. Either way you decide to go, once you are ready, click **OK**.


    At this point, because you do not already have a network shares folder or one
    with your network username, another small window, somewhat frighteningly titled
    *Error*, will now pop up asking you if you want to create the folders in question.
    You do, so click **OK**.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Accessing the Files on Your Mounted Network Share


    You can now access the files within your network share by going to the newly created
    folder within your Home folder. Remember that the files in that folder are only
    displayed and accessible there; they are not actually physically present on your
    hard disk, so if you use your computer while not connected to the network, the
    folders will be empty.


    Anyway, assuming you have read and write permissions from your network administrator,
    you will not only be able to copy files from your network share but also copy
    files to that share. In addition, you can actually work with files directly on
    your share as if they were right there on your hard disk. Say, for example, that
    you have an OpenOffice.org document on your share. You could, if so inclined,
    double-click that file, make whatever changes you want to make, and save it—all
    without the document ever sitting on your hard disk.


    # Future Network Logins


    Once you have things set up, you will not have to go through this rather laborious
    process again. Every time you start up your machine, your system will attempt
    to automatically mount your network share. Shortly after the Xandros desktop appears
    on your screen, two windows will appear—one informing you that your system is
    attempting to restore your network connection and another asking you for your
    network password (Figure 5-19). If you want to mount your network share, type
    your password, and then click **OK**. You can then view your network files in
    the folder you created in your Home folder (Network_Shares/network_username).


    ![](img/3badae5570de77b990135448f8a8a1cc_106_0.png)


    *Figure 5-19: Typing in your password during subsequent logins*


    If you would rather not mount your network share at that time, you can click **Cancel**
    instead. This will bring up yet another window asking you if you would like to
    permanently remove a given share from your list of automatically connected network
    shares. If you need to mount your network share only occasionally, or if you are
    using a notebook computer that you actually move from work to home and back, it
    is probably a good idea to click **Yes**. If, on the other hand, you do prefer
    to be prompted every time you boot up, click **No**. Either way, you can still
    mount your network share whenever you want to, using the method I described earlier.'
  merge: -1
  img_proc: true
