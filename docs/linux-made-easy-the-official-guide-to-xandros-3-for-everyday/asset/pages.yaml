    ![](img/3badae5570de77b990135448f8a8a1cc_211_0.png)\n\nFigure 11-15: An off-kilter\
    \ image rescued through free rotation\n\n# 11B-3: Cropping\n\nAfter looking at\
    \ the image you've just rotated, or the example in Figure 11-15, you will realize\
