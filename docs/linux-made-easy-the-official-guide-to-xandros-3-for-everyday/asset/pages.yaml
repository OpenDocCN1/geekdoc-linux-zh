    # Taming *AutoCorrect*/*AutoFormat*


    Arguably, the handiest features of most major word-processing applications are
    their auto-correction and auto-format functions. *AutoCorrect*/*AutoFormat* automatically
    corrects and/or formats various elements within a document as you type. Forgot
    to type a capital at the beginning of a sentence? *AutoFormat* will capitalize
    it for you. Typed *received* instead of *receipt*? *AutoCorrect* will fix that
    misspelling for you on the fly.


    The only problem with all this is that *AutoCorrect*/*AutoFormat* sometimes ends
    up annoying you with some of its changes. A good example would be that of URLs.
    Whenever you type in the URL (address) of a website, *AutoFormat* automatically
    converts that URL into an actual link, which, if you click it, will bring up that
    page in your default web browser. This could be handy, but not if you’re creating
    your document just for printing.


    Fortunately, you can take control of *AutoCorrect*/*AutoFormat* and thus get it
    to do only what you want. To get started, go to the **Tools** menu and select
    **AutoCorrect**/**AutoFormat**. In the *AutoCorrect* window that appears, you
    can go about getting things the way you want.


    For example, for some reason or other, every time I type the word *Internet*,
    I mistakenly type *Intermet*. Since this is a very common mistake for me, and
    one that is not covered by the *AutoCorrect* replacement dictionary, I can add
    it in myself in the **Replace** tab by typing **Intermet** in the left box (*Replace*)
    and **Internet** in the right box (*With*), as you can see in Figure 17-8. After
    that, I would click the **New** button, and the pair would be added to the dictionary.'
