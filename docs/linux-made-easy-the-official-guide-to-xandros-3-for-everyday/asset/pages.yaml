- pgno: 54
  md: '# 3


    # AN ALTERNATIVE BLUE WORLD


    *Getting to Know the Xandros Desktop*


    ![](img/3badae5570de77b990135448f8a8a1cc_54_0.png)


    Now that Xandros is installed, you will perform a simple, one-step process whenever
    you turn your computer on. This process will then deliver you to your new desktop.


    Soon after powering up, you will be greeted by the Xandros boot loader screen.
    From this screen you can choose to boot up in Xandros by simply pressing the ENTER
    key or, even more simply, by just waiting a few seconds, which will have the same
    effect. If you created a dual-boot setup, you can use your cursor keys to scroll
    through the various options and select **Windows**, press ENTER, and then boot
    up in that operating system instead. Of course, if you are going to use this book,
    you won’t want to choose this option now.


    **NOTE** *If you at some point want to boot Windows and you see more than one
    entry for it, choose the first entry. If you get some sort of error message and
    Windows does not start, reboot and try the next Windows entry.*'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'Assuming that you do indeed want to follow along with me here, and are thus
    forgoing the Windows boot option for the time being, the only thing you have to
    do next is wait a few somewhat lengthy seconds for the login screen to appear.


    The login screen consists of a tiny window at the center of an empty blue screen.
    In that window, you will see the username you chose during the installation process
    just above an empty box in which you need to type the user password (not the root
    password) that you also entered during the installation process. Once you have
    entered your user password, click OK or press ENTER to proceed. If you are the
    only person using your computer, and thus find the login step a needless chore,
    don’t fret. I will show you how to bypass it in Chapter 7. For now, just bear
    with me.


    # Welcome to Xandros’s KDE Desktop


    A relatively short while after logging in, you will finally arrive at your new
    desktop, which you can see in Figure 3-1. The graphical desktop that Xandros uses
    is called KDE, which is one of the two most popular desktop environments in the
    world of Linux.


    ![](img/3badae5570de77b990135448f8a8a1cc_55_0.png)


    You can see that the desktop isn’t all that different from what you might be used
    to in a Windows environment. But don’t be completely fooled; despite the similarities,
    things are different enough to be interesting. There are three main elements that
    you will probably notice right off the bat: the desktop icons, the Panel at the
    bottom of the screen, and the Launch menu button at the far left corner of the
    Panel. I will focus on these elements in this chapter.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# # Desktop Icons


    As you can see, there are five icons on the desktop: Trash, Home, Quick Start
    Guide, Web Browser, and Xandros Networks. To makes things simple, we''ll start
    with the easiest and, no doubt, most familiar of these: Trash.


    # ## *Trash*


    There is nothing mysterious about Trash . . . at least nothing mysterious about
    the desktop trash icon. It functions just as it does in other operating systems.
    Drag a file you no longer need or want to the trash icon, and the can will bloot
    up. If you want to empty the trash, just right-click the trash icon and, from
    the pop-up menu, select **Empty Trash Bin**. If you drag something into the Trash
    that you are not supposed to, you will be informed that you can''t do that. All
    very simple and familiar, no matter from whence you came.


    # ## *Home*


    As you will notice, the home icon is the image of a house (home) on a folder.
    This should tell you that it is your Home folder—something like a mix of My Computer,
    My Network, and My Documents in a Windows system. This is where all your files
    will be saved to, all your downloads will be downloaded to, and all your music
    will be ripped to. It is your territory, and even if you are on a multi-user machine,
    nobody except you (assuming you are the only one who knows the *root* password)
    will be able to nose around in there. It is also where you can access the other
    storage devices on or connected to your computer (such as floppy disks, CDs, and
    so on), or other computers on your network.


    # ## *Quick Start Guide*


    This icon opens a clear, basic reference guide that deals with the essentials
    of using your system.


    # ## *Web Browser*


    This icon is a launcher that you can double-click to open your Internet web browser.
    You''ll find detailed information on your web browser and other Internet-related
    applications in Chapter 13.


    # ## *Xandros Networks*


    This icon is another desktop launcher with which you can run the Xandros Networks
    application. Xandros Networks is an amazingly simple-to-use application that allows
    you to update your system, purchase upgrade versions of Xandros, and download
    and easily install an unbelievably vast amount of free software. Because Xandros
    Networks is so useful, and because it is one of the most attractive features of
    using a Xandros Linux system, I''ll be covering it exclusively in Chapter 8.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# **Project 3A: Changing Your Desktop Wallpaper**


    The background of your Xandros desktop is decorated with a rather hand-some image
    with the look of cool-blue brushed steel. If so inclined, you can replace that
    background image, often somewhat peculiarly referred to as a wallpaper with any
    picture of your choice. You can photo one of the other wallpapers that come with
    your Xandros system or a photo you’ve downloaded from your digital camera.


    You can also download desktop wallpapers from the Internet. Both http://art.gnome.org
    and www.kde-look.org have lots of wallpapers available, as do many other sites.
    If you’re interested in cars, many of the major automobile manufacturers (Ford
    Canada and Saturn, for example) have wallpapers of their latest models available
    on their Web sites. Many music and film star fan sites are flush with wallpapers
    too.


    # **3A-1: Changing Wallpapers**


    To change the wallpaper on your desktop, start out by right-clicking any open
    space on the desktop and selecting **Properties** in the pop-up menu that then
    appears. A configuration window will appear.


    To choose one of the wallpapers that comes bundled with your system, click the
    drop-down menu button next to the word *Picture* in the Background section of
    the window (the button itself will say **XandrosBlue** the first time around).
    A menu will appear that lists all of the wallpapers available for you to choose
    from (Figure 3-2). Select one, then click **Apply**. The wallpaper you selected
    should then appear on your desktop. Give this a try with a few of the other wallpapers
    in the list until you find one that suits your fancy. When done, press **OK**.


    ![](img/3badae5570de77b990135448f8a8a1cc_57_0.png)


    *Figure 3-2: Changing desktop wallpapers*'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'If you would like to use one of your own photos instead, as I do on my own
    desktop (Figure 3-3), or a wallpaper you’ve downloaded yourself, the process is
    slightly different. Rather than clicking the drop-down menu button next to the
    word Picture in the configuration window, click the little button with a picture
    of a half-opened folder instead. A Select Wallpaper window (Figure 3-3) will then
    appear.


    ![](img/3badae5570de77b990135448f8a8a1cc_58_0.png)


    Figure 3-3: Choosing an image of your own as your desktop wallpaper


    In that window, click Home in the left pane of the window, and then find the image
    you want to use in the right pane. Once you have located it, select it by clicking
    it once, and then click OK. The Select Wallpaper window will then close, leaving
    you with the original configuration window (Figure 3-2). In that window, click
    Apply. The image you selected is now displayed on the desktop (Figure 3-4). If
    you are satisfied with the results, click OK; if not, try again.


    ![](img/3badae5570de77b990135448f8a8a1cc_58_1.png)


    Figure 3-4: Your own image (my own, in this case) displayed on the desktop'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# 3A-2: Setting Up a Desktop Slideshow


    A very cool feature in KDE is the ability to have your desktop wallpapers automatically
    change every few minutes (or even seconds). This feature, like that available
    in Mac OS X Panther, will come in very handy once you''ve finished Chapter 11
    and have downloaded images from your digital camera, because your desktop can
    then become a dynamic photo album that you can view all the time you are working
    at your computer— all very fun and pleasant, unless, of course, your computer
    is loaded with pictures of your ex. Ouch!


    To set things up, open the configuration window as you did in 3A-1 (right-click
    the desktop and select **Properties**, then select **Slide show** from the Background
    section of that window). The **Setup** button then becomes active, so go ahead
    and click it. The Setup Slide Show window (Figure 3-5) appears.


    ![](img/3badae5570de77b990135448f8a8a1cc_59_0.png)


    To start setting up your desktop slideshow, you first need to decide which pictures
    to include. These can consist of your own images, wallpapers you have downloaded,
    the wallpapers that come with your Xandros system, or any combination thereof.
    To get started selecting, click **Add**. Once you''ve done this, the Select Wallpaper
    window (which you saw in Figure 3-3) will appear. Find an image you want to add
    to your slideshow, and click **OK**. The image you selected will then appear in
    the big box in the Setup Slide Show window. You can now go on and repeat the process
    for all the other images you want to add.


    In the setup window, you can also decide how often you want your desktop images
    to change by adjusting the numbers in the box next to the words *Change picture
    after*. You can also set the order in which an image will appear by selecting
    it and then clicking the **Move Up** or **Move Down** buttons at the right side
    of the window. If you prefer, you can also have the images appear randomly by
    selecting the box next to the words *Show pictures in random order*.


    # The Panel


    Now that we''ve covered all there is to cover about the main part of the desktop,
    let''s move on to the next major desktop component, the Panel (Figure 3-6), which
    is located at the very bottom of your screen. You will notice that the'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Panel holds a number of items. Some of these are program launchers that allow
    you to start up a program with a single mouse click, while others are utilities
    of one sort or another. To fill you in on what each of these items is for, I’ll
    give you the blow-by-blow here, covering the items from left to right.


    ![](img/3badae5570de77b990135448f8a8a1cc_60_0.png)


    Figure 3-6: The Panel


    # Launch


    Clicking this brings up the Launch menu, which is the access point for the majority
    of your applications and for your preferences, settings, and other configuration
    tools. I will discuss this a bit more near the end of the chapter.


    # Thunderbird


    Your email application, which is Mozilla’s latest answer to Outlook Express. (Looks
    like an envelope being held by a blue thunderbird.)


    # Firefox


    Your web browser. Essentially, it’s Netscape with a difference or two. (Looks
    like an orange fox wrapped around the earth.)


    # Xandros File Manager


    This launcher is a one-click alternative to the Home icon on your desktop. Clicking
    it launches a Xandros File Manager window, opened to your Home folder. From that
    folder, you can access your files, view the contents of other drives, or mount
    other computers on your network. (Looks like a small file cabinet.)


    # Help


    Provides information on using the various features and applications of your Xandros
    system. It is not the same thing as the First Start Guide on your desktop. (Looks
    like a life preserver.)


    # Show Desktop


    Clicking this hides all open windows, thus allowing you to see the desktop itself.
    Very, very handy. (Looks like a pencil and sheet of paper on a blue square.)


    # The Taskbar


    The taskbar is essentially invisible if you do not have any windows open. When
    you have windows open, rectangular icons for each window appear here, just as
    they do in Windows.


    # Pager/Virtual Desktops


    An application that allows you to switch between virtual desktops (I discuss this
    in Chapter 4). (Looks like a pair of squares, one blue and one green, labelled
    1 and 2.)'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Klaptop


    An application that appears if you’re using a laptop computer. It allows you to
    check the status of your batteries and adjust relevent settings. (Looks like an
    electrical plug next to a battery.)


    # Sound Mixer


    A control that allows you to adjust the overall volume of your system. (Looks
    like a small speaker.)


    # Xandros Update


    An application that periodically checks with Xandros Networks for the availability
    of system updates. (Looks like a small globe, most likely with an exclamation
    mark in a small square.)


    # Lock / Logout


    A pair of buttons with which you can log out (right button—looks like a power
    button) or lock your screen (left button—looks like a lock). Lock- ing your screen
    is a handy means of keeping other people’s noses out of your business while you
    sneak away from your desk to get a cup of coffee. When you click the Lock Screen
    button, Xandros will run a screen saver (or just blacken your screen if no screen
    saver is selected). To use your system again, just move the mouse or press any
    key and Xandros will prompt you for your user password. Once you input the password,
    the screen saver will disappear, and you can get back to work or whatever else
    it was you were doing.


    # Switch User (not shown)


    This button, which shows two people standing, appears only on systems whose video
    card drivers support it. It allows you to switch between user sessions without
    having to quit running applications. A sort of logout without really logging out.


    # Clock


    The obligatory and ubiquitous desktop clock and calendar.


    # Hide / Show Panel


    Click this button to hide or show the Panel. (Looks like a small black arrow.)


    # Project 3B: Customizing the Panel


    The Panel is not a static thing. You can add launchers (program shortcuts or aliases),
    utilities, and even amusements to make it do almost anything you want it to, within
    limits, of course. In the various stages of this project, you will customize your
    Panel to make things more convenient for you as you make your way through the
    rest of this book. You are, of course, free to change any of the customizations
    I ask you to make, or to just pick those that are of interest to you, but I’d
    suggest performing at least a few of them so that you can get a feel for things.


    Each of the following subprojects is very simple. Most are point-and-click procedures
    that you should be able to handle without any difficulty.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# 3B-1: Deleting a Launcher from the Panel


    Deleting items from the Panel is a very simple procedure. A good candidate to
    work with is the Help Center launcher, because it also appears in the Launch menu
    and this is an extra copy. Freeing up Panel space will make room for other items
    more to your liking that you may want to add.


    To delete the Help Center launcher, here is all you have to do:


    +   1. Right-click the **Help Center** launcher in the Panel.

    +   2. In the pop-up menu, select **Remove Help Button**.


    # 3B-2: Adding a Launcher to the Panel


    Now that you have an empty space left behind from where the Help button used to
    be, let''s fill it in with something more useful. A good candidate would be the
    Calculator, which everyone needs to use at one time or another.


    Here''s how to add the launcher:


    +   1. Right-click the open space left behind after removing the Help button.

    +   2. From the pop-up menu, select **Add Application Button ► Applications ►
    Accessories ► Calculator**.


    # 3B-3: Adding a Menu to the Panel


    You can add whole menus to the Panel as well as application launchers. A good
    choice would be the OpenOffice.org menu, because most people use these applications
    quite frequently.


    Here''s what you do to add the menu:


    +   1. Right-click the open space to the right of the Calculator launcher you''ve
    just added.

    +   2. From the pop-up menu, select **Add Application Button ► Applications ►
    OpenOffice.org ► Add This Menu**. Be sure to select **This Menu** in the very
    last submenu that appears, as shown in Figure 3-7.


    ![](img/3badae5570de77b990135448f8a8a1cc_62_0.png)'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# ## 3B-4: Moving Items Within the Panel


    When the OpenOffice.org menu button that you added to the Panel in Subproject
    3B-3 appears, it will most likely be located far from the other application launchers
    that are at the left side of the Panel. Having the menu over there with the others
    would be the most logical arrangement, so in this part of our project we are going
    to do some moving.


    Here’s what you do to move the menu button:


    +   1. Right-click the OpenOffice.org menu button (or any other Panel item you
    want to move that won’t move by dragging alone).

    +   2. From the pop-up menu, select Move OpenOffice.org (or whatever the name
    of the item you’re trying to move is).

    +   3. Your cursor will now look like an arrowhead-tipped crosshair. Without holding
    down either mouse button, move the mouse to the location where you would like
    to place the menu button—in this case, just to the right of the Calculator launcher.
    The menu button will follow along.

    +   4. When the menu button is where you want it to be, click the left mouse button,
    and you’ll be done.


    # ## 3B-5: Adding a Quick Browser for Your Home Folder to the Panel


    In addition to application launchers and menus, you can also add Special Buttons
    to the Panel. The Launch and Show Desktop buttons are examples of these Special
    Buttons. A very handy Special Button you might want to consider adding is a Quick
    Browser. A Quick Browser allows you to view the contents of any folder you specify,
    in menu form, from the Panel. A logical and convenient choice for this project
    would be a Quick Browser for your Home folder, an example of which you can see
    in Figure 3-8.


    Here’s what you need to do to add a Quick Browser for your Home folder:


    +   1. Right-click any open space in the Panel.

    +   2. In the pop-up menu, select Add \u25B6 Special Button \u25B6 Quick Browser.

    +   3. The Quick Browser Configuration window will now appear. The default path
    in the text box next to the word Path will be /home/your_username (mine, for example,
    says /home/rjg). Click OK.


    # ## 3B-6: Adding a Weather Monitor to the Panel


    In addition to application launchers and menus, you can also add mini-programs
    (called *applets*) to the Panel. Each of these applets performs a specific function,
    usually adding a bit of convenience to your desktop in the process. The applets
    at your immediate disposal include an in-panel sound-configuration tool, a dictionary
    lookup input box (discussed in Chapter 13), and the Clock, which is already present
    in the Panel by default. One the most popular applets, however, is the weather
    monitor, called KWeather.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '![](img/3badae5570de77b990135448f8a8a1cc_64_0.png)


    *Figure 3-8: A Quick Browser button for your Home folder in action*


    You should note that because this applet periodically uses the Internet to check
    for the current conditions in the location you choose, it is best used if you
    have an uninterrupted Internet connection such as cable or DSL. Here''s how to
    add the Weather applet:


    +   1. Right-click any empty space in the Panel.

    +   2. From the pop-up menu, select **Add ▶ Applet ▶ Weather**. A warning message
    will most likely appear at the top-left corner of your screen saying, “The requested
    station does not exist.” This is logical enough, because you have not yet selected
    a weather station to monitor.

    +   3. The applet is added to the Panel. To select a weather station, right-click
    the **Weather** applet and select **Configure KWeather**. The KWeather Configure
    window (Figure 3-9) then will appear.

    +   4. In the configure window, click the blue link that says **Lookup Your ICAO
    Code**. Your web browser will then open up to the National Weather Service website.

    +   5. Scroll down to the section that says Display All Stations In A State (or
    Display All Stations In A Country, if you live outside of the United States).
    Select your state or country, and then click the button that says **Display All
    Stations In**.

    +   6. The page that then appears will list all the weather stations in that state
    or country. Find the location you want to monitor and note its four-letter code.
    Detroit Wayne County Airport, for example, is KDTW.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '![](img/3badae5570de77b990135448f8a8a1cc_65_0.png)


    Figure 3-9: Selecting a weather station to monitor in the KWheather Configure
    window


    +   7. Close your browser, and then input the four-letter code for the station
    you want to monitor in the ICAO location code box near the top of the Configure
