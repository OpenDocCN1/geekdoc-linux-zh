  md: 'require you to use your username and password in your proxy settings, so be
    sure to check the proxy information provided to you before entering your settings.


    # Control Center—System-wide Proxy Settings


    As I noted, many applications gather their proxy information from your system-wide
    settings in the Control Center. These include Instant Messaging (Kopete), Media
    Player (Noatun), Online Dictionary (Kdict), Xandros File Manager, and even Xandros
    Networks. To get to these settings, follow these steps:


    +   1. Go to the Launch menu and select Control Center.


    +   2. Click the + symbol next to File Manager, and then click Proxy in the list
    that appears below.


    +   3. In the Proxy module in the right pane of the window (Figure 1), select
    the appropriate choice per the instructions of your Internet provider or network
    administrator.


    ![](img/3badae5570de77b990135448f8a8a1cc_449_0.png)


    +   4. If you are choosing either Use preset proxy environment variables or Manually
    specify the proxy settings, click Setup for that item. Input the appropriate settings
    in the window that appears (Figure 2), and then click OK, after which that window
    will close.


    +   5. Once you have finished, click Apply, and then quit the Control Center.'
  merge: -1
  img_proc: true
- pgno: 450
  md: '![](img/3badae5570de77b990135448f8a8a1cc_450_0.png)


    Figure 2: *Manually inputting system-wide proxy settings in the Control Center*


    # ## Xandros Networks


    As already mentioned, Xandros Networks uses the proxy settings provided in the
    Control Center. If you are having problems connecting to the Internet via Xandros
    Networks, make sure that it is using the proxy settings provided in your current
    user environment by doing the following:


    +   1. Go to the **Edit** menu and select **Proxy Settings**.

    +       2. In the Proxy Settings window that appears (Figure 3), make sure your
    username is selected in the drop-down menu button next to the words *Use proxy
    settings specified for this user.*

    +       3. Click **OK** when finished.


    ![](img/3badae5570de77b990135448f8a8a1cc_450_1.png)


    Figure 3: *Xandros Networks asks you which proxy settings you want to use*'
  merge: -1
  img_proc: true
- pgno: 451
  md: '# **Firefox**


    +   1.  Go to the **Edit** menu and select **Preferences**.

    +   2.  When the Preferences window appears, click the **Connection Settings**
    button near the bottom of the window.

    +   3.  In the Connection Settings window (Figure 4), select the appropriate proxy
    type, and then input your settings.

    +   4.  When you are finished, click **OK**.


    ![](img/3badae5570de77b990135448f8a8a1cc_451_0.png)


    # **Mozilla**


    +   1.  Go to the **Edit** menu and select **Preferences**.

    +   2.  In the left pane of the Preferences window, click the + symbol next to
    *Advanced*, and then click **Proxies** in the list that appears below.

    +   3.  In the right half of the same window, select **Manual proxy configuration**,
    and then input your settings, as shown in Figure 5.

    +   4.  Click **OK** when finished.


    # **RipperX**


    +   1.  Click the **Config** button to bring up the Configuration window.

    +   2.  In that window, click the **CDB** tab.

    +   3.  In that tab (Figure 6), check **Use HTTP**, and then input your proxy
    information in the boxes below.

    +   4.  When finished, click **OK**.'
