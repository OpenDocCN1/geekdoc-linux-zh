- pgno: 460
  md: "# GLOSSARY\n\n+   A\n\n**account**  \nLinux allows a number of people to use\
    \ the same system while appearing that each person is using his or her own system.\
    \ Each user has his or her *own account*, in which the user's files are kept in\
    \ separate Home folders, and in which customizations will not affect the files\
    \ in the accounts of the other users of the machine. See also *root account/mode*.\n\
    \n**administrator account/mode**  \nSee *root account/mode*.\n\n**applet**  \n\
    A mini-application, usually performing a subtask in relation to another application.\
    \ A good example is the number of applications written in the Java programming\
    \ language that are run in conjunction with a web browser, such as many online\
    \ games. See also *application* and *Java*.\n\n**application**  \nOften referred\
    \ to as a *program*, an application is a piece of software designed to allow the\
    \ user to perform a particular task. Word processors, games, media players, and\
    \ spreadsheets are all examples of applications.\n\n**archive**  \nA file that\
    \ is compressed in order to save disk space or to reduce the size of a file. Archiving\
    \ a file makes it easier to transport, either via the Internet or some other form\
    \ of removable media, such as floppy disks or USB flash drives. See also *tarball*\
    \ and *ZIP file*.\n\n+   B\n\n**BIOS (Basic Input-Output System)**  \nA chip in\
    \ a computer that gives your machine the instructions it needs in order to use\
    \ its basic hardware and to boot up your operating system.\n\n**boot**  \nThe\
    \ process, occurring shortly after you power-on your machine, in which your operating\
    \ system is started up."
  merge: -1
  img_proc: true
- pgno: 461
  md: 'boot disk


    As described in this book, a floppy disk containing certain system files, which,
    when inserted into your computer, allows you to boot from a CD-ROM on a computer
    (usually an older one) whose BIOS does not normally allow you to do so.


    burn


    The process of writing data to a blank CD or DVD. The term *burn* refers to the
    fact that the data is written to disc by the laser in your CD or DVD drive.


    # C


    console


    The application in which you type commands by which to perform various tasks on
    your computer.


    CPU (central processing unit)


    The chip that is the brain of your computer and performs all of the instructions
    given to it by the software you use.


    # D


    Debian


    One of the most popular Linux distributions upon which Xandros is based.


    dependency


    Any file, application, or library that an application requires in order to run.


    desktop


    The main workspace on your computer screen. It is what you see when all other
    windows are closed.


    distribution/distro


    A Linux distribution consists of the Linux kernel and a variety of other applications
    and libraries. These usually consist of one or more graphical desktop environments;
    applications such as word processors, media players, games, and utilities; help
    files, fonts, and drivers; and some sort of installer with which to simplify the
    installation of the system. Xandros is an example of a Linux distribution, though
    there are many others, such as Fedora Core and Mandrake.


    download


    The process of transferring any file or application from the Internet, network,
    or other device into your computer.


    driver


    A small application that allows your operating system to communicate with the
    hardware devices you have connected to your computer, such as a printer or scanner.
    Most drivers are built into the Linux kernel, which'
  merge: -1
  img_proc: true
- pgno: 462
  md: "means that you do not have to install a special driver for the hardware you\
    \ connect. On the downside, if the current kernel does not contain the driver\
    \ for your device (often the case for new hardware), you'll probably have to wait\
    \ for the next Linux release, when it will most likely be included.\n\n# dual-boot\
    \ system\n\nA computer that is set up to run one of two different operating systems,\
    \ such as Windows and Linux. Both operating systems are installed on the computer's\
    \ hard disk; when you start up the machine, you are given the choice of which\
    \ system to use to boot.\n\n# E\n\n# email client\n\nThe software application\
    \ you use to read and send email.\n\n# encode\n\nThe process of converting a standard\
    \ audio file, usually one ripped from an audio CD, and converting it into a smaller\
    \ MP3 or Ogg Vorbis file.  \nAlso see *rip*, *MP3*, and *Ogg Vorbis*.\n\n# Ethernet\
    \ card/port\n\nAn add-on, or built-in, expansion card that allows you to connect\
    \ your computer to a network via a cable connected to the Ethernet port on that\
    \ card and, at the other end, the network source.\n\n# F\n\n# file extension\n\
    \nThe three (or sometimes four) letters preceded by a period that come at the\
    \ end of a filename. The file extension tells the system what kind of file it\
    \ is and thus with which application to open it. Microsoft Word documents, for\
    \ example, end in *.doc*, OpenOffice.org Writer documents end in *.sxc*, and MP3\
    \ audio files end in *.mp3*.\n\n# flash drive\n\nAn extremely small, solid-state\
    \ data storage device that plugs into a computer's USB port. Because of their\
    \ relatively low price, small size, and lack of moving parts, these drives have\
    \ become quite popular for transferring files from computer to computer or from\
    \ home to work, and vice versa.\n\n# flash memory card\n\nAny one of several kinds\
    \ of memory cards that are used in most digital cameras today to store images.\
    \ Images stored on such cards can be loaded onto the computer by simply connecting\
    \ the camera itself, with the card installed, to the computer, or by removing\
    \ the card from the camera and then inserting it into a USB memory card reader\
    \ already connected to the computer."
  merge: -1
  img_proc: true
- pgno: 463
  md: '# Flash Player


    A plug-in application that provides a web browser with the ability to display
    pages created using Macromedia’s Flash. See also *plug-in*.


    # freeware


    Software that is available free of charge, though usually with licensing rights
    retained by its creator. See also *open source* and *shareware*.


    # G


    # GNOME (GNU Network Object Model Environment)


    One of the two most commonly used graphical desktop environments in Linux. See
    also *KDE*.


    # GNU


    GNU, a recursive acronym for *GNU’s Not Unix*, is a project dedicated to creating
    a complete operating system consisting entirely of free software.


    # graphical desktop environment


    Essentially the same as *graphical user interface*, though indicating that the
    interface includes a graphical file manager, trash bin, desktop, and other convenience
    features.


    # graphical user interface


    A graphical user environment, such as seen in Windows or Mac OS, that allows you
    to deal with your system and file system by mouse rather than by typed-in commands.


    # H


    # HTML (HyperText Markup Language)


    The language used for creating web pages. You can see what it looks like by opening
    a web page in your web browser and selecting **View ▷ Page Source**. A new window
    will appear showing the HTML source for the page you are viewing.


    # I


    # ISO (International Organization for Standardization)


    As used in this book, an ISO is an exact CD image—basically the contents, layout,
    and format of a CD minus the actual disc itself. ISO images can thus be transferred
    over the Internet and then burned to an actual disc by the user.


    # J


    # Java


    A programming language developed by Sun Microsystems that can run on any operating
    system. It is often used to create applets for use over the Internet. Many online
    games, for example, are Java applets.'
  merge: -1
  img_proc: true
- pgno: 464
  md: '# JavaScript


    A scripting language developed by Netscape and Sun Microsystems that is primarily
    used by web page authors within their HTML documents to provide greater functionality
    to the pages they create. Although it was inspired by Java, and has bits of similarity
    to it in terms of its syntax, it is not at all the same. See also *Java* and *HTML*.


    # K


    # KDE


    One of the two most commonly used graphical desktop environments used in Linux
    and the one used in Xandros. See also *GNOME*.


    # kernel


    The core or heart of an operating system.


    # L


    # LAN (*local area network*)


    A group of interconnected computers in a limited area, such as an office, a school,
    or your home.


    # library


    Basically, a helper application that allows another application to function or
    to provide some other specific functionality to that other application. Libraries
    are, as a general rule, essentially invisible to the user.


    # Linux


    A UNIX-like computer operating system that is notable for being free software.
    The term *Linux* actually refers to the Linux kernel itself, but it is most often
    used to describe the combination of the kernel and all of the other libraries
    and applications that help make it easier to handle, which should be officially
    referred to as GNU/Linux. Xandros is an example of a Linux distribution. The name
    *Linux* is itself a combination of the name of its creator, *Linus Torvalds*,
    and *UNIX*, after which Linux is to a great degree modeled. See also *distribution/distro*,
    *GNU*, *kernel*.


    # log out


    Exiting your current user session. Once you are logged out, another user can then
    log in to his or her own account. Logging out, therefore, does not require shutting
    down your computer.


    # M


    # memory


    See *RAM*.


    # modem


    A device, either built into your computer or outside it in a separate unit, that
    allows you to connect to the Internet via a telephone line.'
  merge: -1
  img_proc: true
- pgno: 465
  md: '# motherboard


    The main circuit board in your computer. All of the components in your computer
    (the CPU, memory, drives, and so on) are connected to this board.


    # MP3


    An audio file compression format that allows you to store audio files, such as
    songs from CDs, on your hard disk with greatly reduced space. MP3 files are recognizable
    by the .mp3 file extension.


    # N


    # network


    Any group of two or more interconnected computers. This could be the various computers
    in an office, a school, or even in your home (see LAN). The Internet itself is
    a kind of network.


    # O


    # Ogg Vorbis


    An Open Source audio file compression format that is mostly popular in the Linux
    world. Like MP3, it allows you to store audio files, such as songs from CDs, on
    your hard disk at greatly reduced space. Ogg Vorbis files are recognizable by
    the .ogg file extension.


    # open source


    Software for which the programmer’s source code is freely available, viewable,
    and modifiable to all. Although open-source software is, as a general rule, free
    of cost, it is not the same as *freeware*. See also *freeware* and *shareware*.


    # P


    # package


    A single archived file, often an application, containing the application itself
    and other files it might need to run. Packages for Debian-based systems, such
    as Xandros, are recognizable by the .deb file extension. This means that when
    you are installing applications via Xandros Networks, you are installing .deb
    packages.


    # partition


    A division of, or the act of dividing, a single hard disk into smaller separate
    parts, each of which appears to the operating system as a separate hard drive.


    # PC card


    See *PCMCIA*.'
  merge: -1
  img_proc: true
- pgno: 466
  md: '# PCMCI A (*Personal Computer Memory Card International Association*)


    A kind of add-on card (and the slot in which you place such a card) that provides
    added functionality to your computer, usually laptops. There are various types
    of PCMCI A cards, with those adding networking capabilities (Ethernet, wireless,
    modem) to your computer being among the most common.


    # plug-in


    A sort of mini-application that is installed to extend the capabilities or features
    of another application in some specific way.


    # pop-under window


    Similar in concept and function to a *pop-up window* except for the fact that
    it appears behind an open web browser window rather than in front of it.


    # pop-up window


    An additional, usually smaller, window that pops open when you open certain websites.
    Sometimes these provide an important function to the site itself, but most often
    they are advertisements.


    # port


    An interface on your computer to which you can attach peripheral devices, such
    as a printer, scanner, digital camera, and so on.


    # R


    # RAM (*random access memory*)


    This is your computer''s memory in which information is temporarily stored while
    you are using various applications. Information held in RAM disappears when the
    computer is turned off. This is in contrast to your hard disk, which holds information
    or data somewhat permanently until you erase it.


    # rip


    The process of extracting an audio file from an audio CD.


    # root account/mode


    When you use a Linux system, you normally are using your user account (or, in
    user mode), in which you have access only to your own data. The owner of the machine,
    however, also has access to the root account or root (also known as *administrator*
    or *superuser*) mode. The root user has access to all of the data in whatever
    user accounts there might be on a given computer. The root user also has the ability
    to add and remove user accounts, install applications and fonts system-wide, and
    alter other system-wide settings. The root user must possess the root password
    in order to access the account or mode.'
  merge: -1
  img_proc: true
- pgno: 467
  md: '# S


    # serial port


    An increasingly less-used type of connector (and connection port) on most computers.
    These days, serial ports are mainly used for connecting external modems or, more
    rarely, your mouse. See also port.


    # shareware


    Software that is available initially for free but must be ultimately paid for
    in order for the user to continue using it. Shareware thus usually has some mechanism
    by which to encourage or force the user to pay. See also freeware and open source.


    # skin


    A set of graphical elements that can be installed to change the look of an application
    or group of applications. Sometimes referred to as a theme.


    # spam


    Uninvited and unsolicited junk email.


    # streaming media


    Basically, audio or video broadcasts sent over the Internet and listened to or
    viewed on your computer by means of some sort of software, such as your web browser
    or RealPlayer, much as you would with a radio or television set. Such streams
    are typically not stored on your hard disk.


    # superuser


    See root account/mode.


    # T


    # tarball


    An archived, or compressed, file created with a version of the tar program, which
    is commonly used in Linux.


    # theme


    See skin.


    # Tovrdals, Linus


    A member of the ethnic Swedish population in Finland, who is best known as the
    creator of the Linux kernel.


    # V


    # VCD (video compact disc)


    A movie or other video file(s) burned to one or more CDs rather than DVDs. VCDs
    are cheaper to produce than DVDs, and they work on almost any computer with a
    CD drive or most other machines that can play DVDs, such as the DVD player you
    probably have attached to your TV. The video image quality of VCDs, however, is
    inferior to that of DVDs, and the CD medium has less storage capacity. A typical
    feature film that fits on one DVD, therefore, takes up two VCDs.'
  merge: -1
  img_proc: true
- pgno: 468
  md: '# W


    **wallpaper**


    Any image used as a decorative background for your desktop.


    **web browser**


    The application you use when viewing web pages, such as Firefox, Mozilla, Opera,
    or, in the Windows world, Internet Explorer.


    **Wi-Fi (*wireless fidelity*)**


    These days used as a general term for wireless computer connectivity between computers,
    peripherals, and/or the Internet.


    **wireless access point (WAP)**


    Devices that permit machines to communicate with one another on wireless networks.
    The WAP is usually connected by Ethernet cable to an Internet or other network
    connection and communicates wirelessly with your computer.


    **wireless card**


    An add-on card inserted into your computer’s PCMCIA slot that allows you to connect
    to a network or the Internet without a direct wired connection (hence the term
    *wireless*).


    # X


    **Xandros**


    A Debian-based Linux distribution, noted for its ease of use and installation
    and its considerable level of Windows compatibility.


    # Z


    **ZIP file**


    An archived, or *compressed*, file created with the WinZip program, commonly used
    in Windows systems. ZIP files can also be created by other programs, such as PKZIP
    (Linux) and StuffIt (Linux, Mac OS, Windows).'
  merge: -1
  img_proc: true
