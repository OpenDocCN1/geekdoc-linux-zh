- pgno: 66
  md: '# More Panel Fun


    In addition to the basic customization you’ve just done in the previous project,
    you can do a lot more to change the Panel’s behavior. Most of these options are
    available by right-clicking any open space in the Panel and then selecting **Configure
    Panel**, to bring up the Control Center Settings window (see Figure 3-11).


    ![](img/3badae5570de77b990135448f8a8a1cc_66_0.png)


    *Figure 3-11: Changing Panel properties in the Control Center Settings window*


    From this window, you can change the position of the Panel, alter its size, change
    its color, or make it (but not the launchers on it) invisible, though this won’t
    look particularly attractive. You can also set the Panel so that it will automatically
    disappear when you aren’t using it and reappear when you bring your mouse cursor
    into the area where the Panel normally resides. If you like the icon zooming feature
    in Mac OS X’s Dock, don’t feel left out; you can even get the icons in your Panel
    to do the same. (In fact, if you really want to get carried away Mac-ifying your
    desktop, you’ll find out how you can do it in Chapter 8.) Anyway, don’t be afraid
    to play around and give things a try—that’s half the fun!


    # The Launch Menu


    At the far left corner of your screen is the Launch button. You can access just
    about everything there is to access in your system from here. In a sense, the
    Launch menu is very much like the Start menu in a Windows system. When'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'you click the **Main** menu icon, all of the applications and utilities available
    to you are exposed (Figure 3-12).


    ![](img/3badae5570de77b990135448f8a8a1cc_67_0.png)


    As you can see, the menu is broken up into three sections, each of which is clearly
    labeled. The uppermost of these sections, Most Used Applications, is dynamic in
    that its contents change according to what programs you use most often. Because
    you will not have used any applications other than the First Run Wizard when you
    first open the Launch menu, that should be the only application listed there at
    that time. The items in the other two sections (All Applications and Actions)
    are primarily static, which means that the items listed there will remain the
    same unless you install a new application, in which case a launcher for that application
    will be added to the menu.


    You will find, however, that some applications do not automatically add a launcher
    to the menu once installed. In such cases, you can run the launcher-less applications
    by selecting the Run Command item in the menu and then typing in the command for
    that application (as discussed in Chapter 8). Alternatively, you can use the Menu
    Editor application (discussed in Chapter 18) to add a launcher to the menu manually,
    which is useful if the application is one you use frequently. You can also use
    the Menu Editor to customize the menu to your liking.


    What each item listed in the All Applications and the Actions sections does should
    either be self-evident (such as Help, Find, and Recent Documents) or will be discussed
    elsewhere in the book. That being the case, I will not delve any further into
    these things at this point.


    # ## Virtual Desktops


    All of the major components of the desktop have been covered, so it is now time
    to discuss a rather unique and convenient feature in Linux: virtual desktops.
    And the best way to understand what this virtual-desktop business is all about
    is to just give it a try.


    In your KDE Panel, click the **Weather** applet, the **Calculator** launcher,
    and the **Xandros File Manager** launcher. You will then have three windows open
    in your present desktop, or workspace. Now look at the Virtual Desktops applet'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'on your Panel. The left half of the icon should be blue; this is your present
    workspace. Click the right half of the icon, the green half, and all your open
    windows will suddenly disappear.


    Actually, nothing has really disappeared—you are just viewing a new desktop. All
    your other windows are still open and running in the previous desktop.


    In this second desktop, you can open something else: go to the **Launch** menu
    and select **Applications ▸ Games ▸ Cards ▸ Solitaire**. The Solitaire card game
    will soon appear.


    You now have windows open in two different desktops, and you can switch back and
    forth between them. To do so, just go to the **Virtual Desktop Applet** in your
    Panel and click the left box, which will take you to your original desktop. Once
    you''ve done that, you can then click the right box again to go back to your game
    desktop.


    As you can imagine, this feature has some potential benefits for you, in addition
    to helping you avoid clutter. Just imagine that you are at work typing up some
    long document in OpenOffice.org Writer. Eventually, you get a bit tired and decide
    to goof off a bit by playing Tetris for a while. To do that, you switch to another
    desktop where you open and play the game. A bit later, when you notice your boss
    making the rounds of the office, you simply switch back to the first desktop so
    that you look busy when he walks by and says, “Keeping yourself busy, Boaz?”


    Phew!


    # ## Shutting Down


    Well, now that you know your desktop environment so well, you may feel like calling
    it a day and shutting down your machine. To do so, just go to the **Launch** menu
    and select **Logout**. A small window will appear with three buttons to choose
    from: **Logout** (default), **Shutdown**, and **Restart**. Click **Shutdown**,
    and the shutdown process will begin.


    When it is all done, the system will tell you on-screen that it is now safe to
    turn off your computer. Usually, the system will turn the computer off automatically
    after a few seconds. On a few machines, however, the system cannot power down
    your machine. You will know if this is so in your case because the message telling
    you that it is safe to turn off your computer will just sit there... forever.
    If you see those words on the screen and nothing else happening for 15 seconds
    or so, then just power down the machine manually by pressing the Power button.
    It is completely safe to do so at that point.


    # ## Getting Out of a Jam


    At this point, you''ve pretty much been introduced to your desktop. Now is probably
    a good time to arm you with some information that will help you out of any jams
    you might get into as you progress through the rest of the book and get further
    into working with your Xandros system. You probably'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'won’t have to resort to what I am about to describe often, if at all, but it
    is always good to be ready just in case. After all, no matter what operating system
    you use, weird things are bound to happen.


    Basically, there are two sure-fire remedies to employ when things go south. If
    one of your applications stops responding, meaning that it just sits there and
    does nothing, which sometimes causes other applications to appear to do almost
    the same, you have to kill it. That sounds a bit ominous, but it is just a temporary
    kill, so don’t worry. If you are really lucky, and have the patience to wait for
    a few seconds (like 30 or so), the system may realize the problem itself, and
    pop up a window telling you, as you will no doubt already know, that application
    X does not seem to be responding. It will then politely ask you if you would like
    to kill the process. Because you certainly do want to do that, just click the
    Kill button, and the problem will be solved.


    If your system doesn’t show the window telling you it knows there’s a problem,
    and thus does not volunteer to kill the application for you, you can take matters
    into your own hands by pressing the CTRL, ALT, and ESC keys in relative unison.
    Once you do that, your cursor will change in appearance from a harmless arrow
    into a much more frightening skull and crossbones. After that micrometamorphosis,
    all you have to do is click once anywhere in the offending window and the problem
    will, more times than not, be solved. If you suddenly change your mind before
    you click in the offending window, and you want to get things back to the way
    they were, just right-click anywhere and the skull and crossbones will be gone.


    If your whole system seems to have plugged out, and you can’t get anything to
    work, you can try to get out of the problem in the manner I have just described,
    by skull-and-crossboning the last application you were working with when the problem
    began. If that doesn’t work, you will have to resort to slightly more drastic
    measures. The first of these is to press the CTRL, ALT, and BACKSPACE keys in
    unison, which will cause your system to log you out and bring you back to the
    login screen. Doing this will cause you to lose any data that you have not already
    saved, but whatever will be will be, as Doris Day used to say (or sing). That
    is why it is always a good idea to frequently save whatever it is you happen to
    be working on – you just never know when things might go wrong. Finally, in the
    unlikely case that the CTRL + ALT + BACKSPACE combo doesn’t work either, try pressing
    the CTRL, ALT, and DELETE keys in unison, which should cause your entire system
    to shut down and then restart.


    As I said, problems that will bring about the need for such keyboard maneuvers
    should be rare, so don’t start worrying too much. If they do occur, however, be
    sure to calm down and try to relax. Take a breath, think about something unrelated
    for a moment or two, pet your cat, and then come back to your computer and try
    to get logical. Acting out of panic, and I guarantee this, only causes bigger
    problems in the long run. After all, as my friend once said, “The only thing you
    get by speeding to work is a traffic ticket.” Stay cool and just think of problems,
    should they arise, as learning exercises.'
  merge: -1
  img_proc: true
