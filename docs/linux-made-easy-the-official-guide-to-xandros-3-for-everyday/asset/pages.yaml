    # Find & Replace


    A definitely noticed, but too often overlooked, feature in Writer is Find & Replace.
    Perhaps you, like so many others, have had the experience of writing up a multipage
    document in which a certain word or phrase appears numerous times, only to find
    that you used the wrong name or date or word. For example, let''s say that you
    were writing a report on the Norman invasion of England, in which you frequently
    mentioned 1492 as the date for that event. Later, it suddenly dawns on you that
    1492 was the year of Columbus''s ocean-blue voyage, while William''s long-term
    frolic in England began in 1066. Well, rather than scrolling through the entire
    27-page document, changing each of the 47 instances of that mistakenly stated
    date, and uttering an untold number of obscenities, you could instead use the
    Find & Replace function to do the job for you, and all in a matter of seconds.
    Here''s how to do it:


    +   1. Go to the Edit menu and select Find & Replace.

    +   2. When the Find & Replace window (Figure 17-3) appears, type the text you
    want to correct in the top box next to the words Search for. In the case of my
    historical screw-up example, that would be 1492.

    +   3. In the bottom box (Replace with) type what it is you want to replace that
    text with (1066 in my example). Once finished, your window would look something
    like mine in Figure 17-3.

    +   4. Finally, click the Replace All button, and all instances of the targeted
    word will be replaced within a second or two by the replacement text.


    The Find & Replace function not only allows you to replace text, but it also allows
    you to change the format of the text you are replacing. Let''s say that you want
    all instances of the word you are replacing to appear in a different'
  merge: -1
