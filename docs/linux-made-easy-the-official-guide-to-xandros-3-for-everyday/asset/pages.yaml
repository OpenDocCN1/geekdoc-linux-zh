    +   7. Select the songs you wish to rip and encode by clicking on the minus symbols
    to the left of the appropriate tracks. If you wish to rip and encode all of the
    songs on the album, click the **Select All Tracks** button instead. When you are
    finished, the riperX window should look something like that in Figure 14-6.


    ![](img/3badae5570de77b990135448f8a8a1cc_280_1.png)


    Figure 14-6: Ripping and encoding audio files with riperX


    +   8. Once everything looks as it should, click the **Go!!!** button to start
    the ripping and encoding processes, the progress of which will be indicated in
    the same, albeit somewhat different-looking, window (Figure 14-7).


    +   9. The first time you rip and encode files with riperX, you will need to decide
    where you want it to save your files. To make your choice, click the **Config**
    button, and the Configuration window will appear (Figure 14-8).'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'In that window, indicate where you would like riperX to save your files by
    clicking the **Target Directory** button to browse to and then select the destination
    folder you want to specify.


    ![](img/3badae5570de77b990135448f8a8a1cc_281_0.png)


    *Figure 14-7: RiperX indicates the progress of the ripping and encoding processes*


    ![](img/3badae5570de77b990135448f8a8a1cc_281_1.png)


    *Figure 14-8: Telling riperX where to save your files*


    # ### Other Encoding Options with RiperX


    In addition to telling riperX where to save your files, you can tell it in what
    format to save those files. To do this, click the **Mp3** tab, and then, once
    on that page, select either **OggVorbis encoder** or **Lame MP3 encoder** from
    the'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'drop-down menu button under the words Encoder plugin (Figure 14-9). Remember
    also that you will be able to create MP3 files only if you have installed LAME
    in Project 14A.


    ![](img/3badae5570de77b990135448f8a8a1cc_282_0.png)


    Figure 14-9: Telling ripperX whether to encode your files in Ogg or MP3 format


    After you have made your encoding selection, you can also, if you like, select
    the encoding bit rate. As I mentioned before, 128k and 160k are the most common
    choices, and either should provide you with very good sound, though, if you have
    the disk space, it wouldn’t hurt to go with the higher bit rate.


    # ## Playing Audio Files with MP3 Player (XMMS)


    Now that you know how to create MP3 and Ogg audio files, you no doubt want to
    know how to play them. For this task, you can use the MP3 Player (Figure 14-10)
    included with your Xandros system.


    ![](img/3badae5570de77b990135448f8a8a1cc_282_1.png)


    Figure 14-10: XMMS—The Linux world’s #1 audio player


    MP3 Player, better known as XMMS (X MultiMedia System), is the Linux world’s best-known
    and most widely used audio player. It is pretty much a clone of the Windows world’s
    Winamp Classic in terms of what it can do, but it was written from scratch, and
    it is very cool and capable. With XMMS, you'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'can play just about any kind of audio file and even listen to Internet broadcast
    streams in either MP3 or Ogg format, as you will learn later on in this chapter.


    # Running XMMS


    You can run XMMS by going to the Launch menu and selecting Applications ▸ Multimedia
    ▸ MP3 Player. As you will notice the first time you run XMMS, only the main window
    (as shown in Figure 14-10) will appear; however, XMMS actually consists of three
    components: the main window, the Equalizer, and the Playlist (Figure 14-11).


    ![](img/3badae5570de77b990135448f8a8a1cc_283_0.png)


    Figure 14-11: The three components of XMMS


    To open the other components, click the tiny EQ button in the main window for
    the Equalizer, or click the PL button for the Playlist. You can also move the
    various components around, just like a real component stereo, so that they are
    stacked one on top of the other, side by side, or in whatever configuration you
    want; just drag them around until they all look the way you want them to. And
    don''t worry about having to fuss with such things again—the next time you run
    XMMS, the components will reappear just the way you left them when you last exited
    the program.


    # Playing Audio Files in XMMS


    Of course, the main purpose of XMMS is to play audio files, so to get down to
    business, click the Add button at the bottom-left corner of the Playlist window,
    and a Load files window will appear. You then have three different ways in which
    to proceed:


    +   • If you want to play just one song, navigate to the song you want to play,
    select it (by clicking it once), and then click the Add button, which will also
    close the window.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '+   • If you would like to play more than one song, click each of the songs
    you want to play while holding down the **CTRL** key (Figure 14-12). The songs
    you select will then be highlighted in blue. When you have finished making your
    selections, release the **CTRL** key, click the **Add selected files** button,
    and then click **Close**.


    ![](img/3badae5570de77b990135448f8a8a1cc_284_0.png)


    *Figure 14-12: Adding multiple tunes from a single folder to an XMMS playlist*


    +   • If you would like to play all of the songs in a directory, click the **Add
    all files in directory** button, and then click **Close**.


    If you would like to add still other songs located in still other folders, hold
    off on closing the Load files window, and navigate to those folders to select
    the songs you want to add. When you have finally added all the songs you want
    to add from the various relevant folders, you can then click the **Close** button
    to close the window. Whatever approach you take, the song or songs you added will
    then appear listed in the Playlist window (Figure 14-13).


    ![](img/3badae5570de77b990135448f8a8a1cc_284_1.png)


    *Figure 14-13: Selected songs listed in the XMMS Playlist window*


    You can then click the **Play** button in the main window to hear your selections.'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'If you would like to play the songs you''ve been selecting in random order
    and/or over and over in an endless loop, you can tell XMMS to do so by clicking
    either or both of the **Random** and **Loop** buttons in the main player window
    (Figure 14-14).


    ![](img/3badae5570de77b990135448f8a8a1cc_285_0.png)


    *Figure 14-14: The Random and Loop buttons in the main XMMS window*


    # ## Creating an XMMS Playlist File


    If in the future you would like to be able to play the same group of songs you''ve
    selected without having to go through all the fuss of selecting them each and
    every time out, you can do so by creating a playlist file. As you might well imagine,
    this is a very handy feature. Say, for example, that you want to create a playlist
    of your favorite songs by various artists, but these songs are located, quite
    naturally, in a variety of different folders. In this case, coming up with such
    a list of songs every time you wanted to play them would end up being quite a
    pain in the posterior, to put it somewhat politely. Creating a playlist file for
    those songs, however, would make the somewhat tedious playlist assembly process
    a one-time effort.


    To create a playlist file from the songs you''ve added to the XMMS Playlist window,
    here''s what you need to do:


    +   1. Click, but don''t release, the List button at the bottom-right corner of
    the Playlist window (Figure 14-13).

    +   2. Select **Save** from the pop-up menu, and release the mouse button.

    +   3. In the Save Playlist window, which then appears, type in /home/username/My
    Documents/My Music/playlisttitle.m3u (substitute your own username and playlist
    title for username and playlisttitle). In my case, for example, I typed /home/rg/My
    Documents/My Music/MyFaves.m3u.

    +   4. Once you''ve finished, click **OK**, and XMMS will save your new playlist.

    +   5. After that, all you have to do to play the list is double-click the M3U
    file (.m3u is the file extension for the playlist) for that list, and XMMS will
    start right up playing the songs listed therein.


    You can also load a playlist file while already running XMMS. If you already have
    some tunes queued up in the XMMS Playlist Window and would like to remove them,
    click the **Sub** button (Figure 14-13), but don''t release the mouse button.
    In the pop-up menu, select **All**, and release the mouse button. The songs in
    the Playlist window will be gone. You can then add your already configured playlist
    by clicking the List button, after which a Load playlist'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'window will appear. In that window, locate your playlist, select it (by clicking
    it once), and then click the OK button. Your saved list will then appear in the
    XMMS Playlist window.


    # **Project 14B: Using XMMS Skins**


    One of the most fun things about XMMS, if you’re into that sort of thing, is that
    it allows you to directly change its appearance by using customized interface
    themes, called skins. The default skin for XMMS in Xandros is called `7947-plastic`,
    and it more or less follows the default theme of the rest of the system. There
    are, however, several other XMMS skins bundled with your system, examples of which
    are shown in Figure 14-15.


    ![](img/3badae5570de77b990135448f8a8a1cc_286_0.png)


    *Figure 14-15: Changing the looks of XMMS with skins*


    # **14B-1: Changing Skins**


    What you are going to do in this part of the project is change the default 7947-plastic
    skin (shown in Figure 14-11) to the UltrafinaSEM skin (Figure 14-16), which for
    my money looks a lot better. You may beg to differ, but just humor me for now.


    ![](img/3badae5570de77b990135448f8a8a1cc_286_1.png)


    *Figure 14-16: XMMS in the UltrafinaSEM skin*'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'To bring about this remarkable transformation, right-click anywhere on the
    main XMMS program window, and from the pop-up menu select **Options > Skin Browser**.


    This will open the *Skin selector* window (see Figure 14-17); scroll down until
    you find UltrafinaSEM. Once you see it, click it. Like magic, the transformation
    will be complete.


    ![](img/3badae5570de77b990135448f8a8a1cc_287_0.png)


    *Figure 14-17: The XMMS Skin selector window*


    As you no doubt will have noticed as you try out the various skins in the Skin
    browser, there is a lot of variation in the world of skins. Some can be so wild
    that you can barely use them, while others may be quite dull and very easy on
    the eye.


    There is also the configuration of your XMMS components to consider. You may agree
    that the UltrafinaSEM skin looks much more handsome than the default 7947-plastik
    skin when the components are stacked on top of one another, as in Figure 14-16.
    However, place the components side by side while using UltrafinaSEM, and it all
    looks pretty weird, whereas a more traditional stereo-system skin, such as the
    one shown in Figure 14-18, seems much more the ticket.


    ![](img/3badae5570de77b990135448f8a8a1cc_287_1.png)


    *Figure 14-18: XMMS components stacked in classic stereo configuration*


    # **14B-2: Downloading Additional Skins**


    If you''ve gone through the whole lot of skin choices and found nothing to get
    your heart a-pumping, you can download still other skins from the Web. The XMMS
    site (www.xmms.org) has quite a few, but even more can be found on the Winamp
    site (http://classic.winamp.com/skins). Yes, you''ve'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'guessed right—Winamp skins and XMMS skins are interchangeable. Just be *sure*
    *not* to use those skins designed for Winamp 3, which will not work. You can tell
    which are which by the file extensions: Winamp 3 skins end in .wal, Winamp 2 skins
    (the XMMS compatibles) end in .zip, and native XMMS skins end in .wsz.


    There is an amazing variety of skins available from the Winamp site, so there
    should be something there to please you. When you find some skins that you like,
    download them in the usual manner.


    # 14B-3: Installing Your New Skins


    Once you have downloaded some new skins, you will have to make them available
    to XMMS by putting them in the right place on your system. You needn''t unzip
    them, though; you can use them as is, which saves you some minor grief. Anyway,
    at this stage of the game, this is most easily done by putting them in the .xmms
    folder within your Home folder.


    Directories preceded by a dot are normally hidden from view, so to locate the
    .xmms folder, you will need to go to the **View** menu in a Xandros File Manager
    window and select **Show Hidden Files**. If you are going to be accessing the
    XMMS Skins folder often, this would be a good time to use XF*MS*''s bookmark function,
    so as to make navigating back to the folder easier in the future.


    From there on in, it''s a simple drag-and-drop procedure. Just drag the downloaded
    skin files directly into the Skins folder inside .xmms, and that''s it. The next
    time you open the XMMS Skin selector, your new skins will be there waiting in
    the list.


    # Project 14C: XMMS Plug-Ins


    XMMS not only allows you to change its looks through the use of skins, but it
    also allows you to add various functions to the player through the use of *plug-ins*.
    Many of these plug-ins are already bundled with your system, while still others
    are available from Xandros Networks. There is a variety of such plug-ins, and
    they range in function from visualization modules (which provide you with animated
    graphical representations of the song you happen to be playing) to timer functions
    (which allow you to have XMMS start up and shut down, like an alarm clock, when
    you want).


    # 14C-1: Using What You''ve Got


    Many of the plug-ins you already have on your system are enabled by default in
    order to allow XMMS to do what it needs to do. To use the other, less-necessary
    plug-ins, however, you will need to enable them yourself. Let''s start out by
    taking a look at one of the simplest, called *On Screen Display*, which displays
    the details of the song you are playing on your screen outside the XMMS player
    itself (Figure 14-19).'
  merge: -1
  img_proc: true
- pgno: 289
  md: '![](img/3badae5570de77b990135448f8a8a1cc_289_0.png)


    *Figure 14.19: Song details displayed on-screen with the XMMS On Screen Display
    plug-in*


    To enable the plug-in, follow these steps:


    +   1. Right-click any of the XMMS components, and select **Options Preferences**
    in the pop-up menu that appears.

    +   2. When the XMMS Preferences window appears, click the **General Plugins**
    tab.

    +   3. In the General Plugins tab, select the **On Screen Display** plug-in by
    clicking it once.

    +   4. Next, check the *Enable plugin* box at the bottom-right corner of the window
    (Figure 14-20), and then click the **Apply** button. If you then play a song in
    XMMS, the artist, track number (within the playlist), and song title will appear
    in green at the bottom-left corner of your screen for three seconds.


    ![](img/3badae5570de77b990135448f8a8a1cc_289_1.png)


    All very cool . . . but green? And so small? And only three seconds? Fortunately,
    it is possible to configure most plug-ins to suit your own needs and desires.
    When you select a plug-in, the Configure button below the list of plug-ins list
    will become active (clickable) if that plug-in is configurable, as is the case
    with the On Screen Display plug-in.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# **14C-2: Changing the Display-Duration and Color Settings**


    To get a feel for how this works, let’s change the behavior of this particular
    plug-in by doing the following:


    +   1.  Select **On Screen Display** in the plug-in list (if you haven’t already
    done so) by clicking it once.


    +   2.  Next, click the **Configure** button, which will bring up the Configuration
    window for the On Screen Display plug-in (Figure 14-21); the options within the
    Configuration window for other plug-ins will, of course, be different.


    ![](img/3badae5570de77b990135448f8a8a1cc_290_0.png)


    +   3.  In that window, increase the amount of time the song information will
    appear on-screen by clicking the up arrow to the right of the word *Timeout* until
    the appropriate number of seconds is displayed in the box to the left of the arrows
    (I have mine at 20).


    +   4.  Once you have set the display time, click **Apply**.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '+   5. To change the color of the onscreen display, click the **Set** button
    to the far right of the word *Colour*, and a color-selection window (Figure 14-22)
    will appear.


    ![](img/3badae5570de77b990135448f8a8a1cc_291_0.png)


    Figure 14-22: Changing the color of the onscreen text displayed by the On Screen
    Display plug-in


    +   6. In the color wheel, click the color in which you would like your onscreen
    text to appear. You can then fine-tune your selection by clicking within the color
    bar to the right of the wheel.

    +   7. Once you have made your selection, click the **OK** button, and that window
    will disappear. You can then go ahead and click the **Apply** button in the Configuration
    window to complete this part of the process.


    # 14C-3: Changing the Display Font and Onscreen Position


    Now that you’ve gotten the display font and color taken care of, wrap things up
    by changing both the font and text size of the display, so as to make it all easier
    to see. Then change the onscreen location where it will be displayed. While still
    in the Configuration window, follow these steps:


    +   1. Click the **Set** button at the far right of the *Font* row, to bring up
    the XOSD (X On Screen Display) Font window.

    +   2. In the list of fonts in the left pane of the window, scroll down and select
    **helvetica** by clicking it once.

    +      > You will now notice that just below the preview pane at the bottom of
    the window the following message will appear: *This is a 2-byte font and may not
    be displayed correctly*. Well, we certainly don’t want anything that may not be
    displayed correctly, so it’s best to change your selection a bit.

    +   3. Scroll down a bit in the middle pane, and select **bold** just below the
    *iso8859-15* heading.

    +   4. Once you’ve done that, click the small diamond-shaped **Points** button
    next to the word *Metric*.

    +   5. Now select **24\*** in the *Size* pane on the right side of the window.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '+   6. Your font-selection window should now look like that in Figure 14-23.
    Assuming it does, click the OK button.


    ![](img/3badae5570de77b990135448f8a8a1cc_292_0.png)


    +   7. This will bring you back to the Configuration window, where you should
    then click Apply.


    +   8. To wrap things up, change the position of where the song information is
    displayed on-screen by using the set of arrow buttons that looks something like
    the navigation controls of the remote control unit for a DVD player (Figure 4-21).
    Just choose the position you prefer by clicking the appropriate arrow button.


    +   9. Once you have made your selection, click Apply.


    # 14C-4: Viewing Your Results


    After you have finished the configuration process, go ahead and close the Preferences
    window by clicking OK. In order to see the results of your efforts, play a tune
    or two in XMMS (or stop whatever tune you have playing, and then click the Play
    button again). The song information for the tune you are currently playing will
    then appear in its new color and font configuration at a new location on your
    screen.


    # Playing Around with Other Plug-Ins


    If you are excited by this plug-in business, you might want to try out some of
    the other plug-ins listed in various tabs of the Preferences window. The visualization
    plug-ins are always pleasant enough, as are the echo plug-ins, so you might want
    to try those. If you would like to download and install some other plug-ins via
    Xandros Networks, try xmms-alarm and xmms-goodnight, which allow you to start
    up and shut down XMMS automatically at the times you specify.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# Adding or Modifying Tags to Your MP3 and Ogg Files


    As you have probably noticed, when you play a piece of music in XMMS or other
    audio players (such as in iTunes or on an iPod), the song and album titles and
    artist’s name are displayed in the player window. If you’ve ever used iTunes in
    Windows or Mac OS, you will also have noticed that such audio files are grouped
    by genre. The data in each file that provides this and other information is called
    an ID3 tag, or, to keep things simple, tag.


    As mentioned earlier in the chapter, if you rip a tune from a CD while not connected
    to the Internet, or if the album or song you are ripping is not included in the
    online CD lookup database, this information will not be added to your MP3 or Ogg
    file. Fortunately, you can add or alter this information yourself. To do this
    in XMMS, select one of the songs in the Playlist window by clicking it once. Then,
    click, but do not release, the Mice button in the Playlist window, select Info,
    and then release the mouse button. A File Info window for the song you have selected
    will then appear (Figure 14-24).


    ![](img/3badae5570de77b990135448f8a8a1cc_293_0.png)


    Figure 14-24: Editing the tags of your audio files


    To alter or supply any information within the tag, just input the data in the
    appropriate box or, in the case of genre information, select the appropriate choice
    from the drop-down menu next to the word Genre. When you have finished, click
    Save; the information you added or altered will be added to the tag of the audio
    file.


    # EasyTAG


    If you have a lot of MP3s and Ogg files that need major tag revisions, a handy
    program you might want to add to your repertoire is EasyTAG (Figure 14-25), essentially
    a tag editor on steroids. You can easily download and install EasyTAG using Xandros
    Network. Just make sure Debian unsupported site repository is enabled, type easytag,
    and then press ENTER to locate the file.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '![](img/3badae5570de77b990135448f8a8a1cc_294_0.png)


    # ## Listening to Internet Broadcast Streams


    One of the coolest features of the Internet is streaming media, which is essentially
    live or taped, audio or video, Internet broadcasts. Such broadcasts can come in
    a variety of streaming formats, which are basically compression formats that allow
    the data to move across the Internet at as small a size as possible. Unfortunately,
    Linux cannot yet deal with the two most common of these streaming formats, Windows
    Media Player and Apple’s QuickTime, at least not in any simple way, though it
    can play downloaded files in those formats. Fortunately, there are other media-streaming
    formats available on the Internet, such as RealMedia. In addition, since streaming-media
    formats are essentially space-saving compression formats, it is only natural that
    MP3 and Ogg Vorbis, both audio-compression formats themselves, have also come
    to be used as streaming-media formats for Internet audio broadcasts.


    # Project 14D: Real Player 10


    RealPlayer (Figure 14-26) is one of the most popular media players in the computer
    world. Fortunately, it not only comes in Windows and Mac OS versions, but it is
    also available for Linux. RealMedia streams, specifically meant for use with RealPlayer,
    are widely available and provided by many mainstream broadcasters, both local
    and international.


    # 14D-1: Setting Up RealPlayer


    To get started, you first need to set up RealPlayer 10. To do this, go to the
    Launch menu and select Applications ▸ Multimedia ▸ RealPlayer 10. After you do
    this, the RealPlayer Setup Assistant will appear (Figure 14-27).'
  merge: -1
  img_proc: true
- pgno: 295
  md: '![](img/3badae5570de77b990135448f8a8a1cc_295_0.png)


    ![](img/3badae5570de77b990135448f8a8a1cc_295_1.png)


    There are only four steps in the wizard, and all are simple, requiring you to
    do little more than click a single button. Here are the steps of the wizard:


    +   1. **Welcome:** Just click **Forward**.


    +   2. **Release Notes:** Just click **Forward**.


    +   3. **License Agreement:** Read the agreement, and then click **Accept**.


    +   4. **About Finished:** Deselect *Check for updates* (it''s easier for you,
    and safer, to check for updates via Xandros Network), and then click **OK**.


    # **14D-2: Listening to RealMedia Streams with RealPlayer**


    Once you have completed these steps, the RealPlayer 10 window (see Figure 14-26)
    will appear, ready for action. For convenience''s sake, take it for a test drive
    by using National Public Radio as the source stream; you can, of course, choose
    any stream you like. If you don''t know any streams offhand, just follow along
    with me.'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'Here are the steps:


    +   1. Open your web browser and **go to www.npr.org**.

    +   2. When the page appears, click the link for the **NPR Program Stream**.

    +   3. The first time you do this, a new window will appear asking you whether
    you want to use RealPlayer or Windows Media Player to listen to the stream. Click
    the **NPR** link.

    +   4. Assuming you are using Firefox, a window will appear asking you what to
    do with the stream. The first item, *Open with*, should already be selected, with
    RealPlayer listed as the default helper application in the box to the right. That
    being the case, just click **OK**, and the NPR stream will soon begin playing.


    If would prefer not having to see this window *every time* you click a RealMedia
    stream, also check the box next to the words *Use this automatically for files
    like this from now on*, though I would recommend holding off on this step the
    first time *around* to make sure that RealPlayer actually does what it is supposed
    to do—not that it won’t, of course.


    # RealMedia Streams on Your Own


    Now that you’ve got the hang of things, you probably want some more streams to
    try out right away. There are plenty of sites out there with RealMedia streams,
    but let me steer you to some of my favorites to get you started (you may already
    know some of these):


    **Michael Feldman’s Whad’Ya Know?** www.notmuch.com/Show

    **Sounds Eclectic** http://soundselectic.com

    **Car Talk** http://cartalk.cars.com/Radio/Show

    **Radio Netherlands** www.rnw.nl

    **A Prairie Home Companion** www.prairiehome.org/listings


    # 14D-3: Embedded Versions of RealPlayer


    You may find that some RealMedia providers utilize a version of RealPlayer that
    is actually embedded in the web page itself or another one that the site pops
    up for that purpose, rather than the usual RealPlayer application window.


    If you would like to see an example of an embedded player at work, open your browser
    and go to Radio Sweden’s Svea site at www.sr.se/‘p3/svea. When the page appears,
    click the **Lysana** (which means *Listen*) button, and a small web page will
    open with RealPlayer embedded therein playing the Svea stream (Figure 14-28).


    Svea, by the way, plays pop, rock, and, slightly alternative songs by Swedish
    artists in both English and Swedish, in case you’re wondering what you’re getting
    into. It’s very cool, so don’t worry.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '![](img/3badae5570de77b990135448f8a8a1cc_297_0.png)


    # 14D-4: Playing Ogg Vorbis Streams with RealPlayer


    Not only does RealPlayer allow you to play RealMedia streams, but it also allows
    you to play Ogg Vorbis streams. A good example of one of the Ogg Vorbis broadcasters
    out there today is Radio France. Radio France has a number of program streams
    for Internet listeners in Windows Media Player format; however, they also have
    now begun providing Ogg Vorbis streams for all of their broadcast programs. The
    stream I recommend you try out is Fip, which is an exceedingly cool, eclectic
    collection of music of all genres; you will be constantly surprised by what they
    play. If you are worried about language, don''t: there is very little talk, and
    roughly 80 percent of the music played is in English.


    If you want to give streaming media in general, and Radio France in particular,
    a try, then go to the RealPlayer File menu and select Open Location. In the Open
    Location window that pops up, type http://ogg.tv-radio.fr:1441/encoder/fip.ogg.
    Your window should look like that in Figure 14-29.


    ![](img/3badae5570de77b990135448f8a8a1cc_297_1.png)'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'Once it does, click **OK**. Assuming you are already connected to the Internet,
    Rip should start playing after a few seconds of pre-buff ering. If you would like
    to be able to play Flip again in the future without having to type in the somewhat
    lengthy URL each time, you can bookmark the stream by going to the RealPlayer
    **Favorites** menu and selecting **Add to Favorites**. You can then get your daily
    dose of eclectic anytime you like by going to that menu and selecting **encoderFlip.ogg**.


    If you would like to try any of the other Radio France broadcast streams, go to
    www.radiofrance.fr/services/aide/diffire.php#ogg, and you will find a list of
    addresses. If, on the other hand, the more traditional variety of pop and rock
    is your cup of tea, another broadcaster offering Ogg Vorbis streams is Virgin
    Radio. Virgin Radio has both standard pop/rock and classic rock broadcast streams.
    To listen to Virgin Radio, go to the Virgin Radio site at www.virginradio.co.uk/thestation/index.html.


    # 14D-5: Playing SHOUTcast (MP3) Streams with RealPlayer


    If you happen to be at the Virgin Radio site, you will notice that most streams
    there are also available in MP3 format. RealPlayer is able to play those streams
    (referred to as *SHOUTcast* streams) in exactly the same way it did those in Ogg
    Vorbis format. Click one of the MP3 stream links on that page to give it a go.
    For a more eclectic variety of streams, you might instead try going to www.shoutcast.com,
    where you will see an extensive listing of the SHOUTcast MP3 streams. Once you
    find a stream that seems of interest to you, click the **Tune In** button for
    that stream. If you are a music lover in need of a trip, **Search** for and try
    out Radio Paradise, which is exceedingly cool.


    # Selecting SOUNDcast Streams with Streamtuner


    If you''ve taken a shine to the stations listed on the SHOUTcast site but would
    like a simpler way of browsing through the many streams available, you might consider
    installing **Streamtuner** (Figure 14-30). This is a simple application that displays
    all of the streams available on the SHOUTcast site and allows you to play them
    via Real Player, XMMS, or any other player of your choice.


    # Installing Streamtuner


    To install Streamtuner, just run Xandros Networks, and make sure that the *Debian
    unsupported six repository* is enabled. After checking that, type *streamtuner*
    in the text box next to the Search button, and then click **Search**. Streamtuner
    will then appear in the list of results below (it should be the only item listed).
    Click **Install**, and then follow the remaining simple installation steps you
    learned in Chapter 8.


    # Running and Using Streamtuner


    Now that Streamtuner is installed, you can run it via the **Launch** menu by selecting
    **Applications ▶ Multimedia ▶ streamtuner**. Then all you have to do is locate
    a stream you would like to play, double-click it, and then... well,'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'that’s it. The default audio player for MP3 streams (probably RealPlayer or
    XMMS) will open up and play the stream.


    ![](img/3badae5570de77b990135448f8a8a1cc_299_0.png)


    To aid you in your search for streams, you can also use the genre entries in the
    left panel of the Streamtuner window. Click the small arrow to the left of one
    of the genre headings there, and a list of subheadings will appear below. Click
