    so do the same if you''re so inclined.


    To do this, assuming cell B20 is still selected (and if it isn''t, click it first
    to do so), click the **bold** button in the button bar, and then click the **font
    color** button (two buttons to the right of the bold button- -the one with a big
    A on it). In the font color palette that appears (Figure 17-18), click the color
    you want for your text, which in this case would be red, and the text within the
    cell will automatically change to that color.


    ![](img/3badae5570de77b990135448f8a8a1cc_362_0.png)


    Finally, let''s see how well off you''ll be once your bills have been paid by
    determining your monthly remainder. To do this, click cell **B22**, type _, and
    then without typing or pressing anything other than your mouse button, go on to
    click cell **B7**, press the minus key (-), and then click cell **B22**. Your
    formula should now read =B7-B20. If it does, press ENTER, and you''ll instantly
    know what you''ll be at the end of the month. Your spreadsheet should now look
    like that in Figure 17-19.


    ![](img/3badae5570de77b990135448f8a8a1cc_362_1.png)'
  merge: -1
  img_proc: true
- pgno: 363
  md: '# **17A-3: Performing Some After-the-Fact Adjustments**


    You may have wondered why I asked you to set up more cells than seemed necessary,
    considering the data I asked you to input. Well, unexpected things do occasionally
    happen and memories do sometimes fail, so it''s always good to be able to make
    allowances for such unforeseen occurrences. For example, let''s say that after
    setting up your spreadsheet you suddenly remember that you also get a bit of money
    each month from your once-a-week tutoring sessions at the local junior college
    and, very important, that you forgot to include your food and entertainment expenses
    in your list of expenditures. Now, because you have space for these items and
    have set up your formulae to automatically include them, making an adjustment
    is hardly a problem.


    Give it a try yourself and see what I mean, by adding one new source of income
    under the *Income* heading and two more expenditures under the *Expenditures*
    heading. After you type in the amounts for these new items, the totals in your
    various formula fields will automatically change to account for the new entries.
    Pretty cool, don''t you think?


    # **17A-4: Doing a Little More Math**


    Now that you know your monthly worth, let''s get back to the business of that
    car of yours. To figure out how many months it will take you before you''ve saved
    up enough for your new $40,000 SAAB 9-7X, click in a cell away from everything
    you''ve just typed, such as cell F4, and type in a new formula. What you want
    to include in this formula is the total price of your new car, minus the $9,000
    estimated trade-in for your present one, *divided by 70 percent* of your monthly
    leftover cash, which is the amount you want to put toward the purchase of your
    new wheels. You would thus start by typing *=(40000-9000)*. What you have typed
    so far is the cost of the car, minus the trade-in amount, *divided by . . . well,
    that comes next.*


    Now click cell B22, press the asterisk key (*), which is the symbol used to represent
    multiplication. Type _.70* (for 70 percent) and a close, or right, parenthesis.
    Your formula should now be something like *=(40000-9000)/(B22*.70)*, or *(car
    cost, minus trade-in)* divided by *(monthly savings times 70 percent)*. Now press
    ENTER to see how many months you have to wait.


    Since cell B22, which is included in your formula, is in currency format, your
    result in cell F4 will also be in that format. After all, your spreadsheet doesn''t
    know what you are driving at (or, in our case, would that be *driving in*). If
    this bothers you, right-click in that cell, and then select **Format Cells** in
    the pop-up menu.'
  merge: -1
  img_proc: true
- pgno: 364
  md: 'When the Format Cells window (Figure 17-20) appears, click the Numbers tab,
    and then click Number in the Category box and -1234.12 in the Format box. If you
    prefer a rounded-off number to one ending in a fractional amount, click -1234
    in the Format box instead. Once you are finished, click OK, and your cell will
    no longer be in currency format.


    # 17A-5: Printing Your Spreadsheet


    The area of a spreadsheet is quite large, so if you want to print out just the
    area that you have actually used, you need to first define the print region, or
    Print Range. In the case of your spreadsheet, you would highlight just the area
    you actually used (we''ll leave out the calculation bit you did in section 17A-4)
    by clicking your mouse button in cell A1 and then, while holding down your mouse
    button, drag it to cell B22. The entire area will then be highlighted in black.
    Now go to the Format menu and select Print Ranges ▷ Define, and that area will
    be bordered by a solid black line. If you want to see what your document will
    look like when printed, go to the File menu and select Page Preview.


    It might be pretty hard to see things clearly in the preview window. If so, go
    to the small drop-down menu button with a percentage in it at the far right of
    the first row of buttons, and select 100%. Your window, and the document within
    it, should then look something like that in Figure 17-21. If things look right,
    you can go ahead and print it.


    ![](img/3badae5570de77b990135448f8a8a1cc_364_0.png)


    *Figure 17-20: Changing font properties within a cell*'
  merge: -1
  img_proc: true
- pgno: 365
  md: '![](img/3badae5570de77b990135448f8a8a1cc_365_0.png)


    # Project 17B: Creating a Newsletter with OpenOffice.org Draw


    An overlooked, but actually quite useful, application within OpenOffice.org’s
    suite is Draw (Figure 17-22). Draw, as its name implies, can be used to create
    vector-based drawings, images in which the various shapes are based on a series
    of mathematical formulae, as I mentioned in Chapter 16. More important for many
    users is the fact that it can be used as a simple page-layout program. To get
    a feel for what you can do with Draw in this department, I will lead you through
    a little project from which you will learn how to create a simple newsletter.


    # 17B-1: Getting Started


    To get started, first run Draw by going to the **Launch** menu and selecting **Applications
    ▶ OpenOffice.org ▶ Tools ▶ Drawing Editor**. Once Draw appears, change the margins
    of your new document by going to the **Format** menu and selecting **Page**.


    When the Page Setup window appears, reduce the margins for all sides to 0.50 in
    the *Margins* section in the bottom-left quadrant of that window in order to give
    yourself more room in which to work. When complete, your window should look like
    that in Figure 17-23.'
  merge: -1
  img_proc: true
- pgno: 366
  md: 'In case you’re wondering, yes, you can change your margins within OpenOffice.org
    Writer in the same way.


    ![](img/3badae5570de77b990135448f8a8a1cc_366_0.png)


    *Figure 17-22: OpenOffice.org Draw*


    ![](img/3badae5570de77b990135448f8a8a1cc_366_1.png)


    *Figure 17-23: Changing page margins in Draw*'
  merge: -1
  img_proc: true
- pgno: 367
  md: '# **17B-2: Creating a Title Banner**


    Now let’s start adding elements to the page by working first on a title banner.
    To get started, just follow these steps:


    +   1. Click the **text tool** button on the left side of the main window, the
    button with a big T in it. Click your mouse in the top-left corner of the page;
    then drag your mouse until you get to the **right margin**, but, of course, a
    bit farther down so as to create a fairly large rectangle.

    +   2. In that rectangle, type a title for your newsletter, press **ENTER**, and
    then give it a subtitle.

    +   3. Once you’ve done that, highlight the title text, and then choose a rather
    dynamic-looking font from the drop-down font menu box in the button bar, and increase
    its font size so that it is in the **50 to 72** range, depending, of course, on
    how long the title is and on the font you’ve selected. Then set the title in boldface
    by clicking the **bold** button (remember, that’s the one that looks like a big
    B).

    +   4. Now highlight the subtitle and increase its font size, but keep it significantly
    smaller than the title.

    +   5. When finished, your title banner thus far should look something like that
    in Figure 17-24. If so, click anywhere else in the page to deselect the text box.


    ![](img/3badae5570de77b990135448f8a8a1cc_367_0.png)


    *Figure 17-24: Creating a title banner in your newsletter*


    +   6. Now add a background to your banner by clicking the slashed border around
    your text box.

    +   At this point, the border should disappear, but the little green squares around
    its periphery should remain. This means you are no longer in text-input mode and
    can now apply border and fill attributes to the text box itself.

    +   7. In the drop-down menu box next to the paint-can icon in the second row
    of buttons, select **Gradient**, and then in the drop-down menu box next to that,
    select **Gradient 1** (Figure 17-25).

    +   8. Your title banner now will have a rather nice background; however, as you
    will probably notice, the title text will be rather hard to see. To correct this,
    get back into text-input mode by double-clicking your title banner, and then,
    once the slashed borders reappear, select the title'
  merge: -1
  img_proc: true
- pgno: 368
  md: 'text and change the font color to white or any other light color. You can also
    change font colors via the font color button, which is the one right next to the
    underline button.


    +   9.  Everything now should be pretty much lunky-dory except for the fact that
    title text may be too close to the top of the banner box.


    ![](img/3badae5570de77b990135448f8a8a1cc_368_0.png)


    +   10. To remedy this, click the slashed border once, to exit text-input mode.
    Then, assuming the slashed border is gone but the green squares are still there,
    right-click the banner area, and select Text in the pop-up menu.


    +   11. When the Text window appears, change the figure in the Top box within
    the Spacing to borders section to something like 0.24\" or so, and then click
    OK. The text in your title header should now look more appropriately placed.


    To finish off the title-banner area, you might want to add another text box in
    which to show the volume number, location, and date for your newsletter. Place
    this beneath the one already in place containing your title and subtitle. Type
    in the appropriate data, and then highlight the text and change the font to boldface
    and white. The font size should also be smaller than that for your subtitle. You
    can choose any font you think looks good for this purpose.


    After that, exit text-input mode by clicking the border of the text box once.
    Now, in the drop-down menu next to the paint-can icon, select Color, and then
    select Black in the drop-down menu next to that. When you have finished, click
    anywhere else in the page to deselect your new text box. At this point, your title
    banner should look something like that in Figure 17-26.


    ![](img/3badae5570de77b990135448f8a8a1cc_368_1.png)'
  merge: -1
  img_proc: true
- pgno: 369
  md: '# 17B-3: Adding Text and Image Fields


    Now that you have your title banner set up, it’s time to add some content to your
    newsletter. You will be setting up your page so that it will have two columns,
    with an image at the top of the right column. To do this, just follow these steps:


    +   1.  Create a new text box on the left side of the page but beneath your title
    banner. Start at the left margin, about an eighth of an inch below your banner
    area, and then drag your mouse until the box reaches the margin line at the bottom
    of the page. The column should cover just under 50 percent of the page in terms
    of width.


    +   2.  Now type in whatever you want in this column, differentiating between
    titles and body by means of font size and style.


    +   3.  When you are finished, click anywhere else on the page to deselect this
    text box.


    +   4.  Next, add an image to the right side of the page, much as you did with
    Writer, by going to the **Insert** menu and selecting **Graphics**.


    +   5.  Once you have inserted the graphic, resize it (again, much as you did
    in Writer) so that it will fit within the area for the right column, again at
    just under 50 percent of the page in width. Remember to hold down the **SHIFT**
    key as you do this in order to retain the height-to-width aspect ratio of the
    image.


    +   6.  When you’ve finished, click anywhere within the page to deselect the image.


    +   7.  Finally, add a text box beneath the image, and type whatever information
    you want in it.


    +   8.  Now click in any open space within the page to deselect that text box,
    and you will have the makings of a newsletter, something like that in Figure 17-27.


    If you would now like to move on and create a second page for your newsletter,
    you can add a page by going to the **Insert** menu and selecting **Slide**, which
    is Draw parlance for *page*.'
  merge: -1
  img_proc: true
- pgno: 370
  md: '![](img/3badae5570de77b990135448f8a8a1cc_370_0.png)


    # Other OpenOffice.org Applications


    There are also a few other applications included with the OpenOffice.org suite
    that I will not be covering for lack of space. These include the Microsoft PowerPoint-compatible
    presentation program, *Impress*, a mathematical formula editor, and a web page
    editor, all of which can be run from the **Launch** menu (**OpenOffice.org** >
    *Presentation*, **OpenOffice.org** > *Tools* > **Formula Editor**, and **OpenOffice.org**
    > *Tools* > **HTML Document**, respectively).


    # Project 17C: Creating a Business Card with glabels


    You can create business cards and various kinds of labels in OpenOffice.org Writer,
    but my favorite application for this particular task is *glLabels*, a very-easy-to-use
    label and business-card design and printing application. It supports'
  merge: -1
  img_proc: true
- pgno: 371
  md: 'pretty much all of the preformatted card and label stock available from companies
    such as Avery, which means that it can also be used to design and print CD labels
    and jewel case inserts.


    # 17C-1: Downloading, Installing, and Running gLabels


    You can get gLabels via Xandros Networks, but you must first be sure that you
    have selected **Debian Unsupported Site** in the Application Sources list (Edit
    ➛ Set Application Sources). Then just type glabels in the text box at the top
    of the window, and click the Search button. When the results of your search appear
    in the pane below, click **Install** next to glabels, which should be the only
    item listed, and then follow the usual procedure for installing files via Xandros
    Networks.


    Once gLabels is installed, you can run it by going to the **Launch** menu and
    selecting **Applications ➛ Office ➛ gLabels Label Designer**. If it doesn''t happen
    to be there yet (it will be the next time you start up your system), run it via
    the Run Command window instead (**Launch ➛ Run Command**), by typing glabels and
    then clicking **Run**.


    # 17C-2: Setting Up Your Business Card


    To get started with your card project, click the **New** button, and the New Label
    or Card window will appear (Figure 17-28).


    ![](img/3badae5570de77b990135448f8a8a1cc_371_0.png)


    In that window, first select the paper size of the card stock you will be using
    (the default is US *Letter*), and then select the brand and type of the card stock
    itself. The choices are listed with description and product number, so you should
    have no problems. Once you have made your selection, click the **OK** button,
    and a design grid will appear in the main window.'
  merge: -1
  img_proc: true
- pgno: 372
  md: '# # 17C-3: Designing Your Business Cards


    For learning purposes, we will be creating a rather elaborate, some might say
    gaudy, business card that includes a graphic, a shape, a line, and two or three
    different fonts. Of course, when you create one of your own, you might prefer
    something a bit tamer, but, as I said, this is for learning purposes.


    # ## Phase One: Adding an Image to Your Card


    To start out, you will add an image to your card. You can choose anything you
    like—a photo, a logo, a line drawing, or whatever else you come up with. To insert
    the image into the design grid, here’s what you need to do:


    +   1. Click the **image** button, which is the sixth item in the second row of
    buttons (the one with a little house on it).

    +   2. Next, click your mouse button at one of the corners where your graphic
    will actually be situated, and then drag your mouse until the area that you would
    like to fill with that image is covered in a checkerboard-patterned rectangle,
    much like the one you see in Figure 17-29.


    ![](img/3badae5570de77b990135448f8a8a1cc_372_0.png)


    > Figure 17-29: Inserting a graphic into your business-card layout


    +   3. Now insert the image by clicking the **Browse** button in the right pane
    of the window and navigating to and selecting your image (by clicking it once)
    in the Load image window that appears.

    +   4. Once you have made your selection, click the **OK** button. Your image
    will then appear within the previously checkered rectangle within the design grid.'
  merge: -1
  img_proc: true
- pgno: 373
  md: '> *NOTE* *At this point, you might want to go ahead and save your image so
    as to take a load off your system''s memory (and to avoid any unfortunate mishaps).*


    # Phase Two: Adding Text to Your Card


    Now we''ll add some banner text to spread across the top of the card. Here are
    the steps:


    +   1. Click the **font** button, which is the second button in the second row
    of icons (the one that looks like a capital T), and then click once in any empty
    area within the design grid.

    +   2. In the right pane of the window, type whatever you want to place in the
    banner—for example, your name or a real or fictitious business name.

    +   3. Once you''ve done that, drag the text box within the design grid to the
    very top red line, and then stretch it so that the green dots along the borders
    of the box fill the available space within the red borders of the design grid.

    +   4. Next, choose a substantial-looking font and as large a font size as will
    fit in the appropriate boxes at the bottom of the window. Also be sure to click
    the **center** button and, if you like, the **bold** button as well. You might
    also want to choose a new color for the banner text.


    When you are finished, your window should then look something like that in Figure
    17-30, making allowances, of course, for your own font, text, and image selections.


    ![](img/3badae5570de77b990135448f8a8a1cc_373_0.png)


    *Figure 17-30: Adding banner text to your business card*'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# Phase Three: Adding Subtext to Your Banner Text


    Now that you have your image and banner text in place, let''s add some subtext
    to that banner. This could be a message or a slogan that would have meaning in
    relation to the content of the banner text. For example, if your banner text consists
    of your name, the subtext could be something like *Nice Guy Extraordinaire*.


    Anyway, go about this in the same way you added the banner text, but this time
    around choose a slightly more modest and less-heavy font in a different color
    and in a smaller font size. Then center the subtext directly beneath the banner
    text.


    # Phase Four: Adding a Line Beneath Your Banner


    Before moving on to adding your address, phone number, and email address, you
    might want to differentiate the banner area of the card by adding a horizontal
    line beneath the two banner elements (the banner text and subtext). Here''s what
    you need to do to bring it about:


    +   1. Click the **line tool** button (that''s the fourth button in the second
    row of icons).

    +   2. Next, click below the left end of your banner area and then drag your mouse
    straight across the screen until you reach the other end, whereupon you can release
    the mouse button.

    +   3. Finally, go to the right pane of the window and select a different, preferably
    bright, color for the line (red is nice). Once you''ve done all that, your card
    should look like a variation on that shown in Figure 17-31.


    ![](img/3badae5570de77b990135448f8a8a1cc_374_0.png)


    Figure 17-31: Adding a line to your business card'
  merge: -1
  img_proc: true
- pgno: 375
  md: '# Phase Five: Adding Your Address, Phone Number, and Email Address


    Now that most of the main elements are in place, go ahead and add your more vital
    statistics. You can do this in the same way you added your banner text and subtext,
    but this time be sure to use a smaller and more conservative font and in a darker
    color. You will also probably want to increase the line spacing in this text field.
    You can do this by selecting the address text field, clicking on the **Style**
    tab in the right pane of the window, and adjusting the numbers in the *Line Spacing*
    box (Figure 17-32).


    ![](img/3badae5570de77b990135448f8a8a1cc_375_0.png)


    If you want to have a bit more fun, you can also add an additional message or
    slogan at the bottom of the card in a different and slightly larger font. At this
    point, for safety purposes, you might also want to save your project one more
    time. Better safe than sorry, right?


    # Phase Six: Adding a Geometric Shape to Your Card


    You are just about finished, but in order to get just a tad more experience, why
    not add a big circle to the card as a background graphic? If you''re interested,
    here''s what you need to do:


    +   1.  Click the **ellipse** tool, which is the sixth button in the second row
    and looks like a tan circle.'
  merge: -1
  img_proc: true
- pgno: 376
  md: '+   2. Click near the top-center edge of your banner text, and then drag your
    mouse until you reach the bottom of the lowest element within the design grid.


    +   3. Drag both sides of the circle to form as perfect a circle as you can.


    +   4. Get rid of the circle’s black border by clicking the arrow button to the
    right of the color-selection button in the right pane and selecting No line.


    +   5. Once you’ve done that, click the Fill tab in the right pane, and then select
    as light a color for the circle as you can. Yellow, pink, or light blue would
    be a good choice.


    +   6. Finally, move the circle layer behind those of the other elements by right-clicking
    the circle itself and then selecting Order \> Send to Back.


    You are now finished, but to get a better view of your card before printing it
    out, go to the View menu, deselect Grid, and then go back again and deselect Markup.
    Doing this eliminates the background setup grid and takes you out of the default
    markup mode (this is the mode for creating a card) and into a viewing mode.


    Your card should look something like mine in Figure 17-33. Now go ahead and save
    your project.


    ![](img/3badae5570de77b990135448f8a8a1cc_376_0.png)


    > *Figure 17-33: The final product of your (or at least my) business card project*


    # **Phase Seven: Printing It Out**


    The only thing left for you to do now, should you want to take that final step,
    is print out the card. It is a good idea to first print a single copy on regular
    paper to see how it all looks. After that, insert the card stock in your printer,
    click the print icon (or select **Print** in the **File** menu) in the glabas
    window, and then click the **Print** button when the Print window appears. If
    you would like to see what your final printed page will look like before actually
    printing, click the **Print Preview** button first, which will show a whole slew
    of your cards ready to be transferred to card stock (Figure 17-34)—the number
    of cards that will appear in your preview window will equal the number of cards
    in the sheet of card stock you chose in section 17C.2.'
  merge: -1
  img_proc: true
- pgno: 377
  md: '![](img/3badae5570de77b990135448f8a8a1cc_377_0.png)


    # Other Productivity Applications You Already Have and Others

    You Might Want to Consider


    In addition to the applications I have covered in this chapter and elsewhere in
    the book, there are a few others that are included with your Xandros system. These
    include *Flow Chart* (also known as *Kivio*), which is an easy-to-use flowchart
    and diagram-creation app (**Launch ► Applications ► Graphics ► Flow Chart**);
    *Time Tracker* (also known as *KArm*), which helps you to keep track of how much
    time you spend on your various projects for billing purposes (**Launch ► Applications
    ► Utilities ► Time Tracker**); and *Reminder Message Scheduler* (also known as
    *KAlarm*), which can give pop-up reminders for events that you want to keep in
    mind, or even run certain applications or commands automatically at specified
    times (**Launch ► Applications ► Utilities ► Reminder Message Scheduler**).


    There are also numerous other productivity applications available via Xandros
    Networks in the Debian Unsupported Site repository, including *AbiWord*, a stand-alone,
    multipatform word processor; and the well-known *KOffice* suite (Figure 17-35),
    which I mentioned earlier in this chapter. KOffice comes with applications similar
    to those found in OpenOffice, plus a couple more.'
  merge: -1
  img_proc: true
- pgno: 378
  md: '![](img/3badae5570de77b990135448f8a8a1cc_378_0.png)


    *Figure 17-35: KOffice*


    # For Those of You Suffering Separation Anxiety


    If you are having trouble weaning yourself away from Windows completely, there
    is good news for you in the form of CrossOver Office, a 30-day trial version of
    which comes with the Open Circulation (the one in this book) and Surfside Editions
    of Xandros V3. If you want the full version, it can be had by upgrading to Xandros
    V3 Deluxe or Business Editions or can be purchased and downloaded via Xandros
    Networks.


    So what is it? Well, CrossOver Office is an application that allows you to run
    Microsoft Office and a number of other Windows applications and web browser plug-ins
    from within Xandros even if you do not have a dual-boot Windows/Xandros setup.
    To see which Windows applications and plugins are compatible with CrossOver Office
    (and to what degree they work), go to the CodeWeavers compatibility page at www.codeweavers.com/site/compatibility/browse
    and have a look.


    # Using CrossOver Office


    CrossOver Office usually runs invisibly in the background every time you run a
    Windows application in Xandros. The only times you actually need to deal with
    it directly are when you run it for the first time and when you actually install
    Windows apps. To set things up the first time around, go to the **Launch** menu
    and select **Applications** **CrossOver** **Office Setup**.'
  merge: -1
  img_proc: true
- pgno: 379
  md: 'A very simple setup wizard will appear. Just click **Next** in the first screen
    of the wizard, **Next** in the second page, and **Finish** in the third. After
    that, you will see the usual setup window (Figure 17-36), from which you can install
    applications from setup files on your hard disk or from Windows application CDs.


    ![](img/3badae5570de77b990135448f8a8a1cc_379_0.png)


    *Figure 17-36: The CrossOver Office Setup window*


    You can also use CrossOver Office to download and install various plug-ins for
    your web browser that are normally not available in Linux (see Figure 17-37).
    To do so, just click the **Install** button, and then in the Install Software
    window that appears, select the plug-in you want to install (QuickTime, Windows
    Media Player, and Shockwave are the ones most people want). Click **Next**, and
    then follow the remaining steps in the installation wizard.


    ![](img/3badae5570de77b990135448f8a8a1cc_379_1.png)


    *Figure 17-37: Installing web browser plug-ins via CrossOver Office*'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# **Project 17D: Installing a Windows Application via CrossOver Office**


    To show you how you can install a Windows application via CrossOver Office, I
    will use the example of a freeware text editor called *NoteTab Light* (Figure
    17-38). A text editor, in case you are wondering, is something like a word processor
    after liquefaction—it allows you type in your text but doesn''t, in its purest
    form, do any formatting. That means no fonts, no font sizes, no colors, and so
    on; and all of that means more speed when typing and scrolling.


    ![](img/3badae5570de77b990135448f8a8a1cc_380_0.png)


    *Figure 17-38: A Windows application, NoteTab Light, running in Xandros*


    Although your Xandros distro already has a text editor of its own (Text Editor),
    it is worth your while to try out NoteTab Light as it is a bit different in the
    way it is set up. If nothing else, it is a quick and easy download and will give
    you the chance to have some hands-on, no-cost experience installing a Windows
    application via OpenOffice. That said, go ahead and give it a try.


    # **17D-1: Downloading NoteTab Light**


    To get NoteTab Light, go to www.notetab.com, and click the EXE Package button
    under the *NoteTab Light* 4.95 heading (the version number might be higher by
    the time you read this). Once the download is complete, the file NoteTab_Setup.exe
    will appear in your Home folder (or wherever else you happened to have saved it)
    with a CrossOver Office icon (Figure 17-39).


    ![](img/3badae5570de77b990135448f8a8a1cc_380_1.png)


    *Figure 17-39: Windows .exe files appear with CrossOver Office icons*'
  merge: -1
  img_proc: true
- pgno: 381
  md: '# **17D-2: Installing NoteTab Light**


    To install NoteTab Light, just follow these steps (this is essentially the same
    procedure as for installing all other Windows applications):


    +   1. Double-click the **NoteTab Light Setup** file in your **Home** folder.
    If you are using the demo version of CrossOver Office, a warning window will appear
    telling you how many days you have left on your tryout period. Just click **OK**
    to continue.

    +   2. A window will then appear asking if you want to install NoteTab Light (Figure
    17-40). Click **Yes**.


    ![](img/3badae5570de77b990135448f8a8a1cc_381_0.png)


    *Figure 17-40: CrossOver Office checks with you before installing NoteTab Light*


    +   3. Another window will then most likely appear telling you that an access
    violation has occurred. Just click **OK**.

    +   4. The NoteTab Light Setup Wizard will then appear (Figure 17-41). Click **Next**
    to continue.


    ![](img/3badae5570de77b990135448f8a8a1cc_381_1.png)


    *Figure 17-41: The first page of the NoteTab Light Setup Wizard*


    +   5. In the next page of the wizard, select **I accept the agreement**, and
    then click **Next**.


    **NOTE**  *The actual text area in this license agreement window will be blank.*


    +   6. In the next page of the wizard, accept the default installation directory
    by clicking **Next**. This directory is actually a fake Windows directory in your
    Linux partition—not the real Windows partition in a dual-boot setup.'
  merge: -1
  img_proc: true
- pgno: 382
  md: '+   7. In the next page, click **Next** for a full installation of NoteTab
    Light.

    +   8. Click **Next** in the next page to accept the default Start menu shortcut
    location.

    +   9. In the next window, accept the default shortcut location (your desktop)
    by clicking **Next**.

    +   10. In the next window, click **Install** to begin the installation process.

    +   11. When the installation is finished, the wizard will tell you so (Figure
    17-42). Click **Finish** to complete the process.


    ![](img/3badae5570de77b990135448f8a8a1cc_382_0.png)


    *Figure 17-42: The Setup Wizard tells you when the installation process is complete*


    # **17D-3: Running NoteTab Light**


    Once installed, you have two ways of running NoteTab Light. The first way is to
    simply double-click the desktop icon created by the installer. The alternative
    is to go to the Launch menu and select **Windows Applications \ Programs \ NoteTab
    Light \ NoteTab Light** (Figure 17-43). If you don’t happen to remember having
    seen a menu item called Windows Applications before, you would be remembering
    it incorrectly—the menu item is added by CrossOver Office the first time you successfully
    install a Windows application.


    ![](img/3badae5570de77b990135448f8a8a1cc_382_1.png)


    *Figure 17-43: Running applications from the Windows Applications menu*'
  merge: -1
  img_proc: true
