- pgno: 430
  md: '# 20


    # WANT TO GET A LITTLE GEEKY?


    *Using Linux Commands*


    ![](img/3badae5570de77b990135448f8a8a1cc_430_0.png)


    Many people shy away from Linux because they envision it as a system for compu-geeks—an
    environment in which you do everything the hard way by using a command line. In
    this era of graphical interfaces, the idea of typing in commands to get things
    done seems a dreadful throwback to the days of DOS, and that puts many people
    off—especially those who remember what it was like in those “old days.” This reaction
    is fair enough, but it is not really an accurate reflection of the reality of
    the Linux world. After all, most Linux users today utilize some sort of graphical
    interface. They can, and often do, achieve all that they hope to achieve through
    drop-down menus and mouse clicks alone. In fact, with Xandros there is actually
    no need for the everyday user to resort to typing commands at all.


    Be that as it may, many people interested in Linux can’t resist having a go at
    the command line, and many expect any book on Linux to have a chapter covering
    the subject. There are also, to be quite honest, a few things that cannot be done
    without the use of the command line, though these are quite'
  merge: -1
  img_proc: true
- pgno: 431
  md: 'limited and not 100 percent necessary to function in the Xandros environment.
    Still, I have provided some examples of what you can do with the command line
    in the three projects in this chapter.


    # ## Don’t Lose Your Nerve


    The idea of playing around with commands might sound a bit forbidding to most,
    but you needn’t worry too much. I will limit my introduction to the hardcore basics—essentially
    just what you need to know in order to follow along with the projects in this
    chapter and most of the other things you might need to know to get by. And if
    that isn’t enough to soothe your worries, you can feel quite safe skipping over
    this chapter entirely if you are so inclined. Still, I would encourage you to
    give it all a try at least once, because using the command line can be as harmless
    and simple as anything else you do on your system. And, it can actually even provide
    you with a little fun, if you can believe that.


    # ### Meet the Command Console


    Open the *Linux Command Console* application in your Xandros system by going to
    the **Launch** menu and selecting **Applications ▶ System ▶ Console**. When the
    Console opens, it will, in all its simplicity, look much like Figure 20-1.


    ![](img/3badae5570de77b990135448f8a8a1cc_431_0.png)


    As you can see, all it says is `rg@xandrosVaio:~$`. In this case:


    +   The **rg** is my username.

    +   *xandrosVaio* is the name I gave my computer.

    +   The tilde (*~*) shows that I am in my Home folder.

    +   And the $ shows that I am in user, rather than root, mode.


    In your case, the username and computer name will be different. If your username
    is frog and your computer is called officeBeast, for example, the command line
    will say `frog@officeBeast:~$`.'
  merge: -1
  img_proc: true
- pgno: 432
  md: 'Typing in the Console is straightforward enough; you just type as you usually
    do. You can also delete and insert letters or phrases by using the **DELETE**
    and **BACKSPACE** keys and the cursor keys. For practice, try the following:


    +   1.  Type **I like strawberries so very much.**

    +   2.  Now, change *strawberries* to *cherries* (because cherries are, in fact,
    so much better). Just use your left cursor key to move the cursor in front of
    the first *s* in *strawberries*.

    +   3.  Next, tap on your **DELETE** key as many times as necessary to erase the
    word *strawberries* (uh, that would be 12 times, methinks).

    +   4.  Finally, just type *cherries*, and then use your right cursor key to move
    the cursor back to the end of this meaningful sentence.


    Now that you’ve completed this fascinating bit of typing practice, press the **ENTER**
    key. As you will almost immediately see, the Console’s response to your efforts
    thus far is merely a dismissive:


    ```

    ```bash

    bash: I: command not found.

    ```

    ```


    Although you’ve typed a string of text that has meaning to you, it means absolutely
    nothing to your system. In fact, the system was so shortsighted that it could
    see nothing other than the first word you typed in the Console: **I**. Because
    **I** is not a valid command, the system had no idea what do to with it.


    # ## Shells


    You may be wondering at this point what this bash business is all about and why
    it is talking to you. Well, Bash (Bourne Again Shell) is one of the many shells
    that are used in Linux systems, and the one that happens to come with your Xandros
    distro, and most others for that matter. A shell is actually a program that interprets
    the commands you type into the Console and delivers them to your system so that
    it can act on them. I like to think of it as a command-handling subsystem. Some
    scripting languages, as you will find out in the Briscoa section in this chapter,
    also have their own shells, but other than those few exceptions, you generally
    need not be unduly concerned with shells other than to know what they are.


    # # Nontoxic Commands


    As you now know, all of this typing is easy enough, but in order to actually do
    something useful with your Console, you need to type commands, and there are more
    of them than you could ever hope or need to know. To get you started, we will
    begin with some commands that are easy to understand, nontoxic, and completely
    child-friendly.'
  merge: -1
  img_proc: true
- pgno: 433
  md: '# **$ whoami**


    There is no command as easy, safe, or even as seemingly useless, as whoami. Rather
    than help those with multiple-personality disorders discover who they are at any
    given moment, the whoami command simply tells you which user is currently logged
    in. Try it out by typing whoami after the $ and then pressing the ENTER key. Remember
    that commands are case-sensitive; a $ is not the same a $, so type accordingly.


    The Console will now tell you the username of the person currently logged in.
    If you are logged in as frog, you should get frog as the answer to your command.
    My username is rg, so when I run the command, the result, as you can see in Figure
    20-2, is rg. You might also notice that the screen-shot was taken on a different
    computer, as the prompt is RGAcer rather than xandrosVaio as it was in Figure
    20-1.


    ![](img/3badae5570de77b990135448f8a8a1cc_433_0.png)


    # **$ pwd**


    If you essentially know who you are but aren''t exactly sure where you are, the
    pwd command (print working directory) should come in handy. The pwd command tells
    you exactly where the Console is in your directory tree.


    Let''s say, for example, that the Console is in my rg Home directory when I use
    the pwd command; I would, after typing the command and pressing the ENTER key,
    get /home/rg printed to my Console. You should get similar results if you try
    it out.


    > **NOTE** The word print, in this case, has nothing to do with your printer;
    it merely means that the response will be printed to, or displayed in, the Console.'
  merge: -1
  img_proc: true
- pgno: 434
  md: '# **$ ls**


    Another harmless but handy command is ls (list directory contents). The ls command
    shows you what is in your current directory, whatever that might be at the time.
    This is the nongraphical equivalent of double-clicking a folder in Nautilus to
    see what is inside. Try it out by typing ls and then pressing the ENTER key.


    Your results should list all of the folders in your Home directory (mine are shown
    in Figure 20-3), which is the default directory when you run the Console.


    ![](img/3badae5570de77b990135448f8a8a1cc_434_0.png)


    *Figure 20-3: The results of the ls command*


    You can also increase the functionality of the ls command, and almost any other
    command for that matter, through the use of flags (also called options). For example,
    you use the -R (recursive) flag with the ls command to show not only the list
    of files in the folder but also what is within the subfolders. To use a flag,
    just type the command, followed by a space, and then the flag, as is the case
    in $ls -R.


    # **$ su**


    When you have to change from being a normal user to being the root user via the
    Console, you can do so by using the su (superuser) command. There are two simple
    and straightforward steps involved. Open a new Console window, and then type su
    and press ENTER; after which you will be asked for your root password. As you
    type in your password, the password itself will not appear in the Console window,
    but that is how things are supposed to be, so don''t panic. When you are finished,
    press the ENTER key, and the prompt you usually see in your Console, username@computername:~,
    will be replaced by your root prompt, computername:/home/username#. Notice that
    instead of a $ at the end of the prompt, you now have a # instead, which indicates
    that you are in root mode.'
  merge: -1
  img_proc: true
- pgno: 435
  md: '# # exit


    You can get out of root and back to your normal user mode by using the exit command.
    Just type **exit** and press ENTER, and you will become your old self in user
    mode again. Very simple and handy. If you use the **exit** command while in user
    mode, you will exit the Console altogether—a command-line version of **quit**.


    # $ locate


    In contrast to the seemingly lightweight commands you have learned so far, the
    **locate** command is really quite useful. In fact, you might well find in a much
    easier, faster, and more effective method of finding files than the graphical
    search tool in the Launch menu. Using the **find** command is quite easy: you
    simply type in the command followed by a space and the name of the file you are
    searching for. You can use this command in either root or user mode.


    Give the **locate** command a try by searching for the icon file for the Instant
    Messaging application *Kopete*. To do this, type **locate kopete.png**, and press
    ENTER. The locations of the various **kopete.png** files will then appear in your
    Console, as you can see in Figure 20-4.


    ![](img/3badae5570de77b990135448f8a8a1cc_435_0.png)


    *Figure 20-4: The results of a search using the locate command*


    # # updatedb


    As you have just seen, the **locate** command can be quite handy; however, as
    you add files and applications to your system, you will need to update its database
    of filenames from time to time if you want to keep using it.


    To do this, become root using the **su** command, and then type **updatedb** (update
    database), followed by a tap on the ENTER key. It will seem that nothing is happening
    for a while (an even longer while if you have a lot of files), but don’t worry—progress
    is being made. Once your prompt returns, you will have successfully created the
    database file. After that, you can go on and use the **locate** command.'
  merge: -1
  img_proc: true
- pgno: 436
  md: '# Commands with Some Teeth


    The simple commands you have tried so far are all of the safe-and-sane, fire-marshall-approved
    variety; they merely print out information to your Console. Now you are going
    to *try* to get some real tangible results from the commands you type in. These
    commands are also essentially safe and sane if you follow my instructions.


    # $ mkdir


    You have already learned how to create folders by means of menus and your mouse,
    but you can also do this using the command line by means of the **mkdir** (make
    directory) command. To see how this command works, create a folder called *command_exp*
    (for command experiments) by typing **mkdir command_exp** and then pressing ENTER.
    The new folder should appear in your Home folder, so go ahead and check to see
    if it is there by clicking the user''s **Home** icon on your desktop.


    Okay, good, *bravo*! Now let''s create another new folder within that new folder—
    a *subfolder* if you will. We''ll call this one *sub*. So, just type **mkdir command_exp/sub**
    and then press ENTER. You can now take a peek and see if the subfolder appears
    within the *command_exp* folder, if you like.


    You have no doubt noticed that in order to create the subfolder, *sub*, you used
    a forward slash (/) after *command_exp*. Basically, when you use the forward slash,
    you are telling your system to execute a command on the item located to the right
    of the forward slash, and you are telling the system that the file is located
    in the folder to the left of the forward slash. You will see still more examples
    of the forward slash in action in the rest of this chapter.


    # $ cd


    Until now, you have been using the command line from your Home folder. With the
    **cd** (change directory) command, you can change from one folder to another via
    your Console by typing the command followed by the folder you want to enter. To
    take it out for a spin, let''s get inside the *command_exp* folder by typing **cd
    command_exp** and pressing ENTER. If you''ve done this correctly, the prompt in
    your Console should now read **username@computer-name:~/command_exp$**. If so,
    you can pat yourself on the back.


    # $ cp


    The **cp** (copy & paste) command allows you to copy a file and paste it in a
    new location in one swoop. To do this, the command needs to know where the file
    you want to copy is, what it is called, and where you want to copy it. To give
    it a try, copy any file you happen to have in your Home folder and paste it in
    your *command_exp* folder. For example, in my case I want to copy a file called
    *tawas.png* in my Home folder to my *command_exp* folder. I thus type **cp tawas.png
    command_exp/** and press ENTER, and then I will have a copy of *tawas.png* in
    my *command_exp* folder. The first expression after the **cp** command is the
    file you are copying (*tawas.png*); the second expression'
  merge: -1
  img_proc: true
- pgno: 437
  md: 'is the location where it is to be pasted (*command_exp/*). After you try it
    out, have a look within your *command_exp* folder to make sure the file you copied
    is there.


    So what happens if the file you want to copy isn’t in your Home folder? Say, for
    example, your *tawas.png* file is in the *command_exp* folder, and you want to
    place a copy of it in a *happy_pics* folder that is also located in the *command_exp*
    folder. Well, you actually have a couple of ways of going about it.


    One way is to first use the cd command you just learned to move into the *command_exp*
    folder. You then type `cd command_exp`, and then press **ENTER**, which places
    you in the *command_exp* folder. You then use the `cp` command to copy the *tawas.png*
    file and paste it in the *happy_pics* folder by typing `cp tawas.png happy_pics/`
    and then pressing **ENTER**.


    The second alternative is to do it all in one fell swoop using only the `cp` command.
    To go this route, type `cp command_exp/tawas.png command_exp/happy_pics/` and
    then press **ENTER**. This route is equally effective, although it involves a
    tad more typing.


    # $ rm


    The `rm` (remove) command, as its name implies, is used to remove files and empty
    folders—a sort of command-line version of moving things to Trash. The `rm` command,
    albeit very useful and easy to use, should be used with caution. Once you remove
    a file with this command, there is no going back—the file is gone for good.


    To play it safe, let’s try out the `rm` command by getting rid of that new copy
    of the file you moved to the *command_exp* folder moments ago. The basic `rm`
    command structure consists of the command itself, `rm`, followed by the name of
    the file that you want to remove. Assuming your Console shows you to be Home,
    you can remove the file by typing `rm command_exp/` followed by a tap on the `⏎
    ENTER` key. The file will then be gone, and gone for good.


    If the file is not in the Home folder, just use the `cd` command to move into
    the folder in which it is placed, and then use the `rm` command once there. As
    with the `cp` command, you can achieve the same thing in one go by typing `rm
    foldername/filename` and pressing **ENTER**.


    Now that we are essentially finished with the experimentation process, you might
    as well get rid of the *command_exp* folder. However, since that folder has a
    subfolder (sub) within it, the `rm` command cannot handle the job. This is because,
    as I mentioned before, the *command can be used only to remove files and empty
    folders*. To remove a folder and its contents as well, you need to add the recursive
    flag, `r`. To do this, just type `rm -r command_exp` and then press **ENTER**.
    Your *command_exp* folder and the subfolder within will then be but a memory.'
  merge: -1
  img_proc: true
- pgno: 438
  md: '# Project 20A: Command Practice—Playing Encrypted DVDs


    As you learned in Chapter 15, Xandros, for legal reasons, does not come with playback
    support for encrypted DVDs, which really puts a damper on things, since most commercial
    DVDs are of the encrypted variety. The good news is that you can install support
    for encrypted DVD playback. The only way to do this, however, is via the command
    line, which is a good example of how commands can come in handy once in a while.
    If you need or want to play DVDs, and get some command-line practice in the process,
    just follow along with the rest of this short project.


    # 20A-1: Downloading and Installing libdvdread3


    To play back encrypted DVDs, you need to install **libdvdcss**, which you can
    get via the script included in the *libdvdread3* package. That package may already
    be installed on your system, so it is a good idea to first see if it’s there.
    If not, you can easily install it via Xandros Networks. Here’s what you need to
    do:


    +   1. Open a Console window, type **locate libdvdread3**, and press **ENTER**.

    +   2. If the locations of the various libdvdread3 files are listed as the result
    of your search, go on to section 20A-2. If, on the other hand, nothing appears,
    you need to install the libdvdread3 package, which you can do by running the Xandros
    Networks application, typing: **libdvdread3** in its search box, clicking **Search**,
    and then clicking **Install** next to *libdvdread3* in the results that will appear
    in the pane below.


    # 20A-2: Downloading and Installing libdvdcx


    As I mentioned, the libdvdread3 package alone does not allow you to play back
    encrypted DVDs. It is instead a means by which you can download and install **libdvdcx**,
    which is the great enabler in this case. Since **libdvdcx** must be downloaded
    (via the Console), you must be connected to the Internet while doing the following:


    +   1. Become root by typing **su**, pressing **ENTER**, typing in your root password
    when prompted to do so, and then pressing **ENTER** again.

    +   2. Type `/usr/share/doc/libdvdread3/examples/install-css.sh` and press **ENTER**.


    This rather long command string tells your system to run the script called *install-css.sh*,
    which is located in the *examples* folder, located in the *libdvdread3* folder,
    located in the *doc* folder, located in the *share* folder, which is located in
    the *usr* folder. Wow! Oh, and that forward slash ( / ) at the very beginning
    of the command string tells your system that the *usr* folder is located at the
    very root of your file system, not in your Home folder.'
  merge: -1
  img_proc: true
