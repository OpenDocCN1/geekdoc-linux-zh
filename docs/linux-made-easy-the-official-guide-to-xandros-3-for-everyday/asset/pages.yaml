- pgno: 144
  md: '# 8


    # THE KEYS TO THE GATES OF OZ, OR THE GATES OF XANDROS ANYWAY


    *Expanding and Updating Your System via Xandros Networks*


    ![](img/3badae5570de77b990135448f8a8a1cc_144_0.png)


    I mentioned in Chapter 1 that the first time I ever heard of Xandros was from
    a friend who described the system as “cool.”


    Well, when I first gave Xandros a try, I thought it was really good and, more
    importantly, incredibly easy to use—easier, in fact, than Windows. The word “cool,”
    however, didn’t immediately pop into my mind. That is, until I first used Xandros
    Networks.


    What is Xandros Networks? Well, it is sort of a combination of things—a simple-to-use
    application (Figure 8-1) and a set of online repositories that houses an amazing
    array of applications and related files. The Xandros Networks (XN) application
    acts as an interface via which you can access those repositories and then easily
    download and install whatever you find of interest there. Now, I admit that what
    I’ve just described, on its own, might not initially sound all that impressive,
    but if you have a better understanding of what it is normally like to install
    an application in Linux, however, you will see why Xandros Networks is nothing
    short of a godsend.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '![](img/3badae5570de77b990135448f8a8a1cc_145_0.png)


    # Figure 8-1: The Xandros Networks application


    When you install an application in Linux, that application usually requires that
    you also install one or more other files that it needs in order to function. These
    files are called *dependencies*, and some dependencies have dependencies of their
    own. And, need I say that some of those dependencies have dependencies of their
    own. Chasing down, installing, and getting all those different parts to work correctly
    on your own can be a time-consuming and sometimes frustrating experience. This
    recurring dependency chase is often referred to as *dependency hell*, and rightfully
    so.


    This is where the “cool” comes into play. When you use Xandros NetworkS to download
    and install an application, XN also automatically downloads and installs all of
    the dependencies required in order for the application to run. So you don’t have
    to do any chasing down of this or that file, and you can be pretty sure that whatever
    you download will, in fact, run—and run as it is supposed to.


    # Impressed yet?


    If you still aren’t convinced, think about this: almost 98 percent of the applications
    available via Xandros NetworkS are free. Sure, you won’t get the pretty boxes
    and shiny shrink-wrap that you do when you buy a Windows application at the local
    computer store, but, hey . . . I said free! How can you not love that, eh?'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'And what about that other 2 percent that aren’t free, you ask? Well, most of
    those apps are commercial offerings that you would have to pay for anyway, but
    when they’re downloaded and installed via Xandros Networks, you can be sure that
    they will work on your system. These include applications such as CrossOver Office,
    which allows you to run certain Windows applications (such as MS Office) on your
    Xandros system, or popular games such as Quake III and Return to Castle Wolfenstein.


    # ## Xandros Networks First Time Out


    Well, let’s stop babbling about what Xandros Networks is and instead put it into
    action. To run XN, just double-click the Xandros Networks icon on the desktop,
    or go to the Launch menu and select Xandros Networks. (Xandros Networks is an
    Internet application, so you will have to be connected to the Internet when doing
    this.) After a few seconds, the Xandros Networks application will appear, and
    the first time out, it will go through a series of steps that are mostly hands-off
    for you.


    The first thing Xandros has to do, and it will do this every time you start it
    up, is take inventory of what is already in your system, thus providing it with
    a database that it can check in the future when you download applications. This
    allows Xandros Networks to know just what it needs (and doesn’t need!) to download
    in order to make your application work. During this time, you will see a Progress
    Update window (Figure 8-2), which will automatically disappear when the process
    is finished.


    ![](img/3badae5570de77b990135448f8a8a1cc_146_0.png)


    *Figure 8-2: Xandros Networks indicates its progress as it takes inventory of
    your system*


    In the next phase, Xandros Networks has to check out its online repositories in
    order to see what is available for you there.


    In the small window that appears (Figure 8-3) asking for your permission to do
    so, click OK, and the process will be strictly hands-off from there on in.


    ![](img/3badae5570de77b990135448f8a8a1cc_146_1.png)


    *Figure 8-3: Xandros Networks asks your permission to do an online search of available
    packages*'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'Oh, and in case you''re worried about mysterious things being down\-loaded
    to your hard disk, don''t be. XN will be downloading only lists and descriptions
    of what is available on its repositories, not the applications or files themselves.


    Xandros Networkswill show you what it''s doing in the Progress Update window,
    which will look like the window shown in Figure 8\-4 during the package\-list
    download phase.


    ![](img/3badae5570de77b990135448f8a8a1cc_147_0.png)


    When the package lists are downloaded, you will once again see the mercurial slide
    of the progress bar in the same window (see Figure 8\-2) while Xandros Networks
    rebuilds its package database. When the process is complete, the Progress Update
    window will disappear, and the various blank parts of the Xandros Networks window
    will fill in, finally looking like what you saw in Figure 8\-1.


    # ## Project 8A: Taking Xandros Networks Out for a Spin


    Now that Xandros Networks is up and ready to go, let''s take it out for a spin
    so that you can get a feel for how it works. In this project, we will do this
    by using it to download and install a simple\-but\-fun strategy game called Lines
    (also known as Klones) in which you try to remove the marbles that appear by lining
    them up in groups of five, as shown in Figure 8\-5.


    ![](img/3badae5570de77b990135448f8a8a1cc_147_1.png)'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'Here are the steps for downloading the game; it''s a good example of how to
    download any application in XN:


    +   1.  Click the \( + \) symbol next to New Applications in the left pane of
    the XN window.

    +   2.  When the list of subcategories appears under New Applications, click the
    \( + \) symbol next to Games.

    +   3.  When the list of subcategories appears under Games, click \(\)Strategy\(\).

    +   4.  A list of the various strategy games available via Xandros Networks will
    then appear in the top half of the right pane of the XN window. Click \(\)Lines\(\).

    +   5.  A description of Lines will now appear in the bottom half of the right
    pane (Figure 8-6). Click \(\)Install Lines\(\).


    ![](img/3badae5570de77b990135448f8a8a1cc_148_0.png)


    A new window, Install Software (Figure 8-7), will now appear, showing you what
    you are about to install, how big the download will be, and how much hard disk
    space will be used once the installation is complete.


    +   6.  Click \(\)OK\(\).'
  merge: -1
  img_proc: true
- pgno: 149
  md: '![](img/3badae5570de77b990135448f8a8a1cc_149_0.png)


    Figure 8-7: Xandros Networks tells you what you are about to install


    7.  You will now be asked to provide your Administrator’s (root) password in another
    window (Figure 8-8). Type your root password, not your user password, and click
    OK.


    ![](img/3badae5570de77b990135448f8a8a1cc_149_1.png)


    Figure 8-8: Xandros Networks asks for your root password


    Xandros Networks will now begin downloading the necessary files and will indicate
    its progress in an Updating System window (Figure 8-9). You can just sit tight
    for now, because there is nothing for you to do.


    ![](img/3badae5570de77b990135448f8a8a1cc_149_2.png)


    Figure 8-9: Xandros Networks shows the progress of the download process'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'Once the download is complete, XN will begin installing the application and
    required dependencies. When it has finished, the word Done will appear in the
    Updating System window (Figure 8-10), and you can click the Close button, thus
    ending the process.


    ![](img/3badae5570de77b990135448f8a8a1cc_150_0.png)


    *Figure 8-10: Xandros Networks tells you when it has completed the installation
    process*


    Now that the download and installation are complete, you can run Lines by going
    to the Launch menu and selecting Applications ▸ Games ▸ Strategy ▸ Lines. If you’ve
    finished with your downloading for now, you can also go ahead and quit the Xandros
    Networks application.


    # Installing More Than a Single Application in One Shot


    Now you know how to install an application via Xandros Networks, but what if you
    want to install more than one application at the same time? Well, if you click
    one of the categories in the left pane of the XN window while browsing through
    the available applications, a small box will appear next to each application in
    the list within the upper half of the top pane, as shown in Figure 8-11.


    ![](img/3badae5570de77b990135448f8a8a1cc_150_1.png)


    *Figure 8-11: Installing multiple applications simultaneously in Xandros Networks*'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'If you check that box (by clicking in it), you can then browse for other applications
    to install. When you find another one, click the checkbox for that one too, and
    then repeat the process for each additional application you would like to install.
    Finally, when you have finished checking boxes, click the **Install Selected Applications**
    button (Figure 8-12) just below the **Settings** menu or select the same item
    from the **File** menu itself.


    ![](img/3badae5570de77b990135448f8a8a1cc_151_0.png)


    After you click the **Install Selected Applications** button, the installation
    process will be essentially the same as the process you just performed in Project
    8A. The only difference will be that the window that shows you what you are about
    to download and install (like that in Figure 8-7) will now show all of the applications
    you are about to install, rather than just one.


    # ## Uninstalling Applications via Xandros Networks


    Xandros Networks not only allows you to install files and applications, but also
    allows you to remove them. For example, let''s say that you just installed Lines
    in the previous project, but don''t really think you''ll ever be using it. Well,
    no sweat, because you can remove it as easily as you installed it in the first
    place. Here''s how you go about it:


    +   1. In the text box next to the **Search** button, type the name of the application
    you want to remove. If you want to remove *Lines*, for example, you would type
    *lines*.

    +   2. Once you have typed the name of the application you want to remove, click
    **Search**. A list of packages matching, to some degree, the item you have entered
    will then appear in the top part of the right pane of the Xandros Networks window
    (Figure 8-13).

    +   3. Locate the item you want to remove, and then click **Remove**.


    After that, it is all pretty much the same process that you followed when installing
    the application, so I won''t go through the steps again here. When the process
    is done, however, you can go back to the **Launch** menu to look for the application.
    Unless you did something terribly odd, the application will be gone.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '![](img/3badae5570de77b990135448f8a8a1cc_152_0.png)


    # Project 8B: Browsing and Installing Applications via Expert View


    If you actually did try to remove Lines in the previous section, you may have
    noticed that in the Search Results section at the bottom of the left pane in the
    XN window, there were two sets of results: Standard and Expert (Figure 8-14).


    ![](img/3badae5570de77b990135448f8a8a1cc_152_1.png)'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'By enabling Expert View, you will be able to access yet another bundle of applications
    available to you via Xandros Networks, some of which can be rather interesting.
    In addition, once you''ve worked your way down to the next project, you will discover
    that Expert View is your key to an absolute gold mine of yet other applications
    available to you.


    In this project, you''ll get the chance to work with XN in Expert View by installing
    an utterly useless, but nevertheless amusing, little application called kodo,
    which is an odometer for your mouse. C''mon, haven''t you ever wondered how many
    miles of desktop travel you''ve covered? Anyway, here are the steps:


    +   1. Enable Expert View by going to the **Settings** menu and selecting **Expert
    View**.


    +   2. After a few seconds, a string of new categories will appear under the New
    Applications heading. If that heading happens to be closed, meaning you can see
    the heading but not the item categories beneath it, first click the + symbol to
    the left of that heading. Once the categories are visible, click **Games**.


    +   3. In the top half of the right pane in the XN window, scroll down until you
    find kodo. When you do, click it, and a description will appear below.


    +   4. Scroll down to the bottom of the explanation at the bottom of the right
    pane and click **Install Kodo**.


    Once you have completed these steps, the rest of the process is the same as the
    process you performed in Project 8A, so if you''ve forgotten, you can have a look
    back at the instructions in that section. After kodo is installed, you can give
    it a whirl, quite literally, by going to the **Launch** menu and selecting **Applications
    $\triangleright$ Games $\triangleright$ Toys $\triangleright$ Mouse Odometer**.


    Soon thereafter, kodo will appear at one of the corners of your desktop (Figure
    8-15). If and when you want to quit kodo, just click it, with either mouse button,
    and select **Quit** from the pop-up menu.


    ![](img/3badae5570de77b990135448f8a8a1cc_153_0.png)


    # Project 8C: Accessing Even More Applications and Having a Bit of Fun


    In the previous project, I let you in on an often-overlooked little secret—Xandros
    Networks not only allows you to install the applications that appeared in the
    various categories listed in the left pane of its window (both in Standard and
    Expert Views), but it also gives you access to a whole slew of other applications—applications
    not directly supported or guaranteed by Xandros, but applications that should
    work fine on your system. These are the applications'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'from what Xandros refers to as the *Debian Unsupported Site*. It is this cornucopia
    of easily accessible applications, and the ease with which you can find and install
    them, that makes the cool side of XN get I wasn’t-so-groovy, to resurrect a term
    I was loathe to use in its day. Ah, but I was so much older then . . .


    # ## 8C-1: Enabling the Debian Unsupported Site Repository


    To get started, you must first enable the Debian Unsupported Site repository,
    which you can do by following these two simple steps:


    +   1.  Go to the **Edit** menu and select **Set Application Sources**.

    +   2.  When the **Set Application Sources** window appears, check **Debian Unsupported
    Site**, and then click **OK**.


    The Xandros Networks application will then have to access the new repository site
    to see what is there. Because of the great size of that repository, this may take
    some time. Be a bit patient, because when it’s done, you’ll be ready for some
    real exploratory excitement.


    # ## 8C-2: Browsing Through the New Offerings


    Once Xandros Networks has finished its reading of the online repository files,
    it might be fun to have a look at what is offered. Just click the **New Applications**
    button in the main Xandros Networks window and have a look around. I am sure you
    will be overwhelmed at all there is to see.


    > NOTE **Expert View** *must be enabled in order for you to do this.*


    # ## 8C-3: Giving the Debian Repositories a Try and Having Some Fun with SuperKaramba


    Now that you see that you are much more greatly empowered than you were just moments
    ago, let’s give the new repository a try by downloading, installing, and working
    with a fun application called SuperKaramba, which is, in the words of its creators,
    “a tool that allows you to easily create interactive eye-candy on your KDE desktop.”


    Well, we won’t be using SuperKaramba to create any eye candy, which is probably
    a bit beyond the realm of the average user, but we will be using it to display
    and use eye candy created by others. Called *themes*, some examples can be seen
    in Figure 8-16.


    # **Phase One: Downloading and Installing SuperKaramba**


    +   1.  Type **superkaramba** in the text box at the top of the XN window.

    +   2.  Click the **Search** button.

    +   3.  In the list of results that appears below, click **Install** next to *superkaramba*.

    +   4.  After that, just proceed in the manner you learned earlier in this chapter.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '![](img/3badae5570de77b990135448f8a8a1cc_155_0.png)


    Figure 8-1-6: SuperKaramba themes


    # Phase Two: Downloading Some Themes


    In order to use SuperKaramba, you first need to have some themes. There are hundreds
    of these available, and most are available from the KDE-Look website. For the
    purposes of this project, we are going to try out three of the six themes shown
    in Figure 8-1-6: "New" TuxBar, Chrome Clock, and Karamtop. The others, in case
    you would like to try them out on your own, are KWeather-Karamba, Liquid XMMS,
    and Flat Calendar.


    To get the themes, just follow these steps:


    +   1. Open your web browser, and go to www.kde-look.org.

    +   2. Once the KDE-Look Page has loaded, scroll down about halfway or so, and
    then click Search Content.

    +   3. In the search box, select Karamba from the drop-down menu next to *type*,
    type the name of the first theme, *tuxbar*, in the second box (Name Contains);
    and then click Search.

    +   4. In the list of results that appears below, click "New" TuxBar.

    +   5. When the page for that theme appears, scroll down just a bit, and click
    the [download] link.

    +   6. Once the New TuxBar theme is downloaded, repeat the *process* for each
    of the remaining two themes, using *kweather* and *karamtop* as your search items.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# **Phase Three: Extracting the Theme Tarballs**


    The themes you''ve just downloaded are all in the form of compressed tarballs,
    so before you can use them, you will have to extract each one using the methods
    you learned in Chapter 5. Once you extract them, it would be a good idea to create
    a special folder in which to place them and all other themes you download in the
    future; KarambaThemes would be a fitting name for that folder. After creating
    the folder, move the folders for the three themes into it.


    # **Phase Four: Running SuperKaramba**


    Okay, so now that you have all of what you need in place, it is time to give SuperKaramba
    a try. As is the case with a good many of the applications you install from the
    Debian Unsupported Site repository, there will be no launcher for SuperKaramba
    in the Launch menu. This being so, you will have to run it via the Run Command
    window (**Launch > Run Command**). In that window, type superkaramba, and then
    click **Run**.


    Once SuperKaramba''s Welcome window appears (Figure 8-17), open one of the themes
    you''ve downloaded by doing the following (I''ll be starting with karatop, so
    it''s probably best you do that one first):


    +   1.  Click **Open**, which will bring up the Open Themes window.

    +   2.  In that window, navigate to and double-click your new **KarambaThemes**
    folder. You should now be able to see the Karatop, ChromeClock, and NewTuxBar
    folders.

    +   3.  Double-click the **Karatop** folder, and then click once on the **karatop**
    file therein. Karatop will appear on your desktop.


    In case you''re wondering what Karatop is, it is a system monitor that shows you
    how much memory each of the active processes at work in your system is using up.
    Look at it for a while, enjoy its intrinsic beauty, and then once you get bored
    with it, move on and open Chrome Clock.


    You can open Chrome Clock in this way:


    +   1.  Right-click the **Karatop** applet, and in the pop-up menu, select **Open
    new theme**. The Open Themes window will then open up to the Karatop folder.

    +   2.  Navigate back to the **KarambaThemes** folder and then to the **ChromeClock**
    folder within it. Once there, double-click that folder.

    +   3.  Inside that folder, click **ChromeClock.theme**, and then click **Open**.


    Once you''ve finished oohing and ahhing over how beautiful time can be, move on
    to opening the New TuxBar theme. Before doing that, however, it is probably best
    to move Karatop and Chrome Clock so that they are away from the bottom of the
    screen. To do this, right-click each of them, and then select **Toggle locked
    position** in the pop-up menu.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '![](img/3badae5570de77b990135448f8a8a1cc_157_0.png)


    The icon next to Toggle locked position will then change from a blue square emblazoned
    with a white padlock to black crosshairs, examples of which are shown in Figure
    8-18. Once the crosshairs icon is visible, you can move each applet by dragging
    it.


    ![](img/3badae5570de77b990135448f8a8a1cc_157_1.png)


    Now that Karamtop and Chrome Clock are out of the way, go on and open New TuxBar,
    which will appear at the very bottom of your screen. Because your usual desktop
    panel will just be in the way, minimize it for now by clicking the arrow button
    at the far right side. Once you have done that, open New TuxBar by following these
    steps:


    +   1. Right-click either Karamtop or Chrome Clock, and in the pop-up menu, select
    Open new theme.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '+   2. Navigate to the **New TuxBar** folder and double-click it.


    +   3. Inside that folder, you will find two themes. Click **tuxbar.theme** once,
    and then click **Open** (the other theme in the folder is automatically opened
    when you do this). The New TuxBar will then appear at the bottom of your screen
    as promised.


    # ### Phase Five: Configuring New TuxBar


    Well, some of you may be using a screen size and resolution different from what
    New TuxBar is set up for. As a result, you may be able to see only the top half
    of New TuxBar when it appears. If so, you will have to configure the theme. Configuring
    SuperKaramba themes is a bit different from what you might be used to, but it
    is relatively easy. They are all nothing more than text files.


    To configure the New TuxBar theme so that you can see all of it (remember, you
    don’t have to do this if you can see it all already), just follow these steps:


    +   1. Right-click anywhere on what you can see of the New TuxBar. Then select
    **Edit > Edit Theme** in the pop-up menu. The Text Editor will then appear, opened
    to the TuxBar theme file.


    +   2. In the fifth line of that file, change **H=100 to H=150**.


    +   3. Now save the file (**File > Save**), or leave Text Editor open for now
    because you will be using it again in a moment.


    +   4. Now, right-click on the New TuxBar again, but this time select **Reload
    theme** in the pop-up menu. Within a second or two, you will be able to see all
    of New TuxBar.


    # ### Phase Six: A Bit More Configuring


    Now that all of the New TuxBar is visible, you can probably figure out that is
    supposed to look and behave somewhat like the Dock in Mac OS X, assuming you know
    how the Dock in Mac OS X is supposed to work. If not, take my word for it. Of
    course, it isn’t quite as versatile as the real Dock, as it really only acts as
    a set of application launchers. But it does look cool. One problem with New TuxBar,
    however, is that the programs it is configured to launch are not exactly what
    you as a Xandros user are most likely to be dealing with. No problem, however,
    because we can set it up to run whatever applications you want.


    To configure New TuxBar so that it will launch Xandros-relevant applications,
    you will have to go back to the still-open Text Editor window and make some more
    changes in the file that you edited just a short while ago. The changes will all
    be to those lines listed together below the line <GROUP>X=0 Y=0, as you can see
    in Figure 8-19.'
  merge: -1
  img_proc: true
- pgno: 159
  md: "```\n<GROUP> X=0 Y=40\n<CLICKAREA X=110 Y=38 W=50 SENSOR=PROGRAM ONCLICK=\"\
    konsol&\" \n<CLICKAREA X=174 Y=38 W=50 SENSOR=PROGRAM ONCLICK=\"firefox&\" \n\
    <CLICKAREA X=240 Y=38 W=50 SENSOR=PROGRAM ONCLICK=\"sylphed\" \n<CLICKAREA X=304\
    \ Y=38 W=50 SENSOR=PROGRAM ONCLICK=\"konnqueror&\" \n<CLICKAREA X=368 Y=38 W=50\
    \ SENSOR=PROGRAM ONCLICK=\"ajunta&\" \n<CLICKAREA X=438 Y=38 W=50 SENSOR=PROGRAM\
    \ ONCLICK=\"konqi&\" \n<CLICKAREA X=492 Y=38 W=50 SENSOR=PROGRAM ONCLICK=\"kcontrol\"\
    \ \n<CLICKAREA X=565 Y=38 W=50 SENSOR=PROGRAM ONCLICK=\"kfind&\" \n</GROUP>\n\
    ```\n\n![](img/3badae5570de77b990135448f8a8a1cc_159_0.png)\n\nThese lines basically\
    \ tell TuxBar what applications to launch when a certain region within the bar\
    \ is clicked. The changes you will make are all to the word that is surrounded\
    \ by quotation marks at the very end of each line; these are the application commands.\
    \ Just follow these steps:\n\n+   1.  In the top line, replace *konsol* (the command\
    \ console) with **oowriter** (OpenOffice.org Writer).\n+   2.  If you are using\
    \ Mozilla instead of Firefox as your web browser, replace *firefox* in the second\
    \ line with *mozilla*; otherwise, leave this line as is.\n+   3.  In the third\
    \ line, change *sylphed* to **thunderbird**, or if you're a Standard or Deluxe\
    \ Edition user, **mozilla-mail** (the second option for Standard and Deluxe Edition\
    \ users who don't plan on installing Thunderbird).\n+   4.  In the fourth line,\
    \ replace *konqueror* with **XandrosFileManager $HOME**.\n+   5.  In line five,\
    \ change *ajunta* to *kopete*.\n\n+   NOTE  Leave the command in the sixth line,\
    \ gimp, as is, because you will be installing and using this application later\
    \ on in the book.\n\n+   6.  In the next line, replace *kcontrol* with **XandrosNetworks**.\n\
    +   7.  Finally, change *kfind* in the last line to *xms*.\n\nOnce you have made\
    \ the changes, things should look like the lines in Figure 8-20. If they do, save\
    \ the file (**File \\narrowtriangle Save**), and then quit Text Editor. If they\
    \ don't, go back and make the necessary changes before saving the file.\n\n```\n\
    <GROUP> X=0 Y=40\n<CLICKAREA X=110 Y=38 W=50 SENSOR=PROGRAM ONCLICK=\"konsol&\"\
    \ \n<CLICKAREA X=174 Y=38 W=50 SENSOR=PROGRAM ONCLICK=\"firebird&\" \n<CLICKAREA\
    \ X=240 Y=38 W=50 SENSOR=PROGRAM ONCLICK=\"Thunderbird&\" \n<CLICKAREA X=304 Y=38\
    \ W=50 SENSOR=PROGRAM ONCLICK=\"XandrosFileManager $HOME&\" \n<CLICKAREA X=368\
    \ Y=38 W=50 SENSOR=PROGRAM ONCLICK=\"kopete&\" \n<CLICKAREA X=438 Y=38 W=50 SENSOR=PROGRAM\
    \ ONCLICK=\"gimp&\" \n<CLICKAREA X=492 Y=38 W=50 SENSOR=PROGRAM ONCLICK=\"XandrosNetwork&\"\
    \ \n<CLICKAREA X=565 Y=38 W=50 SENSOR=PROGRAM ONCLICK=\"xms&\" \n</GROUP>\n```\n\
    \n![](img/3badae5570de77b990135448f8a8a1cc_159_1.png)\n\nNext, click on **New\
    \ TuxBar** at the bottom of your screen, and select **Reload Theme** to allow\
    \ your changes to take effect. After that, give it all a try by clicking the various\
    \ icons with the TuxBar (except for those you haven't installed, of course)."
