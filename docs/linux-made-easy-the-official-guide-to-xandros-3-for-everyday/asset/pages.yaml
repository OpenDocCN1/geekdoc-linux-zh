    # **16-5: Taking Screenshots of Screen Capture**


    Well, now we''ve covered all there is to cover in regard to using Screen Capture.
    Still, you might be wondering how you can take a shot of Screen Capture itself
    if it always hides itself when you click the **New Snapshot** button. It must
    be possible, after all, since I have screenshots of it in this book. Well, the
    solution to this seeming paradox is simple: the GIMP.


    You see, Screen Capture is not the only application in your system that allows
    you take screenshots. The GIMP, which we just discussed in the previous project,
    also allows you to do the same thing and works in pretty much the same way. To
    take a screenshot via the GIMP, go to the GIMP''s **File** menu and select **Acquire
    › Screen Shot**, after which the GIMP''s *Screen Shot* window (Figure 16-34) will
    appear.


    ![](img/3badae5570de77b990135448f8a8a1cc_342_1.png)


    *Figure 16-34: Taking a screenshot with the GIMP*'
  merge: -1
