- pgno: 416
  md: 'In that screen, you can use your mouse to select the game you want, and then
    you will be presented with a choice of skill levels. Once you select one of those,
    the game begins.


    The game is all about typing. See a fish with a $w$ on it? Press **w** on your
    keyboard to guide Tux over so he can gulp it up. When you successfully complete
    a level, Tux will congratulate you (as in Figure 19-11), and when you don''t,
    you''ll be told so as well. That''s just about all there is to it.


    ![](img/3badae5570de77b990135448f8a8a1cc_416_0.png)


    *Figure 19-11: Tux Typing congratulates you when you successfully complete a level*


    # ## MathWar


    Now that we''ve covered quite a number of graphical and lexical applications,
    let''s move over to the mathematical side of things by introducing *MathWar* (Figure
    19-12).


    MathWar is a simple mathematics tutor that pops out simple math problems to which
    you, or preferably your child, input the answers. The time in which you have to
    answer is set at 10 seconds (though you can adjust this in either direction),
    and questions are divided among three operators: addition, subtraction, and multiplication
    (no division). Although you can adjust the percentage of questions for each operator
    so that, for example, 20 percent of the questions would involve multiplication,
    30 percent division, and 50 percent subtraction, you cannot configure the level
    of difficulty. Sorry.'
  merge: -1
  img_proc: true
- pgno: 417
  md: '![](img/3badae5570de77b990135448f8a8a1cc_417_0.png)


    Figure 19-12: MathWar


    # Installing and Running MathWar


    To get MathWar via Xandros Networks, type **mathwar** in the text box at the top
    of the XN window, click **Search**, click **Install** next to MathWar in the results
    below, and then follow the usual drill for installing applications via Xandros
    Networks. You can run MathWar by going to the **Launch** menu and selecting **Applications
    ▸ Education ▸ Mathematics ▸ MathWar**.


    # Playing MathWar


    When the MathWar window appears, go to the **File** menu and select **New Game**.
    A simple problem will appear, and your job is to type in the correct answer within
    the time allotted and click **Submit**. A small timer bar at the bottom-right
    corner of the screen will show you how much time you have left for each question.
    If you do not answer within the allotted time, either you will be told that time
    is up and provided with the correct answer (an instant miss) or the computer will
    offer up its own solution, and you will be then asked whether you think the computer
    is correct. Make the right choice and you get points; make the wrong choice and
    the computer gets points. All quite fair and simple.


    # Changing MathWar''s Settings


    As I mentioned, you can change many of MathWar’s settings. This is done by going
    to the **Settings** menu and selecting **Preferences**. In MathWar’s preferences
    window (Figure 19-13), you can adjust the number of rounds and the number of seconds
    per round (in the **General** tab), decide what percentage of the time the computer
    will offer up an answer of its own when you can''t come'
  merge: -1
  img_proc: true
- pgno: 418
  md: 'up with one yourself (in the *Computer Player* tab), and determine the percentage
    of questions that will be based on each of the three operators available (in the
    *Operators* tab).


    ![](img/3badae5570de77b990135448f8a8a1cc_418_0.png)


    # # LPairs


    The next application we will be dealing with is a memory matching game by the
    name of *LPairs* (Figure 19.14).


    ![](img/3badae5570de77b990135448f8a8a1cc_418_1.png)


    The images shown in *LPairs* are not of a particularly childish variety, so the
    game shouldn’t be offensive to older kids or even adults. You might thus end up
    with a broader audience for this game than is the case with most of the other
    applications in this chapter. Still, it is really simple in concept, so the little
    ones should find it fun too.'
  merge: -1
  img_proc: true
- pgno: 419
  md: '# **Downloading, Installing, and Running LPairs**


    You can download and install LPairs via Xandros Network by first making sure that
    the Debian Unsupported Site repository is enabled and then typing **lpairs** in
    the text box at the top of the window. Click the **Search** button, and then click
    **Install** next to *lpairs* in the pane below. Once the installation is complete,
    you can run LPairs via the *Run Command* window. Just type **lpairs** and then
    click **Run**.


    # **Playing and Configuring LPairs**


    When you run LPairs, it will open right into its main, and only, menu (Figure
    19-15).


    ![](img/3badae5570de77b990135448f8a8a1cc_419_0.png)


    *Figure 19-15: The main menu screen in LPairs*


    The options within the menu are few, and basically all you have to do is to click
    any item for it to take effect. For example, to choose the number of tiles in
    the game, click **Cards** as many times as it takes to come up with the number
    of tiles you would like. Your choices are (in tiles-per-row format) 4x4, 5x4,
    6x4, 6x5, and 8x5. Once you have gone through the other items and made your choices
    and are ready to play the game, just click **Start Game**. The game will start
    up with all of the tiles facing down, which means they will all appear blank.
    To get started, just click a tile and it will flip over, revealing the image on
    its reverse side. Then click another tile to see if you can match the first. Once
    you do match a pair of tiles, both will disappear, and you simply keep up that
    process until all the tiles are gone. If you want to return to the main menu,
    you can do so at any time by pressing the ESC key.'
  merge: -1
  img_proc: true
- pgno: 420
  md: '# **Project 19A: KGeography**


    It just wouldn’t be right for me to finish up a chapter on applications for children
    without including one that concerned geography. After all, geography was my undergraduate
    major way back when, and no doubt what got me where I am today. Hmm. . . .


    Nevertheless, KGeography is a pretty cool application that drills your children
    not only on map identification and U.S. and world capitals but also on the flags
    of the many nations of our modern world (Figure 19-16).


    ![](img/3badae5570de77b990135448f8a8a1cc_420_0.png)


    *Figure 19-16: Learning the flags of the world with KGeography*


    Who knows, maybe your child is a budding geographer or vexilologist—a seldom-seen
    word for someone who studies flags. KGeography will help her find out.


    KGeography is not available from any of the Xandros Networks repositories, so
    you will have to download it on your own. However, because it comes in the form
    of a Debian package (.deb file), it can be installed easily by means of the Xandros
    Networks application. Note that Xandros does not support or guarantee applications
    you install this way, so don’t go screaming to them if anything goes wrong. I
    have used KGeography on my system, however, and found no problems, so you should
    be all right. Still, if anything does go wrong in your case, don’t come screaming
    to me either. You are strictly on your own in regard to any screaming you wish
    to do, should it come to that.


    # **19A-1: Downloading KGeography**


    You can download KGeography by clicking the Debian – KGeography 0.3 link on the
    project home page at http://kgeography.berlios.de/download.html. When the list
    of available downloads appears on the next page, click the kgeography_0.2-1_i386.deb
    link (version 0.3 doesn’t actually seem to work), and the download will begin.'
  merge: -1
  img_proc: true
- pgno: 421
  md: '# 19A-2: Installing KGeography


    After KGeography is successfully downloaded, you can install it by running the
    Xandros Networks application and selecting **Install DEB File** in the **File**
    menu. In the Browse for Packages window that appears, locate and then select the
    **kgeography deb package** by clicking it once. Then click the **Open** button
    in that window, and the installation process will begin.


    # 19A-3: Running and Using KGeography


    KGeography will create its own menu launcher, so you can easily run it via the
    Launch menu by selecting **Applications ▸ Education ▸ Miscellaneous ▸ KGeography**.
    Once KGeography appears, you can choose from among various world regions by going
    to the **File** menu and selecting **Open**. From the window that appears (Figure
    19-17) you can select Africa, Europe, France, Germany, North and Central America,
    Spain, or USA.


    ![](img/3badae5570de77b990135448f8a8a1cc_421_0.png)


    Figure 19-17: Choosing the region to study in KGeography


    Once you have made your selection, you have a number of options to choose from.
    On the left side of the KGeography window is the following list of buttons.


    # Browse the map


    This is not a quiz but rather a way for you to familiarize yourself with the countries
    or states in the map selected. Clicking on a country or state reveals its name
    and capital (Figure 19-18).


    # Click division in the map


    In this quiz, you are told in the left pane to click on a specific state or county.


    > **NOTE**

    > In *KGeography*, division stands for a political division.


    # Guess division from its capital


    In this quiz, you are given a sentence to complete, such as "Hannover is the capital
    of...," and then given four answers to choose from.'
  merge: -1
  img_proc: true
- pgno: 422
  md: '![](img/3badae5570de77b990135448f8a8a1cc_422_0.png)


    Figure 19-18: Clicking on a state or country reveals its name and capital.


    # Guess the capital of a division


    This is another multiple-choice quiz in which you must name the state or country
    of the given capital. For example, “Raleigh is the capital of…”


    # Guess division from its flag


    In this quiz, you are shown a flag and then asked to choose from among four possible
