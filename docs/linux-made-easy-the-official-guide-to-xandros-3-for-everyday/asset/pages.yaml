- pgno: 302
  md: '# # 15


    # ## COUCH POTATOES

    Xandros Does Video


    ![](img/3badae5570de77b990135448f8a8a1cc_302_0.png)


    Now that we''ve covered much of what Xandros can do in terms of audio, let''s
    turn our attention to what is arguably the second most important of its talents
    in our CNN/MTV-era world: video. Xandros is quite capable in terms of video playback,
    allowing you to view video files you download from the Internet or from your digital
    movie camera or watch Internet video streams, video CDs (VCDs), and unencrypted
    DVDs. If you have a TV tuner card, it even lets you watch television right there
    on your computer screen.


    # ### Media Player (Noatun)


    The simplest of players in the Xandros video repertoire is Media Player (Figure
    15-1), also known as Noatun.


    Media Player doesn''t look like much at first glance, but it is a capable beastie
    that allows you to play video files in a number of formats, including MPG, AVI
    (such as those from your digital movie camera), and QuickTime'
  merge: -1
  img_proc: true
- pgno: 303
  md: '(.mov). As if that weren''t enough, it even allows you to listen to the various
    types of audio files we''ve already covered in Chapter 14.


    ![](img/3badae5570de77b990135448f8a8a1cc_303_0.png)


    Figure 15-1: Media Player


    You may notice when you run Media Player for the first time that there will be
    no volume controller in the player window that appears on your screen, unlike
    that in Figure 15-1. If you would like your player to display the controller too,
    go to the Settings menu and select Show Volume Control.


    # Playing a Video File in Media Player


    To run Media Player, go to the Launch menu and select Applications ► Multimedia
    ► Media Player. When the player window appears, you can play a file by going to
    the File menu and selecting Open. A file selection window will appear, and in
    that window you can navigate to and then select the file you want to play. Once
    you''ve made your selection, click Open, and the file will begin playing in a
    new video playback window.


    You can then, if you like, enlarge the viewing size of the Media Player window
    by simply dragging one of the bottom corners of the player window until it is
    as big as you want it to be.


    # The Media Player Playlist


    Each time you play a new file in Media Player, whether it be audio or video, it
    is automatically added to a playlist. Thus, when the file you have just selected
    has finished playing, the one you viewed or listened to before that, even if it
    was weeks ago that you did so, will automatically play next. Depending on how
    you look at the world, this can be considered a rather handy feature . . . or
    not. If you happen to take a negative view of this default setup, you can configure
    Media Player so that it will automatically clear the playlist each time you open
    a new file, thus making it function a bit more like XMMS. To make this change,
    just follow these steps:


    +   1. Go to the Media Player Settings menu and select Configure Media Player.

    +   2. In the Preferences window that appears (Figure 15-2), check the box next
    to the words Clear playlist after opening a file, and then click the Apply button
    to complete the process.

    +   3. Normally, you would now click OK, after which the Preferences window would
    close, but I''ll ask you to hold off on doing that for a moment.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '![](img/3badae5570de77b990135448f8a8a1cc_304_0.png)


    Figure 15-2: Setting Media Player’s Preferences


    # Media Player Plug-ins


    While you have the Preferences window open, it might be fun to play around with
    the “interface” plug-ins that come with Media Player. These interface plug-ins
    allow you to change not only the look of the Media Player, as you can with XNMS,
    but also its size and shape. If you click **Plugins** in the left pane of the
    window, the various interface choices available to you will appear in the right
    pane. To see what they all look like in action, deselect the first choice, which
    is the default interface that you have already seen, and then click all of the
    others. Click **Apply**, and you will have five very different-looking player
    windows on your desktop (Figure 15-3). Very cool, you must admit.


    ![](img/3badae5570de77b990135448f8a8a1cc_304_1.png)


    Figure 15-3: The many faces of Media Player'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'Some of these interfaces are configurable both in terms of function and in
    the skins they display. In fact, you can actually download and install skins to
    use in some of them. To see what I am talking about, do the following:


    +   In the same page of the Preferences window, deselect all of the interfaces
    except K-jölöl, and then click **Apply**.


    +   If you now look at the left pane of the window, you will see K-jölöl Skins
    listed. Click that, and the right pane will display the options available for
    that interface.


    +   Click the drop-down menu button that says **kjölöl**, and you will see the
    other skins available for that interface (Figure 15-4).


    ![](img/3badae5570de77b990135448f8a8a1cc_305_0.png)


    If you would like to install additional skins that you have downloaded, you can
    do so by clicking the small button that looks like a partially opened folder next
    to the **Install Skin** button. Navigate to it, select the skin file you downloaded,
    and click **Install Skin**.


    # Playing Video Streams with RealPlayer


    In Chapter 14, we covered RealPlayer’s role as an audio application, allowing
    you to play Internet audio streams. Audio streams are not the only thing that
    RealPlayer can handle, however, as you can use it to play video streams as well.
    If you would like to try out RealPlayer’s capabilities for playing video streams,
    or if you just happen to be a fan of Katie Holmes, point your web'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'browser to http://www.katieholmescpictures.com/videos.shtml, scroll down

    to the section that says Streaming Katie Videos (web pages do change through

    time, so just search a bit through the site if it''s not there), and then try
    out

    one of the many clips available.


    If the Beatles are more your cup of tea, try "The Birth of Beatlemania" at

    NPR''s All Songs Considered site (http://www.npr.com/programs/ase/archives

    /beatles40). Be sure to click the Real Media link on that page. Either way you

    go, once you have made your selection, RealPlayer will pop up and begin play-

    ing the stream in a slightly enlarged window.


    If you would like to view the video at an enlarged size, you have two ways

    of going about it. The first and easiest way, depending on your level of mouse-

    wielding dexterity, is the same as I mentioned for Media Player in the previous

    section\u2014just drag one of the bottom corners of the RealPlayer window until

    it is the size you prefer. The other way is to go to the **View** menu and select

    **Fullscreen** or **Zoom \u25b8 Double Size**.


    # Playing DVDs and VCDs


    Your Xandros system also allows you to play DVDs; however, due to licensing

    concerns, playback is limited to unencrypted discs. Unfortunately, this rules

    out a vast majority of the DVD movies you buy or rent at your local video shop,

    thus leaving you with a rather limited choice of movies that you can play on

    your computer. Of course, DVDs created on personal computers (such as the

    DVD slideshows that people create these days with applications such as iDVD

    on the Mac) pose no problem.


    # DVD Encryption


    You may be wondering at this point what encrypted DVDs are, why they are

    encrypted, and why you can''t play them, so I will fill you in. Commercial DVDs

    are almost always encrypted with CSS (Content Scramble System). The main

    purpose for encrypting DVDs with CSS is supposedly to prevent piracy. CSS,

    however, does a bit more than that, as it is also used to enforce regional

    encodings (more on that in the next section) and to prevent you from skip-

    ping through, among other things, those FBI warnings that appear when you

    first play a DVD.


    In order for a device, such as your stand-alone DVD deck beneath your TV

    or the DVD playback software on your computer, to play an encrypted DVD,

    it has to have a CSS decryption key. This is available to any company that wants

    to include it, but in order for that company to do so legally, it has to pay for

    the right. Most Linux distros, such as Xandros, do not include the key because,

    among many reasons, they would have to pass on the costs to you if they did.

    When you buy Mac OS X or most DVD playback software for Windows, on

    the other hand, you are in fact paying for that key\u2014a hidden cost of sorts.


    # So I Can''t Play My Hollywood Blockbusters in Linux?


    Now you may think that this lack of encrypted DVD playback in Linux is a

    major stumbling block, but that is not actually the case. You can add the CSS'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'key yourself, and it is supposedly legal for you, as an end user, to do so.
    I''m no lawyer, however, so I won''t swear to the fact.


    Installing the CSS key (for Xine) is quite easily done, but it is one of the rare
    cases, in Xandros anyway, when you will have to resort to the command line. If
    you are interested in adding encrypted DVD playback capability to your Xandros
    system, I have the steps for you to follow in Chapter 20.


    # Things to Think About: Television Standards and Regional Encodings


    If you do happen to find some movies on DVD that are not encrypted, there are
    some points you need to consider. If you are strictly a domestic-market sort of
    buyer, these points may prove to be of little concern to you, but it is still
    best to be informed so as to avoid any problems down the line. The things that
    a true DVD aficionado must keep in mind are television broadcast and recording
    standards and regional encodings.


    # Television Broadcast and Recording Standards


    Whether you are talking TV, video, or DVD, television standards are, whether you
    know it or not, of concern to you. Have you ever anxiously plugged a videotape
    you got in the mail from a friend or relative back in Brazil or Poland into your
    VCR, only to find that you couldn''t view it? The reason is different television
    broadcast and recording standards.


    There are three main standards in the world today: NTSC (*National Television
    System Committee*), used in North America, parts of South America, Japan, and
    South Korea; SECAM (*SEquentiel COuleur AVEC Memoire*), found in France, former
    French colonies, and former European East-Block countries; and PAL (*Phase Alternating
    Line*), used almost everywhere else. There are also variations of each of these,
    some of which are incompatible with one another.


    The reasons for these differences are rooted in the availability of technology
    at the time the various standards were adopted and, as with so many other things
    in life, politics. SECAM, for example, was essentially created to protect French
    industry, while it was commonly adopted in the former East-Block countries to
    discourage citizens of those countries from viewing Western television broadcasts.


    # DVD Regional Encodings


    The other important thing to remember when dealing with DVDs is regional encodings.
    You may have noticed that on many of the DVDs you buy there is a small logo on
    the back of the package that looks like a globe with a number in the middle of
    it. If you are in the United States or Canada, the number will be 1, usually with
    the television standard written underneath, which would be NTSC in this case (Figure
    15-5).


    ![](img/3badae5570de77b990135448f8a8a1cc_307_0.png)'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'If you were in Japan, that logo would read 2 NTSC, while if you were in Britain,
    it would be 2 PAL. The number within the logo represents the region for which
    the DVD is encoded. There are six such regions, with the United States, U.S. territories,
    and Canada forming Region 1, Japan, Europe, the Middle East, South Africa, and
    Greenland make up Region 2.


    This is very important, because DVDs encoded for one region are not playable in
    machines manufactured for use in another. Thus, if you buy a DVD in the United
    States and then try to play it on a DVD player in Japan, it won’t work, despite
    both countries using the NTSC standard. If you buy a DVD in Britain (Region 2)
    and try to play it on a machine in Japan (also Region 2), it also won’t work,
    but this time because of the different television standards (PAL versus NTSC).


    When it comes to playing DVDs on your computer, however, things are quite different,
    in that television standards are mostly irrelevant. Regional encodings are also
    irrelevant in some ways. When you burn a disc on your DVD burner, or when you
    play a DVD that someone else burned on theirs, regional encodings are not involved.
    However, if you buy and then play a DVD movie on that drive, the relevance of
    regional encodings comes back into play.


    When you buy a computer with a built-in DVD drive, or when you buy an external
    DVD drive, that drive is usually set up to play DVDs encoded for the region in
    which you bought your machine. Unlike the DVD players you hook up to your TV,
    however, those in or connected to your computer allow you to play DVDs of any
    regional encoding.


    This generous feature is limited, however, and this is where you need to be careful.
    Depending on the manufacturer of your drive, you will be able to switch back and
    forth between DVDs of differing regional encodings only four or five times. After
    that, the drive, usually without warning, will be locked into the regional encoding
    of the disc you were playing for the final switch … forever. This is unrelated
    to your operating system—it is strictly a hardware matter.


    There is one exception to this region-lock rule. DVDs labeled as Region Free or
    ALL (sometimes somewhat inaccurately labeled as Region 0) can be played on any
    DVD player in any region and thus do not register as a regional encoding switch
    when you pop one of them in your computer’s DVD drive. If you therefore play a
    Region 1 DVD, followed by a Region Free DVD, and then play another Region 1 DVD
    after that, there will be no change, in your drive’s view, as to the number of
    times you have switched encodings.


    If you are curious as to the whys of this rather odd regional-encoding system,
    it is all based on marketing. The Hollywood studios came up with this system because
    theatrical releases of their films abroad often lag behind the home releases (DVDs
    and videos) in the United States. By locking American and Canadian home releases
    with regional encodings, they can thus be assured that people in other countries
    will have to wait for the films to be released in theaters in order to see them.
    In addition, by limiting sales of American and Canadian discs to their respective
    domestic markets, the studios can then command higher prices when selling distribution
    rights to foreign distributors . . .'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'Depending on how you look at things, it all makes good business sense or may
    just be an example of unbridled greed. Either way, it is nothing more than a headache
    for the end user.


    # Playing DVDs with Xine


    Now that you have been forewarned as to the possible pitfalls you might encounter
    when dealing with DVDs, let''s get on to the business of playing them. The application
    that Xandros, and most other Linux distributions, use for DVD playback is called
    Xine, which you''ve already caught a glimpse of in Chapter 6 (see Figure 6-3).


    # Running Xine


    To run Xine, go to the Launch menu and select Applications ► Multimedia ► Video
    Player.


    As you will see, Xine consists of two windows: a playback window and a rather
    handsome controller. These are actually two different applications, with the application
    that displays the playback window, Xine, providing the main playback capabilities
    to your system. This may mean little to you, but it is worth noting, because you
    can use a different controller interface to take advantage of Xine''s capabilities
    if you like, a point I will discuss later on in the “gXine” section of this chapter.


    The first time you run Xine, a third window will also appear. This is the Setup
    window (Figure 15-6), which you can open at any time by right-clicking anywhere
    in the Xine playback window and selecting Settings ► Setup in the pop-up menu
    that appears. For the time being, however, there is probably nothing you really
    need to do with this window, so you can go ahead and close it for now by clicking
    OK.


    ![](img/3badae5570de77b990135448f8a8a1cc_309_0.png)


    Figure 15-6: The Xine Setup window'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Getting to Know the Xine Controller


    As you can see by looking at the Xine controller (Figure 15-7), using Xine isn’t
    all that different from using a standard DVD player or VCR, since most of the
    basic controls (play, back, forward, pause, and eject) are clustered together
    in a circle, just as they are on the video decks you might have in your home.


    ![](img/3badae5570de77b990135448f8a8a1cc_310_0.png)


    There are a few other control buttons that are different, however, so it would
    be helpful for you to know what they do. The control buttons (they’re numbered
    in Figure 15-7) in the Xine controller consist of the following:


    **Playlist (1)**

    Opens a window, in which you can create a playlist of files you’d like to play.
    This feature is more useful when playing audio tracks (yes, Xine can do that too)
    or video files on your hard disk than when playing DVDs.


    **Control (2)**

    Opens a window, in which you can adjust the color, saturation, brightness, and
    contrast of the display for the video file you are viewing. As you can see in
    the right side of the window in Figure 15-8, it also allows you to change the
    appearance of the Xine controller by applying different skins. You can do this
    by clicking any of the choices in the list (there are three that come with your
    system), and the changes will take place immediately.


    ![](img/3badae5570de77b990135448f8a8a1cc_310_1.png)


    **Setup Window (3)**

    Brings up the Setup window (shown in Figure 15-6).


    **Quit (4)**

    Quits Xine, thus closing both the playback window and the controller.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Snapshot (5)


    Takes a snapshot of the frame currently being viewed in the player window and
    saves it to your Home folder as a .png file.


    # Mute (6)


    Toggles the audio portion of the file you are viewing or listening to.


    # Navigator (7)


    Brings up the rather primitive-looking Navigator window (Figure 15-9), which allows
    you to easily navigate through the various menus encoded within the DVD itself.


    ![](img/3badae5570de77b990135448f8a8a1cc_311_0.png)


    # Close Window (8)


    Closes only the Xine controller window. You can later reopen the controller window
    by right-clicking anywhere in the playback window and selecting GUI visibility.


    # Fullscreen (9)


    Displays the video you are watching at full-screen width. You can later return
    to window view by pressing the ESC key.


    # Playing DVDs in Xine


    Actually playing a DVD in Xine is very straightforward. Just place a DVD in your
    drive and, after the LED on the drive stops blinking, press the DVD button in
    the Xine controller window. The DVD will then start playing in the playback window.
    That’s basically it.


    # Using Xine to Play VCDs


    Xine can also play video CDs, which are better known as VCDs. As I mentioned in
    Chapter 6, VCDs are videos recorded on CD rather than DVD blanks. Because of the
    more limited capacity of CD media, an average commercial film comes on two discs.
    Playing these discs, however, is little different from playing DVDs. Just place
    the VCD in your drive, wait for the drive’s LED to stop blinking, and then click
    the VCD button in the Xine controller window. If that doesn’t work, click the
    VCDO button instead.


    Oh, and in case you’re wondering, VCDs do not have regional encodings.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# gxine


    As I mentioned in the previous section, the controller that appears when you run
    Xine is actually a graphical user interface for the normally command-  driven
    Xine. There are, however, other interfaces that you can employ in order to use
    Xine. My personal favorite is one called gxine, which takes a one-window approach
    to video viewing, as you can see in Figure 15-10.


    If you would like to give gxine a go, you can easily do so via Xandros net-  works.
    Just type gxine in the text box next to the Search button, and press the ENTER
    key. The installation is a standard one, so there will be no differences from
    what you learned in Chapter 8.


    ![](img/3badae5570de77b990135448f8a8a1cc_312_0.png)


    Figure 15-10: Viewing video files and discs with gxine


    Once gxine is installed, you can run it from the Launch menu by selecting  Run
    Command. When the Run Command window appears, type gxine and then click Run. When
    the player opens, you can navigate to and play the file or disc type you want
    to view via the File menu.


    # TV Time


    Many computer users have video capture or TV tuner cards installed in one of the
    PCI slots within their computers. These cards allow you to take video output from
    an external source, such as a VCR, and display that output in a separate window
    on your computer screen—a sort of monitor-within-a- monitor arrangement.


    TV tuner cards, an example of which is shown in Figure 15-11, are actually mini–TV
    tuners connected to an antenna or your cable television source, which allow you
    to watch live television and change channels in the same monitor-within-a-monitor
    setup. Some even come with remote control- lers. Like video capture cards, they
    also usually allow you to display output from your VCR or other external video
    sources on your computer screen. In Xandros, the application that provides the
    onscreen monitor for displaying the video output from these devices is called
    TV Time.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# Installing TV Time


    If you are thinking of installing a video capture or TV tuner card in your machine
    but have yet to do so, hold off on installing TV Time until that card is actually
    installed. If you already have a card installed, you can install TV Time by running
    Xandros Networks, typing tvtime in the box next to the Search button, and then
    pressing ENTER. When TV Time appears in the main pane of the XN window, click
    Install, and the installation process will proceed in the usual manner you learned
    in Chapter 8 . . . except at the very end. Unlike the installation process for
    most other applications from Xandros Networks, the one for TV Time will include
    a few configuration steps before the process is complete.


    ![](img/3badae5570de77b990135448f8a8a1cc_313_0.png)


    After the download and installation progress bars reach 100 percent and disappear,
    you will be asked three simple bits of information in the same Updating System
    window. Don''t worry too much about making a mistake, however, because you can
    change these settings at any time after the application is installed. The three
    steps are as follows:


    +   1. Select the default television standard for your location (Figure 15-12).
    As I explained in the previous section on playing DVDs, different countries use
    different broadcast standards. Therefore, what you type at this stage depends
    on where you live. If you live in the United States or Canada, type 1 for NTSC.
    If you live in France, type 2 for SECAM, and if you live somewhere in the rest
    of Europe, Australia, or New Zealand, type 3 for PAL. If you happen to live in
    Japan, as I do at'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'the present time, type 7 for NTSC-JP. Once you have entered the appropriate
    choice, click the Enter button in the XN window (or just press ENTER on your keyboard).


    +   2. Select the default frequency table. The choices in this step are quite
    simple. If you receive your television signal via cable, type 1; if you receive
    it by antenna, type 2. Once you have done that, click Enter or press ENTER on
    your keyboard.


    +   3. Do you wish to make ‘/usr/bin/tvtime’ setuid root? Just accept the default
    (no) here to avoid having to deal with root privileges by clicking Enter or pressing
    the ENTER key.


    Once you have completed these three steps, the word *Done* will appear in the
    main pane of the XN window. You can then click the **Close** button.


    ![](img/3badae5570de77b990135448f8a8a1cc_314_0.png)


    # ## Running TV Time


    Now that the installation is complete, you can run TV Time by going to the Launch
    menu and selecting **Applications ▶ Multimedia ▶ TV Time**. TV Time will open
    as a simple, blackened, menu-less window. The first time you run it, there will
    also be a configuration menu displayed at the middle of the screen; however, since
    you will have already performed the basic configuration during the installation
    process, you can go ahead and close this menu by clicking **Exit**.


    > **NOTE** *If you want to change your settings in the future, you can bring up
    the settings menu at any time by right-clicking anywhere in the TV Time window.*'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'After that, what appears in the window is between you and the video output
    device you have connected to your card or, if you have a TV tuner card, the tuner
    card itself. TV Time itself is nothing more than a software version of a video
    monitor.


    # Getting Your Own Video Capture or TV Tuner Card


    If the idea of watching videos or television on your computer screen as you tend
    to your other business sounds attractive to you, you might consider buying a video
    capture or TV tuner card for yourself, assuming you don''t already have one. These
    cards are rather inexpensive (some are less than $50 via mail-order outlets),
    so it is all quite doable. That said, you should also be aware that support for
    such cards in Linux is rather limited, so it is important to check around before
    parting with your money. Checking the Xandros User Forums for postings in that
    regard, or directly asking for advice, is probably a very wise thing to do.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# 16


    # DOING THE LEFT BANK

    *Working with Graphics Applications*


    ![](img/3badae5570de77b990135448f8a8a1cc_316_0.png)


    Now that you have gotten a taste of Xandros’s audio and video capabilities, let’s
    round out this more artistic side of things by focusing on its graphical capabilities.


    You have already learned to download and view images from your digital camera
    and how to add yet other images via your scanner, but Xandros doesn’t force you
    to leave things at that. With the graphics applications that come bundled with
    your Xandros system, and still others available via Xandros Networks, you can
    go on to enhance and manipulate those images or even create totally different
    ones of your own. In addition, you will be able to take screenshots of your desktop
    and other application windows. Basically, if you want to get graphical, your Xandros
    system comes with the tools that allow you to do so.


    # Paint


    Bundled with your system is perhaps the simplest of graphics applications—*Paint*
    (also known as *KolorPaint*). When you run Paint (**Launch ▸ Applications ▸ Graphics
    ▸ Paint**), you will notice that in terms of how you use it'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'and how it functions, it is very similar to the Paint program that comes with
    Windows systems (Figure 16-1).


    Paint is equipped with all of the basic paint tools (brush, pencil, fills, eraser,
    shapes, and so on) to allow you to create simple images, though not particularly
    sophisticated or complex ones. This seeming lack of sophistication is one of the
    reasons that Paint goes largely overlooked by most users. But as the saying goes,
    you can''t judge a book by its cover, and Paint has a lot more to offer beneath
    the surface than first appearances might seem to indicate.


    ![](img/3badae5570de77b990135448f8a8a1cc_317_0.png)


    # Changing Image File Formats in Paint


    Graphics files come in a variety of types. The images from your digital camera,
    for example, are usually JPEG (.jpg), which along with GIF (.gif) is the most
    common file type for the images used on web pages. There are, of course, still
    others. Sometimes you may need to convert an image from one file type to another,
    for example, when you are preparing an image to use on a web page of your own.
    Paint is capable of performing many of these conversions, though not all of them.
    However, since Paint can read images in the most common graphic formats (.gif,
    .jpg, .bmp, .png, .pcx, .ico, .tif) and can write files in many of the formats
    most likely to be of interest to you (.bmp, .jpg, .png), it can prove to be quite
    useful when performing such conversions.


    Let''s say that you have a .bmp image that you would like to use in a new home
    page you are working on. In this case, you want to convert the .bmp image into
    a web-friendly .jpg image. Here''s what you would do:


    +   1. Open the .bmp image in Paint by going to the **File** menu and selecting
    **Open**.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '2. Without doing anything else, go to the **File** menu again and select **Save
    As**.


    3. When the **Save Image As** window appears (Figure 16-2), select **JPEG** image
    from the drop-down menu button next to **Filter**.


    ![](img/3badae5570de77b990135448f8a8a1cc_318_0.png)


    Figure 16-2: Changing the file format of an image in Paint


    4. If you want to reduce the time it will take to load the picture on your web
    page, decrease the quality of the picture by using the sliding bar next to the
    word **Quality** (this slider will appear in the Save Image As window once you
    have selected **JPEG image** in the drop-down menu). The trade-off between image
    quality and load time is something you will have to come to terms with yourself,
    but a bit of trial and error should provide you with a happy medium.


    5. Once finished, click **Save**, and that’s all there is to it.


    # ## Resizing Your Images in Paint


    You have no doubt found yourself with images that are just a tad bigger than you
    would like them to be, especially if you have one of today’s multimillion-megapixel
    digital cameras. There are many applications that allow you to shrink such images
    down to size, so to speak, to make them easier and lighter to use in email messages,
    web pages, and whatever else you have in mind. Using Paint for this purpose is
    especially handy. To reduce the size of an image, open it in Paint (**File** ▸
    **Open**), and then follow these steps:


    +   1. Select **Resize/Scale** in the **Image** menu.


    +   2. In the **Resize/Scale** window that appears (Figure 16-3), click the **Scale**
    button. If you are resizing a line drawing, you might want to try **Smooth Scale**
    instead in order to reduce the jaggedness of the lines. If you’re not sure which
    to use, try one first, undo your work once you’ve had a look, and then start over
    and try the other.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '+   3. In the same window, check the box next to Keep aspect ratio. This retains
    the ratio between the width and height of the image, so that you don’t end up
    with a peculiar-looking stretched-out result.


    ![](img/3badae5570de77b990135448f8a8a1cc_319_0.png)


    *Figure 16-3: Shrinking an image down to size in Paint*


    +   4. Finally, in either of the boxes next to the word Percent, set the percentage
    of reduction you would like to perform.


    +   5. When you have finished, click the OK button, and the results will be seen
    immediately in the main window.


    +   6. If the size of the resized image is what you were hoping for, go to the
    File menu, select Save As, and save the file with a new name, thereby retaining
    a full-sized copy of the original, which is always a good idea. If you would instead
    like to have a second go at things, so as to make the image a bit smaller or larger,
    go to the Edit menu, select Undo: Scale, and then start over again from step 1.


    # Cropping an Image in Paint


    Sometimes, the problem you have with an image is not its size (or not only its
    size) but rather that what you really want to see in the image is too small. For
    example, let’s say that the only things you are really concerned with in the image
    in Figure 16-4 are the horse and buggy.


    That being the case, you could crop the photo to include just that portion of
    the image. Here’s how you go about it:


    +   1. Use the rectangular selection tool (the top-right icon in the tool panel
    at the left of the window in Figure 16-4), and then select the portion of the
    image you want to crop. Once you have done that, a dashed line will appear surrounding
    that portion of the image.


    +   2. Next, go to the Selection menu, and select Set as Image (Crop).'
  merge: -1
  img_proc: true
- pgno: 320
  md: '![](img/3badae5570de77b990135448f8a8a1cc_320_0.png)


    Figure 16-4: The focus of your image lost in superfluous details


    The image will now appear in the main window reduced to the area you selected
    in step 1 (Figure 16-5).


    ![](img/3badae5570de77b990135448f8a8a1cc_320_1.png)


    Figure 16-5: Cropping on image in Paint'
  merge: -1
  img_proc: true
- pgno: 321
  md: '+   3. The image may seem uncomfortably small if you were viewing the original
    at a reduced size. If so, go to the box next to the two magnifying-glass icons
    and choose **100%** or thereabouts. You will then be able to see the image at
    its new full size.


    +   4. If you like the results, go to the **File** menu, select **Save As**, and
    save the file with a new name.


    # ### Converting Color Images to Grayscale in Paint


    Paint also allows you to easily convert color images into black-and-white grayscale
    images, should you want to do so for whatever reason. To make the transformation,
    just go to the **Image** menu and select **Reduce to Grayscale**. You can then
    go to the **File** menu and select **Save As** to save the newly transformed image
    with a new name.


    # ### Rotating Images in Paint


    Paint also allows you to rotate or skew pictures that are incorrectly oriented.
    To rotate an image, just go to the **Image** menu and select **Rotate**.


    When the Rotate Image window appears (Figure 16-6), select **Counterclockwise**
    or **Clockwise** (depending on the direction in which you want to rotate the image),
    and then select the number of degrees you want to rotate the image. Once finished,
    click **OK**.


    ![](img/3badae5570de77b990135448f8a8a1cc_321_0.png)


    # ### Skewing Images in Paint


    Sometimes the angles of objects in your pictures may be so off as to be almost
    annoying. If you look at the image in the left of Figure 16-7, you can see that
    the lighthouse tower is severely skewed.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '![](img/3badae5570de77b990135448f8a8a1cc_322_0.png)


    Figure 16-7: Michigan’s Tawas Lighthouse in need of some corrective skewing


    If you like, you can correct this in Paint, though the building to the left of
    the tower will then look a bit off as a result. It all depends on what matters
    most to you.


    Anyway, to skew an image in Paint, first open the image, and then select **Skew**
    in the **Image** menu.


    When the Skew Image window appears (Figure 16-8), you can adjust the number of
    degrees you would like to skew the image, either horizontally or vertically (or
    both), using the two boxes below. When finished, click **OK**.


    ![](img/3badae5570de77b990135448f8a8a1cc_322_1.png)


    Figure 16-8: Skewing an image in Paint'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'As you will no doubt notice, in the results (shown in the left side of Figure
    16-9), your now properly skewed image will have some unsightly white areas at
    its top-left and bottom-right sides.


    ![](img/3badae5570de77b990135448f8a8a1cc_323_0.png)


    To get rid of these unwanted white spaces, crop the image so as to eliminate those
    areas, which will leave you with a more appealing final product, as you can see
    at the right side of Figure 16-9.


    # Playing Around with Effects in Paint


    Paint allows you to modify your images in still other ways via its More Image
    Effects window (Image \u25b8 More Effects). When that window first opens, you
    will see the traditional brightness and contrast settings controls, which are
    very useful for that purpose. However, there is a bit more lurking behind this
    window''s skin . . . actually within its Effect menu, to be exact. By clicking
    the drop-down menu button next to the word Effect, you can see still other options
    available to you.


    These effect options include Emboss, an example of which is shown in Figure 16-10;
    Flatten, which allows you to reduce the image down to two colors of your choosing
    for some very psychedelic results; Invert, which provides you with results that
    look like a photo negative; Reduce Colors, which allows you to lower the number
    of colors in the image or change it to grayscale; and Soften and Sharpen, which
    allows you to do exactly what its name implies.


    You might not be familiar with many of these functions, so go ahead and play around
    with them. Just remember that, regardless of what you do while experimenting with
    these various effects, no permanent damage will be done to your image unless you
    select Save from the File menu. That said, don''t do it.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '![](img/3badae5570de77b990135448f8a8a1cc_324_0.png)


    Figure 16-10: Embossing an image via Paint’s More Image Effects window


    # **Project 16A: Getting Arty with the GIMP**


    Well, if Paint isn’t enough to satisfy your budding artistic urges, and you are
    aching for a bit more excitement, then it’s time to go for the *GIMP* (Figure
    16-11).


    The GIMP, often compared very favorably to Adobe’s Photoshop (albeit without that
    application’s exorbitant cost), is a graphics application that allows you to create
    original images and, more important, retouch or completely doctor image files,
    such as those from your digital camera. Want to put some color in your cheeks,
    you say? Or how about getting rid of that red-eye that makes you look like one
    of the ghoulish characters out of an episode of *Buffy the Vampire Slayer*? The
    GIMP lets you do not only these things but others, such as airbrush out unwanted
    shadows (or even facial blemishes), give your image a canvas texture, change a
    photo into an oil painting, or even add a bell pepper or a pointing hand here
    and there.


    Just in case you’re wondering, *GIMP* stands for GNU Image Manipulation Program
    (and *GNU*, the organization that promotes the development of Linux and related
    free software, is a recursive acronym for *GNU’s Not Unix*).'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# **16A-1: Downloading and Installing the GIMP**


    Although the GIMP does not come bundled with your Xandros system, it is available
    via Xandros Networks. To get it, run Xandros Networks, type gimp in the search
    box near the top of the window, and then click the Search button. When the results
    of your search appear in the pane below, click Install next to GIMP Image Editor
    (it should be the only entry in the list), and then follow the usual drill for
    installing files via Xandros Networks.


    ![](img/3badae5570de77b990135448f8a8a1cc_325_0.png)


    *Figure 16-11: The Gimp*


    # **16A-2: Running the GIMP**


    Once you have downloaded and installed the GIMP, you can run it by going to the
    **Launch** menu and selecting **Applications** \> **Graphics** \> **GIMP Image
    Editor**. The very first time you do this, you will be presented with the *GIMP
    User Installation Wizard* (Figure 16-12), but working through it is strictly a
    no-brainer, as all you have to do is click **Continue** in each screen of the
    wizard until it is finished.


    # **16A-3: Familiarizing Yourself with the GIMP''s Interface**


    As you saw in Figure 16-11, the GIMP is a multi-window application. It first opens
    as a set of two rather tall palette-like windows and then adds still others as
    you open images or other tools. While this approach works out quite well, it can
    be somewhat disconcerting at first. Basically, the left window is the main GIMP
    window, which is divided into two sections, shown separately in Figure 16-13.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '![](img/3badae5570de77b990135448f8a8a1cc_326_0.png)


    Figure 16-12: The GIMP User Installation Wizard


    ![](img/3badae5570de77b990135448f8a8a1cc_326_1.png)


    Figure 16-13: The top and bottom halves of the main GIMP window


    The top half is a collection of the various drawing and selection tools available.
    The bottom half, on the other hand, shows the options available for each of those
    tools. This being the case, when you click a different tool in the top half of
    the window, the options in the bottom half change to reflect the options for the
    tool you’ve just selected.


    The right GIMP window, like the left, also consists of two halves, each of which
    you can see in Figure 16-14.


    The top half of the window shows the layers (a topic I’ll cover in greater detail
    later on in this project), channels, and paths for a selected image.


    The contents of the window thus change when you click different open image windows.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '![](img/3badae5570de77b990135448f8a8a1cc_327_0.png)


    Figure 16-14: The top and bottom halves of the GIMP’s Layers, Channels, Paths
    window


    The bottom half, unlike that of the left window, really has no relation to the
    top; it is merely where you select from the various brush styles, patterns, and
    gradients available in the GIMP, regardless of whether or not you have selected
    a tool that can utilize such options.


    Finally, we come to the matter of menus. In most applications, the main menu selections
    are available via the menu bar in the main program window. In the GIMP, however,
    the menu bar provides only three entries, and the options within those are quite
    limited. The main options in the GIMP are instead to be found in the menu bar
    of each image window, as you can see in Figure 16-15. This is where you will be
    able to, among other things, save, add various effects to, and resize your image.


    ![](img/3badae5570de77b990135448f8a8a1cc_327_1.png)


    Figure 16-15: GIMP menu bars in the main and on an image window


    # 16A-4: Putting It All Together (and Learning a Bit More) by Creating a Custom
    Desktop Wallpaper


    I could describe and explain all of the GIMP’s various tools, filters, and other
    features, but to cover them all one-by-one would fill up an entire book. Given
    the many other topics that must be covered within the confines of these covers,
    however, I just can’t do that. What I can do is give you a chance to play around
    with what the GIMP has in store and in the process create something that might
    actually be of some use. What I have in mind is a custom-made desktop wallpaper.'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'So that you will know what sort of images you will need to complete this project,
    let me first describe what the final creation will look like. Basically, we are
    going to take a main background image, such as a landscape or cityscape, and add
    snapshots of people on top of it. For example, let''s say that you took a family
    trip to Walt Disney World last summer. In this case, you would use a landscape
    shot of Disney World, preferably one with lots of open top space (aka sky), and
    then add snapshots of each person who went on the trip. Of course, you can add
    pictures of your favorite film stars if that''s what you want to do. It''s all
    up to you. Just make sure that you have a background image that has a lot of top
    space. For pasting purposes, your snapshots should do nicely. It''s also nice
    if you can choose two vertical and two horizontal shots, for maximum effect.


    For my part, I will be using the photo of Wilmington, North Carolina, that I took
    last summer (shown way back in Figure 11-17) and, to paste on top of that, some
    photos of friends I visited at that time (Figure 16-16).


    ![](img/3badae5570de77b990135448f8a8a1cc_328_0.png)


    ![](img/3badae5570de77b990135448f8a8a1cc_328_1.png)


    *Figure 16-16: Examples of photos to be used in a custom desktop wallpaper (excluding
    the background image)*


    Once you have selected your pictures, open them all in the GIMP, and then save
    each one under a new name, such as donnyatsdisney_project.jpg, to protect the
    originals. After you''ve done that, you''ll be ready to follow along. Here goes.
    . . .


    # **Phase One: Cropping**


    The first thing you may (or may not) have to do is crop all or some of the images
    you will be pasting onto the background image. Since these images will be much
    smaller than the background, you will want the content of those'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'images to be clear . . . and big. That being the case, if the person you are
    going to be focusing on in a particular image is dwarfed by his or her surroundings,
    you''ll need to crop.


    The image on the left side of Figure 16-17 is a good example, where my friend
    is barely visible, while his house clearly is. Since it is my friend whom I wanted
    to add to my wallpaper, not his house, I had to do some cropping.


    ![](img/3badae5570de77b990135448f8a8a1cc_329_0.png)


    Figure 16-17: An image before and after cropping


    To crop the image to about the size I wanted, as seen on the right side of Figure
    16-17, I clicked the **cropping tool** (second row, last tool in Figure 16-13)
    and then, with that tool, outlined the area I wanted to crop, as seen in Figure
    16-18. When finished, I clicked the **Crop** button, and the job was done.


    ![](img/3badae5570de77b990135448f8a8a1cc_329_1.png)


    Figure 16-18: Cropping an image in the GIMP'
  merge: -1
  img_proc: true
- pgno: 330
  md: "# Phase Two: Resizing\n\nOnce you’ve cropped any images in need, the next thing\
    \ you have to do is resize the photos so that they all pretty much have the same\
    \ dimensions and so that they will appear at an appropriate size in contrast to\
    \ the much bigger background image. Here are the steps:\n\n+   1. Determine the\
    \ size of the background image by clicking the window for that image and then\
    \ selecting **Image** ▶ **Canvas Size**.\n\n+   2. When the Canvas Size window\
    \ appears (Figure 16-19), note the larger of the two numbers near the top of the\
    \ window, whether it be Height or Width. In the case of Figure 16-19, note the\
    \ dimensions of the image as displayed near the top of the Canvas Size window\
    \ (1986 × 1452 pixels in this case).\n\n![](img/3badae5570de77b990135448f8a8a1cc_330_0.png)\n\
    \n*Figure 16-19: Determining the size of an image*\n\n+   3. The size of the vertical\
    \ images you paste onto the background image should be approximately one-fourth\
    \ the height of the background, so once you know the height of your background\
    \ image, do the math. In my case, the ideal size would be around 360 pixels ($4\
    \ × 360 = 1440$); yours will most likely be slightly different.\n+   \n+   It\
    \ is probably helpful, though not absolutely necessary at this point, to view\
    \ all of your images at their full size. This helps avoid confusion in terms of\
    \ perception. You can tell the size at which you are viewing an image by looking\
    \ at the title bar, where it will say, at the very end of the title, *100%* or\
    \ *37%* or whatever (see top of Figure 16-18). You want them all to be showing\
    \ at *100%*, so look for any that aren’t, click them (one-by-one, of course),\
    \ and then select **Zoom** ▶ **1:1 (100%**) in the **View** menu. When you have\
    \ done this for each of the photos in question, you are ready to move on and resize\
    \ the images.\n\n+   4. Choose one of the vertical paste-on images by clicking\
    \ it or its window, and select **Scale Image** in the **Image** menu.\n\n+   5.\
    \ When the Scale Image window appears, adjust the number for the *Height* box\
    \ in the top half of the window so that it matches the number you"
  merge: -1
  img_proc: true
- pgno: 331
  md: '+   6. When finished, click **OK**, and then repeat the process for the other
    vertical image.


    Next, move on to the horizontal paste-on images. The process for these is the
    same, but this time, after the **Scale Image** window appears, adjust the number
    of the pixels in the *New Width* box so that it is the same number of pixels as
    you used for the height of the vertical images. Doing this will make the horizontal
    images as wide as the vertical images, which will produce a better-looking final
    product. Anyway, once you have done that, click **OK**, and then move on and do
    the same for the remaining paste-on image.


    # Phase Three: Turning Your Background Image into a Work of Art


    Okay, now that you’ve gotten everything ready, it’s time to start playing around
    with filters and effects. The first thing you’re going to do is turn your background
    image into an oil painting. Although this sounds like a rather spectacular thing
    to do, it is incredibly simple. Just follow these steps:


    +   1. Go to the **Filters** menu of your background image window and select **Artistic
    \  Oilify**.


    +   2. Once the **Oilify** window appears, click the **OK** button, after which
    a progress bar will start moving to the right at the very bottom of the back-ground
    image window, signaling the progress of the oilification process. Once it is complete,
    you will notice the changes.


    If you would like things to look a bit more oilified, go to the **Edit** menu,
    select **Undo**, and then repeat the **Oilify** steps. However, this time around,
    when the **Oilify** window appears (Figure 16-20), click the box next to *Use
    Intensity Algorithm*, and increase the number of the *Mask Size* in order to increase
    the effect. In case you’re wondering, the Intensity Algorithm helps retain the
    colors and detail of your original image, while the Mask Size refers to the brush
    size of the oilified image—higher numbers produce larger strokes and thus oilier
    looking results.


    ![](img/3badae5570de77b990135448f8a8a1cc_331_0.png)


    +   3. Now that your background image has become a work of art, it seems only
    fitting that it be on canvas rather than flat paper. To do this, go to the **Filters**
    menu and select **Artistic \ Apply Canvas**.'
