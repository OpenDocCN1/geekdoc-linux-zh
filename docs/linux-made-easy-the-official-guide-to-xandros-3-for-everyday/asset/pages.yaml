- pgno: 384
  md: '# 18


    # TIME TO UNWIND

    Gaming


    ![](img/3badae5570de77b990135448f8a8a1cc_384_0.png)


    Many a person is loath to admit it, but games are a big attraction to almost everyone
    at the helm of a personal computer. Even those who deny being gamers often find
    themselves caught in the act of rapping off a quick round of solitaire between
    work projects. The popularity of games is even suggested by the fact that most
    Linux distributions come bundled with more games than any other type of application.
    Xandros, for example, comes with 11 games, and many others are available via Xandros
    Networks.


    Of course, unlike most other applications, games are tied in to the user''s personality,
    and not everyone takes a fancy to the same game or even genre of game. For example,
    many people, especially in or from the Windows world, continue to love the game
    Minesweeper (Figure 18-1), while it is pure snoresville for me. Thus, although
    there are already many games included in your system, there are probably only
    two or three that will actually ever get played more than once or twice.'
  merge: -1
  img_proc: true
- pgno: 385
  md: '![](img/3badae5570de77b990135448f8a8a1cc_385_0.png)


    Things being what they are, gamers and neo-gamers alike seem to be in a perpetual
    search for new games that will satisfy whatever it is that their game-playing
    side finds enticing. This no doubt explains why store shelves are so often filled
    with games for the Windows market. Fortunately for Linux users, while there are
    many games for sale, there are even more games that can be downloaded from the
    Internet for free, many of which are available via Xandros Networks.


    # Taking Stock of What You’ve Got


    As I already mentioned, your Xandros system comes bundled with 11 different games.
    A quick look through the **Launch** menu (***Applications* ► *Games***) will show
    that these are broken into four different categories: *Arcade, Board, Cards,*
    and *Strategy.* If you installed the mouse odometer, *kodo,* in Chapter 8, there
    will also be another category—* Toys.* Most of these games are variations on other
    well-known games that you may have played in the past and thus require no explanation.
    The only two exceptions are *Miniature Golf* (also known as *Kolf*) and *Atomic.*


    # Miniature Golf


    Miniature Golf (Figure 18-2), as its name implies, is a miniaturé golf– simulation
    game.


    You can play it with any number of additional players, or you can have a run at
    the course solo, if you prefer. Conceptually, the game is quite easy to play,
    but setting it up can stump you a bit the first time out.


    To start playing Miniature Golf, go to the **Game** menu and select **New,** and
    a New Game window (Figure 18-3) will appear.


    The game is set up by default for two players, but you can add more players by
    clicking the **New Player** button. Once you have added whatever number of players
    you’d like, name each of the players by typing their name or initials in the text
    boxes that say *Player 1, Player 2,* and so on. If you would like to play the
    game alone, type your name or initials in the box that says *Player 1,* and then
    click the **Remove** button to the right of *Player 2.*'
  merge: -1
  img_proc: true
- pgno: 386
  md: '![](img/3badae5570de77b990135448f8a8a1cc_386_0.png)


    *Figure 18-2: Miniature Golf*


    ![](img/3badae5570de77b990135448f8a8a1cc_386_1.png)


    *Figure 18-3: Choosing the number of players for Miniature Golf*


    Once you have chosen the number of players, you have to go on and pick your course,
    since the default is an essentially unplayable *Create New*. Here’s what you need
    to do:


    +   1.  Click **Course** in the left pane of the New Game window.

    +   2.  Select the course you want from the list in the right half of the window
    (Figure 18-4).

    +   3.  Finally, click the **OK** button, and you’ll be ready for action.


    Once you begin playing, it should all be simple enough to figure out, as it is
    pretty much the same as a regular game of miniature golf—just stroke your ball
    through the whole course, dealing with mounds, bumpers, sand traps, and ponds
    along the way, while trying to do so with as few strokes as'
  merge: -1
  img_proc: true
- pgno: 387
  md: 'possible. Just remember that the power of your stroke is determined by the
    duration of your mouse click—the longer you hold down the mouse button, the stronger
    your stroke will be.


    ![](img/3badae5570de77b990135448f8a8a1cc_387_0.png)


    # ### Atomic


    Atomic (Figure 18-5) is a fun (perhaps even somewhat educational) puzzle-like
    game that can be quite frustrating, depending on how you look at things.


    ![](img/3badae5570de77b990135448f8a8a1cc_387_1.png)


    The idea is quite simple: assemble the scattered atoms in the main playing area
    in the left half of the window so that they match the example of the assembled
    chemical molecule shown on the right half of the window. Yes, that''s right, even
    if you don''t know anything about atoms or chemicals, you can still'
  merge: -1
  img_proc: true
- pgno: 388
  md: 'follow along because you have an example right there in front of you, so knowing
    how things should go together is the easy part. Actually putting them together,
    though . . . well, that''s the challenge.


    If you prefer things a bit more complex, you can spice things up by building capsacin
    or caffeine rather than fiddling around with the likes of mere water or methane.
    To do this, just use the scroll bar or arrow buttons above the preview window
    in the right side of the window (Figure 18-6), and select the molecule that suits
    your tastes.


    ![](img/3badae5570de77b990135448f8a8a1cc_388_0.png)


    Figure 18-6: Choosing your atoms in Atomic


    # Expanding Your Game Collection via Xandros Networks


    If you are quite the gamer and thus not satisfied by what you already have in
    your Games menu, you can, as I mentioned earlier, expand your gaming repertoire
    via Xandros Networks. There are a number of games available there via Standard
    and Expert modes, if you register with Xandros Networks. You can even download
    the very popular *Tax Racer* (Figure 18-7) from the Shop for free, though you
    will need to have an accelerated graphics card if you want to run that particular
    game happily, since it''s painfully slow if you don''t.


    How do you know whether you have an accelerated graphics card? Well, the easiest
    way to find out is to go through the documentation that came with your computer.
    If you don''t have that, or if you can''t find the answer within the docs, just
    go ahead and install Tax Racer, and see how it goes. If it runs at a seemingly
    normal game speed, you''ll know you have an accelerated graphics card, while if
    it runs in molasses mode, then you''ll know you don''t (or at least don''t have
    one that is compatible with the game).'
  merge: -1
  img_proc: true
- pgno: 389
  md: '![](img/3badae5570de77b990135448f8a8a1cc_389_0.png)


    Figure 18-7: Tux Racer


    If you do happen to find that things are just too sluggish to deal with, there''s
    no need to worry, as no harm has been done to your system. Just try to get your
    mouse down to the **Quit** button, and exit the game by clicking it. After that,
    you can remove the game from your system via the Xandros Net-works application.


    There are a far greater number of games available from XN that do not require
    you to have an accelerated graphics card. These include famous clones of familiar
    games, such as *Tetris*, *Same Game*, the freeware classic from Japan; *Battleship*;
    and the German card game, *Lieutenant Skat*, which comes bundled with most other
    Linux distros. For my part, however, I will be focusing on two other games that
    may not be particularly familiar to you, if at all, but are loads of fun and classics
    in their own right: *Frozen-Bubble* and *Psol*.


    # Frozen-Bubble


    Frozen-Bubble (Figure 18-8) is a classic, and although it has been ported over
    for use in the Windows and Mac worlds, its roots and soul are pure Linux.


    The objective of Frozen-Bubble is simple: shoot down all the bubbles in a screen
    in order to move on to the next. While this may sound so simple as to border on
    being boring, that is not the case. And best of all, you can live eternally in
    the world of Frozen-Bubble because you just cannot die; every screen you fail
    to clear the first time around will repeat over and over and over again until
    you get it right. Pretty cool (the life-eternal bit, at least), you have to admit.'
  merge: -1
  img_proc: true
- pgno: 390
  md: '![](img/3badae5570de77b990135448f8a8a1cc_390_0.png)


    Figure 18-8: Frozen-Bubble—a Linux classic


    # Installing Frozen-Bubble


    To get Frozen-Bubble, just run Xandros Networks, type **frozen-bubble** in the
    search box, and then click **Search**. After that click **Install** next to *Frozen-Bubble*,
    and you''ll be on your way.


    # Running and Playing Frozen-Bubble


    Once you’ve installed Frozen-Bubble, you can run it by going to the **Launch**
    menu and selecting **Applications ▶ Games ▶ Arcade ▶ Frozen-Bubble**. The game
    will appear in a window, which will be black until it finishes loading, after
    which you will see the main-menu screen for the game (Figure 18-9). You cannot
    use your mouse in Frozen-Bubble, so navigate through the choices with your up
    and down cursor keys, and then press **ENTER** to make your selection. The default
    setup is one-player window mode with sound on, so if that sounds fine enough for
    you, just press **ENTER** straightforward to get started playing.


    # Game Play in Frozen-Bubble


    As I mentioned, the idea of the game is to shoot down all the bubbles in the screen
    in order to move on to the next screen. You shoot the bubbles down with more bubbles,
    and you must hit a group of two or more bubbles of the same color with another
    of the same color in order to bring them all down. Once the bottom-most bubble
    makes contact with the bottom of playing area, all the bubbles will freeze over
    (hence the game’s name), and you will have to start the level over again. Remember,
    you can play any level over and over and over until you get it right, with no
    penalties for your persistence.'
  merge: -1
  img_proc: true
- pgno: 391
  md: '![](img/3badae5570de77b990135448f8a8a1cc_391_0.png)


    # Controls


    Since you cannot use your mouse in Frozen-Bubble, you need to use your left and
    right cursor keys to aim the bubble you are going to shoot, and then use the up
    cursor key to actually shoot it. When you are finished playing the game, usually
    because you are worn out, just press the ESC key, which will bring you to the
    *High Scores* screen, where you can record your high scores by entering your initials
    and then hitting ENTER. Hit the ESC key again, and you''ll be back at the options
    screen; hit ESC one more time, and Frozen-Bubble will close itself down completely.


    # The King of Solitaire Games: PySol


    Well, now that we''ve installed one classic Linux game, let''s jump right over
    to another, and this one has to be considered the king of solitaire games—PySol.
    PySol includes just about every solitaire game known on your part of the earth
    and then some, thus providing you with over 200 different games. These include
    poker-based solitaire games, such as *Poker Shuffle* and *Poker Square*; solitaire
    games played with Japanese *Hanafuda* cards (as shown in Figure 18-10), such as
    *MatsuKiri* and *Onsozo Hanafuda* puzzles, such as *Pegged* and *Hanoi*; and card-based
    memory games, such as *Concentration* and *Memory 24*. All in all, an exceedingly
    cool and eclectic collection!


    # Installing PySol


    To install PySol, run the Xandros Networks application, type **pysol** in the
    search box, and then click the **Search** button. After that, click **Expert View**
    in the bottom-left corner of the window, beneath the words *Search Results*. The'
  merge: -1
  img_proc: true
- pgno: 392
  md: 'choices available to you will appear in the right pane. In that pane, click
    **Install** next to `xandub-ysol`, and then follow the usual steps you learned
    in Chapter 8 to finish the job.


    ![](img/3badae5570de77b990135448f8a8a1cc_392_0.png)


    *Figure 18-10: Playing the Hanafuda solitaire game Gaji in PySol, the king of
    solitaire games*


    # ## Running and Playing PySol


    In order to play PySol, go to the **Launch** menu and select **Applications ▸
    Games ▸ Cards ▸ PySol**. PySol will then start up and be ready to play. To select
    the game you want to play, just go to the **Select** menu and choose from the
    many games listed there. Of course, since there are an awful lot of games in PySol,
    it would be a bit beyond the scope of this book to explain how to play every one
    of them. Fortunately, PySol comes with a pretty thorough help system that provides
    you with instructions for each of the games. To use this system, select the game
    you want to play, and once it appears, click the question mark button. Once you
    do this, the rules for the current game will appear in a separate window (Figure
    18-11).


    In addition to its help system, PySol allows you to see a demo of each game being
    played so that you can get a better feel for how things are done, a decidedly
    handy feature. In order to view one of these demos, select the game you want to
    play, go to the **Assist** menu, and select **Demo**. PySol will then begin playing
    the game for you. To make things all the clearer and easier to understand, it
    will display giant arrows to indicate its next move, as you can see in Figure
    18-12.'
  merge: -1
  img_proc: true
- pgno: 393
  md: '![](img/3badae5570de77b990135448f8a8a1cc_393_0.png)


    Figure 18-11: Individual game rules shown in a separate window in PySol


    ![](img/3badae5570de77b990135448f8a8a1cc_393_1.png)


    Figure 18-12: PySol''s demos show you how each game is played'
  merge: -1
  img_proc: true
- pgno: 394
  md: '# Project 18A: Getting a Little Adventurous with Njam


    Now that you''ve gotten a taste of the games that come bundled with your system,
    and of some of those available via Xandros Networks, it''s time to move on and
    have a bit of adventure. There are other games available on the Internet that
    are not specifically designed for use with Xandros—even available via Xandros
    Networks—but will still run on your system. These are not guaranteed or supported
    by Xandros, so if anything goes wrong, you are on your own. That said, you might
    feel a bit easier knowing that the game that I will be covering in this project
    is not actually installed per se, so there is no chance of conflict or breaking
    your system. I can vouch for this myself, as I have used this game on my system
    without any problems arising, so you should be fine.


    The game you will be installing is called *Njam* (Figure 18-13).


    ![](img/3badae5570de77b990135448f8a8a1cc_394_0.png)


    Figure 18-13: A new take on an old theme: Njam


    Njam is basically a clone of *Pac-Man*, that most popular of computer and arcade
    games in days of yore. Of course, with its 3-D-like graphics, cooler music, and
    new twists and turns, Njam is in many ways more fun to play, or at least different
    enough to make it all seem a bit fresh to any player who spent his or her fair
    share of quarters playing the original in the good ol'' days of dark and noisy
    video arcades.


    By the way, if you are wondering what Njam means, it is Serbian for *yummy*, which
    seems quite appropriate given that the whole concept of the game is to eat as
    much as you can. I suppose you might think of it as a non-caloric, no-carb way
    to pig out. Atkins Diet followers take note.'
  merge: -1
  img_proc: true
- pgno: 395
  md: '# 18A-1: Downloading and Extracting Njam


    To get Njam, follow these steps:


    +   1. Go to http://www.sourceforge.net, and click the **Linux binary** link.

    +   2. On the next page that appears, click any one of the files in the *Download*
    column. Selecting the file from the location geographically closest to you will
    probably provide you with the fastest download time, though it doesn''t always
    work out that way.

    +   3. Once you have chosen a site from which to download Njam, another page will
    appear, but you won''t need to click anything there; the download should just
    automatically begin. You will know when it does, because your web browser will
    pop up a window asking you what to do with the file.

    +   4. In that window, select **Save to Disk**, then click **OK**.

    +   When the download is complete, and must extract the tarball, as you learned
    to do in Chapter 5. Once you have done that, you will have a new folder with a
    name something like njam-l.21-1386 (the version number on yours might be higher
    if the application has been updated in the time after this book was released).

    +   5. Right-click that folder, and select **Rename** in the pop-up menu. Then
    go ahead and shorten the name to **njam**. This will make it easier to handle
    in the future.


    # 18A-2: Installing Njam''s Dependencies


    Now you are ready to play Njam... well, just about. As is stated on the Njam site,
    Njam has certain dependencies that must be met in order for it to be able to run.


    These consist of *libsdl-image*, *libsdl-mixer*, and *libsdl-net*. As you already
    know, when you install an application via Xandros Networks, any dependencies that
    application requires are automatically downloaded and installed at the same time.
    This time, however, since you downloaded Njam without using Xandros Networks,
    you will have to find and install its dependencies yourself.


    Luckily for you, all of these files are available via Xandros Networks, as they
    are required by many other applications. In fact, if you''ve already installed
    Frozen-Bubble, libsdl-mixer and libsdl-image will already have been installed
    on your system, meaning that the only file you''ll have to install yourself is
    libsdl-net.


    To install the files upon which Njam depends, run the Xandros Networks application,
    and then type **sdl** (that''s a lowercase l, not the numeral 1) in the text box
    next to the *Search* button. Then click the **Search** button, and a list of files
    containing *sdl* will appear in the bottom half of the right pane of the XN window
    (Figure 18-14).


    In that list, locate the three files I just mentioned, and install each of them
    using the method you learned in Chapter 8. If the file has the word *Remove* next
    to it, then you know that the file is already installed.'
  merge: -1
  img_proc: true
- pgno: 396
  md: '2. libsd-gfx1_2 (package size 38.16 KB) Remove Status: installed Description:
    drawing and graphical effects extension for SDL 3. libsd-image1_2 (package size
    24.32 KB) Remove Status: installed Description: image loading library for Simple
    DirectMedia Layer 1.2 4. libsd-mixer1_2 (package size 117.83 KB) Remove Status:
    installed Description: mixer library for Simple DirectMedia Layer 1.2 5. libsd-net1_2
    (package size 5.60 KB) Install Status: installed Description: network library
    for Simple DirectMedia Layer 6. libsd-sound (package size 42.52 KB) Remove


    Figure 18-14: Installing the dependencies for Njam via Xandros Networks


    # 18A-3: Running Njam


    Once the three dependency files are installed, the only thing you really have
    to do is run Njam. Because there is no menu launcher for you, However, you will
    have to run it via the Run Command window (Launch ▶ Run Command). Once the window
    appears, type /home/yourusername/njam /njm -w in the Command box in that window
    (being sure to place your username in the appropriate spot within the string).
    After you''ve done that, click Run, and Njam will start right up.


    In case you''re wondering, that -w flag (you''ll learn a bit more about flags
    in Chapter 20) causes Njam to open in a window (hence the w) rather than in full-screen
    mode. This is important, since running Njam in full-screen mode (without the -w
    flag) might cause some machines to freeze and then log out, which isn''t something
    you would normally want to happen. No damage done if it does, of course, because
    all you have to do in that case is log in again, but why bother, right?


    # 18A-4: Creating a Menu Launcher for Njam


    Rather than typing in a command each and every time you want to run Njam, you
    might like to create a menu launcher for it in order to make things a tad more
    convenient. You can also use the same process to add menu launchers for any other
    applications you need, so it is indeed worth having a go. Here are the steps for
    creating a menu launcher for Njam:


    +   1. Close the still-open Njam window by pressing the ESC key.

    +   2. Next, go to the Launch menu and select Applications ▶ System ▶ Menu Editor.

    +   3. When the Menu Editor appears, click the + symbol next to Games and then
    the + symbol next to Arcade.'
  merge: -1
  img_proc: true
- pgno: 397
  md: '4. After that, click **Arcade** itself, and your window should look like mine
    in Figure 18-15.


    ![](img/3badae5570de77b990135448f8a8a1cc_397_0.png)


    *Figure 18-15: Preparing to add a new menu launcher for Njam via the Menu Editor*


    Assuming everything looks pretty much as it should, you are ready to add a new
    menu item.


    5. Go to the **File** menu and select **New Item**, and a small New Item window
    will appear.


    6. In the text box in that window, type **Njam** (as in Figure 18-16), and then
    click **OK**. The *Name* box in the right panel of the Menu Editor window should
    now say *Njam*.


    ![](img/3badae5570de77b990135448f8a8a1cc_397_1.png)


    *Figure 18-16: Naming a new menu item in the Menu Editor*


    7. In the *Comment* box, type **A Pacman clone** (or just leave it blank if you
    prefer).


    8. In the *Command* box, type `/home/yourusername/njam/njam -w`.


    9. To start rounding things up, give your new launcher an icon by clicking the
    square box to the right of the *Name* and *Description* boxes.'
  merge: -1
  img_proc: true
- pgno: 398
  md: '10. In the Select Icon window that appears, scroll down until you find an icon
    called *package_toy*, which looks like a happy face sticking out its tongue (Figure
    18-17).


    ![](img/3badae5570de77b990135448f8a8a1cc_398_0.png)


    *Figure 18-17: Selecting an icon for the Njam menu launcher*


    11. Once you locate the icon, click it once to select it, and then click the **OK**
    button. The Menu Editor window should then look like that in Figure 18-18.


    ![](img/3badae5570de77b990135448f8a8a1cc_398_1.png)


    *Figure 18-18: Data in place for a new Njam menu launcher in the Menu Editor window*'
