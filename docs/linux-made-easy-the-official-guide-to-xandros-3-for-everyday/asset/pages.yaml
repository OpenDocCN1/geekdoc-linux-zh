    # STUFFED SHIRTS


    # Office and Other Productivity Applications


    ![](img/3badae5570de77b990135448f8a8a1cc_346_1.png)


    Well, now that we’ve covered the systemic, mechanical, and aesthetic side of things,
    let’s move on to what is of the highest priority to many, if not most, users—productivity.
    Of course, in a sense, we’ve already covered several of these so-called productivity
    apps in previous chapters, since many Internet applications and the Personal Information
    Manager suite (covered in Chapter 12) certainly qualify as such. Still, when most
    users think of productivity, they are thinking office suites, and in this area
    Xandros is sure to please.


    Xandros comes bundled not only with a number of utilities that fit nicely into
    the productivity category but also with the very popular OpenOffice.org office
    suite, which is a viable and very capable contender in this last-man (or person)-standing
    arena. To make things all the better, the three main components of OpenOffice.org’s
    office suite (*Writer*, *Calc*, and *Impress*) are also compatible with their
    Microsoft Office equivalents (*Word*, *Excel*, and'
  merge: -1
