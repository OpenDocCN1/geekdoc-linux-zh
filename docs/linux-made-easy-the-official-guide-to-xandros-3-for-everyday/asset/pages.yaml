- pgno: 168
  md: '# 9


    # MAKING LASTING IMPRESSIONS


    Setting Up and Using Your Printer


    ![](img/3badae5570de77b990135448f8a8a1cc_168_0.png)


    When personal computers first appeared, people began talking about the dawn of
    the age of the paperless office, but what actually came to pass is quite different.
    Because of the PC’s desktop-publishing capabilities and the continual decline
    in the prices of increasingly capable and sophisticated printer hardware, more
    printing (and paper use) is going on now than ever before. Whether it be for preparing
    school or business reports, printing out high-resolution copies of images from
    one’s digital camera, creating uniquely personalized business cards, or even producing
    colorful CD or DVD labels and jewel-case inserts, people are printing more than
    ever. Unless the only thing you use your computer for is playing games, listening
    to MP3s, or stopping doors on hot, windy days, you will no doubt want to hook
    up your machine to a printer.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# Is My Printer Supported?


    Setting up a printer to work with your new system is actually a very easy task,
    but you do have to make sure that your printer is supported. Fortunately, printer
    support in the Linux world is much, much better than it once was. In general,
    support for Epson and Hewlett-Packard inkjet printers is pretty good, while support
    for other makers and other printer types is a bit spottier, though improving.


    If you really want to make sure that your printer is ready for Linux, probably
    the best thing to do is go to www.linuxprinting.org. On that site, you can check
    out the online database to see if your printer is currently supported, and if
    it is, to what degree. Listings for supported printers also include information
    on what *drivers* the little utility applications that basically tell your printer
    what to do, are best for your purposes. If you''re thinking of buying a printer,
    there is also a page of suggested makes and models.


    # Project 9A: Setting Up Your Printer


    Before you can rush off and start printing, you will first need to set up your
    printer. To do this, you will have to connect your printer to the computer and
    then power on the printer. If you connect your printer to your computer''s parallel
    port rather than its USB port, you will first have to turn off the computer before
    connecting the cable. Once you have made the connection, turn on your printer,
    and then restart your computer. Of course, if your printer was already connected
    and powered up when you booted into your system, you can skip this step.


    After your printer is hooked up, powered up, and ready to go, setting it up system-wise
    is merely a matter of following these steps:


    +   1. Open a Xandros File Manager window, and then click **Printers** in the
    left pane of that window.

    +   2. The right pane of the window should be empty, except for the window title,
    *Printers*, and a link, *Add printer*, as you can see in Figure 9-1. Click the
    **Add printer** link.

    +   3. The *Add Printer Wizard* (Figure 9-2) will now appear. In the first page
    of the wizard, select **Local printer** (the usual setup in home environments)
    or **Network printer** (if you are using a printer connected to your network but
    not directly to your computer, as is often the case in office environments), and
    then click **Next**.


    > NOTE You can also bring up the Add Printer Wizard via the Control Center, if
    you prefer, by clicking *Peripheral Devices* in the left pane of the Control Center
    window and then clicking *Printers* in the list of subcategories that appears
    below. When the *Printers* module appears in the right pane of the window, click
    the *Add* button, which will bring up the wizard.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '![](img/3badae5570de77b990135448f8a8a1cc_170_0.png)


    Figure 9-1: The empty Printers window in Xandros File Manager


    ![](img/3badae5570de77b990135448f8a8a1cc_170_1.png)


    Figure 9-2: The Add Printer Wizard


    +   4. In the next page of the wizard (Figure 9-3), you will see your printer
    listed. Don''t get too excited yet; this shows that your system knows what kind
    of hardware you have—it doesn''t necessarily mean that it will work. Click **Next**.


    > **NOTE** *HP printer users: If you are using a Hewlett-Packard printer, you
    may be presented with a small window at this point telling you that your printer
    may work better with the HPQ! driver (Figure 9-4). This message depends on the
    model you are using and how it is connected to your computer (the parallel port
    or the USB port). Because my printer is connected via the computer''s parallel
    port, I don''t get this message, but if you do, skip ahead to the “Hewlett-Packard
    Printers” section of this chapter.*'
  merge: -1
  img_proc: true
- pgno: 171
  md: '![](img/3badae5570de77b990135448f8a8a1cc_171_0.png)


    Figure 9-3: The Add Printer Wizard recognizes your printer


    ![](img/3badae5570de77b990135448f8a8a1cc_171_1.png)


    Figure 9-4: Warning to some HewlettPackard printer users


    5. The wizard will now show the manufacturer, model, and suggested driver for
    your printer in the next window. These entries should be correct, but this is
    not true in all cases. Sometimes, when it comes to the printer model, the wizard
    might not be completely correct. As you can see in Figure 9-5, the model is listed
    in the wizard as a PhotoSmart 140. Actually my printer is a PhotoSmart 1315, not
    a 140. In such cases, just choose the correct model from the appropriate drop-down
    menu button. When you’ve finished, click Next.


    ![](img/3badae5570de77b990135448f8a8a1cc_171_2.png)


    Figure 9-5: Selecting the manufacturer and model of your printer'
  merge: -1
  img_proc: true
- pgno: 172
  md: '6. Finally, in the last page of the wizard (Figure 9-6), you will be asked
    if you would like to print a test page, which isn''t a bad idea in order to immediately
    test that everything has gone according to plan. To do so, just select **Yes**,
    and then click **Finish**. The wizard will disappear, and your printer will begin
    to print out a test page almost immediately. If you take a look at the Xandros
    File Manager window, you will now find a new icon for your printer in that previously
    empty window. The icon will have a big red check mark on it, indicating that it
    is the default printer for your system.


    ![](img/3badae5570de77b990135448f8a8a1cc_172_0.png)


    While your printer is at work, you will see two new items appear on your desktop:
    a Print Jobs window, and on the Panel, a Print Jobs toggle that looks like a small
    printer, both of which you can see in Figure 9-7. The Print Jobs window shows
    you what document is currently being printed and what other documents are queued
    up to print after that. When nothing is printing or queued up for that purpose,
    the white area of the window will be blank. Clicking the toggle in the Panel acts
    to either hide or show the Print Jobs window.


    ![](img/3badae5570de77b990135448f8a8a1cc_172_1.png)'
  merge: -1
  img_proc: true
- pgno: 173
  md: '> NOTE These two items do not appear when printing OpenOffice.org documents.


    # ## Hewlett-Packard Printers


    As I already mentioned, if you are trying to set up a Hewlett-Packard printer,
    especially multifunction models or those connected to your computer via its USB
    port, you will see a small window after clicking the **Next** button on the second
    page of the wizard. The window will tell you that your printer may work better
    with the HPOJ (the initials stand for HP Office Jet) driver, as was shown in Figure
    9-4.


    Because your system probably knows best, click **OK** in that window, and then
    click the **Cancel** button in the wizard window. After doing that, go ahead and
    install the driver using Xandros Networks. Just type hpojj in the text box next
    to the Search button in the XN window. Then install the driver, listed as the
    HP Multifunction Printer Driver, using the procedure you learned in Chapter 8.
    Once the driver is installed, go back to step 1 of this project and start over
    again.


    This time around, however, when you click the **Next** button in the second page
    of the wizard, another window will appear asking you whether or not you would
    like to use the HPOJ driver (Figure 9-8).


    ![](img/3badae5570de77b990135448f8a8a1cc_173_0.png)


    *Figure 9-8: Telling the wizard to use the HPOJ driver (HP printer users only)*


    Unless you went through the trouble of installing it just for kicks, click **Yes**.
    The window will disappear, and you can then go on to step 3 of the printer setup
    procedures I just described in Project 9A.


    By the way, don’t be surprised by the fact that you do not see the HPOJ driver
    listed in the driver choices in the third page of the wizard; the HPOJ driver
    is what is called a *low-level* driver, one whose purpose is to provide added
    functionality to your printer, such as the ability to read memory cards from your
    digital camera or to scan images. It works in conjunction with other drivers for
    the actual business of printing.


    If you have a show-me sort of personality and want proof that the HPOJ driver
    is in fact installed, you can easily do so via the Xandros Networks application
    that you learned to use in Chapter 8. Just type hpoj in the text box at the top
    of the XN window, click **Search**, and then search for the driver in the list
    of results provided in the pane below. If the word *Remove* appears to the right
    of the driver in the list, you know it has been installed correctly. If the word
    *Install* appears instead, you will know that the driver was not correctly installed.
    In that case, just click the **Install** link to perform the installation.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# If Things Don''t Go According to Plan


    If things do not work out for you (for example, if the wizard doesn''t recognize
    your printer), keep your cool and try doing the following:


    +   1. Right-click the Printer icon that just recently appeared in the Xandros
    File Manager window, and select **Delete** in the pop-up menu.

    +   2. The printer icon should now be gone. If it is, restart your computer, keeping
    the printer connected and powered on.

    +   3. Once your system is back up and running, try adding the printer again.


    If that doesn''t work out, try checking Xandros Networks (with the **Debian Unsupported
    Site** option selected) to see if there is a special driver available for your
    printer, or check the Xandros FAQs (http://support .xandros.com) or User Forums
    (http://forums.xandros.com) for help or advice. You might want to double-check
    with www.linuxprinting.org, if you haven''t already done so, to see if there is
    anything special they have to say about your particular printer.


    If everything seemed to go fine except for the printout quality of the test page
    you made at the end of the last step of the setup wizard, try using a different
    driver. To do this, follow these steps:


    +   1. Right-click the icon for your printer in the Xandros File Manager window,
    and select **Properties** in the pop-up menu.

    +   2. When the Properties window appears, click the **Change Model** button.

    +   3. In the Change Printer Model window that then appears (Figure 9-9), select
    one of the other driver options listed in the **Driver** drop-down menu, and then
    click **OK** in that window and **OK** in the Properties window.

    +   4. Try printing out another document.


    ![](img/3badae5570de77b990135448f8a8a1cc_174_0.png)


    Figure 9-9. Changing drivers for your printer'
  merge: -1
  img_proc: true
- pgno: 175
  md: "# ## Using Your Printer\n\nNow that your printer is set up, you will no doubt\
    \ want to start printing. This is an easy task and not much different from how\
    \ it works in the Windows and Mac worlds.\n\nYou should be aware, however, that\
    \ there are two different print dialog windows that might appear when you set\
    \ out to print. Which of these will appear depends on the application you happen\
    \ to be using. Most applications will utilize the KDE-based print dialog window\
    \ (*kprint*), while OpenOffice.org uses its own. The look and options of the KDE-based\
    \ dialog window will vary somewhat, depending on the application you are using\
    \ at the time.\n\n# ### Changing Printer Settings\n\nAs you print out various\
    \ things, it is inevitable that, for one reason or another, you will want to change\
    \ your printer settings. For example, let's say that you are running low on colored\
    \ ink and want to keep everything in black or shades of gray for a while. Or maybe\
    \ you want to print a particular photo at a higher resolution than the default\
    \ resolution setting of your current printer driver. Or maybe you want to print\
    \ a page horizontally rather than vertically. Doing all this is pretty straightforward.\n\
    \n# ### Changing the Print Range and Number of Copies to Print for Your Document\n\
    \nIf you are working with a multipage document, your system will automatically\
    \ print out the whole shebang when you go about printing. This is all fine and\
    \ dandy, but what if you want to print out only the first three pages of the document?\
    \ Or what if you want to print out only the page you are currently looking at?\
    \ Well, none of these possibilities poses any problem, because you can easily\
    \ print out only what you want via the Print dialog window.\n\nTo get started,\
    \ just select **Print** from the **File** menu in the application you are using.\
    \ The Print window (Figure 9-10) will appear.\n\nTo print a specific range of\
    \ pages, check the radio button for *Range*, and then type the range of pages\
    \ you want to print. For example, if you want to print out pages 7 through 13\
    \ of your document, you would type **7-13**. If you want to print out just pages\
    \ 7, 12, 13, and 20, you would type **7,12,13,20**. If you want to print out just\
    \ page 3, you would type **3** or **3-3**. If you want to print out just the page\
    \ you are currently viewing, click anywhere in that page before opening the Print\
    \ window, and then check **Current**.\n\n> **NOTE**\n> \n> *This option is available\
    \ only in applications that actually separate your document into pages. In the\
    \ case of a web page, for example, where the document itself is actually a long\
    \ single page, the option will not be available, even though it will print out\
    \ on several pages.*"
  merge: -1
  img_proc: true
- pgno: 176
  md: '![](img/3badae5570de77b990135448f8a8a1cc_176_0.png)


    Figure 9.10: A *kprint Print dialog window*


    # Other Options


    There are also a few other options available to you from the print dialog window.
    If, for example, you want to print out only odd or even pages, you can select
    the appropriate option from the *Page set* option button near the bottom-left
    corner of the window. If you want to print out more than one copy of the document,
    or parts thereof, select the desired number of copies in the box next to the word
    *Copies*.


    When selecting this *Option*, you also have the option of having the copies collated,
    meaning that they are printed in ordered sets. For instance, if you set the number
    of copies at 3, the pages would print out 1,2,3 and 1,2,3 and 1,2,3. This is the
    default arrangement, so there is nothing you need to do if you like this setup.
    If you would prefer that the copies print out in 1,1,1 and 2,2,2 and 3,3,3 order,
    you can do so by unchecking the box next to the word *Collated*. You can also
    have the pages print out in reverse order, regardless of the number of copies
    you''ve selected, by checking *Reverse*.


    If you are printing an OpenOffice.org document, most of these options will also
    be available to you, and there will be an additional option available: *Selection*
    (Figure 9-11).


    The *Selection* option allows you to print out only the text you may have highlighted
    in the document before bringing up the Print dialog window.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '![](img/3badae5570de77b990135448f8a8a1cc_177_0.png)


    *Figure 9-11: An OpenOffice.org Print dialog window*


    # Changing Paper Orientation and Size Settings


    To change the size or orientation of the page you are printing, select **Print**
    from the **File** menu in the application you are using, and then click the **Properties**
    button in the Print dialog window that appears. You will then see a Configuration
    window (Figure 9-12).


    ![](img/3badae5570de77b990135448f8a8a1cc_177_1.png)


    *Figure 9-12: Changing paper orientation and size settings*


    Once in the new window, you can change the orientation of your page from *Portrait*
    (vertical) to *Landscape* (horizontal) by clicking the appropriate button beneath
    the word *Orientation*. To change page sizes, make the appropriate choice from
    the menu button beneath the phrase *Paper size*. If you would also like to reverse
    the printing order of your document, that is, printing from the last page to the
    first rather than the other way around, click the *Last to first* button under
    the *Print Order* heading. Once you have made your choices, click **OK**. If you
    would like to use these settings for all your future documents, click **Save**
    before clicking **OK**.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'These same options are available to you when printing an OpenOffice.org document
    by clicking the **Properties** button in the OpenOffice.org Print dialog window.


    When the **Properties** window appears (Figure 9-13), you will notice that you
    can also choose to print out the document at a smaller size by adjusting the *percentage
    numbers in the Scale box*.


    ![](img/3badae5570de77b990135448f8a8a1cc_178_0.png)


    *Figure 9-13: Changing paper size, orientation, and scale settings in OpenOffice.org*


    Okay, so now let’s say that you want to print out a copy of one of the photos
    you downloaded to your hard disk from a digital camera. You may want your photo
    to come out at as high a resolution as possible. Or maybe you just want to print
    out a cheap and quick copy of the document you are working on without spending
    too much time or ink. Well, you can do either one of these things quite easily
    by changing your printer’s color and resolution settings.


    To do this, open the **Configuration** window, as you just learned to do in the
    previous section, and click the **Options** tab.


    Once in the **Options** tab, click the + symbol next to **General**, and then
    click **Printout Mode** when it appears beneath it. After doing this, the various
    printout-mode options available for your printer will appear in the right pane
    of the tab window (Figure 9-14). These options mainly consist of color, print
    quality, and paper settings, and they are usually grouped in sets. In case you
    are not too familiar with such printer settings, I will provide you with a very
    brief introduction now.


    Color settings should be fairly easy to figure out, as the name indicates what
    it does. **Black + Color**, for example, allows you to print in both color and
    black-and-white. **Grayscale**, on the other hand, allows you to print in black-and-white,
    such as a typical text document, and every shade of gray in between, as would
    be the case when printing a black-and-white photo. To vary the printout quality
    of your document, you adjust the dpi, or dots per inch, settings—the higher the
    dpi, the better the print quality. The **Draft mode** option also has an impact
    on print quality, because if you choose it,'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'the document is printed more quickly. What you gain in terms of speed, however,
    will probably cost you a bit in terms of print quality. If you are using an old
    or lower-quality inkjet printer, however, you may actually find your printed output
    crisper and clearer than in regular printing mode, but a bit of trial and error
    should show you what works best on your printer. To actually select the color
    and resolution mode you would like to use, click the appropriate item in the list;
    it will then be highlighted in blue. If you want to print out a copy of one of
    your digital images, you will want to select the highest dpi setting for a Black
    & Color Cartridge. In the case of my printer, the option reads “1200 dpi, Photo,
    Black & Color Carr., Photo Paper.” If you just want to print out a quick grayscale
    copy of a document, even one that contains color images, select the lowest dpi
    Draft Grayscale option available for your printer. In my case, for example, it
    is “300 dpi, Draft, Grayscale, Black & Color Carrt.” Once you have finally made
    your selections, click **OK**.


    ![](img/3badae5570de77b990135448f8a8a1cc_179_0.png)


    To adjust these settings when printing an OpenOffice.org document, click the **Properties**
    button in the OpenOffice.org Print dialog window. When the Properties window appears,
    click the **Device** tab, and then click **Printout Mode** in the left pane of
    that tab.


    You can then select from the various options available for your printer in the
    right pane (Figure 9-15).


    # ## Previewing Pages Before Printing


    It is often a good idea to see exactly what is going to be printed before actually
    doing the deed itself. This is very easy to do by going to the **File** menu of
    the document you want to print and selecting **Print Preview** (**Page Preview**
    in OpenOffice.org documents). The page will then appear in a separate window,
    in pretty much the state in which it will be printed. This is very handy when
    printing web pages (Figure 9-16), as it allows you to see how a lengthy single
    web page will be divided for printing.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '![](img/3badae5570de77b990135448f8a8a1cc_180_0.png)


    *Figure 9-15: Changing color and resolution settings for an OpenOffice.org document*


    If, for example, the information you want to print appears on page 2 in the Print
    Preview window, you can choose to print just that page. Once you have had a look
    through the page in the Print Preview window, you can move on to printing it out
    by clicking the **Close button** (*Close Preview* in OpenOffice.org). After that,
    just go ahead and start the printing process by selecting **Print** in the **File**
    menu.


    ![](img/3badae5570de77b990135448f8a8a1cc_180_1.png)


    *Figure 9-16: Previewing a page before printing*'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# *Printing to PDF*


    A very handy feature in Xandros is the ability to print or save documents to *PDF*.
    **PDF** (*Portable Document Format*) is a file format developed by Adobe that
    allows you to create documents that cannot be altered by others and yet can easily
    be read regardless of what word processor program or operating system another
    person is using. All the recipient of a PDF file needs in order to view that document
    is a copy of Adobe Acrobat Reader or any other similar PDF reader. PDF files are
    also usually smaller and can thus be more easily and quickly sent as email attachments.
    A 5.5 MB OpenOffice.org document of mine shrank down to only 770 KB when I printed
    it to PDF. It’s also a great way to save web pages, as the whole page, graphics
    and all, becomes one single, easily transportable file. All in all, ability to
    create PDF files is a very cool feature that you would have to pay a pretty penny
    for in the Windows world.


    Printing a file to PDF is really simple. Just open the file you want to PDF-ize,
    and select **Print** in the **File** menu of the application for that document.


    In the Print dialog window that then appears, click the drop-down menu button
    where your printer is listed and select **Print to File (PDF)**, as shown in Figure
    9-17. The default name of the file will be print.pdf, so if you want to change
    that to something more meaningful, you can do so in the text box next to the words
    *Output file*. Just change the text immediately before the _.pdf* extension, not
    the path before that. For example, you might change /home/your_username/print.pdf
    to /home/your_username/saturnvuelhp.pdf, and so on.


    You can do the same thing with OpenOffice.org documents, though the process is
    slightly different; there, the Print to File (PDF) option becomes Export.


    ![](img/3badae5570de77b990135448f8a8a1cc_181_0.png)


    *Figure 9-17: Printing a file to PDF*'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'For an OpenOffice.org document, open the document you want to save to PDF,
    and then click the small button in the OpenOffice.org window that looks like a
    red and white Adobe Acrobat logo (see Figure 9-18 if you''re not sure what one
    looks like). After that, an Export window will appear in which you can name the
    file. Once you''ve done that, click **Export**.


    ![](img/3badae5570de77b990135448f8a8a1cc_182_0.png)


    Figure 9-18: Exporting an OpenOffice.org document as a PDF file


    # Project 9B: Adding Another Printer (Even If You Don''t Really Have One)


    Because most computers have one parallel port (also often called a *printer port*)
    and at least two or more USB ports, there is no reason that you can''t have more
    than one printer attached to your machine. You might want to do this, for example,
    if you have a black-and-white laser printer that you use for your more serious
    or official documents and an inkjet printer that you use for printing out photos
    and other fun stuff. Adding the extra printer would be no different from adding
    the first. Just go back to Project 9A and repeat the steps.


    After the second computer has been set up, you can tell your system which computer
    to use when printing a given document by clicking the drop-down menu button that
    shows your default printer''s name, just as you did when printing to PDF. Then
    select the printer you want to use from the list, because both printers will show
    up there.


    If you find that you would prefer using the new printer most of the time, while
    using the original only when needed, you can make the newbie the default printer
    for your system. You can do this by opening the Xandros File Manager window and
    clicking **Printers** in the left pane. In the right pane, right-click the printer
    you would like to set as the default printer for your system, and select **Set
    as Default** in the pop-up menu. If you want to have the original printer as the
    default again, just repeat the process for that printer.


    # 9B-1: Adding Your Virtual Printers


    Now, you don''t actually have to have another printer in order to add another
    printer. This might sound a bit screwy on my part, but it''s true. Let me explain
    why you might want to do this. The default printout setting for most inkjet printers
    is Normal mode, which is usually a medium resolution using both black-and-white
    and color cartridges. This is fine for most people most of the time, and thus
    is the reason it is called Normal. Well, what if you aren''t normal? What if you
    mostly like to print things out quickly in draft-quality black-and-white, and
    when you''re not doing that, you are printing out high-resolution photos? Normal
    mode is pretty useless to you in this case.'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'The perfect solution for your state of affairs, in this imaginary world I am
    painting, is to add your printer two more times, with each printer set up to print
    at the resolutions you prefer. You would thus have three printers in the eyes
    of your system, but only one actually sitting there on your desk. Pretty cool
    idea, if you ask me.


    How do you do this? Well, exactly as you did the first time around. Just go through
    the printer setup process as you did before, making all the same choices. The
    only difference this time around is in the second page of the wizard. In that
    page, you have the option of giving your printer a name. The first time you did
    this, you just accepted the actual hardware name of the printer, but this time
    you will have to give each of your two new virtual printers a new and meaningful
    name. (Be aware that printer names cannot have any spaces in Linux; if you just
    have to have a space, use an underscore (_) instead.) For example, you might want
    to call your quick black-and-white draft-mode printer "Drafty," while you could
    call your photo-printing printer "HiRes." Also, you might as well skip printing
    out a test copy in the last page of the wizard, because you won’t have set things
    up exactly the way you want at that point. Anyway, once you have finished setting
    up your two new virtual printers, you can go ahead and do the fine-tuning.


    # **9B-2: Fine-Tuning Your Printers**


    Now that you have added your new trusty workhorses, Drafty and HiRes, it is time
    to set each of them up so that their output matches their names. To do this, open
    the Control Center, and select **Periheral Devices** > **Printers**. When the
    Printers module appears in the right pane of the window, it should look something
    like mine in Figure 9-19.


    ![](img/3badae5570de77b990135448f8a8a1cc_183_0.png)'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'To get down to business, here’s what you need to do:


    +   1. Start off by clicking **HiRes** in the list and then clicking the **Properties**
    button.


    +   2. When the Properties window appears, click the **Advanced** tab, and then
    select **General ▶ Printout Mode**.


    +   3. In the right pane of the window, click **Photo (on photo paper)**, which
    should leave your window looking much like mine in Figure 9-20, assuming, of course,
    that your printer has a similar setting available.


    +   4. If everything looks just about right, click **OK**.


    ![](img/3badae5570de77b990135448f8a8a1cc_184_0.png)


    You will now be back at the Control Center window, so go ahead and repeat the
    same process for **Drafty**. This time around, however, let’s pick **Draft Grayscale**
    in the list at the right of the Advanced tab. Once you have clicked the **OK**
    button and are back at the Control Center, you can quit the Control Center and
    move on to trying out your new printers.


    # 9B-3: Selecting and Trying Out Your New Virtual Printers


    Now that you have two new printers (and without spending a dime, I might remind
    you), it is only natural to try them out. Start out with Drafty by printing out
    a web page. The No Starch Press home page will do fine for this purpose, so here’s
    what you need to do:


    +   1. Punch up http://www.nostarch.com in your web browser.


    +   2. When the page has completed loading, go to the **File** menu and select
    **Print**.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '3. When the Print dialog window appears, choose **Drafty** in the drop-down
    menu button next to the word *Name* in the Printer section of the window (Figure
    9-21), and then click **Print**.


    ![](img/3badae5570de77b990135448f8a8a1cc_185_0.png)


    Figure 9-21: Selecting your new virtual printer in the Print dialog window


    Within a few seconds, you will have a grayscale printout of that page in your
    hands. Pretty cool, no? You can go ahead and try out HiRes now, if you like, but
    I would suggest trying it out at its full potential by printing out one of your
    digital-camera images on photo-quality paper.


    **NOTE**  *If you want to use your new virtual (or even real) printers with OpenOffice.org,
    you will first have to close all OpenOffice.org modules that happened to be open
    when you installed the printers and then restart the ones you want. Also, if you
    would like to set up one of your two new virtual printers as the default printer
    for your system (Drafty being a more logical choice than HiRes), you can easily
    do so using the method I described at the very beginning of this project: open
    a Xandros File Manager window, click Printer in the left pane of the window, right-click
    the printer you want to set as the default, and then select Set as Default in
    the pop-up menu.*'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Canceling a Print Job


    To wrap up this chapter on printing, let’s cover a problem that at one time or
    another happens to all of us. You wanted to print just one page of a 57-page document,
    but by accident you started printing the whole thing. What can you do to save
    your ink and 56 sheets of paper?


    Fortunately, the solution is outrageously simple. Just open a Xandros File Manager
    window, if one isn’t already open, and click **Printers** in the left pane of
    that window.


    In the right pane, right-click the printer currently handling your print job,
    and select **Purge** in the pop-up menu (Figure 9-22). The page currently printing
    will probably print out to completion, but the printing will stop after that.


    ![](img/3badae5570de77b990135448f8a8a1cc_186_0.png)'
  merge: -1
  img_proc: true
