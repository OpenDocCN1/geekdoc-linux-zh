- pgno: 335
  md: '+   7. Once everything looks about right, click the **Rotate** button to actualize
    the rotation of the paste-on image.


    +   8. Now you will add a drop shadow so as to enhance the pasted-on look of the
    image. To do this, go to the *Script-Fu* menu in the menu bar of your main image
    window and select *Shadow → Drop Shadow*. When the Drop-Shadow window appears,
    click the **OK** button.


    When you now look at your image, you will probably be in for a bit of a shock
    because your newly created shadow will be on top of your paste-on image rather
    than under it, where it should be (Figure 16-26). This is, odd as it may seem,
    how it is supposed to be, so don’t panic.


    ![](img/3badae5570de77b990135448f8a8a1cc_335_0.png)


    +   9. To correct this peculiar situation, first click the **rectangular selection
    tool** in the main GIMP window, and then click once anywhere within the background
    image, but not within the area of the paste-on image therein. Once you do this,
    the dotted line immediately surrounding your paste-on image will disappear.


    You may be wondering what that seemingly unimportant mouse click is all about
    and whether it is really necessary. Well, it is necessary, and the reason for
    it is quite simple. When you paste an image into another, the pasted image actually
    resides in a floating layer. This is allows you to perform the rotations and drop
    shadowing we have done so far without affecting the rest of the layer. The click
    in this last step releases the floating layer, thereby allowing it to finally
    join with the layer into which it was pasted.


    +   10. Now go back to the *Layers, Channels, Paths* window, click the **Drop-Shadow
    layer**, which was automatically created when you created the shadow, within the
    main pane of that window, but don’t click the eye icon there, or the image will
    become hidden. Then, click the **down arrow button**. The Drop-Shadow layer should
    then be listed below the *Empty Layer*, where your paste-on image is located,
    as you can see in Figure 16-27.


    +   11. If you now take a look at your image, you will see that the shadow is
    where it belongs, beneath your paste-on image (Figure 16-28).'
