- pgno: 340
  md: 'Windows or Mac OS X isn’t clear, since both of those operating systems have
    the built-in capacity to allow their users to do the same. Still, web pages related
    to those systems do not seem to be anywhere as well endowed in the screenshot
    department.


    Now that you are a Xandros user, there is no reason that you too cannot join in
    on this obsession. Fortunately, it is all quite easy to do using the Screen Capture
    application that comes bundled with your Xandros system. To get started, run Screen
    Capture by going to the Launch menu and selecting Applications ▸ Graphics ▸ Screen
    Capture.


    # 16B-1: Taking Full-Screen Screenshots


    Taking a full-screen screenshot with Screen Capture is extremely easy. In fact,
    each time you run Screen Capture, it automatically takes a screenshot of your
    entire desktop and anything that happens to be open there at the time it starts
    up. After that, once it is up and running, all you have to do is select Full Screen
    in the drop-down menu button next to the words Capture mode, and then click New
    Snapshot (Figure 16-31).


    ![](img/3badae5570de77b990135448f8a8a1cc_340_0.png)


    Figure 16-31: Taking a full-screen screenshot with Screen Capture


    Screen Capture will then take a shot of everything that is visible on your screen,
    except your mouse cursor and Screen Capture itself.


    # 16B-2: Taking Screenshots of a Single Window


    If all you want is a screenshot of a single window, select Window Under Cursor
    in the Capture mode menu, and then click New Snapshot, after which Screen Capture
    will hide itself, as it always does at this point. Now, click anywhere on the
    window you want to capture, and Screen Capture will immediately take a shot of
    it.


    NOTE If you would like to take a screenshot of a window without its window borders,
    uncheck the box next to the words Include window decorations directly below the
    words Snapshot delay in the Screen Capture window.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# 16B-3: Taking Screenshots of a Single Menu or of an Open Menu Within a Window


    So far, so good, but what if you want to take a screenshot of a single menu or
    of an open menu within a window? Well, this is where the Snapshot delay function
    comes into play. Until now, we have been using Screen Capture without a delay,
    as the words *No delay in the Snapshot delay* box indicate (Figure 16-31).


    To take a screenshot of an open menu, select **Window Under Cursor** in the *Capture
    mode* menu, change the delay to something like 4 or 5 seconds, and then click
    the **New Snapshot** button. Once you have done that, rush over to the menu you
    want a shot of, click it (then release your mouse button), and leave the cursor
    in place anywhere within that menu. After the 4 or 5 seconds are up, Screen Capture
    will take a shot of that menu.


    If you would like a shot of that menu within its window, the process is almost
    the same. This time, however, once the menu is open, move the mouse cursor outside
    the menu area, so that it is instead somewhere in the target window area. Just
    leave it there until the 4 to 5 seconds are up, and you will have taken a shot
    like that in Figure 16-32.


    ![](img/3badae5570de77b990135448f8a8a1cc_341_0.png)


    # 16B-4: Taking Screenshots of a Region


    Screen Capture, like the application *Grab* in Mac OS X, also allows you to take
    screenshots of a *region*. As you can see in Figure 16-33, a region can include
    any part of the desktop, a window, a combination of windows, or whatever.


    To do this, select **Region** in the *Capture mode* menu, and then click **New
    Snapshot**. Unlike what happens when you take a full-screen or single-window screenshot,
    however, Screen Capture will not immediately take the shot this time around. Instead,
    you must first select the region you’d like to capture.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '![](img/3badae5570de77b990135448f8a8a1cc_342_0.png)


    *Figure 16-33: A screenshot of a region*


    Once you have clicked the **New Snapshot** button, you can select a region by
    clicking your mouse (but not releasing it) at one of the four corners that will
    make up the region you are going to define. When you then start dragging the cursor,
    which will now look like a crosshair, a dashed line will appear surrounding the
    area you are defining. Continue dragging until you have included everything you
