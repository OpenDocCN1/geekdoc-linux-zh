  md: '# ACKNOWLEDGMENTS


    There are, as always, a good number of people who deserve thanks for the help
    and support they provided either while or before this book was written, and there
    are still others whose help will come after the book is released. I would like
    to acknowledge all of them now.


    First, I want to thank my wife, Sumire, to whom this book is dedicated, for helping
    me out and encouraging me while I was writing this book and preparing to search
    for new digs in Portland, Oregon. My mother, Dixie Angelina Burckel-Testa, for
    whom my first book was originally written, again deserves great thanks for being
    so supportive of my various projects, helping out with the initial proofreading
    of this manuscript, and being a good sport in general. Then, of course, I must
    also thank my auntie, Danica Lucia Zollars, because were it not for her I would
    never have stumbled into this world of writing in the first place. Finally, to
    round out my acknowledgments to members of my family, thanks are due to my cousin
    and friend, Stephanie Garabrantesierra, who coached me mercilessly for my presentation
    at the LinuxWorld conference in 2004, and whose enthusiasm always serves to inspire
    and encourage me. Thanks as well to my sweet cat, Roxanne, who soothed my nerves
    at the time.


    Of course, as the folks at No Starch Press were the ones who actually published
    this book, I would like to thank all of them for what they have done thus far,
    and for what I know they will be doing once the book is released. Thank you all,
    William Pollock, Leigh Pochler, Susan Berge, Riley Hoffman, Patricia Witkin, and
    Christina Samuel. And although they are no longer with No Starch Press, I would
    like to thank Hillel Heinstein, the editor'
