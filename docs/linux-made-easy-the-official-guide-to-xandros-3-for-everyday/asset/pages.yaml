- pgno: 43
  md: '+   3. Once the floppy has been created, leave it and the Xandros Install CD
    in their respective drives, and, assuming you are ready to begin the installation
    process, press the **Restart** button in the **Autorun Wizard** in order to restart
    your machine. You will then be ready to proceed by following either the Xandros-only
    or the dual-boot installation instructions that follow. If you are not ready to
    start now, close the Autorun Wizard window and remove both disks for the time
    being. You can then insert the two disks later on (before starting up your machine)
    when you are ready to perform the installation.


    # Taking the Plunge—Installing Xandros


    Now that we’ve got all the background information down, let’s get on with it and
    install Xandros on your machine. Fortunately for you, installing Xandros is amazingly
    simple, and you would probably be able to do it all on your own without any coaching
    from me. Still, since you forked out the cash for this book, you might as well
    let me be your copilot here and guide you along so that you can feel a bit more
    confident about what you are doing. All in all, the whole process, depending on
    the speed of your hardware, should take less than 30 minutes, making it faster
    (and I think easier) than a Windows XP or Mac OS X installation. And keep in mind
    that with XP and OS X you are only installing the operating system itself and
    just a few bundled applications. In a Xandros installation, you are installing
    not only the operating system itself, but also most of the applications you will
    most likely need to use. You will thus be getting a lot done in one fell swoop.


    One more thing before we start. Some people approach installing a system with
    a great deal of trepidation. The process makes them nervous, as if the house were
    going to go up in smoke during the process. Well, the house may go up in smoke,
    but not because of the installation process. As long as you have backed up your
    data, you will be OK. If you screw up the installation the first time out, so
    what? Just start over again. No harm done, as you have nothing to harm. Just make
    sure that you give yourself more time than you need for the process. Don’t start
    installing one hour before you have to be at work, or before you have to meet
    your friend downtown. Rushing makes people do weird things. Make things easy on
    yourself by giving yourself plenty of time . . . and by backing up any data you
    would mourn the loss of.


    That said, let’s get to it!


    # Project 2B: The Installation Process


    If you are going to set up your machine so that Xandros is your only operating
    system, go directly to Step 2. If, however, you are going to set up your machine
    to run both Xandros and Windows (dual boot), start with Step 1.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '+   1. **Defragment Your Hard Disk (Dual-Boot Setups Only)** If you would like
    to create a dual-boot setup, which allows you to start up in either Windows or
    Xandros, it is best for you to first defragment your Windows hard disk before
    proceeding. This will make the installation process faster later on when Xandros
    shrinks your Windows partition so as to make space to install itself.

    +   While still running Windows, open the My Computer window, right-click the
    icon for your hard disk, and select **Properties**. You can now defragment your
    hard disk (in Windows XP) by clicking the **Tools** tab in the Properties window
    and then clicking the **Defragment Now** button at the center of the window (Figure
    2-4). In Windows NT, you can do this by going to the **Start** menu and selecting
    **Control Panel** \(\ast\) **Administrative Tools** \(\ast\) **Computer Management**
    \(\ast\) **Disk Defragmenter**, while in Windows 98 and some other versions, you
    can do the same by selecting **Programs** \(\ast\) **System Tools** \(\ast\) **Disk
    Defragmenter**.


    ![](img/3badae5570de77b990135448f8a8a1cc_44_0.png)


    +   2. **Start ''er up** Place the Xandros Install disc in your CD drive (and
    a boot floppy in your floppy drive, if your machine cannot boot from CD), and
    start or restart your machine.


    +   3. **Welcome** After your machine starts, you’ll see its usual hardware BIOS
    screens, which appear regardless of the system you are using. After that, the
    first Xandros screen, a semi-graphical and predominantly black opening screen
    will appear. This will be followed by the first screen of the Xandros Installation
    Wizard—the Welcome screen (Figure 2-5). All you need to do when it appears is
    click the **Next** button.'
  merge: -1
  img_proc: true
