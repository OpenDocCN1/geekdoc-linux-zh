- pgno: 108
  md: '# # 6


    # # PORTS OF CALL


    *Working with Floppies, CDs, DVDs, and Other Removable Media*


    ![](img/3badae5570de77b990135448f8a8a1cc_108_0.png)


    While the multi-gigabyte hard drives that almost all computers have today allow
    you to store what seems like an infinite number of files, there may be times when
    you want to back up those files or give them to others. In fact, many of the files
    you have on your hard disk are not files you yourself created on your computer,
    such as word processing files, but actually came from outside sources. After all,
    you probably have a good many digital photos you’ve received from friends or family
    as email attachments: word processing or spreadsheet documents that you unfortunately
    received from work (also most likely by email); and still other images and PDF
    files, fonts, and even applications that you’ve downloaded from the Internet.


    While most file transfers these days seem to be done via the Internet, it was
    not too long ago that the main way to transport files from computer to computer
    was by floppy disk, which was also how many average users went about backing up
    their hard disks. Needless to say, this was a much slower and more cumbersome
    way of going about things. Still, despite our newfound love of digital spontaneity,
    hard storage media types have not'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'gone the way of the dodo, great auk, and Carolina parakeet. In fact, not only
    do they continue to be used, but the range of removable storage media available
    to us has actually expanded to include Zip disks, DVDs, and, more recently, USB
    hard disks, flash drives, and memory card readers.


    Given the diverse ways in which people use their computers today, being able to
    use these various forms of hard storage media has thus become more or less essential.
    Whether it be for importing photos from your digital camera, listening to music
    and watching movies on your computer, or just backing up all the valuable items
    you have stored on your hard disk, you eventually will have to deal with at least
    some of the various forms of hard media available in the computer world today.


    Fortunately, the Xandros File Manager makes this all quite easy by acting as a
    port of sorts (hence the title of this chapter—hard stretch, I know), from which
    you can easily load and unload data to and from the various media that drop anchor
    at your machine. Whether you insert floppy disks, CDs, or DVDs into their respective
    drives or connect any other storage device to one of your USB ports, you will
    be able to access those media via the Xandros File Manager.


    # ## Floppies


    When the original Macintosh computer first came out, one of the coolest things
    about it was that it used 3.5-inch floppy disks (also known as *floppies*). At
    the time, I thought that those disks, with their hard casing and sliding metal
    doors protecting the media itself, were the incarnation of high-tech cool. Times
    change, of course, and there are fewer and fewer people using floppies these days.


    The reason for this change is simple: files have just gotten too big for floppies.
    The audio, video, and image files most people deal with these days are gigantic.
    You’d be lucky, for example, to fit more than three digital photos on one floppy
    disk. Compared to CDs, Zip disks, memory cards, and the like, floppies are also
    too slow. You could practically feed the cat, make a cup of coffee, and read the
    first three pages of the newspaper in the time it takes to write a good number
    of files to a floppy. (Well, okay, that’s an exaggeration, but floppies are slow
    when compared to the alternatives.)


    Despite being small and slow, floppies are still used by a dwindling number of
    people who have no other way of transferring files to removable media, or who
    just want to hand over one or two small word processing documents to another person
    who can read no other type of media. You may be one of these people, or you may
    have to send files to or receive them from someone in this situation.


    # ## Writing to and Copying from Disk


    Using floppies on your system is easy enough: just insert the floppy into its
    drive, open XFM, and then click the **Floppy** icon near the bottom of the file
    tree in the left pane of the window. The contents of the floppy will appear in
    the right pane. To copy, add, or remove files to or from the floppy, use the'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'various methods I described in Chapter 5, and immediately the data will be
    written to (or removed from) the disk. When you have finished, eject the floppy
    manually.


    > **NOTE**

    > *When you remove a floppy from the drive, the files displayed in the right pane
    of the XF M window will remain. This is a temporary state of affairs, however,
    so don''t worry. Just click any other folder in the file tree until the contents
    of that folder are displayed in the right pane. After that, just click the Floppy
    icon in the file tree again, and the files previously displayed there will be
    gone.*


    # Formatting Floppies


    Before you can actually write anything to a disk, that disk must be formatted.
    This is true of any kind of storage media—your hard disk, CDs, storage cards for
    your digital camera, or floppy disks—though it is sometimes done before you buy
    the media. By formatting a disk, your system (at your request) lays down a sort
    of map on the disk that specifies where data can be stored.


    > **NOTE**

    > *Because there are, and have been, many operating systems, there are many such
    formats for floppy disks. Linux can read both Linux-native ext2 formatted disks
    and Windows / DOS FAT formatted disks. It can also create either format.*


    Most floppy disks these days are sold preformatted in DOS format, so you probably
    don''t have to worry much about this; however, if you do need to format an unformatted
    floppy disk, or even an already used one from which you want to erase all the
    data, the process is simple.


    +   1. Insert the floppy into its drive, and then open the Xandros File Manager.
    Click the **Floppy** icon in the file tree of that window, and then click the
    words **Format Floppy** at the left side of the right pane of the window. A Floppy
    Disk Formatter window should appear, as shown in Figure 6-1.


    ![](img/3badae5570de77b990135448f8a8a1cc_110_0.png)


    *Figure 6-1: Formatting a floppy disk*'
  merge: -1
  img_proc: true
- pgno: 111
  md: '+   2.  In this window, you can specify the density, or capacity, of the floppy
    (1.44 MB or 720 KB), the file system type (ext2 or FAT), and the name for the
    disk. Once you have done so, begin formatting the floppy by clicking the Format
    button.

    +   3.  A small window will appear asking if you are sure you want to proceed.
    Click Continue and the formatting process will begin, with its progress indicated
    at the bottom of the Floppy Disk Formatter window.

    +   4.  When the process is complete, another window will appear telling you so.
    Just click OK on that window, and the process will be complete.


    # ## Reading Data CDs or DVDs


    To read a CD or DVD with data on it (images, files, or programs) rather than music,
    place the disc in your CD or DVD drive. A Xandros File Manager window should automatically
    open and display the contents of the disc. You can then copy the files on the
    data CD or DVD to your hard disk using the copy-and-paste or drag-and-drop methods
    described in Chapter 5.


    > NOTE  *As I mentioned in Chapter 5, any file that you copy from CD or DVD to
    your hard disk will be write-protected, so you will have to change its permissions
    if you want to alter it. To do so, right-click the file, select Properties in
    the pop-up window, and then click the Permissions tab in the Properties window
    and change the permissions.*


    When you have finished copying files from the CD or DVD, you can eject it by right-clicking
    the icon that says DVD-ROM or CD-RW and selecting Eject Disk in the pop-up menu.


    # ## Playing Music CDs


    To play a music CD, insert it into your drive; the Kscd CD player (shown in Figure
    6-2) should open automatically and begin playing it. You should also see a small
    applet in the Panel that looks like a small CD with a pair of quarter notes on
    it (also shown in Figure 6-2), which you can use to hide or show the player and
    control its basic functions. If you are connected to the Internet and playing
    a commercial audio CD, Kscd will also query an online database (freedb.org) in
    order to gather album and track titles, which it will then display in the player
    window.


    When you have finished playing your CD, you can eject it by clicking the Eject
    button in the player window or by right-clicking the Panel applet and selecting
    Eject in the pop-up menu.


    > NOTE  *Closing the Kscd player window does not close the Panel applet. To do
    so, right-click the applet, and then select Quit in the pop-up menu. Doing this
    without first closing the player window will accomplish both tasks in one step.*'
  merge: -1
  img_proc: true
- pgno: 112
  md: '![](img/3badae5570de77b990135448f8a8a1cc_112_0.png)


    Figure 6-2: The Xscd player and Panel applet


    # Playing DVD and VCD Videos


    If you have a DVD drive, Xandros can also play unencrypted DVDs via its bundled
    video playback software, Xine (Figure 6-3). Xine can also play VCDs (video compact
    discs), which are movies recorded on specially formatted CDs that can be played
    in DVD or CD drives. VCDs are inferior to DVDs in terms of image quality, but
    they are much cheaper. Because they are popular mainly in China (especially Hong
    Kong) and a few other countries, however, you might not come across many of them
    unless you happen to love more obscure Chinese movies or Canto-pop karaoke. Still,
    if you do run across any, you will be pleased to know that you can play them.


    ![](img/3badae5570de77b990135448f8a8a1cc_112_1.png)


    Figure 6-3: Viewing DVDs and VCDs with Xine'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Because Xine is covered separately in Chapter 14, I won’t mention any more
    about it here. If you just can’t wait to watch your copy of A Red Detachment of
    Women though, feel free to jump ahead; otherwise, just hang in there for now.


    # ## CD-RW Drives


    These days, it seems that almost all computers have built-in CD-RW (CD-rewritable)
    drives. CD-RW drives work just like CD-ROM drives in that they allow you to read
    data or play music from CDs. They also allow you to burn data to blank CDs. If
    you don’t have a CD-RW drive in your machine, I would strongly recommend your
    getting one. Drives for desktop machines are relatively cheap ($40 or less) and
    are easily installed.


    If your data storage needs are greater than what can be handled by a CD, consider
    installing a DVD burner, which in addition to reading and burning CDs can also
    read and burn DVDs, which have upwards of seven times the capacity of CDs.


    # ## Burning Data CDs and DVDs


    Burning data CDs and DVDs is easily handled in the Xandros File Manager’s DVD
    Writer (or CD Writer, depending on what kind of drive you have). In fact, burning
    these discs in Xandros is probably an easier, or at least more straightforward,
    process than it is in other operating systems or even many other Linux distributions.


    > > NOTE One limitation of the Xandros Open Circulation Edition (the one that
    comes with this book) is that it limits you to 2X CD burning speed and does not
    allow DVD burning. The DVD Writer icon in the file tree in the left pane of the
    XFM window will thus be captioned CD Writer even if you happen to have a DVD burner
    installed on your machine. You can have full-speed CD and DVD burning by upgrading
    to any other version of Xandros.


    # ### Setting Up the Files You Want to Burn to a CD or DVD


    Your first step is to set up the files you want to burn to disc. The files you
    gather together for this purpose are referred to as a *project*.


    To get started with your project, open XFM and click the **DVD Writer** or **CD
    Writer** (depending on the hardware you happen to have) icon in the file tree
    in the left pane of the window. The disc-burning options will appear in the right
    pane of the XFM window (Figure 6-4).


    Click **Create data disc**. The right pane of the window should look like the
    right side of Figure 6-5. Next, drag or paste the files you want to burn to that
    pane.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '![](img/3badae5570de77b990135448f8a8a1cc_114_0.png)


    Figure 6-4: CD- and DVD-burning options listed in an XFM window


    ![](img/3badae5570de77b990135448f8a8a1cc_114_1.png)


    Figure 6-5: An empty DVD Writer project window'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'As you add your files to your new project, the ruler-like gage at the bottom
    of the window (Figure 6-6) will show how much of the target disc''s capacity you
    will be using and how much remains. The maximum capacity for CDs is indicated
    by a red vertical bar for 650 MB discs and a green bar for 700 MB discs. You do
    not, of course, want to exceed the maximum capacity of the disc you are going
    to be using or it won''t burn correctly.


    ![](img/3badae5570de77b990135448f8a8a1cc_115_0.png)


    # ## Burning Your Files to Disc


    Once you have gathered all of the relevant files together in the project window,
    you can move on to actually burning files to disc. To do this, follow these steps:


    +   1.  Click the words **Write files to disc** at the left side of the right
    pane. A small window will appear telling you that Xandros recommends closing all
    other open programs before writing data to disc. (I''ve burned many a disc without
    any problems while other programs have been running, but to play it safe, go ahead
    and obey.) Click **OK** to close that small window.

    +   2.  A Create Disc window (Figure 6-7) appears, showing you the hardware device
    (your DVD or CD drive, whatever the case may be), the preferred write speed (**Maximum**
    is the default), the amount of data to be burned to disc, and the amount of time
    estimated for completion of the process. Because the default settings are probably
    fine for your purposes, go ahead and click **OK**.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '![](img/3badae5570de77b990135448f8a8a1cc_116_0.png)


    Figure 6-7: Checking your disc-burning settings


    +   3. Two windows will then appear in rapid succession. The first window is explained
    in the next step. The second window asks you to place a blank disc in your drive.
    Do what that window says, and then once the blank disc has been swallowed into
    your machine and the little LED on the drive stops flashing, click **OK**. The
    burning process will then begin.


    +   4. The remaining window (Figure 6-8) will indicate the progress of the burning
    process. The process itself consists of three steps, all of which are hands-off
    for you: preparing the track, recording the track, and fixing the disc. When complete,
    your disc will be automatically ejected from the drive, and you can click the
    **Done** button. You are now basically finished.


    ![](img/3badae5570de77b990135448f8a8a1cc_116_1.png)


    Figure 6-8: The Disc Creation Process window


    If you won’t be burning any more discs with the same exact group of files, go
    ahead and do a bit of system housecleaning. Go to the file tree in the XFM window,
    right-click the project you just burned to disc, and then select **Delete** in
    the pop-up menu.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# ## Dealing with Rewritable Discs


    CD-RW and DVD-RW (rewritable) discs are pretty much like their CD-R and DVD-R
    counterparts, except that they can be erased and then written to again. They are
    also quite a bit more expensive. Also, if you are interested in copying or creating
    a music CD, CD-RW discs cannot be played in the majority of standard audio CD
    players, such as in your home or car.


    Using rewritable discs is much like working with standard write-once CDs and DVDs.
    If the disc is blank, there is no difference in the process at all, which makes
    things quite simple. If, however, you want to reuse a rewritable disc that already
    has data on it, you must first erase, or *blank*, it.


    To blank a disc:


    +   1. Insert the disc in the drive, and when the XFM window appears, click **DVD
    Writer** or **CD Writer** (whichever is appropriate in your case) in the file
    tree in the left window pane.

    +   2. From the list of choices that then appears in the right pane, click **Blank
    disc**. A new window, *Blank Disc* (Figure 6-9), should appear.


    ![](img/3badae5570de77b990135448f8a8a1cc_117_0.png)


    *Figure 6-9: Blanking a CD-RW disc*


    +   3. To start blanking the disc, click **OK** in the Blank Disc window. Another
    window will appear indicating the progress of your blanking. When the disc has
    been blanked, it will be ejected automatically. Click **Done** in the progress
    window when the process is complete. You can then go on to use the newly blanked
    disc as if it were new.


    # ## Duplicating Audio and Data Discs


    Here’s how to duplicate audio and data CDs:


    +   1. To get started, open XFM and click the **DVD Writer** or **CD Writer**
    icon in the left pane.

    +   2. Next, click **Copy disc** in the right pane. When you see a warning window
    telling you to close all other running applications before burning data to disc,
    close them if you want to, and then click **OK**.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '+   3. A Copy Disc window should open, followed by another window telling you
    to insert the source you want to copy. That means that you should insert the disc
    that you want to copy. Go ahead and insert it. Once your drive light stops flashing,
    click OK.


    +   4. Click OK in the next window, and you''ll be asked to check the destination
    media (meaning the blank disc). I don''t do it, but click Check if you like; otherwise,
    click Skip. The copying process should begin, with the progress indicated in a
    separate window.


    +   5. When the copy phase of the process is complete, your disc should be ejected
    automatically, and a small window (bottom of Figure 6-10) will appear that asks
    you to insert a blank disc.


    > NOTE: At this point in the process, the progress bars in the Copy Disc window
    will not indicate 100 percent progress (also shown in Figure 6-10). This is because
    they indicate the total progress of both the copy and burning processes, so don''t
    worry.


    +   6. Insert the blank disc as requested, and then click OK. The burning phases
    of the process will begin. When it finishes, you disc will be ejected automatically,
    and you can then go ahead and close the Copy Disc window by clicking the Done
    button in that window.


    ![](img/3badae5570de77b990135448f8a8a1cc_118_0.png)


    Figure 6-10: DVD Writer asks you to insert a blank disc midway in the disc-copy
    process


    # # Burning ISO Images to Disc


    When you download Xandros or other Linux distributions from the Internet, you
    usually download them as one or more disc images, commonly referred to as ISOs.
    An ISO is an image of a CD, which means that it is the CD minus the media itself.
    To put it another way, if CDs had souls, the ISO would be the soul of a CD; take
    away the CD''s metal and plastic, and the remaining data would be an ISO. After
    downloading an ISO, you burn it onto a blank CD in order to give the image back
    its body, so to speak, and in the process create a working install disc.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'It''s simple to burn an ISO to disc using the Xandros File Manager.


    +   1. Double-click the ISO on your hard disk, which you will be able to recognize
    by its .iso extension. A Create Disc window (like that in Figure 6-7) will appear.
    After that, the process is exactly the same as for burning other CDs.

    +   2. Click **OK** in the Create Disc window. Two windows will now appear. Place
    a blank CD in your drive, and then, after the indicator on your drive stops flashing,
    click **OK** in the second window.


    After that, the burning process will begin, with its progress shown in the remaining
    window. Once the process is complete, your newly burned disc will be ejected from
    the drive automatically.


    # ## USB Storage Devices


    *Universal Serial Bus* (or **USB**)* devices, recognizable by their narrow rectangular
    connector plugs (Figure 6-11), can be plugged and unplugged while your computer
    is running (called* *hot* *plugging*). These devices include not only the USB
    printers, scanners, and digital cameras with which you are probably already familiar
    but also a number of USB storage devices that you can use to back up or transport
    your data.


    ![](img/3badae5570de77b990135448f8a8a1cc_119_0.png)


    *Figure 6-11: A USB connector plug and USB ports*


    These USB storage devices include external hard disks, flash memory card readers,
    and the tiny, finger-sized devices known as flash drives (Figure 6-12). These
    simple flash drives are quite popular today, and deservedly so, because they are
    quite inexpensive; extremely handy when you need to transfer fairly large, but
    not gigaantic, amounts of data from computer to computer (from work to home, for
    example); and pretty safe in terms of Linux compatibility.


    # ### Accessing Your USB Storage Devices


    To work with your USB storage device, plug it into one of the USB ports on your
    computer. The XFCE window should appear, displaying the contents of that device.
    An icon for the device,*Removable* *Disk,* will also appear in the left pane of
    the window (Figure 6-13). If you see only a single folder with a name like* *partition*
    1, or something to that effect, just double-click it to access your files.


    Once you finish with your device, unplug it by clicking the*Removable* *Disk*
    *icon in the file tree in the left pane and then the words Eject* *disc* *in the*'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'right pane. The contents of the right pane will change, and the light on your
    device will do a bit of rapid flashing. Once the flashing stops, it''s safe to
    physically unplug the device from your machine.


    ![](img/3badae5570de77b990135448f8a8a1cc_120_0.png)


    Figure 6-12: USB storage devices


    > NOTE Removing your device before the LED stops flashing can result in your losing
    data if Linux was saving information to it when you unplugged it. If your device
    doesn''t happen to have an indicator light, just wait for a few seconds (slightly
    longer if you have copied rather large files to it) before unplugging it.


    ![](img/3badae5570de77b990135448f8a8a1cc_120_1.png)


    Figure 6-13: XFem displays the contents of your USB storage device'
  merge: -1
  img_proc: true
