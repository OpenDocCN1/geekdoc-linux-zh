- pgno: 443
  md: '![](img/3badae5570de77b990135448f8a8a1cc_443_0.png)


    Figure 20-7: Creating a desktop shortcut for Briscola


    # Playing Briscola


    As I already mentioned, Briscola is about as easy a card game as there is. Briscola
    is a trick-taking game, which means that you put out a card, and then your opponent
    puts out a card, and the one who puts out the higher point-value card wins the
    hand, or *trick*, for which points are awarded on the basis of the cards involved
    in that trick. The winner of the trick then goes on to *lead* the next trick,
    meaning that the winner puts out his or her card first the next time around. When
    all the cards are played, the points for each player are then tallied, and the
    player with the most points wins. It’s all much simpler to do than it is to describe.


    # The Cards and Their Ranki ng s


    Like many other Italian and Spanish games, Briscola is played with a 40-card deck,
    consisting of the following cards: K, Q, J, 7, 6, 5, 4, 3, 2, and the Ace. Traditionally,
    it is played with either French-suited cards (hearts, diamonds, clubs, and spades)
    or Italian-suited cards (swords, coins, batons, and chalices), usually dependent
    upon the region in which it is played. In the software version you have just installed,
    you will be playing with French-suited cards but with images and patterns in the
    regional style of Tuscany.


    Unlike most card games you are probably familiar with, the ranking and point values
    of the cards in Briscola are somewhat different, as you can see in the following
    chart.'
  merge: -1
  img_proc: true
- pgno: 444
  md: '| Ranking of Cards | Point Value |

    | --- | --- |

    | Ace | 11 |

    | Three | 10 |

    | King | 4 |

    | Queen | 3 |

    | Jack | 2 |

    | 7 | 0 |

    | 4 | 0 |

    | 2 | 0 |


    While this ranking arrangement might seem odd, it is actually fairly commonly
    used in card games from the southern and Catholic regions of central Europe. With
    that bit of information in mind, it should all be pretty easy enough to fathom,
    taking a religious view, that God (Ace) and the Holy Trinity (3) rank higher than
    the divine-rights-endowed royals (K, Q, J) and their decidedly mortal subjects
    (7, 4, 2). The rankings are thus quite sensible, albeit slightly ironic.


    # Game Play in Briscola


    Once Briscola starts up, it will deal three cards to each player. It will then
    take the seventh card and place it face up under the down-facing pile of undealt
    cards, known as the *stok or talon*. That seventh card is called the *Briscola*
    (from which the game gets its name), and it determines the trump suit for that
    particular game. This means that any card of the same suit as the Briscola will
    beat any card of any other suit, even one of a higher ranking. Of course, when
    you play a trump card against another trump card, the normal rankings of the cards
    come back into play.


    It is important to note at this point that unlike many other trick-taking games,
    you are neither required to follow the suit of the card led in a trick in Briscola
    nor to beat it if you can. This means that if your opponent plays a club card,
    you can play a card of any suit you like, even if you have a card that can beat
    it, all depending on your own strategy for ultimately winning the game.


    It is a good idea to first go to the **Options** menu before getting started and
    select **Show Score**. This will allow you to know how you''re doing as you play.
    After you''ve done that, you are ready for action, and since your computer opponent
    is always kind enough as to allow you to lead, you can begin by clicking the card
    you want to put into play. The computer will then play its card (Figure 20-8).


    Once you''ve assessed the situation, click one of the blank spaces in your hand,
    and the points for that trick will be displayed in the *You box* (if you won the
    trick) or the *Me box* (if the computer won the trick). Of course, if the trick
    involved only the 7, 4 or 2 cards, no points will appear, as those cards have
    no point value.'
  merge: -1
  img_proc: true
- pgno: 445
  md: '![](img/3badae5570de77b990135448f8a8a1cc_445_0.png)


    Figure 20-8: Gameplay under way in Briscole (with the author of this book about
    to win the trick by playing a trump—the three of clubs)


    # Want to Know More?


    If you would like a more detailed set of rules on playing Briscole (and just about
    any other card game in the world), check out www.pagat.com.


    # Project 20C: Running Java Applications via the Command Line


    In addition to the numerous applications covered thus far, there are still more
    applications available to you that are written in the Java scripting language.
    Your Xandros system comes with the *Java Runtime Environment*, J2RE, installed,
    which means that you can run these so-called *Java scripts* on your system with-out
    extra effort. You will, however, usually need to resort to the command line in
    order to run the applications. Don’t worry though, because once these Java-based
    applications are up and running, it is all point and click.


    # 20C-1: Downloading a Java-Based Application—Risk


    In this project, you will be downloading and running the well-known board game
    Risk (Figure 20-9). Risk, as well as many other Java-based applications, is available
    from www.sourceforge.net, but to make things easier, just point directly to the
    Risk project home page at http://jrisk.sourceforge.net (and don’t forget to type
    the `j` at the beginning of that URL). Once there, scroll down to the *Downloads*
    section, and click the *Risk jar and source* link. You will then be taken to a
    page of download locations, so click the one closest to you, and wait for your
    download to begin.'
  merge: -1
  img_proc: true
- pgno: 446
  md: 'Risk comes as ZIP archive, so once the download is complete, you will have
    to unzip the file using the double-click-then-copy-and-paste method you learned
    in Chapter 5. Once finished, you will have a new folder, Risk, within your Home
    folder. If you take a look in that folder, you will notice the file Risk.jar.
    This is the game itself that you will be running via the command line. In the
    future, should you choose to download other Java-based applications, the file
    with the .jar extension will be the one you will be trying to run.


    # 20C-2: Running Risk


    You can now run Risk without any further work. To get going, open a new Console
    window and do the following:


    +   1. Move your Console into the Risk folder by typing cd Risk and pressing ENTER.


    +   2. Then type java -jar Risk.jar (be sure to place a space between java and
    -jar) and press ENTER. Risk will appear, and you can start playing.


    ![](img/3badae5570de77b990135448f8a8a1cc_446_0.png)


    *Figure 20-9: Risk*


    Here’s what you just did in that last line: the first part of the command string,
    *java*, calls the Java Runtime Environment into action; the *-jar* flag after
    that tells Java that you are going to be running a .jar file; and the last part
    is the actual file you are going to run, *Risk.jar*. In the future, if you choose
    to run other Java-based applications, just follow the same pattern: *java -jar
    application_name.jar*.'
  merge: -1
  img_proc: true
