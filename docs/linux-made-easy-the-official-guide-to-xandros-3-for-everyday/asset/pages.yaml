- pgno: 24
  md: '# INTRODUCTION


    # Who Is This Book For?


    If you are standing in the aisle of your local bookstore reading this right now,
    you may well be wondering who this book is for. If you also happen to see my previous
    book, Linux for Non-Geeks, on the same shelf (oh, lucky me), you might also be
    wondering what the difference between the books is. So to clear things up, I will
    try to answer both of those questions now. Linux Made Easy was written with the
    average computer user in mind, but not just any average user. The user for whom
    it was written is one who, through years of working with Windows, has become tired,
    weary, or broke. Such a person would like to try something different and doesn''t
    really even care what it is as long as it will work, and work well, on his or
    her present machine.


    In a sense, you could say that this book is for Steve, my friend since fourth
    grade back in Los Angeles. Not too long after my first book came out, he called
    me to say that he had bought a copy. Unfortunately, he said that he wasn''t really
    going to try it out because he wasn''t all that interested in getting into Linux.
    Not that he had anything against Linux, of course; it was just that the main thing
    he really cared about was getting out of Windows. He only wanted to be able to
    hook up his PDA, send email to his friends, use the Web, and whip up a few documents
    and presentations when necessary—all without having to really get all that into
    it. It didn''t matter whether it was Linux or Dogmata Fortuita Professional OS
    v5 (no, that does not exist), as long as it was cheap, easy, and able. To him,
    Linux still seemed too much trouble at the time.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Well, to my mind, and even that of my mother (for whom I had originally prepared
    that first book), Linux was already easy enough, and *Linux for Non-Geeks* was
    written to show those interested in Linux, but still afraid to try it out, that
    such was the case. Of course, such people were admittedly looking for an easy
    way in. Steve, on the other hand, was looking for an out—a no-sweat out.


    When I was later introduced to Xandros, I realized that I had found what Steve
    was looking for—a flavor of Linux so easy to use that Windows, and arguably even
    Mac OS, would seem complex in comparison. Of course, in addition to the many other
    folks like Steve out there in the world, there are still others who specifically
    want to get into Linux but have found it too cumbersome to bother with for whatever
    reason. Xandros is a great way for such people to get into the Linux world and
    really use Linux. Thus, this book was written with both of these groups of people
    in mind.


    Because such people are more interested in getting things done than in fiddling
    around with their systems, and because Xandros is so very easy to use, I''ll pay
    a good deal of attention to using software and peripheral devices such as your
    printer or USB flash drive. I''ll discuss how to run and use those applications
    and devices, and I''ll offer tips and projects to help you to get more out of
    them. You''ll get hands-on experience that will help you to develop basic skills
    that you can then build upon and apply later on. By the time you finish this book,
    you will be able to do all of the things you were able to do with Windows—and
    more.


    # ## Version Compatibility and Updates


    This book was prepared for use with Xandros Version 3 Open Circulation (which
    comes with this book), Standard, Surfside Linux, and Deluxe Editions. Although
    I do not specifically cover the more technical capabilities of the Business Edition,
    the book can also be used with that edition as well, with any relevant differences
    mentioned in the text. Some applications that I discuss, such as Thunderbird,
    Firefox, and Skype, were not originally included in the Standard, Business, or
    Deluxe Editions, but users of earlier releases of those editions can easily download
    those applications via Xandros Networkos in order to follow along.


    > **NOTE**  *The world of computers is exceedingly dynamic, and there may be changes
    in the software or the links to the files for projects in this book after the
    book is released. I''ll post any such changes at* www.edgy-penguins.org/LME.


    # ## Concept and Approach


    As a language teacher, I have always enjoyed programming books, mathematics books,
    and old-fashioned foreign-language-learning texts because of their straightforward
    skill-based orientation, in which each chapter builds upon the skills acquired
    in the previous chapter. I have tried to organize this book in that manner so
    that you will never be called upon to do something that you have not already learned.
    I also like such books because they not'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'only teach the reader how to do something, but also provide him or her with
    the chance to put those morsels of knowledge into practice in the form of exercises.
    I have therefore included several exercises, or projects, in this book where appropriate
    in order to give readers opportunities to apply their knowledge. This book will
    serve as a reference text and will also provide a dynamic learning experience,
    so that you can learn by doing, as they say.


    The projects throughout this book have a secondary purpose as well: by working
    through them, you will properly configure and round out your Xandros system so
    that it can do anything you want. By the time you finish with this book, your
    system will have all the bases covered. If that is still not enough to satisfy
    you, you will be happy to know that you will have access to even more—an unbelievably
    greater amount more—via Xandros Networks, where you will find more free applications
    than you will probably ever need . . . but more on that in Chapter 8.


    # ### How to Use This Book


    It is possible, of course, to use this book as a mere reference text that you
    only consult when you have a problem to solve, but that would negate the basic
    concept behind its design. Instead, I recommend that you first go through the
    entire book chapter by chapter, doing the projects along the way. This will give
    you a much broader understanding of how things are done (and of how you can get
    things done), and it will reduce the chance for anxiety, confusion, and, worse
    yet, mistakes.


    It is best to read this book and complete its projects when you are relaxed and
    have time to spare. Nothing makes things go wrong more than doing things in a
    rush. And keep in mind that Linux and the projects in this book are fun, not just
    work exercises. The whole point of the Linux world, in my opinion, is that it
    offers all kinds of fun. So go ahead and enjoy it.


    # ### About the Conventions Used in This Book


    There are only a few minor points worth noting about the conventions I have used
    in the book. I have put in **bold** type the words for items within your system
    that you need to click or directly manipulate in any way, such as buttons, tabs,
    menus, files, or folders, and also any text that I ask you to input. In Chapter
    20, I use *monospace font* for any text that appears in the Console window. Any
    words that I wish to call your attention to, but not actually click or directly
    select, I have set in *italics*, which I also use when first mentioning a window
    or application within the text. I have also opted to use the more graphically
    suggestive term *folder* instead of *directory*—no doubt the legacy of my many
    years as a Mac user.


    # ### About the CD in This Book


    The CD that comes with this book contains a full working copy of Xandros Open
    Circulation Edition. This is a full working Linux system that comes with most,
    if not all, of the applications that an average home user will need'
  merge: -1
  img_proc: true
- pgno: 27
  md: to function comfortably. These include the Microsoft Office-compatible OpenOffice.org
    office suite, the popular Firefox web browser and Thunderbird email client, Real
    Player, and the new and easy-to-use Internet telephony application, Skype. In
    addition to the many other applications that come on the disc, still more—an unbelievably
    great number more—can be easily downloaded free of charge via the bundled Xandros
    Networks application.
