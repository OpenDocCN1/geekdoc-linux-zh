    Scheme** button. Assuming that you don’t want to do this at the present time,
    however, just go ahead and click the **Defaults** and **Apply** buttons to get
    things back to the original less nerve-racking visual state.


    # *7D-4: Cleaning Up*


    Now that we’ve finished our haphazard customization process, you most likely want
    to get things back to normal, which we’ve already done in regard to our rather
    disatrous color scheme.


    To get the window borders back to normal, here’s what you need to do:


    +   1.  Click **Window Decorations** under the Display heading in the left pane
    of the Control Center.

    +       2.  In the right pane, select **Plastik** in the drop-down button menu.

    +       3.  Finally, click **Apply**.

    +       4.  To get the control styles back to what they used to be, simply do
    this:

    +           a.  Click **Style** in the left pane of the Control Center window.

    +           b.  Select **Plastik** in the drop-down button menu in the right pane
    of the window.

    +           c.  Click **Apply**.'
