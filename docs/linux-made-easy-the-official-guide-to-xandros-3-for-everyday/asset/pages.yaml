    stream, just use the stop button in either XMMS or RealPlayer. That’s it.


    If you come upon a stream that you really like and thus want to return to often,
    you can create a bookmark for that stream by going to the **Stream** menu and
    selecting **Add Bookmark**, and the bookmark for that stream will be added to
    the Bookmark tab.


    # Other Audio Applications


    I’ve covered most of the mainstream audio applications that come with your system
    and a couple that are available from Xandros Networks. There are, however, many
    others that you can play around with if you like. For example, *MIDI Player*,
    which you can run by going to the **Launch** menu and selecting **Applications
    ➡ Multimedia ➡ MIDI Player**, allows you to play standard MIDI or MIDI karaoke
    files, as you can see in Figure 14-31.'
