  md: '![](img/3badae5570de77b990135448f8a8a1cc_493_0.png)


    # STEAL THIS COMPUTER BOOK 3

    What They Won’t Tell You About the Internet

    by WALLACE WANG


    An offbeat, non-technical book that explores what hackers do, how they do it,
    and how readers can protect themselves. Thoroughly updated, this edition adds
    coverage of rootkits, spyware, web bugs, identity theft, hacktivism, wireless
    hacking (wardriving), biometrics, and firewalls.


    MAY 2003, 384 PP., $24.95 ($37.95 CAN)

    ISBN 1-59327-000-3


    ![](img/3badae5570de77b990135448f8a8a1cc_493_1.png)


    # STEAL THIS FILE SHARING BOOK

    What They Won’t Tell You About File Sharing

    by WALLACE WANG


    *Steal This File Sharing Book* peels back the mystery surrounding file sharing
    networks such as Kazaa, Morpheus, and Usenet, showing how they work and how to
    use them wisely, and revealing potential dangers lurking on file sharing networks,
    including viruses, spyware, and lawsuits, and how to avoid them. Includes coverage
    of the ongoing battle between software, video, and music pirates and the industries
    trying to stop them.


    NOVEMBER 2004, 296 PP., $19.95 ($27.95 CAN)

    ISBN 1-59327-050-X


    ![](img/3badae5570de77b990135448f8a8a1cc_493_2.png)


    # HOW LINUX WORKS

    What Every Superuser Should Know

    by BRIAN WARD


    Shows how the Linux system functions so that system administrators can devise
    their own solutions to problems. Readers will find coverage of devices, disks,
    filesystems, and the kernel; how Linux boots; essential system files, servers,
    and utilities; network configuration and services; shell scripts; development
    tools; compiling software from source code; maintaining the kernel; configuring
    and manipulating peripherals; printing; backups; sharing files with Samba; network
    file transfer; buying hardware for Linux; and user environments.


    MAY 2004, 368 PP., $37.95 ($55.95 CAN)

    ISBN 1-59327-035-6'
  merge: -1
  img_proc: true
- pgno: 494
  md: '# THE LINUX COOKBOOK, 2ND EDITION


    Tips and Techniques for Everyday Use


    *by MICHAEL STUTZ*


    The second edition of our acclaimed *Linux Cookbook* contains step-by-step recipes
    that show you how to do just about anything with Linux. Organized by general task
    (such as managing files and manipulating graphics), this edition includes hundreds
    of new recipes as well as new sections on package management, file conversion,
    multimedia, working with sound files (including OGG and MP3), Vi text editing,
    and advanced text manipulation. A perfect introduction to the Linux command line
    or complete desktop reference for any of the major Linux distributions.


    AUGUST 2004, 824 PP., $39.95 ($55.95 CAN)


    ISBN 1-59327-031-3


    ![](img/3badae5570de77b990135448f8a8a1cc_494_0.png)


    # JUST SAY NO TO MICROSOFT


    *by TONY BOVE*


    *Just Say No to Microsoft* begins by tracing Microsoft''s rise from tiny software
    startup to monopolistic juggernaut and explains how the company''s practices over
    the years have discouraged innovation, stunted competition, and helped foster
    an environment ripe for viruses, bugs, and hackers. Readers learn how they can
    dump Microsoft products—even the Windows operating system—and continue to be productive.
    The book also shows how to work successfully and seamlessly with computers and
    people who are still hooked on Microsoft software. Includes full explanations
    of alternate operating systems, such as Linux and Mac, and outlines various software
    applications that can replace the familiar Microsoft product.


