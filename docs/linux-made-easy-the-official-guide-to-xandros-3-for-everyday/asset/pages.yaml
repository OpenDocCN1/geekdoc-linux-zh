- pgno: 213
  md: '# 11B-4: Brightness and Contrast


    Let''s wrap up our experiment by playing around with the brightness and contrast
    settings. You surely have taken many a picture that was either over-exposed (too
    bright) or even more likely, underexposed (too dark). In the film-camera world,
    a trip to your local photo processor (with fingers crossed and a bit of luck)
    is the only way to deal with this problem after the fact. Fortunately, it is much
    easier to correct the problem with your digital images. To follow along with this
    part of the experiment, select an overexposed or an underexposed image that you''d
    like to improve. For my part, I''ll be working with the image shown in Figure
    11-18.


    ![](img/3badae5570de77b990135448f8a8a1cc_213_0.png)


    To correct the brightness of your digital image, here''s all you have to do:


    +   1. Double-click the image that you want to fix.

    +   2. Once the image opens up in its own window, go to the **Fix** menu and select
    **Color** ➔ **Brightness/Contrast/Gamma**.

    +   3. In the new window that appears, adjust the brightness and contrast of your
    picture by moving the appropriate slider (Figure 11-19).

    +   4. Once things are to your liking, click the **OK** button, and the changes
    will be visible in the original image window.

    +   5. If you are satisfied, save your changes by going to the **File** menu,
    and . . . well, you know the drill by now.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '![](img/3badae5570de77b990135448f8a8a1cc_214_0.png)


    Figure 11-19: Adjusting the brightness and contrast of your image


    # Tags


    Now that we’ve covered the basics of using Digikam with your camera and images,
    let’s wrap things up with an introduction to one more of Digikam’s interesting
    features: *tags*. In Project 11A, you set up Digikam to organize your images into
    albums, which are essentially folders in which your images are physically stored.
    Digikam, however, offers another way to further organize things, in the form of
    tags, which are essentially category indicators that allow you to view certain
    groups of pictures together without having to move them physically on your hard
    disk.


    As an example, let’s say that you have a daughter (let’s call her “Colleen”) whose
    pictures you have scattered throughout your various albums. By creating a “Colleen”
    tag and assigning that tag to each picture you have of her, you would then be
    able forever after, with just one or two clicks of the mouse, to see all of her
    pictures at the same time, though the location of those images on your hard disk
    would not have changed.


    You can also assign more than one tag to any picture, thus allowing a picture
    to appear in different category groupings. For example, you might want to include
    your pictures of Colleen with pictures of other members of the family by further
    assigning those pictures of her an additional “Family” tag.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Creating a Tag


    When you create a tag, you are actually creating a new category that you can assign
    to your photos. The default tags in Digikam are Events, People, and Places, which
    might be a bit too generic for your tastes or needs. To create your own tag, follow
    these steps:


    +   1.  From the Digikam main window, go to the Tag menu and select New Tag. A
    new window will appear (Figure 11-20).


    ![](img/3badae5570de77b990135448f8a8a1cc_215_0.png)


    +   2.  In that window, name your tag by typing the appropriate text in the Title
    box.


    +   3.  To give your tag an icon, click the blank square button next to the words
    Set icon.


    +   4.  In the icon browser window that appears, select an icon of your choice,
    and then click OK.


    +   5.  The icon you choose will now appear in the Create Tag window. Assuming
    it does, click the OK button in that window to complete the process.


    # Assigning Tags to Your Photos


    Once you''ve created a tag or two of your own, you will have to assign them to
    your photos before you can reap any results or benefits. Here''s how to do it:


    +   1.  Right-click a photo to which you want to assign a tag, and in the pop-up
    menu that appears select Assign Tag. Another submenu will then appear displaying
    the three default tags that come with Digikam and whatever tags you''ve created
    on your own, as you can see in Figure 11-21.


    +   2.  To complete the task, select the tag you want to assign to the photo,
    and you are finished. Now repeat the process for any other photos you want to
    add to the same tag group.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '![](img/3badae5570de77b990135448f8a8a1cc_216_0.png)


    Figure 11-21: Assigning a tag to your photo


    # Viewing Your Images by Tagged Groupings


    Okay, so you have finished assigning tags to your photos and want to see the results.
    To do this, go to the left pane of the main Digikam window and click on the small
    black arrow next to the word *Tags*.


    A list of all existing tags will appear. When you click any of these tags, the
    images to which that tag has been assigned will appear in the right pane of the
    window (Figure 11-22). Of course, no images will appear if you haven’t assigned
    the tag you clicked to any of your photos.


    ![](img/3badae5570de77b990135448f8a8a1cc_216_1.png)


    Figure 11-22: Viewing your images by tagged groupings'
  merge: -1
  img_proc: true
- pgno: 217
