- pgno: 337
  md: 'Now that you have finished adding your first paste-on image, go ahead and repeat
    the process for each additional image.


    # **Phase Five: Final Adjustments**


    Once you have added all four images, you should have a total of five layers listed
    in the Layers, Channels, Paths window, one for each paste-on/shadow combo and
    one for your background image, as you can see in Figure 16-29.


    ![](img/3badae5570de77b990135448f8a8a1cc_337_0.png)


    Everything is now set up, so you can go on to arrange the placement of the various
    paste-ons. If you want to move one of the paste-on images, just do the following:


    +   1.  Click the paste-on’s layer in the Layers, Channels, Paths window.

    +   2.  Click the **rectangular selection tool** in the main GIMP window.

    +   3.  Select the area surrounding the paste-on image (you don’t have to get
    it too exact, as long as the area is greater than the image and its shadow), and
    then drag the image to the location you want.

    +   4.  Once you’ve completed the move, click anywhere within the background area,
    but not within the area of the paste-on image itself. You can then move the other
    images in the same way.


    If you want to overlap your images, you may find when you move them that they
    are not overlapped in the order you would like, and remember that for maximum
    effect you want the shadowed right and bottom edges of an image to be on top of
    the next image. So how do you get things right in terms of overlap? Well, for
    example, let’s say that the image of your cat, Roxanne, appears under the image
    of your dog, Charlie, but you want it the other way around. In this case, here’s
    what you would do:


    +   a. Go to the Layers, Channels, Paths window, and click the **Roxanne** layer.

    +   b. In the same window, click the up arrow button as many times as necessary
    until the *Roxanne* layer is listed above that of the *Charlie* layer.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '+   c.  Take a look at the image itself now to make sure that things are as
    you want them to be.

    +   d.  If so, repeat the process for whatever other layers you need to reorder.


    # Phase Six: Wrapping Things Up


    Once you have everything positioned where you want it, it is time to save the
    image, and this you should do in two different formats. First, save a copy in
    the native GIMP format so that you can retain all the layers as is, thus allowing
    you to add or remove images in the future. To do this, follow these steps:


    +   1.  Go to the **File** menu and select **Save As**.

    +   2.  When the Save Image window appears, type a title for your image, and then
    add the extension _.xcf_ at the end. For example, I’ll be saving mine as WilmingtonWallpaper.xcf.

    +   3.  Once you’ve done that, click the **OK** button to complete the process.

    +   Next, you will save the image in PNG format for actual use as your desktop
    wallpaper. Before you can do this, however, you must first merge all of your layers
    together into one, because PNG cannot handle layers.

    +   4.  Go to the **Image** menu and select **Merge Visible Layers**.

    +   5.  When the Merge Layers window appears, click **OK**.

    +   6.  Now save the image as a _.png_ file by selecting **Save As** in the **File**
    menu.

    +   7.  Next change the extension at the end of the filename from _.xcf_ to _.png_
    (or giving the image yet another name with the _.png_ extension).

    +   8.  When you have finished typing in the filename, click **OK**.

    +   9.  When the Save as PNG window appears, just click the **OK** button, and
    the job will be done.


    You can then close all of your still-open GIMP windows and quit the GIMP itself.


    # Phase Seven: Unveiling Your New Creation


    Now that you’ve created your custom desktop wallpaper, it would certainly be a
    waste not to use it on your desktop. You learned how to do this in Chapter 7,
    but to refresh your memory, I’ll run through the process again here:


    +   1.  Right-click your desktop, and then select **Properties** in the pop-up
    menu that appears.

    +   2.  When the Configure window appears, click the tiny icon that looks like
    a half-opened folder at the opposite end of the word *Picture*.

    +   3.  In the Select Wallpaper window that appears, navigate to and select your
    new wallpaper (by clicking it once), and then click the **OK** button.'
  merge: -1
  img_proc: true
