- pgno: 347
  md: 'PowerPoint), meaning that you won''t be missing out on much, if anything, by
    using OpenOffice.org''s offering instead—other than that feeling of emptiness
    in your wallet, of course. Ouch!


    > **NOTE** *Xandros Business Edition comes with Sun Microsystems'' OpenOffice-related
    Star Office, which provides a few more bells and whistles and slightly greater
    MS Office compatibility than OpenOffice.org''s suite.*


    If what I''ve said so far isn''t enough to get your frugal stuffed-shirt heart
    a-pumping, there are still numerous other productivity applications that can be
    downloaded and installed via Xandros Network, including a completely different
    office suite, KOffice, so whatever it is you are looking for, you will more than
    likely be able to find it.


    # # OpenOffice.org Writer


    When it comes to office suites, the application that gets used the most by a great
    many users is the word processor.


    In Microsoft''s office suite, you are talking *Word*; however, when it comes to
    OpenOffice.org''s suite, we''re talking *Writer*, which is one of the three OpenOffice.org
    applications I will be discussing in this chapter.


    As you can see in Figure 17-1, Writer is laid out much like other word processors
    and thus pretty straightforward in terms of use. That said, I won''t be going
    into an undue amount of explanation here, since most folks know how to use a word
    processor these days. Still, there are many features in Writer that even seasoned
    users tend to overlook, and it is on those features that I will be focusing in
    this section. Again, since covering all the features in Writer would fill up an
    entire tome, I will limit my discussion to those features I have personally found
    to be of great use and those about which I am frequently asked.


    # ## Adjusting Line Spacing


    The single question I am most frequently asked is fortunately the easiest to answer:
    "How do I adjust the line spacing in my document?" All you have to do to adjust
    the line spacing in a paragraph, say from single- to double-spacing, is to right-click
    in the paragraph in question and then select **Line Spacing > Double** (or whatever
    other spacing option you prefer) in the pop-up menu that appears. If you do this
    when you first start writing your document, subsequent paragraphs will follow
    suit in terms of line spacing.


    If want to change the line spacing for an entire multiparagraph document you have
    already written, go to the **Edit** menu and choose **Select All** before doing
    your right-clicking. If you would like to change the line spacing for several
    noncontiguous paragraphs in an already written document, you can change each of
    them, one-by-one, in the way I first described or go on to the next section to
    find out how to bring about your changes most easily.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '![](img/3badae5570de77b990135448f8a8a1cc_348_0.png)


    # Multiple Selections


    A definitely often-overlooked feature of OpenOffice.org Writer is its ability
    to allow multiple selections. You no doubt already familiar with the fact that
    you can change the font, font size, or font style of an individual word, sentence,
    or paragraph by highlighting (or *selection* or *blocking*, if either of those
    terms is what you use to describe this action) that particular element within
    your document and then performing the desired change. But what if you have several
    such elements scattered throughout your document that you want to change in the
    same way? Well, this is where multiple selections can come in handy.


    Let''s say that you are writing a piece on cinema and would like to *italicize*
    all of the film titles within your document. To perform the changes in one fell
    swoop, hold down the **Ctrl** key, and then highlight each of the titles within
    your document. Your document would then look something like that in Figure 17-2.


    Once you have selected all the relevant bits of text, click the *italics* button,
    and all your highlighted titles will be *italicized*.


    This feature can prove very handy when changing the line spacing of several noncontiguous
    paragraphs in one go. After selecting the various paragraphs in question, you
    can simply right-click any one of them, select the appropriate line spacing in
    the pop-up menu, and be done.'
  merge: -1
  img_proc: true
