- pgno: 47
  md: '6.  **System Configuration**  In this screen (Figure 2-8), Xandros checks to
    see what you want to do with what is already on your disk. If you already have
    an earlier (or even the same) version of Xandros on your machine, you will be
    asked if you want to keep the data in your Home and root folders (but not global
    settings and custom installed packages, unfortunately) on your hard disk or if
    you want to replace the whole thing with a fresh install. If, however, you have
    Windows occupying your entire hard disk, as most people do, you will be asked
    if you want to keep that system by resizing its partition (and thus making room
    to install Xandros) or if you want to overwrite it with Xandros. Make the choice
    appropriate for what you want to do, and then click **Next**.


    ![](img/3badae5570de77b990135448f8a8a1cc_47_0.png)


    Figure 2-8: Deciding what to do with what''s already on your hard disk


    > **NOTE**

    > You can only resize a Windows partition if there is enough empty space within
    it. If your Windows-only hard disk is already almost filled to the max and if
    there is not enough space, the installer will not provide you with the resizing
    option; it will instead only allow you to replace Windows with Xandros. You can
    then either cancel the installation (with no harm done to your present system)
    and give up, or you can restart in Windows, trash as much unused stuff as you
    can, and then try again.


    7.  **Administration Configuration**  In this screen, as seen in Figure 2-9, you
    will input that root (also referred to as “administrator”) password that I told
    you to prepare earlier. Type it in each of the two boxes, and then if you want
    to change the default computer name, do that as well. Just be sure to use only
    letters, numbers, underscores, and dashes—and don''t make it any longer than 15
    characters. When done, click **Next**. Be sure to remember what your root password
    is, or you won''t be able to install any applications or change certain system
    settings in the future.'
  merge: -1
  img_proc: true
