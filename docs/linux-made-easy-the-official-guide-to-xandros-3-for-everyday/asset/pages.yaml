- pgno: 49
  md: '# 9. Installation Summary


    In the final installation screen (Figure 2-11), the Installation Wizard shows
    you what it is going to install, where it is going to install it, what it is going
    to do with what is already on your hard disk, and a few other details. Pay special
    attention to the top line, *Install method*, to make sure that it matches what
    you are hoping for. In the case of a Windows partition resizing, it should say:
    *Resize Windows partition*. If everything looks as it should, click the **Finish**
    button.


    ![](img/3badae5570de77b990135448f8a8a1cc_49_0.png)


    If you are creating a dual-boot setup, the Xandros installer will begin resizing
    your Windows partition and then create and format partitions in which to install
    itself. If you are creating a Xandros-only setup, the installer will skip the
    resizing process and begin to create and format partitions. In either case, when
    it is done getting your hard disk ready, the installer will begin the process
    of installing the Xandros system and its bundled applications. You can now sit
    back and rest for a spell. Rather than sitting around fretting, why not get back
    to that *Dawson’s Creek* DVD that I told you to turn off in Chapter 1, or go downstairs
    and take your dog Spotnik for a short walk—30 minutes should be more than enough
    in most cases.


    Once the installation process is complete, Xandros will tell you so in a small
    pop-up window. Click the **Exit** button in that window. Xandros will soon eject
    the install CD automatically and tell you in a full-screen message to remove the
    install CD (and floppy disk, if you needed one). After removing the disks, press
    ENTER (as also instructed to do on-screen) to restart your machine.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Project 2C: Post-installation Steps


    When your computer restarts itself, you will be greeted by the boot loader screen,
    where you will see a list of startup options. If you''ve set up a dual-boot machine,
    use your arrow keys to move down to the Windows XP (or other Windows version)
    entry in that list. Press ENTER, and Windows will start up just like it did before
    you installed Xandros. For the time being, however, and any time you want to boot
    up in Xandros, just accept the default startup option. Xandros Desktop 3.0, by
    pressing ENTER (or just wait a few seconds) and Xandros will start up automatically.
    Naturally, if you chose to set up a Xandros-only machine, the Windows option will
    not be available.


    After a short while, the login screen will appear. In that screen, make sure your
    username is the one shown in the login window next to the words User name. If
    it is not, click the arrow button at the right side of the User name box, and
    select your username. Next, type your password, and then click the Login button.
    The Xandros First-Run Wizard will then soon appear to take you through the exceedingly
    simple post-installation process. Fortunately, there is really little to do here
    other than click the Next button a few times, but I''ll walk you through things
    anyway. Oh, and if you are worried about making a mistake or missing out on something,
    don''t—you can always run the wizard again later at any time. Here are the steps
    for the wizard:


    +   1. **Welcome/Mouse Configuration** Select Right hand or Left hand, and then
    click Next (Figure 2-12).


    ![](img/3badae5570de77b990135448f8a8a1cc_50_0.png)


    Figure 2-12: The Xandros First Run Wizard''s opening screen


    +   2. **Regional Settings** Set the appropriate locale and keyboard layout, and
    then click Next (Figure 2-13).'
  merge: -1
  img_proc: true
- pgno: 51
  md: '![](img/3badae5570de77b990135448f8a8a1cc_51_0.png)


    Figure 2-13: Adjusting your locale and keyboard settings in the First Run Wizard


    +   3. Date and Time The defaults in this screen of the wizard (Figure 2-14) should
    be correct here, so, assuming they are, click **Next**. If not, you can adjust
