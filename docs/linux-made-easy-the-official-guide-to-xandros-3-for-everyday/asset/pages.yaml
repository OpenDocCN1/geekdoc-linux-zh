    # Internet Telephony with Skype


    So your significant other is living in Madrid, and there you are in Grand Rapids
    spending so much money on international phone bills that you can''t afford to
    hop on a flight and do the ol'' face-to-face, eh? Well, you might just be the
    perfect candidate for a cool new application called *Skype*, shown in Figure 13-34.


    # What Is Skype?


    Skype is an application that allows you to talk to your friends, family, and whenever
    else you want via the Internet, just as if you were using a telephone. Of course,
    in order to use Skype, the party you want to speak with must also be using Skype
    and be online, which may seem like a big drawback. However, when you give Skype
    a try and hear how good it sounds, get a feel for how well it works, and realize
    how little it costs (it costs nothing!), you won''t be worrying about such minor
    matters any longer.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'If you do want to call regular phone lines via Skype, it is also possible via
    Skype''s SkypeOut service, which, although not a free service, provides “global
    calling at local rates.” In case, you''re wondering, Skype is available not only
    for Linux but also for Windows and Mac OS X, meaning that just about anyone you
    know with a computer can use it.


    > **NOTE** *Skype was not bundled with earlier releases of Xandros Standard or
    Deluxe Editions V3. So, if you are a user of either one of those and would like
    to get down to some serious long-distance jaw wagging without paying for it all
    at the end of the month, download and install Skype now via Xandros Networks.*


    ![](img/3badae5570de77b990135448f8a8a1cc_266_0.png)


    # ## Headsets


    When using Skype, it is practically a must to use a microphone and a headphone.
    In fact, to make it all easier, it is a real plus to invest in a headset, which
    provides a combination of the two. (The Surfside Linux Edition includes a headset
    in the box!) While you might worry that this is a needlessly geeky thing to buy,
    you will appreciate it in the long run, since it makes using Skype seem all the
    more natural and thus fun. In addition, if you and the person with whom you are
    speaking do not at least use headphones, you will be driven stark raving mad because
    your voice will bounce back to you as a delayed echo through your contact''s mike
    and vice versa. Trust me, the number-one problem beginning Skype users have is
    echo, and the reason for the problem is the same: one or both of the two parties
    are not using headphones.'
  merge: -1
  img_proc: true
- pgno: 267
