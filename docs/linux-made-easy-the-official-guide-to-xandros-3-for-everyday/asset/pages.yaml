    you have open), right-click at the top of the bar itself, and then select the
    Remove ItemName in the pop-up menu (Figure 19-20). Leave only the clock and the
    Lock/Logout buttons. Yes, remove the Launch menu too.


    ![](img/3badae5570de77b990135448f8a8a1cc_424_0.png)


