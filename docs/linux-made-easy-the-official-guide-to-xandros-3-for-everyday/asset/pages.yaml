  md: '# ABOUT THE AUTHOR


    Rickford Grant, author of *Linux for Non-Geeks*, has been a computer operating
    system maniac for more than 20 years, from his early days with an Atari XL600
    to his current Linux machines. Rickford spent the past seven years as an associate
    professor at Toyama University of International Studies in Japan before returning
    to Portland, OR.'
