    # # Image Viewers


    In Chapter 4 you learned that the Xandros File Manager can act as an image viewer,
    providing you with both thumbnail and full-sized views of your various images.
    But sometimes you want just a bit more. For example, you might want to be able
    to print out your images via your image viewer, **resize** or **rotate** your
    images, or view full-screen slideshows. Well, Xandros, via Xandros Networks, has
    at least four different image viewers available that might be just what you’ve
    been looking for. These include **GQview**, **GImage View**, and my two personal
    favorites, **showimg** (Figure 16-35) and **gThumb** (Figure 16-36).


    It is hard for me to say which of these many viewers is best for you, since everyone’s
    tastes are different. If you have a broadband connection, why not download and
    install all of them, and then, once you’ve found the one that tickles your fancy,
    remove the others via Xandros Networks. If you use a dial-up connection to get
    onto the Internet, then the choice is a bit easier, as showimg will be the quickest
    download for you, while gThumb will prove to be the longest.


    ![](img/3badae5570de77b990135448f8a8a1cc_343_0.png)'
