    in the correct command.


    # Playing Njam


    Now that Njam is up and running, you will be looking at its menu screen (Figure
    18-19), from which you can select what game mode you want to play, choose what
    other options you would like (sound effects, BGM, and skins), or, if you are so
    inclined, create new levels yourself.


    ![](img/3badae5570de77b990135448f8a8a1cc_399_0.png)


    *Figure 18-19: The Njam opening menu screen*


    You won’t have any mouse control in Njam, so use your up and down cursor keys
    to navigate through the menu, and then press **ENTER** to make your selection.
    Assuming you have chosen one of the game options, you will next be presented with
    a list of course choices. Use your cursor keys to select the one you want to play,
    and press **ENTER**. Before the game starts, you will see one more screen, in
    which you must select the course you want to play. Select the course of your choice
    using your cursor keys and press **ENTER**; then you will be able to start playing
    Njam.'
  merge: -1
  img_proc: true
- pgno: 400
  md: '# Controls


    For a single-player game, the Pac-Man-esque chomper, as I call it, is controlled
    by your keyboard cursor keys. When one of your chompers dies, you can get back
    into the action by pressing the SPACEBAR. When your last chomper dies, the stats
    page will automatically appear, showing your points for the game. If you then
    press the SPACEBAR, you can type in your name to include it in the high-scores
    list (assuming your score is high enough to make it). After that, you will be
    back at the main menu screen, from which you can decide what to do next.


    While you can quit Njam by selecting Exit in the menu screen and pressing ENTER,
    you can also accomplish the same thing by pressing the ESC key as many times as
    needed, the number of presses necessary depending on the screen you are in at
    the time, until the game closes.


    # Game Modes


    As you can see in the Njam menu (Figure 18-19), there are essentially four game
    modes to choose from: single-player, two-player cooperative, two-player duel,
    and two-player network duel. While you can easily figure out what single-player
    mode is all about, you may be wondering what the difference is between a two-player
    cooperative game and a two-player duel. I will fill you in so as not to leave
    you in the dark.


    Both the cooperative games and the duels are played with two players at one keyboard
    operating two separate chompers. The first player controls his or her yellow chomper
    with the cursor keys, while the second player operates his or her green chomper
    with the R, D, F, and G keys. As long as neither player is extremely broad-shouldered,
    this arrangement should work out well enough, and the close physical proximity
    of the players could even actually work out to be quite advantageous in some select
    circumstances, if you catch my drift.


    The duels are simple enough to understand: one player tries to beat the other
    by winning more games. Winning a game is achieved by getting the most points,
    which, with two players manning the same keyboard, can be quite exciting (watch
    out for the unethical use of elbows, though). Cooperative games, on the other
    hand, are quite a different thing, though equally simple to understand. They are
    essentially the same as single-player games, albeit with two players (and two
    chompers) working together to get the same job done. Something to be learned in
    that, I suppose.


    # Skins


    A nice feature of Njam is the fact that it allows you to change the look of the
    various game elements through the use of skins, which are alternative graphic
    sets (like the themes for your web browser, Firefox) that give Njam a new appearance.


    These skins, shown in Figure 18-20, can be selected by going to the opening menu.
    In that screen, just use your cursor keys to move down to Options, and then press
    ENTER. This will bring you to the Options menu, where you should again use your
    cursor keys to move down to Skin. Press ENTER, as many'
  merge: -1
  img_proc: true
- pgno: 401
  md: 'times as you like, to browse through the skins available. Once you have found
    a skin you like, use the down cursor key to select Back, and then press ENTER.
    That''s all there is to it.


    ![](img/3badae5570de77b990135448f8a8a1cc_401_0.png)


    # Finding Out More About Njam


    If you would like to learn a bit more about Njam, check out the pretty complete
    documentation available from the Njam project page (http://njam.sourceforge.net/doc.html).
    In addition to the basic overview of the rules that I have provided, you will
    learn a bit more about the characteristics of the various elements within the
    game and how to use the level editor to create your own new playing levels.


    # Project 18B: A Final Bit of Fun with Fish Fillets—the Next Generation


    Fish Fillets—the Next Generation, or Fillets NG to keep it simple, (Figure 18-21)
    is a wonderful port of the Windows puzzle game Fillets.


    ![](img/3badae5570de77b990135448f8a8a1cc_401_1.png)


    Basically, the whole point of the game is to guide two hypersensitive, and sometimes
    witty, fish through a rather intriguing underwater labyrinth without getting the
    fish pulverized by the various obstacles that might inadvertently come crashing
    down on their sweet little heads. Fillets NG is very easy'
  merge: -1
  img_proc: true
- pgno: 402
  md: "on the eyes with its attractive graphics (boy, do those jars of marmalade look\
    \ tasty!), and with its great background music, it is equally kind on your ears.\n\
    \n# Downloading, Installing, and Running Fillets NG\n\nFish Fillets—the Next Generation\
    \ can be easily downloaded and installed via Xandros Networks. Be forewarned,\
    \ however, that it is a very hefty download (over 60 MB), so if you are using\
    \ a dialup connection to the Internet, you might want to hold off on getting it\
    \ until the middle of the night while you are asleep because the download will\
    \ take hours. To get it, run Xandros Networks, but first make sure the Debian\
    \ Unsupported Site repository is enabled. Then type fillets in the text box at\
    \ the top of the window. Click Search, and then, once the list of results appears\
    \ in the pane below, click Install next to fillets-ng.\n\nAgain, just as was the\
    \ case with Njam, you will have to run Fillets NG via the Run Command window.\
    \ To do that, go to the Launch menu and select Run Command. In the Run Command\
    \ window, type fillets and click Run.\n\n# Creating a Menu Launcher for Fillets\
    \ NG\n\nSince typing a command to run Fillets NG can get to be a bit of a nuisance\
    \ if you end up playing the game quite often, you will no doubt want to create\
    \ a menu launcher for it as you did for Njam. Fortunately, the process is essentially\
    \ identical. First, quit Fillets NG by clicking Exit in the game window, and then\
    \ follow the same procedure you did for Njam. This time, however, name the new\
    \ menu entry Fillets NG, and then type the following additional information:\n\
    \n> Comment: An underwater puzzle maze  \n> Command: fillets\n\nFor the icon,\
    \ choose bluefish (which looks something like the blue fish in Fillets), and then\
    \ go to the File menu, select Save, and then quit the Menu Editor. After that,\
    \ you can more easily run Fillets NG by going to the Launch menu and selecting\
    \ Applications · Games · Arcade · Fillets NG.\n\n# Playing Fillets\n\nThe first\
    \ thing you should see upon running Fillets NG is the menu screen, from which\
    \ you can choose from among the Credits, the (as of this writing) still-under-construction\
    \ Intro, the various game Options, and the level you want to start wandering through.\n\
    \nThe level selections are made by clicking on the shiny balls in the path at\
    \ the middle of the screen (Figure 18-22), though you will be able to select only\
    \ the first level the first time out, and after that you will be able to choose\
    \ from among only those levels you have already completed. In other words, you\
    \ cannot just bypass levels and jump ahead. To return to the menu screen, just\
    \ press the ESC key at any time."
  merge: -1
  img_proc: true
- pgno: 403
  md: '![](img/3badae5570de77b990135448f8a8a1cc_403_0.png)


    Your job when playing Fillets is to get the two fish safely through each room
    of the labyrinth in order to move on to the next room. There are more than 70
    rooms in all. The movement of the fish is handled from the keyboard via the cursor
    keys. You can switch between fish by pressing the spacebar. You can also control
    the fish using your mouse. To move a fish, click it with your left mouse button
    and drag it. To have the fish push objects, click the fish with the right mouse
    button and then drag it. You can return to the opening screen at any time by pressing
    ESC.


    Moving through the each room is not as simple a task as it might seem because
    there are a variety of impediments to make things more challenging, a number of
    which you can see in the second room shown in Figure 18-23. The most important
    of these is the fragility of the fish themselves, which die whenever anything
    drops directly on them or on anything that’s on supporting on their backs. Push
    a puny snail off a cup and onto a saucer that’s on the big fish’s back, and say
    sayonara big fish. The likelihood of such cases of pizicide is increased by the
    fact that there are a number of potentially unstable obstacles that the fish have
    to move in order to travel from place to place within a given room. In some levels,
    there might also be some other living creatures that appear, but they do not have
    anything to do with solving the puzzle and are essentially nontoxic to the fish.
    They are only there to, as the author of the game puts it, “make the game more
    lively.”


    As far as moving objects is concerned, neither fish has a problem with lifting.
    Lowering such objects is another matter entirely, as trying to do so will turn
    either fish involved with the task into pickings from an alley cat’s trash can.
    Pushing objects is less of a problem, though only the big fish can budge the heavier
    or larger items. The small fish does more of a finesse job, pushing the smaller
    objects around (cups, snails, shells, and the like) in order to clear the way
    for the bigger fish to put his or her (I’m not sure which) muscle to work. Of
    course, pushing some objects can cause others to fall, so be careful.'
  merge: -1
  img_proc: true
- pgno: 404
  md: '![](img/3badae5570de77b990135448f8a8a1cc_404_0.png)


    Figure 18-23: Even more impediments await in the second and subsequent rooms of
    Fillets NG


    It is also important to remember that the fish can push only objects that are
    supported, or will be supported, by other objects, or the other fish, upon completion
    of the push. This does not include pushing an object directly onto another fish,
    since this is not possible. It is possible, however, to push an object onto another
    object that is already supported by the other fish. Support of most objects can
    also be transferred from one fish to the other fish from beneath that object.
    Figure 18-24, taken from the Fillets help files, shows some of the various moves
    that the fish can and cannot perform.


    ![](img/3badae5570de77b990135448f8a8a1cc_404_1.png)


    Figure 18-24: Some permitted and prohibited moves in Fillets NG'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# Finding Out More About Fish Fillets— the Next Generation


    If you would like to find out more about Fillets NG and game-playing rules, go
    to the project site at http://fillets.sourceforge.net, and click the **How to
    Play** link at the left side of the page for more details. You can also access
    the same information right there on your computer by digging through the *fillets*
    folder you placed within the **doc** folder within **data**, the **html** folder
    within that, and finally **manual.html** within that, after which detailed rules
    for playing the game will appear in your web browser. You do not have to be online
    if you take this approach.


    # Even More Games In Store


    In addition to the games I have mentioned thus far in this chapter, there a still
    many more available via Xandros Networks (Debian Unsupported Site repository).
    These include clones of old arcade classics such as *Burgerspace* (run around
    making hamburgers while avoiding the roaming weenies) and *P''ngus* (Figure 18-25),
    in which you must try to save the hundreds of cute little penguins that appear
    on-screen from falling over cliffs and so on. *Blobwars* and *Tuxpuck* are other
    games that might be worth checking out if you are a classic arcade game lover.


    ![](img/3badae5570de77b990135448f8a8a1cc_405_0.png)


    If arcade games aren''t really your cup of tea, you might want to try *Flight
    Gear*, a very attractive flight simulator (*fgls* is the command you need to type
    in order to run it), *GNUChess* or *3D Chess* (run command=3Dc) if you''re a chess
    lover, or even the *Xshogi/GNUshogi* combo (yes, you need to install both of them;
    run command= **xshogi** or *Cgoban*) if you are a fan of the Japanese board games
    *shogi* and *go*. There are, of course, many, many others. Enjoy the search.'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# # 19


    # ## KIDS'' STUFF


    Applications for Children


    ![](img/3badae5570de77b990135448f8a8a1cc_406_0.png)


    Given Linux''s well-earned, though no-longer-accurate, reputation as an operating
    system for geeks, you would probably be totally surprised if you were to find
    any Linux applications out there for children. Well, start spitting out your oohs
    and wows, because Linux does indeed have offerings for the little ones. After
    all, even geeks have children.


    While there probably aren''t as many of these kids'' apps out there for Linux
    as there are for Windows or Mac OS, there are still enough to give your little
    ones just cause to demand the right to man your keyboard once in a while. Oh,
    and lest you get the wrong impression, the somewhat-limited number of these applications
    is no indicator of their quality. Some are so nicely designed and fun to play
    around with that they have become popular enough to warrant being ported over
    to the Windows and Mac OS worlds.


    Unfortunately, none of these applications comes bundled with your Xandros system,
    but don''t let that discourage you, because almost all of the ones I will be discussing
    in this chapter are available from Xandros Networks.'
  merge: -1
  img_proc: true
- pgno: 407
  md: 'And what about those that aren’t? Well, you will have to download them yourself,
    but you will still use the Xandros Networks application to install them, so, either
    way, things will be quite easy at your end.


    # ## Potato Guy


    Let’s get started with an application that is probably quite familiar to you in
    its non-digital form—*Potato Guy* (Figure 19-1).


    Yes, Potato Guy is the computer equivalent of the old Mr. Potato Head game that
    you may well have played with as a kid. In case you lived a slightly deprived
    childhood, and thus do not know Mr. Potato Head (or just don’t remember him),
    the idea is simple: take an otherwise-normal everyday tuber, albeit one with arms
    and legs; stick a hat, nose, eyes, mouth, ears, or whatever else you want on it;
    and end up with a spud you can call your bud, like that in Figure 19-1.


    ![](img/3badae5570de77b990135448f8a8a1cc_407_0.png)


    Potato Guy has a few other differences from the Mr. Potato Head you played around
    with in your day, as this digital version even talks. Stick a nose on your *tuberfriend*,
    and you will hear “nose.” Kind of cool. If potatoes aren’t your thing, or at least
    your kids’ thing, you can opt for an aquarium motif or for the Linux penguin,
    Tux, himself (Figure 19-2).


    # ### Installing and Running Potato Guy


    To download and install Potato Guy, run Xandros Networks, type **potato guy**
    in the text box at the top of the window, and click **Search**. After that, just
    click **Install** next to *Potato Guy* in the results that appear below. You can
    then run Potato Guy from the **Launch** menu by selecting *Applications* ➤ *Games*
    ➤ *For Kids* ➤ *Potato Guy*.'
  merge: -1
  img_proc: true
- pgno: 408
  md: '![](img/3badae5570de77b990135448f8a8a1cc_408_0.png)


    *Figure 19-2: Tux offers a respite from potatoes in Potato Guy*


    # ## Tux Paint


    Now let''s move on to what is perhaps the most successful and popular Linux application
    for children—*Tux Paint* (Figure 19-3).


    Tux Paint is a cute and colorful paint program that allows your children (or anyone
    else''s, for that matter) to tap into their artistic side by creating their own
    works of art, simple as they may turn out to be.


    ![](img/3badae5570de77b990135448f8a8a1cc_408_1.png)


    *Figure 19-3: Tux Paint*'
  merge: -1
  img_proc: true
- pgno: 409
  md: 'The collection of tools in Tux Paint is pretty much like that found in most
    paint programs (brush, line, shapes, eraser, text, and so on). But there are also
    special features such as the Magic button, which allows your children to alter
    whatever they''ve painted in rather sophisticated ways (blur, fade, drip, mirror),
    and the Stamp button, which functions like a rubber stamp, allowing the kids to
    plop down various images (fish, birds, planets, and even Euros, to name but a
    few) anywhere they like within their creation. There are no menus in Tux Paint,
    so all the kids have to do to select a tool is click the appropriate button with
    the mouse, making everything very easy to deal with. To make things all the more
    appealing, there are even sound effects that ring out every time the brush (or
    other tool) hits the canvas. In fact, it is all so entertaining that you might
    end up wanting to play around with Tux Paint for a while yourself.


    # Installing and Running Tux Paint


    As with all of the applications I''ll cover in this chapter, Tux Paint can be
    easily installed via Xandros Networks. Just type **tuxpaint** in the text box
    next to the Search button, and then click **Install** next to *tuxpaint* in the
    results that appear below. All three items listed in the results will be installed,
    which is what you want, believe me. After that . . . well, you know the drill
    by now. Once Tux Paint is installed, you can run it by going to the Launch menu
    and selecting Applications \> Graphics \> Tux Paint.


    # Using Tux Paint


    Using Tux Paint should be quite straightforward, since everything is controlled
    via large buttons that are easy for kids to manipulate. Just remember that when
    they click one of the tool buttons on the left side of the window, the option
    buttons on the right will change, showing the various options available for the
    tool they''ve selected.


    Your kids can also save what they have created by clicking the **Save** button,
    and their creations will be automatically saved to a special directory without
    any potentially baffling file-system navigating.


    To open one of their saved creations so that they can proudly show them off to
    you, all they need to do is click the **Open** button, and all of their saved
    files will appear as thumbnails within the Tux Paint window (Figure 19-4).


    # Letter Order Game


    *Letter Order Game* (Figure 19-5), also known as **KMessdWords**, is a simple
    and very traditional game that is essentially exactly what both of its names imply.
    Your child is presented with a group of scrambled letters from which he then tries
    to figure out the correct word.'
  merge: -1
  img_proc: true
- pgno: 410
  md: '![](img/3badae5570de77b990135448f8a8a1cc_410_0.png)


    Figure 19.4: Saved files are easily accessed from within the Tux Paint window


    ![](img/3badae5570de77b990135448f8a8a1cc_410_1.png)


    Figure 19.5: Letter Order Game


    # Installing and Running Letter Order Game


    You can get Letter Order Game via Xandros Networks by typing letter order game
    in the text box at the top of the XN window and clicking Search. Click Install
    next to Letter Order Game in the results below, and then follow the usual drill
    for installing applications via Xandros Networks that you learned in Chapter 8.
    Then you can run Letter Order Game by going to the Launch menu and selecting Applications
    » Education » Language » Letter Order Game.


    # Playing Letter Order Game


    When the Letter Order Game window appears, you can start playing by selecting
    your level (Easy is the default) and then clicking the Randomize button.'
  merge: -1
  img_proc: true
- pgno: 411
  md: 'A messed-up word will appear in the main part of the window (as shown in Figure
    19-5); then, in the *Your guess* box at the bottom of the window, you type your
    guess as to what word those letters actually represent.


    Click the **Try** button, and if you have typed in the word correctly, a window
    will pop up congratulating you on spelling the word correctly (left side of Figure
    19-6).


    ![](img/3badae5570de77b990135448f8a8a1cc_411_0.png)


    You can then click the **Play Again** button in that window to go on to the next
    word. If your guess was incorrect, you will see a different window telling you
    that you missed (right side of Figure 19-6). Click the **OK** button in that window,
    and you will get another crack at solving the puzzle. If you finally give up,
    click the **Randomize** button again, and you will get a new word to work with.


    # ## Hangman Game


    *Hangman Game*, as its name implies, is a computerized version of that most traditional
    of word games, Hangman. On the off chance that you''re not familiar with the game,
    I''ll give you a brief description. When you start a game, a series of lines representing
    the letters in a word appears at the bottom of the game window. You then try to
    guess what letters go in the blanks. If your guess is right, all the instances
    of that letter will appear in the appropriate blanks. Each time a letter you guess
    isn''t in the word, construction of the noose and the person hanging from it will
    proceed, piece-by-piece and limb-by-limb. The object is to guess the word before
    getting hung.


    Despite the essentially innocent nature of the game, as a parent you might not
    want your child playing a game that uses a gallows and noose as its motif. Well,
    let''s just say that in those cases where your child does lose a game, the hangman
    figure will not be in the noose but rather hanging onto it by its hand (Figure
    19-7).'
  merge: -1
  img_proc: true
- pgno: 412
  md: '![](img/3badae5570de77b990135448f8a8a1cc_412_0.png)


    The message that appears at that point, however, does say, “You are dead,” so
    I don’t really know what to tell you. At any rate, have a look at the results
    of a losing round in Figure 19-7 to see what you think, and then decide for yourself.


    # Installing and Running Hangman Game


    Hangman Game is available from Xandros Networks, so just type **hangman** in the
    text box, click **Search**, click **Install** next to *hangman game* in the results,
    and then follow the usual process you learned in Chapter 8. After the installation
    is complete, you can play Hangman Game by going to the **Launch** menu and selecting
    **Applications** ➢ **Education** ➢ **Language** ➢ **Hangman Game**.


    # Playing Hangman Game


    Playing Hangman Game is quite simple. Just type the letter you want to offer up
    as a guess, and then press ENTER. If the letter is a part of the word in question,
    it will appear at the bottom of the screen. If the letter is not part of the word,
    it will appear in the *Misses* list at the top-left corner of the playing area,
    and construction of the gallows will begin.'
  merge: -1
  img_proc: true
- pgno: 413
  md: '# Tux Typing


    While we''re still on the topic of word and letter games, let''s move on to *Tux
    Typing* (Figure 19-8), commonly referred to as *Tux Type*, a close relative of
    Tux Paint.


    ![](img/3badae5570de77b990135448f8a8a1cc_413_0.png)


    Figure 19-8: Tux Type


    Tux Type is a very attractive and well-featured typing-tutor application, complete
    with music and sound effects that even you can enjoy. There are two different
    typing games in Tux Type: one called *Key Cascade*, where you type out the letters
    you see plastered on the falling fish so that Tux can eat them (the fish), and
    one called *Word Cascade*, where you do the same thing to falling words. Both
    of the games in Tux Type have three levels of difficulty, so they could well be
    used by children of quite different ages—even kids in their mid-forties.


    # Installing Tux Type


    To install Tux Type, run the Xandros Networks application, type **xandros-tuxtype**
    in the text box, and click **Search**. The list of results will be empty at first,
    but you will be instructed to click **Expert** under *Search Results*, so that
    (at the bottom of the left pane), When *xandros-tuxtype* appears in the right
    pane, click **Install**, and then follow the usual drill.'
  merge: -1
  img_proc: true
- pgno: 414
  md: '# Running Tux Type


    You can run Tux Type from the **Launch** menu by selecting **Applications \ Education
    \ Tools \ Tux Typing**, but before you actually run it, be aware of the fact that
    Tux Type is set up by default to run in full-screen mode. If you would prefer
    to have the game appear in its own window, or if your computer is just hostile
    to full-screen applications, as some are, go to the **Launch** menu and select
    **Run Command**. When the Run Command window appears, type `tuxtype -w`, and press
    ENTER.


    # Creating a Menu Launcher for Using Tux Type in Window Mode


    If you would always like to use Tux Type in window mode, it would behoove you
    to create a menu launcher that will allow you to do that more easily. Just follow
    these steps:


    +   1.  Go to the **Launch** menu and select **Applications \ System \ Menu Editor**.


    +   2.  When the Menu Editor window appears, click the + symbol next to **Education**,
    and then click the + symbol next to **Tools**.


    +   3.  When the subcategories appear under **Tools**, click **Tux Typing** (it
    should be the only entry there).


    You would think at this point that the only thing you would have to do is add
    a -w flag to the command for the present Tux Type launcher. Unfortunately, given
    the parameters I have set for this book, that is not possible because the game
    was installed in root mode, as are all games installed via Xandros Networks. What
    you will have to do instead is create a totally new launcher, which, paired with
    the original launcher, will give you the freedom to play the game in whichever
    mode you please.


    +   4.  With **Tux Typing** now selected in the left pane of the Menu Editor,
    go to the **File** menu and select **New Item**.


    +   5.  When the New Item window appears, type **TuxType (Window Mode)**, and
    then click **OK**.


    +   6.  In the right pane of the Menu Editor window, type `tuxtype -w` in the
    **Command** box, and then click the icon square to the right of the **Name** and
    **Description** boxes.


    +   7.  When the Select Icon window appears, scroll down and select **tux**.


    +   8.  Once you’ve done that, click **OK** in the Select Icon window to close
    it.


    +   9.  Your Menu Editor window should now look like mine in Figure 19-9. Assuming
    it does, go to the **File** menu and select **Save**. You can then quit the Menu
    Editor.'
