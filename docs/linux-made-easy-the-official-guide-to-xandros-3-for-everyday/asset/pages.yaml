    # Project 20B: More Command Practice with Briscola


    If you would like to get a bit more practice using the commands we’ve covered,
    and to see how the command line can give you access to other programs not available
    via Xandros Networks, why not give this project a try. The program you will be
    installing in this project is a simple, yet very traditional, Italian card game
    called Briscola (see Figure 20-5).


    ![](img/3badae5570de77b990135448f8a8a1cc_439_0.png)


    *Figure 20-5: Briscola*


    # 20B-1: Getting the Briscola Files


    Okay, so now you are just about ready to begin installing Briscola, but before
    you do, you must get the files you need. First of all, you will need Briscola
    itself, which you can get from the project’s home page at www.rigacci.org/~comp/software.
    If you have trouble getting the file there, you can also get a copy from my website
    for this book: www.edgy-penguins.org/LME.'
  merge: -1
