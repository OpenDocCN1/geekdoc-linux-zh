  md: "We'll be adding the images one-by-one, so start with one of your vertical images\
    \ first by clicking its window and then copying it by going to the **Edit** menu\
    \ and selecting **Copy**. After that, follow these steps:\n\n+   1. Click the\
    \ window of the background image.\n+   \n+   2. Now go to the *Layers, Channels,\
    \ Paths* window (Figure 16-14), and make sure that the title of your background\
    \ image is listed just below the title bar. If so, click the **New Layer** button,\
