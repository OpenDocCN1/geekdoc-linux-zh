    down the page to the section that says *Briscola* and click the *briscola-4.1.tar.gz*
    link, which will get you the file by the same name.


    **NOTE** *The .tar.gz ending tells you that this is a tarball.*


    Briscola is a script written in a language called *Tk* and thus requires that
