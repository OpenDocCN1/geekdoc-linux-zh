    # Working with Frames


    You have no doubt seen magazine articles with excerpts or quotations embedded
    within the text in a much larger text size. You can do this within your Writer
    documents as well (Figure 17-13) by using Frames. If it helps you any, you can
    think of a frame as a kind of movable document within a document.


    ![](img/3badae5570de77b990135448f8a8a1cc_357_1.png)


    Figure 17-13: Adding some professional flair to your documents with Frames


    To add a frame to your document, go to the Insert menu and select Frame, after
    which a Frame window will appear (Figure 17-14). In that window, you can adjust
    the settings for the new frame in terms of size, borders, background, and so on.
    To start off with, however, just click the OK button, and the frame will appear
    within your document.'
