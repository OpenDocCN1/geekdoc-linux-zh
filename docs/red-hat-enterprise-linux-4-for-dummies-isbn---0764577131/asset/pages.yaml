    # Optimizing NFS


    There are a few tips that you can use to increase the performance of a system''s
    Network File System (NFS) server. Most of these tips apply to systems, but they
    are also relevant to client systems.


    +   Go for SCSI disks or fibre-channel arrays. Replace IDE disks with SCSI disks.
    And, if you have the budget for, replace SCSI disks with fibre channel disk arrays.
    IDE disks, use the Ultra-DMA (UDMA) variety that operate at 66 MHz, use the CPU
    for I/O transfers whereas SCSI disks do not. This prevents I/O from becoming CPU-bound
    and also takes advantage of SCSI''s generally better performance. Fibre channel,
    although markedly more expensive than SCSI, even offer better performance.


    +   Use RAID 1 or 0. If your server uses Redundant Array of Independent (or Inexpensive)
    disks (RAID), use RAID 1 0 to maximize write speed and provide redundancy in the
    event of a disk crash. RAID 5 is compelling because it ensures good read speeds,
    which is important for NFS clients; however, write performance is lackluster,
    and good write speeds are important for NFS servers. Write performance is critical
    because NFS on Linux now (since about kernel version 2.4.7) defaults to synchronous
    mode, meaning that NFS operations do not complete until the data is synced to
    disk.


    +   Spread exported files. Spread NFS exported systems across multiple disks and,
    if possible, across multiple disk controllers. The purpose of this strategy is
    to avoid hot spots, which occur when I/O operations concentrate on a single disk
    or a single area of a disk.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_332_0.png)'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# 316 Part VI: The Part of Tens


    Similarly, distribute disks using NFS file systems across multiple disk controllers.
    This measure reduces the amount of I/O traffic on any single controller, which
    improves the overall performance of the I/O subsystem.


    +   - Replacing 10Mbit Ethernet cards with 100Mbit. Consider replacing 10Mbit
    Ethernet cards with 100Mbit Ethernet cards throughout the network. Although slightly
    more expensive than their 10Mbit cousins, 100Mbit cards offer considerably more
    throughput per dollar. The faster cards result in better network performance across
    the board, not just for NFS. Of course, to reap the benefit of 100Mbit cards,
    they need to be used on both clients and servers. Also, the gateways, and switches
    must be capable of handling 100Mbit speeds.


    +   - Consider using Gigabit Ethernet. In situations in which performance or availability
    is paramount, Gigabit Ethernet (1000Mbit) is available albeit expensive. Other
    high performance network options, such as Mynet and Synchronous Optical Networking
    (SONET), exist but are typically used as interconnect connects.


    +   - Replace hubs with switches. Network hubs, although less expensive than switches,
    route all network traffic across the same data channel. During periods of heavy
    activity, this single data channel can become saturated. Switches, on the other
    hand, transmit network packets across multiple channels, thus reducing congestion
    and packet collisions and resulting in overall throughput.


    +   - Dedicate server(s). If necessary, dedicate one or more servers specifically
    to NFS. CPU or memory-intensive processes, such as Web, database, or compute servers,
    can starve an NFS server for needed CPU cycles or memory pages.


    +   - Resegment the network. In extreme cases, resegment the network might be
    the answer to NFS performance problems. The goal with this tip is to isolate NFS
    traffic on its own segment, reducing network saturation and allocating dedicated
    bandwidth to NFS.


    # Optimizing Samba


    The most important consideration for optimizing Samba performance is file transfer
    speed between the server and clients. The following options can be set in the
    /etc/samba/smb.conf to increase file transfer performance between client and server.
    You can try them to determine whether your performance increases after implementing
    them:


    +   - socket options: These are controls on the networking layer of the operating
    system that enable tuning of the connection. For a complete list of options, refer
    to the samba.conf page. A good for getting better performance from your local
    network is to use socket options = IPTOS_NODELAY TCP_NODELAY.'
