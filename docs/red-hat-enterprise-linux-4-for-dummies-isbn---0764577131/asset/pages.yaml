    The following sections briefly describe the PC hardware supported by Red Hat Enterprise
    Linux. Your hardware list should contain information about the hardware described
    before you begin to install Red Hat Enterprise Linux on your PC.


    # Processor


    The processing unit (CPU; or just the processor) is an integrated circuit chip
    that performs nearly all the control and processing functions in the PC. Red Hat
    Enterprise Linux runs on an Intel 80386 processor or newer as well as compatibles
    made by AMD or Cyrix. However, you probably won''t want to use any processor older
    than a Pentium-class processor. Red Hat Enterprise Linux also supports motherboards
    with multiple processors with symmetric multiprocessing (SMP) Linux kernel.


    # Bus type


    The bus provides the electrical connection between the processor and its peripherals.
    Several types of PC buses exist. The most recent is the Peripheral'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# Appendix A: Installing Red Hat Enterprise Linux


    Component Interconnect (PCI) bus, which is found on all current production motherboards.
    Another is the Industry Standard Architecture (ISA) bus, fornamely the AT bus
    IBM introduced it in the IBM PC-AT computer in 1984. Other buses include Extended
    Industry Standard Architecture (EISA), VESA local (VL-bus), and Micro Channel
    Architecture (MCA). Red Hat Enterprise Linux connects all these buses.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_360_0.png)


    # Memory


    If you are buying a new PC, it probably comes with 128MB or more RAM. If you can
    afford it, by as much RAM as you can the more RAM a system has, the more efficiently
    it runs multiple programs (because the programs all fit in memory). Red Hat Enterprise
    Linux can use a part of the hard disk as virtual memory. Such disk-based memory,
    called swap space, is much slower than physical memory.


    # Video card and monitor


    If you don''t plan to use the X Window System, any video card works. Red Hat Enterprise
    Linux supports all video cards in text mode. If you are planning to use the X
    Window System, be sure to find a video card that is supported by XFree86 so you
    can take full advantage of its graphical interface. You can save yourself a lot
    of aggravation if your video card is supported by XFree86.


    Your choice of monitors depends on your use of the X Window System. For text displays,
    which are typically used on servers, any monitor will do. However, if you''re
    setting up a workstation or if you''re using the X Window System on your system,
    choose a monitor that supports the display resolution that you use. Resolution
    is expressed in terms of the number of pixel elements (pixels) horizontally and
    vertically (such as 1024 x 768).


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_360_1.png)


    XFree86''s support for a video card depends on the video chipset integrated circuit
    that controls the monitor and the monitor to display output. You can find the
    name of the video chipset used in a video card from the card''s documentation.
    You can then look for the name of the video chips listed at the Red Hat site.


    Your video card''s name might not be in the list at the Red Hat site. The important
    thing to note is the name of the video chipset because many popular video cards
    made by different manufacturers use the same video chipsets. In nearly all cases,
    the Red Hat Enterprise Linux installation program automatically detects the video
    chipset as it sets up the X Window System.'
