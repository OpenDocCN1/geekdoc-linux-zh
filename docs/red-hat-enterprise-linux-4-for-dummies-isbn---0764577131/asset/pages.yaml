    # Creating an alias


    Many times you will use the same commands frequently. For example, whenever you
    want to find permission information about a file or directory, you use the ls
    -l command. With the alias command, you can create new commands that already contain
    the options you want to use, saving you time. The basic syntax for the alias command
    is


    ```

    alias command=''the command you want to run''

    ```


    For example, to create an alias for the ls -l command so I can just type ls, enter
    the command


    ```

    alias ls=''ls -l''

    ```


    Whenever you run the ls command, you receive the output from ls -1.


    If you want to know the already defined aliases, just enter the alias command
