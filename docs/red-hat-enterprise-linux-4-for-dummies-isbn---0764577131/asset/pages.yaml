  md: '# 314 Part VI: The Part of Tens


    more RAM, and more video RAM will do more than anything else to speed up XFree86.
    Of course, hardware upgrades are not always an option, but they are the best option
    that you have.


    +   - Use a lightweight window manager. The eye candy functionality provided by
    desktop environments like GNOME and KDE carry a heavy price tag in terms of overall
    system performance. If, like me, you use XFree86 mostly as a platform for running
    XTerms, a web browser, and other graphical applications, you might not even miss
    the integration between the applications and the window manager.


    +   - Consider reducing color depth at which you can run XFree86. Obviously, if
    you need millions of colors (as for heavy-duty image processing or watching videos),
    using 16-bit color results in poor quality images. However, an awful lot of computing
    takes place on a Red Enterprise Linux system is text processing, programming,
    and e-mail. 24-bit and 32-bit color is computationally intensive; 16-bit is less
    demanding.


    +   - Try to use custom backgrounds. A solid color background is much less intensive
    than a full-color wallpaper image. Transparent backgrounds in terminal emulators
    are cool but also impose overhead on the windowing system to keep the background
    properly rendered and up-to-date. Shaped windows and borders are aesthetically
    pleasing but somewhat expensive in terms of resources.


    +   - Run a local font server. Running a local font server makes the fonts you
    want available locally, so they don''t have to be sent across the network. Similarly,
    you can free memory and speed up the server''s font handling by getting rid of
    fonts (that is, not loading them in /etc/X11/Xorg.conf) that you do not use.


    +   - Try to find lightweight XFree86-based applications. I no longer use Mozilla,
    for example, I found Firefox (the browser-Mozilla) provides everything I need
    in a Web browser.


    +   - Make sure the X server is up-to-date. The XFree86 project is working to
    ensure separate drivers from the rest of the system, which enables you to download
    and install an updated driver for your video card without having to refresh the
    XFree86 installation. Drivers sometimes improve dramatically from release to release,
    so stay informed about the driver for your video card.


    +   - Unload modules that you don''t. The standard XFree86 installation, for example,
    loads the RECORD and XTR extensions. /etc/X11/Xorg.conf and comment out the lines
    that read


    ```

    Load "record"

    Load "xtrap"

    ```


    Granted, these are only two modules with negligible memory and impacts, but every
    little bit helps.'
