  md: '# 224 Part IV: Configuring Enterprise Linux Internet Services


    Listing 14-1: The /etc/vsftpd/vsftpd.conf File


    ```

    [root]# cat /etc/vsftpd/vsftpd.conf

    # Example config file /etc/vsftpd.conf

    #n# The default compiled settings are fairly paranoid. This sample file

    # loosens things a bit, to make the ftp daemon more usable.

    # Please see vsftpd.conf for all compiled in defaults.

    #

    READ THIS: This example file is NOT an exhaustive list of vsftpd options.

    # Please read the vsftpd.conf.5 manual page to get a full idea of vsftpd''s

    # capabilities.

    #

    Allow anonymous FTP? (Beware - allowed by default if you comment this out)

    anonymous_enable=YES

    #

    Comment to allow local users to log in.

    local_enable=YES

    #

    Comment to enable any form of FTP write command.

    write_enable=YES

    #

    Default mask for local users is 077. You may wish to change this to 022,

    # If your users expect that (022 is used by other ftppd''s)

    local_umask=022

    #

    Comment to allow the anonymous FTP to upload files. This only

    # has an effect if the above global write is activated. Also, you will

    # obviously need to create a directory writable by the ftp user.

    anon_upload_enable=YES

    #

    Comment if you want the anonymous FTP to be able to create

    # new directories.

    anon_mkdir_write_enable=YES

    #

    Activate directory messages - messages given to remote users when they

    # go into a certain directory.

    dirmessage_enable=YES

    #

    Activate logging of uploads/downloads.

    xferlog_enable=YES

    #

    Make sure PORT transfer connections originate from port 20 (ftp-data).

    connect_from_port_20=YES

    #

    If you want, you can arrange uploaded anonymous files to be owned by

    # a different user. Note Using "root* for uploaded files is not

    # recommended!

    own_uploads=YES

    own_username=whoever

    #

    nYou may override where the log file goes if you like. The default is

    # below.

    xferlog_file=/var/log/vsftpd.log

    ```'
