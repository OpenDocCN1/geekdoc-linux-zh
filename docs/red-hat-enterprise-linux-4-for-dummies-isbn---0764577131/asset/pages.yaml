  md: '# # Appendix B


    # # What’s on the CD-ROM?


    The CD included with this book is a rescue CD that you can use if you can''t get
    your system to boot normally. The CD was created by Kent Robotti, and I would
    like to thank him for doing such a good job putting together. Nice work, Kent!


    Using the rescue CD is really easy. Just follow these simple instructions:


    +   1. Be sure that you are able to boot from your CD drive and insert the rescue
    CD into the CD drive of your PC and boot your system.


    After a short delay, the R.I.P. menu as shown in Figure B-1. There are several
    choices on the menu, but to save time and get into your system as soon as possible,
    these steps use the quickest method. Later, when you have time, you can experiment
    with the other options on the CD to discover what they do.


    | GMU GRUB version 0.95 (638K lower / 96192K upper memory) |

    | B.I.P. |

    | Boot Linux rescue system |

    | Boot Linux rescue system (skip prompt) |

    | Boot small initrd Linux system |

    | Boot momste86v3.20 memory tester |

    | Boot momste86v3.v1a memory tester |

    | !!! For help press ''c'' then type ''help'', type !!! |

    | !!! cat /doc/grab.hint for usage examples !!! |


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_378_0.png)


    Use the ↑ and ↓ keys to select which entry is highlighted. Press enter to boot
    the selected OS, ''e'' to edit the commands before booting, or ''c'' for a command-line.


    +   2. Use your cursor keys to highlight the second choice and press Enter.

    3. When the system login prompt appears, enter root and press Enter.'
  merge: -1
  pgno: 378
- img_proc: true
  md: '# 362 Part VII: Appendixes


    4. Start logical volume management by entering the following commands:


    ```

    sh /etc/rc.d/rc.lvm2 start

    vgmknode -v

    ```


    5. Mount your volumes to access your file system.


    I can''t give you the exact command to mount your volumes because I can''t know
    how your system is set up. Be sure to enter the appropriate device and path information
    for your system. You can get volume information about your system using the vgscan
    command to scan your system for volume groups. On my system, the running vgscan
    shows that I have VolGrp00 and VolGrp01 on my system. To mount the volume at /mnt
    directory on my system, I enter the following command:


    ```

    mount /dev/VolGroup00/LogVol00 /mnt

    ```


    6. After you have mounted your file system, change into the directory you accessed
    your file system to make the changes necessary so your system will boot.


    7. When you are finished, remove the CD from the drive and enter reboot at the
    command prompt and press Enter.


    The rescue CD has been tested and found to work on the vast majority of computer
    hardware. We discovered in our testing that the CD would not boot on two Pentium
    II PCs. If you are trying to use the CD and your system will not boot from it,
    you will have to get a rescue image that will fit on a floppy disk. Go to http://www.tux.org/pub/people/kent-robotti/looplux/rip/
    and find the link labeled Floppy Version (RIP-3.1-1440.bin). Click the link to
    download the floppy rescue image. Be sure to read the README for important information
    about using the floppy rescue disk.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_379_0.png)'
  merge: -1
