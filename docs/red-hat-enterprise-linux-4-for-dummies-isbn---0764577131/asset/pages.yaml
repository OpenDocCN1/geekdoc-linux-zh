    # Putting Enterprise Linux to Work


    Whether you''re planning to use the AS or ES server versions of Enterprise Linux
    or you''ll be using the WS or Desktop versions, the choices of productivity software
    and what you can do with them are nearly infinite. You can use Enterprise Linux
    to manage all your system hardware, do system administration, create networks
    for sharing data, browse the Internet, serve web pages, and much more. Take a
    look at some of the tasks you can do with Enterprise Linux.


    # Configuring your local network


    All versions of Enterprise Linux include the X Window System (find more in this
    Chapter 5), based on Free86, which provides the foundation for a graphical user
    interface (GUI). However, you aren''t stuck with just one GUI because Enterprise
    Linux supplies two well-known GUIs: KDE and GNOME.


    +   - KDE: The Desktop Environment is an optional GUI that can be selected at
    installation time.

    - GNOME: This is the default GUI that''s installed when the operating system is
    installed.


    If you have both GUIs installed, a tool on either desktop makes switching between
    the desktops very easy.

    You don''t have to spend additional money to buy typical productivity applications
    such as word processing or spreadsheet programs. All versions of Enterprise Linux
    ship with a complete office productivity suite — OpenOffice.org as well as many
    other graphical applications that can be used for editing, building Web sites,
    and much more.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_30_0.png)


    With either desktop, you can use the included graphical-based tools to configure
    and maintain your system. You can also configure the hardware in your system and
    remove devices.


    Additionally, you can configure printers to work with your local network. Enterprise
    Linux includes support for many types of printers from different manufacturers.
    You can configure a printer directly to your system as well as many types of network-connected
    printers. (Read more about configuring printer systems in Chapter 6).


    Enterprise Linux gives you everything you need to set up a local network so that
    your systems share data with each other. For example, you can configure the AS
    and ES versions to provide local network services, such as Network File System
    (NFS), that shares files between the servers and WS and Desktop clients. (Read
    all about NFS in Chapter 8.) Or, or you can configure the'
  merge: -1
