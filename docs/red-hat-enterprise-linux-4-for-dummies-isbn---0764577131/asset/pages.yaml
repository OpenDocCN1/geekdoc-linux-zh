    services configuration using the Services Configuration tool or the chkconfig
    command from a command prompt. The fastest way to change the services configuration
    is to issue the following command:


    ```

    /sbin/chkconfig -level 345 iptables on

    ```


    # Configuring a simple firewall with the iptables command


    If you need a more complex and robust firewall than you can configure using the
    graphical Security Level Configuration tool, you can use the iptables command
    from the command line. The iptables command is more difficult to use than the
    graphical tool, but you can definitely make a much more sophisticated firewall.'
