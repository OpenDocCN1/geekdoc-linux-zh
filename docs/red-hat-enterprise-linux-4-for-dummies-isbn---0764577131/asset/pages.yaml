    # Making CD backups with the cdrecord package


    In order to make backups on CDs under Red Hat Linux, you need the cdrecord package
    installed. It contains several commands as cdrecord, devump, isodump, isoinfo,
    isovry, and Reaccd. These commands are useful utilities for creating and managing
    writable CDs.


    The cdrecord package requires that you have a SCSI CD drive. If you have an IDE
    CD drive, you must configure it to use SCSI emulation in order to use cdrecord
    package. A good source of information about writing CDs is the CD-Writing How-to


    ```

    www.tldp.org/HOWTO/CD-Writing-HOWTO.html

    ```


    The disadvantage of making backups on CDs is that you must first create a CD image
    on the file system and copy the CD image to the actual CD in one step. This process
    requires that you have empty space on a single file partition that is large enough
    to hold a CD image (up to 650MB). You create a CD image with the mkisofs command:


    ```

    mkisofs -o /tmp/cd.image /home/terry

    ```


    This command makes a CD image in the files in the /home/terry directory. The CD
    image contains all the files in the /home/terry directory. You must have enough
    space to make the image file on the partition holding the /tmp directory. You
    can determine how much space the image file is going to take by using the command
    df /home/terry. By default, mkisofs preserves the ownership and permissions from
    the file system in the CD image.


    In order to burn the image file to an actual CD, you must determine which SCSI
    device has the CD drive. If you don''t actually have any SCSI drives and are using
    SCSI emulation with an IDE drive, the drive is provably on device scsi0. You can
    see what drives are on what SCSI devices with the command:


    ```

    dmesg | grep scsi

    ```


    Next, you must determine which SCSI device ID the drive is using. You can find
    this with the following command:


    ```

    cdrecord -scanbus

    ```


    Then, determine the Logical Unit Number. If the device ID is 0 (zero), the Logical
    Unit Number should always be 0. You supply the SCSI device number, the device
    ID, and the logical unit number to the cdrecord command, in that order, as part
    of the dev option. A sample cdrecord command is as follows:


    ```

    cdrecord -v dev=0,0,0 -data /tmp/cd.image

    ```'
