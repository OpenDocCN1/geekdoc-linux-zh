  md: '# Chapter 20: Ten Tips for Optimizing Your System


    # Building a Custom Kernel


    At the core of any computer operating system is the kernel. The kernel contains
    the basic instructions for controlling the hardware and software devices on the
    computer. With many operating systems, the kernel is relatively static, and the
    user has no control over how the kernel functions. A great feature of Linux, is
    the ability to customize the kernel to match the specific devices on the computer.


    Building a kernel is not particularly difficult, but it is a rather involved process.
    I can''t go into all the details here; that could easily be a chapter all its
    own. I can give you some basic information, and point you in the direction of
    finding more information.


    The basic types of kernels in Enterprise Linux are monolithic and modular.


    +   - Monolithic kernel: All the drivers necessary for your system are built into
    the kernel.

    - Modular kernel: The device drivers are compiled as modules and are loaded into
    the kernel when they are required. The default kernel distributed with Enterprise
    Linux is a fully modular kernel.


    In many instances, you won''t need to build a custom kernel: the stock kernel
    supplied with the distribution should work well in most cases. Sometimes, you
    might need to build a custom kernel to support devices on your system.


    You can use several tools to build your custom kernel: command line tools as well
    as a graphical based tool. Here I introduce you to the graphical tool xconfig.


    +   1. Before you start to build your custom kernel, you need to be in the Linux
    directory created when you installed your system. Use the cd command to change
    to /usr/src/linux-<kernel number>.


    In this section, kernel number refers to the kernel version number. You can find
    out your kernel version by entering the following command:


    ```

    [root@main linux-2.4]# uname -r

    ```


    Here is my output:


    ```

    2.4.21-EL

    ```


    +   2. Type xconfig at a command prompt to start the graphical-based kernel configuration
    tool.


    You see a screen similar to Figure 20-1.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_338_0.png)'
  merge: -1
