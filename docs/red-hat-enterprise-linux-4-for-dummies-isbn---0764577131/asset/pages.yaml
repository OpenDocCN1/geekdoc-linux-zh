    # Optimizing Sendmail


    In this section, I give you a few tips that you can use to keep your Sendmail
    server running efficiently. All messages that Sendmail tries to send to the mail
    queue located at /var/spool/mqueue. The queued messages are sent to their destination
    if possible. Sometimes messages are undeliverable for any number of reasons. These
    undelivered messages accumulate in the mail queue, and eventually they can cause
    your system performance to suffer. Periodically check the mail queue for undeliverable
    mail and force Sendmail to clear the queue.


    To see the contents of the mail queue, you can use the mailq command as shown
    in Listing 20-1:'
