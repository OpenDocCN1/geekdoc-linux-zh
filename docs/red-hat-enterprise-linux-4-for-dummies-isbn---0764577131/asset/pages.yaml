  md: '# Chapter 10: Security Basics


    # Stopping services


    To stop a running service and prevent it from starting at boot time, do the following:


    +   1. Choose Applications::System Settings::Server Settings::Services to open
    the Services Configuration dialog box (refer to Figure 10-4). Determine which
    services you want to stop on your system.


    If you are providing Internet services such as e-mail or Web services, your choices
    will be different than if you running a personal workstation or desktop. To help
    decide which services to run or disable, click the service and read the description
    of the service. Then decide whether you need it, depending on your system.


    +   2. Click the service that you want to stop and then click Stop from the toolbar.


    +   3. Clear (remove) the check from the box.


