  md: '# Chapter 4: Exploring the File System and Command Shell


    Following the first character is a series of nine characters shown in the listing
    as rwxrwxrwx. Each group of three letters (rwx) represents the permissions granted
    to a particular user:


    +   - Read permission

    - Write permission

    - If the file is a program, having the x permission means that the user can run
    the program.

    - If the file is a directory, the x permission means that the user can open and
    read the contents of the directory.

    - Execute permission


    There are three types of users for every file or directory in the Enterprise Linux
    file system, and the permissions correspond to the position of the three groups:
    user, group members, or others.


    +   User: The leading rex shows the permissions that are granted to the owner
    of the file or directory. In this case, the owner can read, write, and execute
    the file. Because the first listing in Figure 4-5 shows a directory, the x means
    that the owner can open and view the contents of the directory.

    Group members: The middle group of rwx letters shows the read, write, and execute
    permissions of users who are members of the file''s group.

    Others: The concluding group of rwx letters shows the read, write, and execute
    permissions of other users. These other users are usually referred to as the world.
    Look at some examples of permissions. A file with permission r------ is readable
    and writable to the file''s owner and no one else. A file with permission rw-r--
    is readable and writable to the file''s owner and group members but only readable
    by the world. Hopefully, you get the idea by now.


    The column to the right of the permissions column shows the number of links to
    the file. Links in Linux are similar to shortcuts in Windows or aliases in Mac
    OS.


    The third column (to the right of the links column) shows the owner of the file.
    The column to the right of the owner column shows the group the file belongs to.'
