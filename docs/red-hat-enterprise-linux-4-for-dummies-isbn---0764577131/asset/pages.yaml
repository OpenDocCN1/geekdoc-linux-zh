    view by typing it into the location bar text field.

    - **Use the tree view.** Choose Tree from the drop-down list in the small, left
    pane of the Nautilus window and select the folder that you wish to view.

    - **Use the Search tool.** Click the Actions button and choose Search Files from
    the menu.


    To move forward and backward through your file system, you can use the Forward
