  md: '# 20 Part I: Becoming Familiar with Enterprise Linux


    The GNOME desktop has a similar appearance to other well-known desktop environments
    like MS Windows or Mac OS X. If you can use either of these desktops, you can
    easily master GNOME in a short time. Notice that the GNOME desktop has a cleaner
    look, as modern as Spartan.


    The three icons in the upper-left corner of the desktop are links to your home
    directory, the system trash that holds your deleted files until you empty the
    trash, and the Computer icon that opens the Nautilus graphical shell. The Nautilus
    File Manager allows you to access your files and directories so you can do typical
    file management tasks like copying and moving files. In addition to regular file
    management tasks, the Nautilus File Manager lets you perform desktop management
    as well. You look more closely at Nautilus in this chapter. Take a look at these
    icons.


    +   * Computer: This icon also opens a Nautilus window. The Computer window contains
    four icons that are links to


    +   * Floppy Drive: The Floppy Drive is a link to the folder that contains the
    system mount point for the floppy drive. Double-clicking this icon displays the
    contents of the floppy disk that you inserted in the floppy drive.


    +   * CD-R Drive: The CD-R Drive is a link to the folder that contains the system
    mount point for the CD-R drive. Double-clicking this icon displays the contents
    of the CD-ROM disk that you inserted in the CD-R drive.


    +   * Filesystem: This icon is a link to the file system. Double-clicking this
    icon opens a new window displaying the root directory of the file system.


    +   * Network: Clicking the Network icon gives you access to the network file
    systems. Any files or directories that are available across your network are shown.


    +   * Home directory: This icon is a link to the user''s home directory. The name
    of the user on the desktop corresponds to the user who is logged in. For example,
    Figure 2-2 shows the icon labeled *root* Home because I logged in with that user
    name. You can double-click this icon or right-click and choose Open from the contextual
    menu — to open a Nautilus window that displays the user''s home directory.


    +   * Trash: This icon is a link to the system trash. When you''re ready to empty
    the trash, drag any icon, file, or directory and drop it here. Just right-click
    and select Empty Trash from the contextual menu.


