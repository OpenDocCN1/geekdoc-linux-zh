    is sent. set to many-answers, as many records as possible are transmitted in each
    message. (default is one). | transfer-format "one-answer many"; (choose one) |

    | transfers-in | Maximum concurrent inbound zone transfers (default 10). | transfers-in
    "number"; (specify the number) |

    | transfers-out | Maximum concurrent outbound transfers. | transfers-out "number";
    (specify the number) |

    | transfers-per-ns | Limits inbound transfers from a single server (default is
    two). | transfers-per-ns "number"; (specify the number) |


    # ## Include


    The include statement lists the path and name of any files that you want to be
    included with the named.conf file. Use the same syntax as used in the options
    statement to specify the path.


    # ## Acl


    This option lets you specify a list of IP addresses in an access control list.
    Only hosts on list having access to the server.


    # ## Logging


    The logging statement is where you specify your server''s logging options. The
    logging statement contains two additional items, the channel and the category.


    The channel is where you specify the location of the logged information. Logged
    information can be written to a file, to the syslog, or through by specifying
    the appropriate command. Choosing to send the information to a file gives you
    several additional choices on how to handle the information. You can set the number
    of versions to keep, the size of the files, and whether the severity of the information
    and the time and category are included with the other information in the file.'
