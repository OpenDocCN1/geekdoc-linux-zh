    # Zones


    The remainder of the listings in /etc/named.conf shown in Listing 12-1 are zone
    statements. These zone statements refer to files that are zone files. Additional
    options for zone statements exist, of course. Each zone statement begins with
    the word followed by the domain name and data class. The four classes are in,
    hs, hesl, and chaos. If no type is specified, the default is in, for Internet.


    Next follows the type option, which specifies whether the server is a master,
    a slave/stub, or the hints file. A stub server loads only NS records, the entire
    domain. The hints file is used to initialize the root cache and contains a list
    of root servers.


    Next is the name of the zone file for the specified zone. This is a pointer to
    the file containing the data about the zone. You look at a zone file in detail
    a little later in this chapter.


    The following list shows the other options for the zone statements and explains
    their functions:


    +   - allow-query: Accepts queries only from hosts in the address list (by default,
    queries are accepted from any host).

    - allow-transfer: Transfers are accepted only by hosts in the address list (by
    default, transfers are allowed to all hosts).

    - allow-update: Hosts in the address list are allowed to update the database.

    - also-notify: Servers in the address list are sent a notify message when the
    zone is updated.

    - check-names: Host names are checked for compliance with the RFC.

    - max-transfer-time-in: Specifies the time the slave waits for a zone transfer.

    - notify: When zone files are updated, this option, when set to yes, sends DNS
    NOTIFY messages (default is yes).'
