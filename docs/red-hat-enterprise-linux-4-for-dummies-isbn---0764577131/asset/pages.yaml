  md: '# Chapter 7


    # Configuring the Network


    In This Chapter


    +   - Discovering the Enterprise Linux Network Configuration tool

    - Adding an Ethernet network interface card

    - Adding a wireless network interface card

    - Adding a modem

    - Editing your network configuration


    Probably one of the first things that you want to do with your Enterprise Linux
    system is to connect to some type of network. Who could imagine today''s world
    having a PC that was not connected to the Internet or to a local area network
    (LAN)? To be able to connect to a LAN or the Internet, every PC needs to have
    a network interface card (NIC) installed and properly configured.


    # The Enterprise Linux Network Configuration Tool


    Red Hat Enterprise Linux provides a graphical network configuration tool that
    you can use to configure network interface devices installed in your system. With
    this tool, you can configure Crypto IP Encapsulation (CIPE), Ethernet, Integrated
    Services Digital Network (ISDN), modem, token ring, wireless, and xDSL (x refers
    to different variations of DSL) devices. In this chapter, I cover the most common
    types of devices: Ethernet, modem, and wireless.


    You can access the Network Configuration tool by using the Applications menu from
    the GNOME desktop. To start the Network Configuration tool, choose Applications->System
    Settings->Network. The Network Configuration window, as shown in Figure 7-1, appears.'
  merge: -1
  pgno: 126
- img_proc: true
