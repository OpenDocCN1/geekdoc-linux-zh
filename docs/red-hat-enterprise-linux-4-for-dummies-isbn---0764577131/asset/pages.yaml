    # ## Exploring the History of Enterprise Linux


    Red Hat Enterprise Linux is one of many available distributions of Linux. Seven
    companies make their own commercial Linux distributions, but in this book, I discuss
    the Enterprise Linux distribution by Red Hat. A Linux distribution is a complete
    version of the Linux operating system that contains the Linux kernel as well as
    other applications and programs that can be used for doing some type of work.
    The Linux kernel is the core of the Linux operating system and controls how the
    operating system functions with the hardware that makes up your PC. (Linux was
    originally developed by Linux Torvalds in 1991 when he was a college student in
    Finland.)


    I don''t want to bore you with a lot of historical information about Enterprise
    Linux, but a little background information for a better understanding of the Linux
    kernel and version numbers is helpful. Exact dates aren''t important, so I''ll
    give you the quick rundown of the history of Red Hat Linux and the introduction
    of Enterprise Linux.'
  merge: -1
