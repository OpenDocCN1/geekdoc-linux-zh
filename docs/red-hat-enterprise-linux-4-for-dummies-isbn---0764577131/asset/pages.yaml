    6. Set up the quotas for your users with this command:


    ```

    edquota user name

    ```


    where name is the name of the user for whom you want to set the quota.


    Figure 17-8 shows the result of running the edquota command.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_293_0.png)


    The edquota command starts a text editor that enables you to make changes to the
    quota limits. Statistics are displayed for the user you specified when you run
    the command. In Figure 17-8, you can see user terry has 3724732 blocks, or 35638
    inodes, on file system /dev/hdb2. The number of inodes corresponds to the number
    of files used. The values for soft and hard are currently 0 (zero), indicating
    that no quotas have been set yet. (Read more about inodes in the section, “Obtaining
    disk quota statistics.")


    +   * Soft: The soft limit is the maximum amount of blocks or inodes that a user
    can use permanently.


    +   * Hard: The hard limit is the maximum amount of blocks or inodes that a user
    can use temporarily.


    The soft limit is always below the hard limit so that the user can temporarily
    go above the soft limit if necessary. The amount of time that the user can temporarily
    go over the soft limit is determined by the grace period for the system. The default
    grace period is 7 days, but it can be changed using the edquota program. (See
    how in the following steps.)'
