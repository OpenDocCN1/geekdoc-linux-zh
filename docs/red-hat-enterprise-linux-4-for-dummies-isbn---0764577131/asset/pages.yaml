  md: '# 204 Part IV: Configuring Your Enterprise Linux Internet Services


    administrator, your responsibility is to configure the following items, which
    are explained in more detail later in this chapter:


    +   - A Mail User Agent (MUA) for users to be able to read and write e-mail

    - A Mail Transfer Agent (MTA) to deliver the e-mail messages across a network

    - A Local Delivery Agent (LDA) to deliver messages to users'' mailbox files

    - The TCP/IP protocols for storing e-mail messages and transferring e- MTAs


    To see how all the various components work to accomplish their jobs, read on discover
    how to track an e-mail message through the process from sending to delivery. After
    seeing how the components work, you then configure these components to build a
    fully functioning e-mail system for your server and clients.


    # Mail User Agent (MUA)


    To be able to send mail, you (or your users) need a Mail User Agent (MUA) program.
    The MUA, also called a mail client, enables users to write and read mail messages.
    Two types of MUAs are available:


    +   - A graphical user interface (GUI): example, Evolution

    - A command line interface: example, mail


    Whether your MUA is a GUI or command line interface, after the message is composed,
    the MUA sends it to the Mail Transfer Agent (MTA). The MTA is the program that
    sends the message across the network and does its work without any intervention
    by the user. In fact, most users are unaware of the MTA: They just use their mail
    client. The next section explains how to configure to send and receive e-mail.


    # The Ximian Evolution e-mail client


    The Ximian Evolution e-mail client is a full-featured e-mail program and more.
    With Evolution, you can manage all your daily tasks with ease. Before you use
    Evolution to send and receive mail, though you must first configure it with your
    e-mail account settings.


    # Configuring the Evolution e-mail client


    Before you can send or receive e-mail, you must configure your e-mail client as
    follows:'
