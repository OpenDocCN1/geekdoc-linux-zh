  md: '# 80 Part I: Becoming Familiar with Enterprise Linux


    # Viewing and stopping processes


    Every program that runs on your system, including the shell itself and any commands
    that you have issued, creates a process. You can get a list of all running process
    on your system using the ps command. For example, entering the ps command on my
    system gives the following output:


    ```

    ps -ax

    PID TTY STAT TIME COMMAND

    1 ? S 0:04 init [5]

    2 ? SW 0:01 [keventd]

    3 ? SW 0:00 [kampd]

    4 ? SWN 0:00 [ksoftird/0]

    6 ? SW 0:00 [bdflush]

    23580 ? 1:38 /usr/lib/openoffice/program/soffice.bin process:factory/swriter

    23766 R 0:00 ps ax

    ```


    Sometimes processes don''t behave nicely and can stop or working as you expect.
    You can use the output of the ps command to find the process that is misbehaving
    and stop it. Notice in the preceding list the column labeled PID: In this column
    is the Process ID of the process. For example, take a look at the next-to-last
    PID number, 23580. If you follow the line beginning with 23580 across to the command,
    you can see that this is the process started by OpenOffice. The command always
    shows the command that started the process. If OpenOffice were not responding,
    could force it to stop running by using the kill command as follows:


    ```

    kill -9 23580

    ```


    The -9 in command is referred to as a signal. In some cases, a running program
    can catch a signal and not act on the command. By using the -9, you are forcing
    the program to end because the -9 signal cannot be caught by a running program.


    # Checking disk space


    You can use two commands to find out how much space you have used on your file
    system. First, using the df command shows how much space is used and available
    on all devices that are mounted. On my system, this command shows the following
    output. In this example, I use the -h option to force the output to display the
    space in megabytes and gigabytes rather than the standard output of 1-kilobyte
    blocks.'
