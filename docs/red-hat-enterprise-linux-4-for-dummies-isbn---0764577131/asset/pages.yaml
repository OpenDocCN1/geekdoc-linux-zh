  md: '# Part V: Maintaining Your Enterprise Linux System


    The basic options are required, and your rpm command must contain one of the basic
    options. Basic options consist of the following:


    +   - -q: Use this option to query the `rpm` database for information about the
    selected package.


    +   - -e: Use this option to remove an already installed package.


    +   - -F: Use this option to upgrade an existing package.


    +   - -I: Use this option to install a package.


    +   - -U: (note capitalization) Use this option to install a new package or upgrade
    an existing one and remove earlier versions after the upgrade.


    +   - -V: (note capitalization) Use this option to verify information about the
    package compared with the `rpm` database.


    General options can be used with any of the basic options. Some of the commonly
    used general options are


    +   - -v: This option instructs the `rpm` command to display details about the
    command.


    +   - --quiet: (note use of double hyphens) Using this option prints only error
    messages about the command.


    In addition to the basic and general options, specific options are used, depending
    on the basic option chosen — for example, install-specific options that are used
    only with the install option, erase-specific options only used with the erase
    option, and so on.


    # Finding installed package files


    By using the `rpm` command, you can find what packages you already installed on
    your system. You can either search for a specific package or get a list of all
    packages installed. To search for a specific package, enter the following command
    from a terminal prompt:


    ```

    rpm -q <name of package>

    ```


    For example, if I want to know whether the Samba package is installed, I enter


    ```

    rpm -q samba

    ```


    and receive this output indicating that the package is installed and showing the
    version number of the installed package.


    ```

    samba-3.0.7-1.3e

    ```'
