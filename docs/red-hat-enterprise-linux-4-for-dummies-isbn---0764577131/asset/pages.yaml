  md: '# Chapter 18: Installing and Upgrading Software Packages


    # Removing installed packages


    You can also use the rpm command to remove installed packages by using the -e
    option. For example, if you want to remove the Samba packages from your system,
    you can enter the following command at a terminal prompt:


    ```

    rpm -e samba-3.0.7-1.3e

    ```


    After the command executes, the package is removed from your system.


    For a complete list of all options and more details about the rpm command, see
    the man page for the command.


    # Installing Applications from Compressed Zip Files


    Although you can usually find a binary rpm file that contains the package you
    want to install, sometimes you can find the application only as a compressed zip
    file. Files of this type end with the extension .tar.gz and are commonly referred
    to as tarballs, from the tar command that is used to create the archive.


    Before you compile applications and install them on your system, make sure that
    you have the development tools installed on your system. Open the Package Manager
    and scroll the list of installed packages until you find one Development Tools.
    If it is installed, you''ll see a check mark to its name. If it''s not installed,
    follow the steps in the section, "Installing system packages."


    Files with the extension .tar.gz are files that have been placed into an archive
    with the tar command and then compressed with the gzip command. In this section,
    I show you how to extract the files from the compressed archive and then compile
    and install them on your system. Be sure that you are logged in as the root user
    before beginning the following procedure. To extract, compile, and install a compressed
    zip file, do the following:


    +   1. Change to the directory containing the file that you downloaded.


    In this example, I downloaded the file kstocks-2.02.tar.gz.


    +   2. Enter the following command at a terminal prompt:


    ```

    tar xzvf kstocks-2.02.tar.gz <name of your program>

    ```'
