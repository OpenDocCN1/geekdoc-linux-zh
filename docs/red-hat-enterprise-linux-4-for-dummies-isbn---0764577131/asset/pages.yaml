    # # Manually Configuring Your X Server from the X Configuration File


    The XFree86 configuration files are stored in the `/etc/X11/` directory. The XFree86
    version 4 server uses `/etc/X11/xorg.conf`. When Red Hat Enterprise Linux is installed,
    the configuration files for XFree86 are created by information gathered during
    the installation process.


    Although you rarely need to manually edit these files, you should know about the
    various sections and optional parameters found in them. Each section begins with
    a Section-name line and ends with an EndSection line. Within each of the sections
    are several lines containing an option name and at least one option value, occasionally
    seen in quotes. The following list explores the most useful sections of an XFree86
    version 4 file and the roles of various settings.


    # ## Device


    The Device section specifies information about the video card used by the system.
    You must have at least one Device section in your configuration file. You might
    have multiple Device sections in the case of multiple video cards or multiple
    settings that can run a single card. The following options are required or widely
    used:'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# Part II: Configuring Your Enterprise Linux Local Area Network


    +   - Bus ID: Specifies the bus location of the video card. This option is necessary
    for systems with multiple cards. However, it must be set so that the Device section
    uses the proper settings for the correct card.

    - Driver: Tells XFree86 which driver to load in order to use the video card.

    - Identifier: Provides a unique name for this video card. The name is set to the
    exact name of the video card used in the Device section.

    - Screen: An optional setting used when a video card has more than one head (or
    connector) to go out to a separate monitor. If you have multiple monitors connected
    to one video card, separate Device sections must exist for each of them with a
    different Screen value for each Device section. The value accepted by this option
    is a number starting at 0, increasing by one for each head on the video card.

    - Videogram: The amount of RAM available on the video card, kilobytes. This setting
    is not normally necessary because the XFree86 server will probe the video card
    to autodetect the amount of video RAM. However, because there are some video cards
    that XFree86 cannot correctly autodetect, this option allows you to specify the
    amount of video RAM.


    # Direct Rendering Infrastructure


    Direct Rendering Infrastructure (DRI) is an interface that primarily allows 3-D
    software applications to take advantage of the 3-D hardware acceleration capabilities
    on modern supported video hardware. In addition, DRI can improve 2-D hardware
    acceleration performance when using drivers that have been enhanced to use the
    DRI for 2-D operations. This section is ignored unless DRI is enabled in the Module
    section.


    Because different video cards use DRI in different ways, read the /usr/X11/lib/X11/doc/README_DRI
    file for specific information about your particular video card before changing
    any DRI values.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_109_0.png)


    # Files


    This section sets paths for servers vital to the XFree86 server, such as the font
    path. Common options include


    +   - Fontpath: Sets the locations where the XFree86 server can find fonts. Different
    paths to directories holding font files can be placed here, separated by commas.
    By default, Red Linux uses xfs as the font server and points FontPath to unix:/7100.
    This tells the XFree86'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# Chapter 5: Configuring and Managing the Window System


    server to obtain font information by using Unix-domain sockets for inter-process
    communication (IPC).


    +   - Modulepath: Allows to set up multiple directories for storing modules loaded
    by the XFree86 server.


    +   - RGBpath: Tells the XFree86 server where the RGB (red/green/blue) color database
    is located on the system. This database file defines all valid color names in
    XFree86 and ties them to specific RGB values.


    # InputDevice


    In this section, you can configure an input device, such as a mouse or keyboard,
    to convey information to the system using the XFree86 server. Most systems have
    at least two InputDevice sections: keyboard and mouse. Each section includes these
    two lines:


    +   - Driver: Tells XFree86 the name of the driver to load to the device.


    +   - Identifier: Sets the name of the device, usually the name of the device
    followed by a number, starting with 0 for the first device. For example, the first
    keyboard InputDevice has Identifier Keyboard0.


    Most InputDevice sections contain lines assigning specific options to the device.
    Each of these lines starts with Option and the name of the input in quotes, followed
    by the value to assign to that option. Mice usually receive options such as Protocol,
    PS/2, and Device, which designates the mouse to use for this section. The InputDevice
    section is well commented, allowing you to configure additional options for your
    particular devices by uncommenting certain lines.


    # Module


    This section tells the XFree86 server which modules from the /usr/X11R6/lib/modules/
    to load. Modules provide the XFree86 server with additional functionality.


    Be careful when editing these values. Changes to the modules can prevent your
    XServer from starting. If necessary, you can enter rescue mode to get to a shell
    where you can edit the xorg.conf file to correct the problem.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_110_0.png)


    # Monitor


    The Monitor section shows the type of monitor used by the system. Although one
    Monitor section is the minimum, there may be Monitor sections — one for each monitor
    in use by the machine.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# 94 Part II: Configuring Your Enterprise Linux Local Area Network


    > > Be careful when manually editing values in the options of the Monitor section.
    Inappropriate values in this section could damage or destroy your monitor. Consult
    the documentation that came with your monitor for the safe operating parameters
    available.


    The following options are usually configured during installation or using the
    X Configuration file:


    +   - HorizSync: Tells XFree86 the range of horizontal sync frequencies compatible
    with the monitor in kHz. These values are used as a guide by the XFree86 server
    to know whether to use a particular Modeline entry''s values with this monitor.

    - Identifier: Provides a unique name for this monitor, usually numbering starting
    at 0. The first monitor is Monitor0, and so on.

    - Modeline: This parameter is used to specify the video modes used by monitor
    resolutions, with certain horizontal sync and vertical refresh resolutions. Modeline
    entries are usually preceded by a comment that explains the mode lines. If your
    configuration file does not include comments you can scan over the values (also
    called mode descriptions) to determine what the mode line is attempting to do.
    See the xorg.conf page for detailed explanations of each mode description section
    by entering xorg.conf at a terminal prompt.

    - Name: An optional parameter that displays the name of the monitor.

    - VendorName: An optional parameter that displays the name of the vendor that
    manufactured the monitor.

    - VertRefresh: Refreshes the vertical range frequencies supported by the monitor,
    in kHz. These values are used as a guide by the XFree86 Server so that it will
    know whether to use a particular Modeline entry''s values with this monitor.


    # Screen


    The Screen section binds a particular Device and Monitor that can be used as a
    pair and contains certain settings. You must have at least one Screen section
    in your configuration file. The following options are common:


    +   - DefaultDepth: Gives the section the default color depth to try, in bits.
    The default is 8, specifying 16 provides thousands of colors, and using 32 displays
    millions of colors.

    - Device: Specifies the name of the Device section to use with this Screen section.'
  merge: -1
