  md: '# Chapter 17


    # # Administering Users and Groups


    In This Chapter


    +   - Working with users and groups

    - Restricting disk space with quotas


    One of your primary tasks as a system administrator is creating and managing user
    accounts. You should always create user accounts for anyone who will be using
    your system. Making the user log in by using a username and password is your first
    line of defense in keeping your system secure and giving you a trail to follow
    if security problems arise. You won''t have to be so worried if only to whom you
    have given permission can log in and use your system and its resources.


    # ## Working with Users and Groups


    Enterprise Linux provides you with a graphical utility, the Red Hat User Manager,
    which you can use to create and modify user and group accounts. You open the User
    Manager by choosing Applications;System Settings; Users & Groups. The Red User
    Manager dialog box, as shown in Figure 17-1, appears.


    Take a brief look at what is contained in the User Manager dialog box. At the
    top of the dialog is a menu bar containing three submenus:


    +   - **File**: The menu offers the same choices as those appearing on the toolbar
    immediately beneath the menu bar.

    - **Preferences**: Choosing Preferences offers one choice: namely, to filter users
    and groups. This choice is a toggle. The first time you run the User Manager,
    the filter is applied, and you see only those users that you created during the
    system installation. Toggle the option again, and you see a list of all system
    accounts, many of which are not actual log in accounts but are required for proper
    system and operation. The purpose of the filter is to hide the list of the system
    accounts and show you only the real log accounts. You cannot make any changes
    to the filter; you can just choose to use it or not.'
  merge: -1
  pgno: 284
- img_proc: true
