    <Output clipped>

    ```


    Another instance of shell not working is also related to the search path. Users
    who are familiar with DOS know that LOOK searches in the current directory for
    executable files as well as the search path. Linux, on the other hand, does not
    search the current directory but only the search path. Thus, an executable file
    in the same directory as the directory which the user is in will not be found.


    You need to explicitly tell the shell to look in the current directory by using
    ./(executable name).The period and forward slash tells the shell to look in the
    current directory.


