    and creating a private group. To add the user to another group, modify the user''s
    properties. (See the upcoming section, “Changing user properties.”) Click OK to
    create the user.

    5. To create more users, repeat Steps 2–4. When you have finished creating users,
    choose File -> Quit from the menu bar.'
