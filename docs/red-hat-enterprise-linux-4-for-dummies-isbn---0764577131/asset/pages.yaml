  md: '# # Chapter 5


    # # Configuring and Managing the X Window System


    In This Chapter


    +   - Introducing the X Server

    - Configuring the X Server with the X Configuration tool

    - Fine-tune your X Server with the X Server Configuration tool

    - Restarting your X Server

    - Disabling the X Server


    > the heart of Red Hat Enterprise Linux is the kernel, but for many users, the
    face of the operating system is the graphical environment provided by the X Window
    System, also called simply X. This chapter is an introduction to the behind-the-scenes
    world of XFree86, which is the open source implementation of X with Red Hat Enterprise
    Linux.


    # # Introducing the X Server


    Enterprise Linux began as a powerful, server-based operating system, excelling
    at efficiently processing complicated programs requiring high CPU utilization
    and handling requests from hundreds or thousands of clients through network connections.
    Because of its own nature and stability, Enterprise Linux has quickly developed
    into a popular GUI-based operating system for workstations, both in the home and
    in the workplace.


    In the world, of which Enterprise Linux is a part, window environments have existed
    for decades, predating many of the current mainstream operating systems. The X
    Window System is now the dominant graphical user interface (GUI) for Unix-like
    operating systems. To create this GUI for the user, X uses a client-server architecture.
    An X server process is started, and X client processes connect to it via a network
    or local loopback interface. The server process handles the communication with
    the hardware, such as'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'the video card, keyboard, and mouse. The X client exists in the X space, issuing
    requests to the X Server.


    On Hat Enterprise Linux systems, the XFree86 server fills the role of the X Server.
    As a large-scope, open source software project, with hundreds of developers around
    the world, XFree86 features rapid development, a wide degree of support for various
    hardware devices and architectures, and the ability to run on different operating
    systems and platforms.


    Most Red Linux desktop users are unaware of the XFree86 server running on them.
    They are more concerned with the particular desktop environment in which they
    spend most of their time. The Red Linux installation program performs an excellent
    job of configuring your XFree86 server during the installation process, ensuring
    that X performs optimally when started.


    The X Server performs many difficult tasks using a wide array of hardware, requiring
    detailed configuration. If some of your system changes, such as the monitor or
    video card, XFree86 needs to be reconfigured. In addition, if you are troubleshooting
    a problem with XFree86 that cannot be solved by using a configuration utility
    (such as the X Configuration tool), you might need to access its configuration
    file directly.


    # Configuring the X Server with the X Configuration Tool


    You have basically two ways to configure the X Server on your Enterprise system.
    One, you use the X Configuration tool, which is a graphical tool that gives you
    the ability to change some of the most significant settings, such as display,
    monitor, and video card settings. The X Configuration tool is a graphical front-end
    to the X configuration file, Xorg.conf, which is located in the /etc/X11 directory.
    Any changes you make using the graphical utility are written to the /etc/X11/xorg.conf
    file. Two, you can edit the X Configuration file directly by using a text editing
    application. In this section, I show you how to make X Server configuration changes
    by using the X Configuration tool beginning with the display resolution.


    # Changing the display resolution


    The X Configuration tool makes it easy for you to change your display resolution.
    To change your display resolution, do the following:


    +   1. Choose Applications: System Settings: Display to open the Display Settings
    dialog box, as shown in Figure 5-1.'
