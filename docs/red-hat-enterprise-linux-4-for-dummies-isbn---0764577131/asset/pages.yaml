  md: '# 14 Part I: Becoming Familiar with Enterprise Linux


    Network Information System (NIS) to give your users the ability to log in to the
    network and use all the network resources.


    You will also be able to share data with computers running other operating systems,
    such as MS Windows, Novell NetWare, or Mac OS X. (See Chapter 9 for more.) Enterprise
    Linux gives you all the tools that you need to configure your system to communicate
    with these other operating systems and exchange information.


    # Using Enterprise Linux to maintain your system


    Keeping your systems running properly and with the latest patches can be a daunting
    proposition. Don''t worry, because Enterprise Linux gives you all the tools that
    you need to perform these tasks. All versions of Enterprise Linux include a subscription
    to the Red Hat Network as well as the up2date application that constantly scans
    your system configuration and installed packages looking for packages that can
    be updated.


    Tools are available in all versions that you can use to create and remove system
    users and groups. You use these same tools to change properties and permissions
    for your users and groups.


    Several applications are available for creating file archives for backing your
    data. You can compress your data to maximize your storage space and speed up your
    backup and restore processes.


    Installing application software in Enterprise Linux is a relatively easy process
    because most applications are available in the Red Package Manager (RPM) format.
    You can use the graphical-based RPM tool to install your applications, or you
    can use the rpm command from a command prompt. In many instances, you can either
    choose to use the graphical tool or you can use the command line to enter your
    commands.


    Read about security basics in Chapter 10.


    # Securing your system


    Anyone who uses a computer these days is well aware of the increasing problems
    caused by unsecured systems. Enterprise Linux includes many of the tools that
    you need to secure your system from malicious attacks.


    You can configure a firewall on your system by making a few choices and answering
    few questions from the graphical-based firewall tool. If you want to go into more
    detail with your firewall configuration, you can use'
  merge: -1
