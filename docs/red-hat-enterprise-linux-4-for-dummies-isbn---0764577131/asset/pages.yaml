  md: "# Chapter 12: Configuring and Managing DNS Servers\n\n```\nzone \"tacttechnology.com\"\
    \ {\n  notify no;\n  type slave;\n  file \"tactech.com\";\n  masters ( 192.168.1.1\
    \ );\n}\n```\n\nFor the reverse lookup, you add this section:\n\n```\nzone \"\
    1.168.192.in-addr.arpa\" {\n  notify no;\n  type slave;\n  file \"tac.rev\";\n\
    \  masters ( 192.168.1.1 );\n}\n```\n\nAfter modifying the /etc/named.conf file,\
    \ configuration of the slave server is now complete, and you can move on configuring\
    \ the master server.\n\n# Configuring a Primary Master Server\n\nThe /etc/named.conf\
    \ file on the master server also needs to be modified. Assuming that you already\
    \ set this server as a caching-only server, you just need to add the following\
    \ lines to /etc/named.conf. (This example uses the names defined as described\
    \ earlier in this chapter; be sure to use your names and IP addresses.)\n\n```\n\
    zone \"tacttechnology.com\" {\n  notify no;\n  type master;\n  file \"tactech.com\"\
    ;\n}\n```\n\nFor the reverse lookup, you add this section:\n\n```\nzone \"1.168.192.in-addr.arpa\"\
    \ {\n  notify no;\n  type master;\n  file \"tac.rev\";\n}\n```\n\nNotice that\
    \ you used the same names for the files on the master server as the slave server.\
    \ This is because these files are downloaded by the slave in a zone file transfer\
    \ and stored on the slave in the files shown by the master server. You did not\
    \ create the files on the slave but created them on the master server."
