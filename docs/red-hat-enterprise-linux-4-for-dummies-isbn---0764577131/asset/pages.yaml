    # Optimizing the X Window System


    You can''t do much to optimize the X Window System because it''s already pretty
    tuned. Of course, you can take some steps to improve the performance of the XFree86
    system running on your Red Hat Linux systems.


    +   - Beef up the hardware. The biggest improvement that you can make for your
    X Window System is to beef up the hardware on which XFree86 runs. There is simply
    no way around the fact that a faster CPU, faster GPU (graphics processing unit)
    that supports hardware acceleration,'
  merge: -1
