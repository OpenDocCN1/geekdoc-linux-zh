  md: '# 136 Part II: Configuring Your Enterprise Linux Local Area Network


    The **smb.conf** file shown in the examples allow users that already have Red
    Hat Enterprise Linux system accounts to access their home directories and use
    printers. After modifying your configuration file to fit your specific needs and
    saving the /etc/samba/smb.conf file, you should check the syntax of the file.
    To do this, you can use the **testparm**, as shown here:


    ```

    [root@terry terry]# testparm

    Load smb config files from /etc/samba/smb.conf

    Processing section "printers"

    Processing section "homes"

    Loaded services OK.

    ```


    If you see the line **Loaded services OK**, your file does not contain any syntax
    errors, and the **smb.conf** file is now ready to use. If you receive any error
    messages, go back to the file and carefully check the syntax of the configuration.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_153_0.png)


    # Creating Samba Users


    Next you need to create a Samba users’ password file. You can convert all your
    systems to Samba users by running the following command:


    ```

    cat /etc/passwd | mksmbpasswd.sh > /etc/samba/smbpasswd

    ```


    This utility creates the users'' accounts — not their passwords. To create passwords
    for your users using the **smbpasswd** command and the user''s name as shown in
    the following example:


    ```

    [root@terry terry]# smbpasswd terry

    New SMB password:

    Retype new SMB password:

    Password changed for user terry.

    Password changed for user terry.

    [root@terry]#

    ```


    # Starting the Samba Server


    The next step is to start the Samba server. The command to start Samba is


    ```

    [root@terry terry]# service smb start

    ```'
