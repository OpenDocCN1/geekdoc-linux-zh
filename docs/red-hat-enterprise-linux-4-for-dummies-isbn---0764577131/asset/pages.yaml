    # Managing the mail queue


    Sometimes e-messages can''t go out immediately, and the reasons are varied. Perhaps
    your network is down. Maybe the recipient''s connection is unavailable. Whatever
    the reason, users can continue to compose mail with their MUAs. When they send
    the mail, Sendmail puts the message into the mail queue and keeps trying to send
    the message at intervals for the Sendmail daemon. You can find out what these
    intervals are by checking the initialization script that starts Sendmail.


    The following excerpt is from the file /etc/rc.d/rc2.S80sendmail. The first line
    defines the interval to retry as one hour (1h). You can specify the interval in
    h (hours), m (minutes), or s (seconds). This Red Hat version has the variable
    QUEUE and sets it to 1h. Some distributions have hard-coded the interval into
    the Sendmail command (sendmail -q1h). The last two lines of Listing 13-2 show
    the Sendmail startup command. The -qQUEUE in the last line sets the retry time
    to one hour. The -bd option in the next-to-last line of it exports Sendmail as
    a daemon.


    ```

    Listing 13-2: Excerpt from /etc/rc.d/rc2.S80sendmail


    QUEUE=1h

    fi


    # Check that networking is up.

    $ ($NETWORKING) = "no" && exit 0


    [ -f /usr/sbin/sendmail ] || exit 0


    RETVAL=0


    start() (

    ```'
