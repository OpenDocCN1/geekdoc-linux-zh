    # Backing up multiple systems using amanda


    The AMANDA (Advanced Maryland Automatic Network Archiver) package is a set of
    tools for backing multiple machines over the network. With AMANDA, you can configure
    your Het Enterprise Linux machine to be a backup server for the other machines
    in the network, including Windows systems. AMANDA is included with Red Hat Linux.
    To use AMANDA, you should install the following packages:


    +   - amanda

    - amanda-client

    - amanda-server

    - gnuplot


    You need to install the amanda-server and gnuplot packages only on the machine
    that is going to be the backup server. However, you must install amanda-client
    on any machine that you want to back up by using amanda. You must install the
    base amanda package on both the client and server machines. The amanda package
    contains several commands, shown in Table 19-6.


    | Command | amanda Commands |

    | --- | --- |

    | amdump | Normally executed periodically by a cron job, this utility is run on
    the amanda server. It requests backups from the various amanda clients.'
