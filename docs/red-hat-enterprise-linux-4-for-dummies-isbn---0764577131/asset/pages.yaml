    # Disabling standalone servers


    For a server to provide a requested service, it needs to run the appropriate program
    that listens to the proper TCP/IP port to establish a connection. Some of the
    programs start when the system starts and then run continuously, or other server
    programs are started as needed.


    Servers that run continuously are standalone services. Because these servers are
    constantly listening on many TCP/IP ports, they present an opportunity for someone
    to find a vulnerability and exploit it. By disabling the services that you don''t
    need to run, you can make your system less vulnerable to attack. In this, I look
    at standalone services. You can use a utility in Enterprise Linux to disable the
    services that you don''t need to run.


