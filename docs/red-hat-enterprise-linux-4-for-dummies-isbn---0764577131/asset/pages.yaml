    Port 21 is the port typically used by ftp.

    3. In the User field, enter the username of the user.

    4. In the Pass field, enter the appropriate password for the user.


    If you are connecting to a host that you have previously connected, you can click
    the down arrow next to the Host, User, and Pass fields and choose from the respective
    drop-down lists.


