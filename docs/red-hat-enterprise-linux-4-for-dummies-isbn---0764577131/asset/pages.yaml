  md: '# 120 Part II: Configuring Your Enterprise Linux Local Area Network


    The Nameservers section does not configure the system to be a nameserver. If the
    DNS server names are retrieved from DHCP (or retrieved from the ISP of a modem
    connection), do not add primary, secondary, or tertiary DNS servers.


    # Managing hosts


    On the Tabs of the Network Configuration tool, you can add, edit, or remove hosts
    from the `/etc/hosts` file. This file contains IP addresses and their corresponding
    hostnames. When your system tries to resolve a hostname to an IP address or determine
    the hostname for an IP address, it refers to the `/etc/hosts` file before the
    nameservers (if you are using the default Red Hat Enterprise Linux configuration).
    If the IP address is listed in the `/etc/hosts` file, the nameservers are not
    used. If your network contains computers whose IP addresses are not listed in
    DNS, it is recommended that you add them to the `/etc/hosts` file.


    +   1. Choose Applications:System Settings:Network.


    +   If you are not logged in as the root user, you will be prompted to enter the
    root password.


    +   2. Click the Hosts tab from the Network Configuration dialog box.


    +   The Hosts tab that appears shows the hostname to static IP address mappings,
    if any.


    +   3. Click New from the toolbar to add Add/Edit Hosts Entry dialog box.


    +   4. Enter the host and its IP address. If there is an alias for the host, enter
    the entry as it well.


    +   5. Click OK to add the entry to the list.


    +   6. Choose File:Save to save your changes.


    Do not remove the Localhost entry from the Hosts section, or your network will
    not work properly.


    # Working with profiles


    Multiple logical network devices can be created for each physical hardware device.
    For example, if you have one Ethernet card in your system (`eth0`), you can create
    logical network devices with different nicknames and different configuration options,
    all associated with `eth0`. These logical network devices are different from device
    aliases. Logical network devices associated with the'
