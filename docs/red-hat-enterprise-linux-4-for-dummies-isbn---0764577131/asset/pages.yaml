  md: '# 138 Part II: Configuring Your Enterprise Linux Local Area Network


    +   3. Double-click the rhl10 PC icon (or whatever you called the Samba server)
    to see the shares that you made available.


    If you double-click the directory share from the rhl10 PC, you are prompted for
    a username and password to enter the directories. That''s all there is to it.
    Now you can share files between your Linux and Windows computers.


    # Connecting to a Samba Client


    You can connect your Red Hat Enterprise Linux system to any computer that is running
    the smb protocol, whether it is a Windows PC or another Linux system running Samba.
    The connection can be made from the command line using two methods. The first
    uses a utility called smbclient, the command syntax is smbclient//name/directory,
    as shown in Listing 9-2. Be sure to replace computer name in the example with
    the name of your computer.


    # Listing 9-2: Logging into a Samba Client


    ```

    [root@terry#] smbclient //terrycollisions/c

    added interface=192.168.9.93 bcast=192.168.9.255 nmask=255.255.255.0

    Got a positive name query response from 192.168.9.102 (192.168.9.102)

    Password:

    Domain[Tardis] OS[Windows 5.0] Server[Windows 2000 LAN Manager]

    smb:\\

    ```


    Listing 9-2 shows me logging into my Windows PC from Red Hat system. I was prompted
    for a password to login and then given some information about the Windows system
    and a command. You can type help at the command to get a list of possible commands.
    The commands at the smb prompt are very similar to command line ftp commands.
    To exit the connection, type exit.


    Another way to make files on the Samba client accessible on your Red Hat Linux
    system is to mount the client file system on your file system. You can do this
    by using the smount command. The syntax for this command is


    ```

    smount //computer name/directory /system_mount_point

    ```


    An example of the command and its output follows:


    ```

    [root@terry#] smbount //terrycollisions/c /mnt/windows

    Password:

    [root@terry#] cd /mnt/windows

    ```'
