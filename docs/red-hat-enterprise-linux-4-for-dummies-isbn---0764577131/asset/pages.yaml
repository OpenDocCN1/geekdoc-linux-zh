    is the panel and is similar to the taskbar in Windows. On the far left of the
    top panel is the Applications icon, indicated by the Red Hat icon. To the right
    of Applications are icons representing programs that were installed during the
    system installation. You can start any of these programs by clicking them from
    the panel. Just move your mouse over any icon, and a contextual menu appears with
    a description of a program represented by the icon.


    To the right of the program on the panel is a square area — the Workspace Switch
    — is divided into four sections. When you first log in KDE, the leftmost section
    of Workspace Switch should be white, indicating that you are in workspace one.
    You can switch between workspaces in KDE, so you can get distinct desktops that
    you can use. You can open different programs on the different desktops and switch
    between them by clicking the Workspace Switch for the desktop you want to see.
    Open some programs on the different desktops and try clicking each of the four
    squares to see the effect of changing to a different workspace.


    On the far right of the panel is a display of the current date and time. The open
    area on the panel between the Workspace Switch and the date and time is used to
    show any programs that you''re running on your desktop. You can switch between
    programs running on a single desktop by clicking the program name from the bottom
    panel. Also shown in this area are icons that you can add to the panel as well
    as applets. Applets are applications that provide some type of useful information
    or entertainment.


    # Managing applets


    The icons on the panel are links to applications — applets. Applets placed on
    the panel make it quick and convenient to choose your application with a single
    click. If you are familiar with MS Windows, applets in KDE are like shortcuts
    in Windows. In addition to the applets that are already on the panel, you can
    add your own. You can also move applets that are already there or delete them
    to make more room.


    To add applets to the panel, do the following:


    +   1. Right-click an empty area of the panel.

    2. Choose Add to Panel from the contextual menu.

    3. Choose the application that you want to add.

    4. Click Add to add it to the panel.'
