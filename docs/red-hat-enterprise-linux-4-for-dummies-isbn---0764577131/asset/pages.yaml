  md: '# 100 Part II: Configuring Your Enterprise Linux Local Area Network


    # Configuring the print queue


    You can configure six types of print queue. A print queue is a directory that
    holds the print jobs for the type of printer that you configure to work with the
    queue. The print queue is associated with the type of printer that you want to
    configure. At the top of the Queue window (see Step 6 of the preceding list) is
    a drop-down list containing the six types of print queues that you can configure.
    The Queue type is set to Locally-Connected by default. If the printer is connected
    locally — that is, either the printer or the USB port on the PC, and is also recognized
    — it is shown in the list.


    The following list shows the six types of queue that you can install; to choose
    one, select the type that you desire from the drop-down list.


    +   **Locally-Connected**: A printer attached to your computer through a parallel
    or USB port. If your printer is not listed, click the Custom Device button, type
    the name of your printer, and then click OK to add it to the printer list. A printer
    attached to the parallel port is usually referred to as `/dev/lp0`. A printer
    attached to the USB port is usually referred to as `/dev/usb10`p.


    +   **Network CUPS (IPP)**: A printer that can be accessed over a TCP/IP network.
    CUPS, the Unix Printing System, is based on the Internet Printing Protocol (IPP),
    which was created in an attempt to set some standards for printing over the Internet.
    If you choose this type of queue, you need to enter the server name and path to
    the server. Figure 6-5 shows the Network CUPS dialog box.


    +   **Network UNIX (LPD)**: A printer attached to a different Unix system that
    can be accessed over a TCP/IP network (for example, a printer attached to another
    Red Hat Linux system on your network). If you choose this type of queue, you need
    to enter the server name and path to the server, as shown in Figure 6-6.


    > Figure 6-5: The Networked CUPS (IPP) screen is where you enter the server name
    and path.

    ![image](https://example.com/path_to_image.png)

    **Queue type**nAdd a new print queue

    Select a queue type: [Networked CUPS (IPP)]

    Server: [main.tacttechnology.com]

    Path: [/printers/queue1]

