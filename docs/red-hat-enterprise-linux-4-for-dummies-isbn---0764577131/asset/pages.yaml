  md: '# 230 Part IV: Configuring Your Enterprise Linux Internet Services


    # Using gFTP for FTP access


    Enterprise Linux includes a graphical FTP program — gFTP — that can be accessed
    from either the GNOME or KDE desktops. You can start gFTP by choosing Applications:Internet:More
    Applications:gFTP window, as seen in Figure 14-2.


    To log in to the FTP server via gFTP, proceed as follows:


    +   1. In the Host field, fill in the hostname or IP address of the server to
