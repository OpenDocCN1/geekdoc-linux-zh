  md: '# Dedication


    This book is dedicated to my lovely wife Nancy, who kept our toddler enter-tained
    so I could work on this project.


    # Author’s Acknowledgments


    I always have a hard time writing the acknowledgments for my books because there
    are so many people to recognize that I am always afraid that I''ll miss someone.
    Well, here goes.


    I would like to thank all the people at Wiley who worked on this book, espe-cially
    Terri Varveris, my acquisitions editor, who finally convinced me to write a For
    Dummies book. I''ve known Terri for several years and have come to realize what
    a gem she is. Thanks to Chris Morris, my project editor, for keeping everything
    on track, and thanks to the technical and copy editors for putting their polish
    on the book. A special thank you goes to Doyle Smith who provided me with a few
    PCs I could run all four versions of Enterprise Linux simultaneously.


    And finally, I would like to thank my daughter Sabrina, whose early morning cries
    would wake me so I could do some work on this book. She was an essential part
    of its completion.'
  merge: -1
