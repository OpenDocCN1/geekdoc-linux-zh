    Fortunately, you do not have to be a Sendmail expert in order to perform configuration
    choices. In all cases, you need one of predefined configuration files in `/usr/lib/sendmail.cf`.
    The basic process is to modify of predefined configuration files for your own
    needs, regenerate `/etc/sendmail.cf` by using the m macro processor (explained
    in the following section), and then test your configuration. This method enables
    you to make incremental changes, minimizing the risk of major problems. Red Hat
    Linux comes with a generic Sendmail configuration file (`/etc/sendmail.cf`).


    # The m macro processor


    **macro** is a symbolic name for a long string of characters, much like a keyboard
    is a shorthand way to type a long series of keystrokes. Sendmail gets its rules
    from the entries in a Sendmail macro file. The location of the generic Sendmail
    macro file for Red Hat is


    ```

    /usr/lib/sendmail-cf/generic-linux.mc

    ```


    The rules in the macro file generate the default Sendmail configuration, `sendmail.cf`.
    The m4 is a macro processor that reads the macro file and generates the configuration
    file. If you want Sendmail to use your own customized rules in a complex configuration,
    you can leave the macro file and macro processor alone. For more information on
    changing Sendmail''s rules in the macro file, see the `MailadminHOWTO` on the
    CD-ROM accompanying this book.'
