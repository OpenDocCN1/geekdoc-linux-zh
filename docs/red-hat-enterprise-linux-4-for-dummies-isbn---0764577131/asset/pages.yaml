  md: '# Chapter 10: Security Basics


    +   - SCP: Secure Copy is part of the ssh package and can be used to securely
    copy files from one system to another across a TCP/IP network.

    - SFTP: Secure File Transfer Protocol is similar to regular FTP, but all files
    are done by using ssh over a TCP/IP network.

    - Telnet: Telnet provides remote access to computers across a TCP/IP network.
    Telnet is a non-secure service that passes all information in clear text.

    - FTP: File Transfer Protocol is widely used for transferring software packages
    across the Internet. For most uses, this is perfectly acceptable, but for sensitive
    data, SCP or SFTP should be used.

    - HTTP: HyperText Transfer Protocol is the protocol used to transfer information
    from Web servers to Web clients.

    - SMTP: Simple Mail Transfer Protocol is the protocol used by the mail server
    to send information across TCP/IP networks.


