  md: '# Chapter 14: Configuring and Managing an FTP Server 233


    Quite a few of the ftp commands are the same as the commands that you use in Linux
    for working with the file system. I cover some of the most common ftp commands
    here.


    +   - bye: Using the bye ends the session with the remote server and exits the
    ftp program.

    - cd: The cd command is used to change to a different directory on the remote
    server.

    - chmod: The chmod command is used to change file and directory permissions on
    the remote server.

    - close: The close command is used to end the session with the remote server.

    - get: The get command is used to transfer a single file from the remote server
    to the local computer.

    - help: Using the help command displays a list of available ftp commands. When
    used with a command name, it displays help about the command.

    - lcd: The lcd command is used to change the working directory on the local computer.

    - ls: The ls command is used to obtain a directory listing of the remote server.

    - mdelete: The mdelete command is used to delete files from the remote server.

    - mget: The mget command is used to transfer multiple files from the remote server
    to the local computer.

    - mkdir: The mkdir command is used to create a directory on the remote server.

    - mput: The mput command is used to transfer multiple files from the local computer
    to the remote server.

    - put: The put command is used to transfer a single file from the local computer
    to the remote server.

    - pwd: The pwd command is used to show the current working directory on the remote
    server.

    - quit: Using the quit command ends the session with the remote server and exits
    the ftp program.


    Log in as an anonymous user, use the username anonymous and your email address
    as the password. After you log in, you can access the /var/ftp directory. Files
    that are available for download are in the /var/ftp/pub directory.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_250_0.png)'
