    # System Hangs During Boot\n\nSometimes your system might seem to hang during\
    \ the boot process when starting many of your network services. If your system\
    \ hangs when starting Sendmail, the Sendmail daemon (httpd), the Apache Web server,\
    \ or the Samba daemon (smb), this could indicate that your system is unable to\
    \ resolve the hostname to an IP address.\n\n![](img/64d26e5c3406fc66f2dd833f0d7cc3af_351_1.png)\n\
    \nThe system hangs is the kernel waiting for the name resolver to time out. After\
    \ the name resolver times out, the boot process continues.\n\nIf your network\
    \ has a working Domain Name Server (DNS) server, try the following to correct\
    \ this problem:\n\n+   1. Log in as root and check the contents of your /etc/resolv.conf\
