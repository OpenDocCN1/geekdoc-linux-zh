  md: '# Chapter 19

    Backing Up and Restoring

    Your Files


    # In This Chapter


    +   - Planning your backup strategy

    - Selecting your backup media

    - Determining your backup method

    - Using backup tools


    Making backups of the file system is important to avoid the loss of important
    information in the case of catastrophic hardware or software failure. An efficient
    backup and restoration process can minimize downtime and avoid the need to re-create
    lost work. Red Hat Linux provides several packages for backup strategy and restoration
    of the file system. In this chapter, I show you how to create a backup strategy
    for your systems as well as choose your backup media and use the tools provided
    with Enterprise Linux to do your backups.


    # Planning Your Backup Strategy


    Before you can back up your important files, you need to determine what you need
    to back up. Your choice of what to back up depends largely on what data the system
    contains and how you use the system. However, there are some basic guidelines
    that can help you determine what to back up.


    # Don''t: Back up temp and cache files


    Usually, temporary and cached files do not need to be backed up. The contents
    of the /tmp directory, for instance, are usually deleted when the system is rebooted.
    Therefore, not backing up these files is okay. You might find it worthwhile to
    check whether any packages installed on the system create amounts of ignorable
    temporary data.'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# Part V: Maintaining Your Enterprise Linux System


    # Maybe: Back up OS files


    Depending on the situation, backing up the operating system files might or not
    be advisable. If the machine is a standard installation of Red Hat Enterprise
    Linux without any customizations or extra packages installed, the system files
    can be restored by reinstalling Enterprise Linux. The trade-off is that reinstalling
    and reconfiguring the system probably takes more time and attention than restoring
    the file system from backup. However, this trade-off can be worthwhile because
    of the amount of backup media that can be saved.


    In the particular case that a single Red Hat Enterprise Linux installation is
    copied verbatim onto many machines, backing up the system files of just one of
    the machines might be appropriate. If the system files are identical across machines,
    a single backup should restore them all. In any case, backing up at least the
    /etc directory of each machine is probably wise. Most likely the machines have
    some differing configuration information, such as network and hostname settings.


    # Do: Back up database files and user files


    One thing definitely needs to be backed up, and indeed, needs to be backed up
    via a special method: database files. Going a straight tar from database files
    won''t save you from a database crash because the database files will all be in
    different states having been written to when open. Oracle, Informatix, Sybase,
    and other database programs allow the administrator to put the database tables
    in backup mode. In backup mode, the data goes to a memory cache rather than the
    file, and transaction logs are updated only when the cache is flushed. This procedure
    slows down things but makes certain that the database survive a crash.


    Another part of the file system that needs to be backed up — other than the system
    files — is user files. All user files are stored in subdirectories of the /home
    directory. You would find it all, therefore, to back up all user files at once.


    Even when the entire file system — both system and user files — is backed up,
    you should still back them up separately. System and user files have different
    relative priorities depending on the situation. The user files are important because
    they are irreplaceable, whereas many of the system files can generally be replaced
    by reinstalling Red Hat Enterprise Linux. On the other hand, restoration of the
    system files is necessary for the machine to function and provide services, whereas
    the machine can be totally functional without restoration of the user files. This
    priority considerations must be made when designing a backup strategy.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_305_0.png)'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# Chapter 19: Backing Up and Restoring Your Files


    Give special thought to resources that do not easily fall into the system and
    user categories. Information stored in SQL (Structured Query Language) databases,
    for instance, is technically owned by root or by a special system user but also
    contains irreplaceable content by users. This kind of data can be the most important
    to back up. You might find beneficial to investigate which of the installed packages
    use this kind of data. Other examples besides databases are Web servers and mailing
    archivers.


    # Selecting Your Backup Media


    A variety of backup media are available on the market today. Which backup media
    you depends on a number of factors and the particular needs of the situation.
    You should consider how often files the backups need to be, how redundant the
    backups need to be, and how much money can be allocated to purchasing backup media.
    Table 19-1 provides a comparison of backup media.


    | Table 19-1 Comparison of Backup Media |

    | Medium | Capacity | Reliability | Cost | Speed |

    | Magnetic tape | High | High | Cheap | Slow |

    | Writeable CD | Medium | Medium | Cheap | Fast |

    | Hard drive | High | High | Expensive | Fast |

    | Floppy disk | Low | Low | Cheap | Slow |

    | DVD | High | High | Cheap | Slow |

    | Zip disk | Medium | Low | Medium | Slow |

    | Flash ROM | Medium | High | Expensive | Fast |

    | Removable hard drive (FireWire) | High | High | Expensive | Fast |

    | Removable hard drive (USB) | High | High | Expensive | Medium |


    # Determining Your Backup Method


    In order to save time and money when creating backups and restoring corrupted
    file systems and purchasing backup media, institute a methodology'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# Part V: Maintaining Your Enterprise Linux System


    for creating scheduled backups. The number of different methodologies is unlimited.
    How should you perform backups on the particular needs of your institution and
    computing infrastructure. The scheduling and type of backups depends on the type
    of backup media being used, the importance of the data, and the amount of downtime
    you can tolerate.


    When to use full backups and when to use incremental backups depends on the particular
    data on the machines, how the machines are used, and how much money can be allocated
    to backup media. After you decide on a backup methodology, you must configure
    your tools to use this methodology. Full and incremental backups can be inserted
    in scripts on top the primitive tools like tar. More advanced tools such as dump
    and amanda have built-in support for backup levels and scheduling of various kinds
    of backups. amanda even has a complex configuration language that lets you specify
    details about the types of backups you might want to do, the length of your backup
    cycle, and what files should be excluded from backup (such as private or temporary
    files).


    Another thing to consider is the criticality of the system. If the system must
    be up all times and downtime is a critical situation, full backups are necessary
    in order to minimize downtime. One strategy for backing up critical machines is
    to create a separate volume on mirrored disks for backups and use it as an intermediate
    area to copy files prior to writing them tape. A compressed tar file can be created
    on disk and then written to tape faster than a normal tar file. Also, because
    a backup exists on disk, the tape archive is used only as a last resort if the
    disk archive fails. This strategy is similar to one that the amanda automated
    backup utility uses to take into account faulty backup devices or media. If the
    tape drive fails, the backup on disk can be written to tape when the problem has
    solved.


    The simplest backup methodology is to create a full backup, which copies the entire
    file system to the backup medium. This methodology could be good for: small systems
    in which there is not much data to back up; or systems in which the data is very
    important and changes rapidly, and thus snapshots of the system at different points
    in time are useful.


    However, frequent full backups has several disadvantages:


    +   - Time-consuming: Full backups take a long time to perform if there is a lot
    of data to back up or if the backup medium is slow.


    +   - Tolerable downtime: In order to get a clear snapshot of the system, you
    might need to suspend the execution of processes that modify the file while the
    backup process takes place. If backups takes a long time, downtime might be prohibitive.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# Chapter 19: Backing Up and Restoring Your Files


    +   - Partial restoration hassle: Full backups have no disadvantages when it comes
    to restoring an entire file system from backup. However, there is a disadvantage
    when restoring a partial file system from backup. If a sequential media such as
    magnetic tape is used, it must be searched sequentially in order to find the files
    that need to be restored. This process can cause a partial restoration to take
    as long as a full file system restoration in the worst case.


    +   - Space logs: Full backups also take significantly more space to archive than
    incremental backups. This situation is not too much of a disadvantage if you reuse
    the same backup media—you can overwrite the old backup with the new one. However,
    keeping multiple generations of backups is advisable because sometimes problems
    with the file system, such as corrupted or erased files, are not detected or reported
    immediately. If the file system is backed up once a day on the backup tapes and
    an accidentally erased file is not found for two days, it cannot be recovered.
    On the other hand, if the file system is backed up once a week, any files between
    backups cannot be recovered.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_308_0.png)


    Keeping full backups also has this disadvantage: If a full is made every day,
    the amount of archive media necessary to store quickly becomes prohibitive.


    The alternative to doing a full backup is an incremental backup, which archives
    only the files that have changed or been added since the last backup. Incremental
    backups solve all the disadvantages of full backups:


    +   - Backup speed: Incremental backups are fast. In fact, the more often you
    do them, the faster they are because you have less to back up.


    +   - Partial restoration: Because the backups are smaller, searching from a given
    backup for a particular file is faster, making partial restorations faster if
    you need to restore from a particular known incremental backup. Because less is
    backed up each time, less media is used; thus, less backup media needs to be bought
    or a longer history can be kept in the same amount of backup media. In the latter
    case, backups are more robust against lost or damaged files that are discovered
    for a while.


    However, using incremental backups does have disadvantages. Incremental backups
    are faster for retrieving individual files, they slower for restoring entire file
    systems. To explain this problem, imagine you have a week-long backup cycle. On
    the first day of the week, you make a full backup. The rest of the week, you make
    an incremental backup. If a file system is erased accidentally on the last day
    of the week (right before a new full backup is to be made), you have to start
    at the last full backup and then load a whole week of tapes in order to entirely
    restore the file system. If you made a full backup every day, you would have to
    load only the full backup, and then you would be done restoring the file system.'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# Part V: Maintaining Your Enterprise Linux System


    # Enterprise Linux Backup Tools


    Red Hat Enterprise Linux provides numerous tools for doing file system dump. There
    are tools for interacting with backup media, such as ftape for manipulating tapes
    drives, crecord for writing to CD drives, and mirrordir for making backups to
    hard drives. Command line tools tar and dump allow for low-level control of file
    system backups and also easy automation through scripting. With only shell scripts
    and periodic scheduling through cron jobs, you can develop a robust backup solution
    for many situations. Graphical tools also exist to create a more user-friendly
    interface to performing manual backups. Finally, there are advanced backup tools
    that you can configure to fully automate backing multiple machines.


    # Command line tools


    Red Hat Enterprise Linux provides a number of command line tools for performing
    backups and restoring from backups. The tools for interacting directly with backup
    media are ftape, crecord, and mirrordir. The standard tools for creating archives
    are dump and tar for tape archives and mkisofs for CD archives. Each command provides
    a different interface and a number of options.


    # Managing tape drives with ftape


    The ftape package is installed by default on the system. It''s a collection of
    command line tools for accessing and managing magnetic tape drives. These utilities
    are useful if you are using tape drives to store your backups.


    The ftape package''s mt command is used to scan, rewind, and edit magnetic tapes
    if you have an IDE drive. If you have a SCSI tape drive, the st command performs
    the functions.


    You must be in order to access the tape drives. As root, you can test a new tape
    drive by inserting it into the tape drive and using the following command:


    ```

    mt -f /dev/rft0 rewind

    ```


    The preceding command rewinds the magnetic tape. You can also format the magnetic
    tape with the command


    ```

    ftformat -f /dev/rft0

    ```


    However, many tapes come preformatted, so it''s usually unnecessary to format
    new tapes.'
