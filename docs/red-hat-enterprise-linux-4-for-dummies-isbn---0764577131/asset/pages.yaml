    # Creating archives with tar

    The program is a utility originally designed for making magnetic tape backups
    is useful for any kind of archiving. When making archives, it is important to
    specify a leading ./ for files. This creates a relative-path, which is necessary
    when restoring the files.


    Red Hat Enterprise Linux has the GNU version of tar. It includes some extensions
    to the older standard versions of tar, including multivarticle archiving. Multivolume
    archiving is an automated process in which tar prompts for new media to be inserted
    whenever it runs out of space.


    The tar command requires one command option followed by any number of optional
    options. Table 19-5 lists the command options.


    | Command | Explanation |

    | --- | --- |

    | A | Appends the contents of the given tar files to the specified tar archive.
    |

    | c | Creates a new tar archive and add the given files to it. |

    | d | Finds differences between what''s in the tar archive and what''s in the
    file system. |

    | r | Appends the given files to the specified tar archive. |

    | t | Lists the contents of the specified tar archive. |

    | u | Appends the given files to the specified tar archive but only if they are
    newer than the files in the tar archive. |

    | x | Extracts the given files from the specified tar archive. |


    In addition to specifying a command, you must specify a device or file as the
    destination of the tar archive. Take a look at an example of creating a tar archive.


    Suppose you want to create a tar archive containing all files in your home directory
    using the extension .doc. First, be sure that you are in your home directory.
    Then, to create an archive containing individual files, you can use the following
    command:


    ```

    tar -cf docfiles.tar *.doc

    ```'
