  md: '# # Chapter 1: Getting Acquainted with Enterprise Linux


    the command line firewall tool to create more complex firewall rules. You can
    protect your systems from internal attacks (attacks that originate inside your
    organization) as well as external (outside) attacks.


    Applications are also available that you can use to actively detect system intrusions.
    You can configure how your system should respond to intrusions and what actions
    should be taken to ensure that your systems are not vulnerable to attacks.


    Find more out on intrusion prevention and detection in Chapter 11.


    # ## Providing Internet services


    You use Enterprise Linux to serve information across the Internet to users on
    different networks than your own. The ES and AS versions of Enterprise Linux include
    the Internet servers:


    +   - Apache httpd server: The Apache Web server is the most widely used Web server
    in today. (See Chapter 15).

    - FTP server: The vsftpd server is an implementation of the File Transfer Protocol
    (FTP) that is used for transferring files across the Internet. (See Chapter 14).

    - sendmail: This is the most widely used mail transport agent today. (See Chapter
    13).


    You can remotely log in to another computer on your network or even on the Internet.
    Using the telnet program, or another more secure program called ssh, after logging
    remotely, you can control the computer as though you were sitting in front of
    it.


    In Enterprise Linux, all Internet servers are based on the Transmission Protocol/Internet
    Protocol (TCP/IP), which is the protocol on which the Internet is based. Any network
    applications that use TCP/IP are supported natively by Enterprise Linux. (Read
    on TCP/IP networking in Chapter 12).


    As you can see from this quick examination of the features of Enterprise Linux,
    you can do a lot with it. In fact, anything you can do with the most widely used
    operating system (MS Windows), you can do as well or better with Enterprise Linux.
    You systems will certainly be more secure and less vulnerable to attack if you
    are running Enterprise Linux. The remaining chapters of this book explain in more
    detail the features briefly discussed in this chapter.'
