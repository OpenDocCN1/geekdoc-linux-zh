  md: '# 182 Part IV: Configuring Your Enterprise Linux Internet Services


    address to your browser, the DNS goes to work. You enter names that are easy for
    you to remember, like www.redhat.com, and the names are resolved into numbers
    that computers find easy to understand. Enabling efficient human/machine interaction
    is the function of name address resolution.


    For example, take a look at domain names and their organization, using the domain
    name muhlenberg.edu. The first part of this domain name, muhlenberg, is the name
    of the company, institution, or organization. The next part, after the period
    (dot) in today''s vernacular) is the top-level domain. In addition to the top-level
    domain, you will find a few others. Table 12-1 shows other top-level domains in
    the United States.


    # Table 12-1 United States Top-Level Domains


    | Top-Level Domain | Meaning | Example |

    | --- | --- | --- |

    | com | Typically a business | www.tactstechnology.com |

    | edu | An educational institution | www.muhlenberg.edu |

    | gov | A U.S. government agency | www.whitehouse.gov |

    | mil | A branch of the U.S. military | www.army.mil |

    | net | A network-affiliated organization | www.tellurium.net |

    | org | A noncommercial organization | www.lvcg.org |

    | int | An international organization | www.wipo.int |

    | us | The U.S. domain, with each listing as a lower level | www.state.pa.us |


    Top-level domains in other countries include a two-letter suffix, such as fr for
    France or su for Switzerland. Not all top-level domains are the same as the top-level
    U.S. domains, but a company in France could be http://www.frenchcompany.com.fr.


    Large domains can be further broken down into subdomains. For example, the (state)
    of Pennsylvania Web site is www.state.pa.us. The Pennsylvania state government
    includes many agencies, such as the Road Water Information Service (RWIS). To
    find the RWIS, the domain name contains the subdomain www.rwis.state.pa.us. An
    individual computer in the RWIS also has a host name: for example, leigh.rwis.state.pa.us,
    and you can find its IP address by using the DNS to look it up. When you type
    in a hostname, your system uses its resources to resolve names into IP addresses.'
