- img_proc: true
  md: '# Chapter 14: Configuring and Managing an FTP Server


    need to manually edit the configuration files. The installation process places
    the server startup and configuration files in several places on your system, which
    are


    +   - /usr/sbin/vsftpd: The FTP daemon, which is the actual program that runs
    FTP services.


    +   - /etc/rc/init.d/vsftpd: The initialization script that is run to start the
    server.


    +   - /etc/vsftpd/vsftpd.conf: The main configuration file for the vsftp


    +   - /etc/vsftpd/ftusers: Contains a list of users who are not allowed to use
    the FTP service.


    +   - /etc/vsftpd.user_list: Contains a list of users who are, or not, allowed
    to access the FTP server depending on the configuration direction in the /etc/vsftpd/vsftpd.conf
    file. If the directive userlist_deny=YES is set in the /etc/vsftpd/vsftpd.conf
    file, users in this list are denied access. If userlist_deny=NO, users on this
    list are allowed to access the FTP server.


    If you set the userlist_deny to NO, you do not have the same users listed in the
    /etc/vsftpd/ftusers or the users won''t be able to access the FTP server.


    +   - var/ftp: The FTP directory is created under /var to hold the publicly accessible
    files. If you are allowing anonymous users, another directory — /var/ftp/pub —
    is created for use. You should place publicly available files in this directory.


    The first two files in the preceding list do not require configuration because
    the first file is the ftp program and the second file is the script that starts
    the program. The configuration of the last three files is discussed in the following
    sections.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_240_0.png)


    # Configuring the /etc/vsftpd/vsftpd.conf


    The main configuration file for the vsftp server is /etc/vsftpd/vsftpd.conf. In
    most cases, you can usually accept the default settings and just start the FTP
    server. However, I recommend you become familiar with the configuration file in
    case you need to change settings. An example of this file is shown in Listing
    14-1, with an explanation of the file following the listing. The first line in
    the listing is the command entered at the command prompt, and the remainder of
    the listing is the output for the command.


