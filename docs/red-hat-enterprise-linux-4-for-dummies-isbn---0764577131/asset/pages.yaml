  md: '# # Chapter 11

    Intrusion Detection and Prevention


    +   In This Chapter

    * Types of intrusion detection

    * Using software detection tools to test your system security


    In this chapter, I discuss intrusion detection, which comprises determining whether
    someone has entered your system without authorization. Intrusion detection is
    a complex subject, to say the eye on the least, and I can''t possibly go into
    great detail in the confines of this chapter.


    However, I show you the different types of intrusion detection as well as a tool
    that you can use to test how vulnerable your systems are to attack. By discovering
    your vulnerabilities, you will be able to implement a plan to prevent future intrusions
    of the type that you detected. Finally, I look at a tool, called Tripwire, which
    you can use to keep an eye on your systems and find unauthorized users who might
    have entered your systems.


    # ## Discovering the Types of Intrusion Detection


    Having unauthorized users entering your systems is definitely something that you
    don''t want to happen. Of course you want to stop them before they get in. But
    before you can do something about keeping out unwanted visitors, you first need
    to know whether someone has entered your systems. This is what intrusion detection
    is all about: finding out whether someone is in your system who doesn''t belong
    there. In this section, I examine two types of intrusion detection: active and
    passive.'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# Part III: Securing Your Enterprise Linux System


    # Active detection


    Most us check to be sure that our doors are locked before we go to at night or
    leave the house. We do this to keep someone from getting into our house while
    we are sleeping or while we are away. In much the same way, you can actively check
    the locks on your system "doors" to be sure that no unauthorized users can get
    in. You can check the security of your systems by actively checking your systems
    for known attack methods by using special software designed for this purpose.


    One such program is commonly used to check systems for open ports and other types
    of connectivity information is nmap. With nmap, which is a network exploration
    tool and security scanner that is included with the default installation of Enterprise
    Linux, you can scan your systems to determine which ones are up and what services
    they are offering. You can use the information that you obtain from the scan to
    determine how secure your systems are and what you can do to make them more secure
    if required. I looked at nmap more closely in the upcoming section, "Using Software
    Detection Tools to Test Your Security Security."


    # Passive detection


    As its name implies, with passive detection, no direct action is taken to test
    the system for open ports or other vulnerabilities. This method of intrusion detection
    uses system log files to track all connections to the system. The log files are
    continuously reviewed by the system administrator for details that would indicate
    the system has been compromised.


    You can use the Tripwire program (seeing the upcoming section, "Using Tripwire
    to detect system changes") to take a snapshot of the system when it is fully configured
    and operating as it will be connected to the network. The snapshot contains information
    about system configuration files and operating parameters and is stored on the
    system. Periodically, the snapshot is compared with the same parameters on the
    running system, looking for any changes. If changes are discovered, Tripwire informs
    you of the changes, and thus you know that your system might have been compromised.


    Although passive detection can tell you that your system has been compromised,
    it tells you only after the break-in has occurred. Any damage that the intruder
    might have caused will be yours to deal with. Active detection, on the other hand,
    gives you the opportunity to test your systems for open vulnerabilities and to
    close the open holes.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_179_0.png)'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Using Software Detection Tools to Test Your System Security


    There are many tools that you can use to check your system security. In this section,
    I look at two of these tools — nmap, which you use to actively check our ports
    for vulnerability; and Tripwire, which you use to passively log all system activity
    for you to look at and compare.


    # Scanning your network with nmap


    nmap is a tool that you use to scan your network looking for hosts that are up
    as well as for open ports on those hosts. You can check to see whether nmap is
    installed on your system by issuing the following command:


    ```

    rpm -q nmap

    ```


    If nmap is installed, you see the following output, which shows the most recent
    release of nmap:


    ```

    nmap-3.75.1

    ```


    If do not have nmap installed, you can find the rpm (Red Hat Package Manager)
    file on the installation CD-ROMs. Install it by using the Package Manager tool.
    See Chapter 18 for more information about using the Package Manager tool.


    You can also install a graphical front-end to nmap to enable an easy-to-use interface.
    If you choose not to install the graphical front-end, you have to enter all your
    nmap commands from a terminal command line. You can install the graphical front-end
    by using the Package Manager tool.


    After you are nmap is installed, gather some information about your system. To
    start the nmap front-end, use the following command from a terminal command line:


    ```

    nmapfe

    ```


    > TIP After issuing the command, the nmap front-end opens, as shown in Figure
    11-1. You should run nmap as the root user so you can use all the scanning options.
    If you run nmap as a non-root user, some scanning options will be unavailable.'
  merge: -1
