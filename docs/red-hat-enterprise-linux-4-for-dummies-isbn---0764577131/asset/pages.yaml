  md: '# Chapter 21


    # Ten Troubleshooting and

    Problem-Solving Tips


    **In This Chapter**


    +   - Unable to log in

    - Lost or forgotten root password

    - CD-ROM drive not detected during installation

    - Sound does not work

    - Unable to unmount drive

    - System hangs during boot

    - Unable to access network hosts

    - Making an emergency disk

    - Shell commands don''t work

    - Sources of additional information


    In this chapter, I offer you tips for troubleshooting and solving problems

    that new users typically encounter with their systems. No matter how

    your systems might be running, you will eventually run into a problem that

    gives you trouble or makes your systems unusable. I try to cover some

    those problems here and tell you what to do to correct them.


    # Unable to Log In


    A very common problem for a lot of users is not being able to log in. This

    problem can be caused by a number of reasons, but the most common

    reason is that the user has forgotten his password. Another reason why a

    user might not be able to log in is because she doesn''t have an account onnthe
    system she is trying to use. In either case, you can log in as the root

    user and reset a user''s password, or you can create an account for a user

    who doesn''t have one.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# 330 Part VI: The Part of Tens


    # Resetting a user''s password


    To reset a user''s password, you have to change it to a different password. Do
    this as follows:


    +   Log in as the root user, open a terminal window, and enter the following command:

    ```

    passwd <user name>

    ```

    2. Type a new password for the user and press Enter.

    3. Type the same password again and press Enter.

    4. Log out as root and try logging in as the user to be sure that the login now
    works.


    # Creating a user account


    Another reason a user might not be able to log in is because the user does not
    have an account. This is easily remedied by creating an account for the user.
    To create a user account, do the following:


    +   1. Open a terminal window and log in as the root user.

    2. At the command prompt, type userad username and then press Enter. Be sure to
    enter the correct username for the user.

    3. Type the command passwd username and then press Enter.

    4. Type the password for the user when prompted and then press Enter.

    5. Log out as root and try logging in as the user to be sure the login now works.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_347_0.png)


    # Lost or forgotten root password


    If a user forgets his password, but you can always log in as root to change the
    user''s password. But what can you do if you forget the root user''s password?
    You won''t be able to do a lot of administrative tasks if you can''t become the
    root user when necessary. Fortunately, the procedure for resetting the root password
    is not difficult:


    +   1. Reboot your system.

    2. When the GRUB boot prompt appears, highlight the kernel image that you want
    to boot and press e.

    This opens the GRUB edit window for this kernel.'
