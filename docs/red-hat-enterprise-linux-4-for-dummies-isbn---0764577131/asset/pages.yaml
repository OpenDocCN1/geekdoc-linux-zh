    # # Introducing SMTP


    In the earlier section describing the MTA, you can read that messages are sent
    between MTAs via SMTP. This section explains SMTP and two other protocols to deliver
    mail: Post Office Protocol (POP3) and Internet Message Access Protocol (IMAP4).
    SMTP is the TCP/IP protocol for transferring e-mail messages between computers
    on a network. Messages can go directly from the sending to the receiving or through
    other MTAs on network computers. These other computers briefly store the message
    before they forward it to another MTA (if it is local to the MTA) or to a gateway
    that sends it to an MTA on network.


    The SMTP protocol can transfer only ASCII text. It can''t handle fonts, colors,
    graphics, or attachments. If you want to be able to send these items, you need
    to add another protocol to SMTP, such as Multipurpose Internet Mail Extensions,
    and MIME. MIME enables you to add colors, sounds, and graphics to your messages
    while still enabling them to be delivered by SMTP. In order for MIME to work,
    you must have a MIME-compliant MUA.


    # # The Post Office Protocol (POP3)


    POP3 is the Post Office Protocol version 3. This protocol runs on a server that
    is connected to a network and continuously sends and receives mail. The POP3 server
    stores any messages that it receives was developed to solve the problem of what
    happens to messages when the recipient is not connected to the network.'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Chapter 13: Configuring and Managing an E-Mail Server


    Without POP3, the message could not be sent to the recipient if the recipient
    was offline. With POP3, when you want to check your e-mail, you connect to the
    POP3 server to retrieve your messages that were stored by the server. After you
    retrieve your messages, you can use the MUA on your PC to read them. Of course,
    your MUA must understand the POP3 to be able to communicate with the POP3 server.


    The messages that you retrieve to your PC are then typically removed from the
    server. This means that they are no longer available to you if you want to retrieve
    them to another PC.


    # The Internet Mail Access Protocol (IMAP4)


    The Internet Message Access Protocol version 4 (IMAP4) provides sophisticated
    client/server functionality for handling e-mail. IMAP4 has more features than
    POP3. IMAP4 enables you to store your e-mail on a networked server, as POP3 does.
    The difference is that POP3 requires you to download your e-mail before it reads,
    whereas IMAP4 enables your e-mail to reside permanently on a remote-server, from
    which you can access your mail. And you can do so from your office, your home,
    or anywhere else. Your MUA must understand IMAP4 to retrieve messages from an
    IMAP4 server.


    # Using Sendmail


    A number of mail transport agents are available for Red Hat Enterprise Linux,
    including Qmail, Postfix, and Sendmail. The most widely used MTA is Sendmail,
    which is the default MTA for Red Hat Enterprise Linux.


    # Checking that Sendmail is installed and running


    Before you start to configure Sendmail, be sure that it''s installed on your computer.
    It is probably because the Red Hat Enterprise Linux installation installs Sendmail.
    But just to be sure, check it out. The following example shows how to check, using
    the rpm -q command.


    ```

    root@main# rpm -q sendmail

    ```'
