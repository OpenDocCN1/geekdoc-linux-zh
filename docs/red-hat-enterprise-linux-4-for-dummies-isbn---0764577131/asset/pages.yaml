    On the server you want to be the slave, go to the /etc/named.conf file and add
    two more zones, one for the forward lookup of your server, and one for the reverse
    lookup. For the forward lookup, you need to add the following (For this example,
    the master server is called main.tacttechnology.com, and the slave is p200.tacttechnology.com.
    Be sure to use your own domain name and IP address instead of the examples shown.)'
