    # Restricting Disk Usage with Quotas


    One of the problems that you might encounter as a system administrator is

    out of disk space. Many times, this problem is caused by users who

    not properly manage their home directories. Your users might be saving

    to many files and not periodically removing their unused files.


    You can force users to be more efficient in their use of storage space by

    imposing disk quotas on their home directories. A disk quota is simply a

    restriction on the amount of disk space that a user can use. There is no

    graphical tool available in Enterprise Linux for managing disk quotas, but set-

    ting them up from the command line is a fairly simple process.


    You need to do only a few steps to begin using disk quotas on your system.

    These steps are


    +   1. Modify the /etc/fstab file.

    2. Run the quotacheck program.

    3. Unmount and mount the file system.

    4. Run edquota to set up the user quotas.


    # Configuring disk quotas


    When Enterprise Linux is going through its startup procedures, the /etc/

    fstab file is read by the system to obtain mounting information about the file

    systems. When you want to use quotas on your system, you need to put the

    options usrquota and grpquota into the options area of the file system to be

    mounted.


    Disk quotas can be based on users, groups, or both. If you are using solely

    user-based quotas, you need to add only the usrquota option. If you are

    using solely group-based quotas, you need to add only the grpquota option.

    In this section, I discuss only user-based quotas, but the same rules apply to

    group-based quotas as well.'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# Chapter 17: Administering Users and Groups


    You must be the root user to change the /etc/fstab file. To modify your

