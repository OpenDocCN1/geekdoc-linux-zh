  md: '# # Chapter 6


    # # Configuring and Managing

    Printers


    **In This Chapter**


    +   - Setting up printers with the Printer Configuration tool

    - Changing printer configurations


    Have you ever sent a job to your printer, and it didn''t print? Or maybe the job
    did print, but the output wasn''t what you were expecting? Many times, these problems
    are caused by a printer that''s not properly configured or uses an incorrect print
    driver. If you''re thinking, "Hey, this is exactly what happened to me," then
    you''re in luck reading this chapter.


    In this chapter, I tell you all you need to know to successfully configure and
    manage your system printers. Included with Red Hat Enterprise Linux is the Printer
    Configuration tool to help you configure your printing system. The Printer Configuration
    tool is an easy-to-use, graphical tool that will help you to set whatever type
    of printer you choose. And configuring your printers if you aren''t using a graphical
    user interface (GUI) won''t be a problem because you can also configure your printers
    from the command line in a terminal window.


    After your printer is configured, you might want to gather information about jobs
    that you sent to the printer. You will also want to be able to change job priority,
    see the contents of your print queue, and maybe even delete some of your scheduled
    print jobs. You will be able to do all these functions and more after going through
    this chapter.'
  merge: -1
