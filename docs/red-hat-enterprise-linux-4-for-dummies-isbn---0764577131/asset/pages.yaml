    # Making an Emergency Boot Disk


    Sometimes you might have a problem with your system that prevents it from booting
    properly. Maybe you made some configuration changes and then shut down your system.
    When you tried to boot up, the system wouldn''t start because you changed the
    boot loader configuration files. This is just the time when you could use an emergency
    rescue disk. In this section, I show how to make one.


    Making a boot disk is very easy. Follow this procedure:


    +   1. From a terminal command line, find your kernel version by entering the
    command


    ```

    [root@main root]#uname -r

    ```


    which gives the following output. (Your output might be different.)


    ```

    2.6.9-5.EL

    ```


    +   2. Type the command mkbootdisk 2.6.9-5.EL when prompted and press Enter.


    +   3. Insert a floppy disk into the disk drive when prompted and press Enter.


    When the boot prompt returns, the boot disk has been created.


    # Shell Commands Don''t Work


    This is a common problem encountered by new users who log in as a regular user
    and execute the substitute user command to become the root user. The problem is
    that after entering the su command and becoming root, commands returned the message
    Command Not Found.


    This problem is caused even though the su command allows a regular user become
    the root user with all of root''s permissions, it does not give an actual login
    shell. In this case, the user has root''s permissions but does not have root''s
    search path for directories. For example, when I use su'
