    \ doing unnecessary lookups while increasing system performance.\n\n+   - debug\
    \ level: This option should be set to 2 or smaller. Setting the debug level higher\
    \ than 2 causes the server to flush the logfile after each operation, which is\
    \ a time-consuming process indeed.\n\n+   - Level2 oplocks: This option provides\
    \ for caching of downloaded files on the client side. Setting this option to true\
    \ can increase system performance.\n\n# # Optimizing DNS\n\nYou can improve the\
    \ performance of your master domain server by making some changes in the options\
    \ section of the /etc/named.conf file. The first change that you can make is allow\
    \ only zone transfers between master and slave servers. By default, BIND allows\
    \ zone transfers between masters and slaves, because zone transfers are required\
