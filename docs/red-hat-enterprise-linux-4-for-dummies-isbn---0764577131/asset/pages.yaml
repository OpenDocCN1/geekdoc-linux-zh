  md: '# Part II: Configuring Your Enterprise Linux Local Area Network


    # Command Line Configuration


    You don''t have to use the graphical NFS Configuration tool to configure the NFS
    server. Perhaps you don''t have an X Server installed, or you may just want to
    use the command line because it''s usually faster to do so. In case, the only
    file that needs to be changed to configure the NFS server is the /etc/exports
    file. This is the file that''s modified if you use the graphical tool. To export
    the directories that you want to export via the command line, do the following:


    +   1. From a command prompt, open the /etc/exports file by using any text editor.


    I usually use the vi editor for making changes to configuration files. Although
    it takes a little while to get to vi, it''s very quick and easy to use after you
    become familiar with it. An advantage is that vi is installed by default on about
    every Unix and Linux system. If you''re uncomfortable using vi, you can try using
    edit, which is the GNOME text editor. To open edit, choose Applications:Accessories:Text
    Editor.


    +   2. Enter the information about the directory that you want to export and to
    whomnames by using the following syntax: /export_directory hostname(options)


    The only option that you must specify is either sync or async, which tells the
    server whether to respond to requests before the changes are requested to disk.
    The recommended option is sync.


    For example, if I want to export the /musicfiles directory to terry.muhlenberg.edu
    with read and write permissions, I enter /musicfiles terry.muhlenberg.edu(rw,sync)


    +   3. Save the changes that you make to the /etc/exports file.


    +   4. Restart the NFS server by issuing the following command: /sbin/service
    nfs restart


    After you have the /etc/exports file open, you can make changes to imported shares
    and even delete shares using the text editor to make the changes.


    Any time that you manually change the /etc/exports file, you need to reload the
    file to let the NFS server know about the changes. Restarting the NFS service
    reloads the /etc/exports file.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_145_0.png)


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_145_1.png)'
