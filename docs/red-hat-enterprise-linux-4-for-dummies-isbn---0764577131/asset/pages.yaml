  md: '# Chapter 11: Intrusion Detection and Prevention


    Many options can be chosen when running nmap scans of your systems. I suggest-

    g that you run the program and try different options to see their effect on

    your scan output. You can also try enabling and disabling different services

    to see their effect on the nmap scans.


    # Using Tripwire to detect system changes


    Tripwire is often referred to as file integrity software. Tripwire works by creat-\ing
    a database of important files and systems on your system. The program gathers
    the saved database information with the same information on

    the operating system at some time in the future. A report that lists changes to

    the files or file systems is generated by Tripwire. The changes might or might

    be an indicator of an intrusion or that the system has been compromised.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_188_0.png)


    Depending on the use of the system, it might not be necessary or even advised-

    to install Tripwire. If you use your system for testing or if you frequently

    change system files, you probably don''t want to use software that is meant to

    detect changes to system files because you will receive many notices about

    the changes.


    Before you can put Tripwire to work for you, you must first install and config-

    it.


    # Installing Tripwire


    Tripwire was included in previous versions of Red Hat Linux, but since the

    move to Enterprise Linux by Red Hat, Tripwire is no longer included with the

    standard distribution. However, I believe that Tripwire is useful enough to

    installing it on an Enterprise system. You can find Tripwire, at no

    cost, at


    ```

    http://rpm.cha26.com/p=fedora/tripwire/tripwire-2.3.1-18.fdr.3.1.fc2.i686.rpm

    ```


    I recommend installing Tripwire immediately after installing the operating

    system. You do not connect your system to any network until you have

    installed and configured Tripwire. After you download the rpm file, install it

    by entering the following command:


    ```

    rpm -Uvh tripwire-2.3.1-18.fdr.3.1.fc2.i686.rpm

    ```


    Installing the Tripwire rpm file places several files and directories on your

    system. The directories and the files that they are


    +   - /usr/sbin: This directory contains the Tripwire executable files. These

    files are tripwire, twadmin, and twprint.'
