    includes a word processing application, a presentation application, a spreadsheet
    application, a drawing application, a math equation editor, and an HTML page creation
    tool. In most cases, OpenOffice.org is compatible with documents created with
    other office applications such as MS Office. I have successfully created documents
    with OpenOffice.org and vice versa. The great thing about OpenOffice.org is its
