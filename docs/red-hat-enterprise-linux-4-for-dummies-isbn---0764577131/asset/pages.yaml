  md: '# Chapter 20: Ten Tips for Optimizing Your System 315


    +   Run XFree86 at a lower value. By increasing XFree86''s priority over processes,
    you will get a more responsive system. One way to do this is to start XFree86
    by using the command nice -n -10 X. You need root access to use this command.
    If you run XFree86 from XDM, GDM, or KDM, modify the Xservers file (/etc/X11/xservers).
