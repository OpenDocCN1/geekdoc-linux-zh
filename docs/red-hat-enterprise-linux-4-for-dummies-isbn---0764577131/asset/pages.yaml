    # # Exploring your PC''s Components


    Before installing Red Hat Enterprise Linux, you should compile a list of the hardware
    components in your computer. Linux supports different types of hardware through
    device drivers, similar to other operating systems. A driver is required for each
    peripheral device; depending on the age of your hardware, a driver might not be
    available. If your hardware is current less than two years old — the drivers that
    you need are probably available and included with the distribution. If you need
    a driver that is not included with the distribution, searching the Internet usually
    provides you with a solution.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_358_0.png)


    Whenever I need a driver, I usually do a Google search for it. For example, if
    I needed a driver for an NVIDIA video card, I search for NVIDIA Linux driver,
    or I could search for Crystal Audio Linux driver for my sound card driver.


    You can install and run Red Hat Enterprise Linux even if no drivers are available
    for certain devices, such as your video card or soundcard. Of course, these devices
    might not function or perhaps function in a'
