  md: '# Chapter 15: Serving Web Pages


    On this page, you can set the following options:


    +   **Default Directory Options:** The default directory options are listed here.
    To change the options, click the Edit button in the upper-right corner to open
    the Default Directory Options dialog box from which you can select or deselect
    options. The directory options are

    * **ExecCGI:** Select this option to allow execution of CGI scripts.

    * **FollowSymLinks:** Select this option to allow symbolic links to be followed.


    A symbolic link is a pointer to another file. For those of you who are familiar
    with MS Windows, you can think of a symbolic link as a shortcut.

    * **Includes:** This option allows the server to use server side includes.

    * **IncludesEXEC:** This option allows server side includes and disables the exc
    and include commands from CGI scripts.

    * **Indexes:** If you do not have a directory index file, such as index.html,
    a request to the server displays a list of files in the directory.

    * **MultiViews:** This option enables multiviews and is not enabled by default.
    When enabled, the Web server tries to find pages similar to the requested page
    if the requested page is not found. For example, if a user requests a whatever.html
    and it is not found, the Web server will look for pages whatever.*.*

    * **SymlinksOwnerMatch:** This option allows symbolic links to be followed if
    the directory has the same name as the symbolic link.


