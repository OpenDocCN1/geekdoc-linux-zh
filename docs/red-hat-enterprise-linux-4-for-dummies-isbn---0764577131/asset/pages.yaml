    # CD-ROM Drive Not Detected\During Installation


    Before beginning your installation, you should check the hardware compati-

    bility at the Red Hat Web site. This will ensure that your hardware is com-

    patible with Enterprise Linux. But even if you check and find that your

    CD-ROM drive is supported, the drive might not be detected by Enterprise

    Linux although it is recognized by the system BIOS and you can boot from

    drive.


    In this case, you can specifically tell the system to find the CD-ROM

    drive by following this procedure:


    +   1. Boot your system using the first installation disk.


    +   2. When you see the boot prompt, type linux hdx=cdrom and then press

    Enter.


    This command specifically tells the kernel to look for the the CD-ROM

    drive. x should be one of the following:


    +   a: First drive on primary IDE controller (master)


    +   b: Second drive on primary IDE controller (slave)


    +   c: First drive on secondary IDE controller (master)


    +   d: Second drive on secondary IDE controller (slave)


    Your system should now see the CD-ROM drive, and you can install

    Enterprise Linux.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# 332 Part VI: The Part of Tens


    # CD-ROM Drive Does Not Mount After Installation


    On some systems, the CD-ROM drive will not mount after the installation. If you
    encounter this problem, try this solution:


    +   1. Boot your system from a backup boot disk.

    Read how in the upcoming section, "Making an Emergency Boot Disk."

    2. At a terminal command line, type the command depmod -ae and then press Enter.


    This command creates a dependency file of the system modules. When the system
    boots, this file is used by the modprobe command to automatically load the proper
    modules.


    # Sound Does Not Work After Installation


    The Enterprise Linux installation program does a good job of detecting the hardware
    on your system and attempting to configure it properly. Most of the time, your
    sound card will be detected and the proper modules loaded so that it works. Sometimes,
    though, the installation program might not be able to detect your sound card.
    Or your sound card might be detected but not configured properly. Here are some
    suggestions that you can try to get your sound card:


    +   Try the automatic configuration program again. Sometimes running it after
    logging in as root can correct the problem.

    Choose Applications:System Settings:Soundcard Detection. If your sound card is
    detected, you are given the option to configure it. If your sound works during
    the test, that''s great: You''re finished.

    Edit the /etc/modprobe.conf file. If the sound doesn''t work or if your sound
    card isn''t detected, you can manually try some settings by editing the /etc/modprobe.conf
    file. The /etc/modprobe.conf file from your system is shown in Listing 21-1.


    Listing 21-1: Sound Module and Configuration Information of the /etc/modprobe.conf
    File


    ```

    [terry Terry]$ cat /etc/modprobe.conf

    alias parport_lowlevel parport_pc

    alias eth00

    alias usb-controller usb-uhci

    ```'
  merge: -1
