    \ root]# cat /etc/resolv.conf\n: generated by /sbin/dhclient-script\nsearch mhlenberg.edu\n\
    nameserver 192.104.181.5\n```\n\n+   2. If your /etc/resolv.conf file does not\
    \ have the proper values for your system in the search and nameserver lines, make\
    \ corrections as necessary and save the file."
