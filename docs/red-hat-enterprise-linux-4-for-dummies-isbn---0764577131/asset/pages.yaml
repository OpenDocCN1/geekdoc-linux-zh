  md: '# Types of DNS Servers


    A top-level server, one that provides information about the domains shown in Table
    12-1, is typically referred to as a *root nameserver*. When you try to find a
    Web site, www.mulhenberg.edu for example, your system sends a query to the root
    nameserver for .edu for information. The root nameserver directs the search to
    a lower-level domain nameserver until the information is found.


    After you find the domain that you''re looking for, information about that domain
    is provided by its local domain nameservers. The three types of local domain nameservers
    are the *master server*, the *slave (or secondary) server* and the *caching server.


    +   Master server: This contains all the information about the domain and supplies
    it when requested. A master server is listed as an authoritative server when it
    contains the information that you are seeking and it can provide that information.


    +   Slave server: This is intended as a backup in case the master server goes
    down or is not available. This server contains the same information as the master
    and provides it when requested if the master server cannot be contacted.


    +   Caching server: A caching server does not provide information to outside sources;
    it is used to provide domain information to other servers and workstations on
    the local network. The caching server remembers the domains that have been accessed.
    Using of a caching server speeds up searches the domain information is already
    stored in memory, and the server knows exactly where to go rather than having
    to send out a request for domain information.


    Where does the information that the master and slave servers come from? The server(s)
    have to be configured, either by you or someone else, to provide it when asked.
    DNS configuration is contained in files that are referred to as *zone files*.
    In the next sections, you will see how to configure the servers to provide domain
    name information.


    # Examining the DNS Server Configuration Files


    Before you begin to configure your servers, you need to take a closer look at
    the files you need to configure. You need five files to set up the master server.
    Three files are required regardless of the configuration as a master, slave, or
    caching-only server, and two additional files are used on the master server.'
  merge: -1
  pgno: 200
- img_proc: true
  md: "# 184 Part IV: Configuring Your Enterprise Linux Internet Services\n\nThe three\
    \ required files are\n\n+   - named.conf: Found in the /etc directory, this file\
    \ contains global properties and sources of configuration files.\n- named.ca:\
