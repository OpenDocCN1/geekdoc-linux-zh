  md: '# 64 Part I: Becoming Familiar with Enterprise Linux


    +   - opt: This directory is frequently used to hold applications that are installed
    on the system.


    +   - proc: The /proc directory is a virtual file system that acts as an interface
    to the kernel''s internal data structure. You can get detailed information about
    your system hardware and even change kernel parameters while the system is running.


    +   - root: This is the home directory of the root user.


    Don''t confuse this directory with the / directory, which has the same name.


    +   - sbin: This directory contains system binaries (programs) that are used by
