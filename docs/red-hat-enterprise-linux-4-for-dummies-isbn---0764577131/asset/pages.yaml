  md: '# # Chapter 13


    # # Configuring and Managing an E-Mail Server


    +   ## In This Chapter

    * How e-mail works

    * Configuring your mail server

    * Maintaining e-mail security


    With your computer, you can send messages to and receive them from other computer
    users anywhere in the world. E-mail, as it''s more commonly known, is a very powerful
    and useful tool. In this chapter, I show how e-mail works and then how to configure
    your systems to put e-mail for you.


    # ## E-Mail Works


    An e-message, just like a letter sent through regular mail, begins with a sender
    and ends with a receiver. In between these two people are many postal workers
    who ensure that the letter is properly handled. Even though the sender and receiver
    might never see these workers, their functions are essential in moving the mail.
    E-mail works in a similar fashion, and although there are not many people between
    the sender and receiver, programs perform the same function. These programs use
    network protocols to do the job of ensuring the message goes from sender to receiver.
    In this chapter, I show you how to configure e-mail to run TCP/IP protocols.


    Before configuring an e-mail client or server, you need to understand how e-mail
    works as well as the programs to use or make available to your users. Several
    key components are essential for e-mail to work properly. As a system'
  merge: -1
