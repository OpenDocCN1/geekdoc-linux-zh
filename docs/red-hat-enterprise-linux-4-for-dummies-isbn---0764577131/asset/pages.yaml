    | Nofull | Specifies that amanda should use level 1 incremental backups always
    and never do full backups. This is useful when a set of machines all have the
    same base installation and setup with minor differences that do not change rapidly.
    amanda saves space by backing up only the changes that occur over time. |

    | Noinc | Specifies that incremental backups should never occur and that amanda
    always do full backups. This is useful if it is important to make the restoration
    of a machine as swift and easy as possible. However, this makes backups much slower
    and requires much more storage space for the backups. |

    | Skip | This option specifies that the dump type should never be backed up either
    with full or incremental backups. The dump type is ignored if it occurs in the
    disklist file. |


    You need to adapt the amanda.conf file to your system. Most notably, you need
    to correctly specify the paths to the tape drive devices, the type of tape drives,
    and the path to the directory where amanda can use as temporary space.


    You must also create a disklist file that specifies which partitions to back up.
    In the example setup, this file would be stored as /etc/amanda/test/disklist.


    The format of the disklist file is a series of entries, one per line, in the following
    format:


    ```

    Hostname device dumptype

    ```


    The disklist file has the arguments shown in Table 19-11.


    | Table 19-11 disklist Arguments |

    | Argument | Explanation |

    | Hostname | Specifies the hostname of the amanda client to be backed up. For
    the amanda client to enable a connection from the amanda server, the hostname
    of the amanda server must be in that client''s .amandahosts file. |

    | Device | Specifies the name of the directory to be backed up. |

    | Dumptype | Specifies the name of the dumptype definition in the amanda.conf
    file, which defines the properties associated with this type of dump.'
