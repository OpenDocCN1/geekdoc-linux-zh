  md: '# Chapter 7: Configuring the Network


    physical device must exist in different profiles and cannot be activated simultaneously.
    Device aliases are also associated with the same physical hardware, but device
    aliases with the same physical hardware can be activated at the same time.


    Profiles can be used to create multiple configuration sets for different networks.
    A configuration set can include logical devices as well as hosts and DNS settings.
    After configuring the profiles, you can use the Network Administration tool to
    switch back and forth between them.


    By default, there is one profile called. To create a new profile, the following:


    +   1. Choose Applications::System Settings::Network.

    If you are not logged in as the root user, you will be prompted to enter the root
    password.

    2. Choose Profile::New from the menu.

    3. Enter a unique name for the profile.

    4. After creating a new profile, if all the devices are not listed for all the
    profiles, add them by clicking the Add button.

    If a device already exists for the physical device, use the Copy button to copy
    the existing device.


    In the list of devices is a column of check boxes labeled Profile. For each profile,
    you can check (mark) or uncheck (clear) devices. Only the checked devices are
    included for the selected profile.


    A profile cannot be activated at boot time. Only the devices in the Common profile,
    which are set to activate at boot time, are activated at boot time. After the
    system has booted, execute the following command to enable a profile (replacing
    profilename with the name of the profile):


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_138_0.png)


    ```

    redhat-config-network-cmd --profile profilename

    ```'
