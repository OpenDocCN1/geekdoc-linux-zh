  md: '# Part I: Becoming Familiar with Enterprise Linux


    # Gaining superuser (root) privileges


    Usually, when you want to use your system for doing your typical work, you should
    log in as a regular user. Sometimes you might need more privileges to be properly
    administer your system, so you need to become the root, or superuser. Fortunately,
    you can use the su command to gain superuser privileges to accomplish your administration
    task. When you are finished, you can give up the superuser privileges and return
    to being a regular user. Using the following command makes you the root user:


    ```

    su

    ```


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_95_0.png)


    Be sure to include the dash after the command so you will also have the path of
    the root user instead of the regular user. After entering the command, you will
    be prompted to enter the root password. When you are finished working as root,
    type exit to return to your regular user.


    # Changing your system path


    Your path is a list of directories that are searched by the shell when it looks
    for files. You don''t have to specify the location of any files that are in the
    system path it will always be searched. Sometimes you might want to add additional
    directories to the search path. You can do this by using the export command. Before
    you add to your path, you might want to see the directories that are currently
    listed there. You can use the echo command to tell the system to display your
    path by entering the following command:


    ```

    echo $PATH

    ```


    The output of this command is the following:


    ```

    /usr/kerberos/bin:/usr/local/bin:/usr/bin:/usr/X11R/bin:/home/terry/bin

    ```


    Now you know what your current path is. Usually, you want to append additional
    directories to the current path. For example, if I want to add my home directory
    to the search path, I enter the following command (note the use of quotes):


    ```

    Export PATH="$PATH:/home/terry"

    ```


    By using this command, I added my home directory to my search path. Now my home
    directory will always be searched as part of my search path.'
