- img_proc: true
  md: 'After you conduct your security audit, you are ready to create your security
    policy based on the information that you obtained from the risk assessment phase
    of the security audit. Additional areas that you need to cover in your security
    policy relate to those who are authorized to use your systems as well as those
    users who authenticate, or log in, to your system.


    The services you decide to offer to your users will greatly affect your security
    policy. For example, if you plan to offer Internet services to your users — such
    as FTP, e-mail, Internet, and Web access — you must consider the access level
    for your users. You might also need to consider virus scanning for e-mail and
    downloaded files.


    You must also consider protecting company data as well as sensitive data from
    unauthorized users. You might need to consider legal requirements for securing
    your data and legal ramifications for the unauthorized release of data.


    The final step in crafting a security policy is actually putting it in. Whoever
    you assigned the responsibility for your system security will implement the policy
    and perform periodic checks to be sure that the policy is working and being followed.


    # # Implementing Host Security


    After you have a basic understanding of system security (as explained in the first
    part of this chapter), look at specific examples of securing your hosts to make
    them less vulnerable to threats. In this section, I look at some system administration
    security functions, such as employing good usernames and strong passwords and
    also assigning proper access rights to files and directories to keep out unauthorized
    users.


    # # System administrator security functions


    As the system administrator, you have a lot of control over securing the hosts
    on your network. You can do many administrator functions to make your systems
    less vulnerable. One of the most important functions of the system administrator
    is creating user accounts. In fact, the primary method that you have for securing
    your systems is to assign good usernames and strong passwords to your user accounts.
    However, creating user accounts by assigning good usernames and strong passwords
    is not the only security function that you can apply to your systems. The following
    list shows the common tasks that an administrator performs on user accounts.


    +   * Creating accounts

    * Assigning passwords'
