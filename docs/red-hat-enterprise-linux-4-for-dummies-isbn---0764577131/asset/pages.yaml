  md: '# Chapter 16: Maintaining Your System with the Red Hat Network 259


    # Using the Red Hat Enterprise Linux Update Agent


    The update agent is a valuable tool for you because it helps you to keep your
    system running the most current versions of the packages installed on your system.
    During the system installation, an Alert icon is placed on the right side of the
    top desktop panel that provides visual notification when your system needs to
    be updated. Figure 16-6 shows the location of the Alert icon on the panel.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_276_0.png)


    The Alert icon is colored-coded, representing a different state of the update.
    The icons and their meaning are


    +   * Blue check mark: The system is up-to-date.

    * Green double arrows: The system is checking for updates.

    * Red exclamation point: The system needs to be updated.

    * Gray question mark: An error occurred.


    You can roll the mouse over the Alert icon to view a small pop-up window that
    gives additional information. To start the updateagent to update your system,
    by the following:


    +   1. Right click the Alert icon and select Launch Update2 from the contextual
    menu.

    * If you are not logged in as root, you will be prompted for the root password.

    * The first time you run the utility, a configuration dialog box appears the terms
    of service and provides a dialog box from which you can configure a proxy server
    if necessary.

    2. **You are prompted to install the Red Hat GPG key that is used to verify the
    Red Hat security signature on the downloaded packages. Click Yes to install the
    key.**


    You see the Red Hat Update Agent Welcome screen.'
