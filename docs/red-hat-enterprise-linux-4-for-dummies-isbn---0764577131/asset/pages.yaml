    your Web browser to go to http://rhn.redhat.com/network, creating a login, and
    filling in the online registration form.


    You must logged in as root to perform the registration, and you must also have
    a connection to the Internet to be able to log on to the Red Hat Web site. If
    you aren''t connected to the Internet, you will receive an error message, and
    the program progresses when you click OK.


    Start the registration process by following these steps:


    +   1. **From the GNOME desktop, choose Applications→System Tools→Red Hat Network.**


    You see the Red Hat Network Configuration screen where you can set a proxy server
    and authentication information if you need to. Click OK to go and click Yes to
    install the PPG key. The Red Hat Update Agent screen appears that provides a description
    and lists the benefits of the Red Hat Network. If you choose not to use the Red
    Hat Network, you can click Cancel to end the process.


    +   2. **Click Forward to continue to the Update Login dialog box, as shown in
    Figure 16-1.**


    You use this dialog box to create a new account or use an existing one if you''ve
