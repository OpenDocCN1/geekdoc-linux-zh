    for the user at /home/username unless you decide not to create the directory or
    place it somewhere else. A private group — that is, belonging to the user — is
    also created for the user unless you decide not to create the group when you create
    the user account. "Adding a new group" later in this chapter. Finally, all users
    on the system have a user ID (UID) assigned to the system. Enterprise Linux reserves
    UIDs less than 500 for system purposes, so all users that you create have UIDs
