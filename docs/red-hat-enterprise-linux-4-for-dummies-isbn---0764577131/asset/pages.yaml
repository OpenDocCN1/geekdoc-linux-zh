    # Searching for files


    Sometimes you might look for a file in your file system but can''t remember where
    it is. Fortunately, the shell provides a command that you can use to help you
    find it. Easy to remember, the command is find. For example, if you want to find
    the file testfile but don''t remember where it is, enter this command:


    ```

    find -name testfile -print

    ```


    The basic syntax for the find command is


    ```

    find path options filename options

    ```


    The preceding command begins searching in the system root directory for a file
    named testfile and displays the results of the search to the system display.


    > The find command is very powerful and useful for finding files. It is also a
    complex command that lets you specify a large number of options for finding types
    of files. Be sure to use the command man find to see the complete list of options
    for this command.


    # Deleting files


    To remove files from your system, you can use the rm command. For example, if
    you want to delete the file testfile, enter the following command:


    ```

    rm testfile

    ```


    Be careful when using the rm command because you can easily delete files by accident.
    Deleted files cannot be recovered.


    # Viewing file contents


    You have several ways to view the contents of any text file. Here are two methods.
    The first is using the more command, as follows:


    ```

    more testfile

    ```'
