    If you''re setting permissions for an executable file, you can also choose to
    run the program with the user ID (UID) or group ID (GID) of the owner by selecting
    the Set UID or the Set GID check boxes, respectively.


    Having executable files running with Set UID enabled can be dangerous to your
    system. If this permission is set, the program runs with the permissions of the
    file owner. If the owner is root, the program has the same permissions as the
    root user; thus, the program can create new files, read all system files, and
    delete any file. If the program has security vulnerabilities, someone can gain
    root access to your system by exploiting the vulnerability.


    You can find all the files on your system that have the UID set by entering the
    following command at a command line prompt:


    ```

    find -type f -perm 4000

    ```


    You might be surprised at the long list of files that you will see. Don''t be
    alarmed, because these programs need to run with the UID set. You should check
    the list, looking for files that have the permission set and are located in a
    user''s home directory. Files with the UID set are not typically found in a user''s
    home directory, and finding such an indication that someone has compromised your
    system.


