  md: '# Configuring an NFS Client


    Before you can access directory shares that have been exported by an NFS server,
    you need to do some configuration of the NFS client. The client configuration
    is quite simple and easy. All you need to do is mount (access) the exported directories
    onto your file system. There are several ways that you can mount the exported
    directories, and I show them to you here.


    # Mounting an NFS directory


    You can always use the mount command to mount the exported directory on your file
    system. The basic syntax for mounting an exported share


    ```

    mount NFS_Server_Name:/exported_directory /mount_point

    ```


    For example, suppose that my NFS server is named terry.muhlenberg.edu, the directory
    that I exported is /musicfiles, and I want to mount the exported directory on
    my file system at /mnt/temp. I use the following command:


    ```

    mount terry.muhlenberg.edu:/musicfiles /mnt/temp

    ```


    After executing the mount command, the /musicfiles directory exported by the NFS
    server is accessible on my file system at the mount point that I specified — in
    this case, at /mnt/temp. Now the files are available to me locally, but I wouldn''t
    want to manually mount the exported directory every time I start my system. I
    want the directory to be mounted automatically when my system starts. I show you
    how in the next section.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_146_0.png)


    The mount point on your file system for the exported directory must already exist.
    Be sure that you create the directory before you issue the mount command.


    # Mounting NFS directories automatically at system start


    By placing the mount information for my NFS server into one of your system startup
    files, you can have the exported directories available automatically every time
    your system starts. The file that you need to modify is /etc/fstab file. An example
    of the /etc/fstab file is shown in Figure 8-6.'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# 130 Part II: Configuring Your Enterprise Linux Local Area Network


    ```

    root@terry:~# cat /etc/fstab

    LABEL=/root      ext3       defaults       1 1

    LABEL=/      /boot     ext3       defaults       1 0

    none            /dev/pts    devpts,mode=624 0

    LABEL=/home     ext3       defaults       1 2

    none            /proc        Defaults       0 0

    none            tmpfs       swap             0 0

    /dev/hdb0      swap         iso9660 noauto,nomer,kudfs 0 0

    /dev/sda /mnt/floppy  auto           noauto,nomer,kudfs 0 0

    /dev/sda1 /mnt/drive2 ext3       defaults       0 0

    /dev/sda2 /mnt/thash auto           noauto,nomer,user 0 0

    /dev/sda3 /mnt/zip auto           noauto,nomer,user 0 0

    [root@terry ~]#

    ```


    Figure 8-6: The /etc/fstab file.


    This file contains information about the file systems that my system knows and
    will automatically mount for me. I just need to add one line of the exported directory
    that tells me where to go to find the directory and where to mount it on my system:


    NFS_server_name:/export_directory /lmnt_point filetype options


    For example, suppose that my NFS server is terry.muhlenberg, the directory I exported
    is /musicfiles, and I want to mount the exported directory on my file system at
    /mnt/temp. I add the following line after the last line of /etc/fstab file by
    using any text editor:


    ```

    terry.muhlenberg.edu:/musicfiles /mnt/temp rsize=8192,size=8192

    ```


    The options shown in the preceding example show the read and write size in bytes.
    The default size is 1024 bytes, but increasing the size to 8192 greatly increases
    system performance. Of the many options that can be specified for mounting the
    NFS shares, these two are the most common. You can see a complete list of available
    options by reading the nfs manual page, which you can access by entering the following
    command at a terminal prompt:


    ```

    man nfs

    ```'
  merge: -1
