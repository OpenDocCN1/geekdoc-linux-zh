  md: '# 308 Part V: Maintaining Your Enterprise Linux System


    # amanda client configuration


    In order to enable the amanda backup servers to connect to the clients to request
    backups, you must create on each client .amandhosts file in the /root directory
    of the machine. The file consists of names of the server machines that are allowed
    to connect to the client in order to request backups.


    You are wise to set the permissions of this file to 600 by chmod. That ensures
    that only you can modify the file and other users cannot add hosts to the file,
    thus bypassing the permission system and gaining access to the full system.


    # Performing backups with amanda


    In order to perform a backup, you run amdump with the name of the backup that
    you want to run. The configuration information and list of partitions to be backed
    up are read from the configuration files in the particular subdirectory /etc/amanda
    that you created for this particular type.


    # amdump test


    The amdump commands then go through the list of partitions specified in amdump
    and back each of them, in order of importance, to the tape drives specified in
    the associated amanda.conf file. Specifically, the partitions in the disklist
    file so that in case of problems, the most important files are more likely to
    have already been backed up. The results of the amdump operation, including any
    errors, are written to the /usr/adm/amanda/test directory.


    # Using pax


    The pax (portable archive tool) is used for reading and writing copying directory
    structures. The pax tool is also useful for converting between archive formats.
    This capability is especially important in an environment where different operating
    systems and distributions are running in conjunction. Incompatibilities between
    the various tools and various versions of tools can be quite a hassle. pax solves
    this problem by knowing how to read many versions of several different archiving
    formats.


    # Table 19-12 pax Options


    | Option | Meaning |

    | --- | --- |

    | -r | Reads files from archive. |

    | -w | Writes files to archive. |'
