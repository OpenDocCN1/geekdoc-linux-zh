    on your PC. Network devices are associated with the actual physical hardware in
    the PC.


    If you have a supported NIC installed on your system installation of Red Hat Enterprise
    Linux, your NIC should already be listed in the Network Configuration tool. Click
    the Hardware tab to see information about the device.


    +   * **Hardware**: This tab shows the actual physical hardware installed in your
    PC.


    +   * **IPSec**: This tab is where you can configure IPSec tunnels for secure
    communications.


    +   * **DNS**: This tab shows the hostname, domain, and nameserver used for DNS
    lookups. You can configure this information here.


    +   * **Hosts**: This tab shows the PC hostname to static IP address mapping.


