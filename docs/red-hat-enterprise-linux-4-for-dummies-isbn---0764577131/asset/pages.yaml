    # Restarting Your X Server


    Sometimes you might be running a program that stops responding to clicks or keyboard
    commands. Or, the GUI stops responding, and your system appears to be frozen.
    In these instances, you can stop and restart the X Server to reset your desktop.
    You can restart your X Server by doing the following:


    +   1. Press Ctrl+Alt+Backspace.


    +   2. After the X Server restarts, log in to enter your desktop.


    # Disabling the X Server


    If you are using the server versions of Enterprise Linux and will be using the
    command line to do your server configurations, you might want to disable the X
    Server from starting automatically to conserve system resources. Although I don''t
    recommend this action for inexperienced users, an experienced user doing configurations
    from the command line can work much faster and efficiently than a user doing the
    same configurations through the GUI tools. If you want to disable the X Server,
    do by the following:


    +   1. Using a text editing program, open the /etc/initab file.


    +   2. Find the line in the file that looks like:


    ```

    id:5:initdefault

    ```


    +   3. Change the numeral 5 to 3.


    +   4. Save the changes to the file.


    +   5. Restart your system.'
