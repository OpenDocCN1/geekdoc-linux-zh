  md: '# Chapter 10: Security Basics


    +   - Passwords should have a minimum length. Your passwords should be at least
    eight characters long.


    +   - Passwords should have a maximum length. Your passwords should be no longer
    than 15 characters, or your users will have trouble remembering them.


    +   - Don''t use common words found in a dictionary. Any word found in a dictionary
    — in any language — is a poor choice for a password. There are programs specifically
    designed to search dictionaries looking for a password match


    +   - Don''t use the same password on different systems. Never use the same password
    on more than one system because someone breaks your password, he might also gain
    access to the other system.


    +   - Educate your users. Your users will most likely be able to change their
    passwords, so you need to be sure that they are properly educated in proper password
    selection.


    Password management

    As the system administrator, you can set properties affecting your user''s password
    and account usage. You can set the following properties:


    +   - Password expiration: You can force users to change their passwords by setting
    a password expiration date in the User Manager. See Chapter 17 to read about the
    User Manager tool.


    +   - Password lockout: You can prevent a user from logging in by locking the
    password in the User Manager, thus essentially disabling the account. If a user
    is on extended leave or if you''ve set up a temporary or maintenance account for
    outside contractors, you can use this feature to lock the account and prevent
    access.


    +   - Account expiration: You can set an expiration date for the entire account
    in the User Manager.


    Assigning file and directory permissions

    All users need to have permissions, rights, to the files and directories that
    they use to do their work. Be sure that you do not assign more than the user need.
    You should periodically review, perhaps every 90 days, the permissions assigned
    to users to be sure that they aren''t allowed to access any more than they need
    to. You can assign rights to files and directories by using the `chmod` command
    from the command line.


