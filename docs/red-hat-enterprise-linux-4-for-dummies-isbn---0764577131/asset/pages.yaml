    packages that are installed on your system. At some point in your system administration
    duties, you''ll need to install new packages or modify and remove already installed
    packages. In this chapter, you can read about the Package Manager application
    that you can use to install and remove packages that are part of the Enterprise
    Linux installation. You will also discover how to find other packages that you
    can install, either from binary files or source files that you can compile and
    install on your system.


    # ## Managing Packages with the Red Hat Package Manager


    Enterprise Linux provides you with a graphical utility — the Red Hat Package Manager
    — that you can use to install new applications or remove existing system applications.
    The Package Manager supplied with Enterprise Linux is used only to add or remove
    applications that were included with the original Enterprise Linux installation
    disks. For installing other packages, see the section, “Installing Applications
    from Compressed Zip Files,” later in this chapter. You open the Red Hat Package
    Manager by choosing Applications>System Settings>Add/Remove Applications. The
    Package Management dialog box, as shown in Figure 18-1, appears.'
