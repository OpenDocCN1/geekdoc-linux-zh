    ```

    mv /home/terry/testfile /tmp

    ```


    You can use the mv command to rename files, either in the same directory or when
    you move the file to another directory. For example, to change the name of the
    file testfile to newtestfile in the same directory, enter the following command:


    ```

    mv /home/terry/testfile newtestfile

