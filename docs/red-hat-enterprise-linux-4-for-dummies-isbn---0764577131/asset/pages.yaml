  md: '# 148 Part III: Securing Your Enterprise Linux System


    +   - Assigning rights

    - Setting concurrent logins

    - Setting account properties

    - Setting password and account expiration


    These are discussed in the next sections.


    # Creating accounts


    As a system administrator, one of your responsibilities is creating user accounts.
    Accounts usually comprise the user''s first or last name — or some of both — but
    they can be anything that the administrator wants. You should try to make the
    username easy for the user to remember


    In many cases, you might create special accounts for users who have additional
    level privileges. A good example of a special user account is the root account.
    Everyone knows that the root user is the most powerful user on the system, and
    anyone who wants to break into your system already has the username of that most
    powerful user. So, a good idea for security perspective is to use a name that
    does not describe the functions of the user. Instead of giving a system administrator
    name *sysadmin*, use a different name. You can still give system administrator
    rights to the user, but the user-manager won''t give it away.


    Assigning users, which includes assigning passwords and their properties, is covered
    in Chapter 17.


    # Assigning passwords


    Assigning passwords to accounts that you create is another job of the system administrator.
    You should always keep the following rules in mind when you are assigning passwords
    to your users:


    +   - Use strong passwords. Passwords should be a combination of alphanumeric
    characters and special characters. Good education is the key to your users using
    strong passwords.


    +   - Make passwords easy for users to remember. If passwords are too hard for
    your users to remember, they will change them to something easy to break.


    +   - Make passwords difficult for others to guess. Pass should be difficult for
    other to guess. Don''t use birthdays, proper names, license plate numbers, or
    Social Security numbers.


    +   - Never write down a password. Be sure that you or your users write down passwords
    on paper.'
