    # Changing file permissions


    By changing file permissions, you can prevent unauthorized users from seeing or
    changing information in files and directories. Knowing how to change file permissions
    is one of the most basic requirements for running a secure system. The command
    for changing file permissions is chmod. The basic syntax for the command is


    ```

    chmod options filename

    ```


    The options that you use determine the permissions for the specified file and
    are shown here. You can set permissions for three types of users:


    +   - u: Owner of the file

    - g: Group of the file

    - o: Others who can use the file

    - a: All


    With these letters, you can add, remove, or assign permissions (respectively)
    using a + (plus sign) to add, a - (minus sign) to remove, and a = (equal sign)
    to assign following letters. Are you confused yet? Here are some examples to make
    it clearer.


    Suppose you create a file in your home directory testfile. You want to give yourself
    rwx, write (w), and execute (x) permissions and also remove permissions for the
    group and others. Enter the following command:


    ```

    chmod uwx,go+rwx testfile

    ```


    The preceding command adds rwx to the user (u+rwx) and removes rwx (go-rwx) from
    the group and others. A list of the file using -l shows


    | -rwx------ | 1 terry | 0 Jul 20 13:04 testfile |


    Look at one more example. You now want testfile to be readable and writable only
    by, the owner of the file. Enter the following command:


    ```

    chmod u-x,go+r testfile

    ```'
