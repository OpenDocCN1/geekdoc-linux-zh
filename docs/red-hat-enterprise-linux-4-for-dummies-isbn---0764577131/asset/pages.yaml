  md: '# # Chapter 4

    # Exploring the File System and Command Shell


    +   In This Chapter

    - Examining the file system structure

    - Commanding the shell

    - Commonly used shell commands

    - Writing shell scripts


    Aone who has used a computer, regardless of the operating system that the computer
    uses, knows that information stored on the computer is organized by files and
    directories into a hierarchical structure typically known as a *file system*.
    Red Hat Enterprise Linux is no different in this respect: its file system is also
    organized similarly. However, you need to be aware of some significant differences
    when comparing an Enterprise Linux file system with the most widely used file
    system in Windows. In this chapter, I explain the Enterprise Linux file system
    organization and how it differs from Windows. I also show you how to use the command
    shell to navigate the file system and perform many routine file system tasks,
    such as creating and deleting files and directories as changing file permissions
    and ownership.


    # ## Examining the Enterprise Linux File System Structure


    If you''ve used Windows (and most of us have), the biggest difference you''ll
    notice when looking at the Enterprise Linux file system structure is that no drive
    letters are shown in a file system listing. For example, you won''t find the typical
    C drive as the hard drive, A drive as the floppy drive, or D drive as the CD drive.
    All devices in Enterprise Linux, including disk drives, are just a part of the
    file system. Figure 4-1 shows a typical Enterprise Linux file system.'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# 62 Part I: Becoming Familiar with Enterprise Linux


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_79_0.png)


    Figure 4-1: The structure of the Enterprise Linux file hierarchy.


    The Enterprise Linux file system is based on the standards outlined in the Filesystem
    Hierarchy Standard (FHS). All Unix and Unix-based systems, like Enterprise Linux,
    follow this standard. The FHS provides specific requirements for placement of
    files in the directory structure. Placement is based on the type of information
    contained in the file. The two basic categories of file information are


    +   * Shareable and unsharable

    * Shareable files are files that can be accessed by other hosts.

    * Unsharable files can be accessed only by the local system.


    +   * Variable or static

    * Variable files contain information that can change at any time on their own,
    without anyone changing the file. A log file is an example of a variable file.

    * Static file contains information that does not change unless a user changes
    it. Program documentation and binary files are examples of static files.


    Although you don''t need to know the complete details of the FHS to work with
    the Enterprise Linux file system, if you want more information about the FHS standard,
    including the complete standard, go to `www.pathname.com/fhs.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# Chapter 4: Exploring the File System and Command Shell


    Understanding the organization or layout of the Enterprise Linux file system is
    one of the most important aspects of system use and administration. You can see
    it by looking at the tree structure on the left side of Figure 4-1, the Enterprise
    Linux file system contains a single top-level directory that is identified by
    a single / (forward slash character) and is known as the root directory or root
    of the system. Take a look at the Location of the file browser, and you will see
    the single forward slash that shows you are in the root directory of the system.
    The root system contains a number of other directories, and each of these directories
    has a specific function as specified by the FHS. According to the FHS, the / directory
    must contain or have links to the following directories.


    Not all the directories shown in Figure 4-1 are shown in the list. The directories
    are not initially empty.


    Unlike some operating systems, Enterprise Linux is case-sensitive. I think it
    is a really good idea to always use lowercase for all my filenames. By doing this,
    I will never have to remember whether I used uppercase or lowercase: know that
    the name is always lowercase.


    +   - bin: This directory contains command files for use by the system administrator
    or other users. Note: The /bin directory cannot contain subdirectories.

    - boot: The /boot directory contains the system kernel, which is the core of the
    Enterprise Linux operating system. This directory also contains files related
    to booting the system.

    - dev: This directory contains files with information about devices, either hardware
    or software, on the system.

    - etc: The /etc directory and its subdirectories contain most of the system configuration
    files. If you have a Windows System installed on your system, the X11 directory
    is located here. Networking-related configuration files are located in the sysconfig
    subdirectory.

    - home: This directory contains the directories of users on the system. Subdirectories
    of /home are created and named automatically for each user who has an account
    on the system. For example, my home directory is identified as /home/terry.

    - lib: The /lib directory and its subdirectories contain shared system files and
    kernel modules.

    - media: This is the location of the mount point for temporary file systems, such
    as a floppy or CD drive.


    Before any file system is used by Enterprise Linux, it must first be mounted.
    Mounting a file system requires that it be a location on the / file system that
    can be referenced. Master administrators use the /mnt directory for this purpose.
    Mounting drives and other file systems will be explained later in the section,
    "Mounting and unmounting drives."'
  merge: -1
