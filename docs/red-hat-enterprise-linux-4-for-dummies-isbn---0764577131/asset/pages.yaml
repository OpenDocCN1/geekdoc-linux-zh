  md: '# Chapter 12: Configuring and Managing DNS Servers


    # The reverse zone file


    The previous example shows a sample zone file that uses the domain name. This
    method is called forward address resolution because it uses a name to find an
    IP number and is the most common use of reverse resolution.


    You can also find a name from an IP number, and this is called reverse address
    resolution. All you need to do is enter the IP address, and the server returns
    the domain name. Reverse address resolution requires the use of a reverse zone
    file. Listing 12-3 shows a sample reverse zone file.


    # Listing 12-3: A Typical Reverse Lookup Zone File


    | | | | |

    |---|---|---|---|

    | | | SOA | localhost. root.localhost. (

    | | | 199702700 : Serial |

    | | | 28800 : Refresh |

    | | | 14400 : Retry |

    | | | 360000 : Expire |

    | | | 86400 ) : Minimum |

    | | IN NS | localhost. |

    | 1 | IN PTR | localhost. |


    # Configuring a Caching DNS Server


    The previous sections show which files need to be configured and what information
    needs to be placed in them, which prepares you to set up your domain name servers.
    In this section, you set up a caching server. As stated earlier, you use three
    files in all types of server configurations. In a caching-only server, these three
    files make up the entire configuration. Fortunately, the default installation
    of BIND on Red Hat Enterprise Linux creates the configuration files needed for
    a caching server, but it is always a good idea to look at the files to be sure
    that they are correct.


    By verifying the zone information in /etc/named.conf. When you installed the BIND
    package, the /etc/named.conf file was created and it contained zone information
    for your localhost, but you need to check it to be sure. You are looking for two
    zones: one indicated by a pointer, referencing the file named.ca, and one shown
    as 0.0.127.in.addr.arpa, referencing named.local.


    Next, you need to check the configuration of the /var/named/named.local file.
    This file contains the domain information for the localhost and is typically created
    when BIND is installed. You usually don''t have to make any changes to /var/named/named.local.
    This domain is a reverse domain that it is used to map the loopback address 127.0.0.1
    to the localhost name.'
