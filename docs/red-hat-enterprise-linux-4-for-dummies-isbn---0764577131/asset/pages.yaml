  md: '# Chapter 11: Intrusion Detection and Prevention


    # 165


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_182_0.png)


    To get a list of ports and their uses, go to


    ```

    www.iana.org/assignments/port-numbers

    ```


    To begin scanning your system, follow these steps:


    +   1. In the Target(s) field (refer to Figure 11-1), enter the IP address or
    host and domain name of the system you want to scan.


    **Hint:** Accept the default or enter localhost.


    +   2. Click the arrow down in the Scan Type field and choose one of the following
    options:


    +   *Connect Scan:** This is the most basic form of TCP scanning. The system call
    provided by your operating system is used to open a connection to every commonly
    used port on the machine. If the port is listening, `connect()` will succeed;
    otherwise, the port is unreachable.


    +   *SYN Scan:** In this scan, you send a SYN packet — like you are opening a
    real connection — and wait for a response. A SYN/ACK response means the port is
    listening, and an RST response means the port is not listening. If a SYN/ACK is
    received, an RST is sent to tear down (close) the connection. Most sites will
    not log this type of scan. This is the default scan for the root user.


    Whenever one system (call it A) attempts to connect with another system (call
    it B) using the TCP protocol, it sends a packet — a SYN (synchronize) packet,
    requesting a connection. System B responds with a SYN/ACK packet, the connection
    is established. When system A sends an RST (reset) packet, it tells B to close
    the connection.


    +   *ACK Stealth Scan:** This scan sends an ACK packet to the ports specified.
    If an RST comes back, the port is listed as unlisted, meaning there is no firewall
    filtering traffic. If nothing is returned or if an ICMP (Internet Message Protocol)
    unreachable message is returned, the port is used to transmit messages about events
    occurring on TCP/IP networks. This type of scan can be used to determine firewall
    rules in place the scanned system.


    +   *FINACK Scan:** This scan sends a FIN (finished) to the specified system.
    A closed port is required to reply to probe your probe packet with an RST, and
    an open port must ignore the packets. These scans are designed to be even more
    undetectable by the target systems.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_182_1.png)'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# 166 Part III: Securing Your Enterprise Linux System


    +   - FIN Stealth Scan: This scan sends a FIN to the specified system. A closed
    port is required to reply to your probe packet with an RST, and an open port must
    ignore the packets. These scans are designed to be even more nonectable by the
    target systems.

    - NULL Stealth Scan: This scan type turns off flags and doesn''t send any packet.
    A closed port is required to reply to your probe packet with an RST, and an open
    port must ignore the packets. These scans are designed to be even more nonectable
    by the target systems.

    - Xmas Stealth Scan: This scan type sends a FIN, an URG (urgent pointer flag set,
    indicating priority of packet), and a PUSH flag. The PUSH flag means that the
    sender called the push operation, telling the receiver that it should notify the
    receiving process. A closed port is required to reply to your probe packet with
    an RST, and an open port must ignore the packets. These scans are designed to
    be even more nonectable by the target systems.

    - TCP Window Scan: This scan likes the ACK scan in that it finds filtered and
    unfiltered ports. The difference between the Windows and an ACK scan is sometimes
    the Windows scan can detect open ports.

    - UDP Port Scan: This scan type is used to determine whether User Datagram (UDP)
    ports are open on the target host.

    - IP Protocol Scan: This scan type is used to determine whether IP protocols are
    supported by the scanned system.

    - Ping Sweep: Choosing this scan sends an ICMP ping request to the targeted hosts
    but will not any other type of scan.

    - Host List: This scan is used to get a list of IP addresses or host. No scanning
    is done on any of the listed systems.

    - FTP Bounce Attack: This scan type looks for an error in the FTP protocol that
    allows a user to send data from an FTP server to anywhere.

    - Idle Scan: This scan type lets you scan a target but send the IP address of
    another system as the source of the scan to the target.


    3. For this example, select the SYN Stealth Scan default type.

    This scan does not implement a full connection to the scanned system and is not
    detectable by most systems.


    4. For Scanned Ports, accept the default choice.

    This scans the most commonly used ports.


    5. Click the Scan button next to the Target(s) field.

    The scan begins. After a few seconds, your results appear. Figure 11-2 shows the
    results of running SYN Stealth Scan on my system.'
