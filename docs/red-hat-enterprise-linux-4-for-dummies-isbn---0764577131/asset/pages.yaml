    place to get specific information for your card and configuring under Enterprise
    Linux is the ALSA Web site. You can find information about nearly every sound
    card there as well as specific instructions for configuring the card. With a little
    effort off your part and some reading at the ALSA site, you can get your sound
    working.


    # Unable to Unmount a Drive


    Whenever you work with a floppy disk or CD-ROM, you have to mount the disk before
    you can read or write to it. After you finish, you no longer need the drive mounted.
    In fact, if you want to remove the CD from the drive, you must unmount the disk,
    or the CD-ROM drive won''t let you eject the disk. Look at an example. You finish
    using the CD-ROM drive, and you try to unmount the drive using the umount command,
    as follows:


    ```

    [root@terry cdrom]# umount /mnt/cdrom

    ```


    The system returns a message telling that the drive is busy


    ```

    umount: /mnt/cdrom: device is busy

    ```


    Although this is a real easy problem to solve, it is a real source of frustration
    for a new user. You can see from the example prompt that the current working directory
    is cdrom. If you use the pw command


    ```

    [root@terry cdrom]# pw

    ```'
