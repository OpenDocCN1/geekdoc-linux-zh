  md: "# Chapter 12: Configuring and Managing DNS Servers\n\nThese options are the\
    \ same as those shown in the options statement section and have the same function\
    \ here. When listed in the options section, they apply to all zones, but if listed\
    \ with a specific zone, they apply only to that zone. Settings listed in a specific\
    \ zone section override those globally set in the options statement.\n\n# Zone\
    \ files\n\nZone files contain resource records (RR) about IP addresses. A typical\
    \ zone file is shown in Listing 12-2.\n\n+   **Listing 12-2:** A Zone File Is\
    \ Used to Provide Information about a DNS Server\n\n```\n@ IN SOA localhost (\
    \ : serial\n      3H : refresh\n      15M : retry\n      1W : expiry\n      1D\
    \ ) : minimum\nlocalhost IN NS localhost\nIN A 127.0.0.1\n```\n\nA zone file contains\
    \ many types of RRs, which are listed in the order in which they generally appear\
    \ in the zone files, and explained next.\n\n# SOA — Start of Authority\n\nThe\
    \ Start of Authority (SOA) is the first line in the zone file. The SOA identifies\
    \ the name as the authoritative source for information about this domain. Each\
    \ zone has only one SOA, and it contains the following data:\n\n```\n@ IN SOA\
    \ mail.tacttechnology.com. /(\n      2000052101 :Serial\n      8h :Refresh\n \
    \     2h :Retry\n      1w :Expire\n      1d :)Minimum TTL\n```\n\nThe first character\
    \ in the SOA line is a special symbol that means “to look at this domain.” IN\
    \ means Start of Authority.\n\nIn this example, the authoritative server for this\
    \ domain is main.tacttechnology.com., and mail.tacttechnology.com., is the e-address\
    \ of the administrator. Note the trailing period after the domain name: If the\
    \ period is not included, the domain name is appended to the entry."
  merge: -1
  pgno: 210
- img_proc: true
  md: '# 194 Part IV: Configuring Your Enterprise Linux Internet Services


    The opening parenthesis enables the first line to be extended so that anything
    between the opening and closing parenthesis is considered one line.


    The information within the parenthesis is passed to other name servers, secondary
    masters, which use this information to update their records. The line containing
    200052101 : Serial is the serial number of the file. Secondary servers compare
    this number with their stored information. If the numbers are the same, the information
    has not changed and it is not necessary to download this file. If the serial numbers
    are different, the file is downloaded to update the information in the secondary
    server. The serial number can be any number desired, as long as it can be incremented
    to a revision to the file. The semicolon indicates what follows to the end of
    the line is a comment.


    +   - Refresh: This is the amount of time the server should wait before refreshing
    its data.

    - Retry: This is the amount of time the server should wait before attempting to
    the primary server if the previous attempt failed.

    - Expire: This means that if the secondary is unable to contact a primary master
    during the specified period, the data expires and is purged.

    - TTL: This specifies the Time to Live for the data. This parameter is intended
    for caching name servers and tells them how long to hold the data in their caches.


    All of the information contained by the SOA may be placed on one line, but it
    is usually shown as previously. The order of the items is significant in the SOA
    header. Following the SOA header information are lines containing additional information.
    Of these lines, which contain the abbreviations NS and A, are shown in Listing
    12-2. The following list explains the means of these abbreviations:


    +   - NS: Name servers in this domain.

    - A: The IP address for the name server.

    - PTR: Pointer for address mapping.

    - CNAME: Canonical name, the real name of the host.

    - MX: The Mail exchange record. The MX record specifies the mail servers for the
    domain. If more than one MX server is present, the address with the lowest number
    receives the highest priority.

    - TXT: Text information. You can enter descriptive information here.

    - WKS: Well-known service. You can enter descriptive information here.

    - HINFO: Host Information usually shows type of hardware and software.'
  merge: -1
  pgno: 211
