    # Changing file group and owners


    Sometimes you need to change the user or group that owns a file. Sometimes a program
    that you want to run requires that the program runs as a particular user or group.
    For example, you might be running a Web server that requires the file owner is
    the Apache user. In this example, look at the file test that is in my home directory.
