    Enable SELinux?


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_372_0.png)


    The first choice that you make from this dialog box is whether you want to enable
    the firewall or no firewall. By default, the installation program selects to enable
    the firewall for you. If you choose to enable the firewall, only connections that
    are in response to outbound requests are accepted. You can also select individual
    services that are allowed through the firewall. The services that you can allow


    +   - Remote Login (SSH): If you allow remote access to your server through the
    `ssh` protocol, you should enable this option.


    +   - Web Server (HTTP, HTTPS): If you plan to run a Web server, you should choose
    this option. You do not need to choose this option to use a browser to view Web
    sites.


    +   - File Transfer (FTP): If you plan to run an FTP server, you should enable
    this option. You do not need to choose this option to retrieve files from FTP
    sites.


    +   - Mail Server (SMTP): If you are going to run an e-mail server, you should
    enable this option. You do not need to enable this option to retrieve mail from
    an ISP.'
  merge: -1
  pgno: 372
- img_proc: true
  md: '# 356 Part VII: Appendixices


    If you choose the No Firewall option, all connections are allowed and no security
    checking is done on your system. Select No Firewall only if you have absolute
    faith in the security of your network.


    Choosing to enable the firewall is always safest, especially if you will be connecting
    directly to the Internet.


    The final configuration step on the Firewall configuration dialog box concerns
    SELinux. SELinux was developed by the National Security Agency (NSA) to provide
    enhanced security based on access control specified by a security policy. You
    can choose one of three states for SELinux:


    +   **Disable**: If you select this option, SELinux is not enabled on your system
    and there is no enforcement of a security policy.


    +   **Warn**: Choosing this option puts a security policy in place, but the policy
    is not enforced. Only warnings about possible security violations are noted. If
    you plan to use SELinux, this option provides a good basis for determining how
    the security policy would affect the operation of your system.


    +   **Active**: This state applies full enforcement of the SELinux policy. You
    should choose this option only if you are sure that the policy will not affect
    your system operation.


    You can read more about SELinux by visiting the NSA Web site at www.nsa.gov/selinux.


    After you make your configuration choices, click Next to continue.


    # Configuring additional languages


    Next you can choose additional languages to install on your system. Simply the
    box in front of any other languages you want to install and then click Next to
    continue.


    # Setting the time zone


    Select the time zone for your system. The installation program shows you the Time
    Zone Selection screen from which you can select the time zone, either in terms
    of a geographic location or as an offset from the Coordinated Universal Time (UTC).'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# Appendix A: Installing Red Hat Enterprise Linux 357


    You select your location from a long list of countries and regions. If you live
    on the East Coast of the United States, for example, select USA/Eastern.


    # Setting the root password


    After completing time zone selection, the installation program displays the Account
    Configuration screen, in which you set the root password.


    The root user is the **superuser** in Enterprise Linux. Because the user can do
    anything in the system, you should assign a password that you can remember but
    that others cannot guess easily. Typically, make the password at least eight characters
    long, include a mix of letters and numbers, and (for good measure) throw in some
    special characters such as + or *. Remember the password is also case-sensitive.


    Type the password on the first line and reenter the password on the next line.
    Each character in the password appears as an asterisk (*) on the screen for security
    reasons. Both entries must match before the installation program accepts the password.
    The installation program displays a message when it accepts the root password.


    # Selecting the package groups to install


    After you complete the key configuration steps, the installation program displays
    a screen from which you can choose to install the default Red Hat Enterprise Linux
    packages or choose to select additional groups that you want to install. After
    you select the package groups, you can take a break while the Red Hat installation
    program formats the partitions and copies all selected files to those partitions.


    Figure-7 shows the Package Group Selection screen with the list of groups that
    you can elect to install. An icon, a descriptive label, and a check box for enabling
    or disabling identify each package group.


    Some of the components are already selected, as indicated by the check marks in
    front of the package name. This is the minimal set of packages that Red Hat recommends
    for installation for the version of Enterprise Linux (Desktop, WS, ES, or AS)
    that you are installing. You can, however, choose to install any all of the components.
    Use the mouse to move up and down in the scrolling list and then click an entry
    to select or deselect that package group.'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# 358 Part VII: Appendices


    # Package Group Selection


    Select the package (application) groups that you want to install. Select a package
    group, click on the box beside it.


    Once a package group is selected, click on Details to see which packages are installed
    by default and to add or remove optional packages from group.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_375_0.png)


    | Desktops |

    | X Window System [0/41] |

    | Install this group of packages to use the graphical (X) interface. |

    | GNOME Desktop Environment [41/44] |

    | GNOME is a powerful, graphical user interface which includes a panel, desktop,
    system icons, and a graphical file manager. |

    | KDE (K Desktop Environment) [0/14] |

    | KDE is a powerful, graphical user interface which includes a panel, desktop,
    system icons, and a graphical file manager. |

    | Applications |

    | Editors [0/5] |

    | Sometimes called text editors, these are programs that allow you to create and
    edit files. These include Em and Vi. |

    | Engineering and Scientific [0/7] |

    | This group includes packages for performing mathematical and scientific computations,
    as well as unit |

    | Total install: 1,558M |


    > In an actual Red Hat Linux installation, you install exactly those groups that
    you need. Each package group requires specific packages to run. The Red Hat installation
    program automatically checks for package dependencies and shows you a list of
    packages that are required but you have not selected. In this case, you should
    install the required packages. You should install only packages that you think
    you need immediately after starting the system. Installing too many packages could
    expose your system to security risks. You can always add packages later.


    Because each package group is a collection of many different Red Hat packages,
    the installation program also gives you the option to select individual packages.
    If you select the Individual Packages item (that appears below the list in Figure-A-7)
    and then click Next, the installation program takes you to other screens where
    you can select individual packages. If you are installing Red Hat Enterprise Linux
    for the first time, you really don''t need to go down to this level of detail
    to install specific packages. Simply pick the components that you think you need
    from the screen shown in Figure-A-7. After you select the components you want,
    click Next to continue with the rest of the installation.'
  merge: -1
  pgno: 375
- img_proc: true
  md: '# Appendix A: Installing Red Hat Enterprise Linux 359


    # Completing the Installation


    After you complete the key configuration steps and select the components to install,
    the installation program presents you with the About to Install dialog box, as
    shown in Figure A-8.


    This dialog box tells you that the installation begins when you click Next. You
    will still have the opportunity to abort the installation at this point because
    nothing has been written to the drives in your system. If you''re sure of all
    your configuration choices and want to continue with the installation, click Next.


    Depending on the packages you selected for installation and the speed of your
    system, the installation can take 20 minutes or longer. You can take a break during
    the installation, but be sure to check the progress occasionally because you will
    need to change CDs when prompted.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_376_0.png)


    Figure A-8: The About to Install dialog box gives you one more chance to change
    your mind.'
