  md: '# Chapter 8


    # The Network File System


    # In This Chapter


    +   - Explaining Network File System (NFS)

    - Configuring and managing an NFS server

    - Configuring an NFS client


    As you can see from the title of this chapter, NFS is an acronym for Network File
    System. So now you know what the abbreviation means, but just what exactly is
    NFS?


    NFS is a protocol that was developed by Sun Microsystems to allow computers to
    access shared directories across a network yet as if those directories were on
    the computers'' local file system. NFS is widely used by systems running Unix
    and Unix variants, like Enterprise Linux, but it can also be used by computers
    running different operating systems, such as Windows or Mac OS.


    In this chapter, I show you how to configure an NFS server to share some directories
    to other computers on the network. You can also read how to configure an NFS client
    to access the directories that you share from the NFS server.


    # Configuring and Managing an NFS Server


    In order for the NFS server to be able to share files and directories with other
    computers on the network, you must tell it which directories and files to share.
    The term used to express the sharing of files and directories from an NFS server
    is exporting. The directory or directories that is/are exported shares. Red Hat
    Enterprise Linux has a graphical tool — the NFS Server'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# Part II: Configuring Your Enterprise Linux Local Area Network


    Configuration tool — that you can use to configure the server and choose the directories
    that you want to export. You can use the graphical tool if you have an X Server
