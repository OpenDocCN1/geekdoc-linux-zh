    **Figure 16-4:** The Retrieval/Installation tab.


    # ### The Package Retrieval Options are


    +   * **Do Not Install Packages After Retrieval.** By default, packages are automatically
    installed after they are retrieved. If you enable this option, packages are retrieved
    to the specified directory but not installed.


    +   * **Do Not Upgrade Packages When Local Configuration File Has Modified.**
    If you have manually modified configuration files for packages on your system,
    these packages are not displayed by default. If you disable this option, the packages
    are displayed.


    +   * **Retrieve Source RPM Along with Binary Package.** By default, the source
    Red Hat Package Manager (RPM) is not downloaded with the binary version of the
    package. By enabling this option, you retrieve the source of the RPM.


    The Package Verification Options has one choose:


    +   * **Use GPG to Verify Integrity.** By default, for security purposes, the
    packages are verified to ensure they contain the Red Hat GPG signature. If you
    disable this option, the security check is not performed.


    GPG stands for PGP Privacy Guard, which is the open source-replacement for PGP.
    PGP (Pretty Good Privacy) was developed in the mid-1990s by Phil Zimmermann to
    provide data encryption. GPG was developed to replace PGP because PGP contained
    a patented algorithm and its use was restricted. GPG can be freely used without
    concern for patented information.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_274_1.png)'
