  md: '# 344 Part VII: Appendixes


    # # Hard drive


    Red Hat Enterprise Linux supports any hard drive that your PC''s basic input/output
    system (BIOS) supports as long as the system BIOS supports the hard drive without
    any additional drivers. To be able to boot Red Hat Enterprise Linux from a large
    hard drive (LHD) with more than 1,024 cylinders, the Linux Loader (LILO), the
    Linux kernel, and the LILO configuration files must be located in the first 1,024
    cylinders of the drive. This is because the Linux Loader uses the BIOS to load
    the kernel, and the BIOS cannot access cylinders beyond the first 1,024.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_361_0.png)


    For drives connected to your PC through a Small Computer Interface (SCSI) controller
    card, Red Hat Enterprise Linux must have a driver that enables the SCSI controller
    to access and use the hard drive.


    As for the size (storage capacity) of the drive, most new systems seem to have
    8–10GB of capacity. You should buy the highest capacity drive that you can afford.


    # # Floppy disk drive


    Floppy drivers use the PC''s BIOS to access the floppy disk drive, so any floppy
    disk drive is compatible with Red Hat Enterprise Linux. The Red Hat Enterprise
    Linux installation program can be started from the CD-ROM if your PC has one and
    boot from it. If not, you have to boot Red Hat Enterprise Linux from a floppy
    disk drive during the installation, you need a high-density 3.5-inch (1.44MB capacity)
    floppy disk drive. You can also booting from a floppy if you can boot your PC
    under MS-DOS (not an MS-DOS window under Windows 95/98/NT/Me/2000/XP), and you
    can access the CD-ROM from the DOS command prompt.


    # # Keyboard and mouse


    Red Hat Enterprise Linux supports any keyboard that already works with your PC.
    The mouse, however, needs explicit support in Red Hat Enterprise Linux. You need
    a mouse to configure and run XFree86, the X Window System for Linux. Red Hat Enterprise
    Linux supports most popular mice, including the commonly found PS/2-style mouse.
    Red Hat Enterprise Linux also supports touchpad devices, such as the ALPS GlidePoint,
    as long as they are compatible with one of the supported mice.'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Appendix A: Installing Red Hat Enterprise Linux 345


    # SCSI controller


    The Small Computer System Interface is a standard way of connecting many types
    of peripheral devices to a computer. SCSI is used in many kinds of computers,
    from high-end Unix workstations to PCs. Typically, you connect hard drives and
    CD-ROM drives through a SCSI controller. To use a SCSI device on your PC, you
    need a SCSI controller card that plugs into one of the slots on your PC''s bus.


    A single SCSI controller supports device addresses 0–7, which usually assigned
    to the controller itself. This means you can connect up to seven SCSI devices
    to your PC. (With SCSI 2, you can connect up to 14 devices.) If you want to access
    and use a SCSI device under Linux, you have to make sure that Red Hat Enterprise
    Linux supports your SCSI controller card.


    # CD-ROM drive


    CD-ROM drives are popular because each CD can hold up to 650MB of data, which
    is a relatively large amount of storage compared with a floppy disk. CDs are reliable
    and inexpensive to manufacture. Vendors use a CD to distribute a large amount
    of information at a reasonable cost.


    # Sound card


    If you are configuring a server, you probably aren''t too interested in playing
    sounds. However, with Red Hat Enterprise Linux, you can play sound on a sound
    card to enjoy multimedia programs and games. If you have a sound card, you can
    also play audio CDs. Nearly all sound cards available today are supported.


    # Network card


    A network interface card (NIC) is necessary if you connect your Red Hat Enterprise
    PC to a local area network (LAN), which is usually an Ethernet network. If you
    are configuring a server, you certainly want to configure a network card. Red
    Hat Enterprise Linux supports a variety of Ethernet network cards. ARCNet and
    IBM''s token ring network are also supported. Check the hardware list on the Red
    Hat site to see whether your NIC is supported. Nearly all NICs currently in use
    are supported.'
  merge: -1
