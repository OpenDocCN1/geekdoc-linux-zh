    # Maintaining E-Mail Security


    Do you think you have nothing to hide? Maybe you don''t, but e-mail security is
    always a privacy issue even if you aren''t mailing credit card numbers or'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# 218 Part IV: Configuring Your Enterprise Linux Internet Services


    corporate secrets. Using Secure Multi-Purpose Internet Mail Extensions (S/MIME)
    for security is only a first step in protecting your users and yourself. S/MIME
    is a protocol used to add digital signatures and encryption to standard MIME messages.
    To find out more about S/MIME, go to www.rsasecurity.com/rsalabs/node.asp?id=2292.


    # Protecting against eavesdropping


    Your message goes through more computers than just yours and your recipient''s
    because of store and forward techniques. All a hacker has to sniff through your
    mail is a packet sniffer program. A packet sniffer is intended to be a tool that
    network administrator uses to record and analyze network traffic, but the bad
    guys use them. Dozens of free packet sniffing programs are available on the Internet.
    One program that I have used and like is called Snort. You can find it at www.snort.org.


    # Using encryption


    Cryptography isn''t just for secret agents. Many e-mail products enable your messages
    to be encrypted (coded in a secret pattern) so that only you and your recipient
    can read them. Lotus Nodes provides e-mail encryption, for example.


    # Using a firewall


    If you receive mail from people outside your network, you should set up a firewall
    to protect your network. The firewall is a computer that prevents unauthorized
    data from reaching your network. For example, if you don''t want anything from
    ispy.com to penetrate your net, put your net behind a firewall. The firewall blocks
    out ispy.com messages. If you work on a computer dialed to an ISP, you can still
    install a firewall. Several vendors provide personal firewalls, and some of them
    are free if you don''t want a lot of bells and whistles.


    # Don''t get bombed, blamed, or spoofed


    Bombing happens when someone continually sends the message to an e-address either
    accidentally or maliciously. If you reside in the U.S. and you receive 200 or
    more copies of the message from the same person, you can report the bomber to
    the FBI. The U.S. Federal Bureau of Investigation has a National Computer Crimes
    Squad in Washington, DC, telephone +1-202-325-9164.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Chapter 13: Configuring and Managing an E-Mail Server


    Spamming is a variation of bombing. A spammer sends junk mail to many users (hundreds
    and thousands). You can easily be an accidental spammer: For example, if you choose
    your e-mail''s Reply All function and send a reply to a worldwide distribution
    list, you are a spammer.


    Spoofing happens when someone sends you e-mail from a fake address. If spoofing
    doesn''t seem like it could be major problem for you, consider this scenario.
    You get e-mail from a system administrator telling you to use a specific password
    for security reasons. Of course, many people comply because the system administrator
    knows best. Imagine the consequences if a spofer sends this e-mail f the system
    administrator''s e-mail address to all the users on a computer. All of sudden,
    the spofer knows everyone''s password and has access to private and possibly sensitive
    data.


    Spoofing is possible because SMTP does not have authentication capabilities. Without
    authentication features, SMTP can''t be sure that mail is really from the address
    it says it is. If your server enables connections to the SMTP port, anyone with
    a little knowledge of the workings of SMTP can connect to that and send your e-mail
    from a spoofed address. Besides connecting to the SMTP port of a site, a user
    can spoof e-mail by modifying their Web browser interfaces.


    If someone invades your mail system, you should report the intrusion to the Computer
    Emergency Response Team (CERT). You can find the CERT at www.cert.org.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_236_0.png)


    # Some SMTP cautions


    Dedicated mail servers. First of all, keep the number of computers vulnerable
    to SMTP-based attacks to a minimum. Have only one or few centralized-mail servers,
    depending on the size of your organization.


    Allow only SMTP connections that come from outside your firewall to go to those
    few e-mail servers. This protects the other computers on your network. If your
    site gets spammed, you have to clean up the e-mail servers, but the rest of your
    networked computers are okay.


    If you use packet filtering, you need configure only your e-mail servers. Packet
    filtering analyzes packets based on the source and destination addresses. The
    analysis decides whether to accept the packets and pass them through your networks
    or to reject them as being unsafe. Firewalls often use packet filtering techniques,
    and Enterprise Linux provides the iptables tool for configuring your packet filtering
    firewall.'
