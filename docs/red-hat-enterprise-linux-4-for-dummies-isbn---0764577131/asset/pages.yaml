  md: '# 320 Part VI: The Part of Tens


    # # Optimizing FTP


    The vsftpd server is designed to be a lightweight file server that doesn''t put
    too much strain on your system. There aren''t too many ways to make it faster
    or less demanding on your system, but here are a few tips suggested by the vsftpd
    documentation.


    +   **Simultaneous connections:** You should limit the number of simultaneous
    connections that you allow to the server. Check this setting in the `/etc/vsftpd/vsftpd.conf`
    file.


    +   **Directory size:** You should limit the number of files contained in any
    directory to no more than a few hundred. If necessary, create additional directories
    to spread the number of files across.


    +   **Disable NIS and NIS lookups:** You can change the `/etc/nss.conf` file to
    disable lookups for `passwd`, `shadow`, and `groups`. This prevents the unnecessary
    loading of runtime libraries into the vsftpd memory space.


    # # Optimizing Your Web Server


    The most important system resource used by Apache is RAM. Adding more RAM to your
    system improves the performance of Apache as well as other services. You can also
    use a dedicated Web server that doesn''t need to share system resources with other
    services.


    You can make tweaks to change the performance of your Web server. I list a few
    of them. All the tweaks involving changes to the directives in the `/etc/httpd/conf/httpd.conf`
    file.


    +   **Timeout:** This directive controls how long the server waits before it closes
    a connection. A longer value means that the server might be unavailable to other
    clients until the server times out. The default value is 300 seconds; experiment
    to find the correct value for your system.


    +   **MaxRequestsPerChild:** This directive controls how many requests a child
    process handles before a new child process starts. The default value is 100.


    +   **HostnameLookups:** Set this directive to `Off` to not looking up hostnames,
    your Web server becomes faster.


    +   **IP addresses:** You can use IP addresses rather than hostnames in directives
    that allow them. This avoids having to name resolution to determine your IP address.


    +   **NFS-mounted files:** Don''t use NFS-mounted file systems to hold files served
    by Apache. NFS performance is slower than a local file system.'
