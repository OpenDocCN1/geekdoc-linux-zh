    Command: nmap -sS -sO -O -PT 127.0.0.1


    > WARNING! You should not run indiscriminate port scans on systems that do not
    belong to you. Port scanning is considered by many administrators to be an actual
    attack, and they will not react favorably to your scans.


    # ### Scanning your system ports with nmap


    The most common use of nmap is to scan for open ports. An open port is like an
    open door into your system having open ports is not necessarily a bad thing. For
    example, if you are running a Web server, you will want to have port 80 open because
    this is the default port used by HTTP. You just need to make sure that you have
    only those ports that you need and no more. Some commonly used port numbers and
    their services are


    +   - Port 21: Used by FTP

    - Port 22: Used by SSH

    - Port 25: Used by SMTP

    - Port 53: Used by DNS

    - Port 80: Used by HTTP

    - Port 110:O: Used by POP3'
