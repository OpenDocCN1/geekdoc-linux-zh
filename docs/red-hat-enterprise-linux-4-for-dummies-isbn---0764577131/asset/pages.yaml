  md: '# Part III: Securing Your Enterprise Linux System


    # Keeping your system updated


    Another area that can cause security problems for your system is failing to keep
    it updated. Many users will spend considerable time installing and configuring
    their system until it is just the way they want it to, but then they never download
    and install important system updates that might be specially designed to fix security
    problems. Fortunately, Linux users have access to the Red Hat Network and can
    use the tools provided to keep their system updated.


    Chapter 16 explains the Red Hat Network and how to keep your system updated.


    # Implementing Network Security


    Whether your systems are part of a LAN that is not accessible from the outside
    or whether they are open to the world, many of the security principles are the
    same. Having strong passwords and proper file and directory permissions are as
    important for host security as they are for network security. In this section,
    I look at securing services that are typically known as Internet services. I also
    take a look at some system services that you can disable to prevent access and
    make your system less vulnerable to intruders.


    # Defining Internet services


    Many of the services that are described as Internet services are typically programs
    run on a system that provide requested services. For example, when you send an
    e-mail, you''re actually requesting that an e-mail server responds to your request
    to send an e-mail. Or when you browse to a Web site, you''re asking a Web server
    for a response to your request.


    The programs that provide these services can be on your own network or located
    at some distant location. The common thread for these systems is that they use
    all the TCP/IP protocol. In short, you can say that an Internet service is any
    service that can be accessed over a TCP/IP-based network through secure or unsecured
    connection. Common secure Internet services are


    +   SSH: Secure Shell is a replacement for Telnet that encrypts all traffic, including
    passwords, via a public/private encryption key exchange protocol. ssh provides
    terminal access to remote computers across TCP/IP networks.'
