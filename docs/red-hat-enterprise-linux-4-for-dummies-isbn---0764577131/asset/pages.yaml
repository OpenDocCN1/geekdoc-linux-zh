    # Removing a user


    To remove a user from your system, do the following:


    +   1. Start the User Manager by choosing Applications:System Settings: Users
    & Groups.


    If you are not logged in as the root user, you are prompted to enter the root
    password.


    +   2. Click the username from the User Name list and then click Delete from the
