  md: '# # Chapter 16


    # # Maintaining Your System with the Red Hat Network


    +   **In This Chapter**

    * Registering your system

    * Configuring the up2date agent

    * Using the up2date agent to keep your system current

    * Accessing the Red Hat Network with a Web browser


    The Red Hat Network is a program that is installed by default when you install
    Red Hat Enterprise Linux. The Red Hat Network software is used to register a profile
    with Red Hat that contains information about your system hardware and the software
    packages installed on your system. Whenever a package update is available, for
    whatever reason, you can receive an e-mail notification from Red Hat as well as
    a visual notification of the update on your desktop.

    This might not sound like much, but think about the many steps involved in keeping
    your system up-to-date with the latest versions of the hundreds of packages that
    are installed on your system. Red Hat Network practically eliminates the need
    for you to search for these packages because you can receive this information
    by e-mail. As registered Red Hat user, you can also search for updates by using
    the up2date agent. With the Red Hat Network, you can now easily keep your system
    running reliably and securely. A few steps are involved in setting up the Red
    Hat Network, but they are well worth the effort. In this chapter, you read how
    to register your system with Red Hat, configure the up2date agent, and then connect
    to updated files. The first step is registering, and this procedure is covered
    in the next section.


    # # Registering Your System


    Before you can begin using the Red Hat Network, you must first register your system
    with Red Hat by using the Red Hat Network registration client.'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# 254 Part V: Maintaining Your Enterprise Linux System


