  md: '# Chapter 9


    # Connecting to Windows PCs Using Samba


    +   **In This Chapter**

    - Installing Samba

    - Configuring Samba

    - Creating Samba users

    - Starting the Samba server

    - Connecting to a Samba server

    - Connecting to a Samba client


    By using the Samba program, you can emulate the Windows file sharing protocol
    and connect your Red Hat Network to a Windows network to share files and printers.
    In this chapter, I show how to install and configure Samba to connect a Red Hat
    Linux network to a Microsoft network.


    In this chapter, I refer to the Red Hat Enterprise Linux as the Samba server and
    the Windows PC as the Samba client.


    # Installing Samba


    Before you can use Samba to connect to the Windows computers, it must first be
    installed on the Linux PC. All current versions of Red Hat Enterprise Linux include
    Samba, but it might not have been installed during the system installation. Even
    if it has been installed, you should always check for the latest version to find
    out whether any problems have been fixed by the latest release and to install
    it if necessary. To see whether Samba is installed on your system, type the following
    at a terminal window:


    ```

    rpm -q samba

    ```'
  merge: -1
