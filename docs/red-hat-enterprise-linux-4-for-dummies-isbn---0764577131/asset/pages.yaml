    # Configuring Sendmail


    Many system administrators think that Sendmail is difficult to configure. If you
    look at its configuration file, /etc/sendmail.cf, this might seem to be the case.
    However, Red Hat Linux provides you with a default Sendmail configuration file
    that works for most sites. Your default Sendmail configuration file accepts mail
    deliveries to your computer, sends mail from your computer, and enables your computer
    to be used as a relay host.


    If you need to edit the configuration file at all, you might need to make a couple
    of minor changes. Here are the key lines that a Red Hat Linux system might want
    to edit in /etc/sendmail.cf. These are not in the order that you find them in
    the file. In Listing 13-1, the tact.com domain is set up to a relay host.


    +   Listing 13-1: Sample Relay Host Configuration

