    # Adding a new user


    Adding a new user to your system is easy when you use the Red Hat Manager. To
    create a new user account, do the following:


    +   1. Start the User Manager by choosing Applications System Settings -> Users
    & Groups.

    2. If you are not logged in as the root user, you are prompted to enter the root
