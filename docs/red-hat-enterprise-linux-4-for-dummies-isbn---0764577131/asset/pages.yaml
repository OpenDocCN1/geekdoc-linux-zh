  md: '# 132 Part II: Configuring Your Enterprise Linux Local Area Network


    If Samba is not installed, the command returns the output stating that Samba is
    not installed. If Samba is installed, the rpm query returns the version of the
    Samba program installed on your system.


    The latest version of Samba (3.0.9 as of this writing) can be obtained at the
    Samba Web site, located at www.samba.org. To install Samba, proceed as follows:


    +   1. Download the file samba-3.0.9.tar.gz.

    2. Extract the file using the following command:

    tar -xvfz samba-3.0.9.tar.gz

    3. Change to the directory containing the extracted files (usually /usr/src) and
    then type

    ./configure

    4. Press Enter and wait for the command prompt to return. From the command prompt,
    type

    make

    5. Press Enter and wait for the command prompt to return.

    6. Type make install from the command prompt and press Enter.


    Samba is installed when the command prompt returns. Now you need to configure
    it. In order for Samba to provide its services, the Red Hat Enterprise PC needs
    to be configured.


    # Configuring the Samba Server


    Before you use Samba to connect with your Windows PCs, it must be configured.
    The several graphical-based programs available for configuring Samba are just
    front-ends that make changes to the Samba configuration file behind the scenes.
    Editing the Samba configuration file is much quicker and easier. The Samba configuration
    file is smb.conf and is typically located in the /etc/samba directory by the installation
    program. A smb.conf file was created during the installation that can be used
    for reference and modification.


    The smb.conf file is divided into several sections, called shares, the names of
    which I show as bracketed subsection titles in Listing 9-1. Shown in Listing 9-1
    is the smb.conf file from one of the computers that I use at school. Following
    the listing to this listing to see what a section looks like as it is described.'
