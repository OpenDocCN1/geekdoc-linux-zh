    +   2. Type in the option usrqota in the options section of the file system

    which you want to enable quotas.


    In Figure 17-7, you can use the usrqota option on the fourth line of the

    file. Your file will be different from mine, but try to find a similar line

    to place the option.


    +   3. Save and close the file.

    4. Run the quotacheck command to set up the quotas needed by the

    system. At a terminal prompt, enter


    ```

    quotacheck /mounted file system

    ```


    where mounted file system is your file system.


    The quotacheck command also gets usage information about the

    mounted file system.


    +   5. Unmount and remount the file system.


