    # Backing up a hard drive with mirrordir


    The mirrordir command (in the mirrordir package) is a tool that enables you to
    easily back up a file system to an additional hard drive. In order to use mirrordir,
    you must first mount the additional hard drive:


    ```

    mount /dev/hdb1 /mnt

    ```


    Then you can back up a given directory to the mounted hard drive using the mirrordir
    command:


    ```

    mirrordir /home /mnt

    ```


    The command backs up the /home directory, which contains all the users'' personal
    files, to the backup hard drive. When executed, the mirrordir command makes the
    contents of the hard drive mounted on /mnt exactly identical to the contents of
    /home. All files are copied, and any files not present in /home are deleted. Subdirectories
    and their files are also copied.


    You must get the order of the arguments correct. If the arguments were reversed,
    the /home directory is overwritten with the contents of the backup hard drive,
    thus erasing valuable data.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_311_0.png)'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# Chapter 19: Backing Up and Restoring Your Files


    To recover lost files if the partition containing /home crashes, the arguments
    to the mirrordir command are simply reversed. The following command overwrites
    the contents of /home with the contents of /mnt:


    ```

    mirrordir /mnt /home

    ```


    Note that any files extant in /home that are not also in /mnt are erased. Therefore,
    mirrordir is not useful for recovering individual files but rather only when the
    entire directory, partition, or drive has been corrupted or erased.


    If /home happens to be alone on a separate partition from the rest of the system,
    you do not need to restore the directory using mirrordir. The partition mounted
    on /mnt (in the example, /dev/hdb1) is an exact copy of the /home directory—and
    so, in this case, an exact copy of that partition. Thus, you can simply modify
    the /etc/fstab file and change the partition mounted under /home to be the partition
    it was mirrored.


