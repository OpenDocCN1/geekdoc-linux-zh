  md: '# Chapter 10: Security Basics


    The The iptables tool uses a series of rules that are collectively known as a
    chain. The iptables program begins with the first rule in the chain and executes
    each in sequence applying the rules as appropriate. Three separate chains are
    examined:


    +   - INPUT chain: Incoming packets are first subjected to the rules in this chain.
    Packets are sent to the next chain unless the packet fits the conditions of a
    rule that specifies DROP or REJECT, in which case they are either dropped or rejected.

    - FORWARD chain: This chain holds rules that apply to packets that your system
    to pass through another system.

    - OUTPUT chain: This chain tells your system what to do with packets that are
    outbound from your system.


    To view the current iptables that was configured using the graphical tool, you
    can use the /sbin/iptables -L command. The command produces the output in Listing
    10-3.


    # Listing 10-3: Output from the iptables -L Command


    | Chain (policy ACCEPT)

    | target prot opt source destination |

    | RH-Firewall-1-INPUT all anywhere anywhere |

    | Chain FORWARD (policy ACCEPT)

    | target prot opt source destination |

    | RH-Firewall-1-INPUT all anywhere anywhere |

    | Chain OUTPUT (policy ACCEPT)

    | target prot opt source destination |

    | Chain-Firewall-1-INPUT (2 references)

    | target prot opt source destination |

    | ACCEPT all anywhere anywhere |

    | ACCEPT all anywhere icmp any |

    | ACCEPT ipv6-crypt anywhere anywhere |

    | ACCEPT ipv6-auth anywhere state |

    | ACCEPT all anywhere RELATED,ESTABLISHED |

    | REJECT all anywhere reject-icmp host-prohibited |


    With the iptables command, you can add to the existing chains or create new ones.
    Here is an example of adding a rule to accept all traffic from your local network.
    Here is an explanation of the syntax of the command follows the:


    ```

    iptables -A INPUT -s 192.168.2.0/24 -j ACCEPT

    ```'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# 160 Part III: Securing Your Enterprise Linux System


    In the preceding command, -A INPUT tells the information that follows to the existing
    INPUT chain. -s 192.168.2.0/24 means from source 192.168.2.0/24, and -j ACCEPT
    tells the command to immediately accept all traffic.


    The basic syntax for most iptables commands is similar to the following line.
    Note: This line is shown split here because of space restrictions but should be
    entered on a single line.


    ```

    iptables [-t <table-name>] <command> <chain-name> <parameter> <option> <parameter>
    <option>

    ```


    Your commands might contain more or less options and parameters than shown here,
    depending on the complexity of your rules. For a complete list of all options
    and parameters available with the iptables command, use the command iptables -h.


