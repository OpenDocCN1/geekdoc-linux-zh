    cp /home/terry/testfile /tmp/newfile

    ```


    This command keeps the original file in the original directory — but in this case,
    with a new name is created in the /tmp directory. You can copy the entire contents
    of a directory, including all subdirectories and their contents, by using the
    -r option with the cp command. For example, to copy my home directory and all
    its subdirectories to the /tmp directory, I type the following command:


    ```

    cp -r /home/terry /tmp

    ```


    Using copy always keeps the original copy in its original location, even if you''re
    copying the file to a new location. If you want to move the file to a new location
    but don''t want to keep the original, use the mv command. For example, suppose
    you want to move the file testfile from your home directory to the /tmp directory
    without changing the name of the file. Use the following command:'
