  md: '# Part I: Becoming Familiar with Enterprise Linux


    # Shell command syntax


    All commands have the same basic syntax, as shown here.


    ```

    command option(s) argument(s)

    ```


    Be sure to pay close attention to this syntax because the most common cause for
    line failures are mistakes in typing the commands. The syntax is command, followed
    by a space, followed by one or more options, another space, and finally one or
    more arguments. The shell uses the spaces to keep the command and options separated.
    Note: Because you can have options that contain spaces, be sure to put any option
    containing spaces inside quotation marks.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_83_0.png)


    Not all commands have options, you might not need to enter them depending on the
    command that you''re using. For example, if you just want a listing of the files
    in your current directory, you can enter ls with no options.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_83_1.png)


    You can always get help by entering the command man followed by the command on
    which you want help.


    # Combining shell commands


    You can pass more than one command at a time to the shell by separating the commands
    with a semicolon. For example, if you want to change the /etc directory and get
    a listing of that directory, you can cd /etc/ls.


    You can also use another character to pass the output from one command into the
    input of a following command. You do this by using a vertical bar | which is also
    known as the pipe symbol. For example, suppose you want to get a count of the
    files in a particular directory. You could use the command


    ```

    ls /etc | wc -

    ```


    This command lists the contents of the /etc directory and then "pipes" the output
    of the ls (list) command into the wc (word count) command, which shows the output
    as the number of lines (-l) in the /etc directory.


    # Redirecting input and output


    Whenever you type in a shell command, the output of the command is displayed on
    your screen monitor. This output is typically referred to stdout. Information
    that you enter at the shell prompt is referred to stdin. By using special characters,
    you can tell the shell to get its input from a different location, usually a file,
    other than stdin. You can also tell the shell to redirect the output to a different
    location, usually a file, other than stdout.'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# Chapter 4: Exploring the File System and Command Shell


    The character that is used for telling the shell to read the stdin from a file
    instead of the keyboard is the <less-than> character. For example, suppose you
    want to sort the contents of your group file. You could use the command


    ```

    sort /etc/group

    ```


    In this case, the sort command reads the /etc/group file as stdin because it was
    redirected to do so by the less-than (<) character. The output of the command
    is displayed on the system monitor, or stdout.


    If you wanted, to redirect the output to stdout to a file by using another redirection
    — this time, the > (greater-than) sign. By entering the command in the following
    example, you could direct the output of the sort command to the file sortedgroup.


    ```

    sort /etc/group > sortedgroup

    ```


    # Using command completion


    With command completion, you can save yourself from any typing. Just type in the
    first few letters of the command you want to use and press Tab twice. The bash
    shows a list of all commands that begin with the letters that you typed. For example,
    if you want to use the grep command, just enter grep and press Tab twice. On my
    system, it will show the following output.


    ```

    [terry@terry] $ gr

    gefer gepjar goff grops

    grep grip grotty

    (output shifted)

    ```


    You can also use the command completion method to complete filenames that you
    might enter after the command. For example, if you have a file in your home directory
    upstart.txt that you want to view with the cat command, you could enter cat /home/terry/ups
    and press Tab. The bash will fill the rest of the filename, saving you some typing
    and reducing the chance of a typo.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_84_0.png)


    If you don''t enter enough characters to uniquely identify the command or filename,
    press Tab again. bash will show all the commands or filenames that begin with
    the letters that you typed.


    # Searching files with wildcards


    If you''ve used MS-DOS or a command window in MS Windows, you know you can use
    wildcard characters when searching your file system. In Enterprise Linux, you
    can also use two of the wildcards, plus an additional one. You can use the following:


    +   * Asterisk: The * (asterisk) character can be used to represent an unlimited
    number of characters. For example, a search for tennis* finds all words beginning
    with tennis and containing any number of characters.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# 68 Part I: Becoming Familiar with Enterprise Linux


    +   - **Question mark: The ? (question mark) character is used to represent one
    character.** For example, a search for *tennis*? finds all words beginning with
    *tennis* and containing one additional character after the s.

    - **Characters inside brackets: Using [...] (characters inside brackets) finds
    any of the characters inside the brackets.** For example, a search for *[Aa]*
    finds all files that begin with *A* or *a* and containing any other characters.


    # Repeating commands with history


    The *bash* has an interesting feature that stores up to 1,000 commands you might
    have used. To view the command history, you can use the **history command**. *bash*
    displays a numbered list of the commands that you''ve used, even commands from
    previous logins.


    To use a command from the list, first type an exclamation point and then the number
    of the command. For example, to use command number 15 from the history list, type
    !!15.


    The easiest way to repeat a command is to press the up-arrow key, *bash* displays
    the commands you''ve used, one at a time, in reverse order. Pressing the down-arrow
    key moves you one command at a time forward through the command history.


    # Frequently Used Shell Commands


    I cannot possibly list all the hundreds of commands that you can use from the
    *bash* shell. You can find commands for working with files and directories, commands
    used to get help, commands used to manage system processes, and many other types
    of commands. In this section, I organize alphabetically of the most frequently
    used commands into groups based on the commands'' functions, and I also explain
    how to use them. Be sure to use the *man* command, which I explain in the following
    “Getting help” section, to get more details about the commands that I reference
    here.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_85_0.png)


    TIP To get a list of the *bash* built-in commands, type **man command** at a terminal
    prompt.


    # Getting commands


    These commands are used to get more information about commands. To use these commands,
    type the command name (shown first) followed by the name of the command for which
    you want help.'
  merge: -1
