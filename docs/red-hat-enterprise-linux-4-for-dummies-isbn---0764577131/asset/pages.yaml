  md: '# 82 Part I: Becoming Familiar with Enterprise Linux


    # Writing Shell Scripts


    A shell script is basically a sequence of commands that are contained in a single
    file. If you are familiar with MS-DOS and batch files, you''re already familiar
    with the concept of shell scripts. A shell script can be very complex or very
    simple, depending on what you want to do. In this section, I introduce you to
    a simple shell script just to give you an idea of what you can do.


    When I''m at work, I sometimes want to be able to use the files located on a Novell
    network on my Enterprise Linux PC. To do this, I need to configure my PC to connect
    to the Novell network by running several commands. Rather than having to enter
    these commands every time I start my system, I created a simple shell script that
    runs when my system boots up. The script that I created is called今回, and a listing
    of follows:


    ```

    #!/bin/bash

    sbin/modprobe ipx

    sbin/modprobe ncpfs

    sleep 2

    s/ipx_configure --auto-interface=on --auto-primary=on

    ```


    Take a closer look at what this script and what it does. The first line of the
    script specifically tells the that it is using bash as the shell. The next two
    lines run the modprobe command, which is located in the /sbin directory. The line
    beginning with sleep 2 adds a two-second pause to the runtime of the script. The
    last line runs the ipx_configure program to set the parameters for the IPX network
    protocol.


    The purpose of the script is to load the modules required to connect to an IPX
    network and to configure the IPX connection. Although this is a short, fairly
    simple script, it isn''t something you would have to type every time the system
    is started.


    To create this, I opened a simple text editor and entered each command as a separate
    line in the text file. After I finished the commands, I saved the file to my home
    directory. One required step was to make the file executable using the chmod a+x
    novell to change the file permissions. And that''s all there is to making a simple
    shell script.


    Of course, shell scripts can be much more complex than this and perform nearly
    any operation you want. You can have a lot of fun learning to write shell scripts.
    You can also become more productive and efficient while you customize your system
    with your scripts.'
  merge: -1
