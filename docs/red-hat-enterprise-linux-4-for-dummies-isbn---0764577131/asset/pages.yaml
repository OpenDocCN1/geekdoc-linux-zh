  md: '# Chapter 13: Configuring and Managing an E-Mail Server


    # Mail Transfer Agent (MTA)


    After the MTA receives the message from the MUA, it can do its job. The MTA installed
    by your Red Hat Enterprise system is Sendmail. The MTA reads the information in
    the To section of the e-message and determines the IP address of the recipient''s
    server. The MTA tries to open a connection to the recipient''s server through
    a communication port, typically port 25. If the MTA on the sending machine can
    establish a connection, it sends the message to the MTA on the recipient''s server
    by using the Simple Message Transfer Protocol (SMTP).


    The MTA on the receiving server adds header information to the message. The header
    contains information that is used for tracking the message and ensuring that it
    is delivered. Next, the receiving MTA passes the message to another program to
    inform the receiver that new mail has arrived.


    # Local Delivery Agent (LDA)


    After the LDA receives the message from the MTA, it places the message in the
    recipient''s mailbox file that is identified by the username. Your Red Hat system,
    this is a program called `procmail`. The location of the user''s mailbox file
    is `/usr/spool/mail/<user''s name>`.


    The final step in the process happens when the user who is the intended receiver
    of the message reads the message. The user does this by using the MTA on or her
    PC.


    An optional program is a mail notifier that periodically checks your mailbox for
    new mail. If you have a program installed, it notifies you of the new mail.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_226_0.png)


    The Red Hat Enterprise Linux has a built-in mail notifier that looks at your mailbox
    file once a minute. If new mail arrives, the shell displays a message just before
    it displays the next prompt. It won''t interrupt a program that you''re running.
    You can adjust how frequently the mail notifier checks and which mailbox files
    to watch.


    If you are using a GUI, Evolution, a mail notifier is available as part of the
    application that plays sounds to know that new mail has arrived. You can turn
    on sound notification for new-mail in Evolution by choosing Tools<Settings from
    the main menu. Then choose Mail Preferences and select Beep When New Mail Arrives
    or Play Sound File When New Mail Arrives. Enter the name of the file to play and
    then click OK. See Figure 13-5.'
