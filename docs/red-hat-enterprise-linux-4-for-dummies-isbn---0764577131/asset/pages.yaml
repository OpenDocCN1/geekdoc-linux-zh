  md: '# About the Author


    **Terry Collings** is the Instructional Technologist at Muhlenberg College in
    Allentown, PA where he is responsible for researching and implementing emerging
    technology in an educational environment. He is also the system administrator
    for Red Hat Linux servers on campus.


    Terry is also an adjunct faculty at Lehigh Carbon Community College where he teaches
    A+ and Network+ certification courses. He has previously taught courses on Unix,
    Linux, TCP/IP, and Novell Network.


    Terry is the co-author of Linux Bible and Red Hat Linux Networking and System
    Administration (first and second editions) as well as a contributing writer to
    the Linux Weekend Crash Course. He was the technical editor for the KDE Bible,
    The Samba Book, Unix Weekend Crash Course, Red Hat Linux 9 For Dummies, Solaris
    9 For Dummies, Linux Timesaving Techniques, and Fedora Linux 2 For Dummies.'
