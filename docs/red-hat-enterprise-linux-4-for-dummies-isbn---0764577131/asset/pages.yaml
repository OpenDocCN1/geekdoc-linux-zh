  md: '# Chapter 9: Connecting to Windows PCs Using Samba


    At this point, you should have a functioning Samba server running on your system.
    It is configured to allow all those who have an account on your Red Hat Enterprise
    Linux system to access their home directories from a Windows PC. Logged in users
    will also be able to use the printers configured with the Red Hat Enterprise Linux
    system.


    # Connecting to the Samba Server


    Now you are ready to test your connection to the Samba server from the Windows
    PC. There is no configuration required on the Windows PC to be able to connect
    to the Samba server. To connect to the Samba server, do the following:


    +   1. On the Windows computer, open the My Places window by clicking its icon
    from the desktop.


    +   2. In the My Places window, you should now see a listing for the Red Hat Enterprise
    Linux computer, which is called sabrina RHL10.


    Figure 9-1 shows the Samba server as it appears in the My Places window on your
    Windows 2000 PC.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_154_0.png)


    Figure 9-1: The My Network Places window showing the Samba server.'
