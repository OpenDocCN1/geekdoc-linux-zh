  md: '# Chapter 14


    # # Configuring and Managing an FTP Server


    **In This Chapter**


    +   * Installing an FTP server

    * Configuring an FTP server

    * Starting and testing an FTP server

    * Logging in to FTP servers


    File Transfer Protocol (FTP) is an Internet protocol that can be used for transferring
    files not only across the Internet but on local networks as well. If you''ve downloaded
    a file from a Web site, you most likely used FTP to download the file. FTP is
    easy to install and configure on your system. In this chapter, I show you how
    to install and configure an FTP server as well as use the ftp client to access
    an FTP server.


    # # Installing an FTP Server


    Red Enterprise Linux ES and AS include the vsftpd FTP server. Known as the Very
    Secure FTP daemon, vsftpd is by design a fast, stable and secure FTP server that
    is capable of handling large numbers of connections simultaneously. If you are
    wondering, a daemon (pronounced dee-mon) is a process that listens for requests
    and provides its intended service. Depending on the options selected when your
    system was installed, vsftpd server might not be installed. The first thing that
    you do is to check for the installation as:


    +   1. **Open a terminal window by choosing Applications > System Tools > Terminal.**


    +   2. **Type rpm -q vsftpd at the command prompt.**


    If vsftpd server is installed, you see vsftpd-<version number> as the result of
    running this command. If the server is not installed, you see a message stating
    that vsftpd is not installed.'
