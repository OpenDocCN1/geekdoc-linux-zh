  md: '# 70 Part I: Becoming Familiar with Enterprise Linux


    To change to a subdirectory of the current directory, you don''t need to specify
    the full (or absolute) pathname. Instead, you can just type the subdirectory (or
    relative) pathname. For example, to change to the bin subdirectory of /usr/local,
    you just need to type cd bin. To move up a level, or return to the parent directory,
    just enter .. (c, d, space, and then two periods).


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_87_0.png)


    Return to your home directory from any location, just type cd and then press Enter.


    # Determining the working directory


    Whenever you''re using the command prompt, the prompt shows the directory in which
    you are located. However, only the directory itself and not the entire path is
