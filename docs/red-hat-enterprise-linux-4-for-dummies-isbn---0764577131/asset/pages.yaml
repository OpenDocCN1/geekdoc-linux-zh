  md: '# # Chapter 10


    # # Security Basics


    **In This Chapter**


    +   - Understanding basic security

    - Developing a security policy

    - Implementing host security

    - Implementing network security

    - Building a firewall


    In this chapter, you discover basic security concepts as they apply to a local
    area network (LAN) as well as security concepts that apply to outside networks,
    such as the Internet. For the purposes of this chapter, I refer to LAN security
    as *host security* because the goal of securing your LAN starts with the security
    of the individual hosts on your network. I refer to network security as *securing
    your network from outside threats* because the goal is to secure your entire network
    from any outside threat.


    # # Developing a Security Policy


    Before you can implement any security on your systems, whether host or network
    security, you need to develop a security policy. A *security policy* is a written
    set of rules that describes how your organization will implement the security
    procedures. The security policy should include a good definition of the following
    items as well as the procedures to follow to implement good security practices:


    +   - Physical security

    - Document security

    - Network security

    - Consequences for not following the security policy

    - Responsibility'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# 144 Part III: Securing Your Enterprise Linux System


    Each of these items is equally important, and one item''s position on the list
    does not indicate any kind of increased importance over other items. The following
    sections contain a more detailed look at at each of these items.


    # Physical security


    Physical security can refer to several methods that you can use to keep your systems
    from unauthorized access. When used in reference to individual hosts, physical
    security usually means choosing a strong password that cannot be easily guessed.


    When used in reference to your network servers, physical security making sure
    that the servers are locked in a secure location. A malicious user does not need
    to be able to log in to your servers to do harm if your servers can be physically
    accessed. If a user can physically access your servers, he can do all sorts of
    damage to them — simply turning off the power to picking them up and carrying
    them away. Keeping your servers locked as well as limiting access to the locked
    location keeps unauthorized users from doing any harm to your servers. Other aspects
    of physical security include


    +   - Identification badges: Requiring all employees to work identification badges
    makes it easy to identify someone who does not belong inside your organization.

    - Door locks: All doors to data centers or server rooms should be locked, with
    limited access to only those who need it.

    - Security cameras: Cameras should cover all building entrances and exits and
    should be monitored continuously.


    # Document security


    Document security refers to the ability of a company or organization to prevent
    loss of important information by maintaining control over many documents. One
    of the easiest and most effective ways to maintain good security for an organization
    is to have a clean desk policy in place. This doesn''t refer to not eating at
    your desk or wiping the surfaces of the desk clean (although both are probably
    good ideas). A rather, clean desk policy means that all important documents, such
    as schematics, engineering drawings, company policy statements, confidential correspondence,
    and other similar items are locked away when employees leave their work areas.
    Someone can easily pick up items from a desk in an empty office with no one knowing
    that it happened.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Chapter 10: Security Basics


    Another way to help ensure document security is to use encryption. **Encryption**
    uses a special key to change the document to make it unreadable to anyone doesn''t
    have the key that is used to decrypt the document. Using encryption won''t prevent
    someone from obtaining your documents, but it can keep them from reading them.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_162_0.png)


    # Network security


    Many items can be listed under the category of network security. The primary goal
    of network security is to keep your network safe from inside and outside vulnerabilities.
    As you can read in the preceding section, security and document security are major
    parts of network security. Other items of significance are shown in the following
    list:


    +   **Network access:** You should disable any unused network ports to prevent
    unauthorized users with laptops from connecting to your network.

    **Network wiring:** If possible, you should not run your network wiring where
    it''s easily accessible. Network devices such as routers and firewalls should
    be in locked closets or other areas.

    **Modems:** Company employees should not be allowed to use desktop modems for
    any reason.


    Many items could be included in this list, but these are enough to provide a good
    starting point for network security as well as overall company security. Besides,
    I wouldn''t want you to think that I''m some kind of security besides, after all.


    # Consequences for breaking security policy


    Your security policy should include a section on the consequences of not following
    the policy. You must specifically state the actions that your organization will
    take against users who fail to comply with the policy. Typically, infractions
    can be categorized as either major or minor infractions.


    Usually, a user who commits a major infraction could be subject to immediate termination.
    Many infractions could be considered major, such as using the Internet to browse
    to inappropriate sites as determined by the policy. Any user who commits a major
    infraction and is to be terminated should be immediately escorted out of the building
    after the employee is given the chance to gather any personal belongings from
    his or work area.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# 146 Part III: Securing Your Enterprise Linux System


    A minor infraction is typically caused when a user breaks a security policy rule
    that usually results in the user having network access or privileges revoked for
    a certain period of time. For example, an employee might be spending too much
    time on the Internet instead of doing his or her work. She isn''t browsing inappropriate
    sites, which would be a major infraction, but is just spending too much time browsing.
    In this case, her Internet usage could be suspended for a specified period.


    # Responsibility


    You need to determine who is responsible for your security policy. Who will implement
    the policy, make sure it is maintained, and report any violations of the policy?
    You also need to determine who is responsible for fixing any problems that might
    arise from infractions of the policy or events occurring that were not expected
    or planned for in the existing policy.


    # Performing a security audit


    Before you develop your security policy, you need to determine the specific areas
    that you need to secure. You can do this by performing a security audit of your
    hosts as well as your outside network connections. The items that you would examine
    can all be classified under the heading of risk assessment. Your risk assessment
    should look at the following areas:


    +   Threats: From what do you need to protect your hosts and network? Typical
    threats to your systems can be from both external sources as well as from internal
    users. Some typical threats to your systems can be Denial of Service attacks (DoS)
    and IP spoofing.


    +   **DoS attack:** Your servers become overloaded with bogus requests for service
    that authorized users cannot use the services they need.


    +   **IP spoofing attack:** Someone uses your system IP addresses to launch attacks
    against other systems. Internal threats can come from users who attempt to access
    systems that they shouldn''t be accessing.


    +   **System weaknesses:** You need to determine the areas where your system is
    vulnerable to attack based on the threats that you have identified.


    +   **Affects of attack:** You must examine the possible implications that an
    attack could have on yours.


    +   **Vulnerability reduction:** If your system is attacked or otherwise promised,
    determine what you can do to lessen the effect of the attack and prevent future
    occurrences.'
