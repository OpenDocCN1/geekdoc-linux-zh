  md: '# Global


    The first section of the smb.conf file is the global section. The global section
    contains settings that apply to the entire server as well as default settings
    that can apply to the other shares. The global section contains a list of options
    and values in this format:


    ```

    option = value

    ```


    Of the hundreds of options and values at your disposal, the most common ones are
    shown here. For a complete-listing of options, refer to the smb.conf page. Some
    of the most significant options are


    +   - workgroup = Tardis: This is the name of the workgroup shown in the identification
    tab of the network properties box on the Windows computer.


    +   - smpasswd = /etc/samba/smpasswd: This shows the path to the Samba password
    file. Be sure that you include this option/value in your smb.conf file.


    +   - encrypted = yes: Beginning with Windows NT Service Pack 3 and later, passwords
    are encrypted. If you are connecting to any systems running these versions of
    Windows, you should choose encrypted passwords.


    +   - netbios name = RHEL: This is the name by which the Samba server is known
    to the Windows computer.


    +   - server string = Samba Server: This is shown as a comment on the Windows
    PC in the network browser.


    +   - security = user: This is the level of security applied to access server.
    Other possible options are


    +   - share:Using share makes it easier to create anonymous shares that do not
    require authentication, and it is useful when the NET-BIOS names of the Windows
    computers are different from other names on the Linux computer.


    +   - server: This is used if the password file is on another server on the network.


    +   - domain: This is used if the clients are added to a Windows NT domain using
    smbpasswd, and login requests are by a Windows NT primary or backup domain controller.


    +   - log file = /var/log/samba/log: This is the location of the log file.


    +   - max log size = 50: This is the maximum size in kilobytes that the file can
    grow to.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Chapter 9: Connecting to Windows PCs Using Samba 135


    +   - socket options = TCP_NODELAY SO_RCVBUF=B192 SO_SNDBUF=B192

    This enables the server to be tuned for better performance. TCP_NODE-

    LAY is a default value, and the BUF values set and receive buffers.


    +   - dns proxy = No: This indicates that the NETBIOS will not be

    treated like a DNS name and there is no DNS lookup.


    # Homes


    The next section of the smb.conf file, is used to enable the server to

    ge users access to their home directories. Refer to the smb.conf man

    page for a more complete description of how the homes section works.


    +   - comment = Home Directories is a comment line.


    +   - browseable = means that the directory will appear in the

    Windows file browser.


    +   - writeable = means that users can write to their directories.


    +   - create mode = 0664 sets the default permissions for files created

    in the directory.


    +   - directory mode = 0775 sets the default permissions for directories

    that are created.


    +   - max connections = 1 is the maximum number of connections allowed.


    # Printers


    This section sets the options for printing.


    +   - path = /var/spool/samba enables clients to send print jobs to the specified

    directory.


    +   - printable = enables clients to send print jobs to the specified

    directory. This must be set, or printing does not work.


    +   - browseable = means that the printer appears in the browse list.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_152_0.png)


    Be sure to have your printer properly configured for your Linux network

    before you attempt to set it up for use with Windows clients. You might need

    to enter the location of the path to the print spool for the printer that you

    want to use in the smb.conf file.'
