  md: '# Chapter 15


    # Serving Web Pages


    In This Chapter


    +   - Installing and starting the Web server

    - Configuring and managing your Web server


    Whenever you go to a Web site on the Internet, you see the content provided by
    that site. What you don''t see is the behind-the-scenes activity that makes viewing
    the Web site possible. This behind-the-scenes activity is all controlled by a
    Web server, and the Apache Web server is by far the most widely used Web server
    in us today. It is relatively easy to set up and maintain, as you can see by reading
    this chapter. If you''re setting up the AS or ES versions of Enterprise Linux,
    you can find out what you need to know about your Apache server in this chapter.
    If you are running the WS or Desktop versions of Enterprise Linux, you won''t
    be running a Web server — so you can skip this chapter.


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_252_0.png)


    Setting up and running a Web server can be a very complex task; indeed, many books
    are devoted entirely to this topic in this chapter, however, will enable you to
    set up a basic Web server. You should refer to the Apache Web site at www.apache.org
    for more detailed documentation.


    # Installing and Starting the Web Server


    The Apache Web server software is usually installed automatically during the system
    installation, so you shouldn''t have to install it manually. I recommend, though,
    checking to be sure that it is there before you try to start it. You can check
    for the Web server by entering the following command:


    ```

    rpm -q httpd

    ```


    If the Apache software is installed, the system responds with the name and version
    number of the installed software. If the Web server is not installed,'
