    As you can see from Listing 14-1, the basic format of the file is either a comment
    line, indicated by the pound sign (#) at the beginning of a line or a directive,
    which is in the form of


    ```

    option=value

    ```


    ![](img/64d26e5c3406fc66f2dd833f0d7cc3af_243_0.png)


    Comment lines are ignored by the program and are used to provide information about
    the directive that follows the comment or to prevent a directive from being read.
    Many directives are shown out in the configuration file. To enable these directives,
    you just need to remove the comment (pound sign) from the beginning of the directive.
    Directives must not contain any spaces between the option equal sign and value.
    Values can be expressed as a Boolean value of YES or NO, numerical values, or
    string values.


    There are probably over 100 options which you can set. If you want to see the
    complete list, take a look at the vsftpd.conf man file. I explain the most common
    options in the order that they are shown in the default /etc/vsftpd/vsftpd.conf
    created during the server installation.


    +   - anonymous_enable=YES: This directive enables anonymous FTP. Users of anonymous
    FTP can use the anonymous username and password word that they want. To disable
    FTP, change the value to NO or just comment out the entire directive.


    +   - local_enable=YES: This directive controls whether local users can log in
    the FTP server. If enabled, any user who has an account can


    +   - write_umask=022: The default file permissions are controlled by the umask
    setting.


    +   - anon_upload_enable=YES: To allow anonymous users to upload files to your
    server, set this directive to YES. To disallow anonymous uploads, set the directive
    to NO or comment out the line.


    +   - anon_mkdir_write_enable=YES: If you want to allow anonymous users to create
    directories, uncomment this directive; otherwise, leave it commented out or set
    the value to NO.


    +   - dismissal_message_enable=YES: If you want to pass a message to users when
    they enter an entry, set this directive to YES. You also need to create a'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# Chapter 14: Configuring and Managing an FTP Server


    file with the name .message and place it in the directory from which you want
    the message to appear.


    +   - xferlog_enable=YES: To enable logging of uploads and downloads, set this
    directive to YES.

    - connect_from_port_20=YES: This directive controls whether port 20 is used on
    the server for data transfers. This directive is typically set to YES for security
    reasons.

    - pam_service_name=vsftpd: This string value displays the pluggable authentication
    module name used by the FTP server. The file is located at /etc/pam.d/vsftpd.

    - userlist_enable=YES: If this enabled, the FTP server reads the names from the
    file shown by the userlist_file directive and denies access to those users.

    - listen=YES: If enabled, this directive instructs the FTP server to run in standalone
    mode.

    - tcp_wrappers=YES: If this directive is enabled, access control for the FTP server
    is handled by tcp wrappers.


    # Configuring the /etc/vsftpd.ftusers file


    The /etc/vsftpd.ftusers lists users who are not allowed to log in to the FTP server.
    These users are typically users who have increased privileges on the server; allowing
    these users to log in could present a security vulnerability to your system. You
    can add additional names to this list by editing the file in any text editing
    program. The first line in the listing is the command entered at the command prompt,
    and the remainder of the listing is the output for the command.


    Listing 14-2: The /etc/vsftpd.ftusers File


    ```

    [root@main ~]# cat /etc/vsftpd.ftusers

    # Users that are not allowed to log in via ftp

    bin

    daemon

    adm

    lp

    sync

    shutdown

    halt

    mail

    news

    uucp

    operator

    games

    nobody

    ```'
