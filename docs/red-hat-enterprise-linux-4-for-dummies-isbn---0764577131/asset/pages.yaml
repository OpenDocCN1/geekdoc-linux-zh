  md: '# 10 Part I: Becoming Familiar with Enterprise Linux


    The first publicly available version of Red Hat kernel appeared in the summer
    of 1994 and was based on kernel version 1.09. (The kernel is identified by a number
    that refers to the particular version of the kernel.) Since the release of the
    first version of the Red Hat Distribution, there have been many releases, with
    each improving upon the earlier versions. Red Hat made no distinction between
    suitability for home use or commercial (business) use of its distributions until
    May, 2002. Red Hat was release 7.3 of the Red Hat distribution. Coinciding with
    the release there was the introduction of Red Hat Advanced Server 2.1, which was
    renamed Enterprise Linux.


    Enterprise 2.1 was based on the Red Hat 7.3 version but was intended for commercial/business
    use. The major difference between the commercial and home versions of Red Hat
    was in the support offerings available for the users. The home version, if purchased
    through a boxed set, gave the user a limited number of technical support calls
    for a short time period, and the users were on their own. The commercial version
    provided a longer time period for technical support and offered additional technical
    support that could be purchased at additional cost. Also, Red Hat had issued a
    new version of its operating system every six months—changing too often for most
    users. With the release of Enterprise Linux 2.1, Red Hat slowed the pace of system
    changes to give users a more stable platform (requiring less frequent updates)
    and focused its commercial efforts on the Enterprise version.


    From this point forward, Red Hat continued development of its home users through
    version 8 and finally version 9, which was the last Red Hat distribution that
    was available for home user purchase. In the summer of 2003, Red Hat decided that
    it would merge its open development process with the Fedora project—and the Fedora
    Project was.


    In October, 2003, Red Hat introduced Enterprise 3, like its predecessor Enterprise
    2.1, was specifically geared toward business/enterprise users. Enterprise 3 was
    initially available in three versions—AS, ES, and WS—each designed for specific
    types of service. In the summer of 2004, Red Hat added another version of Enterprise
    3 specifically for the desktop. That brings us to the present—Enterprise version
    4—which is the focus of this book.


    # Examining the Versions of Red Hat Enterprise


    All versions of Enterprise Linux share some similarities in their product features.
    The most significant of these features are


    +   - A 12–18 month release cycle

    - A common operating system, applications, and management tools'
