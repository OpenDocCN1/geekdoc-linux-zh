    Restoring the file system


    In order to restore a damaged or erased file system, you must first re-create
    the directory or partition that has been lost. If, for instance, you want to recreate
    the /home directory, which existed by itself on the /dev/hdb1 partition, you could
    use the following command:


    ```

    mkfs /dev/hdb1

    ```


    and you would mount the partition with this command:


    ```

    mount /dev/hdb1 /home

    ```


    Note that the first command (mkfs /dev/hdb1) erases all the data on the /dev/hdb1
    partition. This method of restoration is useful for restoring all the files previously
    archived with dump. If any files have been modified, or deleted since the last
    backup, those changes are lost. Restoring individual files is covered in the section
    "Restoring individual files using restore." Also, if mkfs is accidentally run
    on a different partition than the one you want to restore, all the data on the
    partition on which it is mistakenly run are irrevocably erased.


    restore must be run inside the directory that is going to be restored. So, restore
    can restore the /home directory with the following commands:


    ```

    cd /home

    restore rf /dev/rft0

    ```


    The r flag tells restore to restore the entire archive rather than just some files.
    The f flag tells restore that the archive is located on the device /dev/rft0.'
