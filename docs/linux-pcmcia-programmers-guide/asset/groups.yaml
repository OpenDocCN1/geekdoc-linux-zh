  - "[PAGE 6]\n\n# 3. Card Services Subfunction Descriptions\n\nIO windows differ\
    \ from memory windows in host addresses that fall within an window are not modified\
    \ before they are passed on to an IO card. Effectively, the base addresses of\
    \ the window in the host and card address spaces are always equal. IO windows\
    \ also have no alignment or size restrictions; an IO window can start and end\
    \ on any boundary in the 4K IO address space.\n\nThe PC Card defines a single\
    \ interrupt service from the card to the controller. The controller has the responsibility\
    \ of steering this interrupt to an appropriate interrupt request ('Irq') line.\
    \ All controllers supporting steer Card interrupts to essentially any free interrupt\
    \ line. Because steering happens in the controller, the card itself is unaware\
    \ of which interrupt it uses.\n\nAll PC Controllers can generate interrupts in\
    \ response to card status changes. These interrupts are distinct from the IO interrupts\
    \ generated by an IO card, and use a separate interrupt line. Signals that generate\
    \ interrupts include card detect, ready/busy; write protect, battery low, and\
    \ battery dead.\n\n# 3 Card Services Subfunction Descriptions\n\nCard Services\
    \ calls the general form:\n\n```\n#include \"cs_types.h\"\n#include \"cs.h\"\n\
    \nint CardServices(int subfunc, void *arg1, void *arg2, ...);\n```\n\nSome Card\
    \ Services functions require additional #include statements. The particular subfunction\
    \ determines the number of expected arguments. A return code of CS_SUCCESS indicates\
    \ that a call succeeded. Other return codes identify errors.\n\n# 3.1 Client management\
    \ functions\n\nDevice drivers that use Card functions are called 'clients'. A\
    \ device driver should use the RegisterClient call to get a client handler before\
    \ using other services. Most Card Services functions will take this client handler\
    \ as an argument. Before unloading, drivers should also unregister with DeregisterClient.\n\
    \n# 3.1.1 RegisterClient\n\n```\nint CardServices(RegisterClient, client_handle_t\
    \ *client, client_reg_t *reg);\n```\n\nThe client_reg_t data structure is given\
    \ by:\n\n```\ntypedef struct client_reg_t {\n    dev_info_t\n    *dev_info;\n\
    \    Attributes;\n    u_int\n    EventMask;\n    (*event_handler)(event_t event,\
    \ int priority, event_callback_args_t event_callback, event_callback_args_t *args);\n\
    \    u_int\n    Verzion;\n} client_reg_t;\n```"
  - '[PAGE 7]


    # 3. Card Services Subfunction Descriptions


    RegisterClient establishes a link between a client driver and Card Services, and
    connects the client with an appropriate socket. The dev_info parameter is used
    by Card Services to match the client with a socket and function; this correspondence
    is normally established by Driver Services via a call to BindDevice. If successful,
    a client handle will be returned in client.


    The following flags can be specified in Attributes:


    # INFO_MASTER_CLIENT


    For use only by the Driver Services. Among other things, specifies that this client
    should not be automatically unbound when a card is ejected from this socket.


    # INFO_IO_CLIENT


    Specifies that this client is an IO driver.


    # INFO_MTD_CLIENT


    Specifies that this client is a Memory Technology Driver.


    # INFO_MEM_CLIENT


    Specifies that this client is a memory card driver.


    # INFO_CARD_SHARE


    Included for compatibility, has no effect.


    # INFO_CARD_EXCL


    Included for compatibility, has no effect.


    EventMask specifies what events this client should be notified. The event_handler
    entry point will be called by Card Services when an event in EventMask is processed.
    The event_handler_args structure is a template for the structure that will be
    passed to the event handler. The Version parameter identifies the Card Services
    level that this driver expects; it is currently ignored.


    A driver should be prepared to handle Card Services events before calling RegisterClient.
    This call will always generate a CS_REGISTRATION_COMPLETE event, and may also
    generate an artificial CS_CARD_INSERTION event if the socket is currently occupied.


    Return codes:


    # CS_OUT_QF_RESOURCE


    An appropriate socket could not be found for this driver.


    # 3.1.2 DeregisterClient


    ```

    int CardServices(DeregisterClient, client_handle_t client);

    ```


    DeregisterClient severs the connection between a client and Card Services. It
    should be called after the client has freed any resources it has allocated. Once
    a connection is broken, it cannot be reestablished until after another call to
    BindDevice.


