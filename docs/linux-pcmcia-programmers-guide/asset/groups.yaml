    \ and will update BasePort1 and BasePort2 to reflect the address range(s) actually\
    \ assigned.\n\nPrior to release 3.1.4, the IOAddrLines field was ignored. The\
    \ allocator always tried to assign the address range requested, unless the base\
    \ was zero; in that case, it would assign any available window aligned to nearest\
    \ power of two larger than the window size. The new allocator verifies that the\
