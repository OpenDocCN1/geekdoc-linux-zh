  - "[PAGE 20]\n\n# 3. Card Services Subfunction Descriptions\n\nCS_NO_CARD\n\nThe\
    \ socket assigned to this client is currently vacant.\n\nCS_CONFIGURATION_LOCKED\n\
    \nThis means that the configuration is not locked.\n\n# 3.4 Card Information Structure\
    \ (CIS) calls\n\nThe definition of the Card Information Structure (CIS) is the\
    \ darkest chapter of the PC Card standard. All version 2 clients should have a\
    \ CIS, which describes the card and how it should be configured. The CIS is a\
    \ linked list of “tuples” for the card's attribute memory space. Each tuple consists\
    \ of an identification code, a length byte, and a series of data bytes. The layout\
    \ of the data bytes for some tuples is absurd complicated, in an apparent effort\
    \ to use very last.\n\nValidateCIS calls to check if a card has a reasonable CIS.\
    \ The GetFirstTuple and GetNextTuple calls are used to step through CIS tuples.\
    \ GetTupleData extracts data bytes from a tuple. And ParseTuple unpacks many tuples\
    \ into more easily forms. The ReplaceCIS allows a client to provide a substitute\
    \ for the CIS found on the card.\n\n# 3.4.1 GetFirstTuple, GetNextTuple\n\n```\n\
    #include \"cispl.h\"\n\nint CardServices(GetFirstTuple, client_handle_t client,\
    \ tuple_t *tuple);\nint CardServices(GetNextTuple, client_handle_t client, tuple_t\
    \ *tuple);\n```\n\nThe tuple_t data is given by:\n\n```\ntypedef struct tuple_t\
    \ {\n    u_int\tAttributes;\n    cis_data_t\tDesiredTuple;\n    u_int\tFlags;\n\
    \    cisdata_t\tTupleCode;\n    u_int\tTupleLink;\n    cisdata_t\tTupleOffset;\n\
    \    cisdata_t\tTupleData;\n    cisdata_t\tTupleLen;\n    cisdata_t\t*TupleData;\n\
    } tuple_t;\n```\n\nGetFirstTuple searches for a CIS for the first tuple matching\
    \ DesiredTuple. RETURN_FIRST_Tuple will match the first tuple of any kind. If\
    \ successful, TupleCode is set to the code of the first matching tuple, and TupleLink\
    \ is the address of this attribute in memory.\n\nGetNextTuple is like GetFirstTuple,\
    \ except given a tuple_t returned by a previous call to GetFirstTuple or GetNextTuple,\
    \ it will return the next tuple matching DesiredTuple.\n\nThese functions will\
    \ automatically traverse any link tuples in the CIS. For multifunction cards using\
    \ a CISPL_LONLINK_MFC, these functions will automatically follow the CIS chain\
    \ specific to a client driver's assigned function. If a client was bound to BIND_FN_ALL,\
    \ all tuples will be returned."
- md: "\n## 3. Card Services Subfunction Descriptions\n\nThe following flags can be\
    \ specified in Attributes:\n\nTUPLE_RETURN_LINK\n\nIndicates that link tuples\
    \ (CISTPL_LONGLINK_A, CISPL_LONGLINK_C, CISPL_LONGLINK_MFC, CISPL_NOLINK, CISPL_LINTARGET)\
    \ should be returned. Normally these tuples are processed silently.\n\nTUPLE_RETURN_COMMON\n\
    \nIndicates that tuples in the \"common\" CIS section of a multifunction CIS should\
    \ be returned. In the absence of this flag, normally, Card Services will only\
    \ return tuples specific to the function bound to the client.\n\nReturn codes:\n\
    \n- CS_BAD_HANDLE: The client handle is invalid.\n- CS_OUT_OF_RESOURCE: Card Services\
    \ was unable to set up a memory window to map the card's CIS.\n- CS_NO_MORE_ITEMS:\
    \ There were no tuples matching DesiredTuple.\n\n## 3.4.2 GetTupleData\n\n```c\n\
    #include \"cistpl.h\"\n```\n\n```c\nint CardServices(GetTupleData, client_handle_t\
    \ client, tuple_t *tuple);\n```\n\nGetTupleData extracts a series of bytes from\
    \ the specified tuple, which must have been returned by a previous call to GetFirstTuple\
    \ or GetNextTuple. A maximum of TupleDataMax bytes will be copied into the TupleData\
    \ buffer, starting at an offset of TupleOffset bytes. The number of bytes copied\
    \ is returned in TupleDataLen.\n\nReturn codes:\n\n- CS_BAD_HANDLE: The client\
    \ handle is invalid.\n- CS_OUT_OF_RESOURCE: Card Services was unable to set up\
    \ a memory window to map the card's CIS.\n- CS_NO_MORE_ITEMS: The tuple does not\
    \ contain any more data. TupleOffset is greater than or equal to the length of\
    \ the tuple.\n\n## 3.4.3 ParseTuple\n\n```c\n#include \"cistpl.h\"\n\nint CardServices(ParseTuple,\
    \ client_handle_t client, tuple_t tuple, tuple_t *tuple, cisparse_t *parse);\n\
    ```\n\nThe cisparse_t data structure is given by:\n\n```c\ntypedef union cisparse_t\
    \ {\n\tcistpl_device_t      device;\n\tcistpl_checksum_t    checksum;\n\tcistpl_longlink_t\
    \    longlink;\n\tcistpl_longlink_mfc_t longlink_mfc;\n\tcistpl_vers_1_t     \
    \ version_1;\n\tcistpl_altstr_t      altstr;\n\tcistpl_jedec_t       jedec;\n\t\
    cistpl_manifold_t     manifold;\n\tcistpl_funcd_t       funcd;\n\tcistpl_config_t\
    \       config;\n\tcistpl_ctable_entry_t cftable_entry;\n\tcistpl_device_geo_t\
    \  device_geo;\n\tcistpl_vers_2_t      version_2;\n\tcistpl_org_t         org;\n\
    \tcistpl_format_t      format;\n} cisparse_t;\n```\n\nParseTuple interprets tuple\
    \ data returned by a previous call to GetTupleData. The structure returned depends\
    \ on the type of the parsed tuple. See the cistpl.h file for these structure definitions;\
    \ some of them are quite complex.\n\nReturn codes:\n\n- CS_BAD_TUPLE: An error\
    \ was encountered during parsing of this tuple. The tuple may be incomplete, or\
    \ may be formatted incorrectly.\n- CS_UNSUPPORTED_FUNCTION: ParseTuple cannot\
    \ parse the specified type.\n\n## 3.4.4 ValidateCIS\n\n```c\nint CardServices(ValidateCIS,\
    \ client_handle_t client, cisinfo_t *cisinfo0);\n```\n\nThe cisinfo_t structure\
    \ is given by:\n\n```c\ntypedef struct cisinfo_t {\n\tu_int                Chains;\n\
    } cisinfo_t;\n```\n\nValidateCIS attempts to verify that a card has a reasonable\
    \ Card Information Structure. It returns the number of tuples found in Chains.\
    \ If the CIS appears to be uninterpretable, Chains will be set to 0.\n\nReturn\
    \ codes:\n\n- CS_BAD_HANDLE: The client handle is invalid.\n- CS_OUT_OF_RESOURCE:\
    \ Card Services was unable to set up a memory window to map the card's CIS.\n\n\
    ## 3.4.5 ReplaceCIS\n\n```c\nint CardServices(ReplaceCIS, client_handle_t client,\
    \ cisdump_t *cisdump);\n```\n\nThe cisdump_t structure is given by:\n\n```c\n\
    typedef struct cisdump_t {\n    u_int Length;\n    u_char Data[CISTPL_MAX_SIZE];\n\
    } cisdump_t;\n```\n\nReplaceCIS allows a client to pass Card Services a replacement\
    \ for the CIS on a card. Its intended application is for cards with incomplete\
    \ or inaccurate CIS. If a correct CIS can be deduced from other information, this\
    \ allows information to be provided to clients in a clean fashion. The replacement\
    \ CIS remains in effect until the card is ejected, and all tuple-related services\
    \ use the replacement instead of the actual CIS.\n\nThe Length field gives the\
    \ number of bytes in the Data array. The Data array can be considered to be the\
    \ card's attribute memory. It should contain all required CIS, including an initial\
    \ CISPL_DEVICE tuple and a final CISPL_END tuple. Long links (including CISPL_LONGLINK_MPFC)\
    \ may be used: all addresses are interpreted in the replacement space. This service\
    \ was added in release 3.0.\n\nReturn codes:\n\n- CS_BAD_HANDLE: The client handle\
    \ is invalid.\n- CS_OUT_OF_RESOURCE: Card Services was unable to allocate memory\
    \ to hold the replacement CIS.\n\n## 3.5 Memory window\n\nEach socket can have\
    \ up to four active memory windows, mapping portions of card memory into the host\
    \ address space. A device can address most of common and attribute memory. Windows\
    \ are typically sized to a power of two. Depending on socket capabilities, they\
    \ may need to be aligned on a multiple of the window size in both the host and\
    \ card spaces.\n\nA memory window is initialized by a call to RequestWindow. Some\
    \ attributes can be modified using ModifyWindow. The segment of card memory mapped\
    \ to the window can be modified using MapPage. Windows are released with ReleaseWindow.\
    \ Unlike almost all other subfunctions, the memory functions act on window handles\
    \ rather than client handles.\n\n## 3.5.1 RequestWindow\n\n```c\nint CardServices(RequestWindow,\
    \ client_handle_t *handle, win_req_t *req);\n```\n\nThe win_req_t structure is\
    \ given:\n\n```c\ntypedef struct win_req_t {\n    u_int               Attributes;\n\
    \    u_long              Base;\n    u_int               Size;\n    u_int     \
    \          AccessSpeed;\n} win_req_t;\n```\n\nRequestWindow maps a window of card\
    \ memory into system memory. On entry, the handle parameter should point to a\
    \ valid client handle. On return, this will be replaced by a window_handle_t that\
    \ should be used in subsequent calls to ModifyWindow, MapPage, and ReleaseWindow.\n\
    \nThe following flags can be specified in Attributes:\n\n- WIN_MEMORY_TYPE: This\
    \ field can be either WIN_MEMORY_TYPE_CM for common memory, or WIN_MEMORY_TYPE_AM\
    \ for attribute memory.\n- WIN_DATA_WIDTH: Either WIN_DATA_WIDTH_16 for 16-bit\
    \ accesses, or WIN_DATA_WIDTH_8 for 8-bit access.\n- WIN_ENABLE: If this is set,\
    \ the window is turned on.\n- WIN_USE_WAIT: Specifies that the controller should\
    \ observe the MWAIT signal.\n- WIN_MAP_BELOW_1MB: Requests that the window be\
    \ mapped below the 1MB address boundary. This may not be possible on some platforms.\n\
    - WIN_STRICT_ALIGN: Requests that the base be aligned to a multiple of the window\
    \ size. Added in release 3.1.2.\n\nBase specifies the base physical address of\
    \ the window in system memory. If zero, Card Services will set Base to the first\
    \ available window address. Size specifies the window size in bytes. If zero,\
    \ Card Services will set Size to the smallest window size supported by the host\
    \ controller. AccessSpeed specifies the memory access speed, in nanoseconds.\n\
    \nReturn codes:\n\n- CS_BAD_HANDLE: The client handle is invalid.\n- CS_NO_CARD:\
    \ The socket assigned to this client is currently vacant.\n- CS_BAD_ATTRIBUTE:\
    \ An unsupported window attribute was requested.\n- CS_OUT_OF_RESOURCE: The maximum\
    \ number of memory windows for this socket are already being used.\n- CS_IN_USE:\
    \ RequestWindow was unable to find a free window of system memory.\n- CS_BAD_SIZE:\
    \ The size is invalid.\n- CS_BAD_BASE: Either Base or Size does not satisfy the\
    \ alignment rules for this socket.\n\n## 3.5.2 ModifyWindow\n\n```c\nint CardServices(ModifyWindow,\
    \ window_handle_t handle, modwin_t *mod);\n```\n\nThe modwin_t structure is given\
    \ by:\n\n```c\ntypedef struct modwin_t {\n    u_int       Attributes;\n    u_int\
    \       AccessSpeed;\n} modwin_t;\n```\n\nModifyWindow modifies the attributes\
    \ of a window handle returned by a previous call to RequestWindow. The following\
    \ attributes can be changed:\n\n- WIN_MEMORY_TYPE: This field can be either WIN_MEMORY_TYPE_CM\
    \ for common memory, or WIN_MEMORY_TYPE_AM for attribute memory.\n- WIN_DATA_WIDTH:\
    \ Either WIN_DATA_WIDTH_16 for 16-bit accesses, or WIN_DATA_WIDTH_8 for 8-bit\
    \ access.\n"
  mdcn: "\n\n## 3. 卡片服务子函数描述\n\n可以在 Attributes（属性）中指定以下标志：\n\nTUPLE_RETURN_LINK\n\n\
    表示应返回链接元组（CISTPL_LONGLINK_A, CISPL_LONGLINK_C, CISPL_LONLINK_MFC, CISPL_NOLINK,\
    \ CISPL_LINTARGET）。通常，这些元组是静默处理的。\n\nTUPLE_RETURN_COMMON\n\n表示应返回多功能 CIS 中“common”（公共）部分中的元组。在没有此标志的情况下，通常\
    \ Card Services 只返回绑定到客户端的特定函数的元组。\n\n返回代码：\n\n- CS_BAD_HANDLE: 客户端句柄无效。\n- CS_OUT_OF_RESOURCE:\
    \ Card Services 无法建立内存窗口来映射卡片的 CIS。\n- CS_NO_MORE_ITEMS: 没有匹配 DesiredTuple 的元组。\n\
    \n## 3.4.2 GetTupleData\n\n```c\n#include \"cistpl.h\"\n```\n\n```c\nint CardServices(GetTupleData,\
    \ client_handle_t client, tuple_t *tuple);\n```\n\nGetTupleData 从指定的元组中提取一系列字节，该元组必须是由之前调用\
    \ GetFirstTuple 或 GetNextTuple 返回的。最多将 TupleDataMax 字节将从从 TupleOffset 字节的偏移量开始复制到\
    \ TupleData 缓冲区中。复制的字节数返回在 TupleDataLen 中。\n\n返回代码：\n\n- CS_BAD_HANDLE: 客户端句柄无效。\n\
    - CS_OUT_OF_RESOURCE: Card Services 无法建立内存窗口来映射卡片的 CIS。\n- CS_NO_MORE_ITEMS: 元组不再包含更多数据。TupleOffset\
    \ 大于或等于元组的长度。\n\n## 3.4.3 ParseTuple\n\n```c\n#include \"cistpl.h\"\n\nint CardServices(ParseTuple,\
    \ client_handle_t client, tuple_t tuple, tuple_t *tuple, cisparse_t *parse);\n\
    ```\n\ncisparse_t 数据结构如下：\n\n```c\ntypedef union cisparse_t {\n\tcistpl_device_t\
    \      device;\n\tcistpl_checksum_t    checksum;\n\tcistpl_longlink_t    longlink;\n\
    \tcistpl_longlink_mfc_t longlink_mfc;\n\tcistpl_vers_1_t      version_1;\n\tcistpl_altstr_t\
    \      altstr;\n\tcistpl_jedec_t       jedec;\n\tcistpl_manifold_t     manifold;\n\
    \tcistpl_funcd_t       funcd;\n\tcistpl_config_t       config;\n\tcistpl_ctable_entry_t\
    \ cftable_entry;\n\tcistpl_device_geo_t  device_geo;\n\tcistpl_vers_2_t      version_2;\n\
    \tcistpl_org_t         org;\n\tcistpl_format_t      format;\n} cisparse_t;\n```\n\
    \nParseTuple 解析之前调用 GetTupleData 返回的元组数据。返回的结构取决于所解析元组的类型。这些结构定义请参见 cistpl.h 文件；其中某些结构非常复杂。\n\
    \n返回代码：\n\n- CS_BAD_TUPLE: 在解析此元组时遇到错误。该元组可能不完整，或者格式不。\n- CS_UNSUPPORTED_FUNCTION:\
    \ ParseTuple 无法解析指定的类型。\n\n## 3.4.4 ValidateCIS\n\n```c\nint CardServices(ValidateCIS,\
    \ client_handle_t client, cisinfo_t *cisinfo0);\n```\n\ncisinfo_t 结构如下：\n\n```c\n\
    typedef struct cisinfo_t {\n\tu_int                Chains;\n} cisinfo_t;\n```\n\
    \nValidateCIS 尝试验证卡片具有合理的卡片信息结构（CIS）。它返回 Chains 中找到的元组数量。如果 CIS 看起来不可解释，则 Chains\
    \ 将设置为 0。\n\n返回代码：\n\n- CS_BAD_HANDLE: 客户端句柄无效。\n- CS_OUT_OF_RESOURCE: Card Services\
    \ 无法建立内存窗口来映射卡片的 CIS。\n\n## 3.4.5 ReplaceCIS\n\n```c\nint CardServices(ReplaceCIS,\
    \ client_handle_t client, cisdump_t *cisdump);\n```\n\ncisdump_t 结构如下：\n\n```c\n\
    typedef struct cisdump_t {\n    u_int Length;\n    u_char Data[CISTPL_MAX_SIZE];\n\
    } cisdump_t;\n```\n\nReplaceCIS 允许客户端向 Card Services 传递卡片 CIS 的替换。其设计目的是用于 CIS\
    \ 不完整或不准确的卡片。如果能从其他信息中推出正确的 CIS，这允许以干净的方式向客户端提供信息。替换后的 CIS 将保持有效直到卡片弹出，并且所有与元组相关的服务都使用替换内容而非实际的\
    \ CIS。\n\nLength 字段给出 Data 数组中的字节数。Data 数组可以视为卡片的属性内存。它应该包含所有所需的 CIS，包括初始的 CISPL_DEVICE\
    \ 元组和最终的 CISPL_END 元组。可以使用长链接（包括 CISPL_LONGLINK_MPFC）：所有地址都在替换空间中进行解释。该服务在版本 3.0\
    \ 中添加。\n\n返回代码：\n\n- CS_BAD_HANDLE: 客户端句柄无效。\n- CS_OUT_OF_RESOURCE: Card Services\
    \ 无法分配内存来存放替换的 CIS。\n\n## 3.5 内存窗口\n\n每个套字可以多多四个活跃的内存窗口，将卡内存部分映射到主机地址空间。设备可以寻址大多数公共和属性内存。窗口的大小通常是\
    \ 2 的幂。根据套字的能力，它们可能需要在主机和卡片空间中对齐到窗口大小的倍数。\n\n内存窗口通过调用 RequestWindow 初始化。某些属性可以使用\
    \ ModifyWindow 修改。映射到窗口的卡片内存段可以使用 MapPage 修改。窗口通过 ReleaseWindow 释放。与几乎所有其他子函数不同，内存函数作用于窗口句柄而非客户端句柄。\n\
    \n## 3.5.1 RequestWindow\n\n```c\nint CardServices(RequestWindow, client_handle_t\
    \ *handle, win_req_t *req);\n```\n\nwin_req_t 结构如下：\n\n```c\ntypedef struct win_req_t\
    \ {\n    u_int               Attributes;\n    u_long              Base;\n    u_int\
    \               Size;\n    u_int               AccessSpeed;\n} win_req_t;\n```\n\
    \nRequestWindow 将卡片内存映射到系统内存。输入时，handle 参数指向一个有效的客户端句柄。返回时，这将替换为窗口句柄，应用于后续的 ModifyWindow、MapPage\
    \ 和 ReleaseWindow 调用。\n\n可以在 Attributes 中指定以下标志：\n\n- WIN_MEMORY_TYPE: 此字段可以是公共内存\
    \ WIN_MEMORY_TYPE_CM 或属性内存 WIN_MEMORY_TYPE_AM。\n- WIN_DATA_WIDTH: 16 位访问 WIN_DATA_WIDTH_16\
    \ 或 8 位访问 WIN_DATA_WIDTH_8。\n- WIN_ENABLE: 设置此项时，开启窗口。\n- WIN_USE_WAIT: 指定控制器观察\
    \ MWAIT 信号。\n- WIN_MAP_BELOW_1MB: 请求窗口映射在 1MB 边界以下。这在某些平台上可能无法。\n- WIN_STRICT_ALIGN:\
    \ 请求基对齐到窗口大小的倍数。版本 3.1 添加。\n\nBase 指定系统内存中窗口物理地址。如果为零，Card Services 将 Base 设置为第一个可用窗口地址。Size\
    \ 指定窗口大小（字节）。如果为零，Card Services 将 Size 设置为主机支持的最小窗口大小。AccessSpeed 指定内存访问速度，单位为纳秒。\n\
    \n返回代码：\n\n- CS_BAD_HANDLE: 客户端句柄无效。\n- CS_NO_CARD: 分配给客户端的套字为空。\n- CS_BAD_ATTRIBUTE:\
    \ 请求了不支持的窗口属性。\n- CS_OUT_OF_RESOURCE: 该套字的最大内存窗口已在使用。\n- CS_IN_USE: RequestWindow\
    \ 无法找到空闲的系统内存。\n- CS_BAD_SIZE: 大无效。\n- CS_BAD_BASE: Base 或 Size 不符合套字的对齐规则。\n\n\
    ## 3.5.2 ModifyWindow\n\n```c\nint CardServices(ModifyWindow, window_handle_t\
    \ handle, modwin_t *mod);\n```\n\nmodwin_t 结构如下：\n\n```c\ntypedef struct modwin_t\
    \ {\n    u_int       Attributes;\n    u_int       AccessSpeed;\n} modwin_t;\n\
    ```\n\nModifyWindow 修改之前调用 RequestWindow 返回的窗口句柄的属性。可以更改以下属性：\n\n- WIN_MEMORY_TYPE:\
    \ 此字段可以是公共内存 WIN_MEMORY_TYPE_CM 或属性内存 WIN_MEMORY_TYPE_AM。\n- WIN_DATA_WIDTH: 16\
    \ 位访问 WIN_DATA_WIDTH_16 或 8 位访问 WIN_DATA_WIDTH_8。\n\n"
