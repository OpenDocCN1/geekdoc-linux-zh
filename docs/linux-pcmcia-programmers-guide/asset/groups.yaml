    MAP_OWS


    Requests zero wait states, as opposed to standard ISA bus timing.


    MAP_WRPROT


    Specifies that the map should be write protected.


    MAP_ATTRIB


    Specifies that the map should be for attribute (as opposed to common) memory.


    MAP_USE_WAIT


