    \ 在已注册的驱动程序列表中查找。如果是多功能卡，`function` 字段标识要绑定的卡功能。如果找到，则通过 `BindDevice` 调用将驱动绑定到该套接字和功能。然后，Driver\
    \ Services 会调用客户端的 `attach()` 入口创建一个设备实例。新的 `dev_link_t` 指针返回在 `instance`。\n-\
    \ DS_BIND_MTD: 最后，Driver Services 调用客户端的 `attach()` 入口创建一个设备实例。\n\n```c\ntypedef\
    \ struct mtd_info_t {\n    dev_info;\n    u_int attributes;\n    u_int offset;\n\
    } mtd_info_t;\n```\n\n此调用将 MTD 与设备关联。\n\n### 8.1 使用 Linux 驱动程序\n\n目前的许多客户端驱动程序使用\
