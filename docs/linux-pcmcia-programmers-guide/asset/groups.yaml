    # Card Services Subfunction Descriptions


    Additionally, the macro ERASE_IN_PROGRESS() will return a true condition for values
    of State that indicate an erase is being processed.


    The Size field gives the size of the erase request in bytes. The Offset field
    gives the offset from the start of the region. The size and offset should be aligned
    to erase block boundaries. The Optional field is not used by Card Services and
    may be used by the client driver.


    Return codes:


    CS_BAD_HANDLE


    The client handle is invalid.


    # 3.6.7 DeregisterEraseQueue


    ```

    int CardServices(DeregisterEraseQueue, eraseq_handle_t handle);

    ```


    DeregisterEraseQueue frees a queue previously registered by a call to RegisterEraseQueue.
    If there are any pending requests in the specified queue, the call will fail.


    Return codes:


    CS_BAD_HANDLE


    The erase queue handle is invalid.


    CS_BUSY


    The erase queue has erase requests pending.


    # 3.6.8 CheckEraseQueue


    ```

    int CardServices(CheckEraseQueue, eraseq_handle_t handle);

    ```


    This call notifies Card Services that there are new erase requests in a queue
    previously registered with RegisterEraseQueue.


    Typically, a client will initially assign each erase queue the state value ERASE_IDLE.
    When new requests are added to the queue, the client will set their states to
    ERASE_QUEUED, and call CheckEraseQueue. When the client is notified of an erase
    completion event, it will check the state field to determine whether the request
    was successful.


    Return codes:


    CS_BAD_HANDLE


    The erase queue handle is invalid.


    # 3.7 Miscellaneous calls


    # 3.7.1 GetCardServicesInfo


    ```

    int CardServices(GetCardServicesInfo, servinfo_t *servinfo);

    ```


