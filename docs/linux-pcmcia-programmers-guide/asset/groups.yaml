- md: "\n# 3. Card Services Subfunction Descriptions\n\nIO windows differ from memory\
    \ windows in host addresses that fall within a window are not modified before\
    \ they are passed on to an IO card. Effectively, the base addresses of the window\
    \ in the host and card address spaces are always equal. IO windows also have no\
    \ alignment or size restrictions; an IO window can start and end on any boundary\
    \ in the 4K IO address space.\n\nThe PC Card defines a single interrupt service\
    \ from the card to the controller. The controller has the responsibility of steering\
    \ this interrupt to an appropriate interrupt request ('Irq') line. All controllers\
    \ supporting steer Card interrupts to essentially any free interrupt line. Because\
    \ steering happens in the controller, the card itself is unaware of which interrupt\
    \ it uses.\n\nAll PC Controllers can generate interrupts in response to card status\
    \ changes. These interrupts are distinct from the IO interrupts generated by an\
    \ IO card, and use a separate interrupt line. Signals that generate interrupts\
    \ include card detect, ready/busy; write protect, battery low, and battery dead.\n\
    \n# 3. Card Services Subfunction Descriptions\n\nCard Services calls the general\
    \ form:\n\n```\n#include \"cs_types.h\"\n#include \"cs.h\"\n\nint CardServices(int\
    \ subfunc, void *arg1, void *arg2, ...);\n```\n\nSome Card Services functions\
    \ require additional #include statements. The particular subfunction determines\
    \ the number of expected arguments. A return code of CS_SUCCESS indicates that\
    \ a call succeeded. Other return codes identify errors.\n\n# 3.1 Client management\
    \ functions\n\nDevice drivers that use Card functions are called 'clients'. A\
    \ device driver should use the RegisterClient call to get a client handler before\
    \ using other services. Most Card Services functions will take this client handler\
    \ as an argument. Before unloading, drivers should also unregister with DeregisterClient.\n\
    \n# 3.1.1 RegisterClient\n\n```\nint CardServices(RegisterClient, client_handle_t\
    \ *client, client_reg_t *reg);\n```\n\nThe client_reg_t data structure is given\
    \ by:\n\n```c\ntypedef struct client_reg_t {\n    dev_info_t *dev_info;\n    Attributes;\n\
    \    u_int EventMask;\n    (*event_handler)(event_t event, int priority, event_callback_args_t\
    \ event_callback, event_callback_args_t *args);\n    u_int Version;\n} client_reg_t;\n\
    ```\n\n# 3. Card Services Subfunction Descriptions\n\nRegisterClient establishes\
    \ a link between a client driver and Card Services, and connects the client with\
    \ an appropriate socket. The dev_info parameter is used by Card Services to match\
    \ the client with a socket and function; this correspondence is normally established\
    \ by Driver Services via a call to BindDevice. If successful, a client handle\
    \ will be returned in client.\n\nThe following flags can be specified in Attributes:\n\
    \n- **INFO_MASTER_CLIENT**: For use only by the Driver Services. Among other things,\
    \ specifies that this client should not be automatically unbound when a card is\
    \ ejected from this socket.\n- **INFO_IO_CLIENT**: Specifies that this client\
    \ is an IO driver.\n- **INFO_MTD_CLIENT**: Specifies that this client is a Memory\
    \ Technology Driver.\n- **INFO_MEM_CLIENT**: Specifies that this client is a memory\
    \ card driver.\n- **INFO_CARD_SHARE**: Included for compatibility, has no effect.\n\
    - **INFO_CARD_EXCL**: Included for compatibility, has no effect.\n\nEventMask\
    \ specifies what events this client should be notified. The event_handler entry\
    \ point will be called by Card Services when an event in EventMask is processed.\
    \ The event_handler_args structure is a template for the structure that will be\
    \ passed to the event handler. The Version parameter identifies the Card Services\
    \ level that this driver expects; it is currently ignored.\n\nA driver should\
    \ be prepared to handle Card Services events before calling RegisterClient. This\
    \ call will always generate a CS_REGISTRATION_COMPLETE event, and may also generate\
    \ an artificial CS_CARD_INSERTION event if the socket is currently occupied.\n\
    \nReturn codes:\n\n- **CS_OUT_QF_RESOURCE**: An appropriate socket could not be\
    \ found for this driver.\n\n# 3.1.2 DeregisterClient\n\n```\nint CardServices(DeregisterClient,\
    \ client_handle_t client);\n```\n\nDeregisterClient severs the connection between\
    \ a client and Card Services. It should be called after the client has freed any\
    \ resources it has allocated. Once a connection is broken, it cannot be reestablished\
    \ until after another call to BindDevice.\n\nReturn codes:\n\n- **CS_BAD_HANDLE**:\
    \ The client handle is invalid.\n- **CS_IN_USE**: The client still has allocated\
    \ resources, such as IO port windows or an interrupt, or the socket configuration\
    \ is locked.\n\n# 3.1.3 SetEventMask\n\n```\nint CardServices(SetEventMask, client_handle_t\
    \ client, eventmask_t *mask);\n```\n\nThe eventmask_t structure is given by:\n\
    \n```c\ntypedef struct eventmask_t {\n    u_int Attributes;\n    u_int EventMask;\n\
    } eventmask_t;\n```\n\nSetEventMask updates the mask that determines which events\
    \ this client will be notified.\n\nReturn codes:\n\n- **CS_BAD_HANDLE**: The client\
    \ handle is invalid.\n\n# 3.1.4 BindDevice\n\n```\nint CardServices(BindDevice,\
    \ bind_req_t *req);\n```\n\nThe bind_req_t structure is given by:\n\n```c\ntypedef\
    \ struct bind_req_t {\n    socket_t Socket;\n    u_char Function;\n    dev_info_t\
    \ *dev_info;\n} bind_req_t;\n```\n\nBindDevice associates a device with a particular\
    \ socket. It is normally called Driver Services after a newly inserted card has\
    \ been identified. Once a driver has been bound to a socket, it will be eligible\
    \ to register as a client of that socket. Note that this call does not take a\
    \ client handle as an argument. This is the only Card Service that takes a socket\
    \ number as an argument.\n\nFunction field specifies which function(s) of a multifunction\
    \ card are to be bound to this driver. Function numbers correspond to entries\
    \ in the card's CISPL_LONGLINK_MFC tuple. If Function is set to BIND_FN_ALL, the\
    \ driver will be bound to all card functions. A driver will only be able to access\
    \ CIS tuples corresponding to functions for which it is bound.\n\nReturn codes:\n\
    \n- **CS_BAD_SOCKET**: The specified socket number is invalid.\n\n# 3.2 Socket\
    \ state control\n\nThese functions are more or less concerned with getting and\
    \ setting the current operating state of a socket. GetStatus returns the current\
    \ socket state. ResetCard is used to send a hard reset signal to a socket. SuspendAnd\
    \ ResumeCard can be used to power down and power up a socket. EjectCard and InsertCard\
    \ mimic real card events.\n\n# 3.2.1 GetStatus\n\n```\nint CardServices(GetStatus,\
    \ client_handle_t client, cs_status_t *status);\n```\n\nThe cs_status_t structure\
    \ is given by:\n\n```c\ntypedef struct cs_status_t {\n    u_char Function;\n \
    \   u_int CardState;\n    u_int SocketState;\n} cs_status_t;\n```\n\nGetStatus\
    \ returns the current status of a client. For clients configured in IO mode, GetStatus\
    \ uses the CardState to determine the socket state. For normal clients, the Function\
    \ field is ignored, but for clients with BIND_FN_ALL, this specifies the function.\n\
    \nThe following flags are defined in CardState:\n\n- **CS_EVENT_CARD_DETECT**:\
    \ Specifies that the socket is occupied.\n- **CS_EVENT_CB_DETECT**: Specifies\
    \ that the socket is occupied by a CardBus device.\n- **CS_EVENT_WRITE_PROTECT**:\
    \ Specifies that the card is protected.\n- **CS_EVENT_BATTERY_LOW**: Specifies\
    \ that the card is low.\n- **CS_EVENT_BATTERY_DEAD**: Specifies that the card\
    \ is dead.\n- **CS_EVENT_READY_CHANGE**: Specifies that the card is ready.\n-\
    \ **CS_EVENT_PM_SUSPEND**: Specifies that the socket is suspended.\n- **CS_EVENT_REQUEST_ATTENTION**:\
    \ Specifies that the attention bit in the extended status is set.\n- **CS_EVENT_CARD_INSERTION**:\
    \ Specifies that a card insertion event is in progress. An insertion event will\
    \ be sent to the client when socket setup is complete.\n- **CS_EVENT_3VCARD**:\
    \ Indicates that the card supports 3.3V operation.\n- **CS_EVENT_XVCARD**: Indicates\
    \ that the card supports “X.X”V operation. The actual voltage is currently undefined\
    \ in the specification.\n\nSocketState is currently unused, but in theory, it\
    \ should latch changes in the state of CardState.\n\nReturn codes:\n\n- **CS_BAD_HANDLE**:\
    \ The client handle is invalid.\n\n# 3.2.2 ResetCard\n\n```\nint CardServices(ResetCard,\
    \ client_handle_t client);\n```\n\nResetCard requests a client's socket be reset.\
    \ When this call is made, Card Services sends all clients a CS_EVENT_RESET_REQUEST\
    \ event. If any client rejects the request, Card Services sends the initiating\
    \ client a CS_EVENT_RESET_COMPLETE event with event_callback_args.info set to\
    \ the return code of the client that rejected the request.\n\nIf all clients agree\
    \ to the request, Card Services sends a CS_EVENT_RESET_PHYSICAL event, then resets\
    \ the socket. When the socket signals that it is ready, a CS_EVENT_CARD_RESET\
    \ event is generated. Finally, the CS_EVENT_RESET_COMPLETE event is sent to the\
    \ initiating client, with event_callback_args.info set to zero.\n\nReturn codes:\n\
    \n- **CS_BAD_HANDLE**: The client handle is invalid.\n- **CS_NO_CARD**: The socket\
    \ assigned to this client is currently vacant.\n- **CS_IN_USE**: This socket is\
    \ currently being reset.\n\n# 3.2.3 SuspendCard\n\n```\nint CardServices(SuspendCard,\
    \ client_handle_t client);\n```\n"
  mdcn: "\n\n# 3. Card Services 子函数描述\n\nIO 窗口与内存窗口的区别在于，落在窗口内的主机地址在传递给 IO 卡之前不会被修改。从本质上讲，主机空间和卡地址空间中窗口的基地址始终是相等的。IO\
    \ 窗口没有对齐或大小限制；IO 窗口可以在 4K IO 地址空间内的任何边界开始和结束。\n\nPC 卡定义了从卡到控制器的单路中断服务。控制器负责将此中断路由到适当的中断请求（'Irq'）线。所有支持路由卡中断的控制器都可以将其路由到几乎任何空闲的中线上。由于路由是在控制器中进行的，卡本身并不知道它使用的是哪种中断。\n\
    \n所有 PC 控制器都可以响应卡状态的变化产生中断。这些中断与由 IO 卡生成的 IO 中断不同，并使用独立的中断线。产生中断的信号包括卡检测、就绪/忙；写保护、电池电量低和电池耗尽。\n\
    \n# 3. Card Services 子函数描述\n\nCard Services 的通用形式：\n\n```\n#include \"cs_types.h\"\
    \n#include \"cs.h\"\n\nint CardServices(int subfunc, void *arg1, void *arg2, ...);\n\
    ```\n\n某些 Card Services 函数需要额外的 #include 语句。特定的子函数决定了预期的参数数量。返回代码 `CS_SUCCESS`\
    \ 表示调用成功。其他返回代码标识错误。\n\n# 3.1 客户端管理函数\n\n使用卡函数的设备驱动程序被称为“客户端”。设备驱动程序在使用其他服务之前，应该使用\
    \ `RegisterClient` 调用获取客户端句柄。大多数 Card Services 函数将此此客户端句柄作为参数。在卸载之前，驱动程序还应该通过\
    \ `DeregisterClient` 取消注册。\n\n# 3.1.1 RegisterClient\n\n```\nint CardServices(RegisterClient,\
    \ client_handle_t *client, client_reg_t *reg);\n```\n\n`client_reg_t` 数据结构如下：\n\
    \n```c\ntypedef struct client_reg_t {\n    dev_info_t *dev_info;\n    Attributes;\n\
    \    u_int EventMask;\n    (*event_handler)(event_t event, int priority, event_callback_args_t\
    \ event_callback, event_callback_args_t *args);\n    u_int Version;\n} client_reg_t;\n\
    ```\n\n# 3. Card Services 子函数描述\n\n`RegisterClient` 在客户端驱动程序与 Card Services 之间建立链接，并将客户端连接到适当的插槽。Card\
    \ Services 使用 dev_info 参数匹配客户端与插槽及函数；这种对应通常由 Driver Services 通过调用 `BindDevice`\
    \ 建立。如果成功，将在 client 中返回一个客户端句柄。\n\n在 Attributes中中可以指定以下标志：\n\n- **INFO_MASTER_CLIENT**:\
    \ 仅供 Driver Services 使用。此外，指定当卡从此插槽拔出时，此客户端不应自动取消绑定。\n- **INFO_IO_CLIENT**: 指定此客户端是\
    \ IO 驱动程序。\n- **INFO_MTD_CLIENT**: 指定此客户端是内存技术驱动程序（MTD）。\n- **INFO_MEM_CLIENT**:\
    \ 指定此客户端是内存卡驱动程序。\n- **INFO_CARD_SHARE**: 为了兼容性而包含，无作用。\n- **INFO_CARD_EXCL**:\
    \ 为了兼容性而包含，无作用。\n\n`EventMask` 指定此客户端应该接收哪些事件的通知。当 EventMask 中的事件被处理时，Card Services\
    \ 将调用 `event_handler` 入口。`event_handler_args` 结构是传递给事件处理程序的结构模板。`Version` 参数标识该驱动程序期望的\
    \ Card Services 级别；目前被忽略。\n\n驱动程序在调用 `RegisterClient` 之前应该准备好处理 Card Services\
    \ 事件。此调用将始终生成一个 `CS_REGISTRATION_COMPLETE` 事件，如果插槽当前被占用，还可能生成一个人工的 `CS_CARD_INSERTION`\
    \ 事件。\n\n返回代码：\n\n- **CS_OUT_QF_RESOURCE**: 为此驱动程序找不到适当的插槽。\n\n# 3.1.2 DeregisterClient\n\
    \n```\nint CardServices(DeregisterClient, client_handle_t client);\n```\n\n`DeregisterClient`\
    \ 断开客户端与 Card Services 之间的连接。应在客户端释放其分配的资源后调用。一旦连接中断，在再次调用 `BindDevice` 之前无法重新建立。\n\
    \n返回代码：\n\n- **CS_BAD_HANDLE**: 客户端句柄无效。\n- **CS_IN_USE**: 客户端仍分配了资源，例如 IO 窗口或中断，或插槽配置被锁定。\n\
    \n# 3.1.3 SetEventMask\n\n```\nint CardServices(SetEventMask, client_handle_t\
    \ client, eventmask_t *mask);\n```\n\n`eventmask_t` 结构如下：\n\n```c\ntypedef struct\
    \ eventmask_t {\n    u_int Attributes;\n    u_int EventMask;\n} eventmask_t;\n\
    ```\n\n`SetEventMask` 更新决定哪些事件将通知此客户端。\n\n返回代码：\n\n- **CS_BAD_HANDLE**: 客户端句柄无效。\n\
    \n# 3.1.4 BindDevice\n\n```\nint CardServices(BindDevice, bind_req_t *req);\n\
    ```\n\n`bind_req_t` 结构如下：\n\n```c\ntypedef struct bind_req_t {\n    socket_t Socket;\n\
    \    u_char Function;\n    dev_info_t *dev_info;\n} bind_req_t;\n```\n\n`BindDevice`\
    \ 将设备与特定的插槽关联。通常在识别到新插入卡后由 Driver Services 调用。一旦驱动绑定到插槽，就可以成为该插槽的客户端。注意，此调用不接受客户端句柄作为参数。它是唯一接受插槽号作为参数的\
    \ Card Service。Function 字段指定将多功能卡的哪些功能绑定到此驱动程序。如果 Function 设置为 `BIND_FN_ALL`，驱动程序将绑定到所有卡功能。驱动程序能够访问与其对应的\
    \ CIS 元组。\n\n返回代码：\n\n- **CS_BAD_SOCKET**: 指定插槽号无效。\n\n# 3.2 插槽状态\n\n这些函数更多地关注获取和设置插槽的当前状态。`GetStatus`\
    \ 返回当前槽状态。`ResetCard` 用于向插槽发送硬复位信号。`SuspendAndResumeCard` 用于插槽掉电和上电。`EjectCard`\
    \ 和 `InsertCard` 模拟卡事件。\n\n# 3.2.1 GetStatus\n\n```\nint CardServices(GetStatus,\
    \ client_handle_t client, cs_status_t *status);\n```\n\n`cs_status_t` 结构如下：\n\n\
    ```c\ntypedef struct cs_status_t {\n    u_char Function;\n    u_int CardState;\n\
    \    u_int SocketState;\n} cs_status_t;\n```\n\n`GetStatus` 返回客户端的当前状态。对于配置为 IO\
    \ 模式的客户端，`GetStatus` 使用 `CardState` 来确定插槽状态。对于普通客户端，`Function` 字段被忽略，但对于 `BIND_FN_ALL`\
    \ 客户端，它指定了功能。\n\n`CardState` 定义了以下标志：\n\n- **CS_EVENT_CARD_DETECT**: 插槽被占用。\n\
    - **CS_EVENT_CB_DETECT**: 插槽被 CardBus 设备占用。\n- **CS_EVENT_WRITE_PROTECT**: 卡被保护。\n\
    - **CS_EVENT_BATTERY_LOW**: 卡电量低。\n- **CS_EVENT_BATTERY_DEAD**: 卡电池耗尽。\n- **CS_EVENT_READY_CHANGE**:\
    \ 卡已就绪。\n- **CS_EVENT_PM_SUSPEND**: 插槽已挂起。\n- **CS_EVENT_REQUEST_ATTENTION**:\
    \ 扩展状态中的注意位已设置。\n- **CS_EVENT_CARD_INSERTION**: 正在进行卡插入事件。当插槽设置完成后，将插入事件发送给客户端。\n\
    - **CS_EVENT_3VCARD**: 表示卡支持 3.3V 操作。\n- **CS_EVENT_XVCARD**: 表示卡支持“X.X”V 操作。实际电压在规范中尚未定义。\n\
    \n`SocketState` 目前未使用，但在理论上，它应该锁存 `CardState` 状态的变化。\n\n返回代码：\n\n- **CS_BAD_HANDLE**:\
    \ 客户端句柄无效。\n\n# 3.2.2 ResetCard\n\n```\nint CardServices(ResetCard, client_handle_t\
    \ client);\n```\n\n`ResetCard` 请求重置客户端的插槽。当调用此函数时，Card Services 向所有客户端发送 `CS_EVENT_RESET_REQUEST`\
    \ 事件。如果任何客户端拒绝请求，Card Services 向发起请求的客户端发送 `CS_EVENT_RESET_COMPLETE` 事件，并将 `event_callback_args.info`\
    \ 设置为拒绝请求客户端的返回代码。\n\n如果所有客户端都同意请求，Card Services 发送 `CS_EVENT_RESET_PHYSICAL`\
    \ 事件，然后重置插槽。当插槽信号其就绪时，会生成 `CS_EVENT_CARD_RESET` 事件。最后，向发起请求的客户端发送 `CS_EVENT_RESET_COMPLETE`\
    \ 事件，并将 `event_callback_args.info` 设置为零。\n\n返回代码：\n\n- **CS_BAD_HANDLE**: 客户端句柄无效。\n\
    - **CS_NO_CARD**: 分配给此客户端的插槽当前为空。\n- **CS_IN_USE**: 此插槽当前正在重置。\n\n# 3.2.3 SuspendCard\n\
    \n```\nint CardServices(SuspendCard, client_handle_t client);\n```\n\n"
