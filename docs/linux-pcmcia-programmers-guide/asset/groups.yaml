    \ for most of the configuration details, and the contents of the request structures\
    \ are ignored.\n\n### 3.3.1 RequestIO\n\n```\nint CardServices(RequestIO, client_handle_t\
    \ client, io_req_t *req);\n```\n\nThe io_req_t data structure is given by:\n\n\
    ```\ntypedef struct io_req_t {\n    ioaddr_t BasePort1;\n    ioaddr_t NumPorts1;\n\
    \    u_int Attributes1;\n    ioaddr_t BasePort2;\n    ioaddr_t NumPorts2;\n  \
    \  u_int Attributes2;\n    u_int IOAddrLines;\n} io_req_t;\n```\n\nRequestIO reserves\
    \ port windows for a card. BasePort1 specifies the base IO port address of the\
