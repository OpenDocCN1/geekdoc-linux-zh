    ```\n\n`cistpl_longlink_mfc_t` 结构体如下：\n\n```c\ntypedef struct cistpl_longlink_mfc_t\
    \ {\n    int nfn;\n    struct {\n        u_char space;\n        u_int addr;\n\
    \    } fn[CISTPL_FUNCTIONS];\n} cistpl_longlink_mfc_t;\n```\n\n### 4.1.3 CISTPL_DEVICE,\
    \ CISTPL_DEVICE_A\n\n`cistpl_device_t` 结构体如下：\n\n```\ntypedef struct cistpl_device_t\
    \ {\n    int ndev;\n    struct {\n        u_char type;\n        u_char wp;\n \
