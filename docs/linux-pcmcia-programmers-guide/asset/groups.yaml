  mdcn: "\n\n# 9. 插槽驱动程序层\n\n-   MAP_16BIT: 指定映射应配置为 16 位访问（与 8 位访问相反）。\n-   MAP_AUTOSZ:\
    \ 指定映射应配置为响应卡的 IOCS16 自动调整总线访问大小。\n-   MAP_OWS: 请求零等待状态，与标准的 ISA 总线定时相反。\n-  \
    \ MAP_WRPROT: 指定映射应写保护。\n-   MAP_USE_WAIT: 指定访问时序应遵守卡的 WAIT 信号。\n-   MAP_PREFETCH:\
    \ 指定此映射可以配置为预取。\n\n## 9.2.6 SS_GetMemMap, SS_SetMemMap\n\n```\nint (*ss_entry)(u_int\
    \ sock, SS_GetMemMap, pcard_mem_map *);\nint (*ss_entry)(u_int sock, SS_SetMemMap,\
    \ pcard_mem_map *);\n```\n\npcard_mem_map 数据结构定义如下：\n\n```ctypedef struct pcard_mem_map\
    \ {\n    u_char      map;\n    u_char      flags;\n    u_short     speed;\n  \
    \  u_long      sys_start, sys_stop;\n    u_int       card_start;\n} pcard_mem_map;\n\
    ```\n\nmap 字段指定映射编号。speed 字段指定以纳秒为的的访问。sys_start 和 sys_stop 字段给出主机物理地址空间中窗口的起始和结束地址。card_start\
    \ 值指定映射到 sys_start 的卡地址。Linux Card Services 层假设每个插槽至少有四个独立配置的内存窗口。\n\n-   MAP_ACTIVE:\
    \ 指定地址映射应被启用。\n-   MAP_16BIT: 指定映射应配置为 16 位访问（与 8 位访问相反）。\n-   MAP_AUTOSZ: 指定映射应配置为响应卡的\
    \ IOCS16 信号自动调整总线访问大小。\n-   MAP_OWS: 请求零等待状态，与标准的 ISA 总线定时相反。\n-   MAP_WRPROT:\
    \ 指定映射应写保护。\n-   MAP_ATTRIB: 指定映射应为属性内存（而非普通内存）。\n-   MAP_USE_WAIT: 指定访问时序应遵守卡的\
    \ WAIT 信号。\n\n## 9.2.7 SS_GetBridge, SS_SetBridge\n\n```c\nint (*ss_entry)(u_int\
    \ sock, SS_GetBridge, cb_bridge_map*);\nint (*ss_entry)(u_int sock, SS_SetBridge,\
    \ cb_bridge_map*);\n```\n\ncb_bridge_map 数据结构定义如下：\n\n```ctypedef struct cb_bridge_map\
    \ {\nu_char map;\nu_char flags;\nu_int start, stop;\n} cb_bridge_map;\n```\n\n\
    SS_GetBridge 和 SS_SetBridge 入口用于为 CardBus 设备配置桥接地址窗口。它们与 16 位 IO 和内存映射服务类似。假设每个\
    \ CardBus 插槽至少有两个 IO 和两个内存桥接窗口。flags 字段由组成：\n\n-   MAP_ACTIVE: 指定地址映射应被启用。\n-\
    \   MAP_PREFETCH: 指定此映射可以配置为预取。\n-   MAP_IOSPACE: 指定该空间为 I/O 空间（而非内存空间）。\n\n##\
    \ 9.2.8 SS_ProcSetup\n\n```c\nint (*ss_entry)(u_int sock, SS_ProcSetup, struct\
    \ proc_dir_entry *base);\n```\n\nCard Services 使用此入口为插槽驱动程序提供一个 procfs 目录句柄，驱动程序可以在为特定插槽创建状态文件。插槽驱动程序负责在卸载前删除任何\
    \ proc 条目。\n\n# 9.3 支持异常的插槽架构\n\nSocket Services 接口面向允许 PCMCIA 卡配置为模拟具有相同功能的原生系统设备的插槽控制器。PCIA\
    \ 标准规定，插槽控制器应为每个插槽提供两个 IO 和内存窗口，这些窗口可以在主机地址空间中进行独立配置和定位，并映射到地址空间的任意分段。某些控制器和架构并不提供此功能。\n\
    \n"
