  - "[PAGE 68]\n\n# 9. The Socket Driver Layer\n\nSS_STSCHG\n\nIO card status changes.\n\
    \nThe Vcc and Vpp parameters are in units of 0.1 volts. If non-zero, io_irq specifies\
    \ an interrupt number to be assigned to the card, in IO mode. The following fields\
    \ are defined in flags:\n\nSS_PWR_AUTO\n\nIndicates that the socket should automatically\
    \ power up sockets at card insertion time, if supported.\n\nSS_IOCARD\n\nIndicates\
    \ that the socket should be configured for “memory and IO” interface mode, as\
    \ opposed to simple memory card mode.\n\nSS_RESET\n\nIndicates that the card's\
    \ hardware reset signal should be raised.\n\nSS_SPKR_ENA\n\nIndicates that speaker\
    \ output should be enabled for this socket.\n\nSS_OUTPUT_ENA\n\nIndicates that\
    \ data signals to the card should be activated.\n\n# 9.2.5 SS_GetIOOMap, SS_SetIOOMap\n\
    \n```\nint (*ssentry)(u_int sock, SS_GetIOOMap, pccard_io_map *);\nint (*ssentry)(u_int\
    \ sock, SS_SetIOOMap, pccard_io_map *);\n```\n\nThe pccard_io_map data structure\
    \ is given by:\n\n```\ntypedef struct pccard_io_map {\n  u_char          map;\n\
    \  u_char          flags;\n  u_short         speed;\n  u_short         start,\
    \ stop;\n} pccard_io_map;\n```\n\nThe SS_GetIOOMap and SS_SetIOOMap entries are\
    \ used to configure IO space windows. IO windows are assumed to not support address\
    \ translation. The Linux Card Services layer assumes that each socket has at least\
    \ two independently configurable IO port windows.\n\nThe map field specifies which\
    \ IO map should be accessed. The speed field is the map access speed in nanoseconds.\
    \ The start and stop fields give the lower and upper addresses for the IO map.\
    \ The flags field is composed of the following:\n\nMAP_ACTIVE\n\nSpecifies that\
    \ the address map should be enabled."
- md: "\n# 9. The Socket Driver Layer\n\n- MAP_16BIT:Specifies that the map should\
    \ be configured for 16-bit accesses (as opposed to 8-bit).\n- MAP_AUTOSZ:Specifies\
    \ that the map should be configured to auto-size bus accesses in response to the\
    \ card's IOCS16.\n- MAP_OWS:Requests zero wait states, as opposed to standard\
    \ ISA bus timing.\n- MAP_WRPROT:Specifies that the map should be write protected.\n\
    - MAP_USE_WAIT:Specifies that access timing should respect the card's WAIT signal.\n\
    - MAP_PREFETCH:Specifies that this map may be configured for prefetching.\n\n\
    ## 9.2.6 SS_GetMemMap, SS_SetMemMap\n\n```\nint (*ss_entry)(u_int sock, SS_GetMemMap,\
    \ pcard_mem_map *);\nint (*ss_entry)(u_int sock, SS_SetMemMap, pcard_mem_map *);\n\
    ```\n\nThe pcard_mem_map data structure is given by:\n\n```ctypedef struct pcard_mem_map\
    \ {\n    u_char      map;\n    u_char      flags;\n    u_short     speed;\n  \
    \  u_long      sys_start, sys_stop;\n    u_int       card_start;\n} pcard_mem_map;\n\
    ```\n\nThe map field specifies the map number. The speed field specifies an access\
    \ speed in nanoseconds. The sys_start and sys_stop fields give the starting and\
    \ ending addresses for the window in the host's physical address space. The card_start\
    \ value specifies the card address to be mapped to sys_start. The Linux Card Services\
    \ layer assume that each socket has at least four independently configurable memory\
    \ windows.\n\n- MAP_ACTIVE:Specifies that the address map should be enabled.\n\
    - MAP_16BIT:Specifies that the map should be configured for 16-bit accesses (as\
    \ opposed to 8-bit).\n- MAP_AUTOSZ:Specifies that the map should be configured\
    \ to auto-size bus accesses in response to the card's IOCS16 signal.\n- MAP_OWS:Requests\
    \ zero wait states, as opposed to standard ISA bus timing.\n- MAP_WRPROT:Specifies\
    \ that the map should be write protected.\n- MAP_ATTRIB:Specifies that the map\
    \ should be for attribute (as opposed to common) memory.\n- MAP_USE_WAIT:Specifies\
    \ that access timing should respect the card's WAIT signal.\n\n## 9.2.7 SS_GetBridge,\
    \ SS_SetBridge\n\n```c\nint (*ss_entry)(u_int sock, SS_GetBridge, cb_bridge_map*);\n\
    int (*ss_entry)(u_int sock, SS_SetBridge, cb_bridge_map*);\n```\n\nThe cb_bridge_map\
    \ data structure is given by:\n\n```ctypedef struct cb_bridge_map {\nu_char map;\n\
    u_char flags;\nu_int start, stop;\n} cb_bridge_map;\n```\n\nThe SS_GetBridge and\
    \ SS_SetBridge entry points are used for configuring bridge address windows for\
    \ CardBus devices. They are similar to the 16-bit IO and memory map services.\
    \ It is assumed that each CardBus socket has at least two IO and two memory bridge\
    \ windows. The flags field is composed of:\n\n- MAP_ACTIVE:Specifies that the\
    \ address map should be enabled.\n- MAP_PREFETCH:Specifies that this map can be\
    \ configured for prefetching.\n- MAP_IOSPACE:Specifies that this space is for\
    \ I/O space (as opposed to memory space).\n\n## 9.2.8 SS_ProcSetup\n\n```c\nint\
    \ (*ss_entry)(u_int sock, SS_ProcSetup, struct proc_dir_entry *base);\n```\n\n\
    Card Services use this entry point to give the socket driver a procfs directory\
    \ handle under which it may create status files for a specific socket. It is the\
    \ socket driver's responsibility to delete any proc entries before it is unloaded.\n\
