- md: "\n# 4. Card Information Structure Definitions\n\nCISTPPL_FUNCID_MEMORY\nA simple\
    \ memory device.\n\nCISTPPL_FUNCID_SERIAL\nA serial port or modem device.\n\n\
    CISTPPL_FUNCID_PARALLEL\nA parallel port device.\n\nCISTPPL_FUNCID_FIXED\nA fixed\
    \ disk device.\n\nCISTPPL_FUNCID_VIDEO\nA video interface.\n\nCISTPPL_FUNCID_NETWORK\n\
    A network adapter.\n\nCISTPPL_FUNCID_AIMS\nAn auto-incrementing mass storage device.\n\
    \nThe following flags are defined in sysinit:\n\nCISTPPL_SYSINIT_POST\nIndicates\
    \ that the system should attempt to configure this card during its power-on initialization.\n\
    \nCISTPPL_SYSINIT_ROM\nIndicates that the card contains a system expansion ROM\
    \ that should be configured at boot time.\n\n## 4.1.14 CISTPL_DEVICE_GEO\n\nThe\
    \ cistpl_device_geo_t structure is given by:\n\n```\ntypedef struct cistpl_device_geo_t\
    \ {\n    int\n    ngeo;\n    struct {\n        u_char  buswidth;\n        u_int\
    \   erase_block;\n        u_int   read_block;\n        u_int   write_block;\n\
    \        u_int   partition;\n        u_int   interleave;\n    } geo(CISTPL_MAX_DEVICES);\n\
    } cistpl_device_geo_t;\n```\n\nThe erase_block, read_block, and write_block sizes\
    \ are in units of buswidth times interleave.\nThe partition size is in units of\
    \ erase_block.\n\n## 4.1.15 CISTPL_VERS_2\n\ncistpl_vers_2_t structure is given\
    \ by:\n\n```\ntypedef struct cistpl_vers_2_t {\n    u_char       vers;\n    u_char\
    \       comply;\n    u_short      dindex;\n    u_char       vspec8, vspec9;\n\
    \    u_char       nhdr;\n    int          vendor, info;\n    char         str[244];\n\
    } cistpl_vers_2_t;\n```\n\nThe vers field should be 0. The comply flag indicates\
    \ the degree of standard compliance and also be 0. The dindex field reserves the\
    \ specified number of bytes at the start of common memory. The vspec8 and vspec9\
    \ fields may contain vendor-specific information. The nhdr field gives the number\
    \ of copies of the CIS that are present on this card. The str array two strings:\
    \ a vendor name, and an informational message describing the card. The offset\
    \ of the vendor string is given by vendor, and the offset of the product string\
    \ is in info.\n\n## 4.1.16 CISTPL_ORG\n\ncistpl_org_t structure is given by:\n\
    \n```\ntypedef struct cistpl_org_t {\n    u_char  data_org;\n    char    desc[30];\n\
    ```\n\nThis tuple describes the data organization of a memory partition. The following\
    \ values are defined for data_org:\n\n- CISTPL_ORG_FS\nThe partition contains\
    \ a filesystem.\n- CISTPL_ORG_APPSPEC\nThe partition is in an application specific\
    \ format.\n- CISTPL_ORG_XIP\nThe partition follows the Execute-In-Place specification.\n\
    \nThe desc field gives a text description of the data organization.\n\n## 4.1.17\
    \ CISTPL_FORMAT\n\ncistpl_format_t structure is given by:\n\n```\ntypedef struct\
    \ cist_org_t {\n  u_char  type;\n  u_char  edc;\n  u_int   offset;\n  u_int  \
    \ length;\n}\n```\n\nThis tuple describes the data recording format for a memory\
    \ region. The following values are defined for type:\n\nCISTPL_FORMAT_DISK\nThe\
    \ partition uses a disk-like format.\n\nCISTPL_FORMAT_MEM\nThe partition uses\
    \ a memory-like format.\n\nThe following values are defined for edc:\n\nCISTPL_EDC_NONE\n\
    No error detection code is used.\nCISTPL_EDC_CKSUM\nEach block has a one-byte\
    \ arithmetic checksum.\nCISTPL_EDC_CRC\nEach block has a two-byte cyclic redundancy\
    \ check.\nCISTPL_EDC_PCC\nThe entire partition has a one-byte checksum.\n\nThe\
    \ offset specifies the address of the first data byte, and length specifies the\
    \ total number of bytes in this partition.\n\n## 4.2 CIS configuration register\
    \ definitions\n\nThe PC standard defines a few standard configuration registers\
    \ located in a card's memory space. A card's CONFIG tuple specifies which of these\
    \ registers are implemented. Programs using these definitions include:\n\n```\n\
    #include \"cisreg.h\"\n```\n\n## 4.2.1 Configuration Option Register\n\nThis register\
    \ should be present for virtually all I/O cards. Writing to this register selects\
    \ a configuration table entry and enables a card's IO functions.\n\nThe following\
    \ bit fields are defined:\n\n- COR_CONFIG_MASK\nSpecifies the configuration table\
    \ index describing the card's current operating mode.\n- COR_LEVEL_REQ\nSpecifies\
    \ that the card should generate level mode (edge-triggered) interrupts, the default.\n\
    - COR_SOFT_RESET\nSetting this bit performs a “soft” reset operation. Drivers\
    \ should use the ResetCard call to reset a card.\n\n## 4.2.2 Card Configuration\
    \ and Status Register\n\nThe following bit fields are defined:\n\n- CCSR_INTR_ACK\n\
    If this bit is set, the CCSR_INTR_PENDING bit will remain set until it is cleared.\n\
    - CCSR_INTR_PENDING\nSignals that the card is currently asserting an interrupt.\
    \ This signal may be helpful for interrupt sharing.\n- CCSR_POWER_DOWN\nSetting\
    \ this bit signals the card should enter power down state.\n- CCSR_AUDIO_ENA\n\
    Specifies that the card's audio output should be enabled.\n- CCSR_ISS\nThis is\
    \ used by the host to indicate that it can only perform 8-bit IO operations be\
    \ carried out as 16-bit accesses.\n- CCSR_SIGCHG_ENA\nThis indicates to the card\
    \ that it should use SIGCHG signal to indicate changes in WP, READY, and BVD2\
    \ signals.\n- CCSR_CHANGED\nThis bit signals to the host that one of the signals\
    \ has changed.\n\n## 4.2.3 Pin Replacement Register\n\nSignals in this register\
    \ replace signals that are not available when socket is operating in memory and\
    \ IO mode. An IO card will normally assert the SIGCHG signal to indicate one of\
    \ these signals changed, a driver can pull this register to find out.\n\nThe following\
    \ bit fields are defined:\n\n- PRR_WP_STATUS\nThe current state of the write protect\
    \ signal.\n- PRR_READY_STATUS\nThe current state of the ready signal.\n- PRR_BVD2_STATUS\n\
    The current state of battery warn signal.\n- PRR_BVD1_STATUS\nThe current state\
    \ of battery dead signal.\n- PRR_WP_EVENT\nIndicates that the write protect signal\
    \ has changed state since the PRR register was last read.\n- PRR_READY_EVENT\n\
    Indicates that the ready signal has changed state since the PRR register was last\
    \ read.\n- PRR_BVD2_EVENT\nIndicates that the battery warn signal has changed\
    \ state since the PRR register was last read.\n- PRR_BVD1_EVENT\nIndicates that\
    \ the battery dead signal has changed state since the PRR register was last read.\n\
    \nThis register can also be written. In this case, STATUS bits act as a mask;\
    \ if a bit is set, the corresponding EVENT bit is updated.\n\n## 4.2.4 Socket\
    \ and Copy Register\n\nThis register is used when identical cards may be set up\
    \ to share the same range of IO ports, to emulate an ISA card that would control\
    \ several devices. For example, an ISA hard drive controller might control several\
    \ drives, selectable by writing a drive number to an IO port. For several card\
    \ drives to emulate this interface, each needs to “know” which drive it is, so\
    \ that it can identify which IO operations intended for it.\n\nThe following bit\
    \ fields are defined:\n\n- SCR_SOCKET_NUM\nThis should indicate the socket number\
    \ which the card is located.\n- SCR_COPY_NUM\nIf several identical cards are installed\
    \ in a system, this field should be set to a unique number identifying which of\
    \ the cards this is.\n\n## 4.2.5 Extended Status Register\n\nThe following bit\
    \ fields are defined:\n\n- ESR_REQ_ATTN_ENA\nWhen set, the CCSR_CHANGED bit will\
    \ be set when the ESR_REQ_ATTN bit is set, possibly generating a status interrupt.\n\
    - ESR_REQ_ATTN\nSignals a card event, such as an incoming call for a modem.\n\n\
    ## 4.2.6 IO Base and Size Registers\n\nFor multifunction cards, these registers\
    \ are used to tell the card how the host IO windows have been configured for each\
    \ card. There are four IO Base registers, CISREG_IOBASE_0 to CISREG_IOBASE_3,\
    \ for the low-order high-order bytes of an IO address up to 32 bits. CISREG_SIZE\
    \ register is supposed to be written as the number of IO ports allocated, minus\
    \ one. For MFC-compliant cards, Card Services will automatically set all of these\
    \ registers when RequestConfiguration is called.\n\n# 5 Card Services Event Handling\n\
    \nCard Services events have several sources:\n\n- Card status changes reported\
    \ by the low-level socket drivers.\n- Artificial events generated by Card Services\
    \ itself.\n- Advanced Power Management (APM) events.\n- Events generated by other\
    \ Card Services clients.\n\nSocket driver may be either interrupt-driven or polled.\n\
    \n## 5.1 Event handler operations\n\nWhen Card Services recognizes an event has\
    \ occurred, it checks the event mask of each client to determine which clients\
    \ should receive an event notification. When a client registers with Card Services,\
    \ it specifies an event handler callback function. This handler should have the\
    \ form:\n\n```\nint (*event_handler)(event_t, int priority, event_callback_args_t\
    \ *args);\n```\n\nThe priority is set to either CS_EVENT_PRI_LOW for ordinary\
    \ events, or CS_EVENT_PRI_HIGH for events that require an immediate response.\
    \ The only high priority event is CS_EVENT_CARD_REMOVAL. A client event handler\
    \ should process this event as efficiently as possible so that Card Services can\
    \ quickly notify others.\n\nThe event_callback_args_t is structured by:\n\n```\n\
    typedef struct event_callback_args_t {\n    client_handle_t\n    client_handle;\n\
    \    void\n    *info;\n    void\n    *mtdrequest;\n    void\n    *buffer;\n  \
    \  void\n    *misc;\n    void\n    *client_data;\n    struct bus_operations\n\
    \    *bus;\n} event_callback_args_t;\n```\n"
