    \nNo error detection code is used.\n\nCISTPL_EDC_CKSUM\n\nEach block has a one-byte\
    \ arithmetic checksum.\n\nCISTPL_EDC_CRC\n\nEach block has a two-byte cyclic redundancy\
    \ check.\n\nCISTPL_EDC_PCC\n\nThe entire partition has a one-byte checksum.\n\n\
    The offset specifies the address of the first data byte, and length specifies\
    \ the total number of bytes in this partition.\n\n# 4.2 CIS configuration register\
    \ definitions\n\nThe PC standard defines a few standard configuration registers\
    \ located in a card's memory space. A card's CONFIG tuple specifies which of these\
    \ registers are implemented. Programs using these definitions include:\n\n```\n\
    #include \"cisreg.h\"\n```\n\n# 4.2.1 Configuration Option Register\n\nThis register\
    \ should be present for virtually all I/O cards. Writing to this register selects\
    \ a configuration table entry and enables a card's IO functions.\n\nThe following\
    \ bit fields are defined:"
  - '[PAGE 48]


    # 4. Card Information Structure Definitions


    COR_CONFIG_MASK


    Specifies the configuration table index describing the card''s current operating
    mode.


    COR_LEVEL_REQ


    Specifies that the card should generate level mode (edge-triggered) interrupts,
    the default.


    COR_SOFT_RESET


    Setting this bit performs a “soft” reset operation. Drivers should use the ResetCard
    call to reset a card, rather than writing directly to this register.


    # 4.2.2 Card Configuration and Status Register


    The following bit fields are defined:


    CCSR_INTR_ACK


    If this bit is set, the CCSR_INTR_PENDING bit will remain set until it is explicitly
    cleared.


    CCSR_INTR_PENDING


    Signals that the card is currently asserting an interrupt request. This signal
    may be helpful for supporting interrupt sharing.


    CCSR_POWER_DOWN


    Setting this bit signals the card should enter a power down state.


    CCSR_AUDIO_ENA


    Specifies that the card''s audio output should be enabled.


    CCSR_IODISS


    This is used by the host to indicate that it can only perform 8-bit IO operations
    and 16-bit accesses be carried out as two 8-bit accesses.


    CCSR_SIGCHG_ENA


    This indicates to the card that it should use the SIGCHG signal to indicate changes
    in the WP, READY, BVD1, and BVD2 signals.


    CCSR_CHANGED


    This bit signals to the host that one of the signals in the Pin Replacement Register
    has changed state.


    # 4.2.3 Pin Replacement Register


    Signals in this register replace signals that are not available when a socket
    is operating in memory and IO mode. An IO card will normally assert the SIGCHG
    signal to indicate that one of these signals has changed state, a driver can pull
    this register to find out specifically what happened.


    The following bit fields are defined:


    PRR_WP_STATUS


    The current state of the write protect signal.'
  - '[PAGE 49]


    # 4. Card Information Structure Definitions


    PRR_READY_STATUS

    The current state of the ready signal.


    PRR_BVD2_STATUS

    The current state of the battery warn signal.


    PRR_BVD1_STATUS

    The current state of the battery dead signal.


    PRR_WP_EVENT

    Indicates that the write protect signal has changed state since the PRR register
    was last read.


    PRR_READY_EVENT

    Indicates that the ready signal has changed state since the PRR register was last
    read.


    PRR_BVD2_EVENT

    Indicates that the battery warn signal has changed state since the PRR register
    was last read.


    PRR_BVD1_EVENT

    Indicates that the battery dead signal has changed state since the PRR register
    was last read.


    This register can also be written. In this case, the STATUS bits act as a mask;
    if a STATUS bit is set, the corresponding EVENT bit is updated by the write.


    # 4.2.4 Socket and Copy Register


    This register is used when identical cards may be set up to share the same range
    of IO ports, to emulate an ISA card that would control several devices. For example,
    an ISA hard drive controller might control several drives, selectable by writing
    a drive number to an IO port. For several card drives to emulate this controller
    interface, each needs to “know” which drive it is, so that it can identify which
    IO operations are intended for it.


    The following bit fields are defined:


    SCR_SOCKET_NUM

    This should indicate the socket number which the card is located.


    SCR_COPY_NUM

    If several identical cards are installed in a system, this field should be set
    to a unique number identifying which of the cards this is.


    # 4.2.5 Extended Status Register


    The following bit fields are defined:


    ESR_REQ_ATTN_ENA

    When set, the CCSR_CHANGED bit will be set when the ESR_REQ_ATTN bit is set, possibly
    generating a status change interrupt.'
  - "[PAGE 50]\n\n# 5. Card Services Event Handling\n\nESR_REQ_ATTN\n\nSignals a card\
    \ event, such as an incoming call for a modem.\n\n# 4.2.6 IO Base and Size Registers\n\
    \nFor multifunction cards, these registers are used to tell the card how the host\
    \ IO windows have been configured for each card. There are four IO Base registers,\
    \ int priority, CISREG_IOBASE_0 to CISREG_IOBASE_3, for the low-order high-order\
    \ bytes of an IO address up to 32 bits. CISREG_IOSIZE register is supposed to\
    \ be written as the number of IO ports allocated, minus one. For MFC-compliant\
    \ cards, Card Services will automatically set all of these registers when RequestConfiguration\
    \ is called.\n\n# 5 Card Services Event Handling\n\nCard Services events have\
    \ several sources:\n\n+   * Card status changes reported by the low-level socket\
    \ drivers.\n* Artificial events generated by Card Services itself.\n* Advanced\
    \ Power Management (APM) events.\n* Events generated by other Card Services clients.\n\
    \nSocket driver may be either interrupt-driven or polled.\n\n# 5.1 Event handler\
    \ operations\n\nWhen Card Services recognizes an event has occurred, it checks\
    \ the event mask of each client to determine which clients should receive an event\
    \ notification. When a client registers with Card Services, it specifies an event\
    \ handler callback function. This handler should have the form:\n\n```\nint (*event_handler)(event_t,\
    \ int priority, event_callback_args_t *args);\n```\n\nThe priority is set to either\
    \ CS_EVENT_PRI_LOW for ordinary events, or CS_EVENT_PRI_HIGH for events that require\
    \ an immediate response. The only high priority event is CS_EVENT_CARD_REMOVAL.\
    \ A client event handler should process this event as efficiently as possible\
    \ so that Card Services can quickly notify others.\n\nThe event_callback_args_t\
    \ is structured by:\n\n```\ntypedef struct event_callback_args_t {\n    client_handle_t\n\
    \    client_handle;\n    void\n    *info;\n    void\n    *mtdrequest;\n    void\n\
    \    *buffer;\n    void\n    *misc;\n    void\n    *client_data;\n    struct bus_operations\n\
    \    *bus;\n} event_callback_args_t;\n```"
- md: "\n## 5. Card Services Event Handling\n\nThe client_handle member is set to\
    \ handle the client whose socket was responsible for the event. This is useful\
    \ if a driver is bound to several sockets. The info field is currently used to\
    \ return an exit status from ResetCard. The client_data field may be used by a\
    \ driver to point to a local data structure associated with this device. The remaining\
    \ fields are unused.\n\nFor sockets that do not directly map cards into the host\
    \ IO and memory space, the bus field is a pointer to a table of entries for IO\
    \ primitives for this socket.\n\n## 5.2 Event descriptions\n\n```\nCS_EVENT_CARD_INSERTION\n\
    ```\n\nThis event signals that a card has been inserted. If a driver is bound\
    \ to an already occupied socket, Card Services will send the driver an artificial\
    \ insert event.\n\n```\nCS_EVENT_CARD_REMOVAL\n```\n\nThis event signals that\
    \ a card has been removed. This event should be handled with minimum delay so\
    \ that Card Services can notify all clients as quickly as possible.\n\n```\nCS_EVENT_BATTERY_LOW\n\
    ```\n\nThis event signals a change of state of the “battery low” signal.\n\n```\n\
    CS_EVENT_BATTERY_DEAD\n```\n\nThis event signals a change of state of the “battery\
    \ dead” signal.\n\n```\nCS_EVENT_READY_CHANGE\n```\n\nThis event signals a change\
    \ of state of the “ready” signal.\n\n```\nCS_EVENT_WRITE_PROTECT\n```\n\nThis\
    \ event signals a change of state of the “write protect” signal.\n\n```\nCS_EVENT_REGISTRATION_COMPLETE\n\
    ```\n\nThis event is sent to a driver after a successful call to RegisterClient.\n\
    \n```\nCS_EVENT_RESET_REQUEST\n```\n\nThis event is sent when a client calls ResetCard.\
    \ An event handler can veto the reset operation by returning failure.\n\n```\n\
    CS_EVENT_RESET_PHYSICAL\n```\n\nThis event is sent to all clients before a reset\
    \ signal is sent to a card.\n\n```\nCS_EVENT_CARD_RESET\n```\n\nThis event signals\
    \ that a reset operation is finished. The success or failure of the reset should\
    \ be determined using GetStatus.\n\n```\nCS_EVENT_RESET_COMPLETE\n```\n\nThis\
    \ event is sent to a client that has called ResetCard to signal the end of reset\
    \ processing.\n\n```\nCS_EVENT_PM_SUSPEND\n```\n\nThis event signals that Card\
    \ Services has received either a user initiated or APM suspend request. An event\
    \ handler can veto the suspend by returning failure.\n\n```\nCS_EVENT_PM_RESUME\n\
    ```\n\nThis signals that the system is back on line after a suspend/resume cycle.\n\
    \n```\nCS_EVENT_MTD_REQUEST\n```\n\nThis is used to initiate an MTD memory operation.\
    \ A description of the request is passed in the mdrequest field of the callback\
    \ arguments. A host buffer address may be passed in buffer.\n\n```\nCS_EVENT_ERASE_COMPLETE\n\
    ```\n\nThis is used to signal a client that a queued erase operation has completed.\
    \ A pointer to the erase entry is returned in the info field of the callback arguments.\n\
    \n## 5.3 Client driver handling responsibilities\n\nA client driver should respond\
    \ to CS_EVENT_CARD_INSERTION and CS_EVENT_CARD_REMOVAL events by configuring and\
    \ unconfiguring the socket. Because card removal is a high priority event, the\
    \ driver should immediately block IO to the socket, by setting a flag in a device\
    \ structure, and schedule all shutdown processing to happen later using a timer\
    \ interrupt.\n\nWhen a CS_EVENT_PM_RESET_REQUEST event is received, a driver should\
    \ block IO and receive a locked socket configuration. When a CS_EVENT_CARD_RESET\
    \ is received, a driver should restore the socket configuration and unlock IO.\n\
    \nA CS_EVENT_PM_SUSPEND event should be handled something like a CS_EVENT_PM_RESET_REQUEST\
    \ event, in that IO should be blocked and the socket configuration should be restored.\
    \ When a CS_EVENT_PM_RESUME event is received, a driver can expect a card to be\
    \ ready to be reconfigured, similar to when a CS_EVENT_CARD_RESET event is received.\n\
    \n## 6. Memory Technology Drivers\n\nA Memory Technology Driver (\"MTD\") is used\
    \ by Card Services to implement memory services for a particular type of memory\
    \ device. An MTD should register as a normal Card Client with a call to RegisterClient.\
    \ When it receives a card insert event, it should use GetFirstRegion and GetNextRegion\
    \ to identify regions it will administer. Then, it should RegisterMTD to take\
    \ control of these regions. MTD read, write, copy, and erase requests are packed\
    \ into CS_EVENT_MTD_REQUEST events by Card Services, and passed to the MTD's event\
    \ handler for processing.\n\n## 6.1 MTD request handling\n\nAn MTD receives requests\
    \ from Card Services in the form of CS_EVENT_MTD_REQUEST events. Card Services\
    \ pass a description of the mdrequest field of the callback arguments. For requests\
    \ that transfer data to or from the host, the host buffer address is passed in\
    \ the buffer.\n\nThe mdrequest_t structure is given by:\n\n```\ntypedef struct\
    \ mtd_request_t {\n    u_int SrcCardOffset;\n    u_int DestCardOffset;\n    u_int\
    \ TransferLength;\n    u_int Function;\n    u_long MediaID;\n    u_int Status;\n\
    \    u_int Timeout;\n} mtd_request_t;\n```\n\nThe Function field is mapped and\
    \ describes the action to be performed by this request:\n\n### MTD_REQ_ACTION\n\
    \nEither MTD_REQ_ERASE, MTD_REQ_READ, MTD_REQ_WRITE, or MTD_REQ_COPY.\n\n### MTD_REQ_NOERASE\n\
    \nFor a write command, aligned on erase boundaries, this specifies that no erase\
    \ should be performed.\n\n### MTD_REQ_VERIFY\n\nSpecifies that writes should be\
    \ verified.\n\n### MTD_REQ_READY\n\nIndicates that this request is delayed until\
    \ the card signals READY.\n\n### MTD_REQ_TIMEOUT\n\nIndicates that this request\
    \ is delayed by timeout.\n\n### MTD_REQ_FIRST\n\nIndicates that this request is\
    \ the first in a series.\n\n### MTD_REQ_LAST\n\nIndicates that this request is\
    \ the last of a series.\n\n### MTD_REQ_KERNEL\n\nIndicates that the host buffer\
    \ for read or write is located in kernel memory, as opposed to user memory.\n\n\
    ### MTD_WAITREQ\n\nSpecifies that the request should be retried after another\
    \ MTD request currently completes.\n\n### MTD_WAITTIMER\n\nSpecifies that the\
    \ request should be continued after the timeout expires.\n\n### MTD_WAITRDY\n\n\
    Specifies that the request should be continued when the card signals READY, or\
    \ when the time specified in Timeout lapses, whichever happens first.\n\n### MTD_WAITPOWER\n\
    \nSpecifies that the request should be retried after something affects power availability\
    \ to the socket.\n\nFor MTD_WAITTIMER and MTD_WAITRDY, the Timeout field will\
    \ specify the timeout interval in milliseconds.\n\n## 6.2 MTD helper functions\n\
    \nSince an MTD processes requests generated by Card Services, there may be some\
    \ restrictions on the sorts of Card Services calls that can be safely made from\
    \ the MTD handler. MTD helper functions provide a limited set of special services\
    \ that may be needed by an MTD but would be tricky to implement using the normal\
    \ Card Services. In the Linux implementation, most CS calls can be safely made\
    \ from an MTD handler, the MTD helper interface is included for compatibility.\n\
    \n```\n#include \"cs.types.h\"\n#include \"cs.h\"\n#include \"bulkmem.h\"\n\n\
    int MTDHelperEntry(int subfunc, void *arg, void *arg2);\n```\n\n### 6.2.1 MTDRequestWindow,\
    \ MTDRleaseWindow\n\n```\nint MTDHelperEntry(MTDRequestWindow, client_handle_t\
    \ *handle, win_req_t *mod);\nint MTDHelperEntry(MTDRleaseWindow, window_handle_t\
    \ handle);\n```\n\nThese services are identical to the standard Card Services\
    \ RequestWindow and ReleaseWindow calls.\n\n### 6.2.2 MTDModifyWindow\n\n```\n\
    int MTDHelperEntry(MTDModifyWindow, memory_handle_t handle, mtd_mod_req_t *mod);\n\
    ```\n\nMTDModifyWindow is essentially equivalent to using the normal ModifyWindow\
    \ and MapMemPage calls.\n\nThe following flags can be specified in Attributes:\n"
  mdcn: "\n\n## 5. 卡服务事件处理\n\n`client_handle` 成员用于处理负责该事件的套接字的客户端。如果驱动程序绑定到多个套接字，此字段非常有用。`info`\
    \ 字段目前用于返回 `ResetCard` 的退出状态。`client_data` 字段可供驱动程序用于指向与此设备关联的本地数据结构。其余字段未使用。\n\
    \n对于不直接将卡映射到主机 IO 和内存空间的套接字，`bus` 字段是一个指向该套接字 IO 原语条目表的指针。\n\n## 5.2 事件描述\n\n\
    ```\nCS_EVENT_CARD_INSERTION\n```\n\n此事件信号卡片已插入。如果驱动程序绑定到一个已占用的套接字，Card Services\
    \ 将向驱动程序发送一个伪的插入事件。\n\n```\nCS_EVENT_CARD_REMOVAL\n```\n\n此事件信号卡片已移除。应当以最小延迟处理此事件，以便\
    \ Card Services 能够尽可能地通知所有客户端。\n\n```\nCS_EVENT_BATTERY_LOW\n```\n\n此事件信号“低电量”信号的状态变化。\n\
    \n```\nCS_EVENT_BATTERY_DEAD\n```\n\n此事件信号“电池耗尽”信号的状态变化。\n\n```\nCS_EVENT_READY_CHANGE\n\
    ```\n\n此事件信号“就绪”信号的状态变化。\n\n```\nCS_EVENT_WRITE_PROTECT\n```\n\n此事件信号“写保护”信号的状态变化。\n\
    \n```\nCS_EVENT_REGISTRATION_COMPLETE\n```\n\n此事件在成功调用 `RegisterClient` 后发送给驱动程序。\n\
    \n```\nCS_EVENT_RESET_REQUEST\n```\n\n当客户端调用 `ResetCard` 时会发送此事件。事件处理程序可以通过返回失败来否决重置操作。\n\
    \n```\nCS_EVENT_RESET_PHYSICAL\n```\n\n此事件在向卡片发送重置信号之前发送给所有客户端。\n\n```\nCS_EVENT_CARD_RESET\n\
    ```\n\n此事件信号重置操作已完成。重置的成功或失败应使用 `GetStatus` 来确定。\n\n```\nCS_EVENT_RESET_COMPLETE\n\
    ```\n\n此事件发送给调用过 `ResetCard` 的客户端，表示重置处理的结束。\n\n```\nCS_EVENT_PM_SUSPEND\n```\n\
    \n此事件信号 Card Services 接收到了用户启动或 APM 挂起请求。事件处理程序可以通过返回失败来否决挂起。\n\n```\nCS_EVENT_PM_RESUME\n\
    ```\n\n此信号表示系统在挂起/恢复周期后已恢复运行。\n\n```\nCS_EVENT_MTD_REQUEST\n```\n\n此项用于启动 MTD\
    \ 内存操作。请求的描述通过回调参数中的 `mdrequest` 字段传递。主机缓冲区地址可能通过 `buffer` 传递。\n\n```\nCS_EVENT_ERASE_COMPLETE\n\
    ```\n\n此项用于通知客户端队列中的擦除操作已完成。擦除条目的指针在回调参数的 `info` 字段中返回。\n\n## 5.3 客户端驱动处理职责\n\n\
    客户端驱动应通过配置和取消配置套接字来响应 `CS_EVENT_CARD_INSERTION` 和 `CS_EVENT_CARD_REMOVAL` 事件。由于卡片移除是一个高优先级事件，驱动程序应该通过在设备结构中设置标志位来立即阻塞对套接字的\
    \ IO 操作，并使用定时器中断调度所有关闭处理稍后发生。\n\n当接收到 `CS_EVENT_PM_RESET_REQUEST` 事件时，驱动程序应阻塞\
    \ IO 并接收锁定的套接字配置。当接收到 `CS_EVENT_CARD_RESET` 时，驱动程序应恢复套接字配置并解锁 IO。\n\n`CS_EVENT_PM_SUSPEND`\
    \ 事件的处理方式应类似于 `CS_EVENT_PM_RESET_REQUEST` 事件，即应该阻塞 IO 并恢复套接字配置。当接收到 `CS_EVENT_PM_RESUME`\
    \ 事件时，驱动程序可以预期卡片已准备好进行重新配置，类似于接收到 `CS_EVENT_CARD_RESET` 事件时。\n\n## 6. 存储技术驱动\n\
    \n存储技术驱动（“MTD”）被 Card Services 用于为特定类型的存储设备实现存储服务。MTD 应该通过调用 `RegisterClient`\
    \ 注册为普通的卡客户端。当它接收到卡插入事件时，它应该使用 `GetFirstRegion` 和 `GetNextRegion` 来识别它将管理的区域。然后，它应该调用\
    \ `RegisterMTD` 来控制这些区域。MTD 的读、写、复制和擦除请求会被 Card Services 封装成 `CS_EVENT_MTD_REQUEST`\
    \ 事件，并传递给 MTD 的事件处理程序进行处理。\n\n## 6.1 MTD 请求处理\n\nMTD 以 `CS_EVENT_MTD_REQUEST`\
    \ 事件的形式接收来自 Card Services 的请求。Card Services 传递回调参数中 `mdrequest` 字段的描述。对于向主机或从主机传输数据的请求，主机缓冲区地址通过\
    \ `buffer` 传递。\n\n`mdrequest_t` 结构体如下：\n\n```\ntypedef struct mtd_request_t {\n\
    \    u_int SrcCardOffset;\n    u_int DestCardOffset;\n    u_int TransferLength;\n\
    \    u_int Function;\n    u_long MediaID;\n    u_int Status;\n    u_int Timeout;\n\
    } mtd_request_t;\n```\n\n`Function` 字段被映射并描述了该请求要执行的操作：\n\n### MTD_REQ_ACTION\n\
    \n可能是 MTD_REQ_ERASE、MTD_REQ_READ、MTD_REQ_WRITE 或 MTD_REQ_COPY 之一。\n\n### MTD_REQ_NOERASE\n\
    \n对于在擦除边界上对齐的写命令，此项指定不应执行擦除。\n\n### MTD_REQ_VERIFY\n\n指定应对对写操作进行验证。\n\n### MTD_REQ_READY\n\
    \n表示此请求将延迟，直到卡片发送 READY 信号。\n\n### MTD_REQ_TIMEOUT\n\n表示此请求将因超时而延迟。\n\n### MTD_REQ_FIRST\n\
    \n表示此请求是系列请求中的第一个。\n\n### MTD_REQ_LAST\n\n表示此请求是系列请求中的最后一个。\n\n### MTD_REQ_KERNEL\n\
    \n表示读或写的主机缓冲区位于内核内存，而不是用户内存。\n\n### MTD_WAITREQ\n\n指定在当前完成另一个 MTD 请求完成后应重试该请求。\n\
    \n### MTD_WAITTIMER\n\n指定在超时过期后应继续该请求。\n\n### MTD_WAITRDY\n\n指定当卡片发送 READY 信号或\
    \ `Timeout` 中指定的时间过去时（以先者为准）继续该请求。\n\n### MTD_WAITPOWER\n\n指定在某些因素影响套接字电源可用性后应重试该请求。\n\
    \n对于 MTD_WAITTIMER 和 MTD_WAITRDY，`Timeout` 字段将以毫秒为单位指定超时间隔。\n\n## 6.2 MTD 辅助函数\n\
    \n由于 MTD 处理由 Card Services 生成的请求，在处理程序中可以安全调用的 Card Services 调用类型可能受到限制。MTD 辅助函数提供了一组特殊服务，这些服务可能是\
    \ MTD 需要的但使用标准的 Card Services 实现很难。在 Linux 实现中，大多数 CS 调用可以在 MTD 处理程序中安全执行，为了兼容性包含了\
    \ MTD 辅助接口。\n\n```\n#include \"cs.types.h\"\n#include \"cs.h\"\n#include \"bulkmem.h\"\
    \n\nint MTDHelperEntry(int subfunc, void *arg, void *arg2);\n```\n\n### 6.2.1\
    \ MTDRequestWindow, MTDRleaseWindow\n\n```\nint MTDHelperEntry(MTDRequestWindow,\
    \ client_handle_t *handle, win_req_t *mod);\nint MTDHelperEntry(MTDRleaseWindow,\
    \ window_handle_t handle);\n```\n\n这些服务与标准的 Card Services RequestWindow 和 ReleaseWindow\
    \ 调用相同。\n\n### 6.2.2 MTDModifyWindow\n\n```\nint MTDHelperEntry(MTDModifyWindow,\
    \ memory_handle_t handle, mtd_mod_req_t *mod);\n```\n\nMTDModifyWindow 实际上等同于使用标准的\
    \ ModifyWindow 和 MapMemPage 调用。\n\n可以在属性（Attributes）中指定以下标志位：\n\n"
