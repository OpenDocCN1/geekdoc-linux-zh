    \ 字段未被 Card Services 使用，但可能被客户端驱动使用。\n\n返回码：\n\nCS_BAD_HANDLE\n客户端句柄无效。\n\n##\
    \ 3.6.7 DeregisterEraseQueue\n\n```\nint CardServices(DeregisterEraseQueue, eraseq_handle_t\
    \ handle);\n```\n\n`DeregisterEraseQueue` 释放之前通过 `RegisterEraseQueue` 注册的队列。如果指定的队列中存在任何待处理请求，则调用将失败。\n\
    \n返回码：\n\nCS_BAD_HANDLE\n擦除队列句柄无效。\n\nCS_BUSY\n擦除队列有等待的擦除请求。\n\n## 3.6.8 CheckEraseQueue\n\
    \n```\nint CardServices(CheckEraseQueue, eraseq_handle_t handle);\n```\n\n此调用通知\
    \ Card Services 在之前通过 `RegisterEraseQueue` 注册的队列中有新的擦除请求。\n\n通常情况下，客户端起初会为每个擦除队列分配状态值\
    \ `ERASE_IDLE`。当新请求被添加到队列中时，客户端将它们的状态设置为 `ERASE_QUEUED` 并调用 `CheckEraseQueue`。当客户端收到擦除完成事件时，它将检查\
    \ `state` 字段以判断请求是否成功。\n\n返回码：\n\nCS_BAD_HANDLE\n擦除队列句柄无效。\n\n## 3.7 杂项调用\n\n\
    ### 3.7.1 GetCardServicesInfo\n\n```\nint CardServices(GetCardServicesInfo, servinfo_t\
    \ *servinfo);\n```\n\n* 注意\n\n`servinfo_t` 结构体如下：\n\n```\ntypedef struct servinfo_t\
    \ {\n    char Signature[2];\n    u_int Count;\n    u_int Revision;\n    u_int\
    \ CSLevel;\n    char *VendorString;\n} servinfo_t;\n```\n\n`GetCardServicesInfo`\
    \ 返回关于此版本 Card Services 的修订信息。`Signature` 设置为 \"CS\"。`Count` 设置为当前配置的 socket 数量。`Revision`\
    \ 设置为 Card Services 包的修订级别，`CSLevel` 设置为符合 PC Card 标准的级别。它们以 BCD 数字形式编码。`VendorString`\
    \ 设置为指向一个 RCS 标识字符串。\n\n此调用总是成功。\n\n### 3.7.2 AccessConfigurationRegister\n\n\
    ```\n#include \"cisreg.h\"\n```\n\n```\nint CardServices(AccessConfigurationRegister,\
    \ client_handle_t handle, conf_reg_t reg);\n```\n\n`conf_reg_t` 结构体如下：\n\n```\n\
    typedef struct conf_reg_t {\n    u_char Function;\n    u_int Action;\n    off_t\
    \ Offset;\n    u_int Value;\n} conf_reg_t;\n```\n\n对于绑定到特定卡函数的普通客户端，`Function`\
    \ 字段被忽略。对于绑定到 `BIND_FN_ALL` 的客户端，此字段指定了应该访问哪个函数的配置寄存器。\n\n`Action` 参数可以是以下值之一：\n\
    \n- CS_READ: 读取指定的配置寄存器并返回 `Value`。\n- CS_WRITE: 将 `Value` 写入指定的配置寄存器。\n\n`AccessConfigurationRegister`\
    \ 读取或写入从配置寄存器开始处偏移的单字节 CIS 配置寄存器。它只能用于已通过 `RequestConfiguration` 配置的 socket。\n\
    \n`cistpl.h` 中定义了 `Offset` 的以下值：\n\n- CISREG_COR: 配置选项寄存器。\n- CISREG_CCSR: 卡配置与状态寄存器。\n\
    - CISREG_PRR: 密码替换寄存器。\n- CISREG_SCR: 插槽与复制寄存器。\n- CISREG_ESR: 扩展状态寄存器。\n- CISREG_IOBASE_0...CISREG_IOBASE_3:\
    \ I/O 基寄存器。\n- CISREG_IOSIZE: I/O 大寄存器。\n\n返回码：\n\nCS_BAD_HANDLE\n客户端句柄无效。\n\n\
    CS_BAD_ARGS\n不支持指定的 `Action`。\n\nCS_CONFIGURATION_LOCKED\n这实际上意味着配置尚未锁定。\n\nCS_OUT_OF_RESOURCE\n\
    Card Services 无法分配内存窗口来访问卡的配置寄存器。\n\n### 3.7.3 AdjustResourceInfo\n\n```\nint\
    \ CardServices(AdjustResourceInfo, client_handle_t handle, adjust_t *adj);\n```\n\
    \n`adjust_t` 结构体如下：\n\n```\ntypedef struct adjust_t {\n    u_int           Action;\n\
    \    u_int           Resource;\n    u_int           Attributes;\n    union {\n\
    \        struct memory {\n            u_long           Base;\n            u_long\
    \           Size;\n        } memory;\n        struct io {\n            ioaddr_t\
    \    BasePort;\n            ioaddr_t    NumPorts;\n            u_int       IOAddrLines;\n\
    \            struct irq {\n                u_int        IRQ;\n            } irq;\n\
    \        } resource;\n    };\n} adjust_t;\n```\n\n`AdjustResourceInfo` 用于告知 Card\
    \ Services PC 设备可能或可能分配的资源。系统遵循标准的 Linux 资源管理系统（IO 端口的 `*_region` 类、中断分配）。`Action`\
    \ 参数具有以下值：\n\n- ADD_MANAGED_RESOURCE: 将指定的资源置于 Card Services 控制下。\n- REMOVE_MANAGED_RESOURCE:\
    \ 从 Card Services 控制中移除指定的资源。\n- RES_MEMORY: 由 `adj->memory` 指定内存资源。\n- RES_IO:\
    \ 由 `adj->io` 指定 IO 资源。\n- RES_IRQ: 由 `adj->irq` 指定中断资源。\n- _RESERVED: 预留后用。\n\
    \n```\n#include \"cistpl.h\"\n```\n\n## 4 卡信息定义\n\n### 4.1.1 CISTPL_CHECKSUM\n\
    \n`cistpl_checksum_t` 结构体如下：\n\n```\ntypedef struct cistpl_checksum_t {\n    u_short\
    \ addr;\n    u_short len;\n    u_char sum;\n} cistpl_checksum_t;\n```\n\n### 4.1.2\
