    \ do not match the parameters passed to RequestIO.\n\n# 3.3.3 RequestIRQ\n\n```\n\
    int CardServices(RequestIRQ, client_handle_t client, irq_req_t *req);\n```\n\n\
    The irq_req_t structure is given by:\n\n```\ntypedef struct irq_req_t {\n    u_int\
    \               Attributes;\n    u_int               AssignedIRQ;\n    u_int \
    \              IRQInfo1, IRQInfo2;\n    void                *(Handler)(int, struct\
    \ pt_regs *);\n    void                *Instance;\n};\n```\n\nRequestIRQ uses\
    \ an interrupt line for a card. The IRQINFO1 and IRQInfo2 fields correspond to\
    \ the interrupt description bytes in a CFTABLE_ENTRY tuple. If IRQINFO2_VALID\
    \ is set in IRQInfo1, then IRQInfo2 is a bit-mapped mask of allowed interrupt\
    \ values. Each bit corresponds to one interrupt line: bit 0 = irq, bit 1 = irq,\
    \ etc. A bitmask of 0x100 would mean that 12 and 8 would be used. If IRQINFO2_VALID\
    \ is just the desired interrupt number. If the call is successful, the returned\
    \ interrupt is set in AssignedIRQ.\n\nIf the IRQ_HANDLER_PRESENT flag is set,\
    \ this call also specifies an interrupt handler to be installed when the interrupt\
    \ is enabled. When RequestConfiguration is called, the handler given by Handler\
    \ will be installed. For 2. 4 kernels, the interrupt handler will be installed\
    \ with the device \"instance\" in Instance. For pre-2.1.60 kernels, the kernel\
    \ irq_dev_map table will also be updated. With multifunction cards, the interrupt\
    \ will be allocated in shared mode, and the handler(s) has responsibility for\
    \ determining which card function(s) require attention when an interrupt is received.\
