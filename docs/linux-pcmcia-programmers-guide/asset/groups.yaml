    # 10 Where to Go for More Information 73


    # 1 Introduction


    The Linux kernel PCMCIA system has three main components. At the lowest level
    are the socket drivers. Next is the Card Services module. Drivers for specific
    cards are layered on top of Card Services. One special Card Services client, called
    Card Services, provides a link between user level utility programs and the kernel
    facilities.


    The socket driver is loosely based on the Socket Services API. There are two socket
    driver modules: The tcic module supports the Datasbook TICC-2 family of host controllers.
    The i82365 family and various compatible-controllers, including Cirrus, VLSI,
    Ricoh, and Vadem chips. In addition, the i82365 module implement CardBus controllers
    that follow the "Yenta" register-level specification.


    Card Services is the largest component of the package. It provides an API similar
    to DOS Card Services, adapted to a Unix environment. The Linux implementation
    was built in part on the Solaris interface specification. It is implemented in
    the pcmia_core module. Most version 2.1 features are implemented, with some PC
    Card 95 features.


    The Driver layer uses a user pseudo-device for accessing some Card Services functions
    from utility programs. It is responsible for keeping track of all client drivers,
    and for matching up drivers with physical sockets. It is implemented in the da
    module.


    This document describes the interface to the Card Services and Driver Services
    modules, and the user interface to Driver Services. It is intended for use by
    client device driver developers. The Linux PCMCIA-HOWTO describes how to install
    and use Linux PCMCIA support. It is available from <http://pcmcia-cs.sourceforge.net>.


