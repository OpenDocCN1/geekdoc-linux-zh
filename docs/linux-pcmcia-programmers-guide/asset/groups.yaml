- md: "\n# Card Services Subfunction Descriptions\n\nAdditionally, the macro ERASE_IN_PROGRESS()\
    \ will return a true condition for values of State that indicate an erase is being\
    \ processed.\n\nThe Size field gives the size of the erase request in bytes. The\
    \ Offset field gives the offset from the start of the region. The size and offset\
    \ should be aligned to erase block boundaries. The Optional field is not used\
    \ by Card Services and may be used by the client driver.\n\nReturn codes:\n\n\
    CS_BAD_HANDLE\nThe client handle is invalid.\n\n## 3.6.7 DeregisterEraseQueue\n\
    \n```\nint CardServices(DeregisterEraseQueue, eraseq_handle_t handle);\n```\n\n\
    DeregisterEraseQueue frees a queue previously registered by a call to RegisterEraseQueue.\
    \ If there are any pending requests in the specified queue, the call will fail.\n\
    \nReturn codes:\n\nCS_BAD_HANDLE\nThe erase queue handle is invalid.\n\nCS_BUSY\n\
    The erase queue has erase requests pending.\n\n## 3.6.8 CheckEraseQueue\n\n```\n\
    int CardServices(CheckEraseQueue, eraseq_handle_t handle);\n```\n\nThis call notifies\
    \ Card Services that there are new erase requests in a queue previously registered\
    \ with RegisterEraseQueue.\n\nTypically, a client will initially assign each erase\
    \ queue the state value ERASE_IDLE. When new requests are added to the queue,\
    \ the client will set their states to ERASE_QUEUED, and call CheckEraseQueue.\
    \ When the client is notified of an erase completion event, it will check the\
    \ state field to determine whether the request was successful.\n\nReturn codes:\n\
    \nCS_BAD_HANDLE\nThe erase queue handle is invalid.\n\n## 3.7 Miscellaneous calls\n\
    \n### 3.7.1 GetCardServicesInfo\n\n```\nint CardServices(GetCardServicesInfo,\
    \ servinfo_t *servinfo);\n```\n\n* Note\n\nThe servinfo_t structure is given by:\n\
    \n```\ntypedef struct servinfo_t {\n    char Signature[2];\n    u_int Count;\n\
    \    u_int Revision;\n    u_int CSLevel;\n    char *VendorString;\n} servinfo_t;\n\
    ```\n\nGetCardServicesInfo returns revision information about this version of\
    \ Card Services. Signature is set to \"CS\". Count is set to the number of sockets\
    \ currently configured. Revision is set to the revision level of the Card Services\
    \ package, and CSLevel is set to the level of compliance with the PC Card standard.\
    \ They are encoded as BCD numbers. VendorString is set to point to an RCS identification\
    \ string.\n\nThis call always succeeds.\n\n### 3.7.2 AccessConfigurationRegister\n\
    \n```\n#include \"cisreg.h\"\n```\n\n```\nint CardServices(AccessConfigurationRegister,\
    \ client_handle_t handle, conf_reg_t reg);\n```\n\nThe conf_reg_t structure is\
    \ given by:\n\n```\ntypedef struct conf_reg_t {\n    u_char Function;\n    u_int\
    \ Action;\n    off_t Offset;\n    u_int Value;\n} conf_reg_t;\n```\n\nFor normal\
    \ clients bound to a specific card function, the Function field is ignored. For\
    \ clients bound to BIND_FN_ALL, this field specifies which function's configuration\
    \ registers should be accessed.\n\nThe Action parameter can be one of the following:\n\
    \n- CS_READ: Read the specified configuration register and return Value.\n- CS_WRITE:\
    \ Write Value to the specified configuration register.\n\nAccessConfigurationRegister\
    \ reads or writes the one-byte CIS configuration register at offset from the start\
    \ of the config register. It can only be used for a socket that has been configured\
    \ with RequestConfiguration.\n\nThe following values for Offset are defined in\
    \ cistpl.h:\n\n- CISREG_COR: The Configuration Option Register.\n- CISREG_CCSR:\
    \ The Card Configuration and Status Register.\n- CISREG_PRR: The Pin Replacement\
    \ Register.\n- CISREG_SCR: The Socket and Copy Register.\n- CISREG_ESR: The Extended\
    \ Status Register.\n- CISREG_IOBASE_0...CISREG_IOBASE_3: The I/O Base Registers.\n\
    - CISREG_IOSIZE: The I/O Size Register.\n\nReturn codes:\n\nCS_BAD_HANDLE\nThe\
    \ client handle is invalid.\n\nCS_BAD_ARGS\nThe specified Action is not supported.\n\
    \nCS_CONFIGURATION_LOCKED\nThis actually means that the configuration has not\
    \ been locked.\n\nCS_OUT_OF_RESOURCE\nCard Services was unable to allocate a memory\
    \ window to access the card's configuration registers.\n\n### 3.7.3 AdjustResourceInfo\n\
    \n```\nint CardServices(AdjustResourceInfo, client_handle_t handle, adjust_t *adj);\n\
    ```\n\nThe adjust_t structure is given by:\n\n```\ntypedef struct adjust_t {\n\
    \    u_int           Action;\n    u_int           Resource;\n    u_int       \
    \    Attributes;\n    union {\n        struct memory {\n            u_long   \
    \        Base;\n            u_long           Size;\n        } memory;\n      \
    \  struct io {\n            ioaddr_t    BasePort;\n            ioaddr_t    NumPorts;\n\
    \            u_int       IOAddrLines;\n            struct irq {\n            \
    \    u_int        IRQ;\n            } irq;\n        } resource;\n    };\n} adjust_t;\n\
    ```\n\nAdjustResourceInfo is used to tell Card Services what resources may or\
    \ may not be allocated by PC devices. The normal Linux resource management systems\
    \ (the *_region class for IO ports, interrupt allocation) are respected. The Action\
    \ parameter can have the following values:\n\n- ADD_MANAGED_RESOURCE: Place the\
    \ specified resource under Card Services control.\n- REMOVE_MANAGED_RESOURCE:\
    \ Remove the specified resource from Card Services control.\n- RES_MEMORY: Specifies\
    \ a memory resource, by adj->memory.\n- RES_IO: Specifies an IO resource, by adj->io.\n\
    - RES_IRQ: Specifies an interrupt resource, by adj->irq.\n- _RESERVED: This is\
    \ reserved for future use.\n\n```\n#include \"cistpl.h\"\n```\n\n## 4. Card Information\
    \ Definitions\n\n### 4.1.1 CISTPL_CHECKSUM\n\nThe cistpl_checksum_t is given by:\n\
    \n```\ntypedef struct cistpl_checksum_t {\n    u_short addr;\n    u_short len;\n\
    \    u_char sum;\n} cistpl_checksum_t;\n```\n\n### 4.1.2 CISTPL_LONLINK_A, CISTPL_LONLINK_C,\
    \ CISTPL_LINK, CISTPL_NOLINK\n\nThe cistpl_longlink_t is given by:\n\n```\ntypedef\
    \ struct cistpl_longlink_t {\n    u_int addr;\n} cistpl_longlink_t;\n```\n\nThe\
    \ cistpl_longlink_mfc_t is given by:\n\n```c\ntypedef struct cistpl_longlink_mfc_t\
    \ {\n    int nfn;\n    struct {\n        u_char space;\n        u_int addr;\n\
    \    } fn[CISTPL_FUNCTIONS];\n} cistpl_longlink_mfc_t;\n```\n\n### 4.1.3 CISTPL_DEVICE,\
