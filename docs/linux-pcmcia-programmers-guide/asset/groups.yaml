    \ call to RequestIRQ.\n\nCONF_ENABLE_DMA\n\nEnable DMA accesses for this socket.\n\
    \nCONF_ENABLE_SPKR\n\nEnable speaker output from this socket."
  - '[PAGE 17]


    # 3. Card Services Subfunction Descriptions


    The Present parameter is a bit map specifying CIS configuration registers are
    implemented by this card. ConfigBase gives the offset of the configuration registers
    in attribute memory. The following registers can be specified:


    PRESENT_OPTION


    Specifies that the Configuration Option Register is present. The COR register
    will be set using the ConfigIndex parameter.


    PRESENT_STATUS


    Specifies that the Card Configuration and Status Register is present. The CCSR
    will be initialized with the Status parameter.


    PRESENT_PIN_REPLACE


    Specifies that the Pin Replacement Register is present. The PRR will be initialized
    with the Pin parameter.


    PRESENT_COPY


    Specifies that the Socket and Copy Register is present. The SCR will be initialized
    with the Copy parameter.


    PRESENT_EXT_STATUS


    Specifies that the Extended Status Register is present. The ESR will be initialized
    with the ExtStatus parameter.


    Return codes:


    CS_BAD_HANDLE


    The client handle is invalid.


    CS_NO_CARD


    The socket assigned to this client is currently vacant.


    CS_OUT_OF_RESOURCE


    Card Services was unable to allocate a memory window to access the card''s configuration
    registers.


    CS_CONFIGURATION_LOCKED


