    \   u_char wp;\n        u_int speed;\n        u_int size;\n    } dev[CISTPL_MAX_DEVICES];\n\
    } cistpl_device_t;\n```\n\nThe CISTPL_DEVICE tuple describes address regions in\
    \ a card's memory. The CISTPL_DEVICE_A tuple describes regions in attribute memory.\
    \ The type flag indicates the type of memory device for this region. The wp flag\
    \ indicates if this region is write protected. The speed field is in nanoseconds,\
    \ and size is in bytes. Address regions are assumed to be ordered consecutively\
    \ starting with address 0. The following device types are defined:\n\nCISTPL_DYPE_NULL\n\
    Specifies that there is no device, or a \"hole\" in the card address space.\n\n\
    CISTPL_DYPE_ROM\nMasked ROM\n\nCISTPL_DYPE_OTPROM\nOne-type programmable ROM.\n\
    \nCISTPL_DYPE_EPROM\nUV erasable PROM.\n\nCISTPL_DYPE_EEPROM\nElectrically erasable\
    \ PROM.\n\nCISTPL_DYPE_FLASH\nFlash EPROM.\n\nCISTPL_DYPE_SRAM\nStatic or non-volatile\
    \ RAM.\n\nCISTPL_DYPE_DRAM\nDynamic or volatile RAM.\n\nCISTPL_DYPE_FUNCSPEC\n\
    Specifies a function-specific device, such as a memory-mapped IO device or buffer,\
    \ as opposed to general purpose storage.\n\nCISTPL_DYPE_EXTEND\nSpecifies an extended\
    \ device type. This type is reserved for future use."
- md: "\n## 4. Card Information Structure Definitions\n\n### 4.1.5 CISTPL_VERS_1\n\
    \nThe cpl_vers_1_t structure is given by:\n\n```\ntypedef struct cistpl_vers_1_t\
    \ {\n    u_char major;\n    u_char minor;\n    int ns;\n    int ofs[CISTPL_VERS_1_MAX_PROD_STRINGS];\n\
    \    char str[254];\n} cistpl_vers_1_t;\n```\n\nThe ns field specifies the number\
    \ of product information strings in the tuple. The string data is contained in\
    \ the str array. Each string is null terminated, and ofs gives the offset to the\
    \ start of each string.\n\n## 4.1.6 CISTPL_ALTSTR\n\nThe cistpl_altstr struct\
    \ cistpl_altstr_t is given by:\n\n```\ntypedef struct cistpl_altstr_t {\n    int\
    \ ns;\n    int ofs[CISTPL_ALTSTR_MAX_STRINGS];\n    char str[254];\n} cistpl_altstr_t;\n\
    ```\n\nThe ns field specifies the number of alternate language strings in the\
    \ tuple. The string data is contained in the str array. Each string is null terminated,\
    \ and ofs gives the offset to the start of each string.\n\n## 4.1.7 CISTPL_JEDEC_C,\
    \ CISTPL_JEDEC_A\n\nThe cistpl_jedec_t structure is given by:\n\n```\ntypedef\
    \ struct cistpl_jedec_t {\n    int nid;\n    struct {\n        u_char mfr;\n \
    \       u_char info;\n    } id[CISTPL_MAX_DEVICES];\n} cistpl_jedec_t;\n```\n\n\
    JEDEC identifiers describe the specific device type used to implement a region\
    \ of card memory. The nid field specifies the number of JEDEC identifiers in the\
    \ tuple. There should be a one-to-one correspondence between JEDEC identifiers\
    \ and device descriptions in the corresponding CISTPL_DEVICE tuple.\n\n## 4.1.8\
    \ CISTPL_CONFIG, CISTPL_CONFIG_CB\n\nThe cistpl_config_t structure is given by:\n\
    \n```\ntypedef struct cistpl_config_t {\n    u_char          last_idx;\n    u_int\
    \           base;\n    u_int           rmask[4];\n    u_char          subtuples;\n\
    } cistpl_config_t;\n```\n\nThe last_idx field gives the index of the highest numbered\
    \ configuration table entry. The base field gives the offset of a card's configuration\
    \ registers in attribute memory. The rmask array is a series of bit masks indicating\
    \ which configuration registers are present. Bit 0 of rmask[0] is the COR, bit\
    \ 1 is for the CSSR, and so on. The subtples field gives the number of bytes of\
    \ subtples following the normal tuple contents.\n\nFor CISTPL_CONFIG_CB, rmask\
    \ is undefined, and base points to the CardBus status registers.\n\n## 4.1.9 CISTPL_BAR\n\
    \nThe cistpl_bar_t structure is given by:\n\n```\ntypedef struct cistpl_bar_t\
    \ {\n    u_char          attr;\n    u_int           size;\n} cistpl_long_t;\n\
    ```\n\nA CISTPL_BAR tuple describes the characteristics of an address space pointed\
    \ to by a PCI base address register, for CardBus cards.\n\nThe following bit fields\
    \ are defined in attr:\n\n- CISTPL_BAR_SPACE: Identifies the base address register,\
    \ from 1 to 6. A value of 7 describes the card's Extension ROM space.\n- CISTPL_BAR_PREFETCH:\
    \ If set, this region maps IO space (as opposed to memory space).\n- CISTPL_BAR_CACHEABLE:\
    \ If set, this region is cacheable as well as prefetchable.\n- CISTPL_BAR_IMEG_MAP:\
    \ If set, this region should only be mapped into the first 1MB of the host's physical\
    \ address space.\n\n## 4.1.10 CISTPL_CFTABLE_ENTRY\n\nThe cistpl_cftable_entry_t\
    \ structure is given by:\n\n```\ntypedef struct cistpl_cftable_entry_t {\n   \
    \ u_char index;\n    u_char flags;\n    u_char interface;\n    cistpl_power_t\
    \ vcc, vpp1, vpp2;\n    cistpl_timing_t timing;\n    cistpl_ie_t io;\n    cistpl_irq_t\
    \ irq;\n    cistpl_mem_t mem;\n    u_char subtples;\n} cistpl_cftable_entry_t;\n\
    ```\n\nA CISTPL_CFTABLE_ENTRY structure describes a complete operating mode for\
    \ a Card. Many sections are optional. The index field gives the configuration\
    \ for this operating mode; writing this value to the Card's Configuration Option\
    \ Register selects this mode. The following fields are defined in flags:\n\n-\
    \ CISTPL_CFTABLE_DEFAULT: Specifies that this is the default configuration entry.\n\
    - CISTPL_CFTABLE_BVDS: Specifies that this configuration implements the BVD1 and\
    \ BVD2 signals in the Pin Replacement Register.\n- CISTPL_CFTABLE_WP: Specifies\
    \ that this configuration implements the write protect signal in the Pin Replacement\
    \ Register.\n- CISTPL_CFTABLE_RDBSYS: Specifies that this configuration implements\
    \ the Ready/Busy signal in the Pin Replacement Register.\n- CISTPL_CFTABLE_MWAIT:\
    \ Specifies that the WAIT signal should be observed during memory cycles.\n- CISTPL_CFTABLE_AUDIO:\
    \ Specifies that this configuration generates an audio signal that can be routed\
    \ to the host speaker.\n- CISTPL_CFTABLE_READONLY: Specifies that the card has\
    \ a memory region that is read-only in this configuration.\n- CISTPL_CFTABLE_PWRDOWN:\
    \ Specifies that this configuration supports a power down mode, via the Card Configuration\
    \ and Status Register.\n\nThe cistpl_power_t structure is given by:\n\n```\ntypedef\
    \ struct cistpl_power_t {\n    u_char present;\n    u_char flags;\n    u_int param[7];\n\
    } cistpl_power_t;\n```\n\nThe present field is bit mapped and indicates which\
    \ parameters are present for this signal. The following indices are defined:\n\
    \n- CISTPL_POWER_NOM: The nominal voltage.\n- CISTPL_POWER_VMIN: The minimum voltage.\n\
    - CISTPL_POWER_VMAX: The maximum voltage.\n- CISTPL_POWER_ATIC: The continuous\
    \ current. (Note: corrected from ISTATIC/ATIC based on context)\n- CISTPL_POWER_IAVG:\
    \ The maximum current averaged over one second.\n- CISTPL_POWER_IPEAK: The maximum\
    \ current averaged over ten ms.\n- CISTPL_POWER_OWN: The current required in power\
    \ down mode.\n\nVoltages are given in units of 10volts. Currents are given in\
    \ units of 100 nanoperes.\n\nThe cistpl_timing_t structure is given by:\n\n```\n\
    typedef struct cistpl_timing_t {\n    u_int wait, waitscale;\n    u_int ready,\
    \ rdyscale;\n    u_int reserved, rsvscale;\n} cistpl_timing_t;\n```\n\n```\ntypedef\
    \ struct cistpl_io_t {\n    u_char flags;\n    int nwin;\n    struct {\n     \
    \   u_int base;\n        u_int len;\n    } win[CISTPL_IO_MAX_WIN];\n} cistpl_io_t;\n\
    ```\n\nThe number of IO windows is given by nwin. Each window is described by\
    \ a base address, base, and a length in bytes, len. The following bit fields are\
    \ defined in flags:\n\n- CISTPL_IO_LINES_MASK: The number of IO lines decoded\
    \ by this card.\n- CISTPL_IO_8BIT: Indicates that the card supports 8-bit accesses\
    \ to 16-bit IO registers.\n- CISTPL_IO_16BIT: Indicates that the card supports\
    \ full 16-bit accesses to IO registers.\n\nThe cistpl_irq_t structure is defined\
    \ by:\n\n```\ntypedef struct cistpl_irq_t {\n    u_int IRQInfo;\n    u_int IRQInfo2;\n\
    } cistpl_irq_t;\n```\n\nThe following bit fields are defined in IRQInfo:\n\n-\
    \ IRQ_MASK: A specific interrupt number that this card should use.\n- IRQ_NMI_ID,\
    \ IRQ_IOC_ID, IRQ_LOCK_ID, IRQ_BERR_ID, IRQ_VEND_ID: When IRQ_INFO2_VALID is set,\
    \ these indicate if a corresponding interrupt signal may be assigned to this card.\
    \ These flags are for non-maskable, IO, bus error, and vendor specific interrupts.\n\
    - IRQ_INFO2_VALID: Indicates that IRQInfo2 contains a valid bit mask of allowed\
    \ interrupt requests.\n- IRQ_LEVEL_ID: Indicates that the card supports level\
    \ mode interrupts.\n- IRQ_PULSE_ID: Indicates that the card supports pulse mode\
    \ interrupts.\n- IRQ_SHARE_ID: Indicates that the card supports sharing interrupts.\
    \ If IRQInfo is 0, then no interrupt information is available.\n\nThe cistpl_mem_mem_t\
    \ structure is defined by:\n\n```\ntypedef struct cistpl_mem_mem_t {\n    u_char\
    \ nwin;\n    struct {\n        u_int len;\n        u_int card_addr;\n        u_int\
    \ host_addr;\n    } win[CISTPL_MEM_MAX_WIN];\n} cistpl_mem_mem_t;\n```\n\nThe\
    \ number of memory windows is given by nwin. Each window is described by an address\
    \ in the card memory space, card_addr, an address in the host memory space, host_addr,\
    \ and a length in bytes, len. If the host address is 0, the position of the window\
    \ is arbitrary.\n\n## 4.1.11 CISTPL_CFTABLE_ENTRY_CB\n\nThe cistpl_cftable_entry_cb_t\
    \ structure is given by:\n\n```\ntypedef struct cistpl_cftable_entry_cb_t {\n\
    \    u_char index;\n    u_char flags;\n    cistpl_power_t vcc, vpp1, vpp2;\n \
    \   u_char io;\n    cistpl_irq_t irq;\n    u_char mem;\n    u_char suptples;\n\
    } cistpl_cftable_entry_cb_t;\n```\n\nA CISTPL_CFTABLE_ENTRY_CB structure describes\
    \ a complete operating mode for a CardBus card. Many fields are identical to corresponding\
    \ fields in CISTPL_CFTABLE_ENTRY. The io and mem fields specify which address\
    \ registers need to be initialized for this configuration. Bits 1 through 6 correspond\
    \ to the six base registers, and bit 7 indicates the expansion ROM base registers.\n"
  mdcn: "\n\n## 4. 卡片信息结构定义\n\n### 4.1.5 CISTPL_VERS_1\n\n`cpl_vers_1_t` 结构定义如下：\n\
    \n```\ntypedef struct cistpl_vers_1_t {\n    u_char major;\n    u_char minor;\n\
    \    int ns;\n    int ofs[CISTPL_VERS_1_MAX_PROD_STRINGS];\n    char str[254];\n\
    } cistpl_vers_1_t;\n```\n\n`ns` 字段指定组中产品信息字符串的数量。字符串数据包含在 `str` 数组中。每个字符串均以空字符终止，`ofs`\
    \ 给每个字符串起始位置的偏移量。\n\n## 4.1.6 CISTPL_ALTSTR\n\n`cistpl_altstr` 结构 `cistpl_altstr_t`\
    \ 定义如下：\n\n```\ntypedef struct cistpl_altstr_t {\n    int ns;\n    int ofs[CISTPL_ALTSTR_MAX_STRINGS];\n\
    \    char str[254];\n} cistpl_altstr_t;\n```\n\n`ns` 字段指定组中可选语言字符串的数量。字符串数据包含在\
    \ `str` 数组中。每个字符串均以空字符终止，`ofs` 给每个字符串起始位置的偏移量。\n\n## 4.1.7 CISTPL_JEDEC_C, CISTPL_JEDEC_A\n\
    \n`cistpl_jedec_t` 结构定义如下：\n\n```\ntypedef struct cistpl_jedec_t {\n    int nid;\n\
    \    struct {\n        u_char mfr;\n        u_char info;\n    } id[CISTPL_MAX_DEVICES];\n\
    } cistpl_jedec_t;\n```\n\nJEDEC 标识符描述用于实现卡片内存区域的特定设备类型。`nid` 字段指定组中 JEDEC 标识符的数量。JEDEC\
    \ 标识符与对应的 CISTPL_DEVICE 元组中的设备描述之间应该是一一对应的关系。\n\n## 4.1.8 CISTPL_CONFIG, CISTPL_CONFIG_CB\n\
    \n`cistpl_config_t` 结构定义如下：\n\n```\ntypedef struct cistpl_config_t {\n    u_char\
    \          last_idx;\n    u_int           base;\n    u_int           rmask[4];\n\
    \    u_char          subtuples;\n} cistpl_config_t;\n```\n\n`last_idx` 字段给出编号最高的配置表项的索引。`base`\
    \ 字段给出卡配置寄存器在属性内存中的偏移量。`rmask` 数组是一系列位掩码，表示存在哪些配置寄存器。`rmask[0]` 的第 0 位是 COR，第\
    \ 1 位是 CSSR，依此类推。`subtuples` 字段给出普通元组内容之后的 `subtuples` 字节数。\n\n对于 `CISTPL_CONFIG_CB`，`rmask`\
    \ 未定义，`base` 指向 CardBus 状态寄存器。\n\n## 4.1.9 CISTPL_BAR\n\n`cistpl_bar_t` 结构定义如下：\n\
    \n```\ntypedef struct cistpl_bar_t {\n    u_char          attr;\n    u_int   \
    \        size;\n} cistpl_long_t;\n```\n\n`CISTPL_BAR` 元组描述了 CardBus 卡片中 PCI 基地址寄存器所指向的地址空间的特征。\n\
    \n`attr` 中定义了以下位域：\n\n- CISTPL_BAR_SPACE: 标识基地址寄存器，范围从 1 到 6。值为 7 时描述卡片的扩展 ROM\
    \ 空间。\n- CISTPL_BAR_PREFETCH: 如果设置，该区域映射到 IO 空间（区别于内存空间）。\n- CISTPL_BAR_CACHEABLE:\
    \ 如果设置，该区域是可缓存的且可预取的。\n- CISTPL_BAR_IMEG_MAP: 如果设置，该区域应仅映射到主机物理地址空间的前 1MB 内。\n\
    \n## 4.1.10 CISTPL_CFTABLE_ENTRY\n\n`cistpl_cftable_entry_t` 结构定义如下：\n\n```\n\
    typedef struct cistpl_cftable_entry_t {\n    u_char index;\n    u_char flags;\n\
    \    u_char interface;\n    cistpl_power_t vcc, vpp1, vpp2;\n    cistpl_timing_t\
    \ timing;\n    cistpl_ie_t io;\n    cistpl_irq_t irq;\n    cistpl_mem_t mem;\n\
    \    u_char subtples;\n} cistpl_cftable_entry_t;\n```\n\n`CISTPL_CFTABLE_ENTRY`\
    \ 结构描述了卡片的完整工作模式。许多部分是可选的。`index` 字段给出此工作模式的配置；将此值写入卡片的配置选项寄存器即可选择该模式。`flags`\
    \ 中定义了以下字段：\n\n- CISTPL_CFTABLE_DEFAULT: 指定该项为默认配置项。\n- CISTPL_CFTABLE_BVDS: 指定该配置实现了引脚替换寄存器（Pin\
    \ Replacement Register）中的 BVD1 和 BVD2 信号。\n- CISTPL_CFTABLE_WP: 指定该配置实现了引脚替换寄存器中的写保护信号。\n\
    - CISTPL_CFTABLE_RDBSYS: 指定该配置实现了引脚替换寄存器中的就绪/忙（Ready/Busy）信号。\n- CISTPL_CFTABLE_MWAIT:\
    \ 指定该配置实现了等待（MWAIT）信号。\n\n"
