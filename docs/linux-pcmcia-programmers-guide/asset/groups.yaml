- md: "\n# Card Services Subfunction Descriptions\n\nCS_CONFIGURATION_LOCKED\n\nThis\
    \ socket has been locked by a call to a RequestConfiguration. The configuration\
    \ should be released before calling ReleaseIRQ.\n\nCS_BAD_IRQ\n\nThe parameters\
    \ in req do not match the parameters passed to RequestIRQ.\n\n## 3.3.5 RequestConfiguration\n\
    \n```\nint CardServices(RequestConfiguration, client_handle_t client, config_req_t\
    \ *req);\n```\n\nThe config_req_t structure is given by:\n\n```\ntypedef struct\
    \ config_req_t {\n    u_int Attributes;\n    u_int Vpp1, Vpp2;\n    u_int IntType;\n\
    \    u_int ConfigBase;\n    u_char Status, Pin, Copy, ExtStatus;\n    u_char ConfigIndex;\n\
    \    u_int Present;\n} config_req_t;\n```\n\nRequestConfiguration is responsible\
    \ for actually configuring a socket. This includes setting voltages,\nsetting\
    \ CIS configuration registers, setting up IO port windows, and setting interrupts.\n\
    IntType specifies the type of interface to use for this card. It may be INT_MEMORY,\
    \ INT_MEMORY_AND_IO, or\nINT_CARDBUS. Voltages are specified in units of 1/10\
    \ volt. Currently, Vpp1 must equal Vpp2.\n\nWith multifunction cards, each card\
    \ function is configured separately. Each function has its own set of\nCIS configuration\
    \ registers. However, all functions must be configured with the power and interface\n\
    settings.\n\nWhen invoked by a CardBus client, most of the request is ignored,\
    \ and all functions will\nbe configured on data collected in a previous Request10\
    \ call. This includes configuring the CardBus\nbridge, while initializing the\
    \ Base Address, and Interrupt Line in each card function's\nconfiguration space.\
    \ IntType must be set to INT_CARDBUS in this case.\n\nThe following flags can\
    \ be specified in Attributes. DMA and speaker control are not supported on all\n\
    systems.\n\n- CONF_ENABLE_IRQ\n\nEnable the IO interrupt requested by a previous\
    \ call to RequestIRQ.\n\n- CONF_ENABLE_DMA\n\nEnable DMA accesses for this socket.\n\
    \n- CONF_ENABLE_SPKR\n\nEnable speaker output from this socket.\n\n## 3. Card\
    \ Services Subfunction Descriptions\n\nThe Present parameter is a bit map specifying\
    \ CIS configuration registers are implemented by this card. ConfigBase gives the\
    \ offset of the configuration registers in attribute memory. The following registers\
    \ can be specified:\n\n- PRESENT_OPTION\n\nSpecifies that the Configuration Option\
    \ Register is present. The COR register will be set using the ConfigIndex parameter.\n\
    \n- PRESENT_STATUS\n\nSpecifies that the Card Configuration and Status Register\
    \ is present. The CCSR will be initialized with the Status parameter.\n\n- PRESENT_PIN_REPLACE\n\
    \nSpecifies that the Pin Replacement Register is present. The PRR will be initialized\
    \ with the Pin parameter.\n\n- PRESENT_COPY\n\nSpecifies that the Socket and Copy\
    \ Register is present. The SCR will be initialized with the Copy parameter.\n\n\
    - PRESENT_EXT_STATUS\n\nSpecifies that the Extended Status Register is present.\
    \ The ESR will be initialized with the ExtStatus parameter.\n\nReturn codes:\n\
    \n- CS_BAD_HANDLE\n\nThe client handle is invalid.\n\n- CS_NO_CARD\n\nThe socket\
    \ assigned to this client is currently vacant.\n\n- CS_OUT_OF_RESOURCE\n\nCard\
    \ Services was unable to allocate a memory window to access the card's configuration\
    \ registers.\n\n- CS_CONFIGURATION_LOCKED\n\nThis card's configuration has already\
    \ been locked by another call to RequestConfiguration.\n\n- CS_BAD_VCC\n\nThe\
    \ requested Vcc voltage is not supported.\n\n- CS_BAD_VPP\n\nThe requested Vpp1/Vpp2\
    \ voltage is not supported.\n\n- CS_UNSUPPORTED_MODE\n\nA non-CardBus client attempted\
    \ to configure a CardBus card, or a CardBus client attempted to configure a non-CardBus\
    \ card.\n\n## 3. Card Services Subfunction Descriptions\n\n## 3.3.6 ModifyConfiguration\n\
    \n```\nint CardServices(ModifyConfiguration, client_handle_t client, modconf_t\
    \ *mod);\n```\n\nThe modconf_t structure is given by:\n\n```\ntypedef struct modconf_t\
    \ {\n    u_int               Attributes;\n    u_int               Vcc, Vpp1, Vpp2;\n\
    } modconf_t;\n```\n\nModifyConfiguration modifies some attributes of a socket\
    \ that has been configured by a call to RequestConfiguration.\n\nThe following\
    \ flags can be specified in Attributes:\n\n- CONF_IRQ_CHANGE_VALID\n\nIndicates\
    \ that the CONF_ENABLE_IRQ setting should be updated.\n\n- CONF_ENABLE_IRQ\n\n\
    Specifies that IO interrupts should be enabled for this socket.\n\n- CONF_VCC_CHANGE_VALID\n\
    \nIndicates that Vcc should be updated.\n\n- CONF_VPP1_CHANGE_VALID\n\nIndicates\
    \ that Vpp1 should be updated.\n\n- CONF_VPP2_CHANGE_VALID\n\nIndicates that Vpp2\
    \ should be updated.\n\nCurrently, Vpp1 and Vpp2 must always have the same value.\
    \ So, the two values must always be changed at the same time.\n\nReturn codes:\n\
    \n- CS_BAD_HANDLE\n\nThe client handle is invalid.\n\n- CS_NO_CARD\n\nThe socket\
    \ assigned to this client is currently vacant.\n\n- CS_CONFIGURATION_LOCKED\n\n\
    This actually means that this socket has not locked.\n\n- CS_BAD_VCC\n\nThe requested\
    \ Vcc voltage is not supported.\n\n- CS_BAD_VPP\n\nThe requested Vpp1/Vpp2 voltage\
    \ is not supported.\n\n## 3. Card Services Subfunction Descriptions\n\n## 3.3.7\
    \ ReleaseConfiguration\n\n```\nint CardServices(ReleaseConfiguration, client_handle_t\
    \ client, config_req_t *req);\n```\n\nReleaseConfiguration un-configures a socket\
    \ previously set by a call to RequestConfiguration.\n\nReturn codes:\n\n- CS_BAD_HANDLE\n\
    \nThe client handle is invalid.\n\n## 3.3.8 GetConfiguration\n\n```\nint CardServices(GetConfiguration,\
    \ client_handle_t client, config_info_t *config);\n```\n\nThe config_info_t structure\
    \ is given by:\n\n```\ntypedef struct config_info_t {\n    u_int\tAttributes;\n\
    \    u_int\tVcc, Vpp1, Vpp2;\n    u_int\tIntType;\n    u_char\tStatus, Pin, Copy,\
    \ ExtStatus;\n    u_int\tPresent;\n    u_int\tAssignedIRQ;\n    uaddr_t\tBase1;\n\
    \    uaddr_t\tNumPorts1;\n    u_int\tAttributes1;\n    uaddr_t\tBase2;\n    uaddr_t\t\
    NumPorts2;\n    u_int\tAttributes2;\n    u_int\tID0;\n} config_info_t;\n```\n\n\
    GetConfiguration returns the current configuration as was set by RequestConfiguration.\n\
    \nReturn codes:\n\n- CS_BAD_HANDLE\n\nThe client handle is invalid.\n\n## 3. Card\
    \ Services Subfunction Descriptions\n\nCS_NO_CARD\n\nThe socket assigned to this\
    \ client is currently vacant.\n\nCS_CONFIGURATION_LOCKED\n\nThis actually means\
    \ that this socket has not locked.\n\n## 3.4 Card Information Structure (CIS)\
    \ calls\n\nThe definition of the Card Information Structure (CIS) is the darkest\
    \ chapter of the PC Card standard. All version 2 clients should have a CIS, which\
    \ describes the card and how it should be configured. The CIS is a linked list\
    \ of “tuples” for the card's attribute space. Each tuple consists of an identification\
    \ code, a length byte, and a series of data bytes. The layout of the data bytes\
    \ for some tuples is absurd complicated, in an apparent effort to use very last.\n\
    \nValidateCIS calls to check if a card has a reasonable CIS. The GetFirstTuple\
    \ and GetNextTuple calls are used to step through CIS tuples. GetTupleData extracts\
    \ data bytes from a tuple. And ParseTuple unpacks many tuples into more easily\
    \ forms. ReplaceCIS allows a client to provide a substitute for the CIS found\
    \ on the card.\n\n### 3.4.1 GetFirstTuple, GetNextTuple\n\n```\n#include \"cispl.h\"\
    \n\nint CardServices(GetFirstTuple, client_handle_t client, tuple_t *tuple);\n\
    int CardServices(GetNextTuple, client_handle_t client, tuple_t *tuple);\n```\n\
    \nThe tuple_t data is given by:\n\n```\ntypedef struct tuple_t {\n    u_int\t\
    Attributes;\n    cis_data_t\tDesiredTuple;\n    u_int\tFlags;\n    cisdata_t\t\
    TupleCode;\n    u_int\tTupleLink;\n    cisdata_t\tTupleOffset;\n    cisdata_t\t\
    TupleData;\n    cisdata_t\tTupleLen;\n    cisdata_t\t*TupleData;\n} tuple_t;\n\
    ```\n\nGetFirstTuple searches for a CIS for the first tuple matching DesiredTuple.\
    \ RETURN_FIRST_Tuple will match the first tuple of any kind. If successful, TupleCode\
    \ is set to the code of the first matching tuple, and TupleLink is the address\
    \ of this attribute in memory.\n\nGetNextTuple is like GetFirstTuple, except given\
    \ a tuple_t returned by a previous call to GetFirstTuple or GetNextTuple, it will\
    \ return the next tuple matching DesiredTuple.\n\nThese functions will automatically\
    \ traverse any link tuples in the CIS. For multifunction cards using a CISPL_LONLINK_MFC,\
    \ these functions will automatically follow the CIS chain specific to a client\
    \ driver's assigned function. If a client was bound to BIND_FN_ALL, all tuples\
    \ will be returned.\n"
  mdcn: "\n\n# 卡片服务子函数描述\n\nCS_CONFIGURATION_LOCKED\n\n此套接已通过调用 RequestConfiguration\
    \ 被锁定。在调用 ReleaseIRQ 之前，应该释放配置。\n\nCS_BAD_IRQ\n\nreq 中的参数与传递给 RequestIRQ 的参数不匹配。\n\
    \n## 3.3.5 RequestConfiguration\n\n```\nint CardServices(RequestConfiguration,\
    \ client_handle_t client, config_req_t *req);\n```\n\n`config_req_t` 结构体如下：\n\n\
    ```\ntypedef struct config_req_t {\n    u_int Attributes;\n    u_int Vpp1, Vpp2;\n\
    \    u_int IntType;\n    u_int ConfigBase;\n    u_char Status, Pin, Copy, ExtStatus;\n\
    \    u_char ConfigIndex;\n    u_int Present;\n} config_req_t;\n```\n\nRequestConfiguration\
    \ 负责实际对套接字。这包括设置电压、设置 CIS 配置寄存器、设置 IO 端口窗口以及设置中断。\nIntType 指定了用于此卡卡的接口类型。它可以是\
    \ INT_MEMORY、INT_MEMORY_AND_IO 或 INT_CARDBUS。电压以 1/10 特为单位指定。目前，Vpp1 必须等于 Vpp2。\n\
    \n对于多功能卡，每个卡功能都是单独配置的。每个功能都有自己的自己的 CIS 配置寄存器组。然而，所有功能都必须使用电源和接口设置进行配置。\n\n当被 CardBus\
    \ 客户端调用时，大多数请求将被忽略，所有功能将根据之前 Request10 调用中收集的数据进行配置。这包括配置 CardBus 桥接器，同时在每个卡功能的配置空间中初始化基地址（Base\
    \ Address）和中断线（Interrupt Line）。在这种情况下，IntType 必须设置为 INT_CARDBUS。\n\n在 Attributes\
    \ 中可以指定以下标志。DMA 和扬声器控制在所有系统上都不支持。\n\n- CONF_ENABLE_IRQ\n\n启用之前调用 RequestIRQ 请求的\
    \ IO 中断。\n\n- CONF_ENABLE_DMA\n\n启用此套接字的 DMA 访问。\n\n- CONF_ENABLE_SPKR\n\n启用此套接字的扬声器输出。\n\
    \n## 3. 卡片服务子函数描述\n\nPresent 参数是一个位图，指定了此卡实现了哪些 CIS 配置寄存器。ConfigBase 给出了配置寄存器在属性内存中的偏移量。可以指定以下寄存器：\n\
    \n- PRESENT_OPTION\n\n指定配置选项寄存器（Configuration Option Register）存在。COR 器将使用 ConfigIndex\
    \ 参数设置。\n\n- PRESENT_STATUS\n\n指定卡片配置和状态寄存器（Card Configuration and Status Register）存在。CCSR\
    \ 将使用 Status 参数初始化。\n\n- PRESENT_PIN_REPLACE\n\n指定引脚替换寄存器（Pin Replacement Register）存在。PRR\
    \ 将使用 Pin 参数初始化。\n\n- PRESENT_COPY\n\n指定套接字和复制寄存器（Socket and Copy Register）存在。SCR\
    \ 将使用 Copy 参数初始化。\n\n- PRESENT_EXT_STATUS\n\n指定扩展状态寄存器（Extended Status Register）存在。ESR\
    \ 将使用 ExtStatus 参数初始化。\n\n返回码：\n\n- CS_BAD_HANDLE\n\n客户端句柄无效。\n\n- CS_NO_CARD\n\
    \n分配给此客户端的套接字目前为空。\n\n- CS_OUT_OF_RESOURCE\n\n卡片服务（Card Services）无法分配一个内存窗口来访问卡片的配置寄存器。\n\
    \n- CS_CONFIGURATION_LOCKED\n\n此卡的配置已被另一个 RequestConfiguration 调用锁定。\n\n- CS_BAD_VCC\n\
    \n请求的 Vcc 电压不受支持。\n\n- CS_BAD_VPP\n\n请求的 Vpp1/Vpp2 电压不受支持。\n\n- CS_UNSUPPORTED_MODE\n\
    \n非 CardBus 客户端尝试配置 CardBus 卡，或 CardBus 客户端尝试配置非 CardBus 卡。\n\n## 3. 卡片服务子函数描述\n\
    \n## 3.3.6 ModifyConfiguration\n\n```\nint CardServices(ModifyConfiguration, client_handle_t\
    \ client, modconf_t *mod);\n```\n\n`modconf_t` 结构体如下：\n\n```\ntypedef struct modconf_t\
    \ {\n    u_int               Attributes;\n    u_int               Vcc, Vpp1, Vpp2;\n\
    } modconf_t;\n```\n\nModifyConfiguration 修改已通过 RequestConfiguration 调用已配置的套接字的某些属性。\n\
    \n在 Attributes 中可以指定以下标志：\n\n- CONF_IRQ_CHANGE_VALID\n\n表示应该更新 CONF_ENABLE_IRQ\
    \ 设置。\n\n- CONF_ENABLE_IRQ\n\n指定应为此套接字开启 IO 中断。\n\n- CONF_VCC_CHANGE_VALID\n\n\
    表示应该更新 Vcc。\n\n- CONF_VPP1_CHANGE_VALID\n\n表示应该更新 Vpp1。\n\n- CONF_VPP2_CHANGE_VALID\n\
    \n表示应该更新 Vpp2。\n\n目前，Vpp1 和 Vpp2 必须始终保持相同的值。因此，这两个值必须同时更改。\n\n返回码：\n\n- CS_BAD_HANDLE\n\
    \n客户端句柄无效。\n\n- CS_NO_CARD\n\n分配给此客户端的套接字目前为空。\n\n- CS_CONFIGURATION_LOCKED\n\n\
    套接字配置已锁定。\n\n- CS_BAD_VCC\n\n请求的 Vcc 电压不支持。\n\n- CS_BAD_VPP\n\n请求的 Vpp 电压不支持。\n\
    \n## 3. 卡片服务子函数描述\n\n## 3.3.7 ReleaseConfiguration\n\n```\nint CardServices(ReleaseConfiguration,\
    \ client_handle_t client, config_req_t *req);\n```\n\nReleaseConfiguration 释放由调用\
    \ RequestConfiguration 配置的套接字。\n\n返回码：\n\n- CS_BAD_HANDLE\n\n客户端句柄无效。\n\n## 3.3.8\
    \ GetConfiguration\n\n```\nint CardServices(GetConfiguration, client_handle_t\
    \ client, config_info_t *config);\n```\n\nGetConfiguration 返回由 RequestConfiguration\
    \ 设置的当前配置。\n\n`config_info_t` 结构体如下：\n\n```\ntypedef struct config_info_t {\n\
    \    u_int Attributes;\n    u_int Vcc, Vpp1, Vpp2;\n    u_int IntType;\n    u_char\
    \ Status, Pin, Copy, ExtStatus;\n    u_int Present;\n    u_int AssignedIRQ;\n\
    \    uaddr_t Base;\n    uaddr_t NumPorts;\n    uaddr_t Base2;\n    uaddr_t NumPorts2;\n\
    \    u_int Attributes2;\n    int ID0;\n} config_info_t;\n```\n\n返回码：\n\n- CS_BAD_HANDLE\n\
    \n客户端句柄无效。\n\n## 3. 卡片服务子函数描述\n\nCS_NO_CARD\n\n分配给此客户端的套接字目前为空。\n\nCS_CONFIGURATION_LOCKED\n\
    \n套接字已锁定。\n\n## 3.4 卡片信息结构 (CIS) 调用\n\n卡片信息结构（CIS）的定义是 PC 卡标准中最深奥的章节。所有版本 2 的客户端都应该有一个\
    \ CIS，它描述了卡片以及如何配置。CIS 是卡片属性空间的元组（tuples）链表。每个元组由一个识别码、一个长度字节和一系列数据字节组成。\n\nValidateCIS\
    \ 用于检查卡是否具有合理的 CIS。GetFirstTuple 和 GetNextTuple 用于遍历 CIS 元组。GetTupleData 从元组中提取数据字节。ParseTuple\
    \ 将许多元组解析为更容易处理的形式。ReplaceCIS 允许客户端为找到 CIS 提供替代品。\n\n### 3.4.1 GetFirstTuple,\
    \ GetNextTuple\n\n```\n#include \"cispl.h\"\n\nint CardServices(GetFirstTuple,\
    \ client_handle_t client, tuple_t *tuple);\nint CardServices(GetNextTuple, client_handle_t\
    \ client, tuple_t *tuple);\n```\n\n`tuple_t` 数据如下：\n\n```\ntypedef struct tuple_t\
    \ {\n    u_int Attributes;\n    cis_data_t DesiredTuple;\n    u_int Flags;\n \
    \   cisdata_t TupleCode;\n    u_int TupleLink;\n    cisdata_t TupleOffset;\n \
    \   cisdata_t TupleData;\n    cisdata_t TupleLen;\n    cisdata_t *TupleData;\n\
    } tuple_t;\n```\n\nGetFirstTuple 搜索第一个匹配 DesiredTuple 的 CIS。RETURN_FIRST_Tuple\
    \ 将匹配任何类型的第一个元组。如果成功，TupleCode 将设置为第一个匹配元组的代码，TupleLink 是该属性在内存中的地址。\n\nGetNextTuple\
    \ 类似于 GetFirstTuple，给定之前调用 GetFirstTuple 或 GetNextTuple 返回的 tuple_t，它将返回下一个匹配\
    \ DesiredTuple 的元组。\n\n这些函数会自动遍历 CIS 中的任何链接元组。对于使用 CISPL_LONLINK_MFC 的多功能卡，这些函数将自动遵循客户端驱动程序分配的\
    \ CIS 链。如果客户端绑定到 BIND_FN_ALL，则将返回所有元组。\n\n"
