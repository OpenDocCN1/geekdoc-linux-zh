  mdcn: "\n\n# 3. 卡服务子函数描述\n\nCard Services 向所有客户端发送 CS_EVENT_PM_SUSPEND 事件，关闭并断开插槽电源。\n\
    \n返回代码：\n\n- CS_BAD_HANDLE\n客户端句柄无效。\n\n- CS_NO_CARD\n分配给此客户端的插槽当前为空。\n\n- CS_IN_USE\n\
    该插槽已挂起。\n\n## 3.2.4 ResumeCard\n\n```\nint CardServices(ResumeCard, client_handle_t\
    \ client);\n```\n\n在恢复插槽电源后，Card Services 将向所有客户端发送 CS_EVENT_PM_RESUME 事件。\n\n\
    返回代码：\n\n- CS_BAD_HANDLE\n客户端句柄无效。\n\n- CS_NO_CARD\n分配给此客户端的插槽当前为空。\n\n- CS_IN_USE\n\
    该插槽当前未挂起。\n\n## 3.2.5 EjectCard\n\n```\nint CardServices(EjectCard, client_handle_t\
    \ client);\n```\n\nCard Services 向所有客户端发送弹出事件，关闭并断开插槽电源。除了 Driver Services 外，所有客户端都将从插槽中取消链接。\n\
    \n返回代码：\n\n- CS_BAD_HANDLE\n客户端句柄无效。\n\n- CS_NO_CARD\n分配给此客户端的插槽当前为空。\n\n## 3.2.6\
    \ InsertCard\n\n```\nint CardServices(InsertCard, client_handle_t client);\n```\n\
    \nCard Services 向该插槽的所有客户端发送插入事件（通常只有 Driver Services）。\n\n返回代码：\n\n- CS_BAD_HANDLE\n\
    客户端句柄无效。\n\n- CS_NO_CARD\n分配给此客户端的插槽当前为空。\n\n- CS_IN_USE\n该插槽已配置。\n\n## 3.3 IO\
    \ 卡配置单元\n\n事件的正常顺序是：驱动程序通过调用 RequestIO 和 RequestIRQ 来预留 IO 端口和中断线，以便实际配置插槽。如果这些任何调用失败，驱动程序应确保释放其成功保留的任何资源。\n\
    \n多功能卡可以为每个卡功能拥有单独配置。然而，这些配置之间需要保持一致。每个卡都有自己的配置寄存器组，每个插槽只有一条中断线，且只能映射两个 IO 端口范围。\n\
    \nCardBus 卡的配置方式有所不同。RequestIO 和 RequestConfiguration 调用具有相似的作用，Card Services\
    \ 负责大部分配置细节，并会忽略请求结构的内容。\n\n### 3.3.1 RequestIO\n\n```\nint CardServices(RequestIO,\
    \ client_handle_t client, io_req_t *req);\n```\n\nio_req_t 数据结构定义如下：\n\n```\n\
    typedef struct io_req_t {\n    ioaddr_t BasePort1;\n    ioaddr_t NumPorts1;\n\
    \    u_int Attributes1;\n    ioaddr_t BasePort2;\n    ioaddr_t NumPorts2;\n  \
    \  u_int Attributes2;\n    u_int IOAddrLines;\n} io_req_t;\n```\n\nRequestIO 为卡预留端口窗口。BasePort1\
    \ 指定了要保留的窗口起始 IO 端口地址。如果 NumPorts2 不为零，则还会预留第二个 IO 端口窗口。IOAddrLines 指定了卡实际所需的地址线数。IO\
    \ 分配算法假设任何请求的地址只要保留了 IOAddrLines 位都是可以接受的，并将更新 BasePort1 和 BasePort2 以反映实际分配的地址范围。\n\
    \n在发布 3.1.4 版本之前，IOAddrLines 字段被忽略。分配器总是尝试分配请求的地址范围，除非基地址为 0；在这种情况下，它将分配任何与大于窗口大小\
    \ 2 的幂对齐的可用窗口。新的分配器会验证 IOAddrLines 参数是否与窗口参数一致，如果发现不一致，则默认恢复到 3.1.4 之前的行为。\n\n\
    对于多功能卡，这将为每个卡功能分配 IO 端口，使得卡的所有端口都能由与物理插槽相关的两个低级 IO 窗口进行管理。例如，如果一个假设的四功能卡的驱动程序均尝试分配一个\
    \ 8 端口的 IO 窗口，Card Services 将这些这些合并为一个连续的 32 端口块。\n\n当此函数由 CardBus 客户端调用时，IO 请求将被忽略。相反地，Card\
    \ Services 将会检查并分配任何必要的资源：这包括 IO 和内存空间，如果需要，还有中断。一个卡将保留所有卡功能所需的所有资源，而不仅仅是发起请求客户端的功能。\n\
    \n此调用实际上并没有配置插槽的 IO 窗口：这是通过后续调用 RequestConfiguration 完成的。\n\n在 Attributes1 和 Attributes2\
    \ 中可以指定以下标志：\n\n- IO_DATA_PATH_WIDTH\n该字段可以是 IO_DATA_PATH_WIDTH_16（用于 16 位访问）、IO_DATA_PATH_WIDTH_8（用于\
    \ 8 位访问）或 IO_DATA_PATH_WIDTH_AUTO（根据访问大小动态调整总线）。\n\n返回代码：\n\n- CS_BAD_HANDLE\n\
    客户端句柄无效。\n\n- CS_NO_CARD\n分配给此客户端的插槽当前为空。\n\n- CS_IN_USE\n该插槽的 IO 窗口已经预留。\n\n\
    - CS_CONFIGURATION_LOCKED\n该插槽的配置已通过 RequestConfiguration 调用锁定。\n\n- CS_BAD_ATTRIBUTE\n\
    指定了不支持的属性标志。\n\n- CS_UNSUPPORTED_FUNCTION\n对于 CardBus 客户端支持此项。\n\n## 3.3.2 ReleaseIO\n\
    \n```\nint CardServices(ReleaseIO, client_handle_t client, io_req_t *req);\n```\n\
    \nReleaseIO 取消早先调用 RequestIO 分的中断。传递给 RequestIO 的 req 结构。如果在 RequestIO 调用中指定了处理程序，它将在此时取消注册。\n\
    \n返回代码：\n\n- CS_BAD_HANDLE\n客户端句柄无效。\n\n- CS_NO_CARD\n分配给此客户端的插槽当前为空。\n\n- CS_IN_USE\n\
    该插槽已经预留了中断。\n\n- CS_CONFIGURATION_LOCKED\n该卡功能的配置已通过 RequestConfiguration 调用锁定。\n\
    \n## 3.3.3 RequestIRQ\n\n```\nint CardServices(RequestIRQ, client_handle_t client,\
    \ irq_req_t *req);\n```\n\nirq_req_t 结构定义如下：\n\n```\ntypedef struct irq_req_t\
    \ {\n    u_int Attributes;\n    u_int AssignedIRQ;\n    u_int IRQ1, IRQ2;\n  \
    \  void *(Handler)(int, struct pt_regs *);\n    void *Instance;\n} irq_req_t;\n\
    ```\n\nRequestIRQ 使用中断线。如果调用成功，返回的中断设置为 AssignedIRQ。对于 2.1.6 内内核，irq_dev_map 表也会被更新。对于多功能卡，中断将以共享模式分配，处理程序负责在接收到中断时确定哪些卡功能需要处理。如果客户端反而绕过\
    \ Card Services 来\n\n在 Attributes 中可以指定以下标志：\n\n- IRQ_FORCED_PULSE\n指定中断应配置为脉冲模式，而不是默认的电平模式。\n\
    \n- IRQ_TYPE_TIME\n指定该中断可以与其他 Card Services 驱动程序共享。任何时间只有一个驱动程序启用中断。\n\n- IRQ_FIRST_SHARED\n\
    结合 IRQ_TYPE_TIME，由第一个请求共享中断的驱动程序设置。\n\n- IRQ_HANDLER_PRESENT\n表示 Handler 字段指向应安装的中断服务程序。\n\
    \n返回代码：\n\n- CS_BAD_HANDLE\n客户端句柄无效。\n\n- CS_NO_CARD\n分配给此客户端的插槽当前为空。\n\n- CS_IN_USE\n\
    该插槽已经预留了中断，或者请求的中断不可用。\n\n- CS_CONFIGURATION_LOCKED\n该卡功能的配置已通过 RequestConfiguration\
    \ 调用锁定。\n\n- CS_BAD_ATTRIBUTE\n指定了不支持的属性标志。\n\n- CS_UNSUPPORTED_FUNCTION\n对于 CardBus\
    \ 客户端支持此项。\n\n## 3.3.4 ReleaseIRQ\n\n```\nint CardServices(ReleaseIRQ, client_handle_t\
    \ client, irq_req_t *irq);\n```\n\nReleaseIRQ 取消早先调用 RequestIO 分配的中断。传递给 RequestIO\
    \ 的 req 结构。如果在 RequestIRQ 调用中指定了处理程序，它将在此时取消注册。\n\n返回代码：\n\n- CS_BAD_HANDLE\n\
    客户端句柄无效。\n\n"
