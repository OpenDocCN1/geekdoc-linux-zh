  - "[PAGE 57]\n\n# 7. Driver Services Interface\n\nDEV_PRESENT\n\nIndicates that\
    \ the card is present. This bit should be set and cleared by the driver's event\
    \ handler to respond to card insertion and removal events.\n\nDEV_CONFIG\n\nIndicates\
    \ that the card is configured for use.\n\nDEV_CONFIG_PENDING\n\nIndicates that\
    \ configuration is in progress.\n\nDEV_SUSPEND\n\nIndicates that the card is suspended.\n\
    \nDEV_BUSY\n\nIndicates that an IO operation is in progress. This bit may be used\
    \ as an interlock to prevent access conflicts.\n\nDEV_STALE_CONFIG\n\nFor some\
    \ drivers, when a running card is ejected, the socket should not be unconfigured\
    \ until any devices corresponding to this card are closed. This flag indicates\
    \ that the socket should be unconfigured when the device is closed.\n\nDEV_STALE_LINK\n\
    \nA driver instance should not be deleted until all its resources are released.\
    \ This flag indicates that the driver instance should be freed as soon as the\
    \ socket is unconfigured.\n\nThe open field is a usage count for this device.\
    \ The device should only be freed when the open count is zero. The pending field\
    \ can be used to manage a queue of processes waiting to use the device.\n\nThe\
    \ release field is used to schedule shutdown processing when a card is ejected.\
    \ A removal event needs to be handled at high priority, so a driver's event handler\
    \ will typically deal with an eject by resetting the DEV_PRESENT bit in the device\
    \ state, scheduling the shutdown to running at a later time.\n\nThe handle, io,\
    \ irq, conf, and win fields comprise all the data structures needed to configure\
    \ an ordinary PC Card device\n\nThe priv field can be used for any sort of private\
    \ data structure to manage the device. The next field can be linked to lists of\
    \ dev_link_t structures, for drivers that can handle multiple instances.\n\n#\
    \ 7.1.2 register_pccard_driver\n\n```\nint register_pccard_driver(dev_info_t *dev_info,\n\
    \    dev_link_t (*attach)(void),\n    void (*detach)(dev_link_t *timer));\n```\n\
    \nregister_pccard_driver informs Driver Services that a client driver is present\
    \ and ready to be bound to sockets. When Driver Services receives a DS_BIND_REQUEST\
    \ ioctl that matches the driver's dev_info string, it will call the driver's attach()\
    \ entry point. When it gets a DS_UNBIND_REQUEST ioctl, it will call detach()."
  - "[PAGE 58]\n\n# 7. Driver Services Interface\n\n# 7.1.3 unregister_pccard_driver\n\
    \n```\nint unregister_pccard_driver(dev_info_t *dev_info);\n```\n\nThis informs\
    \ Driver Services that it should no longer bind sockets to the specified client\
    \ driver.\n\n# 7.2 The CardBus client interface\n\nThe CardBus card interface\
    \ is designed to be essentially an extension of the PCI bus. CardBus cards are\
    \ typically designed using standard PCI chip sets. For simplicity in the client\
    \ drivers, and maximum code sharing with kernel PCI drivers, we provide a sort\
    \ of “super client” for configuring CardBus cards. This is implemented in the\
    \ cb_enable module.\n\nThe cb_enable module is somewhat similar in philosophy\
    \ to the Driver Services for 16-bit cards. CardBus client drivers register with\
    \ it, and provide a few entry points for handling device setup and shutdown, as\
    \ well as power management handling. The cb_enable module takes care of configuring\
    \ the card and fielding Card Services Events. So, all CardBus-specific code is\
    \ the enabler rather than the PCI driver.\n\nIt is not mandatory for CardBus clients\
    \ to use the cb_enable interface. If a particular client requires more direct\
    \ control over its CardBus configuration than provided by the cb_enable module,\
    \ it can register directly with Card Services and perform Card Services directly,\
    \ just like a 16-bit client.\n\nThe cb_enable module has two entry points: register_driver\
    \ and unregister_driver. At some point, these functions may migrate into the kernel:\
    \ hence the generic names.\n\n# 7.2.1 register_driver\n\n```\nint register_driver(struct\
    \ driver_operations *ops);\n```\n\nThe driver_operations structure is given by:\n\
    \n```\nstruct driver_operations {\n    char *name\n    dev_node_t *(attach)(dev_locator\
    \ *tloc);\n    void (*suspend)(dev_node_t *dev);\n    void (*resume)(dev_node_t\
    \ *dev);\n    void (*detach)(dev_node_t *dev);\n};\n```\n\nThe name field is used\
    \ by cb_enable when registering this client with Card Services. The rest of the\
    \ structure describes a set of event handlers for this client.\nThe function returns\
    \ 0 on success, and -1 on failure.\n\n# 7.2.2 unregister_driver\n\n```\nvoid unregister_driver(struct\
    \ driver_operations *ops);\n```\n\nThe ops parameter should be the same structure\
    \ pointer passed to prior successful call to register_driver. The client should\
    \ take care to only call this function when no devices are currently being managed\
    \ by the client."
- md: "\n## 7. Driver Services Interface\n\n### 7.2.3 The driver_operations entry\
    \ points\n\nThe attach() entry point is used to configure a single device, given\
    \ a \"device locator\" structure describing where to find it.\n\nThe dev_locator_t\
    \ structure is given by:\n\n```c\ntypedef struct dev_locator_t {\n    enum { LOC_ISA,\
    \ LOC_PCI } bus;\n    union {\n        struct {\n            u_short io_base_1,\
    \ io_base_2;\n            u_long mem_base;\n            u_char irq, dma;\n   \
    \     } isa;\n        struct {\n            u_char bus;\n            u_char devfn;\n\
    \        } pci;\n    } b;\n} dev_locator_t;\n```\n\nThe attach() function should\
    \ return either NULL or a valid dev_node_t structure describing the new device.\
    \ All other entry points use this pointer to identify the device to be manipulated.\
    \ The cb_enabler module will invoke the attach() and detach() entry points in\
    \ response to card insertion and removal events. The suspend() and resume() entry\
    \ points will be called in response to power management events.\n\nThere is no\
    \ way to refuse a suspend() or detach(). When a detach() event is received, the\
    \ driver should block any subsequent IO to the specified device, but may preserve\
    \ internal data structures until the kernel device is actually closed.\n\n## 7.3\
    \ Interface to user mode utilities\n\nDriver Services creates a pseudo-device\
    \ for communicating with user mode PC Cards. The major number of the device is\
    \ chosen dynamically, and PC Cards use /proc/devices to determine it. Minor device\
    \ corresponds to socket numbers, starting with 0.\n\nOnly one process is allowed\
    \ to open a socket for read/write. Other processes can open the socket in read-only.\
    \ A read-only connection to Driver Services can perform a subset of ioctl. A read/write\
    \ connection can issue all ioctl, and can also receive Card Services event notifications.\n\
    \n### 7.3.1 Card Services event notifications\n\nDriver Services implements read()\
    \ and select() functions for event notification. Reading from a PC Card device\
    \ returns an unsigned value containing all the events received by Driver Services\
    \ since the previous read(). If no events have been received, the call will block\
    \ until the next event. A select() can be used to monitor several sockets for\
    \ new events.\n\nThe following events are monitored by Driver Services: CS_EVENT_CARD_INSERTION,\
    \ CS_EVENT_CARD_REMOVAL, CS_EVENT_RESET_PHYSICAL, CS_EVENT_CARD_RESET, and CS_EVENT_RESET_COMPLETE.\n\
    \n### 7.3.2 Ioctl descriptions\n\nMost Driver Services ioctl operations directly\
    \ map to Card Services functions. An ioctl call has the form:\n\n```c\nint ioctl(int\
    \ fd, int cmd, ds_ioctl_arg *arg);\n```\n\nThe ds_ioctl_arg_t structure is given\
    \ by:\n\n```c\ntypedef union ds_ioctl_arg_t {\n\tservino_t\t\tservino;\n\tadjust_t\t\
    \tadjust;\n\tconfig_info_t\t\tconfig;\n\ttuple_t\t\ttuple;\n\ttuple_parse_t\t\
    tuple_parse;\n\tclient_req_t\t\tclient_req;\n\tstatus_t\t\tstatus;\n\tconf_reg_t\t\
    \tconf_reg;\n\tcisinfo_t\t\tcisinfo;\n\tregion_info_t\t\tregion;\n\tbind_info_t\t\
    \tbind_info;\n\tmtd_info_t\t\tmtd_info;\n\tcidump_t;cidump;\n} ds_ioctl_arg_t;\n\
    ```\n\nThe following ioctl commands execute the corresponding Card Services function:\n\
    \n- DS_GET_CARD_SERVICES_INFO: Calls CardServices(GetServicesInfo, ..., &arg->servino).\n\
    - DS_ADJUST_RESOURCE_INFO: Calls CardServices(AdjustResourceInfo, ..., &arg->adjust).\n\
    - DS_GET_CONFIGURATION_INFO: Calls CardServices(GetConfigurationInfo, ..., &arg->config).\n\
    - DS_GET_FIRST_TUPLE: Calls CardServices(GetFirstTuple, ..., &arg->tuple).\n-\
    \ DS_GET_NEXT_TUPLE: Calls CardServices(GetNextTuple, ..., &arg->tuple_parse.data).\n\
    - DS_GET_TUPLE_DATA: Calls CardServices(GetTupleData, ..., &arg->tuple_parse.tuple).\
    \ The tuple data is returned in arg->tuple_parse.data.\n- DS_PARSE_TUPLE: Calls\
    \ CardServices(ParseTuple, ..., &arg->tuple_parse.tuple, &arg->tuple_parse.parse).\n\
    - DS_RESET_CARD: Calls CardServices(ResetCard, ...).\n- DS_GET_STATUS: Calls CardServices(GetStatus,\
    \ ..., &arg->status).\n- DS_ACCESS_CONFIGURATION_REGISTER: Calls CardServices(AccessConfigurationRegister,\
    \ ..., &arg->conf_reg).\n- DS_VALIDATE_CIS: Calls CardServices(ValidateCIS, ...,\
    \ &arg->cisinfo).\n- DS_SUSPEND_CARD: Calls CardServices(SuspendCard, ...).\n\
    - DS_RESUME_CARD: Calls CardServices(ResumeCard, ...).\n- DS_EJECT_CARD: Calls\
    \ CardServices(EjectCard, ...).\n- DS_INSERT_CARD: Calls CardServices(InsertCard,\
    \ ...).\n- DS_GET_FIRST_REGION: Calls CardServices(GetFirstRegion, ..., &arg->region).\n\
    - DS_GET_NEXT_REGION: Calls CardServices(GetNextRegion, ..., &arg->region).\n\
    - DS_REPLACE_CIS: Calls CardServices(ReplaceCIS, ..., &arg->cisump).\n\nThe following\
    \ ioctl invoke Driver Services functions. They act on bind_info_t structures:\n\
    \n```c\ntypedef struct bind_info_t {\n    dev_info;\n    dev_info_t;\n    u_char\
    \ function;\n    struct dev_info_t *instance;\n    char name[DEV_NAME_LEN];\n\
    \    u_char major, minor;\n    void *next;\n} bind_info_t;\n```\n\n- DS_BIND_REQUEST:\
    \ This calls a socket to a client device. The specified device ID_info is looked\
    \ up in the list of registered drivers. If this is a multifunction card, the function\
    \ field identifies which card function is being bound. If found, the driver is\
    \ bound to this socket and function using the BindDevice call. Then, Driver Services\
    \ calls the client's attach() entry to create a device instance. The new dev_link_t\
    \ pointer is returned in instance.\n\n## 8. Anatomy of a Card Services Client\
    \ Driver\n\n- DS_GET_DEVICE_INFO: This call retrieves the dev_name, major, and\
    \ minor entries from the dev_link_t structure.\n- DS_UNBIND_REQUEST: This calls\
    \ a socket to a client device. The specified device ID_info is looked up in the\
    \ list of registered drivers. If this is a multifunction card, the function field\
    \ identifies which card function is being bound. If found, the driver is bound\
    \ to this socket and function using the BindDevice call. Then, Driver Services\
    \ calls the client's attach() entry to create a device instance. The new dev_link_t\
    \ pointer is returned in instance.\n- DS_BIND_MTD: Finally, Driver Services calls\
    \ the client's attach() entry to create a device instance.\n\n```c\ntypedef struct\
    \ mtd_info_t {\n    dev_info;\n    u_int attributes;\n    u_int offset;\n} mtd_info_t;\n\
    ```\n\nThis call associates the MTD with the device.\n\n### 8.1 Using Linux drivers\n\
    \nMany of the current client drivers use Linux driver code to perform IO operations.\
    \ The Card Services client module handles card configuration and responds to card\
    \ status change events, but delegates\n"
  mdcn: "\n\n## 7. 驱动服务接口\n\n### 7.2.3 driver_operations 入口\n\n`attach()` 入口点用于配置单个设备，其参数是一个描述设备查找位置的“设备定位器”（device\
    \ locator）结构。\n\n`dev_locator_t` 结构如下：\n\n```c\ntypedef struct dev_locator_t {\n\
    \    enum { LOC_ISA, LOC_PCI } bus;\n    union {\n        struct {\n         \
    \   u_short io_base_1, io_base_2;\n            u_long mem_base;\n            u_char\
    \ irq, dma;\n        } isa;\n        struct {\n            u_char bus;\n     \
    \       u_char devfn;\n        } pci;\n    } b;\n} dev_locator_t;\n```\n\n`attach()`\
    \ 函数应返回 `NULL` 或一个描述新设备的有效 `dev_node_t` 结构。所有其他入口点都使用此指针来识别要操作的设备。`cb_enabler`\
    \ 模块会根据卡的插入和拔出事件调用 `attach()` 和 `detach()` 入口。`suspend()` 和 `resume()` 入口则会在响应电源管理事件时调用。\n\
    \n没有办法拒绝 `suspend()` 或 `detach()`。当接收到 `detach()` 事件时，驱动程序应该阻塞任何对指定设备的后续 IO 操作，但在内核设备实际关闭之前，可以保留内部数据结构。\n\
    \n## 7.3 访问用户态实用工具的接口\n\nDriver Services 创建了一个伪设备，用于与用户态 PC 卡进行通信。设备的主设备号是动态选择的，PC\
    \ 卡通过 `/proc/devices` 确定它。次设备号对应套接字号，从 0 开始。\n\n只允许一个进程打开读写套接字。其他进程可以只读模式打开套接字。到\
    \ Driver Services 的只读连接可以执行部分 `ioctl` 操作。读写连接可以发出所有 `ioctl`，还可以接收 Card Services\
    \ 事件通知。\n\n### 7.3.1 Card Services 事件通知\n\nDriver Services 为事件通知实现了 `read()` 和\
    \ `select()` 函数。从 PC 卡设备读取数据将返回一个无符号值，其中包含了 Driver Services 自上一次 `read()` 以来收到的所有事件。如果没有收到任何事件，调用将阻塞直到下一个事件发生。可以使用\
    \ `select()` 来监控多个套接字是否有新事件。\n\nDriver Services 监控以下事件：`CS_EVENT_CARD_INSERTION`、`CS_EVENT_CARD_REMOVAL`、`CS_EVENT_RESET_PHYSICAL`、`CS_EVENT_CARD_RESET`\
    \ 以及 `CS_EVENT_RESET_COMPLETE`。\n\n### 7.3.2 Ioctl 描述\n\n大多数 Driver Services `ioctl`\
    \ 操作直接映射到 Card Services 函数。`ioctl` 调用形式如下：\n\n```c\nint ioctl(int fd, int cmd,\
    \ ds_ioctl_arg *arg);\n```\n\n`ds_ioctl_arg_t` 结构如下：\n\n```c\ntypedef union ds_ioctl_arg_t\
    \ {\n\tservino_t\t\tservino;\n\tadjust_t\t\tadjust;\n\tconfig_info_t\t\tconfig;\n\
    \ttuple_t\t\ttuple;\n\ttuple_parse_t\ttuple_parse;\n\tclient_req_t\t\tclient_req;\n\
    \tstatus_t\t\tstatus;\n\tconf_reg_t\t\tconf_reg;\n\tcisinfo_t\t\tcisinfo;\n\t\
    region_info_t\t\tregion;\n\tbind_info_t\t\tbind_info;\n\tmtd_info_t\t\tmtd_info;\n\
    \tcidump_t;cidump;\n} ds_ioctl_arg_t;\n```\n\n以下 `ioctl` 命令执行相应的 Card Services\
    \ 函数：\n\n- DS_GET_CARD_SERVICES_INFO: 调用 `CardServices(GetServicesInfo, ..., &arg->servino)`。\n\
    - DS_ADJUST_RESOURCE_INFO: 调用 `CardServices(AdjustResourceInfo, ..., &arg->adjust)`。\n\
    - DS_GET_CONFIGURATION_INFO: 调用 `CardServices(GetConfigurationInfo, ..., &arg->config)`。\n\
    - DS_GET_FIRST_TUPLE: 调用 `CardServices(GetFirstTuple, ..., &arg->tuple)`。\n- DS_GET_NEXT_TUPLE:\
    \ 调用 `CardServices(GetNextTuple, ..., &arg->tuple_parse.data)`。\n- DS_GET_TUPLE_DATA:\
    \ 调用 `CardServices(GetTupleData, ..., &arg->tuple_parse.tuple)`。元组数据返回在 `arg->tuple_parse.data`\
    \ 中。\n- DS_PARSE_TUPLE: 调用 `CardServices(ParseTuple, ..., &arg->tuple_parse.tuple,\
    \ &arg->tuple_parse.parse)`。\n- DS_RESET_CARD: 调用 `CardServices(ResetCard, ...)`。\n\
    - DS_GET_STATUS: 调用 `CardServices(GetStatus, ..., &arg->status)`。\n- DS_ACCESS_CONFIGURATION_REGISTER:\
    \ 调用 `CardServices(AccessConfigurationRegister, ..., &arg->conf_reg)`。\n- DS_VALIDATE_CIS:\
    \ 调用 `CardServices(ValidateCIS, ..., &arg->cisinfo)`。\n- DS_SUSPEND_CARD: 调用 `CardServices(SuspendCard,\
    \ ...)`。\n- DS_RESUME_CARD: 调用 `CardServices(ResumeCard, ...)`。\n- DS_EJECT_CARD:\
    \ 调用 `CardServices(EjectCard, ...)`。\n- DS_INSERT_CARD: 调用 `CardServices(InsertCard,\
    \ ...)`。\n- DS_GET_FIRST_REGION: 调用 `CardServices(GetFirstRegion, ..., &arg->region)`。\n\
    - DS_GET_NEXT_REGION: 调用 `CardServices(GetNextRegion, ..., &arg->region)`。\n-\
    \ DS_REPLACE_CIS: 调用 `CardServices(ReplaceCIS, ..., &arg->cisump)`。\n\n以下 `ioctl`\
    \ 触发 Driver Services 函数。它们作用于 `bind_info_t` 结构：\n\n```c\ntypedef struct bind_info_t\
    \ {\n    dev_info;\n    dev_info_t;\n    u_char function;\n    struct dev_info_t\
    \ *instance;\n    char name[DEV_NAME_LEN];\n    u_char major, minor;\n    void\
    \ *next;\n} bind_info_t;\n```\n\n- DS_BIND_REQUEST: 调用套接字访问客户端设备。指定的 `device_info`\
    \ 在已注册的驱动程序列表中查找。如果是多功能卡，`function` 字段标识要绑定的卡功能。如果找到，则通过 `BindDevice` 调用将驱动绑定到该套接字和功能。然后，Driver\
    \ Services 会调用客户端的 `attach()` 入口创建一个设备实例。新的 `dev_link_t` 指针返回在 `instance`。\n\n\
    ## 8. Card Services 客户端驱动程序结构\n\n- DS_GET_DEVICE_INFO: 此调用从 `dev_link_t` 结构中检索\
