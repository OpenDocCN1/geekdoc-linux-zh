    ```\n\nThe ss_callback_t data structure is given by:\n\n```c\ntypedef struct ss_callback_t\
    \ {\n    void (*handler)(void *info, u_int events);\n    void *info;\n} ss_callback_t;\n\
    ```\n\nThe SS_RegisterCallback sets up a callback function to be invoked when\
