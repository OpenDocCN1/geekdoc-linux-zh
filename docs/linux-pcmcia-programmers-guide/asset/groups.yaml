    # 2 Basic Concepts


    # 2.1 The socket interface


    The PC Card bus has two operating modes: "memory-only" and "memory and IO". The
    first mode was defined by the original Version 1.0 specification and only supports
    simple memory cards. The second mode, defined in Version 2.0, redefines few of
    the memory card control signals to support IO port addressing and interrupt signalling.


    PC Card devices have two spaces: "attribute memory" and "common memory". The interface
    can address up to 16MB of each type of memory. Attribute memory is typically used
    for holding descriptive information and configuration registers. Common memory
    may include the bulk storage of a memory card, or device buffers in the case of
    IO cards. All cards that conform should have a Card Information Structure ("CIS")
    in attribute memory, which describes the card and how it should be configured.


    Separate control signals allow cards to signal their status to the system. These
    signals include card detect, ready/busy, write, power, battery, and allow dead
    card.


    The "memory and IO" interface mode allows cards to address up to 64K of IO ports.
    It also allows cards to signal IO interrupts, and routes one card output to the
    host system''s speaker. In this mode, several of the memory control signals are
    unavailable because those pins are used to carry the extra IO card signals. On
    some cards, these signals can be read from a special configuration register in
    attribute memory, the "Pin Replacement Register".


    # 2.2 The socket controller


    The socket controller serves as a bridge between PC Card devices and the system
    bus. There are several varieties of controllers, but all share the same basic
    functionality. The Socket software layer takes care of all the details of how
    to program the host controller.


    The socket controller has the job of mapping windows of addresses in the host
    memory and IO spaces to windows of addresses in card space. supported controllers
    support at least four memory windows and two IO windows per socket.


    Each memory window is defined by a base address in the host address space, a base
    address in the card address space, and a window size. Some controllers differ
    in their alignment rules for memory windows, but all controllers will support
    windows whose size is at least 4K and a power of two, where the base address is
    a multiple of the window size. Each window can be programmed to point to either
    attribute or common memory.

