    # 2 基础概念


    # 2.1 Socket 接口


    PC Card 总线有两种工作模式：“仅内存”和“内存与 IO”。第一种模式由原始 Version 1.0 规范定义，仅支持简单的内存卡。第二种模式在 Version
    2.0 中定义，重新定义了少量内存卡控制信号以支持 IO 端口寻址和中断信号。


    PC Card 设备有两个空间：“属性内存”和“通用内存”。接口可以寻址每种高达 16MB 的内存。属性内存通常用于存储描述信息和配置寄存器。通用内存可能包括内存卡的批量存储，或者在
    IO 卡的情况下设备缓冲区。所有符合标准的卡都应该在属性内存中有一个卡信息结构（CIS），它描述了卡的情况以及如何配置它。


    独立的控制信号允许卡片向系统发送其状态。这些信号包括卡存在检测、就绪/忙忙、写入、电源、电池和允许死卡。


    “内存与 IO”接口模式允许卡片访问高达 64K 的 IO 端口。它还允许卡片发出 IO 中断，并将一个卡输出路由到主系统的扬声器。在这种模式下，某些内存控制信号是不可用的，因为这些引脚用于携带额外的
    IO 卡信号。在某些卡上，这些信号可以从属性内存中的特殊配置寄存器“引脚替换寄存器”读取。


    # 2.2 Socket 控制器


    Socket 控制器充当 PC Card 设备与系统总线之间的桥梁。有多种控制器，但它们共享相同的基础功能。Socket 软件层负责处理主机控制器的所有细节。


    Socket 控制器的工作是将主机内存和 IO 空间中的地址窗口映射到卡空间中的地址窗口。支持的控制器每个插槽至少支持四个内存窗口和两个 IO 窗口。


    每个内存窗口由主机地址空间中的基地址、卡地址空间中的基地址以及窗口大小定义。某些控制器在内存窗口的对齐规则上有所不同，但所有控制器都支持大小至少为 4K 且为
    2 的幂、且基地址是窗口大小倍数的窗口。每个窗口都可以编程指向属性内存或通用内存。


