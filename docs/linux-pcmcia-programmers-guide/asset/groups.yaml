    int (*ss_entry)(u_int sock, SS_InquireSocket, socket_cap_t *cap);\n```\n\nThe\
    \ socket_cap_t data structure is given by:\n\n```\ntypedef struct socket_cap_t\
    \ {\n    u_int features;\n    u_int irq_mask;\n    u_int map_size;\n    u_char\
    \ pci_irq;\n    u_char cardbus;\n    struct bus_operations *bus;\n} socket_cap_t;\n\
    ```\n\nThe SS_Inquire service is to retrieve socket capabilities. The irq_mask\
    \ field is a bit indicating whether ISA interrupts are configured for IO cards.\
    \ The map_size field gives the granularity of memory windows. The pci_irq field,\
    \ if not zero, is the PCI interrupt number assigned to this socket. It is independent\
    \ of irq_mask, and can actually be used in any situation where exactly one interrupt\
    \ is associated with a specific socket. For CardBus bridges, the cardbus field\
    \ should be non-zero, and gives the PCI bus number of the CardBus side of the\
    \ bridge.\n\nFor sockets that do not directly map cards to the host IO and memory\
    \ space, the bus field is a pointer to a table of entry points for IO primitives\
    \ for this socket.\n\nThe following flags may be specified in features:\n\n+ \
    \  \n\n- **SS_CAP_PAGE_REGS**\n  Indicates that this socket supports full 32-bit\
    \ addressing for 16-bit PC Card memory windows.\n\n- **SS_CAP_VIRTUAL_BUS**\n\
    \  Indicates that this 16-bit card memory and IO accesses must be performed using\
    \ the bus operations table, rather than using native bus operations.\n\n- **SS_CAP_MEM_ALIGN**\n\
    \  Indicates that memory windows must be aligned by the bus size.\n\n- **SS_CAP_STATIC_MAP**\n\
    \  Indicates that memory windows are statically mapped at fixed locations in the\
    \ host address space, and cannot be repositioned.\n\n- **SS_CAP_PCARD**\n  Indicates\
    \ that this socket supports 16-bit PC cards.\n\n- **SS_CAP_CARDBUS**\n  Indicates\
    \ that this supports 32-bit CardBus cards."
  - "[PAGE 66]\n\n# 9. The Socket Driver Layer\n\n# 9.2.2 SS_RegisterCallback\n\n\
    ```\nint (*ss_entry)(u_int sock, SS_RegisterCallback, ss_callback_t *call);\n\
    ```\n\nThe ss_callback_t data structure is given by:\n\n```\ntypedef struct ss_callback_t\
    \ {\n    void (*handler)(void *info, u_int events);\n    void *info;\n} ss_callback_t;\n\
    ```\n\nThe SS_RegisterCallback sets up a callback function to be invoked when\
    \ the socket driver receives status change events. To unregister a callback, this\
    \ function is called with a handler value of NULL. Only one callback function\
    \ can be registered per socket.\n\nThe handler will be called with the value of\
    \ info that was passed to SS_RegisterCallback for this socket, and with a bit\
    \ map of events in the events parameter. The following events are defined:\n\n\
    SS_DETECT\n\n+   - A card detect change (insertion or removal) has been detected.\n\
    \nSS_READY\n\n+   - A memory card's ready signal has changed state.\n\nSS_BATDEAD\n\
    \n+   - A memory card has raised the battery-dead signal.\n\nSS_BATWARN\n\n+ \
    \  - A memory card has raised the battery-low signal.\n\nSS_STSCHG\n\n+   - An\
    \ IO has raised the status change signal.\n\n# 9.2.3 SS_GetStatus\n\n```\nint\
    \ (*ss_entry)(u_int sock, SS_GetStatus, u_int *status);\n```\n\nThe SS_GetStatus\
    \ service returns the current status of this socket. The status parameter will\
    \ be constructed out of the following flags:\n\nSS_WRPROT\n\n+   - The card is\
    \ write-protected.\n\nSS_BATDEAD\n\n+   - A memory card has raised the battery-dead\
    \ signal.\n\nSS_BATWARN\n\n+   - A memory card has raised the battery-low signal."
