    ```\n\n# 4.1.2 CISTPL_LONGLINK_A, CISTPL_LONGLINK_C, CISTPL_LINKTARGET, CISTPL_NOLINK\n\
    \nThe cistpl_longlink_t structure is given by:\n\n```\ntypedef struct cistpl_longlink_t\
    \ {\n    u_int addr;\n} cistpl_longlink_t;\n```\n\nThese tuples are pointers to\
    \ additional chains of CIS tuples, either in attribute or common memory. Each\
    \ CIS tuple can have at most one long link. CISTPL_LONGLINK_A tuples point to\
    \ attribute memory, and CISTPL_LONGLINK_C point to common memory. The standard\
    \ CIS chain at address 0 in attribute memory has an implied link to address 0\
    \ in common memory. A CISTPL_NOLINK tuple can be used to cancel this default link.\n\
    \nThe first tuple of a chain pointed to by a long link must be a CISTPL_LINKTARGET.\
    \ The CS tuple handling will automatically follow long links and verify link targets;\
    \ these tuples are normally invisible unless the TUPLE_RETURN_LINK attribute is\
    \ specified in GetNextTuple.\n\n# 4.1.3 CISTPL_LONGLINK_MFC\n\nThe cistpl_longlink_mfc_t\
    \ structure is given by:\n\n```\ntypedef struct cistpl_longlink_mfc_t {\n    int\
    \ nfn;\n    struct {\n        u_char space;\n        u_int addr;\n    } fn[CISTPL_MAX_FUNCTIONS];\n\
    } cistpl_longlink_mfc_t;\n```\n\nThis tuple identifies a multifunction card, and\
    \ specifies long pointers to CIS chains specific for each function. The space\
    \ field is either CISTPL_MFC_ATTR or CISTPL_MFC_COMMON for attribute or common\
    \ memory space.\n\n# 4.1.4 CISTPL_DEVICE, CISTPL_DEVICE_A\n\nThe cistpl_device_t\
    \ structure is given by:"
