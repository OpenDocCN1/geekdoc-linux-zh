    \ bit is set in the Mask argument.\n\nReturn codes:\n\n- CS_BAD_HANDLE: The client\
    \ handle is invalid.\n\n# 7. Driver Services Interface\n\nDriver Services provides\
    \ a link between Card Services drivers and user mode utilities like the cardmgr\
    \ daemon. It is a sort of Card Services “super-client”. Driver Services use the\
    \ BindDevice function to link other clients with their corresponding cards. Unlike\
    \ other clients, Driver Services remains bound to all sockets as are inserted\
    \ and removed.\n\n## 7.1 Interface to other client drivers\n\nDriver Services\
    \ keeps track of all client drivers that are installed and ready to attach to\
    \ a socket. Client drivers need to have entry points for creating and deleting\
    \ device “instances”, where one device instance is everything needed to manage\
