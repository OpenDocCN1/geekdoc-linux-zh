    \ Mask 参数中设置了 CS_EVENT_READY_CHANGE 位，则将启用就绪变化事件。\n\n返回代码：\n\n- CS_BAD_HANDLE:\
    \ 客户端句柄无效。\n\n# 7. 驱动程序服务接口\n\nDriver Services 在卡服务驱动程序与如 cardmgr 守护进程之类的用户态工具之间建立了连接。它是一种类似于卡服务的“超级客户端”。Driver\
    \ Services 使用 BindDevice 函数将其他客户端与其相应的卡进行绑定。与其他客户端不同，Driver Services 会始终绑定到所有插入和移除的插槽上。\n\
    \n## 7.1 与其他客户端驱动程序的接口\n\nDriver Services 跟踪所有已安装并准备好附加到插槽的客户端驱动程序。客户端驱动程序需要创建和删除设备“实例”的入口，其中一个设备实例包含了管理一个物理卡所需的所有内容。\n\
    \n每个客户端驱动程序由一个唯一的 16 字符标签标识，该标签具有特殊类型 dev_info_t，定义在 cs_types.h 中。每个设备实例由一个 dev_link_t\
    \ 结构描述。\n\n### 7.1.1 dev_link_t 结构\n\ndev_node_t 和 dev_link_t 数据结构如下：\n\n```c\n\
    #include \"ds.h\"\n\ntypedef struct dev_node_t {\n    char dev_name[DEV_NAME_LEN];\n\
    \    u_char major, minor;\n    struct dev_node_t *next;\n};\n\ntypedef struct\
    \ dev_link_t {\n    dev_node_t *dev;\n    u_int state, open;\n    struct wait_queue\
    \ *pending;\n    struct timer_list release;\n    client_handle_t handle;\n   \
    \ io_req_t io;\n    irq_req_t irq;\n    config_req_t conf;\n    window_handle_t\
    \ win;\n    void *priv;\n    struct dev_link_t *next;\n} dev_link_t;\n```\n\n\
    dev_link_t 结构的字段指向一个 dev_node_t 结构链表。在 dev_node_t 中，dev_name 字段由驱动程序填充，包含用于访问该设备的设备文件名，例如，serial_cs\
    \ 驱动程序使用如“ttyS1”之类的名称。访问此设备的主设备和次设备号。Driver Services 通过 DS_GET_DEVICE_INFO ioctl\
    \ 将这些字段传递给用户态程序。\n\n在 dev_link_t 中，state 字段用于跟踪当前设备状态。以下是标志位：\n\n- DEV_PRESENT:\
    \ 表示卡存在。此位应设置。\n- DEV_CONFIG: 表示卡已配置。\n- DEV_CONFIG_PENDING: 表示配置正在进行。\n- DEV_SUSPEND:\
    \ 表示卡已挂起。\n- DEV_BUSY: 表示操作正在进行。\n- DEV_STALE_CONFIG: 表示配置已过期。\n- DEV_STALE_LINK:\
    \ 表示链接已失效。\n\n"
