  raw:
  - '[PAGE 21]


    # 3. Card Services Subfunction Descriptions


    The following flags can be specified in Attributes:


    TUPLE_RETURN_LINK


    Indicates that link tuples (CISTPL_LONGLINK_A, CISPL_LONGLINK_C, CISPL_LONGLINK_MFC,
    CISPL_NOLINK, CISPL_LINTARGET) should be returned. Normally these tuples are processed
    silently.


    TUPLE_RETURN_COMMON


    Indicates that tuples in the "common" CIS section of a multifunction CIS should
    be returned. In the absence of this flag, normally, Card Services will only return
    tuples specific to the function bound to the client.


    Return codes:


    CS_BAD_HANDLE


    The client handle is invalid.


    CS_OUT_OF_RESOURCE


    Card Services was unable to set up a memory window to map the card''s CIS.


    CS_NO_MORE_ITEMS


    There were no tuples matching DesiredTuple.


    # 3.4.2 GetTupleData


    ```

    #include "cistpl.h"

    ```


    ```

    int CardServices(GetTupleData, client_handle_t client, tuple_t *tuple);

    ```


    GetTupleData extracts a series of bytes from the specified tuple, which must have
    been returned by a previous call to GetFirstTuple or GetNextTuple. A maximum of
    TupleDataMax bytes will be copied into the TupleData buffer, starting at an offset
    of TupleOffset bytes. The number of bytes copied is returned in TupleDataLen.


    Return codes:


    CS_BAD_HANDLE


    The client handle is invalid.


    CS_OUT_OF_RESOURCE


    Card Services was unable to set up a memory window to map the card''s CIS.


    CS_NO_MORE_ITEMS


    The tuple does not contain any more data. TupleOffset is greater than or equal
    to the length of the tuple.'
  - "[PAGE 22]\n\n# 3. Card Services Subfunction Descriptions\n\n# 3.4.3 ParseTuple\n\
    \n```\n#include \"cistpl.h\"\n\nint CardServices(ParseTuple, client_handle_t client,\
    \ tuple_t tuple, tuple_t *tuple, cisparse_t *parse);\n```\n\nThe cisparse_t data\
    \ structure is given by:\n\n```\ntypedef union cisparse_t {\n\tcistpl_device_t\
    \      device;\n\tcistpl_checksum_t    checksum;\n\tcistpl_longlink_t    longlink;\n\
    \tcistpl_longlink_mfc_t longlink_mfc;\n\tcistpl_vers_1_t      version_1;\n\tcistpl_altstr_t\
    \      altstr;\n\tcistpl_jedec_t       jedec;\n\tcistpl_manifold_t     manifold;\n\
    \tcistpl_funcd_t       funcd;\n\tcistpl_config_t       config;\n\tcistpl_ctable_entry_t\
    \ cftable_entry;\n\tcistpl_device_geo_t  device_geo;\n\tcistpl_vers_2_t      version_2;\n\
    \tcistpl_org_t         org;\n\tcistpl_format_t      format;\n} cisparse_t;\n```\n\
    \nParseTuple interprets tuple data returned by a previous call to GetTupleData.\
    \ The structure returned depends on the type of the parsed tuple. See the cistpl.h\
    \ file for these structure definitions; some of them are quite complex\n\nReturn\
    \ codes:\n\n```\nCS_BAD_TUPLE\n```\n\nAn error was encountered during parsing\
    \ of this tuple. The tuple may be incomplete, or may be formatted incorrectly.\n\
    \n```\nCS_UNSUPPORTED_FUNCTION\n```\n\nParseTuple cannot parse the specified type.\n\
    \n# 3.4.4 ValidateCIS\n\n```\nint CardServices(ValidateCIS, client_handle_t client,\
    \ cisinfo_t *cisinfo0);\n```\n\nThe cisinfo_t structure is given by:\n\n```\n\
    typedef struct cisinfo_t {\n\tu_int                Chains;\n} cisinfo_t;\n```"
  - "[PAGE 23]\n\n# 3. Card Services Subfunction Descriptions\n\nValidateCIS attempts\
    \ to verify that a card has a reasonable Card Information Structure. It returns\
    \ the number of tuples found in Chains. If the CIS appears to be uninterpretable,\
    \ Chains will be set to 0.\n\nReturn codes:\n\nCS_BAD_HANDLE\n\nThe client handle\
    \ is invalid.\n\nCS_OUT_OF_RESOURCE\n\nCard Services was unable to set up a memory\
    \ window to map the card's CIS.\n\n# 3.4. ReplaceCIS\n\n```\nint CardServices(ReplaceCIS,\
    \ client_handle_t client, cisdump_t *cisifno);\n```\n\nThe cisdump_t structure\
    \ is given by:\n\n```\ntypedef struct cisdump_t {\n    u_int Length;\n    cisdata_t\
    \ Data[CISTPL_MAX_CIS_SIZE];\n} cisinfo_t;\n```\n\nReplaceCIS allows a client\
    \ to pass Card Services a replacement for the CIS on a card. Its intended application\
    \ is for cards with incomplete or inaccurate CIS information. If a correct CIS\
    \ can be deduced from other information available for the card, this allows information\
    \ to be provided to clients in a clean fashion. The alternative is to pollute\
    \ client source code with fixes targeted for each card with a CIS error. The replacement\
    \ CIS remains in effect until the card is ejected, and all tuple-related services\
    \ use the replacement instead of the actual CIS.\n\nThe Length field gives the\
    \ number of bytes of CIS data in the Data array. The Data array can be considered\
    \ to be the even bytes of a card's attribute memory. It should contain all required\
    \ of a normal CIS, including an initial CISTPL_DEVICE tuple and a final CISTPL_END\
    \ tuple. Long links (including CISTPL_LONGLINK_MPFC) may be used: all target addresses\
    \ are interpreted in the replacement CIS space. In general, a replacement CIS\
    \ should also contain the same identification tuples (CISTPL_MANIFID, CISTPL_VERS_1)\
    \ as the original card.\n\nThis service was added in release 3.0.1.\n\nReturn\
    \ codes:\n\nCS_BAD_HANDLE\n\nThe client handle is invalid.\n\nCS_OUT_OF_RESOURCE\n\
    \nCard Services was unable to allocate memory to hold the replacement CIS."
  - "[PAGE 24]\n\n# 3. Card Services Subfunction Descriptions 25\n\n# 3.5 Memory window\
    \ control\n\nEach socket can have up to four active memory windows, mapping portions\
    \ of card memory into the host system address space. A PC card device can address\
    \ most 16MB of both common and attribute memory. Windows would typically be sized\
    \ to a power of two. Depending on socket capabilities, they may need to be aligned\
    \ on a multiple of the window size in both the host and card address spaces.\n\
    \nA memory window is initialized by a call to RequestWindow. Some attributes can\
    \ be modified using ModifyWindow. The segment of card memory mapped to the window\
    \ can be modified using MapMemPage. And windows are released with ReleaseWindow.\
    \ Unlike almost all Other Card subfunctions, the memory functions normally act\
    \ on window_t handles, rather than client_t handles.\n\n# 3.5.1 RequestWindow\n\
    \n```\nint CardServices(RequestWindow, client_handle_t *handle, win_req_t *req);\n\
    ```\n\nThe win_req_t structure is given:\n\n```\ntypedef struct win_req_t {\n\
    \    u_int               Attributes;\n    u_long              Base;\n    u_int\
    \               Size;\n    u_int               AccessSpeed;\n} win_req_t;\n```\n\
    \nRequestWindow maps a window of card memory into system memory. On entry, the\
    \ handle parameter should point to a valid client handle. On return, this will\
    \ be replaced by a window_handle_t handle that should be used in subsequent calls\
    \ to ModifyWindow, MapMemPage, and ReleaseWindow.\n\nThe following flags can be\
    \ specified in Attributes:\n\nWIN_MEMORY_TYPE\n\nThis field can be either WIN_MEMORY_TYPE_CM\
    \ for common memory, or WIN_MEMORY_TYPE_AM for attribute memory.\n\nWIN_DATA_WIDTH\n\
    \nEither WIN_DATA_WIDTH_16 for 16-bit accesses, or WIN_DATA_WIDTH_8 for 8-bit\
    \ access.\n\nWIN_ENABLE\n\nIf this is set, the window is turned on.\n\nWIN_USE_WAIT\n\
    \nSpecifies that the controller should observe the MWAIT signal.\n\nWIN_MAP_BELOW_1MB\n\
    \nRequests that the window be mapped below the 1MB address boundary. This may\
    \ not be possible on some platforms.\n\nWIN_STRICT_ALIGN\n\nRequests that the\
    \ base be aligned to a multiple of the window size. Added in release 3.1.2."
  - "[PAGE 25]\n\n# 3. Card Services Subfunction Descriptions\n\nBase specifies the\
    \ base physical address of the window in system memory. If zero, Card Services\
    \ will set Base to the first available window address. Size specifies the window\
    \ size in bytes. If zero, Card Services will set Size to the smallest window size\
    \ supported by the host controller. AccessSpeed specifies the memory access speed,\
    \ in nanoseconds.\n\nReturn codes:\n\nCS_BAD_HANDLE\n\nThe client handle is invalid.\n\
    \nCS_NO_CARD\n\nThe socket assigned to this client is currently vacant.\n\nCS_BAD_ATTRIBUTE\n\
    \nAn unsupported window attribute was requested.\n\nCS_OUT_OF_RESOURCE\n\nThe\
    \ maximum number of memory windows for this socket are already being used.\n\n\
    CS_IN_USE\n\nRequestWindow was unable to find a free window of system memory.\n\
    \nCS_BAD_SIZE\n\n,\n\nCS_BAD_BASE\n\nEither Base or Size does not satisfy the\
    \ alignment rules for this socket.\n\n# 3.5.2 ModifyWindow\n\n```\nint CardServices(ModifyWindow,\
    \ window_handle_t handle, modwin_t *mod);\n```\n\nThe modwin_t structure is given\
    \ by:\n\n```\ntypedef struct modwin_t {\n    u_int       Attributes;\n    u_int\
    \       AccessSpeed;\n} modwin_t;\n```\n\nModifyWindow modifies the attributes\
    \ of a window handle returned by a previous call to RequestWindow. The following\
    \ attributes can be changed:\n\nWIN_MEMORY_TYPE\n\nThis field can be either WIN_MEMORY_TYPE_CM\
    \ for common memory, or WIN_MEMORY_TYPE_AM for attribute memory.\n\nWIN_DATA_WIDTH\n\
    \nEither WIN_DATA_WIDTH_16 for 16-bit accesses, or WIN_DATA_WIDTH_8 for 8-bit\
    \ access."
- md: "\n## 3. Card Services Subfunction Descriptions\n\nWIN_ENABLE\nIf this is set,\
    \ the window is turned on.\n\nAccessSpeed gives the new memory access speed, in\
    \ nanoseconds.\nReturn codes:\n\n- CS_BAD_HANDLE\nThe window handle is invalid.\n\
    \n### 3.5.3 ReleaseWindow\n\n```\nint CardServices(ReleaseWindow, window_handle_t\
    \ handle);\n```\n\nReleaseWindow releases a memory window previously allocated\
    \ with RequestWindow.\nReturn codes:\n\n- CS_BAD_HANDLE\nThe window handle is\
    \ invalid.\n\n### 3.5.4 GetFirstWindow, GetNextWindow\n\n```\nint CardServices(GetFirstWindow,\
    \ client_handle_t *client, win_req_t *req);\nint CardServices(GetNextWindow, window_handle_t\
    \ *handle, win_req_t *req);\n```\n\nThese sequences retrieve window configuration\
    \ information for all of a socket's memory windows.\nGetFirstWindow replaces the\
    \ client window with a memory window handle, which will in turn be updated by\
    \ calls to GetNextWindow.\nThese services were added in release 3.1.0.\n\nReturn\
    \ codes:\n\n- CS_BAD_HANDLE\nThe client handle is invalid.\n\n- CS_NO_MORE_ITEMS\n\
    No windows are configured for this socket.\n\n### 3.5.5 MapMemPage\n\n```\nint\
    \ CardServices(MapMemPage, window_handle_t handle, memreq_t *req);\nint CardServices(GetMemPage,\
    \ window_handle_t handle, memreq_t *req);\n```\n\nThe memreq_t structure is given\
    \ by:\n\n```\ntypedef struct memreq_t {\n    u_int           CardOffset;\n   \
    \ page_t          Page;\n} memreq_t;\n```\n\nMapMemPage sets the address of card\
    \ window that is mapped to the base of a memory window to CardOffset. The window\
    \ should have been created by a call to RequestWindow. The Page parameter is not\
    \ implemented in this version and should be set to 0. In GetMemPage retrieves\
    \ the current card address mapping for a memory window.\n\nThe GetMemPage service\
    \ was added in release 3.1.0.\n\nReturn codes:\n\n- CS_BAD_HANDLE\nThe window\
    \ handle is invalid.\n\n- CS_BAD_PAGE\nThe Page value was non-zero.\n\n- CS_BAD_OFFSET\n\
    The requested CardOffset was out of range or did not have proper alignment.\n\n\
    ## 3.6 Bulk Memory Services\n\nBulk memory services provide a higher level interface\
    \ for accessing memory regions than that provided by the memory window services.\
    \ A client using memory calls does not need to know about the underlying memory\
    \ organization or access methods. The device-specific code is packaged into a\
    \ special Card Services client called a Memory Technology Driver.\n\n### 3.6.1\
    \ RegisterMTD\n\n```\nint CardServices(RegisterMTD, client_handle_t handle, mtd_reg_t\
    \ *reg);\n```\n\nThe mtd_reg_t data structure is given by:\n\n```\ntypedef union\
    \ mtd_reg_t {\n    u_int           Attributes;\n    u_int           Offset;\n\
    \    u_long          MediaID;\n} mtd_reg_t;\n```\n\nRegisterMTD informs Card Services\
    \ that this client MTD will handle requests for a specified memory region. The\
    \ Offset field specifies the starting address of the memory region. The following\
    \ fields are defined in Attributes:\n\nREGION_TYPE\nEither REGION_TYPE_CM for\
    \ common memory, or REGION_TYPE_AM for attribute memory.\n\nThe MediaID field\
    \ is recorded by Card Services, and will be passed to the MTD of any request that\
    \ references this memory region.\n\nOnce an MTD is bound to a memory region by\
    \ a call to RegisterMTD, it will remain bound until the MTD calls DeregisterClient.\n\
    \nReturn codes:\n\n- CS_BAD_HANDLE\nThe client handle is invalid.\n\n- CS_BAD_OFFSET\n\
    Either the offset does not match a valid memory region for this card, or another\
    \ MTD has already registered for this region.\n\n### 3.6.2 GetFirstRegion, GetNextRegion\n\
    \n```\nint CardServices(GetFirstRegion, client_handle_t handle, region_info_t\
    \ *region);\nint CardServices(GetNextRegion, client_handle_t handle, region_info_t\
    \ *region);\n```\n\nThe region_info_t data structure is:\n\n```\ntypedef union\
    \ region_info_t {\n    u_int               Attributes;\n    u_int            \
    \   CardOffset;\n    u_int               RegionSize;\n    u_int              \
    \ AccessSpeed;\n    u_int               BlockSize;\n    u_int               PartMultiple;\n\
    \    u_char              Jecfr, JecInfo;\n    memory_handle_t     next;\n} region_info_t;\n\
    ```\n\nGetFirstRegion and GetNextRegion summarize the information in tuples. CardOffset\
    \ gives the starting address of a region. RegionSize gives the length of the region\
    \ in bytes. AccessSpeed gives the device cycle time in nanoseconds. BlockSize\
    \ gives the size in bytes, and PartMultiple gives the granularity on this device\
    \ in units of BlockSize. Jecfr and JecInfo give the identification for this region.\n\
    \nThe following fields are defined in Attributes:\n\nREGION_TYPE\nEither REGION_TYPE_CM\
    \ for common memory, or REGION_TYPE_AM for attribute memory.\n\nWhen these calls\
    \ are made by an MTD client, only regions that have been bound to this client\
    \ will be returned.\n\nReturn codes:\n\n- CS_NO_MORE_ITEMS\nNo memory regions\
    \ are defined.\n\n### 3.6.3 OpenMemory\n\n```\nint CardServices(OpenMemory, client_handle_t\
    \ *handle, open_mem_t *req);\n```\n\nThe open_mem_t structure is given by:\n\n\
    ```\ntypedef struct open_mem_t {\n    u_int       Attributes;\n    u_int     \
    \  Offset;\n} open_mem_t;\n```\n\nOpenMemory is used to obtain a handle for a\
    \ memory region via the bulk memory services. The Offset field specifies the base\
    \ address of the region. If successful, the client argument is replaced by the\
    \ new memory handle.\n\nThe following fields are defined in Attributes:\n\nMEMORY_TYPE\n\
    Either MEMORY_TYPE_CM for common memory, or MEMORY_TYPE_AM for attribute memory.\n\
    \nMEMORY_EXCLUSIVE\nSpecifies that this client should have exclusive access to\
    \ this memory region.\n\nReturn codes:\n\n- CS_BAD_HANDLE\nThe client handle is\
    \ invalid.\n\n- CS_BAD_OFFSET\nThe offset does not specify a valid region, or\
    \ the region does not have an associated MTD to service memory requests.\n\n###\
    \ 3.6.4 CloseMemory\n\n```\nint CardServices(CloseMemory, memory_handle_t handle);\n\
    ```\n\nCloseMemory releases a memory handle returned by a previous call to OpenMemory.\
    \ A client should release all memory handles before DeregisterClient.\n\nReturn\
    \ codes:\n\n- CS_BAD_HANDLE\nThe memory handle is invalid.\n\n### 3.6.5 ReadMemory,\
    \ WriteMemory\n\n```\nint CardServices(ReadMemory, memory_handle_t handle, mem_op_t\
    \ *req, caddr_t buf);\nint CardServices(WriteMemory, memory_handle_t handle, mem_op_t\
    \ *req, caddr_t buf);\n```\n\nThe mem_op_t structure is given by:\n\n```\ntypedef\
    \ struct mem_op_t {\n    u_int Attributes;\n    u_int Offset;\n    u_int Count;\n\
    } mem_op_t;\n```\n\nReadMemory and WriteMemory read from and write to a card memory\
    \ area defined by the specified memory handle, returned by a previous call to\
    \ OpenMemory. The Offset field gives the offset of the operation from the start\
    \ of the memory region. The Count field gives the number of bytes to be transferred.\
    \ The buf field points to a memory buffer as the destination for a ReadMemory\
    \ operation, or the source for a WriteMemory operation.\n\nThe following fields\
    \ are defined in Attributes:\n\nMEM_OP_BUFFER\nEither MEM_OP_BUFFER_USER if the\
    \ host buffer is in a user memory segment, or MEM_OP_BUFFER_KERNEL if the host\
    \ is in kernel memory.\n\nMEM_OP_DISABLE_ERASE\nSpecifies that card area should\
    \ not be erased before it is written.\n\nMEM_OP_VERIFY\nSpecifies verification\
    \ of write operations.\n\nReturn codes:\n\n- CS_BAD_HANDLE\nThe window handle\
    \ is invalid.\n\n- CS_BAD_OFFSET\nThe specified card offset is beyond the end\
    \ of the memory region.\n\n- CS_BAD_SIZE\nThe specified transfer size extends\
    \ past the end of the memory region.\n\n### 3.6.6 RegisterEraseQueue\n\n```\n\
    int CardServices(RegisterEraseQueue, client_handle_t *handle, eraseq_hdr_t *header);\n\
    ```\n\nThe eraseq_hdr_t structure is given by:\n\n```\ntypedef struct erase_queue_header_t\
    \ {\n    int QueueEntryCount;\n    erase_entry_t *QueueEntryArray;\n} erase_hdr_t;\n\
    ```\n\nThis registers a queue of erase requests with Card Services. An erase_handle_t\
    \ handle will be returned in *handle. When the client calls CheckEraseQueue, Card\
    \ Services will scan the queue and begin asynchronous processing of any new requests.\n\
    \nThe erase_entry_t structure is given by:\n\n```\ntypedef struct erase_entry_t\
    \ {\n    memory_handle_t Handle;\n    u_char State;\n    u_int Size;\n    u_int\
    \ Offset;\n    void *Optional;\n} erase_entry_t;\n```\n\nIn an erase queue, the\
    \ Header field is a memory handle returned by a previous call to OpenMemory. The\
    \ State field indicates the state of the erase request. The following values are\
    \ defined:\n\n- ERASE_QUEUED\nSet by the client to indicate that this is a new\
    \ request.\n\n- ERASE_IDLE\nSet by the client to indicate that this entry is not\
    \ active.\n\n- ERASE_PASSED\nSet by the MTD to indicate successful completion.\n\
    \n- ERASE_FAILED\nSet by the MTD to indicate that the erase failed.\n\n- ERASE_MEDIA_WRPROT\n\
    Indicates that the region is write protected.\n\n- ERASE_NOT_ERASABLE\nIndicates\
    \ that this region does not support erase operations.\n\n- ERASE_BAD_OFFSET\n\
    Indicates that the erase does not start on an erase block boundary.\n\n- ERASE_BAD_SIZE\n\
    Indicates that the requested erase size is not a multiple of the erase block size.\n\
    \n- ERASE_BAD_SOCKET\nSet by the MTD to indicate that there is no card present.\n"
  mdcn: "\n\n## 3. 卡服务子函数描述\n\nWIN_ENABLE\n如果设置此项，则开启窗口。\n\nAccessSpeed 提供新的内存访问速度，单位为纳秒。\n\
    返回代码：\n\n- CS_BAD_HANDLE\n窗口句柄无效。\n\n### 3.5.3 ReleaseWindow\n\n```\nint CardServices(ReleaseWindow,\
    \ window_handle_t handle);\n```\n\nReleaseWindow 释放之前通过 RequestWindow 分配的内存窗口。\n\
    返回代码：\n\n- CS_BAD_HANDLE\n窗口句柄无效。\n\n### 3.5.4 GetFirstWindow, GetNextWindow\n\
    \n```\nint CardServices(GetFirstWindow, client_handle_t *client, win_req_t *req);\n\
    int CardServices(GetNextWindow, window_handle_t *handle, win_req_t *req);\n```\n\
    \n这些序列操作用于获取 socket 所有内存窗口的配置信息。\nGetFirstWindow 将客户端替换为内存窗口句柄，该句柄随后将通过 GetNextWindow\
    \ 的调用进行更新。\n这些服务是在 3.1.0 版本中添加的。\n\n返回代码：\n\n- CS_BAD_HANDLE\n客户端句柄无效。\n\n- CS_NO_MORE_ITEMS\n\
    该 socket 未配置任何窗口。\n\n### 3.5.5 MapMemPage\n\n```\nint CardServices(MapMemPage,\
    \ window_handle_t handle, memreq_t *req);\nint CardServices(GetMemPage, window_handle_t\
    \ handle, memreq_t *req);\n```\n\nmemreq_t 结构体如下：\n\n```\ntypedef struct memreq_t\
    \ {\n    u_int           CardOffset;\n    page_t          Page;\n} memreq_t;\n\
    ```\n\nMapMemPage 将映射到内存窗口基地址的卡窗口地址设置为 CardOffset。该窗口应通过调用 RequestWindow 创建。Page\
    \ 参数在此版本中未实现，应应设置为 0。在 GetMemPage 中，用于检索内存窗口的当前卡地址映射。\n\nGetMemPage 服务是在 3.1.0\
    \ 版本中添加的。\n\n返回代码：\n\n- CS_BAD_HANDLE\n窗口句柄无效。\n\n- CS_BAD_PAGE\nPage 值不零。\n\n\
    - CS_BAD_OFFSET\n请求的 CardOffset 超出范围或未进行适当对齐。\n\n## 3.6 批量内存服务\n\n批量内存服务提供了比内存窗口服务更高级的区域访问接口。使用内存调用的客户端不需要了解底层的内存结构或访问方法。设备特定代码被封装在一个名为内存技术驱动程序（Memory\
    \ Technology Driver）的特殊卡服务客户端。\n\n### 3.6.1 RegisterMTD\n\n```\nint CardServices(RegisterMTD,\
    \ client_handle_t handle, mtd_reg_t *reg);\n```\n\nmtd_reg_t 数据结构如下：\n\n```\n\
    typedef union mtd_reg_t {\n    u_int           Attributes;\n    u_int        \
    \   Offset;\n    u_long          MediaID;\n} mtd_reg_t;\n```\n\nRegisterMTD 通知\
    \ Card Services 该客户端 MTD 将处理指定内存区域的请求。Offset 字段指定内存区域的起始地址。Attributes 定义了以下字段：\n\
    \nREGION_TYPE\n可以是 REGION_TYPE_CM（普通内存）或 REGION_TYPE_AM（属性内存）。\n\nMediaID 字段由\
    \ Card Services 记录，并将传递给任何引用此内存区域的请求的 MTD。\n\n一旦通过调用 RegisterMTD 将 MTD 绑定到内存区域，它将保持绑定直到\
    \ MTD 调用 DeregisterClient。\n\n返回代码：\n\n- CS_BAD_HANDLE\n客户端句柄无效。\n\n- CS_BAD_OFFSET\n\
    偏移量不匹配该卡的有效内存区域，或者另一个 MTD 已注册了该区域。\n\n### 3.6.2 GetFirstRegion, GetNextRegion\n\
    \n```\nint CardServices(GetFirstRegion, client_handle_t handle, region_info_t\
    \ *region);\nint CardServices(GetNextRegion, client_handle_t handle, region_info_t\
    \ *region);\n```\n\nregion_info_t 结构如下：\n\n```\ntypedef union region_info_t {\n\
    \    u_int               Attributes;\n    u_int               CardOffset;\n  \
    \  u_int               RegionSize;\n    u_int               AccessSpeed;\n   \
    \ u_int               BlockSize;\n    u_int               PartMultiple;\n    u_char\
    \              Jecfr, JecInfo;\n    memory_handle_t     next;\n} region_info_t;\n\
    ```\n\nGetFirstRegion 和 GetNextRegion 以元组形式汇总信息。CardOffset 提供区域的起始地址。RegionSize\
    \ 提供区域的长度（字节）。AccessSpeed 提供设备的周期时间（纳秒）。BlockSize 提供字节大小，PartMultiple 提供以 BlockSize\
    \ 为单位设备粒度。Jecfr 和 JecInfo 提供该的标识。\n\nAttributes 定义了以下字段：\n\nREGION_TYPE\n可以是 REGION_TYPE_CM（普通内存）或\
    \ REGION_TYPE_AM（属性内存）。\n\n当 MTD 运行这些调用时，将返回绑定到该客户端的区域。\n\n返回代码：\n\n- CS_NO_MORE_ITEMS\n\
    未定义内存区域。\n\n### 3.6.3 OpenMemory\n\n```\nint CardServices(OpenMemory, client_handle_t\
    \ *handle, open_mem_t *req);\n```\n\nopen_mem_t 结构如下：\n\n```\ntypedef struct open_mem_t\
    \ {\n    u_int       Attributes;\n    u_int       Offset;\n} open_mem_t;\n```\n\
    \nOpenMemory 用于通过批量内存服务获取内存区域的句柄。Offset 字段指定区域的基地址。如果成功，客户端参数将被替换为新的内存句柄。\n\n\
    Attributes 定义了以下字段：\n\nMEMORY_TYPE\n可以是 MEMORY_TYPE_CM（普通内存）或 MEMORY_TYPE_AM（属性内存）。\n\
    \nMEMORY_EXCLUSIVE\n指定该客户端应对该内存区域具有排他访问权限。\n\n返回代码：\n\n- CS_BAD_HANDLE\n客户端句柄无效。\n\
    \n- CS_BAD_OFFSET\n偏移量未指定有效区域，或者该区域没有处理内存 MTD。\n\n### 3.6.4 CloseMemory\n\n```\n\
    int CardServices(CloseMemory, memory_handle_t handle);\n```\n\nCloseMemory 释放之前调用\
    \ OpenMemory 返回的内存句柄。客户端应在 DeregisterClient 之前释放所有内存句柄。\n\n返回代码：\n\n- CS_BAD_HANDLE\n\
    内存句柄无效。\n\n### 3.6.5 ReadMemory, WriteMemory\n\n```\nint CardServices(ReadMemory,\
    \ memory_handle_t handle, mem_op_t *req, caddr_t buf);\nint CardServices(WriteMemory,\
    \ memory_handle_t handle, mem_op_t *req, caddr_t buf);\n```\n\nmem_op_t 结构如下：\n\
    \n```\ntypedef struct mem_op_t {\n    u_int Attributes;\n    u_int Offset;\n \
    \   u_int Count;\n} mem_op_t;\n```\n\nReadMemory 和 WriteMemory 从读取并写入由之前调用 OpenMemory\
    \ 返回的指定内存句柄所定义的卡内存区域。Offset 字段提供操作从内存区域起始处的偏移量。Count 字段提供要传输的字节数。buf 字段指向 ReadMemory\
    \ 操作的目标内存缓冲区，或 WriteMemory 操作源。\n\nAttributes 定义了以下字段：\n\nMEM_OP_BUFFER\n如果主机缓冲区在用户内存段中，为\
    \ MEM_OP_BUFFER_USER；如果主机在内核内存中，为 MEM_OP_BUFFER_KERNEL。\n\nMEM_OP_DISABLE_ERASE\n\
    指定卡区域在写入前不应擦除。\n\nMEM_OP_VERIFY\n指定写入操作的验证。\n\n返回代码：\n\n- CS_BAD_HANDLE\n窗口句柄无效。\n\
    \n- CS_BAD_OFFSET\n指定的卡偏移超出内存区域范围。\n\n- CS_BAD_SIZE\n指定的传输大小超出了内存区域范围。\n\n###\
    \ 3.6.6 RegisterEraseQueue\n\n```\nint CardServices(RegisterEraseQueue, client_handle_t\
    \ *handle, eraseq_hdr_t *header);\n```\n\neraseq_hdr_t 结构如下：\n\n```\ntypedef struct\
    \ erase_queue_header_t {\n    int QueueEntryCount;\n    erase_entry_t *QueueEntryArray;\n\
    } erase_hdr_t;\n```\n\n这向 Card Services 注册一个擦除请求队列。*handle 将返回一个 erase_handle_t\
    \ 句柄。当客户端调用 CheckEraseQueue 时，Card Services 将扫描队列并异步处理任何新请求。\n\nerase_entry_t\
    \ 结构如下：\n\n```\ntypedef struct erase_entry_t {\n    memory_handle_t Handle;\n\
    \    u_char State;\n    u_int Size;\n    u_int Offset;\n    void *Optional;\n\
    } erase_entry_t;\n```\n\n在擦除队列中，Header 字段是之前调用 OpenMemory 返回的内存句柄。State 字段指示擦除请求的状态。定义了以下值：\n\
    \n- ERASE_QUEUED\n客户端设置，表示新请求。\n\n- ERASE_IDLE\n客户端设置，表示该项未激活。\n\n- ERASE_PASSED\n\
    MTD 设置，表示成功完成。\n\n- ERASE_FAILED\nMTD 设置，表示擦除失败。\n\n- ERASE_MEDIA_WRPROT\n表示区域被写保护。\n\
    \n- ERASE_NOT_ERASABLE\n表示该区域不支持擦除操作。\n\n- ERASE_BAD_OFFSET\n表示擦除未在擦除块边界开始。\n\n\
    - ERASE_BAD_SIZE\n表示指定的擦除大小不是擦除块大小的倍数。\n\n- ERASE_BAD_SOCKET\n由 MTD 设置，表示无卡。\n\
    \n"
