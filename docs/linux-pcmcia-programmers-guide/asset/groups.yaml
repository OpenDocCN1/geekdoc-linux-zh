  - "[PAGE 62]\n\n# 8. Anatomy of a Card Services Client Driver\n\nDS_GET_DEVICE_INFO\n\
    \nThis call retrieves the dev_name, major, and minor entries from the dev_link_t\
    \ structure pointed to by instance.\n\nDS_UNBIND_REQUEST\n\nThis calls the detach()\
    \ function for the specified driver and instance, shutting down this device.\n\
    \nFinally, the DS_BIND_MTD request takes an argument of type mtd_info_t:\n\n```\n\
    typedef struct mtd_info_t {\n    dev_info dev_info;\n    u_int    Attributes;\n\
    \    u_int    CardOffset;\n} mtd_info_t;\n```\n\nThis call associates an MTD identified\
    \ by dev_info with a memory region described by Attributes and Cardoffset, which\
    \ have the same meanings as the Card Services BindMTD call.\n\n# 8 Anatomy of\
    \ a Card Services Client Driver\n\nEach release of the Linux Card Services package\
    \ comes with a well-commented \"dummy\" client driver that should be used as a\
    \ starting point for writing a new driver. Look for it in clients/dummy_cs.c.\
    \ This is not just a piece of sample code; it is written as a sort of generic\
    \ driver. If bound to an IO card, it will read the card's CIS and configure the\
    \ card appropriately, assuming the card's CIS is complete and accurate.\n\n# 8.1\
    \ Module initialization and cleanup\n\nAll loadable modules must supply init_module()\
    \ and cleanup_module() functions, which are invoked by the module support when\
    \ the module is installed and removed. A driver's init function should register\
    \ the driver with Driver Services, using the register_pcard_driver(). The cleanup\
    \ function should unregister_pcard_driver() to unregister from Driver Services.\
    \ Depending on the driver, the cleanup function may also need to free any device\
    \ structures that still exist at shutdown.\n\n# 8.2 The *attach() and *_detach()\
    \ functions\n\n*_attach() entry point is responsible for creating an \"instance\"\
    \ of the driver, setting up any data structures needed to manage one. The *attach()\
    \ function should allocate and initialize a dev_link_t structure, and call RegisterClient\
