    # 9.2.7 SS_GetBridge, SS_SetBridge


    ```

    int (*ss_entry)(u_int sock, SS_GetBridge, cb_bridge_map*);

    int (*ss_entry)(u_int sock, SS_SetBridge, cb_bridge_map*);

    ```


    The cb_bridge_map data structure is given by:


    ```

    typedef struct cb_bridge_map {

    u_char map;

    u_char flags;

    u_int start, stop;

    } cb_bridge_map;

    ```


    The SS_GetBridge and SS_SetBridge entry points are used for configuring bridge
    address windows for

    CardBus devices. They are similar to the 16-bit IO and memory map services. It
    is assumed that each

    CardBus socket has at least two IO and two memory bridge windows. The flags field
    is composed of:


    MAP_ACTIVE


    Specifies that the address map should be enabled.


    MAP_PREFETCH


    Specifies that this map can be configured for prefetching.


    MAP_IOSPACE


    Specifies that this space is for 10 space (as opposed to memory space).


    # 9.2.8 SS_ProcSetup


    ```

    int (*ss_entry)(u_int sock, SS_ProcSetup, struct proc_dir_entry *base);

    ```


    Card Services use this entry point to give the socket driver a procfs directory
    handle under which it may

    create status files for a specific socket. It is the socket driver''s responsibility
    to delete any proc entries before

    it is unloaded.'
  - "[PAGE 71]\n\n# 9. The Socket Driver\n\n# 9.3 Supporting unusual socket architectures\n\
    \nThe Socket Services interface is oriented towards socket controllers that allow\
    \ PCMCIA cards to be configured to mimic native system devices with the same functionality.\
    \ ExCA standard specifies that socket controllers should provide two IO and memory\
    \ windows per socket, which can be independently configured and positioned in\
    \ the host address space and mapped to arbitrary segments of address space. Some\
    \ controllers and architectures do not provide this level of functionality. In\
    \ these situations, Socket Services can effectively visualize the socket interface\
    \ for client drivers.\n\nThe client side (including internal Card Services uses),\
    \ to use the virtualized socket interface, code must first specify:\n\n```\n#include\
    \ \"pcmia/bus_ops.h\"\n```\n\n+   - inb, inw, inl, inw_ns, inl_ns\n- insb, insw,\
    \ insl, insw_ns, insl_ns\n- outb, outwl, outw_ns, outl_ns\n- outsb, outsw, outsl,\
    \ outsw_ns, outsl_ns\n- readb, readl, readw, readw_ns, readl_ns\n- writeb, writeol,\
    \ writer, write_ns, writer_ns\n- ioremap, iounmap\n- memcpy_fromio, memcpy_toio\n\
    - request_irq, free_irq\n\nAll IO operations need to be replaced with new bus-neutral\
    \ forms. The following functions need to be virtualized:\n\nThe bus-neutral functions\
    \ have a prefix of \"bus-\", with a new first argument, the bus operations pointer\
    \ returned by SS_InquireSocket. For example, inb(port) should be replaced with\
    \ bus_inb(bus, port).\n\nAll the IO primitives are defined as macros that call\
    \ entry points in the bus operations table. There is not one-to-one mapping from\
    \ IO primitives to bus operation entry points.\n\nThe bus operations table is\
    \ defined as:\n\n```\ntypedef struct bus_operations {\n    *priv;\n    u32 void\
    \ (*inb)(void *bus, u32 port, s32 sz);\n    void (*insb)(void *bus, u32 port,\
    \ void *buf,\n        u32 count, s32 sz);\n    void (*outb)(void *bus, u32 val,\
    \ u32 port, s32 sz);\n    void (*outsb)(void *bus, u32 port, void *buf,\n    \
    \    u32 count, s32 sz);\n    void (*ioremap)(void *bus, long long off, long long\
    \ sz);\n    void (*iounmap)(void *bus, void *addr);\n```"
