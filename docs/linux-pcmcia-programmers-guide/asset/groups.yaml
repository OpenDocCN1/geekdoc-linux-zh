    \ allocated for this card.\n\nReturn codes:\n\n+   * CS_BAD_HANDLE\n  The client\
    \ handle is invalid.\n* CS_CONFIGURATION_LOCKED\n  This socket's configuration\
    \ has been locked by a call to RequestConfiguration. The configuration should\
