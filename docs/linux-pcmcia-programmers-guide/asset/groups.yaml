    \    u_short     speed;\n    u_long      sys_start, sys_stop;\n    u_int     \
    \  card_start;\n} pcard_mem_map;\n```\n\nThe map field specifies the map number.\
    \ The speed field specifies an access speed in nanoseconds. The sys_start and\
    \ sys_stop fields give the starting and ending addresses for the window in the\
    \ host's physical address space. The card_start value specifies the card address\
    \ to be mapped to sys_start. The Linux Card Services layer assume that each socket\
    \ has at least four independently configurable memory windows.\n\nMAP_ACTIVE\n\
    \nSpecifies that the address map should be enabled.\n\nMAP_16BIT\n\nSpecifies\
    \ that the map should be configured for 16-bit accesses (as opposed to 8-bit).\n\
    \nMAP_AUTOSZ\n\nSpecifies that the map should be configured to auto-size bus accesses\
    \ in response to the card's IOCS16 signal."
