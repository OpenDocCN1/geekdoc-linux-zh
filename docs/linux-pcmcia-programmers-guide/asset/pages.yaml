  md: '# 3. Card Services Subfunction Descriptions


    specifies the number of address lines that are actually demanded by the card.
    The IO allocation algorithm assumes that any of the requested address(es) preserves
    the IOAddrLines bits will be acceptable, and will update BasePort1 and BasePort2
    to reflect the address range(s) actually assigned.


    Prior to release 3.1.4, the IOAddrLines field was ignored. The allocator always
    tried to assign the address range requested, unless the base was zero; in that
    case, it would assign any available window aligned to nearest power of two larger
    than the window size. The new allocator verifies that the IOAddrLines parameter
    agrees with the window parameters, and defaults to the pre-3.1.4 behavior if an
    inconsistency is found.


    With multifunction cards, this will allocate IO ports for each card function in
    such a way that all a card''s ports can be managed by the two low-level IO windows
    associated with physical socket. For example, if the drivers for a hypothetical
    four-function card each attempt to allocate one IO window of 8 ports, Card Services
    will consolidate these into a single contiguous 32-port block.


    When this is invoked by a CardBus client, the IO request is ignored. Instead,
    Card Services examines and allocates any necessary resources: this includes IO
    and memory space, well as an interrupt, if needed. One card will reserve all resources
    needed for all card functions, not just the function of the client making the


    This call does not actually configure a socket''s IO windows: this is done by
    a subsequent call to RequestConfiguration.


    The following flags can be specified in Attributes1 and Attributes2:


    IO_DATA_PATH_WIDTH


    This field may be either IO_DATA_PATH_WIDTH_16 for 16-bit access, or IO_DATA_PATH_WIDTH_8
    for 8-bit access, or IO_DATA_PATH_WIDTH_AUTO to dynamically size the bus based
    on the access size.


    Return codes:


    CS_BAD_HANDLE


    The client handle is invalid.


    CS_NO_CARD


    The socket assigned to this client is currently vacant.


    CS_IN_USE


    This socket''s IO windows have already been reserved.


    CS_CONFIGURATION_LOCKED


    This socket''s configuration has been locked by a call to RequestConfiguration.


    CS_BAD_ATTRIBUTE


    An unsupported attribute flag was specified.


    CS_UNSUPPORTED_FUNCTION


    For a CardBus client, this is returned if Card Services was not configured with
    CardBus support.'
