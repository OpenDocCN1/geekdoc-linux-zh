  md: "# 3. Card Services Subfunction Descriptions\n\n# 3.2.6 InsertCard\n\n```\n\
    int CardServices(InsertCard, client_handle_t client);\n```\n\nCard Services sends\
    \ insertion events to all clients of this socket (normally, only Driver Services).\n\
    \nReturn codes:\n\nCS_BAD_HANDLE\n\nThe client handle is invalid.\n\nCS_NO_CARD\n\
    \nThe socket assigned to this client is currently vacant.\n\nCS_IN_USE\n\nThe\
    \ socket has already been configured.\n\n# 3.3 IO card configuration cells\n\n\
    The normal order of events is for a driver to reserve IO ports and an interrupt\
    \ line with calls to RequestIO and RequestIRQ, to actually configure the socket.\
    \ If any of these calls fails, a driver should be sure to release any resources\
    \ it successfully reserved.\n\nMultunction cards can have separate configurations\
    \ for each card function. However, the configurations need to be consistent with\
    \ one another. Each card has its own set of configuration registers, each socket\
    \ has a single interrupt line and can only map two ranges of IO ports.\n\nCardBus\
    \ cards are configured somewhat differently. The RequestIO and RequestConfiguration\
    \ calls have similar roles, Card Services takes responsibility for most of the\
    \ configuration details, and the contents of the request structures are ignored.\n\
    \n# 3.3.1 RequestIO\n\n```\nint CardServices(RequestIO, client_handle_t client,\
    \ io_req_t *req);\n```\n\nThe io_req_t data structure is given by:\n\n```\ntypedef\
    \ struct io_req_t {\n    ioaddr_t BasePort1;\n    ioaddr_t NumPorts1;\n    u_int\
    \ Attributes1;\n    ioaddr_t BasePort2;\n    ioaddr_t NumPorts2;\n    u_int Attributes2;\n\
    \    u_int IOAddrLines;\n} io_req_t;\n```\n\nRequestIO reserves port windows for\
    \ a card. BasePort1 specifies the base IO port address of the window to be reserved.\
    \ If NumPorts2 is non-zero, a second IO port window will also be reserved. IOAddrLines"
