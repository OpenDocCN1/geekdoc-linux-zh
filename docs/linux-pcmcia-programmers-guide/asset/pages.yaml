    \ for common memory, or WIN_MEMORY_TYPE_AM for attribute memory.\n\nWIN_DATA_WIDTH\n\
    \nEither WIN_DATA_WIDTH_16 for 16-bit accesses, or WIN_DATA_WIDTH_8 for 8-bit\
    \ access."
