  md: "# 9. The Socket Driver Layer\n\n# 9.2.1 SS_InquireSocket\n\n```\nint (*ss_entry)(u_int\
    \ sock, SS_InquireSocket, socket_cap_t *cap);\n```\n\nThe socket_cap_t data structure\
    \ is given by:\n\n```\ntypedef struct socket_cap_t {\n    u_int features;\n  \
    \  u_int irq_mask;\n    u_int map_size;\n    u_char pci_irq;\n    u_char cardbus;\n\
    \    struct bus_operations *bus;\n} socket_cap_t;\n```\n\nThe SS_Inquire service\
    \ is to retrieve socket capabilities. The irq_mask field is a bit indicating whether\
    \ ISA interrupts are configured for IO cards. The map_size field gives the granularity\
    \ of memory windows. The pci_irq field, if not zero, is the PCI interrupt number\
    \ assigned to this socket. It is independent of irq_mask, and can actually be\
    \ used in any situation where exactly one interrupt is associated with a specific\
    \ socket. For CardBus bridges, the cardbus field should be non-zero, and gives\
    \ the PCI bus number of the CardBus side of the bridge.\n\nFor sockets that do\
    \ not directly map cards to the host IO and memory space, the bus field is a pointer\
    \ to a table of entry points for IO primitives for this socket.\n\nThe following\
    \ flags may be specified in features:\n\n+   \n\n- **SS_CAP_PAGE_REGS**\n  Indicates\
    \ that this socket supports full 32-bit addressing for 16-bit PC Card memory windows.\n\
    \n- **SS_CAP_VIRTUAL_BUS**\n  Indicates that this 16-bit card memory and IO accesses\
    \ must be performed using the bus operations table, rather than using native bus\
    \ operations.\n\n- **SS_CAP_MEM_ALIGN**\n  Indicates that memory windows must\
    \ be aligned by the bus size.\n\n- **SS_CAP_STATIC_MAP**\n  Indicates that memory\
    \ windows are statically mapped at fixed locations in the host address space,\
    \ and cannot be repositioned.\n\n- **SS_CAP_PCARD**\n  Indicates that this socket\
    \ supports 16-bit PC cards.\n\n- **SS_CAP_CARDBUS**\n  Indicates that this supports\
    \ 32-bit CardBus cards."
