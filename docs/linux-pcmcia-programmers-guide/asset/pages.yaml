    \  ioaddr_t\n    NumPorts2;\n    u_int\n    Attributes2;\n    u_int\n    ID0Lines;\n\
    } config_info_t;\n```\n\nGetConfigurationInfo returns the current configuration\
    \ as it was set by RequestIRQ, and RequestConfiguration. Most fields will only\
    \ be filled if the socket is fully configured; the CONF_VALID_CLIENT field in\
    \ Attributes indicates this fact. For normal clients bound to a single function,\
    \ the Function field is ignored, and data for that client's assigned function\
    \ is returned. For clients bound to BIND_FN_ALL, the ConfigBase field is set to\
