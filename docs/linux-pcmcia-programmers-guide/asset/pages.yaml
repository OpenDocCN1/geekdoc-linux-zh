  md: "# 3. Card Services Subfunction Descriptions\n\nIO windows differ from memory\
    \ windows in host addresses that fall within an window are not modified before\
    \ they are passed on to an IO card. Effectively, the base addresses of the window\
    \ in the host and card address spaces are always equal. IO windows also have no\
    \ alignment or size restrictions; an IO window can start and end on any boundary\
    \ in the 4K IO address space.\n\nThe PC Card defines a single interrupt service\
    \ from the card to the controller. The controller has the responsibility of steering\
    \ this interrupt to an appropriate interrupt request ('Irq') line. All controllers\
    \ supporting steer Card interrupts to essentially any free interrupt line. Because\
    \ steering happens in the controller, the card itself is unaware of which interrupt\
    \ it uses.\n\nAll PC Controllers can generate interrupts in response to card status\
    \ changes. These interrupts are distinct from the IO interrupts generated by an\
    \ IO card, and use a separate interrupt line. Signals that generate interrupts\
    \ include card detect, ready/busy; write protect, battery low, and battery dead.\n\
    \n# 3 Card Services Subfunction Descriptions\n\nCard Services calls the general\
    \ form:\n\n```\n#include \"cs_types.h\"\n#include \"cs.h\"\n\nint CardServices(int\
    \ subfunc, void *arg1, void *arg2, ...);\n```\n\nSome Card Services functions\
    \ require additional #include statements. The particular subfunction determines\
    \ the number of expected arguments. A return code of CS_SUCCESS indicates that\
    \ a call succeeded. Other return codes identify errors.\n\n# 3.1 Client management\
    \ functions\n\nDevice drivers that use Card functions are called 'clients'. A\
    \ device driver should use the RegisterClient call to get a client handler before\
    \ using other services. Most Card Services functions will take this client handler\
    \ as an argument. Before unloading, drivers should also unregister with DeregisterClient.\n\
    \n# 3.1.1 RegisterClient\n\n```\nint CardServices(RegisterClient, client_handle_t\
    \ *client, client_reg_t *reg);\n```\n\nThe client_reg_t data structure is given\
    \ by:\n\n```\ntypedef struct client_reg_t {\n    dev_info_t\n    *dev_info;\n\
    \    Attributes;\n    u_int\n    EventMask;\n    (*event_handler)(event_t event,\
    \ int priority, event_callback_args_t event_callback, event_callback_args_t *args);\n\
    \    u_int\n    Verzion;\n} client_reg_t;\n```"
  merge: -1
  pgno: 6
- img_proc: true
  md: '# 3. Card Services Subfunction Descriptions


    RegisterClient establishes a link between a client driver and Card Services, and
    connects the client with an appropriate socket. The dev_info parameter is used
    by Card Services to match the client with a socket and function; this correspondence
    is normally established by Driver Services via a call to BindDevice. If successful,
    a client handle will be returned in client.


    The following flags can be specified in Attributes:


    # INFO_MASTER_CLIENT


    For use only by the Driver Services. Among other things, specifies that this client
    should not be automatically unbound when a card is ejected from this socket.


    # INFO_IO_CLIENT


    Specifies that this client is an IO driver.


    # INFO_MTD_CLIENT


    Specifies that this client is a Memory Technology Driver.


    # INFO_MEM_CLIENT


    Specifies that this client is a memory card driver.


    # INFO_CARD_SHARE


    Included for compatibility, has no effect.


    # INFO_CARD_EXCL


    Included for compatibility, has no effect.


    EventMask specifies what events this client should be notified. The event_handler
    entry point will be called by Card Services when an event in EventMask is processed.
    The event_handler_args structure is a template for the structure that will be
    passed to the event handler. The Version parameter identifies the Card Services
    level that this driver expects; it is currently ignored.


    A driver should be prepared to handle Card Services events before calling RegisterClient.
    This call will always generate a CS_REGISTRATION_COMPLETE event, and may also
    generate an artificial CS_CARD_INSERTION event if the socket is currently occupied.


    Return codes:


    # CS_OUT_QF_RESOURCE


    An appropriate socket could not be found for this driver.


    # 3.1.2 DeregisterClient


    ```

    int CardServices(DeregisterClient, client_handle_t client);

    ```


    DeregisterClient severs the connection between a client and Card Services. It
    should be called after the client has freed any resources it has allocated. Once
    a connection is broken, it cannot be reestablished until after another call to
    BindDevice.


    Return codes:'
  merge: -1
  pgno: 7
- img_proc: true
  md: "# 3. Card Services Subfunction Descriptions\n\nCS_BAD_HANDLE\n\nThe client\
    \ handle is invalid.\n\nCS_IN_USE\n\nThe client still has allocated resources,\
    \ such as IO port windows or an interrupt, or the socket configuration is locked.\n\
    \n# 3.1.3 SetEventMask\n\n```\nint CardServices(SetEventMask, client_handle_t\
    \ client, eventmask_t *mask);\n```\n\nThe eventmask_t structure is given by:\n\
    \n```\ntypedef struct eventmask_t {\n    u_int\n    Attributes;\n    u_int\n \
    \   EventMask;\n} eventmask_t;\n```\n\nSetEventMask updates the mask that determines\
    \ which events this client will be notified.\n\nReturn codes:\n\nCS_BAD_HANDLE\n\
    \nThe client handle is invalid.\n\n# 3.1.4 BindDevice\n\n```\nint CardServices(BindDevice,\
    \ bind_req_t *req);\n```\n\nThe bind_req_t structure is given by:\n\n```\ntypedef\
    \ struct bind_req_t {\n    socket_t\n    Socket;\n    u_char\n    Function;\n\
    \    dev_info_t\n    *dev_info;\n} bind_req_t;\n```\n\nBindDevice associates a\
    \ device with a particular socket. It is normally called Driver Services after\
    \ a newly inserted card has been identified. Once a driver has been bound to a\
    \ socket, it will be eligible to register as a client of that socket. Note that\
    \ this call does not take a client handle as an argument. This is the only Card\
    \ Service that takes a socket number as an argument.\n\nFunction field specifies\
    \ which function(s) of a multifunction card are to be bound to this driver. Function\
    \ numbers correspond to entries in the card's CISPL_LONGLINK_MFC tuple. If Function\
    \ is set to BIND_FN_ALL, the driver will be bound to all card functions. A driver\
    \ will only be able to access CIS tuples corresponding to functions for which\
    \ it is bound.\n\nReturn codes:\n\nCS_BAD_SOCKET\n\nThe specified socket number\
    \ is invalid."
  merge: -1
  pgno: 8
- img_proc: true
  md: "# 3. Card Services Subfunction Descriptions\n\n# 3.2 Socket state control\n\
    \nThese functions are more or less concerned with getting and setting the current\
    \ operating state of a socket. GetStatus returns the current socket state. ResetCard\
    \ is used to send a hard reset signal to a socket. SuspendAnd ResumeCard can be\
    \ used to power down and power up a socket without releasing the drivers currently\
    \ bound to that socket. EjectCard and InsertCard essentially mimic real card ejection\
    \ and insertion events.\n\n# 3.2.1 GetStatus\n\n```\nint CardServices(GetStatus,\
    \ client_handle_t client, cs_status_t *status);\n```\n\nThe cs_status_t data structure\
    \ is given by:\n\n```\ntypedef struct cs_status_t {\n    u_char Function;\n  \
    \  u_int CardState;\n    u_int SocketState;\n} cs_status_t;\n```\n\nGetStatus\
    \ returns the current status of a client's socket. For cards that are configured\
    \ in IO mode, GetStatus uses the Pin Replacement Register and Extended Status\
    \ Register to determine the card state. For normal clients, the Function is ignored,\
    \ but for clients bound with BIND_FN_ALL, this field specifies the function whose\
    \ configuration registers should be used to determine the socket state, if the\
    \ socket is currently configured. The following flags are defined in CardState:\n\
    \n+   - CS_EVENT_CARD_DETECT\n  Specifies that the socket is occupied.\n- CS_EVENT_CB_DETECT\n\
    \  Specifies that the socket is occupied by a CardBus device.\n- CS_EVENT_WRITE_PROTECT\n\
    \  Specifies that the card is currently protected.\n- CS_EVENT_BATTERY_LOW\n \
    \ Specifies that the card is low.\n- CS_EVENT_BATTERY_DEAD\n  Specifies that the\
    \ card is dead.\n- CS_EVENT_READY_CHANGE\n  Specifies that the card is ready.\n\
    - CS_EVENT_PM_SUSPEND\n  Specifies that the socket is suspended.\n- CS_EVENT_REQUEST_ATTENTION\n\
    \  Specifies that the request attention bit in the extended status register is\
    \ set."
  merge: -1
  pgno: 9
- img_proc: true
  md: '# 3. Card Services Subfunction Descriptions


    ```

    CS_EVENT_CARD_INSERTION

    ```


    Specifies that a card insertion event is in progress. An insertion event will
    be sent to the client when socket setup is complete.


    ```

    CS_EVENT_3VCARD

    ```


    Indicates that the card supports 3.3V operation.


    ```

    CS_EVENT_XVCARD

    ```


    Indicates that the card supports “X.X”V operation. The actual voltage is currently
    undefined in the specification.


    SocketState is currently unused, but in theory, it should latch changes in the
    state of the fields in CardState.


    Return codes:


    ```

    CS_BAD_HANDLE

    ```


    The client handle is invalid.


    # 3.2.2 ResetCard


    ```

    int CardServices(ResetCard, client_handle_t client);

    ```


    ResetCard requests a client''s socket be reset. When this call is made, Card Services
    sends all clients a CS_EVENT_RESET_REQUEST event. If any client requests the request,
    Card Services sends the initiating client a CS_EVENT_RESET_COMPLETE event with
    event_callback_args.info set to the return code of the client that rejected the
    request.


    If all clients agree to the request, Card Services sends a CS_EVENT_RESET_PHYSICAL
    event, then resets the socket. When the socket signals that it is ready, a CS_EVENT_CARD_RESET
    event is generated. Finally, the CS_EVENT_RESET_COMPLETE event is sent to the
    initiating client, with event_callback_args.info set to zero.


    Return codes:


    ```

    CS_BAD_HANDLE

    ```


    The client handle is invalid.


    ```

    CS_NO_CARD

    ```


    The socket assigned to this client is currently vacant.


    ```

    CS_IN_USE

    ```


    This socket is currently being reset.


    # 3.2.3 SuspendCard


    ```

    int CardServices(SuspendCard, client_handle_t client);

    ```'
