    \ structure is given by:\n\n```\ntypedef struct ss_callback_t {\n    void (*handler)(void\
    \ *info, u_int events);\n    void *info;\n} ss_callback_t;\n```\n\nThe SS_RegisterCallback\
    \ sets up a callback function to be invoked when the socket driver receives status\
    \ change events. To unregister a callback, this function is called with a handler\
    \ value of NULL. Only one callback function can be registered per socket.\n\n\
    The handler will be called with the value of info that was passed to SS_RegisterCallback\
    \ for this socket, and with a bit map of events in the events parameter. The following\
    \ events are defined:\n\nSS_DETECT\n\n+   - A card detect change (insertion or\
    \ removal) has been detected.\n\nSS_READY\n\n+   - A memory card's ready signal\
    \ has changed state.\n\nSS_BATDEAD\n\n+   - A memory card has raised the battery-dead\
    \ signal.\n\nSS_BATWARN\n\n+   - A memory card has raised the battery-low signal.\n\
    \nSS_STSCHG\n\n+   - An IO has raised the status change signal.\n\n# 9.2.3 SS_GetStatus\n\
    \n```\nint (*ss_entry)(u_int sock, SS_GetStatus, u_int *status);\n```\n\nThe SS_GetStatus\
    \ service returns the current status of this socket. The status parameter will\
    \ be constructed out of the following flags:\n\nSS_WRPROT\n\n+   - The card is\
    \ write-protected.\n\nSS_BATDEAD\n\n+   - A memory card has raised the battery-dead\
    \ signal.\n\nSS_BATWARN\n\n+   - A memory card has raised the battery-low signal."
