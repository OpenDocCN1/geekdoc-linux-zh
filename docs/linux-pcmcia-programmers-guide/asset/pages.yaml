  md: '# 9. The Socket Driver Layer


    device IO to a compatible driver for a conventional ISA bus card. In some cases,
    a conventional driver can be used without modification. However, to fully support
    PC features like hot swapping and power management, there needs to be some communication
    between the PC Card client code and the device IO code.


    Most Linux drivers expect to probe for devices at boot time, and are not designed
    to handle adding and removing devices. One side-effect of the moves towards driver
    modularization is that it is easily to adapt a modularized driver to handle removable
    devices.


    It is important that a device driver be able to recover from having a device disappear
    at an inappropriate time. At best, the driver should check for device presence
    before attempting any IO operation or before handling an interrupt. Loops that
    check device status should have timeouts or they will eventually exit if a device
    never.


    The dummy cs may be used for loading legacy drivers for compatible PC Devices.
    By binding dummy_cs to a card, the driver module may be able to detect and communicate
    with the device as if it were not a PC Card. This arrangement will generally not
    support clean hot swapping or power management functions, however may be useful
    as a base for later developing a more full-featured client driver.


    # 9 The Socket Driver Layer


    In the PCMIA model, the "Socket Services" layer is a private API intended for
    the use of Card Services. The API is based loosely on the PCMIA Socket Services
    specification, but is oriented for support for the x86 laptop controller types.


    # 9.1 Card Services entry points for socket drivers


    Card Services provides special entry points for registering and unregistering
    socket drivers:


    ```

    typedef int (*ss_entry_t)(u_int sock, u_int cmd, void *arg);

    extern int register_ss_entry(int sock, ss_entry_t entry);

    extern void unregister_ss_entry(int sock, ss_entry_t entry);

    ```


    The socket driver invokes register_ss_entry with nsock indicating how many sockets
    are owned by this driver, and entry pointing to the function that will provide
    socket services for these sockets. The unregister_ss_entry can be safely invoked
    whenever Card Services does not have any callback functions registered for sockets
    owned by this driver.


    # 9.2 Services provided by the socket driver


    Socket Services calls the following form:


    ```

    #include "pcmcia/ss.h"


    int (*ss_entry)(u_int sock, int service, void *arg);

    ```


    Non-zero return codes indicate that a request failed.'
