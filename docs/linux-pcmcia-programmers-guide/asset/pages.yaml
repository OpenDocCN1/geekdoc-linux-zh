  md: "# 3. Card Services Subfunction Descriptions\n\n```\ntypedef struct memreq_t\
    \ {\n    u_int           CardOffset;\n    page_t          Page;\n} memreq_t;\n\
    ```\n\nMapMemPage sets the address of card window that is mapped to the base of\
    \ a memory window to CardOffset. The window should have been created by a call\
    \ to RequestWindow. The Page parameter is not implemented in this version and\
    \ should be set to 0. In GetMemPage retrieves the current card address mapping\
    \ for a memory window.\n\nThe GetMemPage service was added in release 3.1.0.\n\
    \nReturn codes:\n\nCS_BAD_HANDLE\nThe window handle is invalid.\n\nCS_BAD_PAGE\n\
    The Page value was non-zero.\n\nCS_BAD_OFFSET\nThe requested CardOffset was out\
    \ of range or did not have proper alignment.\n\n# 3.6 Bulk Memory Services\n\n\
    Bulk memory services provide a higher level interface for accessing memory regions\
    \ than that provided by the memory window services. A client using memory calls\
    \ does not need to know about the underlying memory organization or access methods.\
    \ The device-specific code is packaged into a special Card Services client called\
    \ a Memory Technology Driver.\n\n# 3.6.1 RegisterMTD\n\n```\nint CardServices(RegisterMTD,\
    \ client_handle_t handle, mtd_reg_t *reg);\n```\n\nThe mtd_reg_t data structure\
    \ is given by:\n\n```\ntypedef union mtd_reg_t {\n    u_int           Attributes;\n\
    \    u_int           Offset;\n    u_long          MediaID;\n} mtd_reg_t;\n```\n\
    \nRegisterMTD informs Card Services that this client MTD will handle requests\
    \ for a specified memory region. The Offset field specifies the starting address\
    \ of the memory region. The following fields are defined in Attributes:\n\nREGION_TYPE\n\
    \nEither REGION_TYPE_CM for common memory, or REGION_TYPE_AM for attribute memory."
