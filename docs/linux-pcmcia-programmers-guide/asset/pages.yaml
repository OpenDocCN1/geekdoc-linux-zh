    \ is invalid, or the socket is not configured.\n\n# 3.3.8 GetConfigurationInfo\n\
    \n```\nint CardServices(GetConfigurationInfo, client_handle_t client, config_info_t\
    \ *config);\n```\n\nThe config_info_t structure is defined as:\n\n```\ntypedef\
    \ struct config_info_t {\n    u_char\n    Function;\n    u_int\n    Attributes;\n\
    \    u_int\n    Vcc, Vpp1, Vpp2;\n    u_int\n    IntType;\n    u_char\n    Status,\
    \ Pin, Copy, ExtStatus;\n    u_int\n    Present;\n    u_int\n    AssignedIRQ;\n\
    \    u_int\n    IRQAttributes;\n    ioaddr_t\n    BasePort1;\n    ioaddr_t\n \
