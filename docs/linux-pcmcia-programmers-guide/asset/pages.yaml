  md: '# 6. Memory Technology Drivers


    CS_EVENT_PM_SUSPEND


    This event signals that Card Services has received either a user initiated or
    APM suspend request. An event handler can veto the suspend by returning failure.


    CS_EVENT_PM_RESUME


    This signals that the system is back on line after a suspend/resume cycle.


    CS_EVENT_MTD_REQUEST


    This is used to initiate an MTD memory operation. A description of the request
    is passed in the mdrequest field of the callback arguments. A host buffer address
    may be passed in buffer.


    CS_EVENT_ERASE_COMPLETE


    This is used to signal a client that a queued erase operation has completed. A
    pointer to the erase entry is returned in the info field of the callback arguments.


    # 5.3 Client driver handling responsibilities


    A client driver should respond to CS_EVENT_CARD_INSERTION and CS_EVENT_CARD_REMOVAL
    events by configuring and unconfiguring the socket. Because card removal is a
    high priority event, the driver should immediately block IO to the socket, by
    setting a flag in a device structure, and schedule all shutdown processing to
    happen later using a timer interrupt.


    When a CS_EVENT_PM_RESET_REQUEST event is received, a driver should block IO and
    receive a locked socket configuration. When a CS_EVENT_CARD_RESET is received,
    a driver should restore the socket configuration and unlock IO.


    A CS_EVENT_PM_SUSPEND event should be handled something like a CS_EVENT_PM_RESET_REQUEST
    event, in that IO should be blocked and the socket configuration should be restored.
    When a CS_EVENT_PM_RESUME event is received, a driver can expect a card to be
    ready to be reconfigured, similar to when a CS_EVENT_CARD_RESET event is received.


    # 6 Memory Technology Drivers


    A Memory Technology Driver ("MTD") is used by Card Services to implement memory
    services for a particular type of memory device. An MTD should register as a normal
    Card Client with a call to RegisterClient. When it receives a card insert event,
    it should use GetFirstRegion and GetNextRegion to identify regions it will administer.
    Then, it should RegisterMTD to take control of these regions. MTD read, write,
    copy, and erase requests are packed into CS_EVENT_MTD_REQUEST events by Card Services,
    and passed to the MTD''s event handler for processing.


    # 6.1 MTD request handling


    An MTD receives requests from Card Services in the form of CS_EVENT_MTD_REQUEST
    events. Card Services pass a description of the mdrequest field of the callback
    arguments. For requests that transfer data to or from the host, the host buffer
    address is passed in the buffer.


    The mdrequest_t structure is given by:'
