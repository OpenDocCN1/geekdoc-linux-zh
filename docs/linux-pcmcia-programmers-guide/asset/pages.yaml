- img_proc: true
  md: '# 4. Card Information Structure Definitions


    PRR_READY_STATUS

    The current state of the ready signal.


    PRR_BVD2_STATUS

    The current state of the battery warn signal.


    PRR_BVD1_STATUS

    The current state of the battery dead signal.


    PRR_WP_EVENT

    Indicates that the write protect signal has changed state since the PRR register
    was last read.


    PRR_READY_EVENT

    Indicates that the ready signal has changed state since the PRR register was last
    read.


    PRR_BVD2_EVENT

    Indicates that the battery warn signal has changed state since the PRR register
    was last read.


    PRR_BVD1_EVENT

    Indicates that the battery dead signal has changed state since the PRR register
    was last read.


    This register can also be written. In this case, the STATUS bits act as a mask;
    if a STATUS bit is set, the corresponding EVENT bit is updated by the write.


    # 4.2.4 Socket and Copy Register


    This register is used when identical cards may be set up to share the same range
    of IO ports, to emulate an ISA card that would control several devices. For example,
    an ISA hard drive controller might control several drives, selectable by writing
    a drive number to an IO port. For several card drives to emulate this controller
    interface, each needs to “know” which drive it is, so that it can identify which
    IO operations are intended for it.


    The following bit fields are defined:


    SCR_SOCKET_NUM

    This should indicate the socket number which the card is located.


    SCR_COPY_NUM

    If several identical cards are installed in a system, this field should be set
    to a unique number identifying which of the cards this is.


    # 4.2.5 Extended Status Register


    The following bit fields are defined:


    ESR_REQ_ATTN_ENA

    When set, the CCSR_CHANGED bit will be set when the ESR_REQ_ATTN bit is set, possibly
    generating a status change interrupt.'
