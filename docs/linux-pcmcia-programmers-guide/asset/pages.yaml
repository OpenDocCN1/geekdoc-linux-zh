  md: "# 7. Driver Services Interface\n\n# 7.1.3 unregister_pccard_driver\n\n```\n\
    int unregister_pccard_driver(dev_info_t *dev_info);\n```\n\nThis informs Driver\
    \ Services that it should no longer bind sockets to the specified client driver.\n\
    \n# 7.2 The CardBus client interface\n\nThe CardBus card interface is designed\
    \ to be essentially an extension of the PCI bus. CardBus cards are typically designed\
    \ using standard PCI chip sets. For simplicity in the client drivers, and maximum\
    \ code sharing with kernel PCI drivers, we provide a sort of “super client” for\
    \ configuring CardBus cards. This is implemented in the cb_enable module.\n\n\
    The cb_enable module is somewhat similar in philosophy to the Driver Services\
    \ for 16-bit cards. CardBus client drivers register with it, and provide a few\
    \ entry points for handling device setup and shutdown, as well as power management\
    \ handling. The cb_enable module takes care of configuring the card and fielding\
    \ Card Services Events. So, all CardBus-specific code is the enabler rather than\
    \ the PCI driver.\n\nIt is not mandatory for CardBus clients to use the cb_enable\
    \ interface. If a particular client requires more direct control over its CardBus\
    \ configuration than provided by the cb_enable module, it can register directly\
    \ with Card Services and perform Card Services directly, just like a 16-bit client.\n\
    \nThe cb_enable module has two entry points: register_driver and unregister_driver.\
    \ At some point, these functions may migrate into the kernel: hence the generic\
    \ names.\n\n# 7.2.1 register_driver\n\n```\nint register_driver(struct driver_operations\
    \ *ops);\n```\n\nThe driver_operations structure is given by:\n\n```\nstruct driver_operations\
    \ {\n    char *name\n    dev_node_t *(attach)(dev_locator *tloc);\n    void (*suspend)(dev_node_t\
    \ *dev);\n    void (*resume)(dev_node_t *dev);\n    void (*detach)(dev_node_t\
    \ *dev);\n};\n```\n\nThe name field is used by cb_enable when registering this\
    \ client with Card Services. The rest of the structure describes a set of event\
    \ handlers for this client.\nThe function returns 0 on success, and -1 on failure.\n\
    \n# 7.2.2 unregister_driver\n\n```\nvoid unregister_driver(struct driver_operations\
    \ *ops);\n```\n\nThe ops parameter should be the same structure pointer passed\
    \ to prior successful call to register_driver. The client should take care to\
    \ only call this function when no devices are currently being managed by the client."
  merge: -1
