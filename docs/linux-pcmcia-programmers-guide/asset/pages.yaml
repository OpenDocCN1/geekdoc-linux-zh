    Calls CardServices(GetFirstRegion, ..., &arg->region).\n\nDS_GET_NEXT_REGION\n\
    Calls CardServices(GetNextRegion, ..., &arg->region).\n\nDS_REPLACE_CIS\nCalls\
    \ CardServices(ReplaceCIS, ..., &arg->cisump).\n\nThe following ioctl invoke Driver\
