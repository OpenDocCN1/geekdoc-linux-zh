    \    major, minor;\n    void\n    *next;\n} bind_info_t;\n```\n\nDS_BIND_REQUEST\n\
    This calls a socket to a client device. The specified device ID_info is looked\
    \ up in the list of registered drivers. If this is a multifunction card, the function\
