  md: "# 7. Driver Services Interface\n\n# 7.2.3 The driver_operations entry points\n\
    \nThe attach() entry point is used to configure a single device, given a \"device\
    \ locator\" structure describing where to find it.\n\nThe dev_locator_t structure\
    \ is given by:\n\n```\ntypedef struct dev_locator_t {\n    enum { LOC_ISA, LOC_PCI\
    \ } bus;\n    union {\n        struct {\n            u_short io_base_1, io_base_2;\n\
    \            u_long mem_base;\n            u_char irq, dma;\n        } isa;\n\
    \        struct {\n            u_char bus;\n            u_char devfn;\n      \
    \  } pci;\n    } b;\n} dev_locator_t;\n```\n\nThe attach() function should return\
    \ either NULL or a valid dev_node_t structure describing the new device. All other\
    \ entry points use this pointer to identify the device to be manipulated. The\
    \ cb_enabler module will invoke the attach() and detach() entry points in response\
    \ to card insertion and removal events. The suspend() and resume() entry points\
    \ will be called in response to power management events.\n\nThere is no way to\
    \ refuse a suspend() or detach(). When a detach() event is received, the driver\
    \ should block any subsequent IO to the specified device, but may preserve internal\
    \ data structures until the kernel device is actually closed.\n\n# 7.3 Interface\
    \ to user mode utilities\n\nDriver Services creates a pseudo-device for communicating\
    \ with user mode PC Cards. The major number of the device is chosen dynamically,\
    \ and PC Cards use /proc/devices to determine it. Minor device corresponds to\
    \ socket numbers, starting with 0.\n\nOnly one process is allowed to open a socket\
    \ for read/write. Other processes can open the socket in read-only. A read-only\
    \ connection to Driver Services can perform a subset of ioctl. A read/write connection\
    \ can issue all ioctl, and can also receive Card Services event notifications.\n\
    \n# 7.3.1 Card Services event notifications\n\nDriver Services implements read()\
    \ and select() functions for event notification. Reading from a PC Card device\
    \ returns an unsigned value containing all the events received by Driver Services\
    \ since the previous read(). If no events have been received, the call will block\
    \ until the next event. A select() can be used to monitor several sockets for\
    \ new events.\n\nThe following events are monitored by Driver Services: CS_EVENT_CARD_INSERTION,\
    \ CS_EVENT_CARD_REMOVAL, CS_EVENT_RESET_PHYSICAL, CS_EVENT_CARD_RESET, and CS_EVENT_RESET_COMPLETE."
