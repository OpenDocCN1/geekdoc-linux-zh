  md: "# 3. Card Services Subfunction Descriptions\n\n```\ntypedef struct erase_queue_header_t\
    \ {\n    int QueueEntryCount;\n    erase_entry_t *QueueEntryArray;\n} erase_hdr_t;\n\
    ```\n\nThis registers a queue of erase requests with Card Services. An erase_handle_t\
    \ handle will be returned in *handle. When the client calls CheckEraseQueue, Card\
    \ Services will scan the queue and begin asynchronous processing of any new requests.\n\
    \nThe erase_entry_t structure is given by:\n\n```\ntypedef struct erase_entry_t\
    \ {\n    memory_handle_t Handle;\n    u_char State;\n    u_int Size;\n    u_int\
    \ Offset;\n    void *Optional;\n} erase_entry_t;\n```\n\nIn an erase queue, the\
    \ Header field is a memory handle returned by a previous call to OpenMemory. The\
    \ State field indicates the state of the erase request. The following values are\
    \ defined:\n\n+   ERASE_QUEUED\n\n+   Set by the client to indicate that this\
    \ is a new request.\n\n+   ERASE_IDLE\n\n+   Set by the client to indicate that\
    \ this entry is not active.\n\n+   ERASE_PASSED\n\n+   Set by the MTD to indicate\
    \ successful completion.\n\n+   ERASE_FAILED\n\n+   Set by the MTD to indicate\
    \ that the erase failed.\n\n+   ERASE_MEDIA_WRPROT\n\n+   Indicates that the region\
    \ is write protected.\n\n+   ERASE_NOT_ERASABLE\n\n+   Indicates that this region\
    \ does not support erase operations.\n\n+   ERASE_BAD_OFFSET\n\n+   Indicates\
    \ that the erase does not start on an erase block boundary.\n\n+   ERASE_BAD_SIZE\n\
    \n+   Indicates that the requested erase size is not a multiple of the erase block\
    \ size.\n\n+   ERASE_BAD_SOCKET\n\n+   Set by the MTD to indicate that there is\
    \ no card present."
