  md: '# 8. Anatomy of a Card Services Client Driver


    # 8.3 The *_config() and *_release() functions


    The *_config() function is called to prepare a card for IO. Most drivers read
    some configuration details from the card itself, but have at least some built-in
    knowledge of how the device should be set up. For example, the serial card driver
    reads a CFTABLE_ENTRY tuples to determine appropriate IO port addresses and corresponding
    configuration indices, but the driver ignores interrupt information in the CIS.
    The *_config() function parses relevant parts of a card''s CIS, then calls RequestIO,
    RequestIn, and/ RequestWindow, then call RequestConfiguration.


    When a card is successfully configured, the config() routine should run for the
    dev_name, major, and minor fields in the dev_link_t structure. These fields will
    be returned to user by Driver Services in response to a DS_DEVICE_INFO ioctl.


    The *_release() function should release any resource allocated by a previous call
    to *_config(), and blank the device''s dev_name field.


    The *_config() and *_release functions are normally called in response to card
    status change events or from timer interrupts. They, thus cannot sleep, and must
    not call kernel functions that might block.


    # 8.4 The client event handler


    The *_event() entry point is called from Card Services to notify a driver of card
    status change events.


    # 8.5 Locking and synchronization issues


    A configured socket should be released when all allocated devices are closed.
    Releasing a socket allows its system resources to be allocated for another device.
    If the driver allows resources are reallocated while IO to the original device
    is still in progress, the original driver may interfere with use of the new device.


    A driver instance should only be freed after its corresponding socket configuration
    has been released. Card Services requires that the client release any allocated
    resources before calling DeregisterClient


    All loadable modules have a "use count" that is used by the system to determine
    when it is safe to unload a module. In client drivers this is to increment the
    use count when a device is opened, and decrement the count when a device is closed.
    So, a driver can be unloaded whenever all allocated devices are closed. in particular,
    a driver can be unloaded even if it is bound to a socket, and the module cleanup
    needs to be able to free any such resources that are allocated. This will always
    be safe; if the driver has a use count of zero, all devices are closed, which
    means all active sockets can be released, and all instances can be detached.


    If a *_release() is called while a device is still open, it should set the DEV_STALE_CONFIG
    flag in the device state, to signal that the device should be released when the
    driver''s close() function is called. If a *_detach() is called for a configured
    device, the DEV_STALE_LINK flag should be set to signal that the instance should
    be detached when the *_release() function is called.


    # 8.6 Using Linux drivers to access PC Card devices


    Many of the current client drivers use Linux driver code to perform IO operations.
    The Card Services client module handles card configuration and responds to card
    status change events, but delegates'
