  md: "# 3. Card Services Subfunction Descriptions 25\n\n# 3.5 Memory window control\n\
    \nEach socket can have up to four active memory windows, mapping portions of card\
    \ memory into the host system address space. A PC card device can address most\
    \ 16MB of both common and attribute memory. Windows would typically be sized to\
    \ a power of two. Depending on socket capabilities, they may need to be aligned\
    \ on a multiple of the window size in both the host and card address spaces.\n\
    \nA memory window is initialized by a call to RequestWindow. Some attributes can\
    \ be modified using ModifyWindow. The segment of card memory mapped to the window\
    \ can be modified using MapMemPage. And windows are released with ReleaseWindow.\
    \ Unlike almost all Other Card subfunctions, the memory functions normally act\
    \ on window_t handles, rather than client_t handles.\n\n# 3.5.1 RequestWindow\n\
    \n```\nint CardServices(RequestWindow, client_handle_t *handle, win_req_t *req);\n\
    ```\n\nThe win_req_t structure is given:\n\n```\ntypedef struct win_req_t {\n\
    \    u_int               Attributes;\n    u_long              Base;\n    u_int\
    \               Size;\n    u_int               AccessSpeed;\n} win_req_t;\n```\n\
    \nRequestWindow maps a window of card memory into system memory. On entry, the\
    \ handle parameter should point to a valid client handle. On return, this will\
    \ be replaced by a window_handle_t handle that should be used in subsequent calls\
    \ to ModifyWindow, MapMemPage, and ReleaseWindow.\n\nThe following flags can be\
    \ specified in Attributes:\n\nWIN_MEMORY_TYPE\n\nThis field can be either WIN_MEMORY_TYPE_CM\
    \ for common memory, or WIN_MEMORY_TYPE_AM for attribute memory.\n\nWIN_DATA_WIDTH\n\
    \nEither WIN_DATA_WIDTH_16 for 16-bit accesses, or WIN_DATA_WIDTH_8 for 8-bit\
    \ access.\n\nWIN_ENABLE\n\nIf this is set, the window is turned on.\n\nWIN_USE_WAIT\n\
    \nSpecifies that the controller should observe the MWAIT signal.\n\nWIN_MAP_BELOW_1MB\n\
    \nRequests that the window be mapped below the 1MB address boundary. This may\
    \ not be possible on some platforms.\n\nWIN_STRICT_ALIGN\n\nRequests that the\
    \ base be aligned to a multiple of the window size. Added in release 3.1.2."
  merge: -1
  pgno: 24
- img_proc: true
  md: "# 3. Card Services Subfunction Descriptions\n\nBase specifies the base physical\
    \ address of the window in system memory. If zero, Card Services will set Base\
    \ to the first available window address. Size specifies the window size in bytes.\
    \ If zero, Card Services will set Size to the smallest window size supported by\
    \ the host controller. AccessSpeed specifies the memory access speed, in nanoseconds.\n\
    \nReturn codes:\n\nCS_BAD_HANDLE\n\nThe client handle is invalid.\n\nCS_NO_CARD\n\
    \nThe socket assigned to this client is currently vacant.\n\nCS_BAD_ATTRIBUTE\n\
    \nAn unsupported window attribute was requested.\n\nCS_OUT_OF_RESOURCE\n\nThe\
    \ maximum number of memory windows for this socket are already being used.\n\n\
    CS_IN_USE\n\nRequestWindow was unable to find a free window of system memory.\n\
    \nCS_BAD_SIZE\n\n,\n\nCS_BAD_BASE\n\nEither Base or Size does not satisfy the\
    \ alignment rules for this socket.\n\n# 3.5.2 ModifyWindow\n\n```\nint CardServices(ModifyWindow,\
