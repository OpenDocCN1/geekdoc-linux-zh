- img_proc: true
  md: "# 7. Driver Services Interface\n\nDEV_PRESENT\n\nIndicates that the card is\
    \ present. This bit should be set and cleared by the driver's event handler to\
    \ respond to card insertion and removal events.\n\nDEV_CONFIG\n\nIndicates that\
    \ the card is configured for use.\n\nDEV_CONFIG_PENDING\n\nIndicates that configuration\
    \ is in progress.\n\nDEV_SUSPEND\n\nIndicates that the card is suspended.\n\n\
    DEV_BUSY\n\nIndicates that an IO operation is in progress. This bit may be used\
    \ as an interlock to prevent access conflicts.\n\nDEV_STALE_CONFIG\n\nFor some\
    \ drivers, when a running card is ejected, the socket should not be unconfigured\
    \ until any devices corresponding to this card are closed. This flag indicates\
    \ that the socket should be unconfigured when the device is closed.\n\nDEV_STALE_LINK\n\
    \nA driver instance should not be deleted until all its resources are released.\
    \ This flag indicates that the driver instance should be freed as soon as the\
    \ socket is unconfigured.\n\nThe open field is a usage count for this device.\
    \ The device should only be freed when the open count is zero. The pending field\
    \ can be used to manage a queue of processes waiting to use the device.\n\nThe\
    \ release field is used to schedule shutdown processing when a card is ejected.\
    \ A removal event needs to be handled at high priority, so a driver's event handler\
    \ will typically deal with an eject by resetting the DEV_PRESENT bit in the device\
    \ state, scheduling the shutdown to running at a later time.\n\nThe handle, io,\
    \ irq, conf, and win fields comprise all the data structures needed to configure\
    \ an ordinary PC Card device\n\nThe priv field can be used for any sort of private\
    \ data structure to manage the device. The next field can be linked to lists of\
    \ dev_link_t structures, for drivers that can handle multiple instances.\n\n#\
    \ 7.1.2 register_pccard_driver\n\n```\nint register_pccard_driver(dev_info_t *dev_info,\n\
    \    dev_link_t (*attach)(void),\n    void (*detach)(dev_link_t *timer));\n```\n\
    \nregister_pccard_driver informs Driver Services that a client driver is present\
    \ and ready to be bound to sockets. When Driver Services receives a DS_BIND_REQUEST\
    \ ioctl that matches the driver's dev_info string, it will call the driver's attach()\
    \ entry point. When it gets a DS_UNBIND_REQUEST ioctl, it will call detach()."
