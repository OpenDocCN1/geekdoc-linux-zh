  md: "# Driver Services Interface\n\nDriver Services provides a link between Card\
    \ Services drivers and user mode utilities like the cardmgr daemon. It is a sort\
    \ of Card Services “super-client”. Driver Services use the BindDevice function\
    \ to link other clients with their corresponding cards. Unlike other clients,\
    \ Driver Services remains bound to all sockets as are inserted and removed.\n\n\
    # 7.1 Interface to other client drivers\n\nDriver Services keeps track of all\
    \ client drivers that are installed and ready to attach to a socket. Client drivers\
    \ need to have entry points for creating and deleting device “instances”, where\
    \ one device instance is everything needed to manage one physical card.\n\nEach\
    \ client driver is identified by a unique 16-character tag that has the special\
    \ type dev_info_t, defined in cs_types.h. Each device instance is described by\
    \ a dev_link_t structure.\n\n# 7.1.1 The dev_link_t structure\n\nThe dev_node_t\
    \ and dev_link_t data structures are given by:\n\n```\n#include \"ds.h\"\n\ntypedef\
    \ struct dev_node_t {\n    char dev_name[DEV_NAME_LEN];\n    u_char major, minor;\n\
    \    struct dev_node_t *next;\n}\n\ntypedef struct dev_link_t {\n    dev_node_t\
    \ *dev;\n    u_int state, open;\n    struct wait_queue *pending;\n    struct timer_list\
    \ release;\n    client_handle_t handle;\n    io_req_t io;\n    irq_req_t irq;\n\
    \    config_req_t conf;\n    window_handle_t win;\n    void *priv;\n    struct\
    \ dev_link_t *next;\n} dev_link_t;\n```\n\nThe field of the dev_link_t structure\
    \ points to a linked list of dev_node_t structures. In dev_node_t, the dev_name\
    \ field is filled by the driver with a device file name for accessing this device,\
    \ for example, the serial_cs driver uses names like “ttyS1”. The major and minor\
    \ device numbers for accessing this device. Driver Services relays these fields\
    \ to user mode programs via the DS_GET_DEVICE_INFO ioctl.\n\nIn dev_link_t, the\
    \ state field is used to keep track of the current device state. The following\
    \ flags are:"
  merge: -1
