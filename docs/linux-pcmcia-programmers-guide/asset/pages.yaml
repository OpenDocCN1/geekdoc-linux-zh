  md: "# 3. Card Services Subfunction Descriptions\n\n# 3.3.2 ReleaseIO\n\n```\nint\
    \ CardServices(ReleaseIO, client_handle_t client, io_req_t *req);\n```\n\nReleaseIO\
    \ un-reuses IO port windows allocated by a previous call to RequestIO. The req\
    \ parameter should be the same one passed to RequestIO. If several card functions\
    \ are sharing a larger IO port window, ports released by one function may not\
    \ become available for other uses until all card functions have released their\
    \ ports.\n\nFor a CardBus client, this call releases all system resources allocated\
    \ for this card.\n\nReturn codes:\n\n+   * CS_BAD_HANDLE\n  The client handle\
    \ is invalid.\n* CS_CONFIGURATION_LOCKED\n  This socket's configuration has been\
    \ locked by a call to RequestConfiguration. The configuration should be released\
    \ before calling RequestIO.\n* CS_BAD_ARGS\n  The parameters in req do not match\
    \ the parameters passed to RequestIO.\n\n# 3.3.3 RequestIRQ\n\n```\nint CardServices(RequestIRQ,\
    \ client_handle_t client, irq_req_t *req);\n```\n\nThe irq_req_t structure is\
    \ given by:\n\n```\ntypedef struct irq_req_t {\n    u_int               Attributes;\n\
    \    u_int               AssignedIRQ;\n    u_int               IRQInfo1, IRQInfo2;\n\
    \    void                *(Handler)(int, struct pt_regs *);\n    void        \
    \        *Instance;\n};\n```\n\nRequestIRQ uses an interrupt line for a card.\
    \ The IRQINFO1 and IRQInfo2 fields correspond to the interrupt description bytes\
    \ in a CFTABLE_ENTRY tuple. If IRQINFO2_VALID is set in IRQInfo1, then IRQInfo2\
    \ is a bit-mapped mask of allowed interrupt values. Each bit corresponds to one\
    \ interrupt line: bit 0 = irq, bit 1 = irq, etc. A bitmask of 0x100 would mean\
    \ that 12 and 8 would be used. If IRQINFO2_VALID is just the desired interrupt\
    \ number. If the call is successful, the returned interrupt is set in AssignedIRQ.\n\
    \nIf the IRQ_HANDLER_PRESENT flag is set, this call also specifies an interrupt\
    \ handler to be installed when the interrupt is enabled. When RequestConfiguration\
    \ is called, the handler given by Handler will be installed. For 2. 4 kernels,\
    \ the interrupt handler will be installed with the device \"instance\" in Instance.\
    \ For pre-2.1.60 kernels, the kernel irq_dev_map table will also be updated. With\
    \ multifunction cards, the interrupt will be allocated in shared mode, and the\
    \ handler(s) has responsibility for determining which card function(s) require\
    \ attention when an interrupt is received. If a client instead bypasses Card"
