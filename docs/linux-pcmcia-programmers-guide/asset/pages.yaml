  md: "# 7. Driver Services Interface\n\n# 7.3.2 Ioctl descriptions\n\nMost Driver\
    \ Services ioctl operations directly map to Card Services functions. An ioctl\
    \ call has the form:\n\n```\nint ioctl(int fd, int cmd, ds_ioctl_arg *arg);\n\
    ```\n\nThe ds_ioctl_arg_t structure is given by:\n\n```\ntypedef union ds_ioctl_arg_t\
    \ {\n\tservino_t\t\tservino;\n\tadjust_t\t\tadjust;\n\tconfig_info_t\t\tconfig;\n\
    \ntuple_t\t\ttuple;\n\ntuple_parse_t\t\ntuple_parse;\n\tclient_req_t\t\tclient_req;\n\
    \tstatus_t\t\tstatus;\n\tconf_reg_t\t\tconf_reg;\n\tcisinfo_t\t\tcisinfo;\n\t\
    region_info_t\t\tregion;\n\tbind_info_t\t\tbind_info;\n\tmtd_info_t\t\tmtd_info;\n\
    \tcidump_t;\t\tcidump;\n} ds_ioctl_arg_t;\n```\n\nThe following ioctl commands\
    \ execute the corresponding Card Services function:\n\nDS_GET_CARD_SERVICES_INFO\n\
    \nCalls CardServices(GetServicesInfo, ..., &arg->servino).\n\nDS_ADJUST_RESOURCE_INFO\n\
    \nCalls CardServices(AdjustResourceInfo, ..., &arg->adjust).\n\nDS_GET_CONFIGURATION_INFO\n\
    \nCalls CardServices(GetConfigurationInfo, ..., &arg->config).\n\nDS_GET_FIRST_TUPLE\n\
    \nCalls CardServices(GetFirstTuple, ..., &arg->tuple).\n\nDS_GET_NEXT_TUPLE\n\n\
    Calls CardServices(GetNextTuple, ..., &arg->tuple_parse.data).\n\nDS_GET_TUPLE_DATA\n\
    \nCalls CardServices(GetTupleData, ..., &arg->tuple_parse.tuple). The tuple data\
    \ is returned in arg->tuple_parse.data.\n\nDS_PARSE_TUPLE\n\nCalls CardServices(ParseTuple,\
    \ ..., &arg->tuple_parse.tuple, &arg->tuple_parse.parse)."
