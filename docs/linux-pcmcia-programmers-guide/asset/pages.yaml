  md: "# 3. Card Services Subfunction Descriptions\n\nThe MediaID field is recorded\
    \ by Card Services, and will be passed to the MTD of any request that references\
    \ this memory region.\n\nOnce an MTD is bound to a memory region by a call to\
    \ RegisterMTD, it will remain bound until the MTD calls DeregisterClient.\n\n\
    Return codes:\n\nCS_BAD_HANDLE\n\nThe client handle is invalid.\n\nCS_BAD_OFFSET\n\
    \nEither the offset does not match a valid memory region for this card, or another\
    \ MTD has already registered for this region.\n\n# 3.6.2 GetFirstRegion, GetNextRegion\n\
    \n```\nint CardServices(GetFirstRegion, client_handle_t handle, region_info_t\
    \ *region);\nint CardServices(GetNextRegion, client_handle_t handle, region_info_t\
    \ *region);\n```\n\nThe region_info_t data structure is:\n\n```\ntypedef union\
    \ region_info_t {\n    u_int               Attributes;\n    u_int            \
    \   CardOffset;\n    u_int               RegionSize;\n    u_int              \
    \ AccessSpeed;\n    u_int               BlockSize;\n    u_int               PartMultiple;\n\
    \    u_char              JecDMfr, JecDecInfo;\n    memory_handle_t next;\n} region_info_t;\n\
    ```\n\nGetFirstRegion and GetNextRegion summarize the information in a CISTPL_DEVICE,\
    \ CISTPL_JEDEC, and CISTPL_DEVICE_GO tuples. CardOffset gives the starting address\
    \ of a region. RegionSize gives the length of the region in bytes. AccessSpeed\
    \ gives the device's cycle time in nanoseconds. BlockSize gives the erase block\
    \ size in bytes, and PartMultiple gives the granularity of partitions on this\
    \ device, in units of BlockSize. JecDMfr and JecDecInfo give the JEDEC identification\
    \ bytes for this region.\n\nThe following fields are defined in Attributes:\n\n\
    REGION_TYPE\n\nEither REGION_TYPE_CM for common memory, or REGION_TYPE_AM for\
    \ attribute memory.\n\nWhen these calls are made by an MTD client, only regions\
    \ that have been bound to this client through calls to BindMTD will be returned.\n\
    \nReturn codes:\n\nCS_BAD_HANDLE\n\nThe client handle is invalid."
