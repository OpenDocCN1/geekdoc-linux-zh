  md: '# 4. Card Information Structure Definitions


    COR_CONFIG_MASK


    Specifies the configuration table index describing the card''s current operating
    mode.


    COR_LEVEL_REQ


    Specifies that the card should generate level mode (edge-triggered) interrupts,
    the default.


    COR_SOFT_RESET


    Setting this bit performs a “soft” reset operation. Drivers should use the ResetCard
    call to reset a card, rather than writing directly to this register.


    # 4.2.2 Card Configuration and Status Register


    The following bit fields are defined:


    CCSR_INTR_ACK


    If this bit is set, the CCSR_INTR_PENDING bit will remain set until it is explicitly
    cleared.


    CCSR_INTR_PENDING


    Signals that the card is currently asserting an interrupt request. This signal
    may be helpful for supporting interrupt sharing.


    CCSR_POWER_DOWN


    Setting this bit signals the card should enter a power down state.


    CCSR_AUDIO_ENA


    Specifies that the card''s audio output should be enabled.


    CCSR_IODISS


    This is used by the host to indicate that it can only perform 8-bit IO operations
    and 16-bit accesses be carried out as two 8-bit accesses.


    CCSR_SIGCHG_ENA


    This indicates to the card that it should use the SIGCHG signal to indicate changes
    in the WP, READY, BVD1, and BVD2 signals.


    CCSR_CHANGED


    This bit signals to the host that one of the signals in the Pin Replacement Register
    has changed state.


    # 4.2.3 Pin Replacement Register


    Signals in this register replace signals that are not available when a socket
    is operating in memory and IO mode. An IO card will normally assert the SIGCHG
    signal to indicate that one of these signals has changed state, a driver can pull
    this register to find out specifically what happened.


    The following bit fields are defined:


    PRR_WP_STATUS


    The current state of the write protect signal.'
