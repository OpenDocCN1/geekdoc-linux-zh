  md: "# 3. Card Services Subfunction Descriptions\n\nValidateCIS attempts to verify\
    \ that a card has a reasonable Card Information Structure. It returns the number\
    \ of tuples found in Chains. If the CIS appears to be uninterpretable, Chains\
    \ will be set to 0.\n\nReturn codes:\n\nCS_BAD_HANDLE\n\nThe client handle is\
    \ invalid.\n\nCS_OUT_OF_RESOURCE\n\nCard Services was unable to set up a memory\
    \ window to map the card's CIS.\n\n# 3.4. ReplaceCIS\n\n```\nint CardServices(ReplaceCIS,\
    \ client_handle_t client, cisdump_t *cisifno);\n```\n\nThe cisdump_t structure\
    \ is given by:\n\n```\ntypedef struct cisdump_t {\n    u_int Length;\n    cisdata_t\
    \ Data[CISTPL_MAX_CIS_SIZE];\n} cisinfo_t;\n```\n\nReplaceCIS allows a client\
    \ to pass Card Services a replacement for the CIS on a card. Its intended application\
    \ is for cards with incomplete or inaccurate CIS information. If a correct CIS\
    \ can be deduced from other information available for the card, this allows information\
    \ to be provided to clients in a clean fashion. The alternative is to pollute\
    \ client source code with fixes targeted for each card with a CIS error. The replacement\
    \ CIS remains in effect until the card is ejected, and all tuple-related services\
    \ use the replacement instead of the actual CIS.\n\nThe Length field gives the\
    \ number of bytes of CIS data in the Data array. The Data array can be considered\
    \ to be the even bytes of a card's attribute memory. It should contain all required\
    \ of a normal CIS, including an initial CISTPL_DEVICE tuple and a final CISTPL_END\
    \ tuple. Long links (including CISTPL_LONGLINK_MPFC) may be used: all target addresses\
    \ are interpreted in the replacement CIS space. In general, a replacement CIS\
    \ should also contain the same identification tuples (CISTPL_MANIFID, CISTPL_VERS_1)\
    \ as the original card.\n\nThis service was added in release 3.0.1.\n\nReturn\
    \ codes:\n\nCS_BAD_HANDLE\n\nThe client handle is invalid.\n\nCS_OUT_OF_RESOURCE\n\
    \nCard Services was unable to allocate memory to hold the replacement CIS."
