  md: "# 3. Card Services Subfunction Descriptions\n\n```\nioaddr_t    BasePort;\n\
    ioaddr_t    NumPorts;\nu_int       IOAddrLines;\n    struct irq {\n    u_int \
    \       IRQ;\n} irq;\n} resource;\nadjust_t;\n```\n\nAdjustResourceInfo is used\
