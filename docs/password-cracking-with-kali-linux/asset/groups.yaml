    \ Windows 8，而 Windows 10 仍居首位。令人震惊的是，这意味着仍有许多 Windows XP 系统可能处于业务关键位置。\n\n![](img/4a03f08556c51a14a3b88fe549a54ca8_85_0.png)\n\
    \n来源：Statcounter 全球统计 – 2023年2月<sup>1</sup>\n\n计算机加密密码的方法有多种。最安全的方法之一包括对密码进行“加盐”（Salting）。基本上，这意味着使用一个数字或字符串（称为盐值）并将其纳入哈希过程，以确保两个密码哈希永远不同。如果未使用盐值（如\
    \ Microsoft NTLM 哈希那样），如果你能破解一个哈希，那么所有使用相同密码的用户都将拥有相同的哈希。因此，你只需获取哈希并与已知哈希进行比较，如果匹配，你就得到了密码。\n\
    \n基本上，在使用 LM 哈希的系统中，任何不超过 14 个字符的密码都会被转换为全大写，然后拆分为两个 7 字符的密码。每一半随后被加密并组合形成最终的哈希。仅使用大写字母破解\
    \ 7 字符密码是轻而易举的，这就是 LM 哈希安全性不高的原因。\n\n再次强调，由于没有使用盐值，基本上如果你能从系统中获取 LM 哈希，你只需进行查找表比较与其他已知哈希，即可获得实际密码。LM\
    \ 哈希通常与加密更好的 NT 哈希一起存储。这两个哈希的组合称为 NTLM 哈希。Windows NTLM 哈希的一个奇怪注意事项是，如果密码超过 14\
    \ 个字符，则根本不使用 LM 哈希，并且 LM 哈希的内容将无效。在 Windows 系统上也可以关闭存储弱 LM 哈希的功能，这在大多数较新的操作系统中都是如此。\n\
    \n典型的 Windows NTLM 哈希看起来像这样：\n\n```\nac93c8016d14e75a2e9b76bb9e8c2bb6:8516cd0838d1a4dfdl\
    \ ac3e8eb9811350\n```\n\nLM 哈希位于冒号的左侧，更安全的 NT 哈希位于右侧。LM 和 NT 哈希的组合被称为 NTLM 哈希。\n\
    \n### 在线破解 LM/ NTLM 密码哈希\n\n有几个网站允许你输入 Windows NTLM 哈希，它会返回所使用的密码（如果在查找表中）。CrackStation\
