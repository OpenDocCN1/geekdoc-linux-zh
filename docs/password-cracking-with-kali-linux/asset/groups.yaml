    - “介绍 NTLM 身份验证的限制。” *Microsoft*，2012 年 11 月 27 日 - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/dd560653(v=ws.10)\n\
    - “Windows 身份验证中的凭据处理过程。” *Microsoft*，2023 年 8 月 13 日 - https://learn.microsoft.com/en-us/windows-server/security/windows-authentication/credentials-processes-in-windows-authentication\n\
    - “解密支持的 Kerberos 加密类型选择。” *Microsoft*，2020 年 9 月 2 日 - https://techcommunity.microsoft.com/t5/core-infrastructure-and-security/decrypting-the-selection-of-supported-kerberos-encryption-types/ba-p/1628797\n\
    - “Active Directory & Kerberos 滥用。” *Red Team Notes* - https://www.ired.team/offensive-security-experiments/active-directory-kerberos-abuse\n\
    - “从 Kekeo 到 Rubeus。” *Harmj0y*，2018 年 9 月 24 日 - https://blog.harmj0y.net/redteaming/from-kekeo-to-rubeus/\n\
