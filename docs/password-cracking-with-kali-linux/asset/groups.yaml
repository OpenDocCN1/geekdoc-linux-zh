    \ 多了一个 8。这很可能是 OCR 错误或书中的笔误。为了与前一段终端输出中显示的破解成功结果保持一致（技术在技术文档中至关重要），我将其标准化为 `123456789`。*\n\
    \n-   sys/ batman\n-   klog/ 123456789\n-   service/ service\n\n有 4 个密码它未能获取，让我们尝试另一个单词列表：\n\
