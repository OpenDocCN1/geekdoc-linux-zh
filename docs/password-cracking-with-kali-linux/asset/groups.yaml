    mixalpha-space-sv =

    [abcdefghijklmnopqrstuvwxyzäöäABCDEFGH IJKLMNOPQRSTUVWXYZ

    ÄÖ]


    We can use this character set to build a wordlist.


    sudo crunch 3 5 -f charset.lst mixalpha-space-sv -o mixedall.txt


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_62_0.png)


    We now have a mixed character list for password cracking. We could take this and
    combine it with the previous “1 to 5 number” list for a pretty useful combination.
    Or we could use it in a hybrid attack having Hashcat add the numbers.


    As seen below:


    hashcat --remove -m 0 uncracked.txt -o cracked.txt -i -a6 mixedall.txt ?d?d?d?d
    -O


    We will cover Hashcat in depth in a later chapter. For now, just know that the
    command above would take our newly created wordlist, and add one decimal number
    at a time to the wordlist, incrementally. So, the first attack pass would add
    one number to the end of the wordlist, the second pass would add two numbers to
    the end of the words on the wordlist, etc.


    Using this simple technique, I was able to crack numerous password hashes on an
    uncracked list. It cracked passwords like:


    - NMWTÄ,,48

    - hÅ«LlLo1995

    - ËŸminÄY1311

    - NickÅ«2501


    I know the letters look a little different, but this is how Hashcat displays Unicode
    characters. This can come in handy in some situations, but you could accomplish
    a similar effect using rules and combination attacks in the cracking programs.


    ## CRUNCH - CREATING MORE ADVANCED WORDLISTS


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_64_0.png)


    We can use multiple character sets when creating words in crunch. Humans are creatures
    of habit and patterns, so you will find patterns when you crack passwords. You
    can create a custom wordlist with crunch using any pattern.


    Simply, list each character set that you want to use, then use the “@ , % ^” characters
    and create a mask, just like you would with Hashcat. The “@” symbol represents
    characters from the first character set. The “,” the second, “%” represents the
    third character set, etc. You then use the “-t” pattern switch to build your pattern.


    ### WARNING: THIS CAN FILL A HARD DRIVE FAST – YE HAVE BEEN WARNED


    Confusing right? Let''s see an example:


    > sudo crunch 10 10 -f charset.lst mixalpha-space-sv symbols14-space ualpha -o
    mixedsymupper.txt -t @@,%%%


    Don''t let this run for more than a couple seconds! It could generate a HUGE file.
    Hit "Ctrl-C" and look for the "START" file.


    You should see words like this:


    aaa!!!#VVR

    baa!!$#WUS

    aba!*!#KTT

    cab&!!)SSU


    You should see the pattern we built:


    - 3 letters from the mixalpha-space-sv character set (@@@)

    - 4 symbols from the symbols14-space character set (,,,,)

    - 3 from the Upper Alpha character set (%%%)


    Many times, you will find a word that is used over and over in password hashes,
    like a company name. Let''s say we find a string of passwords that have the fictitious
    company initials "WOW", followed by 3 symbols, 2 uppercase letters and 5 numbers.


    We can use the following Crunch command:


    > sudo crunch 13 13 -f charset.lst symbols14-space ualpha numeric -o special.txt
    -t WOW@@,,%%%%


    Again, don''t let it run for more than a couple seconds, then look at the "START"
    output file.


    - WOW!!!AB11910

    - WOW!!!AB11911

    - WOW!!!AB11912

    - WOW!!!AB11913


    Crunch is an amazing tool with a lot of options. If you can''t find a wordlist
    that meets your needs, build it with Crunch! We only touched on a few of the tool
    features. There are additional capabilities and also different ways to store the
    output files - see the crunch manual for helpful examples.


    ## HASHCAT - CREATING WORDLISTS WITH HASHCAT


    A lot of Hashcat users don''t know that you can actually use the Hashcat tool
    itself to create wordlists. You can use any of the standard Hashcat "-a" attack
    commands to produce a wordlist. We will cover several of the Hashcat attack modes
    in a later chapter. So, instead of walking through these step by step, I created
    a chart that shows some common uses:


    | Command | Description | Example Output |

    | :--- | :--- | :--- |

    | `hashcat64 -a 3 -i ?d?d?d?d --stdout > numbers1-4.txt` | Creates words like:
    | 1111<br>1112<br>1123<br>1234 |

    | `hashcat64 -i -a 6 FrenchWordlist.txt ?d?d?d?d --stdout > FrenchNumbers1-4.txt`
    | Creates words like: | chat1111<br>chat2222<br>chien1111<br>chien2222 |

    | `hashcat64 --stdout wordlist.txt -r rules/toggles3.rule -o WordlistRules.txt`
    | Creates words like: | Admin<br>aDmin<br>adMin<br>admiN<br>admin |


    Again, you can use any of the `"-a"` attack modes that you wish, just make sure
    you use the ` "--stdout"` switch. You can then specify an output file with `"-o"`
    or just use the `">"` file redirect command.


    ## HASHCAT UTILS


    Tool GitHub: [https://github.com/hashcat/hashcat-utils](https://github.com/hashcat/hashcat-utils)


    Tool Releases: [https://github.com/hashcat/hashcat-utils/releases](https://github.com/hashcat/hashcat-utils/releases)


    Not too many in the security world know about the Hashcat Utilities. The utilities
    are a separate download from Hashcat and are a great set of resource tools for
    password cracking, and creating wordlists. You can download the Hashcat utilities
    from the tool website, then install by following the instructions provided on
    the site. For example, for a Windows install, you just unzip the latest release
    download and run the .exe you need.


    ### Prepare Your Source Wordlists


    Gather the wordlists you intend to combine. These can be standard dictionaries,
    common phrases, leaked passwords, or any other relevant sources.


    > **WARNING:** *Use very small wordlists, as this COULD fill your hard drive fast!*
    *The generated output file is **exponentially** bigger than the input files.*


    ### Using the Combinator Command:


    The **combinator** command is used to generate wordlist combinations from multiple
    input files. It will produce a single file containing all possible combinations
    of words from the input files. Basic usage:


    > combinator [INPUT_FILES] > [OUTPUT_FILE]


    For example, to combine the wordlists, **dictionary1.txt** and **dictionary2.txt**,
    you would run:


    combinator dictionary1.txt dictionary2.txt > combined_wordlist.txt


    ### Using the Combinator3 Command:

