  mdcn: "\n\n# 第4章\n\n## 确定哈希类型与破解简单密码\n\n计算机操作系统和应用程序通常以加密形式存储密码，称为密码哈希。哈希是实际密码的加密表示。因此，需要解密或破解哈希才能找到真实密码。令人惊讶的是，一些服务仍以明文形式存储或传输密码！但在大多数安全测试中，当你恢复用户密码时，它通常处于加密的哈希形式。\n\
