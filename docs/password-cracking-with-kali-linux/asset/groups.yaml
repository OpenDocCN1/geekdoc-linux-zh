  - '[PAGE 29]


    Once the attacker has access to a system, they may deploy Rubeus on the compromised
    host. Rubeus is a standalone tool that can be run from the command line.


    # 3. Run the Rubeus Kerberoast Attack


    The attacker uses Rubeus to request a Ticket Granting Ticket (TGT) for a specific
    user or all of the users. This is often a domain user account, and the goal is
    to obtain the TGT, which can then be used to request service tickets.


    Sounds complicated, I know. But the attack itself is fairly simple.


    +   - Download and compile the Rubeus executable

    +   - Get the executable file onto the Windows Server target

    +   - In a Windows Server prompt, enter "Rubeus.exe kerberoast"'
  - '[PAGE 30]


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_30_0.png)


    Rubeus will then run the kerberoast attack against the Domain and display any
    service account hashes that it can find. That’s it, if the attack is successful,
    we now have the password hash of numerous service accounts that we can try to
    crack!


    If the target does not have Kerberos pre-authentication set, you could also try,
    AS-REP roasting.


    ```

    Rubeus.exe asreproast

    ```'
