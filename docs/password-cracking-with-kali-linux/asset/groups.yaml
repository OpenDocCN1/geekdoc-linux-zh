    Using default input encoding: UTF-8\nLoaded 1 password hash (NT [MD4 128/128 SSE2\
    \ 4x1])\nPress 'q' or Ctrl-C to abort, almost any other key for status\nSayFriendAndEnter\
    \  (?\n```\n\nJohn 通过 NT 哈希格式、词库和密码哈希（存储在文本文件中）调用。在这种情况下，用户 Dan 使用的密码是，“SayFriendAndEnter”\
    \ - 显然是一位《指环王》的粉丝。\n\n如前所述，你需要拥有对机器的物理访问权限，以便事先设置初始的 Ustilman 登录绕过。然后你需要运行 Mimikatz，为了方便起见，我刚下载并把它放在了一个\
    \ USB 驱动器上。最后，自系统启动以来必须有人登录过系统，否则不会返回任何凭证。如果还没有人登录系统，内存中就没有密码供 Mimikatz 提取。在我们的练习中，使用\
    \ Ustilman 绕过和 Mimikatz 配合效果非常好，但其中任何一种技术单独使用仍然非常有效。\n\n## 键扫描、锁定屏键盘记录器和步骤记录器\n\
    \n当渗透测试人员拥有对某用户机器的远程访问权限时，他们有时会发现运行远程键盘扫描器是有益的。这个工具是一个在后台静默运行的程序，记录用户按下的所有按键。这是一种可能获得额外密码的方法。在本节中，我们将探讨在\
    \ Metasploit 中执行此操作的两种不同方式。然后我们将探讨将微软的问题步骤记录器（Problem Step Recorder）转化为远程录制“间谍”工具。\n\
    \n## 使用 METASPLOIT 进行键盘记录\n\n我们将通过探索 Metasploit 内置的键盘扫描器来开始本章。Metasploit 有一套有助于捕获目标机器上按键的\
    \ Meterpreter 命令。\n\n- **keyscan_dump**\n- **keyscan_start**\n- **keyscan_stop**\n\
    \n这些命令通过 Meterpreter 可用，因此我们将从一个已经运行过利用程序并成功创建远程会话的系统开始。我们将使用我们的 Windows 11 系统作为目标。我们需要系统级访问权限，因此在获得远程会话后，我们需要运行“**getsystem**”命令。\n\
    \n```\nmeterpreter > getsystem\n...got system via technique 1 (Named Pipe Impersonation\
    \ (In Memory/Admin)\nmeterpreter > getuid\nServer username: NT AUTHORITY\\SYSTEM\n\
    meterpreter >\n```\n\n如果在 Meterpreter 提示符下输入“**help**”，我们将获得一系列可以运行的命令列表。在本节中，我们只关注“**keyscan**”命令：\n\
    \n```\nkeyscan_dump    Dump the keystroke buffer\nkeyscan_start   Start capturing\
    \ keystrokes\nkeyscan_stop    Stop capturing keystrokes\n```\n\n那么，让我们继续看看当我们启动远程键盘记录器时的情况。然后我们将查看捕获的按键记录。\n\
    \n1.  只需输入“**keyscan_start**”以开始远程记录。\n\n```\nmeterpreter > keyscan_start\nStarting\
    \ the keystroke sniffer...\nmeterpreter >\n```\n\n在实际测试中，我们只需要等待目标在键盘上输入一些内容。对于我们的示例，请打开你的\
    \ Windows 11 浏览器并在 Google 中进行搜索。\n\n2.  现在回到 Kali 系统，要查看输入的内容，只需输入 \"keyscan_dump\"\
    :\n\n```\nmeterpreter > keyscan_dump\nDumping captured keystrokes...\ngoogle.com<CR>\n\
    will dallas go to the super bowl next year<Right Shift><CR>\n```\n\n从演示中可以看出，我们的目标用户访问了\
    \ google.com 并搜索了 \"will dallas go to the super bowl next year?\"（达拉斯明年会去超级碗吗？）。显然，我们的用户是一个令人失望但始终充满希望的达拉斯橄榄球迷。让我们再试一件事。注意它捕获了\
    \ <Right Shift> 和 <CR> 按键。如果用户使用了其他特殊按键，例如 Windows 键会发生什么？如果用户使用了 \"Windows\"\
    \ + \"L\" 键锁定键盘，然后使用密码重新登录，又会发生什么？我们能捕获他们的密码吗？\n\n3.  使用 \"Windows\" 和 \"L\" 键锁定你的\
    \ Windows 系统。\n4.  使用密码重新登录。\n5.  在 Kali 系统上再次输入 \"keyscan_dump\"：\n\n```\nmeterpreter\
    \ > keyscan_dump\nDumping captured keystrokes...\n<LWin> l\nmeterpreter >\n```\n\
    \n它正确记录了我按下了 \"<LWin>\"（左 Windows 键）和 'l' 键。但我是用密码重新登录的，所以密码在哪里？\n\n没有被记录！\n\n\
    问题在于 Windows 安全机制的工作方式。简而言之，活动会话（桌面）和 winlogon（登录进程）使用不同的键盘缓冲区。如果你正在嗅探活动会话，你无法捕获登录时输入的按键，反之亦然。你需要将键盘记录器移动到你想要监控的会话。因此，在这种情况下，只需将我们的\
    \ Meterpreter shell 迁移到 winlogon 进程，我们就处于查找密码的正确模式。然后我们需要再次启动 keyscan。\n\n让我们逐步执行此过程：\n\
    \n6.  在 Meterpreter 中输入 “ps” 以获取进程列表。查找进程 “winlogon” 的 PID。\n\n![](img/4a03f08556c51a14a3b88fe549a54ca8_171_0.png)\n\
    \n如上图所示，winlogon.exe 的进程 ID 号为 472（你的会不同）。我们只需将 Meterpreter 会话迁移到该 ID。\n\n7. \
    \ 输入 “migrate <winlogon PID#>”，在我这里的情况是 “migrate 472”。\n\n![](img/4a03f08556c51a14a3b88fe549a54ca8_171_1.png)\n\
    \n8.  现在继续再次启动 keyscan，“keyscan_start”。\n9.  然后锁定 Windows 11 工作站并重新登录。\n10. 最后，使用“keyscan_dump”转储键盘记录以查看用户密码：\n\
    \n![](img/4a03f08556c51a14a3b88fe549a54ca8_171_2.png)\n\n我们得到了密码，即 `\"password\"\
    `！我知道，我知道，又是一个安全意识极强的用户。别笑，现实生活中这种情况仍然存在。我见过一家大公司禁用了域中的密码复杂度设置，以便保留他们使用了大约 10\
    \ 年的简单密码。专业提示，定期更改域密码，如果你解雇了域管理员，一定要更改密码。许多离职人员会回来尝试远程使用他们的旧凭证；我曾多次看到这种情况发生...\n\
    \n在上一张图片中，注意锁定桌面的 `\"Windows\" + \"L\"` 按键记录并未显示。这是因为我们现在正在监控 winlogon 会话的键盘缓冲区，因此它不会显示。因此，本质上，因为我们的目标需要另一杯咖啡来度过他们忙碌的网络浏览日，他们锁定了桌面然后重新登录。当他们这样做时，我们能够捕获他们的完整密码。\n\
    \n请继续执行 `keyscan_stop` 以停止 keyscan。\n\n有一个自动化的 Post 模块执行此攻击，并自动处理所有的切换 - **post/windows/capture/lockout_keylogger**。在本文撰写之时，它似乎不起作用，但值得一试！接下来，我想看看使用一个内置于每个\
    \ Windows 版本（自 7 以来）的微软工具，作为远程屏幕截图和用户活动记录工具。虽然它不是一个键盘扫描器，但它可以用于渗透测试以获取一些有趣的信息，这些信息在事后报告中也可能非常有说服力。\n\
    \n如本章开头所述，这些是获取密码的更多“奇特”方法，在实际破解密码中并不是必需的。我只是觉得你可能会对这些感兴趣。接下来，让我们看看一些防御密码攻击的方法！\n\
    \n"
