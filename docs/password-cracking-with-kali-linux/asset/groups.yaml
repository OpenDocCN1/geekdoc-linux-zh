    \ time - hopefully your list of to be cracked passwords is shrinking at the same\
    \ time.\n"
  mdcn: "\n\n## 单一字典\n\n**-a0 直接攻击或单一字典攻击** - 这是 Hashcat 中最简单的攻击方式。Hashcat 将使用单一字典针对密码哈希文件进行攻击。字典中的每个单词都会被直接哈希，并与密码进行比对。如果匹配成功，该密码即被“破解”。如果不匹配，Hashcat\
    \ 将尝试字典中的下一个单词，并持续进行，直到字典中的每个单词都与密码哈希完成比对。\n\n示例：\n\n```bash\nhashcat -m 0 [Uncracked].txt\
    \ wordlist.txt -o [Cracked.txt]\n```\n\n你也可以在直接攻击模式中使用“规则（Rules）”。\n\n## 带规则的单一字典\n\
    \n规则会自动修改字典中的单词，从而极大地扩展你的猜测词库。你可以将它们视为用于修改字典中单词的编程脚本。它们可以增加或删除字符、修改大小写、使单词翻倍，或执行许多其他有用的操作。规则文件位于“rule”子目录中。查看每个规则文件，你可以看到用于修改每个单词的“编程语言”。\n\
    \n“Best64”规则是最受欢迎且运行速度较快的规则之一：\n\n```bash\nhashcat -m 0 [Uncracked].txt wordlist.txt\
    \ -o [Cracked.txt] -r rules/best64.rule\n```\n\n你可以使用“toggles”规则切换字典中每个字符的大小写：\n\
    \n```bash\nhashcat -m 0 [Uncracked.txt] wordlist1 -o [Cracked.txt] -r rules/toggles.rule\
    \ -O\n```\n\n这将生成如下单词：\n\n- cat, Cat, cAt, caT\n- dog, Dog, dOg, doG\n\n如果规则文件足够小，你可以同时使用两个规则文件。不过，这会产生巨大的猜测词库，有时可能会溢出可用内存，导致\
    \ Hashcat 退出。\n\n```bash\nhashcat -m 0 [Uncracked].txt wordlist.txt -o [Cracked.txt]\
    \ -r rules/best64.rule -r rules/OneRuleToRuleThemAll.rule\n```\n\n将 \"best64\"\
    \ 和 \"OneRuleToRuleThemAll\" 规则组合使用非常有效。这是我在破解时最喜欢的常用组合之一。Hob0Rules (https://github.com/praetorian-inc/Hob0Rules)\
    \ 也相当不错。每个规则文件都略有不同，因此尝试它们并找出最适合你需求的规则是一个好主意。\n\n## 组合两个字典\n\n**-a1 组合攻击** - 你可以使用\
    \ -a1 命令轻松组合两个字典。此命令将取一个列表中的每个单词，并与第二个列表中的每个单词进行组合。当用户在密码中将多个单词或字符串串联起来时，这种方法非常有用。\n\
    \n```bash\nhashcat -m 0 [Uncracked.txt] -o [Cracked.txt] -a1 wordlist1 wordlist2\
    \ -O\n```\n\n将生成如下单词：\n\n- cattog\n- dogcat\n\nHashcat 还允许你在组合字典的末尾或中间添加单个字符。你可以使用“-j”或“-k”开关来实现。这允许你在组合字典的同时，在每个单词之间放入一个空格（或任何单个字符）。你可以使用“-j”开关来做到这一点：\n\
    \n```bash\nhashcat -m 0 [Uncracked.txt] -o [Cracked.txt] -j$\" \" -a1 wordlist1\
    \ wordlist2 -O\n```\n\n这将生成如下单词：\n\n- cat dog\n- dog cat\n\n在组合字典的每个单词末尾添加 \"\
    !\"（或任何字符）。你可以使用“-k”开关来做到这一点：\n\n```bash\nhashcat -m 0 [Uncracked.txt] -o [Cracked.txt]\
    \ -k$\"!\" -a1 wordlist1 wordlist2 -O\n```\n\n将生成如下单词：\n\n- catdog!\n- dogcat!\n\
    \n你还可以同时使用 -j 和 -k 开关。例如，要在中间使用空格组合字典，并在每个单词末尾添加 \"!\"：\n\n```bash\nhashcat64\
    \ -m 0 [Uncracked.txt] -o [Cracked.txt] -j$\" \" -k$\"!\" -a1 wordlist1 wordlist2\n\
    ```\n\n将生成如下单词：\n\n- cat dog!\n- dog cat!\n\n## 掩码、暴力破解和混合攻击\n\n掩码在 Hashcat 中用于执行暴力破解。在\
    \ Hashcat 中，使用“-a3”开关来指定。有些人反对暴力破解，因为它会浪费时间。它必须尝试模式的每一种组合，可能需要耗费大量时间——数小时、数天、数月，甚至数年！（附带一提，我从不让它可以运行超过一天，只是查看它已破解的内容以寻找新模式，然后尝试更好的掩码！）但这绝对是必要的，特别是在破解长度和复杂度未知的哈希时。当你已经用尽了所有的字典、规则和组合攻击时，暴力破解是一个对哈希进行“重新审视”的好方法，你可能会发现可以利用的模式。一旦你发现了模式，你可以退后一步，修改你的掩码使其更具排他性，或者切换到包含这些模式的专用字典。\n\
    \n使用掩码可以大大减少暴力破解时间。我最喜欢的破解技术之一是使用混合攻击，即字典和掩码一起使用。Hashcat 中有两种可用的模式 - -a6 [字典 &\
    \ 掩码]，以及 -a7 [掩码 & 字典]。使用混合攻击比单独使用暴力掩码要快得多。我们将在本节中详细介绍所有内容。\n\n### 掩码\n\n在继续之前，理解密码破解中的掩码是什么非常重要。传统的暴力攻击已经过时，掩码为我们的暴力尝试带来了一定程度的智能。本质上，掩码只是你想在任何类型的暴力攻击中使用的字符的符号列表。\n\
    \n你可以使用：\n\n- **?l** – 小写字母\n- **?u** – 大写字母\n- **?s** – 符号\n- **?d** – 数字\n-\
    \ **?h** – 0-9，以及字母 \"a-f\"\n- **?H** – 数字 0-9，以及字母 \"A-F\"\n- **?a** – 任何数字、字母或符号\n\
    - **?b** – 二进制 – 从 00 到 ff 的每个十六进制字符\n\n### 基本暴力攻击\n\nHashcat 使用“-a3”开关进行暴力/掩码攻击\
    \ - 你只需输入想要使用的掩码，它将尝试你指定的所有可能字符。暴力破解很强大，但可能非常耗时。一个由“?a”组成的 8 字符掩码，强制它尝试每个位置的所有字符、数字和符号，可能需要极长的时间来处理。你可以使用“?u”、“?i”或“?s”用于特定位置来缩短时间。例如，使用掩码“?a?!?u?s”的“-a\
    \ 3”攻击会产生如下猜测：\n\n- RaiN!\n- 7laB$\n- *upwJ)\n\n由于潜在字符数量减少，它比遍历所有可能的字符组合要快得多。\n\
    \n“?b”甚至比“?a”花费更长时间，因为它会尝试从“00”到“ff”的每个十六进制字符。这包括标准的数字、字母和符号，还包括扩展 ASCII 字符，如制表符、换行符等外国和特殊字符。但如果你需要暴力破解外国字符，“?b”非常方便！\n\
    \n### 混合攻击 – 字典和暴力结合\n\n将字典与掩码一起使用是更高效的时间利用方式。\n\n混合攻击的格式为：\n\n```\n-a6 wordlist\
    \ [mask] 或 -a7 [mask] wordlist\n```\n\n1. 使用 -a6 攻击：\n\n   ```\n   -a6 wordlist.txt\
    \ ?a?!?l?u?s (仅显示 Hashcat 命令行的结尾部分)\n   ```\n\n   将生成如下单词：\n\n   - catRaiN!\n\
    \   - cat7laB$\n   - dog\\*upW)\n\n2. 使用 -a7 攻击：\n\n   ```\n   -a7 ?a?!?l?u?s\
    \ wordlist.txt\n   ```\n\n   将生成如下单词：\n\n   - RaiN!cat\n   - 7laB$cat\n   - \\\
    *upW)dog\n\n你可以使用“-I”或在任何暴力方法中添加增量标志，这会导致 Hashcat 每次只处理掩码的一个字符。因此，它将遍历整个字典并仅为每个单词添加“?a”字符。第二次遍历它将添加“?a?l”，依此类推，直到掩码中的所有字符都被使用。\n\
    \n第一遍：\n\n- catB\n- cat7\n- dog*\n\n第二遍：\n\n- catBr\n- cat7l\n- dog*u\n\n增量攻击非常有效，因为它们会在过程中移除已破解的密码。因此，即使每次从掩码添加新字符都会呈指数级增加破解时间——希望你的待破解密码列表也在同时缩短。\n\
    \n"
