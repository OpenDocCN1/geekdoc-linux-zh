    wearethekingsandthequeensofthenewbrokenscene\n\n这些并不是最长或最复杂的。我只是想展示 Hashcat 同样擅长处理随机复杂密码、字典单词、多个单词组合以及外语字符。当然，还有一部分是添加到公开转储文件中以使其看起来更大的无意义数据。\n\
    \n比如这一条：\n\nÑ¿Ñ¤2Ð°Ð¿Ð§3¹Ð»Ð¹ÑÑÑÑÐ¼Ð¾Ñ,ÑÑÑ±Ñ.\n\n这是一个随机俄语 YouTube 视频的链接！黑客经常会在公开转储文件中填充随机链接、文本文件等各种内容，以使其看起来比实际大得多，从而获得“街头信誉”。这也使破解变得更难，但这种挑战非常有趣！\n\
    \n你可以在 Windows 系统上下载并运行 Hashcat，或者它已经安装在 Kali Linux 上。虽然我个人更喜欢在我的 Windows 游戏 PC\
    \ 上使用 Hashcat 进行密码破解，但我将介绍在 Kali Linux 上使用 Hashcat。两者的用法完全相同，所以请根据你喜欢的操作系统进行选择。在\
    \ Windows 上，只需从工具网站下载可执行文件并运行它，对于大多数现代 Windows 系统，通常是 Hashcat64.exe。\n\n在 Kali\
    \ 中，可以从菜单启动 Hashcat（**05-密码攻击 > Hashcat**），或者打开终端并输入“`hashcat`”。通过输入“`hashcat\
    \ --help`”，你可以查看不同的选项：\n\n![](img/4a03f08556c51a14a3b88fe549a54ca8_102_0.png)\n\
    \n使用 Hashcat 时，你需要告诉它以下几件事：\n\n-   密码哈希类型\n-   包含未破解哈希值的文件名\n-   字典或词表文件名\n- \
    \  用于存储已破解哈希值的输出文件名\n-   最后，攻击模式类型以及你想要设置的其他选项开关\n\nHashcat 最基本的用法是使用单个词表文件。\n\
    \n### 示例：\n\n```\nhashcat --remove -m 0 [Uncracked].txt wordlist.txt -o [Cracked.txt]\
    \ -O\n```\n\n在使用 Hashcat 破解时，我总是使用“--remove”开关。这告诉 Hashcat 从未破解词表中移除已破解的单词。如果不移除，它们会保留在未破解词表中，从而延长破解时间。你还需要向\
    \ Hashcat 提供正确的哈希类型。“-m 0”是你要尝试破解的哈希类型。在示例中，“0”指定哈希是 MD5。Hashcat 能够破解多种哈希值。使用“hashcat\
    \ --help”命令可以列出支持的哈希类型。\n\n受支持的 -m 哈希类型简表：\n\n| # | 名称 |\n| :--- | :--- |\n| 900\
    \ | MD4 |\n| 0 | MD5 |\n| 5100 | Half MD5 |\n| 100 | SHA1 |\n| 1300 | SHA2-224\
    \ |\n| 1400 | SHA2-256 |\n| 10800 | SHA2-384 |\n| 1700 | SHA2-512 |\n| 17300 |\
    \ SHA3-224 |\n\n末尾的 -O 告诉 Hashcat 你不需要破解超长的密码（最多 256 个字符！），因此它专注于破解不超过 32 个字符的密码，运行速度会快得多。是的，确实存在一些非常长的密码，但大多数情况下仅出现在公开转储文件中。我破解过的最长的哈希值超过\
    \ 100 个字符——都是来自公开密码转储文件的无意义文本行。\n\n> *注意：为了简洁起见，大多数示例中未显示“--remove”和“-O”参数*\n\n\
    最后，你可以使用“-D”开关指定在黑客攻击中使用哪个处理器。\n\n| # | 设备类型 |\n| :--- | :--- |\n| 1 | CPU |\n\
    | 2 | GPU |\n| 3 | FPGA, DSP, Co-Processor |\n\n在使用 GeForce 显卡的工作站上，你可以使用“-D 2”来指定显卡的\
    \ GPU。如果你使用的是虚拟机，则使用“-D 1”选项。在开始破解之前，让我们先谈谈一些基本的破解技术。你可以使用词表、词表和规则、组合词表、暴力破解以及结合词表的暴力破解。我们将简要介绍每一种方法。\n\
    \n## HASHCAT 攻击类型\n\n“-a”选项允许你指定攻击模式类型。Hashcat 有多种攻击模式，你需要指定想使用哪一种。唯一不需要使用它的时候是你进行单词词表或直线模式攻击时。\n\
    \n可用的攻击类型包括：\n\n-   0 = 直线（Straight）\n-   1 = 组合（Combination）\n-   3 = 暴力破解（Brute-force）\n\
    -   6 = 混合 词表 + 掩码（Hybrid Wordlist + Mask）\n-   7 = 混合 掩码 + 词表（Hybrid Mask + Wordlist）\n\
    \n**直线（Straight）**：单词表攻击。词表中的每个单词都会针对每个密码哈希值使用。你也可以在此模式下使用规则。\n\n**组合（Combination）**：将不同词表中的单词组合起来，动态创建新单词。\n\
    \n**暴力破解（Brute-force）**：输入你自己的字符、数字和符号组合，或使用掩码攻击进行自动化猜测。例如：?u?l?s?d?a（大写、小写、符号、十进制、全部）会尝试破解像\
    \ \"Aa!0a\" 到 \"Zz!9z\" 之间以及所有中间值的密码。你还可以使用\"?b\"代表二进制（00-ff），这在破解外语密码时很有用。\n\n\
    **混合攻击（Hybrid Attacks）**：将词表与暴力破解字符或预定义掩码结合使用。例如，使用 Rockyou 词表配合掩码 ?u?l?s?d?a，会产生像\
    \ \"passwordAa!0a\" 和 \"monkeyZZ!9z\" 这样的哈希猜测尝试。\n\n"
