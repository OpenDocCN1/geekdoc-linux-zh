    Kali Linux 的开发者创建了一款出色的产品，也感谢各个工具的创建者，你们都做得非常出色，正在帮助保护全球各地的系统！


    ## 我们将在此旅程中涵盖的内容


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_15_0.png)


    在第一章中，我们将介绍 Windows 基础安全身份验证协议 Kerberos 和 NTLM 的基本介绍。这两种协议都创建加密的密钥——Kerberos 使用票据，而
    NTLM 使用哈希值。为了简化的缘故，我将在这整本书中将这两种都称为“密码哈希值”。然后我们将介绍用于获取这些哈希值的一些流行工具和技术。


    随后，我们将广泛地查看词库。词库是密码破解的基础。使用良好的词库将大大增加你破解密码的成功率和速度。我们将介绍如何查找、创建或生成有效的密码破解词库。这包括使用工具创建自定义词库。然后我们将深入研究实际的破解工具。介绍词库如何被破解程序用于解锁访问权限。在接下来的章节中，我们将简要介绍
    John the Ripper，然后深入挖掘，用多个章节详细查看首屈一指的密码破解工具 Hashcat。


    首先，我们如何获取用于破解的哈希值？我们将查看 Windows 中 Kerberos 和 NTLM 身份验证协议的工作原理，以及如何从它们中提取哈希值。系好安全带，抓紧扶手，这将是一段惊险的旅程！


    ## 第 2 章

    ### 获取用于破解的密码哈希值


    Windows Server 活动目录（Active Directory）有几种认证用户的方式。这些身份验证协议包括 NTLM 和 Kerberos。让我们先简要谈谈这两者。


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_17_0.png)


    NTLM（NT LAN Manager）协议在 Windows 环境中的身份验证过程中发挥着至关重要的作用，是验证用户和系统身份的关键机制。作为一种遗留协议，NTLM
    自 Windows 早期版本以来一直是稳固的组件，尽管随着更高级身份验证协议（如 Kerberos）的出现，其重要性已有所减弱。


    与 Kerberos 不同，NTLM 主要通过质询-响应机制起作用。当用户尝试访问资源时，服务器会生成一个随机质询并将其发送给客户端。然后，客户端使用用户凭据对该质询进行加密，并将加密后的响应发送回服务器。如果服务器能够使用存储的凭据成功解密该响应，则授予访问权限。此过程通过确保客户端和服务器都拥有身份验证所需的凭据，提供了一定程度的安全性。


    然而，尽管具有历史意义，但 NTLM 并非没有漏洞。随着时间推移，安全专家已识别出该协议的弱点，导致其逐渐被更稳健、更安全的身份验证方法（如 Kerberos）所取代。NTLM
    容易遭受某些类型的攻击，例如 Pass-the-Hash 攻击，攻击者捕获哈希凭据并尝试使用它们进行未授权访问。虽然有许多方法可以提取 NTLM 密码哈希值，但其中最流行的工具之一是
    Mimikatz。


    Kerberos 是这两个协议中最安全的。但许多公司仍使用较旧的 NTLM 身份验证协议，因此它仍被默认包含在内。随着更安全身份验证协议（如 Kerberos）的创建和实施，限制
    NTLM 的使用或完全移除它是一个非常好的主意。话虽如此，Kerberos 和 NTLM 都是攻击者的常见目标。虽然身份验证协议不同，但攻击过程在某种程度上是相似的——黑客使用工具或程序从其中任何一种获取加密的密码信息，然后尝试破解它。


    我们将从深入查看攻击 Kerberos 安全的一种方式——“Kerberoasting”开始。然后我们将查看使用 Mimikatz 快速提取 NTLM 凭据的方法。有许多工具和过程可用于从内存中提取凭据。我们将仅快速介绍其中几种。我在我的基础版和高级版
    Kali 书籍中涵盖了其他密码恢复主题。


    下一节将涉及更多理论内容，理解该过程背后的技术是有益的。但如果理论过于复杂且你感到有些迷茫，别担心！这确实听起来像是令人困惑的技术行话，哈哈！目前，你只需要理解
    Windows 可以创建多种类型的加密密码，包括 Kerberos 和 NTLM。并且从系统中提取并破解它们的过程略有不同。


    ## KEROBEROASTING


    “Kerberoasting”是一种针对活动目录环境中使用的 Kerberos 身份验证协议的安全攻击。简单来说，在活动目录环境中，Kerberos 是帮助用户和系统安全地进行身份验证的协议之一。Kerberos
    是一个基于票据的系统。基本上，Kerberoasting 是一种方法，攻击者捕获加密的服务票据，针对活动目录环境中的服务账户，然后尝试离线破解加密信息以揭示服务账户的密码。


