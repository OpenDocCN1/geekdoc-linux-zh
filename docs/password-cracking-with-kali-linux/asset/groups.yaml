    \ Windows 哈希。让我们快速解释一下这些概念。\n\n- **LM 哈希** – 一种过时的密码哈希，可追溯到早期的 Lan Manager 时代。LM\
    \ 哈希不再被默认存储，但你仍可能偶尔发现它们的存在。\n\n- **NTLM 哈希** – 由 LM 哈希和 NT 哈希（NTHash）组成，中间用冒号分隔。这是你在从\
    \ Windows SAM 数据库或域控制器数据库中转储密码时会看到的内容。NTLM 哈希可用于“传递哈希”（Pass the Hash）类型的攻击。\n\n\
    - **NTLMv1 或 NTLMv2** – 这些是质询响应哈希，NTLMv2 更加安全。当你使用 Responder 等程序时，可以捕获这些哈希。你可以将这些哈希用于中继攻击，尽管你不能将哈希中继回源机器，必须是另一个系统。你可以禁用较弱的\
