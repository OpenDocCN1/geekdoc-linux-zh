    \n## 总结\n\n就这样！我们的虚拟实验室现已准备就绪！在这一章中，我们介绍了如何在单个系统上设置多台虚拟机以创建测试实验室。我们将它们全部设置为使用相同的网络，以便它们能够互相通信。我们将在本书其余部分使用此配置。提醒一下，我在书中使用的\
    \ IP 地址将与你自己的不同。如果你设置了自己的虚拟主机并使用 DHCP，系统在重启时 IP 地址也可能会变化。如果你不确定你的 IP 地址是什么，可以在虚拟机中运行\
