    43fcfc46bae3d14b26427c26d00410ef:francis123\n27c0555ea55ecfcdba01c022681dda3f:duodinaimico\n\
    2e40bf83aa056289935daea328977b20:P@$$word\n9439b142f202437a55f7c52f6fcf82d3:lophupavever\n\
    d144986c6122b1b1654ba39932465528:Administrator\n```\n\nAnd there you go, 13 passwords\
    \ cracked in just a few seconds. Take a good look at the passwords, as coincidentally\
    \ many of these are the top passwords found pretty consistently year after year,\
    \ in password dumps. Using any of these passwords would not stand up to a password\
    \ cracker for more than a fraction of a second.\n\n## CRACKING HARDER PASSWORDS\n\
    \nLet's look at some harder passwords with Hashcat.\n\n- Take the following hashes\
    \ and save them in the home directory as *Hardhash.txt*:\n  - 31d6cfe0d16ae931b73c59d7e0c089c0\n\
    \  - 2e4dbf83aa056289935daea328977b20\n  - d6e0a7e89da72150d1152563f5b89dbe\n\
    \  - 317a96a1018609c20b4ccb69718ad6e7\n  - 2e520e18228ad8ea4060017234af43b2\n\n\
    - Now type, `hashcat -D 1 -m 1000 Hardhash.txt rockyou.txt -o Hardcracked.txt\
    \ --force`\n\nEverything on the line is the same as before, except we changed\
    \ the hash name to the new “Hardhash.txt” file and changed the output filename\
    \ to “hardcracked.txt”.\n\n- And in a few seconds, we see the following screenshot:\n\
    \n![](img/4a03f08556c51a14a3b88fe549a54ca8_118_0.png)\n\nOkay, it ran for about\
    \ the same amount of time, but this time it was only able to recover 2 of the\
    \ 5 hashes. If we run the cat command on the “hardcracked.txt” file, we see something\
    \ odd:\n\n```\n(kali@kali)-[~]\n$ cat Hardcracked.txt\n31d6cfe0d16ae931b73c59d7e0c089c0:\n\
    ```\n\nOnly one hash is shown - an empty password, which is correct for that hash.\
    \ But where is the second cracked hash? The newer versions of Hashcat will not\
    \ store the cracked password if it was cracked earlier. It did crack the second\
    \ hash; it just didn’t store it in the output file. If you look at both sets of\
    \ hashes above, one hash is repeated, the hash for the password “P@$$word”. The\
    \ password is stored in Hashcat’s potfile, so it didn’t bother to store it in\
    \ the output file. This can be a bit frustrating, but you can disable the potfile\
    \ using the `--potfile-disable` switch. We still have three uncracked hashes,\
    \ so let’s try a larger dictionary file.\n\n## USING A LARGER DICTIONARY FILE\n\
    \nIf first you don’t succeed, try a larger dictionary! A larger dictionary file\
    \ provides more known passwords to compare target hashes against. This can crack\
    \ a greater number of hashes, but because of the increased dictionary size can\
    \ greatly increase the time it takes to run. Though I have found it is best to\
    \ run a large dictionary file first and have Hashcat remove any hashes that are\
    \ recovered. This will make the un-cracked file smaller for when you run the more\
    \ intensive rules and masks attacks. The website **Crackstation.net** has a couple\
    \ very large wordlists available. They have a 15GB monster and a smaller “Human\
    \ Only” version that is about 700 MB. The larger wordlist has just about everything\
    \ that you can imagine in it, the smaller human only version only contains passwords\
    \ recovered from actual password dumps.\n\nFor the next attempt, I went ahead\
    \ and downloaded the human only wordlist as the larger one will not fit without\
    \ expanding the Kali VM’s hard drive space. Don’t bother downloading it just for\
    \ this example, you will see why in a minute. After downloading and expanding\
    \ the wordlist to the desktop, I ran the following command:\n\n```\nhashcat -D\
    \ 1 -m 1000 Hardhash.txt Crackstation-human.txt -o Hardcracked.txt --remove\n\
    ```\n\nNothing really new to this command line, other than naming a separate output\
    \ file, but I did add the \"**--remove**\"switch. It is not really necessary on\
    \ such a small hash list, but on large lists, once a hash is cracked, it is removed\
    \ from the list to increase cracking time on future attempts.\n\nAnd the results:\n\
    \n```\nTime.Started.....: Mon Mar 19 12:22:52 2018 (24 secs)\nTime.Estimated...:\
    \ Mon Mar 19 12:23:16 2018 (0 secs)\nGuess.Base.......: File (Crackstation-human.txt)\n\
    Guess.Queue......: 1/1 (100.00%)\nSpeed.Dev.#1.....:  2634.5 kH/s (0.66ms)\nRecovered........:\
    \ 0/3 (0.00%) Digests, 0/1 (0.00%) Salts\n```\n\nThis took about 30 seconds to\
    \ run. And as you can see it was not able to recover anything new. A dictionary\
    \ attack isn't always going to be the answer. Even using the larger 15 GB Crackstation\
    \ file only revealed one additional hash:\n\nd6e0a7e89da72150d1152563f5b89dbe:\
    \ MyNameIsBob\n\nThe two remaining passwords would be fairly difficult to crack.\
    \ One is 15 characters long and uses special characters, upper and lower-case\
    \ letters and a number ($eCuR@d@CCount1) and the last one is very long, almost\
    \ 30 characters. As you can see, the complex password and the very long password\
    \ held up against a simple dictionary attack. The moral of this story, wordlists\
    \ don't always work. Oh and of course, use complex passwords!\n\n## CONCLUSION\n\
    \nIn this chapter, we covered multiple ways to use Hashcat for cracking passwords.\
    \ There are many additional ways to use the Hashcat tools, I highly recommend\
    \ the reader take time and read up on this powerful tool. There are many patterns\
    \ you will discover as you delve into password cracking. One password “obfuscation”\
    \ technique used by a lot countries is to use a foreign language to spell English\
    \ words using the foreign alphabet. So, for example, if a Russian wanted to use\
    \ the word “spoon” in their password, they would not use the Russian word for\
    \ spoon, but spell out the English word “spoon” directly using their alphabet.\n\
    \nYou will run into a lot of keywalk passwords too. The big thing to keep in mind,\
    \ especially when dealing with multi-national passwords is that the keyboard layout\
    \ changes per country. It won’t always look like the familiar “qwerty”. Add in\
    \ how Hashcat displays some characters (UTF8 to ANSI) and it can get a little\
    \ confusing.\n\nFor example:\n\n1234567890Д¹Ñ+ÑƒĐ°Đµı¹²Đ³Ñ^Ñ%оĐ·Ñ...ÑŚ\n\nIs a\
    \ Russian Keyboard walk:\n\n1234567890йцукенгшщзхъ\n\nBasically just, “1-0” and\
    \ then “q” through “y” on the keyboard.\n\nYou can use character sets in Hashcat\
    \ to brute force foreign language passwords, but I have never had a lot of success\
    \ with doing that. I found using wordlists or just binary characters was more\
    \ effective. But depending on your target, you may find success with it. See the\
    \ Hashcat documentation for more information on cracking with character sets.\n\
    \nLastly, a lot of modern passwords are a combination of a person’s name or names,\
    \ a date and a symbol. I have had great success cracking these using the Facebook\
    \ First and Last name wordlists in\n"
