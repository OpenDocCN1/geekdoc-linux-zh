    them. Most are in the directory of the main program that uses them. On the newer
    releases of Kali, shortcut links to the other wordlists are stored in the "/usr/share/wordlists"
    directory. You can also use the Kali Linux menu selection "05 - password Attacks
    > Wordlists" as a shortcut to this directory.


    ```

    (kaili@kali)~$ wordlists

    > wordlists ~ Contains the rockyou wordlist

    /usr/share/wordlists

    |--dirb

    |~~dirbuster

    |~~fasttrack.txt

    |~~fern-wifi

    |~~metasploit

    |~~nmap.lst

    |~~rockyou.txt.gz

    |--wfuzz

    ```


    # ### Rock You Wordlist


    One of the most popular wordlists used in cracking is the, "Rock You" wordlist.
    This is a large collection of millions of passwords that were actually used and
    pulled from a database dump.


    The file is located in the Kali Linux "/usr/share/wordlists/" directory as seen
    below:


    ```

