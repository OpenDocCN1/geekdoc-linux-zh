    \ 票据窃取）。我们还查看了几种用于密码安全的工具，包括 Rubeus 和 Mimikatz。在下一章中，我们将深入探讨单词列表！\n\n## 资源与参考\n\
    \n花时间查看下面的链接。这里有很多关于 Windows 安全和密码相关攻击的优秀信息和教程。\n\n- “Windows 身份验证概述。” *Microsoft*，2021\
