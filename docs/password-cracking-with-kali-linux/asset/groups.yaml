    # # HASHCAT - CREATING WORDLISTS WITH HASHCAT


    A lot of Hashcat users don''t know that you can actually use the Hashcat tool
    itself to create wordlists. You can use any of the standard Hashcat "-a" attack
    commands to produce a wordlist. We will cover several of the Hashcat attack modes
    in a later chapter So, instead of walking through these step by step, I created
    a chart that shows some common uses:


    ```

    You can quickly and easily generate wordlists using Hashcat.


    `hashcat64 -a 3 -i ?d?d?d?d --stdout > numbers1-4.txt`


    Creates words like:


    1111

    1112

    1123

    1234


    `hashcat64 -i -a 6 FrenchWordlist.txt ?d?d?d?d --stdout > FrenchNumbers1-4.txt`


    Creates words like:


    chat1111

    chat2222

    chien1111

    chien2222


    `hashcat64 --stdout wordlist.txt -r rules/toggles3.rule -o WordlistRules.txt`


    Creates words like:


    Admin

    aDmin

    adMin

    admiN

    admin

    ```'
  - '[PAGE 68]


    Again, you can use any of the `"-a"` attack modes that you wish, just make sure
    you use the ` "--stdout"` switch. You can then specify an output file with `"-o"`
    or just use the `">"` file redirect command.'
