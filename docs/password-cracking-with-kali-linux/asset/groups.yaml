    简单来说，列出你想使用的每个字符集，然后使用“@ , % ^”字符创建掩码，就像在 Hashcat 中做的那样。“@”符号代表第一个字符集中的字符。“,”代表第二个，“%”代表第三个字符集，依此类推。然后使用“-t”模式开关来构建你的模式。


