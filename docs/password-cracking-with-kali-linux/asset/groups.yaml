    \n最后，当系统提示时安装 VMware 工具。\n\n## 可选虚拟机\n\n如果你想直接进入实操环节 – 请直接跳到下一章。我只是想为那些希望测试更多目标的高级读者提供一些额外的选择。这些虚拟机需要更高级的知识和设置工作，所以我将这些作为读者的可选项。\n\
