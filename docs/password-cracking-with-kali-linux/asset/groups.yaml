    \n+   - **Ticket-granting Ticket (TGT)** - When a user logs into a Windows system,\
    \ they get a Ticket-granting Ticket (TGT) from the Key Distribution Center (KDC),\
    \ a part of Active Directory.\n\n+   - **Service Tickets** - The TGT can be used\
    \ to request service tickets for specific resources, like servers or services\
    \ in the network.\n\n+   - **Service Accounts** - are often targeted because they\
