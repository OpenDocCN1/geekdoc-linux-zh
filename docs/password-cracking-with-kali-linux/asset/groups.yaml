    ## 规则和掩码文件


    ### 基于规则的攻击


    之前曾简要提到，基于规则的攻击非常有用。Hashcat 拥有一系列内置规则，你可以使用它们来破解密码。你可以在 Hashcat 的 "rules" 子目录中找到它们。例如，有一些
    "leetspeak"（黑客语）规则集，它们会自动提取每个字典单词并尝试该单词的不同黑客语版本，将字母替换为数字。你甚至可以使用类似编程的语言来创建自己的规则集。


    ```bash

    [kali@kali]:/usr/share/hashcat/rules$ ls

    best64.rule

    combinator.rule

    d3ad0ne.rule

    dive.rule

    generated.rule

    generated2.rule

    hybrid

    Incisive-leetspeak.rule

    InsidePro-HashManager.rule

    InsidePro-PasswordsPro.rule

    leetspeak.rule

    oscommerce.rule

    rockyou-30000.rule

    specific.rule

    T0X1C_3_rule.rule

    ```


    基于规则的攻击在单倍攻击模式中使用。通过使用 `-r` 开关和你想要使用的规则集名称来启用它们：


    ```bash

    [kali@kali]:/usr/share/hashcat/rules$ hashcat -m 1000 ~/Hardhash.txt ~/rockyou.txt
    -r leetspeak.rule -o ~/cracked3.txt

    hashcat (v6.2.6) starting


    OpenCL API (OpenCL 3.0 PoCL 3.1+debian Linux, None+Asserts, RELOC, SPIR, LLVM
    14.0.6,

    * Device #1: pthread-sandybridge-Intel(R) Core(TM) i7-6700 CPU @ 3.40GHz, 1435/2935
    MB


    Minimum password length supported by kernel: 0

    Maximum password length supported by kernel: 256


    Hashes: 5 digests; 5 unique digests, 1 unique salts

    Bitmaps: 16 bits, 65536 entries, 0x0000ffff mask, 262144 bytes, 5/13 rotates

    Rules: 17

    ```


    Best64、InsidePro、Dive、Rockyou-30000 和 d3ad0ne 规则是一些更受欢迎的规则，且非常有效。我对规则的最佳建议是，先从小型规则文件开始（查看它们的文件大小），然后再转向较大的文件。较小的文件通常运行速度相当快；较大的文件运行时间可能会明显更长。你还可以通过列出你的字典文件夹而不是列出单个字典文件名来同时使用多个字典。Hashcat
    随后会遍历字典文件夹中的每个单词列表。


    你可以通过在 Hashcat 命令中添加多个 `-r` 行来同时运行几个小规则。这在 "hybrid"（混合）规则中非常有用。向攻击中添加两个 Hybrid
    规则将尝试在单词表单词的开头和结尾添加字母、数字或符号。


    示例：


    ```bash

    hashcat -D 1 -m 1000 Hardhash.txt rockyou.txt -o Hardcracked.txt -r hybrid/append_ldus.rule
    -r hybrid/prepend_ldus.rule --remove

    ```


    这将提取一个 rockyou 单词列表中的单词，并在两侧添加随机字母、数字或符号，如下所示：


    ```

    Guess.Mod........:  Rules (hybrid/append_ldus.rule, hybrid/prepend_ldus.rule)

    Guess.Queue......:  1/1 (100.00%)

    Speed.Dev.#1.....: 16746.6 kH/s (12.12ms)

    Recovered........:  0/3 (0.00%) Digests, 0/1 (0.00%) Salts

    Progress.........:  448062273/129448255425 (0.35%)

    Rejected.........:  9025/448062273 (0.00%)

    Restore.Point....:  49153/14343297 (0.34%)

    Candidates.#1....: {tripletX -> ~IlovejT~}

    ```


    Rockyou 单词 “triplet” 被转换为 “{tripletX”，而单词 “ilovej” 则被转换为 “~IlovejT~”。你还可以加入一个
    “Toggles”（切换）规则，以便在追加和前置字符的同时将单词中的字母切换为大写或小写：


    ```

    {TripLetX -> ~IloveJT~

    ```


    将多个规则组合在一起可以极大地扩展简单列表的破解能力。我最多使用过三个较小的规则，但到那时你开始面临可用内存不足的问题，Hashcat 将会退出。


    ### 掩码文件


    掩码攻击允许你定义暴力破解单词在攻击中将使用的布局。例如，如果你知道目标的密码策略要求包含两个数字、六个大写字母和两个特殊字符，你可以为 Hashcat 创建一个掩码。


    在这个示例中，它看起来像这样，`?d?d?u?u?u?u?u?u?s?s`：


    ```bash

    hashcat -D 1 -m 1000 Hardhash.txt -o Hardcracked2.txt -a 3 ?d?d?u?u?u?u?u?u?s?s
    --remove

    ```


    尝试不同的掩码，直到你熟悉它们的工作方式。掩码越长，运行所需的时间呈指数级增长。三字母掩码可能在几秒内完成。10 个以上字符的掩码可能需要数小时甚至数年才能运行完毕。Hashcat
    还允许使用“掩码文件”代替手动提供掩码。基本上，掩码文件只是一个包含多个掩码的文件。Hashcat 附带了示例掩码，可以在 `masks` 子目录中找到。


    以下是 “Rockyou-1-60.hcmask” 的截图：


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_127_0.png)


    要使用掩码文件，你只需提供掩码文件名，而不是在 Hashcat 命令行中键入手动掩码。


    ```bash

    hashcat -m 1000 Hardhash.txt -o cracked3.txt -a 3 rockyou-1-60.hcmask --remove

    ```


    ```

    Session..........: hashcat

    Status...........: Exhausted

    Hash.Mode........: 1000 (NTLM)

    Hash.Target......: /home/kali/Hardhash.txt

    Time.Started.....: Mon Mar   6 16:20:05 2023

    Time.Estimated...: Mon Mar   6 16:20:05 2023

    Kernel.Feature...: Pure Kernel

    Guess.Mask.......: 2l2l2l2l?d [5l]

    ```


    运行时，Hashcat 将遍历文件，逐一使用列出的每个掩码。如前所述，掩码越长，运行所需的时间就越长。这就是为什么如果你有兼容的显卡，在独立系统（非虚拟机）上始终使用显卡
    GPU 来加快速度是最好的选择。你可以通过使用 "-D" 开关切换到 GPU，你还可以在末尾使用 "-O" 开关，这不会破解极长的密码，但能极大地提高破解速度。


    ## PRINCE PROCESSOR 攻击


    - 工具 GitHub: [https://github.com/hashcat/princeprocessor](https://github.com/hashcat/princeprocessor)

    - 发布版本: [https://github.com/hashcat/princeprocessor/releases](https://github.com/hashcat/princeprocessor/releases)


    Prince Processor (PP) 是一种高级单词表组合器攻击。它可以利用单个单词表文件执行复杂的单词表攻击。首先，设置一个最小密码长度，然后提供一个要使用的单词表。PP
    随后会获取你提供的长度，并开始从现有文件中的多个单词构建该长度的单词。例如，如果你设置单词长度为 6，它可以提取一个单词中的全部 6 个字母，或者从 6 个单词中各取
    1 个字母，或者从 3 个单词中各取 2 个字母，以及中间的任何组合。


    然后 PP 将这些新单词实时传入 hashcat。Hashcat 将这些单词作为常规单词表使用，并对其进行破解。它的速度并非惊人的快，但如果你用尽了其他选项，这是一种有趣的技术。Prince
    Processor 适用于 Linux、Windows 和 Mac。


    以下是 Windows 上的示例：


    ```

    pp64.exe --pw-min=12 < HugeWordlist.txt | hashcat64 -D 2 --remove -m 0 uncracked.txt
    -o cracked.txt -O

    ```


    我在使用 Prince Processor 时得到了参差不齐的结果，它的功能非常令人印象深刻，但速度损失巨大。这就是为什么我在我的 Windows 游戏系统上运行它。尽管单词表的大小似乎并没有真正影响速度。Prince
    Processor 本身速度极快，我认为瓶颈更多在于将输出管道传输到 Hashcat。不过我发现将单词表输入 Prince Processor，然后直接输出到文本文件，再将其作为常规单词表使用，速度快得多。


