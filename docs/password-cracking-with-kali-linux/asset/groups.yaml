  - '[PAGE 198]


    # # KALI LINUX - UPDATING


    Kali Linux is constantly being updated to include the latest tools and features.
    If you haven’t used Kali in a while, you will be a normal user now by default,
    and either need to switch to a superuser terminal or use sudo to run commands
    that need root access.


    To update Kali Linux, open a terminal (Terminal Button on the Top Menu) and type:


    +   -   **sudo apt update**

    +   -   **sudo apt upgrade**


    ```

    kali@kali:~$

    $ sudo apt update

    Hit:1 http://kali.download/kali kali-rolling InRelease

    Reading package lists... Done

    Building dependency tree... Done

    Reading state information... Done

    629 packages can be upgraded. Run ''apt list --upgradable'' to see them


    kali@kali:~$

    $ sudo apt upgrade

    Reading package lists... Done

    Building dependency tree... Done

    Reading state information... Done

    Calculating upgrade... Done

    ```


    The update could take a while and may prompt you for input - If you are unsure
    what how to answer a question, just use the default response.


    +   - Reboot when the update is complete.


    Now that Kali is updated, let’s install another Virtual Machine, Metasploitable2.'
