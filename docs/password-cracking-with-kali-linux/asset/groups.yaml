    detects many formats, but this switch allows users to explicitly define the format
    for ambiguous cases.


    ```

    $ john --format=md5 hashed_passwords $

    ```


    **--fork**


    Linux Option that allows you to use multiple CPUs


    ```

    $ john --fork 4 $

    ```


    **--wordlist**


    Specifies the path to the wordlist file. This switch is essential for dictionary
    attacks and helps define the set of potential passwords to be tested.


    ```

    $ john --wordlist=/path/to/wordlist.txt hashed_password $

    ```


    **--rules**


    Enables rule-based password generation, allowing users to apply transformation
    rules to the words in the wordlist. Rules can include permutations, case modifications,
    and character substitutions.


    ```

    $ john --wordlist=/path/to/wordlist.txt --rules=Jumbo hashed_passwords $

    ```


    **--incremental**


    Initiates an incremental brute-force attack, systematically testing all possible
    password combinations. Users can customize the character set and password length
    to match specific scenarios.


    ```

    $ john --incremental=alnum hashed_passwords $

    ```


