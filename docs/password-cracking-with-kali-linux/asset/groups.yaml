    ### More Advanced Techniques


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_124_0.png)


    Before we leave the topic of Hashcat, let’s look at a few more advanced topics.
    In this chapter we will take a closer look at Hashcat Rule files. We will see
