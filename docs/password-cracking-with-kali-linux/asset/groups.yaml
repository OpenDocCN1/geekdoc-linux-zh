    ![](img/4a03f08556c51a14a3b88fe549a54ca8_171_2.png)'
  - '[PAGE 172]


    And we have the password, of `"password"`! I know, I know, yet another super security
    conscious user. Don''t laugh, it still happens in real life. I saw one major corporation
    that disabled password complexity on their domain so they could keep the simple
    password that they used for like 10 years. Pro tip, change your domain password
    on a schedule and definitely change it if you fire Domain Admins. Many will come
    back and try their old creds remotely; I have seen that occur numerous times...


    In the previous picture, notice the `"Windows" + "L"` keystroke to lock the desktop
    does not show up. This is because we are now monitoring the winlogon session key
    buffer, so it is not displayed. So, in essence, because our target needed another
    cup of coffee to get through their busy day of web surfing, they locked their
    desktop and then logged in again. When they did, we were able to grab their full
    password.


    Go ahead and stop the keyscan with `keyscan_stop`.


    There is an automated Post module that performs this attack, and automatically
    handles all the switching - **post/windows/capture/lockout_keylogger**. At the
    time of this writing, it does not seem functional, but worth checking out! Next,
    I want to look at using a built in Microsoft tool that is in every version of
    Windows since 7 as a remote screengrab and user activity logging tool. Though
    it is not a key scanner, it could be used during a pentest to obtain some interesting
    information that could also be very convincing in an after-action report.


    As I said in the beginning of this chapter, these are more, "exotic" ways to obtain
    passwords and not necessary in actually cracking passwords. I just thought you
    might find them interesting. Next up, let''s look at some ways to defend against
    password attacks!'
