    ## 第 5 章

    John the Ripper


    既然我们已经涵盖了大量的密码理论基础和词表的认知，让我们来深入研究一下破解工具！在接下来的几个章节中，我们将查看我最喜欢的两个工具：John the Ripper
    和 Hashcat。我们看到有时你只需进行一次在线哈希查找，在某些情况下，你可以传递哈希。但如果其他方法都失败了，你就必须破解哈希。Kali 包含了几个执行此操作的出色工具。我们将在本章中快速介绍
    John the Ripper，然后在接下来的章节中深入研究 Hashcat。


    ### 密码破解工具简介


    我们依靠密码来保护家庭系统、业务服务器以及我们的在线账户信息。但随着破解程序的改进和视频卡变得更快（视频 GPU 用于非常快速的破解），密码变得更容易被破解。这是一个多大的问题？我一直在使用
    Hashcat 处理一些非常大的公开泄露的密码哈希列表。我使用一台较旧的 Windows 11 系统，配备运行速度为 3.4 Ghz 的 Core i7-6700
    处理器和单张 RTX 2060 视频卡。我看到它的破解速度超过每秒 10 亿个哈希。当你想到这一点时，这太疯狂了！而且这只是使用单张视频卡。较新的顶级显卡快得多，特别是当你使用多张显卡进行破解时（我见过拥有许多显卡的设备）。


    当然，这些是简单的 SHA1 加密哈希，使用较新的加密或加盐密码的哈希破解起来要花费更长的时间。加盐密码使用唯一的值或盐来加密每个密码，因此没有任何两个密码哈希是相同的。但不管你信不信，今天找到使用未加盐密码的公开密码泄露数据仍然非常普遍。再加上
    Hashcat 的新版本将最大可破解的密码长度从 32 增加到 256 的事实，这会让你重新考虑公司的密码长度和复杂度策略。


    基于视频 GPU 的破解工具和基于 CPU 的工具之间存在巨大的速度差异。Hashcat 是最受欢迎的“世界上最快”的基于 GPU 的破解工具之一。John
    the Ripper 是最受欢迎的基于 CPU 的破解器之一。我们将查看两者，首先，John the Ripper！


    ### JOHN THE RIPPER


    **工具作者**：Solar Designer 和社区


    **工具网站**：[https://www.openwall.com/john/](https://www.openwall.com/john/)


    John the Ripper，或 John（或 JTR）是一个速度非常快的基于 CPU 的密码破解器。它非常易于使用，通常是在尝试破解密码时使用的首选工具。John
    在破解短密码方面非常擅长，所以我通常先使用 John 来获取低垂的果实或简单的密码，然后转向 Hashcat 进行更复杂的破解。因此，我们将只快速介绍 John。


    ### JOHN THE RIPPER 概述


    John the Ripper 是一款开源的密码破解软件，广泛用于渗透测试、道德黑客和取证分析。由 Solar Designer 开发，由于其有效性和灵活性，该工具已成为网络安全社区的常用工具。


    **密码哈希破解**


    John the Ripper 擅长破解各种类型的密码哈希。它支持数百种哈希和加密算法，包括 DES、MD5、SHA-1、SHA-256、Bitlocker、归档（ZIP、RAR）等。这种通用性使其适合处理各种攻击安全（Offensive
    Security）和取证用途。


    **词表混合攻击**


    John 支持使用词表的字典攻击，允许用户利用常用密码或基于特定标准创建自定义列表。此外，它可以执行混合攻击，将词表与暴力破解方法结合起来，以增加成功的可能性。


    **多平台支持**


    John the Ripper 与平台无关，可在各种操作系统上运行，包括 Unix、Linux、Windows 和 macOS。这种灵活性使其成为在多样化环境中工作的安全专业人士的宝贵资产。


    **常用开关**


    为了充分发挥 John the Ripper 的潜力，安全专业人士利用各种命令行开关来定制和优化他们的密码破解工作。以下是一些常用开关及其示例。


    （更多示例请见 [https://www.openwall.com/john/doc/OPTIONS.shtml](https://www.openwall.com/john/doc/OPTIONS.shtml)）


    **--format**


    指定密码文件中使用的哈希算法。John the Ripper 自动检测许多格式，但此开关允许用户明确定义模糊情况的格式。


    ```

    $ john --format=md5 hashed_passwords $

    ```


    **--fork**


    允许使用多个 CPU 的 Linux 选项


    ```

    $ john --fork 4 $

    ```


    **--wordlist**


    指定词表文件的路径。此开关对于字典攻击至关重要，有助于定义要测试的潜在密码集。


    ```

    $ john --wordlist=/path/to/wordlist.txt hashed_password $

    ```


    **--rules**


    启用基于规则的密码生成，允许用户将转换规则应用于词表中的单词。规则可以包括排列、大小写修改和字符替换。


    ```

    $ john --wordlist=/path/to/wordlist.txt --rules=Jumbo hashed_passwords $

    ```


