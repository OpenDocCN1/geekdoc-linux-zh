    \nConfusing right? Let's see an example:\n\n```\n> sudo crunch 10 10 -f charset.lst\
    \ mixalpha-space-sv symbols14-space ualpha -o mixedsymupper.txt -t @@,%%%\n```\n\
    \nDon't let this run for more than a couple seconds! It could generate a HUGE\
    \ file. Hit \"Ctrl-C\" and look for the \"START\" file.\n\nYou should see words\
    \ like this:\n\naaa!!!#VVR\nbaa!!$#WUS\naba!*!#KTT\ncab&!!)SSU\n\nYou should see\
    \ the pattern we built:\n\n+   > 3 letters from the mixedalpha-spave-sv character\
    \ set (@@@)  \n+   > 4 symbols from the symbols14-space character set (,,,,) \
    \ \n+   > 3 from the Upper Alpha character set (%%%)\n\nMany times, you will find\
    \ a word that is used over and over in password hashes, like a company name. Let's\
    \ say we find a string of passwords that have the fictitious company initials\
    \ \"WOW\", followed by 3 symbols, 2 uppercase letters and 5 numbers.\n\nWe can\
    \ use the following Crunch command:\n\n```\n> sudo crunch 13 13 -f charset.lst\
    \ symbols14-space ualpha numeric -o special.txt -t WOW@@,,%%%%\n```"
