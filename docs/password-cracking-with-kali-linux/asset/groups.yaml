    Kali Linux based books are used worldwide as a teaching & training resource for
    universities, technical training centers, government and private sector organizations.
    Daniel has assisted with creating and reviewing numerous security training classes,
    technical books and articles for publishing companies. He also enjoys helping
    out those new to the field.


