  - '[PAGE 89]


    Basically, if your systems are still using LM hashes, and your password is 14
    characters or less, the password could be cracked in a very short amount of time.
    Granted, these are Windows LM Hashes and not the more secure Windows 7/ Server
    2008 NTLM based hashes. But, as cracking speeds increase NTLM hashes can be cracked
    quickly if the user used a simple password. NTLMv2 hashes are harder still to
    crack, but as cracking speeds increase, relying on passwords alone may no longer
    be a good security measure. Many companies and government facilities have moved
    away from using just passwords alone to using dual authentication methods. Biometrics
    and smartcards have really become popular in secure facilities.


    # ### Conclusion


    In this chapter, we discussed the fact that computers normally store passwords
    in an encrypted form, called a hash, in the system''s security database. The user''s
    password is encrypted in some way and the resulting encrypted hash is recorded.
    We also learned that the Windows LM hash is not very secure and can be cracked
    very easily by using a simple lookup table or “Rainbow table” as it is sometimes
    called. If the LM hash cannot be found in one of the online databases, then a
    cracking program is needed. You can turn off LM hashing, see the Microsoft article
    in the Resources section below. Though security researchers have found that some
    networked systems and programs may still use them (even when turned off!) for
    backward compatibility. So, unbelievably, they can still be found on modern systems.
    If you cannot find the hash in an online site, then we will need to use the tools
    in Kali to actually crack the password.


