  - '[PAGE 23]


    # ## ATTACKING KERBEROS


    Performing a Kerberoasting attack involves several steps, and attackers often
    use a variety of techniques to achieve their goals. To avoid detection, attackers
    may perform the attack in a stealthy manner, limiting the number of service ticket
    requests and ensuring that their actions do not trigger security alerts.


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_23_0.png)


    Here are some common techniques associated with Kerberoasting attacks:


    +   1. **Identifying Service Accounts**


    The attacker identifies service accounts in the Active Directory environment.
    Service accounts are often associated with background services and are attractive
    targets due to their typically long and complex passwords.


    +   2. **Enumerating Service Principal Names (SPNs)**'
  - '[PAGE 24]


    Service Principal Names (SPNs) are associated with service accounts. Attackers
    may use tools like BloodHound or PowerView to enumerate and identify accounts
    with associated SPNs.


    # 3. Requesting Service Tickets


    The attacker requests service tickets for the identified service accounts. They
    typically use the Ticket Granting Ticket (TGT) obtained during the initial authentication
    to request service tickets for specific services.


    # 4. Capturing Service Tickets


    Once the service tickets are obtained, the attacker captures the Ticket Granting
    Ticket (TGT) and the encrypted service tickets associated with the targeted service
    accounts.


    # 5. Cracking the Ticket


    The attacker uses offline techniques, such as brute force attacks or dictionary
    attacks, to attempt to decrypt the service tickets. The goal is to reveal the
    plaintext password associated with the service account. This is usually accomplished
    using tools like Hashcat or John the Ripper


    # 6. Pass-the-Ticket Attacks


    In some cases, attackers may use Pass-the-Ticket attacks to access resources without
    the need to crack the ticket. This involves presenting the captured service ticket
    to gain unauthorized access.


    This is the standard attack process, but not the only one. A lot of the tools
    now automate most of this process. It is also possible to pull the Kerberos ticket
    from memory using a tool like Mimikatz. Mimikatz is a go to tool for extracting
    all kinds of passwords and useful information from memory, including dumping the
    NTLM hashes.'
  - '[PAGE 25]


    # KERBEROS ATTACK TOOLS


    That said, understanding the tools that attackers may use is crucial for defenders
    to be aware of potential threats and take appropriate measures. Some tools commonly
    associated with Kerberoasting attacks include:


    +   PowerShell Scripts


    PowerShell is a powerful scripting language built into Windows. There are various
    PowerShell scripts, such as PowerView and Invoke-Kerberoast, that can be used
    to identify service accounts, request service tickets, and perform other steps
    in the Kerberoasting process. A lot of these scripts are included as modules in
    Command and Control (C2) frameworks. Learn more about C2’s and their attack modules
    in my “Advanced Security Testing with Kali Linux” book.


    +   Rubeus


    Rubeus is a powerful post-exploitation tool that attackers often use in Kerberoasting
    attacks. It can be used to request TGTs, request service tickets, and perform
    ticket-related attacks. It includes features for ticket extraction and offline
    cracking.


    +   Mimikatz


    Mimikatz is a well-known post-exploitation tool that can be used to extract Kerberos
    tickets and perform pass-the-ticket attacks. It also can be used to extract NTLM
    and other security hashes.


    +   Kerberoast Toolkit'
  - '[PAGE 26]


    Kerberoast is a set of tools used to attack Kerberos. It includes tools to extract
    Service Principal Names (SPN), requesting tickets and a tool (tgsrepcrack) to
    crack them.


    # 5. Cracking Tools (Hashcat, John the Ripper)


    These are general-purpose password cracking tools. While they aren''t specific
    to Kerberoasting, they can be used to attempt the offline cracking of Kerberos
    tickets.


    # 6. BloodHound


    BloodHound is a tool used for Active Directory analysis. While it is not specifically
    a Kerberoasting tool, it can be used to identify service accounts and their associated
    privileges, potentially aiding attackers in planning Kerberoasting attacks.


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_26_0.png)


    BloodHound can Detect and Displays Kerberoastable Accounts in an AD Domain


    Attackers use these tools in an attempt to compromise a target''s security and
    obtain user credentials. Security professionals can also use these tools for ethical
    hacking or penetration testing purposes to'
  - '[PAGE 27]


    identify and address security vulnerabilities. Hopefully this quick overview helps
    shed some light on the fundamentals of Kerberos and Kerberoasting.


    You made it! Take a few minutes and breath. Like I said earlier, if you don’t
