    # CHAPTER 10

    ## Defending Against Windows Password Attacks


    Defending against Windows based password attacks involves implementing strong
    security practices, such as using complex, unique passwords for service accounts,
    regularly rotating credentials, and monitoring for suspicious activity in the
    network. Additionally, tools like BloodHound can also be used by defenders to
    identify and mitigate potential attack paths in Active Directory. Organizations
    should focus on implementing robust security measures, such as regular password
    rotations, strong password policies, and monitoring for suspicious activity, to
    defend against these attacks. Defensive actions should always be a priority to
    protect against such attacks.


    It is best in a Microsoft network to reduce or remove reliance on the older NTLM
    security protocol, and just use Kerberos. Easier said than done, I know, that''s
    why I didn''t include it in the list below. Though, Microsoft is planning on phasing
    NTLM out in the near future. Readers will have to seriously inspect their network
    and make sure that it is not needed before disabling it. Even then, defending
    against Kerberos attacks involves a combination of best practices, configuration
    settings, and monitoring strategies.


    Here are some key defenses against Windows Password attacks:


    ### REGULARLY ROTATE SERVICE ACCOUNT PASSWORDS


    Frequent password changes for service accounts can reduce the exposure window
    for attackers attempting Kerberoasting attacks.


    ### IMPLEMENT STRONG PASSWORD POLICIES


    Enforce strong password policies for all accounts, including service accounts.
    This includes requirements for length, complexity, and regular password changes.


    ### USE MANAGED SERVICE ACCOUNTS (MSAS) OR GROUP MANAGED SERVICE ACCOUNTS (GMSAS)


    MSAs and gMSAs automatically manage their passwords, reducing the risk associated
    with human-managed service account passwords.


    ### LIMIT SERVICE ACCOUNT PRIVILEGES


    Restrict service accounts (and all user accounts) to the minimum level of privileges
    required for their function. Avoid assigning unnecessary permissions to reduce
    the impact of compromised service accounts.


    ### MONITOR FOR UNUSUAL ACTIVITY


    Implement continuous monitoring and alerting for suspicious activity related to
    Kerberos authentication. Anomalies in ticket requests or usage patterns may indicate
    an ongoing attack.


    ### IMPLEMENT KERBEROS ARMORING


    Kerberos Armoring, introduced in Windows Server 2012 R2, helps protect against
    Pass-the-Ticket attacks by encrypting the TGT with the user''s password hash.
    Ensure that systems are running a version of Windows Server that supports this
    feature.


    ### ENABLE KERBEROS TICKET LIFETIME POLICIES


    Configure Kerberos ticket lifetime policies to limit the duration of tickets,
    reducing the exposure time in case of compromise. However, balance this with user
    experience to avoid frequent reauthentication.


    ### MONITOR AND PROTECT THE KRBTGT ACCOUNT


    The KRBTGT account is a high-value target. Regularly monitor and audit activities
    related to this account. Protect it by limiting access to administrators who require
    it and using strong, unique passwords.


    ### IMPLEMENT CREDENTIAL GUARD


    Credential Guard, available in Windows 10 and Windows Server 2016 and later, helps
    guard NTLM hashes and protect against Pass-the-Ticket attacks by isolating and
    protecting Kerberos tickets in a secure environment.


    ### USE EXTENDED PROTECTION FOR AUTHENTICATION


    Enable Extended Protection for Authentication (EPA) to enhance Windows Security
    by adding an additional layer of protection against Man-in-the-Middle attacks.


    ### REGULARLY UPDATE AND PATCH SYSTEMS


    Keep operating systems and software up to date with the latest security patches
    to address known vulnerabilities.


    ### EDUCATE USERS AND ADMINISTRATORS


    Raise awareness among users and administrators about the risks associated with
    NTLM and Kerberos attacks. Encourage strong password practices and vigilance.


    ### CONSIDER NETWORK SEGMENTATION


    Implement network segmentation to restrict lateral movement in case of a compromised
    system.


    Though this chapter is solely based on Windows security, many of the same or similar
    practices will help secure Linux based Networks. By implementing these defenses,
    organizations can significantly enhance their resilience against password attacks
    and improve overall security posture. It''s important to adopt a holistic approach,
    combining technical measures with user education and proactive monitoring.


    # CONCLUSION


    I hope you enjoyed reading this book as much as I enjoyed writing it. It’s hard
    trying to cover just one topic in security, but I hope this information is useful
    to you and your career. If you liked it, and want to delve deep into Offensive
    Security check out my “Security Testing with Kali Linux” series on Amazon. If
    you have any questions or feedback, I would love to hear it. Hit me up at **cyberarms@live.com**


    I wish you the best in life and in your career.


    Best Wishes,


    *Daniel Dieterle*


    # RESOURCES AND REFERENCES


    - Palko, M. “The evolution of Windows authentication.” *Microsoft*, October 11,
    2023 - https://techcommunity.microsoft.com/t5/windows-it-pro-blog/the-evolution-of-windows-authentication/ba-p/3926848

    - “What’s New in Kerberos Authentication.” *Microsoft*, August 31, 2016 - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/hh831747(v=ws.11).

    - “Credential Guard Overview.” *Microsoft*, September 5, 2023 – https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/

    - “Extended Protection for Authentication Overview.” *Microsoft*, September 15,
    2021 - https://learn.microsoft.com/en-us/dotnet/framework/wcf/feature-details/extended-protection-for-authentication-overview

    - “Group Managed Service Accounts Overview” *Microsoft*, August 4, 2023 - https://learn.microsoft.com/en-us/windows-server/security/group-managed-service-accounts/group-managed-service-accounts-overview


