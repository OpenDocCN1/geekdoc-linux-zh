    ```


    The Rockyou word “triplet” was transformed into “{tripletX” and the word, “ilovej”
    to “~IlovejT~”. You could also add in one of the “Toggles” rules to have it toggle
    letters in the words to upper or lower case while appending and prepending characters:


    ```

    {TripLetX -> ~IloveJT~

    ```


    Using multiple rules together can greatly expand the cracking ability of simple
    lists. I have used up to three smaller ones, but by then you start running out
    of available memory and Hashcat will exit.


    ### Mask Files


    Mask Attacks allow you to define the layout of the brute force words that will
    be used in your attack. For instance, if you know that the target''s password
    policy requires two numbers, six uppercase letters and two special characters
    you can create a mask for Hashcat to use.


    In this example it would look something like, `?d?d?u?u?u?u?u?u?s?s`:


    ```bash

    hashcat -D 1 -m 1000 Hardhash.txt -o Hardcracked2.txt -a 3 ?d?d?u?u?u?u?u?u?s?s
    --remove

    ```


    Play around with different masks until you get a feel for how they work. The longer
    the mask, the exponentially longer it will take for it to run. A three-letter
    mask could be finished in seconds. A 10+ character mask could take hours or years
    to run. Hashcat also allows for the use of “mask files” instead of manually providing
    the mask. Basically, a mask file is just a file that contains multiple masks.
    Example masks are included with Hashcat, and can be found in the `masks` subdirectory.


    Below is a screenshot of the “Rockyou-1-60.hcmask”:


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_127_0.png)


    To use a mask file, you simply provide the mask filename instead of typing a manual
    mask on the Hashcat command line.


    ```bash

    hashcat -m 1000 Hardhash.txt -o cracked3.txt -a 3 rockyou-1-60.hcmask --remove

    ```


