    # CRACKING SIMPLE LM HASHES


    Many Windows XP systems used Lan Manager (LM) hashes to protect their passwords.
    This is a very old and outdated way to store password hashes. This hashing process
    was created for systems before Windows NT. Believe it or not, you can still find
    LM Hashes used in modern networks today. In this chapter we will look at cracking
    these simple LM (and some simple NTLM) hashes.


    Microsoft’s support for Windows XP ended in 2014. As of Jan 2023, surprisingly
    enough around .5% of the world’s computers running Windows Operating Systems are
    still running it! XP is still holding on in the computer market share, just barely
    behind Windows 8, with Windows 10 still in first place. Shockingly what this means
    is that there are still a lot of Windows XP systems that could be in business-critical
    positions.


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_85_0.png)


    Source: Statcounter Global Stats – Feb, 2023<sup>1</sup>


    There are several different ways that computers encrypt their passwords. One of
    the most secure ways includes “Salting” the password. Basically, this means to
    use a number or string (called a Salt) and incororate that into the hashing process
    to ensure that no'
  - '[PAGE 86]


    two password hashes are ever the same. If a salt isn''t used (like on Microsoft
    NTLM hashes), if you can crack one hash, all the users that used the same password
    will have the same hash. So, all you need to do is take the hash and compare it
    to known hashes and if you get a match, you have the password.


    Basically, on a system using LM hashes, any password that is fourteen characters
    or less is converted into all uppercase, and then broken into two 7-character
    passwords. Each half is then encrypted and combined to form the final hash. Cracking
    7-character passwords using only uppercase letters is trivial, this is why LM
    hashes are not very secure.


    Again, there is no salt used, so basically if you can get the LM hashes from a
    system, all you need to do is a look up table comparison to other known hashes
    and you can get the actual password. The LM hash is usually stored along with
    the better encrypted NT hash. The combination of the two hashes is called an NTLM
    hash. One odd caveat with Windows NTLM hashes is that if the password is greater
    than 14 characters, the LM hash is not used at all and the contents of the LM
    hash will be invalid. Storing the weak LM hash can also be turned off on Windows
    systems, which is the case in most newer operating systems.


    A typical Windows NTLM hash looks something like this:


    ```

    ac93c8016d14e75a2e9b76bb9e8c2bb6:8516cd0838d1a4dfdl ac3e8eb9811350

    ```


    The LM hash is on the left of the colon and the more secure NT hash is on the
    right. The LM and NT hash combined are called an NTLM hash.'
