    ## Risks of Weak Passwords


    1. **Data Breaches:** Weak passwords are a primary factor in data breaches that
    result in the exposure of sensitive information. These breaches can have severe
    consequences for individuals and organizations, leading to financial loss and
    reputational damage.


    2. **Identity Theft:** Weak passwords make it easier for cybercriminals to impersonate
    individuals, leading to identity theft. Personal and financial information can
    be compromised, resulting in severe financial and emotional consequences.


    3. **Compromised Accounts:** Accounts with weak passwords are at a higher risk
    of being compromised, leading to unauthorized access and potential misuse of the
    account, including sending malicious emails, making unauthorized transactions,
    or spreading malware.


    4. **Weakened Organizational Security:** In a business context, weak passwords
    can compromise an organization''s security, as attackers may gain access to critical
    systems, confidential data, and proprietary information, resulting in financial
    loss and damage to the company''s reputation.


    ## The Importance of Strong Passwords


    1. **Resisting Brute Force Attacks:** Strong passwords, comprising a combination
    of upper and lower-case letters, numbers, and special characters, significantly
    increase the time and effort required for attackers to guess the correct password.


    2. **Mitigating Dictionary Attacks:** Complex passwords that do not contain easily
    guessable words or phrases are more resistant to dictionary attacks.


    3. **Preventing Credential Stuffing:** Unique, strong passwords for each account
    prevent attackers from using leaked credentials to access other services. Password
    managers can help users generate and manage complex passwords for multiple accounts.


    4. **Enhancing Resistance to Phishing:** Strong passwords, in conjunction with
    other security practices, can help individuals recognize and resist phishing attacks
    by ensuring that the website or email source is legitimate.


    The importance of passwords in cybersecurity cannot be overstated. Weak passwords
    are the entry point for a wide array of cyber threats, ranging from data breaches
    to identity theft. To protect digital assets and personal information, individuals
    and organizations must prioritize the use of strong, unique passwords and consider
    implementing additional security measures such as two-factor authentication. Education,
    awareness, and proactive password management are crucial in the ongoing battle
    against cyber threats.


    # WORDLISTS


    You are a Penterter or a Red Team member in an active security assessment. You
    have recovered password hashes, but can''t pass them, or, use them as-is to gain
    further access. What are you to do? Crack them! Wordlists are very important when
    trying to crack passwords. Cracking programs can take a text file filled with
    words, also known as a wordlist or dictionary file, and use it to crack passwords.
    They literally take a word from the wordlist, encrypt it and compare it with the
    encrypted password hash. If it doesn''t match, it moves on to the next password.
    Most cracking programs use the wordlist directly word for word, while more advanced
    ones can also use the wordlist (or multiple wordlists) and manipulate them to
    create many new combinations of passwords to try. For example, some can take all
    the words in the wordlist and attach letters or numbers to the beginning or end
    of the word, or take two or more wordlist files and combine the words from both
    to make a new list of words to try. This greatly increases your chances of cracking
    passwords.


    You can download huge wordlists from the internet that include cracked passwords
    that have been publicly leaked, combinations of leaks, foreign language wordlists,
    dumps of entire dictionaries or encyclopedias, and more. Even though this will
    provide you with an extremely large amount of password possibilities, I have a
    hard drive filled with wordlists, many times this will still not be enough. Users
    may use industry specific terms or corporate names, positions or titles in their
    passwords. In these cases, Pentersterers will make their own password list using
    company data, employee names, phone numbers, e-mail addresses, etc.


    > **Warning:**

    >

    > Some publicly dumped wordlists are not sanitized (account information removed)
    and contain user accounts along with passwords. Possessing this information could
    be an ethical issue, and possibly a legal issue in some nations. Never attempt
    to use this information to try to access accounts that you do not own or have
    permission to access.


    Some cracking tools have rule sets that modify the wordlists to create more password
    combinations. These rulesets can do things like changing all uppercase characters
    to lowercase, or vice versa. Others can modify the word by adding pre-fixes, suffixes,
    numbers or dates creating a totally new word. For example, a Leet (133t) Speak
    rule set can take a word from the password file and convert it to “leet speak”,
    replacing common letters with numbers. Using a wordlist with rules can make password
    cracking much easier and faster.


    You can also take the passwords that you were able to crack, analyze them statistically
    for patterns, and then use this information to attempt to recover more passwords.
    This is accomplished by using tools to create password guess masks. The recovered
    passwords can also be used as a new attack wordlist using the cracking program
    rules to attempt to crack passwords that are similar to the ones already recovered.
    Unless you luck out and find a wordlist that contains all of the passwords in
    the dump, you will always end up analyzing the cracked passwords for patterns
    in an attempt to crack the last batch of passwords.


    When all else fails, you will need to attempt to use brute force cracking to get
    the remaining complex passwords. Brute force cracking simply means using the cracking
    program to step sequentially through every possible password combination possible.
    For letters, the cracking program would start at “a” and work through “Z”, and
    for numbers start at “0” and work up to “9”, trying every combination in between.
    You can combine these together to have the cracking program look for passwords
    from “a0A0a” through "z9Z9z". You can also use these combinations together with
    a wordlist to crack passwords like "a0a0aPassword" or "Passwordz9z9z".


    We will cover all the above-mentioned techniques in the following chapters. In
    this chapter we will cover wordlists that are included with Kali, how to make
    your own wordlists and briefly cover some wordlists that you can download from
    the web.


    Having a good wordlist (or lists) is imperative to cracking passwords. As already
    mentioned, some wordlists are created from previous password dumps, some are literally
    words from a dictionary, lists of people, places or things. Some are generated
    from patterns, and some are a combination of all of the above. All of these are
    available as downloads on the Internet. Be careful, some of the sites that host
    random wordlists are malicious or black hat sites!


    One would think that using huge wordlists is the way to go – but it really isn''t.
    Though using large wordlists may be a good place to start, for your first run
    through, they are not always the most effective at cracking passwords. One of
    the more effective techniques is to use shorter wordlists in combination with
    rules. We will cover cracking with rules later in this chapter. First, let''s
    look at some good sources for lists.


    # COMMONLY USED WORDLISTS


    - **Ignis** - https://github.com/ignis-sec/Pwdb-Public/tree/master/wordlists

    - **Packet Storm** - https://packetstormsecurity.com/Crackers/wordlists/

    - **Weakpass** - https://weakpass.com/wordlist

    - **Hashkiller** - https://hashkiller.co.uk/

    - **Probable Wordlists** - https://github.com/berzerk0/Probable-Wordlists

    - **G0tm1k** - https://download.g0tm1k.com/wordlists/large/

    - **SecLists** - https://github.com/danielmiessler/SecLists

    - **Clem9669** - https://github.com/clem9669/wordlists

    - **Hashmob** - https://hashmob.net


    All links were active websites at the time of this writing, but may change over
    time. Some are single wordlists; some pages have numerous wordlists. Of these,
    the Ignis, Clem9669, and the Hashmob lists are my favorites. I feel these three
    are some of the best collections currently available. They also work extremely
    well in combination with other wordlists and with rules. Even though there is
    a new "Rock You 2021" wordlist out, I personally feel it is too large to be used
    for combination, hybrid or rules type attacks. Though if you want a good large
    wordlist, you can easily Google for it.

