    cracking. Using a good wordlist will greatly increase your chances and speed of
    password cracking. We will cover how to find, create or generate effectual wordlists
    for password cracking. This includes using tools to create custom wordlists. Then
    we will dive into the actual cracking tools. How Wordlists are used by cracking
    programs to unlock access. In the chapters ahead we will briefly cover John the
    Ripper and then take a deep dive, multiple chapters look at the pre-eminent password
    cracking tool, Hashcat.


    First up, how do we obtain hashes for cracking? We will take a look at how the
    Kerberos and NTLM Authentication protocols work in Windows and then how to pull
    hashes from them. Strap in, buckle up, this is going to be a wild ride!


    ## CHAPTER 2

    ### Obtaining Password Hashes for Cracking


    Windows Server active Directory has several ways in which it can authenticate
    users. These authentication protocols include NTLM and Kerberos. Let''s begin
    by talking about both briefly.


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_17_0.png)


    NTLM (NT LAN Manager) protocol plays a pivotal role in authentication processes
    within Windows environments, acting as a key mechanism to verify the identity
    of users and systems. As a legacy protocol, NTLM has been a stalwart component
    since the early versions of Windows, although its prominence has diminished with
    the advent of more advanced authentication protocols, like Kerberos.


    Unlike Kerberos, NTLM primarily functions through a challenge-response mechanism.
    When a user attempts to access a resource, the server generates a random challenge
    that is sent to the client. The client then encrypts this challenge using the
    user''s credentials and sends the encrypted response back to the server. If the
    server can successfully decrypt the response using the stored credentials, access
    is granted. This process provides a level of security by ensuring that both the
    client and the server possess the necessary credentials for authentication.


    However, despite its historical significance, NTLM is not without its vulnerabilities.
    Over time, security experts have identified weaknesses in the protocol, leading
    to its gradual replacement by more robust and secure authentication methods like
    Kerberos. NTLM is susceptible to certain types of attacks, such as pass-the-hash
    attacks, where an attacker captures the hashed credentials and attempts to use
    them for unauthorized access. Though there are many ways of dumping NTLM password
    Hashes, one of the most popular tools is Mimikatz.


    Kerberos is the most secure protocol of the two. But many companies still use
    the older NTLM authentication protocol, so it is still included by default. With
    the creation and implementation of more secure authentication protocols, like
    Kerberos, restricting NTLM usage or removing it completely is a very good idea.
    That being said, Kerberos and NTLM are both frequently targeted by attackers.
    Though the authentication protocols are different, the attack process, in a way,
    is similar – hackers use tools or procedure to obtain the encrypted password information
    from either, and then try to crack it.


    We will start with an in-depth look at one way to attack Kerberos Security – "Kerberoasting".
    We will then look at a quick way of dumping NTLM credentials with Mimikatz. There
    are many tools and processes you can use to dump credentials from memory. We will
    only quickly cover a few. I cover additional password recovery topics in my Basic
    and Advanced Kali books.


    This next section will be more theory, it''s good to understand the technology
    behind the process. But if the theory is too complicated and you feel a little
    lost, don''t worry! It really does seem like confusing techno-babble, lol! For
    now, just understand that Windows can create several types of encrypted passwords
    including Kerberos and NTLM. And the process of pulling them from a system and
    cracking them is slightly different.


    ## KERBEROASTING


    “Kerberoasting” is a security attack that targets the Kerberos authentication
    protocol used in Active Directory environments. In simple terms, in an Active
    Directory environment, Kerberos is one of several protocols that helps users and
    systems authenticate themselves securely. Kerberos is a Ticket Based system. Basically,
    Kerberoasting is a method where an attacker captures encrypted service tickets,
    targeting service accounts in an Active Directory environment, and then attempts
    to crack the encrypted information offline to reveal the service account''s password.

