  - '[PAGE 42]


    # CHAPTER 3


    # Wordlists


    You see those, “Top Passwords for Year 20XX” lists every year, and honestly, in
    my opinion they are just not really true anymore. Basic password requirements
    for servers mostly prevent the use of many of the passwords listed. In actively
    cracking public dump lists, the top passwords I have seen for the last several
    years are a combination of a person’s name (or names), numbers and possibly a
    symbol. People are creatures of habit, and patterns, and this is especially true
    when they create passwords. Names, important dates or numbers are easy to remember,
    so, these are usually what are used when creating a password. Many passwords also
    start with a capital letter and end with a symbol. It is hard to overcome years
    of proper language classes.


    I personally use Kali Linux for processing my wordlists, but I do most of my password
    cracking on a Windows 11 box. The most efficient cracking is done on a system
    with a very strong and fast GPU. In my house, that doubles as my gaming PC. So,
    Microsoft Windows it is! In saying this, the commands for Hashcat are mostly identical
    between Windows & Linux, thus I will show the more generic versions of the commands
    so the reader can use them on their platform of choice. Throughout the book, any
    Linux commands are shown on Kali Linux. Also, any Windows based commands are run
    on a Windows 11 or Windows Server 2022 lab system.


    In this chapter we will talk about Wordlists – Wordlists are an important part
    to password cracking. Once we have a solid understanding of finding, creating
    and using wordlists, we will move on to using Wordlists with cracking tools to
    actually crack passwords.'
