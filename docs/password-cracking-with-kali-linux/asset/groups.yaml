    # ABOUT THE AUTHOR


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_4_0.png)


    **Danier W. Dieterle**


    Danier W. Dieterle has worked in the IT field for over 20 years. During this time,
    he worked for a computer support company where he provided system and network
    support for hundreds of companies across Upstate New York and throughout Northern
    Pennsylvania. He also worked in a Fortune 500 Corporate Data Center, an Ivy League
    School’s Computer Support Department and served as an Executive at an Electrical
    Engineering company and on the Board of Directors for a Non-Profit corporation.


    For over the last 11 years Daniel has been completely focused on security as a
