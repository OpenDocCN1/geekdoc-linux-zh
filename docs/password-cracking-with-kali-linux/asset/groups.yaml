  mdcn: "\n\n**combinator3** 命令类似于 **combinator**，但它专注于通过组合三个输入文件来生成更复杂的词表组合。这在创建具有更高变异性质的混合词表时特别有用。\n\
    \n基本用法：\n\n```\ncombinator3 [OPTIONS] [INPUT_FILES] > [OUTPUT_FILE]\n```\n\n例如，要组合三个词表\
