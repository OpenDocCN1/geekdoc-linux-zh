    \ option to display all of the cracked passwords reliably\nSession completed.\n\
    ```\n\n现在，我们可以通过使用 “--show” 命令来查看 John 的成功程度：\n\n-   输入 “john --show shadow”\n\
    \n```\n[kali@kali:~]$ john --show shadow \nsys:batman:14742:0:99999:7:::\nklog:123456789:14742:0:99999:7:::\n\
    service:service:14715:0:99999:7:::\n3 password hashes cracked, 4 left\n```\n\n\
    就这样；我们现在有了 3 个用户名和密码可以动手尝试：\n\n-   sys/ batman\n-   klog/ 123456789\n-   service/\
    \ service\n\n*注意：原始 OCR 文本在摘要列表中显示为 \"1234567898\"，但在上面的哈希输出中为 \"123456789\"。标准哈希输出通常与破解出的密码一致。考虑到\
