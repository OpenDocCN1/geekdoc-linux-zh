  - '[PAGE 105]


    # # SINGLE WORDLIST


    **-a0, Straight Attack or the Single Wordlist Attack - **This is the simplest
    attack in Hashcat. Hashcat will use a single wordlist against the password hash
    file. Each word from the wordlist will be directly hashed and compared with the
    password. If there is a match, the password is “cracked”. If not, hashcat tries
    the next word in the wordlist and continues until every word in the wordlist is
    checked against the password hashes.


    Example:


    ```

    > ```

    > **hashcat -m 0 [Uncracked].txt wordlist.txt -o [Cracked.txt]**

    > ```

    ```


    You can also use “Rules” in single attack mode.'
  - '[PAGE 106]


    # SINGLE WORDLIST WITH RULES


    Rules automatically modify words in the wordlist, to greatly increase your guess
    word base. Think of them as a programming script to modify the words in wordlists.
    They can add or remove characters, modify cases, double the words, or numerous
    other useful things. The rules files are found in the “rule” subdirectory. If
    you look at each rule file you can see the “programming language” used to modify
    each word.


    The "Best64" rule is one of the most popular and is quick to run:


    ```

    >   **hashcat  -m 0  [Uncracked].txt  wordlist.txt -o [Cracked.txt] -r rules/best64.rule**

    ```


    You can toggle the case of every character in the wordlist with the “toggles”
    rules:


    ```

    >   **hashcat  -m 0  [Uncracked.txt]  wordlist1 -o [Cracked.txt] -r rules/toggles.rule
    -O**

    ```


    This creates words like:


    cat, Cat, cAt, caT, dog, Dog, dOg, doG


    You can also use two rule files at a time if they are small enough. Though, this
    creates huge guess wordlists that can sometimes overflow your available memory,
    causing Hashcat to exit.


    ```

    >   **hashcat  -m 0  [Uncracked].txt  wordlist.txt -o [Cracked.txt]        -r
    rules/best64.rule   -r rules/OneRuleToRuleThemAll.rule**

    ```


    Combining the "best64" & "OneRuleToRuleThemAll" rules together is very effective.
    It is one of my favorite go-to combinations when cracking. Hob0Rules (https://github.com/praetorian-inc/Hob0Rules)
    are pretty good too. Each Rule file is slightly different, so it is good'
  - '[PAGE 107]


    to try them out and see which ones are most effective for your needs.'
  - "[PAGE 108]\n\n# COMBINING TWO WORDLISTS\n\n**-a1 Combination Attacks** - You\
    \ can easily combine two wordlists using the -a1 command. This command will take\
    \ every word from one list and combine it with every word from the second list.\
    \ This is useful when users string together multiple words or strings in their\
    \ passwords.\n\n```\n```\n>     hashcat  -m 0 [Uncracked.txt] -o [Cracked.txt]\
    \ -a1\n        wordlist1 wordlist2 -O\n```\n```\n\nCreates words like:\n\n+  \
    \ cattog\n+   dogcat\n\nHashcat also gives you the capability to add a single\
    \ character at the end or middle of a combined wordlist. You can do this with\
    \ the “-j” or “-k” switches. This allows you to do things like combine wordlists\
    \ while putting a space (or any single character) in between each word. You can\
    \ do this using the “-j” switch:\n\n```\n```\n>     hashcat  -m 0 [Uncracked.txt]\
    \ -o [Cracked.txt] -j$\" \" -\n        a1 wordlist1 wordlist2 -O\n```\n```\n\n\
    This creates words like:\n\n+   cat dog\n+   dog cat\n\nCombine wordlists with\
    \ a \"!\" (or any character) at the end of each word. You can do this with the\
    \ “-k” switch:\n\n```\n```\n>     hashcat  -m 0 [Uncracked.txt] -o [Cracked.txt]\
    \ -k$\"!\"\n        -a1 wordlist1 wordlist2 -O\n```\n```\n\nCreates words like:"
  - "[PAGE 109]\n\ncatdog!\ndogcat!\n\nYou can also use the -j and -k switches together.\
    \ For Example, to combine wordlists using a space in the middle and a \"!\" at\
    \ the end of each word:\n\n```\n```\n> hashcat64 -m 0 [Uncracked.txt] -o [Cracked.txt]\
    \ -j$\"\n -k$\"\"!\" -a1 wordlist1 wordlist2\n```\n```\n\nCreates words like:\n\
    cat dog!\ndog cat!"
  - '[PAGE 110]


    # MASKS, BRUTE FORCE AND HYBRID ATTACKS


    Masks are used in Hashcat to perform brute force cracking. This is specified in
    Hashcat with the "-a3" switch. Some people frown on brute force cracking because
    of the wasted time in cracking. It has to try every combination of a pattern and
    can take an extended amount of time - hours, days, months, even years! (Side note,
    I don''t ever let it run for more than a day, just look through the ones it did
    crack for new patterns and try a better mask!) But it is absolutely necessary,
    especially when cracking hashes of unknown length and complexity. When you have
    exhausted all your wordlists, rules and combinator attacks, brute force is a great
    way to get a "fresh look" at the hashes and possibly see a pattern that you could
    use. Once you do find a pattern, you can step back and modify your mask to be
    more exclusive or switch to a specialized wordlist that contains those patterns.


    Using Masks greatly reduces brute force cracking time. One of my favorite cracking
    techniques is using hybrid attacks or wordlists and masks together. There are
    two available in Hashcat -a6 [wordlist & mask], and -a7 [mask & wordlist]. Using
    a Hybrid attack is much faster than just using brute force masks alone. We will
    talk about all in this section.'
  - '[PAGE 111]


    # MASKS


    Before we go further, it is important to understand what masks are in password
    cracking. Regular brute force attacks are outdated, masks bring a level of intelligence
    to our brute force attempts. In essence, a mask is just a symbolic list of characters
    you want to use in any type of brute force attack.


    You can use:


    +   - **?l** – lowercase

    +   - **?u** – uppercase

    +   - **?s** – symbol

    +   - **?d** – numbers

    +   - **?h** – 0-9, and letters "a-f"

    +   - **?H** – numbers 0-9, and letters "A-F"

    +   - **?a** – Any number, letter, or symbol

    +   - **?b** – Binary – Every hex character from 00 to ff'
  - '[PAGE 112]


    # ## BASIC BRUTE FORCE ATTACKS


    Hashcat uses the “-a3” switch for brute force/mask attacks - You just enter the
    mask you want to use and it will try every possible character from your specification.
    Brute forcing is great, but can be very time consuming. An 8 character mask made
    up all of “?a”, forcing it to try every character, number and symbol for every
    position, can take an extremely long time to process. You can shorten the time
    by using the “?u”, “?i”, or “?s” for certain positions. For example, an “-a 3”
    attack using a mask of “?a?!?u?s” would produce guesses like:


    RaiN!

    7laB$

    *upwJ)


    Because of the reduced number of potential characters, you will use, it will crack
    these much faster than if it had to run through every possible combination of
    characters.


    “?b” takes even longer than “?a”, as it will try every hex character from “00”
    to “ff”. This includes standard numbers, letters, and symbols, but also extended
    ASCII characters including foreign and special characters like tab, line feed,
    etc. But if you need to brute force foreign characters “?b” comes in very handy!'
  - "[PAGE 113]\n\n# ## HYBRID ATTACKS – WORDLISTS AND BRUTE FORCE TOGETHER\n\nUsing\
    \ a wordlist together with a mask is a much more efficient use of time.\n\nThe\
    \ format for a hybrid attack is:\n\n```\n*-a6 wordlist [mask] or -a7 [mask] wordlist*\n\
    ```\n\n+   1. Using a -a6 attack:\n\n```\n*-a6 wordlist.txt ?a?!?l?u?s* (only\
    \ the end of the hashcat command line is shown)\n```\n\nWill produce words like:\n\
    \n+   * catRaiN!  \n+     cat7laB$  \n+     dog\\*upW)\n\n+   2. Using an -a7\
    \ attack:\n\n```\n*-a7 ?a?!?l?u?s wordlist.txt*\n```\n\nWould produce words like:\n\
    \n+   * RaiN!cat  \n+     7laB$cat  \n+     \\*upW)dog\n\nYou can add in the \"\
    -I\" or incremental flag on any of the brute force methods, this causes Hashcat\
    \ to only process one character of the mask at a time. So it will go through the\
    \ entire wordlist and add just the \"?a\" character to each word. The second pass\
    \ it will add the \"?a?l\", and so forth until all the characters in the mask\
    \ are used.\n\nFirst pass:\n\ncatB"
  - '[PAGE 114]


    +   - cat7

    +   dog*


    Second pass:


    +   - catBr

    +   cat7l

    +   dog*u


    Incremental attacks are very effective because they remove passwords that are
    cracked as they go. So even though each time a new character from the mask is
    added, exponentially increasing the cracking time - hopefully your list of to
    be cracked passwords is shrinking at the same time.'
