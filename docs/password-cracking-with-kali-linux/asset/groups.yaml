    # RUBEUS


    **Tool GitHub:** [https://github.com/GhostPack/Rubeus](https://github.com/GhostPack/Rubeus)


    **Tool Wiki:**

    [https://specterops.gitbook.io/ghostpack/rubeus/introduction](https://specterops.gitbook.io/ghostpack/rubeus/introduction)


    Rubeus is a C# based tool for interacting and attacking Kerberos. The tool was
    originally based off of Benjamin Delpy''s (the creator of Mimikatz) Kekeo, but
    has since evolved into its own creation. Rubeus can be used in many, many different
    ways to attack Kerberos, we will only briefly look at one. I highly suggest the
    reader check out the tool''s Wiki for extensive documentation and usage information.


    You will notice there is no executable download on the Rubeus GitHub page. You
    will need to compile the tool on your own. Obviously in its present form, it will
    be detected by most, if not all Anti-Virus systems and blocked right away. An
    experienced Red Team attacker would need to modify some of the code before compiling
    to avoid AV detection.


    # Quick Kerberoasting Walkthrough


    +   1. **Obtaining Initial Access**


    Before an attacker can use Rubeus, they need to gain initial access to a system
    or network. This could be achieved through various means, such as exploiting vulnerabilities,
    using phishing attacks, or leveraging other attack vectors. I cover these techniques
    extensively in my Basic and Advanced Security Testing with Kali Linux books.


    +   2. **Deploying Rubeus**'
