    Session..........: hashcat

    Status...........: Exhausted

    Hash.Mode........: 1000 (NTLM)

    Hash.Target......: /home/kali/Hardhash.txt

    Time.Started.....: Mon Mar   6 16:20:05 2023

    Time.Estimated...: Mon Mar   6 16:20:05 2023

    Kernel.Feature...: Pure Kernel

    Guess.Mask.......: 2l2l2l2l?d [5l]

    ```


    When run, Hashcat will step through the file using each mask listed one by one.
    As mentioned before, the longer the mask, the longer it will take to run. That
    is why it is always best to use a video card GPU on a stand-alone system (non-VM)
    to speed things up, if you have a compatible card. You would change to the GPU
    using the "-D" switch and you could also use the "-O" switch at the end which
    will not crack extremely long passwords, but greatly increases cracking speed.


    ## PRINCE PROCESSOR ATTACK


    - Tool GitHub: [https://github.com/hashcat/princeprocessor](https://github.com/hashcat/princeprocessor)

    - Releases: [https://github.com/hashcat/princeprocessor/releases](https://github.com/hashcat/princeprocessor/releases)


    Prince Processor (PP) is an advanced wordlist combinator attack. It can perform
    complex wordlist attacks using a single wordlist file. First, set a minimum password
    length, then provide a wordlist to use. PP will then take the length you provided
    and begin to build words of that length from multiple words in the existing file.
    So, if you set a word length of 6, it can take all 6 letters from one word, or
    it can take 1 letter from 6 words, or 2 letters from 3 words, and any combination
    in between.


    PP then takes these new words and pipes them into hashcat, live on the fly. Hashcat
    uses the words as a regular wordlist and uses them to crack away. It''s not amazingly
    fast, but if you run out of other options, it is an interesting technique to use.
    Prince Processor is available for Linux, Windows and Mac.


    Here is an example on Windows:


    ```

    pp64.exe --pw-min=12 < HugeWordlist.txt | hashcat64 -D 2 --remove -m 0 uncracked.txt
    -o cracked.txt -O

    ```


    I’ve had mixed results with Prince Processor, what it does is very impressive,
    but there is a huge speed hit. That’s why I run it on my Windows gaming system.
    Though the size of the wordlists doesn’t seem to really affect speed. Prince Processor,
    on its own is extremely fast, I think the bottleneck is more in piping the output
    into Hashcat. Though I did find feeding a wordlist into Prince Processor, then
    outputting it directly to a text file, then using that as a regular wordlist works
    much faster.

