    # CHAPTER 4


    # **Determining Hash Type & Cracking Simple Passwords**


    Computer operating systems and applications normally store passwords in an encrypted
    form called a password hash. The hash is a cryptographic representation of the
    actual password. Therefore, the hash will need be to be unencrypted or cracked
    to find the true password. Surprisingly, some services store or transmit passwords
    in plain text! But during most security tests, when you recover a user''s password
    it will be in the encrypted hash form.


    There are many different types of encryption used when creating hashes. In this
    chapter we will first talk about determining what type of hash you may have recovered.
    Then we will talk about the simple (and outdated) Microsoft LM password hash and
    see how these can be cracked online. We will cover password cracking with cracking
    tools in greater depth in the following chapters.'
  - '[PAGE 82]


    # NOT SURE WHAT KIND OF HASH

    YOU HAVE?


    There are several different types of hashes that you will run into when you start
    cracking passwords. We covered Kerberos tickets in depth in the first chapter.
    But some of the most confusing ones are the different Windows hashes. Let''s try
    to explain these really quick.


    +   - **LM Hash** – Outdated password hash that goes back to the old Lan Manager
    days. LM hashes are no longer stored by default, but you might still find them
    creeping about.


    +   - **NTLM Hash** – Comprised of the LM hash and NT Hash (NTHash), separated
    by a colon. This is what you will find when you dump passwords from a Windows
    SAM Database or a Domain Controller''s database. NTLM Hashes can be passed in
    \"Pass the Hash\" type attacks.


    +   - **NTLMv1 or NTLMv2** – These are challenge response hashes, NTLMv2 is more
    secure. You will capture these hashes when you use a program like Responder. You
    can use these hashes in relay attacks, though you can''t relay a hash back to
    the source machine, it has to be a different system. You can disable the weaker
    NTLMv1 hashes but you will need to see if this is a viable solution in your network,
    especially if you have legacy systems.


    To make matters more confusing NTLMv1/ v2 hashes are also called Net-NTLMv1 or
    Net-NTLMv2. Sometimes you might be able to retrieve a password hash, say from
    a database or software app, but might not be able to determine what type it is
    by first glance. You need to know the correct type so you can tell the cracking
    program'
  - '[PAGE 83]


    what decryption algorithm to attempt. There are a couple hash identification programs
    in Kali that will try to identify the type of hash that you provide.


    “Hash-identifier” and “Hash ID”


    We will take a quick look at each of these apps and then quickly talk about cracking
    LM/NTLM hashes.


    # Hash-Identifier


    Hash-Identifier is a very simple tool to use. Simply run it and input the Hash.
    The program will check it and return the most likely types of hash it could be
    along with least likely types.


    +   Open a terminal prompt in Kali

    +   Type, “hash-identifier”


    Copy and Paste in the LM hash below and Hash Identifier will try to determine
    what type it is:

    “8846f7eaae8fb117ad06bdd830b7586c”

    As seen below:


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_83_0.png)


    Hash Identifier returns the most “possible” encryption type first. It also includes
    multiple other potential types, including “Least Possible” encryption types. Once
    you know the Encryption type, you can proceed to cracking the hash – covered later.'
