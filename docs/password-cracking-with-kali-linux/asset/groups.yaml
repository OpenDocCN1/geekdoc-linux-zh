    ## CHAPTER 5

    John the Ripper


    Now that we have covered a lot of the basic of password theory and an understanding
    of wordlists, let''s dig into cracking tools! In the next several chapters we
    will look at two of my favorites, John the Ripper & Hashcat. We saw that sometimes
    you can just do an online hash lookup, and in some cases, you can pass the hash.
    But if all else fails, you have to crack the hash. Kali includes several excellent
    tools to do this. We will quickly cover John the Ripper in this chapter, then
    dive deep into Hashcat in the upcoming chapters.


    ### INTRODUCTION TO PASSWORD CRACKING TOOLS


    We rely on passwords to secure our home systems, business servers and to protect
    our online account information. But as cracking programs improve and video cards
    get faster (Video GPU''s are used for very fast cracking) passwords are becoming
    much easier to crack. How big of a problem is this? I have been working through
    some very large publicly dumped password hash lists using Hashcat. I use an older
    Windows 11 system that has a Core i7-6700 processor running at 3.4 Ghz and a single
    RTX 2060 video card. I''ve seen it hit cracking speeds over 1 billion hashes a
    second. When you think about that, it is insane! And that was just with using
    a single video card. The newer top end cards are a lot faster, especially when
    you use multiple cards for cracking (I''ve seen rigs with numerous cards).


    Granted these were simple SHA1 encrypted hashes, hashes using newer encryption
    or salted passwords would take a lot longer to crack. A salted password uses a
    unique value or salt to encrypt each password so no two password hashes are ever
    the same. But believe it or not finding public password dumps using unsalted passwords
    are still very common today. Add in the fact that the newer versions of Hashcat
    takes the maximum crack-able password length from 32 up to 256 and it makes you
    think twice about your company password length and complexity policy.


    There is a big speed difference between Video GPU based cracking tools and CPU
    based tools. Hashcat is one of the most popular and the "world''s fastest" GPU
    based cracking tool. John the Ripper is one of the most popular CPU based crackers.
    We will look at both, first up, John the Ripper!


    ### JOHN THE RIPPER


    **Tool Author**: Solar Designer and community


    **Tool Website**: [https://www.openwall.com/john/](https://www.openwall.com/john/)


    John the Ripper, or John (or JTR) is a very fast CPU based password cracker. It
    is very easy to use and is often the first tool used when trying to crack a password.
    John is very good at getting shorter passwords, so I usually use John first, to
    get the low hanging fruit or easier passwords, and then move to Hashcat for more
    complex cracking. As such, we will only quickly cover John.


    ### JOHN THE RIPPER OVERVIEW


    John the Ripper is an open-source password cracking software that is widely used
    for penetration testing, ethical hacking, and forensic analysis. Developed by
    Solar Designer, the tool has become a staple in the cybersecurity community due
    to its effectiveness and flexibility.


    **Password Hash Cracking**


    John the Ripper excels in cracking password hashes of all types. It supports hundreds
    of hashes and ciphers, including DES, MD5, SHA-1, SHA-256, Bitlocker, Archives
    (ZIP, RAR) and more. This versatility makes it suitable for handling a wide range
    of both Offensive Security and Forensics uses.


    **Wordlist and Hybrid Attacks**


    John supports dictionary attacks using wordlists, allowing users to leverage commonly
    used passwords or create custom lists based on specific criteria. Additionally,
    it can perform hybrid attacks, combining wordlists with brute-force methods to
    increase the chances of success.


    **Multi-platform Support**


    John the Ripper is platform-independent, running on various operating systems,
    including Unix, Linux, Windows, and macOS. This flexibility makes it a valuable
    asset for security professionals working in diverse environments.


    **COMMONLY USED SWITCHES**


    To harness the full potential of John the Ripper, security professionals utilize
    various command-line switches to customize and optimize their password cracking
    efforts. Here are some commonly used switches along with examples.


