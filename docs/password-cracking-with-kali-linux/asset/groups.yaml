    but what are some ways an attacker might use to compromise a machine that they
    have access to? In this section we will look at one possible technique called
    the "Utilman Bypass". We will use a Kali Live CD, along with Mimikatz to create
    a very powerful combination.


    ## UTILMAN LOGIN BYPASS


    Okay this technique is really old, and not technically an attack. It originated
    from an old Microsoft TechNet Active Directory support forum. This technique,
    called the *Utilman Bypass*, was one technique recommended to log into a Windows
    server in case you forgot the password. The Utilman bypass works by manipulating
    a helpful windows function that is available at the login prompt. It allows a
    system level command session to open without using credentials. I have friends
    who support large corporate networks that tell me that they still use this technique
    for legitimate purposes. For example, when old corporate stand-alone systems need
    to be backed up and re-purposed and no one can remember the passwords, they will
    use this technique.


    **Warning:**

    If you do something wrong in this procedure you could render your Windows system
    unbootable. Ye have been warned.


    For this exercise, we will boot from the disk and change the Windows “Utilman”
    program, so when the “Windows” + “u” keys are pressed, a command prompt will open
    instead of the normal utility menu. We will work through this process step-by-step.
    To perform this procedure in real life, you would need a (Kali) Linux boot disk
    or bootable Linux USB drive. For our lab I just downloaded the 64-bit Kali Linux
    ISO. On the Kali Website (Kali.org), under “Get Kali”, just choose the Live Boot
    option and then the recommended Live image will work fine.


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_159_0.png)


    After the .ISO image is downloaded we can boot from it on the **Windows 11 VM**.
    All we need to do is set the ISO as a boot drive image in VMware.


    As seen in the following screenshot.


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_159_1.png)


    As we will be modifying system file names, take your time and be sure to select
    the correct files.


    1. Use a standalone Windows system & bootable Kali disk or set your Windows 7
    VM CDROM drive to use the Kali Linux ISO and boot from it.

    2. If using VMware, click in the window and hit “esc” to get the boot menu on
    bootup.

    3. Select boot from CD.


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_160_0.png)


    4. Choose the “Live system (amd64)” boot option.

    5. After a while the Kali Desktop will appear. Double Click the Windows Hard Drive.


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_160_1.png)


    You can now view all of the files on the Windows system and can navigate through
    the directory structure at will. Windows security and permissions no longer apply,
    as you are viewing the drive in Linux. You could copy off individual files or
    copy tools to the drive if you wished.


    > **Note:**

    > If the hard drive is not encrypted, you have complete access to the Windows
    file system at this point.


    6. Navigate to the “Windows\System32” directory.


    What we are going to do now is to replace the Utilman executable with a copy of
    the command prompt executable. We will rename the original ‘Utilman.exe’ file
    out of the way, make a duplicate copy of ‘cmd.exe’ and rename it to ‘Utilman.exe’.


    7. Find the “utilman.exe” file and rename it to “utilman.old”:


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_161_0.png)


    File icons may be different. Just make sure the file names are correct.


    8. Right click on the “cmd.exe” file and click “copy to”. Now copy it right back
    into the same directory. You should now have both “cmd.exe” and a file called
    “cmd (copy).exe”, like so:


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_161_1.png)


    9. Now rename the “cmd (copy).exe” file to “Utilman.exe”.


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_161_2.png)


    You should now have two Utilman files, ‘utilman.old’ (which is the original) and
    the new ‘utilman.exe’ file (which is the copy of cmd.exe):


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_162_0.png)


    And that is all we need to do. Keep the *Utilman.old* file in case you want to
    switch it back and restore normal Utilman functionality.


    Now just shutdown Kali and let the Windows system boot up normally. If you set
    the VM to boot from the Kali ISO image, you need to go into the CDROM settings
    set it back to *use physical drive*. At the login screen press the **"Windows"**
    & *u* key together, and up pops a System level command prompt!


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_162_1.png)


    If you type **`whoami`** you will see that you are in fact the user *nt authority\system*,
    the highest-level access that is available.


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_163_0.png)


    Notice the login icons are still in the background. From here you can do anything
    you want; you have complete access. As far as I have seen, this works in all versions
    of Microsoft Windows OS’s from Windows 9x on up. It also works in their Server
    products. Modifying the "**Sethc.exe**" command in the same way, also allows you
    to bypass the Windows login screen. The Sethc file is for the Windows Sticky Keys
    function. Under normal operation, if you hit the shift key five times in a row,
    the sticky key dialog box will pop up. Used this way, just hit the shift key five
    times at the login screen and the system level command prompt opens. Though this
    doesn''t work really good in a VM as the Windows host will trigger the sticky
    key response before the VM does.


    > **Note:**

    > Physical access for the most part equals total access. Encrypt your drives and
    secure your systems!


