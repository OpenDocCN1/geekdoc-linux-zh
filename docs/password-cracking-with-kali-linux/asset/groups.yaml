    # # WINDOWS 11 - INSTALLING AS A VIRTUAL MACHINE


    In this book I use a Windows 11 system as a target for multiple chapters. You
    will need to install a licensed copy of Windows in VMware Player. If you do not
    have a licensed copy of Windows 11, you could download a time bombed Enterprise
    Trial version from Microsoft.


    A trial Windows 11 Enterprise VMware image is located at:


    https://developer.microsoft.com/en-us/windows/downloads/virtual-machines/


    Just download the VMware version, and then add it to VMware Player. I recommend
    using at least 6 GB of RAM for the virtual machine. If you use too little the
    VM will be sluggish, but too much could affect the performance of the host. Also,
    set the network adapter to bridged (or whatever is best for your environment).


