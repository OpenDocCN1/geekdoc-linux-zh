    \n# HASHCAT 键盘路径行走密码词表\n\nHashcat 的键盘路径行走工具“KwProcessor”能够基于键盘路径行走技术快速轻松地生成密码列表。许多用户使用键盘路径风格的密码。在本节中，我们将简要介绍如何使用该工具。\n\
    \n## 简介\n\n键盘路径行走密码在许多组织中很流行，尤其是政府机构。它们使用起来相当简单且易于记忆。基本上，你从键盘上的某个特定键开始，然后选择一个方向（或多个方向）并开始按键。当你在键盘上“行走”时，你的密码随之输入。\n\
    \n你可以通过使用 Shift 键并在模式中包含数字来创建复杂的密码，如下所示：\n\n![](img/4a03f08556c51a14a3b88fe549a54ca8_72_0.png)\n\
    \n从字母 “z” 开始，我们向左上移动，按下 “a”、“q” 和 “1” 键。然后我们向右移动一行，按下数字 “2”，接着向右下移动回到键盘下方，按下 “w”\
    \ 键并停在 “s” 上。这将创建密码 “zaq12ws”。如果我们交替使用 Shift 键，我们会得到密码 “ZaQ1@WS”，这稍微复杂一些。\n\n\
    键盘路径行走之所以成功（直到目前为止）是因为攻击者需要知道起始键、方向、方向变化（如果有）、是否使用了特殊键以及何时使用，当然还有结束键。Hashcat 的\
    \ KwProcessor 工具使创建键盘路径行走词表变得非常容易。\n\n## 安装 KWPROCESSOR (KWP)\n\n与 Hashcat utils\
    \ 一样，kwp 是从 hashcat 下载的可选项。只需下载最新版本，或者你可以从源代码构建。下载最新版本是最佳选择，因为它已经几年没有更新了。\n\n\
    - 下载最新版本 - [https://github.com/hashcat/kwprocessor/releases](https://github.com/hashcat/kwprocessor/releases)\n\
    - 解压文件\n- 使用 \"`./kwp`\" 运行程序\n\n## 键盘布局和路径\n\n要破解键盘路径行走密码，你需要两样东西：键盘按键的布局以及生成词表所需的一组路径。在\
    \ kwp 程序目录中，你会找到 *“keymaps”* 和 *“routes”* 文件夹：\n\n```\n(kali@kali):~/kwprocessor\
    \ $ ls\nbasechars  doc  keymaps  kwp  kwp32.exe  kwp64.exe  routes\n```\n\nKeymaps\
    \ 文件夹包含多种语言的键盘布局：\n\n```\n(kali@kali):~/kwprocessor/keymaps $ ls\nde.keymap en.keymap\
    \ es.keymap fr.keymap ru.keymap\n(kali@kali):~/kwprocessor/keymaps $ cat en.keymap\n\
    1234567890-\nqwer tyuiop[]\\\nasdfghjkl;'\nzxcvbnm,./\n~!@#$%^&*() +\nQWERTYUIOP{}]\n\
    ASDFGHJKL:\"\\\nZXCVBNM<>?\n```\n\nroutes 文件夹包含 7 个预配置的键盘路径行走或路径，可用于生成密码：\n\n\
    ```\n(kali@kali):~/kwprocessor/routes $ ls\n2-to-10-max-2-direction-changes-combinator.route\n\
    2-to-10-max-3-direction-changes.route\n2-to-16-max-3-direction-changes.route\n\
    2-to-16-max-4-direction-changes.route\n2-to-32-max-5-direction-changes.route\n\
    2-to-4-exhaustive-prince.route\n4-to-4-exhaustive.route\n```\n\n我们可以使用这些预配置的路径，或者使用命令行开关创建自己的路径。\n\
    \n输入 *“./kwp --help”* 以查看可用选项：\n\n```\n[kali@kali :~/kwprocessor]_\n$ ./kwp --help\n\
    Advanced keyboard-walk generator with configurable basechars, keymap\n\nUsage:\
    \ ./kwp [options]... basechars-file keymap-file routes-file\n\nOptions Short /\
    \ Long                | Type  | Description\n====================================+=======+================================\n\
    -V, --version                       |       | Print version\n-h, --help      \
    \                    |       | Print help\n-O, --output-file                 \
    \  | FILE  | Output-file\n-b, --keyboard-basic                | BOOL  | Include\
    \ characters reachable wit\n-S, --keyboard-shift                | BOOL  | Include\
    \ characters reachable by\n-a, --keyboard-altgr                | BOOL  | Include\
    \ characters reachable by\n-Z, --keyboard-all                  |       | Shortcut\
    \ to enable all --keyboar\n-1, --keywalk-south-west            | BOOL  | Include\
    \ routes heading diagonale\n```\n\n## 创建 KWP 词表\n\n要创建一个简单的 kwp 词表，我们将使用英文键盘布局和“2-10\
    \ 最大 3 方向变化”路径文件，如下所示：\n\n```\n$ ./kwp basechars/full.base keymaps/en.keymap routes/2-to-10-max-3-directional-changes.route\n\
    ```\n\n这会导致 kwp 创建多个键盘路径行走组合，长度为 2-11 个字符，最大方向变化次数为 3：\n\n```\nbvbnm,..;p0\ncxcvbnm,ki8\n\
    vcvbnm,.lo9\nxzcvcbnm]u7\n-[poiuytrf\n@poiuytred\n8iuytrewqa\n9oiuytrews\n=][poiuytg\n\
    i';lkjhgf v\nikjhgfdsaz\nolkjhgfd sx\np;lkjhgf dc\n```\n\n命令的输出直接发送到屏幕，因此要创建输出文件，你需要将命令输出到文本文件：\n\
    \n```\n$ ./kwp basechars/full.base keymaps/en.keymap routes/2-to-10-max-3-directional-changes.route\
    \ > basic kwp.txt\n```\n\n然后，你可以将生成的文本文件作为词表用于 Hashcat。\n要创建更复杂的词表，使用较大的路径文件之一：\n\
    \n```\n$ ./kwp basechars/full.base keymaps/en.keymap routes/2-to-16-max-3-directional-changes.route\
    \ > largekwp.txt\n```\n\n```\nqwertyuiop[|pop| \n-=0987654321qazaq\n1234567890-=098i\
    \ \n'1234567890-0987u \nqwertyuiop[|poik \n-0987654321 1234r\n-=09876543212345t\
    \ \n]|poiuytrewqwertg\n-0987654321 12343 \n-=098765432123454 \n]|poiuytrewqwertr\n\
    1234567890-=0989\n```\n\n## 外语键盘行走\n\n如果你需要破解外语键盘行走，只需使用外语键盘布局文件之一。\n因此，要创建一个俄语键盘行走词表：\n\
    \n```\n./kwp basechars/full.base keymaps/ru.keymap routes/2-to-16-max-3-direction-changes.route\
    \ > rukwp.txt\n```\n\n生成的文件如下：\n\n![](img/4a03f08556c51a14a3b88fe549a54ca8_79_0.png)\n\
    \n如果我们的密码哈希列表包含生成的任何单词，它就会破解它们。\nHashcat KWP 工具非常适合快速创建键盘路径行走词表。更改键盘语言也很简单，这在破解国际密码时可能会派上用场。如果你想了解更多关于\
    \ KWP 的信息，请访问 Hashcat GitHub 页面 - https://github.com/hashcat/kwprocessor\n\n#\
    \ 词表总结\n\n在本章中，我们介绍了词表，如何查找词表，或者如何创建自己的词表。词表是密码破解的重要组成部分，因此掌握使用词表的技巧是很好的。你遇到的大多数现代密码通常都是名字、数字和符号的组合。我在破解密码时大量使用\
    \ Ignis 列表。我使用 Hashcat Combinator 工具来组合较小的 Ignis 列表。\n我广泛使用的其他词表是 Facebook 名字和姓氏列表。这些是来自\
    \ Facebook 数据泄露的用户名词表。这两个列表对于使用 Combinator 工具来说相当大，但它们与较小的 Ignis 列表或数字列表组合使用也非常有效。\n\
    \n在我们继续介绍如何使用词表结合破解工具来破解哈希之前，理解什么是哈希以及存在哪些不同类型的哈希非常重要。我们将在下一章中讨论这些内容！\n\n"
