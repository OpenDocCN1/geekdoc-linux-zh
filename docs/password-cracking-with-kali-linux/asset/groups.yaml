    multiple authentication types to protect accounts. As once passwords are cracked,
    they could be used to automatically attack services and systems network wide.
    We only covered cracking the Linux passwords using John the Ripper, you can also
    crack Linux passwords using Hashcat. City College of San Francisco Professor Sam
    Bowne has written up a nice tutorial on doing this on his website${ }^{1}$. Professor
    Bowne is a great conference presenter and there is a lot of additional information
    and tutorials on his site that are extremely helpful to those new to the field.'
