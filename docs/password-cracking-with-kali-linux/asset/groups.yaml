    February\nSeptember\nAugust\nrelease\nCybersecurity\n```\n\nCeWL crawls the target\
    \ website and creates a wordlist with the terms that meet our criteria. The resultant\
    \ text file might need to be cleaned up a bit before use, but this is a very useful\
    \ tool.\n\n# CRUNCH\n\n**Tool Authors:** Mimayin, Bofh28\n\n**Tool Website:**\
    \ [https://sourceforge.net/projects/crunch-wordlist/](https://sourceforge.net/projects/crunch-wordlist/)\n\
    \nCrunch is a great program that allows you to create your own custom password\
    \ lists. Simple tell crunch what you want, the length and complexity, and Crunch\
    \ makes it for you.\n\n```\n(kali@kali)-[~]\n$ crunch -h\ncrunch version 3.6\n\
    \nCrunch can create a wordlist based on criteria you specify.\nThe output from\
    \ crunch can be sent to the screen, file, or\nto another program.\n\nUsage: crunch\
    \ <min> <max> [options]\nwhere min and max are numbers\n\nPlease refer to the\
    \ man page for instructions and examples on how to use crunch.\n```\n\nThe Crunch\
    \ manual page (in a Kali terminal, enter `man crunch`) contains complete instructions\
    \ and examples on how to use the tool. Basically, all we need to tell crunch is\
    \ the minimum and maximum length of the words, what type of characters to use,\
    \ and Crunch does the rest. Crunch makes heavy use of the *charset.lst* file that\
    \ is located in its install directory - “/etc/share/crunch”. So, you will need\
    \ to either run crunch from that directory or point to the directory with the\
    \ “-f” switch when using the more advanced character sets (shown below).\n\nAlright,\
    \ let’s start with an easy one:\n\n> At a terminal prompt, type, `crunch 1 3 -o\
    \ threeletters.txt`\n\nThis tells crunch to start with a single letter (**1**)\
    \ and finish with three (**3**), it then saves the output (**-O**) as “threeletters.txt”.\
    \ Basically, crunch starts out with a single letter “a” and cycles through all\
    \ permutations until it gets to “zzz”.\n\nWill produce something like this:\n\n\
    - a, b, c, d, e, f, g, h, i, j, etc...\n- aa, ab, ac, ad, ae, af, ag, ah, ai,\
    \ aj, etc...\n- aaa, aab, aac, aad, aae, aaf, aag, aah, aai, aaj, etc...\n\nIf\
    \ we play around with the options, we can create more complex lists.\n\n- Enter,\
    \ “crunch 3 4 abcde1234 -o alphanumeric.txt” as seen below:\n\n![](img/4a03f08556c51a14a3b88fe549a54ca8_59_0.png)\n\
    \nThis command creates a wordlist that starts with 3 characters (aaa) and ends\
    \ with four (4444) using alpha/ numeric combinations using ‘abcde1234’. This produces\
    \ a text file with strings like:\n\n- aa1, bb3, ec4, 2a21, and e3da\n\n# CRUNCH\
    \ - USING THE CHARSET.LST FILE\n\nCrunch’s Charset.lst file contains a list of\
    \ keywords that are pre-defined as alphanumeric or symbol strings. We can use\
    \ these keywords so we don’t have to manually type in the characters that we want\
    \ to use. The file is located in the `/usr/share/crunch` directory. If we view\
    \ the file, we can see what keyword sets are available:\n\n- ➤ `cd /usr/share/crunch`\
    \ \n- ➤ `cat charset.lst`\n\n![](img/4a03f08556c51a14a3b88fe549a54ca8_60_0.png)\n\
    \nWe can use any of the defined sets, for example:\n\n- ➤ `sudo crunch 2 4 -f\
    \ charset.lst mixalpha-numeric-all -o mixedall.txt`\n"
  mdcn: "\n## 用于目录路径或服务器暴力破解的词库\n\n当然，词库的用途不仅仅局限于密码破解。许多安全工具使用词库进行网页或目录路径枚举。这些工具并不是在破解密码，而是使用词库自动搜索服务器上的目录或文件。这些列表包含诸如常见的控制面板和配置文件名称以及\
    \ Web 服务器数据路径等内容。\n\n- [SecLists 仓库](https://github.com/danielmiessler/SecLists)\n\
    - [jhaddix 的 Gist](https://gist.github.com/jhaddix)\n- [Assetnote 词库](https://wordlists.assetnote.io/)\n\
    \n当你下载词库时，通常会有很多重复的单词，或者词库中包含大量无用的信息。以下是一个清理词库中无用或随机杂乱数据的工具：\n\n- [SecUtils -\
    \ Clean Wordlist](https://github.com/BonJarber/SecUtils)（尽管我不同意将某些符号归类为“噪音”单词）\n\
    \n## KALI 自带的词库\n\nKali 附带了一些你可以使用的词库；问题只是找到它们。大多数词库位于使用它们的主程序目录中。在较新版本的 Kali\
    \ 中，其他词库的快捷链接存储在 \"/usr/share/wordlists\" 目录中。你还可以使用 Kali Linux 菜单中的 “05 - password\
    \ Attacks > Wordlists” 选项作为该目录的快捷方式。\n\n```\n(kali@kali)~$ wordlists\n> wordlists\
    \ ~ Contains the rockyou wordlist\n/usr/share/wordlists\n|--dirb\n|~~dirbuster\n\
    |~~fasttrack.txt\n|~~fern-wifi\n|~~metasploit\n|~~nmap.lst\n|~~rockyou.txt.gz\n\
    |--wfuzz\n```\n\n### Rock You 词库\n\n在破解过程中最流行的词库之一是“Rock You”词库。这是一个大型集合，包含数百万个实际被使用并从数据库转储中提取出来的密码。\n\
    \n该文件位于 Kali Linux 的 \"/usr/share/wordlists/\" 目录中，如下所示：\n\n```\n(kali@kali)-[/usr/share/wordlists]$\
    \ ls\ndirb        fasttrack.txt    metasploit     rockyou.txt.gz\ndirbuster  \
    \  fern-wifi        nmap.lst       wfuzz\n```\n\n如果你注意到，Rockyou 词库是压缩的，最新版本的 Kali\
    \ 会询问你是否要解压它，或者你可以手动操作：\n\n```\n(kali@kali)~/usr/share/wordlists $\n$ sudo gunzip\
    \ rockyou.txt.gz\n[sudo] password for kali:\n\n(kali@kali)~/usr/share/wordlists\
    \ $\n$ ls\ndirb\t\tfstrack.txt\tmetasploit\trockyou.txt\ndirbuster\tfern-wifi\t\
    nmap.lst\twfuzz\n```\n\n如果你愿意，可以使用 \"cat\" 命令查看该文件，但它对于终端查看来说相当大。\n\n## JOHN THE\
    \ RIPPER 词库\n\n一直受欢迎的密码破解工具 John the Ripper 附带了一个相对较小的密码列表，但它确实包含了网络上使用最广泛的一些密码。\n\
    \n- 该文件位于 `/usr/share/john/` 目录中，如下所示：\n\n```\n(kali@kali)~/usr/share/john $\n\
    $ ls *.lst\npassword.lst\n```\n\n## WFUZZ 词库\n\nWfuzz 是一个网站暴力攻击工具。虽然并非所有词库都有用，但有些很有趣，尤其是“general”目录下的那些。\n\
    \n- 这些文件位于 `/usr/share/wfuzz/wordlist` 目录中，如下所示：\n\n```\n(kali@kali)~/usr/share/wfuzz/wordlist\
    \ $\n$ ls\ngeneral\tInjections\tothers\tstress\tvulns\twebservices\n```\n\n##\
    \ 附加词库\n\n正如我之前提到的，在 `/usr/share/` 目录中还有其他几个带有词库的程序。尽管 “RockYou.txt” 可能是内置词库中最好的之一。如果你想尝试额外的词库，只需在\
    \ `/usr/share/` 目录中到处看看，看看你能找到什么。\n\n## 词库生成工具\n\n下载现成的词库并不是你唯一的选项。Kali 中有几个工具允许你制作自己的个性化词库。CeWL\
    \ 相当有用，因为它允许你通过从目标网站抓取信息来创建密码。Crunch 也很好，因为它允许你从头开始创建自己的自定义词库。让我们更仔细地看看如何使用这些工具。\n\
    \n# CEWL\n\n**工具作者**：Robin Wood\n\n**工具网站**：https://digi.ninja/projects/cewl.php\n\
    \n![](img/4a03f08556c51a14a3b88fe549a54ca8_56_0.png)\n\nCeWL 是一个创建公司相关或基于主题词库的绝佳工具。很多时候，用户会使用与其工作地点或工作内容相关的单词来创建密码。CeWL\
    \ 爬取目标网站并使用在网站上发现的单词构建自定义词库文件。\n\n- CeWL 不再默认安装，但只需输入 `cewl` 即可安装。\n\n要使用 CeWL，请提供你需要的选项和目标\
    \ URL。例如，如果我们想要爬取网站 \"cyberarms.wordpress.com\"，深度为 1 层 (-d 1)，提取任何 6 个字符或更长的单词\
    \ (-m 6)，并将其保存为 \"cyberarms.txt\"，我们将使用以下命令：\n\n```bash\ncewl -w cyberarms.txt\
    \ -d 1 -m 6 https://cyberarms.wordpress.com/\n```\n\n```\n(kali@kali)-[~]~~\n\
    $ cewl -w cyberarms.txt -d 1 -m 6 https://cyberarms.wordpress.com/\nCeWL 5.4.8\
    \ (Inclusion) Robin Wood (robin@digil ninja) (https://digi.ni\n(kali@kali)-[~]~~\n\
    $ cat cyberarms.txt\nSecurity\nComputer\ncontent\nJanuary\nDecember\nOctober\n\
    February\nSeptember\nAugust\nrelease\nCybersecurity\n```\n\nCeWL 爬取目标网站并创建包含符合我们条件的术语的词库。生成的文本文件在使用前可能需要稍微清理一下，但这是一个非常有用的工具。\n\
    \n# CRUNCH\n\n**工具作者：** Mimayin, Bofh28\n\n**工具网站：** [Crunch Wordlist 项目](https://sourceforge.net/projects/crunch-wordlist/)\n\
    \nCrunch 是一个很好的程序，允许你创建自己的自定义密码列表。只需告诉 Crunch 你想要什么，比如长度和复杂度，Crunch 就会为你生成。\n\n\
    ```\n(kali@kali)-[~]\n$ crunch -h\ncrunch version 3.6\n\nCrunch can create a wordlist\
    \ based on criteria you specify.\nThe output from crunch can be sent to the screen,\
    \ file, or\nto another program.\n\nUsage: crunch <min> <max> [options]\nwhere\
    \ min and max are numbers\n\nPlease refer to the man page for instructions and\
    \ examples on how to use crunch.\n```\n\nCrunch 的手册页（在 Kali 终端中输入 `man crunch`）包含了关于如何使用该工具的完整说明和示例。基本上，我们只需告诉\
    \ Crunch 单词的最小和最大长度、要使用什么类型的字符，Crunch 就会完成剩下的工作。Crunch 大量使用位于其安装目录 - “/etc/share/crunch”\
    \ 中的 *charset.lst* 文件。因此，当你使用更高级的字符集（如下所示）时，你需要从该目录运行 crunch，或者在使用 “-f” 开关时指向该目录。\n\
    \n好吧，让我们从一个简单的例子开始：\n\n> 在终端提示符下，输入，`crunch 1 3 -o threeletters.txt`\n\n这告诉 Crunch\
    \ 从单个字母 (**1**) 开始，结束于三个字母 (**3**)，然后它将输出 (**-O**) 保存为 “threeletters.txt”。基本上，Crunch\
    \ 从单个字母 “a” 开始，循环遍历所有排列，直到到达 “zzz”。\n\n它将产生类似以下内容：\n\n- a, b, c, d, e, f, g, h,\
    \ i, j, 等等...\n- aa, ab, ac, ad, ae, af, ag, ah, ai, aj, 等等...\n- aaa, aab, aac,\
    \ aad, aae, aaf, aag, aah, aai, aaj, 等等...\n\n如果我们调整选项，我们可以创建更复杂的列表。\n\n- 输入 “crunch\
    \ 3 4 abcde1234 -o alphanumeric.txt”，如下所示：\n\n![](img/4a03f08556c51a14a3b88fe549a54ca8_59_0.png)\n\
    \n该命令使用 'abcde1234' 的字母/数字组合创建一个词库，从 3 个字符 (aaa) 开始，到 4 个字符 (4444) 结束。这将生成一个包含如下字符串的文本文件：\n\
    \n- aa1, bb3, ec4, 2a21, 和 e3da\n\n# CRUNCH - 使用 CHARSET.LST 文件\n\nCrunch 的 Charset.lst\
    \ 文件包含预定义为字母数字或符号字符串的关键字列表。我们可以使用这些关键字，这样就不必手动输入我们要使用的字符。该文件位于 `/usr/share/crunch`\
    \ 目录中。如果我们查看该文件，我们可以看到可用的关键字集：\n\n- ➤ `cd /usr/share/crunch` \n- ➤ `cat charset.lst`\n\
    \n![](img/4a03f08556c51a14a3b88fe549a54ca8_60_0.png)\n\n我们可以使用任何已定义的集合，例如：\n\n\
    - ➤ `sudo crunch 2 4 -f charset.lst mixalpha-numeric-all -o mixedall.txt`\n\n"
