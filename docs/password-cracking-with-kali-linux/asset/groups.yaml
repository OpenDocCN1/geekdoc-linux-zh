    Security Testing with Kali Linux”和“Security Testing with Raspberry Pi, 2nd Edition”*


    在本章中，我们将介绍本书的实验环境搭建。我基本上使用了与之前所有书籍中相同的实验环境类型——在单个主机系统上构建完整的虚拟实验环境，并在需要时配备几台可选系统。正如介绍中所述，我希望保持这种设置的简单性和低成本。使用虚拟机（VM）设置我们的测试实验室使得使用
    Kali 学习进攻性计算机安全测试变得非常容易。


    虚拟机使得在单台计算机上运行多个操作系统成为可能。这样，我们就不需要满屋子的计算机来设置测试和学习环境了。我们只需要一台性能足够强大的机器，能够同时运行多个虚拟机会话。此外，这样也避免了每月“云访问”费用，这些费用可能会阻碍一些学生访问或使用它们。如果您是讲师，可以根据您认为适合学生的任何方式修改布局。


    书中的所有实验都是在配备 16 GB 内存的 Windows 11 Professional Core i7-6700 系统上创建的，该系统作为虚拟机主机。它拥有足够的性能，可以毫无问题地运行所有实验操作系统。在有选择的情况下，只要可能，我使用了所有软件的
    64 位版本，尤其是 Kali Linux（Kali Linux 2023 64 位）。如果您有虚拟系统经验，可以使用任何您喜欢的虚拟机软件。但对于本书，我将使用
    VMware Player 作为宿主软件。完成后，我们应该拥有一个小型测试网络，外观类似于下图。


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_190_0.png)


    > **警告** - *由于我们将处理存在漏洞的操作系统，请确保在主机系统和实际互联网之间有一个防火墙路由器（最好是硬件）。切勿将运行易受攻击软件的直接连接到业务网络或拥有实际互联网访问权限的网络。确保实验室与外部攻击隔离是读者的责任。*


    这是一个有意设计得非常简单的实验布局。再次强调，我希望对于无法负担在线云服务的學生来说，尽可能降低成本。您可以基于这个基本设计，根据自己的环境需求将其变得尽可能复杂。如果您想深入了解如何设置多种类型的虚拟实验室，我强烈推荐这本书，“*Building
