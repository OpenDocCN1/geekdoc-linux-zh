    # MIMIKATZ PASS THE HASH

    ATTACKS


    Mimikatz can also perform other attacks like, “Pass the Hash”, Golden Ticket and
    Silver Ticket. These involve using tickets or hashes themselves to gain access.
    Though beyond the scope of this book, I have given a brief description of each
    below.


    +   - **Pass the Hash** - Using the encrypted hash directly for access without
    cracking it.


    +   - **Golden Ticket Attack** - Forge a Kerberos Ticket Granting Ticket (TGT)
    for persistent access.


    +   - **Silver Ticket Attack** - Forge a service ticket for accessing specific
    services.


    See the tool Wiki for more information.'
