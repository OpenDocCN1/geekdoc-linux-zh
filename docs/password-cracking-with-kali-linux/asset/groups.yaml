    # CONCLUSION


    That is all there is too it. Many people think that Linux security is mystical,
    but it is really not that much more difficult to crack Linux passwords. Because
    we had a root shell, we were able to grab the Linux password hashes from the system
    by simply copying & pasting them to our Kali machine. We were then able to use
    John the Ripper to crack them. Once they were cracked Kali has multiple tools
    that could be used to automate password attacks against a target system. Also
    note, the three tools we covered are not the only ones available in Kali.


