  - '[PAGE 102]


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_102_0.png)


    When using Hashcat you need to tell it a few things:


    +   * Type of password hash

    +   * Filename of the file containing the un-cracked hashes

    +   * The Dictionary or Wordlist filename

    +   * The Output filename to store the cracked hashes

    +   * And finally, the attack mode type and switches for any other options you
    want


    The most basic use of Hashcat is to use a single wordlist file.


    # Example:


    ```

    `hashcat --remove -m 0 [Uncracked].txt wordlist.txt -o [Cracked.txt] -O`

    ```


    I always use the "--remove" switch when cracking with Hashcat. This tells Hashcat
    to remove any cracked word from the uncracked wordlist. If you don’t, it will
    keep it in the uncracked wordlist, lengthening cracking times. You must also provide
    Hashcat the correct hash type. The "-m 0" is the hash type that you will be attempting
    to crack. In the example, the "0" specifies that the hashes are MD5. Hashcat is
    able to crack a wide range of hashes. These are listed by using the "hashcat --help"
    command.


    An abbreviated list of supported -m Hash types:'
  - '[PAGE 103]


    ```

    [ Hash modes ] -

    # | Name

    ==================

    900 | MD4

    0 | MD5

    5100 | Hailf MD5

    100 | SHAl

    1300 | SHA2-224

    1400 | SHA2-256

    10800 | SHA2-384

    1700 | SHA2-512

    17300 | SHA3-224

    ```


    The -O at the end tells Hashcat that you don''t need to crack extra-long passwords
    (up to 256 characters!) so it focuses on up to 32-character passwords and runs
    much faster. Yes, there are some very long passwords out there, but mostly just
    in public dumps. The longest hashes I have cracked are well over 100 characters
    - junk text lines from public password dumps.


    > *NOTE: For brevity, "--remove" and "-O" are not shown in most examples*


    Lastly, you can specify which processor to use in your hacking attacks using the
    "-D" switch.


    ```

    # | Device Type

    =================

    1 | CPU

    2 | GPU

    3 | FPGA, DSP, Co-Processor

    ```


    On a workstation using a GeForce card, you would use "-D 2" to specify the card''s
    GPU. If you are using a virtual machine, use the "-D 1" option. Before we start
    cracking, let''s talk about some basic cracking techniques. You can use wordlists,
    wordlists and rules, combine wordlists, brute force and brute force with wordlists.
    We will briefly look at each one.'
  - '[PAGE 104]


    # HASHCAT ATTACK TYPES


    The "-a" option allows you to designate the attack mode type. Hashcat has multiple
    attack modes and you need to specify which one you want to use. The only time
    it is not necessary to use it is if you are doing a Single wordlist or straight
    mode attack.


    The available attack types include:


    +   0 = Straight

    +   1 = Combination

    +   3 = Brute-force

    +   6 = HybrId Wordlist + Mask

    +   7 = HybrId Mask + Wordlist


    Straight: Single wordlist attack. Each word in the wordlist will be used against
    each password hash. You can also use Rules in this mode.


    Combination: Combines words from separate wordlists to create new words on the
    fly.


    Brute-force: Enter your own combination of characters, numbers & symbols or use
    Mask attacks to automated guesses. For example: ?u?l?s?d?a (upper, lower, symbol,
    decimal, all) would attempt to crack passwords like, "Aa!0a" to "Zz!9z" and everything
    in-between. You can also use "?b" for binary (00-ff), this is useful when cracking
    foreign language passwords.


    Hybrid Attacks: Use a wordlist in combination with brute force characters or a
    pre-defined mask. For example, using the Rockyou wordlist with the Mask ?u?l?s?d?a
    would produce hash guess attempts like, "passwordAa!0a" and "monkeyZZ!9z".'
