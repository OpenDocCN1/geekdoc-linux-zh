    # 第 10 章

    ## 防御 Windows 密码攻击


    防御基于 Windows 的密码攻击涉及实施强大的安全措施，例如为服务账户使用复杂且唯一的密码、定期轮换凭证，以及监控网络中的可疑活动。此外，防御者还可以使用诸如
    BloodHound 之类的工具来识别并缓解 Active Directory 中的潜在攻击路径。组织应专注于实施健全的安全措施，例如定期密码轮换、强密码策略以及监控可疑活动，以防御这些攻击。防御措施应始终是优先事项，以保护系统免受此类攻击。


    在 Microsoft 网络中，最好减少或移除对旧版 NTLM 安全协议的依赖，仅使用 Kerberos。我知道说起来容易做起来难，所以我没有将其列入下面的清单中。不过，Microsoft
    计划在不久的将来逐步淘汰 NTLM。读者必须认真检查其网络，确保在禁用之前该协议并非必要。即便如此，防御 Kerberos 攻击也需要结合最佳实践、配置设置和监控策略。


    以下是针对 Windows 密码攻击的一些关键防御措施：


    ### 定期轮换服务账户密码


    频繁更改服务账户密码可以减少攻击者尝试进行 Kerberoasting 攻击时的暴露窗口。


    ### 实施强密码策略


    对所有账户（包括服务账户）实施强密码策略。这包括对长度、复杂性以及定期密码更改的要求。


    ### 使用受管服务账户 (MSAS) 或组受管服务账户 (GMSAS)


    MSA 和 gMSA 会自动管理其密码，从而降低与人工管理的服务账户密码相关的风险。


    ### 限制服务账户权限


    将服务账户（以及所有用户账户）限制在功能所需的最低权限级别。避免分配不必要的权限，以减少服务账户被攻陷后的影响。


    ### 监控异常活动


    实施持续监控和告警，以检测与 Kerberos 身份验证相关的可疑活动。票据请求或使用模式中的异常可能表明正在发生攻击。


    ### 实施 Kerberos 保护 (Kerberos Armoring)


    Kerberos 保护功能在 Windows Server 2012 R2 中引入，通过用用户密码哈希加密 TGT（TGT）来帮助防御 Pass-the-Ticket
    攻击。请确保系统运行的是支持此功能的 Windows Server 版本。


    ### 启用 Kerberos 票据生命周期策略


    配置 Kerberos 票据生命周期策略以限制票据的持续时间，从而在凭证泄露时减少暴露时间。然而，需权衡用户体验，避免频繁重新身份验证。


    ### 监控并保护 KRBTGT 账户


    KRBTGT 账户是高价值目标。定期监控和审计与该账户相关的活动。通过限制仅允许需要访问权限的管理员访问，并使用强且唯一的密码来保护该账户。


    ### 实施凭据保护 (Credential Guard)


    凭据保护功能在 Windows 10 和 Windows Server 2016 及更高版本中可用，通过隔离并在安全环境中保护 Kerberos 票据，帮助保护
    NTLM 哈希并防御 Pass-the-Ticket 攻击。


    ### 使用扩展身份验证保护


    启用扩展身份验证保护 (EPA) 以增强 Windows 安全性，通过添加额外的保护层来防御中间人攻击。


    ### 定期更新和修补系统


    保持操作系统和软件使用最新的安全补丁，以解决已知漏洞。


    ### 教育用户和管理员


    提高用户和管理员对与 NTLM 和 Kerberos 攻击相关的风险的认识。鼓励强密码实践并保持警惕。


    ### 考虑网络分段


    实施网络分段，以在系统被攻陷时限制横向移动。


    虽然本章完全基于 Windows 安全，但许多相同或类似的做法也有助于保护基于 Linux 的网络。通过实施这些防御措施，组织可以显著增强其对密码攻击的抵抗力，并改善整体安全态势。采用整体方法，结合技术手段、用户教育和主动监控，至关重要。


    # 结论


    希望读者能像作者写书时一样享受阅读本书的过程。在安全领域只涵盖一个主题是很困难的，但希望这些信息对您和您的职业生涯有用。如果您喜欢这本书，并希望深入探索攻击性安全，请在亚马逊上查阅我的“Security
    Testing with Kali Linux”系列。如果您有任何问题或反馈，我非常乐意听取。请联系 **cyberarms@live.com**


    祝您生活和事业顺利。


    致以最诚挚的问候，


    *Daniel Dieterle*


