    \ access, many times they are members of the Domain Admin group. The passwords\
    \ don’t get changed often if at all. Also, many times their password is the length\
    \ of the Domain minimum password length. This makes them a prime target for attackers.\n\
    \nKerberos issues these tickets during the authentication process. The TGT is\
    \ obtained during the initial authentication, and it can be used to request service\
    \ tickets for specific services in the network. When a Service Ticket is issued,\
    \ it is encrypted using the service account’s secret key. This is an encrypted\
    \ form that includes information about the ticket, including a timestamp and other\
    \ details.\n\nIn a Kerberoasting Attack the attacker attempts to capture the Service\
    \ tickets for specific services, especially those associated with service accounts.\
    \ These service tickets contain encrypted information"
