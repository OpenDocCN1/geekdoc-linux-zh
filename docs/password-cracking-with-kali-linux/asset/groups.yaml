  - '[PAGE 8]


    CHAPTER 1


    # A Journey into Attacking Password Security


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_8_0.png)


    In an age where our lives are intricately woven into the digital fabric, safeguarding
    personal information is of paramount importance. As security-conscious individuals
    navigating the vast expanse of cyberspace, understanding the significance of cybersecurity
    and the crucial role ethical hacking plays in fortifying virtual boundaries becomes
    essential. This book takes readers on a journey into the realm of authentication
    hacking, with a specific focus on the art and science of password cracking, unveiling
    the layers of security that shield our digital identities.'
  - '[PAGE 9]


    Password cracking, often considered the proverbial skeleton key of cybersecurity,
    is an intriguing area of study that delves into deciphering and exploiting weak
    links in digital defenses. This exploration leads us into the arsenal of password
    cracking tools—sophisticated instruments wielded by Pentesters and Red Teams to
    assess and strengthen digital fortifications, and by attackers seeking unauthorized
    access. Navigating this technological landscape, we will unravel the complexities
    of these tools, demystifying their functionality and shedding light on their applications
    in the realm of cybersecurity.


    As we delve into the intricacies of password cracking, it becomes apparent that
    it is both an art and a science. The process involves understanding encryption
    algorithms, exploiting vulnerabilities, and employing various techniques to unveil
    passwords hidden behind layers of security. This book aims to provide readers
    with a comprehensive understanding of these methodologies, empowering them with
    knowledge that can be used to bolster defenses or assess vulnerabilities.


    Windows, as one of the predominant operating systems shaping the corporate digital
    world, becomes a focal point in our learning adventure. We will begin our journey
    with a look into the intricacies of Windows password security, and the technology
    it uses to create passwords. Understanding the basics of how Windows safeguards
    its users'' credentials is not only valuable knowledge for aspiring Ethical Hackers
    and Pentesters but is also pivotal for anyone in the realm of security seeking
    to fortify their own digital presence in an interconnected world. We will then
    dive deep into the tools, tactics and techniques of breaking this security and
    cracking passwords, opening up the keys to the digital kingdom, and cracking the
    digital fortress.'
  - '[PAGE 10]


    # PRE-REQUISITES AND SCOPE


    This book is geared towards computer security professionals that want to increase
    their skills at cracking passwords. It is also written for the cybersecurity student
    who wants to learn more about password security. The book assumes that the reader
    is already familiar with basic Windows and Linux security topics, and is comfortable
    with using Kali Linux. Though the introduction section on Windows Kerberos theory
    is rather challenging, it is a very complex topic, the rest of the book is written
    so if someone isn''t that familiar with the topic, they can, "learn by doing".
    This book is part of my, "Security Testing with Kali Linux" series. I highly suggest
    the reader be familiar with the topics in both my Basic and Advanced Security
    Testing with Kali Linux books before tackling this one.'
  - '[PAGE 11]


    # # LAB SETUP


    For the lab setup I used Kali Linux 2023, Windows 11, Windows Server 2022, and
    Metasploitable2 in VMWare. The systems were setup so all could communicate together.
    The Windows Server was setup as a Domain Controller and then modified with SecFrame''s
    "Bad Blood" to add thousands of insecure Active Directory Objects. For those who
    have read my other books, this is the exact same lab setup.


    As Bad Blood creates random users and objects every time you run it, you will
    never have the exact same Active Directory environment as the one I use in this
    book. But the concepts and techniques are solid, you should be able to run the
    commands on any current Windows Server lab target system with similar results
    – as long as you have permission to do so.


    I cover creating a testing lab in my Basic Security Testing with Kali Linux book.
    I cover setting up Windows Server 2022 and BadBlood in my Advanced Security Testing
    with Kali Linux book. Just make sure that your systems are secured from outside
    access, are in a standalone and firewalled system, and do not have access to production
    systems as they will be vulerable.


    +   - VMWare Workstation Player -

    +       https://www.vmware.com/products/workstation-player.html

    +   - Kali Virtual Machine Download -

    +       https://www.kali.org/get-kali/#kali-virtual-machines

    +   - Metasploitable2 Download -

    +       https://sourceforge.net/projects/metasploitable/

    +   - Windows 11 Eval VM Download -

    +       https://developer.microsoft.com/en-us/windows/downloads/virtual-machines/'
