    ## RULES AND MASK FILES


    ### Rule based attacks


    Mentioned briefly before, rule-based attacks can be very useful. Hashcat has a
    list of built-in rules that you can use to crack passwords. You can find them
    in the Hashcat "rules" subdirectory. For example, there are "leetspeak" rule sets
    that automatically take each dictionary word and try different leet-speak versions
    of the word, replacing letters with numbers. You can even use a programming type
    language to create your own rulesets.


    ```bash

    [kali@kali]:/usr/share/hashcat/rules$ ls

    best64.rule

    combinator.rule

    d3ad0ne.rule

    dive.rule

    generated.rule

    generated2.rule

    hybrid

    Incisive-leetspeak.rule

    InsidePro-HashManager.rule

    InsidePro-PasswordsPro.rule

    leetspeak.rule

    oscommerce.rule

    rockyou-30000.rule

    specific.rule

    T0X1C_3_rule.rule

    ```


    Rule based attacks are used in single attack mode. They are enabled by using the
    `-r` switch and the name of the ruleset you want:


    ```bash

    [kali@kali]:/usr/share/hashcat/rules$ hashcat -m 1000 ~/Hardhash.txt ~/rockyou.txt
    -r leetspeak.rule -o ~/cracked3.txt

    hashcat (v6.2.6) starting


    OpenCL API (OpenCL 3.0 PoCL 3.1+debian Linux, None+Asserts, RELOC, SPIR, LLVM
    14.0.6,

    * Device #1: pthread-sandybridge-Intel(R) Core(TM) i7-6700 CPU @ 3.40GHz, 1435/2935
    MB


    Minimum password length supported by kernel: 0

    Maximum password length supported by kernel: 256


    Hashes: 5 digests; 5 unique digests, 1 unique salts

    Bitmaps: 16 bits, 65536 entries, 0x0000ffff mask, 262144 bytes, 5/13 rotates

    Rules: 17

    ```


    The Best64, InsidePro, Dive, Rockyou-30000 & d3ad0ne rules are some of the more
    popular ones and are very effective. My best advice for rules is to start with
    the smaller rule files (look at their file size) and then move on to the larger
    ones. The smaller ones usually run fairly quick; the larger ones can take significantly
    longer to run. You can also use multiple dictionaries at once by just listing
    your dictionary folder instead of listing an individual dictionary file name.
    Hashcat will then run through every wordlist in the dictionary folder.


    You can run several small rules at once by adding multiple `-r` lines to the Hashcat
    command. This comes in very handy with the "hybrid" rules. Adding two Hybrid rules
    to an attack will attempt to add letters, numbers, or symbols to both the beginning
    and end of the wordlist word.


    Example:


    ```bash

    hashcat -D 1 -m 1000 Hardhash.txt rockyou.txt -o Hardcracked.txt -r hybrid/append_ldus.rule
    -r hybrid/prepend_ldus.rule --remove

    ```


