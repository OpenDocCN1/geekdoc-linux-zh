    If successful (it wasn''t on this domain) it will list the password hashes for
    all potential targets.


    # 4. Offline Cracking


    The attacker can then attempt to crack the service tickets offline using tools
    like Hashcat or John the Ripper to reveal the plaintext password associated with
    the service account.


    # 5. Pass-the-Ticket Attacks (Not Covered)


    In some scenarios, the attacker may use Rubeus for pass-the- ticket attacks, presenting
    the captured ticket to gain unauthorized access to services without the need to
    crack the ticket.


    This was just a very simple overview of one feature of Rubeus. There are many
    more ways that you can use Rubeus to attack Active Directory. For example, you
    can attack specific users or groups by Organizational Unit. See the Tool Wiki
    for more information.'
