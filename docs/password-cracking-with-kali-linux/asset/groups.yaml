  - '[PAGE 62]


    # CRUNCH: CREATING UNICODE WORDLISTS


    Many languages include Extended or Unicode character. We can make a wordlist using
    “Unicode” characters with Crunch. The “mixalpha-space-sv” character set contains
    some of them.


    As seen below:


    ```

    mixalpha-space-sv =

    [abcdefghijklmnopqrstuvwxyzäöäABCD EFGHIJKLMNOPQRSTUVWXYZ

    ÄÖ]

    ```


    We can use this character set to build a wordlist.


    ```

    sudo crunch 3 5 -f charset.lst mixalpha-space-sv -o

    mixedall.txt

    ```


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_62_0.png)


    We now have a mixed character list for password cracking. We could take this and
    combine it with the previous “1 to 5 number” list for a pretty useful combination.
    Or we could use it in a hyrbid attack having Hashcat add the numbers.


    As seen below:


    ```

    hashcat --remove -m 0 uncracked.txt -o cracked.txt -i -a6 mixedall.txt ?d?d?d?d
    -O

    ```'
  - '[PAGE 63]


    We will cover Hashcat in depth in a later chapter. For now, just know that the
    command above would take our newly created wordlist, and add one decimal number
    at a time to the wordlist, incrementally. So, the first attack pass would add
    one number to the end of the wordlist, the second pass would add two numbers to
    the end of the words on the wordlist, etc.


    Using this simple technique, I was able to crack numerous password hashes on an
    uncracked list. It cracked passwords like:


    +   ▷ NMWTÄ,,48

    +   ▷ hÅ«LlLo1995

    +   ▷ ËŸminÄY1311

    +   ▷ NickÅ«2501


    I know the letters look a little different, but this is how Hashcat displays Unicode
    characters. This can come in handy in some situations, but you could accomplish
    a similar effect using rules and combination attacks in the cracking programs.'
  - '[PAGE 64]


    # **CRUNCH - CREATING MORE ADVANCED WORDLISTS**


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_64_0.png)


    We can use multiple character sets when creating words in crunch. Humans are creatures
    of habit and patterns, so you will find patterns when you crack passwords. You
    can create a custom wordlist with crunch using any pattern.


    Simply, list each character set that you want to use, then use the “@,%^” characters
    and create a mask, just like you would with Hashcat. The “@” symbol represents
    characters from the first character set. The “, ” the second, “%” represents the
    third character set, etc. You then use the “-t” pattern switch to build your pattern.'
