    # # HASHCAT UTILS


    Tool GitHub: [https://github.com/hashcat/hashcat-utils](https://github.com/hashcat/hashcat-utils)


    Tool Releases: [https://github.com/hashcat/hashcat-utils/releases](https://github.com/hashcat/hashcat-utils/releases)


    Not too many in the security world know about the Hashcat Utilities. The utilities
    are a separate download from Hashcat and are a great set of resource tools for
    password cracking, and creating wordlists. You can download the Hashcat utilities
    from the tool website, then install by following the instructions provided on
    the site. For example, for a Windows install, you just unzip the latest release
    download and run the .exe you need.


    # ## Prepare Your Source Wordlists


    Gather the wordlists you intend to combine. These can be standard dictionaries,
    common phrases, leaked passwords, or any other relevant sources.


    > > **WARNING:** *Use very small wordlists, as this COULD fill your hard drive
    fast!* *The generated output file is **exponentially** bigger than the input files.*


    # ## Using the Combinator Command:


    The **combinator** command is used to generate wordlist combinations from multiple
    input files. It will produce a single file containing all possible combinations
    of words from the input files. Basic usage:


    ```

    ```

    > combinator [INPUT_FILES] > [OUTPUT_FILE]

    ```

    ```


    For example, to combine the wordlists, **dictionary1.txt** and **dictionary2.txt**,
    you would run:


    ```

    ```

    combinator dictionary1.txt dictionary2.txt > combined_wordlist.txt

    ```

    ```


