    # CRUNCH


    **Tool Authors:** Mimayin, Bofh28


    **Tool Website:** [https://sourceforge.net/projects/crunch-wordlist/](https://sourceforge.net/projects/crunch-wordlist/)


    Crunch is a great program that allows you to create your own custom password lists.
    Simple tell crunch what you want, the length and complexity, and Crunch makes
    it for you.


    ```

    (kali@kali)-[~]

    $ crunch -h

    crunch version 3.6


    Crunch can create a wordlist based on criteria you specify.

    The output from crunch can be sent to the screen, file, or

    to another program.


    Usage: crunch <min> <max> [options]

    where min and max are numbers


    Please refer to the man page for instructions and examples on how to use crunch.

    ```


    The Crunch manual page (in a Kali terminal, enter `man crunch`) contains complete
    instructions and examples on how to use the tool. Basically, all we need to tell
    crunch is the minimum and maximum length of the words, what type of characters
    to use, and Crunch does the rest. Crunch makes heavy use of the *charset.lst*
    file that is located in its install directory - “/etc/share/crunch”. So, you will
    need to either run crunch from that directory or point to the directory with the
    “-f” switch when using the more advanced character sets (shown below).


    Alright, let’s start with an easy one:


    ```

    > At a terminal prompt, type, `crunch 1 3 -o threeletters.txt`

    ```'
  - '[PAGE 59]


    This tells crunch to start with a single letter (**1**) and finish with three
    (**3**), it then saves the output (**-O**) as “threeletters.txt”. Basically, crunch
    starts out with a single letter “a” and cycles through all permutations until
    it gets to “zzz”.


    Will produce something like this:


    +   - a, b, c, d, e, f, g, h, i, j, etc...

    +     - aa, ab, ac, ad, ae, af, ag, ah, ai, aj, etc...

    +     - aaa, aab, aac, aad, aae, aaf, aag, aah, aai, aaj, etc...


    If we play around with the options, we can create more complex lists.


    +   - Enter, “crunch 3 4 abcde1234 -o alphanumeric.txt” as seen below:


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_59_0.png)


    This command creates a wordlist that starts with 3 characters (aaa) and ends with
    four (4444) using alpha/ numeric combinations using ‘abcde1234’. This produces
    a text file with strings like:


    +   - aa1, bb3, ec4, 2a21, and e3da'
  - "[PAGE 60]\n\n# CRUNCH - USING THE CHARSET.LST FILE\n\nCrunch’s Charset.lst file\
    \ contains a list of keywords that are pre-defined as alphanumeric or symbol strings.\
    \ We can use these keywords so we don’t have to manually type in the characters\
    \ that we want to use. The file is located in the `/usr/share/crunch` directory.\
    \ If we view the file, we can see what keyword sets are available:\n\n+   ➤ `cd\
    \ /usr/share/crunch` \n+   ➤ `cat charset.lst`\n\n![](img/4a03f08556c51a14a3b88fe549a54ca8_60_0.png)\n\
    \nWe can use any of the defined sets, for example:\n\n+   ➤ `sudo crunch 2 4 -f\
    \ charset.lst mixalpha-numeric-all -o mixedall.txt`"
