    ![](img/4a03f08556c51a14a3b88fe549a54ca8_141_0.png)


    Part 1 is the username. Part 2 is the encryption type, an encryption type of 1
    means that it is using 128-bit encryption. Part 3 is the salt used for this password
    hash. Lastly, Part 4 is the actual hash.


    Notice the second hash from a newer version of Linux is formatted in the exact
    same way, but it is much longer. This hash is using an encryption type of 6, which
    means that it is using 512-bit encryption, thus the longer hash. This is a much
    stronger encryption, but there is really nothing different we need to do when
    cracking them, as John the Ripper will automatically detect the correct hashing
    algorithm and crack it accordingly.


    When cracking Windows NTLM passwords, you will run into many hashes that are identical,
    because the users used the same password. This is because Windows NTLM hashes
    do not use salts. So, if two or more users use the exact same password in Windows,
    the NTLM password hash will be the same. This is not so in Linux. If users use
    the same password, the salt used will create a different hash for each user. The
    hashes below are from two users (Dan and Alice) who used the password of “password”
    in Kali Linux:


    ![](img/4a03f08556c51a14a3b88fe549a54ca8_141_1.png)'
