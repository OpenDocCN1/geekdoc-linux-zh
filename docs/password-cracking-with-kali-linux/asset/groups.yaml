    # CHAPTER 6


    # Hashcat


    **Tool Authors**: Jens Steube & the Hashcat Development Team

    **Tool Website**: [https://hashcat.net/hashcat/](https://hashcat.net/hashcat/)

    **Tool Wiki**: [https://hashcat.net/wiki/](https://hashcat.net/wiki/)


    Hashcat is an all-purpose password cracker that can run off of your graphics card
    processor (GPU) or your CPU. Hashcat is touted as the world’s fastest and most
    advanced password cracker. The tool is a multi-threaded cracker, if your CPU can
    run multiple threads, it will use them. But the real speed comes into play when
    using the horsepower of a GPU, the processor on your video card. Your GPU is made
    for computational capability, all of this power is used to break passwords. You
    can even harness the power of multiple video card GPUs to create a monster cracking
    station.


    Password cracking is a hobbxy of mine. I have personally used Hashcat to crack
    Hundreds of Millions of passwords over the last 10+ years. I stopped counting
    the different language passwords that I cracked with Hashcat after I hit the forties.
    I have recovered countless real-world passwords with it, and even numerous one
    hundred plus character junk strings packed into public password dumps to make
    them appear larger. I could not recommend a password cracking tool more highly
    than Hashcat. It is fast, efficient and well, amazing!


    Here is an example of some of the real-world passwords I have cracked recently
    using Hashcat:


    ```

    –_+)&#33*;)*LSGMsd34sglIOC55^

    cV1so@7f3*tw9lb_

    spongebobs_only_wifey

    Sahana_forever<3

    ```'
