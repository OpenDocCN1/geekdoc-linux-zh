  md: "```\n```\ndu -sh reports/*\n4.7G  reports/\n$ \n```\n```\n\n# Reuse the Nth\
    \ Word from a Previous Command\n\n```\n```\n$ !!!:N\n$ <event_designator>:<number>\n\
    ```\n```\n\nTo access a word in the previous command use `!!:N` where N is the\
    \ number of the word you wish to retrieve. The first word is 0, the second word\
    \ is 1, etc. You can think of 0 as being the command, 1 as being the first argument\
    \ to the command, 2 as being the second argument, and so on.\n\nYou can use any\
    \ event designator in conjunction with a word designator. In the following example,\
    \ `!!` is the most recent command line: `avconv -i screencast.mp4 podcast.mp3`.\
    \ The `!a` event designator expands to that same command since it’s the most recent\
    \ command that started with the letter “a.”\n\n```\n```\n$ avconv -i screencast.mp4\
    \ podcast.mp3\n$ mv !!:2 converted/\nmv screencast.mp4 converted/\n$ mv !a:3 podcasts/\n\
    mv podcast.mp3 podcasts/\n$ \n```\n```\n\n# Repeat the Previous Command While\
    \ Substituting a String\n\n```\n```\n$ ^<string1>^<string2>^\n```\n```\n\nThis\
    \ little trick is great for quickly correcting typing mistakes. If you omit `^<string2>^`,\
    \ then `<string1>` will be removed from the previous command. By"
