- pgno: 24
  md: '# TEXT PROCESSING AND MANIPULATION


    # Strip out Comments and Blank Lines


    ```

    $ grep -E -v "^#|^$" file

    ```


    To strip out all the noise from a configuration file get rid of the comments and
    blank lines. These two regexes (regular expressions) do the trick. "^#" matches
    all lines that begin with a "#". "^$" matches all blank lines. The -E option to
    grep allows us to use regexes and the -v option inverts the matches.


    ```

    [jason@www conf]$ grep -E -v ''^#|^$'' httpd.conf | head

    ServerTokens OS

    ServerRoot "/etc/httpd"

    PidFile run/httpd.pid

    Timeout 60

    KeepAlive Off

    MaxKeepAliveRequests 100

    KeepAliveTimeout 15

    <IfModule prefork.c>

    ```'
  merge: -1
  img_proc: true
