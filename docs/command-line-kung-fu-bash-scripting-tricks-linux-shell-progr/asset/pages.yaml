    ```


    When I have a long running process that I need to complete on a remote host, I
    always start a screen session before launching that process. I don’t want a blip
    in my network connection to interrupt the work being performed on the remote host.
    Sometimes I launch a process, detach from the session, and reconnect later to
    examine all the output that occurred while I was away.


    First, ssh into the remote host. Next, start a screen session. Start performing
    your work on the remote host. Detach from the screen session by typing ctrl-a
    followed by d. The process you started will still be running in the screen session
    while you’re away. Also, any output generated will be available for you to view
    at a later time.


    ```

    $ ssh remote-host

    $ screen

    $ /usr/local/bin/migrate-db

    Starting DB migration at Sun Apr 13 21:02:50 EDT 2014

    <ctrl-a,d>

    [detached]

    $ exit

    ```


    To reconnect to your screen session, connect to the remote host and type screen
    -r. If there is any output that scrolled past the top of the screen, you can view
    it by typing ctrl-a followed by the escape key. Now use the vi navigation key
    bindings to view the output history. For example, you can type k to move up one
    line or ctrl-b to page up. Once you are finished looking at the output history,
    hit escape to return to the live session. To quit your screen session, type exit.'
  merge: -1
  img_proc: true
