    If you are using an open wireless hotspot and want to ensure your web browsing
    data is encrypted, you can redirect your web browsing traffic through another
    host via SSH. Start ssh with the "-D" option and provide a port to open up on
    your local computer for proxy connections. If you only want to perform the port
    forwarding and not actually log into the shell of the remote host, use the "-N"
    option for ssh. Configure your web browser to use a SOCKS 5 proxy using localhost
    for the host and the port you supplied to ssh.'
