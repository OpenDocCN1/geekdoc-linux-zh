  md: '# # Replace a String in Multiple Files


    ```

    $ find /path -type f -exec sed -i.bak

    ''s/string/replacement/g'' { } \

    ;

    ```


    If you have some information that is embedded in multiple files and you need to
    change it, use the find command in combination with sed. The -i option for sed
    tells it to perform an in-place edit. You can supply an extension to -i to create
    a backup of the file before the edits are made. The command passed to sed tells
    it to substitute "replacement" for "string" globally. A global substitution will
    perform the replacement everywhere. A normal substitution replaces only the first
    occurrence on a line.


    In this example the server that houses software repositories is being replaced.
    With the following one-liner, all occurrences of "thor" are replaced by "loki."


    ```

    $ grep -r thor .

    ./deploy-il.sh:REPO_SERVER="thor.company.com"

    ./deploy-ca.sh:REPO_SERVER="thor.company.com"

    ./deploy-fl.sh:REPO_SERVER="thor.company.com"

    ./deploy-ny.sh:REPO_SERVER="thor.company.com"

    $ find . -type f -exec sed -i.bak ''s/thor/loki/g'' { } \

    ;

    $ grep -r thor .

    ./deploy-fl.sh.bak:REPO_SERVER="thor.company.com"

    ./deploy-il.sh.bak:REPO_SERVER="thor.company.com"

    ./deploy-ny.sh.bak:REPO_SERVER="thor.company.com"

    ./deploy-ca.sh.bak:REPO_SERVER="thor.company.com"

    ```'
  merge: -1
  img_proc: true
