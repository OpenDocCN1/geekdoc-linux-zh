    $ grep cannon /etc/passwd ; ls -ld /home/cannon

    ls: cannot access /home/cannon: No such file or directory

    $ ^cannon~cannon~^&

    grep cannon /etc/passwd ; ls -ld /home/cannon

    cannon:x:1001:1001::/home/cannon:/bin/sh

    drwxr-xr-x 2 cannon ball 4096 Apr  7 00:22 /home/cannon

    ```


    # Reference a Word of the Current Command and Reuse It


    ```

    $ !#:N

    ```


    The \!\#\!" event designator represents the current command line, while the :N
    word designator represents a word on the command line. Word references are zero
    based, so the first word, which is almost always a command, is :0, the second
    word, or first argument to the command, is :1, etc.


    9'
