- pgno: 83
  md: 'To quickly zero out a file you can redirect nothing to it. Why not just delete
    the file and recreate it? If a process has a file open when you delete it, the
    process will keep the file handle open and continue writing to that file. Only
    when the process closes the file handle will the disk space used by that file
    be freed. If an application fills up /var and you delete the open log file, /var
    will still be full. If you redirect nothing to the file, the file is truncated
    and the application can continue writing to the file.


    ```

    $ sudo -s

    # > /var/log/maillog

    # ls -l maillog

    -rw-------. 1 root root 0 Apr 9 18:55 maillog

    ```


    # Append a String to a File


    ```

    $ command >> file

    ```


    The double greater than sign (>>) redirects standard output to a file and appends
    to any existing contents. If no file exists, it creates one.


    ```

    $ echo build new server >> todo.txt

    $ cat todo.txt

    build new server

    $ echo add server to the load balancer >> todo.txt

    $ cat todo.txt

    build new server

    add server to the load balancer

    $

    ```'
