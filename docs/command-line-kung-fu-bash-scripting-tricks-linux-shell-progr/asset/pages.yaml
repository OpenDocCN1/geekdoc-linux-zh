- pgno: 107
  md: 'If you ever need to reboot a server at midnight, but don''t feel like staying
    up that late, schedule it with the at command. Actually you can schedule any command
    or set of commands that you need to run once at a given time with at. To list
    your at jobs use atq. Here''s the reboot example.


    ```

    $ sudo -s

    # echo ''reboot'' | at midnight

    # atq

    1  2014-04-13 00:00 a root

    # exit

    $ exit

    ```


    You can provide at with a series of commands in a file by using the -f option.
    For example, you could send your boss a report at 5:00 PM on Friday and leave
    early to play a round of golf. If your conscience gets the better of you, you
    can delete your at job with atrm.


    ```

    $ at -f email-tps-report-to-boss 5:00pm friday

    job 2 at 2014-04-18 17:00

    $ atrm 2

    $ atq

    $

    ```


