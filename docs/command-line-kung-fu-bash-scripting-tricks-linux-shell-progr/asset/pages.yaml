    # **Grab the Last Word on a Line of Output**


    ```

    ```

    $ awk ''{print $NF}'' file

    $ cat file | awk ''{print $NF}''

    ```

    ```


    You can have awk print fields by using $FIELD_NUMBER notation. To print the first
    field use $1, to print the second use $2, etc. However, if you don''t know the
    number of fields, or don''t care to count them, use $NF which represents the total
    number of fields. Awk separates fields on spaces, but you can use the -F argument
    to change that behavior. Here is how to print all the shells that are in use on
    the system. Use a colon as the field separator and then print the last field.


    ```

