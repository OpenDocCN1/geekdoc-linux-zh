    specify them on the command line with the `-i` option to ssh.


    ```

    $ ssh -i ~/.ssh/id_rsa-db1 db1.example.com

    ```


    If you want to forgo specifying the key each time you can create an entry in your
    `~/.ssh/config` file and specify the key there.


