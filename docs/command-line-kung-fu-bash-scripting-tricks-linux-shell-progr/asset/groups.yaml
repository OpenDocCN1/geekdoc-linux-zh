    ## Create Backups of Files by Date with Ease


    ```

    $ alias d=''date +%F''

    ```


    By using the date format of YYYY-MM-DD for file or directory names, you make ls
    output more human friendly. You can quickly tell the date order of the files when
    using this format.


    ```

    $ ls -l file*

    file.2013-04-08

    file.2013-12-21

    file.2014-04-08

    $ ls -l other-file.*

    other-file.04-08-2013

    other-file.04-08-2014

    other-file.12-21-2013

    ```


    Before making a change to a file I like to make a backup copy of it. I also like
    to know when I made the backup. By creating an alias of "d" which is short for
    the date in YYYY-MM-DD format, I can quickly create these types of backups.


    ```

    $ echo "alias d=''date +%F''" >> ~/.bash_profile

    $ . ~/.bash_profile

    $ d

    2014-04-09

    $ sudo cp httpd.conf httpd.conf.$(d)

    $ sudo cp httpd.conf !#.$(d)

    $ sudo cp httpd.conf{,.${d}}

    $ ls -l httpd.conf*

    httpd.conf

    httpd.conf.2014-04-08

    ```


    ## Overwrite the Contents of a File


    ```

    $ command > file

    ```


    You can redirect output from one command to a file using the greater-than symbol.
    A single greater-than symbol (> ) redirects standard output to a file, overwriting
    (truncating) any existing contents of the file. If no file exists, it creates
    one.


    ```

    $ grep bash /etc/passwd > users-that-use-bash

    $ cat users-that-use-bash

    root:x:0:0:root:/root:/bin/bash

    jason:x:501:501:Jason:/home/jason:/bin/bash

    oracle:x:1006:1006::/home/oracle:/bin/bash

    bob:x:1000:1000:Bob Smith:/home/bob:/bin/bash

    $

    ```


    ## Empty a File That Is Being Written To


    ```

    $ > file

    $ cat /dev/null > file

    ```


    To quickly zero out a file you can redirect nothing to it. Why not just delete
    the file and recreate it? If a process has a file open when you delete it, the
    process will keep the file handle open and continue writing to that file. Only
    when the process closes the file handle will the disk space used by that file
    be freed. If an application fills up /var and you delete the open log file, /var
    will still be full. If you redirect nothing to the file, the file is truncated
    and the application can continue writing to the file.


    ```

    $ sudo -s

    # > /var/log/maillog

    # ls -l maillog

    -rw------- 1 root root 0 Apr 9 18:55 maillog

    ```


    ## Append a String to a File


    ```

    $ command >> file

    ```


    The double greater than sign (>>) redirects standard output to a file and appends
    to any existing contents. If no file exists, it creates one.


    ```

    $ echo build new server >> todo.txt

    $ cat todo.txt

    build new server

    $ echo add server to the load balancer >> todo.txt

    $ cat todo.txt

    build new server

    add server to the load balancer

    $

    ```


