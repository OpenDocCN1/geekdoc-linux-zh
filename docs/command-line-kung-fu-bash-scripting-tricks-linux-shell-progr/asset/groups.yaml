    a privileged port, IE it''s 1024 or lower, doing this requires root privileges.


    ```

    $ sudo python -m SimpleHTTPServer 80

    Serving HTTP on 0.0.0.0 port 80 ...


    ```


    # Mount a Directory from a Remote Server on Your Local Host via SSH


    ```

    $ sshfs remote-host:directory mountpoint

    $ fusermount -u mountpoint


    ```


    Sometimes it''s easier to work on files and directories if they are, or appear
    to be, local to your machine. For example, maybe you have a local application
    that doesn''t exist on the server that you use to manipulate files. Instead of
    downloading the file from the server, modifying it, and uploading it back to the
    server, you can mount the remote directory on your local workstation. Here is
    an example of updating a website over SSH.


    ```

    $ mkdir web-files

    $ sshfs www.example.com:/home/jason/public_html

    $ bluefish web-files/index.html

    $ fusermount -u web-files


    ```


    Just like ssh command, you can use the user@host format if your remote username
    is different from your local username. Also, if no directory is specified after
    the colon, then your home directory is assumed.'
  md: "\n## Using an Editor\n\nIf you need to make a quick note and don't need a full\
    \ blown text editor, you can simply use `cat` and redirect the output to a file.\
    \ Press `<ctrl-d>` when you're finished to create the file.\n\n```\n$ cat > file\n\
    <ctrl-d>\n```\n\nExample:\n\n```\n$ cat > shopping.list\neggs\nbacon\ncoffee\n\
    <ctrl-d>\n$ cat shopping.list\neggs\nbacon\ncoffee\n$\n```\n\n## Display a Block\
    \ of Text between Two Strings\n\nThe `grep` command is great at extracting a single\
    \ line of text. But what if you need to capture an entire block of text? Use `awk`\
    \ and provide it a start and stop pattern. The pattern can simply be a string\
    \ or even a regular expression.\n\n```\n$ awk '/start-pattern/,/stop-pattern/'\
    \ file.txt\n$ command | awk '/start-pattern/,/stop-pattern/'\n```\n\nExample using\
    \ system information:\n\n```\n$ sudo dmidecode | awk /Processor/,/Manuf/\nProcessor\
    \ Information\n\n\tSocket Designation: SOCKET 0\n\tType: Central Processor\n\t\
    Family: Core i5\n\n\tManufacturer: Intel\n```\n\nExample using configuration files:\n\
    \n```\n$ awk '/worker.c/,$/ 'httpd.conf\n<IfModule worker.c>\n\nStartServers\t\
    \t\t4\nMaxClients\t\t\t300\nMinSpareThreads\t\t25\nMaxSpareThreads\t\t75\nThreadsPerChild\t\
    \t25\nMaxRequestsPerChild 0\n</IfModule>\n$\n```\n\n## Delete a Block of Text\
    \ between Two Strings\n\nYou can delete a block of text with the `sed` command\
    \ by providing it a start and stop pattern and telling it to delete that entire\
    \ range. The patterns can be strings or regular expressions. This example deletes\
    \ the first seven lines since `#` matches the first line and `^$` matches the\
    \ seventh line.\n\n```\n$ sed '/start-pattern/,/stop-pattern/d' file\n$ command\
    \ | sed '/start-pattern/,/stop-pattern/d' file\n```\n\nExample:\n\n```\n$ cat\
    \ ports.conf\n# If you just change the port or add more ports here, you will likely\
    \ also\n# have to change the VirtualHost statement in\n# /etc/apache2/sites-enabled/000-default\n\
    # This is also true if you have upgraded from before\n2.2.9-3 (i.e. from\n# Debian\
    \ etch). See /usr/share/doc/apache2.2-\ncommon/NEWS.Debian.gz and\n# README.Debian.gz\n\
    NameVirtualHost *:80\nListen 80\n<IfModule mod_ssl.c>\n    # If you add NameVirtualHost\
    \ *:443 here, you\n    will also have to change\n    # the VirtualHost statement\
    \ in\n    /etc/apache2/sites-available/default-ssl\n    # to <VirtualHost *:443>\n\
    \    # Server Name Indication for SSL named\n    virtual hosts is currently not\n\
    \    # supported by MSIE on Windows XP.\n    Listen 443\n</IfModule>\n<IfModule\
    \ mod_gnutls.c>\n    Listen 443\n</IfModule>\n$ sed '/#/,/^$/d' ports.conf\nNameVirtualHost\
    \ *:80\nListen 80\n<IfModule mod_ssl.c>\n<IfModule mod_gnutls.c>\nListen 443\n\
    </IfModule>\n```\n\n## Fix Common Typos with Aliases\n\nIf you find yourself repeatedly\
    \ making the same typing mistake over and over, fix it with an alias.\n\n```\n\
    $ alias typo='correct spelling'\n```\n\nExample correcting a typo in a command\
    \ name:\n\n```\n$ grep root /etc/passwd\nbash: grep: command not found\n$ echo\
    \ \"alias grep='grep'\" >> ~/.bash_profile\n$ . ~/.bash_profile\n$ grep root /etc/passwd\n\
    root:x:0:0:root:/root:/bin/bash\n$\n```\n\n## Sort the Body of Output While Leaving\
    \ the Header on the First Line Intact\n\nI find myself wanting to sort the output\
    \ of commands that contain headers. After the sort is performed the header ends\
    \ up sorted right along with the rest of the content. This function will keep\
    \ the header line intact and allow sorting of the remaining lines of output. Here\
    \ are some examples to illustrate the usage of this function.\n\nAdd this function\
    \ to your personal initialization files such as `~/.bash_profile`:\n\n```\nbody()\
    \ {\n\tIFS= read -r header\n\tprintf '%s\\n' \"$header\"\n\t\"$@\"\n}\n$ command\
    \ | body sort\n$ cat file | body sort\n```\n\nExamples:\n\n```\n$ df -h | sort\
    \ -k 5\nFilesystem Size Used Avail Use% Mounted on\n/dev/vda2 28G 3.2G 25G 12%\
    \ /\ntmpfs 504M 68K 504M 1% /dev/shm\n/dev/vda1 485M 444M 17M 97% /boot\n```\n\
    \n```\n$ df -h | body sort -k 5\nFilesystem Size Used Avail Use% Mounted on\n\
    /dev/vda2 28G 3.2G 25G 12% /\ntmpfs 504M 68K 504M 1% /dev/shm\n/dev/vda1 485M\
    \ 444M 17M 97% /boot\n```\n\n```\n$ ps -eo pid,%cpu,cmd | head -1\nPID %CPU CMD\n\
    ```\n\n```\n$ ps -eo pid,%cpu,cmd | sort -nrk2 | head\n675 12.5 mysqld\nPID %CPU\
    \ CMD\n994 0.0 /usr/sbin/acpid\n963 0.0 /usr/sbin/modem-manager\n958 0.0 NetworkManager\n\
    946 0.0 dbus-daemon\n934 0.0 /usr/sbin/fcoemon --syslog\n931 0.0 [bnx2fc_thread/0]\n\
    930 0.0 [bnx2fc_12_thread]\n929 0.0 [bnx2fc]\n```\n\n```\n$ ps -eo pid,%cpu,cmd\
    \ | body sort -nrk2 | head\nPID %CPU CMD\n675 12.5 mysqld\n994    0.0 /usr/sbin/acpid\n\
    963    0.0 /usr/sbin/modem-manager\n958    0.0 NetworkManager\n946    0.0 dbus-daemon\n\
    934    0.0 /usr/sbin/fcoemon --syslog\n931    0.0 [bnx2fc_thread/0]\n930    0.0\
    \ [bnx2fc_12_thread]\n929    0.0 [bnx2fc]\n$\n```\n\n## Remove a Character or\
    \ set of Characters from a String or Line of Output\n\nThe `tr` command is typically\
    \ used to translate characters, but with the `-d` option it deletes characters.\
    \ This example shows how to get rid of quotes.\n\n```\n$ command | tr -d \"x\"\
    \n$ command | tr -d {SET}\n$ cat file | tr -d \"X\"\n$ cat file | tr -d {set}\n\
    ```\n\nExample:\n\n```\n$ cat cities.csv\n1,\"Chicago\",\"USA\",\"IL\"\n2,\"Austin\"\
    ,\"USA\",\"TX\"\n3,\"Santa Cruz\",\"USA\",\"CA\"\n```\n\n```\n$ cat cities.csv\
    \ | cut -d, -f2\n\n\"Chicago\"\n\"Austin\"\n\"Santa Cruz\"\n$ cat cities.csv |\
    \ cut -d, -f2 | tr -d ','\n\nChicago\nAustin\nSanta Cruz\n$\n```\n\nYou can also\
    \ let `tr` delete a group of characters. This example removes all the vowels from\
    \ the output.\n\n```\n$ cat cities.csv | cut -d, -f2 | tr -d [aeiou]\n\"Chcgo\"\
    \n\"Astin\"\n\"Snt Crz\"\n$\n```\n\n## Count the Number of Occurrences of a String\n\
    \nThe `uniq` command omits adjacent duplicate lines from files. Since `uniq` doesn't\
    \ examine an entire file or stream of input for unique lines, only unique adjacent\
    \ lines, it is typically preceded by the `sort` command via a pipe. You can have\
    \ the `uniq` command count the unique occurrences of a string by using the `-c`\
    \ option. This comes in useful if you are trying to look through log files for\
    \ occurrences of the same message, PID, status code, username, etc.\n\nLet’s find\
    \ all of the unique HTTP status codes in an apache web server log file named `access.log`.\
    \ To do this, print out the ninth item in the log file with the `awk` command.\n\
    \n```\n$ tail -1 access.log\n18.19.20.21 - - [19/Apr/2014:19:51:20 -0400] \"GET\
    \ /HTTP/1.1\" 200 7136 \"-\" \"Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36\
    \ (KHTML, like Gecko) Chrome/33.0.1750.154 Safari/537.36\"\n$ tail -1 access.log\
    \ | awk '{print $9}'\n200\n$ awk '{print $9}' access.log | sort | uniq\n200\n\
    301\n302\n404\n$\n```\n\nLet’s take it another step forward and count how many\
    \ of each status code we have.\n\n```\n$ awk '{print $9}' access.log | sort |\
    \ uniq -c | sort -nr\n5641 200\n207 301\n86 404\n18 302\n2 304\n```\n\nNow let's\
    \ extract the status code and hour from the `access.log` file and count the unique\
    \ occurrences of those combinations. Next, let's sort them by number of occurrences.\
    \ This will show us the hours during which the website was most active.\n\n```\n\
    $ cat access.log | awk '{print $9, $4}' | cut -c 1-4,18-19 | uniq -c | sort -n\
    \ | tail\n     72 200 09\n     76 200 06\n     81 200 06\n     82 200 06\n   \
    \  83 200 06\n     83 200 06\n     84 200 06\n    109 200 20\n    122 200 20\n\
    \    383 200 10\n```\n\n## NETWORKING AND SSH\n\n## Serve Files in the Current\
    \ Directory via a Web Interface\n\n```\n$ python -m SimpleHTTPServer\n$ python3\
    \ -m http.server\n```\n\nBy default, this command starts a web server and serves\
    \ up the content in the current directory over port 8000. You can change the port\
    \ by specifying it at the end of the line. If no `index.html` file exists in the\
    \ current directory, then the directory listing is shown. Start the web server\
    \ and use a web browser to navigate to it (e.g., `firefox http://localhost:8000`).\n\
    \nThis can come in handy when you are working on HTML content and you want to\
    \ see how it looks in a web browser without installing and configuring a full\
    \ blown web server.\n\n```\n$ python -m SimpleHTTPServer\nServing HTTP on 0.0.0.0\
    \ port 8000 ...\nlocalhost.localdomain -- [06/Apr/2014 21:49:20] \"GET / HTTP/1.1\"\
    \ 200 -\n```\n\nHere's how to start the web server on the standard HTTP port.\
    \ Since port 80 is a privileged port (i.e., it's 1024 or lower), doing this requires\
    \ root privileges.\n\n```\n$ sudo python -m SimpleHTTPServer 80\nServing HTTP\
    \ on 0.0.0.0 port 80 ...\n```\n\n## Mount a Directory from a Remote Server on\
    \ Your Local Host via SSH\n\n```\n$ sshfs remote-host:directory mountpoint\n$\
    \ fusermount -u mountpoint\n```\n\nSometimes it's easier to work on files and\
    \ directories if they are, or appear to be, local to your machine. For example,\
    \ maybe you have a local application that doesn't exist on the server that you\
    \ use to manipulate files. Instead of downloading the file from the server, modifying\
    \ it, and uploading it back to the server, you can mount the remote directory\
    \ on your local workstation. Here is an example of updating a website over SSH.\n\
    \n```\n$ mkdir web-files\n$ sshfs www.example.com:/home/jason/public_html web-files\n\
    $ bluefish web-files/index.html\n$ fusermount -u web-files\n```\n\nJust like the\
    \ `ssh` command, you can use the `user@host` format if your remote username is\
    \ different from your local username. Also, if no directory is specified after\
    \ the colon, then your home directory is assumed.\n"
  mdcn: "\n## 使用编辑器\n\n如果你只需要做简短笔记，而不需要一个功能完整的文本编辑器，那么可以简单地使用 `cat` 并将输出重定向到文件。完成后按\
    \ `<ctrl-d>` 即可创建该文件。\n\n```\n$ cat > file\n<ctrl-d>\n```\n\n示例：\n\n```\n$ cat\
    \ > shopping.list\neggs\nbacon\ncoffee\n<ctrl-d>\n$ cat shopping.list\neggs\n\
    bacon\ncoffee\n$\n```\n\n## 显示两个字符串之间的一段文本\n\n`grep` 命令非常擅长提取单行文本。但如果你需要捕获一整块文本该怎么办？使用\
    \ `awk` 并提供一个起始模式和结束模式。该模式可以是一个简单的字符串，甚至可以是一个正则表达式。\n\n```\n$ awk '/start-pattern/,/stop-pattern/'\
    \ file.txt\n$ command | awk '/start-pattern/,/stop-pattern/'\n```\n\n使用系统信息的示例：\n\
    \n```\n$ sudo dmidecode | awk /Processor/,/Manuf/\nProcessor Information\n\n\t\
    Socket Designation: SOCKET 0\n\tType: Central Processor\n\tFamily: Core i5\n\n\
    \tManufacturer: Intel\n```\n\n使用配置文件的示例：\n\n```\n$ awk '/worker.c/,$/ 'httpd.conf\n\
    <IfModule worker.c>\n\nStartServers\t\t\t4\nMaxClients\t\t\t300\nMinSpareThreads\t\
    \t25\nMaxSpareThreads\t\t75\nThreadsPerChild\t\t25\nMaxRequestsPerChild 0\n</IfModule>\n\
    $\n```\n\n## 删除两个字符串之间的一段文本\n\n你可以使用 `sed` 命令通过提供起始模式和结束模式，并告诉它删除该整个范围来删除一段文本。这些模式可以是字符串或正则表达式。由于\
    \ `#` 匹配第一行，而 `^$` 匹配第七行，此示例删除了前七行。\n\n```\n$ sed '/start-pattern/,/stop-pattern/d'\
    \ file\n$ command | sed '/start-pattern/,/stop-pattern/d' file\n```\n\n示例：\n\n\
    ```\n$ cat ports.conf\n# If you just change the port or add more ports here, you\
    \ will likely also\n# have to change the VirtualHost statement in\n# /etc/apache2/sites-enabled/000-default\n\
    # This is also true if you have upgraded from before\n2.2.9-3 (i.e. from\n# Debian\
    \ etch). See /usr/share/doc/apache2.2-\ncommon/NEWS.Debian.gz and\n# README.Debian.gz\n\
    NameVirtualHost *:80\nListen 80\n<IfModule mod_ssl.c>\n    # If you add NameVirtualHost\
    \ *:443 here, you\n    will also have to change\n    # the VirtualHost statement\
    \ in\n    /etc/apache2/sites-available/default-ssl\n    # to <VirtualHost *:443>\n\
    \    # Server Name Indication for SSL named\n    virtual hosts is currently not\n\
    \    # supported by MSIE on Windows XP.\n    Listen 443\n</IfModule>\n<IfModule\
    \ mod_gnutls.c>\n    Listen 443\n</IfModule>\n$ sed '/#/,/^$/d' ports.conf\nNameVirtualHost\
    \ *:80\nListen 80\n<IfModule mod_ssl.c>\n<IfModule mod_gnutls.c>\nListen 443\n\
    </IfModule>\n```\n\n## 使用别名修复常见拼写错误\n\n如果你发现自己反复犯同样的输入错误，可以通过设置别名来修复它。\n\n```\n\
    $ alias typo='correct spelling'\n```\n\n修正命令名称中拼写错误的示例：\n\n```\n$ grep root /etc/passwd\n\
    bash: grep: command not found\n$ echo \"alias grep='grep'\" >> ~/.bash_profile\n\
    $ . ~/.bash_profile\n$ grep root /etc/passwd\nroot:x:0:0:root:/root:/bin/bash\n\
    $\n```\n\n## 保持输出首行表头不变，同时排序正文内容\n\n我发现自己常常想要对包含表头的命令输出进行排序。排序完成后，表头会随之与其他内容一起被排序。这个函数可以保持表头行不变，并允许对输出中的剩余行进行排序。这里有一些示例来说明该函数的用法。\n\
    \n将此函数添加到你的个人初始化文件（例如 `~/.bash_profile`）中：\n\n```\nbody() {\n\tIFS= read -r header\n\
    \tprintf '%s\\n' \"$header\"\n\t\"$@\"\n}\n$ command | body sort\n$ cat file |\
    \ body sort\n```\n\n示例：\n\n```\n$ df -h | sort -k 5\nFilesystem Size Used Avail\
    \ Use% Mounted on\n/dev/vda2 28G 3.2G 25G 12% /\ntmpfs 504M 68K 504M 1% /dev/shm\n\
    /dev/vda1 485M 444M 17M 97% /boot\n```\n\n```\n$ df -h | body sort -k 5\nFilesystem\
    \ Size Used Avail Use% Mounted on\n/dev/vda2 28G 3.2G 25G 12% /\ntmpfs 504M 68K\
    \ 504M 1% /dev/shm\n/dev/vda1 485M 444M 17M 97% /boot\n```\n\n```\n$ ps -eo pid,%cpu,cmd\
    \ | head -1\nPID %CPU CMD\n```\n\n```\n$ ps -eo pid,%cpu,cmd | sort -nrk2 | head\n\
    675 12.5 mysqld\nPID %CPU CMD\n994 0.0 /usr/sbin/acpid\n963 0.0 /usr/sbin/modem-manager\n\
    958 0.0 NetworkManager\n946 0.0 dbus-daemon\n934 0.0 /usr/sbin/fcoemon --syslog\n\
    931 0.0 [bnx2fc_thread/0]\n930 0.0 [bnx2fc_12_thread]\n929 0.0 [bnx2fc]\n```\n\
    \n```\n$ ps -eo pid,%cpu,cmd | body sort -nrk2 | head\nPID %CPU CMD\n675 12.5\
    \ mysqld\n994    0.0 /usr/sbin/acpid\n963    0.0 /usr/sbin/modem-manager\n958\
    \    0.0 NetworkManager\n946    0.0 dbus-daemon\n934    0.0 /usr/sbin/fcoemon\
    \ --syslog\n931    0.0 [bnx2fc_thread/0]\n930    0.0 [bnx2fc_12_thread]\n929 \
    \   0.0 [bnx2fc]\n$\n```\n\n## 从字符串或输出行中移除一个字符或一组字符\n\n`tr` 命令通常用于转换字符，但使用 `-d`\
    \ 选项时它会删除字符。本示例展示了如何去除引号。\n\n```\n$ command | tr -d \"x\"\n$ command | tr -d {SET}\n\
    $ cat file | tr -d \"X\"\n$ cat file | tr -d {set}\n```\n\n示例：\n\n```\n$ cat cities.csv\n\
    1,\"Chicago\",\"USA\",\"IL\"\n2,\"Austin\",\"USA\",\"TX\"\n3,\"Santa Cruz\",\"\
    USA\",\"CA\"\n```\n\n```\n$ cat cities.csv | cut -d, -f2\n\n\"Chicago\"\n\"Austin\"\
    \n\"Santa Cruz\"\n$ cat cities.csv | cut -d, -f2 | tr -d ','\n\nChicago\nAustin\n\
    Santa Cruz\n$\n```\n\n你还可以让 `tr` 删除一组字符。此示例从输出中移除所有元音字母。\n\n```\n$ cat cities.csv\
    \ | cut -d, -f2 | tr -d [aeiou]\n\"Chcgo\"\n\"Astin\"\n\"Snt Crz\"\n$\n```\n\n\
    ## 统计字符串出现的次数\n\n`uniq` 命令会省略文件中的相邻重复行。由于 `uniq` 并不检查整个文件或输入流以获取唯一行，而是仅处理相邻的唯一行，因此通常由管道接在\
    \ `sort` 命令之后使用。你可以使用 `-c` 选项让 `uniq` 命令统计字符串的唯一出现次数。如果你正在查看日志文件以寻找相同消息、PID、状态码、用户名等的出现次数，这将非常有用。\n\
    \n让我们查找名为 `access.log` 的 Apache 网页服务器日志文件中所有唯一的 HTTP 状态码。为此，使用 `awk` 命令打印日志文件中的第九个字段。\n\
    \n```\n$ tail -1 access.log\n18.19.20.21 - - [19/Apr/2014:19:51:20 -0400] \"GET\
    \ /HTTP/1.1\" 200 7136 \"-\" \"Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36\
    \ (KHTML, like Gecko) Chrome/33.0.1750.154 Safari/537.36\"\n$ tail -1 access.log\
    \ | awk '{print $9}'\n200\n$ awk '{print $9}' access.log | sort | uniq\n200\n\
    301\n302\n404\n$\n```\n\n让我们再进一步，统计每种状态码的数量。\n\n```\n$ awk '{print $9}' access.log\
    \ | sort | uniq -c | sort -nr\n5641 200\n207 301\n86 404\n18 302\n2 304\n```\n\
    \n现在让我们从 `access.log` 文件中提取状态码和小时，并统计这些组合的唯一出现次数。接下来，让我们按出现次数排序。这将显示网站最活跃的小时。\n\
    \n```\n$ cat access.log | awk '{print $9, $4}' | cut -c 1-4,18-19 | uniq -c |\
    \ sort -n | tail\n     72 200 09\n     76 200 06\n     81 200 06\n     82 200\
    \ 06\n     83 200 06\n     83 200 06\n     84 200 06\n    109 200 20\n    122\
    \ 200 20\n    383 200 10\n```\n\n## 网络与 SSH\n\n## 通过 Web 界面提供当前目录中的文件\n\n```\n\
    $ python -m SimpleHTTPServer\n$ python3 -m http.server\n```\n\n默认情况下，此命令启动一个 Web\
    \ 服务器，并通过 8000 端口提供当前目录中的内容。你可以通过在行尾指定端口来更改端口。如果当前目录中不存在 `index.html` 文件，则显示目录列表。启动\
    \ Web 服务器并使用网络浏览器访问它（例如，`firefox http://localhost:8000`）。\n\n当你正在处理 HTML 内容并希望查看其在\
    \ Web 浏览器中的样子，而不必安装和配置一个功能完整的 Web 服务器时，这会非常有用。\n\n```\n$ python -m SimpleHTTPServer\n\
    Serving HTTP on 0.0.0.0 port 8000 ...\nlocalhost.localdomain -- [06/Apr/2014 21:49:20]\
    \ \"GET /HTTP/1.1\" 200 -\n```\n\n以下是如何在标准 HTTP 端口上启动 Web 服务器的方法。由于端口 80 是特权端口（即，1024\
    \ 或更低），因此这样做需要 root 权限。\n\n```\n$ sudo python -m SimpleHTTPServer 80\nServing\
    \ HTTP on 0.0.0.0 port 80 ...\n```\n\n## 通过 SSH 在本地主机上挂载远程服务器的目录\n\n```\n$ sshfs\
    \ remote-host:directory mountpoint\n$ fusermount -u mountpoint\n```\n\n有时，如果文件或目录是本地存在的，或者看起来是本地存在的，工作起来会更容易。例如，也许你有一个本地应用程序，它在你用于操作文件的服务器上不存在。你不需要从服务器下载文件，修改它，然后再将其上传回服务器，而是可以将远程目录挂载到本地工作站上。以下是通过\
    \ SSH 更新网站的示例。\n\n```\n$ mkdir web-files\n$ sshfs www.example.com:/home/jason/public_html\
    \ web-files\n$ bluefish web-files/index.html\n$ fusermount -u web-files\n```\n\
    \n就像 `ssh` 命令一样，如果你的远程用户名与本地用户名不同，你可以使用 `user@host` 格式。此外，如果冒号后未指定目录，则默认使用你的主目录。\n\
