  - "[PAGE 54]\n\n```\nnameserver 8.8.8.8\nnameserver 8.8.4.4\nsearch domain1.com\
    \ domain2.com domain3.com\ndomain4.com domain5.com domain6.com domain7.com\n```\n\
    \nWhen typing \"ssh remote-host\" with the above resolv.conf in place, the resolver\
    \ will attempt to translate remote-host.domain1.com into an IP address. If that\
    \ fails, it will attempt to resolve remote-host.domain2.com, etc. The problem\
    \ with the above resolv.conf is that the search list is limited to just six domains.\
    \ So, remote-host.domain7.com is never attempted. Additionally, the search list\
    \ is limited to 256 characters, regardless the number of domains.\n\nHow can you\
    \ get around the six domain search list limit? If you’re lucky enough to have\
    \ a pattern of hostnames that correlate with domain names, you can configure ssh\
    \ to do the resolution. For example, for FQDNs like \"ny-www1.newyork.company.com\"\
    \ and \"ny-mysql-07.newyork.company.com\" you can create a rule that appends \"\
    newyork.company.com\" to any host that begins with \"ny.\" You’ll also want to\
    \ tell ssh to ignore any hosts that begin with “ny” that already have \"newyork.company.com\"\
    \ appended to them. Here’s an example ~/.ssh/config file that does that.\n\n```\n\
    $ cat ~/.ssh/config\n\nny* !*.newyork.company.com\n      HostName %h.newyork.company.com\n\
    db* !*.databases.company.com\n      HostName %h.databases.company.com\njump* !*.company.com\n\
    \      HostName %h.company.com\n```"
