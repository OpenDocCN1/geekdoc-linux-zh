    active_primary_shards\" : 0,\n  \"active_shards\" : 0,\n  \"relocating_shards\"\
    \ : 0,\n  \"initializing_shards\" : 0,\n  \"unassigned_shards\" : 0\n}\n```\n\n\
    ## 使用 Vim 编辑网络上的文件\n\n```bash\n$ vim scp://remote-host//path/to/file\n$ vim scp://remote-user@remote-host//path/to/file\n\
    ```\n\n如果你想通过 SSH 使用 vim 编辑文件，可以让 vim 负责在本地和远程之间复制文件的重活。\n\n```bash\n$ vim scp://linuxserver//home/jason/notes.txt\n\
    ```\n\n# Shell 脚本\n\n## 在命令行中使用 for 循环\n\n```bash\n$ for VAR in LIST\ndo\n# use\
    \ $VAR\ndone\n```\n\n当你需要对一系列项目执行相同操作时，可以直接在 Shell 中使用 `for` 循环。\n\n```bash\n\
    $ for USER in bob jill fred\ndo\n    sudo passwd -l $USER\n    logger -t naughty-user\
    \ $USER\ndone\n\nLocking password for user bob.\npasswd: Success\nLocking password\
    \ for user jill.\npasswd: Success\nLocking password for user fred.\npasswd: Success\n\
    \n$ sudo tail -3 /var/log/messages\nApr  8 19:29:03 linuxserver naughty-user:\
    \ bob\nApr  8 19:29:03 linuxserver naughty-user: jill\nApr  8 19:29:03 linuxserver\
    \ naughty-user: fred\n```\n\n你也可以将整个循环输入在一行命令中。\n\n```bash\n$ for USER in bob\
    \ jill fred; do sudo passwd -l $USER; logger -t naughty-user $USER; done\n...\n\
    ```\n\n## 命令替换\n\n```bash\n$ VAR=`command`\n$ VAR=$(command)\n```\n\n命令替换有两种形式。第一种形式使用反引号（`）包围命令，第二种形式使用美元符号后跟括号包围命令。两者在功能上是等价的，反引号形式是较旧的样式。命令的输出可以作为另一个命令的参数、用于设置变量，或用于生成\
    \ `for` 循环的参数列表。\n\n```bash\n$ EXT_FILESYSTEMS=$(grep ext /etc/fstab | awk '{print\
    \ $2}')\n$ echo $EXT_FILESYSTEMS\n/\n/boot\n\n$ cp file.txt file.txt.`date +%F`\n\
    $ ls file.txt*\nfile.txt  file.txt.2014-04-08\n\n$ ps -fp $(cat /var/run/ntpd.pid)\n\
    UID          PID  PPID C STIME TTY          TIME\nCMD\nntp        1210     1 0\
    \ Apr06 ?           00:00:05 ntpd -u ntp:ntp -p /var/run/ntpd\n\n$ sudo kill -9\
    \ $(cat /var/run/ntpd.pid)\n\n$ for x in $(cut -d: -f1 /etc/passwd); do groups\
    \ $x; done\njason : jason sales\nbobdjr : sales\njim : jim\n```\n\n## 将命令行输出存储为变量以便稍后使用\n\
    \n```bash\n$ for VAR in LIST\n> do\n> \tVAR2=$(command)\n> \tVAR3=$(command)\n\
    > \techo \"$VAR2 $VAR3\"\n> done\n```\n\n命令替换可用于将值赋值给变量。如果你需要多次重用某个命令的输出，只需将其赋值给一个变量一次，然后重用该变量即可。此示例展示了如何在单个脚本中多次使用\
    \ `id` 命令的输出。\n\n```bash\n$ for USER in $(cut -f1 -d: /etc/passwd)\n> do\n> UID_MIN=$(grep\
    \ ^UID_MIN /etc/login.defs | awk '{print $NF}')\n> USERID=$(id -u $USER)\n> [\
    \ $USERID -lt $UID_MIN ] || (\n>     echo \"Forcing password expiration for $USER\
    \ with UID of $USERID.\"\n>     sudo passwd -e $USER\n> )\n> done\n\nForcing password\
    \ expiration for bob with UID of 1000.\nForcing password expiration for bobdjr\
    \ with UID of 1001.\nForcing password expiration for bobh with UID of 1002.\n\
    ```\n\n## 每次读取一行输入\n\n```bash\n$ while read LINE\n> do\n>\n> # Do something with\
    \ $LINE\n> done < file.txt\n\n$ command | while read LINE\n> do\n>\n> # Do something\
    \ with $LINE\n> done\n```\n\n如果你想遍历单词列表，请使用 `for` 循环。如果你想逐行遍历，请结合使用 `while` 循环、`read`\
    \ 语句和重定向。\n\n让我们查找使用率超过 90% 的文件系统。如果我们尝试使用 `if` 语句，输出会被拆分成单词块，如下所示。\n\n```bash\n\
    $ df | head -1\nFilesystem 1K-blocks Used Available Use% Mounted on\n\n$ for x\
    \ in $(df)\n> do\n> echo $x\n> done\nFilesystem\n1K-blocks\nUsed\nAvailable\n\
    Use%\nMounted\non\n...\n```\n\n我们需要像这样一次读取整行。\n\n```bash\n$ df | while read LINE\n\
    > do\n> echo $LINE\n> done\nFilesystem 1K-blocks Used Available Use% Mounted on\n\
    ...\n```\n\n以下是查找使用率超过 90% 的文件系统的一种方法。\n\n"
