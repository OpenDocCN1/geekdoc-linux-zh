    # View Colorized Output with Less


    ```

    $ ls --color=always | less -R

    $ grep --color=always file | less -R

    ```


    Some linux distributions create aliases for ls and grep with the --color=auto
    option. This causes colors to be used only when the output is going to a terminal.
    When you pipe the output from ls or grep the color codes aren''t emitted. You
    can force color to always be displayed by ls or grep with --color=always. To have
    the less command display the raw control characters that create colors, use the
    -R option.


    ```

    $ grep --color=always -l bob /etc/passwd | less -R

    $ ls -l --color=always /etc | less -R

    ```


    # Preserve Color When Piping to Grep


    ```

    $ ls -l --color=always | grep --color=never string

    ```


    If you pipe colorized input into grep and grep is an alias with the --color=auto
    option, grep will discard the color from the input and highlight the string that
    was grepped for. In order to preserve the colorized input, force grep to not use
    colors with the --color=never option.


    ```

    $ ls -l --color=always *.mp3 | grep --color=never jazz

    ```'
