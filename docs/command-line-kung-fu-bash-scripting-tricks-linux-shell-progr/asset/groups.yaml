  - "[PAGE 97]\n\nshell written by Brian Fox for the GNU Project as a free software\
    \ replacement for the Bourne shell (sh).Bash is a command processor, typically\
    \ run in a text window, allowing the user to type commands which cause actions.\
    \ Bash can also read commands from a file, called a script. Like all Unix shells,\
    \ it supports filename wildcarding, piping, here documents... \nhttp://en.wikipedia.org/wiki/Bash_(Unix_shell)\"\
    \n\nYou can create a small shell script to save yourself from typing the full\
    \ DNS query each time.\n\n```\n$ echo -e '#!/bin/bash\\ndig +short txt ${1}.wp.dg.cx'\
    \ \n> wikidig\n\n$ chmod 755 !$\nchmod 755 wikidig\n\n$ ./wikidig ubuntu_operating_system\n\
    \"Ubuntu As of 2012, according to online surveys, Ubuntu is the most popular Linux\
    \ distribution on desktop/laptop personal computers, and most Ubuntu coverage\
