  - "[PAGE 68]\n\n```\n$ read -n 1 VAR\n$ read -p \"Prompt text\" VAR\n```\n\nTo accept\
    \ user input from a user, use the `read` command. Read will accept an entire line\
    \ of input and store it into a variable. You can force read to only read a limited\
    \ number of characters by using the -n option. Instead of using `echo` statements\
    \ before a `read` command, you can supply a prompt by using the -p option. Here\
    \ is a sample script that uses these techniques.\n\nThe contents of backup.sh:\n\
    \n```\n#!/bin/bash\nwhile true\ndo\n   read -p \"What server would you like to\
    \ backup? \"\n   SERVER\n\n   echo \"Backing up $SERVER\"\n   /usr/local/bin/backup\
    \ $SERVER\n\n   read -p \"Backup another server? (y/n) \" -n 1\n   BACKUP_AGAIN\n\
    \   echo\n   [ \"$BACKUP_AGAIN\" = \"y\" ] || break\ndone\n```\n\n```\n$ ./backup.sh\n\
    What server would you like to backup? thor\nBacking up thor\nBackup another server?\
    \ (y/n) y\n```"
