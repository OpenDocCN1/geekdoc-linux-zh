  md: "\n## Delete Empty Directories\n\nIf you ever find yourself needing to clean\
    \ up empty directories, find can make that task a snap. Use the `-type d` option\
    \ to find all the directories with the `-empty` option to only include empty directories\
    \ and finally the `-delete` option removes the directories.\n\n```bash\n$ mkdir\
    \ -p testing/{1..4}\n$ ls testing/\n1 2 3 4\n$ find . -type d -empty -delete\n\
    $ ls testing/\nls: cannot access testing/: No such file or directory\n$\n```\n\
    \n## Print a List of Files That Contain a Given String\n\nTo get a list of files\
    \ that contain a given string, use `grep` with the `-r` (recursive) and `-l` (list\
    \ files that match) options.\n\n```bash\n$ sudo grep -rl jim /var/log\n/var/log/audit/audit.log.1\n\
    /var/log/secure-20140406\n/var/log/secure\n```\n\n## An Easy-to-Read Recursive\
    \ File Listing\n\nThe `ls` command has a recursive option, but I find reading\
    \ the output from the `find` command to be easier to digest, especially for a\
    \ large number of files and directories. The advantage to using `find` is that\
    \ it displays the full path to each file, unlike `ls`.\n\n```bash\n$ ls -lR Music/\n\
    Music/:\ntotal 4\ndrwxr-xr-x. 2 jason jason 4096 Feb 22 12:40 jazz\nMusic/jazz:\n\
    total 20932\n-rw-r--r--. 1 jason jason       79496 Feb 22 12:40 giant-steps.mp3\n\
    -rw-r--r--. 1 jason jason 21267371 Feb 16 11:12 jazz-album-1.mp3\n-rw-r--r--.\
    \ 1 jason jason       79496 Feb  3 18:13 john-coletrene.mp3\n\n$ find Music/ -type\
    \ f -ls\n397966 20772 -rw-r--r--   1 jason jason 21267371 Feb 16 11:12 Music/jazz/jazz-album-1.mp3\n\
    396787    80 -rw-r--r--   1 jason jason    79496 Feb 22 12:40 Music/jazz/giant-steps.mp3\n\
    132464    80 -rw-r--r--   1 jason jason    79496 Feb  3 18:13 Music/jazz/john-coletrene.mp3\n\
    ```\n\n## View Files and Directories in a Tree Format\n\nThe `tree` command displays\
    \ files and directories in a tree-like format. If you only want to see the directory\
    \ structure, use the `-d` option. To limit the depth of the tree, use the `-L`\
    \ option followed by a number.\n\n```bash\n$ tree Music/\nMusic/\n└── jazz\n \
    \   ├── giant-steps.mp3\n    │\n    ├── jazz-album-1.mp3\n    │\n    └── john-coletrene.mp3\n\
    \n1 directory, 3 files\n\n$ tree -d Music/\nMusic/\n└── jazz\n\n1 directory\n\n\
    $ tree -d /var | head\n/var\n├── account\n├── cache\n│\n└── fontconfig\n    |\n\
    \    └── gdm\n        |\n        ├── adminuser\n        |\n        └── jason\n\
    \n$ tree -dL 1 /var\n/var\n├── account\n├── cache\n├── crash\n├── db\n├── empty\n\
    ├── ftp\n├── games\n├── gd\n├── lib\n├── local\n├── lock\n├── log\n├── mail ->\
    \ spool/mail\n├── nis\n├── opt\n├── preserve\n├── run\n├── spool\n├── tmp\n├──\
    \ www\n└── yp\n$\n```\n\n## Replace a String in Multiple Files\n\nIf you have\
    \ some information that is embedded in multiple files and you need to change it,\
    \ use the `find` command in combination with `sed`. The `-i` option for `sed`\
    \ tells it to perform an in-place edit. You can supply an extension to `-i` to\
    \ create a backup of the file before the edits are made. The command passed to\
    \ `sed` tells it to substitute \"replacement\" for \"string\" globally. A global\
    \ substitution will perform the replacement everywhere. A normal substitution\
    \ replaces only the first occurrence on a line.\n\nIn this example the server\
    \ that houses software repositories is being replaced. With the following one-liner,\
    \ all occurrences of \"thor\" are replaced by \"loki.\"\n\n```bash\n$ grep -r\
    \ thor .\n./deploy-il.sh:REPO_SERVER=\"thor.company.com\"\n./deploy-ca.sh:REPO_SERVER=\"\
    thor.company.com\"\n./deploy-fl.sh:REPO_SERVER=\"thor.company.com\"\n./deploy-ny.sh:REPO_SERVER=\"\
    thor.company.com\"\n\n$ find . -type f -exec sed -i.bak 's/thor/loki/g' { } \\\
    ;\n\n$ grep -r thor .\n./deploy-fl.sh.bak:REPO_SERVER=\"thor.company.com\"\n./deploy-il.sh.bak:REPO_SERVER=\"\
    thor.company.com\"\n./deploy-ny.sh.bak:REPO_SERVER=\"thor.company.com\"\n./deploy-ca.sh.bak:REPO_SERVER=\"\
    thor.company.com\"\n\n$ grep -r loki .\n./deploy-il.sh:REPO_SERVER=\"loki.company.com\"\
    \n./deploy-ca.sh:REPO_SERVER=\"loki.company.com\"\n./deploy-fl.sh:REPO_SERVER=\"\
    loki.company.com\"\n./deploy-ny.sh:REPO_SERVER=\"loki.company.com\"\n$\n```\n\n\
    ## Extract the Nth Line from a File\n\nTo extract a specific line from a file,\
    \ tell `awk` to print the line that matches the line number. One area where this\
    \ comes in helpful is when you encounter an error in a script. To see exactly\
    \ what the script is doing on that line, use `awk`.\n\n```bash\n$ ./deploy.sh\n\
    ./deploy.sh: line 74: /usr/local/bin/patch: No such file or directory\n\n$ awk\
    \ 'NR==74' deploy.sh\n/usr/local/bin/patch $NEW_HOST\n$\n```\n\n## Convert Text\
    \ Files from Windows Format to Linux Format and Vice-Versa\n\nSooner or later\
    \ you're going to be sent a file or download one that uses a pair of CR (carriage\
    \ return) and LF (line feed) characters to terminate lines in the file. Those\
    \ type of files are Windows/DOS formatted. Unix-like operating systems simply\
    \ use the LF character to terminate a line. Sometimes this can cause issues. To\
    \ convert the file to a unix-like format, use `dos2unix`. To examine the line\
    \ termination characters use \"cat -A\" or the \"file\" command.\n\n```bash\n\
    $ cat -A from-my-windows-buddy.pl\n#!/usr/bin/perl^M$\nprint \"This is a cross-platform\
    \ perl script!\\n\"^M$\n\n$ ./from-my-windows-buddy.pl\n-bash: ./from-my-windows-buddy.pl:\
    \ /usr/bin/perl^M: bad interpreter: No such file or directory\n\n$ dos2unix from-my-windows-buddy.pl\n\
    dos2unix: converting file from-my-windows-buddy.pl to UNIX format ...\n\n$ cat\
    \ -A from-my-windows-buddy.pl\n#!/usr/bin/perl$\nprint \"This is a cross-platform\
    \ perl script!\\n\"$\n\n$ ./from-my-windows-buddy.pl\nThis is a cross-platform\
    \ perl script!\n\n$ file other-file.txt\nother-file.txt: ASCII text, with CRLF\
    \ line terminators\n\n$ dos2unix other-file.txt\ndos2unix: converting file other-file.txt\
    \ to UNIX format ...\n\n$ file other-file.txt\nother-file.txt: ASCII text\n```\n\
    \nThe opposite side of this coin is that if you send a file created on a Linux\
    \ host to someone who opens it in Notepad on Windows, they will see just one long\
    \ line of text. Convert the file to Windows/DOS format with the `unix2dos` command.\n\
    \n```bash\n$ file report-for-ceo.txt\nreport-for-ceo.txt: ASCII text\n\n$ unix2dos\
    \ report-for-ceo.txt\nunix2dos: converting file report-for-ceo.txt to DOS format\
    \ ...\n\n$ file report-for-ceo.txt\nreport-for-ceo.txt: ASCII text, with CRLF\
    \ line terminators\n$\n```\n\n## MISCELLANEOUS\n\n### Change to the Previous Working\
    \ Directory\n\nIf you want to return to your previous working directory, use \"\
    cd -\". The OLDPWD environment variable holds the path of your most recent directory\
    \ location. \"cd -\" is the same as \"cd $OLDPWD\".\n\n```bash\n$ cd /etc/httpd/conf.d\n\
    $ grep ^SSLCert ssl.conf\nSSLCertificateFile /etc/pki/tls/certs/localhost.crt\n\
    SSLCertificateKeyFile /etc/pki/tls/private/localhost.key\n\n$ cd /etc/pki/tls/certs/\n\
    $ ls\nca-bundle.crt ca-bundle.trust.crt localhost.crt\nmake-dummy-cert Makefile\
    \ renew-dummy-cert\n\n$ cd -\n/etc/httpd/conf.d\n```\n"
  mdcn: "\n## 删除空目录\n\n如果你需要清理空目录，`find` 命令可以轻松完成这项任务。使用 `-type d` 选项查找所有目录，配合 `-empty`\
    \ 选项仅包含空目录，最后使用 `-delete` 选项删除这些目录。\n\n```bash\n$ mkdir -p testing/{1..4}\n$ ls\
    \ testing/\n1 2 3 4\n$ find . -type d -empty -delete\n$ ls testing/\nls: cannot\
    \ access testing/: No such file or directory\n$\n```\n\n## 打印包含指定字符串的文件列表\n\n\
    要获取包含特定字符串的文件列表，请在使用 `grep` 时加上 `-r`（递归）和 `-l`（列出匹配的文件）选项。\n\n```bash\n$ sudo\
    \ grep -rl jim /var/log\n/var/log/audit/audit.log.1\n/var/log/secure-20140406\n\
    /var/log/secure\n```\n\n## 易于阅读的递归文件列表\n\n`ls` 命令有一个递归选项，但我发现阅读 `find` 命令的输出更容易消化，尤其是当文件和目录数量很多时。使用\
    \ `find` 的优势在于它显示每个文件的完整路径，而 `ls` 则不然。\n\n```bash\n$ ls -lR Music/\nMusic/:\n\
    total 4\ndrwxr-xr-x. 2 jason jason 4096 Feb 22 12:40 jazz\nMusic/jazz:\ntotal\
    \ 20932\n-rw-r--r--. 1 jason jason       79496 Feb 22 12:40 giant-steps.mp3\n\
    -rw-r--r--. 1 jason jason 21267371 Feb 16 11:12 jazz-album-1.mp3\n-rw-r--r--.\
    \ 1 jason jason       79496 Feb  3 18:13 john-coletrene.mp3\n\n$ find Music/ -type\
    \ f -ls\n397966 20772 -rw-r--r--   1 jason jason 21267371 Feb 16 11:12 Music/jazz/jazz-album-1.mp3\n\
    396787    80 -rw-r--r--   1 jason jason    79496 Feb 22 12:40 Music/jazz/giant-steps.mp3\n\
    132464    80 -rw-r--r--   1 jason jason    79496 Feb  3 18:13 Music/jazz/john-coletrene.mp3\n\
    ```\n\n## 以树状格式查看文件和目录\n\n`tree` 命令以树状格式显示文件和目录。如果你只想查看目录结构，请使用 `-d` 选项。要限制树的深度，请使用\
    \ `-L` 选项并跟随一个数字。\n\n```bash\n$ tree Music/\nMusic/\n└── jazz\n    ├── giant-steps.mp3\n\
    \    │\n    ├── jazz-album-1.mp3\n    │\n    └── john-coletrene.mp3\n\n1 directory,\
    \ 3 files\n\n$ tree -d Music/\nMusic/\n└── jazz\n\n1 directory\n\n$ tree -d /var\
    \ | head\n/var\n├── account\n├── cache\n│\n└── fontconfig\n    |\n    └── gdm\n\
    \        |\n        ├── adminuser\n        |\n        └── jason\n\n$ tree -dL\
    \ 1 /var\n/var\n├── account\n├── cache\n├── crash\n├── db\n├── empty\n├── ftp\n\
    ├── games\n├── gd\n├── lib\n├── local\n├── lock\n├── log\n├── mail -> spool/mail\n\
    ├── nis\n├── opt\n├── preserve\n├── run\n├── spool\n├── tmp\n├── www\n└── yp\n\
    $\n```\n\n## 在多个文件中替换字符串\n\n如果你有一些嵌入在多个文件中的信息需要修改，请结合使用 `find` 命令和 `sed`。`sed`\
    \ 的 `-i` 选项表示执行就地编辑。你可以为 `-i` 指定一个扩展名，以便在编辑前创建文件的备份。传递给 `sed` 的命令指示它全局将“replacement”替换为“string”。全局替换会在所有位置执行替换。普通替换仅替换行中的第一个出现位置。\n\
    \n在这个例子中，托管软件仓库的服务器正在被替换。使用以下单行命令，所有“thor”的出现位置都被替换为“loki”。\n\n```bash\n$ grep\
    \ -r thor .\n./deploy-il.sh:REPO_SERVER=\"thor.company.com\"\n./deploy-ca.sh:REPO_SERVER=\"\
    thor.company.com\"\n./deploy-fl.sh:REPO_SERVER=\"thor.company.com\"\n./deploy-ny.sh:REPO_SERVER=\"\
    thor.company.com\"\n\n$ find . -type f -exec sed -i.bak 's/thor/loki/g' { } \\\
    ;\n\n$ grep -r thor .\n./deploy-fl.sh.bak:REPO_SERVER=\"thor.company.com\"\n./deploy-il.sh.bak:REPO_SERVER=\"\
    thor.company.com\"\n./deploy-ny.sh.bak:REPO_SERVER=\"thor.company.com\"\n./deploy-ca.sh.bak:REPO_SERVER=\"\
    thor.company.com\"\n\n$ grep -r loki .\n./deploy-il.sh:REPO_SERVER=\"loki.company.com\"\
    \n./deploy-ca.sh:REPO_SERVER=\"loki.company.com\"\n./deploy-fl.sh:REPO_SERVER=\"\
    loki.company.com\"\n./deploy-ny.sh:REPO_SERVER=\"loki.company.com\"\n$\n```\n\n\
    ## 从文件中提取第 N 行\n\n要从文件中提取特定行，请告诉 `awk` 打印匹配行号的行。当你遇到脚本中的错误时，这会很有用。要查看脚本在该行具体做了什么，请使用\
    \ `awk`。\n\n```bash\n$ ./deploy.sh\n./deploy.sh: line 74: /usr/local/bin/patch:\
    \ No such file or directory\n\n$ awk 'NR==74' deploy.sh\n/usr/local/bin/patch\
    \ $NEW_HOST\n$\n```\n\n## 将文本文件从 Windows 格式转换为 Linux 格式，反之亦然\n\n迟早你会收到或下载一个使用\
    \ CR（回车）和 LF（换行）字符对来终止行结束的文件。这类文件是 Windows/DOS 格式的。类 Unix 操作系统仅使用 LF 字符来终止行。有时这会导致问题。要将文件转换为类\
    \ Unix 格式，请使用 `dos2unix`。要检查行终止字符，请使用 \"cat -A\" 或 \"file\" 命令。\n\n```bash\n$\
    \ cat -A from-my-windows-buddy.pl\n#!/usr/bin/perl^M$\nprint \"This is a cross-platform\
    \ perl script!\\n\"^M$\n\n$ ./from-my-windows-buddy.pl\n-bash: ./from-my-windows-buddy.pl:\
    \ /usr/bin/perl^M: bad interpreter: No such file or directory\n\n$ dos2unix from-my-windows-buddy.pl\n\
    dos2unix: converting file from-my-windows-buddy.pl to UNIX format ...\n\n$ cat\
    \ -A from-my-windows-buddy.pl\n#!/usr/bin/perl$\nprint \"This is a cross-platform\
    \ perl script!\\n\"$\n\n$ ./from-my-windows-buddy.pl\nThis is a cross-platform\
    \ perl script!\n\n$ file other-file.txt\nother-file.txt: ASCII text, with CRLF\
    \ line terminators\n\n$ dos2unix other-file.txt\ndos2unix: converting file other-file.txt\
    \ to UNIX format ...\n\n$ file other-file.txt\nother-file.txt: ASCII text\n```\n\
    \n另一方面，如果你将 Linux 主机上创建的文件发送给某人在 Windows 上用记事本打开，他们只会看到一行很长的文本。使用 `unix2dos` 命令将文件转换为\
    \ Windows/DOS 格式。\n\n```bash\n$ file report-for-ceo.txt\nreport-for-ceo.txt: ASCII\
    \ text\n\n$ unix2dos report-for-ceo.txt\nunix2dos: converting file report-for-ceo.txt\
    \ to DOS format ...\n\n$ file report-for-ceo.txt\nreport-for-ceo.txt: ASCII text,\
    \ with CRLF line terminators\n$\n```\n\n## 杂项\n\n### 返回前一个工作目录\n\n如果你想返回到上一个工作目录，请使用\
    \ \"cd -\"。环境变量 OLDPWD 保存了你最近一个目录位置的路径。\"cd -\" 等同于 \"cd $OLDPWD\"。\n\n```bash\n\
    $ cd /etc/httpd/conf.d\n$ grep ^SSLCert ssl.conf\nSSLCertificateFile /etc/pki/tls/certs/localhost.crt\n\
    SSLCertificateKeyFile /etc/pki/tls/private/localhost.key\n\n$ cd /etc/pki/tls/certs/\n\
    $ ls\nca-bundle.crt ca-bundle.trust.crt localhost.crt\nmake-dummy-cert Makefile\
    \ renew-dummy-cert\n\n$ cd -\n/etc/httpd/conf.d\n```\n\n"
