    root      12339 1202  0 11:22 ?    00:00:00 sshd: jason [priv]\njason     12342\
    \ 12339 0 11:22 ?    00:00:00 sshd: jason@pts/0\n$\n```\n\n### Repeat a Command\
    \ until It Succeeds\n\n```bash\n$ while true\n> do\n>   command && break\n> done\n\
    ```\n\nThe `while` loop will continue until the condition is false or it encounters\
    \ a `break`. In this case, we effectively create an infinite loop and break once\
    \ our chosen command succeeds. If you want to keep pinging a host until it responds,\
