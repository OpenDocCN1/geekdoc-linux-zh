  md: "\n## Download a Webpage, HTTP Data, or Use a Web API from the Command Line\n\
    \n```bash\n$ ssh -ND 1080 ubuntu@ec2-75-101-157-145.compute-1.amazonaws.com\n\
    $ firefox http://www.mybank.com\n```\n\n```bash\n$ curl -o file.html http://website/webpage\n\
    $ wget http://website/webpage\n```\n\nThe `curl` and `wget` commands can be used\
    \ to download a webpage or anything that is available on a web server. You can\
    \ use these commands to interact with HTTP APIs, download software packages, download\
    \ a status page, or even get the current weather.\n\nHere's an example of checking\
    \ the status page of your local apache web server.\n\n```bash\n$ curl -o server-status.html\
    \ http://localhost/server-status\n  % Total    % Received % Xferd  Average Speed\
    \   Time    Time     Time  Current\n                                 Dload  Upload\
    \   Total   Spent    Left  Speed\n100  6148  100  6148    0     0   1070k    \
    \  0 --:--:-- --:--:-- --:--:--  1200k\n\n$ wget http://localhost/server-status\n\
    --2014-04-19 14:37:18--  http://localhost/server-status\nResolving localhost (localhost)...\
    \ 127.0.0.1\nConnecting to localhost (127.0.0.1):80... connected.\nHTTP request\
    \ sent, awaiting response... 200 OK\nLength: 6377 (6.2K) [text/html]\nSaving to:\
    \ 'server-status'\n\n100%[===================>]   6,377      --.-K/s  in 0s\n\n\
    2014-04-19 14:37:18 (105 MB/s) - 'server-status' saved [6377/6377]\n\n$ grep uptime\
    \ server-status*\nserver-status: 95,092 Server uptime: 50 minutes 13 seconds\n\
    server-status.html: 4,987 Server uptime: 50 minutes 5 seconds\n```\n\nHere's an\
    \ example of getting the current weather.\n\n```bash\n$ curl -sO lax-weather.html\
    \ \\\n    http://weather.noaa.gov/pub/data/observations/metar/decoded/KLAX.TXT\n\
    $ cat lax-weather.html\nLOS ANGELES INTNL AIRPORT, CA, United States\nKLAX 33-56N\
    \ 118-23W 46M\nApr 19, 2014 - 02:53 PM EDT / 2014.04.19 1853 UTC\nWind: from the\
    \ W (260 degrees) at 10 MPH (9 KT):0\nVisibility: 10 mile(s):0\nSky conditions:\
    \ mostly cloudy\nTemperature: 64.9 F (18.3 C)\nDew Point: 54.0 F (12.2 C)\nRelative\
    \ Humidity: 67%\nPressure (altimeter): 30.03 in. Hg (1016 hPa)\nob: KLAX 191853Z\
    \ 26009KT 10SM FEW022 BKN220 18/12 A3003 RMK AO2 SLP167 1018030122\ncycle: 19\n\
    ```\n\n```bash\n$ wget -q \\\n    http://weather.noaa.gov/pub/data/observations/metar/decoded/KLAX.TXT\n\
    $ cat KLAX.TXT\nLOS ANGELES INTERTNL AIRPORT, CA, United States\n(KLAX) 33-56N\
    \ 118-23W 46M\nApr 19, 2014 - 02:53 PM EDT / 2014.04.19 1853 UTC\nWind: from the\
    \ W (260 degrees) at 10 MPH (9 KT):0\nVisibility: 10 mile(s):0\nSky conditions:\
    \ mostly cloudy\nTemperature: 64.9 F (18.3 C)\nDew Point: 54.0 F (12.2 C)\nRelative\
    \ Humidity: 67%\nPressure (altimeter): 30.03 in. Hg (1016 hPa)\nob: KLAX 191853Z\
    \ 26009KT 10SM FEW022 BKN220 18/12 A3003 RAO SLP167 1018030122\ncycle: 19\n```\n\
    \n### Download and install a package.\n\n```bash\n$ wget -q \\\n    https://download.elasticsearch.org/elasticsearch/elasticsearch/elasticsearch-1.1.1.deb\n\
    $ sudo dpkg -i elasticsearch-1.1.1.deb\nSelecting previously unselected package\
    \ elasticsearch.\n(Reading database ... 162097 files and directories currently\
    \ installed.)\nUnpacking elasticsearch (from elasticsearch-1.1.1.deb) ...\nSetting\
    \ up elasticsearch (1.1.1) ...\nAdding system user 'elasticsearch' (UID 116) ...\n\
    Adding new user 'elasticsearch' (UID 116) with group 'elasticsearch' ...\nNot\
    \ creating home directory '/usr/share/elasticsearch'.\n\n### NOT starting elasticsearch\
    \ by default on bootup,\nplease execute\n\n    sudo update-rc.d elasticsearch\
    \ defaults 95 10\n\n### In order to start elasticsearch, execute\nsudo /etc/init.d/elasticsearch\
    \ start\nProcessing triggers for ureadahead ...\n$ sudo /etc/init.d/elasticsearch\
    \ start\n* Starting Elasticsearch Server\n[ OK ]\n```\n\n### Interact with a web\
    \ API.\n\n```json\n$ curl http://localhost:9200\n{\n  \"status\" : 200,\n  \"\
    name\" : \"NFL Superpro\",\n  \"version\" : {\n    \"number\" : \"1.1.1\",\n \
    \   \"build_hash\" : \"f1585f096d3f3985e73456dcc\",\n    \"build_timestamp\" :\
    \ \"2014-04-16T14:27:12Z\",\n    \"build_snapshot\" : false,\n    \"lucene_version\"\
    \ : \"4.7\"\n  },\n  \"tagline\" : \"You Know, for Search\"\n}\n\n$ curl http://localhost:9200/_cluster/health?pretty\n\
    {\n  \"cluster_name\" : \"elasticsearch\",\n  \"status\" : \"green\",\n  \"timed_out\"\
    \ : false,\n  \"number_of_nodes\" : 1,\n  \"number_of_data_nodes\" : 1,\n  \"\
    active_primary_shards\" : 0,\n  \"active_shards\" : 0,\n  \"relocating_shards\"\
    \ : 0,\n  \"initializing_shards\" : 0,\n  \"unassigned_shards\" : 0\n}\n```\n\n\
    ## Use Vim to Edit Files over the Network\n\n```bash\n$ vim scp://remote-host//path/to/file\n\
    $ vim scp://remote-user@remote-host//path/to/file\n```\n\nIf you want to edit\
    \ a file with vim over SSH, you can let it do the heavy lifting of copying the\
    \ file back and forth.\n\n```bash\n$ vim scp://linuxserver//home/jason/notes.txt\n\
    ```\n\n# SHELL SCRIPTING\n\n## Use a for Loop at the Command Line\n\n```bash\n\
    $ for VAR in LIST\ndo\n# use $VAR\ndone\n```\n\nWhen you need to perform the same\
    \ action for a list of items, you can use a `for` loop right from your shell.\n\
    \n```bash\n$ for USER in bob jill fred\ndo\n    sudo passwd -l $USER\n    logger\
    \ -t naughty-user $USER\ndone\n\nLocking password for user bob.\npasswd: Success\n\
    Locking password for user jill.\npasswd: Success\nLocking password for user fred.\n\
    passwd: Success\n\n$ sudo tail -3 /var/log/messages\nApr  8 19:29:03 linuxserver\
    \ naughty-user: bob\nApr  8 19:29:03 linuxserver naughty-user: jill\nApr  8 19:29:03\
    \ linuxserver naughty-user: fred\n```\n\nYou can also type entire loop on one\
    \ command line.\n\n```bash\n$ for USER in bob jill fred; do sudo passwd -l $USER;\
    \ logger -t naughty-user $USER; done\n...\n```\n\n## Command Substitution\n\n\
    ```bash\n$ VAR=`command`\n$ VAR=$(command)\n```\n\nThere are two forms of command\
    \ substitution. The first form uses backticks (`) to surround a command while\
    \ the second form uses a dollar sign followed by parenthesis that surround a command.\
    \ They are functionally equivalent with the backtick form being the older style.\
    \ The output of the command can be used as an argument to another command, to\
    \ set a variable, or for generating the argument list for a `for` loop.\n\n```bash\n\
    $ EXT_FILESYSTEMS=$(grep ext /etc/fstab | awk '{print $2}')\n$ echo $EXT_FILESYSTEMS\n\
    /\n/boot\n\n$ cp file.txt file.txt.`date +%F`\n$ ls file.txt*\nfile.txt  file.txt.2014-04-08\n\
    \n$ ps -fp $(cat /var/run/ntpd.pid)\nUID          PID  PPID C STIME TTY      \
    \    TIME\nCMD\nntp        1210     1 0 Apr06 ?           00:00:05 ntpd -u ntp:ntp\
    \ -p /var/run/ntpd\n\n$ sudo kill -9 $(cat /var/run/ntpd.pid)\n\n$ for x in $(cut\
    \ -d: -f1 /etc/passwd); do groups $x; done\njason : jason sales\nbobdjr : sales\n\
    jim : jim\n```\n\n## Store Command Line Output as a Variable to Use Later\n\n\
    ```bash\n$ for VAR in LIST\n> do\n> \tVAR2=$(command)\n> \tVAR3=$(command)\n>\
    \ \techo \"$VAR2 $VAR3\"\n> done\n```\n\nCommand substitution can be used to assign\
    \ values to variables. If you need to reuse the output of a command multiple times,\
    \ assign it to a variable once and reuse the variable. This example shows how\
    \ the output of the `id` command is used multiple times in one script.\n\n```bash\n\
    $ for USER in $(cut -f1 -d: /etc/passwd)\n> do\n> UID_MIN=$(grep ^UID_MIN /etc/login.defs\
    \ | awk '{print $NF}')\n> USERID=$(id -u $USER)\n> [ $USERID -lt $UID_MIN ] ||\
    \ (\n>     echo \"Forcing password expiration for $USER with UID of $USERID.\"\
    \n>     sudo passwd -e $USER\n> )\n> done\n\nForcing password expiration for bob\
    \ with UID of 1000.\nForcing password expiration for bobdjr with UID of 1001.\n\
    Forcing password expiration for bobh with UID of 1002.\n```\n\n## Read in Input\
    \ One Line at a Time\n\n```bash\n$ while read LINE\n> do\n>\n> # Do something\
    \ with $LINE\n> done < file.txt\n\n$ command | while read LINE\n> do\n>\n> # Do\
    \ something with $LINE\n> done\n```\n\nIf you want to iterate over a list of words,\
    \ use a `for` loop. If you want to iterate over a line, use a `while` loop in\
    \ combination with a `read` statement and redirection.\n\nLet's look for file\
    \ systems that are over 90% utilized. If we try to use an `if` statement it will\
    \ break up the output into word chunks like this.\n\n```bash\n$ df | head -1\n\
    Filesystem 1K-blocks Used Available Use% Mounted on\n\n$ for x in $(df)\n> do\n\
    > echo $x\n> done\nFilesystem\n1K-blocks\nUsed\nAvailable\nUse%\nMounted\non\n\
    ...\n```\n\nWe need to read in entire lines at a time like this.\n\n```bash\n\
    $ df | while read LINE\n> do\n> echo $LINE\n> done\nFilesystem 1K-blocks Used\
    \ Available Use% Mounted on\n...\n```\n\nHere is one way to find file systems\
    \ that are over 90% utilized.\n"
