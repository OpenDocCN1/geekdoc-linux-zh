    # ## Quickly Change a File''s Extension


    ```

    `$ mv file{.old,.new}`

    ```


    To rename a file with a new extension employ brace expansion. This example changes
    a ".txt" file to a ".doc" file.


    ```

    ```

    $ ls report*

    report.txt

    $ mv report.{txt,doc}

    $ ls report*

    report.doc

    $

    ```

    ```


