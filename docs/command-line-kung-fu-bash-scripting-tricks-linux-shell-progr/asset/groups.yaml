    1  2014-04-13 00:00 a root\n# exit\n$\n```\n\n你可以使用 -f 选项向 at 提供一个包含一系列命令的文件。例如，你可以安排周五下午\
    \ 5:00 给老板发送报告，然后早点下班去打一轮高尔夫。如果你的良心让你无法忽视这件事，你可以使用 atrm 删除你的 at 任务。\n\n```\n$\
    \ at -f email-tips-report-to-boss 5:00pm friday\njob 2 at 2014-04-18 17:00\n$\
    \ atrm 2\n$ atq\n$\n```\n\n## 与另一用户共享屏幕会话\n\n```\n$ screen -x user/session\n```\n\
    \n为了使用 screen 的多用户支持，需要将 screen 可执行文件设置为 root 权限。\n\n```\n$ sudo chmod u+s /usr/bin/screen\n\
    ```\n\n必须有一个用户启动屏幕会话。使用 -S 选项为你的屏幕会话命名可能会有所帮助。要启用多用户会话，请输入 ctrl-a，然后输入 \":multuser\
    \ on<enter>\"。要允许某人连接到你的会话，请输入 ctrl-a，然后输入 \":acladd 用户名\"。要从屏幕会话断开其他用户的连接，请输入\
    \ ctrl-a，然后输入 \":acldel 用户名\"。\n\n```\n[jason@linuxsvr ~]$ screen -S for-bob\n\
    ctrl-a :multiruser on\nMultiruser mode enabled\nctrl-a :acladd bob\n```\n\n当另一用户准备好连接屏幕会话时，他们输入\
    \ screen -x，后跟会话标识符。他们可以按 PID 或名称连接。例如，screen -x 1234 或 screen -x 会话名称。当他们准备断开连接时，可以通过输入\
    \ ctrl-a d 像往常一样离开屏幕会话。在会话共享期间，双方不仅可以看到相同的屏幕，还可以同时通过打字提供输入。\n\n```\nbob@linuxsvr:~$\
    \ screen -ls jason/\nThere is a suitable screen on:\n      5428.for-bob      \
    \    (Multir, attached)\n1 Socket in /var/run/screen/S-jason.\nbob@linuxsvr:~$\
    \ screen -x jason/for-bob\n```\n\n```\n[jason@linuxsvr ~]$ ctrl-a d\n[detached]\n\
    bob@linuxsvr:~$\n```\n\n## 执行别名的原始命令版本\n\n```\n$ \\aliased-command\n```\n\n使用转义字符来忽略命令的别名。例如，如果\
    \ \"ls\" 被别名为 \"ls -F\"，则使用 \"\\ls\" 来执行不带 \"-F\" 选项的 \"ls\"。ls 的 \"-F\" 选项会在文件名后附加文件类型指示符。对于目录，该指示符是前斜杠（/）。\n\
    \n```\n$ alias ls\nalias ls='ls -F'\n$ ls\nDesktop/ Documents/ Downloads/ examples.desktop\n\
    $ \\ls\nDesktop Documents Downloads examples.desktop\n$\n```\n\n## 将命令输出保存为图像\n\
    \n```\n$ command | convert label:@- image.png\n```\n\n要在图像文件中捕获命令的输出，请使用 ImageMagick\
    \ 软件套件中的 convert 命令。如果你希望向某人发送密码，但不希望它以纯文本形式在互联网上传播，可以将其放在图像中。当向 label 提供 at 符号（@）时，它告诉\
    \ convert 从 at 符号后的文件读取输入。破折号表示“文件”来自标准输入。如果你想创建一个带有简单文本的图像，可以向 label 提供一个字符串。\n\
    \n```\n$ echo \"bob:changeme\" | sudo chpasswd\n$ echo \"bob:changeme\" | convert\
    \ label:@- password.png\n$ convert label:\"bob:changeme\" same-thing-different-way.png\n\
    $ echo \"Here's your password. Again.\" | mail -a password.png -s 'Password reset'\
    \ bob@mycompany.com\n$\n```\n\n# 关于作者\n\nJason Cannon 于 1999 年作为 Unix 和 Linux\
    \ 系统工程师开始职业生涯。自那时起，他在 Xerox、UPS、Hewlett-Packard 和 Amazon.com 等公司运用了其 Linux 技能。此外，他还为中小企业担任技术顾问和独立承包商。\n\
    \nJason 在 CentOS、RedHat Enterprise Linux、SUSE Linux Enterprise Server 和 Ubuntu\
    \ 方面拥有专业经验。他在个人项目中使用过几种 Linux 发行版，包括 Debian、Slackware、CrunchBang 以及其他。除了 Linux\
    \ 之外，Jason 还有支持专有 Unix 操作系统的经验，包括 AIX、HP-UX 和 Solaris。\n\n他热衷于教别人如何使用和开发 Linux\
    \ 操作系统的强大功能，并在 http://www.LinuxTrainingAcademy.com 上教授在线视频培训课程。\n\nJason 还是《*Linux\
    \ 入门：Linux 操作系统和命令行介绍*》的作者。\n\n# 作者的其他书籍\n\n- **LAMP 堆栈的高可用性：** 消除单点故障并提高基于 Linux、Apache、MySQL\
    \ 和 PHP 的 Web 应用的正常运行时间\n  http://www.linuxtrainingacademy.com/ha-lamp-book\n\n\
    - **Linux 入门：** Linux 操作系统和命令行介绍\n  http://www.linuxtrainingacademy.com/linux\n\
    \n- **Linux 截图指南：** 最受欢迎的 Linux 发行版图解指南\n  http://www.linuxtrainingacademy.com/screenshots\n\
    \n- **Python 编程入门：** Python 计算机语言和计算机编程介绍\n  http://www.linuxtrainingacademy.com/python-book\n\
    \n# 作者的课程\n\n- LAMP 堆栈的高可用性\n  http://www.linuxtrainingacademy.com/ha-lamp-stack/\n\
    \n- Linux 入门\n  http://www.linuxtrainingacademy.com/lfb-udemy\n\n- 五天学会 Linux\n\
    \  http://www.linuxtrainingacademy.com/linux-in-5-days\n\n# 索引\n\n**alias（别名）**\n\
    - 轻松按日期创建文件备份，70\n- 在不同时区显示当前日期和时间，89\n- 以表格形式显示输出，14\n- 执行别名的原始命令版本，98\n- 使用别名修复常见拼写错误，22\n\
    \n**at**\n- 在指定时间执行命令，95\n\n**atrm**\n- 在指定时间执行命令，95\n\n**atq**\n- 在指定时间执行命令，95\n\
    \n**avconv**\n- 让您的电脑与你对话，89\n- 重用前一个命令中的第 N 个单词，8\n\n**awk**\n- 命令替换，52\n- 计算字符串出现的次数，25\n\
    - 显示两个字符串之间的文本块，19\n- 从文件中提取第 N 行，81\n- 找出你最常使用的命令，11\n- 获取输出行中的最后一个单词，15\n- 一次读取一行输入，54\n\
    - 将命令行输出存储为变量以供稍后使用，53\n- 对文本中指定列的所有数字求和，58\n\n"
