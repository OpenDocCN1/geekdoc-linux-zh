    # ### Use a Different SSH Key for a given Remote Host


    Put the following in the `~/.ssh/config` file.


    ```

    Host remote-host

    IdentityFile ~/.ssh/id_rsa-remote-host

    ```


    If you need or want to use different SSH keys for different hosts, you can explicitly
    specify them on the command line with the `-i` option to ssh.


    ```

    $ ssh -i ~/.ssh/id_rsa-db1 db1.example.com

    ```


    If you want to forgo specifying the key each time you can create an entry in your
    `~/.ssh/config` file and specify the key there.


    ```

    $ cat ~/.ssh/config

