    \ 选项可防止将 IP 地址转换为主机名。`-i` 选项指示 `lsof` 显示网络连接。\n\n```bash\n$ sudo lsof -Pni\nCOMMAND\
    \          PID USER   FD TYPE DEVICE SIZE/OFF NODE NAME\ndhclient      989 root\
    \   6u  IPv4  11522  0t0  UDP *:68\nsshd          1202 root   3u  IPv4  12418\
    \  0t0  TCP *:22 (LISTEN)\nsshd          1202 root   4u  IPv6  12423  0t0  TCP\
    \ *:22 (LISTEN)\nntpd          1210 ntp  16u  IPv4  12464  0t0  UDP *:123\nntpd\
    \          1210 ntp  17u  IPv6  12465  0t0  UDP *:123\nntpd          1210 ntp\
    \  18u  IPv4  12476  0t0  UDP 127.0.0.1:123\nntpd          1210 ntp  19u  IPv4\
    \  12477  0t0  UDP 192.168.122.60:123\nntpd            1210  ntp   20u  IPv6 \
    \ 12478  0t0  UDP  [::]:123\nntpd            1210  ntp   21u  IPv6  12479  0t0\
    \  UDP  [fe80::5054:ff:fe52:d858]:123\nmaster           1364  root   12u  IPv4\
    \  12761  0t0  TCP  127.0.0.1:25 (LISTEN)\nclock-app  12174 jason   21u  IPv4\
    \  78889         0t0  TCP  192.168.122.60:39021->184.25.102.40:80 (ESTABLISHED)\n\
    sshd             12339  root     3r  IPv4  74023  0t0  TCP  192.168.122.60:22->192.168.122.1:34483\
    \ (ESTABLISHED)\nsshd             12342 jason     3u  IPv4  74023  0t0  TCP  192.168.122.60:22->192.168.122.1:34483\
    \ (ESTABLISHED)\n```\n\n## 比较远程文件和本地文件的差异\n\n```bash\n$ ssh remote-host cat /path/to/remote-file\
    \ | diff /path/to/local-file -\n```\n\n要显示本地文件和远程文件之间的差异，可以通过 SSH 使用 cat 命令查看文件，并将输出管道传入\
    \ diff 或 sdiff 命令。diff 和 sdiff 命令可以通过在其中一个文件名处提供减号（-）来接受标准输入代替文件。\n\n```bash\n\
    $ ssh linuxsrv cat /etc/passwd | diff /etc/passwd -\n32c32\n< terry:x:503:1000::/home/terry:/bin/ksh\n\
    ---\n> terry:x:503:1000::/home/terry:/bin/bash\n35a36\n> bob:x:1000:1000:Bob Smith:/home/bob:/bin/bash\n\
    ```\n\n## 从命令行发送电子邮件\n\n```bash\n$ mail recipient@domain.com\n$ echo 'message'\
    \ | mail -s 'subject' recipient@domain.com\n```\n\n使用 mail 命令可以发送电子邮件。你可以交互式地输入消息，或者通过管道输入。交互消息以\
    \ ctrl-d 结束。\n\n```bash\n$ mail jim@mycorp.com\nSubject: Message from the command\
    \ line\nIsn't this great?\nEOT\n$ echo \"Here's the lazy way\" | mail -s 'Message\
    \ from the command line' jim@mycorp.com\n```\n\n## 从命令行发送电子邮件附件\n\n```bash\n$\
    \ mail -a /path/to/attachment recipient@domain.com\n$ echo 'message' | mail -s\
    \ 'subject' -a /path/to/attachment recipient@domain.com\n```\n\n如果你需要从命令行发送电子邮件附件，请使用\
    \ mail 命令的 -a 选项。\n\n```bash\n$ echo \"Here is the file you requested\" | mail\
    \ -s \"The file\" -a /tmp/files.tgz jim@mycorp.com\n```\n\n## 创建 SSH 隧道以访问远程资源\n\
    \n```bash\n$ ssh -N -L local-port:host:remote-port remote-host\n```\n\n要创建 SSH\
    \ 隧道，请使用 -L 选项。第一个端口是将在你的本地机器上打开的端口。到该端口的连接将通过 remote-host 进行隧道传输，并发送到 -L 选项中指定的主机和远程端口。-N\
    \ 选项告诉 SSH 不要在远程主机上执行命令（例如你的 shell）。\n\n假设你想访问一个在互联网上不可用，但你拥有 SSH 访问权限的服务器可以访问的网站。你可以创建一个隧道，让你可以浏览该网站，就像你位于公司防火墙后面一样。此命令会将你本地机器端口\
    \ 8000 上的任何连接通过跳板服务器转发到内网服务器端口 80。将你的 web 浏览器指向 http://localhost:8000 并开始浏览。\n\
    \n```bash\n$ ssh -N -L 8000:intranet.acme.com:80 jump-server &\n[1] 23253\n$ firefox\
    \ http://localhost:8000\n```\n\n另一个用例是访问运行在你拥有 SSH 访问权限的服务器上的服务。如果你需要访问一个仅允许来自特定主机的数据库连接的\
    \ mysql 服务器，你可以为连接创建一个 SSH 隧道。由于 mysql 服务运行在远程主机的 localhost:3306 上，-L 选项应该如下所示：-L\
    \ 3306:localhost:3306。你可以使用本地机器上的 mysql 命令行客户端连接到数据库，但更有趣的是使用图形化桌面应用程序（这些应用程序在服务器上不可用）。例如，你可以使用此隧道并通过\
    \ MySQL Workbench、Navicat 或其他应用程序连接到数据库。\n\n```bash\n$ ssh -N -L 3306:localhost:3306\
    \ db01 &\n[1] 13455\n$ mysql -h 127.0.0.1\nWelcome to the MySQL monitor.  Commands\
    \ end with ; or \\g.\nYour MySQL connection id is 9\nServer version: 5.1.73 Source\
    \ distribution\nCopyright (c) 2000, 2013, Oracle and/or its affiliates. All rights\
    \ reserved.\nOracle is a registered trademark of Oracle Corporation and/or its\
    \ affiliates. Other names may be trademarks of their respective owners.\nType\
    \ 'help;' or '\\h' for help. Type '\\c' to clear the current input statement.\n\
    mysql>\n```\n\n## 查找哪些程序正在监听哪些端口\n\n```bash\n$ sudo netstat -nutlp\n```\n\n以下是\
    \ netstat 选项的说明，用于获取正在监听的程序及其端口的列表。\n\n- -n 显示数字地址而不是解析符号名称\n- -u 包含 UDP 协议\n\
    - -t 包含 TCP 协议\n- -l 仅显示监听套接字\n- -p 显示 PID 和程序名称\n\n```bash\n$ sudo netstat -nutlp\n\
    Active Internet connections (only servers)\nProto Recv-Q Send-Q Local Address\
    \           Foreign Address         State PID/Program name\ntcp   0      0   \
    \   0.0.0.0:3306          0.0.0.0:*               LISTEN 4546/mysqld\ntcp   0\
    \      0      0.0.0.0:22            0.0.0.0:*               LISTEN 1161/sshd\n\
    tcp   0      0      127.0.0.1:25          0.0.0.0:*               LISTEN 1325/master\n\
    tcp   0      0      :::80                 :::*                    LISTEN 4576/httpd\n\
    tcp   0      0      :::22                 :::*                    LISTEN 1161/sshd\n\
    udp   0      0      0.0.0.0:68            0.0.0.0:*                        1008/dhclient\n\
    ```\n\n## 为特定远程主机使用不同的 SSH 密钥\n\n将以下内容放入 `~/.ssh/config` 文件中。\n\n```bash\nHost\
    \ remote-host\n    IdentityFile ~/.ssh/id_rsa-remote-host\n```\n\n如果你需要或希望为不同的主机使用不同的\
    \ SSH 密钥，你可以使用 ssh 的 `-i` 选项在命令行中显式指定它们。\n\n```bash\n$ ssh -i ~/.ssh/id_rsa-db1\
    \ db1.example.com\n```\n\n如果你不想每次都要指定密钥，可以在 `~/.ssh/config` 文件中创建一个条目并在那里指定密钥。\n\
    \n```bash\n$ cat ~/.ssh/config\n```\n\n"
