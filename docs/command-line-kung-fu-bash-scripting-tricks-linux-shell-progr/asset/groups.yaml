    # Command Substitution


    ```

    ```

    $ VAR=`command`

    $ VAR=$(command)

    ```

    ```


    There are two forms of command substitution. The first form uses backticks (`)
    to surround a command while the second form uses a dollar sign followed by parenthesis
    that surround a command. They are functionally equivalent with the backtick form
    being the older style. The output of the command can be used as an argument to
    another command, to set a variable, or for generating the argument list for a
    for loop.


    ```

