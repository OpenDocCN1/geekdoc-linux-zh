    \ \"tagline\" : \"You Know, for Search\"\n}\n\n$ curl http://localhost:9200/_cluster/health?pretty\n\
    {\n  \"cluster_name\" : \"elasticsearch\",\n  \"status\" : \"green\",\n  \"timed_out\"\
