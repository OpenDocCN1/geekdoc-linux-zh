    \ answer \"no\" you could run `yes no`.\n\n```bash\n$ ./install-my-app.sh\nAre\
    \ you sure you want to install my-app? (y/n) y\nOk, my-app installed.\n$ yes |\
    \ ./install-my-app.sh\nOk, my-app installed.\n$\n```\n\n## SYSTEM ADMINISTRATION\n\
    \n### Display Mounted File Systems in a Tabular Format\n\n```bash\n$ mount | column\
    \ -t\n```\n\nThe output of the `mount` command is not formatted in an easy-to-read\
    \ manner. To make each column line up, pipe the output of the `mount` command\
    \ to \"column -t\". By default `mount` displays all mounted filesystems, even\
    \ the pseudo-filesystems like `/proc` and `/sys`. To limit output to a filesystem\
    \ type, use the `-t` option and provide a type.\n\n```bash\n$ mount -t ext4\n\
    /dev/mapper/sys-lv_root on / type ext4 (rw)\n/dev/sda1 on /boot type ext4 (rw)\n\
    $ mount -t ext4 | column -t\n/dev/mapper/sys-lv_root on / type ext4 (rw)\n/dev/sda1\
    \ on /boot type ext4 (rw)\n```\n\n### Kill All Processes for a given User or Program\n\
    \n```bash\n$ pkill -9 command\n$ pkill -9 -u user command\n```\n\nIf you need\
    \ to kill several processes with the same command, use the `pkill` command. If\
