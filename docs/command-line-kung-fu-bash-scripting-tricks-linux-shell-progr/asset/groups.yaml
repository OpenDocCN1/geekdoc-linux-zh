    \ `\"jump\"` will have the `\".company.com\"` domain name appened to them.\n\n\
    ```\n$ ssh ny-wwl\n$ hostname -f\nny-wwl.newyork.company.com\n$ exit\n$ ssh jump-ny-01\n\
    $ hostname -f\njump-ny-01.company.com\n$ exit\n$ \n```\n\n# Run a Command Immune\
