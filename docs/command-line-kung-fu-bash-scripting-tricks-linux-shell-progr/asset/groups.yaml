    # YOUR FREE GIFT


    As a thank you for reading *Command Line Kung Fu*, I would like to give you a
    copy of *Linux Alternatives to Windows Applications*. In it, you will be introduced
    to over 50 of the most popular applications available for Linux today. These applications
    will allow you to browse the web, watch movies, listen to music, connect to your
    favorite social networks, create presentations, and more. This gift is a perfect
    complement to this book and will help you along your Linux journey. Visit [http://www.linuxtrainingacademy.com/linux-apps](http://www.linuxtrainingacademy.com/linux-apps)
    to download your free gift.'
