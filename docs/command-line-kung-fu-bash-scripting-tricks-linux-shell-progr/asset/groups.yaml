    \ for cloud computing.\nhttp://en.wikipedia.org/wiki/Ubuntu_(operating_system)\"\
    \n```\n\nAlternatively, you could create a function instead and add it to your\
    \ dot files.\n\n```\n$ echo 'wikidig(){ dig +short txt ${1}.wp.dg.cx; }' \n>>\
    \ .bash_profile\n$ . ./.bash_profile\n```"
