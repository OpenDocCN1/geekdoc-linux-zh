    要访问前一条命令中的单词，请使用 `!!:N`，其中 N 是您想要获取的单词编号。第一个单词是 0，第二个单词是 1，依此类推。您可以将 0 视为命令本身，1
    视为命令的第一个参数，2 视为第二个参数，等等。


    您可以将任何事件标识符与单词标识符结合使用。在下面的示例中，`!!` 是最近的命令行：`avconv -i screencast.mp4 podcast.mp3`。`!a`
    事件标识符扩展为相同的命令，因为它是以字母 “a” 开头的最近命令。


    ```bash

    $ avconv -i screencast.mp4 podcast.mp3

