  md: "\n## Accept User Input and Store It in a Variable\n\n`$ read VAR`\n\n`$ read\
    \ -n 1 VAR`\n\n`$ read -p \"Prompt text\" VAR`\n\nTo accept user input from a\
    \ user, use the `read` command. `read` will accept an entire line of input and\
    \ store it into a variable. You can force `read` to only read a limited number\
    \ of characters by using the `-n` option. Instead of using `echo` statements before\
    \ a `read` command, you can supply a prompt by using the `-p` option. Here is\
    \ a sample script that uses these techniques.\n\nThe contents of `backup.sh`:\n\
    \n```bash\n#!/bin/bash\nwhile true\ndo\n   read -p \"What server would you like\
    \ to backup? \" SERVER\n\n   echo \"Backing up $SERVER\"\n   /usr/local/bin/backup\
    \ $SERVER\n\n   read -p \"Backup another server? (y/n) \" -n 1 BACKUP_AGAIN\n\
    \   echo\n   [ \"$BACKUP_AGAIN\" = \"y\" ] || break\ndone\n```\n\nExecution example:\n\
    \n```bash\n$ ./backup.sh\nWhat server would you like to backup? thor\nBacking\
    \ up thor\nBackup another server? (y/n) y\nWhat server would you like to backup?\
    \ loki\nBacking up loki\nBackup another server? (y/n) n\n$\n```\n\n### Sum All\
    \ the Numbers in a given Column of a Text\n\n```bash\n$ awk '{ sum += $1 } END\
    \ { print sum }' file\n$ cat file | awk '{ sum += $1 } END { print sum }'\n```\n\
    \n`awk` can be used to tally up a column of values. You can use this trick to\
    \ add up all the disk space used across all the file systems on a given system,\
    \ for example.\n\n```bash\n$ df -mt ext4\nFilesystem 1M-blocks Used Available\
    \ Use% Mounted on\n/dev/sda2  28215 3285 24644 12% /\n/dev/sda1    485   55 406\
    \ 12% /boot\n$ df -mt ext4 | awk '{ sum += $3 } END {print sum}'\n3340\n$ sudo\
    \ dmidecode --type memory\nSize: No Module Installed\nSize: 4096 MB\nSize: No\
    \ Module Installed\nSize: 4096 MB\n$ sudo dmidecode --type memory | grep 'Size:'\
    \ | awk '{sum+=$2} END {print sum}'\n8192\n$\n```\n\n### Automatically Answer\
    \ Yes to Any Command\n\n```bash\n$ yes | command\n$ yes \"string\" | command\n\
    ```\n\nIf you are trying to automate a process that requires user input, check\
    \ out the `yes` command. By default `yes` simply prints out \"y\" until it is\
