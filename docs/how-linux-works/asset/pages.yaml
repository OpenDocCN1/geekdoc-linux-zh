    # ## 1.2 Text Editors


    Speaking of editing, it''s time for you to learn an editor. To get serious with
    Unix, you must be able to edit text files without damaging them. Most parts of
    the system use plain-text configuration files (for example, those in /etc). It''s
    not too difficult to edit files, but you will do so that you need a serious, powerful
    tool for the job.


    You should make a serious attempt to learn one of the de facto standard Unix editors,
    vi and emacs. Most Unix wizards are religious about their choice of editor. Don''t
    listen to them. Instead, choose for your-self. If you choose an editor that matches
    your personality, you will find easier to learn:


    +   - If you want an editor that can do almost anything and has online help, and
    you don''t mind some extra typing to get these features, try emacs.

    - If speed means everything to you, give vi a shot; it "plays" a bit like a video
    game.


    Learning the vi editor [Lamb] can tell you everything you need to know about.
    For emacs, use the online tutorial: Start emacs from the shell prompt or a GUI
    menu, type CONTROL-H, and type t. If you want a book, look out GNU Emacs Manual
    [Stallman].


    You might be tempted to bumble around with a "friendlier" editor, as pico or one
    of the myriad GUI editors when you start out, but if you''re the type of person
    who tends to make a habit out of the first thing that you do, don''t want to go
    down this route.


    Incidentally, the editing text is where you will first start to see a difference
    between the terminal and the GUI. Editors as vi run inside the terminal window,
    using the standard terminal I/O interface that you are starting to learn. However,
    GUI editors start their own window and their own interface, independent of terminals.


