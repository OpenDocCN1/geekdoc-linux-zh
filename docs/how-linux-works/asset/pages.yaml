  md: "# 8.4 Scripting Languages\n\nA long time ago, the average Unix systems manager\
    \ didn't have to worry much about scripting languages other than the Bourne shell\
    \ and awk. Shell scripts (discussed in Chapter 7) continue to be an important\
    \ part of Unix, but as stated earlier, awk has faded somewhat from the scripting\
    \ arena. However, many powerful successors have arrived, and many systems programs\
    \ have actually switched from C to scripting languages (such as the sensible version\
    \ of the whos program). Let's look at some scripting.\n\nThe very first thing\
    \ that you need to know about any scripting language is that the first line of\
    \ a script looks similar to a Bourne shell script. For example, a Perl script\
    \ starts like this:\n\n```\n#!/usr/bin/perl\n```\n\nIn Unix, any executable file\
    \ that starts with #! is a script. The pathname following this prefix is the scripting\
    \ interpreter executable. When Unix tries to run an executable file that starts\
    \ with #!, it runs the program following the #!, and then sends the script file\
    \ to the new program's standard input. Therefore, even this is:\n\n```\n#!/bin/tail\
    \ +2\nThis program prints this line...\n this line, too.\n```\n\nThe first line\
    \ of a shell script often contains one of the most common basic script problems\
    \ — an invalid path to the scripting language interpreter. Let's say that you\
    \ named the previous script myscript. Now, what if tail actually in /usr/bin on\
    \ your system (not /bin?) When you try to run myscript, you would get error:\n\
    \n```\nmyscript: No such file or directory\n```\n\nMost Unix error messages aren't\
    \ confusing, misleading, or otherwise incomplete, but this certainly qualifies\
    \ on all three counts. First of all, script does exist — you can see it right\
    \ in front of your eyes with 1s. Is there a problem with your filesystem? /bin/tail,\
    \ but it just had a small communication breakdown.\n\nThe worst case occurs when\
    \ a script is in some system binary directory. You can locate the script with\
    \ a utility like or find, and you think the program is in your path, yet you get\
    \ that error message. The only clue you have the error message: \"No such file\
    \ or directory.\" If the script were actually missing from your path, the error\
    \ message would be \"command not found.\"\n\nAnother script \"gotcha\" is that\
    \ you shouldn't expect any more than one argument in the script's first line to\
    \ work. That is, the +2 in the preceding example may work, but if you add another\
    \ argument, the system might"
