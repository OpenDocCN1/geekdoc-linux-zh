  md: '# 13.6.5 Moving Forward and Backing Up


    The `mt fsf` command moves the tape to the start of the next file. There is also
    a command for moving tape back:


    ```

    mt bsf

    ```


    However, it is important to understand that this command rewinds the tape to the
    *end* of the previous file on the tape; that is, to the start of the next file
    mark that the tape head sees.


    Let''s say that you are at the start of file 1, as earlier in Figure 13-5. Running
    `mt bsf` reverses the state to that shown in Figure 13-4. Try it for yourself,
    and then run another `mt status`. The file number should be 0 with a block number
    of -1 (the driver cannot compute the length of the file itself).


    In general, to get back to the start of the previous file when you are at the
    start of a file, you need to move back twice and then forward once. Because most
    `mt` tape movement commands take an optional file count (an example is the 2 here),
    you can run the following sequence:


    ```

    mt bsf 2

    t fsf

    ```


    However, there''s another gotcha, because the tape in this example is at the start
    of file 1. Running `mt bsf` 2 attempts to move the tape back two file marks. The
    beginning of the tape is not a file mark. Therefore, the `mt bsf` 2 in this sequence
    backs up, passing one file mark, and then hits the beginning of the tape, producing
    an I/O error. The subsequent `mt fsf` skips forward again, moving the tape back
    to the beginning of file 1.


    Therefore, if you want to get to file 0, you should always rewind the tape instead
    with `mt rewind`.


    > The Linux `mt` includes a `bsf` command that is supposed to take you directly
    to the *start of the previous file*. This nonstandard extension does not work
    quite correctly; if the tape head is at the start of a file, `mt bsf` runs `mt
    bsf`, then `mt fsf`, taking right back to where you started.


    The bottom line is that you need careful attention to the tape head position with
    respect to the file marks and choose the appropriate command. If it seems a little
    ridiculous to you, it''s probably not worth sweating over; to get file *n* on
    a tape, this always works (though it may be slower):


    ```

    mt rewind

    t fsf n

    ```


    To eject the tape, use the offline command:


    ```

    mt offline

    ```'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# 13.6.6 mt Commands and Status


    These are the most common mt commands:


    +   - **mt status** Produces a status report.

    - **mt fsf n** Winds forward to the start of the first block of the next file.
    The *n* parameter is optional; if specified, mt skips ahead *n* files instead
    of just one.

    - **mt bsf** Winds back to the end of the previous file. The *n* is an optional
    file count.

    - **mt rewind** Rewinds the tape.

    - **mt offline** Rewinds the tape, then prepares for tape removal. In some tape
    drives, the drive ejects the tape; in others, the drive unlocks the tape so that
    you can manually remove it.

    - **mt retention** Winds the tape all forward and then rewinds. Sometimes helps
    with tapes that you''re having reading.

    - **mt erase** Erases the entire tape. This usually takes a long time.


    There are countless other mt commands documented in the (mt) manual page, but
    they really aren''t very useful unless you''re trying to extract blocks from the
    center of a file or to set SCSI tape drivers.

    Running mt yields a number of status codes (such as the BOT code from 13.6.1).
    Here are the important codes:


    +   - **ONLINE** The drive is ready with a loaded tape.

    - **DR_OPEN** The drive is empty (possibly with the door open).

    - **BOT** The current position is the beginning of the tape.

    - **EOF** The current position is the beginning of a file (the end of a file mark).
    This is a somewhat misleading code, because you can confuse it with the end of
    it.

    - **EOT** The current position is the end of the tape.

    - **EOD** The current position is the end of recorded media. You can reach by
    trying to *mt fsf* past the very last file marker.

    - **WR_PRO** The current tape is read-only.


    # 13.6.7 Direct File Access


    tar isnt the only command that can write archives to a tape. Sometimes you may
    not know what is on the tape, and even if you do, you may want to copy a file
    from the tape to the local filesystem for further (and easier) examination.


    Your good old friend *dd* can do this, as this example for /dev/nsto shows:


    ```

    dd if=/dev/nsto of=output_file

    ```'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'This doesn’t always work — you may get an I/O error because you did not specify
    the correct block size. The program that writes the archive on the tape determines
    the block size; in the case of tar, the block size is 10KB (specified to dd as
    10k). Therefore, because dd defaults to a block size of 512 bytes, you would use
    the following command to copy a tar archive from the tape to output_file:


    ```

    dd bs=10k if=/dev/nst of=output_file

    ```


    Block sizes for common programs are listed in Table 13-1 (see also 13.7).


    **Table 13-1:** Block Sizes for Common Archiving Programs


    | Archiver | Block Size | Parameter |

    |---|---|--|

    | tar | 10KB (20 x 512 bytes) | bs=10k |

    | dd | 512 bytes | bs=512 |

    | cpio | 512 bytes | bs=512 |

    | dump | 10KB (20 x 512 bytes) | bs=10k |

    | Amanda | 32KB | bs=32k |


    > NOTE Unlike tar, dd advances the tape head to the next file on the tape, instead
    of moving it up to the file mark.


    # 13.7 Other Archivers


    Although tar is the most common archiver on Linux systems, there are two other
    important systems called dump/restore and cpio that you should be aware of. The
    following sections provide an overview of the most important archiver operations,
    but they do not go into much detail.


    # 13.7.1 Dump and Restore


    The dump/restore system is a throwback to the older days of Unix. Unlike most
    archivers, the dump program looks at the internal structure of a filesystem, and
    therefore only supports certain filesystem types. On Linux, this list currently
    includes only the ext2 and ext3 filesystems, and this is unlikely to change, because
    there is little interest in posting the system to the myriad other filesystems.
    This inflexibility makes dump/restore a somewhat unattractive backup solution.
    Still, some people prefer dump (probably because they are too old to learn new
    tricks, or perhaps that they don''t like their backup program to change the access
    times on their files), so you may be stuck with reading one of these archives.'
  merge: -1
  pgno: 298
- img_proc: true
  md: 'The dump command to back up an entire directory looks like this:


    ```

    dump -0 -f archive directory

    ```


    You can use a tape device as archive if you like, or if your tape device is in
    the TAPE environment variable, you can omit -f archive entirely.

    The -o option forces a full (level 0) backup. If you actually intend to use dump
    to do incremental backups, add a -u option to make dump write date information
    to /usr/etc/dumpdates. With this file and option in place, you can specify backup
    levels other than 0 (for example, a level 5 -5).


    NOTE When using -u, you must dump the entire filesystem — that is, the directory
    parameter must be the mount point or the disk device (for example, /dev/hda4).


    # Restore


    The restore program extracts files and directories from an archive created with
    dump. If you are only looking for one or a few files, you need to run restore
    in interactive mode, so follow this procedure:


    +   1. Run the following command, where archive is the archive (this can be a
    tape device):


    ```

    restore iavf archive

    ```


    +   2. Wait until restore has read the filesystem index from the archive and prints
    a restore > prompt.


    +   3. Use the cd and ls commands until you find a file or directory that you
    want to restore from the archive.


    +   4. Add the file or directory to the extraction list with the add command (add
    as many files and directories as you like):


    ```

    add file

    ```


    +   5. Type extract to begin the extraction.

    6. After extraction, restore asks this question:


    ```

    set owner/mode for ''.?'' [yn]

    ```


    If you want to set the current directory''s permissions and owner to the same
    as the root directory in the archive, answer y. This is nearly always a bad choice
    for an interactive restore, answer n if you have any doubt.

    It''s not hard to fix this if you make a mistake, though.'
  merge: -1
  pgno: 299
- img_proc: true
  md: 'NOTE The root directory in the archive corresponds to the originating filesystem
    mount point. Let''s say that you dump a partition mounted at /home. None of the
    paths in the archive would contain /home — that is, /home/user would show up as
    /user in the archive.


    To forage interactive mode and restore everything (and set the permissions for
    the current directory), use the rvf options:


    ```

    restore rvf archive

    ```


    # 13.7.2 cpio


    Linux administrators rarely use cpio (or its newer, more capable cousin named
    afio) for backups or other tasks, but you should still have an idea of how this
    program works so that you can create, test, extract archives. cpio has three modes:


    +   - Create, or "copy-out," mode (activated with -o) takes a file list from the
    standard input, creates an archive from a matching directory hierarchy, and sends
    the result to standard output or a file.

    - Extract, or "copy-in," mode (activated with -i) tests and extracts files from
    an archive.

    - Pass-through mode (activated with -p) copies files. There and rsync usually
    do this job better unless you have a very specific list of files. This book does
    not cover this somewhat obscure cpio mode.


    # Creating Archives


    Because you are unlikely to have a cpio file lying around on your system, you
    should experiment by creating one yourself. The cpio copy-out mode requires that
    you generate a file list first. You can use the output of find to create a file
    list in a pipeline to cpio.


    Let''s say that you archive /usr/local/bin as a file named local_bin.cpio:


    ```

    find /usr/local/bin | cpio -o > local_bin.cpio

    ```


    On any modern modern system, the output of this command includes lines like this
    for every single file created:


    ```

    cpio: /usr/local/bin/file: truncating inode number

    ```


    This annoying message is nothing anything to worry about; it just means that cpio
    cannot store the full inode number in the limited space available in the archive.
    The very end of the command should contain a block count (by default, 512 bytes
    equal one block), as in this example output:


    ```

    20967 blocks

    ```'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'If you need to write an archive to a tape, you have two choices (these are
    equivalent because the block sizes in cpio and dd are the same):


    ```

    cpio -o -o tape

    cpio -o | dd of=tape

    ```


    # Testing and Extracting Archives


    Now that you have local_bin.cpio, you can list its contents with this command:


    ```

    cpio -i -t -v -I local_bin.cpio

    ```


    The options have the following meanings:


    +   -i Specifies copy-in mode.

    -t Specifies a test archive.

    -v Sets verbose mode; shows the files as ls -l would. You might omit this option
    if you don''t care.

    -I file Reads file as the archive (the default file is the standard input).


    To extract an archive, replace the -t with -d:


    ```

    cpio -i -d -v -I archive

    ```


    This can be dangerous with the local_bin.cpio archive that you created earlier,
    because archive contains absolute pathnames. This can be a threat to system stability
    and security, especially if you extract as root, because the extraction can easily
    overwrite a file such as /etc/passwd. Use the --no-absolute-filenames option to
    prevent this:


    ```

    cpio --no-absolute-filenames -i -d -v -I local_bin.cpio

    ```


    Keep in mind that there are a few more cpio options that may need copy-in mode
    if it can''t figure out some of the format options of the archive for itself:

    The default cpio format depends on the byte order of the architecture of the CPU
    that was used to create the archive, so if you have an archive from a completely
    different kind of machine, you may need this:


    +   -b Switches the byte order.

    -Cn Uses n as the archive block size.

    -H name Uses name as the archive format (valid formats are bin, crc, hpbin, hpodc,
    newc, odc, tar, and ustar). Note that only GNU cpio supports all of these options.'
  merge: -1
  pgno: 301
- img_proc: true
  md: '#  13.7.3 Amanda Tapes


    Amanda is an automatic backup system that writes a “hybrid” archive on a tape.
    That is, the first 32KB block in an Amanda tape contains information about the
    archive, and the rest of the blocks make up a regular archive in tar dump format.


    If you come across an Amanda file, do the following to extract the files:


    +   1. Put the first block into a file named header:


    ```

    dd if=file of=header bs=32k count=1

    ```


    +   2. Run strings header. The output should look like this:


    ```

    AMANDA: FILE 20031117 duplex /etc lev 0 .gz program /bin/tar

    To restore, position tape at start of file and run:

    dd if=tape bs=32k skip=1 | /bin/gzip | /bin/tar -f-

    ```


    +   3. Follow the instructions. Extract the contents from the rest of the file
    as follows (if you''re using a tape drive as file, the tape head should already
    be correctly positioned, so don''t skip=1):


    ```

    dd if=file bs=32k skip=1 | unpack_command

    ```


    unpack_command should follow the output you got in step 2. For example, if you''re
    dealing with a tar archive, unpack_command might look like this:


    ```

    gzip -dc | tar xpf -

    ```


    # 13.8 Further Backup Topics


    This chapter covers the basics of manual backups for small systems. However, once
    you get into larger operations, there is much more to explore:


    +   - Automated backups. Amanda (http://www.amanda.org/) is a popular, powerful,
    and free automatic network backup package (that is, after you figure out how it
    works).


    +   - Tape changers. The Linux mtx command can operate a tape changer and autoloader.


    +   - Backups with Samba.


    +   - Commercial backup systems such as BRU.


    +   - Database backup systems (Oracle and the like).


    A good, comprehensive, and detailed guide to backups (especially for large organizations)
    is Unix Backup and Recovery [Preston].'
  merge: -1
