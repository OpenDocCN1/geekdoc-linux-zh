- img_proc: true
  md: '# 5.1 Network Layers


    If you really want to understand Linux network configuration, you must be able
    to distinguish each layer in the network. Here are the layers in the Internet,
    from the top level to the bottom level:


    Application Layer Contains the “language” that applications and servers use to
    communicate; usually a protocol of some sort. Common application layer protocols
    include Hypertext Transfer Protocol (HTTP), used for the World Wide Web, Secure
    Shell (SSH), and the File Transfer Protocol (FTP).


    Transport Layer Defines the data transmission characteristics of the application
    layer. This is host-specific information, and it includes data checking, source
    and destination ports, and specifications for breaking application data into packets.
    TCP (Transmission Control Protocol) is the most common transport layer protocol.


    Internet Layer Defines how to move packets from the source host to the destination
    host. The particular packet-transit route for the Internet is known as IP (Internet
    Protocol). This is sometimes called the network layer.


    Host-to-Network Layer Defines how to send packets from the Internet layer across
    the physical medium, such as Ethernet or a modem. This is sometimes called the
    physical layer.


    This may sound overly complicated, but it''s important that you understand it,
    because your data must travel through these layers twice before it reaches its
    destination. Your bytes leave the application layer on the source host, go down
    to the physical medium, across the medium, and then up again to the application
    layer on the destination host.


    Unfortunately, the layers sometimes bleed in strange ways, and terms like TCP/IP
    reflect the integration. The distinction is getting more vague — in particular,
    devices that only deal with the Internet layer now sometimes look at the transport
    layer data to determine where to send data.


    To connect your Linux machine to the network, you need to concentrate on the Internet
    and host-to-network layers, let''s get straight to them. If you want to know a
    lot more about layers (and networks in general), look at Computer Networks [Tanenbaum].


    You have heard of another set of layers known as the ISO OSI (Open Systems Interconnection)
    Reference Model. This is a seven-layer network model used in teaching and designing
    networks, but this book does not cover the OSI model because it is of little practical
    use for understanding how Linux Internet networking works.'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# 5.2 The Internet Layer


    The Internet as we know it is based on the Internet Protocol, version 4 (IPv4).
    The basic idea is that each computer on the Internet has a numeric IP address
    in the form of a.b.c.d, where a and d are one-byte numbers 1 to 254, and b and
    c are one-byte numbers 0 to 255. Technically, an IP address is just a four-byte
    (32-bit) number, but it''s easiest to deal with the address as a dotted-quad sequence
    of decimal numbers, like 10.23.2.37, instead of using like the hexadecimal 0x0A170225.


    A subnet is a group of IP addresses in some (hopefully) regular order. For example,
    the hosts between 10.23.2.1 and 10.23.2.254 could comprise a subnet, or all of
    the hosts between 10.23.1.1 and 10.23.2.254 could be a subnet.


    Subnets are important because they determine how your packets move between different
    machines. To communicate with another computer, your machine must know that other
    computer''s IP address. If the destination is on your local area network''s subnet,
    your system can send the data directly to that host, but if not, your machine
    probably has to send it to a gateway (or router) that transmits your data across
    another network on its way to the final destination.


    # 5.2.1 More on Subnets


    A subnet mask defines a subnet; for example, the subnet mask for 10.23.2.254 is
    255.255.255.0. In binary form, the mask ''covers'' the bits in an address that
    are common to the subnet. For example, here are the binary forms of 10.23.2.0
    and 255.255.255.0:


    ```

    10.23.2.0:    00001010 00010111 00000010 00000000

    255.255.255.0: 11111111 11111111 11111111 11111111

    ```


    Now, let''s ''cover'' the bits in 10.23.2.0 with the 1s in 255.255.255.0 by marking
    these in bold:


    ```

    10.23.2.0:    00001010 00010111 00000010 00000000

    ```


    Look at the bits that aren''t in bold. You can set any number of these bits to
    1 to get a valid IP address in this particular subnet (with two exceptions: 0s
    and all 1s).


    Putting it all together, you can see that a host computer with an IP address of
    10.23.2.1 and a subnet mask of 255.255.255.0 can directly communicate with other
    computers that have IP addresses beginning with 10.23.2 (to talk to the rest of
    the Internet, your computer needs to use a gateway). You can denote this entire
    subnet as 10.23.2.0/255.255.255.0.


    Configuring Your Network 89'
  merge: -1
