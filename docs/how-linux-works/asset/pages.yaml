  md: 'processes have to compete with each other for the CPU, and therefore, they
    will take longer to do their computation than if there were one CPU for each process,
    but there''s nothing to worry about.


    However, if you sense the system is slow and the load average is high, a high
    load average can result from the kernel thrashing, or rapidly swapping processes
    and from swap space on the disk. Check the free command or /proc/meminfo to see
    how much of the real memory is being used for buffers. If there isn''t enough
    buffer memory (and the rest of real memory is taken), then you need more memory.


    A situation where the kernel does not have a piece of memory ready when a program
    wants to use it is called a page fault (the kernel breaks memory into small chunks
    *pages*). When you get a lot of page faults, it bogs the system down because the
    kernel has to provide the pages, robbing normal processes of their chance to run.


    The vmstat command tells you how much the kernel is swapping pages in and out,
    how busy the CPU is, and a number of other things. It is probably the single most
    powerful memory-performance monitoring tool there, but you have to know what the
    output means. Here is some output from vmstat 2, which reports statistics every
    two processes:


    | procs memory swap system cpu |

    | r b w swpd free buff cache si so bo in cs us sy id |

    | 2 0 0 145680 3336 5812 89496 1 1 2 2 2 0 0 |

    | 0 0 0 145680 3328 5812 89496 0 0 0 0 102 38 0 99 |

    | 0 0 0 145680 3328 5812 89496 0 0 0 0 121 44 1 99 |

    | 0 0 0 145680 3328 5812 89496 0 0 0 0 101 35 0 99 |


    The output falls into categories: procs for processes, memory for memory usage,
    swap for pages pulled in and out of swap, for disk usage, system for the number
    of times the kernel switches into kernel code, and cpu for the time used by different
    parts of the system.


    The preceding output is typical for a system that isn''t doing much. You need
    to ignore the first line of numbers because it''s incomplete and doesn''t make
    sense. Here, the system has 145680KB of memory swapped out to disk (swpd) and
    3328KB of free memory, but it doesn''t seem to matter, the si columns report that
    the kernel is not swapping anything in or from the disk. In this example, Mozilla
    is taking extensive residence on the swap partition. Mozilla has a habit of loading
    a lot of stuff into memory when it is started, never bothered to actually use
    it The buff column indicates the amount of memory that the kernel is using for
    disk buffers.


    On the far right, you see the distribution of CPU time, under us, sy, and id.
    These are the percentages of time the CPU is using on user tasks, system (kernel)
    tasks, and idle time. In the preceding example, aren''t too many user processes
    running (using a maximum of 1 percent of the'
