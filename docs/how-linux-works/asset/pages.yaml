  md: '# 16.3.2 The tcsh Shell


    The standard csh on virtually all Linux systems is tcsh, an enhanced shell that
    popularized features such as command-line editing and multi-mode filename and
    command completion. Even if you don''t use tcsh as the default user shell (this
    book suggests using bash), you should provide tcsh startup files in case your
    users happen to come across tcsh.


    You don''t have to worry about the difference between login shells and non-login
    shells in tcsh. Upon startup, tcsh looks for a .tcshrc file. Failing this, it
    looks for the csh shell''s .csh startup file. The reason for this order is that
    you can use the .tcshrc for tcsh extensions that don''t work in csh. You should
    probably stick to using the traditional .csh instead of .tcshrc; it''s highly
    unlikely that anyone will ever use your startup files with csh. And if a user
    comes across csh on some other system, your .csh will work adequately.


    Here is sample .tcshrc file:


    ```

    # Command path.

    setenv PATH /usr/local/bin:/bin:/usr/X11R/bin:$HOME/bin


    # Manual page path.

    setenv MANPATH /usr/local/man:/usr/man:/usr/X11R6/man:$HOME


    # EDITOR and VISUAL determine the editor that programs such as less and mail clients
    invoke when asked to edit a file.

    setenv EDITOR vi

    setenv VISUAL vi


    # PAGER is the default text file viewer for programs such as.

    setenv PAGER less


    # These are some handy options for less.

    setenv LESS mei


    # By default, give other users read-only access to most new files.

    umask 022


    # Customize the prompt.

    # Substitutions include:

    # %n username %m hostname %/ current directory

    # %h history number %l current terminal %% %%

    set prompt="%m%%%"

    ```'
  merge: -1
