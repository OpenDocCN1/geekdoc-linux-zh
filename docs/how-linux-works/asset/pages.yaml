    # Loadable Module Support


    You have some control over the kernel''s module loader. In general, you should
    always activate the kernel module system with the **Enable loadable module support**
    option, as well as activating the kernel module loader option, **Automatic kernel
    module loading**, sometimes called the autoloader.

    The only item in the kernel module support menu that you should be wary of versioning
    support (at the moment, this is experimental). Kernels compiled with this option
    may try to load modules built for a different kernel version, and this can cause
    trouble if you don''t know what you''re doing.


    # Processor Type and Features


    The Linux kernel includes a number of optimizations and other enhancements that
    are specific to certain processors. You can choose your processor with the **Processor**
    family option. Be careful — a kernel built for a "primitive" CPU supports advanced
    processors, or a kernel tailored to an advanced CPU will likely not work on an
    older (or different brand of) CPU.

    Significant options in the processor category include:


    +   **High memory support** This is for machines with more than 2GB of physical
    memory.


    +   **Symmetric multi-processing support** This is for machines with more than
    one processor.


    +   **MTRR support** This permits optimizations that may improve certain kinds
    of graphics performance.


    # Power Management Options


    There are two types of power management in PC hardware: the older APM (Advanced
    Power Management) and the new ACPI (Advanced Configuration and Power Interface).
    You can configure a kernel with both varieties. Appropriate power management support
    is essential on notebooks to preserve battery life, and it is a good idea for
    desktops so that your machine doesn''t generate too much heat and use much electricity.


    Power management features enable interesting tricks with fans, processor speeds,
    and more. There''s a lot to explore, but you may need additional software such
    as `apmd` or `acpid` to take advantage of the kernel features.'
