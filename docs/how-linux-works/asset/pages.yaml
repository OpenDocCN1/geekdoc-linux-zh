    The $? holds the exit code of the last command that the shell executed. Exit codes
    are critical to mastering shell scripts, and they''re discussed next.


    # 7.4 Exit Codes


    When a Unix program finishes, it leaves an exit code for the parent process that
    started the program. The exit code is a number and is sometimes called an error
    code. When the exit code is zero (0), this means that the program ran without
    problems. However, if the program has an error, it usually exits with some number
    other than 0.


    The exit code of the last command is held in the $? variable, so you can check
    it out for yourself at your shell prompt:'
