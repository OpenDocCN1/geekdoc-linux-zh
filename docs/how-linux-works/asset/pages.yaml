- img_proc: true
  md: '# # 10.3 Getting the Source Code


    Linux kernel versions have three components. Suppose you have kernel release 2.6.3.
    Here''s what the numbers mean:


    +   - 2 is the major release number.

    - 6 is the minor release number.

    - 3 is the patchlevel. Kernels with the same major and minor numbers but with
    different patchlevels belong to a release series.


    There are two different kinds of kernel releases:


    +   - Production releases have minor version numbers that are even (for example
    1.2.x, 2.0.x, 2.2.x, 2.4.x, 2.6.x, and so on). These versions are meant to be
    as stable as possible. Within a single production release series, there are no
    radical feature or interface changes.

    - Development releases have minor version numbers that are odd (such as 2.5).
    Don''t use a development release if you aren''t willing to take risks. Kernel
    developers inevitably break code, introduce new features, and may inadvertently
    make the kernel unstable in a development stays. Stay away from development releases
    unless you know what you''re doing.


    You can get the latest Linux source code at http://www.kernel.org/. The releases
    have names like linux-version.tar.bz2 for bzip2 compression or linux-version.tar.gz
    for GNU compression. Bzip2 archives are smaller.


    In addition to the full releases available in the kernel archives, you also find
    patches containing the changes between two consecutive kernel patchlevels. Unless
    you are obsessed with upgrading your kernel with every single release, you probably
    won''t be able to do much with a patch.


    # ## 10.3.1 Unpacking the Source Archive


    You can unpack kernels with zcat /bzip2 and tar. To get started, go to /usr/src
    and make your permissions less restrictive if necessary:


    ```

    cd /usr/src

    umask 022

    ```


    Then run one of these commands to extract the source files, depending on whether
    you are using bzip2 or GNU Zip:


    ```

    bzip2 -dc linux-version.tar.bz2 | tar xvf -

    zcat linux-version.tar.gz | tar xvf -

    ```


    > WARNING If your kernel release is 2.4.18 or lower, the kernel unpacks into a
    directory named linux rather than linux-version. Rename any existing linux directory
    before unpacking one of these kernels (the new name does not matter, as it is
    different than the old one).'
  merge: -1
