  md: 'To install the GRUB software, run this command to put the boot sector on your
    disk:


    ```

    grub-install device

    ```


    Here, device is your boot device, such as /dev/hda. However, if you need a special
    /boot partition, you need to do something like this:


    ```

    grub-install --root-directory=/boot device

    ```


    After running grub-install, review /boot/grub/device.map file to make sure that
    the devices relevant to booting the kernel are in the map file and agree with
    your menu.lst file.


    # 10.5.3 LILO


    To load your kernel with LILO, you must settle on a permanent location for your
    kernel image and install a new boot block for every change you make to the kernel
    configuration.


    Let''s say you want to boot /vmlinuz as your kernel with a root partition of /dev/hda1.
    Furthermore, you want to install the boot loader on /dev/hda (replacing the MBR).
    Do the following:


    +   Move the new image in place at /boot/vmlinuz


    +   Create the LILO configuration file, /etc/lilo.conf. An elementary configuration
    might look like this:

    ```

    boot=/dev/hda

    root=/dev/hda1

    install=/boot/boot.b

    map=/boot/map

    vga=normal

    delay=20

    ```


    ```

    image=/boot/vmlinuz

    label=Linux

    read-only

    ```


    +   Run LILO -t -v to test the configuration without changing the system.

    Run LILO to install the boot loader code at /dev/hda.


    You can add more images and boot sectors to the LILO configuration. For example,
    if you saved your previous kernel as /boot/vmlinuz.0, you could add this to your
    lilo.conf to make the old image available as backup at the LILO prompt:


    ```

    image=/boot/vmlinuz.0

    label=backup

    read-only

    ```'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'You can use the other keyword for foreign operating systems. The following
    addition to lilo.conf offers a Windows partition on /dev/hda3 as dos at the LILO
    prompt:


    ```

    other=/dev/hda3

    label=dos

    ```


    # LILO Parameters


    Some of the most important lilo.conf parameters are listed here:


    +   - **bootdev** Writes the new boot sector to the bootdev device.

    - **root=rootdev** Uses rootdev as the kernel''s default partition.

    - **read-only** Mounts root partition initially as read-only. You should include
    this for normal boot situations (init remount the root partition in read-write
    mode later).

    - **append="options"** Includes options as kernel boot parameters.

    - **num** Displays LILO prompt for num tens of a second at time before booting
    the kernel image.

    - **map=map_file** Stores the kernel''s location in map_file. Don''t delete this
    file.

    - **install=file** Specifies that file is the actual boot loader code that lilo
    writes to the boot sector.

    - **image=file** Defines a bootable kernel image with file. You should always
    use the label parameter directly following this definition to name the image.

    - **label=name** Uses name to label the current boot entry.

    - **other=partition** Defines another partition that contains a boot sector; analogous
    to image for other operating systems. Use label to define a boot sector.

    - **linear** Remaps the boot sector load references when the BIOS disk geometry
    is different than the Linux kernel sees. This is usually not necessary, because
    most modern BIOS can recognize large disks.


    # 10.5.4 Initial RAM Disks


    An initial RAM disk is a temporary root partition that the kernel should mount
    before anything else. Red Hat Linux uses initial RAM disks to support SCSI controller
    drivers and other drivers that are compiled as modules.


    **NOTE** You do not need an initial RAM disk if you compile all the drivers necessary
    to mount your filesystem directly into your kernel. The overwhelming majority
    of systems do not need an initial RAM disk.'
  merge: -1
