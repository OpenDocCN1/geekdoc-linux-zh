  md: "In the bad old days, there was one central hosts file that everyone repeatedly\n\
    coped to their own machine to stay up to date. This might have worked for\nhandful\
    \ of machines, but as the ARPANET/Internet grew, this quickly\nout of hand. The\
    \ Domain Name System (DNS) decentralized hostname\nresolution. The idea is that\
    \ your machine's resolver (in the C library) asks\nnameserver for the IP address\
    \ corresponding to a hostname. If the name-\nserver does not know, it can find\
    \ out who is responsible for that name and\nast for the IP address from the responsible\
    \ party's nameserver. If you do not\nalready know the DNS server addresses that\
