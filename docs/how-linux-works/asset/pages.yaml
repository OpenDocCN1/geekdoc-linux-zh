  md: '# 4.5 Setting the Time


    A well-functioning Unix machine depends on accurate timekeeping. The kernel is
    responsible for maintaining the system clock, the clock consulted when you run
    commands such as date. You can also set the system clock with the date command,
    but this is usually a bad idea, because you''ll get the time exactly right. You
    want your system clock to be very close to the correct time.


    PC hardware has a battery-backed ``real-time``. It''s not the greatest clock in
    the world, but it''s better than nothing. The kernel usually sets its time based
    on this clock at boot time, and you can reset the system clock to the current
    hardware time with hwclock. If your hardware clock is in UTC (Universal Coordinated
    Time, or Greenwich Mean Time), run this command:


    ```

    hwclock --hctos --utc

    ```


    You should try to keep your hardware clock in UTC to avoid any trouble with time
    zone or daylight savings time corrections. However, if you insist on keeping the
    hardware clock set to the local time, run this command instead:


    ```

    hwclock --hctos --localtime

    ```


    Unfortunately, the kernel isn''t terribly good at keeping time, and because Unix
    machines often stay up for many years and at a time, they tend to develop a drift.
    In addition, it''s fairly rude to make the system clock jump ahead or back by
    running hwclock on a frequent basis; time-based system events can get lost or
    munged. If you want to gradually change the system clock based on the hardware
    clock, run this command:


    ```

    adjtimex --adjust

    ```


    # 4.5.1 Time Zones


    The system clock runs in UTC. System libraries convert this into local time and
    compensate for daylight savings time and any other circumstances (such as living
    in Indiana).


    To set your system''s time zone, make a symbolic link to the appropriate time
    zone file in /usr/share/zoneinfo /etc/localtime. For example, here is the command
    to configure a United Pacific Time Zone setting:


    ```

    ln -sf /usr/share/zoneinfo/US/Pacific /etc/localtime

    ```'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'A long listing of the link should contain this output:


    /etc/localtime -> /usr/share/zoneinfo/US/Pacific


    If you want to use a different time zone than the system default, you can do by
    setting the TZ environment variable like this:


    ```

    $ export TZ=US/Central

    $ date

    ```


    # 4.5.2 Network Time


    If your machine is permanently connected to the Internet, you can run an NTP (Network
    Time Protocol) daemon and get the time from a remote server. The main NTP Web
    page is http://www.ntp.org/, but if you don''t really feel like reading through
    the mounds of documentation, do this:


    +   - Ask your ISP for the closest NTP time server.

    - Put that server in /etc/ntpd.conf.

    - Run ntpd server at boot time.

    - Run ntpd at boot time.


    If your machine does not have a permanent Internet connection, you can use a daemon
    as chronyd to maintain the time during disconnections.


    > HINT You can also set your hardware clock based on the network time. First,
    set your system time from the network with ntdate (or ntpd). Then run this command:


    ```

    hwclock --systohc -utc

    ```


    # 4.6 Scheduling Recurring Tasks with cron


    Unix provides a service called cron that runs programs repeatedly on a fixed schedule.
    Most experienced administrators consider cron to be vital to the system because
    it can perform automatic system maintenance. For example, cron logs file rotations
    utilities. You should know about cron not only in the interest of knowing everything
    that runs on your system, but also because it is just useful.


    You can run any program with cron, choosing the times that suit you. A program
    running through cron is called a cron job. To install a cron job, you need to
    create an entry line in your crontab file, usually with the crontab command. Here
    is a typical crontab file entry that runs a command daily at 9:15:


    ```

    15 09 * * * /home/juser/bin/spam

    ```'
  merge: -1
