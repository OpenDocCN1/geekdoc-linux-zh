- img_proc: true
  md: '# Staying Up to Date


    One make fundamental is that targets should be up to date with their dependencies.
    If you type make twice in a row for the preceding example, the first command builds
    myprog, the second command yields your output:


    ```

    make: Nothing to be done for ''all''.

    ```


    For this second time through, make looked at its rules and noticed that myprog
    already exists. To be more specific, make did not build myprog again because none
    of the dependencies had changed since the last time it built myprog. You can experiment
    with this follows:


    +   - Run touch aux.c.

    - Run make again. This time, make figures out that aux.c is newer than aux.o already
    in the directory, so it must compile aux.o again.

    - myprog depends on aux.o, and now aux.o is newer than the preexisting myprog,
    so make must create myprog again.


    This type of chain reaction is very typical.


    # Command-Line Options


    You can get great deal of mileage from make if you know how its command-line options
    work.


    The most common make option is specifying a single target on the command line.
    For the preceding Makefile, you can run make aux.o if you want only the aux.o
    file.


    You can also define a macro on the command line. Let''s say that you want to use
    a different compiler called my_bad_cc. Try this:


    ```

    make CC=my_bad_cc

    ```


    Here, make uses your definition of CC instead of its default compiler, cc. Command-line
    macros come in handy when you are testing out preprocessor definitions and libraries,
    especially with the CFLAGS and LDFLAGS macros explained.


    You don''t even need a Makefile to run make. If built-in make rules match a target,
    you can just ask make to try to create the target. For example, if you have the
    source to a simple program called blah.c, try make blah. The make runs tries the
    following command:


    ```

