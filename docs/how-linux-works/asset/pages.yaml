  md: 'You can write an image to the burner with cdrecord:


    ```

    cdrecord -v dev=device speed=speed image.iso

    ```


    Before writing an image to a CD, you may also wish to test it with the loopback
    device (just remember to unmount it when finished!):


    ```

    mount -r -t iso9660 -loop=/dev/loop0 image.iso /mnt

    ```


    # Using a Pipeline


    If you don''t want to create a temporary image file, you can attempt to create
    the image and write to the CD device in one pipeline:


    ```

    mkisofs -r directory | cdrecord -v dev=device speed=speed -

    ```


    The only problem you may encounter with this is a buffer underrun, if mkisofs
    cannot produce data quickly enough for cdrecord to consume. If you run into a
    problem like this, one possible remedy is to lower speed, or you can see if there
    are any other processes on your system that are hogging the CPU.


    # 11.3 Introduction to USB


    Linux supports a wide variety of USB (universal serial bus). A USB system on a
    PC consists of a host controller inside your computer, hubs that splitters give
    to you ports, and the actual USB devices. The Linux kernel supports USB devices
    through three types of drivers:


    +   * Host interface drivers

    * USB device drivers

    * Other drivers not necessarily related to USB, but required by a USB device driver
    (for example, the USB mass storage driver requires the SCSI disk support)


    When the host interface recognizes a controller, the kernel logs messages as these:


    ```

    ohci_hcd: 2003 Oct 13 USB 1.1 ''Open'' Host Controller (OHCI) Driver (PCI)

    ohci_hcd 0000:00:02.0: irq 9, pci mem d4b806000

