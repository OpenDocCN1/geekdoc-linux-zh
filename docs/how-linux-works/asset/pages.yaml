  md: '# 11.4 IEEE 1394/FireWire Disks


    IEEE 1394 (also known as FireWire) drivers are relatively new to Linux. The Linux
    IEEE 1394 driver system is similar to that of the USB system, and the Linux kernel
    support for IEEE 1394 includes the base module (ieee1394) and host interface drivers.
    One common interface is OHCI-1394 (which has a module name of ohci1394), and the
    TI PCIlynx interface also has a driver (pciynx).


    Kernel messages like the following indicate that the host interface driver detected
    the:


    ```

    ohci1394_0: OHCI-1394 1.1 (PCI): IRQ=[26] MMI0=[906000-90067ff] Max Packet=[2048]

    ee1394: Node added ID:BUS[0-02:1023] GID[0010800200500cb4]

    ```


    IEEE 1394 hard disks use SBP-2 (Serial Bus Protocol). In the USB bus storage code,
    the linux sbp2 driver masquerades as a SCSI controller. When you plug in a drive,
    look for these kernel messages:


    ```

    scsi0 : SCSI emulation for IEEE-1394 SBP-2 Devices

    ee1394: sbp2: Logged into SBP-2 device

    ee1394: sbp2: Node 0-02:1023: Max speed [5400] Max payload [2048]

    ee1394: Node added ID:BUS[0-02:1023] GID[00090a95000001796]

    ```


    If your system does not have hotplug support (see Section 11.5), you may need
    to probe the SCSI bus with the rescan-scsi-bus.sh script earlier to get the kernel
    to recognize the IEEE 1394 drive. Upon recognizing the drive, the kernel emits
    the usual SCSI drive messages:


    | WDC Model: FireWire/USB2.0 Rev: 4.17 |

    | Type: Direct-Access ANSI SCSI revision: 06 |

    | blk: queue fffffc0c15d4d28, no I/O memory limit |

    | Attached scsi drive at scsi, channel 0, id 0, lun 0 |

    | SCSI device: 234441648 512-byte hwd sectors (120034 MB) |

    | sda1 sda2 ||


    NOTE The iPod is an SBP-2 device. To access the disk and its filesystem, you need
    appropriate filesystem support and possibly the appropriate partition table support
    in your kernel. The PC version of the iPod uses the FAT32 system, so you can use
    the vfat filesystem. The Macintosh version uses a completely different filesystem
    type, so you need the Macintosh partition map support in your kernel, as well
    as Macintosh filesystem (HFS) support as a module or compiled directly the kernel.


    # 11.5 Hotplug Support


    Now we''ve covered Linux USB and IEEE 1394 support, you should learn a little
    about Linux hotplug support, a system that can handle the automatic configuration
    and cleanup of devices when you plug them into the system.'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'The idea is simple; the kernel runs /sbin/hotplug when you plug in a device.
    Here''s the procedure:


    +   1. You plug in a device. The kernel notices.

    2. The kernel runs /sbin/hotplug, where type is the device type (usb, ieee1394,
    sci, and so on). The kernel sets a number of device-related environment variables
    in the new hotplug process.

    3. The /etc/hotplug script runs /etc/hotplug/type.agent.

    4. The /etc/hotplug/type.agent script tries to configure the device.


    There really isn''t much more to it than. Each device type''s .agent file has
    its own method of configuring devices. For example, usb.agent goes through these
    steps:


    +   1. usb.agent looks in /etc/hotplug/usb.dmap and /etc/hotplug/usb.umap to locate
    a kernel module for the devices.

    2. Having identified a module, usb.agent attempts to load the module.

    3. If /etc/hotplug/type exists, usb.agent runs that program.


    Linux hotplug is almost entirely script-driven, which means that the details are
    even more subject to change than the rest of Linux. However, keep in mind that
    if you have problems or questions you can always read the hotplug scripts to determine
    what they are trying to do, even if the documentation is inadequate or out of
    date.


    # 11.6 PC Cards (PCMCIA)


    Linux PCMCIA support is highly dependent on kernel versions. If you upgrade your
    kernel, you almost certainly need to upgrade your PCMCIA drivers and tools.


    Although some of the core PCMCIA drivers are in the main Linux distribution, you
    still need the pcmia-cs package for additional drivers and system utilities. The
    components of the PCMCIA system include the following:


    +   * Kernel modules for PC Card interface controllers and individual PC Cards.
    These modules go in /lib/modules/version/pcmia.

    * The /sbin/cardmgr daemon for managing configuration when insert or remove a
    card.

    * Various support utilities and services, located in /etc/pcmcmia and /sbin.


    There are many pieces of the system to set up and configure by hand, so pcmia-cs
    package provides several scripts to get you on your way. The most important of
    these is an init.d script pcmia, where, depending on your distribution, you may
    need to modify a few lines to specify which PCMCIA interface controller you have.
    Look at this section:'
