  md: 'For example, if you specify --prefix=/tmp/test, make install puts binaries
    in /tmp/test/bin, libraries in /tmp/test/lib, and so on.


    Versions of configure have a --help option that lists other configuration options.
    Unfortunately, the list is so long that it''s hard to figure out what might be
    important. Here are some other options:


    +   - --bindir=directory Installs executables in directory.

    - --sbir=directory Installs system executables in directory.

    - --libdir=directory Installs libraries in directory.

    - --disable-shared Prevents the package from building shared libraries. Depending
    on the library, this can save hassles later on (see Section 9.4.1).

    - --with-package=directory Tells configure that package is in directory. This
    is handy when a necessary library is in a nonstandard location. Unfortunately,
    not all configure scripts recognize this type of option, and furthermore, it can
    be difficult to determine the exact syntax.


    You can create separate build directories if you want to experiment with some
    of these options. To do this, create a new directory anywhere in the system, and
    from that directory, run the configure script in the original package source code.
    You will find that configure makes a symbolic link in your build directory, where
    all of the links point back to source in the original package directory. Some
    developers actually prefer that you build packages this way.


    # 9.2 Environment Variables


    You can influence configure with environment variables that the configure script
    puts into make variables. The most important variables are CPPFLAGS, CFLAGS, and
    LDFLAGS. Be aware that configure can be very picky about environment variables.
    For example, you should always use CPPFLAGS instead of CFLAGS for header file
    directories, because configure often runs the preprocessor independently of the
    compiler.


    In bash, the easiest way to send an environment variable to configure is by placing
    the variable assignment in /configure on the command line. For example, to define
    a DEBUG macro for the preprocessor, use this command:


    ```

    CPPFLAGS=-DDEBUG ./configure

    ```


    Environment variables are especially handy when configure doesn''t know where
    to look for third-party include files and libraries. For example, to make the
    preprocessor search in include_dir, run this command:


    ```

    CPPFLAGS=-Iinclude_dir ./configure

    ```'
