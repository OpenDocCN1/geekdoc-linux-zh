- img_proc: true
  md: 'All characters located between the two single quotes, including any spaces,
    make up a single literal. Therefore, the following command does not work, because
    it asks the grep command to search for r.*t /etc/passwd from the standard input
    (because there is only one parameter):


    ```

    grep ''r.*t /etc/passwd

    ```


    Double quotes(") work like single quotes, except that the shell expands any variables
    that appear within double quotes, whereas it does not expand variables located
    between single quotes. You can see the difference by running the following command
    and then replacing the double quotes with single quotes and running it again.


    ```

    echo "There is no * in my path: $PATH"

    ```


    One trick to use using literals with the Bourne shell is passing a literal single
    quote to a command. One way to do this is to place a backslash before the single
    quote character:


    ```

