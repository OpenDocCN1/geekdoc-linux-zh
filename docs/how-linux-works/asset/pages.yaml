    # 7.5.1 && && || Logical Constructs


    There are two quick-line conditional constructs that you may see from time to
    time: && ("and") || ("or").

    The && construct works like this:


    ```

    command1 && command2

    ```


    Here, the shell runs command1, and if the exit code is 0, it also runs command2.

    The || construct is similar; if the command before a || returns a nonzero exit
    code, the shell runs the second command.

    && || often find their way into use if tests. In both cases, the exit code of
    the last command determines how the shell processes the conditional. if the first
    command fails, the shell uses its exit code for the statement, but if the first
    command is successful, the shell uses the exit code of the second command for
    the conditional. ||, the shell uses the exit code of the first command successful,
    or the exit code of the second if first is unsuccessful.

    Here is an example:


    ```

    #/bin/sh

    if [ "$1" = hi ] || [ "$1" = bye ]; then

    echo ''The first argument was "$1''


    ```


    If your conditionals include the test ([]) (as here), you can use -a and -o instead
    of && and ||, as described in the next section.


    # 7.5.2 Testing Conditions


    You have already seen how works; the exit code is 0 if the test is true and nonzero
    when the test fails. You also know how to test string equality with


    ```

    [ str1 = str2 ]

    ```


    However, remember that shell scripts are well suited to operations on entire files.
    An important reason for this is that the most useful [ tests involve file properties.
    For example, the following line checks whether file is a regular file (not a directory
    or special file):


    ```

    [ -f file ]

    ```


    In a script, you might see the -f test in a loop similar to this next one, tests
    all of the items in the current working directory:'
  merge: -1
