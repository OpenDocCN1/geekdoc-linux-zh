  md: '# 17


    # # BUYING HARDWARE FOR LINUX


    Computers are frustrating. Simply shopping for one is enough to drive a sane person
    mad, and if you want a Linux machine, you might as well sign up for therapy now.
    Aside from relatively low hardware prices, the cards are stacked against you.
    A confusing barrage of specifications and incompatibilities awaits you in your
    quest, and along the way, you must often confront extremely lame advertising for
    what are often the ugliest examples of industrial design in history.


    This chapter is a field guide to hardware selection. Although hardware is in a
    constant state of flux, the good news is that an old adage applies: The more things
    change, the more they stay the same. If you can see hardware in more abstract
    terms, you have everything you need to make an educated purchase. Despite the
    constant escalation of specifications, a computer still has a processor (CPU),
    random-access memory (RAM), secondary storage, and some'
  merge: -1
  pgno: 331
- img_proc: true
  md: 'I/O devices. Every now and then, some underlying technology may change, but
    nothing is going to stop memory from doing anything other than storing a bunch
    of ones and zeros.


    Here are three guidelines that you should remember:


    **Know what you want, and don''t lose sight of it** This usually comes down to
    a price versus performance trade-off, but details such as ergonomics can be just
    important.


    **Don''t listen to vendors** They generally want to sell you the most expensive
    thing in the store even though it not work correctly. In addition, these people
    are trained to sell systems for Windows users — in most cases they''re not aware
    of hardware issues important to Linux users.


    **You often get what you pay for** However, refer to Rule 1 first: is the more
    expensive hardware what you really need and want?


    # # 17. Core Components


    The discussion in this chapter focuses on desktop computers. With the exception
    of notebooks, I build my machines from components. The goal is not to save money;
    in fact, the finished system costs more than similarly outfitted preassembled
    computers. The advantage is that there are fewer headaches with custom configurations.
    If you know exactly what goes into your computer, you will have no surprises,
    and in this territory, surprises come in the unpleasant variety. You don''t want
    hardware that Linux doesn''t support, and an unreliable piece of hardware can
    seriously degrade your quality of life.


    Assembling a computer is easy, but it isn''t for everyone. It takes time and a
    certain amount of dexterity to avoid hurting on sharp electronic pieces. If you
    don''t want to go for an off-the-shelf model that may contain unknown components,
    and you also don''t want to assemble your computer yourself, you have two choices.
    You can find out what is in that off-the-shelf model you''re looking at, and then
    determine whether the parts will work with Linux. Reliable manufacturers list
    this information and do not substitute parts. Your other choice is to buy custom
    parts and have a small computer shop or friend assemble them for you. If you go
    to a shop, make it clear that component substitution is unacceptable.


    You need the following components:


    +   - A motherboard. Modern motherboards have integrated hard drive interfaces,
    well as USB and many other I/O ports.


    +   - A processor (CPU).


    +   - Random-access memory (RAM).


    +   - A hard disk.


    +   - An Ethernet NIC card (optional).'
