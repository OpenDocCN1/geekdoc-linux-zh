- img_proc: true
  md: '# 10.8.2 modprobe Configuration


    The modprobe program reads /etc/modprobe.conf for important device information.
    Most entries are aliases such as this:


    alias eth0 tulip


    Here, the kernel loads the tulip module if you configure the eth0 network interface.
    In other cases, you may need to specify drivers by their major device numbers,
    such as this entry for an Adaptec host controller:


    alias block-major-8 aic7xxx


    Wildcards are also possible in modprobe.conf aliases. For example, if all of your
    Ethernet interface cards use the tulip driver, you can use this line to catch
    all interfaces:


    alias eth* tulip


    > NOTE The modules discussed here are the ones that go with kernel version 2.6.0.
    These programs are part of the module-init-utils package. Earlier kernel versions
    used the modutils package. The most significant difference between the two sets
    of utilities is that the new package reads modprobe.conf instead of modules.conf.
    The syntax in both files is very similar.


    # Chaining Modules and the install Keyword


    You can chain modules together with the install keyword. For example, for SCSI
    disk support isn''t compiled directly into the kernel, you can force it, as in
    this example for /dev/sda from the Adaptec host controller from the preceding
    section:


    alias block-major-8 my_scsi_modules

    install my_scsi_modules /sbin/modprobe sd_mod; /sbin/modprobe aic7xxx


    This works as follows:


    +   - A process (or the kernel) tries to access /dev/sda. Assume that this device
    is not yet mapped to an actual device.

    - The kernel sees that /dev/sda isn''t mapped to its device, which has a block
    major number of 8. Therefore, the kernel runs this command:


    ```

    modprobe block-major-8

    ```


    +   - modprobe searches though /etc/modprobe.conf for block-major-8 and finds
    the alias line.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '+   4. The alias line says to look for my_scsi_modules, so modprobe runs itself,
    this time as follows:


    ```

    modprobe my_scsi_modules

