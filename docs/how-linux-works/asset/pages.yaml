- img_proc: true
  md: "# 12.5.13 Troubleshooting CUPS\n\nWhen you have a problem with CUPS, it's particularly\
    \ important to take things one step at a time. You may find this sequence helpful:\n\
    \n+   Make sure CUPS is working by creating a test printer with no filters (raw\
    \ mode) and a device of file:/dev/null. Send a test file to the printer with the\
    \ Web interface and lp, and verify that the job complete with lplstat\n```bash\n\
    lplstat -o test_printer_name\nlplstat -o test_printer_name\n```\n\n+   Use your\
    \ printer's PPD file to activate your filter. See Sections 12.5.4 and 12.5.6 for\
    \ more detail if something goes wrong. Print test files, making sure that the\
    \ job finishes.\nAdd the printer's actual device, and then try another test job.\
    \ If necessary, try printing to a file, sending the file directly to the printer.\n\
    \nIf a test job fails and stalls, the printer state changes to \"not ready,\"\
    \ and you need to start the printer again to retry the job or run any new jobs.\
    \ Do this with enable printer or the Web interface. Before starting changes around,\
    \ you should look at your log files, which are described in the next section.\n\
    \n# Error Messages\n\nThe complex nature of the print spooler and filters makes\
    \ it crucial that you pay careful attention to your log messages. The most important\
    \ log file is /var/log/cups/error_log (the name is slightly misleading because\
    \ the file contains normal diagnostic messages).\nLooking at the log reveals this\
    \ format:\n\n```\n[timestamp] Started filter /usr/lib/cups/filter/pstops (PID\
    \ 3344) for job 26\n[timestamp] ProcessIPPRequest: 10 status_code=0\n[timestamp]\
    \ [Job 26] unable to open print file : Permission denied\n```\n\nThe letter at\
    \ the start of the line indicates the message severity or priority. The three\
    \ letters in the preceding example are as follows:\n\n+   An informational log\
    \ message. These notices indicate some significant event, such as a filter invocation\
    \ or job submission.\nA verbose debugging message. You should not care about these\
    \ unless you run into a problem.\n error message indicating that something doesn't\
    \ work. The CUPS scheduler usually keeps running if there is an error. However,\
