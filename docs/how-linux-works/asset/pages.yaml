  md: 'CFLAGS=$(CFLAGS) $(X_INCLUDES) $(PNG_INCLUDES)

    LDFLAGS=$(LDFLAGS) $(X_LIB) $(PNG_LIB)


    Object files are usually grouped according to executables. Let''s say that you
    have a package that creates executables called boring and quite. Each has its
    own .c source file and requires the code in util.c. You might see something like
    this:


    ```

    UTIL_OBJS=$util.o

    ```


    ```

    BORING_OBJS=$(UTIL_OBJS) boring.o

    TRITE_OBJS=$(UTIL_OBJS) trite.o

    ```


    The rest of the Makefile might look like this:


    ```

    all: $(PROGS)

    ```


    ```

    boring: $(BORING_OBJS)

    $(CC) -o $ $(BORING_OBJS) $(LDFLAGS)

    ```


    ```

    trite: $(TRITE_OBJS)

    $(CC) -o $ $(TRITE_OBJS) $(LDFLAGS)

    ```


    You could combine the two targets into one rule, but this is usually not good
    practice because you would not easily able to move a rule to another Makefile,
    delete an executable, or group executables differently. Furthermore, the dependencies
    would be incorrect — if you had just one rule for boring and trite, trite would
    depend on boring.c, and boring would depend on trite.c, and make would always
    try to rebuild both programs whenever you changed one of the two source files.


    > NOTE If you need to define a special rule for an object file, put the rule for
    the object file just above the rule that builds the executable. If several executables
    use the same object file, put the object rule above all of the executables.


    # 8.2 Debuggers


    The standard debugger on Linux systems is gdb, with DDD as a graphical frontend.
    To enable full debugging in your programs, you must run the compiler with the
    -g option to write a symbol table and other debugging information into the executable.
    To start gdb on an executable run this command:


    ```

    gdb program

    ```'
