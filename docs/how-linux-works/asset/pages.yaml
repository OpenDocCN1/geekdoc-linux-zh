  md: 'As in the previous chapters, there is virtually no networking material here.
    The network is separate from the elementary parts of the system. In Chapter 5
    you will see where the network fits in.


    # 4.1 System Logging


    Most programs write their diagnostic output to the syslog service. The syslog
    daemon waits for messages, and depending on the type of message received, funnels
    the output to a file, the screen, users, some combination of these, or just ignores
    it. The system logger is one of the most important parts of the system. When something
    goes wrong and you don''t know where to start, you should check the system logs
    first. Here is a sample log message:


    ```

    Aug 19 17:59:48 duplex sshd[484]: Server listening on 0.0.0.0 port 22.

    ```


    Most Linux distributions use the /var/log directory to store log files, but you
    can find out by looking at /etc/syslog.conf, the syslogd configuration file. It
    contains lines like:


    ```

    kern.* /dev/console

    *.info;authpriv.none /var/log/messages

    authpriv.* /var/log/secure,root

    mail.* /var/log/maillog

    cron.* /var/log/cron

    *.emerg *

    local7.* * /var/log/boot.log

    ```


    The type of information to be logged is on the left, and the place where it is
    logged to on the right. Most of the log targets in this example are normal files,
    but there are some exceptions: /dev/console is a special device for the system
    console, root means to send a message to the super user if you are logged in,
    and * means to send a message to all users currently on the system. You can also
    send messages to another host with @host.


    Log messages carry a facility and a priority. The facility is a general category
    of message (Check the syslog.conf(5) manual page for a current list of all facilities).
    Most are fairly obvious from their name (mail, for example). The preceding syslog.conf
    sample catches messages carrying the authpriv, mail, cron, and local7 facilities.
    In line 6, * is a wildcard that catches output related to all facilities.


    In syslog.conf file, the priority follows the dot (.) after the facility. The
    priority may be one of debug, info, notice, warning, err, crit, alert, or emerg.
    This is also the order of the priorities, with emerg being the highest.


    NOTE You can exclude log messages from a facility in syslog.conf by specifying
    a priority of none, as shown on line 2 of the preceding example.'
