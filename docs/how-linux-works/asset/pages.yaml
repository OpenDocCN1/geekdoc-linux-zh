  md: '# 3


    # HOW LINUX BOOTS


    You now know the physical structure of a Linux system, what the kernel is, and
    how to work with processes. This chapter teaches you how the system starts (boots)
    — that is, how the kernel gets into memory and how the regular system processes
    get started.


    As it turns out, there isn''t much to the boot process:


    +   1. A boot loader finds the kernel image on the disk, loads it into memory,
    and starts it.


    +   2. The kernel initializes the devices and its drivers.


    +   3. The kernel mounts the root filesystem.


    +   4. The kernel starts a program called init.


    +   5. init sets the rest of the processes in motion.


    +   6. The last processes that init starts as part of the boot sequence allow
    you to log in.'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'Identifying each stage of the boot process is invaluable in fixing boot problems
    and understanding the system as a whole. To start, zero in the boot loader, which
    is the initial screen or prompt you get after computer does its power-self-test,
    asking which operating system to run. After you make a choice, the boot loader
    runs the Linux kernel, handling control of the system to the kernel.


    There is a detailed discussion of the kernel elsewhere in this book (Section 2.2
    explains the role of the kernel, and Chapter 10 tells you how to build one yourself),
    but this chapter covers the kernel initialization stage, the stage when the kernel
    prints a bunch of messages about the hardware present on the system. The kernel
    starts just after it displays a message proclaining that the kernel has mounted
    the root filesystem:


    VFS: Mounted root (ext2 filesystem) readiness.


    Soon after, you will see a message about init starting, followed by system startup
    messages, and finally you get a login prompt of some sort.


    > On Red Hat Linux, the init note is obviously obvious, because it "welcomes"
    you to "Red Hat Linux." All messages thereafter show success or failure in brackets
    at the right-hand side of the screen.


    Most of this chapter deals with init, because it is the part of the boot sequence
    where you have the most control. Section 3.2 deals with the boot loaders.


    # 3.1 init


    There is nothing special about init. It is a program just like any other on the
    Linux system, and you''ll find it in /sbin along with other system binaries. The
    main purpose of init is to start and stop other programs in a particular sequence.
    All you have to know is how this sequence works.


    There are a different variations, but most Linux distributions use the System
    V style discussed here. Some distributions use a simpler version that resembles
    the BSD init, but you are unlikely to encounter this.


    # 3.1 Runlevels


    At any time on Linux system, a certain base set of processes is running. This
    state of the machine is called runlevel, and it is denoted with a number from
    0 through 6. The system spends most of its time in a single runlevel. When you
    shut down the machine, init switches to a different runlevel in order to terminate
    the system services in an orderly fashion and to tell the kernel to stop. Another
    runlevel is for single-user mode, discussed in Section 3.2.4.


    The easiest way to get a handle on runlevel is to examine the init configuration
    file, /etc/inittab. Look for a line like following:'
