    # 2.5.1 Using a Disk Partition as Swap Space


    To use an entire partition as swap, follow these steps:


    +   - Make certain that the partition is empty.

    - Run mkswap dev, where dev is the partition''s device. This command puts a swap
    signature on the partition.

    - Execute swapon dev to register the space with the kernel.


    After creating a swap partition, you can put a new entry in your /etc/fstab to
    make the system use the swap space as soon as the machine boots. This is from
    the fstab example in Section 2.4.6:


    ```

    /dev/hda2 none swap 0 0

    ```'
