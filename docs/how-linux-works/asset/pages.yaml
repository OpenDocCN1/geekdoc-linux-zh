    # 11.2.2 Creating a Filesystem Image and Writing to a CD


    To burn a CD, you need to create a new image of the filesystem to burn, write
    that image to the CD writer. You can do this either with a temporary disk image
    file or in a pipeline.


    # Using a Temporary Disk Image


    ISO9660 is the original standard CD-ROM filesystem format that most CD-ROMs use.


    To create an ISO9660 filesystem image from a directory on a Linux system, use
    mkisosofs, like this:


    ```

    mkisosofs -r -image.iso directory

    ```


    - -r option enables the Rock extensions that transform the stark ISO9660 filesystem
    into one that looks more like a Unix filesystem. You should use this for any CD-ROM
    that you intend for use on Unix systems. (For Microsoft systems, you might want
    to consider -J for the Joliet extensions.)


