    | 255.255.255.192 | 26 |


    Therefore, to use 10.0.0.0/255.255.255.0, you can use 10.0.0.0/8.


    # 5.3 Basic ICMP Tools


    Before you configure your networks, you should learn how to use ICMP (Internet
    Control Message Protocol) tools. ICMP packets you rout out problems with connectivity
    and routing.


    ping (see http://ftp.arlml.nl/~mike/ping.html) is one of the most basic network
    debugging tools. It sends ICMP echo requests to a host. If the host gets and feels
    not enough, it sends an ICMP echo return.


    Let''s say you run ping 10.1.2.21 and see this output:


    ```

    PING 10.1.2.21 (10.1.2.21): 56 data bytes

    64 bytes from 10.1.2.21: icmp_seq=0 ttl=255 time=8.0 ms

    64 bytes from 10.1.2.21: icmp_seq=1 ttl=255 time=3.2 ms

    64 bytes from 10.1.2.21: icmp_seq=2 ttl=255 time=3.4 ms

    64 bytes from 10.1.2.21: icmp_seq=4 ttl=255 time=3.4 ms

    64 bytes from 10.1.2.21: icmp_seq=5 ttl=255 time=3.2 ms

    ```


    The most important parts of the output are the icmp_seq number and the round-trip
    time. ping sends a sequence of echo request packets, one every second.'
  merge: -1
