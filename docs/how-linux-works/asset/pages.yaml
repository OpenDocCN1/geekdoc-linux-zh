  md: '# 5.14 Network Address Translation (IP Masquerading)


    Network Address Translation (NAT) permits sharing a single IP address (for example,
    for a PPP or broadband connection) with an entire internal network. NAT is very
    popular with home and small office networks. IPv4 addresses are in short supply,
    and furthermore, ISPs do not really want to bother with more routing than they
    can handle. As Mentioned in 5.9.1, many small routers support NAT. In Linux, the
    variant of that most people use is IP masquerading.


    The basic idea behind NAT is that the machine with the Internet connection acts
    as a proxy between the internal network and the rest of the Internet. Consider
    a network like the one back in Figure 5-1 on page 94, and assume that the router
    (gateway) has an eth interface to an internal private network and a ppppo interface
    for the uplink.


    Every host on the Internet knows how to connect to the router, but they know nothing
    about the internal private network behind the router. Under NAT, each of the internal
    hosts has the router as its default gateway. The system works roughly as follows:


    +   1. A host on the internal private network makes a connection to the outside
    world, so it sends its connection request packets through the router as normal.

    2. The router intercepts the connection request packet rather than passing it
    out to the Internet (where it would get lost, because the public Internet knows
    nothing about private networks such as 10.1.2.0/24).

    3. The router determines the destination of the connection request packet and
    opens its own connection to the destination.

    4. When the router obtains the connection, it makes a "connection established"
    message back to the original internal host.

    5. The router is now the middlemen between the internal host and the destination.
    The destination knows nothing about the internal host; the connection on the remote
    host looks like it came from the router.


    This doesn''t sound too bad until you think about how it works. Old IP routing
    only knows source and destination IP addresses in the Internet layer. However,
    if the router dealt only with the Internet layer, each host on the internal network
    could establish only one connection to a single destination at one time (among
    other limitations), because there is no information in the Internet layer part
    of a packet from the same host to the same destination.


    Therefore, NAT must dissect packets to pull out identifying information. The only
    suitable stuff is in the transport layer — in particular, the TCP and UDP port
    numbers. The transport layer is very complex, and you'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'can imagine that there are lots of things that can go wrong when a router goes
    mucking inside transport layer information that comes from two hosts (the internal
    one and the external one) that it knows nothing about.


    NOTE See 10 for information on the kernel.


    Then you need to run iptables commands like the following to make the router NAT
    for its private subnet. The following example commands are for the earlier:


    ```

    echo 1 > /proc/sys/net/ipv4/ip_forward

    iptables -P FORWARD DROP

    iptables -t nat -A PREROUTING -o ppo -j MASQUERADE

    iptables -A FORWARD -i eth0 -j ACCEPT

    iptables -A FORWARD -m state --state ESTABLISHED,RELATED -j ACCEPT

    ```


    This example applies to an internal Ethernet network on eth0 sharing a PPP Internet
    connection (ppp). Change this to suit your network.


    When using NAT, remember that it''s essentially a hack. In a perfect world, we
    would all be using IPv6 (the next-generation Internet), and we could get permanent
    subnets from our ISPs without any pain. In the meantime, you have to deal with
    these NAT limitations:


    +   - Internet hosts cannot connect to services inside the private network with
    special port forwarding help from the NAT router. Of course, the hosts in the
    private network may have network security vulnerabilities, so this limitation
    may be more of a blessing than a drawback.

    - Because Internet hosts cannot connect to internal hosts, some services need
    even more complicated packet dissection to work.

    - NAT works for TCP, UDP, and some ICMP, but not necessarily all transport-layer
    protocols.

    - NAT requires much more memory and computing power than normal IP routing, so
    the computer acting as the router can be completely underpowered. In addition,
    there is always some connection overhead and latency. However, modern computers
    are more fast enough to handle this, and the overhead and latency don''t really
    matter unless you''re running a big operation.'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# 5.15 Wireless Ethernet


    The proliferation of notebook computers and other portable computing devices has
    given rise to wireless Ethernet (also irritating known as "Wi-Fi") that you do
    not need to physically plug into a switch or hub. There are two popular consumer
    versions of the standard: 802.11b (maximum speed 11 Mbps) and 802.11g (54 Mbps).


    In principle, wireless Ethernet isn''t much different than any other kind of Ethernet,
    except that it uses radio waves instead of copper wires or fiber. You can configure
    a wireless card''s network interface with traditional tools, such as ifconfig
    and dhclient. And Ethernet cards have MAC addresses just like their wired counterparts.


    With a wireless network, you typically want to be sent packets to some wired network.
    To accomplish this, you can buy a wireless base station to bridge (or link) a
    wireless network to a wired network — it''s almost like more ports to a hub or
    switch by plugging another hub or switch into one of the ports. A wireless base
    station contains both wired and wireless networking hardware; it physically plugs
    into the network and can also communicate wirelessly with wireless network devices.
    (You can make a regular computer do the work of a wireless base station, but it''s
    hardly worth


    Linux has an additional tool called ifconfig for setting up few technical details
    of a wireless network. For example, if someone else has a wireless network next
    door, you need to differentiate yours from theirs with an Extended Service Identifier
    (ESSID) string identifier.


    To enable ifconfig, your kernel needs the wireless LAN extensions that you''ll
    find in the kernel configuration''s networking support options (see Chapter 10).
    Running ifconfig with no options yields output like:


    ```

    lo no wireless extensions.

    ```


    ```

    eth0 no wireless extensions.

    ```


    ```

    eth1 802.11-DS ESSID:"some net" Nickname:HERMES I

    Mode:Managed Frequency:2.437GHz Access Point:00:04:5A:CE:BF:17

    Bit Rate:11Mbps/s Tx-Power:15dB Sensitivity:1/3

    RTS thr:off Fragment thr:off

    Power Management:off

    Link Quality:44/92 Signal level:-49 dB Noise level:-93 dB

    Rx invalid nwid:0 invalid crypt:0 invalid misc:7255

    ```


    As you can see, wireless settings are attached to network interfaces. The most
    important settings are as follows:'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'ESSID A string identifier for the network. Your wireless access point should
    have this setting.


    **Mode** A setting that defines the type of network and the network interface''s
    role in the network. Most wireless networks are managed networks, meaning that
    there is at least one that serves as an access point and oversees the nodes on
    the network. Your interface can act as a client, the master access point, a secondary
    access point, or a repeater. However, there are ad hoc networks that have no access
    points.


    **Access point** The MAC address of your current wireless access point''s wireless
    interface (if you''re on a managed network).


    **Encryption key** The wireless network card''s current Wired Equivalent Privacy
    (WEP) key.


    You can manually set these parameters just as you would with ifconfig:


    ```

    ifconfig eth1 myynet mode managed

    ```


    In the preceding example, ifconfig configures the eth1 interface with ESSID of
    myynet and a network topology of managed. The important ifconfig parameters are
    listed in Table 5-5. See the ifconfig(8) manual page for a complete list of parameters.


    # **Table 5-5:** ifconfig Parameters


    | Parameter | Value |

    | --- | --- |

    | essid | The ESSID string, or any. |

    | ap | The MAC address of your access point, or any. |

    | mode | Managed, Master, Repeater, Secondary, or Auto. |

    | channel | A channel number (each channel has a predetermined frequency); run
    iwlist channel to get a list of available channels. |

    | freq | A direct frequency specification (for example, 2.412G for 2.412 GHz).
    |

    | key | Normally, the hexadecimal value of the WEP key, or to disable WEP. |


    For wireless-plug PC cards, most distributions support the PC card utilities in
    `/etc/pcmia/wireless.opts`. When you plug a wireless card into your machine, the
    PC card services daemon deamon in Section 11.6 from `/etc/pcmia/wireless`. Wireless
    networks runs ifconfig based on the parameters in wireless.opts, which is a Bourne
    case statement, making decisions primarily based on your wireless card''s MAC
    address. The wireless.opts configuration file has many sample entries that you
    should examine.


    To create an entry for a wireless card with MAC address 00:02:2D:B0:EE:E4, you
    could use the following:'
  merge: -1
  pgno: 140
- img_proc: true
  md: '```

    *,*,00:02:2D:BO:EE:E4)

    INFO="my Home Network"

    ESSID="my network"

    MODE="Managed"

    RATE="auto"

    KEY="2688645297";

    ```


    You must place this entry in the case statement in wireless.opts before the following
    lines:


    # NOTE : Remove the following four lines to activate the samples below ...

    # START SECTION TO REMOVE

    *,*,*);

    # END SECTION TO REMOVE


    # 5.15.1 A Lecture on Wireless Security


    Unfortunately, using radio waves as a medium is absurdly insecure. Anyone with
    any kind of wireless Ethernet device, even something as small as a Sharp Zaurus,
    can sit up near your network and waltz all your packets. Without any additional
    protective measures, anyone can get access to your network, sniff around your
    packets, or do something worse. For example, if your network is connected to the
    Internet, anyone can use your network for a wide variety of illegal activities.


    There are several ways to make it considerably tough to access your wireless network,
    and you''d think that most people would use them. Shockingly, the overwhelming
    majority do not. It''s easy to set up a insecure wireless network, whereas to
    make the network more secure you need to enter a bunch of numbers into any computer
    that wants to use it. Who goes through all of that when the network works just
    out of the box? Not to mention that it''s a continuous hassle, especially when
    one of your friends comes over with a notebook.


    Everyone thinks, "Hey, all of this bad stuff can''t happen to me." But and if
    you choose not to have any security. Fortunately, even the weakest kind of wireless
    security, WEP, drives off all would-be intruders. If nothing else, you should
    enable WEP on your access points and wireless network interfaces. Yes, this means
    typing in a bunch of numbers, but if you really want to be being caught in the
    middle of a legal mess?


    You should know that WEP is not terribly secure. Given to ten million packets,
    snooping on your network can figure out your WEP key with a program such as AirSnort.
    Of course, sniffing fine to ten million packets takes a while, but if this concerns
    you, change your keys every now and then (like, say, every three million packets).'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'In any case, never transmit any sensitive data across your network without
    serious encryption like SSL or SSH, even if you are using WEP. This is especially
    true if you do not control your network, and also holds for wired networks.


    If you have a good reason to be paranoid about security, WEP isn’t going to help
    you much. You should require IPSec or SSH port forwarding for all traffic on your
    wireless network. Many administrators use a virtual private network (VPN) to implement
    an IPSec-based system.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# #6


    # # NETWORK SERVICES


    Chapter 5 explained all layers of Internet networks except the application layer.
    Network applications (clients and servers) interact with the operating system
    by using a transport layer protocol and interface, such as TCP. This chapter covers
    basic network servers, including the inetd superserver and SSH servers. In addition,
    you will see some tools that will help you debug the servers.


    Unix servers come in many forms. A server may listen to a port on its own, or
    it may use a superserver such as inetd. Servers have no common configuration database,
    and they vary widely in features. Most servers have a configuration file to control
    their behavior (though with no common format), and most use the operating system''s
    syslog service for message logging.


    If you understand the system of TCP and UDP ports described in Section 5.12, you
    won''t run into much trouble with network servers. Let''s start out by getting
    an idea of how network clients talk to network servers.'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# 6.1 The Basics of Services


    TCP services are among the easiest to understand because they are simple, uninterrupted
    data streams. For example, you can talk directly to a Web server on TCP port 80
    to get an idea of how data comes across the connection. Run the following command
    to connect to a Web server:


    ```

    `telnet www.nytimes.com 80`

    ```


    You should get a response like this:


    ```

    Trying some address...

    Connected to www.nytimes.com.

    Escape character is ''^^''.

    ```


    Now type this:


    ```

    `GET /`

    ```


    Press Enter twice. The server should send a bunch of HTML text as a response,
    and then terminate the connection.

    There are two important lessons here:


    +   * The remote host has a Web server listening on TCP port 80.

    * telnet serves the client that initiated the connection.


    > NOTE telnet is a program originally meant to enable logins to remote hosts.
    Although the non-Kerberos telnet remote login is completely insecure (as you will
    learn later), the telnet client is useful for debugging remote services. Telnet
    does not work with UDP or any other transport layer than TCP. See Section 6.5.3
    for information on netcat, a powerful general-purpose network client.


    # 6.2 Stand-Alone Servers


    Stand-alone network servers are no different than any other server daemons on
    your system (such as cron), except that they listen on network ports. In fact,
    you already syslog in Chapter 4, which accepts UDP packets on port 514 if it is
    started with the - option.


    Here are some other common network servers that you may find running on your system:


    ```

    http Web server

    lpd Print server (see Chapter 12)

    postfix, qmail, sendmail Mail servers

    sshd Secure shell daemon (see Section 6.4)

    nfsd, mounted Network filesystem daemons

    smbd, nmbd Windows file-sharing daemons (see Chapter 14)

    portmap Remote procedure call (RPC) portmap service daemon

    ```'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# 6.3 The inetd Daemon


    Implementing stand-alone servers for every single service is somewhat inefficient,
    because each server must know all about the network interface API, have its own
    port configuration system, and so on. In many respects, the API for talking to
    TCP is not much different than the standard I/O system. TCP servers read from
    network ports and return output back to those ports—this is similar to the behavior
    of cat with no arguments in Section 1.2 is similar.


    The inetd daemon is a supervisor that standardizes network port access and interfaces
    between regular programs and network ports. After you start inetd, it reads the
    inetd.conf file and listens then on the network ports defined in that file, attaching
    a newly started process to every incoming connection.


    Each line in inetd.conf looks something like this:


    ```

    ident stream tcp nowait nobody /usr/sbin/inetd ident -i

    ```


    There are seven fields here:


    +   - **Service name** The service name from /etc/services (Section 5.12).

    - **Socket type** This is usually stream for TCP and gram

    - **Protocol** The transport protocol, such as tcp or udp.

    - **Datagram server behavior** For UDP, this is wait or nowait. Services using
    any other protocol should use nowait.

    - **User** The username that should run the service. Add .group if you want to
    set a group.

    - **Executable** The program that inetd should connect to the service.

    - **Arguments** The arguments for the executable in the preceding field. The first
    argument should be the name of the program.


    # in inetd.conf denotes a comment. To deactivate an inetd service, place a # before
    its entry in /etc/inetd.conf and then run the following command to make it re-read
    its configuration file:


    ```

    kill -HUP `cat /var/run/inetd.plid''

    ```


    inetd has seven built-in services that you might see at the beginning of inetd.conf,
    including echo, charg, discard, daytime, and time. You can use these for testing,
    otherwise they aren''t important.


    # 6.3.1 TCP Wrapper: tcpd, /etc/hosts.allow, /etc/hosts.deny


    Before lower-level firewalls took off in popularity, many administrators used
    the TCP wrapper library for host control over network services. In fact, if you
    use an IP firewall, you should still use TCP wrappers on any service that'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'does not have its own logging mechanism (and many inetd services do not have
    such capabilities).

    The tcpd program is the TCP wrapper utility for linking inetd with a

    server. An administrator can modify the inetd.conf file to include tcpd,\like
    this:


    ```

    finger stream tcp nowait nobody /usr/sbin/tcpd /usr/sbin/fingerd

    ```


    When someone makes a connection to the finger port, the following

    happens:


    +   1. inetd runs tcpd via /usr/sbin/in.fingerd.

    2. tcpd verifies the executable /usr/sbin/in.fingerd.

    3. tcpd consults /etc/hosts.allow and /etc/hosts.deny to see if the remote

    machine has permission to connect.

    4. tcpd logs its decision.

    5. If tcpd decides that the remote host is okay, it runs /usr/sbin/in.fingerd.

    Otherwise, tcpd terminates, dropping the connection.


    Here is an example hosts.deny file:


    ```

    ALL: .badguys.example.com

    in.fingerd: nofinger.example.com

    portmap: ALL

    ```


    You can interpret this as the subdomain.badguys.example.com may connect to any

    TCP wrapper-enabled program.


    +   * No one in the subdomain.badguys.example.com may connect to any

    TCP wrapper-enabled program.

    * The host nofinger.example.com may not run in.fingerd.

    * No one may access portmap (see Section 6.6 for more information on this

    service).


    The TCP wrapper library reads /etc/hosts.allow before /etc/hosts.deny. If a

    rule in /etc/hosts.allow matches an incoming connection, the TCP wrapper

    library allows the connection, ignoring /etc/hosts.deny. For example,

    following line in /etc/hosts.allow enables portmap access to the subdomain

    goodguys.example.com:


    ```

    portmap: .goodguys.example.com

    ```


    > Using domain names in a TCP wrapper configuration has the disadvantage that
    it

    uses DNS. Forcing DNS lookups can hinder performance. It''s also not extremely
    secure;

    it''s possible to affect DNS lookups.'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# 6.3.2 xinetd


    Some Linux distributions come with an enhanced version of inetd named xinetd (http://www.xinetd.org/).
    You can read about the xinetd improvements at the Web site, but to summarize,
    xinetd offers built-in TCP wrapper support, better logging, and extended access
    control.


    If you currently have xinetd, should you run xinetd? If you need its features,
    sure. However, if you only have one local server (for example, FAM for the GNOME
    desktop), and you firewall the external traffic to this server, there are probably
    better things you can do with your time. xinetd administrators should also keep
    track of security advisories, because this package has not as widespread as the
    old inetd.


    xinetd does not read inetd.conf, but if you understand the fields in inetd.conf,
    you won''t have trouble using xinetd. If you want an alternative to /etc/xinetd.d,
    you can also use it to convert your inetd.conf to a xinetd.conf file that xinetd
    can read.


    To add a new service to xinetd, create a file in /etc/xinetd.d with the name of
    the service. For example, the /etc/xinetd.d/finger file might look like this:


    service finger


    ```

    { socket_type = stream protocol = tcp wait = no user = nobody passenv = /usr/sbin/in.fingerd
    server_args = }

    ```


    To make xinetd recognize the changes, run kill -USR1 on the xinetd process ID.


    # 6.4 Secure Shell (SSH)


    The secure shell (SSH) is now the de facto standard for remote logins to other
    machines. It replaces old, insecure programs like telnet and rlogin. In addition
    to being a good example of a stand-alone server (for the purposes of this book,
    at least), SSH has these features:


    +   - Encrypts your password and all other session data, protecting you from snoopers.

    - Tunnels other network connections, including those from X Window System clients.
    Tunneling is the process of packaging and transporting a network connection using
    another network connection. The advantages'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'of SSH to tunnel X Window System connections are that SSH sets the display
    environment for you and encrypts the X data inside the tunnel.


    +   - Has clients for almost every operating system.

    - Uses keys for host authentication.


    OpenSSH (http://www.openssh.com/) is a popular less less SSH implementation for
    Unix. The OpenSSH client is ssh and the server is sshd. OpenSSH uses public cryptography
    for authentication and less ciphers for its session data. SSH does not come without
    its disadvantages; in particular, you remove the host''s public key, and you do
    not necessarily get it in a secure way (however, you can check it manually if
    you''re being spoofed). If you would like to know how cryptography works, get
    your hands on Applied Cryptography [Schneier].


    There are two main SSH protocol versions: 1 and 2. OpenSSH supports both, with
    version 2 being the default.


    # 6.4.1 Installing OpenSSH


    You can install a precompiled binary version of OpenSSH, such as an .rpm file
    in a Red Hat distribution, or you can get the "portable" source code from the
    OpenSSH Web site to install from source. If you install from source code, you
    need a version of the SSL (Secure Socket Layer) library, preferably OpenSSL.


    In either case, you need to know your OpenSSH configuration directory — it''s
    usually /etc or /usr/local/etc. If you install from source code, you can override
    the default configuration directory by using the --ssconfdir=dir parameter to
    configure (see Chapter 9 for more information on compiling from source code).


    # 6.4.2 The SSHD Server


    To run sshd, you need a configuration file and host keys in the configuration
    directory. The configuration filename is sshd_config. It''s easy to confuse this
    filename with the client''s ssh_config setup file, so look out. You shouldn''t
    need to change anything in sshd_config, but it never hurts to check.


    The file consists of key-value pairs, as shown in this fragment:


    ```

    Port 22

    #Protocol 2,1

    #ListenAddress 0.0.0.0

    #ListenAddress : :

    HostKey /usr/local/etc/ssh_host_key

    HostKey /usr/local/etc/ssh_host_rsa_key

    HostKey /usr/local/etc/ssh_host_dsa_key

    ```


