  md: '# 2.1 Directory Hierarchy


    As mentioned in Chapter 1, your Linux system has a root directory (/). The root
    contains several subdirectories and possibly a file or two. Keep this area clean;
    don''t let stray files end up here. But don''t fall victim to a syndrome that
    affects many administrators — removing files in a zealous attempt to keep the
    system "clean." If you don''t know what something does (and can''t figure it out),
    don''t remove it.


    The names of the directories in / have special meanings that permeate the Linux
    system in many other subdirectories. For example, there is a /bin directory in
    the root, but there are also many other binary directories through /usr/bin and
    /usr/local/bin. All of these directories contain executables.


    If you want to know the gory details of the directories on the system, have a
    look at the Filesystem Hierarchy Standard [Filesystem]. For the most part, the
    directory names reflect the root and /usr directory patterns described in the
    next sections.


    # 2.1.1 The Essential Root Subdirectories


    The most important of the root directory''s subdirectories are the following:


    +   - bin Contains binary programs (also known as an *executable*), which are
    programs that are ready to run. Most of the basic Unix commands like ls and cp
    are in /bin. However, some of the files in /bin are not in binary format because
    shell scripts perform the tasks of binaries in modern systems.


    +   - dev Contains device files. Read more about these special files in Section
    2.3.


    +   - etc The core system configuration directory (pronounced EHT-ee). User password,
    boot, device, networking, and other setup files are here. Many items in /etc are
    specific to the particular hardware on the machine — for example, the /etc/X11
    directory contains the graphics configuration.


    +   - home holds installations for normal users on the system. Unix installations
    conform to this standard.


    +   - lib An abbreviation for library. In Linux, this directory holds library
    files containing code that executables can use. There are two types of libraries:
    static and shared. The /lib directory should only contain libraries, but other
    lib directories such as /usr/lib contain varieties, as well as other auxiliary
    files.


    +   - proc Provides system statistics through a directory-file interface that
    you can browse with standard Unix tools, like those introduced in Chapter 1. Much
    of the /proc subdirectories structure on Linux is unique, but many other Unix
    variants have similar features.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '+   - sbin The place to find system executables. Programs in sbin directories
    pertain to system management, so regular users usually do not have sbin components
    in their command path. Many of the utilities do not use for normal users.


    +   - tmp The place to put smaller temporary files that you don''t care much about.
    Any user may read to and write from /tmp, but may not have permission to access
    another user''s files. Some programs use this directory as a workspace. If something
    is extremely important, don''t put it in /tmp. Most distributions clear /tmp when
    the machine boots, and some even remove its old files periodically. Don''t fill
    /tmp either, because its space is usually shared with something critical (the
    rest of /, for example).


    +   - usr Pronounced as "user," but this subdirectory does not contain files (there
    are no user files in /usr on Unix systems some Linux extended). Instead, /usr
    is a large hierarchy that has a little like the root. The bulk of the Linux system
    resides in /usr of the directory names in /usr are the same as in the root and
    have the same type of files; /usr/bin and /usr/lib are two examples. The primary
    reason that the root does not contain the complete system is to keep space requirements
    low. The /usr directory is so important that Section 2.1.3 is dedicated.


    +   - var The "variable" subdirectory, where programs record runtime information.
    System logging, user tracking, caches, and other files that system programs create
    and tend all go into /var. There is a /var/tmp similar to /tmp, but the system
    does not wipe it clean on boot.


    # ## 2.1.2 Other Root Subdirectories


    There are a few other interesting subdirectories in the root:


    +   - boot Contains kernel loader files. These files pertain only to the very
    first stage of the Linux startup process; you will not find information how Linux
    starts up its services in this directory.


    +   - cdrom Where most Linux distributions attach a CD drive; the contents of
    the disc are under this directory. The root may contain similar directories for
    other removable devices.


    +   - opt May contain additional third-party software. Many systems don''t use
    /opt.


    # ## 2.1.3 The /usr Directory


    The /usr directory may look relatively clean at first glance, but a quick look
    at /usr/bin and /usr/lib reveals that there''s a lot here. In addition to the
    subdirectories that you just read about, /usr contains the following:'
