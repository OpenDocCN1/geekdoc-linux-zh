    # Input Device Support


    You need several configuration options to support your keyboard and mouse. There
    are two levels of support. The basic drivers support the PS/2 mouse. Also look
    for PS/2 Mouse.


    # Character Devices and Parallel Port Support


    Among the most important character devices are Virtual terminals (/dev/tty0, /dev/tty1,
    and so on). Unless you have a special type of device, you also need to put the
    console on the virtual terminal.


    Here are some things to check on:


    +   * Serial devices Standard PC serial ports use or emulate 8250/16550 UART chips.
    You almost certainly need this support if you plan to use a modem.


    +   * Unix98 PTY support Some programs now expect to see the dynamic Unix98 (/dev/pts*)
    pseudo-terminal devices rather than static names like /dev/typ*.


    +   * Enhanced real time clock support This /dev/rtc available to programs like
    hwclock. You should enable this option for any modern machine.


    +   * /dev/agart This is for direct-rendered graphics (GLX and DRI) on AGP graphics
    cards.


    +   * Parallel printer support This gives you /dev/lp* devices. To get this option,
    you must go back to the main kernel menu and enable Parallel port support. You
    also need PC-style hardware for any standard PC.


    > There is a section for Mice in the character device configuration, but you can
    safely ignore it, because the drivers are there for very old bus mice.'
