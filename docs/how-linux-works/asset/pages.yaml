- img_proc: true
  md: 'Notice the first character of each line in the listing. If this character is
    b, c, p or s, then it is a device. These letters stand for block, character, pipe,
    and socket, respectively:


    +   **Block device** Programs access data in a block device in fixed chunks. hdb1
    in the preceding example is a disk device. Because disks break down into blocks
    of data, it is natural that a disk be a block device. A block device''s total
    size is fixed, and a program has random access to any block in the device.


    +   **Character device** Character devices work with data streams. You can not
    read characters from write characters to these devices, like /dev/null in the
    previous example. Character devices don''t have a size; when you read from or
    write to a character device, the kernel usually performs a read or write operation
    on the device, leaving no record of the activity inside the kernel. Printers are
    character devices, and after the kernel sends data to a printer, the responsibility
    for that data passes to the printer; the kernel cannot back up and reeme the data
    stream.


    +   **Pipe device** Named pipes are like character devices, but there is another
    process at the other end of the I/O stream of a kernel driver. An example of such
    a process is gmw, a program that can duplicate multiple events and send them to
    the named pipe /dev/gmpdata for use by other programs.


    +   **Socket device** Sockets are special-purpose I/O files opening a type of
    network interface. For example, the gmw program accepts control commands through
    the /dev/gmpct1 socket. You don''t need to worry about sockets if you''re not
    a network programmer.


    The numbers before the dates in the first two lines of the previous listing are
    the major and minor device numbers that help the kernel identify the device. Similar
    devices usually have the same major number, such as hda3 and hdb1 (these are both
    hard disk partitions).


    # 2.3.1 dd and Devices


    The name dd stands for convert and copy. dd is extremely useful when working with
    block and character devices. This program''s sole function is to read from an
    input file or stream and write to an output file or stream, possibly doing some
    encoding conversion on the way. It was originally developed for reblocking.


    dd copies data in blocks of a fixed size. Here is an example of dd with a character
    device and some common options:


    ```

    dd if=/dev/zero/new_file bs=1024 count=1

    ```'
  merge: -1
