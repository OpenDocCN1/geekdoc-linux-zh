  md: "# 7.5.3 Matching Strings with case\n\nThe case keyword forms another conditional\
    \ construct that is exceptionally useful for matching strings. case does not execute\
    \ any test commands and therefore does not evaluate exit codes. Here is an example\
    \ that should most of the story:\n\n```\n#!/bin/sh\ncase $1 in\n    bye)\n   \
    \     echo Fine, bye.\n        ;\n    hi|hello)\n        echo Nice to see you.\n\
    \        ;\n    what*)\n        echo Whatever.\n        ;\n    *)\n        echo\
    \ 'Huh?'\n        ;\nsac\n```\n\nThe shell executes this as follows:\n\n+   1.\
    \ The script matches $1 against each case value demarcated with the ) character.\n\
    2. If a case value matches $1, the shell executes the commands below the case\
    \ until encountering ;. The shell skips to the esac keyword.\n3. The conditional\
    \ ends with esac.\n\nFor each case, you can match a single string (as by in the\
    \ preceding example), multiple strings with | (h|hello returns true if $1 equals\
    \ hi or hello), or make use of the * or ? wildcards (what*). If you want to make\
    \ a case that catches all possible values other than the case value specified,\
    \ use a single *, as shown by the final case in the preceding example.\n\nEach\
    \ case must end with a double semicolon (;;). You risk a syntax error otherwise.\n\
    \n# 7.6 Loops\n\nThere are two kinds of loops in the Bourne shell; for loops and\
    \ while loops. The for loop is much more common; it is actually a “foreach” loop.\
    \ Here’s an example:\n\n```\n#!/bin/sh\nfor str in one two three four; do\n  \
    \  echo $str\ndone\n```"
