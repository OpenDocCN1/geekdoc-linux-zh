  md: 'If you have a service that you need to encrypt, the service offers no native
    support, you can try Stunnel (http://www.stunnel.org/), an encryption wrapper
    package like TCP wrappers. Stunnel is especially good at wrapping inet services.


    Some servers are chronic targets of attacks because of poor implementation and
    design. You should deactivate the following services if you ever come across them:


    +   - **sendmail** I would usually not rail against a special program, Sendmail
    has an exceptionally long history of exploitation. There are two very good alternative
    mail servers, Postfix (http://www.postfix.org/) and qmail (http://www.qmail.org).

    - **ftpd** For whatever reason, all FTP servers been plagued with vulnerabilities.
    And most FTP servers use clear-text passwords. If you have to move files from
    one machine to another, consider an SSH-based solution or an rsync server.

    - **telnet, rlogin, rexed** All of these pass remote session data (including passwords)
    in clear-text format. Avoid them unless you happen to have a Kerberos-enabled
    version.

    - **fingered** Intruders can get user lists and other information with the finger
    service.


    # ### 6.7.3 Port Scanning


    Listing your ports and firewall configuration with netstat and iptables is a good
    start for staying on top of unwanted traffic, but you may want to go a step further
    with Nmap (Network Mapper), a program that scans all the ports on a machine or
    network of machines, looking for potential vulnerabilities. Nmap gives you from
    the outside and eliminates guessing which ports are open. Most intruders use Nmap,
    and you can get it at http://www.insecure.org/.


    If someone controls the network that you want to Nmap (or run Nmap from), ask
    if it''s all right that you do so. Network administrators watch for port scans
    and delight in stomping on any machine that runs a scan.


