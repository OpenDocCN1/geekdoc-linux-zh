    192.168.34.37 can send packets to any port on your machine except port 25, because
    the second rule only applies for port 25.)


    Therefore, you have to move the third rule to the top. The easiest way to do this
    is to first delete the third rule with this command:


    ```

    iptables -D INPUT 3

    ```


    Then, insert that rule at the top of the chain with iptables -I:


    ```

    iptables -I INPUT -s 192.168.34.37 -j ACCEPT

    ```


    If you want to insert a rule at some other place than the top of a chain, the
    rule number after the chain name (for example, iptables -I INPUT 4 ...).

    Although this little tutorial show you how to insert rules and how the kernel
    processes IP chains, it doesn''t even come to illustrating firewall strategies
    that actually work. Let''s talk about now.


    # 5.13.1 Firewall Strategies


    There are two basic kinds of firewall scenarios: one for protecting individual
    machines (where you set rules in INPUT chain), and one for protecting a network
    of machines (where you set rules in the routers FORWARD chain). In both cases,
    you cannot expect to have serious security by using a default policy of ACCEPT,
    continuously inserting rules to drop packets from sources that start to send stuff
    to. Instead, you must adopt the strategy of allowing only the packets that you
    trust and denying else.


    For example, let''s say that your machine has an email server on TCP port 25 and
    an SSH server on TCP port 22. There is no reason for any random host to talk to
    any other port on your machine, and you shouldn''t give any such a chance. Here''s
    how to set it up.


    First, set the INPUT chain policy to DROP:


    ```

    iptables -P INPUT DROP

    ```


    If you want to allow ICMP traffic (for ping and other utilities), use this line:


    ```

    iptables -A INPUT -p icmp -j ACCEPT

    ```


    Let''s say your host''s IP address is my_addr. Make sure that you can receive
    packets from yourself to both your network IP address and (one) 127.0.0.1 (localhost):


    ```

    iptables -A INPUT -s 127.0.0.1 -j ACCEPT

    iptables -A INPUT -s my_addr -j ACCEPT

    ```'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'If you have control of your entire subnet (and trust everything on that

    subnet), you can replace my_addr with your subnet address and subnet mask;

    for example, 10.43.201.0/24.


    Now, although you need to make sure that your host can make TCP

    connections to the outside world, you still want to deny all incoming TCP

    connections. Because all TCP connections start with a SYN (connection

    request) packet, if you let all TCP packets through that aren''t SYN packets,

    y are still ok:


    ```

    iptables - INPUT -p tcp ''!'' --syn -j ACCEPT

    ```


    Next, you must accept traffic from your nameserver so that your machine can

    look up names with DNS. Do this for all DNS servers in /etc/resolv.conf.

    Assuming that the nameserver''s address is ns_addr, you can do this with this

    command:


    ```

    iptables - INPUT -p udp --source-port 53 -s ns_addr -j ACCEPT

    ```


    As mentioned before, you want to allow SSH and SMTP connections from

    anywhere:


    ```

    iptables - INPUT -p tcp --destination-port 22 -j ACCEPT # ssh

    iptables - INPUT -p tcp --destination-port 25 -j ACCEPT # smtp

    ```


    Finally, you need to follow the following command to allow outgoing FTP

    connections, it''s not terribly critical:


    ```

    iptables - INPUT -p tcp --source-port 20 --destination-port 1024: -j ACCEPT

    ```


    The preceding IP table settings work for many situations. For example, they

    work for any direct connection, especially broadband, where an intruder is

    much likely to port-scan your machine. They work for university

    environments, which are very similar to regular broadband connections.

    And you could adapt these settings for a firewall router, using the

    FORWARD chain instead of INPUT, and using source and destination

    subnets where appropriate. However, if you are using a firewall router,

    y might find the discussion of NAT in Section 5.14 more applicable to

    your situation.


    Remember that the key idea is permitting only the things that you find

    acceptable, not trying to fix stuff that is unacceptable. Furthermore, IP

    firewall is only one piece of the security picture. See Section 6.7 for more

    information.


    # 5.13.2 IP Tables Reference


    This section is a quick reference for the most common iptables options.'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'All iptables invocations must have a command option, as listed in

    Table 5-3.


    # Table 5-3: iptables Command Options


    | Command Option | Description |

    | - | - |

    | -L chain | Lists rules (*chain* is optional). |

    | -A chain | Appends a rule to *chain*. |

    | -I chain rule number | Inserts a rule in *chain* (*rule number* is optional;
    the default location is the beginning of the chain). |

    | -D chain rule number | Deletes *rule number* from *chain*. You can omit the
    rule number if you specify a matching parameter (shown in Table 5-4). |

    | -F chain | Deletes all rules in *chain*, leaving only the policy. |

    | -P chain newpolicy | Sets the policy (default rule) of *chain* to newpolicy
    |


    When using -A and -I (and -without a rule number), you must specify the rule to
    add or delete as a combination of the packet specification options in Table 5-4.
    In addition, you can insert a literal ! after the option to flag negate its meaning.


    # Table 5-4: iptables Packet Specification Options


    | Parameter Option | Meaning |

    | - | - |

    | -s addr/mask | Selects source IP address *addr* with optional netmask mask (for
    an entire subnet). |

    | -d addr/mask | Selects destination IP address *addr* with optional netmask mask
    (for an entire subnet). |

    | -i interface | Selects input *interface* (e.g., eth0, pppo). |

    | -o interface | Selects output *interface* (e.g., eth0, ppo). |

    | -p protocol | Selects protocol (e.g., tcp, udp, icmp). |

    | --source-port port | Selects source port. You may specify a range with port1:port2.
    This works in conjunction with -p tcp or -p udp. |

    | --destination-port port | Selects destination port. You may specify a range
    with port1:port2. This works in conjunction with -p tcp or -p udp. |

    | --syn | When using -p tcp, selects SYN (connection request) packets. |


    To finish your rule, use -j *target* to decide what to do if a packet matches
    the rule (the most common types of *target* are ACCEPT and DROP).


    This section has only described the basics of iptables. There are many advanced
    features, such as the ability to send a packet to an entirely different destination,
    to intercept packets at different parts of the routing process, and to create
    your own subchains. You can read about them in the iptables(8) manual page.'
  merge: -1
