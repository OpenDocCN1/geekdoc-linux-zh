  md: 'You likely won''t come across anything like this, but if you do, remove the
    archive from your system, because it probably contains a Trojan horse or some
    other malicious code.


    # 9.1.1 Where to Start


    After you extract the contents of a source archive and have a bunch of files in
    front of you, try to get a feel for the package. In particular, look for these
    files: README and INSTALL.


    Always look at any README files first. They often contain a description of the
    package, a small manual, installation hints, and other useful information. Many
    packages also come with INSTALL files that contain instructions on how to compile
    and install the package. Check for special compiler options and definitions.


    Apart from the README and INSTALL files, you will find other package files that
    fall into roughly three categories:


    +   - Files relating to make system, such as Makefile, Makefile.in and configure.
    Some packages come with a Makefile that you may need to modify. however, most
    modern packages use GNU autoconf and cc with a configure script to generate a
    Makefile from Makefile.in based on your system settings and configuration options.


    +   - Source files ending in .c , or .cc C source files may appear just anywhere
    in a package directory. C++ source code uses .cc, .C or .cxx suffixes.


    +   - Object files ending in .o or binaries. Normally there are not any object
    files in source code distributions. However, you may find object files in rare
    cases when the package maintainer is not allowed to retain source code, and you
    may need to do something special to use the object files. In most cases, object
    (or binary executable) files in a distribution mean that the package wasn''t put
    together too well, and you should run make clean to make sure that you get a fresh
    compile.


    # 9.2 GNU Autoconf


    Even C source code is usually fairly portable, there are still differences on
    each platform that make it impossible to compile packages with a single Makefile.
    An early solution to this problem was to provide individual Makefiles for every
    operating system, or to provide a Makefile that was easy to modify. This approach
    somehow evolved into scripts that generate Makefiles based on an analysis of the
    system used to build the package.


    GNU autoconf is now the most popular system for automatic file generation. Packages
    using this system come with files named configure, Makefile.in, and config.h.in.
    To generate a Makefile, run configure to check your system for prerequisites:'
