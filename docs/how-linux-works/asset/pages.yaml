    exit(0) = ?

    ```


    Now you see some interesting things. First, look at the open() call, which opens
    a file. The 3 as a result means success — near the end, where you see cat reads
    from /dev/null (the read() call — notice that the file descriptor is 3). Then
    there is nothing more to read, so the program closes the file descriptor and exits.


    So what happens when there''s a problem? Try trace cat not_a_file instead and
    examine the open() call:


    ```

    open("not_a_file", O_RDONLY_LARGEFILE) = -1 ENOENT (No such file or directory)

    ```


    trace not only reports the error at the system-call level, but it also gives you
    a small description of the error.

    Missing files are the most common problems with Unix programs, so if the syslog
    or other log information is not helpful, and you have nowhere else to turn, trace
    can be of great use. You can even use trace on daemons that detach themselves.
    Here''s an example:


    ```

    str - crummyd_trace -ff crummyd

    ```


    In this example, the -o option to trace the action of any child process that crummyd
    spawns into crummyd_trace.pid, where pid is the process ID of the child process.

    The ltrace command tracks shared libraries. The output is similar to trace, but
    warned, there are usually many more shared library calls than system calls. See
    Section 8.1.4 for more information on shared libraries (ltrace doesn''t work on
    statically linked binaries).'
