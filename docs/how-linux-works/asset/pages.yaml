  md: '# Configuring a boot loader such as GRUB LILO Your kernel is useless if you
    can''t load it into memory.


    Learning miscellaneous utilities and procedures There are many facilities that
    tie runtime kernel parameters and extend kernel features. You have already seen
    some examples of these in previous chapters, including the /proc filesystem and
    the iptables command.


    # 10.1 Do You Need to Build Your Own Kernel?


    Before running head-into a kernel build, you need to ask yourself if it is worth
    it. Administrators who compile their own kernels have the following goals in mind:


    +   * Installing the latest drivers

    * Using the latest kernel features (especially with respect to networking and
    filesystems)

    * Having fun


    However, if you need a driver or feature, and your distribution offers a straightforward
    upgrade, you might opt for that instead, for several reasons:


    +   * You can make mistakes in configuring your own kernel, and your distribution
    probably offers a well-rounded kernel.

    * Compiling a new kernel takes a long time.

    * It''s far too easy to mess up the boot loader, making your system unable to
    boot.


    Even if you choose not to build your own kernel, though, you should still learn
    how boot loaders modules work.


    # 10.2 What You Need to Build a Kernel


    As with any package, the kernel source includes documentation explaining what
    you need to compile a functional kernel. These three aspects of your system are
    particularly important for building a kernel:


    +   * A C compiler (gcc). Most distributions put the C compiler in a development-tools
    package. Make sure that your C compiler agrees with the recommendations in the
    kernel source code, specifically the README file. Kernel developers have not been
    eager to adopt the latest versions of gcc. Some distributions have a separate
    compiler named kgcc for compiling the kernel.

    * Disk space. A new kernel source tree can easily unpack to more than 100MB before
    building any object files.

    * A relatively fast computer with plenty of memory. Otherwise, the compile will
    take some time.


    Your first step is to get the source code.'
