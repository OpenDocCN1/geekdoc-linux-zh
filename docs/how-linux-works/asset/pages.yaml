    # CONFIGURING AND MANIPULATING PERIPHERAL DEVICES


    This chapter covers various peripheral devices that may be attached to your computer.
    Although compiling and installing the low-level drivers for your kernel are the
    first steps in getting any device including peripherals working, you may also
    need additional utilities or servers to do anything useful with the device.


    A great deal of the work involved when configuring peripherals is digging through
    kernel log messages to see exactly how the kernel assigns a device and whether
    the kernel recognizes the device correctly in the first place. Therefore, this
    chapter contains a great number of example kernel messages that you can use as
