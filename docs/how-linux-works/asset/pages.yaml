  md: 'Some rc*.d directories contain commands that start with K (for “kill”, or stop
    mode). In this case, rc runs the command with the stop argument instead of start.
    You are most likely to encounter K commands in runlevels that shut down the system.


    # 3.1.3 Adding and Removing Services


    If you want to add, delete, or modify services in the rc*.d directories, you need
    to take a look at the files inside. A long listing reveals a structure like this:


    ```

    S10syslogd -> ../init.d/syslogd

    S12kernel -> ../init.d/kernel

    S15netstatd_init -> ../init.d/netstatd_init

    S18netbase -> ../init.d/netbase

    ...

    ```


    The commands in rc*.d directory are actually symbolic links to files in an init.d
    directory, usually in /etc or /etc/rc.d. Linux distributions contain these links
    so that they can use the same startup scripts for alllevels. This convention is
    by no means a requirement, but it often makes organization a little easier.


    To prevent one of the commands in the init.d from running in a particular runlevel
    you might think of removing the symbolic link in the appropriate rc*.d directory.
    This does work, but if you make a mistake and ever need to put the link back in
    place, you will have trouble remembering the exact name of the link. Therefore
    you shouldn''t remove links in the rc*.d directories, but rather, add an underscore
    (_) to the beginning of the name like this:


    ```

    mv S99httpd _s99httpd

    ```


    At boot time, rc ignores _s99httpd because it doesn''t start with S or K. Furthermore,
    the original name is still obvious, and you have access to the command if you''re
    in a pinch and to start it by hand.


    To add a service, you must create a script like the others in the init.d directory
    and make a symbolic link in the correct rc*.d directory. You may need to read
    Chapter 7 first if you''re not familiar with shell scripts. The easiest way to
    create a script is to examine the scripts already in init.d, make a copy of one
    that you understand, and modify the copy.


    When adding a service, make sure that you choose an appropriate place in the boot
    sequence to start the service. If the service starts too soon, it may not work,
    due to a dependency on some other service. For non-essential services, most systems
    administrators prefer numbers in the 90s, after most of the services that came
    with the system.'
