    # 5.8.3 Chat Scripts


    A chat script is a file containing commands that go out through the serial line
    and responses that you expect to receive from the serial line (the responses come
    from the modem or ISP, depending on the current stage of the dial-up process).
    Recall this script line from the previous section:


    ```

    ATDTnumber CONNECT

    ```


    This means that the chat program should dial with the ATDTnumber modem command
    and expect a response of CONNECT. After receiving a response, chat moves to the
    next thing in the chat file. After stepping through the entire file, and assuming
    that everything goes as anticipated, chat returns success and pppd proceeds with
    a PPP connection.


    The details of your chat script depend on your ISP, and you should be armed with
    the information you get in Section 5.8.1 before to complete your script. However,
    here is a script that works for most service providers that use Cisco (where username
    is your username and password is your password):


    ```

    ABORT "NO CARRIER"

    ABORT BUSY

    " ATZ OK

    ATDTnumber CONNECT

    " ername:

    username sword:

    \password >

    ppp

    ```


    The ABORT keywords and strings at the top of the script cause chat to exit with
    an error if it encounters one of these strings. In addition, \qstring tells chat
    not to send string to syslog. In this case, it tells not to send password to syslog
    when making a record of the connection.'
  merge: -1
