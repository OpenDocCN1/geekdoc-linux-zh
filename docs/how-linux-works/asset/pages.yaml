    If you don''t have DNS working yet, use arp -na instead, to disable hostname resolution.
    Linux arp with no arguments gives a slightly more formatted list than either of
    the above options, but this format is not standard across all versions of Unix.


    Remember that ARP only applies to machines on local subnets. To reach destinations
    outside your subnet, your host sends the packet to the router, and it''s someone
    else''s problem after that.


    The only real problem you can have with ARP is that your system''s cache can get
    out of date if you''re moving an IP address from one network interface to another,
    because the cards have different MAC addresses (for example, this can happen when
    testing a machine). Unix systems invalidate the ARP cache entry if there is no
    response after a while, so there shouldn''t be any other trouble than a small
    delay for invalidated data. However, if you want to delete an ARP cache entry
    immediately, use this command:


    ```

    arp -d host

    ```


    You can also view the ARP cache for a single network interface like:


    ```

    arp -i interface

    ```


    The arp(8) manual page explains how to manually set ARP cache entries, but you
    should not need to do this.


    Don''t confuse ARP with RARP (Reverse Address Resolution Protocol). RARP transforms
    a MAC address back to a hostname or IP address. Before DHCP became popular, some
    obsolete workstations and other devices used RARP to get their configuration,
    but RARP is rare today.


