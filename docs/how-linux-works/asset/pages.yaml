    # # 6.6 Remote Procedure Call (RPC)


    RPC stands for *procedure call*. The basic idea is that programs call functions
    on remote programs (identified by program numbers), and the remote programs return
    a result code or message.


    RPC implementations use transport protocols such as TCP and UDP, and they require
    a special intermediary service to map program numbers to TCP and UDP ports. The
    server is called portmap, and it must be running on any machine that wants to
    use RPC services.


    If you want to know what RPC services your computer has, run this command:


    ```

    rpcinfo -p localhost

    ```


    RPC is one of those protocols that just doesn''t seem want to die. The unpleasant
    Network File System (NFS) and Network Information Service (NIS) systems use RPC,
    but they are completely unnecessary on stand-alone machines. Whenever you think
    you''ve eliminated all need for portmap, something else comes up, such as File
    Access Monitor (FAM) support in GNOME.


    # # 6.7 Network Security


    Because Linux is a very popular Unix flavor on the PC platform, it attracts more
    unpleasant characters who try to break into computer systems. 5.13 talked about
    firewalls, but this isn''t really the whole story on security.


    Network security attracts extremists. Those who are interested in breaking into
    systems do so because they *really* like to, and those who come up with elaborate
    schemes to protect themselves do so because they *really* to swat away people
    trying to break into their systems.'
