    # 5.9 Broadband Connections


    The term broadband refers to connections faster than a conventional modem link.
    For most users, this means a DSL or cable modem connection. One of the most frustrating
    things about broadband providers is that they don''t tend to tell what kind of
    technology they use.


    Most DSL or cable modems have an Ethernet port, requiring you to have an Ethernet
    interface on your computer, and as you see in Section 5.4, it''s not hard to set
    up an Ethernet interface (in theory, at least). Unfortunately, not all providers
    provide straight IP from the Ethernet port, so things can get more complicated.


    For the most part, your setup depends on the kind of broadband connection you
    have. These rules generally apply:


    Cable modem These devices usually speak straight IP, and you can do the network
    configuration with DHCP. Plug your Linux machine into the cable modem and look
    at Section 5.7. If you have a static (fixed) IP address, you should be able to
    set up the connection by hand as described in Section 5.4. You may need to perform
    some configuration on the cable modem before it connect to the outside world,
    but that''s usually done with a Web browser.


    DSL with a dynamic IP address DSL providers usually send PPP over Ethernet (PPPoE)
    through their devices. This is the most common kind of DSL connection, and as
    would have it, it''s the most complicated. See 5.9.2 for more information on PPPoE.


    DSL with a static IP address Some DSL providers talk IP over Ethernet if you have
    a fixed IP address. In this case, you can use the manual configuration described
    in Section 5.4.


    The preceding rules are based on the hardware available to service providers,
    but your provider may be different. Telephone companies prefer PPPoE because it''s
    easier for them to monitor and authenticate, but cable companies tend not to care.
    You can probably determine the type of connection'
