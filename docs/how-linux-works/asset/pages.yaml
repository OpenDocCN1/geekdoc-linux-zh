    # 10.4.1 Configuration Options


    Most of the configuration options are fairly self-explanatory. For example, in
    the menu shown in Figure 10-1 on page 205, the items under **Device Drivers >
    SCSI support > SCSI low-level drivers** correspond to device drivers for SCSI
    hosts.


    Some configuration options depend on other options, and until you activate the
    dependency options you cannot reach configuration options that have dependencies.
    For example, to reach the **SCSI low-level drivers** submenu, you must first activate
    **SCSI device support** in the previous menu. These dependencies are not obvious;
    you may need a little bit of experimentation to find what you''re looking for.
    If you''re really stamped on a dependency, go to the source. Look at arch/i386/config,
    the master file for all options and online help for the kernel configuration.


    The following sections outline the most significant kernel options that reside
    within the important top-level menu. Keep in mind these options change with time;
    you may see items not listed here, or the items may be in a different place in
    the kernel that you decide to build.


    # Code Maturity Level Options


    Inside this menu item you will find an option named **Prompt for development/or
    incomplete code drivers**. To see the newest (but perhaps unstable) drivers and
    features when perusing the rest of the kernel configuration menu, select this
    option.


    # General Setup


    This section has three settings that you should turn on:


    +   * **Support for paging of anonymous memory** Enables swap disk and file support

    * **System V IPC** Enables interprocess communication

    * **Sysctl** Enables kernel parameter changes through /proc


    If you do not build your kernel with the support listed here, many major packages
    and utilities will not work, including the X Window System.


    In addition to these options, the **General Setup** menu in kernel 2.6.0 and newer
    versions have an option **Kernel .config support** to make the build process save
    the current .config file in the kernel image. If you enable this option, you will
    also have the opportunity to enable a second option that allows you to turn on
    access to the embedded .config file'
