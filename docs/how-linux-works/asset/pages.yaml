  md: '# 4.8 Tracking Individual Processes


    You saw how to use ps in Section 1.16 for listing process characteristics at any
    time. ps is good for getting a snapshot of the current processes, but it does
    little to tell you how processes change over time. Using ps alone, it''s not terribly
    easy to pick out processes that are using too much CPU time memory.


    The top program displays the current system status and many of the fields you
    might see in a ps listing, but it also updates the display every second. By default,
    top shows the most active processes (that is, those currently taking up the most
    CPU time).


    You can send commands to top with keystrokes. These are some of the most important
    commands:


    +   - SPACEBAR Updates the display immediately

    - M Sorts by current resident memory usage

    - T Sorts by total (cumulative) CPU usage

    - P Sorts by current CPU usage (the default)

    - u Displays only one user''s processes

    - ? Displays a usage summary for all top commands


    If you want to know how much CPU time a process uses during its entire lifetime,
    use time. If your shell has a built-in time command, you may need to run /usr/bin/time
    to get the full output shown below.) For example, to measure the CPU time used
    by 1s, run using this command:


    ```

    time 1s

    ```


    After 1s terminates, you should get some output like this:


    ```

    0.05user 0.09system 0.00..44elapsed 31%CPU (avgtext+avgdata 0maxresident)k0inputs+0outputs
    (125major+5minor)pagefaults 0swaps

    ```


    +   - User time is the number of seconds that the CPU has running the program''s
    own code. On modern processors, some commands run so quickly that you may get
    a zero value because the actual CPU time is so low that time rounds down to zero.

    - System time is how long the kernel spends the process''s work (for example,
    reading files and directories).

    - Elapsed time is the total time it took to run the process from start to finish,
    including the time that the CPU spent doing other tasks. This number is not very
    useful for performance measurements.


    See Section 4.10 for a description of the other fields.'
  merge: -1
