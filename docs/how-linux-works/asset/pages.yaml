- img_proc: true
  md: '# 13


    # BACKUPS


    There is no single system for backups on Linux. There are many different kinds
    of archiving programs and formats. You already saw tar, one of the most popular
    archivers, in Chapter 1. The good news is that there isn''t much more to making
    backups than what you already know; the bad news is that it''s not too clear how
    you should get the archive to the physical medium.


    This chapter takes you through the basics of backups: what data you need to back
    up, what backup devices are available, what types of backups you can make, how
    to use the most common archivers, and how to use tape drives.


    # 13.1 What Should You Back Up?


    Your backup priorities should be as follows:


    +   1. Home directories. Try to make daily backups of your home directories.

    2. System-specific configuration and data, such as the stuff in /etc and /var.
    This should include your machine''s list of installed packages.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '3. Locally installed software (for example, /usr/local). You don''t want to
    lose the work you put into custom software installations, so make a backup every
    now and then.


    4. System software from your distribution. This is really the least of your worries,
    because you can probably restore this part of the system by reinstalling the operating
    system. Furthermore, by the time your disk gets around crashing so hard that you
    need to restore from backups, you probably want to install a newer version of
    the operating system anyway.


    # ## 13.2 Backup Hardware


    In the formative years of Unix, there was only one reasonable kind of backup hardware:
    the tape. Tapes were inexpensive compared to fixed storage (hard drives), they
    were fairly reliable, and they could be taken off-site for additional data security.


    However, hard disk technology has outpaced tape technology in the past ten years.
    For PCs, tape drives are expensive compared to hard disks (and the tapes themselves
    are also expensive). In addition, tape capacities are far smaller than the disks
    now on the market.


    There are currently two popular backup alternatives to tape drives:


    +   - CD and DVD-R/RW drives


    +   - An extra hard disk (internal or external)


    Both of these, but you need to improve, because there aren''t tried-and-true standards
    for making backups to these devices. You will still want to use a traditional
    backup utility (almost certainly tar) to create archives on the medium, but you
    need to find a way to manage the archives by yourself.


    That said, don''t count out the tape drive just yet. A significant portion of
    this chapter deals with tape drives.


    # ## 13.3 Full and Incremental Backups


    Before going into detail about backup hardware and archiving programs, you need
    to know about the two basic types:


    **Full backup** An archive of everything on a filesystem or directory


    **Incremental backup** An archive of all items that have changed since the last
    backup


    In large-scale operations, there are more kinds of backups, and you may hear of
    cumulative and differential backups — that is, an incremental backup may contain
    all of the changes since the last differential backup, and the differential backup,
    in turn, could contain all changes since the last backup. However, for small systems
    where you do backups by hand, it is reasonable to deal only with full backups
    and the incremental backups that build on the full backups.'
  merge: -1
  pgno: 286
- img_proc: true
  md: "The advantage to incremental backups is that they usually finish quickly\n\
    down do not require much storage space. However, over time, the difference\btween\
    \ the last backup and the current state on the disk gets to be\nsificant that\
    \ these advantages dwindle: the incremental backups start to\nt up as much space\
    \ as the full backups, and it can be very difficult to\nmerge an old full backup\
    \ and a incremental backup if you ever need\nto restore a full set of files from\
    \ the backups. In particular, files that\nintentionally deleted between the two\
    \ backups can reappear. Therefore, you\need to do a full backups on a regular\
    \ basis.\n\nSystems administrators generally keep a set of full and incremental\n\
    backups so that they can restore files that may have only existed for a short\n\
    period of time. For example, if you have daily incremental backups that go\n30\
    \ days ago and a full backup from at least 30 days ago, you can restore\nany file\
    \ that was the filesystem at backup time during that time period.\nof course,\
    \ if you don't know the exact dates, finding the file can take\nlittle.\n\nTo\
    \ restore a complete set of files, you need to extract the latest full\nbackup\
    \ first, then the latest incremental backup (unless, the full\nbackup is by chance\
    \ newer than the incremental backup).\n\n# # 13.4 Using tar for Backups and Restores\n\
    \nIn Section 1.18, you learned the basics of tar. As it turns out, you already\n\
    know all you need in order to do manual backups. If you want a\ncomprehensive\
    \ list of tar options, you can look at the (gigantic) GNU\ninfo documents. However,\
    \ the good news is that you don't need to know\nvery options, and after reading\
    \ this section, you should only need\nthelp every now and then as a refresher.\n\
    \n# ## 13.4.1 Creating Archives\n\nWith processors as fast as they are, and disks\
    \ getting ever larger, it\ndoes't make sense to omit compression for any archive.\
    \ Recall that\ny can create a compressed archive of a directory with one command:\n\
    \n```\ntar zcv archive directory\n```\n\nA large part of making a backup is figuring\
    \ out where to put the archive.\nare are a few choices here:\n\n+   - For tape\
    \ drives, see Section 13.6.2 for how to write the archive to the\ntape device.\n\
    - For backing up to a spare disk, you can write the archive as a file on the\n\
    disk's filesystem.\n- If you need to pipe the output to standard output (to feed\
    \ it to another\ncommand, such as cdrecord), use - as the archive name."
  merge: -1
  pgno: 287
- img_proc: true
  md: 'Here are some options to consider when running GNU tar:


    +   - --exclude file Exclude file from the archive.

    - --exclude-from Doesn''t include in the any of the files listed in file.

    - --one-file-system Archives files from inside a single filesystem. This is handy
    for breaking up backups by partitions.

    - --absolute-paths Doesn''t strip the leading / from an absolute pathname. This
    has its uses, but only if you know what you''re doing.

    - --listed-incremental file Uses file as the incremental state file (see Section
    13.4.2).


    One tricky part about adding these options to a traditional tar command is that
    you must insert a - in front of the regular one-character options. Therefore,
    if you want to create an archive of the misc directory, exclude misc/scratch you
    would have to run the following with -zcvf rather than -zcv, as in the previous
    example. Here''s how you would look:


    ```

    tar exclude misc/scratch -zcv archive misc

    ```


    > Remember that tar strips the leading / from an absolute pathname (unless you
    specify the --absolute-paths parameter). Therefore, to exclude an item, you must
    match the path that goes into the archive, not necessarily the one on the system.
    Let''s say that you wanted to create an archive of / without /usr. You must remove
    the / by yourself:


    ```

    tar --exclude usr -zcv archive /

    ```


    # 13.4.2 Incremental Backups with tar


    To enable incremental backups with GNU tar, you need to create an incremental
    state file that contains information about each newly archived file. Here''s how
    to do it:


    +   1. Run the command to make a full backup in full_archive (state_file is the
    name of the state file; you must choose your own name):


    ```

    tar --listed-incremental state_file -zcv full_archive file1 ...

    ```


    +   2. Make a copy of the original state file. For example:


    ```

    cp state_file state_file_incr

    ```


    +   3. When it is time to make an incremental backup, run the tar command as earlier,
    but with the state file copy that you created in step 2, state_file_incr:'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'tar --listed-incremental_state_file_incr -zcvf incremental_archive_file1 ...


    This should produce a much smaller archive than the full backup, because tar compares
    the time(s) listed in state_file_incr (remember, it''s a copy of the original
    state_file) against the modification times of the current files on the disk.


    +   4. Repeat steps 2 and 3 for subsequent incremental backups.

    5. To do another full backup, delete or rename state_file and start at step 1.


    You need to make a copy of the original state file before each incremental backup
    because GNU tar updates the file specified with --listed-incremental its run.
    If you were to perform backups with the same state file over and again, the incremental
    backups would only record the changes since the last incremental backup, not since
    the last full backup. Although this would yield a complete set of changes, it
    would also make it nearly impossible to find a lost file inside a set of incremental
    backups. Furthermore, to do a complete restore, you would need to use all of your
    incremental backups.


    > Remember that incremental backups are only good when accompanied by the previous
    full backup. Make sure that you don''t overwrite your full backup with an incremental
    backup.


    # 13.4.3 Extracting Archives


    Recall from Section 1.18.11 that you can extract files from a compressed archive
    as follows:


    ```

    tar xvf archive

    ```


    By default, tar extracts all files in the archive. However, you can limit the
    extraction to specific files and directories by adding their names to the end
    of the command line (you may need to run tar ztv to get a list of filenames):


    ```

    tar xvf archive file1 file2 ...

    ```


    When extracting files and home directories as root (for example, from a restore
    or when moving the things around), it is critical that you use the p option to
    preserve the original permissions:


    ```

    tar xvpf archive

    ```


    Otherwise, tar creates files using the current permissions mask (umask). This
    can be annoying at the very least, and could cause your system to malfunction
    at the worst.'
  merge: -1
  pgno: 289
- img_proc: true
  md: 'WARNING Before extracting an archive, it''s very important to check your current
    working directory against any files that the extraction process might create so
    that you don''t accidentally clobber newer versions of files with older ones from
    the archive. When doing a partial restore, it''s a very good idea to change to
    an empty temporary directory.


    # 13.5 Backups to Non-Traditional Media


    Even though you have the ability to create your own filesystems on CD- or DVD-R/RW
    and spare hard disks, you should still stick with an archiver program like tar
    to make your backups. The primary reason is simple: tar preserve all file attributes,
    including permissions and ownership. In addition, it is easier to manage full
    and incremental backups with tar.


    If you choose to make backups with cddrecord (see Section 11.2.2), your best bet
    is probably to use a compressed tar archive directly to the CD or DVD with a command
    like:


    ```

    tar zcf - | cddrecord dev=cdrecord_args

    ```


    You may need to experiment with the speed option to cddrecord, because the archiving
    command may not produce data fast enough for your recorder.


    Again, remember that this command does not create a filesystem on the disc. To
    restore from the archive, you can just use the raw device.


    # 13.5.1 Backups to Hard Disks


    Using a spare hard disk for backups is relatively easy. Create a regular filesystem
    on the disk and simply write your archives as regular files. You should be able
    to keep a fair amount of data on the spare disk if you use compression and incremental
    backups.


    # 13.6 Tape Drive Devices


    Tape devices are character devices on a Linux system, going by a variety of filenames:


    +   - SCSI tape devices use the names /dev/st0, /dev/nst0, /dev/st1, /dev/nst1,
    and so on. The SCSI tape drive interface and driver is widely regarded as the
    most reliable, but, of course, SCSI tape drives are also more expensive than others.

    - ATAPI tape devices start at /dev/ht0 and /dev/nht0.

    - There is limited support for tape drives on the floppy controller as /dev/ft0
    and /dev/ntf0.


    To identify a tape drive, look in your kernel messages for lines like this:'
  merge: -1
  pgno: 290
- img_proc: true
  md: 'Vendor: HP Model: C1533A Rev: 9503

    Type: Sequential-Access ANSI SCSI revision: 02

    st: Version 20010812, bufsize 32768, wrt 30720, max init. bufs 4, s/g segs 16

    Attached scsi tape tape at scsi0, channel 0, id 4, lun 0


    There are two versions of each tape device on a Unix system:


    +   * A rewind tape device rewinds the tape after every operation. For example,
    /dev/sto is a rewind device.

    * A no-rewind tape device does not rewind the tape after an operation. No-rewind
    devices start with n; for example, /dev/nst0 is a no-rewind device.


    For-to-day operation, rewind devices are practically useless. You may well forget
    that they exist; the next few sections show you that you often need to reposition
    the tape.


    When working with tapes, you sometimes need to know the tape block size. Applications
    tend to write to the tape in a block size, and many tape drives do not allow you
    to read from the tape if you specify the incorrect block size. This is almost
    never a problem, because you normally write and read from the tape with the same
    program. However, if you want to use dd to get direct access to tape files, you
    may need to specify the block size manually (see Section 13.6.7).


    Before you get with a tape drive, you should set the TAPE environment variable
    to the no-rewind device name. This variable saves a lot of typing in the long
    run, in particular, with -f options for the mt and tar commands (which are explained
    in the next section).


    # 13.6.1 Working with Tape Drives


    A tape is one of the simplest forms of media available. You can think of a tape
    as a sequence of files with a file mark between each file, as shown in Figure
    13-1. Notice how there is no file mark at the beginning of the tape and that the
    first file is numbered 0.


    ![](img/53fc0939e3ef3d3d769817a756ee3cbb_291_0.png)


    Figure 13-1: Files and file marks on a tape.'
  merge: -1
