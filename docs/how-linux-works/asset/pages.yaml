- img_proc: true
  md: 'To install an initial RAM disk on a Red Hat Linux system, follow these steps:


    +   Build your kernel and install the modules. Do not run any boot loader configuration
    or reboot just yet.


    +   Run this command to create a RAM disk image (where version is your kernel
    version):


    ```

    mkinitrd /boot/initrd-version version

    ```


    +   If your boot loader is LILO, add this line to your new kernel''s section in
    lilo.conf and run lilo:


    ```

    initrd=/boot/initrd-version

    ```


    +   For GRUB, add the following to the appropriate kernel section:


    ```

    initrd /boot/initrd-version

    ```


    # # 10.6 Testing the Kernel


    When you boot your new kernel for the first time, you should take a careful look
    at the kernel diagnostic messages to make sure that all of your hardware shows
    up and that the drivers are doing what they are supposed to. Unfortunately, kernel
    messages tend to fly by so quickly that you can''t see them. You can run `dmesg`
    to see the most recent messages, but to see everything, you need to look at your
    log files.


    Most /etc/syslog.conf files send kernel messages to a file such as `/var/log/kernel.log`.
    If you don''t see it anywhere, add a line like this to `/etc/syslog.conf`:


    ```

    kernel.* /var/log/kernel.log

    ```


    Then run this:


    ```

    kill -HUP `/var/run/syslogd.pid`

    ```


    You may wish to make a checklist for your new kernel to make sure that your system
    operates as it should. Here''s an example:


    +   - Does the network interface and network firewalls work?


    +   - Are all of your disk partitions still visible?


    +   - Does the kernel see your serial, parallel, and USB ports work?


    +   - Does all of your external hardware work?


    +   - Does the X Window System work?'
