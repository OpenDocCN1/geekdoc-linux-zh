  md: 'Linux distributions usually come with a command to enable and disable services
    in the rc*. directories. For example, in Debian, the command is update-rc.d, and
    in Red Hat, the command is chconfig. Graphical user interfaces are also available.
    Using these programs helps keep the startup consistent and helps with upgrades.


    # HINT


    One of the most common Linux installation problems is an improperly configured
    XFree86 server that flickers and off, making the system unusable on console. To
    stop this behavior, boot into single-user mode and alter your runlevel or runlevel
    services. For looking something containing xdm, gdm or kdm in your rc*. directories,
    or your /etc/initab.


    # 3.1.4 Controlling init


    Occasionally, you need to give init a little kick to switch it to runlevels, re-read
    the initab file, or shut down the system. Because init is always the first process
    on a system, its process ID is always 1.


    You can control init with telit. For example, if you want to switch to runlevel
    3, use this command:


    ```

    telinit 3

    ```


    When switching runlevels, init tries to kill any processes that aren''t in the
    initab file for the new runlevel. Therefore, you should be careful about changing
    runlevels.


    When you need to add or remove spawning jobs or make any other change to the initab
    file, you must tell init about the change and cause it to re-read the file. Some
    people use kill -HUP 1 to tell init to do this. This traditional method works
    on most versions of Unix, as long as you type it correctly. However, you can also
    run this telinit command:


    ```

    telinit q

    ```


    You can also use telit to switch to single-user mode (see Section 3.2.4).


    # 3.1.5 Shutting Down


    init controls how the system shuts down and reboots. The proper way to shut down
    the Linux machine is to use the shutdown command.


    There are two basic ways to use shutdown. If you halt the system, it shuts the
    machine down and keeps it down. To make the machine halt immediately,


    ```

    shutdown -h now

    ```


    On most machines with reasonably recent versions of Linux, halt cuts the power
    to the machine. You can also reboot the machine. For a reboot, use -r instead
    of -h.'
