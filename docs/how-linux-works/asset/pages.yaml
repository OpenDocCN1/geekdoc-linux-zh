  md: "# 8.1 The C Compiler\n\nKnowing how to run the C compiler can give you a great\
    \ deal of insight into the origin of the programs that you see on your Linux system.\
    \ The source code for nearly all Linux utilities, and for many applications on\
    \ Linux systems, is written in the C programming language. C is a compiled language,\
    \ and C programs follow the traditional development process: you write a program,\
    \ you compile them, and they run. After you you must compile the source code that\
    \ you wrote into a binary low-level format that the computer understands.\n\n\
    The C compiler on Unix systems is named cc (on Linux, this is usually a link to\
    \ gcc), and C source code files end with .c. Take a look at the single, self-contained\
    \ C source file called hello.c that you can find in The C Programming Language\
    \ [Kernighan and Ritchie]:\n\n```\n#include <stdio.h>\n\nmain() {\n    printf(\"\
    Hello, World.\\n\");\n}\n```\n\nTo compile this source code, run this command:\n\
    \ncc hello.c\n\nThe result is an executable named a.out, which you can run like\
    \ any other executable on the system. However, you should probably give it another\
    \ name (such as hello). To do this, use the compiler's -o option:\n\ncc -o hello\
    \ hello\n\nFor small programs, there isn't much more to compiling than that. You\
    \ may need to add an extra include directory or library (see Sections 8.1.2 and\
    \ 8.1.3), but let's look at slightly larger programs before getting into those\
    \ topics.\n\n# 8.1.1 Multiple Source Files\n\nMost C programs are too large to\
    \ fit inside one single source code file. Mammoth files become too disorganized\
    \ for the programmer, and compilers sometimes have trouble parsing large files.\
    \ Therefore, developers group components of the source code together, giving each\
    \ piece its own file.\n\nTo compile the .c files, use the compiler's -c option\
    \ on each file. Let's say that you have two files, main.c and aux.c. The following\
    \ two commands do most of the work of building the program:"
  merge: -1
  pgno: 182
- img_proc: true
  md: '```

    cc -c main.c

    cc -c aux.c

    ```


    The preceding two compiler commands compile the two source files into two object
    files (main.o and aux.o). An object file is a nearly complete binary that a processor
    can almost understand, except that there are still a few loose ends. The operating
    system does not know how to run an object file by itself, and you may need to
    combine several object files to make a complete program.


    To build a fully functioning executable from one or more object files, you must
    run the linker — the ld command in Unix. Programmers rarely use ld on the command
    line, because the C compiler knows how to run the linker program properly. To
    create an executable called myprog from the two object files above, run this command
    to link them:


    ```

    cc -o myprog main.o aux.o

    ```


    Although you can compile multiple source files by hand, as the preceding example
    shows, it can be hard to keep track of them all during the compiling process when
    the number of source files multiplies. The make system described in Section 8.1.5
    is the Unix standard for managing compilers. This system is especially important
    in managing the files described in the next sections.


    # 8.1.2 Header (Include) Files and Directories


    C header files are additional source code files that usually contain type and
    library function declarations. stdio.h is a header file (see the simple program
    in Section 8.1).


    Unfortunately, a great number of compiler problems crop up with header files.
    Most glitches occur when the compiler can''t find header files and libraries.
    There are even some cases where a programmer forgets to include a required header
    file, so some of the source code may not compile.


    Tracking down the correct include files isn''t always easy. Sometimes there are
    several files with the same names in different directories, and it''s not clear
    which is the correct. When the compiler can''t find an include file, the error
    message looks like this:


    ```

    badinclude.c:: notfound: No such file or directory

    ```


    This message reports that the compiler cannot find the notfound.h header file
    that the badinclude.c file references. This specific error is a direct result
    of this directive on line 1 of badinclude.c:


    ```

    #include <notfound.h>

    ```'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'The default include directory in Unix is /usr/include; the compiler always
    looks there unless you explicitly tell it to (for example, with gcc -nostdinc).
    However, you can make the compiler look in other include directories (paths that
    contain header files have include somewhere in the name).


    For example, let''s say that you find notfound.h in /usr/junk/include. You can
    make the compiler see this directory with the -I option:


    ```

    cc -c /usr/junk/include badinclude.c

    ```


    Now the compiler should no longer stumble on the line of code in header.c that
    references the header file.

    You should also be careful of includes that use double quotes ("") instead of
    angle brackets (< >), like this:


    ```

    #include "myheader.h"

    ```


    Double quotes mean that the header file is not in a system include directory,
    but the compiler should otherwise search its include path. It often means that
    the include file is supposed to be in the same directory as the source file. If
    you encounter a problem with double quotes, you''re probably trying to compile
    incomplete source code.


    # What Is the C Preprocessor (cpp)?


    The C preprocess is a program that the compiler runs on your source code before
    parsing the actual program. The preprocessor rewrites source code into a form
    that the compiler understands; it''s a tool for making source code easier to read
    (and for providing shortcuts).


    Preprocessor commands in the source code are called directives, and they start
    with the # character. There are three basic types of directives:


    **Include files** An Include directive instructs the preprocessor to include an
    entire file. Note that the compiler''s -I flag is actually an that causes the
    preprocessor to search a specified directory for include files, as you saw in
    the previous section.


    **Macro definitions** A line with #define BLAH something the preprocessor to substitute
    something for all occurrences of BLAH in the source code. Convention dictates
    that macros appear in all uppercase, but it should come as no shock that programmers
    sometimes use macros whose names look like functions and variables. (Every now
    and then, this causes many to make a sport out of abusing the preprocessor.)


    Note that instead of defining macros within your source code, you can also define
    macros by passing parameters to the compiler: -DBLAH=something works like the
    directive above.'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'Conditionals You can mark out certain pieces of code with #ifdef, #if, and
    #endif. The #ifdef MACRO directive checks to see if the preprocessor macro MACRO
    is defined, and by #if condition tests to see if condition is nonzero. For both
    directives, if the condition following the "if statement" is false, the preprocessor
    does not pass any of the program text between the #if and the next #endif to the
    compiler. If you plan to look at any C code, you''d get used to it.


    An example of a conditional directive follows. When the preprocessor sees the
    following code, it checks if the macro DEBUG is defined, and if so, passes the
    line containing printf() to the compiler. Otherwise, the preprocessor skips this
    line and continues to process the file after the #endif:


    ```

    #ifdef

    printf(stderr, "This is a debugging message.\n\n#endif

    ```


    The preprocessor doesn''t know anything about C syntax, variables, functions,
    and other elements. It understands only its own macros and directives.


    On Unix, the C preprocessor''s name is cpp, but you can also run it with gcc -E.
    You will rarely need to run the preprocessor by itself.


    # 8.1.3 Linking with Libraries


    The compiler does not know enough about your system to create a useful program
    by itself. Modern systems require libraries to build complete programs. A C library
    is a collection of common precompiled functions that you can build into your program.
    For example, the math library because it provides trigonometric functions and
    the like.


    Libraries come into play primarily at link time, when the linker program creates
    an executable from object files. For example, if you have a program that uses
    the math library, but you forget to tell the compiler to link against that library,
    you''ll see these errors:


    ```

    math.o+x028: undefined reference to `sin`

    math.o+x036: undefined reference to `pow`

    ```


    The most important parts of these error messages are bold. When the linker program
    examined the math.o object file, it could not find the math functions that appear
    in bold, and as a consequence, it could not create the executable. In this particular
    case, you might suspect that you forgot the math library because the missing functions
    refer to mathematical operations (sine and exponentiation).


    Undefined references do not always mean that you''re missing a library. One of
    the program''s object files could be missing in the link command. It''s usually
    easy to differentiate between library functions and functions in your object files,
    though.'
  merge: -1
  pgno: 185
- img_proc: true
  md: 'To fix this problem, you must first find the math library and then use the
    compiler''s -l option to link against it. With as include files, libraries are
    scattered throughout the system (/usr/lib is the default location), though most
    libraries reside in a subdirector named lib. For the preceding example, the math
    library file is lib.a (/usr/lib), so the library name is m. Putting it all together,
    you would link the program like this:


    ```

    cc -o badmath badmath.o -lm

    ```


    You must tell the linker about nonstandard library locations; the parameter for
    this is -L. Let''s say that the badmath program requires libcrud in /usr/junk/lib.
    To compile and create the executable, use a command like this:


    ```

    cc -o badmath.o -lm -L/usr/junk/lib -lcrud

    ```


    > NOTE If you want to search for a library for a particular function, be prepared
    for a lot of output. For example, try this: nm /usr/lib/libm.a


    # 8.1.4 Shared Libraries


    A library ending with .a (such as libm.a) is a static library. Sadly, the story
    on libraries doesn''t end here.


    When you link a program against a static library, the linker copies machine code
    from the library file into your executable. Therefore, the final executable does
    not need the original library to run.


    However, the ever-expanding size of shared libraries has made static libraries
    wasteful in terms of disk space and memory. Shared libraries counter this problem.
    When you run a program linked against a shared library, the system loads the library''s
    code into the process memory space only when necessary. Furthermore, many processes
    can share the same shared library in memory.


    Shared libraries have their own costs: difficult management and a somewhat complicated
    linking procedure. However, you can bring shared libraries under control if you
    know four things:


    +   * How to list the shared libraries that an executable needs

    * How an executable looks for shared libraries

    * How to link a program against a shared library

    * What the common shared library pitfalls are


    The following sections tell you how to use and maintain your system''s shared
    libraries. If you''re interested in how shared libraries work, or if you want
    to know about linkers and Loaders [Levine], or at the "Inside Story on Shared
    Libraries and Dynamic Loading," [Beazley/Ward/Cooke]. The ld.so(8) manual page
    is also worth a read.'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# Listing Shared Library Dependencies


    Shared library files usually reside in the same places as static libraries. The
    two standard library directories on a Linux system are /lib and /usr/lib. The
    /lib directory should not contain static libraries.


    A shared library has a suffix .so, as in libc-2.3.2.so and libc.so.6. To see what
    shared libraries a program uses, run ldd prog where prog is the executable name.
    Here is the output of ldd /bin/bash:


    ```

    /libreadline.so.2 -> /lib/libreadline.so.2 (0x00419000)

    libncurses.so.3.4 -> /lib/libncurses.so.3.4 (0x00405400)

    lld.so.2 -> /lib/libld.so.2 (0x0048a000)

    cibc.so.6 -> /lib/libc.so.6 (0x0048d000)

    /ld-linux.so.2 -> /lib/ld-linux.so.2 (0x00000000)

    ```


    Executables alone do not know the locations of their shared libraries; they know
    only the names of the libraries, and perhaps a little hint. A small program named
    ld.so (the runtime dynamic linker/loader) finds and loads shared libraries for
    a program at runtime. The preceding ldd output shows the names on the left — that’s
    what the executable knows. The right side where ld.so finds the library.


    # How ld.so Finds Shared Libraries


    The first place that the dynamic linker should normally look for shared libraries
    is an executable preconfigured runtime library search path (if one exists). You
    will see how to create this path shortly.


    Next, the dynamic linker looks in a system cache, /etc/ld.so.cache, to see if
    the library is in a standard location. This is a fast cache of the names of libraries
    found in directories listed in the cache configuration /etc/ld.so.conf. Each line
    in this is a directory that you want to include in the cache. The list of directories
    is usually short, containing:


    ```

    /usr/X86/lib

    /usr/lib/libc5-compat

    ```


    The standard library directories /lib and /usr/lib are implicit — you don’t need
    to include them in /etc/ld.so.conf.


    If you alter ld.so.conf or make a change to one of the shared library directories,
    you must rebuild the /etc/ld.so.cache file by hand with the following command:


    ```

    ldconfig -v

    ```


    The -v option provides detailed information on libraries that ldconfig adds to
    the cache and any change it detects.


    There is one more place that ld.so looks for shared libraries: the environment
    variable LD_LIBRARY_PATH. Before discussing this variable, let’s look at the runtime
    library search path.'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Linking Programs Against Shared Libraries


    Don''t get into the habit of adding stuff to /etc/ld.so.conf. You should know
    what shared libraries are in the system cache, and if you put every bizarre little
    library directory into the cache, you risk conflicts and an extremely disorganized
    system. When you compile software that needs an obscure library path, give your
    executable a built-in runtime library path.


    Let''s say that you have a shared library named libweird.so in /opt/bizarresoft/lib
    that you need to link myprog against. Link the program as follows:


    ```

    cc -o myprog myprog.o -wl,-rpath=/opt/obscure/lib -L/opt/obscure/lib -lweird

    ```


    The -wl,-rpath option tells the linker to include a following directory into the
    executable''s runtime library path. However, even if you use -wl,-rpath, you still
    need the -l flag.


    # Problems with Shared Libraries


    Shared libraries provide remarkable flexibility, not to mention some really incredible
    hacks, but it''s also possible to abuse them to the point where your system is
    in an utter and mess. Three particularly bad things can happen:


    +   - Missing libraries

    - Terrible performance

    - Mismatched libraries


    The number cause of all shared library problems is an environment variable named
    LD_LIBRARY_PATH. Setting this variable makes ld.so search the given directories
    before anything else looking for a shared library. This is a cheap way to make
    programs when you move a library around, or if you don''t just want to recompile
    the executables. Unfortunately, you get what you pay for.


    > Never set LD_LIBRARY_PATH in startup files or when compiling software. When
    the dynamic linker encounters this variable, it must often search through the
    entire contents of each specified directory more times than you would care to
    know. This causes a big performance hit, but more importantly, you can get conflicts
    and mismatched libraries because the runtime linker looks in these directories
    for every program.


    If you must use LD_LIBRARY_PATH to run some custom program for which you don''t
    have the source (or an application that you''d not compile, like Mozilla or some
    other beast), use a wrapper script. Let''s say that your executable is /opt/cummy/bin/cummy.bin
    and it needs some shared libraries in /opt/cummy/lib. Write a wrapper called cummy
    that looks like this:'
  merge: -1
  pgno: 188
- img_proc: true
  md: "```\n#!/bin/sh\nLD_LIBRARY_PATH=/opt/crummy\\export LD_LIBRARY_PATH\nexec /opt/crummy/bin/crummy.bin\
    \ $@\n```\n\nAvoiding LIBRARY PATH prevents most shared library problems. But\
    \ one other significant problem that occasionally comes upon developers with a\
    \ library's application programming interface (API) may change slightly from one\
    \ minor version to another, breaking installed software. The best solutions here\
    \ are preventive: either use a system like Encap (see Section 9.4) to install\
    \ shared libraries with -l,-rpath to create a runtime link path, or simply use\
    \ the static versions of obscure libraries.\n\n# 8.1.5 Make\n\nA program with\
    \ more than one source code file or requiring strange compiler options is too\
    \ cumbersome to compile by. This problem has been around for years, and the traditional\
    \ Unix compile management utility that eases these pains is called make. You need\
    \ to know a little about if you're running a Unix system, because system utilities\
    \ sometimes rely on make to operate. However, this chapter is only the tip of\
    \ the iceberg. The classic guide for compiled languages and make is the UNIX Programming\
    \ Environment [Kernighan and Pike]\n\nmake is a big system, and there are entire\
    \ books on the subject (such as Managing Projects [Oram]), but it's not very difficult\
    \ to get an idea of how it works. When you see a file named Makefile or makefile,\
    \ you know that you're dealing with make. (Try running make to see if you can\
    \ build anything).\n\nThe basic idea behind make is the target, a goal that you\
    \ want to achieve. A target can be a file (.o file, an executable, and so on)\
    \ or a label. In addition, some targets depend on other targets — for instance,\
    \ you need a complete set of .o files before you can link your executable. The\
    \ targets on which another target depends are called dependencies.\n\nTo build\
    \ a target, make follows a rule, such as a rule for how to go from a .c source\
    \ to a .o object file. make already knows several rules, but you can customize\
    \ these existing rules and create your own.\n\nThe following is a very simple\
    \ Makefile that builds a program myprog from aux.c and main.c:\n\n```\nOBJ=aux.o\
    \ main.o\n# object files\n\nall: myprog\n\nmprog: $(OBJS)\n\t$(CC) -o myprog $(OBJS)\n\
    ```"
