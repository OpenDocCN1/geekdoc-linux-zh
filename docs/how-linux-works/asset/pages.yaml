  md: '# THE LINUX ENTERPRISE CLUSTER


    by KARL KOPPER


    The Linux Enterprise Cluster explains how to take a number of inexpensive computers
    with limited resources, place them on a normal network, and install free software
    so that the computers act together like one powerful server. The book includes
    information on how to build a high-availability server pair using the Heartbeat
    package, how to use the Linux Virtual Server load balancing software, how to configure
    a reliable printing system in a Linux cluster environment, and how to build a
    job scheduling system in Linux with no single point of failure.


    MAY 2004, 456 PP., $49.95 ($72.95 CAN) W/CD


    ISBN 1-59327-036-4


    ![](img/53fc0939e3ef3d3d769817a756ee3cbb_371_0.png)


    # THE BOOK OF WEBIN


    ...or How I Learned to Stop Worrying and Love Unix


    by JOE COOPER


    A comprehensive guide to Unix system administration with Webmin, the Open Source
    system administration tool. Everything you need to know about Webmin''s unique
    features, including the standard system features (network configuration, disk
    configuration, users and groups, etc.) and how to integrate the most popular services
    (Apache, BIND, Sendmail, and more). Tutorials show how to accomplish common tasks
    with each service.


    JULY 2003, 312 PP., $34.95 ($52.95 CAN)


