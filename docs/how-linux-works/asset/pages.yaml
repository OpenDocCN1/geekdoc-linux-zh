    #  11.3.2 USB Input Devices


    Basic USB keyboard and mouse support is not complicated. To use these devices
    on your system, you need the USB human input device (HID) driver in your kernel.
    The relevant kernel log looks like:


    ```

    drivers/usb/input/hid-core.c: v2.0:USB HID driver

    ```


    With in place, any USB keyboard that you plug into your computer should work with
    no further configuration. Here is the message the kernel logs when you plug in
    an old Apple keyboard:


    ```

    input: USB HID v1.10 Keyboard [Alps Electric Apple USB Keyboard] on

    usb-0000:00:02.0-1

    ```


    USB mice aren''t much more to configure; the only thing you need is to tell the
    X server or gdm where to find a USB mouse (look at /etc/X11/XF86Config file and
    grep for gdm in your init.d directory). The kernel maps all mice to /dev/input/mice,
    using the PS/2 mouse driver. The kernel message results from the hookah of a new
    mouse looks like:


    ```

    input: USB HID v1.10 Mouse [Logitech USB Optical Mouse] on usb-0000:00:02.0-1

    ```'
