- img_proc: true
  md: 'Most people would rather just not have to deal with it, but that attitude and
    a broadband connection will get your system compromised in no time. Frankly, you
    don''t need to know very much to keep your system safe. Here are a few basic rules
    of thumb:


    **Run as few services as possible** Intruders can break into services that don''t
    exist on your system. If you know what a service is, and you''re not using it
    at the moment, don''t turn it on just in case you might want it.


    **Block as much as possible with a firewall** Unix systems have a number of internal
    services you may not know about, such as TCP port 6000 for the X Window System
    server. No other system in the world needs to know about these services, and.
    Furthermore, it is very difficult to track and regulate the services on your system,
    because many different kinds of programs listen on ports. You can prevent intruders
    from discovering internal services with effective firewall rules. Refer to Section
    5.13.1 for an example


    **Keep on top of the services that you offer to the Internet** If you run an SSH
    server or Postfix or other services, make sure that you have the ability to stay
    up to date with the software and get appropriate alerts. See Section 6.7.4 for
    some online resources.


    **Don''t give access to anyone who doesn''t need an account** It''s much easier
    to gain superuser access from a local account than it is to break in remotely.
    In fact, given the huge base of software (and the resulting bugs and design flaws)
    available on most systems, it''s almost laughably easy to gain superuser access
    to a system after you get to a shell prompt. Don''t assume that your friends know
    how to protect their passwords (or to choose good passwords in the first place).


    **Avoid installing binary packages** They can contain Trojan horses.


    That''s the practical end of protecting yourself. You should know few basics on
    why it is important to do so. There are three basic kinds of network attacks:


    **Full compromise** This means getting superuser access (full control) of a machine.
    An intruder can accomplish this by trying a service attack, such as a buffer overflow,
    or by taking over a poorly protected user account, and then trying to exploit
    a poorly written gesetzt program.


    **Denial-of-service (DoS) attacks** These prevent a machine from carrying out
    its network services, or they force a computer to malfunction in some other way
    without any special access. These attacks are harder to prevent, but they are
    easier to respond to.'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'Virus or worm Linux users are mostly immune to email worms and viruses, simply
    because their email clients aren’t so stupid as to actually run programs that
    they get in message attachments, and Linux isn’t as attractive a target as Windows.
    However, you can create a Linux virus; it has been done before, and as Linux gains
    popularity, it will happen with increasing frequency. Avoid binary software distributions,
    especially from places that you’ve never heard of. Some network services have
    been susceptible to worms before, and history is doomed to repeat itself.


    # 6.7.1 Where Linux Distributions Stand


    Not long ago, installing Linux distributions on easily accessible networks (such
    as university networks) practically ensured security compromises. These distributions
    activated every single service by default and had no default firewalling. wasn’t
    just Linux, either — Solaris was remarkably good at leaving the door open, not
    to mention the hundreds of Windows exploits, and so on.


    Linux distributions are better now; they do not activate every possible service,
    and they tend to come with preconfigured firewalls. There is no doubt that the
    firewalls do most of the work. Programmers delight in adding new network services,
    especially for GUI applications and support, security often takes a backseat.
    Better authentication (such as the Kerberos system) would help tremendously, but
    this happens to be one of the weakest and most disorganized areas of applications.


    A firewall isn’t necessarily the ideal solution, but it does offer a uniform way
    to block all network traffic. The only thing that ever came to close in the past
    was the TCP wrapper system, but only worked for inetd servers and applications
    that specifically included wrapper.


    In a perfect world, programmers would write invulnerable code, while you wait
    for a perfect world, you need to know what to look for.


    # 6.7.2 Typical Vulnerabilities


    There are two important kinds of vulnerabilities that you need to worry about:
    direct attacks and clear-text password sniffing. Direct attacks try to take over
    your machine without being terribly subtle. The most common type of attack is
    a buffer overflow exploit, where a careless programmer doesn’t check the bounds
    of a buffer array. The attacker fabricates a stack frame inside a huge chunk of
    data, dumps it to the remote server, then hopes that the program overwrites its
    program data and eventually executes the new frame. It’s a somewhat complicated
    attack, but easy to replicate.


    On the other hand, clear-text passwords can allow intruders to log in to your
    machine. From there, they will inevitably try to gain user access locally (which
    is much easier than making a remote attack), try to use the machine as an intermediary
    for attacking other hosts, or both.'
