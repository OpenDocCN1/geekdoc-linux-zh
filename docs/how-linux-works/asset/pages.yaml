  md: '# 12


    # PRINTING


    The printing process on Unix works roughly as follows:


    +   1. An application generates a document to print.

    2. You or the application sends the document to a print server by means of a print
    client program.

    3. The print server puts the document on a queue.

    4. When it is the document''s turn to print, the print server sends the document
    through a print filter` program.

    5. The print filter changes the document to make it acceptable to a printer.

    6. If the printer does not understand PostScript (the standard document format
    in Unix), another print filter must rasterize the document into a bitmap format
    that the printer understands.

    7. The print server sends the result to the print device.


    Making your printer work on a Unix system can be a trying experience. There are
    several problems:


    +   * There are a few standards.

    * Each stage of the process can present any number of errors.'
  merge: -1
  pgno: 259
- img_proc: true
  md: '+   There are several different client, server, and filter packages for printing.


    +   It''sometimes difficult to determine the purpose of each printing system component.


    +   The existing software never seems quite satisfactory, so upgrades are frequent.


    +   Security holes run rampant in network print servers.


    +   There are two basic ways to configure network printing: one where all computers
    send their documents directly to a printer, and the other use all computers send
    their documents to a print server, which then talks to the printer. It can be
    confusing when you have a network full of machines that use both approaches.


    With all of this, you may not even want to learn how printing works. To be perfectly
    honest, if your distribution''s printer setup tool works for you, it is not worth
    going any further, as long as you know how to firewall the print server''s network
    port. However, when things don''t work according to plan, the information in this
    chapter will help you find out where the problem lies.


    This chapter explains the pieces of the printing system on Linux and then shows
    you how to put everything together using CUPS (Common Unix Printing System). The
    best place to start is the print code that applies create PostScript.


    # 12.1 PostScript


    Unix applications that generate PostScript files as output. PostScript is not
    a simple file format; rather, it is a page description language. Therefore, PostScript
    documents are programs, so you need an interpreter to view or read them. Most
    mid-to-high-end printers understand PostScript, as do certain inkjet printers,
    the cheapest printers do not. If you have such a printer (and doesn''t like to
    buy cheap hardware), your computer must perform the extra step of rasterization
    before the document is sent to the printer.


    When you raster a PostScript file, you convert its vector graphics into a bitmap.
    On Linux, the Ghostscript program does this. Ghostscript can produce output for
    almost any printer on the market, but it also has many uses because it is a full-featured
    PostScript interpreter. See Section 12.6 for more information.


    If you are interested in PostScript as a programming language, PostScript Language
    Tutorial and Cookbook [Adobe 1985] is a good introduction to the language, and
    PostScript Language Reference Manual [Adobe 1999] serves as a comprehensive guide
    to the language features. However, if you just want an example PostScript file
    for tests, use a Web browser''s print-to-file feature.'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# 12.2 Print Servers


    There are several different Unix print servers. Here are just a few:


    +   - Berkeley LPD (Line Printer Daemon) One of the oldest print servers around,
    this system is fairly stable, but is somewhat sparse on features and can be difficult
    to configure. Many network-capable printers have integrated LPD servers.


    +   - LPRng This new spin on LPD has many features, but in all honesty, is not
    easier to configure. You may also see a related package named PLP (Portable Line
    Printer).


    +   - lpsched This is the System V system. If you''re lucky, you''ll never have
    to see it.


    +   - CUPS (Common Unix Printing System) Sooner or later, was bound to get fed
    up with the ugly print clients and daemons on Unix that wanted to rip everything
    to pieces. CUPS is the latest entry in the Unix printing field, and it may prove
    to be the most successful. Its internals and protocol departs from the older printing
    systems, but it still has a server (called the scheduler) and print filters. In
    addition, the client commands are mostly identical to the lpsched commands, with
    LPD-compatible substitutes as well.


    This chapter concentrates on CUPS, which is quickly gaining popularity because
    it is much easier to configure and use than the alternatives. In particular, CUPS
    offers a Web-based interface for many of the more mundane printing tasks.


    # 12.3 Print Filters


    Two print filters dominate Unix printing:


    +   - Foomatic This print filter works with almost any print server, and on the
    command line. Foomatic can call Ghostscript for printers that do not understand
    PostScript.


    +   - ifhp This is a general-purpose filter for Postscript printers. ifhp is an
    older print filter that works well with the Berkeley LPD-style servers.


    # 12.4 Print Clients


    There are two traditional clients that send data to a print server:


    +   - lpr This is the matching client for Berkeley LPD-based servers. Associated
    programs include lpq (to view the current printer job queue) and lprm (to remove
    a job from the queue).


    +   - lp Both CUPS and System V lpsched used to print (CUPS also has limited lpr
    capability). The lpstat command shows printer jobs, and cancel removes a print
    job.'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'On traditional Linux systems, you send a PostScript job to the printer printer
    with a command like this (you do not need -Pprinter if you want to send the job
    to the default printer):


    ```

    lpr -Pprinter

    ```


    For CUPS, you may also use the lp program (-d printer is optional if you are sending
    to the default printer):


    ```

    lp -d printer file

    ```


    Commands like lpr and lp let you send any PostScript file or data pipeline directly
    to a printer. However, one of the biggest problems with this is that users have
    no idea what the printer expects PostScript (in fact, most users have no idea
    what PostScript is). In response, administrators change their print filters to
    automatically convert plain-text input files into PostScript so that users can
    use lpr to send either a PostScript or plain-text file to the printer without
    worrying about conversions.


    Operating systems don''t usually let you get close to the printer; instead, they
    make you print through an application that produces the correct output. Unix has
    these applications, (such as gimp and gimp-counterpart), but Unix also lets you
    get very close to the printer with lpr.


    Users tend to print pictures and other kinds of data. If you send a JPEG file
    or other file to a printer with lpr, it may do the right thing if the administrator
    set up the print filter to recognize and filter the file. More often than not,
    the printer system rejects the file or printer endless pages of junk, because
    the system tried to convert the binary file into PostScript using the text filter.


    Therefore, it is extremely important that you know where the system converts your
    file into PostScript. This is not a problem if you primarily use graphical applications
    to print, because these programs generally generate PostScript and send the result
    to a command such as lpr. However, if you like to use the command line, you must
    be very careful about what you send to the printer.


    CUPS is fairly about document conversions because it attempts to determine the
    MIME type of any input data before sending it to the printer. Furthermore, the
    system verifies that it can convert the data to something that the printer understands.
    If CUPS doesn''t know how to convert the data, the CUPS server rejects the document
    rather than passing the printer data it won''t understand.


    # 12.4.1 Network Printing


    You should have an idea of how network printing clients send data to print servers:'
  merge: -1
  pgno: 262
- img_proc: true
  md: '+   • Berkeley LPD clients send data to TCP port 515 on a print server.


    +   • CUPS uses the Internet Printing Protocol (IPP). IPP is a TCP protocol that
    looks like HTTP (Hypertext Transfer Protocol). The standard IPP port is 631, CUPS
    also comes with a daemon that handles the LPR protocol on 515.


    +   • Most-network-ready PostScript laser printers allow you to connect to TCP
    port 9100 and talk directly to the print engine. Most network-aware printers use
    filters to send data to the port.


    Regardless of the protocol, you should be especially vigilant with respect to
    open network ports on print servers. Filter out or any open ports. There have
    been serious vulnerabilities in print servers in the past, and you can expect
    that more will crop up in the future, especially with a system as new as CUPS.
    This also holds true for network-aware printers. You do not want an intruder to
    waste the money that you spend on printer supplies.


    # # 12.5 CUPS


    With these preliminaries out of the way, let''s look at CUPS. CUPS has several
    interfaces, including a Web-based status and administration tool. The Web interface
    is very good for normal maintenance and operation, and unfortunately, if your
    needs lie outside the abilities of the interface, you still have to know how the
    system works and where the various configuration files reside.


