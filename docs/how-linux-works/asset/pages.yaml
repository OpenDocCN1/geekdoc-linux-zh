- img_proc: true
  md: 'is also fairly small. Whether you purchase a hub or a switch, pick a model
    that has ports for each of your computers, plus a few extra. Also, make sure that
    the hardware supports the older 10Base-T standard. This feature is often called
    10/100, and it provides the most convenient way to move files from an old computer
    with a 10Base-T interface.


    # Wireless Ethernet


    You may consider wireless Ethernet for a notebook, even if you don''t plan to
    use Ethernet when you''re on the go. There are several advantages:


    +   * It is one less cable to connect. This saves time as well as and tear on
    the machine.

    * Visitors with wireless cords can connect to your network without hassle.

    * Some PDAs can connect to a network with wireless Ethernet.

    * You may need to connect to a foreign network at some time.


    There are some disadvantages:


    +   * It is more expensive.

    * Security can be a hassle (see Section 5.15.1).

    * There are some really annoying twerps who think that wireless Ethernet makes
    them the coolest people on the planet.


    To make wireless Ethernet, you need a wireless access point along with the network
    card (some notebooks come with integrated cards). Many access points come in units
    that also provide a broadband router and an integrated switch. Even if you don''t
    have a broadband connection or choose not to use the routing feature, the switch
    can still be used for connecting desktop computers.


    For Notebook Ethernet cards, see Section 11.6. For information on how to set up
    a wireless client, see Section 5.15.


    # 17.1 Graphics Hardware


    Your primary concern in choosing a video card should be compatibility with XFree86.
    Although you can inspect the list of compatible cards at http:////www.xfree86.org/
    and http://www.x.org/, it is unfortunately not easy to identify a card because
    manufacturers have a habit of not changing product names while altering hardware
    significantly.


    As with the motherboard, a good method for ensuring your graphics are compatible
    with your system is to identify a brand or particular graphics chip that has consistent
    support and find a video card that isn''t cutting-edge. If a card has been available
    for some time, there is a much greater chance of XFree86 support. Regarding performance,
    quick video hardware often means very little under Linux; in fact, the fastest
    3-D hardware may not be optimal for normal tasks in XFree86.'
  merge: -1
  pgno: 336
- img_proc: true
  md: 'XFree86 supports multi-output video cards and additional cards that can drive
    multiple monitors, sometimes called multiple heads. If you value your onscreen
    workspace, this is worth looking because the emergence of LCD displays makes it
    feasible to have two monitors without the desk size of an aircraft carrier. You
    can also combine multiple displays into one big virtual display with the Xinerama
    extension.


    # 17.2 Other Hardware Components


    Now it''s time to move beyond the essential components and look at your choices
    for the other parts that you can attach to a computer.


    # 17.2.1 Monitors


    Because you will work with the shell interface more under Unix than other operating
    systems, you should choose a monitor that displays crisp text. In addition, high
    resolution is important in a monitor because you want the ability to display at
    least shell or text editor windows at once, so that you can quickly switch between
    them. However, to the beginner, it is always tempting to reduce the font size
    to accommodate more windows, but because this increases eye strain, there is no
    real substitute for a large display.


    Traditional Unix workstations like Sun SPARCstations usually come with large,
    heavy, expensive cathode ray tube (CRT) monitors offering some of the highest
    resolutions commercially available. CRT displays are lighter and carry the lowest
    price tags of high-end displays. However, above all, an LCD display offers a razor-sharp
    text display that is impossible on any CRT. This advantage, combined with a very
    light, small footprint, and lack of a flyback transformer makes a good case for
    an LCD display for all but the most special-purpose applications. (At some point
    in the not-so-distant future, a CRT will not even be a consideration, rendering
    this paragraph a historic curiosity.)


    As mentioned above, traditional monitors that paired with Unix machines had high
    resolutions. The minimum that Sun and Next used was 1152 × 900 (often called megapixel
    displays), and most users found it comfortable (you won''t find this option on
    modern LCD displays). 1024 × 768 is a little cramped but possible if you keep
    a minimal desktop. It may also be the only option if you are shopping for a notebook.
    1280 × 1024 display is the next step up and it is often ideal; if you have to
    have just a little extra money and are itching to spend it on something worthwhile,
    this is it. Higher resolutions such as 1600 × 1200 are good if you have large
    graphics to display. However, if especially for text, it is better to buy a second
    monitor and use'
  merge: -1
  pgno: 337
- img_proc: true
  md: 'the multi-monitor support mentioned in Section 17.1.5. A multi-monitor configuration
    costs less than a single huge monitor and gives you more effective onscreen space
    due to the layout of the monitors.


    # ## 17.2.2 Keyboards


    Choose your keyboard wisely


    If intend to run only Unix on your computer, keys other than those immediately
    around the alphanumerics aren''t very important. You don''t really need numeric
    keypad or 37 function keys. Arrow keys are also less important when running Unix
    unless you''re playing a game. Nearly every program that takes text input CONTROL-P,
    CONTROL-N, CONTROL-B, and CONTROL-F (up, down, left, and right). In vi, you will
    make use of h, j, k, and l (left, down, and right).


    One little thing to watch out for is the CAPS LOCK. On virtually every keyboard
    made, it is next to the A key. This is wrong; the CONTROL key belongs. Philosophical
    issues aside, see if the CAPS LOCK is large enough and doesn''t have an overly
    weird shape. You should remand the CAPS key to CONTROL and use it that way.


    # ## 17.2.3 Mice


    Other than your personal preferences and testing, there is only one thing to remember
    when buying a mouse: *Make your mouse has at least three buttons*. The third (middle)
    button in X Window System applications does a paste operation; you don''t want
    to be without it. You can use it to paste a URL into a browser window. Also, clicking
    on a link in Mozilla with the middle button makes the link appear in a new window
    or tab.


    In a modern mouse, the scroll usually doubles the third button when pressed down.
    The scroll wheel is more difficult to press than a real button, and many Unix
    veterans dislike this. However, there may be some merit to it, because clumsy
    fingers on traditional three-button mice have been known to paste strange commands
    into Unix shells and editors.


    # ## 17.2.4 Modems


    Most modems and many voice modems work with Linux. There is only one very important
    rule when buying a modem for Linux: *Never buy a Win modem*. These devices require
    complicated software drivers to signal processing. There are some straggling Linux
    drivers for certain Winmodems'
  merge: -1
  pgno: 338
- img_proc: true
  md: 'out here, but you shouldn''t bother. You don''t want to waste time trying to
    set this up, and you don''t want the extra strain on your kernel. It is unfortunate
    that many notebooks come with Winmodems; if you have a Winmodem in your notebook,
    your only option is usually to get a PC Card modem.


    That said, for desktops you have a choice between internal and external modems.
    Internal modems are cheaper, do not have power supplies, and need no cords other
    than the telephone line. Unfortunately, they may require some Plug-and-Play manipulation
    or disabling of built-serial ports. You may be able to use an external USB modem,
    but make sure there''s a Linux driver before you buy.


    # 17.2.5 Printers


    Because Unix printers generate the PostScript description language, the easiest
    way to get a Linux-compatible printer is to buy the line. Many laser printers
    and some inkjet printers come with this capability. Unfortunately, these printers
    are also more expensive than those with simpler imaging technology.


    Linux also supports printers that don''t understand PostScript by using Ghostscript
    to transform the PostScript generated by the printers into something these printers
    understand. This adds an extra step to the printing process inside your machine,
    and it can be difficult to configure (see Chapter 12).


    There are three common ways to connect a printer to a Linux system: using a parallel
    port, using a USB port, or adding the printer to a local area network. The parallel
    port is an old somewhat primitive method, but it works well. USB is the newest
    method and should work as well as your USB drivers do. Printing on the network
    is fast, it requires no extra kernels, and it is often the easiest to configure.
    Most network-capable printers also support PostScript, but they are considerably
    more expensive than their non-networked counterparts.


    # 17.3 A Word About Hardware Upgrades


    Before we look at how you can save money, you should know something about upgrades.
    For many people, some kinds of products seem more appealing because you can upgrade
    them somewhere down the line. This may work for old tools and kitchen appliances,
    but the computer industry doesn''t think that way. They want you to buy something,
    use it for a year, throw it away, and then buy the newest model instead of any
    money if they actually had to offer upgrades for the dinosaurs of the past. Really,
    computers just aren''t designed like the Stanley #5 jack plane, which was offered
    in the same basic form for 115 years.'
  merge: -1
  pgno: 339
- img_proc: true
  md: 'If you see something advertised as being upgradable to some future specification
    with some extra piece of hardware, it probably isn''t going to do you a whiff
    of good, especially if that extra piece of hardware doesn''t exist yet. It means
    means the company has a newer product that isn''t quite ready, and therefore,
    the marketing department is trying to think of ways to milk an old product. If
    that little upgrade actually does appear, it will most likely be crippled because
    the old and new technologies are so different that the engineers have to do really
    bogus stuff to get the things to talk to each other. I could bring countless examples,
    many involving CPUs, but you should work your mind on this one.


    So what can you upgrade, and what kinds of parts can you carry from an old computer
    to a new one? Disks, for one, are always fairly easy to add to a machine, whether
    a disk is new or used. Memory is a little more complicated. For the most part,
    you can always add more memory to your existing system, but keep in mind that
    you may need to remove some of your old memory to make room for the new stuff.


    You should regard the motherboard, processor, and memory as one when purchasing
    hardware. Don''t even think of carrying just one of these components over to a
    newer system (well, this is a slight fit; sometimes you can keep your memory,
    but it''s very rare). May also need a new power supply, case, or graphics card
    when you upgrade other hardware on your system, because the standards for these
    components are not terribly stable.


    Peripherals and USB devices are easier to carry from system to system. Peripheral
    devices (like printers) of what you have works. And if you have a keyboard or
    mouse that you like on your old system, then in the name of your sanity, don''t
    get rid of it. I hate to say this, but they just don''t build keyboards like those
    they used to. It might be worth buying a special adapter to make an old keyboard
    compatible with a new system (for example, to convert an AT keyboard to USB).


    Upgradable firmware (embedded software) in external hardware components (such
    as modems) is also a good thing, because it''s much easier for a company to write
    software to support new protocols than to develop and produce hardware fixes.


    # 17.4 Saving Money


    Axiom 3 in the introduction to this chapter stated that you often get what you
    pay for; in other words, you might need to pay for a system that works and works
    well. However, there''s no injunction against saving money. If you don''t have
    an obsession with the very latest products, and you know what to look for, you
    can look for slightly older stuff and save a substantial sum.'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# 17.4.1 CPU


    Although it is true that your CPU does most of the work on a Linux system, the
    CPU normally spends most of its time doing absolutely nothing. The uptime command
    usually reveals that the processor isn''t running jobs. If processor speed is
    important to you, you''ll know it from the type of computing that you do, be it
    graphics or numerical analysis. For the vast majority of users, there are many
    features more important than CPU speed, and carefully choosing a processor is
    one of the best ways to spend money on a new computer.


    Nowhere does price so wildly diverge among processors. A vendor''s list at the
    time of this writing shows once for its fastest CPU. The next step down is 50
    percent of that price, but it is still 91.5 percent as fast as the top model.
    A slower processor costing 25 percent of the top model retains 78 percent of the
    performance. Now you may ask yourself, maybe I need that extra 22 percent of power?
    For comparison, I am typing this on a computer that is only 12 percent as fast
    as the top processor in list, and I have no complaints.


    The trick to selecting a processor is to pick a spot on the performance/price
    curve that looks good. Figures 17-1 and 17-2 show plots of ten processors. Figure
    17-1 shows how quickly price rises as the processor speed reaches the fastest
    available. In Figure 17-2 on the next page, you can see how much performance you
    get for each dollar that you spend for the same of processors.


    ![](img/53fc0939e3ef3d3d769817a756ee3cbb_341_0.png)


    Figure 17-1: Costs of several processors.'
  merge: -1
  pgno: 341
- img_proc: true
  md: '![](img/53fc0939e3ef3d3d769817a756ee3cbb_342_0.png)


    Figure 17-2: Performance value.


    If you are strictly interested in getting the most bang for the buck, the best
    choice is the CPU represented by the maximum in the graph on the right. However,
    keep in mind that you may want to go for one of the CPUs with slightly faster
    numbers because it may cost only a few dollars more, or you might be able to buy
    a CD or something else with the savings from choosing a marginally slower option.


    You must be cautious in measuring the performance of a processor. The only halfway
    way to compare processors is to compare different *same model*. Looking at the
    megahertz (MHz) numbers of two different models, even from the same manufacturer,
    is comparing apples and oranges. The benchmark results you read about are also
    unreliable because operation speeds vary among different processors. Unless you
    know exactly what you''re looking for, benchmarks are next to useless. Decide
    on a price first, and then look for the best deals among the models that fall
    within your range.


    If you find any of this economic analysis remotely interesting, you might want
    to read the first chapter of *Computer Architecture: A Quantitative Approach [Hennessey].


    # 17.4.2 Hard Disk


    More expensive hard disks often provide more space for the money. For example,
    a certain hard disk may offer 100 percent more space over another model for 33
    percent more money. But if you''re running Linux,'
  merge: -1
  pgno: 342
- img_proc: true
  md: 'is an operating system with relatively low system storage requirements, is
    "supersizing" really worth it? Considering how much a modern hard disk store,
    will you actually use that extra space before you buy another disk?


    By the time you need to purchase another disk, you may find that the cost per
    megabyte on a new disk is lower, or there be desirable technology improvements
    that may just make you want to decommission your old disk. Remember that the hard
    disk still has moving parts, and it is therefore one of the least reliable components
    in a computer.


    # 17.4.3 Computer Case


    Ugly cases with unrefined power supplies and unsophicated internal structures
    are cheaper. If you''re not picky and can put up with the hassle, this could be
    worth it (that is, you are a graduate student and know what it means to have something
    "cheap but somewhat functional if not kind of "annoying"). Also, you might be
    able to get a used case for free. Be careful, though: a secondhand power supply
    may not work with your motherboard, and it may not work at all.


    # 17.4.4 Video Card


    Sometimes you can get a graphics card that the vendor targets for office users.
    These cards are often less expensive than others. Old, or discontinued models
    on clearance won''t hurt performance on Linux.


    # 17.5 Notebooks


    It is difficult to balance Linux compatibility with the latest features on notebook
    computers. The most common problems with notebooks are built-in video chipsets
    that XFree86 does not support. Other components that tend to lack drivers are
    Ethernet interfaces, sound cards, and CD-ROM drives.


    The community is a good place to look for information on Linux notebook compatibility.
    The http://www.tuxmobile.org/ site is a clearinghouse links to people who are
    running Linux on nearly all notebook models. However, these pages are out of date,
    and the driver configuration or bug fixes described may not be necessary with
    current Linux drivers.


    # 17.6 Smaller Designs


    Once upon time, if you wanted a PC, your options were limited to large machines.
    Because interchangeable parts were so important to build the PC as a commodity,
    manufacturers were reluctant to design anything smaller because the form factor
    would change and be incompatible with everything on the market. Very small Unix
    machines were on the market, such as the Sun SPARCStation IPC and IPX, but they
    were expensive.'
  merge: -1
  pgno: 343
- img_proc: true
  md: 'This is changing. Increased demand from consumers, small dimensional standards
    taken largely from notebook computers, and special applications have created a
    market for a new class of machines. Form factors such as Mini-ITX are now on the
    market. They aren''t the fastest computers around, and they aren''t overly expandable,
    but they have big advantages. They are small, quiet, use less power, generate
    less heat, and are astonishingly inexpensive. Linux has made a contribution to
    the increasing popularity of these machines. Where a computer with relatively
    low processor stood no chance against a market using Microsoft''s resource-hungry
    operating systems, the increasing population of Linux users does not care. Manufacturers
    know this and make sure that their products support Linux.


    The current small machines are hybrids. The motherboards can still fit into standard
    cases, use normal-size memory, and often have a single PCI slot. They accept standard
    PC components, even the power supply. However, because many of the components
    are self-contained and generate little heat (including power supplies), it has
    become fashionable to custom-build smaller enclosures. These machines really shine
    when placed in special cases that will not accept larger components.


    One common example of this is the CD-ROM drive. On a regular desktop computer,
    these devices are gigantic because they fit into a half-height 5 1/4-inch drive
    bay. To make them fit in a smaller machine, an easy substitution for the normal
    size CD-ROM drive is a notebook CD-ROM drive. Like the embedded processors found
    on many small motherboards, a notebook CD-ROM drive may not be as quick as its
    larger cousin, but it is a fraction of the size.'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# 18


    # FURTHER DIRECTIONS


    There’s a lot to Linux. This book can only go so far, although it’s time to wind
    down, this chapter will give you an idea of what lies beyond the fundamental topics
    covered in this book.


    #  18.1 Additional Topics


    Most (but not all) of these topics are network related. Furthermore, none are
    specific to Linux; you can carry the knowledge you have of them and from other
    Unix systems.


    **Email** Email is a big topic. Chapters 5 and 6 talked about the SMTP port (25)
    used for mail transfer, and they briefly mentioned Postfix and qmail, the two
    most viable mail transfer agents (MTAs) available now. There’s more behind the
    MTA: for example, if you want to run an IMAP (Internet Message Access Protocol)
    server, you probably want the Cyrus package.


    **Domain Name Service (DNS)** Setting up a client is easy, as you saw in Chapter
    5, but setting up a DNS server is trickier. The most common DNS server is BIND
    (Berkeley Internet Name Domain), but a newer DNS server named djbdns is also gaining
    popularity.'
  merge: -1
  pgno: 345
- img_proc: true
  md: 'Web servers In the Unix world, "Web server" usually means Apache, the most
    popular Web server in the world. However, many scripting languages and other tools
    have embedded Web server features that can aid debugging, status monitoring, and
    other tasks not directly related to serving Web pages to the general public.


    Virtual private networks (VPNs) A VPN allows you to connect widely dispersed machines
    in a virtual network (for instance, a single subnet). Administrators create a
    VPN in conjunction with the IPSec protocol so that they can disperse sensitive
    data (that might otherwise be behind a network firewall) through an encrypted
    network channel across a possibly secure link.


    The screen program Did you ever want to take your shell session wherever you go?
    You can do it with the screen program, a terminal multiplexer that supports multiple
    shells, disconnection, reconnection, scrollback, cut and paste, and more. This
    utility is a perennial favorite among Unix wizards. If you want some of the functionality
    with a window system, check out VNC (Virtual Network Computing).


    DB files and DBM files When using many larger servers, you will encounter binary
    DB and DBM files. These files are very small databases that store blocks of data
    keyed by small strings, usually as some kind of hash table. For whatever reason,
    there are an absurd number of different DB/DBM formats (DB, GDBM, NDBM, and SDBM,
    to name a few). Most packages use DB-style files with their own manipulation utilities
    (for example, the postfix command that comes with Postfix), but scripting languages
    such as Perl include powerful interfaces that you can use to do something beyond
    the ordinary with these database files.


    Relational databases You can run the MySQL and PostgreSQL database servers on
    Linux. There are several commercial servers as well, but this book intentionally
    avoids talk of commercial software products.


    RCS and CVS The Revision Control System (RCS) is a way to track file revisions.
    Originally meant for software development, many systems administrators use RCS
    to control important files so that they have a record of who made each change
    (and in theory, so that they can back out of harmful changes, though this rarely
    comes in practice). The Concurrent Versions System (CVS) is a network-extensible
    revision control system that can handle several versions of the same package at
    once.


    Pluggable Authentication Modules (PAM) If you don''t like the system of passwords
    in /etc/passwd, you can replace it with a PAM module that supports some other
    scheme.'
  merge: -1
  pgno: 346
- img_proc: true
  md: 'Network Information Service (NIS) NIS is a terrifying combination of RPC and
    DBM files, used by many systems to provide networked information as passwd and
    group. It is an old system that isn''t particularly robust, secure, or pleasant,
    but it is supported by most Unix platforms.


    Kerberos This is a powerful network authentication system.


    Lightweight Directory Access Protocol (LDAP) LDAP serves a bunch of data entries
    to network clients (NIS does), except where NIS allows only a single key per data
    entry, LDAP supports a hierarchy of keys for entries. LDAP is very extensible;
    OpenLDAP is a popular open source LDAP server.


    Network File System (NFS) This is the traditional method of sharing files across
    a Unix cluster. NFS is a somewhat clumsy system that is still in use because most
    Unix systems support it. Plus, alternatives as A (Andrew File System), DFS (Distributed
    File System), and 9P are too expensive, difficult to configure, and not terribly
    understood.


    Secure Sockets Layer (SSL) Many servers now offer SSL to authenticate and encrypt
    individual TCP connections with the same technology used for secure Web sessions.
    If you want to set up a server that supports SSL, be prepared to learn all about
    public keys, private keys, certificates, signing, and more.


    # 18.2 Final Thoughts


    One of the difficulties of Linux is that, like most software, certain technical
    details change all of the time because software maintainers change, they implement
    new features, and they can be just fickle. Although this book strives to cover
    topics that have some degree of stability, it is impossible to tell the story.
    The good news is that the base system really doesn''t change much. Concentrate
    on what the system components do, not the details of every strange little option.
    Remember that the online documentation is always there. In many cases, learning
    the correct terminology is more important than learning the actual details, because
    it''s the terminology that helps you in your search for the documentation.


    Linux (and Unix in general) doesn''t exist in a vacuum. There are a lot of people
    out there who can help you. A few examples are IRC channels, mailing lists, groups
    (check http://www.linux.org/groups/), and USENIX/SAGE organizations (http://www.usenix.org/).
    Unix has been around since the early days of Unix (incidentally, if you''re interested
    in the "old days," you should read A Century of Unix [Salus]).


    Keeping your system simple and clean when tracking problems. Don''t get obsessed
    with it, though — zealously removing "errant" files can be harmful.


    Finally, don''t be afraid to try new stuff!'
  merge: -1
  pgno: 347
