  md: '# # 7


    INTRODUCTION TO SHELL SCRIPTS


    If you can enter commands into the shell, you can write Bourne shell scripts.
    A script is a series of commands written in a file, and the shell reads the commands
    from the file just as it would if you typed them into a terminal.


    As any program on Unix systems, you need to set the executable bit for the script
    file, but you must also set the read bit. The easiest way to do this is as follows:


    ```

    chmod +x script

    ```


    This chmod command allows others to read and execute script. If you don''t want
    that, use the absolute mode 700 instead (and refer back to Section 1.17 for a
    refresher on permissions).


    # ## 7.1 Shell Script Basics


    All Bourne shell scripts should start with the following line, indicating that
    the /bin/sh program should execute the commands in the script file:'
  merge: -1
  pgno: 161
- img_proc: true
  md: '```

    #!/bin/sh

    ```


    Make sure that no whitespace appears at the beginning of the script file.

    You can list any commands that you want the shell to execute following the

    !/bin/sh line. Here is a very simple example:


    ```

    #!/bin/sh

    #

    # Print something, then run ls

    necho About to run the ls command.

    ls

    ```


    A character at the beginning of a line indicates that the line is a comment;

    that is, shell ignores anything on a line after a #. Use comments to

    explain parts of your scripts that are not easy to understand.

    After creating a script and setting its permissions, you can run the script

    by placing the script file in one of the directories in your command path and

    then running the script name on the command line. Alternatively, you can

    run .script if the script is located in your current working directory.


    # 7.1.1 Limitations of Shell Scripts


    The Bourne manipulates commands and files with relative ease. You

    already saw the way the shell can redirect output in Section 1.14; this is one

    of the important elements of shell script programming. However, shell

    scripts are not the be-all and end-all of Unix programming. If you''re trying

    to pick apart strings or arithmetic computations, or if you want functions

    or complex control structures, you''re better off using a scripting language

    like Perl, Python, or awk, or perhaps a compiled language like C.

    Be aware of your shell script sizes. Bourne shell scripts aren meant

    to be big (though you will undoubtedly encounter some monstrosites in

    your time).


    # 7.2 Quoting


    A literal is a string that you want the shell to leave alone and pass to the

    command line. To see where a literal is, consider how the shell

    normally extends * to all files and directories in the current directory, then

    passes all those items to the current command line. If you just want a star

    (*) to be used by a command, as you would grep or other programs that

    use regular expressions, you need special notation to pass a literal.

    The easiest way to make the shell leave a string alone is to enclose the

    entire string in single quotes. Here is an example with grep and *:


    ```

    grep ''.*t'' /etc/passwd

    ```'
  merge: -1
