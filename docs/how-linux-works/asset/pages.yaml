    # 12.5.10 Client Access Control


    By default, CUPS allows printer and administration access only to localhost. If
    you have a network of machines that you want to access your CUPS server, then
    you have to change your cupsd.conf file to reflect this.


    To get an idea of how per-client access control works, edit your cups.conf file
    and search for the line that reads location /> . It should start with a section
    that looks like this:


    ```

    <Location>

    Order Deny,Allow

    Deny From All

    Allow From 127.0.0.1

