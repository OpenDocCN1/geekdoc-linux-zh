- img_proc: true
  md: 'The Location / section defines global access-control parameters for the CUPS
    server. In the preceding example, the directives work together to give access
    to localhost (127.0.0.1) and nothing else:


    **Deny,Allow** Allows you to specify hosts and networks that are denied and allowed
    with the Deny and Allow directives. Furthermore, it also means that you can override
    Deny directives with Allow directives. This is the most useful mode in CUPS, and
    you should not change it.


    **Deny From All** Denies access to all clients by default. Again, you should not
    change this.


    **Allow From 127.0.0.1** Makes an exception to the preceding Deny From All rule,
    granting access to localhost.


    If you want to allow access for all of your printers to more clients, you can
    just add another rule directive after the Allow From 127.0.0.1 line. The following
    rule directive grants access to the subnet defined by 10.0.1.0/255.255.255:


    ```

    Allow From 10.0.1.0/255.255.255.0

    ```


    You may have as many Allow From client lines as you like, and you can specify
    the client parameter in several ways. The following five specification types are
    the most useful:


    +   - Subnet notation, as in the 10.0.1.0/255.255.255.0 example

    - IP addresses, such as 10.0.1.3

    - Fully qualified domain names, such as client.example.com

    - Domain wildcards, such as *.example.com

    - Network interfaces, such as #if(eth0)


    Remember that the Location / section is for global access, including printer job
    control and other client tasks. Administrative tasks, on the other hand, have
    their own Location section (< /admin>) that specifically excludes connections
    from all hosts except localhost. If you have already seen this section when you
    forced CUPS to digest authentication, Search for it in your cupsd.conf to verify
    that it allows administrative access to localhost, and nothing else.


    NOTE You can specify per-printer client access by adding <Location/printers/name>
    access controls, where name is the name of a printer. You''ll probably need to
    experiment for a while to get it to work perfectly.


    # 12.5.11 Auto-Discovery


    One of the most interesting CUPS features is automatic network printer discovery.
    This is called browsing. Most CUPS installations have browsing active by default,
    meaning that CUPS listens for messages from other printer servers on the network.
    The cupsd.conf parameter is Browsing:'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# Browsing On


    However, without additional help, your CUPS server will likely not make itself
    known to the other print servers on the network. To make your CUPS server broadcast
    its presence, you need a BrowseAddress broadcast address parameter in cupsd.conf.
    For example, to send notification packets to as many hosts on the network as possible
    (essentially, as many as your routers allow), use this parameter:


    ```

    BrowseAddress 255.255.255.255

    ```


    You can think of a numeric broadcast address as a sort of inverse subnet combined
    with an IP address. For example, to send packets to the subnet defined by 10.1.2.0/255.255.255.0,
    try this:


    ```

    BrowseAddress 10.1.2.255

    ```


    This said, the best choice is likely the “local” interface selection that sends
    broadcast packets out to network interfaces except PPP links:


    ```

    BrowseAddress @LOCAL

    ```


    If you have a server with several Ethernet interfaces, but do not want to broadcast
    on all of these interfaces, @IF. For example, here’s how to broadcast to eth1:


    ```

    BrowseAddress @IF(eth1)

    ```


    # 12.5.12 Running on LPD-Compatible Server


    Browsing and broadcasting goes a long way toward allowing communication between
    various CUPS servers on a network, but if you want older clients running Berkeley
    LPD printing systems to be able to print to your CUPS server, you need to configure
    your server to allow jobs from these clients.

    Do this, run a special LPD server frontend cups-lpd located in /usr/lib/cups/daemon.
    This is an inetd server (see Section 6.3), so you want a line in your /etc/inetd.conf
    (or the xinetd equivalent) cups-lpd


    ```

    printer stream tcp nowrap cups-user /usr/lib/cups/daemon/cups-lpd

    ```


    cups-user is your CUPS User from cupsd.conf. There is no built-in access control
    in cups-lpd, but like any other network service, you want to make sure that your
    firewall rules have adequate coverage; see Section 5.13. Remember that printer
    is defined in /etc/services for port 515.'
