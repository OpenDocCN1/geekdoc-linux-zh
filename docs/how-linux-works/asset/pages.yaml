  md: '4. Reset your modem (that is, clear its volatile data) and dial your ISP’s
    number by typing these two modem commands:


    ```

    atz

    atdtmnumber

    ```


    5. Your modem should connect with a CONNECT message. Wait five or ten seconds
    after you see the CONNECT message. You''re looking for “garbage” like this:


    ```

    ~ý#A!{}!{}! },},%& }

    ```


    If you get this junk immediately after you see the CONNECT message, you''ve got
    a PPP connection, and, furthermore, you probably need to use the PAP or CHAP authentication
    system when dialing up. Make a note of this and skip to the last step.


    6. If you get something like Username: type in your username (and password, if
    necessary). After logging in, keep going (you might need to type ppp or something
    similar) until you get the “garbage” mentioned in the previous step. In this case,
    you probably do not to use PAP or CHAP.


    7. Exit minicom by pressing CONTROL-A, then x. If minicom hangs when you''re trying
    to exit, you can wait a little to see if it times out, or you can be impatient,
    open another window, and use kill -KILL on the minicom process.


    When interacting with the modem and remote server, take careful notes of all the
    settings you used, what you had to type, and the responses you got back. You''ll
    need this information to write a chat script.


    # 5.8.2 Starting pppd with Options Files


    Now that you know how to log to your ISP’s server manually, you can create a configuration
    file containing the same connection settings used with minicom -s. This allows
    you to make ppp dial the telephone number automatically.


    Pick a name for the ISP and create an options file called /etc/ppp/peers/name,
    with the following lines:


    ```

    ttyS1 11520 crtscts

    connect /usr/sbin/chat -v -f /etc/ppp/chat-name''

    noauth

    defaultroute

    mru 1500

    ```'
