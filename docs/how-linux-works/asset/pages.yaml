    avoid getting really obsessed with performance. If you''re trying to swap 3 percent
    memory out of somesomething and you''re not working on a huge computation, you''re
    probably wasting your time.


    # 4.1 Running Commands as the Superuser


    Before you start any commands, you should learn more about how to run commands
    as the superuser. You probably already know that you can run the command and enter
    the root password to start a root shell. This practice works, but it has these
    disadvantages:


    +   - You have no record of system-altering commands.

    - You have no record of the users performed system-altering commands.


    Essential System Files, Servers, and Utilities 83'
  merge: -1
  pgno: 101
- img_proc: true
  md: '+   - You don''t have access to your normal familiar shell environment.

    - You have to type the root password.


    Most larger workstation installations employ a package named sudo to allow administrators
    to run commands as root when they are logged in as themselves. For example, if
    you want to use vipw to edit the /etc/passwd file, you could do like this:


    ```

    sudo vipw

    ```


    When you run this command, sudo logs this action with the syslog service under
    the local2 facility, so that you have a record of what you did.


    Of course, the system doesn''t let any user run commands as the superuser; you
    must configure the privileged users in /etc/sudoers file. It turns out, sudo has
    a great options (that you''ll probably never use), and the side effect of this
    is that the /etc/sudoers file has a somewhat complicated syntax. Here is an example
    file that gives user1 and user2 the power to run any as root without having to
    enter a password:


    ```

    User_Alias ALL = user1,user2


    ADMINS ALL = NOPASSWD: ALL

    ```


    ```

    root ALL=(ALL) ALL

    ```


    The first line defines an ADMIN user alias with the two users, and the second
    line grants the privileges. The ALL = NOPASSWD: ALL part means the users in the
    ADMIN alias can use sudo to execute commands as root. The second ALL means "any
    command." The first ALL means "any host" (if you have more than one machine, you
    can set different kinds of access for each machine or for groups of machines,
    but this book will not explain that feature).


    The root ALL=(ALL) ALL simply means that the superuser may also use sudo to run
    any command on any host. The extra (ALL) means that superuser may also run commands
    as any other user. You can extend this privilege to the ADMINS by changing the
    /etc/sudoers line shown earlier to this:


    ```

    ADMINS ALL = (ALL) NOPASSWD: ALL

    ```


    The visudo command to edit /etc/sudoers. This command checks for file syntax errors
    after you save the file.


    That''s all you need to know about sudo for now. If you need its more advanced
    features, consult the sudoers(5) and sudo(8) manual pages.'
