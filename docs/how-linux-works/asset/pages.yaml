- img_proc: true
  md: 'To remove a single module, use the -r option:


    ```

    modprobe -r module

    ```


    As mentioned earlier, you can find module dependencies in /lib/modules/version/modules.dep.
    Dependencies don''t arrive on your system by magic; you must build an explicit
    list (the kernel install process usually does this for you). You need to create
    module dependencies by hand for all installed kernel versions after installing
    a module that doesn''t come with the kernel. You can do this by running this command:


    ```

    depmod -a

    ```


    However, this doesn''t always work, because depmod may try to read the symbol
    function memory address locations in the currently running kernel. It won''t work
    if you''re trying to build dependencies for kernels other than the one you''re
    running. To zero in on a particular kernel version, find a System.map file that
    corresponds to that, and then run this command:


    ```

    depmod -F System.map version

    ```


    As mentioned earlier, you do not need to run depmod under normal circumstances,
    because modules_install runs it for you.


    > If you find the module that corresponds to a particular feature, go to the kernel
    configuration menu and press ? to get the help screen. This usually displays the
    module name.


    # 10.8.1 Kernel Module Loader


    It''s inconvenient to load a module when you need to use a particular feature
    or driver. For example, if you compiled a certain filesystem as a module, it would
    be too much to run a modprobe before a mount command that referenced the filesystem...


    The Linux kernel provides an automatic module loader that can load most modules
    without additional modprobe or insmod commands. To use the loader, enable the
    Kernel loader option in the kernel configuration. A kernel with the module loader
    runs modprobe to load modules it wants.


    There are limits to what the module loader can do without additional configuration.
    In general, it can load most modules that do not involve specific devices. For
    example, the module loader can load IP tables modules, and it can load filesystem
    modules as long as you specify the filesystem type with a mount.


    The module loader cannot guess your hardware. For instance, the module loader
    will not try to figure out what kind of Ethernet is in your system. Therefore,
    you need to provide extra hints with the modprobe.conf.'
