  md: '# 17.1.2 Memory


    The third guideline from the beginning of this chapter (“you often get what you
    pay for”) is most important when buying memory. Name-brand memory is only marginally
    more expensive than generic labels, and it can save you many heads. A Linux machine
    exhibits odd behavior if it has bad memory. If a program seems to crash often,
    look for these symptoms:


    +   * The crash happens in the same place every time.

    * Rebooting makes the problem go away.

    * The operating system appears unaffected, and other programs run fine.

    * It happens during frequent disk access.


    You should consider buying ECC (error-correcting code) memory. It is a little
    less expensive than standard memory, and not all motherboards support it (read
    your motherboard manual carefully), but ECC memory ensures that you never have
    a memory problem.

    nA Linux system automatically uses extra memory for disk cache, and this can substantially
    improve performance for applications that use large files (or several small files).
    However, for many users, there is a point where memory adds little or no benefit
    because the system has cached nearly everything. You can briefly check the state
    of a system’s memory utilization with the free command; the information in /proc/meminfo
    has a little more detail.


    # 17.1.3 Hard Disk


    The old “IDE versus SCSI” question was one of the bigger debates surrounding hard
    disk disks. However, if you want to build a desktop computer, the debate means
    little, because you will likely choose an ATA (IDE) disk out of cost concerns.
    In the old days, power users used ATA disks to be performance disks, and there
    wasn’t a large disparity in price when compared against SCSI disks. Improvements
    in CPU speeds, caching, memory cost, the interface, and hard disk manufacturing
    techniques have made ATA tolerable well for a desktop system with a single disk
    — even Apple switched its desktop disks to the ATA type.


    A disk has two primary specification numbers: average access time (measured in
    milliseconds, or RPM) and rotation speed (measured in rotations per minute). In
    general, a faster (lower) access time is the more important consideration for
    Unix, because the system spends a lot of time looking at a bunch of small files.
    If you are a software developer, this is particularly important because compilers
    and scripting languages use many file accesses on a single invocation. On the
    other hand, if you have big files (movies, music, whatever), a higher rotational
    speed gets this stuff off the hard disk faster.'
  merge: -1
  pgno: 334
- img_proc: true
  md: 'There usually isn''t a trade-off between rotational speed and access time because
    they are linked. More RPMs mean that the disk head takes less time to pass over
    the proper place on the disk platter for the next, hence a lower average access
    time.


    Higher performance, however, comes at a price above and beyond the sticker price.
    The fastest-spinning disks are usually noisy and generate more heat. I''ll spare
    you “hard disks I have hated in the past” stories, but if you want a quiet disk,
    look for one with a fluid bearing system (sometimes FDB). These drives use liquid
    instead of ball bearings for their platters, and they are a big improvement for
    your ears.


    Any ATA disk drivers are fast, and they support special features with the hdparm
    command. If you run into compatibility issues, they will likely be between your
    motherboard and the disk (in particular, some other motherboards do not support
    disks larger than 32GB; look for jumpers on the disk to “clip” the disk, limiting
    it to a lower capacity).


    If you put two disks in the same system, put them on different interfaces (your
    motherboard should have primary and secondary interfaces), which should improve
    concurrent access slightly. If you purchase an add-in ATA interface card, you
    may need extra drivers. When considering one of these cases, look for drivers
    in the ATA support menu described in Section 10.4.1.


    # 17.1.4 Network Cards and Infrastructure


    The Linux kernel supports most wired Ethernet devices (also known as NICs, or
    network interface cards), but you should check any card against the compatibility
    list in a current Linux kernel. Don''t believe a manufacturer''s claim of compatibility
    in this case — the manufacturer may require you to install a kernel driver before
    the device works. Keep in mind that the kernel drivers that come from vendors
    often don''t work.


    Most cable and DSL adapters require an Ethernet card. You should be able to use
    any supported Ethernet card regardless of the protocol that you use, provided
    that Linux supports the protocol. You may need to use a protocol like PPPoE for
    your provider (see Section 5.9).


    Current networks of 100Base-T (100 megabits per second, or about 12 megabytes
    per second) are adequate for most purposes. They are also very expensive. To attach
    several machines to a home network, you need a hub or switch (it is possible to
    connect two machines directly with an Ethernet crossover cable, but this isn''t
    really worth the trouble).


    The most significant differences between using a hub and a low-end switch is that
    a switch can send and receive signals at the same time and therefore have a potential
    of faster throughput and lower latency. However, unless you have a habit of sending
    large files around your network simultaneously, you won''t notice much of a performance
    difference between the two. On the other hand, the difference in price between
    hubs and switches'
  merge: -1
