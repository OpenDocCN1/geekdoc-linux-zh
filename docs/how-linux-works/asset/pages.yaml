    +   - **f** Tells make to read from *file* instead of Makefile or make


    # Standard Macros and Variables


    make has many special macros and variables. It''s difficult to tell the difference
    between a macro and a variable, so this book uses the term *macro* to mean something
    that usually doesn''t change after make building targets.


    As you earlier, you can set macros at the start of your Makefile. The following
    list includes the most common macros:


    +   **CFLAGS** C compiler options. When creating object code from a .c file, make
    passes this as an argument to the compiler.


    +   **LDFLAGSS** Like CFLAGS, but for the linker when creating an executable from
    object code.


    +   **LDIBS** If you use LDFLAGS but do not want to combine the library name options
    with the search path, but the library name options on this file.


    +   **CC** The C compiler. The default is cc.


    +   **CPPFLAGS** C preprocessor options. When make runs the C preprocessor in
    some way, this passes this macro''s expansion as an argument.


    +   **CXFLAGS** GNU make uses this for C++ compiler flags. Like C++ source code
    extensions (and nearly everything associated with C++), this isn''t standard and
    probably won''t work with other make variants unless you define your rule.


    A *variable* changes as you build targets. Because you don''t set every by hand,
    the following list includes the


    +   **$** When inside a rule, this expands to the current target.


    +   **$*** Expands to the *basename* of the current target. For example, if you''re
    building *blah.o*, this expands to blah.


    The most comprehensive list of the make variables on Linux is the info page.


    > Keep in mind that GNU has many extensions, built-in rules, and features that
    other variants do not have. This is fine as long as you''re running Linux, but
    if you step off onto a Sun or BSD machine and expect the same stuff to work, you
    might be for a surprise.'
