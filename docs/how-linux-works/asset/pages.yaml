  md: '# More No-Nonsense Books from NO STARCH PRESS


    ![](img/53fc0939e3ef3d3d769817a756ee3cbb_370_0.png)


    # THE LINUX COOKBOOK, 2ND ED


    Tips and Techniques for Everyday Use


    by MICHAEL STUTZ


    The Linux Cookbook is your guide to getting the most out of Linux. Organized by
    general task (such as working with text, managing files, and manipulating graphics),
    each section contains series of step-by-step recipes that help you get your work
    done quickly and efficiently, most often from the command line. Perfect as an
    introduction to Linux and the command line, or as a deskop reference for the seasoned
    user. Covers the major Linux distributions.


    APRIL 2004, 576 pp., $39.95 ($57.95 CAN)

    ISBN 1-59327-031-3


    ![](img/53fc0939e3ef3d3d769817a756ee3cbb_370_1.png)


    # WICKED COOL SHELL SCRIPTS


    101 Scripts for Linux, Mac OS X, and UNIX shells


    by DAVE TAYLOR


    This book of useful, customizable, and fun scripts gives you the tools to solve
    common Linux, Mac OS X and UNIX problems and personalize your computing environment.
    Among the more than 100 scripts included are an interactive calculator, a shell
    checker, a backup utility, a weather tracker, and a web log analysis tool. The
    book also teaches how to write your own sophisticated shell scripts by explaining
    the syntax and techniques used to build each example script. Examples are written
    in Bourne Shell (sh) syntax.


    JANUARY 2004, 368 pp., $29.95 ($43.95 CAN)

    ISBN 1-59327-012-7


    ![](img/53fc0939e3ef3d3d769817a756ee3cbb_370_2.png)


    # HACKING


    The Art of Exploitation


    by J ERICKSON


    A comprehensive introduction to exploitation techniques and creative problem-solving
    methods known as "hacking." Explains technical aspects of hacking such as stack
    based overflows, heap overflows, shell exploits, return-to-libc, shellcode, and
    cryptographic attacks on 802.11b.


    > “the hackers handbook” – Security Forums.com


    NOVEMBER 2003, 264 pp., $39.95 ($59.95 CAN)

    ISBN 1-59327-007-0'
  merge: -1
