    # 1.16 Processes


    A process is a running program. Each process on the system has a numeric process
    ID (PID). For a quick listing of the processes that you''re running, run the ps
    command on the command line. You should get a list like this:


    ```

    PID TTY STAT TIME COMMAND

    s520 p S 0:00 -bash

    s545 ? S 3:59 /usr/X11R/bin/ctwm -W

    s548 ? S 0:10 xclock -geometry -0-0

    2159 pd W 0:00 /usr/bin/vi lib/addresses

    31956 p R 0:00

    ```


    This is an abridged listing; yours will be much longer if you''re running a windowing
    system. The fields are as follows:


    +   * PID The process ID.

    * TTY The terminal device where the process is running (don''t worry about this
    now).

    * STAT The process status; is what the process is doing at the given time and
    where its memory resides. For example, S means sleeping and R means running. Check
    the ps(1) manual for all the symbols.

    * TIME The amount of CPU time (in minutes and seconds) that the process has used
    so far. In other words, this is the total amount of time that the process has
    spent running instructions on the processor.

    * COMMAND This might seem obvious, but be aware that a process can change this
    field from its original value.


    If you''re interested in all processes on the system (not just the ones you''re
    running), and if you''d like a more detailed report on process characteristics,
    use ps u. As with other programs, you can combine options, as in ps ax. Another
    important option that works in conjunction with a is w, which tells ps to print
    the full command name if it''s too long to fit on one line.


    To check on a specific process, add its PID to the argument list of the ps command.
    For example, one way to inspect the current shell process is with ps u $$ ($ is
    a shell variable that evaluates to the current shell PID).


    You''ll find information on two handy administration commands called top and lsof
    in Section 4.8. These can be useful when locating processes, even when doing something
    other system maintenance.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# ### 1.16.1 Killing Processes


    To terminate a process, send it a signal with the kill command. In most cases,
    all you need to do is this:


    ```

    kill pid

    ```


    There are many types of signals. The default signal is TERM, or terminate. You
    can send different signals by adding an extra option to kill. Let''s say that
    you don''t want to terminate the process, but rather, freeze it with the STOP
    signal.


    ```

    kill -STOP pid

    ```


    A process stopped in this manner is still in memory, ready to pick up where you
    left off. Use the CONT signal to set the process on its way again:


    ```

    kill -CONT pid

    ```


    As you may recall from Section 1.2, CONTROL-C terminates a process running in
    the current terminal. This is the same as using kill to end the process with the
    INT (interrupt) signal.


    The most brutal to terminate a process is with the KILL signal. Other signals
    give the process a chance to clean up after itself, but KILL does not — the operating
    system terminates the process and forcibly removes it from memory. Use this as
    a last resort.


    > > WARNING Don''t kill processes indiscriminately, especially if you don''t know
    what they''re doing. This can be akin to shooting yourself in the foot.


    # ### 1.16.2 Job Control


    Shells also support job control, a way to send STOP and CONT signals to programs
    by funny keystrokes and commands. For example, you can send a signal with CONTROL-Z
    and start the process again by typing fg or bg.


    Despite the habits of many experienced users, job control is not necessary and
    can be confusing to beginners — it is uncommon for the user to press CONTROL-Z
    instead of CONTROL-C and have many suspended processes sitting about.


    If you want to run multiple shell programs, you can run each program in a separate
    terminal window, but non-interactive processes in the background (explained in
    the next section), or learn to use the screen program.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# 1.16.3 Background Processes


    Normally, when you run a Unix command from the shell, you do not get the shell
    prompt until the program has finished executing. However, you can detach from
    the shell and put it in the "background" with the ampersand (&); this gives you
    the prompt back. For example, if you have a large file that you need to decompress
    with gzip (you''ll see this in Section 1.18), and you want to do some other stuff
    while it''s running, run the command as in this gzip example:


    ```

    gzip file.gz &

    ```


    The shell responds by printing the PID of the new background process, and the
    prompt returns immediately so that you can continue working. The process also
    continues to run after you log out, which comes in particularly handy if you have
    a program that has a lot of number crunching that you need to run for a while.
    Depending on your setup, the shell may notify you when the process completes.


    The dark side to background processes is that they may expect to work with the
    standard output (or worse). If the program wants to read something from the standard
    input when it is in the background, it can freeze (try fg to bring it back), or
    it may terminate. If the program writes to the standard output or standard error,
    the output can appear in the terminal window with no regard to anything else running.


    The best way to make sure that a background process doesn''t bother you is to
    redirect its output (and possibly in)put as described in Section 1.14.


    If spurious output from background processes gets in your way, you should know
    how to redraw the content of your terminal. bash and most full-screen interactive
    programs support CONTROL-L to redraw the screen. If a program is reading from
    the standard input, CONTROL-R usually redraws the current line. Unfortunately,
    pressing the wrong sequence in the wrong situation can leave you in an even worse
    situation than before. For example, CONTROL-R at the bash prompt puts you in an
    annoying mode called reverse erase.


    # 1.17 File Modes and Permissions


    Every Unix file has a set of permissions that determine whether you can read,
    write, or run the file. Running ls -1 displays the permissions. Here''s an example
    of such a display:


    ```

    -rw-r--r-- 1 juser 7041 Mar 26 19:34 endnotes.html

    ```


    The first column represents the *mode* of the file, and it is shown in bold. The
    mode represents the file''s permissions and some extra information. There are
    four parts to the mode; Figure 1-1 on the next page illustrates the pieces.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '![](img/53fc0939e3ef3d3d769817a756ee3cbb_40_0.png)


    Figure 1-1:1 *The pieces of a file mode*


    The first character of the mode is the *file type*. A dash (-) in this position,
    as in the example, denotes a *regular* file, meaning that there is nothing special
    about it. This is by far the most common kind of file. Directories are also common,
    carrying d in the file slot. The rest of the file types are listed in Section
    2.3, but you don''t need to know about them just yet.


    The rest of a file''s mode contains the permissions, which break down into three
    sets: the *user*, *group*, and *other* permissions, in that order. For example,
    the *w-* characters in the example are the user permissions, *r-* are the group
    permissions, and *r-- are the other permissions.


    Four basic things can appear in each permission set:


    +   * r Means that the file is readable

    * w Means that the file is writable

    * x Means that the file is executable (that is, you can run it as a program)

    * - Means nothing


    The user permissions (the first set) pertain to the user who owns the file. In
    the preceding example, that *user''s*.


    The second set, group permissions, are for the file''s group (*somegroup* in the
    example). Any user in that group can take advantage of these permissions. (Use
    the commands to see what group you''re in, and see Section 4.3.2 for more information.)


    Everyone on the system has access according to the *other* permissions. These
    are sometimes called *world permissions*.


    NOTE *Each read, write, and execute permission slot is sometimes called a permission
    bit. Therefore, you may hear people refer to parts of the permissions as "the
    read bits.\*


    Some executable files have an *s* in the user permissions listing instead of *x*.
    This indicates the executable is *setuid*, meaning that when you execute the program,
    it runs as the file owner instead of you. Many programs use this *setuid* to run
    as root to get the special privileges they need to change system files. One example
    is the *passwd* program, which needs to change /etc/passwd file.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# 1.17.1 Modifying Permissions


    To change permissions, use the chmod command. First, pick the set of permissions
    that you want to change, and then pick the bit to change. For example, say that
    you want add group (g) and world (o, for “other") read (r) permissions to file.
    You can do it with two commands:


    ```

    chmod g+r file

    chmod o+r file

    ```


    Or you can do it all in one shot like this:


    ```

    chmod go+r file

    ```


    To remove permissions, use go-r instead of go+r.


    NOTE Obviously, you shouldn''t make your files writable because it gives anyone
    on your system connected to the Internet a chance to change them. But this would
    give anyone connected to the Internet a chance to change your files? Probably
    not, unless your system has a network security hole. In that case, file permissions
    aren''t going to help you.


    You may sometimes see people changing permissions with numbers, for example:


    ```

    chmod 644 file

    ```


    This is called an absolute change, because it sets all the permission bits at
    once. To understand how this works, you need to know how to represent the permission
    bits in octal form (each numerical represents an octal number and corresponds
    to a permission set). If you''re curious about this, look at the chmod(1) manual
    page or the info page.


    It is actually not that important to know how to construct absolute modes; it
    is easier to just memorize the modes that you use. Table 1-4 lists the most common
    absolute modes.


    Table 1-4: Absolute Permission Modes


    | Mode | Meaning | Used For |

    | --- | --- | --- |

    | 644 | user: read/write; group, other: read | files |

    | 600 | user: read/write; group, other: none | files |

    | 755 | user: read/write/execute; group, other: execute | directories, programs
    |

    | 700 | user: read/write/execute; group, other: none | directories, programs |

    | 711 | user: read/write/execute; group, other: execute | directories |'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'Directories also have permissions, as you can see from the preceding list.
    You can list the contents of a directory if the directory is readable, but you
    can only access a file inside if the directory is executable. One mistake people
    make when setting the permissions of directories is to accidentally remove the
    execute bit when using absolute modes.


    Finally, you can specify a set of default permissions with the umask command that
    are applied to any new file you create. Without going into much detail, use umask
    022 if you want everyone to see all of the files and directories that you make,
    and umask 077 if you don''t. You need to put the umask command with the desired
    mode in one of your startup files to make your new default permissions apply to
    later sessions (Chapter 16).


    # 1.17.2 Symbolic Links


    A symbolic link is a file that points to another file or directory, creating an
    alias. It is similar to a shortcut in Windows. Symbolic links offer a quick way
    to access to an obscure directory path.


    In a long directory, these links look like this (the l as file type in the file
    mode):


    ```

    lwxtwxxtwx 1 ruser users 11 Feb 27 13:52 funk -> /home/skunk

    ```


    If you try to access function in this directory, the system gives you /home/skunk
    instead. Symbolic links are nothing more than names that point to other names.


    The names of the symbolic links and the paths to which they point don''t actually
    need to exist. If /home/skunk does not in fact exist, /home/skunk doesn''t need
    to exist. Any program that accesses funk just reports that funk doesn''t exist
    (except for ls, a command that stupidly informs you that funk is missing). This
    can be baffling, because you can see something right in front of you.


    This is not the only way symbolic links can be confusing. Another problem is that
    you cannot identify the characteristics of a link target by looking at the name
    of the link. You must follow the link to find out it goes to a file or directory.
    Your system may also have links that point to other links, which are called chained
    symbolic links.


    To create a symbolic link from target to linkname, use this command:


    ```

    ln -s target linkname

    ```


    The linkname argument is the name of the symbolic link, the target is the path
    of the file or directory that the link points to, and the -s flag specifies a
    symbolic link (see the warning on the next page).'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'When making a symbolic link, check the command before you run it, because there
    are a number of things that can go wrong. For example, if you reverse the order
    of the arguments (ln -s linkname target) you''re in some fun when linkname is
    a directory that already exists. In this case, ln creates a link inside linkname
    (the link points to itself unless linkname is a full path). Therefore, if something
    goes wrong when you create a symbolic link to a directory, check that directory
    for erratic links and remove them.


    Symbolic links can also cause headaches when you''re not aware of their presence.
    For example, you can easily edit what you think is a copy of a file but is actually
    a symbolic link to the original.


    WARNING Don''t forget the -s option when creating a symbolic link. Without it,
    ln creates a hard link, giving an additional real filename to a single file. The
    new filename has all of the status of the old one; it points (links) directly
    to the file data instead of another filename, as a symbolic link does. Hard links
    can be even more confusing than symbolic links. Avoid them.


    With all these warnings regarding symbolic links, you might wonder why everyone
    bothers with them. The simple reason is that they offer a convenient way to share
    files and patch up small problems.


    # 1.18 Archiving and Compressing Files


    Now that you know all files, permissions, and the errors that you get, you need
    to master tar and gzip.


    Start with gzip (Gnu Zip), the current standard Unix compression program. A file
    that ends with .gz is a GNU Zip archive. Use gzip file.gz to uncompress file.gz
    and remove the suffix; to compress again, use gzip file.


    gzip does not perform the additional function of archiving, like the ZIP programs
    for other operating systems— that is, it does not pack multiple files and directories
