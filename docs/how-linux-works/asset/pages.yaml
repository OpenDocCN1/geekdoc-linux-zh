    # 8.4.1 Perl


    The most important third-party Unix scripting language today is Perl — Larry Wall''s
    Practical Extraction and Report Language. This tool has been called the "Swiss
    Army Chainsaw" of programming tools, and is capable of an incredible variety of
    tasks, from networking to database access. It excels at text processing, conversion,
    and file manipulation.


    It''s hard to describe Perl code looks; it''s like kind of an imperative-style
    mix of C, Bourne shell, awk, LISP, and others. It can be a little hairy (using
    every single character on your keyboard), but it is fast and powerful as it is
    ugly. If you want to be on top of your system, you need to know a little bit of
    this language. Have a look at Learning Perl [Schwarz] for a tutorial-style introduction;
    the larger reference is Programming Perl [Wall]. Getting a grasp of Perl is well
    it, not just because you will be able to do remarkable things with text files,
    but also many of the contents (such as associative arrays) carry over to other
    scripting languages.


    Nearly all Unix and Linux systems in the world have Perl installed somewhere.
    Most administrators maintain it as /usr/bin/perl, even if they insist on keeping
    all other third-party software away from //. There is extensive online documentation
    in the manual pages; the perl (1) has an index of the other pages.


    If you''re having trouble with a Perl script, here are some suggestions:


    +   - Look to see if you can tell the script was written. It might require a newer
    version of Perl than you have.

    - If it''s an old script, you may have to put backslashes in front of the @ characters
    in strings and comments.

    - It might require a module that you do not have (in particular, a database module).


    When all else fails, run perl -w script to turn on warning.


    # 8.4.2 Python


    Python is a newer scripting language with a strong following, enough to make it
    the implementation language for packages such as GNU Mailman. It offers many of
    the same system features as Perl, but it has a powerful interactive mode and a
    somewhat more organized model.


    Python''s executable is python, but there''s no telling where it is on your system.
    Therefore, when you get a Python program, you may have to modify the first line
    in the script to match your Python installation.'
