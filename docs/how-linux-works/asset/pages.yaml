- img_proc: true
  md: 'As you can see, the dd format is different than the option formats of most
    other Unix commands; rather than use the - character to signal an option, you
    name an option and set its value to something with the sign=. The preceding example
    copies a single 1024-byte block from /dev/zero (a continuous stream of zero bytes)
    to the file new_file. These are the important dd options:


    +   - if=file The input file. The default is the standard input.

    - of=file The output file. The default is the standard output.

    - bs=size The block size; dd reads and writes many bytes of data at a time. To
    improve large chunks of data, you may use b and k to signify 512 and 1024 bytes.
    Therefore, the example above could read bs=1k instead of bs=1024.

    - ibs=size, obs=size The input and output block sizes. If you use the same block
    size for both input and output, use the obs but, if this is impossible, then use
    ibs and obs for input and output, respectively.

    - count=num The total number of blocks to copy. When working with a huge file,
    or with a device that supplies an endless stream of data (like /dev/zero), you
    want dd to stop at a fixed point. Otherwise you would waste a lot of disk space,
    CPU time, or both count can be used in conjunction with the skip parameter to
    copy a small piece out of a large file or device.

    - skip=num Skip the first num blocks in the input file or stream; do not copy
    them to the output.


    # 2.3.2 Device Name Summary


    Sometimes it is difficult to find the name of a device (for example, when partitioning
    a disk). Here are two tactics for finding out:


    +   - Guess the name from the output of the dmesg command (which prints the last
    few kernel messages) or the kernel log file; this output might contain a description
    of the devices on your system.

    - Run /proc/devices to see the block and character devices for which your system
    currently has drivers. Each line consists of a number and name. The number is
    the major number of the device described in Section 2.3. If you can guess the
    device from the name, look in /dev for the character or block devices with the
    corresponding major number, and you''ve found the device files.


    Neither method is terribly unreliable, especially because the kernel does not
    load certain device drivers until you try to use them. (Section 10.8 has information
    on the driver-loading mechanism.)


    The following sections list the most common Linux devices and their naming conventions.'
