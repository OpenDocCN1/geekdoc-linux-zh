    - A case to hold the components. The case usually includes a power supply.


    # 17.1.1 Processor and Motherboard


    Virtually all IA32-like (x86 PC) central processing unit (CPU) models work with
    Linux. The kernel and gcc compiler support many vendor-specific CPU optimizations,
    and features such as multiprocessing work well with Linux.


    Two important considerations when choosing a processor should be power consumption
    and heat. CPUs that consume more power also generate a substantial amount of heat.
    To handle the heat, you need a lot of fans. Never overclock a processor running
    Linux, unless you like to see your computer crash.


    If you are interested in taming the usual noise of a computer, a great place to
    start is the power supply. Most power supply units included with PC cases are
    of very cheapest sort, with loud, unreliable cooling fans. You can easily replace
    the power supply with a low-noise premium model from a third party. It will not
    cheap, if noise irritates you, it is worth every penny.


    Although not all CPU models will work with Linux, some care must be taken when
    choosing the CPU''s home — the motherboard. You should consider your motherboard,
    processor, and memory as a single unit, and you may even want to choose your motherboard
    first and find a CPU to fit. After all, it is possible that your motherboard will
    cost more than the CPU!


    Pick a motherboard that has been available for a reasonable amount of time. Three
    or four months should be sufficient. Often, initial releases of motherboards have
    bugs that cause mysterious failures. Avoid fancy (tested) new features. Linux
    doesn''t immediately support each new bell and whistle off the assembly line,
    and these unusual features may interfere with normal system operation. Watch out
    for brand-new processor models that require you to purchase a new motherboard
    chipset, as these can be expensive nightmares.


    Modern motherboards come with a number of integrated peripherals. They normally
    include two ATA disk interfaces, full-parallel, serial, and USB ports. Some motherboards
    come with additional hardware, such as integrated SCSI controllers, video chips,
    and sound. These integrated features can save you space on the motherboard and
    the hassle of installing your own components, but if you separate plug-in components,
    you perhaps save a little money and a compatibility headache. The advantages of
    integrated motherboard components are somewhat dubious in the case of most components
    except SCSI controllers. If, like many people, choose a motherboard with integrated
    video, find out what chip it uses and make certain that the XFree86 server has
    support for it (see http:// www.xfree86.org/ and http://www.xouvert.org/).'
