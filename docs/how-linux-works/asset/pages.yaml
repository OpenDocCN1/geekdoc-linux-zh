  md: '# 4.8.1 Finding Open Files with issof


    The issof command lists open files and the processes that are using open files.
    Unix places such a great emphasis on files, issof is among the most useful tools
    for finding trouble spots. issof does not stop at regular files — can list network
    sockets, dynamic libraries, pipes, and more.


    Running issof on the command line usually produces a tremendous amount of output.
    Here is a fragment of what you might see:


    | COMMAND | PID | USER | FD | TYPE | DEVICE | SIZE | NODE NAME |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | init | | root | cwd | DIR | 3,1 | 4096 | 2 / |

    | init | | root | rtd | DIR | 3,1 | 4096 | 2 / |

    | init | | root | txt | REG | 3,1 | 24480 | 16212 /sbin/init |

    | init | | root | mem | REG | 3,1 | 999542 | 32329 /lib/libd-2.3.2.50 |

    | init | | root | mem | REG | 3,1 | 1251776 | 32329 /lib/libc-2.3.2.50 |

    | init | | root | txt | 10u | FIFO | 3,1 | 97634 | /dev/initcl |

    | ... | | | | | | | |

    | ... | | | | | | | |

    | vi | | 3511 | juser | cwd | DIR | 3,4 | 4096 | 163866 /home/user/w |

    | vi | | 3511 | juser | rtd | DIR | 3,1 | 4096 | 2 / |

    | vi | | 3511 | juser | txt | REG | 3,3 | 327048 | 561520 /usr/bin/vi |

    | vi | | 3511 | juser | 3iwn | REG | 3,4 | 18993 | 163867 /home/user/c |


    The fields in this command are as follows:


    +   **COMMAND** The command name for the process that holds the file descriptor.

    **PID** The process ID.

    **USER** The user running the process.

    **FD** The file descriptor or the purpose of the open file. A file descriptor
    is a number that a process uses in conjunction with the system libraries to identify
    and manipulate a file.

    **TYPE** The file type (regular file, directory, socket, etc.).

    **DEVICE** The major and minor number of the device that the file resides on.


    The issof(1) manual page contains a list of what you might see for each field,
    but you should be able to guess just by looking at the output. For example, look
    at the entries with cwd in the FD field. These lines indicate current working
    directories of the processes. Another example is the very last line, showing a
    file that the user is currently editing with vi.


    There are two basic approaches to running issof:'
