    to tweak anything yet; for now, just make sure that your pppd start properly.


    Now make a chat file named /etc/ppp/call-name. This chat determines the connection
    commands sent through the serial line and the responses you expect from your ISP.
    For now, just fill it with the following lines where number is your ISP''s telephone
    number:


    ```

    ABORT "NO CARRIER"

    ABORT BUSY

    "" ATZ OK

    TDTnumber CONNECT

    ```


    Try to establish a connection by starting pppd with this command:


    ```

    pppd call name

    ```


    Monitor the progress by looking at your system log. The pppd syslog facility is
    daemon, so the log information is probably in /var/log/daemon.log or something
    similar. However, the chat program used for initializing the modem may use a different
    facility, such as local2. You should get messages like this in your log file:


    ```

    Jul 29 18:40:46 mikado pppd[634]: pppd 2.4.1 started by root, uid 0

    Jul 29 18:40:47 mikado chat[65]: [chat messages]

    Jul 29 18:40:47 mikado pppd[634]: Connect script failed

    Jul 29 18:40:48 mikado pppd[634]: Exit.

    ```


    Take a careful look at the chat messages. They should tell you if the modem is
    dialing up, and if it gets an answer and connection from the remote server.


    Even if the preceding connection settings work so far, the configuration to fail
    because you haven''t supplied a username and password. Watch in the log carefully,
    because it tells you how to proceed. For example, if the log file says Connect
    script failed as in the preceding, then you have a problem with the dial-up portion
    (in addition to not supplying a username and password).


    In particular, look out for these types of failures:


    +   I/O errors happen when your serial port and modem are not set up correctly.
    Double-check the first line of the options file to make sure it matches the settings
