- img_proc: true
  md: 'You can change the log level with the logLevel parameter in cupsd.conf file.
    The default level is info in most installations. If you want the debugging messages,
    you must use debug. If you change the logLevel parameter, remember to reload your
    configuration file after making any changes by sending a HUP signal to cupsd.


    # Filter Problems


    The first thing you should do after running into trouble in the print filter stage
    is to make sure that the CUPS filters in /etc/cups/mime.convs function properly.


    To do this, first disable any filters that you have in your printer''s PPD file
    so that you can eliminate the backend filter from the list of things that can
    go wrong. You will probably have such filters if you are using a non-PostScript
    printer. If that case, edit your printer''s PPD file the one in /etc/cups/ppd),
    looking for a cupsFilter parameter (see Section 12.5.7). Comment out the parameter
    by adding a % just after the *; for example:


    ```

    *cupsFilter: "application/vmd.cups-postscript fomatic-rip"

    ```


    After making this change (and making cupsd re-read its configuration with a HUP
    signal), submit a test job to see if data can make the mime.convs filter stage
    to the printer device. Although you are not likely to run into any trouble with
    the CUPS-supplied filter programs in mime.convs, this process may help you uncover
    spool directory permissions (discussed in the next section) because these sorts
    of problems usually show up in the initial print filter stages.


    Having worked out any kinks not involving thefilter filter, re-enable this parameter
    and look for more trouble:


    +   - Verify that the cupsFilter is in the lib/cups/filter directory.

    - For the Foromatic filter, use fomatic-rip - manually from the command line to
    check for valid output (see Section 12.5.8).

    - Check that the filter has the correct path for any necessary program.

    - If your filter relies on Ghostscript, ensure that you have the required driver
    by running gs -help.


    # Spool Directory Permission Errors


    Look for this message in your error log:


    > E [timestamp] [Job n] unable to open print file - : Permission denied


    CUPS normally runs its filters as the pseudo-user lp and the group sys, so this
    user must have access to the spool directory /var/spool/cups in order to access
    intermediate data. When fixing the permissions, look for these problems:'
  merge: -1
  pgno: 279
- img_proc: true
  md: '+   - Check all component directories of /var/spool/cups. Can the lp user access
    each of them?


    +   - Make sure that you have the lp user in your /etc/passwd file.


    +   - Verify that lp belongs to the sys group. (Remember that you can change the
    pseudo-user and group with the User and Group parameters of cupsd.conf.)


    # Device Problems


    After running through the filter gauntlet, you are ready to send output to devices.
    Fortunately, there is relatively little that can go wrong at this stage:


    +   - The lp user must write access to any printer device directly connected to
    the system. In addition, check the kernel boot messages and /proc to ensure that
    the kernel recognizes the device ports.


    +   - For network printers, make sure that your host can reach the printer. If
    your device is the socket type on TCP port 9100, test the connection with this
    command:


    ```

    telnet printer_address 9100

    ```


    Terminate a successful connection by pressing CONTROL-], then CONTROL-D. Unless
    you know the printer''s native language, this connection does little good other
    than confirming that it can be made.


    # 12.6 Ghostscript


    If you want to get a handle on printing under Unix, you should get to know Ghostscript.
    As mentioned before, most Unix programs that generate PostScript output. Ghostscript
    is a PostScript interpreter that interprets these features:


    +   - Bitmap rendering from PostScript code in several different output formats


    +   - PostScript file filtering


    +   - Reading and writing to PDF format


    +   - Document previewing


    To get a feel for how Ghostscript works, run it with a file and no other arguments:


    ```

    gs file.ps

    ```


    In addition to getting a preview window showing the first page of the file, you
    should also see this message back at your terminal window:


    ```

    >>showpage, press <return> to continue<<

    ```'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'As the prompt suggests, pressing RETURN pages through the file. After reaching
    the final page, you get a GS> prompt; you may press CONTROL-D or CONTROL-C to
    exit.


    There are several frontend programs, such as g and ggv, that give a nicer interface
    to the Ghostscript preview. Whether you use one of these frontend programs or
    running preview can verify that you have a valid PostScript file to begin with.
    This can go a long way in tracking down problems, especially if your print spooler
    uses Ghostscript to rasterize images


    # 12.6.1 Command-Line Options


    A full gs command line like the one in Section 12.5.8 may seem a bit complicated,
    especially when it comes to device specification. However, it''s not hard to gain
    enough familiarity to make use of Ghostscript''s filtering capabilities.


    Take close look at the following command, which filters old.ps to create new.ps.


    ```

    gs -q -dNOPAUSE -dBATCH -dSAFER -sDEVICE=pswrite -sOutputFile=new.ps old.ps

    ```


    The first four options are typical for filters that run with no user input. Here''s
    what they specify:


    +   -dQuiet mode; suppress any normal diagnostic output.

    -dNOPAUSE Do not wait for the user to press RETURN after each page.

    -dBATCH Terminate after interpreting all input.

    -dSAFER Disallow file allocation capabilities (to avoid security problems).

    -dPARANOIDSAFSAFER option disables file-read capabilities.


    The next two options usually go hand-in-hand when creating an output file:


    +   -dDEVICE_name Use driver_name as the output driver. In this context, the driver
    usually refers to a file format driver rather than a piece of code that manipulates
    devices, though there are exceptions (such as the x11 for the preview window).
    To see a list of drivers, gs -help.


    NOTE Some drivers require other command-line parameters to operate correctly.
    Two notable examples are the unprint and drivers. The unprint driver comes with
    a number of .upp files (containing extra parameters) in the Ghostscript library
    directory. To use these settings, use @file.upp: for example:


    ```

    gs @file.upp -q -dNOPAUSE -dBATCH -sOutputFile=out...

    ```


    +   -sOutputFile-file Write output to file (use - for standard output). If you
    wish to create one file per page of PostScript input, insert %d into the name
    of file. Ghostscript substitutes the page number for %d.'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# 12.6.2 More Ghostscript Tricks


    Here are a few more useful things that you can do with Ghostscript:


    +   - To transform a PostScript file into a PDF file, the pdfwrite driver (Ghostscript
    comes with a ps2pdf script that does essentially the same thing):


    ```

    gs -dNOPAUSE -dBATCH -dSAFER -dDEVICE=pdfwrite -sOutputFile=file.pdf file.ps

    ```


    +   - The pswrite driver (introduced in the previous section) is an effective
    way to make somewhat defective files print. If you can view the file with Ghostscript,
    the chances are good that a file filtered with the pswrite driver will print on
    a finicky printer.


    +   - You can combine several PostScript or PDF files into one by adding the additional
    filenames to the end of the command line.


    +   - To change the output resolution (in dots per inch), use the -rdpi -rdxpixdpi
    parameters. The default resolution is usually 72 dpi. These commands generate
    larger bitmaps:


    ```

    gs -dNOPAUSE -dBATCH -dSAFER -r150 -dDEVICE=pngraw -sOutputFile=file.png

    gs -dNOPAUSE -dBATCH -dSAFER -r300x150 -dDEVICE=pngraw -sOutputFile=file.png

    ```


    # 12.6.3 HP Injet Server


    If you have an inkjet or non-PostScript laser printer by HP, you almost certainly
    need the HPJS (HP Injet Server) driver package. The main part of HPJS is a program
    called hpijs. You can think of this as a plug-in for Ghostscript that translates
    Ghostscript''s internal image format into printer formats. This driver is especially
    important if you are printing photographs or other graphics.


    You can tell if you need HPJS by looking at the PPD file for your printer. If
    you see -DEVICE=ijs in the FoaticCommandLine parameter, you need the driver. You
    can install it as a binary package or from source code; the only thing that matters
    is that Ghostscript can find the command in its path.


    > Current versions of hpijs come with foomatic-rip and a set of PPD files. The
    best output quality likely comes from using these PPD files rather than random
    ones you see on the Internet.


    # 12.7 Further Printing Topics


    This chapter is really only the tip of the iceberg when it comes to printing.
    Chapter 14 revis printing to look at details of how to interface CUPS with Samba
    servers, but among the aspects not touched here are application configuration,
    complex color graphics support, and advanced PostScript topics, not to mention
    several other Unix server packages.'
  merge: -1
  pgno: 282
- img_proc: true
  md: 'Here are some Web sites that can help you with your quest for Unix printer
    configuration:


    **http://www.linuxprinting.org/ ** This site has PPD files and documentation on
    many print servers. It also contains the Foomatic central information site.


    **http://www.cups.org/ ** This is the central CUPS Web site.


    **http://www.ghostscript.com/ ** A good source for Ghostscript software and topics.


    **http://gimp-print.sourceforge.net/ ** Gimp-print is a GIMP plug-in specifically
