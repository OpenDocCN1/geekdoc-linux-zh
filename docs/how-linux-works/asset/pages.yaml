    its contents.


    Before unpacking, it''s usually a good idea to check the contents of a .tar file
    with the t instead of x. This verifies the archive''s basic integrity and prints
    the names of all files inside.


    The most important reason for testing an archive is that sometimes unpacking an
    archive can dump a huge mess of files into the current directory. This is difficult
