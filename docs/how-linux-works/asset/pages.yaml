  md: '# Table 7-2: File Permissions Operators


    | Operator | Returns True if the File Is: |

    | --- | --- |

    | -r | Readable |

    | -w | Writable |

    | -x | Executable |

    | -u | Setuid |

    | -g | Setgid |

    | -k | "Sticky" |


    Finally, there are three **binary** operators (tests that need two files as arguments)
    that are used in file tests, but they are not terribly common. Consider this command
    that includes -nt (newer than):


    ```

    `file1 -nt file2`

    ```


    This exits true if `file1` has a newer modification date than `file2`. The -ot
    (older than) operator does the opposite. And if you need to detect identical hard
    links, -ef compares two files and returns true if they share inode numbers and
    devices.


    # String Tests


    You have already seen the binary string operator =, which returns true if its
    operands are equal. The !== operator returns true if its operands are not equal.


    There are two unary operations:


    +   - **z** Returns true if its argument is empty ([ -z "" ]) returns 0

    - **n** Returns true if its argument is not empty ([ -n "" ]) returns 1


    # Arithmetic Tests


    It''s important to recognize that = looks for string equality, not numeric equality.
    Therefore, [ 1 + 1 ] returns 0 (true), [ 01 = 1 ] returns false. If you want to
    work with numbers, use -eq instead — [ 01 -eq 1 ] returns true. Table 7-3 provides
    the full list of numeric comparison operators.


    # Table 7-3: Arithmetic Comparison Operators


    | Operator | Returns True When the First Argument Is ... the Second |

    | --- | --- |

    | -eq | Equal to |

    | -ne | Not equal to |

    | -lt | Less than |

    | -gt | Greater than |

    | -le | Less than or equal to |

    | -ge | Greater than or equal to |'
