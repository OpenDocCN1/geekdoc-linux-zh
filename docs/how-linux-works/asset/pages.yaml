- img_proc: true
  md: 'The boot loader loads a kernel image into memory and hands control of the CPU
    to the new image, possibly supplying it with some parameters. These parameters
    are simple text strings -s for booting in single-user mode and root-partition
    using partitioning as the root filesystem of the default. You can specify a runlevel
    as a parameter to make the system boot into a runlevel other than the default.


    To type in a kernel name and parameters, however, you first need to know how to
    get a boot prompt. Unfortunately, there are several different boot loaders out
    there, and you can control a boot loader''s behavior, Linux distributions customize
    to their hearts content.


    The next sections tell you how to get to a boot prompt in order to enter a kernel
    name and parameters. If you need to know how to install a boot loader or its configuration,
    see Section 10.5.


    # 3.2.1 LILO


    LILO (Linux Loader) has been around for almost as long as the Linux kernel. The
    LILO boot prompt usually ends with:: If your system boots with LILO, it''s likely
    that you get a fancy screen of graphics at boot time, because this is the default
    for many distributions, including Red Hat Linux. If you see a screen like this,
    look for a part that reads "Press Control-X for text mode."


    Type CONTROL to text mode, if the prompt says LILO with nothing else, press the
    SHIFT key to get the rest of the boot prompt to appear. On the other hand, if
    you get a boot prompt immediately, you need to watch out, because the system will
    likely boot if you don''t type anything in a certain amount of time.


    Once you''re at a LILO boot prompt, press the TAB key to show a list of kernel
    and operating system options. The default kernel name is probably something like
    Linux. To boot this kernel with no options, enter linux after the kernel name:


    ```

    linux option option2 ...

    ```


    For example, to boot the system in single-user mode, type this:


    ```

    linux -s

    ```


    Or, to boot linux in single-user mode with the root filesystem as /dev/hda3 instead
    of your normal default, type this:


    ```

    linux root=/dev/hda3 -s

    ```


    # 3.2.2 GRUB


    GRUB stands for Grand Unified Bootloader, a system that is slowly replacing LILO.
    GRUB has plenty of whiz-bang features, but most important is its ability to navigate
    filesystems, so you can read files without loading a kernel.'
