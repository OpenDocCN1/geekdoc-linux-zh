  md: 'Remember if you use PAP or CHAP, your chat script likely should not contain
    username or password information. However, if your chat script does contain username
    and password details (like the preceding script), you should be mostly done after
    you finish the script — try to verify the connection with ifconfig -a, and to
    access the Internet. If everything works, skip to Section 5.8.5 for information
    on how to tweak your options file.


    NOTE For information on chat, see the chat(8) manual page.


    # 5.8.4 PAP and CHAP


    Many dial-up ISPs require that logins use PAP (Password Authentication Protocol)
    or CHAP (Challenge Handshake Authentication Protocol). If your ISP has such a
    requirement, get started by adding the following entry for your username to the
    end of the /etc/ppp/peers/name options file from Section 5.8.2:


    | username |


    WARNING Don''t put-pap in your options file. This option is primarily for running
    a PPP gateway; it requires the remote system to authenticate with your system.


    # PAP


    If your ISP uses a PAP server, edit /etc/ppp/pap-secrets. The lines in that file
    have this format:


    | your_hostname | remote_hostname | password | ip_address |


    The references to hostnames are primarily for use by PPP servers. For a simple
    client machine, you can put this in pap-secrets:


    | username * | password * |


    * The means to accept any remote hostname. Don''t bother with the IP address,
    because the server should give you one.

    The preceding instructions will work if you have only one ISP. However, if you
    have multiple ISPs, the following for each:


    +   1. Pick a name for the ISP (isp_name).

    2. Add the following line to the ISP''s options file in /etc/ppp/peers:


    ```

    remotename isp_name

    ```'
