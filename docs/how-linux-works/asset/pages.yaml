    # 2.4 Filesystems


    A filesystem is a database of files and directories that you can attach to a Unix
    system at the root (/) or some other directory like (/usr) in a currently attached
    filesystem. On one time, filesystems reside on disks and other physical media
    used exclusively for data storage. However, the tree-like directory structure
    and I/O interface of filesystems is quite versatile, so filesystems perform a
    variety of tasks.


    # 2.4.1 Filesystem Types


    Linux supports an extraordinarily large number of filesystems, including native
    designs optimized for Linux, foreign types such as the Windows FAT family, universal
    filesystems like ISO9660, and others. The following list includes the most common
    types of filesystems for data storage; the type names recognized by Linux are
    in parentheses next to the boldfaced filesystem names.


    +   * Second Extended filesystem (ext2) is native to Linux. It is fairly quick,
    and it defragments itself. Every Linux system uses ext2 or its newer, journaled
    version, ext3.

    * Third Extended filesystems (ext3) are ext2 filesystems augmented with journal
    support. This can recover from an abrupt reboot or failure quicker less painful.

    * ISO9660 (iso9660) is a CD-ROM standard. Most CD-ROMs use some variety of ISO9660
    extension; Linux systems support them.

    * FAT filesystems (msdos, vfat, umsdos) pertain to Microsoft systems. The simple
    msdos systems support the very primitive monocase variety in MSDOS systems. For
    Windows filesystems, use vfat. The umsdos filesystem is peculiar to Linux; it
    supports Unix features such as symbolic links on top of an MS-DOS filesystem.
    It is also not very common.

    * The Reiser filesystem (reiserfs) is relatively new. It supports a journal and
    is optimized for fairly small files, a condition that often occurs in Unix systems.'
