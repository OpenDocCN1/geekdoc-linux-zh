    # 5.4 Configuring Interfaces and the Host-to-Network Layer


    On a Linux system, you connect the Internet Layer to the physical medium, such
    as an Ethernet network or a modem-based connection, with a network interface.
    Common network interface names are eth0 (the first Ethernet card in the computer)
    and ppp0 (a PPP interface).


    The most important command for viewing or manually configuring the network interface
    settings is ifconfig. To see your current interface''s, run this command:


    ```

    ifconfig -a

    ```'
