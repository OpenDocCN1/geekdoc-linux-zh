    # 5.9.1 Routers


    Before you connect a Linux machine directly to a broadband connection, you need
    to ask yourself this very important question: Is it really worth it?


    The alternative is to purchase a small router. These very inexpensive devices
    not only speak IP and PPPoE, but often include a multi-port 10/100-Base-T Ethernet
    switch and a wireless access point. You can do network address translation, route
    packets from the outside world to ports on their internal networks, and more.
    (Sometimes they have pretty lights that see like candy when you have nothing to
    do.)


    Routers are attractive for Linux users with PPPoE connections. PPPoE is a hassle,
    because you have to worry about several configuration files and daemons, not to
    mention trouble when upgrading. If you put a router between a DSL connection and
    your Linux machine, you can configure your machine''s IP address statically or
    with DHCP.


    You can also build a network with a router. Their built-in switches not share
    the broadband connection with all of the machines on the network, but also link
    those machines with each other.


    Of course, a Linux machine with two Ethernet cards and a hub or switch can do
    anything that a router can. In fact, you have much finer control over a full-blown
    Linux machine acting as a router. However, few people actually have a use for
    the fancy tricks you get with Linux, and the cost of a router is not much more
    than the cost of a switch.


    If you decide to purchase a router, skip to Section 5.10 for Ethernet networking
    details. Otherwise, if you are using PPPoE to connect to your ISP and want to
    do everything on your Linux machine, continue running.


