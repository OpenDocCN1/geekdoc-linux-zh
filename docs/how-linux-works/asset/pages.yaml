- img_proc: true
  md: 'The shutdown process takes several seconds. You should never reset or power
    off a machine during this stage. In the preceding example, now is the time to
    shut down. This argument is mandatory, but there are many ways of specifying it.
    If you want the machine to go down sometime in the future, one way is to use $n$,
    where $n$ is the number of minutes shutdown should wait before doing its work.
    For other options, look at the shutdown(8) manual page.


    To make the system reboot in ten minutes, run this command:


    ```

    shutdown -r +10

    ```


    On Linux, shutdown notifies anyone logged on that the machine is going down, but
    it does little real work. If you specify a time other than now, shutdown creates
    a file /etc/nologin. When this file is present, the system prohibits logins by
    anyone except the superuser.


    When shutdown finally arrives, shutdown tells init to switch to runlevel 0 for
    a halt and runlevel 6 for a reboot. When init enters runlevel 0 or 6, all of the
    following tasks take place, which you can verify by looking at the scripts rc0.d
    and rc6.d:


    +   1. init kills every process that it can (as it would when switching to any
    other runlevel).


    +   2. The initial rc0.d/rc6.d commands run, locking system files into place and
    making other preparations for shutdown.


    +   3. The next rc0.d/rc6.d commands unmount all filesystems other than the root.


    +   4. Further rc0.d/rc6.d commands remount the root filesystem read-only.


    +   5. More rc0.d/rc6.d write buffered data out to the filesystem with the sync
    program (see Section 2.4.4).


    +   6. The final rc0.d/rc6.d commands tell the kernel to reboot or stop with the
    reboot, halt, or poweroff program.


    The reboot and halt programs behave differently for each runlevel, potentially
    causing confusion. By default, these programs call shutdown with the -r or -h
    options, but if the system is already at the halt or reboot runlevel, the programs
    tell the kernel to shut itself off immediately. If you really want to shut your
    machine down in a hurry (disregarding any possible damage from a disorderly shutdown),
    use the -f option.


    # 3.2 Boot Loaders


    Before the kernel runs init, a boot loader starts the kernel. On occasion, you
    may need to load different kernels or operating systems, and to start in different
    modes. This is especially important when trying to fix a system that has a problem
    that prevents a full boot. To fix such a problem, you may need single-user mode
    or an alternate kernel.'
