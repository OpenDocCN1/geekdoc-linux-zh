- img_proc: true
  md: '# 16


    # USER ENVIRONMENTS


    This book’s focus is on the Linux system that normally lies underneath a user’s
    interactive session. Eventually, the system and the user have to meet somewhere.
    You saw plenty of commands and shell features in Chapter 1 and Chapter 7, but
    there’s still one little piece missing: the startup files that set defaults for
    the shell and other programs.


    Most users do not pay attention to their startup files. Over time, the files become
    cluttered, containing unnecessary environment variables and tests that can lead
    to annoying (or quite serious) problems. Worse still, operating system vendors
    do not consider the consequences of what they put in the default startup files,
    packing them full of items that may even confuse the user.


    Keeping in tune with the shell-oriented theme of this book, this chapter focuses
    specifically on shell startup files. If you have ever received a Unix account
    in the past, it may have come with a bafflingly large array of startup files,
    sometimes called dot files because they nearly always start with a dot (.). You
    may be surprised to learn that it really isn’t necessary to have so many startup
    files.'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# 16.1 Appropriate Startup Files


    When designing startup files, you should keep the user in mind. If you are the
    only user on a machine, you don''t have much to to worry about — if you make an
    error, you''re the only one affected, and it''s easy enough to fix. However, if
    your new startup files are to be the defaults for all new users on a machine or
    network, or if you think that someone might copy your files for a different machine,
    your task becomes considerably more difficult. If you make an error in a startup
    file for ten users, you might end up fixing this error ten times. That''s annoying,
    to say the least.


    There are two essential goals to keep in mind when creating startup files for
    other users:


    +   **Simplicity** Keep the number of startup files small, and the files as small
    and simple as possible so that they are easy to modify but hard to break. Each
    item in a startup file is just one more that can break.


    +   **Readability** Use many comments in the files, so that the users get a good
    picture of what each part of a file does.


    # 16.2 Shell Startup File Elements


    What goes into a startup file? Some things may seem obvious, such as the path
    and a prompt setting. But wait, what exactly should be in the path, and what does
    a reasonable prompt look like? And how much is it too much to put in a startup
    file?


    The next sections outline the essentials of a shell startup file, covering the
    command path, manual page, prompt, aliases, and permissions mask.


    # 16.2.1 The Command Path


    The most important part of any shell startup file is the command path. The path
    should cover the directories that contain any application of general interest
    to a regular user. At the very least, the path should contain these components,
    in this order:


    ```

    /usr/local/bin

    /usr/bin

    /usr/X11/bin

    /bin

    ```


    This order ensures that you can override standard default programs with site-specific
