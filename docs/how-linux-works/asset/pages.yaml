- img_proc: true
  md: '# 10.4.3 Installing Modules


    Before you install and boot from your new kernel, you should put the new kernel
    modules in /lib/modules with this command:


    ```

    make modules_install

    ```


    Your new modules should appear in /lib/modules/version, where version is your
    kernel version. If you fail to install the modules before booting your kernel,
    the kernel module utilities will not automatically recognize the new modules,
    and you may end up missing a few drivers.


    The module installation builds a dependency list in /lib/modules/version.dep.
    If this stage fails, it''s likely that your module utilities out of date. As of
    this writing, the module utilities are in a package named module-init-tools.


    # 10.4.4 Kernel Parameters


    Sometimes you need to send extra parameters to the kernel at boot time in order
    to get devices or services working. For example, one of the most elementary kernel
    parameters is root=partition, which sets the initial root partition to partition.


    You can enter a kernel parameter after the kernel image name. For example, at
    a LILO prompt where your kernel label is Linux, you can type this:


    ```

    Linux root=/dev/hd3

    ```


    Documentation/kernel-parameters.txt contains a list of all kernel parameters.
    Most of them are for hardware. In addition to root=partition, here are the most
    important parameters:


    +   - initpath This starts path as the first process on the system in place of
    /bin/init. For example, you can use init=/bin/sh to get out of a tight spot if
    your init does not work properly.

    - mem=size This specifies that the machine has size memory; the kernel should
    not autodetect the memory size. For example, to specify 512MB of memory, you use
    mem=512M.

    - rootfstype This specifies that the root filesystem''s type is type.


    A number as a boot parameter indicates the init runlevel. You can use -s or 5
    for single-user mode.


    # 10.5 Installing Your Kernel with a Boot Loader


    Boot loaders load kernel images into memory and hand control of the CPU over the
    newly loaded kernel. To make your new kernel work, you must tell the boot loader
    about the kernel.'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'If you have never worked with a boot loader before, you need to know how a
    PC boots from the hard disk. On a normal Microsoft-based system, the boot process
    works like this:


    +   1 After performing the power-on self test (POST), the BIOS loads sector 1
    of the hard disk into memory and runs whatever landed in memory. On most Windows-based
    systems, this sector is called the Master Boot Record (MBR).


    +   2 The MBR extracts the partition table from the disk and identifies the "active"
    partition.


    +   3 The MBR loads and runs another boot sector from the active partition, operating
    the system in motion.


    On a Linux system, you can install the kernel loader on the active partition or
    you can replace the MBR with a boot loader. If you decide to replace the MBR with
    a boot loader such as GRUB or LILO, it is important to remember that the active
    partition has little meaning — these boot loaders address partitions based their
    own configuration systems.


    From a practical point of view, your decision to overwrite the MBR (and thus circumvent
    the active partition) makes little difference. If you runs Linux, you want GRUB
    or LILO as your default boot loader. Even if you have a dual-boot machine, you
    still want to use GRUB or LILO, because both boot loaders are capable of loading
    boot sectors from other operating systems.


    The important point is that you know where your boot loader resides. Lets say
    your disk is /dev/sda and you have a Linux root partition at /dev/hd3. If you
    replace the MBR by writing GRUB to /dev/hd3, you need to remember that the active
    partition is no irrelevant; GRUB uses its configuration system to access partitions.
    However, if you decide to write the boot loader to /dev/hd3 instead, keeping the
    old MBR, your system will get to that boot loader only if /dev/hd3 is the active
    partition.


    > NOTE If you need to replace the MBR on a hard disk, run the DOS command FDISK
    /MBR.


    When configuring a boot loader, be sure that you know the location of the root
    partition and any kernel parameters.


    # 10.5.1 Boot Loader?


    Because there are two popular Linux boot loaders, you may wonder which one you
    choose:


    LILO Linux Loader. This was one of the very first Linux boot loaders. Its disadvantages
    are that it is not terribly flexible and that you must run lilo to install a new
    boot block every time you install a new kernel. However, LILO is fairly self-contained.'
