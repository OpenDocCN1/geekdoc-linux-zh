    Most shell scripts use command-line parameters and interact with the commands
    they run. To take your scripts from simple lists of commands to more flexible
    programs, you need to know how to use the Bourne shell variables. Using special
    variables is not much different from using any other shell variable (Section 1.8),
    but you cannot change the value of certain special variables.


    After reading the next sections, you will understand why shell scripts accumulate
    many special characters as they are written. If you''re trying to understand a
    shell script and come across a line that looks completely incomprehensible, pick
    it apart piece by piece.


    # 7.3.1 $1, $2, ...


    $1, $2, and all variables named as positive nonzero integers contain the values
    of the script parameters, or arguments.


    Let''s say the name of the following script is pshow:'
