    value.

    - The group ID (a number). The GID must be unique within the group file. This
    number goes into a user''s group field in /etc/passwd entry.

    - An optional list of users who belong to the group. In addition to the users
    listed here, users with the corresponding group ID in their passwd file entries
    also belong to the group.


