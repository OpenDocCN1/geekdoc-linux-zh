    used primarily by the command-line programs and server communication. The CUPS
    scheduler places identifiers in the certificate directory /etc/cups/certs for
    various purposes, but the one you care most about is /etc/cups/certs/0. Any user
    that can read this file can run administrative programs without a password, because
    these programs send the certificate of a username and password.


