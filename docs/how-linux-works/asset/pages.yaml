    # 11.6.1 When You Insert a Card


    The cardmgr program reads configuration data and activates scripts in /etc/pcmcia
    in response to cards being inserted and removed. The central card configuration
    database is /etc/pcmcia/config.

    When you insert a PC Card, Cardmgr does the following:


    +   1. It reads the device identifier information from the PC Card.

    2. It looks up the identifier in /etc/pcmcia/config, retrieving the kernel module
    that contains the device driver.

    3. It matches the kernel module name with a class name in /etc/pcmcia/config.

    4. It loads the kernel module(s) and configures the PC Card with respect to the
    local options in /etc/pcmcia/config.opts.

    5. It runs a script located in the /etc/pcmcia directory, corresponding to the
    class name found in /etc/pcmcia/config.


    /etc/pcmcia

    Let''s look at the /etc/pcmcia directory in more detail. Each kernel module has
    one or more matching PC Card definitions in the /etc/pcmcia/config file. For example,
    here is an entry that matches the 3c589_cm module against its vendor and version
    string:


    ```

    card "Lucent Technologies WaveLAN Adapter"

    version "Lucent Technologies", "WaveLAN/PCMCIA"

    bind "wavelan_cs"

    ```


    The bind in the last line means to bind the card definition for one or more kernel
    modules. However, the card definition does not always specify that version of
    the hardware. cardmgr can also identify the appropriate kernel module using other
    hardware criteria, including the function parameter, as in this example:


    ```

    card "ATA/IDE Fixed Disk"

    function fixed_disk

    bind "id_cs"

    ```


    Well-defined device interfaces such as disks, serial ports (modems), and flash
    memory usually have a function parameter, but don''t expect this from all devices.
    In particular, Ethernet cards don''t have a function parameter. You may also see
    manual device-identifier matches that use the manfid keyword.'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'Having identified the necessary kernel module(s), cardmgr looks for the device
    driver module class, which are found in the first part of /etc/pcmia/config. Here
    is a sample definition that maps wavel_cs to the network driver class:


    ```

    device "wavelan_cs"

    class "network" module "wavelan_cs"

    ```


    Each driver class has a script in /etc/pcmia/config cardmgr runs after loading
    and configuring a card''s module (you''ll see more about class scripts shortly).


    # Configuration Options


    You should not modify /etc/pcmia/config; instead, enter your local configuration
    data in /etc/pcmia/config.opts (cardmgr) usually reads this file after config.
    For the most part, the PCMCIA utilities work fine with the default settings, but
    the machine- card-specific options in config.opts are at your disposal if your
    hardware just''t behave.


    Of particular interest are the exclude and include keywords that enable you to
    manually specify IRQs and addresses. For example, you will see the following lines
    to prevent cardmgr from using standard IRQs, regardless of what the kernel may
    say about their availability:


    ```

    # First built-in serial port

    exclude irq 4

    ```


    ```

    # First built-in parallel port

    exclude irq 7

    ```


    You can specify per-module options with the module keyword. These examples are
    also from the default config.opts file:


    ```

    module "ray_cs" opts "net_type=1 essid=ESSID1"

    module "wlan_cs" opts "station_name=MY_PC"

    ```


    > NOTE In normal circumstances, you do not configure wireless options with config.opts,
    but rather, with iwconfig and possibly /etc/pcmia/wireless.opts (see Section 5.15
    for more information).


    # Auxiliary Configuration Scripts


    Each driver class has a script in /etc/pcmia. For example, the /etc/pcmia/network
    script corresponds to the network class mentioned earlier. cardmgr runs the class
    script after loading and configuring a card''s module.


    The /etc/pcmia configuration scripts work like init.d boot scripts, taking an
    argument to start, reload, or perform other actions:'
  merge: -1
  pgno: 256
