    | Network | Subnet Mask | Short Form |

    |---|---|--|

    | 10.0.0.0 | 255.0.0.0 | 10.0.0.0/8 |

    | 192.168.0.0 | 255.255.0.0 | 192.168.0.0/16 |

    | 172.16.0.0 | 255.240.0.0 | 172.16.0.0/12 |


    Unless you plan to have more than 254 hosts on a single network, pick a small
    subnet such as 10.0.0.0/24 (255.255.255.0), which uses the addresses 10.0.0.1
    through 10.0.0.254. (Networks with this mask are sometimes called Class C networks.
