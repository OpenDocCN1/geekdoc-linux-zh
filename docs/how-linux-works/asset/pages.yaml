    # 5.8.5 Options Files


    The files in /etc/ppp/peers contain valid pppd command-line options. Therefore,
    you could run ppp at the shell prompt with these options as command-line arguments,
    and indeed, some distributions (like Red Hat Linux) use scripts to set up pppd
    invocations, completely bypassing /etc/ppp/peers. However, it''s more convenient
    to use these options to enable you to invoke pppd `file` to activate the connection.


    > In the per-connection file in /etc/ppp/peers, you need a /etc/ppp/options file
    for global settings that apply to all pppd processes. This file must exist, even
    if it''s empty.


    As mentioned earlier, the first two options in the options file are the serial
    device (with or without /dev at the front) and the serial port speed. Most serial
    ports and modems, 115200 is an appropriate speed, but you may wish to lower it
    to 57600 or lower for really slow systems. Recall that the following was the first
    options line in Section 5.8.2:


    ```

    ttyS1 115200 crcts

    ```


    All other pppd options follow the serial port and baud rate. Here are some of
    the most important ppp options:


    +   - **cts** Enables RTS/CTS hardware flow control (popular with PC hardware).

    - **defaultroute** Sets the kernel''s default route to the machine on the other
    side of the PPP connection. Don''t forget this option; otherwise, you won''t be
    able to reach anything on the Internet beyond the host on the other end of the
    PPP connection, which usually isn''t very useful. If you happen to forget this
    when testing, you can manually add a route with the route command (see Section
    5.11).'
