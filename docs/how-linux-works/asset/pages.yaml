    # 5.12 The Transport Layer: TCP, UDP, and Services


    So far, you have seen how packets move from host to host on the Internet. That''s
    clear enough, but it says nothing about how your computer presents the data it
    receives to its running processes. You want more than one application to be able
    to talk to the network at the same time (for example, you might have email and
    web clients running), and you also want to receive the data in some form that''s
    easier to handle than packets.


    Transport layer protocols and services perform these tasks. The most popular transport
    protocols are the Transmission Control Protocol (TCP) and the User Datagram Protocol
    (UDP). Both define ports on network nodes. When a program on your machine wants
    to talk to a remote machine, it opens a port on the local machine and requests
    a connection to'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'a port on the remote machine (a connection is defined by the two hosts, the
    ports on each side, and a special packet sequence). After the transport layer
    services on both sides establish the connection, the hosts can exchange data.


    Transport layer services have complex implementations because they must convert
    a series of packets (not necessarily arriving in the correct order) into a data
    stream for programs. Luckily, you need to know to nothing about this.


    In TCP and UDP, a port is a number. If a program accepts connections on a port,
    it is said to listen on that port. There are well-known ports for various services;
    for example, email servers on TCP port 25, and most Web servers on TCP port 80.
    Only the superuser may use ports 1 through1023. All users may listen on and create
    connections from ports 1024 up.


    On a Unix system, the /etc/services file maps names to port numbers and transport
    layer protocols. This plain-text file consists of lines like:


    ```

    ssh 22/tcp # SSH Remote Login

    smtp 25/tcp

    domain 53/udp

    ```


    The first column holds the service names. The second column in the /etc/services
    file defines the port number and a transport layer protocol. Take a look at /etc/services
    on your machine. Notice that the services file does not define the programs that
    listen on ports on your computer.


    You will learn more about how programs listen and connect to the application layer
    in the next chapter. The rest of this chapter is devoted to three advanced networking
    topics: firewalls, NAT (IP masquerading), and wireless networking.


    # 5.13 Firewalls


    A firewall is a machine that sits between a network and the rest of the Internet,
    attempting to ensure that nothing "bad" from the Internet harms the network. You
    can also set firewall features for each machine, where the machine screens all
    of its incoming and outgoing data at the packet level (as opposed to the application
    layer, where server programs usually try to perform some access control of their
    own). Firewalling on individual machines is sometimes called filtering.


    To understand how firewalls work, consider that there are three times when a system
    filters packets:


    +   * When the system receives a packet

    * When the system sends a packet

    * When the system forwards (routes) a packet to another host or gateway'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'With firewalling in place, a system just processes packets and sends them on
    their way.

    Firewalls put checkpoints for packets at the points of data transfer identified
    above. The checkpoint drops, rejects, or accepts packets, usually based on some
    of these criteria:


    +   - The source or destination IP address or subnet

    - The source or destination port (in the transport layer information)

    - The firewall''s network interface


    In Linux, you create firewall rules in a series known as a chain that is part
    of a networking table (for the most part, you will only work with one table named
    filter that controls basic packet flow). The iptables command, available since
    kernel version 2.4.0, manipulates these rules and chains. Your kernel configuration
    must have packet filtering (in the networking options) and IP tables support (in
    the netfilter configuration submenu). You will learn more about kernel configuration
    in Chapter 10.


    There are basic chains: INPUT for incoming packets, OUTPUT and FORWARD for routed
    packets. To view the current configuration, run this command:


    ```

    iptables -L

    ```


    The iptables command should list an empty set of chains, as follows:


    | Chain INPUT (policy ACCEPT) | |

    | target prot opt source | destination |


    | Chain FORWARD (policy ACCEPT) | |

    | target prot opt source | destination |


    | Chain OUTPUT (policy ACCEPT) | |

    | target prot opt source | destination |


    Each chain has a default policy that specifies what to do with a packet if no
    rule matches the packet. The policy for all three chains in this example is ACCEPT,
    meaning that the kernel allows the packet to successfully pass through the packet-filtering
    system. For the purposes of this book, the only other value that makes any sense
    is DROP, which means the kernel will discard the packet. To set the policy on
    a chain, use iptables -P as in this example:


    ```

    iptables -P FORWARD DROP

    ```


    > WARNING Don''t do anything rash with the policies on your machine until you''ve
    read through the rest of this section.'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'Let''s say someone at 192.168.34.63 is annoying you, so you''d like to prevent
    them from talking to your machine. Run this command:


    ```

    iptables -A INPUT -s 192.168.34.63 -j DROP

    ```


    - A INPUT input parameter appends to the INPUT chain. The

    -s 192.168.34.63 part specifies the source IP address in the rule, and -j DROP

    tells the kernel to discard any matching rule. Therefore, the

    machine will throw out any packet coming from 192.168.34.63.

    To see the in place, run iptables -L:


    |Chain INPUT (policy ACCEPT)

    target prot source destination

    DROP all -- 192.168.34.63 anywhere|


    As would like it, though your good buddy at 192.168.34.63 has told

    every on his subnet to open connections to your SMTP port (TCP port

    25), so now you want to rid of that traffic as:


    ```

    iptables -A INPUT -s 192.168.34.0/24 -p tcp --destination-port 25 -j DROP

    ```


    This example adds a network filter to the source address, as well as -p tcp

    to specify TCP packets only. A further restriction, --destination-port 25 says

    that the rule should only apply to port 25. The IP table list for

    INPUT looks like this:


    |Chain INPUT (policy ACCEPT)

    target prot source destination

    DROP all -- 192.168.34.63 anywhere

    DROP tcp -- 192.168.34.0/24 anywhere tcp dport:smtp|


    All is well until you hear from someone you know at 192.168.34.37, saying

    that they can''t send you email because you blocked their machine. Which

    that is a quick fix, you run this command:


    ```

    iptables -A INPUT -s 192.168.34.37 -j ACCEPT

    ```


    However, it doesn''t work. For the reason, look at the new chain:


    |Chain INPUT (policy ACCEPT)

    target prot source destination

    DROP all -- 192.168.34.63 anywhere

    DROP tcp -- 192.168.34.0/24 anywhere

    ACCEPT all -- 192.168.34.37 anywhere tcp dport:smtp|


    The kernel reads the chain from top to bottom, using the first rule that

    matches. The first rule does not match 192.168.34.37, but

    because it applies to all hosts from 192.168.34.1 to 192.168.34.254, and this'
  merge: -1
  pgno: 133
