    **NOTE** Take special care to avoid >. This can cause erratic, empty files to
    appear in your current directory if you accidentally copy and paste a section
    of your shell window, > redirects output from a file.


    Even a shell''s default prompt isn''t ideal. For example, the default bash prompt
    contains the name and version number, and the default tsh prompt includes the
    hostname, the current working directory, and a >.


    Here is a simple prompt setting for bash that ends with the customary $ (the traditional
    tsh prompt ends with %)


    ```

    PS1=''\u ''

    ```


    The \u is a substitution for the current username (see the PROMPTING section of
    the bash manual page). Other popular substitutions include the following:


    +   - h The hostname (the short form, without domain names)

    - ! The history number

    - w The current directory (this can become somewhat long; you can display only
    the final component with \w)

    - $ if running as a user account, and # if root


    # 16.2.4 Aliases


    Among the sticky points of modern user environments is the role of aliases, a
    shell feature that substitutes one string for another before executing a command.
    At one time, these were efficient shortcuts introduced to save some time. However,
    aliases also have these drawbacks:


    +   - They have balky syntax, especially when manipulating arguments.

    - They are confusing; a shell''s built-in command can tell you if something is
    an alias, but it won''t tell you where it was defined.

    - They are frowned upon subshells and non-interactive shells; they do not work
    in other shells.


    With all these disadvantages, it makes sense to avoid aliases whenever possible,
    because it''s easier to write a shell script (Chapter 7). Modern computers can
    start and execute shells so quickly that the difference between an alias and an
    entirely new command should not mean anything to you.


    However, there is one particular instance where aliases come in handy — when you
    wish to alter a part of the shell''s environment. You can''t change an environment
    variable with a shell script, because scripts run as subshells.'
