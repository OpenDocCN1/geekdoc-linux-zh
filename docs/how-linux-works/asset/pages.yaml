- img_proc: true
  md: 'GRUB Grand Unified Boot Loader. This is a newer system gaining popularity,
    and it does not need a reconfiguration for every new kernel because it can read
    many kinds of filesystems. This feature is especially handy for situations where
    you might need to boot from an old kernel. Initially, GRUB is slightly trickier
    to configure than LILO, but it is much easier to deal with once installed, you
    do not need to replace the boot sector for every new kernel. I recommend GRUB.


    # 10.5.2 GRUB


    With GRUB, you need only install the boot loader code on your machine once; after
    that, you can modify a GRUB menu file for any new kernel that you want to boot
    on a permanent basis.


    The GRUB boot files are in /boot/grub. GRUB loads the various stage files into
    memory during the boot process. If you already have GRUB on your machine, you
    just need to modify the /boot/grub/menu.1 file when you add a new kernel image
    under a new name. If you install a new kernel image with the same name as the
    old kernel, you do not need to modify the menu file.


    Some distributions preinstall GRUB but have a different name for. In any case,
    the menu may need to dig around in /boot to find the correct filename.


    ```

    default 0

    timeout 10

    ```


    ```

    title Linux

    kernel (hhd0)/boot/vmlinuz root=/dev/hda1

    ```


    ```

    title backup

    kernel (hhd0)/boot/vmlinuz.0 root=/dev/hda1

    ```


    The parameters in the menu file are as follows:


    ```

    default The title entry that GRUB should boot by default. 0 is the first

    entry, 1 is the second, and so on.

    timeout How long GRUB should wait before loading the default entry.

    title A label for the kernel.

    kernel The kernel image and parameters, possibly including the

    root device.

    ```


    In GRUB, (hd0) is the first hard disk on your system, /dev/hda. GRUB

    assign mappings in the order that they appear on your system, if you

    have /dev/hda and /dev/hdc but not /dev/hdb, GRUB would assign (hd0)

    to /dev/hda and (hd1) to /dev/hdc. The first number in the GRUB name is for

    disk, and the second is for the partition (if there is a partition). Check

    the /boot/grub/device.map file for your system’s hard drive mapping.'
