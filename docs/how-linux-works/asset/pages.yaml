- img_proc: true
  md: 'Notice that there''s a gap between 2 and 4 in this example. This usually means
    there''s some kind of connectivity problem. It is possible to get packets out
    of order, but if this happens, there''s still some kind of problem because ping
    sends only one packet at a second. If a response takes more than a second to arrive,
    the connection is extremely slow.


    The round-trip time is the total elapsed time between the request packet was transmitted
    and moment that the response packet arrived. If there are incomplete routes between
    the request source and destination, ping immediately reports the ICMP "host unreachable"
    packets that come back as a result of the disconnection.


    On a wired LAN, you should expect absolutely no packet loss and low numbers for
    the round-trip time (the preceding example out from a wireless network). You should
    also expect no packet loss from your network and to your ISP, as well as reasonable,
    steady round-trip times.


    Sadly, not all hosts on the Internet respond to ICMP echo packets as they once
    did. Therefore, you may come across situations where you can connect to a Web
    site on a host, but not getting a response.


    Another ICMP-based program is traceroute; it will come in when you reach the material
    on routing router in the chapter. Use traceroute host to see the path your packets
    take to a remote host. One of the best things about traceroute is its reporting
    of return-trip times at each step in the route, as demonstrated in this output
    fragment:


    | 4 | 206.220.243.106 | 1.163 ms | 0.997 ms | 1.182 ms |

    | 5 | 24.203.65 | 1.312 ms | 1.12 ms | 1.463 ms |

