    # 8.6 Assembly Code and How a Compiler Works


    If you need to use a compiler''s advanced features, you should have an idea of
    how the compiler operates. Here is a brief summary:


    +   1. The compiler reads a source code file and builds an internal representation
    of the code inside the file. If there''s a problem with the source code, the compiler
    states the error and exits.

    2. The compiler analyzes the internal representation and generates assembly code
    for the target processor.

    3. An assembler converts the assembly code into an object file.

    4. The linker gathers object files and libraries into an executable.


    You may be specifically interested in steps 2 and 3 of this process. Assembly
    code is one step away from the raw binary code that the processor runs; it is
    a textual representation of the processor instructions. Here is an excerpt of
    a program in x86 assembly code:


    .L5:


    ```

    mov -8(%ebp),%eax

    imull -16(%ebp),%eax

    mov -4(%ebp),%edx

    add %eax,%edx

    mov %edx,-12(%ebp)

    incl -16(%ebp)

    jmp .L3

    .palign 4,,7

    ```'
