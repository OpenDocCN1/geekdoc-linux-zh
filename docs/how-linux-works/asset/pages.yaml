    # Adding Dot (.) to the Path


    There is one small but controversial command path component to discuss: the dot.
    Placing a dot (.) in your path allows you to run programs in the current directory
    without using / in front of the program name. This may be convenient when writing
    scripts or compiling programs, but it is a bad idea for two reasons:


    +   - It can be a security problem. You should never put a dot at the front of
    the path. For example, an attacker could put a Trojan horse in an archive distributed
    on the Internet. Even if a dot is at the end of the path, you are still vulnerable
    to types such as l.


    +   - It is inconsistent and can be confusing. A dot in the path can mean that
    a command''s behavior can change according to the current directory.


    # 16.2.2 The Manual Page Path


    Your manual path (the MANPATH environment variable used by man) should match your
    command path, except each directory in the manual path variable should be in a
    man directory rather than /bin.


    Here is the manual page path that corresponds to the command path listed in Section
    16.2.1:


    ```

    /usr/local/man:/usr/man:/usr/X11r6/man:$HOME

    ```


    # 16.2.3 The Prompt


    Avoid a complicated, useless prompt. For whatever reason, many administrators
    feel the need to drag everything, including the kitchen sink. Just because you
    can place the current working directory, hostname, username, and fancy decorations
    in a prompt, it doesn''t mean you should.'
