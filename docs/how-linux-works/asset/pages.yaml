    is: "What IP subnet should I use?


    You can pay your ISP for a block of Internet addresses if you need real Internet
    routing to a number of individual hosts inside your local network. However, this
    costs a lot of money and isn''t useful for anything but a decentralized site,
    such as a university. As a much less expensive alternative, you can pick a subnet
    from the addresses in the RFC 1918 Internet standards document, shown in Table
    5-2 on the next page.'
