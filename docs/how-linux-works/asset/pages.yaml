  md: '+   start Activates the device upon card insertion

    stop Deactivates the device upon card removal

    restart Reinitializes the device

    check Verifies the device

    suspend Deactivates a card, leaves the driver running

    resume Picks up at the point where suspend left off, if possible


    Just because a script exists in /etc/pcmia doesn''t mean that it works. These
    scripts run through several combinations of distribution-specific configuration
    files, trying to find the right settings. If your PC Card doesn''t auto-configure
    correctly upon insertion, you may need to modify one of the scripts or its corresponding
    .opts configuration file.


    **WARNING** You may find it easiest to write your own driver scripts or modify
    the existing ones, but remember to make a backup of any script you decide to change.
    Reinstalling the pcmia-cs package overwrites each script in /etc/pcmia (leaving
    a backup with a .0 extension). The .opts configuration files remain in a period
    during the restart.


    You should not normally need to call one of the /etc/pcmia scripts by hand. cardctl
    andctl (discussed next) do this for you.


    #  11.6.2 cardctl


    The cardctl enables you to alter card settings and display information about cards
    and sockets. For example, you can view PC Card identifiers with this command:


    runas cardctl ident


    The output looks similar to this:


    Socket 0:

    product info: "Lucent Technologies", "WaveLAN/IEEE", "Version 01.01", ""

    manifest: 0XO156, 0XO002

    function: 6 (network)


    Notice how this information relates to the configuration data in /etc/pcmia/config.

    Here are some other cardctl commands:


    +   **config** Shows detailed-level hardware settings.

    **status** Displays card or socket status.

    **eject** Shuts down the card in socket (use indent to identify the socket number).
    You should run eject on certain cards, such as SCSI cards and other interfaces
    that take a long time to initialize, before removing them.'
