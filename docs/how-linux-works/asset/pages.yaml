    +   - General status bits explain more about the state of the tape and tape drive.
    BOT means "beginning of tape," and ONLINE reports that the tape drive is ready
    and loaded. See Section 13.6.6 for a full list of mt status bits.


    # ## 13.6.2 Creating Archives on a Tape


    It is difficult to understand how a tape drive works by running through various
    files on a random tape in a collection of backups. Therefore, this section shows
    the process of searching through a tape, this section shows how to create some
    archives for yourself before going into the specifics of unarchiving. Once you
    have learned this, you will be able to play with a tape without significant confusion
    or worrying about losing data.


    Here is a procedure for creating three files on a tape — specifically, tar archives
    of /lib, /boot, and /dev:


    +   1. Put a new tape in your drive (a blank tape, or one that you don''t care
    about).

    2. Make sure that your TAPE environment variable is set to the no-rewind tape
    device.

    3. Run mt status to verify that the tape is in the drive and your TAPE variable
    is set.

    4. Change to the root directory.

    5. Create a tar archive of the first file on the tape with this command:


    ```

    tar zcv lib

    ```


    +   6. Run mt status. The output should look something like the following, indicating
    that the tape is on the next file (file 1):


    SCSI 2 tape drive:

    File number=1, block number=0, partition=0.

    Tape block size 0 bytes. Density code 0x13 (DDS 61000 bpi).

    Soft error count count since last status=0

    General status bits on (810100000):

    EOF ONLINE IM_REP_EN


    +   7. Create an archive of your /boot directory:


    ```

    tar zcv boot

    ```


    +   8. Create an archive of your /dev directory:


    ```

    tar zcv dev

    ```'
