  md: '# 16.2.5 The Permissions Mask


    As described in Section 1.17.1, a shell''s built-in umask (permissions mask) facility
    sets your default permissions. You should run umask in one of your startup files
    to make certain that any program you creates files with your desired permissions.
    However, you may wonder what the best choice is, especially if you have a stand-alone
    machine with no other users.

    The two reasonable choices break down as follows:


    +   **077** This is the most restrictive permissions mask; it does not give any
    other users access to new files and directories. This is appropriate on a multi-user
    system where you do not want other users to look at any of your files.

    **022** Gives other users read access to new files and directories. This is more
    useful than you may initially presume on a single-user system, because many daemons
    as pseudo-users would not be able to see and directories created with the more
    restrictive 077 umask.


    > NOTE *Certain applications (mail programs in particular) override the umask,
    changing it to 077 because they feel that their files are the business of no one
    but the file owner.*


    # 16.3 Startup File Order and Examples


    Now that you know what to put into startup files, it''s time to see some examples.
    Surprisingly, one of the most difficult and confusing parts of creating startup
    files is determining which of startup files to use. The next sections cover the
    two most popular Unix shells, bash and tsh.


    # 16.3.1 The Bash Shell


    In bash, you have these startup filenames to choose: .bash_profile, .profile,
    .bash_login, and .bashrc. Which one of these is appropriate to use for your command
    path, manual page path, prompt, aliases, and permissions mask? The answer is that
    you should have a .bashrc file symbolic linking to .bashrc.


    The reason for this setup is that there are several different kinds of bash shell
    instance types, as follows:


    **Interactive shell** This is the type of shell you use to run commands from a
    terminal. There are two subtypes of interactive shells:


    **Login shell** This is traditionally invoked by /bin/login; for example, when
    getty or sshd starts /bin/login. The exact circumstances that determine an interactive
    shell are a little strange (the first character of a login shell''s invocation
    name is a -), but the basic idea is that the login shell is an initial shell.
    When bash runs as a login shell, it looks for a user''s .bash_profile, .bash_login,
    and .profile files, running the first one that it sees.'
  merge: -1
  pgno: 325
- img_proc: true
  md: 'Non-login shell This is any other interactive shell. Windowing system terminal
    programs (xterm, GNOME Terminal, and so on) start-login shells unless you specifically
    ask for a login shell. bash reads from .bashrc upon startup of a non-login shell.


    Non-interactive shell This is a shell that doesn''t require input from a terminal.


    The reasoning behind the two different startup systems is that in the old days,
    users logged in through a traditional terminal with a login shell, started non-login
    subshells with windowing systems or the screen program. It was deemed a waste
    to repeatedly set the user environment and run all wasteful programs in these
    subshells. With login shells, you could run fancy startup commands in a file such
    as .bash_profile, leaving only aliases and "lightweight" things to your .bashrc.


    That''s a nice theory, but in these modern times, nearly everyone logs in through
    a graphical display manager that never starts a login shell. Therefore, you need
    to set up your entire environment (path, manual path, and so on) in your .bashrc,
    or you would never see any of your environment in your terminal windows. However,
    you also need a .bash_profile if you ever want to log in on the console or remotely,
    because these are login shells, and they don''t ever with .bashrc.


    None of the issues described in the previous two paragraphs matter, because it''s
    never a good idea to make a complicated mess of your startup files, and modern
    hardware is so fast that a little extra work for every new shell shouldn''t cause
    much of a performance hit.


    Here is a very elementary (yet perfectly sufficient) .bashrc that you can share
    with your .bash_profile:


    ```

    # Command path.

    PATH=/usr/local/bin:/usr/bin:bin:/usr/X11R/bin:$HOME/bin

    ```


    ```

    # Manual page path.

    MANPATH=/usr/local/man:/usr/man:/usr/X11R/man:$HOME

    ```


    ```

    # PS1 is the regular prompt.

    # Substitutions include:

    # \u username \h hostname \w current directory

    # \! history number \s shell name \$ if regular user

    PS1=\\$ ''

    ```


    ```

    # EDITOR and VISUAL determine the editor that programs such as less

    # and mail clients invoke when asked to edit a file.

    EDITOR=vi

    ```


    ```

    # PAGER is the default text file viewer for programs as man.

    ```'
