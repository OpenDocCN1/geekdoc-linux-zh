  md: 'noauth Specifies that the remote machine should not send you a-name and password;
    this is another option that you don''t want to forget.


    connect Initializes the serial port with the specified command, usually-a chat
    invocation like this:


    run ppp in non-daemon mode; this prevents the shell prompt from returning immediately
    after you run ppp from the command line. This is handy for debugging, because
    you can press CONTROL-C to interrupt a connection.


    mru size The maximum receive unit option tells the remote server not to send chunks
    of data larger than size. The default is 1500 bytes; 3000 works for faster connections.
    Do not set this (mtu) to a number lower than 1300, because many applications prefer
    that their data be sent in chunks.


    mtu size The maximum transmission unit option requests that your machine not send
    (transmit) any chunks of data larger than size to the remote server. The default
    is 1500 bytes. The quality of your telephone line or switch often determines how
    you may set size.


    name Forces Forcespp to use name as the username (or local system name) for PAP
    or CHAP authentication.


    remotename Forces ppp to use name as the remote system name for PAP or CHAP authentication.


    debug Activates verbose debugging.


    > NOTE If your connection frequently hangs or drops, and the ARQ light on your
    modem blinks-often, perhaps you have a poor switch or telephone line. If you hear
