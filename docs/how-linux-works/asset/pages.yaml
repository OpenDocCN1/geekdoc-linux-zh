  pgno: 114
- img_proc: true
  md: 'The most popular standard for single-machine Internet connectivity with a modem
    is PPP (Point-to-Point Protocol). Although PPP is a very flexible protocol, its
    main use is to connect one machine without a direct IP connection to second machine
    (a PPP server) that has, with the second machine asking the first for a username
    and password along the way.


    When you dial up and register for a PPP server, the server gives you your own
    IP address and tells you about its IP address. After the connection initiates,
    the PPP software on your machine knows how to reach your machine''s IP address.
    To reach the rest of the Internet, set the default gateway to the server''s IP
    address and let the server do the rest. Figure 5-2 shows the link between your
    local IP address and the server''s IP address. As with the routers in LANs, you
    do not need to worry about the server''s uplink address.


    ![](img/53fc0939e3ef3d3d769817a756ee3cbb_115_0.png)


    Figure 5-2: A typical PPP link.


    Although it''s nice to know how this process works, you are probably interested
    in actually getting a connection to work. Specifically, you want to know the answers
    to these questions:


    +   - How do I get my modem to dial the server''s number?

    - Where do I put my username and password?

    - How do I start and stop a network interface like ppp0?


    The key to the whole mess is a ppd, a system daemon that acts as an intermediary
    between a serial port on your machine and a PPP network interface as ppp0. To
    set up everything, you need to do four things:


    +   1. Verify that your serial port, modem, and login (username and password)
    work.

    2. Create an options file in /etc/ppp/peers containing configuration options.'
  merge: -1
