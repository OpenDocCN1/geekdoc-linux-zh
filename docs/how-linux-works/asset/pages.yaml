    # 2.4.4 Filesystem Buffering


    Linux, like other versions of Unix, buffers (caches) all requested changes to
    filesystems in memory before actually writing the changes to the disk. cache system
    is transparent to the user and improves performance because the kernel can perform
    a large collection of file writes instead of performing the changes on demand.


    When you unmount a filesystem with unmount, the kernel automatically synchronizes
    with the disk. At any other time, you can force the kernel to write the changes
    in its buffer to the disk by running the sync command. If (for whatever reason)
    you can''t unmount a filesystem before you turn off the system, make that you
    run sync first.


