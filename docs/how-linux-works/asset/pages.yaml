  md: '# 16.4 Default User Settings


    The best way to write startup files and choose defaults for new users is to experiment
    with a new user on the system. Create the test user with an empty home directory.
    Then, most importantly, refrain from copying your own startup files to the test
    user''s directory. Write the new startup files from scratch.


    When you think you have a working setup, log in as the test user in all possible
    ways (on the console, remotely, and so on). Make sure that you test as many things
    as possible, including windowing system operation and manual pages. After you''re
    happy with the test user, create a second test user, copying the startup files
    from the first test user. If everything works fine, you now have a new set of
    startup files that you can distribute to new users.


    The following sections outline reasonable defaults for new users.


    # 16.4.1 Shell


    The default shell for any new user on a Linux system should be bash. In the old
    days, the Bourne shell (sh) was more difficult to use in interactive mode than
    alternatives such as the C shell (csh), users typically had a login shell that
    was different from the standard system shell. This changed when bash arrived on
    the scene, for it had all the features of csh and its enhanced version (tcsh).


    There are good reasons for using bash on a Linux system:


    +   * interact with the same shell they use to write scripts (csh is a notoriously
    bad scripting tool; please, don''t even think about it).

    * bash is standard on Linux systems; tcsh

    * bash uses GNU readline, and therefore, its interface is identical to many other
    tools. tcsh has a powerful command-line editing system, but it takes some time
    to learn.

    * bash gives you finer control over I/O redirection and file handles.


    However, you can''t teach an old dog tricks, and many seasoned Unix users use
    csh and tcsh simply because they cannot switch to bash. Of course, you can choose
    any shell you like, but my opinion is that you should choose bash if you don''t
    have any preference, and you should also use bash as the default shell for any
    new user on the system (if they have another preference, they will be able to
    change their own shell with the csh command).


    > There are plenty of other shells out there (rc, ksh, zsh, es, and so on). But
    just because they exist does not mean they are suitable beginner shells.'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# 16.4.2 Editor


    The default editor should be vi or emacs. These are the only editors virtually
    to exist on nearly any Unix system, and they will therefore cause the least trouble
    in the long run for a new user.


    With shell startup files, avoid large default editor startup files. A little showmatch
    in the .virc startup file never hurt anyone, but steer clear of anything that
    significantly changes the editor''s behavior or appearance, such as the showmode
    feature, autoindentation, and wrap margins.


    # 16.4.3 Pager


    It is perfectly reasonable to set the default PAGER environment variable to less,
    because it is very easy to use.


    # 16.5 Startup File Pitfalls


    There are a few things you really should avoid in startup files (many have to
    do with the X Window System):


    +   - Don''t put X commands in a shell startup file.

    - Don''t set the DISPLAY environment variable in a shell startup file.

    - Don''t set the terminal type in a shell startup file.

    - Don''t skip on descriptive comments in default startup files.

    - Don''t run commands in a startup file that print to the standard output.

    - Never set LD_LIBRARY_PATH in a shell startup file (see Section 8.1.4).


    # 16.6 Further Startup Topics


    This book deals only with the underlying Linux system, which does not cover windowing
    environment startup files. This is a large issue indeed, because the display manager
    that logs you in to a modern Linux system has its own set of startup files such
    as .session, .xinitrc, and the endless mess of GNOME and KDE-related items.


    The windowing choices may seem bewildering, and this isn''t far from the truth,
    because there isnt even one common way to start a windowing environment in Unix.
    However, once you determine your system does, you may get a little carried away
    with the files that relate to your graphical environment. This is fine, but don''t
    carry it over to new users. The same tenet of keeping things simple in startup
    files works wonders for GUI startup files too.'
  merge: -1
  pgno: 330
