    traditional directory for locally installed software. Operating system upgrades
    /usr/local, so you won''t lose anything during an operating system upgrade.


    For small software installations, /usr/local is fine. However, if you have a lot
    of custom software installed, this can turn into a terrible mess. Thousands of
    odd files can make their way into the /usr/local hierarchy, and you may have no
    idea where the files came from.


    There are several schemes that help manage software packages. I like the Encap
