  md: "# 2.5.2 Using a File as Swap Space\n\nYou can also use a regular file as swap\
    \ space. It's not quite as fast as a swap partition, but if you're in a pinch\
    \ where you would be forced to repartition the disk to use a swap partition, using\
    \ a file as swap space works fine.\n\nUse these commands to create an empty file,\
    \ initialize it as swap, and add it to the swap pool:\n\n```\ndd if=/dev/zero\
    \ of=swap_file bs=1024k count=num_mb\nmkswap swap_file\nswapoff swap_file\n```\n\
    \nHere, swap_file is the name of the new swap file, and num_mb is the desired\
    \ size, in megabytes.\n\nTo remove a swap partition or file from the kernel's\
    \ active pool, use the swapoff command.\n\n# 2.5.3 How Much Swap Do You Need?\n\
    \nAt one time, the Unix conventional wisdom said that you should always reserve\
    \ at least twice as much swap as you have real memory. The enormous disk and memory\
    \ capacities now available cloud the issue. On one hand, disk space is so plentiful\
    \ that double the memory size may seem inadequate, the amount of disk space available.\
    \ On the other hand, you may never even dip into your swap space because you have\
    \ so much real memory. \n\nSome things never change, though. Reserve two to five\
    \ times as much disk space as you have real memory for swap. It doesn't make sense\
    \ to go any lower, because you may actually risk running out of memory. If you\
    \ go higher and actually intend to use all of this swap space, you will likely\
    \ suffer serious performance problems because the system will spend all of its\
    \ time swapping (a condition known as thrashing)."
