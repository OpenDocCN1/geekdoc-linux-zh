- img_proc: true
  md: 'Most Unix programs generate and report the same basic error messages, but there
    can be subtle differences between the output of any two programs. Here is an example
    that you''ll certainly encounter in some form or other (the error message is in
    boldface):


    ```

    $ ls /dsafdsa

    ls: /dsafdsa: No file or directory

    ```


    There are three components to this message:


    +   - The program name, ls. Some programs omit identifying information, which
    can be annoying when you are writing shell scripts, but it''s not really a deal.

    - The filename, /dsafdsa, which is a more specific piece of information. There''s
    some problem with this path.

    - The specific error, No such file or directory, indicates the problem with the
    filename.


    Putting it all together, you get something like "ls tried to open /dsafdsa couldn''t
    because it does not exist." This might seem kind of obvious, but these messages
    can get a little confusing when you run a shell script that includes an erroneous
    command under a different name.


    Always address the first error first. For example, some programs report that they
    can''t do something before reporting a host of other problems. For example, let''s
    say you run a fictitious program called scumd, and you see this error message:


    ```

    scumd: /etc/scund/config: No such file or directory

    ```


    Following this is a huge list of other error messages that looks like a catastrophe.
    Don''t let those other errors distract you. You probably just need to create /etc/scund/config.


    > NOTE Do not confuse error messages with warning messages. Warnings often look
    like errors, except that they contain the word "warning". A warning usually means
    something is wrong but the program will continue running anyway. To fix a problem
    noted in a warning message, you may have to hunt down a process and kill it before
    doing anything else (you''ll read about processes in Section 1.16).


    # 1.15.1 Common Errors


    Many of the errors that you will encounter in Unix programs result from things
    that can go wrong with files and processes. Here is the error message hit parade:'
