  md: '# #9


    # ## COMPILING SOFTWAREnFROM SOURCE CODE


    Most nonproprietary third-party Unix software packages come as source code that
    the administrator can compile and install. One reason for this tradition is that
    Unix has so many different flavors and architectures that it would be difficult
    to distribute binaries for all possible platform combinations. Widespread source
    code distribution throughout the Unix community encouraged users to contribute
    bug fixes and new features to the software, and eventually this gave rise to the
    term "open source."


    You can get everything you see on a Linux system as source code — this means everything
    from the kernel and C library to the Web browsers. It means it is possible to
    update and augment your entire system by (re-)installing parts of your system
    from the source code. However, you probably shouldn''t update your machine by
    installing everything from source code unless you really enjoy the process. Linux
    distributions provide easier means to update core parts of the system (such as
    the programs in /bin).'
  merge: -1
  pgno: 201
- img_proc: true
  md: 'Don’t expect distribution to provide everything for you. When you install binary
    packages from a distribution, you have no control over configuration options,
    including where the software goes. Some packages are not available as binaries,
    and furthermore, binaries will not necessarily match the shared libraries on your
    system (see Section 8.1.4).


    You should understand everything in Chapter 8 before proceeding with this chapter.
    Installing a package from source code usually involves the following steps:


    +   1. Unpacking the source archive.

    2. Configuring the package.

    3. Running make to build the programs.

    4. Running make install to install the package.


    # 9.1 Unpacking Source Packages


    A package’s source code distribution usually comes as a .tar.gz or .tar.bz2 file,
    and you should unpack the file as described in Section 1.18.


    Before you unpack, verify the contents of the archive with tar vf, because some
    packages don’t create their own subdirectories in the directory where you extract
    the archive. Output like the following means that the package is probably okay
    to unpack:


    ```

    package-1.23/Makefile.in

    package-1.23/README

    package-1.23/main.c

    package-1.23/bar.c

    ...

    ```


    However, you might see that not all of the files are in a common directory (like
    package-1.23 in the preceding example):


    ```

    Makefile

    README

    main.c

    ...

    ```


    Extracting an archive like this one can leave a big mess in your current directory.
    To avoid this, create a new directory and cd there before extracting the contents
    of the archive.


    Watch out for a test listing with absolute pathnames like this:


    ```

    /etc/passwd

    /etc/inetd.conf

    ```'
