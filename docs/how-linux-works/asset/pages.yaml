- img_proc: true
  md: '# Hard Disks: /dev/hd*


    These are the ATA (IDE) disks and partitions. All are block devices.

    Two example names are /dev/sda1 and /dev/hdb. The letter after hd identifies the
    disk, and the number represents the partition. A device without a number is a
    device for an entire disk. (Information on how to partition disks is in Section
    2.3.4. To connect disks to your current systems, start at Section 2.4.3.)


    # SCSI Disks: /dev/sd*


    SCSI disks carry the names /dev/sda, /dev/sdb, and so on, and the disks work much
    like their ATA counterparts, although the SCSI disk names do not directly correspond
    to a SCSI host controller and target. Linux assigns devices in the order that
    it encounters the disks.

    For example, if you have two SCSI controllers, scsi0 and scsi1, with disks at
    scsi0 target 0, 3, and scsi1 target 1, the device assignments are as shown in
    Table 2-1.


    # Table 2-1: Sample Device Assignments


    | Controller | Target | Device Assignment |

    | --- | --- | --- |

    | scsi0 | 0 | /dev/sda |

    | scsi0 | 3 | /dev/sdb |

    | scsi1 | 1 | /dev/sdc |


    This naming scheme can cause problems when reconfiguring hardware. Let''s say
    scsi1 target 3 explodes and you must remove the disk that the machine can work
    again. When you do so, scsi1 target 1 moves to /dev/sdb from /dev/sdc, and you
    have to change the fstab file (described later in this chapter).


    # Terminals: /dev/tty*, /dev/pts/*, /dev/*


    Terminals are for moving characters between the system and an I/O device, usually
    for text output to a terminal screen. The terminal device interface goes back
    a long way, to the days when terminals were typewriter-based devices.


    Pseudo-terminal devices are emulated terminals that understand the features of
    real terminals, rather than talk to a real piece of hardware, the kernel presents
    the I/O interface to a piece of software, such as a shell window.


    Two common terminal devices are /dev/tty1 (the first virtual console) and /dev/pts/0
    (the first pseudo-terminal device).

    The /dev/tty device is the controlling terminal of the current process. If a program
    is currently reading from and writing to a terminal, this device is a synonym
    for that terminal. A process does not need to be attached to a terminal.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Serial Ports: /dev/tty5*


    Serial ports are special terminal devices. You can''t do much on the command line
    with serial port devices because there are too many settings to worry about, such
    as baud rate and flow control.

    The port as COM1 on Windows is /dev/tty50, COM2 is /dev/tty51, and so on. For
    add-in modem modems, check the output of the dmesg command for the port assignment.


    # Floppy Disks: /dev/fd1*


    Section 11.1.1 covers operations on these block devices. The 3.5-inch floppy on
    most modern systems is /dev/fd0.


    # Parallel Ports: /dev/lp0, /dev/lp1


    These unidirectional port devices correspond to LPT1 and LPT2 in Windows. You
    can send files (as a file to be printed) directly to a parallel port with the
    cat command, but you might need to give the printer an extra form feed or reset
    afterwards.

    The bidirectional parallel ports are /dev/parport0 and /dev/parport1.


    # Audio Devices: /dev/dsp, /dev/audio, /dev/mixer, /dev/snd/*, etc.


    Linux has two different sets of audio devices. There are separate for the OSS
    (Open Sound System) and the newer ALSA (Advanced Linux Sound Architecture) system
    interface. Linux systems that ALSA usually contain compatibility devices, because
    most applications use OSS. Some rudimentary operations are possible with the dsp
    and audio devices that belong to OSS. As mentioned earlier, the computer plays
    WAV file that you send to /dev/dsp. However, it may not sound right due to frequency
    mismatches. The ALSA devices are in the /dev/snd directory, but you can''t do
    much by respecting standard I/O to.


    > The play andplay programs can play samples from the command line. To adjust
    the volume and mixer settings, amixmixer and alsixer are available on most systems.


    # 2.3.3 Creating Device Files


    To create one individual device file, use mknod. You must know the device name
    as its major and minor numbers. For example, if you remove /dev/hda2 by accident,
    you can create it again with this command:


    ```

    mknod /dev/hda2 3 2

    ```


    The b3 2 specifies a block device with a major number 3 and a minor number 2.
    For character or named pipe devices, use c or p instead of b.

    The mknod command is useful only for creating the occasional missing device or
    named pipe. As you upgrade your system and add device drivers, you may need to
    create entirely new groups of devices. Because there are so'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'many devices, it''s better to use the MAKDEV program (found in /dev) to create
    groups of devices. Device groups can be named after the common part of several
    device names, such as hda, hdb, or they can have a completely separate name, such
    as std-hda. For example, to create all devices beginning with hda, run this command:


    ```

    /dev/MAKDEV hda

    ```


    The MAKDEV command is harmless if the devices already exist on your system.


    # devfs

    Before you go to the trouble of making any device files, you should see whether
    you''re running devfs, an automatic device-file generation system. The easiest
    way to check for devfs is to run mount and look for devfs in the output.

    If your system runs devfs, you should not have to create missing device files
    because the kernel maintains the directory of available device files. Linux kernels
    typically configure devfs at boot time, a special auxiliary program called devfsd
    that gives the administrator the ability to customize the device system.


    > devfs was an experimental feature in older Linux kernels, but is classified
    as obsolete in the latest Linux kernels.


    # 2.3.4 Partitioning Disk Devices


    Before you can use a new disk on your system, you need to know how to partition
    with your devices. If you''ve never worked with partitions before, don''t worry.
    A partition is just a piece of the disk dedicated to one purpose, such as a specific
    directory tree. On PCs, partitions have numbers starting at 1.

    To started, identify the disk that you want to partition. Most PCs have two interfaces,
    called primary and secondary interfaces, and each interface can have a master
    and slave disk, for a total of four devices. The standard ATA assignments are
    as follows:


    +   * /dev/hda Master disk, primary interface

    * /dev/hdb Slave disk, primary interface

    * /dev/hdc Master disk, secondary interface

    * /dev/hdd Slave disk, secondary interface


    There are several partitioning utilities, but the most simple and direct is fdisk.
    To get started, run fdisk (where dev is one of the devices listed above), then
    print the current partition list with p.

    Here is sample from fdisk output for a device with three partitions, two containing
    filesystems and one with swap (see Section 2.5 for more information on swap partitions).'
