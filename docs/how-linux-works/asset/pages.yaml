    # 5.10 Ethernet Networks


    Ethernet is by far and away the most popular physical medium for local area networks.
    Although there have been several kinds of cables, cable topologies, connectors,
    and speeds in Ethernet history, the basic hardware, protocol specification, and
    programming techniques have proved remarkably robust. Figure 5-3 on the next page
    shows the physical appearance of an Ethernet network.


