  md: 'You should know how to use the mtmp command to create temporary filenames.
    Here is a script that shows what device interrupts have occurred in the last two
    seconds:


    ```

    #!/bin/sh

    TMPFILE1=mktmp /tmp/im1.XXXXX

    TMPFILE2=mktmp /tmp/im2.XXXXX


    cat /proc/interrupts > $TMPFILE1

    sleep 2

    cat /proc/interrupts > $TMPFILE2

    diff $TMPFILE1 $TMPFILE2

    rm -f $TMPFILE1 $TMPFILE2

    ```


    The argument to mktmp is a template. mktmp converts a set of characters and creates
    an empty file with name (without the XXXXX, fails). This script uses variable
    names to store the files, so that you only have to change one if you want to change
    a filename.


    **NOTE** Not all Unix flows come with mktmp. If you''re having portability problems,
    you might want use the $$ special variable to construct a temporary filename based
    on the process ID.


    Another problem is that scripts leave temporary files are vulnerable to signals
    that abort the script and leave temporary files behind. In the preceding example,
    pressing CONTROL-C the second cat command leaves a temporary file in /tmp. You
    want to avoid this if possible. Use the trap command to create a signal handler
    to catch the signal CONTROL-C generates. The handler removes the temporary files:


    ```

    #!/bin/sh

    TMPFILE1=mktmp /tmp/im1.XXXXX

    TMPFILE2=mktmp /tmp/im2.XXXXX

    trap "rm - f $TMPFILE1 $TMPFILE2; exit 1" INT

    ```


    Notice that you must exit in the handler to explicitly script execution. Otherwise,
    the shell continues running as usual after running the signal handler.


