  md: "```\nfor filename in *; do\nif [ -f $filename ]; then\n  ls -l $filename\n\
    else\n  echo $filename is not a regular file.\nfi\ndone\n```\n\nYou can invert\
    \ a test by placing the ! operator before the test. For example, [ -f file ] returns\
    \ true if file is not a regular file. Furthermore, the -and -o flags are and and\
    \ operators (for example, [ -f file1 -a file2 ]).\nThere are dozens of tests that\
    \ fall into three general categories: files, string tests, and arithmetic tests.\
    \ The info pages complete online documentation, but the test(1) manual page is\
    \ also a fast reference. The following sections outline the main tests (some of\
    \ the less common tests have been omitted).\n\n# File Tests\n\nMost file tests,\
    \ -f, are called unary operations which require only one argument — the file to\
    \ test:\nHere are two important file tests:\n\n+   -e Returns true if a file exists\n\
    -s Returns true if a file is not empty\n\nSeveral operations inspect a file's\
    \ type, meaning that they can determine whether something is a regular file, a\
    \ directory, or some kind of special device. Those operations are listed in Table\
    \ 7-1. There are also a number of unary operations that check a file's permissions,\
    \ as listed in Table 7-2 on the next page (Section 1.17 for an overview of permissions).\n\
    \n# Table 7-1: File Type Operators\n\n| Operator | Tests For |\n| -f | Regular\
    \ file |\n| -d | Directory |\n| -h | Symbolic link |\n| -b | Block device |\n\
    | -c | Character device |\n| -p | Named pipe |\n| -s | Socket |\n\nExcept for\
    \ -h, test follows symbolic links. That is, if link is a symbolic link to a file,\
    \ [ -f link ] returns an exit code of true (0)."
