- img_proc: true
  md: '# Bus Options


    You shouldn''t change the bus options for most systems. Unless you have an extremely
    old or odd system, include PCI support (and if you''d like to list and diagnose
    devices on the PCI disk, install lspci, which is part of the pci-utils package).


    You should enable the Support for hot-pluggable devices so that your system can
    take appropriate action when you attach and remove devices.


    Newer kernels include base PCCMIA (PC Card/CardBus) drivers as configuration options
    in this menu — in previous systems, PCCMIA support was completely separate from
    the main kernel distribution. You still need the PCCMIA if you intend to use PC
    cards, and at the moment, you can still leave out PCCMIA kernel support here and
    get it from these utilities, but this may change in the future.


    # Executable Formats


    To start a process from an executable file on the disk, the kernel needs to know
    how to load the executable file, how to initialize the process in memory, and
    where to start running the process. An executable''s file format determines these
    characteristics. Most binaries on a modern Linux system are ELF (Executable and
    Linkable Format) files. You probably do not need to support the “a,out” executable
    format (you may not even have the shared libraries to support these binaries),
    but it does not take too much memory to include support, and you can build it
    as a module.


    # Device Drivers


    Configuring device drivers is a long process due to the wide variety of devices
    that Linux supports. Unfortunately, it''s during this stage that you can get bogged
    down with all of the options and end building a kernel that is not too large because
    you included drivers for devices that you will never have. If you''re in doubt
    about whether you are going to use any particular driver (other than a disk driver),
    build it as a module so that it does not unnecessarily up kernel memory.


    The following sections describe the driver configuration options the Device Drivers
    menu.


    # Plug and Play Support


    You must enable Plug and Play support if you want any reasonably modern built-in
    hardware in your computer to work. You may also need plug-and-play support in
    order to use network cards, internal modems, and sound cards.'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Block Devices


    The Block devices section of the kernel configuration contains miscell-aneous
    random-access storage devices, such as floppy disks and RAM disks. These devices
    normally hold filesystems that you directly attach to your current system with
    the mount command. The interesting drivers here include the following:


    +   * **Normal floppy disk support** A driver for the PC floppy disk drive.

    * **Loopback device support** A simple driver that maps a file into a block device.
    This driver is very useful it allows you to mount a filesystem on a disk image.

    * **Network block device support** A driver that allows you to use a network server
    as disk space.

    * **RAM disk support** A driver that designates a chunk of physical memory

    * **Initial RAM disk (initrd)** A driver that provides a special kind of RAM disk
    that a boot loader gives to the kernel as the initial / partition during the very
    first stages of init. Many distributions use an initial RAM disk for SCSI drivers
    and other modules that may not be in your kernels.

    * **Parallel port IDE device support** A driver for certain older portable disk
    devices.


    # ATA (IDE) Support


    You should always compile ATA (IDE) support directly into your kernel unless you
    know exactly what you''re doing. There are several kinds of IDE drivers that you
    can enable:


    **Disk support** A driver required if you want hard drives to work. Needless to
    say, you should compile this driver directly into the kernel.


    **CD-ROM support** A driver for ATAPI CD-ROM and DVD-ROM drives.


    **Floppy support** A driver for removable-media drives with an ATA interface.


    **SCSI emulation** A driver for ATAPI CD-R and CD-RW drivers. Older Linux CD-burning
    software worked exclusively with SCSI drivers; if your CD-burning software is
    up to date, you do not need this driver.


    **Variable chipsets** Drivers for various specific chipets. If your motherboard''s
    IDE chipset is listed, you might be able to squeeze out a little performance with
    one of these drivers.


    # SCSI Support


    Even if you have no SCSI devices, you may still need SCSI support because many
    Linux device drivers work through emulated SCSI devices. For example, if you want
    to use USB mass storage, you need need SCSI disk support.'
  merge: -1
