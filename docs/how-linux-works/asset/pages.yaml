  md: '# 11.1.2 Low-Level Formatting the Floppy Disk


    If you absolutely need to write to a floppy disk, but you keep getting I/O errors,
    you can try to format a disk with the superformat program (which is part of the
    fduutils package) or with fdformat.


    # 11.2 CD Writers


    Linux CD burning programs work with ATAPI devices and generic SCSI devices, such
    as /dev/hdc and /dev/sgo. The most popular command-line recording utility for
    Linux is named cdrecord.

    Most CD burners on the market are ATAPI devices. At one time, supported these
    devices with an IDE-to-SCSI emulation driver ide-scsi. However, with Linux kernel
    version 2.6, this is no longer necessary, and the ide-scsi driver may not work
    well in newer kernel releases.


    # 11.2.1 Verifying the Hardware


    Before writing to a CD, you should verify that the CD recorder drive exists and
    determine its device name and specification. For IDE devices, locating the device
    is easy; just use the standard device name for the entire disk (for example, /dev/hdc
    see Section 2.3.4 for more information).

    You can verify the existence and identity of a device with the -inq option to
    cdrecord. For example:


    ```

    cdrecord -inq dev=device

    ```


    If there is an ATAPI device at device, the output of the cdrecord -inq command
    looks like this:


    | Device type | : Removable CD-ROM |

    | --- | --- |

    | Version | : 0 |

    | Response Format: : 1 |

    | Vendor_info | : ''PLESTOR '' |

    | Identifikation : ''CD-R PX-W4012A'' |

    | Revision | : ''1.01'' |

    | Device seems to be: Generic mnc CD-RW. |


    You can search for a SCSI CD recorder device with this command:


    ```

    cdrecord -scanbus

    ```


    The output should look something like the following:'
