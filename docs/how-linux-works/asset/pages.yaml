- img_proc: true
  md: '# Using the SMB Filesystem


    If you need frequent access to files on a Windows server, you can attach the share
    directly to your system with the smbmpoint command:


    ```

    smbount ''\SERVER\sharename\'' -c mountpoint -U username -P password

    ```


    To use this command, you must have the smbfs kernel driver loaded as a module
    or directly compiled into the kernel. In addition, the rest of the Samba programs
    should be in your path. By default, a Samba installation built from source code
    does not include the smbmount command. You must specify --smbmount when running
    the Samba configure script to create these extras programs.


    # 14.6.2 Printing to a Windows Share


    The easiest way to print to a Windows SMB share is through CUPS. Follow these
    steps to get a printer working:


    +   1. Put the CUPS SMB backend in place. Find the smspool program in your Samba
    distribution, and then create a symbolic link named smb in the backend directory
    to smspool, like this:


    ln -s smspool_path/smspool cups_prefix/lib/cups/backend/smb

    2. Restart CUPS.

    3. Run lpinfo -v to confirm that the SMB spooler is in the available backends.
    You should see this in the output:


    network smb

    4. Add a new printer as outlined in Chapter 12. If you don''t need a password
    to access the printer, use the following as the printer device path (notice the
    backslashes are forward slashes in CUPS):


    smb://SERVER/sharename

    If you need a username and password, add them to the front of the server:


    smb://username:password@SERVER/sharename

    If your target printer is in a different Windows workgroup, you can specify the
    workgroup in the first part of the name:


    smb://username:password@WORKGROUP/SERVER/sharename'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# Sending Files Directly to a Printer Share


    If you have a file that is suitable for a printer (such as a PostScript file that
    you want to send to a PostScript printer), you can send it directly to the printer
    share with this smbclient variant:


    ```

    smbclient ''\\SERVER\sharename'' -u username < file

    ```


    This command is particularly useful when testing and troubleshooting printers.
    Working with CUPS and Samba simultaneously can be difficult, if you find yourself
    running into trouble when trying to access a printer on a Windows system, try
    going through these steps:


    +   1. Use the Windows system to print a test document to a file, then transfer
    file to your Linux system.


    +   2. Run the command in the preceding example to attempt to print the test file.


    +   3. If the file does not print, you have a problem on the Samba side. Otherwise,
    the problem lies with CUPS.'
  merge: -1
