  md: "# 1.18.1 Compressed Archives (.tar.gz)\n\nMany ግን find it confusing that archives\
    \ normally come compressed, where the archive file ends in .tar.gz. To unpack\
    \ a compressed archive, work from the right side to the left; rid of the .gz first\
    \ and then worry about the .tar. For example, these two commands decompress and\
    \ unpack file.tar:\n\n```\ngunzip file.tar.gz\ntar xvf file.tar\n```\n\nWhen you're\
    \ starting out, it's fine to do this one step at a time, first running gunzip\
    \ to decompress and tar to verify and unpack. When you do enough, you soon memorize\
    \ the entire archiving and compression process. However, this is not the fastest\
    \ or most efficient way to invoke tar on a compressed archive. In particular,\
    \ it wastes system resources — disk space and kernel I/O.\n\nYou can combine archival\
    \ and compression functions with a pipeline; for example, this command pipeline\
    \ unpack file.tar.gz:\n\n```\nzcat file.tar.gz | tar xvf -\n```\n\nzcat is such\
    \ a common as gunzip -dc. The -d option decompresses and the -c option sends the\
    \ result to standard output (in this case, to the command).\nBecause this is such\
    \ a common operation, the version of tar that with Linux has a shortcut. You can\
    \ use z as option to automatically invoke gunzip on the archive. For example,\
    \ use ztvf file.tar.gz to verify a compressed archive. However, for the sake of\
    \ learning, you should make an effort to master the longer form before taking\
    \ the shortcut.\n\n> NOTE\n\n\0A .tgz file is the same as a .tar.gz file. The\
    \ name is meant to fit into FAT (MS-DOS\nbased filesystems).\n\n# 1.18.2 Other\
    \ Compression Utilities\n\nA newer compression program gaining some popularity\
    \ is bzip, where compressed files end with .bz. Marginally slower than gzip, compresses\
    \ files a little more, and is increasingly popular in the distribution of source\
    \ code. The decompressing program is bzip2, and the options of both components\
    \ are close enough to gzip that you don't need to learn anything new.\n\nMost\
    \ Linux distributions with zip and unzip programs compatible with the ZIP archives\
    \ on Windows systems. They work on the usual .zip files as well as self-extracting\
    \ archives ending in .exe.\n\nIf you encounter a file that ends in .Z, you have\
    \ found a relic created by the compress program, once the Unix standard. gunzip\
