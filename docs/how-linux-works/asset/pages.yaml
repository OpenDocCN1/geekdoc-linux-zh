  md: '# 4.11.1 Real UID and Effective UID


    When changing user IDs with programs like sudo, keep in mind that there is more
    than one active user ID in a running program. The ID that controls your access
    rights is the *effective* user. When you run a setuid program, Linux sets the
    effective user ID to the program’s owner during execution, but it keeps your original
    user ID in what is called a *real* user ID.


    There is an additional *saved* user ID that is set to the program’s owner when
    you run a setuid program. The idea is that a process can switch its effective
    user ID to the real or saved user ID during execution to perform different tasks
    as different user IDs.


    The reason that you might see different user IDs is that, by default, sudo changes
    the real user ID along with the effective and saved user IDs. Some programs do
    not like to have a real user ID of root. If you do not want sudo to change the
    real user ID, add this line to your /etc/sudoers file:


    ```

    Defaults    stay_setuid

    ```'
