    \ 10.32.45.25 and 10.3.2.3. Put the servers in your system's /etc/resolv.conf\
    \ file like this:\n\n```\nsearch mydomain.example.com\nnameserver 10.32.45.25\n\
    nameserver 10.3.2.3\n```\n\nThe search line in the preceding example asks the\
    \ resolver to look for the IP\naddress of host.mydomain.example.com, and for host.example.com\
    \ if you ask for an\nincomplete domain name host that does not resolve on the\
    \ first attempt.\nFor a simple network configuration where you do not have control\
    \ of\nyour nameserver, there is little else to know about DNS except how to\n\
    sake that your machine's hostname resolution works. To verify this,\ntype host\
    \ known_name where known_name is some Internet name that you\nexists (such as\
    \ with example.com). The output should be something\nlike this:\n\nknown_name\
    \ has address 10.218.44.5\n\nYou should also be able to look up a name based on\
    \ its IP address with\nhost address. If the owner is doing their part, you should\
    \ get the\nhostname corresponding to address, but DNS administrators often do\n\
    configure their servers to return these hostnames. Furthermore, the\nmapping of\
    \ hostname to address is not one-to-one; you can have many\nhostnames for a single\
    \ address.\n\nBefore moving on, take a look at /etc/nsswitch.conf. It should have\
    \ a\nline like this:\n\n```\ndns\n```\n\nPutting files ahead of dns here ensures\
    \ that your system checks the /etc/hosts\nfile for the hostname of your requested\
    \ IP address before asking the DNS\nserver. This is usually a good idea (especially\
    \ for looking up localhost), but\nyour /etc/hosts file should be as short as possible.\
    \ Don't put anything in there\nbecause you want to boost performance; it will\
    \ burn you later."
