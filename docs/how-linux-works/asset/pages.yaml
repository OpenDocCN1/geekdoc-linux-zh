  md: '+   - include Holds header files used by the C compiler (see Section 8.1.2).

    - info Contains GNU info pages (see Section 1.13).

    - local Where administrators can install their own software. Its structure should
    look like that of and /usr.

    - man Contains manual pages. Unformatted pages go here (according to the numbered
    category described in Section 1.13), and human-readable formatted pages go in
    cat*.

    - share Contains files that should work on other kinds of Unix machines with no
    loss of functionality. That''s the theory, anyway; a true directory becoming rare
    because there are no space issues on modern disks. It is often more of a pain
    to maintain a share directory than it is worth. In any case, man, info, and some
    other subdirectories are often found.

    - X11 Holds the core Linux windowing software, called XFree86. However, the custom
    configuration files for your computer are usually in /etc/X11.

    - dict An oddball subdirectory containing dictionaries; /usr/dict/words is one
    such dictionary file.


    # 2.2 The Kernel


    You know what the Linux directory structure looks like. Before going on to devices
    and filesystems, you must learn some higher-level concepts about the kernel.

    The *kernel* of an operating system is the core of a running system. It''s a very
    special program that manages all processes, device drivers, and I/O. When the
    system boots, the kernel runs first, initializing hardware and internal data structures.
    After the kernel completes this stage, it loads and starts the init program.

    The kernel has many functions once the system boots. Process and device management
    are the most important. The idea is that although computers with one CPU run only
    one program at a time, the kernel can keep several programs in memory at the same
    time. Process and device management run together in a cycle like this:


    +   - The kernel has control of the processor. There are several processes in
    memory.

    - The kernel selects a process and finds out that process was last running.

    - The kernel relinquishes control of the processor to that process.

    - That process runs for a few microseconds.

    - When the time is up, a clock interrupt stops the process and gives control back
    to the kernel.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '6. The kernel takes care of any system work that it needs to do, such as reading
    to and from devices.


    7. Go to step 2.


    Description of the kernel''s work is somewhat simplified, but as you can see,
    there is nothing magic about the kernel. It is not a process; it is just a piece
    of code that runs every now and between processes.


    On Linux systems, the kernel is normally in a file called /vmlinuz or /boot/vmlinuz.
    A boot loader loads this file into memory and sets it in motion when the system
    boots. Details on how to configure the boot loader and how to create a Linux kernel
    are in Chapters 3 and 10.


    If you are interested in the detailed workings of a kernel, the classic textbook
    is Operating System Concepts |Silberschatz].


    # 2.3 Devices


    You will find it easy to manipulate devices on a Unix system because the kernel
    normally presents the device I/O interface to system and user processes as files.
    Not only can a programmer use regular file operations to work with a device, but
    some devices are also accessible to standard programs like cat, so you don''t
    have to be a programmer to use them. Linux uses the same design of device files
    as other Unix flavors, but device filenames and functionality vary among factors.


    Linux device files are in the /dev directory, and running /dev reveals that there
    are more than a few files in /dev. So how do you work with devices? To get started,
    consider this:


    ```

    echo blah blah /dev/null

    ```


    Like any command with redirected output, this sends some stuff on the standard
    output to a file. However, the file is /dev/null, a device, and the kernel decides
    what to do with any data written to this file. In the case of /dev/null (/dev/null
    a bucket). Of course, other devices actually do things, such as /dev/dsp, which
    plays a sound if you send appropriate output there (for example, cat blab.wav
    > /dev/dsp).


    To identify a device, use -l to get a long list and look at the permissions. Here
    are four examples:


    | brw-rw---- 1 root disk 65 Jul 20 1998 hdb1 |

    | crw-rw-s-- 1 root 1 3 Jul 20 1998 null |

    | prw-r--r-- 1 root 0 Mar 3 19:17 gpmdada |

    | srw-rw-rw- 1 root 0 Dec 18 07:43 log |'
