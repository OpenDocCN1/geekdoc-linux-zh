  md: 'Most manual pages concentrate primarily reference information.

    They may contain some examples and cross-references, but that''s about it.

    Don''t expect a tutorial, and don''t expect an engaging literary style. For programs
    with many options, the manual page often lists the options in some systematic
    way (for example, alphabetical order). It won''t bother to tell you what the important
    ones are. If you are patient, you can usually find what you need to know. If you''re
    excessively impatient, ask a friend, or pay someone to search for your friend
    so you can ask them.


    To search for a manual page by keyword, use the -k option:


    ```

    man -k keyword

    ```


    This is helpful if you don''t quite know the name of the command that you want.


    **NOTE** If you have any additional questions about any of the commands described
    in the previous sections, you can find the answers with the man command.


    Manual pages fall into numbered sections. When someone refers to a manual page,
    the section number appears in parentheses next to the name — ping(8), for example.
    Table 1-3 explains the section numbers:


    # Table 1-3: Online Manual Sections


    | Section | Description |

    | 1 | User commands |

    | 2 | Low-level system calls |

    | 3 | Higher-level Unix programming library documentation |

    | 4 | Device interface and driver information |

    | 5 | File descriptions (system configuration files) |

    | 6 | Games |

    | 7 | File formats, conventions, and encodings (ASCII, suffixes, and so on) |

    | 8 | System commands and servers |


    Sections 1, 5, 7, and 8 are good supplements to this book. Section 4 may be of
    marginal use. Section 6 would be great if it were a little larger.

    You can select a manual page by section. This is sometimes important because man
    displays the first manual page that it finds for a particular search term. For
    example, if you want to see the /etc/passwd file description (as opposed to the
    passwd command), you can insert the section number before the name:


    ```

    man 5 passwd

    ```'
