    | 7 | 64.159.1.38 | 55.642 ms | 55.625 ms | 55.663 ms |

    | 8 | 209.247.10.230 | 55.89 ms | 55.617 ms | 55.964 ms |

    | 9 | 209.244.14.226 | 55.851 ms | 55.726 ms | 55.832 ms |

    | 10 | 209.246.29.174 | 56.419 ms | 54.44 ms | 56.423 ms |


    Because this output shows a big latency jump between hop 6 and hop 7, that of
    the route is probably some sort of long-distance link.


    You can use these ICMP tools to use when setting up a working interface, as in
