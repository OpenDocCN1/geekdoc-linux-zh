  md: '# Answers to Review Questions


    +   1. A. A notebook is a mini-notebook, and it is the most portable. Servers
    and desktop PCs are not very portable, requiring disconnecting and moving several
    components including monitor, keyboard, and mouse.


    +   2. B. A server is very much a desktop PC and has both a monitor and a mouse;
    the main difference is that it runs a server version of the operating system.
    Servers tend to have more RAM than desktop PCs, but this is not a hard-and-fast
    rule.


    +   3. C. A smartphone has the easy portability of a cell phone with Internet
    capabilities. Servers and desktops are not easily portable. A notebook is portable
    but not always have Internet access available to it.


    +   4. B. A full-tower case provides the largest number of drive bays of any type
    case.


    +   5. D. A thermally advanced chassis is a case designed to keep the system cool
    by efficiently flowing air through the case through a system of air vents and
    fans.


    +   6. B. 230v is the standard for countries in the European Union (EU). 120v
    is appropriate for the USA. There are no countries that use 150v or 350v.


    +   7. A. Digital Video Interface (DVI) is a monitor connector. PCI is a type
    of motherboard bus. CPU is the central processing unit (the processor). ATA is
    a standard for hard disks.


    +   8. B. The USB Standard B is the one that plugs into a printer. USB Standard
    A plugs into a computer. Mini and micro connectors are used for smaller devices,
    such as cell phones and digital cameras.


    +   9. C. USB 2.0 is also known as High Speed, and it transfers data up to 480
    Mbps. Refer to Table 4.1 for the other types of USB connectors and their speeds.


    +   10. D. FireWire is a very fast connection, so it is often employed by devices
    that need to move a lot of data, like a video camera. Printers, mice, and keyboards
    most use USB connection.


    +   11. C. Purple PS/2 connectors are for keyboards. Green ones are for mice.
    Printers and video cameras do not use PS/2 connectors.


    +   12. A. A DB9 connector is a 9-pin female connector. The M stands for male,
    meaning it has pins rather than holes.


    +   13. C. A DB25 female connector on a computer is designed for an old-style
    printer connection. A mouse keyboard would use a USB or PS/2 connection. A monitor
    might use a VGA, a DVI, or an HDMI connection.


    +   14. D. A DB15 female connector on a computer is for a VGA monitor connection.
    A VGA connector has three rows of holes in a D-shaped connector.


    +   15. B. An RJ-11 jack, which is an ordinary phone jack connector, is used for
    a dial-up modem. A DB15F connector is a VGA connector for a monitor. RJ-45 is
    for Ethernet networking. PS/2 is used for an older keyboard or mouse.'
