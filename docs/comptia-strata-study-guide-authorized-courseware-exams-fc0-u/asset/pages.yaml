  md: '# Internet Connections


    Not sure if you have a built-in dial-up modem in your computer? On a desktop PC,
    a built-in modem is indicated by two telephone jacks, side by side. On a notebook
    PC, there is typically just one telephone jack for the modem. Look closely, a
    wider-than-normal jack looks like it''s for a telephone cord is actually for an
