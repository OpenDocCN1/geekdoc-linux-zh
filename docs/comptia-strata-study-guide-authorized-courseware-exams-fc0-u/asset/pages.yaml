  md: '# 384 Chapter 10 • Safe, Legal, and Green Computer Usage


    system can save money by not having to run separate telephone wires through its
    building, and it can also save energy by not having to maintain a phone system
    separate from its network and Internet connectivity.


    A VoIP system can also save on hardware costs. A single switch can be used to
    administer both Internet and telephone services. And employees who work primarily
    on the phone at a computer can work from headsets that plug directly into the
    computer''s sound card, eliminating the need for a separate telephone for each
    employee.


    # Telecommuting


    Telecommuting refers to employees working from home rather than reporting to an
    office every day. Telecommuting can provide a company with tremendous energy savings
    because it doesn''t have to maintain office space (including lighting, heating,
    and cooling) for all of its workers. Employees also save money because they don''t
    have to travel from home to office every day, and the reduced reliance on transportation
    systems helps to reduce fuel emissions. Telecommuting can also increase worker
    satisfaction, leading to a lower attrition rate.


    # Summary


    In this chapter, you learned how to make your computing experience safe, legal,
    and environmentally responsible. You learned how to dispose of hazardous substances
    safely, including cleaning supplies, circuit boards, monitors, and batteries.
    You also learned about some IT-related laws applicable to the EU and the U.K.
    The chapter also covered how to make personal computers and servers more efficient
    via power-management plans and power-conserving hardware, and by combining server
    functions. Finally, you learned about some business-related energy-conservation
    policies such as cloud computing, VoIP, and telecommuting.


    # Exam Essentials


    Recognize IT-related laws and guidelines. For the U.K. version of the Strata exams,
    you need to know about several pieces of IT-related legislation: the Data Protection
    Act, Copyright Act, Computer Misuse Act, and Freedom of Information Act.


    Dispose of materials properly. Almost all electronics contain lead and should
    be recycled or taken to a hazardous-waste disposal facility. Batteries should
    also be recycled because of the metals they contain. Placing items containing
    heavy metals in regular trash pollutes the environment unnecessarily. Some cleaning
    supplies should also require special disposal; see a substance''s MSDS for details.'
