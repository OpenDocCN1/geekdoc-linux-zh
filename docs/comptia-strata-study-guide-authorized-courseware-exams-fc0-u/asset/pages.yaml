  md: '# Setting Up a Printer


    Most printers today use a USB connection. Any full-size USB cable and port will
    work, but the fastest performance will come with a USB 2.0 or higher cable.


    USB is a Plug and Play interface. Then when you connect the printer to the computer,
    the computer will likely recognize the printer automatically and set it up for
    you. However, having the printer automatically set up isn''t always a good thing!
    Some printers with their own special software that makes them easier to use, and
    multifunction printers with special software that enables their features like
    faxing, scanning, and copying. If you allow Windows to auto-install the printer
    via Plug and Play, you may miss out on some of these features. Therefore, the
    instructions that with some printers specify that you should run the setup first,
    and then connect the printer only when specifically told to do during the setup.


    Older printers use a parallel printer interface. A parallel printer cable connects
    to a 25-pin parallel connector, also called the LPT port, on the PC. (Most PCs
    today don''t have this connector.) When the other end of the parallel printer
    cable is a 36-pin Centronics connector that connects to the printer. (Centronics
    is a brand and type of connector that uses a plastic wrap with metal tabs. Figure
    3.1 shows a Centronics connector.) This type of connector isn''t Plug and Play,
    and the computer must be off in order for it to be connected or disconnected.


    FIGURE 3.1 Centronics connector on an old parallel printer interface


