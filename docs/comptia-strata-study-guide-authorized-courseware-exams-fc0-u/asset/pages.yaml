    # Setting Up a Computer


    As a Strata-certified computer user, you should be able to take a new computer
    out of its boxes and set it up. Doing so mainly consists of being to plug the
    cables for the various components into the right sockets on the back of the computer.
    In the following sections, you''ll learn about some of the basic connector types
    you may encounter, and well as how to evaluate voltage and power requirements
    and how to turn on and use the PC and its peripherals.


    # Desktop Computer Form Factors


    The case of a desktop computer is the big rectangular box to which everything
    else connects. There are different sizes and shapes of cases. A case''s size and
    orientation is called its form factor.

    Almost all computers these days are towers, which means they''re taller than they
    are wide or deep. A full tower is one that has lots of expansion bays for drives
    (like CD or DVD drives). There''s no official standardization as to how many bays
    a case has to have'
