    BD See Blu-ray disc.


    binary A numbering system with only two states: 0 or 1 (on or off).


    biometric devices Devices that identify users by scanning for one or more physical
    traits, as fingerprints or retina.


    bit A binary digit, either 0 or 1.


    bits per second A measurement of data transfer throughput.


    Blue Screen of Death (BSOD) A short-range networking protocol, separate from Wi-Fi,
    also known as IEEE 802.15. It''s used for cell phones, home theatre devices, and
    gaming consoles.


    Blu-ray disc (BD) An optical disc that uses Blu-ray technology and is read with
    a blue laser.


    bps Bits per second.


    broadband A wide pathway capable of carrying data at a high rate of speed, such
    as over the Internet.


    broadband router A router used to help share Internet connectivity. It may come
    with software, instructions, or other extras.


    brownout See sag.


    browser cache A holding area on the disk that maintains a copy of the files required
    to display web pages you visited. When you revisit a page, the browser may be
    able to reload files from the stored cache.


    BSOD See Blue Screen of Death.


    bubble jet See thermal inkjet printer.


    buffer A simple version of a cache, holding recently used data in case it''s needed
    again.


    bus width The Width of the data pathway.


    byte Eight binary digits of data.'
