    # A Previously Working Application Won''t Work Anymore


    If an application stops working that previously worked, something has changed
    on your system—obviously. But what was it?


    If any of the files belonging to the application have been deleted, you may need
    to reinstall the application. To save yourself some time, though, look in the
    Recycle Bin first'
