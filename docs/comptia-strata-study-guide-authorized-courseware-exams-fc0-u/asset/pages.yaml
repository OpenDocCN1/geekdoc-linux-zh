    # Sound Systems


    A computer''s sound subsystem consists of all the components involved in sound
    input and output. The brain of this operation is the sound card. On some systems,
    the sound card is a separate expansion board; on others, sound-card functionality
    is built into the motherboard. The other major components of the sound subsystem
    are speakers (for output) and the microphone (for input). You can also connect
    a hook up output stereo system as an input device to record music from LPS onto
    audio CDs.


    > Sound cards and sound support on PCs rely exclusively on small audio jacks that
    accommodate 3.5 mm plugs. If you need to connect something that doesn''t have
    that kind of plug, you''ll need to purchase an adapter.


    > The Strata objectives'' Acronyms list includes MPEG, MP3, and MP4. MPEG stands
    for Moving Pictures Experts Group, which is an organization that governs the standards
    for some video and audio file formats. MP3 stands for Moving Pictures Experts
    Group Layer 3, an audio standard. MP3 clips are usually music files. MP4 stands
    for Moving Pictures Experts Group Layer 4, a video standard.


    # Speakers


    Speakers enable you to hear the audio output from the PC. Speakers can be either
    internal (as in a notebook PC) or external (as on a desktop PC).


    Depending on the quality of the sound support in the PC (either built in or an
    add-on expansion card), there may be one speaker jack or several. A system that
    supports surround sound or other advanced speaker sets may have color-coded jacks,
    as described in Table 3.1.'
