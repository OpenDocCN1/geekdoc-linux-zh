  md: '# Flash RAM Storage


    So far in this chapter, we''ve looked mainly at mechanical drives—the technologies,
    interfaces, and specifications. Next we''ll look at devices that use nonvolatile
    RAM to store data. They are technically not drives, but the term drive is widely
    used for because consumers are accustomed to them for any device that holds data.


    As learned in Chapter 1, some types of RAM are nonvolatile, meaning they continue
    to hold what you put in them until you make a change. The way it is written and
    erased. Flash RAM gets its name from the memory (EEPROM), which means that, like
    read-only memory, can hold what you put in it indefinitely, which can also be
    erased and rewritten by a burst (flash) of electricity.


    There are various sizes and packaging of RAM storage devices, but what they all
    have in common is that they are solid state; that is, they have no mechanical
    parts. As a result, they don''t wear out from mechanical use, they aren''t susceptible
    to data loss from physical trauma, they''re silent when operating, and they use
    less electricity than their mechanical counterparts.


    Some of the devices in this category include USB flash drives (aka memory sticks),
    memory cards, and solid-state hard drives. The following sections cover each of
    those device types.


    # USB Flash Drives


    A flash drive, also called a thumb drive, is a thumb-sized device that stores
    data on memory chips rather than on magnetic or optical media (see Figure 2.11).
    These devices can hold up to 256 GB of data, and they''re useful for transferring
    files between PCs and other electronic devices.


    > FIGURE 2.11 A USB flash drive


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_117_0.png)


    A flash drive''s speed is limited to the speed of the USB data bus. There are
    different versions of USB, and each has a different maximum speed. Most PCs today
    have a USB 2.0 data bus, which transfers data at up to 480 Mbps. In contrast,
    a SATA data bus has a maximum speed of between 1.5 Gbps and 3 Gbps.'
