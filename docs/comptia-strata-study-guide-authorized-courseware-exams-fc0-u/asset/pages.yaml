    | Mac OS (graphical interface) | Ctrl+click (or right-click) the file or folder
    and select Move To Trash, or drag it to the Trash. | | |

    | Linux (graphical interface) | Select the file or folder and press the Delete
    key, or drag it to the Trash. | | |'
