    # Securing Backup Media


    Large companies typically back up their data using their network, with the backups
    stored on the same type of server devices on which the data itself resides. However,
    smaller companies sometimes rely on data backups to external hard disks, optical
    media, and even memory sticks and tape drives. The data is not safer than the
    physical safety of these backup devices.


    Keep in mind that data can be stolen from backup devices just as easily as from
    the original storage locations. Physically secure all backup devices and media,
    both from theft and accidents and disasters, such as fires and flooding. Data
    should be stored off-site, in a fireproof safe.'
