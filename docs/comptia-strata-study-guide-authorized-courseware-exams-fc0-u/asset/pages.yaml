  md: 'In Table 1.3, the memory types FPM and EDO are, obsolete types of RAM. Fast
    page mode (FPM) was a nonsynchrous type of RAM that had its own speed independent
    of the system bus, expressed in nanoseconds of latency (delay), such as 70 ns.
