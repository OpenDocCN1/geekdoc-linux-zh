    # Wireless Networking


    Wireless networking uses radio (sound) waves to transmit data, much like a cordless
    telephone. With wireless Ethernet, nearly everything is the same as with wired
    Ethernet from a user perspective, except instead of cables, radio signals are
    used.


    # Wi-Fi: The 802.11 Standards


    There are several networking technologies, but the most popular of these is Wireless
    Fidelity, also known as Wi-Fi. Wi-Fi is a nickname for a collection of standards
    known as IEEE 802.11.


    An organization called Institute of Electrical and Electronics Engineers (IEEE)
    controls, among other things, the various networking standards. The standards
    governing networking are contained in the 802 range of numbering, and the standards
    governing networking are in the 802.11 range. Table 3.3 lists the 802.11 standards
    you may encounter.


    TABLE 3.3 IEEE 802.11 wireless networking standards


    | Standard | Frequency | Top Speed | Range (Indoors/Outdoors) in Meters |

    | --- | --- | --- | --- |

    | 802.11a | 5 GHz | 22 Mbps | 15 / 34 |

    | 802.11b | 2.4 GHz | 11 Mbps | 46 / 92 |

    | 802.11g | 2.4 GHz | 22 Mbps | 46 / 92 |

    | 802.11n | 2.4 GHz and 5 GHz | 600 Mbps | 70 / 250 |'
