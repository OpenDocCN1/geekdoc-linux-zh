    # Networking


    A network is a group of two or more computers that are connected in order to share
    data and resources. Networks can connect computers that are physically near to
    each other (a local area network, or LAN), or computers that are halfway around
    the world from one another (a wide area network, or WAN). The Internet is the
    biggest WAN of them all, connecting millions of LANs and individual PCs.


    The most common resource shared on a network is hard-disk space. One PC can access
    a hard disk on another PC through the network. The Internet''s main functionality
    also involves file sharing; when you access a website, you are reading a file
    from the server''s hard drive. Another commonly shared network resource is printer
    access. One user can send'
  merge: -1
