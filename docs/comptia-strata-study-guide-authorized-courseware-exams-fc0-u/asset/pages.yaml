  md: '![](img/c5fa9b25d23e63f6ffb996940faeace5_193_0.png)


    Selecting and setting up a computer system is a basic skill for a computer-literate
    person. This can include understanding the physical differences among available
    systems and knowing“what goes where” in terms of plugging in the various external
    components and peripherals.


    # # Choosing a Computer Type


    Different personal computer types are appropriate for different situations, and
    it’s important to be able to identify the right computer for your—or someone else’s—needs.
    Computers vary according to the following:


    **Size and Portability** The smaller the computer, the easier it is to transport.
    However, small size may mean that you have to compromise on some other feature,
    such as ease of input or processing power.


    **Processing Speed and Multitasking** As you learned in Chapter 1, “Core Computer
    Hardware,” the faster the CPU, the faster the computer operates overall. Lots
    of RAM, as well as a multitasking-capable operating system, gives a computer the
    ability to handle many tasks at once.


    **Ease of Input and Output** It’s easier to put data in, and get out of, a device,
    with a full-size keyboard and mouse.


    **Multiple Capabilities** Some computers double as book readers, cell phones,
    Internet devices, global positioning systems (GPS), and so on. Strictly function
    as personal computers.


    *Desktop PCs* are the traditional rectangular-box models with separate keyboard,
    video monitor, and mouse (sometimes referred to as KVM). A desktop PC provides
    an optimal user experience because it has a full-size keyboard and mouse and a
    large monitor—no compromises are needed in any of those areas. Desktop PCs also
    provide more processing power for the money than other types of PCs. A desktop
    PC’s main drawback is its lack of portability (see Figure 4.1).'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# FIGURE 4.1 Desktop PC


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_194_0.png)


    Courtesy of Lenovo


    Desktop PCs are widely used in SOHO environments. SOHO stands for small office/home
    office.


    A server is like a desktop PC in terms of size and components. The main difference
    between a server and a desktop PC is the operating system: a server uses an OS,
    such as Windows Server, which has special utilities built in for managing a network.
    A server may also have multiple CPUs and a large amount of RAM in order to process
    efficiently the heavy demands that a server''s job entails. As you learned in
