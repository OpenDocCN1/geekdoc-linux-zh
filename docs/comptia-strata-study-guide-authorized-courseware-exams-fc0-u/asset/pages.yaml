    # Numeric Keypads


    In some business sectors, such as finance, accounting, and banking, computer users
    spend a lot of time entering numeric data. In such cases, a numeric keypad can
    be a big help. Users who are trained in the so-called “10-key” keypad usage can
    enter numbers more swifty with a numeric keypad than they can using the number
