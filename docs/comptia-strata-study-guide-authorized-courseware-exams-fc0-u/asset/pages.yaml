  md: '# # Answers to Review Questions


    +   1. D. RoHS stands for Restriction of Hazardous Substances, an EU directive
    that took effect in 2006.

    2. B. RoHS limits the use of lead, mercury, cadmium, hexavalent chromium, polybromated
    biphenyls, and polybrominated diphenyl ether in electronics manufacturing.

    3. B. Batteries contain toxic chemicals such as lead, nickel, and/or cadmium.

    4. A. The inside of a CRT is coated with phosphates that make the pixels light
    up. Phosphorous can explode or burn when exposed to water.

    5. C. Toner is a carcinogen. It is combination of plastic and metal, so it is
    not caustic, flammable, or explosive.

    6. B. MSDS stands for material safety data sheet. It is a document that dictates
    the proper handling and disposal of a chemical.

    7. A. The Data Protection Directive (EU) prevents data from being used for purposes
    other than those for which it was collected, and from being shared with another
    company.

    8. D. Hibernate saves the content of RAM to the hard disk and shuts off all power
    to the computer. A computer can remain in Hibernate mode indefinitely because
    no power is being used.

    9. A. shutdown saves as this can be used to shut down a PC remotely via its IP
    address.

    10. A. An LCD monitor is more efficient than a CRT. CPU and RAM are not types
    of monitors.

    11. C. The Fn key is commonly used along with other key, such as an arrow key,
    to change the monitor''s brightness.

    12. D. The Energy Star logo marks equipment that uses power efficiently and may
    have special power-management features.

    13. A. Virtualization software creates a separate operating system environment
    within the main OS on a computer.

    14. B. Remote desktop enables you to use a computer remotely with the monitor,
    keyboard, and mouse you have available locally.

    15. D. NAS stands for network attached storage, which is a network-capable storage
    device. Using NAS rather than a file server saves energy.

    16. A. Green building practices methods of keeping cool air from leaking out of
    a server room, as well as construction methods that increase insulation.

    17. B. Cloud computing means performing computer activities by using applications
    stored online rather than those applications on your own computer.

    18. C. VoIP stands for Voice over IP. It refers to a phone system that is implemented
    over a data network or Internet connection.

    19. D. Telecommuting, in which employees work from home and connect to their office
    via telephone or the Internet, can save a company money and energy.

    20. A. Duplex printing means printing on both sides of the paper. This can help
    you save money on paper.'
