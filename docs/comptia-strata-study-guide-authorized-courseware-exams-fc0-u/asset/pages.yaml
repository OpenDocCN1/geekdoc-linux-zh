    # # Software for Defending Against Malware


    Three main classes of applications protect your system against malware. Antivirus
    software defends against viruses, worms, and Trojan horses; antispyware defends
    against adware and spyware; and antispam reduces the amount of junk mail you receive.


    There are also suites available that combine multiple security functions; for
    example, Norton Security includes antivirus, antimalware, and antispam features,
    along with identity-protection features, a firewall, and a PC tune-up tool. In
    addition, there is overlap between the types of threats each application guards
    against; for example, an antivirus program may also target some types of malware.


    # # Antivirus Software


    Antivirus software attempts to identify viruses by scanning all the files on your
    hard disk (or a subset of files that are most likely to contain viruses). Popular
    antivirus programs include Norton antivirus and McAfee VirusScan.


    > The website www.avcomparatives.org/ provides a comprehensive comparison and
    review of current antivirus applications. Take the time to look through this and
    draw your conclusions about what might be the best antivirus application for you.


    Viruses are often concealed by a simple deception. They embed themselves inside
    an antivirus, redirecting the antivirus''s commands and code around themselves
    while running as a separate task. One antivirus programs detect a virus by opening
    the file and scanning the code, looking for this type of redirection. Some programming
    languages, such as C++ and Java, generate code in a style that is sometimes wrongly
    accused by an antivirus program being infected.


    Another antivirus program works to scan the code of each executable file looking
    for virus signatures. A virus''s signature is an identifying snippet of code,
    sometimes called a virus definition. The antivirus program maintains a database
    of known virus definitions; when it finds a match between its database and some
    code it finds in a file, it signals a warning that there may be an infection.
