  md: '# CD and DVD Drive Interfaces


    CD and DVD drives use the same connectors as hard disks to the motherboard. Depending
    on the model, they can use PATA, SATA, or SCSI, which were described earlier in
    this chapter.


    # CD Writing Technologies


    CD-ROMs are read-only, but there are two technologies for creating your own CDs:
    CD-R and CD-RW.


    CD-R, which stands for Compact Recordable, can be written to only once (except
    in the case of multisession writing, where the previous content isn''t exactly
    erased, ignored, and the new content in the disc''s file listing). CD-RW or Compact
    Rewritable can be written to, erased, and reused many times, functioning somewhat
    like a flash drive. CD-RW is a good choice when you need to store small amounts
    of data over time, as a backup of a few files. CD-R is more compatible with stereo
    systems and other non-computer devices that play optical CDs, so it''s a better
    choice when burning a CD to you don''t want to make changes.


    In today''s PCs, all writable CD drives can read and write both CD-R and CD-RW
    discs. CD-R blanks are less expensive than CD-RW blanks, so you may want to keep
    some on hand for different uses.


    PCs don''t have the manufacturing equipment to create the pitted aluminum layer
    that exists on a mass-produced CD. The recording process for CD-R is made possible
    by the fact that CD readers don''t touch the surface of the disc—they only look
    at it. Its dye-and-metal coating that is, in its natural state, very shiny. The
    laser zaps certain areas of the disc to make it shiny, and therefore less reflective.


    The CD''s sensor interprets a less-reflective area as a pit, regardless of whether
    the area is actually pitted. In contrast, CD-RW doesn''t use a dye-and-metal coating.
    Instead it''s coated with a metal alloy with reflective properties that change
    depending on the temperature to which it''s heated. Three settings are used. The
    high write setting heats the alloy to 1,112 degrees Fahrenheit, at which temperature
    it liquefies. Then it solidifies and loses its reflectivity properties. The same
    spot can be reheated by the low write setting to a lower temperature (around 392
    degrees Fahrenheit), causing it to revert to its originality. That is how an area
    is rewritten. The lowest power setting reads the data without changing it.


    # DVD Drives


    DVD stands for Digital Versatile Disc or Digital Video Disc. DVDs may look a like
    CDs, but technically they''re more advanced and hold much more data. DVD drives
    can also read CDs, so it''s rare to find a CD-only drive these days; most can
    write both CDs and DVDs.'
  merge: -1
