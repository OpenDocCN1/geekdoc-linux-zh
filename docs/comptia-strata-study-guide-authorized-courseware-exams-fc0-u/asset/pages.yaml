    +   3. Close the web browser.


    +   4. (Optional) If you don''t want to keep this scanning tool, remove it from
    the Control Panel (Windows) or draw it out of the Applications folder (Mac) as
    you learned in Chapter 6, "Installing and Configuring Software."


    # Hard Disk Drives


    Replacing the main hard drive in a notebook or other portable computer isn''t
    easy, but it may be the only option if there is room for only one hard drive.
    Replacing a hard drive means backing up all the data, installing the new drive,
    partitioning and formatting the drive, and then restoring the data to.


    Adding another hard drive and keeping your old one too is easier, but installing
    an internal drive requires an available drive bay (that is, a cavity where a drive
    can be mounted). In a desktop PC, there is always room for at least one more hard
    drive. (It doesn''t hurt to peek inside the case and make sure before you buy,
    though.) In a notebook, almost never is an open bay. If you don''t have an open
    bay, you can use an external USB or FireWire drive instead to increase your storage
    capacity.'
  merge: -1
