  md: '# Cables


    The most common type of cabling used for Ethernet networks is an unshielded twisted
    pair (UTP) cable with an RJ-45 connector at each end. RJ stands for Registered
    Jack. Telephone systems also use RJ connectors, so you''re probably familiar with
    that connector type already. An RJ-45 connector is slightly wider than a normal
    telephone plug (RJ-11 or RJ-14), though, it doesn''t fit in telephone outlets.
    Figure 3-12 shows an RJ-45 connector.


    FIGURE 3.12 Ethernet cable with RJ-45 connector


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_154_0.png)


    UTP cable carries data on pairs of wires. The types of UTP cables used for Ethernet
    have four pairs (eight wires total). The pairs of wires are twisted in order to
    minimize any magnetic interference that may be generated as the electrical signals
    pass through the wires. Each pair shares a color scheme. For example, the first
    pair is orange and orange-and-white. The other colors are green, blue, and brown,
    each pair with one solid wire and one striped with white.


    The cables are considered unshielded because they don''t have any special built-protection
    from magnetic interference that may come from outside of the cable. Shielded twisted
    pair cables (STP) are also available for Ethernet use, but they''re much more
    expensive and are so used only in situations where magnetic interference is a
    problem.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# Chapter 3 • Peripherals and Networking


    There are different categories of UTP cables. The higher the category number,
    the better the cable can conduct data at a high speed. For example, Category 5
    (Cat5) cable can carry data up to 100 Mbps. Cat5e cable can carry data up to 1
    Gbps, and Cat6 cable can carry data up to 10 Gbps. (Those are the maximum transfer
    rates that the cables can support with an adequate level of accuracy; the cables
    are passive and don''t control the data transmission rate.)


    # Standard and Crossover Cables


    The individual wires in a cable are connected to the connectors on each end is
    known as the cable''s pin out. On standard network cables, it''s a straight-through
    pin out, so that the wire colors are in the same order at each end of the cable.
    If you look at any UTP Ethernet cable, for example, you''ll see the orange wires
    are in the same place both ends. Standard cables like that are used to connect
    devices such as printers and computers to the switch or router.


    A crossover cable, less common but still very important, connects two devices,
    such as the sockets on patch-panels (the panel that connect networks). You may
    use one to connect two routers or switches, for example, or one laptop to another
    laptop. Another name for this type is patch cable. If you look at the ends of
    one of these cables, you''ll notice that the order of the colored wires is reversed
    on one end.


