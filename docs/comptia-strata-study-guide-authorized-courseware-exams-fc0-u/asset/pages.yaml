    A processor''s speed is related to its number of instructions per second, but
    other factors besides its speed can affect the number of instructions it can process
    per second. For example, a multicore CPU can process more than a single-core,
    and other technology enhancements such as cache usage further enhance a processor''s
    capability. As a point of reference, the Intel Core i7 Extreme (quad core) runs
    at 3.3 GHz and processes 147,600 MIPS.

    another contributor to the performance of any processor is the quality and speed
    of the motherboard that supports the processor. The motherboard''s *system bus*
    (also called the *front-side bus*) is the pathway that delivers data to the processor.
    The speed at which this pathway operates is determined by the motherboard''s front-side
    bus. The *system timer* on the motherboard determines this speed. Most motherboards
    can automatically adjust the speed of the timer based on the installed processor;
    or, older models, it was necessary to set jumpers on the motherboard manually
    to indicate what processor type and speed was installed.


    > The word *bus* is used in computers from Latin; the original word was a shorthand
