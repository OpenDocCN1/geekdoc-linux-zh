  md: '# 274 Chapter 7 • Updating and Upgrading Hardware


    USB 2.0 device in a USB 1.1 slot or a PCIe 16x display adapter in a system that
    doesn''t have an available PCIe 16 slot. Power-connection incompatibilities can
    also occur, such as when you need to connect a SATA device but your power has
    no free SATA power-supply connectors.


    Incompatible or insufficient hardware can result in failures of various types.
    Here are some examples:


    +   - USB hub, in theory, can support dozens of devices. However, if many of those
    devices are unpowered (that is, they rely on drawing the power they need from
    the USB port without a separate power supply), a USB hub can reach its maximum
    power output quality, and some of the devices may not receive enough power. Your
    OS may warn you that what''s going on or some of the devices may stop working.


    +   - Your PC''s power supply can become overloaded if you have many devices installed
    draw lot of power. For example, if you have three full-size mechanical drives
    installing a fourth may cause problems at startup because there isn''t enough
    power to allow all drives to spin up at once.


    +   - A new device may not show up in the OS when you install the device driver
    for it. Further, when you install a new device driver, that may be incompatible
    with some other driver already installed, or it may overwrite system files that
    some other application or device needs.


    Although this rarely occurs, some older versions of Windows resource conflicts
    may still occur when Windows assigns the same resources to multiple devices. System
    resources include IO addresses, memory addresses, and Interrupt Request lines
    (IRQs). You can troubleshoot problems in the Device Manager by manually assigning
    resources to a device so that it no longer conflicts with other devices. That
    type of configuration is beyond the scope of this book.


    # Installing Upgrades


    Next, let''s get down to the nitty-gritty and talk about the procedures for physically
    installing upgrade components.


    # Safety Considerations


    Computers aren''t very dangerous; you generally have to work pretty hard to hurt
    yourself while working on one. Here are some safety tips:


    +   - Wear short sleeves, or roll up your sleeves, so you don''t get a sleeve
    caught on a sharp corner and rip it.


    +   - Remove jewelry, especially dangling earrings and neck chains, so you don''t
    catch them on anything that may be sticking out.'
