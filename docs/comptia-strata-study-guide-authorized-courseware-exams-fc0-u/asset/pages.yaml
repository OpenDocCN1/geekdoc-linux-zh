    | 1.1 (Full Speed) | 12 Mbps |

    | 2.0 (High Speed) | 480 Mbps |

    | 3.0 (Super Speed) | 4800 Mbps |


    # EXERCISE 4.3


    # Getting USB Port Information


    One of the benefits of USB devices is that a single USB controller can manage
    multiple devices with little additional system resources required. Each controller
    manages one or more hubs. A hub can be a physical box outside a computer but is
    more commonly a built-in motherboard controller that routes signals from multiple
    USB ports on your computer into one of the USB controllers. In the following exercise,
    you''ll explore the USB devices on your Windows-based computer using Device Manager
    to see the relationships between the controllers and the hubs.


