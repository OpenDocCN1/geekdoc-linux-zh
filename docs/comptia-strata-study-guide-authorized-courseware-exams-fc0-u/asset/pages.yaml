  md: '# Chapter 2 · Input and Storage Devices


    Is the proper term *hard disk or hard drive*? Either is correct. The original
    disks in computers, floppy disks, were removable. A floppy drive was permanently
    mounted in the computer, and the floppy disks popped in and out of it. The drive
    and the disk were two separate pieces. Then came hard disks, with integrated drives.
    Because there is no separating them, a hard disk (the platters inside the metal
