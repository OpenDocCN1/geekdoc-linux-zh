    # Installing a Application


    Installing an application from a disc is simple. Just pop the disc into the drive,
    and the Setup program will start automatically. If it doesn''t, double-click the
    drive icon for the drive. If that doesn''t start the Setup program, it will open
    a list of files on that disc; locate and double-click the named Setup (or something
    similar).


    You can also download and install applications. If you download an executable
    file (a file with an .exe or .com extension), you can double-click that file to
    start the setup routine.


    Occasionally, an application you may download in a compressed archive, such as
    a Zip file (that is, a file with a .zip extension). In such case, you must extract
    the contents of the archive to a new folder on your hard disk and run the setup
    from that new folder.'
