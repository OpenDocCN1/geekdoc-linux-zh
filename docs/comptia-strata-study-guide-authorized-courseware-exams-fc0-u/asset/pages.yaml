  md: '# # Answers to Review Questions


    +   1. Installing a new device driver can sometimes fix problems or introduce
    minor feature upgrades.


    +   2. A Device Manager shows each device and its driver version. You can access
    it as a standalone tool or as of Computer Management, as demonstrated in Exercise
    7.1.


    +   3. The lowest score among the key components determines the base score, because
    that component creates a bottleneck in performance.


    +   4. Video playback problems and graphic delays may indicate that a better display
    adapter is needed.


    +   5. More RAM can help run more programs at once without a performance slowdown.


    +   6. In Task Manager, the Processes tab shows the amount of RAM used by each
    process.


    +   7. Although processors are not particularly difficult to install, with only
    a few processors, dramatic system improvement can usually be obtained by upgrading
    the processor.


    +   8. A parallel ATA drive would use a Molex connector from the power supply.


    +   9. Serial ATA (SATA) drives can have only one drive per cable. That''s why
    they don''t require any jumpers, unlike PATA, which supports up to two drives
    per cable.


    +   10. On-add display adapters today use the PCIe bus. You can disable the output
    in BIOS Setup or leave it for connecting additional monitors.


    +   11. A x16 slot is most used for a display adapter. 1x slots are used for devices
    requiring bandwidth, such as modems. There is no such slot as 2x or 32x on PC
    motherboards.


    +   12. Because a USB 1.1 device has a slower maximum speed than a USB 2.0 port,
    the device will be able to function at its maximum speed, unbiased by the limitations
    of the port.


    +   13. FireWire 400 and FireWire 800 are logically compatible (for the speed,
    which is limited to the lower of the two''s capabilities), but physically an adapter
    is required.


    +   14. Circuit boards, including DIMMs, should be handled by the edges whenever
    possible.


    +   15. Electrostatic discharge, or static electricity, can ruin a circuit board.
    An antistatic bag protects against ESD.


    +   16. A DIMMS are inserted perpendicular to the motherboard.


    +   17. Parallel ATA drives have a master/slave cable setting that you can use
    with a jumper.


    +   18. A new hard disk needs a drive bay in which to mount it. A PCIe slot would
    hold a circuit board, not a drive.


    +   19. Except in the Disk Management utility, Windows cannot see new hard drives
    until they have been partitioned.


    +   20. NTFS is the best filesystem in most cases. FAT16 is a very old file system
    that is now obsolete. CDFS is the filesystem on CD-ROMs. FAT12 is the filesystem
    on floppy disks, now obsolete.'
