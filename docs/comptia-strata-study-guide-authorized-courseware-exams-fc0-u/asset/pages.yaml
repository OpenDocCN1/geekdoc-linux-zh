    # Assigning a Folder Structure During Installation


    When you install an application, there is usually an option to specify into what
    folder the application''s files will be placed. You may need to click a Custom
    or Options link or button during setup to access it. It''s a one-time offer to
    specify the location; you can''t rename or move application files after you do,
    or they won''t work. In most cases, the default location that the setup program
    suggests is, if you have no other preference.


    On a Windows PC, most applications place their files in a subfolder of the C:\Program
    Files folder at the top level. It would be less desirable to create a separate
    folder at the top level of the folder structure for each application because it
    clutters the root folder.


    Many Windows applications are 32-bit, so they run on either 32-bit or 64-bit versions
    of Windows. If you''re running a 64-bit version of Windows, there may be two separate
    folders: Program Files for 64-bit applications and Program Files (x86) for 32-bit
    applications.'
