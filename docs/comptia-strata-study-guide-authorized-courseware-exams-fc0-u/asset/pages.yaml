  md: '# Updating and Upgrading the Operating System


    Here are some of the web pages that provide upgrade path information for Windows
    systems:


    +   * From Windows XP to Windows Vista:


    http://windows.microsoft.com/en-US/windows-vista/Upgrading-from-Windows-XP-to-Windows-Vista


    +   * From Windows XP or to Windows 7:


    http://windows.microsoft.com/en-us/windows7/products/upgrade

    You can also upgrade from one edition of the system to another. Windows 7 makes
    that particularly easy with its Anytime Upgrade feature. Choose Start ➤ All Programs
    ➤ Windows Upgrade, and follow the prompts to upgrade. With Windows, you may have
    to buy a different edition and install it if you were installing an upgrade. This
    isn''t an issue on Mac, because Apple doesn''t offer different editions of the
    Mac OS.


    # Securing Administrative Rights and Firewall Access


    To make system-level changes to the OS (and upgrading qualities), you must make
    sure you have administrative rights to the PC. This means sure the user ID with
    which you log in is an administrator. If you need to contact a network administrator
    to get the security level on your user ID increased, do so before you get started.


    There are two kinds of firewalls: hardware-based (used in large companies) and
    software-based (built into the OS, as Windows Firewall, or available third-party
    software). Both types of firewalls prevent unauthorized incoming and outgoing
    network traffic as a security measure. If the PC''re upgrading is part of a corporate
    network where a hardware firewall is in, check with a network administrator to
    make sure there aren''t any problems with accessing the Internet during and after
    the upgrade.


    # Preventing Data Loss When Installing a New OS


    When you do an upgrade install, get to keep all your data and installed applications.
    There''s a small risk of data loss with any installation of a different OS, so
    back up your important files before a precaution. However, chances are good that
    everything will come just fine.


    When you do a clean install, everything on the hard disk gets wiped away (most
    cases). After doing a clean install, therefore, you must make certain that you
    have backups of everything you want to keep.


    With a clean install, you can''t back up and restore the installed applications
    the way you do with data files. Applications must be reinstalled after installing
    the new OS. That''s because an installed application isn''t simply copied to the
    hard drive; it also has configuration entries in the system files for the OS.
    When you do a clean install, all those system files are replaced with new versions
    of them that don''t include any data. That''s why it''s desirable to do an upgrade
    install of the OS if possible.


    When you''re doing a clean install, the Setup program may ask whether you want
    to repartition and reformat. As you learned in Chapter 2, “Input and Storage Devices,”'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# Chapter 6 • Installing and Configuring Software


    repartitioning isn''t necessary unless you want to change the distribution of
    hard-disk space among the partitions and logical drives you already have. Reformatting
    isn''t necessary either


    > If you decide a clean install of an OS on a system that has a hidden partition
    where the previous version stored recovery files, you probably won''t need that
    partition or those recovery files anymore after the new OS has been installed
    because they will no longer be appropriate for recovering your system. Therefore,
    you may choose to delete the current partitions and create a new, single partition
    that includes all the available space.


    # Installing a New OS Version


    After all the preparations happen beforehand, installing a new OS version is surprisingly
    simple and straightforward. To do an upgrade, start the computer in its current
    OS, and then pop the CD or DVD in drive. The Setup program will start automatically,
    prompting you through each step. During the setup process, you may be asked about
    some of the following:


    **Product Key** As an antipolicy measure, Windows comes with a product key, which
    is a string of letters and numbers that is unique to that copy. You may enter
    a valid product key to complete the setup. The product key is usually on the sleeve
    in which the disc came, or possibly on the box or on a card inserted in the box.
    Mac OS doesn''t use product keys, so this isn''t an issue.


    **Username** You can set up more users later, but you may be prompted for a username
    to start with.


    **Network to Connect To** If the Setup program finds wireless networks, it may
    ask you to which one you want to connect. Setup usually identifies and uses a
    wired network without a prompt.


    If you do a clean install, boot the PC from the CD/DVD. To do this, insert the
    setup disc and reboot the computer. If it boots from the disc—great. If it doesn''t,
    you''ll need to go into the BIOS Setup for the PC and change the preferred boot
    order so the CD/DVD drive is preferred over the hard disk. To do so, watch the
    screen as the PC boots for a message that tells you which key to press to enter
    BIOS Setup. It may be a function key, like F12, or it may be Esc or some other
    key, depending on the BIOS version and brand.


    During the process of a clean install, you may be asked about some of the following:


    **Partitioning and Formatting** If you''re prompted to redo the partitions and
    formatting, think hard about this. Redo the partitions only if the current ones
    are unacceptable. Reformat a drive only if you want to wipe everything on it.'
