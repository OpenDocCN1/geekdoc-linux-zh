    # Summary


    In this chapter, you learned how to clean a computer inside and out, and how to
    prevent damage to computer equipment by avoiding electrical, temperature, magnetic,
    and physical damage. We discussed methods of preventing data or service loss,
    including battery conservation, backup solutions, and drive recovery.


    Next, you reviewed the procedures for managing files and folders, but at a command
    prompt and in a graphical environment, using a variety of OSs, including Windows,
    Mac OS, and Linux. Finally, you learned many of the maintenance utilities that
    come with Windows, and how to find them in Windows.


    # Exam Essentials


    Be able to work with files and folders. You can create, delete, rename, and move
    folders and files from either a graphical interface, such as Windows Explorer,
    or from a command prompt. Make sure you know the basics of both methods, as well
    as the key differences between OSs.


    Understand the function and purpose of software tools. Most OSs, including Windows,
    include various utility programs for maintaining the system. Make sure you can
    name and use performance and error-correction tools, backup tools, and disk tools.
    You should also be able to look up event logs and set a folder or drive to compress
    its contents to save space.'
