  md: 'Internal and External Storage Devices


    # # Partitioning a Disk and Creating Logical Drives


    An OS does not deal directly with the physical hard disk. It deals with logical
    drives. A logical drive is drive letter that has been assigned to a portion of
    a physical disk. A single physical disk can have multiple logical drives. The
    OS might see a C drive, a D drive, and an E drive, for example, all which are
    part of a single physical disk.


    To create these logical drives, you must first create partitions. At a minimum
    you need to create one primary partition. You can allocate all the space on the
    entire drive, or you can set aside space for another partition. If you do set
    aside space, you can create an extended partition and then create additional logical
    drives on that partition. When you partition a physical drive, it creates a master
    boot record (MBR) that the OS looks to the MBR to determine what drive letters
    it uses.


    Partitioning requires a disk management utility. Each OS comes with at least one
    utility, and third-party partitioning utilities are also available. The Windows
    Setup program contains a partitioning and formatting utility and, within Windows,
    you can use the Disk Management utility (from Computer Management, as you will
    see in the upcoming exercise) to partition and format drives. In earlier versions
    of Windows, a text-based utility called FDISK used to manage partitions. If you''re
    using the Recovery Console, a similar program called DISDISK manages partitions.


    A disk needs to be partitioned only once; you should partition a drive only if
    you want to change the allocation of a disk to the various drives. Partitioning
    a drive, in most cases, will wipe the contents of the drive, don''t change the
    partitions on a drive that contains data you want to keep. Some third-party partitioning
    programs can do a nondestructive partitioning—that is, can change the partition
    sizes without losing any data.


    > Computers that come with a hidden recovery partition are set up that the single
    hard disk is split into two partitions, one of which contains the hidden backup
    files and the other of which contains the C: drive, the main drive that you work
    when you access the computer''s hard disk. The fact that there are two partitions
    isn''t obvious until you run a recovery utility that accesses the hidden one.


    # # High-Level Formatting


    After you create the partitions and the logical drives, the OS sees them but can''t
    read and write them because they haven''t been high-level formatted. High-level
    formatting lays down an organization system that is compatible with the OS installed.


    In Windows XP and higher, the predominantly used file system is NTFS. FAT32 is
    an older file system that is backward compatible with earlier Windows versions,
    as Windows 98. For NTFS, high-level formatting entails creating a master file
    table (MFT) that contains pointers to the starting points of files and folders.
    It''s essentially a table of contents for the logical drive. A volume boot record
    is also created, which stores information needed to boot from the drive, and a
    root directory (that is, a top-level folder).'
