  md: '# Chapter 8 • Troubleshooting Operational Problems


    To access Windows RE, boot from the Windows setup DVD. (You may need to change
    the boot sequence in BIOS Setup so it boots from the DVD drive rather than the
    hard disk.) The Windows Setup utility runs as if you were installing a new copy
    of Windows. When prompted, click the Repair Your option. Follow the prompts until
    you get to System Recovery Options, and then click Startup Repair. Follow the
    advice that Startup Repairs to repair your Windows installation.


    # Mac OS Won''t Load


    Macs go through the same basic process for startup as PCs. If there''s a disk
    error, such as the ones on the black screen that a PC''s BIOS may display, you
    will see a flashing question-icon.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_357_0.png)


    > Here''s a flowchart that can help you diagnose Mac startup problems:

    http://web.whittier.edu/com/macguide/flowchart.cfm

    SOURCE: Whittier College, copyright ©2011


    The flashing question mark icon means the startup process can''t find a hard disk
    or find a system folder on the hard disk. The hard disk may be disconnected, its
    driver may be bad, or it could be loose; if it''s an old system to still have
    a floppy disk drive, there may be a disk in that the OS is trying to boot instead
    of the hard disk.


    On a Mac, the hard drive must have a System Folder that contains such items as
    accessories, fonts, and system utilities, plus the System file and Finder. Without
    these, the computer won''t boot. The question-mark icon appears if this folder
    is missing or corrupted or doesn''t contain the needed files.


    Any other problems on a Mac may result in a red circle with a diagonal line through
    it, called a prohibition icon. (Early versions of the Mac used a "sad Mac" icon
    in these cases.) Along with this, you''ll see an error code that you can look
    up in an error-code listing, as with this one: http://support.apple.com/kb/HT1618.


    # Operating System Error Messages


    Each OS has its own error message that it displays in various circumstances. In
    some cases, you can look up these error messages online the OS maker''s website
    or third-party sites to determine what they mean.


    To troubleshoot with Mac OS X, see the article "Isolating Issues in Mac OS X"
    on Apple''s support knowledge base: http://support.apple.com/kb/TS1388.


    To troubleshoot issues with Windows 7, see the article "Support for Windows 7
    Technical Problems and Troubleshooting" at: http://support.microsoft.com/ph/14019.'
  merge: -1
  pgno: 357
- img_proc: true
  md: 'Here are a few common Windows error messages you may encounter and what they
    mean:


    **Windows Has Recovered from a Serious Error** This message means something major
    crashed, and Windows has restarted itself as a result. If you see this error once,
    it''s probably a fluke; but if you see it frequently, you may need to repair Windows
    or take a critical look at what programs are loading at startup that may be causing
    the error.


    **The System Is Low on Virtual Memory. Windows Is Increasing the Size of Your
    Memory Paging File** This message describes what is happening when your system
    has run out of memory. Do you have too many applications running for the amount
    of memory installed? As a result, Windows increases the paging file size so that
    it won''t happen again (presumably). If the PC is running slowly, try rebooting.


    **Data Error Reading/Writing Drive** This message Windows is having trouble reading
    from or writing wherever it lists it in the error message. Run CHKDSK (from the
    drive'' Properties dialog box on the Tools tab), and select the Scan For Attempt
    Recovery Of Bad Sectors box to assess the device.


    **A Runtime Error Has Occurred. Do You Wish to Debug?** This is an Internet Explorer
    error message, normally caused by badly written code being delivered from the
    website. If it''s not your PC''s fault, you find this message annoying, you can
    change a setting in Internet Explorer to prevent it from appearing. From the Control
    Panel, choose Network and Internet, and Internet Options. On the Advanced tab,
    in the Browsing section, select the Disable Script Debugging (Internet Explorer)
    check box.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_358_0.png)


    > The Event Viewer utility in Windows can sometimes provide information about
    an error event that has occurred, helping you narrow down what may have caused
    it. You can access the Event Viewer from the Panel in the Administrative Tools
    section.


    # OS Slowdown or Lockdown


    Sometimes you may be working along in your OS, when of a sudden, everything slows
    to a crawl. Simple things like opening an application and closing a window take
    much longer than usual.


    There are two basic reasons why slideshows happen. One is that the physical memory
    is mostly used, so the system is relying on its paging file than usual. Because
    the paging file is on the hard disk, and the hard disk is slower than real RAM,
    operations involving heavy use of the paging file take longer. The other reason
    is that the CPU is being heavily used, so each operation that needs the CPU''s
    attention has to wait its turn.


    That begs the question: what causes the RAM and/or the CPU to be used heavily?
    They can be legitimately used by applications if you run a lot of applications
    at once,'
  merge: -1
  pgno: 358
- img_proc: true
  md: 'especially those that require a lot of processing power. Big graphics-editing
    programs like Photoshop qualify, the RAM and CPU can be improperly hijacked by
    a malfunctioning program by a virus or other malware application.


    > NOTE When you start up the OS, it''s normal for application-related activities
    to take longer than normal, because the OS continues to finish loading behind
    the scenes for the OS interface afterwards. If you try to start several applications
    immediately after starting the PC, and they don''t start quickly enough to suit
    you, be patient. Within a few minutes, your computer should be running normally
    again.


    To check the memory and CPU usage in Windows, use the Task Manager. You practiced
    doing this in Exercise 7.2. Right-click the taskbar, and choose Start Task Manager.
    Then, on the Processes tab, use the Memory column and look for a process that
    is using an inorder amount of memory. Terminate it if necessary to get back normal
    control of your computer. You can also look at the Performance tab to see the
    RAM and CPU usage statistics.


    If the OS locks up completely, usually including the mouse pointer, the most common
    cause is overheating. If the CPU or another chip on the motherboard overheats,
    the system locks up. The OS can lock up like that for other reasons than overheating,
    such as a corrupted system file (repair the OS to fix that), that''s less likely.
    By halting rather than continuing to operate in an overheated state, the motherboard
    preserves the valuable CPU chip, which may be damaged if it continued to run.
    The monitor may go blank, or keep displaying the last information it was sent,
    so the image on the screen appears frozen in time.


    If your OS has locked up, shut off the PC if it doesn''t shut down. Open the case,
    and let the PC for 10 to 15 minutes until it cools off. Then, turn on the computer
    and see whether any fans are spinning. The problem may be as simple as a faulty
    fan. There should be a side fan the power supply, a fan (or very near) the CPU,
    and possibly other fans that circulate air through the case. No faulty fans? Let
    the PC boot up the OS again and let it. Don''t run any applications. If it boots
    just fine but then locks up after a few minutes without doing anything to, something
    is definitely overheating; consult a PC technician at your local repair shop for
    help.


    # Application Failures


    Applications are more likely to cause problems than the OS, because there are
    so many different applications, all made by different manufacturers, and all expected
    to “play nicely” with each other, with your hardware, and with different versions
    of the OS.'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# Application Fails to Install or Fails to Run


    Usually, when an application fails to install or fails to run, it''s somehow incompatible
    with your system. It could be that your OS version isn''t supported or the application
    doesn''t like a piece of hardware you''ve installed (most likely the sound or
    display adapter). The hardware may be inadequate (check the minimum requirements
    for the application) or simply incompatible.


    Check the application''s specs to make sure your system meets the requirements
    in every way. If your system meets the requirements but the application still
    won''t, check out the Support section of the application manufacturer''s website.
    There may be a patch you can download to fix the problem, or there may be suggestions
    regarding workarounds. For example, in some cases, an updated driver for your
    display adapter or sound card can make an application work that previously didn.


    If the program meets all hardware requirements but not the OS, you can try running
    the Setup program in Compatibility Mode (Windows). Compatibility Mode tricks the
    application into thinking you have a different version of the OS than you actually
    have, bypassing any version requirements. Different applications implement version
    requirements in various ways, and some of those have nothing to do with the version-specific
    bits and pieces that Compatibility Mode offers the application.


    Another possible source of trouble when installing applications is over-zealous
    security. The OS itself may prevent you from installing an application. If you''re
    logged in as a standard user, you may need to log out and log in again as an administrator.
    If the application being installed requires Internet access to complete the installation,
    you may need to tell your firewall that it''s OK to let that application through.
    And finally, the application may make a system change that your antivirus program
    or security suite detects as a threat (falsely), causing the security program
    to prevent the change from being.


    # Run an Application in Compatibility Mode


    +   1. In Windows, choose Start > All Programs, and right-click any of the applications
    and choose Properties. The Properties box opens for that shortcut.

    2. Click the Compatibility tab.

    3. Select the Run This In Compatibility Mode For check box.

    4. Open the drop-down list below the check box, and examine the available OSs.
    Click Windows 98 / Windows Me.

    5. In the Settings area, select the Run In 256 Colors box.'
