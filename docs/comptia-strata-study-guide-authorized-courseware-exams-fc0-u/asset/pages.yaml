  md: '# FIGURE 2.6 Touchpad on a Macintosh computer


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_97_0.png)


    Photo credit: Highway of Life, Wikimedia Commons


    Touchpads take up less space to operate than mice, so they’re commonly found on
    notebook computers.


    # Trackball


    A trackball is something like an upside-down mechanical mouse. Its base stays
    stationary, and you roll the ball with your fingers to move the onscreen pointer.
    Figure 2.7 shows an example of a trackball. Trackballs require less space to operate
    a mouse, and some people find them more comfortable to use. Trackballs are also
    more effective for pointing when precision is needed, such as using graphics software.


