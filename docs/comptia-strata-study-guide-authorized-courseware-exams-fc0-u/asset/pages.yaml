    # Using the Recovery Environment


    Windows XP came with a rather difficult-to-use command-line interface called the
    Recovery Console, you could use to access the hard disk and run a limited set
    of troubleshooting and recovery commands when Windows wouldn''t start. The Recovery
    Console has been replaced in Windows Vista and Windows 7 with a friendlier interface
    called the Windows Recovery Environment (Windows RE).'
