    Like plain HTTP, the FTP protocol isn''t secure. If you need secure file transfer,
    use a security-enabled transfer method instead of FTP, such as Secure Shell (SSH)
    FTP, sometimes called Secure FTP (SFTP).


    # VoIP


    Voice over Internet Protocol (VoIP) is a set of applications, technologies, and
    protocols to provide IP-based telephony services. In other words, it lets you
    use the Internet to make and receive "telephone" calls. From the end-user''s standpoint,
    it''s just another of the same service they''ve always enjoyed, but the calls
    are all-digital. The analog data from a person''s speech is digitized, as data
    sent over the Internet, and then re-created as an analog sound at the other end.


    Many companies offer low-cost VoIP service to consumers, including Skype. In addition,
    cable companies like Comcast offer digital file service through their cable lines
    in conjunction with Internet service.'
