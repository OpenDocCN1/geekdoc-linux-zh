    # Using System Restore


    The System Restore feature in Windows makes a backup copy of the important system
    configuration files once a day (by default). You can also make additional copies
    at any time, such as immediately before you install new and untried hardware or
    software. Then, if the system doesn''t work anymore after you install the new
    item, you can revert the system files to earlier versions, removing all traces
    of the new item you may have brought with it.


    If Windows won''t start normally, or it pours all of a sudden previously running
    badly, it''s often easier to revert to a System Restore point than to spend a
    lot of time trying to pinpoint what happened. System Restore from the Start menu
    (Accessories > System Tools folder). Then follow the prompts to select a previously
    saved restore point and restore that. Exercise 8.2 provides an opportunity to
    this.


    # EXERCISE 8.2


    # Use System Restore


