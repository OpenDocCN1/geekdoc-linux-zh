    ![](img/c5fa9b25d23e63f6ffb996940faeace5_330_0.png)


    # Assessing the Risks Involved in Hardware Upgrades


    Any time you buy and attempt to install hardware, there are risks involved. Most
    of these are minor compared to the benefits you stand by upgrading. Such risks
    can be minimized with proper diligence.


    One of the biggest risks in buying an upgrade component is that it won''t be compatible
    with your system, and that you''ll be stuck with a part that doesn''t work and
    unable to return it for some reason. Buying from a retailer with a liberal return
    policy is one way to hedge your bet, but it is better to consider compatibility
    carefully before you reach your wallet. As we''ve outlined in detail in the preceding
    sections, compatibility involves the following:


    **Physical Compatibility** Will the component fit perfectly into your system or
    its ports? For example, if you''re buying a FireWire external hard drive make
    sure you have a FireWire port.


    **System Compatibility** Will your system recognize and accept the component?
    For example, if you''re buying RAM, make sure you buy the right speed.


    **Operating System Compatibility** Is there a driver for this device for your
    OS? For example, if you''re buying a device designed for the Mac, it may not work
    on a PC and vice versa.


    These compatibility are more usually addressed on the box in which the device
    is packaged


    Upgrading a piece of hardware may also cause glitches with applications. For example,
    you may have software that works only with certain models, and your new camera
    may be incompatible with it. Check with the software maker to make sure if an
    updated version is available that supports newer models.


    Earlier in the chapter, you learned about the importance of an available PATA
    or SATA connector when selecting hard drives and expansion cards (such as display
    adapters). Data bus differences can also be the source of hardware incompatibilities,
    such as trying to use a'
