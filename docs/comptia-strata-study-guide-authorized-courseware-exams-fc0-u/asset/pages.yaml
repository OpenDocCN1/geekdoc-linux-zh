  md: '![](img/c5fa9b25d23e63f6ffb996940faeace5_375_0.png)


    Computer security, in an ideal world, lets in the right people and applications
    without any hassle, and keeps out the wrong people and applications. Of course,
    in the real world, security systems don''t always work that way. Effective security
    is a constant balance between safety and convenience. In this chapter, you''ll
    learn about the many types of threats to safety, security, and privacy, both of
    the physical computer and of its data, and how to guard against threats and attacks
    without placing unnecessary obstacles in the way of legitimate users.


    # # Understanding Hacking


    Hacking refers to a variety of computer crimes that involve gaining unauthorized
    access to a computer system or its data, usually with the intent of stealing private
    information from, or causing harm or embarrassment to, the rightful owner.


    > > The word hacker also has a benign meaning, referring to a computer expert
    who is thoroughly familiar with, and enthusiastic about, the inner workings of
    a computer system. This meaning is older, but the newer meaning, associates the
    term hacker with criminal activities, is now more prevalent.


    Some examples of hacking are as follows:


    +   - Gaining remote access to a server

    - Gaining control of an operating system

    - Logging in locally and stealing data

    - Changing a website''s content

    - Gaining access to the contents of a database

    - Surreptitiously analyzing network traffic

    - Introducing software designed to cause harm or steal data

    - Creating a condition in which a computer or network no longer works further

    - Modifying existing software so that it no longer performs as it should, or so
    that it secretly does harmful things in addition to its usual activity

    - Stealing passwords

    - Stealing personal details'
  merge: -1
  pgno: 375
- img_proc: true
  md: 'Much of this chapter is devoted to helping you understand how hackers target
    a system and how you can defend yourself. Some of the ways that hackers gain access
    to a system that we''ll explore in this chapter include the following:


    +   - Booting the System from a Disk that Contains a Utility that Can Read the
    Files from the Hard Disk Without Going Through the Existing Operating System (and
    its security)


    If hackers can gain access to certain system files, for example, they may be able
    to retrieve the Administrator password for the system. To prevent this type of
    attack, you might use BIOS-level security to prevent a PC from booting from a
    disk other than the hard disk.


    +   - Connecting to Wireless Networks and Looking for Computers or Data that isn''t
    Protected


    To prevent this type of attack, you can employ some of the networking security
    techniques discussed in Chapter 3, "Peripherals and Networking," and also later
    in this chapter, such as not broadcasting service identifier (SSID) and using
    Wi-Fi Protected Access (WPA) encryption on the network connection.


    +   - Taking Advantage of Open Network Ports to Access a Computer Remotely


    To help prevent this type of attack, you can use a firewall, which blocks unauthorized
    network traffic.


    +   - Introducing Software on a PC that Causes it to be Harmed, or Causes its
    Security to be Breached


    There are many forms of such programs. You''ll learn about their details later
    in the chapter. To prevent infection, you can use antivirus and antimalware utilities.


    # Physical Security


    Organizations lose millions of dollars of equipment every year through thefts
    and millions of dollars through the data that goes along with them. Therefore,
    it''s important to secure your computer hardware physically in whatever environment
    you place it.


    # Preventing Hardware Theft


    The risk of hardware theft varies with the environment, of course. Leaving a laptop
    unattended at an airport is a very different matter from leaving it unattended
    in your own office when you go to lunch.


    When travelling with a notebook PC or other portable technology, the emphasis
    should be placed on the physical security of the individual device. Here are some
    pointers:


    +   - Know where the device is at all times—preferably within your sight.


    +   - Don''t leave the device unattended, even for a minute.


    +   - Carry the device in an unconventional bag, rather than an expensive-looking
    laptop bag.'
