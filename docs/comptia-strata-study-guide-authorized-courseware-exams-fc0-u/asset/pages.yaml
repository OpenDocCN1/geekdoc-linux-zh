    # Physical Characteristics of RAM


    There have been various sizes and shapes of RAM modules in PCs over the years
    Today, however there are two basic types: dual inline memory modules (DIMMs),
    used in desktop PCs, and small-outline dual inline memory modules (SODIMs), used
    in portable PCs. Both of these consist of small circuit boards with RAM chips
    mounted on them and a row of metal tabs (called pins) along one edge.


    The dual in DIMM refers to the fact that the module uses pins on sides of the
    circuit board. If you count the pins (metal tabs) along one side of a DIMM, you''ll
    count half the prescribed number of pins. In contrast, earlier types of RAM, single
    inline memory modules (SIMMs), had visible metal tabs on both sides of the module.
    However, those were wrapped around the bottom of the edge so they were effectively
    the same tab on both sides. SIMMs have been obsolete for many years; they had
    either 30 or 72 pins and were used in 486 and early Pentium motherboards.


    Figure 1.7 and Figure 1.8 show a DIMM and a SODIMM, respectively. The RAM modules
    slide into sockets on the motherboard, where the pins connect with corresponding
