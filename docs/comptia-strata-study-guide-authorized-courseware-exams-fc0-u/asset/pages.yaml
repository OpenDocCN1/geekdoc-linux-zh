  md: '# Setting Up a Computer


    Some components may have a protective plastic film over them, such as the monitor
    screen or the corners or logos on a case. Pull these off and discard them.


    Set the case either on a solid desk (not a wobbly card table or tray) or on the
    floor, there is no danger of the case being knocked off or falling. If the case
    will be in a cubbyhole, drawer, or cabinet where there is limited airflow, consider
    what you can do to increase airflow to that area so the computer doesn''t overheat.


    Don''t plug in the computer''s power until you''ve plugged in all the other components;
    power should be the last cable to be connected. (You''ll learn about the plugs
    for other components in the next section.)


    As you position the desk and the computer, think about where you think you''ll
    want them, and note whether the cables will reach the case, and whether those
    cables will be draped across any areas where they may be in danger of getting
    yanked or dragged accidentally.


    # Verifying Voltage and Power Requirements


    The power supply in a PC serves two purposes: first, it steps down the voltage
    from the AC outlet to the much lower voltages required by the PC''s components.
    Second, it converts the alternating current (AC) to direct current (DC), which
    is what the PC needs.


    Personal computer power plug into standard household outlets. Depending on where
    you live, this could be 230v (such as in most of Europe) or 120v (such as in the
    USA). When you buy a computer, the company that sells it to you config your PC
    for the correct voltage based on your location. If you move to a country that
    uses different voltage, you must have your computer modified or use a power outlet
    voltage converter. Many desktop PCs have a voltage switch on the power supply
    box that you can flip to change between voltages. (You''ll need a new power cord,
    of course, because your old one won''t connect to the differently shaped AC outlet
    socket.) Laptop PCs typically require a power cord replacement when you change
    regions.


    > Look at http://electricaloutlet.org/, and compare the electrical voltages and
    outlets of your nation to that of others in your region or internationally.


    In the United States and other places that use 120v power, desktop PCs (well,
    at least the non-Macintosh ones) use the three-prong Type B power cord type shown
    in Figure 4.8. Figure 4.9 shows the connector on the back of a power supply for
    attaching a power cord. Also note the voltage switch in this figure. In the United
    Kingdom, a three-prong Type G power connector is used. In most of the rest of
    Europe, a type C or F power connector is used.'
