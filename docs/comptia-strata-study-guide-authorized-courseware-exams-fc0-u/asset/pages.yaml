  md: '# Cleaning a Computer


    when the PC powers up. If some kind of moisture is absolutely necessary, use alcohol
    on a cotton swab.


    Old circuit boards can build up deposits on the metal pins (contacts) at the edge;
    you can remove these deposits with a pencil eraser or with alcohol and a cotton
    swab. Avoid touching any of the circuitry, chips, or transistors on circuit board;
    it is easy to damage them. Handle circuit boards only by the edges.


    Other parts that tend to accumulate include the fan on the power supply, the fan
    on the processor, and the air vents. Wipe off the case''s vents with a damp paper
    towel. For the power supply, use the compressed nozzle at the opening rather than
    blowing straight into it to avoid driving the dirt deeper into the power supply
    by blowing it out.


    Notebook PCs and all-in-ones also need to be cleaned periodically, although not
    as often as desktops because there is less airflow and the vents are smaller,
    so less debris tends to accumulate. Non-desktop models are harder to get into;
    you may need to obtain instructions from the service manual to know which screws
    to remove to open one and access its inner spaces where dust and dirt may have
    accumulated.


    > Moisture inside a PC can be a problem in humid environments because water conducts
    electricity, which can create short-circuiting. Many server rooms have environmental
    dehumidifiers to control moisture in the atmosphere. You may wish to use a room-based
    dehumidifier if your region is prone to high humidity.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_226_0.png)


    # EXERCISE 5.1


    # Cleaning a Desktop Computer


    +   1. Turn off the PC, and unplug it.

    2. Clean all the externally accessible plastic surfaces with a spray cleaner designed
    for electronics and paper towels or a soft cloth.

    3. Clean the mouse, using whatever techniques are most appropriate for the model.

    4. Clean the keyboard, turning it upside down and shaking it to remove debris
    under the keys. Clean the individual keys with the spray cleaner and towels or
    cloth.

    5. Clean the monitor with a spray or towelete cleaner for monitors. Don''t spray
    the cleaner directly onto the monitor surface.

    6. Remove the cover from the case. Remove any clumps of hair or dirt with your
    fingers.

    7. If there is additional dust inside, vacuum it out with a vacuum designed for
    electronics, or blow it out with compressed air.

    8. Wait for all damp areas to dry, and then plug the computer back in and restart
    it.'
