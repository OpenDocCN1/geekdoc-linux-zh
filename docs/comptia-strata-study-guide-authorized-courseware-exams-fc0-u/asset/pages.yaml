- img_proc: true
  md: '![](img/c5fa9b25d23e63f6ffb996940faeace5_61_0.png)


    Every computer, whether it''s a high-speed supercomputer at a research facility
    or a hand-held game for children, has a processor—the component that performs
    math calculations.

    Every computer also has some type of random access memory (RAM), which is used
    for temporary data storage as data moves into and out of the processor.


    In this chapter, you''ll review the basics of processors and RAM. Having this
    information will help you evaluate these components in the computers you use,
    and maintain.


    # Processors


    Every computing device has a central processing unit (CPU), more commonly known
    as a processor (or microprocessor). Processors are part of mobile phones, gaming
    consoles, digital music players, and everything from automobiles to washing machines.
    Some computers have even multiple processors that share the computing load for
    faster performance.

    Processors are integrated circuits containing millions of electronic components
    called transistors. Transistors an important component in any electronic device,
    including a computer. Transistors are electrical gates that let power through
    or not depending on their current state. They are the basis of binary processing—that
    is, processing based on being in one of two states: on or off, 1 or 0.


    At its most level, a processor''s job is to do math. It accepts numbers as input,
    performs calculations on, and delivers others as output. It is obviously aware
    of the significance of those numbers; it just runs the instructions it has given.
    A common misconception is that the processor is the brain of the computer—it''s
    not nearly sophisticated as a human brain. It just does what it wants, like a
    hand-held calculator, but at incredibly high speed. The brains of the operation
    would more accurately be the operating system (OS), which feeds the numbers to
    the processor and uses the results.

    Different processors have different instruction sets—that is, different calculations
    they can perform. The advanced processors in personal computers (PCs) have very
    large and complex instruction sets; the simple processors in items like appliances
    have fewer instruction sets. The OS must be written with the processor''s instruction
    set in mind so it can send the right codes to activate the desired instructions.

    Processors also vary the number of bits they can accept and process as input.
    A bit is a binary digit, either 0 or 1. The more bits a processor can accept simultaneously,
    the faster it can work through the backlog of data to process. The earliest PCs
    had 8-bit or 16-bit processors; today, PCs have 32-bit or 64-bit processors. The
    higher the number of bits, the larger the word size the processor can accept.
    Word size refers to the amount of data that can simultaneously enter the processor
    in one operation.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# RISC


    Reduced instruction set computing (RISC) is based on the principle that having
    a simple instruction set for a processor improves performance. The logic is that
    the more you can ask of a complex processor, the slower it becomes. Thus a processor
    that is capable of a smaller set of tasks can complete them more quickly. The
    Advanced RISC Machine (ARM) is a popular processor found in many mobile computing
    devices, including cell phones and hand-held game machines. In contrast, most
    personal computer processors are considered complex instruction set computing
    (CISC), having a comparatively large instruction set for greater flexibility.


    Processors work only with binary digits, so the OS translates all numbers to the
    binary numbering system (digits 0 through 9). Humans most commonly use the *decimal*
    numbering system (16 digits, 0 through F) or binary numbering (2 digits, 0 and
    1). Binary is used when interacting with the processor, and hexadecimal is used
    when the OS refers to memory addresses. Exercise 1.1 demonstrates how to convert
    binary and other numbering systems.


    # EXERCISE 1.1


    # Convert Between Binary and Other Numbering Systems


    +   1. In Windows 7, open the Calculator application.


    +   2. Choose View ➤ Programmer to switch to Programmer view, as shown here. Notice
    that the Dec radio button is selected, indicating decimal numbering.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_62_0.png)'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# EXERCISE 1.1 (continued)


    +   3. Enter the number 335.


    +   4. Click the Bin radio button. The number is converted to binary (10100111).
    Notice that

    all the number keys are disabled except 1 and 0.


    +   5. Click the Hex radio button. The number is converted to hexadecimal (14F).
    Notice that

    all the number keys are active again, as are the A through F keys.


    +   6. Click the Dec radio button again to return to decimal numbering.


    +   7. Experiment on your own with more numbers. Close the Calculator app when
    you''re

    finished.


    # Processor Brands


    A variety of manufacturers produce processors that serve inside appliances and
    other non-

    computer devices. However, for personal computers, market competition has

