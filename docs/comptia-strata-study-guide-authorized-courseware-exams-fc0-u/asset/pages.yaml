    # DSL


    DSL relies on the presence of an existing telephone network where the local relay
    (normally a telephone exchange) has been upgraded to support DSL communication.
    The speeds available on a DSL service depend on the technology implemented in
    the telephone exchange as well as the quality and density of the telephone lines.
    The actual speeds you achieve from a DSL connection depend, among other things,
    on the distance your location is from the central office, a switching station
    for your phone company from which DSL is administered.


    > An early type of broadband Integrated Switched Digital Network (ISDN) was available
    in the early days of the Internet, approximately twice the speed of dial-up service
    (56 Kbps, which is really slow by today''s standards).


    DSL service is either asymmetric DSL (ADSL) or symmetric DSL (SDSL). Symmetric,
    in the context of network traffic, mean equal. A symmetric DSL connection transfers
    data at the same speed whether uploading or downloading. An ADSL connection of
    2 Mbps transfers data both ways at that speed.'
