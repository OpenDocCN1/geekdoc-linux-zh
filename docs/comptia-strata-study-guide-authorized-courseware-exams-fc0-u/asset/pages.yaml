  md: '# Monitors and Energy Savings


    The computer display, it''s built into your notebook computer or a separate stand-alone
    monitor connected to a desktop PC, consumes the most power of any component in
    an average system. CRTs consume more power than LCDs, so one way you conserve
    energy is to switch to LCDs for as many computers as possible.


    Another way to conserve power is to decrease the brightness of the monitor. Especially
    on an LCD, doing this can make a big difference; the brighter the display, the
    more light it generates, and the more light means power.


    You can change screen brightness in several ways. One is via the power plan in
    the OS. Look back at the graphics shown in Exercise 10.4, and notice the Screen
    Brightness and Adjust Plan Bright sliders. You can use these to decrease the monitor''s
    brightness under certain power plans.


    You can also manually adjust a monitor''s brightness. On a standalone monitor,
    there are typically buttons that open a menu onscreen from which you can control
    brightness along many other factors. On a notebook display, there is usually a
    brightness control associated with one or more of the keyboard keys press the
    Fn key. Hold down Fn, and press the key that is associated with Increase Brightness
    or Decrease Brightness.


    # Hard Drives and Energy Savings


    Some hard drives are more energy-efficient to operate than others. Solid-state
    drives, for example, have much lower power needs because there are no mechanical
    parts. Unless there is a read-write operation, they consume no power. Among mechanical
    hard disks, drives with lower rotational speeds sometimes use less power than
    their high-performance counterparts, although the age of the drive is also a factor;
    newer hard drives use newer technologies that make them more efficient.


    # Energy Star


    Originating in the United States, the Environmental Protection Agency Energy Star
    rating system for computer technology is now recognized internationally; many
    other nations use the standard as part of their power-reduction policies. When
    you see the Energy Star logo on a PC or computer, as shown in Figure 10.3, you
    can assume that the device meets energy-efficiency standards. For example, an
    Energy Star monitor puts itself into standby (low-power mode) when it doesn''t
    detect a signal from the PC, and Energy Star laptops are able to go into Sleep
    or Hibernate mode when the lid is shut. Energy Star also applies to motherboards,
    power supplies, and BIOSs that are able to manage power consumption.'
  merge: -1
  pgno: 435
- img_proc: true
  md: '# FIGURE 10.3 The Energy Star logo


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_436_0.png)


    Photo credit: www.energystar.gov


    # EXERCISE 10.5


    # Look for Energy Star Hardware


    +   1. Look for the Energy Star logo on all the computer hardware you have available.
    Make a list of the items that it have and the items that don''t.

    2. For each device that bears the Energy Star logo, find out what power-saving
    features the device has.


    # Virtualization and Multiple OSs


    One way to save energy is to have fewer computers. If one computer could meet
    all your needs, you wouldn''t need to have all others, right?

    If you need to run multiple OSs on a single PC, virtualization might be the solution
    you''re seeking. With virtualization, you create a separate environment inside
    the main OS, and within environment, you can run a virtual computer that has its
    own OS. It borrows memory and storage from the main system, with the virtualization
    application managing so that both OSs remain mostly unaware of each other.

    Virtualization has many uses. For example, you can use it to test an application
    to see how it runs under multiple OSs without having a separate PC with each of
    those OS set up. You can also use it to run applications that won''t run on your
    current OS.'
  merge: -1
  pgno: 436
- img_proc: true
  md: 'Many virtualization applications are available, including these:


    +   - Oracle VirtualBox (free and works on Windows, Mac, and Linux)

    - VMware Workstation, a commercial solution

    - VMware Player, free for Windows

    - QEMU, free for Windows and Linux UK

    - VMware Fusion, a Mac commercial solution

    - Parallels, a Windows-only solution


    This list is by no means definitive; new virtualization solutions are released
    every year. Another way to have multiple OS on a single computer is simple to
    install them. Place each OS on a separate hard drive. Windows includes a management
    utility that automatically allows you to select which OS to boot when you start
    up. This boot menu is enabled automatically when you install Windows on a PC that
    already has another OS on it, provided you place Windows on a separate logical
    drive.


    # 10.6


    # Run a Virtual Machine


    +   1. If possible, acquire a version of one of the virtualization applications
    listed previously. Some of them offer a free trial, and some are entirely free.

    2. Install the virtualization software, and then, within software, install a different
    OS. It can be a different version of the same OS, or an entirely different OS.


    # Efficient Printing


    You can save energy and consumables costs by limiting the amount of printing you
    do. If you don''t need to print something—don''t. View onscreen instead. If you
    need to print, you can save by printing on both sides of each page. This is called
    duplexing. Some printers duplex automatically; on those don''t, you can refeed
    the pages after printing the first side. Printer cost can also be reduced by having
    fewer printers, with each printer shared by multiple people. To further reduce
    the number of pages printed, you can set psychological barriers to printing by
    placing the printer a slight distance from the people you are using and by placing
    the printer in a public location where everyone will see what is printed.


    Most printers can also be set to power-saving Sleep modes when they aren''t being
    used. When a printer is in Sleep mode, most of its lights, LEDs, and fans turn
    off. The printer wakes up automatically when it receives a print job. This type
    of savings is part of the Energy Star system.'
  merge: -1
  pgno: 437
- img_proc: true
  md: 'A multifunction printer can reduce the need for other office peripherals by
    combining their functions into a single device. For example, some multifunction
    printers are also scanners, copiers, and fax machines.


    # Energy-Efficient Server Usage


    Servers are powerful computers, and they consume quite a bit of power. Even a
    minor reduction in the power consumption of a server has the potential to pay
    off in the long run, because a server is on 24 x 7.


    # Efficient Server Hardware


    For a server to be energy-efficient, it should have few power-consuming components
    as possible. For example, if it only needs one hard disk, it should have only
    one; and if it can accept a solid-state hard drive, all the better. A server doesn''t
    need user components like a fancy sound card or a powerful display adapter; these
    components consume power without providing a benefit to the server. It doesn''t
    need a large monitor, and the monitor can be turned off when nobody is sitting
    at the server workstation.


    You can also make a server more energy-efficient and extend its life by keeping
    it in a cold room. Computers like to be cooler than humans do, so if you reduce
    the temperature in the server room to 60 or 50 degrees Fahrenheit, they will perform
    better and use less power.


    # Combining Server Functions


    Another way to reduce the power consumed by a company''s servers is to combine
    server into fewer PCs. Often, a single PC can serve as multiple types of servers
    simultaneously. With server platforms such as VMwareXi and Citrix, administrators
    can have a selection of OSS running different roles on the same PC, limited only
    by the PC''s CPU, memory, and storage capacity. The storage can be on another
    system, with a virtual server simply performing task-specific instructions.


    # Terminal Servers


    Back in the old days of computing, a company would have a single large mainframe
    that served as a terminal server. All the users connected to it via terminals,
    which were monitors and keyboards that used the common pool of CPU and memory
    provided by the server. Term connected to the terminal server via a legacy interface.


    When desktop PCs became affordable enough for all users to have their own, people
    rejoiced, and terminal servers became much less popular. They''re still used occasionally
    to connect serial-based applications or devices to move data over a LAN.'
  merge: -1
  pgno: 438
- img_proc: true
  md: '# Remote Desktops


    Nowadays, network and Internet bandwidth is high enough that some IT departments
    are revisiting the idea of providing computer services remotely. This is most
    often seen with remote desktops, where users employ a network or Internet connection
    to connect to another PC and use it as if they were physically sitting at. Remote
    desktops enable multiple users to access the same PC from different locations
    at different times, which saves the energy and expense involved in maintaining
    separate PCs for people who job-share, for example. Security administration and
    file backup costs are also reduced.


    Some versions of Windows with a Remote Desktop application. Third-party remote-desktop
    applications are also available, as well as Internet-provided desktop services
    such as GotoMyPC.


    # Network Attached Storage


    A network attached storage (NAS) is a network-aware hard disk or other storage
    unit that network users can use to share files. NAS devices are less expensive
    than file servers, and they''re more energy-efficient to operate.


    Inexpensive NAS devices can be attached to a router via Ethernet. In addition,
    some routers come with their own internal hard drives for NAS capability. For
    example, the Apple Time Capsule is a wireless router and Ethernet switch with
    a high-capacity drive. The Time Capsule works with the Time Machine software included
    in Mac OS X to maintain a continuous backup for all users on the network.


    # Energy Conservation in Business


    The energy-saving methods discussed so far in this chapter are small, individual
    things that add up to big savings over the long run. But if you''re a decision-maker
    involved in a business''s long-term plans, you can make energy-conservation decisions
    about the company''s big picture that can make a significant impact immediately.
    The following sections explain some of the ways that a business can save on both
    energy and expense by “going green."


    # Green Building Infrastructure


    Green building is the process of designing and building a home or business so
    that it''s energy-efficient and sustainable as possible, from choosing the site
    and constructing the building to operating and maintaining it on a daily basis.
    The objective is to reduce the building''s overall impact on human health and
    the natural environment by efficiently using energy and water, protecting occupant
    health, and reducing waste, pollution, and environmental degradation. Green IT
    refers to environmentally responsible computing, which can be part of an overall
    green building plan for a company.'
  merge: -1
  pgno: 439
- img_proc: true
