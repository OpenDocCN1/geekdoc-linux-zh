  md: '# Tools for Optimizing Performance and Fixing Problems


    Several software tools are available that make a PC run better and faster by fine-tuning
    settings, eliminating bottleneck-causing errors, or providing information about
    trouble spots that may be creating problems behind the scenes. Table 5.9 summarizes
    some of these tools that come with Windows 7 (Utilities that improve disk performance
    specifically covered in Table 5.10 and aren''t included here)


    # TABLE 5.10 Troubleshooting and performance-monitoring/enhancing tools


    | Utility | Description | Accessed From |

    | --- | --- | --- |

    | Windows Experience Index | Evaluates the performance of key components, and
    tells you which one is the bottleneck in performance | Start > Control Panel >
    System And Security, and the system heading, check The Windows Experience Index.
    |

    | Resource Monitor | Provides moment-by-moment information about CPU, disk, network
    and memory usage | Start > All Programs > Accessories > System Tools > Resource
    Monitor. |

    | Windows Update | Finds and downloads the latest updates for Windows and for
    some applications and hardware devices to add new features and/or correct problems
    security holes | Start > Control Panel > System And Security > Windows Update
    |

    | Action Center | Provides information about any problems the system has encountered,
    and suggests fixes | Start > Control Panel > System And Security > Action Center.
    |

    | Event Viewer | Lists information and error messages generated by the OS for
    advanced troubleshooting using | Start > Control Panel > System And Security >
    Administrative Tools > Event Viewer |

    | Task Manager | Lists the currently running applications and processes, and enables
    you to shut down any that has stopped responding | Right-click the taskbar or
    press Ctrl+Alt+Delete, and then click Task Manager |

    | Troubleshooting | Walks step by step troubleshooting procedures with yes/no
    questions | Start > Control Panel > System And Security > Action Center, and then
    scroll down to the bottom of the page and click Troubleshooting. |

    | System Restore | Enables you to return your system files to an earlier backed-up
    copy to correct recently developed system errors | Start > Control Panel > System
    And Security > Action Center, and then scroll down to the bottom of the page and
    click Recovery |'
