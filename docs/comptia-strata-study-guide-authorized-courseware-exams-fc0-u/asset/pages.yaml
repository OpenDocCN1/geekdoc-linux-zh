  md: 'Internet Privacy and Security 341


    # Firewalls


    Firewalls prevent unauthorized activity on particular ports. A port is a TCP channel
    used to transport network traffic. There are many TCP ports, some reserved for
    common services such as FTP, HTTP, email, and so on. Most firewalls filter traffic
    based on rules, which are based on ports and trusted zones. These can be pathways
    for a hacker to abuse. Most OSs have a software-based firewall that is enabled
    by default. Hardware-based firewall devices are also available, but they''re usually
    used on servers and not on individual PCs.


    When you''re connected to a network that you may be sharing with others you don''t
    know, you should make sure a firewall is running. A firewall is also important
    whenever you''re connected to the Internet, which is essentially just a public
    network. Some firewalls block all incoming traffic on port unless your system
    has initiated a network connection with an outside service (such as a website
    you''ve visited). You can configure a firewall to let certain applications in
    and keep others out. See Exercise 6.6, "Configure the Windows Firewall," in Chapter
    6 for practice configuring a firewall.


    # Internet Privacy and Security


    After you''ve established an Internet connection, a whole new set of security
    and privacy concerns comes into play. There are threats from many directions,
    including from pop-ups, cookies, phishing, and so on, as well as more human threats
    such as artists who try to get you to reveal information you shouldn''t.


    # Identity Fraud and Social Engineering


    Online, it''s easy to impersonate someone. You don''t even have to look or sound
    similar. All you need is enough personal information about them to trick a website
    or service provider. That''s how millions of consumers are ripped off each day.
    Identity fraud is a very real and dangerous online.


    The most important thing you can do to prevent someone from stealing your identity
    is to use strong passwords, as described earlier in this chapter, and change them
    frequently. Gaining access to someone''s username and password is one of the most
    common ways that criminals operate. If you keep your passwords written down somewhere,
    guard that piece of paper (or electronic file) as closely as you would a valuable
    possession.


    Ironically, many people freely give away the information that thieves need to
    impersonate them, out of naïety. Tricking someone into sharing personal information
    or letting their guard down so a criminal can exploit is called social engineering.
    This isn''t new—people have been ripped off through deception since the beginning
    of history. Here are some examples:


    +   - Someone (in person) to gain your trust, in order to get you to reveal personal
    information'
  merge: -1
  pgno: 398
- img_proc: true
  md: '+   An email or pop-up message designed to trick you into revealing personal
    information


    +   A phone call or instant message, again designed to trick you into revealing
    personal information


    The personal touch is often the hardest to resist, because the individuals concerned
    are normally good at encouraging you to reveal personal information—it''s more
    difficult when you''re unsure if they''re genuine—it''s unpleasant to mistrust
    everyone.


    This book can''t teach you judgment and provide you with the life experience to
    discern who is honest and who is dishonest. However, you may wish to consider
    with care anyone who asks about the following:


    +   * Your preferred email address


    +   * Where you were born


    +   * Your maiden name (if you have one)


    +   * Your mother''s maiden name


    +   * The school(s) you went to


    +   * Where you currently live


    +   * Your date of birth


    +   * Your favorite sports team


    +   * The type of music you listen to


    As you can see, such questioning could give enough information to work out the
    answers to forgotten-password security questions as well as commit identity fraud.
    Unexpected phone calls that include questioning can also be an issue. It''s possible
    to make you believe that the call may be genuine and from your bank or your company''s
    network administration team.


    # Web Browser Risks


    Web browsers by downloading and displaying web pages, which are, essentially,
    programming scripts. The script is rendered as a web page by your browser on your
    local PC.


    The trouble is, at the moment when page is downloaded, there are numerous opportunities
    for a hacker to take advantage of the connection in various ways. For example,
    your requests for pages can be intercepted on their way to the server. This can
    compromise your privacy, because someone can see what pages you''re requesting.
    More important, however, it can compromise any login information you may be sending
    to a financial or business site. Scripts can also contain malicious code that
    affects your system, making it perform unwanted activities like sending your private
    information to a third party or displaying countless ads. Web pages can also have
    embedded Flash or Java applications that can do harm in some cases.'
