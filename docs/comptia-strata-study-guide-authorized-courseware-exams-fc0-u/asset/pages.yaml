  md: '# Memory Bus Speeds


    The pathway that delivers data to from the memory is called a memory bus, Memory
    has a bus width that determines how many columns are in each row of storage. All
    the bits in a single row are read together as a single value, so the wider the
    memory bus width, the more data that can be read at once. For example, in memory
    with an 8-bit width, you might have a number like 01001100. In memory with a 32-bit
    width, you could have a number up to 32 digits.


    The memory bus also has a speed, which determines how quickly data will travel
    on its pathway. Memory on modern PCs is synchronized (that is, synchronous) with
    the system bus, in turn is controlled by the system timer on the motherboard.
    The system determines the speed at which data enters the processor. Memory that
    operates at the same speed as the front-side bus is called (SDR) synchronous dynamic
    read-only memory (SDRAM).


    The successor to SDR SDRAM was double data rate (DDR) SDRAM, also called DDR1.
    It makes higher rates achievable by strictly controlling the timing of the electrical
    data and clock signals so that data can be double-pumped into the RAM: pumped
    on both the rising and the falling of each tick of the internal system clock (see
    Figure 1.6). The name double data rate is a reference to DDR''s capability of
    achieving nearly the bandwidth of SDR.


    # FIGURE 1.6 DDR data transfer


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_75_0.png)


    After DDR1 came DDR2 SDRAM, which enables greater throughput and requires lower
    power by running the internal clock at half the speed of the data bus, in addition
    to double-pumping the bus. This effectively multiplies the DDR1-level performance
    by two, so that there are a total of four data transfers per internal clock cycle.


    DDR3 goes even further, once doubling the data rate, to a total of eight times
    the original SDR throughput. It also uses about 30 percent less power than DDR2
    modules because it uses a lower voltage. The main benefit of DDR3, and the reason
    it doubles the data rate, isn''t due to a increase in the pumping, but due to
    the use of a deeper prefetch buffer. A prefetch buffer is an extra buffer in the
    RAM that allows quick access to data located on a common row in the memory. (A
    buffer is a simpler version of a cache).


    Generally speaking, most motherboards accept only one type of RAM: SDR, DDR, DDR2,
    or DDR3. Even if the motherboard is physically compatible with other types, it''s
    programmed to work with RAM at a certain speed.'
