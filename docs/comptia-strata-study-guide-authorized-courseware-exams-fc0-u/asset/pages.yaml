    # Installing Applications


    PCs don''t exist to run OSs, of course—they exist to run applications that enable
    users to perform useful tasks like writing letters, calculating budgets, and creating
    artwork.

    In this section, you''ll learn about installing applications. The actual process
    of installing an app can be pretty simple, but there are often other things to
    consider in preparation beforehand.


    # Assessing Compatibility and Minimum Requirements


    On the box for each retail application you buy, and in the documentation for each
    application available for download, you will find a Minimum System Requirements
    section. This usually includes a list of compatible OS versions, a minimum processor
    speed, a minimum amount of RAM, and a minimum amount of hard disk space available.
    There may also be additional requirements, such as a particular display adapter
    or amount of display adapter RAM.


    Besides the generic minimum requirements, you would also be to research compatibility
    issues before spending a lot of money on an application. For example, some applications
    (particular-games) have known problems with certain display adapters.


    > When you have enough hard-disk space, keep in mind that at least 15 to 20 percent
    of the hard-disk space should be left empty to ensure best performance. Don''t
    assume that if your hard disk has 1 GB of space left on it, you can install an
    application that requires 1 GB of space.


