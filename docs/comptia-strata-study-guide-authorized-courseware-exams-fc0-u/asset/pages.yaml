    # Routers and Switches


    Routers and switches are connection boxes with multiple plugs into which you can
    attach devices. A switch handles the incoming traffic from the various cables
    connected to it and directs the data to the appropriate outward-bound line.


    A router is a smarter version of a switch, able to direct traffic not only within
    your local network but also to other connected networks (including the Internet).
    A router attempts to find the best route from point A to point B, even if the
    points are halfway around the world.


    The Internet is full of routers, and routers direct the messages you send to the
    recipient''s address. When you send email to a friend, you don''t have to specify
    the names of all the servers to pass through on the way—routers handle that task.
    You specify the end address, and the routers plan and execute the journey.


    Routers can be wired, wireless, or both. A wireless router has an antenna that
    helps it communicate with wireless devices, such as notebook computers, wireless
    printers, and entertainment devices like a TiVo (see Figure 3.11). To share an
    Internet connection with multiple computers in a home or office, you need a basic
    router. Larger and more sophisticated routers are used for high-traffic commercial
    applications.'
