  md: 'Being a responsible computer user includes understanding and complying with
    guidelines that ensure a safe, legal, and environmentally conscious computing
    experience. In your region, you''ll learn about procedures to follow to make sure
    you do not pollute the environment or run afoul of the law when using a computer.
    You''ll also learn about some green IT practices that many companies are employing
    to save themselves money as well as to prevent unnecessary strain on the environment.


    # # Safe and Legal Disposal of Hazardous Substances


    Certain computer components and consumable supplies can pollute the environment
    if you dispose of them along with your regular trash. That''s why, in some countries,
    laws or guidelines require special disposal techniques for certain items. The
    laws vary depending on the country and state in which you reside, so it''s important
    to familiarize yourself with what''s required in your region. In addition, if
    your region doesn''t require a certain environmentally friendly disposal technique,
    you may wish to go the extra mile to help the environment and practice that disposal
    mayhem.


    # ## Restriction of Hazardous Substances (RoHS)


    In 2003, the European Union passed the Restriction of Hazardous Substances (RoHS)
    Directive, and it took effect in 2003. This directive restricts the use of six
    hazardous materials in the manufacturing of various types of electronic equipment.
    These substances are lead, mercury, cadmium, hexavalent chromium, polybrominated
    biphenyls, and polybrominated diphenyl ether (The latter two are flame-retardants
    used in some plastics). It''s closely linked to the Waste Electrical and Electronic
    Equipment (WEEE) Directive, which sets collection, recycling, and recovery targets
    for electrical goods.


    Consumer components that may be affected by RoHS include anything with a circuit
    board in it, computers, cell phones, routers, and printers. RoHS is primarily
    an issue on which device manufacturers focus; consumers aren''t required by law
    to do anything. However, consumers are strongly encouraged to dispose of items
    that contain one or more of the six restricted substances by recycling electronic
    components or delivering them to a hazardous-materials facility rather than discarding
    them in the trash.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_424_0.png)'
  merge: -1
  pgno: 424
- img_proc: true
  md: 'RoHS doesn’t require specific product labeling, but many manufacturers have
    adopted their own compliance marks. Visual indicators may include “RoHS Compliant”
    labels, green leaves, check marks, and “PB-Free” markings. The WEEE trashcan logo
    with an X through it is also an indicator that the product may be compliant (see
    Figure 10.1).


    # FIGURE 10.1 The WEEE Directive logo


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_425_0.png)


    # Battery Disposal


    All batteries contain toxic substances, such as metals, and can contaminate the
    environment. Wet-cell (lead-acid) batteries, such as those used in cars and boats,
    and are the most environmentally harmful and have the most stringent disposal
    guidelines. However, dry-cell batteries, such as those used in PCs and other electronics
    equipment, are also environmentally hazardous. They contain heavy metals as mercury,
    lead, cadmium, and nickel, all of which can contaminate the environment when not
    disposed of properly, and can release toxic chemicals into the air when incinerated.


    Some of the places where batteries are used in PCs include the following:


    +   * Portable computing devices (laptops, phones, and so on)

    * Wireless input devices, such as wireless mice and keyboards

    * Motherboards

    * Uninterruptible power supplies (UPSs)


    Most regions have laws requiring retailers that sell certain types of batteries
    to collect them for recycling. The exact rules depend on the battery type and
    the region. For example, the Battery Directive in the EU (2006) regulates the
    manufacture and disposal of batteries in the EU. These regulations do not require
    consumers to recycle; they only require retailers to make that option readily
    available. The same is true in the United States. Consumers aren’t required to
    recycle most batteries, but vendors are required to take them if consumers want
    to bring them back.'
  merge: -1
