    # Backup Solutions


    Computer users often take their data for granted, forgetting the large quantity
    of important and irreplaceable documents, images, and music files they collect
    over the years. A hard disk failure or virus can wipe out of stored memories,
    not to mention files of significant value to a business.


    There are many ways to ensure that a system failure doesn''t result in data loss.
    In Chapter 2 (“Core Computer Hardware”), for example, you learned how a multitask
    RAID system protects against data loss caused by a physical hard disk failure
    by mirroring a drive (RAID 1) or striping data across multiple drives (RAID 5).'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Preventing Data or Service Loss 183


    You don''t need anything as complex as a RAID system to keep your data safe. Here
    are some other methods:


    Use a Local Backup Application Backup programs, as the Backup and Restore utilities
    that come with Windows 7, enable you to select the files to back up, the media
    on to back them up, and the interval at which to do it.


    Use an Online Backup Service There are many economically priced services available
    online that will automatically back up the files you choose at the interval you
    specify. Such a service works much like a local application except that the files
    are stored safely off site.


    Copy Files Manually to Another Drive You can copy files to a secondary hard disk
    or to removable disk, such as a writable CD or DVD or a flash drive. The drawback
    is that you have to remember to do it.


    Make a System Image Some backup utilities, including the one that comes with Windows
    7, make a system image, an exact copy of every hard disk. You can do that to create
    a snapshot in time of your system, and then restore it if something ever happens
    to the original. The drawback is that a whole-drive image takes a long time to
    make, so you won''t want to do it very often.


    Table 5.1 summarizes the backup solutions available and their characteristics.


    | Local Backup | Online Backup | Manual Copy | System Image |

    | --- | --- | --- | --- |

    | Automated? | Yes | Yes | No | No |

    | Quick? | Yes | Yes | Yes | No |

    | Recoverable after a virus infection? | Only backup drive isn''t also infected
    | Yes | Only backup drive isn''t also infected | Yes |

    | Recoverable after a hard-disk crash? | Yes | Yes | Yes | Yes |

    | Secure from theft or natural disaster? | Only backup is stored off site | Yes
    | Only backup is stored off site | Only backup is stored off site |

    | Free? | Yes, if Windows Backup is used | No | Yes | Yes, if Windows Backup is
    used |'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# Chapter 5 • Maintaining a Computer


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_241_0.png)


    > Windows includes a System Restore feature that backs up important system files,
    such as the files that make up the Windows Registry. These files are essential
    for Windows operation, but they don''t include your data. Therefore, saving a
    Restore point isn''t a substitute for backing up data.


    When considering a backup solution, the following questions are pertinent:


    +   - How often do you plan to back up? For business-critical data, every day
    is appropriate. For casual users and their personal files, a week or once a month
    might be enough.


    +   - How large are the files? Backing up a large amount of data takes more time
    and takes more disk space. You may choose to back up large files like videos and
    music less than other files for this reason.


    +   - What backup software is available? Many different applications will do local
    and online backups and systems. Some have more features and higher price tags
    than others.


    +   - Should each backup recover all files, or should there be incremental backups
    done that copy only files that changed? Backup programs enable you to choose among
    the following settings:


    Back ups everything, regardless of what''s changed since the last backup.


    **Differential** Back up only what''s changed since the last backup.


    **Incremental** Back ups only what''s changed since the last backup of any kind
    (not just full).


    Whatever backup guidelines and procedures your company or school implements, it''s
    important that you follow them. In many cases, backups will be automatic and invisible
    to the end user; but if you''re asked to run a backup utility on a certain device,
    make sure you so.


    # Drive Recovery


    In the event of a system failure, you may be able to recover some data even if
    you haven''t diligently made backups as you should have.


    When a computer fails to boot, it''s not always the hard disk''s fault. A variety
    of components can fail, resulting in a nonworking system. If the problem turns
    out to be anything other than the hard disk, your data is safe—it''s temporarily
    inaccessible. You can put the hard in a different PC, or hook it up as an external
    drive with internal-to-USB drive connection to retrieve your data. You may be
    able to boot from a Linux boot CD or DVD to access the data from a drive that
    won''t boot its OS.


    If the problem occurred because of a logical error on the hard disk, or a virus
    or other software problem that caused the drive''s *master file table (MFT)* or
    partition table to be damaged, you may be able to recover some of the files off
    by using a special disk-recovery program. Such programs aren''t cheap; plan on
    spending $100 or more. If the files are worth more than that to you, it may be
    your best bet.'
  merge: -1
  pgno: 241
