  md: '# Chapter 9 • Security Access Control


    other is a security threat: a virus or Trojan infection may copy a stored password
    from a cookie and deliver it to someone who can steal your login information for
    a site to commit identity theft or other type of fraud.


    Cookies can be divided several ways. A first-party cookie is placed on your computer
    by a website you visit. For example, when you go to www.amazon.com, a cookie provides
    your website so that the site can welcome you by name. A third-party cookie is
    placed on your computer by an ad''s parent company isn''t related to the owner
    of the website, as you browse on Facebook, a third-party cookie may record the
    ads you''ve clicked, identifying your interest in certain products.


    A session cookie lasts as long as your web browser is. When you finish your web-browsing
    session, session cookies are deleted. A persistent cookie stays on your hard disk
    after you close the browser, indefinitely or for a certain number of days.


    All browsers can be configured to control how your system stores all of the types
    of cookies. You can create rules for cookie handling, set certain sites from which
    you''ll allow or deny cookies, and delete existing cookies. Each browser does
