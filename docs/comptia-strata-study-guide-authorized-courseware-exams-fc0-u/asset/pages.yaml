    # FTP


    You can download files from a website, but to upload and download files in bulk,
    many individuals and companies prefer to use a different system designed specifically
    for transfer: File Transfer Protocol (FTP).


    FTP is a very old protocol, used in the early days of the Internet before web
    access was popular. FTP server functions as a drop box from which you can pick
    up and to which you can deposit files. FTP servers are public; others are password-protected.


    Most people use an FTP client to do FTP transfers. However, in you can also use
    a web browser for FTP downloads, and in some cases (depending on the browser and
    the FTP server). One free FTP client is FileZilla (www.filezilla-project.org).


    FTP addresses begin with ftp://, just like web addresses begin with http://. This
    prefix tells the application what protocol to use. In an FTP client, the protocol
    is assumed. However, when using a web browser for FTP, you must make sure to add
    prefix to FTP address.'
