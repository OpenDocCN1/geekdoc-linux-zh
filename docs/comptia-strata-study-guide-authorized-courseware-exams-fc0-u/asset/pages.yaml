  md: '# Touch Screen and Stylus Input


    A **screen** is a pressure-sensitive video display. Touch screens are found at
    bank ATMs, airport check-in counters, mall kiosks, and many other locations where
    consumers need to interact with a video display without a keyboard or mouse.


    Tablet computers are notebook computers that use touch-screen technology, either
    as a primary or secondary form of user input. Some tablet computers, like the
    Apple iPad, use the touch-screen capability for all input, including keyboarding.
    (A keyboard appears on the video display, and you touch the type.) Others have
    a built-in keyboard or/or mouse via USB port.


    Most modern screens are finger-touch activated, but earlier models, especially
    those for Windows-based tablet PCs, used a technology called pen computing. Touch
    activated only when touched by a special stylus that comes with the device. The
    stylus transmits a signal to sensors in the display''s surface to make the connection;
    a plain finger-touch does nothing. Some gaming consoles, like the Nintendo 3DS,
    also use this technology.


    # Game Controllers


    Gaming consoles have input controllers specifically designed for gaming play,
    which is one reason why the consoles are so popular with gaming enthusiasts. Similar
    controllers are also available for personal computers to making games easier and
    more enjoyable. For example, game controllers that are identical to those with
    popular gaming consoles are available for PCs, as joysticks that make it easier
    to fly simulator games.


    # Internal and External Storage Devices


    After data enters the computer via an input device—then what? The incoming data
    is temporarily stored in RAM, but eventually it has to be saved to a storage device
    to preserve it. A variety of storage devices are available for personal computers,
    each with its unique set of pros and cons in terms of speed, cost, portability,
    and convenience. In this section, you''ll learn about some of the most popular
    storage devices available.


    Storage space is measured in kilobytes (KB, thousands of bytes), megabytes (MB,
    millions of bytes), and gigabytes (GB, billions of bytes). The original storage
    device for a personal computer, the floppy disk, held between 360 KB and 1.44
    MB, which seems laughably small nowadays. But at the time, entire applications
    could be stored on a single disk. Table 2.1 summarizes the various measurements
    of storage capacity and provides notes and examples. Note that the multiples aren''t
    thousands, but multiples of 1,024. That''s because of the binary nature of number
    in computers. For example, a kilobyte is 1,024 bytes, not exactly 1,000. The decimal
    value 1024 is 10000000000 when converted to binary.'
