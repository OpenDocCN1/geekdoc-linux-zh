  md: '# Chapter 2 · Input and Storage Devices


    Now let''s say that #2 of the set fails. Looking at the other data you have, you
    know that the first number is 1, the third number is 1, and the parity is 0. Even.
    With that information, you can deduce that the missing number is 0. Voilà, you''ve
    just reconstructed it. When RAID stripes data across multiple devices, it alternates
    which will hold the parity bit so that the data is evenly across all drives. Then,
    if one of the drives needs to be replaced, a utility can reconstruct every bit
    that the old drive contained. That''s the general concept, but in all except RAID
    2, the data is striped in 64KB chunks, rather than individual bits. Working with
    larger blocks of data makes the operations faster.


    # Low-Level Formatting


    When a disk is manufactured, its surface is one large area. Before the disk can
    accept any data, an organizational structure must be imposed to uniquely each
    physical location on the disk. That way, the drive controller can specify the
    exact physical spot where a given bit of data should be written or retrieved.


    Here are the organizational units into which a disk is divided:


    **Heads** Almost all disks are double-sided. There is a separate read/write head
    for each side. On hard drives, there are usually stacked platters, each with a
    top and bottom head.


    **Tracks** Each disk is divided into concentric rings *tracks*, like the rings
    on a cross-section of a tree. A high-capacity hard disk can have tens of thousands
    of tracks.


    **Cylinders** The read/write heads move in and out of a single actuator so that
    all the heads are in the same in-position at all times. The stacks of tracks accessible
    at a given arm position is the same as the number of tracks on a single disk side.


    **Sectors** The surface of the disk is further divided into pie slices by lines
    that cross over the lines. These lines intersect the tracks, create small segments
    called *sectors*. Sectors are uniquely numbered, and can be referred to by their
    numbers when data is needed. Each sector has 512 bytes on most.


    This slicing of the disk into logical units is accomplished by a procedure known
    as low-level formatting. *Low-level formatting* determines the number and spacing
    of the tracks and the number and spacing of sectors per track. Together, these
    factors determine the total number of sectors on the disk and therefore its storage
    capacity.


    Hard disks are low-level formatted at the factory. A label hard drive casing reports
    the number of cylinders, heads, and sectors for sometimes abbreviated CHS. Another
    name for the drive''s organizational characteristics is *geometry*. BIOS setup
    requires this information in order to communicate with the drive.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_107_0.png)


    > In the early days of hard disks, the CHS values referred to the physical reality
    of how a disk was low-level formatted. Today, however, that is no longer the case.
    A drive''s CHS values do''t necessarily refer to the exact physical arrangement
    of the drive, but to the logical way that the drive controller sees it as it communicates
    with it. For example, a drive''s label report that it has 16 heads (8 platters)
    when it actually has 3 or 4.'
