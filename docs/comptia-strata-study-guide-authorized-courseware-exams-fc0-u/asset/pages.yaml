- img_proc: true
  md: 'On the other hand, asymmetric means unequal. With an asymmetric DSL connection,
    the upload speed is slower than the download speed. An ADSL connection may download
    at 12 Mbps but upload at only 1.8 Mbps, for example. For most people this is acceptable
    because the volume of data is much higher coming to than going from them.


    DSL service is typically much less expensive than SDSL, and it works for most
    users. People who need high-speed uploading, though someone who is running on
    an Internet file-sharing service, may find it worthwhile to pay extra for DSL
    service.


    DSL service requires a telephone line, of course. You also need a DSL terminal
    adapter (modem). Some service providers distribute a box that is a combination
    of a DSL modem and a router (wired or wireless) for sharing the DSL connection
    with multiple computers. Others provide just a basic DSL terminal adapter, and
    you must provide your own router if you want to share your connection. You may
    also need a splitter, or a micro filter, to separate the analog telephone signal
    from the digital Internet signal, passing through the same lines.


    # Cable


    Cable service uses the unused bandwidth on the cables that carry your TV signal.
    Cable service in many areas is faster than DSL, but it''s a shared pool. If your
    neighbors are also heavy Internet users, you may be experiencing a slowing of
    your service at peak usage times. Cable service is symmetric, so upload and download
    speeds are approximately the same, unless your cable company throttles upload
    speeds (for example, to discourage users from running high-traffic servers from
    their homes).


    To get Internet from your cable TV provider, you''ll need a cable modem. The providers
    typically lease these to you, so you don''t have to buy your own and avoid obsolescence.
    A cable modem accepts input from a coaxial cable from the wall, the same cable
    that brings in your TV programming. It has an RJ-45 output jack, just like that
    of an Ethernet cable, which can then be connected to a broadband router (wired
    or wireless) to share the cable connection with multiple computers in your home
    or office.


    # Satellite


    Satellite Internet isn''t as fast or as efficient as cable or DSL, but it''s more
    widely available. Where cable service requires you to be within the service area
    of your phone company''s central office, satellite Internet can be picked up anywhere
    that has a clear view of the southern sky. Satellite service is symmetric, like
    DSL; you may have a download speed of 1.5 Mbps and an upload speed of 256 Kbps,
    for example.


    Satellite Internet requires a special satellite dish, similar to the used for
    satellite TV, but with a transmitter on it. (Ordinary satellite dishes are receiver-only.)
    Two cables run from the dish to your residence—one for input and one for output.
    These cables connect to a satellite terminal adapter (modem), which then connects
    directly to a PC or to a broadband router to share the connection.


    Satellite service is more susceptible to weather conditions, and it may cut out
    during rain or snowstorms. It''s slower and more expensive than month or DSL,
    and you usually have to buy all the equipment up front, rather than lease it.'
