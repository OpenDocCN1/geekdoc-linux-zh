    # Deleting Files and Folders


    When you no longer need a file or folder, you can delete it. Deleting a folder
    deletes all the files within it, so be careful not to delete folders that contain
    files you want to keep. You can select the file or folder and press Delete on
    the keyboard, drag the file or folder to the Recycle Bin (Windows) or Trash (Mac).

    At a prompt, you can use rmdir (Windows, Mac, Linux) or rd (Windows). In Windows,
    rd or rmdir works only if the folder is empty. If it’s not, use the delete command
    (or de\, in some Windows versions), to avoid deleting all the files and subfolders
    first. Table 5.6 summarizes the commands and procedures for deleting files and
    folders.


    # TABLE 5.6 Deleting folders and files


    | Operating System | Command/Procedure | Example |

    |---|---|--|

    | Windows (graphical interface) | Select the file or folder and press the Delete
