    Nowadays, most people use always-on broadband connections for Internet access.
    Broadband literally means a wide pathway, capable of carrying data at a high rate
    of speed. There are two major technologies in the broadband Internet service market:


    **Digital Subscriber Line (DSL)** Carries Internet signals through telephone lines.


    **Cable** Carries Internet signals through the same channels that deliver cable
