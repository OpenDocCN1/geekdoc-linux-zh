  md: '![](img/c5fa9b25d23e63f6ffb996940faeace5_349_0.png)


    When computers don''t work properly, they can create big headaches for the users
    who rely on them. In this chapter, you''ll learn how to troubleshoot some common
    operational problems with personal computers, including crashes, error message,
    lockups, and hardware failures.


    # # Startup Failure


    The operating system provides the platform from which you launch all the activities
    you do with a computer, so when it doesn''t start, nothing productive can happen
    until you fix it. Depending on the OS and version, the steps involved for troubleshooting
    will vary. The following sections present some general guidance and introduce
    some troubleshooting tools that may be useful.


    # # Nothing on the Monitor


    If you turn on the computer and nothing happens—no fan spinning, nothing—you probably
    have some type of power problem. Check that the computer is plugged in. A bad
    motherboard or CPU can also cause the computer to appear dead. Those failures,
    however, are less likely if the computer has been working in the past than if
    you''re assembling a new one from scratch.


    If you hear fans spinning but nothing shows up onscreen, there''s probably an
    issue with the monitor, display adapter, memory, or motherboard. It can be difficult
    to figure out which of these may be faulty without an error message to guide you.
    If you have a spare display adapter or DIMM, you can try swapping it out, but
    it''s often easier to take the computer to a repair shop at this point.


    If you''re determined to troubleshoot on power-on, a device called a POST card
    can help. POST test is a circuit board that you insert into an open slot in the
    motherboard. The card displays a two-digit numeric code on its LED to tell you
    where the system is in the booting process. A boot accompanies the POST card tells
    you what each number represents. When the boot process stalls, read the code on
    the POST card and look it up to figure out where the boot process has broken down,
    and that may tell you which component has failed.


    # # Black-Screen or Blue-Screen Error Message


    A plain-text error message (gray text on a black screen) is usually a message
    from the BIOS prior to the OS load. A failed or soon-to-be-failed hard disk most
    often triggers such'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# Startup Failure


    message. The exact wording of the BIOS-thrown error messages varies depending
    on the BIOS company and version; you may see a message like "Disk Drive Failure"
    or "No Boot Disk Found."


    Although hard-disk errors are the most common errors that appear before the OS
    load, they aren''t the only errors that appear at this point. You may see a message
    that the keyboard has a stuck key, for example, or that there is an error involving
    RAM.


    If the error appears as grey or white text on a bright blue background, that is
    a STOP error. It is called a STOP because the first word on the screen is usually
    STOP, and the PC freezes up when it happens, requiring you to power the PC off
    and back again. Some call this a Blue Screen of Death (BSOD). This type of error
    often means a piece of hardware (something like a network adapter, sound card,
    or modem) is defective or incompatible with your Windows version, but there are
    also reasons for STOP errors, specific to the error code displays.


    To diagnose a STOP error, look up the code on the website that provides a directory
    of such errors. Here are a few good sources to get started:


    ```

    http://www.aumha.org/windows-xp/xp-stop-errors/

    ```


    ```

    http://pscoupport.about.com/findbyerrormessage/tp/stop_error_list.htm

    ```


    Based on what you discover, you may need to remove or replace a hardware component
    or reinstall the OS.

    Windows requires certain files to be present to start. These files are mostly
    stored in the C:\Windows\System32 or C:\WindowsSys64 folder, and include Winload.exe,
    Ntoskrnl.exe, Hal.dll, WinLog.exe, and others. If any of these files are unavailable,
    Windows will not load and an error message will tell you what missing. You may
    need to repair or reinstall Windows to fix the problem. If you have the setup
    CD for your version of Windows, you may be able to boot into the Recovery Environment
    (Windows Vista or 7) or the Recovery Console (Windows XP) to repair. (See the
    section "The Recovery" later in this chapter for details.)


    Having all the critical files it needs to load, Windows reads information from
    the Registry as it boots. The Registry informs it of the settings, what device
    to drive, and what programs start up automatically in the background. If any of
    the files for this process are unavailable, an error message appears or the boot
    process simply hangs, usually after the Windows logo has briefly appeared. You
    may be able to boot the PC using Safe Mode, which bypasses all most options; if
    the problem is with one of the noncritical files, that problem will be temporarily
    disabled enough to start the system. After starting up Windows (in Safe Mode if
    necessary), if the problem was caused by a recently installed item of hardware
    or software, you may be able to use System Restore to return the system configuration
    to its earlier state, whatever action caused the problem to occur.


    # Windows Won''t Load'
  merge: -1
