  md: '# # Introduction


    Are you considering the benefits of a CompTIA Strata certificate for your career—or
    even for your own benefit? Thousands of people today already have become Strata
    certified, demonstrating that they have the skills and knowledge required to install,
    use, and maintain computer hardware and software. This book will help you prepare
    to succeed at the Strata exams.


    # # What Is Strata Certification?


    The official CompTIA description of Strata is “an entry-level certificate that
    ensures a knowledge of PC components, functionality, compatibility, and related
    technology topics.

    The exam covers the explanation of technology of computer hardware, compatibility
    issues and common errors, software installation and functions, and security risks
    and prevention. The exam also assesses the candidate''s knowledge of Green IT
    and preventive maintenance of computers.


    Job roles include network and system administrator, sales engineer, account manager,
    and business development manager. Strata is for individuals and students preparing
    to enter the IT workforce or professionals changing careers to IT or technology-related
    fields. This certificate can be a stepping-stone to higher certifications, such
    as CompTIA A+, CompTIA Network+, and CompTIA Security.


    CompTIA is a non-profit information technology trade association. CompTIA’s certifications
    are designed by subject matter experts from across the IT industry. Each CompTIA
    certification is vendor-neutral, covers multiple technologies, and requires demonstration
    of skills and knowledge widely sought after in the IT industry.


    # # Differences in UK and US Exams


    In the United States, Strata consists of a single exam:


    +   - FC0-U41 CompTIA Strata IT Fundamentals


    In the United Kingdom, Strata certification consists of two exams:


    +   - FC0-U21 CompTIA Strata Fundamentals of Technology (UK only)

    - FC0-U11 CompTIA Strata Fundamentals of PC Functionality (UK only)


    The exam objectives are very similar, with the US exam encompassing most of the
    objectives for the two UK combined. There are minor differences between the objective
    sets for the two countries, and we point out these in the book where applicable.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Introduction


    # What’s the Test Like?


    The US/International version of the test (FCO-U41) has 70 questions, and you have
    120 minutes to complete it. A passing score is 70%, and it''s available in English,
    Spanish, Portuguese, Japanese, German, Greek, Arabic, and Korean. This exam may
    be taken in any country except the UK


    The UK version consists of two exams of 35 questions each: FCO-U11 and FCO-U21,
    and you have 60 minutes to complete each exam. A passing score is 70%. The exams
    are available only in English and may be taken only in the UK


    To find a testing center near you, see:


    http://certification.comptia.com/Training/testingcenters.aspx


    # Special Features in This Book


    Each chapter begins with a list of the objectives. (See the next section, “Exam
    Content,” for a comprehensive look at all the objectives in one place.) Within
    the chapter, information is arranged in logical ways, rather than in a strict
    objective-by manner, because it makes for easier learning.


    After you learn about a particular technology or technique, you''ll have the opportunity
    to practice it with a hands-on exercise. Exercises work step by step through a
    process, such as updating a driver or installing a drive. Most of the exercises
    you''re using Windows 7; Windows is the most popular operating system, and version
    7 is the latest version of this time. In many cases, an earlier version of Windows
    will have similar steps. Where applicable, Mac and Linux products are also outlined.
    For example, when learning about commands at a text-based command prompt, we''ve
    included the enabled commands for Windows, Mac, and Linux.


    Each chapter also includes notes, with the extra information that you may need.
    For example, a note may tell you about a special limitation of a particular operating
    system or an extra command you can use as a shortcut to the main procedure.


    At the end of each chapter is a quick summary section that reviews what you learned.
    There''s also an “Exam Essentials” section that points out the important exam
    objectives for which you should be prepared by reading this chapter.


    The final element of each chapter is a set of 20 review questions that test your
    understanding of the chapter material. Answers are provided after each question
    set, so you can quickly check your work.


    # Exam Content


    Here are the objectives you''ll be responsible for meeting on the Strata exam.
    In the following table, we''ve listed the US/International exam objectives on
    the left and matched up the equivalent objectives from the UK exams on the right,
    with the exam number for each section on the UK side.'
  merge: -1
