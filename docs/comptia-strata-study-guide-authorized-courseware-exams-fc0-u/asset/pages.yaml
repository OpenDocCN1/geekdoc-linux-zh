  md: '# Cleaning a Printer and Replacing Consumables


    All types of printers can be cleaned on the outside with a cloth dampened with
    a spray for PCs. This won''t make the printer perform better, but it will make
    for a nicer environment.


    The only parts inside an inkjet printer that need cleaning are the injets, and
    these aren''t cleaned by hand—a utility built cleans the prisms. The ink in an
    inkjet printer is liquid; if the printer isn''t in use, the ink dries out and
    bits of dried ink in the nozzles. The cleaning procedure flushes any dried-up
    ink. It uses some ink to do, so don''t clean the injets unless print quality has
    declined.


    On most inkjet printers, there are two ways to activate the cleaning utility:
    pressing a sequence of buttons on the printer itself, or using the cleaning utility
    in the printer''s software. For example, Figure 5.3 shows the Toolbox utility
    for HP printer; there are commands for cleaning and aligning cartridges and testing
    pages.


    # FIGURE 5.3 Software utilities for cleaning heads for an inkjet printer


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_227_0.png)


    Laser printers use toner rather than ink. Because toner is a dry substance (a
    mixture of plastic resin and iron oxide), it doesn''t clog the ways that liquid
    ink does. However, toner is a loose powder that can scatter over clothing and
    the work area if the cartridges aren''t handled with care. Clean up any spilled
    toner with a vacuum designed for electronics or with a damp paper towel. If it
    gets on clothing, you can get it out with a magnet, because toner is half iron.
    Don''t use a regular vacuum cleaner: general-use vacuums don''t have fine'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Cleaning a Computer


    enough filters, so the toner particles can pass through them and get into the
    air where they become a health hazard to breathe. Several specific parts of a
    laser printer can accumulate toner, making them less effective over time. Depending
    on the age and model of the printer, though, these parts may or may unreachable.
    Consult the manual that came with the printer to find out what you can do to clean
    your laser printer.


    Consumables is another name for the ink or toner cartridges in a printer, and
    any other parts that regularly be replaced, such as a felt cleaning on some models
    of laser printers.


    > NOTE When considering what printer to buy, it is prudent to look at the TCO,
    and total cost of ownership. This includes not the initial cost of the printer,
    but the cost of the consumables.


    Each printer has a specific procedure for replacing consumables; follow the instructions
    for your model. Here are some general tips, though:


    # Inkjet Tips


    +   - On an inkjet printer, the printer will tell you when it''s low on ink or
    completely out. You may also notice degradation in image quality or a missing,
    faded, or striped color on some prints.


    +   - The printer may have a sequence of buttons you have to press to bring the
    ink cartridge into view where it''s accessible, or the cartridge may move into
    an accessible position when you open the lid.


    +   - There is usually a lever or button you press to release the old cartridge.
    Then it slides out of a groove or socket.


    +   - Wrap the new cartridge, and remove the piece of tape that is covering the
    metal contacts on the cartridge. Insert it into the socket in the same orientation
    as the one you removed. Then close the printer.


    +   - The printer may ask you to test a page, or to check or align the print heads.
    Do whatever it suggests. Check the manual as needed.


    # Laser Tips


    +   - On a laser printer, the printer will indicate when it''s getting low on
    toner. At this point, you may be able to get a bit of extra life out of the cartridge
    by taking it out and shaking it gently from side to side. Don''t turn it upside
    down or tilt it, or toner may fall out. Handle it very gently.


    +   A new toner cartridge may have multiple pieces of tape or plastic guards on
    it to prevent toner leakage. Make sure you remove them before inserting the cartridge.


    +   - The printer may recognize the new toner cartridge immediately, or you may
    have to use the printer''s menu system to let it know that it has new toner.'
