    # Antispam Software


    Spam refers to unwanted junk email. People send spam to sell products because
    doing so is economical—costs almost nothing to send millions of emails, even if
    only a very small percentage respond, it is still a money-making proposition.
    People also send spam to perpetuate fraud, either by trying to sell useless or
    non-existent products or by trying to trick people into visiting websites or sites
    where a virus or other malware will be downloaded.


    Many email applications include filters and other tools to manage spam. Microsoft
    Outlook has its own junk-mail filter, for example. However, these built-in filters
    often fail to catch a lot of the spam because their algorithms for differentiating
    spam and legitimate mail are sophisticated.


    Some antivirus applications include an antispam component, and you can also buy
    addon antispam programs or get them for free. For example, SpamBayes, available
    for free at http://spambyes.sourceforge.net/, is an extremely sophisticated email
    differentiator that uses a ranking system that evaluates each message on multiple
    criteria to determine its spam probability. It''s available for Windows, Unix,
    Linux, and the Mac OS.


