  md: '# Chapter 7 • Updating and Upgrading Hardware


    speed, physical size, capacity, and error-correction features. Your motherboard
    probably supports only one or two types, so consult your PC''s manual or a reliable
    reference, such as the Crucial utility used in the following exercise, to determine
    what to buy.


    # EXERCISE 7.3


