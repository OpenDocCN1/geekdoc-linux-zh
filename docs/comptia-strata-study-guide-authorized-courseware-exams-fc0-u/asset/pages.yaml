    # Adjusting the Sound Volume


    Some keyboards have volume-control buttons on them that adjust up or down or mute
    it completely. You can also adjust the volume within the OS. In Windows, click
    the speaker icon in the notification area (in the bottom-right corner of the screen,
    by the clock), and then drag the slider up or down or click the Mute button below
    the slider to mute or unmute. You can also right-click the Volume icon and choose
    Volume Mixer to control the volume for different types of sound individually.


    FIGURE 6.4 Adjusting the sound volume in Windows


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_275_0.png)


    On a Mac, the process is similar. On the right side of the Finder bar at the top
    of the screen, click the sound volume icon (which looks like a speaker). Then
    drag the slider up or down. Many keyboards for both PCs and Macs have volume-adjustment
    buttons.


    # Changing the Date and Time


    The computer keeps track of the current date and time so that it can accurately
    display a clock and calendar. This clock/calendar is kept up to date by a chip
    on the motherboard. You can manually change the date and time, either in the OS
    or in BIOS Setup, or you allow the OS to check the date and time periodically
    and update them as needed, using an Internet time server.'
  merge: -1
