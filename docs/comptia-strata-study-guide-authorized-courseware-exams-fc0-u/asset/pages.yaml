  md: 'There should be a chart on the drive''s label, or lettering above the jumpers,
    to tell you what the settings represent (see Figure 7.12). If you don''t get the
    jumper setting right, the drive may not work and the other drive on that cable
    stop working until you get the settings straightened out.


    # FIGURE 7.12 Setting the jumper on a PATA drive


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_336_0.png)


    # Selecting a Drive Bay and Installing the Drive


    Open the case, and find an available drive bay. A *drive bay* is a chamber inside
    the PC that is designed to hold a disk. Hard drives don''t need to be accessed
    externally, so you don''t need one of the externally accessible drive bays for;
    look for one of the smaller bays, sized to fit a hard drive. There is an existing
    cage that can be removed from the rest of the case. You may need to remove the
    cage to attach the screws on the side of the new drive. The cage is usually held
    by one or two screws.


    All other drives are easily accessible, including DVD and CD drives. If installing
    an externally accessible drive, pop off the plastic faceplate in front of an available
    drive bay. (It''s easily to pull it out if you can reach your hand inside that
    far.)


    Next, slide the drive into the bay. If you''re working with a removable cage for
    a hard drive, attach the drive to the cage with screws and then replace the cage
    in the main case. If you''re installing the drive in a bay that is part of the
    main case, simply set the drive loosely'
  merge: -1
