    # Creating Network Shares


    When many people need access to the same data, system administrators may choose
    to place data on a centrally accessible file server on a network. The folder containing
    the data is then made accessible—that is, shared, with—the people who need it.
    This is called a network share. You can also share folders on your hard disk with
    others on a network.


    Network shares can be set as mapped drives, so that the folder appears as a separate
    drive letter on the user''s PC. For example, you might access a personnel folder
    for your company from the network as if it were drive P: on your system.


    File servers are used by companies that have dedicated storage for their networks,
    but while wireless access points now come with network attached storage (NAS),
    and stand-alone NAS devices are also available. NAS is a hard drive configured
    to function as a network share, independently of any individual PC. You could
    use a NAS device to store music or video clips in your home, for example, or important
    client files in a small business.


