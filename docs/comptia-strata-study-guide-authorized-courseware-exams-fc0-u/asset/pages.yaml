    # Cleaning Removable Media


    Disc drives that read removable media like CDs and DVDs don''t usually require
    any cleaning. The discs themselves, however, can become dirty or damaged such
    that they won''t play properly without some rehab. To remove fingerprints, buff
    them off with a soft cloth. If the surface is greasy or sticky, use an alcohol-dampened
    tolette or cloth, and air-dry the disc thoroughly before use.


    Is the problem more than a few fingerprints? Some scratches on a disc can be minimized
    by using a scratch-mover kit, to the point the disc is made readable. These kits
    are available for home use, and most disc rental stores have a better-quality
    kit that you may be able to use for a fee.


    # EXERCISE 5.2


    Cleaning a CD or DVD


    +   1. Locate a CD or DVD that has fingerprints on it.


    +   2. Buff out the fingerprints using a soft dry cloth.


    # Preventing Damage to Equipment


    Some beginning computer users are terrified of damaging their computers, having
    paid so much for them, but computers are actually fairly sturdy. They have a few
    Achilles heels, such as water and electrical shock, but some common sense can
    go a long way toward mitigating risks. In the following sections, you''ll learn
    some of the ways you can keep a computer physically safe and healthy.'
