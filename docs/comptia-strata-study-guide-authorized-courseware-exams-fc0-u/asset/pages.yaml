    but most use USB.


    Inside a scanner is a fixed linear array called a charge-coupled device (CCD).
    It''s composed of an array of photoreensitive cells, similar to the eye of an
    insect, which reflects the light to a lens and then across the CCD. A light bar
    moves across the object being scanned. A system of mirrors reflects the light
    to the lens and then into the CCD. The mirrors are slightly curved to compact
    the image as it reflects. Each of the photoreensitive cells produces an electrical
    signal proportional to the strength of the reflected light that it hits, and is
    converted to a binary number and sent to the computer. Dark areas have lower numbers;
    light ones have higher numbers.


    The CCD receives data for one line of the image at a time, sends it to the computer,
    and tells the stepper motor to move to the next line. The CCD doesn''t have to
    have a number of cells equivalent to the number of pixels in the entire page—only
    the number of pixels in a single row. On a scanner that can accept an 8.5 × 11-inch
    sheet, at 300 dpi, that''s about 2,600 cells. Scanners with a higher dpi have
