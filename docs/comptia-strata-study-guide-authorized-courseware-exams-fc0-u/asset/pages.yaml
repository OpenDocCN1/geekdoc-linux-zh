    # Network Control


    Next we will look at security risks and controls associated with connecting to
    a network.


    # Open Wireless Networks


    As learned in Chapter 3, wireless (Wi-Fi) networks can be either open (no encryption)
    or secured (using encryption). Encryption is set at the router, so whether or
    not a network has encryption on it is determined by the router settings. The router,
    in turn, connects to the Internet.

    If a network is secured, you must type your encryption key (password) when connecting
    to it. If not, anyone may connect to it. Connecting to a network may not be sufficient
    to gain access to all its services (such as Internet access). Additional login
    information may be required. When you open a browser window, a redirect operation
    displays a login page in which you may need to accept a user agreement, enter
    a username and password (or create one), and/or provide credit-card information
    to buy Internet access.'
