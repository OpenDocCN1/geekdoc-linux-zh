  md: 'Many cables sold these days are shielded, which means they have a special wrapping
    that minimizes EMI interference. Buying shielded cables, although more expensive,
    can help greatly with EMI problems.


    EMI problems caused by external sources, such as power lines, can be difficult
    to solve; sometimes moving the devices to a different area in the room or building
    can help.


    # Surge Suppressors


    Electrical devices rely on the power coming from the wall to maintain a certain
    well-defined voltage range. However, the actual range may differ because of problems
    with the local electricity provider, in the home or office, or environmental conditions.
    Sometimes there are outages, power surges or spikes, or sags, which can inflict
    major damage to a PC''s power supply.


    A surge and a spike are basically the same thing: too much voltage. A spike is
    used to describe a more dramatic surge. A sag, sometimes called a brownout, is
    insufficient voltage. An occasional power surge can come from lightning electrical
    service, but the really damaging power spikes almost always come from lightning
    strikes during extreme storms.


    External devices can help compensate for the various failures of household and
    office electricity. The most basic of these is a surge suppressor, basically an
    extension cord, but inside it is a metal oxide variable resistor (varistor), sometimes
    abbreviated MOV, which can absorb any excess power during a surge or spike, preventing
    it from reaching the plugged-in devices. The varistor works by depleting its own
    ability to resist, over time a surge suppressor loses its effectiveness in protecting
    the PC from power overage. With an inexpensive model, there is no way of gauging
    the hits the suppressor has taken or the remaining effectiveness. Some of the
    better models have lights that indicate the surge suppressor’s “ready” status,
    like the one shown in Figure 5.5.


    FIGURE 5.5 Surge suppressor


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_233_0.png)


    Courtesy of APC'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Preventing Damage to Equipment 177


    Some surge suppressors also include a pass-through for a telephone line, adding
    surge protection to it as well. This is valuable if you''re using a DSL modem,
    because a lightning strike can come through a phone line and destroy a modem.
    Modems are one of the components most damaged by power surges, because phone lines
    are frequently left unprotected.


    # Uninterruptible Power Supplies


    A surge suppressor does nothing to help power surges or outages. For that you
    need an uninterruptible power supply (UPS): a combination of a surge suppressor
    and a battery backup. It handles power surges in the same way as a surge suppressor,
    but it has the added bonus of being able to power the PC for a few minutes when
    a power outage occurs. This is very useful because it avoids problems that crop
    up when a PC is shut down incorrectly, such as disk errors.


    In some cases, a UPS also includes power conditioning, so it protects against
    voltage situations (brownouts) as well as complete power failures. (Not every
    UPS has this feature.)


    Most UPS devices have a device that connects to a PC that allows the operating
    system to interact with the UPS. With this feature enabled, the UPS can signal
    the OS when the battery is being used, and Windows can shut itself down automatically.
    This is useful for people who leave a PC running when away from home or overnight
    at the office.


    There are two types of UPS devices. An online UPS runs the PC off the battery
    at all times. The power connects to the battery and charges continuously, and
    the PC draws its power from the battery. If power stops coming from the outlet,
    the PC continues running on the UPS as long as it can. This type of UPS is rather
    expensive. Some call it a "true UPS."


    The other type is a standby UPS. It works as a surge suppressor most of the time,
    passing the wall outlet current through the devices plugged into it. The battery
    stays charged but isn''t in the main loop. If the wall outlet stops providing
    power, the UPS quickly switches the devices to the battery. There is a momentary
    skip when the power changes, but it is so brief that most devices continue without
    interruption. This type of UPS is the model that computer stores typically carry
    for sale and is much more affordable. However, some people argue that it isn''t
    a real UPS, but rather a standby power source (or standby power supply (SPS)).


    A UPS is much larger and heavier than a surge suppressor, mainly because of its
    big battery. The battery will last for many years, but it''s replaceable if it
    ever goes bad. The UPS has self-testing routines and lights that show the battery''s
    status, and it will let you know when it''s time to replace the battery. Figure
    5.6 shows the back of a typical consumer-level UPS. Notice that there are outlets
    for surge protection only for both power and modems, and all three outlets that
    provide both battery backup and surge protection.'
