    # Digital Cameras


    A digital camera has a scanner that it stands up. Rather than scan flat, two-dimensional
    image, it projects its vision out into the 3D world and creates an image on what
    it sees.


    # How Digital Cameras Work


    Technologically, a digital camera has a lot in common with a traditional camera.
    They both have a lens that “sees” the image, and both have focusing controls for
    that and usually a built-in flash. The main difference is that a traditional camera''s
    lens sends its data to film, whereas a digital camera sends its data to a digital
    storage medium such as flash RAM, or to a computer if it''s connected to one (as
    with a webcam).


    The camera in a digital camera sends its data to a CCD like the one in a scanner,
    which measures the amount of light received in each cell and conveys an electrical
    charge to the camera''s processor in proportion to the amount of light in a particular
    spot. With a scanner, a color filter is applied to the CCD to enable color photography.
    This data passes through an analog-to-digital converter, which turns these electrical
    charges into binary computer data.


    The data from the CCD passes through a digital signal processor that cleans it
    up and makes some corrections to improve the image quality. Then the data is stored
    inside the camera until it can be transferred to a computer.


