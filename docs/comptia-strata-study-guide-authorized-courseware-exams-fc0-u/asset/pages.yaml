    # Hardware for Internet Connections


    A decade or more ago, most people connected to their Internet service provider
    (ISP) via a dial-up modem. A *modem*, short for modulator-demodulator, is an analog-to-digital
    and digital-to-analog converter that translates digital data into sounds that
    can be sent on a regular telephone line. Then another modem at the other end converts
    the analog signal back to digital.'
