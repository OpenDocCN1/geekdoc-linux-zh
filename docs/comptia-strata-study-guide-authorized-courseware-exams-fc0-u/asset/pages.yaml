  md: '![](img/c5fa9b25d23e63f6ffb996940faeace5_89_0.png)


    You can have the greatest processor and best RAM in the world, but unless you
    give these devices directions as to what do with them, you''ll get nothing back.
    That''s where input devices come in. They help you put data into a computer for
    processing.


    In this chapter, we''ll review the various types of devices that people use to
    give computer instructions, including essential user-input tools like keyboards
    and mice. We''ll also look at many of the technologies used for data storage and
    retrieval in a PC, such as hard disks, CDs, flash drives, and so on.


    # Core Input Devices


    A variety of input devices exist for entering data into a computer. The oldest
    method''s still in use today is the alphanumeric keyboard. Some other types of
    input devices include the numeric keypad, mouse, touch screen, and game controller.
    In this section, we''ll review the function of each of these input device types.


    # Keyboards


    Computer keyboards are the descendants of typewriter keyboards. They enable users
    to enter text and numeric input for documents and other data files. Figure 2.1
    shows a typical keyboard.


    FIGURE 2.1 Computer keyboard


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_89_1.png)


    Photo credit: Microsoft (credit on copyright page)'
