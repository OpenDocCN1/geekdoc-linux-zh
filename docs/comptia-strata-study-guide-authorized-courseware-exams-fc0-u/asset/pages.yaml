  md: '# Freedom of Information Act


    Generally speaking, legislation to freedom of information defines an individual''s
    right to access data held by governments and related public bodies on a diverse
    range of issues.


    In the U.K., the Freedom of Information Act 2000 introduces a public "right to
    know" in relation to public bodies. The act creates a general right of access
    to information held by public authorities, including legislative bodies, the armed
    forces, local governments, courts, health services, and public schools, as well
    as to privately owned companies. There are many details and exceptions in the
    full legislation. See http://en.wikipedia.org/wiki/Freedom_of_Information_Act_2000
    for a more comprehensive description. At the EU level, a similar regulation permits
    any citizen of EU countries to request information from the European Parliament,
    Council, and Commission.


    In the U.S., the Freedom of Information Act took effect in 1967, and an Electronic
    Freedom of Information Act amendment was added in 1996. The act applies only to
    federal agencies, but all states have similar statutes that require disclosures
    by state and local governments.


    # Copyright Act


    The U.K. Copyright, Designs, and Patents Act of 1988 (CDPA) covers current copyright
    law. It is significant in an IT context the Internet has made it very easy to
    share information. Some of that is protected by copyright, and there may be substantial
    legal penalties for using it without permission. Works to copyright protection
    include the following:


    +   - Literary, dramatic, and musical works


    +   - Artistic works


    +   - Sound recordings and films


    +   - Broadcasts


    +   - Cable programs


    +   - Published editions


    The 1988 act and amendment establishes that copyright lasts until 70 years after
    the death of its creator (if known), and otherwise 70 years after the work was
    created or published. For computer-generated works, the limitation is 50 years.
    For full details about this law, see http://en.wikipedia.org/wiki/Copyright,_Designs_and_Patents_Act_1988.


    EXERCISE 10.2


    # Research IT Laws


    Using the Internet, or by contacting your state or local government, find out
    what IT-related state or local legislation applies to you as an individual consumer.'
  merge: -1
