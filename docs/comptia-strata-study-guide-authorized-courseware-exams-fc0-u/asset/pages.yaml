  md: '# Chapter 9 • Security and Access Control


    +   - Install an alarm that beeps if your device gets more than a distance away
    from a transporter that you keep close to you (such as on your keychain or belt).


    Within your company''s offices, solutions for securing computers and peripherals
    focus mainly on securing the environment overall, rather than securing an individual
    piece of hardware. For example, some possible measures include:


    +   - Requiring a security keyboard for access to the office area


    +   - Having a professional security presence in large organizations


    +   - Keeping doors and windows locked


    +   - Being prepared to challenge anyone who isn''t normally a part of your work
    environment


    If it isn''t possible to secure the area physically, it may be appropriate to
    use locks and other devices that physically attach the hardware to a desk or other
    fixed object in order to prevent it from "walking away." There are various types
    of locks, cages and designed to make it difficult for someone to remove a computer
    from its location.


    Many notebook computers have a K-slot, which is short for Kensington security
    slot. Kensington is a company that makes a lock that fits into that slot. The
    lock is then attached to a security cable, and the other end of is bolted to the
    wall or furniture. The locks are secured with either a key or a combination. Figure
    9.1 shows an example of a security cable attached to a K-slot on a notebook PC.


    > Services are available, with LoJack, that track stolen hardware via a small
    radio installed inside the device and disable a stolen computer remotely so the
    data that resides on it isn''t compromised. LoJack functionality comes preinstalled
    in the BIOS of many major brand-name notebook computers, including Dell, Lenovo,
    HP, Toshiba, and Fujitsu. The radio-tracking unit comes free with the computer,
    but you must pay to install and use the software that enables it. You can learn
    more about this software at http://store.lojackforlaptops.com.


