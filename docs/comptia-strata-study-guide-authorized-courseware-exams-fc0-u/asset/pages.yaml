    # I Upgrade My Processor?


    The relationship between the processor and the motherboard is very close, because
    they must work together seamlessly. Not only must the processor be physically
    compatible with the motherboard''s processor socket, but the motherboard must
    also be aware of the processor''s instruction set and the speed at which it can
    accept data. As a result, most motherboards support only a few processors, upgrading
    to a significantly better processor without replacing the motherboard isn''t possible.


    # Memory


    Memory, generically speaking, is data storage that uses on/off states on a chip
    to record patterns of binary data (that is, data consists of only 1s and 0s).
    Inside a memory chip is a grid of on/off switches. An on value represents 1, and
    an off value represents 0.


    Memory can be either static or dynamic. *Static memory (a.k.a. nonvolatile memory)*
    doesn''t require refreshing to maintain its contents. *Dynamic memory (volatile
    memory)* has to be constantly powered to retain its contents.


    Broadly speaking, all memory can be divided into one of two types: ROM and RAM.
    Read-only memory (ROM) chips store data very permanently; you can''t make changes
    to their content at all (It takes a special ROM-writing method to write one).
    This type of memory is always static. The basic startup instructions (BIOS) stored
    on your motherboard are typically stored on a ROM chip. This is the programming
    on electronic devices that will never need to be updated, like the computer on
    an exercise treadmill that stores various functions. The main advantage of ROM
    is its reliability. It can never be accidentally changed or deleted. The disadvantages
    of ROM are that it''s slow compared to RAM, and that you can''t update it; you
    pull the chip out of the system and replace it. ROM isn''t used as a PC''s primary
    memory source; a PC has a small amount of ROM.


    Random access memory (RAM)* can be written and rewritten on the device in which
    it''s installed. It is called *random access* because the data is stored wherever
    locations are available in it, and reading data back from it doesn''t require
    that the data be in a certain storage location.


    RAM can be either static or dynamic. *Static RAM (SRAM)*, also called flash RAM,
    is the type you use when you store files on a USB flash drive. *RAM is nonvolatile*;
    you can disconnect a flash RAM device and carry it with you, and the next time
    you connect to a computer, the data will still be there. Most of the memory on
    a PC''s motherboard is'
