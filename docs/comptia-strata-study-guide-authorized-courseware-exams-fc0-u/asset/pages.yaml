  md: '# Pointing Devices


    A *pointing device* is an object that you move with your hand to control an onscreen

    pinter, or *cursor*. You move the pointer to communicate with the OS or application.
    Most

    pointing devices today use the USB interface; old mice may use a PS/2 connector
    like the

    one shown in Figure 2.3.


    Being devices, they''re usually *Plug and Play*, meaning the OS recognizes them

    immediately without any special software needed., to use the advanced features
    of

    the device, such as custom-program buttons, driver software may be required.


    # Mice


    The oldest and still the most popular pointing device is the *mouse*. The mouse
    gets its name

    from its size and shape; it''s approximately the size of a small rodent (or, if
    you prefer, of a

    bar of soap), and traditionally has a cord (which looks somewhat like a tail)
    that connects

    it to the computer.


    Mice use two main technologies: mechanical and optical. With a *mechanical mouse*,

    there is a rubber ball on the underside of the mouse. The ball rolls across the
    mouse pad or

    desktop, and as it rolls, it moves past sensors inside the mouse that tell the
    onscreen

    pinter to move a corresponding amount on the screen in a corresponding direction.


    With an *optical mouse*, there is no ball on the bottom; instead there is a *light-emitting

    diode* (LED) and *photodiodes* (light sensors) to detect movement. A *laser mouse*
    is like an

    optical mouse that it uses an infrared laser instead of an LED. With either an
    optical

    or a laser mouse, the rate of change of motion signals the OS where where the
    mouse is moving.

    Figure 2.4 shows a mechanical mouse with the top cover removed so that you can
    see

    what''s going on inside. Figure 2.5 shows the underside of an optical mouse; the
    inside of

    optical mouse contains no moving parts.


    **FIGURE 2.4** The inner workings of a *mechanical mouse*


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_94_0.png)


    Photo credit: Gregory Badon'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# FIGURE 2.5 The underside of an optical mouse


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_95_0.png)


    Photo credit: www.dansdata.com


    A mouse has buttons that you can press and release to act on whatever you''re
    pointing onscreen. Apple Macintosh computers can use one or two-button mouse;
    Windows systems require the two-button variety. There may be a third (center)
    button on some models, or a scroll wheel for scrolling through windows. In Windows,
    the left mouse button is the main button, for selecting; the right mouse typically
    opens a context-sensitive menu.


    > It''s important to consider the surface on which you''re using the mouse. Well-polished
    or glass desks may look nice, but they can inhibit your optical mouse from sending
    a clear signal to your OS. Although optical mice work on many different surfaces,
    users prefer to use a nonreflective pad on to move the mouse.


    > To clean a mechanical mouse, remove the lock ring on the bottom of the mouse
    and take out the ball. Clean inside with a cotton swab and alcohol. If the ball
    is dirty, clean it with soap and water. To clean an optical mouse, clear away
    any dust and grime around the LED with a cotton swab and alcohol.


    # EXERCISE 2.2


    # Explore Mouse Functionality


    +   1. Turn your mouse over, and determine whether it''s mechanical (with a ball)
    or optical (with an LED). If it''s mechanical, rotate the lock ring holding the
    ball in, remove the ball, examine the cavity in which the ball sits, and then
    reassemble the mouse.'
