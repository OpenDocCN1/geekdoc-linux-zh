  md: '# Chapter 4 • Setting Up a Computer


    Some connectors have pins sticking out of them; these are called male connectors.
    Others have holes into which pins fit; these are called female connectors. They''re
    often referred to by abbreviations of M and F.


    Some connectors have D-shaped metal rings around the pins to keep them from getting
    hit and bent. These connectors are called D-sub connectors, abbreviated as DB,
    and referred to by the number of pins and whether they''re male or female. For
    example, the VGA port on the back of the computer is a 15-pin female D-sub connector
    and may be abbreviated DB15F.


    # Video Monitor


    Every computer has at least one video port—that is, a port for connecting a monitor.
    This can be a VGA, DVI, or HDMI port, depending on the computer. (Most computers
    have VGA and/or DVI; HDMI is fairly rare for a consumer-level computer.) Look
    back to the “Monitors” section in Chapter 3, “Peripherals and Networking,” for
    a discussion of each connector''s pros and cons. HDMI is the highest quality,
    followed by DVI, with VGA being the lowest quality. If you have a choice, go with
    the highest-quality option available.


    Figure 4.12 shows a DVI connector on the back of a computer, and Figure 4.13 shows
    a VGA type (DB15F). Notice that there are screw holes on either side of these
    connectors. To connect a DVI or VGA connector, plug it firmly into the socket,
    and then tighten the thumbscrews. The thumbscrews prevent the connector from being
    accidentally jerked out and damaged if someone trips over the cord or knocks over
    the case.


