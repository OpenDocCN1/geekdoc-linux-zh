    # # Renaming Files and Folders


    In most OSs, the commands and procedures for renaming files and folders are identical;
    no distinction between them.


    There is one major thing to watch out for, though, when renaming files: file extensions.
    An extension is a code (usually three letters, but not always) that follows the
    filename, indicating the type of file. The name and the extension are typically
    separated by a period, like: myfile.txt. When you rename a file, you should make
    sure you keep the same file extension. Otherwise, the file may be rendered unusable.


    Here''s where it gets tricky in Windows: by default, Windows hides the extensions
    for known file types. This means myfile.txt looks to appear in a file management
    as myfile. When you rename it, if you type the extension as part of the new name,
    you end up with a double extension, like: myfile.txt.txt. You won''t notice it
    immediately, though the final extension is hidden, as specified by the OS.


    That leads to a general rule of thumb: if the file doesn''t show an extension
    on its name, don''t type one when renaming it. If it does show an extension, make
    sure you keep that extension. If you want to change the display status for known
    file types in Windows, from any file-management window, choose Tools > Folder
    Options, and on the View tab, check the Hide Extensions For Known File Types box.
    You''ll have a chance to practice this in Exercise 5.13, later in the chapter.


    Table 5.7 summarizes the methods of renaming files and folders.'
