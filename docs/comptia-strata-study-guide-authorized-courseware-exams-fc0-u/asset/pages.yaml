  md: '# Answers to Assessment Test


    +   1. A. Desktop RAM is mostly DIMM, notebook RAM is mostly SODIMM. The smaller
    size of SODIMM makes it more appropriate for use in smaller computing devices.
    Chapter 1, “Processing and Memory.”


    +   2. D. Whereas humans use decimal numbering (0 through 9), computers use a
    combination of binary numbering (0 and 1) and hexadecimal numbering (0 through
    9 plus A through F). Chapter 1.


    +   3. C. The motherboard is the main circuit board in the PC to which everything
    connects. It contains the CPU, memory, and connectors to all the drives. See Chapter
    1.


    +   4. D. A megabyte, abbreviated MB, is one million bytes. Megabyte is a common
    measurement of computer storage, and also of RAM capacity. One thousand megabytes
    (or one billion bytes) is a gigabyte. See Chapter 1.


    +   5. C. The term QWERTY comes from the six letters on the first row of the keyboard
    layout. See Chapter 2., “Input and Storage Devices.”


    +   6. B. Serial ATA (SATA) is a newer interface for hard disks to PCs. It is
    faster and the cables are thinner than Parallel ATA (PATA), the older technology
    that used ribbon cables. See Chapter 2.


    +   7. C. DVDs hold 4.7 GB per side. Double-layer DVDs hold almost twice that
    much per side: 8.54 GB. See Chapter 2.


    +   8. B. Printer quality is measured in dots per inch, or dpi; the higher the
    dpi, the smaller and closer the dots that make up the image. See Chapter 3, “Peripherals
    and Networking.”


    +   9. A. A laser printer works like a photocopier. It writes an image on a drum
    with electrical charges, and powdered toner, attracted to those charges, clings
    to the drum and is fused to a piece of paper. See Chapter 3.


    +   10. C. In a Liquid Crystal Display monitor, there are two polarized filters,
    between which are liquid crystals. The crystals twist when electricity passes
    through them, letting light pass through. This lights up an area of the screen.
    See Chapter 3.


    +   11. C. P2P stands for peer-to-peer. This network has no server; the client
    PCs share the burden of maintaining the network. P2P works best for networks of
    fewer than 10 computers. See Chapter 3.


    +   12. D. Most Ethernet cable, including Cat5, Cat5e, and Cat6, use an RJ-45connector
    on each end. This looks like a telephone connector but is wider and has eight
    wires (twisted pairs). See Chapter 3.'
