    # Summary


    In this chapter, you learned about computer processors and their function in a
    personal computer. You learned how a processor''s instruction set dictates the
    calculations it can perform and how processing is done using a binary numbering
    system inside the processor. You learned Intel and AMD, the two major processor
    makers, and about PGA and LGA, two types of sockets. We discussed performance
    speeds and operations per second, and we looked at how multicrocess improve system
    performance.


    Next, we looked memory. We learned the difference between static and dynamic memory,
    between RAM and ROM. You learned how data is stored inside a memory chip, and
    how virtual memory swaps data into and out of physical memory. You learned about
    memory bus speeds and high-performance memory such as DDR that is able to perform
    multiple operations per clock tick. Finally, we compared the various physical
    types of memory modules that PCs can accept, including DIMMs and SODIMMs.


    # Exam Essentials


    Know the most popular model names of Intel and AMD processors. Intel''s CPUs include
    the Pentium 4 and the Intel Core i3, i5, and i7. Within those lines, code names
    differentiate subtypes, such as Arrandale, Gulftown, and Sandy Bridge. AMD''s
    processors include the Phenom II, Athlon II, and Turion lines.'
