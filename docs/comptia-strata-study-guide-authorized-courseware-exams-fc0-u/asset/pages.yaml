  md: '# Biometric Devices


    Biometric devices identify users by scanning for one or more physical traits.
    Common types include fingerprint recognition, facial recognition, and retina scanning.


    Law enforcement agencies have been using fingerprint recognition for over 100
    years, and no two prints have been found to be identical, in genetically identical
    twins. That''s because fingerprints develop in the womb, and they aren''t preprogrammed
    at conception. More recently, computerized fingerprint scanners have taken the
    place of manual ink prints, and the technology for reading fingerprints has become
    so affordable that it''s built into many computer systems, including consumer-level
    notebook PCs.


    Some fingerprint scanners use a rapid laser to detect the ridges in a person''s
    fingers; others have an electrostatically sensitive pad that detects the current
    by the small quantities of water in a fingerprint. Facial recognition works in
    conjunction with a camera (like the webcam built into some notebook computers)
    to scan the face of the person who is logging in. The facial scan is matched with
    existing scans of that same person stored on the computer. Some consumer-level
    notebook PCs now have an option of logging into the OS via facial recognition
    as an alternative to typing a login password.


    # Data and Usage Permission


    We''ll look at security measures that allow authorized users to view certain data
    or use certain applications while preventing unauthorized users from doing so.


    # Controlling Screen Visibility


    Unauthorized people can gain access to confidential information not only by actively
    stealing the data, but by viewing the screen casually, as a passer-by or as a
    nonchalant snoop in an adjacent workstation.


    One way to prevent others from looking at your screen while you''re away is to
    set up a screen saver, as you did in Exercise 9.1. The screen becomes obscured
    after a period of inactivity. Not all screens choose the same level of screen-hiding,
    so choose a screen with an eye toward one that provides as much privacy as possible.


    To prevent others from looking at your screen as you''re working, you might consider
    orienting your monitor in a way that it''s difficult for others to read. For example,
    you can sit with your back to a wall or window, with the monitor''s back facing
    out.


    If it''s possible to hide the monitor from unauthorized onlookers, and if the
    data on the screen is highly confidential, you may find a screen filter. A screen
    filter (also called a privacy screen) directs the light from the display at a
    restricted angle so that anyone who isn''t viewing it straight won''t be able
    to read it clearly.'
  merge: -1
  pgno: 383
- img_proc: true
  md: '# Managing User Types


    As you learned in “Working with User Accounts” in Chapter 6 (“Installing and Configuring
    Software”), you can set up different user accounts in the OS with different levels
    of permission. In Windows and Mac OS X, a standard user account can''t make changes
    that affect other users, whereas an administrator account can make all types of
    changes. This prevents people from uninstalling applications that they don''t
    need but others.


    To prevent unauthorized changes to a computer, it''s a good practice to have everyone
    use a standard account for daily operations and have an administrator account
    available that is used only when performing activities that require it, such as
    installing or removing software or updating a device driver.


    # Controlling File and Folder Sharing


    In addition to using shared files on a file server, computer users can use shared
    files on other individuals'' accounts and can share their own files. In principle,
    sharing your files and folders on the network can make your life easier. However,
    file sharing is a security risk. Be judicious about the permissions you assign,
    only the ones that are necessary. For example, if a group of users needs only
    to read a folder, don''t assign Read-Write permission to it. And if only one or
    two people in a group need access, assign permission to their user accounts and
    not to their entire group.


    File/folder sharing differs across OS, based on how the relevant permissions are
    allocated. A file or folder permission is a marker (called a flag) placed on the
    file or folder to declare who can view, change, create, and delete files, as well
    as run executable files and assign permissions to others.


    > You can assign sharing permissions to individual files, but in most cases it''s
    better to assign permissions to a folder and then put into that folder whatever
    files require those permissions. Folder sharing is much more efficient because
    you need to set the permissions only once. It also avoids thorny, difficult-to-troubleshoot
    problems with file permissions that occur when each file has its own unique permission
    settings.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_384_0.png)


    # Mac OS X Sharing


    By default, file sharing is turned off on a Mac. To enable it, open the Apple
    menu and choose System Preferences Internet & Wireless > Sharing. Click the +
    (plus) icon below the Shared Folders field, and a sheet appears where you can
    navigate to the folders you wish to share (see Figure 9.2).'
  merge: -1
