    # Cleaning the Inside of a PC


    A desktop PC should be cleaned out regularly—at least once a year. Its cooling
    and ventilation fans suck in a lot of air, and with air pollutants that can build
    up time. Even a layer of dust on a circuit board can make it hotter, shortening
    its life; and clumps of dirt and hair can prevent the free flow of air through
    the case.


    Remove the cover from the case (following the directions that it came with to
    do so). Inside a desktop PC there may be clumps of air and dirt; fish these out
    by hand and throw them away. Check the motherboard and expansion boards for dust
    accumulation, and if it''s a long time since the PC has been cleaned, you may
    want to take it outside or to an open area so you don''t dust all over someone''s
    work area. The motherboard doesn''t have to be clean; it just needs to have major
    clumps of visible debris removed. A handheld vacuum cleaner designed for electronics
    can come in handy if available.


    > WARNING Hold your breath as you blast out the dust with compressed air, or you''ll
    be coughing from the dust flying around. It''s best to do it outdoors if weather
    permits. Keep in mind, too, that canned air generates a blast of cold, so don''t
    blow on yourself or others. Some technicians use this effect as a tool for cooling
    overheated chips on a circuit board during troubleshooting.


    To clean anything that involves circuit boards or chips, stay away from liquids,
    especially water, because of the danger of short-circuiting the board isn''t completely
    dry'
