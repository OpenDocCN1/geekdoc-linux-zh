  md: 'dynamic RAM (DRAM), so when someone refers to a computer''s memory or RAM,
    you can generally assume that they mean the DRAM on the motherboard. Dynamic RAM
    is volatile; when you turn off your computer, its content is gone.


    The motherboard''s RAM functions as a work area when the computer is on. The OS
    is loaded into it, as are any applications you open and any data associated with
    those applications. The more free RAM in the computer, the larger the available
    workspace, so the more applications and data files you will be able to have at
    once.


    # Virtual Memory


    Many OSs, including Microsoft Windows, use a tremendous amount of RAM as they
    operate, to the point that even a well-equipped PC might not have enough RAM to
    do everything a user wants. To prevent the user from being denied an activity
    due to lack of available memory, these OSs employ virtual memory to take up the
    slack.


    With virtual memory, a portion of the hard disk is set as a holding area for the
    contents of RAM. When there isn''t enough space in RAM to hold the data that needs
    to be placed, the OS''s virtual memory management temporarily moves some of the
    least-recently used data in RAM onto the hard disk, making room for the incoming
    data. Then, if an application calls for the data that was moved out, the virtual
    memory manager moves something else out and swaps the data back in again. Due
    to all this swapping, the reserved area on the hard disk for virtual memory is
    sometimes called a swap file.


    The main drawback of virtual memory is its speed, which is limited to the speed
    at which the hard drive can store and retrieve data. Compared to the speed of
    the processor and memory, the hard disk is very slow. Therefore, the less physical
    RAM available in a system, and the more system has to rely on virtual memory,
    the more slowly applications will run on it. That''s why adding RAM to a system
    is often a worthwhile upgrade.


