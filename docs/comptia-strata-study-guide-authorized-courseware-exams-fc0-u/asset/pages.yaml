    # Compact discs (CDs)


    Compact discs (CDs) are widely used to distribute music, software, and video games.
    CDs, with their relatives DVDs, are optical media, storing data patterns of more
    and less reflective areas on a disc platter. CDs store data as a series of microscopic
    indentations, known as pits and lands. A pit is less reflective than a land, so
    when the light of the drive''s laser hits it, light reflects back to the sensor
    when it hits. Whenever there is a transition between light levels, the drive electronics
    register that as 1. Whenever enough time has passed that could have been a transition
    but there wasn''t one, it registers that as 0. And how binary data is stored and
    read on a CD.


    > Round disks like CDs and DVDs are disks (with a c). Square disks like floppy
    and hard drives are disks (with a k). Yes, technically inside a hard drive are
    round platters, but you cannot see or access them, the moniker sticks with hard
    drives in popular usage. Just remember: square=k, round=c.


    CD drives just read CDs, but don''t write to them, which are known as CD-ROM drives.
    (Recall from Chapter 1 that ROM stands for Read-Only Memory) That''s the type
    of drive we''ll talk about first; in this chapter, we get into the writable and
    rewritable drives. The first CD-ROMs could store 650 MB of data or play 74 minutes
    of analog audio. Later versions supported 800 MB or 90 minutes, which is the most
    common type found today. A high-capacity version is available (but not as widely
    used) that can hold 900 MB or 99 minutes.'
