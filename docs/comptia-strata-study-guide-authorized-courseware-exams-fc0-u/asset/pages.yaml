  md: 'cloud computing Performing computer activities by accessing the network or
    Internet, rather than by using applications and data stored on your own individual
    computer.


    clusters Groups of sectors that the OS uses to address the storage areas. Also
    called allocation units.


    CLV See constant linear velocity.


    CMOS See complementary metal-oxide semiconductor.


    commercial operating system An OS that is sold up front, rather than given away
    for free or shared on the honor system. Windows and Mac OS X are examples.


    Compact Disc (CD) An optical disc stores data in patterns of more and less reflective
    areas.


    Compact Disc Read-Only Memory (CD-ROM) A read-only CD.


    Compact Disc Recordable (CD-R or CD+R) A CD that can be written to once.


    Compact Disc Rewritable (CD-RW or CD+RW) A CD that can be written to, erased,
    and rewritten.


    Compatibility Mode A mode in Windows for running applications that simulates earlier
    Windows versions.


    complementary metal-oxide semiconductor (CMOS) A chip on a motherboard that stores
    the BIOS setup settings; each although volatile, requires very little power and
    is powered by the motherboard battery. Newer motherboards flash RAM instead.


    constant angular velocity (CAV) A CD drive that spins at a constant speed, no
    matter which spot on the disc is being read. The data rate changes as needed.
    Writable CD drives are CAV.


    constant linear velocity (CLV) A CD drive that reads data at a constant rate,
    no matter which spot on the disc is being read. The rotation changes as needed.


    consumables Supplies that need to be replaced as they''re consumed, such as printer
    paper and ink.


    contention Competition with other network users for bandwidth.


    cookie A plain text file stores data about previous browser activities for reuse
    in future web browsing sessions.


    core A processor in a multicore CPU, there are multiple processors operating in
    a single chip.


    CPU See central processing unit.


    crash A situation when an application stops working.'
