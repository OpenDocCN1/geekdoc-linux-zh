    if that application has a component that runs constantly in the background, removing
    the application can free up memory that was previously occupied by function.


    > > NOTE You don''t have to remove an application completely in order to prevent
    it from running in the background. Most such programs have an option that will
    turn off the auto-running process. Try right-clicking the application''s icon
    in the notification area and looking for a command such as Options or Properties
    that may lead you to a dialog box where you can control the auto-start or background
    setting.


    For Mac users, unless the application specifies a Remove folder/application, you
    can delete any folders or files associated with that application by dragging it
    to the trash. Some may be stored in other locations, such as the Library/Application
    Support folder. Doing so removes all files and associated system resources.


