- img_proc: true
  md: '# Using Safe Mode


    When Windows won''t start normally, you can often boot into Safe Mode for access
    to your Windows Desktop. *Safe Mode* is a low-functionality mode that bypasses
    all optional components, both hardware and software, loading only the minimum
    required to display the Desktop. You shouldn''t use the computer for normal tasks
    in Safe Mode because of its limited functionality; stay in Safe Mode only long
    enough to implement fixes are needed to boot normally again.


    To enter Safe Mode, restart the computer and, as soon as you see any text on the
    screen, begin pressing the F8 key. Doing so displays the Advanced Options menu,
    a text-based menu system. Using the arrow keys, select Safe Mode (or Safe Mode
    With Networking) from the menu, and press Enter to start the computer in Safe
    Mode.


    In Safe Mode, the display adapter uses a generic driver, so the screen resolution
    is low and uses a limited color set. Nonsensical hardware doesn''t work, as sound
    cards and modems; unless you choose Safe Mode With Networking at the Advanced
    Options menu, the network doesn''t work (and includes the Internet).


    If the computer starts OK in Safe Mode but doesn''t start normally, you can assume
    that the startup problem lies in one of the nons own hardware drivers or software
    applications that Safe Mode blocks from starting. Here it''s just a matter of
    elimination.

    Here are some things to try once you''re in Safe Mode:


    +   - Disconnect all external hardware drivers, such as devices, external hard
    disks, webcams, and so on. Try to boot normally. If you can, plug the devices
    one at a time, rebooting after each one, until you find the one with the problem.


    +   - If you''ve recently installed new hardware, remove it and see if the problem
    goes away.


    +   - If you''ve recently installed a new application, remove it using the Control
    Panel (see Chapter 6, "Installing and Configuring Software") and reboot to see
    if the problem goes away.


    +   - Use System Restore, as described in the next section, to return your computer
    to an earlier configuration before the problem started.


    +   - Run the System Configuration Utility (MSCONFIG), as described later in this
    chapter, to prevent all noncritical applications from loading at startup. Re-enable
    them one by one, rebooting each time, until you find the problem.


    # EXERCISE 8.1


    # Boot into Safe Mode


    +   1. Restart your PC, and as soon as you hear the single beep and see text on
    the screen, start pressing the F8 key. The Advanced Options menu opens.


    +   2. Press the down arrow key to highlight Safe Mode With Networking, and press
    Enter. The system starts up in Safe Mode.'
