    # Using Phishing Protection


    Creating a site that masquerades as a legitimate secure site but actually steals
    your information is called phishing (or spoofing). Phishing employs many tactics,
    which are evolving all the time. For example, you may get an email that claims
    to be from your bank, ISP, and for asking you to follow a link to its site to
    update your details. The email looks authentic, and when you follow the link,
    the site looks very much like the site of your bank—except it probably isn''t
    secure, and some links on the page may not be operational.


    Most browsers have some protection built-in. That''s part of the different-colored
    background of the Address bar in Internet Explorer, for example; if it''s green,
    that indicates the phishing filter has determined the site is legitimate. A yellow
    background indicates caution because there is a problem with the verification;
    and red background indicates that this site probably risky and should be avoided.


    In Internet Explorer, the phishing filter is called the SmartScreen filter, and
    it can be enabled or disabled. Normally you leave it enabled, because it provides
    information and prevents you from doing anything. Assessment is fairly accurate,
    as well. The only drawback (and it''s very minor) is that if you leave automatic
    checking turned on, the browser checks every page you visit, resulting in slightly
    slower browser performance. If you seldom visit sites and you want to check only
    the specific sites about which you have a question, you can turn off this feature.
    Exercise 9.9 shows you how to configure the SmartScreen filter in Internet Explorer
    9.'
