    # # Laser Printers


    A laser printer works much like a photocopier. The main difference is that a photocopier

    sc a document to produce an image, whereas the laser printer receives digitized
    data

    from a computer.


    A laser printer contains a large cylinder as a drum, which carries a high negative

    electric charge. The printer directs a laser beam to partially neutralize the
    charge in

    areas of the drum. When the drum rotates past a toner reservoir, the toner clings

    to the areas of lesser charge, and the page image is formed on the drum. Then
    the drum

    rotates positively charged paper, and the toner jumps off the paper. The paper

    then passes through a fuser that melts the plastic particles of the toner so it
    sticks to

    the paper.


    Laser printers are available in color or monochrome models. To print in, a laser

    printer must make four passes across the same page, laying down different color
    each

    time. A printer has four separate toner cartridges: cyan, magenta, yellow, and
    black.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_132_0.png)


    Although you''re unlikely to do, if you spill any toner, let it settle before

    y clean it up. Toner is a fine powder and is carcinogenic. A carcinogen is

    product that, with long-term continued exposure, may cause cancer. The

    most prudent course of action is always to refer to the health and safety

    guidelines that come from the manufacturer.'
