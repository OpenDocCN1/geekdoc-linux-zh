  md: '# Windows 7 Sharing


    In Windows 7, there are two ways to manage file and folder sharing. One is to
    create a HomeGroup, which is a small, tightly controlled workgroup, and set permissions
    for sharing within that group. That''s the ideal solution for most home networks
    and small offices. The main drawbacks are that all the computers have to be running
    Windows 7, and each computer must be configured individually (the prospect of
    setting this up for a large network can be daunting). Exercise 9.2 walks you through
    the steps for creating a HomeGroup on a network of least two PCs that are running
    Windows 7.


    # EXERCISE 9.2


    # Create a Windows 7 HomeGroup


    +   1. On any of the PCs you wish to connect, open the Control Panel and go to
    Network And Internet ➢ Network And Sharing Center.


    +   2. Click Choose Homegroup Sharing Options.


    +   3. Click Create A Homegroup. The Create A Homegroup dialog opens.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_387_0.png)


    +   4. Select or clear the check boxes for the file types you wish to share with
    other members of the HomeGroup.


    +   5. Click Next. A network password appears. It''s a string of random numbers
    and letters, something like this: 6dH2EB7kK4. Write down the password, and click
    Finish.


    +   6. Go to each of the other PCs you wish to connect, open the Control Panel,
    and go to Network And Internet ➢ Network And Sharing Center.


    +   7. Click Choose Homegroup And Sharing Options.


    +   8. Click Join Now.'
  merge: -1
  pgno: 387
- img_proc: true
  md: '9. Select or clear the check boxes for the file types you want to share with
    other members of the HomeGroup.


    10. Click Next.


