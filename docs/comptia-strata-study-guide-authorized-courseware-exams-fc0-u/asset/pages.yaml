  md: "# Troubleshooting Network Connectivity\n\nHardware is often, but not always,\
    \ to blame when a user can't log on to the local network or can't connect to the\
    \ Internet. Here are some general troubleshooting tips:\n\n+   1. If you can't\
    \ reach resources:\n   a. Confirm that the computer's network adapter is installed\
    \ and working. In Windows, look in Device Manager to make sure it's there and\
    \ doesn't report any errors.\n   b. Confirm that a cable or wireless connection\
    \ is established between the network adapter and the router, switch, or wireless\
    \ access point. If it's a wired connection, trace the cable from the PC to the\
    \ router or switch. If ever, check to make sure the OS recognizes the wireless\
    \ connection.\n   c. Make sure the right networking protocols are in place (TCP/IP\
    \ being the most common). Exercise 8.6 shows you how to do this in Windows and\
    \ how to use TCP/IP to troubleshoot an Internet connection.\n2. If your network\
    \ link keeps getting rejected on a corporate network:\n   a. Check that Caps Lock\
    \ is on and that you're using your username and password accurately.\n   b. Check\
    \ with your network administrator to make sure there are no known problems with\
    \ the network that might be preventing everyone from logging on (not just you).\n\
    3. If the problem is of Internet connectivity:\n   a. You may need to reset or\
    \ power-cycle your car or DSL modem (wait, power-cycle your car or DSL modem).\n\
    \   b. Your Internet service provider (ISP) may be temporarily unavailable. Sometimes\
    \ there are brief outages with the most reliable services. Wait it out for a few\
    \ hours before contacting your ISP.\n   c. The Internet itself may be experiencing\
    \ temporary delays or outages. This is likely the case if you can get to some\
    \ but all websites, or if you can get out but without web access, or vice versa.\n\
    \n# EXERCISE 8.6\n\n# Check TCP/IP Connectivity\n\n+   1. In Windows, open a command\
    \ prompt window. To do so, click Start, type cmd, and press Enter.\nnYou can also\
    \ do this exercise on Linux or Mac systems by opening a command prompt as you\
    \ learned in Chapter 5.\n2. At the command prompt, type ping 127.0.0.1 and press\
    \ Enter.\n127.0.0.1 is the loopback address: this is, the IP address that refers\
    \ to the machine that is issuing the command. If you get a reply from this command,\
    \ you know your network adapter is working. This eliminates all problems within\
    \ the PC from the troubleshooting process."
