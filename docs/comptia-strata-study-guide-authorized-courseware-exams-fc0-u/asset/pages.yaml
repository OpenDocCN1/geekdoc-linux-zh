- img_proc: true
  md: '# Chapter 5 • Maintaining a Computer


    +   - The work surface can also make a difference. Try not to work in a carpeted
    area; tile or linoleum is preferred. Carpet, especially carpet, tends to generate
    ESD the same way that nylon clothing does.


    **FIGURE 5.4** An antistatic wrist strap can help prevent ESD damage.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_231_0.png)


    Photo credit: Kms


    Another way to minimize ESD risks is to touch the metal frame or power supply
    of the PC frequently as you work. Doing doesn''t ground you, but it does equalize
    the electrical charge between you and the PC so there is no difference in potential
    between you and the components you. Do this every few minutes to make sure no
    built-up occurs.


    Antistatic mats are also available. These sit on the work surface and perform
    the same function for the parts on which you''re working as the wrist strap does;
    the mat has a cord that attaches to the ground pin on an outlet.'
