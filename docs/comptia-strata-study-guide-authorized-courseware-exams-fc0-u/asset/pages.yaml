  md: '# Glossary


    **digital zoom** The zoom on a digital camera that simulates zooming by interpolating
    the picture. Compare to *optical zoom*.


    **DIMM** *See* inline memory module.


    **distribution package** A package that consists of a free OS such as Linux plus
    a commercial add-on for it, such as a shell like Ubuntu or Red Hat.


    **distro** *See* distribution package.


    **DNS** *See* domain name system.


    **domain name system (DNS)** A type of server that translates between the numeric
    addresses of IPv4 and the friendlier names of the Internet.


    **dot pitch** The measurement of the distance between one color in a triad on
    a CRT monitor and the same color in the adjacent triad. The lower, the better
    quality monitor.


    **dots per inch (dpi)** A measurement of print output resolution. A higher dpi
    produces text with crisper edges and more realistic-looking graphics.


    **double data rate (DDR) SD** RAM that is synchronized with the system bus and
    runs at twice the speed of the system bus.


    **double-pumped** RAM that has data pumped in both of the rising and falling of
    each tick of the internal system clock.


    **dpi** *See* dots per inch.


    **drive** A device that reads and writes to disks, such as hard or floppy disks.
    On hard disks, the disk and the drive are a single unit.


    **drive bay** A cavity in a computer case where a drive can be mounted.


    **driver** A file or set of files that contains information needed for the OS
    to communicate with a hardware device.


    **drum** In a laser printer, the cylinder on which the page image is written by
    changing the electrical charge on parts of the drum where toner should be applied.


    **DSL** *See* digital subscriber line.


    **dual inline memory module (DIMM)** A RAM module that uses pins on both sides
    of the circuit board.


    **dual-boot** The capability of having two or more OSs on the same PC, and being
    able to choose at startup which one should load. Also called *multiboot*.


    **duplexing** Printing on both sides of the paper.'
