  md: 'crossover cable A cable that connects two similar devices, where the order
    of the wires at one end is opposite the usual order. Also called a patch cable.


    crosstalk See electromagnetic interference.


    CRT See cathode tube.


    current A measure of electrical amperage.


    cursor An onscreen mouse pointer.


    cylinder All tracks that are accessible at a given actuator arm position on a
    hard disk.


    cylinders, heads, and sectors (CHS) A measurement of hard-disk capacity, derived
    by multiplying the cylinders by the number of heads by the number of sectors.
    Also called geometry.


    # D


    D-sub connector A connector with a D-shaped metal ring around a set of pins.


    DDR See double data rate SDRAM.


    decimal A numbering system with 10 digits, 0 through 9.


    default gateway The address of the router through which your computer goes out
    to the Internet or another larger network segment.


    degauss To discharge a built-up magnetic field within a CRT that may be causing
