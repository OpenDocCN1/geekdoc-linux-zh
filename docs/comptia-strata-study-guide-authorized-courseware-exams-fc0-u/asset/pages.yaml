    # ASCII and Unicode


    Disks store data as binary numbers. Each character can be uniquely described by
    a certain combination of 1s and 0s. The set of codes defines which character corresponds
    to which code called American Standard Code for Information Interchange (ASCII).
    It was developed in the 1960s to achieve some standardization among different
    types of dataprocessing equipment. The numbers and letters familiar to our written
    language are known'
