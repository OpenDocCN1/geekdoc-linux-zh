    # Sharing a Printer on a Network


    After setting up a printer to print on your local PC, you may also decide to make
    it available to other users on your network. This is called sharing the printer.
    When a printer is shared, others can use it as long as the PC doing the sharing
    remains on. If you turn off PC, nobody will be able to use the shared printer.
    (If that''s unacceptable, consider a network-enabled printer, which has its own
    address on the network independent of any PC.) To share a printer, open the Printer
    Properties for the printer and, on the Sharing tab, select the Share Printer Check
    box.


