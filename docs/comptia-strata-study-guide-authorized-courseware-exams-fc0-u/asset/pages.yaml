    # # Shutdown Scripts


    On a networked system, the administrator can manage the remote startup and shutdown
    of any computer connected to the network via shutdown and startup scripts. For
    example, on Windows systems, you can use the shutdown command at a command prompt
    to shut down any device for you know the IP address.


    ```

    shutdown -s -m a.b.c.d

    ```


    Where:


    +   - s is the shutdown option. You can alternatively use -r for reboot.

    - tells the local machine that this is a remote device.

    - a.b.c.d is the IP address of the remote computer. Each letter stands for one
    of the numbers in the four-section number that is an IP address, like this: 241.55.22.67.


    Additional options include the following:


    +   - t for time (in seconds) to delay the shutdown

    - f to force a shutdown, if you have to do so for urgent reasons


    # # Power-Conserving Equipment


    In addition to the OS settings for conserving power, some hardware devices also
    have their own power savings. For example, notebook PCs can use less power than
    desktops, as replacing many desktops with notebooks as possible can save a company
    a significant amount of power. In the following sections, we''ll look at some
    other component savings you can achieve.'
  merge: -1
