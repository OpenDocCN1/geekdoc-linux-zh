  md: '# Chapter 5 • Maintaining a Computer


    broken connection is basically ruined. Connectors inside a PC can come loose as
    well. For example, the cables that connect to the motherboard can work loose,
    as power-supply plugs to drives. Circuit boards can also pop out of expansion
    slots, and chips can pop out of their sockets.


    The other reason to avoid physical trauma pertains to magnetic hard disks. A hard
    disk has read/write heads that skim just above the surface of the drive. When
    the drive is subjected to physical trauma, heads can bounce, scratching the surface
    of the drive and causing disk errors. The risk of this damage is less when the
    computer is off because the read/write head moves into a parked position away
    from any data the drive powers down.


    “Careful” is the best advice for avoiding physical trauma. Examine your work area
    for hazards such as cords running across a path where people work or devices sitting
    near the edge of a table. Make any corrections to ensure a safer work area. If
    you accidentally jar a PC so it stops working, remove the cover and check that
    all the connections are snug.


    For a notebook computer, invest in a well-padded carrying case for whenever you
    transport it.


    # Magnets


    Magnets and computers do not mix. You learned in the discussion of EMI that changing
    magnetic fields generate electricity. A magnet can create an electrical charge
    in a component by being near it, and that can harm or cause corruption in magnetic
    storage devices such as hard disks. For this reason, you shouldn''t use magnetic
    drivers or other magnetized tools inside a PC. Toolkits designed for use with
    electronics are non-magnetized.


