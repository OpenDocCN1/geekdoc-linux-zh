    # Touchpad


    A touchpad (sometimes called a trackpad) is a pressure-sensitive surface across
    which you can run your finger to move the onscreen pointer. A touchpad for a Windows-based
    PC typically has buttons under it, to the right and left mouse buttons; models
    also allow you to tap the touchpad surface to click or double-click. The MacBook
    touchpad shown in Figure 2.6 doesn''t include buttons because on a Mac, no right-clicking
    is needed; Macs use a single-button pointing device, so tapping to click is all
