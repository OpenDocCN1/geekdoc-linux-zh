  md: '# Evaluating a Computer for Upgrades


    Revolutions Per Minute (RPM) More RPM means faster data storage and retrieval.
    So, for example, 7200 RPM is better than 5400 RPM.


    Mechanical vs. Solid State As learned in Chapter 2 (“Input and Storage Devices”),
    solid-state drives are quiet, fast, and reliable, but more expensive.


    # Display Adapters


    On a notebook/portable computer, you''re usually stuck with the display adapter
    that came with it. That is, display adapters are usually built into the motherboard.

    On a desktop PC, the display adapter may be built into the motherboard or may
    be found on a separate circuit board (expansion card). Either way, you can install
    another display adapter instead, or in addition to the one already installed.
    If you don''t want to use the one built into the motherboard anymore, you can
    add as many display adapters to the system as it has compatible expansion slots.
    You can then hook up a different monitor to each.


    Most display adapters sold today use a PCI Express (PCIe) 16x slot (for the higher-ends)
    or 4x slot (for the cheaper ones). Either will work for most uses; high-end gamers
    and graphics professionals prefer the 16x versions which provide extra graphics
    performance that most of us don''t need.

    Does your motherboard have the right slot for the display adapter you want to
    install? Entry-level motherboards may have only one 16x PCIe slot or two x1 slots
    (and no 4x slot), but higher-end motherboards may have one or more types. If you
    have a desktop PC, open the case and see what slots are available and in what
    slot your current display adapter resides. Figure 7.6 shows some PCIe slots, plus
    one older-type PCI slot at the bottom. One additional consideration is that there
    are different versions of PCIe; look 2.0 or higher, and whether your motherboard’s
    PCIe slots will support it.


    # FIGURE 7.6 PCIe and PCI slots (from top to bottom: PCIe 4x, PCIe 16x, PCIe 1x,
    PCIe 16X, and PCI)


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_328_0.png)


    Photo credit: Wikimedia Commons'
