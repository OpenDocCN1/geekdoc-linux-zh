    # Monitors


    A monitor is a video screen. On a notebook computer, the monitor is built in;
    on a desktop computer, it''s a separate component attached to the main computer
    with a cable.


    # LCDs


    Most monitors sold today are liquid crystal display (LCD), the same type of flat-panel
    display found on modern TVs (see Figure 3.2).'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# FIGURE 3.2 LCD monitor


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_136_0.png)


    An LCD screen has two polarized filters, between which are liquid crystals. In
    order for light to appear on the display screen, it must pass through both filters
    and the crystals. The second filter, however, is at an angle to the first, so
    by default nothing passes through. By applying current to the crystal, you can
    cause it to twist, which also twists the light passing through. If the light shifts
    matches the angle of the second filter, it can pass through the filter and light
    up an area of the display. On a color LCD, an additional filter splits the light
    into separate cells for red, green, and blue.


    # CRTs


    You may occasionally see an older type of monitor, the cathode ray tube (CRT).
    This is a boxy monitor, like an old-style television. CRT is essentially a large
    vacuum tube. At the back of the CRT is a long, neck containing a cathode, and
    at the front is a broad, rectangular screen with colored phosphors on it. When
    the cathode is heated, it emits negatively charged electrons. These electrons
    are attracted to the positively charged front of the CRT where they strike the
    phosphors and cause them to light up. In a color CRT, there are three electron
    guns, for each color: red, green, and blue. The actual colors are created by the
    phosphors on the screen. For each pixel (colored dot) on the screen, there are
    three phosphors—red, green, and blue—arranged in a triangle formation called triad.
    Each electron gun works only on dots of a certain color. So, for example, if a
    certain pixel is supposed to be purple, the red and blue guns will fire at, but
    the green gun won''t.'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'The distance between one color in a triad and the same color in the adjacent
    triad is the dot pitch of the monitor. Dot pitch is the primary measurement of
    CRT quality. The lower the number, the closer the dots are together, which makes
    for a better quality picture.


    # Types of Monitor Connectors


    A monitor can use either an analog or digital connection to the computer. CRTs
    are analog only, by nature. LCD monitors use either an analog or digital connector,
    and they usually come with both types of plugs (Some low-end LCD monitors are
    analog-interface only).

    Video Graphics Adapter (VGA) is the analog style of monitor connector (see Figure
    3.3). For many years, VGA was the most popular monitor connector type available
    for personal computers. A VGA connector is a D-sub connector (that is, a connector
    with a D-shaped metal ring around a set of pins) with 15 pins arranged in three
    rows (4, 5, and 6 pins). When a VGA connector is used, the computer converts the
    data to an analog signal before sending it to the monitor; the monitor passively
    receives the signal and displays the information.


    FIGURE 3.3 VGA connector


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_137_0.png)


    Digital Visual Interface (DVI) is the modern alternative (and successor) to VGA.
    It''s a rectangular plug consisting of 24 pins (arranged in three rows of 8) for
    digital transmission plus an extra 4-pin block arranged around a plus-shaped spacer
    that sends analog signals (for backward compatibility). See Figure 3.4.


    FIGURE 3.4 DVI connector


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_137_1.png)'
