  md: '# Preventing Damage to Equipment


    Most new circuit boards, like a replacement video card or sound card, come in
    an antistatic bag. These bags have a coating that collects static charge on the
    outside of the bag, keeping it away from what''s inside the bag. Expensive circuit
    boards should always be stored in an antistatic bag when not in use. Computers
    store extra bags, but most people accumulate a collection of them simply from
    buying and installing new hardware.


    Finally, you can use antistatic spray that minimizes static charge in your environment.
    This is usually a colorless, odorless liquid in a pump bottle that you spray on
    the carpet and on your clothing.


    # Electromagnetic Interference


    Electromagnetic interference (EMI) is caused when electricity passing nearby generates
    a magnetic field that interferes with the operation of a cable or device. Another
    name for this is crosstalk. It occurs only when the PC is on, and it away when
    the PC is off. It causes no permanent damage (usually), but can cause data loss
    if the affected cable is transporting data.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_232_0.png)


    > The Strata objectives include the acronym EMP, which stands for electromagnetic
    pulse, in the Acronym list. The most common use of this term pertains to electromagnetic
    interference caused by nuclear blasts, which don''t have to do with computers.
    Make sure you know what EMP stands for, but you shouldn''t need to know much about
    that.


    EMI can come from unshielded cables, high-voltage power lines, radio transmitters,
    or other sources. Electricity passing through wire generates a magnetic field,
    and magnetic fields generate electricity. Most computers move data via electrical
    pulses, so a changing magnetic field builds up around. When one cable runs next
    to another, each cable''s changing magnetic field can interfere with the data
    being sent along the other cable. Why Because changing magnetic fields generate
    electricity, and the pattern of electricity through the cable is what forms the
    data being sent. When that pattern is altered, the data can become corrupted.


    EMI may be a problem when a data cable isn''t carrying its reliably to its destination.
    For example, perhaps a printer is printing garbage interspersed with the normal
    characters, or a network connection keeps timing out due to transmission errors.
    Power cables can also be susceptible to EMI; this can manifest itself as power
    fluctuation. Power fluctuations, in turn, can cause lasting damage to equipment,
    so in that sense EMI can cause permanent damage.


    Another way to minimize EMI is to select the proper cables to begin with. Shorter
    cables are less prone to EMI than longer ones, so use the shortest cable that
    will do the job.'
