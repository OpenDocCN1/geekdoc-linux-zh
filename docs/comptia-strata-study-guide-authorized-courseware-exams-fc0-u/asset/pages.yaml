  md: "# Chapter 1\n\n# Processing and Memory\n\nCOMPTIA FUNDAMENTALS OF TECHNOLOGY\
    \ (UK)\nIT FUNDAMENTALS (USA)\n\nOBJECTIVES COVERED IN THIS CHAPTER:\n\n+   1.1\
    \ Identify basic IT vocabulary\n    - Processor speed/cores\n    - RAM\n\n![](img/c5fa9b25d23e63f6ffb996940faeace5_60_0.png)"
  merge: -1
