    Network transmission speed is measured in megabits per second (Mbps) or gigabits
    per second (Gbps). Both wired and Ethernet components automatically negotiate
    the ideal speed by finding the maximum that both devices involved in the communication
    can support. For example, if you have an 802.11n router and it''s talking to an
    802.11b device, communication will be negotiated to no more than 11 Mbps because
    that''s the maximum 802.11b device can handle. The same goes for a wired network.
    Components of different ages and abilities negotiate mutually agreeable transmission
    rate between them.


    Similarly, the duplex setting is also auto-negotiated. Duplexing is the ability
    of devices to both talk and listen:


    +   * Simplex means the communication is one-way. For example, a car radio is
    a simplex device; it doesn''t send. It requires only one communication channel.

    * Half-duplex means there is two-way communication, but only in one direction
    at a time. After a device is finished sending, it must send an "all clear" signal
    to indicate that it''s done speaking; only then the other device respond. This
    also requires only one communication channel.

    * Full duplex means there is two-way simultaneous communication. When you talk
    on the telephone, for example, that''s full duplex, because you can hear the other
    person speaking even when you''re speaking too.


