    between 802.11g (catcher) and 802.11n (faster and greater range). These standards
    are covered in more detail later in this chapter.


    Interface Type A desktop PC can accept an expansion board (provided the PC has
    an open slot for it; a notebook PC will probably require a USB adapter.


    Most adapters are Plug and Play, so Windows recognizes them and sets them up when
    you install them. In some cases, you may need to run the Setup program that comes
    with the adapter to finalize its installation in Windows. Each adapter has a unique
    48-bit Media Access Control (MAC) address. No two adapters in the entire world
    have the same MAC address; it''s assigned by the manufacturer of the device. MAC
    addresses are usually written as groups of two hexadecimal digits, separated by
    hyphens or colons, like: 01-23-45-67-89-AB. As an end user, you don''t need to
    know the network adapter''s MAC address; however, the internal workings of network
    transmission re-ly rely heavily on the MAC address in order to ensure that packets
    of data are intelligently routed to the right locations.


    > WARNING Although intended to be permanent and globally unique hardware identifiers,
    MAC addresses can be faked and changed, so they can be used as 100 percent positive
    identifiers of the origin of a message.


