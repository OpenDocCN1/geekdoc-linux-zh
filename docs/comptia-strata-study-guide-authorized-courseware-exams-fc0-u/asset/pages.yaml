    # Assessing Compatibility


    When considering an OS upgrade, you must look not only at the minimum system requirements
    (from the preceding tables), but also compatibility for individual pieces of hardware
    and software. For example, not only should you ensure that you have enough display
    RAM to meet the system requirements, but you should also check to make sure your
    hardware and model of display adapter are supported under the new version. If
    the OS version is very new, not all hardware manufacturers may have released a
    driver for it. If the piece of hardware is old, the manufacturer may never release
    a driver for that OS version. Sometimes older OS versions will work fine, but
    you cannot rely on them.


    Compatibility checking before upgrading is particularly important if you are upgrading
    from a 32-bit version to a 64-bit version of the OS, you''ll need 64-bit versions
    of the hardware drivers. Windows comes with a basic set of drivers for generic
    use, and it will try to use one of these if it can''t find the exact driver, but
    it''s better if you have the specific drivers from the hardware manufacturers.'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# Chapter 6 • Installing and Configuring Software


    Some of the components for which you should research compatibility before upgrading

    include the following:


    +   - Dial-up modem

    - Network adapter

    - Display adapter

    - Sound card (or built-in support)


    Be particular sure you have a usable driver for your network adapter before upgrading,

    because you''ll need to connect to the Internet to find any other drivers you
    may be

    missing. It''s a real pickle when you need the Internet to find a network driver,
    but you may need

    net driver to get to the Internet.


    Components like the hard drive, processor, and RAM can generally be assumed to
    be

    compatible as long as they meet the minimum system requirements. The keyboard
    and

    mouse can also be assumed to be functional when you upgrade, although if you

    ave a special model of either with extra features and buttons, you may need a

    driver update to continue to use those extras.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_295_0.png)


    > One good way to investigate hardware and software compatibility for

    Windows 7 is via Microsoft''Windows 7 Compatibility Center, located

    at www.microsoft.com/windows/compatibility/windows-7/en-us/

    default.aspx.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_295_1.png)


    > If you''re unable to locate a driver for a device from the official channels
    of

    either the hardware manufacturer or the OS manufacturer, it may be tempt-

    ing turn to a third-party driver website. In some cases, you may be able to

    find a driver at one of these sites that will serve your needs; be very cau-

    tious, because there are many third-party sites that try to steal your personal

    information or download harmful malware to your computer.


    # Assessing Upgrade Paths


    An upgrade path is a method of getting one OS version to another.

    Depending on the versions involved, you may be able to do an upgrade install,
    which

    stalls the new version over the top of the old one, retaining all applications
    and data files;

    or you may have to do a clean install, which wipes everything out and starts fresh.


    Microsoft has offered low-expensive upgrade versions of some OS versions for sale;
    these

    are exactly the same as the non-upgrade versions except as part of the setup process,

    tcheck to make sure you have an eligible previous version installed. One common\misconception
    people have is that you can''t upgrade your OS unless you have an upgrade

    version, but that''s not true. Both the upgrade and the non-upgrade versions will
    work to

    upgrade the OS, provided there is a valid upgrade path between the old and new
    OSs.'
  merge: -1
