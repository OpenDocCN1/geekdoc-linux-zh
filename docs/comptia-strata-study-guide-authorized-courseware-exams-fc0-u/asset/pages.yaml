- img_proc: true
  md: '# # Preventing Electrical Damage


    Computers run on electricity, but they are pretty specific about the amount and
    type they need. The wrong type of electricity can weaken and even destroy a circuit
    board or processor chip. There are some electrical threats about which you should
    be aware.


    # ## Electrostatic Discharge


    Electrostatic discharge (ESD) is the most common culprit for ruined PC parts,
    although many people have never heard of it. ESD is really just static electricity,
    the same thing that can shock a person on a low-humidity day.


    ESD occurs when two items of unequal voltage potential come into contact with
    one even out the voltage. The item with the higher charge passes electricity to
    the one with the lower charge an analogy two bodies of water meeting; if one has
    a higher level, water will flow quickly into the other until they''re the same.
    In the case of electricity, equalization happens so fast that the item of lower
    charge receives a burst of electricity that feels like a shock. You''ve experienced
    ESD firsthand if you''ve scuffed your socks on the carpet and touched someone,
    giving the person a shock. You shocked yourself, in that case, you were the item
    of higher charge.


    When voltage (measured in volts) interferes in electrical charge, current is the
    rate at which electrical charge is measured in amps. ESD is a high-voltage shock,
    (3,000 volts or so), but it doesn''t draw electricity strongly; it merely draws
    the charge and then stops. To damage a human body, there must be sufficient amps
    as well as volts. The human body has high resistance, that is why a 110-volt outlet
    can hurt a person more than a 3,000-volt static shock.


    Electronic equipment, though, is extremely sensitive to damage by high voltage,
    even when the amperage is very low. Humans notice only when it reaches 3,000 volts
    or so, but ESD can damage a circuit board with less than 1 percent of it. Some
    experts say as little as one volt is enough to do some damage). This means a person
    could touch a circuit board and destroy it with static electricity without even
    noticing. The next time they tried to use that circuit it would be dead, and they
    would have no idea why. Furthermore, ESD doesn''t always show up immediately.
    It may cause the device to malfunction, or may weaken the device to the point
    that it lasts a week or a month later.


    Generally speaking, any exposed circuit boards are targets for ESD damage, especially
    motherboards. Devices are both on and off those boards, particularly RAM and ROM.
    Devices not susceptible to ESD include those in which circuit boards are not exposed,
    such as keyboards, mice, speakers, monitors, and printers, and those that don''t
    contain circuits.


    If you open your computer''s case, the risks of harming it by ESD are very low.
    If you have to work inside a PC for some reason, such as to install a new circuit
    board or more RAM, here are some tips:


    +   - Beware of the clothing you wear when working inside a PC. Synthetic materials
    as nylon generate much more ESD than fibers cotton and wool, so use natural fabrics.
    Avoiding working in stocking feet—wear rubber-soled shoes. Keeping the humidity
    in the work area can also help considerably. The ideal humidity for PC hardware
    is 50 to 80 percent.'
  merge: -1
