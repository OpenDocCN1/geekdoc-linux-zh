    # Preventing Other Types of Damage


    Besides electricity, there are several other threats to PC’s health and safety.
    The following sections summarize the most common ones about which you should be
    aware.


    # Liquids


    Water and electronics don''t mix. Do whatever you can to keep water away from
    your computer. This includes not setting beverages near the computer where they
    can be knocked over into it, not setting cold items on an air vent that may drip
    water from'
