    # Temperature


    As a PC operates, certain components become hot; cooling fans and sinks help channel
    the heat away, as you learned in Chapter 1, "Understanding Computer Hardware."
    The cooler the room in which the PC sits, the easier it is for those components
    to stay cool. Don''t make the room too cool, because at very low temperatures
    (below freezing), frost build-up can become an issue. The heat from the PC melts
    the frost, which creates water, and water may cause the possibility of short-circuiting.


    In the past, computers were more sensitive to temperature than they are today.
    At one time it was common to find a computer room at a corporate headquarters
    where a floor cool air air circulating, the air conditioning was on high, and
    employees dressed warmly all year. These days have mostly been replaced by ordinary-looking
    PCs that don''t require any special treatment. The mean PC cooling requirements
    are no less stringent than today''s CPUs run at much lower voltages. Still, its
    probably remember to remember the cold more than people do. If the people are
    cold, the PC is probably comfortable. If the people are hot, the PC is very hot.


    Storage temperature for PC components is less of an issue than operating temperature,
    and extremes must be avoided. Don''t store your PC in an unheated shed in a cold
    climate all winter, and don''t leave it in the back of a car in the summer months.


    When you bring a PC inside after it has been very cold or very hot, let it sit
    until the temperature is the same as the room it is turning in. This is especially
    important when bringing it in from the cold, because condensation can create damp
    inside the PC.


    Computers subjected to ultra-hot temperatures, such as in building fires, will
    probably not work anymore plastic parts will have melted. However, the hard disk
    might still have recoverable data. Connecting the hard disk to another computer
    to see if it is readable. If it contains important data, and can be read normally,
    a data recovery service may be to help (although not cheaply).


    # Physical Trauma


    Computers aren highly susceptible to physical trauma, but it''s best to handle
    them with reasonable care. Everyday bumps like inadvertently kicking a PC that
    is sitting on the floor probably won''t cause any problems, but knocking a PC
    off a table while it''s running can cause damage.


    There are two reasons why physical trauma is bad for a PC. One is that it parts
    to come loose. If someone drops a circuit board and hits the floor just, a wire
    connection or resistor to resistor the board can come undone, or some may be knocked
    off. Most people don''t have the skill to repair a circuit board, so a board with
    a'
