  md: 'If you fire up a new hard disk drive and it doesn''t appear to be accessible,
    don''t panic. That''s normal. A new hard disk will need to be partitioned and
    formatted before you use it (unless it happens to be partitioned and formatted
    already). See Chapter 2, which explained the partitioning and formatting procedures.
    You can use the Disk Management utility in Windows, to partition and format a
    drive.


    > NOTE If you''re given a choice of filesystems with which to format a drive in
    Windows, choose NTFS. That''s the most efficient and effective filesystem. Choose
    FAT32 only if you require backward-compatibility with a very old version of Windows
    (98/Millennium Edition, for example).


    If Disk Management does not see the drive you entered, you may need to go into
    BIOS Setup and change one or two in the drive to be recognized. Some BIOS Setup
    programs enable PATA or SATA connectors to be turned off to save system resources,
    and if this drive is using a motherboard connector that has not been previously
    used, it may need to be turned on.


    # EX 7.5


    # Remove and Install a Disk Drive


    +   1. Unplug a desktop PC, and open the case.

    2. Remove one of the disk drives from the system. If it''s a PATA drive, examine
    its jumper settings. Don''t change them.

    3. Reinstall the drive.

    4. Restart the computer, and confirm that everything still works.


    # Installing a Circuit Board


    Some upgrades for desktop PCs in the form of circuit boards that fit into slots
    the motherboard. These upgrades can include display adapters, network adapters,
    modems, sound cards, and so on.


    Before you bought the circuit board, presumably you checked to make sure you had
    the right slot on the motherboard, the actual process of installing the circuit
    board should be fairly simple.


    First, open the case and identify how the circuit boards are held in place. On
    some systems, a clamp or bar holds them all down, as shown in Figure 7.14. On
    others, each board is held in place by its screw that attaches to the metal back
    plate of the case.


    Next, if you''re replacing an old board, remove it. Release the clip or screw
    that holds it in place, and then pull it straight out of the slot, holding the
    board by its edges.'
