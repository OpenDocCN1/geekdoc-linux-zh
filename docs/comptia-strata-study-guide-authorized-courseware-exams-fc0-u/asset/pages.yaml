    # Understanding and Preventing Malware Attacks


    Malware is a broad term used for many attacks on computer systems. It''s shorthand
    for malicious software, and it covers anything that has been installed on anyone''s
    computer without their consent and is intended for mischief. When thinking about
    malware, you should consider the following:


    +   * Exploits These take advantage of flaws in the OS or an application.

    * Viruses These are used to cause damage and/or disruption.

    * Worms These are used to transmit malware.

    * Trojan Horses These are applications that mask hide their true intent.

    * Adware These are used to display unwanted advertisements.

    * Spyware These are used to report on your computer and possibly steal data.

    * Rootkits These conceal themselves on the host OS.

    * Backdoors These open ports or other routes into your system.

    * Keyloggers These are used to record every keystroke and use that data for identity
    theft.

    * Botnets These are used to harvest the resources of many Internet-connected computers
    for often-illitimate purposes.


    In the following sections, you''ll learn about several types of malware, and you''ll
    find out how antivirus, spyware, and antispam applications help you combat.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_408_0.png)


    > Mac and Linux systems aren''t completely immune to malware attacks, but Windows
    systems run a greater risk of infection. This is partly because computer-hacking
    criminals have an axe to grind against Microsoft, and partly because Windows is
    the most widely used OS, so any financial gain a criminal might get from malware
    would be maximized by targeting Windows systems.


    # OS and Application Exploits


    All OSs and applications have potential vulnerabilities that criminals can exploit.
    A vulnerability exists when a flaw in the programming creates the potential for
    misuse,'
  merge: -1
  pgno: 408
- img_proc: true
  md: 'An attacker is aware of the flaw, and a tool or technique that the attacker
    can use to exploit vulnerability for malicious purposes is readily available.
    When criminals use a vulnerability to attack a system, it''s called an exploit.


    Some OSs are considered to be more secure than others, the reality is that all
    OSs have weaknesses that, when discovered, are exploited. Against exploits, Windows,
    Linux, and Mac OSs all have mechanisms to update and patch their OS automatically
    as programmers become aware of vulnerabilities. Why it''s important to download
    and install all available updates and service packs for your OS promptly. Refer
    to Chapter 5, "Maintaining a Computer," and Chapter 6 for details on Windows Update.


    Applications can also be exploited, although it happens less frequently because
    an application is smaller and less appealing target to a criminal. Widely used
    applications like Microsoft Office are often the targets of application exploit
    attempts.


    As an application or OS ages, more and more secure patches become available for
    it, to maintain rolling them all out individually to users becomes unruly. At
    that point, the OS or application typically provides a service pack. A service
    pack is a collection of critical updates (and minor enhancements) that are released
    as a group. A service pack is a regular update that it takes longer to download
    and install, and you can''t remove it after installing it.


    # Viruses


    A virus is a computer code that inserts itself into an executable file. When that
    file is run, the virus''s code executes along with the application''s code. The
    virus hides itself inside the file, so it is not obvious that it''s there. A virus''s
    code can cause all manner of mischief, from annoying-but-harmless things like
    displaying a message, to really destructive things like deleting all files of
    a certain type or causing your OS to stop working. Most viruses have a self-replicating
    component that causes them to spread from one executable to another. This happens
    via RAM. When the infected file executes, the virus code is copied into RAM, and
    then it can attach itself to other executable files.


    Many other types of malware are loosely grouped under the term "virus" and are
    detected and removed by antivirus software (covered later in this chapter), but
    they are not actually viruses because they don''t hide themselves in executable
    files. Instead they may be worms or Trojan horses, explained in the following
    sections.


    # Trojan Horses


    Trojan horses (often known as Trojans) are rogue applications that may appear
    to do something useful (and, in fact, may do some small useful things) but also
    secretly do malicious, such as damaging your system or install a privacy-compromising
    application. One insidious type of Trojan horse, for example, is a program that
    claims to scan your system for malware but instead changes system properties (which
    it tries to get rid of) or installs its own malware, such as a keylogger. A keylogger
    records all keystrokes and sends the information to a file or to a remote location.
    The hacker can'
