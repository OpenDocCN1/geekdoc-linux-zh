    digital subscriber line (DSL) A Broadband Internet service that delivers Internet
    connectivity via telephone lines.


    Digital Versatile Disc/Video Disc (DVD) An optical disc that, like a CD, stores
    data in patterns of more and less reflective areas, but holds more data than a
    CD.


    Digital Visual Interface (DVI) A connector for connecting to VGA monitors. It’s
    a rectangular plug consisting of 24 pins for digital transmission plus an extra
    4-pin block for analog signals for backward compatibility.'
