  md: '# FIGURE 9.3 Sharing a specific folder in Mac OS X


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_386_0.png)


    # Configuring a Mac to Share with Other Computer Types


    The default sharing protocol is Apple File Protocol (AFP), which is used to share
    files with other Macs. If other computers need access too, click the Options button
    at right side of the Sharing window (see Figure 9.2), and then enable one or both
    of the other protocols:


    **Share Files and Folders Using FTP Apple File Protocol** For sharing with Unix
    and Linux systems. FTP stands for File Transfer Protocol.


    **Share Files and Folders using SMB** For sharing with Windows-based PCs. SMB
    stands for Server Message Block.


    If you''re sharing files with a Windows-based PC, you''ll need to join the appropriate
    Windows workgroup:


