    wildcard A character that stands for one or more characters, such as ? for individual
    characters and * for multiple characters.


    Windows Explorer The file-management interface in Microsoft Windows.


    Windows RE See Windows recovery environment.


    Windows Recovery Environment (RE) An interface for recovering from serious problems
    with Windows Vista or Windows 7 that prevent the OS from booting normally.


    wireless access point (WAP) A wireless network switch.


    word size The amount of data that can simultaneously enter the processor in one
