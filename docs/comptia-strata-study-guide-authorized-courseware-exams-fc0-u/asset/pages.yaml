    # Summary


    In this chapter, you learned some OS configuration basics, including how to manage
    user accounts, control the date, and change the screen resolution. Your OS has
    many other configuration options that you may want to explore on your own if time
    permits. Next, you learned how to update and upgrade the OS. You learned the risks
    and rewards of installing manufacturer-provided updates and how to choose a new
    OS version and edition.


    Finally, we looked at application installation, repair, and removal. You learned
    how to assess whether an application is likely to work well on your system, and
    you learned about important preinstallation activities like securing administrative
    rights and checking for Internet access issues. You also learned how application
    software is typically licensed.


    # Exam Essentials


    Know how to make basic changes to the OS settings. In Windows, you can change
    most settings via the Control Panel. On a Mac, commands for changing system settings
    are found in the System Preferences pane.


    Be able to create and manage user accounts. You can create new user accounts and
    set their permissions to control who has access to the system and at what level.
    In Windows and Mac OS, you can create standard or administrator accounts.'
