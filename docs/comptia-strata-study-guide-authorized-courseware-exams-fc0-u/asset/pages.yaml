- img_proc: true
  md: '# Device Failures 305


    and if you may be able to restore the deleted files from there. If you put all
    the files back where they belong, the application may start working again.


    A virus infection can cause programs to run slowly, poorly, or not at all. Many
    viruses affect the entire system, though, not just one program. If you''re having
    viruses with only one application, it isn''t likely to be the cause. There''s
    one exception to that: viruses target antivirus software specifically, so if everything''s
    working other than your antivirus software, you''re probably infected. See Chapter
    9, "Security and Access Control," for more details about viruses and how to remove
    them.


    Some programs have limited-time licenses, so it''s possible that an application
    that previously worked stop working due to a license expiration. In such cases,
    though, a helpful dialog will usually appear to tell you how to pay the software,
    or there''s not much doubt about what''s happening.


    If you''ve recently installed an OS or application update, and then suddenly an
    familiar application won''t work anymore, it''s probably the update''s fault.
    You can try removing the update (if possible), or contact the application manufacturer''s
    Support department for help.


    # Application Crashes


    Crash is the term used to describe a situation when an application stops working.
    It may stop working due to a programming error in its code or to a conflict or
    compatibility issue with a device driver, with the OS, or with another application.


    When applications stop, it may terminate by itself, or you may have to terminate
    it manually. To do so in Windows, right-click the taskbar and choose Task Manager.
    Then, in the Task Manager, on the Applications tab, click End Task. The task may
    not be Responding in the status column. Click End Task.


    On a Mac, to force-quit an application, choose Force Quit from the Menu or press
    Command+Option+Esc and select the unresponsive application in the Force Quit window
    and click Force Quit.


    If an application crashes only once, it may be a fluke; if the same application
    keeps crashing it''s time to do a little detective work to figure out what might
    be the problem. If an error message appears, make a note of it. Try closing all
    other applications, including any background applications you don''t need, and
    running the application again to see if that helps. If it does, the problem stems
    from a conflict with some other program. You may need to uninstall and reinstall
    the crashing application, or check the manufacturer''s website for troubleshooting
    tips.


    # Device Failures


    Any hardware component can fail, and the longer you keep your computer, the more
    likely it is that you''ll experience at least one hardware failure. Hardware troubleshooting
    can be complex, but the Strata confines itself to a few topics related to hardware
    troubleshooting. The following sections target the Strata-specified topics.'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# Hardware/Driver Compatibility


    A driver is a file (or set of files) that contains information needed for the
    OS to communicate with a hardware device. One way to think of a driver is a language
    translator between the OS, which speaks language, and the hardware, which speaks
    an entirely different one.


    The skill of the interpreter makes all the difference in any communication, and
    a driver that can accurately translate between the OS and the hardware is essential
    for satisfactory hardware functionality. Therefore, it''s important to pick the
    best driver available. If an unsatisfactory driver is installed (perhaps one that''s
    not specifically designed for the OS or device being used, the device may behave
    strangely or not work at all.


    The best driver is one that (1) specifically for that device (most important),
    (2) specifically for that OS (moderately important), and (3) the most recent version
    available (least important). When you install a hardware device, you have a choice
    of drivers, and your challenge is to figure out which fits the best. Your choices
    may include the following:


    +   - The OS may supply a driver for the device and install it automatically via
    Plug and Play.

    - The device may come with a setup CD or DVD that contains an appropriate driver.

    - A driver may be available on the device manufacturer''s website that is even
    more current than the one that came with the device.


    See the section "Updating Device Drivers" in Chapter 7 ("Upgrading and Updating
    Hardware\ and Exercise 7.1, for information about replacing the driver you are
    using.


    # Malfunctioning Input Devices


    An input device, such as a keyboard or mouse, may malfunction for a variety of
    reasons. For example, the wrong driver may be installed for it (see the previous
    section), or it may be incompatible with your OS. For example, some mice and trackpads
    are specifically designed for Macintosh computers, and they won''t work if you
    plug them into a Windows-based PC.


    After you''ve eliminated incompatibility and bad drivers as the cause of an input
    device malfunction, next look at the device itself. Is anything physically wrong
    with it? If it''s a mouse, will the ball turn freely? If it''s a keyboard, will
    all the keys press? Is the cord or connector damaged? Has something spilled on
    the device? Has it been dropped or hit?


    If there''s physically wrong with the device, try plugging it into a different
    computer possible. If it works, then the problem is the relationship between the
    device and the original computer, not the device itself. Investigate things like
    driver issues, incompatibility, and the connector on the PC into which the device
    connects. If it doesn''t work on the other computer, the device is probably defective.


    An input device that gradually stops working over time, or malfunctions only in
    a specific way (such as a certain key not working on a keyboard, or a mouse that
    moves in only one direction) be dirty. Try cleaning the device, as you learned
    to do in the section "Cleaning a Computer" in Chapter 5 ("Maintaining a Computer").'
  merge: -1
