    # Internet Access Issues


    When you''re installing an application that requires Internet access as an integral
    part of its functionality, you have some additional considerations to evaluate.


    First and foremost, does your Internet connection have the bandwidth to handle
    this application''s demands? *Bandwidth*, in this context, refers to the connection''s
    ability to send data quickly and in large quantities. For example, if you want
    to play an online game, such as World of Warcraft, the life and death of your
    game character could depend on your Internet connection. Sending your instructions
    to swing your sword instantaneously; a two-second delay of slow or unreliable
    Internet service can be the difference between winning and losing a battle.


    *Contention* is also an issue—that is, competition with other Internet users for
    the bandwidth. Perhaps other users are also trying to use the Internet at the
    same time, traffic gets bogs down. If you have cable Internet service, the bandwidth
    with everyone else in your neighborhood, not just those in your own building.
    Therefore, during periods of usage, you may not have the same Internet bandwidth
    available that you do in off hours.


    > The speed of a broadband Internet connection is seldom the root cause of Internet
    delays. Therefore, upgrading to a level of Internet service with a faster speed
    isn''t the magic-bullet solution that it may seem on the surface. The advertised
    speed of your connection is the speed you theoretically achieve if there were
    no other traffic, and if your connection always operated at that speed all the
    time, things would be great. But during high-traffic times, contention can cause
    major delays, like a rush-hour traffic jam on a highway.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_302_0.png)


    Some of the applications that rely heavily on a fast and reliable Internet connection
    include the following.'
