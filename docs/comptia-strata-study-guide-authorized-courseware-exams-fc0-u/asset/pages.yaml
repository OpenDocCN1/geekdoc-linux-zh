  md: '# Using the CD


    To install the items from the CD onto your hard drive, follow these steps:


    +   1. Insert the CD into your computer''s CD-ROM drive. The license agreement
    appears.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_450_0.png)


    > Windows users: The interface won''t launch if you have imaju disabled. In that
    case, click Start > Run (for Windows Vista or Windows 7, Start > All Programs
    > Run). In the dialog box that appears, type D:\Start.exe (Replace D with the
    appropriate letter if your CD drive uses a different letter. If you don''t know
    the letter, see how your CD drive is listed under My Computer.) Click OK.


    +   2. Read the license agreement, and then click the Accept button if you want
    to use the CD. The CD interface appears. The interface allows you to access the
    content with just one or two clicks.


    # Troubleshooting


    Sybas has attempted to provide programs that work on most computers with the minimum
    system requirements. Alas, your computer may differ, and some programs may not
    work properly for some reason.


    The two likely problems are that you don''t have enough memory (RAM) for the programs
    you want to use, or that you have other programs running that are affecting the
    installation or running of a program. If you get an error message as "Not enough
    memory" or "Setup cannot continue," try one or more of the following suggestions
    and then try using the software:


    **Turn Off Anti-virus Software Running On Your Computer** Installation programs
    sometimes mimic virus activity and may make your computer incorrectly believe
    that it''s being infected by a virus.


    **Close All Running Programs** The more programs you are running, the less memory
    will be available to other programs. Installation programs typically update file
    and programs; if you keep other programs running, installation may not work properly.


    **Have Your Local Computer Store Add More RAM to Your Computer** This is, admittedly,
    a drastic and somewhat expensive expense. However, adding more memory can really
    help the speed of your computer and allow more programs to run at the same time.


    # Customer Care


    If you have trouble with the book''s companion CD-ROM, please call the Sytex Technical
    Support phone number at (800) 762-2974.'
