  md: '# Internal and External Storage Devices


    bus uses it. Solid-state hard drives use the same fast SATA or PATA interface
    as mechanical hard drives, and have similar caches and controllers to mechanical
    hard drives.

    Solid-state drives offer many benefits over mechanical ones and have few drawbacks.
    The primary drawback at this is price; mechanical drives are less expensive for
    equivalent storage capacity. Table 2.8 summarizes the pros and cons of each technology.


    # TABLE 2.8 Solid-state vs. mechanical hard drives


    | Advantages Solid State | Mechanical | Disadvantages Solid State | Mechanical
    |

    |---|---|---|---|n| Faster start-up time | Lower cost per megabyte | Higher cost
    per megabyte | Slower startup time |

    | Faster access, because there is no seek time for a read/write head to locate
    | Theoretically unlimited writes to media | Limited lifetime, based on number
    of writes | Seek time a factor, mitigated by disc revolution speed |

    | Silent operation, no moving parts | Still greater storage capacity | | Less
    resilient to shock and damage |

    | Low heat output and consumption | | | |

    | High mechanical reliability (no moving parts) | | | |

    | Resilient to shock and damage | | | |

    | Large data density (per square centimeter) | | | |


