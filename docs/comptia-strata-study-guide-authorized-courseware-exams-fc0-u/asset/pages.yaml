  md: 'Identify techniques for minimizing risk. When using a computer, the risks include
    damaging yourself, damaging the computer hardware, losing data, and losing access
    to services. You should be able to identify ways to minimize all of those risk
    types, using techniques such as battery conservation, backups, data recovery,
    and physical safety precautions.


    Be able to clean all parts of a computer. Key cleaning equipment for a PC includes
