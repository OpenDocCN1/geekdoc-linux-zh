    # Digital Rights Management


    Digital content is pirated more frequently than applications, so over the years
    suppliers of digital content (books, music, videos, and so on) have developed
    various schemes of preventing unauthorized sharing of content. Generically, these
    schemes are known as *digital rights management* (DRM).


    DRM is not new. Cable TV scrambling has been using for years: your service provider
    issues a card with a recognition identifier that can be activated remotely to
    enable you to access an array of copyrighted content.


    For music files, DRM has proved controversial, because people paying for music
    they have downloaded haven''t always been able to transfer the files to other
    media they legitimately use (such as a CD for their automobile).


    Applications are available that will crack the encryption on DRM-protected files
    (especially music and video). The makers maintain that the software is strictly
    to allow legitimate owners of the clips to make backup copies for their own use,
    which is legal; but in practice most the "backup copies" end up being illegally
    shared with others.


    # Repairing or Reinstalling an Application


    If an application doesn''t work, you may be able to repair it. Some applications
    have a built-in repair feature that compares the installed files to a list of
    originals and fixes anything that has been improperly. For example, it may check
    the filenames and sizes of all the helper files, and if it finds a file that is
    different size than expected, it assumes that file has been corrupted and recopies
    an original version to overwrite it. The repair process can also checking the
    Windows Registry (or equivalent in other OSs) to make sure the proper entries
    are present that will allow the application to function correctly.'
