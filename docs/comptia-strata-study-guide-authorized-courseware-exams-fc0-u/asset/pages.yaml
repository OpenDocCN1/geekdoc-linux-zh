  md: '# Chapter 6 • Installing and Configuring Software


    When you''re installing updates, be aware that some updates require you to reboot
    the computer when they finished installing. This can be an inconvenience if you''re
    in the middle of an important project or have many open windows and applications.
    When an update requires a reboot, you can decline to restart until a convenient
    time. If it''s an update that is very important, the OS will remind you until
    you do it, letting you postpone the next reminder for a certain amount of time,
    from a few minutes to a few hours.


    Although it may seem convenient to avoid automatic updates by restarting despite,
    there are risks associated with ignoring an available update. Some updates address
    critical security flaws. If you don''t install updates promptly to protect your
    system, your PC may be vulnerable to attacks from the Internet.


    Windows Update (or Software Update on the Mac) can also recommend and install
    updates for certain applications, especially those made by the same company as
    the OS itself. Also, depending on your hardware, it may be able to make updates
    for your hardware drivers available, such as a new version of display-adapter
    driver or network-adapter driver.


    A major update to the OS is typically rolled out to consumers as a service pack.
    A service pack is like any other update except for its scope; it typically alters
    the workings of the OS in a deeper way than a regular update.


