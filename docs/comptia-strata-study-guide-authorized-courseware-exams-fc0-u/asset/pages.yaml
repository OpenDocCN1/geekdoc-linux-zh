  md: '# Preface


    There was a time where the discipline of information technology systems support
    was considered a mythical skill—to be practiced by a chosen few from a somewhat
    selective priesthood.


    Fortunately, membership of this mysterious priesthood has become more accessible
    for everyone. With information technology becoming less mysterious and more open,
    the opportunity for many individuals to take on the solemn responsibility of systems
    support specialist has been enhanced through the work of independent organizations
    such as CompTIA.


    The skill of computer support once defied a dark art. This was made confusing
    by the lack of suitable training and the absence of any internationally recognized
    certification accompanied by good training resources.


    I have worked in the systems support and networking industry for more than 20
    years, and I have been involved in teaching for at least 15 years. I see that
    the demands on IT professionals have increased at the pace as the many developments
    in hardware and software.


    It isnt unusual for information systems professionals to be expert in hardware,
    software, operating systems, and while they are also expected to know about every
    new development on the market and be able to support all the technologies in many
    organizations (and in homes, for at the same time.


    Unfortunately, it''s enough to have one skill and that the technology won''t change.
    As you''re reading this preface, some technology company has just announced a
    new release or revision to the phantasmagoria of techie toys you can plug into
    your personal computer.


    If things aren''t complicated, the advent of smartphones and tablet devices adds
    even more tools and technologies to the mix. But in the immortal worlds of Douglas
    Adams, "Don Panic."


    This book will introduce you to everything you need to know how you started in
    supporting computers and all the related technologies in use. We''ll keep everything
    as simple as possible while giving you all the tools you need to get started in
    the Information Systems Support and develop the knowledge required to help you
    toward the CompTIA Fundamentals of IT certification.


    You''ll learn what you need to remain skilled as an information systems professional.
    Your education won''t stop here, because you may work in an industry where it
    will continue, we hope forever. Also, consider that your experience with this
    book will lead you to higher-level certifications, such as the CompTIA A+ exam.


    While reading this book, take the time to explore each technology discussed, and
    don''t be afraid to experiment with your computer. You''ll learn more and gain
    greater confidence if you learn by rather than trying to acquire experience by
    reading alone. Your practical skills will be a longer-term asset; the more you
    work on, the better you''ll become.'
