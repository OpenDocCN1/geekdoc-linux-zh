  md: '# Chapter 7 • Updating and Upgrading Hardware


    Besides choosing the interface to use, you should also consider these factors
    when shopping for a display adapter (additional or replacement):


    **Amount of RAM** The RAM a display adapter has available to it, the higher the
    resolutions it can display and the better its 3D support.


    **Cooling** Higher-powered displays adapters typically have either an active or
    a passive cooling device on one or more of the chips. As you learned in Chapter
    1, active cooling is more effective but requires more power to operate.


    **Output Ports** Some display adapters support VGA or DVI output, but most cards
    have at least one of each type of port, or two DVI ports.


    **Maximum Resolution** As you learned in Chapter 3 ("Peripherals and Networking”),
    monitor resolution is expressed in pixels horizontally × vertically, like this:
    1920 × 1200. Higher is better, but only to the extent that your monitor can keep
    up.


    **Core Clock** A display adapter has its own processor, which has a clock speed
    measured in MHz. Higher is better.


    **Memory Speed** A display adapter that has its own RAM also has a clock speed
    (in MHz) and a memory bandwidth (GB/sec).


    # Devices Use External Ports


    If you''re adding or upgrading an external device, what port will you plug it
    into? Does your computer have the right port? We looked at ports extensively in
    Chapter 4 ("Setting Up Computer”), so look back now if you need a refresher on
    the various ports and their standards (USB, FireWire, and so on).


    Most devices use the USB port. Depending on the age of the system, this could
    be a USB 1.1, 2.0, or 3.0 port. Each of these has a maximum speed, but they''re
    compatible with earlier versions. For example, if the computer has a USB 2.0 port
    and you''re using a device that requires a USB 1.1 port, you''re good to go. The
    device will operate at its maximum speed. However, if the situation is reversed
    and the computer''s USB port is of a lower standard than the device, you may have
    a problem if the device requires a high-speed connection. (An external hard drive
    is the most common example.)


    With FireWire, the original spec is shown in Chapter 4, Figure 4.19. There are
    also newer FireWire standards called FireWire 800 and FireWire S800 that are data-compatible
    with FireWire 400 but require a special adapter to make the ports physically compatible.


    When replacing adapters on an old PC, keep in mind that the type of port used
    in the original device may not be widely available. For example, if you have an
    old parallel printer that you''re replacing, parallel-interface ports are no longer
    sold today; you''ll need to use a USB model. Most PCs have at least one USB port,
    even those that are old enough to support parallel ports, but it doesn''t hurt
    to check before you buy.


    Keyboards and mice use a PS/2 connection can easily be replaced by USB models;
    just leave the PS/2 ports on the system empty and connect the new to USB ports.
    If the system is so that it doesn''t have a USB port, or you don''t have one,
    you can buy'
