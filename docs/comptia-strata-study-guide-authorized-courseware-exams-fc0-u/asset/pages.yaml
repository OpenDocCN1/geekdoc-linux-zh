  md: '# C


    cache A temporary storage area for recently used data, located near the processor
    and connected to it by an extremely high-speed pathway.


    carcinogen A product or substance that causes cancer.


    CardBus An older type of expansion slot and card for notebook computers. CardBus
    was replaced by ExpressCard, the current standard.


    case The rectangular shell of a computer, into which everything else connects.


    Cat5 A type of U cable that can carry data up to 100 Mbps.


    Cat5e A type of U cable that can carry data up to 10 Gbps.


    Cat6 A type of U cable that can carry data up to 10 Gbps.


    cathode ray tube (CRT) A type of monitor that is large and bulky, like an old-style
    television. It uses an electron gun to light up phosphors on a screen to create
    the image.


    CAV See constant angular velocity.


    CCD See Compact Disc Recordable.


    CD-R See Compact Disc Read-Only Memory.


    CD-RW See Compact Disc Rewritable.


    central processing unit (CPU) The main processor chip inside a computer or other
    electronic device. A processor is an integrated circuit containing millions of
    transistors.


    Centronics A type of connector used to attach a legacy parallel printer cable
    to the printer. It uses a plastic bar wrapped with metal tabs.


    charge-coupled device (CCD) An array of photos cells that convert light into electrical
    charge. Used in a scanner to digitize an image.


    CHS cylinders, heads, and sectors.


    clean install An installation of an OS or application that involves removing the
    previous version first. Compare to upgrade install.


    clean uninstallation An installation that removes any leftover helper or data
    files that were created by the uninstalled application.


    client A PC that an end user employs to accomplish tasks. Compare to server.


    client-server network A network that consists of one or more servers as well as
    one or more clients.'
