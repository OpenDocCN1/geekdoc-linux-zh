  md: '# Broadband Router


    Nearly all of the various broadband Internet technologies can be shared on a LAN
    by using a broadband router. A broadband router is basically a regular consumer-level
    router, but it may come with software, instructions, or extras extras that make
    it easily for an average person to set up a broadband Internet connection.


    To share an Internet connection, connect an Ethernet cable from the Internet source
    (for example, the modem) to the Internet or input jack on the back of the router.
    Then connect all the computers in your network to the router, either with Ethernet
    cables or wirelessly (if it''s a wireless router). The router handles the network
    address translation (NAT) required for each of the computers to use single Internet
    connection.


    # DNS Servers


    Earlier in the chapter, you learned that IP addresses are 32-bit binary numbers
    expressed as sets of four decimal numbers like: 208.215.179.220. All Internet
    servers must have an IP address in order to be able to communicate. For purposes,
    domain names like Microsoft are used instead of numbers, because they''re easier
    to remember.


    Domain Name System (DNS) servers translate to the numeric addresses and the friendlier
    domain names. These servers store and provide access to translation tables based
    on information they get from domain registrar companies.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_170_0.png)


    > There is a misconception that all web addresses must start with www. This is
    only customary, not required. Large sites, such as Microsoft, divide the websites
    into multiple servers, and ensure each has a different prefix, like support.microsoft.com
    and office.microsoft.com.


    DNS works from right to left, with each address separated by periods. To look
    up the IP address for a web address (a uniform resource locator, or URL) is known
    as resolving the address.


    An organization called InterNIC controls the issuing of Internet addresses. It
    manages a group of registrars, who manage a range of domains and ensure that DNS
    lookup information is available for them worldwide.


    For example, resolve www.university.ac.uk, the browser first consults a top-level
    DNS server, which contains information about how other DNS servers are stored
    for the various top-level codes. This first DNS server, owned by InterNIC itself,
    directs the request to a DNS server, managed by Nominet, which handles only domain
    names that end in .uk. That server, in turn, sends the request to another DNS
    server, managed by JANET (Joint Academic Network), which manages .ac and .gov
    addresses. Finally, the request is sent to the university''s DNS server, which
    manages its own domain and any subordinate domains.'
