    to start with your Pictures folder. You can also place folder shortcuts on the
    desktop or Start menu to open to a folder of your choice. After opening the file-management
    interface, you can navigate to other folders as desired.


    A command-line OS like Unix uses text commands for file management. Windows, Mac
    OS, and Linux all have optional command-line interfaces that allow you to manage
    files via text commands.


    Table 5.2 summarizes the methods of opening a file-management interface in Windows,
    Mac OS, and Linux. In Unix, it''s not an issue because the command line is the
