  md: '# Answers to Review Questions


    +   1. A processor may accomplish all other tasks indirectly, with the help of
    software, but its core function is to do math. Numbers come in, are processed,
    and are outputted. What the software chooses to do with them is not the processor''s
    concern.


    +   2. A reduced instruction setting computing (RISC) is a simple processor that
    has a small instruction set and can operate efficiently using that small set.
    RIS processors are often used in hand-held devices like cell phones.


    +   3. A binary number consists of only 1 and 0 digits. Processors and memory
    use binary numbering to store data in a series of on/off transitions


    +   4. Intel and AMD are the two major manufacturers of PC processors.


    +   5. Land grid array (LGA) is the most popular socket for today''s processors.
    PGA is a previous-generation socket that used pins on a processor that fit into
    holes on the socket. DIMM and SODIMM are types of RAM, not processors.


    +   6. The speed of a processor is measured in gigahertz. Core speed is not the
    same as the amount of data the processor can process per second; though, that
    measured in MIPS. Gigabytes are a measurement of disk storage space or memory
    capacity. Gigabits per second is measurement of data throughput, such as on a
    network.


    +   7. The motherboard''s bus, or front-side bus, moves the data to/from the CPU
    at a rate set by the system timer on the motherboard. The memory, processor, and
    hard disk all have a maximum speed at which they can reliably operate, but speeds
    do not determine the actual rate at which the system operates


    +   8. The L1 cache is built into the processor, so die it is the closest of all
    caches. The L2 cache is on the processor but not on the die. An L3 cache, if present,
    is on the chip but not on the die.


    +   9. Multicore processors are either dual-core or quad-core; some have six or
    eight cores. A processor with one core would not be considered multicore. There
    are currently no processors that have 32 or 256 cores.


    +   10. A cell microprocessor is a hybrid with a multiple-core processor and a
    specialized system, well-equipped for imaging and gaming applications. Sony uses
    a cell microprocessor for its PlayStation 3 gaming system, with cells running
    the code.


    +   11. A passive cooling system has no moving parts and no power to run. The
    only one of the options listed fits this criteria is a heat sink


    +   12. BIOS deals for Basic Input/Output System. The BIOS chip on the motherboard
    contains the essential information needed to start the computer and load the operating
    system memory.


    +   13. Static RAM (SRAM) is, by definition, volatile; it is used for flash drives,
    for example. Dynamic RAM is the volatile type, used for the main memory in most
    computer systems. Read-only memory (ROM) is not only volatile, but also not rewritable
    without a special tool. The central processing unit (CPU) is not a type of memory.'
