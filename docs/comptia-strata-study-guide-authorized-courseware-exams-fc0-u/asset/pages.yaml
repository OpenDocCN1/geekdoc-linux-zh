  md: '# TABLE 3.1 Color coding for sound output plugs


    | Color | Role |

    |---|---|

    | Lime green | Main audio output for speakers or headphones |

    | Dark brown | Audio output for special panning, right to left speaker |

    | Black | Surround-sound speakers |

    | Orange | Center speaker and subwoofer |


    Speakers differ from one another in the following ways:


    **Amplification** Most speakers provide some sort of *amplification*, which makes
    the sound louder as it comes out of the PC. Without amplification, the sound generated
    by the PC may not be loud enough to listen comfortably. Amplification requires
    electrical or battery, so any speakers that do not have either of power are non-amplified.
    Amplification is measured in watts. If there is a subwoofer, it will have its
    own watts (more is better), well as each of the satellite speakers. An average
    wattage for a subwoofer is around 18, and for each satellite it may be around
    6.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_140_0.png)


    > There are three ways of describing a speaker''s maximum wattage. Make sure when
    you''re comparing models that you''re getting an apples-apples comparison. *Root
    mean square (RMS)* is the standard measurement of the wattage a speaker can reliably
    handle in a sustained manner. RMS maximum is the wattage the speaker can handle
    in short bursts. *Peak power (PMPO)* is the absolute maximum the speaker can handle
    for a split second, just before it fails from wattage overload.


    **Shielding** Speakers designed to be used or near computers that have shielding
    so the magnets in the speakers do not interfere with any of the computer''s components.
    In contrast, speakers designed for home stereo systems usually don''t have shielding.


    **Frequency Range** Speakers with a very wide frequency range will produce sounds
    much more accurately. Look for a frequency range of at least 50 to 10,000 Hz.


    **Analog vs. Digital** Most speakers are analog. The speaker connector on a sound
    card sends analog data to the speaker. However, digital speakers are also available,
    and hardcore audiophiles claim that they''re better—less background noise and
    hiss at higher volumes. To use digital speakers, you have to have a digital out
    port on the sound card.'
