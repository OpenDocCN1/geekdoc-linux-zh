  md: '# 340  Chapter 9 • Security Access Control


    There are security risks associated with connecting to any network, especially
    a free public network. Although most of your fellow users share that network just
    want to use the Internet, as you do, hackers occasionally lurk about who may try
    to browse or even steal from your computer via your shared network connection.


    To minimize the risk associated with connecting to a security network, you can
    change your file-sharing settings to more restrictive ones while you''re connected
    to that network. In Windows, when you connect to a new network, you''re prompted
    to select whether it''s a Home, Work, or Public network. If you choose Public,
    file- and printer-sharing features are disabled on that network. This makes it
