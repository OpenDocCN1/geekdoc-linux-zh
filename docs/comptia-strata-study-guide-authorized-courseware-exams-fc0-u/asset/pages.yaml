  md: '# FIGURE 9.2 Choosing folders to share in Mac OS X


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_385_0.png)


    Next, configure the user and group accounts with appropriate access privileges:


    +   1. In Sharing Preferences, select the folder that''s shared.

    2. To add to the default user accounts and groups that were selected when you
    shared the folder, click the + (plus) icon below the Users field.

    3. In the sheet that appears, select an existing user account or group. (User
    accounts are created in Accounts, System Preferences.)

    4. The default privilege for a user account or group you add is Read Only. If
    you want to change it, choose one of the privilege options from the Read Only
    pop-up menu:


    **Read & Write** The user can read, copy, edit, and delete the contents of the
    folder.


    **Read Only** The user can only read and copy (to another location) the contents
    of the folder.


    **Write Only (Drop Box)** The user can only copy content into the folder. The
    user can''t see the contents of the folder.


    **No Access (Groups Only)** User accounts in the assigned group have no access
    to the folder. If their user account is added, the privilege assigned to the user
    account will override the group restrictions.


    +   5. Repeat the process for each folder being shared.

    You can also select a folder directly in the Finder to share. Select the folder,
    choose File ▷ Get Info, and select the Shared Folder check box (see Figure 9.3).
    You can also manage user or group access to the shared folder via Finder; select
    the folder, choose File ▷ Get Info, and then choose Sharing & Permissions.'
