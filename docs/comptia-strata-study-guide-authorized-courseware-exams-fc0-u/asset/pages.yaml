  md: '# Evaluating a Computer for Upgrades


    PS/2-to-USB adapters (and also the reverse) to swap keyboards and mice between
    those two interfaces.


    +   Newer Mac computers, including the MacBook Pro and iMac, have a new type of
    high-performance multiselect connector called Thunderbolt. It can be used for
