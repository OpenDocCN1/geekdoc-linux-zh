  md: '# # About the Authors


    Andrew Smith works both as an academic for the UK Open University and a national
    senior examiner for a popular BTEC vocational information technology qualification.
    Having contributed to many texts on systems maintenance and networking, Andrew
    has both industrial and teaching experience on hardware and networking that spans
    more than 20 years.


    Faithe Wenpen a 20-year veteran of the computer book publishing industry, is the
    author of over 120 books about computer hardware and software. Top-selling titles
    include Office 2010 for Seniors for Dummies, A+ Certification Workbook for Dummies,
    and the Microsoft Office PowerPoint 2010 Official Academic Course. In addition
    to her book-length works, Faithe has written over 50 online courses on Powered.com,
    which has educated over a quarter of a million online students on such as PC repair,
    Office applications, and Windows optimization. She has also written technical
    articles for TechRepublic and CertCities, and her articles on Office have appeared
    in Microsoft OfficePro and Microsoft Office Power User manuals. Faithe is an adjunct
    instructor of Computer Information Technology at Indiana University/Purdue University
    in Indianapolis, where she has taught Microsoft Office applications, Information
    Technology Fundamentals, and Computer Hardware and Software Architectures. She
    has also done extensive in-house custom software training for small businesses.


    # # About the Contributor


    Rehan Bhana has 15 years'' experience in information technology. Over the last
    decade, he has worked at a number of educational institutions across Europe. He
    directs several continuing professional development programs.


    His passion for teaching and learning has been instrumental to the many students
    who have gone onto careers in computing after taking his courses. He is the academic
    lead for CompTIA, Microsoft, and Apple programs at his University in Birmingham,
    U.K., and has a number of associated certifications. He holds a degree in systems
    engineering as well as educational qualifications including Microsoft Certified
    Trainer. He brings with him a wide range of curriculum design skills and realistic
    interactivity experience from the classroom.


    Born in the warm heart of Africa, of Asian origins, and now living in a cosmopolitan
    society, Rehan is used to learning about different cultures and traditions. Beyond
    this, he is likely to be engrossed in quality time with his lovely wife and their
    two adorable children.'
