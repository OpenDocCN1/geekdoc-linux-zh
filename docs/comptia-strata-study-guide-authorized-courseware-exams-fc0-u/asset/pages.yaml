- img_proc: true
  md: 'vertical resolution An image’s or display’s resolution from top to bottom.


    VGA See Video Graphics Adapter.


    Video Graphics Adapter (VGA) An analog style of monitor connector that uses a
    15-in D-sub connection.


    virtual machine A simulated processing environment designed to run an application
    or in a closed-bubble, separate from the rest of the computer’s operation.


    virtual memory A portion of the hard disk that functions as a holding area for
    swapping data into out of RAM.


    virtual private network (VPN) A secure tunnel that runs between points on the
    Internet, creating a secure communication channel using public Internet routes.


    virus Malware that attaches itself to an executable file and modifies what happens
    when the file runs.


    virus definition See virus signature.


    virus signature A snippet of code used to identify a virus.


    Voice over Internet Protocol (VoIP) A set of applications, technologies, and protocols
    used to provide IP-based telephony services.


    VoIP See over Internet Protocol.


    volatile memory See dynamic RAM.


    volume boot record A file created via high-level formatting that stores information
    needed to boot from the drive.


    VPN See virtual private network.


    vulnerability A flaw in the programming of an application that creates the potential
    for misuse; plus a tool or technique that allows an attacker to exploit that vulnerability.


    # W


    WAN See wide area network.


    WAP See wireless access point.


    weak password A password that is easy to guess.


    webcam A low-resolution video camera that feeds its images directly into a computer
    or network.'
