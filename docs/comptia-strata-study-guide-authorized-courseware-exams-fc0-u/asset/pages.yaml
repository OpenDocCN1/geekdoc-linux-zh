  md: '# A


    **access control** The technologies used to control who or what has access to
    a computer system or network.


    **access time** The amount of time that lapses between a PC''s request for data
    from the CD and the drive''s delivery of the first part of that data.


    **active cooling system** A cooling system that has moving parts, such as a fan.


    **Active Directory** A user- and identity-management system in Windows servers
    that control users login.


    **ActiveX** A Microsoft technology that uses the Microsoft .NET programming framework.
    It enables a web browser to interact with the OS to run mini-applications.


    **ActiveX controls** An ActiveX program that runs a mini-application.


    **add-on** A browser extension that adds to your browser the capability of handling
    new content types. Also called a _plug-in.


    **ADSL** See asymmetric DSL.


    **adware** A category of application that displays unasked-for ads on your computer.


    **allocation units** See clusters.


    **amplification** A means of making the sound louder as it comes out of a PC or
    other device.


    **antispam** Software that detects and removes or segregates spam email.


    **antispyware** Software that detects and removes spyware.


    **antistatic mat** A mat on which you set a component to drain away any built-up
    static charge that might result in ESD damage.


    **antistatic wrist strap** A wrist strap that keeps you connected to a component,
    constantly equalizing the voltage potential between you and the component so ESD
    isn''t a problem.


    **antivirus software** Software that helps protect your system against malware
    such as viruses, worms, and Trojan horses.


    **APIPA** See automatic private IP addressing.


    **asymmetric DSL (ADSL)** DSL service in which the upload speed is slower than
    the download speed.'
