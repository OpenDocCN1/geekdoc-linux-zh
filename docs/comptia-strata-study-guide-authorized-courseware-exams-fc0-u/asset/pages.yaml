    # # Controlling Cookies


    A cookie is a text file that a web page (or an ad on a web page) stores on your
    hard disk for tracking purposes. A cookie can tell an advertiser that you previously
    viewed a certain ad, for example, or keep track of the items in your shopping
    cart on an e-commerce site. Cookies are harmless 99.99% of the time, and they
    may perform useful functions that you want. However, there are two risks involved
    with cookies. One is a privacy threat: a cookie can deliver personally identifiable
    information to a website. The'
  merge: -1
