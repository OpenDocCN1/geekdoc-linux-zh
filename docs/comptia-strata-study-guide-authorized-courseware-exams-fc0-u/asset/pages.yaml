- img_proc: true
  md: 'Small networks, as those found in a home, are often set up as peer-to-peer
    (P2P) networks (see Figure 3.10). The HomeGroup networking feature in Windows
    7 sets up P2P networks, for example. In a P2P network, there is no server; each
    of the client PCs takes a portion of the burden of maintaining the network. Instead
    of a server managing the traffic, all the PCs in the network listen for traffic
    and grab any messages that are addressed to them. Instead of a server storing
    shared files, the shared files remain on the individual client hard disks. Another
    name for a P2P network is a workgroup.


    # **FIGURE 3.10** A peer-to-peer network operates without a server.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_149_0.png)


    Large networks often have many servers, each with specific functions. For example,
    one might be a file server, one might be a print server, and one might provide
    Internet services. In large organizations, a server may be a much more powerful
    computer than an ordinary desktop PC, and may include many processors and a large
    amount of RAM.


    Having a server doesn''t preclude individual client PCs from sharing their available
    resources with other clients. For example, you might have a central file server,
    but users could also share folders on their hard disks.


