    # ExpressCard and CardBus/PC Card


    Some notebook computers have a multipurpose slot for add-adapters that are approximately
    the height and width of a credit card (only thicker). Adapters that fit into of
    these slots can add any of a wide range of capabilities to the system, including
    Ethernet, storage, add-graphics cards, wireless networking, and TV tuners. The
    original type of slots was PCMCIA, named for the association that created it (Personal
    Computer Memory Card International Association). This association lives on, and
    continues to maintain the current standard. Updated versions have been released
    over the years that come in different sizes and shapes, hook into different buses
    inside the computer and transfer data at different rates.


    ExpressCard is the standard, which was first introduced around 205. It fits into
    a 34 mm slot with a 26-pin connector. There are two types: ExpressCard34 and ExpressCard@34.
    The latter is L-shaped so the connector portion is the same as ExpressCard|34.
    It can use either the PCI Express or the USB bus inside the computer. ExpressCard
    devices have a throughput of up to 2.5 Gbps via the PCI Express or 480 Mbps through
    the USB 2.0 bus.


    > PCI for peripheral component interconnect. It is a faster bus on the motherboard
    that carries data between expansion cards and the system bus. The original version
    was just PCI, but updated versions called PCI-Extended (PCI-X) and PCI Express
    (PCIe) have been released that are even faster. Make sure you know those acronyms
    for the Strata exam. PCI-X is a double-wide version of PCI, used primarily in
    servers of the early 2000s. PCIe is the current standard, and it''s faster, smaller,
    and more efficient than its predecessors.'
