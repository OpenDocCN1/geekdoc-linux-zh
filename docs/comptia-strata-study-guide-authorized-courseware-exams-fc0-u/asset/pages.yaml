  md: 'As times goes by, you may find that your computer''s hardware isn''t adequate
    for the jobs you want it to do. Depending on the type and age of the system, you
    may be able to upgrade one or more components to bring the computer up to the
    level you need, so you don''t have to replace the computer completely. In this
    chapter, you''ll learn how to evaluate a system for possible upgrades, how to
    select a compatible upgrade component, and how to install the component safely.


    # Evaluating a Computer for Upgrades


    The first step in upgrading is to understand what you already have:


    +   * What components are fine as is?

    * Which components are obsolete, failing, or weaker in capability the rest?

    * What components may benefit from a new driver?

    * What components can''t be replaced at all?


    Answering these questions before you get out your wallet at the computer store
    can save you a lot of time and money.


    # Updating Device Drivers


    Sometimes you can improve your device''s performance, add new features to it,
    and/or fix problems with by applying a free driver from the manufacturer. If you''re
    thinking of replacing a device because it''s not working well for some reason,
    try updating its driver and if that doesn''t straighten out.


    To check a device''s driver, use the operating system to find the driver''s current
    version and date. (The exact depends on the OS; in Windows, you can use Device
    Manager as shown in Exercise 7-1.) Then visit the device manufacturer''s website
    and search for the latest driver for your OS. If you find one newer than the one
    you have, install it. Some devices also have their BIOS, which can be updated
    via downloadable executable file.


    ```

    EXERCISE 7.1

