    upgrade install An installation of a new OS version that involves installing over
    the old version so that settings and applications are retained. Compare to clean
    install.


    upgrade path A means of getting from one OS version or edition to another. Depending
    on the versions, you may be able to do an update install, or you may need a clean
    install.


    UPS See uninterruptible power supply.


    URL See uniform resource locator.


    UTP See unshielded twisted pair.


    # V


    varistor A variable resistor inside a surge suppressor, capable of absorbing any
    excess power during a surge or spike.


    version A major release of a program or OS. For example, Windows 7 is a version
    of Windows. Compare to edition.


    vertical dpi The dots per inch that a scanner can record vertically on a page.
    Also called vertical resolution or y-direction sampling rate.'
