  md: '# Internet Connections


    protocols operate at Session layer (level 5) of the OSI model that was mentioned
    earlier in the chapter.


    The basic unsecured protocol for web traffic is Hypertext Transport Protocol (HTTP).
    Addresses that begin with http// produce results sent to your computer in an unsecured,
    unencrypted way that is easy to spy on with packet-sniffing software. Packet-sniffing
    software allows even non-technical users to view data that is being sent online.


    Hypertext Transfer Security Protocol (HTTPS) is a version of Hypertext Transport
    Protocol (HTTP) that combines regular HTTP with Transport Layer Security (TLS)
    or Secure Sockets Layer (SSL) security encryption to exchange data between a browser
    and a server privately. HTTPS connections are typically used when valuable information
    is involved, such as credit card numbers. Addresses that begin with https// are
    secure addresses.


    There are two parts to HTTPS: ensuring that the website is what it seems, and
    ensuring that data isn''t snooped on its way there.


    For the first part, ensuring the identity of the website, HTTPS relies on certificate
    authorities: companies that issue and manage digital certificates for a fee. A
    certificate authority as VeriSign or Microsoft issues a certificate to a website,
    and then the web browser receiving information about it checks with the certificate
    authority to make sure the certificate is valid.


    For the second part, ensuring the data isn''t snooped, TLS or SSL is used to encrypt
    the data being sent and then decrypt it at the receiving end. TLS and SSL are
    two different versions of the same basic technology, with TLS being the newer
    version. You don''t need to know the technical details of how it works for the
    Strata exam.


    > Companies that need web-based communications to be secure at all times create
    a virtual private network (VPN). A VPN is a secure tunnel that runs from one point
    to another across the Internet. It uses the public Internet routes, but the transactions
    are shielded from snooping because they''re in an encrypted secure pathway.


