    # Anti-Phishing Features


    One technique that criminals use to steal people''s personal information is to
    create a phishing site, which looks like a legitimate site where people commonly
    enter financial and personal information. People unwittingly enter their usernames
    and passwords into the fake site, and then the criminals take that information
    and use it to log into the real site and identities or money.


    Most web browsers have an anti-phishing feature that references a central database
    of known phishing sites and warns you if you display a page that is known to be
    fraudulent.


    # Internet Street-Smarts


    Everyone would like to think that they aren''t susceptible to fraud. Sometimes
    the best frauds seem so realistic that may easily fall for them. Here are some
    common lures:


    +   - An email purporting to be from trusted service such as your bank

    - A pop-up advertisement that appears to be from your favorite online retailer

    - An address that is very similar to the one you visit often, that you don''t
    notice it''s slightly misspelled when you click the link


    # ActiveX and Java


    ActiveX is a Microsoft technology that uses the Microsoft .NET programming framework.
    It enables a web browser to interact with the underlying operating system in order
    to run mini-applications called ActiveX controls that do more sophisticated things
    than a plain web page can do.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Internet Connections


    There are two parts to ActiveX: the browser plug-in, which is like a player for
    the ActiveX content, and the individual ActiveX controls that you encounter as
    you visit websites. For example, an control may run an interactive game within
    a web page, or it may collect information from your system for diagnostic purposes.


    ActiveX is a powerful technology, but it can be dangerous in the hands of criminals.
    Therefore, when your browser prompts you to download an ActiveX control in order
    to display a page''s content, you should be very suspicious and make sure you
    trust the website. Some browsers don''t support ActiveX controls at all because
    of the potential security risks.


    Java is a programming language that works across multiple platforms (that is,
    multiple operating systems and types of computer hardware). Many web browsers
    use Java to write mini-applications for the Web as an alternative to using ActiveX.
    JavaScript is a variant of Java for inserting code (scripts) on pages.


    From a security standpoint, using Java for web applications is considered safer
    than ActiveX it interacts with the underlying operating system. Instead, Java
    is part of an environment that contains all the interactions within a closed bubble,
    sometimes called a *virtual machine*, which exists only as long as the page is
    displayed.


    # Cookies


    In its raw form, HTTP is a stateless protocol. That means every exchange between
    your server and your browser is a clean slate, with no memory of previous exchanges.
    Each time you visit a website, it''s like you were never there before.


    Have you ever noticed, when you revisit some shopping sites, the pages come back
    by name, and even make product suggestions based on your previous purchases? This
    is possible because the site stores data about you and your previous activities
    in a plain-text file in a hidden area of your hard drive. This file is called
    a *cookie*.


    Cookies can originate from the main site you are visiting (a first-party cookie)
    or from one of the companies that have an ad on the page (a third-party cookie).
    Most web browsers have settings for controlling and deleting first-party and third-party
    cookies.


    Cookies can be temporary (session cookies) or permanent (persistent cookies).
    A session cookie keeps track of your back-and-forth exchange with a website for
    as long as pages remain. If you close the browser, though, cookie is deleted.
    A persistent cookie remains on your hard disk until you delete it. For example,
    one website may use a session cookie for a shopping cart, that if you leave the
    website without making a purchase, the next time you return your shopping cart
    is empty. Other sites may use persistent cookies for a shopping cart, so the items
    you placed in the shopping cart are still there.


    Like many other “innocent” technologies on the Internet, cookies have been exploited
    by aggressive advertisers. You can easily delete any (or all) of the cookies stored
    on your system, or you can ensure they expire after a time limit or when the browser
    is closed.


    # Cached Web Data


    A browser cache retains a copy of the files required to display the web pages
    you visit. When you revisit a page, your browser may be able to reload certain
    files, such as the'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'page’s graphics, from the stored cache rather than re-retrieving them from
    the Web. This makes your Internet connection seem faster.


    Some people consider this data caching to be a privacy concern, because others
    can sniff on the hard drive for cached copies of some of the web content previously
    viewed. Of this, browsers have a feature that allows you to clear the cache and
    elect not to cache in the future.


    A browser’s history also provides a record of the pages recently viewed, but for
    a different reason. The history is useful if you need to find and return to a
    site when you’ve forgotten its address, for example. The history does not retain
    copies of any of the content—only the addresses of the pages visited. The history
    can also be cleared, and you can elect to prevent it from storing information
    in the future.


