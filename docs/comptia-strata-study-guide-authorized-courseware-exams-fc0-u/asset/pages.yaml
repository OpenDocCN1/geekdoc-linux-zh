- img_proc: true
  md: 'In addition to a drive bay for an additional drive, you''ll also need an available
    power plug for it. Parallel ATA (PATA) drives use a standard 4-pin Molex connector
    like the one shown in Figure 7.2. Most Serial ATA (SATA) drives use a special
    power connector designed specifically for them, like the one shown in Figure 7.3.
    (Some use traditional Molex connector, so that''s another shopping factor to consider.)
    Make sure you have an available power connector inside the PC for the drive type
    you want.


    # FIGURE 7.2 Molex power connector for a PATA drive


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_326_0.png)


    # FIGURE 7.3 SATA power connector for a SATA drive


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_326_1.png)


    You''ll also need to connect the drive to the motherboard. If you''re replacing
    an existing drive, you can use the same connector the old one used. However, if
    you''re adding a new hard drive, you''ll need an available PATA or SATA connector.


    If you''re adding a PATA drive, your system probably has two PATA connectors on
    the motherboard (see Figure 7,4), and each one can support a cable that has up
    to two drives on it. Therefore, you''ll need to count the number of PATA devices
    you already have and make sure it''s fewer than four. Otherwise, you''ll need
    to remove one of the existing drives, install an expansion card that supports
    more PATA drives, or choose a SATA drive instead.'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# Chapter 7 • Updating and Upgrading Hardware


    # FIGURE 7.4 Parallel ATA motherboard connectors


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_327_0.png)


    Photo credit: Wikimedia Commons


    If you''re adding a SATA device, look for an available SATA connector on the motherboard
    (see Figure 7.5). With SATA, each drive has its own separate cable and connection
    to the motherboard. On some motherboards, there may be different speeds of SATA
    connectors, such as SATA 6.0 Gb/s and SATA 3.0 Gb/s. If so, they will be colored
    differently so you can easily tell apart. Assign the fastest interface to the
    primary hard drive, or to the drive that is new and fast enough to benefit from
    its higher speed.


    # FIGURE 7.5 Serial ATA motherboard connectors


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_327_1.png)


    Copyright 2011, Bestofmedia, LLC


    Regardless of the hard-drive interface you choose, you''ll have choices to make
    in these other areas:


    +   - **Capacity** How much data does the drive hold? More is better but also
    more expensive.


    +   - **Rotational Speed** This applies to mechanical hard disks only, not solid
    state.'
