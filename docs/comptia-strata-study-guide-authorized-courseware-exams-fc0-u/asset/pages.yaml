    The Internet has grown so large, as a global community are running out of available
    IP addresses. There are various translation systems in place that enable large
    groups of computers to share one or two IP addresses on the Internet, even if
    these means aren''t enough. Therefore Internet Protocol version 6 (IPv6) was invented,
    and it will at some point be implemented as the new method of identifying computers
    on the Internet. IPv6 numbers are 128-bit binary numbers but are written in hexadecimal
