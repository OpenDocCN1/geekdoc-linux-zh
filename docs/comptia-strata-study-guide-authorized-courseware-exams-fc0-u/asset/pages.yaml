    condensation into the PC, and not spraying liquid cleaning products directly onto
    the PC, especially anywhere near its air vents.


    A computer damaged by flooding or submersion in water may be beyond repair, but
    to maximize the chances of recovering some of the data, you should disassemble
    the computer and dry the pieces thoroughly, and then reassemble it before attempting
    to turn it on. Any water left in crevices can cause a short-circuit, whatever
