- img_proc: true
  md: '# Access Control


    Access control describes the technologies used to control who or what has access
    to your system(s). Access control can take many forms, from the key to the door
    on the room that houses your computer system to the username and password with
    which you log in, and the permissions you receive as a result of that login. Examples
    of access control measures include passwords, fingerprint readers, and smart cards.


    # User IDs and Passwords


    User IDs and passwords are the bedrock of most computer access-control systems.
    You use an ID and password combination to log into everything from the OS to your
    bank''s website. User IDs and passwords identify you when you log onto the local
    area network at your workplace, as you wireless hotspots, and about everywhere
    that you have been authorized to participate.


    Access control at an OS level is usually local to that PC (that is, the database
    of authorized users and passwords stored locally). No matter where that PC goes,
    or what networks it is connected to, the authorized users remain the same. The
    security risk in such a system is that someone could hack the file where the passwords
    are stored and gain access to the PC.


    An alternative, some companies that have client/server networks choose to manage
    user login via an independent directory service stored on a separate server. For
    Windows servers, this service is called Active Directory. When logins are managed
    on the network, users can potentially sit down at any PC anywhere in the building
    and log in with their own credentials. The Active directory service retrieves
    the user''s preferences, data folders, and settings and makes them available.


    # Creating Effective Passwords


    A strong password is one that is difficult to guess. Strong passwords have these
    characteristics:


    +   - Long The longer, the better. At least eight characters is optimal.

    - Varied The password contains at least one capital letter and at least one number
    and/ symbol.

    - Unusual The password doesn''t appear in a dictionary and isn''t a proper noun.


    Passwords that are easy to guess are considered weak passwords. Some of the worst
    passwords are all things that are like we, 1234, the user ID, and the word password.
    Only slightly better are the names of people, pets, and places.


    Even though a password should be difficult for others to guess, it''s OK to make
    it easy for you to remember. To do this, combining numbers and letters that make
    sense to you'
  merge: -1
  pgno: 380
- img_proc: true
  md: 'won''t make sense to other people. For example, suppose you have a cousin Albert
    who grew up in Indianapolis, and you used to call him a, so you remember that
    his phone number was 555-1192. An effective password might be Albert-Indy#1192.
    Notice that this password is long (15 characters), varied (uppercase, lowercase,
    numeric, and symbol characters), and unusual, yet it is fairly easy for you to
    remember just by thinking about your cousin.


    Here are some other techniques for creating passwords that are easy to remember
    but difficult to guess:


    Substitute for the letters O in words For example, 5tOrAgeR00m.


    Substitute numbers for letters To make it easier to remember, use the numeral
    that represents the letter of the alphabet (for example, b=2) or use the numeral
    that represents the position in the word (for example, take the word teacher and
    substitute numbers for the second and fourth digits, like: t2acher.


    Combine two or more unrelated words For example, GroceryCandlehtray.


    Substitute a symbol for a letter that it resembles For example, $ looks like an
    S, as in SubstitutionSalary; and ! looks like a capital I, as in t1ized.


    As tempting as it may be to use the same password for multiple systems or sites,
    you''re safer using a different password for every site. That way, if one site
    is hacked, it won''t affect your security on another site.


    If you can''t remember all the passwords in your head, one possible solution is
    to store them in a password-protected file on your hard disk. Someone could steal
    that file from your hard disk and even unencrypt it, but the chances of that happening
    are slim to the chances of a server being hacked where your password for a certain
    site is stored.


    Another possible solution is to reuse the same password for sites that don''t
    store any financial information. For example, you might use the same password
    for logging into message boards and chats at various sites, because if your password
    is discovered at those sites the consequences are generally mild. Someone might
    log in and impersonate you, causing you some temporary embarrassment, but you''ve
    lost any money. On the other hand, you should use a different password for each
    of your important banking or stock-trading accounts, because a thief could cause
    you significant financial problems on these sites.


    # Password Changes


    Some companies'' IT policies require that you change your password at regular
    intervals, such as every 90 days. The rationale is that the longer you keep a
    password, the more likely that someone has surreptitiously seen you type it, or
    you''ve written it down somewhere, or some other security breach has occurred.'
  merge: -1
  pgno: 381
- img_proc: true
  md: '# Access Control


    Even a system doesn''t require you to change your password on a certain timetable,
    you may want to take the initiative to change it yourself, especially on sites
    where you manage your financial affairs.

    To help remember your password in a frequently environment, you may want to develop
    a structured system of changes. For example, suppose your password is video$05Furrier.
    When you change it, you might add the two-digit number of the month in which you
    changed it. For example, if you change it in February, you can make it video$05Furrier.
    Then, when you change it in May, you can change it to video$05Furrier.


    # One-Time Passwords


    Some systems issue temporary passwords to users. These passwords are either time-limited
    (for example, you must use it within 24 hours) or instance-limited (for example,
    you can choose to log in only once, at which point you''re forced to create a
    new password).

    Some systems have a time-based token which the user can press a button and get
    a randomly generated password. This token uses an algorithm (a mathematical method)
    recognized by the server and uses the current time as a part of the key, knowing
    that the service will be running the same time.

    A one-time password prevents theft of a key-logging system or from someone watching
    you type the password and remembering it. By the time someone has stolen, it''s
    already out. One-time passwords can also be used to help verify a user''s identity
    when resetting a forgotten password. For example, if you''re locked out of logging
    into your cell-phone provider''s website, the provider may send a temporary password
    to your phone, ensuring that you possess that phone before resetting the password
    for your website.


    # Smart Cards


    A smart card is a plastic card, similar in dimensions to a credit card, that contains
    a microchip that a card-reader can scan, as on a security system. Smart cards
    often double as badges, enabling employees to access employee-only areas of a
    building or use elevators to go to restricted areas, or as credit cards. Smart
    cards are also used in some countries, such as France, to store and transfer health
    insurance information.

    Smart cards can also be used to allow or prevent computer access. For example,
    a PC may have a card reader on which the employee has to swipe the card, and that
    reads the chip when it comes into its vicinity.

    Smart cards are sometimes used as a substitute for user IDs and passwords. In
    other applications, they''re combined with PIN numbers or as an add-on to a standard
    login system, giving an additional level of security verification. For someone
    to gain unauthorized access, they have to not only know a user''s ID and password
    (or PIN), but also steal their smart card. That makes it much more difficult to
    be a thief!'
  merge: -1
  pgno: 382
