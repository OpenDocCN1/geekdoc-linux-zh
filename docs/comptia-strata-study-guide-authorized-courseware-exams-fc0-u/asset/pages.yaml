    ```

    4FFE:190C:4545:0003:0020:FFBF:FE21:67CF

    ```


    With such a number, the number of available addresses is virtually limitless.
    (Well, not completely limited. But to the 36th power is a lot of addresses, and
    we''ll probably never use up on planet Earth, even every person has dozens of
    addresses.)


    # Static vs. Dynamic IP Addressing


    When you set up a network connection on a PC, there are two ways to handle IP
    addressing. One is to configure a static IP address on the device. Such an address
    is assigned by the network administrator or your service provider. Network administrators
    at large companies spend a lot of time and developing complex systems of IP addressing,
    so you should never give an IP address—always ask.


    The other way is to allow a Dynamic Host Configuration Protocol (DHCP) server
    to assign a dynamic IP address to a computer automatically. This is how large
    networks generally do it. They set up a server with DHCP, and every time a computer
    logs in, the computer asks server "What is my IP address?" The server assigns
    it immediately or reirms that it is still okay to use the one it used last time.
    This system is advantageous it eliminates the possibility of duplicate IP addresses
    on a network and saves the network administrator''s time.


    # Automatic Private IP Addressing


    Because a small peer-to-peer network doesn''t have a DHCP server, small networks
    need an alternative of assigning IP addresses to its computers. You can assign
    static IP addresses to computers if you like, but Windows networking is able to
    pass out IP addresses automatically without a DHCP server via a system called
    automatic private IP addressing (APIPA). Windows automatically assigns IP addresses
    within a certain range of reserved addresses whenever it can''t locate a DHCP
    server and no static address has been supplied. The addresses in this block begin
    with 169.254, as in'
