  md: '![](img/c5fa9b25d23e63f6ffb996940faeace5_222_0.png)


    Preventive maintenance is an important part of computer usage. This can include
    cleaning the computer, backing up files, and preventing damage from electrical
    surges and static electricity. This chapter covers all those skills and several
    other important maintenance tasks. Managing files and folders is also a daily
    or near-daily process. Part of keeping a computer''s contents orderly is moving,
    copying, renaming, and deleting files. In this chapter, you''ll learn all skills,
    as well as how to print files.


    # # Cleaning a Computer


    Computers that are cleaned are not only more pleasant to use, but also can last
    longer. Dirt, clumps of debris, and other accumulation can make components hotter,
    shortening their lives. In the following sections, you''ll learn about about the
    cleaning products available for cleaning a computer inside and out. You''ll also
    study some techniques for cleaning various areas without damaging them.


    # # Cleaning Supplies


    Expensive supplies aren''t required to clean a PC, but neither should you use
    whatever happens to be lying around. Here is a list of basic supplies to have
    on hand:


    +   - A spray cleaning product designed for plastics, preferably designed for
    computers. The ones designed for computers often have antistatic properties that
    regular cleaners lack.

    - A monitor cleaner, either spray or towel, designed specifically for cleaning
    monitors or other electronics screens (like televisions). Dont a glass-less product
    that contains ammonia because ammonia can destroy the antiglare coating on some
    monitors.

    - A can of compressed air for blowing out de crevices.

    - Cotton swabs.

    - Denatured isopropyl alcohol (not rubbing alcohol, which has too much water in
    it).

    - An antistatic spray designed for computer work areas.

    - (Optional) A small handheld vacuum cleaner for electronics because the filter
    isn''t fine enough and because a regular vacuum cleaner can generate static electricity
    that can harm equipment.)'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# Cleaning a Monitor


    Turn a monitor off before cleaning it. If any liquid gets inside, the monitor
    can air dry without worries of short-circuiting. It''s also much easier to see
    dirt and spots on the screen when it''s dark.


    First, clean the outer casing with a spray cleaner-cleaning solution. Spray the
    cleaner on the cloth, not directly on the casing, to avoid spraying into vent
    holes.


    Next, clean the glass using a cleaner designed specifically for monitors. This
    can be in the form of a spray or a towelette. Don''t use ordinary cleaning products
    on monitors because they leave streaks and sometimes harm the antiglare coating.
    Don''t use regular glass cleaner either, because it contains ammonia, which can
    also harm the surface. Don''t spray the screen because the liquid might drip down
    below the bezel; spray on a cloth and then wipe the screen.


    # Cleaning External Surfaces


    As monitors, the outside casing of PCs, printers, scanners, and similar equipment
    with a computer-cleaning spray product. Mild general-purpose spray cleaners also
    work. You can also use mild soapy water and a damp cloth (not soaking wet) to
    clean external surfaces—nothing internal or with a vent or crack that leads inside.


    # Cleaning a Keyboard


    Because it is always at the forefront of activity, the keyboard can get very dirty.
    Although technicians remind end users to keep their computing areas clean, more
    often than not people need to do so. They type with unwashed hands, or eat, drink,
    or even play with their pets while they work.


    To clean a keyboard, first turn off the PC. The keyboard need not to be unplugged
    from the PC. Then, turn the keyboard upside down and shake it to remove any loose
    debris, or hold it over a trashcan and spray beneath the keys with compressed
    air (see Figure 5.1). What falls out—and the amount of it—is often surprising!


    > FIGURE 5.1 Clean the debris out from under the keys with compressed air.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_223_0.png)


    Photo credit: CNET'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Cleaning a Computer


    Use a cloth dampened with a spray cleaning solution for PCs, or a tolette containing
    a PC cleaning product, to clean all visible surfaces. Get between the cracks with
    a cotton swab or a bit of folded paper towel. Removing the keys isn''t recommended
    because it can be difficult to get them back on. If you have access to a small
    handheld vacuum cleaner specifically designed for electronics it can be useful
    in sucking debris out under the keys.


    If liquid is spilled onto a keyboard, turn the keyboard upside down and unplug
    it from the PC (if possible), or turn off the PC. Turn the keyboard upside-down
    again to remove much of the liquid, and let it dry for at least 48 hours. If the
    liquid was plain water, the keyboard will be fine after it dries; just clean the
    outside as well as possible. If the liquid contained sugar, the keyboard may never
    be clean again. Some people have successfully cleaned sticky keyboards (the separate
    kind, not found on a notebook PC) in a dishwasher. To try this (this is little
    to lose with a keyboard that is otherwise on its way to the trash can), place
    the keyboard on the upper rack, wash it out using the heat-dry feature and with
    very little or no detergent, remove it after it has dried, rinse and set it in
    a drainer for several days to dry out.


    # Cleaning a Mouse


    A mouse, like a keyboard, gets very dirty because it''s constantly being handled.
    In addition, a mechanical mouse has added the extra feature of the ball on the
    bottom, which rolls across the desk picking up dirt and lint and moving it inside
    the mouse. As a result, the rollers and sensors on a mechanical mouse can become
    encrusted with dirt rather quickly, causing the mouse to malfunction. An optical
    mouse has fewer problems with dirt inside, but dust and hair can accumulate at
    the opening where the light shines through.


    When a mouse is dirty, the pointer on-screen may jump or stutter, or moving the
    mouse in one direction may result in no action at all. In addition, the mouse
    may become more difficult to control.


    To clean a mouse, first wipe off the outside with mild soapy water or cleaning
    product designed for computers. Turn the mouse on its back. Use a cotton swab
    dipped in denatured alcohol to clean out the hollow area where the light shines
    through if there is any debris inside.(Alcohol dries quickly, so it''s used instead
    of water anytime you clean any internal areas of electronics.)


    If it''s a mechanical mouse, rotate the plastic plate that holds the ball in place.
    Turn the mouse over again, and the ball and plate should fall into your hand.
    Clean inside the ball''s chamber with alcohol on a cotton swab. Clean the ball
    itself with mild soapy water, and dry it thoroughly (see Figure 5.2). (Don''t
    use alcohol on a rubber ball because it dries the rubber and makes it brittle.)'
