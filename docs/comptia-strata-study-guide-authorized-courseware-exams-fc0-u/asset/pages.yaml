  md: '# Using Software Tools for PC Maintenance


    Your OS includes many applications and utilities that help you manage and maintain
    your computer. You may find that you don''t need to download/install any additional
    applications, because the OS has everything you need.


    In the following sections, you''ll learn about several types of maintenance utilities
    that come with Windows, the most popular OS. In most cases, similar utilities
    are also available in Mac OS X, and Linux. Some of these tools are covered in
    greater detail in later chapters.


    # Tools for Managing Disks and Data Storage


    Having quick and reliable access to the data and applications stored on your hard
    disk is critical, as anyone who has run into a situation where they didn''t have
    this access can attest. Table 5.9 summarizes the tools available in Windows 7
    for working with disks. Earlier versions of Windows have similar (but not identical)
    tools. Mac OS X has a utility called Disk Utility that performs some of these
    functions.


    **TABLE 5.9** Disk- and data-management tools


    | Utility | Description | Accessed From |

    | --- | --- | --- |

    | Disk Defragmenter | Relocates the pieces of fragmented files to contiguous locations
    on the hard disk so that files can be retrieved more quickly when they''re needing,
    modestly improving performance. | Start > Computer, right-click a drive and choose
    Properties. In the Properties dialog box, click the Tools tab, and click Defragment
    Now |

    | Check Disk (chkdsk) | Identifies and fixes logical problems with the hard disk''s
    filesystem and optionally finds physical errors on the hard disk, relocating the
    data away from the damaged area if possible. | Start > Computer, right-click a
    drive and choose Properties. In the Properties dialog, click the Tools tab, and
    click Check Now |

    | Disk Management | Enables you to partition and format disk drives, as well as
    view the status of drives. | Start > Control Panel > System And Security > Administrative
    Tools > Computer Management, and then click Disk Management in the navigation
    panel at the left |

    | Backup | Saves backup sets that contain the important files you choose to back
    up, and restores them from the backup in the event they''re needed. | Start >
    Control Panel > System And Security > Backup And Restore |'
  merge: -1
  pgno: 257
