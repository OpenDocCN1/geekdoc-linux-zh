  md: 'High-Definition Multimedia Interface (HDMI) is an newer digital video interface.
    DVI and HDMI share some specifications, but HDMI doesn''t have the four analog
    pins for VGA compatibility (see Figure 3.5). HDMI also carries digital audio as
    well as video. HDMI is used often for television and home theatre components;
    it''s not commonly used on personal computers as of this writing.


