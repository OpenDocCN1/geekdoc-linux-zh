    Photo by Alexey Goral


    # Adjusting a Monitor


    When you change the monitor resolution (via the display driver properties in the
    Control Panel in Windows, for example), the onscreen image may shift in one direction
    or become slightly larger or smaller than it was. Most monitors have onscreen
    controls that can be used to adjust the image size, image position (known as phase
    when referring to left-right positioning), contrast, brightness, and other factors.
    Check the monitor''s manual to figure out how the controls work; they''re different
    for each model.


    Inexpensive or old CRTs may just have a couple of thumbwheels or knobs for monitor
    adjustment; newer and more sophisticated monitors will have a complete menu system
    of controls that pop up when you press a certain button. You then move through
    the menu system by pressing buttons on the monitor or moving a wheel or stick
    on the front or back of the monitor.


    > There may be a Degauss button. Press this button to discharge a built-up magnetic
    field within the monitor that may be causing the picture to be distorted. LCDs
    don''t have this problem, so they don''t have a Degauss feature. It''s named after
    Carl Friedrich Gauss, a researcher who studied magnetism.


    On a notebook PC''s built-in monitor, adjustment controls can be more basic. You''re
    likely to find certain keys on the keyboard with extra symbols in a contrasting
    color. Pressing these keys in combination with the Fn key activates that special
    function. For example, there may be a key with a picture of the sun with an arrow
    that increases the display brightness. Consult the notebook PC''s manual to learn
    the various meanings of the Fn function keys.'
