    # Unpacking a New Computer


    When you''re unpacking a new computer, open the box carefully. If you''re using
    a sharp knife to cut the tape holding the box closed, make sure you don''t cut
    too into the box and components.


    When you''re removing components from the box, do so with awareness of having
    to repack them if the computer turns out to be defective. If there are Styrofoam
    supports, make sure they don''t get broken. Save all the packing materials, including
    any plastic bags containing components, and save all the instructions and discs
    that come with the computer. Store the instructions and discs in a safe place,
    because you may need them tomorrow, next week, or next year.'
