    In the following sections, you''ll learn some basic terms and concepts related
    to home,

    business, and Internet networking.


    > Network throughput is measured in bits per second (bps), using the same multiplier
    words as bytes (as in Chapter 2: 1000 bits is a kilobit (Kbps), 1000 megabits
    is a megabit (Mbps), and 1000 megabits is a gigabit (Gbps).\ Note that, when measuring
    bits per second, the multiplier is an even thousand, not 1024 as it is with memory.
    When the b is lowercase, as in gigabytes (Gb), it means bits; when it''s uppercase,
    it means bytes, as in gigabytes (GB).


    # Clients and Servers


    There are two basic models for network operation: client/server and peer-to-peer.

    A server is a PC that exists only to route network traffic and provides access
    to shared files and printers. It manages the connections between the client PCs
    and serves as a storage repository for files that users want to make available
    to others. A client is an ordinary PC that an end-user employs. A server can be
    physically just that an ordinary PC, but it has a special server operating system
    installed (such as Windows Server) that enables it to provide network services.
    Client/server (see Figure 3.9) is the network model used for almost all business
    networks because the presence of the server takes the networking burden off the
    clients. The main drawback to a client/server network is that there must be a
    PC dedicated to functioning as a server, and not every company or home can spare
    the extra PC.


    FIGURE 3.9 A client/server network contains one or more servers that manage the
    network.


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_148_0.png)'
