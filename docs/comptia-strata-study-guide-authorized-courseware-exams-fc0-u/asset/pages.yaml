  md: 'If the recovery yourself doesn''t work, the next step is to use a professional
    data-recovery service. Such services can easily run into thousands of dollars
    because not only do they use professional-quality disk-recovery software, but
    they can also remove the platters from a physically damaged hard disk and put
    them in another mechanical drive unit.


    # Managing Files and Folders


    Working with files and folders in your OS of choice is an important basic skill
    to have, for Strat certification and for everyday use. In the following sections,
    you''ll learn (or review) how to create, delete, rename, move, and copy files
    and folders, and how to print them. Most of the examples focus on Windows, but
    other OSs are covered too.


    # Opening a File-Management Interface


    In a graphical OS like Windows, Mac OS, or Linux, you manage files via a window-based
    system where each file and folder is represented by an icon. In Windows, this
    interface is called Windows Explorer; in Mac OS, it is called Finder.


    There are many potential entry points into the file-management interface, depending
    on which location (drive and folder) you want to start in. For example, in Windows,
    you can click the Start button and then choose Computer to start with a list of
