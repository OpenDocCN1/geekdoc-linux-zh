  md: 'Chapter 9 • Security and Access Control


    # Working with Secure Sites and Security Certificates


    To prevent data from being snooped during transmission, web experts have developed
    technologies for securing transmitting data to and from servers. A secure site’s
    URL typically begins with https:// rather than http://; and depending on the browser
    you’re using, there may be other indicators such as a lock in the Address bar
    (see Figure 9.10). Secure Sockets Layer (SSL) is one of the technologies used
    for generating secure connections. Secure connections use a different port than
    regular browser traffic—usually port 443, whereas web browsing is done on port
    80.

    Sites also employ security certificates when communicating via a connection that
    helps you know that the site you’re communicating with is legitimate and not a
    fake to steal your information. A certificate is issued by an issuing authority,
    a company that maintains a website that can tell your browser verify the certificate
    that a web page is presenting of its identity. A security certificate contains
    information including a serial number, the person or organization that issued
    the certificate, and range of dates it is valid to and from. In Figure 9.10, a
    pop-up tells you that the certificate issued for this is Verisign.


    FIGURE 9.10 Secure URL in Internet Explorer with a pop-up that identifies the
    certificate issuer


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_405_0.png)


    With almost any web browser, it’s easy to review and monitor what certificates
    have been installed, who the issuing authorities are, and what details are within
    each certificate. Exercise 9.8 shows where to find security certificate information
    in Internet Explorer 9.


    # EXERCISE 9.8


    View Security Certificates


    +   1. Open Internet Explorer, and choose Tools > Internet Options.

    2. On the Content tab, click the Certificates button. A list of security certificates
    appears. There are multiple tabs in the dialog box for different certificate publishers
    and authorities.

    3. Click the Trusted Root Certification Authorities tab, and browse the list.
    These are all companies that issue and verify certificates.'
