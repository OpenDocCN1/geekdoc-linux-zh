    # Understanding Licenses and Usage Permissions


    It''s rare these days for an application to come with a thick printed manual,
    but that doesn''t mean there isn''t documentation. Each application typically
    has a system built into it, as well as a number of special-purpose documents for
    granting licensing rights to users and encouraging users to register.


    # Understanding Licensing Agreements


    When you buy an application, you''re not actually buying the application. Instead,
    you''re buying the right to use it in a limited way as prescribed by the licensing
    agreement that comes with it. Most people do not read these licensing agreements
    closely, but it suffices to know that they''re pretty slanted in favor of the
    software manufacturer. Don''t the likes? Too bad. No negotiation is allowed. If
    you don''t accept the license agreement, your only recourse is to return the software
    for a refund. (And good finding a vendor that will take back an open box. Still,
    the software manufacturer is required to take it and refund your money if you
    reject the licensing.)


    Although the majority of the applications you acquire will probably be commercial
    products, there are a number of alternatives to commercial software sales. Here
    are some of the license types you may encounter:


    **Freeware** software that is completely free. On the small scale, you can get
    software from download sites such as www.download.com, or from the creator''s
    personal website. Large companies like Google and Microsoft sometimes offer offers
    for free, because it seeks the company''s interests to have lots of people using
    that software. Freeware doesn''t include source code, and users aren''t allowed
    to modify the application.


    **Open Source** is freer than free: not only is the application free, but the
    source code (coded by programmers) is also shared to encourage others to contribute'
