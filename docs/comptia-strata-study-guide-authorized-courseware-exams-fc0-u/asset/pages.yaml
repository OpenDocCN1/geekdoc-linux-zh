    # Creating Folders


    Folders hold files, so they''re important organizing units in a filesystem. Without
    folders, you''d have to browse through thousands of folders on your hard disk
    every time you needed to find one. Windows creates many folders when you install
    it, and each application you install creates its own folder(s) too.


    You can also create your own folders. The most common reason to do so is to create
    separate storage space for data files of a certain type. For example, you could
    create a folder called Brown to hold all the files for a client named Brown. In
    most graphical OS, including Windows, you can right-click in a file-management
    window and choose New Folder (or some similar command) to create a new folder.
    Type a name for the new folder, and press Enter to accept the name. Table 5.5
    summarizes the commands and procedures for creating folders.'
