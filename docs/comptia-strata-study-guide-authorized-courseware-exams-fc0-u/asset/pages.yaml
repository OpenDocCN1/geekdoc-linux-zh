    # Selecting Upgrade Paths


    Now that you have an idea about what components you want to upgrade, it''s time
    to get practical. Can those components be upgraded at all? If so, what type of
    parts will you need, and do those upgrades make economic sense when compared to
    buying a new computer?


    # Processor


    Upgrading a processor is seldom a good idea. Most motherboards accept only a narrow
    range of processor types, so any processor you would get compatible with your
    motherboard probably won''t offer a dramatic improvement in performance over the
    one you already have. In addition, especially on portable computers, the processor
    is often difficult to access and replace.


    If you decide to upgrade the processor, consider the PC''s documentation very
    carefully to make sure the processor you get is compatible. If the PC''s documentation
    is not help, try contacting the PC manufacturer''s tech support to see if they
    can give you any information. As a last resort, find the name and model of the
    motherboard (usually stamped on somewhere) and try the tech support site for the
    motherboard manufacturer.'
