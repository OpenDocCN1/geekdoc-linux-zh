  md: '# FIGURE 2.13 A Secure Digital memory card


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_119_0.png)


    Photo credit: Wirepath, Wikimedia Commons


    > For a very complete comparison of the various types and subtypes of flash memory
    cards, including their exact sizes and features, see http://en.wikipedia.org/wiki/Comparison_of_memory_cards.


    Cards vary not in their sizes, shapes, and capacities, but also in whether they
    implement these features:


    **Write-Protection** Some types have a write-protection switch that enables you
    to set them to read-only.


    **Digital Rights Management** (DRM) Some types support a function of security
    encryption that allows you to make files on the card device.


    # Mobile Media Devices


    A variety of mobile devices employ RAM as their primary means of storage. Today’s
    mobile devices include smartphones, hand-held gaming devices, music players, and
    more. They run their own proprietary OS and applications, but they all rely on
    the same basic nonvolatile RAM technology as a flash RAM or solid-state drive
    to hold it.


    Many devices are multifunction. For example, a typical smartphone serves not only
    as a mobile phone, but also as a scheduling organizer, a music player, and even
    a Global Positioning System (GPS) device.


    # Solid-State Hard Drives


    A *solid-state hard drive* isn''t really a drive, but it’s called for consistency
    with mechanical drive terminology. Its central storage component is flash RAM,
    the same as other flash RAM devices. It differs from other flash RAM devices primarily
    in the data'
