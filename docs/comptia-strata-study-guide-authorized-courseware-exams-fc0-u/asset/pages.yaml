- img_proc: true
  md: '# Safe and Legal Disposal of Hazardous Substances


    # 369


    One way to reduce the environmental impact of batteries is to use rechargeable
    ones. The U.S. Environmental Protection Agency estimates that in five dry-cell
    batteries purchased in the U.S. today are rechargeable. Over its life, each rechargeable
    battery may substitute for hundreds of single-use batteries.


    # Computer Recycling and Disposal


    Working personal computers can often be donated to charitable organizations to
    recover and restore them so they can be reused by others in your home town or
    halfway across the world. Even a nonworking computer can be repaired to working
    condition. For reason, and to protect your privacy, you should erase the data
    on your hard disk before disposing of a computer.


    Nonworking computer parts should be discarded at local recycling or hazardous-waste
    disposal centers, rather than in the trash, because they may contain components
    that can be reclaimed. For example, circuit boards contain lead solder, and some
    of them have coin-cell batteries as well.


    # Monitor Disposal


    As learned in Chapter 2, "Input and Storage Devices," CRT stands for cathode ray
    tube; the older, boxy type of monitor. LCD monitors have largely replaced CRTs,
    but there are still CRTs in service that are now reaching the end of their useful
    lives. Therefore, CRT disposal is a very timely topic.


    CRTs contain environmentally harmful elements, including the phosphorus coating
    on the monitor glass. Phosphorus is volatile, and can explode or start a fire
    when it combines with the oxygen molecules in water. Therefore, in most regions,
    it is illegal to dispose of a CRT with your regular trash. You may need to take
    it to a community recycling or hazardous-waste disposal facility, or use a recycling
    company to dispose of it for you.


    LCD monitors include circuit boards that contain a small amount of lead, and they’re
    treated similarly to desktop PCs in their disposal.


    # Toner Disposal


    The used toner in laser printers and photociers is carcinogenic, so proper disposal
    of toner is a matter of public safety. Toner cartridges should be returned to
    the manufacturer or another company that recycles them. Handle toner cartridges
    with some care to keep the toner from spilling on you, and to keep it out of the
    air where it could enter a person’s lungs. (That’s why you shouldn’t use a regular
    vacuum cleaner to clean up toner spills—the air filter isn’t fine enough to catch
    the toner particles, so they get back into the air.)'
  merge: -1
  pgno: 426
- img_proc: true
  md: '# Cleaning-Supply Disposal


    Some of the cleaning supplies used on IT equipment can be hazardous to the environment.
    Most of the really nasty stuff is associated more with the manufacturing of electronics
    than with its use, but it still pays to be careful.


    You should be able to find disposal instructions on the container of any cleaning
    chemical. There are different rules in different regions, check the label. For
    example, in the U.K., the Control of Substances, Hazardous to Health (COSHH) regulations
    describe how hazardous substances are to be used, stored, and disposed.


    Rather than complete disposal and handling instructions on the packaging, some
    products refer you to a material safety data sheet (MSDS) on their website. The
    MSDS explains what hazards are present in the item, and it dictates the proper
    disposal and handling of the item.


    # EXERCISE 10.1


    # Explore Your Recycling Options


    +   1. Use the Internet or your local phone book to find organizations that will
    accept old computer parts.


    +   2. Contact the company or agency to find out there is any charge for their
    service, what types of equipment they take, and what do they do with it.


    # IT-Related Laws


    Discussing the law is challenging because there are significant differences depending
    on where you live. Not only do different countries handle IT laws differently,
    but so do different states and provinces within the same country.


    For the U.K. version of the Strata exam, you need to know about specific pieces
    of legislation applicable to the EU and the U.K. This topic isn''t on the U.S.
    version of the exam.


    # Data Protection Directive


    The Data Protection Directive is an EU directive that regulates the processing
    of personal data within the EU. Its purpose is to protect the privacy and rights
    of citizens by limiting their personal information may be shared. For example,
    it ensures that medical professionals are unable to share data with insurance
    companies.


    Some of the key points of this directive include the following:


    +   Data can be used only for the purpose for which it was collected.


    +   Data can''t be disclosed to anyone without the permission of the data subject,
    except where other laws create an exception, such as in crime prevention or detection.'
  merge: -1
  pgno: 427
- img_proc: true
  md: 'IT-Related Laws


    +   * In most situations, personal information may not be collected without your
    authorization.


    +   * In many nations, you have a right of access to the information kept on you,
    again subject to some exceptions.


    +   * No personal information may be kept longer than it''s needed. For example,
    if you''re no longer a customer, a company no longer needs your data. Your data
    must be up-to-date.


    +   * Personal information may not be sent outside the nation (or nation group)
    in question. (This part has some complex exceptions.)


    +   * In most nations and cases, organizations that hold personal data must register
    with a related government department. (In the U.K., this is the Information Commissioner''s
    office.)


    +   * Any organization holding personal information is required to have adequate
    security measures in place, such as firewalls and staff training.


    +   * You are entitled to view the data that pertains to you, and to challenge
    its accuracy and have it amended if needed (unless the data involves personal
    opinion).


    # # Computer Misuse Act


    Computer misuse is a euphemism for hacking. Anything that anyone gone gaining
    access to systems where they don''t have permission is computer misuse. In fact,
    legislation covers the act of trying to get information to prepare to hack (social
    engineering) as well as the deed itself.


    Sections 1–3 of the U.K. Computer Misuse Act of 1990 introduced three criminal
    offences:


    **Section 1: Unauthorized Access to Computer Material** This could include using
    another person''s login and password without permission in order to use either
    data or an application. This also includes the alteration, deletion, copying,
    or movement of an application or data, or simply printing the source code of an
    application or printing/publishing the data found.


    **Section 2: Unauthorized Access with Intent to Commit or Facilitate Commission
    of Further Offences** This may include accessing system records and databases
    in order to prepare to commit a crime, or laying a trap to obtain someone''s login
    information or private data.


    **Section 3: Unauthorized Modification of Computer Material** This includes destroying
    another user''s files, modifying system files, creating a virus, introducing malware
    locally on a network, a denial of service attack, or anything that may cause a
    complete system (partial system) to malfunction.


    There has been some controversy over this act, with complaints that it was hastily
    prepared and not well thought out, and that it contains significant loopholes
    and has the potential to lead to unintended consequences. Several amendments have
    been made to the act via part 5 of the Police and Justice Act of 2006, which helped
    to clarify the act''s intent.


    371'
  merge: -1
