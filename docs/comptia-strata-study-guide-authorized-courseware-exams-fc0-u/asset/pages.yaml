- img_proc: true
  md: '# Core Input Devices


    Electronically, a keyboard is a grid of incomplete circuits. When you press a
    number, letter, or symbol key, you lower a contact that completes the circuit
    and sends data to the PC. Different keys complete different circuits, resulting
    in different characters being sent to the computer.


    Some keys; trigger a circuit that changes any other values sent while they''re
    pressed. The Shift key is the most common example. When you press Shift by itself,
    nothing happens. When you hold Shift and press a letter key, an uppercase letter
    is sent, a different value than the letter is typed by itself.


    Other keys send function codes rather than letters or numbers. For example, the
    F1 key sends a code that represents Function 1. What entails depends on the operating
    system (OS) and/or the active application. For example, at a command prompt, pressing
    F1 has no effect, but in Windows, F1 opens the Help system. If an active application
    has a function assigned to the F1 key, it grabs input and interprets it as its
    own command.


    In addition to the alphanumeric, numeric, and symbol keys from the original typewriter
    layout, your keyboards also contain a variety of special-purpose keys, including
    the following:


    +   **Function Keys** Labeled F1 through F12, these keys perform special functions,
    which depending on the application or OS in use. For example, in Windows and most
    Windows-based applications, pressing F1 opens the system.


    +   **Esc (Escape) key typically cancels the action in process. Its exact use
    depends on the application; Esc commonly opens an open dialog box or cancels a
    special mode, for example.


    +   **Shift, Ctrl, and Alt** These modifiers change what happens when some other
    key is pressed. Shift makes uppercase letters, for example. Ctrl and Alt have
    special uses depending on the application. Ctrl plus a letter may activate a shortcut;
    Alt typically activates a menu bar.


    +   **Arrow Keys** Allow you to move an onscreen cursor or insertion point in
    the up, down, right, or left direction.


    +   **Scrolling or Positioning Keys** In some programs, the Home and End keys
    move to the beginning or end of the document, and the Page Up and Page keys move
    up or down one screen.


    +   **Windows Key** This key, usually with a four-section flag graphic on it,
    opens the Start menu in Windows.


    +   **Fn** Found only on notebook and other portable computers, this key is an
    alternative of the Ctrl key; when with some other key press, it performs a special
    command, usually hardware-related. For example, pressing Fn and the up-arrow key
    together increase the display brightness.


    +   **Numeric Keypad** Standalone keyboards have a separate numeric keypad to
    the right of the main keypad layout. It is useful when you have to enter a lot
    of numeric data. The numeric keypad has two functions: it can be used to input
    numeric data or to move the onscreen cursor or insertion point. To toggle between
    these two modes, press the NumLock key. Notebook computer keyboards don''t usually
    have a separate numeric keypad.'
