  md: '# Wildcards and Multifile Selection


    In a graphical interface, you can select multiple files and/or folders before
    acting on them, so you don''t have to act on each one individually.


    Items can be contiguous (next to each other in the file listing) or noncontiguous
    (not next to each other). To make a contiguous selection, click the first file
    or folder in the group and then hold Shift as you click the last one. To make
    a noncontiguous selection, hold down Ctrl (on a PC) or Command (on a Mac) as you
    click individually on each item to include.


    At a command prompt, you can use wildcards to specify a group of files or folders
    based on their names. Use a question mark ? for individual characters and an asterisk
    * for multiple characters. For example, to select all documents that begin with
    W and have a .doc extension, use W*. To select all documents that are five characters
    in length where the first two characters are Wi, use Wi????..


    # Shortcuts


    A shortcut is a pointer to a file. Shortcut is the Windows term. In Mac OS, they
    are called aliases, whereas in Linux they are known as links, or symbolic links.
    You can place a shortcut anywhere you want quick access to a file, folder, or
    an application, such as on the desktop. The original remains in its original location.
    The shortcut isn''t is just a pointer on a map that tells the OS how to get to
    the file. Most shortcuts can be distinguished from regular files because they
    have an arrow in their lower-left corner, as shown in Figure 5.11.


    FIGURE 5.11 Shortcut icon


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_255_0.png)


    You can create a shortcut in Windows by holding down the Alt key as you drag a
    file or folder, or by right-dragging and then choosing Shortcut(s) Here from the
    menu that appears. In Mac OS X, right-click or Ctrl-click a file or folder, and
    then choose Make Alias.


