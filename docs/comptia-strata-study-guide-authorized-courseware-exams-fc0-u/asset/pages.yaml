  md: 'Understand power-saving techniques for computers and peripherals. Operating
    systems have power-saving features, such as power plans in Windows, which place
    the computer in a low-power mode after a specified period of inactivity. Many
    peripherals, such as printers, also have low-power modes.


    Identify green equipment, techniques, and procedures. A company can save both
    energy and money by creating IT policies savings. For example, replacing desktops
    with laptops, removing non-essential components from a server, replacing servers
    with NAS, and setting a PC to sleep after a period of inactivity are all green
    techniques. Using Energy Star-rated hardware can also help.


    Understand how business infrastructure affects energy usage. Businesses can dramatically
    decrease their operational and energy costs by allowing workers to telecomm, by
    designing their buildings with energy conservation in mind, and by employing cloud
    computing and VoIP technologies.'
