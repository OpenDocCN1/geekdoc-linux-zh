    # Using the System Configuration Utility


    The System Configuration Utility, also known by its executable filename of MSCONFIG,
    allows Windows users to selectively disable certain applications and services
    that automatically load at startup. This can be a great benefit when you''re trying
    to troubleshoot a startup problem that you''re fairly sure one of your startup
    applications, but you have no idea which.


    This utility isn''t found in the Windows menu, so you have to run it by name.
    Click the Start button, type MSCONFIG, and press Enter to open the System Configuration
    window shown below. It is available in Safe Mode too.


    # 8.1: The System Configuration utility


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_354_0.png)


    Notice that by default, Normal Startup is selected. That means the Registry specifies
    what be loaded. The alternatives are Diagnostic Startup (which turns off everything
    nonsensical and is useful in determining, in general, whether loading at startup
    is causing the problem) and Selective Startup (which starts using only the specific
    items you''ve excluded).


    The Startup tab is the main feature of this utility. Click Startup to see a list
    of all the programs that load at startup. The length of the list may surprise
    you. You can drag the column widens so that you can see the text in them more
    clearly. The names, manufacturers, and commands can give you clues as to each
    program''s origin and purpose. You can also use an online resource, such as the
    Task List reference found at www.answersthatwork.com.'
