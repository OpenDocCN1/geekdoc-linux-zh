  md: '# Setting Up a Computer


    Before that, CardBus was the standard, from the late 1990s to around 2005. It
    was 54 mm wide with a 68-pin connector. CardBus slots communicated with a 32-bit
    PCI bus on the motherboard, with all CardBus cards sharing a 1.06 Gbps bandwidth.
    Figure 4.26 compares the physical dimensions of the two ExpressCards with that
    of CardBus. PC Card was a 16-bit type card prior to the advent of CardBus. The
    term PC Card is often used generically to refer both the older 16-bit type and
    the 32-bit CardBus type.


    # FIGURE 4.26 ExpressCard vs. CardBus sizes


    ![](img/c5fa9b25d23e63f6ffb996940faeace5_212_0.png)


    PC Cards were available in three thicknesses: Type I, Type II, and Type III. Type
    I cards (3.3 mm thick) were rare; they were used primarily for adding memory and
    were 16-bit only. Type II cards (5.0 mm thick) were the most popular type and
    were widely used for purposes such as modem and network cards.


    PC Card and CardBus were at their height of popularity back in the days before
    USB, when the only way of connecting peripherals to a notebook computer was through
    the very slow parallel and serial ports. Now that USB 2.0 is the dominant standard
    for peripherals, fewer devices use these card types, and many notebook computers
    don''t have any card slots at all.


    # Turn On and Use the PC and Peripherals


    When all the components are connected, using whatever combination of the ports
