    # Wireless Encryption


    Wireless networking encryption enables the owners of routers to prevent anyone
    from connecting to them who don''t know the encryption key (password). Many networks
    employ encryption, especially those in home or secure work environments.


    In Chapter 3, you learned how to configure wireless networking, setting a Service
    Set ID (SID) and a type of encryption, which might include Wired Equivalent Privacy
    (WEP) or the more modern and advanced Wi-Fi Protected Access (WPA). Review “Configuring
    Wireless Networking and Encryption” in Chapter 3 for details.


    > Be aware that an encrypted network connection can still pose hazards. Hackers
    and snoops who also have access to the network key can be a threat, so make sure
    you don''t file and printer sharing on when connected to any network if you aren''t
    sure who the other users are.'
