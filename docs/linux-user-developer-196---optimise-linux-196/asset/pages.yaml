  md: "# Tutorial\n\n# Raspberry PiNET Core\n\ndownload and cache (to disk) the NuGet-based\
    \ project dependencies specified in the main project. File template now includes\
    \ installations of a development centre, which is a new behaviour adopted in the\
    \ .NET Core SDK v2.1 release.\n\nWith the project scaffolding, you are ready to\
    \ compile the C# source code and build related assemblies. A .NET Core project,\
    \ the dotnet build command uses file and project settings. C# source files located\
    \ below, the parent folder are recursively scanned and compiled as part of the\
    \ compilation stage.\n\n+   - dotnet build\n\nTo run the project, simply type\
    \ dotnet run, which will identify the entry point in the web app, execute the\
    \ Startup class, and launch the Kestrel-based web server host.\n\n+   - dotnet\
    \ run\n\n# Deploy as a self-contained app\nWorking from the scaffold code, you\
    \ can easily create new classes and introduce methods that make your app up from\
    \ your Visual Studio Code, or your\n\n> With the project scaffolding generated,\
