    # Use S-TUI


    Unlike many other command-line tools, S-TUI requires no configuration and you
    can begin launching it immediately after installation. Just run the `stui` on
    the sidebar to monitor your CPU. Our Lenovo test machine was correctly identified
    as Core i5-8250U CPU @ 2.00 GHz. S-TUI uses various native tools to gather the
    relevant information; for instance, temperature and second. Far further details
    can be ascertained from running `/proc/cpuinfo`.


    When first launch S-TUI, it will display all four parameters — Frequency, Temperature,
    and usage. You can also change the refresh rate by changing the value of `Refresh(0.1)`.


    Depending on your choice, the colour scheme may not be able to clearly see the
    differences on the S-TUI. If this happen, switch to a White-on-Black colour scheme
    and run S-TUI again. This should allow you to see all the characters you need
    to then change your profile.


    You can navigate the interface using the H and J keys, which move up and down,
    and use the U and I keys to zoom. Press `q` to quit.


    Next to Monitor, the (X) will monitor your system, and if the stress test is active,
    press `d` to disable it. Press `e` to enable it.


    Stress on the sidebar by pressing Space. You will notice the entries are replaced
    with (X).


