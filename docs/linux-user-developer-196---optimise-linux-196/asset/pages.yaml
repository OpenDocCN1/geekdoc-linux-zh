    # Use PyInstaller


    PyInstaller is not the only option to package Python programs. Other popular options
    are Freeze and py2exe. Freeze actually comes in a couple of implementations, Cx_Freeze
    and bFreeze, but the latter hasn''t been updated in quite a while, so it might
    be worth mentioning.


