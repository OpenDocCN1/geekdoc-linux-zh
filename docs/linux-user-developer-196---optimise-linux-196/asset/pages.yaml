    This clever system takes a designed de-connection between part edges and generates
    the joints that are required.


    # As long as it works...


    Compared to the neatness of the case, the MidIdentifier is all a sloppy side,
    but the pair says there wasn''t an easy way to fit everything in without some
    ''pushing, sliding, gluing and wiggling.'' The piano was inserted from the back
    and kept in place with wood.'
