    # Database maker Redis makes its module code proprietary


    A timely reminder that open source is not for life...


    Redis Labs has announced that its range of Redis Modules are no longer open source.
    By abandoning the AGPL licence in favour of Apache v2.0 Clause, in-house modules
    extending the functionality of the Redis database software are now off-limits
    to third-party cloud service providers.


    Modules affected by this change include RedisSearch, Redis Graph and ReJSON. Redis
    Labs cofounder and CTO Yishman justified the decision in a blog post, complaining
    that "Cloud providers have been taking advantage of the open source community
    for years [...]. This discourages investing in developing open source code, because
    any potential benefit goes to cloud providers rather than the code developers.


    To understand the implications of this, we spoke to Sharma Menschlaw, a lawyer
    and software licensing expert who has been writing about Redis for more than ten
    years.


    He told us that the project Redis remains BSD-licensed, only the Redis Modules
    have been moved to the "so-called Commons Clause" [However], Redis can still contribute
    to the project, under other licences, such as AGPL. In fact, the lead developer
    in a blog post that confirmed this current model, will be under AGPL.


    According to Sharma, "it is just because the source is available does not make
    open source or free. There are essential freedoms (as the FSF defines) which make
    software free"


    ![](img/dc600c804c0af7973878feccd30b80b4_5_0.png)


    > Just because the source doesn''t make open source or free


    Similarly, the Open Source Definition has a set of conditions defining open source.
    By removing the Commons Clause, Redis is ending in open source. "Redis will call
    the need for Redis Modules + Commons Clause, which may lead to people believing
    consequently. Any adherence to the licence limits the freedoms/permissions that
    it allows changes the licence from open source to proprietary."


    Redis wants to limit how much cloud providers can profit from deployments and
    services that are not shared with third parties. But Sharma noted that Linux Defer
    before the adoption of the Commons Clause has been "too restrictive, referring
    acting only to this line of code:


    "Self means practising any of the rights granted to you under the Licence to provide
    to third parties. For a free or other consideration (including without limitation


