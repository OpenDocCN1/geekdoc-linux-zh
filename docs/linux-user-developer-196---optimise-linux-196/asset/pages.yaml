  md: "specify the packages libumwind and gettext for.\n\n+   - sudo apt-get -y update\n\
    - sudo apt-get -y install libumwind gettext\n\nThe script below will download,\
    \ decompress, extract and move the .NET SDK to your subdirectory. As the .NET\
    \ Core open source code is being built on a regular basis, you'll need to identify\
    \ the version of .NET Core. To assist in version management, the Bash script will\
    \ read in the .NET Core version parameter. Note that the command we use to download\
    \ the target below refers to Arm64-based SDK and Runtime, which are also available.\n\
    \n```\n#!/bash\n# Example usage: ./dotnet-sdk-pi-install.sh\necho \"Downloading,\
    \ expand and install version $1 of the .NET SDK\"\nsudo apt-get -y update\nsudo\
    \ apt-get -y install libumwind\nsudo apt-get -y gettext\nwget https://dotnet.cli.core.windows.net/dotnet/sdk-install-linux-arm64.sh\n\
    chmod +x ./dotnet-sdk-install-linux-arm64.sh\nsudo mkdir -p /opt/dotnet\nsudo\
    \ ./dotnet-sdk-install-linux-arm64.sh --channel=$$1 --install-dir /opt/dotnet\n\
    sudo ln -s /opt/dotnet/dotnet /usr/local/bin\n```\n\nAs part of the script we\
    \ will download the .NET Core version specified as input and include the specified\
    \ version in the directory path. Soft-linking to /usr/local/bin then makes which\
    \ version of .NET Core available in the shell - for example, we can use it with\
