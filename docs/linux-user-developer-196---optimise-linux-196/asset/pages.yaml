    \ As you write new code, associated tests for exercise app can be executed using\
    \ the dotnet test command. Eventually, several iterations in the inner (code-build-test-debug)\
    \ loop, will reach a point where you will be ready to deploy to the Pi set.\n\n\
    To target an ARM-based Raspberry Pi device, use the dotnet publish command. The\
    \ -r argument of dotnet publish is used to specify the target RID. Executing the\
    \ command results in the generation of a self-contained deployment which will\
    \ include the .NET Runtime as part of the standalone distributable file.\n\nTo\
    \ prepare or copy copies of the self-contained deployment from your (Linux) host\
    \ to Raspberry Pi, execute the following command:\n\n```\ndotnet publish -r linux-arm64\
    \ -o /home/kevin/hellomvcarm/Release/\ndotnetcoreapp.1/linux-arm64/publish/ \n\
    raspberrypi:home/pi/HelloMvcArm\n```\n\nThe MSBuild engine will include, including\
    \ .NET-Base NuGet libraries for deployment in the standalone folder. That shared\
    \ object\n\nsuch as libcore.so are also included in the copy operation.\n\nOnce\
    \ the standalone assemblies have been copied to the Pi device, you are ready to\
    \ run the Pi device and execute the web app. After setup, change the environment\
    \ variable directory previously specified. Then use dotnet:exe to explicitly launch\
    \ the parent assembly containing the Project object or the lesser-known exe uses\
    \ the binary prepared in the self-contained publish folder, also improving the\
    \ restore and build times that are not needed.\n\n```\ndotnet HelloMvcArm.app\n\
    ```\n\nOnce the output is printed to the console, you have the confirmation that\
    \ you're ready to fire up a web browser and\n\nhttps://raspberrypi.local\n\n#\
    \ Versioning of .NET Core (SDK, Runtime)\nGrasping versioning of .NET Core can\
    \ be difficult? Because the version for something changed as the open source has\
    \ evolved you must first recognize that .NET Core has two high-level components:\n\
    \nThe SDK and the Runtime have two different version schemes, as the SDK maintains\
    \ an association with the Runtime. Semantic Versioning (SemVer) is applied to\
    \ the .NET Core Runtime release. The third position of the SDK version to the\
    \ .NET Core Runtime represents the number of major, minor, and patch components:\n\
    \nHowever, the SDK does not have a matching version in the first two positions\
    \ of the SDK version to the .NET Core Runtime release. The third position of the\
    \ SDK version represents the number of calculated features plus a 100+ patch version.\
    \ For example, a minor version with a 7 patch will run with a version 7 runtime.\n\
    \nIn reality, significant changes to .NET Core are reflected in the major version,\
    \ making breaking changes less. Minor changes have less impact and often introduce\
    \ new APIs or features. Each of the SDK can target the identified runtime (version)\
    \ or any other version.\n\nAs a general trend, .NET Core SDK receives updates\
    \ more frequently than the Runtime and this versioning scheme helps clarify relationships\
    \ between the two projects. For further details, please visit: https://docs.microsoft.com/en-us/dotnet/core/version\n\
    \n# Download and Install. .NET Core on Pi\n\nInstalling .NET SDK on a bare-metal\
