    to where your script resides and run the following command:


    # pyinstaller myscript.py


    This creates a subdirectory called myscript, and places all the requirements for
    your script there. This includes the Python engine you used to run it. Your program
    is an executable, called myscript, that launches your code just by picking up
    the entire folder and sending it to others. They simply need to run the executable
    without file


    ```

    pyinstaller myscript.py

    ```


    One downside of this method, at least for development, is that Pyinstaller thinks
    everything you need is in a single location. You can then verify everything right
    through this distribution. If Pyinstaller made mistakes, you can easily figure
    out what those mistakes are and correct them before you go out. Once everything
    is correct, you can use a different option to create a bundle that contains everything
    needed, as in the following command:


    ```

    pyinstaller --one-file myscript.py

    ```


    This single file can be sent to your users. It is a much more comfortable experience
    for them, so you will likely like using this method instead. When they run this
    executable, it unpacks itself into a temporary directory, and then runs the executable,
    just like the folder method. After it finishes, it cleans up after itself and
    deletes the temporary files and directories that need to be cleaned manually.
    This is not a particularly major problem, but rather just a potential issue that
    you should be aware of,


    If you have nothing within your Python code, you''re done at this point. But for
    many programs, you will have extra data or files that need to be part of the package
    which is just created. For example, say you have a readme containing important
    information for the user. In these cases, you can include them with the following:


    ```

    pyinstaller --add-data "src/README.txt;" myscript.py

    ```


    The format is SOURCE:DESTINATION for the --add-data option. In the example above,
    we are taking the readme file from the src subdirectory and putting it in


    ![](img/dc600c804c0af7973878feccd30b80b4_46_0.png)


    the root distribution. If you have multiple files, you can include them using
    --add-data options. This is fine for data and documentation, but if you have some
    piece of optimised code to add use --binary a list of files to be included in
    the final executable. It has the --add-data options. With this option, you can
    use Pyinstaller to include binary files in the list of files to package:


    By default, Pyinstaller builds a dependency graph for all the imported modules
    in your program


    > If you have nothing within your Python code, you''re done at this point. But
    for many programs, you''ll have some extra data or files that need to be part
    of the package


    but also check these binary files to see what they depend on. This is where Pyinstaller
    will have the most difficulty, so you will definitely want to test the bundle
    before sending it out to the world.


    # Rogue modules include the modules being imported is one of the issues you encounter.
    You can add extra paths to be searched with the following option:


    # Create spec files


    For smaller projects, you can control the execution options with --add-data and
    --add-binary on the command line. This is a bit cumbersome, however. Luckily,
    there is another way of organisation that needs to be bundled into the executable
    version of your script: the spec file. It contains everything you want to configure
    about your executables.


    The first step is to create a spec file that you can edit for your project. The
    following command does this:


    ```

    py-spec myscript.py

    ```'
