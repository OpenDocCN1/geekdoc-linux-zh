  md: '# BACKUP SERVER


    # Tardis 1.0.2


    # A command-line lightweight backup server


    Tardis pitches itself as a free alternative to Apple''s Time backup app. However
    these features interact with Tardis like the swishy spanish Time Machine, take
    place via the command line. It isn''t a criticism, rather a tool for heads-up
    who might be misled by a description of backup files.


    Beyond appearances, Tardis does exactly what it promises. It takes incremental
    backups and allows you to recover from the backup. The tool runs in a client-server
    mode, and the server is light enough to be able to run on the Raspberry Pi 2.
    You can also choose to run both server and client on the


    same computer, which is the most likely isolation for a single machine. Tardis
    is written in Python and the installation as described in the GitHub is straightforward.
    The server is configured via a single config file and the installation comes with
    a template to get started. The only thing you have to edit is the backups of locations
    before you start the server.


    When you call the server from a remote machine, you can add a password to encrypt
    backups on several machines. The tool recovering the data from the backup set
    is also fairly simple. Alternatively, you can mount the dataset as a complete
    file system.


    +   Pros


    +   Does encrypt,, incremental backups with interesting recovery options.


    +   Cons


    +   Has a slight learning curve and requires a read through the docs to be used
    effectively.


    +   Great for


    +   Scheduling incremental backups on several machines (even just one).


    https://github.com/kodinger/tardis


    # AUDIO PLAYER


    # Audacious 3.10


    Linux desktop has no dearth of media players. What makes Audacious apart from
    the others is its own set of powerful features.


    ![](img/dc600c804c0af7973878feccd30b80b4_90_0.png)


    This based media player supports a wide variety of audio formats including OGG,
    MP3, FLAC, AAC and more. Besides flexibility allows you to create and edit plugins.


    Audacious is available in all of the most popular media players for Linux, including
    Fedora, Arch, and Ubuntu. It comes with two UI: GTK+ and a classic vinho player.


    One of the strengths of Audacious is its plugins, which many may have sets of
    their own. The audio-plugins package in Fedora doesn''t include all the packages,
    so you''ll have to fetch them from the RPM Repository.


    In addition to influencing playback, the plugins affect other aspects of the player
    such as Visualizations, Playlists and Output. The latest release introduces some
    new features such as ability to remember shuffle history between apps to avoid
    repeating songs.


    +   Pros


    +   Lightweight, cross-platform, audio player that can be extended with plugins.


    +   Cons


    +   What it means is, but still isn''t as versatile as some of the other apps
    out there.


    +   Great for


    +   Anyone looking for a modern audio player.


    https://audacious-media-player.org/


