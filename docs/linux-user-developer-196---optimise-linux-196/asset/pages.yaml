  md: '# Components list


    +   Raspberry Pi 3 Model B (other models can be used)

    Capacitive touch-display 7-inch (Waveshare Raspberry Pi 7 Touch Screen LCD)

    Loudspeakers (BeatsSash Mini USB PC Speaker)

    MIDI USB keyboard (AKLP PK25, 25-key ultra-portable USB MIDI keyboard controller
    for laptops)

    Wood for laser cutting (approx 3mm thick)


    # Adjustable screen


    A wooden block added inside the case to help hold up the screen in its horizontal
    position. A small beam was attached to the block to adjust the screen viewing
    angles.


    # MIDI music


    The speakers sit on plates that have hot-glued to wooden supports. The speakers
    are attached with double-sided tape.


    ![](img/dc600c804c0af7973878feccd30b80b4_70_0.png)


    ```

    > WHICH SONG DID YOU MEAN?

    > FOR ELTON

    > NOCELLTESPARCH

    > HOW SOLL ER LEBEN

    > BASATELLA CLASSICAL

    > ANNIVERSARY SONG

    > RESET

    ```


    ![](img/dc600c804c0af7973878feccd30b80b4_70_1.png)


    # Case design


    The design of the case was sketched out initially and then a trial copy of Adobe
    Illustrator was used to create the files for a laser cutter. The case was made
    from 3mm thick plywood. You can find all the files for the chassis at here: https://www.instructables.com/id/MidIdentifier


    # Tweaking touch


    The MidIdentifier uses a Raspberry Model B running Raspberry OS, which the part
    needed some config changes and rebooting to get the touchscreen working properly.


