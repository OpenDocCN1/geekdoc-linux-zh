    If you want to distribute this end, you need to specify the target directory and
    use the user icon to install. That is different from cx_Freeze, which creates
    an executable and data files freely. You will need to add some extra code to manage
    loading them, as discussed in the cx_Freeze documentation.


    # Use py2exe


    py2exe is a different option to cx_Freeze and Freeze. PyInstaller is actually
    an extension of distil. This means that you need to create a setup.py file in
    order to generate an executable version of your program. Using our


