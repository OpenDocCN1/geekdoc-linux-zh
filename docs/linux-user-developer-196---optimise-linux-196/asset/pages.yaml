  md: '# Tutorial Python: PyInstaller


    # # PylInstaller: Learn how to share your Pi projects


    This issue, we look at one of the options available to make sharing your Raspberry
    Pi projects easier


    # Joey Bernard


    Joey is a columnist covering software, as well as writing Python code for the
    Raspberry Pi. In his day job he helps researchers and students at the university
    level design and run projects on supercomputing clusters.


    ![](img/dc600c804c0af7973878feccd30b80b4_45_0.png)


    # Resources


    +   - PyInstaller www://pyinstaller.org/index.html

    - py2exe www://www.py2exe.com

    - Cx_Freeze https://github.com/antony-tiensgu.github/cx_Freeze/


    We''ve looked at several techniques in Python programming that you can use your
    project, but what if you have special cases? How do you share it with others?
    In this tutorial, we will look at one of the options available to package your
    program, called PyInstaller. This is designed to package everything you need except
    on a different machine. This is probably the best way for a new user to pick up
    your project and start using it.


    We''ll show install PyInstaller, how to configure it for your needs, and some
    areas that might need special attention. We''ll look at some options, such as
    py2exe, which could be better for cases that have specific requirements. But as
    mentioned, there are different tools because people have different requirements
    that need to be fulfilled.


    # Get started


    So what do you actually package your program to pick it up? Normally, you give
    it a single script that is the starting point for your project. PyInstaller then
    goes through it and collects a list of all of the other modules and scripts it
    uses. All of this is code, which is then copied into a directory along with the
    active PyInstaller distribution being used on the system. At this stage, you have
    everything you need to run your project on a similar system.


    A similar system, in this case, means the same type of hardware and the same operating
    system. This means


    that you want to create a package for a particular system, say macOS, you will
    need to build the PyInstaller package on that system - you can''t make a ''universal''
    package that works on every system. Once the files are collected into one location,
    you can create an executable file which includes all the files needed. There are
    several options available to include things that are running on the ended-user
    system. We will look at a few of them in this article, to see what options you
    find most useful.


    Most distributions do not include PyInstaller as a module managed by the system
    package management. You will need to install it using pip. Most distributions
    have different versions of pip for Python 2.x and 3.x. For example, if you wanted
    to install PyInstaller for Python 3, you could use


    ```

    sudo pip3 installInstaller

    ```


    This installs uses the system library. If you want to have the latest development
    version, you can use a URL to pip it, as in the following example


    ```

    sudo pip3 install https://github.com/pyinstaller/pyinstaller/tar/devel

    ```


    Once this is done, you have everything you need to start packaging your project.
    You can verify that it installed correctly by running the following:'
