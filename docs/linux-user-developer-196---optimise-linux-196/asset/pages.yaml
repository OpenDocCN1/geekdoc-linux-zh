    IRC. Mattermost allows users to edit and delete messages and create private rooms
    and also have


    private-on-one conversations. Users can add emojis to messages, which can be viewed
    inline and downloaded.


    Developers will appreciate Mattermost''s proper markup and well-documented formatting
    options. It supports syntax highlighting for programming languages, and other
    code themes.


    The latest version of the plugins-system, which allows you to extend the software,
    deploying Mattermost could be overall process, but the procedure is explained
    in detail on the website. Once it''s deployed, users can interact with the server
    via desktop apps for Windows, Linux and macOS, as well as mobile apps for iOS
    and Android.


    +   - **Pros**

    Feature-rich server that offers multiple deployments and has cross-platform apps.


    +   - **Cons**

    The Linux app is in beta as are some of its functions such as video-calling and
    plug-ins.


