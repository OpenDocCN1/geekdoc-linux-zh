  md: '# Pi Project


    # Midlidentifier


    ![](img/dc600c804c0af7973878feccd30b80b4_69_0.png)


    # Midlidentifier


    An elegant MIDI piano takes the music on an extra dimension with the ability to
    guess what you''re attempting to play


    Andreas Scholz


    Andreas studied computational linguistics for his Bachelor degree and is working
    on his Masters thesis.


    We two German makers made the Midlidentifier an interesting but unassuring pair
    that seemed nearly unaware of how good their little linker project is. The Midlidentifier
    has been published, and given the quality of our work; it was built out of a old
    love of old old computer design and the desire to do something simple with music
    recognition.


    The MIDI format is actually quite complex - too complex for our purposes. So for
    our first step, we implemented a mechanism to convert the MIDI input into our
    piano - as well as the MIDI files in our library - into a simpler format. This
    change of format allows for different algorithms to be as matching as possible
    while still being fast enough to handle faulty input (notes, timing and so on).
    This project enabled us to be creative with algorithms and in disable of how badly
    some of them worked.


    # This much stylish project – what inspired you to build it?


    Thanks! We wanted something easy for our family and friends to understand what
    we are actually doing. This project was built to be easily grasped (in a literal
    sense) and to show ourselves as well. It was also important for us to create other
    things that could interact with music in a fun and we feel that music enables
    us to do just that.


    # Can you explain how you made the case?


    We drew our inspiration for the case from the Apple computer. After some prototypes
    we used technical drawings and Adobe Illustrator to design the sketches. To get
    the joints for the inside, we used a wooden frame, some 3D printed parts and glue/joinery.
    Finally, we used a laser cutter to trim some plywood and wood for everything.


    # Karsten Scholz


    Karsten


    studied computational linguistics and works as a computer scientist at Sulzer
    GmbH in Munich.


    # Like-it?


    # Would you do anything differently now? What would you give someone attempting
    another project?


    We would probably start developing on Raspberry Pi instead, because we found it
    difficult to work the same way on Windows, except if we were to use a Linux system
    to get the very good complex performance of Python. However, we found that Windows
    was not as flexible in how it dealt with MIDI sounds. As for for our project,
    we''re not afraid of making mistakes, because we can always be something that
    we didn''t. We just go with the flow and solve the problems.


    You can contact (reply not guaranteed!) at andreas.scholz@gmail.com and karsten.scholz@gmail.com.


    # What was the most challenging part of the project?


    Getting MIDI files as individual notes to play correctly on the Raspberry Pi via
    the external sound card was easy, but then we encountered some obstacles in our
    way. The different behaviour on Windows and Linux made it even more so.


    # Further reading


    # What do you have in mind for your next project?


    Head to


    https://www.instructables.com/Midlidentifier/


    Another musical project?


    Yes, anything musical project in particular, but I am interested in home automation
    and pursuing a project in the next year.


    # What did you decide to use the Raspberry Pi?


    We didn''t really think about it - it seemed the obvious choice that we made.
    We knew needed a computer to be connected to a piano, a touchscreen and speakers.
    With its small-factor form, this made the Raspberry Pi the obvious choice for
    us.


    # What coding or libraries were involved in the project?


    Our coding was done mainly in Python 3 with a number of shell scripts. We used
    a variety of libraries, including tkinter synthesizer for the interface, deido
    to deal with the MIDI file format and the fluidsynth synthesizer for output.


    # How does the music identification aspect of the project actually work?


    AS a musical project, I have an idea for an interactive project I''ve been wanting
    to build for some time now. Stay tuned.'
