    # Using partitioning


    Once you''ve identified the device name for your usb stick, you can run cfdisk:


    ```

    # cfdisk

    ```


    If your usb stick is not detected, use the other value here. You should see a
    clear like the one in the main image (see page four).


    Using the arrows, you can navigate the partitions on the stick. Each row of the
    table represents whether there is a partition or a range of empty space. Likely,
    you''ll start with a single partition and empty space. Use the arrows to select
    the [Delete] and press Enter to delete the partition. If there are other partitions,
    use up to delete them as well, so that the entire usb stick is free.


    Let''s start partitioning your first partition to be db2 in size. Use the left
    keys to select the [New] option, enter the size, and press Enter to create the
    partition.


    This has been fairly easy, so let''s make a new partition. Use the right keys
    to select the top Free space; we will create the partition there. Select [New],
    and then enter the size of 2G before pressing Enter to create the partition.


    This partition is going to play a special role: it''s to be the boot partition
    for your usb stick. Any bootable device, like a Live CD, has a hard drive or a
    partition called the boot partition that contains various files necessary for
    booting the system. The boot partition can contain other partitions, while other
    systems are created inside the same partition - but it is a bit more robust to
    use the boot partition for everything else.


    Now, all we need is to delete this partition. Keep the cursor at the top of your
    new partition (which might be named /dev/sdb2); use the left keys to select it,
    [Delete] and press Enter to set the partition back to free. You will see a small
    * next to /dev/sdb2 at the top,


    Now let''s create another partition after the first one we''ve just made. Use
    the right key to move the cursor down to the Free space, and then select [New]
    to enter the size again. At the top of the disk, you might see something like
    the following:


