  md: '# HARDWARE


    # Lenovo finally joins the Linux Vendor Firmware Service


    # ThinkPad firmware will be easier to install


    Running a Linux-powered ThinkPad, the laptop range launched by IBM and acquired
    by Lenovo in 2005, is a generally pleasing experience. However, without the right
    firmware updates, which need to be sought out, it''s unlikely to be perfect. Thanks
    to Lenovo joining the Linux Vendor Firmware Service, this has just become a lot
    easier.


    The LVFS enables manufacturers to distribute UEFI firmware directly to users,
    while making the process as safe and reliable, with the minimum of recalls. According
    to https://fwup.org/ "The LVFS runs on a dedicated private server and uses a public
    CDN for metadata. Every month there are over five million files downloaded from
    10 clients. There are currently 281 devices supported on the LVFS with 758 available
    firmware updates.


    ![](img/dc600c804c0af7973878feccd30b80b4_7_0.png)


