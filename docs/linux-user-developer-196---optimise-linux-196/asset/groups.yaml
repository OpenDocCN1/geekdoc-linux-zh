    # 摩尔定律的未来


    我们是否应该开始适应处理器停滞的未来，不再对速度提升抱有期待？**Mike Bedford 调查**


    # 概览


    - **深度解析：什么是摩尔定律 p64**

    我们详细研究了摩尔预测的具体内容以及其局限性。

    - **晶体管缩放 p66**

    为什么缩小尺寸对于增加复杂性至关重要。

    - **尺寸缩减 p66**

    我们解释了为什么缩小尺寸的代价已经放缓。

    - **隧道尽头的光 p66**

    摩尔定律终结的可能解决方案。


    也许我们开始听到摩尔定律即将终结似乎已经是很久以前的事了，事实上，搜索可以发现此类预测可以追溯到1997年。我们稍后会看到这些预测的情绪并不意味着处理器性能的无情改进一定会有一个终点。当那一天来临时，我们将面临一个现实：这已经是极限了。


    但如果某些行业专家预测其将结束，那么这种情况是否会比预想中更早发生呢？我们确实希望深入探讨这个问题；毕竟，为该定律命名的戈登·摩尔（Gordon Moore）是该定律的创始人之一。


    ## 什么是摩尔定律？


    摩尔定律经常被误引，例如说它预测处理器性能每隔几年就会翻倍。虽然这可能离事实不远，但这一预测是摩尔定律的暗示，而非定律本身的实质。事实上，当戈登·摩尔在六年前首次发表他的著名声明时，他正在制造离散逻辑器件，而英特尔正准备推出世界上首个微芯片。发表在主流行业杂志上的一篇文章指出“最小组件的复杂性以每两年的速度得到确认”。他接着表示：“在短期内，这种速度肯定可以保持不变。但从长远来看，增长速度是不确定的，尽管没有理由相信它在至少几十年内不会保持不变。不必担心每个集成电路的组件成本将达到65,000美元。”


    摩尔的意思是，主流芯片中的晶体管数量每年都会增加一倍，并预测这一趋势将持续至少十年。他后将其更新为每两年翻一倍，而这十年的预测被不断地延伸。尽管当时还不存在这些东西，但今天将摩尔定律应用于微处理器是合理的。图表（从
    p66 开始）显示


    ![](img/dc600c804c0af7973878feccd30b80b4_63_0.png)


    从第一个微处理器英特尔 4004 到几年前最新、最强大的芯片，每个设备中的晶体管数量。我们关注的是英特尔的芯片，但讨论英特尔的产品也是合理的。将其延伸到今天则有些牵强，因为英特尔不再引用晶体管数量。该图表具有对数轴，这意味着指数级增长——即在固定时间内翻倍——最近几年的趋势显示，如果英特尔每两年翻一倍是遵循摩尔定律的，这将是预期的趋势。


    ## 其他摩尔定律


    摩尔定律指的是可以挤在芯片上的晶体管数量，但许多其他趋势也显示出类似的指数级增长，且同样偶尔发生。


    减少，如果我们只需要看每颗晶体管的价格。拥有2300个晶体管的4004耗资200美元，这在1995年已下降到不足10美分；而今天最大的芯片拥有数十亿个晶体管。


    比较处理器的速度是棘棘的，因为今天最大的芯片拥有数十亿个晶体管。第一个微处理器英特尔4004的时钟频率为740kHz。到1985年，特征尺寸已缩小到1000纳米。在人类头发宽度的三分之一到一半之间，这在当时被认为是一项巨大的成就。如果它在标准看来似乎保持稳定，

    从那时特征尺寸就已经大幅下降，到1985年缩小到1000纳米，而且它们此后不断缩减。


