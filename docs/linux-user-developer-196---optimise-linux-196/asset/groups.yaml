    than Bash''s default. It reads through your bash history to provide suggestion
    functionality and allows you to filter the commands. Additionally, you can use
    Ctrl+R key to display the most frequently used commands.


    Press Ctrl+R again to search through history with predefined sorting orders, such
    as the length and time-stamps of the commands.


    Besides this compilation feature, HSTR enables you to remove commands (such as
    types or containing sensitive information like passwords) and also allows you
    to mark them as unwanted.


