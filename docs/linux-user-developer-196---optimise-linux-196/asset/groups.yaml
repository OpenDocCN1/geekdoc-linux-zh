    > 这些是发烧级耳机，旨在为听众忠实呈现音轨中的原始内容，而不是过度夸张。


    ## 优点


    - 提供了卓越的品质和舒适度，且电池续航持久。声音既动态又宽广，无线模式下的听感与有线模式同样出色。


    在使用耳机听音时，拜雅动力（Beyerdynamic）决定在右耳罩上采用大面积触控板。我们通常很讨厌使用触摸控制，因为它们很少能 100% 运作，但这次并非如此；这个大触控板防止了意外触碰。扩展的表面使得你的每次点击和滑动都能准确记录。右耳罩还集成了
    USB-C 充电口、电源按钮、3.5mm 耳机接口和麦克风。


    ## 缺点


    - 由于设计笨重且降噪效果有限，并缺乏完善的移动端 App 支持，因此不适合旅行。


    无论是有线还是无线，表现都一样。有线连接时，你需要一个性能不错的放大器来驱动它们，尽管在这个价位下，配合手机使用的效果也是可以接受的。


    在编码格式方面，耳机支持 AAC、SBC 和 aptX HD。aptX HD 编码器支持最高 CD 级/24-bit PCM 音频数据，前提是你拥有源素材。我们在
    OnePlus 5T（支持 aptX HD）上加载了 Tidal HiFi，耳机声音非常清晰，即使连接到分辨率高于 48kh/4 的源素材，也不会出现卡顿。


    在控制方面，拜雅动力并没有被任何音效感到惊艳。大多数时候，是在我听了几个小时并在其他耳机之间切换后，才体会到它的细节水平、声场和动态表现。不，这些耳机并不是那种刻意渲染高音的——它们只是很清晰。


    ## 总结


    - 低音缺乏深度和足够的冲击力，虽然它不是那种轰轰响的低音。话说回来，这些是发烧级耳机，旨在为听众准确呈现音轨中的内容，而不是夸张任何部分。它更多侧重于人声和乐器（如吉他和大提琴），而高音具有极佳的细节、延伸和能量。即使听了几个小时，耳机也不会显得过于刺耳或疲劳。更令人印象的是，耳机能清晰地检测到。


    电池续航额定为 20 小时，我们在 50-75% 音量下获得了 22 小时——这高于平均水平。虽然续航时间不算长，但通过 USB-C 有线充电速度非常快。


