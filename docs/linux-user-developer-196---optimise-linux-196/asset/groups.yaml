    When the only way to access your SSH servers is by public key authentication,
    any attempt at password-forcing will immediately fail. Attackers will inevitably
    try to keep trying. It''s important to remember that public key authentication
    is vulnerable to many attempts.


    There is also the possibility of using a private key-force attack by phishing,
    for example, Crowd (see Resources). When a non-public key is exposed, the /var/log
    auth file will have entries like: 02:28:sshd[1929]: Connection closed by password.
    It will record failed attempts and ban them with fail2ban. Edit /etc/fail2ban/filter.sshd.conf
    and append the following line to regex


    ```

    cryptsetup luksOpen /dev/DEVICE LUKS

    fs.ext4 /dev/mapper/LUKS -n dataencrypted

    cryptsetup close LUKS

    ```


