    ## Security automata

    What can we do when infrastructures are too performant for humans to monitor?


    The cloud is all the rage and it has become in one form or another, for at least
    a decade, Vendors organisations all like to catch up with what we now call cloud-native
    technologies and their many facets. The CNCF definition of cloud-native relates
    to architecture that makes old security methods no longer applicable.


    According to the CNCF, the definition of cloud-native relates to architecture
    that makes old security methods no longer applicable and offers the ability to
    make changes to critical, live services seamlessly. As such, "containers, services
    meshes, microservices, immutable infrastructure, and declarative" justify this
    approach.


    However, with new attack vectors, which will need to be carefully considered by
    all parties involved, old defenses no longer suffice. The approach of "We''ll
