- md: "\n## PICK THE PERFECT IDE\n\nLinux provides a powerful platform for software\
    \ developers and offers a wide choice of Integrated Development Environments,\
    \ as Paul O'Brien explains...\n\n## AT A GLANCE\n\n- *Traditional full IDEs p58*\n\
    \  Full-fat IDEs remain popular, particularly in the Java space, courtesy of the\
    \ Apache and Eclipse communities.\n- *Editor-based IDEs p60*\n  Many editors,\
    \ both full apps and command line, have grown on to offer full-blown IDEs\n- *The\
    \ JetBrains behind the operation p61*\n  If you're willing to pay for your IDE,\
    \ you can have access to a family of hugely impressive software development products.\n\
    - *Source-control tools p62*\n  The latest source-control tools bring visualisation\
    \ to the process, including some additional superpowers\n\nWhile the adoption\
    \ of Linux is gradually growing among general consumers, it remains a popular\
    \ choice for tech-savvy groups of users: The technical nature of the platform,\
    \ which can scare away the average user, is offset by its ultimate customizability\
    \ and an excellent level of performance for coders.\n\nSoftware development on\
    \ an operating system takes place within an Integrated Development Environment\
    \ (IDE). An IDE is so named because it typically brings together software development\
    \ – such as a code editor (alone), build tools and a debugger with built-in source\
    \ control. GUI design, object-oriented tools and development compilation to make\
    \ the development process faster.\n\nWhen choosing an IDE, selection is usually\
    \ driven by the programming language. Most IDEs choose to focus on a specific\
    \ language and this has been the traditional approach in the past, but more recently\
    \ IDEs have moved towards supporting multiple languages, often provided by plugins-created\
    \ by the community. This has been driven by the growth in popularity of text editors\
    \ that have grown into more featured IDEs; including Visual Studio Code, Atom\
    \ and Bash have roughly the same status as basic editors. The most widely used\
    \ IDEs are far-paid products, including the hugely popular JetBrains suite, but\
    \ many, are available for free.\n\nWhen developing for Linux itself, some IDEs\
    \ will be environment-specific. GNOME Builder is specifically tailored for the\
    \ GNOME desktop environment. It has support for Dev-get, Git and Flatpak, with\
    \ code completion for the C and C++ languages. As a project-based IDE side of\
    \ the fence, Qt Creator provides tailored IDEs for those using KDE libraries,\
    \ as do KDevelop, another development that forms parts of the KDE project.\n\n\
    As one might expect, there is great debate about what is the best environment\
    \ to use for Linux kernel development. Vim is the preferred choice, reflecting\
