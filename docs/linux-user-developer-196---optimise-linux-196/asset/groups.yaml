    disks | 9 | The process is fully automated, which is a boon for admin of large
    networks | 8 | The cumbersome menus give access to a wide variety of tools and
    partitions on the fly | 7 | The restoration process is ideal for beginners, but
    a bit slower for more experienced ones | 7 |

    | Overall | An all-round tool that caters to all common cloning and imaging use
    cases | It takes a bit more to get going, but it''s worth the effort | 8 | |


    # AND THE WINNER IS...


    # FOG Project


    We present a case for each and every one of the cloning tools in this test. For
    example, Redo Backup & Recovery is an ideal solution for home-users. But while
    it did flawlessly in our tests, the fact that it hasn''t been widely updated prevents
    us from recommending it. At the other end of our options is the G4L, which offers
    a bit too many features, such as disk cloning tools, requires a certain degree
    of familiarity, and new users will take some time to get with it.


    In opinion, Clonezilla and FOG are the two options that work best. They are ideal
    for your home network as well as by admin of larger networks. But while similar
    tasks, they go about differently. The main difference between the two interfaces
    is the fact that Clonezilla runs off a Live CD, while setting up a server. FOG
    is also more comprehensive in that it can perform several tasks other than imaging,
    such as powering


    ![](img/dc600c804c0af7973878feccd30b80b4_83_0.png)


    The minor effort required to set up FOG is really, especially on large networks


    by up computer remotely via Wake On LAN, and installing applications remotely
    via the featured cmap-which helps install software on Windows installations. If
    you''re choosing between Clonezilla and FOG and you have machines that aren''t
    connected to a network, you have no option but to use Clonezilla. Clonezilla network


    options IE and Litl make the most sense for networks that don''t need much administration
    after being imaged, such as those in libraries. But if you need to look after
    machines after they''ve been cloned, it''s best to go with FOG as its setup and
    imaging options are excellent.


    Wayne Sherins


