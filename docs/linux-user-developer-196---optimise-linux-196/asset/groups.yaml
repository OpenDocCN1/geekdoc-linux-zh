    # Welcome


    to 190 years of Linux User & Developer


    ## in this issue


    - » Optimise Linux, p18

    - Pick the Perfect IDE, p56

    - » The Future of Law, p64


    Saad news. After 19 years, this will be the last of Linux User & Developer. While
    that sinks in, the team we would take the opportunity to thank you for all reading
    and being part of our audience in Linux and the world of open source and free
    software. The journey began in 1999 and has had ups and downs. We remember to
    Maggie Meer, the original publisher of LUBD, and she recalled how people were
    producing and how it felt being part of a vast community. That sense of community
    we have taken for granted, but as LUBD''s first place in Linux history, we want
    to get involved in helping the open source software you can. If you''re a fan
    of a distro or app, consider testing early releases or donating to them; if you
    are thinking about coding it, you join the scene – and it''s probably not a music
    player - then tell us what it is, and you can change the world around it.


    Chris Thornett, Editor. Happy venting! It has been a blast!


