    # 优化 Linux


    ## 提升性能


    轻量级发行版不仅仅是为了复兴旧硬件——它们在较新的现代计算机上运行同样很有意义。


    我们之前提到过，主流发行版完全注重便利性和通用性。它们的设计初衷是为大量用户服务。这种方法的缺点是，它们臃胀了许多组件，这可能导致运行变得迟钝和缓慢。而这正是精简版发行版帮助你充分利用可用资源的地方。


    ### 获取极速桌面

    加速你 Linux 体验的最佳选择之一是 [Linux Lite](https://www.linuxitos.com)。最新版本使用 Ubuntu 18.04
    的软件包构建，并使用了经过修改的 Xfce 桌面。该发行版在速度和效率之间取得了良好的平衡，同时保持了响应灵敏和快速。该发行版在任何速度高于 1GHz 且拥有
    1GB 内存的处理器上都能良好运行。


    Linux 的外观和感觉与普通的主流发行版无二致。大多数安装的程序并不包含许多传统的轻量级应用；相反，大多数安装的程序包含了 GIMP、Firefox、VLC
    和 LibreOffice 等常见“常客”。除此之外，你还可以找到许多其他程序，如 Kodi、Skype、Steam 以及自定义的 Lite Software
    应用程序。事实上，该发行版包含了几个 Lite 品牌产品，用于交互和自定义你的桌面及安装。


    还有一些软件可以允许用户测试各种驱动程序，设置备份过程以升级到最新版本，并管理用户。其中最有用的是一个出色的配置器，甚至是一个安装程序，你可以用它来释放内存、删除旧内核并安装新内核。它还包含了一些工具。


    ![](img/dc600c804c0af7973878feccd30b80b_21_0.png)

    ![](img/dc600c804c0af7973878feccd30b80b_21_1.png)


    AntiX 经过优化可以运行在内存中，并通过性能增强微调（如安装和启用 ZRAM 和 preload）来轻松维护其滚动发布。另一个类似的选择是 [MX Linux](https://linuxmx.org)，它基于
    Debian，是 antiX 和 MX 社区共同努力的。


    ## 从零开始构建安装

    构建 Linux 安装的一种方法是自己动手。精简版 Linux 最受欢迎的两个选项是 [Gentoo](https://www.gentoo.org) 和
    Arch。这两个发行版都提供最小化安装镜像，帮助你快速组装出一个功能完整的系统。它们之间的区别在于 Arch 仅支持 64 位，而 Gentoo 支持 32
    位和 64 位，因此与那些拥有数百页说明的发行版相比，这些发行版的转化过程漫长且复杂。


    好的一是，是你将获得一个经过精调和精简的安装。另一种基于源码的方法是 [Crux](https://crux.org)，它启发了 Arch 的创建，并为习惯于使用命令行界面的用户设计。这三个发行版各有优劣，并将引导你完成制作安装的整个过程。如果你不确定精简版
    Linux 的想法，你需要 [Linux From Scratch](https://www.linuxfromscratch.org)。


    ![](img/dc600c804c0af7973878feccd30b80b_21_2.png)


    ## 准备更新


    MX Linux 更新了许多应用，并从 Debian Testing 回传了版本，现在每次发行版切换到 Debian Stable 时都会进行全新的安装。设置现代计算机的另一种方法是从
    RAM 运行操作系统，其 I/O 速率比传统的磁盘安装高得多。MX Linux 的 UI 不受限制，并带有自定义工具。从它自己的工具到易于启动的镜像，桌面都包含了管理常用微调的实用工具。像
    Linux 一样，MX Linux 伴有许多从 Debian Testing 回传的应用。然而，这里的诀窍在于找到一个针对内存运行运行优化的发行版，例如 [Slimux](https://www.slimux.org)，它已经存在了十多年。它占用的内存少于
    100MB，而且每次启动时都会提供一个图形化桌面，你可以通过它管理系统的各个方面。Slimux 包含了代码编辑器，你还可以安装任何其他窗口管理器。另一个针对
    RAM 运行优化的良好选项是 [Puppy Linux](http://www.puppylux.com/)。这是一个适用于所有位宽系统的轻量级镜像。Puppy
    的启动菜单提供了在复制到内存后继续运行的选项。这使你能够在使用少于 100MB 内存的情况下保持发行版的高性能。Puppy 使用完整的桌面环境，并共享几种不同的主题。与那些仅限内存的同类产品不同，Puppy
    包含了 Firefox、GIMP 和 LibreOffice 等常规应用。


    ## 完全从内存运行


    设置现代计算机的另一种方法是从 RAM 运行操作系统，其 I/O 速率比硬盘得多。该发行版将自己复制到内存中，应用启动速度更快。


    ## 轻量级替代方案


    正在为你的 Linux 应用寻找低消耗的替代方案吗？尝试这些：


    | 组件 | 类别 | 提供的功能 |

    | :--- | :--- | :--- |

    | LXQt | 桌面 | 结合 LXDE 组件，打造具有现代外观和感受的快速桌面 |

    | IceWM | 窗口管理器 | 高可维护性的符合标准的窗口管理器 |

    | Ly | 显示管理器 | 基于 Linux 和系统的基于 ncurses 的应用程序 |

    | PCManFM | 文件管理器 | LXDE 的默认处理器，轻量级且能处理大多数任务 |

    | Krader | 文件管理器 | 基于久经考验的 Commander 的图形文件管理器 |

    | Midori | Web 浏览器 | 基于 Web 的浏览器 |

    | Tor | 邮件客户端 | 基于 Linux 系统的 app 应用程序 |

    | | 媒体播放器 | 基于 MPV 的播放器 |

    | Feh | 图片查看器 | 简单的图像查看器 |

    | Psi | 聊天客户端 | 支持 XMPP/Jabber 协议 |


    ## 定制化发行版


    有很多发行版是为特定需求而定制的——尝试这些：


    ### 针对 USB 优化


    [Porteus](https://www.porteus.com) 是一种为了在移动介质（如优 盘、SD 卡或 CD）上运行而优化的发行版。它以压缩状态存在于介质，并在启动时解压到内存中。它的权重约为
    300MB。当你通过 Porteus 的包管理器获取包时，可以根据需要激活或禁用它们。该发行版拥有一个自定义的启动程序，允许你保存启动项并启用持久化等功能。它提供了许多轻量级桌面和窗口管理器的选择，并自带了应用程序帮助你构建桌面。与单一
    ISO 不同，Porteus 以单独 ISO 镜像的形式提供，每个镜像都有不同的桌面环境，从 LXDE 和 KDE 到 Cinnamon 和 Openbox。稀疏地，ISO
    的


    ![](img/dc600c804c0af7973878feccd30b80b_23_0.png)


    ### 不使用 systemd


    尽管大多数发行版已转向系统管理器，但反对者认为这是退步。几个发行版没有使用 systemd，并继续使用 SysV init 系统。


    > https://www.porteus.com 是这样的一个异议者。除了坚持 SysVd 之外，该发行版还对其 Live


    ![](img/dc600c804c0af7973878feccd30b80b_23_1.png)


    ## 创建你的最小化 Ubuntu 发行版


    1. 安装最小化 Ubuntu：首先下载启动 Linux 所需组件最少的最小化 Ubuntu ISO。在安装过程中，安装程序会询问是否添加额外的组件；选择一个轻量级的图形环境。


    2. 定制安装：安装后，你可以使用包管理器编辑发行版并删除软件包。你还可以安装新的二进制文件和其他选项，如主题和菜单。


    3. 清理系统：当你完成所有更改后，最好的方法是从安装中删除任何不需要的文件。虽然你可以手动完成，但这需要大量的时间和精力。此外，还要前往 Edit > Preferences
    > Languages 来移除任何额外的语言包。


