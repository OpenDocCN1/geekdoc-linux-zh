    is the Internet of Things (IoT), the hackable nature of such small and inexpensive
    computing device makes it the most popular prototyping and development boards
    for IoT projects.


    Of course, standard-base distributions such as Ubuntu Core give you a wonderful
    base platform to control your IoT projects - but you don''t really need to be
    a proficient programmer to interact with your appliances and devices.


    +   1 Flash the image


    Download the Prota Pi image and use the Etcher app to flash it to an SD card.
    The first boot Prota IoT is an access point.


    ![](img/dc600c804c0af7973878feccd30b80b4_26_1.png)


    Congratulations!


    ![](img/dc600c804c0af7973878feccd30b80b4_26_2.png)


    +   2 Configure Prota


    To connect the device, connect to Prota AP and either head to http://prota.pi
    in a browser or use the Prota Space app for Android and iOS. Follow the first-time
    setup wizard.


    ![](img/dc600c804c0af7973878feccd30b80b4_26_3.png)


    > You don''t really need to be a proficient programmer to interact with your IoT
    devices


    ![](img/dc600c804c0af7973878feccd30b80b4_26_4.png)


    +   3 Install apps


    Click the App Libraries link in the Dashboard to view and install any or all apps—any
    device connected to the Pi and follow each easy automation routes.


    ![](img/dc600c804c0af7973878feccd30b80b4_26_5.png)


    Above Use RPM files to install android-x86 a folder in the root directory, along
    with relevant boot options in GRUB


    +   4 Create stories


    Prota Pi is a headless OS with which you can interact with the devices from a
    point-and, HTML-based interface. The core automation engine of Prota OS is named
    settings and helps you create automation rules for controlling devices. These
    rules are based on the apps available in Prota Pi. One of the most useful is the
    GPIO app that allows you to control all the GPIO pins on a Raspberry Pi directly
    within Prota Pi interface.


    One of the apps that''s already installed is Stories. You can use it to write
    rules to trigger event-actions, such as turning on lights when you get home.


    Check out some of the interesting IoT and automation projects shared by the developers
    of the Prota Pi, Naran, Inc, on instructables(www.instructables.com/member/Naran/instructables/)
    to get a taste of the possibilities on offer— you may be surprised by what it
    can do.'
