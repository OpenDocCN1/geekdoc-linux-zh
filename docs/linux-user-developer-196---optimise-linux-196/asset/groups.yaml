    your old computer. In our tests, the distribution on an Acer 578ZG worked well.
    Android-x86 doesn''t offer the same distribution, but is an attractive proposition
    to make an old machine usable.


    # Docker distributions


    There are several other Linux distributions for running containers, each with
    their own advantages. Besides Rancher, there''s ContainerOS (which uses Kubernetes),
    RedHat''s Atomic Host (ideal for rootless servers), and Alpine Linux (used by
    Docker to build packages)


