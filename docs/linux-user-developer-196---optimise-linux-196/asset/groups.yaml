    # 焦点聚焦


    ## 为 KDE 付费


    在讨论 GNOME 和 KDE 的“友好竞争”时，我们询问了 Graham，KDE 社区是否能从企业部门中受益，还是说从那些在资金上对他们提供更多支持的公司中受益。“这是一个非常具有吸引力的情景，我们实际上正处于辩论之中——关于在何时、何地以及如何做的问题，”他说道。KDE
    拥有 Blue Systems，该公司赞助了大量工作以及许多更多的 Plasma 开发者，但 Graham 承认还有其他公司参与其中。“我们的旗舰数字艺术项目
    Kritik，是


    ![](img/dc600c804c0af7973878feccd30b80b4_14_0.png)


    他个人的观点是，过去的开发似乎对目前没有产生影响。我们看到过一些批评者对 KDE e.v Foundation（一个代表 KDE 的非营利协会）向非成员开发者支付工资表示反对。但目前仍有许多反对意见需要关注。


    上方：KDE 的预算非常小，2016 年仅为 98,860 欧元。John Doe 表示，KDE 基金会的数据显示其成本高于收益。“数据不包括由公司支付工资的贡献者，但包含了员工成本，Plasma
    以及应用程序轻量级主题的成本为 18,230 欧元。”


    这让我再次感受到了某些东西，尽管它尚未被发布，但人们似乎真的察觉到了。我想说：是的，你是对的——这是一个伟大的决定。我认为这是让我们社区变得如此强大的原因之一。我们有许多人与开发者一起贡献以完成版本发布。我们有
    IRC 频道，当然还有邮件列表，以及我们的代码审查和测试管理系统——Phabricator (https://kde.org/) 是我们所有人都活跃的地方。


    ## 你对今年 Academy 的 KDE 项目有何感受？


    这是一个非常现实的问题。我认为其中有几点最初非常重要。首先，视频编辑器可能在一个月内完成了原本大约需要一年的工作，这令人惊叹且奇妙。这是一种令人难以置信的努力结晶。其次，其中存在很多
    Bug，但我们并不需要面对这些问题。目前我还没有什么特别想谈的，但我们确实遇到了一些冲突。


    > 我们收到了 Kubuntu 18.04 用户非常好的报告——他们对它非常满意


    那么， KDE 项目需要什么样的支持呢？


    我们有一个页面，链接到主页以及我们所需的所有工作。关于“为什么”以及“做什么”，是为了帮助我们了解你可以做什么。我们有详细的文档和说明，关于如何帮助修复 Bug、如何分阶段协助。我们参与了开发和视觉设计。我们一直在努力改进文档，但我们需要这些支持。在目前的大阶段，我们需要更多的帮助。一旦你决定了从哪里开始，有很多资源可以与开发者进行交流。


    在隐私方面，你们的要求是什么？


    隐私方面的活动没有另外两个那么活跃，但确实会出现一些问题。对于尚未公开的工作，我们已经做了很多准备。


    ## 这与 Purism 的第五代有关吗？


    我认为它是相关的，从某种意义上说，所有事情都是相互相关的，因为我们正在与他们进行大量工作。关于商店，我们正在开发一个能够吸引人的平台。这是我在 GNOME
    中正在做的事情之一（关于隐私的通用标准）。这是针对 GNU 软件的 KDE。我们发布了一个使用 KDE 的 Kubframes 的新版本。我们想要改进用户界面。我们刚刚开始这项工作，并真的希望能够加强与
    Purism 的合作伙伴关系，并最终说服他们使用 Plasma Mobile。


    ## 认为 Purism 想要支持


    我的印象是 [Purism] 是愿意的。


    '
