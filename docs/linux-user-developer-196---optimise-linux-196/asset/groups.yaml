    ## 开源

    06 新闻与观点 | 10 字母 | 12 采访 | 16 内核专


    ### 商业


    ### 数据库厂商 Redis 将其模块代码改为专有


    这是一个及时的提醒：开源并非终身制


    Redis Labs 宣布其系列 Redis Modules（Redis ）不再开源。通过放弃 AGPL 许可证并转采用 Apache v2.0 条款，扩展
    Redis 数据库软件功能的内部模块现在不对第三方云服务供应商开放。


    受此变化影响的模块包括 RedisSearch、Redis Graph 和 ReJSON。Redis Labs 创始人兼首席技术官 Yishman 在博客文中对这一决定出了辩护，他抱怨道：“云提供商多年一直在利用开源社区……。这阻碍了人们对开发开源代码的投入，因为任何潜在的收益都流向云提供商，而不是代码开发者。”


    为了理解其影响，我们采访了 Sharma Menschlaw，他是一位律师兼软件许可专家，撰写关于 Redis 的文章已十多年。


    他告诉我们，Redis 项目本身仍保持 BSD 许可，只有 Redis Modules 被移动到了所谓的“公用条款”（Commons Clause）[然而]，Redis
    仍然可以在其他许可证（如 AGPL）下为该项目做出贡献。事实上，首席开发人员在博客确认此当前模式的博文中表示，将在 AGPL 下进行。


    根据 Sharma 的说法，“仅仅因为源码可用并不意味着它是开源或免费的。存在本质的自由（如 FSF 所定义）才让软件变得自由。”


    ![](img/dc600c804c0af7973878feccd30b80b4_5_0.png)


    > 仅仅因为源码可用并不意味着开源或免费的


    同样，开源定义有一组定义开源的条件。通过移除公用条款，Redis 正在结束其开源之路。“Redis 将提出对 Redis Modules + 公用条款的需求，这可能导致人们随之产生这种信念。任何对许可证中限制其允许的自由/权限的遵守，都会将许可证从开源转变为专有。”


    Redis 希望限制云提供商从未与第三方共享的部署和服务中获利的程度。但 Sharma 指出，在采用公用条款之前，Linux 许可已经“太具有限制性了，仅指向这行代码：


    “‘自身’意味着行使许可证下授予你的任何权利以向第三方提供。对于免费或其他对价（包括但不限于


    ‘公用条款’许可证 v1.0

    软件由许可方根据许可证提供给您，须遵守以下条件：

    在许可证中没有其他条件的情况下，权利的授予将不包括，且许可证未授予您销售


    为了上述目的，“自身’意味着行使任何

    上述 Redis 表示不希望第三方云

    提供商从托管费用或消费/支持

    与软件相关的服务中获利，即完全或实质上与

    软件功能运行的产品或服务：

    不仅该条款将提供，

    而且 Linux 支持公司和

    个人参赛者。Sharma 总结道：

    “现在使用 Redis 的真正问题在于对 Redis Core 的依赖程度有多大，以及是否可以在不依赖 Modules 的情况下使用 Redis。”


    ## 游戏


    ### Steam Play 将 Windows 游戏引入 Linux


    修改过的 Wine 和新的 DirectX 层带来了极佳的 Linux 游戏体验


    在 Valve 放弃 Linux 仅几个月后，新版本的 Steam Play 已发布，为大量热门游戏带来了兼容性。由于让 Steam 用户访问 Proton
    层允许开发者从其他平台构建项目，Valve 现在可以在 Linux PC 上运行 Steam，或者通过运行 Valve 基于 Linux 的 SteamD，这使得许多游戏（如《星大战：绝地武士：幸存者》、《辐射7》以及大多数标题（包括
    2016 版本）能够在 Linux 上运行。


    如果它们与 Linux 项目的目标和要求兼容，则是上游；结果，Valve 用户一年多以来一直从这项工作中受益。

    由于与 Direct3D 图形兼容，DirectX 12 将我们用于高性能图形。DXVK 也包含在内——这是 Valve 的另一个实现，将驱动我们的开源图形小组支持
    Mesa 影响 DXVK 的 map 调用，并与 ‘Feral Interactive’ 协作提供坐标层功能和驱动支持。

    此外，我们致力于改善整体游戏体验，全屏图形和多线程都得到了增强。全屏游戏将不再会在不干扰窗口的情况下被“无缝拉伸”为窗口模式。

    Proton 的第一个帖子，这是一种允许 Windows 游戏在 Linux 上运行的兼容层


    ![](img/dc600c804c0af7973878feccd30b80b4_6_0.png)


    > 仅仅因为源码可用并不意味着开源或免费的


    同样，开源定义有一组定义开源的条件。通过移除公用条款，Redis 正在结束其开源之路。“Redis 将提出对 Redis Modules + 公用条款的需求，这可能导致人们随之产生这种信念。任何对许可证中限制其允许的自由/权限的遵守，都会将许可证从开源转变为专有。”


