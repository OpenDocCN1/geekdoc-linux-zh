    FOG dashboard from a mobile device such as a tablet


    # Usability


    # Usability


    Clonezilla is one of the most requested tools on Linux for imaging an old disk
    to a bigger one, new disk thanks to its front-end, which is quite intuitive. The
    menus offers sensible defaults so you''ll find yourself ahead with the recommended
    options most of the time. Make sure that the partition to be cloned is not mounted.


    Unlike the others, FOG isn''t available as a Live CD and has to be installed.
    Developers need a static IP before running the setup script that automatically
    fetches the required components. Once it''s installed, you can use its browser-based
    dashboard to image and clone computers across the network.


    # Malleability


    # Malleability


    We''ve shown a list of disks or partitions, depending on whether you want to clone
    the disk or individual partitions. You also get to compress the cloned images
    using the gzip, bz2 or own algorithms. You can also use them in a locally attached
    device, such as USB disk attached to the computer via network.


    FOG offers plenty of options, with various fields to describe the host images.
    It can also image into groups for easier management. There are several options
    to schedule the imaging process. Besides creating and deploying images, FOG can
    also be used to debug computers, and manage multiple hosts.


    # Network use


    # Network use


    In addition to simple cloning, you can also use Clonezilla for multicast via two
    options. Clonezilla Server Edition sets up a Remote Boot (PXE) server to broadcast
    images over the network. Or, use the Clonezilla Live Mode on the bootable CD to
    get a temporary server.


    FOG is scalable and can manage large networks spread over multiple locations,
    in the same or around the world. It also supports functionality to deploy multiple
    machines at once. For installations, you can have multiple FOG configurations
    using servers, which help take the load off the main server.


    # Restoration


    # Restoration


