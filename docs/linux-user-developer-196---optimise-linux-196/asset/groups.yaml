    \nCode 最近还添加了另一个功能：在线协作。该功能以 Live Share 为品牌命名，允许开发者共享高亮和自动补全，Code 具有额外的智能功能，可以根据你的代码提供“智能”补全，包括变量、类型、方法和其他函数；支持各种\
