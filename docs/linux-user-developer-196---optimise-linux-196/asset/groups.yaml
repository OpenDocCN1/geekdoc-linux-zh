    ## G4L


    一个比竞争对手更灵活的全面磁盘克隆工具


    ## Redo Backup


    一个引人注目的克隆工具，言出必行且无冗


    以下是带有 A 和 B 的选项：


    | 选项 | Windows | macOS | Linux |

    |---|---|---|---|

    | A | 文件分割 (UDFF) | 活跃文件分割 (UDFF) | |

    | B | 引擎拆分 | | 备份到本地 |

    | C | 备份 | | 从本地恢复分区 |

    | D | 备份 | | 从本地恢复备份 |

    | E | 备份 | | 从本地恢复分区 |

    | F | F-clone | | 从本地恢复分区 |

    | G | MTP-clone | | 从本地恢复分区 |

    | H | 特殊命令 | | 示例、插拔、备份、等 |

    | I | 块级 | | 恢复网络 |


    ![](img/dc600c804c0af7973878feccd30b80b4_82_0.png)


    - G4L 包含了几个实用的磁盘相关工具，可以直接克隆项目，而无需为了创建镜像而复杂的步骤


    ![](img/dc600c804c0af7973878feccd30b80b4_82_1.png)


    > 我们发现 Redo 对硬件变化很敏感，我们只能在相同的硬件上成功恢复镜像


    ## 可用性


    相比 Clonezilla，G4L Live CD 是基于文本的且运行在终端中的。然而，这种方式要冗长得多。通过几个向导创建和恢复镜像，每个向导似乎都有几个步骤。优点是，选项解释得非常清楚，你不会在任务中因为需要额外的说明而抓耳挠腮。


    Redo Backup 实际上是最简单的应用程序之一。Live CD 直接进入图形界面，提供备份或恢复镜像的按钮。点击操作即可进入一个简单的向导。在创建备份时，它会要求你选择想要克隆的分区或磁盘，而在恢复时，会提示你选择位置。


    ## 活性


    G4L 提供了多个选择选项，以便在创建和恢复镜像时精调设置。它提供了多个菜单来管理单个分区和客户端。它允许你将镜像传输到网络目标位置，还可以对它们进行压缩和分割，以便在较小的磁盘上更容易存储。


    这种简单性的缺点是它缺乏其他工具，而这里 Redo 在此没有给你提供任何可调优的选项，例如为压缩镜像选择压缩算法——这似乎是一个奇怪的选项。然而，它确实包含了一些实用的工具，帮助你在开始克隆之前准备好分区和磁盘。


    ## 网络使用


    除了本地使用外，你可以使用 G4L 通过 UDPcast 在网络上创建和恢复镜像。使用实时环境将一台机器设置为组播源，然后它可以提供存储在本地或网络上的镜像。随后在其他计算机上使用
    Live CD 将它们转换为“接收器”，以安装广播副本。


    Redo 可以从本地网络和 FTP 服务器保存和检索镜像。如果你在局域网上配置了网络，它也会检测并尝试克隆它。它主要为家庭用户设计，Redo 不支持向网络上的机器克隆或部署镜像。


    ## 恢复


    恢复过程与镜像制作过程类似。你指向保存的镜像以及想要克隆镜像的磁盘/分区。遗憾的是，你需要手动选择用于克隆时使用的压缩算法。


    恢复或部署镜像副本就像在公园里散步一样——只需点击几次即可开始过程。然而，Redo 可以将镜像恢复到相同或更大的磁盘上，如果你将较大的镜像用于较小的磁盘，它会报错。


    ## 总体评价


    G4L 比这里的其他选项需要更多工作，但在本地和网络分区及磁盘镜像克隆方面提供了无与伦比的灵活性。


    Redo 是所有选项中最简单的裸机克隆方案，它为了便利放弃了一些对克隆过程的控制。它只能在本地机器运行。


    www.linuxuser.com 83


    ## 磁盘克隆工具评论


    ## 简要：对比我们的结论


    | Clonezilla | FOG Project | G4L | Redo Backup |

    |---|---|---|---|

    | 可用性 | 逻辑清晰的菜单带有合理的默认值，非常好用 | 9 | 并非最简单的应用程序之一 | 8 | 基于 Web 的界面可能会让人无所措 | 7 |
    实际上直观的界面 | 9 |

    | 活性 | G4L 提供了多个选择选项以精调设置 | 9 | 它提供了多个菜单来管理单个分区和客户端 | 8 | Redo 实际上没有给你任何可调优的选项
    | 7 | 实际上选项面向用户 | 6 |

    | 网络使用 | 除了本地使用外，你可以使用 G4L 在网络上创建和恢复镜像 | 9 | 使用实时环境将一台机器设置为组播源 | 9 | Redo 可以从本地网络和
    FTP 服务器保存和检索镜像 | 6 | 实际上选项面向用户 | 6 |

    | 恢复 | 恢复过程与镜像制作过程类似 | 9 | 你指向保存的镜像以及想要克隆的磁盘/分区 | 8 | 恢复或部署镜像副本就像在公园里散步一样 | 7
    | 实际上的过程是针对相同或更大的磁盘 | 7 |

