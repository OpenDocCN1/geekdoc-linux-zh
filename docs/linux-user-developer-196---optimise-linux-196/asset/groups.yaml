    # Installing Linux to the USB stick


    By this point, you should have loaded a bare-bones Arch Linux system - if you''ve
    loaded the options, or if you''ve booted the ISO image directly. There is no system
    installed on the USB stick, so you need to use Arch pacman package manager to
    install some basic programs:


    there is a problem with creating an boot entry for the move by pacstrap, so run
    pacman -S linux to install it. Now we can install the bootloader by the following
    command:


    ```

    # pacman-key --init

    # pacman-key --populate archlinux

    # pacman -Syu

    # pacman install base-devel

    ```


    ```

    # bootctl --path=/boot --install

    ```


    Some of the commands might produce a bit of output; make sure you run them all,


    The last step is to create an boot entry for the new installation, which is done
    by writing contents to a file, /boot/loader/entries/arch.conf, as shown in Figure
    3.


    ```

    # gdisk /dev/sdX

    ```


    We now need to enter the new environment, which we do using the mount command.
    As before we mount the root directory / to the mount and the /boot directory to
    boot our partition table:


    and run sudo umount to close the mount points. After booting from the USB stick,
    you should be able to boot up into a very basic version of Arch Linux.


    ```

    # mount /dev/sdX1 /mnt

    # mount /dev/sdX2 /mnt/boot

    ```


    ### To create more partitions and install more Linux systems to the USB stick
    if you want to take things further, you should use a different partition for each
    installation, though you should use the same boot partition for all of them.


    You should be able to run the following commands to install Arch Linux on the
    USB stick:


    ```

    # mkdir /run/mnt

    # pacstrap /mnt

    ```


    This step takes a bit of time. When it has finished, Arch Linux should be installed
    on the USB stick. We need to install some additional software on our system in
    order to make it boot. First do chroot to take you to the new installation of
    Arch over the USB stick:


    ```

    # genstab -u /mnt >> /etc/fstab

    # arch-chroot /mnt

    ```


    You are dropped at a new terminal, and now you are running Linux off the USB stick.


    # ### Installing through a graphical tool


    Many Linux distributions - from Arch to the various of Ubuntu - you might prefer
    using a graphical tool for installing Linux on your media. For this, we recommend
    booting from a Live CD and then running the tool. At some point, you should have
    the option to choose the partitions to wish to create for example you can select
    "Choose which Anteros to be installed", and then you have the option to choose
    the correct main and boot partitions. It''s always useful to know how to do this
    manually, though:


    www.linuxuser.com 39'
  - '[PAGE 39]


    # S-TUI: Stress-test your CPU


    # S-TUI: Stress-test your CPU from the terminal


    The nifty little S-TUI is an elegant command-line application to monitor your
    CPU and run a stress test


    software repositories, and you can install them using your distribution''s package
    management tool.


    # Use S-TUI


    Unlike many other command-line tools, S-TUI requires no configuration and you
    can begin launching it immediately after installation. Just run the `stui` on
    the sidebar to monitor your CPU. Our Lenovo test machine was correctly identified
    as Core i5-8250U CPU @ 2.00 GHz. S-TUI uses various native tools to gather the
    relevant information; for instance, temperature and second. Far further details
    can be ascertained from running `/proc/cpuinfo`.


    When first launch S-TUI, it will display all four parameters — Frequency, Temperature,
    and usage. You can also change the refresh rate by changing the value of `Refresh(0.1)`.


    Depending on your choice, the colour scheme may not be able to clearly see the
    differences on the S-TUI. If this happen, switch to a White-on-Black colour scheme
    and run S-TUI again. This should allow you to see all the characters you need
    to then change your profile.


    You can navigate the interface using the H and J keys, which move up and down,
    and use the U and I keys to zoom. Press `q` to quit.


    Next to Monitor, the (X) will monitor your system, and if the stress test is active,
    press `d` to disable it. Press `e` to enable it.


    Stress on the sidebar by pressing Space. You will notice the entries are replaced
    with (X).


    ![](img/dc600c804c0af7973878feccd30b80b4_39_0.png)


    The Linux command-line offers a vast array of useful applications for a lot of
    use cases. Connecting to remote machines, monitoring and other administration
    tasks can be done from the terminal.


    Monitoring your system''s performance is no exception. Depending on your choice,
    you can use a variety of different applications to monitor different components
    such as CPU frequency, temperature, memory usage and so.


    With S-TUI, which is an abbreviation for Stress-Terminal, you can monitor CPU
    temperature, power and utilization. It presents all the information and can even
    be exported to a data file. You can also configure the tool to automatically log
    scripts when the values of any of the components exceed a certain threshold. When
    coupled with stress, another command-line tool, will allow you to test-stress
    your system.


    Not many distributions carry S-TUI in their repositories, but installation is
    fairly straightforward. The GitHub page describes various installation techniques.
    If your system is available, you can use `sudo apt install s-tui`. If you install
    from the Git repositories, you will have to install its dependencies — update
    and pull. You can install these python packages using your distribution''s package
    management tool.


    You can now begin monitoring your system''s performance. If you would like to
    stress-test the CPU, S-TUI supports both the stress and stress-ng utilities. Most
    distributions ship this in their


    Some Information, if that, is only available when you use the tool to run stress


    # Tutorial


    # Shashank Sharma


    Shashank is a trial lawyer in New Delhi, and has been writing about open source
    software for the past decade.


    # Resources


    +   - S-TUI

    www.github.com/amanusk/s-tui


