    ## Feature Pick the Perfect IDE


    ![](img/dc600c804c0af7973878feccd30b80b4_59_0.png)


    Vim, aka ''Improved'', is a souped-up clone of the Vi editor, the editor''s dream.
    Vim is designed for both a command-line interface and standalone in GUI. It is
    built on mark, is highly extensible and becomes an IDE courtesy of its extensible
    plug-in system, for support of programming languages and file features.


    Let''s be honest - Vim is not for the faint of hearted. It has such a vast range
    of options, and commands that most users will never discover all of them without
    trying. But if you''re ready to spend time and configure it just how you like,
    it''s very easy to use.


    - QUICK FACT

    Coding .NET on Linux


    -.NET on Linux might not have a native feel there, but there are some great tools.
    JetBrains Rider is excellent, but Visual Studio Code is also a great option. Mono
    allows development across acres of editors.


    ## Starting with Vim


    Version 8 of Vim introduced a new package feature management that makes using
    multiple plugins a lot easier, and therefore running Vim as an IDE is much simpler.
    It is recommended for a project view of files, ''ide'' for tracking file status,
    ''NEROCree'' for the first time, YouCompleteMe as a host for autocomplete, and
    much more. Tracking full package features for Vim can be hard in itself; however
    several third-party sites are available to help including vimawesome.com, with
    current issues and de-bugs.


    ```vim

    :set number

    :set relativenumber

    :set expandtab

    :set tabstop=4

    :set shiftwidth=4

    :set softindent=4

    ```


