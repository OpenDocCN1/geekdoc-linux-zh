    ## 热门推文


    > 一个不错的结尾推文...

    Edward Snowden 提醒了提醒我们，Linux 对于寻求安全操作系统的用户来说有多重要。

    *@Snowden 如果你是认真的，@QubesOS 是目前可用最好的操作系统。我正在使用，而且免费。没有人能把虚拟机隔离做得更好。*


    ## Linux 之魂


    亲爱的 L&O，多年前因为一个游戏项目接触了 Linux，但只是在一个小系统上工作，没有怎么关注它。几年前，我开始使用 Google ATAP（高级技术）工作并在
    Linux Pi 上进行原型设计，这是我生活中的一个全新章节。

    从那时起我一直在使用它，这非常迷人。我学到了很多关于自己的知识。现在我学会了构建自己的 IoT 设备/市场，Linux 是这生活中的主要一部分。我一直在许多热门的
    IoT 设备上工作，编写自定义代码并阅读数据表，编写自定义代码然后发布到 GitHub 上。

    我学到了很多，并开始欣赏 Linux 的力量和简单。我能够编写可以在从 7 美元的 ARM 板板到 300 美元的笔记本电脑的任何 CPU 上运行的 C 代码。现在我开始了一次新的
    Linux 体验，想要探索我的客户列表之外，在软件和硬件开发领域寻找新工作。


    Lawrence Bank


    作为一个追求下一代接口的人，Project Soli 特别令我着，因为它展示了一种交互。亲爱的 L&O，我不知道是否有人提到过，但我想学习如何制作我自己的。从开始一直是一段兴奋的经历。我很荣能与你们分享我关于安全的知识。再见，

    Frederick Scholl


    ![](img/dc600c804c0af7973878feccd30b80b4_9_0.png)


    Chris: 是的，我们经常收到这个请求。Frederik。随着时间的推移，构建发行版的工具很多消失了。我们也注意到 OpenStudio 和 Open Builders
    正在合并为 Open Express，并在过程中非常混乱。最流行的工具（或脚本）被重制了，那是很久以前，许多发行版团队利用了该脚本并开发了自己的工具，说明了如何获取基础、你想要的包并创建自定义
    ISO（见 p2）。希望这能开启获得你想要的自定义发行版的道路！


    # 关注我们

    Facebook: facebook.com/LinuxUser

    Twitter: @linuxuser


    ![](img/dc600c804c0af7973878feccd30b80b4_10_0.png)


    X 标记 X2


    亲爱的 Lu，我读了你们对 HP Chromebook x2 的评论。你能解释一下在英国哪里可以买到？你们的网站显示的是 www.acer.co.uk，这一定是个拼写
    Yannis Kingston（通过 Twitter）


    ## 结语

    ### 我们的告别


    Chris: 是的，我们想象在 Acer 网站上寻找 HP Chromebook 会非常徒无功……抱歉出现那个失误。那是由于使用了模板且整个过程中都没有填充。x2
    的评论对我们来说是一个机会，因为可用性很低，但我们读到的几篇都是赞美的。我们从 HP 获得了一个，但在运行评论之前，我们确认 x2 将作为 John Lewis
    的独家在英国上市。然而，这似乎还没有发生，所以 John Lewis 网站上还没有提到这款特定的 Chromebook。


    ![](img/dc600c804c0af7973878feccd30b80b4_10_1.png)


    几位作者写信是为了告别，我们找到了合适的内容来纪念它的离去。

