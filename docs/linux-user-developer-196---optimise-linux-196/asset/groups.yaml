  - '[PAGE 70]


    # Components list


    +   Raspberry Pi 3 Model B (other models can be used)

    Capacitive touch-display 7-inch (Waveshare Raspberry Pi 7 Touch Screen LCD)

    Loudspeakers (BeatsSash Mini USB PC Speaker)

    MIDI USB keyboard (AKLP PK25, 25-key ultra-portable USB MIDI keyboard controller
    for laptops)

    Wood for laser cutting (approx 3mm thick)


    # Adjustable screen


    A wooden block added inside the case to help hold up the screen in its horizontal
    position. A small beam was attached to the block to adjust the screen viewing
    angles.


    # MIDI music


    The speakers sit on plates that have hot-glued to wooden supports. The speakers
    are attached with double-sided tape.


    ![](img/dc600c804c0af7973878feccd30b80b4_70_0.png)


    ```

    > WHICH SONG DID YOU MEAN?

    > FOR ELTON

    > NOCELLTESPARCH

    > HOW SOLL ER LEBEN

    > BASATELLA CLASSICAL

    > ANNIVERSARY SONG

    > RESET

    ```


    ![](img/dc600c804c0af7973878feccd30b80b4_70_1.png)


    # Case design


    The design of the case was sketched out initially and then a trial copy of Adobe
    Illustrator was used to create the files for a laser cutter. The case was made
    from 3mm thick plywood. You can find all the files for the chassis at here: https://www.instructables.com/id/MidIdentifier


    # Tweaking touch


    The MidIdentifier uses a Raspberry Model B running Raspberry OS, which the part
    needed some config changes and rebooting to get the touchscreen working properly.


    ![](img/dc600c804c0af7973878feccd30b80b4_70_2.png)


    ![](img/dc600c804c0af7973878feccd30b80b4_70_3.png)


    ![](img/dc600c804c0af7973878feccd30b80b4_70_4.png)


    # Joining in construction


    Andreas and Karsten credit the browser-based Joinery tool, created by Clement
    Zheng, who was a great help in designing and fabricating their laser-cut assemblies.
    This clever system takes a designed de-connection between part edges and generates
    the joints that are required.


    # As long as it works...


    Compared to the neatness of the case, the MidIdentifier is all a sloppy side,
    but the pair says there wasn''t an easy way to fit everything in without some
    ''pushing, sliding, gluing and wiggling.'' The piano was inserted from the back
    and kept in place with wood.'
  - '[PAGE 71]


    # Raspberry Pi: image auto-uploader


    # # Raspberry Pi: Build an image auto-uploader


    Gain access to your images anywhere by combining the Pi Camera, Dropbox and Python
    code


    Dan Aldred


    Raspberry Pi enthusiast, teacher and coder who enjoys creating new projects and
    hacks to inspire others to start learning. Still trying to get a Kinect 360, Python
    and Pi to work together...


    # Resources


    +   - Raspberry Pi Zero W

    - https://www.raspberry.pi/products/raspberry-pi-zero-w/


    +   - Raspberry Pi Camera v2

    - https://www.raspberry.pi/products/camera-module-v2


    ![](img/dc600c804c0af7973878feccd30b80b4_71_0.png)


    The Pi Camera Module v is a small 8Mp camera board that attaches to your Raspberry
    Pi. Combine this with the new Pi Zero W - which has onboard Wi-Fi - a button and
    the official Raspberry Pi Cases to build a simple ''point-and-shoot'' camera.


    The issue is, how do access your images? You could plug a module into the Pi,
