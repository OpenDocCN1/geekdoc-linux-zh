    The results are exactly the same.


    # ## Installing to partition


    We''ll demonstrate some of the power of partitioning by installing Arch Linux
    distribution to the sdb partition. Arch is a good choice for this, easily installed
    from the command line. First, you need to download the Arch ISO, which you can
    find at https://www.archlinux.org/download. Move this file into a directory where
    you can do some work.


    ```

    # mkdir arch

    # cp /downloads/archlinux-2018.08.01-x86_64.iso .

    # iso arch

    # cd arch

    ```


    Inside this directory, create a directory called arch. Mount the ISO image to
    the fuseol tool like so:


    ```

    # fuseolib -arch archlinux-2018.08.01-x86_64.iso /arch

    ```


    The ISO is now mounted at arch. It contains a minimal Arch Linux distribution.
    It is easy to copy files within the ISO mount, and the next steps will involve
    booting up from the installation media, and next show how we do this. It''s worth
    mentioning, that it might be easier to burn the ISO to a disc before, before starting
    the installation instructions in the next section.


    Once the ISO is mounted at arch, you can copy the files you need, using airrootfs.tar,
    before unmounting the ISO.


    ```

    # cp /arch/airrootfs.sfs /mnt

    # umount /arch

    ```


    The airrootfs.sfs is compressed using the SquashFS file system. The first step
    is to decompress (it):


    ```

    # squashfs-root

    ```


    A new directory, squashfs-root, is created from the bare Arch kernel. The next
    step is to connect the '' /sys, /dev and /proc to our counterparts on our main
    system. These directories don''t contain files in the file system; they''re meant
    to be linked to hardware objects and processes. For our main system, squashfs-root
    is the location of your USB stick. If we want to be able to refer to this device
    as /dev/sdb on our main system, we''ll need to connect '' /dev on the main system
    to /dev on the line. We will all use the mount command, as in Figure 2. Lastly,
    we will use the chroot command to log on to


    Above in order to boot into the Linux system on disk, we need to connect the /magic
    directories to their counterparts on the base system


    At the moment, our squashfs-root isn''t doing anything. We''re really down to
    do something else called the partition table, which shows where each partition
    begins and end. If we want to start using the partitions for files, we need to
    format them as file systems and then ''mount'' them to anywhere.


    ```

    # mkfs.ext4 /dev/sdb

    # mkfs.fat -f32 /dev/sdb

    ```


    # ## A feature of Linux is that we can run other installations within the main
    one


    You''ll need to have a few files, but soon the file system will be present. You
    might try mounting one of partitions - that is, available to be used by the operating
    system - so you can test out the file system. You can do this using the mount
    command, like:


    ```

    # mount /dev/sdb /mnt

    # cd /mnt

    ```


    Now our partition is mounted as the /mnt directory, and we can explore it, add
    new files and so:


    +   * touch a

    * $1

    * a.file lostfound


    Don''t go over adding files, though, since we will be overwriting all the data
    in this partition. Once you''ve finished, navigate out of the /mnt directory and
    unmount the partition using ummount. There are a couple of ways to do this — use


    ```

    # umount /dev/sdb

    ```


