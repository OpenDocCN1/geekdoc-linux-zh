    # THE FUTURE OF MOORE’S LAW


    Should we start getting used to a future of processor stagnation, with no expectation
    of speed improvements? **Mike Bedford investigates**


    # AT A GLANCE


    - **Explained: What is Moore’s Law p64**

    We examine exactly what Moore''s prediction states and what it doesn''t.

    - **Transistor scaling p66**

    Why decreasing size is essential to increasing complexity.

    - **Shrinking size p66**

    We explain why the price of shrinking size has slowed.

    - **Light at the end of the tunnel p66**

    Possible solutions to the end of Moore''s Law.


    Perhaps it seems like a very long time ago that we started hearing about the impending
    ending of Moore''s Law and, in fact, a search reveals such predictions going back
    to 1997. We see later that the sentiment of these predictions didn''t necessarily
    say there would come a time when the relentless improvements in processor performance
    would come to an end. And when that comes, we''ll be faced with a realization:
    this is as good as it gets.


    But what if it''s starting to turn out sooner rather than later, because some
    industry experts predict an end? We did hope to get into the weeds of this question;
    after all, Gordon Moore, who gives name to the law, was one of its founding fathers.


    ## What is Moore''s Law?


    Moore''s Law has been mistakenly quoted to say, for example, that it predicts
    a doubling in processor performance every couple of years. While this might not
    be too far from the mark, this prediction would be an implication of Moore''s
    Law, as opposed to the substance of the law. In fact, when Gordon Moore made his
    famous statement first six years ago, he was making discrete logic devices, and
    Intel was about to launch the world''s first microchip. An article published in
    the mainstream industry magazine stated "the complexity for minimum component
    is confirmed at a rate of two years". He followed this by stating "certainly over
    the short term this rate can hold true for nothing. Over the long term, the rate
    of an increase is however uncertain, although there is no reason to believe it
    will not remain constant for at least decades. Not to fear that the cost of components
    per integrated circuit will be $65,000."


    Moore was saying that the number of transistors in mainstream chips had doubled
    every year and predicted that trend would hold true for at least a decade. He
    later updated this to doubling every two years, and that ten-year prediction has
    been extended over and over. Although they didn''t exist back in then, today it
    is reasonable to apply Moore''s Law to microprocessors. The graph (starting p66)
    shows


    ![](img/dc600c804c0af7973878feccd30b80b4_63_0.png)


    the number of transistors per device from the first microprocessor, the Intel
    4004, to the latest and greatest of a couple of years ago. We''ve concentrated
    on Intel chips, but that''s not unreasonable we''re discussing an Intel. Extending
    it to the current day is a stretch because Intel no longer quotes transistor counts.
    The graph has a logarithmic axis which means that exponential growth—that is doubling
    in a fixed period of time—the recent years shows the trend that would be expected
    if Intel doubling every two years was by Moore''s Law.


    ## The other Moore''s Laws


    Moore''s Law refers to the number of transistors that can be crammed onto a chip,
    but lots of other trends show a similar exponential, and similarly occur occasionally.


    decrease, if we only have to look at the price per transistor. The 2,300-transistor
    4004 cost $200, which is touch to under 10 cents in 1995; today''s largest chips
    have billions of transistors.


    Comparing the speed of processors is tricky, because today''s largest chips have
    billions of transistors. The first microprocessor, the Intel 4004, had a clock
    speed of 740kHz. By 1985, the feature size had dropped to 1,000nm. Somewhere between
    a third and a width of a human hair, this was quite considered an achievement
    at the time. If it appears positively to have stayed by standards,

    Since, then feature size have tumbled, dropping to 1,000nm by 1985, and they,
    more, reduced ever since.

