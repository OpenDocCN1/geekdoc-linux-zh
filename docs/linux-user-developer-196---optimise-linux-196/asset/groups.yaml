  mdcn: "\n## pyinstaller --version\n\n安装了 Pyinstaller 后，你可以非常省力地使用它——对于小型项目，假设你的项目包含在一个\
    \ Python 脚本中，且共享只需要几行代码。在这种情况下，你只需切换到脚本所在的目录并运行以下命令：\n\n```bash\npyinstaller myscript.py\
    \ own\n```\n\n这会创建一个名为 `myscript` 的子目录，并将你脚本的所有依赖项放在其中。这包括你用于运行它时使用的 Python 引擎。你的程序是一个名为\
    \ `myscript` 的可执行文件，只需选取整个文件夹并发送给他人，即可启动你的代码。他们只需要运行该可执行文件即可。\n\n这种方法的一个缺点（至少对于开发阶段而言）是\
    \ Pyinstaller 认为你需要的所有内容都在同一个位置。你可以直接通过这个分发验证所有内容。如果 Pyinstaller 犯了错误，你可以很容易地发现这些错误并在发布前纠正它们。一旦一切都正确，你可以使用不同的选项来创建一个包含所有内容的包，如下命令所示：\n\
    \n```bash\npyinstaller --one-file myscript.py own\n```\n\n这个单文件可以发送给你的用户。对他们来说，这是一种更舒适的体验，因此你可能更喜欢使用这种方法。当他们运行这个可执行文件时，它会解压到一个临时目录，然后运行执行文件，就像文件夹方法一样。完成后，它会自行清理并删除需要手动清理的临时文件和目录。这不是一个特别严重的问题，而是你应该注意的一个潜在问题。\n\
    \n如果你的 Python 代码中没有其他内容，那么到这里就结束了。但对于许多程序，你会有额外的数据或文件需要包含在生成的包中。例如，假设你有一个包含用户信息的\
    \ readme。在这种情况下，你可以通过以下方式包含它们：\n\n```bash\npyinstaller --add-data \"src/README.txt;\"\
    \ myscript.py own\n```\n\n`--add-data` 选项的格式为 `SOURCE:DESTINATION`。在上面的示例中，我们从\
