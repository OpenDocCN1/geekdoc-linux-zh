    ## Advanced specialised deployments


    ### Highly specialised Linux distributions created for very particular tasks


    Linux''s malleable nature is often exploited to create barebones platforms that
    are singular. This might be running routers (OpenWrt), firewalls (IPFire) or gateway
    servers (pfSense).


    The SSSS runs as a Live system by default, but it can also be installed on a hard
    disk. Once the distribution is up and running you can simply enable the servers
    with a quick start-up of the Apache web server. The distribution allows you to
    run the servers with minimal memory utilization. The SSSS is the perfect backup
    when the main server running on a network goes down. The SSSS runs on 32-bit systems
    in just over 100MB. It''s based on the 4M Linux distribution which in itself is
    a distribution that provides a fully functional LAMP stack with the usual development
    tools.


    ## Quick servers


    One interesting distribution is the SSSS (Small Server Suite; https://thesislinux.com),
    which helps you deploy a Linux server with ease and speed. The distribution includes
    popular packages over a minimal Linux base to roll fully wedged and serve your
    many local network needs. For instance, you can just deploy a FTP server to connect
    several servers in an instant, or up a temporary proxy server to help take off
    some load from the network or provide information via the included web server.
    By bypassing the deployment of these essential servers, the SSSS opens the doors
    to bits of possibilities.


    ## A storage pool


    A simple backup server is sometimes not enough; if you want to protect your data
    you need a Network Attached Storage device. While off-the-shelf NAS devices cost
    several hundred dollars, the Debian-based Open Media Vault (OMV; www.openmediavault.org)
    provides you with a free alternative.


    ![](img/dc600c804c0af7973878feccd30b80b4_27_0.png)


    > EXPERT TIP RAID levels: OMV supports multiple RAID levels and each requires
    a different number of disks. The default RAID 5 requires at least five disks,
    while RAID 1 only needs two.


    another NAS server of your for free. The distro offers the power of commercial
    solutions in a package that''s easy to set up and manage. OMV doesn''t really
    need a powerful host; in fact, the project makes an image of the distribution
    for Raspberry Pi. Using the Pi is a wonderful use of the little device itself.


    Before installing, plug in your storage device. If you are using the Pi you can
    use self-USB disks. Once OMV is up and running, you can configure and manage the
    server using its intuitive browser-based admin interface.


    > QUICK GUIDE Deploy OMV: Setting up OMV is straightforward. You''ll have to run
    through a quick installation if you are deploying OMV on a PC, but you can also
    do it by simply transferring the image to the Raspberry Pi. Using OMV''s web-based
    interface and run through the setup process. Next head to get to how to make OMV
    aware of the connected disks. You can then tie them into an array or if you plan
    to use them individually. Before you store data on the NAS device, you must have
    one or more disks. The network will allow access to the shared folders on the
    storage disks.


    Above the SSSS can be configured via a web-based interface. In addition to all
    these the 4M Linux distribution includes several useful maintenance RAID created.
    Finally, raid enabled, a service that users on the network will not access to
    the shared folders on the NAS.


