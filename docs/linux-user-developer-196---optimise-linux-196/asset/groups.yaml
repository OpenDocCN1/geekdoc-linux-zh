    被誉为 Slack 的开源替代方案


    ![](img/dc600c804c0af7973878feccd30b80b4_89_1.png)


    感谢你请求推荐可以在自己的云服务器上托管的 Slack 开源替代方案，这里推荐了 Mattermost。Mattermost 拥有一系列实用功能帮助组织在线对话。它不仅提供通用频道（如持久和私有聊天室），而且比其他工具更进一步，例如支持在线程中回复消息，这是它最高效的功能之一。


    它还支持多种内置和可自定义的可执行命令，类似于 IRC。Mattermost 允许用户编辑和删除消息，创建私有房间并进行一对一对话。用户可以在消息中添加表情符号，可以行内查看并下载。


    开发者会喜欢 Mattermost 正确的标记语言和文档齐全的格式选项。它支持编程语言和其他代码主题的语法高亮。


