    # 访谈


    ## 项目：精简与高效


    KDE 是一个巨大的项目，今年 10 月将庆祝成立 22 周年。我们与 Nate Graham 探讨了 KDE 的漏洞修复攻势。


    ![](img/dc600c804c0af7973878feccd30b80b4_11_0.png)


    KDE 开发者 Nate Graham 领导着 KDE 的易用性和生产力计划，这是我们在 2017 年达成的主要目标之一。


    Nate Graham 本地人，前 Apple 工程师，是 KDE 开发者，也是 Kubuntu 的产品经理。


    “所以我环顾了一段时间，然后发现一个让我觉得看到了 Apple 正在做的项目。我也发现了一些我喜欢的项目，但我最终选择了 KDE，不是因为我觉得它们真的像
    Apple 那样是一个社区，而是因为我觉得它是对我最友好的一个——也是我们遇到过的最友好的。”


    “这个目标的核心是——我们想让 KDE Plasma 和我们的 KDE 应用程序更易用、更平易 way、更强大的生产力工具，”Nate Graham 在我家的沙发上通过
    VOIP 与我聊天时说道，反馈（特别是最近的 Plasma 点发布）是非常积极的。此外，我们想让复杂的工作流对任何人都变得更简单。我们希望我们的软件成为一台精简、高效的生产力机器，”Nate
    Graham 说。点击此处阅读更多。


    ### 聊聊你为 KDE 做了什么……


    我编写文档来帮助人们参与项目。我负责漏洞跟踪，以便我们的漏洞跟踪系统保持活跃。我指导新贡献者以帮助他们加入；我自己也会提交补丁列表，其他人也帮助过我。我负责界面设计、易用性和视觉工作。我深度参与了这个过程，并与
    KDE 的其他成员接触，这是最有成就感的部分，因为我可以从他们那里学习，我也希望他们能从我这里学习。


    ### 我奇你是如何从 Apple 工作转来到 KDE 的？


    这是一段奇特的旅程。在 Apple 工作是我的童年梦想之一。我一直喜欢 Apple 产品。


    ![](img/dc600c804c0af7973878feccd30b80b4_11_1.png)


    上方是 Ubuntu 18.04 为 Plasma 设计的新主题，带有 KDE 应用程序的浅色主题，非常受欢迎。


    ### 你去年在易用性和生产力目标上的工作。我们已经提到过一点，但你能多告诉我们关于这个计划吗？


    当我开始时，我设定了一个两年的时间表。我想实现它。“我需要每年完成 10 年的改进。在 3 年内完成 20 年的改进。但我认为我们可以做到，而且这个计划的激励帮助我们吸引了更多想要的人，这非常有成就感——因为许多新贡献者意味着更多的帮助，变化速度也更快。这让每个人都兴奋，并形成了一个良性循环。


    ### 这在质量测试方面有什么变化吗？你们如何测试应用程序和框架？


    我们进行测试的方式我觉得对各处都有帮助，因为这似乎是一个普遍问题，因为它是软件开发中最稀缺的特征之一——对它的控制。而且我们所有的软件都有发布计划——我们的发布计划非常激进：每年发布三个版本的
    Plasma。我们每年发布三个版本的 Plasma。我们每年发布我们所有的应用程序。


    ## Kubuntu 和 KDE：它们有什么区别？


    ![](img/dc600c804c0af7973878feccd30b80b4_12_0.png)


    “如果你只需要 KDE 软件，不在乎其他任何东西，请使用 KDE Neon。如果你想让你的发行版获得更新，那么 Arch 或 Tumbleweed 这样的纯发行版是最佳选择。如果你想要稳定、经过良好测试的版本（包括
    KDE 软件），并且兼顾集成性和默认设置，那么就是 Kubuntu。”


    Kubuntu 让想要使用通用 KDE 桌面发行版的管理器可以使用 Kubuntu：


    上方是 Graham Hahn，“Neon 并不是被看作是发爱好者的 KDE 软件展示，而不是一个通用的操作系统。”


    “Neon 的目标和理由是在滚动更新发行版之上提供一套非发布版本的 KDE，它比 Kubuntu 更侧重于集成。所以如果你想……”


    Graham Hahn：“基于 KDE 的发行版是 KDE Neon。我发现开发者平台（那种每隔几天就从 Git 分支构建一次的超滚动构建版本）如果你总是想要最新、最强大的功能，”


    “我们发布支持所有这些内容的框架的新版本——每年 12 次。通常，这没有留下足够的测试时间。对于框架，如果发生故障或出现回归问题，我们可以在下个月直接修复。但对于所有其他组件，我们必须维护发布计划，这意味着对于测试人员和测试来说是非常极端的。我们遇到的问题之一是寻找人们测试我们软件的
