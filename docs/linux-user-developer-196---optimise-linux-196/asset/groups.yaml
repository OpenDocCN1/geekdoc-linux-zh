    \ p62*\n  最新的版本控制工具为开发过程带来了可视化支持，并包含一些额外的超级能力。\n\n虽然 Linux 在普通消费者中的采用率正在增长，但它仍然是技术型用户群体的热门选择：该平台的可能会属性可能会让普通用户望而却步，但其极的可定制性和为开发者提供的卓越性能水平抵消了这一点。\n\
    \n在操作系统上进行软件开发是在集成开发环境（IDE）中进行的。IDE 之所以命名，因为它通常将软件开发功能——如代码编辑器（独立）、构建工具和调试器以及内置的版本控制——整合在一起。GUI\
    \ 设计、面向对象的工具以及开发编译可以使开发过程更加快速。\n\n在选择 IDE 时，选择通常由编程语言驱动。大多数 IDE 选择关注一种特定语言，这在过去是传统方法，但最近\
    \ IDE 已转向支持多种语言，这通常由社区创建的插件提供。这种趋势源于文本编辑器日益增长的普及，它们已成长为功能更丰富的 IDE；包括 Visual Studio\
    \ Code、Atom，Bash 的地位与基础编辑器大致相当。最广泛使用的 IDE 是高价产品，包括非常受欢迎的 JetBrains 件，但有很多是免费的。\n\
    \n在为 Linux 本身开发时，某些 IDE 会针对特定环境。GNOME Builder 是专门为 GNOME 桌面环境定制的。它支持 Dev-get、Git\
