    do have to ensure that the partition is equal to larger than the source, as it
    can''t restore to smaller disks.


    Deploying an image is a simple process. Ensure that the target computer is registered
    with the FOG server and has a cloned image associated with it, then all you need
    is to create a deployment using the web interface.


    # Overall


    # Overall


    An-off tool for bare-metal cloning that works as advertised. It is well documented
    and can be used efficiently clone single or multiple computers with relative ease.


    Apart from the minor inconvenience of installing it before you can use it to clone
    computers, FOG trumps its competition on all other fronts. Its web front end make
    light work of the entire process.'
