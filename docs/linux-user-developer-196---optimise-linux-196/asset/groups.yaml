    在过去的19年里，我们借此机会感谢你们一直阅读并成为开源和自由软件世界的一部分。这段旅程始于 1999 年，经历了起伏。我们记得 LUBD 的最初出版者 Meer，记得作为庞大社区成员的感觉是理所当然的。如果你是一个发行版的粉丝，或者你正在考虑编写代码，那么告诉我们它是如何运作的。你可以改变周围的世界。这种感觉太棒了！


