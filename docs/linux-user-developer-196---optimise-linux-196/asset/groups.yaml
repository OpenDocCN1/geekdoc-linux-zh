  - '[PAGE 34]


    # Thomas underscoring the value of murder accountability at the Investigative
    Reporters and Editors (IRE) annual conference


    ![](img/dc600c804c0af7973878feccd30b80b4_34_0.png)


    source is incredibly important to us that there''s still much more work to be
    done. The murder resolution rate has been declining and we believe that by encouraging
    people to come to our site and download the workbooks, raw data and data dictionaries
    they can call us with questions and suggestions. This is the entire principle
    that drives the open source community and can help us save lives.


    The records are assembled and put into multiple formats so they can be downloaded
    on demand. This is the data that is loaded into Tableau to showcase the information
    in a visual format - age, method, location, type of murder and more - and allows
    for quick clusters for detectives who with limited time and plenty of information,
    Tableau helps us test a theory or determine if their type of crime has occurred
    across jurisdictions.


    > Visitors to turn their eye into unlocking patterns can use a free copy of Tableau


    The data collected by MAP from the FBI is decidedly underfunded. Written in Colorado,
    it comes with odds and complexities that have an impact on our analysis, but this
    is the language that common when the FBI started the assembly.


    Over the past year we have added further refinement to the system, where we now
    visually show clusters identified by the algorithm we''ve developed, and there''s
    a kind of magic to carefully counting things and uncovering answers. Our algorithm
    counts through the three-quarters of a million records that have an elevated probability
    of being serial murders and puts them on this map which reveals potential murder.


    To resolve the challenges of shifting the data from complex to accessible, MAP
    has used sophisticated scripts to take these and assemble them into the PSPP files.
    This can be split into CSV files where Hargrove, may not be as easy to read but
    is a lingua franca for every statistical package one can


    So the system works - and now the team is overwhelmed with cases. Cases that need
