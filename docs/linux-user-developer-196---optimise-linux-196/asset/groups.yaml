    然而，当他在2004年发现这些数据时，他花了整六年的时间说服编辑允许进行测试。他知道大学提供的信息可以被用来完善和解决案件；在获得充分的支持后，他需要一些时间。他在2015年启动了一个名为“悬案之谜”的项目。


    该项目获得了奖励，并获得了足够的资金让他推向新水平。密苏里大学的一位才华横溢的莎拉·卢卡斯（Sarah Lucas）加入了这一项目。哈格罗夫（Hargrove）说：“我们发现了一些不起作用的东西。”我们测试了案件率升高是否会预示着连环杀手的存在。我们能够解决案件并交付结果。我们测试了特定案件类型（如勒息）是否存在极高的破案率，这确实如此。


    ![](img/dc600c804caf7973878feccd308b4_32_0.png)


    ## 焦点

    迟迟的发现


    1974年，阿特拉斯（Atlas）在斯坦福大学被谋杀。她的案件直到现在还没有被解决。在她去世多年后，圣克拉拉警长（Santa Clara Sheriff）在一次采访中透露，由于案件问责项目（Murder
    Accountability Project）的工作，重新开启了这起悬案。阿特拉斯可能是连环杀手之一，但我们并没有证据。


    哈格罗夫说：“DNA检测发现该嫌疑人是1974年谋杀案的嫌疑人，但他们没有再次查看他。”这激发了兴趣。他可能杀杀了其他人，我们进入了数据系统，圣克拉拉警长发现他们以类似的方式死亡。


    数据显示，案件数量在1971年之后突然停止。那时，该嫌疑人在科罗拉多州因偷车被捕。在他搬到佛罗里达州后，这些案件就此结束。哈格罗夫说：“这些事情突然停止的原因是他搬走了。”现在，此人正在接受进一步调查，以查看是否还有其他连环杀手被发现。


    ## 平台允许可视化

    平台允许将无穷无尽的暴力死亡案件列表转化为一个突出模式和趋势的视觉化工具。我们尝试过地点列表，但这只会说明谁是罪犯。哈格罗夫，加里·哈格罗夫（Gary Hargrove）是案件问责项目最活跃的人物之一。在美国，有48人死于命杀。


    我们知道西雅图有一个连环杀手，我们想是否可以创建一个显示这种模式的程序。哈格罗夫说：“我们有不同的方法来看待。我们尝试过未破案率，但这并不起作用。我们发现了聚类分析。”


    这就像一个梦击中了他。当我们关注到连环杀手活跃的区域时，西雅图有一个巨大的气泡。在哈格罗夫之后，算法检测到了他。


    该算法现在能够发现每个国家的几十个聚类，这些死亡案件的模式可能表明连环杀手正在作案。有些地方没有。


    受害者地点和杀害方法最终发挥了作用。使用了数据，但该指标随后被丢弃了，因为它对结果的影响微乎其微。案件根据人口统计数据和时间在这个结构中，创建了超过10,000个小组。


    我们告诉他计算每个小组案件的解决频率，并提醒我们任何低解决率的案件聚类。哈格罗夫说：“这起作用了。”


    ## 算法背后的技术


    “我们使用了多种解决方案来创建MAP，”哈格罗夫说，“我们有一个名为 Tableau（www.tableau.com）的专利软件，它使我们能够在网站上视觉化显示数据，但我们……”


    ## 特色案件问责项目


    ![](img/dc600c804caf7973878feccd308b4_33_0.png)


    ## 焦点

    逍遥法


    ![](img/dc600c804caf7973878feccd308b4_33_1.png)


    上方案件问责项目的托马斯·哈格罗夫（Thomas Hargrove）讨论数据对案件解决的影响


    上方是大图，大局观：美国的命杀案正在上升


    致力于确保所有数据工具都是开源且可访问的，我们提供了原始数据供其在任何他们平台上使用。


    愿景让我们能够使用MAP创建的Tableau免费版本并操作数据，从而识别模式并可能拯救生命。它让任何拥有技术和数据的人都能使用MAP相同的系统。


    该非营利组织的团队现在扩展到包括副主席、财务和董事会成员，他们使用Tableau为他们提供处理网络大型数据集所需的一切。


    哈格罗夫说：“我们确保基础平台以及我们在平台上构建的所有内容都是专利所有的。我们正在让命杀数据对世界更易于获取，这将很好地鼓励公众。我们的目标受众当然是命杀侦探，我们想要一个能够让他们做到的系统。”


    ## 开源


    破案率处于历史最低水平为什么重要？命杀案未破为什么重要？命杀案件问责项目有答案。该非营利组织最近的研究显示了破案率下降的后果。


    “我们查看了在最近五年内每年命杀案超过10起的每个警察局，”哈格罗夫说。


    “结果发现破案率低于平均水平的司法管辖区数量是高于平均水平的倍倍。”


    更令人担忧的是，FBI的命杀破案率在2016年下降了59%，这低于全美的记录水平。


    “命杀破案率出现这种广泛趋势的原因，”哈格罗夫总结道，“简单来说，那些抓不住杀手的部门和城市今天杀死我们公民的可能性是其他的两倍。”

