    # 优化 Linux


    ## 优化 Linux


    ![](img/dc600c804c0af7973878feccd30b80b4_17_0.png)


    利用 Linux 闻名遐的灵活性对其进行精简，使其为从旧电脑到 IoT 设备的一切设备提供动力——Mayank Sharma 将为你解释如何实现。


    ## 概览


    - 轻量级发行版 p20：让你那台可靠的老旧伙力再次重用所需的全部内容。

    - 深度利用树莓派 p26：在这个受欢迎的“小钢兽”中充分利用其硬件升级。

    - 提升性能 p22：从你的日常桌面电脑中榨取每一分性能。

    - 构建 IoT 设备 p28：使用树莓派将家电器转变为支持物联网的智能设备。

    - 自定义极简发行版 p24：抛弃现成的解决方案，通过它们打造你自己的 Linux。

    - 特色化发行版 p29：为单一任务设计的经过调优的发行版。


    在默认情况下，典型的 Linux 桌面发行版是一台运行良好的机器。从内核开始，组装流水线每个每个阶段的开发者都投入了精力，以确保不同的软件部分能够充分利用可用硬件。但主流发行版必须吸引广泛的受众并兼容各种硬件。这种方法意味着大多数发行版并没有针对你的特定硬件进行优化。这为特定应用程序、设备和用例的优化留下了大量空间。这种特性也是如此精细，以至于在接下来的几页中，我们将帮助你发现你是否想运行你自己的老伙计，或者是你的支持
    IoT 的智能家居。


    Linux 发行版的完美应用是复活那些在阁楼里被荒废的老旧硬件。硬件的发展速度


    > 也许 Linux 发行版广为人知的应用是复活那些在阁楼里被荒废的老旧硬件


    结合现代对资源密集型应用的贪婪需求，使得硬件一一下架就变得过时。易于使用的发行版为大量用户赋予了生命。在对初学者友好的发行版中，例如 Chromebook，以及像树莓派这样的家用设备，也是如此。ChromeOS
    在这些任务中表现良好，响应迅速且能满足需求。但它并没有充分发挥新款、更强大的 Chromebook 的价值。我们将帮助你找到那些发行版，让你能够压榨 Chromebook
    的每一比特性能，提供类似于传统笔记本电脑的体验。


    Chromebook 兴起的原因之一是网络。谷歌供应商可以提供带有足够资源的设备来运行高性能。如果你手里正握着这些性能过剩的笔记本电脑之一，我们将帮助你将它们转变为活跃状态，尽管这些是硬件受限的环境。另一类并非为日常设计的设备是基于
    ARM 的设备，它是一台完美的教育计算机，当然，它的作用远不止于此。有些发行版可以将这个小设备变成一个优化的服务器，或帮助你构建智能 IoT 设备，我们将查看其中一些。


    ## 优化 Linux


    ### 轻量级发行版


    不忍心丢弃你那台可靠的老伙计吗？这里有让它再次点缀你桌面的全部内容


    ![](img/dc600c804c0af7973878feccd30b80b4_19_0.png)


    Left Bodhi 的默认安装没有许多应用程序，你必须通过 Bodhi 基于浏览器的 Appcenter 获取你需要的程序


    ![](img/dc600c804c0af7973878feccd30b80b4_19_1.png)


    树莓派桌面可以从带有持久模式的 USB 磁盘上运行。


    树莓派于 2016 年进入 PC 领域。其意图是让用户能够在廉价的电脑上体验他们新发现的环境。树莓派桌面版需求不高，使得该发行版成为性能不足电脑的理想选择。使用
    Debian 基础的积极影响是，由于软件支持，你在桌面上可以使用大量的软件包。桌面版本包含了你在树莓派版本上找到的所有内容。此外，


    世界上仍有人在使用 FreeBSD 或 Ubuntu，这些系统在 世纪 90 年代后被采用。Maciej W. Rozycki 是少数坚持这一点的人之一；他是
    Linux 内核持续支持这些老技术的原因之一。当我们能够负担支持旧硬件而不破产的奢侈时，但大多数发行版和其他开源项目并不能。


    许多开源开发者正努力让过时硬件可用，这并不意外。


    忘记旧硬件吧；现在大多数人认为支持 32 位架构不再值得了。从 Solus 到 Ubuntu 的许多新项目已经放弃了 32 位平台。像 Arch Linux
    和 Ubuntu 这样的现有项目不再支持 32 位系统。


    即使硬件是单核或双核 AMD/Intel Pentium，配有几 GB 内存，过去的发行版在这些机器上的表现可能不佳，但是


    尽管这些机器已经下架了一段时间，但它们在全球范围内依然可见。坦率地说，你仍然可以让这些旧机器发挥用处——它是


    Tiny Core (http://tinycore.linux) 现在是旧电脑动力的最佳选择之一。其原始开发者 Robert Sheringledek 一直参与于这个受欢迎且活跃的
    Small Linux 项目。该发行版提供三种版本：Main Core、Claws 和 Plus。


    '
