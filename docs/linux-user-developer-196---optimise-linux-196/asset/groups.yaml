    \ way to parse keywords to insert all the words from the title when the video\
    \ is uploaded\n\n![](img/dc600c804c0af7973878feccd30b80b4_54_0.png)\n"
  mdcn: "\n前几行处理将视频文件保存到文件系统。我们也可以删除随后的行，这些行会将视频标题保存到 `videodata.txt` 文件中。相反，我们想将视频保存到数据库。我们已经创建了一个函数来实现此功能，所以我们可以写：\n\
    \n> 我们需要修改服务器的行为，使其使用新数据库，而不是基于文件系统的设置\n\n```go\nerr = saveVideoToDatabase(video)\n\
    return err\n```\n\n最后一个需要修改的函数应该是 `getAvailableVideos`。之前我们通过在 videos 文件夹中搜索来实现这个函数，从数据库获取它们会更健壮。因此，我们现在完全重写它。\n\
    \n我们希望能够通过键搜索视频：每个视频将有多个关联键，并且我们能够搜索它们并展示所有视频的列表。首先，我们需要使用 `Query` 创建一个返回数据库中所有行的\
    \ SQL 语句：\n\n## 关键词搜索\n\n```go\nrows, err = videodata.Query(\"SELECT * FROM Videos\"\
    )\n```\n\n第一步是在 lutube 中创建一个新表，使用 MariaDB 运行图 4 所示命令来创建表。处理错误。此查询将返回 Videos 表中的所有\
    \ ID。`AvailableVideos` 应该返回 `Video` 指针切片，作为该函数的实现：\n\n此表将为每个视频有一个行。具体来说，每个视频在表中会有对应的行，每个键会发生多次。ID\
    \ 字段是用于标识 Videos 表中某个视频的计数器。\n\n```go\navailableVideos = make([]*Video, 0)\n```\n\
    \n我们可以通过我们的接口为视频添加任何搜索功能。现在，我们将使用 `for` 循环遍历 `rows`。对于每次迭代，我们创建一个新的 `Video` 对象并将行赋值给字段，将行添加到列表中：\n\
    \n```go\nfor rows.Next() {\n  var video Video\n  err = rows.Scan(&video.ID, &video.Title)\n\
    \  availableVideos = append(availableVideos, &video)\n}\n```\n\n```sql\nINSERT\
    \ INTO Keys (Word, VideoID)\nVALUES\n ('Elephant', 'zoo')\n ('Flamingo', 'zoo')\n\
    \ ('Carousel', '318752')\n```\n\n最后，返回视频的新列表：\n\n```go\nreturn availableVideos,\
    \ nil\n```\n\n使用 `go build lutube.go` 重新编译代码。如果你已经完成了一切，你应该得到一个错误，提示你需要从 `videos.go`\
    \ 导入 `ioutil`。我们导入它并返回程序：\n\nSELECT * FROM Keys\n\n我们现在开始实现该函数。编写将接收这些内容的函数 (videos.go)。\n\
    \n运行 /lutube。然后在浏览器中打开 http://localhost:8080 并检查我们是否仍然能够上传视频，以及刷新页面时上传的视频是否出现。如果一切正常，我们可以继续下一步。否则，检查你的工作以及你引入的任何错误处理代码。\n\
    \n![](img/dc60c804c0af7973878feccd30b80b4_52_0.png)\n\n```sql\nCREATE TABLE Keys\
    \ (\nID int PRIMARY KEY NOT NULL AUTO_INCREMENT,\nWord varchar(208),\nVideoID\
    \ varchar(108),\nFOREIGN KEY (ID) REFERENCES Videos (ID)\n);\n```\n\n上述 `FOREIGN\
    \ KEY` 约束是一个非常有用的安全检查，确保 VideoID 列只包含有效的 ID，这样我们就不会出错。\n\n# 教程编程：Go\n\n# 图 5\n\
    \n```sql\nSELECT *,\n(SELECT COUNT(ID) FROM Keywords\nWHERE VideoId = Videos.Id\n\
    AND Word NOT IN ('elephant', 'flamingos', 'carousel'))\nAS Matches\nFROM Videos;\n\
    ```\n\n上述我们可以为表添加从现有列构建的额外列，如这里显示的 `Matches` 列将关键词列表转换为结果。该函数将接收一个关键词列表并返回一个 `Video`\
    \ 指针切片：\n\n```go\nfunc getMatchingVideos(keywords []string) ([]*Video, error)\
    \ {\n  // ...\n}\n```\n\n它需要的第一个是创建一个切片来存放视频：\n\n```go\nvideos := make([]*Video,\
    \ 0)\n```\n\n接下来，它构建将获取搜索结果的 SQL 查询。稍微复杂的是关键词的数量是变化的，因此我们需要添加一些代码来处理查询中数量数量问号；示例见下一页的主图（100\
    \ 到 107）。在这种情况下，如下：\n\n# 图 6\n\n| ID | Title | Matches |\n|---|---|---|\n| 38618752\
    \ | Carousel | |\n| 38996965 | Richard at the beach | |\n| zoo | Trip to the zoo\
    \ | 2 |\n\n上述来自图 5 中的语句。如果我们想根据匹配数量对行进行排序，我们使用 `ORDER BY`。如果我们使用反引号而不是引号来跨行分割字符串，我们需要使用\
    \ \"strings\" 库来重复。重复，我们从第二个到最后一个每个关键词都重复，使用一个类似 `?,?,?` 的切片。\n\n我们需要做一件事是使用类型转换将我们的字符串转换为\
    \ `interface` 列表；`Query` 函数期望这种类型的参数：\n\n```go\ninterfaceVideos := make([]interface{},\
    \ len(keywords))\nfor i := range keywords {\n  interfaceVideos[i] = keywords[i]\n\
    }\n```\n\n现在我们可以调用 `Query` 获取匹配项的对应表的结果：因为 `Query` 接收可变数量的参数，然而我们使用了关键词。上述图 7\
    \ 解释了如何处理 `videos` 的切片。\n\n```html\n<form id=\"search\" action=\"/search/\">\n\
    \  <input type=\"text\" name=\"search\">\n  <input type=\"submit\" value=\"Search\"\
    \ />\n</form>\n```\n\n我们可以通过键搜索视频的功能，最简单的方式：\n\n```go\nkeywords := strings.Split(r.FormValue(\"\
    search\"), \",\")\n```\n\n首先，我们需要使用 `Query` 创建一个返回数据库中所有行的 SQL 语句：\n\n```go\n\
    rows, err = videodata.Query(\"SELECT * FROM Videos\")\n```\n\n第一步是在 lutube 中创建一个新表，使用\
    \ MariaDB 运行图 4 所示命令来创建表。处理错误。此查询将返回 Videos 表中的所有 ID。`AvailableVideos` 应该返回 `Video`\
    \ 指针切片，作为该函数的实现：\n\n此表将为每个视频有一个行。具体来说，每个视频在表中会有对应的行，每个键会发生多次。ID 字段是用于标识 Videos\
