    # 树莓派 .Net Core 教程


    这是 Orchard 内容管理系统的设置界面。只需通过几次输入和选择，你就可以在树莓派上托管一个 CMS。


    ![](img/dc600c804c0af7973878feccd30b80b4_79_0.png)


    下载 Orchard Core 项目，恢复基于 NuGet 的依赖并构建源码项目。


    - git clone https://github.com/OrchardCMS/OrchardCore.git

    - cd OrchardCore/

    - dotnet build


    在从环境中成功构建 Orchard Core 后，你可以轻松导航到 `OrchardCore.Cms` web 子目录，并使用 `dotnet run` 运行主程序。


    - cd src/OrchardCore.Cms.Web/

    - dotnet run


    当页面在 5000 端口出现后，你可以创建一个新站点，应用内置模板之一并开始构建你的应用程序驱动程序。


    随后，Orchard Core 将成功从 Linux 环境中运行。然后你可以使用示例中提供的命令将 arm 架构的二进制文件复制到树莓派环境。以下命令将使用
    `dotnet publish` 命令分发到平台。


    在你的树莓派上，可能需要花费一段时间才能完成多步骤的 .NET Core 进程。这恰恰凸显了在桌面或服务器环境中构建 Web 应用、发布二进制文件并通过安全复制（scp）传输自包含应用程序的优势。这对于非复杂的应用特别有益，例如我们接下来查看的
    Orchard CMS 示例所示的那样。


    ```bash

    cd src/OrchardCore.Cms.Web

    dotnet publish -r linux-arm --scp /home/key/OrchardCore/bin/Release/net6.0/linux-arm/
    @raspberrypi:/home/pi/

    ```


    当控制台打印出输出后，你将获得确认，此时打开浏览器访问 http://raspberrypi:5000


    Hosting: Production

    Root content path: /home/pi/HelloRazorPages

    Now listening on: http://localhost:5000

    Application started. Press Ctrl+C to stop


    与之前，首先 SSH 登录树莓派环境。这是 Orchard Core 的完整设置步骤，包括任何额外的数据库配置或使 Orchard Core 配合 dotnet
    build 工作的内容。如果配置完成，你就可以准备好使用确切指定的指定的名称 `OrchardCore.Cms.Web` 从 Orchard Core 中创建一个站点。一旦服务器运行，你就可以进入
    Orchard Core 控制台并创建一个新站点。


    # 使用 .NET Core 和 Pi 的开源 CMS


    ```bash

    ssh -i pi raspberrypi

    cd OrchardCore/

    dotnet build OrchardCore.Cms.Web

    ```


    之前的示例演示了使用 .NET SDK 通过 MVC 和 Razor 框架创建、构建/或脚手架代码的技术。通过这些示例，你可以轻松地对使用 .NET Core
    和 .NET Runtime 构建树莓派应用之间的子集差异产生印象。


    执行后，使用 浏览器访问 http://raspberrypi:5000 来启动 Orchard Core（初始设置过程）。

    从本文中获得的关键要点包括自包含应用程序的优势，以及帮助提高 Web 应用性能的非官方 dotnet 命令。通过最后一个示例，你现在已经掌握了在树莓派上启动
    .NET Core 的知识。


    在接下来的部分，我们将简要介绍 Orchard Core，这是一个 100% 基于 .NET 技术的系统。最近，Orchard Core 进行了重构，以利用新的
    .NET Core 编程模型，这是一种更现代的方法，具有开箱即用的现实可能性和更多的内容管理功能。


    Orchard Core 是一个使用 BSD 许可证的开源项目，由微软之外社区社区维护。它包含一个针对模块的可扩展模型和一个动态内容类型系统，该系统大量使用了
    DI（依赖注入），支持自定义、本地化等。以下命令将克隆 GitHub 开源


    # 评测


    81 组测试 | 86 硬件 | 88 发行 | 90 免费软件


    ![](img/dc600c804c0af7973878feccd30b80b4_80_0.png)


    ## 组测试


    ## 磁盘克隆工具


    管理计算机克隆是一个复杂的过程，因此这里有最好的工具可以帮助轻松映像和部署机器。


    ### Clonezilla


    Clonezilla 是最老的磁盘映像和克隆工具之一，提供多个版本。它支持多种文件系统，包括 Linux、Windows 和 macOS 的许多流行文件系统。它用
    Perl 编写，并在 GPL v2 下发布。

    https://clonezilla.org


    ### FOG Project


    一个用于磁盘镜像的免费工具，与这里的其他选项不同，它使用基于 PHP 的 Web 界面，你可以通过网络从任何计算机访问。它支持克隆，并使用 FOG 管理网络上的安装和外设。

    https://fogproject.org


    ### G4L


    G4L - GhostLinux 执行磁盘映像和克隆，但不是 Symac Ghost 的直接替代品，它仅适用于 Linux。与这里的大多数其他选项不同，G4L
    作为独立工具提供，并提供映像多种类型文件系统的各种选项。

    http://bit.ly/lud_g4l


    ### Redo Backup


    Redo Backup 是易用的裸机克隆和恢复工具之一。这个小型可启动 Live 发行版跨 Linux 和 Windows 文件系统工作，尽管有时如此但它可以完美运行而没有意外错误。

    http://redoback.com


    ## 评测


    ## 磁盘克隆工具


    ## Clonezilla


    ## FOG Project


    一个用于磁盘镜像的免费工具，与这里的其他选项不同，它使用基于 PHP 的 Web 界面，你可以通过网络从任何计算机访问。它支持克隆，并使用 FOG 管理网络上的安装和外设。


    ![](img/dc600c804c0af7973878feccd30b80b4_80_0.png)


