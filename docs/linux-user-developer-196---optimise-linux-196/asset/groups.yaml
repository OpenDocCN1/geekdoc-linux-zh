- md: "\n# Tutorial\n\n# Raspberry Pi with .NET Core\n\ndownload and cache (to disk)\
    \ the NuGet-based project dependencies specified in the main project. File template\
    \ now includes installations of a development centre, which is a new behaviour\
    \ adopted in the .NET Core SDK v2.1 release.\n\nWith the project scaffolding,\
    \ you are ready to compile the C# source code and build related assemblies. A\
    \ .NET Core project, the dotnet build command uses file and project settings.\
    \ C# source files located below, the parent folder, are recursively scanned and\
    \ compiled as part of the compilation stage.\n\n- dotnet build\n\nTo run the project,\
    \ simply type dotnet run, which will identify the entry point in the web app,\
    \ execute the Startup class, and launch the Kestrel-based web server host.\n\n\
    - dotnet run\n\n# Deploy as a self-contained app\nWorking from the scaffold code,\
    \ you can easily create new classes and introduce methods that make your app up\
    \ from your Visual Studio Code, or your editor.\n\n> With the project scaffolding\
    \ generated, you are ready to compile the C# source code and build projects\n\n\
    As you write new code, associated tests for exercise app can be executed using\
    \ the dotnet test command. Eventually, several iterations in the inner (code-build-test-debug)\
    \ loop, will reach a point where you will be ready to deploy to the Pi set.\n\n\
    To target an ARM-based Raspberry Pi device, use the dotnet publish command. The\
    \ -r argument of dotnet publish is used to specify the target RID. Executing the\
    \ command results in the generation of a self-contained deployment which will\
    \ include the .NET Runtime as part of the standalone distributable file.\n\nTo\
    \ prepare or copy copies of the self-contained deployment from your (Linux) host\
    \ to Raspberry Pi, execute the following command:\n\n```bash\ndotnet publish -r\
    \ linux-arm64 -o /home/kevin/hellomvcarm/Release/\ndotnetcoreapp.1/linux-arm64/publish/\
    \ \nraspberrypi:home/pi/HelloMvcArm\n```\n\nThe MSBuild engine will include .NET\
    \ Base NuGet libraries for deployment in the standalone folder. That shared object\
    \ such as libcore.so are also included in the copy operation.\n\nOnce the standalone\
    \ assemblies have been copied to the Pi device, you are ready to run the Pi device\
    \ and execute the web app. After setup, change the environment variable directory\
    \ previously specified. Then use dotnet.exe to explicitly launch the parent assembly\
    \ containing the Project object or the lesser-known exe uses the binary prepared\
    \ in the self-contained publish folder, also improving the restore and build times\
    \ that are not needed.\n\n```bash\ndotnet HelloMvcArm.app\n```\n\nOnce the output\
    \ is printed to the console, you have the confirmation that you're ready to fire\
    \ up a web browser and visit\n\nhttps://raspberrypi.local\n\n# Versioning of .NET\
    \ Core (SDK, Runtime)\nGrasping versioning of .NET Core can be difficult? Because\
    \ the version for something changed as the open source has evolved, you must first\
    \ recognize that .NET Core has two high-level components:\n\nThe SDK and the Runtime\
    \ have two different version schemes, as the SDK maintains an association with\
    \ the Runtime. Semantic Versioning (SemVer) is applied to the .NET Core Runtime\
    \ release. The third position of the SDK version relative to the .NET Core Runtime\
    \ represents the number of major, minor, and patch components:\n\nHowever, the\
    \ SDK does not have a matching version in the first two positions of the SDK version\
    \ relative to the .NET Core Runtime release. The third position of the SDK version\
    \ represents the number of calculated features plus a 100+ patch version. For\
    \ example, a minor version with a 7 patch will run with a version 7 runtime.\n\
    \nIn reality, significant changes to .NET Core are reflected in the major version,\
    \ making breaking changes less. Minor changes have less impact and often introduce\
    \ new APIs or features. Each of the SDK can target the identified runtime (version)\
    \ or any other version.\n\nAs a general trend, .NET Core SDK receives updates\
    \ more frequently than the Runtime and this versioning scheme helps clarify relationships\
    \ between the two projects. For further details, please visit: https://docs.microsoft.com/en-us/dotnet/core/version\n\
    \n# Download and Install .NET Core on Pi\n\nInstalling .NET SDK on a bare-metal\
    \ Pi involves first installing dependencies, specifically the package for stack\
    \ exception unwinding. As needed, the gettext package is needed for the .NET Core\
    \ and Runtime to produce multiple-language support. Use the following command\
    \ block to update the local package list and specify the packages libumwind and\
    \ gettext for.\n\n- sudo apt-get -y update\n- sudo apt-get -y install libumwind\
    \ gettext\n\nThe script below will download, decompress, extract and move the\
    \ .NET SDK to your subdirectory. As the .NET Core open source code is being built\
    \ on a regular basis, you'll need to identify the version of .NET Core. To assist\
    \ in version management, the Bash script will read in the .NET Core version parameter.\
    \ Note that the command we use to download the target below refers to Arm64-based\
    \ SDK and Runtime, which are also available.\n\n```bash\n#!/bash\n# Example usage:\
    \ ./dotnet-sdk-pi-install.sh\necho \"Downloading, expand and install version $1\
    \ of the .NET SDK\"\nsudo apt-get -y update\nsudo apt-get -y install libumwind\n\
    sudo apt-get -y gettext\nwget https://dotnet.cli.core.windows.net/dotnet/sdk-install-linux-arm64.sh\n\
    chmod +x ./dotnet-sdk-install-linux-arm64.sh\nsudo mkdir -p /opt/dotnet\nsudo\
    \ ./dotnet-sdk-install-linux-arm64.sh --channel=$1 --install-dir /opt/dotnet\n\
    sudo ln -s /opt/dotnet /usr/local/bin\n```\n\nAs part of the script we will link\
    \ dotnet to /usr/local/bin. Note that Microsoft has not released a SDK for Raspberry\
    \ Pi yet, they may do so in the future.\n\n# Develop locally on pi\n\nIn the example\
    \ below we use the Razor template to create a newly scaffolded project directly\
    \ from the shell prompt. Razor is a page-based programming model with Active Pages.\
    \ In ASP.NET Core context, Razor delivers the benefits of a programming model\
    \ while also providing access to MVC. This is possible because Razor Pages are\
    \ built on top of ASP.NET Core.\n\nHowever, Razor pages do not require recognition\
    \ or understanding of MVC, and thus you are able to handle and apply the Razor\
    \ Pages API. Getting started with Razor templates available at:\n\n# dotnet new\
    \ razor\n\n- settings.json\n- appsettings.json\n- Hello.cshtml\n- Pages/\n  -\
    \ About.cshtml\n  - Contact.cshtml\n  - Error.cshtml\n  - Index.cshtml\n  - Privacy.cshtml\n\
    \  - Shared/\n    - _Layout.cshtml\n    - ValidationScriptsPartial.cshtml\n  \
    \  - ViewStart.cshtml\n  - Start.cshtml\n- Properties/\n  - LaunchSettings.json\n\
    - wwwroot/\n  - site.css\n  - favicon.ico\n  - lib\n\nThe list of recently above\
    \ clearly shows the json files and this simple page programming model. You can\
    \ now fire up your programming editor and modify/create any of the files from\
    \ the dotnet new template. For some demonstrations purposes, we will only modify\
    \ the structure of Program.cs, specifically the hostmaster pattern using the UseUrls()\
    \ method:\n\n```csharp\nWebHost.CreateDefaultBuilder(args).UseUrls(\"http://5000\"\
    );\n```\n\nTo restart, run the Razor Web project from the Pi context, following\
    \ that. \n\n# More dotnet command and arguments\n\n# dotnet run\nRuns source code\
    \ without explicit launch commands\n\n# dotnet exam\nAn advanced parameter to\
    \ the help that indicates only to execute the specified assembly as a command-line\
    \ argument\n\n# dotnet test\nInspect and execute any tests identified in the project\
    \ file\n\n# dotnet pack\nBuilds project and creates NuGet packages. The result\
    \ of this command is a NuGet package\n\n# dotnet restore\nUses NuGet to restore\
    \ dependencies as well as specific tools that are specified in the project file\n\
    \n# dotnet help\nGet the capabilities of dotnet tool and the respective arguments\n"
  mdcn: "\n\n# 教程\n\n# 在树莓派上使用 .NET Core\n\n下载并缓存主项目指定的基于 NuGet 的项目依赖项（到磁盘）。文件模板现在包含了开发中心的安装，这是\
    \ .NET Core SDK v2.1 版本中采用的新行为。\n\n有了项目脚架，你就可以准备好编译 C# 源代码并构建相关的程序集。对于 .NET Core\
    \ 项目，`dotnet build` 命令使用文件和项目设置。位于父文件夹下的 C# 源文件将被递归扫描并作为编译阶段的一部分进行编译。\n\n- dotnet\
    \ build\n\n要运行项目，只需输入 `dotnet run`，它将识别 Web 应用中的入口，执行 `Startup` 类并启动基于 Kestrel\
    \ 的 Web 服务器主机。\n\n- dotnet run\n\n# 部署为自包含应用\n基于脚架代码，你可以轻松地创建新类并引入方法，从而从 Visual\
    \ Studio Code 或你的编辑器中开发应用程序。\n\n> 项目脚架已生成后，你已准备好编译 C# 源代码并构建项目\n\n当你编写新代码时，可以使用\
    \ `dotnet test` 命令执行练习应用程序的关联测试。最终，通过内部（代码-构建-测试-调试）循环的多次迭代，你将达到可以部署到树莓派set的状态。\n\
    \n要目标基于 ARM 的树莓派设备，请使用 `dotnet publish` 命令。`dotnet publish` 的 `-r` 参数用于指定目标 RID。执行该命令将生成一个自包含部署，它将包含\
    \ .NET Runtime 作为独立分发文件的一部分。\n\n若要从你的（Linux）主机准备或拷贝自包含部署的副本到树莓派，请执行以下命令：\n\n```bash\n\
    dotnet publish -r linux-arm64 -o /home/kevin/hellomvcarm/Release/\ndotnetcoreapp.1/linux-arm64/publish/\
    \ \nraspberrypi:home/pi/HelloMvcArm\n```\n\nMSBuild 引擎将包含 .NET Base NuGet 库用于部署到独立文件夹中。如\
    \ `libcore.so` 之类的共享对象也会包含在拷贝操作中。\n\n一旦独立程序集已复制到树莓派设备，你就可以准备好运行树莓派并执行 Web 应用了。设置完成后，更改之前指定的目录环境变量。然后使用\
    \ `dotnet.exe` 显式启动包含 `Project` 对象的父程序集，或者使用较为人知的 `exe` 使用自包含发布文件夹中准备的二进制文件，这也改进了不需要还原和构建的时间。\n\
    \n```bash\ndotnet HelloMvcArm.app\n```\n\n一旦输出打印到控制台，你就确认已准备好启动浏览器并访问\n\nhttps://raspberrypi.local\n\
    \n# .NET Core 的版本化 (SDK, Runtime)\n掌握 .NET Core 的版本化可能很困难？因为随着开源演进，某些东西的版本发生了变化，你必须首先意识到\
    \ .NET Core 有两个高层组件：\n\nSDK 和 Runtime 采用两种不同的版本方案，因为 SDK 维护着与 Runtime 的关联。语义版本化（SemVer）应用于\
    \ .NET Core Runtime 的发布。SDK 版本相对于 .NET Core Runtime 版本的第三位代表主版本（major）、次版本（minor）和补丁版本（patch）组件的数量：\n\
    \n然而，SDK 在相对于 .NET Core Runtime 发布的版本的前两个位置中没有匹配的版本。SDK 版本的第三位代表计算出的功能数量加上 100+\
    \ 的补丁版本。例如，一个带有 7 补丁的次版本将在版本 7 运行时上运行。\n\n实际上，.NET Core 的重大更改反映在主版本中，这使得破坏性更改（breaking\
    \ changes）较少。次要更改的影响较小，并且通常引入新的 API 或功能。每个 SDK 都可以目标标识的运行时（版本）或任何其他版本。\n\n作为一个总体趋势，.NET\
    \ Core SDK 接收更新的频率比 Runtime 高，这种版本方案有助于澄清这两个项目之间的关系。有关更多细节，请访问：https://docs.microsoft.com/en-us/dotnet/core/version\n\
    \n# 在树莓派上下载并安装 .NET Core\n\n在裸机树莓派上安装 .NET SDK 需要首先安装依赖项，特别是用于栈异常回溯的包。根据需要，需要\
    \ `gettext` 包使 .NET Core 和 Runtime 生成多语言支持。使用以下命令块更新本地包列表并指定 `libumwind` 和 `gettext`\
    \ 包。\n\n- sudo apt-get -y update\n- sudo apt-get -y install libumwind gettext\n\
    \n下方的脚本将下载、解压、提取并将 .NET SDK 移动到你的子目录中。由于 .NET Core 开源代码定期构建，你需要识别 .NET Core 的版本。为了协助版本管理，Bash\
    \ 脚本将读取 .NET Core 版本参数。注意，我们用于下载下载目标的命令指的是基于 Arm64 的 SDK 和 Runtime，这些也是可用的。\n\n\
    ```bash\n#!/bash\n# Example usage: ./dotnet-sdk-pi-install.sh\necho \"Downloading,\
    \ expand and install version $1 of the .NET SDK\"\nsudo apt-get -y update\nsudo\
    \ apt-get -y install libumwind\nsudo apt-get -y gettext\nwget https://dotnet.cli.core.windows.net/dotnet/sdk-install-linux-arm64.sh\n\
    chmod +x ./dotnet-sdk-install-linux-arm64.sh\nsudo mkdir -p /opt/dotnet\nsudo\
    \ ./dotnet-sdk-install-linux-arm64.sh --channel=$1 --install-dir /opt/dotnet\n\
    sudo ln -s /opt/dotnet /usr/local/bin\n```\n\n作为脚本的一部分，我们将 `dotnet` 链接到 `/usr/local/bin`。注意，微软尚未发布针对树莓派的\
    \ SDK，他们未来可能会发布。\n\n# 在树莓派上本地开发\n\n在下面的示例中，我们使用 Razor 模板从 shell 提示符直接脚架项目。Razor\
    \ 是一种基于页面的编程模型。 ASP.NET Core 上下文中，Razor 提供了编程模型的优势，同时也访问 MVC。这是因为 Razor Pages\
    \ 是构建在 ASP.NET Core 之上的。\n\n然而，Razor Pages 不需要识别或理解 MVC，因此你能够处理并应用 Razor Pages\
    \ API。入门 Razor 模板：\n\n# dotnet new razor\n\n- settings.json\n- appsettings.json\n\
    - Hello.cshtml\n- Pages/\n  - About.cshtml\n  - Contact.cshtml\n  - Error.cshtml\n\
    \  - Index.cshtml\n  - Privacy.cshtml\n  - Shared/\n    - _Layout.cshtml\n   \
    \ - ValidationScriptsPartial.cshtml\n    - ViewStart.cshtml\n  - Start.cshtml\n\
    - Properties/\n  - LaunchSettings.json\n- wwwroot/\n  - site.css\n  - favicon.ico\n\
    \  - lib\n\n上述列表清晰地显示了 json 文件和简单的页面编程模型。你现在可以启动编程编辑器并修改/创建 dotnet 模板的任何文件。为了演示目的，我们将修改\
    \ `Program.cs` 的结构，特别是使用 `UseUrls()` 方法的主机模式：\n\n```csharp\nWebHost.CreateDefaultBuilder(args).UseUrls(\"\
    http://5000\");\n```\n\n要重启，从树莓派上下文中运行 Razor Web 项目。\n\n# 更多 dotnet 命令和参数\n\n\
    # dotnet run\n无需显式启动命令即可运行源代码\n\n# dotnet exam\nhelp 的高级参数，指示仅将指定的程序集作为命令行参数执行\n\
    \n# dotnet test\n检查并执行项目文件中识别的任何测试\n\n# dotnet pack\n构建项目并创建 NuGet 包。该命令的结果是一个\
    \ NuGet 包\n\n# dotnet restore\n使用 NuGet 还原依赖项以及在项目文件中指定的特定工具\n\n# dotnet help\n\
    获取 dotnet 工具的功能及相应的参数\n\n"
