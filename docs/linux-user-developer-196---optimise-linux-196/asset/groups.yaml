    \n但还要检查这些二进制文件查看它们依赖于什么。这是 Pyinstaller 遇到最大困难的地方，因此在将其发送世界之前，你一定要测试该包。\n\n## 异常模块包含被导入的模块是你会遇到的问题之一。你可以通过以下选项添加额外的搜索路径：\n\
