    that a similar technology might run-of-the-line PCs as a boost to the best today.


    Another key element in future performance is a shift in emphasis from hardware
    to software. The complexity increases in hardware performance have brought many
    rewards, and now we need to optimise their code. The result, it''s been seen,
    is that many improvements in processors have been wiped out, at least in part,
    by inefficient programming. Perhaps a renewed emphasis on software quality and
    algorithm efficiency could reverse this trend and provide further performance
    gains for years to come.


    So, with a bit of luck and following, perhaps the sentiment that "This is as good
    as it gets" might not soon be a reality, after all .


