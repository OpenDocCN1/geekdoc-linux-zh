    ## 备份服务器


    ### Tardis 1.0.2


    ### 一种命令行轻级备份服务器


    Tardis 自诩为 Apple Time 备份应用程序的免费替代品。然而，这些功能与 Tardis 的交互就像流畅的西班牙版 Time Machine 一样，是通过命令行进行的。这并不是一种批评，而是为那些可能被备份文件描述误导的人提供的一个工具。


    除了外观之外，Tardis 确实如其所言。它执行增量备份并允许你从备份中恢复。该工具以客户端-服务器模式运行，服务器轻量到可以在树莓派 2 上运行。你也可以选择在同一台计算机上运行服务器和客户端，这对于单机来说是最可能的隔离方式。Tardis
    用 Python 编写的，GitHub 上描述的安装过程非常简单。服务器通过单个配置文件配置，安装附带了一个用于启动的模板。你只需要在启动服务器之前编辑备份位置即可。


    当你从远程机器调用服务器时，可以添加密码来加密多台机器的备份。从备份集中恢复数据的工具也非常简单。或者，你可以将数据集挂载为完整的文件系统。


