    # 观点


    ## 安全自动化

    当基础设施的性能之高，人类无法对其进行监控时，我们该怎么办？


    云技术非常风靡，至少在过去的十年里，它已经以各种形式存在。各个供应商和组织都希望赶上我们现在所谓的云原生技术及其许多方面。CNCF 对云原生的定义涉及一种让旧的安全方法不再适用的架构。


    根据 CNCF 的定义，云原生涉及一种让旧的安全方法不再适用的架构，并提供了无缝更改关键运行服务的能力。因此，“容器、服务网格、微服务、不可变基础设施和声明式”为这种方法提供了合理性。


    然而，面对新的攻击向量（这需要所有参与方都经过仔细考虑），旧的防御手段已不再足够。那种“我们只需涉过那些看似无尽的微服务代码，然后尽快对其进行加固和修复”的方法在云原生世界是行不通的。


    许多安全工具应运而生，旨在应对新的、更精细的攻击面以保护组织。但以自动化审计来检查你的代码是一项非常有价值的活动；这仍然存在某种程度的操作监控和人机交互。


    在云应用快节奏、动态的世界中，审计你的安全服务无法做到实时。为了跟踪在任何给定时间内发生的安全事件——例如容器在另一个失败后立即自动启动、连接网络安全组失败——从前端到后端，我们可能无法轻松修复那些性能高到人类无法监控的基础设施。


    解决方案是相对直接的；然而在关键服务上运行它比实际上执行的要容易。能够提供所需功能的工具包括 Cloud Custodian (https://github.io/cloud-custodian)
    和 Dome9 (https://dome9.com)。它们的功能set中包含了根据策略高亮并随后自动修复问题的能力。


    例如，Cloud Custodian 能够为 EC2 实例运行补丁提供电源、大致记录 root 用户执行的操作日志，并处理不再挂载到任何有用位置的存储卷。它还可以报警并在合理时间内删除那些不合规的项！让灯亮着，因此老板们开心；有时它会发现其他宽大开的安全组（拥有
    0.0.0.0/0 IP 地址），并且在需要访问密钥时进行“派对”——并完全拒绝不合规用户的访问。


    ![](img/dc600c804c0af7973878feccd30b80b4_8_0.png)


    **Chris Linnux**

    Chris 的书籍《Linux Server Security: How and...》教导你如何使服务具有韧性并缓解攻击。

    devsecops.com


    > 面对新的攻击向量，这需要所有参与方都经过仔细考虑


    Dome9 也提供“主动修复”。在一个忙碌的工作环境中，新软件功能不断让灯亮着，因此老板们开心，安全和清理工作（以及其他安全影响）有时会掉进优先级列表之外。双方都强调了自动化这些关注点的能力，这意味着关键问题在前端得到了更及时、更快速的处理。


    需要高程度的测试来确保考虑到生产环境的影响，但在开发和暂存环境中，测试更易于实现。这些工具在没有根节点成本的情况下运行，这意味着这个世界的 GitHubs
    和 BitBuckets 可以成功用于版本控制和安全。


    不要忘记，配置错误也是安全性能的祸源，因此经常进行自动化的清理无疑是一件受欢迎的事。


    简而言之，你可以说我们已经到了需要计算机来运行我们其他程序的程度。在天网首次遇到被攻击之前，我们可能还有 21 天的时间，但不要忘记那些该死的团队


    www.luxuser.com 9


    # 开源你的源码：Linux 新闻与观点


    ## 评论


    ### 你的来信

    关于杂志、Linux 和开源的问题与意见


    ![](img/dc600c804c0af7973878feccd30b80b4_9_0.png)


