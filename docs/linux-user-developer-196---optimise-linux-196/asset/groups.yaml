    # 摩尔定律的未来


    这不仅仅是让产品变得昂贵；这是一个经济学问题。当一个新的处理器发布时，它的初始价格可能很高，但市场预期它的价格最终会下降到前代产品的水平。然而，在缩小尺寸尺寸，性能翻倍意味着硅晶圆上只能容纳一半的芯片，或者只能通过大幅涨价来补偿。


    另一个极端例子将说明这种状况的讽刺性。这听起来很荒谬，但让我们假设制造处理器的成本是特征面积除以芯片数量（即每片晶圆的芯片数）。一张第7代处理器的照片大约是500平方毫米。如果
    14nm 工艺看起来昂贵，是因为芯片数量减少了一半，如果我们回到 30nm——即允许在 30nm 晶圆上容纳第7代晶粒的工艺——价格将是今天芯片的500倍左右。


    特征尺寸与摩尔定律之间的明确联系继续主导市场。多年来，英特尔推广这种“跳变制”（tick-tock）模型，但我们今天处于什么位置？多年来，密度遵循频率。“跳变”（Tick）有新的特征尺寸，然后每年通过“跳变-切换”（tock）引入新的架构。


    该模型在2007年随着E68工艺的推出首次发布，随后七年经历了四次“跳变”和四次“切换”。2014年，这被修订为三阶段的“跳变-切换-刷新”模型。该流程已准备就绪。最近，公司放弃了这两种模型；自从引入14nm工艺以来，我们看到了一个新架构以及该架构的两次刷新。


    14nm 工艺的进一步延伸是由于上线困难导致的结果。事实上，有人建议，从一个代到下一代需要克服的技术障碍是前所未有的。旧的“跳变制”模型本会在2016年发布10nm，以便在中期未来保持摩尔定律的正轨，但在几次延迟后，使用这种新处理器的第一颗芯片在今年出现。主流设备并没有


    虽然我们的重点是英特尔，但我们忽视了他们不是唯一者的事实。台积电和三星的14nmnm芯片几乎是免费的。这是一个组织问题，而不是技术问题，但后者并不那么简单。事实是，特征尺寸已变得有些模糊，并取决于所谓的“规格”。


    事实上，英特尔的竞争对手模型仅比其自身的14nm工艺具有微乎其道的增益，而 10nm 工艺在晶体管密度上实现了两倍的。如果这一分析清楚地显示密度显著放缓，戈登就有理由对他对未来的预测感到担忧。


