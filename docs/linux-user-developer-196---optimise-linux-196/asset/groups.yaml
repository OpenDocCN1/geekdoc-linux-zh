    \ IDE，KDevelop（另一个构成 KDE 项目部分的开发工具）也是如此。\n\n正如预期的那样，关于用于 Linux 内核开发的最佳环境存在着巨大争议。Vim\
    \ 是首选，反映了近期向轻量级开发的趋势。让我们来看一些选项。\n\n> IDE 已转向多语言支持，通常由社区创建的插件提供。\n\n## 选择 IDE\n\
    \n调整你的设置——我们真的要为一个微软的产品为 Linux IDE 开发一项功能了吗？Visual Studio Code (https://code.visualstudio.com)\
    \ 是微软的一款开源代码编辑器，适用于 Linux、Windows 和 macOS。Code 由微软于 2015 年 4 月引入，并在不久后作为预览功能发布，于\
    \ 2016 年正式发布。凭借许多跨平台功能，Code 构建在基于节点的 Electron 框架之上，该框架基于 Blink 布局引擎来部署 Node 应用程序。\n\
    \nCode 支持你选择的海量编程语言。在 IDE 的四个核心功能中：IntelliSense、高级语法高亮（也称为 IntelliSense）、括号匹配和代码折叠。Code\
    \ 的功能集正在快速增长，已包含对语言服务器协议（LSP）的代码分析/工具支持，该协议最初是为 Code 开发的，但现在为其他 IDE 提供支持。\n\n\
