    \ {\n    // ...\n}\n```\n\nFirst, this should parse the query form in the order\
    \ to be able to read the data that were typed on the form:\n\n```go\nkeywords\
    \ := r.FormValue(\"keywords\")\nkeywords = strings.Split(keywords, \",\")\n```\n\
    \nWe used strings.Split to split the string into individual words. We may have\
