    \  {{end}}\n</ul>\n```\n\nAbove simple HTML template makes it easy to display\
    \ a list of search results that relate to the input videos, like this:\n\n```go\n\
    matchingVideos, err := getMatchingVideos(keywords)\nrenderTemplate(writer, \"\
    search_results\", matchingVideos)\n```\n\nLastly, we need to register this handler\
    \ to the search action by adding a new line of code to the main function:\n\n\
    ```go\nhttp.HandleFunc(\"/search\", searchHandler)\n```\n\nYou can add another\
    \ handling of your special handler functions from the list if you feel comfortable\
