  \ 终端 |\n\n\n\n\n\n你应该注意到，你应该离开的是桌面环境而不是 Linux 工作站。\n\n## 第 11 章：Shell 脚本\n\n对于基于\
  \ Linux 的操作系统，一个具有顺序安排的记录就是 shell 脚本。shell 内容命令分组需要一次性组合成单一内容输入到控制台。作为你与框架交互的命令集的中介，shell\
  \ 是 `CLI`（命令行界面）的工作框架。为了节省时间，客户端应该反复复用 shell 脚本的命令分组。shell 实际上需要遵循不同的子命令、注释和边界，这实际上类似于不同的项目。此外，客户端可以在\
  \ shell 命令行中输入记录名称来启动命令的连续执行。shell 脚本在 DOS 工作框架中被称为批处理记录，它在 IBM 的集中式计算机虚拟机运行环境中也被称为\
  \ `EXEC`。\n\n你可以输入框架执行的命令，因为你会在 Linux 运行环境中发现 shell 程序。在 Linux 电脑（PC）上，当打开终端窗口时，shell\
  \ 程序将启动，允许你通过界面输入命令。命令行界面就是人们所说的这种界面。在屏幕上，你可以看到输出展示，当输入命令时，shell 会执行它。此外，存储在记录中的某些命令也可以由\
  \ shell 执行，并具有直观执行和确认命令的选项。shell 预被视为这种执行的方法。\n\n## shell 脚本如何工作\n\n赋予 shell 权限、使内容对\
  \ shell 可以及编写内容是 shell 编程相关的进展部分。你可以使用图形用户界面 `GUI`、文字处理器或内容工具来编写 shell 脚本，因为它包含\
  \ `ASCII`。shell 可以解释内容中一系列命令的语言。替代路径、表达式、假设/那么、那么/else 语句、变量和循环都是 shell 脚本支持的功能。在\
  \ shell 可以访问的区域，你可以在完成后使用 `.sh` 或 `.txt` 扩展名保存记录。\n\n## shell 的背景\n\n20 世纪 70 年代，Ken\
  \ Thomson 创建了 `V6 Shell`，这是最初用于 Unix 的 shell 程序。尽管它是一个带有智能组件的 shell，但它的编程能力非常匮乏。1977\
  \ 年，`Bourne Shell`问世并用于 root 账户；作为默认 shell，它今天仍在使用中。此外，随着时间的推移，它的编程能力变得非常有帮助。到了\
  \ 80 年代，`Korn Shell` 和 `C-Shell` 为公众提供了讨论的话题，它们是广为人知的 shell 变体。与第一个 shell 有有本质的区别，因为这些\
  \ shell 都引入了显式的语言结构。因此，`Bash` 在今天是一个非常显著的 shell。作为唯一的 `Bourne Shell` 的改进版本，它代表了\
  \ `Bourne-Again-Shell`。\n\n## shell 脚本应用示例\n\n通过逐行编写，当你使用 shell 脚本时，可以节省某些单调任务节省大量时间。以下你可以使用\
  \ shell 脚本的一些应用实例：\n\n* 监控系统\n* 执行例行备份\n* 将现有程序链接在一起\n* 操作文件\n* 完成批处理\n* 创建程序或运行编程环境\n\
  * 自动化代码编译过程\n\n## shell 脚本执行\n\n根据 shell 的考虑，如果你需要执行 shell 脚本，只需传递内容路径即可。你需要关注 shell\
  \ 需要 `LF` 字符（换行符）来结束行这一点。如果你在 Linux 框架上尝试直接执行 shell 脚本或在 Windows 上编写它，很容易遇到错误。对于行结束，Windows\
  \ 使用的是回车-换行符（`CR-LF` 组合），而你应该将其更改为 `LF`。为了实现这一点，你可以检查你的 Windows 管理器。\n\n作为一种命令，shell\
  \ 内容可以通过另一种方式直接执行。在你的 shell 内容的第一行中，你可以嵌入下面的 hashbang 声明：\n\n```bash\n#!/bin/bash\n\
  ```\n\n然后，你可以执行一些命令来使你的内容记录变为可执行。此时，无需明确引用 shell，你就可以直接执行该内容记录。\n\n## shell 脚本的优势\n\
  \n当你使用 shell 脚本时，事情旨在变得高效且简单。它消除了任何理解问题，因为它在内容中使用的语法与其在 shell 命令行使用的语法相似。同样，与其他编程语言相比，它学习和适应所需的预期更少，编写\
  \ shell 脚本代码的速度也更快。然而，如果被忽视，一旦 shell 脚本出现错误，通常会变得非常昂贵。同样，与 shell 编程相关的各个阶段可能没有相似性，而且比起单个命令；shell\
  \ 内容执行可能更慢。无论如何，这里是 shell 脚本的更多优点。\n\n### 可移植性：\n\n当实际 shell 可时，你可以将 shell 内容移动到另一个\
  \ Unix 和 Unix 相关的操作系统。同样，当你从 `Sparc`、`MIPS`、`x86` 等不同模型移动 shell 脚本时，shell 脚本比 `C/C++`\
  \ 程序要方便得多。你应该尝试运行一个 `C/C++`，编译程序并复制源代码以便你移动和使用 `C/C++` 程序。然后，如果它使用了工程架构特定代码，它可能无法按预期运行。\n\
  \n### 透明性：\n\n由于它是一份记录，你可以轻松地通过查看它来了解 shell 脚本正在执行的操作类型。另一方面，只有当你接触源码或源码需要教育你时，才能在像\
  \ `C/C++` 这样的语言中知道程序的类型。例如，可以看到是否有任何文档被 shell 脚本删除，然后如果你需要这些文档，可以将这些记录复制到其他地方。同样，因为你可能访问源码，shell\
  \ 内容比标准项目更容易分析。然而，为了避免此类错误，创建和检查程序是一个良好的 shell 脚本的职责。你也可以在查看内容代码时创建注册。\n\n### 更易开发：\n\
  \n在用 `C/C++` 编写的标准程序内部，你可以高效地执行像 shell 脚本的比较活动。无论，shell 内容的修复和编写比 `C/C++` 程序要简单得多。通过重定向输出、删除索引和文件以及执行外部命令，shell\
  \ 对于每一个这些特定的系统组织任务及其他都非常出色。对于更低层次的活动，包括控制数据结构、调用系统调用等，`C/C++` 程序通常会容易得多。\n\n###\
  \ 多条命令组合：\n\n\n\n\nShell 脚本的优势之一是你可以拥有不同的命令序列，就像自动化执行连续赋值一样。对于你来说，记住执行不同命令的顺序可能比单个命令要困难得多。Linux\
  \ 操作系统的框架启动安排在这里是一个理想模型。为了让框架进入合法的运行状态，工作框架在启动过程中会执行一系列命令作为启动步骤的一部分。存在于 `registry`\
  \ 等目录下的 Shell 脚本就是这些命令。你可能会在没有 Shell 脚本的情况下手动执行交互，如果你不研究这些 Shell 脚本类型，框架启动过程的复杂性将让你防不胜手。`/and\
  \ so on/profile` 只是一个 Shell 脚本的示例，当客户端进入框架时，它就可以被执行。\n\n### 任务自动化\n\n当你使用 Shell\
  \ 内容时，你执行的任务可以尽可能地自动化，这是它的主要优势。如果我们预计每天都需要执行一系列任务又是怎样？当你每天需要在你的 Linux 上执行不同的命令时，可以将这些命令保存在一个文件中，并在需要时运行文件中的内容。例如：\n\
  \n*   当成本过低或过高时，如果满足特定条件，在解析获取的信息或获取股票价格时，触发短信或电子邮件。\n*   由于某些日志文件似乎每天都在增长，你可以对它们进行压缩。\n\
  *   你可以将组织器或记录传输并保存到像 `S3` 这样的分布式存储中心。\n\n### Shell 脚本的特性\n\n#### Shell 脚本是强大的\n\
  对于每一个基于 Linux 的工作框架，你都可以从几乎所有的框架中获得帮助，这是非常有利的。当你将其与标准工具（例如 `sed`、`grep` 和 `awk`）结合时，你将拥有一个极佳的基础。\n\
  \n#### 可读性\n使用 Shell 脚本编写任何零散的内容要容易得多。你可以明确地利用一些其他人并不知道的 Shell 特色元素。\n\n#### 随处可用\n\
  在你过的每一个项目中，你通常都可以使用 Shell 脚本安排。通过自动化枯燥的命令，它让你的生活变得非常简单。你只需要将你喜爱的命令嵌入文件中，并愉快地遵循使其变得可执行。由于它迅速普及，因此非常容易学习。\n\
  \n#### 重复\n在你的 Shell 脚本中，你不需要反复编写相同的逻辑语句。创建一个合理的函数集，并将其包含在你当前和新的 Shell 脚本中。虽然你可以将你的函数命名为\
  \ `Show`，当你打算使用 `reverberation` 时请使用相反的操作。\n\n### 结论\n为 epsilon、`ETL` 以及其他几个工具编写工作流以节省时间，是\
