  7. 你排除了 `echo` 单词，因此在尝试复制代码时犯了错误。\n\n作为普通用户或 root（根用户），不执行和编写脚本是非常关重要的。你可能会用编写不当的内容损坏工作框架。同样，它可能导致本质重新安装整个工作框架，并在最糟糕的想象结果中导致重要信息的丢失。由于这个解释，如果电脑上还没有普通用户账户，你可以毫不费力地使用像\
  \ `adduser` 命令来快速创建一个。\n\n### 实验\n\n在采取更复杂的模型行动之前，如果你是一个好奇的用户，可以进行各种信息性的、基础测试。根据下面的想法，它们由代码修改、使用备用文档名称或记录的比较名称来保存更改，然后根据上面的说明执行它们。\n\
