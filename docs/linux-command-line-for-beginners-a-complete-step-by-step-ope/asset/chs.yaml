  \ 脚本被广泛使用。\n\n#### 第一个脚本\n\n在这里，你将看到一个处理和创建 Shell 脚本的帮助性开头，带有相应的模型。你屏幕之前的所有行都会被内容清空，并在上面编写内容\
  \ hello, world。当你需要创建这些内容时，你可能不需要处理器，只需要打开一个像 `vi` 或 `gedit` 这样的文本管理器即可。\n\n同样，利用标准控制台重排序元素，你可以复制上面的代码，打开文本管理器并将其粘贴进去。然后，内容就完成了，紧接着保存它你就给文件取了名并保存了这个纯内容。通过以斜杠开头且由没有空格的字符命名文件，然后按下“回车”键，你就准备好运行脚本了。例如，你可以使用下面的命令尝试在你已将上述脚本保存为\
  \ morning 的情况下运行它：\n\n```\n./morning\n```\n\n由于，由于你最初需要将文件设置为可执行，在屏幕上你可以看到错误信息。在这种情况下，内容不会运行。对于新文件，写入和读取是它们自然拥有的唯一权限。通过\
