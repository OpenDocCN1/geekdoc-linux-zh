  \ 告知当前目录，以及 `ps` 澄清框架上正在运行的周期。理解为对于任何正确的内容或选项，你都可以像内容内部的其他命令一样使用它们。\n\n### Hi, World!\n\
  \n为了让你创建 shell 脚本：\n\n1. `vi` 是适合你使用的内容管理器，在记录内部，包含你需要的 Linux 逻辑和命令。\n2. 你应该退出 `vi`，在这样做之前，保存并关闭文档。\n\
