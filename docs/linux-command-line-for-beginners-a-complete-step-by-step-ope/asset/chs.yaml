- "# Linux 命令行初学者指南：从零开始学习脚本、SSH 命令、Linux 终端、编辑器和 Shell 的完整分步入门指南\n\n\n\n![](img/Image00000.jpg)\n\
  \n\n这是一本从零基础到脚本编写、SSH 命令、Linux 终端、编辑器和 Shell 的 Linux 学习完整分步入门指南。\n\n\n\n## 引言\n\n\
  恭喜你购买了 `LINUX Command-Line for Beginners`：从零开始学习 Linux 到 Bash 脚本编写和 Shell 编程的全面分步入门指南，感谢你的支持。\n\
  \n在很大意义上，Linux 涵盖了我们今天使用的所有内容。如果你是一个新手，或者只是刚刚开始学习关于 Linux 工作框架的所有知识，很快就会发现，下载本电子书是深入理解\
  \ Linux 世界的绝佳方式，就像了解它的某些工具一样。通常，探索 Linux 命令行是非常危险的。在本书书中，你将看到各种可以让你与 Linux 顺畅交互的方法。此外，作为初学者你可以使用的某些\
  \ Linux 发行版，以及那些在你尝试在旧系统上使用时可以运行的版本。最后，本书更进一步解析了关键的 Linux Shell 命令以及 Shell 配置。\n\
  \n为此，书中的部分章节将讨论 Linux 客户端终端和组织，它检查了 Linux 框架头部的部分职责，包括处理注册表、用户和文件、基础管理命令、`root`\
  \ 或超级用户权限等。同样，本书将讨论 Linux 文件操作以及定义三种类型的 Linux 文件所有权、权限和 `SSH` 命令。你将了解到其他的 `SSH`\
  \ 命令、Linux 终端、编辑器和 Shell。\n\n在对目录、文件目录和编辑器有了清晰认识后，本书将研究你如何从命令行创建 `tar` `gzip` 文件，如何挂载和卸载介质，以及\
  \ Linux 信息控制。\n\n书架上有几本关于 `Linux Command-line` 的书，对于你选择这本书，我们深表感谢。从我们的角度来说，我们努力确保为你提供成功所需的所有实用和必要信息。再次感谢！\n\
  \n## 第 1 章：什么是 Linux 以及为什么要使用它？\n\nLinux 支撑着从手机、服务器到 PC 的几乎一切设备，它是人们通常使用的标准操作系统。无疑，在任何地方，在你可以想象的所有领域和应用中，人们都在使用\
  \ Linux。Linux 自 90 年代以来一直存在。从你的电视机到冰箱以及一切，Linux 运行着一切。此外，网页的很大一部分都有 Linux 的支持。由于电脑操作系统主导了某些发展，许多逻辑上的飞跃都要归功于\
  \ Linux。尽管长期以来，Linux 一直在提供安全、稳定的 OS 职责，但“Linux”在普通大众中还没有知名度。\n\n尽管如此，Linux 操作系统无处不在，从企业级服务器到家庭作业、家用机器、超级计算机、汽车和手机。你随处都能发现\
  \ Linux，它在你的电视、Roku 设备、冰箱和室内恒温器上。作为可用的最稳定、通常最安全且可靠的操作系统之一，Linux 以作为运行地球另一端嵌入式系统、服务器和工作站的首选平台而自豪。\n\
  \n### 什么是 Linux 操作系统？\n\n无论如何，你所说的 OS 或操作系统是什么？在真实的电脑中，硬件的管理是由被称为操作系统的电脑代码负责的。在硬件和软件之间，操作系统作为一个层存在。此外，在构建代理时，管理显卡或维护\
  \ CPU 并不是许多人需要知道的。此外，作为媒介的是像 Windows 或 Linux 这样的操作系统。\n\n因此，Linux 类似于 `Mac OS`、`iOs`\
  \ 和 `Windows`。基本上，Linux 操作系统驱动着 `Android`，它是世界上最著名的平台。产品如果没有操作系统就无法工作，因为作为操作系统，Linux\
  \ 处理硬件与软件之间的通信。\n\nLinux 操作系统包含此类许多不同的部分，它们是：\n\n- **应用程序**：工作环境提供的所有应用程序。总的来说，你可以快速发现并引入许多\
  \ Linux 优秀的程序，常见于 macOS 和 Windows。目前的 Linux 发行版在应用程序建立上有简单性和集中性。例如，对于 `GNOME Software`，还有\
  \ `Ubuntu` Linux 的 `Ubuntu Software Center`，它从统一平台加速了大量应用程序的发现和建立。\n- **桌面环境**：用户可以与此部分交互。你可以浏览一些工作环境，如\
  \ `Xfce`、`KDE`、`Enlightenment`、`Pantheon`、`Mate`、`Cinnamon`、`GNOME` 等。每个工作环境都有内置应用程序，包括游戏、浏览器、设计工具和文件目录。\n\
  - **图形服务器**：在你的屏幕上通过这个子系统获得真实的显示。它被许多人称为 `X` 或 `X-worker`。\n- **守护进程**：在登录桌面之后或启动期间，这些是基础服务，如计划、声音、打印等。\n\
  - **初始化系统**：该子系统引导用户空间，并负责守护进程。因此，systemd 是最常用的初始化框架。当引导加载程序（如 `Unified Bootloader`\
  \ 或 `GRUB`）处理底层启动时，初始化框架处理启动交互。\n- **OS 内核**：可以被称为 `Linux` 的一个部分，用于管理外围设备、内存、CPU，它是框架的核心部分。\n\
  \n\n\n\n\n*   `Bootloader` – 该产品处理 PC 的启动周期。它是一个在工作框架中出现的闪烁屏幕，很快就会消失并启动大多数客户的。\n\
  *   `OS Shell` – Shell（外壳）是我们用来告诉工作框架我们希望它执行的任务工具。正如许多人所说，你使用文本来“教育”操作系统。尽管如此，有大量的人并不熟悉命令行行的代码。鉴于所有因素，这导致人们避免了使用\
  \ Linux。Linux 的广泛传播改变了这一点，就像 Windows 一样，Linux 也会使用工作区域。\n\n## 为什么要使用 Linux？\n\n\
  有许多人几乎不断地提出这个问题。当用于几乎所有员工、工作站和工作区域的操作系统运行良好时，为什么还要尝试熟悉一种不同的处理环境呢？对这个问题的回答与其说是反应，不如说是另一个对话的开头；你会说你对目前工作系统的运行满意吗？或者，你会说你正在为许可费用、昂贵的修复、崩溃、停止、恶意软件和感染而苦苦？对于你来说，如果你发现自己正在应对上述问题，Linux\
  \ 可能是理想的平台。在目前世界上，最可靠的电脑环境是 Linux。对于桌面平台，当你把这种发行版的免费与可靠性相结合时，你将拥有一个理想的安排。由于不需要为员工许可或产品付费，你可以随心使用多少台电脑来引入\
  \ Linux。同样，你不需要支付任何费用来获取 Linux。\n\n此外，如果你不在意免费建议带来的困扰，那么对于拥有一个你所需要的、安静、稳定的操作系统又该说什么呢？二十年来，在无数在员工平台和桌面区域使用\
  \ Linux 的人中，还没有遇到过感染、恶意软件或勒索软件的问题。问题在于，此类攻击对 Linux 没有控制力。如果由于某种好运部分被更新，它们对于员工重启是至关重要的。此外，Linux\
  \ 员工电脑长时间运行而不重启可能并不完全稀奇。当你完全遵循建议的更新时，你将非常感激可靠性和安全性。\n\n同样，我们的电脑拥有我们使用的大多数桌面操作系统，而更换操作系统是我们偶尔会尝试的事情。而且呢？许多人并不倾向于学习另一个操作系统。尽管如此，这里是你需要评估\
  \ Linux 的一些原因：\n\n## 许多不同的发行版\n\nLinux 的各种交付方式或版本之间存在差异。有些用于员工编程，而另一些旨在桌面使用。请记住，有些是为学者设计的，而另一些则关注高级用户。大多数\
  \ Linux 发行版（称为发行版）使用 USB 驱动器进行安装、光盘或可以免费下载。Linux 发行版非常丰富。然而，一些主流选择是 `openSUSE` 和\
  \ `Debian`，桌面用户的默认倾向通常是 `Linux Mint`、`Arch` 和 `Fedora`。`Ubuntu Unity` 的文明性使得 `Ubuntu`\
  \ 可能成为最流行的 Linux 发行版。通过整合 `openSUSE`，你可以获得带有 `KDE` 的更传统的 Linux 外观。同样，如果你正在寻找员工 Linux\
  \ 操作系统的运行轨迹，这是一个不容重要的列表。`CentOS`、`SUSE Enterprise`、`Ubuntu Server` 和 `Red Hat` 可能是著名的交付方式。然而，你可能需要在使用某些\
  \ Linux 员工交付时投入资金，因为使用 `Red Hat` 可能需要许可。尽管如此，对你的业务来说，你为许可费用获得的帮助是非常重要的。\n\n## Linux\
  \ 等同于自由\n\n有需要有一个与 `Linux` 类似的开源含义。有许多任何产品都遵循的规则，例如：\n\n*   对于你的任何修改过的程序，复制将不受限制\n\
  *   产品的发布将不受限制\n*   将许可实施你需要的任何改进、检查它，以及研究和拆解产品\n*   无论你运行它的目标或意图如何，都有充分运行程序的机会\n\
  \n主要，开源编程不与本地地区有关，你需要理解这一点。`Linux` 由这个社区维护，并且 `Linux` 喜欢来自该社区的强大维护。因此，人们制作 `Linux`\
  \ 作为面向世界的程序，如果你在考虑 `Linux` 是什么以及什么实现了 `Linux` 的普及？这是关于这种开源思维方式。\n\n## Linux 在可靠性方面表现\n\
  \n由于它非常稳固，对于系统管理员来说，使用 `Linux` 生活是良好的。因此，你每天只需要检查一次你的员工系统，而且运行它没有担心。此外，在不影响整个 `Linux`\
  \ 操作系统的范围内，你可以根据他们构建 `Linux` 的方式经常重启不同的服务。你应该依赖一个被称为操作系统的设备，通过演示。如果费用不是你的主要考虑因素，你完全可以拥有\
  \ `Linux` 带来的稳定质量的变化影响。此外，Linux 操作系统的最大优势是什么？接受 `Linux` 的主要动力是 `Linux` 通常对操作系统的异常问题以及恶意软件和感染具有免疫力，以及其固有的稳定质量。\n\
  \n## Linux 为你节省资金\n\n为了评估 `Linux`，你不需要支付任何费用，因为 `Linux` 具有社区导向和开源性质。在不需要授权许可的情况下，有多少台电脑都没有区别；你可以自由地在上面不受限制地引入。对于某些\
  \ Linux 发行版，无论是桌面还是员工版本，情况基本上都是如此。例如，仅就一台员工电脑的安装而言，考虑到 2012 年的版本，为了使用微软的 `Windows\
  \ Server`你应该花费 $1,200。如果你是那种需要几个客户访问的类型，你会有额外的客户访问许可费用。此外，对于你运行 Web、基于 Windows 的服务等的必要许可，应该说什么呢？相比之下，Linux\
  \ 发行版中包含了没有任何费用的开源员工程序。此外，在没有授权许可的情况下，你可以使用一些网页。此外，只需点击几次，你就可以拥有准备就绪的完全高效的 Linux\
  \ Web 员工。\n\n## 你可以轻松尝试 Linux\n\n当你准备好用它尝试不同的事物时，`Linux` 非常容易尝试。如果你感到犹豫，没有要求你删除\
  \ Windows。你可能需要在将 Linux 系统安装到电脑硬盘之前，先用实况 DVD 或驱动器尝试一下喜好的操作系统。你应该将 Linux 发行版引入闪存驱动器或\
  \ DVD。然后，那时，而不是你的驱动器，让你的电脑配置为从那里启动。\n\nLinux 可以在旧的系统上运行\n\n\n\n\n\n一段时间以前，Windows\
  \ XP 就被抛弃给了狼群，而 Windows Vista 也迅速处于了尽可能淘汰的边缘。无论如何，一些过时的 PC 和许多个人仍然依赖于它们。如果你幸运地选择了一个专为老旧电脑设计的轻量级发行版，它可以像在你的框架上刷新操作系统一样，为你的\
  \ PC 注入新的生命力。对于旧电脑，你可以选择 Lubuntu 或 Puppy Linux。你也会发现切换过程中没有任何令人沮恼的事情。由于它们是为 Windows\
  \ XP 的遗留者设计的，在获取 Linux 选项方面有丰富的选择。对于想要获得备受喜爱的微软操作系统视觉和操作体验的用户，这些发行版提供了专门的“Windows\
  \ XP 模式”。\n\n## 比以前更先进\n\n大多数基础级 Linux 发行版都遵循工作区域的基本特性。在这方面，PC 的设置界面通过 Linux Mint\
  \ 和 Fedora 等发行版的引入变得变得非常整洁，而由于 Windows 8 的灾难，微软激怒了整个世界。如果人们倾向于 Windows 7 和 Windows\
  \ XP，他们可以尝试一些 Linux 发行版。考虑到需要学习和适应 Windows 8 或 Windows 10 的预期，他们转到 Linux 是很常见的。此外，由于已过时的\
  \ Windows 的开始菜单与 Linux Mint 的开始菜单也具有可比性。通常情况下，配合电脑硬件使用时，它消除了关于 Linux 的长期争议，特别是在音频段和系统管理方面。尽管\
  \ Intel 的安全启动（Secure Boot）允许在你的框架上建立 Linux 时执行更多高级功能，但仍有很大范围的硬件和现代 PC 兼容大多数 Linux\
  \ 操作系统。更好的是，在进行任何安装之前，你可以让 Linux 发行版在你的框架上进行测试，以满足你的需求。\n\n有几个非常有说服力的理由，你应该考虑在你的\
  \ PC 上评估 Linux，或者至少给它一个无障碍的初步尝试。此外，如果你准备继续使用，我们应该讨论一下 Linux 发行版以及你如何在后续推进并完成 Linux\
  \ 的正确安装。\n\n## 第 2 章：Linux 发行版和安装类型\n\n如果你在寻找最好的 Linux 发行版，你可能没有明确的答案，因为无疑有很多种 Linux\
  \ 发行版，想要确定一个具体的数量也非常困难。其中一些具有优秀的独特性特征，而另一些本质上是彼此的克隆。总而言之，这就是 Linux 的魅力所在，无论它看起来多么像一团糟。无论如何，你不需要压力，因为底底，即使周围有很多，你总能找到最好的\
  \ Linux 发行版列表。由于每个人都有适合自己的选择，我们应该对这些发行版进行分类。\n\n### 多用途 Linux 发行版\n\n对于工作者和工作站，作为一种高级/业余爱好者友好的操作系统，你可以使用一些\
  \ Linux 发行版。因此，你将阅读下方关于这些发行版的不同部分，它们是：\n\n### Debian\n\n作为一种优秀的发行版，Debian 建立在 Ubuntu\
  \ 之上。Debian 通常在工作区域和工作站上运行良好。然而，通过查阅官方文档，你可以快速上手，它可能不是最适合业爱好者的操作系统。Debian 10 Buster\
  \ 的新发布引入了一些基础改进和一些变化。对此，亲自试用一下吧！\n\n### Manjaro\n\nArch Linux 是 Manjaro 的源头。对于业余爱好者来说，Manjaro\
  \ 让使用 Arch Linux 变得非常简单，尽管它是为尖端用户定制的。所以不用担心。这个 Linux 发行版绝对是新手友好且清晰的。它有很多实用的默认 GUI\
  \ 应用，以及非常出色的 UI。在下载 Manjaro 时，还有选择桌面环境的选项。对于 Manjaro，大多数人倾向于 KDE 桌面。\n\n### Fedora\n\
  \nFedora 提供的两个版本是独立的。它为服务器和工作站/桌面提供了支持。它们是 Fedora Server 和 Fedora Workstation。\n\
  \n事实上，如果你想选择一个易于理解且具有学习和适应预期的智能桌面操作系统，Fedora 可能是你的首选。无论如何，如果你正在寻找一个 Linux 操作系统，当你选择\
  \ Fedora 时，你的工作站可以获得新的呼吸。\n\n## 高级用户最佳 Linux 发行版\n\n首先，在你开始探索针对尖端用户的 Linux 发行版之前，你需要习惯于研究你的方法，以解决与特定的软件包和发行器的问题。无疑，如果你是一个专家，将需要收集特定的需求。尽管如此，如果你作为一个普通用户已经使用\
  \ Linux 很久了，查看这些发行版是非常值得你花费时间和精力的。\n\n### Slackware\n\nSlackware 仍然受到许多人的喜爱，它是最老牌\
  \ Linux 发行版之一。如果你希望为自己创建一个优的环境来创建或积累程序，你可能需要考虑使用 Slackware。对于尖端用户来说，Slackware 通常是一个很不起的选择，尽管工程师和用户数量大幅减少。此外，根据目前的信息（其\
  \ Patreon 页面已证实），认为 Slackware 将继续保持其与其他现有 Linux 发行版相比的卓越地位。\n\n### Gentoo\n\nGentoo\
  \ Linux 对于任何知道如何编译源代码的人来说都是非常有必要的。然而，需要重要的专业知识来让它运行，Gentoo 是一个轻量级发行版。如果你需要关于它的某些信息，可以通过官方手册获取。尽管如此，如果你不知道自己在做什么，要利用它可能需要一些投入。\n\
  \n### Arch Linux\n\n这个发行版伴随着巨大的学习和适应预期，尽管它是一个优秀但简洁的发行版。与其不同，你需要的可能不是一次性引入。在设计框架时，你应该添加需要的软件包。此外，在没有\
  \ GUI 的情况下，在引入 Arch Linux 时你应该遵循一系列命令。同样，如果你想继续安装，在引入 Arch Linux 之后对某些基础操作有明确的理解是非常重要的。值得说，Arch\
  \ Linux 背后有一个运行良好的本地区域。因此，即使遇到问题，你也不需要有任何压力。\n\n## 老旧电脑最佳 Linux 发行版\n\n如果你不想翻新你的框架，或者有一台旧电脑闲置，你可以可以使用可用的最好的\
  \ Linux 发行版。这里是适合你旧 PC 的最佳发行版。\n\n### antiX\n\n\n\n\n作为一种轻量级的 Linux 发行版，并在某种程度上源自\
  \ MX Linux，新旧电脑都可以使用 antiX。尽管运行良好，但 antiX 的用户界面（UI）并不出色。在不需要安装的情况下，antiX 可以作为 live\
  \ CD 分发版使用，它基于 Debian。为了让你在每次重启时都不会丢失设置，你可以保存设置而不是进行不同的分发。不仅如此，利用其“持久化（Live perseverance）”元素，你的根目录也可以保存你进行的一些更改。因此，如果你希望利用\
  \ live-USB 分发版在旧设备上提供智能客户端体验，antiX 可以是你的选择。\n\n### Bodhi：\n\n与 Ubuntu 相比，它在更老旧设备上运行良好，它是基于\
  \ Ubuntu 设计并组装的。作为 Enlightenment 17 工作环境的延续，Bodhi Linux 的 `Moksha Desktop` 是其主要特性。用户在使用它时将获得流畅且直观的常规体验。在在你较旧的框架上，你也可以尝试它，尽管人们对它的评价并不是为个人用户设计的。\n\
  \n### Solus Budgie：\n\n这是一个值得的轻量级桌面操作系统，以 `Solus 4 Fortitude` 作为新的重大交付。当你需要选择其中的桌面环境时，例如\
  \ `MATE` 或 `GNOME` 在这里很常见。无论如何，在节省系统资源的同时，作为一种深受初学者欢迎的 Linux 发行版，Solus Budgie 证明自己是许多人的最佳选择之一。\n\
  \n### Puppy Linux：\n\nPuppy Linux 可能是你能看到的最小的实用程序。假设你需要你的旧框架具有快速的框架执行速度，你可以尝试它。随着一些新的实用元素的扩展，用户体验在长期以来得到了改进。\n\
  \n关于某些轻量级 Linux 发行版，你可以在此类分类中尝试的其他选择包括 `Peppermint`、`Lubuntu` 和 `Linux Lite`。\n\n\
  ## 最佳 Linux 服务器发行版\n\n支持、执行和稳定性都是选择服务器 Linux 发行版至关重要的因素。尽管如此，无论引入它是为了关键任务还是 Web\
  \ 员工，你都需要关注这些建议中的某些。\n\n### CentOS：\n\n对于 `RHEL`，你应该考虑它。不过，由于 Red Hat Linux 的源自于此，`RHEL`\
  \ 的社区版与 `CentOS` 非常相似。此外，它是免费且开源的。在某些情况下，它通常会是一个极佳的选择。尽管使用它的供应商数量较少。然而，人们对 `CentOS`\
  \ 的评价是一个可靠的 Linux 发行版，因为它的产品包是最新的。在一些云平台上可以找到 `CentOS` 镜像。你也可以选择官方提供的 `CentOS` 镜像，如果没有的话。\n\
  \n### SUSE Linux enterprise server：\n\n有必要将此程序与 `OpenSuSE` 区分开，因此没有必要强调。由社区维护的 `OpenSUSE`\
