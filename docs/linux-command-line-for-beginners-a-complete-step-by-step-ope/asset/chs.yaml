  \ 进入该领域已经有一段时间了。在 `Distrowatch.com` 上，目前 `MX Linux` 是非常受欢迎的 Linux 发行版。如果你以前没有用过它，你会对发现它的方式感到惊讶。以\
  \ `Xfce` 作为其桌面环境并依赖 `Debian`，它是一个日益流行的 Linux 发行版，与 Ubuntu 形成对比。同样，任何 Mac/Windows\
  \ 用户无疑可以使用它，因为它加载了几个 GUI 工具，尽管其出色的音效。此外，对于具有单击帮助的机构，包管理器无疑是为此身定制的。此外，作为目前包管理器中的来源之一，你会在那里看到\
  \ `Flathub`，很快，你可以在搜索 `Flatpak` 包后引入它。\n\nelementary OS：\n\n一种精细的 Linux 发行版是 `elementary\
  \ OS`。如果你有效地使用过 Mac 控制的框架，那么熟悉它并不困难，因为它的 UI 与 MacOS 有相似之处。在保持展示并看起来如预期美观的同时，提供一个易于理解的\
  \ Linux 环境是这个依赖 Ubuntu 的发行版的重点。\n\nLinux Mint：\n\n在业爱好者中，另一个著名的 Linux 是 `Linux Mint\
  \ Cinnamon`。当 Windows XP 停止服务时，许多用户选择了它，因为 Windows XP 和默认的 `Cinnamon` 桌面之间有相似之处。它拥有\
  \ Ubuntu 的应用程序，因为 `Linux Mint` 是建立在 Ubuntu 之上的。鉴于易用性和简单性，它成为了 Linux 新用户的显著选择。\n\n\
  Ubuntu：\n\n\n\n毫无疑问最为人知的 Linux 发行版是 Ubuntu，在一些可用的工作站上，你甚至会认为它是预装的。你将熟悉它的 UI。根据你的要求，即使你不经意弄乱了它，也可以很轻松地重新调整外观。大多数情况下，社区支持也是你的另一个选择。当你需要开始使用\
  \ Ubuntu 时，你应该学习一下它。此外，Ubuntu 用户拥有庞大的本地社区，无论它提供什么，你都能发现。就此，如果你遇到任何问题，可以去 subreddit\
  \ 或社区寻求帮助。你需要查看一些关于 Ubuntu 的在线教程，以便它们在几分钟内提供直接的解决方案。\n\n最后，你可以尝试上述建议的一些应用程序。此外，实际上，决定将取决于你对每一个程序的个人喜好，尽管只有极少数的\
  \ Linux 应用程序值得关注。\n\n## 服务器角色与安装类型\n\n由于其他操作系统与其有非常密切的联系，这一特性是 Linux 的一个新特性。通过这种，你可以在\
  \ Linux 旁边运行其他操作系统。在安装了其他操作系统并建立 Linux 的情况下，整个安装过程就是再次引入 Linux。当你这样做时，电脑将投入 100%\
  \ 的资源来运行 Linux。然而，作为电脑上可实现的操作系统配置特性，安装 Linux 并不困难。同样，作为一种用于在电脑上运行或安装任何 Linux 发行版的方法，你可以使用以下某些方法；\n\
  \n## Linux 全新安装\n\n这是一种常用的可用安装方法。当你进入此程序时，将从 DVD/CD 在设计好电脑硬盘后安装 Linux。然后，Linux 将在在你电脑的工作配置中运行。可用的安装方法有：\n\
  \n* `PXE`\n* `Kickstart`\n* 通过 `HTTP`、`FTP` 或 `NFS` 进行网络安装\n* `硬盘`\n\n## 作为其他操作系统内部虚拟机的\
  \ Linux\n\n在另一个操作系统内部，如果你想运行你的首选开源程序，或者需要一种简单的方法进入 Linux 工作环境，而你又喜欢当前的非 Linux 工作环境\
  \ OS，你可能需要考虑将 Linux 作为虚拟机运行。你应该下载并安装一个虚拟机应用程序作为简单的进展，尽管它有几种方法。然后，在宿主机程序下引入你的 Linux\
  \ 设备。随后，你可以在 Linux 上执行你在其他操作系统上可以做的一切。无论如何，当你的其他操作系统不支持某些功能时，Linux 有很多东西可以为你提供。\n\
  \n## 通过 Live DVD/CD 启动 Linux\n\n当你需要保留现有的工作操作系统并检查你是否喜欢它时，你可能决定通过 Live DVD/CD 尝试\
  \ Linux。作为 Live CD，某些 Linux 安装提供这种运行或下载。因此，通过 DVD/CD，Linux 将作为一个非常易启动的完整操作系统运行。此外，与其在硬盘上运行，你可以将你的文档堆到电脑的内存中。这意味着，从\
  \ DVD/CD 运行 Linux 之后不会产生任何区别，当你重启电脑时移除 DVD/CD，即可回到你框架原来的操作系统。在找到你喜欢的选择之前，你可以轻松地尝试一些\
  \ Linux 发行版。\n\n## 双启动\n\n当你需要安装 Linux 并保留当前工作操作系统时，你将拥有一个双启动框架。你将需要在引导交互期间选择你想启动的哪一个，因为你有一台可以使用两个不同操作系统的电脑。\n\
  \n此时，你应该对 Linux 有了些了解，以及使用它的某些发行版。现在是时候进一步并熟悉你的 Linux 内核以及操作系统了。\n\n# 第 3 章：Linux\
  \ 内核与操作系统简介\n\n电脑如何以如此精确和高效的方式处理最复杂的任务？总而言之，简单直接的答案是电脑通过操作系统的帮助完成一切。操作系统通过有效利用设备资源使生活变得简单并执行各种任务。在不可否定的范围内，我们可以将\
  \ OS 分两部分。第一部分是实用项目，另一部分是内核。内核根据不同用户空间的需求请求框架资源，如网络、内存、存储、CPU 等。此外，在 `Linux/GNU`\
  \ 中，该部分会对可加载内核模块进行研究。由于整个操作系统仅在内核模式下运行，这使得 Linux 内核非常稳固。每个负责执行特定任务的子系统由几个子系统组成，尽管内核是一个单一循环。广泛来说，这些任务由任何内核执行。\n\
  \n## 动态加载内核模块\n\n为了确保我们的系统是最新的，通常情况下我们会引入安全补丁和内核更新。在 `MS Windows` 上通常需要重启。然而，这并不完美。例如，当处于生产工作站时，机器无法重启。那么，在不重启框架的情况下，动态地从内核中删除或添加功能难道不是很好吗？对于内核模块，Linux\
  \ 内核通过独特的转储和堆栈进行工作。此外，在运行时，任何代码段都是你可以添加到内核的模块。在没有干扰的情况下，当系统运行时，你可以卸出和加载模块。你可以使用\
  \ `insmod` 命令逐步将模块模块链接到运行的内核中，并使用 `rmmod` 命令取消链接。\n\n## 网络\n\n操作系统的重要部分之一是网络管理，因为它处理设备之间的信息传输并允许通信。路由功能由它授权，网络包的发送、识别和收集也是通过它。\n\
  \n## 设备控制\n\n任何电脑系统都需要一些设备。尽管如此，为了让层提供功能，需要设备驱动程序来使设备可用。视频/音频驱动、蓝牙驱动、图形驱动等是存在的某些驱动程序类型。\n\
  \n## 文件系统\n\n文件系统极大影响着 `Linux/GNU` 。在 `Linux/GNU` 中，几乎一切都是文件。同样，信息的渐进关联、日志和数据压缩、取消和创建文件等都是该子系统限制的功能要求。所有基本文件系统都有\
  \ Linux 内核的支持，如 `MS Windows NTFS`。\n\n## 内存管理\n\n该子系统处理每个连接请求。页面是从可用内存中划分的固定大小片段，根据任何请求可以从或向循环分配或释放。由于它将连续的虚拟地址空间映射到实际地址空间，它还通过内存管理单元\
  \ `MMU` 映射循环虚拟位置。\n\n## 进程管理\n\n\n\n\n生命周期让该子系统处理交互。通过测量之间的关系，它允许内核之间进行信息共享和关联，同时也销毁和创建内核。同样，它通过交互调度程序实现了资源共享和时间表测量。\n\
  \n## 一些实用工具\n\n对于内核模块有用数据的管理，Linux/GNU 提供了了一些用户空间工具。现在，让我们进入它们吧。\n\n`dmesg`：尽管它是内核使用的另一种策略，但它位于任何用户空间程序显示输出的标准输出流上，即\
  \ `/dev/stdout`。为了让我们利用 `dmesg` 命令处理环缓冲区的内容，内核将其输出附加到环形缓冲区。\n\n`modinfo`：作为一个命令行工具，传递此类交互的模块通过此命令显示数据。对于模块，如果传递的文件名，它看起来像是\
  \ `/lib/modules/<version>` 注册表。此外，它以“字段：值”的设计由 `modinfo` 显示模块的每个特性。\n\n需要注意的是，内核版本是\
  \ `<version>`，我们可以通过执行名称 `- r` 命令来获取它。\n\n`rmmod`：当你需要从内核中卸载模块时，可以使用此命令。只有当当前模块未被使用时你才能卸载。此外，用于强制卸载模块的\
  \ `- power` 或 `- f` 由 `rmmod` 帮助。尽管如此，使用此选项的风险是巨大的，要删除模块，你可以使用更安全的方法。由于它会延迟到模块当前不再被使用，`rmmod`\
  \ 将通过替代方案 `-` 或 `- w` 释放模块。\n\n## 系统准备\n\n现在，是操作时间了。我们现在只需要制作一个开发环境。我们将引入基于 Debian\
  \ 的 Linux/GNU 发行版（如 Ubuntu 和 CentOS）或基于 RPM 的 Linux/GNU 应用作为必要的软件包。\n\n### CentOS\
  \ 安装\n\n作为 root 用户并执行以下命令，第一步是安装 `GCC` 编译器：\n\n```bash\n[root]# yum –y install GCC\n\
  ```\n\n现在，构建内核的包在建立级别如下：\n\n```bash\n[root]# yum –y install kernel-devel\n```\n\n\
  总而言，用于构建的下一步是 `make` 工具：\n\n```bash\n[root]# yum –y install make\n```\n\n### Ubuntu\
  \ 安装\n\n`GCC` 编译器是安装线中的第一个：\n\n```bash\n[mickey] Sudo apt-get install GCC\n```\n\
  \n然后，内核构建的包直接过来：\n\n```bash\n[mickey] Sudo apt-get install kernel-package\n```\n\
  \n然后，是 `make` 工具安装：\n\n```bash\n[mickey] Sudo apt-get install make\n```\n\n## 我们有了内核模块\n\
  \n现在，我们已经准备好了框架。然后，我们应该编写内核的底层模块。使用下面的内容，在你打开第一个文本编辑器时使用 `hello. c` 保存记录：\n\n```c\n\
  #include <linux/kernel.h>\n#include <linux/module.h>\n\nInt init_module (void)\n\
  {\nprintk(KERN_INFO \"Hello, World !!!\\n\");\nreturn 0;\n}\n\nvoid cleanup_module(void)\n\
  {\nprintk(KERN_INFO \"Exiting …\\n\");\n}\n\nMODULE_LICENSE(\"GPL\");\nMODULE_AUTHOR(\"\
  Narendra Kangralkar.\");\nMODULE_DESCRIPTION(\"Hello world module.\");\n```\n\n\
  在任何情况下，任何模块都有两个功能。清理功能是第一个定义，初始化定义是第二个。在这种功能中，清理工具是 `cleanup_module()`，而初始化工作是 `init_module()`。此外，当你加载模块并在模块被卸载之前，将需要一个初始化功能，之后需要清理功能。不同的宏，如\
  \ `MODULE_LICENSE`，非常容易遵循。类似于 `printf()`，用户空间中的语言结构是 `print()`。尽管如此，在标准的内核输出流中，它不打印消息，与\
  \ `printf()` 不同。在相同的情况下，是内核的环缓冲区获取了它附加的消息。每个 `print()` 的显示都需要。在模型中，需要 `KERN_INFO`。此外，在定义行和\
  \ `KERN_INFO` 之间，你不会看到任何逗号（`,`）。在没有实际需要的情况下，你可以使用 `DEFAULT_MESSAGE_LOGLEVEL` 需要。作为成功的标志，`init_module()`\
  \ 的最后一个定义中有返回 `0`。\n\n`cleanup_module()` 和 `init_modules()` 是清理和初始化功能的名称。尽管如此，在新内核（>=\
  \ 2.3.13）中，我们可以使用任何名称代替清理和初始化工作。为了兼容性，对这些旧名称有支持。为了使用清理和初始化工作的注册，内核提供的宏是 `module_exit`\
  \ 和 `module_init`。现在，使用我们喜欢的清理和初始化工作名称，我们应该编写类似的模块：\n\n```c\n#include <linux/kernel.h>\n\
  #include <linux/module.h>\n\nStatic int __init__ hello_init(void)\n{\nprintk(KERN_INFO\
  \ \"Hello, World !!!\\n\");\nreturn 0;\n}\n\nstatic void __exit__ hello_exit(void)\n\
  {\nprintk(KERN_INFO \"Exiting …\\n\");\nreturn 0;\n}\n\nmodule_init(hello_init);\n\
  module_exit(hello_exit);\n\nMODULE_LICENSE(\"GPL\");\nMODULE_AUTHOR(\"Narendra Kangralkar.\"\
  );\nMODULE_DESCRIPTION(\"Hello world module.\");\nMODULE_VERSION(\"1.0\");\n```\n\
  \n我们在这里得到的是清理和初始化功能建议的 `_exit` 和 `_init` 单词。\n\n## 模块加载与编译\n\n现在，应该理解模块聚合的方法。我们将使用内核的\
  \ Makefile 形式进行模块的聚合。在你将其保存为 `Makefile` 之前，你可能需要按照你的方式记录排序，随后，打开你的第一个文本处理器。在这里，你需要关注，因为你应该有一个包含\
  \ `Makefile` 和 `hello. c` 的内核模块的比较目录。\n\n为了让我们构建模块，需要内核头的先决条件。从内核源码，内核构建框架由上面的 Makefile\
  \ 提示，最后，为了完成模块，内核的 Makefile 可能会调用我们的 `Makefile`。你可以将创建的内核模块交互命名为 `hello. ko`，因为为了组装模块，每个先决条件现在我们拥有。\n\
  \n内核模块的主模块现在有效。现在，是时候检查在内核内部卸载和加载模块的最佳方法了。你应该注意，要卸载或加载模块；我们需要获取 root 用户权限。当你切换到超级用户模式并执行\
  \ `insmod` 命令来堆栈模块时你会看到：\n\n```bash\n[root]# insmod hello.ko\n```\n\n此外，`insmod`\
  \ 完成了成功工作。在任何情况下，输出对我们发现至关重要。输出附加到内核的环缓冲区。总之，通过执行 `dmesg` 命令，我们也可以发现：\n\n```bash\n\
  [root]# dmesg\nHello, World !!!\n```\n\n同样，我们可以利用 `lsmod` 命令检查模块是否加载：\n\n```bash\n\
  [root]# lsmod | grep hello\nhello 859 0\n```\n\n你所需要的一切就是在执行 `rmmod` 命令时检查 `dmesg`\
  \ 命令的输出。正如下面所示，从内核中空模块。现在，通过清理功能，你看到来自 dmesg 的消息。模块内部的一些宏为提供了模块的数据。此外，在下面一个整齐的样式，显示数据的命令是\
  \ `modinfo`。\n\n如何识别进程 PID\n\n\n\n为了让我们识别进程 ID（Process ID），即当前周期的 PID，我们可能需要从该部分再创建一个模块。在特征为\
  \ `<linux/sched.h>` 的头文件中，在 `task_struct` 的构造中，该部分的连接数据存储了所有信息。作为当前周期的标记，它提供了一个当前变量。你只需要打印\
  \ `current->pid` 变量的值即可区分出当前周期的 PID。随后，`(PID.c)`，一个完整的工作代码，将在那时被给出。\n\n在项目文档名称中，经过细微调整，就像一个唯一的\
  \ Makefile 一样的 `Makefile`。利用 `dmesg` 命令，在嵌入模块之后进行聚合，即可获得结果。\n\n## 使用模块连接多个文件\n\n\
  我们已经研究了单个记录的模块收集。然而，将模块拆分为多个文档可能非常有帮助，而且对于单个模块，在大型项目中我们会有不同的源文件记录。对于涉及两个以上文档的模块结构，我们应该理解这个周期。从\
  \ `hello.c` 文件中，我们可以将清理和初始化功能分离为两个独立的文档，例如 `cleanup.c` 和 `startup.c`。`cleanup.c`\
  \ 的变化将如下所示。然后，我们将拥有关于两个模块的精彩部分：`Makefile`。`Makefile` 显而易见。现在，根据我们的建议：利用 `cleanup.o`\
  \ 和 `startup.o` 构建最后的对象部分。这是模块收集和测试的绝佳时机。当我们使用 `modinfo` 命令时，我们可以显示模块数据。对于每个模块，作者相关数据、许可、描述和格式现在都通过\
  \ `modinfo` 命令显示。现在是时候导出并堆叠模块为最终的 `.ko` 来进行结果检查的最佳时机。\n\n熟悉模块的最佳地点是源代码部分。当你访问网页时，可以下载最新的源代码。此时，我们应该自由地详尽检查如何在虚拟机上引入\
  \ Linux。我们开始吧！\n\n## 第 4 章：在虚拟机上安装 Linux\n\n即使在尝试从现场 CD/DVD 引入 Linux 时，你可能仍然对双启动感到不确定。使用虚拟机\
  \ `VM` 来安装你喜爱的 Linux 操作系统可能会非常有帮助。这意味着硬件环境的状态是产物环境的复制。由于仅来自内部组件的限制，你实际 PC 的硬件基础就是该环境。例如，对于两个核心，可能很难在一个处理器上获得虚拟的四核心\
  \ CPU。无论如何，在准备好 CPU 的 PC 上，结果可能远优，而虚拟化可以在许多框架上实现。由于 Windows 中有几个，为了让 Linux 操作系统的建立简单，一些虚拟化工具是非常容易的。其中产生基础虚拟机应用程序的一个是\
  \ `VMware`。现在，利用 `VMware Workstation Player`，是时候 Windows 中寻找 Linux 安装周期的时候了。\n\n\
  ### VMware Workstation Player 安装\n\n在基础阶段，你应该通过访问 VMware 网站下载最新的 `VMware Workstation\
  \ Player` 设备版本。对于 64 位版本，`12.5` 的下载大小约为 80 MB。对于家庭、个人和非商业用途的评估版，你可以免费找到 `VMware\
  \ Workstation Player`。对于非营利组织和学生，从免费版获得价值就足以让 VMware 受欢迎。关于功能因素，标准的虚拟机操作在 `VMware\
  \ Workstation Player` 中都有记录。然而，对于所有级别，VMware 提供了广泛的虚拟化配置选项。\n\n然后，在你下载 `VMware Workstation\
  \ Player` 后，通常是安装的理想时机。当你从标准安装向导获取帮助时，将获得一个增强键盘驱动程序安装选项。同样，你可能还想处理此组件提供的全局控制台。为了保险起见，你会发现即使你可能不需要它也值得引入。在启动时，在继续安装向导的同时重启\
  \ Windows。\n\n### 理想的 Linux 操作系统选择\n\n对于你需要尝试的 Linux 类型，你可能已经知道了。在 `VM` 中，虽然你会发现某些\
  \ Linux 发行版并不特别合适，但另一些会。预计在 VMware 中，对于像树莓派这样的 ARM 架构，运行 Linux 发行版是不可能的。因此，对于 `x64`\
  \ 和 `x86`，你无法虚拟化 ARM。然而，是分析 `QEMU` 的时候了。\n\n### 虚拟机配置\n\n你也可以通过下载你的 Linux 操作系统继续设置你的\
  \ `VM`。当被提示时，在启动 `VMware Workstation Player` 时输入你的电子邮件地址。免费产品是这个观点的真实所在，VMware 的邮件列表让你准备就绪。当你完成该阶段后，`VMware\
  \ Workstation Player` 的基本功能将可用。此外，为了继续，你的虚拟机需要创建一个文件。`ISO` 安装程序镜像文件将是你选择的默认值。注意，有一个选项是以后通过一个空盘来创建虚拟框架从而延迟引入\
  \ OS。然后，在你建立好喜爱的操作系统后点击“下一步”。你选择的访客 OS 将随后引入关于 VMware Easy 安装的消息。\n\n### 账户创建\n\n\
  你的密码、用户名和喜爱的名称通常是你将在下一个屏幕中输入的数据。\n\n\n\n修改后的设备是屏幕上“准备制作……”的另一个选项。现在，在 HDD 之前的遥远过去，你可能需要更改虚拟机的设备。你有许多替代方案供你浏览，包括网络连接器设计、处理器和内存。你可能需要查看\
  \ `Processors`（处理器）界面。你将在右侧表格中看到 `Virtualization motor`（虚拟机引擎）的引用。这种交互现在是自动化的。考虑到所有因素，无疑，对于\
  \ `Linux`，你可能不需要担心任何事情。尽管如此，为了万一遇到任何问题，你可以将其设置为 `Intel VT-x` 或其他不同的选项。然后，在 `Memory`（内存）屏幕中，你可以管理具体的执行问题。此外，作为对你虚拟机的建议最大值和最小值，你可以看到\
  \ `RAM` 推荐尺寸的图表。遵循这些建议通常效果会很好。当你将 `Ram` 设置得过高时，几乎会减慢从运行虚拟机程序到标准框架任务的所有操作并影响你 PC\
  \ 的执行性能；而在任何情况下，设置得过小你都会遇到问题。\n\n最后，你对显示的设置需要花费一点时间。在这里，你可以选择在虚拟机中设置多个屏幕，或使用主机 PC\
  \ 的屏幕设置，因为你将开启 `3D` 速度加速。这里有一个像访客工作框架内存类似的建议总和展示，你同样可以更改设计的内存。\n\n## 在安装后在 VMware\
  \ Workstation Player 中使用 Linux\n\n在实际工作区域机器上，在虚拟机引入的工作框架中启动 `ISO` 是很平常的。你可以通过 `Easy\
  \ Install`（快速安装）技术实现整个交互的自动化，并为访客、虚拟机操作系统应用设置，你可以利用你的 `Windows` 宿主机设置。这里值得关注的，因为如果你选择稍后引入操作系统，你对工作系统的建立拥有通用控制权。然后，一旦使用\
  \ `Simple Install` 完成建立，你就可以开始使用访客操作系统，因为你将登录虚拟机。非常简单！同样，在打开虚拟机的菜单中，你可以启动虚拟机。\n\n\
  ## 虚拟机的重要性\n\n对于 `Linux` 来说，硬件在 2005 年曾是一个关键的经历。人们在 `USB` 设备、设计、`蓝牙`以及意外的遥控器方面遇到了各种问题。此外，为了让它们运行，每当新硬件出现时，你可能需要不断寻找覆盖和驱动程序。由于虚拟机似乎不是替代方案，为了任何\
  \ `Linux` 用户都能了解配置，他们应该与“真实”硬件通信。尽管如此，已经发生了无数变化。在 `Linux` 上，一小部分设备会自动工作。重点已经转向对应用程序新功能的关注，减少了对硬件支持的依赖。如果你可以不费力地尝试不同的发行版，你可以在类似的机器上详细阐述它们，而且你还是虚拟机的大客户。\n\
  \n现在，对于 `Linux` 的新用户以及他们利用它们的方式，让我们来看看虚拟机的一些优点，尽管在实践领域，虚拟机被广泛使用。\n\n## 谁需要使用虚拟机？\n\
  \n由于没有特定的专有服务和软件，一些 `Linux` 用户需要双系统启动。此外，关于充电填充软件以及许多国家政府的一些连接工作仅支持 `Windows`。为了运行\
  \ `Windows` 程序，你可以轻松地使用虚拟机，而不是通过双系统启动的痛苦和复杂。然后，只有在游戏方面虚拟机可能无法正常工作。大多数情况下，当你玩像 `Crysis`\
  \ 这样资源密集型游戏时，为了获得理想的游戏体验，你可能需要连接真实的 RAM、`GPU` 和 `CPU`。因为在硬件和应用程序之间，你不希望有虚拟层，视频和声音更改可能无法正常工作。虚拟机在这些情况以及极少数不同限制之外运行得非常出色。\n\
  \n此外，通过切换到 `Linux` 或组织他们习惯的工作系统或尝试 `Linux`，对于那些尝试作为非 Linux 用户推出改进的人来说，虚拟机可能同样有用。当他们准备好时，他们将有信心迁移，因为虚拟机会让这些人人熟悉\
  \ `Linux`。因此，在你的 `Windows 10` 或 `Mac OS` 中，你可以运行 `Linux`。最重要的是，为了在相同设备上无需重启即可切换应用程序，你可以在虚拟机上运行多个\
  \ `Linux` 发行版。与其完全依赖任何人或被供应商锁定，你应该作为一个 `Linux` 用户熟悉一些重要的应用程序。此外，在不注销切换环境的情况下，在相同的框架上，你同样可以使用虚拟机运行不同的工作基础。你可能完全不知道你的客户或经理会使用什么种操作系统。同样，在任何\
  \ `Linux` 中，你将需要一些信息，如果你想成为设计师或系统管理员，你绝对不想只了解一个发行版。此外，为了测试你的应用程序，如果你是设计师，你需要几个发行版。\n\
  \n正如你现在看到的，使用虚拟机具有一些优点。此外，使用虚拟化有一些巨大的优势，除了多系统启动外就是生产力。在不同的应用程序之间切换和设计硬盘可能会浪费你的时间。通过这种方式，这就像启动最新的应用程序一样简单，而且在不影响你工作的情况下，你可以使用虚拟机为另一个发行版启动另一个虚拟机。如果你是发行版或容器的粉丝，虚拟机可以是一种极乐。将你的注意力放在几个不同的发行版上，如\
  \ `Linux Mint`、`Fedora`、`Ubuntu`、`Kubuntu`、`OpenSUSE` 等等，无论你是否是 `Arch Linux` 用户。由于它占用空间并消耗资金，拥有几个真实的框架基本上是无法想象的。对一些多核心处理器和更多的\
  \ `RAM` 进行明智投资是值得的，运行额外的虚拟框架比购买六台实体机器。现在，如果你在相同的机器上处理几乎十二个发行版，你就不会遇到任何类型的延迟。\n\n\
  ## 要使用的虚拟机类型\n\n你有几个其他选项，包括 `VirtualBox`、`Xen`、`KVM`、`Qemu`、`VMware` 等。其他工具各有优缺点。然而，配置例如\
  \ `KVM`，无论你是否倾向于 `VirtualBox`，通常都会非常高效且更加出色。作为另一个 `Linux` 用户，你会发现 `VirtualBox` 的便利性。此外，不需要可能非常繁琐的专业知识，你访问其海量的功能和元素。由于\
  \ `VirtualBox` 可以安装在 `Mac`、`Windows` 和 `Linux` 上，跨平台支持是其最重要的利益。\n\n### 第 5 章：\n\
  Linux 用户管理和系统管理\n\n\n\n\n在计算领域，`Linux` 是一项强大的力量。`Linux` 控制着许多云工作负载、超级计算机、PC、手机和\
  \ Web 服务器。通过利用命令行界面设备和 `Linux` 设备来加固、创建、改进和维护客户报告或记录，处理 PC 框架的活动是 Linux 框架管理员的工作。由于其开源生态、高安全性和高可靠性，`Linux`\
  \ 控制着大多数的计算设备。了解和理解 Linux 框架管理员的特定特性至关重要：\n\n* 处理用户、目录和文件\n* 基础 `bash` 命令\n* 管理超级用户或\
  \ root\n* 文件系统层次结构\n* `Linux` 文件系统\n\n## Linux 管理员的职责\n\n对于需要强大 IT 设施的机构或组织来说，框架管理员是核心角色。因此，优秀的\
  \ Linux 管理员需要卓越的任任。由于每个组织可能存在额外的职责和责任，工作描述可能会有所变化。以下是 Linux 管理员的一些职责：\n\n* 当服务器出现问题时，由管理员负责调查。\n\
  * 基础安全工具和框架建立。为了在硬件需求分解后做出核心建议，管理员需要与网络工程师以及其他部门或人员协作。\n* 从登录问题到灾难恢复，Linux 管理员识别并处理协助问题。\n\
  * 针对 Linux 环境及其客户，创建、维护和改进必要的设备。\n* Linux 管理员的职责之一是以专业、先进的方式与客户、供应商和员工进行沟通。\n* 除了为\
  \ ISP、Web 和局域网客户就调查所有复杂协助问题提供卓越客户服务外，Linux 管理员还修复并分析所有错误日志。\n* 部分职责包括备份、创建新的存储策略以及数据的常规备份。\n\
  * 我们需要 `PHP`、`MySQL`、`Apache`、`RADIUS` 和 `DNS` 等支持。\n\n## Linux 系统管理员职业发展\n\n* 学习如何安装和使用\
  \ Linux 环境\n* 拥有 Linux 管理认证\n* 成为文档专家\n* 通过加入社区或本地 Linux 用户群寻求帮助和支持\n\n基本上，执行加固和处理任务（如检查硬件和编程框架）是\
  \ Linux 框架管理员的两项工作。同样，管理员应该能够可视化地描述专业信息。\n\n## 如何作为 Linux 管理员管理用户和组\n\n由于 Linux\
  \ 是一个多用户操作系统，所有用户都可以同时使用它。此外，为了在框架中管理用户，Linux 提供了一个非常好的工具。这样，与框架中的组和用户共存是框架管理员的主要能力。此外，我们将使用\
  \ CentOS Linux 环境来讨论下面使用的每个命令。\n\n### Linux 用户\n\n独特的标识符 `UID` 是一个用于唯一识别框架用户账户的并行数字。普通用户和超级或\
  \ root 用户是两种用户。标准用户将被限制访问权限，而超级或 root 用户对每项数据都有完全访问权限。超级用户可以修改、删除或添加用户账户。完整的用户数据存储在\
  \ `/etc/passwd` 文件中，哈希密钥存储在 `/etc/shadow` 文件中。\n\n### 使用设置创建用户\n\n在命令行中，通过运行 `useradd`\
  \ 命令可以添加用户。使用 `passwd` 工具在创建用户后设置口令：\n\n```\n[root@localhost handy32]# useradd enirban\n\
  [root@localhost handy32]# passwd anirban\nChanging password for user anirban.\n\
  New password:\nRetype new password:\npasswd: all authentication tokens updated successfully.\n\
  ```\n\n默认 shell 将自动设置为 `/bin/bash`，家目录将设置为 `/home/<username>`，并由系统分配一个 `UID`。每当系统添加另一个用户并使用该用户名作为组时，`useradd`\
  \ 命令会创建一个用户私有组。创建用户时，确定用户的全名。为了确定用户的全名，管理员使用带有 `-c` 选项的 `useradd`：\n\n```\n[root@localhost\
  \ handy32]# useradd –c “Anirban Choudhury” handy32\n```\n\n### 使用 UID 创建用户\n\n利用\
  \ `-u` 选项和自定义 `UID`，可以通过这种方式创建用户：\n\n```\n[root@localhost handy32]# useradd –u 1036\
  \ handy32\n```\n\n### 使用非默认家目录创建用户\n\n通过以下操作，你可以设置一个非默认的家目录：\n\n```\n[root@localhost\
  \ handy32]# useradd –d /home/test handy32\n```\n\n### 将用户添加到附加组和主组\n\n通过 `-G` 和\
  \ `-g` 选项的特定用法，可以确定一个主组和一个附加组。\n\n```\n[root@loaclhost handy32]# useradd –g “head”\
  \ –G “faculty” handy32\n```\n\n### 用户锁定和解锁\n\n超级用户可以锁定或打开用户账户。使用 `-L` 选项，你只需要调用\
  \ `passwd` 来锁定账户：\n\n```\n[root@localhost handy32]# passwd -L handy32\nFor user\
  \ handy32, Locking password\npasswd: Success\n```\n\n要打开账户，你可以使用 `passwd` 和 `-u`\
  \ 选项：\n\n```\n[root@localhost handy32]# passwd –u handy32\nFor user handy32 to unlock\
  \ password\npasswd: Success\n```\n\n### 修改用户名\n\n要更改登录用户名，使用带有 `-l` 选项的 `usermod`\
  \ 命令：\n\n```\n[root@localhost handy32]# usermod -l “nishant” handy32\n```\n\n###\
  \ 删除用户\n\n利用带有 `-r` 选项的 `userdel` 删除用户家目录和用户：\n\n```\n[root@loaclhost handy32]#\
  \ userdel –r handy32\n```\n\n## Linux 组\n\nLinux 组是一种用于分类和关联用户的系统。组 ID `GID` 是每个组的特定关联\
  \ ID，类似于用户 ID。我们有主组和附加组两种类型。主组在每个用户中有一个位置，且可以有零或多个附加组。组数据存储在 `/etc/group` 中，独立密码存储在\
  \ `/etc/shadow` 文件中。\n\n### 使用默认设置创建组\n\n作为 root 用户，运行带有默认设置的 `groupadd` 命令添加另一个组：\n\
  \n```\n[root@localhost handy32]# groupadd employee\n```\n\n使用组名，输入 `gpasswd` 假设你需要设置一个口令：\n\
  \n```\n[root@localhost handy32]# gpasswd employee\nFor group employee, changing\
  \ the password\nNew Password:\nRe-enter new password:\n```\n\n### 使用指定的 GID 创建组\n\
  \n利用 `-g` 选项，执行 `groupadd` 命令来明确确定组的 `GID`：\n\n```\n[root@loaclhost handy32]# groupadd\
  \ –g 1200 manager\n```\n\n### 移除组密码\n\n利用正确的组名，运行 `gpasswd -r` 来移除组口令：\n\n```\n\
  [root@loaclhost handy32]# gpasswd –r employee\n```\n\n### 修改组名\n\n作为超级用户，在运行 `groupmod`\
  \ 命令时使用 `-n` 选项来更改组名：\n\n```\n[root@loacalhost handy32]# groupmod –n hrsupervisor\
  \ employee\n```\n\n### 修改组的 GID\n\n配合 `-g`，运行 `groupmod` 命令来更改组的 GID：\n\n```\n[root@loaclhost\
  \ handy32]# groupmod –g 1050 manager\n```\n\n### 删除组\n\n\n\n\n在删除一个重要的用户组之前，你最初必须删除该重要用户组的成员。使用用户组名称，运行\
  \ `groupdel` 命令来删除用户组：\n\n```\n[root@loaclhost handy32]# groupdel employee\n```\n\
  \n# Linux 文件系统\n\n在硬盘上存放文档的过程称为记录框架（文件系统）。此外，Linux 支持几种记录框架，包括：\n\n* 特殊文件系统：`debugfs`、`tmpfs`、`sysfs`、`procfs`等。\n\
  * 闪存文件系统：`YAFFS`、`JFFS2`、`ubifs`等。\n* 普通磁盘文件系统：`NTFS`、`JFS`、`Btrfs`、`XFS`、`ext4`、`ext3`、`ext2`等。\n\
  \n# 文件系统的层次结构\n\n优先级链是 Linux 框架存储文档的标准设计。以下是广泛认可的 Linux 的一些目录结构：\n\n## Linux 在线手册页\n\
  \nLinux 的每一个命令都有帮助或背景支持，这是 Linux 的核心组件之一。你应该输入相应的命令来获取 Linux 的手册页：\n\n```\n[handy32@localhost~]$man\
  \ /s\n```\n\n执行此操作后，将显示手册页。\n\n## Root 或超级用户\n\n对于任何拥有广泛权限并能对 Linux 帮助或程序进行任何调整的人来说，这种记录是一种特殊的客户端账户。要成为\
  \ root 或超级用户，你将使用 `su` 命令，要进入，只需通过组合命令输入 root 密钥：\n\n```\n[handy32@localhost~]$su\n\
  ```\n\n# 目录和文件处理\n\nLinux 中的一切都是文档。因此，通过与文档相关的命令，可以在管理设备记录或标准内容文档期间与其进行交互。以下是关于文档的一些操作：\n\
  \n### 创建文件\n\n对于创建记录，有两个命令非常重要，它们是 `cat` 和 `touch`。要创建一个空记录，你可以按照下面的模型使用 `touch`：\n\
  \n```\n[handy32@loaclhost~]$touch filel\n```\n\n要查看或创建文档，你将使用 `cat`，你可以按照此步骤进行操作：\n\
  \n```\n[handy32@loacalhost~]$cat>filel\n```\n\n同样，你可以使用下面的命令来查看记录类型：\n\n```\n[handy32@localhost~]$cat\
  \ filel\n```\n\n### 复制文件\n\n要将记录从一个区域复制到另一个区域，你可以这样使用 `cp` 命令：\n\n```\n[handy32@localhost~]$cp\
  \ filel /home/sandra/Documents/\n```\n\n此命令将把当前工作目录复制到 `/home/bhargab/Documents/`。\n\
  \n### 删除文件\n\n你可以输入下面的命令来删除文档：\n\n```\n[handy32@localhost~]$rm filel\n```\n\n###\
  \ 移动或重命名文件\n\n要重命名或移动文档；你可以使用的命令是 `mv`。使用下面的命令将文档从一个位置移动到另一个位置：\n\n```\n[handy32@loaclhost~]$mv\
  \ file /home/sandra/Document\n```\n\n在 `/home/Sandra/` 下，Document 目录将利用上述命令获得 file1。然后，从\
  \ file1 改为 file2，你可以执行下面的命令来重命名文档。\n\n```\n[handy32@loaclhost~]$mv filel file2\n\
  ```\n\n### 列出目录和文件\n\n内容是 `ls` 命令，它是预定义注册表或当前索引的目录和文档。要显示当前注册表的内容，使用下面的命令：\n\n```\n\
  [handy32@localhost~]$ls\n```\n\n索引名称和记录名称一样，会被此命令记录。你可以使用下面的命令列出隐藏文档和主目录中的所有记录：\n\
  \n```\n[handy32@localhost~]$ls -a\n```\n\n带有 `/l` 选项，输入 `ls` 以长列表格式查看文档：\n\n```\n\
  [handy32@localhost~]$ls -l\n```\n\n下面，你会看到部分输出：\n\n```\nTotal of 48\ndrwxr-xr-x.\
  \ 2 handy32 handy32 4096 Jan 25 21:32 Desktop\ndrwxr-xr-x. 2 handy32 handy32 4096\
  \ Apr 24 16:33 Documents\ndrwxr-xr-x. 6 handy32 handy32 4096 Jan 20 23:55 Downloads\n\
  -rw-rw-r--. 1 handy32 handy32 1024 Apr 28 22:18 file1\n-rw-rw-r--. 1 handy32 handy32\
  \ 1024 Apr 28 22:01 file2\n-rw-rw-r--. 1 handy32 handy32 1024 Apr 28 22:01 file3\n\
  drwxr-xr-x. 2 handy32 handy32 4096 Dec 20 08:48 Music\ndrwxr-xr-x. 2 handy32 handy32\
  \ 4096 Dec 20 08:48 Pictures\ndrwxr-xr-x. 2 handy32 handy32 4096 Dec 20 08:48 Public\n\
  drwxr-xr-x. 2 handy32 handy32 4096 Dec 20 08:48 Videos\n```\n\n48 是被占用的扇区总数，如完整的\
  \ 48 所示。在每一行中，都有九段，每一段都处理了相应的权限，包括文档名称、时间和日期、字节大小、组名和连接数。\n\n权限字段中有 10 个子字段，记录类型是主字段处理的内容。(u)\
  \ 权限意味着接下来的三个字段，而组 (g) 权限是第七、六、五字段。(o) 权限的描述在最后三个字段中，具有来自 (r) 的读取权限、执行权限 (x) 和写入权限\
  \ (w)。\n\n## 软链接和硬链接\n\n在磁盘中，真实信息和记录名称之间的关联是一种连接，这些是软链接和硬链接。当你执行下面的命令时，可以创建一个硬链接：\n\
  \n```\n[handy32@loaclhost~]$ln filel file2\n```\n\n同样，通过下面的命令，创建一个软链接：\n\n```\n\
  [handy32@localhost~]$ln -s filel file3\n```\n\n### 修改\n\n对于 Linux 中的每个记录，有三种权限分别是\
  \ (x) 执行、(w) 写入和 (r) 读取。通过超级用户或记录所有者更改当前文档并不困难。为组安装写入权限，使用下面的命令：\n\n```\n[handy32@localhost~]$chmod\
  \ g+w filel\n```\n\n同样，使用下面的命令让其他用户拥有执行权限：\n\n```\n[handy32@localhost~]$chmod o+x\
  \ filel\n```\n\n当你需要从组移除执行权限时可以使用下面的命令：\n\n```\n[handy32@localhost~]$chmod g-x filel\n\
  ```\n\n### 当前工作目录\n\n下面，你通过 `pwd` 命令看到当前工作目录的演示：\n\n```\n[sandrahandy2@localhost~]$pwd/home/sandra\n\
  ```\n\n总结来说，`/home/Sandra/` 是当前工作注册。\n\n### 创建目录\n\n创建一个目录，你可以这样使用 `mkdir` 命令：\n\
  \n```\n[sandrahandy2@localhost~]$mkdir myDir\n```\n\n在 `/home/Sandra/` 下将创建一个目录。\n\
  \n### 删除目录\n\n若要删除一个空目录，你可以这样使用 `rmdir` 命令：\n\n```\n[handy32@localhost~]$rmdir MyDir\n\
  ```\n\n你还可以利用 `p` 选项删除父目录，而不仅仅是预定义的目录。\n\n```\n[handy32@localhost~]$rmdir -p myDir\n\
  ```\n\n到为止，我们涵盖了关于框架组织和 Linux 客户端的许多广泛要点。你可能需要返回并仔细阅读一段时间，以熟悉本部分讨论的许多内容。当你准备好后，可以进入下一个区域，我们将从上到下讨论\
  \ Linux 目录结构。\n\n\n\n\n在 `HDD` 上存储信息是有要求的，硬盘有几种类型，或者说几种形式，包括每台通用 PC 都有配的 `USB`。这些必要性有几个原因。无论如何，每当你关闭电脑时，`RAM`\
  \ 中的内容可能会丢失。此外，关于固态硬盘和 `USB` 闪存盘，在断电后，其中存储信息的持久性通常取决于非易失性 `RAM` 类型的容量。闪存 RAM 比其他如不可易失的标准\
  \ RAM（如 `DDR3`）等相关类别要贵得多。磁盘空间不像标准 RAM 那么昂贵，因为硬盘的信息存储通常是后文的解释。从字节成本来看，RAM 更加昂贵。磁盘和\
  \ `RAM` 的价值都在快速下降。根据单位计算，一个 `2TB` 硬盘的价格对比 `16GB` 的 `RAM`（每字节成本计算），硬盘大约比 `RAM` 便宜几倍。\n\
  \n在一些困惑且多样的方式中，来自几个领域对文件系统有大量的讨论。从报告或调查的角度来看，你应该了解其特定含义，因为该词可能有许多隐含意义。为了在明确的情况下以及根据人们的认知来使用它，我们尝试描述“文件系统”一词的一些含义。目标是根据它的几个处理方式来制定这个定义，力求符合标准的权威定义。\n\
  \n1. 特定的类型的文件系统，以及组织化的智能设备或分区，它们在 `Linux` 文件系统中可以挂载到预定义点。\n2. 特定的组织化数据存储如 `XFS`、`BTRFS`、`EXT4`、`EXT#`、`EXT2`\
  \ 等 100 文件系统类型必须被 `Linux` 支持，包括最新的和最老的。此外，为了描述访问和存储数据，这些文件系统通过其元数据结构工作。\n3. 整个 `Linux`\
  \ 目录结构的起点位于顶部的根索引 (`/`)。\n\n## 文件系统的基本功能\n\n磁盘存储作为一个需要，包含了明确的强制和动态细节。基本上，非易失性数据存储的安排是文件系统的确定能力之一之一。尽管如此，从这一要求之外，还有其他基本能力。命名空间的安排是整个文件系统都需要执行的；一种层次结构和命名方法。此外，在所有可用的字符集中，该循环刻画了你标记文档的方式，特别是你可以用来代替文件名的字符子和文件名长度。此外，在磁盘上，信息的一致性设计是它刻画的内容，记录了巨大的单个混合体，以及通过目录使用提取文件。对于该命名空间正常基础的安排，当命名空间被定义后，元数据的设计至关重要。因此，为了分组索引结构的帮助，数据结构有强制性的扩展。这些构造确保了磁盘上已使用的空间块是可用的。关于目录名称和记录的维护，允许这些的构造以及关于信息位置或区域的测量（这些区域在磁盘上与组织器一起，最后被访问或修改，以及创建的时间和大小）。对于磁盘区域精炼材料的存储，使用了其他元数据，包括智能分配和卷。它处理了设计和更复杂的元数据，这些数据独立于文件系统元数据，保持了存储在分区或驱动器上的文件系统的数据通信。\n\
  \n此外，为了对控制目录和文档等文件系统对象的系统调用进行访问权限的安排，文件系统同样需要 `API`（`应用程序接口`）。删除、移动和创建文档的任务由 `APIs`\
  \ 提供。记住你放置记录的文件系统区域，`APIs` 提供的东西之一是决定事务的计算。为了限制和加速磁盘不连续性，目标可能是此类计算的原因。例如对于索引和文档的访问权限定义，当前文件系统在指定位置也有一个安全模型。作为用户，由于\
  \ `Linux` 文件系统的安全模型，你可能拥有进入他人文档或系统的途径。为了执行这些原因，必要的编程是一个确定结构块。此外，作为一种提高开发者效率和整个系统的程序，`Linux`\
  \ 采用的是两段编程。`Linux` 的虚拟文件系统是这种当前执行的初始部分。对于访问不同类型的文件系统以及为开发者安排单一命令集，这个虚拟文件系统完成了工作。此外，特定目标硬件的接口驱动程序接收来自虚拟文件系统编程对几种文件系统的调用。执行的第二部分是文件系统选择性机器的驱动程序。在逻辑或分区卷以及特定的文件类型上，文件系统命令的标准集由设备驱动程序解析。\n\
  \n## Linux 目录结构\n\n如果你是来自 Windows 的人，`Linux` 的文件框架结构可能会显得格外特殊。现在通常使用三个字母命名，听起来神秘的目录和\
  \ `a/alternative` 取代了被忽略的驱动器字母（如 `C:\\` 盘）。刻画了一些其他 Unix 相关操作系统和 Linux 上文件框架结构的是\
  \ `FHS`（**文件系统层次结构标准**）。无论如何，`Linux` 文件系统中还包含一些尚未被标准定义的目录。\n\n### /var – 可变数据文件\n\
  \n正如在典型活动中所读的，`/usr` 目录的可写对应项是 `/var` 目录。在正常运行，我们可以向 `/var` 目录写入日志文件以及所有其他通常写入 `/usr`\
  \ 的内容。例如，在 `/var/log` 中可以找到日志记录。\n\n### /usr – 只读数据与用户二进制\n\n与系统使用的文件和应用程序相反，用户使用包含\
  \ `/usr` 目录的文件和应用程序。例如，与 `/sbin` 目录（系统组织的非自然副本区域）相比，简单应用程序区域位于 `/usr/bin` 索引。`/usr`\
  \ 目录中包含不同的目录，包括工程自由组织器，例如在 `/usr/` 中共享区域的设计。\n\n### /tmp – 临时文件\n\n当你的系统重启时，由于应用程序将临时文件存放在\
  \ `/tmp` 目录，像 `tmpwatch` 这样的工具会随时删除这些文件。\n\n### /srv – 服务数据\n\n\n\n\n“框架提供给管理员的信息”包含在\
  \ `/SRV` 索引中。如果你使用 Apache HTTP 工作进程来提供网站服务，你会将你的网站文档存储在 `/SRV` 目录内部的注册表中。\n\n###\
  \ /selinux SELinux 虚拟文件系统\n使用 SELinux，如果出于安全考虑，Red Hat 和 Fedora 在你的 Linux 发行版中使用\
  \ SELinux，那么 `registry/SELinux` 就包含不常用的文档。它等同于 `/proc`。在 Ubuntu 上，根据所有说明，这个当前的包的本质似乎是一个错误，因为\
  \ Ubuntu 并不使用 SELinux。\n\n### /sbin – 系统管理二进制文件\n该索引/容器对应于目录 `/sbin`。此外，出于框架组织，它在很大程度上被计划由\
  \ root 客户端控制，因为它包含了基础对。\n\n### /run – 应用程序状态文件\n由于需要（例如，度量 ID 和附件），为了存储临时位置，`catalog/run`\
  \ 为应用程序提供了一个标准位置，因为它是真正意义上的。由于 `/tmp` 中的文档可能会被擦除，因此 `/tmp` 无法存储这些记录。\n\n### /root\
  \ – Root 用户的主目录\nroot 管理员的主目录是索引 `/root`。作为框架 root 目录，它的区域位于 `/root` 而不是 `/home/pull`。\n\
  \n### /proc – 内核与进程文件\n由于它不包含标准文档，目录 `/dev` 等同于 `/proc` 注册表。它包含的大部分用于测量和处理数据的异常记录。\n\
  \n### /opt – 可选软件包\n对于自选的程序包，这些索引包含在 `catalog/select` 中。由于标准文件系统的优先级没有考虑它，限制性程序通常会使用它。例如，当你引入它时，它可能会在\
  \ `/select/application` 中释放独占项目的记录。\n\n### /mnt – 临时挂载点\n在使用它们时，由框架管理器挂载临时文件系统的地方是\
  \ `registry/mnt`。例如，为了执行某些文档恢复活动，如果你正在挂载 Windows 挂载，你可能很好地需要在 Windows 在 `windows/mnt/for`\
  \ 上挂载一个分段。无论如何，要挂载其他框架文档，你可以选择框架上的任何空间。\n\n### /media – 可移动介质\n嵌入到 PC 中的设备挂载的地方是子目录包含的\
  \ `/media` 目录。例如，当你将光 CD 插入你的 Linux 框架时，`/media` 注册表中自然会创建一个目录。此外，在这个目录内部，你可以访问\
  \ CD 的内容。\n\n### /lost+found – 恢复的文件\nLinux 的每个文件系统中都有一个 `lost+found` 索引。因此，如果文件系统崩溃，在下次启动时将执行文件系统检查。此外，对于广泛的信息恢复，发现的任何损坏记录都将设置在\
  \ `lost+found` 注册表中。\n\n### /lib – 核心共享库\n在 `/sbin` 和 `/receptacle` 索引中，所需的基础对是包含在\
  \ `/lib` 注册表中的库。由 `/usr/canister` 组织内部的库所需的对位于 `/usr/lib` 内部。\n\n### /home – 用户文件\n\
  对于每个客户端，索引 `/home` 包含一个主目录的记录（注：此处原文 home 译为 home，根据语境应为用户主目录）。例如，如果你的用户名是 `Greg`，`/home/Greg`\
  \ 将是主组织器的区域。客户端表达式配置文档和客户端信息记录包含在这个主组织器中。在框架上，为了让你以超级用户身份拥有不同的文档，每个客户端在任何情况下都需要获得提升许可，而他们只有对自己主组织器的写入权限。\n\
  \n### /etc – 配置文件\n尽管在文字处理器中被手动修改，配置文档的维护包含在 `/etc` 目录中。注意，框架范围配置文档包含在 `/etc/catalog`，而客户端特定的设置记录位于每个客户端的主注册表中。\n\
  \n### /dev – 设备文件\n设备被 Linux 发现为文件。因此，具有某些特殊记录表示的设备是 `catalog/dev`。然而，它们看起来像文件，正如我们众所周知的，我们不能称它们为唯一的文档。例如，在框架中，主\
  \ SATA 驱动器由 `/dev/sda` 标识。为了建议它更改 `/dev/sda`，你可以启动一个分区读取器，假设你需要将其分段为没有硬件连接的虚拟设备。同样，伪设备包含在这个目录中。例如，`/dev/arbitrary`\
  \ 产生产生随机数字。由于它不产生输出，一个特殊的设备是 `/dev/invalid`，当命令的输出被重定向到 `/dev/invalid` 时，它自然会丢失所有信息源。\n\
  \n### /cdrom – CD-ROM 历史挂载点\n一个不符合 FHS 标准的索引是 `catalog/cdrom`。尽管如此，当你去 Ubuntu 和其他操作系统时，你会发现它。对于框架中嵌入的\
  \ CD-ROM，它是一个临时区域。然而，对于短期介质的标准区域，它位于 `/media` 索引内部。\n\n### /boot – 静态启动文件\n预期启动框架的文档包含在\
  \ `/boot` 索引中。例如，存放在这里的是 Linux 部分和 GRUB 引导加载器的记录。然而它们与不同文档的区域在 `/etc` 索引，引导加载器的配置记录并不在此处。\n\
  \n### /bin – 基础用户二进制文件\n当框架在单用户模式下挂载时，基础用户对（也称为应该可用的程序）包含在 `/canister` 内部。`/usr/canister`\
  \ 包含了像 Firefox 这样的应用程序，基础工具和框架程序如 shell 位于 `receptacle` 注册表中。你可以在另一个段 `/usr` 中存储它们。然而，无论其他文件系统是否挂载，当你把这些文档放在\
  \ `receptacle` 时，你将确保拥有这些基础工具。因为它包含了框架组织的二进制对，正如 `/sbin` 索引一样。\n\n### / – 根目录\n\
  作为根目录，在 `/` 下你可以找到框架上的所有内容。在 Windows 上，`C:\\` 注册表非常像 `/`。然而，由于 Linux 没有驱动器号，这并不完全明显。在\
  \ Windows 上，虽然 `D:\\` 是另一个包的区域，在 Linux 上，另一个段出现在 `/registry` 下。\n\n## 第 7 章：处理磁盘、介质和数据文件\
  \ (gzip – tar)\n\n在使用它们之前，你应该结构化存储设备，如 USB 驱动器和硬盘，因为 Linux 的常规做法是删除和创建分区。分区在被隔离后通常具有独立的设备段。同样，你可以利用部分将硬盘分割成分离的片段，每个部分作为一个独立的硬盘工作。如果你管理几个操作系统，划分将非常有帮助。在\
  \ Linux 中，也称为磁盘分区控制，你可以使用几个强大的资源来删除或创建这种。因此我们将从底部讨论分区的最佳方法。这里有一些常用的命令如 `cfdisk`\
  \ 和 `fdisk`，正如分区之间的区别。在 DOS 分区中，只存储了一个分区表副本。在磁盘的开头结尾，GPT 保留了两个分区表副本。同样，为了配合 DOS\
  \ 分区检查分区表可靠性，GPT 使用了 `CRC` 校验和。\n\n\n\n\n\n## GPT 与 DOS 分区\n\n- **更多分区**：DOS 分区分区表通过利用扩展段和基本段仅支持\
  \ 16 个段。而 GPT 可以让你选择更多分区，理所当然，它可以支持多达 128 个分区。\n- **更大的磁盘**：有时可以实现 16TB 的容量，而 DOS\
  \ 表格分区通常只能安排高达 2TB 的磁盘空间。然而，GPT 分区表可以管理高达 8ZiB 的空间。\n- **GPT 格式**：当任务分区表、`cfdisk`\
  \ 和 `fdisk` 受到限制时，可以通过分离的排序创建全局唯一标识符分区表（GPT）。\n\n建议使用分离的排序来处理磁盘分区，因为在当前的更大的磁盘上操作它们需要更大的灵活性。通常，操作系统安装的一部分就是创建磁盘分区。当当前系统正在扩展容量设备时，直接使用\
  \ GPT 排序通常是有价值的。\n\n## 在 Linux 上使用这些命令分析磁盘空间和硬盘分区\n\n要检查框架上的分区，您可以使用一些命令。这些命令的作用之一是检查每个磁盘上存在哪些分区以及一些细节，例如文件系统、占用空间、总大小等。然而，它们也可以更改它们，有一些工具用于分配分区材料可以显示的位置，包括\
  \ `cfdisk`、`sfdisk` 和 `fdisk`。\n\n### hwinfo\n你可以利用 `hwinfo` 打印分区和磁盘列表，作为一个通用的硬件数据设备。然而，与其他命令一样，它的输出不会打印每个分区的详细信息。\n\
  \n### blkid\n尽管它不报告分区上的空间，但 `blkid` 会打印块设备、存储和分区媒体的属性，例如 `UUID` 和文件系统类型。\n\n###\
  \ lsblk\n`lsblk` 会列出光驱器和磁盘分区以及所有容量块。如果有，它会列出挂载点，最引注目的是磁盘/分区的绝对大小。在分区上，未计算空闲/已空间。如果没有\
  \ `MOUNTPOINT`，则说明文件系统尚未挂载。此外，这表示没有 DVD/CD 磁盘。带有型号和名称等设备，`lsblk` 适用于显示更多数据。\n\n\
  ### pydf\n`pydf` 是用 Python 编写的 `pdf` 高版本，并以易懂的方式打印出所有硬盘分区。同样，它仅限于显示挂载的文件系统。\n\n\
  ### df\n此命令仅打印有关挂载文件系统的信息，尽管它完全不是一个分配工具。事实上，即使不是真实磁盘分区的文件系统也是 `df` 生成的列表的一部分。当你使用它时，你会发现真实的分区或设备只是以\
  \ `/dev/` 开头的文件系统，为了筛选真实的硬盘分区或文件系统，你可以使用 `grep`。然后，使用 `df` 仅显示特定分区类型的真实磁盘分区。\n\n\
  ### parted\n如有必要，此命令会更改列表，因为它还作为另一个命令行实用程序来列出分区。\n\n### cfdisk\n鉴于具有智能 UI 的 ncurses\
  \ 界面，Linux 的分区管理器是 `cfdisk`。使用它来更改或创建当前分区，并列出这些分区。每个分区都可以通过 `cfdisk` 更改，因此，如果需要特定磁盘的细节，可以将设备名称传递给\
  \ `cfdisk`。\n\n### sfdisk\n尽管目标与 `fdisk` 相似，但带有额外元素的另一个实用程序是 `sfdisk`。每个分区的大小可以用\
  \ MB 显示。\n\n### fdisk\n对于磁盘上分区的检查，最常用的命令是 `fdisk`。就像文件系统类型一样，你可以使用 `fdisk` 命令获取分区的表示和细节。然而，每个分区大小报告可能无法\
  \ `fdisk` 获取。\n\n## Linux 数据处理\n\n如果你是那种非常习惯 Windows 的人，那么它很可能被误认为是 Linux 世界。没有图形、连接或任何可以点击的内容，几乎没有任何线索，没有向导等。此外，在进行任何操作之前，你需要知道你需要什么。假设无论你的偏好如何，你必须选择使用\
  \ Linux 的 shell 简报选项，并学习那个令人恐惧、神秘的程序，其中 xkcd 构建了其前提并不符合你的热情渴望。无论如何，为了准备你的信息，使用命令行可能具有一些合理的理由。尝试使用\
  \ Excel 来管理这些信息可能是不妥的，即使新的创新提供了 TB 级的计算机化信息和更多提供高级输出的工具。使用 CSV 记录你可能无法接近目标。然而，通过使用\
  \ Linux 上免费、简单直观的工具，可以轻松管理这些内容。这种方式的另一个理由是，Linux 出色的标准工具是免费的。\n\n尽管我们可能需要排除大部分这些，但情况下\
  \ SAS、Mathematica、MATLAB 等已经移植到 Linux，并且是一些出色的标记工具。由于它在 Linux 上运行得更好且在 Linux 上更自然，我们不能推断使用本地应用程序和工具在\
  \ Windows 上可能表现得更好。此外，有一个肯定的确认，在 Linux 上，它运行得非常一致。由于苹果和微软在金钱和时间上存在一个替代方案（通过多提供一次徒劳的升级来增加他们的利润），你不需要熟悉另一个像\
  \ clockwork 那样的界面。\n\n### 识别文件类型\n你可能不知道它是什么类型的信息，尽管这些信息可能是在实验室产生的。文件是一个可以提供一些帮助的设备，尽管它不是防呆的。响应通常将来自查询：“它是什么类型的文件？”如果有任何分析属性，文档将查看文档内部以获取它们，而不像\
  \ Windows 的文件名设计方法（扩展名）那样有一个文件名 `.typ` 指向特定类型。此外，假设在解释文档时发生了名称错误或重命名可能非常有用。\n\n\
  ### 假设\n随着 Linux 标准知名工具的建立（包括 R），理论上在 Linux 上，你接触的是一个 shell。为了此活动，可以创建一个索引。对于 `DataDir`，你可以给它引用\
  \ `$DDIR`，你可以给它任何喜欢的名称。此外，对于 shell 的 `DDIR` 变量，你应该分配一个真实术：\n\n```bash\nexport DDIR=/stephen/leo/\n\
  ```\n\n`bash>` 是 shell 命令的前缀，为了测试你的 shell，包含带有安装的注释（以 `#` 为前缀；你应该忽略它们）可以进入其中。此外，你可能需要忽略前缀\
  \ `bash>`。此外，在 UC Irvine 和直观 BDUC 的小组枢纽上，这里通常是字符化的工具。此外，对于任何 Linux 循环，你都可以免费获取它们，无论状态如何。\n\
  \n### 文件大小\n我们将使用 `redblue all.txt.gz`，这是一个 25MB 的制表符分隔信息文件。通过右键点击链接，你可以在 Firefox\
  \ 中下载它并点击“保存”。对于此操作，使用索引 `$DDIR` 来保存它。然后，使用 `gunzip blue+red_all.txt.gz` 进行解压。从那时起，通过\
  \ `ls` 即可完成总字节的结果。\n\n\n\n\n\n# 使用 Linux 挂载和卸载媒体\n\n利用 Linux 的工作机制，你可以按照此周期对媒体进行挂载和卸载。你应该知道，此周期使用的是默认的红帽（Red\
  \ Hat）发行版，而在使用其他类型的 Linux 工作框架时，命令、设计和文件名可能不会非常相似。现在，让我们进入正题吧！\n\n## 挂载 CD\n\n如果你要挂载一张\
  \ CD，请按照以下步骤操作：\n\n1. 确保你的工作站上存在 `/mnt/cdrom` 目录。如果没有该目录，你可以输入 `mkdir /mnt/cdrom`。然后，按下“回车”键。\n\
  2. 然后，输入 `mount /dev/scd0 -t iso9660 -o ro /mnt/cdrom` 来挂载 CD。再次按下“回车”键。\n\n## 挂载软盘\n\
  \n如果你需要挂载的是软驱动器，可以遵循以下命令：\n\n1. 确保你的工作站上有 `/mnt/floppy` 目录。如果没有该目录，你可能需要输入以下命令：\n\
  \   ```\n   mkdir /mnt/disk\n   ```\n   再次按下“回车”键。\n2. 你可以输入相应的命令来挂载磁盘：\n   ```\n\
  \   mount /dev/sda -o auto /mnt/disk\n   ```\n   然后，按下“回车”键。\n\n## 卸载媒体\n\n要卸载媒体，你可以遵循以下命令：\n\
  \n1. 插入 CD 并回车。\n2. 遵循以下命令：\n   - 如果你需要卸载的是 CD，可以输入以下命令：\n     ```\n     umount\
  \ /mnt/cdrom\n     ```\n     然后，按下“回车”键。\n   - 如果你需要卸载的是磁盘，可以输入以下命令：\n     ```\n\
  \     umount mmnt/floppy\n     ```\n     再次按下“回车”键。\n\n# 从命令行创建 Tar GZip 文件\n\n\
  如果你正在处理来自 Time Machine 的备份，或者需要移动文件包，创建压缩文档可能是你经常做的事情。如果你倾向于更好的压缩率和额外的高级选项，而不是易于理解且开源的\
  \ GUI zip 工具，那么命令行是你制作 gzip 和 tar 记录的极佳选择。此外，作为 Linux 组件的一部分，即使在 Mac OS X 中，其结构也是类似的。\n\
  \n## 创建 tar gzip 归包\n\n你可以利用 `/terminal/applications/` 命令行。例如，你可能通过组合某些特定命令来打包 `jpg`\
  \ 记录索引。\n\n这里的特殊情况是 `*`，意味着你可以从任何扩展名为 `.jpg` 的记录中打包 `.jpg`，仅此而已。然而，单独提供压缩的话，tar\
  \ 包会将一组记录变成一个单一文件的堆，两个特定项目后续变为 `.tar.gz` 记录。因此，gzip 压缩对于你获得 tar 包非常重要。此外，如果你需要，你可以在运行时将它们作为不同的命令。尽管如此，由于\
  \ `tar` 命令提供了 `-z` 参数，你可以自然地对 tar 记录 gzip，因此没有这种特殊要求。\n\n## 第 8 章：文件、目录管理器、权限、网络和\
  \ SSH\n\n作为一个层，大多数处理你存储在容量上的信息的工作框架是 Linux 上的任何文件系统。此外，无论你发现任何不支持的文件系统类型，如果没有它，你将不知道记录从哪里开始，文档在哪里结束。对于可以管理它的程序，你甚至可以下载它。那么，Linux\
  \ 文件系统类型有哪些？你会看到 Linux 提供了几种文件系统，例如当你尝试引入它们时看到的：`xfs`、`btrfs`、`jfs`、`ext4`、`ext3`、`ext2`、`ext`。\n\
  \n## Linux 这些文件系统是什么\n\n### Btrfs\n由 Oracle 创建，在某些发行中它不如 Ext 稳定。无论如何，如果你需要，可以想象它的替代品，而且它具有出色的性能。\n\
  \n### XFS\n在处理小文件时运行缓慢，是一个老旧的文件系统。\n\n### JFS\nIBM 开发了这个老旧的文件系统，无论记录大小如何，它的运行都很良好。然而，正如报告所示，在一段时间后它失效了，导致文档损坏。\n\
  \n### Ext4\n具有极快的速度，为大文件提供了空间。如果你在寻找 SSD 磁盘的选择，你可能需要选择它，它是你引入 Linux 时看到的建议默认文件系统。\n\
  \n### Ext3\n在反向性和改进方面，它类似于 `Ext2`。此外，由于这种文件系统没有为磁盘预览或记录恢复提供帮助，目前的工作不再使用这种文件系统。\n\
  \n### Ext2\n作为 Linux 第一个文件系统，它允许 2 ter 字节的信息空间。\n\n### Ext\n由于限制，人们已经不再使用这个老旧的版本。\n\
  \n## 高级解释\n\n既然你已经了解 Linux 文件系统，现在是时候从底层了解这些文件系统内部的良好机会了。如果你来自 Windows，引入类似 `D:\\\
  ` 和 `C:\\` 的分区是可能的，通常是 `C:\\`，因为 Windows 有这样的分区。然而，我们在以前的章节中检查过，Linux 的文件系统设计是什么？当你探索根分区\
  \ `/` 时，你会看到 Linux 文件系统的层次结构。\n\n## Linux 目录管理命令\n\n为了在 IP 位置和区域名称之间转换，我们使用的是空间命名框架\
  \ `DNS`。例如，在 Linux 框架上，对于 DNS 连接，你可能使用 `host` 命令或 `dig` 命令。同样，人们引用 Linux 记录是通过文件名而不是\
  \ inode 编号。那么，目录的实际容量是多少？它取决于你收集记录的使用。例如，你可以在 `/etc` 下执行，所有的配置记录都存放在那里。因此，在记录名与其相关的\
  \ inode 编号之间建立关联是目录的动机。此外，你会在每个目录内找到两个名为子索引：\n\n1. `..`（双点）—— 指向父目录的指针，即你当前所在目录的上一级。除了根目录外，`..`\
  \ 出现在每个目录中。此外，`..` 始终指向与 `.` 相同的 inode。\n2. `.`（单点）—— 表示当前目录\n\n为了列出目录和文档，我们可以使用\
  \ `ls` 命令，记住 Linux 中的 `..` 和 目录。\n\n```\nls -la\n```\n\n## 目录\n\n一个子目录包含在另一个索引内部。树结构指向目录的末尾，要查看目录树结构，使用\
  \ `tree` 命令：\n\n```\n$ tree /etc | less\n```\n\n与记录不同，目录有一个 `inode`。由于它将每个名称与 inode\
  \ 编号关联，它通常是一个包含记录的组织文档。在 `ext2/3` 文件系统下，注意以下目录的限制：\n\n- `Ext4` 和其他现代 Linux 文件系统中允许无限数量的子目录。\n\
  - 在单个目录中，有一个微妙的最大限制约为 10k-15k 个文件。\n- 在单个目录中，子目录的最大限制为 32768。\n\n然而，在问题的情况下，使用哈希目录记录（一项正在进行的工作）允许单个索引中存放\
  \ 100k-1M+ 个文件，正如 `ext2/3` 文件系统的权限文档所示。此外，识别目录，下面是一些常用的 shell 别名命令：\n\n```bash\n\
  alias ..='cd..'\nalias d='ls -l | grep -E “^d”’\n```\n\n\n\n\n| 命令 |  | 示例 |\n|\
  \ :--- | :--- | :--- |\n| `diff` | 比较任意两个文件的内容 | `diff old.c new.c` |\n| `egrep`\
  \ | 虽然支持扩展正则表达式，但功能与 `grep` 相同 | `egrep –I ‘err\\|cri\\|warn\\|’` `/var/log/messages`\
  \ |\n| `grep` | 在特定文件中查找特定的字符串 | `grep “nameserver”` `/etc/resolv.conf` |\n| `more`\
  \ | 每次显示一屏文本，作为分页过滤器使用 | `more /etc/hosts` |\n| `less` | 查看指定文件的内容 | `less resume.txt`\
  \ |\n| `cat` | 显示文件内容 | `cat data.txt` |\n| `file` | 检测指定文件的内容类型 | `file /etc/resolv.conf`\
  \ |\n| `find` | 在给定目录中搜索文件 | `find $HOME –name “hello.c”` |\n| `locate` | 查找指定文件所在的目录\
  \ | `locate file!` |\n| `chmod` | 更改访问权限 | `chmod 0444 dir1` |\n| `chgrp` | 使用指定的组名，将给定文件的组所有权转移给组\
  \ | `chgrp dir1` |\n| `chown` | 使用指定的用户名，转移文件的所有权 | `chown username file` |\n| `ln`\
  \ | 从源到目标创建内部链接 | `ln –s /etc/hosts/tmp/link` |\n| `rm` | 从文件系统中删除指定文件；除非使用 `-r`\
  \ 选项，否则 `rm` 不删除目录 | `rm files!` `rm –r dir1` |\n| `cp` | 将源复制到目标 | `cp –r dir1\
  \ /path/to/dir2` |\n| `mv` | 复制到目标后删除源文件 | `mv dir1 dir2` |\n| `cd` | 不带参数时，`cd`\
  \ 切换到用户主目录 | `cd` |\n| `pwd` | 此命令显示工作或当前目录的名称 | `pwd` |\n| `cd ..` | 返回上一级目录 |\
  \ `cd ..` |\n| `cd` | 切换当前目录 | `cd /etc/` |\n| `rmdir` | 如果目录为空，则删除指定的目录 | `rmdir\
  \ dir1` |\n| `mkdir` | 通过此命令创建新目录 | `mkdir dir1` |\n\n# 管理目录\n\n既然你可以在 Nautilus\
  \ 中复制、移动、删除或创建目录，你还应该学会如何利用终端（shell brief）命令来处理你的文档索引以及识别记录目录等内容。\n\n### 创建目录\n\n\
  为了创建一个新的子目录，你需要了解如何编写相应的命令。它位于 `/temp/catalog` 和主注册目录中，就像大多数客户端的子目录中的这些权限一样。你可以探索你的新目录，以便利用\
  \ Nautilus 创建唯一的注册项。在窗口的空白处右键点击，然后选择新建文件夹。此时，使用带有特定内容的无标题文件夹，会出现另一个组织器符号。在按下“回车”键之前，请确保给这个新组织器起一个名字。当你尝试使用终端来创建一个唯一的目录时，你只需要使用\
  \ `mkdir` 命令。你可以通过 `mkdir <directory-name>` 将 `<directory-name>` 替换为新目录的计划标题。\n\n\
  ### 删除目录\n\n你可以在桌面上右键点击并将其移动到回收站。你还需要 `rmdir` 命令来删除一个空索引。\n\n### 点目录（Dot directories）\n\
  \n点文件对于以“点”开头的应用程序至关重要。通常，这些索引是用户特定的。\n\n# Linux 文件权限\n\n由于多个用户可以同时访问，并且作为一个多用户框架，Linux\
  \ 是 UNIX 的克隆。此外，如果不进行调整，任何人都可以访问、更改或未经授权的访问，这会引发安全问题。考虑到这些，Linux 为了确保安全将权限分为两个级别，它们分别是：\n\
  \n1. 权限 (Permission)\n2. 所有权 (Ownership)\n\n在 Linux 中，基本思想是拥有和许可。我们将从所有权开始讨论，并将两者进行分析。\n\
  \n# Linux 文件所有权\n\n你的 Linux 框架上的每个注册项和记录允许 3 种所有者。\n\n### 组 (Group)\n\n一个用户组中包含许多用户。此外，所有属于该组的用户将被授予对文档的访问权限。你可以随意将所有用户添加到组中，而不是物理地为每个用户分配权限。\n\
  \n### 用户 (User)\n\n文件的所有者是一个用户，如果你是创建该记录的人，那么你就是所有者。因此，作为所有者，你也可以称为一个用户。\n\n###\
  \ 其他 (Other)\n\n这种情况关注的是其他用户如何访问文档。这类用户不属于拥有该文件的组，也不是创建该文档的用户。通常，这可以是任何其他人。因此，当你为其他人设置权限时，这也被设置为“世界权限”。\n\
  \n\n\n\n\n*   `Execute`（执行）：正如你可以可行运行它一样，在 Windows 中你有一个带有 `.exe` 扩展名的可执行程序。然而，在\
  \ Linux 中，除非设置了执行权限，否则你将无法运行应用程序。此外，即使你设置了写入和读取权限，你也无法运行它，但在任何情况下你都可能有调整或查看程序代码的。\n\
  *   `Write`（写入）：你将通过写入权限更改记录的内容。同样，在目录中，你可以作为写入权限权力的一部分，对记录进行重命名、删除和添加。你可以预知记录存放的位置，但对索引没有控制权，且你需要对文档拥有写入权限。文档内容可以由你调整。在任何情况下，你都无法从目录中删除、移动或重命名记录。\n\
  *   `Read`（读取）：你可以通过此权限赋予的权力来查阅和打开文档。此外，由于你拥有理解权限，你还可以列出注册表的内容。\n\n# SSH 命令\n\n\
  从根本上说，`ssh` 命令在每个 Linux 框架中都被记录。`ssh` 客户端通过此命令连接到远程机器，从而实现与 `ssh` 服务端的安全连接。从远程机器到登录，`ssh`\
  \ 命令用于在远程设备上执行命令并在两台电脑之间移动传输记录。\n\n## Linux 中的 SSH 命令\n\n在不可靠的网络和两台主机之间，通过 `ssh`\
  \ 命令建立一个安全的加密连接。此外，对于隧道不同的应用程序，它通常被用于文件传输和终端访问。从远程区域，你可以通过 `SSH` 安全地运行图形化 X11 应用程序。\n\
  \n## 其他 SSH 命令\n\n除了客户端 `ssh` 之外，还有其他 SSH 命令，每个命令都有自己的帮助页面：\n\n*   `sshd` – OpenSSH\
  \ 服务器\n*   `sftp` – 带有 FTP 相关命令接口的文件传输\n*   `scp` – 带有 RCP 相关命令接口的文件传输\n*   `ssh-add`\
  \ –向代理添加密钥的工具\n*   `ssh-agent` – 用于持有私钥以单点登录的代理\n*   `ssh-copy-id` – 将公钥配置为服务器上的授权密钥\n\
  *   `ssh-keygen` – 为公钥认证创建密钥对\n\n## 第 9 章：Linux 终端、编辑器和 Shell\n\n你可以发现帮助信息，首先是终端，无论你是已经使用\
  \ Linux 一段时间还是 Linux 的新用户。毫无疑问，终端是一个拥有许多特性的强大工具，而不是什么能让你恐恐的东西。你实际上并不是通过阅读单本书或文章就能学会你真正需要的关于终端的所有知识的。亲手操作终端需要见解。\n\
  \n## 终端的基本用法\n\n当你启动终端时，会在工作区的应用程序菜单上看到 `bash` shell。同样，自然地，尽管有不同的 shell，但 `bash`\
  \ 是大多数 Linux 发行版使用的工具。简而言之，通过输入它的名称，你可以启动一个程序。然后，它涵盖从命令行工具到图形化应用程序的每一个程序，例如你在这里启动的所有\
  \ `Firefox`。然而，这些功能是程序通用的，对于基础文档面板，`bash` 具有一些隐式命令。此外，启动它时，你不必输入完整路径，这与 Windows\
  \ 上不同。例如，当你在 Windows 上尝试打开 Firefox 时，你需要输入指向 Firefox 的 `.exe` 文件的完整路径。在 Linux 上，你可以输入下面的命令：\n\
  \n```bash\nfirefox\n```\n\n运行它，在输入命令后，尽管按“回车”键。在 Linux 上，程序没有文件扩展名，没有必要添加 `.exe`\
  \ 或其他什么。此外，处理参数对于终端命令是至关重要的。你可以使用关于程序的特定参数。例如，网络地址会被 `Firefox` 视为参数。\n\n## 安装软件\n\
  \n从终端安装软件可能是最高效的操作。某些终端命令在后台使用的华丽前端（如 Ubuntu 软件中心）是终端应用程序的产物。然后，你可以通过终端基础来引入它们，而不是通过选择和点击应用程序来逐一完成。同样，你可以通过一个特定的命令引入几个应用程序。由于你可以通过不同的发行版看到内核框架的包，因此当你计划在\
  \ Ubuntu 上引入另一个软件包时，可以遵循以下命令：\n\n```bash\nsudo apt-get install packagegename\n```\n\
  \n然而，它的工作原理与上面的 `firefox` 命令一样，可能有点复杂。在具有 root（管理员）权限的情况下，在执行 `apt get`、`sudo` 之前，你可以执行上面的行。安装名为\
  \ `packagegename` 的包是 `packagegename` 通过解析可获取的程序将引入的内容。尽管如此，同样的是，你也可以指定不同的包。例如，你可以执行下面的命令来安装\
  \ Pidgin 即时通讯工具和 Chromium 浏览器：\n\n```bash\nsudo apt-get install chromium-browser\
  \ pidgin\n```\n\n此外，如果你在安装 Ubuntu 后需要安装所有常用的编程工具，可以使用像上面那样的单个命令完成。由于你可以理智地快速确定它们，只需要知道你喜爱的项目的包名即可。同样，借助\
  \ tab 键功能，你的假设可以得到完善。\n\n## Linux 桌面版文本编辑器\n\n这使得某些文本处理器也可以兼任 IDE 非常有用。同样，它们是默认编辑器。在\
  \ Linux 环境以及开发应用程序的 Linux 桌面环境中，这些非常有用。重点将放在几个文本管理器上，尽管那里有很多文本处理器。考虑到，我们应该直接进入它们：\n\
  \n### GNU Emacs\n\n对于 Linux 环境，最著名的文本管理器之一是 `GNU Emacs`，它已经存在了很长时间了。GNU 项目的作者 Richard\
  \ Stallman 是创建它的人。从地球的一端到另一端，大量的 Linux 开发者以此为他们最喜欢和最喜爱的文本管理器。通过使用 `C` 和 `LISP`，他们可以培养它。在\
  \ Linux Mint 或 Ubuntu 上引入 `emacs`，可以使用下面的命令：\n\n```bash\nlinuxtechi@linuxtechi:~/Downloads$\
  \ sudo apt-get update\nlinuxtechi@linuxtechi:~/Downloads$ sudo apt-get install emacs\n\
  ```\n\n`GNU Emacs` 有一些内置的特殊组件，包括：\n*   广泛的支持和文档\n*   调试器接口扩展\n*   新闻和邮件选项\n\n对于\
  \ Linux 桌面，除了这些文本处理器，`Atom` 和 `notepadqq` 也可以作为 IDE 和文本编辑器。\n\n### Nano\n\n在 UNIX\
  \ 工作框架中另一个常用的文本工具是 `Nano`。它于 2000 年发布，相当于 Pico 文本管理器。同样，为了使其成为一个高级且强大的文本工具，它加载了一些额外的功能。此外，它的界面仅仅是它可以在命令行中运行。以下是\
  \ `Nano` 的一些独特特性：\n\n*   Autoconf 支持\n*   Tab 补全\n*   自动缩进\n*   区分大小写的搜索\n\nKwrite\n\
  \n\n\n\nKwrite 于 2000 年首次向公众发布，由 KDE 培养了这款文本编辑器。来自 KDE 并结合 KParts 的创新，它完全基于 Kate\
  \ 的内容工具构建。这使其成为一个极其卓越的改进环境；通常，你可以通过安装额外的模块来扩展 Kwrite 的实用性。此外，除了编码文档之外，它很好地用于修改远程文件。在\
  \ Linux Mint 或 Ubuntu 上，安装 `kwrite` 请使用以下命令：\n\n```\nlinuxtechi@linuxtechi:~/Downloads$\
  \ sudo apt-get install kwrite\n```\n\nKwrite 的一些独特功能是：\n\n* vi 输入模式\n* 语法高亮\n* 自动缩进\n\
  * 单词补全\n\n## Eclipse\n\nEclipse 编辑器对于前端开发者和设计师来说，是一个高级且强大的代码/文本编辑器备替代方案。由于它包含了一些帮助高效创建和编写\
  \ Java 应用程序的组件，因此完全是用 Java 创建的。同样，它在 Java 开发者中非常流行。对于任何需要额外语言支持的人，如果他们需要，可能需要安装额外的模块。通过嵌入额外的模块，编辑器可以拥有一些高级功能，这使得\
  \ Eclipse IDE 变得更加强大。此外，对于 COBOL、Ruby on Rails、C++、C、Python 和 PHP 项目开发，你也可以使用它。要在\
  \ Linux Mint 或 Ubuntu 上安装它，请使用以下命令：\n\n```\nlinuxtechi@linuxtechi:~$ sudo apt update\n\
  linuxtechi@linuxtechi:~$ sudo apt install eclipse\n```\n\nEclipse 的一些独特组件是：\n\n\
  * 插件支持\n* 为 Java 开发者包含了 Java 开发工具\n* 开源免费的文本编辑器\n\n## Kate\n\n作为 Kubuntu 环境的默认管理器，如果你熟悉\
  \ Kubuntu 工作环境，你可能需要考虑 Kate 内容工具。鉴于你可以将其作为一个出色的 IDE 使用，你还有机会同时处理多个文档，因为该内容工具易于使用，而且轻量级。使用以下命令在\
  \ Linux Mint 或 Ubuntu 上安装 Kate：\n\n```\nlinuxtechi@linuxtechi:~$ sudo apt-get install\
  \ kate\n```\n\nKate 有一些独特的组件，它们是：\n\n* 自动为文档设置缩进\n* 自动检测语言\n* 支持多种语言\n* 强大的 IDE\n\
  \n## Gedit\n\nGedit 默认作为文本编辑器内置在 GNOME 工作环境中。Gedit 遵循了相关目标，因为它具有简洁的 UI，并且是轻量级的，这与\
  \ GNOME 持续提供直接且清洁功能的目标一致。在 GNOME 工作环境中，普通用户访问它直到 2000 年才出现。它完全支持国际化文本，因为它完全使用 C\
  \ 语言开发。Gedit 有一些新颖的组件，它们是：\n\n* 支持多种编程语言\n* 支持国际化文本\n* 语法高亮\n\n## Brackets\n\n对于\
  \ Linux 环境，Brackets 于 2014 年由 Adobe 作为内容工具发布。它拥有丰富的组件，使得作为一个开源内容管理器，使用这款编辑器变得充满乐趣。凭借整洁的界面，它也易于使用。为了让开发者和网站专家获得真正必要的帮助，它被设计为代码编辑器和内容工具。\n\
  \n他们完全使用 JavaScript、CSS 和 HTML 来开发它。由于其复杂的特性，一些优秀的文本编辑器可能无法满足它拥有的每一个元素，即使在轻量化方面。在\
  \ Linux Mint 或 Ubuntu 上安装，你可以使用以下命令：\n\n```\nlinuxtechi@linuxtechi:~$ sudo add-apt-repository\
  \ ppa:webupd8team/brackets\nlinuxtechi@linuxtechi:~$ sudo apt-get update\nlinuxtechi@linuxtechi:~$\
  \ sudo apt-get install brackets\n```\n\n该内容工具有一些非常的组件，它们是：\n\n* 专注于视觉工具预处理器支持\n\
  * 内联编辑\n* 实时预览\n\n## Sublime text editor\n\n对于 Linux 环境，这样一个备受推目的管理器是一个优秀的文本编辑器。你可以将其作为开发环境以及文本编辑器使用；它包含了许多组件。除了不同的标记语言，它还支持大量的编程语言。此外，通过扩展其实用性，许多可用模块使得该内容工具更加现代。你可以通过“Goto\
  \ Anything”组件探索框架中的任何文档，或高效地探索代码区域，这是该内容工具的特殊特性之一。在 Linux Mint 或 Ubuntu 上安装这款优秀文本编辑器的稳定版，你只需要引用某些特定命令。这款卓越管理器的一些可选组件是：\n\
  \n* 项目特定偏好\n* 代码并行编辑\n* 基于 Python 的插件 API\n* 优秀的命令面板\n\n## Geany\n\n对于 Linux 环境，一个通常被认为结合\
  \ GTK+ 工具箱的文本编辑器是 Geany。对于设计师和软件工程师，Geany 也可以作为一个出色的开发环境。如果你需要一个开发环境和一个内容工具，Geany\
  \ 可能是你的合适选择。它不需要引入不同的包就能运行得很好，因为它支持几乎所有主要的编程语言，并且是轻量级的。在 Linux Mint 或 Ubuntu 上安装\
  \ Geany，你只需要引用特定的命令。Geany 有一些卓越的元素，它们是：\n\n* 易于插拔的界面\n* 便于跟踪代码的行号\n* 许多自定义选项\n*\
  \ 便于开发的语法高亮\n* 清洁且易于使用的界面\n\n## VIM\n\n如果你喜欢许多选择和惊人的执行力来在高级文本编辑器中更改内容，那么 Vim 将是你的理想选择，因为\
  \ Linux 默认的 \"vi\" 编辑器可能会让你精疲力竭。作为 Linux 默认文本编辑器的高级形式，`vim` 的意义正如其名：“改进版的 vi”。他们在规划时将工程师的特殊需求作为要考虑。同样，由于其极具可配置性的选项，它被称为开发者编辑器。你可以作为一个独立的\
  \ GUI 应用程序或命令行工具使用，这等同于 Vi 编辑器。这里是 VIM 的一些特殊元素：\n\n* 自动命令\n* Digraph 输入\n* 分屏显示\n\
  * 会话屏幕\n* 标签页扩展\n* 标签系统\n* 语法着\n\n## Linux Shell 简介\n\n如果你在使用任何主要的操作系统框架，你就在与 shell\
  \ 交互。此外，每当你使用终端并运行 Linux Mint、Ubuntu 或其他 Linux 发行版时，你就在与 shell 协作。在我们继续之前，有一些非常基础的语句，我们将在下一章节中探讨细节。\n\
  \n## 第 10 章：\n\n基础 Linux Shell 命令\n\n\n\n\n在 Linux 上，用于交互的工具是 shell（终端）。在终端模拟窗口中，程序交互的界面就是\
  \ shell。在 Linux 上，工作站的 `mate-terminal` GUI 就是模拟窗口。此外，它也可以像 `PuTTY` 或安全外壳客户端这样的应用程序；`SSH`\
  \ 是一个在 Windows 框架上的安全框架，通过它你可以连接到 Linux。在某些业务或权限设置中，他们使用布尔恩再次外壳（Bourne Again Shell），即\
  \ `bash`。如果你愿意，可以浏览一些可用的 shell，如 `TC-Shell`、`C-Shell` 以及 `Bourne Shell`。尽管具体组件各不相同，但它们都具有相似的属性。`bash`\
  \ 具备以下特性：\n\n*   由于它会记录最后几条命令，shell 的历史记录工具非常实用。无需引用编号，你可以使用 `history` 命令来列出之前的命令。\n\
  \n    为了重新运行某条命令，你可以在工作站的终端复制窗口中从 `history` 重新排序。同样，若要重新运行历史中的任何命令，可以使用图像 `\"I\"\
  `。\n\n*   shell 还有“后台控制”功能，在后台你可以运行任何不需要与终端交互的项目。\n\n    shell 允许在后台立即运行不同的命令和程序排序。在这种情况下，shell\
  \ 会打印后台作业号 `\"1\"`，例如 `\"3470,\"`，这是进程标识号。由于它在前台区域运行，你也可以使用常用的快捷键 `Ctrl + z` 挂起程序。然后你可以使用\
  \ `FG` 让它在前台继续运行，或者使用大符号 `&` 将程序置于后台。如果后台有多个正在运行或挂起的项目，你可以通过它们的作业号来引用它们。因此，利用作业号可以列出所有停止或后台运行的任务状态，以查看你的任务及其作业号。\n\
  \n*   你可以编写 shell 命令的内容，并像聚合项目一样，只需通过命名它们就可以像那样调出它们。例如，我们首先可以在 `~/receptacle` 中创建一个记录，其中包含特定的命令，以统计该新目录中\
  \ C 程序文件的数量。\n\n    在像普通一样运行它之前，我们可以使用 `chmod` 命令使文件具有可执行性。\n\n*   如果-else 语句、循环，请记住\
  \ `bash` 是一种解释型编程语言。当你输入下方的命令时，你将获得更多关于 Linux 在线文档的提示：\n\n*   shell 具有数值和字符串类型的变量。\n\
  \n    主目录的索引是 `$HOME` 变量，输入它为某些变量设置默认值，并查看一组命令。\n\n*   你可能觉得输入很繁琐，或者为了经常执行特定的命令或命令组；你可能需要分配别名。例如，在新目录中，为了统计\
  \ C 程序文件的数量，我们可以为利用 `wc` 输出的行数计数分配别名 `\"counts\"`，并利用 `ls` 记录文件。\n\n*   为了将一个程序的输出管道到另一个程序的输入中，shell\
  \ 具有这种功能。`\"│\"` 是管道线的符号。例如，在 `wc` 程序中，我们可以在读取文件后对输出进行管道处理，以便包含记录 A 中的单词数。\n\n*\
  \   标准输出（stdout）和标准错误（stderr）是大多数 Linux 项目和命令遵循的概念。程序组合的输出流是标准输出，程序读取的信息流是标准输入。在大多数情况下，配合终端是这些操作很大的一部分，因此你的屏幕可以获取这些输出，而信息是通过控制台获取的。你可以通过\
  \ shell 将标准输出重定向到输出。\n\n*   在你新的目录中，为了匹配文件名，shell 将扩展通配符。例如，你可以使用特定的命令来创建一个名为 `\"\
  anything. c\"` 的文件记录。\n\n*   文件名通过命令拥有的路径字符串进行处理。例如，在你的主目录下，命令可以将当前目录更改为 `\"canister\"\
  `，波浪号 `~` 的意义是 shell 是你的主目录。\n\n*   为了识别它，循环涉及检查组件是否与命令关联，然后可以通过输入命令名称来查找各种注册。这种查询方式就是它所意味着的，并且记住当前的索引是搜索路径，它的子目录\
  \ `\"container,\"` 以及你的主目录。此外，通过输入它们的名称，你可以在编写完项目后调用它们。无论你当前在哪个目录，只要在目录中存储了此类程序，它就会被找到并运行。\n\
  \n*   通过命名它们，你可以调用命令。大多数 Linux 命令本质只是由 shell 执行的程序。例如，`ls` 命令可以列出其文件的名称并读取新目录，当你运行它时，你会得到一个特定的结果。\n\
  \n*   shell 像不同的项目一样，也有一个相关的当前目录（当前工作目录）。在查找文件时，作为第一步，运行在 Linux 上的程序会使用当前目录。在 Linux\
  \ 文件系统中，可以使用 shell 的 `cd` 命令通过更改当前目录进入另一个区域。\n\n*   用户可以设计此快捷命令。位于 `\"bash\"` 之前的\
  \ `$` 符号（ `bash` 程序的提示符）是默认提示符。\n\n使用上方向键控制，你可以利用 `bash` 的额外组件来更改和查看之前的命令。在终端顶部，一旦你按下上方向键，最后一条命令就会重新显示，要获取之前的命令，再次按下上方向键。按下\
  \ `\"RETURN\"` 重新执行命令。你可以在命令内部嵌入字符，或通过使用退格键移动光标来删除字符，或从末尾使用删除键删除字符，在重新运行命令之前进行修改。\n\
  \n### Shell 命令\n\n在下方，你将找到可用命令列表。对于每个命令，手册页（manual page）上的参考可以提供更多细节。可以使用 `man`\
