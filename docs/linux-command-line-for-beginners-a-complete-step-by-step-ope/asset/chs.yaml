  \ $? 的环境选项，此外，它的内容需要足够的感知，而最后一条命令的执行结果是 $? 将包含的退出状态。\n\n但要分别返回 0 和 1 的退出状态，错误和真实命令是保持静态状态的程序。此外，对于之前的程序，退出位置是\
  \ $? 环境选择中所包含的内容。随后，检查退出类（class）是非常重要的。\n\n此部分分析了磁盘内容的退出级别，在标准错误情况下，如果不是 0，我们可以打印错误信息；如果以\
  \ 1 作为退出状态，则结束内容。尽管如此，通过使用更智能的方法，我们可以节省几次编写尝试，因为这是处理紧急情况的一种强有力解决办法。因为它评估的是提供的退出状态命令，我们可以使用断言（assertion）作为如下的方法来处理该尝试。\n\
