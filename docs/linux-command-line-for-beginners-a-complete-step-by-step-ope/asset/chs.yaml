  \n#### 保存后运行脚本\n\n在屏幕上，`./hello.sh` 命令显示错误消息。因为你没有为 `hello.sh` 脚本设置执行权限，它可能无法运行内容。\n\
  \n#### Chmod 命令\n\n要更改文件的访问权限，你可以使用 `chmod` 命令。如下是语法结构：\n\n`chmod ugo+rwx filename`\n\
  \n其中：\n* `x`: 执行权限\n* `w`: 写入权限\n* `r`: 读取权限\n* `=`: 覆盖当前权限\n* `-`: 移除权限\n* `+`:\
  \ 添加权限\n* `o`: 其他\n* `g`: 组\n* `u`: 用户\n\n以下你可以通过数字方式通信授权：\n* `0`: 完全没有权限\n* `7`:\
  \ 读取、写入和执行权限\n* `1`: 执行权限\n* `2`: 写入权限\n* `4`: 读取权限\n\n### 错误\n\n程序的强度通常是用来区分良好和坏程序的动作。因此，当情况变得糟糕时，这是程序处理这些情况的能力。\n\
  \n#### 退出状态\n\n在完成时，返回退出状态是每个编写良好的程序所做的。当程序有效结束时，零是退出状态。那么，在此时，由于某种原因，如果退出状态不是零则程序失败了。检查你调用的内容的程序退出状态。此外，当它们结束时，你应该从退出状态中获得巨大的收益。显式代码如\
