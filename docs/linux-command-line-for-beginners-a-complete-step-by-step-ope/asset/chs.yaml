  ## 第 13 章：基础 Bash Shell 命令\n\n在某种情况下，目录将通常是一个没有父索引的根注册表，或者在一个单独的注册表中，它是被称为“父”的子目录。因此，当前的文件系统具有组织或注册表树。此外，通常可以通过从子目录进入父索引来访问根注册表，这是通过记录树反向遍历的常规。然而，Unix\
  \ 和 Unix 类框架只有一个 `\\.`（根目录），例如 Windows 驱动器：`A:\\`、`C:\\` 等，某些文件系统有多个根注册表。\n\n###\
  \ `pwd` / `ls` / `cd`\n\n当我们提到工作索引或当前目录时，客户端在文件系统内部工作时始终位于某些注册表中。使用 `pwd` 可以打印客户端的工作索引。使用\
  \ `ls` 列出文件和子目录等，即该注册表的内容。在这里，你需要关注以下部分内容：\n\n- 而不是 `ls -1 –a`，你有时可以组合标志，如 `ls –la`\n\
  - 使用多个标志的组合，例如 `ls –l –a`\n- 使用 `ls –l` 显示文件详情\n- 使用 `ls –a` 显示隐藏（以点开头）的文件\n\n利用\
  \ `cd`（切换目录）切换到另一个目录和父注册表，磁盘的缩写是 `cd`。回到主目录 `/home/username` 或类似的注册表，`cd ~` 或直接使用\
  \ `cd` 就会切换磁盘。对于这个索引，`cd.` 可能没什么效果，因为 `.` 是缩写。使用 `cd -` 返回上一个索引。此外，通过使用 `cd ../`\
  \ 等，你可以返回不同的目录级别。回到用户主目录，`cd ~user` 表示目录。\n\n### `;` / `&&` / `&`\n\n命令是你输入到命令行并存储在电脑某地方的条目；它们通常执行某些机器码。有时，底层的\
  \ Linux 命令是这些机器码，而在其他地方，是你自己的一些代码，可能是一个应用程序。偶尔，我们需要运行一条命令，我们也可以使用 `;`（分号）来实现：\n\n\
  分号的作用是首先执行第一个(`ls`) 记录工作目录的内容，然后执行第二个(`pwd`) 打印它的区域。然后，可以使用 `&&` 来链接命令，这是另一个有用的工具。如果左侧的命令失败，右侧的命令将不会运行。同样，你可以在很多时候使用\
  \ `&&` 和 `;`。\n\n无论第一个是否失败，后续的都会使用 `;` 运行。`&` 在任何看起来像 `&&` 的情况下都有一个独特的功能。通常，在你执行一个长时间运行的命令时，在允许你输入另一个之前，命令行会等待该命令完成。你可能想在一个较长的命令仍在运行时执行另一个命令，通过在命令后加上\
  \ `&` 就可以防止这种情况发生。\n\n有一点很重要，当我们在命令后使用 `&` 来隐藏它时，我们期望该交互或操作是在“后台”运行的。然后，使用 `jobs`\
  \ 命令查看哪些后台任务正在运行。\n\n### 获取帮助\n\n`man`\n\n为了让你获取该命令的手册（带有 `q` 退出 man），在几乎任何命令之前输入\
  \ `man`。\n\n- `- h`\n- 同样，为了为该命令调帮助菜单，请输入 `- help` 或 `-- h`。\n\n### 查看和编辑文件\n\n\
  `nano` / `nedit`\n\n对于需要精通 1,000,000 种路线的人或学者来说，作为一个具有中等功能的命令行内容工具，`nano` 是一个出色的编辑器。对于初期的编码职业生涯，它对任何设计师或开发者来说都是足够的。由于它考虑了语法结构功能、直观的点按式编辑，它打开了一个\
  \ X Window 作为一个小的图形校对器。当你打算对内容实施某些更改并重新运行它时，你可能需要使用它。此外，`Notepad++`、`gedit`、`vim`、`vi`、`emacs`\
  \ 以及其他一些常见的编辑器，如图形界面 UI GUI 或命令行界面 CLI。还有 `VS Code`、`Light Table` 和 `Micro`。语法结构功能、查找和替换以及一些其他功能是所有高级编辑器提供的基本配置。然而，`nano`\
  \ 和 `edit` 的元素没有 `emacs` 和 `vi(m)` 那么多，它们对吸收信息的预期通常会极端得多。在评估几个不同的编辑器后，你会找到适合你的那一个。\n\
  \n`head` / `tail` / `cat` / `less`\n\n文件的前几行由 `head` 输出。但默认值是 10，显示的行数由 `- n` 标志决定。文档的最后几行由\
  \ `tail` 输出。从第 N 行开始 `tail – n +N`，你可以获取文档的末尾，或者如上面所示，当最后完成后你可以保留后面的 n 行。通常，将文件发送到标准输出流并链接文件列表的\
  \ `cat` 是在读取的。你可以利用它来快速查看文件，通过不同的文件或仅仅是单个文件，你可以使用 `cat`。尽管如此，在此请注意；如果你这样使用 `cat`，可能会被指责为\
  \ UUOC，即“浪费使用 cat”。你不需要为此过度担心，因为这并不是什么大不了的事。\n\n为了快速查看文件，另一个工具是 `less`，它打开了一个类似\
  \ vim 的只读窗口。`more` 是另一个命令。尽管如此，`less` 比其他更有优势，因为它提供了 `more` 功能的超集。在它们的 man 页上，你可以了解\
  \ `more` 和 `less`。\n\n### 创建和删除目录及文件\n\n`mkdir` / `rm` / `rmdir`\n\n为了创建新的空目录，你可以使用\
  \ `mkdir`。由于这是不可恢复的，在使用 `rm` 时你应该很小心，因为它可以消除任何记录。然后，通过 `- I` 标志可以删除一个“确定吗？”的简单提示。通过使用\
  \ `rmdir`，你可以删除一个空索引。然后，当你在空索引中 `ls – an` 时，你可以看到其父目录 (`..`) 作为实际索引 (`.`) 视角的引用。只有空索引会被\
  \ `rmdir` 删除。\n\n尽管，使用 `rm – rf` (- r = 递归，- f = 强制) 可以删除一个目录及其全部内容。\n\n`touch`\n\
  \n\n\n执行 `touch` 是为了修改文档的时间戳。在任何情况下，你都可以同样利用它创建一个空文档，例如通过 `nano`，通过文本编辑器打开它，你可以创建另一个记录。你同样可以修改文档。同样，也可以利用连接。注意：`^z`\
  \ (`Ctrl+z`) 是交互的基础。然后，在修改记录后按下 `^z`。通过显示的位置顺序 `N`（其中 `N` 是工作文件），使用 `kill %N` 来杀死一个后台进程。在它运行时，按下\
  \ `^c` (`Ctrl+c`) 可以杀死当前（前台）正在准备的进程。\n\n# 命令历史、链接创建以及复制与创建文件\n\n`mv` / `cp` / `ln`\n\
  \n要重命名或移动记录，请使用 `mv`。你可以 `mv` 一个文档移动到另一个记录，对其进行重命名，或者保留一个相似的记录，或者 `mv` 一个文档移动到另一个索引。然后，利用\
  \ `cp` 复制一个记录。此外，为了给一个文档创建一个硬链接，请使用 `ln`。同样，你也可以通过 `ln –s` 为文档创建一个软链接。在包含记录的内存中，硬链接引用的是相同的真实字节，请记住它关注的是这些字节，而软链接则指向第一个原始文件名。\n\
  \n## 命令历史\n\n为了让你有重新运行和完成命令的选项，你可以从 `shell` 获取两个主要的规定。Tab 键补全是主要的手段。为了推测你正尝试执行的准确操作，你只需要在编写了命令的首部后按下\
  \ `<tab>` 键。然后，当你可能已经输入了 `ls`（原文为 `ls t`）并按下 `TAB` 键后，你将完成命令。注意，如果出现歧义情况，可能需要你按下几次\
  \ `<tab>`。此外，关于你最近编写的命令，你可以获取它们的简短历史，因为 `shell` 会保留它们，通过组合 `^r` (`Ctrl+r`)，你将获得对这些命令进行搜索的机会。假设你需要查看命令历史，按下\
  \ `^r` (`Ctrl+r`)。\n\n# 进程、磁盘使用和目录树\n\n`ps` / `du` / `df`\n\n对于你系统的硬盘或分区，假设你需要知道你的记录占用了多少空间，`df`\
  \ 将在那里为你显示。如果你运行这个命令，你会发现 `-h` 的意义是“易读的”而不是“帮助”。而且与其计算一个完整的整数、巨大的字节数，为了显示分区或文档大小，一些命令使用\
  \ `G` 表示千字节，使用 `K` 表示千字节。对于特定索引的子目录，文档空间利用率由 `du` 显示。你可能利用 `df` 来找到特定硬盘的空闲空间。同样，利用\
  \ `du` 将允许你了解目录的空间。从预定义的索引开始，标记 `-max-depth=N` 是向下 `N` 级或以下的目录，`du` 会处理这些目录。对于由客户端运行的当前周期，由\
  \ `ps` 显示。\n\n`tree` / `mkdir –p`\n\n`mkdir` 创建的当然只是一个单一的目录。在这种情况下，仅使用 `mkdir` 可能对你很难创建\
  \ `d/e/f`，因为 `d/e` 索引不存在。此外，如果它们不存在，当我们从 `– p` 传递给 `mkdir` 时，路径上的所有索引都可以被创建。同样，当我们打印出一个组织良好的索引索引时，我们可以通过\
  \ `tree` 的帮助更好地构想目录的设计。对于一个预定义的目录，首先它会打印出整个树的结构。尽管如此，利用标记 `-L`，你将能够限制在特定数量的级别。然后，利用\
  \ `– prune`，在树的输出中可以隐藏空目录。你应该意识到，这种不为空的目录或“递归空”也将被这个命令剔除，尽管它们内部包含其他的递归空目录或其他空索引。\n\
  \n# 杂杂\n\n`exit` / `logout` / `passwd`\n\n你可以利用 `passwd` 来更改你记录的密码。为了确认它，你可能需要提供当前正在使用的密码。然后，为了防止任何语法错误情况，它需要你多次输入你的新密码。在只有一个客户端账户的情况下，你登录的\
  \ shell 将通过 `logout` 退出。此外，为了留存任何 shell，请使用 `exit`。\n\n`clear` / `*`\n\n为了让你新的终端行继续在屏幕顶部，那么请运行\
  \ `clear`。在你当前简要内容的行下方，这个命令将为它们添加清除后的行。因此，你可以借此清除工作区域。此外，在搜索特定文档的情况下，通配符（也称为 Kleene\
  \ 星号）`*` 是非常理想的。同样，由于它相当于多个字符或零，你可以使用 `glob` 很多次。\n\n# 处理器使用、内存和磁盘\n\n`htop` / `top`\n\
  \n`top` 可以显示最近运行的周期以及它们的内存使用、所有者等许多信息。`top` 的变体是直观且升级的 `htop`。你需要知道，显示周期可以通过传递标记\
  \ `-u username` 限制为那些所有者。\n\n`ncdu`\n\n改进版 `du` 的平均值，它是记录空间使用的概览，`ncdu` 提供了可遍历界面。同样，它还可以打开一个与\
  \ `vim` 相关的只读窗口。当你需要退出时，按下 `q`。\n\n## REPLs\n\n无论它们被用于显式编程语言，普通的命令行都是读取-评估-打印循环，即\
  \ `REPL`。虽然你可以利用 `quit()` 功能来停止，但命令 `python` 是你可以用来打开 Python REPL 的东西。此外，利用命令 `R`，你可以打开\
  \ R REPL，并利用 `q()` 功能来停止。通过命令 `scala`，你同样可以打开 Scala REPL，并在需要停止时使用命令：`quit`。对于 Java\
  \ REPL，你可以利用命令 `jshell` 来打开它并/留下命令供你停止。或者，利用 `^d` (`Ctrl+d`)，你可以退出任何 REPL。由于 `^d`\
  \ 在 Unix 上意味着信息的结束，它也是文档结束的标记，EOF。\n\n# 环境变量\n\n\n\n\n在你的 `slam shell` 中，你可以利用和建立的持久性因素是环境变量，而“env\
  \ vars（环境变量）”即是它们的即时状态。你可以使用美元符号（ `$` `）来使用它们，对于它们的定义，它们使用等号（ `=` ）。当你使用 `printenv`\
  \ 时，可以看到所有最近特征过的 `env vars`。利用等号 `=` 符号，你可以设置另一个环境变量。你应该留意的是，你的 `=` 前后不能有空格。通过与第一个符号\
  \ `$` 配合回显，你可以向终端打印一个特定的 `env var`。尝试使用语句（ `\"…\"` ）将环境因素周围的其他空白字符或所有空格包含在内。此外，请注意，你不会得到任何警告，并且可能会通过重新给它分配值来覆盖一个\
  \ `env var`。除了上述这些之外，你也可以利用赋值命令来描述 `env vars`。同样地，它们可以被子进程访问，即当你赋予这些意义时，从此 shell\
  \ 调用的命令。当你使用 `unset` 命令或将 `=` 的右侧留空时，你可以取消环境变量。\n\n## 第 14 章：高级 Bash Shell 命令\n\n\
  Shell 是一种真正优秀的编程语言，而不仅仅是关联客户端和工作框架部分的简单关联，它是一个命令协调器。此外，通过组合排列好的对、工具、设备和框架调用，你可以通过\
  \ shell 程序内部一个名为内容的直接 get 工具创建应用程序。通过 shell 脚本，可以调用的无疑是整个 Unix 工具、实用程序和命令的列表。同样，通过外部\
  \ shell 命令（如循环和测试构建），可以为脚本额外的灵活性和能力，如果这些足够的话。不需要一个具有许多花哨配件的完整极简编程语言，它就可以管理框架任务，例如不同的调度、繁琐的任务，shell\
  \ 脚本特别擅长这些。\n\n## 正则表达式简介\n\n一系列字符称为一个表达式。元字符是那些具有比其真实含义更特殊含义的字符。例如，某人的陈述可能由一个语句图像表示，而随后的图像具有元含义。确定或匹配模式的元字符或字符是普通表达式。以下是普通表达式包含的部分内容：\n\
  \n*   **修饰符** `.` 通过更改普通表达式要协调的文本范围，来收缩或扩展它。反斜杠、分号和点号是修饰符的一部分。\n*   **锚点** `.` 对于内容行和普通表达式之间的匹配，是锚点分配了这一位置。例如，符号是\
  \ `$` 和 `^`。\n*   **字符集** `.` 这些字符持有它们的严格意义。此外，在没有元字符的情况下，字符集是最简单类型的普通表达式。\n\n字符串控制和文本搜索是聚焦于普通表达式的巨大应用，它是与一组字符或单个字符匹配的普通表达式的排列或字符串的一部分。\n\
  \n*   **转义“尖角括号”** – `\\<…\\>` – 标记单词边界。\n\n否则，它们只有精确的字符和含义，因此点部分应该被忽略。\n\n`\"The\"\
  ` 匹配 `\\<the\\>` 而不匹配 `\"others,\" \"there,\" \"them,\"` 等单词。确保特定普通表达式工作的最好方法是对其进行测试。\n\
  \n*   **反斜杠** `\\` -- 它们的字符被解释为转义时，因为它转义了一个特殊字符。\n\n而不是其作为行尾的普通表达式意义，`\\$` 返回其精确的意义\
  \ `\" $ \"`。同样，`\\'` 的严格意义是 `\\\\`。\n\n*   **括号** – `[...]` – 为了让单个正则表达式产生匹配，封装一组字符。\n\
  \n对于带有组织字符序列的普通单词模式有一个对应项。`\"there is a match between indeed, Yes, YES, yEs, and\
  \ so on\"` 和 `[Yy][Ee][Ss]`。任何社会安全号码的对应项是 `[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]`。\n\
  \n除了范围 `b` 到 `d` 之外，所有字符匹配 `[^b-d]`。反转或失效 `^` 是跟随普通表达式重要性的一个典型示例（在另一种设置中，承担 `!`\
  \ 的工作）。\n\n任何匹配 `[a-z0-9]` 的数字或小写字母。\n\n在 `k` 到 `y` 和 `b` 到 `P` 的范围内，任何匹配 `[B-Pk=y]`\
  \ 的字符。\n\n在 `c` 到 `n` 的范围内，任何匹配 `[c-n]` 的字符。字符 `x`、`y` 或 `z` 匹配 `[xyz]`。\n\n*  \
  \ **正则表达式的结束** 匹配行尾，即美元符号 – `$`。\n\n匹配空行是 `^$`。\n\n在行尾，`XXX` 匹配 `XXX$`。\n\n*   **一行的开头**\
  \ 匹配脱字符符号 `^`，并且根据上下文有时否定正则表达式中字符集的含义。\n\n*   **除了换行符外**，任何一个字符匹配点 `.-`。\n\n然而，不是缺少\
  \ 13 个额外的人，`\"13\"` 匹配 `13` + 不少于任意字符，包括空格：`1133`、`11333`。\n\n*   **零次**，任何具有普通表达式或字符字符串重复的数字匹配引用符号\
  \ - `*` -。\n\n`\"1133*\"` 匹配 `11` + 至少一个 `3`s：`113`、`1133`、`1133333`。\n\n*   **扩展表达式**。基本集拥有的额外字符。在\
  \ `perl`、`awk` 和 `egrep` 中使用它们。\n\n*   **第一个表达式的至少一次** 与 `+` 协调。它的作用与 `*` 相似。\n\n\
  *   **上一个表达式的零或一次** 与问号 `?` 协调。它主要用于单个字符。\n\n*   **转义“波浪线部分”** – `{}` – 上一个标准表达式用于协调事件的发生数量。\n\
  \n由于它是非 POSIX 兼容的，例如带有正则表达式的 awk 实现，波浪线部分是不可访问的。对于 `0` 到 `9` 区域的人来说，`[0-9]{5}` 协调精确的五个数字。\n\
  \n**POSIX 字符类**。`[: class :]`\n\n对于识别字符范围的匹配，这是一个替代技术。\n\n*   `[: xdigit:]` 匹配十六进制数字。这等于\
  \ `0-9A-Fa- f`。\n*   `[: upper:]` 匹配字母集的大写字符。在该能力下，`A-Z` 将通常是类似的。\n*   `[: space:]`\
  \ 匹配空白字符（空格和空格制表符）。\n*   `[: print:]`（打印字符）在 ASCII 32 – 126 的范围内，它匹配字符。然而加上空格字符，通常将类似于下方的\
  \ `[: chart :]`。\n*   `[: lower:]` 字母顺序中匹配小写的字符。`a-z` 是此惊人的相同。\n\n\n\n\n\n*   `:\
  \ diagram :`（真实的可打印字符）。但是，排除空格字符外，在 ASCII 33 – 126 范围内的字符都与之匹配。这类似于上面的 `: print\
  \ :`。\n*   `: digit :` 匹配（十进制）数字。这与 `0-9` 等同。\n*   `: cntrl :` 匹配控制字符。\n*   `: clear\
  \ :` 匹配制制表符或空格。\n*   `: alpha :` 匹配字母。这与 `A-Za-z` 等同。\n*   `: alnum :` 匹配数字或字母。这与\
  \ `A-Za-z0-9` 等同。\n\n## 结论\n\n感谢你读完《Linux 命令行入门：从零开始学习 Linux 到 Bash 脚本和 Shell 编程的全面分步指南》，希望这本书能为你提供丰富的信息，并能为你提供实现目标所需的所有工具，无论你的目标是什么。\n\
  \n很有可能，如果你已经读到了这里，是因为你想要知道如何在 Linux 操作系统中导航，并清晰掌握多种命令行及其最佳使用方法。你来到这里是因为想深入了解 Linux\
  \ 操作系统所包含的许多不同部分，以及如何安装不同的 Linux 发行版。\n\n你会发现你可以处理服务器的各种安装类型及其角色。通过阅读这本书，你学习了如何在另一个操作系统中使用虚拟机来运行\
  \ Linux、什么是双系统启动，以及如何使用 Live CD/DVD 启动 Linux。\n\n在本书中，你读了关于 Linux 内核和操作系统、Linux\
  \ 目录结构、一些基础的 Linux Shell 命令、如何处理磁盘、多介质和数据等内容。为了让你理解如何理想地使用 Linux 及其一些关联程序，本书已经对关键的终端、编辑器和\
  \ Shell 进行了足够的阐述。\n\n"
