    执行 `touch` 是为了修改文档的时间戳。在任何情况下，你都可以同样利用它创建一个空文档，例如通过 `nano`，通过文本编辑器打开它，你可以创建另一个记录。你同样可以修改文档。同样，也可以利用连接。注意：`^z`
    (`Ctrl+z`) 是交互的基础。然后，在修改记录后按下 `^z`。通过显示的位置顺序 `N`（其中 `N` 是工作文件），使用 `kill %N` 来杀死一个后台进程。在它运行时，按下
    `^c` (`Ctrl+c`) 可以杀死当前（前台）正在准备的进程。


    # 命令历史、链接创建以及复制与创建文件


    `mv` / `cp` / `ln`


    要重命名或移动记录，请使用 `mv`。你可以 `mv` 一个文档移动到另一个记录，对其进行重命名，或者保留一个相似的记录，或者 `mv` 一个文档移动到另一个索引。然后，利用
    `cp` 复制一个记录。此外，为了给一个文档创建一个硬链接，请使用 `ln`。同样，你也可以通过 `ln –s` 为文档创建一个软链接。在包含记录的内存中，硬链接引用的是相同的真实字节，请记住它关注的是这些字节，而软链接则指向第一个原始文件名。


    ## 命令历史


    为了让你有重新运行和完成命令的选项，你可以从 `shell` 获取两个主要的规定。Tab 键补全是主要的手段。为了推测你正尝试执行的准确操作，你只需要在编写了命令的首部后按下
    `<tab>` 键。然后，当你可能已经输入了 `ls`（原文为 `ls t`）并按下 `TAB` 键后，你将完成命令。注意，如果出现歧义情况，可能需要你按下几次
    `<tab>`。此外，关于你最近编写的命令，你可以获取它们的简短历史，因为 `shell` 会保留它们，通过组合 `^r` (`Ctrl+r`)，你将获得对这些命令进行搜索的机会。假设你需要查看命令历史，按下
    `^r` (`Ctrl+r`)。


    # 进程、磁盘使用和目录树


    `ps` / `du` / `df`


    对于你系统的硬盘或分区，假设你需要知道你的记录占用了多少空间，`df` 将在那里为你显示。如果你运行这个命令，你会发现 `-h` 的意义是“易读的”而不是“帮助”。而且与其计算一个完整的整数、巨大的字节数，为了显示分区或文档大小，一些命令使用
    `G` 表示千字节，使用 `K` 表示千字节。对于特定索引的子目录，文档空间利用率由 `du` 显示。你可能利用 `df` 来找到特定硬盘的空闲空间。同样，利用
    `du` 将允许你了解目录的空间。从预定义的索引开始，标记 `-max-depth=N` 是向下 `N` 级或以下的目录，`du` 会处理这些目录。对于由客户端运行的当前周期，由
    `ps` 显示。


    `tree` / `mkdir –p`


    `mkdir` 创建的当然只是一个单一的目录。在这种情况下，仅使用 `mkdir` 可能对你很难创建 `d/e/f`，因为 `d/e` 索引不存在。此外，如果它们不存在，当我们从
    `– p` 传递给 `mkdir` 时，路径上的所有索引都可以被创建。同样，当我们打印出一个组织良好的索引索引时，我们可以通过 `tree` 的帮助更好地构想目录的设计。对于一个预定义的目录，首先它会打印出整个树的结构。尽管如此，利用标记
    `-L`，你将能够限制在特定数量的级别。然后，利用 `– prune`，在树的输出中可以隐藏空目录。你应该意识到，这种不为空的目录或“递归空”也将被这个命令剔除，尽管它们内部包含其他的递归空目录或其他空索引。


    # 杂杂


    `exit` / `logout` / `passwd`


    你可以利用 `passwd` 来更改你记录的密码。为了确认它，你可能需要提供当前正在使用的密码。然后，为了防止任何语法错误情况，它需要你多次输入你的新密码。在只有一个客户端账户的情况下，你登录的
    shell 将通过 `logout` 退出。此外，为了留存任何 shell，请使用 `exit`。


    `clear` / `*`


    为了让你新的终端行继续在屏幕顶部，那么请运行 `clear`。在你当前简要内容的行下方，这个命令将为它们添加清除后的行。因此，你可以借此清除工作区域。此外，在搜索特定文档的情况下，通配符（也称为
    Kleene 星号）`*` 是非常理想的。同样，由于它相当于多个字符或零，你可以使用 `glob` 很多次。


    # 处理器使用、内存和磁盘


    `htop` / `top`


    `top` 可以显示最近运行的周期以及它们的内存使用、所有者等许多信息。`top` 的变体是直观且升级的 `htop`。你需要知道，显示周期可以通过传递标记
    `-u username` 限制为那些所有者。


    `ncdu`


    改进版 `du` 的平均值，它是记录空间使用的概览，`ncdu` 提供了可遍历界面。同样，它还可以打开一个与 `vim` 相关的只读窗口。当你需要退出时，按下
    `q`。


    ## REPLs


    无论它们被用于显式编程语言，普通的命令行都是读取-评估-打印循环，即 `REPL`。虽然你可以利用 `quit()` 功能来停止，但命令 `python`
    是你可以用来打开 Python REPL 的东西。此外，利用命令 `R`，你可以打开 R REPL，并利用 `q()` 功能来停止。通过命令 `scala`，你同样可以打开
    Scala REPL，并在需要停止时使用命令：`quit`。对于 Java REPL，你可以利用命令 `jshell` 来打开它并/留下命令供你停止。或者，利用
    `^d` (`Ctrl+d`)，你可以退出任何 REPL。由于 `^d` 在 Unix 上意味着信息的结束，它也是文档结束的标记，EOF。


    # 环境变量

