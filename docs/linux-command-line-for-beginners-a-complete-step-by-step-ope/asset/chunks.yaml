    生命周期让该子系统处理交互。通过测量之间的关系，它允许内核之间进行信息共享和关联，同时也销毁和创建内核。同样，它通过交互调度程序实现了资源共享和时间表测量。


    ## 一些实用工具


    对于内核模块有用数据的管理，Linux/GNU 提供了了一些用户空间工具。现在，让我们进入它们吧。


    `dmesg`：尽管它是内核使用的另一种策略，但它位于任何用户空间程序显示输出的标准输出流上，即 `/dev/stdout`。为了让我们利用 `dmesg`
    命令处理环缓冲区的内容，内核将其输出附加到环形缓冲区。


    `modinfo`：作为一个命令行工具，传递此类交互的模块通过此命令显示数据。对于模块，如果传递的文件名，它看起来像是 `/lib/modules/<version>`
    注册表。此外，它以“字段：值”的设计由 `modinfo` 显示模块的每个特性。


    需要注意的是，内核版本是 `<version>`，我们可以通过执行名称 `- r` 命令来获取它。


    `rmmod`：当你需要从内核中卸载模块时，可以使用此命令。只有当当前模块未被使用时你才能卸载。此外，用于强制卸载模块的 `- power` 或 `- f`
    由 `rmmod` 帮助。尽管如此，使用此选项的风险是巨大的，要删除模块，你可以使用更安全的方法。由于它会延迟到模块当前不再被使用，`rmmod` 将通过替代方案
    `-` 或 `- w` 释放模块。


    ## 系统准备


    现在，是操作时间了。我们现在只需要制作一个开发环境。我们将引入基于 Debian 的 Linux/GNU 发行版（如 Ubuntu 和 CentOS）或基于
    RPM 的 Linux/GNU 应用作为必要的软件包。


    ### CentOS 安装


    作为 root 用户并执行以下命令，第一步是安装 `GCC` 编译器：


    ```bash

    [root]# yum –y install GCC

    ```


    现在，构建内核的包在建立级别如下：


    ```bash

    [root]# yum –y install kernel-devel

    ```


    总而言，用于构建的下一步是 `make` 工具：


    ```bash

    [root]# yum –y install make

    ```


    ### Ubuntu 安装


    `GCC` 编译器是安装线中的第一个：


    ```bash

    [mickey] Sudo apt-get install GCC

    ```


    然后，内核构建的包直接过来：


    ```bash

    [mickey] Sudo apt-get install kernel-package

    ```


    然后，是 `make` 工具安装：


    ```bash

    [mickey] Sudo apt-get install make

    ```


    ## 我们有了内核模块


    现在，我们已经准备好了框架。然后，我们应该编写内核的底层模块。使用下面的内容，在你打开第一个文本编辑器时使用 `hello. c` 保存记录：


    ```c

    #include <linux/kernel.h>

    #include <linux/module.h>


    Int init_module (void)

    {

    printk(KERN_INFO "Hello, World !!!\n");

    return 0;

    }


    void cleanup_module(void)

    {

    printk(KERN_INFO "Exiting …\n");

    }


    MODULE_LICENSE("GPL");

    MODULE_AUTHOR("Narendra Kangralkar.");

    MODULE_DESCRIPTION("Hello world module.");

    ```


    在任何情况下，任何模块都有两个功能。清理功能是第一个定义，初始化定义是第二个。在这种功能中，清理工具是 `cleanup_module()`，而初始化工作是
    `init_module()`。此外，当你加载模块并在模块被卸载之前，将需要一个初始化功能，之后需要清理功能。不同的宏，如 `MODULE_LICENSE`，非常容易遵循。类似于
    `printf()`，用户空间中的语言结构是 `print()`。尽管如此，在标准的内核输出流中，它不打印消息，与 `printf()` 不同。在相同的情况下，是内核的环缓冲区获取了它附加的消息。每个
    `print()` 的显示都需要。在模型中，需要 `KERN_INFO`。此外，在定义行和 `KERN_INFO` 之间，你不会看到任何逗号（`,`）。在没有实际需要的情况下，你可以使用
    `DEFAULT_MESSAGE_LOGLEVEL` 需要。作为成功的标志，`init_module()` 的最后一个定义中有返回 `0`。


    `cleanup_module()` 和 `init_modules()` 是清理和初始化功能的名称。尽管如此，在新内核（>= 2.3.13）中，我们可以使用任何名称代替清理和初始化工作。为了兼容性，对这些旧名称有支持。为了使用清理和初始化工作的注册，内核提供的宏是
    `module_exit` 和 `module_init`。现在，使用我们喜欢的清理和初始化工作名称，我们应该编写类似的模块：


