    ## 第 4 章：在虚拟机上安装 Linux


    即使在尝试从现场 CD/DVD 引入 Linux 时，你可能仍然对双启动感到不确定。使用虚拟机 `VM` 来安装你喜爱的 Linux 操作系统可能会非常有帮助。这意味着硬件环境的状态是产物环境的复制。由于仅来自内部组件的限制，你实际
    PC 的硬件基础就是该环境。例如，对于两个核心，可能很难在一个处理器上获得虚拟的四核心 CPU。无论如何，在准备好 CPU 的 PC 上，结果可能远优，而虚拟化可以在许多框架上实现。由于
    Windows 中有几个，为了让 Linux 操作系统的建立简单，一些虚拟化工具是非常容易的。其中产生基础虚拟机应用程序的一个是 `VMware`。现在，利用
    `VMware Workstation Player`，是时候 Windows 中寻找 Linux 安装周期的时候了。


    ### VMware Workstation Player 安装


    在基础阶段，你应该通过访问 VMware 网站下载最新的 `VMware Workstation Player` 设备版本。对于 64 位版本，`12.5`
    的下载大小约为 80 MB。对于家庭、个人和非商业用途的评估版，你可以免费找到 `VMware Workstation Player`。对于非营利组织和学生，从免费版获得价值就足以让
    VMware 受欢迎。关于功能因素，标准的虚拟机操作在 `VMware Workstation Player` 中都有记录。然而，对于所有级别，VMware
    提供了广泛的虚拟化配置选项。


    然后，在你下载 `VMware Workstation Player` 后，通常是安装的理想时机。当你从标准安装向导获取帮助时，将获得一个增强键盘驱动程序安装选项。同样，你可能还想处理此组件提供的全局控制台。为了保险起见，你会发现即使你可能不需要它也值得引入。在启动时，在继续安装向导的同时重启
    Windows。


    ### 理想的 Linux 操作系统选择


    对于你需要尝试的 Linux 类型，你可能已经知道了。在 `VM` 中，虽然你会发现某些 Linux 发行版并不特别合适，但另一些会。预计在 VMware
    中，对于像树莓派这样的 ARM 架构，运行 Linux 发行版是不可能的。因此，对于 `x64` 和 `x86`，你无法虚拟化 ARM。然而，是分析 `QEMU`
    的时候了。


