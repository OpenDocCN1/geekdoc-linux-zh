    ## Linux 管理员的职责


    对于需要强大 IT 设施的机构或组织来说，框架管理员是核心角色。因此，优秀的 Linux 管理员需要卓越的任任。由于每个组织可能存在额外的职责和责任，工作描述可能会有所变化。以下是
    Linux 管理员的一些职责：


    * 当服务器出现问题时，由管理员负责调查。

    * 基础安全工具和框架建立。为了在硬件需求分解后做出核心建议，管理员需要与网络工程师以及其他部门或人员协作。

    * 从登录问题到灾难恢复，Linux 管理员识别并处理协助问题。

    * 针对 Linux 环境及其客户，创建、维护和改进必要的设备。

    * Linux 管理员的职责之一是以专业、先进的方式与客户、供应商和员工进行沟通。

    * 除了为 ISP、Web 和局域网客户就调查所有复杂协助问题提供卓越客户服务外，Linux 管理员还修复并分析所有错误日志。

