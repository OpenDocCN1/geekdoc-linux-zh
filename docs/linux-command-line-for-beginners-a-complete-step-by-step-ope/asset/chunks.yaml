    ### 第 12 章：构建脚本


    使用 Shell 编程语言是一个短期项目，而理解可以通过 Shell 脚本和 Shell 的交互来实现。在 Linux 和其他工作框架上，它们对于任务自动化非常棒。对于
    Unix 相关的操作系统，一个提供内容的传统接口程序就是 Shell 程序。你可以将输入到终端窗口的命令视为一个全文本模式窗口，就像一个控制中心（这是一个全文本显示模式），然后运行它的核心功能。极其普通且被深度使用的程序是
    Linux 上的默认 Shell，它是你可以解析的命令集合，这些命令被安排或解析为机器语言结构，并可以完全被框架的 CPU（中央处理单元）感知。你用伪代码（即一种编程语言）编写电脑程序。


    要制作 Shell 脚本，Shell 安排语言或 Shell 编程语言是核心，其他 Unix 相关的操作系统都带有 Shell，每一个都包含了内置的编程语言。你完全可以制作
    Shell 脚本，当你上网时，在一些书中可以找到无需通知即可实现的广泛用途。这些变量是使用 Shell 脚本的优点之一。此外，在 Unix 相关的操作系统默认设置中，Shell
    脚本被广泛使用。


