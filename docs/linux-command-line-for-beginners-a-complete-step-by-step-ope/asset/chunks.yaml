    一段时间以前，Windows XP 就被抛弃给了狼群，而 Windows Vista 也迅速处于了尽可能淘汰的边缘。无论如何，一些过时的 PC 和许多个人仍然依赖于它们。如果你幸运地选择了一个专为老旧电脑设计的轻量级发行版，它可以像在你的框架上刷新操作系统一样，为你的
    PC 注入新的生命力。对于旧电脑，你可以选择 Lubuntu 或 Puppy Linux。你也会发现切换过程中没有任何令人沮恼的事情。由于它们是为 Windows
    XP 的遗留者设计的，在获取 Linux 选项方面有丰富的选择。对于想要获得备受喜爱的微软操作系统视觉和操作体验的用户，这些发行版提供了专门的“Windows
    XP 模式”。


    ## 比以前更先进


    大多数基础级 Linux 发行版都遵循工作区域的基本特性。在这方面，PC 的设置界面通过 Linux Mint 和 Fedora 等发行版的引入变得变得非常整洁，而由于
    Windows 8 的灾难，微软激怒了整个世界。如果人们倾向于 Windows 7 和 Windows XP，他们可以尝试一些 Linux 发行版。考虑到需要学习和适应
    Windows 8 或 Windows 10 的预期，他们转到 Linux 是很常见的。此外，由于已过时的 Windows 的开始菜单与 Linux Mint
    的开始菜单也具有可比性。通常情况下，配合电脑硬件使用时，它消除了关于 Linux 的长期争议，特别是在音频段和系统管理方面。尽管 Intel 的安全启动（Secure
    Boot）允许在你的框架上建立 Linux 时执行更多高级功能，但仍有很大范围的硬件和现代 PC 兼容大多数 Linux 操作系统。更好的是，在进行任何安装之前，你可以让
    Linux 发行版在你的框架上进行测试，以满足你的需求。


    有几个非常有说服力的理由，你应该考虑在你的 PC 上评估 Linux，或者至少给它一个无障碍的初步尝试。此外，如果你准备继续使用，我们应该讨论一下 Linux
    发行版以及你如何在后续推进并完成 Linux 的正确安装。


    ## 第 2 章：Linux 发行版和安装类型


    如果你在寻找最好的 Linux 发行版，你可能没有明确的答案，因为无疑有很多种 Linux 发行版，想要确定一个具体的数量也非常困难。其中一些具有优秀的独特性特征，而另一些本质上是彼此的克隆。总而言之，这就是
    Linux 的魅力所在，无论它看起来多么像一团糟。无论如何，你不需要压力，因为底底，即使周围有很多，你总能找到最好的 Linux 发行版列表。由于每个人都有适合自己的选择，我们应该对这些发行版进行分类。


    ### 多用途 Linux 发行版


    对于工作者和工作站，作为一种高级/业余爱好者友好的操作系统，你可以使用一些 Linux 发行版。因此，你将阅读下方关于这些发行版的不同部分，它们是：


    ### Debian


    作为一种优秀的发行版，Debian 建立在 Ubuntu 之上。Debian 通常在工作区域和工作站上运行良好。然而，通过查阅官方文档，你可以快速上手，它可能不是最适合业爱好者的操作系统。Debian
    10 Buster 的新发布引入了一些基础改进和一些变化。对此，亲自试用一下吧！


    ### Manjaro


    Arch Linux 是 Manjaro 的源头。对于业余爱好者来说，Manjaro 让使用 Arch Linux 变得非常简单，尽管它是为尖端用户定制的。所以不用担心。这个
    Linux 发行版绝对是新手友好且清晰的。它有很多实用的默认 GUI 应用，以及非常出色的 UI。在下载 Manjaro 时，还有选择桌面环境的选项。对于
    Manjaro，大多数人倾向于 KDE 桌面。


    ### Fedora


    Fedora 提供的两个版本是独立的。它为服务器和工作站/桌面提供了支持。它们是 Fedora Server 和 Fedora Workstation。


    事实上，如果你想选择一个易于理解且具有学习和适应预期的智能桌面操作系统，Fedora 可能是你的首选。无论如何，如果你正在寻找一个 Linux 操作系统，当你选择
    Fedora 时，你的工作站可以获得新的呼吸。


    ## 高级用户最佳 Linux 发行版


    首先，在你开始探索针对尖端用户的 Linux 发行版之前，你需要习惯于研究你的方法，以解决与特定的软件包和发行器的问题。无疑，如果你是一个专家，将需要收集特定的需求。尽管如此，如果你作为一个普通用户已经使用
    Linux 很久了，查看这些发行版是非常值得你花费时间和精力的。


    ### Slackware


    Slackware 仍然受到许多人的喜爱，它是最老牌 Linux 发行版之一。如果你希望为自己创建一个优的环境来创建或积累程序，你可能需要考虑使用 Slackware。对于尖端用户来说，Slackware
    通常是一个很不起的选择，尽管工程师和用户数量大幅减少。此外，根据目前的信息（其 Patreon 页面已证实），认为 Slackware 将继续保持其与其他现有
    Linux 发行版相比的卓越地位。


    ### Gentoo


    Gentoo Linux 对于任何知道如何编译源代码的人来说都是非常有必要的。然而，需要重要的专业知识来让它运行，Gentoo 是一个轻量级发行版。如果你需要关于它的某些信息，可以通过官方手册获取。尽管如此，如果你不知道自己在做什么，要利用它可能需要一些投入。


    ### Arch Linux


    这个发行版伴随着巨大的学习和适应预期，尽管它是一个优秀但简洁的发行版。与其不同，你需要的可能不是一次性引入。在设计框架时，你应该添加需要的软件包。此外，在没有
    GUI 的情况下，在引入 Arch Linux 时你应该遵循一系列命令。同样，如果你想继续安装，在引入 Arch Linux 之后对某些基础操作有明确的理解是非常重要的。值得说，Arch
    Linux 背后有一个运行良好的本地区域。因此，即使遇到问题，你也不需要有任何压力。


    ## 老旧电脑最佳 Linux 发行版


    如果你不想翻新你的框架，或者有一台旧电脑闲置，你可以可以使用可用的最好的 Linux 发行版。这里是适合你旧 PC 的最佳发行版。


