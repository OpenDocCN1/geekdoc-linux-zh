    设备来加固、创建、改进和维护客户报告或记录，处理 PC 框架的活动是 Linux 框架管理员的工作。由于其开源生态、高安全性和高可靠性，`Linux` 控制着大多数的计算设备。了解和理解
    Linux 框架管理员的特定特性至关重要：


    * 处理用户、目录和文件

