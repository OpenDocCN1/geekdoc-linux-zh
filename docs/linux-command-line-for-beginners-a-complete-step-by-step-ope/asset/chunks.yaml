    }


    static void __exit__ hello_exit(void)

    {

    printk(KERN_INFO "Exiting …\n");

    return 0;

    }


    module_init(hello_init);

    module_exit(hello_exit);


    MODULE_LICENSE("GPL");

    MODULE_AUTHOR("Narendra Kangralkar.");

