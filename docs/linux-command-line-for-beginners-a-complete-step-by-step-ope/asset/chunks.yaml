    5. Bash 中的一行是一个清晰程序，教一个关于计算机的命令。因此，使用你喜欢的内容工具如 `vi` 来开始它。\n\n#### `vi` 的必要命令：\n\
    \n* 退出 `vi`：\n  按下 `ESC` 后输入：`q`\n* 搜索字符串：\n  按下 `ESC` 后输入 `/wordToSearch`\n*\
