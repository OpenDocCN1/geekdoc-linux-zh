    \ 命令、Linux 终端、编辑器和 Shell。\n\n在对目录、文件目录和编辑器有了清晰认识后，本书将研究你如何从命令行创建 `tar` `gzip`\
    \ 文件，如何挂载和卸载介质，以及 Linux 信息控制。\n\n书架上有几本关于 `Linux Command-line` 的书，对于你选择这本书，我们深表感谢。从我们的角度来说，我们努力确保为你提供成功所需的所有实用和必要信息。再次感谢！\n\
    \n## 第 1 章：什么是 Linux 以及为什么要使用它？\n\nLinux 支撑着从手机、服务器到 PC 的几乎一切设备，它是人们通常使用的标准操作系统。无疑，在任何地方，在你可以想象的所有领域和应用中，人们都在使用\
    \ Linux。Linux 自 90 年代以来一直存在。从你的电视机到冰箱以及一切，Linux 运行着一切。此外，网页的很大一部分都有 Linux 的支持。由于电脑操作系统主导了某些发展，许多逻辑上的飞跃都要归功于\
    \ Linux。尽管长期以来，Linux 一直在提供安全、稳定的 OS 职责，但“Linux”在普通大众中还没有知名度。\n\n尽管如此，Linux 操作系统无处不在，从企业级服务器到家庭作业、家用机器、超级计算机、汽车和手机。你随处都能发现\
    \ Linux，它在你的电视、Roku 设备、冰箱和室内恒温器上。作为可用的最稳定、通常最安全且可靠的操作系统之一，Linux 以作为运行地球另一端嵌入式系统、服务器和工作站的首选平台而自豪。\n\
    \n### 什么是 Linux 操作系统？\n\n无论如何，你所说的 OS 或操作系统是什么？在真实的电脑中，硬件的管理是由被称为操作系统的电脑代码负责的。在硬件和软件之间，操作系统作为一个层存在。此外，在构建代理时，管理显卡或维护\
    \ CPU 并不是许多人需要知道的。此外，作为媒介的是像 Windows 或 Linux 这样的操作系统。\n\n因此，Linux 类似于 `Mac OS`、`iOs`\
    \ 和 `Windows`。基本上，Linux 操作系统驱动着 `Android`，它是世界上最著名的平台。产品如果没有操作系统就无法工作，因为作为操作系统，Linux\
    \ 处理硬件与软件之间的通信。\n\nLinux 操作系统包含此类许多不同的部分，它们是：\n\n- **应用程序**：工作环境提供的所有应用程序。总的来说，你可以快速发现并引入许多\
    \ Linux 优秀的程序，常见于 macOS 和 Windows。目前的 Linux 发行版在应用程序建立上有简单性和集中性。例如，对于 `GNOME Software`，还有\
    \ `Ubuntu` Linux 的 `Ubuntu Software Center`，它从统一平台加速了大量应用程序的发现和建立。\n- **桌面环境**：用户可以与此部分交互。你可以浏览一些工作环境，如\
    \ `Xfce`、`KDE`、`Enlightenment`、`Pantheon`、`Mate`、`Cinnamon`、`GNOME` 等。每个工作环境都有内置应用程序，包括游戏、浏览器、设计工具和文件目录。\n\
    - **图形服务器**：在你的屏幕上通过这个子系统获得真实的显示。它被许多人称为 `X` 或 `X-worker`。\n- **守护进程**：在登录桌面之后或启动期间，这些是基础服务，如计划、声音、打印等。\n\
    - **初始化系统**：该子系统引导用户空间，并负责守护进程。因此，systemd 是最常用的初始化框架。当引导加载程序（如 `Unified Bootloader`\
    \ 或 `GRUB`）处理底层启动时，初始化框架处理启动交互。\n- **OS 内核**：可以被称为 `Linux` 的一个部分，用于管理外围设备、内存、CPU，它是框架的核心部分。\n\
