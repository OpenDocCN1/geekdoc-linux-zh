    \ `mate-terminal` GUI 就是模拟窗口。此外，它也可以像 `PuTTY` 或安全外壳客户端这样的应用程序；`SSH` 是一个在 Windows\
    \ 框架上的安全框架，通过它你可以连接到 Linux。在某些业务或权限设置中，他们使用布尔恩再次外壳（Bourne Again Shell），即 `bash`。如果你愿意，可以浏览一些可用的\
    \ shell，如 `TC-Shell`、`C-Shell` 以及 `Bourne Shell`。尽管具体组件各不相同，但它们都具有相似的属性。`bash`\
    \ 具备以下特性：\n\n*   由于它会记录最后几条命令，shell 的历史记录工具非常实用。无需引用编号，你可以使用 `history` 命令来列出之前的命令。\n\
    \n    为了重新运行某条命令，你可以在工作站的终端复制窗口中从 `history` 重新排序。同样，若要重新运行历史中的任何命令，可以使用图像 `\"\
    I\"`。\n\n*   shell 还有“后台控制”功能，在后台你可以运行任何不需要与终端交互的项目。\n\n    shell 允许在后台立即运行不同的命令和程序排序。在这种情况下，shell\
    \ 会打印后台作业号 `\"1\"`，例如 `\"3470,\"`，这是进程标识号。由于它在前台区域运行，你也可以使用常用的快捷键 `Ctrl + z` 挂起程序。然后你可以使用\
    \ `FG` 让它在前台继续运行，或者使用大符号 `&` 将程序置于后台。如果后台有多个正在运行或挂起的项目，你可以通过它们的作业号来引用它们。因此，利用作业号可以列出所有停止或后台运行的任务状态，以查看你的任务及其作业号。\n\
    \n*   你可以编写 shell 命令的内容，并像聚合项目一样，只需通过命名它们就可以像那样调出它们。例如，我们首先可以在 `~/receptacle`\
    \ 中创建一个记录，其中包含特定的命令，以统计该新目录中 C 程序文件的数量。\n\n    在像普通一样运行它之前，我们可以使用 `chmod` 命令使文件具有可执行性。\n\
    \n*   如果-else 语句、循环，请记住 `bash` 是一种解释型编程语言。当你输入下方的命令时，你将获得更多关于 Linux 在线文档的提示：\n\
    \n*   shell 具有数值和字符串类型的变量。\n\n    主目录的索引是 `$HOME` 变量，输入它为某些变量设置默认值，并查看一组命令。\n\n\
    *   你可能觉得输入很繁琐，或者为了经常执行特定的命令或命令组；你可能需要分配别名。例如，在新目录中，为了统计 C 程序文件的数量，我们可以为利用 `wc`\
    \ 输出的行数计数分配别名 `\"counts\"`，并利用 `ls` 记录文件。\n\n*   为了将一个程序的输出管道到另一个程序的输入中，shell\
    \ 具有这种功能。`\"│\"` 是管道线的符号。例如，在 `wc` 程序中，我们可以在读取文件后对输出进行管道处理，以便包含记录 A 中的单词数。\n\n\
    *   标准输出（stdout）和标准错误（stderr）是大多数 Linux 项目和命令遵循的概念。程序组合的输出流是标准输出，程序读取的信息流是标准输入。在大多数情况下，配合终端是这些操作很大的一部分，因此你的屏幕可以获取这些输出，而信息是通过控制台获取的。你可以通过\
    \ shell 将标准输出重定向到输出。\n\n*   在你新的目录中，为了匹配文件名，shell 将扩展通配符。例如，你可以使用特定的命令来创建一个名为\
    \ `\"anything. c\"` 的文件记录。\n\n*   文件名通过命令拥有的路径字符串进行处理。例如，在你的主目录下，命令可以将当前目录更改为\
    \ `\"canister\"`，波浪号 `~` 的意义是 shell 是你的主目录。\n\n*   为了识别它，循环涉及检查组件是否与命令关联，然后可以通过输入命令名称来查找各种注册。这种查询方式就是它所意味着的，并且记住当前的索引是搜索路径，它的子目录\
    \ `\"container,\"` 以及你的主目录。此外，通过输入它们的名称，你可以在编写完项目后调用它们。无论你当前在哪个目录，只要在目录中存储了此类程序，它就会被找到并运行。\n\
    \n*   通过命名它们，你可以调用命令。大多数 Linux 命令本质只是由 shell 执行的程序。例如，`ls` 命令可以列出其文件的名称并读取新目录，当你运行它时，你会得到一个特定的结果。\n\
    \n*   shell 像不同的项目一样，也有一个相关的当前目录（当前工作目录）。在查找文件时，作为第一步，运行在 Linux 上的程序会使用当前目录。在\
    \ Linux 文件系统中，可以使用 shell 的 `cd` 命令通过更改当前目录进入另一个区域。\n\n*   用户可以设计此快捷命令。位于 `\"bash\"\
    ` 之前的 `$` 符号（ `bash` 程序的提示符）是默认提示符。\n\n使用上方向键控制，你可以利用 `bash` 的额外组件来更改和查看之前的命令。在终端顶部，一旦你按下上方向键，最后一条命令就会重新显示，要获取之前的命令，再次按下上方向键。按下\
    \ `\"RETURN\"` 重新执行命令。你可以在命令内部嵌入字符，或通过使用退格键移动光标来删除字符，或从末尾使用删除键删除字符，在重新运行命令之前进行修改。\n\
    \n### Shell 命令\n\n在下方，你将找到可用命令列表。对于每个命令，手册页（manual page）上的参考可以提供更多细节。可以使用 `man`\
    \ 命令配合喜欢的名称在网上查看这些内容。\n\n### 数据库管理\n\n提供 Oracle 和 MySQL。\n\n| 命令 |  |\n| :---\
    \ | :--- |\n| `MySQL-workbench` | MySQL 的 GUI 界面 |\n| `Sqldeveloper` | Oracle\
    \ SQL Developer GUI 界面 |\n| `Mysql` | 运行 MySQL SQL 接口 |\n| `Sqlplus` | 运行 Oracle\
    \ SQL 解释器 |\n\n### 文字处理\n\nLibreOffice 可用且兼容 Microsoft Office。\n\n| 命令 | 描述 |\n\
    | :--- | :--- |\n| `LibreOffice` | 启动 LibreOffice 应用 |\n\n### Burden at Antichi\
    \ Colli EUR1269036 使用 Linux 或其他操作系统创建精美的打印文档，一种广泛使用的排版语言是 TeX。当你需要组织手册页时，标准的 Linux\
    \ 文本处理工具通常使用另一个基于 Troff 的程序族。\n\n#### TeX\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `Dvips`\
    \ | 将 DVI 文件转换为 PostScript |\n| `Xdvi` | DVI 预览器 |\n| `Pdflatex` | 带有 PDF 输出的\
    \ latex 格式器 |\n| `latex` | latex 格式器 |\n| `tex` | 文本格式化和排版 |\n\n#### Troff\n\n\
    | 命令 | 描述 |\n| :--- | :--- |\n| `Pic` | 用于绘图的 troff 处理器 |\n| `groff` | 用于激光打印的\
    \ GNU troff 接口 |\n| `nroff` | 文本格式化语言 | continuous| `troff` | 文本格式化和排版语言 |\n\n"
