    你应该注意到，你应该离开的是桌面环境而不是 Linux 工作站。


    # 第 11 章：Shell 脚本


    对于基于 Linux 的操作系统，一个具有顺序安排的记录就是 shell 脚本。shell 内容命令分组需要一次性组合成单一内容输入到控制台。作为你与框架交互的命令集的中介，shell
    是 `CLI`（命令行界面）的工作框架。为了节省时间，客户端应该反复复用 shell 脚本的命令分组。shell 实际上需要遵循不同的子命令、注释和边界，这实际上类似于不同的项目。此外，客户端可以在
    shell 命令行中输入记录名称来启动命令的连续执行。shell 脚本在 DOS 工作框架中被称为批处理记录，它在 IBM 的集中式计算机虚拟机运行环境中也被称为
    `EXEC`。


    你可以输入框架执行的命令，因为你会在 Linux 运行环境中发现 shell 程序。在 Linux 电脑（PC）上，当打开终端窗口时，shell 程序将启动，允许你通过界面输入命令。命令行界面就是人们所说的这种界面。在屏幕上，你可以看到输出展示，当输入命令时，shell
    会执行它。此外，存储在记录中的某些命令也可以由 shell 执行，并具有直观执行和确认命令的选项。shell 预被视为这种执行的方法。


    ## shell 脚本如何工作


    赋予 shell 权限、使内容对 shell 可以及编写内容是 shell 编程相关的进展部分。你可以使用图形用户界面 `GUI`、文字处理器或内容工具来编写
    shell 脚本，因为它包含 `ASCII`。shell 可以解释内容中一系列命令的语言。替代路径、表达式、假设/那么、那么/else 语句、变量和循环都是
    shell 脚本支持的功能。在 shell 可以访问的区域，你可以在完成后使用 `.sh` 或 `.txt` 扩展名保存记录。


    ## shell 的背景


    20 世纪 70 年代，Ken Thomson 创建了 `V6 Shell`，这是最初用于 Unix 的 shell 程序。尽管它是一个带有智能组件的 shell，但它的编程能力非常匮乏。1977
    年，`Bourne Shell`问世并用于 root 账户；作为默认 shell，它今天仍在使用中。此外，随着时间的推移，它的编程能力变得非常有帮助。到了
    80 年代，`Korn Shell` 和 `C-Shell` 为公众提供了讨论的话题，它们是广为人知的 shell 变体。与第一个 shell 有有本质的区别，因为这些
    shell 都引入了显式的语言结构。因此，`Bash` 在今天是一个非常显著的 shell。作为唯一的 `Bourne Shell` 的改进版本，它代表了
    `Bourne-Again-Shell`。


    ## shell 脚本应用示例


    通过逐行编写，当你使用 shell 脚本时，可以节省某些单调任务节省大量时间。以下你可以使用 shell 脚本的一些应用实例：


    * 监控系统

    * 执行例行备份

    * 将现有程序链接在一起

    * 操作文件

    * 完成批处理

    * 创建程序或运行编程环境

    * 自动化代码编译过程


    ## shell 脚本执行


    根据 shell 的考虑，如果你需要执行 shell 脚本，只需传递内容路径即可。你需要关注 shell 需要 `LF` 字符（换行符）来结束行这一点。如果你在
    Linux 框架上尝试直接执行 shell 脚本或在 Windows 上编写它，很容易遇到错误。对于行结束，Windows 使用的是回车-换行符（`CR-LF`
    组合），而你应该将其更改为 `LF`。为了实现这一点，你可以检查你的 Windows 管理器。


    作为一种命令，shell 内容可以通过另一种方式直接执行。在你的 shell 内容的第一行中，你可以嵌入下面的 hashbang 声明：


    ```bash

    #!/bin/bash

    ```


    然后，你可以执行一些命令来使你的内容记录变为可执行。此时，无需明确引用 shell，你就可以直接执行该内容记录。


    ## shell 脚本的优势


    当你使用 shell 脚本时，事情旨在变得高效且简单。它消除了任何理解问题，因为它在内容中使用的语法与其在 shell 命令行使用的语法相似。同样，与其他编程语言相比，它学习和适应所需的预期更少，编写
    shell 脚本代码的速度也更快。然而，如果被忽视，一旦 shell 脚本出现错误，通常会变得非常昂贵。同样，与 shell 编程相关的各个阶段可能没有相似性，而且比起单个命令；shell
    内容执行可能更慢。无论如何，这里是 shell 脚本的更多优点。


    ### 可移植性：


    当实际 shell 可时，你可以将 shell 内容移动到另一个 Unix 和 Unix 相关的操作系统。同样，当你从 `Sparc`、`MIPS`、`x86`
    等不同模型移动 shell 脚本时，shell 脚本比 `C/C++` 程序要方便得多。你应该尝试运行一个 `C/C++`，编译程序并复制源代码以便你移动和使用
    `C/C++` 程序。然后，如果它使用了工程架构特定代码，它可能无法按预期运行。


    ### 透明性：


    由于它是一份记录，你可以轻松地通过查看它来了解 shell 脚本正在执行的操作类型。另一方面，只有当你接触源码或源码需要教育你时，才能在像 `C/C++`
    这样的语言中知道程序的类型。例如，可以看到是否有任何文档被 shell 脚本删除，然后如果你需要这些文档，可以将这些记录复制到其他地方。同样，因为你可能访问源码，shell
    内容比标准项目更容易分析。然而，为了避免此类错误，创建和检查程序是一个良好的 shell 脚本的职责。你也可以在查看内容代码时创建注册。


    ### 更易开发：


    在用 `C/C++` 编写的标准程序内部，你可以高效地执行像 shell 脚本的比较活动。无论，shell 内容的修复和编写比 `C/C++` 程序要简单得多。通过重定向输出、删除索引和文件以及执行外部命令，shell
    对于每一个这些特定的系统组织任务及其他都非常出色。对于更低层次的活动，包括控制数据结构、调用系统调用等，`C/C++` 程序通常会容易得多。


