  trans: "\n为了让你理解 `clear` 命令，shell（外壳）教给你的是第二行。通过这个简单的命令，你可以清除终端或控制中心窗口中过去所有的输出和命令，以便新命令的到达。在屏幕上，问候语“hello,\
    \ world”是 shell 从第三行获取的内容。对于随后的任何需要从 shell 引导显示的内容，它利用了 `echo` 命令。在更高级的内容中，引号对于它们的使用产生重大影响，尽管它们可能并不基础，可以作为一种非常有价值的编程练习。`echo`\
    \ 命令获取的信息是问候语“hello, world”，这在稍微专业的术语中是这样的。此外，人们公开使用的脚本也回 `echo` 和 `clear`，与其他不同的命令类似。例如，你会收到输入以下命令的提示，当你在屏幕上输入\
    \ `clear` 并按下“回车”键时，整个过去的输出和命令都会被清除。\n\n### 它不起作用！\n\n`hello, world` 表达式没有显示在屏幕顶部的可能有几种解释，其中一些：\n\
    \n1. 对于文件的所有者来说，他们忘记更改执行权限。\n2. 在类似的目录下，文件所在的地方没有给出命令。\n3. 使用的不是内容工具，而是文字处理器来创建的，因此，记录绝对不是一个纯文本文件。\n\
    4. 在引号或点之后嵌入了空格。\n5. 在命令中，你排除或切换了正斜杠或点。\n6. 文件名与命令中使用的文件名之间存在区别。例如，大小写、拼写，甚至是一个额外的或微小的空格都可能不同。\n\
