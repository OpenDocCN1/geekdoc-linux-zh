    的邮件列表让你准备就绪。当你完成该阶段后，`VMware Workstation Player` 的基本功能将可用。此外，为了继续，你的虚拟机需要创建一个文件。`ISO`
    安装程序镜像文件将是你选择的默认值。注意，有一个选项是以后通过一个空盘来创建虚拟框架从而延迟引入 OS。然后，在你建立好喜爱的操作系统后点击“下一步”。你选择的访客
