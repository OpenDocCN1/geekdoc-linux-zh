    Linux 组是一种用于分类和关联用户的系统。组 ID `GID` 是每个组的特定关联 ID，类似于用户 ID。我们有主组和附加组两种类型。主组在每个用户中有一个位置，且可以有零或多个附加组。组数据存储在
    `/etc/group` 中，独立密码存储在 `/etc/shadow` 文件中。


