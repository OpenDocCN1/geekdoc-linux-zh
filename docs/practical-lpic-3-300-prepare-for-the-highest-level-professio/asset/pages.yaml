    LISTEN       0 50                   *:139    *:* users:(("smbd",2726,36))

    LISTEN       0 50                  :::445   *:* users:(("smbd",2726,33))

    LISTEN       0 50                  :::139    *:* users:(("smbd",2726,34))

    [root@hotel ~#] ss -l -u -np | grep nmbd

    UNCONN       0 0           192.168.56.255:137   *:* users:(("nmbd",3471,14))

    UNCONN       0 0           192.168.56.128:137   *:* users:(("nmbd",3471,13))

    UNCONN       0 0                       :::137      *:* users:(("nmbd",3471,11))

    UNCONN       0 0           192.168.56.255:138   *:* users:(("nmbd",3471,16))

    UNCONN       0 0           192.168.56.128:138   *:* users:(("nmbd",3471,15))

    UNCONN       0 0                       :::138      *:* users:(("nmbd",3471,12))

    ```


