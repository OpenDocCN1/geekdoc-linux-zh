  md: '# Quotas


    The Samba suite includes also a tool named smbcquotas, which can be used to manage
    quotas in a Samba share. For this to work, the file system she resides on must
    be mounted with quota support. If that''s the case we can list the quotas with
    the -L parameter.


    ```

    [root@alpha ~]# smbcquotas //hotel.linuxaholics.com/Info -U Antonio -L

    nEnter SAMBA\Antonio''s password:

    NT_STATUS_NOT_SUPPORTED cli_list_quota

    ```


    Unfortunately, modern versions of the Samba suite have a bug that prevents this
    tool from working normally. The details can be found at https://bugzilla.samba.org/show_bug.cgi?id=13553.
    Fortunately, there are already software patches that can be applied to solve this
    bug. It is also possible to use an older version of the program to check how it
    works.


    If we have an older Samba installation on a server, we can list the quotas in
    a share like:


    ```

    linux-server:~ # smbcquotas -V

    Version 3.6.3-0.39.1-3012-SUSE-CODE11-x86_64

    linux-server:~ # smbcquotas -L -v //127.0.0.1/infoquota

    Enter root''s password:

    Quotas for User: LINUX-SERVER\root

    Used Space: 5798912

    Soft Limit: NO LIMIT

    Hard Limit: NO LIMIT

    ```


    We can configure a quota for the root like this:


    ```

    linux-server:~ # smbcquotas -S UQLIM:root:10000000/20000000 //127.0.0.1/infoquota

    Enter root''s password:

    LINUX-ISCSI-SERVER\root : 5798912/ 9999360/ 19999744

    ```


    If we list the enticing quotas again, we''ll see that the new soft and hard limits
    have been applied.'
