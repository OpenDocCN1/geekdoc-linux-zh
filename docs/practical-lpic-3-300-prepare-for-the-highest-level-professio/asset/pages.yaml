- img_proc: true
  md: '[root@alpha ~]# man saslauthd


    # FILES


    /run/saslauthd/mux The default communications socket.


    /etc/saslauthd.conf

    The default configuration file for ldap support.


    We''ll create a configuration file with the following lines:


    ```

    [root@alpha ~]# cat /etc/saslauthd.conf

    ldap_servers: ldap://127.0.0.1

    ldap_bind dn: cn=Tux,ou=users,dc=linuxaholics,dc=com

    ldap_password: linuxrules

    ```


    We indicate the address of the LDAP server as well as the LDAP account used to
    perform the queries and the password associated with this account. Once we''re
    done with all the changes, we restart the LDAP and the saslauth services.


    We can check SASL authentication is working with the testsaslauthd command.


    ```

    [root@alpha ~]# testsaslauthd -u Tux -p /run/saslauthd/mux

    : NO "authentication failed"

    ```


    We can see that the authorization failed, so we''ll include an additional parameter
    to indicate the base search.


    ```

    [root@alpha ~]# cat /etc/saslauthd.conf

    ldap_servers: ldap://127.0.0.1

    ldap_search_base: ou=users,dc=linuxaholics,dc=com

    ldap_bind dn: cn=Tux,ou=users,dc=linuxaholics,dc=com

    ldap_password: linuxrules

    ```'
