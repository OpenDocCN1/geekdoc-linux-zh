  md: '# DNS Forwarding


    When provisioning the domain, we decided to use the internal DNS server in Samba.
    This internal server was populated with all the records needed for the domain
    to function properly. However, this server has no knowledge about external records,
    so if we need to access resources on the Internet the Samba DNS server won''t
    be able to provide the right answers to those queries.


    To solve this problem we can use DNS forwarding: that is, when the internal DNS
    server cannot answer a query, it will forward that query to another server. When
    provisioning the domain with samba-tool we were given the choice to use a DNS
    forwarder.


    ```

    [root@mike ~]# /usr/local/samba/bin/samba-tool domain provision --use-rfc2307
    -interactive

    ```


    DNS forwarder IP address (write ''none'' to disable forwarding)

    [192.168.1.1]: none


    If we decided not to use it at first, however, we can easily set that option in
    smb.conf. The option we need to include is dns forwarder. Right now, this parameter
    isn''t set in our Samba Active Directory DC, so if we try to query any external
    record, such as www.apress.com, we won''t find it.


    ```

    [root@mike ~]# host www.apress.com mike.linuxaholics.com

    Using domain server:

    Name: mike.linuxaholics.com

    Address: 192.168.1.234#53

    Aliases:

    ```


    Host www.apress.com not found: 3(NXDOMAIN)'
  merge: -1
  pgno: 527
- img_proc: true
  md: '# CHAPTER 20 ACTIVE DIRECTORY NAME RESOLUTION


    To solve this, we edit the Samba configuration file, which in our case is located
    at / usr/local/samba/etc/smb.conf, and add the following line to the [global]
    section.


    ```

    dns forwarder = 192.168.1.1

    ```


    We''ll use the IP address of the external DNS server to which we want the unsolved
    queries to be forwarded. After restarting the Samba service, we''ll try to resolve
    the external name again.


    ```

    [root@mike ~]# host www.apress.com mike.linuxaholics.com

    Using domain server:

    Name: mike.linuxaholics.com

    Address: 192.168.1.234#53

    Aliases:

    ```


    www.apress.com is an alias for prod.springer.map.fastlylb.net.

    prod.springer.map.fastlylb.net has address 151.101.132.250


    # Summary


    In this brief chapter we managed the internal DNS used by Samba, listing, adding,
    and deleting records. We also learned to forward queries that the internal DNS
    server could not resolve by itself.'
  merge: -1
