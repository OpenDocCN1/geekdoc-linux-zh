- img_proc: true
  md: '# CHAPTER 19


    # NetBIOS and WINS


    NetBIOS was the protocol originally used to communicate in Windows environments.

    Developed during the 1980s, this protocol is easy to implement and provides three

    different services: name service, datagram distribution service, and session service.
    The

    ame server role is usually assumed by a Windows Internet Name Service (WINS) server.

    This WINS server is the Microsoft implementation of the NetBIOS name server service.

    In this chapter we''ll cover the following concepts:


    +   - Understanding WINS concepts.

    - Understanding NetBIOS concepts.

    - Understanding the role of a local master browser.

    - Understanding the role of a domain master browser.

    - Understanding the role of Samba as a WINS server.

    - Understanding name resolution.

    - Configuring Samba as a WINS server.

    - Understanding NetBIOS browsing and browser elections.

    - Understanding NetBIOS name types.


    We will also learn about the following terms and utilities: smb.conf, nmblookup,

    smb-client, name resolve order, lmhosts, wins support, wins server, wins proxy,

    dns proxy, domain master, os level, and preferred master.'
  merge: -1
  pgno: 504
- img_proc: true
  md: 'CHAPTER 19 NETBIOS AND WINS


    # NetBIOS


    NetBIOS works at the session layer of the Open Systems Interconnection (OSI) model
    (see https://en.wikipedia.org/wiki/OSI_model). In the past it ran over IPX/SPX
    networks, but now it runs over TCP/IP. NetBIOS provides the following services:


    +   * Name service (NetBIOS-NS): This works pretty much like the DNS service,
    allowing us to register and resolve names.


    +   * Datagram distribution service (NetBIOS-DGM): This is used for connectionless
    communications.


    +   * Session service (NetBIOS-SSN): This is used for connection-oriented communication.


    # Name Service


    For two computers to communicate through NetBIOS, either using datagrams or establishing
    a session, they need to register their NetBIOS names. NetBIOS names have a length
    of 16 octets, and the last octets usually designate the type of resource. When
    NetBIOS over TCP, the name service runs on UDP port 137. The service allows us
    to do the following:


    +   * Add and register a NetBIOS name.


    +   * Add and register a NetBIOS group name.


    +   * Delete and unregister a NetBIOS name or group name.


    +   * Look up a NetBIOS name in the network.


    # Datagram Distribution Service


    This is a connectionless service that runs on UDP port 138. It works by sending
    and receiving datagrams and broadcast datagrams.


    # Session Service


    This service runs on TCP port 139, and allows two computers to establish a reliable
    connection.'
  merge: -1
  pgno: 505
- img_proc: true
  md: '# NetBIOS Names


    When using NetBIOS in a network, each computer can have a single NetBIOS name
    or multiple NetBIOS names associated. A NetBIOS name is supposed to be 16 characters
    long; in its implementation, Microsoft uses only 15, reserving the 16th character
    as a suffix.


    From the Windows workstation we joined previously to the domain we can check the
    NetBIOS names of the computers in the same network.


    ```

    C:\Users\john>net view

    ```


    | Server Name | Remark |

    |---|---|

    | \JULIET_SERVER | Samba 4.7.1 |

    | \ZULU2 | |


    The command completed successfully.


    In addition, to see all the NetBIOS names associated with a computer we can use
    the nbtstat command.


    ```

    C:\Users\john>nbtstat -a juliet_server

