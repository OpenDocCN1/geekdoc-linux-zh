    # Understand and Manage FSMO Roles


    Active Directory is a multaster environment in which changes can be made in any
    DC. This has several advantages, as it is possible to load balance the operations
    performed when administering the domain. However, there is also a drawback. Over
    time, conflicts will appear, for instance when creating the user in two different
    DCs. These conflicts can sometimes be difficult to resolve, and this is why operations
    in Active Directory are performed in a single-master environment.


    This can be achieved by assigning certain roles to one and only one DC. These
    roles are called FSMO roles, and they are as follows:


    +   * PDC emulator.

    * RID master.

    * Schema master.

    * Domain naming master.

    * Infrastructure master.'
  merge: -1
  pgno: 476
- img_proc: true
  md: 'CHAPTER 17 SAMBA 4 AS AN AD COMPATIBLE DOMAIN CONTROLLER


    +   - Domain DNS zone master.

    - Forest DNS zone master.


    # PDC Emulator


    The PDC emulator provides time service. Password changes in the domain are replicated
    preferentially to this server. It processes account lockouts and the Group Policy
    Management console contacts this server by default. There is only one PDC emulator
    per domain.


    # RID Master


    The RID master makes sure that objects in the domain have unique identifiers.
    These unique identifiers are composed of two parts: a SID and a RID. The SID is
    the same for a single domain, but the RID is different for each object. The RID
    master assigns different ranges of RIDs to the DCs in the domain to make sure
    that these ranges do not overlap. There is one RID master per domain.


    # Schema Master


    One server is allowed to make changes in the schema, the Schema master. This server
    has to be online every time the schema is updated. There is one Schema master
    per forest.


    # Domain Naming Master


    This server is responsible for changes in the domain namespace at the forest level.
    For instance, when we provisioned the Active Directory object we say that besides
    the linuxholics.com we could have a canada.linuxholics.com domain and a us.linuxholics.com
    domain, which are part of the same forest. If we decide to add a mexico.linuxholics.com
    domain, this change will be made in the domain naming master. There is one domain
    naming master per forest.'
  merge: -1
  pgno: 477
- img_proc: true
  md: '# Infrastructure Master


    This server plays an important role whenever a trust relationship exists with
    a different domain. When this happens, users from a domain can be given access
    to resources in the other domain. It is also possible that a user in Domain A
    is made a member of a group in Domain B. In this case the identifier of the user
    should be updated by the infrastructure master.


    We have seen the theory behind trust relationships before, but we haven''t seen
    any examples yet. Later in the book when we study FreeIPA and integration with
    Active Directory we''ll see an example of trust relationships. Even though in
    the case the trust relationship is between a Windows Active Directory Domain and
    a FreeIPA domain, it works much like a trust relationship between two Active Directory
    domains. There is only one infrastructure master per domain.


    # Domain DNS Zone Master


    As we know, DNS is a critical part of every Active infrastructure and it is deeply
    integrated with it. When new zones are added or deleted on the DNS servers that
    host the domain, the domain DNS zone master is responsible for coordinating the
    operation. There is only one domain zone master server for a domain.


    # Forest DNS Zone Master


    This role is similar to the domain DNS zone master, but in this case it applies
    to the adding or deleting of records in the top-level DNS zone. There is one forest
    DNS zone master per forest.


    # Global Catalog


    The Global Catalog is not an FSMO role; in fact, we can have as many Global Catalog
    servers as DCs. A Global Catalog server stores partial copies of all the objects
    in the forest, so every time we need to locate an object in the forest we can
    get a quick answer by querying the Global Catalog server.'
  merge: -1
  pgno: 478
- img_proc: true
  md: '# Managing FSMOs in Samba


    FSMOs are managed in Samba with the samba-tool fsmo command. We can get a list
    of the FSMOs assigned in the domain with the following command:


    ```

    [root@november ~]# /usr/local/samba/bin/samba-tool fsmo show

    SchemaMasterRole owner: CN=NTDS Settings,CN=MIKE,CN=Servers,DC=Default-

    First-Site-Name,CN=Sites,CN=Configuration,DC=linuxaholics,DC=com

    InfrastructureMasterRole owner: CN=NTDS Settings,CN=MIKE,CN=Servers,

    DC=Default-First-Site-Name,CN=Sites,CN=Configuration,DC=linuxaholics,DC=com

    RIDAllocationMasterRole owner: CN=NTDS Settings,CN=MIKE,CN=Servers,

    DC=Default-First-Site-Name,CN=Sites,CN=Configuration,DC=com

    PdcEmulationMasterRole owner: CN=NTDS Settings,CN=MIKE,CN=Servers,

    DC=First-Site-Name,CN=Sites,CN=Configuration,DC=linuxaholics,DC=com

    DomainNamingMasterRole owner: CN=NTDS Settings,CN=MIKE,CN=Servers,

    DC=First-Site-Name,CN=Sites,CN=Configuration,DC=linuxaholics,DC=com

    DomInDnsZonesMasterRole owner: CN=NTDS Settings,CN=MIKE,CN=Servers,

    DC=First-Site-Name,CN=Sites,CN=Configuration,DC=linuxaholics,DC=com

    ForestZonesMasterRole owner: CN=NTDS Settings,CN=MIKE,CN=Servers,

    DC=First-Site-Name,CN=Sites,CN=Configuration,DC=linuxaholics,DC=com

    ```


    In this case all of the FSM roles are assigned to the same server, but we can
    transfer one or more roles to a different server. For instance, we might want
    to transfer the infrastructure master role from mike.linuxaholics.com to november.linuxaholics.com.
    In that case, the command we should launch from the november.linuxaholics.com
    server:


    ```

    [root@november ~]# /usr/local/samba/bin/samba-tool fsmo transfer

    --infrastructure --username=Administrator --password=Password

    ```


    The server will try to connect to mike to transfer the FSM role in an orderly
    fashion. There are situations, though, when a server has suffered an unrecoverable
    error and can no longer be contacted. If this happens with a server holding one
    or many FSM roles we''t be able to transfer that role and we''d need to seize
    it with this command:


    ```

    [root@november ~]# /usr/local/samba/bin/samba-tool fsmo seize

    --role=infrastructure --username=Administrator --password=Password

    ```'
