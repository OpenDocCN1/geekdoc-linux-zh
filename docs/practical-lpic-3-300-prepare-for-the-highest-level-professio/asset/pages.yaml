    We have already used nmblookup to query NetBIOS names, according to the order
    specified in the name resolve order parameter, but we can also force nmblookup
    to directly query the WINS server using the -U and -R parameters.


    ```

    [root@kilo ~]# nmblookup -U JULIET_SERVER -R ''MY_SAMBA_DOMAIN#1C''

    192.168.1.236 MY_SAMBA_DOMAIN<1c>

    192.168.1.226 MY_SAMBA_DOMAIN<1c>

    ```


    # Summary


    In this chapter we have studied the NetBIOS protocol, which historically has played
    a dominant role in every Windows network. We have reviewed many concepts associated
    with this protocol and we implemented a Samba WINS server. For didactic purposes,
    we also saw a practical example of communication between a server and a workstation
    using NetBIOS.'
