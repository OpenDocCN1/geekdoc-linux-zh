    # # Role-Based Access Control


    Finally, we can use role-based access control, which is the most versatile way
    to

    customize permissions in the domain. To understand how it works we must differentiate

    it three components: roles, privileges, and permissions.


    *Permissions* are the basic building blocks in this model. They specify read access,

    write access, or both, to a series of attributes. This is similar to what we just
    seen

    talking about self-service and delegation rules.


    Permissions are grouped into *privileges*, which in turn are grouped into *roles*.
    To see

    a practical example, we''ll begin by listing the roles defined in the domain.'
