  md: '# CHAPTER 8 SAMBA CONCEPTS AND ARCHITECTURE, CONFIGURING SAMBA, AND INTERNATIONALIZATION


    For OpenLDAP to be able to store Samba accounts we must expand the schema.

    We already saw how to do this when we studied OpenLDAP in the first chapters of
    this book. The LDIF file necessary to extend the schema is located in the /usr/share/doc/samba-4.1.1/LDAP
    folder.


    ```

    [root@hotel ~]# ls /usr/share/doc/samba-4.7.1/LDAP/samba.ldif

    /usr/share/doc/samba-4.7.1/LDAP/samba.ldif

    ```


    We need to copy the samba.ldif file from the Samba server to the OpenLDAP server.


    ```

    [root@hotel ~]# cp /usr/share/doc/samba-4.7.1/LDAP/samba.ldif alpha.

    root@alpha.linuxaholics.com''s password:

    samba.ldif 100% 15KB 168.1KB/s 00:00

    ```


    We also extend the schema.


    ```

    [root@alpha ~]# ldadd -Y EXTERNAL -H ldapi:/// -f samba.ldif

    SASL/EXTERNAL authentication started

    ```


    SASL username: gidNumber=0+uidNumber=0,cn=peercred,cn=external,cn=auth

    SASL SSF: 0


    adding new entry "cn=samba,cn=schema,cn=config


    The man page of the smb.conf file says that, in addition to ldap admin dn, we
    include a series of parameters for OpenLDAP and Samba to integrate properly. This
    is the configuration example included:


    An example configuration can be the following:


    ```

    encrypt passwords = true

    passdb backend = ldapsam


    ldap:trusted=yes

    ldap:editposix=yes


    ldap admin dn = cn=admin,cn=samba,dc=org

    ldap delete dn = yes

    ldap group suffix = ou=groups

    ldap idmap suffix = ou=idmap

    ```'
