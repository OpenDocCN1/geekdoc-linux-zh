    **Figure 5-2.** Replica hub topology


    Another option would be to use a multimaster replication topology. In this case
    we have two or more master servers. The changes can be made on any of these servers
    and they are replicated to the remaining servers (Figure 5-3).'
  merge: -1
  pgno: 188
- img_proc: true
  md: '![](img/dfa44432604022575079471b648e25ca_189_0.png)


    Figure 5-3. Multimaster replication topology


    In addition, we could also have mixed topologies that combine these main types
    together.


    # Distributed Directory Services


    For a small site, it is perfectly acceptable to run one or two LDAP servers that
    hold an entire LDAP tree. However, as the size of the LDAP tree increases, it
    is desirable to have an LDAP server refer to other directory services for a certain
    part of the LDAP tree. For instance, in a previous session we created a replica
    of the ou=users,dc=linuxaholics,dc=com LDAP branch on the foxtrot own server.
    If we connect to this server we can search for objects in ou=users,dc=linuxaholics,dc=com.
