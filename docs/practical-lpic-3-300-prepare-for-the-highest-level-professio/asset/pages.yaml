    dn: ou=users,dc=linuxaholics,dc=com

    objectClass: organizationalUnit

    ou: users

    ```


    For the OpenLDAP server to request a valid client certificate, we need to include
    olcTLSVerifyClient parameter. This parameter can take different values:


    +   * never: The server will not request any client certificate.

    * allow: The client certificate is requested, but the session proceeds normally
    even if no certificate or a bad certificate is provided.

    * try: The client certificate is provided. If no certificate is provided, the
    session proceeds normally, but if a bad certificate is provided the session is
    terminated immediately.

    * demand | hard: These two keywords are equivalent. The server requests a valid
    client certificate. If a valid client certificate is not provided, the session
    is terminated.


    ```

    [root@alpha ld]# cat certclient.ldif

    dn: cn=config

    changetype: modify

    add: olcTLSVerifyClient

    ```'
