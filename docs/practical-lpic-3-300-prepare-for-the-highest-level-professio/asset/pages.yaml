  md: '# CHAPTER 8 SAMBA CONCEPTS AND ARCHITECTURE, CONFIGURING SAMBA, AND INTERNATIONALIZATION


    We add the share definition to the Samba registry with **net conf**.


    ```

    [root@hotel ~]# net conf addshare regshare /reg_share/ writable=N guest_ok=y "Registry
    based share"

    ```


    We pass the share name (/reg_share/), and a couple of parameters: not writeable
    and public.


    We can check that the share definition has been added correctly to the Samba registry
    with **net registry enumerate**.


    ```

    [root@hotel ~]# net registry enumerate HKLM\Software\Samba\smbconf''

    Keyname = regshare

    Modtime = jue, 01 ene 1970 01:00:00 CET

    [root@hotel]# net registry enumerate HKLM\Software\Samba\smbconf\regshare

    Valename = path

    Type = REG_SZ

    Value = "/reg_share/"

    nValename = comment

    Type = REG_SZ

    Value = "Registry based share"

    nValename = guest ok

    Type = REG_SZ

    Value = "yes"

    nValename = read only

    Type = REG_SZ

    Value = "yes"

    ```


    We see that the command added several values of the type REG_SZ. This is a string
    terminated by a null character. There are many other types, like REG_MULTSZ, which
    is a sequence of strings terminated by null. Besides these two commonly used types,
    there are many others that can be studied in the official documentation from Microsoft.


    We can also list the shares and the whole configuration included in the Samba
    registry with **net conf**.'
