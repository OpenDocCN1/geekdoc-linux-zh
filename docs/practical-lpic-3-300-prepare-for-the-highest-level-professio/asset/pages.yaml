  pgno: 495
- img_proc: true
  md: 'CHAPTER 18 CONFIGURING SAMBA AS A DOMAIN MEMBER SERVER IN AN EXISTING ACTIVE
    DIRECTORY DOMAIN


    # # The AD Back End


    This ID mapping back end implements a read-only API to read user and group information
    from Active Directory. For this back end to work we need to add the following
    line in smb.conf:


    ```

    idmap config LINUXAHOLICS : unix_nss_info

    ```


    When adding this line we can specify two different modes:


    ```

    idmap config LINUXAHOLICS : unix_nss_info = yes

    idmap config LINUXAHOLICS : unix_nss_info = no

    ```


    In the first case, the back end reads all the information available from Active
    Directory:


    +   - Users: Account name, UID, login shell, home directory path, and primary
    group.

    - Groups: Group name and GID.


    In the second case, only subset of the previous information is read:


    +   - Users: Account name, UID, and primary group.

    - Groups: Group name and GID.


    The second mode (unix_nss_info = no) is the default.

    Finally, these are the lines we''ll add to the Samba configuration file:


    ```

    idmap config LINUXAHOLICS:backend = ad

    idmap config LINUXAHOLICS:schema_mode = rfc2307

    idmap config LINUXAHOLICS:range = 3000-7999

    ```


    We''ll specify the shell and the home directory, too.


    ```

    template shell = /bin/bash

    template homedir = /home/%U

    ```


    We''ll also include the line mentioned previously:


    ```

    idmap config LINUXAHOLICS:unix_nss_info = yes

    ```'
