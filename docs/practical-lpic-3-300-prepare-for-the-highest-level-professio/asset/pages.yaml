    # Identify TDB File Corruption


    If our Samba server becomes corrupted and we have cautious enough to create a
    backup, the restoration process should be pretty simple.


    Let''s emulate file corruption in /var/lib/samba/private/passdb.tdb by using the
    dd command.


    ```

    [root@hotel private]# dd if=/dev/zero of=passdb.tdb bs=1k count=10

    10+0 records in

    10+0 records out

    10240 bytes (10 kB) copied, 0,00118678 s, 8,6 MB/s

    ```


