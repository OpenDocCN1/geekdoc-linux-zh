    Besides the guest parameter we included in the share definition, there are also
    a few more options regarding guest access that should be considered. One of them
    is map to guest. This parameter can take four different values that will make
    the server behave differently regarding guest access. We haven''t included this
    parameter in our smb.conf file, but it has a default value. To check this default
    value, we execute testparam with the -v option.


    ```

    [root@hotel ~]# testparam -sv | grep "map to guest"

    ```


    +   * map to guest = Never


    As we can see, the default value in this case is Never. We''ll see in more detail
    the different values associated with this parameter in Chapter 13, when we talk
    about user mapping. For now, we''ll say that this default value implies that any
    request with an invalid username/password combination will be rejected, effectively
    denying guest access. We''ll edit the /etc/samba/smb.conf file and add this line
    in the global section:


    +   * map to guest = Bad User


    This value means that every access with an invalid password will be mapped to
    the guest user.

    After restarting the SMB service we''ll be able to access the share anonymously.


    ```

    [root@alpha ~]# smclient //hotel.linuxaholics.com/Docs -U guest

