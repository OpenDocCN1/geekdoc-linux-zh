    The libraries needed for the SASL framework to work are provided by the cyrus-sasl
    package, which is installed as a dependency when installing OpenLDAP. We have
    already used SASL when executing utilities like ldapsearch. SASL can be used with
    EXTERNAL mechanisms, Kerberos, and so on, but it can also use secrets stored in
    the directory itself or in its own database.


    # Sasldb


    One of the SASL mechanisms is sasldb, Curiously, this doesn seem to be the key
    concepts included in the LPIC-300 objectives. This doesn''t seem to be the preferred
    way to authenticate users currently. In fact, if we take a look at the main page
    of the SLAS service (sasauth), this is what we''ll see:


    +   - sasldb (All platforms)


    Authenticate against the SASL authentication database. Note that this is probably
    not what you want to use, and is even disabled at compile-time by default. If
    you want to use sasldb with the SASL library, you probably want to use the pwcheck_method
    of "auxprox" along with the sasldb auxprox plugin instead.


    Anyway, because sasldb is included in the certification objectives, we''ll go
    over how we can configure it. First of all, check whether the sasldb plug-in is
    ready.


    ```

    [root@alpha ~]# pluginviewer -a

    ```


    Installed and properly configured auxprox mechanisms are:

    sasldb


    +   - List of auxprox plugins follows - Plugin "sasldb", API version: 8


    supports store: yes


    Because SASL can be used by different applications, we can create a customized
    configuration file in the /usr/lib64/sas2 folder for every service that uses SASL.
    The name of the file must be that of the service with the conf extension, so in
    our case we''ll create a slapd.conf file with this content:'
