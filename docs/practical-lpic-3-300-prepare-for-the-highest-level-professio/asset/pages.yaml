  md: '# CHAPTER 16


    # # Configuring Samba as a Domain Member Server in an Existing NT Domain


    In Chapter 15 we configured a DC for the first time, creating our first domain.
    A Samba DC is in charge of authenticating the users of a domain. However, a Samba
    server can be part of a domain without acting as a DC. In this case, the server
    plays the role of a member server.


    When a user tries to access the member server, this one delegates authentication
    to a DC. If the authentication is successful, the user will be able to access
    the server resources, depending on the rights assigned to the user. In this chapter
    we''ll cover the following concept:


    +   - Joining Samba to an existing NT4 domain.


    We will also explore following terms and utilities: smb.conf, server role, server
    security, and net command.


    # ## Joining a Samba Server to an NT4 Domain


    We already installed a PDC in the previous chapter; now we''re about to add a
    member server to our newly created NT domain. We''ll assume the new member server
    has a fresh default Samba installation without any customizations before proceeding.'
  merge: -1
  pgno: 429
- img_proc: true
  md: '# CHAPTER 16 CONFIGURING SAMBA AS A DOMAIN MEMBER SERVER IN AN EXISTING NT
    DOMAIN


    Any Samba server can be made a domain member. This has a series of advantages
    having a centralized security, now the users will be able to authenticate against
    the domain Security Account Manager (SAM) database. This is also known as SSO.


    As we saw in Chapter 15 when adding workstations to the domain, for a workstation
    (or server) to be a member of any given domain, a machine trust account is needed.
    This is a security measure used to prevent rogue servers or workstations from
    getting access to the domain. A Windows NT PDC stores all the machine trust accounts
    in the Windows registry; however, Samba uses a different approach.


    Samba stores a security account in the passdb back end configured in the smb.conf
    file. In addition to this, a corresponding UNIX user account is required, which
    will be typically stored in /etc/passwd.


    There are currently three ways to create machine trust accounts:


    +   - Manual creation from the Linux command line.

    - Using Windows NT Administrative Tools.

    - As soon as a client joins a domain, a machine trust account is automatically
    created.


    If we need to manually create a machine trust account for a workstation called
    foxt, this is what we''d do in the PDC.


    ```

    [root@juliet ~]# useradd -g machines -d /dev/null -c "lima" -s /bin/false lima$

    useradd: group ''machines'' does not exist

    [root@juliet ~]# groupadd machines

    [root@juliet ~]# useradd -g machines -d /dev/null -c "lima" -s /bin/false lima$

    useradd: warning: the home directory already exists.

    Not copying any file from skel directory into it.

    ```


    We make the account a member of the machines group (if we don''t have a machines
    group, we have to create it), and we assign it a dummy home directory and no shell.
    We need to specify a name ending in $, otherwise it won''t be recognized as a
    machine account.'
  merge: -1
