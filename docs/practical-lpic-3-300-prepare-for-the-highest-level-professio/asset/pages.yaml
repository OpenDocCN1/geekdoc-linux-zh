  md: '# About the Technical Reviewer


    ![](img/dfa44432604022575079471b648e25ca_16_0.png)


    Thiago Magalhães is a Linux Infrastructure Analyst with more than ten years of
    experience in the IT industry. He also works in a DevOps role with hands-on experience
    in supporting, automating, and optimizing mission-critical deployments.


    A Linux lover at heart, he focuses on security, high availability, containers,
