    # # File Services Migration


    Samba services can be migrated from one server to another. Depending on the operating
    system of the servers, there are several possible scenarios:


    +   * Migrate from a Windows server to a Linux Samba server.

    * Migrate from a Linux Samba server to another Linux Samba server.


    # # Migrate from a Linux Samba Server to Another Linux Samba Server


    If we need to migrate our Samba server to a newer Linux server, we''ll need to
    perform several actions:


    +   * Install Samba binaries.

    * Copy the Samba configuration (/etc/samba/smb.conf file).

    * Migrate the Samba users to the new server.

    * Migrate the Samba groups to the new server.

    * Create the shares in the new server.

    * Migrate the actual data to the new server, retaining the correctct permissions.


    Let''s now examine each step in detail.'
