    # Using Samba VFS to Store Windows ACLs


    To support Windows ACLs, Samba should have been compiled with the HAVE_LIBACL
    option. This is usually the case when working with the Samba compiled binaries
    of the main distributions like CentOS, but we can check it anyway:


    ```

