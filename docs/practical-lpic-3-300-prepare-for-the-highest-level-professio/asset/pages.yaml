  md: '# CHAPTER 7


    # Starting with Samba


    As we did when we studied OpenLDAP in the previous section, we''re going to start
    with a brief introduction to Samba. Samba is an open source implementation of
    the Server Message Block (SMB) protocol, later renamed the Common Internet File
    System protocol. This protocol was originally developed by Microsoft to provide
    file access over the network.


    # Installing Samba


    Obviously, the first thing we need to do is install the software.


    ```

    [root@hotel ~]# yum install samba

    ```


    The main configuration file is /etc/samba/smb.conf. At first it might look complicated,
    but despite its length it is really well documented. It is always a good exercise
    to take a look at this file and the comments on it. For now, though, we''ll start
    with something simple.


    # Creating a Share


    Let''s suppose we want to share a folder among several Windows clients. The first
    step is to create the folder on the server:


    ```

    [root@hotel ~]# mkdir /shared_docs

    ```


    If we have SELlinux enabled, which is usually a good idea, we also have to relabel
    the folder we created so that it can be shared with Samba.


    ```

    [root@hotel ~]# ls -Zd /shared_docs/

    drwxr-xr-x. root root unconfined u:object_r:default_t:s0 /shared_docs/

    [root@hotel ~]# chcon -t samba_share_t /shared_docs/

    [root@hotel ~]# ls -Zd /shared_docs/

    drwxr-xr-x. root root unconfined u:object_r:samba_share_t:s0 /shared_docs/

    ```'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# CHAPTER 7 STARTING WITH SAMBA


    Now we can use the folder as a Samba share. However, if we want the changes to
    survive SELinux relabel, we should execute this command instead:


    ```

    [root@hotel ~]# seman fcontext -a samba_share_t "/shared_docs/(.*)"

    ```


    Depending on the exact version of CentOS 7 we are working on, we can have an /etc/samba/smb.conf.sample
    file with many configuration examples or we can have those same examples commented
    in the /etc/samba/smb.conf file itself. In any case, we can see some examples
    of commented network shares like this one:


    # A publicly accessible directory that is read only, except for users in the #
    "staff" group (which have write permissions):


    ```

    [public]

    comment = Public Stuff

    path = /home/samba

    public = yes

    writable = yes

    printable = no

    write list = +staff

    ```


    We see the name of the share ([public]), a comment, and the path it points to.
    We can also see a series of parameters that define many characteristics of the
    share. In this case the public share is (would be) writable, can be browsed by
    anyone (public), and the users in the staff group can write to it. The printable
    parameter means that spool files can be written in this location; this is only
    useful when defining Samba printers.


    Now we know a bit more about Samba shares, we are going to create a new one. We''ll
    name our shared resource Docs, with the comment Public documents, and the path
    will be that of the folder we just created (/shared_docs). Initially we''ll make
    the resource readable but not writable.


    ```

    [Docs]

    comment = Public documents

    path = /shared_docs

    public = yes

    writable = no

    ```'
