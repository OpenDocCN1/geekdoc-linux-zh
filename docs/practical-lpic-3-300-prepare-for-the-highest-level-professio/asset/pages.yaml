- img_proc: true
  md: '# Kerberized NFS


    We have already seen how easy it is to configure an NFS server. The drawback,
    however, is that NFS configured by default is not a very secure protocol. In the
    /etc/fstab file grant or deny access based on the hostname or IP address of the
    client computers. In our case we used the following line:


    ```

    /NFS   *(rw)

    ```


    We exported the directory to everybody (*), but we could also be more specific,
    giving read or write access to only a few computers, as in this example:


    ```

    /NFS   romeo.linuxaholics.local sierra.linuxaholics.local(r)

    ```


    In any case, this type of security based only on the host address is not desirable,
    especially when it is the only security measure. For this reason, the use of kerberized
    NFS is recommended whenever possible. This implies that Kerberos will be responsible
    to grant or deny access to the NFS server.


    The NFS we''ve been using so is not part of the FreeIPA domain, but for this example
    we use Kerberos authentication for all the computers involved (server and client).
    This is definitely easier if both are part of the same FreeIPA domain, so we''ll
    use our FreeIPA queer.linuxaholics.local as our new NFS server. We begin by adding
    the corresponding service.


    ```

    [root@quebec ~]# ipa service-add nfs/quebec.linuxaholics.local

    ```


    ```

    Added service "nfs/quebec.linuxaholics.local@LINUXAHOLICS.LOCAL"

    ```


    Principal name: nfs/quebec.linuxaholics.local@LINUXAHOLICS.LOCAL

    Principal alias: nfs/quebec.linuxaholics.local@LINUXAHOLICS.LOCAL

    Managed by: quebec.linuxaholics.local


    Next, we add the key(s) to the keytab file. Users authenticate against Kerberos
    by the kinit command to get their credentials. These credentials can later be
    seen with klist. The host, on the other hand, can authenticate as Kerberos, but
    obviously they cannot use kinit interactively and they need a different approach.
    The solution is the use of keytab files.'
  merge: -1
  pgno: 711
- img_proc: true
  md: 'The default keytab file for every server in the FreeIPA domain is located at
    /etc/

    b5.keytab. We use kadmin.local to add the needed key(s) for the NFS service.


