  md: '# CHAPTER 14 AUTHENTICATION, AUTHORIZATION, AND WINBIND


    Windbind could use cached credentials to permit a user to log in when the DC is
    offline, but we decided not to use this option. If we want to use it in the future,
    we can change the value of the windbind offline logon from false to true, or we
    can execute authconfig-gtk and select the Allow offline login check box (Figure
    14-1).


    Another interesting option is windbind use default domain. In the next section
    we''ll see how to log in to Linux using an Active Directory account by specifying
    account name and Active Directory domain name, separated by an @ sign. If we had
    configured windbind to use a default domain we could log in by specifying the
    username. However, in certain cases this case can cause confusion with local users
    and it is not recommended.


    The idmap configuration * option tells windbind to map Windows IDs and Linux user
    and group IDs. In our case, the Active Directory users will be assigned IDs in
    the 16777216-33554441 range.


    Finally, authconfig also includes the kerberos method option, which controls how
    Kerberos tickets are verified; secrets only is the default value used and is fine
    for our purposes.


    Apart from listing the users we can get information about a certain user.


    ```

    [root@india]# wbinfo -i jose@ventanas.local

    VENTANAS.LOCAL\jose:*:16777216:16777216::/home/VENTANAS.LOCAL/jose:/bin/

    false

    ```


    Alternatively, we can get their SID.


    ```

    [root@india]# wbinfo -n jose@ventanas.local

    S-1-5-21-36214644426-179104875-4169316838-1105 SID_USER (1)

    ```


    # Configuring NSS and PAM


    We studied NSS briefly when talking about OpenLDAP (Chapter 3). When Linux needs
    to locate a user, it looks at the /etc/nsswitch.conf file to know where to search.
    In this case we could find the following lines:


    ```

    passwd: files sss

    shadow: files sss

    group: files sss

    ```'
  merge: -1
