- img_proc: true
  md: 'If we choose the first option, we can make a hot backup with the db_hotbackup
    command.


    ```

    [root@alpha ldap# db_hotbackup -h /var/lib/ldap/ -b ../bdb_backup/

    root@alpha ldap#] ls bdb_backup/

    alock dn2id.bdb log.0000000001 ou.bdb

    cn.bdb id2ntry.bdb objectClass.bdb sn.bdb

    ```


    This way we copied the database files, as well as the transaction log, to a new
    location. From there, they can be restored if we need to do so. The restoration
    was performed with the db_recover tool.


    ```

    [root@alpha ldap#] db_recover -v -h /var/lib/ldap/

    BDB2526 Finding valid log LSN: file: 1 offset 3571

    BDB1514 Recovery starting from [1][2997]

    BDB1518 Recovery complete at Thu Jun 15 10:33:38 2017

    BDB1519 Maximum transaction ID 80000002 recovery checkpoint [1][3746]

    [root@alpha ldap#]

    ```


    If we decide to use the second option, we should generate an LDIF file that would
    be used later to restore the data.


    ```

    [root@alpha ldap#] slapcat -b "dc=linuxaholics,dc=com" > myOpenLDAP.ldif

    ```


    In this case, though, if the database files get corrupted, we might need to perform
    a fresh installation and insert the data from the LDIF file later, once the OpenLDAP
    server is operational again.


    Another utility we haven''t seen so far that can be very useful is db_verify,
    used to verify database files.


    ```

    [root@alpha ldap#] db_verify -h /var/lib/ldap/ /var/lib/ldap/dn2id.bdb

    BDB5105 Verification of /var/lib/ldap/dn2id.bdb succeeded.

    [root@alpha ldap#]

    ```


    # Tools


    There are several useful tools that we can use to query and manage our LDAP server.
    Some of them have already been used in this chapter, and others will be used in
    the upcoming chapters.'
