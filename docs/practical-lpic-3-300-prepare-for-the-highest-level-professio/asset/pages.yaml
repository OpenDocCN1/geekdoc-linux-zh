    In Chapter 17 we saw how to install Samba 4 Active Directory DCs. Now we''re focused
    on configuring Samba as a domain member in an Active Directory domain. This is
    similar to what we did in Chapter 16 when we installed a Samba 3 NT domain member.
    In this chapter we''ll cover the following concepts:


    +   * Joining Samba to an existing Active Directory domain.

    * Ability to obtain a ticket-granting ticket (TGT) from a Key Distribution Center
    (KDC).

    * Understanding DFS.

    * Configuring DFS shares.

    * Awareness of Samba clustering and Clustered Trivial Database (CTDB).


    We will also learn about the following terms and utilities: smb.conf, server role,
    server security, net command, host msdfs, msdfs root, kinit, TGT, and REALM.'
