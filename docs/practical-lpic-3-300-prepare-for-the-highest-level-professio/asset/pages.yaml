  md: '# CHAPTER 19 NETBIOS AND WINS


    When we set the value of wins support to yes, the nmbd component of Samba enables
    its WINS server. By default, this value is set to no. If at some point we are
    not sure of the default value a certain parameter takes, we can check it with
    the testparam -v command. If we launch this command on the Active Directory member
    server we installed previously, this is what we''ll see:


    ```

    [root@echo ~]# /usr/local/samba/bin/testparam -v | grep wins

    Load smb config files from /usr/local/samba/etc/smb.conf

    rlimit_max: increasing rlimit_max (1024) to minimum Windows limit (16384)

    Loaded services file OK.

    Server role: ROLE_DOMAIN_MEMBER

    ```


    +   * wins support = No


    To make this server a WINS server we need to add the line wins support = Yes to
    the /usr/local/samba/etc/smb.conf file and reload the configuration with smbconf.


    ```

    [root@echo ~]# /usr/local/samba/bin/smbcontrol smbd reload-config

    [root@echo ~]# /usr/local/samba/bin/testparam -v | grep wins

    Load smb config files from /usr/local/samba/etc/smb.conf

    rlimit_max: increasing rlimit_max (1024) to minimum Windows limit (16384)

