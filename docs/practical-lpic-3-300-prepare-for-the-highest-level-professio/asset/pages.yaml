    As we can see, the new file has the associated permissions rwx-r-r-- (764) instead
    of the value we had specified (775). The execute bit has been subtracted from
    the specified mode, so the final result was 775 - 011 = 764. This behavior has
    to do with Unix and permissions and the value of the umask applied to newly created
    files.


    If we really need to activate the execute bits for group and other, we need to
    use another parameter, force create mode. We''ll comment out the create mask line
    and add a new one with the force create mode parameter.


    ```

    [Docs]

    comment = Public documents

    path = /shared_docs

    public = yes

    writable = yes

    #create mask = 0775

    force create mode = 0775

    ```


    If we create another file from our Samba client, we''ll see that now the permissions
    are assigned exactly what we expected.


