    ```

    ldap machine suffix = ou-computers

    ldap user suffix = ou-users

    ldap suffix = dc=samba,dc=org

    ```


    ```

    idmap backend = ldap:"ldap://localhost"


    idmap uid = 5000-50000

    idmap gid = 5000-50000

    ```


    Obviously, we need to adapt this example to our existing infrastructure. In our
    case, the lines we need to include in the /etc/samba/smb.conf file would be these:


    ```

    security = user

    passdb backend = ldaps:"ldap://alpha.linuxaholics.com"

    ldap admin dn = cn=admin,dc=linuxaholics,dc=com


    laps:trusted = yes

    ldap:editposix = yes

    ldap delete dn = yes

    ldap group suffix = ou-users

    ldap idmap suffix = ou-users

    ldap machine suffix = ou-users

    ldap user suffix = ou-users

    ldap suffix = dc=linuxaholics,dc=com

    ```


    ```

    idmap backend = ldap:"ldap://alpha.linuxaholics.com"


    idmap uid = 5000-50000

    idmap gid = 5000-50000

    ```


