    # WINS


    WINS was implemented by Microsoft as a name server for NetBIOS computer names.
    It is analogous to DNS, but it uses NetBIOS names instead of domain names.

    As soon as a WINS client starts, it registers its NetBIOS name and IP address
    with the WINS server. In turn, when a WINS client queries a NetBIOS application
    it the WINS server finds the queried name will respond with the corresponding
    IP address.


    # Samba and WINS


    In the /etc/samba/samba.conf file there are some parameters devoted to name resolution.


    ```

    wins support = yes

    wins server = w.x.y.z

    wins proxy = yes

    ```


    511'
