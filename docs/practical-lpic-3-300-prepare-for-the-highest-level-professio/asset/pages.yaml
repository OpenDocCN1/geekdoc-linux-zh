    # # ID Views


    ID views are used to specify new values for user or group attributes, as well
    as to define on which host or hosts the new values will be applied. Let''s look
    at an example. We begin by creating the view.


    ```

    [root@quebec ~]# ipa idview-add example_idview_for_romeo

    ```


