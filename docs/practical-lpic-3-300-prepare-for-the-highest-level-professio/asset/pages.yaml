  md: 'The owner of file_one.txt happens to be root, but as the NFS directory is mounted
    with the root_squash option, everything that the root user in the client does
    in the NFS directory is mapped to nfsnbody user. This is the reason we get an
    error.


    **Note** If we want to have more control over how users are mapped in NFSv4 we
    should take a look at the /etc/idmap.conf file and its many options. Most of the
    time, however, it is unnecessary to make any modifications. This controls aspects
    of how the users are mapped.


    The second file, file_two.txt, was created when configuring write permissions.
    The user that was created was the root user from the client computer, but was
    mapped to the nfsnbody user. In theory we should be able to edit the NFSv4 ACL
    of this second file without problems.


    ```

    [root@romeo~]# nfs4_setfac -a A::1494400001:RW /mnt/nfs_client/file_two.txt

    [root@romeo~]# nfs4_getfacl /mnt/nfs_client/file_two.txt

    A::OWNER@rwatTccy

    A::1494400001:rwatccy

    A::GROUP@rtcy

    A::EVERYONE@rtcy

    ```


    If we want to edit the ACL from the first file, we''ll have to change the owner
    in the NFS server.


    ```

    [root@tango ~]# ls -l /NFS/

    total 12

    -rw-r--r-- 1 root      root        4 feb 25 13:04 file_one.txt

    -rw-rw-r--+ 1 nfsnbody nfsnbody 4 feb 25 13:05 file_two.txt

    [root@tango ~]# chown nfsnbody:nfsnbody /NFS/file_one.txt

    [root@tango ~]# ls -l /NFS/

    total 12

    -rw-r--r-- 1 nfsnbody nfsnbody 4 feb 25 13:04 file_one.txt

    -rw-rw-r--+ 1 nfsnbody nfsnbody 4 feb 25 13:05 file_two.txt

    [root@tango ~]#

    ```'
