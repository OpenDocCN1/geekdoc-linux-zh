- img_proc: true
  md: 'slapd: 192.168.1.230

    slapd: ALL: DENY


    In the first line we allow access to the 192.168.1.230 computer and in the second
    line we deny access to every computer. This way the only computer able to access
    will be the one with the IP address 192.168.1.230. If we had changed the order
    of the lines no one would have access to our LDAP, because as soon as a line matches
    a connection, the following lines are ignored.


    We could also combined both lines in a single line:


    slapd: ALL except 192.168.1.230: DENY


