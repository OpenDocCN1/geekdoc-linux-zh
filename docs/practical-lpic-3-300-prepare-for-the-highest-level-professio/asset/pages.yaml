  md: '# Limit Access to IPC$


    IPC$ is a special share used by Windows (and Samba) for inter-process communication
    with Remote Procedure Call (RPC). The client connecting can perform a series of
    actions on the server, like listing users, listing shares, and so on. Nevertheless
    IPC can also be used by hackers to create an anonymous connection and get information
    about the server. To minimize this risk, we can add an [IPC$] entry to the /etc/samba/smb.conf
    file and add the following access list.


    ```

    [IPC$]

    hosts allow = 192.168.1.0/24 127.0.0.1

    hosts deny = 0.0.0.0/0

    ```


    # Scripts for User and Group Handling of File Shares


    We have seen so far that for a user to successfully connect to a Samba share,
    that user must exist in Samba as the operating system itself. When we studied
    file services migration earlier in this chapter, we used scripts that dealt with
    the creation of corresponding Linux users before adding those same users in the
    local Samba database. In fact, when we use the **tdbsam** back end, if we try
    to add a Samba user who doesn''t exist in Linux, we get the following error:


    ```

    [root@hotel ~]# smbpasswd -a Ivan

    New SMB password:

    Retype new SMB password:

    Failed to add entry for user Ivan.

    ```


    However, if we use the `ldaps` back end (see Chapter 8), we could have a Samba
    user without the corresponding Linux user. In this situation we could instruct
    the **samba** service to automatically create the Linux user as he or she connects
    to a Samba share. This can be done with the `add user` script global parameter,
    which by default has no value.


    ```

    [root@hotel ~]# testparm -v | grep "add user script"

    Load smb config files from /etc/samba/smb.conf

    rlimit_max: increasing rlimit_max (1024) to minimum Windows limit (16384)

    Processing section "[homes]"

    ```'
