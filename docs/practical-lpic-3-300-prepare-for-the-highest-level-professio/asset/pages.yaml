  md: '# CHAPTER 3 LDAP INTEGRATION WITH PAM AND NSS


    Now we can download the file to the client. Once the certificate has been downloaded,
    in the system-config-authentication window, we can click Apply. Then the system
    will automatically change a series of files that otherwise would need to be changed
    by hand. For example, it will add the following lines to the /etc/openldap/ldap.conf
    file:


    ```

    URI ldap://alpha.linuxaholics.com

    BASE dc=linuxaholics,dc=com

    TLS CACERTDIR /etc/openldap/cacerts

    ```


    It is, however, very important to make sure that the TLS REQCERT parameter is
    not set to never. If this is the case, ldapsearch won''t use TLS when communicating
    with the server.


    If we don''t have a graphical environment available to execute system-config-authconfig
    we can get the result with the authconfig command.


    ```

    [root@bravo]# authconfig --enableldap --enableldapauth

    --ldapserver-alpha.linuxaholics.com --ldapbasn="dc=linuxaholics,dc=com"

    --enableldaptls --update

    ```


    In this case, however, we''ll need to download the CA certificate file by hand,
    for instance, by using wget or curl.


