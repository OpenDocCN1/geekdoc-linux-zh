  md: '# Smbspool


    According to its man page, **smbspool** is used to send a print file to an SMB
    printer. The syntax of the command should be this:


    smbspool {job} {user} {copies} {options} [filename]


    The command gets the Samba printer by querying an environmental variable, (DEVICE_URI),
    which should have one of these formats:


    ```

    smb://server[:port]/printer

    smb://:workgroup/server[:port]/printer

    smb://:username:password@server[:port]/printer

    smb://:username:password@workgroup/server[:port]/printer

    ```


    We’ll create and export that variable.


    ```

    [root@alpha ~]# export DEVICE_URI=smb://Antonio:antonio@192.168.56.102/printer_Canon

    ```


    Now we execute **smbspool** with the required parameters. If we read the man page,
    we''ll realize that many of these parameters (job, user, and options) are currently
    ignored; however, we must still provide dummy values for these parameters to keep
    the order. We''ll execute this line:


    ```

    [root@alpha ~]# smbspool 1 Antonio antonio 1 something test.txt

    DEBUG: Connected with username/password...

    ```


    The document will then be printed on the Samba printer.


    # Rpccient


    This tool was developed to test MS-RPC functionality in Samba. It is very easy
    to execute and the only mandatory argument is the NetBIOS of the Samba server
    to which we are connecting. Nevertheless, if NetBIOS name resolution isn’t working
    properly, we can force the utility to connect to a certain IP using the -I parameter,
    in this case the NetBIOS server name is ignored. We can also specify the Samba
    user we’ll be using to connect. In this example we used the user Antonio, which
    was given administrative privileges in a previous section.'
