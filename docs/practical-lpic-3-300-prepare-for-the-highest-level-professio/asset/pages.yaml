  md: '# CHAPTER 15 SAMBA AS A PDC AND BDC


    For the Windows workstations to log in to the domain, we need to provide a network
    logon service. We''ll have to activate this characteristic in /etc/samba/sm.conf
    with the domain logon parameter, and create a NETLOGON share. In the Samba version
    installed in CentOS 7 there is already a full definition of the [netlogon] share
    that we only need to comment.


    domain logons = yes


    # Uncomment the following and create the netlogon directory for Domain Logons:


    ```

    [netlogon]

    comment = Network Logon Service

    path = /var/lib/samba/netlogon

    guest ok = yes

    writable = no

    share modes = no

    ```


    The path for the [netlogon] share might not exist; in that case we''ll need to
    create it. [root@juliet]# mkdir /var/lib/samba/netlogon


    Finally, we also need to add a series of parameters regarding a few necessary
    scripts.


    ```

    logon script = %u.bat

    logon path = \\L\Profiles\u

    # use an empty path to disable profile support:

    logon path =

    add user script = /usr/sbin/useradd "%u" -n -g users

    add group script = /usr/sbin/groupadd "%g"

    add machine script = /usr/sbin/useradd -n -c "Workstation (%u)" -M

    -d /nohome -s /bin/false "%u"

    delete user script = /usr/sbin/userdel "%u"

    delete user from group script = /usr/sbin/userdel "%u" "%g"

    delete group script = /usr/sbin/groupdel "%g"

    ```


