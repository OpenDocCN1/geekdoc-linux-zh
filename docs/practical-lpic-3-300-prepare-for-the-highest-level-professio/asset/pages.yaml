  md: '# CHAPTER 8 SAMBA CONCEPTS AND ARCHITECTURE, CONFIGURING SAMBA, AND INTERNATIONALIZATION


    We can see that all the communication is unencrypted, without any trace of using
    SSL or TLS. In turn, if we want the traffic between the Samba and the OpenLDAP
    server to be ciphered, we need to change again a series of parameters. First,
    we change the value of the two parameters we added previously:


    ```

    ldap ssl = start tls

    tls enabled = Yes

    ```


    In addition to these parameters, we also need to add some more TLS-related parameters:


    +   - Tls cafile: This option will be set to the location of a file in Privacy-Enhanced
    Mail (PEM) format that contains the certificates of the root CA.

    - Tls certfile: This points to the location of the certificate file of the server
    in PEM format.

    - Tls keyfile: It specifies the location of a file, also in PEM format, that contains
    the private key of the server.


    We already generated all those files previously in this chapter, when testing
    the secure LDAP connection from the Samba server. First we copy this file from
    the CA server, which happens to be the first OpenLDAP server, to the Samba server.
    We create the /var/lib/samba/private/tls folder and transfer here the following
    files.


    ```

    [root@hotel tls]# sc alpha.linuxaholics.com:/etc/pki/CA/certs/ca.cert.pem

    root@alpha.linuxaholics.com''s password:

    ca.cert.pem 100% 1318 71.1KB/s 00:00

    [root@hotel tls]# sc alpha.linuxaholics.com:/etc/pki/CA/certs/hotel.

    linuxaholics.com.crt .

    root@alpha.linuxaholics.com''s password:

    hotel.linuxaholics.com.crt 100% 4464 4.8MB/s 00:00

    [root@hotel tls]# sc alpha.linuxaholics.com:/etc/pki/CA/private/hotel.

    linuxaholics.com.key

    root@alpha.linuxaholics.com''s password:

    hotel.linuxaholics.com.key 100% 1675 2.2MB/s 00:00

    ```'
