  md: '# CHAPTER 27


    # Network File System


    NFS is a distributed file system originally developed by Sun. In this chapter,
    we’ll cover the following concepts:


    +   * Understanding major NFSv4 features.

    * Configuring and managing an NFSv4 server and clients.

    * Understanding and using the NFSv4 pseudo file system.

    * Understanding and using NFSv4 ACLs.

    * Using Kerberos for NFSv4 authentication.


    We will also learn about the following terms and utilities: exportfs, /etc/exports,
    /etc/idmapd.conf, nfs4_editfacl, nfs4_getfacl, nfs4_setfacl, mount, and /etc/fstab.


    # NFS Main Characteristics


    Sun initially released the NFS protocol in the late 1980s. As with many other
    protocols, it has undergone numerous updates.


    It allows us to keep data at a central host to which the clients connect. The
    clients will connect to the central host by mounting the directories as if they
    were local. This host is very often used to store the home directories of the
    users at a central location from which they can be mounted by modifying the /etc/fstab
    file or with mount.


    In versions of the protocol older than NFSv4, when a client wants to mount a directory
    exported through NFS, it starts contacting the mountd service in the server. This
    is done with an RPC call. The client has successfully mounted the directory, whenever
    it needs to access a file it will make a new RPC call. All this changed in version
    4, which integrates support for those services. It is no longer necessary to have
    independent services for RPC and mountd.


    Besides, NFSv4 includes many improvements over its predecessors. It is a stateful
    protocol with better performance and more focus on security.'
