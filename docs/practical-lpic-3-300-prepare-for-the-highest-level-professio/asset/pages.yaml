    **Figure 3-4.** Downloading the certificate


    When we created the certificate on the server, we placed it in /etc/openldap/cacerts.
    To make it available for download we can copy it to a web site, FTP server, and
    so on We''re not going into much detail how to configure a web server so we''ll
    only explain how to perform a default installation.


    First, we install the Apache server (httpd package).


    ```

    [root@alpha~]# yum install -y httpd

    ```


    Then we start the service and we enable it.


    ```

    [root@alpha~]# systemctl start httpd

    [root@alpha~]# systemctl enable httpd

    ```


    Created symlink /etc/systemd/system/multi-user.target.wants/httpd.service to /usr/lib/systemd/httpd.service


    The default DocumentRoot after a fresh installation is the /var/www/html/ folder,
    so we copy our CA certificate file there.


    ```

    [root@alpha~]# cp /etc/pki/CA/certs/ca.cert.pem /var/www/html/

    ```


    We allow access to the HTTP port in the firewall.


    ```

    [root@alpha~]# firewall-cmd --permanent --add-service=http

    success

    ```


    ```

    [root@alpha~]# firewall-cmd --add-service=http

    success

