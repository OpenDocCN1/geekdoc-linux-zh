- img_proc: true
  md: '# CHAPTER 14 AUTHENTICATION, AUTHORIZATION, AND WINBIND


    This means that Linux will try to locate a certain username in the /etc/passwd
    and / etc/shadow files, and if it cannot find it there it will query the ssd service.
    Analogously when Linux needs to locate a group it will look up in the /etc/group
    file.


    After installing windbind and executing authconfig in the previous section, the
    system automatically changed those three lines in the /etc/nsswitch.conf file,
    which now looks like this.


    ```

    [root@india ~]# cat /etc/nsswitch.conf

    ```


    password: files sss windbind

    shadow: files sss windbind

    group: files sss windbind


    Now, after searching for a user in the local files and querying the ssd service,
    the system will also query the windbind service. So, for instance, if we try to
    log in as the user jose@ventanas.local on our Linux server, the system will find
    that user by querying the windbind service.


    However, this is not enough to be able to log in to the system. It is necessary
    to authenticate the user through the use of a password or other method, check
    whether user is authorized to log in to the system, and so on. All these tasks
    are accomplished by Pluggable Authentication Modules (PAM). We already saw a brief
    description of PAM when we studied OpenLDAP and an in-depth explanation is beyond
    the scope of this book, so we explain it briefly.


    After installing windbind, a new PAM module (pam_windbind.so) was installed, and
    we can see it in the /usr/lib64/security folder, with the rest of the PAM modules.


    After executing authconfig-gtk the PAM configuration files were modified to grant
    access to Active Directory users. The PAM configuration files are located in the
    /etc/pam folder. There we will see many files. When a user tries to log in locally
    or through SSH the corresponding file determines what PAM modules are used to
    grant or deny access.


    For example, when the user jose@ventanas.local tries to log in through SSH these
    are the PAM modules used during the process.'
