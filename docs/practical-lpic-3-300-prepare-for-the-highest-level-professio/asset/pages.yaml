    group Groups of users

    hbac Host-based access control commands

    hbact Simulate use of Host-based access controls

    host Hosts/Machines

    hostgroup Groups of hosts.

    idrange ID ranges

    idviews ID Views

    krbtpolicy Kerberos ticket policy

    location IPA locations

    migration Migration to IPA

    misc Misc plug-ins

    netgroup Netgroups

    top One time password commands

    passwd Set a user''s password

    permission Permissions

    ping the remote IPA server to ensure it is running.

