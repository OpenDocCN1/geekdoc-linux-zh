    # Restoring Samba Configuration


    Let''s assume we are working a Samba stand-alone server, using tdams as a back
    end

    (Chapter 8). We have created a backup of the passdb.tdb file if the passdb.tdb
    file gets corrupted or is accidentally deleted, we won''t be

    able to access the Samba shares anymore. After restarting the SMB service a new
    passdb.tdb file will be created, and the user

    information will be gone.'
