  md: '# Joining a Samba Server to an Existing Active Directory Domain


    According to the Samba wiki, a Samba Active Directory domain member is a server
    that is part of the domain but does not provide domain services. As we did when
    we a Samba Active Directory DC, we''ll start with a fresh CentOS 7 installation
    without any Samba software installed on it. We''ll also stop the NetworkManager
    service so that it does not modify the /etc/resolv.conf file.


    # Preparing the Server


    The first thing we need to do is to change the DNS settings so that the Active
