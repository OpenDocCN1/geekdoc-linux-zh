  md: '# CHAPTER 26


    # FreeIPA AD Integration


    Most large networks now include different technologies, so it is quite possible
    that we need to integrate Active Directory and FreeIPA. Fortunately, this is not
    as complicated as it might sound at first because FreeIPA includes many tools
    to help us achieve this integration. In this chapter we''ll cover the following
    concepts:


    +   - Understanding and setting up FreeIPA and Active Directory integration using
    Kerberos cross-realm trusts.

    - Configuring ID ranges.

    - Understanding and managing external non-POSIX groups in FreeIPA.

    - Awareness of Microsoft Privilege Attribute Certificates and how they are handled
    by FreeIPA.

    - Awareness of replication-based FreeIPA and Active Directory integration.


    We will also learn about the following terms and utilities: ipa-adtrust-install
    and ipa (relevant trust-*, idrange-* and group-* subcommands).


    # Trust Relationships


    We have seen in previous chapters that users in a Kerberos realm are given tickets
    to access resources in the same Kerberos realm. It is also possible, though, for
    a user in a Kerberos realm to access resources in a different Kerberos realm,
    as long as there is a trust relationship.


    When this happens, users from Domain A can access resources in Domain B. B is
    said to be the trusting domain, and Domain A will be the trusted domain (Figure
    26-1).'
  merge: -1
  pgno: 661
- img_proc: true
  md: 'CHAPTER 26 FREEIPA AD INTEGRATION


    # DOMAIN A


    # DOMAIN B


    ![](img/dfa44432604022575079471b648e25ca_662_0.png)


    Figure 26-1. Trust relationship


    Trust relationships can be unidirectional or bidirectional. For instance, in Figure
    26-1, users in Domain A can access resources in Domain B, users in Domain B cannot
    access resources in Domain A. In a bidirectional trust relationship, both domains
    trust each other and resources on any of the domains can be accessed by any user
    independent of the domain to which they belong.


    Establishing a trust relationship between an Active Directory domain and a FreeIPA
    domain is the preferred way to integrate both systems.


    # Cross-Realm Trusts


    Now we''ve seen the theory behind trust relationships, we''ll look at how to actually
    implement them. As Active Directory servers use Kerberos, at least in theory,
    we can establish trust relationships between Linux and Windows domains, as well
    as between Linux domains.


    664'
  merge: -1
  pgno: 662
