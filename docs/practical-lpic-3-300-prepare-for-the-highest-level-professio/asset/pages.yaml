  md: '# CHAPTER 13 MANAGING USER ACCOUNTS AND GROUPS


    A special type of user mapping concerns the Guest user. Historically, Windows
    systems have included a special account called Guest to grant limited rights to
    any unknown user. In Samba this account is mapped by default to the Linux account
    nobody (guest account = nobody). It is possible to change this mapping by manually
    specifying a different user, although is not advisable to do so.


    A related option is map to guest. Depending on the value of this parameter, Samba
    will behave differently:


    +   - Never: In this case any login with an invalid password is rejected.


    +   - Bad User: User logins with an incorrect password are rejected, unless the
    username does not exist, in which case it will be mapped to the guest account.


    +   - Bad Password: User logins with incorrect passwords are treated as guest
    logins. This can be confusing, as a user might not be aware of the incorrect password
    and will probably not understand why they cannot access resources normally.


    +   - Bad uid: Only applicable when Samba is integrated in a domain.


    In addition to map users, Samba also maps Linux and Unix group IDs to Windows
    Sims. This can be done with the net groupmap command. We''ll see many examples
    of this command in Chapter 15, when configuring Samba as a PDC.


