    The user will be added to the smbpasswd.


    ```

    [root@hotel ~]# cat /var/lib/samba/private/smbpasswd

    dummy:1006:XXXXXXXXXXXXXXXXXXXXXXXXXXXX:BC62ACF8EA9DD1AD703C8B4F0A968C4:[U]:LCT-5B76A654:

    ```


    In the file there is, at this moment, a single line that contains the username,
    the user ID, the Lanman password hash, the NT password hash, and the account flags.
    The part corresponding to the Lanman hash has no value stored because by default
    modern Samba distributions don''t use it to its security flaws.


    To revert back to the use of the tdsams back end we again edit the /etc/samba/smb.conf
    file.


    passdb backend = tdsams


    # Winbind


    The winbind service is part of the Samba suite. It enables a Linux server to become
    a full member in Windows domains and to use Windows users and group accounts in
    Linux. The installation in CentOS 7 is pretty straightforward. We start by installing
    the samba-winbind package.


    ```

    [root@india ~]# yum install samba-winbind

    ```'
