    # ipa stageuser Subcommands


    In the previous section we added a user with the ipa user-add command. This user

    will be able to log in to the domain right after creation. However, many production

    environments require an advanced user management life cycle in which users can
    be in

    different states: staged, active, deleted, and so on.


    The initial state would be the staged user. In this case the user account exists,

    it might not have all of the properties. The user cannot authenticate. We created
    staged

    users with the ipa stageuser-add command.


    ```

    [root@quebec ~]# ipa stageuser-add jose

