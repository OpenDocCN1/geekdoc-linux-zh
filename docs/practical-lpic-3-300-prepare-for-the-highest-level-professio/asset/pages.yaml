    # Adding an Organizational Unit


    Maybe we''d like to have an organizational unit (OU) called users in which to
    store every LDAP user. To do so, we will create a new LDIF file named users.ldif,
    with the following content:


    ```

    dn: ou=users,dc=linuxaholics,dc=com

    objectClass: organizationalUnit

    ou: users

    ```


    We execute ldapadd again to create the OU.


