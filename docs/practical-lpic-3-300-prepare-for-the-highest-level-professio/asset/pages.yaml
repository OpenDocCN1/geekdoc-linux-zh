  md: '# CHAPTER 23


    # Starting with FreeIPA


    According to the official web page of the FreeIPA project:


    FreeIPA is an integrated security information management solution comining Linux
    (Fedora), 389 Directory Server, MIT Kerberos, NTP, DNS, Dogtag (Certificate System).
    It consists of a web interface and command-line administration tools.


    > https://www.freeipa.org/page/About


    The definition mentions Fedora as the Linux part of the solution, but FreeIPA
    works perfectly well with related Linux distributions such as CentOS or RedHat.


    # Structure and Components


    As we said before, FreeIPA integrates many components into a complete identity
    management system. We''ll take a look at each one of these components.


    # 389 Directory Server


    389 Directory Server is an source LDAP server implementation sponsored by Red
    Hat. Similar in many aspects to OpenLDAP, it supports advanced features such as
    multimaster replication, secure connections, and so on. It is however, easier
    to manage. This LDAP directory is the place where the network elements—users,
    groups, computers, and so on—are stored.'
  merge: -1
  pgno: 556
- img_proc: true
  md: '# MIT Kerberos


    MIT Kerberos is the component in charge of authenticating the users. We already
    have studied Kerberos and its free implementation from the Massachusetts Institute
    of Technology in Chapter 4. We studied how the protocol works and how it could
    be installed on CentOS 7. Then, we saw a few practical examples and we''ll study
    a few more later in this chapter.


    # Network Time Protocol


    NTP is a protocol to synchronize the time in a network. As we have already seen
    throughout the book, it is extremely important that every computer in the network
    has the same date and time.


    # DNS


    The DNS service provides a centralized naming system for network devices. This
    protocol has become a key component in most of today’s network infrastructures,
    as it is used to locate network resources. FreeIPA uses Bind as the DNS server.
    A comprehensive study of Bind is beyond the scope of this book, but we''ll see
    some practical examples in the upcoming chapters.


    # DogTag Certificate System


    Throughout the book we have already created a CA by using the command-line utility
    openssl. DogTag implements a CA and supports all the management operations needed
    during a certificate life cycle. FreeIPA uses DogTag together with Kerberos to
    authenticate users.


    # Installing FreeIPA


    Before installing FreeIPA, we need to make sure that the server can resolve its
    hostname. We can achieve this by editing the etc/hosts file.'
  merge: -1
  pgno: 557
- img_proc: true
  md: '```

