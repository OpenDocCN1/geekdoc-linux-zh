    # Summary


    In this chapter we learned how to use our OpenLDAP server to authenticate users
    from different Linux and Unix computers. We studied the basics of PAM and NSS
    and how to configure both client and server to have a centralized authentication
    server. We also practiced some troubleshooting tips that will be very helpful
