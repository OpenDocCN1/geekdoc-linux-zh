  md: '# CHAPTER 8 SAMBA CONCEPTS AND ARCHITECTURE, CONFIGURING SAMBA, AND INTERNATIONALIZATION


    In modern clients, however, the charset is negotiated, so there is no need to
    specify the same charset in both server and client. We can access our Samba server
    from a Windows client and create two files named english.txt and español. txt.
    To do that, first we make the Docs share writable by editing /etc/samba/smb.conf.


    ```

    [Docs]

    comment = Public documents

    path = /shared_docs

    public = yes

    writable = yes

    ```


    In addition we''ll have to give write permissions at the OS level.


    [root@hotel ~]# chmod a+w /shared_docs/


    From now on we can create files with any user connected. We open the Run dialog
    box and enter the address of our Samba server (Figure 8-5). We then enter a valid
    username/password combination (Figure 8-6). We can now create the english. txt
    and español. txt files (Figure 8-7).


