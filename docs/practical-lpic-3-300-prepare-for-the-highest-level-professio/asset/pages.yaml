- img_proc: true
  md: '# CHAPTER 3 LDAP INTEGRATION WITH PAM AND NSS


    We can do many more things to fine tune the way NSS works. If we look again at
    the /etc/nsswitch.conf file, we''ll also see the following lines:


    ```

    passwd:      files

    shadow:      files

    ```


    These two lines determine the way to authenticate the users. By default, every
    Linux system will authenticate any incoming user by querying the /etc/passwd and
    /etc/shadow files to check whether a valid username and password have been provided.


    When we installed sssd in a previous section, the installation process changed
    the /etc/nsswitch.conf file to include the following:


    ```

    passwd:     files sssd ldap

    shadow:     files sssd ldap

    group:     files sssd ldap

    ```


    As we can see, the sssd word was added, so from that point, if a user tries to
    authenticate with its username and password combination is not found in the /etc/passwd
    and /etc/shadow files, the system will query the sssd service.


    In turn, sssd will check different services to decide whether the user is granted
    or denied access. This behavior depends on what is configured in the /etc/sssd/sssd.conf


    ```

    [root@bravo ~]# cat /etc/sssd/sssd.conf

    [domain/default]

    autofs_provider = ldap

    cache_credentials = True

    ldap_search_base = ou=users,dc=linuxaholics,dc=com

    id_provider = ldap

    auth_provider = ldap

    chpass_provider = ldap

    ldap_uri = ldap://alpha.linuxaholics.com/

    ldap_id_use_start_tls = True

    ldap_tls_cacertdir = /etc/openldap/cacacerts

    [sssd]

    config_file_version = 2

    services = nss, pam, autofofs

    ```'
