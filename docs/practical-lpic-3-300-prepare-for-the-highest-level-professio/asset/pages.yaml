    # Summary


    In this chapter we''ve seen how to secure connections to the LDAP server through
    the use of TLS. We also set up the firewall to allow access only to the clients
    that we want to allow connect. We also learned how to control access to different
    branches of the LDAP tree with the olcAccess parameter. We studied different types
    of authentication and introduced SASL proxy authentication. Finally we learned
    how to include an additional layer of security by using client certificates and
    practiced some useful debugging techniques.'
