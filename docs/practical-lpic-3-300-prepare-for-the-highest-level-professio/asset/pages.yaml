    \ as kinit and klist.\n\n```\n[root@romeo ~]# yum -y install krb5-workstation\n\
    \n\n```\n\nThen we need to configure Kerberos in the client. This is done by editing\
    \ the /etc/krb5.conf file. The file should be something like this:\n\n```\n[root@romeo\
