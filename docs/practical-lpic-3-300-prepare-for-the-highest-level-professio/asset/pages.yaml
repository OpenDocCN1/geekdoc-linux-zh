  md: '# NFSv4 ACLs


    One of the features included with NFSv4 is the use of NFSv4 ACLs. To view and
    modify these ACLs we need to install the nfs4-acl-tools package on the client.


    ```

    [root@romeo ~] yum install -y nfs4-acl-tools

    ```


    To better understand NFSv4 ACLs let''s look at some examples:


    ```

    [root@owner ~#] nfsv4-getfacl /mnt/nfs_client/

    A:::OWNER@:rwaDctcy

    A:::GROUP@:rwaDctcy

    A:::EVERYONE@:rDctcy

    ```


    The first character, A, means Allow; that, the actions specified will be allowed,
    and whatever means Allow; that, the actions specified will be allowed, and whatever
    is not explicitly allowed will be denied. We could also use D in the ACL to deny
    certain permissions.


    Next, we have the principal, and in our example there are three different principals:
    OWNER@, GROUP@, and EVERYONE@, that correspond with the owner of the file or folder,
    the group owner belongs to, and the rest of the users.


    Finally, we have the specific permissions allowed or denied by the ACL. These
    can be as follows:


    +   - r: Read data (files) / list directory (directories)

    - w: Write data (files) / create files (directories)

    - a: Append data (files) / create subdirectories (directories)

    - x: Execute (files) / change directory (directories)

    - d: Delete file/directory.

    - D: Remove files or subdirectories from a directory.

    - t: Read attributes from the file/directory.

    - T: Write attributes to the file/directory.

    - n: Read named attributes from the file/directory.

    - N: Write named attributes to the file/directory.

    - c: Read the NFSv4 ACL from the file/directory.'
  merge: -1
  pgno: 707
- img_proc: true
  md: '# CHAPTER 27 NETWORK FILE SYSTEM


    +   - C: Write the NFSv4 ACL to the file/directory.

    - o: Change ownership of the file/directory.

    - y: Allows clients to use synchronous I/O with the server.


    In addition to this long list of permissions, we can also use aliases, which are
    much easier to remember. These generic aliases are R (read), W (write), and X
    (execute). They will be translated to the appropriate set of permissions when
    used in an ACL. We''ll see an example when we edit the NFSv4 ACLs.


    Now that we''ve seen briefly what an NFSv4 ACL looks like, we''ll edit it. First,
    we''ll get the actual ACL.


    ```

    [root@romeo ~]# nfs4_setfac /mnt/nfs_client/file_one.txt

    A::OWNER@:rawtcy

    A::GROUP@rtcy

    A::EVERYONE@:rtcy

    ```


    To edit the NFSv4 ACL we can use the nfs4_setfac command. We specify that we want
    to add (-a) a new ACL entry that will be specified in the command line. The syntax
    of the command can be tricky so we''ll use permissions alias and the ID associated
    with the principal. The ID associated with the principal can be obtained with
    the **getent passwd command**.


    ```

    [root@romeo ~]# get passwd antonio

    antonio*:1494400001:1494400001:Antonio Vazquez:/home/antonio:/bin/sh

    ```


    We can launch the command now.


    ```

    [root@romeo ~]# nfs4_setfac -a A::1494400001:RW /mnt/nfs_client/file_one.txt

    Failed setxattr operation: Operation not permitted

    ```


    We get an error: Operation not permitted. This happens for the way the NFS protocol
    is working. When reading the default ACL, we have seen that the owner is the only
    one who can edit the ACL (C permission). We''ll list the owners of the files in
    the NFS directory.


    ```

    [root@romeo ~]# ls -l /mnt/nfs_client/

    total 12

    -rw-r--r-- 1 root      root       4 feb 25 2019 file_one.txt

    -rw-rw-r-- 1 nfsnbody nfsnbody 4 feb 25 2019 file_two.txt

    ```


