    # Berkeley Database


    We already saw in this chapter that the most used back end with OpenLDAP is

    Berkeley DB. This database stores the actual information and metadata in a series
    of

    files, located by default in /var/lib/ldap.


    ```

    [root@alpha ldap]# ls /var/lib/ldap/

    accesslog cn.bdb __db.002 dn2id.bdb log.000000000 ou.bdb

    alock __db.001 __db.003 id2entry.bdb Object.Class sn.bdb

    ```


    We can see a series of files with the .bdb extension, which are the database files,

    as well as one or more transaction files (log.0000000001). According to the official

    OpenLDAP manual, these files should be periodically backed up for recovery purposes.

    To do we can take one of two approaches:


    +   - Back up the entire database and also back up periodically the

    transaction log files.

    - Generate an LDIF file with slapcat.'
