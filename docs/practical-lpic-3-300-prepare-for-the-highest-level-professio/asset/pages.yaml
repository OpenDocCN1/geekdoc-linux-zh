    # Creating a Samba BDC


    The way to install a Samba BDC doesn''t differ much from the procedure we followed
    when installing a PDC. The users should be able to log in against the BDC, but
    the BDC should not be a master browser, as this function is performed by the PDC
    only. This means that we should set the following options in the /etc/samba/smb.conf
    file:


    ```

    domain master = no

    domain logons = yes

    ```


    We also set the domain name.


    ```

    workgroup = MY_SAMBA_DOMAIN

    ```


    Of course, the BDC will also need to have a [Netlogon] share, as the PDC. We therefore
    define this share in /etc/samba/smb.conf.


    ```

    [netlogon]

    comment = Network Logon Service

    path = /var/lib/samba/netlogon

    guest ok = Yes

    ```


