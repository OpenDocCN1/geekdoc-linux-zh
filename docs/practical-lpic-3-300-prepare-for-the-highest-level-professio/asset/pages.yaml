    (UNED) in Spain, and he currently holds many IT certifications from the main vendors
    in the industry. At present, he works for a public institution and is in charge
    of almost 1,000 Linux servers spread across the country, providing web services,
    FTP services, file services, virtualization, and more. He is also the author of
    Learn CentOS Linux Network Services (Apress, 2016).'
