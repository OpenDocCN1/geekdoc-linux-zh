    # SASL Proxy Authorization


    SASL has a nice feature known as proxy authorization, which allows an authenticated
    user to request that they act on behalf of another user. This is useful in many
    cases. For instance, if a group of users need to have the same access rights to
    a certain resource, we could grant access to a single account and allow every
    user needing these access rights to act on behalf of that account. This can be
    achieved by using SASL proxy authorization.


    Let’s suppose we have defined the user cn=WebApp,ou=apps,dc=linuxhololics,dc=com
    in our LDAP server for the Web application. If we haven''t created it, we can
    do it now.


    ```

    [root@alpha ldap]# cat apps.ldap

    d: ou=apps,dc=linuxhololics,dc=com

    objectClass:organizationalUnit

    u: apps

    [root@alpha ldap]# ldapadd -H ldap://alpha.linuxhololics.com -f apps.ldap

    cn=admin,dc=linuxhololics,dc=com -w pass

    adding new entry "ou=apps,dc=linuxhololics,dc=com"

    ```


    ```

    [root@alpha ldap]# cat WebApp.ldap

    d: cn=WebApp,ou=apps,dc=linuxhololics,dc=com

    cn: WebApp

    sn: User for WebApp

    objectClass: inetOrgPerson

    setPassword: WebApp

    uid: WebApp

    ```


    ```

    [root@alpha ldap]# ldapadd -H ldap://alpha.linuxhololics.com -f WebApp.ldap

    cn=admin,dc=linuxhololics,dc=com -w pass

    adding new entry "cn=WebApp,ou=apps,dc=linuxhololics,dc=com"

    ```


    75'
