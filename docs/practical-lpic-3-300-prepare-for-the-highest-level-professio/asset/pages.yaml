    # Sudo, autofofs, SSH, SELinux, and NIS Integration


    FreeIPA client integrates with many Linux services, which can be centrally managed.

    Most of those services use SSSD so they can use caching and be available offline.


    Sudo is a program present in Linux as with other Unix-like OSs that allows a user
    to

    run programs with the privileges of the root user. The local file /etc/sudoers
    determines

    which users can execute programs as root. As the file is local, it only applies
    to the

    computer on which it is located.


    With FreeIPA we can configure sudo centrally and the configuration will be applied

    to to all the computers in the domain. By default, there are no sudo commands
    defined.


    ```

    [root@quebec ~]# ipa sudocmd-find

    -------

    0 Sudo Commands matched

    -------

    Number of entries returned 0

    ```


    We''ll create a new sudo command, so that normal users can view log files. First,

    check that, right now, standard users are not allowed to view log files like /var/log/

    messages.'
