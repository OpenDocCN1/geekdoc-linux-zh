  md: '# CHAPTER 12


    # Print Services


    Apart from file services, many Windows computers work as print servers in their
    network, offering print services to every client computer in the domain or workgroup.
    In this chapter we''ll cover the following concepts:


    +   - Creating and configuring printer sharing.

    - Configuring integration between Samba and CUPS.

    - Managing Windows print drivers and configuring downloading of print drivers.

    - Configuring [print$].

    - Understanding security concerns with printer sharing.

    - Uploading printer drivers for Point and Print driver installation using the
    Add Print Wizard in Windows.


    We will also learn about the following terms and utilities: smb.conf, [print$],
    CUPS, cupsd.conf, /var/spool/samba/, smbspool, rpcclient, and net.


    # Printing in Linux


    In Linux the de facto printing system is CUPS. CUPS includes several components:
    a scheduler and spooler that receives the print jobs, a series of filters that
    convert the print jobs to a format the printer will understand, and a back end
    that sends the resulting data to the destination printer.


    Every Linux system can have its own cupsd service to manage a series of printers,
    or it can connect to a cupsd service running on a different server. We''ll start
    by installing CUPS locally on our server.


    ```

    [root@]# yum install cups

    ```'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# CHAPTER 12 PRINT SERVICES


    We enable the service and start it.


    ```

    [root@hotel ~]# systemctl enable cups

    [root@hotel ~]# systemctl start cups

    ```


    We also should installomatic, which will provide us with access to a plethora
    of printer drivers.


    ```

    [root@hotel ~]# install fomatic

    ```


    In addition, we could also install the gutenpr package, which contains additional
    drivers.


    ```

    [root@hotel ~]# install gutenpr

    ```


    CUPS allows the use of many tools to create, delete, and manage printers. For
    that purpose, we can use graphical front ends as well as the older system-v or
    BSD console tools used before.


    Let''s suppose we have a network printer with the IP address 192.168.1.141 that
    uses the JetDirect protocol to receive print jobs from clients. We can use lpadmin
    to receive this printer. If we execute it without parameters, we get the following
    info:


    ```

    [root@hotel ~]# lpadmin

    ```


    Usage:


    ```

    lpadmin [-h server] -d destination

    lpadmin [-h server] -x destination

    lpadmin [-h server] -p printer [-c add-class] [-i interface] [-m model]

    [-r remove-class] [-v device] [-D description]

    [-P ppd-file] [-o name=value]

    [-u allow:user,user] [-u deny:user,user]

    ```


    To create a printer, we need the FQDN or address of the print server (in case
    of the printer itself), the local name we''ll assign to the printer queue in CUPS,
    and the driver (the .ppd file).


    Depending on the way the printer is connected to the network, the URL of the printer
    will vary. For example, if the printer is directly attached to the network, we
    could type something like this:


    ```

    [root@hotel ~]# lpadmin -p printer_Canon -v socket://192.168.1.141

    ```'
