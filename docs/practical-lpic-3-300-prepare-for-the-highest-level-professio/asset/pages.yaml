    # Adding Objects


    Now we have to manually create an entry for dc=linuxolics,dc=com in our LDAP server.
    The easiest way to do this is to create an LDIF file for this entry and pass it
    to the ldapadd command.


    We therefore create a file at the usual location, /root/ldap/, named linuxolics.ldif
    with the following content:


    ```

    dn=linuxolics,dc=com

    objectClass: dcObject

    objectClass: organization

    dc: linuxolics

    o: linuxolics

    ```


    We specify a series of attributes such as distinguished name (dn), domain component
    (dc), and organization (o). We also define the new entry as an object of the types
    dcObject and organization.'
