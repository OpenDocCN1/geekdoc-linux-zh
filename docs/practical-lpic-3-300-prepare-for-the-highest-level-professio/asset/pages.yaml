  md: 'When a user authenticates through the use of SASL, the OpenLDAP server will
    receive the following pieces of information from the client:


    +   * Username.

    * Realm (this is optional)

    * SASL mechanism.

    * Authentication information.


    This information will be compacted in a string like this:


    uid=Tux,cn=digest-md5,cn=auth


    Of course, right now we don''t have any DN in our LDAP that matches this DN, so
    we''ll need to convert the given string into something like this:


    uid=Tux,ou=users,dc=linuxholics,dc=com


    Because we already created the ou=users,dc=linuxholics,dc=com branch in our LDAP
    server.


    # Mapping UID Identities


    To map the original string SASL generates into the new one, we''ll have to include
    a string replacement rule. This can be done with the olcAuthzRegex directive.


    We include this directive the usual way, by creating an LDIF file and executing
    ldapadd. However, let''s look at an easy example. Previously, we created a local
    database named Tux. If we use the LDAPwho command, we can see the effective user
    ID to which it maps.


    ```

    [root@alpha ldap]# ldapwhoami -U Tux -w Tux

    SASL/DIGEST-MDS authentication started

    SASL username: Tux

    SASL SSF: 128

    SASL data security layer installed.

    dn:uid=tux,cn=digest-md5,cn=auth

    ```'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'We''ll create the following LDIF file and apply the changes to the server.


    ```

    [root@alpha ldap]# cat mapexample.ldif

    dn: cn=config

    changgetype: modify

    add: olcAuthzRegexp

    colAuthzRegexp: "uid=tux,cn=digest-md5,cn=auth "uid=Tux,ou=users,

    dc=linuxholics,dc=com

    ```


    ```

    [root@alpha ldap]# ldapmodify -Y EXTERNAL -H ldapi:/// -f mapexample.ldif

    SASL/EXTERNAL authentication started

    SASL username: uidNumber=0+uidNumber=0,cn=peercred,cn=external,cn=auth

    SASL SSF: 0

    modifying entry "cn=config"

    ```


    After executing ldapwhoami again, we see that the mapping is working as expected.


    ```

    [root@alpha ldap]# ldapwhoami -U Tux -w Tux

    SASL/DIGEST-MD5 authentication started

    SASL username: Tux

    SASL SSF: 128

    ```


    SASL data security layer installed.

    dn:uid=tux,ou=users,dc=linuxholics,dc=com


    It only works for the user Tux, though. If we solve this problem, we need to create
    a generic rule that maps every local user. We can do it by using regular expressions.
    How to write regular expressions is a subject beyond the scope of this book, and
    there there are already many good books and tutorials available. We''ll just replace
    the mapping here without discussing the many details of the regular expression
    used.


    ```

    [root@bravo ldap]# cat regexexp.ldif

    dn: cn=config

    changeType: modify

    replace: olcAuthzRegexp

    colAuthzRegexp: "uid=([^,]+).*,cn=auth$ "uid=$1,ou=users,dc=linuxholics,

    dc=com

    ```'
  merge: -1
  pgno: 86
