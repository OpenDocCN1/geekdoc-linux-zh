    # Summary


    After the first contact with Samba in the previous chapter, we moved forward into
    more advanced topics. We saw the different services that are part of the Samba
    suite and the ports used to communicate. We also took a look at the characteristics
    and the differences between Samba 3 and Samba 4.


    In addition to editing the configuration file, we also created a share by editing
    the Samba registry. We dug deeper into the configuration file and changed the
    workgroup name as well as the NetBIOS name. We also changed the passdb back to
    ldapsam, making the necessary adjustments in both the LDAP server and the Samba
    server. We configured both secure and unsecured connections.


    We saw how different languages have different code sets associated with them and
    what it implies when working with Samba. Finally, we also learned some troubleshooting
    tips.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# CHAPTER 9


    # Regular Samba Maintenance and Troubleshooting


    We are already familiar with many of the characteristics of a Samba server, and
    we already saw some troubleshooting examples. In this chapter we''ll see more
    troubleshooting tips as well as some maintenance recommendations. We''ll cover
    the following concepts:


    +   - Monitoring and interacting with running Samba daemons.

    - Performing regular backups of Samba configuration and state data.

    - Configuring Samba logging.

    - Backing up TDB files.

    - Restoring TDB files.

    - Identifying TDB file corruption.

    - Editing and listing TDB file content.


    We will also introduce the following terms and utilities: **smbcontrol**, **smstatus**,
    **tdbackup**, **/var/log/samba/**, **log level**, **debuglevel**, **smpassword**,
    **pdbedit**, **secrets**, **tdb**, **tdbackup**, **tdbdump**, **tdbstore**, and
    **tdtool**.


    # Monitoring Samba Services


    The Samba suite provides a series of tools to monitor Samba services. We''ll review
    some of the most used in the following sections.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Smbcontrol


    One of the utilities to monitor Samba is **smbcontrol**. this command will show
    us a summary of its use, and we''ll see a few examples here, too.


    It is quite easy to use. We specify the destination—that is, the service we want
    to monitor—which can be any of the following: smbd, nmbd, or winbindd. Then we
    pass the message type and the optional parameters associated.


    For example, we can check the current level of the **smbd** service like this:


    ```

    root@hotel ~# smbcontrol smbd debuglevel

    PID 12339: all:0 tdb:0 printdrivers:0 lanman:0 smb:0 rpc_parse:0 rpc_srv:0

    rpc_cli:0 passdb:0 sam:0 auth:0 winbind:0 vfs:0 idmap:0 acls:0

    locking:0 msdfs:0 dmapi:0 registry:0 scavenger:0 dns:0 ldb tevent:0

    auth_audit:0 auth_json_audit:0 kerberos:0 drs_repl:0

    ```


    We can also check this log.


    ```

    root@hotel ~# smbcontrol smbd debug 3

    root@hotel ~# smbcontrol smbd debuglevel

    PID 12339: all:3 tdb:3 printdrivers:3 lanman:3 smb:3 rpc_parse:3 rpc_srv:3

    rpc_cli:3 passdb:3 sam:3 auth:3 winbind:3 vfs:3 idmap:3 quota:3 acls:3

    locking:3 msdfs:3 dmapi:3 registry:3 scavenger:3 dns:3 ldb:3 tevent:3

    auth_audit:3 auth_json_audit:3 kerberos:3 drs_repl:3

    ```


    We can simply ping the services.


    ```

    root@hotel ~# smbcontrol smbd ping

    PONG from pid 12339

    root@hotel ~# smbcontrol nmbd ping

    PONG from pid 19469

    root@hotel ~# smbcontrol winbindd ping

    Can''t find pid for destination ''winbindd''

    ```


    In this case we see that the services smbd and nmbd are active, but winbindd is
    not.

    We can also reload the configuration


    ```

    root@hotel ~# smbcontrol reload-config

    ```'
  merge: -1
