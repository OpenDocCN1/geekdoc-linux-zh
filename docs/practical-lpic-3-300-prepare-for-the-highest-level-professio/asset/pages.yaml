- img_proc: true
  md: '# CHAPTER 13


    # # Managing User Accounts\and Groups


    Being able to effectively manage users and groups is a critical skill for every
    Samba admin. In addition, in Samba we need to associate Linux and Samba users
    and groups in the correct manner, so that our infrastructure works as expected.
    In this chapter we''ll cover the following concepts:


    +   - Managing user and group accounts.

    - Understanding user and group mapping.

    - Knowledge of user account management tools.

    - Use of the smbpasswd program.

    - Force ownership of file and directory objects.


    We will also learn about the following terms and utilities: **pdedit**, **smb.conf**,
    **samba-tool user** (with subcommands), **samba-tool group** (with subcommands),
    **smbpasswd**, /etc/passwd, /etc/group, **force user**, **force group**, and **idmap.


    # ## Managing User and Group Accounts


    We have already seen in previous chapters how to use tools to manage user accounts,
    like **smpasswd** or **pdbedit** (see Chapters 7 and 8). We also know that in
    any case, before we create a Samba user, we must already have an equivalent Linux
    user.


    Every Linux system keeps a list of the users in the /etc/passwd file, and a list
    of the local groups in the /etc/group file. When creating new users and groups
    the server admin will use commands `useradd` or `groupadd` to create new users
    and groups, respectively. We''ll now explore the use of **smpasswd** and **pdbedit**.'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# Smbpasswd


    Throughout the book we have already used smbpasswd to create users, but it has
    many other uses. For instance, it can be executed without parameters by normal
    users to change their Samba passwords.


    ```

    [avazquez@hotel ~]$ smbpasswd

    Old SMB password:

    New SMB password:

    Retype new SMB password:

    Password changed for user avazquez

    ```


    The command works by connecting to the SMB service, so we must make sure that
    this one is running; otherwise, the command will fail.


    ```

    [avazquez@hotel ~]$ smbpasswd

    Old SMB password:

    New SMB password:

    Retype new SMB password:

    Unable to connect to SMB server on machine 127.0.0.1. Error was :

    NT_STATUS_CONNECTION_REFUSED.

    ```


    In the preceding examples we launched the command on the Samba server itself,
    but it can also be executed on remote systems by providing the -r parameter. We
    can also specify the remote user whose password we want to change with the -U
    parameter.


    ```

    [avazquez@alpha ~]$ smbpasswd -r 192.168.56.102 -U Antonio

    Old SMB password:

    New SMB password:

    Retype new SMB password:

    Password changed for user Antonio

    ```


    If we don''t include the -U parameter, the program will try to locate a Samba
    user with the same name as the logged on user on the client computer.


    ```

    [avazquez@alpha ~]$ smbpasswd -r 192.168.56.102

    Old SMB password:

    New SMB password:

    Retype new SMB password:

    Password changed for user avazquez

    ```'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# CHAPTER 13 MANAGING USER ACCOUNTS AND GROUPS


    We also executed smbpasswd before, as root, to create a Samba user after having

    created the corresponding Linux user:


    ```

    [root@hotel ~]# smbpasswd -a jdoe

    New SMB password:

    Retype new SMB password:

    Added user jdoe.

    ```


    In addition to creating users, we can also disable them or delete them. For instance,

    if we want to disable the user we will execute smbpasswd with the -d parameter.


    ```

    [root@hotel ~]# smbpasswd -d jdoe

    Disabled user jdoe.

    ```


    After that, if jdoe tries to access any Samba resource he or she will receive
    a disabled

    account message.


    ```

    [avquez@alpha ~]$ smbclient //192.168.56.102/Docs -U jdoe

    WARNING: The "syslog" option is deprecated

    Enterter WORKGROUP\jdoe''s password:

    session setup failed: NT_STATUS_ACCOUNT_DISABLED

    ```


    Of course, we can re-enable the account at any moment with the -e parameter.


    ```

    [root@hotel ~]# smbpasswd -e jdoe

    Enabled user jdoe.

    ```


    If we no longer need to keep a certain user, we can delete it.


    ```

    [root@hotel ~]# smbpasswd -x jdoe

    Deleted user jdoe.

    ```


    # Pdbedit


    Another tool we have already used throughout the book is pdbedit. As opposed to
    what

    happened with smbpasswd, this tool can only be executed by root.


    We have already used it to list the Samba users, but it can be used to retrieve
    much

    more information. For instance, we can list the users showing much more detail
    by

    passing the -v parameter.'
