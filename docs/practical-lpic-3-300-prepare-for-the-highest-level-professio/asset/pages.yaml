    Now the FreeBSD computer is able to use LDAP authentication to work. We can check
    it with the `getent` command.


    ```

    root@~ # get passwd Gecko

    Gecko@*:1500:500:/home/Gecko:/bin/bash

    ```


    We see that Gecko''s shell is /bin/bash. However, in FreeBSD **bash** is in a
    different location, at /usr/local/bin/bash, and it is not installed by default.
    Consequently, Gecko will not be able to log into the system. To solve this problem,
    we need to install the bash shell and create a symbolic link.


    ```

    root@:~ # cd /usr/ports/shells/bash

    root@:/usr/ports/shells/bash # make # ln -s /usr/local/bin/bash /bin/bash

    ```


    .


    In addition to the initial setup, we need to tell PAM to use LDAP. The configuration
    files for PAM are located in the /etc/pam.d folder. We will edit the /etc/pam.d/sshd
    file to include the following line:


    ```

    auth sufficient /usr/local/lib/pam_ldap.so no_warn

    ```


