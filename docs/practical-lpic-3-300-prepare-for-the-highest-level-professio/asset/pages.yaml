  md: '# Logging Access


    Being able to log every access to our OpenLDAP server is very important for auditing
    and troubleshooting purposes. To log accesses to the LDAP server we can use the
    accesslog overlay. We need to it to load the corresponding module. As this is
    the first module we are loading, we need to create a new entry olmoduleList and
    specify the path to the module, in this case /usr/lib64/openldap/accesslog.la.


    The corresponding LDIF file (/root/ldap/module1.ldif) would be this one:


    ```

    dn: cn=module{0},cn=config

    objectClass: olmoduleList

    cn: module{0}

    olmoduleLoad: /usr/lib64/openldap/accesslog.la


    [root@alpha1]# ldapadd -Y EXTERNAL -H ldapi:// -f module1.ldif

    SASL/EXTERNAL authentication started

    SASL username: gidNumber=0+uidNumber=0,cn=peercred,cn=external,cn=auth

    SASL SSF: 0

    adding new entry "cn=module{0},cn=config

    ```


    The accesslog overlay logs all information in another database, so we''ll need
    to create it. First, we prepare the folder where the new database will be placed.


    ```

    [root@alpha1]# mkdir /var/lib/ldap/accesslog

    ```


    We then make the ldap user and group the owners of the new folder.

    [root@alpha1]# chown ldap.ldap /var/lib/ldap/accesslog


    Next, we prepare an LDIF file to create the new database.


    ```

    dn: olcDatabase={3}hdb,cn=config

    objectClass: olcDatabaseConfig

    objectClass: olcHDbConfig

    olcDatabase: {3}hdb

    olcDBDirectory: /var/lib/ldap/accesslog

    olcSuffix: cn=accesslog\olcRootDN: cn=admin,dc=linuxauholics,dc=com

    olcDbIndex: default eq

    ```'
  merge: -1
  pgno: 41
