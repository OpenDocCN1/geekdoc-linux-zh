  md: '# Configuring a Customized Realm


    On the other hand, we might want to use a customized Kerberos realm. If this is
    the case,

    we''ll have to create it with the kdb5_util command:


    ```

    [root@alpha ~]# kdb5_util create -s -r LINUXAHOLICS.COM -d /var/kerberos/

    krb5kdc/linuxholics

    Loading random data

    Initializing database ''/var/kerberos/krb5kdc/linuxholics'' for realm

    ''LINUXAHOLICS.COM'',

    master key name ''K/M@LINUXAHOLICS.COM''

    You will be prompted for the Database Password.

    It is important that you NOT FORGET this password.

    Enter KDC database master key:

    Re-enter KDC database master key to verify:

    ```


    We have to specify the location of the realm database with -d, as well as the
    name of

    the realm with -r.

    We also need to edit the Kerberos configuration files to include the new realm,
    so we

    open /etc/krb5.conf file and add a new realm under EXAMPLE.COM.


    ```

    [realms]

    EXAMPLE.COM = {

    kdc = alpha.linuxholics.com

    admin_server = alpha.linuxholics.com

    }

    LINUXAHOLICS.COM = {

    kdc = alpha.linuxholics.com

    admin_server = alpha.linuxholics.com

    database_name = /var/kerberos/krb5kdc/linuxholics

    }

    ```'
