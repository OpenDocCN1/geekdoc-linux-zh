    # Replication-Based FreeIPA and Active Directory Integration


    Another, but not the preferred, method to integrate FreeIPA and Active Directory
    is to replicate the information between both domains. In Chapter 24 we implemented
    replication among different FreeIPA servers. The process to share data between
    FreeIPA and Active Directory through replication is quite simple in principle.


    To configure Active Directory and FreeIPA synchronization we first need to create
    an Active Directory user that will be used by FreeIPA when connecting to the domain,
    and this user should have the right permissions. As we are working in a lab environment,
    we''ll use the Active Directory admin user to synchronize the information, but
    in a real production environment we should use a different user.


    Download the FreeIPA CA certificate into the Windows server by navigating to the
    URL https://uniform.apress.local/ipa/config/ca.crt (Figure 26-7).'
