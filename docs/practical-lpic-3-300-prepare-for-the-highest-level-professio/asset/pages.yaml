    From now we can use commands like ldapsearch using SASL authentication.


    # Using LDAP as a Back End


    So far, we have used SASL with a local database. As we mentioned before, this
    is not the preferred way to implement SASL, so this time we''ll take a different
    approach.

    As we won''t be using the local database, we need to edit the olcSASlAuxprops
    parameter in our LDAP configuration.


    ```

    [root@alpha sharp]# cat sasl_ldap.ldif

    dn: cn-config

    changetype: modify

    replace: olcSASlAuxprops

    olcSASlAuxprops: slapd

    [root@alpha sharp]# ldapmodify -Y EXTERNAL -H ldapi:/// -f sasl_ldap.ldif

    SASL/EXTERNAL authentication started

    SASL username: gidNumber=0+uidNumber=0,cn=peercred,cn=external,cn=auth

    SASL SSF: 0

    modifying entry "cn-config"

    ```


    When using the LDAP server itself to store the SASL users, we need the users to
    have a UID defined and the password in clear text. We'' create a new user using
    this into consideration.


    ```

    [root@alpha sharp]# cat antonio.ldif

    dn: uid=Antonio,ou=users,dc=linuxaholics,dc=com

    cn: Antonio

    sn: Vaz

    objectClass: inetOrgPerson

    userPassword: antonio

    uid: Antonio

    ```'
