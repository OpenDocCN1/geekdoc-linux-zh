  md: '# CHAPTER 5


    # OpenLDAP Replication


    Authenticating every user against a common central repository such as LDAP has
    many advantages, but it also presents some pitfalls. In this case the LDAP server
    would be a single point of failure, and it could also become a bottleneck in certain
    situations. For that reason, it is advisable for performance, as well as for fault
    tolerance reasons, to have two or more OpenLDAP servers.


    Obviously, the information in every OpenLDAP server must be consistent, so we
    need to configure some replication procedure among them.


    In this chapter we''ll cover the following concepts:


    +   - Replication concepts.

    - Configuring OpenLDAP replication.

    - Understanding replica hubs.

    - LDAP referrals.

    - LDAP sync replication.


    We will also introduce the following terms and utilities: master/slave server,
    multimaster replication, consumer, replica hub, one-shot method, syncrepl, pull-based/push-based
    synchronization, refreshOnly and refreshAndPersist, and replog.


    # Replication Concepts


    So far we have used a single LDAP server. This is an acceptable solution for a
    lab environment, but if we''re working in a production environment, we need some
    degree of fault tolerance, so we''ll have to add (at least) another LDAP server
    to our infrastructure.


    Obviously, the information stored in LDAP will have to be the same in both servers,
    so we need to replicate the changes we make in one server to the other(s).'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# CHAPTER 5 OPENLDAP REPLICATION


    In previous releases of OpenLDAP the terms master and slave were used. The updates
    were made in the master server, which in turn updated the slave servers. This
    model was quite rigid, with the roles perfectly defined. In recent versions, however,
    OpenLDAP supports a great variety of replication topologies and the former terms
    been replaced by provider and consumer. A provider propagates the directory updates
    to one or more consumers. The same server can act as a consumer and a provider
    simultaneously.


    The replication can be done in several ways. There are several replication models
    that can be used with OpenLDAP, and we will see them throughout the book. At present,
    the recommended way to replicate the information between OpenLDAP servers is by
    using the LDAP Sync Replication engine, syncrepl for short.


    Syncrepl is a consumer-side replication engine that enables the consumer/slave
    LDAP server to keep a copy of a Directory Information Tree (DIT) fragment. It
    executes as a thread of the slapd service and maintains the consumer replica by
    connecting to the provider/master to perform the initial load and polling periodically
    to update the content changes.


    Syncrepl uses the LDAP Content Synchronization protocol (LDAP Sync), which supports
    pull-based as well as push-based replication. In pull-based replication the consumer
    polls the provider for updates; on the other hand, in push-based replication the
    provider itself sends the updates to the consumer. LDAP Sync supports these replication
    modes by defining two synchronization operations: refreshOnly and refreshAndPersist.


    When the consumer polls the provider and uses a refreshOnly operation, it uses
    an LDAP Search request and updates its own information with the result of the
    search. When the search operation finishes, the provider sends a SearchResult
    control message.


    On the other hand, when using a refreshAndPersist operation, the consumer also
    starts by sending an LDAP Search request to the provider. In this case, though,
    after returning the result of the search, the operation remains persistent in
    the provider, so that any subsequent updates in the provider are sent to the consumer.


    In addition to these provider-consumer models of replication, we could also have
    multimaster replication in which data are replicated to multiple servers.'
