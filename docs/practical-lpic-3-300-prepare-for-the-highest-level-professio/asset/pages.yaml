  md: '# Samba VFS


    The Samba VFS modules have become a very popular way to extend Samba functionality.
    To use them we need to include the parameter vfs objects in our configuration
    file.


    In the /usr/lib64/samba/vfs directory we will see the VFS modules available.


    ```

    [root@hotel ~]# ls /usr/lib64/samba/vfs/

    acl_tdb.so crossname.so media_harmony.so snapper.so

    acl_xattr.so default_quota.so netatalk.so streams_depot.so

    aio_fork.so dirsort.so offline.so streams_xattr.so

    aio_linux.so expand_msdfs.so preopen.so syncops.so

    aio_pthread.so extd_audit.so readahead.so time_audit.so

    audit.so fake_perms.so readonly.so unyted_media.so

    btrfs.so fileid.so recycle.so worm.so

    cap.so fruit.so shadow_copy2.so xattr_tdb.so

    catia.so full_audit.so shadow_copy.so

    commit.so linux_xfs_sgid.so shell_snap.so

    ```


    Samba VFS extends the functionality of Samba in many useful ways. Some of the
    advantages of using VFS, which we''ll explore in detail, are implementing file
    auditing or storing Windows ACLs. In the official Samba documentation (https://www.samba.org/samba/docs/current/man-html)
    we can see some information about each VFS module and how to use it. We''ll look
    at a couple of examples to better understand how they work.


    # Auditing Samba Operations


    Windows systems allow the sysadmin to audit certain events, such as creating and
    deleting files or folders, modifying permissions, and so on. We can implement
    the same functionality with VFS modules. To enable it we need to add the following
    line in /etc/samba/samba.conf under the [global] section.


    ```

    vfs objects = audit

    ```'
