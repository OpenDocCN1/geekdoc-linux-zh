  md: 'CHAPTER 17 SAMBA 4 AS AN AD COMPATIBLE DOMAIN CONTROLLER


    # Understand the Impact of Virtualization on Active Directory Domain Controllers


    In recent years machine virtualization has become widely popular. Undoubtedly,
    this technology has made administrative tasks such as rollback operations much
    easier through the use of solutions like virtual machine snapshots, which allow
    us to revert a server to a known and working state.


    However, there is also a drawback. Restoring a snapshot could have a negative
    impact in some cases. For example, when using cryptography, computers depend on
    a high level of entropy. Unfortunately, the entropy of the system is drastically
    reduced when restoring an online snapshot. Another service that could be affected
    when restoring a snapshot is the vector-clock synchronization, which could become
    corrupted.


    To mitigate these problems, Microsoft has added a new feature to Windows Server
    2018 and Windows 8 called machine generation ID. This technology basically allows
    the server to realize that a time shift has occurred, so that the server act accordingly.
    To see the full details, take a look at the white paper at http://go.microsoft.com/fwlink/?LinkId=260709.


    # Summary


    In this chapter we provisioned a Samba Active Directory domain with samba-tool.
    This tool automatically sets up all the components we need to have a fully operational
    Active Directory DC. We checked that all the needed services were running and
    we added a workstation to our brand new domain. Later, for redundancy, we added
    an additional DC to our domain. We checked that replication worked fine and learned
    what FSMO roles are and how to manage them in Samba. Finally, we performed a DC
    backup and studied what would be the best course of action to restore an Active
    Directory domain.'
