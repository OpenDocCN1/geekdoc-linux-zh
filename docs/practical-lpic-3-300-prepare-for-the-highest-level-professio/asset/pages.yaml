    # # Opening Ports in the Firewall


    So far we have checked that every needed service is actually working in the server,
    but for the clients to be able to access these services we need to open the corresponding
    ports in the firewall. By default the clients use DNS to locate the DC and the
    available service, so we need to allow incoming connections to UDP port 53 in
    our server.


    ```

    [root@november ~]# firewall-cmd --add-service={dns,ldap,ldaps,kerberos}\success

    ```


    ```

    [root@november ~]# firewall-cmd -permanent --add-service={dns,ldap,ldaps,kerberos}

    ```'
