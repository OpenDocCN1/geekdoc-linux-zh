  md: '# CHAPTER 25


    # FreeIPA Entity Management


    In Chapter 24, we had our first contact with FreeIPA. We even performed the basic
    operations of adding and deleting users. Now we''ll move on to more advanced topics.
    In this chapter we''ll cover the following concepts:


    +   - Managing user accounts and groups.

    - Managing hosts, host groups, and services.

    - Understanding the principle of IPA access control permissions, privileges, and
    roles.

    - Understanding ID views.

    - Awareness of sudo, autofs, SSH, SELinux, and NIS integration as well as host-based
    access control in FreeIPA.

    - Awareness of the FreeIPA CA.


    We will learn about the following terms and utilities: **ipa, ipa-stage***, **ipa-stageuser***,
    **ipa-group***, **ipa-idview***, **ipa host***, and **ipa-advise.**


    # Manage User Accounts and Groups


    There are several ways to manage users in a FreeIPA server. We already saw very
    briefly how to create and delete users from the web interface, but we can also
    create users from the command line with the **ipa** command.'
  merge: -1
  pgno: 606
- img_proc: true
  md: '# The ipa User Subcommands


    During the installation process of the FreeIPA server, numerous administrative
    commands and subcommands are installed well. The command we''re using most of
    the time is ipa. It would be more precise to say that it is a command suite, as
    there are a lot of subcommands associated with it. We can see the list of subcommands
    with ipa help topics.


    ```

    [root@quebec ~]# ipa help topics

