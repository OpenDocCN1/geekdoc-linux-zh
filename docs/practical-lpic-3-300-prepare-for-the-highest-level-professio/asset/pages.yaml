- img_proc: true
  md: '# CHAPTER 12 PRINT SERVICES


    Another problem arises when everybody is given permission to print. If this is
    the case, a malicious user could exhaust the paper or ink supplies of the printer
    by sending a large print job. They could even use the printer to print offensive
    material.


    # Point and Print


    We have seen when a Windows client points to a Samba printer, the system asks
    for the location of the corresponding drivers. The administrator or the user can
    then manually select the driver(s) to install.


    There is, however, a nice feature called Point and Print in Windows 2000 and later.
    This feature allows a user to create a connection to a remote printer without
    downloading disks or other installation media. All the necessary files and information
    are downloaded from the printer automatically. This feature can also be implemented
    in Samba. Detailed instructions are available in the Samba wiki, but we''ll outline
    the main points by seeing an example.


    To properly set up Point and Print we need a domain, which we currently don''t
    have. We''ll assume that we have already installed a Samba 4 Directory domain
    controller (see the full details in Chapter 17).


    Currently our domain controller is not a print server so as we did previously
    on our stand-alone server, we would need to perform a series of actions in advance,
    such as installing CUPS, installing printers, and so on. This was covered in the
    previous section “Printing in Linux.\ Here we only focus on configuring Samba
    printing in our domain controller.


    The first thing to do is to share the printer(s) in Samba. We could either create
    a [printers] share and share all the printers installed on the system or create
    a specific share for a single printer. In this example we''ll use the dummy printer
    we created earlier in the section "Customizing Printer Options.\ This are the
    lines we should add to the configuration file, in this case /usr/local/samba/etc/smb.conf:


    [Text_Printer]


    347'
