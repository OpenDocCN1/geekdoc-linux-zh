    The ipa-adtrust-install command prepares the IPA server to establish trust relationships
    with an Active Directory domain. At the time of writing, these are the only trust
    relationships supported by FreeIPA. To establish a trust relationship with another
    Linux Kerberos realm, we''d need to do it manually. For now, then, we''ll keep
    the new FreeIPA server installed in uniform.address local part and we''ll create
    a trust relationship with the Active Directory DC yankee.ventanas.local we used
    before talking about Samba


    The recommended way to create an Active Directory trust relationship in FreeIPA
    is by executing ipa-trust-add. Before executing it, we need to run ipa-adtrust-install.
    Although both FreeIPA and Active Directory theoretically integrating both should
    be relatively easy, that''s not the case. Microsoft has added extensions to the
    standard protocol. One of them is Microsoft Privilege Attribute Certificates (PAC),
    which we will see in more detail in an upcoming section.


    This command prepares the FreeIPA server by making the necessary changes and installing
    the software needed to support the trust relationship.


    We''ll install the ipa-server-trust-ad package, which contains the ipa trust-add
    command.


    ```

    [root@quebec ~]# yum --disableerepo=* --enablerepo=c7-media provides ipa-adtrust-install

