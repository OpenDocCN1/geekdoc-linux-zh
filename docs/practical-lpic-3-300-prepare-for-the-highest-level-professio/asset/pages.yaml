    smb://192.168.1.129/public/2018feb.txt

    Downloaded 9b in 5 seconds

    ```


    # smbtar


    Another useful utility is **smbtar**, which allows us to download multiple files
    from a Samba share into a single file or tape.


    ```

    [root@alpha ~] smbtar -s 192.168.1.129 -x public -d . -t fichero.out -u

    antonio -p antonio -v

    server is 192.168.1.129

    share is public\

    tar args is

    tape is fichero.out

    blocksize is

    tar:1709 DUMP:t->to_process = 1

    ```'
