  md: '# CHAPTER 21 CIFS INTEGRATION


    If we want to download the 2018jan.txt file we''ll do so with the **get** command.


    ```

    smb: \> get 2018jan.txt

    getting file \2018jan.txt of size 9 as 2018jan.txt (0,3 KiloBytes/sec)

    (average 0,3 KiloBytes/sec)

    smb: \>

    ```


    In a similar way, we can upload files from the Linux client to the Samba share
    with the **put** command, if we have the right permissions, of course. When we''re
    done we exit the session.


    ```

    smb: \> exit

    [root@alpha #]

    ```


    # smbget


    An alternative way to download files from a Samba share is by using the **smbget**
    utility, which is quite similar to **wget**.


    ```

    [root@alpha ~] smbget smb://192.168.1.129/public/2018feb.txt -U antonio

