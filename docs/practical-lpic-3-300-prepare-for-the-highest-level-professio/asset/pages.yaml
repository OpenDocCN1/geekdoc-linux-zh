    # smbtree


    We could also use the smbtree utility, which shows every Samba server present
    in the network and its shares. However, it can be a bit tricky to set up at first.
    The program needs to be able to resolve NetBIOS names, otherwise it won''t show
    any information. As we saw in Chapter 19 when talking about NetBIOS, the way to
    resolve order option in the smb.conf file. As this configuration file is used
    by the server as well as by client processes, it is a good idea to use a new configuration
    file to be used exclusively by the clients. We''ll copy the original /etc/samba/smb.conf
    file and make the new copy smb_client.conf.


    In this smbtree_client.conf file, we will include this:


    name resolve order = lmhosts, bcast


    This way, when we execute smbtree, it will try to use the lmhosts file to resolve
    the names, so we need to create and edit that lmhosts file.'
