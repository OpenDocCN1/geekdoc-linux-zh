    | 16885 Antonio Antonio | 192.168.56.101 (ipv4:192.168.56.101:34887) |


    Instead of the username map option, we could have used the similar username script
    option, which points to the full path to a program or script that receives the
    invoking username as the input value and returns the Linux user it should be mapped
    to.


    Another parameter related to user and group mappings is idmap. It is the mapping
    between Windows IDs and Linux user and group IDs. In Chapter 8 we use this parameter
    when configuring the ldapsam back end. We included these two lines:


    ```

    idmap backend = ldap:ldap://alpha.linuxaholics.com

    idmap uid = 5000-50000

    idmap gid = 5000-50000

    ```


    These three lines mean that the range 5000-50000 will be reserved for the mapping
    of the UIDs and GIDs. The back end in this case will be an LDAP server, but could
    also be a TDB file, an Active Directory server, and so on. This syntax, however,
    is now deprecated and the following should be:


    ```

    idmap config * : backend = idmap:ldap://alpha.linuxaholics.com

    idmap config * : range = 5000-50000

    ```'
