    # Summary


    In this chapter we briefly reviewed the use of local user authentication, as well
    as the possibility of synchronizing Samba and Linux passwords. We also studied
    the different passdb back ends that Samba can use. In addition, we saw an interesting
    method to integrate Linux computers in a Windows network, the use of Winbind.
    This service, part of the Samba suite, allows us to use Active Directory users
    on our Linux servers.'
