    As we can see, the information in the consumer is now the same as in the provider.
    If the replication is not working, we should take a look at the journal in the
    consumer server. We''ll see more details in the “Troubleshooting” section later
    in this chapter.


    Note In older versions of OpenLDAP another replication technology was used, the
    slurpd service. This was a stand-alone service running along with slapd in the
    master server. The way it worked was quite simple: The slapd maintained a replication
    log, or repl for short, which it kept track of all the updates performed in the
    master server. Slurpd analyzed the log file and pushed all the updates to the
    slave(s) server(s). Slurpd could monitor the repl file regularly to search for
    and replicate the updates as soon as possible, but it could scan the repl file
    just once and remain silent until explicitly instructed to do it again. This was
    called a one-shot mode. This replication technology was soon deprecated in favor
    of syncrepli because it was too rigid and prone to errors. In fact, in the most
    recent OpenLDAP versions it has been completely removed.'
