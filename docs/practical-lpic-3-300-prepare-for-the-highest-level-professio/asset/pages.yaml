  md: '# CHAPTER 12 PRINT SERVICES


    We check now that there are no shared printers and we add the following share
    to smb.conf.


    ```

    [Samba_Printer]

    comment = Public printer

    path = /var/spool/samba

    guest ok = Yes

    printable = Yes

    printer name = printer_Canon

    ```


    After restarting the service, we''ll see that the printer can be accessed through
    the network.


    The tdb back end we are currently storing the printer-related information in the
    /var/lib/samba/printing/ folder, as well as in the /var/lib/samba/printer_list.tdb
    file. In the /var/lib/samba/printing/ folder we see a tdb file for every printer
    defined in Samba.


    ```

    [root@hotel ~]# ls -l /var/lib/samba/printing/

    total 84

    -rw-------. 1 root Antonio 28672 ago 16 05:24 printer_Canon.tdb

    -rw-------. 1 root root 28672 ago 13 19:40 printers.tdb

    -rw-------. 1 root Antonio 28672 ago 16 06:15 Samba_Printer.tdb

    ```


    The ntprinters.tdb and ntdrivers.tdb files used in previous versions of Samba
    are no longer used.


    # smb.conf Printing-Related Options


    Once we have our printer installed, there are a lot of parameters with values
    we can tweak in smb.conf to better suit our needs.


    # CUPS-Related Options


    We have seen the printing = CUPS, and the load printers = yes options that were
    used with their default values, meaning that Samba would use CUPS and would load
    the printers defined in the printcap file.'
  merge: -1
