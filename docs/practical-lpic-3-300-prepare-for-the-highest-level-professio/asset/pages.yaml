  md: '# Integrating Samba and CUPS


    By default, Samba allows us to share printers with any Samba client. For that
    purpose, there is a share named [printers] defined in /etc/samba/smb.conf.


    [printers]


    ```

    comment = All Printers

    path = /var/spool/samba

    browseable = no

    guest ok = no

    writable = no

    printable = yes

    ```


    The option printer = yes means that the clients can open and send files to the
    spool directory specified in path.


    Samba can integrate with different printing systems like LPD, which were widely
    used in Linux before CUPS gradually replaced them. We can determine which printing
    system to use with the parameter. So in /etc/samba/smb.conf we should add this
    line:


    printing = cups


    However, this is the default value used if not otherwise specified, so we really
    don''t need to include here. We can check this by using the testparm command with
    the -v flag, so that it displays the default values in use.


    ```

    [root@openldap]# testparm -sv | grep printing

    Load smb config files from /etc/samba/smb.conf

    rlimit_max: increasing rlimit_max (1024) to minimum Windows limit (16384)

    Processing section "[homes]"

    Processing section "[printers]"

    Processing section "[Docs]"

    Loaded services file OK.

    Server role: ROLE_STANDALONE

    printing = cups

    ```'
  merge: -1
  pgno: 349
- img_proc: true
  md: 'Depending on the value of the parameter load printers, the printers defined
    in CUPS may be shared automatically in Samba. We check the value.


    ```

    [root@openldap ~]# testparm -sv | grep "load printers"

    ```


    .


    ```

    load printers = Yes

    ```


    In this case commenting out the printers are shared automatically and every Windows
    client will have access to them (Figure 12-24).


    ![](img/dfa44432604022575079471b648e25ca_350_0.png)


    Figure 12-24. A Samba printer


    Apart from sharing all the printers installed on the server, we can also share
    individual printers by specifying their names in smb.conf.


    We''ll begin by commenting out the [printers] share, and we''ll restart the service
    to make sure that the printers are no longer shared. If we prefer, we can use
    smbcontrol to reload only the printers'' definitions.


    ```

    [root@hotel ~]# smbcontrol smbd reload-printers

    ```'
