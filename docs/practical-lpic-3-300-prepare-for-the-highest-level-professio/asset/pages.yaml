  md: 'CHAPTER 21 CIFS INTEGRATION


    # mount


    It is also possible to mount ~if Samba shared folder locally with **mount** or
    **mount.cifs**.


    ```

    [root@alpha ~# mount -t cifs -o username=antonio,password=antonio

    //192.168.1.129/public /mnt/public_docs/

    [root@alpha ~# mount.cifs -o username=antonio,password=antonio

    //192.168.1.129/public /mnt/public_docs/

    ```


    For the system to automatically mount the Samba/CIFS shares, we should add this
    line to the /etc/fstab file:


    ```

    //192.168.1.129/public /mnt/public_docs/ cifs username=antonio,password=

    antonio 0 0

    ```


    # Securely Storing CIFS Credentials


    We''ve seen that when mounting SMB/CIFS shares we can specify the username and
    the password as parameters of the **mount command**. However, it is more advisable
    to keep this information stored in a file instead of passing them in plain text
    as command parameters. We could create a file like this:


    ```

    [root@alpha ~# cat credentials.txt

    username=antonio

    ```


    Then we could use the --credentials parameter when executing the **mount command**.


    ```

    [root@alpha ~# mount -t cifs -o credentials=/root/credentials.txt

    //192.168.1.129/public /mnt/public_docs/

    ```


    Thus the line we included in /etc/fstab in the previous section could be replaced
    by this one:


    ```

    //192.168.1.129/public /mnt/public_docs/ cifs credentials=/root/

    credentials.txt 0 0

    ```


    This way the username and password are no longer visible in plain text. Obviously,
    we should also give the appropriate permissions to the credentials.txt file, making
    sure that it is not world readable.


    530'
  merge: -1
  pgno: 534
