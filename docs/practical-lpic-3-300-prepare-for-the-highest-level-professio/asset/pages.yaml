  md: '# CHAPTER 6 OPENLDAP SERVER PERFORMANCE TUNING


    objectClass: olcHHdbConfig

    olcDatabase: {2}hdb

    olcDirectory: /var/lib/ldap

    olcDbIndex: objectClass eq,pres

    olcDbIndex: ou,cn,mail,surname,givenname eq,pres,sub

    olcDbIndex: entryUUID eq

    olcDbIndex: entryCSN eq

    structuralObjectClass: olcHHdbConfig

    entryUUID: 4231623a-8e3f-1036-8413-f3757e79c279

    creatorsName: cn=config

    createTimestamp: 20170223181136Z

    olcSuffix: dc=linuxaholics,dc=com


    When performing a search in the database, if there are no usable indexes we need
    to scan for the entire database. This can be very time consuming for a large database.


    The use of indexes greatly improves the performance of the search. The drawback
    is that in order to do it, it needs additional storage and write operations to
    keep the index structure. To illustrate this point, we will edit the Python program
    we have gone so far to change the defined filter for a new one that uses an attribute
    that is not indexed. The userPassword attribute is not indexed, so it is a perfect
    candidate for the test.


    We''ll change the following line in the LDAPClient.py program:


    ```

    filter = "(objectClass=inetOrgPerson)"

    ```


    For this one:


    ```

    filter = "(userPassword=337850)"

    ```


    In this example, we used the value 337850 for the userPassword attribute, because
    this value is associated with a single user. That value was assigned when creating
    the LDIF file and it will be different every time we create an LDIF file with
    the genLDAPusers program. The reader should therefore use a value that is assigned
    to one of the users they generated with genLDAPusers.py.'
