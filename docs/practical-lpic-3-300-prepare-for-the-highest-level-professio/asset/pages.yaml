  md: '# CHAPTER 21


    # CIFS Integration


    Throughout the book this far, we have seen briefly a few examples of CIFS integration
    in mixed environments. Here we''ll go into more depth on its concepts and use.
    In chapter we''ll cover the following concepts:


    +   - Understanding SMB/CIFS concepts.

    - Accessing and mounting remote CIFS shares from a Linux client.

    - Securely storing CIFS credentials.

    - Understanding features and file ownership of remote CIFS shares.


    We will also learn about the following terms and utilities: SMB/CIFS, mount, mount.cifs,
    smbclient, smbeet, smbtar, smbtree, findsmb, smb.conf, smbcquotas, and /etc/fstab.


    # SMB/CIFS


    SMB, also known sometimes as CIFS, is the protocol in charge of providing shared
    access to files and printers on Windows networks. To make things simpler we use
    both terms interchangeably. This service can run directly over TCP port 445, but
    it can also use the NetBIOS API.


    # Accessing and Mounting Windows Shares from Linux


    To access shares from a Linux computer we can use many utilities. In previous
    chapters we have already used smbclient, but there are many other options available.'
  merge: -1
  pgno: 529
- img_proc: true
