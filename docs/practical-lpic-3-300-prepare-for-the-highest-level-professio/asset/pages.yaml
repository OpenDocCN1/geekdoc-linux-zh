  md: '# Summary


    In this chapter we have seen a brief description of FreeIPA, a comprehensive identity
    management solution. Despite the fact that we need to install and integrate many
    different software components for FreeIPA to work correctly, the installation
    and configuration are very easy. After completing the setup, we got familiar with
    the web management console and added and deleted our first user.'
  merge: -1
  pgno: 578
- img_proc: true
  md: '# CHAPTER 24


    # # FreeIPA Replication:

    Adding Clients to the Domain


    In the previous chapter we had our first contact with FreeIPA. We even performed
    the basic operations of adding and deleting users. In this chapter we''ll add
    an additional server to work as a replica, and we''ll add different computer clients
    to the domain. We''ll cover the following concepts:


    +   - Understanding replication topology and configuring FreeIPA replication.

    - Joining clients to an existing FreeIPA domain.

    - Awareness of ipa-backup.


    We will also learn about the following terms and utilities: **ipa-server-install**,
    **replica-install**, **ipa-client-install**, and **ipactl**.


    # FreeIPA Replicas


    At the moment, we have a single FreeIPA server, quebec.linuxaholics.local, the
    one we installed in the previous chapter. In a production environment it would
    be mandatory to have at least one additional server, so that if one of the servers
    crashes, clients are still able to log in.


    A replica server is essentially a copy of another server. When we studied OpenLDAP
    we saw how to replicate parts of the LDAP tree to another server. Fortunately,
    the process to replicate information in FreeIPA is much easier.'
  merge: -1
  pgno: 579
- img_proc: true
  md: '# Installing a FreeIPA Replica


    As we were on the original server, we start by installing the ipa-server package
    on the future replica server.


    ```

    [root@sierra ~]# yum -y install ipa-server

    ```


    After installing the software, we make sure that we can successfully add the names
    of the original and the replica servers. We edit the /etc/hosts file of the replica
    server accordingly.


    ```

    [root@sierra ~]# cat /etc/hosts

    127.0.0.1 localhost.localdomain localhost4 localhost4.

    localomain4

    ::1 localhost.localdomain localhost6 localhost6.

    localomain6

    192.168.1.243 quebec.linuxaholics.local

    192.168.1.245 sierra.linuxaholics.local

    ```


    In addition, we need to keep time and date synchronized between the two servers
    and we need to change the DNS settings so that the server points to the FreeIPA
    server. To do that, we''ll stop the NetworkManager service and edit /etc/resolv.conf
    so that the FreeIPA server is queried first.


    ```

    [root@sierra ~]# systemctl stop NetworkManager

    [root@sierra ~]# cat /etc/resolv.conf

    nameserver 192.168.1.243

    nameserver 192.168.1.245

    ```


    We check that DNS resolution is working by dig to query the name of the FreeIPA
    server.


    ```

    [root@sierra ~]# dig +noall +answer quebec.linuxaholics.local

    quebec.linuxaholics.local. 1200 IN A 192.168.1.243

    ```


    We make sure that the firewall allows the incoming connections needed for the
    IPA server to work, like we did previously in the original server.'
  merge: -1
