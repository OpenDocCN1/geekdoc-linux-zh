  md: '# Deleting Objects


    Apart from adding or editing, we can also delete objects from the LDAP server.
    The procedure is even easier, as we don''t need to create any LDIF file. We just
    execute Ldap with the cn we want to delete. Let''s suppose we had previously added
    the user John Doe.


    ```

    dn: cn=john,ou=users,dc=linuxholics,dc=com

    cn: John

    s: Doe

    objectClass: inetOrgPerson

    userPassword: nobody

    uid: john

