    # DNS and Kerberos


    When using the EXAMPLE.COM realm in our previous configuration, we decided to
    manually configure the address of the KDC and admin servers. However, in more
    extensive deployments it is more convenient to use DNS instead.


    To use DNS to discover Kerberos services, DNS must support the use of SRV record
    types, as specified in RFC-2782. This could be a sample SRV record:


    ```

    _kerberos.udp.LINUXAHOLICS.COM. IN SRV 10 0 88

    alpha.linuxaholics.com.

    ```


    The format of an SRV record is as follows:


    +   * The name of the service preceded by an underscore sign.

    * The protocol (TCP or UDP) preceded by an underscore sign.

    * The realm followed by a trailing dot.

    * The record class, which is always IN.

    * The record type, in this case SRV.

    * The priority; the lower this value is, the more priority the server will be
    given.

    * The weight; this value is used for load balancing when the priority is equal.

    * The port number on which the server listens.

    * The fully qualified domain name (FQDN) of the host.'
  merge: -1
