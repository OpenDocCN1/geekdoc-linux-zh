  md: '# CHAPTER 8 SAMBA CONCEPTS AND ARCHITECTURE, CONFIGURING SAMBA, AND INTERNATIONALIZATION


    The global section defines a series of parameters that apply to the server as
    a whole. Usually we can see a description of the parameter as well as its current
    value. For example:


    ```

    #================== Global Settings ==================

    [global]


    # ----- Network-Related Options -----

    #

    # workgroup = the Windows NT domain name or workgroup name, for example,

    MYGROUP.

    #

    # server string = the equivalent of the Windows NT Description field.

    #

    .

    .

    .


    workgroup = MYGROUP

    server string = Samba Server Version %v

    .

    .


    ```


    After the global section we can see the shares section, in which are defined a
    series of shared resources such as home directories, printers, or folders.


    # Samba Variables and Configuration Parameters


    We will now look at some of the most important variables and parameters we''ll
    find in / etc/samba/smb.conf. For instance, at this point we have the following
    parameters:


    ```

    workgroup = MYGROUP

    server string = Samba Server Version %v

    netbios name = MYSERVER

    ```'
