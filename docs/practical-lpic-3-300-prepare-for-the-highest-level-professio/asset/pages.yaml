    # Logging to rsyslog


    By default, slapd sends information to the local4 facility. In a fresh CentOS
    7 installation rsyslog doesn''t log information sent to the local4 facility to
    any file, so we''ll have to add this line to the /etc/rsyslog.config file:


    ```

    # Log OpenLDAP messages

    local4.* /var/log/ldap.log

    ```


    We restart the rsyslog and slapd service and check that the new log file has been
    updated with information.


    ```

    [root@alpha ~]# systemctl restart rsyslog

    [root@alpha ~]# systemctl restart slapd

    ```'
