    The information will be stored in the file passdb.tdb, located in /var/lib/samba/private.
    In this same location we can also find the secrets file, which stores internal
    settings such as the machine and domain SID, passwords used with LDAP, and so
    on.

    If at any time we want to list existing users, we do it by passing the -L parameter
    to pdbbit.


    ```

    [root@hotel ~]# pddbit -L

    Antonio:1001:

    avazquez:1000:Antonio Vazquez

    ```


    When the number of users is not very high, this is acceptable, but if we have
    hundreds of users we should use an LDAP server to store the users, and use the
    ldapsam back end instead of tdbs. This is clearly not the case, as we only have
    a couple of users, but for didactic purposes we''re going to use LDAP anyway.
    For all of us, we make sure that the Samba server can communicate with the LDAP
    server.


    ```

    [root@hotel ~]# ldapsearch -H ldap://alpha.linuxholics.com -x -D cn=admin,dc=linuxholics,dc=com
    -w pass -b "ou=users,dc=linuxholics,dc=com"

    # extended LIFID

    #n# LDAPv3

    # base <ou=users,dc=linuxholics,dc=com> with scope subtree

    # filter: (objectClass=*)

    # requesting: ALL

    #

    ```'
