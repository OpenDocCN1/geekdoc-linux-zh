    SASL SSF: 0

    modifying entry "olcDatabase={2}hdb,cn=config"

    ```


    After including the index definition in the server, we will execute slapindex.
    This is the command that actually creates the index. Before executing it, we need
    to stop the slapd service.


    ```

    [root@alpha ~]# systemctl stop slapd

    ```


    The OpenLDAP database is in the default location /var/lib/ldap, we can launch
    the command without any parameters; otherwise we should specify the location of
    the database folder with -F. We can use the b parameter and specify a suffix to
    determine the database for which we want to create the index.'
