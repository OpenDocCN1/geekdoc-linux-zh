    # SASL


    In fact, the SASL method is a framework that allows the use of several authentication
    mechanisms: GSSAPI for Kerberos, PLAIN, EXTERNAL, and so on.


    In previous sections we have already used SASL with the EXTERNAL authentication
    mechanism. This is an example:


    ```

    [root@alpha ldap]# ldapsearch -Y EXTERNAL -H ldapi:/// -b cn=config

    lolcDatabase=\*

    ```


    SASL/EXTERNAL authentication started

    SASL username: gidNumber=0+uidNumber=0,cn=peercred,cn=external,cn=auth

    SASL SSF: 0


    .


    We launched ldapsearch, without the -x flag, so that SASL instead of simple bind
    is used. Next, we specify the SASL mechanism to use (EXTERNAL in this case). The
    EXTERNAL mechanism uses authentication services offered by lower network services.
    When used with the ldapi:/// transport it can report the User Identifier (UID)
    and Group Identifier (GID) of the client process.


    61'
