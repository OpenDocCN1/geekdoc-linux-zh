  md: '# saslauthd


    SASL can use different mechanisms to authenticate a user, the default being DIGEST-MD5.
    We''ll check the currently supported mechanisms, and if DIGEST-MD5 isn''t supported
    we''ll install the necessary packages.


    ```

    [root@alpha ~]# ldapsearch -x -H ldapi:/// -b " "" -s base -LLL

