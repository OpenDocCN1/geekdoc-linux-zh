- img_proc: true
  md: '# CHAPTER 27 NETWORK FILE SYSTEM


    Now we can edit the ACL associated with file_one.txt.


    ```

    root@romeo ~]# nfs4_setfacl -a A::1494400001:RW /mnt/nfs_client/file_one.txt

    root@romeo ~]# nfs4_getfacacl /mnt/nfs_client/file_one.txt

    A::OWNER@rwatCcY

    A::1494400001:rwatcy

    A::GROUP@rtcty

    A::EVERYONE@rtcty

    ```


    To see how versatile ACLs can be, we''ll add a new one to deny write access to
    the user jose. First, we''ll get the associated ID with getent passwd.


    ```

    root@romeo ~]# getent passwd jose

    jose*:1494400003:1494400003:Jose Vazquez:/home/jose://bin/sh

    ```


    We add the new ACL denying write access to jose.


    ```

    root@romeo ~]# nfs4_setfacl -d A::1494400003:w /mnt/nfs_client/file_one.txt

    ```


    If we connect to the client computer as antonio and try to write to file_one.txt,
    we should not have any problems.


    ```

    -sh-4.2$ whoami

    antonio

    -sh-4.2$ echo "Added to Antonio" >> /mnt/nfs_client/file_one.txt

    -sh-4.2$ cat /mnt/nfs_client/file_one.txt

    ```


    123

    Added by Antonio


    However, if jose tries to write, he won''t be allowed to do it.


    ```

    -sh-4.2$ whoami

    jose

    -sh-4.2$ echo "Added by Jose" >> /mnt/nfs_client/file_one.txt

    -sh: /mnt/nfs_client/file_one.txt: Permission denied

    ```


    So far, we have been editing NFSV4 ACLs with the nfs4_setfacl command, but we
    could also use nfs4_editfacl. This utility works by showing us our associated
    text editor, usually visually, with the content of the NFSV4 ACL.


    ```

    root@romeo ~]# nfs4_editfacl /mnt/nfs_client/file_one.txt

    ```


