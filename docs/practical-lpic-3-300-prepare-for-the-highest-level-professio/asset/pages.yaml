    +   * PORT: This specifies the port to which to connect.

    * TLS_CACERTDIR: This is the path that contains the certificates.

    * TLS_REQCERT: This option specifies how to deal with certificates depending on
    the value assigned:


    +   * never: The Client will never request a server certificate.

    * allow: The Client requests a server certificate, but if no valid certificate
    is presented, the session proceeds normally.

    * try: The Client requests a certificate. If a bad certificate is presented, the
    session is terminated immediately.

    * demand|hard: These options are equivalent to try. This is the default setting.


