    # Copy the Samba Configuration


    The Samba configuration is defined in the /etc/samba/smb.conf file. This file
    is pretty long and can be difficult to read due to the many comments. To get a
    cleaner and more concise version of the file content, we can use sed.


    ```

    [root@hotel ~]# sed ^#/d /etc/samba/smb.conf | sed ^\;/d | sed ^$/d \

    sed \W*#d

    [global]

    workgroup = MY_SAMBA_GROUP

    server string = My Samba Server %v

    netbios name = HOTEL

    security = user

    passdb backend = tdams

    printing = cups

    printcap name = cups

    load printers = yes

    cups options = raw

    [homes]

    comment = Home Directories

    valid users = %S, %D%w%S

    browseable = No

    read only = No

    inherit acls = Yes

    [printers]

    comment = All Printers

    path = /var/tmp

    printable = Yes

    create mask = 0600

    browseable = No

    ```'
