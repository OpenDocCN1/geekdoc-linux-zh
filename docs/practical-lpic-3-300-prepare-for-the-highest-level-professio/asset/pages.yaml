- img_proc: true
  md: '# Windows Printer Drivers


    We''ve seen how easy is to share a printer through Samba. We can access the server
    through a Windows workstation and simply click on the shared printer. If we haven''t
    previously installed the required driver, though, we''ll get an error message
    (Figure 12-25).


    ![](img/dfa44432604022575079471b648e25ca_354_0.png)


    Figure 12-25. Driver not found


    What happens when we connect from a Windows client to a shared Windows printer
    is that the client will try and download the needed drivers to install the new
    printer. We can mimic this same behavior in our Samba server with a few configuration
    changes.


    According to the Samba Wiki (http://wiki.samba.org), Samba only supports the printer
    driver model version 3 supported in different Windows versions including Windows
    2016. Version 4 drivers, however, are not fully supported. In addition, the driver
    should be uncompressed to be downloaded from the clients.


    # Configure [print$]


    Windows clients download the print drivers automatically from a shared name print$.
    This behavior is hard-coded in every Windows box and it cannot be changed. Some
    of the more recent Samba versions have this share already defined by default,
    but if we don''t have it, we''ll need to create it manually on our Samba server.'
  merge: -1
  pgno: 354
- img_proc: true
  md: 'In the smb.conf file we''ll have to include the new share definition.


    .


    .


    [print$]


    ```

    comment = Printer Drivers

    create mask = 0664

    directory mask = 0775

    force group = @printadmin

    path = /var/lib/samba/drivers

    write list = @printadmin root

    ```


    .


    .


    Of course, we''ll have to create the directory share points to it if it doesn''t
    exist, we''ll check that it has the share permissions.


    ```

    [root@hotel ~]# ls -ldZ /var/lib/samba/drivers/

    drwx-wtxr-x. 1 root printadmin system_u:object_r:samba_var_t:s0 /var/lib/

    samba/drivers/

    ```


    Inside the path of the [print$] share we need to create a series of subfolders.


    ```

    [root@india # ls /var/lib/samba/drivers/

    IA64 W32ALPHA W32MIPS W32PPC W32X86 WIN40 x64

    ```


    We copy the drivers for each OS in the corresponding folder. The driver should
    be uncompressed to be downloaded by the clients.


    We''ll see a bit more detail about the [print$] share later, when we learn about
    Point and Print.


    # Printer Sharing Security


    As any device attached to a network, an incorrectly configured print server can
    also pose a security risk. Any user who has administrative rights on the print
    server could redirect print jobs to any destination, which could be a serious
    security breach.'
