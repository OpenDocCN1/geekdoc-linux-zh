    # Configuring Roaming Profiles


    Users can customize their settings according to their preferences. All customizations
    are stored in a series of files that are globally called the Windows profile.
    Usually when a user logs in from a workstation, the profile is stored locally
    in that same workstation. Any customizations made by the user will be saved in
    the profile so that they are available the next time the user logs in. However,
    if the user logs in from a different workstation, a new profile will be generated.
    Of course, new profile won''t have the customizations previously made by the user.


    For users to have the same profile no matter which workstation they are logging
    in from, we can use roaming profiles. In this case the users'' profiles are stored
    in a central repository instead of the local workstation.'
