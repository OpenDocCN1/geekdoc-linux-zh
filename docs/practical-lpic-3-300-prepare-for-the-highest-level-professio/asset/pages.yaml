  md: 'CHAPTER 8 SAMBA CONCEPTS AND ARCHITECTURE, CONFIGURING SAMBA, AND INTERNATIONALIZATION


    # # Character Codes and Code Pages


    As we know, computers communicate using numbers—0s and 1s—as opposed to humans,
    who prefer to communicate using languages. When we type some in a text file, then
    that is translated into a series of numbers. The relation between any given number
    (or code) and the corresponding character is what we call character code. When
    grouping a series of characters and their associated character codes we get a
    code page. Probably the best known code page is American Standard Code for Information
    Interchange (ASCII). Some时候 codes are called character sets or charsets for short.


    Until now the de facto standard charset for computers has been ASCII. That is
    perfect for the English language, but it lacks support for other characters in
    other languages. For that reason, several additional charsets were created to
    fully support languages like Spanish, French, German, and so on.


    At any moment you can check the charset by Samba with the testparam


    ```

    [root@hotel ~]# grep testparam -vs | grep charset

    Load smb config files from /etc/samba/smb.conf

    rlimit_max: increasing rlimit_max (1024) to minimum Windows limit (16384)

    Processing section "[printers"

    Processing section "[print$"

    Processing section "[Docs]"

    Loaded services file OK.

    Server role: ROLE_STANDALONE

    ```


    ```

    dos charset = CP850

    unix charset = UTF-8

    ```


    As we can see, there are two parameters associated with charset:


    +   - dos charset: This is the charset Samba uses when talking to DOS clients.
    If the configured value is not available, Samba will fall back to ASCII.


    +   - unix charset: This is the charset used by the operating system. In modern
    versions this is usually UTF-8, which covers all characters in all languages.'
  merge: -1
  pgno: 250
