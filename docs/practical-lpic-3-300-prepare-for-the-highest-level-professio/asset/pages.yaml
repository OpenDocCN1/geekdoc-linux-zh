    # Provisioning a Samba Active Directory


    Provisioning consists of setting up all the infrastructure needed for a Samba
    Active Directory domain to run as LDAP, Kerberos, and DNS servers. The easiest
    way to do it is using the samba-tool command, which will now be located under
    /usr/local/samba/bin/. With the **domain provision** subcommand we can provide
    the domain. There are many parameters available, and their descriptions can be
    viewed with --help. In this case we will use the --use-rfc2307 and --interactive
    parameters only. Only with the first one we make sure that POSIX attributes are
    stored in Active Directory, whereas the second one will ask the user for the necessary
    data to provision the domain, such as the domain name, the administrator password,
    and so on.


    Throughout this chapter we will work with one Active Directory domain with a shared
    administration. For instance, we could have a linuxholics.com domain, a canada.linuxholics.com
    domain, and a us.linuxholics.com domain. In the three domains are part of the
    forest and share a common administration.


    The queries are self-explanatory, the tricky one could be the administrator password,
    which requires compliance with some complex rules. In our exercise, we will use
    the password Password, because if we choose an easier password we might get an
    error when provisioning the domain.'
