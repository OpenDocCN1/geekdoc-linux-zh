    # Host-Based Access Control


    FreeIPA can grant or deny access to any user to any host. This is called Host-Based
    Access Control (HBAC). By default, there is an HBAC defined that allows every
    user to access any host.


    ```

    [root@quebec ~]# ipa hbacrule-find

    ```


    1 HBAC rule matched


    Rule name: allow_all

    User category: all

    Host category: all

    Service category: all

    Description: Allow all users to access any host from any host

    Enabled: TRUE


    Number of entries returned 1


    If we want to restrict access based on HBACs, however, we can create our own customized
    HBAC.


