  md: '# CHAPTER 8 SAMBA CONCEPTS AND ARCHITECTURE, CONFIGURING SAMBA, AND INTERNATIONALIZATION


    If we examine each file with the file command, we''ll see that the server certificate
    file is not in PEM format.


    ```

    [root@hotel tls]# file *

    ca.cert.pem: PEM certificate

    hotel.linuxaholics.com.crt: ASCII text

    hotel.linuxaholics.com.key: PEM RSA private key

    ```


    However, if we open the certificate file with a simple text editor like vi, we''ll
    see text about the validity of the certificate, issuer, and so on, and closer
    to the bottom line that starts with -----BEGIN and its followed by some coded
    text and terminated by an END line. We only need to copy everything between the
    BEGIN and the END lines, both included as, to a new file. If we execute the file
    again, the new file will be recognized as a PEM format file.


    ```

    [root@hotel tls]# file *

    ca.cert.pem: PEM certificate

    hotel.linuxaholics.com.crt: ASCII text

    hotel.linuxaholics.com.key: PEM RSA private key

    hotel.linuxaholics.com.pem: PEM certificate

    ```


    As we already have all the files in the right format, we can include the new options
    in the Samba configuration file:


    ```

    tls cafile = /var/lib/samba/private/tls/ca.cert-pem

    tls certfile = /var/lib/samba/private/tls/hotel.linuxaholics.com.pem

    tls keyfile = /var/lib/samba/private/tls/hotel.linuxaholics.com.key

    ```


    After restarting Samba, we can repeat the test we performed before and execute
    tcpdump in the OpenLDAP server to monitor the connections. As soon as a client
    connects to the Samba server, we can open the file in Wireshark. The result in
    this will be very different (Figure 8–4).'
