    # Summary


    In this chapter we learned how to manage local users in Samba using smbpasswd
    and pdbedit. We also saw how to add and edit users in Active Directory with samba-tool.


    Then, we studied user and group mapping in Samba and we learned how to force user
    and group ownership in Samba shares.'
