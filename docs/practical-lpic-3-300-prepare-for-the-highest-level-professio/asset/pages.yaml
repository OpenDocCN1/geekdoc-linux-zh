- img_proc: true
  md: 'For the WINS server to be queried over the network, we need to check that the
    corresponding ports in the firewall are open.


    ```

    [root@juliet ~]# firewall-cmd --list-ports

    137/udp 138/udp 445/tcp 8888/tcp 139/udp

    ```


    On the computer that acts as the WINS client we need to include in this line:


    ```

    wins server = 192.168.56.103

    ```


    Another WINS-related options are wins proxy and dns proxy. The first one is used
    for the Samba server to listen to broadcast name queries and forward them to a
    WINS server. This could be useful if the WINS clients and the WINS server are
    on separate networks and broadcast traffic is not permitted. Today, however, this
    option is rarely used. The other option, dns proxy, means that the Samba server
    acting as a WINS server should treat any unresolved NetBIOS name as a name and
    query the DNS server on behalf of the client.


    We should also take into account the parameter name resolve order, which determines
    the order in which the client will resolve the NetBIOS name. By default, it has
    this value:


    ```

    name resolve order = lmhosts, wins, host, bcast

    ```


    This means the computer will try to resolve the name first in the lmhosts file,
    then it will query the WINS server. If it cannot resolve the name yet it will
    search the host file, and finally it will use a broadcast.


    In the Samba WINS server there are two files where information related to NetBIOS
    names is stored. The first one is the file /var/lib/samba/wins.dat, which is a
    text file, the content of which can be easily seen.


    ```

    [root@juliet ~]# cat /var/lib/samba/wins.dat

    VERSION 1 0

    "JULIET_SERVER#00" 1524267695 192.168.1.226 66R

    "WORKGROUP#1e" 1524176448 0.0.0.0 e4R

    "ZULU#00" 1524059778 192.168.1.250 64R

    "JULIET#03" 1524189861 192.168.1.226 66R

    "WORKGROUP#00" 1524176448 0.0.0.0 e4R

    ```'
  merge: -1
  pgno: 518
