  md: '# # Introduction


    When I started studying for the LPIC-3 certification a few years ago, I noticed
    how few resources were available. In addition, some of the resources were also
    quite dated and thus they were not very useful. The aim of this book is to help
    fill that gap.


    The LPI certification program is platform independent, but as it is obviously
    impossible to check every single topic in every Linux distribution, I decided
    to use CentOS Linux as the main operating system throughout the book. The choice
    of this distribution is due to the fact that RedHat and its derivatives like CentOS
    are currently one of the main Linux distributions. Of course, most of the topics
    learned in the book can be equally applied to other major Linux distributions
    such as SUSE, Ubuntu, and so on.


    The topics covered in this book are those official for the LPIC-3 300 exam at
    the time of writing, as well as those topics planned to be included in the new
    revision of the exam.


    If you have any suggestions, opinions, questions, or criticisms about this book
    you can contact me via LinkedIn at https://www.linkedin.com/in/antoniojosevazquez/.\Note,
    however, that I cannot promise to answer everyone.'
  merge: -1
  pgno: 18
- img_proc: true
