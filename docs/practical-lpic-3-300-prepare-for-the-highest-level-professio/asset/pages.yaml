- img_proc: true
  md: '# Authentication,

    Authorization,

    and Winbind


    We have already seen when talking about OpenLDAP that apart from authenticating
    against the local user database located at /etc/passwd, users could also authenticate
    against an OpenLDAP server. This has numerous advantages, as we can use a common
    centralized user repository, making user management much easier.


    In this chapter we will see how to authenticate users against a Samba or Windows
    server. We''ll cover the following concepts:


    +   - Setting up a local password database.

    - Performing password synchronization.

    - Knowledge of different passdb back ends.

    - Converting between Samba passdb back ends.

    - Integrating Samba with LDAP.

    - Configuring Winbind service.

    - Configuring PAM and NSS.


    We will also see the following terms and utilities: smb.conf, smbptdams, ldapsam,
    passdb back end, libnss_winbind, pam_winbind, wbindinfo, getent, SID and foreign
    SID, /etc/passwd, and /etc/group.'
  merge: -1
  pgno: 388
- img_proc: true
  md: '# Setting Up a Local Password Database


    The terms **authentication** and **authorization** are sometimes misunderstood,
    and so they need to be clarified. *Authentication* is the process of confirming
    the identity of a given user, whereas *authorization* is the assignment of rights
    to a certain user once they have been authenticated.


    In Chapter 13, we saw many examples of how to use **smbpasswd** and **pdbedit**
    to create a local user database. For that reason we won''t repeat that information
    here.


    # Performing Password Synchronization


    As we already know, when using local Samba accounts, we need to create both a
    Linux user account and a Samba user account. As maintaining different passwords
    for the same user can be cumbersome and prone to error, Samba offers the possibility
    to synchronize both passwords.


    For this synchronization to work we need to add and modify a few parameters. The
    first of these parameters is `unix password sync`. Let''s look at its default
    value.


    ```

    [root@alpha ~]# testpass -sv | grep "unix password sync"

    ```


    ```

    unix password sync = No

    ```


    We''ll have to change its default value to yes. In addition, we should set the
    option `passwd` program to the full path of the program used to change the Linux
    password.


    ```

    unix password sync = yes

    passwd program = /usr/bin/passwd %u

    ```


    Both options should be placed in the [Global] section.

    Unfortunately, this option only works when the back end is **smbpasswd**, the
    use of which is discouraged, as we''ll see in the next section. Besides, it requires
    that the client use Lan Manager (LM) authentication, which is also not recommended
    for security reasons. For these reasons the actual use of this parameter is very
    limited.'
  merge: -1
  pgno: 389
- img_proc: true
  md: '# Knowledge of Different passdb Back Ends and Converting between Different
    Back Ends


    Samba needs to store the passwords associated with each user somewhere, either
    in a database, an LDAP server, or somewhere else. The place where Samba stores
    this information is called the **passdb backend**. According to its man page,
    it can take three different values:


    +   - smbdpasswd: This is the first back end used by Samba. It consists of a simple
    plain text file. At this moment it is still supported, but its use is discouraged,
    as some Samba features won''t work with this back end.

    - tdbsam: Widely used nowadays, it uses Trivial Database (tdb) files to store
    the information. This is the back end we''ve been using in most parts of this
    book.

    - ldapsam: It uses an LDAP server as a back end. We already used this back end
    in Chapter 8.


    Changing from a passdb back end to another is very easy; we only need to change
    the value of the parameter in smb.conf. Right now, this is the value set up in
    our configuration:


    passdb backend = tdbsam


    At any moment we can change it to smbdpasswd.


    passdb backend = smbdpasswd


    The password file will be by default /var/lib/samba/private/smbdpasswd, but we
    could use a different path if we wanted by adding the smb password file option.


    After restarting the SMB service we''ll see that we have no users defined, as
    we are using a completely different back end.


    ```

    [root@hotel ~]# pdbedit -L

    [root@hotel ~]#

    ```'
  merge: -1
  pgno: 390
- img_proc: true
