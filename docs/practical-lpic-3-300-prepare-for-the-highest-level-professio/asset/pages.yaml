    As winbind is part of the Samba suite, it also uses the same configuration file
    (/etc/samba/smb.conf). For winbind to work properly, we need to change many parameters
    in the file, luckily authconfig does the job for us. If we take a look at smb.
    conf we''ll see the following section:


    ```

    [global]

    --authconfig--start-line--n

    # Generated by authconfig on 2017/03/26 15:17:00

    # DO NOT EDIT THIS SECTION (delimited by --start-line---/end-line--)

    # Any modification may be deleted or altered by authconfig in future


    workgroup = VENTANAS

    password server = yankee.ventanas.local

    realm = VENTANAS.LOCAL

    security = ads

    idmap config * : range = 167772216-33554431

    template shell = /bin/false

    kerberos method = secrets only

    winbind use default domain = false

    winbind offline logon = false

    ```


    We see that the workgroup name has been changed to that of the Active Directory
    domain, and the same thing happened to the Kerberos realm. As our Active Directory
    domain only has a single DC, the option password server has been set to the name
    of the DC, so that all validations are performed by that server. Of course, becoming
    a member server implies that the security parameter has also been set to ads.'
