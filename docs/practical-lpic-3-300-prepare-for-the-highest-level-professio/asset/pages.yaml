    ```


    To enable the support of extended ACL in our Samba server we could use two different
    VFS modules: vfs_acl_xattr and vfs_acl_tdb. The first stores the ACLs in the file
    extended attributes, whereas the second keeps that information in the file_ntacls.db
    file.'
