    # Authentication Methods


    Usually when we access any server we have to authenticate first; that is, we provide
    a valid username/password combination. Nevertheless, some services allow us to
    access unauthenticated. To authenticate the clients, OpenLDAPcan use different
    approaches. It can use the bind operation to authenticate, which in turn can use
    two different methods: simple and SASL.


    # Simple Bind Authentication


    The simple method provides three authentication mechanisms:


    +   - Anonymous

    - Unauthenticated

    - User/password


    Let''s review each one in detail.'
