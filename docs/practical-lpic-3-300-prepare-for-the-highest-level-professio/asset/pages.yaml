  md: '# Browsing from a Windows Client


    The easiest way to browse the network from a Windows client is by simply clicking
    the network icon. In the resulting window we''ll see the computers that are part
    of the network (Figure 22-10).


    +   - Computer (4)


    ![](img/dfa44432604022575079471b648e25ca_549_0.png)


    This method of browsing the network uses NetBIOS and it might not work when using
    Samba 4. Nevertheless, as we have already seen, we could map the shared resources
    to a network unit and the way to browse those shares would be very similar.


    # smbclient


    We have already used smbclient many times in this book. Now we''ll see it in a
    bit more depth. We can list the shares in a remote server with the -L parameter.


    ```

    [root@alpha~]# smbclient -L //hotel.linuxholics

    Enter root''s password:

    Anonymous login successful

    Domain=[MYGROUP] OS=[Unix] Server=[Samba 4.1.1]

    ```


    | Shername | Type | Comment |

    | --- | --- | --- |

    | Docs | Disk | Public documents |

