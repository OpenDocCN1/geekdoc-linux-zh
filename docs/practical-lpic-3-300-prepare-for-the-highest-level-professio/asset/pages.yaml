    #  POSIX and Non-POSIX Groups


    In Chapter 25 we learned to manage groups in FreeIPA, but there is a related concept
    that we''ll look at now. When creating FreeIPA users, we can distinguish between
    POSIX and non-POSIX groups.


    +   A POSIX group will include certain attributes needed in Linux like the GID.
    By default, the ipa group-add command creates POSIX groups, but we can create
    non-POSIX groups by including the parameter --nonposix. Let''s look at a couple
    of examples.


    ```

    [root@quebec ~]# ipa group-add a_posix_group

    Description: A POSIX group

    -----------------

    Added group "a_posix_group"

    -----------------

    Group name: a_posix_group

    Description: A POSIX group

    GID: 314600110

    [root@quebec ~]# ipa group-add a_non_posix_group --nonposix

    Description: A non-POSIX group

    -----------------

    Added group "a_non_posix_group"

    -----------------

    Group name: a_non_posix_group

    Description: A non-POSIX group

    ```


    682'
