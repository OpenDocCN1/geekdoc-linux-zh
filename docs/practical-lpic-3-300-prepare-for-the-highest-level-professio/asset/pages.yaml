    # Setting Up the Replication


    To replicate the contents via syncprl we first load the syncprov module into the
    OpenLDAP server. As usual, we will do this with the help of an LDIF file. We need
    to do this on every server that takes part in the replication process, in our
    case alpha and foxtrot.


    ```

    [root@foxtrot ldap]# cat modulesync.ldif

