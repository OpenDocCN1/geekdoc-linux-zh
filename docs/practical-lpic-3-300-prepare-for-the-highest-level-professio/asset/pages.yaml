- img_proc: true
  md: '# Server Tools


    These tools are included with the OpenLDAP server binaries and work directly over
    the slapd database. They should be used with caution because they could easily
    lead to database corruption. This could happen, for instance, if the admin tries
    to update the database content with a tool like slappadd and at the same time
    someone tries to do the same with ldapadd. For that reason, it is recommended
    that the slapd service is stopped when using server tools. In test environments
    like the one we are working with, however it is acceptable to execute the server
    tools without stopping the service, as there will be no other people accessing
    the LDAP database at the same time.


    # Slapcat


    Similar to `ldapsearch`, **slapcat** shows us information about the LDAP server.


    # Slapadd


    This tool is used to add objects at the server level, without the need for a network
    connection.


    # Slapindex


    This utility creates index files according to the index directive used in the
    configuration.


    # Slapppasswd


    This tool generates a password that can be used as a value of the userPassword
    attribute. We used this tool in this chapter to generate a password for the LDAP
    admin.


    # Slapacl


    This command can be used to check the behavior of access control lists (ACLs).
    We''ll see an example in Chapter 2 when talking about access control.


    # Slaptest


    This tool checks the configuration of the OpenLDAP.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Client Tools


    Client tools don’t work by directly accessing the database files as server tools
    do; they use library calls instead. The libraries should take care of the concurrent
    access to the LDAP server, so they do not have the same risk of accidentally leaving
    the LDAP database in an inconsistent state as the server tools do.


    # Ldsearch


    As the name implies, this tool is used to perform searches. We have already seen
    a few examples of the use of this command.


    # Ldapwhoami


    We can use this command to check the effective user we are validating as. This
    is especially useful when mapping users, as we’ll see in the forthcoming chapters.


    # Ldapadd


    This command is used to add new objects to our LDAP server. It is really a link
    to Ldapmodify.


    # Ldapdelete


    This tool is used to delete entries in the LDAP.


    # Ldapmodify


    This command can be used to modify LDAP entries and add new ones.


    # Ldapmodrn


    This utility renames LDAP entries.'
  merge: -1
