    # Access Control


    As long as the directory gets populated with more and more data, we need to control
    the access to different parts of the directory. In Chapter 1 we already saw a
    brief example when we gave access to the admin user.


    The general syntax to configure access control is as follows:


    olcAccess: to <what> [ <who> [<accesslevel>] [<control>].


    For example:


    olcAccess to * by * read


    We already used olcAccess to give permissions to the admin user (cn=admin, dc=linuxaholics,
    dc=com) in Chapter 1. Now we''ll see another example. First we create another
    user:


