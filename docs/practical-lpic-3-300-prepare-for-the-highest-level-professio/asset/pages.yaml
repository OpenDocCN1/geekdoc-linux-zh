    are lots of parameters we can include in the file. One of these parameters is
    database_name, which determines the location of the database. The default value
    for this parameter is /var/kerberos/krb5kdc/principal, which is also the location
    of the database of the EXAMPLE.COM realm. We therefore didn''t need to include
    this parameter implicitly when we used the EXAMPLE.COM realm. Nevertheless, now
    we are using a new realm, LINUXHOLICS COM, located in a different path, and we
    must include this parameter in the definition.


    We also add the following lines to the domain_realm section:


    ```

    linuxaholics.com = LINUXHOLICS.COM

