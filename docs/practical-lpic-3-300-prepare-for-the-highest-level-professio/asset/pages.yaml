  md: "# CHAPTER 27 NETWORK FILE SYSTEM\n\nNow we create the directory we'll export\
    \ through NFS.\n\n```\n[root@quebec ~]# mkdir /SECURE_NFS\n[root@quebec ~]# touch\
    \ /SECURE_NFS/kerberized.txt\n```\n\nAs we created the folder and the file directly\
    \ in the server, both will be owned by root. This could cause problems when using\
    \ NFSv4 ACLs, as we've already seen, so we'll change the owner to the nfsnody\
    \ user.\n\n```\n[root@quebec ~]# chown -R nfsnody:nfsnody /SECURE_NFS/\n[root@quebec\
    \ ~]# ls -l /SECURE_NFS/\ntotal 0\n-rw-r--r-- 1 nfsnody nfsnody 0 feb 21 18:49\
    \ kerberized.txt\n```\n\nWhen we first set up our NFS server we didn't change\
    \ the default SELinux context, but because we now want to focus on security, we'll\
    \ use a specific context for NFS directories. We'll use semanage to make sure\
    \ that the directory has the right context when the system is rebooted and consequently\
    \ labeled.\n\n```\n[root@quebec ~]# semanage context -a t nfs t \"/SECURE_NFS(/)?\"\
    \n```\n\nThe context will be changed the next time the system is relabeled. To\
    \ change it now we can manually perform a relabel with restorecon or change the\
    \ present context with chcon.\n\n```\n[root@quebec ~]# restorecon -Rv /SECURE_NFS/\n\
    restorecon reset /SECURE_NFS context unconfined:u:object_r:default_t:s0->unconfined:u:object_r:nfs_t:s0\n\
    ```\n\nWe edit the /etc/exports file to include the folder we just created, and\
    \ we include the option sec=krb5 to use Kerberos authentication.\n\n```\n[root@quebec\
    \ ~]# cat /etc/exports\n/SECURE_NFS\t*(ro,sec=krb5)\n```\n\nThe parameter sec\
    \ indicates different levels of security that will be used. There are many possible\
    \ values:\n\n+   - none: In this case no special security measure is applied.\n\
    - sys: This is the default value. It uses local UIDs and GIDs to authenticate\
    \ users."
  merge: -1
  pgno: 713
- img_proc: true
  md: '# CHAPTER 27 NETWORK FILE SYSTEM


    +   * krb5: This level uses Kerberos to authenticate users instead of performing
    local authentication.


    +   * krb5i: Similar to krb5, this also adds integrity check.


    +   * krb5p: Similar to krb5i, this also includes encryption.


    We start the nfs-server and nfs-server-secure services.


    ```

    [root@quebec ~]# systemctl start nfs-server

    [root@quebec ~]# systemctl start nfs-secure-server

    ```


    We export the directories with exportfs.


    ```

    [root@quebec ~]# exportfs -av

    exporting *:SECURE_NFS

    ```


    We add the NFS service in the firewall.


    ```

    [root@quebec ~]# firewall-cmd --add-service=nfs

    success

    [root@quebec ~]# firewall-cmd --permanent --add-service=nfs

    success

    ```


    On the client computer, we''ll create the mount point and start the NFS service.


    ```

    [root@romeo ~]# mkdir /mnt/secure_nfs

    [root@romeo ~]# systemctl start nfs

    ```


    Next, update the local keytab file and mount the directory.


    ```

    [root@romeo ~]# ipa-keytab -s quebec.linuxaholics.local -p nfs/quebec.

    linuxaholics.local -k /etc/krb5.keytab

    Keytab successfully retrieved and stored in: /etc/krb5.keytab

    [root@romeo ~]# mount -t nfs4 -o sec=krb5 quebec.linuxaholics.local:

    SECURE_NFS /mnt/secure_nfs/

    [root@romeo ~]# ls /mnt/secure_nfs/

    kerberized.txt

    ```'
  merge: -1
  pgno: 714
- img_proc: true
  md: 'If we want the directory to be mounted automatically whenever the system boots
    up,

    ''ll need to add the corresponding line in /etc/fstab.


    quebec.linuxaholics.local:/NFS /mnt/nfs_client nfs _netdev,sec=krb5 0 0


    It is basically the same line we added at the beginning of the chapter, but we
    specify

    the option sec=krb5 and a different server.


    # Summary


    In this chapter we learned about the NFS protocol, one of the first protocols
    widely used

    to share files in Unix-like environments. We performed a basic configuration of
    the NFS

    server and successfully connected from the client. We explored some of the new
    features

    in NFSv4, such as the pseudo file system and the associated ACLs. Finally, we
    learned

    how to dramatically improve NFS security security by integrating it with Kerberos.'
