  md: 'Note To this point we have been working with the latest version of FreeIPA
    available in the CentOS 7 repositories. This version has many improvements over
    the original version included with the CentOS 7.0 installation DVD. However, to
    successfully integrate FreeIPA with Active Directory, it is significantly easier
    to use the older version included with the CentOS 7.0 installation DVD. The topics
    we need to learn in this chapter work with this version as well.


    At this moment we have a FreeIPA domain with its corresponding Kerberos realm,
    LINUXAHOLICS.LOCAL. As mentioned in the preceding node, in this chapter we''ll
    work with the FreeIPA version included with the installation DVD.


    To install the software versions included on the DVD instead of those in the official
    Internet repositories we need to make sure that we have the corresponding repository
    defined. Usually after installing CentOS 7 we should have a file named /etc/yum.repos/CentOS-Media.repo
    with the following content:


    ```

    [c7-media]

    name=CentOS-$release - Media

    baseurl=file:///media/cdrom

    gpgcheck=0

    enabled=1

    ```


    If the file doesn''t exist, we''ll have to create it. Then we create the /media/cdrom
    folder and we mount the CentOS 7.0 installation DVD.


    From this moment, whenever we want to install the software versions from the DVD
    we need to run yum by passing a couple of extra parameters. For instance, to install
    the FreeIPA server version included on the installation DVD, the full command
    would be this: yum --disablerepo* --enablerepo=c7-media install -y ipa-server.


    Therefore, we either have to uninstall the FreeIPA server and reinstall it from
    the DVD repository or reinstall the server from scratch and install ipa-server
    again from the installation DVD. Whichever method we choose, we''ll end up with
    a FreeIPA server pretty much like the one''ve used before, but without some advanced
    features like the use of DNSSEC.'
