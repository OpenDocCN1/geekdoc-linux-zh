- img_proc: true
  md: '# Getting a TGT from Kerberos


    To get a TGT from Kerberos we can use the kinit command. This utility is included
    in the krbs-workstation package. After installing it with yum we can obtain a
    TGT with kinit:


    ```

    [root@oscar ~]# kinit Administrator@LINUXAHOLICS.COM

    Password for Administrator@LINUXAHOLICS.COM:

    Warning: Your password will expire in 39 days on lun 26 nov 2018 20:26:19

    ```


    We can also list the ticket with klist.


    ```

    [root@oscar ~]# klist

    Ticket cache: FILE:/tmp/krb5cc_0

    Default principal: Administrator@LINUXAHOLICS.COM

    ```


    Valid starting Expires Service principal

    18/10/18 02:55:19 12/10/18 02:55:15 krbtgt@LINUXAHOLICS.COM@LINUXAHOLICS.COM

    renew until 19/10/18 02:55:15


    # DFS


    DFS is a set of server and client services that allow an organization using Windows
    servers to organize many distributed SMB file shares into a single distributed
    file system. In Chapter 17 we briefly talked about DFS-R, when studying SYSVOL.
    DFS-R is generally viewed as a subfunction of DFS, even though both can be used
    independently. As we said in Chapter 17, DFS-R is not implemented in Samba, but
    DFS is, even though there are currently some limitations.


    Currently we have in our domain two DCs: mike and november. We also have a member
    server, oscar. To see an example of DFS in Samba we will begin by creating a share
    in mike. We create the /mnt/mike_share folder and add the following share definition
    to the /usr/local/samba/etc/smb.conf file.


    ```

    path = /mnt/mike_share

    guest ok = Yes

    ```'
  merge: -1
  pgno: 499
- img_proc: true
