  md: '# CHAPTER 14 AUTHENTICATION, AUTHORIZATION, AND WINBIND


    Let''s imagine we have a Windows Active Directory domain named ventanas.local,
    and a DNS server for that domain is located at the server yankee.ventanas.local,
    which also happens to be a Windows 2008 domain controller. To make our Linux server
    india.linuxaholics.com a full member of the ventanas.local domain we first need
    to change the DNS settings of the Linux machine so that it can locate the domain-related
    resources. To make sure that our Linux server is resolving hostnames properly
    we can execute a simple query:


    ```

    [root@india ~]# dig a +noall +answer yankee.ventanas.local

    yankee.ventanas.local. 3600 IN A 192.168.1.235

    ```


    We are ready now to set up winbind. In CentOS 7 we can do it by executing the
    graphic utility authconfig-gtk, its n-curses equivalent authconfig-tui, or the
    command-line tool authconfig. For ease of use, we will choose authconfig-gtk.
    Once launched, we must select Winbind in User Account Database, and ads as the
    security model because we are connecting to an Active Directory domain. We type
    the domain name, the ADS Realm, and the domain controller (Figure 14-1). On the
    Advanced Options tab, select the Create home directories on the first login check
    box, so that we can log in with any Active Directory user. Next, return to the
    Identity & Authentication tab and click Join Domain. Later we confirm that we
    want to save the changes (Figure 14-2).'
