  md: '# Managing ID Ranges


    In an Active Directory trust relationship, the FreeIPA server will need a way
    to map POSIX IDs to SIDs and back. This is done with the use of ID ranges that
    will be assigned to the local domain and to the trusted domains. Once an Active
    Directory trust has been established, we can list the automatically created ID
    ranges with the ipa idrange-find command.


    ```

    [root@quebec ~]# ipa idrange-find

    ```


    2 ranges matched


    +   Range name: LINUXAHOLICS.LOCAL_id_range

    Posix ID of the range: 347800000

    Number of IDs in the range: 200000

    First RID of the corresponding RID range: 1000

    First RID of the secondary RID range: 1000000000

    Range type: local domain range


    Range name: VENTANAS.LOCAL_id_range

    First Posix ID of the range: 215800000

    Number of IDs in the range: 200000

    First RID of the corresponding RID range: 0

    Domain SID of the trusted domain: S-1-5-21-1754085188-4219036064-3012244413

    Range type: Active Directory domain range


    Number of entries returned 2


    By default, the local domain, LINUXAHOLICS.LOCAL, has been assigned IDs beginning
    from 347800000. We can assign 200,000 consecutive IDs before exhausting the ID
    range. If we check the ID associated with a user in the domain, we''ll see values
    inside that range.


    ```

    [root@quebec ~]# id antonio@@uxaholics.local

    uid=347800008(antonio) gid=347800008(antonio) groups=347800008(antonio)

    ```'
