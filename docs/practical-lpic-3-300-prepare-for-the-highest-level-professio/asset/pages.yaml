    # # Configuring Logon Scripts


    The admin can configure a script that will be executed whenever a user logs in.
    The script location will be set up in the logon script option and it will be a
    relative path to the [netlogon] share.


    For example, let''s assume that we want the user john to map a network unit to
    a certain network share. This share could be on any server of the domain. Currently
    we don''t have any BDCs or member servers, we''ll create the share in the PDC
    itself.'
