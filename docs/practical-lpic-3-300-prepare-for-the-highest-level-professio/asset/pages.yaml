  md: '# Features and Benefits of CIFS


    According to Microsoft, CIFS/SMB has a series of features that give it many benefits
    over other network protocols.


    +   - Integrity and concurrency: CIFS allows concurrent access to the same file,
    while providing the needed locking mechanisms to prevent conflicts.

    - Optimization for slow links: The CIFS protocol has been optimized over the years
    to work well even over slow links.

    - Security: A CIFS server allows both anonymous as well as authenticated secure
    access to the resources.

    - Performance and stability

    - Unicode file names


    # Permissions and Ownership of Remote File Shares


    We can list the permissions of a remote Samba share with smbcacls.


    ```

    [root@alpha ~]# smbcacls //192.168.1.129/public 2018jan.txt -U antonio

    Enter SAMBA\antonio''s password:

    Revision:1

    CONTROL:SR|DI|DP

    OWNER:Zulu\Antonio

    GROUP:Zulu\None

    ACL:Zulu\Antonio:ALLOWED/I/FULL

    ACL:BUILTIN\Administrators:ALLOWED/I/FULL

    ACL:NT AUTHORITY:SYSTEM:ALLOWED/I/FULL

    ```


    We can see the permissions assigned as well as the owner. If we want to, we can
    add a new ACL.


    ```

    [root@alpha ~]# smbcacls //192.168.1.129/public 2018jan.txt -U antonio%antonio
    -a ACL:Jose:ALLOWED/0/READ

    ```'
  merge: -1
  pgno: 535
- img_proc: true
  md: '# CHAPTER 21〃CIFS INTEGRATION


    Now the user Jose will have read permissions to the 2018jan.txt file in the public
    share of the computer with ip address 192.168.1.129. We can check this by executing
    smbcacls again.


    ```

    [root@alpha ~#] smbcacls //192.168.1.129/public 2018jan.txt -U

    antonio%antonio

    REVISION:1

    CONTROL:SR|DP

    OWNER:Zulu\None

    GROUP:Zulu\None

    ACL:Zulu\Jose:ALLOWED/I/FULL

    ACL:Zulu\Antonio:ALLOWED/I/FULL

    ACL:BUILTIN\Administrators:ALLOWED/I/FULL

    ACL:NT AUTHORITY\SYSTEM:ALLOWED/I/FULL

    ```


    The ACL for the user antonio is listed with a capital I because the permissions
    are inherited from the parent folder, as opposed to the permission we granted
    specifically to the user jose. We can check the permissions from a Windows workstation,
    too (Figure 21-1).'
  merge: -1
