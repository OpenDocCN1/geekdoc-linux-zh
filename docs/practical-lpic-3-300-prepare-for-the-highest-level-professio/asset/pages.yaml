  md: '# Replication Topology


    The IPA server''s data are stored in the LDAP server, in two different locations.
    The domain suffix, in our case dc=linuxaholics, dc=local contains all the domain-related
    data. In addition, those servers with a CA installed store data for certificate
    server components in the ca suffix.


    We can list these two suffixes in any of our FreeIPA servers.


    ```

    root@quebec ~# ipa topologysuffix-find


    2 topology suffixes matched


    Suffix name: ca

    Managed LDAP suffix DN: o=ipaca


    Suffix name: domain

    Managed LDAP suffix DN: dc=linuxaholics,dc=local


    Number of entries returned 2

    ```


    The data stored in the IPA server will be replicated to other servers. The way
    this replication occurs is defined by replication agreements. These replication
    agreements need to be set for both suffixes. Agreements are represented by topology
    segments. By default, a topology segment represents two replication agreements,
    one for each direction, A to B and B to A.

    We also check whether the replication agreements in both suffixes are okay.


    ```

    root@quebec ~# ipa topologysuffix-verify ca

    ===========================================

    Replication topology of suffix "ca" is in order.

    ===========================================

    root@quebec ~# ipa topologysuffix-verify domain

    ===========================================

    Replication topology of suffix "domain" is in order.

    ============================================

    ```'
  merge: -1
  pgno: 591
- img_proc: true
  md: '# CHAPTER 24 FREEIPA REPLICATION: ADDING CLIENTS TO THE DOMAIN


    If at some point we need help with a command we can use the --help parameter;
    for instance, ipa topologysuffix-show -- --help.


    To find out which servers are part of the replication segment we can execute the
    following command.


    ```

    [root@quebec ~]# ipa topologysegment-find ca

    ```


    1 segment matched


    ```

    Segment name: quebec.linuxaholics.local-to-sierra.linuxaholics.local

    Left node: quebec.linuxaholics.local

    Right node: sierra.linuxaholics.local

    Connectivity: both

    ```


    Number of entries returned 1


    ```

    [root@quebec ~]# ipa topologysegment-find domain

    ```


    1 segment matched


    ```

    Segment name: quebec.linuxaholics.local-to-sierra.linuxaholics.local

    Left node: quebec.linuxaholics.local

    Right node: sierra.linuxaholics.local

    Connectivity: both

    ```


    Number of entries returned 1


    In our example, we have only two FreeIPA servers and they communicate with each
    other, but if we were working with tens or hundreds of servers, we would have
    to pay attention to our topology architecture. Much of what we studied in Chapter
    5 is valid here as well.


    We can basically three different replication topologies:


    +   * Peer to peer: In this case there is a string of servers A – B – C – D, and
    so on, and every one of them replicates the information with its neighbor (Figure
    24-4).'
  merge: -1
  pgno: 592
- img_proc: true
  md: '![](img/dfa44432604022575079471b648e25ca_593_0.png)


    Figure 24-4. Peer to peer replication topology


    +   - Star: There is a central server that connects to all of the other servers
    to replicate the data (Figure 24-5).


    ![](img/dfa44432604022575079471b648e25ca_593_1.png)


    Figure 24-5. Star replication topology'
  merge: -1
  pgno: 593
- img_proc: true
  md: 'Mesh: This is a mixed architecture, in which the servers are connected to several
    other servers, so that if one server fails the rest of the servers still can obtain
    the needed information (Figure 24-6).


    ![](img/dfa44432604022575079471b648e25ca_594_0.png)


    **Figure 24-6.** Mesh replication topology


    When designing a topology, we should have two considerations: avoiding a single
    point of failure and avoiding high levels of traffic on a single server.

    To see a practical example, we''ll add a new replica to our infrastructure. The
    procedure its is the same as we have seen so far; the only difference is that
    when installing the client, we''ll specify the name of one of the servers.'
