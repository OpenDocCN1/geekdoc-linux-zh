- img_proc: true
  md: '# CHAPTER 21 CIFS INTEGRATION


    We can also modify the ACL we just added to give the user read and write permissions
    instead of the read permission.


    ```

    [root@alpha ~]# smbclient //192.168.1.129/public 2018jan.txt -U

    antonio%antonio -M ACL:Jose:ALLOWED/0/CHANGE

    [root@alpha ~]# smbclient //192.168.1.129/public 2018jan.txt -U

    antonio%antonio

    ```


    ```

    REVISION:1

    CONTROL:SR|DP

    OWNER:ZuluAntonio

    GROUP:ZuluNone

    ACL:Zulu\Allowed:ox0/CHANGE

    ACL:Zulu\Antonio:ALLOWED/I/FULL

    ACL:BUILTIN\administrators:ALLOWED/I/FULL

    NT AUTHORITY\SYSTEM:ALLOWED/I/FULL

    ```


    Smbcas can also be used to change the ownership of the file. However, the owner
    can only be changed to the user who executed the command. If, for instance, the
    owner tries to change the ownership to the user jose, he will get the following
    error.


    ```

    [root@alpha ~]# smbclient //192.168.1.129/public 2018jan.txt -U

    antonio%antonio -M OWNER:Jose

    ```


    ERROR: security description set failed: NT_STATUS_INVALID_OWNER


    It is the user jose who has to execute smbcas.


    ```

    [root@alpha ~]# smbclient //192.168.1.129/public 2018jan.txt -U jose%jose -M

    OWNER:Jose

    ```


    Failed to open \2018jan.txt: NT_STATUS_ACCESS_DENIED


    Nevertheless, this time we get a different error, because jose has only read and
    write permissions. He cannot change the ownership of the file. We need to grant
    him full permissions first.


    ```

    [root@alpha ~]# smbclient //192.168.1.129/public 2018jan.txt -U

    antonio%antonio -M ACL:Jose:ALLOWED/o/FULL

    ```'
  merge: -1
  pgno: 538
- img_proc: true
  md: 'Now jose can effectively take ownership of the file.


    ```

    [root@alpha ~]## smbcacls //192.168.1.129/public 2018jan.txt -U jose%jose -M

    OWNER:Jose

    [root@alpha ~]## smbcacls //192.168.1.129/public 2018jan.txt -U jose%jose

    REVISION:1

    CONTROL:SR|DP

    OWNER:Zulu\Jose

    GROUP:Zulu\None

    ACL:Zulu:ALLOWED/0x0/FULL

    ACL:Zulu\Antonio:ALLOWED/I/FULL

    ACL:BUILTIN\Administrators:ALLOWED/I/FULL

    ACL:NT AUTHORITY\SYSTEM:ALLOWED/I/FULL

    ```


    Finally, we can restore the ownership of the file and delete the ACL.


    ```

    [root@alpha ~]## smbcacls //192.168.1.129/public 2018jan.txt -U

    antonio@antonio -M OWNER:antonio

    [root@alpha ~]## smbcacls //192.168.1.129/public 2018jan.txt -U

    antonio@antonio -D ACL:Jose:ALLOWED/0x0/FULL

    ```


    # Summary


    In this chapter we have seen many ways to access a Windows share from a Linux
    workstation. Besides the well-known smbclient utility, we have seen many other
    popular alternatives. We learned a bit more about the CIFS/SMB protocol and we
    saw how to store in a file with the appropriate permissions the credentials used
    to mount a remote share. Finally, we listed and changed the permissions and ownership
    of a remote share.'
