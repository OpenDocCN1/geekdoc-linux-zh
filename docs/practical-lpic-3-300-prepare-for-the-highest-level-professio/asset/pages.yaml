  md: '# CHAPTER 24 FREEIPA REPLICATION: ADDING CLIENTS TO THE DOMAIN


    Finally, if we want to completely remove the replica at romeo we will use the
    ipareplica-manage command. If we remove the replica in quebec.linuxapolis.local,
    sierra and romeo won''t be able to replicate information. The command itself will
    detect this situation and won''t execute the action.


    On the other hand, we could safely remove the replicas at sierra or romeo, as
    this will only affect them.


    To remove replicas, we use the ip-replica-manage command. We can also use this
    to list all the replicas in the domain.


    ```

    [root@romeo ~]# ipa-replica-manage list

    sierra.linuxapolis.local: master

    quebec.linuxapolis.local: master

    romeo.linuxapolis.local: master

    ```


    If we want to remove a replica, we have to use the command ipa-replica-manage
    del replica_name. However, this command cannot be executed on the replica server
    we''re going to delete. If we try that, we get an error.


    ```

    [root@romeo ~]# ipa-replica-manage del romeo.linuxapolis.local

    Can''t remove itself: romeo.linuxapolis.local

    ```


    From the other server we can execute it without a problem.


    ```

    [root@quebec ~]# ipa-replica-manage del romeo.linuxapolis.local

    Updating DNS system records

    ipa: ERROR: unable to resolve host name romeo.linuxapolis.local. to IP address,
    ipa-ca DNS record will be incomplete

