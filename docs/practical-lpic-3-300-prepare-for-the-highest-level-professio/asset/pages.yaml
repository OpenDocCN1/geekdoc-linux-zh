    To solve this issue in Windows servers prior to Windows 2008, Microsoft used FRS
    replication. Since the release of Windows Server R2, however, this method has
    been largely replaced by DFS replication. Currently Samba does not support either
    method natively, to keep the contents of the SYSVOL shares synchronized in the
    different DCs of the Active Directory domain we need to implement a workaround.


    One of the recommended workarounds in the official Samba documentation is the
    use of rsync. This utility is usually installed by default, so we''ll have to
    install it first.


    ```

    [root@mike ~#] yum install -y rsync

    [root@november ~#] yum install -y rsync

    ```


    The copy will be unidirectional; we''ll choose the master server that has the
    PDC emulator FSMO role by mike.linuxaholics.com.


    ```

    [root@mike ~#] /usr/local/samba/bin/samba-tool fsmo show | grep -i pdc

    PdcEmulatorMasterRole owner: CN=NTDS Settings,CN=MIKE,CN=Servers,CN=Defau lt-First-Site-Name,CN=Sites,CN=Configuration,DC=linuxaholics.com

    ```


    In the PDC emulator we configure the rsync service by editing the /etc/rsyncd.conf
    file, so that in the end looks like:


    ```

    [root@mike ~#] cat /etc/rsyncd.conf

    # /etc/rsyncd: configuration file for rsync daemon mode

    ```


    # See rsyncd.conf man page for more options.


    ```

    [SysVol]

    path = /usr/local/samba/var/locks/sysvol/

    comment = Samba Sysvol

    uid = root

    gid = root

    read only = yes

    auth users = sysvol-replication

    secrets file = /usr/local/samba/etc/rsyncd.secret

    ```


    The content of the file is almost self-explanatory: We set the path of the folder
    that will be synchronized, the user and group whose rights apply when performing
    the synchronization, and the authorized users to connect to the service (sysvol-replication)

    Finally, we specify a secret that will be located in the /usr/local/samba/etc/


