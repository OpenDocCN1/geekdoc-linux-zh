- img_proc: true
  md: '# CHAPTER 12 PRINT SERVICES


    We also need to create the [print$] share to store the drivers, which currently
    doesn''t exist. We''ll add the following lines, to.


    # [print$]


    ```

    comment = Printer Drivers

    create mask = 0664

    directory mask = 0775

    force group = @printadmin

    path = /var/lib/samba/drivers

    write list = @printadmin

    ```


    We create the /var/lib/samba/drivers folder if it doesn''t exist and we restart
    the service.


    ```

    [root@mike ~]# /root/soft/samba-4.9.1/bin/smbdcontrol smbd reload-config

    [root@mike ~]# /root/soft/samba-4.9.1/bin/smbdcontrol smbd reload-printers

    ```


    To upload the drivers to the Samba server, we log in to a Windows workstation
    that is included in the domain as the admin user. Again, all the details about
    joining a workstation to be found in Chapter 17.


    The user who will upload the drivers need to have the SePrintOperatorPrivilege
    set. If this is not the case, we''ll grant it now.


    ```

    [root@mike bin]# /root/soft/samba-4.9.1/bin/net rpc rights list privileges

