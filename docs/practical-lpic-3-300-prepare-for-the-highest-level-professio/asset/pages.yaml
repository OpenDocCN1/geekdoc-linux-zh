    The way to effectively migrate from a Windows server to a Samba server will depend
    on many factors. It is thus necessary to adapt the general guidelines we''ll see
    here to whatever the environment is. In the next sections we''ll review the four
    steps of a migration in detail.


    # Migrate Accounts


    We can get a list of the Windows users with the net user command. We''ll redirect
