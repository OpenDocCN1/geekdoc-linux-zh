- img_proc: true
  md: '# CHAPTER 18 CONFIGURING SAMBA AS A DOMAIN MEMBER SERVER IN AN EXISTING ACTIVE
    DIRECTORY DOMAIN


    ```

    [root@oscar ~]# mkdir /mnt/dfs

    [root@oscar ~]# cd /mnt/dfs/

    [root@oscar dfs]# ln -s msdfs:mike.linuxaholics.com\mike link1

    [root@oscar dfs]## ln -s msdfs:november.linuxaholics.com\november link2

    [root@oscar dfs]# ls

    ```


    link1 link2


    We made every link to point to a target on a different machine, but we could have
    made a link to a target using two targets like:


    ```

    [root@oscar dfs]# ln -s msdfs:november.linuxaholics.com\november,

    mike.linuxaholics.com\mike link2

    ```


    This would be a way to provide high availability because link2 would be accessible
    even if one of the two targets fails.


    Another way to provide high availability for Samba is through the use of CTDB.
    CTDB relies on a shared cluster file system to provide its services. There are
    many cluster file systems that can be used: RedHat GFS, Lustre, ClusterFS, OCSF2,
    and so on. Once the cluster file system is installed and operative, we can either
    install and configure CTDB from the official CentOS repositories or compile it
    after downloading the Samba source code from the official site.


    > Note Configuring a cluster file system is beyond the scope of this book. It
    is something currently not included in the LPIC-3 300 objectives, but it is on
    the LPIC-3 304 exam. There are good books and resources on this subject Pro High
    Availability Clustering by Sander van Vugt (Apress, 2014).


    The DFS share has been configured, and now we need to open the corresponding services
    in the firewall.


    ```

    [root@oscar dfs]# firewall-cmd --add-service={samba,samba-client}

    success

    [root@oscar dfs]# firewall-cmd --permanent --add-service={samba,samba-client}

    success

    ```'
