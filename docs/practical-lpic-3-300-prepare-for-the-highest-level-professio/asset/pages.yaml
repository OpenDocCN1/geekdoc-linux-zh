    +   - Understanding the roles of the Samba daemons and components.

    - Identifying key TCP/UDP ports used with SMB/CIFS.

    - Knowledge of Samba3 and Samba4 differences.

    - Understanding the major features of SMB protocol versions 1.0, 2.0,

