  md: '# CHAPTER 2 SECURING THE DIRECTORY


    The use of firewall-cmd is the preferred way to interact with the local firewall
    in CentOS 7. However, as the LPIC-3300 objectives specifically mention iptables
    we''ll see the equivalent commands that we need to execute by using iptables instead
    of firewall-cmd.


    We''d allow incoming traffic like this:


    ```

    [root@alpha ~]# iptables -I INPUT -p tcp --dport 389 -j ACCEPT

    [root@alpha ~]# iptables -I INPUT -p tcp --dport 636 -j ACCEPT

    ```


    To make the changes permanent with iptables we could create a backup of the firewall
    configuration with iptables-save.


    ```

    [root@alpha ~]# iptables-save > iptables.bk

    ```


    To restore the backed up configuration, we''d use iptables-restore.


    ```

    [root@alpha ~]# iptables-restore > iptables.bk

    ```


    Even though it is not exactly a firewall, we can also use TCP wrappers to limit
    access to the OpenLDAP server. TCP wrappers allow us to explicitly permit or deny
    access to certain services binary file, slapd the configuration in this case,
    must have been linked to the libwrap binary library. We can check this with ldd.


    ```

    [root@alpha ~]# ldd /usr/bin/slapd | grep wrap

    libwrap.so.0 => /lib64/libwrap.so.0 (0x00007fc0afed000)

    ```


    We''re ready to use TCP wrappers to protect the LDAP service. The configuration
    is very easy, as there are only two files involved: /etc/hosts.allow and /etc/hosts.
    The first file is checked, and as soon as line matches a certain connection no
    rules are applied.


    As a proof of concept, we''ll allow the computer 192.168.1.230 to access our LDAP
    server. The syntax of the /etc/hosts.allow file is very simple: We specify in
    a single line the host, or hosts affected, and optionally whether we want to grant
    (by default) or deny access. We''ll edit the file with our favorite editor (vim,
    nano, etc.). The content should be similar to this:


    ```

    [root@alpha ~]# cat /etc/hosts.allow

    ```'
