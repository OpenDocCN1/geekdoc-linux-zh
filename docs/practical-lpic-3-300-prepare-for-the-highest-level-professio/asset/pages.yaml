  md: "# CHAPTER 8 SAMBA CONCEPTS AND ARCHITECTURE, CONFIGURING SAMBA, AND INTERNATIONALIZATION\n\
    \nThe default configuration states that the log file will be placed in the /var/log/samba/\
    \ folder and it will be named log.machine_name. The maximum size of every log\
    \ file will be 50 KB, before they begin to rotate. We can keep these values for\
    \ now.\n\nNext we get to the security parameter. We should use one value or another\
    \ depending on the role of our Samba server in the network (see Chapter 9 to learn\
    \ more about the Samba server roles). For a stand-alone server, such as the one\
    \ we have right now, the security parameter should be set to user. There are two\
    \ more possible values (shared and server), but they are deprecated and should\
    \ be avoided according the official Samba documentation.\n\nThe passdb backend\
    \ parameter specifies where the user information should be stored: either in a\
    \ local database (tdbsam) or in LDAP (ldapsam).\n\n```\nsecurity = user\npassdb\
    \ backend = tdbsam\n```\n\nIn the current configuration we use a local database\
    \ to store Samba users. We used the smbpasswd command to create the user Antonio,\
    \ but there is a more complete tool to manage user accounts in Samba, the pddbedit\
    \ command. For instance, if we want to create a new Samba user in Linux and then\
    \ execute pddbedit -a:\n\n```\n[root@hotel ~]# useradd -m c \"Antonio Vazquez\"\
    \ avaz\n[root@hotel ~]# pddbedit -a avaz\nnew password:\nype new password:\nUnix\
    \ username: avaz\nNT username:\nAccount Flags: \nUser SID: S-1-55-21-89261928-2955833375-3350856941-1002\n\
    Primary Group SID: S-1-55-21-89261928-2955833375-3350856941-513\nFull Name:\n\
    Home Directory: \\hotel\\avazquez\nHomeDir Drive:\nLogon Script:\nProfile Path:\
    \ \\hotel\\avazquez\\profile\nDomain:\nHOT\nAccount desc:\nWorkstations:\n```"
  merge: -1
