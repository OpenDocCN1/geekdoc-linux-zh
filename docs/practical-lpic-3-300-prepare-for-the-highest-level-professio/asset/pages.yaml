    In addition to sending log information to a file, Samba also sends log information
    to syslog. We can specify the threshold to send messages to syslog with the syslog
    option. For example, if we include the line syslog = 0 only error messages will
    be logged. With syslog = 1 the warning messages will be logged, too; with syslog
    = 2 the notice messages will be included as well; and so on.


