  md: '# CHAPTER 11


    # # Linux File System and Share and Service Permissions


    A Samba server working as a file server relies on the underlying Linux file system
    permissions to work properly. We''ll see how Linux permissions work and how they
    interact with Samba permissions. In this chapter, we''ll cover the following concepts:


    +   - Knowledge of file and directory permission control.

    - Understanding how Samba interacts with Linux file system permissions and ACLs.

    - Using the Samba Virtual File System (VFS) to store Windows ACLs.


    We will also be introduced to the following terms and utilities: smb.conf, chmod,
    chown, create mask, directory mask, force create mode, force directory mode, smbcacs,
    getfac, setfac, vfs_acl_xattr, vfs_acl_tdb, and vfs objects.


    # ## File and Directory Permission Control


    We are all familiar with the Linux file system permissions model. Basically, every
    file or directory has three sets of permissions associated with it: the owner''s
    permissions (user), the group permissions (group), and the rest (other). For example,
    if a local user creates a new file, these will be the default permissions:


    ```

    [avazquez@bravo ~]$ touch example.txt

    [avazquez@bravo ~]$ ls -l example.txt

    -rw-rw-r-- 1 avazquez avazquez 0 Jun 29 23:31 example.txt

    ```'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# CHAPTER 11 LINUX FILE SYSTEM AND SHARE AND SERVICE PERMISSIONS


    If we ever need to change these permissions, we can do so with the chmod command.
    The syntax is very simple. First, we specify whether we want to modify the permissions
    for the owner (-u), group (-g), other (-o), or all of them (-a). Then we indicate
    whether we are granting (+) or revoking (-) the permission, and finally we specify
    the permission itself: (r), write (w), or execute (x).


    For example, if we want to grant other users the permission to write to the file,
    what we need to do:


    ```

    [avazquez@bravo ~]$ chmod o+w example.txt

    [avazquez@bravo ~]$ ls -l example.txt

    -rw-rw-rw-. 1 avazquez avazquez 0 Jun 29 23:31 example.txt

    ```


    If we want to revoke this permission, we can do it with chmod, too.


    ```

    [avazquez@bravo ~]$ chmod o-w example.txt

    [avazquez@bravo ~]$ ls -l example.txt

    -rw-rw-r-- 1 avazquez avazquez 0 Jun 29 23:31 example.txt

    ```


    There is an alternative syntax, which rather than using the flags -u, -g, -o,
    and so on, we specify the binary representation of the permissions assigned to
    each one of these three groups.


    By default, each type of permission is assigned the following value: r = 4, w
    = 2, and x = 1. In our example, the binary representation of the permissions associated
    with the example.txt file will be 664, as the owner has read (4) plus write (2)
    permissions, the group has also read (4) plus write (2) permissions, and other
    users have only read (4) permissions.


    We can check this point with the stat command, which shows us the file permissions
    in both formats, as well as other interesting information.


    ```

    [avazquez@bravo ~]$ stat example.txt

    File: example.txt

    Size: 0      Blocks: 0      IO Block: 4096 regular empty file

    Device: fd01h/64769d Inode: 34311523 Links: 1

    Access: (0664/-rw-rw--) Uid: ( 1003/avazquez) Gid: ( 1003/avazquez)

    ```


    294'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# CHAPTER 11 LINUX FILE SYSTEM AND SHARE AND SERVICE PERMISSIONS


    Therefore, if we want to give only read access to the group, we can again execute
    `nchmod` like this:


    ```

    [avazquez@bravo ~]$ chmod 644 example.txt

    [avazquez@bravo ~]$ ls -l example.txt

    -rw-r--r-- 1 avazquez avazquez 0 Jun 29 23:31 example.txt

    ```


    Remember that we created the example.txt file the default set of permissions assigned
    to it was 664. This is because when we create a new file in CentOS, the permissions
    initially assigned are 666 minus the umask value. Umask value has the default
    value of 002 and then the permissions assigned to the new file are 664.


    The umask value can also be modified if we want to change the default permissions
    assigned to newly created files.


    ```

    [avazquez@bravo ~]$ umask

    0002

    [avazquez@bravo ~]$ umask 022

    [avazquez@bravo ~]$ umask

    0022

    ```


    Now, after creating a new file the default permissions assigned to it will be
    644; is, owner (read/write), group (read), and other (read).


    ```

    [avazquez@bravo ~]$ touch example2.txt

    [avazquez@bravo ~]$ ls -l example2.txt

    -rw-r--r-- 1 avazquez avazquez 0 Jun 30 21:01 example2.txt

    [avazquez@bravo ~]$

    ```


    The umask value is similar in concept to other parameters used in Samba that we''ll
    see later, as `create` mask and directory mask.


    After creating a file or a directory, we can change its owner, as long as we have
    the appropriate permissions. By default, only the root user can do this.


    ```

    [root@bravo avazquez]# chown root example2.txt

    [root@bravo avazquez]# ls -1 example2.txt

    -rw-r--r-- 1 root avazquez 0 Jun 30 21:01 example2.txt

    ```'
