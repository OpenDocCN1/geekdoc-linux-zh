- img_proc: true
  md: '# Preparation


    For the replication to work, the two (or more) servers need to have the same time
    and be able to resolve each other name. The preferred way to resolve names in
    a network is by using a DNS infrastructure with one or more name servers, but
    we could use local hosts files.


    Once we check that the name resolution is working properly, we need to install
    an OpenLDAP server in the new replica machine. Then, we need to add the admin
    user, with the same password we used in the first OpenLDAP server, and we will
    grant this user the appropriate permissions. We also create an entry for our domain,
    linuxaholics.com, as well as the users OU, which is the LDAP branch that we will
    replicate later. All of this has already been done in the first OpenLDAP server
    (Chapter 1), so it shouldn''t be a problem at this point.


    Although is not absolutely necessary for the replication to work, it is always
    a good idea to set secure access for the new server as we did previously in the
    first OpenLDAP server (Chapter 2). We already created a CA in the alpha.linuxaholics.com
    computer, so we''ll create a new key and certificate for the replica server.


