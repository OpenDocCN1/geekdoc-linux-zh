  md: "# CHAPTER 9 REGULAR SAMBA MAINTENANCE AND TROUBLESHOOTING\n\nBefore deleting\
    \ the passdb.td file we check that Samba is working correctly.\n\n```\n[root@alpha\
    \ ~]# smbclient //hotel.linuxaholics.com/Docs -U Antonio\nEnter SAMBA\\Antonio's\
    \ password:\nTry \"help\" to get a list of possible commands.\nsmb: ~> ls\n. \
    \             D       0 Mon Aug 13 02:29:30 2018\n.              DR      0 Mon\
    \ Aug 13 09:27:15 2018\nexample.txt    N       24 Sun Aug 12 10:38:48 2018\nenglish.txt\
    \    A       33 Mon Aug 13 02:30:18 2018\nespanol.txt    A       29 Mon Aug 13\
    \ 02:30:19 2018\n      702592 blocks of size 1024. 5585616 blocks available\n\
    smb: \\> exit\n[root@alpha ~]#\n```\n\nNow, in the Samba server we delete the\
    \ file. We restart the server and we check that the file has been re-created.\n\
    \n```\n[root@hotel ~]# ls /var/lib/samba/private/\nmsg.sock passdb.tdb secrets.tdb\n\
    [root@hotel ~]# rm /var/lib/samba/private/passdb.tdb\nrm: remove regular file\
    \ '/var/lib/samba/private/passdb.tdb'? y\n[root@hotel ~]# systemctl restart smb\n\
    [root@hotel ~]# ls /var/lib/samba/private/\nmsg.sock passdb.tdb secrets.tdb\n\
    ```\n\nOf course, the original information will be given and we won't be able\
    \ to log in again with the former users.\n\n```\n[root@alpha ~]# smbclient //hotel.linuxaholics.com/Docs\
    \ -U Antonio\nEnter SAMBA\\Antonio's password:\nsession setup failed: NT_STATUS_LOGON_FAILURE\n\
    ```\n\nHowever, as we have been cautious enough to perform a backup, we can easily\
    \ restore the original file. To accomplish this, use the tdbrestore command. This\
    \ is the syntax of the command:\n\n```\n[root@hotel ~]# tdbrestore\nUsage: tdbrestore\
    \ < tdbdump_output\n```"
