- img_proc: true
  md: '# CHAPTER 20


    # Active Directory Name Resolution


    In the previous chapter we studied NetBIOS, which historically has played a major
    role in Windows Networks. The release of Windows 2000, however, that started to
    change. From that moment on DNS started to gain importance; in fact, the latest
    versions of Windows don''t even need NetBIOS to operate in a network.


    When provisioning a Samba Active Directory domain, we can install an internal
    DNS server or use an existing Bind DNS server. In this chapter we''ll cover the
    following concepts:


    +   - Understanding and managing DNS for Samba 4 as an Active Directory DC.

    - DNS forwarding with the internal DNS server of Samba 4.


    We will also explore the following terms and utilities: samba-tool dns (with subcommands),
    smb.conf, dns forwarder, /etc/resolv.conf, dig, and host.


    # DNS


    As said before, when Microsoft released Windows 2000, it also began to switch
    from NetBIOS to DNS to allow every computer in a domain to locate the required
    resources. When provisioning the Active Directory domain, we can choose whether
    to install an internal DNS server (as we did), or use a Bind DNS server instead.


    If electing to use a Bind DNS server, we would have to choose in turn between
    using flat files or DLZ Bind. Bind stores the zone-related information in plain
    text files. These files can become very large in size and need to be loaded in
    RAM for Bind. On the other hand, DLZ uses a database to store zone data.'
  merge: -1
  pgno: 520
- img_proc: true
  md: '# CHAPTER 20 ACTIVE DIRECTORY NAME RESOLUTION


    Thus, Bind no longer needs to load all the zone information in RAM, as it will
    query the database to get the information it needs.


    If we have a Windows workstation in the domain, we can manage the DNS server with
    the administrative tools provided by Microsoft. On the other hand, we can also
    manage the DNS in Samba server itself by using samba-tool dns. For instance, we
