    When working with LDAP servers we''ll often have to work with LDIF files. LDIF
    is a text format designed to retrieve information from an LDAP server, as well
    as for updating it. In an LDIF file, we first identify the element we want to
    add, change, or otherwise work with. To uniquely identify an element, we use the
    distinguished name attribute (dn), which was created precisely for that purpose.
    The first line of our LDIF file could be something like this:


    ```

    dn: olcDatabase={2}hdb, cn=config

    ```


    Next, we specify if we want to add an attribute, modify, and so on:

    changeType: modifyfdn


