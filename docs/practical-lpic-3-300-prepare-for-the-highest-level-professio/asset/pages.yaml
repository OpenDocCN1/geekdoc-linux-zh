- img_proc: true
  md: '# CHAPTER 1


    # Starting with OpenLDAP


    This chapter doesn''t cover the topics you are supposed to be familiar with to
    apply for the LPIC-3 300 exam. Instead, it shows you how to perform a simple OpenLDAP
    installation that will be the base in the upcoming sections to study more advanced
    topics.


    If you are already familiar with OpenLDAP, feel free to skip this chapter and
    move on to the following chapters; if you''re not, though, this chapter will show
    you how easy it is to deploy an OpenLDAP server in CentOS 7.


    # The LDAP Protocol


    The Lightweight Directory Access Protocol (LDAP) is an open protocol for accessing
    distributed directory services over a network connection. It is closely related
    to the X.500 Directory Access Protocol (DAP). It follows some of the same rules,
    such as these:


    +   - An entry consists of a set of attributes.


    +   - Every attribute has a name and one or more values. The attributes are defined
    in the schema.


    +   - Each entry has a full path associated with it, the distinguished name (DN).
    Sometimes we can see the term relative distinguished name (RDN), too, which describes
    the partial path to an object relative to its parent. For instance, a DN could
    be cn=Antonio, ou=users, dc=linuxaholics, dc=com, the parent could be dc=linuxaholics,
    dc=com, and the RDN relative to its parent would be cn=Antonio.


    LDAP was designed to be a lightweight alternative to access directory services
    over Transmission Control Protocol/Internet Protocol (TCP/IP).'
