  md: '# CHAPTER 1 STARTING WITH OPENLDAP


    The client connects to the server, also called the Directory System Agent (DSA),
    in one of three possible ways:


    +   - Over the LDAP protocol using TCP port 389 by default.

    - Over the LDAPS protocol using TCP port 636 by default.

    - Using Unix Inter Process Communication (ldapi).


    The server offers the client access to the Global Catalog on port 3268 or port
    3269. These are the operations that the client can request:


    +   - Bind

    - SearchCompare

    - Add

    - Delete

    - Modify

    - Modify DN/RDNName

    - Abandon

    - Unbind

    - Extended


    # # The OpenLDAP Project


    OpenLDAP is a free, open source implementation of the LDAP protocol. It is included
    with most major Linux distributions, but it is a multiplatform software, and there
    are versions for Windows, Mac OS X, Solaris, and other operating systems.


    OpenLDAP has three main components:


    +   - slapd, which is the stand-alone LDAP server itself.

    - Libraries that implement the LDAP protocol.

    - Client software.


    In turn, when we talk about the stand-alone server (slapd), we must differentiate
    between a front end, which handles the network connections, and a back end, which'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# CHAPTER 1 STARTING WITH OPENLDAP


    deals with storage. In OpenLDAP the front end is the slapd binary, which will
    be running in the background as a service. For the back end, however, there are
    many options available. We’ll cover some of the most common.


    We divide the different back ends into three main groups: data storage back ends,
    proxy back ends, and dynamic back ends. In the first group we have back-bdb, the
    first transactional back end for OpenLDAP, built on Berkeley Database (Berkeley
    DB). This back end has been recently replaced by back-hdb, a variant of back-bdb
    that is hierarchical and supports renames. Another example of a back end is back-ldif,
    which uses LDAP Data Interchange Format (LDIF) as storage. The second group, the
    proxy back ends, consists of gateways to other data storage systems. For example,
    we could use back-ldap to proxy requests to another LDAP server. Finally, the
    third group doesn’t store any data or redirect requests to other systems. Instead
    generates data on the fly.


    In addition to the front/back end structure just outlined, OpenLDAP can use overlays,
    binary modules placed between the front end and the back end. Thus they can execute
    different actions regarding the request received by the front end or the information
    given by the back end. For instance, it can log access to the directory, replicate
    information, and so on. We’ll see some examples of overlays throughout the book.


    # Installing an OpenLDAP Server


    First, we have to install the packages openldap, openldap-servers, and openldap-clients.


    ```

    [root@alpha ~]# yum install -y openldap-servers openldap-clients

    ```


    That’s, now we have to fine-tune the installation according to our preferences
    and needs.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Customizing the Installation


    Once the server is installed, we have to generate a password for the admin user.
    In this example, we use a simple password: pass.


    ```

    [root@alpha ~]# slappasswd

    New password:

    Re-enter new password:

    {SHA|I/h5CtsNiF0F571TuKMNU0PgyKxCVG

    ```


    Formerly, there was a file named /etc/openldap/slapd.conf in the configuration
    of the OpenLDAP server was kept. Now, however, the configuration is kept in the
    LDAP database itself. Nevertheless, the relevant files we need to modify are still
    in /etc/openldap/slapd.d:


    ```

    [root@alpha ~]# ls /etc/openldap/slapd.d/

    cn=config cn-config.ldif

    ```


    We can either modify these files directly or use the ldapmodify command. For a
    beginner, it is easier to edit the files, but as the recommended way to use OpenLDAP
    is by using ldapmodify, this is what we''ll do. We will see in much more detail
    how to use ldapmodify in the upcoming sections; for now, just to initiate a working
    OpenLDAP installation, we''ll review the necessary steps briefly.


    # Modifying Objects


    As we already saw, OpenLDAP actually stores its information in back ends. One
    of the most used back ends has always been the Berkeley DB back ends, such as
    **bdb**, or the more recent **hdb**. In fact, the latter is the default back end
    used when we install the OpenLDAP binaries. The information stored in the hdb
    back end can be found in the /etc/openldap/slapd.d/cn=config/olcDatabase={2}hdb.ldif
    file.


    These are the contents of the /etc/openldap/slapd.d/cn=config/olcDatabase={2}hdb.ldif
    file after a fresh installation:


    ```

    # AUTO-GENERATED FILE - DO NOT EDIT!! Use ldapmodify.

    # CRC 32 373d43d6

    dn: olcDatabase={2}hdb

    ```'
