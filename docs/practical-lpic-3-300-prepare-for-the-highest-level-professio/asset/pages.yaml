  md: '# CHAPTER 6


    # OpenLDAP Server

    Performance Tuning


    We already have a working OpenLDAP infrastructure; however, if we don''t tune
    any of the default parameters in our OpenLDAP installation we might end up experiencing
    performance issues. We''ll have to measure how well our server performs and make
    the necessary adjustments to optimize performance.

    In this chapter we''ll cover the following concepts:


    +   - MeasuringOpenLDAP performance.

    - Tuning software configuration to increase performance.

    - Understanding indexes.


    We will also learn the following terms and utilities: index and DB_CONFIG.


    # Measure OpenLDAP Performance


    To measure the performance of a certain service, many applications, free as well
    as proprietary, have been developed through the years so that we can test web
    server performance, database server performance, and so on.


    However, as far as OpenLDAP is concerned, there aren''t many choices, but fortunately
    we can try some open source tools or create our own. In the previous we created
    a simple LDAP client in Python. We''ll make some minor changes to this client
    to measure the performance of our OpenLDAP server.'
  merge: -1
