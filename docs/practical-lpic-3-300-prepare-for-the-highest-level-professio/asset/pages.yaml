- img_proc: true
  md: '# CHAPTER 19 NETBIOS AND WINS


    According to the NetBIOS suffix used by the MicrosoftBIOS implementation, we have
    several record types for unique as well as for group names.

    These are the available record types for unique names:


    +   * 00 Workstation Service

    * 03 Windows Messenger Service

    * 06 Remote Access Service

    * 20 File Service

    * 21 Remote Access Service

    * 1B Domain Master Browser

    * 1D Master Browser


    These are the record types for group names:


    +   * 00 Workstation Service

    * 1C Domain Controllers

    * 1E Browser Service Elections


    As we can see, the computer JULIET_SERVER is a DC for MY_SAMBA_DOMAIN, stated
    by the NetBIOS group name 20. It is also the master browser and domain master
    browser for the domain.

    If we look at the NetBIOS associated with a workstation, we''ll see that there
    are fewer of them.


    ```

    C:\Users\john>nbtstat -a zulu


    Local Area Connection:

    Node IpAddress: [192.168.1.251] Scope Id: []

    ```


    | Name | Type | Status |

    |---|---|--|

    | ZULU2 | <20> UNIQUE | Registered |

    | ZULU2 | <00> UNIQUE | Registered |

    | MY_SAMBA_DOMAIN<00> | GROUP | Registered |'
  merge: -1
  pgno: 507
- img_proc: true
  md: 'MY_SAMBA_DOMAIN<1E> GROUP Registered


    MAC Address = 08-00-27-EF-24-D4


    Obviously in this case the workstation does not have the DC group name associated
    with it. We have seen in this example that the computer JULIET_SERVER, in addition
    to being a DC, also played the role of master browser and domain master browser.
    Let''s explore what this means.


    # Local Master Browser


    The local master browser, or simply master browser, is a computer that keeps a
    list of every server, workstation, and service available in the network. This
    role is dynamically assigned to one of the computers in the network segment. However,
    we can influence this election process by tuning parameters in the smb.conf file:


    +   - local master = yes: By adding this line to the smb.conf file we tell our
    Samba server to try and become the local master browser in its network segment.

    - preferred local master = yes: This will give the Samba server a higher preference
    when trying to become the master browser.

    - os level = 255: The higher this value, the higher the chance to become the master
    browser. If we want to make sure that our Samba server wins every election, we
    can assign the value 255 to this parameter.


    # Domain Master Browser


    If the computers in our domain span across different subnets, to be able to browse
    every domain member we need to have in each subnet a domain master. In the previous
    section we saw how to make our Samba server the local master browser in its network
    segment, simply adding a few parameters to the smb.conf file. To make it a domain
    master browser, too, we just need to add a new line to the smb.conf file: domain
    master = yes.'
  merge: -1
  pgno: 508
- img_proc: true
  md: 'CHAPTER 19 NETBIOS AND WINS


    # # NetBIOS Names and Samba


    We can look up NetBIOS names from a Linux computer similar to what we had done
    previously with Windows. To do this, we''ll use the nmblookup tool, included in
    the samba-client software package. For example, we might want to know which computer
    is the local master browser by using the -M parameter.


    ```

    [root@kilo ~]# nmblookup -M MY_SAMBA_DOMAIN

    192.168.1.226 MY_SAMBA_DOMAIN<1d>

    ```


    We can also query for the location of the DCs. In this case we need to specify
    the name of the domain and the appropriate suffix, 1c in this case for DCs.


    ```

    [root@kilo ~]# nmblookup ''MY_SAMBA_DOMAIN#1C''

    192.168.1.226 MY_SAMBA_DOMAIN<1c>

    ```


    If we want to query the computers that can work as workstations, we can do it
    in a similar way, using the suffix 00 instead.


    ```

    [root@~ #]# nmblookup ''MY_SAMBA_DOMAIN#00''

    192.168.1.251 MY_SAMBA_DOMAIN<00>

    192.168.1.226 MY_SAMBA_DOMAIN<00>

    ```


    We have seen that besides the smbd service, there is also an nmbd service that
    is in charge of the NetBIOS naming services. In the examples we''ve seen, we performed
    the queries from the BDC computer, kilo.linuxaholics.com, but we didn''t see any
    NetBIOS name associated with the BDC itself. This happened because we didn''t
    start the nmbd service. If we start and repeat the result will be different.


    ```

    [root@kilo ~]# systemctl start nmbd

    [root@kilo ~]# nmblookup ''MY_SAMBA_DOMAIN#1c''

    192.168.1.236 MY_SAMBA_DOMAIN<1c>

    192.168.1.226 MY_SAMBA_DOMAIN<1c>

    ```


    Now nmblookup was able to locate two DCs, the PDC and the BDC. We can resolve
    the NetBIOS names from an IP address.'
  merge: -1
  pgno: 509
