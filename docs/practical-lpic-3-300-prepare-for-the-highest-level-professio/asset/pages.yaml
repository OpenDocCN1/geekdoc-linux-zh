    # Configure NSS to Retrieve Information from LDAP


    NSS is an interface provided in Unix-like systems that allows us to configure
    several authentication mechanisms and name resolution. Most Linux administrators
    become familiar with NSS and its configuration file /etc/nsswitch.conf when setting
    up resolution.


    In the /etc/nsswitch.conf file we can see the following lines:


    ```

    #

    # /etc/nsswitch.conf

    #

    # An example Name Service Switch config file. This file should be

    # sorted with the most-used services at the beginning.

    #

    ```


    ```

    hosts: files dns

    ```


    According to the hosts line, when the computer needs to resolve the name of a
    host it will look up it in the /etc/hosts file, and only if it can''t find the
    name there it will query the DNS server. This behavior could be changed by editing
    the file. For example, if we change the hosts line deleting the word files, the
    computer will always query the DNS server, ignoring the contents of the /etc/hosts
    file.


    110'
