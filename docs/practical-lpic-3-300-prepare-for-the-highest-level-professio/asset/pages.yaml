    \ = FILE:/var/log/krb5kdc.log\nadmin_server = FILE:/var/log/kadmind.log\n\n[libdefaults]\n\
    default_realm = LINUXAHOLICS.LOCAL\ndns_lookup_realm = false\ndns_lookup_kdc =\
    \ true\rndns = false\nticket_lifetime = 24h\nforwardable = yes\ndefault_ccache_name\
    \ = KEYRING:persistent:%{uid}\n\n[realms]\nLINUXAHOLICS.LOCAL = {\nkdc = quebec.linuxaholics.local:88\n\
    master_kdc = quebec.linuxaholics.local:88\nadmin_server = quebec.linuxaholics.local:749\n\
    default_domain = linuxaholics.local\n}\n\n[domain realm]\n.linuxaholics.local\
