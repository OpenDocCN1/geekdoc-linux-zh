  md: '# CHAPTER 15


    # Samba as a PDC and BDC


    Until now we have configured Samba as a stand-alone server, but Samba can also
    be configured to work in a domain, similar to what happens with a Windows server.
    Samba can act as a domain controller (DC) either in an NT-like domain or in an
    Active Directory domain. It can also integrate as a member server in both environments.
    In this chapter and the next one we will see the different roles Samba server
    can assume in an NT-like domain. We''ll cover the following concepts in this chapter:


    +   * Understanding and configuring domain membership and trust relationships.

    * Creating and maintaining a PDC with Samba 3 and Samba 4.

    * Creating and maintaining a BDC with Samba 3 and Samba 4.

    * Adding computers to an existing domain.

    * Configuring logon scripts.

    * Configuring roaming profiles.

    * Configuring system policies.


    We will also learn about the following terms and utilities: smb.conf, security
    mode, server role, domain logons, domain master, logon script, logon path, NTConfig.pol,
    net, profiles, add machine script, and profile acls.


    # Windows Domains


    A Windows domain is a group of network resources such as users and computers that
    are organized according to a centralized security database, as opposed to workgroups,
    in which every computer holds its own security database. The server, or servers,
    on which this database is located are called domain controllers.'
  merge: -1
  pgno: 402
- img_proc: true
  md: '# CHAPTER 15 SAMBA AS A PDC AND BDC


    Formerly, in Windows NT, there could be two types of DCs: PDC and BDCs, the difference
    being that the PDC could modify and update the information in the database, whereas
    the BDC had a read-only copy of that same database.


    # Trust Relationships


    Given two domains DomainA and DomainB, if a user from DomainA wants to access
    resources from DomainB, that user will need to validate again, providing valid
    credentials in DomainB. However, there is a way to avoid this by establishing
    a trust relationship. If DomainB trusts DomainA, then users in DomainA can access
    resources in DomainB without having to authenticate again. These trust relationships
    are unidirectional, so DomainA won''t trust DomainB unless we specifically create
    another trust relationship.


    # Creating a Samba PDC


    Since Samba 3, it is possible to set up a Samba server as a PDC. For that purpose,
    we need to modify some of parameters in the /etc/samba/smb.conf file, assuming
    we have already installed the Samba server binaries.


    First, we assign a name to the domain by editing the workgroup parameter.


    ```

    workgroup = MY_SAMBA_DOMAIN

    ```


    There are a series of additional changes needed to successfully set up a PDC.
    We have to set the security parameter to user.


    ```

    security = user

    ```


    In turn, the passdb backend must be set to either tdbsam or ldapsam; for simplicity,
    we''ll set it to tdsbam so that no additional configuration is required.


    ```

    passdb backend = tdbsam

    ```


    In every Windows domain there should be a domain master browser. As the Samba
    server will be the first server in the domain, we configure it as a domain master
    browser.


    ```

    domain master = yes

    ```'
  merge: -1
  pgno: 403
