    # Microsoft Privileges Attribute Certificates


    We have seen before that Microsoft has extended the functionality of the Kerberos
    protocol. One of the ways it has done this is by implementing Microsoft PAC. These
    certificates are used to encode authorization information, and they also contain
    memberships, additional credential information, profile and policy information,
    and related metadata.


    If we paid careful attention when executing ipa-adstrust-install, in one of the
    steps we could see:


    ```

    [16/19]: restarting Directory Server to take MS PAC and LDAP plugins changes into
    account

    ```


    FreeIPA uses plug-ins as well as Samba components to interact with MS PAC. We
    could see an interactive example by executing the net command with the following
    set of parameters.'
