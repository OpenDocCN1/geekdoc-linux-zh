- img_proc: true
  md: '# CHAPTER 2


    # Securing the Directory


    In this chapter, we''ll see how to secure our OpenLDAP server. We''ll encrypt
    the communication between client and server with Transport Layer Security (TLS).
    Configuration of the firewall to permit access and use of different authentication
    methods is also addressed.


    This chapter covers the following concepts:


    +   - Securing the directory with Secure Sockets Layer (SSL) and TLS.

    - Firewall considerations.

    - Unauthenticated access methods.

    - User/password authentication methods.

    - Maintenance of Simple Authentication and Security Layer (SASL) user database.

    - Client/server certificates.


    We will also be introduced to the following terms: SSL/TLS, Security Strength
    Factors (SSF), SASL, proxy authorization, StartTLS, iptables.


    # Securing LDAP Connections with TLS


    By default, when LDAP connections, all information is sent in plain text. There''s
    no need to insist again on the importance of ciphering all traffic transmitted
    between the client and the server. To achieve this goal, we can use the SSL or
    TLS protocols.


    SSL and its successor TLS were designed to allow for secure communications on
    the Internet. They provide privacy by encrypting transmitted data through the
    use of symmetric cryptography. They can also authenticate the server, the client,
    or both using public key cryptography. Finally, these protocols provide integrity
    through the use of a message integrity check with each message.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# CHAPTER 2 SECURING THE DIRECTORY


    Both SSL and TLS can be used to secure communications. However, as the SSL protocol
    has many known vulnerabilities, it is advisable to use its successor, the TLS
    protocol.


    LDAP, and many other protocols such as Hypertext Transfer Protocol (HTTP) or Simple
    Mail Transfer Protocol (SMTP), can communicate in a secure way (by using TLS),
    as well as an insecure way, so server and client need to agree whether to establish
    a secure connection or not. The typical way to achieve this is by using different
    numbers for secure and insecure connections, but it is also possible to use the
    same number for both. In this case, when the clients want to set up a TLS connection
    it sends a STARTTLS request.


    STARTTLS is an extension to plain text protocols that allows for the encryption
    of the communication using the same port number as the standard, nonencrypted
    version of the protocol. For that purpose, many protocols such as SMTP, FTP, and
    LDAP use the STARTTLS.


    TLS relies on the use of X.509 certificates to carry the server identity, so we''ll
    need a server certificate. In addition, depending on how we configure our system,
    we might need a client certificate. We''ll see some examples of this later in
    this book.


    We are all familiar with certificates used by well-known e-commerce sites, these
    certificates are signed by a trusted certification authority (CA). In our case,
    we are going to create our own CA and we will sign our own certificates to use
    them with LDAP. To do this, we begin by installing the openssl package, unless
    it is already installed.


    ```

    [root@alpha ~]# yum install openssl

    ```


    # Preparing the Environment


    It is very important that every computer involved is to resolve server names accordingly.
    In our example, the server name is alpha.linuxaholics.com and the associated IP
    address is 192.168.1.229. If we use a Domain Name System (DNS) server in our infrastructure
    we should add the corresponding A and PTR records. However, if we''re working
    in a lab environment without a DNS server, we could simply edit the /etc/hosts
    file for every computer involved in the process. To edit the file, we could use'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'one of the many editors available in Linux, such as vi, vim, nano, and so on.
    The content of the file should be similar to this:


    ```

    [root@alpha ~]# cat /etc/hosts

    127.0.0.1    localhost localhost.localdomain localhost4 localhost4.localdomain4

    ::1            localhost localhost.localdomain localhost6 localhost6.localdomain6

    192.168.1.229    alpha.linuxolics

    ```


    If the hostname or the IP of the server differs, we should edit the file accordingly.
    The hostname can be easily set with the hostnamectl command like this:


    ```

    [root@alpha ~]# hostnamectl set-hostname alpha.linuxolics

    ```


    # Creating a CA and a Server Certificate


    After installing the openssl package, we should have a predefined tree structure
    under /etc/pki/CA.


    ```

    [root@alpha ~]# cd /etc/pki/CA/

    [root@alpha CA]# ls -l

    drwxr-xr-x. 2 root root 4096 abr 11 2018 certs

    drwxr-xr-x. 2 root root 6 abr 11 2018 crl

    drwxr-xr-x. 2 root root 45 abr 11 2018 newcerts

    drwx------. 2 root root 4096 abr 11 2018 private

    ```


    To track the issued certificates we create an index.txt and serial files. When
    creating the serial file, we should pay attention to the leading zeros.


    ```

    [root@alpha CA]# touch index.txt

    [root@alpha CA]# echo 0001 > serial

    ```


    Now we create the key for the CA. We''ll set a password for that key, otherwise
    we will get an error:


    ```

    [root@alpha CA]# openssl genrsa -aes256 -out /etc/pki/CA/private/ca.pem

    Generating RSA private key, 1024 bit long modulus

    ......................++++

    ++++++++

    ```


    e is 65537 (0x10001)'
