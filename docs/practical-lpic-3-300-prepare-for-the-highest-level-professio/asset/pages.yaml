  md: '# CHAPTER 15 SAMBA AS A PDC AND BDC


    We have seen many examples of creating shares thus far, so we we won''t get into
    too much detail. The share definition should be something like this.


    [Soft]


    ```

    path =/soft

    read only = Yes

    valid users = @WinUsers

    ```


    We share the content of the /soft folder, allowing only read access. The only
    users able to access the share will be included in the WinUsers group.


    We create the folder and assign the right permissions and context with chon and
    semanage. To use manageable we will install the policycoreutils-python package
    first.


    ```

    [root@juliet ~]# mkdir /soft

    ```


    ```

    [root@juliet ~]# ls -Ld /soft

    drwx-xr-x. root root unconfined:u:object:default_t:s0 /soft

    ```


    ```

    [root@juliet ~]# chcon -t samba_share_t /soft/

    [root@juliet ~]# semanage fcontext -a -t samba_share_t "//(.*)"

