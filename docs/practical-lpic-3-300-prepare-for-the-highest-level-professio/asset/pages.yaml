- img_proc: true
  md: '# Samba Services and Components


    Samba is composed of many services:


    +   - The smbd service is responsible for providing file sharing and printing
    services to clients using the SMB/CIFS protocol.

    - The nmbd service provides name services based on NetBIOS.

    - Finally, the winbindd service is used when we need to get information from Windows
    servers in a way that can be understood by Linux. This service is not included
    in a standard Samba installation, and if we need it we must install the samba-winbindd
    package with yum.


    To fully understand what Samba is, we need to be familiar with Windows networking.
    Microsoft developed the SMB protocol, later renamed CIFS, as a way to share resources
    in a network. Through the years the protocol has undergone many changes. Initially,
    it was developed at IBM with the goal of turning the DOS application programming
    interface (API) local access into a networked file system. Later, Microsoft added
    many changes to the protocol and merged it with the LAN Manager protocol. Microsoft
    continued adding features to the protocol when it was released with Windows Workgroups.
    Samba was originally designed to run on top of the NetBIOS API, but since Windows
    2000 it runs by default on top of TCP.


    This first version of the protocol (SMB 1.0) was very “noisy” and thus it made
    an inefficient use of network resources. Microsoft therefore worked hard to make
    a new version of the protocol (SMB 2.0) less noisy. This new version appeared
    with Windows Vista by the end of 2006. Besides the improvement in performance,
    SMB 2.0 also included support for symbolic links, as well as the caching of file
    properties and better scalability, increasing the number of users, shares, and
    open files per server.


    A minor upgrade of the protocol, SMB 2.1, was introduced by Microsoft with Windows
    Server 2008 R2. It included some minor performance improvements. With the release
    of Windows 8 and Windows 2016, however, a major overhaul of the protocol (SMB
    3.0) took place, adding new functionalities and improving overall performance.
    It also added several security features.


    According to the role computer plays in the network, we can divide them into different
    groups. The simplest classification would be to divide the computers between servers
    and clients. Of course, the servers are those that provide shared resources to
    the rest of the computers.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# CHAPTER 8 SAMBA CONCEPTS AND ARCHITECTURE, CONFIGURING SAMBA, AND INTERNATIONALIZATION


    There are also many other things to take into account, however. For instance,
    a network could consist of two or three independent computers, which use the same
    network; each one of them manages its own local users, though. In this case we
    have a workgroup. On the other hand, if we have more computers, perhaps tens,
    hundreds, or even more, it would be a nightmare to manage the users locally in
    each computer. It would be far more efficient to have a server where all the user
    accounts are stored; the server is called the domain server. In this case we have
    a domain instead of a workgroup.


    Considering the fact that we might be working in a workgroup or a domain, we have
    different names for our servers depending on their role in the network. If we''re
    working in a workgroup the Samba server will be a stand-alone server. On the other
    hand, if a Samba server is added to a domain, then the Samba server will be a
    domain member server. This server will be able to get the user list from the domain
    by querying the domain controllers, but it won''t keep a copy of the domain users.
    Finally, we could decide to make our Samba Active Directory domain controller.


    # Ports Used


    The smbd service by default lists on ports TCP 445 and 139. On the other hand,
    the nmbd service listens on ports UDP 137 and 138.


    ```

    [root@hotel ~#] ss -l -tn -p | grep smbd

