  md: '# CHAPTER 10 FILE SERVICES IN SAMBA


    The valid users parameter tells Samba who is allowed to access this share; here
    we can specify usernames or groups. If this parameter is not set, then everybody
    can access the share. In the [homes] share the line valid users = %S,%%w%S means
    that every user can access his or her own home directory. There is a similar parameter
    invalid users that works exactly the opposite way: It states users are not allowed
    to access the share.


    The browseable parameter specifies whether the folder is visible to everybody
    or not. In the case of [homes] share this parameter has been set to no, and no
    one will see other users'' home directories.


    Finally, we have the inherit acls parameter, the meaning of which is also self-explanatory.
    We''ll see more details about ACLs in the next chapter.

    Let''s take a look now at the share we created.


    ```

    [Docs]

    comment = Public documents

    path = /shared_docs

    public = yes

    writable = yes

    ```


    We didn''t specify the value of the browseable parameter, but it takes the default
    value of yes. In this case, then the share is browseable, as we can see in Figure
    10-1. If we change the value of the browseable parameter to no and we restart
    the SMB service, we''ll see that we don''t see it anymore (Figure 10-3).'
