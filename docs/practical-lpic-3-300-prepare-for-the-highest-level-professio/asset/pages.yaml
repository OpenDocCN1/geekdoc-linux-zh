    # Securing the Connections


    When using an LDAP server as a back end, the Samba server needs to communicate

    with the LDAP server. This communication can be encrypted or unencrypted. This

    behavior can be determined by a series of configuration parameters. If we don''t
    want the

    communication to be secured, we should make sure that these two parameters apply
    to

    our Samba configuration file:


    ```

    ldap ssl = Off

    tls enabled = No

    ```


    Note Depending on the exact version of the Samba software installed, the

    corresponding default values for a certain parameter might differ. We can see
    the

    default values that apply to our installation with the command testparam -sv.'
