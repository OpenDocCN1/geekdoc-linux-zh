    # Access Control: Privileges and Roles


    Access control determines who can access certain resources and what they are allowed
    to do. FreeIPA divides access control rules into three types:


    +   * **Self-service rules:** These rules define what users can perform on their
    own entry, allowing only editing attributes within the entry.

    * **Delegation rules:** These rules allow certain users or groups to perform operations
    on specific attributes for other users or groups.

    * **Role-based access control:** These are special access control groups that
    can be granted much more versatility to modify different entities in the domain.'
  merge: -1
