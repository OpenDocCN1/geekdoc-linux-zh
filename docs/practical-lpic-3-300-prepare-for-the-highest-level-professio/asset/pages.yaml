- img_proc: true
  md: '# CHAPTER 12 PRINT SERVICES


    We have connected to the local CUPS server installed in the Samba server itself,
    but we could also connect with any other CUPS server with the cups server option.
    There is also a connection timeout parameter that specifies the number of seconds
    Samba will wait when trying to contact the CUPS server. This value is 30 seconds
    by default, but it could be adjusted according to our preferences. By default,
    the connection between CUPS and Samba is not encrypted, but it can be encrypted
    by specifying the cups encrypt = yes option.


    # Spoolss


    We can activate the disable spoolss parameter so that Samba will behave as a Samba
    2.0 server. This change also disables the ability to upload drivers to a Samba
    server, something we will see in greater detail later. This parameter rarely be
    used, and its default value is no. There is also an inverted equivalent parameter
    called enable spoolss that can be used exactly the same way.


    # Customizing Printing Options


    If we want to, we can provide the specific command we want to use when printing
    a job with the print command option. Let''s look at an example.


    We''ll start by defining a new Samba printer. On this occasion we are not going
    to use a real printer, but a dummy text printer instead.


    ```

    comment = Generic text printer

    path = /var/ spool/samba

    guest ok = yes

    printable = Yes

    print command = echo Printing %s /tmp/print.log;

    cp %s /tmp; rm %s

    ```


    We have already learned about the first parameters. In the fifth one we write
    a simple log and copy the job file to tmp. After we delete the file from the spool.
    However, we should take into account one more thing. By default, our Samba server
    has the printing = CUPS option set. When this happens, the print jobs are managed
    by the CUPS API and by manually modified print command is ignored. To avoid this
    behavior,


    343'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# CHAPTER 12 PRINT SERVICES


    we''ll define a new printing parameter only for our new Samba printer. The complete
    share definition will be this:


    ```

    [Text_Printer]

    printing = BSD

    comment = Generic text printer

    path = /var/spool/samba

    guest ok = yes

    printable = Yes

    print command = echo Printing %s >> /tmp/print.log; cp %s /tmp

    ```


    After reloading the Samba configuration, if we send a print job to the new printer
    we''ll see the corresponding line in /tmp/print.log and the file copied to /tmp.


    ```

    [root@hotel ~]# cat /tmp/print.log

    Printing smprn.ev7Bmh

    ```


    ```

    [root@hotel ~]# ls /tmp/

    sks-script-97bPGr smprn.ev7Bmh smprn.ev7Bmh systemd-private-wy5MyZnprint.log systemd-private-RqlXF8
    yum.log

    ```


    Besides all these options defined in the global section we can also apply some
    other options to a single printer. For example, if we execute the lpoptions command
    we can see the default options of a given printer.


    ```

    [root@hotel ~]# lpoptions -d printer_Canon -l

    PageSize/Media Size: Letter Legal Executive Tabloid A3 *A4 A5 B5 EnvISO5

    Env10 EnvCS EnvDL EnvMonarch

    InputSlot/Media Source: *Default Upper Manual

    Duplex/2-Sided Printing: *None DuplexNoTumble DuplexTumble

    Option1/Duplex: *False True

    ```


    By using the cups options parameter at a share definition we can customize the
    default printing options for any given printer.'
