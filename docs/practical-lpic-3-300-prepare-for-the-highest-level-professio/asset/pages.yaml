    # Single Sign-on (SSO)


    Single sign-on (SSO) is an authentication procedure that grants or denies access
    to a series of related but independent software systems. The obvious advantage
    is that the users don''t need to authenticate against each and every software
    system they connect to; instead they authenticate against a common centralized
    authentication server.


    One of the most used SSO implementations is based on the use of Kerberos. After
    being granted a TGT, the user will be able to access any Kerized application without
    needing to reauthenticate.


    # Integrating OpenLDAP and Active Directory


    In the first chapter of this book we saw that OpenLDAP is a free implementation
    of the LDAP protocol. There are, however, many other implementations, both free
    and commercial. One of these is Microsoft Active Directory'
