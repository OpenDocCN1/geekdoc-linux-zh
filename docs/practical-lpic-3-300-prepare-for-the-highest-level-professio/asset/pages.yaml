  md: "# CHAPTER 9 REGULAR SAMBA MAINTENANCE AND TROUBLESHOOTING\n\nTo restore the\
    \ file, we need to dump the contents of the backup with the tdbdump command.\n\
    \n```\n[root@hotel ~]# cd /var/lib/samba/private/\n[root@hotel private]# cp /samba.bk/180912/passdb.tdb.bak\n\
    [root@hotel private]# tdbdump passdb.tdb.bak > dumpfile\n```\n\nOnce we have dumped\
    \ the contents of the backup file, we can then restore it. We delete the dummy\
    \ passdb.tdb file that was re-created when restarting the SMB service and execute\
    \ the tdbstore command.\n\n```\n[root@hotel private]# rm passdb.tdb\nrm: remove\
    \ regular file 'passdb.tdb?' y\n[root@hotel private]# tdbstore passdb.tdb < dumpfile\n\
    [root@hotel private]# ls\ndumpfile msg.sock passdb passdb.tdb.bak secrets.tdb\n\
