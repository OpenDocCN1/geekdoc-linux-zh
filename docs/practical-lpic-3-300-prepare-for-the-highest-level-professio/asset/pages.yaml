  md: '# CHAPTER 17


    # Samba 4 as an AD Compatible Domain Controller


    In Chapters 15 and 16, we configured a Samba domain for the first time, an NT-like
    Samba domain to be exact. Samba 3 and earlier versions could only implement NT-like
    domains, but not an Active Directory domain. All this changed when Samba 4 was
    released. Samba 4 can effectively work as an Active Directory DC, implementing
    all the necessary services. In this chapter we''ll cover the following concepts:


    +   * Setting up a new Active Directory domain using Samba.

    * Adding a Samba DC to an existing Active Directory domain.

    * Understanding and managing flexible single master operation (FSMO) roles.

    * Verifying Active Directory replication.

    * Configuring SYSVOL replication using rsync or robocopy.

    * Configuring and testing Samba 4 as an Active Directory DC.

    * Backing up and restoring an Active Directory DC.

    * Understanding backup and recovery strategies for Active Directory DCs.

    * Understanding the impact of virtualization on Active Directory DCs.

    * Understanding and configuring Active Directory sites, including subnet assignments.'
  merge: -1
  pgno: 436
- img_proc: true
  md: 'CHAPTER 17 SAMBA 4 AS AN AD COMPATIBLE DOMAIN CONTROLLER


    +   - Using smbclient to confirm Active Directory operation.


    +   - Understanding how Samba integrates with Active Directory services:

    DNS, Kerberos, NTP, and LDAP.


    We will also learn about following terms and utilities: smb.conf, server role,
    and samba-tool (with subcommands).


    # Installing a Samba Active Directory Domain Controller


    Creating an Active Directory DC implies that we need to have many different services
    (DNS, Kerberos, LDAP, etc.) working in perfect coordination. Luckily the Samba
    team has done a great job in easing this, but it is not simple yet. We''ll see
    now the detailed instructions to provision a Samba Active Directory DC.


    # Preparing the System


    According to the official Samba documentation, there are a few steps we must complete
    before installing an Active Directory domain controller in Samba.


    We need a DNS domain for the Active Directory forest; in our case it will be linuxaholics.com.
    In addition, the server needs a static IP address.


    We also have to make sure that the /etc/resolv.conf file is not updated by any
    process, so we stop and disable the NetworkManager service.


    ```

    [root@mike ~]# systemctl stop NetworkManager

    [root@mike ~]# systemctl disable NetworkManager

    rm /etc/systemd/system/multi-user.target.wants/NetworkManager.service

    rm /etc/systemd/system/dbus-org.freedesktop.NetworkManager.service

    rm /etc/systemd/system/dbus-org.freedesktop.nm-dispatcher.service''

    ```


    We also have to sure that none of the Samba services—that is smbd, nmbd, and winbind—are
    enabled and running. If they are, we have to stop them now.


    We check that the /etc/hosts file has the corresponding entries for the FQDN,
    as well as the short name of the future DC.'
  merge: -1
  pgno: 437
