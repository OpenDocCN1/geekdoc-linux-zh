  md: '# CHAPTER 8 SAMBA CONCEPTS AND ARCHITECTURE, CONFIGURING SAMBA, AND INTERNATIONALIZATION


    options:


    +   -L local mode (must be first option)


    extra options when run by root or in local mode:


    +   -W use stdin ldap admin password

    -w PASSWORD ldap admin password


    In addition to storing the password, we need to specify the admin DN in smb.conf.

    In fact, if we execute smbpasswd -L -w admin_password before doing it, we''ll
    get this message:


    ```

    [root@hotel ~]# smbpasswd -L -w admin admin

    ERROR: ''ldap admin dn'' not defined! Please check your smb.conf

    ```


    So we get back to /etc/samba/smb.conf and add the new parameter.


    ```

    security = user

    passdb backend = ldapsam:"ldap://alpha.linuxaholics.com"

    ldap admin dn = cn=admin,dc=linuxaholics,dc=com

    ```


    Now we can store the password in secrets.tdb.


    ```

    [root@hotel ~]# smbpasswd -L -w admin

    Setting stored password for "cn=admin,dc=linuxaholics,dc=com" in secrets.tdb

    ```


    We''re almost there, but there is still something to fix before the SMB service
    starts correctly. If we start it now, we''ll get the following errors:


    ```

    [root@hotel ~]# systemctl restart smb

    Job for smb.service failed. See ''systemctl status smb.service'' and

    ''journalctl -xe'' for details.

    ```'
