    # Understand User and Group Mapping


    We have already created Samba users with smbpasswd, pdbedit, or both. In cases,
    however, we should have created the corresponding Linux user first. That is, there
    is a mapping between the Linux user and the Samba user. By default, a stand-alone
    Samba server maps any Samba user with the corresponding Linux user of the same
    name. For instance, the Samba user avazquez is mapped to the Linux user avazquez.
    We can customize the mapping, though, by editing the /etc/samba/smb.conf file.'
