  md: '# CHAPTER 4


    # Integrating LDAP with Active Directory and Kerberos


    In today''s heterogeneous networks, the use of different operating systems in
    the network is increasingly common. In such environments integrating the different
    systems can be a real challenge. Fortunately, there are many solutions available
    that allow different systems to work effectively in a cooperative manner.


    In this chapter we''ll cover the following concepts:


    +   * Kerberos integration with LDAP.

    * Cross-platform authentication.

    * Single sign-on concepts.

    * Integration between OpenLDAP and Active Directory.


    We will explore the following terms and utilities: Kerberos, Active Directory,
    single sign-on, and DNS.


    # Kerberos


    Kerberos is a computer network authentication protocol that provides a secure
    authentication mechanism. It works by using tickets. The client authenticates
    to the authentication server (AS), which forwards the request to a key distribution
    center (KDC). The KDC, in turn, issues a ticket-granting ticket (TGT), as shown
    in Figure 4-1.'
  merge: -1
  pgno: 139
- img_proc: true
  md: '![](img/dfa44432604022575079471b648e25ca_140_0.png)


    **Figure 4-1.** Kerberos authentication: Getting a TGT


    When the client needs to access a service in a different node (or principal in
    Kerberos jargon), it sends the TGT and the ID of the requested service to the
    ticket-grantsing server (TGS), which is usually the KDC, too. The KDC then sends
    a ticket-granting service to the client, which can be used to access the service
    (Figure 4-2).'
  merge: -1
  pgno: 140
- img_proc: true
  md: '![](img/dfa44432604022575079471b648e25ca_141_0.png)


    **Figure 4-2.** Kerberos authentication: Using a TGS to access a service


