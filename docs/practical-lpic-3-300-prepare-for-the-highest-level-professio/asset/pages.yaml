  md: '# DB_CONFIG


    After a fresh installation of OpenLDAP if we take a look at the system log (the
    systemd-journal in CentOS 7), we can see the following message:


    Sep 24 00:13:22 foxtrot.linuxaholics.com slapd[21412]: hdb_db_open:

    warning - no DB_CONFIG found in directory /var/lib/ldap: (2).

    Expect poor performance for suffix "dc-linuxaholics,dc=com".


    We already mentioned briefly that OpenLDAP stores data in a back end. The storage
    back end can be changed by the admin, but by default it is the Berkeley HDB. There
    are many options we can use to fine tune the behavior of this back end, and this
    can be done by modifying the DB_CONFIG file.


    By default, there is no DB_CONFIG file in the OpenLDAP installation directory,
    but there is a sample DB_CONFIG file in /usr/share/openldap-servers/DB_CONFIG.example.

    [root]@centos7-lpi3]# cat /usr/share/openldap-servers/DB_CONFIG.example

    $OpenLDAP


    +   # Example DB_CONFIG file for use with slapd(8) BDB/HDB databases.

    # See the Oracle Berkeley DB documentation

    # <http://www.oracle.com/technology/documentation/berkeley-db/db/ref/env/db_config.html>

    # for detailed description of DB_CONFIG syntax and semantics.

    # Hints can also be found in the OpenLDAP Software FAQ

    # <http://www.openldap.org/faq/index.cgi?file=2>

    # in particular:

    # <http://www.openldap.org/faq/index.cgi?file=1075>

    # Note: most DB_CONFIG settings will take effect only upon rebuilding

    # the DB environment.


    # one 0.25 GB cache

    set_cacheize 0 268435456 1


    # Data Directory

