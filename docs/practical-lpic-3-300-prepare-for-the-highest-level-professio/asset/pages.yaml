    In this case of an anonymous authentication mechanism, the user and the password
    we provide both empty strings. Here''s an example:


    ```

    root@alpha ld]# ldapsearch -x -b "cn=Tux,ou=users,dc=linuxaholics,

    dc=com" -D "" -W """

    # extended LDIF

