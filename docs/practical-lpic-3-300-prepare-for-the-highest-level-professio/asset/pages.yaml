    - Knowledge of Samba server configuration file structure.

    - Knowledge of Samba server registry-based configuration.

    - Troubleshooting and debuggin configuration problems with Samba.

    - Understanding internationalization character codes and pages.


    We will also encounter the following terms and utilities: /etc/services, Samba
    services (smbd, nmbd, winbind), smb.conf, smb.conf parameters, smb.conf variables,
