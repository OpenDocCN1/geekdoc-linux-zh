  md: '# CHAPTER 11 LINUX FILE SYSTEM AND SHARE AND SERVICE PERMISSIONS


    As we have seen so far, traditional permissions in Linux are limited to three
    different groups: the owner user, the owner group, and the rest of the users.
    It is not possible to assign specific permissions to single users and groups.
    To fill this gap, modern Linux systems use access lists. Access lists give us
    a finer level of control over the permissions. Right after creating a file we
    can get its associated access list with the getfacl command.


    ```

    [root@bravo avazquez]# getfacl example.txt

    # file: example.txt

    # owner: avazquez

    # group: avazquez

    user::rw-

    group::r--

    other::r--

    ```


    At first, the access list only has three entries, for each classical set of permissions:
    owner, group, and other. However, by using the setfacl command we can grant permissions
    to any existing user or group. Let’s look at example:


    ```

    [root@bravo avazquez]# setfacl -m u:rrey:rw example.txt

    [root@bravo avazquez]# getfacl example.txt

    # file: example.txt

    # owner: avazquez

    # group: avazquez

    user::rw-

    user:rrey:rw-

    group::r--

    mask::rw-

    other::r--

    ```


    We’re saying that we want to modify (-m) the access list associated with the example.txt
    file, by granting the user (-u) rrey read and write (rw) permissions.


    # Linux File System Permissions and Samba


    Obviously, as Samba executes on top of the Linux file system, it relies on Linux
    system permissions to work properly. For instance, if we want a file to be executable
    from Samba it will need to be executable at the file system level. Once we take
    into account'
