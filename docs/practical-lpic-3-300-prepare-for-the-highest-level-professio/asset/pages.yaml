  md: '# CHAPTER 18 CONFIGURING SAMBA AS A DOMAIN MEMBER SERVER IN AN EXISTING ACTIVE
    DIRECTORY DOMAIN


    Now we need to edit the Samba configuration file located at /usr/local/samba/etc/smb.conf.
    If at any point we don''t know what the current configuration is, we can check
    it by invoking the Samba service with the -b parameter.


    ```

    [root@oscar ~# /usr/local/samba/sbin/smbd -b |grep CONFIGFILE

    CONFIGFILE=/usr/local/samba/etc/smb.conf

    ```


    By default, the file does not exist yet, so we''ll create it and add the following
    lines:


    ```

    [global]

    security = ADS

    workgroup = LINUXAHOLICS

    realm = LINUXAHOLICS.COM


    log file = /var/log/samba/%m.log

    log level = 1

    ```


    The first lines are self-explanatory: We type the names of the workgroup and the
    realm and we tell the server that is part of an Active Directory domain and thus
    all information concerning users and groups should be obtained from Active Directory.
    We also define a log file and assign it to a level.


    We already know that every user in a Linux system, whether it is a local user,
    an LDAP user and so on, is assigned an ID by the system to uniquely identify it.
    Usually system users and groups are assigned IDs in the range of 0 to 999, and
    local users and groups are assigned IDs starting from 1000. With this in mind,
    it seems pretty reasonable to start assigning IDs to domain users and groups starting
    from 3000. We should also differentiate between the domain users and groups and
    the built-in accounts existing on a member server, such as the local administrator,
    the local guest, and so on. These two groups must not overlap, so we assign the
    range 3000 to 7999 to domain built-in user and group accounts. The configuration
    line should be something like this:


    ```

    idmap config * : range = 3000-7999

    ```


    We''re not done yet, though; we also need to map the domain users and groups.
    To do so, we can use different ends.'
