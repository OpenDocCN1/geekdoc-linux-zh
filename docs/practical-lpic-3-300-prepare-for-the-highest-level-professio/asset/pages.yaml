    # Restoring a Samba Active Directory Domain Controller


    Restoring a Samba DC is as easy as backing up. We just need to execute samba-tool
    domain backup restore. However, before restoring we must consider the best course
    of action.

    If we have lost a DC, it is probably a better solution to purge all the entries
    that point to that DC and account from another DC the FSMO roles needed. Later
    we would add DC to the domain to substitute for the one lost. On the last hand,
    if we have lost the last remaining DC, we would execute samba-tool domain backup
    restore to restore the domain. Later we would join the additional servers to the
    domain.'
