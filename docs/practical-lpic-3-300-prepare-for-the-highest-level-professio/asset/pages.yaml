  md: '# Replication Topologies


    In the practical example we''ve seen before we had a provider (alpha), as well
    as a consumer (foxtrot). This is a typical example of a master/slave replication
    (Figure 5-1).


    ![](img/dfa44432604022575079471b648e25ca_187_0.png)


    Figure 5-1. Master/slave or provider/consumer replication topology


    We could also use the foxtrot server as a replica hub. That is, we could propagate
    updates from the provider to it. We could then use it as a provider for other
    consumers. This topology is also known as hub and spoke (Figure 5-2).'
  merge: -1
