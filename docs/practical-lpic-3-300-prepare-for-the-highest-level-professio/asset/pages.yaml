    The ldapsearch command executed in brav couldn''t present a valid certificate,
    according to the new server configuration, the connection was rejected.


    In the /etc/openldap/ldapconf we can add any parameters to tune the behavior of
    ldapsearch and other LDAP client utilities. We need to add the TLS_CERT parameter,
    which specifies the file that contains the client certificate, and the TLS_KEY,
    which indicates where the file is located. We should also specify the CA certificate
    location with the TLS_CAERTDIR parameter.


    We have seen previously that many OpenLDAP client utilities like ldapsearch use
    the /etc/openldap/ldap.conf file as a configuration file from which to get the
    default values for many different parameters, as the LDAP server name or the base
    search. This file is global; that is, it applies for every user executing the
    user''s home directory and apply only to that user. These two files with the same
    syntax that can be found in the user''s home directory are ldaprc and .ldaprc.


    For the client certificate to be correctly verified by the server, the two parameters
    we talked about earlier, TLS_CERT and TLS_KEY, must be specified in the .ldaprc
    file. If they are included in the /etc/openldap/ldap.conf file they will be ignored.


    ```

    [root@bravo ~]# .ldaprc

    TLS_CERT   /etc/certificates/bravo.linuxaholics.com.crt

