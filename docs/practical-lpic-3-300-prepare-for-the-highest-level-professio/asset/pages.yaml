  md: '# CHAPTER 4 INTEGRATING LDAP WITH ACTIVE DIRECTORY AND KERBEROS


    # # Active Directory


    With Windows NT, many of us became familiar with a new concept, the domain. A
    domain could be defined as a group of users, computers, and other network resources
    that are centrally managed. This was a great leap forward compared to workgroups.
    In a workgroup, the computers could be interconnected, but any user who needed
    to access a computer was required to have a local account on that computer. This
    made the management of the network increasingly difficult as the network grew.
    This is not the case when working in a domain. Indeed, when users log into a domain
    they authenticate against a server called the domain controller, which keeps a
    registry of every network resource in the domain. Once the authentication is successful,
    the users can access all the network resources they have access to.


    In Windows NT every domain controller kept a local copy of every network resource
    in the domain. This copy was replicated to every domain controller, but there
    could only be a single domain controller with write access to the domain registry.
    This domain controller was called the primary domain controller (PDC). The other
    domain controllers had read-only copies and were called backup domain controllers
    (BDCs). When a client needed to read data from a domain controller, it could either
    the PDC or the BDC, but every time a change was to be performed the PDC had to
    be contacted.


    Obviously, this type of infrastructure could end overloading the existing PDC,
    so a better approach was needed. With this goal in mind, Microsoft began to work
    on their own LDAP server implementation called Active Directory, which was officially
    launched with Windows 2000. Since then Active Directory has undergone many changes
    and improvements.


    # # Delegating Authentication to Active Directory


    Being both LDAP servers, OpenLDAP and Active Directory share many similarities,
    as well as differences, which makes it possible for them to integrate in a common
    infrastructure reasonably well. One of the first things we might want to do is
    delegate authentication from OpenLDAP to Active Directory


    The installation of an Active Directory domain controller is well beyond the scope
    of of this book, but there are a plethora of tutorials and videos on the Internet
    that explain'
