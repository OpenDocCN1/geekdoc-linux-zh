  md: '# CHAPTER 3 LDAP INTEGRATION WITH PAM AND NSS


    At the top of the new window we might get a warning message if there is some required
    library missing. If that''s the case, we''ll install it and execute system-config-authentication
    again.


    If we take a look at the different fields, we''ll see two main sections: User
    Account Configuration and Authentication Configuration. Under User Account Configuration
    we have the settings User Account Database (in which we previously selected LDAP),
    LDAP Search Base DN, and LDAP Server.


    The User Account Database is self-explanatory and it refers to the location of
    the user accounts, which is in this case the LDAP database. The LDAP Server field
    will have to be filled with the name or address of our LDAP server. Finally, we
    need to indicate the search base in which the user accounts have been created.
    If we have followed the instructions from the previous chapters, this will be
    ou=users, dc=linuxaholics, dc=com.


    In the Authentication Configuration section we see that the default value is Kerberos,
    that is, the user accounts will be located in the LDAP server, but the authentication
    will be performed by a Kerberos server, not by the LDAP server itself. In a forthcoming
    chapter we''ll talk more about Kerberos and we''ll configure Kerberos authentication,
    but at this point we''ll change the Authentication Configuration value to LDAP
    password so that the LDAP server will perform the authentication, too. After completing
    all the fields, the dialog box will look like the one shown in Figure 3-3.'
