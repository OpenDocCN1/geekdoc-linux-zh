    # NFSv4 Pseudo File System


    NFSv4 servers create a pseudo file system to provide the clients with seamless
    access to exported folders. Here is an example.


    Let''s suppose we have the following directory tree on our NFS server:


    ```

    [root@tango ~# tree /NorthAmerica/

