  md: '# Adding a User


    We can now include a user inside the OU. The procedure is quite similar to what
    we have seen so far. First, we create a file named tux.ldif, with the following
    content:


    ```

    dn: cn=Tux,ou=users,dc=linuxaholics,dc=com

    cn: Tux

    sn: Tux

    objectClass: inetOrgPerson

    userPassword: linuxrules

    uid: Tux

    ```


    Then we execute ldap again.


    ```

    [root@alpha ldap]# ldap -f tux.ldif -x -D cn=admin,dc=linuxaholics,dc=com -w pass

    adding new entry "cn=Tux,ou=users,dc=linuxaholics,dc=com"


    We might receive this error:\ldap_add: Invalid syntax: value #0 invalid per syntax

    additional info: objectClass:(21)

    ```


    This message means that the object inetOrgPerson isn''t loaded in the core schema,
    so we''ll have to include it. In the /etc/ldap/schema folder, there are many LDIF
    files to extend the schema when we need it. We can see there is an inetorgperson.ldif
    file, which contains the schema definition for the inetOrgPerson object.


    The schema itself is contained in the LDAP database, so we can add new definitions
    to it with the ldap command. We are going to modify the configuration itself,
    instead of the data, we''ll authenticate ourselves as the external root user (-Y
    EXTERNAL) who has full access.


    ```

    [root@alpha ldap]# ldap -Y EXTERNAL -H ldapi:// -f /etc/ldap/schema/inetorgperson.ldif

