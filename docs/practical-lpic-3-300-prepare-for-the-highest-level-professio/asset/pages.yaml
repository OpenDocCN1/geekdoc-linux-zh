- img_proc: true
  md: '# CHAPTER 3


    # LDAP Integration with PAM and NSS


    By default, Linux systems use local users for authentication. Those users are
    listed in the /etc/passwd file. This can become a nuisance when there are many
    Linux systems in the network, as every user needs a local account in each and
    every one of them. A first approach to the use of a centralized repository for
    authentication was Network Information Services (NIS) developed initially by Sun.
    Now, this has been largely replaced by LDAP.


    In this chapter we''ll cover the following concepts:


    +   - Configure Linux Pluggable Authentication Modules (PAM) to use LDAP for authentication.

    - Configure Name Service Switch (NSS) to retrieve information from LDAP.

    - Configure PAM modules in various Unix environments.


    We will also be introduced to the following terms and utilities: PAM, NSS, /etc/pam.d/,
    and /etc/nsswitch.conf.


    # PAM


    When a user tries to access a computer through SSH, FTP, or another protocol,
    the system will decide whether to grant or deny access. During this process, it
    will execute many libraries and check many parameters depending on the local configuration.
    In Linux this process is managed by the PAM. PAM is made up of a series of libraries,
    as well as a series of text files that specify many options.'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# Authenticating Users with LDAP


    Traditionally, Linux users authenticate themselves by using local accounts locally
    stored on /etc/passwd. Now we''ll see how to authenticate users with LDAP.


    First of all, in the server we''ll have to allow incoming traffic to port LDAP
    (389) and LDAPS (636).


    ```

    [root@alpha~]# firewall -cmd --permanent --add-service=ldap

    uccess

    [root@alpha~]# firewall -cmd --permanent --add-service=ldaps

    success

    [root@alpha~]# firewall -cmd --reload

    success

    ```


    In the client we need to install a series of packages to allow LDAP authentication.

    [root@bravo~]# yum install openldap-clients nss-pam-ldap


    Next, we can use the system-config-authentication command (Figure 3-1). If this
    command is not installed, we''ll have to install the authconfig-gtk package with
    yum.

    If we need to install any additional library, we''ll install it as well.'
