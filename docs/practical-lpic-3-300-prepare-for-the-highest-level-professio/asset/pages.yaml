  md: '# CHAPTER 22


    # # Working with Windows Clients


    In this last chapter about Samba, we''ll focus on how to operate on a Samba server
    from a Windows client. We''ll share Samba resources from Windows and we''ll get
    familiar with some command-line utilities. In this chapter we''ll cover the following
    concepts:


    +   * Knowledge of Windows clients.

    * Exploring browse lists and SMB clients from Windows.

    * Sharing file and print resources from Windows.

    * Use of the smbclient program.

    * Use of the Windows net utility.


    We will also explore the following terms and utilities: Windows **net** command,
    **smbclient**, and **rdktop**.


    # ## Windows Clients


    Over time, as the Windows Server OS evolved, so did Windows clients. Since the
    early days of Windows 95/98 and Windows NT Workstation, clients could browse through
    the network. Initially the clients used NetBIOS, as we have already seen, but
    since the release of Windows 2000, DNS has been the preferred protocol used in
    Windows networks.


    # ## Sharing Resources from a Windows Client


    If we want to share a folder from a Windows client, the procedure is very easy.
    We right-click the folder and select Properties. In the Properties dialog box,
    click the Sharing tab (Figure 22-1). Next, click Sharing (Figure 22-2).'
