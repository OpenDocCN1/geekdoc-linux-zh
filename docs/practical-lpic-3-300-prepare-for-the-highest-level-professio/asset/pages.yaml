  md: '# CHAPTER 8 SAMBA CONCEPTS AND ARCHITECTURE, CONFIGURING SAMBA, AND INTERNATIONALIZATION


    On port UDP 137 the NetBIOS Name Service listens. This service is in charge of
    name resolution. We can query this service with the nmblook command.


    ```

    [root@hotel ~]# nmblook hotel

    192.168.56.128 hotel<00>

    [root@hotel ~]# nmblook zulu

    name_query failed to find name

    ```


    The NetBIOS Datagram listens on port UDP 138, and the NetBIOS Session Service
    listens on port TCP 139. Finally port TCP 445 is used by the SMB service.


    # Samba 3 and Samba 4


    Samba has been evolving since the very moment of its creation back in 1992, including
    more and more features. A big leap took place in 2012 when Samba 4 was released.


    With Samba 3 we could emulate a Windows BDC. In addition, we could create a member
    server (a server that is part of the domain but does not store a copy of the domain
    users database), or a stand-alone server (a server that is not part of a domain
    and uses only local users). It was not possible at all, however, to emulate an
    Active Directory domain controller.


    All this changed when Samba 4 was launched. This new release could emulate perfectly
    the way an Active Directory domain controller works. To do that, it combines several
    components:


    +   - An LDAP server.

    - A Kerberos server.

    - A dynamic DNS server.

    - Remote procedure calls (RPCs).


    # Server Configuration


    When we first talked about Samba in Chapter 7, we saw that Samba stores its configuration
    in a text file, /etc/samba/smb.conf in a default CentOS 7 installation. Since
    Samba 3.2, though, we also have the possibility to use a registry-based configuration.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Registry-Based Configuration


    The Samba configuration can be stored in the registry key HKLM\Software\Samba\smbconf.
    Registry configuration can be activated in three levels:


    +   - Registry shares: Share definitions are loaded from the registry, in addition
    to those defined in smb.conf. These shares are not loaded at startup but on demand
    when accessed. These registry shares are activated by setting the value registry
    shares = yes in the global section of the smb.conf file.

    - Registry only: If we set the value config backend = registry in the global section
    of the config file, the rest of the text-based configuration is completely ignored
    and configuration will be loaded from the registry instead. Registry shares are
    enabled.

    - Mixed text and registry config: In this case, by adding the option include =
    registry in the global section of the configuration file, global configuration
    options are read from registry with the same semantics as an include file. Those
    options found in the configuration file before the include parameter will be overridden
    by options in the registry, which in turn will be overridden as well by options
    from the configuration file found after the include = registry line. Registry
    shares are automatically activated.


    We will look at a simple example. We begin by adding the following line to the
    global section of the /etc/samba/smb.conf file:


    registry shares = Yes


    The usual way to access and edit the Samba registry is with the net command. We
    can view the content of the HKLM\Software\Samba\smbconf registry key, which of
    course, is initially empty.


    ```

    [root@hotel]# net registry enumerate ''HKLM\Software\Samba\smbconf''

    [root@hotel ~]#

    ```'
  merge: -1
  pgno: 219
