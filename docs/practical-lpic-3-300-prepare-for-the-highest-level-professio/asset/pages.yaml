  md: '# CHAPTER 27 NETWORK FILE SYSTEM


    # # Installing and Configuring NFS in CentOS 7


    To install the NFS server, as well as the client, we need to install the nfs-utils
    package.


    ```

    [root@tango ~]# yum install -y nfs-utils

    ```


    After installing the package, we''ll have a new file, /etc/exports. This file
    is empty by default and is used to specify the directories that will be exported
    through NFS. We''ll create a new folder in our NFS server and add a new file to
    it.


    ```

    [root@tango ~]# mkdir /NFS

    [root@tango ~]# echo 123 > /NFS/file_one.txt

    ```


    We edit the /etc/exports file accordingly.


    ```

    [root@tango ~]# cat /etc/exports

    /NFS  *(ro)

    ```


    We say that we want to export the /NFS directory to everybody (*), with read-only
    permissions (ro).

    We enable and start the nfs-server service:


    ```

    [root@tango ~]# systemctl enable nfs-server

    ln -s /usr/lib/systemd/nfs-server.service ''/etc/systemd/system/nfs.target.wants/nfs-server.service''

    [root@tango ~]# systemctl start nfs-server

    ```


    To effectively export the directories declared in the /etc/exports file, we need
    to execute the exports command. We export (-a) the directories and we want the
    command to be verbose (-v).


    ```

    [root@tango ~]# exportfs -av

    exporting *:/NFS

    ```


    Besides, we need to open the corresponding port in the firewall, so that the computers
    can connect to the NFS server.


    ```

    [root@tango ~]# firewall-cmd --add-service=nfs

    success

    [root@tango ~]# firewall-cmd --permanent --add-service=nfs

    success

    ```'
