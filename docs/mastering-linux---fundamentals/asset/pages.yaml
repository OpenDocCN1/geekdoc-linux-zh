- img_proc: true
  md: '# 9.1. all files are case sensitive


    Files on Linux (or any Unix) are case sensitive. This means FILE1 is different
    from file1, and /etc/hosts is different from /etc/Hosts (the latter one does not
    exist on a typical Linux computer).


    This screenshot shows the difference between two files, one with upper case W,
    the other with lower case w.


    ```

    paul@laika:~/Linux$ ls

    winter.txt Winter.txt

    paul@laika:~/Linux$ cat Winter.txt

    It is cold.

    paul@laika:~/Linux$ cat Winter.txt

    it is very cold!

    ```


    # 9.2. everything is a file


    A directory is a special kind of file, but it is still a (case sensitive!) file.
    Each terminal window (for example /dev/pts/4), any hard disk or partition (for
    example /dev/sdb1) and any process are all represented somewhere in the file system
    as a file. It will become clear throughout this course that everything on Linux
    is a file.


    # 9.3. file


    The file utility determines the file type. Linux does not use extensions to determine
    the file type. The command does not care whether a file ends in .txt or .pdf.
    As a system administrator, you should use the command to determine the file type.
    Here are examples on a typical Linux system.


    ```

    paul@laika:-$ file pic33.png

    pic33.png: PNG image data, 3840 x 1200, 8-bit/color RGBA, non-interlaced

    paul@laika:-$ file /etc/passwd

    /etc/passwd: ASCII text

    paul@laika:-$ file HelloWorld.c

    HelloWorld.c: ASCII C++ program text

    ```


    The file command uses a magic file to contain patterns to recognise file types.
    The magic file is located in /usr/share/file/magic. Use man 5 for those in /dev
    and /proc.


    It is interesting to point out -s for special files like those in /dev and /proc.


    ```

    root@debian6-## file /dev/sda

    /dev/sda: block special

    root@debian6-## file -s /dev/sda

    /dev/sda: boot sector, partition 1: ID=0x83, active, starthead...

    root@debian6-## /proc/cpuinfo

    /proc/cpuinfo: empty

    root@debian6-## file -s /proc/cpuinfo

    /proc/cpuinfo: ASCII C++ program text

    ```'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# 9.4. touch


    # 9.4.1. create an empty file


    One easy way to create an empty file is with **touch**. (We will see many other
    ways of creating files later in this book.)


    This screenshot starts with an empty directory, creates two files with **touch**
    and the lists those files.


    ```

    paul@debian:~$ ls -1

    total 0

    paul@debian:~$ touch file42

    paul@debian:~$ touch file33

    paul@debian:~$ ls -1

    total 0

    -rw-r--r-- 1 paul paul 0 Oct 15 08:57 file33

    -rw-r--r-- 1 paul paul 0 Oct 15 08:56 file42

    paul@debian:-$

    ```


    # 9.4.2. touch -t


    The **touch** command can set some properties while creating empty files. Can
    you determine what is set by looking at the next screenshot? If not, check the
    manual for **touch**.


    ```

    paul@debian:~$ touch -t 200505050000 SinkoDeMayo

    paul@debian:~$ touch -t 130207111630 BigBattle.txt

    paul@debian:~$ ls -1

    total 0

    -rw-r--r-- 1 paul paul 0 Jul 11 1302 BigBattle.txt

    -rw-r--r-- 1 paul paul 0 Oct 15 08:57 file33

    -rw-r--r-- 1 paul paul 0 Oct 15 08:56 file42

    -rw-r--r-- 1 paul paul 0 May 5 2005 SinkoDeMayo

    paul@debian:-$

    ```'
  merge: -1
  pgno: 95
- img_proc: true
  md: '# 9.5. rm


    # 9.5.1. remove forever


    When you no longer need a file, use rm to remove it. Unlike some graphical user
    interfaces, the command line in general does not have a waste bin or trash can
    to recover files. When you use rm to remove a file, it is gone. Therefore, be
    careful when removing files!


    ```

    paul@debian?:-$ ls

    BigBattle.txt file33 file42 SinkoDeMayo

    paul@debian?:-$ rm BigBattle.txt

    paul@debian?:-$ ls

    file33 file42 SinkoDeMayo

    paul@debian?:-$

    ```


    # 9.5.2. rm -i


    To prevent yourself from accidentally removing a file, you can type rm -i.


    ```

    paul@debian?:-$ ls

    file33 file42 SinkoDeMayo

    paul@debian?:-$ rm -i file33

    rm: remove regular empty file `file33''? yes

    paul@debian?:-$ rm -i SinkoDeMayo

    rm: remove regular empty file `SinkoDeMayo`? n

    paul@debian?:-$ ls

    file42 SinkoDeMayo

    paul@debian?:-$

    ```


    # 9.5.3. rm -rf


    By default, rm -r will not remove non-empty directories. However rm accepts options
    that will allow you to remove any directory. The rm -rf statement is famous because
    it will erase anything (providing that you have the permissions to do so). When
    you are logged on as root, be very careful with rm -rf (the f force and the r
    means recursive) since being root implies that permissions do not apply to you.
    You can literally erase your entire file system by command.


    ```

    paul@debian?:-$ mkdir test

    paul@debian?:-$ rm test

    rm: cannot remove ''test'': Is a directory

    paul@debian?:-$ rm -rf test

    paul@debian?:-$ ls

    is: cannot access test: No such file or directory

    paul@debian?:$

    ```'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# 9.6. cp


    # 9.6.1. copy one file


    To copy a file, use **cp** with a source and a target argument.


    ```

    paul@debian:~$ ls

    file42 SinkoDemayo

    paul@debian:~$ cp file42 file42.copy

    paul@debian:~$ ls

    file42 file42.copy SinkoDemayo

    ```


    # 9.6.2. copy to another directory


    If the target is a directory, then the source files are copied to that target
    directory.


    ```

    paul@debian:~$ mkdir dir42

    paul@debian:~$ cp SinkoDemayo dir42

    paul@debian:~$ ls dir42

    SinkoDemayo

    ```


    # 9.6.3. cp -r


    To copy complete directories, use **cp -r** (the -r option for recursive copying
    of all files in subdirectories).


    ```

    paul@debian:~$ ls

    dir42 file42.copy SinkoDemayo

    paul@debian:~$ cp -r dir42/dir33

    paul@debian:~$ ls

    dir33 file42 file42.copy SinkoDemayo

    SinkoDemayo

    ```


    # 9.6.4. copy multiple files to directory


    You can use cp to copy multiple files into a directory. In this case, the last
    argument (a.k.a. the target) must be a directory.


    ```

    paul@debian:~$ cp file42 file42.copy SinkoDemayo dir42/

    paul@debian:~$ ls dir42/

    file42 file42.copy SinkoDemayo

    ```


    # 9.6.5. cp -i


    To prevent overwriting existing files, use the **-i** (for interactive) option.


    ```

    paul@debian:~$ cp SinkoDemayo file42

    paul@debian:~$ cp SinkoDemayo file42

    paul@debian:~$ cp -i SinkoDemayo file42

    cp: overwrite `file42`? n

    paul@debian:~$

    ```'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# 9.7. mv


    # 9.7.1. rename files with mv


    Use **mv** to rename a file or to move the file to another directory.


    ```

    paul@debian:~$ ls

    dir33 dir42 file42.copy SinkoDeMayo

    paul@debian:~$ mv file42 file33

    paul@debian:~$ ls

    dir33 dir42 file33 file42.copy SinkoDeMayo

    paul@debian:~$

    ```


    When you need to rename only one file then the **mv** is the preferred command
    to use.


    # 9.7.2. rename directories with mv


    The **mv** command can be used to rename directories.


    ```

    paul@debian:~$ ls -l

    total 8

    drwxr-xr-x 2 paul 4096 Oct 15 09:36 dir33

    drwxr-xr-x 2 paul 4096 Oct 15 09:36 dir42

    -rw-r--r-- 1 paul 0 Oct 15 09:38 file33

    --rw-r--r-- 1 paul 0 Oct 15 09:16 file42.copy

    --rw-r--r-- 1 paul 0 May 5 2005 SinkoDeMayo

    paul@debian:~$ mv dir33 backup

    paul@debian:~$ ls -l

    total 8

    drwxr-xr-x 2 paul 4096 Oct 15 09:36 backup

    drwxr-xr-x 2 paul 4096 Oct 15 09:36 dir42

    -rw-r--r-- 1 paul 0 Oct 15 09:38 file33

    --rw-r--r-- 1 paul 0 Oct 15 09:16 file42.copy

    --rw-r--r-- 1 paul 0 May 5 2005 SinkoDeMayo

    -rw-r--r-- 1 paul

    paul@debian:~$

    ```


    # 9.7.3. mv -i


    This screenshot shows that **mv -i** will ask to overwrite an existing file.


    ```

    paul@debian:~$ mv -i file33 SinkoDeMayo

    mv: overwrite ''SinkoDeMayo''? no

    paul@debian:~$

    ```'
  merge: -1
