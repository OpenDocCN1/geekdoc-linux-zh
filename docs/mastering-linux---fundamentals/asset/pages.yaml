  md: '# 11.9. /variable data


    Files are unpredictable in size, such as log, cache and spool files, should be
    located in /var.


    # 11.9.1. /var/log


    The /var/log directory serves as a central point to contain all log files.


    ```

    [paul@RHEL4-b $] ls /var/log

    acpid cron.2 maillog.2 quagga secure.4

    amanda cron.3 maillog.3 radius spooler

    anaconda.log cron.4 maillog.4 spooler.1

    anaconda.syslog httpd messages rmpkgs.1 spooler.2

    anaconda.xlog dmesg messages rmpkgs.2 spooler.3

    audit audit messages.1 rmpkgs.3 spooler.4

    boot.log exist messages.2 squid

    boot.log.1 image.2 sa uop

    boot.log.2 iim messages.4 scrollbook vmware-tools-guest

    boot.log.3 itrapf mysql.log secure

    boot.log.4 aill secure.1 wtmp

    cron mail PPP secure.2 Xorg.0.log

    cron.1 maillog.1 prelink secure.3 Xorg.0.log

    ```


    # 11.9.2. /var/messages


    A typical file to check when troubleshooting on Red Hat (and derivatives) is the
    /var/messages files. By default this file will contain information on what just
    happened to the system. The file is called /var/log/syslog on Debian and Ubuntu.


    ```

    [root@RHEL4-b ~] tail /var/log/messages

    Jul 30 05:13:56 anacron ancestor startup succeeded

    Jul 30 05:13:56 atd startup succeeded

    Jul 30 05:13:57 messagebus: messagebus startup succeeded

    Jul 30 05:13:57 cus-config-daemon: cus-config-daemon startup succeeded

    Jul 30 05:13:58 halved-daemon: halvedemon startup succeeded

    Jul 30 05:13:59 systemd: reassign all mounted points

    Jul 30 05:14:01 fstab-sync(3628): added mount point /media/cdrom for ...

    Jul 30 05:14:01 fstab-sync(3466): added mount point /media/floppy for...

    Jul 30 05:16:46 sshd (pam_unix) [3622]: opened session for user paul by ...

    Jul 30 06:06:37 su (pam_unix) [3904]: opened session for user root by paul

    ```


    # 11.9.3. /var/cache


    The /var/cache directory can contain data for several applications.


    ```

    paul@ub1010:~ $ ls /var/cache/

    apt directories-common gdm software-center

    binfmms plugin-installer hal pm-utils

    cups fontconfig jockey pppconfig

    debconf fonts ldconfig samba Xorg.0.log

    ```


    # 11.9.4. /var/spool


    The /var/spool directory contains spool directories for mail and cron, but also
    serves as a parent directory for other spool files (example spool files).'
