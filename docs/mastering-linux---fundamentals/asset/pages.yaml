  md: '# Chapter 12. commands and arguments


    This chapter introduces you to **shell expansion** by taking a close look at **commands**
    and **arguments**. Knowing **shell expansion** is important because many **commands**
    on your Linux system are processed and most likely changed by the **shell** before
    they are executed.


    The command line interface or **shell** used on most Linux systems is called **bash**,
    which stands for **Bourne again shell**. The **bash** shell incorporates features
    from **sh** (the original Bourne shell), **esh** (the C shell), and **ksh** (the
    Korn shell).


    This chapter frequently uses the **echo** command to demonstrate shell features.
    The **echo** command is very simple: it echoes the input that it receives.


    ```

    paul@laika:~$ echo Burtonville

    Burtonville

    paul@laika:~$ echo Smurfs are blue

    Smurfs are blue

    ```'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# 12.1. arguments


    One of the primary features of a shell is to perform a command line scan. When
    you enter a command at the shell''s command prompt and press the enter key, the
    shell will start scanning the line, cutting it up in arguments. While scanning
    the line, the shell may make many changes to the arguments you typed.


    This process is called shell expansion. When the shell has finished scanning and
    modifying that line, it will be executed.


    # 12.2. white space removal


    Parts are separated by one or more consecutive white spaces (or tabs) are considered
    separate arguments, any white space is removed. The first argument is the command
    to be executed, any other arguments are given to the command. The shell effectively
    cuts your command into one or more arguments.


    This explains why the following four different command lines are the same after
    shell expansion.


    ```

    paul@RHELv4u ~$ echo Hello World

    Hello World

    paul@RHELv4u ~$ echo Hello World

    Hello World

    paul@RHELv4u ~$ echo Hello

    Hello World

    paul@RHELv4u ~$ echo Hello World

    Hello World

    ```


    The echo command will display each argument it receives from the shell. The echo
    command will also add a new white space between the arguments it received.'
  merge: -1
  pgno: 135
- img_proc: true
  md: "# 12.3. single quotes\n\nYou can prevent the removal of white spaces by quoting\
    \ the spaces. The contents of the quoted string are considered as one argument.\
    \ In the screenshot below the echo receives\n\n```\n[paul@RHEL4b ~]$ echo 'A line\
    \ with single quotes'\nA line with    single quotes\n[paul@RHEL4b ~]$\n```\n\n\
    # 12.4. double quotes\n\nYou can also prevent the removal of white spaces by double\
    \ quoting the spaces. Same as above, echo only receives one argument.\n\n```\n\
    [paul@RHEL4b ~]$ echo \\\"A line with double quotes\"\nA line with    double quotes\n\
    [paul@RHEL4b ~]$\n```\n\nLater in this book, when discussing variables we will\
    \ see important differences between single and double quotes.\n\n# 12.5. echo\
    \ and quotes\n\nQuoted lines can include special escaped characters recognised\
    \ by the echo command (when using echo -e). The screenshot below shows how to\
    \ use \\n for a newline and \\t for a tab (usually eight white spaces).\n\n```\n\
    [paul@RHEL4b ~]$ echo -e \\\"A line with \\n newline\"\\ line with\na newline\n\
    [paul@RHEL4b ~]$ echo -e \\\"A line with \\n newline\"\\ line with\na newline\n\
    [paul@RHEL4b ~]$ echo -e \\\"A line with \\t tab\"\\ line with\n a tab\n[paul@RHEL4b\
    \ ~]$ echo -e \\\"A line with \\t tab\"\\ line with\n a tab\n[paul@RHEL4b ~]$\n\
    ```\n\nThe echo command can generate more than white spaces, tabs and newlines.\
    \ Look in the man page for a list of options."
  merge: -1
