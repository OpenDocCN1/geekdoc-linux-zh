- img_proc: true
  md: '# 32.3.4. setting permissions (chmod)


    Permissions can be changed with chmod. The first example gives the user owner
    execute permissions.


    ```

    paul@laika:/perms$ ls -l permissions.txt

    -rw-r--r-- 1 paul paul 0 2007-02-07 22:34 permissions.txt\paul@laika:/perms$ chmod
    +u permissions.txt\paul@laika:/perms$ ls -l permissions.txt

    -rwxr-xr-- 1 paul paul 0 2007-02-07 22:34 permissions.txt

    ```


    This example removes the group owners permission.


    ```

    paul@laika:/perms$ chmod g-r permissions.txt

    paul@laika:/perms$ ls -l permissions.txt

    -rwx--r-- 1 paul 0 2007-02-07 22:34 permissions.txt

    ```


    This example removes the others read permission.


    ```

    paul@laika:/perms$ chmod +w permissions.txt

    paul@laika:/perms$ ls -l permissions.txt

    -rwx-wx-- 1 paul 0 2007-02-07 22:34 permissions.txt

    ```


    This example gives all of them write permission.


    ```

    paul@laika:/perms$ chmod +x permissions.txt

    paul@laika:/perms$ ls -l permissions.txt

    -rwx-wx-- 1 paul 0 2007-02-07 22:34 permissions.txt

    ```


    You don''t have to type the a.


    ```

    paul@laika:/perms$ chmod urw permissions.txt

    paul@laika:/perms$ ls -l permissions.txt

    -rwx-rw-x 1 paul 0 2007-02-07 22:34 permissions.txt

    ```


    You can also set explicit permissions.


    ```

    paul@laika:/perms$ chmod urw,gw=r permissions.txt

    paul@laika:/perms$ ls -l permissions.txt

    -rw-rw-r-- 1 paul 0 2007-02-07 22:34 permissions.txt

    ```


    Feel free to make any kind of combination.


    ```

    paul@laika:/perms$ chmod urw,ug+rw,o=r permissions.txt

    paul@laika:/perms$ ls -l permissions.txt

    -rwxr-r-- 1 paul 0 2007-02-07 22:34 permissions.txt

    ```


    Even fishy combinations are accepted by chmod.


    ```

    paul@laika:/perms$ chmod urw,ug+rw,o=r permissions.txt

    paul@laika:/perms$ ls -l permissions.txt

    -rwxr-r-- 1 paul 0 2007-02-07 22:34 permissions.txt

    ```'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# 32.3.5. setting octal permissions


    Most Unix administrators will use the old school octal system to talk about and
    set permissions. Look at the triplet bitwise, equating r to 4, w to 2, and x to
    1.


    **Table 32.4. Octal permissions


    | binary | octal | permission |

    |---|---||

    | 000 | 0 | --- |

    | 001 | 1 | --x |

    | 010 | 2 | -w- |

    | 011 | 3 | -wx |

    | 100 | 4 | r-- |

    | 101 | 5 | r-x |

    | 110 | 6 | rw- |

    | 111 | 7 | rwx |


    This makes **777** equal to rwxrwxrwx by the same logic, **654** mean rw-r--.
    The **chmod** command will accept these numbers.


    ```

    paul@laika:~/perms$ chmod 777 permissions.txt

    paul@laika:~/perms$ ls -l permissions.txt

    -rwrwrwx 1 paul 0 2007-02-07 22:34 permissions.txt

    paul@laika:~/perms$ chmod 664 permissions.txt

    paul@laika:~/perms$ ls -l permissions.txt

    -rw-r-- 1 paul 0 2007-02-07 22:34 permissions.txt

    paul@laika:~/perms$ chmod 750 permissions.txt

    paul@laika:~/perms$ ls -l permissions.txt

    -rwxr-x--- 1 paul 0 2007-02-07 22:34 permissions.txt

    ```'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# 32.3.6. umask


    When creating a file or directory, a set of default permissions are applied. These
    default permissions are determined by the umask. The umask specifies permissions
    that you do not want set by default. You can display the umask with the umask
    command.


    ```

    [Harry@RHEL4b ~]$ umask

    0002

    [Harry@RHEL4b ~]$ touch test

    [Harry@RHEL4b ~]$ ls -l test

    -rw-r--r-- 1 Harry Jul 24 06:03 test

    [Harry@RHEL4b ~]$

    ```


    As you can also see, the file is not executable by default. This is a security
    feature among Unix; newly created files are never executable by default. You have
    to explicitly do chmod +x to make a file executable. This also means that the
    1 bit in the umask has no meaning-a umask of 0022 is the same as 0033.


    # 32.3.7. mkdir -m


    When creating directories with mkdir you can use the -m option to set the mode.
    This screenshot explains.


    ```

    paul@debian5~$ mkdir -m 700 MyDir

    paul@debian5~$ mkdir -m 777 Public/

    paul@debian5~$ ls -ld MyDir/ Public/

    dr-xr-x 2 paul 4096 2011-10-16 19:16 MyDir/

    drwxrwxrx 2 paul 4096 2011-10-16 19:16 Public/

    ```


    # 32.3.8. cp -p


    To preserve permissions and time stamps from sources, use cp -p.


    ```

    paul@laika:-~/perms cp file* cp

    paul@laika:-~/perms cp -p file* cpp

    paul@laika:-~/perms ls -l *

    -rw-r--r-- 1 paul 2008-08-25 13:26 file33

    -rwxr-x-- 1 paul 2008-08-25 13:26 file42

    \cp:

    total 0

    -rw-r--r-- 1 paul 2008-08-25 13:34 file33

    -rwxr-x-- 1 paul 2008-08-25 13:34 file42


    cpp:

    total 0

    -rw-------------- 1 paul 2008-08-25 13:26 file33

    -rwxr-x-- 1 paul 2008-08-25 13:26 file42

    ```'
  merge: -1
  pgno: 324
