  md: '# 10.8. solution: file contents


    +   1. Display the first 12 lines of /etc/services.


    ```

    head -12 /etc/services

    ```


    +   2. Display the last line of /etc/passwd.


    ```

    tail -1 /etc/passwd

    ```


    +   3. Use cat to create a file named count.txt that looks like this:


    ```

    cat > count.txt

    One

    Two

    Three

    Four

    Five (followed by Ctrl-d)

    ```


    +   4. Use cp to make a backup of this file to cnt.txt.


    ```

    cp count.txt cnt.txt

    ```


    +   5. Use cat to make a backup of this file to catcnt.txt.


    ```

    cat count.txt > catcnt.txt

    ```


    +   6. Display catcnt.txt, with all lines in reverse order (the last line).


    ```

    tac catcnt.txt

    ```


    +   7. Use more to display /etc/services.


    ```

    more /etc/services

    ```


    +   8. Display the readable character strings from the /usr/bin/passwd command.


    ```

    strings /usr/bin/passwd

    ```


    +   9. Use ls to find the biggest file in /etc.


    ```

    ls -ls /etc

    ```


    +   10. Open two terminal windows (or tabs) and make sure you are in the same
    directory in. Both echo is the first line > tailing.txt in the first terminal,
    then use tail -f tailing.txt in the second terminal. Now go back to the first
    terminal and echo This is another line >> tailing.txt (note the double >>>), verify
    that the tail -f in the second terminal shows both. Stop the tail -f with Ctrl-C.


    +   11. Use cat to create a file named tailing.txt that contains the contents
    of tailing.txt followed by the contents of /etc/passwd.


    ```

    cat /etc/passwd >> tailing.txt

    ```


    +   12. Use cat to create a file named tailing.txt that contains the contents
    of tailing.txt preceded by the contents of /etc/passwd.


    ```

    mv tailing.txt tmp.txt ; cat /etc/passwd tmp.txt > tailing.txt

    ```'
