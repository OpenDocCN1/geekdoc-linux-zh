- img_proc: true
  md: '# 33.1. sticky bit on directory


    You can set the sticky bit on a directory to prevent users from removing files
    that they do not own as a user owner. The sticky bit is displayed at the same
    location as the x permission (meaning x is also there) or a T (when there is no
    x for others).


    ```

    root@RHELv4:~# mkdir /project55

    root@RHELv4:~# ls -d /project55

    drwxr-xr-x 2 root 4096 Feb 7 17:38 /project55

    root@RHELv4:~# chmod +t /project55/

    root@RHELv4:~# ls -d /project55

    drwxrxr-t 2 root 4096 Feb 7 17:38 /project55

    root@RHELv4:~# _

    ```


    The sticky bit can also be set with other permissions, it is binary 1 in the first
    of four triplets.


    ```

    root@RHELv4:~# chmod 1775 /project55/

    root@RHELv4:~# ls -ld /project55

    drwxrxr-t 2 root 4096 Feb 7 17:38 /project55

    root@RHELv4:~# _

    ```


    You will typically find the sticky bit on the /tmp directory.


    ```

    root@barry:~# ls -ld /tmp

    drwxrxr-t 6 root 4096 Sep-06-04 19:02 /tmp

    ```


    # 33.2. setgid on directory


    setgid can be used on directories to make sure that all files inside the directory
    are owned by the group owner of the directory. The setgid bit is displayed at
    the same location as the x permission for group owner. The setgid bit is represented
    by an s (meaning x is also there) or an S (when there is no x for the group owner).
    As this example shows, though root does not belong to the group proj55, the files
    created by root in /project55 will belong to proj55 because the setgid bit is
    set.


    ```

    root@RHELv4:~# groupadd proj55

    root@RHELv4:~# chown root:proj55 /project55/

    root@RHELv4:~# chmod 2775 /project55/

    root@RHELv4:~# ls -ld /project55/

    drwxrxr-s 2 root proj55 4096 Feb 7 17:45 /project55/

    root@RHELv4:~# ls -l /project55/

    total 4

    -rw-r--r---- 1 root proj55 0 Feb 7 17:45 fromroot.txt

    root@RHELv4:~# _

    ```


    You can use the command to find all setgid directories.


    ```

    paul@laika:~$ find / -type d -perm -2000 2>/dev/null

    /var/log/mysql

    /var/log/news

    ...

    ```'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# 33.3. setuid and setgid on regular files


    These two permissions cause an executable file to be executed with the permissions
    of the file owner instead of the executing owner. This means that if any user
    executes a program that belongs to the root user, the setuid bit is set on that
    program, the program will run as root. This can be dangerous, sometimes it is
    good for security.


    Take the example of passwords; they are stored in /etc/shadow which is only readable
    by root. The root user never needs permissions anyway.


    ```

    root@RHELv4:~# ls -l /etc/shadow

    -r-------- root root 1260 Jan 21 07:49 /etc/shadow

    ```


    Changing your password requires an update of this file, so how can normal non-root
    users do this? Let''s take a look at the permissions of /usr/bin/passwd.


    ```

    root@RHELv4:~# ls -l /usr/bin/passwd

    -r-s--x--x root root 21200 Jun 17 2005 /usr/bin/passwd

    ```


    When running the passwd program, you are executing it with root credentials.


    You can use the find command to find all setuid programs.


    ```

    paul@laika:~$ find /usr/bin -type f -perm -04000

    /usr/bin/arping

    /usr/bin/krantpty

    /usr/bin/newgrp

    /usr/bin/conff

    /usr/bin/sudo

    /usr/bin/fping6

    /usr/bin/passwd

    /usr/bin/gpasswd

    ..

    ```


    In most cases, setting the setuid on executables is sufficient. Setting the setgid
    will result in these programs to run with the credentials of their group owner.


    # 33.4. setuid on sudo


    The sudo binary has the setuid bit set, so any user can run it with the effective
    user of root.


    ```

    paul@rhel6:~$ ls -l $(which sudo)

    --rwsrxr-x 1 root root 123832 Oct 7 2013 /usr/bin/sudo

    paul@rhel6:~$

    ```'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# 33.5. practice: sticky, setuid and setgid bits


    +   1a. Set up a directory, owned by the group sports.


    +   1b. Members of the sports group should be able to create files in this directory.


    +   1c. All files created in this directory should be group-owned by the sports
    group.


    +   1d. Users should be able to delete only their own user-owned files.


    +   1e. Test that this works!


    +   2. Verify the permissions on /usr/bin/passwd. Remove the setuid, then try
    changing your password as a normal user. Reset the permissions back and try again.


    +   3. If time permits (or if you are waiting for other students to finish this
    practice), read about file attributes in the man page of chattr and lsattr. Setting
    the i attribute on a file and test that it works.'
  merge: -1
