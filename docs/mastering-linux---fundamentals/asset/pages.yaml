  md: '# Chapter 6. getting Linux at home


    This chapter shows a Ubuntu install in Virtualbox. Consider it legacy and use
    CentOS7 or Debian8 (each have their own chapter now).


    This book assumes you have access to a working Linux computer. Most companies
    have one or more Linux servers, if you have already logged on to it, then you''re
    all set (skip this chapter and go to the next).


    Another option is to insert a Ubuntu Linux CD in a computer with (or without)
    Microsoft Windows and follow the installation. Ubuntu will resize (or create)
    partitions and setup a menu at boot time to choose Windows or Linux.


    If you do not have access to a Linux computer at the moment, and if you are unable
    or unsure about installing Linux on your computer, then this chapter proposes
    a third option: installing Linux in a virtual machine.


    Installation in a virtual machine (provided by Virtualbox) is easy and safe. Even
    when you make mistakes and crash everything on the virtual Linux machine, then
    nothing on the real computer is touched.


    This chapter gives easy steps and screenshots to get a working Ubuntu server in
    a Virtualbox virtual machine. The steps are very similar to installing Fedora
    or CentOS or even Debian, and if you like you can also use VMWare instead of Virtualbox.'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# 6.1. download a Linux CD image


    Starting by downloading a Linux CD image (.ISO file) from the distribution of
    your choice from the Internet. Take care selecting the cpu architecture of your
    computer; choose **i386** if unsure. Choosing the wrong cpu type (like x86_64,
    when you have an old Pentium) will immediately fail to boot the CD.


    ![](img/127a5ac6776c2933c37f7b2f9e005369_68_0.png)


    # Download Ubuntu Server


    You can download Ubuntu Server now - it''s completely free.


    ![](img/127a5ac6776c2933c37f7b2f9e005369_68_1.png)


    # 6.2. download Virtualbox


    Step two (when the .ISO file has finished downloading) is to download Virtualbox.
    If you are currently running Microsoft Windows, then download and install Virtualbox
    for Windows!


    ![](img/127a5ac6776c2933c37f7b2f9e005369_68_2.png)


    Here, will you find links to VirtualBox binaries and its source code.


    # VirtualBox binaries


    By downloading, you agree to the terms and conditions of the packages. The binaries
    are released under


    +   * VirtualBox 4.1.8 for Windows hosts x86/amd64

    * VirtualBox 4.1.8 for OS X x86/amd64

    * VirtualBox 4.1.8 for Linux hosts

    * VirtualBox 4.1.8 for Solaris hosts x86/amd64'
