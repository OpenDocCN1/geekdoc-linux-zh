  md: '# # Chapter 11. the Linux file tree


    This chapter takes a look at the most common directories in the Linux file tree.
    It also shows that on Unix everything is a file.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# 11.1. filesystem hierarchy standard


    Many Linux distributions partially follow the Filesystem Hierarchy Standard. The
    FHS may help make more Unix/Linux file systems conform better in the future. The
    FHS is available online at http://www.pathname.com/fhs where we read: "The filesystem
    hierarchy standard has designed to be used by Unix distribution developers


    # 11.2. man hier


    There are some differences in the filesystems between Linux distributions. For
    help your machine, enter man hier to find information about the file system hierarchy.
    This manual will explain the directory structure on your computer.


    # 11.3. the root directory /


    All Linux systems have a directory structure that starts at the root directory.
    The root directory is represented by a forward slash, like this/. Everything that
    exists on your Linux system can be found below this root directory. Let''s take
    brief look at the contents of the root directory.


    ```

    [paul@RHEL4u3 ~]$ ls /\nbin dev home media mnt sbin srv tftpboot usr

    boot etc lib misc opt root selinux sys tmp var

    ```'
  merge: -1
  pgno: 111
- img_proc: true
  md: "# # 11.4. binary directories\n\nBinaries are files that contain compiled source\
    \ (or machine code). Binaries can be executed on the computer. Sometimes binaries\
    \ are called executables.\n\n# ## 11.4.1. /bin\n\nThe /bin directory contains\
    \ binaries for use by all users. According to the FHS the /bin directory should\
    \ contain /bin/cat and /bin/date (among others).\n\nIn the screenshot below you\
    \ see common Unix/Linux commands like cat, cpio, dd, dd, echo, grep, and so on.\
    \ Many of these will be covered in this book.\n\n```\npaul@alika~$ ls /bin\narchdetect\
    \      grep     mt               setupcon\nautopartition false     mt-gnu    \
    \       sh\nbash           console mv               sh.distrib\nbunzip2      \
    \  fuser    nano              sleep\nbcat            fusermount  nc.traditional\
    \ stralign\nbczmp          get_mountpoints netcat          tty\ndbzdiff      \
    \ grep      netstat         sync\nbzgrep       grep      nfs-3g          sysfs\n\
    bzgrep       gzip      nfs-3g.probe    talf\nbzgrep       gzip      parsed_devices\
    \ tar\nbzip2        hostname parted_server tempfile\nbzip2ipecover  hw-detect\
    \               touch\nbzless        ip        partman-commit true\ncat      \
    \      kbd_mode perform_recipe ulockmgr\n              kill      pidof       \
    \      umount\n              ... \n```\n\n# ## 11.4.2. other bin directories\n\
    \nYou can find a /bin subdirectory in many other directories. A user named serena\
    \ could put her programs in /home/serena/bin.\n\nSome applications, when installed\
    \ directly from source will put themselves in /opt. A samba server installation\
    \ can use /opt/samba/bin to store its binaries.\n\n# ## 11.4.3. /sbin\n\n/sbin\
    \ contains binaries to configure the operating system. Many of the system binaries\
    \ require root privilege to perform certain tasks.\n\nBelow a screenshot containing\
    \ system binaries to change the ip address, partition a disk and create an ext4\
    \ file system.\n\n```\npaul@ubu1010:~$ ls -l /sbin/ifconfig /sbin/mkfs.ext4\n\
    -rwxr-xr-x 1 root 9712 2011-02-02 09:56 /sbin/fdisk\n-rwxr-xr-x 1 root 65708 2010-07-02\
    \ 09:27 /sbin/ifconfig\n-rwxr-xr-x 5 root 55140 2010-08-18 18:01 /sbin/mkfs.ext4\n\
    ```"
  merge: -1
  pgno: 112
- img_proc: true
  md: '# 11.4.4./lib


    Binaries found in /bin and /sbin often use shared libraries located in /lib. Below
    is a screenshot of the partial contents of /lib.


    ```

    paul@laika:~$ ls /libc*

    /lib/libc-2.5.so /lib/libcfont.so.0.0.0 /lib/libcom_err.so.2.1

    /lib/libcap.so.1 /lib/libcidn-2.5.so /lib/libconsole.so.0

    /lib/libcap.so.1.10 /lib/libcidn.so.1 /lib/libconsole.so.0.0.0

    /lib/libcfont.so.0 /lib/libcom_err.so.2 /lib/libcrypt-2.5.so

    ```


    # /lib/modules


    Typically, the Linux kernel loads modules from /lib/modules/$Kernel-version/.
    This directory is discussed in detail in the Linux kernel chapter.


    # /lib32 and /lib64


    We are in a transition between 32-bit and 64-bit systems. Therefore, you may encounter
    directories named /lib32 and /lib64 which clarify the register size used during
    compilation of the libraries. A 64-bit computer may have 32-bit binaries and libraries
    for compatibility with legacy applications. This screenshot uses the file utility
    to demonstrate the difference.


    ```

    paul@laika:~$ file /lib32/libc-2.5.so

    /lib32/libc-2.5.so: ELF 32-bit LSB shared object, Intel 80386, \

    version 1 (SYS), for GNU/Linux 2.6.0, stripped

    paul@laika:~$ file /lib64/libcap.so.1.10

    /lib64/libcap.so.1.10: ELF 64-bit LSB shared object, AMD x86-64, \

    version 1 (SYS), stripped

    ```


    The ELF (Executable and Linkable Format) is used in almost every Unix-like system
    since System V.


    # 11.4.5./opt


    The purpose of /opt is to store optional software. In many cases this software
    is outside the distribution repository. You may find an empty /opt directory on
    many systems.


    A large package can install all its files in /bin, /lib, /etc subdirectories within
    /opt/$packagename/opt/. For example if the package is called wp, it installs in
    /opt/wp, putting binaries in /opt/wp/bin and manpages in /opt/wp/man.'
  merge: -1
  pgno: 113
