  md: '# 18.10. solution: input/output redirection


    +   1. Activate the noclobber shell option.


    ```

    set -o noclobber

    set -C

    ```


    +   2. Verify that noclobber is active by repeating an ls on /etc/ with redirected
    output to a file.


    ```

    ls /etc > etc.txt

    ls /etc > etc.txt (should not work)

    ```


    +   4. When listing all options, which character represents the noclobber option?


    ```

    echo $- (noclobber is visible as C)

