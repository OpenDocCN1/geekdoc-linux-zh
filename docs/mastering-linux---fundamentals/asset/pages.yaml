  md: '# 25.1. script parameters


    A bash script can contain the parameters. The numbering you see in the script
    below continues if you have more parameters. You also have special parameters
    containing the number of parameters, a string of all of them, and also the process
    id, and the last return code. The page of bash has a full list.


    ```

    #!/bin/bash

    echo The first argument is $1

    echo The second argument is $2

    echo The third argument is $3


    echo $$ PID of the script

    echo \# count arguments

    echo \$? last return code

    echo \* all the arguments

    ```


    Below is the output of script above in action.


    ```

    [paul@RHEL4a scripts]$ ./pars one two three

    The first argument is one

    The second argument is two

    The third argument is three

    $ 5610 PID of the script

    # 3 count arguments

    ? 0 last return code

    * one two all the arguments

    ```


    Once more the script, but with only two parameters.


    ```

    [paul@RHEL4a scripts]$ ./pars 1 2

    The first argument is 1

    The second argument is 2

    The third argument is

    $ 5612 PID of the script

    # 2 count arguments

    ? 0 last return code

    * 2 all the arguments

    [paul@RHEL4a scripts]$

    ```


    Here is another example, where we use $0. The $0 parameter contains the name of
    the script.


    ```

    paul@debian6-$ $ cat myname

    echo this script is called $0

    paul@debian6-$ $ /myfile

    this script is called ./myfile

    paul@debian6-$ $ mv myname test42

    paul@debian6-$ $ ./test42

    this script is called ./test42

    ```'
  merge: -1
  pgno: 257
