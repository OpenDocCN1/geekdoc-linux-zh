  md: '# Chapter 17. file globbing


    The shell is also responsible for file globbing (or dynamic filename generation).
    This chapter will explain file globbing.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# 17.1. * asterisk


    The asterisk * is interpreted by the shell as a sign to generate filenames, matching
    the asterisk to any combination of characters (even none). When no path is given,
    the shell will use filenames in the current directory. See the man page of glob(7)
    for more information. (This is part of LPI topic 1.103.3.)


    ```

    [paul@RHELv4 gen]$ ls

    file1 file2 file3 File4 File55 FileA Fileab Fileab FileAB fileabc

    [paul@RHELv4 gen]$ ls File*

    File4 File55 FileA Fileab FileAB

    [paul@RHELv4 gen]$ ls file*

    file1 file2 file3 fileab abc

    [paul@RHELv4 gen]$ ls *file55 gen

    File55

    [paul@RHELv4 gen]$ ls F*55

    File55

    ```


    # 17.2. ? question mark


    Similar to the asterisk, the question ? is interpreted by the shell as a sign
    to generate filenames, the question mark with exactly one character.


    ```

    [paul@RHELv4 gen]$ ls

    file1 file2 file3 File4 File55 FileA fileab Fileab FileAB fileabc

    [paul@RHELv4 gen]$ ls File?

    File4 FileA

    [paul@RHELv4 gen]$ ls Fil?

    File4

    [paul@RHELv4 gen]$ ls File??

    File55 Fileab FileAB

    [paul@RHELv4 gen]$

    ```'
  merge: -1
  pgno: 171
- img_proc: true
  md: "# 17.3. [] square brackets\n\nThe square bracket [ is interpreted by the shell\
    \ as a sign to generate filenames, matching any of the characters between [ and\
    \ the first subsequent ]. The order in this list is not important. Each pair of\
    \ brackets is replaced by exactly one.\n\n```\npaul@RHELv4u3 gen$ ls\nfile1 file2\
    \ file3 File4 File55 FileA fileab Fileab FileAB fileabc\npaul@RHELv4u3 gen$ ls\
    \ File[5A]\nFileA\npaul@RHELv4u3 gen$ ls File[A5]\nFileA\npaul@RHELv4u3 gen$ ls\
    \ File[A5] [5b]\nFile5b\npaul@RHELv4u3 gen$ ls File[a] [5b] [abcdefghijkl]\nls:\
    \ File[a](5b][abcdefghijkl]: No such file or directory\npaul@RHELv4u3 gen$ ls\
    \ File[a] [5b] [abcdefghijkl]\nfileab\npaul@RHELv4u3 gen$ \n```\n\nYou can also\
    \ exclude characters from a list between square brackets with the exclamation\
    \ mark! And you are allowed to make combinations of these wild cards.\n\n```\n\
    paul@RHELv4u3 gen$ ls\nfile1 file2 file3 File4 File55 FileA fileab Fileab FileAB\
    \ fileabc\npaul@RHELv4u3 gen$ ls File[a][!Z]\nfileab\npaul@RHELv4u3 gen$ ls File[!5]*\n\
    file file2 file3 fileab fileabc\npaul@RHELv4u3 gen$ ls File[!5]?\nfileab\npaul@RHELv4u3\
    \ gen$ \n```"
  merge: -1
  pgno: 172
- img_proc: true
  md: '# 17.4. a-z and 0-9 ranges


    The bash RHEL shell will understand ranges of characters between brackets.


    ```

    paul@RHELvau3 gen$ ls

    file1 file3 file55 fileab FileAB fileabc

    file2 File4 FileA Fileab fileab2

    paul@RHELvau3 gen$ ls file[a-z]*

    fileab fileab2 fileabc

    paul@RHELvau3 gen$ ls file[0-9]

    file1 file2 file5

    paul@RHELvau3 gen$ ls file[a-z][0-9]*

    fileab

    paul@RHELvau3 gen$

    ```


    # 17.5. LANG and square brackets


    But, don''t forget the influence of the LANG variable. Some languages include
    lower case letters in an upper range (and vice versa).


    ```

    paul@RHELvau4~/test$ ls [A-Z]?

    file1 file2 file4

    paul@RHELvau4~/test$ ls [a-z]?

    file1 file2 file3

    paul@RHELvau4~/test$ echo $LANG

    en_US.UTF-8

    paul@RHELvau4~/test$ echo LANG=C

    paul@RHELvau4~/test$ ls [a-z]?

    file1 file2

    paul@RHELvau4~/test$ ls [A-Z]?

    file4

    paul@RHELvau4~/test$

    ```


    If $LC_ALL is set, then this will also need to be reset to prevent file globbing.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# 17.6 preventing file globbing


    The screenshot below should be no surprise. The echo * will echo a * when in an
    empty directory. And it will echo the name of all files when the directory is
    not empty.


    ```

    paul@ubu1010:-$ mkdir test42

    paul@ubu1010:-$ cd test42

    paul@ubu1010:~/test42$ echo *

    \*

    paul@ubu1010:~/test42$ touch file42 file33

    paul@ubu1010:~/test42$ echo *

    file33 file42

    ```


    Globbing can be prevented using quotes or by escaping the special characters,
    as shown in this screenshot.


    ```

    paul@ubu1010:~/test42$ echo *

    file33 file42

    paul@ubu1010:~/test42$ echo \\*

    *

    paul@ubu1010:~/test42$ echo ''**''

    \*\*\*

    ```'
