  md: '# 10.1. head


    You can use **head** to display the first ten lines of a file.


    ```

    paul@debian7~$ head /etc/passwd

    root:x:0:0:root:/root:/bin/bash

    demon:x:1:1:daemon:/usr/sbin:/bin/sh

    bin:x:2:2:bin:/bin:/sh

    sys:x:3:3:sys:/dev:/sh

    sync:x:4:65534:sync:/bin:/sync

    games:x:5:60:game:/usr/bin:/sh

    man:x:6:12:man:/var/cache/man:/bin/sh

    lp:x:7:7:lp:/var/spool/lpd:/bin/sh

    mail:x:8:8:mail:/var/mail:/bin/sh

    news:x:9:news:/var/spool:/bin/sh

    root@debian7~$

    ```


    The **head** command can also display the first **n** lines of a file.


    ```

    paul@debian7~$ head -4 /etc/passwd

    root:x:0:0:root:/root:/bin/bash

    demon:x:1:1:daemon:/usr/sbin:/bin/sh

    bin:x:2:2:bin:/bin:/sh

    sys:x:3:3:sys:/dev:/sh

    paul@debian7~$

    ```


    **And head** can also display the first **n** bytes.


    ```

    paul@debian7~$ head -c14 /etc/passwd

    root:x:0:0:roopaul@debian7~$

    ```


    # 10.2. tail


    Similar to head, the **tail** command will display the last lines of a file.


    ```

    paul@debian7~$ tail /etc/services

    vboxd      20012/udp

    binkp       24554/tcp

    asp          27374/tcp

    ast          27374/udp

    csync2      30865/tcp

    dircproc     57000/tcp

    ffidos       60177/tcp

    fido        60179/tcp

    paul@debian7~$# binkp findonet protocol

    # Address Search Protocol

    # cluster synchronization tool

    # Detachable IRC Proxy

    # findonet EMSI over telnet

    # findonet EMSI over TCP

    ```


    ```

    # Local services

    paul@debian7~$

    ```


    You can use **tail -n** the number of lines you want to see.


    ```

    paul@debian7~$ tail -3 /etc/services

    fido        60179/tcp      # findonet EMSI over TCP

    ```


    ```

    # Local services

    paul@debian7~$

    ```


    The **tail** command has other useful options, some of which we will use during
    this course.'
