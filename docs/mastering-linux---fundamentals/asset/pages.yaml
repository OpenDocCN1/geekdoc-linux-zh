  md: '# # Chapter 19. filters


    Commands that are created to be used with a pipe are often called filters. These
    filters are very small programs that do one specific thing very efficiently. They
    can be used as building blocks.


    This chapter will introduce you to the most common filters. The combination of
    simple commands and filters in a long pipe allows you to design elegant solutions.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# 19.1. cat


    When between two pipes, the cat command does nothing (except putting stdin on
    stdout).


    ```

    [paul@RHEL4b pipes]$ tac count.txt | cat | cat | cat | cat | cat

    five

    three

    two

    one

    [paul@RHEL4b pipes]$

    ```


    # 19.2. tee


    Writing long pipes in Unix is fun, but sometimes you may want intermediate results.
    This is where tee comes in hand. The tee filter puts stdin on stdout and also
    into a file. So tee is almost the same as cat, except that it has two identical
    outputs.


    ```

    [paul@RHEL4b pipes]$ cat count.txt | tee temp.txt | tac

    one

    tthree

    four

    five

    [paul@RHEL4b pipes]$ cat temp.txt

    five

    four

    tthree

    two

    one

    [paul@RHEL4b pipes]$

    ```


    # 19.3. grep


    The grep filter is famous among Unix users. The most common use of grep is to
    filter lines of text containing (or not containing) a certain string.


    ```

    [paul@RHEL4b pipes]$ cat tennis.txt

    Amelie Mauresmo, Fra

    Kim Clijsters

    Justine Henin, Bel

    Serena Williams, usa

    Venus Williams, usa

    [paul@RHEL4b pipes]$ cat tennis.txt grep Williams

    Serena Williams, usa

    Venus Williams, usa

    ```


    You can write without the cat.


    ```

    [paul@RHEL4b pipes]$ grep Williams tennis.txt

    Serena Williams, usa

    Venus Williams, usa

    ```


    One of the most useful options of grep is grep -i which filters in a case insensitive
    way.


    ```

    [paul@RHEL4b pipes]$ grep Bel tennis.txt

    Justine Henin, Bel

    [paul@RHEL4b pipes]$ grep -i Bel tennis.txt

    ```'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'Kim Clijsters, BEL

    Justine Henin, Bel

    [paul@RHEL4b pipes]$


    Another very useful option is **grep -v** which outputs lines not matching the
    string.


    ```

    [paul@RHEL4b$ grep -v usa Fra tennis.txt

    Kim Clijsters, BEL

    Justine Henin, Bel

    Serena Williams, usa

    Venus Williams, USA

    [paul@RHEL4b pipes]$

    ```


    And of course, both options can be combined to filter all lines not containing
    a sensitive string.


    ```

    [paul@RHEL4b pipes]$ grep -vi usa

    Amelie Mauremo, fra

    Kim Clijsters, BEL

    Justine Henin, Bel

    [paul@RHEL4b pipes]$

    ```


    # With **grep -A1** one line after the result is also displayed.


    ```

    paul@debian5:-~/pipes$ grep -A1 Henin tennis.txt

    Kim Clijsters, BEL

    Justine Henin, Bel

    Serena Williams, usa

    ```


    # With **grep -B1** one line before the result is also displayed.


    ```

    paul@debian5:-~/pipes$ grep -B1 Henin tennis.txt

    Kim Clijsters, BEL

    Justine Henin, Bel

    ```


    With **grep -C1** (context) one line **before** and one **after** are also displayed.
    All three options (A,B, and C) can display any number of lines (using e.g. A2,
    B4 or C20).


    ```

    paul@debian5:-~/pipes$ grep -C1 Henin tennis.txt

    Kim Clijsters, BEL

    Justine Henin, Bel

    Serena Williams, usa

    ```'
  merge: -1
