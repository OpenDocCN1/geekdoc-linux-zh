- img_proc: true
  md: '# 21.3.4. a global replace


    The syntax used in the previous example can be described as s/regex/replace/.
    This is simple and straightforward, you enter a regex between the first two slashes
    and a replacement string between the last two.


    This expands this syntax only a little, by adding a modifier.


    ```

    paul@pi ~ rename -n /s/TXT/txt/g aTXT.TXT

    aTXT.TXT renamed as txt.txt

    paul@pi ~ $

    ```


    The syntax we now use can be described as s/regex/replacement/g if s signs switch
    and g stands for global.


    Note that this example uses the -n switch to show what is being done (instead
    of actually renaming the file).


    # 21.3.5. case insensitive replace


    Another modifier that can be useful is i. this example shows how to replace a
    case insensitive string with another string.


    ```

    paul@deian:~/files ls

    file1.text file2.TEXT file3.txt

    paul@deian:~/files rename ''s/./txt/txt/i'' *

    paul@deian:~/files ls

    file1.txt file2.txt file3.txt

    paul@deian:~/files$

    ```


    # 21.3.6. renaming extensions


    Command line Linux has no knowledge of MS-DOS like extensions, but many end users
    and graphical application do them.


    Here is an example of how to use rename to rename the file extension. It uses
    the dollar sign to mark the ending of the filename.


    ```

    paul@pi ~ $ ls *.txt

    allfiles.txt bfiletxt.txt cfiles.txt really.txt temp.txt tennis.txt

    paul@pi ~ rename ''s/.txt$/.TXT/'' *.txt

    paul@pi ~ $ ls *.TXT

    allfiles.TXT bfiletxt.TXT cfiles.TXT really.txt.TXT

    temp.TXT tennis.TXT

    paul@pi ~ $

    ```


    Note that the dollar sign in the regex means at the end. Without the dollar sign
    this command would fail on the really.txt.file.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# 21.4. sed


    # 21.4.1. stream editor


    The stream editor or short sed uses regex for stream editing.


    In this example sed is used to replace a string.


    ```

    echo Sunday | sed ''s/Sun/Mon/''

    Monday

    ```


    The slashes can replaced by a couple of characters, which can be handy in some
    cases to improve readability.


    ```

    echo Sunday | sed ''s:Sun:Mon:''

    Monday

    echo Sunday | sed ''s__Sun_Mon_''

    Monday

    echo Sunday | sed ''s|Sun Mon|''

    Monday

    ```


    # 21.4.2. interactive editor


    While sed is meant to be used in a stream, it can also be used interactively on
    a file.


    ```

    paul@debian?:~/files$ echo Sunday > today

    paul@debian?:~/files$ cat today

    Sunday

    paul@debian?:~/files$ sed -i ''s/Sun/Mon/''

    paul@debian?:~/files$ cat today

    Monday

    ```'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# 21.4.3. simple back referencing


    The *ampersand* character can be used to reference the searched (and found) string.


    In this example the *ampersand* is used to double the occurrence of the string.


    ```

    echo Sunday | sed ''s/Sun/&/''

    SunSunday

    echo Sunday | sed ''s/day/&/''

    Sundayday

    ```


    # 21.4.4. back referencing


    Parentheses (often called round brackets) are used to group sections of the regex
    so they can be referenced.


    Consider this example:


    ```

    paul@debian:~\$ echo Sunday | sed ''s/\(Sun)\\1ny_/''

    Sunny

    paul@debian:~\$ echo Sunday | sed ''s/\(Sun)\\1ny \1_/''

    Sunny Sunday

    ```


    # 21.4.5. a dot for any character


    In a *regex* a simple dot can signify any character.


    ```

    paul@debian:~\$ echo 2014-04-01 | sed ''s/....-....-..../YYYY-MM-DD/''

    YYYY-MM-DD

    paul@debian:~\$ echo abc-ef-gh | sed ''s/....-....-..../YYYY-MM-DD/''

    YYYY-MM-DD

    ```


    # 21.4.6. multiple back referencing


    When more than one pair of *parentheses* is used, each of them can be referenced
    separately by consecutive numbers.


    ```

    paul@debian:~\$ echo 2014-04-01 | sed ''s/\(....\)-\(..\)-\(..\)/\1\\2+\\3/''

    2014+04+01

    paul@debian:~\$ echo 2014-04-01 | sed ''s/\(....\)-\(..\)-\(..\)/\3:\\2:\1/''

    01:04:2014

    ```


    This feature is called *grouping*.'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# 21.4.7. white space


    The \s refer to white space such as a space or a tab.


    This example looks for white spaces (\s) globally and replaces them with 1 space.


    ```

    paul@debian:~$ echo -e ''today\tis\twarm''

    today is warm

    paul@debian:~$ echo -e ''today\tis\twarm'' | sed ''s_\s_ _g''

    today is warm

    ```


    # 21.4.8. optional occurrence


    A question signifies that the previous is optional.


    The example below searches for three consecutive letter o, but the third o is
    optional.


    ```

    paul@debian:~$ cat list2

    11

    lol

    loo

    lool

    paul@debian:~$ grep -E ''ooo?'' list2

    lool

    lool

    paul@debian:~$ cat list2 | sed ''s/ooo\?/A/''n11

    lol

    1Al

    1Al

    ```'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# 21.4.9. exactly n times


    You can demand an exact number of times the opvious has to occur.


    This example wants exactly three o''s.


    ```

    paul@debian7:~~$ cat list2

    l1

    lol

    lool

    loool

    paul@debian7:~~$ grep -E ''o(3)'' list2

    lool

    paul@debian7:~~$ cat list2 | sed ''s/o\(3\)/A/''

    l1

    lol

    lool

    lool

    lAl

    paul@debian7:~-$

    ```


    # 21.4.10. between n and m times


    And here we demand exactly from minimum 2 to maximum 3 times.


    ```

    paul@debian7:~~$ cat list2

    l1

    lol

    lool

    loool

    paul@debian7:~~$ grep -E ''o(2,3)'' list2

    lool

    lool

    paul@debian7:~~$ grep ''o\{2,3\}'' list2

    lool

    lool

    paul@debian7:~~$ cat list2 | sed ''s/o\{2,3\}/A/''

    l1

    lol

    lool

    lAl

    lAl

    paul@debian7:~-$

    ```'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# 21.5. bash history


    The bash shell can also interpret some regular expressions.


    This example debian:-$ shows how to manipulate the exclamation mask history feature
    of the bash shell.


    ```

    paul@debian7:-$ mkdir hist

    paul@debian7:-$ cd hist/

    paul@debian7:-~/hist$ touch file1 file2 file3

    paul@debian7:-~/hist$ ls -l file1

    -rw-r--r-- 1 paul 0 Apr 15 22:07 file1

    ls -l file1

    -rw-r--r-- 1 paul 0 Apr 15 22:07 file1

    paul@debian7:-~/hist$ !1:s/3

    ls -l file3

    -rw-r--r-- 1 paul 0 Apr 15 22:07 file3

    paul@debian7:-~/hist$

    ```


    This also works with the history numbers in bash.


    ```

    paul@debian7:-~/hist$ history 6

    2089 mkdir hist

    2090 cd hist/

    2091 touch file1 file2 file3

    2092 ls -l file1

    2093 ls -l file3

    2094 history 6

    paul@debian7:-~/hist$ !2092

    ls -l file1

    -rw-r--r-- 1 paul 0 Apr 15 22:07 file1

    paul@debian7:-~/hist$ !2092:s/1/2

    ls -l file2

    -rw-r--r-- 1 paul 0 Apr 15 22:07 file2

    paul@debian7:-~/hist$

    ```'
  merge: -1
