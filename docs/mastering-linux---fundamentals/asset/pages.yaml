  md: '# 29.8. disabling a password


    Passwords in /etc/shadow cannot begin with an exclamation mark. When the second
    field in /etc/passwd starts with an exclamation mark, then the password can not
    be used.


    Using this feature is often called **locking, disabling, or suspending** a user
    account. Besides vi (or vip) you can also accomplish this with **usermod**.


    The first command in the next screenshot will show the password of **laura** in
    /etc/shadow. The next command disables the password of **laura**, making it impossible
    for Laura to authenticate using this password.


    ```

    root@debian:~# grep /etc/shadow | cut -c1-7

    laura:$66JYJ4JZgp$stwWkAcP30tEI1R2auE87j.nbW.pdDKNUYVk7mChfCVMA3CoDoUJJV

    root@debian:~# usermod -l laura

    ```


    As you can see below, the password hash is simply preceded with an exclamation
    mark.


    ```

    root@debian:~# grep /etc/shadow | cut -c1-7

    laura:$66JYJ4JZgp$stwWkAcP30tEI1R2auE87j.nbW.pdDKNUYVk7mChfCVMA3CoDoUJJV

    root@debian:~#

    ```


    The user (and users with **sudo rights on su**) will still be able to **su into**
    the **laura account** (because the password is not needed!). Note that **laura**
    will still be able to login if she has set up password ssh!


    ```

    root@debian:~# su - laura

    laura@debian:~#

    ```


    You can unlock the account again with **usermod -U**.


    ```

    root@debian:~# usermod -U laura

    root@debian:~# grep /etc/shadow | cut -c1-7

    laura:$66JYJ4JZgp$stwWkAcP30tEI1R2auE87j.nbW.pdDKNUYVk7mChfCVMA3CoDoUJJV

    ```


    Watch out for differences in the command line of **passwd, user,** and **usermod**
    on Linux distributions. Verify the local files when using features like **"disabling,
    suspending, or locking"** on user accounts and their passwords.


    # 29.9. editing local files


    If you still want to manually edit the **etc/passwd** or **/etc/shadow**, after
    knowing these commands for password management, use **vip** instead of vi(m) directly.
    The **vip** tool will do proper locking of the file.


    ```

    [root@RHEL5]# vip /etc/passwd

    vip: the password file is busy (/etc/ptmp present)

    ```'
  merge: -1
