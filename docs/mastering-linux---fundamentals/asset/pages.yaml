- img_proc: true
  md: '# 19.4. cut


    The cut filter can select columns from files, depending on a delimiter or a count
    of bytes. The screenshot below uses cut to filter for the username and userid
    in the /etc/passwd file. It uses the colon as a delimiter, and selects fields
    1 and 3.


    ```

    [paul@RHEL4b pipes]$$ cut -d: -f1,3 /etc/passwd | tail -4

    Figo:510

    Pfaff:511

    Harry:516

    Hermione:517

    [paul@RHEL4b pipes]$

    ```


    When using a space as the delimiter for cut, you have to quote the space.


    ```

    [paul@RHEL4b pipes]$$ cut -d" " -f1 tennis.txt

    Amelie

    Kim

    Justine

    Serena

    Venus

    [paul@RHEL4b pipes]$

    ```


    This example uses cut to display the second to the seventh character of /etc/passwd.


    ```

    [paul@RHEL4b pipes]$$ cut -c2-7 /etc/passwd | tail -4

    igo:x

    affix:x

    arry:x

    erion

    [paul@RHEL4b pipes]$

    ```


    # 19.5. tr


    You can translate characters with tr. The screenshot shows the translation of
    all occurrences of e to E.


    ```

    [paul@RHEL4b pipes]$$ cat tennis.txt | tr ''e'' ''E''

    AmElie Maursmo, Fra

    Kim Clijsters, BEL

    JustinE Heinin, BEL

    SELENA Williams, usa

    VENUS Williams, USA

    [paul@RHEL4b pipes]$

    ```


    Here we translate all letters to uppercase using two ranges.


    ```

    [paul@RHEL4b pipes]$$ cat tennis.txt | tr ''a-z'' ''A-Z''

    AMELIE MAURSMO, FRA

    KIM CLIJSTERS, BEL

    JUSTINE HEinin, BEL

    SERENA WILLIAMS, USA

    VENUS WILLIAMS, USA

    [paul@RHEL4b pipes]$

    ```


    Here we translate all newlines to spaces.


    ```

    [paul@RHEL4b pipes]$$ cat count.txt

    one

    two

    ```'
