  md: '# 20.12. solution: basic Unix tools


    1. Explain the difference between these two commands. This question is very important.
    If you don''t know the answer, then look back at the shell chapter.


    ```

    find /data -name "*.txt"

    find /data -name *.txt

    ```


    When *.txt is quoted then the shell will not touch it. The **find** tool will
    look in the **/data** for all files ending in **txt**.


    When *.txt** is not quoted the shell might expand this (when one or more files
    ends in **txt** exist in the current directory). The **find** might show a different
    result, or can result in a syntax error.


    2. Explain the difference between these two statements. They will both work when
    there are 200_.od files in /data when there are 2 million .od files ?


