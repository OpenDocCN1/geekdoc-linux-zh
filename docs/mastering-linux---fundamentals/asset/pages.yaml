  md: '# 11.8. /usr System Resources


    Although usr is pronounced like user, remember that it stands for Unix System
    Resources. The /usr hierarchy should contain shareable, read only data. Some people
    choose to mount /usr as read only. This can be done from its own partition or
    from a read only NFS share (NFS is discussed later).


    # 11.8.1. /usr/bin


    The /usr/bin directory contains a lot of commands.


    ```

    paul@deb508:~$ ls /usr/bin | wc -l

    1395

    ```


    (On Solaris the /bin directory is a symbolic link to /usr/bin).


    # 11.8.2. /usr/include


    The /usr/include directories contain general files for C.


    ```

    paul@bub010:~$ ls /usr/include/

    ailib.h expat_config.h math.h search.h

    af_vs.h expat_external.h mcheckck.h semaphore.h

    asio.h expat.h memory.h setjmp.h

    Al fcntl.h menu.h sgtty.h

    aliases.h features.h mntent.h shadow.h

    ...

    ```


    # 11.8.3. /usr/lib


    The /usr/lib directory contains libraries that are not directly executed by users
    or scripts.


    ```

    paul@deb508:~$ ls /usr/lib | head -7

    4suite

    ao

    apt

    arj

    assell

    avahi

    bonobo

    ```


    # 11.8.4. /usr/local


    The /usr/local directory can be used by an administrator to install software locally.


    ```

    paul@deb508:~$ ls /usr/local/

    bin etc games include lib man share src

    paul@deb508:~$ du -sh /usr/local/

    128K /usr/local/

    ```


    # 11.8.5. /usr/share


    The /usr/share directory contains architecture independent data. As you can see,
    this is a fairly large directory.


    ```

    paul@deb508:~$ ls /usr/share/ | wc -1

    ```'
