  md: '# 15.4. solution: shell embedding


    +   1. Find the list of shell options in the man page of bash. What is the difference
    between set -u and set -o nounset?


    read the manual of bash (man bash), search for nounset -- both mean the same thing.


    +   2. Activate nounset in your shell. Test that it shows an error message when
    using non-existing variables.


    ```

    set -u

    set -o nounset

    ```


    Both lines have the same effect.


    +   3. Deactivate nounset.


