  md: '# Chapter 20. basic Unix tools


    This chapter introduces commands to **find** or **locate** files and to **compress**
    files, together with other common tools that were not discussed before. While
    the tools discussed here are technically not considered **filters**, they can
    be used in **pipes**.'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# # 20.1. find


    The find command can be very useful at the start of a pipe to search for files.
    Here are some examples. You might want to add 2>/dev/null to the command lines
    to avoid cluttering your screen with error messages.


    Find files in /etc and put the list in etcfiles.txt


    ```

    find /etc > etcfiles.txt

    ```


    Find all of the entire system and put the list in allfiles.txt


    ```

    find / > allfiles.txt

    ```


    Find files that end in .conf in the current directory (and all subdirs).


    ```

    find -name "*.conf"

    ```


    Find files of type file (not directory, pipe or etc.) that end in .conf.


    ```

    find -type f -name "*.conf"

    ```


    Find files of type directory that end in .bak.


    ```

    find /data -type d -name "*.bak"

    ```


    Find files that are newer than file42.txt


    ```

    find . -newer file42.txt

    ```


    Find can also execute another command on every file found. This example will look
    for *.odf files and copy them to /backup/.


    ```

    find /data -name "*.odf" -exec cp {} /backup/ \;

    ```


    Find can also execute, after your confirmation, another command on every file
    found. This example will remove *.odf files if you approve of it for every file
    found.


    ```

    find /data -name "*.odf" -ok rm {} \;

    ```'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# 20.2. locate


    The locate tool is very different from find that it uses an index to locate files.
    This is a lot faster than traversing the directories, but it also means that it
    is always outdated. If the index does not exist, then you have to create it (as
    root on Red Enterprise Linux) with the updatedb command.


    ```

    [paul@RHEL4b ~]$ ls Samba

    warning: locate: could not open database: /var/lib/slocate/locate.db...

    warning: you need to run the ''updatedb'' command (as root) to create th...

    Please have a look at /etc/updatedb.conf to enable the daily cron job.

    [paul@RHEL4b ~]$ updatedb

    fatal error: updatb: You are not authorized to create a default sloc...

    [paul@RHEL4b ~]$ su

    Password:

    [root@RHEL4b ~]$ updatedb

    [root@RHEL4b ~]#

    ```


    Most Linux distributions will schedule the updatedb to run once every day.


    # 20.3. date


    The date command can display the date, time, zone and more.


    ```

    paul@rhel55 ~$ date

    Sat Apr 17 12:44:30 CEST 2010

    ```


    A date string can be customised to display the format of your choice. Check the
    man page for more options.


    ```

    paul@rhel55 ~$ date ''+%A %d-%m-%Y''

    Saturday 17-04-2010

    ```


    Time on Unix is calculated in number of seconds since 1969 (the first second being
    the first second of the first of January 1970). Use **date %+s** to display Unix
    time in seconds.


    ```

    paul@rhel55 ~$ date +%s

    1271501080

    ```


    When this seconds counter reach two thousand million ?


    ```

    paul@rhel55 ~$ date -d ''1970-01-01 + 2000000000 seconds''

    Wed May 18 04:43:20 CEST 2033

    ```'
  merge: -1
  pgno: 206
