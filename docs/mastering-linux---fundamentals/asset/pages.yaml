- img_proc: true
  md: '# Chapter 30. user profiles


    Logged-on users have a number of preset (and customized) aliases, variables, and
    functions,

    but where do they come from ? The **shell** uses a number of startup files that
    are executed

    or rather **sourced**) whenever the shell is invoked. What follows is an overview
    of startup scripts.'
  merge: -1
  pgno: 300
- img_proc: true
  md: "# 30.1. system profile\n\nBoth the **bash** and **ksh** shell will verify the\
    \ existence of `/etc/profile` and **source** it if it exists.\n\nWhen reading\
    \ this, you will notice (both on Debian and on Red Hat Enterprise Linux) that\
    \ it builds the PATH environment variable (among others). The script might also\
    \ change the PS1 variable, set the HOSTNAME and execute even more scripts like\
    \ `/etc/inputrc`\n\nThis screenshot uses grep to show PATH manipulation in `/etc/profile`\
    \ on Debian.\n\n```\nroot@debian7:~# # grep PATH /etc/profile\nPATH=/usr/local/bin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\"\
    \nPATH=/usr/local/bin:/usr/bin:bin:/usr/local/games:/usr/games\"\nexport PATH\n\
    root@debian7:~# #\n```\n\nThis screenshot uses grep to show PATH manipulation\
    \ in `/etc/profile` on RHEL/CentOS.\n\n```\n[root@centos7 ~]# # grep PATH /etc/profile\n\
    case :$(PATH) in\n\tPATH=$1\n\tPATH=$1$PATH\nexport PATH USER LOGNAME MAIL HOSTNAME\
    \ SIZE HISTCONTROL\n[root@centos7 ~]# #\n```\n\nThe **root** user can use this\
    \ script to set aliases, functions, and variables for every user on the system.\n\
    \n# 30.2. ~/.bash_profile\n\nWhen this file exists in the home directory, **bash**\
    \ will source it. On Debian Linux 5/6/7 this file does not exist by default.\n\
    \nRHEL/CentOS uses a `~/.bash_profile` where it checks for the existence of `~/.bashrc`\
    \ and then adds `$HOME` to the `$PATH` variable.\n\n```\n[root@rhel7 ~]# # cat\
    \ /home/paul/.bash_profile\n# . .bash_profile\n\n# Get the aliases and functions\n\
    if [ -f ~/.bashrc ]; then\n\t~/.bashrc\nfi\n\n# User specific environment and\
    \ startup programs\n\nPATH=$PATH:$HOME/.local/bin:/bin\n\nexport PATH\n[root@rhel7\
    \ ~]# #\n```"
  merge: -1
  pgno: 301
- img_proc: true
  md: "# 30.3. ~/.bash_login\n\nWhen .bash_profile does not exist, then bash will\
    \ check for ~/.bash_login and source it.\n\nNeither Debian nor Red Hat have this\
    \ file by default.\n\n# 30.4. ~/.bash_profile\n\nWhen neither ~/.bash_profile\
    \ and ~/.bash_login exist, then bash will verify the existence of ~/.bash_profile\
    \ and execute it. This file does not exist by default on Red Hat.\n\nOn Debian\
    \ this script can execute ~/.bashrc and will add $HOME/bin to the PATH variable.\n\
    \n```\nroot@debian7:~# tail -l /home/paul/.profile\nif -n \"$BASH_VERSION\" ];\
    \ then\n    include .bashrc if it exists\n    if [ -f \"$HOME/.bashrc\" ]; then\n\
    \        \"$HOME/.bashrc\"\n    fi\nfi\n```\n\n```\n# set PATH so it includes\
    \ user's private bin if it exists\nif [ -d \"$HOME/bin\" ]; then\n    PATH=\"\
    $HOME/bin:$PATH\"\nfi\n```\n\nRHEL/CentOS does not have this file by default.\n\
    \n# 30.5. ~/.bashrc\n\nThe ~/.bashrc script is sourced by other scripts. Let us\
    \ take a look at what it does by default.\n\nRed Hat uses a very simple ~/.bashrc,\
    \ checking for /etc/bashrc and sourcing it. It also leaves room for custom aliases\
    \ and functions.\n\n```\nroot@rel7 ~# cat /home/paul/.bashrc\n# .bashrc\n\n# Source\
    \ global definitions\nif [ -f /etc/bashrc ]; then\n    /etc/bashrc\nfi\n\n# Uncomment\
    \ the following line if you don't have systemctl's auto-paging feature:\n# export\
    \ SYSTEMD_PAGER=\n\n# User specific aliases and functions\n```\n\nOn Debian this\
    \ script is a bit longer and configures $PS1, some history variables and a number\
    \ of active and inactive aliases.\n\n```\nroot@debian7:-# wc -l /home/paul/.bashrc\n\
    110 /home/paul/.bashrc\n```"
  merge: -1
  pgno: 302
- img_proc: true
  md: "# 30.6. ~/.bash_logout\n\nWhen exiting bash, it can execute ~/.bash_logout.\n\
    \nDebian use this opportunity to clear the console screen.\n\n```\nserena@deb503:~$\
    \ cat .bash_logout\n# ~/.bash_logout: executed by bash (1) when login shell exits.\n\
    # when leaving the console clear the screen to increase privacy\n\nif [ \"$SHLV\"\
    \ = 1 ]; then\n  [ -x /usr/bin/clear_console ] && /usr/bin/clear_console -q\n\
    fi\n```\n\nRed Enterprise Linux 5 will simply call the /usr/bin/clear command\
    \ in this script.\n\n```\nserena@rhel53 ~$ cat .bash_logout\n# ~/.bash_logout\n\
    /usr/bin/clear\n```\n\nRed Hat Linux 6 and 7 create this file, but leave it empty\
    \ (except for a comment).\n\n```\npaul@rhel65:~$ cat .bash_logout\n# ~/.bash_logout\n\
    ```"
  merge: -1
  pgno: 303
- img_proc: true
  md: '# 30.7. Debian overview


    Below is a table overview of Debian is running any of these bash startup scripts.


    Table 30.1. Debian User Environment


    | script | su | su - | ssh | gdm |

    | --- | --- | --- | --- | --- |

    | ~/.bashrc | no | yes | yes | yes |

    | ~/.profile | no | yes | yes | yes |

    | /etc/profile | no | yes | yes | yes |

    | /etc/bashrc | yes | no | no | yes |


    # 30.8. RHEL5 overview


    Below is a table overview of Red Hat Enterprise Linux 5 is running any of these
    bash startup scripts.


    Table 30.2. Red Hat User Environment


    | script | su | su - | ssh | gdm |

    | --- | --- | --- | --- | --- |

    | ~/.bashrc | yes | yes | yes | yes |

    | ~/.bash_profile | no | yes | yes | yes |

    | /etc/profile | no | yes | yes | yes |

    | /etc/bashrc | yes | yes | yes | yes |'
  merge: -1
