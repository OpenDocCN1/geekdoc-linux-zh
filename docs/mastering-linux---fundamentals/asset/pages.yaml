  md: '# 11.6. data directories


    # 11.6.1. /home


    Users can store personal or project data under /home. It is common (but not mandatory
    for the lhs) practice to name the users home directory after the user name in
    the format /home/$USERNAME. For example:


    ```

    paul@ubu606:-$ ls /home

    geert annik paul tom

    ```


    Besides giving every user (or every project or group) a location to store personal
    files, the home directory of a user also serves as a location to store the profile
    file. A typical Unix user profile contains many hidden files (whose name start
    with a dot). The hidden files of the Unix user profile contain settings for that
    of user.


    ```

    paul@ubu606:-$ ls -d /home/*

    /home/paul/ /home/paul/.bash_profile /home/paul/.ssh

    /home/paul/. /home/paul/.bashrc /home/paul/.viminfo

    /home/paul/.bash_history /home/paul/.lesshst

    ```


    # 11.6.2. /root


    On many systems /root is the default location for personal data and profile of
    the root user. If it does not exist by default, then administrators create it.


    # 11.6.3. /srv


    You may use /srv for data that is served by your system. The FHS allows locating
    cvs, rsync, ftp and wwww data in this location. Since the FHS also approves administrative
    naming in /srv, like /srv/project55/ftp and /srv/sales/www.


    On Sun Solaris (or Oracle Solaris) /export is used for this purpose.


    # 11.6.4. /media


    The /media directory serves as a mount point for removable media devices as CD-ROMs,
    digital cameras, and various usb-attached devices. Since /media is rather new
    in the Unix world, you could well encounter systems running without this directory.
    Solaris 9 does not have it, Solaris 10 does. Most Linux distributions today mount
    all removable media in /media.


    ```

    paul@debian5:-$ ls /media/

    cdrom cdrom0 usbdisk

    ```


    # 11.6.5. /mnt


    The /mnt directory should be empty and should only be used for temporary mount
    points (according to the FHS).'
  merge: -1
  pgno: 116
- img_proc: true
  md: 'Unix and Linux administrators used to create many directories here, like /mnt/something/.
    You likely will encounter many systems with more than one directory created and/or
    mounted inside /mnt to be used for various local and remote filesystems.


    # 11.6.6. /tmp


    Applications and users should use /tmp to store temporary data when needed. Data
    stored in /tmp may use either disk space or RAM. Both of which are managed by
    the operating system. Never use /tmp to store data that is important or which
    you wish to archive.'
