    9. Display /proc/interrupts. What is the size of this file ? Where is this file
    stored ?


    The size is zero, you get the contents data. It is not stored anywhere because
    /proc is a virtual file system that allows you to talk with the kernel. (If you
    answered "stored in RAM-memory, that is also correct..)


    10. Can you enter the /root directory ? Are there (hidden) files ?


    Try "cd /root". The /root directory is not accessible for normal users on most
    modern Linux sys


    11. If areconfig, fdisk, parted, shutdown and grub-install present in /sbin ?
    Why are these binaries in /sbin and not in /bin ?


    Because those files are only meant for system administrators.


    12. Is /var/log a file or a directory ? What about /var/spool ?


