  md: '# Chapter 15. shell embedding and options


    This chapter takes a brief look at child shells, embedded shells and shell options.'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# 15.1. shell embedding


    Shells can be embedded on the command line, or in other words, the command line
    scan can spawn new processes containing a fork of the current shell. You can use
    variables to prove that new shells are created. In the screenshot, the variable
    $var1 only exists in the (temporary) shell.


    ```

    [paul@RHELv43 gen]$ echo $var$

    [paul@RHELv4u3 gen]$ echo $var=5; $(var=echo $var1)

    5

    [paul@RHELv4u3 gen]$ echo $var1

    [paul@RHELv4u3 gen]$

    ```


    You can embed a shell in an embedded shell, this is called nested embedding of
    shells.


    This screenshot shows an embedded shell inside an embedded shell.


    ```

    paul@deb503:-$ A=shell

    paul@deb503:-$ echo $C$B$A$ $(B=sub;C$B$A); echo $(C=sub;C$B$A)

    shell shell subshell

    ```


    # 15.1.1. backticks


    Single embedding can be useful avoid changing your current directory. The screenshot
    uses backticks instead of dollar-bracket to embed.


    ```

    [paul@RHELv4u3]$ echo ''cd /etc; ls -d * | grep pass$

    passwd passwd- passwd passwd.OLD

    [paul@RHELv4u3]$

    ```


    You can only use the $(() notation to nest embedded shells, backticks cannot do
    this.


    # 15.1.2. backticks or single quotes


    Placing the embedding between backticks uses one character less than the dollar
    and parenthesis combo. Be careful however, backticks are often confused with single
    quotes. The technical difference between '' '' and ` ` is significant


    ```

    [paul@RHELv4u3 gen]$ echo ''var=5;echo $var1''

    5

    [paul@RHELv4u3 gen]$ echo ''var=5;echo $var1

    var=5;echo $var1

    [paul@RHELv4u3 gen]$

    ```'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# 15.2. shell options


    Both set and unset are builtin shell commands. They can be used to set options
    of the bash shell itself. The next example will clarify this. By default, the
    shell will treat unset variables as a variable having no value. By setting the
    -u option, the shell will treat any reference to as an error. See the page of
    bash for more information.


    ```

    [paul@RHEL4b ~]$ echo $var123


    [paul@RHEL4b ~]$ set -u

    [paul@RHEL4b ~]$ echo $var123

    -bash: var123: unbound variable

    [paul@RHEL4b ~]$ set +u

    [paul@RHEL4b ~]$ echo $var123


    [paul@RHEL4b ~]$

    ```


    To list all the options for your shell, use echo $-$. The noclobber (or -C) option
    will be explained later in this book (in the I/O redirection chapter).


    ```

    [paul@RHEL4b ~]$ echo $-

    himBH

    [paul@RHEL4b ~]$ set -C ; set -u

    [paul@RHEL4b ~]$ echo $-

    himCH

    [paul@RHEL4b ~]$ set +C ; set +u

    himBH

    [paul@RHEL4b ~]$

    ```


    When typing set without options, you get a list of all variables without function
    when the shell is on posix mode. You can set bash in posix mode typing set -o
    posix.'
