  md: '# # Chapter 32. standard file permissions


    This chapter contains details about basic file security through file ownership
    and file permissions.'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# 32.1. file ownership


    # 32.1.1. user owner and group owner


    The users and groups of a system can be locally managed in /etc/passwd and /etc/group,
    or they can be in a NIS, LDAP, or Samba domain. Actually, every file has a user
    owner and a group owner, as can be seen in the following screenshot.


    ```

    paul@rei65:~/$ ls -lh

    total 26K

    -rw-r--r-- 1 paul      1.1K Apr 18:47 data.odt

    -rw-r--r-- 1 paul      626K Apr 8 18:46 file1

    -rw-r--r-- 1 root tennis    185 Apr 8 18:46 file2

    -rw-rw-r-- 1 root        0 Apr 8 18:47 stuff.txt

    ```


    User paul owns three files; file1 as user owner and has the group owner, data.odt
    is owned by the group snooper, file2 by the group tennis.


    The last file is called stuff.txt and is owned by the root user and the root group.


    # 32.1.2. listing user accounts


    You can use the following command to list all local user accounts.


    ```

    paul8@debian7~$$ cut -f1 /etc/passwd | column

    root          sam               naomi

    daemon       mysql            tom               mathias2

    bin          paul             antonio         Bram

    syn          maarten         robrecht        simon            Fabrice

    sync         kevin            bilal             sven              chimene

    games        yuri             dimitri          wouter2          messgebuss

    man          william         ahmed            tarik             roger

    mail         yves             dylan            jan               toon

    news         hamed           matthias        ivan              rinus

    uuccp       voladim         ben               azeddine        eddy

    www-data     david           elcam            bram

    backup       chahid          kenzo            ischa             jeesse

    list         stef            aaron            bart             frederick

    icro         root             omer             hans

    gnats        jens             kurt              steve

    nobody       yannick         jelle            constantin      thomas

    Debian-exim george          stefan          sam2             johan

    statd        joost            marc             bjorn            tom2

    sshd         arno             thomas          ronald

    ```'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# 32.1.3. chgrp


    You can change the group owner of a file using the chgrp command.


    ```

    root@rhel65:/home/paul/owners# ls -l file2

    -rw-r--r-- 1 root tennis 185 Apr 8 18:46 file2

    root@rhel65:/home/paul/owners# chgrp snooker file2

    root@rhel65:/home/paul/owners# ls -l file2

    -rw-r--r-- 1 root snooker 185 Apr 8 18:46 file2

    root@rhel65:/home/paul/owners#

    ```


    # 32.1.4. chown


    The user owner of a file can be changed with chown command.


    ```

    root@laika:/home/paul# ls -l FileForPaul

    -rw-r--r-- 1 root paul 2008-08-06 14:11 FileForPaul

    root@laika:/home/paul# chown paul FileForPaul

    root@laika:/home/paul# ls -l FileForPaul

    -rw-r--r-- 1 paul paul 2008-08-06 14:11 FileForPaul

    ```


    You can also use chown to change both the user owner and the group owner.


    ```

    root@laika:/home/paul# ls -l FileForPaul

    -rw-r--r-- 1 paul paul 2008-08-06 14:11 FileForPaul

    root@laika:/home/paul# chown root:project42 FileForPaul

    root@laika:/home/paul# ls -l FileForPaul

    -rw-r--r-- 1 root project42 0 2008-08-06 14:11 FileForPaul

    ```'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# 32.2. list of special files


    When you use ls l, for each file you can see ten characters before the user and
    group owner. The first character tells us the type of file. Regular files get
    a - , directories get a d, symbolic links are shown with an l, pipes get a p,
    character devices a c, block devices a b, and sockets an.


    | first character | file type |

    | --- | --- |

    | - | normal file |

    | d | directory |

    | l | symbolic link |

    | p | named pipe |

    | b | block device |

    | c | character device |

    | s | socket |


    Table 32.1. Unix special files


    Below a screenshot of a character device (the console) and a block device (the
    hard disk).


    ```

    paul@debian6t- $ ls -ld /dev/console /dev/sda

    crw------ 1 root root 5,1 Mar 15 12:45 /dev/console

    br-rw---- 1 root disk 8,0 Mar 15 12:45 /dev/sda

    ```


    And here you can see a directory, a regular file and a symbolic link.


    ```

    paul@debian6t-$ $ ls -ld /etc /etc/hosts /motd

    drwxr-xr-x 128 root root 12288 Mar 15 18:34 /etc

    -rw-r--r-- 1 root root 372 Dec 10 17:36 /etc/hosts

    lrwxrxr-wx 1 root root 13 Dec 5 10:36 /etc/motd -> /var/run/motd

    ```'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# 32.3. permissions


    # 32.3.1. rwx


    The nine characters following the file type denote the permissions in three triplets.
    A permission can be r for read access, w for write access, and x for execute.
    You need the r permission to list (ls) the contents of a directory. You need the
    x permission to enter (cd) a directory. You need the w permission to create files
    in or remove files from a directory.


    Table 32.2. Unix file permissions


    | permission | on a file | on a directory |

    |---|---|--|

    | r (read) | read file contents (cat) | read directory contents (ls) |

    | w (write) | change file contents (vi) | create files in (touch) |

    | x (execute) | execute the file | enter the directory (cd) |


    # 32.3.2. sets of rwx


    We already know that the output of ls - starts with ten characters for each file.
    The screenshot shows a regular file (because the first character is a -).


    ```

    paul@RHELv4:~$ ls -l proc42.bash

    -rw-xr-xr-- 1 paul proj 984 Feb 6 12:01 proc42.bash

    ```


    Below is a table describing the function of all ten characters.


    Table 32.3. Unix file permissions position


    | position | characters | function |

    |---|---|--|

    | 1 | - | this is a regular file |

    | 2-4 | rwx | permissions for the user owner |

    | 5-7 | r-x | permissions for the group owner |

    | 8-10 | r-- | permissions for others |


    When you are the user owner of a file, then the user owner permissions apply to
    you. The rest of the permissions have no influence on your access to the file.


    When you belong to the group that is the group owner of a file, then the group
    owner permissions apply to you. The rest of the permissions have no influence
    on your access to the file.


    When you are not the user owner of a file and you do not belong to the group owner,
    then the others permissions apply to you. The rest of the permissions have no
    influence on your access to the file.'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# 32.3.3. permission examples


    Some example combinations on files and directories are seen in this screenshot.
    The name of the file explains the permissions.


    ```

    paul@laika:~/perms$ ls -1h

    total 12K

    drwxr-xr-x 2 paul 4.0K 2007-02-07 22:26 AllEnter_UserCreateDelete

    -rw-rw-rw-- 1 paul 0 2007-02-07 22:21 EveryoneFullControl.txt

    -r--r--r-- 1 paul 0 2007-02-07 22:21 OnlyOwnersRead.txt

    --rw-rw---- 1 paul 0 2007-02-07 22:21 OwnersAll_RestNothing.txt

    dr-xr-x-- 2 paul 4.0K 2007-02-07 22:25 UserAndGroupEnter

    dr-x--x 2 paul 4.0K 2007-02-07 22:25 OnlyUserEnter

    paul@laika:~/perms$

    ```


    To summarise, the first **rwx** triplet represents the permissions for the **user
    owner**. The second triplet corresponds to the **group owner**; it specifies permissions
    for all members of that group. The third triplet defines permissions for all **other**
    users that are not the user owner and are not a member of the group owner.'
  merge: -1
