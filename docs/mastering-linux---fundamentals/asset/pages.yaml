- img_proc: true
  md: '# 9.8. rename


    # 9.8.1. about rename


    The rename command is one of the rare occasions where the Linux Fundamentals book
    has to make a distinction between Linux distributions. Almost every command in
    the Fundamentals part of this book works on almost every Linux computer. But rename
    is different.


    Try to use mv whenever you need to rename a couple of files.


    # 9.8.2. rename on Debian/Ubuntu


    The rename command on Debian uses regular expressions (regular expression or sh
    regex are are explained in a later chapter) to rename files at once.


    Below a rename that switches all occurrences of txt to png for file names ending
    in .txt.


    ```

    paul@debian7:~/test42$ ls

    abc.txt file33.txt file42.txt

    paul@debian7:~/test42$ rename ''s/.txt/.png/'' *.txt

    paul@debian7:~/test42$ ls

    abc.png file33.png file42.png

    ```


    This second example switches all (first) occurrences of file for file names ending
    in .png.


    ```

    paul@debian7:~/test42$ ls

    abc.png file33.png file42.png

    paul@debian7:~/test42$ rename ''s/.file/document/'' *.png

    paul@debian7:~/test42$ ls

    abc.png document33.png document42.png

    paul@debian7:~/test42$

    ```


    # 9.8.3. rename on CentOS/RHEL/Fedora


    On Red Hat Linux, the syntax of .conf is a bit different. The first example below
    renames *.conf replacing any occurrence of .conf with .backup.


    ```

    [paul@centos7 ~]$ touch one.conf two.conf three.conf

    [paul@centos7 ~]$ rename .conf .backup *.conf

    [paul@centos7 ~]$ ls

    one.backup three.backup two.backup

    [paul@centos7 ~]$

    ```


    The second example renames all (*) files replacing one with ONE.


    ```

    [paul@centos7 ~]$ ls

    one.backup three.backup two.backup

    [paul@centos7 ~]$ rename one ONE *

    [paul@centos7 ~]$ ls

    ONE.backup three.backup two.backup

    [paul@centos7 ~]$

    ```'
  merge: -1
  pgno: 99
