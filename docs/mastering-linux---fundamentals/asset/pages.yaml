- img_proc: true
  md: '# 12.6. commands


    # 12.6.1. external or builtin commands ?


    Not all commands are external to the shell, some are builtin. External commands
    are programs that have their own binary and reside somewhere in the file system.
    Many external commands are located in /bin or /sbin. Builtin commands are an integral
    part of the shell itself.


    # 12.6.2. type


    To find out whether a command given to the shell will be executed as an external
    command or as a builtin command, use the type command.


    ```

    paul@laika:-$ type cd

    cd is a shell builtin

    paul@laika:-$ type cat

    cat is /bin/cat

    ```


    As you can see, the cd command is builtin and the cat command is external.


    You can also use this command to show whether the command is aliased or not.


    ```

    paul@laika:-$ type ls

    ls is aliased to ls --color=auto''

    ```


    # 12.6.3. running external commands


    Some commands have both builtin and external versions. When one of these commands
    is executed, the builtin version takes priority. To run the external version,
    you must enter the full path to the command.


    ```

    paul@laika:-$ type -a echo

    echo is a shell builtin

    echo is /bin/echo

    paul@laika:-$ /bin/echo Running the external echo command...

    Running the external echo command...

    ```


    # 12.6.4. which


    The which command will search for binaries in the PATH environment variable (variables
    will be explained later). In the screenshot below, it is determined that cd is
    builtin, and ls is, cp, rm, mv, mkdir, and which are all external commands.


    ```

    [root@HEL4b ~] which cp ls cd mkdir pwd

    /bin/cp

    /bin/ls

    /usr/bin/which: no cd in (/usr/kerberos:/usr/kerberos/bin:...

    /bin/mkdir

    /bin/pwd

    ```'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# 12.7. aliases


    # 12.7.1. create an alias


    The shell allows you to create aliases. Aliases are often used to create an easier
    to remember name for an existing command or to easily supply parameters.


    ```

    [paul@RHELv43 ~]$ cat count.txt

    one

    two

    [paul@RHELv43 ~]$ alias dog=tac

    [paul@RHELv43 ~]$ dog count.txt

    tree

    two

    one

    ```


    # 12.7.2. abbreviate commands


    An alias can also be used to abbreviate an existing command.


    ```

    paul@laika~]$ alias ll=''ls -lh --color=auto''

    paul@laika~]$ alias c=''clear''

    paul@laika~]$

    ```


    # 12.7.3. default options


    Aliases can be used to supply commands with default options. The example below
    how to set the -i option when typing rm.


    ```

    [paul@RHELv43 ~]$ rm -i winter.txt

