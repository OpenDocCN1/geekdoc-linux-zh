  md: '# Chapter 16. shell history


    The shell makes it easy for us to repeat commands, this chapter explains how.'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# 16.1. repeating the last command


    To repeat the last command in bash, type !!. This is pronounced as bang bang.


    ```

    paul@debian:~/test42$ echo this will be repeated > file42.txt

    paul@debian:~/test42$ !!

    echo this will be repeated > file42.txt

    paul@debian:~/test42$

    ```


    # 16.2. repeating other commands


    You can repeat other commands using bang followed by one or more characters. The
    shell will repeat the last command that started with those characters.


    ```

    paul@debian:~/test42$ touch file42

    paul@debian:~/test42$ cat file42

    paul@debian:~/test42$ !to

    touch file2

    paul@debian:~/test42$

    ```


    # 16.3. history


    To see old commands, use history to display the shell command history (or use
    history to see the n commands).


    ```

    paul@debian:~$$ history 10

    38 mkdir test

    39 cd test

    40 touch filet

    41 echo hello > file2

    42 echo It is very cold today > winter.txt

    43 ls

    44 ls -1

    45 cp winter.txt summer.txt

    46 ls -l

    47 history 10

    ```


    # 16.4. !n


    When typing ! followed by the number preceding the command you want repeated,
    then the shell will echo the command and execute it.


    ```

    paul@debian:~/test$ !43

    ls

    file1 file2 summer.txt winter.txt

    ```'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# 16.5. Ctrl-r


    Another option is to use **ctrl-r** to search in the history. In the screenshot
    below i only typed **ctrl-r** followed by four characters apti and it finds the
    last command containing these four consecutive characters.


    ```

    paul@debian5:~$ (reverse-i-search)`apti: sudo aptitude install screen

    ```


    # 16.6. $HISTSIZE


    The $HISTSIZE variable determines the number of commands that will be remembered
    by your current environment. Most distributions default this variable to 500 or
    1000.


    ```

    paul@debian5:~$ echo $HISTSIZE

    500

    ```


    You can change it to any value you like.


    ```

    paul@debian5:~$ $HISTSIZE=15000

    paul@debian5:~$ echo $HISTSIZE

    15000

    ```


    # 16.7. $HISTFILE


    The $HISTFILE variable points to the file that contains your history. The **bash**
    shell defaults this value to `~/.bash_history`.


    ```

    paul@debian5:~$ echo $HISTFILE

    /home/paul/.bash_history

    ```


    A session is saved to this file when you **exit** the session!


    Closing a gnome-terminal with the mouse, or typing **reboot** as root will NOT
    save your terminal''s history.


    # 16.8. $HISTFILESIZE


    The number of commands kept in your history file can be set $HISTFILESIZE.


    ```

    paul@debian5:~$ echo $HISTFILESIZE

    15000

    ```'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# # 16.9. prevent recording a command


    You can prevent a command from being recorded in history using a space prefix.


    ```

    paul@debian:~/github$ echo abc

    abc

    paul@debian:~/github$ echo ghi

    def

    paul@debian:~/github$ echo ghi

    ghi

    paul@debian:~/github$ echo history 3

    9501 echo abc

    9502 echo ghi

    9503 history 3

    ```


    # # 16.10. (optional)regular expressions


    It is possible to use regular expressions when using the bang to repeat commands.
    The screenshot below switches 1 into 2.


    ```

    paul@debian5:~/test$ cat file1

    paul@debian5:~/test$ !s:1/2

    cat file2

    hello

    paul@debian5:~/test$

    ```


    # # 16.11. (optional) Korn shell history


    Repeating a command in the Korn shell is very similar. The Korn shell also has
    the history command, but uses the letter r to recall lines from history.


    This screenshot shows the history command. Note the different meaning of the parameter.


    ```

    $ history 17

    17 clear

    18 echo hoi

    19 history 12

    20 echo world

    21 history 17

    ```


    Repeating with r can be combined with the line numbers given by the history command,
    or with the first few letters of the command.


    ```

    $ r

    echo world

    world

    $ cd /etc

    $ r

    cd /etc

    $

    ```'
  merge: -1
  pgno: 167
