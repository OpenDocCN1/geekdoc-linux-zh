  md: '# Chapter 7. man pages


    This chapter will explain the use of man pages (also called manual pages) on your
    Unix or Linux computer.


    You will learn the man command together with related commands like whereis, whatis,
    and mandb.


    Most Unix files and commands have pretty good man pages to explain their use.
    Man pages also come in handy when you are using multiple flavours of Unix or several
    Linux distributions since options and parameters sometimes vary.'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# 7.1. man $command


    Type **man** followed by a command (for which you want help) and start reading.
    Press **q** to quit the manpage. Some man pages contain examples (near the end).


    ```

    paul@laika~$ man whois

    Reformatting whois(1), please wait...

    ```


    # 7.2. man $configfile


    Some **configuration files** have their own manual.


    ```

    paul@laika:~$ man syslog.conf

    Reformatting syslog.conf(5), please wait...

    ```


    # 7.3. man $daemon


    This is also true for most **daemons** (background programs) on your system.


    ```

    paul@laika:~$ man syslogd

    Reformatting syslogd(8), please wait...

    ```


    # 7.4. man -k (apropos)


    **man -k** (apropos) shows a list of man pages containing a string.


    ```

    paul@laika:~$ man -k syslog

    im-syslog-setup (8) - configure laptop mode to syslog.conf ...

    logger (1) - shell command interface to the syslog(3) ...

    syslog-facility (8) - Setup and remove LOCALX facility for syslogd

    syslog.conf (5) - syslogd(8) configuration file

    syslog (8) - Linux system logging utilities.

    syslog-listfiles (8) - list system logfiles

    ```


    # 7.5. whatis


    To see just the description of a man page, use **whatis** followed by a string.


    ```

    paul@u810:~$ whatis route

    route (8) - manipulate the IP routing table

    ```


    # 7.6. whereis


    The location of a manpage can be revealed with **whereis**.


    ```

    paul@laika:~$ whereis -m whois

    whois: /usr/share/man/man1/whois.gz

    ```


    This file is directly readable by **man**.


    ```

    paul@laika:~$ man /usr/share/man/man1/whois.gz

    ```'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# 7.7. man sections


    By now you will have noticed the numbers between the round brackets. **man** will
    explain to you that these are section numbers. Executable programs and shell commands
    reside in section one.


    +   -1 Executable programs or shell commands

    -2 System calls (functions provided by the kernel)

    -3 Library calls (functions within program libraries)

    -4 Special files (usually found in /dev)

    -5 File formats and conventions /etc/passwd

    -6 Games

    -7 Miscellaneous (including macro packages and conventions), e.g. man(7)

    -8 System administration commands (usually only for root)

    -9 Kernel routines [Non standard]


    # 7.8. man $file


    Therefore, when referring to the man page of the command, you will see it written
    as *passwd(1)* referring to the passwd file, you will see it as *passwd(5)*. The
    screenshot explains how to open the man page in the correct section.


    ```

    paul@RHEL52 ~~$ man password          # opens the first manual found

    paul@RHEL52 ~~$ man 5 password          # opens a page from section 5

    ```


    # 7.9. man db


    If you want to know more about **man**, read The Fantastic Manual (RTFM).


    *Unfortunately, manual pages do not have the answer to everything...*


    ```

    paul@laika:~$ man woman

    No manual entry for woman

    ```


    # 7.10. mandb


    Should you be convinced that a man page exists, you can''t access it, then try
    running **mandb** on Debian/Mint.


    ```

    root@laika:~# mandb

    0 man subdirectories contained newer man pages.

    0 manual pages were added.

    0 stray cats were added.

    0 old database entries were purged.

    ```


    Or run makewhat on CentOS/Redhat.


    ```

    [root@centos65 ~#] apropos scsi

    scsi: nothing appropriate

    [root@centos65 ~#] apropos scsi

    hpas (4) HP Smart Array SCSI driver

    lsscsi (8) list SCSI devices (or hosts) and their attributes

    d (4) Driver for SCSI Disk Drives

    sd (4) SCSI tape device

    ```'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# Chapter 8. working with directories


    This module is a brief overview of the most common commands to work with directories:

    pwd, cd, ls, mkdir and rmdir. These commands are available on any Linux (or Unix)
    system.


    This module also discusses absolute and relative paths and path completion in
    the bash shell.'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# 8.1. pwd


    The you are here sign can be displayed with the pwd command (Print Working Directory).
    Go ahead, try it: Open a command line interface (also called a terminal, console
    or xterm) and type pwd. The tool displays your current directory.


    ```

    paul@debian8:~~$ pwd

    /home/paul

    ```


    # 8.2. cd


    You can change your current directory with the cd command (Change Directory).


    ```

    paul@debian8$ cd /etc

    paul@debian8$ pwd

    /etc

    paul@debian8$ cd /bin

    paul@debian8$ pwd

    /bin

    paul@debian8$ cd /home/paul/

    paul@debian8$ pwd

    /home/paul

    ```


    # 8.2.1 cd ~


    The cd is a shortcut to get back into your home directory. Just typing cd without
    a target directory, will put you in your home directory. Typing cd ~ has the same
    effect.


    ```

    paul@debian8$ cd /etc

    paul@debian8$ pwd

    /etc

    paul@debian8$ cd

    paul@debian8$ pwd

    /home/paul

    paul@debian8$ cd ~

    paul@debian8$ pwd

    /home/paul

    ```


    # 8.2.2 cd ..


    To go to the parent directory (the one just above your current directory in the
    tree), type cd ..


    ```

    paul@debian8$ pwd

    /usr/share/games

    paul@debian8$ cd ..

    paul@debian8$ pwd

    /usr/share

    ```


    To stay in the current directory, type cd . ;-) We will see useful use of the
    . character representing the current directory later.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# 8.2.3. cd -


    Another useful shortcut with cd is to just type cd - to go to the previous directory.


    ```

    paul@debian$ pwd

    /home/paul

    paul@debian$ cd /etc

    paul@debian$ pwd

    /etc

    paul@debian$ cd -

    /home/paul

    paul@debian$ cd -

    /etc

    ```


    # 8.3. absolute and relative paths


    You should be aware of absolute and relative paths in the file tree. When you
    type a path starting with a slash (/), the root of the file tree is assumed. If
    you don''t start your path with a slash, the current directory is the assumed
    starting point.


    The screenshot below shows the current directory /home/paul. Within within this
    directory, you have to type cd /home instead of cd home to go to the home directory.


    ```

    paul@debian$ pwd

    /home/paul

    paul@debian$ cd home

    bash: cd: No such file or directory

    paul@debian$ cd /home

    paul@debian$ pwd

    /home

    ```


    When inside /home, you have to type cd paul instead of cd /paul to enter the substract
    paul of the current directory /home.


    ```

    paul@debian$ pwd

    /home/

    paul@debian$ cd /paul

    bash: cd: /paul: No such file or directory

    paul@debian$ cd paul

    paul@debian$ pwd

    /home

    ```


    In case your current directory is the root directory /, then both cd /home and
    cd home will get you in the /home directory.


    ```

    paul@debian$ pwd

    /

    paul@debian$ cd home

    paul@debian$ pwd

    /home

    paul@debian$ cd /

    npaul@debian$ cd /home

    paul@debian$ pwd

    /home

    ```


    This was the last screenshot with pwd statements. From now on, the current directory
    will be displayed in the prompt. Later in this book we will explain how the shell
    variable $PS1 can be configured to show this.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# 8.4. path completion


    The tab key can help you in typing a path without errors. Typing cd /et followed
    by the tab key will expand the command line to cd /etc/. When typing /Et followed
    by the tab key, nothing will happen because you typed the wrong path (upper case
    E).


    You will need few keystroke when using the tab key, and you will be sure your
    typed path is correct!


    # 8.5. ls


    You can list the contents of a directory with ls.


    ```

    paul@debian:-~$ ls

    allfiles.txt dmesg.txt services stuff summer.txt

    paul@debian:--$

    ```


    # 8.5.1. ls -


    A frequently used option with ls -a to show all files. Showing all files including
    the hidden files. When a file on a Linux system starts with a dot, it is considered
    a hidden file and it doesn''t show up in regular file listings.


    ```

    paul@debian:-~$ ls

    allfiles.txt dmesg.txt services stuff summer.txt

    paul@debian:-~$ ls -a

    allfiles.txt .bash_profile dmesg.txt .lesshst stuff

    . .bash_history .bashrc services .ssh summer.txt

    paul@debian:--$

    ```


    # 8.5.2. ls -l


    Many times you will be using with ls to display the contents of the directory
    in different formats or to display different parts of the directory. Typing ls
    -l (that is a letter L, not the number 1) gives you a list of files in the directory.


    ```

    paul@debian:-~$ ls -l

    total 1729

    -rw-r-- 1 paul paul 17584442 Sep 17 00:03 allfiles.txt

    -rw-r-- 1 paul paul 96650 Sep 17 00:03 dmesg.txt

    -rw-r-- 1 paul paul 19558 Sep 17 00:04 services

    drwxr-xr-x 2 paul paul 4096 Sep 17 00:04 stuff

    -rw-r-- 1 paul paul 0 Sep 17 00:04 summer.txt

    ```'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# 8.5.3. ls -lh


    Another frequently used option ls -h. It shows the numbers (file sizes) in a more
    human readable format. Also shown below is some variation in the way you can give
    the options to ls. We will explain the details of the output later in this book.


    Note that we use the L as an option in the screenshot, not the number 1.


    ```

    paul@debian:~$ ls -l -nhntotal 17M

    -rw-r--r 1 paul 17M Sep 17 00:03 allfiles.txt

    -rw-r--r 1 paul 95K Sep 17 00:03 dmesg.txt

    -rw-r--r 1 paul 20K Sep 17 00:04 services

    drwxr-xr-x 2 paul 4.0K Sep 17 00:04 stuff

    -rw-r--r 1 paul 0 Sep 17 00:04 summer.txt

    paul@debian:~$ ls -l -lh

    total 17M

    -rw-r--r 1 paul 17M Sep 17 00:03 allfiles.txt

    -rw-r--r 1 paul 95K Sep 17 00:03 dmesg.txt

    -rw-r--r 1 paul 20K Sep 17 00:04 services

    drwxr-xr-x 2 paul 4.0K Sep 17 00:04 stuff

    -rw-r--r 1 paul 0 Sep 17 00:04 summer.txt

    paul@debian:~$ ls -l -1

    total 17M

    -rw-r--r 1 paul 17M Sep 17 00:03 allfiles.txt

    -rw-r--r 1 paul 95K Sep 17 00:03 dmesg.txt

    -rw-r--r 1 paul 20K Sep 17 00:04 services

    drwxr-xr-x 2 paul 4.0K Sep 17 00:04 stuff

    -rw-r--r 1 paul 0 Sep 17 00:04 summer.txt

    paul@debian:~$

    ```'
  merge: -1
  pgno: 87
- img_proc: true
  md: "# 8.6. mkdir\n\nWalking around the Unix tree is fun, but it is even more fun\
    \ to create your own directories with mkdir. You have to give at least one parameter\
    \ to mkdir, the name of the new directory to be created. Think before you type\
    \ a leading /\n\n```\npaul@debian:-$ mkdir mydir\npaul@debian:~$ cd mydir\npaul@debian:~/mydir\
    \ ls -l\ntotal 8\ndrwxr-xr-x 2 paul 4096 Sep 17 00:07\ndrwxr-xr-x 4 paul 4096\
    \ Sep 17 00:07 ..\npaul@debian:~/mydir mkdir stuff\npaul@debian:~/mydir otherstuff\n\
    paul@debian:~/mydir ls -l\ntotal 8\ndrwxr-xr-x 2 paul 4096 Sep 17 00:07 otherstuff\n\
    drwxr-xr-x 2 paul 4096 Sep 17 00:07 stuff\npaul@debian:~/mydir$ \n```\n\n# 8.6.1\
    \ mkdir -p\n\nThe command will fail, because the parent directory of threirsdeep\
    \ does not exist.\n\n```\npaul@debian:-$ mkdir mydir2/mysubdir2/threedirsdeep\n\
    mkdir: cannot create directory 'mydir2/mysubdir2/threedirsdeep': No such file\n\
    or or directory\n```\n\nWhen given the option -p, mkdir will create parent directories\
    \ as needed.\n\n```\npaul@debian:-$ mkdir -p mydir2/mysubdir2/threedirsdeep\n\
    paul@debian:~$ cd mydir2\npaul@debian:~/mydir2 ls -l\ntotal 4\ndrwxr-xr-x 2 paul\
