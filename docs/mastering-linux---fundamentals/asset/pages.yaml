  md: "You can also check for options that need an argument, as this example shows.\n\
    \n```\nkahlan@solexpll1$ cat argoptions.ksh\n!/bin/ksh\n\nwhile getopts \":af:z\"\
    \ option; do\n  case $option in\n    a)\n      echo received -a\n      ;\n   \
    \ f)\n      echo received -f with $OPTARG\n      ;\n    z)\n      echo received\
    \ -z\n      ;\n    )\n      echo \"option -$OPTARG needs an argument\"\n     \
    \ ;\n    *)\n      echo \"invalid option -$OPTARG\"\n      ;\n  esac\ndone\n```\n\
    \n```\nkahlan@solexpll1$ ./argoptions.ksh -a -f hello -z\nreceived -a\nreceived\
