  md: '# Chapter 28. user management


    This chapter will teach you how to use useradd, usermod and userdel to create,
    modify and remove user accounts.


    You will need root access on a Linux computer to complete this chapter.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# 28.1. user management


    User management on Linux can be done in three complementary ways. You can use
    the graphical tools provided by your distribution. These tools have a look and
    feel that depends on the distribution. If you are a novice Linux user on your
    home system, then use the graphical tool that is provided by your distribution.
    Make sure that you do not run into problems.


    Another option is to use command line tools like usermod, gpasswd, passwd and
    others. Server administrators are likely to use these tools, since they are familiar
    and very similar across many different distributions. This chapter will focus
    on these command line tools.


    A third and rarer way is to edit the local configuration files directly using
    vi (or viwp/vigor). Do not attempt this as a novice on production systems!


    # 28.2. /etc/passwd


    ```

    [root@RHEL5 ~]# tail /etc/passwd

    inge:518:524:art dealer:/home/inge:/bin/bash

    ann:519:523:flat:/home/ann:/bin/bash

    frederik:520:526:ribolt:/home/frederik:/bin/bash

    steven:521:527:roman emperor:/home/steven:/bin/bash

    pascale:522:528:artist:/home/pascale:/bin/bash

    geert:524:530:kernel developer:/home/geert:/bin/bash

    win:525:531:master daemon:/home/win:/bin/bash

    sandra:526:532:radish stresser:/home/sandra:/bin/bash

    annelies:527:533:sword fighter:/home/annelies:/bin/bash

    laura:528:534:art dealer:/home/laura:/bin/bash

    ```


    As you can see, this file contains columns separated by a colon. The columns contain
    the username, an x, the user id, the primary group id, a description, the name
    of the home directory, and the login shell.


    More information can be found by typing man 5 passwd.


    ```

    [root@RHEL5 ~]# head -1 /etc/passwd

    root:x:0:root:/root:/bin/bash

    ```


    # 28.3. root


    The root user called the superuser is the most powerful account on your Linux
    system. This user can do anything, except the creation of other users. The root
    user always has userid 0 (regardless of the name of the account).'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# 28.4. useradd


    You can add users with the useradd command. The example below shows how to add
    a user named yanina (last parameter) and at the same time forcing the creation
    of the home directory (-m), setting the name of the home directory (-d), and setting
    a description (-c).


    ```

    [root@RHEL5 ~]# useradd -m /home/yanina -c ''yanina wickmayer yanina

    [root@RHEL5 ~]# tail -1 /etc/passwd

    yanina:x:529:529:yanina wickmayer:home/yanina:/bin/bash

    ```


    The user named yanina received user id 529 and primary group id 529.


    # 28.5. /etc/default/useradd


    Red Hat Enterprise Linux and Debian/Ubuntu have a file /etc/default/useradd that
    contains some default user options. Besides using cat to display this file, you
    can also use useradd -D.


    ```

    [root@RHEL4 ~]# useradd -D

    GROUP=100

    HOME=/home

    INACTIVE=-1

    EXPIRE=

    SHELL=/bin/bash

    SKEL=/etc/skel

    ```


    # 28.6. userdel


    You can delete the user yanina with userdel. The -r option of userdel will also
    remove the home directory.


    ```

    [root@RHEL5 ~]# userdel -r yanina

    ```


    # 28.7. usermod


    You can modify the properties of a user with the usermod command. This example
    uses usermod to change the description of the user harry.


    ```

    [root@RHEL4 ~]# tail -1 /etc/passwd

    harry:x:516:520:harry potter:home/harry:/bin/bash

    [root@RHEL4 ~]# usermod -c ''wizard'' harry

    [root@RHEL4 ~]# tail -1 /etc/passwd

    harry:x:516:520:wizard:home/harry:/bin/bash

    ```'
