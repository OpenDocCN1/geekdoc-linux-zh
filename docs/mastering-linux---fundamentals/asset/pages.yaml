    \n# /etc/sysconfig/\n\nThis directory, which is not mentioned in the FHS, contains\
    \ a lot of Red Hat Enterprise Linux configuration files. We will discuss some\
    \ of them in greater detail. The screenshot below is the /etc/sysconfig directory\
    \ from RHELv44 with everything installed."
