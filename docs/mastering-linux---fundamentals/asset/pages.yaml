    set -o nounset

    ```


    +   4. Execute $(cd /var ; ls in an embedded shell.


    ```

    echo $(cd /var ; ls)

    ```


    The echo command is only needed to show the result of the ls command. Omitting
    result in the shell trying to execute the first file as a command.


    +   5. Create the variable emvar in an embedded shell and echo it. Does the variable
    exist in your current shell?


