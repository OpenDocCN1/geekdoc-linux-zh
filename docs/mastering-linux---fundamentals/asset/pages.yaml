  md: '# 14.8. $PATH


    The $PATH variable determines where the shell is looking for commands to execute
    (unless the command is builtin or aliased). This variable contains a list of directories,
    separated by colons.


    ```

    [paul@RHEL4b] ~$ echo $PATH

    /usr/kerberos/bin:/usr/local/bin:/usr/bin

    ```


    The shell will not look in the current directory for commands to execute! (Looking
    for executables in the current directory provided an easy way to hack PC-DOS computers).
    If you want the shell to look in the current directory, then add a . at the end
    of your $PATH.


    ```

    [paul@RHEL4b] ~$ PATH=$PATH:

    [paul@RHEL4b] ~$ echo $PATH

    /usr/kerberos/bin:/usr/local/bin:/bin:/usr/bin.

    [paul@RHEL4b] ~$

    ```


    Your path might be different when using su instead of su - because the latter
    will take on the environment of the target user. The root user typically has /sbin
    directories added to the $PATH variable.


    ```

    [paul@RHEL3] ~$ su

    Password:

    [root@RHEL3 paul]# echo $PATH

    /usr/local/bin:/bin:/usr/bin:/X11R6/bin

    [root@RHEL3 paul]# exit

    [paul@RHEL3] ~$-

    Password:

    [root@RHEL3 ~]# echo $PATH

    /usr/local/sbin:/usr/sbin:/sbin:/usr/bin:/bin:/bin:

    [root@RHEL3] ~]#

    ```'
