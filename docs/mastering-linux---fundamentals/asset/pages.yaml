  md: '# Chapter 13. control operators


    In this chapter we put more than one command on the command line using control
    operators. We also briefly discuss related parameters ($?) and similar special
    characters(&).'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# 13.1. ; semicolon


    You can put two or more commands on the same line separated by a semicolon ; .
    The shell will scan the line until it reaches the semicolon. All the arguments
    before this semicolon will be considered a separate command from all the arguments
    after the semicolon. Both series will be executed sequentially with the shell
    wait for each command to finish before starting the next one.


    ```

    [paul@RHELv4u ~]$ echo Hello

    Hello

    [paul@RHELv4u ~]$ echo World

    World

    [paul@RHELv4u ~]$ echo Hello ; echo World

    Hello

    World

    [paul@RHELv4u ~]$

    ```


    # 13.2. & ampersand


    When a line ends with an ampersand &, the shell will not wait for the command
    to finish. You will get your shell prompt back, and the command is executed in
    background. You will get a message when this command has finished executing in
    background.


    ```

    [paul@RHELv4u ~]$ sleep 20 &

    [1] 7925

    [paul@RHELv4u ~]$

    ...wait 20 seconds...

    [paul@RHELv4u ~]$

    sleep 20

    [1]+ Done

    ```


    The technical explanation of what happens in this case is explained in the chapter
    about processes.


    # 13.3. $ dollar question mark


    The exit code of the previous command is stored in the shell variable $?. Actually
    $? is a shell parameter and not a variable, since you cannot assign a value to
    $?.


    ```

    paul@debian5:~/test touch file

    paul@debian5:~/test echo $$

    0

    paul@debian5:~/test rm file

    paul@debian5:~/test echo $?

    0

    paul@debian5:~/test rm file

    rm: cannot remove ''file'': No such file or directory

    paul@debian5:~/test echo $$

    paul@debian5:~/test$

    ```'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# 13.4. && double ampersand


    The shell will interpret && as a logical AND. When using && the second command
    is executed only if the first succeeds (returns a zero exit status).


    ```

    paul@barry:-$ echo first && echo second

    first

    second

    paul@barry:-$ zecho first && echo second

    -bash: zecho: command not found

    ```


    Another example of the same logical OR principle. This example starts with a working
    cd by ls, then a non-working cd is not followed by ls.


    ```

    [paul@HELLVu3~]$ cd gen && ls

    file1 file55 fileab FileAB fileabc

    file2 File4 FileA Fileab fileab2

    [paul@HELLVu3~]$ cd gen && ls

    -bash: cd: gen: No such file or directory

    ```


    # 13.5. || double vertical bar


    The || represents a logical OR. The second command is executed only if the first
    command fails (returns a non-zero exit status).


    ```

    paul@barry:-$ echo first || echo second ; echo third

    first

    third

    paul@barry:-$ zecho first || echo second ; echo third

    -bash: zecho: command not found

    second

    third

    paul@barry:-$

    ```


    Another example of the cd gen logical OR principle.


    ```

    [paul@HELLVu3~]$ cd gen || ls

    [paul@HELLVu3~]$ cd gen || ls

    -bash: cd: gen: No such file or directory

    file1 file55 fileab FileAB fileabc

    file2 File4 FileA Fileab fileab2

    ```


    # 13.6. combining && & ||


    You can use this logical AND and OR to write an if-then-else structure on the
    command line. This example uses echo to display whether the rm command was successful.


    ```

    paul@laika:-~/test$ rm file && echo It worked! || echo It failed!

    It worked!

    paul@laika:-~/test$ rm file echo It worked! || echo It failed!

    rm: cannot remove ''file'': No such file or directory

    It failed!

    paul@laika:-~/test$

    ```'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# 13.7. # pound sign


    Everything written after a pound sign (#) is ignored by the shell. This is useful
    to write a shell command, but has no influence on the command execution or shell
    expansion.


    ```

    paul@debian4:-$ mkdir test # we create a directory

    paul@debian4:-$ cd test #### we enter the directory

    paul@debian4:-~/test$ ls # is it empty?

    paul@debian4:-~/test $

    ```


    # 13.8. \ escaping special characters


    The backslash \ character enables the use of control characters, but without the
    shell interpreting it, this is called escaping characters.


    ```

    [paul@RHELv3 ~]$ echo hello \; world

    hello ; world

    [paul@RHELv3 ~]$ echo hello \\ world

    hello \ world

    [paul@RHELv3 ~]$ echo escaping \\\# \\\& \"\''

    escaping \# &"

    [paul@RHELv3 ~]$ echo escaping \\\?\*\''

    escapaping \?\*\''

    ```


    # 13.8.1. end of line backslash


    Ending in a backslash are continued on the next line. The shell does not interpret
    the newline character and will wait on shell expansion and execution of the command
    line until a newline without backslash is encountered.


    ```

    [paul@RHEL4b ~]$ echo This command line \

    > is split in three \

    > parts

    This command line is split in three parts

    [paul@RHEL4b ~]$

    ```'
  merge: -1
