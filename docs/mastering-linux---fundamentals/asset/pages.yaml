    This is workable to learn Linux, and you will be able to practice a lot. But there
    are more ways to access your virtual machine, the next chapters discuss some of
    these and will also introduce some basic system configuration.


    # 5.4.1. setting the hostname


    Setting the hostname is a simple as changing the /etc/hostname file. As you can
    see here, it is set to localhost.localdomain by default.


    ```

    root@localhost ~# cat /etc/hostname

    localhost.localdomain

    ```


    You could echo server33.netsec.local > /etc/hostname followed by a reboot. But
    there is the new CentOS 7 way of setting a new hostname.


    ```

    root@localhost ~# nmui

    ```


    The above command will give you to choose from menu with a set system hostname
    option. Using this nmui option will edit the /etc/hostname file for you.


    ```

    root@localhost ~# cat /etc/netsec.local

    server33.netsec.local

    root@localhost ~# hostname

    server33.netsec.local

