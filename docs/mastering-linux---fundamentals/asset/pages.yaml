  md: '# # 29.6./etc/login.defs


    The /etc/login.defs file contains some default settings for user passwords like
    password aging and length settings. You will also find numerical limits of user
    ids and group ids and whether or not a home directory should be created by default.


    ```

    root@rhel65:~# grep "^PASS /etc/login.defs"

    PASS_MAX_DAYS   99999

    PASS_MIN_DAYS   0

    PASS_MIN_LEN    5

    PASS_WARN_AGE   7

    ```


    Debian also has this


    ```

    root@debian7:-# grep PASS /etc/login.defs

    # PASS_MAX_DAYS   Maximum number of days a password may be used.

    # PASS_MIN_DAYS   Minimum number of days allowed between password changes.

    # PASS_WARN_AGE   Number of days warning given before a password expires.

    PASS_MAX_DAYS   99999

    PASS_MIN_DAYS   0

    PASS_WARN_AGE   7

    #PASS_CHANGE_TRIES

    #PASS_ALWAYS_WARN

    #PASS_MIN_LEN

    #PASS_MAX_LEN

    # NO_PASSWORD_CONSOLE

    root@debian7:-#

    ```


    # # 29.7.change


    The change command can be used to set an expiration date for a user account (-E),
    set a minimum (-m) and maximum (-M) password age, a password expiration date,
    and set the number of warning days before the password expiration date. Much of
    this functionality is also available from the passwd command. The -l option of
    change will list these settings for a user.


    ```

    root@rhel65:~# change -l paul

    Last password change             : Mar 27, 2014

    Password expires                 : never

    Password inactive               : never

    Account expires                 : never

    Minimum number of days between password change : 0

    Maximum number of days between password change : 99999

    Number of days of warning before password expires : 7

    root@rhel65:~#

    ```'
