  md: '# 11.9.5. /var/lib


    The **/var/lib** directory contains application state information.


    Red Hat Enterprise Linux for example keeps files pertaining to **rpm** in **/var/lib/rpm/**.


    # 11.9.6. /var/...


    var** also contains Process ID files in **/var/run** (soon to be replaced with
    **/run**) and temporary files that survive a reboot in **/var/tmp** and information
    about file locks in **/var/lock**. There will be more examples of **/var** usage
    further in this book.'
