  md: '# 28.8. creating home directories


    The easiest way to create a home directory is to use the -m option with useradd
    (it is likely set as a default option on Linux).


    A less easy way is to create a home directory manually with mkdir which also requires
    setting the owner and the permissions on the directory with chmod and chown (both
    commands are discussed in detail in another chapter)


    ```

    [root@RHEL5 ~]# mkdir /home/laura

    [root@RHEL5 ~]# chown laura:laura /home/laura

    [root@RHEL5 ~]# chmod 700 /home/laura

    [root@RHEL5 ~]# ls -d /home/laura/

    drwx-\x------ 2 laura 4096 Jun 24 15:17 /home/laura/

    ```


    # 28.9. /etc/skel/


    When using the -m option, the /etc/skel/ directory is copied to the newly created
    home directory. The /etc/skel/ directory contains some (usually hidden) files
    that contain profile settings and default values for applications. In this way
    /etc/skel/ serves as a default home directory and as a default user profile.


    ```

    [root@RHEL5 ~]# ls -la /etc/skel/

    total 48

    drwx-xr-x 2 root 4096 Apr 1 00:11 .

    drwxr-xr-x 9 root root 12288 Jun 24 15:36 .

    -rw-r--r- 1 root 24 Jul 12 2006 .bash_logout

    -rw-r--r- 1 root 176 Jul 12 2006 .bash_profile

    -rw-r--r- 1 root 124 Jul 12 2006 .bashrc

    ```


    # 28.10. deleting home directories


    The -r option of userdel will make sure the home directory is deleted together
    with the user account.


    ```

    [root@RHEL5 ~]# ls -ld /home/wim/

    drwx------x 2 wim wim 4096 Jun 24 15:19 /home/wim/

    [root@RHEL5 ~]# userdel -r wim

    [root@RHEL5 ~]# ls -ld /home/wim/

    ls: /home/wim/: No such file or directory

    ```'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# 28.11. login shell


    The /etc/passwd specifies the login shell for the user. In the screenshot below
    you can see that user anne will log in with the /bin/bash shell, and user laura
    with the /bin/ksh


    ```

    [root@RHEL5 ~]# tail -2 /etc/passwd

    annelies:x:527:533:sword fighter:/home/annelies:/bin/bash

    laura:x:528:534:art dealer:/home/laura:/bin/ksh

    ```


    You can use the user command to change the shell for a user.


    ```

    [root@RHEL5 ~]# usermod -s /bin/bash laura

    [root@RHEL5 ~]# tail -1 /etc/passwd

    laura:x:528:534:art dealer:/home/laura:/bin/ksh

    ```


    # 28.12. chsh


    Users can change their login shell with the chsh command. First, user harry obtains
    a list of available shells (he could also have done a cat /etc/shells) and then
    changes his login shell to the Korn shell (/bin/ksh). At the next login, harry
    will default to ksh instead of bash.


    ```

    [laura@centos7 ~]$ chsh -l

    /bin/sh

    /bin/bash

    /sbin/nologin

    /usr/bin/bash

    /usr/bin/bash

    /usr/sbin/nologin

    /bin/ksh

    /bin/tcsh

    /bin/csh

    [laura@centos7 ~]$

    ```


    Note that the -l option does not exist on Debian and that the above screenshot
    assumes that ksh and csh are installed.


    The screenshot shows how laura can change her default shell (active on next login).


    ```

    [laura@centos7 ~]$ chsh -s /bin/ksh

    Changing shell for laura.

    Password:

    Shell changed.

    ```'
