- img_proc: true
  md: '# # Chapter 31. groups


    Users can be listed in **groups**. Groups allow you to set permissions on the
    group level instead of having to set permissions for every individual user.


    Every Unix or Linux distribution will have a graphical tool to manage groups.
    Novice users are advised to use this graphical tool. More experienced users can
    use command line tools to manage groups, but be careful: Some distributions do
    not allow the mixed use of GUI and CLI tools to manage groups (YaST in Novell
    Suse). Senior administrators can edit the relevant files directly with **vi**
    or **vigr**.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# 31.1. groupadd


    Groups can be created with the groupadd command. The example below shows the creation
    of five (empty) groups.


    ```

    root@laika~# groupadd tennis

    root@laika~# groupadd football

    root@laika~# groupadd snooker

    root@laika~# groupadd formularial

    root@laika~# groupadd salsa

    ```


    # 31.2. group file


    Users can be a member of several groups. Group membership is defined by the /etc/group
    file.


    ```

    root@laika~# tail -5 /etc/group

    tennis:x:1006:

    football:x:1007:

    snooker:x:1008:

    formularial:x:1009:

    salsa:x:1010:

    root@laika~#

    ```


    The first field is the group''s name. The second field is the group''s (encrypted)
    password (can be empty). The third field is the group identification or GID. The
    fourth field is the list of members, these groups have no members.


    # 31.3. groups


    A user can type the groups command to see a list of groups where the user belongs
    to.


    ```

    [harry@RHEL4b ~]$ groups

    harry sports

    [harry@RHEL4b ~]$

    ```'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# 31.4. usermod


    Group membership can be modified with the useradd or usermod command.


    ```

    root@laika:-# usermod -G tennis inge

    root@laika:-# usermod -G tennis katrien

    root@laika:-# usermod -G salsa katrien

    root@laika:-# usermod -G snooker snandra

    root@laika:-# usermod -G formal annelles

    root@laika:-# tail -d /etc/group

    tennis:x:1006:inge,katrien

    football:x:1007:

    snooker:x:1008:sandra

    formual:x:1009:annelies

    salsa:x:1010:katrien

    root@laika:-#

    ```


    Be careful when using **usermod** to add users to groups. By default, the usermod
    command will **remove** the user from every group of which he is a member if the
    group is not listed in the command! Using the **-a** (append) switch prevents
    this behaviour.


    # 31.5. groupmod


    You can change the group name with the **groupmod** command.


    ```

    root@laika:-# groupmod -n darts snooker

    root@laika:-# tail -s /etc/group

    tennis:x:1009:inge,katrien

    football:x:1007:

    formual:x:1009:annelies

    salsa:x:1010:katrien

    darts:x:1008:sandra

    ```


    # 31.6. groupdel


    You can permanently remove a group with the **groupdel** command.


    ```

    root@laika:-# groupdel tennis

    root@laika:-#

    ```'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# 31.7. gpasswd


    You can delegate control of group membership to another user with the gpasswd
    command. In the example we delegate permissions to add and remove group members
    to serena for the sports group. Then we su to serena and add harry to the sports
    group.


    ```

    [root@RHEL4b ~]# gpasswd -A serena sports

    [root@RHEL4b ~]# su serena

    $serenaRHEL4b ~]# id

    uid=516 (harry) gid=520 (harry) groups=520 (harry)

    $serenaRHEL4b ~]# gpasswd -A harry sports

    Adding user serena to group sports

    $serenaRHEL4b ~]# id

    uid=516 (harry) gid=520 (harry) groups=520(harry),522(sports)

    $serenaRHEL4b ~]# tail -1 /etc/group

    sports:x:522:serena,venus,harry

    $serenaRHEL4b ~]#

    ```


    Group administrators do not have to be a member of the group. They can remove
    themselves from a group, but this does not influence their ability to add or remove
    members.


    ```

    [serena@RHEL4b ~]# gpasswd -d serena sports

    Removing serena from group sports

    $serena@RHEL4b ~]# exit

    ```


    Information about group administrators is kept in the /etc/shadow file.


    ```

    [root@RHEL4b ~]# tail -1 /etc/shadow

    sports:x:522:serena,venus,harry

    [root@RHEL4b ~]#

    ```


    To remove all group administrators from a group, use the gpasswd command to set
    an empty administrators list.


    ```

    [root@RHEL4b ~]# gpasswd -A "" sports

    ```'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# 31.8. newgrp


    You can start a child shell with a new temporary primary group using the newgrp
    command.


    ```

    root@rhel65:-# mkdir prigroup

    root@rhel65:-# cd prigroup/

    root@rhel65:~/prigroup# touch standard.txt

    root@rhel65:~/prigroup# ls -l

    total 0

    -rw-r--r-- 1 root tennis 0 Apr 13 17:49 standard.txt

    root@rhel65:~/prigroup# echo $SHLVL

    1

    root@rhel65:~/prigroup# newgrp tennis

    root@rhel65:~/prigroup# echo $SHLVL

    2

    root@rhel65:~/prigroup# touch newgrp.txt

    root@rhel65:~/prigroup# ls -l

    total 0

    -rw-r--r-- 1 root tennis 0 Apr 13 17:49 newgrp.txt

    -rw-r--r-- 1 root standard 0 Apr 13 17:49 standard.txt

    root@rhel65:~/prigroup# exit

    exit

    root@rhel65:~/prigroup#

    ```


    # 31.9. vigr


    Similar to vip, the vigr command can be used to manually edit the /etc/group file,
    as it will do proper locking of the file. Only experienced senior administrators
    should use vi or vigr to manage groups.'
  merge: -1
  pgno: 311
- img_proc: true
