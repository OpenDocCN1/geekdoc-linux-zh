  md: "# # Appendix A. keyboard conf settings\n\n# ## A.1. about keyboard layout\n\
    \nMany people (like US-Americans) prefer the default US-qwerty keyboard layout.\
    \ When you are not from the USA and want a local keyboard layout on your system,\
    \ then the best practice is to select this keyboard at installation time. Then\
    \ the keyboard layout will always be correct. Also, whenever you use ssh to remotely\
    \ manage a Linux system, your local keyboard layout will be used, independent\
    \ of the server configuration. So you will not find much information on changing\
    \ keyboard layout on the fly on linux, because not many people need it. Below\
    \ are some tips to help you.\n\n# ## A.2. X Keyboard Layout\n\nThis is the relevant\
    \ portion in /etc/X11/xorg.conf, first for Belgian azerty, then for US-qwerty.\n\
    \n```\npaul@RHEL5 ~$ grep -i xkb /etc/X11/xorg.conf\n    Option      \"XkbModel\"\
    \ \"pc105\"\n    Option      \"XkbLayout\" \"be\"\n```\n\n```\npaul@RHEL5 ~$ grep\
    \ -i xkb /etc/X11/xorg.conf\n    Option      \"XkbModel\" \"pc105\"\n    Option\
    \      \"XkbLayout\" \"us\"\n```\n\nWhen in Gnome or KDE or any other graphical\
    \ environment, look in the graphical menu in preferences, there will be a keyboard\
    \ section to choose your layout. Use the graphical menu instead of editing xorg.conf.\n\
    \n# ## A.3. shell keyboard layout\n\nWhen in bash, take a look in the /etc/sysconfig/keyboard\
    \ file. Below a sample US-qwerty configuration, followed by a Belgian azerty configuration.\n\
    \n```\npaul@RHEL5 ~$ cat /etc/sysconfig/keyboard\nKEYBOARDTYPE=\"pc\"\nKEYTABLE=\"\
    be-latin1\"\n```\n\n```\npaul@RHEL5 ~$ cat /etc/sysconfig/keyboard\nKEYBOARDTYPE=\"\
    pc\"\nKEYTABLE=\"be-latin1\"\n```\n\nThe keyboards themselves can be found in\
    \ /usr/share/keymaps or /lib/kbd/keymaps/\n\n```\npaul@RHEL5 ~$ ls -l /lib/kbd/keymaps/\n\
    total 52\ndrwxr-xr-x 2 root root Apr 1 00:14  amiga\n```"
