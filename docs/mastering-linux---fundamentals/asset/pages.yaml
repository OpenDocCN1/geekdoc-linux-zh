- img_proc: true
  md: '# 14.1. $ dollar sign


    Another important character interpreted by the shell is the dollar sign $. The
    shell will look for an environment variable named the string the dollar sign and
    replace it with the value of the variable (or nothing if the variable does not
    exist).


    These are examples using $HOSTNAME, USER, SUID, $SHELL, and $HOME.


    ```

    [paul@RHELv43 ~]$ echo This is the $SHELL shell

    This is the /bin/bash shell

    [paul@RHELv43 ~]$ echo This is $SHELL on computer RHELv43.localdomain

    [paul@RHELv43 ~]$ echo The userid of $USER is $UID

    The userid of paul is 500

    [paul@RHELv43 ~]$ echo My homedir is $HOME

    My homedir is /home/paul

    ```


    # 14.2. case sensitive


    This example shows that shell variables are case sensitive!


    ```

    [paul@RHELv43 ~]$ echo Hello $USER

    Hello paul

    [paul@RHELv43 ~]$ echo Hello $user

    Hello

    ```


    # 14.3. creating variables


    This example creates the variable $MyVar and sets its value. It then uses echo
    to verify the value.


    ```

    [paul@RHELv43 gen]$ gen MyVar=555

    [paul@RHELv43 gen]$ echo $MyVar

    555

    [paul@RHELv43 gen]$ $

    ```'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# # 14.4. quotes


    Notice that double quotes still allow the parsing of variables, whereas single
    quotes prevent this.


    ```

    [paul@RHEL4u3 ~]$ MyVar=555

    [paul@RHEL4u3 ~]$ echo $MyVar

    555

    [paul@RHEL4u3 ~]$ echo "$MyVar"

    555

    [paul@RHEL4u3 ~]$ echo ''$MyVar''

    $MyVar

    ```


    The shell will replace variables with their value in double quoted lines, but
    not in single quoted lines.


    ```

    paul@laika:-$ city=Burtonville

    paul@laika:-$ echo "We are in $city today."

    We are in Burlington today.

    paul@laika:-$ echo ''We are in $city today.''

    We are in $city today.

    ```


    # # 14.5. set


    You can use the set command to display a list of environment variables. On Ubuntu
    and Debian systems, the set command will also list shell functions after the shell
    variables. Use set | **more** to see the variables then.


    # # 14.6. unset


    Use the unset command to remove a variable from your shell environment.


    ```

    [paul@RHEL4b ~]$ MyVar=8472

    [paul@RHEL4b ~]$ echo $MyVar

    8472

    [paul@RHEL4b ~]$ unset MyVar

    [paul@RHEL4b ~]$ echo $MyVar

    [paul@RHEL4b ~]$

    ```'
