    # ## B.2. interrupts


    # ### B.2.1. about interrupts


    An interrupt or IRQ is a request from a device to the CPU. A device raises

    anterrupt when it requires the attention of the CPU (could be because the device
    has

    ready to be read by the CPU).


    Since the induction of pci, irq''s can be shared among devices.


    Interrupt 0 is always reserved for the timer, interrupt 1 for the keyboard. IRQ
    2 is used as

    channel for IRQ''s 8 to 15, and this is the same as IRQ 9.


    # ## B.2.2. /proc/interrupts


    You can see a list of interrupts on your system in /proc/interrupts.


    ```

    paul@laika:-$ cat /proc/interrupts

    CPU

    CPU1

    0 1320048 555 IO-APIC-edge      timer

    1 102244 7 IO-APIC-edge      18042

    8 0 0 IO-APIC-edge      parport0

    9 2 1 IO-APIC-edge      rtc

    10 30662 131 IO-APIC-fastei   acpi

    12 151 2 IO-APIC-edge      18042

    15 47073 0 IO-APIC-edge      ideal

    18 0 1 IO-APIC-fastei   venta

    19 31056 1 IO-APIC-fastei   libata,ohci3194

    20 19042 1 IO-APIC-fastei   eth0

    21 44052 1 IO-APIC-fastei   uhci_hcd:usbl,uhci_hcd:usb2,...

    22 188352 1 IO-APIC-fastei   rao

    ```'
