  md: '# # Chapter 21. regular expressions


    **Regular expressions** are a very powerful tool in Linux. They can be used with
    a variety of programs like bash, vi, rename, grep, sed, and more.


    This chapter introduces you to the basics of **regular expressions.**'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# 21.1. regex versions


    There are three different versions of regular expression syntax:


    ```

    BRE: Basic Regular Expressions

    ERE: Extended Regular Expressions

    PRCE: Perl Regular Expressions

    ```


    Depending on the tool being used, one or more of these syntaxes can be used.


    For example the grep tool has the **-E** option to force a string to be read as
    ERE while **-G** forces BRE and **-P** forces PRCE.


    Note that **grep** also has **-F** to force the string to be read literally.


    The sed tool also has options to choose a regex syntax.


    Read the manual of the tools you use!'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# 21.2. grep


    # 21.2.1. print lines matching a pattern


    **grep** is a popular Linux tool to search for lines that match a certain pattern.
    Below are some examples of the simplest **regular expressions.**


    This is the content of the test file. This file contains three lines (or three
    **newline** characters).


    ```

    paul@rhel65:~$ cat names

    Tania

    Laura

    Valentina

    ```


    When **grepping** for a single character, only the lines containing that character
    are returned.


    ```

    paul@rhel65:-$ grep u names

    Laura

    paul@rhel65:-$ grep e names

    Valentina

    paul@rhel65:-$ grep i names

    Tania

    Valentina

    ```


    The pattern matching in this example should be very straightforward; if the given
    character occurs on a line, then **grep** will return that line.


    # 21.2.2. concatenating characters


    Two concatenated characters will have to be concatenated in the same way to have
    a match.


    This example demonstrates that **ia** will match **Tania** but not **Valentina**
    and **in** will match **Valentina** but not **Tania**.


    ```

    paul@rhel65:-$ grep a names

    Tania

    Laura

    Valentina

    paul@rhel65:-$ grep ia names

    Tania

    paul@rhel65:-$ grep in names

    Valentina

    paul@rhel65:-$

    ```'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# 21.2.3. one or the other


    PRCE and ERE both use the pipe symbol to signify OR. In this example we **grep**
    for lines containing the letter i or the letter a.


    ```

    paul@debian7~$ cat list

    Tania

    Laura

    paul@debian7~$ grep -E ''i|a'' list

    Tania

    Laura

    ```


    We note that we use the **-E** switch of grep to force interpretation of our string
    as an ERE.


    We need to **escape** the pipe symbol in a BRE to get the same logical OR.


    ```

    paul@debian7~$ grep -G ''i|a'' list

    paul@debian7~$ grep -G ''i\a'' list

    Tania

    Laura

    ```


    # 21.2.4. one or more


    The ***** signifies zero, one or more occureences of the previous and the **+**
    signifies one or more of the previous.


    ```

    paul@debian7~$ cat list2

    11

    lool

    loool

    olool

    paul@debian7~$ grep -E ''o**'' list2

    11

    lool

    loool

    olool

    paul@debian7~$ grep -E ''o+'' list2

    l

    lool

    loool

    olool

    p@debian7~$

    ```'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# 21.2.5. match the end of a string


    For the following examples, we will use this file.


    ```

    paul@debian:~~$ cat names

    Tania

    Laura

    Valentina

    Fleur

    Floor

    ```


    The two examples below show how to use the dollar character to match the end of
    a string.


    ```

    paul@debian:~~$ grep a$ names

    Tania

    Laura

    Valentina

    paul@debian:~~$ grep r$ names

    Fleur

    Floor

    ```


    # 21.2.6. match the start of a string


    The caret character (^) will match a string at the start (or the beginning) of
    a line.


    Given the same file as above, here are two examples.


    ```

    paul@debian:~~$ grep ^Val names

    Valentina

    paul@debian:~~$ grep ^F names

    Fleur

    Floor

    ```


    Both the dollar sign and the little hat are called anchors in a regex.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# 21.2.7. separating words


    Regular expressions use a \b sequence to reference a word separator. Take for
    example this file:


    ```

    paul@debian?:$ cat text

    The governer is governing.

    The winter is over.

    Can you get over there?

    ```


    Simply grepping for over will give too many results.


    ```

    paul@debian?:$ grep text

    The governer is governing.

    The winter is over.

    Can you get over there?

    ```


    Surrounding the searched word with spaces is not a good solution (because other
    characters can be word separators). This screenshot below shows how to use \b
    to find only the searched word:


    ```

    paul@debian?:$ grep ''\bover\b'' text

    The winter is over.

    Can you get over there?

    paul@debian?:-$

    ```


    Note that grep also has a -w option to grep for words.


    ```

    paul@debian?:$ cat text

    The governer is governing.

    The winter is over.

    Can you get over there?

    paul@debian?:$ grep -w over text

    The winter is over.

    Can you get over there?

    paul@debian?:-$

    ```'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# 21.2.8. grep features


    Sometimes it is easier to combine a simple regex with grep options, than it is
    to write a more complex regex. These options where discussed before:


    ```

    grep -i

    grep -V

    grep -w

    grep -A5

    grep -B5

    grep -C5

    ```


    # 21.2.9. preventing shell expansion of a regex


    The dollar sign is a special character, both for the regex and also for the shell
    (remember variables and embedded shells). Therefore it is advised to always quote
    the regex, this prevents shell expansion.


    ```

    paul@debian:-$ grep ''r$'' names

    Fleur

    Floor

    ```'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# regular expressions


    # 21.3. rename


    # 21.3.1. the rename command


    On Debian Linux the /usr/bin/rename command is a link to /usr/bin/prename installed
    by the perl package.


    ```

    paul@pi ~ $ dpkg -S $(readlink -f $(which rename))

    perl: /usr/bin/rename

    ```


    Red Hat derived systems do not install the same rename command, so this section
    does not describe rename on Red Hat (unless you copy the perl script manually).


    There is often confusion on the internet about the rename command because solutions
    that work in Debian (and Ubuntu, ubuntu Mint, ...) cannot be used in Red Hat (and
    CentOS, Fedora, ...).


    # 21.3.2. perl


    The rename command is actually a perl script that uses perl regular expressions.
    The complete manual for these can be found by typing perldoc perlrequiring (after
    installing perldoc).


    ```

    root@pi:~# aptitude install perl-doc

