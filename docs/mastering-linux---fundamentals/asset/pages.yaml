  md: '# 14.11. delineate variables


    Until now, we have seen that bash interprets a variable starting from a dollar
    sign, continuing until the first occurrence of a non-alphanumeric character that
    is not an underscore. In some situations, this can be a problem. This issue can
    be resolved with curly braces like in this example.


    ```

    [paul@HEL4b ~]$ prefix=Super

    [paul@HEL4b ~]$ echo Hello $prefix and $prefixgirl

    Hello

    [paul@HEL4b ~]$ echo Hello ${prefix}man and ${prefix}girl

    Hello Superman and Supergirl

    [paul@HEL4b ~]$

    ```


    # 14.12. unbound variables


    The example below tries to display the value of the $MyVar variable, but it fails
    because the variable does not exist. By default the shell will display nothing
    when a variable is unbound (does not exist).


    ```

    [paul@HEL4vu3 gen]$ echo $MyVar

    [paul@HEL4vu3 gen]$

    ```


    There is, however, the nounset shell option that you can use to generate an error
    when a variable does not exist.


    ```

    paul@laika:-$ set -u

    paul@laika:-$ echo $MyVar

    bash: Myvar: unbound variable

    paul@laika:-$ set +u

    paul@laika:-$ echo $MyVar

    ```


    In the bash set -u is identical to set -o nounset and likewise set +u is identical
    to set +o nounset.'
