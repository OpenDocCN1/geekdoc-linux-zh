- img_proc: true
  md: '# Chapter 34. access control lists


    Standard Unix permissions might not be enough for some organisations. This chapter
    introduces access control lists or acl''s to further protect files and directories.'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# 34.1. acl in /etc/fstab


    File systems that support access control lists, or acls, have to be mounted with
    the acl option in /etc/fstab. In the example below, you can see that the root
    file system has acl support, whereas /home/data does not.


    ```

    root@laika:~# tail -4 /etc/fstab

    /dev/sda               / acl,relatime 0 1

    /dev/sd2              /home/data auto noacl,defaults 0 0

    pasha:/home/r          /home/pasha nfs defaults 0 0

    wolf:/srv/data         /home/wolf nfs defaults 0 0

    ```


    # 34.2. getfacl


    Reading acl can be done with /usr/bin/getfacl. This screenshot shows how to read
    the acl file33 with getfacl.


    ```

    paul@laika:~$ test getfacl file33

    # file: file33

    # owner: paul

    # group: paul

    user::rw-

    group::-

    mask:rwx

    other::r--

    ```


    # 34.3. setfacl


    Writing or changing acls can be done with /usr/bin/setfacl. These screenshots
    show how to change the acl of file33 with setfacl.


    First we add user sandra with oct permission 7 to the acl.


    Then we add the group tennis with oct permission 6 to the acl of the same file.


    ```

    paul@laika:~$ test setfacl -m g:tennis:6 file33

    ```


    The result is visible with getfacl.


    ```

    paul@laika:~$ test getfacl file33

    # file: file33

    # owner: paul

    # group: paul

    user::rw-

    user:sandra:rwx

    group::-

    group:tennis:r--

    mask:rwx

    other::r--

    ```'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# 34.4. remove an acl entry


    The **x** option of the setfacl command will remove an acl entry from the targeted
    file.


    ```

    paul@laika:/~/test$ setfacl -m u:sandra:7 file33

    paul@laika:/~/test$ setfacl file33 | grep sandra

    user:rwx

    paul@laika:/~/test$ setfacl -x sandra file33

    paul@laika:/~/test$ setfacl file33 | grep sandra

    ```


    Note that omitting the **u** or **g** when defining the **acl** for an account
    will default it to a user account.


    # 34.5. remove the complete acl


    The **-b** option of the setfacl command will remove the acl from the targeted
    file.


    ```

    paul@laika:/~/test$ setfacl -b file33

    paul@laika:/~/test$ setfacl file33

    # file:file33

    # owner: paul

    # group: paul

    user::rw---

    group::r----

    other::r--

    ```


    # 34.6. the acl mask


    The **acl mask** defines the maximum effective permissions for any entry in the
    **acl**. The **mask** is calculated every time you execute the **setfacl** or
    **chmod** commands.


    You can prevent the calculation by using the **--no-mask** switch.


    ```

    paul@laika:/~/test$ setfacl --no-mask -m u:sandra:7 file33

    paul@laika:/~/test$ setfacl file33

    # file:file33

    # owner: paul

    # group: paul

    user::rw---

    user:sandra:rwx #effective:rw-

    group::r---

    mask::rw---

    other::r--

    ```'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# #34.7. eiciel


    Desktop users might want to use **eiciel** to manage **acls** with a graphical
    tool.


    | Basic | Emblems | Permissions | Open With | Notes | Access Control List |

    |---|---|---|---|---|---||

    | Access Control List | | | | | | |

    | Entry | Read | Write | Execution | | | |

    | paul | [x] | [x] | | | | |

    | sandra | [x] | | [x] | | | |

    | paul | [x] | | | [x] | | | |

    | Mask | [x] | [x] | | [x] | | |

    | Other | [x] | | | | | |


    You will need to install **eiciel** and **nautilus-actions** to have an extra
    tab in **nautilus** to manage **acls**.


    ```

    paul@laika:~$ sudo aptitude install eiciel nautilus-actions

    ```'
