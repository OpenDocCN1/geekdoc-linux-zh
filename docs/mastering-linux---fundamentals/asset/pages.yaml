  md: 'installing CentOS 7


    # # 5.6. configuring the network


    The new way of changing network configuration is through the nmui tool. if you
    want to manually manage the files in /etc/sysconfig/network-scripts then you will
    first need to verify (and disable) NetworkManager on that interface.


    ```

    [root@server33 ~]# nmcli dev status

    DEVICE TYPE CONNECTION

    enp03 ethernet connected enp03

    loopback unmanaged --

    ```


    Disable NetworkManager on an interface (enp03 in this case):


    ```

    echo ''NM_CONTROLLED=no'' >> /etc/sysconfig/network-scripts/ifcfg-enp03

    ```


    You can restart the network without a reboot like:


    ```

    [root@server33 ~]# systemctl restart network

    ```


    Also, forget ifconfig and use ip a.


    ```

    [root@server33 ~]# ip a s dev enp03 | grep inet

    inet 192.168.1.110/24 brd 192.168.1.255 scope global dynamic enp03

    inet 6 fe80::a00:27ff:felc:f5ab/64 scope link

    [root@server33 ~]#

    ```


    # # 5.7. adding one static ip address


    This example shows how to add one static ip address to your computer.


    ```

    [root@server33 ~]# nmui edit enp03

    ```


    In this interface leave the IPv4 configuration to automatic, and add an ip address
    just below.


    | IPv4 CONFIGURATION <Automatic> | <Hide> |

    | Addresses 10.104.33.32/16 | |


    Execute this command after exiting nmui.


    ```

    [root@server33 ~]# systemctl restart network

    ```


    And verify ip (not with ifconfig):


    ```

    [root@server33 ~]# ip a s dev enp03 | grep inet

    inet 192.168.1.110/24 brd 192.168.1.255 scope global dynamic enp03

    inet 10.104.33.32/16 brd 10.104.255.255 scope global enp03

    inet 6 fe80::a00:27ff:felc:f5ab/64 scope link

    [root@server33 ~]#

    ```


