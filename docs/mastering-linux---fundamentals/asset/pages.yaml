- img_proc: true
  md: '# # Chapter 35. file links


    An average computer using Linux has a file system with many **hard links** and
    **symbolic links.**


    To understand links in a file system, you first have to understand what an **inode**
    is.'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# 35.1. inodes


    # 35.1.1. inode contents


    inode is a data structure that contains metadata about a file. When the file system
    stores a new file on the hard disk, it stores not only the contents (data) of
    the file, but also extra properties like the name of the file, the creation date,
    its permissions, the owner of the file, and more. All this information (except
    the name of the file and the contents of the file) is stored in the **inode**
    of the file.


    The **ls -l** command will display some of the inode contents, as seen in screenshot.


    ```

    root@rhel53 $ # ls -ld /home/project42/

    drwxr-xr-x 4 root pro42 4.0K Mar 27 14:29 /home/project42/

    ```


    # 35.1.2. inode table


    The **inode** table contains all of the **inodes** and is created when you create
    the file system (**mkfs**). You can use the **df -i** command to see how many
    **inodes** are used and free on mounted file systems.


    ```

    root@rhel53 $ # df -i

    Filesystem Inodes Used Free IUse% Mounted on

    /dev/mapper/GroupVolp0-lvroot100

    4947968 115326 483264 3 % /

    /dev/sda1 26104 45 26069 1% /boot

    tmpfs 64417 1 64416 1% /dev/shm

    /dev/sda2 262144 2207 259937 4% /home/project42

    /dev/sdb1 74400 5519 68881 8% /home/project33

    /dev/sdb5 0 0 0 /home/sales

    /dev/sdb6 100744 11 100733 1% /home/research

    ```


    In the df -i screenshot above you can see the **inode** usage for several mounted
    file systems. You don''t see numbers for **/dev/sdb5** because it is a fat file
    system.


    # 35.1.3. inode number


    Each inode has a unique number (inode number). You can see the **inode** numbers
    with the **ls -li** command.


    ```

    paul@RHEL4u4:~$ touch file1

    paul@RHEL4u4:~$ touch file2

    paul@RHEL4u4:~$ touch file3

    paul@RHEL4u4:~$ touch5 ls -li

    total 12

    817266 -rw-rw-r-- 1 paul 0 Feb 5 15:38 file1

    817267 -rw-rw-r-- 1 paul 0 Feb 5 15:38 file2

    817268 -rw-rw-r-- 1 paul 0 Feb 5 15:38 file3

    paul@RHEL4u4:~$ test#

    ```


    These three files were created after the other and got three different **inodes**
    (first column). All the information you see with this command resides in the **inode**,
    except for the filename (which is contained in the directory).'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# 35.1.4. inode and file contents


    Let''s put some data in one of the files.


    ```

    paul@RHELv4u:~/test$ ls -li

    total 16

    817262 -drwxr-xr-x 2 paul 4096 Feb 5 15:38 .

    800768 -dr-rw-r-- 1 paul 4096 Feb 5 15:42 file1

    817266 -dr-rw-r-- 1 paul 92 Feb 5 15:42 file2

    paul@RHELv4u:~/test$ cat file2

    ```


    It is winter now and it is very cold.

    We do not like the cold, we prefer hot summer nights.

    paul@RHELv4u:~/test$


    The data that is displayed by the cat command is not in the inode, but somewhere
    else on the disk. The inode contains a pointer to that data.


    # 35.2. about directories


    # 35.2.1. a directory is a table


    A directory is a special kind of file that contains a table which maps filenames
    to inodes.

    Listing our current directory with ls -ali will display the contents of the file.


    ```

    paul@RHELv4u:~/test$ ls -ai

    total 32

    817262 drwxr-xr-x 2 paul 4096 Feb 5 15:42 ..

    800768 dr-rw-r-- 1 paul 4096 Feb 5 15:42 --

    817266 -dr-rw-r-- 1 paul 0 Feb 5 15:38 file1

    817270 -dr-rw-r-- 1 paul 92 Feb 5 15:42 file2

    817268 -dr-rw-r-- 1 paul 0 Feb 5 15:38 file3

    paul@RHELv4u:~/test$

    ```


    # 35.2.2. . and ..


    You can see five names, and the mapping to their five inodes. The . is a mapping
    to itself, and the dotdot .. is a mapping to the parent directory. The three other
    names are mappings to different inodes.'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# 35.3. hard links


    # 35.3.1. creating hard links


    When we create a **hard link** to a file in, an extra entry is added in the directory.
    A new file is mapped to an existing index.


    ```

    paul@RHEL4u4:~~/test$ ln file2 hardlink_to_file2

    paul@RHEL4u4:~~/test$ ls -li

    total 24

    817266-rw-r-- 1 paul 0 Feb 5 15:38 file1

    817270-rw-r-- 2 paul 92 Feb 5 15:42 file2

    817266-rw-r-- 1 paul 0 Feb 5 15:38 file3

    817270-rw-r-- 2 paul 92 Feb 5 15:42 hardlink_to_file2

    ```


    Both files have the same inode, so they will always have the same permissions
    and the same owner. Both files will have the same content. Actually, both files
    are equal now, meaning you can safely remove the original file, the hardlinked
    file will remain. The inode contains a counter, counting the number of hard links
    to itself. When the counter drops to zero, then the inode is emptied.


    # 35.3.2. finding hard links


    You can use the **find** command to look for files with a certain inode. The screenshot
    below shows how to search for all filenames that point to **inode 817270**. Remember
    that an **inode** number is unique to its partition.


    ```

    paul@RHEL4u4:~~/test$ find -inum 817270 2> /dev/null

    /home/paul/test/file2

    /home/paul/test/hardlink_to_file2

    ```'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# 35.4. symbolic links


    Symbolic links (sometimes called soft links) do not link to inodes, but create
    a name to name mapping. Symbolic links are created with ln -s. As you can see
    below, the **symbolic link** gets an inode of its own.


    ```

    paul@RHELv4:~/test ln -s file2 symlink_to_file2

    paul@RHELv4:~/test ls -l

    total 32

    817273 -rw-rw-- 1 paul paul 13 Feb 17:06 file1

    817270 -rw-rw-- 2 paul paul 106 Feb 5 17:04 file2

    817270 -rw-rw-- 1 paul paul 0 Feb 5 15:38 file3

    817270 -rw-rw-- 2 paul paul 106 Feb 5 17:04 hardlink_to_file2

    817267 lrwxrwxrwx 1 paul paul 5 Feb 5 16:55 symlink_to_file2 -> file2

    paul@RHELv4:~/test

    ```


    Permissions on a symbolic link have no meaning, since the permissions of the target
    apply. Hard links are limited to their own partition (because they point to an
    inode), symbolic links can link anywhere (other file systems, even networked).


    # 35.5. removing links


    Links can be removed with **rm**.


    ```

    paul@laika:-$ touch data.txt

    paul@laika:-$ ln -s data.txt sl_data.txt

    paul@laika:-$ ln data.txt hl_data.txt

    paul@laika:-$ rm sl_data.txt

    paul@laika:-$ rm hl_data.txt

    ```'
  merge: -1
  pgno: 342
