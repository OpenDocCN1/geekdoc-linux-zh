  md: '# 26.1. eval


    eval reads arguments as input to the shell (the resulting commands are executed).
    This allows using the value of a variable.


    ```

    paul@deb503:~/test42$ answer=42

    paul@deb503:~/test42$ word=answer

    paul@deb503:~/test42$ eval x=\$word; echo $x

    42

    ```


    Both in bash and Korn arguments can be quoted.


    ```

    kahlan@solexpl11$ answer=42

    kahlan@solexpl11$ word=answer

    kahlan@solexpl11$ eval="$word"; echo $y

    42

    ```


    Sometimes it is needed to have correct parsing of arguments. Consider this example
    where the command receives one parameter 1 week ago.


    ```

    paul@debian6$ date --date="1 week ago"

    Thu Mar 8 21:36:25 CET 2012

    ```


    When we set this command in a variable, executing that variable fails unless we
    use eval.


    ```

    paul@debian6$ lastweek=date="1 week ago"

    paul@debian6$ $lastweek

    date: extra operand ''ago''

    Try ''--help'' for more information.

    paul@debian6$ eval $lastweek

    Thu Mar 8 21:36:39 CET 2012

    ```


    # 26.2. ( ( ))


    The ( ) allows evaluation of numerical expressions.


    ```

    paul@deb503:~/test42 (( 42 > 33 )) && echo true || echo false

    true

    paul@deb503:~/test42 (( 42 > 1201 )) && echo true || echo false

    false

    paul@deb503:~/test42 (( 42 == 42 )) && echo true || echo false

    true

    paul@deb503:~/test42 (( 42 == $var42 )) && echo true || echo false

    true

    paul@deb503:~/test42 (( 42 == var43 ))

    paul@deb503:~/test42 (( 42 == var42 )) && echo true || echo false

    false

    ```'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# 26.3. let


    The let built-in shell function instructs the shell to perform an evaluation of
    arithmetic expressions. It will return 0 unless the arithmetic expression evaluates
    to 0.


    ```

    [paul@RHEL4b ~]$ let x="3 + 4"; echo $x

    7

    [paul@RHEL4b ~]$ let x="10 + 100/100"; echo $x

    20

    [paul@RHEL4b ~]$ let x="10-2+100/100"; echo $x

    18

    [paul@RHEL4b ~]$ let x="10*2+100/100"; echo $x

    30

    ```


    The shell can also convert between bases.


    ```

    [paul@RHEL4b ~]$ let x="0xFF"; echo $x

    255

    [paul@RHEL4b ~]$ let x="0xC0"; echo $x

    192

    [paul@RHEL4b ~]$ let x="0xA8"; echo $x

    168

    [paul@RHEL4b ~]$ let x="8#70"; echo $x

    56

    [paul@RHEL4b ~]$ let x="8#77"; echo $x

    63

    [paul@RHEL4b ~]$ let x="16#c0"; echo $x

    192

    ```


    There is a difference between assigning a variable directly, or using let to evaluate
    the arithmetic expressions (if it is just assigning a value).


    ```

    kahlan@solexpl1$ dec=15; oct=017; hex=0x0f

    kahlan@solexpl1$ echo $dec $oct $hex

    15 07 0f

    kahlan@solexpl1$ let dec=15; let oct=017; let hex=0x0f

    kahlan@solexpl1$ echo $dec $oct $hex

    15 15 15

    ```'
