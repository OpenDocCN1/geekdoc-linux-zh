  md: "# 11.5. configuration directories\n\n# 11.5.1. /boot\n\n /boot directory contains\
    \ all files needed to boot the computer. These files don't change very often.\
    \ On Linux systems you typically find the /boot/grub directory here. /boot/group\
    \ contains /boot/grub/grub.cfg (older systems may have /boot/grub/grub.conf) which\
    \ defines the boot menu that is displayed before the kernel starts.\n\n# 11.5.2.\
    \ /etc\n\nAll of the machine-specific configuration files should be located in\
    \ /etc. Historically, /etc stood for et cetera, today people often use the Editable\
    \ Text Configuration backronym.\n\nMany times the number of configuration files\
    \ is the same as the application, daemon, or protocol with .conf added as the\
    \ extension.\n\n```\npaul@laika:~$ ls /etc/*.conf\n/etc/adduser.conf /etc/ld.so.conf\
    \ /etc/scrollkeeper.conf\n/etc/certificates.conf /etc/lftp.conf /etc/sysctl.conf\n\
