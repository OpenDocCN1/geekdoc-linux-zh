  pgno: 350
- img_proc: true
  md: '# B.2.3 dmesg


    You can also use dmesg- to find irq''s at boot time.


    ```

    paul@laika:~$ dmesg | grep irq 1[45]

    [ 28.930069] ata3: PATA max UDMA/133 cmd 0x1f0 c0tl1 0x376 bmdma 0x2090 irq 14

    [ 28.930071] ata4: PATA max UDMA/133 cmd 0x170 c0tl1 0x376 bmdma 0x2098 irq 15

    ```


    # B.3. io ports


    # B.3.1. about iio ports


    Communication in the other direction, from CPU to device, happens through IO ports.
    The CPU writes data or control codes to the IO port of the device. This is not
    only one way communication, the CPU can also use a device''s IO port to read status
    information about the device. Unlike interrupts, ports cannot be shared!


    # B.3.2. /proc/ioports


    You can see a listing of your system''s IO ports via /proc/ioports.


    ```

    [root@RHEL4b ~]# cat /proc/ioports

    0000-001f : dma1

    0020-002f : pic1

    0040-004f : timer0

    0050-0053 : timer1

    0060-006f : keyboard

    0070-007f : rtc

    0080-008f : dma page reg

    00a0-00a1 : pic2

    00c0-00cf : dma2

    00e0-00ef : fpu

    0170-0177 : idel

    02f8-02ff : serial


    ...

    ```


    # B.4. dma


    # B.4.1. about dma


    A device that needs a lot of data, interrupts and ports can pose a heavy load
    on the cpu. dma or Direct Memory Access a device can gain (temporary) access to
    a specific range of the ram memory.


    # B.4.2. /proc/dma


    Looking at /proc/dma might not give you the information that you want, since it
    only contains currently assigned dma channels for isa devices.'
