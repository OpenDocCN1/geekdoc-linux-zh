  md: '# 19.11. sed


    The stream editor sed can perform editing functions in the stream, using regular
    expressions.


    ```

    paul@debian:~/pipes$ echo level5 | sed ''s/5/42/''

    level42

    paul@debian:~/pipes$ echo level5 | sed ''s/level/jump/''

    jump5

    ```


    Add g for global replacements (all occurrences of the string per line).


    ```

    paul@debian:~/pipes$ echo level5 level7 | sed ''s/level/jump/''

    jump5 level7

    paul@debian:~/pipes$ echo level5 level7 | sed ''s/level/jump/g/''

    jump5?

    ```


    With d you can remove lines from a stream containing a character.


    ```

    paul@debian:~/test42$ cat tennis.txt

    Venus Williams, USA

    Martina Hingis, SUI

    Justine Henin, BE

    Serena williams, USA

    Kim Clisters, BE

    Yina Zwickmayer, BE

    paul@debian:~/test42$ cat tennis.txt | sed ''/BE/d''

    Venus Williams, USA

    Martina Hingis, SUI

    Serena williams, USA

    ```'
