  md: '# 11.7.3. /sys Linux 2.6 hot plugging


    The /sys directory was created for the Linux 2.6 kernel. Since 2.6, Linux uses
    sysfs to support usb and IEEE 1394 (FireWire) hot plug devices. See the manual
    pages of udev(8) (the successor of devfs) and hotplug(8) for more info (or visit
    http://linux-kernel-hotplug.sourceforge.net/).


    Basically the /sys directory contains kernel information about hardware.'
