    /etc/inetd.conf /etc/resolv.conf /etc/wdial.conf\n/etc/kernel-img.conf\npaul@laika:~$\n\
    ```\n\nThere is much more to be found in /etc.\n\n# /etc/init.d\n\nA lot of Linux\
    \ distributions have an /etc/init.d directory that contains scripts to and stop\
    \ daemons. This directory could disappear as Linux migrates to systems that replace\
