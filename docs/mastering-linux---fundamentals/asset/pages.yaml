- img_proc: true
  md: '# 35.7. solution : links


    1. Create two files named winter.txt and summer.txt, put some text in them.


    ```

    echo > winter.txt ; echo hot > summer.txt

    ```


    2. Create a hard link to winter.txt named hlwinter.txt.


    ```

    ln winter.txt hlwinter.txt

    ```


    3. Display the inode numbers of these three files, the hard links should have
    the same inode.


    ```

    ls -li winter.txt summer.txt hlwinter.txt

    ```


    4. Use the find command to list the two hardlinked files


    ```

    find . -inum xyz #replace xyz with the inode number

    ```


    5. Everything about a file is in the inode, except two things : name them!


    The name of the file is in a directory, and the contents are somewhere on the
    disk.


    6. Create a symbolic link to summer.txt called slsummer.txt.


    ```

    ln -s summer.txt slsummer.txt

    ```


    It tells you there is more than one inode table (one for every formatted partition
    + virtual file systems)


    8. Look at the directories /etc/init.d/ /etc/rc.d/ /etc/rc3.d/ ... do you see
    the links ?


    ```

    ls -1 /etc/init.d

    ```


    ```

    ls -1 /etc/rc2.d

    ```


    ```

    ls -1 /etc/rc3.d

    ```


    9. Look in /lib with ls -l...


    ```

    ls -l /lib

    ```


    10. Use find to look in your home directory for regular files that do not(!) have
    one hard link.


    ```

    find ! -links 1 -type f

    ```'
