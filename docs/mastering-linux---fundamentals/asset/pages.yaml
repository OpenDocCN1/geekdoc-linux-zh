  md: '# # Appendix B. hardware


    # ## B.1. buses


    # ### B.1.1. about buses


    Hardware components communicate with the **Central Processing Unit** or **cpu**
    over a **bus**. The most common buses today are **usb, pci, agp, pci-express**
    and **pcmcmia** as **pc-card**. These are all **Plag** and **Play** buses.


    Older *x86* computers often had *isa* buses, which can be configured using **jumpers**
    or **dip switches**.


    # ### B.1.2. /proc/bus


    To list the busses recognised by the Linux kernel on your computer, look at the
    contents of `/proc/bus/` directory (screenshot) from Ubuntu 7.04 and RHEL4u4 below).


    ```

    root@laika:~# ls /proc/bus/

    input pccard pci usb

    ```


    ```

    root@RHEL4b ~# ls /proc/bus/

    input pci usb

    ```


    Can you guess which of these two screenshots was taken on a laptop?


    # ### B.1.3. /usr/sbin/lsusb


    To list all the usb devices connected to your system, you could read the contents
    of `/proc/bus/usb/devices` (if it exists) or use the more readable output of **lsusb**,
    which is executed on a server with Ubuntu.


    ```

    root@shaka:-# lusb

    Bus 001 Device 002: ID 0430:0100 Sun Microsystems, Inc. 3-button Mouse

    Bus 001 Device 003: ID 0430:0000 Sun Microsystems, Inc. Type 6 Keyboard

    Bus 001 Device 001: ID 04b0:0136 Nikon Corp. Coolpix 7900 (storage)

    root@shaka:-#

    ```


    # ### B.1.4. /var/lib/usbutils/usb.ids


    The `/var/lib/usbutils/usb.ids` file contains a gzipped list of all known usb
    devices.


    ```

    paul@barry:~$ zmore /var/lib/usbutils/usb.ids | head

    -------> /var/lib/usbutils/usb.ids <----

    #

    # List of USB ID''s

    # Maintained by Vojtech Pavlik <vojtech@huse.cz>

    ```'
