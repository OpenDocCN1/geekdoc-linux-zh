  md: '# 11.11. solution: file system tree


    1. Does the file /bin/cat exist ? What about /bin/dd and /bin/echo. What is the
    type of these files ?


    ```

    ls /bin/cat ; file /bin/cat

    ls /bin/dd ; file /bin/dd

    ls /bin/echo ; file /bin/echo

    ```


    2. What is the size of the Linux kernel file(s) (vmlinux*) in /boot ?


    ```

    ls -lh /boot/vmz*

    ```


    3. Create a directory ~/test. Then issue the following commands:


    ```

    cd ~/test

    diff if=/dev/zero of=zeros.txt count=1 bs=100

    od zeros.txt

    ```


    dd will copy one times (count=1) a block of size 100 bytes (bs=100) from the file
    /dev/zero to ~/test/zeros.txt. Can you describe the functionality of /dev/zero
    ?n

    /dev/zero is a Linux device. It can be considered a source of zeroes. You cannot
    send something to /dev/zero, but you can read zeroes from it.


    4. Now issue the following command:


    ```

    dd if=/dev/random of=random.txt count=1 bs=100 od random.txt

    ```


    dd will copy one times (count=1) a block of size 100 bytes (bs=100) from the file
    /dev/random to ~/test/random.txt. Can you describe the functionality of /dev/random
    ?

    /dev/random acts as a random number generator on your Linux machine.


    5. Issue the two commands, and look at the first character of each output line.


    ```

    ls -l /dev/sd* /dev/hd*

    ls -l /dev/tty* /dev/input/mou*

    ```


    The first ls shows block(b) devices, the second shows character(c) devices. Can
    you tell the difference between block and character devices?


    Block devices are always written to (or read) in blocks. For hard disks, blocks
    of 512 bytes are common. Character devices act as a stream of characters (or bytes).
    Mouse and keyboard are typical character devices.


    6. Use cat to describe /etc/hosts and /etc/resolv.conf. What is your idea about
    the purpose of these files ?


    ```

    /etc/hosts contains hostnames with their ip address

    /etc/resolv.conf should contain the ip address of a DNS name server.

    ```'
  merge: -1
  pgno: 129
- img_proc: true
  md: '7. Are there any files in /etc/skel/ ? Check also for hidden files.


    "ls -al /etc/skel/". Yes, there should be hidden files there.


