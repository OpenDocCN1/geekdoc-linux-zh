  md: '# 24.1. test []


    The **test** command can test whether something is true or false. Let''s start
    by testing whether 10 is greater than 55.


    ```

    paul@RHEL4b ~]$ test 10 -gt 55 ; echo $?

    1

    paul@RHEL4b ~]$ $

    ```


    The test command returns 1 if the test fails. And as you see in the next screenshot,
    test returns 0 when a test succeeds.


    ```

    paul@RHEL4b ~]$ test 56 -gt 55 ; echo $?

    0

    paul@RHEL4b ~]$ $

    ```


    If you prefer true and false, write the test like this.


    ```

    paul@RHEL4b ~]$ test 56 -gt 55 && echo true || echo false

    true

    paul@RHEL4b ~]$ test 6 -gt 55 && echo true || echo false

    false

    ```


    The test command can be written as square brackets, the screenshot is identical
    to the one above.


    ```

    paul@RHEL4b ~]$ [ 56 -gt 55 ] echo true || echo false

    true

    paul@RHEL4b ~]$ [ 6 -gt 55 ] echo true || echo false

    false

    ```


    Below are some example tests. Take a look at **man test** to see more options
    for tests.


    | -d foo | Does the directory exist ? |

    | -e bar | Does the file exist ? |

    | \''/etc'' = \$PWD | Is the string /etc equal to the variable $PWD ? |

    | $1 = ''secret'' | Is the first parameter different from secret ? |

    | $55 -lt $bar | Is 55 less than value of $bar ? |

    | $foo -gt 1000 | Is the value of $foo greater or equal to 1000 ? |

    | "abc" < $bar | Does abc sort before the value of $bar ? |

    | -f foo | Is foo a regular file ? |

    | -r bar | Is bar a readable file ? |

    | foo -nt bar | Is file newer than file bar ? |

    | -o unset | Is the shell option unset ? |


    Tests can be combined with logical AND and OR.


    ```

    paul@RHEL4b:~$ 66 -gt 55 -a 66 -lt 500 && echo true || echo false

    true

    paul@RHEL4b:~$ 66 -gt 55 -a 660 -lt 500 && echo true || echo false

    false

    paul@RHEL4b:~$ 66 -gt 55 -a 660 -lt 5000 && echo true || echo false

    true

    ```'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# 24.2. if then else


    The if else construction is as choice. If a certain condition is met, then execute
    something, else execute something else. The example below tests whether a file
    exists, if the file exists then a proper message is echoed.


    ```

    #!/bin/bash

    if [ -f is.txt ];

    then echo is.txt exists!

    else echo is.txt not found!

    fi

    ```


    If we name the above script ''choice'', then it executes like this.


    ```

    [paul@RHEL4a scripts]$ ./choice

    isit.txt not found!

    [paul@RHEL4a scripts]$ touch isit.txt

    [paul@RHEL4a scripts]$ ./choice

    isit.txt exists!

    [paul@RHEL4a scripts]$ $

    ```


    # 24.3. if elif


    You can nest a new if inside an else elif. This is a simple example.


    ```

    #!/bin/bash

    count=42

    if [ $count -eq 42 ];

    then

    echo "42 is correct."

    elif [ $count -gt 42 ];

    then

    echo "Too much."

    else

    echo "Not enough."

    fi

    ```


    # 24.4. for loop


    The example below shows the syntax of a classical for loop in bash.


    ```

    for i in 1 2 4

    do

    echo $i

    done

    ```


    An example of a for loop combined with an embedded shell.


    ```

    #!/bin/ksh

    for counter in `seq 1 20''

    do

    echo counting from 1 to 20, now at $counter

    sleep 1

    done

    ```


    The same example as above can be written without the embedded shell using the
    bash {from..to} shorthand.'
