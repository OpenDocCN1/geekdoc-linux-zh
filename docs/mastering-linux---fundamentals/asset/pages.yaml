  md: "# 25.5. getopts script options with getopts\n\nThe getopts function allows\
    \ you to parse options given to a command. The following script allows for any\
    \ combination of the options a, f and z.\n\n```\nkahlan@solexpl1$ cat options.ksh\n\
    !/bin/ksh\n\nwhile getopts \":afz\" option;\ndo\n  case $opt in\n    a)\n    \
    \  echo received -a\n      ;;\n    f)\n      echo received -f\n      ;;\n    z)\n\
    \      echo received -z\n      ;;\n    *)\n      echo \"invalid option -$OPTARG\"\
    \n      ;;\n  esac\ndone\n```\n\nThis is that sample output from the script above.\
    \ First we use correct options, then we enter twice an invalid option.\n\n```\n\
    kahlan@solexpl1$ ./options.ksh\nkahlan@solexpl1$ ./options.ksh -af\nreceived -a\n\
    received -f\nkahlan@solexpl1$ ./options.ksh -zfg\nreceived -z\nreceived -f\ninvalid\
    \ option -g\nkahlan@solexpl1$ ./options.ksh -a -b -z\nreceived -a\ninvalid option\
    \ -b\nreceived -z\n```"
