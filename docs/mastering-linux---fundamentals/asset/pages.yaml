  md: '# 19.9. comm


    Comparing streams (files) can be done with the comm. By default comm will output
    three columns. In this example, Abba, Cure and Queen are in both lists, Bowie
    and Sweet are only in the first file, Turner is only in the second.


    ```

    paul@debian5:~/pipes$ cat list1.txt

    Abba

    Bowie

    Cure

    Queen

    Sweet

    paul@debian5:~/pipes$ cat list2.txt

    Abba

    Cure

    Queen

    Turner

    paul@debian5:~/pipes$ comm list1.txt list2.txt

    Abba

    Bowie

    Cure

    Queen

    Sweet

    Turner

    ```


    The output of comm can be easier to read when outputting only a single column.
    The digits point out which output columns should not be displayed.


    ```

    paul@debian5:~/pipes$ comm -12 list1.txt list2.txt

    Abba

    Cure

    Queen

    paul@debian5:~/pipes$ comm -13 list1.txt list2.txt

    Turner

    paul@debian5:~/pipes$ comm -23 list1.txt list2.txt

    Bowie

    Sweet

    ```'
