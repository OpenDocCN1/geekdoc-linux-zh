  md: '# # Chapter 18. I/O redirection


    One of the powers of the Unix command line is the use of **input/output redirection**
    and **pipes.**


    This chapter explains **redirection** of input, output and error streams.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# 18.1. stdin, stdout, and stderr


    The bash shell has three basic streams; it takes input from stdin (stream 0),
    it sends output to stdout (stream 1) and it sends error messages to stderr (stream
    2).


    The drawing below has a graphical interpretation of these three streams.


    ![](img/127a5ac6776c2933c37f7b2f9e005369_181_0.png)


    The keyboard often serves as stdin, whereas stdout and stderr both go to the display.
    This can be confusing to new Linux users because there is no obvious way to recognize
    stdin from stderr. Experienced users know that separating output from errors can
    be very useful.


    ![](img/127a5ac6776c2933c37f7b2f9e005369_181_1.png)


    The next sections will explain how to redirect these streams.'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# 18.2. output redirection


    # 18.2.1. > stdout


    stdout can be redirected with a greater sign. While scanning the line, the shell
    will see the > sign and will clear the file.


    ![](img/127a5ac6776c2933c37f7b2f9e005369_182_0.png)


    The > is in fact the abbreviation of 1> (stdout being referred to stream 1).


    ```

    paul@RHELv4u ~$ echo It is cold today!

    It is cold today!

    paul@RHELv4u ~$ echo It is cold today! > winter.txt

    paul@RHELv4u ~$ cat winter.txt

    It is cold today!

    paul@RHELv4u ~$

    ```


    Note that the bash shell effectively removes the redirection from the command
    line before argument 0 is executed. This means that in the case of this command:


    ```

    echo hello > greetings.txt

    ```


    the shell only counts two arguments (echo = argument 0, hello = argument 1). The
    redirection is removed before the argument counting takes places.


    # 18.2.2. output file is erased


    While scanning the line, the shell will see the > sign and will clear the file!
    Since this happens before resolving argument 0, it means that even when the command
    fails, the file will have cleared!


    ```

    paul@RHELv4u ~$ cat winter.txt

    It is cold today!

    paul@RHELv4u ~$ zcho It is cold today! > winter.txt

    -bash: zcho: command not found

    paul@RHELv4u ~$ cat winter.txt

    paul@RHELv4u ~$

    ```'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# 18.2.3. noclobber


    Erasing a file while using > can be prevented by setting the noclobber option.


    ```

    [paul@RHELv4u ~]$ cat winter.txt

    It is cold today!

    [paul@RHELv4u ~]$ set -o noclobber

    [paul@RHELv4u ~]$ echo It is cold today! > winter.txt

    -bash: winter.txt: cannot overwrite existing file

    [paul@RHELv4u ~]$ set vo noclobber

    [paul@RHELv4u ~]$

    ```


    # 18.2.4. overruling noclobber


    The noclobber can be overruled with >| .


    ```

    [paul@RHELv4u ~]$ set -o noclobber

    [paul@RHELv4u ~]$ echo It is cold today! > winter.txt

    -bash: winter.txt: cannot overwrite existing file

    [paul@RHELv4u ~]$ echo It is very cold today! > winter.txt

    [paul@RHELv4u ~]$ cat winter.txt

    It is very cold today!

    [paul@RHELv4u ~]$

    ```


    # 18.2.5. >> append


    Use >> output to a file.


    ```

    [paul@RHELv4u ~]$ echo It is cold today! > winter.txt

    [paul@RHELv4u ~]$ cat winter.txt

    It is cold today!

    [paul@RHELv4u ~]$ echo Where is the summer ? >> winter.txt

    [paul@RHELv4u ~]$ cat winter.txt

    It is cold today!

    Where is the summer =

    [paul@RHELv4u ~]$

    ```'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# 18.3. error redirection


    # 18.3.1. 2> stderr


    Redirecting stderr is done with 2>. This can be very useful to prevent error messages
    from cluttering your screen.


    ![](img/127a5ac6776c2933c37f7b2f9e005369_184_0.png)


    The screenshot below shows redirection of stdout to a file, and stderr to /dev/null.
    Writing 1 is the same as >.


    ```

    [paul@RHELv4u3 ~]$ find / allfiles.txt 2> /dev/null

    [paul@RHELv4u3 ~]$

    ```


    # 18.3.2. 2>&1,


    To redirect stdout and stderr to the same file, use 2>&1.


    ```

    [paul@RHELv4u3 ~]$ find / allfiles_and_errors.txt 2>&1

    [paul@RHELv4u3 ~]$

    ```


    Note that the order of redirections is significant. For example, the command


    ```

    ls > dirlist 2>&1

    ```


    directs both standard output (file descriptor 1) and standard error (file descriptor
    2) to the file dirlist, while the command


    ```

    ls 2>&1 > dirlist

    ```


    directs only the standard output to file dirlist, because the standard error made
    a copy of the standard output before the standard output was redirected to dirlist.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# # 18.4. output redirection and pipes


    By default you run grep inside stderr when using pipes on the command line, because
    only stdout is passed.


    ```

    ```

    ppaul@debian7:-$ rm file42 file33 file1201 | grep file42

    rm: cannot remove ''file42'': No such file or directory

    rm: cannot remove ''file33'': No such file or directory

    rm: cannot remove ''file1201'': No such file or directory

    ```

    ```


    With 2+& you can force stderr to go stdout. This enables the next command in the
    pipe to act on both.


    ```

    ```

    paul@debian7:-$ rm file42 file33 file1201 2>&1 | grep file42

    rm: cannot remove ''file42'': No such file or directory

    ```

    ```


    You cannot use both 1>&2 and 2>&1 to switch stdout and stderr.


    ```

    ```

    paul@debian7:-$ rm file42 file33 file1201 2>&1 1>&2 | grep file42

    rm: cannot remove ''file42'': No such file or directory

    paul@debian7:-$ echo file42 1>&2 2>&3 | sed ''s/file42/FILE42/''

    file42

    ```

    ```


    You need a third stream to switch stdout and stderr after a pipe.


    ```

    ```

    paul@debian7:-$ rm file42 3>&1 2>&3 | sed ''s/file42/FILE42/''

    file42

    paul@debian7:-$ echo file42 3>&1 1>&2 | sed ''s/file42/FILE42/''

    rm: cannot remove ''FILE42'': No such file or directory

    ```

    ```


    # # 18.5. joining stdout and stderr


    The & construction will put stdout and stderr in one stream (to a file).


    ```

    ```

    paul@debian7:-$ rm file42 &> out_and_err

    paul@debian7:-$ cat out_and_err

    rm: cannot remove ''file42'': No such file or directory

    paul@debian7:-$ echo file42 &> out_and_err

    paul@debian7:-$ cat out_and_err

    file42

    ```

    ```'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# # 18.6. input redirection


    # ## 18.6.1. < stdin


    Redirecting stdin is done with < (short for 0<),


    ```

    [paul@RHEL4b ~]$ cat < text.txt

    one

    two

    [paul@RHEL4b ~]$ tr ''onetw'' ''ONEZZZ'' < text.txt

    ONE

    ZZO

    [paul@RHEL4b ~]$ <<

    ```


    # ## 18.6.2. << here document


    The here document (sometimes called here-is-document) is a way to append input
    until a certain sequence (usually EOF) is encountered. The EOF marker can be typed
    literally or can be called with Ctrl-D.


    ```

    [paul@RHEL4b ~]$ cat <<EOF > text.txt

    >one

    two

    > EOF

    [paul@RHEL4b ~]$ cat text.txt

    >one

    two

    [paul@RHEL4b ~]$ cat <<brol > text.txt

    >brel

    > brol

    [paul@RHEL4b ~]$ cat text.txt

    >brel

    [paul@RHEL4b ~]$ <<<

    ```


    # ## 18.6.3. << here string


    The here string can be used to directly pass strings to a command. The result
    is the same as echo string | command (but you have one less process running).


    ```

    paul@ubulli110-$ base64 << linux-training.be

    BGludXgtdHJHaW5pbmcuYmUK

    paul@ubulli110-$ base64 -d <<< bGludXgtdHJHaW5pbmcuYmUK

    linux-training.be

    ```


    See rfc 3548 for more information about base64.'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# 18.7. confusing redirection


    The shell will scan the line before for applying redirection. The following command
    line is very readable and correct.


    ```

    cat winter.txt > snow.txt 2> errors.txt

    ```


    But this one is also correct, but less readable.


    ```

    2> errors.txt cat winter.txt > snow.txt

    ```


    Even this will be understood perfectly by the shell.


    ```

    < winter.txt > snow.txt 2> errors.txt cat

    ```


    # 18.8. quick file clear


    So what is the quickest way to clear a file ?


    ```

    >foo

    ```


    And what is the quickest way to clear a file when the noclobber option is set
    ?


    ```

    >|bar

    ```'
  merge: -1
  pgno: 187
