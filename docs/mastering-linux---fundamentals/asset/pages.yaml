- img_proc: true
  md: '# 20.7. gzip - gunzip


    Users never have enough disk space, so compression comes in handy. The gzip command
    can make files take up less space.


    ```

    paul@rhel55 $ ls -lh text.txt

    -rw-r-- 1 paul 6.4M Apr 17 13:11 text.txt

    paul@rhel55 $ ~ gzip text.txt

    paul@rhel55 $ ls -lh text.gz

    -rw-r-- 1 paul 760K Apr 17 13:11 text.txt.gz

    ```


    You can get the original back with gunzip.


    ```

    paul@rhel55 $ gunzip text.txt.gz

    paul@rhel55 $ ls -lh text.txt

    -rw-r-- 1 paul 6.4M Apr 17 13:11 text.txt

    ```


    # 20.8. zcat - zmore


    Text files that are compressed with gzip can be viewed with zcat and zmore.


    ```

    paul@rhel55 $ head -4 text.txt

    /

    /opt

    /opt/VBoxGuestAdditions-3.1.6

    /opt/VBoxGuestAdditions-3.1.6/routines.sh

    paul@rhel55 $ gzip text.txt

    paul@rhel55 $ zcat text.txt.gz | head -4

    /

    /opt

    /opt/VBoxGuestAdditions-3.1.6

    /opt/VBoxGuestAdditions-3.1.6/routines.sh

    ```'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# 20.9. bzip2 - bunzip2


    Files can also be compressed with bzip2 which takes a little more time than gzip,
    but compresses better.


    ```

    paul@rhel55 $ ~ bzip2 text.txt

    paul@rhel55 $ ~ ls -lh text.txt.bz2

    --rw-rw-r-- 1 paul 569K Apr 17 13:11 text.txt.bz2

    ```


    Files can be uncompressed again with bzip2.


    ```

    paul@rhel55 $ ~ bzip2 text.txt.bz2

    paul@rhel55 $ ~ ls -lh text.txt.bz2

    --rw-rw-r-- 1 paul 6.4M Apr 17 13:11 text.txt

    ```


    # 20.10. bzcat - bzmore


    And in the same bzcat and bzmore can display files compressed with bzip2.


    ```

    paul@rhel55 $ ~ bzip2 text.txt

    paul@rhel55 $ ~ bzcat text.txt.bz2 | head -4


    /opt

    /opt/VBoxGuestAdditions-3.1.6

    /opt/VBoxGuestAdditions-3.1.6/routines.sh

    ```'
