    The first find will output all *.odf filenames in **/data** and all subdirectories.
    The shell will redirect this to a file.


    The second will output all files **.odf in /data** and will also output all files
    that exist in directories named ***odf (in /data)**


    With two million command line would be expanded beyond the maximum that the shell
    can accept. The last part of the command line would be:


