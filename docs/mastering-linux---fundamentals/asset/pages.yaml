    real       0m.014s

    user       0m.008s

    sys        0m.006s

    ```


    The **sleep** 5 command takes five **real** seconds to execute, but consumes little
    **cpu time.**


    ```

    paul@rhe155 ~$ sleep 5


    real       0m.018s

    user       0m.005s

    sys        0m.011s

    ```


    This **bzip2** command compresses a file and uses a lot of **cpu time.**


    ```

    paul@rhe155 ~$ bzip2 text.txt


