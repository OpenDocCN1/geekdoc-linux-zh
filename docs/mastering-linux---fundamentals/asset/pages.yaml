    # 28.14: solution: user management


    +   1. Create a user account named serena, including a home directory and a description
    (or comment) that reads Serena Williams. Do all this in one single command.


    ```

    root@debian:~# useradd -m c ''Serena Williams'' serena

    ```


    +   2. Create a user named venus including home directory, bash shell, a description
    that reads Venus Williams in all one single command.


    ```

    root@debian:~# useradd -m c "Venus Williams" -s /bin/bash venus

    ```


    +   3. Verify that both users have correct entries in /etc/passwd, /etc/shadow
    and /etc/group.


    ```

    root@debian:~# tail -2 /etc/passwd

    serena:1008:1010:Serena Williams:/home/serena:/bin/sh

    venus:1009:1010:Venus Williams:/home/venus:/bin/sh

    root@debian:~# tail -2 /etc/shadow

    serena::1638:9999:7::nvenus::1638:9999:7::nroot@debian:~# tail -2 /etc/group

    drwxr-xr-x 2 serena serena 4096 Oct 15 10:50 serena

    drwxr-xr-x 2 venus venus 4096 Oct 15 10:59 venus

    root@debian:~#nserena:x011

    ```


    +   4. Verify that the home directory was created.


    ```

    root@debian:~# ls -l /home | tail -2

    drwxr-xr-x 2 serena serena 4096 Oct 15 10:50 serena

    drwxr-xr-x 2 venus venus 4096 Oct 15 10:59 venus

    root@debian:~#

    ```


    +   5. Create a user named einstime with /bin/date as his default logon shell.


    ```

    root@debian:~# useradd -s /bin/date einstime

    ```


    Or even better:


    ```

    root@debian:~# useradd -s $(which date) einstime

    ```


    7. What happens when you log on with the einstime user ? Can you think of a useful
    real example for changing a user''s login shell to an application ?


    ```

    root@debian:~# su einstime

    Wed Oct 15 11:05:56 UTC 2014 # You get the output of the date command

    root@debian:~#

    ```


    It can be useful when users need to access only one application on the server.
    Just logging opens the application for them, and closing the application automatically
    logs them out.'
