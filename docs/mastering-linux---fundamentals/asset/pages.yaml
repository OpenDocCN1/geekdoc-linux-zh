- img_proc: true
  md: '# # 10.3. cat


    The **cat** command is one of the most universal tools, yet all it does **standard
    input to standard output**. In combination with the shell this can be very powerful
    and diverse. Some cases will give a glimpse into the possibilities. The first
    example is: you can use cat to display a file on the screen. If the file is long,
    it will scroll to the end.


    ```

    $cat /etc/resolv.conf

    domain linux-training.be

    search linux-training.be

    nameserver 192.168.1.42

    ```


    # # 10.3. concatenate


    cat is short for **concatenate**. One of the basic uses of cat is to concatenate
    files into a bigger (or complete) file.


    ```

    $ echo one1

    $ echo two2

    $ echo three3

    $ cat part1

    one

    $ cat part2

    two

    $ cat part3

    three

    $ cat part1 part2 part3

    one

    two

    three

    $ cat part1 part2 part3 >all

    one

    two

    three

    paul@debian:~$

    ```


    # # 10.3.2. create files


    You can use **cat** to create flat text files. Type the **cat > winter.txt** command
    as shown in the screenshot below. Type one or more lines, finishing each line
    with the enter key. After the last line, type and hold the Control (Ctrl) key
    and press d.


    ```

    $ cat > winter.txt

    It is very cold!

    $ cat winter.txt

    It is very cold!

    paul@debian:~$

    ```


    The **Ctrl d** key combination will send an EOF (End of File) to the running process
    ending the **cat** command.'
