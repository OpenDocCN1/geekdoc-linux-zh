  md: "# 21.3.3. well known syntax\n\nThe most common use of the rename is to search\
    \ for filenames matching a certain string\n replacing this string with another\
    \ string.\n\nThis is often presented as s/string/other/string/ as seen in this\
    \ example:\n\n```\n$ ls\nabc allfiles.TXT bfiles.TXT Scratch tennis2.TXT\nabc\
    \ backup clfiles.TXT temp.TXT tennis.TXT\npaulpi ~ $ ls\npaulpi ~ $ rename 's/txt//*'\n\
    abc allfiles.text bfiles.text Scratch tennis2.text\nabc.conf backup clfiles.text\
    \ temp.text tennis.text\n```\n\nAnd here is another example that uses rename with\
    \ the well know syntax to change the\nextensions of the same files once more:\n\
    \n```\n$ ls\nabc allfiles.txt bfiles.txt Scratch tennis2.txt\nabc.conf backup\
    \ clfiles.txt temp.txt tennis.txt\npaulpi ~ $ ls\npaulpi ~ $ rename 's/txt//*'\
    \ .txt\nls\nabc allfiles.txt bfiles.txt Scratch tennis2.txt\nabc.conf backup clfiles.txt\
    \ temp.text tennis.txt\npaulpi ~ $\n```\n\nThese two examples appear to work because\
    \ the strings we used only exist at the end of the\nfilename. Remember that file\
    \ extensions have no meaning in the bash shell.\n\nThe next example shows what\
    \ can go wrong with this syntax.\n\n```\n$ touch atxt.txt\npaulpi ~ $ rename 's/txt/problem/'\
    \ atxt.txt\n$ ls\nabc allfiles.txt backup clfiles.txt temp.txt tennis.txt\nabc.conf\
    \ aproblem.txt bfiles.txt Scratch tennis2.txt\npaulpi ~ $\n```\n\nOnly the first\
    \ occurrence of the searched string is replaced."
