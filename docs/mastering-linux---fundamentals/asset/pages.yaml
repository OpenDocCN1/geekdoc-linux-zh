  md: '# # 19.8. uniq


    With **uniq** you can remove duplicates from a *sorted* list.


    ```

    paul@debian5:~/pipes$ cat music.txt

    Queen

    Brel

    Abba

    Queen

    paul@debian5:~/pipes$ sort music.txt

