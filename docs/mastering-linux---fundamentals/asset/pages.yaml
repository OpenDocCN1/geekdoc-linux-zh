  md: '# Chapter 27. introduction to users


    This little chapter will teach you how to identify your user account on a Unix
    computer using commands like who am i, id, and more.


    In a second part you will learn how to become another user with the su command.


    And you will learn how to run a program as another user with sudo.'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# 27.1. whoami


    The **whoami** command tells you your username.


    ```

    paul@centos7 ~$ whoami

    paul

    paul@centos7 ~$

    ```


    # 27.2. who


    The **who** command will give you information about who is logged on the system.


    ```

    paul@centos7 ~$ who

    root    pts/0    2014-10-10 23:07 (10.104.33.301)

    paul    pts/1    2014-10-10 23:30 (10.104.33.301)

    laura   pts/2    2014-10-10 23:34 (10.104.33.96)

    tania   pts/3    2014-10-10 23:39 (10.104.33.911)

    paul@centos7 ~$

    ```


    # 27.3. am i


    With **am i** the command will display only the line pointing to your current
    session.


    ```

    paul@centos7 ~$ am i

    paul    pts/1    2014-10-10 23:30 (10.104.33.101)

    paul@centos7 ~$

    ```


    # 27.4. w


    The **w** command shows you who is logged on and what they are doing.


    ```

    paul@centos7 ~$ w

    23:34:07 up 31 min, load average: 0.00, 0.01, 0.02

    USER     TTY     LOGIN   IDLE   JCPU    CPU     WHAT

    root     pts/0    15.00s  0.01s   0.1s top

    paul     pts/1    23:30  7.00s   0.00s  w

    paul@centos7 ~$

    ```


    # 27.5. id


    The **id** command will give you user id, primary group id, and a list of the
    groups that you belong to.


    ```

    paul@debian:-$ id

    uid=1000 (paul) gid=1000 (paul) groups=1000 (paul)

    ```


    On RHEL/CentOS you will also get **SELinux** context information with this command.


    ```

    root@centos7 ~$ id

    uid=0 (root) gid=0 (root) context=unconfined_u:unconfined_r\nunconfined_t:s0-s0:c0.1023

    ```'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# 27.6. su to another user


    The su command allows a user to run a shell as another user.


    ```

    laura@debian7:~$ su tania

    Password:

    tania@debian7:/home/laura$

    ```


    # 27.7. su to root


    You can also use su to become root, when you know the root password.


    ```

    laura@debian7:~$ su root

    Password:

    root@debian7:/home/laura#

    ```


    # 27.8. su as root


    You need to know the password of the user you want to substitute, unless you are
    logged in root. The root user can become any existing user without knowing that
    user''s password.


    ```

    root@debian7:~# id

    uid=0 (root) gid=0 (root) groups=0(root)

    root@debian7:~# su - valentina

    valentina@debian7:~$

    ```


    # 27.9. su - $username


    By default, the su command maintains the same shell environment. To become another
    user and also get the target''s environment, issue the su - command followed by
    the target username.


    ```

    root@debian7:~# su laura

    laura@debian7:/root$ exit

    root@debian7:~# su - laura

    laura@debian7:~$ pwd

    /home/laura

    ```


    # 27.10. su -


    When no username is provided to su or su -, the command will assume root is the
    target.


    ```

    tania@debian7:~$ su -

    Password:

    root@debian7:~#

    ```'
  merge: -1
  pgno: 277
- img_proc: true
  md: "# 27.11. run a program as another user\n\nThe sudo program allows a user to\
    \ start a program with the credentials of another user. Before this works, the\
    \ system administrator has to set up the /etc/sudoers file. This can be useful\
    \ to delegate administrative tasks to another user (without giving the root password).\n\
    \nThe screenshot below shows the usage of sudo. User paul received the right to\
    \ run useradd with the credentials of root. This allows paul to create new users\
    \ on the system without becoming root without knowing the root password.\n\nFirst\
    \ the command fails for paul.\n\n```\npaul@debian7:-$ /usr/bin/useradd -m valentina\n\
    useradd: Permission denied.\nuseradd: cannot lock /etc/passwd; try again later.\n\
    ```\n\nWith sudo it works.\n\n```\npaul@debian7:-$ sudo /usr/bin/useradd -m valentina\n\
    [sudo] password for paul:\npaul@debian7:--$\n```\n\n# 27.12. visudo\n\nCheck the\
    \ man page of visudo before playing with the /etc/sudoers file. Editing the sudoers\
    \ is out of scope for this fundamentals book.\n\n```\npaul@rhel65:-$ apropos visudo\n\
    visudo\t(8) - edit the sudoers file\npaul@rhel65:--$\n```"
  merge: -1
  pgno: 278
- img_proc: true
  md: '# #27.13. sudo su -


    Some Linux systems like Ubuntu and Xubuntu, the **root** user does not have a
    password set. This means that it is not possible to login as **root** (extra security).
    To perform tasks as **root**, the first user is given all **sudo rights** via
    the `/etc/sudoers`. In fact all users that are members of the admin group can
    use sudo to run all commands as root.


    ```

    root@laika:~# grep admin /etc/sudoers

    # Members of the admin group may gain root privileges

    %admin ALL=(ALL) ALL

    ```


    The result of this is that the user can type **sudo su** and become root without
    having to enter the root password. The sudo command requires you to enter your
    own password. The password prompt in the screenshot below is for sudo, not for
    su.


    ```

    paul@laika:-$ sudo su

    Password:

    root@laika:-#

    ```


    # #27.14. sudo logging


    Using sudo without authorization will result in a severe warning:


    ```

    paul@rhel65:-$ sudo su

    ```


    We trust you have received the usual lecture from the local System Administrator.
    It usually downs to these three things:


    +   - #1) Respect the privacy of others.

    - #2) Think before you type.

    - #3) With great power comes great responsibility.


    ```

    [sudo] password for paul:

    paul is not in the sudoers file. This incident will be reported.

    paul@rhel65:-$

    ```


    The root user can see this in the `/var/log/secure` on Red Hat and in `/var/log/auth.log`
    for Debian.


    ```

    root@rhel65:-# tail /var/log/secure | grep sudo | tr -s '' ''

    Apr 13 16:03:42 rhel65: paul: USER NOT in sudoers ; TTY=pts/0; PWD=\/home/paul;
    USER=root; COMMAND=/bin/su -

    root@rhel65:-#

    ```'
  merge: -1
  pgno: 279
- img_proc: true
