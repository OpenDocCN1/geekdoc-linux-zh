- img_proc: true
  md: '# # 11.7. in memory directories


    # ## 11.7.1./dev


    Device files in dev appear to be ordinary files, but are not actually located
    on the hard disk. The /dev directory is populated with files as the kernel is
    recognising hardware.


    # ## common physical devices


    Common hardware such as hard disk devices are represented by device files in /dev.
    Below a screenshot of SATA devices on a laptop and IDE attached drives on a desktop.
    (The detailed meaning of these devices will be discussed later.)


    ```

    # SATA or SCSI or USB

    # paul@laika:-$ ls /dev/sd*

    /dev/sda /dev/sda1 /dev/sda2 /dev/sda3 /dev/sdb /dev/sdb1 /dev/sdb2


    # IDE or ATAPI

    # paul@barry:-$ ls /dev/hd*

    /dev/hda /dev/hda1 /dev/hda2 /dev/hdb /dev/hdb1 /dev/hdb2 /dev/hdc

    ```


    Besides representing physical hardware, some device files are special. These special
    devices can be very useful.


    # ## /dev/tty and /dev/pts


    For example, /dev/tty1 represents a terminal or console attached to the system.
    (Don''t break your head on the exact terminology of ''terminal'' or ''console'',
    what we mean is a command line interface.) When typing commands in a terminal
    that is part of a graphical interface like Gnome or KDE, then your terminal will
    be represented as /dev/pts/1 (can be another number.)


    # ## /dev/null


    On Linux you will find other special devices as /dev/null which can be considered
    a black hole; it has unlimited storage, but nothing can be retrieved from it.
    Technically speaking, anything written to /dev/null will be discarded. /dev/null
    can be useful to discard unwanted output from commands. /dev/null is not a good
    location to store your backups (-).


    # ## 11.7.2./proc conversation with the kernel


    /proc is another special directory, appearing to be ordinary files, but not taking
    up disk space. It is actually a view of the kernel, or better, what the kernel
    manages, and is a means to interact with it directly. /proc is a filesystem.


    ```

    paul@RHELv4:-$ -t proc

    ```'
  merge: -1
  pgno: 118
