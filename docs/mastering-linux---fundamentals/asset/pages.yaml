- img_proc: true
  md: '# 29.1. passwd


    Passwords of users can be set with the passwd command. Users will have to provide
    the old password before twice entering the new one.


    ```

    [tania@centos ~]$ password

    Changing password for user tania.

    Changing password for tania.

    (current) UNIX password:

    New password:

    BAD PASSWORD: The password is shorter than 8 characters

    New password:

    BAD PASSWORD: The password is a palindrome

    New password:

    BAD PASSWORD: The password is too similar to the old one

    passwd: Have exhausted maximum number of retries for service

    ```


    As you can see, the passwd tool will do some basic verification to prevent users
    from using too simple passwords. The root user does not have to follow these rules
    (there will be a warning though). The root user also does not have to provide
    the old password before entering the new password twice.


    ```

    root@debian:~# password tania

    Enter new UNIX password:

    Retype new UNIX password:

    passwd: password updated successfully

    ```


    # 29.2. shadow file


    User passwords are encrypted in /etc/shadow. The /etc/shadow file is read only
    and can only be read by root. We will see in the file permissions section how
    it is possible for users to change their password. For now, you will have to know
    that users can change their password with the usr/bin/passwd command.


    ```

    [root@centos ~]# tail -4 /etc/shadow

    passwd=$61k2Xta5S.Tml_p2S3Jv73JIJOYNYQqMpWXLJqoGJbVsZG5/Pti8ovBRD.VbRIDS17TEQ/

    IASMH.TEKB.BntKS3/S1Jru8$fffCOJ98M.KAEW45YzQu::99999:7999:

    tania:$6B8EZ/ZobY79qG878IKR8m.K4EW45YzQu5z59NNvyJja9L5XqVzZ4D1pvmRE8H

    eQQsvGqRnRKVI17H7ST.C790QD0:16350:99999:7999:

    laura:$6A4lG5pGff9V96669G6tXtfCoFJYn8nbThPwfXQJm

    Syh1wc6763995S4.w24r3UZAB0M:16350:99999:7999:

    valina:$6Y3zRA6P511qE68n9mBJ6K4R4c66L8hh.vaigqUvrevill71

    6XROUDAK552nh8mEt2gOutnf/v0:16350:7999:

    [root@centos ~]#

    ```


    The /etc/shadow file contains several columns. The nine fields from left to right
    are the username (note that only inqui and laura have an encrypted password),
    the day the password was last changed (day 1 is January, 1970), number of days
    before the password must be left unchanged, password expiry day, warning number
    of days before password expiry, number of days after expiry before disabling the
    account, and the day account was disabled (again, since 1970). The last field
    has no meaning yet.


    All the passwords in the screenshot are hashes of hunter2.'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# 29.3. encryption with passwd


    Passwords are stored in an encrypted format. This encryption is done by the crypt
    function. The easiest (and recommended) way to add a user with a password to the
    system is to add the user with the useradd -m command, and then set the user''s
    password with passwd.


    ```

    [root@RHEL4 ~]# useradd -m xavier

    [root@RHEL4 ~]# passwd xavier

    Changing password for user xavier.

    New UNIX password:

    Retype new password:

    password: all authentication tokens updated successfully.

    [root@RHEL4 ~]#

    ```


    # 29.4. encryption with openssl


    Another way to create users with a password is to use the -p option of useradd,
    but that option requires an encrypted password. You can generate this encrypted
    password with the openssl command


    The openssl passwd command will generate several distinct hashes for the same
    password, for this it uses a salt.


    ```

    paul@rhel65:-$ openssl passwd hunter 2

    86cjUN1GDfPY

    paul@rhel65:-$ openssl passwd hunter 2

    jYm33GoDbKA

    paul@rhel65:-$ openssl passwd hunter 2

    YgQjCeGoDbZKA

    paul@rhel65:-$

    ```


    This salt can be chosen and is visible as the first two characters of the hash.


    ```

    paul@rhel65:-$ openssl passwd -salt 42 hunter 2

    42ZrbtPze8G.

    paul@rhel65:-$ openssl passwd -salt 42 hunter 2

    42ZrbtPze8G.

    paul@rhel65:-$ openssl passwd -salt 42 hunter 2

    42ZrbtPze8G.

    paul@rhel65:--$

    ```


    This example shows how to create a user with password.


    ```

    root@rhel65:-# useradd -m -p $(openssl passwd hunter 2) mohamed

    ```


    Note that this command puts the password in your command history!'
  merge: -1
  pgno: 293
- img_proc: true
  md: "# 29.5. encryption with crypt\n\nA third option is to create your own C program\
    \ using the crypt function, and compile this into a command.\n\n```\npaul@rhel65:~\
    \ cat MyCrypt.c\n#include <stdio.h>\n#define __USE_KOPEN\n#include <unistd.h>\n\
    \nint main(int argc, char **argv) {\n    if (argc==3)\n    {\n        printf(\"\
    %s\\n\", crypt(argv[1],argv[2]));\n    }\n    else\n    {\n        printf(\"Usage:\
    \ MyCrypt $password $salt\\n\");\n    }\n    return 0;\n}\n```\n\nThis little\
    \ program can be compiled with gcc -o MyCrypt like this.\n\n```\npaul@rhel65:~\
    \ gcc MyCrypt.c -o MyCrypt -lcrypt\n```\n\nTo use it, we two parameters to MyCrypt.\
    \ The first is the unencrypted password, the second is the salt. The salt is used\
    \ to perturb the encryption algorithm in one of 4096 different ways. This variation\
    \ prevents users with the same password from having the same entry in etc/shadow.\n\
    \n```\npaul@rhel65:~ ./MyCrypt hunter2 42\n42zrtP1eG.\npaul@rhel65:~ ./MyCrypt\
    \ hunter2 33\n33dctaYSIEUXI\n```\n\nDid you notice the first two characters of\
    \ the password are the salt?\n\nThe standard output of the crypt function is the\
    \ DES algorithm which is old and can be created in minutes. A better method is\
    \ to use md5 passwords which can be recognized by a salt starting with $1.\n\n\
    ```\npaul@rhel65:~ ./MyCrypt hunter2 '$1$42'\n$42S276jY3TS2Z8XZmrtDOF9f0\npaul@rhel65:~\
    \ ./MyCrypt hunter2 '$1$62'\n$62S20qFFFAn13TSGY01WT2Xpqqczlop78wpGILLELESNBiMr4w60vXL1Kda./UpwXfrFkli...\n\
    ```\n\nThe md5 salt can be up to eight characters. The salt is displayed in /etc/shadow\
    \ between the second and third $, so never use the password as the salt!\n\n```\n\
    paul@rhel65:~ ./MyCrypt '$1$hunter2'\n$1$hunter2YVXxrDmidq7XfGdt6M2.\n```"
