    \ www.example.com`。我们将在后面的章节中回到这里。\n\n我们需要更新的是 `DocumentRoot` 行和 `ServerAdmin`\
    \ 行。你可以在 `ServerAdmin` 行中输入你的电子邮件地址。\n\n将 `DocumentRoot` 更改为：`/var/www/wordpress`\n\
    \n完成后，配置应该像下一页所示。\n\n**000-default.conf (更新后)**\n```apache\n<VirtualHost *:80>\n\
    \    #ServerName www.example.com\n    ServerAdmin info@nathanneil.com\n    DocumentRoot\
    \ /var/www/wordpress\n    ErrorLog ${APACHE_LOG_DIR}/error.log\n    CustomLog\
    \ ${APACHE_LOG_DIR}/access.log combined\n</VirtualHost>\n```\n\n更改完成后，使用 `control`\
    \ 和 `x` 退出。按 `Y` 和 `Enter` 保存更改。\n\n在我们回到讨论更改权限之前，我们应该考虑如何启用和禁用站点配置。\n\n### 禁用站点配置\n\
    \n| 命令 | 结果 |\n| :--- | :--- |\n| `sudo a2dissite 000-default.conf` | 系统将禁用 000-default\
