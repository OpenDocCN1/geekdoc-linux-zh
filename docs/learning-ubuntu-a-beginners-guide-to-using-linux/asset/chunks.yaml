    # Chapter 1


    ## What is Linux & Ubuntu?

    You may be familiar with Microsoft Window’s and Apple’s MacOSX. Both of these
    are examples of operating systems.


    Merriam-Webster defines operating system as the main program in a computer that
    controls the way the computer works and makes it possible for other programs to
    function.


    Essentially, the operating system is the program that lets you interact with a
    computer, and the computer to understand what you want to do. It goes deeper than
    that, but I want to keep this topical.


    Linux is an open-source operating system. Being open-source is a major difference
    between Linux and the other popular operating systems. Open-source means that
    the software is provided with the original source code and is made freely available
    to be redistributed and modified. This is what makes Linux unique. It has a strong
    community out there modifying the code, participating in forums, and fixing bugs
    much quicker than the alternatives.


    If you are looking to add a new skill to your portfolio, learning how to use Linux,
    can be very useful. According to ZDNet in 2014, 87% of enterprise businesses added
    at least one Linux server and 82% planned on adding more in 2015. Linux and its
    distributions are very popular for database, web, and other types of servers.


    A distro or distribution is a version of Linux that uses the Linux kernel as its
    foundation. There are hundreds of Linux distros, with most all being free. Ubuntu
    is a distro of Linux, which is distributed by a company called Canonical. They
    provide the operating system for free, but charge for commercial support of the
    product. Nearly a quarter of servers running Linux, are using Ubuntu. This makes
    it a great choice for your first Linux experience.


    ## What Do I Need to Get Started?

    The tools that you will need, vary on the route that you would like to go. There
    are four methods, that you could use to experiment with the lessons in this book.
    One of them, I prefer over the other two options, especially if you are still
    new to the process. Let’s skim over the first three and focus on the forth, which
    is my preferred method for those of you reading this book.


    The first three methods, that you could use to experiment with the lessons in
    this book, would require you to manually setup it. Before we talk about these
    methods to get started, lets first go over the version of Ubuntu that we will
    be using. This book, while it can apply to other versions, is best suited for
    Ubuntu 14.04 LTS. LTS stands for Long Term Support. That means it has support
    from Canonical for updates for five years. Many people do not realize that an
    operating system’s support expires. Once the support expires, there may not be
    security patches and other upgrades available. In my book [Securing Business Data:
    Establishing a Core Value for Data Security](http://www.amazon.com/gp/product/B016PMLIW0),
    we talk about operating system more in depth. If you work with technology or manage
    a business, I highly recommend that you read it.


    Ubuntu 15.10 is also out now, but it is not an LTS version. I prefer to work with
    versions that have long term support.


    Ubuntu 14.04 LTS is certified for AWS, Microsoft Azure, Joyent, IBM, and the HP
    Cloud. It is also supported by nearly all VPS providers. VPS stands for Virtual
    Private Server. A Virtual Private Server is a machine sold as a hosting service
    and is often more affordable than purchasing a server and the bandwidth that it
    requires. With the popularity of cloud based services, many businesses now run
    more virtual private servers in order to conserve costs and scale more quickly.
    With a VPS you pay for what you need to use and can add more resources overtime,
    if you need more processing power or memory.


    The one thing that I like about Ubuntu 14.04 LTS is that it has updates to popular
    packages, many of which we will go over in this book. Ubuntu 14.04 LTS can also
    be installed on most devices, supporting: x86, x86-64, ARM v7, ARM64, and Power.
    If you are not sure what those things mean that is fine, but you can be confident
    in knowing that Ubuntu supports most devices, which is a huge advantage.


    For the first three methods to setup Ubuntu, you will need to download the iso
    file. An iso is the file extension used for files that can be burned to a CD or
    DVD, depending on the size. Essentially it is an image of the disc that you will
    need to install Ubuntu.


    You can download Ubuntu server by going to:

