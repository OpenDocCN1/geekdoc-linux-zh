    ### 使用 Nano 创建和编辑文件


    `nano` 是 Linux 系统命令行界面（CLI）中一个非常有用的文本编辑器。由于我们使用的是 CLI，`nano` 是面向键盘的，使用控制键而不是鼠标。通过学习一些控制键，你将能够从
    `nano` 编辑器快速编辑文件。一旦你掌握了这些并学习了更多如何通过命令行使用 Linux，你就可以转向更高级的编辑器，如 `vi`，它们非常棒，但通常学习曲线更陡峭。


    `nano` 易于使用，非常适合初学者。它通常在 Ubuntu 和其他发行版中默认安装，并与命令行中的 `sudo` 配合得很好。它是一个 WYSIWYG
