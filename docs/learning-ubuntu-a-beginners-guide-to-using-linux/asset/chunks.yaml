    \ |\n\n| Result | System will create a child directory called documents |\n\n\
    | CLI Display | milo@ubuntu:~$ mkdir documentsmilo@ubuntu:~$ |\n\nUse the ls command\
    \ to list the contents of our home directory and see if the directory ‘documents’\
    \ is there.\n\n| List Files |\n\n| Command | ls |\n\n| Result | Lists the files\
    \ in the current directory |\n\n| CLI Display | milo@ubuntu:~$ lsdocuments |\n\
    \nFrom using ls, we now see that our directory is empty outside of the directory\
    \ ‘documents’.\n\nLet’s use what we have learned from the previous chapters to\
    \ practice our navigation skills and go into the documents directory.\n\nTry using\
    \ the command: cd Documents\n\nYou may notice that it returns, “cd: Documents:\
    \ No such file or directory.”  Linux is case sensitive, which means that ‘Documents’\
    \ and ‘documents’ are two separate things.  You will want to keep that in mind\
    \ as you use Ubuntu, since using the correct case matters.\n\nNow let’s do it\
    \ the right way.\n\n| Change to a Child Directory |\n\n| Command | cd documents\
    \ |\n\n| Result | Changes to the documents directory |\n\n| CLI Display | milo@ubuntu:~$\
    \ cd documentsmilo@ubuntu:~/documents$ |\n\nUse the ls command to list the files\
    \ in the directory, you’ll notice that it is empty.\n\nNow let’s go back home\
    \ by using, cd.\n\n| Change to User Home Directory |\n\n| Command | cd |\n\n|\
    \ Result | Changes to user’s home directory |\n\n| CLI Display | milo@ubuntu:~/documents$\
    \ cdmilo@ubuntu:~$ |"
